translation:
  language: en
  text: 'Jesus says, “If the people who lead you say, ‘Look, the kingdom is in the sky,’ then the birds will get there before you. If they say to you, ‘It is in the sea,’ then the fish will get there before you. Instead, the kingdom is inside you and outside you.


    “When you come to know yourselves,[a] you will be known.[b] Then you will realize that you are the children of the living Father. But if you do not know yourselves, you live in poverty—and you yourselves are poverty.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Every form of “you” in this saying addresses more than one person.
    reason: source_note
  - marker: b
    text: The Coptic leaves unnamed who will know you.
    reason: source_note
simplification_decisions:
- pob_phrase: those who lead you
  simplified_phrase: the people who lead you
  preserved_meaning: The leaders are people, without implying that they lead anyone astray.
  reasoning_layer_used: POB lexical decision for ⲥⲱⲕ
  rationale: “People” makes the unnamed subject clear without adding a negative judgment.
- pob_phrase: the birds of the sky will precede you
  simplified_phrase: the birds will get there before you
  preserved_meaning: Birds would reach the supposed sky-location of the kingdom before the hearers.
  reasoning_layer_used: POB lexical decisions and immediate parallelism
  rationale: The common idiom preserves the bird image while making the spatial point clear.
- pob_phrase: the fish will precede you
  simplified_phrase: the fish will get there before you
  preserved_meaning: Fish would reach the supposed sea-location of the kingdom before the hearers.
  reasoning_layer_used: POB lexical decisions and immediate parallelism
  rationale: Matching the first condition keeps the saying’s sharp parallel structure.
interpretive_expansions:
- pob_phrase: the birds of the sky will precede you; the fish will precede you
  rendering: the birds will get there before you; the fish will get there before you
  claim: The creatures would reach the proposed locations before the hearers.
  evidence:
  - Each condition names a location immediately before the comparison.
  - The bird-sky and fish-sea parallels supply the destinations.
  confidence: high
  alternatives_preserved:
  - will precede you
  - will go before you
translation_notes:
  risk_flags:
  - risk: “Get there” states the implied destinations more directly than “precede.”
    mitigation: The sky and sea clauses explicitly supply those destinations.
  - risk: The review requests singular “child,” but the later source adjudication identifies the manuscript form as plural.
    mitigation: The main text retains the adjudicated reading “children,” which also matches the plural address.
