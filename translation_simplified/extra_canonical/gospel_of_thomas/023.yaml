base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/gospel_of_thomas/023.yaml
  text: Jesus said to you, “I will choose you, one out of a thousand and two out of ten thousand, a single one; they will stand, and they will stand as a single one.”
  footnotes:
  - marker: you
    text: The Coptic uses the form ⲧⲏⲛⲉ, a Lycopolitan/regional variant of the standard Sahidic second-person plural pronoun ⲧⲏⲩⲧⲛ.
    reason: dialect_note
  - marker: they will stand
    text: The text shifts abruptly from the second person ('I will choose you') to the third person ('they will stand'). This grammatical shift is present in the Coptic and has been preserved.
    reason: textual_variant
  - marker: a single one
    text: Coptic ⲟⲩⲁ ⲟⲩⲱⲧ. A key theological concept in Thomas, referring to the spiritual integration of duality into unity.
    reason: theological_note
  revision_pass:
    model: gpt-5.4-mini
    timestamp: '2026-05-03T07:41:46Z'
    unchanged: false
    changes_summary: Removed bracketed annotations from the main text, smoothed the opening to 'said to you,' and punctuated the clause so the third-person shift and 'a single one' stand clearly in English.
translation:
  language: en
  text: Jesus said to you, “From a thousand of you, I will choose one; from ten thousand, I will choose two. They[a] will stand, and they will stand as a single one.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Coptic abruptly shifts here from “you” to “they.”
    reason: textual_variant
  - marker: b
    text: “A single one” preserves the text’s important image of unity.
    reason: simplification_note
simplification_decisions:
- pob_phrase: I will choose you, one out of a thousand and two out of ten thousand
  simplified_phrase: From a thousand of you, I will choose one; from ten thousand, I will choose two
  preserved_meaning: Jesus chooses one from a thousand and two from ten thousand.
  reasoning_layer_used: Lexical decisions for ⲥⲉⲧⲡ, ϣⲟ, and ⲧⲃⲁ
  rationale: Reordering the clauses makes the selection and numbers easier to follow.
- pob_phrase: they will stand, and they will stand
  simplified_phrase: They will stand, and they will stand
  preserved_meaning: The repetition and abrupt shift to the third person remain intact.
  reasoning_layer_used: Applied revision and POB textual footnote
  rationale: The source repeats the statement, so the translation does too.
- pob_phrase: as a single one
  simplified_phrase: as a single one
  preserved_meaning: The distinctive Thomasine image of unity remains visible.
  reasoning_layer_used: Theological decision for ⲟⲩⲁ ⲟⲩⲱⲧ
  rationale: Replacing the phrase with “united” would weaken its theological force.
translation_notes:
  risk_flags:
  - risk: The antecedent of “they” is not grammatically explicit.
    mitigation: Footnote [a] identifies the source’s abrupt shift without resolving it.
  - risk: “A single one” may remain conceptually difficult for new readers.
    mitigation: Footnote [b] explains the unity image without imposing a specific interpretation.
