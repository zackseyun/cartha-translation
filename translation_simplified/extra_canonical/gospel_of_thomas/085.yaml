translation:
  language: en
  text: Jesus said, “Adam came from a great power and great wealth, but he did not become worthy of you. If he had been worthy, he would not have tasted death.”[1]
  philosophy: optimal-equivalence
  footnotes:
  - marker: '1'
    text: The manuscript is damaged at “worthy” and “would not have tasted,” but these restorations are widely accepted from the context and available space.
    reason: textual_variant
simplification_decisions:
- pob_phrase: came into being from
  simplified_phrase: came from
  preserved_meaning: Adam’s existence originated from the stated power and wealth.
  reasoning_layer_used: POB lexical decision for ϣⲱⲡⲉ ⲉⲃⲟⲗ
  rationale: The shorter wording expresses origin in ordinary English without treating Adam’s birth as the point.
- pob_phrase: For had he been worthy
  simplified_phrase: If he had been worthy
  preserved_meaning: The statement remains a past condition contrary to fact.
  reasoning_layer_used: POB grammatical footnote on the unreal condition
  rationale: Modern conditional order makes the logic immediately clear.
- pob_phrase: tasted death
  simplified_phrase: tasted death
  preserved_meaning: The source-language image of experiencing death remains intact.
  reasoning_layer_used: POB lexical decision for ϫⲓ ϯⲡⲉ
  rationale: The biblical image is understandable and should not be flattened to “died.”
translation_notes:
  risk_flags:
  - risk: “Came from” may be heard as referring to birth rather than coming into existence.
    mitigation: The audit records that origin of existence, not biological birth, controls the wording.
  - risk: “Worthy of you” remains conceptually unusual in English.
    mitigation: It is retained because the POB does not resolve the precise relationship more narrowly.
