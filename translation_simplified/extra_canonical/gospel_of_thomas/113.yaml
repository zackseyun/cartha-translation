translation:
  language: en
  text: 'His disciples asked him, “On what day will the reign[1] come?”


    [He answered],[2] “It will not come in a way you can detect by watching for it. People will not say, ‘Look, here it is!’ or ‘Look, there it is!’ Rather, the Father’s reign is already spread across the earth, but people do not see it.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: '1'
    text: “Reign” means the act of ruling as king, not primarily a territory.
    reason: simplification_note
  - marker: '2'
    text: The words “He answered” are supplied for clear English but are absent from the manuscript.
    reason: source_note
simplification_decisions:
- pob_phrase: kingship
  simplified_phrase: reign
  preserved_meaning: The term refers to active royal rule rather than chiefly to a realm.
  reasoning_layer_used: POB lexical decision for ⲡⲙⲛⲧⲣⲣⲟ
  rationale: “Reign” expresses the abstract sense in more familiar English.
- pob_phrase: It will not come by watching
  simplified_phrase: It will not come in a way you can detect by watching for it
  preserved_meaning: The reign does not arrive with outward signs that observers can locate.
  reasoning_layer_used: POB lexical rationale and immediate here-or-there context
  rationale: The recast sentence makes the terse idiom understandable without removing watching.
- pob_phrase: spread out upon the earth
  simplified_phrase: already spread across the earth
  preserved_meaning: The Father’s reign is a present, pervasive reality while retaining the spatial image.
  reasoning_layer_used: POB lexical decisions for ⲥⲡⲱⲣϣ and ϩⲓϫⲛ ⲡⲕⲁϩ
  rationale: “Across” is natural English, while “spread” and “earth” preserve the concrete image.
interpretive_expansions:
- pob_phrase: is spread out upon the earth
  rendering: is already spread across the earth
  claim: The reign is presented as already present rather than only future.
  evidence:
  - The POB rationale identifies a stative or present sense and an already-present reality.
  - The final contrast says people do not see it, implying its present existence.
  confidence: high
  alternatives_preserved:
  - has been spread out
  - is spread out
translation_notes:
  risk_flags:
  - risk: “Reign” may still sound abstract to some readers.
    mitigation: The footnote defines it as the act of ruling as king.
  - risk: The normalized text reads “heaven” where the manuscript line supports “there.”
    mitigation: The main text retains the contextually coherent “here/there” pairing without overstating certainty.
