translation:
  language: en
  text: Jesus said, “If you bring out[a] what is within you, what you have will save you. If not,[b] poverty is within you, and what you lack deep inside will kill you.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Bring out” can also be translated “cause to come into being.”
    reason: lexical_alternative
  - marker: b
    text: The connecting word may also mean “or else” or “rather.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: When you bring it forth within yourselves, this—what you have—will save you
  simplified_phrase: If you bring out what is within you, what you have will save you
  preserved_meaning: Bringing forth the inward possession results in salvation.
  reasoning_layer_used: Lexical decisions for “bring it forth,” “within yourselves,” “have,” and “save.”
  rationale: The sentence now names the object earlier while retaining the inward action and saving result.
- pob_phrase: otherwise, poverty is in you
  simplified_phrase: If not, poverty is within you
  preserved_meaning: Failure to bring it out is contrasted with inward poverty.
  reasoning_layer_used: Lexical decisions for the disjunctive particle and literal “poverty.”
  rationale: “If not” makes the contrast easier to follow without softening “poverty” into mere lack.
- pob_phrase: This—what you do not have within yourselves, inside—will kill you
  simplified_phrase: what you lack deep inside will kill you
  preserved_meaning: An inward absence is presented as deadly, with doubled emphasis on interiority.
  reasoning_layer_used: Lexical decisions for possession, “inside,” and the stark verb “kill.”
  rationale: “Lack deep inside” removes the broken syntax while preserving the difficult paradox and inward emphasis.
translation_notes:
  risk_flags:
  - risk: The saying never identifies exactly what is within or lacking.
    mitigation: The draft leaves the referent unspecified rather than supplying an interpretation.
  - risk: “If not” selects the POB’s disjunctive reading where “rather” remains possible.
    mitigation: The footnote preserves the documented alternative.
