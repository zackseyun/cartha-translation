translation:
  language: en
  text: Jesus said, “What did you go out into the wilderness to see? A reed shaken by the wind? Someone dressed in soft clothes? Look, people in soft clothes are in the house of your king and your high-ranking official,[a] and they cannot know the truth.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The manuscript is damaged here; the restored text reads “your king and your high-ranking official,” both singular.
    reason: source_note
simplification_decisions:
- pob_phrase: a person in soft clothing, with garments put on him
  simplified_phrase: someone dressed in soft clothes
  preserved_meaning: The person is wearing the soft garments associated with wealth and status.
  reasoning_layer_used: POB lexical decisions for ⲟⲩⲣⲱⲙⲉ, ⲛϣⲧⲏⲛ, and the clothing expression
  rationale: The natural wording removes redundant phrasing while keeping the concrete clothing image.
- pob_phrase: your magnate
  simplified_phrase: your high-ranking official
  preserved_meaning: The person is a powerful noble or courtier.
  reasoning_layer_used: POB lexical decision for the Greek loanword ⲙⲉⲅⲓⲥⲧⲁⲛⲟⲥ
  rationale: The common phrase communicates the rank without the unfamiliar word “magnate.”
- pob_phrase: they are not able to know the truth
  simplified_phrase: they cannot know the truth
  preserved_meaning: The statement concerns their inability to know the truth.
  reasoning_layer_used: POB lexical decisions for modal ⲛⲁ and ϣⲥⲟⲟⲩⲛ
  rationale: The contraction states the same modal meaning in direct modern English.
