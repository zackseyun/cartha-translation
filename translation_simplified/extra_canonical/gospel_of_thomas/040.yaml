translation:
  language: en
  text: Jesus said, “A grapevine was planted outside the Father. Because it has not become firmly established, it will be pulled up by the root and will perish.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: and since it is not established
  simplified_phrase: Because it has not become firmly established
  preserved_meaning: The grapevine has not taken firm hold and remains unestablished.
  reasoning_layer_used: POB lexical decision for ⲥⲧⲁϫⲣⲟ and the revision preserving its present state
  rationale: The clearer wording uses the documented sense “be firm” without adding a new image.
- pob_phrase: it will be uprooted from its root
  simplified_phrase: it will be pulled up by the root
  preserved_meaning: The grapevine will be forcibly removed at its root.
  reasoning_layer_used: POB lexical decisions for ⲡⲱⲣⲕ and ϩⲁ ⲡⲉⲥⲛⲟⲩⲛⲉ
  rationale: This common agricultural wording preserves both the uprooting action and the root image.
- pob_phrase: A grapevine was planted outside the Father, and ...
  simplified_phrase: A grapevine was planted outside the Father. Because ...
  preserved_meaning: The vine’s location outside the Father leads into the reason for its coming destruction.
  reasoning_layer_used: POB syntax and applied revision
  rationale: Splitting the long sentence makes the saying easier to follow while retaining its logical connection.
translation_notes:
  risk_flags:
  - risk: “Outside the Father” remains an unusual and potentially ambiguous image.
    mitigation: The wording is retained because the source and POB do not define the separation more precisely.
