translation:
  language: en
  text: Jesus said, “If people ask you, ‘Where did you come into being?’ tell them, ‘We came from the light—the place where the light came into being by itself, took its stand, and was revealed in their image.’[a] If they ask, ‘Are you it?’[b] say, ‘We are its children, the chosen ones of the living father.’ If they ask you, ‘What is the sign of your father, who is in you?’ tell them, ‘It is movement and rest.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The text says “their image,” but it is unclear who “their” refers to.
    reason: textual_variant
  - marker: b
    text: The original leaves the predicate in “Are you it?” unstated.
    reason: simplification_note
simplification_decisions:
- pob_phrase: If they say to you
  simplified_phrase: If people ask you
  preserved_meaning: Unspecified people address the hearers with questions.
  reasoning_layer_used: Immediate dialogue and the POB use of direct questions
  rationale: Naming “people” and using “ask” makes the question-and-answer pattern immediately clear.
- pob_phrase: stood
  simplified_phrase: took its stand
  preserved_meaning: The light stands after coming into being by itself.
  reasoning_layer_used: POB lexical decision for ⲟⲩⲱϩⲉ
  rationale: “Took its stand” makes the terse action more natural while preserving its force.
- pob_phrase: we are the chosen of the living father
  simplified_phrase: the chosen ones of the living father
  preserved_meaning: They identify themselves as the living father’s chosen people.
  reasoning_layer_used: POB lexical decision for ⲡⲥⲱⲧⲡ
  rationale: Adding “ones” makes the phrase natural without importing the stronger traditional term “elect.”
