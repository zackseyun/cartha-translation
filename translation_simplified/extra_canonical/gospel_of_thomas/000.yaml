translation:
  language: en
  text: These are the hidden sayings spoken by the living Jesus and written down by Didymos Judas Thomas.[1][2]
  philosophy: optimal-equivalence
  footnotes:
  - marker: '1'
    text: “Hidden” may also be translated “secret,” but it does not necessarily imply initiation into an esoteric group.
    reason: lexical_alternative
  - marker: '2'
    text: Didymos means “Twin” in Greek; Didymos and Thomas likely present Greek and Semitic forms of the same designation.
    reason: cultural_note
simplification_decisions:
- pob_phrase: which the living Jesus spoke, and Didymos Judas Thomas wrote them
  simplified_phrase: spoken by the living Jesus and written down by Didymos Judas Thomas
  preserved_meaning: Jesus spoke the sayings, and Didymos Judas Thomas recorded them in writing.
  reasoning_layer_used: POB lexical decisions for ϫⲱ and ⲥϩⲁⲓ, with the agent function of ⲛϭⲓ
  rationale: Parallel passive clauses make the two agents immediately clear without changing their roles.
- pob_phrase: hidden sayings
  simplified_phrase: hidden sayings
  preserved_meaning: The collection consists of concealed sayings rather than broadly defined teachings.
  reasoning_layer_used: POB lexical decisions for ϩⲏⲡ and ⲛ̄ϣⲁϫⲉ
  rationale: The key genre term and concrete image remain clear enough for common readers.
translation_notes:
  risk_flags:
  - risk: “Hidden” may be mistaken for a claim about esoteric initiation.
    mitigation: The lexical footnote preserves the alternative “secret” while limiting that inference.
  - risk: Readers may not recognize that Didymos is related to the designation Thomas.
    mitigation: The cultural note explains the likely relationship without replacing the manuscript’s full name.
