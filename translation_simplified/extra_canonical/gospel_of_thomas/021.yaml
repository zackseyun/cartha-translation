translation:
  language: en
  text: 'Mary asked Jesus, “What are your disciples like?”


    He said, “They are like little children living in a field that does not belong to them. When the owners come, they will say, ‘Give our field back to us.’ The children will strip naked before them,[a] leave the field, and give it back.


    “So I tell you: If the master of a house knows that a thief is coming, he will keep watch before the thief arrives. He will not let the thief break into the house of his kingdom[b] and carry away his possessions.


    “But you must guard yourselves against the world. With great strength, tie your garments firmly around your waist, so that robbers cannot find a way to reach you. For the advantage you are waiting for will be found.[c]


    “Let there be a person of understanding among you. When the fruit ripened, that person quickly came with a sickle in hand and harvested it. Whoever has ears to hear, let that person hear.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The image of stripping naked also appears in Saying 37.
    reason: cross_reference
  - marker: b
    text: The unusual phrase “house of his kingdom” is in the Coptic text; the similar sayings in Matthew 24:43 and Luke 12:39 say only “his house.”
    reason: textual_variant
  - marker: c
    text: The word translated “advantage” can also mean “need” or “necessity,” so the exact sense is uncertain.
    reason: lexical_alternative
