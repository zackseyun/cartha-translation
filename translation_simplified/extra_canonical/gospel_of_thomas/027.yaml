translation:
  language: en
  text: If you do not “fast the world”[a]—that is, abstain in relation to the world as in a fast—you will not find the kingdom.[b] If you do not truly observe the Sabbath as the Sabbath, you will not see the Father.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The source unusually joins “fast” with “the world”; the striking phrase is retained because it does not define the precise relationship.
    reason: simplification_note
  - marker: b
    text: The Greek witness reads “the kingdom of God,” while the Coptic text has “the kingdom.”
    reason: textual_variant
simplification_decisions:
- pob_phrase: fast the world
  simplified_phrase: “fast the world”—that is, abstain in relation to the world as in a fast
  preserved_meaning: The world remains linked to the fasting image without defining the precise form of abstention.
  reasoning_layer_used: POB wording, applied grammatical revision, and lexical decisions
  rationale: The clarification explains fasting while preserving the source expression’s unusual and compressed relationship to the world.
- pob_phrase: make the Sabbath a Sabbath
  simplified_phrase: truly observe the Sabbath as the Sabbath
  preserved_meaning: The Sabbath must genuinely be treated as what it is.
  reasoning_layer_used: POB footnote c and Sabbath lexical decision
  rationale: “Observe” explains the idiom while the repetition preserves its emphasis.
interpretive_expansions:
- pob_phrase: fast the world
  rendering: abstain in relation to the world as in a fast
  claim: The fasting image calls for abstention in relation to the world, but its precise scope remains unstated.
  evidence:
  - The verb retains its ordinary fasting sense.
  - The source unusually connects the world with the act of fasting.
  - The applied revision preserves the compressed phrase “fast the world.”
  confidence: moderate
  alternatives_preserved:
  - The exact form of abstention remains undefined.
  - The unusual expression “fast the world” remains in the text.
  external_witnesses:
  - POxy 1
translation_notes:
  risk_flags:
  - risk: The clarification may imply more about the required abstention than the saying states.
    mitigation: “In relation to” leaves the exact relationship and scope undefined.
  - risk: “Observe” is less literal than the source verb “make.”
    mitigation: “As the Sabbath” retains the source construction’s repetition and force.
