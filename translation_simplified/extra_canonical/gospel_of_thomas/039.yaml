translation:
  language: en
  text: Jesus said, “The Pharisees and the scribes received the keys that open the way to knowledge, but they hid them. They did not go in themselves, and they kept out those who wanted to go in. But you must become prudent like serpents and innocent like doves.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the keys of knowledge
  simplified_phrase: the keys that open the way to knowledge
  preserved_meaning: The concrete image of keys controlling access to knowledge remains intact.
  reasoning_layer_used: Lexical decisions for “keys” and “knowledge,” supported by the entry context.
  rationale: The added verbal link makes the key image immediately understandable.
- pob_phrase: They did not enter, and they did not allow those who wished to enter
  simplified_phrase: They did not go in themselves, and they kept out those who wanted to go in
  preserved_meaning: The leaders neither entered nor permitted willing people to enter.
  reasoning_layer_used: Lexical decisions for “enter,” “wish,” and “allow.”
  rationale: Common verbs and an explicit “themselves” clarify the contrast without resolving what is entered.
- pob_phrase: But you—become prudent
  simplified_phrase: But you must become prudent
  preserved_meaning: Jesus directly commands his hearers to develop prudence.
  reasoning_layer_used: Lexical decision that ϣⲱⲡⲉ means “become” with imperative force.
  rationale: “Must” carries the command naturally while retaining “become.”
interpretive_expansions:
- pob_phrase: the keys of knowledge
  rendering: the keys that open the way to knowledge
  claim: The keys are an image of control over access to knowledge.
  evidence:
  - Keys function as the means of entry in the immediate clauses.
  - The POB retains both the key image and the repeated language of entering.
  confidence: high
  alternatives_preserved:
  - The text does not specify the precise place or state being entered.
  external_witnesses:
  - Luke 11:52 and Matthew 23:13 provide thematic parallels.
translation_notes:
  risk_flags:
  - risk: “Open the way” explains the key image more directly than the POB.
    mitigation: The wording preserves the keys, knowledge, and entry imagery without naming the destination.
  - risk: “Kept out” is more forceful idiomatic English than “did not allow.”
    mitigation: It expresses the same active prevention stated by the Coptic and POB.
