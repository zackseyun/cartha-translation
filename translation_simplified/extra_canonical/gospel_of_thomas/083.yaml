base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/gospel_of_thomas/083.yaml
  text: Jesus said[1], "The images are manifest to humanity, and the light that is within them is hidden in the image of the light of the Father. He will be revealed[2], and his image is hidden by his light."
  footnotes:
  - marker: '1'
    text: 'The Coptic masculine singular pronoun ϥ- (''he/it'') could refer either to the Father (ⲡⲉⲓⲱⲧ) or to the light (ⲡⲟⲩⲟⲉⲓⲛ), as both are masculine nouns. Thus, an alternative translation is: ''It will be revealed, and its image is hidden by its light.'''
    reason: textual_variant
  - marker: '2'
    text: Coptic ⲡⲣⲱⲙⲉ (literally 'the person' or 'the human'), functioning as a collective.
    reason: lexical_alternative
  revision_pass:
    model: gpt-5.4-mini
    timestamp: '2026-05-03T07:41:48Z'
    unchanged: true
    changes_summary: No changes needed.
translation:
  language: en
  text: Jesus said, “The images are visible to people, and the light within them is hidden in the image of the Father’s light. He will be revealed,[1] and his image is hidden by his light.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: '1'
    text: The Coptic can also mean, “It will be revealed, and its image is hidden by its light,” referring to the light rather than the Father.
    reason: textual_variant
simplification_decisions:
- pob_phrase: The images are manifest to humanity
  simplified_phrase: The images are visible to people
  preserved_meaning: The images can be seen by human beings collectively.
  reasoning_layer_used: POB lexical decisions for ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ and ⲡⲣⲱⲙⲉ
  rationale: Common words replace formal phrasing without changing the collective sense.
- pob_phrase: the light that is within them
  simplified_phrase: the light within them
  preserved_meaning: The light remains located within the images.
  reasoning_layer_used: POB translation and source clause structure
  rationale: The shorter wording preserves both the light and its location.
- pob_phrase: He will be revealed, and his image is hidden by his light
  simplified_phrase: He will be revealed, and his image is hidden by his light
  preserved_meaning: The clauses remain additively linked while preserving the hidden-and-revealed imagery.
  reasoning_layer_used: POB connective wording and applied revision
  rationale: Keeping “and” avoids imposing an unsupported adversative relationship.
translation_notes:
  risk_flags:
  - risk: The masculine pronoun may refer to either the Father or the light.
    mitigation: The main text follows POB’s chosen reading, while the footnote preserves the equally possible alternative.
  - risk: The relationships among image, light, and the Father remain deliberately abstract.
    mitigation: The imagery and hidden-and-revealed tension are retained without adding a doctrinal explanation.
