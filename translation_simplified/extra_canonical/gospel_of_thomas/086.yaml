base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/gospel_of_thomas/086.yaml
  text: Jesus said, "The foxes have their holes, and the birds have their nest, but the Son of Man does not have a place to lay his head and rest."
  footnotes:
  - marker: holes
    text: The manuscript reads ⲛⲟⲩ[ⲃⲏ]ⲃ ('a hole/den'), but this is generally understood or emended as ⲛⲉⲩⲃⲏⲃ ('their holes') to parallel 'their nest' (ⲙⲡⲉⲩⲙⲁϩ) in the following clause.
    reason: textual_variant
  - marker: nest
    text: Thomas uses the singular 'nest' (ⲡⲉⲩⲙⲁϩ) and omits 'of the air', diverging from the canonical parallels (Matthew 8:20, Luke 9:58).
    reason: cross_reference
  - marker: and rest
    text: Thomas adds the phrase 'and rest' (ⲛϥⲙⲧⲟⲛ ⲙⲙⲟϥ), which is absent from the Synoptic versions of this saying.
    reason: cross_reference
  revision_pass:
    model: gpt-5.4-mini
    timestamp: '2026-05-03T07:41:48Z'
    unchanged: false
    changes_summary: Removed the placeholder marker after 'said' and smoothed the quotation punctuation. Capitalized 'Son of Man' for consistency with formal English style. Preserved the source's 'and rest' addition and the singular 'nest'.
translation:
  language: en
  text: Jesus said, “Foxes have their dens, and birds have their nest. But the son of man[a] has nowhere to lay his head and rest.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The lowercase wording preserves the possible general wisdom sense of “son of man” rather than forcing it to be a title.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: their holes
  simplified_phrase: their dens
  preserved_meaning: Foxes have sheltered places of their own.
  reasoning_layer_used: The lexical decision allows “dens” as an alternative for ⲃⲏⲃ.
  rationale: “Dens” is the more natural modern term for fox shelters.
- pob_phrase: does not have a place
  simplified_phrase: has nowhere
  preserved_meaning: The son of man lacks any place where he can settle to rest.
  reasoning_layer_used: The POB translation and lexical decision for ⲣⲓⲕⲉ preserve the following image of laying his head.
  rationale: The direct negative is shorter and easier to understand.
- pob_phrase: but the son of man does not have a place to lay his head and rest
  simplified_phrase: But the son of man has nowhere to lay his head and rest.
  preserved_meaning: The contrast and the distinct source addition “and rest” remain intact.
  reasoning_layer_used: The theological decision supports lowercase, and the lexical decision identifies ⲙⲧⲟⲛ as “rest.”
  rationale: A new sentence makes the contrast easier to follow without weakening the image.
translation_notes:
  risk_flags:
  - risk: Lowercase “son of man” differs from the latest POB revision’s capitalization.
    mitigation: The footnote follows the explicit theological rationale and preserves the phrase’s documented ambiguity.
