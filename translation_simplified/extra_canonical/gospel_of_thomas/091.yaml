translation:
  language: en
  text: They said to him, “Tell us who you are, so we can believe in you.” He answered, “You test the appearance of the sky and the earth.[a] But you do not recognize the one before you.[b] And you do not know how to test this critical time.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “the face of the sky and the earth”; here “face” refers to their visible appearance.
    reason: simplification_note
  - marker: b
    text: This may also be translated “what is before you,” though the following pronoun favors “the one.”
    reason: textual_variant
  - marker: c
    text: The original word is kairos, meaning a critical or appointed time or season.
    reason: cultural_note
simplification_decisions:
- pob_phrase: the face of the sky and the earth
  simplified_phrase: the appearance of the sky and the earth
  preserved_meaning: They examine the visible appearance of the sky and earth, while the note preserves the concrete image of their “face.”
  reasoning_layer_used: POB lexical decision and cultural note on ⲡϩⲟ
  rationale: “Appearance” makes the idiom clear without changing what they test.
- pob_phrase: the one who is before you
  simplified_phrase: the one before you
  preserved_meaning: They fail to recognize the person present before them without implying a physical posture.
  reasoning_layer_used: POB lexical decision and textual note on ⲡⲉⲧⲛⲙⲧⲟ ⲉⲃⲟⲗ
  rationale: The shorter wording is natural and retains the documented personal reading and ambiguity.
- pob_phrase: this kairos
  simplified_phrase: this critical time
  preserved_meaning: They cannot discern the significant time or season confronting them.
  reasoning_layer_used: POB lexical decision and footnote on ⲕⲁⲓⲣⲟⲥ
  rationale: The familiar phrase communicates the loanword’s central force while the note preserves its wider nuance.
interpretive_expansions:
- pob_phrase: this kairos
  rendering: this critical time
  claim: The time in view is especially significant rather than merely chronological.
  evidence:
  - The POB audit defines kairos as an appointed or critical time or season.
  confidence: high
  alternatives_preserved:
  - appointed time
  - season
translation_notes:
  risk_flags:
  - risk: Replacing “face” with “appearance” could weaken the source image.
    mitigation: Footnote [a] preserves the literal wording.
  - risk: “Critical time” does not convey every nuance of kairos.
    mitigation: Footnote [c] also gives “appointed time” and “season.”
