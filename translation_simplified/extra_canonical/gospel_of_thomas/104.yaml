translation:
  language: en
  text: 'They said to Jesus, “Come, let’s pray and fast today.”


    Jesus said, “What sin have I committed? Or in what way have I been overcome?[a] But when the bridegroom comes out of the wedding room, then let them fast and pray.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “in what way have I been overpowered?” The word can also mean “compelled.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Come, let us pray today, and let us fast.
  simplified_phrase: Come, let’s pray and fast today.
  preserved_meaning: The speakers invite Jesus to join them in prayer and fasting that day.
  reasoning_layer_used: POB syntax and lexical decisions
  rationale: The contraction and combined verbs make the shared invitation natural and concise.
- pob_phrase: For what is the sin that I have committed, or in what have I been overcome?
  simplified_phrase: What sin have I committed? Or in what way have I been overcome?
  preserved_meaning: Jesus asks what sin he committed or how he was defeated.
  reasoning_layer_used: POB interrogative analysis and applied lexical revision
  rationale: Two short questions clarify the rhetoric while retaining the revised sense “overcome.”
- pob_phrase: goes out from the bridal chamber
  simplified_phrase: comes out of the wedding room
  preserved_meaning: The bridegroom emerges from a room associated with the wedding.
  reasoning_layer_used: POB lexical decision and cultural note
  rationale: “Wedding room” explains the unfamiliar term without adding that the room was prepared.
