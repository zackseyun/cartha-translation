translation:
  language: en
  text: Jesus said, “A person who knows the All[a] yet lacks their own self[b] is lacking in every way.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “The All” may also be translated “the whole” or “everything”; here it may refer to all that exists.
    reason: lexical_alternative
  - marker: b
    text: The wording deliberately presents a paradox; it may also mean “be lacking in oneself” or “be lacking alone.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: The one who knows the All, yet lacks himself
  simplified_phrase: A person who knows the All yet lacks their own self
  preserved_meaning: The saying describes anyone who knows the totality but still lacks their own self.
  reasoning_layer_used: POB lexical decisions and applied grammar revision
  rationale: The generic wording removes the unsupported modal while retaining “the All” and the reflexive paradox.
- pob_phrase: is lacking in every respect
  simplified_phrase: is lacking in every way
  preserved_meaning: The person’s deficiency is complete rather than limited to one area.
  reasoning_layer_used: POB idiom rationale for ⲛⲡⲙⲁ ⲧⲏⲣⲛⲧⲟϥ
  rationale: “In every way” states the totality idiom in common English.
translation_notes:
  risk_flags:
  - risk: “The All” remains unusual for common readers.
    mitigation: Footnote a gives ordinary alternatives and cautiously explains its possible cosmic scope.
  - risk: “Lacks their own self” remains intentionally paradoxical.
    mitigation: Footnote b preserves the documented alternatives without resolving the ambiguity.
