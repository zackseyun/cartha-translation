base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/gospel_of_thomas/043.yaml
  text: 'His disciples said to him[1], "Who are you, that you say these things to us?"


    "From what I say to you, you do not know who I am. But you have become like the Jews, for they love the tree but hate its fruit[2], and they love the fruit but hate the tree."'
  footnotes:
  - marker: '1'
    text: The negative present tense ⲛ̄ⲧⲉⲧⲛ̄ⲉⲓⲙⲉ ⲁⲛ can be read as a statement ('you do not know') or a rhetorical question ('do you not know?'). Both fit the context of Jesus rebuking their lack of understanding.
    reason: textual_variant
  - marker: '2'
    text: 'The Coptic text places ''they love'' and ''they hate'' side by side without a conjunction (asyndeton: ⲥⲉⲙⲉ ⲙ̄ⲡϣⲏⲛ ⲥⲉⲙⲟⲥⲧⲉ ⲙ̄ⲡⲉϥⲕⲁⲣⲡⲟⲥ), emphasizing the contradiction. ''But'' has been supplied in English for clarity.'
    reason: register_note
  revision_pass:
    model: gpt-5.4-mini
    timestamp: '2026-05-03T07:41:47Z'
    unchanged: true
    changes_summary: No changes needed.
translation:
  language: en
  text: 'His disciples asked him, “Who are you to tell us these things?”


    “You do not know who I am from what I tell you.[1] But you have become like the Jews: they love the tree but hate its fruit, and they love the fruit but hate the tree.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: '1'
    text: This may also be read as the rhetorical question, “Do you not know who I am from what I tell you?”
    reason: textual_variant
simplification_decisions:
- pob_phrase: His disciples said to him
  simplified_phrase: His disciples asked him
  preserved_meaning: The disciples address him with a direct question.
  reasoning_layer_used: Immediate syntax and dialogue form
  rationale: “Asked” states the function of their words in natural English.
- pob_phrase: Who are you, that you say these things to us?
  simplified_phrase: Who are you to tell us these things?
  preserved_meaning: They question his identity in light of what he tells them.
  reasoning_layer_used: POB translation and source clause
  rationale: The recast question is easier to read while retaining its possible challenging tone.
- pob_phrase: But you have become like the Jews, for they love the tree but hate its fruit
  simplified_phrase: 'But you have become like the Jews: they love the tree but hate its fruit'
  preserved_meaning: The comparison exposes the contradiction of loving the tree while hating what it produces.
  reasoning_layer_used: POB lexical decisions and source image
  rationale: The colon clarifies the comparison while preserving “become,” “love,” “hate,” and the tree-and-fruit image.
translation_notes:
  risk_flags:
  - risk: “Who are you to tell us” may sound like a challenge to authority as well as a question about identity.
    mitigation: The wording retains the explicit identity question without assigning a motive.
  - risk: The saying makes a broad negative comparison involving “the Jews.”
    mitigation: The source wording is retained without expanding or endorsing the generalization.
