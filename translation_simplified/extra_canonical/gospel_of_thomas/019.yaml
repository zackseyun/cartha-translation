translation:
  language: en
  text: Jesus said, “Blessed is the one who came into being before coming into being.[a] If you become my disciples and listen to my words, these stones will minister to you.[b] For you have five trees in Paradise. They do not move in summer or winter, and their leaves do not fall. Whoever comes to know these trees will not taste death.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The repeated phrase “came into being” preserves the saying’s deliberate paradox.
    reason: lexical_alternative
  - marker: b
    text: 'The manuscript surface can be read as plural, “my words, these stones,” as in the main text. A normalized reading is singular: “listen to my word, and this stone will minister to you.”'
    reason: textual_variant
simplification_decisions:
- pob_phrase: the one who has come to be before he comes to be
  simplified_phrase: the one who came into being before coming into being
  preserved_meaning: The deliberate paradox repeats the same idea of coming into existence.
  reasoning_layer_used: POB lexical decision for ϣⲱⲡⲉ
  rationale: The shorter wording preserves the paradox without reducing it to birth or preexistence.
- pob_phrase: For you have five trees in Paradise; they do not move in summer or in winter
  simplified_phrase: For you have five trees in Paradise. They do not move in summer or winter
  preserved_meaning: The five trees remain unmoved through both seasons.
  reasoning_layer_used: POB lexical decisions for five trees, move, summer, and winter
  rationale: Dividing the sentence makes the image easier to follow without removing any detail.
- pob_phrase: their leaves do not fall
  simplified_phrase: their leaves do not fall
  preserved_meaning: The trees keep their leaves rather than shedding them.
  reasoning_layer_used: POB lexical decision for ϭⲱⲃⲉ and independent grounding review
  rationale: Keeping the simple negative avoids strengthening it into an unqualified claim with “never.”
interpretive_expansions:
- pob_phrase: Whoever comes to know them
  rendering: Whoever comes to know these trees
  claim: The pronoun refers to the five trees in Paradise.
  evidence:
  - The five trees are the immediately preceding plural noun.
  confidence: high
translation_notes:
  risk_flags:
  - risk: The opening remains mysterious because the source presents a deliberate paradox.
    mitigation: The repeated coming-into-being language is retained and identified briefly in a footnote.
  - risk: The manuscript surface and normalized edition differ between plural and singular wording.
    mitigation: The main text follows the audited manuscript-surface plural reading, while the normalized singular is noted.
