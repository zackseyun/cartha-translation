translation:
  language: en
  text: The disciples told him, “Your brothers[a] and your mother are standing outside.” He answered, “The people here who do what my Father wants are my brothers and my mother. They are the ones who will enter my Father’s kingdom.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Brothers” may also refer more broadly to siblings.
    reason: lexical_alternative
  - marker: b
    text: Compare Mark 3:31–35; Matthew 12:46–50; and Luke 8:19–21.
    reason: cross_reference
simplification_decisions:
- pob_phrase: The disciples said to him
  simplified_phrase: The disciples told him
  preserved_meaning: The disciples directly report that his family is outside.
  reasoning_layer_used: POB translation and immediate dialogue context
  rationale: “Told him” makes the reported message natural in modern English.
- pob_phrase: Those here who do the will of my Father
  simplified_phrase: The people here who do what my Father wants
  preserved_meaning: Those present who carry out the Father’s will are identified as Jesus’ family.
  reasoning_layer_used: POB lexical decision for ⲡⲉⲓⲙⲁ and ⲉⲓⲣⲉ ⲛⲡⲟⲩⲱϣ
  rationale: The wording explains “those here” and “do the will” in everyday English.
- pob_phrase: the kingdom of my Father
  simplified_phrase: my Father’s kingdom
  preserved_meaning: The kingdom remains specifically identified as belonging to his Father.
  reasoning_layer_used: POB lexical decisions for ⲡⲁⲉⲓⲱⲧ and ⲡⲙⲛⲧⲣⲣⲟ
  rationale: The possessive form is shorter and more natural without changing the relationship.
translation_notes:
  risk_flags:
  - risk: “What my Father wants” may sound less theological than “the will of my Father.”
    mitigation: The phrase still expresses obedient action toward the Father’s will in ordinary English.
  - risk: “Brothers” can be read as exclusively male although the source may allow a broader family sense.
    mitigation: A lexical footnote preserves the possible meaning “siblings.”
