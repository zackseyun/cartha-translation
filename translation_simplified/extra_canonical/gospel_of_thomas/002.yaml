translation:
  language: en
  text: Jesus said, “Whoever seeks must not stop seeking until he finds. When he finds, he will be unsettled. When he is unsettled, he will be amazed. Then he will reign over everything that exists.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek fragment says that he will be astounded and, after reigning, will rest; the Coptic says that he will be unsettled and amazed, and does not mention rest.
    reason: textual_variant
  - marker: b
    text: Literally “the All,” a term for the totality of things or the whole cosmos.
    reason: cultural_note
simplification_decisions:
- pob_phrase: Let the one who seeks not stop seeking
  simplified_phrase: Whoever seeks must not stop seeking
  preserved_meaning: The saying urges any seeker to continue rather than addressing someone who controls another seeker.
  reasoning_layer_used: Applied grammar revision and lexical decision for the negative jussive
  rationale: The recasting gives the third-person maxim natural modern English without introducing a second-person addressee.
- pob_phrase: he will be disturbed; and when he is disturbed, he will marvel
  simplified_phrase: he will be unsettled. When he is unsettled, he will be amazed
  preserved_meaning: Finding first causes inner disturbance and then amazement as two distinct stages.
  reasoning_layer_used: Lexical decisions for ϣⲧⲟⲣⲧⲣ and ⲣϣⲡⲏⲣⲉ, plus the parallel-clause revision
  rationale: Common words and shorter sentences preserve the repeated sequence and distinguish disturbance from amazement.
- pob_phrase: reign over the All
  simplified_phrase: reign over everything that exists
  preserved_meaning: The seeker will reign over the totality of things, not merely over many things.
  reasoning_layer_used: Lexical rationale and cultural footnote for ⲉϫⲛ ⲡⲧⲏⲣϥ
  rationale: The main text explains the technical idiom while the footnote retains its literal form.
interpretive_expansions:
- pob_phrase: the All
  rendering: everything that exists
  claim: The expression refers to the totality of things or the cosmos.
  evidence:
  - The POB lexical rationale identifies the phrase as a collective cosmological totality.
  - The POB cultural note says it does not mean merely “many things.”
  confidence: high
  alternatives_preserved:
  - the All
  - the whole
  - the cosmos
translation_notes:
  risk_flags:
  - risk: “Must not stop” may sound more explicitly obligatory than the compact English jussive.
    mitigation: It preserves the audited third-person maxim and avoids the false second-person command.
  - risk: Replacing “the All” could hide a distinctive Thomasine expression.
    mitigation: The footnote preserves the literal term and explains its cosmological scope.
