translation:
  language: en
  text: Jesus said, “Why are you washing the outside of the cup? Don’t you know that the same one made both its inside and its outside?”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Why do you wash the outside of the cup?
  simplified_phrase: Why are you washing the outside of the cup?
  preserved_meaning: Jesus directly questions the washing of the cup’s outer surface.
  reasoning_layer_used: POB lexical decisions for ⲉⲓⲱⲉ and ⲡⲥⲁ ⲛⲃⲟⲗ
  rationale: The progressive form sounds natural in modern English while retaining the concrete verb “wash.”
- pob_phrase: the one who made the inside is also the one who made the outside
  simplified_phrase: the same one made both its inside and its outside
  preserved_meaning: One maker made both parts of the cup.
  reasoning_layer_used: POB lexical decisions for ⲧⲁⲙⲓⲟ, ⲟⲛ, and the matched inside-outside phrases
  rationale: The shorter wording removes repetition without confusing making with washing.
translation_notes:
  risk_flags:
  - risk: Compressing the repeated maker clauses could reduce their rhetorical emphasis.
    mitigation: “The same one” and “both” preserve the claim that one maker made the inside and outside.
