translation:
  language: en
  text: 'The disciples said to Jesus, “Tell us what our end will be like.”


    Jesus said, “Have you found the beginning, then, that you are looking for the end? For in the place where the beginning is, there the end will be. Blessed is the one who will stand before it in the beginning.[a] That person will know the end and will not taste death.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The wording is ambiguous. “It” may refer to “the beginning,” or the pronoun may point to an implied “First” or “Origin,” giving the sense “in his presence.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Tell us how our end will be.
  simplified_phrase: Tell us what our end will be like.
  preserved_meaning: The disciples ask what their end will be like.
  reasoning_layer_used: POB lexical decision for ⲡϩⲁⲏ
  rationale: This is natural English while preserving “end” and its contrast with “beginning.”
- pob_phrase: Blessed is the one who will stand in the beginning
  simplified_phrase: Blessed is the one who will stand before it in the beginning.
  preserved_meaning: The blessing retains both standing in the beginning and the source’s relational pronoun.
  reasoning_layer_used: POB footnote c and lexical rationale for ⲉⲣⲁⲧϥ ϩⲛ ⲡⲁⲣⲭⲏ
  rationale: The main text preserves the relational image, while the footnote keeps its referent uncertain.
- pob_phrase: he will know the end
  simplified_phrase: That person will know the end
  preserved_meaning: The blessed person will know the end.
  reasoning_layer_used: POB lexical decision for ⲥⲟⲟⲩⲛ
  rationale: Restating the subject prevents an unclear pronoun without weakening “know.”
translation_notes:
  risk_flags:
  - risk: “Stand before it in the beginning” remains unusual because the source image and pronoun are ambiguous.
    mitigation: The main text retains the relational wording, and the footnote explains both possible referents without choosing one.
  - risk: Modern readers may take “taste death” literally.
    mitigation: The source-language idiom is retained because its image is central and the immediate context makes death its object.
