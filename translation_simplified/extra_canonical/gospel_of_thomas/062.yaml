base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/gospel_of_thomas/062.yaml
  text: Jesus said[1], "I tell my mysteries to those [who are worthy] of [my] mysteries. What your right hand will do[4][3][2], do not let your left hand know what it is doing."
  footnotes:
  - marker: '1'
    text: The manuscript is damaged here; '[who are worthy]' (ⲛⲉ[ⲧⲙⲡϣⲁ]) and '[my]' (ⲛ[ⲛⲁ]) are standard restorations based on context and early Christian parallels (e.g., Clement of Alexandria, Stromata 5.10.63).
    reason: textual_variant
  - marker: '2'
    text: The Coptic uses ⲉⲓ̈ϫⲱ (eijō) for 'I tell', a dialectal First Present form where standard Sahidic would use ϯϫⲱ (tijō).
    reason: dialect_note
  - marker: '3'
    text: The Coptic uses ⲙⲛ̄ⲧⲣⲉ- (mntre-), a variant spelling of the standard Sahidic negative causative imperative ⲙⲡⲣⲧⲣⲉ- (mprtre-).
    reason: dialect_note
  - marker: '4'
    text: Unlike the canonical parallel in Matthew 6:3, which applies this saying to giving alms in secret, Thomas places it immediately after a statement about esoteric mysteries, reframing the saying as an instruction on spiritual secrecy.
    reason: cross_reference
  revision_pass:
    model: gpt-5.4-mini
    timestamp: '2026-05-03T07:41:47Z'
    unchanged: true
    changes_summary: No changes needed.
translation:
  language: en
  text: Jesus said, “I share my mysteries with those who are worthy to receive them.[1] Whatever your right hand does, do not let your left hand know what it is doing.[2]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: '1'
    text: The manuscript is damaged here; “who are worthy” and “my” are standard restorations based on the context and early Christian parallels.
    reason: textual_variant
  - marker: '2'
    text: Matthew 6:3 uses this image for secret giving, but Thomas places it after the statement about mysteries without naming a specific kind of action.
    reason: cross_reference
simplification_decisions:
- pob_phrase: I tell my mysteries to those [who are worthy] of [my] mysteries
  simplified_phrase: I share my mysteries with those who are worthy to receive them
  preserved_meaning: Jesus communicates his mysteries to people judged worthy of them.
  reasoning_layer_used: POB lexical decisions and restored manuscript text
  rationale: “Share” and “receive them” make the relationship clear while preserving “mysteries” and “worthy.”
- pob_phrase: What your right hand will do
  simplified_phrase: Whatever your right hand does
  preserved_meaning: The saying refers generally to the right hand’s actions.
  reasoning_layer_used: POB grammatical revision and lexical decision
  rationale: The generic present sounds natural in English without changing the aphorism’s scope.
interpretive_expansions:
- pob_phrase: worthy of my mysteries
  rendering: worthy to receive them
  claim: Their worthiness concerns being entrusted with Jesus’ mysteries.
  evidence:
  - The preceding clause says Jesus tells his mysteries to these people.
  - The POB lexical decision retains the sense “worthy” or “deserving.”
  confidence: high
  alternatives_preserved:
  - worthy of my mysteries
translation_notes:
  risk_flags:
  - risk: The words “who are worthy” and “my” depend on restoration where the manuscript is damaged.
    mitigation: A textual footnote identifies the restoration.
  - risk: The hand image may be read only as a reference to charity because of Matthew 6:3.
    mitigation: The cross-reference notes Thomas’s different context without forcing a single interpretation.
