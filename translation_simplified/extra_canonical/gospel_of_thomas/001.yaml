translation:
  language: en
  text: And he said, “Whoever discovers how to understand these sayings will not taste death.[1]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: '1'
    text: To “taste death” means to experience death.
    reason: cultural_note
simplification_decisions:
- pob_phrase: finds the interpretation of these sayings
  simplified_phrase: discovers how to understand these sayings
  preserved_meaning: Understanding comes through interpreting the sayings rather than merely noticing an obvious meaning.
  reasoning_layer_used: POB lexical decisions for ⲛⲁϩⲉ and ⲡϩⲉⲣⲙⲏⲛⲉⲓⲁ
  rationale: This wording makes the interpretive act clear without implying one directly discoverable meaning.
- pob_phrase: taste death
  simplified_phrase: taste death
  preserved_meaning: The vivid image refers to experiencing death.
  reasoning_layer_used: POB lexical decision and cultural footnote for ϫⲓϯ ⲛⲡⲙⲟⲩ
  rationale: The source image remains in the text and its idiomatic sense is explained in a footnote.
translation_notes:
  risk_flags:
  - risk: “How to understand” is less technical than “interpretation.”
    mitigation: It still presents understanding as an interpretive process and avoids the weaker phrase “the meaning.”
