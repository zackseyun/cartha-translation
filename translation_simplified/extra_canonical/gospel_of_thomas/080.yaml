translation:
  language: en
  text: Jesus said, “Anyone who has come to know the world has found the body.[a] And anyone who has found the body is someone the world is not worthy of.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Coptic word translated “body” can also mean “corpse,” but “body” follows the specific wording used in this saying.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Whoever has come to know the world
  simplified_phrase: Anyone who has come to know the world
  preserved_meaning: The statement applies to every person who has completed this act of knowing.
  reasoning_layer_used: lexical decision for the relative perfect construction
  rationale: “Anyone who” is natural modern English while preserving the generic scope and completed action.
- pob_phrase: whoever has found the body, the world is not worthy of him
  simplified_phrase: anyone who has found the body is someone the world is not worthy of
  preserved_meaning: The world is declared unworthy of each person who has found the body.
  reasoning_layer_used: source syntax and lexical decision for “is not worthy of”
  rationale: The recast sentence removes awkward clause order without merging the two parallel sayings.
translation_notes:
  risk_flags:
  - risk: “The body” remains a deliberately difficult image that readers may understand only physically.
    mitigation: The wording preserves the source-driven choice, while the footnote records the lexical alternative.
