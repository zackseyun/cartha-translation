translation:
  language: en
  text: Jesus said, “Anyone who knows the world has found a corpse. The world is not worthy of anyone who has found that corpse.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Whoever has come to know the world
  simplified_phrase: Anyone who knows the world
  preserved_meaning: The saying applies to every person who reaches knowledge of the world.
  reasoning_layer_used: POB lexical decision for ⲥⲟⲟⲩⲛ and its documented plainer alternative
  rationale: “Knows” states the same completed condition in more direct English.
- pob_phrase: and whoever has found the corpse, the world is not worthy of him
  simplified_phrase: The world is not worthy of anyone who has found that corpse
  preserved_meaning: The world is unworthy of the person who finds the corpse.
  reasoning_layer_used: POB grammar and lexical decisions for the indefinite relative and worthiness idiom
  rationale: Reordering the clause removes awkward syntax without changing its claim.
- pob_phrase: a corpse / the corpse
  simplified_phrase: a corpse / that corpse
  preserved_meaning: The second mention points back to the corpse already found.
  reasoning_layer_used: POB article distinction and lexical decision for ⲡⲧⲱⲙⲁ
  rationale: “That corpse” makes the source’s definite backward reference natural in English.
translation_notes:
  risk_flags:
  - risk: “Corpse” is a stark metaphor whose precise interpretation remains unstated.
    mitigation: The image is retained without adding an explanatory gloss.
