    unchanged: true
    changes_summary: No changes needed.
translation:
  language: en
  text: Jesus said, “A fortified city built on a high mountain cannot fall. Nor will it be able to be hidden.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The surviving Greek fragment says, “on top of a high mountain.”
    reason: textual_variant
simplification_decisions:
- pob_phrase: A city built upon a high mountain and fortified
  simplified_phrase: A fortified city built on a high mountain
  preserved_meaning: The city remains both fortified and located on a high mountain.
  reasoning_layer_used: POB lexical decisions for ⲧⲟⲟⲩ, ϫⲓⲥⲉ, and ⲧⲁϫⲣⲟ
  rationale: Reordering the modifiers makes their relationships clear in natural English.
- pob_phrase: cannot fall, nor will it be able to be hidden
  simplified_phrase: cannot fall. Nor will it be able to be hidden.
  preserved_meaning: The city cannot fall, and the final clause retains the Coptic future sense.
  reasoning_layer_used: POB theological decision and textual-variant note 2
  rationale: Two sentences reduce complexity without merging the distinct claims.
translation_notes:
  risk_flags:
  - risk: Readers may associate the saying only with Matthew 5:14 and overlook Thomas’s added image of stability.
    mitigation: The main text retains both “fortified” and “cannot fall” as required by Thomas’s wording.
