  yaml_path: translation/extra_canonical/gospel_of_thomas/033.yaml
  text: Jesus said, "What you will hear in your ear—in the other ear[a] proclaim it upon your rooftops; for no one lights a lamp and puts it under a measuring-basket[b], nor does one put it in a hidden place, but rather one puts it on the lampstand, so that those who enter and those who go out may see its light.[c]"
  revision_pass:
    model: doctrine-realignment
    timestamp: '2026-05-18T04:58:28Z'
    unchanged: false
    changes_summary: 'doctrine_realignment: Gospel of Thomas — Saying 33 metadata stamp (1 override) [no-op text]. Text already matches azure_from; stamping doctrine_realignment metadata so the audit no longer flags this verse. Chosen renderings preserved: [''under a measuring-basket''].'
translation:
  language: en
  text: Jesus said, “What you hear in one ear, announce in the other from your rooftops. No one lights a lamp and puts it under a basket used for measuring or hides it away. Instead, the lamp is placed on a lampstand so that those who enter and those who go out can see its light.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: What you will hear in your ear—in the other ear proclaim it upon your rooftops
  simplified_phrase: What you hear in one ear, announce in the other from your rooftops
  preserved_meaning: The unusual reference to both ears and the command to proclaim publicly are both retained.
  reasoning_layer_used: POB text, Coptic source payload, and grounding review
  rationale: The revised syntax makes the difficult ear construction readable without explaining away its ambiguity.
- pob_phrase: puts it under a measuring-basket
  simplified_phrase: puts it under a basket used for measuring
  preserved_meaning: The lamp is covered by the specific kind of measuring basket protected in the POB revision.
  reasoning_layer_used: POB doctrine-realignment revision
  rationale: The basket’s function is stated in familiar English while preserving the source image.
- pob_phrase: nor does one put it in a hidden place, but rather one puts it on the lampstand
  simplified_phrase: or hides it away. Instead, the lamp is placed on a lampstand
  preserved_meaning: The contrast remains between concealing the lamp and displaying it where its light can be seen.
  reasoning_layer_used: POB text and immediate context
  rationale: Two short sentences and repeated nouns make the contrast easy to follow.
translation_notes:
  risk_flags:
  - risk: The unusual relationship between hearing in one ear and announcing in the other remains open to interpretation.
    mitigation: The text retains both ears in clear English without assigning the expression a doctrinal meaning.
