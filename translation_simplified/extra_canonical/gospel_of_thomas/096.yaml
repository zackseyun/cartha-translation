translation:
  language: en
  text: Jesus said, “The Father’s kingdom is like a woman who took a little sourdough starter and hid it in dough. She made it into big loaves.[a] Whoever has ears should listen.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Coptic may also mean “a large amount of bread” or “many loaves.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: a little leaven
  simplified_phrase: a little sourdough starter
  preserved_meaning: The woman used a small amount of the traditional ferment for making bread.
  reasoning_layer_used: POB lexical decision and cultural note for ⲥⲓⲣ
  rationale: “Sourdough starter” prevents readers from picturing modern commercial yeast.
- pob_phrase: She took a little leaven, hid it in dough, and made it into big loaves.
  simplified_phrase: a woman who took a little sourdough starter and hid it in dough. She made it into big loaves.
  preserved_meaning: The woman hides a small fermenting agent in dough and produces large loaves.
  reasoning_layer_used: POB syntax and lexical decisions for ϩⲱⲡ, ϣⲱⲧⲉ, and ⲉⲓⲣⲉ
  rationale: Splitting the action into two sentences makes the sequence easier to follow.
- pob_phrase: Whoever has ears, let him hear.
  simplified_phrase: Whoever has ears should listen.
  preserved_meaning: Those able to hear are urged to pay attention.
  reasoning_layer_used: POB lexical decision for ⲥⲱⲧⲙ and the Thomas hearing formula
  rationale: “Should listen” expresses the force of the familiar command in natural English.
translation_notes:
  risk_flags:
  - risk: “Big loaves” may emphasize size where the Coptic could indicate quantity or abundance.
    mitigation: Footnote [a] preserves the main lexical alternatives.
