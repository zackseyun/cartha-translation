    unchanged: false
    changes_summary: Removed the bracketed gloss markers, standardized punctuation and quotation marks, and kept the translation aligned with the established lexical decisions while preserving the gnomic present tense.
translation:
  language: en
  text: Jesus said, “If a blind person guides another blind person, they both fall down into a pit.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: a blind person leads a blind person
  simplified_phrase: a blind person guides another blind person
  preserved_meaning: One blind person directs a second person who is also blind.
  reasoning_layer_used: POB lexical decisions for ⲥⲱⲕ ϩⲏⲧ and ⲃⲗⲗⲉ
  rationale: “Guides” clarifies the idiom, while repeating “blind person” preserves the condition of both people.
- pob_phrase: both of them fall down
  simplified_phrase: they both fall down
  preserved_meaning: The two people share the same fall as a general consequence.
  reasoning_layer_used: POB lexical decisions for ϣⲁⲩϩⲉ and ⲡⲉⲥⲛⲁⲩ
  rationale: Natural English word order retains the dual emphasis and gnomic present tense.
