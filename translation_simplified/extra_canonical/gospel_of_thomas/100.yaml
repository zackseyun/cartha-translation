translation:
  language: en
  text: They showed Jesus a gold coin. “Caesar’s people are demanding the tax from us,” they said. Jesus answered, “Give Caesar the things that belong to Caesar. Give God the things that belong to God. And give me what is mine.”[1]
  philosophy: optimal-equivalence
  footnotes:
  - marker: '1'
    text: The final command, “give me what is mine,” is unique to Thomas and does not appear in the parallel accounts in the Synoptic Gospels.
    reason: cross_reference
simplification_decisions:
- pob_phrase: Those who belong to Caesar
  simplified_phrase: Caesar’s people
  preserved_meaning: The tax is demanded by people associated with Caesar.
  reasoning_layer_used: POB lexical decision and lexical footnote
  rationale: The shorter phrase remains broad without identifying them more specifically as officials.
- pob_phrase: Give the things of Caesar to Caesar; give the things of God to God
  simplified_phrase: Give Caesar the things that belong to Caesar. Give God the things that belong to God.
  preserved_meaning: Each command concerns the things belonging respectively to Caesar and to God.
  reasoning_layer_used: Applied grammatical revision
  rationale: Two direct sentences clarify the parallel commands while preserving the plural “things.”
- pob_phrase: and what is mine—give it to me
  simplified_phrase: And give me what is mine.
  preserved_meaning: Jesus adds a distinct command concerning what belongs to him.
  reasoning_layer_used: POB lexical decision and cross-reference footnote
  rationale: Natural English word order preserves the stark final claim and its singular form.
translation_notes:
  risk_flags:
  - risk: “Caesar’s people” could be read broadly as all his subjects.
    mitigation: The wording avoids the narrower and uncertain claim that they were specifically government officials.
