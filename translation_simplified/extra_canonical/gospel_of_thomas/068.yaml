base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/gospel_of_thomas/068.yaml
  text: Jesus said, “Blessed are you when they hate you and persecute you; and they will find no place in the place where they persecuted you.”
  footnotes:
  - marker: they hate you
    text: 'The Coptic uses the third-person plural for all the verbs in this sequence (hate, persecute, find, persecuted). Because this is the standard Coptic idiom for the passive voice, the saying is often translated: ''Blessed are you when you are hated and persecuted; and no place will be found in the place where you were persecuted.'' Translating it actively, however, preserves the sharp contrast between the persecutors'' actions and their failure to find a ''place''.'
    reason: textual_variant
  - marker: no place in the place
    text: 'The Coptic uses two different words for ''place'' here: the Greek loanword ⲧⲟⲡⲟⲥ (topos, often carrying theological weight in Thomas as a place of spiritual rest or standing) and the native Coptic word ⲙⲁ (ma, a physical location or spot). The persecutors will find no spiritual standing in the physical location of their persecution.'
    reason: lexical_alternative
  - marker: persecuted you
    text: Unlike the Synoptic parallels (Matthew 5:11, Luke 6:22), Thomas lacks a Christological motivation for the persecution (e.g., 'because of me' or 'on account of the Son of Man').
    reason: cross_reference
  revision_pass:
    model: gpt-5.4-mini
    timestamp: '2026-05-03T07:41:47Z'
    unchanged: false
    changes_summary: Removed the bracketed glosses from the main text and tightened the final clause to read more naturally while preserving the source sense.
translation:
  language: en
  text: Jesus said, “You are blessed when people[a] hate and persecute you. Those persecutors will find no place[b] at the place where they persecuted you.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Coptic may also be translated, “when you are hated and persecuted,” but the active wording follows the POB choice.
    reason: textual_variant
  - marker: b
    text: The first word for “place” can suggest spiritual dwelling or standing, while the second refers to a physical location.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Blessed are you when they hate you and persecute you
  simplified_phrase: You are blessed when people hate and persecute you
  preserved_meaning: The hearers are blessed when unnamed people actively hate and persecute them.
  reasoning_layer_used: POB theological decision on active rendering
  rationale: Naming the implied subject as “people” makes the active construction immediately clear.
- pob_phrase: and they will find no place
  simplified_phrase: Those persecutors will find no place
  preserved_meaning: The people who persecute the hearers are the ones who fail to find a place.
  reasoning_layer_used: POB theological decision on consistent active subjects
  rationale: Repeating the referent prevents confusion about who will fail to find a place.
- pob_phrase: in the place where they persecuted you
  simplified_phrase: at the place where they persecuted you
  preserved_meaning: Their failure is connected with the physical location where the persecution occurred.
  reasoning_layer_used: POB lexical decision for ⲙⲁ
  rationale: “At the place” is natural English without adding emphasis absent from the source.
interpretive_expansions:
- pob_phrase: they will find no place
  rendering: Those persecutors will find no place
  claim: The subject of “will find” is the same unnamed group that hates and persecutes the hearers.
  evidence:
  - The POB active reading preserves the third-person plural as the subject throughout the sequence.
  confidence: high
  alternatives_preserved:
  - The Coptic third-person plural may instead be rendered as a passive construction.
translation_notes:
  risk_flags:
  - risk: The repeated word “place” may remain enigmatic to modern readers.
    mitigation: Footnote [b] explains the distinct possible force of the two source words without narrowing the main text.
  - risk: The Coptic third-person plural can function as a passive construction.
    mitigation: Footnote [a] records the passive alternative while the text follows the POB active reading.
