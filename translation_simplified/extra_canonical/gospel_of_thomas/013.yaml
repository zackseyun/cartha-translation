translation:
  language: en
  text: 'Jesus said to his disciples, “Compare me to someone. Tell me who I am like.”


    Simon Peter answered, “You are like a righteous angel.”


    Matthew said, “You are like a human being—a wise and understanding philosopher.”


    Thomas said, “Teacher, my mouth will be completely unable to say who you are like.”


    Jesus said, “I am not your teacher, because you drank from the bubbling spring that I myself measured out, and you became intoxicated.”[a]


    Then Jesus took Thomas aside and told him three sayings.


    When Thomas returned to his companions, they asked him, “What did Jesus say to you?”


    Thomas answered, “If I tell you even one of the sayings he spoke to me, you will pick up stones and throw them at me. Then fire will come out of the stones and consume you.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Measured out” may also mean “apportioned” or “drawn as water”; the unusual image is preserved.
    reason: lexical_alternative
