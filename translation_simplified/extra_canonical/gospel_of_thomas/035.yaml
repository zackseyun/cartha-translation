base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/gospel_of_thomas/035.yaml
  text: Jesus said, "It is not possible for someone to enter the strong man’s house and take it by force unless he binds his hands; then he will overturn his house."
  footnotes:
  - marker: take it
    text: The Coptic pronoun is masculine singular and could refer either to the house (ⲡⲏⲉⲓ) or to the strong man (ⲡϫⲱⲱⲣⲉ, 'take him by force').
    reason: lexical_alternative
  - marker: overturn
    text: The Coptic verb ⲡⲱⲱⲛⲉ ⲉⲃⲟⲗ literally means 'to pour out' or 'to overturn,' a notable divergence from the canonical Synoptic parallels (Mark 3:27, Matt 12:29) which use ⲧⲱⲣⲡ ('to plunder' or 'snatch').
    reason: lexical_alternative
  revision_pass:
    model: gpt-5.4-mini
    timestamp: '2026-05-03T07:41:47Z'
    unchanged: false
    changes_summary: Removed the bracketed editorial notes from the main text, added standard quotation punctuation, and kept the established renderings for the key terms while smoothing the sentence for natural English.
translation:
  language: en
  text: Jesus said, “No one can enter a strong man’s house and seize it by force[a] unless he ties the man’s hands. Then he can turn his house upside down[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Coptic pronoun may refer either to the house (“seize it”) or to the strong man (“seize him”).
    reason: lexical_alternative
  - marker: b
    text: The Coptic expression can mean “pour out” or “overturn,” rather than the usual “plunder” found in the related sayings in Mark 3:27 and Matthew 12:29.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: It is not possible for someone to enter
  simplified_phrase: No one can enter
  preserved_meaning: Entering is impossible for anyone under the stated condition.
  reasoning_layer_used: POB lexical decision for ⲙⲛ̄ϭⲟⲙ
  rationale: The shorter wording expresses the same lack of ability in ordinary English.
- pob_phrase: unless he binds his hands
  simplified_phrase: unless he ties the man’s hands
  preserved_meaning: The intruder must restrain the strong man’s hands before succeeding.
  reasoning_layer_used: Immediate syntax and POB translation
  rationale: Naming “the man” makes the pronoun clear without adding a rope or other object.
- pob_phrase: overturn his house
  simplified_phrase: turn his house upside down
  preserved_meaning: The vivid action of overturning the house remains distinct from merely plundering it.
  reasoning_layer_used: POB lexical decision for ⲡⲱⲱⲛⲉ ⲉⲃⲟⲗ
  rationale: The common expression preserves the source image while avoiding an abstract verb.
translation_notes:
  risk_flags:
  - risk: The object of “seize” is grammatically ambiguous in Coptic.
    mitigation: Footnote [a] preserves both the house and strong-man readings.
  - risk: “Turn upside down” may be heard figuratively in modern English.
    mitigation: Footnote [b] records the concrete source senses “pour out” and “overturn.”
