base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/gospel_of_thomas/103.yaml
  text: Jesus said, “Blessed is the man who knows in which part the robbers are coming in, so that he will arise, gather his kingdom, and gird his loins beforehand, before they come in.”
  footnotes:
  - marker: part
    text: Coptic ϩⲛ ⲁϣ ⲙ-ⲙⲉⲣⲟⲥ (lit. 'in which part'). This likely refers to the part or 'watch' of the night.
    reason: cultural_note
  - marker: gather his kingdom
    text: Unlike the Synoptic parallels (Matthew 24:43; Luke 12:39) where the householder simply stays awake to prevent a break-in, Thomas introduces the striking, active imagery of gathering one's 'kingdom' (ⲙⲛⲧⲉⲣⲟ) and girding one's loins.
    reason: textual_variant
  revision_pass:
    model: gpt-5.4-mini
    timestamp: '2026-05-03T07:41:48Z'
    unchanged: false
    changes_summary: Removed the bracketed editorial gloss from the main text and smoothed the quotation punctuation and wording slightly while preserving the source meaning.
translation:
  language: en
  text: Jesus said, “Blessed is the man who knows at what point[a] the robbers will come in. Then he can get up, gather his kingdom[b], and tie up his clothing in advance, ready for action before they enter.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Coptic literally says “in which part,” probably referring to a part or watch of the night.
    reason: cultural_note
  - marker: b
    text: “Kingdom” is the source text’s striking term here; “domain” or “estate” would fit the scene but would hide its theological imagery.
    reason: simplification_note
simplification_decisions:
- pob_phrase: knows in which part
  simplified_phrase: knows at what point
  preserved_meaning: He knows the relevant part or point when the robbers will enter.
  reasoning_layer_used: POB lexical decision and cultural footnote
  rationale: “At what point” is natural English, while the note preserves the probable night-watch sense and uncertainty.
- pob_phrase: so that he will arise
  simplified_phrase: Then he can get up
  preserved_meaning: Knowing when they will enter enables him to rise and prepare.
  reasoning_layer_used: source grammar and applied revision
  rationale: A new sentence clarifies the purpose relationship while retaining the distinct act of rising.
- pob_phrase: gird his loins beforehand
  simplified_phrase: tie up his clothing in advance, ready for action
  preserved_meaning: He secures his garments ahead of time so that he is prepared to act.
  reasoning_layer_used: POB lexical decision and grounding review
  rationale: “Clothing” explains the ancient image without specifying an unsupported garment.
interpretive_expansions:
- pob_phrase: gird his loins
  rendering: tie up his clothing in advance, ready for action
  claim: The idiom depicts securing one’s garments in preparation for action.
  evidence:
  - The POB lexical rationale identifies this as the standard idiom “to gird one’s loins.”
  confidence: high
  alternatives_preserved:
  - gird his loins
  - bind himself
translation_notes:
  risk_flags:
  - risk: The phrase “in which part” may refer to a watch of the night, but its exact sense is uncertain.
    mitigation: The broad wording “at what point” avoids certainty, and footnote [a] gives the probable sense.
  - risk: “Gather his kingdom” is unusual and could be mistaken for “gather his estate” or “muster his forces.”
    mitigation: The text retains Thomas’s theological term, and footnote [b] explains why.
