translation:
  language: en
  text: Jesus said, “How terrible for the Pharisees! They are like a dog lying on the cattle’s feeding trough. The dog does not eat, and it keeps the cattle from eating.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Woe to the Pharisees!
  simplified_phrase: How terrible for the Pharisees!
  preserved_meaning: The words remain a forceful denunciation rather than an expression of sympathy.
  reasoning_layer_used: POB lexical decision for ⲟⲩⲟⲓ
  rationale: The wording makes the warning understandable without weakening its condemnatory force.
- pob_phrase: the manger of the cattle
  simplified_phrase: the cattle’s feeding trough
  preserved_meaning: The dog lies on the container from which the cattle eat.
  reasoning_layer_used: POB lexical decision and footnote for ⲡⲟⲩⲟⲙϥ
  rationale: “Feeding trough” explains the less familiar word “manger” while preserving the concrete image.
- pob_phrase: it neither eats nor lets the cattle eat
  simplified_phrase: The dog does not eat, and it keeps the cattle from eating
  preserved_meaning: The dog takes no food itself and blocks the cattle from feeding.
  reasoning_layer_used: POB lexical decisions for ⲟⲩⲱⲙ and ⲕⲱ with an infinitive
  rationale: Naming the dog again and using two direct clauses makes the contrast immediately clear.
translation_notes:
  risk_flags:
  - risk: “Keeps” may sound slightly more active than the source’s literal “does not let.”
    mitigation: The negative allow-construction supports the practical sense that the dog prevents the cattle from eating.
