translation:
  language: en
  text: Jesus said, “A body that depends on another body is wretched. And a soul that depends on both bodies is wretched.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Wretched is the body that depends on a body
  simplified_phrase: A body that depends on another body is wretched
  preserved_meaning: One body relies on a distinct body and is therefore called wretched.
  reasoning_layer_used: POB lexical decision for ⲉⲓϣⲉ and footnote b
  rationale: Ordinary word order and “another” make the relationship clear without changing it.
- pob_phrase: wretched is the soul that depends on these two
  simplified_phrase: a soul that depends on both bodies is wretched
  preserved_meaning: The soul relies on the two bodies implied in the first clause.
  reasoning_layer_used: POB decision and rationale for ⲛⲡⲁⲓ ⲛⲡⲥⲛⲁⲩ
  rationale: “Both bodies” identifies the otherwise unclear referent of “these two.”
interpretive_expansions:
- pob_phrase: a body; these two
  rendering: another body; both bodies
  claim: The first clause involves two distinct bodies, and the soul depends on that pair.
  evidence:
  - POB footnote b identifies the pair as the dependent body and the body it depends on.
  - The dual expression points back to the pair implied in the first clause.
  confidence: high
  alternatives_preserved:
  - these two
  - this pair
translation_notes:
  risk_flags:
  - risk: “Both bodies” makes an implied referent explicit.
    mitigation: The wording follows the POB footnote and preserves the audited interpretation.
