translation:
  language: en
  text: Jesus said, “People do not accept a prophet in his own village. A doctor does not heal people who know him.”[1]
  philosophy: optimal-equivalence
  footnotes:
  - marker: '1'
    text: An early Greek fragment says “hometown” instead of “village” and “perform healings for” instead of “heal.”
    reason: textual_variant
simplification_decisions:
- pob_phrase: No prophet is acceptable in his village
  simplified_phrase: People do not accept a prophet in his own village
  preserved_meaning: A prophet is not accepted among the people of his village.
  reasoning_layer_used: The lexical decision identifies “acceptable” as being received or accepted and retains the Coptic “village.”
  rationale: The active wording is easier to understand while preserving the universal negative.
- pob_phrase: a physician does not heal those who know him
  simplified_phrase: A doctor does not heal people who know him
  preserved_meaning: Familiarity prevents the physician from healing those who know him.
  reasoning_layer_used: The audited revision establishes that the source noun means “physician” and the negative form states a general truth.
  rationale: “Doctor” and “people” are more natural in common English without changing the proverb.
interpretive_expansions:
- pob_phrase: No prophet is acceptable
  rendering: People do not accept a prophet
  claim: The passive idea of acceptance is expressed with the implied human agents made explicit.
  evidence:
  - The source term means “receive” or “accept.”
  - The immediate setting is the prophet’s village community.
  confidence: high
  alternatives_preserved:
  - No prophet is accepted
translation_notes:
  risk_flags:
  - risk: “His own village” may sound like the Greek and canonical “hometown.”
    mitigation: The main text retains “village,” and the footnote distinguishes the Greek variant.
  - risk: The physician statement could be mistaken for an exceptionless medical rule.
    mitigation: Its proverbial form and pairing with the prophet saying preserve its intended general force.
