base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/gospel_of_thomas/004.yaml
  text: Jesus said[1], "An old man in his days will not hesitate to ask a small child seven days old about the place of life, and he will live. For many who are first will become last[3][2], and they will become a single one."
  footnotes:
  - marker: '1'
    text: P.Oxy. 654 includes the phrase "and the last first" after "will become last," which the Coptic omits.
    reason: textual_variant
  - marker: '2'
    text: The Coptic text creates a wordplay between ϫⲛⲁⲩ (jnau, "hesitate") and ϫⲛⲉ (jne, "ask"), which is lost in English.
    reason: register_note
  - marker: '3'
    text: The aphorism "many who are first will be last" appears in Matthew 19:30, Mark 10:31, and Luke 13:30, but Thomas omits the canonical second half ("and the last first") and appends its own conclusion ("and they will become a single one").
    reason: cross_reference
  revision_pass:
    model: gpt-5.4-mini
    timestamp: '2026-05-03T07:41:46Z'
    unchanged: true
    changes_summary: No changes needed.
translation:
  language: en
  text: Jesus said, “An old man will not hesitate to ask a child only seven days old where life is found, and he will live. For many who are first will become last,[1] and they will become a single one.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: '1'
    text: The Greek fragment adds “and the last first” here, but the Coptic text does not.
    reason: textual_variant
simplification_decisions:
- pob_phrase: An old man in his days
  simplified_phrase: An old man
  preserved_meaning: The man is advanced in age.
  reasoning_layer_used: POB translation and immediate source context
  rationale: The repeated age phrase is unnecessary in natural English.
- pob_phrase: a small child seven days old
  simplified_phrase: a child only seven days old
  preserved_meaning: The elder seeks an answer from an extremely young child.
  reasoning_layer_used: POB translation
  rationale: “Only” makes the striking age contrast immediately clear.
- pob_phrase: the place of life
  simplified_phrase: where life is found
  preserved_meaning: The question concerns the location or source associated with life.
  reasoning_layer_used: POB lexical wording and source image
  rationale: The concrete idea of place is recast as a natural English question without reducing it to a doctrine.
interpretive_expansions:
- pob_phrase: the place of life
  rendering: where life is found
  claim: The phrase asks where life is located or encountered.
  evidence:
  - The POB directly renders the Coptic phrase as “the place of life.”
  - The immediate clause presents this as something the old man asks about.
  confidence: moderate
  alternatives_preserved:
  - the place of life
  - where life is
translation_notes:
  risk_flags:
  - risk: “Where life is found” may suggest a source of life rather than a strictly spatial place.
    mitigation: The wording retains “where,” preserving the source phrase’s spatial force.
  - risk: The audit record contains an earlier proposal for “be ashamed,” while the controlling POB reads “hesitate.”
    mitigation: The draft follows the final POB lexical decision, which cites both the Coptic lexicon and Greek overlap witness.
