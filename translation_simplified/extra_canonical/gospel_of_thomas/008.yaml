base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/gospel_of_thomas/008.yaml
  text: And he said, "The human is like a wise fisherman who cast his net into the sea. He drew it up from the sea full of small fish. Among them, the wise fisherman found a large, fine fish. He threw all the small fish back down into the sea; he chose the large fish without difficulty. Whoever has ears to hear, let him hear."
  footnotes:
  - marker: The human
    text: Coptic ⲡⲣⲱⲙⲉ (p-rōme). Often translated 'the man', but used here in a generic sense for humanity or the seeker.
    reason: lexical_alternative
  - marker: cast
    text: The manuscript reads ⲛⲧⲁϩⲛⲟⲩϫⲉ, using ϩ for the 3rd person masculine singular suffix pronoun ϥ, a regional (often Lycopolitan) dialect feature common in this text.
    reason: dialect_note
  - marker: found
    text: Literally 'fell upon' (ⲁϥϩⲉ ⲉ-).
    reason: lexical_alternative
  - marker: down
    text: The manuscript has a small lacuna here (ⲉ[ⲡⲉ]ⲥⲏⲧ), but the restoration is standard and certain.
    reason: textual_variant
  - marker: without difficulty
    text: This parable parallels Matthew 13:47-48, but diverges significantly. Matthew describes a dragnet gathering all kinds of fish to be sorted into good and bad at the end of the age. Thomas focuses on a single wise fisherman who discards the many small fish to keep the one large, valuable fish, reflecting Thomas's emphasis on finding the 'single one' (monachos) rather than an apocalyptic sorting.
    reason: cross_reference
  revision_pass:
    model: gpt-5.4-mini
    timestamp: '2026-05-03T07:41:46Z'
    unchanged: false
    changes_summary: Removed the bracketed editorial insertions from the main text and restored the quotation punctuation to readable formal English; retained the established lexical choices and the reviser's correction 'his net.'
translation:
  language: en
  text: And he said, “A person is like a wise fisherman. The fisherman threw his net into the sea and pulled it up full of small fish. Among them he found a large, fine fish. He threw all the small fish back down into the sea and easily chose the large fish. Whoever has ears to hear should listen.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: The human is like a wise fisherman who cast his net into the sea.
  simplified_phrase: A person is like a wise fisherman. The fisherman threw his net into the sea
  preserved_meaning: The comparison concerns a generic person, represented by a wise fisherman using his own net.
  reasoning_layer_used: POB lexical decisions for ⲡⲣⲱⲙⲉ, ⲣⲙⲛϩⲏⲧ, and ⲁⲃⲱ
  rationale: “A person” expresses the generic sense naturally, while two sentences make the comparison easier to follow.
- pob_phrase: He drew it up from the sea full of small fish.
  simplified_phrase: and pulled it up full of small fish.
  preserved_meaning: The fisherman raises his net from the sea with many small fish in it.
  reasoning_layer_used: POB translation and source clause sequence
  rationale: “Pulled it up” is clearer common English than “drew it up.”
- pob_phrase: he chose the large fish without difficulty.
  simplified_phrase: and easily chose the large fish.
  preserved_meaning: The fisherman selects the single large fish with no difficulty.
  reasoning_layer_used: POB lexical decision for ⲭⲱⲣⲓⲥϩⲓⲥⲉ and theological decision preserving the singular focus
  rationale: “Easily” states the same lack of difficulty in a shorter, more natural form.
translation_notes:
  risk_flags:
  - risk: “A person” does not reproduce the Coptic definite generic article word for word.
    mitigation: It preserves the audited generic reference to humanity or any seeker without implying a male-only subject.
  - risk: Breaking the opening comparison into two sentences could make the fisherman seem like a separate character.
    mitigation: Repeating “the fisherman” keeps him clearly linked to the person in the comparison.
