translation:
  language: en
  text: Jesus said, “Let whoever has become rich be king,[a] and let whoever has power[b] give it up.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “reign” or “rule.”
    reason: lexical_alternative
  - marker: b
    text: “Power” may also mean might or ability, and sometimes miraculous power.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Whoever has become rich, let him be king
  simplified_phrase: Let whoever has become rich be king
  preserved_meaning: The person who has become wealthy is called to be king.
  reasoning_layer_used: The lexical decisions retain the relative perfect and the jussive force of “be king.”
  rationale: Reordering the clause makes the command natural in modern English without weakening its force.
- pob_phrase: whoever has power, let him renounce it
  simplified_phrase: let whoever has power give it up
  preserved_meaning: The person possessing power is called to renounce that power.
  reasoning_layer_used: The lexical decision identifies “power” as broad and the implicit object as the preceding power.
  rationale: “Give it up” states “renounce it” in familiar language while preserving the implied object.
translation_notes:
  risk_flags:
  - risk: “Give it up” is less formal than “renounce it.”
    mitigation: The phrase still clearly expresses a deliberate surrender of the power just mentioned.
