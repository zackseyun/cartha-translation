translation:
  language: en
  text: Jesus said,[a] “If you have money, do not lend it to earn interest. Instead, give it to someone you will not take it back from.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The words “Jesus said” are restored where the manuscript is slightly damaged.
    reason: textual_variant
  - marker: b
    text: The final clause may also mean “someone who will not give it back to you.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: do not lend at interest
  simplified_phrase: do not lend it to earn interest
  preserved_meaning: The money is not to be used for an interest-bearing loan.
  reasoning_layer_used: The lexical decision identifies the Coptic expression as the idiom for lending at interest.
  rationale: The purpose phrase explains the financial expression in common English.
- pob_phrase: give it to the one from whom you will not take it back
  simplified_phrase: give it to someone you will not take it back from
  preserved_meaning: The money is to be given without later reclaiming it.
  reasoning_layer_used: The chosen lexical direction is “from whom you will not take it back.”
  rationale: Ordinary English clause order makes the recipient and lack of repayment easier to follow.
interpretive_expansions:
- pob_phrase: lend at interest
  rendering: lend it to earn interest
  claim: Interest is what the lender would gain from the loan.
  evidence:
  - The POB lexical rationale identifies the phrase as lending at interest.
  confidence: high
  alternatives_preserved:
  - lend at interest
translation_notes:
  risk_flags:
  - risk: The final Coptic clause has an alternative direction of repayment.
    mitigation: Footnote b preserves the alternative without displacing the POB’s chosen reading.
