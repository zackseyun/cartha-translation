translation:
  language: en
  text: Jesus said, “Do not spend day and night worrying about what clothes you will put on.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: An ancient Greek copy adds material about food, lilies, and stature, but this translation follows the Nag Hammadi Coptic text.
    reason: textual_variant
simplification_decisions:
- pob_phrase: Do not be anxious
  simplified_phrase: Do not spend ... worrying
  preserved_meaning: Jesus commands his hearers not to remain preoccupied with clothing.
  reasoning_layer_used: POB lexical decision for ⲙⲡⲣϥⲓⲣⲟⲟⲩϣ
  rationale: “Worrying” is common English and preserves the chosen sense of anxiety.
- pob_phrase: from morning until evening, and from evening until morning
  simplified_phrase: day and night
  preserved_meaning: The concern continues through the whole daily cycle.
  reasoning_layer_used: POB temporal lexical decisions and source parallelism
  rationale: The compact phrase expresses both time spans in natural English.
- pob_phrase: what you will put on yourselves
  simplified_phrase: what clothes you will put on
  preserved_meaning: The concern is about putting clothing on oneself.
  reasoning_layer_used: POB lexical decisions for ϯⲛⲧⲟϥ and ϩⲓⲱⲧⲛⲧⲱⲧⲛ
  rationale: Naming clothes makes the implicit object clear while retaining the concrete action.
