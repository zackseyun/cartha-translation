translation:
  language: en
  text: Jesus said, “Seek the Living One while you are alive, so that you do not die and then seek to see him but are unable to see.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Seek after the Living One
  simplified_phrase: Seek the Living One
  preserved_meaning: The command still calls for pursuing the title-like Living One.
  reasoning_layer_used: POB lexical decisions for ϭⲱϣⲧ with ⲛⲥⲁ and ⲡⲉⲧⲉⲣⲉⲱⲛϩ
  rationale: Removing the awkward “after” makes the command natural without weakening it.
- pob_phrase: while you are living
  simplified_phrase: while you are alive
  preserved_meaning: The seeking must happen during the hearers’ lifetime.
  reasoning_layer_used: POB lexical decision for ϩⲱⲥ ⲉⲣⲉ…ⲱⲛϩ
  rationale: “While you are alive” states the temporal contrast in ordinary English.
- pob_phrase: and you will not be able to see
  simplified_phrase: but are unable to see
  preserved_meaning: After death, the attempt to see the Living One will fail.
  reasoning_layer_used: POB lexical decisions for ϣϭⲙϭⲟⲙ and ⲉⲛⲁⲩ
  rationale: The shorter clause clearly preserves the final inability to see.
translation_notes:
  risk_flags:
  - risk: The long purpose clause may require careful reading to follow the sequence.
    mitigation: Keeping “so that you do not die” preserves the source’s preventive grammatical relation.
