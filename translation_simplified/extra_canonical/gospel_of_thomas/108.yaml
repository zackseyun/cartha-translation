translation:
  language: en
  text: Jesus said, “Whoever drinks from my mouth[a] will become like me. I myself will become that person, and what is hidden will be revealed to that person.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Drinks from my mouth” can be an image for receiving what Jesus speaks; this wording preserves the original image.
    reason: cultural_note
simplification_decisions:
- pob_phrase: Whoever drinks from my mouth
  simplified_phrase: Whoever drinks from my mouth[a]
  preserved_meaning: The source image of drinking directly from Jesus’ mouth remains intact.
  reasoning_layer_used: POB lexical decision and cultural note
  rationale: The image remains in the text while the note gives a possible contextual sense.
- pob_phrase: I myself shall become he
  simplified_phrase: I myself will become that person
  preserved_meaning: Jesus emphatically describes a striking reciprocal identification with the person.
  reasoning_layer_used: POB lexical decision on the emphatic pronoun and copular construction
  rationale: “That person” replaces the unclear generic “he” without explaining away the reciprocity.
- pob_phrase: the hidden things will be revealed to him
  simplified_phrase: what is hidden will be revealed to that person
  preserved_meaning: What is concealed will become known to the person described.
  reasoning_layer_used: POB lexical decisions on the substantivized relative and recipient
  rationale: The relative clause and repeated noun phrase are clearer in common English.
translation_notes:
  risk_flags:
  - risk: Modern readers may take drinking from Jesus’ mouth only literally.
    mitigation: The qualified footnote offers a possible teaching sense while preserving the image.
  - risk: “Will become that person” remains deliberately enigmatic.
    mitigation: The wording preserves the reciprocal identity statement without imposing an interpretation.
