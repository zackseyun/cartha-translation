translation:
  language: en
  text: 'His disciples said, “Show us where you are, because we must seek that place.”


    He said to them, “Anyone who has ears, listen. There is light within a person of light. That person gives light to the whole world. When that person does not shine, there is darkness.”[1]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: '1'
    text: The Coptic text states that there is light within a person of light and that the person shines; the surviving Greek fragment makes this conditional and has the light shining instead.
    reason: textual_variant
simplification_decisions:
- pob_phrase: Show us the place where you are, for it is necessary for us to seek it.
  simplified_phrase: Show us where you are, because we must seek that place.
  preserved_meaning: The disciples ask to know Jesus’s location because they must seek it.
  reasoning_layer_used: POB lexical decisions for location, necessity, and seeking.
  rationale: The direct wording removes an awkward impersonal clause without weakening necessity.
- pob_phrase: Whoever has ears, let him hear.
  simplified_phrase: Anyone who has ears, listen.
  preserved_meaning: All who can hear are directly commanded to pay attention.
  reasoning_layer_used: POB lexical decision identifying the clause as a jussive hearing formula.
  rationale: A direct imperative preserves the command’s force in natural English.
- pob_phrase: There is light within a man of light, and he lights the whole world.
  simplified_phrase: There is light within a person of light. That person gives light to the whole world.
  preserved_meaning: Light is within the person, who remains the one illuminating the entire world.
  reasoning_layer_used: POB lexical decisions for the person-of-light construction and the transitive verb.
  rationale: “Person” reflects the source sense, while two sentences clarify who gives light.
translation_notes:
  risk_flags:
  - risk: “Person of light” remains a deliberately unusual image.
    mitigation: The wording preserves Thomas’s distinctive construction while avoiding an unintended male-only sense.
  - risk: The Coptic and Greek witnesses differ in syntax and in who shines.
    mitigation: The main text follows the controlling Coptic witness, and the footnote preserves both Greek differences.
