base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/gospel_of_thomas/057.yaml
  text: Jesus said, "The kingdom of the Father is like a man who has good seed. His enemy came by night and sowed a weed on the good seed. The man did not allow them to pull up the weed. He said to them, 'Lest you say, "We will pull up the weed," and pull up the wheat along with it. For on the day of the harvest, the weeds will appear; they will be pulled up and burned.'"
  footnotes:
  - marker: a weed
    text: The Coptic uses the singular indefinite 'a weed' (ⲟⲩⲍⲓⲍⲁⲛⲓⲟⲛ) here and the singular definite 'the weed' (ⲡⲍⲓⲍⲁⲛⲓⲟⲛ) in the following clauses, before switching to the plural 'the weeds' (ⲛⲍⲓⲍⲁⲛⲓⲟⲛ) at the end. The Greek loanword ζιζάνιον (darnel) is typically plural in the Synoptic parallels.
    reason: textual_variant
  - marker: We will pull up
    text: The Coptic prefix ⲉⲛⲁ- (we will) is a Lycopolitan dialectal variant of the standard Sahidic ⲧⲛⲛⲁ-.
    reason: dialect_note
  - marker: they will be pulled up and burned
    text: Lit. 'they pull them up and they burn them' (active verbs with an indefinite subject, functioning as a passive).
    reason: register_note
  revision_pass:
    model: gpt-5.4-mini
    timestamp: '2026-05-03T07:41:48Z'
    unchanged: false
    changes_summary: Removed the bracketed notes from the main text, slightly smoothed the opening punctuation, and tightened the quoted wording while preserving the established lexical decisions and source sense.
translation:
  language: en
  text: Jesus said, “The Father’s kingdom is like a man who had good seed. During the night, his enemy came and sowed a weed among the good seed. The man would not let them pull up the weed. He said to them, ‘If you say, “We will pull up the weed,” you may pull up the wheat with it. On harvest day, the weeds will appear. They will be pulled up and burned.’”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: The kingdom of the Father
  simplified_phrase: The Father’s kingdom
  preserved_meaning: The Father’s reign remains the subject of the comparison.
  reasoning_layer_used: POB theological wording
  rationale: The possessive form is more natural while preserving the title and concept.
- pob_phrase: The man did not allow them to pull up the weed
  simplified_phrase: The man would not let them pull up the weed
  preserved_meaning: The man refused to permit the weed to be uprooted.
  reasoning_layer_used: POB lexical decision for ⲕⲟⲟⲩ
  rationale: “Would not let” expresses the refusal in ordinary English.
- pob_phrase: Lest you say, “We will pull up the weed,” and pull up the wheat along with it
  simplified_phrase: If you say, “We will pull up the weed,” you may pull up the wheat with it
  preserved_meaning: Their stated plan could result in uprooting the wheat together with the weed.
  reasoning_layer_used: POB grammar revision and immediate context
  rationale: The conditional warning is clearer while retaining the workers’ quoted intention.
translation_notes:
  risk_flags:
  - risk: The source shifts from one weed to multiple weeds.
    mitigation: The text retains “a weed” and “the weed,” then changes to “the weeds” at harvest.
  - risk: The conditional wording recasts the source’s negative warning.
    mitigation: It preserves both the quoted plan and the danger of uprooting the wheat with the weed.
