  review_summary: “Being breastfed” is a warranted, clearer modernization of “being suckled,” and the draft appropriately preserves the saying’s difficult unity images without doctrinally explaining them. Revision is required because “while we are little ones” turns an ambiguous or purposive question into a claim that the disciples already are little ones. The replacement follows the POB’s documented alternative and the immediate context. The footnote is also tightened to describe the lexical possibility accurately.
