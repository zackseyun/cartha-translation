  previous_text: 'Jesus saw some little ones being breastfed. He told his disciples, “These little ones are like those who will enter the Kingdom.”


    They asked him, “Will we enter the Kingdom while we are little ones?”


    Jesus replied, “When you make the two one; when you make the inner like the outer and the outer like the inner, and the upper like the lower[a]; when you make the male and the female into a single one, so that the male is not male and the female is not female; and when you make eyes in place of an eye, a hand in place of a hand, a foot in place of a foot, and an image in place of an image—then you will enter the Kingdom.”'
