translation:
  language: en
  text: 'Jesus saw some little ones being breastfed. He told his disciples, “These little ones are like those who will enter the Kingdom.”


    They asked him, “Must we be little ones to enter the Kingdom?”


    Jesus replied, “When you make the two one; when you make the inner like the outer and the outer like the inner, and the upper like the lower[a]; when you make the male and the female into a single one, so that the male is not male and the female is not female; and when you make eyes in place of an eye, a hand in place of a hand, a foot in place of a foot, and an image in place of an image—then you will enter the Kingdom.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Upper” and “lower” may also carry the sense of heaven and earth.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: being suckled
  simplified_phrase: being breastfed
  preserved_meaning: The little ones are feeding at the breast.
  reasoning_layer_used: The lexical decision identifies a specific breastfeeding verb.
  rationale: “Breastfed” is clearer modern English than “suckled.”
- pob_phrase: Shall we, being little ones, enter the Kingdom?
  simplified_phrase: Must we be little ones to enter the Kingdom?
  preserved_meaning: The question links being little ones with entering without deciding whether the disciples already are little ones or must become so.
  reasoning_layer_used: The applied grammar revision and retained POB alternative together guard the question’s ambiguity.
  rationale: The wording is natural while avoiding an unwarranted claim about the disciples’ present state.
- pob_phrase: Jesus said to them ... then you will enter the Kingdom
  simplified_phrase: Jesus replied ... then you will enter the Kingdom
  preserved_meaning: All the paired images remain conditions preceding entry into the Kingdom.
  reasoning_layer_used: The POB translation and lexical decisions preserve each contrast and body image.
  rationale: Paragraphing and lighter reporting language improve flow without interpreting the images.
translation_notes:
  risk_flags:
  - risk: The sequence of unity images remains intentionally difficult to interpret.
    mitigation: The draft preserves each distinct image without assigning it a doctrinal meaning.
  - risk: “Upper” and “lower” may carry a heaven-and-earth sense.
    mitigation: The footnote preserves that lexical possibility without making it the main reading.
