translation:
  language: en
  text: '1. Therefore, I am the perfect Providence of all that exists. I changed myself into my own seed, for I existed first. I traveled every path, for I am the wealth of the light.


    2. I am the memory of the Fullness. Yet I entered the realm of darkness and continued until I reached the center of the prison. The foundations of Chaos trembled. Because they were evil, I hid from them, and they did not recognize me.


    3. I returned a second time and traveled throughout that realm.


    4. I came forth from those who belong to the light—the light that I am. I am the memory of Providence.


    5. I entered the heart of the darkness and the depths of Hades as I carried out my mission. The foundations of Chaos trembled and were about to collapse upon those who live there and destroy them. So I quickly returned upward to my root in the light, so that they would not be destroyed before their time.


    6. Then I went out a third time. I am the light within the light and the memory of Providence. I entered the heart of the darkness and the depths of Hades. I filled my face with the light that marks the completion of their age. Then I entered the center of their prison—the prison of the body—and said, “Whoever hears, rise from your deep sleep!” He wept, and tears streamed down his face.


    7. He wiped away his bitter tears and said, “Who is calling my name? Where has this hope come from while I am bound in this prison?”


    8. I answered, “I am the Providence of the pure light.


    9. I am the thought of the virgin Spirit, who raises you to the place worthy of praise.


    10. Rise and remember that you are the one who listened. Follow your root, which is me, the Merciful One. Guard yourself from the angels of destitution, the demons of Chaos, and all who would trap you. Beware of deep sleep and imprisonment in the depths of Hades.”


    11. Then I raised him up and sealed him with the light of the water of the five seals.[a] From that time on, Death would not overpower him. And now I will ascend to the perfect realm.'
