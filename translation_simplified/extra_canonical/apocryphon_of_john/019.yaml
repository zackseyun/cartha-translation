translation:
  language: en
  text: '1. I asked, “Lord, where did the vile spirit come from?”


    2. He answered, “The Mother-Father overflows with mercy. This is the holy Spirit in every form, the one who is merciful and compassionate toward all of you—the Reflection of Radiant Providence. This Spirit raised up the offspring of the perfect race, their understanding, and the Man’s eternal light.


    3. When the chief ruler[a] realized that they stood higher than he did and had greater understanding, he wanted to grasp their purpose. He did not realize that their understanding surpassed his and that he could not grasp them.


    4. He plotted with the authorities who served as his powers, and together they committed adultery with Sophia. From them came bitter Destiny, the final and unstable chain. Though it constantly shifts, it is more lasting and powerful than Sophia, with whom the gods committed adultery. It is also stronger than the angels, the demons, and every generation down to the present day. From this Destiny came every transgression, injustice, and blasphemy. It also brought the chain of forgetfulness and ignorance, every harsh command joined with grievous wrongdoing, and crushing fears.


    5. In this way all creation was blinded so that people would not know the God who rules over all. Because forgetfulness held them like a chain, their sins were hidden. They are bound by measures, times, and moments, because Destiny rules over the whole world.


    6. Then the chief ruler regretted everything that had happened because of him.


    7. So he plotted to flood the human race. But the greatness of radiant Providence warned Noah. Noah proclaimed the warning to all humanity, but those who were strangers to him would not listen.


    8. It did not happen as Moses said: ‘They hid in an ark.’ Instead, they hid in a certain place. Noah was not alone; many others from the race that cannot be moved[b] hid there too.


    9. They entered that place and hid inside a radiant cloud. Noah was aware of his authority, and the woman who belongs to the light went with him.


    10. She shone upon them because the chief ruler had covered the whole earth in darkness. He had made this plot with his powers.


    11. Then he sent his angels to the daughters of men. They were to take women for themselves and produce offspring for their own pleasure, but at first they failed.


    12. When they did not succeed, they gathered again and made another plot.


    13. They created a vile spirit that resembled the Spirit who had come down, intending to use it to defile souls. The angels changed their appearance to look like the women’s partners. They filled the women with the spirit of darkness, which they had mixed with evil for them.


    14. They offered gold and silver, gifts of copper and iron, and objects made from every kind of metal. With countless tricks they led their followers astray and brought them into great trouble.


    15. These people grew old without ever enjoying any pleasures.


    16. They never found the truth or came to know the true God, and they died. In this way all creation fell into slavery that has lasted through the ages, from the foundation of the world until now.


    17. The angels also chose women and fathered children from the darkness, children who reflected the nature of their own spirit. They closed their hearts and made themselves hard through the hardness of the vile spirit. This continues even now.”'
