translation:
  language: en
  text: '2. Then they used their own powers to create, each according to the attributes assigned to him. Each authority contributed an attribute based on the form of the image he had seen in its psychic dimension.[a]


    9. A host of angels attended him. They received from the authorities the seven substances of the life-soul. With these, they formed the limbs and torso in their proper sizes and made all the body’s parts work together properly.


    10. … These were especially active in the body’s parts: Diolimodraza in the head; Yammeax in the neck; Yakoubib in the right shoulder and Yerton in the left; Oudidi in the right hand and Arbao in the left; Lampno in the fingers of the right hand and Leekaphar in those of the left; Barbar in the right breast and Imae in the left; Pisandraptes in the chest; Koade in the right shoulder joint and Odeor in the left; Asphixix in the right ribs and Synogchouta in the left; Arouph in the belly; Sabalo in the womb; Charcharb in the right thigh and Chthaon in the left; Bathinoth in all the genitals; Choux in the right leg and Charcha in the left; Aroer in the right shinbone and Toechtha in the left; Aol in the right knee and Charaner in the left; Bastan in the right foot and Archentechtha in its toes; Marephnounth in the left foot and Abrana in its toes.


    17. The mother of them all is Esthensis-Ouch-Epi-Ptoe.


    23. Insight into their reality comes from Anaro, the chief of the material soul.[b] It relates to the seven senses and to Ouch-Epi-Ptoe.


    27. I have not listed them for you. If you want to know who they are, all this is written in the Book of Zoroaster.'
