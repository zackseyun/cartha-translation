translation:
  language: en
  text: 'Sophia of Reflection, who was an aeon, conceived a thought on her own, along with the conception of the unseen Spirit and Precognition.


    She wanted to produce a likeness from herself. But she acted without the Spirit''s agreement or approval, apart from her companion, and without his counsel. Her male counterpart had not agreed either.


    Though she had not found her companion, she acted without the Spirit''s agreement and without her companion''s knowledge. Because an unconquerable power lived within her, her thought did not remain fruitless. She produced from herself a being who was incomplete and unlike her. Because she had made him without her companion, his form differed from his mother''s.


    When she saw what her own will had produced, he changed into a dragon with a lion''s face. His eyes were like flashes of fiery lightning.


    She thrust him away from her, outside those realms, so that none of the immortal beings would see him, for she had created him in ignorance. She surrounded him with a shining cloud and set a throne in its midst. No one could see him except the holy Spirit, whose name is the Mother of the Living. Sophia named him Yaltabaoth.


    He is the chief ruler, who received great power from his mother. He broke away from her and left the realms where he had been born.'
