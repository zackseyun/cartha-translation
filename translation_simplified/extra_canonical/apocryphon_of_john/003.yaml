translation:
  language: en
  text: '1. [I also] asked to [understand this]. He answered me, “The Monad [is a unity, with nothing] above it.


    2. [It exists] as [God] and as the Father of All. He is [unseen] and above [all things]. He is indestructible, [a] pure light that no [eye] can look upon.


    3. He [is the] unseen [Spirit]. It is not right to think of him merely as a god or as anything comparable, for he is more than a god. Nothing is above him, and no one rules over him.


    4. He does not exist inside anything beneath him. Instead, [everything] exists within him, for he exists by his own power.


    5. [He is eternal] and needs nothing, for he is perfect in every way.


    6. [He lacks nothing] that could make him more perfect.


    7. [Instead], he remains forever completely perfect in [light].


    8. He has no limits, for no one existed [before him] who could set limits on him.


    9. No one can fathom him, for no one existed before him who could do so.


    10. He cannot be measured, for no one [existed before him who could measure] him.


    11. [He is unseen, for no] one has seen [him].


    12. [He is eternal], for he exists forever.


    13. Words cannot express him, for no one existed who could fully conceive of him and then speak [of him].


    14. He cannot be named, for [no one existed before him] who could name [him].


    15. He is [light beyond measure]—pure, holy, and [unstained].


    16. Words cannot express him. He exists in [perfect] indestructibility.


    17. He is not confined within perfection, blessedness, or divinity. He is exalted above them all.


    18. He is neither bodily [nor] nonbodily.


    19. He is neither large [nor] small.


    20. [It is impossible] to say how much of him there is or what qualities he has, because no one can [understand him].


    21. He is not one being among [other beings]. He is highly exalted, not by comparison with anything else, but in himself.


    22. He does not share in the aeons[a] or in time, because anyone who shares in [an aeon] shares in something already established [...].


    23. No measure of time was assigned to him. He receives nothing from another, as though it were a loan. The one who exists before all others has no need to receive anything from [another].


    24. He gazes upon himself, waiting in [his] light, for the [...] is glorious.


    25. Boundless purity belongs to him.


    26. He is an aeon who gives aeons.


    27. He is [life] and gives life.


    28. He is blessed and gives blessedness.


    29. He is knowledge and gives knowledge.


    30. [He is] goodness and gives goodness.


    31. [He is] mercy and redemption, and he gives mercy.


    32. He is grace and gives grace.


    33. This is [not] because it belongs to him, but because he gives [the light] beyond measure and understanding.


    34. [How can I speak] to you about him? His [aeon] cannot be destroyed. It remains at rest and abides in [silent repose]. It existed before [everything]. He is the leader of [all] aeons, and through his goodness he gives them strength.”'
