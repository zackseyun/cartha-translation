translation:
  language: en
  text: 'All the angels and demons worked until they had formed a body endowed with soul.[a] But for a long time their creation lay completely lifeless and still.


    The mother wanted to recover the power she had given to the chief ruler. So she pleaded with the Most Merciful Mother-Father of All.


    By a sacred decree, he sent the five lights down to where the chief ruler’s angels were. They advised the ruler to bring out the mother’s power. They said to Yaltabaoth, “Blow your Spirit into his face, and his body will rise.” So he blew his Spirit into the man’s face. This Spirit was the power of his mother.


    Yaltabaoth did not understand what he was doing, because he lives in ignorance. The mother’s power passed out of him and entered the body they had formed in the image of the One who exists from the beginning.


    The body moved, grew strong, and shone with light. Then the other powers became jealous. The man had come into being through all of them, and they had given their power to him. Yet his understanding surpassed both theirs and that of the chief ruler.


    They saw that he shone with light, could reason better than they could, and was free from evil. So they seized him and threw him down into the lowest depths of the material world.


    But the Blessed One—the kind and merciful Mother-Father—had compassion on the mother’s power that had come out of the chief ruler. The rulers might otherwise gain control over the body with its soul and senses. So, through his gracious Spirit and great mercy, he sent Adam a helper who comes from him. She is Radiant Reflection, called “Life.”


    She works alongside Adam to help all creation. She restores him to his full perfection and teaches him about the descent of his offspring and about the path of ascent, the path by which it descended.


    Reflection of Light was hidden within Adam so that the rulers would not know she was there. This Reflection would repair what the mother lacked. Because of the light-shadow within him, the man became visible, and his understanding surpassed that of all who had made him.'
