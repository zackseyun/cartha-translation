translation:
  language: en
  text: 'He looked into Barbelo with the pure light that surrounds the unseen Spirit and with his own spark. From him, she conceived.


    He brought forth a spark of light through a light like blessedness, though that light did not equal his greatness.


    This was the only-begotten one who came from the Mother-Father: his only offspring, the Father’s only-begotten one, the pure light.


    The unseen, virgin Spirit rejoiced over this light who had come into being. He had come forth from the first power of the Spirit’s Providence, which is Barbelo.


    The Spirit poured his anointing over him until he was perfect and lacked nothing of that anointing. The Spirit attended him as he poured it over him. As soon as the anointed one received from the Spirit, he praised the holy Spirit and the perfect Providence, because of whom he had come forth.


    The anointed one also asked for a fellow worker, Mind, and the unseen Spirit gladly agreed.


    When the unseen Spirit agreed, Mind came forward and attended Christ, the Anointed One, praising him and Barbelo. Then they all came to dwell in silence.


    Mind desired to make something through the Logos of the unseen Spirit. His potential Will became actual and came forward with Mind and Light, praising him.


    The Logos followed Will, for through the Logos, Christ—the self-generated God—created the totality of all things.'
