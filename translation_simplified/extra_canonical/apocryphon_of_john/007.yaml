translation:
  language: en
  text: '1. Eternal Life, together with his Will, and Mind, together with Precognition, stood before the unseen Spirit and Barbelo and praised them. They had come into being because of Barbelo.


    2. The holy Spirit, together with Barbelo, also brought his Son, the self-generated God, to completion, so that he would stand before the great, unseen, virginal Spirit of the self-generated God, the Christ, whom he had praised with a loud voice.


    3. He came forth through Providence. Then the unseen, virginal Spirit appointed the truly self-generated God over the All.


    4. The Spirit placed every authority under him and put truth within him, so that he would know the All. He was given a name higher than every other name. That name will be spoken to those who are worthy of it.


    5. From the Light, who is Christ, and from Indestructibility, through the Spirit’s gift and the four [great] lights from the self-generated God [...]. He waited for them to stand before him:


    6. the three—Will, Idea, and Life—


    7. and the four powers—Understanding, Grace, Perception, and Discretion.


    8. Grace belongs to Armozel, the light-aeon[a] and first angel. Three other aeons are with this aeon: Grace, Truth, and Form.


    9. The second light is Oriael, who was appointed over the second aeon.


    10. Three other aeons are with him: Reflection, Perception, and Memory.


    11. The third light is Daveithai, who was appointed over the third aeon. Three other aeons are with him: Understanding, Love, and Ideal Form.


    12. The fourth light, Eleleth, was appointed over the fourth aeon.


    13. Three other aeons are with him: Perfection, Peace, and Sophia.


    14. These are the four lights who stand before the self-generated God.


    15. These are the twelve aeons who stand before the Son of the Mighty One—the self-generated Christ—through the will and gift of the unseen Spirit. The twelve aeons belong to the self-generated Son.


    16. Everything was established through the will of the holy Spirit and through the self-generated one.'
