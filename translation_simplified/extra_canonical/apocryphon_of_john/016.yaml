translation:
  language: en
  text: 'Reflection of Light then hid inside him. The chief archon, the ruler, wanted to pull her out from his rib. But Reflection of Light cannot be seized.


    The darkness chased her but could not catch her. So the archon took part of the man’s power and made another form shaped like a woman. He modeled it on the Reflection who had appeared to him. He placed the part taken from the man’s power inside this female form—not “his rib,” as Moses said. Then the man saw the woman beside him.


    At that moment, Radiant Reflection appeared again. She removed the veil covering his mind. His mind became clear after the darkness had made him drunk. He recognized the woman as the matching image of himself and said, “This is surely bone of my bones and flesh of my flesh.


    Therefore the man will leave his father and his mother. He will hold fast to his wife, and the two will become one flesh.” This was because his companion would be sent to him. He would leave his father and his mother—even Sophia, our sister, who came down in innocence to correct what she lacked. Because of this, she was called “Life,” who is “the mother or the living”—through the Providence of Heaven’s rule and through [the Reflection who appeared] to him. Through her, they tasted perfect knowledge.'
