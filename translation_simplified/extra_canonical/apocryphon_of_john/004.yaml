translation:
  language: en
  text: '1. This is because we do not understand [things that cannot be spoken], and we cannot grasp what [cannot be measured].[a] We cannot understand them apart from the one who came [from] him—that is, [the] Father—for he alone [explained] them to us. He contemplates him[self] within the light surrounding [him], the spring [of] living water. He supplies [every aeon]. As he looks in every direction at once into the spring of the [Spirit], he sees his own image.


    2. He places his desire within his [luminous water], in the spring of [pure, radiant water] surrounding him. Then [his thought, which had existed only as a possibility, became] real. She came forward—the one who had [appeared] before him in [the radiance of] his light.


    3. She is the first [power]. She existed before the All and [came] from his mind.


    4. She [is the Providence of the All]. Her light [shines like his] light. She is the [perfect] power and the image of the perfect, unseen, virginal Spirit.


    5. [This first power] is the glory of Barbelo: the perfect glory within the aeons, the glory of revelation.[b]


    6. She exalted the virginal Spirit and praised him because she had come forth on account of him.


    7. She is the first thought, his image.'
  philosophy: optimal-equivalence
