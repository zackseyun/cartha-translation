- pob_phrase: the group of archons
  simplified_phrase: all the rulers
  preserved_meaning: The hostile governing beings remain a distinct group acting against Adam.
  reasoning_layer_used: POB text and immediate narrative context
  rationale: The common word “rulers” makes the archons’ recurring role clear.
- pob_phrase: the tomb for the mold of the body that the robbers used to clothe the man, the chain of oblivion
  simplified_phrase: This bodily form was a tomb. The robbers clothed the man with it like a chain that made him forget
  preserved_meaning: The body remains both a death-bound covering and an instrument of forgetfulness.
  reasoning_layer_used: POB imagery
  rationale: Short clauses retain the tomb, clothing, and chain images while clarifying their relationship.
- pob_phrase: he caused his perception to sleep
  simplified_phrase: it was Adam’s perception that he caused to sleep
  preserved_meaning: The trance dulls Adam’s awareness rather than merely describing physical sleep.
  reasoning_layer_used: POB contrast with Moses and prophetic quotation
  rationale: Naming Adam resolves the pronoun without changing the stated interpretation.
interpretive_expansions:
- pob_phrase: the one whose origin is in matter
  rendering: This material human form came from matter
  claim: The matter-origin statement describes Adam in his newly formed material condition.
  evidence:
  - The preceding clause describes forming Adam from earth, water, fire, and wind.
  - The next sentence calls this form a bodily tomb.
  confidence: moderate
  alternatives_preserved:
  - The phrase may refer specifically to the material body.
  - The phrase may encompass the material human condition more broadly.
- pob_phrase: he was aware that he was disobedient to him
  rendering: The chief ruler knew that Adam was disobedient to him
  claim: The chief ruler is the one who knows, and Adam is the one who disobeys.
  evidence:
  - The clause compares Adam’s understanding with that of the chief ruler.
  - The ruler then seeks to recover the power given to Adam.
  confidence: moderate
  alternatives_preserved:
  - The unresolved source pronouns may permit another grammatical assignment.
