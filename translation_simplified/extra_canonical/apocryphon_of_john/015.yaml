translation:
  language: en
  text: '1. When the rulers looked down, they saw that Adam’s understanding was greater than theirs. So they gathered to make plans with all the rulers and angels.


    2. They took fire, earth, and water and mixed them with the four fiery winds. They churned them together with a great noise. Then they brought Adam into the shadow of death so that they could form him again from earth, water, fire, and wind. This material human form came from matter—from dark ignorance, lust, and their false spirit.


    3. This bodily form was a tomb. The robbers clothed the man with it like a chain that made him forget, and he became mortal.


    4. He was the first to descend and the first to be separated. But Reflection of Light lived within him and awakened his understanding.


    5. Then the rulers brought him into paradise and told him, “Eat.” By this they meant that he should remain idle. Their pleasure is bitter, their beauty is corrupt, and their delight is deception. Their trees produce godlessness, their fruit is poison that cannot be cured, and their promise ends in death.


    6. They had placed their own tree of life in the middle of paradise. I will teach you all the mystery of their life: it is the plot they devised together, and it reflects what their spirit is like.


    7. Its root is bitter, and its branches bring death. Its shade is hatred, and deception lives among its leaves. Its blossom is an evil anointing, its fruit is death, and its seed is lust. It sprouts in darkness.


    8. Those who taste it will live in Hades, and darkness will be their place of rest.


    9. The rulers stood in front of what they call “the tree of the knowledge of good and evil”—the tree that is Reflection of Light. They did this so that Adam could not look toward his perfection or recognize the shame of his nakedness. But I was the one who caused them to eat.”


    10. I asked the Savior, “Lord, was it not the serpent who instructed Adam to eat?”


    11. The Savior smiled and said, “The serpent taught them to partake of the evil of sexual lust and destruction, so that he could exploit Adam.


    12. The chief ruler knew that Adam was disobedient to him because Reflection of Light lived within Adam and made his understanding clearer than the ruler’s own. So the ruler wanted to take back the power he had given Adam, and he caused a ‘trance’ to come over him.”


    13. I asked the Savior again, “What is this ‘trance’?”


    14. He answered, “It is not as Moses wrote or as you have heard. In his first book Moses said, ‘He caused him to sleep.’ But it was Adam’s perception that he caused to sleep. As he said through the prophet, ‘I will make their hearts dull, so that they do not pay attention or see.’”'
