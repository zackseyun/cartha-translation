translation:
  language: en
  text: 'I appeared as an eagle in the tree of knowledge. This tree is the Reflection of the Providence of Pure Light. I came to teach them and wake them from their deep sleep, because they had both fallen and knew they were naked.


    Reflection appeared to them as light and awakened their minds. But when ‹Y›aldabaoth realized that they had turned away from him, he cursed his earth.


    He found the woman as she was preparing herself for her husband.


    He ruled over her, though he did not understand the mystery brought about by the sacred decree. They were afraid to accuse him. He showed his angels the ignorance within him. Then he drove them out of paradise and clothed them in deep darkness.


    The chief archon,[a] the highest of the ruling powers, saw the virgin standing near Adam. He also saw that the radiant Reflection of Life had appeared within her. ‹Y›aldabaoth was filled with ignorance. When the Providence of the All saw this, she sent messengers, and they quickly removed Life from Eve.


    Then the chief archon defiled Eve and fathered two sons with her, the first and the second: Eloim and Yave.


    Eloim has the face of a bear, while Yave has the face of a cat.


    Yave is just, but Eloim is unjust.


    Yave was given authority over fire and wind, while Eloim was given authority over water and earth. But the chief archon meant to deceive, so he called them Cain and Abel.


    Sexual intercourse has continued to this day because of the chief archon. He planted sexual desire in the woman who belongs to Adam. Through intercourse, he made copies of the bodies and breathed his false spirit into the copies.


    He placed these two archons over several domains so that they would rule over the tomb.


    But when Adam recognized the image of his own foreknowledge, he fathered an image of the Son of Man. He named him Seth, following the pattern of the race among the aeons.[b]


    In the same way, the mother sent down her spirit, which resembles her. She also sent an image of the one who lives in the Fullness.[b] She will prepare a dwelling place for the aeons who will descend.


    He also made them drink the chief archon’s water of forgetfulness so that they would not know where they came from.


    In this way, the seed remained for a time to give help. When the Spirit comes from the sacred aeons, he will raise him up and heal him of his deficiency. Thus the entire Fullness will become holy and without fault.”'
