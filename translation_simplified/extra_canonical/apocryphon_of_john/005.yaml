translation:
  language: en
  text: '1. She became the womb of all, because she exists before them all. She is the Mother-Father, the Primal Human, the holy Spirit, the triple-male, the triple-powerful, the triple-named androgynous one, the eternal aeon among the unseen ones, and the first to come forth.


    2. She asked the unseen, virginal Spirit—that is, Barbelo—to give her Precognition, and the Spirit agreed.


    3. When he had [agreed], Precognition came forward and took her place beside Providence, who comes from the Idea of the unseen, virginal Spirit.


    4. She praised him [and] his perfect power, Barbelo, because they had come into being on account of her.


    5. Once again she asked him to give her [Indestructibility], and he agreed.


    6. When he had [agreed], Indestructibility [came forward] and took her place beside Idea and Precognition.


    7. She praised the unseen one and Barbelo, on whose account they had come into being.


    8. Barbelo also asked him to give her Eternal Life, and the unseen Spirit agreed. When he had agreed, Eternal Life came forward.


    9. They [took their places] and praised the unseen [Spirit] and Barbelo, on whose account they had come into being.


    10. Once again she asked him to give her Truth. [He agreed], and [when he had] agreed,


    11. Truth came forward. They took their places and praised the unseen, admirable Spirit and his Barbelo, on whose account they had come into being.


    12. This is the aeonic pentad of the Father,[a] which is the Primal Human, the image of the unseen Spirit.


    13. This is Providence—that is, Barbelo—together with Idea, Precognition, Indestructibility, Eternal Life, and Truth.


    14. This is the androgynous aeonic pentad, which is also the aeonic decad—the Father.'
  philosophy: optimal-equivalence
