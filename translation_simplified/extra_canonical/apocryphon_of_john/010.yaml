simplification_decisions:
- pob_phrase: He grasped and created additional aeons for himself with a shining spark that exists (even) now.
  simplified_phrase: He grasped and, with a shining spark that still exists, created more aeons for himself.
  preserved_meaning: He grasped something and created additional aeons by means of a shining spark that continues to exist.
  reasoning_layer_used: POB text, witness wording, and grounding review
  rationale: The reordered clause is easier to follow without making the spark the certain object of “grasped.”
- pob_phrase: he begot authorities for himself
  simplified_phrase: he gave birth to rulers for himself
  preserved_meaning: He produced the subordinate ruling beings who are named in the following list.
  reasoning_layer_used: POB source image and immediate context
  rationale: “Gave birth” preserves the birth image, while “rulers” makes the beings’ role clearer.
- pob_phrase: whom the generations call [the Reaper]
  simplified_phrase: whom people through the generations call [the Reaper]
  preserved_meaning: People in successive generations use this title for Athoth.
  reasoning_layer_used: POB text and witness wording
  rationale: Adding “people” makes the compressed expression immediately understandable.
