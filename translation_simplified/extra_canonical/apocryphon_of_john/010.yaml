  language: en
  text: '1. He grasped and, with a shining spark that still exists, created more aeons for himself. He was amazed and filled with inner pride, and he gave birth to rulers for himself.


    4. The first is named Athoth, whom people through the generations call [the Reaper].


    5. The second is Harmas, [the evil eye].


    6. The third is Kalila-Oumbri.


    7. The fourth is Yabel.


    8. The fifth is Adonaiou, also called Sabaoth.


    9. The sixth is Cain, whom generations of humanity call the Sun.


    10. The seventh is Abel.


    11. The eighth is Abrisene.


    12. The ninth is Yobel. «11»


    13. The tenth is Armoupieel.


    14. The eleventh is Melcheir-Adonein.


    15. The twelfth is Belias, who rules over the depths of Hades.'
