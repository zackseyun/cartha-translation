- pob_phrase: It [was not a diverse entity] in front of me
  simplified_phrase: I was not seeing several separate beings
  preserved_meaning: The changing forms belong to one appearance, not to separate entities.
  reasoning_layer_used: Immediate narrative context and POB base text
  rationale: The recast wording makes the contrast with the three forms clear.
- pob_phrase: the [unmoving race of] the [Perfect Man]
  simplified_phrase: the people of the unmoving race of the Perfect Man
  preserved_meaning: The passage identifies a distinct group as the unmoving race associated with the titled Perfect Man.
  reasoning_layer_used: POB base text and grounding review
  rationale: Adding “people of” aids readability while retaining the unusual group-category “unmoving race.”
