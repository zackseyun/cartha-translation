translation:
  language: en
  text: 'Immediately, as I was thinking about these things, the heavens opened. Everything under heaven shone, and the world shook.[a]


    I became afraid. Then I saw a child standing near me within the light. As I watched, the child took on the likeness of an old man. Then his appearance changed again, and he looked like a son.


    I was not seeing several separate beings. Instead, one appearance within the light had several forms. The forms appeared through one another, and the appearance had three forms.


    He asked me, “John, John, why are you amazed, and why are you afraid? Is this appearance unknown to all of you? Do not lose heart. I am the one who is always with all of you.


    “I am the Father. I am the Mother. I am the Son. I am the one who is pure and undefiled.


    “I have now come to tell you what is, what was, and what will happen. Then you may understand both what is still hidden and what has been revealed. I will also tell you about the people of the unmoving race of the Perfect Man.


    “So lift up your face and receive what I will tell you today. Then pass it on to your fellow spirits who belong to the unmoving race of the Perfect Man.”'
