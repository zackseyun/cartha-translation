translation:
  language: en
  text: '“I have now told you everything for your sake. I told you all this so that you may write it down and pass it on secretly to your fellow spirits, because this is the mystery of the unmoving race.”


    The Savior entrusted these sayings to John so that he would write them down and keep them hidden. He told him, “Cursed is anyone who trades these sayings for anything—food, drink, clothing, or anything similar.”


    The sayings were entrusted to John in secret. Then the Savior suddenly vanished from his sight. John went to his fellow disciples and told them what the Savior had said to him.


    Jesus Christ. Amen.


    The Secret Writing According to John'
