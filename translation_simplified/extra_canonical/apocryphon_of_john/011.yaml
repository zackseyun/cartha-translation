translation:
  language: en
  text: 'He also appointed seven kings, one for each heavenly dome above the seven heavens. He appointed five more over the depths of the abyss. They were to rule.


    He shared his fire with them, but he did not give them any of the power of the light he had received from his mother, because he is darkness without understanding. When light mixed with darkness, the darkness began to shine. When darkness mixed with light, the light grew dark. The mixture became neither light nor darkness, but gloom.


    This weak ruler, the archon, has three names: Yaltabaoth, Saklas, and Samael. He is wicked because of the pride within him. He said, “I am God, and there is no god besides me.” Yet he does not know the source of his own power or the place he came from.


    The archons also created seven powers for themselves. Each power then created six angels, until there were 365 angels. These are the bodily forms linked with their names:


    The first is Athoth, who has the face of a sheep. The second is Eloaiou, who has the face of a donkey. The third is Astaphaios, who has the face of a [hyena]. The fourth is Yao, who has the face of a seven-headed [dragon]. The fifth is Sabaoth, who has the face of a dragon. The sixth is Adonin, who has the face of a monkey. The seventh is Sabbede, who has the face of glowing fire.


    These are the sevenfold pattern of the week.


    Yaltabaoth, however, had a multitude of «12» faces—more than all the others. When he was among the seraphs, he could take on any face he wished in front of them.


    Because he shared his fire with them, he became their ruler.


    He possessed glorious power from his mother’s light. Because of this, he called himself God and disobeyed the place he came from.


    In his thought, he joined the seven powers with the authorities who were with him. When he spoke, what he said came to pass. He named each power, beginning with the highest:


    The first is Goodness, with the first authority, Athoth. The second is Providence, with the second authority, Eloaio. The third is Divinity, with the third authority, Astraphaio. The fourth is Lordship, with the fourth authority, Yao. The fifth is Kingdom, with the fifth authority, Sabaoth. The sixth is Jealousy, with the sixth authority, Adonein. The seventh is Sophia, with the seventh authority, Sabbateon.


    Each of these also has a heavenly dome corresponding to a heavenly realm.


    They received names that reflect the glory of the heavenly beings, to bring about the [destruction of the] powers. Yet power remained in the names their maker had given them, while the names reflecting the glory of the heavenly beings would mean destruction and weakness for them.


    Thus, each of them has two names.


    [After] creating [everything, he arranged] them to resemble the first heavenly realms that had come into being. In this way, he made them in the likeness of the indestructible beings.


    He had not seen the indestructible beings. Instead, the power he had received from his mother enabled him to form within himself a likeness of the world. He looked at the creation surrounding him and at the host of angels around him, which had come from him. Then he declared to them, “I am a jealous God, and there is no God besides me.”


    But by saying this, he showed the angels who served him that another God exists. If there were no other God, of whom could he be jealous?


    Then the mother began to move back and forth. She recognized what was lacking as the brightness of her light faded. She grew dark because her companion had not agreed with her.'
