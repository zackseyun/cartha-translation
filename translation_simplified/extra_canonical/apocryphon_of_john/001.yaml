translation:
  language: en
  text: '1. This is the Savior’s teaching, the revelation of mysteries, and the words hidden in silence that he taught his disciple John.[a]


    2. One day John, the brother of James—both of them sons of Zebedee—went up to the temple. A Pharisee named Arimanios came to him and asked, “Where is the teacher you were following?”


    3. John answered, “He has returned to the place he came from.”


    4. The Pharisee said, “That Nazarene deceived all of you. He filled your ears with lies and closed your hearts, turning you away from the traditions of your ancestors.”


    5. When I, John, heard this, I left the temple and went toward a mountainous wilderness. I mourned deeply in my heart, asking:


    6. “How was the Savior appointed? Why did his Father send him into the world? Who is the Father who sent him? And what kind of age or realm will we enter?[b]


    7. What did he mean when he told us, ‘The age or realm you will enter cannot be destroyed’?


    8. He did not tell us what that age or realm is like.”'
  philosophy: optimal-equivalence
