translation:
  language: en
  text: 'But they are not revealed in that way.


    They did not exalt themselves or lessen the Father’s glory. They did not think he was small, harsh, or wrathful. Instead, he is free from evil, undisturbed, and sweet. He knows everything before it exists and needs no one to teach him.


    This is the way of those who possess something of the immeasurable Greatness above. They wait only for the Complete One,[a] who is a Mother to them. They do not descend to Hades.[b] There is no envy or groaning among them, and no death within them. They rest in the One who rests. They do not struggle or writhe as they search for Truth. Instead, they themselves are Truth. The Father is in them, and they are in the Father. They are complete and not divided from the One who is truly good. They lack nothing. They rest, refreshed in the Spirit.


    They will listen to their root—their source. They will devote themselves to the things in which they will find their root, and their souls will suffer no loss. This is the place of the blessed. This is their place.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Complete One may also be translated “the Perfect One”; “complete” emphasizes wholeness rather than moral perfection.
    reason: lexical_alternative
  - marker: b
    text: Hades is the realm of the dead, not necessarily the later idea of hell.
    reason: cultural_note
