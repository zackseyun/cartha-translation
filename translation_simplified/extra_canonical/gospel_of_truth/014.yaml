translation:
  language: en
  text: 'The Father’s name is the Son. The Father first gave a name to the one who came from himself—being himself—and brought him forth as a Son. He gave him the name that was his own. Everything around the Father belongs to him: the name is his, and the Son is his.


    He can be seen, but the name is invisible. The name alone is the mystery of the invisible; it comes to ears completely filled with it by him. The Father’s name is not spoken; it is revealed through a Son.


    This is why the name is great. Who can speak the great name except the one to whom it belongs and the children of the name? The Father’s name rests in them, and they in turn rest in his name.


    The Father was not begotten. Before he brought forth the aeons, he alone brought forth the Son for himself as a name. In this way, the Father’s name would be over them as Lord. This is the true name, established by his command with complete power. His name does not come from words or from the act of naming. It is invisible.


    He gave a name to him alone—the one who is. The one who does not exist has no name to receive. What name could anyone give to one who does not exist? But the one who is also exists with his name. He alone knows it, and he has given a name to him alone.


    This is the Father; his name is the Son. He did not hide it within himself; rather, it was. The Son alone gave a name. The name belongs to the Father, for the Father’s name is the Beloved Son. Where else could he find a name except from the Father?


    But surely someone will ask another person, “Who will give a name to the one who existed before him?”—as though children do not receive names from those who brought them forth.


    First, then, we should consider what the name is. It is the true name, the name from the Father, because it is the proper name. He did not receive the name on loan as others do, according to the form in which each is brought forth. This is the proper name; no one else gave it to him. Rather, he is unnameable, ineffable, and indescribable—until the time when the Perfect spoke about him alone, the one who has the power to speak his name and to see him.


    When it pleased him that his Beloved name should be the Son, he gave the name to the one who came from the Depth. He revealed his secrets, knowing that the Father is without envy. For this reason, he brought him forth so that he might speak about the Place and the resting place from which he had come. He also brought him forth to glorify the Pleroma—the divine Fullness—the greatness of his name, and the Father’s sweetness.'
