translation:
  language: en
  text: 'What, then, did he want them to think? He wanted them to think that they had become like a shadow and a phantom of the night.


    When light shines on the terror they had received, it proves to be nothing. In this way, they did not know the Father, whom they did not see. Terror, disturbance, instability, division, and doubt were at work among them. Many empty illusions also worked among them—things with no real substance. It was as if they were sunk in sleep and found themselves in nightmares.


    In such dreams, they may be running somewhere or unable to escape from someone. They may be fighting or being beaten. They may fall from heights or fly through the air without wings. Sometimes someone is killing them even though no one is chasing them. Or they themselves are killing those around them and are smeared with their blood. Until those going through all these things awaken, they see nothing, because these things are nothing.


    So it is with those who throw off ignorance as if waking from sleep. They no longer treat ignorance or anything it produces as real. They leave it all behind like a dream in the night. They value knowing the Father as they value light. Those who were ignorant lived as though asleep, but those who have come to know live as though awake.


    It is good when someone returns and awakens![a] Blessed is the one who opens the eyes of the blind!


    The Spirit hurried after them to give them life. The Spirit took the hand of the one lying on the ground and raised that person to their feet, because they had not yet risen. The Spirit gave them knowledge of the Father and the revelation of the Son. When they saw him and heard him, he allowed them to taste him and to grasp the beloved Son.'
