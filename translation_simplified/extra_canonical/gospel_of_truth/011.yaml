translation:
  language: en
  text: 'Make the feet of those who stumble steady, and reach out your hand to the sick. Feed the hungry and give rest to the weary. Help those who want to rise, and awaken those who sleep. For you are Understanding that has been drawn from its sheath. When strength is like this, it grows stronger.


    Pay attention to yourselves. Do not concern yourselves with the other things you have already cast away from yourselves. Do not turn back and eat your own vomit. Do not let moths or worms consume you, for you have already shaken them off. Do not become a house for the Devil, for you have already brought him to nothing. Do not hold up the stumbling-blocks that are already collapsing, as though you were their support. The lawless one is nothing, to be dealt with more severely than the just person, while he carries out his works among others.


    Therefore, do the Father’s will, because you come from him. The Father is sweet, and goodness is in his will. He knows what belongs to you, so that you may find rest in them. People recognize what is yours by its fruits. The Father’s children are his fragrance because they come from the grace of his Face.


    For this reason, the Father loves his fragrance and reveals it everywhere. When it mingles with hylē,[a] he gives his fragrance to the Light. In his quietness, he makes it surpass every form and every sound. Ears do not smell this fragrance; the Spirit smells it, draws it to himself, and sinks into the Father’s fragrance. Then he shelters it and leads it back to the place it came from—to the first fragrance, which had grown cold.


    It is something within a soul-endowed formation, like cold water that has sunk into a clod of loose earth. Those who see it think it is only earth, but afterward it dissolves again. If a breath draws it, it becomes warm. In the same way, the fragrances that are cold come from division.


    Because of this, Faith came. Faith dissolved the division and brought the Pleroma,[b] warm with agapē,[c] so that the cold would not return, but rather the unity—the monad—of the Thought of perfection.[d] This Logos made it visible.[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hylē is a technical term for matter.
    reason: source_note
  - marker: b
    text: Pleroma means “Fullness.”
    reason: source_note
  - marker: c
    text: Agapē means “love.”
    reason: source_note
  - marker: d
    text: Monad means unity or oneness.
    reason: source_note
  - marker: e
    text: Logos means “Word.”
    reason: source_note
