translation:
  language: en
  text: 'Jesus, whose sweetness has no limit.


    The Father revealed his bosom, and his bosom is the Holy Spirit. He revealed what was hidden within himself: his Son. He did this so that, through the Father’s mercy, the Aeons[a] might know him, stop searching for the Father, and rest in him, knowing that this is the Rest.


    The Father filled what was lacking and dissolved its appearance. That appearance is the world in which the deficiency had been at work. Wherever there is envy and conflict, there is deficiency; but where there is Unity, there is completion. The deficiency arose because the Father was not known. Therefore, when the Father is known, the deficiency will cease to exist. A person’s ignorance dissolves when knowledge comes, just as darkness dissolves when light appears. In the same way, completion dissolves the deficiency. From then on, its appearance is no longer seen, and it will be dissolved in the harmony of Unity.


    For now, their works remain scattered. But in time, Unity will bring the Aeons to completion. Within Unity, each one will receive their own self. Within Knowledge, they will be purified from multiplicity and brought into Unity. Like fire, they will consume the matter[b] within themselves; darkness will be consumed by light, and death by life. If these things have truly happened to each of us, we must give thought to the All, so that this house may be holy and still for the sake of Unity.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Aeons” is a technical term for beings or realms in Valentinian thought.
    reason: cultural_note
  - marker: b
    text: “Matter” is retained as a technical Valentinian term.
    reason: simplification_note
