translation:
  language: en
  text: 'He is the Good, within the Father’s Thought as the Father contemplates.


    Every word formed in his meditation is the work of his Will. These words are spoken in the Light, outside the depths of his Thought, and belong to his Saying. While they were still deep within his Thought, the Logos—the first to come forth—brought them into the open, together with a Mind that speaks the one Word in silent grace. He was called “the Thought” because they were within it before they were revealed outside. So he was the first to come forth when it pleased the will of the one who willed it.


    The Will is what the Father rests in. Nothing happens without him,[a] and nothing happens without the Will of the Father. But his Will cannot be searched out; his trace is the Will. No one can know him by examining him as though they could take hold of him. Rather, whatever he wills—the Will of the Father—is what happens, even if what they see is not pleasing in any way before God.


    The Father knows the beginning and the end of them all. At their end he will greet them face to face. Their end is knowledge of the Hidden One. The Hidden One is the Father, from whom the beginning came forth and to whom all who came forth from him will return. They were revealed for the glory and joy of his Name.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The reference of “him” is difficult; an earlier rendering understood this as “apart from the Will.”
    reason: lexical_alternative
