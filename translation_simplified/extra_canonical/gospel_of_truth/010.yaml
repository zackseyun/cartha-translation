  yaml_path: translation/extra_canonical/gospel_of_truth/010.yaml
  text: 'He is the shepherd who left the ninety‑nine sheep that had not gone astray[a], and he went and sought the one that had wandered. When he found it, he rejoiced over it, because ninety‑nine is a number on the left hand. But when the one is found, the reckoning moves to the right hand. In this way, what needs the one—that is, the whole of the right hand—draws what it needs, taking it from the left hand and transferring it to the right, so that the number becomes a hundred. This is a sign of the sound of these numbers; it is the Father.


    Even on the Sabbath he labored for the sake of the sheep that he found fallen into the pit. He saved the life of the sheep, having brought it up out of the pit, so that you may know in your heart—since you are children of the knowledge of the heart—what the Sabbath is: that on it it is not fitting for salvation to be idle, so that you may speak of the Day which is above, which has no night, and of the Light that does not set, because it is complete. Speak, then, from the heart, for you are the perfect Day, and the light that does not fail dwells within you. Speak of the Truth with those who seek it[b], and of Knowledge with those who have sinned in their Error.'
  footnotes:
  - marker: a
    text: Or 'and he went and sought the one that had wandered in the Error.'.
    reason: previous_rendering
  - marker: b
    text: Or 'for the sake of the sheep that had fallen into the pit.'.
    reason: previous_rendering
