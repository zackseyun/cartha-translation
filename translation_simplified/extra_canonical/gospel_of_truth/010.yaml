translation:
  language: en
  text: 'He is the shepherd who left the ninety-nine sheep that had not strayed and went to search for the one that had wandered away. When he found it, he rejoiced over it. In the ancient way of counting on the hands,[a] ninety-nine belongs to the left hand. But when the one is found, the count moves to the right hand. The right hand needs that one to become complete, so it takes what it needs from the left hand and brings it to the right. Then the number becomes one hundred. This is a sign in the sound of these numbers; it is the Father.


    Even on the Sabbath, he worked for the sake of the sheep he found fallen into a pit. He brought it up from the pit and saved its life. This was so that you—children of knowledge in the heart—might understand in your hearts what the Sabbath is: salvation must not remain idle on it. Speak, then, of the Day above, which has no night, and of the Light that never sets because it is complete. Speak from the heart, for you are the perfect Day, and the Light that never fails lives within you. Speak of the Truth with those who seek it, and of Knowledge with those who have sinned in Error.'
