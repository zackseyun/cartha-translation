translation:
  language: en
  text: 'The names of the Living are written in the Book of the Living.[a]


    They are taught about themselves, and this teaching comes from the Sonship.[b] Then the one who hears can answer, turn back, and look toward the one who called him by name. He does what the caller wills and follows him. The caller declares that those he has named belong to him. Each person understands where he was called from, does the caller’s will, desires to please him, and receives rest. Each person’s name becomes his own.


    Because the All is made complete in him, the All must go up, and each person must receive what belongs to him. He had written them beforehand, preparing them in his thought and will to give to those who came from him.


    Those whom he knew by name beforehand were called at the end. So the one who has knowledge is the one whose name the Father has spoken. The one whose name has not been spoken is ignorant. How can such a person hear if his name has not been called? The one who remains ignorant to the end has been formed by Error and will dissolve along with it. Otherwise, why do these pitiable people have no name? Why do they have no voice?


    Therefore, anyone who has knowledge is from above. When he is called, he hears and answers. He turns to the one calling him, goes up to him, and understands how he is being called. Because he has knowledge, he does the will of the one who called him, desires to please him, and receives rest. His name becomes his own. Such a person knows where he came from and where he is going. He is like someone who, after being drunk, turns away from his drunkenness, comes to himself, and puts everything that belongs to him back in order.


    He has brought many people back from Error. He went ahead of them to the places from which they had moved away. They received Error because of the depth of the one who surrounds every place, though nothing surrounds him. What a great wonder! They were in the Father but did not know him. They could come out on their own, yet they could not grasp or know the one in whom they were. He revealed his will as knowledge, in harmony with everything that came from him.


    This is the knowledge of the Living Book that he revealed to the generations at the end. Its letters come from him. They are not ordinary vowels and consonants that someone might read and dismiss as empty. They are letters of Truth: they speak and know themselves. Each letter is a complete thought, like an entire book. These letters were written by Unity. The Father wrote them so that, through the letters that came from him, the generations might know the Father.'
