translation:
  language: en
  text: 'This is the judgment that came down from above, and it judged everyone. It is a sword with two sharp edges, cutting on both sides. The Word appeared—the Word present in the hearts of those who speak it. It was not merely a sound; it put on a body.


    Then great turmoil arose among the jars. Some were empty, while others were full. Some were provided for, while others were poured out. Some were made clean, while others were broken. Every realm was shaken and thrown into confusion because there was no order or stability.


    Error became anxious and did not know what to do. It grieved, mourned, and struck at itself because it knew nothing. Then Knowledge, which brings Error to an end, approached Error and everything that had come from Error, because Error is empty and has nothing within it.


    Truth came among them, and all who are from Truth recognized Truth. They welcomed the Father in Truth through a complete Power that joins them to the Father. Truth is the Father’s mouth, and the Holy Spirit is his tongue. Anyone joined to the Father’s mouth will receive the Holy Spirit through his tongue.


    This is how the Father reveals and shows himself to his generations. He revealed what had been hidden about himself and made it known. For who has anything except the Father alone?'
