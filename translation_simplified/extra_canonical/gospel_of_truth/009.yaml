translation:
  language: en
  text: 'When he was revealed, he taught them about the Father, the one who cannot be contained. He breathed into them what is in the Thought and carried out his will. Many received the Light[a] and turned to him. But the material ones were strangers to him. They did not see his form or know him. He came in a fleshly form, yet nothing could block his way, because incorruptibility cannot be grasped or held back.


    He spoke new things. He declared what was in the Father’s heart and brought forth the complete Word. The Light spoke from his mouth, and his voice gave birth to life. He gave them Thought, understanding, mercy, salvation, and the Spirit of power. All these came from the Father’s infinity and sweetness.


    He brought punishments and beatings to an end, because they were leading people who needed mercy into Error and captivity. He did away with them and threw them into confusion through Knowledge.


    So he became:


    - a Way for those who had wandered,

    - Knowledge for those who did not know,

    - a Discovery for those who were searching,

    - Strength for those who were wavering,

    - and Purity for those who were defiled.'
  philosophy: optimal-equivalence
