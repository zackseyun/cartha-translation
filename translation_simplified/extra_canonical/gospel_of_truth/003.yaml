translation:
  language: en
  text: 'The Father cannot be contained. He holds the All[a] within himself. The All is in him, and everything needs him. He keeps their wholeness within himself, but not out of jealousy—for how could there be jealousy between him and his members? If the All had already received this wholeness, they could not have come to him. Instead, he keeps it for them and gives it to them so that they may return to him, united in one knowledge, at rest in one body.


    Though he was unknown, he desired to be known and loved—for what did everyone need except knowledge of the Father? He became a peaceful and unhurried guide. He came to places of learning and spoke the Word as a teacher. Those who thought themselves wise came to test him, but he confounded them, for they were vain. They hated him because they were not wise in the Truth.


    After them, the little children also came. The knowledge of the Father belongs to them. When they had been strengthened, they received teaching about what the Father expressed. They knew, and they were known. They received glory, and they gave glory.


    In their hearts the Living Book of the Living was revealed. It was written in the Father’s thought and mind, before the foundation of all, within his incomprehensibility.[b] No one has the power to take this book, because the one who takes it is appointed to be killed. Unless that book appeared, no one among those entrusted with salvation could be revealed.


    For this reason, the merciful and faithful Jesus endured patiently until he took the book, because he knows that his death is life for many. Until a testament—that is, a legal will—has been opened, the wealth of the dead head of the household remains hidden. In the same way, everything remained hidden while the Father of the All was unseen. All things come from him, and every realm comes from him.


    For this reason, Jesus was revealed. He put on the book. He was nailed to a tree. On the cross he made the Father’s decree public.


    What a great teaching! He brought himself down to death and clothed himself with eternal life. He stripped off the perishable rags and put on incorruptibility, which no one can take from him.


    Then he entered the empty places of terror. He passed among those whom forgetfulness had stripped bare. He himself was knowledge and completion, and he proclaimed what is in the heart to those ready to be taught.'
