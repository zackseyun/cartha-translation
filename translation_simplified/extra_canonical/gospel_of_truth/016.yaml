translation:
  language: en
  text: 'As for the others, may they understand where they stand. But I have reached the Place of Rest, so I should say no more. Instead, I will enter it and devote myself without ceasing to the Father of the All and to the true brothers and sisters. The Father’s love has been poured out on them, and there is no deficiency among them.


    They are revealed in the Truth. They live in the true life and speak about the Light, complete and filled with the Father’s seed, that is in his heart and in the Fullness.[a] His Spirit rejoices in it and gives glory to the one in whom it existed, because he is good. His children are complete and worthy of his name, because he is the Father. These are the children he loves.


    [… large gap in the manuscript …]


    Yet some set their minds on toil. They become drunk in seeking, and they lose their senses. But the holy ones are those whose thoughts have not been defiled by wickedness; their thoughts remain within them. For the Logos[b] of Thought searches out what is above—his unsayability—I have [borne or spoken] through the mouth of all: the Good—the Messiah.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Fullness,” also called the Pleroma, is a technical term in this work; the underlying construction leaves open whether “in his heart and in the Fullness” describes the Light or the Father’s seed.
    reason: source_note
  - marker: b
    text: “Logos” can also be translated “Word.”
    reason: lexical_alternative
  - marker: c
    text: The verb is uncertain, and the Coptic ending plays on “Good” and “Messiah” or “Christ.”
    reason: source_note
