  reasoning_layer_used: POB lexical decision on Place of Rest
  rationale: Direct wording clarifies the logic while retaining the technical name.
- pob_phrase: the true siblings
  simplified_phrase: the true brothers and sisters
  preserved_meaning: The family term includes both men and women without adding a possessive relationship.
  reasoning_layer_used: POB translation and immediate context
  rationale: Inclusive family language is more natural for common readers.
- pob_phrase: they become drunk in seeking, and they lose their mind
  simplified_phrase: They become drunk in seeking, and they lose their senses
  preserved_meaning: Their misguided seeking is portrayed as intoxication that destroys sound judgment.
  reasoning_layer_used: POB lexical decision on seeking and source image
  rationale: The concrete intoxication image is retained while the final idiom becomes natural English.
