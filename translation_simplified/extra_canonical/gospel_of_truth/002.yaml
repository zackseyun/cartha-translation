  reasoning_layer_used: POB translation and theological title usage
  rationale: Direct clauses make the title understandable without reducing its force.
- pob_phrase: Error arrayed, with power and with a certain beauty, a substitute for the Truth
  simplified_phrase: It used power and an appearance of beauty to prepare an imitation of the Truth
  preserved_meaning: Personified Error prepares an attractive counterfeit opposed to Truth.
  reasoning_layer_used: POB theological decision on counterfeit beauty
  rationale: The wording clearly presents the beauty as deceptive rather than genuine.
- pob_phrase: What comes into being within him is the knowledge, which was manifested so that Forgetfulness might be dissolved
  simplified_phrase: What does arise within him is knowledge. This knowledge was revealed so that Forgetfulness might disappear
  preserved_meaning: Knowledge belongs within the Father and is revealed to overcome Forgetfulness.
  reasoning_layer_used: POB lexical decision for ⲟⲩⲱⲛϩ and causation rationale
  rationale: Two short sentences clarify the contrast and retain the revelatory force.
translation_notes:
  risk_flags:
  - risk: “Material” may suggest physical substance more strongly than the broad phrase “its own matter.”
    mitigation: It avoids the unsupported claim that Error created what it worked on.
  - risk: “Those who are in the middle” remains obscure to readers unfamiliar with Valentinian thought.
    mitigation: The wording preserves the source-level ambiguity rather than imposing a definite cosmological realm.
