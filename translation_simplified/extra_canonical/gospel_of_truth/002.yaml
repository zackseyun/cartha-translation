translation:
  language: en
  text: 'Everyone was searching for the One from whom they had come. They were all within him—the One who cannot be contained or understood and who is beyond every thought. Because they did not know the Father, distress and dread arose. The distress grew as thick as fog until no one could see. Then Error gained strength. It worked uselessly on its own material because it did not know the Truth.


    Error acted through deception. It used power and an appearance of beauty to prepare an imitation of the Truth. Yet this brought no disgrace upon the One who cannot be contained or understood. Distress, Forgetfulness, and deceptive illusion amount to nothing, but the Truth stands firm—unchanging, undisturbed, and beyond beauty. Therefore, pay no attention to Error, because it has no root.


    This happened in a fog concerning the Father, and it still happens now: Error prepares works through Forgetfulness and fear so that it may draw in those who are in the middle and imprison them.


    The Forgetfulness of Error was not revealed; it was not a thought from the Father. Forgetfulness did not come from the Father, though it arose because he was unknown. What does arise within him is knowledge. This knowledge was revealed so that Forgetfulness might disappear and the Father might be known. Forgetfulness arose because the Father was unknown. Once the Father is known, Forgetfulness will no longer exist.'
