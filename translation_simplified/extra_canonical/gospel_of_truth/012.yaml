translation:
  language: en
  text: 'This message of Good News about finding the Fullness is for those who are waiting for salvation from above.[a] As they wait, this hope belongs to those whose image is light without any shadow.


    When the Fullness comes, the need of matter does not come from the immeasurable Father. He comes and gives that need its appointed time. Yet no one can explain how the Incorruptible comes. Instead, the Father’s Depth grew and multiplied, and the thought of Error had no place with him. Error is a fall, but it can easily be set upright when the fallen one finds the one who returns to what he has returned to. This return is called a change of mind.[b]


    Because of this, Incorruptibility breathed out and went after the one who had sinned, so that he might find rest. Forgiveness is what remains for the light in need—the Word of the Fullness. A physician runs to where the sickness is, because healing is what he desires. The one in need does not hide, because someone has what he needs.


    In the same way, the Fullness has no need, yet it gave from itself to fill what was lacking, so that they might receive grace. While they were in need, they did not have grace. Therefore, where grace was absent, something diminished. When it was restored, what had seemed to be need was revealed as Fullness. This is the finding of the light of Truth, which enlightened them, for that light never changes.


    Because of this, they spoke about the Messiah among them:[c] “Seek, and those who were troubled will return, and he will anoint them with chrism.”[d] The chrism is the Father’s mercy, and he will have mercy on them. Those he anointed are the perfect—that is, complete—for full vessels are the ones anointed.


    But when the anointing of one dissolves, it is emptied. The need begins at the place where the ointment leaks out, because a breath and its power draw it away. Yet no seal is loosened from the one who has no need, and nothing is emptied. Instead, the complete Father fills again with himself what needs to be filled.


    He is good. He knows his plantings, because he himself planted them in his Paradise. His Paradise is his place of rest.'
