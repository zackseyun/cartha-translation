translation:
  language: en
  text: 'They had not yet received a form or a name. The Father brings them forth. Then[a], when they receive form through his knowledge, although they truly are within him, they do not know him. But the Father is complete and knows every space within himself. If he chooses, he reveals anyone he chooses, giving them a form and a name. He gives them a name and brings into being those who, before they come into being, do not know the one who made them.


    So do not say that those who have not yet come into being are nothing. Rather, they exist in the One who will bring them into being when he chooses—like a season still to come. Before everything is revealed, he knows what he will produce at the proper time. But fruit that he has not yet revealed knows nothing and does nothing.


    Moreover, every aeon[b] within the Father comes from the One-who-is, who establishes these aeons out of non-being. Those who have no root have no fruit. They say to themselves, “I have come into being,” but they will dissolve on their own. Therefore, those who did not exist at all will not exist.'
  philosophy: optimal-equivalence
