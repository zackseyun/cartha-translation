translation:
  language: en
  text: 'I am the decree of those who ask me.


    I am the voice of voices in the place of the gods—

    the voice of the angels, which they shout.[a]


    Within the word[b] and among the gods

    are the gods sent out through the shout.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The surviving text is difficult to parse, especially the relation between the angels, the voice, and the shouting.
    reason: source_note
  - marker: b
    text: The Coptic term translated “word” could also be rendered “Logos.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: and the voice of the voices in the place of the gods
  simplified_phrase: I am the voice of voices in the place of the gods
  preserved_meaning: The speaker identifies herself with the recurring voice imagery in the gods’ place.
  reasoning_layer_used: POB translation and lexical decision for ⲥⲙⲏ
  rationale: Repeating “I am” clarifies the poetic claim without changing the image.
- pob_phrase: the voice of the angels that they shout
  simplified_phrase: the voice of the angels, which they shout
  preserved_meaning: The line links the angels, their voice, and forceful shouting without fully resolving its uncertain grammar.
  reasoning_layer_used: POB base text, lexical decisions, and uncertainty note
  rationale: The relative clause remains readable while avoiding the more definite passive construction.
- pob_phrase: the gods sent forth by means of the shout
  simplified_phrase: are the gods sent out through the shout
  preserved_meaning: The gods are sent forth through a loud cry.
  reasoning_layer_used: POB base text and lexical decision for shout
  rationale: “Sent out through” expresses the same action in more natural English.
