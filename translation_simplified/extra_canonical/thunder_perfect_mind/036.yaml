  text: This utterance[a] accords with the discernment of my seeking, and this knowledge belongs to my searching. But I am she who is present in all fears and in courage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The source word translated “utterance” is uncertain; “saying” is also possible.
    reason: source_note
