translation:
  language: en
  text: 'You see me, cast out from yourselves,

    and you are defeated.


    Listen to me, you who listen.

    Learn what I say,

    you who know me.


    I am...'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: You look on me, cast out from yourselves
  simplified_phrase: You see me, cast out from yourselves
  preserved_meaning: The audience sees the speaker in her cast-out condition.
  reasoning_layer_used: POB text and lexical decision for ⲧⲉⲧⲛⲛⲁⲩ ⲉⲣⲟⲓ
  rationale: “See” is more direct than “look on,” while the reflexive wording remains unresolved.
- pob_phrase: Listen to me, you hearers
  simplified_phrase: Listen to me, you who listen
  preserved_meaning: The speaker directly addresses her listeners and calls for their attention.
  reasoning_layer_used: lexical decision for ⲥⲱⲧⲙ ⲉⲣⲟⲓ and the documented vocative structure
  rationale: The clause replaces the uncommon noun “hearers” with a natural modern address.
- pob_phrase: and learn my words
  simplified_phrase: Learn what I say
  preserved_meaning: The audience is called to learn the speaker’s words.
  reasoning_layer_used: applied source-grounded revision for ϫⲓ-ⲥⲃⲱ and ⲛⲁ-ϣⲁϫⲉ
  rationale: The wording states the same instruction in immediately understandable English.
translation_notes:
  risk_flags:
  - risk: “From yourselves” retains an unusual and potentially inward reflexive expression.
    mitigation: The wording preserves the POB ambiguity instead of resolving it as expulsion from among the audience.
  - risk: The final “I am...” is deliberately incomplete.
    mitigation: The ellipsis preserves the documented segmentation into the next sentence.
