  text: and the one they treat with contempt. I am peace, yet because of me war has come into being.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the one they despise in scorn
  simplified_phrase: the one they treat with contempt
  preserved_meaning: Others regard the speaker with scorn and rejection.
  reasoning_layer_used: Applied revision and Coptic clause analysis
  rationale: The common phrase “treat with contempt” clearly expresses both despising and scorn without redundancy.
- pob_phrase: I am peace, and because of me war has come to be
  simplified_phrase: I am peace, yet because of me war has come into being
  preserved_meaning: The speaker personifies peace while paradoxically being the cause or occasion of war’s emergence.
  reasoning_layer_used: POB lexical decisions for peace, because of, and come to be
  rationale: “Yet” makes the internal paradox clear while “come into being” retains the emergence force of the verb.
