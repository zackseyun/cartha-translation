translation:
  language: en
  text: 'Those outside my company do not know me,[a]

    but those who exist within my substance know me.


    Those near me have not known me,

    but those far from me have known me.


    On the day I am near you, you are far from me;

    and on the day you are near me, I am far from you.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The word translated “company” can also mean association, shared presence, or fellowship.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Those who exist outside my association are ignorant of me
  simplified_phrase: Those outside my company do not know me
  preserved_meaning: People outside the speaker’s association lack knowledge of the speaker.
  reasoning_layer_used: POB text and lexical note on ⲥⲩⲛⲟⲩⲥⲓⲁ
  rationale: “Company” and “do not know” express the contrast in ordinary English while the note preserves the lexical range.
- pob_phrase: those who exist in my substance are the ones who know me
  simplified_phrase: those who exist within my substance know me
  preserved_meaning: Those existing within the speaker’s substance know the speaker.
  reasoning_layer_used: POB controlling translation
  rationale: The wording simplifies the syntax but retains “substance” because its precise relationship is not defined.
- pob_phrase: On the day when I am close to you
  simplified_phrase: On the day I am near you
  preserved_meaning: The near-far reversal occurs on a stated day or occasion.
  reasoning_layer_used: POB temporal framing and parallel structure
  rationale: Dropping only “when” improves flow while preserving both the day framing and the repeated paradox.
