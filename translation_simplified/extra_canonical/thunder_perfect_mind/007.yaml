  rationale: “Unaware” expresses the same cognitive warning in more familiar English.
- pob_phrase: I am the honored and the scorned
  simplified_phrase: I am the one who is honored and the one who is scorned
  preserved_meaning: The speaker identifies herself with both sides of the paradox.
  reasoning_layer_used: POB lexical decisions and applied consistency revision
  rationale: The repeated clause makes both identities immediately clear while preserving their symmetry.
translation_notes:
  risk_flags:
