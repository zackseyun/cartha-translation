translation:
  language: en
  text: 'Do not be unaware of me.


    For I am the first and the last.


    I am the one who is honored and the one who is scorned.[a]


    I am the whore and the holy one.


    I am the wife[b] and the virgin.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The OCR reading may mean “great” or “many,” but many editors read or emend it as “scorned.” The wording is uncertain.
    reason: source_note
  - marker: b
    text: The Coptic word literally means “woman”; “wife” brings out its contrast with “virgin.”
    reason: lexical_alternative
