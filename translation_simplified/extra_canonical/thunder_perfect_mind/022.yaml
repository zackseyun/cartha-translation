translation:
  language: en
  text: 'Those who tell the truth about me lie about me.


    Those who have lied about me tell the truth about me.


    Those who know me, be ignorant of me.


    Those who have not known me, come to know me.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Those who speak the truth about me, lie about me
  simplified_phrase: Those who tell the truth about me lie about me
  preserved_meaning: The line describes the paradox that truthful speech about the speaker is also false.
  reasoning_layer_used: POB translation and independent grounding review
  rationale: “Tell the truth” is natural English, while the declarative form avoids turning the line into a command to lie.
- pob_phrase: those who have lied about me, speak the truth about me
  simplified_phrase: Those who have lied about me tell the truth about me
  preserved_meaning: The second declaration preserves the reversal between falsehood and truth.
  reasoning_layer_used: POB translation and independent grounding review
  rationale: A separate sentence makes the parallel paradox easier to follow.
- pob_phrase: those who have not known me, let them know me
  simplified_phrase: Those who have not known me, come to know me
  preserved_meaning: People who do not know the speaker are commanded to gain that knowledge.
  reasoning_layer_used: POB translation and adjudicated imperative reading
  rationale: “Come to know me” states the command in clear modern English.
