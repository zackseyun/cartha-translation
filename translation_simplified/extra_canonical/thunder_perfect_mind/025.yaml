translation:
  language: en
  text: 'I am shame and boldness.[a]


    I have no shame, yet I am ashamed.


    I am hard, yet I tremble.


    I am war and peace; both are within me.


    I am she.[b] Pay attention to me.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Boldness” may also mean frank or outspoken speech.
    reason: lexical_alternative
  - marker: b
    text: The wording here is uncertain. Another possible rendering is, “I am a stranger, and I am a human.”
    reason: textual_variant
  - marker: c
    text: The wording behind “Pay attention to me” is uncertain; “heed me” or “consider me” may also be possible.
    reason: textual_variant
