translation:
  language: en
  text: I am the one you seized. I am the one you scattered and gathered in. I am the one before whom you were ashamed, yet you acted shamelessly toward me.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: she whom you seized
  simplified_phrase: the one you seized
  preserved_meaning: The female speaker identifies herself as the person the hearers seized.
  reasoning_layer_used: Applied revision and source review
  rationale: This removes an archaic relative construction while keeping the speaker as the object.
- pob_phrase: she whom you scattered, and you gathered me in
  simplified_phrase: the one you scattered and gathered in
  preserved_meaning: The hearers both scattered the speaker and gathered her in.
  reasoning_layer_used: Applied revision and cited Coptic verbs
  rationale: The shared object remains clear without adding a temporal sequence.
- pob_phrase: she before whom you were ashamed, and you were shameless toward me
  simplified_phrase: the one before whom you were ashamed, yet you acted shamelessly toward me
  preserved_meaning: The hearers' shame before the speaker contrasts with their shameless conduct toward her.
  reasoning_layer_used: POB translation and applied revision
  rationale: “Yet” makes the stated contrast easy to follow while preserving both responses.
