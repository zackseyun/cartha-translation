translation:
  language: en
  text: 'Think carefully about me,

    and I found myself among those who seek me.[1]


    You who watch for me—you yourselves—

    and you listeners, listen to me.


    You whose hearts are troubled, accept me,

    and do not turn away from me.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: '1'
    text: The preserved Coptic form reads “I found myself.” Because the surrounding lines are commands and pair seeking with finding, some read “Find me” instead.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Consider me
  simplified_phrase: Think carefully about me
  preserved_meaning: The speaker commands the audience to give her serious thought.
  reasoning_layer_used: POB lexical decision for ⲙⲉⲉⲩⲉ ⲉⲣⲟⲓ
  rationale: Common wording preserves the sense of considering or pondering.
- pob_phrase: and you hearers, listen to me
  simplified_phrase: and you listeners, listen to me
  preserved_meaning: The speaker directly addresses those listening and commands them to pay attention.
  reasoning_layer_used: Applied grammar revision for ⲛⲣⲉϥⲥⲱⲧⲙ
  rationale: “Listeners” is natural English while preserving the direct address and repeated listening language.
- pob_phrase: receive me to yourselves
  simplified_phrase: accept me
  preserved_meaning: Those with troubled hearts are commanded to receive the speaker personally.
  reasoning_layer_used: Applied lexical revision for ϣⲟⲡⲧ ⲉⲣⲱⲧⲛ
  rationale: “Accept me” removes the awkward construction without adding the unsupported communal sense of “among you.”
translation_notes:
