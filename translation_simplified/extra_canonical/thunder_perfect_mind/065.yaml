translation:
  language: en
  text: 'Greatness in parts comes from smallness.[a]


    For they know smallness from greatness.


    Why do you curse me while also honoring me?


    You have wounded me, yet you have shown mercy.


    Do not throw out the first things.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The opening wording and syntax are uncertain, but the line contrasts greatness with smallness.
    reason: source_note
  - marker: b
    text: “The first things” may also mean “the beginnings” or “the origins.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: greatness in parts from smallness
  simplified_phrase: Greatness in parts comes from smallness
  preserved_meaning: The line connects greatness in parts with smallness without making the parts into stages.
  reasoning_layer_used: POB text, source note, and grounding review
  rationale: The supplied verb makes the fragment readable while leaving “in parts” unresolved.
- pob_phrase: Why do you curse me and honor me?
  simplified_phrase: Why do you curse me while also honoring me?
  preserved_meaning: The speaker challenges the hearers for treating her in two opposed ways.
  reasoning_layer_used: applied source-grounded revision
  rationale: “While also” clearly presents the simultaneous contradiction without explaining it away.
- pob_phrase: Do not cast out the first things
  simplified_phrase: Do not throw out the first things
  preserved_meaning: The command forbids rejecting plural things understood as first or original.
  reasoning_layer_used: POB text and lexical note on ⲛⲛϣⲟⲣⲡ
  rationale: “Throw out” is common English that preserves both expulsion and plural firstness.
