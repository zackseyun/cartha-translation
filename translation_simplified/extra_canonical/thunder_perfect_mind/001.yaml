translation:
  language: en
  text: 'Thunder, Perfect Mind


    I was sent out from the Power.[a] I came[b] to those who think deeply about me. I was found[c] among those who look for me.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The title “the Power” follows the usual reading, though the word “the” is not visible in this OCR excerpt.
    reason: source_note
  - marker: b
    text: Many editions read “I came,” but the OCR may instead read, “I was heard by those who think deeply about me.”
    reason: textual_variant
  - marker: c
    text: This may also mean, “I found myself,” or, “they found me.”
    reason: lexical_alternative
