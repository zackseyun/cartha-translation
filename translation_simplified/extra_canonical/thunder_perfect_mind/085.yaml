translation:
  language: en
  text: 'Vision and self-control of the heart are present within me.[a]


    I am the hearing available to everyone,[b]

    and the speech that no one can grasp.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some read the opening as “a lamp of the heart,” but the underlying OCR supports “vision and self-control.”
    reason: lexical_alternative
  - marker: b
    text: “Available” may also mean “attainable” or “coming to” everyone.
    reason: lexical_alternative
  - marker: c
    text: “Grasp” may mean either seize or understand.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Vision and self-control of the heart, existing within me—
  simplified_phrase: Vision and self-control of the heart are present within me.
  preserved_meaning: Both inner qualities, not the heart itself, are present within the speaker.
  reasoning_layer_used: applied grammar revision and lexical decisions
  rationale: A complete sentence makes the modifier clear without changing its attachment.
- pob_phrase: the hearing that is attainable to everyone
  simplified_phrase: the hearing available to everyone
  preserved_meaning: The hearing is accessible to all rather than achieved by a select few.
  reasoning_layer_used: lexical decision for ⲉⲧϣⲏⲡ
  rationale: “Available” expresses access more naturally while the footnote preserves alternatives.
- pob_phrase: the speech that cannot be grasped
  simplified_phrase: the speech that no one can grasp
  preserved_meaning: The speech resists both possession and comprehension.
  reasoning_layer_used: lexical decision for ⲉⲧⲉ ⲙⲁⲧϣⲉ
  rationale: An active clause is easier to read and retains the poem’s paradox.
