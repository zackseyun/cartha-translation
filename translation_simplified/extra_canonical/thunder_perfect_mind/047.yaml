- pob_phrase: I am she whom they call “Law,” and you have called me “Lawlessness.”
  simplified_phrase: I am she—the one they call “Law.” But you have called me “Lawlessness.”
  preserved_meaning: The feminine speaker contrasts the habitual title “Law” with the hearers’ completed naming of her as “Lawlessness.”
  reasoning_layer_used: Applied grammar revision and POB lexical decisions for ⲡⲛⲟⲙⲟⲥ and ⲧⲁⲛⲟⲙⲓⲁ
  rationale: The split sentences clarify the contrast without losing the feminine “I am she” formula.
- pob_phrase: I am she whom you pursued, and I am she whom you seized.
  simplified_phrase: I am she—the one you chased. I am she—the one you seized.
  preserved_meaning: The hearers first ran after the speaker and then took hold of her.
  reasoning_layer_used: POB lexical decisions for ⲡⲱⲧ ⲛⲥⲱⲥ and ⲁⲙⲁϩⲧⲉ
  rationale: “Chased” is clearer than “pursued,” while “seized” retains the confrontation and parallel repetition.
