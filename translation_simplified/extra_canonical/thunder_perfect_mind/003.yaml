translation:
  language: en
  text: 'You who hear, listen to me.


    You who wait for me, welcome me.


    Do not cast me away from your sight.


    Do not let your voice hate me—or your hearing.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The surviving wording of the final line is fragmentary; the references to voice and hearing are clear, but their exact relationship is uncertain.
    reason: source_note
simplification_decisions:
- pob_phrase: And you hearers, listen to me.
  simplified_phrase: You who hear, listen to me.
  preserved_meaning: The speaker directly commands those hearing her to listen attentively.
  reasoning_layer_used: POB lexical decisions for the address and command
  rationale: The relative clause replaces the uncommon noun “hearers” while keeping the hear-listen repetition.
- pob_phrase: take me to yourselves
  simplified_phrase: welcome me
  preserved_meaning: Those awaiting the speaker are commanded to receive rather than reject her.
  reasoning_layer_used: POB translation and its contrast with casting away
  rationale: “Welcome me” expresses reception in direct, natural English.
- pob_phrase: do not cast me from your sight
  simplified_phrase: Do not cast me away from your sight.
  preserved_meaning: The hearers must not reject the speaker from their presence or view.
  reasoning_layer_used: Applied source correction for ⲙⲡⲣⲛⲟⲩϫⲧ ⲉⲃⲟⲗ ϩⲙ ⲡⲉⲧⲛϩⲟ
  rationale: “Away from your sight” preserves the corrected casting image without implying that the hearers flee.
translation_notes:
  risk_flags:
  - risk: “Welcome me” is less physically concrete than “take me to yourselves.”
    mitigation: The following command against casting the speaker away preserves the receive-reject contrast.
  - risk: The damaged final line leaves the relationship of “hearing” to “hate” uncertain.
    mitigation: The dash avoids fully resolving the syntax, and the footnote states the uncertainty.
