translation:
  language: en
  text: '...is the one who sees what comes before me.[A]


    I am the light.


    I have not gone out—I, I.[B]


    I am the absence of darkness,

    and the root of darkness comes from within me.


    I am the desire of a vision

    and the self-control of the heart within me.


    I am the hearing acceptable to everyone.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: A
    text: The expected near-and-far passage does not match the surviving OCR here; this translation follows the OCR’s light, darkness, and human-faculties sequence.
    reason: source_note
  - marker: B
    text: The Coptic may instead mean, “Do not go out,” but the statement “I have not gone out” fits the surrounding declarations.
    reason: lexical_alternative
