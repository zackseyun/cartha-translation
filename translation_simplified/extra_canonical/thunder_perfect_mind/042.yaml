translation:
  language: en
  text: Why do you Greeks hate me? Is it because I am a barbarian?[a] I am the knowledge of Greeks and barbarians alike. I am the judgment.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “barbarian” means someone who is not Greek.
    reason: cultural_note
