translation:
  language: en
  text: Do not cast me out from among those who are not worthless.[a] For I—I am merciful, and I am hard-hearted. Do not hate my obedience. Love my self-control in my weakness.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “among those who lack worthlessness”; the wording is paradoxical, and “in disgrace” is also possible.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: cast me out among those who are lacking in worthlessness
  simplified_phrase: cast me out from among those who are not worthless
  preserved_meaning: The speaker must not be expelled from among people who lack worthlessness.
  reasoning_layer_used: applied source-grounded revision
  rationale: The double negative is clarified while “cast out” retains the force of expulsion.
- pob_phrase: for I—I am merciful, and I am hard-hearted
  simplified_phrase: For I—I am merciful, and I am hard-hearted
  preserved_meaning: The speaker emphatically claims the opposing qualities of mercy and hardness of heart.
  reasoning_layer_used: POB lexical decisions and grounding review
  rationale: The repetition and both sides of the paradox remain clear in ordinary English.
- pob_phrase: and my self-control, love it in my weakness
  simplified_phrase: Love my self-control in my weakness
  preserved_meaning: The hearers are commanded to love the speaker’s self-control as it exists in weakness.
  reasoning_layer_used: applied source-grounded revision
  rationale: Normal imperative order makes the command easier to read without changing its meaning.
