translation:
  language: en
  text: 'I am the one you have thought about.


    You have mocked me.


    I am unlearned, but they learn from me.


    I am the woman you have scorned.


    And you think about me.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: I am the one you have thought about, and you have mocked me.
  simplified_phrase: I am the one you have thought about. You have mocked me.
  preserved_meaning: The audience has both thought about the speaker and mocked her.
  reasoning_layer_used: Applied revision and Coptic syntax
  rationale: Separate sentences show that mocking is an independent main clause.
- pob_phrase: I am unlearned, and from me they learn.
  simplified_phrase: I am unlearned, but they learn from me.
  preserved_meaning: The paradox remains that others learn from one who is herself unlearned.
  reasoning_layer_used: POB lexical decisions and immediate context
  rationale: Natural word order clarifies the paradox while retaining the carefully chosen term “unlearned.”
- pob_phrase: I am she whom you have scorned, and you think about me.
  simplified_phrase: I am the woman you have scorned. And you think about me.
  preserved_meaning: The explicitly female speaker has been scorned and remains an object of thought.
  reasoning_layer_used: Applied revision and female-speaker guidance
  rationale: “The woman” makes the feminine form clear, while “and” avoids imposing a stronger contrast.
