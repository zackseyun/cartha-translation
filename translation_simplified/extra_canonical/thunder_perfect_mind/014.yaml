translation:
  language: en
  text: 'I am a daughter, and I am a woman[a].


    I am my father’s mother.


    I am my husband’s daughter[b],


    and he is my offspring[c]. [d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The word translated “woman” can also mean “wife,” but “woman” preserves the poem’s broader contrast with “daughter.”
    reason: lexical_alternative
  - marker: b
    text: Some readings have “my husband’s sister” rather than “my husband’s daughter”; the damaged text is uncertain.
    reason: textual_variant
  - marker: c
    text: The damaged text may instead read, “and he is my lord,” though “offspring” best fits the surrounding family relationships.
    reason: alternative_reading
  - marker: d
    text: The next incomplete line begins, “I am the humiliation of my …” and is omitted because its ending is lost.
    reason: source_note
