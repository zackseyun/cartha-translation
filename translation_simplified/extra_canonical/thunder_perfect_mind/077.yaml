translation:
  language: en
  text: 'Within a voice, I am silence.[a]


    I am peace, and war came into being because of me.


    I am both a foreigner[b] and a citizen.


    I am substance itself, and I am also the one who has no substance. Those outside my association do not know me.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The manuscript reading is uncertain, but the work elsewhere contrasts silence with voice.
    reason: source_note
  - marker: b
    text: The uncertain word may also mean “stranger.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: I am the silence within a voice
  simplified_phrase: Within a voice, I am silence
  preserved_meaning: The paradoxical image of silence existing within voice remains intact.
  reasoning_layer_used: POB lexical decisions and alignment note
  rationale: Reordering the line makes the contrast immediate without explaining it away.
- pob_phrase: I am a foreigner and a citizen
  simplified_phrase: I am both a foreigner and a citizen
  preserved_meaning: The speaker claims both opposing social identities.
  reasoning_layer_used: POB lexical decision for ⲟⲩϣⲙⲙⲱ and ⲣⲙⲛⲡⲟⲗⲓⲥ
  rationale: “Both” clarifies the paired claim while retaining the uncertain term in a note.
- pob_phrase: those who exist outside my association are ignorant of me
  simplified_phrase: Those outside my association do not know me
  preserved_meaning: People outside the speaker’s association lack knowledge of the speaker.
  reasoning_layer_used: applied source-grounded revision
  rationale: Common wording replaces the abstract phrases “exist outside” and “are ignorant of.”
translation_notes:
  risk_flags:
  - risk: “Substance” remains philosophically difficult for common readers.
    mitigation: It is retained because replacing it could erase the source’s metaphysical sense and central paradox.
  - risk: The readings behind “silence” and “foreigner” are textually uncertain.
    mitigation: Brief notes preserve both uncertainties without burdening the main text.
