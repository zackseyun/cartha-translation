    reason: source_note
simplification_decisions:
- pob_phrase: she upon whom you have deliberated
  simplified_phrase: she, the one you carefully considered
  preserved_meaning: The hearers directed purposeful thought toward the speaker without necessarily plotting against her.
  reasoning_layer_used: POB lexical decision for ⲙⲉⲉⲩⲉ ⲉⲣⲟⲓ
  rationale: Common wording replaces the formal phrase while preserving its active, thoughtful sense.
- pob_phrase: she whom you have made alive
  simplified_phrase: she, the one you gave life to
  preserved_meaning: The hearers caused the speaker to be alive.
  reasoning_layer_used: POB lexical decision for transitive ⲟⲩⲟⲛϩ
  rationale: “Gave life to” is natural English and avoids implying that she was raised from death.
- pob_phrase: I am she whom
  simplified_phrase: I am she, the one
  preserved_meaning: The repeated feminine self-identification and fourfold parallel structure remain explicit.
  reasoning_layer_used: POB lexical decision for the feminine predicative article ⲧⲉ
  rationale: The added apposition makes the formal “I am she” construction easier to follow without erasing the feminine voice.
