translation:
  language: en
  text: 'Greeks and non-Greeks,


    I am the one whose image is great in Egypt,

    and the one who has no image among non-Greeks.


    I am she whom they hated everywhere[a],

    and she whom they loved.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “whom they hated among all people.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Greeks and barbarians
  simplified_phrase: Greeks and non-Greeks
  preserved_meaning: The contrast remains between Greeks and people outside Greek culture.
  reasoning_layer_used: POB lexical decision and documented alternative
  rationale: “Non-Greeks” conveys the historical category without the modern insulting sense of “barbarians.”
- pob_phrase: in every place
  simplified_phrase: everywhere
  preserved_meaning: The speaker was hated throughout all places.
  reasoning_layer_used: POB lexical decision and documented alternative
  rationale: “Everywhere” is the natural modern equivalent, while the footnote preserves the possible reference to all people.
- pob_phrase: I am she whom they hated in every place, and she whom they loved
  simplified_phrase: I am she whom they hated everywhere, and she whom they loved
  preserved_meaning: The feminine speaker remains the object of the poem’s hated-loved paradox.
  reasoning_layer_used: POB feminine-voice and antithesis decisions
  rationale: Retaining “she” preserves the feminine voice without identifying the speaker more narrowly as a human woman.
translation_notes:
  risk_flags:
  - risk: The phrase rendered “everywhere” may instead refer to all people.
    mitigation: Footnote [a] preserves that documented alternative without resolving it in the main text.
