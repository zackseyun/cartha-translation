translation:
  language: en
  text: 'Do not despise my lowly state.


    Love my self-control toward you in my poverty.[a]


    Do not laugh at me too much.


    Do not despise my fault,

    and do not curse my boasting.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Coptic may also mean “my self-control concerning you” or “over you.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: my lowliness
  simplified_phrase: my lowly state
  preserved_meaning: Her condition is one of smallness or contemptibility, not the virtue of humility.
  reasoning_layer_used: POB lexical decision for ⲙⲛ̄ⲧⲥⲧⲙⲏⲧ
  rationale: “Lowly state” makes the non-virtue sense clear in common English.
- pob_phrase: my self-control toward you—love her in my poverty
  simplified_phrase: Love my self-control toward you in my poverty
  preserved_meaning: The hearers must love her self-control in relation to them while she is in poverty.
  reasoning_layer_used: POB lexical decisions for ⲉⲅⲕⲣⲁⲧⲉⲓⲁ, ⲛ̄ⲧⲉⲧⲛ̄, and ϩⲛ̄
  rationale: Ordinary clause order clarifies the command while retaining the locative phrase and relational ambiguity.
- pob_phrase: laugh at me excessively
  simplified_phrase: laugh at me too much
  preserved_meaning: The command keeps the source intensifier’s warning against excessive laughter.
  reasoning_layer_used: POB lexical decision and footnote for ⲕⲱ ⲧⲏⲛⲉ
  rationale: “Too much” naturally expresses degree without implying uncontrolled behavior.
translation_notes:
  risk_flags:
  - risk: Replacing the feminine pronoun “her” weakens the grammatical personification of self-control.
    mitigation: The clearer English wording still identifies the self-control as the speaker’s own.
  - risk: Older analyses in the record conflict with the adjudicated wording about fault and boasting.
    mitigation: The draft follows the revised controlling POB text.
