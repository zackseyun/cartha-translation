  preserved_meaning: The speaker identifies herself as one expelled by others.
  reasoning_layer_used: POB lexical decision for ⲧⲱⲱⲛ ⲉⲃⲟⲗ
  rationale: The complete passive clause is natural English and retains the force of “cast out.”
- pob_phrase: among the dead — but I am the one who exists alone
  simplified_phrase: I am among the dead. Yet I am the one who exists alone
  preserved_meaning: The speaker’s presence among the dead contrasts with her solitary existence.
  reasoning_layer_used: Applied grammar revision and POB paradox note
  rationale: Two sentences clarify the contrast without turning “exists alone” into “only I exist.”
- pob_phrase: and the everlasting
