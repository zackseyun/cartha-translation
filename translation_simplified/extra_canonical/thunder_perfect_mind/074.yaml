    text: The Coptic ⲧⲁⲉⲓⲏⲟⲩ here is uncertain; ‘my appearance’ is tentative. Alternatives include ‘my image,’ ‘my thought,’ or even ‘my house.’ Context with ‘face’ (ⲣⲟⲥ) motivates a visual gloss.
    reason: lexical_alternative
  - marker: b
    text: ⲥⲙⲟⲟⲩ can mean ‘bless’ or ‘praise,’ and sometimes ‘name.’ ‘Praise’ is chosen to form a clear antithesis with ‘despise.’
    reason: lexical_alternative
  - marker: c
    text: The pronoun ⲙⲙⲟⲥ (‘them’) likely refers back to ‘the poor,’ but the antecedent is not explicit in the excerpt.
    reason: alignment_note
  - marker: d
    text: ϩⲛ ⲟⲩϣⲱⲥ ⲁⲛⲟⲕ could also be taken as ‘in a voice, It is I’ or attached to the following line in some editions.
    reason: textual_variant
  - marker: e
    text: 'Or ''Be present with me, and with the poor.\nWhat is within, in the heart—I am she.\nMy appearance[a]—you praise[b] the face,\nand you despise them[c],\nwith a voice: “I am.”[d]''.'
