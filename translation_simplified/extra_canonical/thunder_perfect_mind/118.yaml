translation:
  language: en
  text: There are forms of ignorance, passions that are about to come, pleasures directed toward you,[a] a power that you will take,[b] and clear-mindedness.[c] They will run upward into their emptiness.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Coptic does not state whom the pleasures are directed toward; “you” comes from the surrounding context.
    reason: source_note
  - marker: b
    text: “Take” could also mean “receive” or “seize,” and “they” may be the subject rather than “you.”
    reason: alternative_reading
  - marker: c
    text: The Coptic may instead mean “so that they may become clear-minded.”
    reason: alternative_reading
  - marker: d
    text: “Their emptiness” may instead mean “their poverty.”
    reason: lexical_alternative
