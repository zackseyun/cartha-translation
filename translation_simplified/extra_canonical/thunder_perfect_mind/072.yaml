translation:
  language: en
  text: 'The voice of the angels sent out in the Word and of the gods[a]—


    the gods who go out through counsel;


    the spirits of human beings who are with me;


    and the women who are within.


    I am she—you all ...[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Coptic may also be read as singular, “God.”
    reason: lexical_alternative
  - marker: b
    text: The surviving text breaks off here; “you all” is plural.
    reason: source_note
simplification_decisions:
- pob_phrase: the angels who were sent forth in the word
  simplified_phrase: the angels sent out in the Word
  preserved_meaning: The angels are sent outward within the Word.
  reasoning_layer_used: applied revision and lexical decision for ϩⲙ̄ ⲡⲗⲟⲅⲟⲥ
  rationale: This shortens the clause while retaining both sending and the Word.
- pob_phrase: go out by means of the counsel
  simplified_phrase: go out through counsel
  preserved_meaning: Counsel is the means by which the gods go out.
  reasoning_layer_used: applied revision for ϣⲟϫⲛⲉ
  rationale: “Through” states the means naturally while preserving the outward movement.
- pob_phrase: the spirits of humans who exist with me
  simplified_phrase: the spirits of human beings who are with me
  preserved_meaning: The spirits belong to or are associated with human beings and remain with the speaker.
  reasoning_layer_used: applied revision for ⲡⲛⲁ and ⲛ̄ⲣⲱⲙⲉ, corrected by grounding review
  rationale: This keeps the explicit relationship to humans while simplifying “exist with me.”
