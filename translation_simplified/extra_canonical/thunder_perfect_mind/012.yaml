translation:
  language: en
  text: I am the midwife, and I do not give birth.[a] I am the comfort of my labor pains. I am the bride, and I am the bridegroom. I am my father’s mother and my husband’s sister.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some English translations read, “I am she whose wedding is great,” but the source evidence used here supports “midwife” and “does not give birth”; comparison with a clearer manuscript witness is still needed.
    reason: alternative_reading
