  reasoning_layer_used: POB translation and applied Coptic source revision
  rationale: A direct first-person clause is easier to read while coordination preserves the open relationship.
- pob_phrase: the bride and the bridegroom
  simplified_phrase: the bride, and I am the bridegroom
  preserved_meaning: The speaker claims both wedding identities in distinct repeated assertions.
  reasoning_layer_used: POB translation and applied revision
  rationale: Repeating “I am” makes both sides of the paradox immediately clear.
- pob_phrase: the mother of my father and the sister of my husband
  simplified_phrase: my father’s mother and my husband’s sister
  preserved_meaning: Both paradoxical family relationships remain distinct.
  reasoning_layer_used: POB translation and applied revision
  rationale: Possessive forms replace dense “of” phrases with natural English.
