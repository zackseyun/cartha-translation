translation:
  language: en
  text: 'I am she whose festivals are many.[a]


    I am godless,

    and I am the one whose God is great.[b]


    I am the one you have thought about,

    and you have scorned me.


    I have not been taught,

    and they learn.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Coptic wording of this line is uncertain; this follows the source-based reconstruction adopted by the POB.
    reason: source_note
  - marker: b
    text: The Coptic phrase is elliptical and is often understood as “the one whose God is great,” but the adjective “great” is not securely present in the surviving text.
    reason: source_note
