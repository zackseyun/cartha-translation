translation:
  language: en
  text: 'I am the hearing within everyone’s reach;[a]

    I am the speech that cannot be grasped.

    I am the name of the sound

    and the sound of the name.

    I am the sign of this,

    and I am its manifestation.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The word translated “within everyone’s reach” can also mean “great.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the hearing that is attainable to all
  simplified_phrase: the hearing within everyone’s reach
  preserved_meaning: Hearing is available to all, and the auditory image remains intact.
  reasoning_layer_used: POB lexical decisions for ⲥⲱⲧⲙ and ⲉⲧϣⲏⲡ
  rationale: “Within everyone’s reach” expresses “attainable to all” in familiar language.
- pob_phrase: the name of the sound and the sound of the name
  simplified_phrase: the name of the sound and the sound of the name
  preserved_meaning: The compact reversal of “name” and “sound” remains one paired statement.
  reasoning_layer_used: POB lexical decisions for ⲣⲁⲛ and ⲥⲙⲏ
  rationale: Keeping the parallel wording preserves the passage’s deliberate wordplay.
- pob_phrase: the sign of this, and the manifestation
  simplified_phrase: the sign of this, and I am its manifestation
  preserved_meaning: The speaker identifies herself as both the sign and the outward appearance connected with “this.”
  reasoning_layer_used: Applied tier-3 revision for ⲥⲏⲙⲉⲓⲟⲛ, ⲙⲡⲁⲓ, and ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ
  rationale: Repeating “I am” makes the final identification clear without replacing “manifestation” with unsupported light imagery.
interpretive_expansions:
- pob_phrase: the speech that cannot be grasped
  rendering: the speech that cannot be grasped
  claim: The speech cannot be grasped by the unspecified people encoded in the Coptic construction.
  evidence:
  - The applied tier-3 revision reads the phrase as a negative plural construction meaning “which they cannot grasp.”
  confidence: high
  alternatives_preserved:
  - the speech that is there
translation_notes:
  risk_flags:
  - risk: The referent of “this” remains unclear.
    mitigation: The draft keeps the deictic expression rather than naming an unsupported referent.
  - risk: The source history contains an older locative reading and an obsolete light-based rendering.
    mitigation: The main text follows the later tier-3 corrections while preserving the locative option in the audit.
