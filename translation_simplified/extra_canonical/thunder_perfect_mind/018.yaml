translation:
  language: en
  text: '[...] and the one who boasts brings these things to me. I am the silence that no one can grasp, and the thought that is powerfully remembered. I am the voice with many sounds, and the word with many forms.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the silence that is incomprehensible
  simplified_phrase: the silence that no one can grasp
  preserved_meaning: The silence remains beyond comprehension.
  reasoning_layer_used: applied revision and source review
  rationale: “No one can grasp” clearly conveys the inability to comprehend the silence.
- pob_phrase: the thought whose remembrance is great
  simplified_phrase: the thought that is powerfully remembered
  preserved_meaning: The thought is remembered with great force.
  reasoning_layer_used: applied revision and source review
  rationale: The active wording avoids suggesting that the thought itself possesses memory.
- pob_phrase: the voice whose sound is manifold, and the word that is multiple
  simplified_phrase: the voice with many sounds, and the word with many forms
  preserved_meaning: The voice and the word each retain their distinct multiplicity.
  reasoning_layer_used: revised POB text and grounding review
  rationale: Common wording preserves multiplicity without adding hearers or specifying modes of expression.
translation_notes:
  risk_flags:
