  simplified_phrase: seems to be referring indirectly
  preserved_meaning: The writer cautiously identifies an indirect reference to Papias.
  reasoning_layer_used: POB translation and English witness
  rationale: This keeps both the indirectness of the reference and the writer’s uncertainty.
- pob_phrase: flourished in the days of
  simplified_phrase: was active in the days of
  preserved_meaning: Papias’s period of activity coincided with the time of John the Evangelist.
  reasoning_layer_used: POB translation, English witness, and grounding review
  rationale: “Was active” preserves the biographical force of “flourished” in common English.
- pob_phrase: presents the aforementioned Papias in support of his statements
  simplified_phrase: cites Papias to support his statements
  preserved_meaning: Irenaeus appeals to Papias as supporting evidence.
  reasoning_layer_used: POB translation and English witness
  rationale: The shorter wording clearly states how Irenaeus uses Papias.
