translation:
  language: en
  text: 'By this, he seems to be referring indirectly to Papias of Hierapolis in Asia. Papias was a bishop at that time and was active in the days of the holy Evangelist John. In the fourth book of his Expositions of the Lord’s Sayings, Papias included food among the sources of delight in the resurrection. ... Irenaeus of Lyons says the same thing in book five of Against Heresies and cites Papias to support his statements.


    MAXIMUS THE CONFESSOR, Notes on Dionysius the Areopagite’s Ecclesiastical Hierarchy, chapter 7.'
