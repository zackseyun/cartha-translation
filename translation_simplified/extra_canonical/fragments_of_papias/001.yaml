translation:
  language: en
  text: 'Irenaeus and others report that John, the apostle known as “the Divine,” lived until the reign of Trajan. Later, Papias of Hierapolis and Polycarp, the bishop of Smyrna, became well known. Both had listened to John teach.


    —Eusebius, Chronicle (Syncellus 655, 14), for Olympiad 220


    II


    During this period, Polycarp became prominent in Asia. He was a disciple of the apostles who [the text is damaged and cannot be read clearly; it mentions the church in Smyrna and “ministers of the Lord”]. At the same time, Papias, bishop of the diocese of Hierapolis, also became prominent.


    —Eusebius, History of the Church 3.36.1–2'
