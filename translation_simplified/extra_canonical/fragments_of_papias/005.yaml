translation:
  language: en
  text: 'Papias, who had heard John and was bishop of Hierapolis in Asia, wrote only five books. He called them An Exposition of the Discourses of the Lord. In his preface, he says that he did not rely on statements gathered at random, but on the authority of the apostles. He writes:


    “I used to ask what Andrew, Peter, Philip, Thomas, James, John, Matthew, or any other disciple of the Lord had said. I also asked what Aristion and the Elder John, disciples of the Lord, were saying. For written books did not benefit me as much as the living voice that still sounded clearly in the people who spoke it.”


    This list clearly names one John among the apostles and another John, called the Elder, after Aristion. We mention this because, as stated above, many authorities have said that the last two letters of John were written not by the apostle but by the Elder. Papias is also said to have spread the Jewish tradition of a thousand-year reign. Irenaeus, Apollinarius, and others followed him, teaching that after the resurrection the Lord will reign bodily with the saints.


    JEROME, On Illustrious Men 18.


    VIII.


    I have also heard a false rumor that I translated the books of Josephus and the writings of Papias and Polycarp. But I have neither the time nor the strength to translate works like these into another language with fitting elegance.


    JEROME, To Lucinius, Letter 71 (28), chapter 5.'
