  rationale: The rewrite removes an obsolete sense of “promiscuous” without weakening the contrast.
- pob_phrase: the living voice clearly sounding up to the present day in (the persons of) authors
  simplified_phrase: the living voice that still sounded clearly in the people who spoke it
  preserved_meaning: Papias valued a presently heard voice in living persons more than written books.
  reasoning_layer_used: POB text and grounding review
  rationale: The wording preserves the personal medium without suggesting that book authors transmitted the voice.
- pob_phrase: promulgated the Jewish tradition of a Millennium
