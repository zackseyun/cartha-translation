translation:
  language: en
  text: 'Here begins the introduction to the Gospel according to John.


    John made his Gospel known and gave it to the churches while he was still alive. Papias of Hierapolis, a beloved disciple of John, reported this in his five books of interpretation.[a] Papias also wrote down the Gospel accurately as John dictated it.


    Source: a ninth-century Vatican manuscript.


    XX


    John, the last of these, was known as the Son of Thunder. When he was already a very old man, and when terrible heresies had arisen, he dictated the Gospel to his own disciple, the upright Papias of Hierapolis. He did this to supply what was lacking in those who had proclaimed the word before him to people throughout the world. Irenaeus, Eusebius, and a succession of trustworthy historians passed down this account to us.


    Source: Catena Patrum Graecorum on Saint John, published by B. Corder.'
