translation:
  language: en
  text: 'Everyone went home, but Jesus went to the Mount of Olives. Early the next morning, he returned to the temple. All the people came to him, so he sat down and taught them.[a]


    The scribes and Pharisees brought him a woman who had been caught committing adultery. They made her stand before everyone and said, “Teacher, this woman was caught in the very act of adultery. In the law, Moses commanded us to stone women like her. What do you say?” They asked this to test Jesus, so they could find a reason to accuse him.[a]


    But Jesus bent down and wrote on the ground with his finger. They kept questioning him, so he stood up and said, “Let the one among you who is without sin be the first to throw a stone at her.” Then he bent down again and wrote on the ground.


    When they heard this, they left one by one, beginning with the oldest. At last, only Jesus and the woman remained there. Jesus stood up and asked her, “Woman, where are they? Has no one condemned you?”


    “No one, Lord,” she answered.


    Jesus said, “Neither do I condemn you. Go, and from now on do not sin again.”'
