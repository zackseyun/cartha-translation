translation:
  language: en
  text: 'Apollinarius writes:


    “Judas did not die from hanging. He was taken down before he suffocated and continued to live. The Acts of the Apostles also says that he fell headfirst, his body burst open in the middle, and all his intestines spilled out.


    “Papias, the disciple of John, tells this more fully in the fourth book of his Exposition of the Sayings of the Lord:


    “‘Judas went about in this world as a horrifying example of godlessness. His body became so swollen that he could not pass where a wagon [the text is unclear] could easily pass—not even his head alone could fit through. They say that his eyelids became so swollen [part of the text is missing] that he could not see any light. His eyes had sunk so far beneath the surface that even a doctor using an instrument could not see them. . . .’”


    Compiled from Cramer, Catena ad Acta SS. Apost. (1838), pp. 12 and following, and other sources.[1]'
