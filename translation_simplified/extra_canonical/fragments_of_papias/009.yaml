translation:
  language: en
  text: 'Taking their starting point from Papias the Great of Hierapolis—who was a disciple of the apostle who leaned on Christ’s chest—and from Clement, Pantaenus, a priest of the Alexandrians, and Ammonius, the great scholar, these ancient, early interpreters agreed with one another. They understood the work of the six days of creation as referring to Christ and his Church.


    —Anastasius of Sinai, Contempl. Anagog. in Hexaém. 1'
