translation:
  language: en
  text: 'Papias says the following, and I quote his exact words:


    “To some of them—clearly, the angels who were holy at first—he also gave authority to oversee the order of the universe. He commanded them to use their authority well.”


    Then Papias says:


    “But their ordered ranks came to nothing. For the great dragon—the ancient serpent, who is also called Satan and the devil—was thrown down to the earth, together with his angels.”


    —Andreas of Caesarea, On the Apocalypse, chapter 34, sermon 12'
