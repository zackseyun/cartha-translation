translation:
  language: en
  text: 'Once again, Stephanus does not agree with Papias, the bishop and martyr of Hierapolis, or with Irenaeus, the holy bishop of Lyons. Papias and Irenaeus say that the kingdom of heaven will consist of enjoying certain kinds of physical food.


    —Photius, Bibliotheca 232, on Stephanus Gobarus'
