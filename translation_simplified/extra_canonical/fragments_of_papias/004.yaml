translation:
  language: en
  text: 'Papias was bishop of Hierapolis, a disciple of John the Divine, and a companion of Polycarp. He wrote five books called Oracles of the Lord. In his list of the apostles, after Peter, John, Philip, Thomas, and Matthew, he also named Aristion and another John among the Lord’s disciples. He called this second John “the Elder.”


    Some people think this John wrote the two short letters published under John’s name and known as catholic, or general, letters. Papias gives this reason: the earliest fathers accepted only the first letter. Some have also wrongly thought that the Apocalypse—that is, Revelation—was written by this Elder John. Papias himself was also mistaken about the thousand-year reign, and Irenaeus followed his error.


    In his second book, Papias says that John the Divine and his brother James were killed by the Jews. Papias also reported a story on the authority of Philip’s daughters. When unbelievers challenged Barsabas, also called Justus, he drank snake poison in the name of the Lord but suffered no harm. Papias tells other marvelous stories as well, especially one about Manaim’s mother being raised from the dead. He also says that people whom Christ raised from the dead remained alive until the time of Hadrian.


    PHILIP OF SIDE (?), Afist. Christ.


    VI.


    After Domitian, Nerva ruled for one year. He recalled John from the island of Patmos and allowed him to live in Ephesus. At that time John was the only one of the twelve apostles still alive. After writing his Gospel, he received the honor of martyrdom.


    Papias, bishop of Hierapolis, had seen John himself. In the second book of Oracles of the Lord, he says that the Jews killed John. John and his brother thus clearly fulfilled Christ’s prophecy about them, as well as the commitment they had willingly made for his sake. The Lord had asked them, “Can you drink the cup that I drink?” When they readily agreed, he told them, “You will drink my cup, and you will be baptized with the baptism with which I am baptized.” This must be so, because God cannot lie.


    The learned Origen likewise says in his commentary on Matthew’s Gospel that John was martyred. He states that he learned this from those who followed the apostles. The well-informed Eusebius also says in his Ecclesiastical History, “Thomas was assigned Parthia, while John was assigned Asia. John lived there and died, possibly at Ephesus.”[a]


    GEORGIUS HAMARTOLUS, Chronicle.'
