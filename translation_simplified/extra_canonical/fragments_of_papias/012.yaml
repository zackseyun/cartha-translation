  language: en
  text: 'People who related to God without deceit were called children. Papias also shows this in the first book of his Expositions of the Lord, and Clement of Alexandria does so in The Instructor.


    —Maximus the Confessor, Notes on Dionysius the Areopagite, On the Ecclesiastical Hierarchy, chapter 2'
