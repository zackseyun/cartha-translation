  rationale: This directly explains the uncommon term without broadening it into other virtues.
- pob_phrase: they used to call children
  simplified_phrase: were called children
  preserved_meaning: Such people received the designation “children.”
  reasoning_layer_used: POB syntax
  rationale: The passive wording removes awkward clause order without changing the claim.
- pob_phrase: Paedagogue
