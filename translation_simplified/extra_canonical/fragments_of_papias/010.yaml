translation:
  language: en
  text: 'The earlier interpreters of the churches—including Philo the philosopher, who lived at the time of the apostles; the renowned Papias of Hierapolis, a disciple of John the Evangelist; and others associated with them—understood the sayings about Paradise in a spiritual sense and applied them to the Church of Christ.


    —Anastasius of Sinai, Contempl. Anagog. in Hexaém. VII'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the more ancient expositors of the churches
  simplified_phrase: the earlier interpreters of the churches
  preserved_meaning: These figures belonged to an earlier group that interpreted teaching within the churches.
  reasoning_layer_used: POB text and English witness
  rationale: “Interpreters” gives the ordinary meaning of the technical word “expositors.”
- pob_phrase: I mean Philo, the philosopher, and contemporary of the Apostles
  simplified_phrase: including Philo the philosopher, who lived at the time of the apostles
  preserved_meaning: Philo is identified as a philosopher and contemporary of the apostles.
  reasoning_layer_used: POB text and English witness
  rationale: The apposition is recast as a direct time statement for easier reading.
- pob_phrase: interpreted the sayings about Paradise spiritually, and referred them to the Church of Christ
  simplified_phrase: understood the sayings about Paradise in a spiritual sense and applied them to the Church of Christ
  preserved_meaning: They read the Paradise sayings spiritually and connected their meaning with Christ’s Church.
  reasoning_layer_used: POB text and English witness
  rationale: The wording clarifies “referred them” without deciding what specific application was intended.
