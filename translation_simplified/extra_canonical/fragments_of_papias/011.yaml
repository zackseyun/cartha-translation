translation:
  language: en
  text: 'The promised blessing clearly belongs to the time of the Kingdom. Then the righteous will rise from the dead and reign. Creation itself will be renewed and set free from slavery. It will produce abundant food of every kind from heaven’s dew and the richness of the earth.


    The elders who had seen John, the Lord’s disciple, said they heard from him how the Lord taught about that time. He would say:


    “The days will come when each vine will grow ten thousand shoots, each shoot ten thousand branches, each branch ten thousand twigs, each twig ten thousand clusters, and each cluster ten thousand grapes. When pressed, each grape will produce twenty-five measures of wine.[1] When one of the saints takes hold of a cluster, another cluster will cry out, ‘I am a better cluster! Take me, and bless the Lord through me.’


    “In the same way, one grain of wheat will produce ten thousand heads. Each head will have ten thousand grains, and each grain will produce ten pounds of fine flour, bright and pure. The other fruits, seeds, and grasses will produce in similar proportions. All the animals will eat what the soil produces and will become peaceful and live in harmony. They will be completely obedient to human beings.”


    Papias records these things in the fourth of his five books. He had heard John, was a companion of Polycarp, and was a respected man from ancient times. He added:


    “These things are believable to those who believe.”


    But Judas the traitor did not believe. He asked, “How will the Lord make such growth possible?” Papias reports that the Lord answered, “Those who come to that time will see it.”


    — Irenaeus, Against Heresies 5.33.3–4'
