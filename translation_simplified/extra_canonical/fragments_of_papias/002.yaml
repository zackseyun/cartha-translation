  language: en
  text: 'Five books by Papias still exist under the title Expositions of the Oracles of the Lord. Irenaeus says these were the only works Papias wrote:


    “Papias, who heard John and was a companion of Polycarp, was a respected man from an earlier generation. He confirms these things in writing in the fourth of his books. He composed five books in all.”


    That is what Irenaeus says.


    But in the introduction to his own work, Papias does not claim that he personally heard or saw the holy apostles. His words show instead that he learned the teachings of the faith from people who had known them:


    “I will also include with my explanations everything I once carefully learned from the elders and carefully remembered, and I assure you that it is true. Unlike many people, I did not enjoy listening to those who talked a great deal, but to those who taught the truth. I did not listen to people who passed on commands from elsewhere, but to those who passed on the commands the Lord gave to the Faith, which come from the Truth itself.


    “Whenever I met someone who had followed the elders, I asked what the elders had taught—what Andrew, Peter, Philip, Thomas, James, John, Matthew, or any other disciple of the Lord had said, and what Aristion and the Elder John, disciples of the Lord, were saying. I did not think I would gain as much from books as from the words of a living voice that remained among us.”


    Notice that Papias names John twice. First he lists a John with Peter, James, Matthew, and the other apostles, apparently referring to John the Evangelist. Later he names another John among people outside the group of apostles. He places Aristion before this John and specifically calls him “the Elder.” This gives strong support to those who say that two men named John lived in Asia and that there were two tombs in Ephesus, each still called John’s tomb.


    This distinction matters. It was probably the second John who saw the Revelation attributed to John—unless one holds that it was the first. Papias admits that he received the apostles’ words from their followers, but he says that he personally heard Aristion and the Elder John. He often names these two and records their traditions in his writings. I hope this discussion has been useful.


    We should also add other passages from Papias in which he records extraordinary events passed down to him by tradition. It has already been said that the apostle Philip lived in Hierapolis with his daughters. Papias lived at the same time as they did, and he says that he heard a remarkable account from Philip’s daughters: in his own time, a man rose from the dead.


    Papias also tells a remarkable story about Justus, also called Barsabas. Justus drank deadly poison but, by the Lord’s grace, suffered no harm. The book of Acts says that after the Savior ascended, the holy apostles presented this Justus together with Matthias. They prayed for God to choose the right man to replace the traitor Judas and restore their full number. The passage begins approximately this way: “They presented two men: Joseph called Barsabas, who was also known as Justus, and Matthias. Then they prayed and said...”


    Papias also recorded other reports that had reached him through oral tradition. These included unusual parables and teachings of the Savior, along with some other claims of a somewhat legendary character. Among them, he says that after the resurrection there will be a period of about ten thousand years and that Christ’s kingdom will be established physically on this earth. I suppose he reached these ideas by misunderstanding the apostles’ accounts. He did not recognize that they had expressed these things through figures and in a mystical way.


    Judging from his own statements, Papias seems, as one may say, to have been a man of very limited understanding. Yet many later church fathers adopted the same view because of him, appealing to his antiquity for support. Irenaeus was one of them, along with others who held similar views.


    In his work Papias also gives other accounts of the Lord’s words on the authority of Aristion, mentioned above, and records traditions from the Elder John. Anyone interested may consult those accounts. For our present purpose, we will add only a tradition from these sources about Mark, who wrote the Gospel:


    “The Elder also said this: Mark became Peter’s interpreter and accurately wrote down everything he remembered, though he did not record Christ’s words and deeds in their proper order. Mark had neither heard the Lord nor followed him. Later, as I said, he accompanied Peter. Peter shaped his teaching to meet his listeners’ needs and did not intend to give an orderly account of the Lord’s teachings.


    “Therefore, Mark made no mistake when he wrote down some things as he remembered them. His one concern was to leave out nothing he had heard and to include no false statement.”


    That is Papias’s account of Mark. Concerning Matthew, Papias says:


    “Matthew compiled the Lord’s teachings in the Hebrew language, and each person interpreted them as well as he could.”


    Papias also used testimony from the First Letter of John and from Peter’s letter. He also told a story about a woman accused before the Lord of many sins, which the Gospel according—'
