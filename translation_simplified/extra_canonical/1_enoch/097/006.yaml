- pob_phrase: all the words of your lawlessness shall be read out
  simplified_phrase: All your lawless words will be read aloud
  preserved_meaning: The offenders’ words will be publicly disclosed in judgment.
  reasoning_layer_used: POB lexical decisions for ይትነበብ and ኵሉ ነገረ
  rationale: “Read aloud” naturally preserves the public, judicial sense of “read out.”
- pob_phrase: your faces shall be put to shame
  simplified_phrase: Shame will be seen on your faces
  preserved_meaning: Their disgrace will be visibly borne in their faces.
  reasoning_layer_used: POB lexical decision and applied revision for ይትኀፈር ገጽክሙ
  rationale: The recasting is natural English while retaining the source’s face-and-shame image.
- pob_phrase: every deed that is founded in lawlessness
  simplified_phrase: every deed rooted in lawlessness
  preserved_meaning: The deeds are grounded in rebellious wrongdoing, not merely incidentally associated with it.
  reasoning_layer_used: POB lexical decision for ዘጸንዐ በዓመፃ
  rationale: “Rooted” makes the grounding image clearer without weakening it to “done.”
