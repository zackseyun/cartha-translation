translation:
  language: en
  text: All your lawless words will be read aloud before the Great Holy One.[a] Shame will be seen on your faces, and every deed rooted in lawlessness will be rejected.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “All the matters of your lawlessness” is also possible.
    reason: lexical_alternative
  - marker: b
    text: The last clause may also mean “every deed done in lawlessness will be cast away.”
    reason: lexical_alternative
