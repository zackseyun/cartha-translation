translation:
  language: en
  text: In those days, I saw the Head of Days[a] seated on his glorious throne. The books of the living[b] were opened before him. All his host in the heights of heaven stood before him, together with his council.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Head of Days” closely reflects the Ge’ez title; it is not replaced with the more familiar “Ancient of Days.”
    reason: lexical_alternative
  - marker: b
    text: Or “the books of life”; the Ge’ez literally has the plural expression “the books of the living.”
    reason: lexical_alternative
  - marker: c
    text: “Council” may also mean the court or assembly gathered around him.
    reason: lexical_alternative
