  simplified_phrase: will join together and speak with one voice
  preserved_meaning: The heavenly group acts together in vocal agreement.
  reasoning_layer_used: Lexical decisions for የኃብሩ and በ፩ቃል.
  rationale: The wording makes both their joining and their shared voice clear.
- pob_phrase: plead and pray and praise and give thanks and bless
  simplified_phrase: plead and pray, praise and give thanks, and bless
  preserved_meaning: All five distinct acts of petition and worship remain.
  reasoning_layer_used: Lexical decisions for the five coordinated verbs.
  rationale: Grouping the verbs improves flow without merging their meanings.
- pob_phrase: patience may not be theirs forever
  simplified_phrase: the righteous not have to wait patiently forever
  preserved_meaning: The righteous should not endure an endless delay before vindication.
  reasoning_layer_used: Lexical rationale for ትዕግሥት and the grounding review.
  rationale: Naming the righteous prevents the pronoun from wrongly referring to the holy ones.
