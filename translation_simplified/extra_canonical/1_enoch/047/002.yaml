  rendering: They will ask that the prayer ... that judgment ... and that the righteous not have to wait
  claim: The final clauses state what the holy ones seek through their pleading and prayer.
  evidence:
  - The repeated Ethiopic construction introduces parallel purpose or content clauses.
  - The applied revision identifies these clauses as the content of the intercession.
  confidence: high
  alternatives_preserved:
