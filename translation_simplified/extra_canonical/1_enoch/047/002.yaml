translation:
  language: en
  text: In those days, the holy ones who live in the heights of heaven will join together and speak with one voice.[a] They will plead and pray, praise and give thanks, and bless the name of the Lord of Spirits because the blood of the righteous has been poured out. They will ask that the prayer of the righteous not go unanswered before the Lord of Spirits,[b] that judgment be carried out for them,[c] and that the righteous not have to wait patiently forever.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Holy ones” may refer to angels, the righteous in heaven, or both.
    reason: lexical_alternative
  - marker: b
    text: The Ethiopic verb is uncertain; it may also mean that their prayer is not silenced, ended, or rejected.
    reason: textual_variant
  - marker: c
    text: Or “that justice be done for them.”
    reason: lexical_alternative
