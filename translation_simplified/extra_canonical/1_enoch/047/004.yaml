translation:
  language: en
  text: The hearts of the holy ones will be filled with joy, because the full number of the righteous is nearly complete.[a] The prayer of the righteous has been heard, and their shed blood has been accepted before the Lord of Spirits.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “because the reckoning of the righteous has drawn near.”
    reason: lexical_alternative
  - marker: b
    text: Or, “has been regarded favorably.” This means that God has taken notice of their blood; vindication is implied but not stated directly.
    reason: lexical_alternative
