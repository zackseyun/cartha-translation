translation:
  language: en
  text: I raised my hands in righteousness and blessed the Holy and Great One. I spoke with the breath from my mouth and with the tongue of flesh that God made for human beings of flesh, so that they could speak with it. He gave them breath, tongue, and mouth so that they could speak with them.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The word translated “breath” can also mean “spirit,” but here it appears among the bodily means of speech.
    reason: lexical_alternative
