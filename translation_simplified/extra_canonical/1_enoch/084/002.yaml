  text: Blessed are you, O Lord—the great King, mighty in your greatness. You are Lord of everything created in heaven,[a] King of kings, and God of the whole world. Your kingship,[b] your kingdom, and your greatness endure forever and ever. Your authority continues through every generation, one after another. All the heavens are your throne forever, and the whole earth is your footstool forever and ever.
  philosophy: optimal-equivalence
  footnotes:
