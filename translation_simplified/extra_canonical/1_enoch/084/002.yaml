    text: Literally “all creation of heaven”; this may also mean “all heavenly creation.”
    reason: lexical_alternative
  - marker: b
    text: The underlying word is textually difficult and may instead mean “majesty,” “dominion,” or “glory.”
    reason: textual_variant
