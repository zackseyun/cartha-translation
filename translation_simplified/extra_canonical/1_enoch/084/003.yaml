translation:
  language: en
  text: For you have made all things, and you rule over everything. No work is too hard for you. No wisdom of any kind can pass beyond the throne where you dwell or depart from your presence.[a] You know all things; you see and hear. Nothing is hidden from you, for you see all things.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The wording about wisdom is difficult; it may refer to a wise thought, plan, or matter that cannot go beyond God’s royal dwelling place.
    reason: lexical_alternative
  - marker: b
    text: Some witnesses explicitly include the final words, “for you see all things.”
    reason: textual_variant
