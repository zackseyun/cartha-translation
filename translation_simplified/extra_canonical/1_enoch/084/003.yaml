  rationale: Natural word order makes the universal claim clear.
- pob_phrase: no deed is too hard for you
  simplified_phrase: No work is too hard for you
  preserved_meaning: No undertaking exceeds God’s power.
  reasoning_layer_used: applied lexical revision
  rationale: “Work” is common English and preserves the source idiom of difficulty.
- pob_phrase: not even a single wisdom passes beyond the throne of your dwelling, nor turns away from before your face
  simplified_phrase: No wisdom of any kind can pass beyond the throne where you dwell or depart from your presence
  preserved_meaning: No wisdom lies beyond God’s royal dwelling or presence.
  reasoning_layer_used: lexical and theological decisions
  rationale: This keeps the uncertain wisdom and throne imagery while clarifying the presence idiom.
