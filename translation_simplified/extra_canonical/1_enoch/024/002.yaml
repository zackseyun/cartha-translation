  language: en
  text: I went in that direction and saw seven glorious mountains, each unlike the others. Their rocks were glorious and beautiful. All the mountains looked glorious and splendid, and each was fair in face. Three stood toward the east, one above another, and three stood toward the north in the same way. Deep, winding ravines lay there, with one kept apart from another.[a]
