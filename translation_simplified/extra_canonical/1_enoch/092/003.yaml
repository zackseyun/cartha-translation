  risk_flags:
  - risk: Readers may assume that rising from sleep explicitly means resurrection.
    mitigation: Footnote a preserves the ambiguity between ordinary sleep and renewed life.
  - risk: “Kindness” does not convey the term’s full range of mercy, gentleness, and favor.
    mitigation: Footnote b gives the principal lexical alternatives.
