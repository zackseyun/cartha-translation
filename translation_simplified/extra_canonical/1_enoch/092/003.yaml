translation:
  language: en
  text: The righteous one will rise from sleep.[a] He will get up and walk on the path of righteousness. His whole path and journey will be marked by goodness and everlasting kindness.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may picture ordinary sleep or an awakening to renewed life; the verse does not specify which.
    reason: lexical_alternative
  - marker: b
    text: “Everlasting kindness” may also be translated “everlasting mercy” or “eternal favor.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: shall rise from sleep, and he shall arise
  simplified_phrase: will rise from sleep. He will get up
  preserved_meaning: The repeated rising language and the undefined image of sleep remain distinct.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: Two short sentences preserve the repetition without specifying the kind of awakening.
- pob_phrase: walk in the path of righteousness
  simplified_phrase: walk on the path of righteousness
  preserved_meaning: The ethical path image, singular path, and concept of righteousness are retained.
  reasoning_layer_used: Applied grammar revision and lexical decision
  rationale: “On the path” is natural English and keeps the source image.
- pob_phrase: all his path and his course shall be in goodness and in everlasting kindness
  simplified_phrase: His whole path and journey will be marked by goodness and everlasting kindness
  preserved_meaning: His entire way forward is characterized by both goodness and enduring kindness.
  reasoning_layer_used: POB lexical decisions and grounding review
  rationale: “Marked by” expresses character without adding the causal force implied by “shape.”
