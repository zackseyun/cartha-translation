translation:
  language: en
  text: He will appoint holy angels as guardians over everyone who is righteous and holy. The angels will guard them as carefully as someone protects the pupil of the eye, until every evil and every sin comes to an end. Even if the righteous sleep for a long time, they have nothing to fear.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This long sleep may refer to death or the state of the dead, but the text keeps the image of sleep.
    reason: lexical_alternative
