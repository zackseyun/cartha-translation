translation:
  language: en
  text: Woe to you, sinners! When you oppress the righteous on the day of terrible suffering and burn them with fire, you will be repaid for what you have done.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Oppress” may also mean “afflict” or “persecute.”
    reason: lexical_alternative
