translation:
  language: en
  text: Woe to you whose hearts are hard, who stay awake planning evil![a] Fear will come upon you,[b] and no one will help you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Stay awake” may also mean being watchful or lying in wait, but in every case the action is deliberately directed toward evil.
    reason: lexical_alternative
  - marker: b
    text: Or “Fear will overtake you.”
    reason: lexical_alternative
