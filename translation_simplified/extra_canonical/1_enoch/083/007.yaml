translation:
  language: en
  text: I told him everything I had seen in the vision. He said to me, “My son, what you saw is grim, and the vision in your dream is powerful. It reveals all the hidden sin of the earth.[a] It is about to sink into the abyss and be utterly destroyed.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “It has hidden all the sin of the earth.” The wording is difficult.
    reason: lexical_alternative
  - marker: b
    text: The final “it” is unclear and may refer to the earth, its sin, the vision, or the judgment it discloses. The final expression may instead describe being wrapped in great darkness or gloom.
    reason: textual_variant
