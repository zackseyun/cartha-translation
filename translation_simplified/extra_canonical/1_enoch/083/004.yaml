translation:
  language: en
  text: When it fell to the earth, I saw the earth being swallowed by a vast abyss.[a] Mountains hung suspended upon other mountains,[b] and hills sank down on top of other hills. Tall trees were cut off at their trunks, thrown down, and sank into the abyss.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a vast deep” or “a vast chasm.”
    reason: lexical_alternative
  - marker: b
    text: This strange image is part of the vision’s picture of creation collapsing.
    reason: cultural_note
