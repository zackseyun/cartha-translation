translation:
  language: en
  text: Before I married, I saw two visions, and they were unlike each other. The first came while I was learning the book,[a] and the second came before I married your mother. The second was a mighty vision.[b] I pleaded with the Lord about these visions.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “while I was being taught the book.”
    reason: lexical_alternative
  - marker: b
    text: “Mighty” can also mean “severe” or “powerful,” emphasizing the vision’s intensity.
    reason: lexical_alternative
  - marker: c
    text: Or “Because of these visions, I pleaded with the Lord.”
    reason: lexical_alternative
