translation:
  language: en
  text: When I went out below[a], I saw the sky, the sun rising in the east, the moon setting in the west, a few stars, the whole earth, and everything just as the Lord had known it from the beginning. Then I blessed and praised the Lord of judgment, because he had brought the sun out from the windows of the east. The sun rose and climbed up across the face of the sky. Then it set out and followed the path the Lord had shown it.
