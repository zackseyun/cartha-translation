translation:
  language: en
  text: At that time I blessed the Great Lord, the King of Glory forever, because he made every work of the world. I praised the Lord for his patience[a], and I blessed him regarding the children of Adam.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “patient restraint” or “forbearance”; the word means more than passive patience.
    reason: lexical_alternative
  - marker: b
    text: “Children of Adam” means human beings while emphasizing their descent from Adam.
    reason: cultural_note
simplification_decisions:
- pob_phrase: because he has made all the works of the world
  simplified_phrase: because he made every work of the world
  preserved_meaning: God made all the world’s works, and the repeated work language remains visible.
  reasoning_layer_used: POB lexical decision for በከመ ገብረ ኵሎ ግብረ ዓለም
  rationale: The distributive “every work” is easier to read without reducing the phrase to “everything.”
- pob_phrase: and I praised the Lord for his patience, and I blessed him
  simplified_phrase: I praised the Lord for his patience, and I blessed him
  preserved_meaning: Praising and blessing remain two distinct actions.
  reasoning_layer_used: POB lexical decisions for ሰባሕኩ and ባረክዎ
  rationale: A new sentence breaks up the long clause chain while keeping both verbs.
- pob_phrase: on account of the children of Adam
  simplified_phrase: regarding the children of Adam
  preserved_meaning: Enoch blesses God with reference to Adam’s human descendants without defining the precise relation.
  reasoning_layer_used: POB lexical rationale for ዲበ ውሉደ አዳም and theological decision on ውሉደ አዳም
  rationale: “Regarding” is plain English and preserves the preposition’s documented flexibility.
translation_notes:
  risk_flags:
  - risk: “Regarding” leaves the relation between the blessing and humanity open.
    mitigation: This openness preserves the source preposition’s documented ambiguity.
  - risk: Readers may take “children of Adam” as only Adam’s immediate children.
    mitigation: The footnote explains that the phrase refers to human beings descended from Adam.
