  rationale: “Tell” is more natural in modern English while retaining the direct address.
- pob_phrase: walk in it
  simplified_phrase: live by it
  preserved_meaning: Righteousness must shape one’s conduct and way of life.
  reasoning_layer_used: Lexical decision for ወባቲ ሖሩ and its ethical-path rationale
  rationale: “Live by it” makes the ethical sense clear while the next sentence preserves the path image.
- pob_phrase: paths of iniquity
  simplified_phrase: paths of wrongdoing
  preserved_meaning: The opposing paths represent unrighteous conduct broadly, not only violence.
  reasoning_layer_used: Applied lexical revision distinguishing ዓመፃ from violence in 94:2
  rationale: “Wrongdoing” communicates the broad moral contrast more clearly than “iniquity.”
