translation:
  language: en
  text: 'Now I tell you, my children: Love righteousness and live by it. The paths of righteousness are worthy and approved,[a] but the paths of wrongdoing will quickly be destroyed and disappear.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Ge’ez wording is difficult; it describes the righteous paths as fitting and accepted.
    reason: lexical_alternative
