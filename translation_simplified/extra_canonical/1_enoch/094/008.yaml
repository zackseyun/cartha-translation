translation:
  language: en
  text: Woe to you who are rich! You trusted in your wealth, and you will leave it behind.[a] You did not remember the Most High while you were prosperous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “you will depart from your wealth.” The wording may refer to losing wealth or leaving it behind in judgment.
