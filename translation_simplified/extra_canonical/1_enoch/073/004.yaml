  language: en
  text: 'This is how it rises: its head faces east as it comes out on the thirtieth morning. On that day it becomes visible. For you, it will be the head of the month—that is, the month’s beginning—on the thirtieth day with the sun, in the gate from which the sun comes out.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The “gate” belongs to this book’s picture of the sun and moon emerging through ordered openings in the sky.
    reason: cultural_note
