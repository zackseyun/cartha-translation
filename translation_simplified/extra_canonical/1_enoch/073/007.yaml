translation:
  language: en
  text: The moon sets with the sun. When the sun rises, the moon rises with it and takes half a part of light.[b] That night, as morning begins but before daybreak,[a] the moon sets with the sun. It is dark through that night—seven and a half parts.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Ge’ez wording of this dawn sequence is difficult, so the exact timing remains uncertain.
    reason: textual_variant
  - marker: b
    text: This chapter uses numbered “parts” to measure the moon’s light.
    reason: cultural_note
