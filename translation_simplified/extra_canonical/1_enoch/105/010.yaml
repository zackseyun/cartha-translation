translation:
  language: en
  text: 'Now I know this mystery: many sinners will change and corrupt the word of righteousness.[a] They will speak evil words and tell lies. They will invent great falsehoods and write books about what they themselves say.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “The word of righteousness will be neglected, and many sinners will turn aside or go astray.” The Ethiopic reading is uncertain.
    reason: alternative_reading
  - marker: b
    text: Or “devise great inventions or compositions.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: alter the word of righteousness and pervert it
  simplified_phrase: change and corrupt the word of righteousness
  preserved_meaning: Sinners actively distort the righteous message rather than merely neglecting it.
  reasoning_layer_used: applied revision and theological decision
  rationale: Common verbs preserve the active distortion established by the revised Ge‘ez syntax.
- pob_phrase: speak evil words and lie
  simplified_phrase: speak evil words and tell lies
  preserved_meaning: Their speech is both wicked and false.
  reasoning_layer_used: lexical decisions
  rationale: “Tell lies” is natural English and keeps the two accusations distinct.
- pob_phrase: devise great fabrications, and they will write books concerning their own words
  simplified_phrase: invent great falsehoods and write books about what they themselves say
  preserved_meaning: They produce extensive false material and write about their own words.
  reasoning_layer_used: lexical and theological decisions
  rationale: The wording clarifies the negative context without implying that writing itself is condemned.
