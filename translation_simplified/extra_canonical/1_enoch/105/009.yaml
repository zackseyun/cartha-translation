translation:
  language: en
  text: Do not be wicked in your hearts. Do not lie or distort the word of uprightness.[a] Do not call the word of the Great Holy One false. Do not treat your idols as if they amount to anything. All your lies and uncleanness do not lead to righteousness; they lead to great sin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “The word of uprightness” may also mean the word or message of righteousness.
    reason: lexical_alternative
