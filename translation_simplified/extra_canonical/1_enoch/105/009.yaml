  reasoning_layer_used: POB lexical decision for አትሚጥዋ ለነገረ ርትዕ
  rationale: “Distort” makes the harmful nature of the alteration clear.
- pob_phrase: do not account your idols as anything
  simplified_phrase: do not treat your idols as if they amount to anything
  preserved_meaning: The idols must not be reckoned as having real standing or worth.
  reasoning_layer_used: POB theological decision on ትሕስብዋ
  rationale: “Amount to anything” expresses the reckoning language naturally.
- pob_phrase: all your falsehood and all your uncleanness are not for righteousness, but for great sin
  simplified_phrase: All your lies and uncleanness do not lead to righteousness; they lead to great sin
  preserved_meaning: Falsehood and uncleanness stand opposed to righteousness and result in great sin.
  reasoning_layer_used: POB lexical decision for the final antithesis
  rationale: Two direct clauses make the opposing moral outcomes easy to follow.
