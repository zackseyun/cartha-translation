translation:
  language: en
  text: Have hope! Once, you were put to shame by evil and suffering.[a] But now you will shine like the light of heaven. You will shine and be seen, and the portals of heaven will be opened for you.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “by wickedness and suffering.” The wording does not specify whether the evil was personal, social, or circumstantial.
    reason: lexical_alternative
  - marker: b
    text: This image does not specify whether something comes through heaven’s portals or whether the righteous enter them.
    reason: simplification_note
simplification_decisions:
- pob_phrase: Hope
  simplified_phrase: Have hope!
  preserved_meaning: The plural command directly urges the hearers to hope.
  reasoning_layer_used: Lexical decision for ተስፈዉ.
  rationale: Adding “have” makes the command natural in modern English without weakening it.
- pob_phrase: formerly you were put to shame by evil and by affliction
  simplified_phrase: Once, you were put to shame by evil and suffering
  preserved_meaning: The hearers formerly experienced shame linked with evil and distress, without defining that link.
  reasoning_layer_used: Lexical decisions for ቀዳሚ, ኃሠርክሙ, በእኩይ, and በምራኅ.
  rationale: The passive wording preserves the source ambiguity while “once” and “suffering” are easier to understand.
- pob_phrase: the portals of heaven will be opened for you
  simplified_phrase: the portals of heaven will be opened for you
  preserved_meaning: The righteous receive a promise of vindication and heavenly access without specifying what the opening allows.
  reasoning_layer_used: Applied lexical revision and theological decision on the final image.
  rationale: The Enochic image remains because explaining it as entry or descending blessing would go beyond the text.
translation_notes:
  risk_flags:
  - risk: “By evil and suffering” may still be read as identifying direct agents of the shame.
    mitigation: The passive construction and footnote preserve personal, social, and circumstantial possibilities.
  - risk: “Portals” may suggest that the righteous enter heaven.
    mitigation: The second footnote states that the image does not resolve what the opening permits.
