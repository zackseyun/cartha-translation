  text: The spirit of the sea is male and strong.[a] According to the mighty force of its strength, he holds it back with a rein.[b] Then it is driven out and scattered among all the mountains of the earth.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the wind of the sea” or “the breath of the sea”; the personified setting favors “spirit.”
    reason: lexical_alternative
  - marker: b
    text: An earlier rendering reads “the mighty force of his strength,” but the Ge’ez grammar supports “its,” referring to the sea.
    reason: lexical_alternative
  - marker: c
    text: The exact picture is uncertain; it may be dispersed over the mountains as mist, spray, or storm clouds.
    reason: cultural_note
