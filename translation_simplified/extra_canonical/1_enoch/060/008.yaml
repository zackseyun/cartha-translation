translation:
  language: en
  text: The male was named Behemoth. With his chest, he occupies an unseen wilderness called Dundayin,[a] east of the garden.[b] The chosen and the righteous live there. My ancestor was taken up there. He was the seventh from Adam. Adam was the first human whom the Lord of Spirits made.
  philosophy: optimal-equivalence
  footnotes:
