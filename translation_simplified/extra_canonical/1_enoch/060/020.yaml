translation:
  language: en
  text: The spirit of the dew lives at the ends of heaven. It is linked to the storehouses of the rain. Its course is in both winter and summer.[a] Its clouds join with the clouds of mist,[b] and one gives to another.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The word translated “course” may also mean “path” or “circuit.”
    reason: lexical_alternative
  - marker: b
    text: The word translated “mist” may also mean “fog” or “haze.”
    reason: lexical_alternative
  - marker: c
    text: The final phrase may mean that these weather phenomena give to one another.
    reason: lexical_alternative
