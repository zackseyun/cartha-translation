translation:
  language: en
  text: When lightning flashes, thunder gives its voice. At its appointed time, the spirit[a] rests and apportions among them.[b] The treasury of their times is sand. The two are held back with a bridle and turned back by the spirit’s power. In the same way, they are driven onward across the earth’s many regions.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Spirit” may also mean “wind” in both places; the storm setting allows either sense.
    reason: lexical_alternative
  - marker: b
    text: This uncertain clause may also mean “divides equally among them.”
    reason: alternative_reading
  - marker: c
    text: The final wording is difficult; “regions” may also be understood as “dwelling places.”
    reason: textual_variant
