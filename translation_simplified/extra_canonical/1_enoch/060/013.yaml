translation:
  language: en
  text: And thunder in their places,[a] and every section divided by lightning so that it may flash, and their restraint, so that they may hear quickly.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Ge’ez is difficult; this may also mean “according to their stations,” “by their measures,” or “in their places of striking.”
    reason: lexical_alternative
  - marker: b
    text: The final words may mean that they respond or obey quickly, not merely that they hear quickly.
    reason: lexical_alternative
