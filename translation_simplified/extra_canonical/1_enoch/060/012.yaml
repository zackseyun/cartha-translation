  rationale: A framed list replaces the dense chain of clauses without merging its distinct items.
- pob_phrase: the portals of the spirits are reckoned
  simplified_phrase: the portals of the spirits are counted
  preserved_meaning: The portals are subject to exact heavenly accounting.
  reasoning_layer_used: POB lexical decision for ይኄለቁ
  rationale: “Counted” expresses “reckoned” in common English.
- pob_phrase: every division shall be apportioned
  simplified_phrase: Every division will be assigned its share
  preserved_meaning: Each cosmic division receives an ordered allotment.
  reasoning_layer_used: POB lexical decision for ኵሉ ክፍለ ይትከፈል
  rationale: “Assigned its share” clearly conveys ordered distribution and retains the future sense.
