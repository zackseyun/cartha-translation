translation:
  language: en
  text: 'The following are part of this ordered arrangement: the treasuries of the spirits[a]; how the spirits are divided and weighed out; how the portals of the spirits are counted, each according to the power of the spirit; their powers for the moon’s light and according to the power of righteousness; and the divisions of the stars by name. Every division will be assigned its share.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Spirits” may also mean “winds,” preserving an ambiguity between heavenly powers and forces of nature.
    reason: lexical_alternative
  - marker: b
    text: Several clauses are difficult in the surviving Geʽez text. “Weighed out” and “counted” may more generally mean “measured” and “numbered,” and “portals” may refer more generally to chambers or compartments.
    reason: textual_variant
