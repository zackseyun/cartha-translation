translation:
  language: en
  text: Another angel went with me and showed me hidden things. He told me what is first and what is last[a] in heaven—in the heights, in the depths beneath the earth,[b] at the ends of heaven, and at heaven’s foundations.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may also be translated “the first and the last,” but here it describes cosmic extremities rather than a title.
    reason: lexical_alternative
  - marker: b
    text: The wording in the surviving witness is difficult here, so the translation keeps the general sense of depth rather than specifying an abyss.
    reason: textual_variant
