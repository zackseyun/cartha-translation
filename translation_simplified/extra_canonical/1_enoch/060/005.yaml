translation:
  language: en
  text: Michael said to me, “Why does a vision like this trouble you? Until now, God’s time of mercy has continued. He has shown mercy and delayed his wrath toward those who live on the dry land.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Dry land” may contrast those living on land with the sea creatures in the surrounding passage.
    reason: cultural_note
