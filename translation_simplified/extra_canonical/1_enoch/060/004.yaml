translation:
  language: en
  text: Michael sent another angel from among the holy ones, and that angel lifted me up. When he lifted me up, my spirit entered in.[a] For I could not bear the sight of that power, its shaking, and the quaking of heaven.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The difficult Ge'ez wording may mean that Enoch's spirit returned to him or entered a new visionary state.
    reason: lexical_alternative
  - marker: b
    text: The exact relationship among the power, the shaking or tumult, and heaven's quaking is unclear.
    reason: alternative_reading
