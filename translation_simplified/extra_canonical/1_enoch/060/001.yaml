translation:
  language: en
  text: 'In the five-hundredth year, during Henok’s life—on the fourteenth day of the seventh month—I saw this in that parable: the heaven of heavens[a] shook with a great shaking. The host of the Most High[b] and the angels—thousands of thousands and ten thousand times ten thousand—were stirred into great turmoil.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the highest heaven”; the original expression is literally “the heaven of heavens.”
    reason: lexical_alternative
  - marker: b
    text: This could also mean “the power of the Most High,” but the surrounding reference to countless angels favors “host.”
    reason: lexical_alternative
