translation:
  language: en
  text: On the four sides of the Lord of Spirits,[a] I saw four other faces.[b] They were different from the beings who never sleep. I learned their names because the angel who accompanied me told me their names and showed me all the hidden things.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The source may also mean “beside the four wings of the Lord of Spirits.”
    reason: lexical_alternative
  - marker: b
    text: The vision calls them “faces,” preserving what Enoch visibly saw rather than using a more abstract term.
    reason: simplification_note
