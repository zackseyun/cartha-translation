- pob_phrase: different from those who do not sleep
  simplified_phrase: different from the beings who never sleep
  preserved_meaning: The four faces are distinct from the previously mentioned sleepless heavenly beings.
  reasoning_layer_used: lexical decision and immediate visionary context
  rationale: Naming “those” as beings makes the comparison clear without identifying them more narrowly.
- pob_phrase: the angel who came with me made their names known to me
  simplified_phrase: the angel who accompanied me told me their names
  preserved_meaning: Enoch learned the names from the angel traveling with him.
  reasoning_layer_used: lexical decision for the causative clause
  rationale: Ordinary English states the same action more directly.
