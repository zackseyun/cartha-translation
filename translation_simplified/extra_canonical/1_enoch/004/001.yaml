translation:
  language: en
  text: Again, look closely at the days of summer. Notice how the sun begins to bear down when summer starts.[a] You look for shelter and shade because of the sun’s heat. The ground is scorched by burning heat, and you cannot walk on the ground or on rock because they are so hot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Ethiopic wording is difficult; it may refer more specifically to the sun’s growing strength at the beginning of summer.
    reason: textual_variant
simplification_decisions:
- pob_phrase: observe the days of summer
  simplified_phrase: look closely at the days of summer
  preserved_meaning: The reader is commanded to examine the summer season attentively.
  reasoning_layer_used: Applied lexical revision supported by the immediate context and Greek witness
  rationale: “Look closely” makes the command natural while retaining its observational force.
- pob_phrase: the earth is scorched with burning heat
  simplified_phrase: The ground is scorched by burning heat
  preserved_meaning: Intense summer heat burns the earth’s surface.
  reasoning_layer_used: POB lexical decision for the vivid physical image
  rationale: “Ground” is clearer in this physical setting while “scorched” preserves the image.
- pob_phrase: you cannot tread on the earth or upon a rock because of its heat
  simplified_phrase: you cannot walk on the ground or on rock because they are so hot
  preserved_meaning: The earth and rock become too hot to step on.
  reasoning_layer_used: Corrected full Ethiopic source and human source revision
  rationale: “Walk on” replaces formal “tread on” without weakening the restored clause.
