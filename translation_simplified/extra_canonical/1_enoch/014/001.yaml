translation:
  language: en
  text: This book contains a message of righteousness and a rebuke concerning the vigilant ones,[a] who come from eternity.[b] It is just as the Holy and Great One commanded in that vision.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Also called “the Watchers”; the name describes those who remain awake and watchful.
    reason: lexical_alternative
  - marker: b
    text: “From eternity” may instead mean “from ancient times.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the book of the words of righteousness and of the reproof
  simplified_phrase: This book contains a message of righteousness and a rebuke
  preserved_meaning: The book presents words about righteousness and a formal rebuke as distinct contents.
  reasoning_layer_used: POB lexical decisions for “book,” “words,” “righteousness,” and “reproof”
  rationale: “Contains a message” turns the dense heading into natural English while retaining both subjects.
- pob_phrase: the reproof of the vigilant ones
  simplified_phrase: a rebuke concerning the vigilant ones
  preserved_meaning: The Watchers remain connected with the rebuke without specifying whether they give, receive, or are its subject.
  reasoning_layer_used: Independent grounding review and POB’s unresolved genitive construction
  rationale: “Concerning” avoids the unsupported direction implied by “for” while reading more clearly than an opaque “of.”
- pob_phrase: just as the Holy and Great One commanded in that vision
  simplified_phrase: It is just as the Holy and Great One commanded in that vision
  preserved_meaning: The book accords with the divine command given in the vision.
  reasoning_layer_used: POB lexical decisions and applied revision
  rationale: A separate sentence makes the relationship easier to follow without weakening divine authority.
translation_notes:
  risk_flags:
  - risk: “Concerning” may narrow the broad source genitive toward a topical relationship.
    mitigation: The wording avoids identifying the Watchers as either the speakers or recipients of the rebuke.
  - risk: “Come from eternity” may imply that the vigilant ones are absolutely eternal.
    mitigation: Footnote b preserves the possible meaning “from ancient times.”
