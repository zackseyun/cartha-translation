translation:
  language: en
  text: 'I wrote down your petition. Then my vision showed me this: “Your petition will never be granted—not through all the days of eternity. The sentence[a] against you is final, and your petition will not be granted.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “decree” or “final decision.”
    reason: lexical_alternative
