translation:
  language: en
  text: Just as he created humankind and enabled them to understand the word of knowledge, he also created me and gave me reproof concerning the Watchers—the sons of heaven.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Watchers are the vigilant heavenly beings central to this part of 1 Enoch.
    reason: lexical_alternative
  - marker: b
    text: The Ethiopic wording is difficult. It may refer to reproof concerning the Watchers; another possible sense is that the heavenly beings received a negative allotment or condition.
    reason: textual_variant
