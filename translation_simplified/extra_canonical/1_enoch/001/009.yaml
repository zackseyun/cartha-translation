translation:
  language: en
  text: Look! He comes with tens of thousands of holy ones.[a] He comes to carry out judgment against them, destroy the wicked, and rebuke all humanity for everything sinful and wicked people have done and said against him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Holy ones” may refer to a vast heavenly company; the wording does not specify whether they are angels or human saints.
    reason: lexical_alternative
