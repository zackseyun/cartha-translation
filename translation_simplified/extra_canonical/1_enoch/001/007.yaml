    text: Or “everything on the earth.” The Ge‘ez literally says “everything in the earth.”
    reason: lexical_alternative
  - marker: b
    text: The word can also mean “justice” or “righteousness,” but here it refers to a coming act of judgment.
    reason: lexical_alternative
