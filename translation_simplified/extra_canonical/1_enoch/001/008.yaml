translation:
  language: en
  text: He will bring peace to the righteous[a] and protect the chosen ones. Favor will rest on them. They will all belong to God; they will flourish and be blessed, and God's light will shine on them.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The opening words are uncertain in the surviving text, but the passage clearly speaks of God's favor toward the righteous.
    reason: textual_variant
  - marker: b
    text: “Flourish” may also be translated “prosper” or “do well”; it does not refer only to material wealth.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: make peace for the righteous
  simplified_phrase: bring peace to the righteous
  preserved_meaning: God establishes peace for the righteous without implying reconciliation after hostility.
  reasoning_layer_used: lexical decision and applied mistranslation review
  rationale: “Bring peace to” is natural English and avoids the misleading phrase “make peace with.”
- pob_phrase: he will guard the chosen ones
  simplified_phrase: protect the chosen ones
  preserved_meaning: God preserves the chosen ones from harm while keeping their distinct title.
  reasoning_layer_used: lexical and theological decisions
  rationale: “Protect” makes the guarding sense immediate without merging the chosen ones with the righteous.
- pob_phrase: they will prosper
  simplified_phrase: they will flourish
  preserved_meaning: They will experience broad well-being rather than merely gain material wealth.
  reasoning_layer_used: lexical decision and footnote b
  rationale: “Flourish” clearly expresses thriving while retaining the documented lexical range.
