translation:
  language: en
  text: Everyone will be afraid, and the mighty ones[a] will tremble. Fear and intense trembling will seize them, reaching to the farthest ends of the earth.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “The mighty ones” leaves their identity open; they may be powerful human or angelic beings.
    reason: lexical_alternative
  - marker: b
    text: “The farthest ends of the earth” means the whole world, even its most distant places.
    reason: cultural_note
simplification_decisions:
- pob_phrase: And all will fear
  simplified_phrase: Everyone will be afraid
  preserved_meaning: All will enter a state of fear.
  reasoning_layer_used: Lexical decisions for ይፈርሁ and ኵሉ
  rationale: This is natural English and preserves both the universal scope and resulting state.
- pob_phrase: the vigilant ones will tremble
  simplified_phrase: the mighty ones will tremble
  preserved_meaning: Powerful beings will tremble, without specifying whether they are human or angelic.
  reasoning_layer_used: Lexical and theological decisions for ትጉሃን
  rationale: The generic wording preserves the audited ambiguity instead of identifying them as Watchers.
- pob_phrase: fear and great trembling will seize them as far as the ends of the earth
  simplified_phrase: Fear and intense trembling will seize them, reaching to the farthest ends of the earth
  preserved_meaning: Overwhelming fear extends throughout the whole earth while retaining the source image.
  reasoning_layer_used: Lexical decisions for the fear phrase and cultural note on the ends of the earth
  rationale: “Intense trembling” conveys degree without over-specifying violent bodily shaking.
