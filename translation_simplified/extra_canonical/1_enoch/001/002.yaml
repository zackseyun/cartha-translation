  rationale: The active wording is easier to read while preserving divine agency and the opened-eyes image.
- pob_phrase: which the angels showed me; and from them I heard everything
  simplified_phrase: The angels showed it to me. I heard everything from them
  preserved_meaning: Angels mediated both the visible and spoken revelation.
  reasoning_layer_used: POB lexical decisions
  rationale: Two short sentences clarify the distinct acts of seeing and hearing.
- pob_phrase: but not for this generation, but for a distant one that is to come
  simplified_phrase: This vision was not for the present generation, but for a distant generation still to come
  preserved_meaning: The revelation concerns a generation far removed from Enoch’s own.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: Naming the contrasted generation makes the future orientation clear without removing its distance.
