translation:
  language: en
  text: 'Enoch answered and said:


    “A righteous man, whose eyes God opened,[a] saw a holy vision in the heavens. The angels showed it to me. I heard everything from them, and I understood what I saw. This vision was not for the present generation, but for a distant generation still to come.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Ethiopic wording is textually awkward, but it indicates that God opened Enoch’s sight for the vision.
    reason: textual_variant
  - marker: b
    text: The last phrase may also mean “for a generation far away that will come”; it may refer to one future generation or to future people collectively.
    reason: lexical_alternative
