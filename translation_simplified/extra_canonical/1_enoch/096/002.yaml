translation:
  language: en
  text: When sinners are judged, your children will rise and be lifted high like eagles. Your nest[a] will be higher than the vultures. You will go up and enter the cracks in the ground and the openings in the rock forever, like hyraxes before the lawless.[b] The sirens[c] will groan over you and weep.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Ethiopic wording is difficult and may refer to a shelter or shaded dwelling rather than a literal nest.
    reason: textual_variant
  - marker: b
    text: Hyraxes are small rock-dwelling animals traditionally called coneys.
    reason: cultural_note
  - marker: c
    text: “Sirens” refers here to creatures traditionally associated with lamentation.
    reason: cultural_note
