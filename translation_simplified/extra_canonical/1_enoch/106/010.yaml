translation:
  language: en
  text: Now listen to me, my father. A son has been born to my son Lamech. The child’s appearance and bodily form are unlike those of a human being. His color is whiter than snow and redder than a rose blossom.[a] The hair on his head is whiter than white wool. His eyes are like the sun’s rays.[b] He opened his eyes and lit up the whole house.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The word may mean a red blossom in general rather than a rose specifically.
    reason: lexical_alternative
  - marker: b
    text: The original phrase is difficult, but it clearly compares his eyes to the sun’s brightness.
    reason: lexical_alternative
