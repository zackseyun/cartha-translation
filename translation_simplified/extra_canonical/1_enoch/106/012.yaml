  text: Lamech, the child’s father, was afraid and fled to me. He did not believe that the child was his own. Instead, he believed that the child resembled the angels of heaven. Now I have come to you so that you can tell me the truth.[a]
  philosophy: optimal-equivalence
  footnotes:
