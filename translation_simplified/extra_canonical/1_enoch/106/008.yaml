translation:
  language: en
  text: When Methuselah heard what his son had said, he traveled to me at the ends of the earth because he had heard that I was there. He called out, and I heard his voice. I went to him and said, “Here I am, my son. Why have you come to me?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Ethiopic wording is awkward if translated literally as “because you came to me”; the context supports this question.
    reason: textual_variant
