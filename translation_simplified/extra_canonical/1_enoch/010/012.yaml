  text: After all their sons have killed one another, and after they have seen their loved ones destroyed, bind them for seventy generations beneath the hills of the earth.[a] Keep them there until the day of their judgment and their completion,[b] until the eternal judgment is complete.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Ge'ez word may also mean “mountains.”
    reason: lexical_alternative
  - marker: b
    text: “Their completion” may also mean “their end” or “their final completion.”
    reason: lexical_alternative
