translation:
  language: en
  text: The Lord said to Gabriel, “Go against the bastard offspring,[a] the rejected ones, and the children born from sexual sin. Destroy those children and the children of the Watchers[b] from among humanity. Send them against one another, and let them perish in battle, because they will not live long.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the illegitimate offspring.” The original uses a harsh label for children born from an illicit union.
    reason: lexical_alternative
  - marker: b
    text: The wording behind “children of the Watchers” is difficult, but the surrounding account supports this meaning.
    reason: textual_variant
