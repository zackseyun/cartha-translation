  rationale: “Rejected ones” makes the uncommon term “reprobates” immediately understandable without softening the judgment.
- pob_phrase: the children of fornication
  simplified_phrase: the children born from sexual sin
  preserved_meaning: Their origin in a sexually forbidden union remains explicit.
  reasoning_layer_used: POB lexical decision for ዘማ
  rationale: The wording explains the older term “fornication” in direct modern English.
- pob_phrase: for length of days shall not be theirs
  simplified_phrase: because they will not live long
  preserved_meaning: The condemned offspring are denied a long lifespan.
  reasoning_layer_used: POB lexical decision and judgment context
  rationale: The solemn formula is recast as a clear reason clause.
