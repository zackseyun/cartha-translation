translation:
  language: en
  text: Go to Noah and tell him in my name, “Hide yourself!” Then tell him about the destruction that is coming.[a] The whole earth will be destroyed. Floodwaters are about to spread across the whole earth and destroy everything in it.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “the end that is coming,” referring here to the destruction brought by the flood.
    reason: simplification_note
simplification_decisions:
- pob_phrase: say to him in my name
  simplified_phrase: tell him in my name
  preserved_meaning: The messenger speaks to Noah with delegated divine authority.
  reasoning_layer_used: Lexical decision for በስመ ዚአየ
  rationale: “Tell him” is natural in this commission while “in my name” preserves the authority formula.
- pob_phrase: reveal to him the end that is coming
  simplified_phrase: tell him about the destruction that is coming
  preserved_meaning: The messenger must disclose the impending destructive end associated with the flood.
  reasoning_layer_used: Theological decision on the scope of “the end”
  rationale: The wording makes the local flood judgment clear without suggesting the final cosmic end.
- pob_phrase: a flood of waters is about to come upon all the earth
  simplified_phrase: Floodwaters are about to spread across the whole earth
  preserved_meaning: An imminent watery flood will extend over the entire earth.
  reasoning_layer_used: Lexical decisions for ማየ አይኅ and ሀሎ ዲበ ኵሉ ምድር
  rationale: “Floodwaters” keeps the water image while replacing the less natural phrase “flood of waters.”
