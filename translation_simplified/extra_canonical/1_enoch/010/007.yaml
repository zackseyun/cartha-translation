translation:
  language: en
  text: Heal the earth that the angels have corrupted. Make known the healing of the earth,[a] so that they may heal the earth and all human beings may not perish because of all the secret knowledge that the Watchers disclosed[b] and taught to their sons.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Ge'ez wording is difficult and may also mean “make known the life” or “make known the restoration of the earth”; the identity of “they” in the next clause is also unclear.
    reason: textual_variant
  - marker: b
    text: The Ge'ez literally reads “killed,” apparently reflecting a corruption in the underlying Greek text; “disclosed” gives the intended sense.
    reason: textual_variant
simplification_decisions:
- pob_phrase: And heal the earth which the angels have corrupted
  simplified_phrase: Heal the earth that the angels have corrupted.
  preserved_meaning: The earth itself must be restored from the angels’ cosmic and moral damage.
  reasoning_layer_used: Lexical and theological decisions on healing and corruption
  rationale: A direct sentence keeps the command and the earth-centered restoration clear.
- pob_phrase: make known the healing of the earth
  simplified_phrase: Make known the healing of the earth
  preserved_meaning: The earth’s healing is to be revealed without turning the difficult phrase into a method.
  reasoning_layer_used: Lexical decision for ሕይወታ and textual-ambiguity footnote
  rationale: The footnote preserves the possible senses of life and restoration.
- pob_phrase: all the children of men may not perish through all the secrets
  simplified_phrase: all human beings may not perish because of all the secret knowledge
  preserved_meaning: Humanity faces destruction because of the Watchers’ illicit revelations.
  reasoning_layer_used: Lexical decisions for perishing and secrets
  rationale: Common wording clarifies who is endangered and how the revealed knowledge threatens them.
interpretive_expansions:
- pob_phrase: all the secrets
  rendering: all the secret knowledge
  claim: The secrets are hidden teachings disclosed by the Watchers rather than legitimate divine mysteries.
  evidence:
