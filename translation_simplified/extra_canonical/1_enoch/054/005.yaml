translation:
  language: en
  text: He told me, “These are being prepared for Azazʾel’s company,[a] so that they may take them and throw them into the lowest part of the place of judgment. Then they will cover their jaws with rough stones,[b] as the Lord of Spirits commanded.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Geʾez wording is difficult; it may instead refer to Azazʾel’s deed or, more generally, to those who belong to him.
    reason: textual_variant
  - marker: b
    text: Another reading is, “Rough stones will cover their angels.”
    reason: textual_variant
