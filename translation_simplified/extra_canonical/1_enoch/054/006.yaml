translation:
  language: en
  text: On that great day, Michael, Gabriel, Raphael, and Phanuel will seize them and throw them into the burning furnace. They will do this so that the Lord of Spirits may take vengeance on them for their lawlessness, because they became servants of Satan[a] and led astray those who live on the dry land.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The difficult Ge'ez phrase may also mean “slaves of Satan” or, less likely, “messengers of Satan.”
    reason: textual_variant
  - marker: b
    text: “Dry land” may refer generally to the earth and its inhabitants, but the concrete image is retained.
    reason: lexical_alternative
