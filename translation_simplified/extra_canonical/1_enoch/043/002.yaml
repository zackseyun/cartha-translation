  text: I saw the scales of righteousness[a]. The heavenly lights were weighed according to their brightness, the width of their appointed places, and the day when they appeared. Their turning brings forth lightning. Their turning follows the number of the angels, and they remain faithful to one another[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The opening words are difficult; they may instead describe the heavenly lights as being divided or apportioned in an ordered way.
    reason: textual_variant
  - marker: b
    text: The final words may mean either that the heavenly bodies remain faithful to one another or that their order follows the angels’ reckoning.
    reason: alternative_reading
