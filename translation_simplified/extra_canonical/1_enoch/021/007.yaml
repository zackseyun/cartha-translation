translation:
  language: en
  text: 'From there I went to another place, even more terrible than the one before it. There I saw a terrifying thing: a great fire burned and blazed. The place had a chasm reaching down to the abyss, full of great pillars of fire descending.[a] I could not determine its dimensions, and I was not able to look at it.'
  philosophy: optimal-equivalence
  footnotes:
