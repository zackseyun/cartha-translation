translation:
  language: en
  text: These are some of the stars[a] that disobeyed the Lord’s command. They are bound here until ten thousand years are complete[b]—the number of the days of their sins.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “These are from the stars.” In this vision, “stars” may portray heavenly beings under judgment.
    reason: lexical_alternative
  - marker: b
    text: “Ten thousand years” may also express an immense appointed period, but the stated number is retained.
    reason: cultural_note
  - marker: c
    text: Literally, “the number of the days of their sins.” The phrase may picture their confinement as measured in relation to their sins.
    reason: simplification_note
