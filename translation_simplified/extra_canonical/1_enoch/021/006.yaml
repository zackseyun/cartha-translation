  rationale: “Some of” avoids a merely locational reading of “among.”
- pob_phrase: transgressed the command of the Lord
  simplified_phrase: disobeyed the Lord’s command
  preserved_meaning: The stars violated the Lord’s authoritative command.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: “Disobeyed” expresses the same violation in familiar English.
- pob_phrase: and they are bound here until ten thousand years are completed
  simplified_phrase: They are bound here until ten thousand years are complete
  preserved_meaning: Their present confinement continues for the stated period.
  reasoning_layer_used: POB confinement and time-expression decisions
