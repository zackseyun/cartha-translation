- pob_phrase: all the sheep that were left
  simplified_phrase: all the sheep that remained
  preserved_meaning: The sheep are the remnant left after judgment.
  reasoning_layer_used: POB lexical decision
  rationale: “Remained” is natural English without specifying how they survived.
- pob_phrase: every beast that was upon the earth, and all the birds of heaven
  simplified_phrase: Every beast on the earth and every bird of heaven
  preserved_meaning: All earthly beasts and heavenly birds participate in the symbolic scene.
  reasoning_layer_used: POB lexical decisions
  rationale: The wording is shorter while retaining the vision’s animal imagery and elevated register.
- pob_phrase: falling down and bowing to those sheep, and making petition to them
  simplified_phrase: fell down and bowed before those sheep. They pleaded with them
  preserved_meaning: The beasts and birds physically submit and earnestly appeal to the sheep.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: Two direct sentences clarify the action without calling it worship.
