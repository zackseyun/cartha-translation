translation:
  language: en
  text: Then I saw all the sheep that remained. Every beast on the earth and every bird of heaven fell down and bowed before those sheep. They pleaded with them and obeyed every word they said.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The word translated “obeyed” literally means “heard,” but here it means hearing with submission.
    reason: lexical_alternative
