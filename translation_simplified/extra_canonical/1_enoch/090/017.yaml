translation:
  language: en
  text: I watched until the man who was writing a book at the Lord’s command opened the book recording the destruction caused by the twelve shepherds. Before the Lord of the sheep, he showed that they had destroyed far more than they had been permitted to destroy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The final words are difficult in the Ethiopic. They may instead mean, “They had destroyed far more than the shepherds who came before them.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: And I saw until
  simplified_phrase: I watched until
  preserved_meaning: The narrator kept watching until the next event in the vision.
  reasoning_layer_used: lexical decision and repeated visionary formula
  rationale: “Watched” naturally conveys continued seeing while retaining the formula’s “until.”
- pob_phrase: who was writing a book by the word of the Lord
  simplified_phrase: who was writing a book at the Lord’s command
  preserved_meaning: The man writes under the Lord’s authority.
  reasoning_layer_used: lexical rationale for በቃለ እግዚአ
  rationale: “At the Lord’s command” clearly expresses the documented sense of authorization.
- pob_phrase: book of destruction which those twelve shepherds had wrought
  simplified_phrase: book recording the destruction caused by the twelve shepherds
  preserved_meaning: The book records their destruction and was not itself destroyed.
  reasoning_layer_used: applied mistranslation revision
  rationale: This wording removes the false impression that the shepherds damaged the book.
interpretive_expansions:
- pob_phrase: much more than those before them
  rendering: far more than they had been permitted to destroy
  claim: The twelve shepherds exceeded the limit assigned to them.
  evidence:
  - The POB textual note identifies excess beyond their assigned charge as the apparent sense.
  - The POB theological decision makes exceeding their allotted limit the chosen reading.
  confidence: moderate
  alternatives_preserved:
  - far more than the shepherds who came before them
translation_notes:
  risk_flags:
  - risk: The difficult final phrase may compare the twelve shepherds with their predecessors instead of an assigned limit.
    mitigation: Footnote a preserves the predecessor reading without weakening the POB’s chosen contextual sense.
