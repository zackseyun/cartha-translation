    text: The wording about being brought up before is textually difficult; this translation follows the apparent sense of guided ascent.
    reason: textual_variant
  - marker: b
    text: The sheep and the ram belong to the vision’s symbolic imagery, in which people and groups are portrayed as animals.
    reason: cultural_note
