translation:
  language: en
  text: He spoke to the man who was writing in front of him, one of the seven white ones. Then he said to him, “Take those seventy shepherds. I entrusted the sheep to them, but they took the sheep and killed many more than I commanded them to kill.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And he said to that man who was writing before him, who was one of those seven white ones, and he said to him
  simplified_phrase: He spoke to the man who was writing in front of him, one of the seven white ones. Then he said to him
  preserved_meaning: The heavenly scribe belongs to the seven white ones, and the repeated speech frame remains present.
  reasoning_layer_used: Applied revision and lexical decisions
  rationale: Two sentences make the interrupted speech frame easier to follow without deleting its repetition.
- pob_phrase: to whom I delivered the sheep
  simplified_phrase: I entrusted the sheep to them
  preserved_meaning: The sheep had been placed under the shepherds’ charge.
  reasoning_layer_used: Lexical decision for መጠውክዎሙ
  rationale: “Entrusted” clearly expresses responsibility rather than merely physical delivery.
- pob_phrase: and they, taking them, killed
  simplified_phrase: but they took the sheep and killed
  preserved_meaning: The shepherds took the sheep and then killed them.
  reasoning_layer_used: Lexical decision for ነሢኦሙ ቀተሉ
  rationale: A direct action sequence replaces the awkward participial clause.
interpretive_expansions:
- pob_phrase: taking them
  rendering: they took the sheep
  claim: The pronoun refers to the sheep entrusted to the shepherds.
  evidence:
  - The sheep are the immediate object entrusted to the shepherds in the same sentence.
  confidence: high
- pob_phrase: many more than I commanded them
  rendering: many more than I commanded them to kill
  claim: The command set a limit on how many sheep the shepherds were authorized to kill.
  evidence:
  - The source phrase compares the number killed with what had been commanded.
  - The theological audit requires real authorization that the shepherds exceeded.
  confidence: high
  alternatives_preserved:
