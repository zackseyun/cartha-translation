translation:
  language: en
  text: The sheep cried out because the birds were devouring their flesh.[a] In my sleep, I watched and lamented over the shepherd who was tending the sheep.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The text says “birds”; the devouring shows that they are acting as predators.
    reason: lexical_alternative
  - marker: b
    text: Or “I watched and wailed in my sleep.”
    reason: lexical_alternative
