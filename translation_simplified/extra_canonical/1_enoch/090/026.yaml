  text: At that time I saw a similar deep abyss open in the middle of the earth. It was full of fire. They brought those blinded sheep[a] there. All of them were judged and found to be sinners. They were cast into that deep abyss of fire, and they burned. This abyss came to be on the right side of that house.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The sheep are people represented as animals in this vision, not literal sheep.
    reason: cultural_note
