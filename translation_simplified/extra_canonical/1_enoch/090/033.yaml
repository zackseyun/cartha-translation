translation:
  language: en
  text: All who had been scattered and dispersed,[a] along with every wild animal and every bird of heaven, were gathered into that house. The Lord of the sheep rejoiced with great joy, because they had all become good and had entered his house.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The two verbs reinforce the picture of those who had been scattered and dispersed.
    reason: simplification_note
  - marker: b
    text: The house is the restored dwelling or temple pictured in the vision, not merely an ordinary building.
    reason: cultural_note
