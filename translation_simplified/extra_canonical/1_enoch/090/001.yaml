translation:
  language: en
  text: I kept watching until the time when thirty-seven shepherds were tending the flock in this same way.[a] As with the earlier shepherds, each one completed his allotted term. Then others took the flock into their hands and tended it in turn, each shepherd during his own appointed time.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “I kept watching until that time, as thirty-seven shepherds tended the flock in this same way.”
    reason: lexical_alternative
  - marker: b
    text: The Ge‘ez handover clause is compressed, but it describes successive shepherds receiving charge of the flock.
    reason: source_note
