translation:
  language: en
  text: They cried out to them, but they would not listen to what they said. Instead, they were completely deaf, and their eyes were completely blinded.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The deafness and blindness may also picture their moral and spiritual condition, but the vision uses concrete bodily images.
    reason: cultural_note
