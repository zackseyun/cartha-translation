translation:
  language: en
  text: I kept watching until the Lord of the sheep came to them. He took the staff of wrath in his hand and struck the ground. The ground split open,[a] and all the beasts and birds of the sky[b] fell away from the sheep. They sank into the ground, and it closed over them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the ground was torn open.” The Ge’ez wording is difficult, but what follows shows the ground opening beneath them.
    reason: lexical_alternative
  - marker: b
    text: In this symbolic vision, the beasts and birds represent hostile powers, not merely ordinary animals.
    reason: cultural_note
simplification_decisions:
- pob_phrase: And I saw until
  simplified_phrase: I kept watching until
  preserved_meaning: The seer continues watching until the Lord arrives.
  reasoning_layer_used: POB narrative context
  rationale: The continuous action is stated in natural modern English.
- pob_phrase: all the beasts and all the birds of heaven fell away from among those sheep
  simplified_phrase: all the beasts and birds of the sky fell away from the sheep
  preserved_meaning: The hostile creatures are separated from the sheep while retaining the image of falling away.
  reasoning_layer_used: POB lexical decision and cultural note
  rationale: The wording removes repetition and replaces “heaven” with the clearer spatial sense “sky.”
- pob_phrase: sank into the earth, and it covered over them
  simplified_phrase: sank into the ground, and it closed over them
  preserved_meaning: The creatures descend into the opened earth and are engulfed by it.
  reasoning_layer_used: POB lexical decisions
  rationale: “Closed over” makes the sequence vivid without weakening the judgment image.
translation_notes:
  risk_flags:
  - risk: “Split open” resolves a difficult Ge’ez clause toward an opening in the ground.
    mitigation: Footnote a preserves the uncertainty and gives the main alternative.
  - risk: Modern readers may mistake the beasts and birds for ordinary animals only.
    mitigation: Footnote b identifies their symbolic role without inserting it into the vision itself.
