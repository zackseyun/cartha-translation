  - marker: b
    text: 'Another possible reading is: “They carried out all its pillars and plants, and the beams of the house were folded up with it.”'
    reason: lexical_alternative
  - marker: c
    text: Literally, “at the right hand of the land.” In biblical-style directional language, this commonly means “to the south.”
    reason: lexical_alternative
