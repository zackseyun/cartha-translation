translation:
  language: en
  text: Those ravens attacked him and kept fighting against him.[a] They wanted to remove his horn,[b] but they could not overcome him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Ge'ez literally says “with him,” but the conflict here is hostile.
    reason: lexical_alternative
  - marker: b
    text: The horn is part of the vision’s symbolic imagery, so it is not replaced with “power” or “strength.”
    reason: cultural_note
