  text: I kept watching until they laid aside the sword that had been given to the sheep. They brought it into the house and sealed it there in the Lord’s presence. Then all the sheep were summoned into that house,[a] but it could not hold them all.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In this vision, the house may represent the temple or the future dwelling of God’s people, but the text simply calls it a house.
    reason: cultural_note
