  simplified_phrase: I kept watching until
  preserved_meaning: The vision continued until the Lord acted.
  reasoning_layer_used: POB narrative context
  rationale: The natural English clause clearly preserves the timing of the vision.
- pob_phrase: greater and loftier than the first
  simplified_phrase: larger and higher than the first
  preserved_meaning: The new house surpassed the first in both size and height.
  reasoning_layer_used: POB lexical decision for ዓቢይ ... ልዑል
  rationale: Common physical terms preserve both parts of the comparison.
- pob_phrase: all its pillars were new, and its ornaments were new and greater
  simplified_phrase: Every pillar in the new house was new. Its decorations were also new and greater
  preserved_meaning: Both the pillars and decorations were new, and the decorations surpassed those of the old house.
  reasoning_layer_used: POB lexical decisions for አዕማዲ and ስና
  rationale: Short sentences and familiar wording clarify the description without defining how the decorations were greater.
