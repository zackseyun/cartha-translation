translation:
  language: en
  text: I kept watching until the Lord of the sheep brought a new house, larger and higher than the first. He set it up in the place of the first house, which had been folded up.[a] Every pillar in the new house was new. Its decorations were also new and greater than those of the old house he had taken away. All the sheep were inside the new house.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The difficult Ge'ez verb may also mean “rolled up” or “wrapped up.”
    reason: lexical_alternative
  - marker: b
    text: In this vision, the house likely represents a restored or future sanctuary, but the text retains the symbolic image of a house.
    reason: cultural_note
