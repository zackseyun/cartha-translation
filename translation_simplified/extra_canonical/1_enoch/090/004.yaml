translation:
  language: en
  text: I watched as dogs, eagles, and kites[a] devoured those sheep. They left no flesh, skin, or sinew on them. Only their bones were left standing; then even their bones fell to the ground. And the sheep became few.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The word translated “kites” may refer more broadly to hawks or another kind of bird of prey.
    reason: lexical_alternative
