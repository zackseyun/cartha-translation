translation:
  language: en
  text: He answered me, “This is the Son of Man. Righteousness belongs to him, and righteousness lives with him. He will reveal all the storehouses where hidden things are kept,[a] because the Lord of Spirits has chosen him. The portion appointed to him has triumphed before the Lord of Spirits in eternal uprightness.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the treasuries of hidden things”; the image presents hidden realities as being kept in reserve.
    reason: lexical_alternative
  - marker: b
    text: This difficult clause may also mean “his lot has prevailed” or “his portion has triumphed”; less likely, it may refer to the lot of those associated with him.
    reason: alternative_reading
