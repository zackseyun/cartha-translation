translation:
  language: en
  text: I asked one of the angels traveling with me, who was showing me everything that had been hidden, about that Son of Man. I asked who he was, where he came from, and why he was traveling with the Head of Days.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Head of Days” follows the Ethiopic wording; the related title in Daniel is traditionally translated “Ancient of Days.”
    reason: cross_reference
