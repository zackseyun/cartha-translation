translation:
  language: en
  text: He will cast down the faces of the strong ones and fill them with shame. Darkness will be their home, and worms[a] will be their bed. They will have no hope of rising from those beds[b], because they do not exalt the name of the Lord of Spirits.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Ge'ez word translated “worms” is uncertain in this copy, but it fits the image of corruption under judgment.
    reason: textual_variant
  - marker: b
    text: “Rising from those beds” may mean simply getting up, but it may also suggest that there will be no restoration after judgment.
    reason: lexical_alternative
