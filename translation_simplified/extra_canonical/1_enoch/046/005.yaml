  simplified_phrase: cast the kings down, removing them from their thrones and kingdoms
  preserved_meaning: The kings are forcefully removed from their positions and realms of rule.
  reasoning_layer_used: POB lexical decisions for cast down, kings, thrones, and kingdoms
  rationale: The recast keeps the forceful fall and royal imagery while making the action easier to follow.
- pob_phrase: because they do not exalt him, and do not praise him
  simplified_phrase: because they do not exalt him or praise him
  preserved_meaning: The kings habitually refuse both to exalt and to praise him.
  reasoning_layer_used: POB lexical decisions and prophetic present-tense rationale
  rationale: The shorter coordination preserves both distinct acts without repetitive wording.
- pob_phrase: do not acknowledge from where the kingdom was given to them
  simplified_phrase: do not acknowledge the source of the royal authority they were given
  preserved_meaning: The kings refuse to recognize that their authority was granted from beyond themselves.
  reasoning_layer_used: POB lexical footnotes and theological decision on the source of royal authority
  rationale: This wording makes the clause natural while leaving the giver unnamed and preserving the source ambiguity in a note.
