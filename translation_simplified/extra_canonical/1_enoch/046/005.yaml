translation:
  language: en
  text: He will cast the kings down, removing them from their thrones and kingdoms. He will do this because they do not exalt him or praise him, and they do not acknowledge the source[a] of the royal authority they were given.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The source may mean either where their authority came from or, more personally, who gave it to them.
    reason: lexical_alternative
