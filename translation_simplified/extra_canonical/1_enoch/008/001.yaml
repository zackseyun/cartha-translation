translation:
  language: en
  text: Azazel taught men how to make swords, knives, shields, and breastplates. He also showed them “what was behind them” and their works[a]—as well as bracelets and ornaments, eye makeup and ways to beautify the eyelids,[b] every kind of costly stone, and dyes of every color.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The ancient wording translated “what was behind them” is difficult and may instead refer to things that followed from these arts.
    reason: textual_variant
  - marker: b
    text: These expressions refer to applying eye makeup and other cosmetics around the eyes.
    reason: cultural_note
