  preserved_meaning: Sin itself will cease, not merely be forgiven for individuals.
  reasoning_layer_used: lexical decision and immediate apocalyptic context
  rationale: “Comes to an end” expresses the expected end of sin in common English.
- pob_phrase: their names will be blotted out
  simplified_phrase: their names will be erased
  preserved_meaning: Their names are removed from heavenly written records in judgment.
  reasoning_layer_used: lexical and theological decisions on heavenly records
  rationale: “Erased” keeps the written-record image while making it immediately clear.
- pob_phrase: their offspring
  simplified_phrase: their descendants
  preserved_meaning: Their family line will be permanently destroyed.
  reasoning_layer_used: lexical decision on lineage
  rationale: “Descendants” clearly refers to their continuing family line.
