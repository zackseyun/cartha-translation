  text: But you, wait until sin comes to an end. Their names will be erased from the book of life and from the books of the holy ones, and their descendants will be destroyed forever. Their spirits will be slain. They will cry out and lament in a desolate place that is unseen, and in burning fire, for there is no earth there.[a]
