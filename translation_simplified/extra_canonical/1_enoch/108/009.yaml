translation:
  language: en
  text: From the beginning of their lives, they did not desire the food on earth. They regarded their souls as a passing breath[a] and remained committed to this. The Lord tested them intensely, and their spirits were found pure, so that they might bless his name.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a passing spirit” or “a passing wind”; the word can mean spirit, wind, or breath.
    reason: lexical_alternative
