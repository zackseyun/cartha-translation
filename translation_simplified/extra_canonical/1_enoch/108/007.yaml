translation:
  language: en
  text: For there are writings and records about them in heaven above.[a] They are there so that the angels may read them and learn what awaits sinners, the humble in spirit,[b] those who made their bodies suffer and received their reward from God, and those whom evil people put to shame.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The expression translated “writings and records” is difficult, but the next clause indicates that these are heavenly documents the angels can read.
    reason: lexical_alternative
  - marker: b
    text: Or “the humble souls.” The Ge'ez literally speaks of humble spirits or souls.
    reason: lexical_alternative
  - marker: c
    text: The final words may also mean “those whom evil people reproached or despised.”
    reason: lexical_alternative
