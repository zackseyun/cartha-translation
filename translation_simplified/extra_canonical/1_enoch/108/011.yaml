translation:
  language: en
  text: Now I will summon the spirits of the good people from the generation of light. I will transform them[b]—those who were born in darkness and who, during their earthly lives, were not given the honor their faith deserved.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “their faithfulness deserved.” The word may refer to steadfast faithfulness as well as belief.
    reason: lexical_alternative
  - marker: b
    text: The verb translated “transform” is difficult and may more specifically mean “make shine” or “illumine.”
    reason: textual_variant
