translation:
  language: en
  text: Then I asked the two holy angels who were with me. I said to him,[a] “What is this glorious thing?[b] It is not heaven. Instead, there is only a burning flame of fire and the sound of weeping, crying out, wailing, and terrible pain.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Ge’ez says “him” after mentioning two angels; Enoch may be speaking to one of them, or the wording may be irregular.
    reason: textual_variant
  - marker: b
    text: “Glorious thing” could also mean “glorious place” or “splendor.”
    reason: lexical_alternative
