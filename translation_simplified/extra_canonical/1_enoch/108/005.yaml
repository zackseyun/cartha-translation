  preserved_meaning: Enoch questions his two holy angelic guides but addresses a singular “him.”
  reasoning_layer_used: POB lexical decisions and textual-variant footnote
  rationale: Two sentences make the narrative easier to follow without correcting the singular pronoun.
- pob_phrase: For it is not heaven, but only
