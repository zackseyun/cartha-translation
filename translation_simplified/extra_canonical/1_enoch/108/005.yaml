  preserved_meaning: The vision is sharply contrasted with heaven.
  reasoning_layer_used: POB lexical decision for አኮኑ ሰማየ and ባሕቲቱ
  rationale: The contrast becomes direct and natural while retaining the exclusion expressed by “only.”
- pob_phrase: weeping and crying out and lamentation and grievous pain
  simplified_phrase: weeping, crying out, wailing, and terrible pain
  preserved_meaning: The cumulative sounds and severe suffering remain distinct.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: Common words replace formal terms without summarizing the sensory imagery as generic torment.
