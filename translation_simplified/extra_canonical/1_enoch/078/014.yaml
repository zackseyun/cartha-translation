translation:
  language: en
  text: The moon receives light from somewhere. From there, it wanes again until all its light is gone. The days of the month pass, and its round disk remains empty and without light.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: From where the light comes to the moon, from there again it wanes
  simplified_phrase: The moon receives light from somewhere. From there, it wanes again
  preserved_meaning: The moon wanes from the same unspecified place from which its light comes.
  reasoning_layer_used: Applied revision and lexical decisions
  rationale: Two sentences clarify the repeated spatial relationship without defining the place.
- pob_phrase: until all the light is finished
  simplified_phrase: until all its light is gone
  preserved_meaning: The waning continues until no visible light remains.
  reasoning_layer_used: Lexical decision
  rationale: “Gone” expresses the completed loss of light in ordinary English.
- pob_phrase: its disk remains empty, without light
  simplified_phrase: its round disk remains empty and without light
  preserved_meaning: The moon’s visible circular form remains dark and lacking light.
  reasoning_layer_used: Lexical decision and footnote b
  rationale: “Round” makes the source image of the moon’s disk immediately clear.
