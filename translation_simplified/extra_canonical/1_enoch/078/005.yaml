translation:
  language: en
  text: They set and enter the portals in the west.[a] Then they travel around by the northern side[b] and come out through the eastern portals onto the face of the sky.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The portals are fixed openings in the book’s picture of the sky, through which the heavenly lights move.
    reason: cultural_note
  - marker: b
    text: The Ge’ez is brief here and may mean movement around or along the northern side.
    reason: lexical_alternative
