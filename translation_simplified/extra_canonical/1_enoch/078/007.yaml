  text: Fifteen parts of light are added to the moon, part by part, until the fifteenth day. Its light is then complete and serves as a sign marking the year. It has fifteen parts of light, and the moon grows by half of a seventh part.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The final phrase is difficult in the Ethiopic, and its exact meaning is uncertain. It may instead mean that the lunar month reaches its midpoint in the seventh portion.
    reason: alternative_reading
