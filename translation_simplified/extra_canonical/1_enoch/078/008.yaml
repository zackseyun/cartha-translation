translation:
  language: en
  text: As the moon wanes, its light diminishes to fourteen parts on the first day. On the second day, it diminishes to thirteen parts; on the third, to twelve; on the fourth, to eleven; on the fifth, to ten; on the sixth, to nine; on the seventh, to eight; on the eighth, to seven; on the ninth, to six; on the tenth, to five; on the eleventh, to four; on the twelfth, to three; and on the thirteenth, to two. On the fourteenth day, it diminishes to half of a seventh part of all its light.[a] On the fifteenth day, what remains of its full light is consumed.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Half of a seventh part” preserves a precise but mathematically awkward Ge'ez expression.
    reason: lexical_alternative
