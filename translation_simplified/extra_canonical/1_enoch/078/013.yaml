  text: 'This cycle is completed precisely: During the day, the sun goes down in the west. At night, the moon rises from the east[c] and gives light through the whole night, until the sun rises[a] before it[b]. The moon is seen before the sun[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The source form is uncertain, but the context indicates that the sun appears or rises.
    reason: lexical_alternative
  - marker: b
    text: “Before” may refer to time or position; the source does not clearly distinguish them.
    reason: lexical_alternative
  - marker: c
    text: The wording “rises from the east at night” is difficult in context. This translation follows the source wording rather than changing it to fit expected astronomical language.
    reason: textual_variant
