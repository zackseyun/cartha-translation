translation:
  language: en
  text: For he is mighty in all the hidden things connected with righteousness.[a] Lawlessness will pass away like a shadow and will not last, because the Chosen One stands before the Lord of Spirits. His glory lasts forever and ever, and his power continues from generation to generation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may also mean “everything hidden that belongs to righteousness.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: all the hidden things of righteousness
  simplified_phrase: all the hidden things connected with righteousness
  preserved_meaning: The phrase refers to concealed things associated with righteousness without calling them technical mysteries.
  reasoning_layer_used: POB lexical decision for ኅቡአተ and footnote a
  rationale: “Connected with” makes the relationship clear while preserving the documented ambiguity.
- pob_phrase: lawlessness will pass away like a shadow and have no permanence; for
  simplified_phrase: Lawlessness will pass away like a shadow and will not last, because
  preserved_meaning: Lawlessness cannot endure, and the Chosen One’s presence supplies the stated reason.
  reasoning_layer_used: POB lexical decision for ምቅዋመ አልቦ and the source clause connection
  rationale: “Will not last” is plain English, while “because” retains the causal link.
- pob_phrase: his glory is forever and ever, and his power from generation to generation
  simplified_phrase: His glory lasts forever and ever, and his power continues from generation to generation.
  preserved_meaning: The Chosen One’s glory and power endure without end.
  reasoning_layer_used: POB lexical decisions for the eternal formulas
  rationale: Adding ordinary duration verbs makes both parallel statements complete and clear.
interpretive_expansions:
- pob_phrase: his glory is forever and ever, and his power from generation to generation
  rendering: His glory lasts forever and ever, and his power continues from generation to generation.
  claim: Both glory and power endure through all time.
  evidence:
  - The POB time formulas explicitly express enduring duration.
  - The parallel clauses connect both qualities with continuing time expressions.
  confidence: high
translation_notes:
  risk_flags:
  - risk: “Will not last” does not retain the literal image of having no standing.
    mitigation: The shadow image remains, and the wording preserves the audited sense of no permanence.
