  reasoning_layer_used: Lexical decision for ይኴንን and ዘኅቡአተ
  rationale: The wording is more natural while retaining both judicial action and concealment.
- pob_phrase: speak an empty word before him
  simplified_phrase: speak empty words in his presence
  preserved_meaning: Empty, vain, or possibly false speech cannot stand before him.
  reasoning_layer_used: Textual-variant footnote and lexical rationale for the difficult Ge’ez phrase
  rationale: The plural reads naturally, while the footnote preserves the possible sense of falsehood.
- pob_phrase: according as he has willed
