  preserved_meaning: The Chosen One’s status rests on the will of the Lord of Spirits.
  reasoning_layer_used: Lexical rationale for በከመ፡ ውእቱ፡ ፈቀደ
  rationale: Naming the antecedent removes confusing pronouns without changing the stated basis of his status.
