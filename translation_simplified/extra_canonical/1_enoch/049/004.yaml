translation:
  language: en
  text: He will judge what is hidden. No one will be able to speak empty words in his presence,[a] because he is the Chosen One before the Lord of Spirits, as the Lord has willed.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Ge’ez wording is difficult here and may mean, “No one will be able to speak falsely in his presence.”
    reason: textual_variant
