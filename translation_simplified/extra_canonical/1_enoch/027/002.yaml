translation:
  language: en
  text: At that time Uriel, one of the holy angels with me, replied, “This valley is under a curse and is reserved for those who are cursed forever. Everyone who speaks improper words against the Lord and says shocking things about his glory will be gathered here. This is where they will be brought together and judged.”
