  rationale: “Facedown” makes the bodily posture immediately clear while preserving the concrete image.
- pob_phrase: and all my flesh melted away, and my spirit was transformed
  simplified_phrase: All my flesh melted away, and my spirit was transformed.
  preserved_meaning: The vision overwhelms Enoch bodily and brings a profound but uncertain inner change.
  reasoning_layer_used: lexical and theological decisions on flesh and spirit
  rationale: A separate sentence clarifies the sequence while retaining both apocalyptic images.
- pob_phrase: and I cried out with a loud voice
  simplified_phrase: Then I cried out loudly
  preserved_meaning: Enoch responded with a forceful audible cry.
  reasoning_layer_used: applied revision on በቃል ዓቢይ
  rationale: The adverb gives the same sense in more natural modern English.
