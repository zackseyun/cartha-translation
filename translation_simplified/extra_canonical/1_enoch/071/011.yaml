translation:
  language: en
  text: I fell facedown. All my flesh melted away, and my spirit was transformed.[a] Then I cried out loudly ...[b] in the spirit of power,[c] and I blessed, praised, and exalted him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “my spirit changed”; the exact meaning of the Ge‘ez verb is uncertain.
    reason: lexical_alternative
  - marker: b
    text: The text appears to have a gap after “I cried out loudly.”
    reason: textual_variant
  - marker: c
    text: Or “by a spirit of power” or “through the spirit of power”; this may describe Enoch’s inner state or the power enabling him to speak.
    reason: lexical_alternative
