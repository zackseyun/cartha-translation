translation:
  language: en
  text: 'I saw more angels than anyone could count gathered all around that house: thousands of thousands and ten thousand times ten thousand. Mikael, Rufael, Gabrʾel, and Fanʾuel[a], along with the holy angels who are above the heavens, were going into and coming out of that house.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: These names are more commonly spelled Michael, Raphael, Gabriel, and Phanuel in English.
    reason: lexical_alternative
