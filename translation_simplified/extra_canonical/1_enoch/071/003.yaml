translation:
  language: en
  text: Then the angel Mika'el, one of the chief angels, took me by the right hand. He lifted me up and brought me out to all that was hidden. He showed me all that was hidden about mercy and all that was hidden about righteousness.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Righteousness” could also be translated “justice” here.
    reason: lexical_alternative
