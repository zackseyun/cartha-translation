translation:
  language: en
  text: My spirit was taken up into the heaven of heavens.[a] There, within that light, I saw something built from hailstones.[b] Among those stones were tongues of living fire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Heaven of heavens” means the highest heavenly realm. The text says Enoch’s spirit was taken up but does not settle whether the experience was bodily.
    reason: simplification_note
  - marker: b
    text: The Ethiopic wording is difficult and leaves the kind of structure uncertain; “icy stones” is also possible.
    reason: textual_variant
