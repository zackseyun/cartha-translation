- pob_phrase: And my spirit was covered in the heaven of heavens, and I saw there
  simplified_phrase: My spirit was taken up into the heaven of heavens. There ... I saw
  preserved_meaning: Enoch’s spirit enters the supreme heavenly realm, without resolving whether the experience was bodily.
  reasoning_layer_used: source lexical decision and theological decision
  rationale: “Taken up into” clearly communicates the source-supported visionary ascent, while the shorter sentences make the sequence easy to follow.
- pob_phrase: in the midst of that light
  simplified_phrase: within that light
  preserved_meaning: The object appears inside the heavenly radiance.
  reasoning_layer_used: lexical decision
  rationale: “Within” gives the location in natural English without changing the image.
- pob_phrase: something built of stones of hail
  simplified_phrase: something built from hailstones
  preserved_meaning: An uncertain constructed object is made from strange hail-like stones.
  reasoning_layer_used: lexical decision and textual-variant note
  rationale: “Hailstones” is common English, while “something” preserves uncertainty about the structure.
