  preserved_meaning: The seer’s spirit perceives a boundary surrounding the house of fire.
  reasoning_layer_used: Theological and lexical decisions for “my spirit” and the enclosing image.
  rationale: The shorter clause keeps the visionary perception and surrounding boundary clear.
- pob_phrase: and from its four sides were rivers full of living fire
