translation:
  language: en
  text: I saw six portals where the sun rises and six where it sets. The moon also rises and sets through these portals. The leaders of the stars, together with those they lead, were six in the east and six in the west. All were arranged one after another in exact order, with many windows on both sides of the portals.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The final clause is difficult in the surviving text, but it appears to describe many smaller openings on both sides of the portals.
    reason: textual_variant
