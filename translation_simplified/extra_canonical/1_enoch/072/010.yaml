translation:
  language: en
  text: On that day, daylight is longer than the night by a ninth part.[a] Daylight measures exactly ten parts, and the night exactly eight parts.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A difficult bracketed word appears after “is longer” in the Ethiopic text, but it does not change the clear numerical comparison.
    reason: textual_variant
  - marker: b
    text: “Parts” are the standard divisions this chapter uses to compare the changing lengths of daylight and night.
    reason: cultural_note
