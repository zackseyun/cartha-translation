  simplified_phrase: daylight is longer than the night
  preserved_meaning: The daylight period exceeds the nighttime period in length.
  reasoning_layer_used: lexical decisions and astronomical context
  rationale: “Daylight” prevents readers from mistaking “day” for the full daily cycle.
- pob_phrase: the day becomes exactly ten parts, and the night becomes exactly eight parts
  simplified_phrase: Daylight measures exactly ten parts, and the night exactly eight parts
  preserved_meaning: Both durations are given as precise measurements in the chapter’s system.
  reasoning_layer_used: applied revision and theological decision
  rationale: “Measures” clarifies the technical reckoning while preserving exactness for both periods.
