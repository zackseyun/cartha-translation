translation:
  language: en
  text: The sun comes out of that third gate and sets in the third gate in the west. Then it returns to the east. For thirty mornings,[a] it comes out of the second gate in the east, and in the same way it sets in the second gate in the west of heaven.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “thirty mornings.” This likely means a thirty-day period in the sun’s course.
    reason: lexical_alternative
