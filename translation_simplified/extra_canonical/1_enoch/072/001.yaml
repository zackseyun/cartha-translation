translation:
  language: en
  text: This book records the courses of the lights of heaven. It describes how they are arranged in companies,[a] along with their dominion, seasons, names, origins, and paths. Uriel—the holy angel who was with me and who guides them—showed me all this, including their whole record. He also showed me how these things are ordered in every yearly cycle of the world, for all time, until a new work is accomplished—one that will endure forever.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Companies” pictures the heavenly lights as organized groups or assemblies.
    reason: lexical_alternative
  - marker: b
    text: “A new work” may mean a new creation or a new cosmic order.
    reason: lexical_alternative
