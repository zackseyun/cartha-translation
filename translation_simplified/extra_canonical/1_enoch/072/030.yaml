    text: These “parts” describe seasonal proportions of daylight and darkness, not clock-hours.
    reason: cultural_note
  - marker: b
    text: Another reading has “twelve parts.” The reading “ten parts” matches the book’s eighteen-part day-and-night scheme and the sequence in this passage.
    reason: textual_variant
