translation:
  language: en
  text: The sun comes out from that fifth gate and sets in the fifth gate in the west. Then, for thirty-one mornings, it rises in the fourth gate according to its signs[a] and sets in the west.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Its signs” may mean the observable or appointed markers of the sun’s course.
    reason: lexical_alternative
  - marker: b
    text: Some translations add “in that gate,” but the Ge‘ez says only “sets in the west.”
    reason: alternative_reading
