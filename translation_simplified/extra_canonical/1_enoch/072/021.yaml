translation:
  language: en
  text: The sun comes out through that gate and sets in the west. It then returns to the east. For thirty mornings, it comes out through the third gate and sets in the west at the third gate.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “window”; the book pictures the heavens as having fixed openings for the sun.
    reason: lexical_alternative
  - marker: b
    text: “Thirty mornings” is the text’s concrete way of counting this period.
    reason: simplification_note
simplification_decisions:
- pob_phrase: And the sun comes out from that gate, and sets in the west, and returns to the east
  simplified_phrase: The sun comes out through that gate and sets in the west. It then returns to the east.
  preserved_meaning: The sun emerges through a fixed opening, sets in the west, and returns east in its recurring course.
  reasoning_layer_used: Applied revisions and lexical decisions for ኆኅት and ጽባሕ
  rationale: Two short sentences make the sequence clear while retaining the cosmic gate imagery and east-west movement.
- pob_phrase: and comes out from the third gate for thirty mornings
  simplified_phrase: For thirty mornings, it comes out through the third gate
  preserved_meaning: The sun emerges at the third gate throughout a period counted as thirty mornings.
  reasoning_layer_used: Lexical decision for ሠላሳ ጸባሐ
  rationale: Moving the time phrase forward clarifies its scope without changing the distinctive count by mornings.
