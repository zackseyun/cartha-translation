translation:
  language: en
  text: On that day, the night is longer than the day. Each night grows longer than the one before it, while each day grows shorter than the one before it. This continues until thirty mornings have passed.[a] The night then measures ten parts,[b] and the day measures eight parts.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “until thirty mornings”; this may count successive dawns in the seasonal cycle.
    reason: cultural_note
  - marker: b
    text: The word following “ten parts” is difficult in this textual witness and may mean “exact,” “complete,” or a similar qualifier.
    reason: textual_variant
