translation:
  language: en
  text: The sun comes out through that fourth gate and sets at the fourth gate. Then, for thirty mornings,[a] it returns to the fifth gate in the east. It comes out through that gate and sets at the fifth gate.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This section counts the period as “thirty mornings”; some translations say “thirty days.”
    reason: lexical_alternative
  - marker: b
    text: The Ge’ez repeats “the fifth gate” here; this may summarize the sun’s continued course after the thirty mornings.
    reason: textual_variant
