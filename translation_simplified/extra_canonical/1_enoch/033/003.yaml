  language: en
  text: I saw the portals from which the stars of heaven come out.[a] I recorded each outlet separately, along with the stars’ number and names, their order and activity, and their times and months. Uriel, the holy angel who was with me, showed me all these things.
  philosophy: optimal-equivalence
