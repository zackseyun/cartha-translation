translation:
  language: en
  text: There I saw a valley whose mouths[a] were open and deep. Everyone living on the dry land, the sea, and the islands will bring gifts, offerings, and presents to it. Yet that deep valley will not be filled.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Ge’ez wording is difficult; “mouths” pictures the valley as having deep, gaping openings.
    reason: textual_variant
simplification_decisions:
- pob_phrase: There my eyes saw
  simplified_phrase: There I saw
  preserved_meaning: The first-person wording still presents a direct visionary sight.
  reasoning_layer_used: lexical decision for ርእያ አዕይንትየ and grounding review
  rationale: “There I saw” is natural modern English and avoids the stilted phrase “my own eyes saw.”
- pob_phrase: all who dwell on the dry land and the sea and the islands
  simplified_phrase: Everyone living on the dry land, the sea, and the islands
  preserved_meaning: The phrase still includes inhabitants of every named region.
  reasoning_layer_used: lexical decisions for የኃድሩ and the geographic triad
  rationale: “Everyone living” replaces the less familiar “all who dwell” while retaining all three regions.
- pob_phrase: will bring gifts and offerings and presents to it, yet that deep valley will not be filled
  simplified_phrase: will bring gifts, offerings, and presents to it. Yet that deep valley will not be filled.
  preserved_meaning: Concrete offerings go to the valley, but it remains ominously unfilled.
  reasoning_layer_used: theological decision and lexical decisions for the three nouns and final clause
  rationale: Two sentences clarify the contrast while preserving the threefold list and the unfilled-valley image.
translation_notes:
  risk_flags:
  - risk: Readers may take the valley’s “mouths” as literal body parts.
    mitigation: The footnote explains that the image refers to deep, gaping openings.
  - risk: The difficult Ge’ez syntax leaves uncertainty about how “open and deep” relates to the mouths.
    mitigation: The text follows the adjudicated POB reading while the footnote acknowledges the difficulty.
