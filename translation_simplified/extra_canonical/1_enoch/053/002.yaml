  text: Their hands do lawless deeds, and the sinners devour everyone who supports those deeds. The sinners will be destroyed and removed from the presence of the Lord of Spirits. They will be uprooted from his earth, and they will not remain forever and ever.[a]
  philosophy: optimal-equivalence
  footnotes:
