translation:
  language: en
  text: Uriel, the holy angel who leads them, showed me all these things. I wrote down their positions just as he showed them to me. I also recorded their paths as they are.[a] I saw their lights until fifteen days had passed.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “their courses,” meaning their ordered movements.
    reason: lexical_alternative
  - marker: b
    text: The Ge'ez compresses the connection between seeing their lights and the completed fifteen-day period.
    reason: alternative_reading
