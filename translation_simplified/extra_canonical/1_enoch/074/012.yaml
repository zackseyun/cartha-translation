translation:
  language: en
  text: The sun and stars bring in every year with exact precision. Forever, they keep to their stations and never move ahead or fall behind by even one day. In righteousness[a], they complete the year exactly in 364 days.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “In righteousness” may also mean “rightly” or “properly,” but it connects the exact calendar with righteous cosmic order.
    reason: lexical_alternative
