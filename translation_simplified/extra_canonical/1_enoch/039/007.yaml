translation:
  language: en
  text: I saw the dwelling place under the wings of the Lord of Spirits. All the righteous and all the chosen shone before him like firelight. Their mouths were full of blessing, and their lips praised the name of the Lord of Spirits. Righteousness does not fail in his presence, and neither does uprightness.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Does not fail” can also mean “does not perish,” “does not pass away,” or “does not come to an end.”
    reason: lexical_alternative
