  reasoning_layer_used: Lexical decision for ከመ ብርሃነ እሳት
  rationale: “Firelight” expresses the same image in a shorter, natural form.
- pob_phrase: And righteousness does not fail before him, and uprightness does not fail before him
  simplified_phrase: Righteousness does not fail in his presence, and neither does uprightness
  preserved_meaning: Both moral qualities endure without failing before the Lord.
