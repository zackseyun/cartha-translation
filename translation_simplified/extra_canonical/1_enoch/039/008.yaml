translation:
  language: en
  text: I wanted to live there, and my spirit longed for that dwelling place. My portion had been assigned there beforehand,[a] for it had been established for me in the presence of the Lord of Spirits.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “my portion was there before.” The compact Ge’ez wording may be understood more formally without explicitly stating assignment.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: There I desired to dwell
  simplified_phrase: I wanted to live there
  preserved_meaning: Enoch desired settled residence in that visionary place.
  reasoning_layer_used: Lexical decisions for “desired,” “dwell,” and “there.”
  rationale: Common verbs express lasting residence more clearly than the elevated wording.
- pob_phrase: my spirit longed for that dwelling place
  simplified_phrase: my spirit longed for that dwelling place
  preserved_meaning: Enoch inwardly yearned for the place where he could dwell.
  reasoning_layer_used: Lexical rationale for inward longing and concrete habitation.
  rationale: Keeping “dwelling place” avoids the added domestic associations of “home.”
- pob_phrase: before the Lord of Spirits
  simplified_phrase: in the presence of the Lord of Spirits
  preserved_meaning: The portion stood established before the divine figure bearing this characteristic title.
  reasoning_layer_used: Divine-title decision and immediate clause context.
  rationale: “In the presence of” clarifies the relational sense while retaining the distinctive title.
interpretive_expansions:
- pob_phrase: there my portion was before
  rendering: My portion had been assigned there beforehand
  claim: The compact phrase refers to a previously determined portion for Enoch in that place.
