translation:
  language: en
  text: There my eyes saw their homes among the angels of righteousness and their places of rest among the holy ones.[a] They were asking, pleading, and praying for humanity. Righteousness flowed before them like water, and mercy was like dew on the earth. This is how it is among them forever and ever.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Holy ones” may mean heavenly holy beings, righteous members of the heavenly assembly, or both.
    reason: alternative_reading
  - marker: b
    text: The final sentence may also mean, “This is how it will be among them forever and ever.”
    reason: alternative_reading
