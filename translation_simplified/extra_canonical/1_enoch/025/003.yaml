translation:
  language: en
  text: He answered me, “The high mountain you saw has a summit like the Lord’s throne. The mountain is his throne. The Holy and Great One—the Lord of Glory, the Eternal King—will dwell there when he comes down to visit the earth in goodness.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The wording may compare either the mountain’s summit or the mountain as a whole to the Lord’s throne.
    reason: lexical_alternative
  - marker: b
    text: The last phrase may also be translated “to inspect the earth for good” or “to visit the earth with goodness.”
    reason: lexical_alternative
