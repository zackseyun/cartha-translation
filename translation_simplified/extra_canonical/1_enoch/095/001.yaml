translation:
  language: en
  text: 'Who will grant me this: that my eyes may become a cloud of water?[a] Then I may weep over you,[b] pour out my tears like a cloud of water, and find relief from the sorrow in my heart.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a rain cloud.” The repeated image compares the speaker’s flowing tears to a cloud full of water.
    reason: lexical_alternative
  - marker: b
    text: “You” is plural and probably refers to the sinners addressed in the surrounding warnings.
    reason: cross_reference
