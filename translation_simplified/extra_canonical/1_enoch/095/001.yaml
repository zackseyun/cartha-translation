  preserved_meaning: All three results remain joined to the speaker’s purpose-oriented wish.
  reasoning_layer_used: POB lexical rationale and applied grammatical revision
  rationale: “Then I may” keeps the purpose and result relationship while beginning a shorter sentence.
- pob_phrase: find rest from the sorrow of my heart
