translation:
  language: en
  text: I heard the angel say, “These are the angels who came down to the earth. They revealed to humanity what had been hidden[a] and led people astray, causing them to sin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the hidden things.” This verse does not say exactly what was revealed.
    reason: lexical_alternative
