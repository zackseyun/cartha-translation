translation:
  language: en
  text: I saw the storehouses of the sun and the moon.[a] I saw where they come out, where they go in, and their glorious return. One is more honored than the other.[b] The course they follow is blessed. They never go beyond it, add to it, or take away from it. They remain faithful to one another under oath.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: These storehouses are pictured as heavenly chambers from which the sun and moon emerge and to which they return; they may also be called “treasuries.”
    reason: lexical_alternative
  - marker: b
    text: This difficult line probably compares the honor or splendor of the sun and the moon.
    reason: alternative_reading
