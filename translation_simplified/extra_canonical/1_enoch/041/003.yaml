  reasoning_layer_used: POB lexical decisions for ነፋሳት and ይትከፈሉ, with the applied source correction for አፎ
  rationale: “Distributed” prevents the mistaken idea that each wind is split into pieces without adding the rejected image of mouths or outlets.
