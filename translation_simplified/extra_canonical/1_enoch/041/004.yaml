  text: There I saw the storehouses where lightning is kept. From these storehouses are distributed the wind from the hail storehouse and the wind from the mist storehouse.[a] The cloud and its cloud remain over the earth from before the world.[b]
  philosophy: optimal-equivalence
  footnotes:
