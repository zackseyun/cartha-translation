translation:
  language: en
  text: There I saw the dwelling places of sinners and of the holy ones.[a] I also saw all the sinners being driven away from there. They were the ones who deny the name of the Lord of Spirits. They were dragged off and could not stand under the punishment that goes out from the Lord of Spirits.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “The holy ones” may mean holy people, heavenly beings, or both.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: the dwelling places of the sinners and the dwelling places of the holy ones
  simplified_phrase: the dwelling places of sinners and of the holy ones
  preserved_meaning: The vision shows dwelling places associated with both contrasting groups.
  reasoning_layer_used: Lexical decisions for መኃድሪሆሙ, ኃጥኣን, and ቅዱሳን
  rationale: The repeated wording is compressed while the concrete image and contrast remain.
- pob_phrase: all the sinners being driven away from there—those who deny the name of the Lord of Spirits
  simplified_phrase: all the sinners being driven away from there. They were the ones who deny the name of the Lord of Spirits.
  preserved_meaning: Those expelled are identified as people who repudiate the divine name.
  reasoning_layer_used: Theological decision on denying the divine name
  rationale: Two sentences clarify the identification without reducing denial of the name to general unbelief.
- pob_phrase: they could not stand because of the punishment
  simplified_phrase: could not stand under the punishment
  preserved_meaning: The sinners cannot stand or endure when divine punishment comes upon them.
  reasoning_layer_used: Applied revision for ቀዊመ አልቦሙ
  rationale: “Under” makes the apocalyptic pressure clear without introducing the misleading legal idiom “no standing.”
translation_notes:
  risk_flags:
