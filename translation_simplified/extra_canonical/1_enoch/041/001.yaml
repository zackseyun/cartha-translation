translation:
  language: en
  text: After this, I saw all that is hidden in the heavens.[a] I saw how the kingdom is divided,[b] and how people’s deeds are weighed on the scales.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “all the secrets of the heavens.”
    reason: lexical_alternative
  - marker: b
    text: This difficult phrase may refer to how the heavenly realm is ordered or apportioned.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: all the hidden things of the heavens
  simplified_phrase: all that is hidden in the heavens
  preserved_meaning: Enoch sees everything in the heavens that is normally concealed.
  reasoning_layer_used: POB lexical decision for ኵሎ ኅቡኣቲሁ ለሰማያት
  rationale: The recast clause is more natural while retaining the idea of heavenly things hidden from sight or knowledge.
- pob_phrase: and how the kingdom is divided
  simplified_phrase: I saw how the kingdom is divided
  preserved_meaning: Enoch sees the kingdom divided or apportioned without the precise cosmic arrangement being resolved.
  reasoning_layer_used: POB theological decision on the difficult kingdom clause
  rationale: Repeating “I saw” clarifies the sentence while preserving the documented ambiguity.
- pob_phrase: the deeds of human beings are weighed in the balance
  simplified_phrase: people’s deeds are weighed on the scales
  preserved_meaning: Human actions undergo assessment through a concrete weighing image.
  reasoning_layer_used: POB lexical decisions for ትገበረ ሰብእ, በመዳልው, and ይደለው
  rationale: Common wording makes the judgment image immediately understandable without flattening it to generic evaluation.
