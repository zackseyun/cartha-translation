  rationale: Natural English word order keeps the solemn focus on their location.
- pob_phrase: lead them astray so that they sacrifice
  simplified_phrase: lead people astray, causing them to offer sacrifices
  preserved_meaning: The spirits cause people to practice demon-directed sacrifice.
  reasoning_layer_used: Lexical decisions for ያስሕትዎሙ and ይሡዑ
  rationale: The clearer causal wording preserves both deception and sacrifice.
- pob_phrase: sacrifice to demons as to gods
  simplified_phrase: offer sacrifices to demons as though the demons were gods
  preserved_meaning: People give demons the sacrificial honor given to gods.
  reasoning_layer_used: Lexical decision for ከመ አማልክት
  rationale: Repeating “demons” makes the comparison immediately understandable.
