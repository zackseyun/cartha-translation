translation:
  language: en
  text: Uriel said to me, “This is where the angels who joined themselves with women will stand. Their spirits,[a] having taken on many forms,[b] defile humanity and lead people astray, causing them to offer sacrifices to demons as though the demons were gods, until the day of the great judgment. On that day, those angels will be judged until they are finished.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Their spirits” may mean the spirits of the fallen beings themselves or demonic spirits associated with their offspring.
    reason: alternative_reading
  - marker: b
    text: The difficult Ge'ez phrase may also mean “having become many appearances.”
    reason: lexical_alternative
  - marker: c
    text: Or “until their end is completed.” The final words emphasize the full completion of judgment without defining its precise nature.
    reason: lexical_alternative
