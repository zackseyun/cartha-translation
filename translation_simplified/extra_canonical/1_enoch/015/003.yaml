translation:
  language: en
  text: Why did you abandon the high and holy heaven that lasts forever? Why did you have sexual relations with women and defile yourselves with human daughters? You took wives for yourselves and did what the children of the earth do,[a] and you fathered giant sons.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Children of the earth” means mortal human beings, in contrast to the heavenly Watchers.
    reason: cultural_note
  - marker: b
    text: Or, “sons who were giants.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the high and holy eternal heaven
  simplified_phrase: the high and holy heaven that lasts forever
  preserved_meaning: Heaven remains high, holy, and eternal.
  reasoning_layer_used: POB lexical decision on the stacked adjectives
  rationale: The relative clause makes “eternal” immediately understandable without weakening the elevated description.
- pob_phrase: lie with women
  simplified_phrase: have sexual relations with women
  preserved_meaning: The Watchers had sexual unions with women.
  reasoning_layer_used: POB lexical decision for ሰከብክሙ
  rationale: The direct wording prevents a modern reader from mistaking “lie with” for merely resting beside someone.
- pob_phrase: beget giant sons
  simplified_phrase: fathered giant sons
  preserved_meaning: The union produced male offspring who were giants.
  reasoning_layer_used: POB lexical decision for ውሉደ ረዓይተ
  rationale: “Fathered” is common English while retaining the concrete image of giant offspring.
interpretive_expansions:
- pob_phrase: the daughters of men
  rendering: human daughters
  claim: The women were human beings, in contrast to the heavenly Watchers.
  evidence:
  - The POB lexical rationale explicitly identifies the phrase as human women contrasted with heavenly beings.
  - The nearby phrase “children of the earth” maintains the same heavenly-human contrast.
  confidence: high
  alternatives_preserved:
  - daughters of men
  - daughters of humankind
translation_notes:
  risk_flags:
  - risk: “Human daughters” is less traditional than “daughters of men.”
    mitigation: It preserves the daughter image while making the heavenly-human contrast clear.
  - risk: “Giant sons” may be read as emphasizing size without the offspring relationship.
    mitigation: The verb “fathered” and the lexical-alternative footnote preserve both ideas.
