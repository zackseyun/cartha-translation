- pob_phrase: by the blood of flesh you fathered children
  simplified_phrase: Through mortal flesh and blood, you fathered children
  preserved_meaning: The Watchers entered bodily, blood-bound human reproduction.
  reasoning_layer_used: lexical decision and theological boundary contrast
  rationale: The recasting keeps the flesh-and-blood image while making the means of generation understandable.
- pob_phrase: you did as they do, producing flesh and blood—those who die and perish
  simplified_phrase: did what humans do, producing flesh and blood—human beings who die and perish
  preserved_meaning: The spiritual beings imitated mortal humans and produced mortal offspring.
  reasoning_layer_used: immediate context and POB lexical rationale
  rationale: Naming humans removes unclear pronouns without resolving the final verb beyond the POB.
