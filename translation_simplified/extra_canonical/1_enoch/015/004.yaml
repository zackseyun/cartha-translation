translation:
  language: en
  text: But you were holy spiritual beings, living forever. Yet you defiled yourselves with women. Through mortal flesh and blood, you fathered children. You desired human blood and did what humans do, producing flesh and blood—human beings who die and perish.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The last words may also be translated “die and are destroyed.”
    reason: lexical_alternative
