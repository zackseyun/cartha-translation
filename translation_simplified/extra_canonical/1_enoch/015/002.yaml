- pob_phrase: say to the watchers of heaven
  simplified_phrase: tell the watchers of heaven
  preserved_meaning: Enoch is commanded to address the angelic beings known by the title “watchers.”
  reasoning_layer_used: lexical and theological decisions
  rationale: “Tell” is more natural in this command, while “watchers of heaven” preserves the apocalyptic title.
- pob_phrase: to petition on their behalf
  simplified_phrase: to appeal for them
  preserved_meaning: The watchers sent Enoch to make a formal request for mercy for them.
  reasoning_layer_used: lexical decision and contextual rationale
  rationale: “Appeal for them” makes the formal request understandable without adding priestly overtones.
- pob_phrase: You ought to petition on behalf of men, and not men on your behalf
  simplified_phrase: You should be appealing for human beings. Human beings should not be appealing for you.
  preserved_meaning: The watchers have reversed the proper order by seeking a human appeal for themselves.
  reasoning_layer_used: lexical and theological decisions
  rationale: Two direct sentences clarify the rebuke and retain its repeated contrast.
