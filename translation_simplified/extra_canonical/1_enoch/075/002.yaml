  rationale: The added wording makes the subject of their error clear in ordinary English.
- pob_phrase: render service at the stations of the world
  simplified_phrase: carry out their service ... at the stations of the world
  preserved_meaning: The lights serve at their ordered cosmic positions rather than changing those positions.
  reasoning_layer_used: Tier-three lexical adjudication of ይትቀየዩ
  rationale: The natural verb phrase preserves the corrected sense of service.
- pob_phrase: the careful ordering of the world
