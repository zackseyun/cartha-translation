translation:
  language: en
  text: 'Because of these lights, people go astray in their understanding of them.[a] The lights carry out their service in righteousness at the stations of the world: one at the first portal, one at the third portal of heaven, one at the fourth portal, and one at the sixth portal. The precise ordering of the world is completed in 364 stations.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “People err because these lights rightly move from place to place.” The wording is difficult, but it contrasts human error with the lights’ ordered service.
    reason: lexical_alternative
  - marker: b
    text: This difficult clause may refer more specifically to the complete year of 364 ordered days or positions.
    reason: alternative_reading
