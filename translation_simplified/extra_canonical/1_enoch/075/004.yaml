  text: In the same way, Uriel showed me twelve openings along the circuit traveled by the sun’s chariots in the sky. The sun’s rays[a] go out through these openings, and warmth comes from them upon the earth when they are opened at their appointed seasons.
  philosophy: optimal-equivalence
  footnotes:
