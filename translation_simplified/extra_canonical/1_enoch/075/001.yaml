translation:
  language: en
  text: The leaders of those who head thousands are over all creation and all the stars. Together with the four that are added,[a] they do not leave their assigned service in the yearly order. These serve during the four days that are not counted in the regular calculation of the year.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The four may be added days, heavenly officials connected with them, or both; the word may also mean “joined.”
    reason: lexical_alternative
  - marker: b
    text: These are four extra days associated with the turning points of the year in this book’s 364-day calendar.
    reason: cultural_note
