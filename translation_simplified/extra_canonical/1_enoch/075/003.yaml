translation:
  language: en
  text: 'Concerning the signs, the seasons,[a] the years, and the days, Uriel—the angel whom the Lord of glory appointed forever over all the heavenly lights in heaven and in the world—showed me how they rule over the face of heaven, can be seen from earth, and guide day and night: the sun, the moon, the stars, and all the ministering powers[b] that travel their circuits in all the chariots of heaven.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “appointed times,” meaning fixed divisions of time.
    reason: lexical_alternative
  - marker: b
    text: “Ministering powers” is uncertain and may mean heavenly attendants or ordered functions associated with the heavenly bodies.
    reason: lexical_alternative
  - marker: c
    text: The “chariots of heaven” may picture the ordered paths of the heavenly bodies.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the luminaries of heaven
  simplified_phrase: the heavenly lights
  preserved_meaning: The phrase still refers to the heavenly bodies as ordered sources of light.
  reasoning_layer_used: POB lexical decision for ብርሃናት ሰማይ
  rationale: “Heavenly lights” is familiar English and retains the cosmic reference.
- pob_phrase: are seen upon the earth, and become guides for day and for night
  simplified_phrase: can be seen from earth, and guide day and night
  preserved_meaning: The lights remain visible from earth and retain their guiding function.
  reasoning_layer_used: POB lexical and theological decisions on visibility and guides
  rationale: Direct verbs make both functions easier to understand.
- pob_phrase: make their circuit in all the chariots of heaven
  simplified_phrase: travel their circuits in all the chariots of heaven
  preserved_meaning: The circular movement, the modifier “all,” and the chariot image remain.
  reasoning_layer_used: POB lexical and theological decisions on circuits and heavenly chariots
  rationale: The active wording is clearer without flattening the apocalyptic image.
translation_notes:
  risk_flags:
  - risk: “Ministering powers” may suggest personal beings although the source could indicate ordered functions.
    mitigation: Footnote b preserves both possibilities.
  - risk: “In heaven and in the world” retains an unusual cosmological scope.
    mitigation: The wording follows the POB without resolving the source’s breadth.
