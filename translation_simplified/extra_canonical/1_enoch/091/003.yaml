  text: 'He spoke to all of them, the children of righteousness, and said:


    “Children of Enoch, listen to everything your father says. Listen carefully to the words from my mouth.[a] I am speaking to you and telling you, beloved ones: Love righteousness and walk in it—live by it.”'
