  text: After this, another week will come—the eighth week, a week of righteousness.[a] This week will be given a sword so that righteous judgment can be carried out against the oppressors. Sinners will be handed over to the righteous, who will have power over them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: These “weeks” are symbolic periods of history, not ordinary calendar weeks.
    reason: cultural_note
