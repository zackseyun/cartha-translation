translation:
  language: en
  text: After this, in the seventh part of the tenth week, eternal judgment will take place.[a] [It will be carried out by the watchers of the eternal heaven.][b] It will be a great judgment carried out among the angels.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Ethiopic OCR is difficult and appears to preserve substantially different wording, including a phrase that may read “great ... in the midst of the angels.” The main text follows the commonly recognized Apocalypse of Weeks sense, but the transmitted line remains uncertain.
    reason: textual_variant
  - marker: b
    text: 'Or: “And after this, in the seventh week, an apostate generation will arise, and many of its deeds will be acts of apostasy. But at its end, the chosen righteous one from the eternal plant of righteousness will be chosen and given sevenfold instruction concerning all his creation.”'
    reason: alternative_reading
