translation:
  language: en
  text: From it, the roots of oppression will be cut off, and sinners will be handed over to the sword. Everywhere, there will be a cutting off among the blasphemers.[a] Those who plot violence and those who blaspheme will be destroyed by the sword.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Ethiopic wording here is difficult. It may mean that the roots of oppression are cut off from the blasphemers, or it may refer to those who plot violence and blaspheme.
    reason: textual_variant
