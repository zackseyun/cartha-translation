  text: The first heaven will depart and pass away. Then a new heaven will appear. All the powers of the heavens[a] will shine seven times as brightly forever.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may also mean “all the heavenly hosts.” The phrase may include heavenly beings, heavenly bodies, or both.
    reason: lexical_alternative
