translation:
  language: en
  text: After this, in the ninth week,[a] righteous judgment will be revealed to the whole world. Every wicked deed will be removed from the earth. The world will be written down for destruction,[b] and everyone will look toward the path of uprightness.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here a “week” is a symbolic era in sacred history, not a literal seven-day week.
    reason: cultural_note
  - marker: b
    text: This difficult phrase may mean that a decree or record is written concerning the world’s ruin; it may also be understood as “for the destruction of the age” or “for eternal destruction.”
    reason: textual_variant
