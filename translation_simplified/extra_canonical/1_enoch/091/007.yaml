- pob_phrase: increase in every deed
  simplified_phrase: increase in all that people do
  preserved_meaning: Corruption pervades human actions.
  reasoning_layer_used: lexical decision for በኵሉ ተግባር
  rationale: The wording explains “deed” in ordinary English without reducing its broad scope.
- pob_phrase: will come forth in wrath and in punishment
  simplified_phrase: will come forth in wrath, bringing punishment
  preserved_meaning: The Holy Lord acts in anger and administers punishment.
  reasoning_layer_used: lexical decisions for ይወፅእ, በመዓት, and በመቅሠፍት
  rationale: The recast phrase is natural English while retaining the dramatic movement and repeated punishment language.
- pob_phrase: to execute judgment upon the earth
  simplified_phrase: to execute judgment on the earth
  preserved_meaning: The Lord actively carries out judgment over the earth.
  reasoning_layer_used: lexical decisions for ከመ ይግበር ኵነኔ and ዲበ ምድር
  rationale: Changing “upon” to “on” improves readability without changing the judicial action or its scope.
