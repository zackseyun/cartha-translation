translation:
  language: en
  text: When sin, transgression, blasphemy, and violence increase in all that people do, and lawlessness, wrongdoing, and uncleanness also increase, great punishment[a] will come from heaven upon them all. The Holy Lord will come forth in wrath, bringing punishment, to execute judgment on the earth.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a great plague” or “a great scourge”; the word can refer to a punishing affliction.
    reason: lexical_alternative
