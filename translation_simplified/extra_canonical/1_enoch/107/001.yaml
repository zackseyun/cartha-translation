translation:
  language: en
  text: 'And I saw this written on them: Generation after generation will keep doing wrong until a righteous generation arises. Then wickedness will be destroyed, sin will disappear from the earth, and every good thing will come to the earth.'
  philosophy: optimal-equivalence
