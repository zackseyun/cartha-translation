- pob_phrase: I saw written upon them that
  simplified_phrase: 'I saw this written on them:'
  preserved_meaning: The speaker sees a written message while the unidentified referent of “them” remains unchanged.
  reasoning_layer_used: Corrected full source payload and POB vision-report decision
  rationale: A colon introduces the message naturally without inventing what it was written on.
- pob_phrase: generation after generation will transgress
  simplified_phrase: Generation after generation will keep doing wrong
  preserved_meaning: Successive generations continue to commit wrongdoing.
  reasoning_layer_used: POB source-driven translation
  rationale: “Keep doing wrong” is clearer than “transgress” and avoids narrowing the act to rebellion.
- pob_phrase: a generation of righteousness arises, and iniquity is destroyed
  simplified_phrase: a righteous generation arises. Then wickedness will be destroyed
  preserved_meaning: A righteous generation appears, followed by the destruction of wickedness.
  reasoning_layer_used: POB translation and clause sequence
  rationale: Two shorter sentences make the sequence clear while preserving both events.
