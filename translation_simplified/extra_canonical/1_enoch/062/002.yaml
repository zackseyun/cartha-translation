  preserved_meaning: His spoken judicial word has a lethal effect on every sinner.
  reasoning_layer_used: lexical decision and theological decision
  rationale: “Puts to death” is clearer than “slays” while retaining the judicial and lethal force.
- pob_phrase: all the lawless are destroyed from before his face
  simplified_phrase: all the lawless are destroyed before his face—in his very presence
  preserved_meaning: Those who oppose divine order are destroyed in the enthroned figure’s presence.
  reasoning_layer_used: lexical decision and cultural note
  rationale: The wording keeps the concrete face image and immediately explains its judgment idiom.
- pob_phrase: one long sentence joined by repeated “and”
