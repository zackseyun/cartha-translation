translation:
  language: en
  text: The Lord of Spirits seated him on the throne of his glory.[a] The spirit of righteousness was poured out on him. The word from his mouth puts all sinners to death, and all the lawless are destroyed before his face—in his very presence.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The wording leaves the identity of “him” unstated here; the context may point to the figure mentioned in the preceding verse.
    reason: source_note
