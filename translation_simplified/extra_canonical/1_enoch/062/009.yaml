- pob_phrase: the mighty and the exalted
  simplified_phrase: the powerful, the people of high rank
  preserved_meaning: Both political power and elevated social status remain distinct.
  reasoning_layer_used: POB lexical decisions for መዛዝእት and ልዑላን
  rationale: Common wording clarifies two different classes of prominent people.
- pob_phrase: shall fall down before him on their faces
  simplified_phrase: will fall face down before him
  preserved_meaning: The vivid bodily posture of compelled or reverent prostration is retained.
  reasoning_layer_used: POB lexical decision for ይወድቁ and በቅድሜሁ በገጾሙ
  rationale: “Face down” states the physical action directly in natural English.
- pob_phrase: they shall petition him and seek mercy from him
  simplified_phrase: They will plead with him and seek mercy from him
  preserved_meaning: The two acts of urgent appeal and asking for mercy remain present.
  reasoning_layer_used: POB lexical decision and latest revision pass
  rationale: “Plead” is more immediately understandable than “petition” while preserving supplication.
