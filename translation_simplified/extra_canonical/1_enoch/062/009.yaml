translation:
  language: en
  text: Then all the kings, the powerful, the people of high rank, and everyone who rules the dry land[a] will fall face down before him. They will bow down[b] and place their hope in that Son of Man. They will plead with him and seek mercy from him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “The dry land” is a concrete expression for the inhabited land or earth.
    reason: lexical_alternative
  - marker: b
    text: “Bow down” may also mean to offer homage or, more strongly, to worship.
    reason: lexical_alternative
