translation:
  language: en
  text: On that day, all the kings, the powerful, the exalted, and those who possess the earth[a] will stand up. They will see and recognize that he sits on his glorious throne. Righteousness will be judged before him[b], and no lie will be spoken in his presence.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may also mean “those who hold the earth” or “those who rule the land or world.” The wording can refer to possession or control.
    reason: lexical_alternative
  - marker: b
    text: The Ethiopic wording “Righteousness will be judged before him” is difficult, but it appears to retain a judicial sense.
    reason: textual_variant
