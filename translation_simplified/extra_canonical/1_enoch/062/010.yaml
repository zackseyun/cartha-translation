translation:
  language: en
  text: The Lord of Spirits will drive them away, making them hurry out from before his face.[a] Their faces will be filled with shame, and darkness will be added to their faces.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “from his presence”; the source literally says “from before his face.”
    reason: lexical_alternative
