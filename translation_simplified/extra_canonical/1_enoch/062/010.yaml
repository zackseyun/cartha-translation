  preserved_meaning: The Lord forcefully compels them to leave quickly.
  reasoning_layer_used: Lexical decisions for ይጐጕኦሙ and ከመ ይፍጥኑ
  rationale: The rewrite uses ordinary English while retaining coercion, haste, and departure.
- pob_phrase: one sentence with three linked clauses
  simplified_phrase: two sentences
  preserved_meaning: Their forced departure is followed by shame and increasing darkness.
  reasoning_layer_used: POB clause structure and immediate context
  rationale: The sentence break clarifies the sequence without changing it.
- pob_phrase: darkness will be added to their faces
  simplified_phrase: darkness will be added to their faces
  preserved_meaning: The judicial darkness accumulates upon their faces.
  reasoning_layer_used: Doctrine realignment and Geʿez lexical decision for ይትዌሰክ
  rationale: The unusual wording is retained because smoother “cover” would erase the source idea of addition.
