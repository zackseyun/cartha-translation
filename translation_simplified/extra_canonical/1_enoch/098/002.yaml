  text: For you men love to adorn yourselves more than women do, and you love companionship more than a virgin does.[a] Royal status, greatness, authority, silver and gold, purple cloth, splendor, and food—all these will be poured out like water.[b]
  philosophy: optimal-equivalence
  footnotes:
