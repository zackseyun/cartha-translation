  language: en
  text: 'Understand this now: you have been prepared for the day of destruction.[a] Do not hope that you sinners will survive. Instead, you will depart and die. You know of no ransom—no price that could release you—because you have been made ready for that day.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the day of slaughter.” The term may refer broadly to destruction or more sharply to slaughter.
    reason: lexical_alternative
