translation:
  language: en
  text: Woe to you, fools! You will perish because of your foolishness. You oppress the wise,[a] and no good will come to you.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The disputed verb has also been understood as “you disregard the wise” or “you drive away the wise.” An older wealth-related rendering in the POB record was rejected by a later source review.
    reason: source_note
  - marker: b
    text: Or “no well-being will reach you.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: for you will perish in your folly
  simplified_phrase: You will perish because of your foolishness.
  preserved_meaning: Their own moral folly leads to their ruin.
  reasoning_layer_used: Applied revision and source review
  rationale: This keeps the people as those who perish while stating the connection in direct English.
- pob_phrase: and good will not come upon you
  simplified_phrase: and no good will come to you
  preserved_meaning: Good or well-being will not reach them.
  reasoning_layer_used: POB lexical decision and footnote b
  rationale: Removing “upon” makes the broad judgment natural without narrowing “good.”
interpretive_expansions:
- pob_phrase: you will perish in your folly
  rendering: You will perish because of your foolishness.
  claim: Their foolishness is the reason or means by which they perish.
  evidence:
  - The applied revision and its rationale treat folly as leading to ruin.
  confidence: high
  alternatives_preserved:
  - You will perish in your foolishness.
  - You will perish through your foolishness.
translation_notes:
  risk_flags:
