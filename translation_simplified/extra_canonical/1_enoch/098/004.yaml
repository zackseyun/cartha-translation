translation:
  language: en
  text: 'I swear to you, sinners: Just as a mountain has never become a slave, and a hill does not become a woman’s female slave,[a] so sin was not sent upon the earth. Human beings created it themselves, and those who practice it will come under a great curse.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The wording of this comparison is uncertain in Ge’ez, but it appears to say that sin was not imposed on creation, just as a mountain or hill does not become a slave.
    reason: textual_variant
