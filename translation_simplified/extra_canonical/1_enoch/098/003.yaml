translation:
  language: en
  text: Therefore, they lack instruction and wisdom. Because of this, they will perish along with everything they own and all their glory and honor. In shame, slaughter, and terrible deprivation,[a] their spirits will be thrown into the furnace of fire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The underlying phrase is difficult and may also mean “great misery” or “great affliction.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: they have no instruction or wisdom
  simplified_phrase: they lack instruction and wisdom
  preserved_meaning: They presently lack moral teaching and practical wisdom.
  reasoning_layer_used: lexical decisions and applied revision
  rationale: “Lack” states the present condition naturally while preserving the causal link to judgment.
- pob_phrase: together with their possessions
  simplified_phrase: along with everything they own
  preserved_meaning: Their material goods share in their ruin.
  reasoning_layer_used: lexical decision for ንዋያቲሆሙ
  rationale: The common phrase clarifies that possessions means material goods broadly.
- pob_phrase: in great destitution ... will be cast
  simplified_phrase: in terrible deprivation ... will be thrown
  preserved_meaning: Their spirits face forcible judgment amid severe loss and wretchedness.
  reasoning_layer_used: lexical and theological decisions
  rationale: The wording is more familiar while retaining both deprivation and forcible consignment.
translation_notes:
  risk_flags:
  - risk: “Terrible deprivation” may suggest material poverty more narrowly than the difficult source phrase.
    mitigation: The footnote preserves the broader possibilities of misery and affliction.
  - risk: The furnace image could be read as settling the nature or duration of final punishment.
    mitigation: The text names the spirits and preserves the image without adding a doctrinal explanation.
