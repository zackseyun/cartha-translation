translation:
  language: en
  text: All in the heights of heaven who do not sleep will bless him. All the holy ones in heaven will bless him, together with all the chosen ones who live in the garden of life. Every spirit of light that is able will bless, glorify, exalt, and sanctify your blessed name. All flesh will exceedingly and powerfully praise and bless your name forever and ever.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Ethiopic wording is difficult; it may instead describe all flesh as having surpassing strength or abundant power.
    reason: textual_variant
simplification_decisions:
- pob_phrase: All who do not sleep in the heights of heaven shall bless him
  simplified_phrase: All in the heights of heaven who do not sleep will bless him
  preserved_meaning: Wakeful beings in the elevated heavenly realm are foretold to bless him.
  reasoning_layer_used: lexical decisions and applied pronoun revision
  rationale: The reordered clause is natural English while preserving the heavenly image and deliberate third-person pronoun.
- pob_phrase: all the chosen ones who dwell in the garden of life
  simplified_phrase: all the chosen ones who live in the garden of life
  preserved_meaning: The chosen ones inhabit the garden of life.
  reasoning_layer_used: lexical and theological decisions
  rationale: “Live” replaces formal “dwell” without defining the chosen ones more narrowly than the text does.
- pob_phrase: all flesh shall exceedingly and with power praise and bless your name forever and ever
  simplified_phrase: All flesh will exceedingly and powerfully praise and bless your name forever and ever
  preserved_meaning: All flesh will praise and bless the divine name with extraordinary intensity and power for all time.
  reasoning_layer_used: applied syntactic revision and latest revision pass
  rationale: “Powerfully” expresses the adjudicated adverbial sense more naturally while the footnote preserves the alternate construal.
translation_notes:
  risk_flags:
  - risk: Readers may assume the holy ones and chosen ones are specifically angels or redeemed humans.
    mitigation: Both titles remain undefined, as required by the theological decision.
  - risk: The difficult final Ethiopic phrase may modify the actions or describe the strength of all flesh.
    mitigation: The main text follows the adjudicated adverbial reading, and the footnote preserves the alternative.
