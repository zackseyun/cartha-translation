translation:
  language: en
  text: On that day, they will lift up their voices as one. They will bless, praise, and exalt the Lord in the spirit of faith,[a] in the spirit of wisdom, in the spirit of patience, in the spirit of mercy, in the spirit of righteousness and peace, and in the spirit of goodness.[b] Then they will all declare with one voice, “Blessed be he, and blessed be the name of the Lord of Spirits forever and ever.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “faithfulness.”
    reason: lexical_alternative
  - marker: b
    text: The repeated “spirit of” may describe their disposition, God-given qualities, or heavenly endowments.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: On that day they shall raise one voice
  simplified_phrase: On that day, they will lift up their voices as one
  preserved_meaning: The worshipers unite in a single act of praise.
  reasoning_layer_used: Lexical decision on “one voice”
  rationale: The wording keeps the collective voice image while making the idiom immediately clear.
- pob_phrase: and they shall bless and praise and exalt ...; and all of them shall say
  simplified_phrase: They will bless, praise, and exalt ... Then they will all declare
  preserved_meaning: The three acts of worship remain distinct and lead into a shared proclamation.
  reasoning_layer_used: Lexical decisions and source clause structure
  rationale: Two sentences clarify the sequence without compressing the cumulative verbs.
- pob_phrase: in the spirit of faith, and in the spirit of wisdom ...
  simplified_phrase: in the spirit of faith, in the spirit of wisdom ...
  preserved_meaning: Each named virtue continues to shape or accompany the praise.
  reasoning_layer_used: Theological decision preserving the repeated construction
  rationale: The repetition is retained because its exact theological sense remains open.
