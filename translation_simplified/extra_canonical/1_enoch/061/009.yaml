  text: When he[a] lifts up his face, he will judge their hidden ways by the word of the name of the Lord of Spirits[b], and their conduct according to the Lord of Spirits’ path of righteousness. Then they will all speak with one voice. They will bless, praise, exalt, and sanctify the name of the Lord of Spirits.
