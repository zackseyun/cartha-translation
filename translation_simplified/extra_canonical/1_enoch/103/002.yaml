translation:
  language: en
  text: For I know the mystery. I have read the tablets of heaven[a] and seen the holy writings[b]. I found what was written in them and understood what it said about them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The “tablets of heaven” are an apocalyptic image for heavenly records or decrees, though the concrete image of tablets remains important.
    reason: cultural_note
  - marker: b
    text: The Ge'ez phrase is difficult; it may also be read “the holy writing,” while an earlier rendering was “the writing of the holy ones.”
    reason: lexical_alternative
