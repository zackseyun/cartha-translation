translation:
  language: en
  text: Do not say, you righteous and good people who are alive, “In our time of suffering, we worked very hard.[a] We experienced every kind of trouble and faced many evils. We were oppressed and reduced in number, and our spirit shrank within us.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The source wording here is textually difficult, but it describes severe hardship and labor.
    reason: textual_variant
  - marker: b
    text: Literally, “our spirit became small,” an image that may express discouragement, weakness, or loss of courage.
    reason: lexical_alternative
