- pob_phrase: you righteous and good who are in life
  simplified_phrase: you righteous and good people who are alive
  preserved_meaning: The words address righteous people who are presently living.
  reasoning_layer_used: POB theological decision
  rationale: “Who are alive” states the present-life sense in ordinary English.
- pob_phrase: we saw every trouble, and we encountered many evils
  simplified_phrase: We experienced every kind of trouble and faced many evils
  preserved_meaning: They suffered all kinds of trouble and many evils.
  reasoning_layer_used: POB lexical decisions
  rationale: “Experienced” conveys the source idiom of seeing trouble without merging the two clauses.
- pob_phrase: we were oppressed and made few
  simplified_phrase: We were oppressed and reduced in number
  preserved_meaning: Others treated them unjustly and their number was diminished.
  reasoning_layer_used: POB lexical decisions and applied revisions
  rationale: “Reduced in number” makes the concrete meaning of “made few” immediately clear.
