  preserved_meaning: They escaped hardship and violent killing during earthly life.
  reasoning_layer_used: applied revision and lexical decisions for ምንዳቤ and ቀትለ
  rationale: “Faced” clearly conveys experiencing these evils while preserving the violent image.
