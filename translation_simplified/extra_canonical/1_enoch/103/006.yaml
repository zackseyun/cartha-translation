translation:
  language: en
  text: Now they have died prosperous and wealthy. During their lives they never faced distress or slaughter.[a] They died with honor, and no judgment was carried out against them while they were alive.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: An earlier rendering read, “in distress, and they saw slaughter.” This translation follows the corrected reading, “they never faced distress or slaughter.”
    reason: simplification_note
