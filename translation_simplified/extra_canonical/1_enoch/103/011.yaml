translation:
  language: en
  text: We hoped to become the head, but we became the tail. We worked hard, yet we had no control over what our labor produced.[a] We became food for sinners and the lawless,[b] and they forced us under their heavy yoke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The wording of this clause is difficult in the Ethiopic; it may instead mean, “We labored, but our work did not succeed.”
    reason: lexical_alternative
  - marker: b
    text: “Food” is a vivid image meaning that they became prey to their oppressors.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: We hoped to become the head, and we became the tail
  simplified_phrase: We hoped to become the head, but we became the tail
  preserved_meaning: Their hope for honor ended in humiliating reversal.
  reasoning_layer_used: Lexical and theological decisions preserving the head-and-tail image
  rationale: “But” makes the reversal clear while retaining the concrete image.
- pob_phrase: we toiled, but we did not gain mastery over our labor
  simplified_phrase: We worked hard, yet we had no control over what our labor produced
  preserved_meaning: They could not control the outcome or benefit of their strenuous work.
  reasoning_layer_used: Latest revision and lexical rationale concerning the fruit of labor
  rationale: The wording avoids suggesting that they could not direct the work itself.
- pob_phrase: they laid their yoke heavily upon us
  simplified_phrase: they forced us under their heavy yoke
  preserved_meaning: Their oppressors subjected them to harsh domination.
  reasoning_layer_used: Theological decision requiring preservation of the yoke metaphor
  rationale: The natural recasting keeps the image of oppressive rule.
interpretive_expansions:
- pob_phrase: did not gain mastery over our labor
  rendering: had no control over what our labor produced
  claim: The lost control concerns the labor’s outcome or benefit rather than the activity of working.
  evidence:
  - The lexical rationale identifies inability to control the fruit of one’s labor.
  - The applied revision records labor or the wages and fruit of labor as the contextual sense.
  confidence: moderate
  alternatives_preserved:
  - We labored, but our work did not succeed.
