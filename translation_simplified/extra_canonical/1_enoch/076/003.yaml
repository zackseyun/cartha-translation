translation:
  language: en
  text: The first three are on the east side. The next three are on the north side. After them, three are on the left, on the south side.[a][b] Three are on the west side.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: When facing east, ancient directional language normally placed north on the left, though this text links “left” with south.
    reason: cultural_note
  - marker: b
    text: The words “after them, three are on the left” are uncertain in the supplied Ethiopic text.
    reason: textual_variant
