translation:
  language: en
  text: The first wind to come out from those gates is called the east wind. It comes through the first gate toward the east, inclining toward the south.[a] From that gate come desolation, drought, death,[b] and destruction.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The phrase translated “inclining toward the south” is difficult; it may mean “turning southward,” and it is uncertain whether it describes the wind’s course or the gate’s direction.
    reason: lexical_alternative
  - marker: b
    text: A previous rendering had “heat” here because of an OCR difficulty, but the transmitted Ge‘ez reads “death.”
    reason: textual_variant
