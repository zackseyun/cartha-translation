translation:
  language: en
  text: There I saw a spring of righteousness that could never run dry. Many springs of wisdom were all around it.[a] All who were thirsty drank from them and were filled with wisdom. Their home was among the righteous, the holy,[b] and the chosen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Ethiopic wording is difficult here; it probably means that the springs of wisdom were around the spring of righteousness.
    reason: textual_variant
  - marker: b
    text: Or “the holy ones.”
    reason: lexical_alternative
