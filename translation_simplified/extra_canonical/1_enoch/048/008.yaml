translation:
  language: en
  text: In those days, the kings of the earth and the powerful people who possess the dry land[a] will be humbled, their faces downcast,[b] because of what their own hands have done. On the day of their distress and suffering, they will not be able to save themselves.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Dry land” is literal and may mean the inhabited earth under human rule.
    reason: lexical_alternative
  - marker: b
    text: The compressed wording could instead refer to “the humble of face,” but it most likely describes the rulers’ humiliation.
    reason: alternative_reading
