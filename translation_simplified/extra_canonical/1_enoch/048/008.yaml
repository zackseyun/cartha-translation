  simplified_phrase: the powerful people
  preserved_meaning: This identifies influential persons who are judged alongside the kings.
  reasoning_layer_used: POB lexical decision for ጽኑዓን
  rationale: “Powerful people” is immediately clear while retaining the social force of “the mighty.”
- pob_phrase: the faces ... shall be humbled
  simplified_phrase: will be humbled, their faces downcast
  preserved_meaning: The rulers are disgraced while the source image of the face remains visible.
  reasoning_layer_used: POB theological decision and applied source revision
  rationale: The recast wording clarifies that the rulers themselves become visibly humiliated.
- pob_phrase: because of the works of their hands
  simplified_phrase: because of what their own hands have done
  preserved_meaning: Their judgment results from their deeds without limiting the phrase to idols.
  reasoning_layer_used: POB lexical and theological decisions for በእንተ ምግባረ እደዊሆሙ
  rationale: The active wording explains the biblical idiom without narrowing its broad moral sense.
