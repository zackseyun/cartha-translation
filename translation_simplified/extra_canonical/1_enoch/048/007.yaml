translation:
  language: en
  text: The wisdom of the Lord of Spirits has revealed him to those who are holy and righteous.[a] They have held on to the portion that belongs to the righteous,[b] because they hated and rejected this unrighteous world. In the name of the Lord of Spirits, they hated all its deeds and all its ways. For by his name they are saved,[c] and their life came to be by his good will.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Those who are holy” may also be translated “the holy ones.”
    reason: lexical_alternative
  - marker: b
    text: Literally, “the portion of the righteous”; this may mean their allotted share, lot, or inheritance.
    reason: lexical_alternative
  - marker: c
    text: The expression may also mean that by his name they will be saved or find deliverance.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: to the holy and to the righteous
  simplified_phrase: to those who are holy and righteous
  preserved_meaning: The people remain identified by holiness and righteousness.
  reasoning_layer_used: POB lexical decisions for ቅዱሳን and ጻድቃን
  rationale: The recast makes the group labels natural without importing the later sense of “saints.”
- pob_phrase: they have kept the portion of the righteous
  simplified_phrase: They have held on to the portion that belongs to the righteous
  preserved_meaning: They have faithfully retained the portion associated with the righteous without defining it only as a lot or inheritance.
  reasoning_layer_used: POB lexical and theological decisions on ዐቀቡ and ክፍሎሙ
  rationale: The wording clarifies the relationship while retaining the concrete and deliberately ambiguous “portion” image.
- pob_phrase: by his good pleasure their life came to be
  simplified_phrase: their life came to be by his good will
  preserved_meaning: Their life depends on the Lord of Spirits’ benevolent purpose.
  reasoning_layer_used: POB lexical decisions for በፈቃዱ and ኮነ ሕይወቶሙ
  rationale: “Good will” is familiar English that preserves divine willing without adding further theological coloring.
translation_notes:
  risk_flags:
