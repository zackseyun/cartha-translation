  language: en
  text: 'Then Raphael, one of the holy angels with me, replied, “These hollow places[a] were made so that the spirits—the souls of the dead—could be gathered into them. They were created here for this purpose: to gather all the souls of the children of men.”'
  philosophy: optimal-equivalence
  footnotes:
