translation:
  language: en
  text: He answered me and said to me,[a] “This spirit came out from Abel, whom his brother Qayin killed. It brings a charge against Qayin until Qayin’s seed—his family line—is destroyed from the face of the earth, and his seed is blotted out from among humanity.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The source includes both “answered me” and a bracketed “said to me,” so both are retained.
    reason: textual_variant
simplification_decisions:
- pob_phrase: the spirit that came out from Abel
  simplified_phrase: This spirit came out from Abel
  preserved_meaning: Abel’s spirit is personally present outside his body in the vision.
  reasoning_layer_used: lexical and theological decisions
  rationale: A direct sentence preserves the vivid image and the text’s apocalyptic realism.
- pob_phrase: it makes accusation against him
  simplified_phrase: It brings a charge against Qayin
  preserved_meaning: Abel’s spirit continues to act as an accuser calling for judgment against Qayin.
  reasoning_layer_used: lexical decision and doctrine realignment
  rationale: “Brings a charge” is natural English while retaining the judicial force rejected by a flat paraphrase.
- pob_phrase: his seed is destroyed from before the face of the earth, and his seed is blotted out from among the seed of men
  simplified_phrase: Qayin’s seed—his family line—is destroyed from the face of the earth, and his seed is blotted out from among humanity
  preserved_meaning: The judgment wipes out Qayin’s lineage from the earth and from human posterity.
  reasoning_layer_used: lexical and theological decisions
  rationale: The wording explains “seed” but repeats it and preserves the intensified destruction-and-erasure pattern.
interpretive_expansions:
- pob_phrase: his seed
  rendering: Qayin’s seed—his family line
  claim: “Seed” refers to Qayin’s lineage or descendants.
  evidence:
  - The lexical rationale identifies lineage and judgment as the central motif.
  - The following phrase concerns removal from human posterity.
  confidence: high
  alternatives_preserved:
  - seed
  - descendants
  - offspring
translation_notes:
  risk_flags:
  - risk: Modern readers may initially take “seed” literally.
    mitigation: The appositive “his family line” explains the genealogical meaning without removing the source image.
  - risk: Simplifying “from before the face of the earth” reduces some Semitic-style cadence.
    mitigation: “From the face of the earth” retains the central earth-face image in natural English.
