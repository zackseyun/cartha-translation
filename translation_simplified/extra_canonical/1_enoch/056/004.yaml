  text: In those days, that valley[a] will be full of the chosen and those dear to them.[b] Their lives will come to an end. From then on, the days of their wandering will no longer be counted.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The word translated “valley” may also mean “region” or “place,” so the exact geography is uncertain.
    reason: lexical_alternative
  - marker: b
    text: “Those dear to them” refers to people associated with the chosen, but the exact relationship is uncertain.
    reason: lexical_alternative
  - marker: c
    text: “Wandering” may also mean “error” or “straying,” and “counted” may mean “known” or “reckoned”; the Ethiopic line is difficult.
    reason: alternative_reading
