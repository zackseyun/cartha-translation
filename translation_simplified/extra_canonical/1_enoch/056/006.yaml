translation:
  language: en
  text: They will go up[a] into the land of his chosen ones and trample it underfoot. Ahead of them, the land will become trampled ground—a beaten path.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may also mean that they will advance and march over the land.
    reason: lexical_alternative
  - marker: b
    text: The Ge'ez wording is difficult; the two expressions together emphasize land beaten down by repeated trampling.
    reason: textual_variant
