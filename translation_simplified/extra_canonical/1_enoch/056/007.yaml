  preserved_meaning: The city obstructs the enemy horses without specifying how.
  reasoning_layer_used: Lexical decision for ማዕቀፈ and footnote a
  rationale: The verb “block” makes the military obstacle clear while the note preserves the possible trap image.
- pob_phrase: their right hand will be strong against them
  simplified_phrase: their own right hands will be strong against one another
  preserved_meaning: Their right hands remain the martial image of power used in mutual violence.
  reasoning_layer_used: Lexical decision and theological decision on mutual self-destruction
  rationale: The plural and reciprocal wording clarify who attacks whom without removing the source image.
- pob_phrase: until the number of the corpses from their death is complete
  simplified_phrase: until the full number of bodies from their deaths has been reached
  preserved_meaning: The judgment continues until the grim count of the dead is complete.
  reasoning_layer_used: Lexical decision and textual-variant footnote c
  rationale: The revised order is readable but does not smooth away the difficult quantitative image.
