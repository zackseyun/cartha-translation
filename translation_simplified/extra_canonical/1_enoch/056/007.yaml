translation:
  language: en
  text: The city of my righteous ones will block their horses.[a] They will stir up slaughter among themselves, and their own right hands will be strong against one another. No one will know his brother, and no son will know his father or mother, until the full number of bodies from their deaths has been reached.[b] Their punishment will not be for nothing.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The city may be pictured as an obstacle or a trap for their horses.
    reason: lexical_alternative
  - marker: b
    text: The wording about the number of bodies is difficult in the Ethiopic text.
    reason: textual_variant
