translation:
  language: en
  text: In those days, the angels will return. They will turn their heads east, toward the people of Parthia and Media, and stir up the kings.[a] A spirit of turmoil will come over the kings and drive them from their thrones.[b] They will go out like lions from their lairs and like hungry wolves in the middle of their pasture.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The ancient text is difficult here, but “kings” is likely because the next line speaks of their thrones.
    reason: textual_variant
  - marker: b
    text: Or “a spirit of confusion”; this may mean a spiritual agent or a force of disorder.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And in those days the angels will return and turn their heads toward the east
  simplified_phrase: In those days, the angels will return. They will turn their heads east
  preserved_meaning: The angels return and deliberately orient themselves eastward.
  reasoning_layer_used: applied revision and lexical decisions
  rationale: Two sentences ease the flow while preserving both return and the bodily image.
- pob_phrase: it will unsettle them from their thrones
  simplified_phrase: drive them from their thrones
  preserved_meaning: The turmoil removes the kings from royal power.
  reasoning_layer_used: lexical decision and immediate context
  rationale: “Drive them from” makes the political displacement clear in ordinary English.
- pob_phrase: in the midst of their pasture
  simplified_phrase: in the middle of their pasture
  preserved_meaning: The wolves remain pictured within their grazing ground.
  reasoning_layer_used: lexical decision
  rationale: “In the middle of” replaces a formal phrase without changing the image.
