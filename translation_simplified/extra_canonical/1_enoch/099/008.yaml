  simplified_phrase: They will lose their reason because of the madness in their hearts
  preserved_meaning: Their inner madness causes a severe loss of sound thought.
  reasoning_layer_used: Applied revision for ይትረሰዑ and lexical decision for እበደ
  rationale: “Lose their reason” clearly conveys mental derangement without suggesting that they faint.
- pob_phrase: through the fear of their heart
