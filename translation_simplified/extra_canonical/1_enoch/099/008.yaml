translation:
  language: en
  text: They will lose their reason because of the madness in their hearts. Their eyes will grow dark[a] because of the fear in their hearts and the visions they see in their dreams.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “their eyes will be darkened”; this may describe dimmed sight, terror-struck vision, or a loss of clear perception.
    reason: lexical_alternative
