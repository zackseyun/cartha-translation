  text: Those who bow down before stone[a], those who make images of gold, silver, wood, and clay, and those who bow down before evil spirits[b], demons, and every idol without understanding will find no help at all from them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “stone”; the singular probably refers to stone objects used in worship.
    reason: lexical_alternative
  - marker: b
    text: The phrase “evil spirits” could also mean “evil souls” or “wicked souls.”
    reason: lexical_alternative
