translation:
  language: en
  text: That day Michael replied to Raphael, “The spirit’s power grips me and makes me angry because the judgment involving these hidden secrets is so severe.[a] Who can endure such a harsh judgment when it has been carried out?[b] They melt away before it.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The difficult Ge’ez wording may instead describe a terrible matter heard concerning hidden things.
    reason: textual_variant
  - marker: b
    text: 'The wording may refer either to the judgment or to its revelation: “Who can bear the severe thing that has been done?”'
    reason: lexical_alternative
