  reasoning_layer_used: POB lexical decision for the narrative and temporal formula
  rationale: The shorter opening expresses the same transition in natural modern English.
- pob_phrase: that Michael said this to Raphael
  simplified_phrase: Michael said to Raphael
  preserved_meaning: Michael addresses the following statement to Raphael.
  reasoning_layer_used: POB lexical decision for the quotative transition
  rationale: Ordinary English does not need both “that” and “this” to introduce the quotation.
- pob_phrase: He will not be for them before the eye of the Lord
  simplified_phrase: He will not be on their side before the Lord’s eye
  preserved_meaning: The unnamed singular figure will not support them in the Lord’s presence.
  reasoning_layer_used: POB lexical alternatives, footnote, and pronoun decision
  rationale: “On their side” clarifies the difficult idiom while retaining the singular ambiguity and the vivid eye image.
