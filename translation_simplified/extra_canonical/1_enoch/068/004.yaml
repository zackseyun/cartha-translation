translation:
  language: en
  text: When he stood before the Lord of Spirits, Michael said to Raphael, “He[a] will not be on their side before the Lord’s eye, because the Lord of Spirits is angry with them. They act as if they were the Lord.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The identity of “he” is not stated. The difficult phrase may mean that he will not support or speak for them in the Lord’s presence.
    reason: lexical_alternative
