translation:
  language: en
  text: Mikael again answered Rufael, “Whose heart would not be softened about it, and whose kidneys[a] would not be troubled by this severe pronouncement and the sentence issued against them because of those who brought them out in this way?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “kidneys” is an ancient bodily image for a person’s deepest feelings or inner self.
    reason: lexical_alternative
  - marker: b
    text: The final clause is difficult and uncertain in the surviving Ethiopic text, so this wording should be read cautiously.
    reason: textual_variant
simplification_decisions:
- pob_phrase: And Mikael answered again and said to Rufael
  simplified_phrase: Mikael again answered Rufael
  preserved_meaning: Mikael responds to Rufael once more.
  reasoning_layer_used: The lexical decision and applied revision identify Mikael as the explicit subject.
  rationale: The shorter formula removes repetition without changing the speaker or hearer.
- pob_phrase: whose heart is not softened concerning it
  simplified_phrase: whose heart would not be softened about it
  preserved_meaning: The heart is moved regarding an antecedent that remains uncertain.
  reasoning_layer_used: The lexical rationale preserves both the softened-heart image and the restrained pronoun reference.
  rationale: “About it” is natural English and does not identify the referent with the following pronouncement.
- pob_phrase: this word of severity and the sentence that has gone out against them
  simplified_phrase: this severe pronouncement and the sentence issued against them
  preserved_meaning: A harsh declaration and a judicial sentence are directed against them.
  reasoning_layer_used: The lexical decisions establish the severe and judicial force of both phrases.
  rationale: Common judicial wording replaces abstract phrasing while preserving its force.
translation_notes:
  risk_flags:
  - risk: Modern readers may understand “kidneys” only as physical organs.
    mitigation: Footnote [a] explains the ancient image while retaining it in the text.
  - risk: The difficult final Ethiopic clause may allow another reconstruction.
    mitigation: Footnote [b] marks the uncertainty without displacing the POB reading.
