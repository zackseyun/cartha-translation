translation:
  language: en
  text: You see what Azazel has done. He has taught people on earth every kind of unrighteousness. He has also revealed the hidden things of the world[a] that are done in the heavens, and people learned them.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This could also mean “the secrets of the age” or “the hidden things of eternity.”
    reason: lexical_alternative
  - marker: b
    text: The final clause is difficult in the Ethiopic witness and may instead mean “which people were striving to learn.”
    reason: textual_variant
simplification_decisions:
- pob_phrase: how he has taught all unrighteousness upon the earth
  simplified_phrase: He has taught people on earth every kind of unrighteousness.
  preserved_meaning: Azazel actively spread comprehensive moral wrongdoing through forbidden instruction in the earthly sphere.
  reasoning_layer_used: lexical and theological decisions
  rationale: A separate sentence and an explicit human audience make the accusation easier to follow without narrowing “unrighteousness.”
- pob_phrase: revealed the hidden things of the world that are done in the heavens, which men learned
  simplified_phrase: revealed the hidden things of the world that are done in the heavens, and people learned them
  preserved_meaning: Azazel disclosed concealed heavenly matters that humanity came to know.
  reasoning_layer_used: applied revision and lexical decisions
  rationale: The coordinated clause clarifies what people learned while retaining the world-heavens contrast.
- pob_phrase: men
  simplified_phrase: people
  preserved_meaning: Human beings generally are meant, not males alone.
  reasoning_layer_used: modern common-English style
  rationale: “People” expresses the generic human reference naturally in current English.
