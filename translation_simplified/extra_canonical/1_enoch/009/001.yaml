translation:
  language: en
  text: Then Michael, Uriel, Raphael, and Gabriel looked down from heaven. They saw much blood being poured out on the earth[a] and all the lawlessness taking place on the earth.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “being shed.” Some understand the blood as crying out, but the main text preserves the immediate image of blood poured onto the earth.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And then Michael, Uriel, Raphael, and Gabriel looked down from heaven and saw
  simplified_phrase: Then Michael, Uriel, Raphael, and Gabriel looked down from heaven. They saw
  preserved_meaning: The angels observe the earth from their heavenly vantage point.
  reasoning_layer_used: POB lexical decisions and latest revision
  rationale: Two sentences make the long vision report easier to follow while retaining its sequence and viewpoint.
- pob_phrase: all the lawlessness being done
  simplified_phrase: all the lawlessness taking place
  preserved_meaning: They witness the full extent of ongoing wicked transgression.
  reasoning_layer_used: POB lexical decision for ኵሎ ዓመፃ and ዘይትገበር
  rationale: “Taking place” is more natural English than “being done” without narrowing lawlessness to violence alone.
- pob_phrase: upon the earth ... upon the earth
  simplified_phrase: on the earth ... on the earth
  preserved_meaning: The repetition emphasizes the earth as the scene of bloodshed and lawlessness.
  reasoning_layer_used: POB locative rationale and footnote
  rationale: “On” is common modern English, while repeating the full phrase preserves the verse’s emphasis.
