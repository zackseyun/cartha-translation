translation:
  language: en
  text: And Enoch said, “My children, I will tell you about the children of righteousness, the chosen of the world,[a] and the plant of uprightness. I will make known to you what I, Enoch, was shown from a vision of heaven, what I learned from the words of the holy angels, and what I understood from heaven’s tablets.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the chosen of the age.”
    reason: lexical_alternative
  - marker: b
    text: Heaven’s tablets are heavenly records and may also be understood as heaven’s writings or books.
    reason: lexical_alternative
