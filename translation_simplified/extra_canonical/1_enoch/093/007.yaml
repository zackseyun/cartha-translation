translation:
  language: en
  text: After this, when the fifth week[a] comes to an end, the house of glory and royal rule will be built to last forever.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “week” means a symbolic period in Enoch’s vision of history, not necessarily seven days.
    reason: cultural_note
  - marker: b
    text: Or, “the glorious house and the kingdom will be built to last forever.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: at its completion
  simplified_phrase: when the fifth week comes to an end
  preserved_meaning: The symbolic fifth period reaches its appointed endpoint.
  reasoning_layer_used: Lexical decision for በተፍጻሜታ and its suffix
  rationale: Naming the week directly removes an unclear pronoun and uses ordinary English.
- pob_phrase: the house of glory and kingship
  simplified_phrase: the house of glory and royal rule
  preserved_meaning: The house is characterized by sacred glory and sovereign authority.
  reasoning_layer_used: Lexical and theological decisions for ቤተ ስብሐት and መንግሥት
  rationale: “Royal rule” explains “kingship” without turning it into a geographic kingdom.
- pob_phrase: shall be built forever
  simplified_phrase: will be built to last forever
  preserved_meaning: The house will be built and will endure permanently.
  reasoning_layer_used: Lexical decisions for ይትሐነጽ and እስከ ለዓለም
  rationale: The new wording prevents readers from thinking the building process continues forever.
interpretive_expansions:
- pob_phrase: shall be built forever
  rendering: will be built to last forever
  claim: “Forever” describes the house’s lasting permanence rather than an endless construction process.
  evidence:
  - The lexical rationale identifies the final idiom as expressing perpetual endurance.
  - The theological reasoning treats the house as a concrete apocalyptic sanctuary image.
  confidence: high
