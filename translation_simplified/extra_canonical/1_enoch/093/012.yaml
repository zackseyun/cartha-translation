translation:
  language: en
  text: Who can see heaven? Who can understand how heaven works? Who can see a soul—or, if not, a spirit—and describe it?[a] Or who can go up and see all their reaches?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The wording “a soul—or, if not, a spirit” is difficult and uncertain; it keeps soul and spirit distinct without resolving their relationship.
    reason: textual_variant
  - marker: b
    text: The final words may mean “all their ends” or “extremities”; a more literal but obscure possibility is “all their wings.”
    reason: lexical_alternative
