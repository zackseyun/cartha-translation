  text: After this, at the end of the third week,[a] a man[b] will be chosen to be the plant of righteous judgment.[c] After him, the plant of righteousness will spring forth forever and ever.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The “third week” is a symbolic period in the Apocalypse of Weeks, not a literal seven-day week.
    reason: cultural_note
  - marker: b
