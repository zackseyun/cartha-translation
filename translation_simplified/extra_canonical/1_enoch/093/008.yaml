translation:
  language: en
  text: After this, during the sixth week, everyone living in that time will be spiritually blind,[a] and their hearts will forget wisdom. During that week, a man will ascend.[b] At the end of the week, the house of the kingdom will be burned with fire,[c] and the entire family line growing from the chosen root will be scattered.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The wording may also be translated “blind” or “darkened”; here it describes spiritual blindness.
    reason: lexical_alternative
  - marker: b
    text: Or “a man will arise”; the wording does not identify the man or specify what kind of ascent is meant.
    reason: lexical_alternative
  - marker: c
    text: “House of the kingdom” may mean the royal order or dynasty, though a palace or temple may also be in view.
    reason: lexical_alternative
