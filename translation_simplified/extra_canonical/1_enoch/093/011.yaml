translation:
  language: en
  text: For what human being can hear the voice of the Holy One[a] without being shaken? Who can understand the Holy One’s thoughts? Who can see all the works of heaven?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “word” or “speech of the Holy One.”
    reason: lexical_alternative
  - marker: b
    text: “The works of heaven” may include its ordered structures, movements, and events, not only visible objects.
    reason: cultural_note
