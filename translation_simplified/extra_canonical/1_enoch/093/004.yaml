translation:
  language: en
  text: After me, during the second week,[a] great evil will arise, and deceit will spring up within it. In that week the first end will come, and a man will be saved.[b] After that week is complete, unrighteousness will grow, and a law will be made for sinners.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “week” is a symbolic period of history, not necessarily seven days.
    reason: cultural_note
  - marker: b
    text: This may refer to Noah, but the verse does not name the man.
    reason: cross_reference
  - marker: c
    text: The law may be for, concerning, or against sinners.
    reason: lexical_alternative
