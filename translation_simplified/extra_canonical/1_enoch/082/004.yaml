translation:
  language: en
  text: Blessed are all the righteous who walk the path of righteousness. Throughout the full count of their days, they have no sin like sinners. Meanwhile, the sun follows its course through heaven, entering and leaving through the gates for thirty days. It travels with the leaders of the starry orders[b] and with the four added days.[a] These four days mark off the year’s four divisions. They also lead the others and enter alongside them on four days.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The surviving Ethiopic text is difficult here, but the context most likely refers to four added days that mark the year’s four divisions.
    reason: textual_variant
  - marker: b
    text: More literally, “the heads of the thousands of the order of the stars”; the difficult Ethiopic wording depicts a hierarchy among the stars.
    reason: lexical_alternative
