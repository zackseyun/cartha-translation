  rationale: This keeps the calendrical word “count” while removing repetition.
- pob_phrase: the heads of the thousands of the order of the stars
  simplified_phrase: the leaders of the starry orders
  preserved_meaning: The stars are presented as organized under a hierarchy of leaders.
  reasoning_layer_used: Lexical alternatives and independent grounding review
  rationale: The supported alternative gives readers the hierarchical image in natural English.
- pob_phrase: which divide the four parts of the year, which lead them and enter with them on four days
  simplified_phrase: These four days mark off the year’s four divisions. They also lead the others and enter alongside them on four days.
  preserved_meaning: The added days divide the year and retain their personified roles of leading and entering.
  reasoning_layer_used: Lexical decisions and independent grounding review
  rationale: Two sentences make the added days the clear subject without identifying the uncertain objects.
