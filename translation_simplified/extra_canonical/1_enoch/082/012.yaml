translation:
  language: en
  text: These are the heads of a thousand.[a] Between one leader and the next, six are added after the fixed position. Their leaders mark the divisions.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Ethiopic wording is difficult; “heads of a thousand” may mean chiefs or leaders associated with a thousand, and the exact arrangement described in this verse is uncertain.
    reason: textual_variant
