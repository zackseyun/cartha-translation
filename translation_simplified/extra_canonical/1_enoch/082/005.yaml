translation:
  language: en
  text: Because of them, people go astray and fail to take them into account in the world’s reckoning. People are mistaken about them and do not know them precisely.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Them” may refer to the heavenly lights, their appointed times, or the divisions of the calendar. “The world’s reckoning” may also carry the sense of the world’s thought or calculation.
    reason: source_note
simplification_decisions:
- pob_phrase: do not reckon them
  simplified_phrase: fail to take them into account
  preserved_meaning: People do not properly include or consider them in their reckoning.
  reasoning_layer_used: POB lexical decision for ኢየኀስብዎሙ
  rationale: “Take into account” expresses reckoning in familiar English without limiting it to arithmetic.
- pob_phrase: in the reckoning of all the world
  simplified_phrase: in the world’s reckoning
  preserved_meaning: The difficult phrase retains its worldwide scope and its reckoning sense.
  reasoning_layer_used: POB text, lexical rationale, and footnote a
  rationale: This avoids implying a single worldwide calendar while the footnote preserves the mental-calculative ambiguity.
- pob_phrase: do not know them exactly
  simplified_phrase: do not know them precisely
  preserved_meaning: People lack exact and careful knowledge of them.
  reasoning_layer_used: POB lexical decision for ጥንቁቀ
  rationale: “Precisely” naturally conveys accurate knowledge in modern English.
