  text: This account is true, and its calculations are exact. Uriel showed me the heavenly lights, their paths, the appointed times, the years,[a] and the days. He also breathed on me. Uriel is the one to whom the Lord of all creation in the world gave a command concerning the host of heaven.[b]
  philosophy: optimal-equivalence
  footnotes:
