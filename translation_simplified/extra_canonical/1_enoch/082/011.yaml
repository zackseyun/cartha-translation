translation:
  language: en
  text: 'First, their four leaders enter. They divide the year into four parts. After them come the twelve leaders of the ordered groups, who divide the months. Then come the 364 heads of thousands, who mark out the days.[a] Four others are added to them: the leaders who mark out the four divisions of the years.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The number 364 reflects the schematic 364-day calendar used in this part of 1 Enoch.
    reason: cultural_note
