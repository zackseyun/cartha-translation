  preserved_meaning: The figures follow leaders within a structured cosmic order.
  reasoning_layer_used: lexical decisions for “follow after,” “leaders,” and “orders”
  rationale: Common wording clarifies the sequence without removing its ordered character.
- pob_phrase: leaders of the fixed stations, who divide the four parts of the year
