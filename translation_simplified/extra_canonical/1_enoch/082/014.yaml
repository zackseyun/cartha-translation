translation:
  language: en
  text: The ones who lead them are named Adnarel, Iyasusael, and Elomeel. These three come after the leaders of the ordered groups. There are also two who come after the leaders of the ordered groups, who come after all the leaders of the fixed positions that divide the year into four parts.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The exact relationship among these groups of leaders is uncertain because the middle clauses are difficult. This wording preserves their sequence without deciding the full hierarchy.
    reason: source_note
