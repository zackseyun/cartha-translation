translation:
  language: en
  text: These are the signs that mark the days appearing on earth during the days of his dominion:[a] heat, warmth, and calm weather.[b] All the trees bear fruit and put out leaves. There is a wheat harvest, the rose blossoms,[c] and every flower springs up in the field. But the trees of winter dry up.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “His dominion” probably means the ruling period of the luminary being discussed, but the verse does not identify it directly.
    reason: cross_reference
  - marker: b
    text: The word translated “calm” is uncertain and may describe gentle or pleasant weather.
    reason: lexical_alternative
  - marker: c
    text: “Rose” is the traditional identification, but the word may refer more generally to a flowering plant.
    reason: lexical_alternative
