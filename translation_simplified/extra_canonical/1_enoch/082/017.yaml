translation:
  language: en
  text: 'These are the names of the leaders who rank below them: Berkael, Zelbesael, and one more who is added—the leader over a thousand, whose name is Helyaseph.[a] The days of this one’s rule are completed.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Ge’ez wording is difficult and may describe an additional ranked leader added to the list.
    reason: textual_variant
