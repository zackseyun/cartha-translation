  simplified_phrase: the leaders who rank below them
  preserved_meaning: These leaders hold a subordinate place in an ordered hierarchy.
  reasoning_layer_used: lexical and theological decisions
  rationale: “Rank below” clarifies the hierarchy without identifying the leaders as angels.
- pob_phrase: another who is added, the head of a thousand
  simplified_phrase: one more who is added—the leader over a thousand
  preserved_meaning: An additional figure bears a title indicating authority over a thousand.
  reasoning_layer_used: lexical decision and textual-variant footnote
  rationale: The wording explains the title while preserving the source’s awkward relation between the added figure and the rank.
- pob_phrase: the days of the dominion of this one are completed
  simplified_phrase: The days of this one’s rule are completed
  preserved_meaning: The days belonging to this figure’s period of authority are completed.
  reasoning_layer_used: lexical decision and applied revision
  rationale: “Rule” is common English for dominion, while “are completed” retains the completed-result sense.
