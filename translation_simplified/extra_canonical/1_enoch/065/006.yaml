translation:
  language: en
  text: 'A command came from the Lord’s presence against those living on the dry land: their end was to come. This was because they knew all the angels’ hidden things, all the satans’[a] acts of violence, and all their secret powers.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Satans” is plural here, not the singular name “Satan.”
    reason: lexical_alternative
  - marker: b
    text: The final words in the Ethiopic text are difficult and may instead refer to people who practice hidden arts or sorcery.
    reason: textual_variant
