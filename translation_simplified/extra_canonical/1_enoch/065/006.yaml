  simplified_phrase: A command came from the Lord’s presence
  preserved_meaning: The authoritative command proceeds from God’s presence.
  reasoning_layer_used: lexical decision for the Semitic reverential formula
  rationale: “Came from the Lord’s presence” keeps the source image in more natural English.
- pob_phrase: those who dwell on the dry land
  simplified_phrase: those living on the dry land
  preserved_meaning: The judgment is directed against land-dwellers in the flood setting.
  reasoning_layer_used: lexical and theological decisions on dry-land imagery
  rationale: “Living” replaces the less common “dwell” without flattening the flood contrast.
- pob_phrase: all the violence of the satans
  simplified_phrase: all the satans’ acts of violence
  preserved_meaning: The plural satans are associated with violence and oppression.
  reasoning_layer_used: lexical and theological decisions on violence and the plural satans
  rationale: “Acts of violence” makes the relationship clear while retaining the plural demonological term.
