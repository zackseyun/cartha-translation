translation:
  language: en
  text: I said to him, “Tell me, what is happening on the earth? It is laboring[a] in distress and shaking like this. Perhaps[b] I will perish with it.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The difficult Ge‘ez verb may also be translated “suffering like a woman in labor.”
    reason: lexical_alternative
  - marker: b
    text: 'This may also be expressed as fear: “I fear that I may perish with it.”'
    reason: lexical_alternative
