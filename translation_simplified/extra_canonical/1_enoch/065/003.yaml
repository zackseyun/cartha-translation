  preserved_meaning: The speaker asks about the present event affecting the earth.
  reasoning_layer_used: lexical decision for ምንት ውእቱ ዘይትገበር and ዲበ ምድር
  rationale: The active wording replaces a difficult passive construction without making the event past.
- pob_phrase: For the earth has labored thus and has been shaken
  simplified_phrase: It is laboring in distress and shaking like this.
  preserved_meaning: The earth itself is pictured as suffering violent cosmic upheaval.
  reasoning_layer_used: lexical and theological decisions on the earth’s distress
  rationale: The rewrite keeps both the labor image and the shaking while making the personification easier to follow.
- pob_phrase: perhaps I will perish with it
  simplified_phrase: Perhaps I will perish with it.
  preserved_meaning: The speaker fears that he may share the earth’s fate.
  reasoning_layer_used: applied grammar revision for ዮጊ
  rationale: Keeping “perhaps” preserves apprehension without implying that the earth shakes for a purpose.
