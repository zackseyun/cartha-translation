translation:
  language: en
  text: When the hidden things of the righteous come to light,[a] sinners will be judged. The wicked will be driven out of the presence of the righteous and the chosen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “their secrets.” The wording does not say exactly what has been hidden.
    reason: lexical_alternative
  - marker: b
    text: Literally “driven away from the face of the righteous and the chosen,” a picture of being expelled from their presence.
    reason: source_note
