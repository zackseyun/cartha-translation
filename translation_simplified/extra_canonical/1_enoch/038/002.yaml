  text: When righteousness appears on the faces of the righteous—the chosen ones whose deeds hang upon the Lord of Spirits[a]—and when light appears to the righteous and the chosen who live on the dry land[b], where then will sinners live? Where will those who denied the Lord of Spirits find a place to rest? It would have been better for them if they had never been born.
