  preserved_meaning: The reader is urged to observe that the heavenly works follow fixed paths.
  reasoning_layer_used: Lexical decisions for “Consider,” “works,” and “do not alter their paths.”
  rationale: Two direct sentences preserve the plural heavenly works and paths while making the exhortation easy to follow.
- pob_phrase: how all of them rise and set in order, each in its season
  simplified_phrase: all rise and set in order, each in its own season
  preserved_meaning: Every heavenly light follows an orderly cycle at its proper time.
  reasoning_layer_used: Lexical decisions for “rise and set,” “in order,” and “each in its season.”
  rationale: The wording keeps the cosmic and calendrical imagery in natural English.
- pob_phrase: do not transgress their appointed order
  simplified_phrase: do not break the order appointed for them
  preserved_meaning: The heavenly lights do not violate the fixed order governing them.
  reasoning_layer_used: Theological decision preserving the judicial force of “transgress.”
  rationale: “Break the order” is clearer than “transgress” while retaining the force of violating a set rule.
