translation:
  language: en
  text: Look at the earth. Consider the works that take place on it from beginning to completion. As these works appear, understand that none of God’s works changes.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The wording may also refer collectively to all God’s works.
    reason: lexical_alternative
  - marker: b
    text: The final clause may also be understood as “while he shows this” or “as it is shown.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Look at the earth and understand concerning
  simplified_phrase: Look at the earth. Consider
  preserved_meaning: The reader is told to observe the earth and reflect on what happens there.
  reasoning_layer_used: Lexical decisions for ርእይዋ and ወለብዉ
  rationale: Two short commands clearly separate observation from reflection.
- pob_phrase: the works that are done upon it
  simplified_phrase: the works that take place on it
  preserved_meaning: The works remain the events and processes occurring on the earth.
  reasoning_layer_used: Lexical decision for ዘይትገበር ላዕሌሃ
  rationale: “Take place on it” replaces an awkward passive with natural English.
- pob_phrase: that none of the works of God changes, as they appear
  simplified_phrase: As these works appear, understand that none of God’s works changes
  preserved_meaning: Each observable work of God remains unchanged as it appears.
  reasoning_layer_used: Applied source revision and POB distributive main reading
  rationale: Reordering the clauses clarifies what appears while retaining the adjudicated reading and distributive force.
translation_notes:
  risk_flags:
  - risk: The claim could be mistaken for absolute immutability of every divine action.
    mitigation: The preceding focus on observable earthly works limits the statement to creation’s ordered course.
  - risk: The final Ge’ez clause has documented grammatical ambiguity.
    mitigation: The main text follows the adjudicated “appear” reading, while footnote b preserves the alternatives.
