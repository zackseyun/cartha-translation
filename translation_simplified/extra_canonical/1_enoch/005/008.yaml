simplification_decisions:
- pob_phrase: wisdom will be given to the chosen
  simplified_phrase: the chosen will receive wisdom
  preserved_meaning: Wisdom is a future gift received by the chosen, not something they attain by themselves.
  reasoning_layer_used: Lexical decisions for ይትወሀቦሙ and ለሕሩያን
  rationale: The active construction is easier to read while still presenting wisdom as a gift.
- pob_phrase: all these will live and will not again sin, whether through ungodliness or through pride
  simplified_phrase: All of them will live and never sin again, whether through ungodliness or pride
  preserved_meaning: The entire chosen group will live and cease all sin, including the specified sins of ungodliness and pride.
  reasoning_layer_used: Lexical decisions and theological decision on moral transformation
  rationale: Natural wording preserves both the broad promise and the two named kinds of sin.
- pob_phrase: but those who possess wisdom will be humble
  simplified_phrase: But those who have wisdom will be humble
  preserved_meaning: Those marked by wisdom will show humility in contrast to pride.
  reasoning_layer_used: Lexical decisions for አላ, ይገንዩ, and ዘቦሙ ጥበበ
  rationale: “Have” is more natural than “possess” without weakening the contrast.
