  text: In those days, your names will become an everlasting curse among all the righteous.[a] Sinners will curse you, and you will be joined with sinners.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Your names may become a formula people use when pronouncing curses. The wording may instead mean that the righteous will pronounce the curse directly on you.
    reason: alternative_reading
  - marker: b
    text: This may also mean that you will be counted among sinners or share their company.
    reason: alternative_reading
