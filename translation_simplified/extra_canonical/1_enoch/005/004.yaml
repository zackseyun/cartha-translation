- pob_phrase: you will have no peace
  rendering: you will have no peace, with a footnote explaining its breadth
  claim: Peace includes well-being and a favorable outcome, not merely inner calm.
  evidence:
  - The POB theological decision treats this as an apocalyptic judgment formula.
  - The POB cultural note gives peace this broader sense.
  confidence: high
  alternatives_preserved:
  - Inner tranquility remains within the term’s possible range.
