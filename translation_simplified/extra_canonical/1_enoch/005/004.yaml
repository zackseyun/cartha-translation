  preserved_meaning: They failed both to remain steadfast and to obey the Lord.
  reasoning_layer_used: POB lexical decisions for “endured” and “command”
  rationale: Two coordinated clauses clearly preserve both accusations.
- pob_phrase: you have transgressed
  simplified_phrase: you have turned away from him
  preserved_meaning: They morally departed from the Lord rather than merely moving away.
  reasoning_layer_used: POB lexical decision and rationale for ተዓደውክሙ
  rationale: This avoids an unsupported boundary image while clearly expressing moral defection.
- pob_phrase: Because of the hardness of your heart
  simplified_phrase: Because your hearts are hard and stubborn
  preserved_meaning: Their obstinate moral insensibility brings judgment.
  reasoning_layer_used: POB lexical rationale for ይቡሳነ ልብ
  rationale: The heart image remains, while “stubborn” explains it plainly.
