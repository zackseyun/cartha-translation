translation:
  language: en
  text: But you have not stood firm, and you have not obeyed the Lord’s command. Instead, you have turned away from him. With your unclean mouths, you have spoken proud and harsh words against his greatness. Because your hearts are hard and stubborn, you will have no peace.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “peace” includes well-being and a favorable outcome, not only inner calm.
    reason: cultural_note
