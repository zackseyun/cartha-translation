translation:
  language: en
  text: Again, while I was sleeping, I looked and saw heaven above. There before me, one star[a] fell from heaven. It rose, then ate and grazed among the cattle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In this vision, stars commonly represent heavenly beings, but the vision itself calls this figure a star.
    reason: cross_reference
