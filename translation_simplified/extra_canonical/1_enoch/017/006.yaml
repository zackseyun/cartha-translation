translation:
  language: en
  text: I saw great rivers and reached the edge of the great darkness. Then I went to a place where no flesh walks.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “No flesh” may mean no human being or no living creature.
    reason: lexical_alternative
  - marker: b
    text: The negative wording “no flesh walks” follows the corrected Ge'ez reading, which is also supported by the Greek witness.
    reason: textual_variant
