translation:
  language: en
  text: In the days of sinners, the years will be shortened. Their seed[a] will be delayed in their land and fields. All the works on earth will change and fail to appear at their proper times. Rain will be withheld, and heaven will hold back.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Seed” may mean either their offspring or the seed and produce of their fields.
    reason: lexical_alternative
