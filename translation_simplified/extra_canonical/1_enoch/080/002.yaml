  preserved_meaning: The age of sinners is marked by a disruption in the yearly cycle.
  reasoning_layer_used: Lexical decisions for “days,” “sinners,” “years,” and “shortened.”
  rationale: A separate sentence makes the apocalyptic statement easier to follow without weakening its imagery.
- pob_phrase: their seed shall be late upon their land and in their fields
  simplified_phrase: Their seed will be delayed in their land and fields.
  preserved_meaning: Their seed or offspring will not arrive at the expected time.
  reasoning_layer_used: Lexical and theological decisions preserving the ambiguity of “seed.”
  rationale: “Delayed in” is natural English, while “seed” and the footnote retain both possible senses.
- pob_phrase: all the works that are on the earth shall change and shall not appear in their times
  simplified_phrase: All the works on earth will change and fail to appear at their proper times.
  preserved_meaning: Earthly processes and products will be disrupted and mistimed.
  reasoning_layer_used: Applied revision preserving the plural “works” and “their times.”
  rationale: “Fail to appear” clearly states the result while retaining the plural timing motif.
