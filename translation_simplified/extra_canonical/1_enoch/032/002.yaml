translation:
  language: en
  text: From there I traveled above the peaks of those mountains, far to the east. I crossed the Erythraean Sea[a], traveled far away from it[b], and passed above the angel Zutel.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This ancient name may refer to a wider area than the modern Red Sea.
    reason: cultural_note
  - marker: b
    text: The Ethiopic wording is difficult; it appears to describe continued travel away from the sea.
    reason: textual_variant
  - marker: c
    text: The angel’s name is also written as Zutael in some editions and translations.
    reason: textual_variant
