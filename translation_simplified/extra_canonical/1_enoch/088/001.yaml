translation:
  language: en
  text: Then I saw one of the four who had come out first. He grabbed the first star—the one that had fallen from heaven—tied its hands and feet, and threw it into the abyss.[a] The abyss was narrow, deep, dreadful, and dark.
  philosophy: optimal-equivalence
  footnotes:
