  preserved_meaning: The heavenly source and concrete storehouse image remain intact.
  reasoning_layer_used: POB lexical decisions and applied revision
  rationale: The possessive form removes a heavy relative clause while preserving the cosmic image.
- pob_phrase: bring them down upon the earth
  simplified_phrase: send blessing down upon the earth
  preserved_meaning: Divine blessing descends from heaven to earth.
  reasoning_layer_used: Immediate context and POB blessing decision
  rationale: Naming blessing clarifies the plural pronoun while retaining the downward movement.
- pob_phrase: upon their work and upon their labor
  simplified_phrase: upon their work and hard labor
  preserved_meaning: The blessing reaches both human activity and strenuous effort.
  reasoning_layer_used: Applied revision correcting ፃማ as labor or toil
  rationale: Retaining “their” preserves the human relationship, while “hard labor” distinguishes toil from work generally.
