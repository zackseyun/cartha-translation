  preserved_meaning: The sheep feared the ram in his presence.
  reasoning_layer_used: Lexical decision for ፈርሁ እምገጹ
  rationale: The common English expression clearly identifies the ram as the cause of their fear.
- pob_phrase: made those sheep that had gone astray return
  simplified_phrase: made the straying sheep return
  preserved_meaning: The ram caused the sheep that had wandered away to come back.
  reasoning_layer_used: Lexical decisions for አግብኦሙ and እለ ስሕቱ
  rationale: The shorter wording preserves both their straying and the ram’s causative action.
