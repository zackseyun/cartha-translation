translation:
  language: en
  text: The ram took other sheep with him and confronted the sheep that had gone astray. He began to kill them.[a] The sheep were afraid of him. Then the ram made the straying sheep return, and they went back into their folds.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “he seized them to kill them”; the wording emphasizes the beginning of the violent action.
    reason: lexical_alternative
