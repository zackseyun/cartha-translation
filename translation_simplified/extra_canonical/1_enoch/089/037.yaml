  text: I watched until that sheep lay down[a]. It was the sheep that had met the sheep leading them. Then I watched as all the sheep, great and small, were roused where they were[b]. They entered the pasture and came near the stream of water.
  philosophy: optimal-equivalence
  footnotes:
