translation:
  language: en
  text: A sheep that had been rescued from the wolves fled into the region or company of the wild donkeys in the wilderness.[a] Then I saw the sheep mourning, crying out, and pleading with their Lord with all their strength. At last, the Lord of the sheep came down from his lofty dwelling in response to their cries. He came to them and saw them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The wording is difficult and may refer to the region or the company of the wild donkeys.
    reason: textual_variant
simplification_decisions:
- pob_phrase: passed into the wild asses of the wilderness
  simplified_phrase: fled into the region or company of the wild donkeys in the wilderness
  preserved_meaning: The sheep moves toward another animal group, while the uncertain relation to that group remains open.
  reasoning_layer_used: POB lexical decision and textual-variant footnote
  rationale: The paired options preserve the ambiguity without favoring a geographic reading.
- pob_phrase: lamented and cried out and petitioned their Lord
  simplified_phrase: mourning, crying out, and pleading with their Lord
  preserved_meaning: The sheep grieve aloud and urgently appeal to their divine Lord.
  reasoning_layer_used: POB lexical decisions
  rationale: Common wording keeps all three distinct actions and their intensity.
- pob_phrase: until that Lord of the sheep came down at the voice of the sheep from his lofty dwelling
  simplified_phrase: At last, the Lord of the sheep came down from his lofty dwelling in response to their cries
  preserved_meaning: The divine Lord descends from above because of the sheep’s urgent appeal.
  reasoning_layer_used: Applied revisions, POB lexical decisions, and theological decision
  rationale: The reordered sentence clarifies the response and descent while preserving the divine title and vertical image.
interpretive_expansions:
- pob_phrase: at the voice of the sheep
  rendering: in response to their cries
  claim: The Lord’s descent answers the sheep’s audible appeal.
  evidence:
  - The immediate context says the sheep cry out and plead until the Lord descends.
  - The POB rationale reads the compressed clause as a divine response to their voice.
  confidence: moderate
  alternatives_preserved:
  - at the voice of the sheep
