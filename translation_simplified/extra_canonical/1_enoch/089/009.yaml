translation:
  language: en
  text: The white bull that had become a man came out from there.[a] Three bulls came with him. One was white and was like the white bull. Another was red like blood, and the third was black. Then the white bull left them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The word referring to the place is textually uncertain, but the clause clearly says that he came out from a place.
    reason: textual_variant
