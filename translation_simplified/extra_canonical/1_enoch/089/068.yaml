  preserved_meaning: The wild beasts receive the sheep in order to destroy them.
  reasoning_layer_used: Lexical decision for ከመ ይብልዕዎሙ
  rationale: Naming the beasts removes pronoun confusion while preserving the violent animal image.
- pob_phrase: all of them, each in its time, was delivered over by number
  simplified_phrase: They were handed over at their appointed times and counted
  preserved_meaning: The sheep were handed over according to an allotted sequence and numerical reckoning.
  reasoning_layer_used: Lexical decisions for በጊዜሁ, በኍልቍ, and ይትሜጠው
  rationale: The collective wording avoids claiming that every sheep was handed over separately.
- pob_phrase: while the record of the others was written down in the book, how many were destroyed from among them
  simplified_phrase: The book recorded how many of the others were destroyed
  preserved_meaning: The book contains the numerical record of the remaining sheep who were destroyed.
  reasoning_layer_used: Lexical decisions for the written record and numerical losses
  rationale: An active sentence makes the content of the record immediately clear.
