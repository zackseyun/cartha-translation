translation:
  language: en
  text: The shepherds and their companions handed those sheep over to all the wild beasts of the desert, so the beasts could devour them. They were handed over at their appointed times and counted—sixty from among them.[a] The book recorded how many of the others were destroyed.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The number “sixty” is uncertain because the surviving wording and its accounting language are difficult, but the sheep are clearly counted and their destruction recorded.
    reason: textual_variant
