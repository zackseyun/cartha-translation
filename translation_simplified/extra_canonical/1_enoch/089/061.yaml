translation:
  language: en
  text: Then he called out to another and said to him, “Pay close attention and see everything the shepherds are doing to these sheep. They are destroying more within the flock than I commanded them.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “They are destroying more from among them than I commanded.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And he called to another and said to him
  simplified_phrase: Then he called out to another and said to him
  preserved_meaning: The speaker addresses another figure rather than summoning one.
  reasoning_layer_used: Lexical decision for ለካልእ and narrative context
  rationale: “Called out to” expresses directed speech clearly without identifying the figure more precisely.
- pob_phrase: Take note and see all that
  simplified_phrase: Pay close attention and see everything
  preserved_meaning: The addressee must attend carefully and personally observe the whole situation.
  reasoning_layer_used: Lexical decisions for ለቡ, ወርኢ, and ኵሎ
  rationale: The wording keeps both the command to focus and the concrete command to see.
- pob_phrase: they are destroying among them more than I commanded them
  simplified_phrase: They are destroying more within the flock than I commanded them
  preserved_meaning: The shepherds directly destroy sheep beyond the limited authority given to them.
  reasoning_layer_used: Theological decision and lexical decisions for ያሐጕሉ and the comparative phrase
  rationale: The direct verb and repeated pronoun preserve both their culpability and the command they exceeded.
translation_notes:
  risk_flags:
  - risk: “Within the flock” may suggest location rather than sheep being removed from the flock.
    mitigation: The footnote preserves the source phrase’s possible partitive force.
