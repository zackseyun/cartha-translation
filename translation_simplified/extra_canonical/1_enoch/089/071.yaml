  text: The book was read in the presence of the Lord of the sheep.[a] Then the Lord took it from the hand that held it.[b] He read it, sealed it, and set it down.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: An earlier reading took the verb as “was opened,” but the latest source review identifies it as “was read.”
    reason: lexical_alternative
  - marker: b
    text: The text does not identify whose hand was holding the book.
    reason: alternative_reading
