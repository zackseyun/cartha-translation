translation:
  language: en
  text: He summoned seventy shepherds and put those sheep in their care so they could lead them to pasture. Then he told the shepherds and their companions,[a] “From now on, each of you must lead the sheep to pasture and do everything I command you.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The word translated “companions” is uncertain; it probably means those associated with the shepherds.
    reason: lexical_alternative
