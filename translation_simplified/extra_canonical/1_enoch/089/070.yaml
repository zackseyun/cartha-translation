translation:
  language: en
  text: In the vision I saw the one who kept the record writing down, day by day, everyone whom those shepherds destroyed. Then he brought the whole book up to the Lord of the sheep, laid it before him, and showed him the record of everything they had done—everything each shepherd had removed[a] and everything they had handed over to destruction.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Ethiopic word is difficult and may mean what each shepherd removed or caused to disappear from the flock.
    reason: lexical_alternative
