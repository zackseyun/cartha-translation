translation:
  language: en
  text: That channel of water split apart. The water stood on both sides in front of them. As their lord[a] led them, he stood between them and the wolves.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In the vision, “their lord” may refer to the flock’s leader rather than directly to God.
    reason: source_note
