  preserved_meaning: A bounded course of water was vividly divided in the vision.
  reasoning_layer_used: POB lexical decisions for ዐይገ ማይ and ተሠጠ
  rationale: “Channel of water” follows the lexical evidence, while “split apart” keeps the force of the division.
- pob_phrase: the water stood on this side and on that side before their faces
  simplified_phrase: The water stood on both sides in front of them
  preserved_meaning: The divided water remained standing on each side before the flock.
  reasoning_layer_used: POB lexical decisions for the standing water and spatial expressions
  rationale: “Both sides” and “in front of them” present the same scene in ordinary English.
- pob_phrase: their Lord, while he was leading them, stood between them and the wolves
