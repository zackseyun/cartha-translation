translation:
  language: en
  text: At the Lord’s command, one sheep went to the wolves. Another sheep met him and went with him. Together they entered the wolves’ assembly. They spoke to the wolves and made them listen:[a] from then on, they were not to ravage the sheep.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The expression may also mean that they made themselves heard before the wolves.
    reason: lexical_alternative
