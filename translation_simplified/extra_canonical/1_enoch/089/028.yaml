  text: But the sheep left that water and entered a wilderness with no water or grass. They began to open their eyes and see.[a] I saw the Lord of the sheep acting as their shepherd and giving them water and grass. I also saw that sheep moving along and leading them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Opening their eyes may picture a new awareness or understanding, but the vision presents it as something the sheep do.
