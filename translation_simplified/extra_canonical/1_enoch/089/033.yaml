translation:
  language: en
  text: The Lord of the sheep became extremely angry with them. That sheep realized this and came down from the top of the rock.[a] It went to the sheep and found most of them with blinded eyes,[b] along with sheep that had gone astray.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The syntax is difficult; some understand the Lord or another figure as the one who came down.
    reason: alternative_reading
  - marker: b
    text: “Blinded” may also mean that their eyes were darkened or dimmed.
    reason: lexical_alternative
