translation:
  language: en
  text: The sheep grew and multiplied. All the dogs, foxes,[a] and wild boars from the open country became afraid of them and ran away. The ram gored and killed all the beasts. After that, the beasts could no longer be among the sheep, and they did not carry off anything from them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The animal called “foxes” may instead have been jackals or similar scavengers.
    reason: lexical_alternative
