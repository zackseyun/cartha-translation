translation:
  language: en
  text: The scribe recorded all the shepherds’ excesses and all the destruction they caused. He wrote down how many they destroyed at my command and how many they destroyed on their own responsibility.[a] Every act of destruction by the seventy shepherds was recorded against them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “on their own heads”; this may mean that they acted on their own or that the responsibility rested on them.
    reason: lexical_alternative
