translation:
  language: en
  text: They began to gore one another.[a] The white bull born among them fathered a wild donkey, together with a white bull.[b] Then the wild donkeys multiplied.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The opening verb is textually difficult; it probably pictures the animals violently attacking one another by goring.
    reason: textual_variant
  - marker: b
    text: The animal term is uncertain. It may mean wild donkeys or asses, but it may instead refer to young cattle of the open country.
    reason: lexical_alternative
