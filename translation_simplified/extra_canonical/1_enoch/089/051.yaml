translation:
  language: en
  text: Again I saw those sheep go astray. They walked along many paths and abandoned the house of their Lord.[a] Then the Lord of the sheep called some sheep out from among them and sent them to the flock. But the sheep began to kill those he sent.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “their master”; “Lord” reflects God’s role as ruler of the flock in the vision.
    reason: lexical_alternative
  - marker: b
    text: This may also mean, “But the sheep seized them in order to kill them.”
    reason: lexical_alternative
