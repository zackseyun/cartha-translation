  preserved_meaning: The sheep stray morally while the vision retains the image of many paths.
  reasoning_layer_used: Lexical decisions for the visionary formula, straying, and paths
  rationale: Two short sentences replace the dense clause without flattening its imagery.
- pob_phrase: called some from among the sheep
  simplified_phrase: called some sheep out from among them
  preserved_meaning: The Lord selects members from within the same flock.
  reasoning_layer_used: Lexical decision on selection from within the flock
  rationale: Naming sheep as the object makes the selection clear in ordinary English.
- pob_phrase: the sheep began to kill them
  simplified_phrase: the sheep began to kill those he sent
  preserved_meaning: The flock turns violently against the commissioned sheep.
  reasoning_layer_used: Lexical decision on the hostile final clause
  rationale: The clearer pronoun reference preserves the chosen reading and hostile turn.
