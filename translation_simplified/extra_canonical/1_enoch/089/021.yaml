translation:
  language: en
  text: I watched the sheep until they came out from among the wolves. The wolves’ eyes were blinded. Then those wolves went out after the sheep with all their strength.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The compact Ge’ez wording may describe the movement of both groups less explicitly, but the wolves are best understood as the ones going after the sheep.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: And I saw the sheep until they came out from the wolves
  simplified_phrase: I watched the sheep until they came out from among the wolves.
  preserved_meaning: Enoch observes the sheep emerging from the wolves’ presence.
  reasoning_layer_used: lexical decisions
  rationale: “Watched” suits an action continuing until the sheep emerge, while “among” clarifies their location.
- pob_phrase: and the eyes of the wolves were blinded
  simplified_phrase: The wolves’ eyes were blinded.
  preserved_meaning: The concrete image of the wolves losing sight remains passive.
  reasoning_layer_used: theological decision and grammatical revision
  rationale: A separate sentence preserves the apocalyptic image without making the wolves its agents.
- pob_phrase: and those wolves went out following the sheep with all their power
  simplified_phrase: Then those wolves went out after the sheep with all their strength.
  preserved_meaning: The wolves move forcefully after the sheep in the predator-and-prey scene.
  reasoning_layer_used: lexical decisions and grounding review
  rationale: “Went out after” conveys hostile pursuit without adding a specific form of attack.
interpretive_expansions:
- pob_phrase: following the sheep
  rendering: after the sheep
  claim: The wolves’ movement toward the sheep is hostile rather than neutral.
  evidence:
  - The immediate scene presents wolves acting against sheep.
  - The phrase “with all their power” gives the movement forceful intensity.
  - The POB lexical rationale identifies hostile pursuit as the contextual sense.
  confidence: high
  alternatives_preserved:
  - The footnote preserves the less explicit movement sequence.
