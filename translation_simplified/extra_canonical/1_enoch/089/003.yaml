translation:
  language: en
  text: Again I saw—and behold—springs opened in the land within that great enclosure. Water bubbled up and rose over the land, and the enclosure appeared[a] until all its land was covered with water.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The wording is difficult; it may mean that the enclosure came into view or that the whole scene was revealed.
    reason: alternative_reading
  - marker: b
    text: “All its land” may also be understood as “all the earth.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: And again I saw, and behold
  simplified_phrase: Again I saw—and behold—
  preserved_meaning: The words introduce a new and striking part of the vision.
  reasoning_layer_used: Applied revision preserving the Ge'ez visionary formula.
  rationale: The shorter phrasing keeps the force of the vision marker.
- pob_phrase: springs were opened upon the earth in that great enclosure
  simplified_phrase: springs opened in the land within that great enclosure
  preserved_meaning: Natural water sources opened inside the bounded symbolic land.
  reasoning_layer_used: Lexical decisions for “springs,” “were opened,” and “great enclosure.”
  rationale: Natural English clarifies the location while leaving the cause unstated.
- pob_phrase: that water was bubbling up and rising over the earth ... until all its land was covered with water
  simplified_phrase: Water bubbled up and rose over the land ... until all its land was covered with water
  preserved_meaning: Rising water eventually covered the whole enclosed land.
  reasoning_layer_used: Lexical decisions and the theological decision on flood scope.
  rationale: Two direct sentences clarify the sequence without making the flood explicitly universal.
