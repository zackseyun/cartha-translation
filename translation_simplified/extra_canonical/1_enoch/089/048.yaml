translation:
  language: en
  text: The later ram rose and led the sheep. It fathered many sheep and then lay down.[a] A little sheep[b] took its place and became a ram, the ruler and leader of those sheep.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In this vision, “lay down” likely means that the ram died, but the wording preserves the vision’s image.
    reason: lexical_alternative
  - marker: b
    text: “Little” may mean either small or young.
    reason: lexical_alternative
