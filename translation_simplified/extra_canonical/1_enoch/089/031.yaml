translation:
  language: en
  text: All of them were afraid and trembled before him. They pleaded with him[a] for the ram that was with them,[b] because it could not stand before our Lord and look at him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The difficult phrase translated “pleaded with him” may instead mean that they cried out after him or sought him concerning the ram.
    reason: lexical_alternative
  - marker: b
    text: Some manuscripts add “in their midst.”
    reason: textual_variant
