translation:
  language: en
  text: I watched as they gradually grew quiet after their outcry for that sheep. Then they crossed the stream. The other two sheep, who had been leading them, stood in the place of those who had lain down.[a] Then they led the sheep.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The wording in this clause is difficult. It may instead mean that the leading sheep placed, stationed, or gathered those who had lain down. “Lain down” may also mean “fallen down”; the wording does not explain why they were down.
    reason: textual_variant
