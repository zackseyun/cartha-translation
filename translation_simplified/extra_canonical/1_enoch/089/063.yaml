translation:
  language: en
  text: Read aloud before me the number of those they destroy and of those they hand over to destruction,[a] so that this testimony may stand against them and I may know all the shepherds’ deeds, assess them, and see whether they obey my command—the command I gave them—or not.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Ethiopic opening is difficult; an older reading describes a tally of the shepherds and those they destroyed rather than a command to read the numbers aloud.
    reason: textual_variant
