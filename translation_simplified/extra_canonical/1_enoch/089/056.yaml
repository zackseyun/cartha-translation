translation:
  language: en
  text: I saw that he abandoned their house, their tower, and everyone dear to them to the lions, so that they might tear them apart, and to all the wild beasts, so that they might devour them.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The house and tower are images within the vision; their symbolic meaning is not explained here.
    reason: cultural_note
  - marker: b
    text: Or the lions and wild beasts may together be described as tearing them apart and devouring them.
    reason: alternative_reading
