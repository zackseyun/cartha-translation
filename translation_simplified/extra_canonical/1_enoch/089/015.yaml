  text: The wolves began to terrify and oppress the sheep. They continued until they destroyed the sheep’s little ones and threw them into a stream with abundant water. Then those sheep cried out in grief over their little ones and lamented before their Lord.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Their Lord” could also be translated “their master,” but here it most likely refers to God.
    reason: alternative_reading
