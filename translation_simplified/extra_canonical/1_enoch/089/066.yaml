translation:
  language: en
  text: The lions and leopards[a] devoured and swallowed up most of the sheep. The wild boars of the desert ate with them, and they burned the tower and tore down the house.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The exact kind of large cat is uncertain; “panthers” is also possible.
    reason: lexical_alternative
  - marker: b
    text: In this vision, the house likely symbolizes the sanctuary or temple.
    reason: cultural_note
