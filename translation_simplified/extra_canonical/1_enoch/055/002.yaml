  preserved_meaning: The oath declares that the previous action will not continue or be repeated.
  reasoning_layer_used: lexical decision for እምይእዜ and ኢይገብር ከመዝ
  rationale: Direct speech and common wording make the declaration easier to follow without naming the action.
- pob_phrase: all who dwell upon the dry land
  simplified_phrase: all who live on the dry land
  preserved_meaning: The specific flood-related image of dry land remains intact.
  reasoning_layer_used: lexical decision for ለኵሎሙ እለ ይነብሩ ዲበ የብስ
  rationale: “Live” is more natural than “dwell,” while “dry land” preserves the source image.
- pob_phrase: for as long as the days of heaven are upon the earth; and this is by my command
  simplified_phrase: as long as the days of heaven continue over the earth. I command this.
  preserved_meaning: The poetic duration formula and divine authority are both retained.
  reasoning_layer_used: lexical decisions for the duration formula and closing command
  rationale: The long closing clause becomes two clear sentences without reducing the formula to only “forever.”
