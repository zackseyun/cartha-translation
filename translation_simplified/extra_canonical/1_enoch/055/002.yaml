translation:
  language: en
  text: He swore by his great name, “From now on, I will no longer do this to all who live on the dry land. I will place a sign in the heavens,[a] and it will be a pledge of faithfulness between me and them[b] forever—as long as the days of heaven continue over the earth. I command this.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may echo the sign given after the flood, but the verse does not identify the sign.
    reason: cross_reference
  - marker: b
    text: The phrase may also mean “faithfulness” or, in this context, a covenantal pledge.
    reason: lexical_alternative
