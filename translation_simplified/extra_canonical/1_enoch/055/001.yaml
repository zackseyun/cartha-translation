translation:
  language: en
  text: After this, the Head of Days relented.[a] He said, “I destroyed everyone living on the dry land, but it was all for nothing.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “changed his mind” or “repented.” With the Head of Days as the subject, this word does not necessarily imply moral wrongdoing.
    reason: lexical_alternative
