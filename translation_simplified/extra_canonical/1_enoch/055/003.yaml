  simplified_phrase: hand them over into the hand of the angels
  preserved_meaning: God gives the judged into the angels’ power while preserving the singular judicial image of the hand.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: “Hand them over” is common English, while “into the hand” retains the source-supported image.
- pob_phrase: on the day of tribulation and pain
  simplified_phrase: on the day of suffering and pain
  preserved_meaning: The day brings both severe affliction and experienced pain.
  reasoning_layer_used: POB lexical decision
  rationale: “Suffering” is clearer than “tribulation” without weakening the severity.
- pob_phrase: cause my punishment and my wrath to abide upon them
  simplified_phrase: make my punishment and wrath remain upon them
  preserved_meaning: God’s punitive anger settles upon them and continues there.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: “Remain” expresses continuing judgment in common English.
