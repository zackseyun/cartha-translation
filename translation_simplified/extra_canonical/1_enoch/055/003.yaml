translation:
  language: en
  text: “When I desired to hand them over into the hand of the angels on the day of suffering and pain,[a] I will make my punishment and wrath remain upon them,” says God, the Lord of spirits.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Ge’ez wording is difficult here, but it appears to move from being handed over to angels to God’s judgment remaining upon them.
    reason: textual_variant
