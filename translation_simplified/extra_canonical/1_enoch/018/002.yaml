translation:
  language: en
  text: I saw the earth’s cornerstones,[a] and I saw the four winds[b] that hold up the earth and the vault of heaven.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the stones at the earth’s corners”; the vision pictures the earth as a great structure.
    reason: lexical_alternative
  - marker: b
    text: The word for “winds” can also mean “spirits” or “breaths,” but this cosmic setting favors “winds.”
    reason: lexical_alternative
  - marker: c
    text: The “vault of heaven” is the ancient image of the sky as a structured expanse above the earth.
    reason: cultural_note
