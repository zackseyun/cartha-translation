translation:
  language: en
  text: Once more I raised my eyes toward heaven. In a vision I saw beings coming out of heaven. Their appearance was like that of white men.[a] Four came out from that place, and three were with them.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “they looked like white human figures.” The verse describes their appearance but does not identify them as angels.
    reason: lexical_alternative
  - marker: b
    text: The wording is abrupt. It may describe seven beings in all, but the verse does not state the total directly.
    reason: textual_variant
