  preserved_meaning: Enoch again directs his eyes toward heaven.
  reasoning_layer_used: Lexical decisions for “again,” “lifted up,” and “to heaven.”
  rationale: The sentence preserves the repeated visionary action in natural modern English.
- pob_phrase: and I saw in a vision—and behold, there came out from heaven
  simplified_phrase: In a vision I saw beings coming out of heaven.
  preserved_meaning: The sight is explicitly visionary, and the beings emerge from heaven.
  reasoning_layer_used: Lexical decisions for visionary framing, immediacy, and emergence.
