  text: And I heard Michael reply, “The judgment passed on the angels is evidence[a] against the kings and powerful people who possess the dry land.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a witness against.” The word can refer either to testimony or to a witness in a legal setting.
    reason: lexical_alternative
  - marker: b
    text: “The dry land” may mean the inhabited land under human rule, not necessarily the whole earth.
    reason: lexical_alternative
