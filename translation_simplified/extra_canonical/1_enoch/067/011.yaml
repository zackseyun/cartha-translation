translation:
  language: en
  text: In those days, the waters themselves will change. When those angels are judged in those waters, these springs will change. When the angels go up[a], the water from the springs will change and grow cold.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Go up” is literal; the angels’ exact movement in relation to the springs is uncertain.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: will be changed in those days
  simplified_phrase: In those days, the waters themselves will change
  preserved_meaning: The waters, emphasized as the subject, undergo a change at that time.
  reasoning_layer_used: Lexical decision for ኪያሁ and the change-state verb
  rationale: The active English wording is clearer while preserving the waters’ change of state.
- pob_phrase: for when those angels are judged in those waters, these springs of water will change
  simplified_phrase: When those angels are judged in those waters, these springs will change
  preserved_meaning: The springs change in connection with the angels being judged in those waters.
  reasoning_layer_used: Applied revision and theological decision on angelic judgment
  rationale: A separate sentence clarifies the link without claiming how the judgment changes the springs.
- pob_phrase: when the angels ascend ... that water of the springs will change and grow cold
  simplified_phrase: When the angels go up ... the water from the springs will change and grow cold
  preserved_meaning: The angels move upward, and the spring water changes and becomes cold.
  reasoning_layer_used: Lexical decisions for የዐርጉ and ይቈርሩ
  rationale: “Go up” and “water from the springs” express the same image in ordinary English.
