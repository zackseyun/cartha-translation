  preserved_meaning: The same waters serve bodily healing and spiritual punishment without resolving that tension.
  reasoning_layer_used: POB translation and theological decision
  rationale: Active wording makes the two effects clear while keeping body and spirit distinct.
- pob_phrase: the kings and the mighty and the exalted
  simplified_phrase: kings, the powerful, those of high rank
  preserved_meaning: The three groups of socially elevated people remain distinct.
  reasoning_layer_used: POB lexical decision
