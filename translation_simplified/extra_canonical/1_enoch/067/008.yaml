translation:
  language: en
  text: In those days, those waters will bring healing to the bodies and punishment to the spirits of kings, the powerful, those of high rank, and those who live on dry land. Their spirits will be full of pleasure,[a] so that their bodies may be judged because they have denied the Lord of Spirits. They see their judgment every day, yet they do not believe in his name.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The word translated “pleasure” is difficult here; it may also mean “delight,” though the surrounding context concerns judgment.
    reason: textual_variant
