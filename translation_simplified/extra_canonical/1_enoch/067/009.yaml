  text: As their bodies burn fiercely, they undergo a change in spirit that lasts forever and ever.[a] For before the Lord of Spirits, no one speaks a meaningless word.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The difficult Ethiopic may also mean, “there is for them a change of spirit forever and ever.”
    reason: alternative_reading
  - marker: b
    text: Or, “no one can speak a word against them.” This alternative has a judicial or adversarial sense, and “them” remains unspecified.
    reason: lexical_alternative
