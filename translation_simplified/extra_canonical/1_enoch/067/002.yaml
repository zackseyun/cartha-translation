translation:
  language: en
  text: The angels are now making something out of wood.[a] When they finish it, I will place my hand on it and protect it.[a] The seed of life will come from it,[b] and a change will take place, so that the dry ground will not remain barren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Ge'ez wording is difficult. It may refer to woodwork, wooden objects, or a wooden structure. The clause about placing “my hand” on it may instead mean that the angels will place the speaker's hands on it and guard it.
    reason: textual_variant
  - marker: b
    text: “Seed of life” may refer to life-giving offspring, the power to produce life, or renewed fertility.
    reason: lexical_alternative
