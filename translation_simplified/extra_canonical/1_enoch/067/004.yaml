translation:
  language: en
  text: In that burning valley, they bound the angels who had made lawlessness known. My grandfather Enoch had shown me this valley before. It was in the west,[a] near the mountains of gold, silver, iron, soft metal,[b] and lead.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “toward the west.” The word can also mean “at evening,” but the surrounding landmarks favor a western location.
    reason: lexical_alternative
  - marker: b
    text: The exact metal is uncertain; it may be tin, electrum, or another refined or soft metal.
    reason: lexical_alternative
