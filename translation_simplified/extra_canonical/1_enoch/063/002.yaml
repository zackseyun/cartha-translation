  language: en
  text: They will bless the Lord of spirits and praise him. They will say, “Blessed is the Lord of spirits—the Lord of the kings, and the Lord of the mighty, and the Lord of the rich,[a] and the Lord of glory, and the Lord of wisdom.”[b]
  philosophy: optimal-equivalence
  footnotes:
