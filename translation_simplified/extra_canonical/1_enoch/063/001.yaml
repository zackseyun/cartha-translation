translation:
  language: en
  text: In those days, the powerful and the kings who control the dry land[a] will beg the angels who carry out punishment and hold them in custody[b] to grant them a brief respite, so that they may fall down and worship before the Lord of Spirits and confess their sins before him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “The dry land” means the earth or land under their rule.
    reason: lexical_alternative
  - marker: b
    text: The Ethiopic wording is difficult, but it appears to mean that the angels have custody of these condemned rulers.
    reason: textual_variant
simplification_decisions:
- pob_phrase: the mighty ones and the kings who possess the dry land
  simplified_phrase: the powerful and the kings who control the dry land
  preserved_meaning: Powerful earthly figures and kings exercise dominion over the land.
  reasoning_layer_used: The lexical decisions identify the mighty ones as political magnates and possession as territorial dominion.
  rationale: “Powerful” and “control” state the political sense clearly while retaining the dry-land image.
- pob_phrase: the angels of punishment, into whose hands they have been delivered
  simplified_phrase: the angels who carry out punishment and hold them in custody
  preserved_meaning: The rulers have been handed over to punishing angels who have charge of them.
  reasoning_layer_used: The lexical rationale reads the difficult clause as custody in a judicial setting.
  rationale: Active wording explains the idiom while the footnote preserves the textual uncertainty.
- pob_phrase: give them a little respite, so that they may fall down and worship
  simplified_phrase: grant them a brief respite, so that they may fall down and worship
  preserved_meaning: They seek limited relief in order to prostrate themselves in worship.
  reasoning_layer_used: The lexical decisions define the respite as temporary and preserve bodily submission.
  rationale: “Brief respite” clearly conveys limited relief without weakening the purpose relation.
translation_notes:
  risk_flags:
  - risk: “Control the dry land” may sound limited to arid territory.
    mitigation: Footnote a explains that the image refers to the earth or land under their rule.
  - risk: The confession may be read as accepted repentance or coerced submission.
    mitigation: The text reports their intended confession without claiming sincerity, acceptance, or release.
