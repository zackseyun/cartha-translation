translation:
  language: en
  text: 'You saw those mountains: one of iron, one of copper, one of silver, one of gold, one of soft metal,[a] and one of lead. Before the Chosen One,[b] they will all be like wax before a fire and like water running down from above over the mountains. At his feet they will lose their strength.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The exact kind of soft metal is uncertain; it may be tin or another softer metal.
    reason: lexical_alternative
  - marker: b
    text: Or “the Elect One,” an important title in this part of 1 Enoch.
    reason: lexical_alternative
