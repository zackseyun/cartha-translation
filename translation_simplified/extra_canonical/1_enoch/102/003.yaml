translation:
  language: en
  text: All the angels will carry out their commands. They will try to hide from the presence of the Great Glory.[a] The people of the earth will tremble and be overwhelmed with confusion. But you sinners will remain under a curse forever. You will have no peace.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Great Glory” is a reverential expression that likely refers to divine majesty or presence, though it could refer more generally to heavenly splendor or the glory of the heavenly court.
    reason: source_note
simplification_decisions:
- pob_phrase: will seek to hide themselves from before the Great Glory
  simplified_phrase: will try to hide from the presence of the Great Glory
  preserved_meaning: The angels attempt to conceal themselves before overwhelming majesty.
  reasoning_layer_used: Lexical and theological decisions on the Semitic presence idiom and the title
  rationale: “Try” and “presence” state the idiom naturally while retaining the ambiguous title.
- pob_phrase: the children of the earth will tremble and be thrown into confusion
  simplified_phrase: The people of the earth will tremble and be overwhelmed with confusion
  preserved_meaning: Earth’s inhabitants react with bodily fear and disorienting turmoil.
  reasoning_layer_used: Lexical decisions for the filial idiom, trembling, and confusion
  rationale: “People of the earth” prevents readers from mistaking the phrase for literal children.
- pob_phrase: you sinners are accursed forever, and there will be no peace for you
  simplified_phrase: you sinners will remain under a curse forever. You will have no peace
  preserved_meaning: Sinners face an enduring curse and are denied peace.
  reasoning_layer_used: Lexical decisions for the curse formula and denial of peace
  rationale: Two direct sentences clarify the judgment without weakening its permanence.
