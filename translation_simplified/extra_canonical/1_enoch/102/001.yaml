translation:
  language: en
  text: In those days, if a fierce fire comes down on you, where can you run? Where can you find rescue? When he raises his voice against you,[a] you will surely be shaken and afraid.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “When he sends forth his word against you”; in this judgment setting, “word” may mean a decree or sentence.
    reason: lexical_alternative
