translation:
  language: en
  text: Do not grieve if your soul has gone down in sorrow to Sheol[a] and your flesh did not receive what was fitting for your goodness during your life.[b] Instead, wait for the day when sinners will be judged—the day of curse and punishment.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sheol is the realm of the dead, not necessarily what later Christians mean by hell.
    reason: cultural_note
  - marker: b
    text: The original does not state exactly what was not received. It means that, in this life, they did not receive something fitting for their goodness.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: your flesh did not fare according to your goodness during your life
  simplified_phrase: your flesh did not receive what was fitting for your goodness during your life
  preserved_meaning: The person's embodied life lacked something corresponding to their goodness, though the exact object remains unstated.
  reasoning_layer_used: lexical and theological decisions
  rationale: This wording clarifies the incomplete clause without turning fitting recompense into a firm claim about merit or reward.
- pob_phrase: the day of the judgment of sinners
  simplified_phrase: the day when sinners will be judged
  preserved_meaning: A future day of judgment is directed against sinners.
  reasoning_layer_used: lexical decision
  rationale: A direct clause expresses the apocalyptic judgment formula in ordinary English.
- pob_phrase: but wait
  simplified_phrase: Instead, wait
  preserved_meaning: The hearers must turn from grief toward steadfast expectation of future judgment.
  reasoning_layer_used: lexical rationale and immediate context
  rationale: “Instead” makes the contrast between present deprivation and future judgment clear.
interpretive_expansions:
- pob_phrase: did not fare according to your goodness
  rendering: did not receive what was fitting for your goodness
  claim: The clause refers to something corresponding to their goodness that was not received during earthly life.
  evidence:
  - The verb can mean “receive,” but its object is unstated.
  - The context contrasts present deprivation with future judgment.
  - The POB theological decision identifies unrecompensed goodness as the likely sense.
  confidence: moderate
  alternatives_preserved:
  - The exact thing not received remains unnamed.
  - The wording does not specify a reward or assert strict merit.
translation_notes:
  risk_flags:
  - risk: “What was fitting” makes the implied relationship to goodness more explicit than the source grammar alone does.
    mitigation: The footnote states that the object is unstated, and the text avoids “deserved” or “reward.”
  - risk: Using “receive” may still sound incomplete or abstract to some readers.
    mitigation: The bounded phrase “what was fitting” supplies readable English while preserving the source's openness.
