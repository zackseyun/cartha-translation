translation:
  language: en
  text: 'And these are the names of those angels.[a] Their names are: first, Semyaza; second, Artaqifa; third, Armen; fourth, Kokabel; fifth, Turiel; sixth, Rumyal; seventh, Daniyal; eighth, Neqael; ninth, Baraqel; tenth, Azazel; eleventh, Armaros; twelfth, Batariel; thirteenth, Basasael; fourteenth, Hananel; fifteenth, Turiel; sixteenth, Simipesiel; seventeenth, Yeterel; eighteenth, Tumael; nineteenth, Turiel;[b] twentieth, Teremael; and twenty-first, Te''azazel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The spelling of several names is uncertain because this passage survives mainly in Ge'ez and the available text is uneven; the names here follow the visible Ge'ez forms rather than familiar spellings from other traditions.
    reason: textual_variant
  - marker: b
    text: Turiel occurs more than once in the Ge'ez list, with slight spelling differences; the repetition is preserved.
    reason: textual_variant
