translation:
  language: en
  text: All of them will believe and give thanks in the presence of the Lord of Spirits. They will bless him with all their strength, and their food will be received with thanksgiving.[a] They will give thanks, bless him, and lift the name of the Lord of Spirits high forever and ever.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “their food will be in all thanksgiving.” The Ge'ez phrase is compressed and may also mean “with all thanksgiving.”
    reason: lexical_alternative
