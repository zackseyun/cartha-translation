- pob_phrase: before the Lord of Spirits
  simplified_phrase: in the presence of the Lord of Spirits
  preserved_meaning: They worship before the divine Lord while the established title remains unchanged.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The fuller wording makes the worship setting clear without changing the title.
- pob_phrase: with all their power
  simplified_phrase: with all their strength
  preserved_meaning: They use their whole capacity to bless the Lord.
  reasoning_layer_used: POB lexical decision for በኵሉ ኃይሎሙ
  rationale: “Strength” is common English and an approved lexical alternative.
- pob_phrase: exalt the name of the Lord of Spirits
  simplified_phrase: lift the name of the Lord of Spirits high
  preserved_meaning: They raise the Lord’s name in honor and praise.
  reasoning_layer_used: POB lexical decision for ያሌዕሉ
  rationale: This explains “exalt” while preserving its upward image.
