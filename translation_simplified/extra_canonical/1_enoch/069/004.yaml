translation:
  language: en
  text: The first was named Yeqon.[a] He was the one who led all the children of the angels astray. He brought them down onto the dry land and led them astray through the daughters of men.[b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The name Yeqon may also be spelled Yequn.
    reason: lexical_alternative
  - marker: b
    text: “Children of the angels” is literal; some understand it more broadly as the angelic host.
    reason: lexical_alternative
  - marker: c
    text: “The dry land” refers to the earthly realm and may also be translated “the earth” or “the land.”
    reason: lexical_alternative
  - marker: d
    text: “Through the daughters of men” may also be translated “by the daughters of men.”
    reason: lexical_alternative
