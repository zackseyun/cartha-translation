translation:
  language: en
  text: 'The third was named Gadreel. He showed humanity all the death-dealing blows, and he led Eve astray. He also showed humanity the weapons of death: the shield, body armor, and the sword used for slaughter. And he showed them all the weapons of death.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The ancient text is difficult here and repeats “all the weapons of death” after listing them; this translation keeps the repetition.
    reason: textual_variant
