  footnotes:
  - marker: a
    text: Remembering the name in the oath may include solemnly invoking it.
    reason: lexical_alternative
  - marker: b
    text: The wording most likely identifies the revealers as those who tremble, though it could refer more generally to all who hear the oath.
    reason: alternative_reading
