  preserved_meaning: The harmful striking image and its connection with both spirits and demons remain intact.
  reasoning_layer_used: Lexical and theological decisions on harmful spiritual afflictions
  rationale: Removing the repeated “of” improves flow without resolving the genitive’s ambiguity.
- pob_phrase: the blows in the womb, so that the embryo miscarries
