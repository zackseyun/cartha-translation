translation:
  language: en
  text: The fifth was named Kasdeya. He showed the children of men all the evil blows of spirits and demons. These included blows in the womb that cause an embryo to miscarry; the blow against the soul;[a] the serpent’s bite; and the blow that comes at noon—the son of the serpent named Taba’et.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The words “the blow against the soul” are uncertain in the surviving text.
    reason: textual_variant
  - marker: b
    text: The final wording is difficult; it may identify the noonday blow with a serpentine being named Taba’et.
    reason: alternative_reading
