  preserved_meaning: Kasdeya is the figure who revealed these harms.
  reasoning_layer_used: Lexical decision for ዘአርአዩ
  rationale: The shorter sentence keeps the same subject and action clear.
- pob_phrase: all the evil blows of spirits and of demons
