translation:
  language: en
  text: This is Kasbeel’s secret. Kasbeel is chief of the oath that he revealed to the holy ones[a] while he lived in glory on high. Its name is Biqa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In this heavenly vision, “holy ones” most likely means heavenly beings.
    reason: cultural_note
  - marker: b
    text: “Its” probably refers to the revealed oath or name, though it could refer to Kasbeel himself.
    reason: alternative_reading
