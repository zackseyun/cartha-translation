translation:
  language: en
  text: 'Human beings were created for one purpose: to be like the angels, so that they could remain pure and righteous. Death, which destroys everything, would not have touched them. But this knowledge[a] is destroying them, and this power is consuming me.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The difficult Ge'ez phrase may also mean, “through this understanding they perish.”
    reason: lexical_alternative
