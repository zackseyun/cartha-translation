  preserved_meaning: Humanity was created to resemble the angels, not to become angels.
  reasoning_layer_used: Lexical and theological decisions on the restrictive comparison.
  rationale: The positive purpose statement expresses the restriction in clearer English.
- pob_phrase: so that they might remain pure and righteous
