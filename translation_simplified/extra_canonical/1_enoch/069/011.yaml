  preserved_meaning: Purity and righteousness are a distinct intended result of humanity's creation.
  reasoning_layer_used: Lexical decision for “remain” and the grounding review's clause distinction.
  rationale: This keeps the second purpose clause separate instead of making it the means of angelic likeness.
- pob_phrase: through this knowledge they are being destroyed
  simplified_phrase: this knowledge is destroying them
  preserved_meaning: The uncertain knowledge is presented as the cause of their destruction.
  reasoning_layer_used: Lexical decision for “knowledge” and the chosen causal reading.
  rationale: The active construction states the same causal relationship in ordinary English.
