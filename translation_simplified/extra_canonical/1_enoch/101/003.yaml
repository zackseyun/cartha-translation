translation:
  language: en
  text: If he sends his wrath against you because of everything you have done, will you not plead with him? You speak against his righteousness[a] with great and harsh words[b], and you have no peace.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “justice”; “righteousness” includes his moral rightness more broadly.
    reason: lexical_alternative
  - marker: b
    text: That is, words spoken offensively against his righteousness.
    reason: simplification_note
simplification_decisions:
- pob_phrase: sends his wrath upon you for all your deeds
  simplified_phrase: sends his wrath against you because of everything you have done
  preserved_meaning: His wrath comes against them because of all their conduct.
  reasoning_layer_used: POB lexical decisions for ፈነወ, መዐቶ, and በኵሉ ምግባሪክሙ
  rationale: Familiar wording makes the cause of his wrath clear while retaining “wrath.”
- pob_phrase: entreat him
  simplified_phrase: plead with him
  preserved_meaning: When wrath comes, they will implore him.
  reasoning_layer_used: Applied revision on አኮ and the lexical decision for ታስተበቍዕዎ
  rationale: “Plead with him” conveys personal supplication in common English.
- pob_phrase: you speak great and harsh words against his righteousness
  simplified_phrase: you speak against his righteousness with great and harsh words
  preserved_meaning: Their offensive words are directed against his moral rightness.
  reasoning_layer_used: Applied lexical revision and theological decision on ጽድቅ ዚአሁ
  rationale: The reordered clause reads naturally while preserving the audited expression and its target.
