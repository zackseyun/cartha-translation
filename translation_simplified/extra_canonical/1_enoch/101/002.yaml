translation:
  language: en
  text: If he shuts heaven’s windows[a] and holds back the rain and dew, keeping them from falling on the earth because of you, what will you do?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Heaven’s windows” is an ancient image for the openings from which rain comes.
    reason: cultural_note
simplification_decisions:
- pob_phrase: the windows of heaven
  simplified_phrase: heaven’s windows
  preserved_meaning: The concrete ancient image of heavenly openings remains intact.
  reasoning_layer_used: POB lexical decision and cultural note
  rationale: The shorter possessive form is more natural while preserving the source image.
- pob_phrase: withholds the rain and the dew
  simplified_phrase: holds back the rain and dew
  preserved_meaning: He prevents both sources of life-giving moisture from reaching the earth.
  reasoning_layer_used: POB lexical decisions
  rationale: “Holds back” is a common equivalent for the more formal “withholds.”
- pob_phrase: so that it does not come down upon the earth
  simplified_phrase: keeping them from falling on the earth
  preserved_meaning: Both rain and dew are prevented from descending to the earth.
  reasoning_layer_used: POB lexical decision and grammar rationale
  rationale: An ordinary English participial clause makes the result easier to follow.
