translation:
  language: en
  text: '7:1 Paul sent Onesiphorus and his family home. Then he took Thecla with him and went to Antioch.


    7:2 As soon as they entered the city, a Syrian named Alexander saw Thecla and fell in love with her. He was a city official who had done many important things for Antioch while in office. He offered Paul many expensive gifts, hoping to gain his support.


    7:3 But Paul told him, “I do not know the woman you are talking about, and she does not belong to me.”


    7:4 Alexander was very powerful in Antioch. He grabbed Thecla in the street and kissed her, but she refused to accept this. As she looked around for Paul, she cried out in distress, “Do not force yourself on me! I am a stranger here and a servant of God! I am a prominent person from Iconium, but I had to leave that city because I refused to marry Thamyris.”


    7:5 Then she grabbed Alexander, tore his coat, pulled the crown from his head, and humiliated him in front of everyone.


    7:6 Alexander brought her before the governor, partly because he loved her and partly because he felt humiliated by what had happened. When Thecla admitted what she had done, the governor sentenced her to be thrown to the wild animals.'
