translation:
  language: en
  text: '11:1 Then the devil planted an evil plan in their minds. One day they met to discuss it. They said to one another, “This virgin is a priestess of the great goddess Diana. The goddess grants whatever she asks because she is a virgin and therefore loved by all the gods.


    11:2 So let us hire some immoral young men. We will get them thoroughly drunk, pay them a large sum of money, and send them to rape her. If they do it, we will promise them an even greater reward.”


    11:3 They believed that if they could rape her, the gods would no longer favor her, and Diana would no longer heal the sick at her request.


    11:4 They put their plan into action. The young men went up the mountain and approached the cave as fierce as lions. They knocked at the door.


    11:5 The holy martyr Thecla trusted in the God she believed in. Although she had already been warned about their plan, she opened the door and asked, “Young men, what do you want?”


    11:6 They replied, “Is someone named Thecla here?” She asked, “What do you want with her?” They said, “We intend to have sex with her.”


    11:7 The blessed Thecla answered, “I may be a lowly old woman, but I am the servant of my Lord Jesus Christ. Your evil plan against me will not succeed.” They replied, “Nothing can stop us from doing whatever we want with you.”


    11:8 As they spoke, they grabbed her and tried to rape her. But she answered them with the greatest gentleness, “Young men, wait and see the glory of the Lord.”


    11:9 While they held her, she looked up to heaven and prayed, “O God, worthy of the highest honor, no one can compare with you. You show your glory by defeating your enemies. You rescued me from the fire and did not hand me over to Thamyris or Alexander. You delivered me from the wild beasts and kept me safe in the deep waters. You have always helped me and have shown the glory of your name through me.


    11:10 Now rescue me from these wicked and senseless men. Do not let them violate the chastity I have preserved for your honor until this day. I love you, long for you, and worship you, Father, Son, and Holy Spirit, forever. Amen.”


    11:11 Then a voice came from heaven: “Do not be afraid, Thecla, my faithful servant, for I am with you. Look at the place that has opened for you. It will be your eternal home, and there you will see God in blessedness.”


    11:12 The blessed Thecla looked and saw that the rock had opened wide enough for a person to enter. Obeying the command, she courageously escaped from the evil men and entered the rock. It immediately closed so completely that no one could see even a crack where it had opened.


    11:13 The men stood there, utterly amazed by this extraordinary miracle. They were unable to hold back God’s servant. They managed only to grab her veil or hood and tear off a piece.


    11:14 God allowed even this to happen. The piece would strengthen the faith of those who came to see this honored place and bring blessings to people in later generations who believed in our Lord Jesus Christ with a pure heart.


    11:15 Thus Thecla suffered—the first martyr, apostle of God, and virgin. She had come from Iconium when she was eighteen years old. Afterward she spent some of her life traveling and some living alone in the cave in devotion to God. She lived another seventy-two years and was ninety years old when the Lord took her from this life.


    11:16 This is the end of her life.


    11:17 The day set apart in her memory is September 24, to the glory of the Father, the Son, and the Holy Spirit, now and forever. Amen.'
