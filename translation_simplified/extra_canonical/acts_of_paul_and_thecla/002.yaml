translation:
  language: en
  text: '2:1 Paul was preaching in the church that met in Onesiphorus’s house. A virgin named Thecla sat at a window in her own house. Her mother was Theoclia, and she was engaged to a man named Thamyris.


    2:2 Through a window in the house where Paul was, she could hear him. Day and night she listened to his teaching about God, love, faith in Christ, and prayer.


    2:3 She would not leave the window. She listened until the teachings of the faith won her over, and she received them with great joy.


    2:4 After some time, she saw many women and virgins going in to where Paul was. She deeply longed to be considered worthy to enter his presence and hear the word of Christ. Until then, she had only heard Paul preach and had never seen him.


    2:5 No one could persuade her to leave the window, so her mother sent for Thamyris. He came gladly, hoping that he would now marry her. He asked Theoclia, “Where is my Thecla?”


    2:6 Theoclia answered, “Thamyris, I have something very strange to tell you. For three days Thecla has refused to move from the window, even to eat or drink. She is completely absorbed in listening to the clever, deceptive words of a foreigner. I cannot understand how a young woman known for her modesty could let him influence her so strongly.


    2:7 “That man has unsettled the whole city of Iconium, including your Thecla. All the women and young men crowd around him to receive his teaching. Among other things, he tells them that there is only one God, that he alone must be worshiped, and that we ought to live in chastity.


    2:8 “Yet my daughter Thecla is fixed to the window like a spider’s web. Paul’s words hold her captive, and she listens with astonishing eagerness and great delight. By listening to him, the young woman is being led astray. Go and speak to her now, for she is engaged to you.”


    2:9 Thamyris went to her and greeted her, taking care not to startle her. He said, “Thecla, my bride-to-be, why are you sitting here so sadly? What strange influence has come over you? Turn toward Thamyris and blush.”


    2:10 Her mother spoke to her in the same way: “My child, why do you sit there so sadly? Why do you stare in amazement and say nothing?”


    2:11 Then they all wept bitterly. Thamyris wept because he had lost his bride, Theoclia because she had lost her daughter, and the female servants because they had lost their mistress. The whole household mourned.


    2:12 But none of this affected Thecla enough to make her turn toward them or even acknowledge them. She remained focused on Paul’s teaching.


    2:13 Then Thamyris rushed into the street to watch the people entering and leaving Paul’s gathering. He saw two men in a heated argument and said to them,


    2:14 “Sirs, what are you doing here? Who is that man inside with you? He deceives the minds of young men and virgins, persuading them not to marry but to remain as they are.


    2:15 “I will give you a large sum of money if you give me a true account of him, for I am a leading citizen of this city.”


    2:16 Demas and Hermogenes answered, “We cannot tell you exactly who he is. But we do know that he takes promised brides away from young men and promised husbands away from virgins by teaching, ‘There can be no future resurrection unless you remain chaste and do not defile your flesh.’”'
