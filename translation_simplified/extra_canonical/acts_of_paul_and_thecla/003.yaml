translation:
  language: en
  text: '3:1 Then Thamyris said, “Come to my house and enjoy some food and rest.” So they went with him to a magnificent banquet with abundant wine and rich food.


    3:2 Thamyris seated them at a table loaded with food and gave them plenty of wine. He treated them generously because he loved Thecla and wanted to marry her.


    3:3 Thamyris said, “Tell me what this Paul teaches so I can understand it. I am deeply worried about Thecla. She is so delighted by that stranger’s words that I may lose the woman I intend to marry.”


    3:4 Demas and Hermogenes answered together, “Have Paul taken before Governor Castillius. Accuse him of trying to persuade the people to accept the new Christian religion. Under Caesar’s decree, the governor will put him to death, and then you will get your wife.


    3:5 “Meanwhile, we will teach her that the resurrection Paul speaks about has already happened. We will say that it means having children, and that we rose again when we came to know God.”


    3:6 When Thamyris heard what they said, he became furious.


    3:7 Early the next morning, he went to the house of Onesiphorus. Magistrates, the jailer, and a large crowd carrying clubs went with him. Thamyris said to Paul,


    3:8 “You have led the city of Iconium astray, including Thecla, who is promised to me in marriage, so that she will not marry me. You must come with us to Governor Castillius.”


    3:9 The whole crowd shouted, “Take this deceiver—this magician—away! He has led our wives astray, and everyone listens to him.”'
