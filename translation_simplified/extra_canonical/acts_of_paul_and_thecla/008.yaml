translation:
  language: en
  text: '8:1 When the people saw what had happened, they said, “The judgments made in this city are unjust.” But Thecla asked the governor to keep her sexual purity from being violated until she was thrown to the wild animals.


    8:2 The governor asked who would take her into their home. A very wealthy widow named Trifina, whose daughter had recently died, asked to care for her. In her home, she began treating Thecla as her own daughter.


    8:3 At last the day came for the wild animals to be put on display. Thecla was taken into the arena before a large crowd and placed in an enclosure with an extremely fierce lioness.


    8:4 Trifina went with Thecla without showing fear, and the lioness licked Thecla’s feet. A sign naming Thecla’s crime read, “Sacrilege.” Then Trifina cried out, “O God, the judgments of this city are unjust!”


    8:5 After the animals had been displayed, Trifina took Thecla home, and they went to bed. Then Trifina’s dead daughter appeared to her and said, “Mother, accept the young woman Thecla as your daughter in my place. Ask her to pray for me, so that I may be brought into a state of happiness.”


    8:6 Trifina sorrowfully told Thecla, “My daughter Falconilla appeared to me and told me to accept you in her place. So I ask you, Thecla, to pray that my daughter may be brought into a state of happiness and eternal life.”


    8:7 Thecla immediately prayed to the Lord: “O Lord God of heaven and earth, Jesus Christ, Son of the Most High, grant that Falconilla may live forever.” When Trifina heard this, she groaned again and said, “What unjust judgments! What senseless wickedness—to throw such a person to the wild animals again!”


    8:8 At daybreak the next morning, Alexander came to Trifina’s house and said, “The governor and the people are waiting. Bring out the criminal.”


    8:9 Trifina rushed at him so fiercely that he became frightened and ran away. Trifina belonged to the royal family. In her grief she said, “How terrible! I have two sorrows in my home, and no one can help me. I have lost my daughter, and I cannot save Thecla. But now, O Lord God, help your servant Thecla.”


    8:10 While she was saying this, the governor sent one of his officers to bring Thecla. Trifina took Thecla by the hand and went with her. She said, “I went with Falconilla to her grave, and now I must go with Thecla to the wild animals.”


    8:11 Hearing this, Thecla prayed through her tears: “O Lord God, I have trusted in you and found safety in you. Reward Trifina for showing me compassion and preserving my sexual purity.”


    8:12 A great uproar arose in the arena. The animals roared, and the people shouted, “Bring in the criminal!”


    8:13 But Trifina cried out, “Let the whole city suffer for crimes like this! Governor, sentence all of us to the same punishment. What an unjust judgment! What a cruel sight!”


    8:14 Others said, “Let the whole city be destroyed for this vile act! Kill us all, Governor! What a cruel sight! What an unjust judgment!”'
