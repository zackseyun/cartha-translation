translation:
  language: en
  text: '4:1 Then Thamyris stood before the governor’s court and spoke loudly:


    4:2 “Governor, I do not know where this man comes from, but he teaches that marriage is forbidden. Order him to explain why he teaches this.”


    4:3 As Thamyris spoke, Demas and Hermogenes whispered to him, “Say that he is a Christian, and he will be put to death at once.”


    4:4 But the governor did not rush to judgment. He called Paul forward and asked, “Who are you? What do you teach? These men accuse you of serious crimes.”


    4:5 Paul answered in a loud voice, “Governor, since I have been called to answer for my teaching, please listen to me.


    4:6 “God takes vengeance and needs nothing except that his creatures be saved. He sent me to turn them away from wickedness, corruption, every sinful pleasure, and death, and to persuade them to stop sinning.


    4:7 “That is why God sent his Son, Jesus Christ. I proclaim him and teach people to put their hope in him. He alone had such compassion on this deceived world that it might not be condemned, Governor, but might have faith, reverence for God, knowledge of religion, and love for the truth.


    4:8 “If I teach only what God revealed to me, what crime have I committed?”


    4:9 After hearing this, the governor ordered that Paul be bound and put in prison until he had time to hear his case more fully.


    4:10 During the night, Thecla gave her earrings to the prison guard, and he opened the doors and let her in.


    4:11 Then she gave the jailer a silver mirror, and he allowed her to enter Paul’s room. She sat at Paul’s feet and listened to him speak about the great things of God.


    4:12 She saw that Paul was not afraid to suffer. With God’s help, he remained courageous. Her faith grew so strong that she kissed his chains.'
