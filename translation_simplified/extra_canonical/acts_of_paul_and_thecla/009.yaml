translation:
  language: en
  text: '9:1 Then Thecla was taken away from Trifina. They stripped her naked, put a belt around her, and threw her into the arena where prisoners fought wild beasts. Lions and bears were released to attack her.


    9:2 But the fiercest animal of all, a lioness, ran to Thecla and lay down at her feet. When the women in the crowd saw this, they shouted loudly.


    9:3 Then a female bear charged at Thecla, but the lioness met it and tore it to pieces.


    9:4 Next, a male lion ran toward her. It belonged to Alexander and was used to devouring people. But the lioness fought it, and the two lions killed each other.


    9:5 The women became even more distressed because the lioness that had protected Thecla was dead.


    9:6 After this, they brought out many other wild beasts. But Thecla stood with her hands raised toward heaven and prayed. When she finished, she turned and saw a pool of water. She said, “Now is the right time for me to be baptized.”


    9:7 She threw herself into the water and said, “O my Lord Jesus Christ, in your name I am baptized on this, my last day.” When the women and the rest of the crowd saw her do this, they cried out, “Do not throw yourself into the water!” Even the governor cried out because he thought the sea creatures in the pool would devour such a beautiful woman.[a]


    9:8 Despite their cries, Thecla threw herself into the water in the name of our Lord Jesus Christ.


    9:9 But when the creatures saw the flash and the fire, they died and floated on the surface. A cloud of fire surrounded Thecla. It kept the beasts from coming near her and kept the people from seeing her naked body.


    9:10 Still, they released more wild beasts against her. The women gave a cry of deep grief. Some scattered fragrant spices—spikenard, cassia, and amomus—and others poured out perfume.[b] So much was poured out because the crowd was so large. Then all the beasts lay down as if they were sound asleep, and they did not touch Thecla.


    9:11 Alexander said to the governor, “I have some terrifying bulls. Let us tie her to them.” The governor answered anxiously, “Do what you think is best.”


    9:12 They tied a cord around Thecla’s waist and feet and fastened her to the bulls. Then they pressed red-hot irons against the bulls’ genitals. They wanted the pain to make the bulls drag her around violently until she was dead.


    9:13 The bulls rushed wildly around with a horrifying roar. But the flame surrounding Thecla burned through the cords tied to the bulls. She stood in the middle of the arena as calmly as if she had never been bound.


    9:14 Meanwhile, Trifina was sitting on one of the benches. She fainted and died, and the whole city was filled with distress.


    9:15 Alexander became afraid. He pleaded with the governor, “I beg you, have mercy on me and on this city. Release this woman who has faced the beasts, or you, I, and the whole city may be destroyed.


    9:16 If Caesar hears what has happened, he will certainly destroy the city at once. Trifina was a woman of royal descent and a relative of his, and she has died here in her seat.”


    9:17 Then the governor called Thecla out from among the beasts and asked her, “Who are you? What is it about you that keeps every beast from touching you?”


    9:18 Thecla answered, “I am a servant of the living God. I believe in his Son, Jesus Christ, with whom God is well pleased. That is why none of the beasts could touch me.


    9:19 Jesus alone is the way to eternal salvation and the foundation of eternal life. He is a refuge for people in distress, strength for those who suffer, and hope and protection for those who have no hope. In short, those who do not believe in him will not live but will suffer eternal death.”


    9:20 When the governor heard this, he ordered that her clothes be brought to her. He said, “Put on your clothes.”


    9:21 Thecla replied, “When I was naked among the beasts, God clothed me. May he clothe your soul with the robe of salvation on the day of judgment.” Then she took her clothes and put them on. The governor immediately announced, “I release Thecla, the servant of God, to you.”


    9:22 The women all cried out loudly and praised God together. They said, “There is only one God, the God of Thecla! He is the one God who has rescued Thecla!”


    9:23 Their voices were so loud that the whole city seemed to shake. Trifina herself heard the good news, rose again, and ran with the crowd to meet Thecla. She embraced her and said, “Now I believe that the dead will rise. Now I am convinced that my daughter is alive. Come home with me, my daughter Thecla, and I will give you everything I own.”


    9:24 Thecla went home with Trifina and stayed there for several days. She taught her the word of the Lord, and through her teaching many young women came to faith. Trifina’s whole household was filled with joy.


    9:25 But Thecla longed to see Paul. She asked about him and sent people everywhere to find him. At last, she learned that he was in Myra, in the region of Lycia. She took many young men and women with her, put on a belt, and dressed in men’s clothing. Then she traveled to Myra and found Paul preaching the word of God. She stood beside him among the crowd.'
