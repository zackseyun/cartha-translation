translation:
  language: en
  text: '5:1 At last, Thecla’s family realized she was missing. They and Thamyris searched every street for her. Then one of the gatekeeper’s fellow servants told them that she had left during the night.


    5:2 They questioned the gatekeeper, and he told them that she had gone to the prison to see the stranger.


    5:3 They followed his directions and found her there. After they came out, they gathered a mob and reported everything to the governor.


    5:4 The governor ordered Paul to be brought before him for judgment.


    5:5 Meanwhile, Thecla lay sprawled on the prison floor, in the very place where Paul had sat and taught her. The governor ordered that she also be brought before him. She received the summons joyfully and went.


    5:6 When Paul was brought in, the mob shouted even more fiercely, “He is a magician! He must die!”


    5:7 Yet the governor listened gladly as Paul spoke about the holy works of Christ. After meeting with his council, he called for Thecla and asked her, “Why will you not marry Thamyris, as the law of the Iconians requires?”


    5:8 Thecla stood silently, her eyes fixed on Paul. When she did not answer, her mother, Theoclia, shouted, “Burn this wicked woman! Burn her in the middle of the theater because she refuses Thamyris! Then all women will learn not to act as she has!”


    5:9 The governor was deeply distressed. He ordered Paul to be whipped and driven out of the city, and he sentenced Thecla to be burned.


    5:10 The governor immediately went to the theater, and all the people went out to watch the dreadful sight.


    5:11 Thecla looked around for Paul, just as a lamb in the wilderness looks everywhere for its shepherd.


    5:12 As she looked at the crowd, she saw the Lord Jesus appearing in Paul’s likeness. She said to herself, “Paul has come to see me in my distress.” She kept her eyes fixed on him, but as she watched, he immediately ascended into heaven.


    5:13 Then the young men and women brought wood and straw to burn Thecla. She was brought naked to the stake. The governor gazed in amazement at her great beauty and was moved to tears.


    5:14 After they arranged the wood, the people ordered her to step onto it. She stepped onto it, first making the sign of the cross.


    5:15 Then the people set the pile on fire. The flames rose very high, but they did not touch her. God had compassion on her: the ground beneath her burst open, and a cloud above poured down heavy rain and hail.


    5:16 When the ground split open, many people were put in great danger, and some were killed. The fire went out, and Thecla was saved.'
