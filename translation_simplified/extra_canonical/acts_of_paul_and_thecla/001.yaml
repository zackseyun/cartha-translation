translation:
  language: en
  text: '1:1 After Paul fled Antioch and traveled to Iconium, Demas and Hermogenes joined him as companions. At that time, however, they were full of hypocrisy.


    1:2 Paul focused only on God’s goodness. He did them no harm but loved them deeply.


    1:3 He taught them what had been revealed to him about Christ. He tried to present the sacred messages and teachings of Christ, and the purpose of the good news about God’s dearly loved Son, in a way they would welcome.


    1:4 A man named Onesiphorus heard that Paul had come to Iconium. He quickly went out to meet him and invite him into his home. His wife Lectra and his sons Simmia and Xeno went with him.


    1:5 Titus had described Paul’s appearance to them. They did not yet know Paul personally; they knew only what kind of man he was.


    1:6 They took the main royal road toward Lystra and waited there for him. As each traveler passed, they compared him with Titus’s description.


    1:7 At last they saw Paul coming. He was short and either bald or shaved on the head. He had crooked thighs, handsome legs, deep-set eyes, and a crooked nose. He was full of grace. At times he appeared as a man, and at other times his face looked like an angel’s. When Paul saw Onesiphorus, he was glad.


    1:8 Onesiphorus said, “Greetings, servant of the blessed God.”


    Paul answered, “May God’s grace be with you and your family.”


    1:9 Demas and Hermogenes became envious. Pretending to be very devout, Demas said, “Are we not also servants of the blessed God? Why did you not greet us?”


    1:10 Onesiphorus answered, “Because I have not seen the fruit of righteous living in you. But if you are people of that kind, you too will be welcome in my home.”


    1:11 Paul then entered Onesiphorus’s home, and the whole family rejoiced greatly. They devoted themselves to prayer and the breaking of bread, and they listened as Paul preached God’s word about self-control and the resurrection. He said:


    1:12 “Blessed are those whose hearts are pure,

    for they will see God.


    1:13 “Blessed are those who keep their bodies pure and undefiled,

    for they will be God’s temple.


    1:14 “Blessed are those who practice self-control,[a]

    for God will reveal himself to them.


    1:15 “Blessed are those who give up worldly pleasures,

    for God will accept them.


    1:16 “Blessed are those who have wives as though they did not have them,

    for they will be made angels of God.


    1:17 “Blessed are those who tremble at God’s word,

    for they will be comforted.


    1:18 “Blessed are those who keep their baptism pure,

    for they will find peace with the Father, the Son, and the Holy Spirit.


    1:19 “Blessed are those who pursue the wisdom of Jesus Christ,[b]

    for they will be called sons of the Most High.


    1:20 “Blessed are those who obey the instructions of Jesus Christ,

    for they will live in eternal light.


    1:21 “Blessed are those who give up worldly glory because they love Christ,

    for they will judge angels and be given a place at Christ’s right hand.

    They will not suffer the bitterness of the last judgment.


    1:22 “Blessed are virgins in both body and soul,

    for they are acceptable to God and will not lose the reward of their virginity.

    Their heavenly Father’s word will accomplish their salvation on the day of his Son,

    and they will rest forever.”'
