translation:
  language: en
  text: '10:1 Paul was greatly surprised when he saw Thecla and the people with her. He thought another trial was about to come upon them.


    10:2 When Thecla realized what he was thinking, she said, “O Paul, I have been baptized. The one who helps you preach also helped me baptize myself.”


    10:3 Paul then took her to the house of Hermes. There Thecla told him everything that had happened to her in Antioch. Paul was greatly amazed. Everyone who heard her story was strengthened in the faith, and they prayed for Trifina’s well-being.


    10:4 Then Thecla stood and said to Paul, “I am going to Iconium.” Paul answered, “Go and teach the word of the Lord.”


    10:5 Trifina had sent Thecla with large sums of money for Paul and clothing to help the poor.


    10:6 So Thecla went to Iconium and entered the house of Onesiphorus. She fell to the floor where Paul had once sat and preached. Weeping as she prayed, she praised and glorified God:


    10:7 “O Lord, God of this house, here you first gave me light. O Jesus, Son of the living God, you helped me before the governor, in the fire, and among the wild beasts. You alone are God forever and ever. Amen.”


    10:8 When Thecla returned, she found that Thamyris had died but her mother was still alive. She called to her and said, “Theoclia, my mother, can you be brought to believe that there is only one Lord God, who lives in heaven? If you desire great riches, God will give them to you through me. If you want your daughter back, here I am.”


    10:9 Thecla said these and many other things, trying to persuade her mother. But Theoclia did not believe what the martyr Thecla told her.


    10:10 When Thecla realized that her words were having no effect, she made the sign of the cross over her whole body. Then she left the house and went to Daphine. There she entered the cave where she had found Paul and Onesiphorus, fell to the ground, and wept before God.


    10:11 After leaving that place, she went to Seleucia and taught many people to know Christ.


    10:12 A bright cloud guided her on her journey.


    10:13 After arriving at Seleucia, she settled about a furlong outside the city.[a] She was afraid of the people living there because they worshiped idols.


    10:14 The cloud led her to a mountain called Calamon, also known as Rodeon. She stayed there for many years and endured many severe temptations from the devil. With Christ’s help, she remained faithful through them.


    10:15 Eventually, some women of high social standing heard about the virgin Thecla and came to her. She taught them the messages of God. Many of them left their former way of life and joined her in a life devoted to God.


    10:16 Reports about Thecla spread everywhere, for she performed several miraculous healings. People throughout the city and the surrounding countryside brought the sick to the mountain. Before they even reached the entrance of the cave, they were immediately healed of every illness.


    10:17 Unclean spirits came out with loud cries. Everyone received their sick back in good health, and they glorified God for giving such power to the virgin Thecla.


    10:18 The physicians of Seleucia were no longer respected, and they lost all their income because no one sought their help. Filled with envy, they began plotting what to do against this servant of Christ.'
