translation:
  language: en
  text: '6:1 Meanwhile, Paul was fasting in a cave beside the road from Iconium to Daphne. Onesiphorus, his wife, and their children were with him.


    6:2 After they had fasted for several days, the children said to Paul, “Father, we are hungry, and we have no money to buy bread.” Onesiphorus had left all his possessions behind to follow Paul with his family.


    6:3 Paul took off his coat and said to one of the boys, “Go, child. Buy some bread and bring it here.”


    6:4 While the boy was buying bread, he was surprised to see his neighbor Thecla. He asked her, “Thecla, where are you going?”


    6:5 She answered, “I am looking for Paul. I have been rescued from the flames.”


    6:6 The boy said, “I will take you to him. He has been deeply worried about you and has spent the last six days praying and fasting.”


    6:7 When Thecla reached the cave, she found Paul on his knees praying: “Holy Father, Lord Jesus Christ, do not let the fire touch Thecla. Help her, for she is your servant.”


    6:8 Standing behind him, Thecla cried out, “Sovereign Lord, Creator of heaven and earth and Father of your beloved and holy Son, I praise you for saving me from the fire and allowing me to see Paul again.”


    6:9 Paul stood up. When he saw her, he said, “God who searches every heart, Father of my Lord Jesus Christ, I praise you for answering my prayer.”


    6:10 Everyone in the cave shared deep affection for one another. Paul, Onesiphorus, and all the others were filled with joy.


    6:11 They had five loaves of bread, some herbs, and water. They comforted one another by reflecting on the holy works of Christ.


    6:12 Then Thecla said to Paul, “If you agree, I will follow you wherever you go.”


    6:13 He answered, “Sexual immorality is widespread now. Because you are beautiful, I fear that you may face an even greater temptation than before and that it may overcome you.”


    6:14 Thecla replied, “Only give me the seal of Christ,[a] and no temptation will overcome me.”


    6:15 Paul answered, “Thecla, wait patiently, and you will receive the gift of Christ.”'
