translation:
  language: en
  text: 'Since we know that no one can make a fool of God, we should live in a way worthy of his command and his glory.


    In the same way, deacons must be above blame before his righteousness. They serve God and Christ, not human beings. They must not slander others, say one thing to one person and something different to another, or love money. Instead, they must show self-control in everything, have compassion, work diligently, and live by the truth of the Lord, who became everyone’s servant—a deacon to all. If we please him in this present world, we will also receive the world to come, just as he promised to raise us from the dead. If we live in a way worthy of him, we will also reign with him—if we truly have faith.


    In the same way, the younger men must be above blame in everything. Above all, they must care about purity and keep themselves from every kind of evil. It is good to turn away from worldly desires, because every such desire wages war against the Spirit. People who are sexually immoral, effeminate people,[a] and those who defile themselves sexually with other men will not inherit God’s kingdom. Neither will those who do what is improper. Therefore, you should keep away from all these things and submit to the presbyters and deacons as you submit to God and Christ. The virgins must live with a conscience that is blameless and pure.'
