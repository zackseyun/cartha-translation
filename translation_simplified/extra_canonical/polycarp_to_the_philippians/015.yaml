translation:
  language: en
  text: 'Crescens is carrying this letter to you. I commended him to you recently, and I commend him again now. His conduct among us has been blameless, and I believe it will be the same among you. When his sister comes to you, welcome her.


    May you and everyone with you fare well in the grace of the Lord Jesus Christ. Amen.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: I write these things to you through Crescens
  simplified_phrase: Crescens is carrying this letter to you
  preserved_meaning: Crescens is the means by which Polycarp's letter reaches the readers.
  reasoning_layer_used: English witness and POB translation
  rationale: The concrete action clarifies the formal phrase “through Crescens.”
- pob_phrase: he has walked blamelessly with us
  simplified_phrase: His conduct among us has been blameless
  preserved_meaning: Crescens behaved without grounds for blame among Polycarp's community.
  reasoning_layer_used: POB controlling text
  rationale: “Conduct” expresses the ethical sense of “walked” in ordinary English.
- pob_phrase: But you shall have his sister commended when she comes to you
  simplified_phrase: When his sister comes to you, welcome her
  preserved_meaning: The readers are directed to receive Crescens's sister favorably when she arrives.
  reasoning_layer_used: POB controlling text and grounding review
  rationale: A direct instruction avoids adding a first-person commendation by Polycarp.
interpretive_expansions:
- pob_phrase: through Crescens
  rendering: Crescens is carrying this letter to you
  claim: Crescens is conveying the letter to its recipients.
  evidence:
  - The POB and English witness say the letter is written to them “through” Crescens.
  confidence: moderate
  alternatives_preserved:
  - Crescens may have served more broadly as Polycarp's representative.
  external_witnesses:
  - J. B. Lightfoot's public-domain English translation
- pob_phrase: you shall have his sister commended
  rendering: welcome her
  claim: The wording directs the readers to receive Crescens's sister favorably.
  evidence:
  - The POB addresses the recipients concerning her arrival rather than explicitly adding a new first-person commendation.
  confidence: moderate
  alternatives_preserved:
  - Treat her as commended to you.
