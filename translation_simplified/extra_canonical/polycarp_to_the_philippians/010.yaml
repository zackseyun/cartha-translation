translation:
  language: en
  text: 'Therefore, I urge all of you to obey the message that teaches what is right and to remain faithful through every hardship. You saw this perseverance for yourselves in the blessed Ignatius, Zosimus, and Rufus. You also saw it in others from your own community, as well as in Paul himself and the other apostles.


    I am convinced that none of them ran their race for nothing. They ran with faith and righteousness, and now they are in their rightful place with the Lord. They also suffered together with him. They did not love this present world. Instead, they loved the one who died for our sake and whom God raised for us.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: obey the word of righteousness
  simplified_phrase: obey the message that teaches what is right
  preserved_meaning: They must obey the righteous teaching they received.
  reasoning_layer_used: POB translation and English witness
  rationale: “Message” clarifies that “word” refers to teaching rather than one spoken term.
- pob_phrase: practice all endurance
  simplified_phrase: remain faithful through every hardship
  preserved_meaning: They must consistently endure suffering and difficulty.
  reasoning_layer_used: Immediate context and POB translation
  rationale: This presents endurance as steadfast conduct amid hardship.
- pob_phrase: none of these ran in vain
  simplified_phrase: none of them ran their race for nothing
  preserved_meaning: Their faithful course of life and suffering was not wasted.
  reasoning_layer_used: POB image and English witness
  rationale: “Their race” clarifies the metaphor while preserving the running image.
