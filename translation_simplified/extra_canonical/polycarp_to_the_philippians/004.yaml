translation:
  language: en
  text: 'Brothers and sisters, I am writing to you about living rightly, not because I took this responsibility upon myself, but because you asked me to.


    Neither I nor anyone like me can equal the wisdom of the blessed and glorious Paul. When he was among you, he carefully and faithfully taught the people of that time face to face the message of truth. Later, while away, he wrote you a letter. If you study it carefully, it can strengthen you in the faith you have received.


    This faith is the mother of us all. Love comes first—love for God and Christ and for our neighbor—and hope follows. Anyone who is devoted to these things has fulfilled the command to live rightly, for whoever has love stays far from every sin.'
  philosophy: optimal-equivalence
