translation:
  language: en
  text: 'Therefore, remain firmly committed to these things and follow the Lord’s example. Stand firm and unshakable in the faith. Love your fellow believers with tender affection. Stand together for the truth. Be the first to show one another gentleness as the Lord teaches, and look down on no one.


    Whenever you are able to do good, do not put it off, for showing mercy delivers from death. Submit to one another. Live blameless lives among the nations, so that your good works may earn praise and the Lord may not be spoken against because of you.


    But woe to anyone through whom the Lord’s name is spoken against. Therefore, teach everyone to live with self-control, just as you yourselves do.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: kindly affectionate toward one another in love of the brotherhood
  simplified_phrase: Love your fellow believers with tender affection
  preserved_meaning: The community must show warm, family-like love to one another.
  reasoning_layer_used: POB text and English witness
  rationale: The direct command preserves both mutual love and its familial warmth.
- pob_phrase: forestalling one another in the gentleness of the Lord
  simplified_phrase: Be the first to show one another gentleness as the Lord teaches
  preserved_meaning: Believers should take initiative in showing one another gentleness measured by the Lord.
  reasoning_layer_used: POB text, English witness, and grounding review
  rationale: This makes the initiative clear without limiting the Lord’s gentleness to imitation alone.
- pob_phrase: teach all people soberness, in which you yourselves also walk
  simplified_phrase: teach everyone to live with self-control, just as you yourselves do
  preserved_meaning: They must teach disciplined living and practice it themselves.
  reasoning_layer_used: POB text and English witness
  rationale: “Self-control” avoids an alcohol-only meaning, while “live” naturally conveys conduct.
interpretive_expansions:
- pob_phrase: the Lord may not be blasphemed in you
  rendering: the Lord may not be spoken against because of you
  claim: The community’s conduct could cause others to speak against the Lord.
