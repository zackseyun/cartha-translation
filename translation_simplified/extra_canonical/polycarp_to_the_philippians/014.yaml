translation:
  language: en
  text: 'Both you and Ignatius wrote to me, asking that if someone goes to Syria, that person take your letters there. I will do this when I have a suitable opportunity. Either I will take them myself, or I will send someone to represent you as well.


    As you requested, we are sending you the letters Ignatius sent us, along with all his other letters that we had. They are attached to this letter. These letters can greatly benefit you, for they teach faith and endurance and provide every kind of instruction about our Lord that builds people up.


    Also, if you have any reliable news about Ignatius and those who were with him, please let us know.'
