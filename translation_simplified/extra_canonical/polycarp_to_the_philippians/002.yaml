  rationale: The ordinary wording makes the act and its approval immediately clear.
- pob_phrase: those men encircled in holy chains, which are the crowns
  simplified_phrase: These men were bound with holy chains—chains that are crowns
  preserved_meaning: Their imprisonment is pictured as an honorable crown rather than a disgrace.
  reasoning_layer_used: POB controlling metaphor
  rationale: The recast sentence preserves both the chains and crown images.
- pob_phrase: inexpressible and glorious joy
  simplified_phrase: a glorious joy too deep for words
  preserved_meaning: Their joy is glorious and cannot be adequately expressed.
  reasoning_layer_used: POB translation
  rationale: A familiar phrase replaces an abstract adjective without weakening the joy.
