translation:
  language: en
  text: 'I shared your great joy in our Lord Jesus Christ because you welcomed those who follow true Love and helped them continue their journey, as was right for you. These men were bound with holy chains—chains that are crowns for those truly chosen by God and our Lord.


    Your faith is like a firm, steadfast root. It has been well known since the earliest days, and it still lives and bears fruit for our Lord Jesus Christ. He endured even death for our sins, and God raised him and freed him from the pains of Hades.[a]


    Although you did not see Jesus, you believe in him and rejoice with a glorious joy too deep for words. Many long to enter into this joy. You know that you are saved by grace—not by your works, but by God’s will through Jesus Christ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hades means the realm of the dead.
    reason: cultural_note
