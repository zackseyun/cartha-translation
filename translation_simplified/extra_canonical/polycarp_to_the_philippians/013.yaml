simplification_decisions:
- pob_phrase: you are well trained in the sacred writings, and nothing is hidden from you
  simplified_phrase: you know the sacred writings well and understand everything in them
  preserved_meaning: The recipients are praised for their thorough knowledge and understanding of Scripture.
  reasoning_layer_used: POB text and English witness
  rationale: Common wording makes the compliment immediately clear.
- pob_phrase: avoidance of wrath and in forbearance and long-suffering
  simplified_phrase: freedom from anger, bearing with others, patience
  preserved_meaning: The distinct virtues of avoiding anger, restraining oneself with others, and suffering patiently remain present.
  reasoning_layer_used: POB text and immediate virtue list
  rationale: The wording avoids the misleading modern sense of “tolerance” while distinguishing the listed virtues.
- pob_phrase: grant you a lot and portion among his saints
  simplified_phrase: give you a place and a share among his holy people
  preserved_meaning: God grants believers an allotted place and inheritance among his saints.
  reasoning_layer_used: POB text and source image
  rationale: “Place and share” conveys the allotment image without the opaque phrase “lot and portion.”
