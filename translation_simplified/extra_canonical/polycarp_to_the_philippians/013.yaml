translation:
  language: en
  text: 'I am convinced that you know the sacred writings well and understand everything in them. I have not been given such understanding. Yet these Scriptures say, “Be angry, but do not sin,” and, “Do not let the sun go down while you are still angry.” Blessed is anyone who remembers this, and I trust that you do.


    Now may God, the Father of our Lord Jesus Christ, and Jesus Christ himself—the eternal High Priest and Son of God—strengthen you in faith and truth. May he help you grow in gentleness, freedom from anger, bearing with others, patience, endurance, and purity. May he give you a place and a share among his holy people, together with us and with all people everywhere who will believe in our Lord and God Jesus Christ and in his Father, who raised him from the dead.


    Pray for all God’s holy people. Pray also for kings, rulers, and leaders; for those who persecute and hate you; and for the enemies of the cross, so that everyone may see the fruit you produce and you may become complete in Christ.'
