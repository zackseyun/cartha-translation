  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/009.yaml
  text: 'Therefore, let us hold firmly and without ceasing to our hope and to the pledge of our righteousness, who is Jesus Christ. He bore our sins in his own body on the tree. He committed no sin, nor was deceit found in his mouth. Yet for our sake he endured everything, so that we might live in him.


    Therefore, let us imitate his endurance. If we suffer for the sake of his name, let us glorify him. For he gave us this example in his own person, and we believed this.'
