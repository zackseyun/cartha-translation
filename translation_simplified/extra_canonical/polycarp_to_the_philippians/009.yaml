translation:
  language: en
  text: 'So let us never let go of our hope. Let us hold firmly to Jesus Christ, who is the pledge of our being made right with God. He carried our sins in his own body on the tree—the cross. He never sinned, and no deceit was found in his mouth. Yet he endured everything for us so that we might live in him.


    So let us follow his example of patient endurance. If we suffer because of his name, let us give him glory. He himself showed us how to endure, and this is what we have believed.'
