translation:
  language: en
  text: 'But the love of money is the beginning of all troubles. We brought nothing into the world, and we cannot take anything out of it. Since we know this, let us put on righteousness as our armor. First, we must train ourselves to live by the Lord’s command.


    Then we should teach our wives to live by the faith they have received, with love and purity. They should care for their own husbands with complete sincerity, love everyone equally and with complete purity, and raise their children to live in reverence for God.


    The widows among us must be clear-minded concerning the faith of the Lord. They should pray continually for everyone and avoid all slander, harmful speech, false testimony, love of money, and every kind of evil. They know that they are God’s altar and that he carefully examines every sacrifice. Nothing escapes him—not their thoughts, their intentions, or anything hidden in their hearts.'
