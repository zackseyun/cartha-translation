translation:
  language: en
  text: 'The elders must also show compassion and mercy to everyone. They must bring back those who have wandered away. They must visit every sick person and not neglect widows, orphans, or the poor. They must always seek to do what is honorable before God and people. They must avoid all anger, favoritism, and unfair judgment. They must keep far away from the love of money. They must not quickly believe an accusation against anyone or rush to pass judgment, because we all owe a debt because of our sins.


    If we ask the Lord to forgive us, then we must also forgive others. Our Lord and God sees us all. We must all stand before Christ’s judgment seat, and each of us must give an account for ourselves.


    Therefore, let us serve him with reverent fear, just as he commanded. Let us also follow what the apostles taught when they brought us the good news, and what the prophets announced beforehand about the coming of our Lord. Let us eagerly pursue what is good. We must stay away from all stumbling blocks, from false fellow believers, and from those who claim the Lord’s name insincerely and lead foolish people astray.'
