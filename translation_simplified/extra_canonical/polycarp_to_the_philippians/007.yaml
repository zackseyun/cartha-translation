  review_summary: The draft is substantially clearer while preserving the passage’s ethical and eschatological force. Its clarification of hasty belief as accepting an accusation is well warranted by the immediate judicial context, and “claim the Lord’s name insincerely” suitably explains the idiom. Revision is needed because the added sheep imagery is not expressed in the source clause, and because the rendering of σκανδάλων resolves a live breadth of meaning and adds an unstated object (“people”). The replacement retains accessible wording while leaving those terms appropriately broad.
