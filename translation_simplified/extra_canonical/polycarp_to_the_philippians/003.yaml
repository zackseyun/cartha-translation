translation:
  language: en
  text: 'Therefore, be ready to act, and serve God with reverent fear and in truth. Turn away from worthless talk and the error followed by so many people. You have believed in God, who raised our Lord Jesus Christ from the dead and gave him glory and a throne at his right hand. God placed everything in heaven and on earth under Christ’s authority. Everything that breathes serves him. He is coming to judge the living and the dead. God will require his blood from those who disobey him.


    The God who raised Christ from the dead will also raise us, if we do his will, obey his commands, and love what he loved. This includes staying away from all wrongdoing, greed, love of money, slander, and false testimony, and not repaying evil with evil, insult with insult, blow with blow, or curse with curse.


    Instead, remember what the Lord taught: “Do not judge, so that you will not be judged. Forgive, and you will be forgiven. Show mercy, so that you may receive mercy. The measure you use for others will be used for you.” He also said, “Blessed are the poor and those who are persecuted for doing what is right, because the kingdom of God belongs to them.”'
  philosophy: optimal-equivalence
