translation:
  language: en
  text: 'Everyone who does not acknowledge that Jesus Christ came in the flesh—as a real human being—is antichrist. Anyone who does not acknowledge the testimony of the cross belongs to the devil. Anyone who twists the Lord’s words to fit their own desires and says there is no resurrection or judgment is the firstborn of Satan.


    So let us leave behind the empty ways and false teachings followed by so many people. Let us return to the word handed down to us from the beginning. Let us pray with clear minds and remain steadfast in fasting. Let us earnestly ask the God who sees everything not to bring us into temptation, as the Lord said, “The spirit is willing, but the flesh is weak.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: does not confess
  simplified_phrase: does not acknowledge
  preserved_meaning: The person does not affirm the stated truth, without implying a particular motive.
  reasoning_layer_used: POB translation and grounding review
  rationale: “Acknowledge” is clearer here while “does not” avoids adding deliberate refusal.
- pob_phrase: the empty practices of the many
  simplified_phrase: the empty ways and false teachings followed by so many people
  preserved_meaning: Believers must abandon widespread, worthless conduct and false teaching.
  reasoning_layer_used: POB immediate context
  rationale: The recast wording makes “the many” natural and keeps practices distinct from teachings.
- pob_phrase: be sober in prayer and steadfast in fasting, pleading with the all-seeing God
  simplified_phrase: pray with clear minds and remain steadfast in fasting. Let us earnestly ask the God who sees everything
  preserved_meaning: They must pray watchfully, persevere in fasting, and appeal earnestly to the God who sees all.
  reasoning_layer_used: POB translation and clause structure
  rationale: Short sentences clarify the distinct exhortations without merging them.
interpretive_expansions:
- pob_phrase: came in the flesh
  rendering: came in the flesh—as a real human being
  claim: The phrase affirms Christ’s genuine human existence.
