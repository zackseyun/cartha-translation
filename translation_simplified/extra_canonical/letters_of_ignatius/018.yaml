simplification_decisions:
- pob_phrase: received ointment on his head
  simplified_phrase: had ointment poured on his head
  preserved_meaning: The Lord undergoes a literal anointing that grounds the following ointment image.
  reasoning_layer_used: POB text and English witness
  rationale: The recasting clarifies the action while preserving the anointing imagery.
- pob_phrase: breathe incorruption upon the church
  simplified_phrase: breathe life that cannot decay into the church
  preserved_meaning: The Lord imparts incorruptible life to the church through the image of breathing.
  reasoning_layer_used: POB text, immediate context, and grounding review
  rationale: The wording explains “incorruption” and makes the breath’s imparting force clear.
- pob_phrase: walk wisely, receiving the knowledge of God, which is Jesus Christ
  simplified_phrase: live wisely by receiving Jesus Christ, who is the knowledge of God
  preserved_meaning: Wise conduct is joined to receiving Christ as the knowledge of God.
  reasoning_layer_used: POB text and English witness
  rationale: Ordinary English replaces “walk” while preserving the identification of Christ.
interpretive_expansions:
- pob_phrase: be anointed with the foul odor of the teaching
  rendering: let the teaching ... coat you like foul-smelling ointment
  claim: The corrupt teaching is pictured as a foul counterpart to the Lord’s ointment.
  evidence:
  - The preceding sentence introduces ointment on the Lord’s head.
  - The POB combines anointing language with a foul odor.
  confidence: high
  alternatives_preserved:
