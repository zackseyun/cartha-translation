translation:
  language: en
  text: 'For this reason, the Lord had ointment poured on his head, so that he might breathe life that cannot decay into the church. Do not let the teaching of the prince of this world coat you like foul-smelling ointment. Otherwise, he may take you captive and rob you of the life set before you.


    Why do we not all live wisely by receiving Jesus Christ, who is the knowledge of God? Why are we perishing in our foolishness, failing to recognize the gift of grace that the Lord has truly sent?'
