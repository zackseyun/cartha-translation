  yaml_path: translation/extra_canonical/letters_of_ignatius/051.yaml
  text: 'I greet you from Smyrna, together with the churches of God that are here with me—people who refreshed me in every way, both in body and in spirit.


    My chains, which I carry for Jesus Christ’s sake, urge you, as I plead that I may reach God: remain united in harmony and in prayer with one another. For each of you, and especially the presbyters, ought to encourage the soul of your bishop, to the honor of the Father [and to the honor] of Jesus Christ and of the apostles.


    I pray that you will listen to me in love, so that, by writing this, I may not become a witness against you. And you also must pray for me, for I need your love in the mercy of God, so that I may be granted the destiny I am eager to attain and may not be found rejected.'
