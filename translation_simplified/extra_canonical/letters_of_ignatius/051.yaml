translation:
  language: en
  text: 'I greet you from Smyrna. The churches of God here with me also greet you. Their people have strengthened me in every way, both physically and spiritually.


    The chains I wear for Jesus Christ’s sake urge you, as I plead that I may reach God: stay united and pray for one another. Each of you—especially the elders—should give courage to your bishop. In this way you will honor the Father, Jesus Christ, and the apostles.[a]


    I pray that you will listen to me with love, so that this letter will not stand as testimony against you. You must also pray for me, for I need your love in the mercy of God, so that I may be granted the destiny I long to attain and not be found rejected.'
  philosophy: optimal-equivalence
