translation:
  language: en
  text: 'Do not overlook widows. After the Lord, be their protector. Do not let anything be done without your approval, and do nothing without God’s approval—as, in fact, you already do. Stand firm.


    Meet together more often. Seek out every person by name.


    Do not look down on enslaved people, whether men or women. But they, in turn, must not become proud. Instead, they should serve even more faithfully for God’s glory, so that they may receive the better freedom God gives. They must not seek to be freed using public funds, or they may prove to be slaves to their desires.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Let meetings be held more frequently.
  simplified_phrase: Meet together more often.
  preserved_meaning: The community should gather more frequently.
  reasoning_layer_used: POB translation and immediate context
  rationale: The passive wording becomes a clear direct command.
- pob_phrase: let them not in turn be puffed up
  simplified_phrase: they, in turn, must not become proud
  preserved_meaning: Enslaved people are warned against becoming self-important.
  reasoning_layer_used: POB translation and English witness
  rationale: The familiar wording clearly conveys the original idiom.
- pob_phrase: slaves of lust
  simplified_phrase: slaves to their desires
  preserved_meaning: Wrongful desires can hold people in another kind of slavery.
  reasoning_layer_used: POB metaphor and immediate contrast
  rationale: This avoids an exclusively sexual reading while preserving the slavery image.
interpretive_expansions:
- pob_phrase: at public expense
  rendering: using public funds
  claim: The expense refers to publicly or commonly held money used to secure release.
  evidence:
  - The immediate clause concerns being freed at someone else’s expense.
  confidence: moderate
  alternatives_preserved:
  - at public expense
  - using common funds
translation_notes:
  risk_flags:
