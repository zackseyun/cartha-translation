translation:
  language: en
  text: 'I am writing to you from Smyrna and sending this letter through the Ephesians, who deserve every commendation. Crocus, who is very dear to me, is also here with me, along with many others.


    As for those who traveled ahead of me from Syria to Rome for the glory of God, I believe you have received instructions about them. Let them also know that I am near, because they are all worthy of God and of you, and it is right for you to support them in every way.


    I am writing to you on August 24.[1] Farewell. Continue to wait patiently for Jesus Christ to the end.'
  philosophy: optimal-equivalence
