translation:
  language: en
  text: 'The ruler of this world knew nothing of Mary’s virginity, the birth of her child, or the Lord’s death. These three mysteries, worthy of being proclaimed aloud, took place in God’s silence. How, then, were they revealed through the ages?


    A star appeared in the heavens, shining more brightly than every other star. Its light was beyond description, and its strange appearance filled everyone with amazement. All the other constellations, along with the sun and moon, seemed to form a chorus around it. Yet this star outshone them all. Everyone wondered where this strange light, so unlike the others, had come from.


    From that time on, every kind of sorcery and every magic spell was undone. Ignorance connected with wickedness disappeared, and the ancient kingdom was overthrown. This happened when God appeared as a human being, bringing the newness of everlasting life. What God had fully prepared according to his plan began to unfold. From then on, everything was shaken, because the work of abolishing death had begun.'
