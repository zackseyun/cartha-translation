  preserved_meaning: Their love is exceptionally ordered and expressed in following God’s ways.
  reasoning_layer_used: POB text and English witness
  rationale: The wording clearly connects their ordered love with their way of life before God.
- pob_phrase: being counted worthy to bear a most godly name in these bonds, which I carry about
  simplified_phrase: I have been counted worthy to bear a most godly name in these chains that I carry
  preserved_meaning: His imprisonment is the setting in which he bears this honored name.
  reasoning_layer_used: POB participial connection and English witness
  rationale: The revision removes the false concessive contrast while making the clause easier to follow.
- pob_phrase: endure patiently all the despite of the prince of this world and escape therefrom, we shall attain unto God
  simplified_phrase: patiently endure all the hostility of the ruler of this world and escape from it, we will reach God
  preserved_meaning: Believers persevere through the world-ruler’s opposition and ultimately reach God.
  reasoning_layer_used: POB text and English witness
  rationale: Common terms replace archaic wording without weakening the opposition, endurance, or goal.
