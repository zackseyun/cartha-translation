translation:
  language: en
  text: 'When I learned how remarkably well ordered your love is as you follow God’s ways, I rejoiced and decided to write to you in the faith of Jesus Christ.


    For I have been counted worthy to bear a most godly name in these chains that I carry. So I praise the churches. I pray that they may be united in flesh and spirit, which are Jesus Christ’s—he is our life that never fails. May they also be united in faith and love, a unity valued above everything else—and above all, united with Jesus and with the Father. If we patiently endure all the hostility of the ruler of this world and escape from it, we will reach God.'
  philosophy: optimal-equivalence
