translation:
  language: en
  text: 'You have never resented anyone. Instead, you have taught others, and I want the teaching you give to remain firm.


    Only pray that I may have strength both inwardly and outwardly, so that I may not only say it but also desire it. Pray that I may not only be called a Christian but also be found to be one. If I am found to be one, then I can also be called one and remain faithful when I am no longer visible to the world.


    Nothing visible is good. Yet our God Jesus Christ, who is in the Father, is seen all the more clearly. Christianity is not a matter of persuasion but of power whenever the world hates it.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: you were the instructors of others ... the lessons you give as teachers will remain in force
  simplified_phrase: you have taught others, and I want the teaching you give to remain firm
  preserved_meaning: The Romans taught others, and Ignatius wants their teaching to continue with undiminished force.
  reasoning_layer_used: POB translation and immediate context
  rationale: The wording removes formal titles while preserving the continuing force of their teaching.
- pob_phrase: that I may not only say it but also desire it; that I may not only be called a Christian but also be found to be one
  simplified_phrase: so that I may not only say it but also desire it. Pray that I may not only be called a Christian but also be found to be one
  preserved_meaning: Ignatius distinguishes words from genuine desire and a Christian name from genuine identity.
  reasoning_layer_used: POB translation and repeated contrasts
  rationale: Two sentences clarify the parallel contrasts without defining the inward and outward dimensions.
- pob_phrase: The work is not of persuasiveness, but Christianity is a thing of power
  simplified_phrase: Christianity is not a matter of persuasion but of power
  preserved_meaning: Christianity is characterized by power rather than reliance on persuasion.
  reasoning_layer_used: POB translation and clause contrast
  rationale: Naming Christianity directly removes the unclear reference of “the work.”
translation_notes:
  risk_flags:
  - risk: “Nothing visible is good” may carry a specialized source-language sense.
    mitigation: The draft preserves the difficult POB statement because direct Greek review is pending.
  - risk: “When I am no longer visible to the world” may imply death or martyrdom without stating it.
    mitigation: The draft retains the visibility image and does not make the implication explicit.
