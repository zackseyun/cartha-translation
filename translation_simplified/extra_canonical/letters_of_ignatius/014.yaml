translation:
  language: en
  text: 'Therefore, make every effort to gather more often to thank God and glorify him. For when you gather together often, Satan’s powers are brought down, and his destructive work is undone by the unity of your faith.


    Nothing is better than peace. In peace, every conflict involving things in heaven and on earth is brought to an end.'
