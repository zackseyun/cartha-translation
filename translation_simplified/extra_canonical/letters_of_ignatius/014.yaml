simplification_decisions:
- pob_phrase: be diligent to meet together more frequently for thanksgiving to God and for his glory
  simplified_phrase: make every effort to gather more often to thank God and glorify him
  preserved_meaning: The readers are strongly urged to assemble more frequently for thanksgiving and God’s glory.
  reasoning_layer_used: POB text and English witness
  rationale: The direct wording keeps both purposes while replacing formal expressions.
- pob_phrase: his mischief comes to nothing in the concord of your faith
  simplified_phrase: his destructive work is undone by the unity of your faith
  preserved_meaning: Satan’s harmful activity is rendered ineffective in connection with the believers’ united faith.
  reasoning_layer_used: POB text, English witness, and grounding review
  rationale: This removes the unsupported reference to intent and clearly expresses both harm and united faith.
- pob_phrase: all warfare of things in heaven and things on earth is abolished
  simplified_phrase: every conflict involving things in heaven and on earth is brought to an end
  preserved_meaning: In peace, warfare across the heavenly and earthly realms ends.
  reasoning_layer_used: POB text and English witness
  rationale: The smoother clause preserves the cosmic scope without the awkward phrase “warfare of things.”
translation_notes:
  risk_flags:
  - risk: “In peace” leaves the precise relation between peace and the ending of conflict undefined.
    mitigation: This preserves the POB’s deliberate “in which” relation rather than making peace explicitly instrumental.
  - risk: Direct review of the Middle-recension Greek is still pending.
    mitigation: The draft remains within the shared meaning of the POB and its public-domain English witness.
