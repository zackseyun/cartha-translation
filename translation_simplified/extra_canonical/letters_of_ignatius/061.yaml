translation:
  language: en
  text: 'I no longer want to live as people ordinarily live, and this will happen if you want it to. Want it, so that you yourselves may also be wanted. I plead with you in this short letter: believe me.


    Jesus Christ will show you that what I am saying is true. He is the unerring mouth through whom the Father has spoken [truly].


    Pray for me, that I may attain [through the Holy Spirit]. I am not writing to you from a fleshly, merely human way of thinking, but according to the mind of God. If I suffer, it was your desire; if I am rejected, it was your hatred.'
