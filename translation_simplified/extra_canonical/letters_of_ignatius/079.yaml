- pob_phrase: he was in the flesh
  simplified_phrase: he still had a physical body
  preserved_meaning: He remained bodily real after the resurrection.
  reasoning_layer_used: POB text and English witness
  rationale: This states the bodily claim in familiar language without weakening it.
- pob_phrase: Peter and his companions
  simplified_phrase: Peter and those with him
  preserved_meaning: Jesus came to Peter and the accompanying group.
  reasoning_layer_used: POB text
  rationale: This identifies the group naturally without changing who was present.
- pob_phrase: they proved superior to death
  simplified_phrase: they showed themselves stronger than death
  preserved_meaning: They faced death as unable to gain final victory over them.
  reasoning_layer_used: Immediate context and POB wording
  rationale: This preserves the forceful comparison in clear English.
