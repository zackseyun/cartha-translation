translation:
  language: en
  text: I know and believe that he still had a physical body after the resurrection. When he came to Peter and those with him, he said, “Take hold of me and touch me. See that I am not a bodiless demon.” They touched him at once and believed, united with his flesh and blood. Because of this, they came to scorn death; indeed, they showed themselves stronger than death. After his resurrection, he both ate and drank with them as one who had a physical body, though spiritually he was united with the Father.
  philosophy: optimal-equivalence
