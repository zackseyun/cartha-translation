translation:
  language: en
  text: 'Yes, you must not take advantage of your bishop because he is young. Instead, in keeping with the power of God the Father, show him every respect. I have learned that the holy elders also do not take advantage of his youthful appearance. They yield to him as someone who is wise in God—yet not to him, but to the Father of Jesus Christ, the Bishop over all.


    Therefore, to honor the One who wanted you, you should obey sincerely, without pretense. A person who deceives the bishop they can see is not so much deceiving him as cheating the One they cannot see. In this matter, that person must answer not to a human being, but to God, who knows what is hidden.'
  philosophy: optimal-equivalence
