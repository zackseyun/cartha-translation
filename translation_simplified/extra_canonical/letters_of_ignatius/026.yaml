- pob_phrase: not to presume upon the youth of your bishop
  simplified_phrase: not take advantage of your bishop because he is young
  preserved_meaning: The bishop’s youth must not be used as an opportunity to disregard him.
  reasoning_layer_used: POB text and English witness
  rationale: The wording states the misuse of his youth in direct modern English.
- pob_phrase: the holy presbyters likewise have not taken advantage of his outwardly youthful condition
  simplified_phrase: the holy elders also do not take advantage of his youthful appearance
  preserved_meaning: The church elders do not exploit the bishop’s outward youth.
  reasoning_layer_used: POB text and English witness
  rationale: “Elders” and “youthful appearance” make the sentence accessible while preserving its contrast.
- pob_phrase: must reckon not with flesh but with God
  simplified_phrase: must answer not to a human being, but to God
  preserved_meaning: Deceiving the visible bishop brings accountability before God.
  reasoning_layer_used: POB text and English witness
  rationale: The source idiom is expressed directly as personal accountability.
