translation:
  language: en
  text: 'From Ignatius, also called Theophorus,


    to the holy church in Tralles in Asia. God, the Father of Jesus Christ, loves you. He has chosen you, and you are worthy of him. Through the suffering of Jesus Christ, you have peace in body and spirit. Jesus Christ is our hope through our resurrection to him.


    I also greet you in the divine fullness, in the apostolic manner, and wish you abundant greeting.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the church beloved by God the Father of Jesus Christ—the holy church in Tralles of Asia, chosen and worthy of God
  simplified_phrase: the holy church in Tralles in Asia. God, the Father of Jesus Christ, loves you. He has chosen you, and you are worthy of him.
  preserved_meaning: The church's location, holiness, place in God's love, election, and worthiness all remain explicit.
  reasoning_layer_used: POB text and English witness
  rationale: Short direct sentences make the long address easier to understand without dropping its claims.
- pob_phrase: having peace in flesh and spirit through the passion of Jesus Christ
  simplified_phrase: Through the suffering of Jesus Christ, you have peace in body and spirit.
  preserved_meaning: The church's bodily and spiritual peace comes through Christ's suffering.
  reasoning_layer_used: POB text and English witness
  rationale: Common terms and ordinary clause order clarify the source and scope of their peace.
- pob_phrase: which church also I salute in the Divine plenitude after the apostolic fashion, and I wish her abundant greeting
  simplified_phrase: I also greet you in the divine fullness, in the apostolic manner, and wish you abundant greeting.
  preserved_meaning: Ignatius greets the church within the broadly stated divine fullness, apostolically, and abundantly.
  reasoning_layer_used: POB text and English witness
  rationale: Direct address removes archaic syntax while retaining the closing's breadth, manner, and abundance.
