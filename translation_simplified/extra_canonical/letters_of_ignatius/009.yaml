translation:
  language: en
  text: 'Therefore, do not let anyone deceive you. In fact, you are not deceived, because you belong entirely to God. When no desire with the power to torment you becomes established within you, then you truly live in God''s way. I devote myself for you, and I offer myself as an offering for the Ephesian church, which is renowned through all ages.


    Those who belong to the flesh cannot do what belongs to the Spirit, and those who belong to the Spirit cannot do what belongs to the flesh. In the same way, faith cannot do what belongs to unfaithfulness, nor can unfaithfulness do what belongs to faith. Indeed, even what you do in the flesh is spiritual, because you do everything in Jesus Christ.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: when no desire that has the power to torment you is established within you
  simplified_phrase: When no desire with the power to torment you becomes established within you
  preserved_meaning: A tormenting desire must not become rooted within them.
  reasoning_layer_used: POB translation and English witness
  rationale: The wording removes the added two-stage process while expressing the condition naturally.
- pob_phrase: I devote myself for you, and I dedicate myself as an offering
  simplified_phrase: I devote myself for you, and I offer myself as an offering
  preserved_meaning: Ignatius states both his personal devotion for them and his sacrificial dedication for their church.
  reasoning_layer_used: POB translation and independent grounding review
  rationale: The revision keeps the two coordinated expressions distinct while making the second easier to understand.
- pob_phrase: the things you do according to the flesh
  simplified_phrase: what you do in the flesh
  preserved_meaning: Their actions in the flesh can be spiritual because everything they do is in Christ.
  reasoning_layer_used: Immediate contrast in the POB text
  rationale: The shorter clause is natural English and retains the passage's repeated flesh-and-Spirit contrast.
translation_notes:
  risk_flags:
  - risk: “Flesh” may be understood only as the physical body or always as sinful desire.
    mitigation: The repeated contrast with the Spirit is retained without adding an unsupported doctrinal explanation.
  - risk: “Offer myself as an offering” is repetitive in English.
    mitigation: The repetition preserves the distinct act and sacrificial image found in the POB.
