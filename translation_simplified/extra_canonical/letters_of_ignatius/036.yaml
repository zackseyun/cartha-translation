translation:
  language: en
  text: 'Therefore, do all you can to stand firm in the instructions of the Lord and the apostles, so that you may prosper in everything you do, in body and spirit, through faith and love, in the Son, the Father, and the Spirit, from beginning to end. Do all this together with your honored bishop, your council of elders, who form a fitting spiritual crown, and the deacons who follow God’s ways.


    Obey the bishop and one another, just as Jesus Christ obeyed the Father [as a human being], and as the apostles obeyed Christ and the Father, so that there may be unity of both body and spirit.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: be firmly established in the ordinances
  simplified_phrase: stand firm in the instructions
  preserved_meaning: They must remain firmly committed to what the Lord and the apostles directed.
  reasoning_layer_used: POB translation and English witness
  rationale: “Instructions” makes the authoritative guidance clear without weakening its force.
- pob_phrase: the fitly wreathed spiritual circlet of your presbytery
  simplified_phrase: your council of elders, who form a fitting spiritual crown
  preserved_meaning: The presbyters are pictured together as an honorably arranged spiritual crown.
  reasoning_layer_used: POB image and English witness
  rationale: The wording explains “presbytery” while retaining the crown image.
- pob_phrase: the deacons who walk after God
  simplified_phrase: the deacons who follow God’s ways
  preserved_meaning: The deacons pattern their lives according to God.
  reasoning_layer_used: POB translation and English witness
  rationale: The idiom becomes natural English while preserving its moral direction.
interpretive_expansions:
- pob_phrase: '[according to the flesh]'
  rendering: '[as a human being]'
  claim: The phrase describes Christ’s obedience during his human life.
  evidence:
