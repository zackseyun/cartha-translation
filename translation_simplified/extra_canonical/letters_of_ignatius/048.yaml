translation:
  language: en
  text: 'So turn a deaf ear when anyone speaks to you apart from Jesus Christ. He was descended from David and was the Son of Mary. He was truly born, and he ate and drank. He was truly persecuted under Pontius Pilate. He was truly crucified and died before those in heaven, on earth, and under the earth.


    He was also truly raised from the dead: his Father raised him. In the same way, his Father will also raise us who believe in him. Yes, his Father will raise us in Christ Jesus. Apart from Christ, we have no true life.'
  philosophy: optimal-equivalence
