  simplified_phrase: turn a deaf ear when anyone speaks to you
  preserved_meaning: Readers must refuse to listen while the image of deafness remains.
  reasoning_layer_used: POB translation and English witness
  rationale: The familiar idiom preserves the force of the warning in natural English.
- pob_phrase: was of the family line of David
  simplified_phrase: was descended from David
  preserved_meaning: Jesus belonged to David’s lineage.
  reasoning_layer_used: POB translation
  rationale: “Descended from” expresses family ancestry directly.
- pob_phrase: in the sight of those in heaven, those on earth, and those under the earth
  simplified_phrase: before those in heaven, on earth, and under the earth
  preserved_meaning: Jesus truly died before the full three-part cosmic audience.
  reasoning_layer_used: POB translation and English witness
  rationale: The shorter wording keeps both the witnessed event and its complete scope.
