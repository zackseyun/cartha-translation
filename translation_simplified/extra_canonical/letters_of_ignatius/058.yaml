translation:
  language: en
  text: 'From Syria to Rome, I have been fighting wild beasts all the way—on land and at sea, night and day. I am chained among ten leopards, by which I mean the soldiers guarding me. Even when people treat them kindly, they only become more cruel. Their mistreatment is making me more fully a disciple, though it does not make me right with God.


    May I rejoice in the wild beasts prepared for me. I pray they will be eager to devour me. I will even provoke them so that they devour me quickly, unlike what they did to some others, whom they were afraid to touch. If they are unwilling even though I am ready, I will force them to devour me.


    Be patient with me. I know what is best for me. Only now am I beginning to become a disciple. Let nothing seen or unseen stand in my way, so that I may reach Jesus Christ. Let fire and the cross come. Let me struggle with wild beasts. Let there be [cuts and mutilations,] bones torn apart, limbs hacked off, and my whole body crushed. Let the devil''s cruel tortures come upon me. Only let me reach Jesus Christ.'
  philosophy: optimal-equivalence
