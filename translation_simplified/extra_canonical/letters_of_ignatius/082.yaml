  simplified_phrase: every ruler, whether visible or invisible
  preserved_meaning: All ruling powers in both seen and unseen realms are included.
  reasoning_layer_used: POB translation and English witness
  rationale: The recast clarifies the scope without deciding who the rulers are.
- pob_phrase: Let no one be puffed up by office
  simplified_phrase: No one should become proud because of a position of authority.
  preserved_meaning: Holding office must not lead a person into pride.
  reasoning_layer_used: POB translation and English witness
  rationale: The idiom and institutional term are stated in ordinary modern English.
- pob_phrase: They abstain from the eucharist (thanksgiving) and prayer
  simplified_phrase: They refuse to take part in the Eucharist (thanksgiving) and in prayer
  preserved_meaning: They avoid participation in the Eucharist and prayer.
  reasoning_layer_used: POB translation and parenthetical gloss
  rationale: The wording clarifies participation while adding nothing beyond the supplied gloss.
