translation:
  language: en
  text: 'Do not let anyone deceive you. Even heavenly beings—the glorious angels and every ruler, whether visible or invisible—will face judgment if they do not believe in the blood of Christ [who is God]. Whoever can accept this should accept it. No one should become proud because of a position of authority. Faith and love matter above all else; nothing is more important than they are.


    Pay attention to those who hold strange teaching about the grace of Jesus Christ that has come to us. Their teaching opposes the mind of God. They have no concern for love, for widows or orphans, for those who suffer, for prisoners, or for anyone who is hungry or thirsty. They refuse to take part in the Eucharist (thanksgiving) and in prayer because they do not acknowledge that the Eucharist is the flesh of our Savior Jesus Christ—the same flesh that suffered for our sins and that the Father, in his goodness, raised from the dead.'
  philosophy: optimal-equivalence
