translation:
  language: en
  text: 'If anyone teaches you Judaism, do not listen to him. It is better to hear Christianity from a circumcised man than Judaism from an uncircumcised man. But anyone who does not speak about Jesus Christ, whether circumcised or not, is to me like a tombstone or a grave for the dead, marked only with human names.


    So stay away from the evil tricks and plots of the prince of this world. Otherwise, his schemes may crush you and weaken your love. Instead, all of you should gather together with one undivided heart.


    I thank my God that my conscience is clear about how I treated you. No one can claim, either privately or publicly, that I burdened anyone in any matter, small or great. I also pray that what I said among them may not become evidence against them.'
  philosophy: optimal-equivalence
