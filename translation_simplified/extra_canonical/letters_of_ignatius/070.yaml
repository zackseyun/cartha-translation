  reasoning_layer_used: POB translation and English witness
  rationale: The wording is shortened while preserving the tombstone, grave, death, and name imagery.
- pob_phrase: lest you perhaps be crushed by his schemes and grow weak in your love
  simplified_phrase: Otherwise, his schemes may crush you and weaken your love
  preserved_meaning: The schemes may harm the readers and weaken their love.
  reasoning_layer_used: POB translation
  rationale: A direct warning preserves both the danger and its uncertainty.
- pob_phrase: No one can boast, either secretly or openly, that I was a burden to anyone in small things or great
  simplified_phrase: No one can claim, either privately or publicly, that I burdened anyone in any matter, small or great
  preserved_meaning: Ignatius denies giving anyone grounds to accuse him of imposing a burden.
  reasoning_layer_used: POB translation and English witness
  rationale: Common wording makes the denial easier to follow without specifying the kind of burden.
