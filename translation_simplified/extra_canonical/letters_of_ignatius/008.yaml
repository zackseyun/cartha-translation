translation:
  language: en
  text: 'Some people deceitfully use the Name as something to sell, while doing things unworthy of God. Stay away from them as you would from wild animals. They are like mad dogs that bite in secret. Be on guard against them, because they are hard to cure.


    There is only one physician: Jesus Christ our Lord. He is both flesh and spirit, born yet without beginning, God in a human being, true Life in death, Son of Mary and Son of God. At first he could suffer; afterward, he was beyond suffering.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: to peddle the Name
  simplified_phrase: use the Name as something to sell
  preserved_meaning: This keeps both the sacred title and the image of exploiting it for gain.
  reasoning_layer_used: POB translation and English witness
  rationale: The selling image is made clear without replacing the capitalized Name.
- pob_phrase: generated and ungenerated
  simplified_phrase: born yet without beginning
  preserved_meaning: This retains the tension between Christ’s human birth and his divine lack of origin.
  reasoning_layer_used: POB antithetical structure and immediate Christological context
  rationale: The paradox is expressed in language common readers can understand.
- pob_phrase: first able to suffer and then unable to suffer
  simplified_phrase: At first he could suffer; afterward, he was beyond suffering
  preserved_meaning: This preserves the sequence from Christ’s capacity to suffer to his later impassibility.
  reasoning_layer_used: POB translation and paired-clause structure
  rationale: Two direct clauses make the theological contrast easier to follow.
interpretive_expansions:
- pob_phrase: generated and ungenerated
  rendering: born yet without beginning
  claim: The paired terms present Christ as humanly born while having no divine beginning.
  evidence:
  - The surrounding pairs contrast flesh with spirit and Son of Mary with Son of God.
  - POB preserves the terms as a deliberate paradox.
  confidence: moderate
  alternatives_preserved:
  - generated and ungenerated
  - begotten and unbegotten
