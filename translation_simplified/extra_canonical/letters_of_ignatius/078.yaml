translation:
  language: en
  text: He suffered all these things for us [to save us]. He really suffered, and he really raised himself. Some unbelievers claim that he only seemed to suffer. But they are the ones who are mere appearances. What they believe will become their own fate, because they have no bodies and are like demons.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: He truly suffered, just as he truly raised himself.
  simplified_phrase: He really suffered, and he really raised himself.
  preserved_meaning: Both his suffering and his raising of himself actually happened.
  reasoning_layer_used: POB controlling text and English witness
  rationale: The shorter parallel clauses state the contrast with mere appearance more directly.
- pob_phrase: It was not as certain unbelievers say—that he suffered only in appearance
  simplified_phrase: Some unbelievers claim that he only seemed to suffer.
  preserved_meaning: The unbelievers deny that his suffering was real.
  reasoning_layer_used: POB controlling text
  rationale: The dense negative construction becomes a direct report of their claim.
- pob_phrase: What they believe will also happen to them, for they are bodiless and demon-like.
  simplified_phrase: What they believe will become their own fate, because they have no bodies and are like demons.
  preserved_meaning: Their belief in an unreal, bodiless existence is turned back on them as their fate.
  reasoning_layer_used: POB controlling text and English witness
  rationale: Common wording clarifies the consequence while retaining the bodily and demonic imagery.
