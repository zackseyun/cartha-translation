translation:
  language: en
  text: 'Ignatius, also called Theophorus, writes to the church in Philadelphia in Asia, the church of God the Father and Jesus Christ. You have received mercy and stand firm in God’s unity. You rejoice without wavering in our Lord’s suffering and resurrection, fully assured of mercy.


    I greet you in the blood of Jesus Christ, our eternal and lasting joy—especially if you are united with your bishop, the elders who serve with him, and the deacons appointed according to the purpose of Jesus Christ. Jesus Christ strengthened and established them according to his own will through his Holy Spirit.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Ignatius, who is also Theophorus, to the church ... which has found mercy
  simplified_phrase: Ignatius, also called Theophorus, writes to the church ... You have received mercy
  preserved_meaning: Ignatius addresses the church under both names and recognizes the mercy it received.
  reasoning_layer_used: POB text and public-domain English witness
  rationale: The long address becomes direct sentences while preserving the sender, recipients, and claim of mercy.
- pob_phrase: rejoices in the passion of our Lord and in His resurrection without wavering
  simplified_phrase: You rejoice without wavering in our Lord’s suffering and resurrection
  preserved_meaning: The church steadfastly rejoices in the Lord’s suffering and resurrection.
  reasoning_layer_used: POB text and independent grounding review
  rationale: “Suffering” clarifies “passion,” while “without wavering” avoids adding faith explicitly.
- pob_phrase: the presbyters who are with him, and ... deacons ... according to the mind of Jesus Christ ... after His own will
  simplified_phrase: the elders who serve with him, and the deacons appointed according to the purpose of Jesus Christ ... according to his own will
  preserved_meaning: The elders serve with the bishop, while Christ’s purpose and his own will remain distinct expressions.
  reasoning_layer_used: POB text, English witness, and independent grounding review
  rationale: Common terms improve clarity without merging Christ’s purpose with his will.
