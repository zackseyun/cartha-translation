- pob_phrase: Keep your flesh as a temple of God; Be imitators of Jesus Christ
  simplified_phrase: Guard your body as a temple of God; Follow the example of Jesus Christ
  preserved_meaning: Readers must protect their bodily holiness and pattern their conduct after Jesus Christ.
  reasoning_layer_used: POB text and public-domain English witness
  rationale: Natural commands clarify both instructions while preserving the temple and imitation images.
