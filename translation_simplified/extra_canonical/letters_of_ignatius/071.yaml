translation:
  language: en
  text: 'Even though certain people wanted to deceive me by human means, they could not deceive the spirit, because it comes from God. It knows where it comes from and where it is going, and it uncovers what is hidden. When I was among you, I cried out in a loud voice—with God’s own voice: “Pay attention to the bishop, the council of elders, and the deacons.”


    Even so, some suspected that I said this because I already knew about a division involving certain people. But He in whom I wear these chains is my witness: I did not learn this from any human being. The Spirit proclaimed it, saying: “Do nothing without the bishop. Guard your body as a temple of God. Treasure unity. Avoid divisions. Follow the example of Jesus Christ, just as He followed the example of His Father.”'
  philosophy: optimal-equivalence
