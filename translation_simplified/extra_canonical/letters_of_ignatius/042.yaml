translation:
  language: en
  text: 'In the same way, everyone should respect the deacons as they respect Jesus Christ. They should respect the bishop as one who represents the Father, and the elders as God’s council and the apostles’ assembly. Without these leaders, a group cannot even be called a church.


    I am sure you agree about these things. Your bishop has shown me an example of your love, and I carry that example with me. His conduct itself teaches a great lesson, and his gentleness is power. I think that even those who do not honor God respect him.


    Because I love you, I am being gentle with you, though I could write more sternly on his behalf. But I did not think I was qualified to do that. I am a prisoner, not an apostle with the right to give you orders.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the presbyters as the council of God and the assembly of the apostles
  simplified_phrase: the elders as God’s council and the apostles’ assembly
  preserved_meaning: The elders are associated with both God’s council and the apostolic assembly.
  reasoning_layer_used: POB text and English witness
  rationale: “Elders” replaces the unfamiliar “presbyters,” while both institutional images remain distinct.
- pob_phrase: Apart from these, there is not even the name of a church
  simplified_phrase: Without these leaders, a group cannot even be called a church
  preserved_meaning: Ignatius says these offices are necessary for a community to bear the name church.
  reasoning_layer_used: POB text and immediate context
  rationale: The compact idiom becomes a direct statement about what can be called a church.
- pob_phrase: as a convict, to give you orders as though I were an apostle
  simplified_phrase: I am a prisoner, not an apostle with the right to give you orders
  preserved_meaning: Ignatius contrasts his imprisoned status with apostolic authority.
  reasoning_layer_used: POB text and public-domain witness
  rationale: The contrast is recast in ordinary English without weakening it.
