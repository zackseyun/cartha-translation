translation:
  language: en
  text: 'I greet the families of my brothers, including their wives and children, and the virgins known as widows. I say farewell to you in the power of the Father. Philo, who is with me, also greets you.


    I greet Tavia’s household. I pray that she may be firmly established in faith and love, in both body and spirit. I greet Alce, who is very dear to me, as well as the incomparable Daphnus and Eutecnus, and everyone else by name. Farewell in the grace of God.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the households of my brothers, with their wives and children
  simplified_phrase: the families of my brothers, including their wives and children
  preserved_meaning: The greeting includes the brothers’ households, especially their wives and children.
  reasoning_layer_used: POB controlling text and English witness
  rationale: “Families” and “including” make the household relationship clear.
- pob_phrase: she may be grounded in faith and love, both of flesh and of spirit
  simplified_phrase: she may be firmly established in faith and love, in both body and spirit
  preserved_meaning: The prayer asks for stability in faith and love involving bodily and spiritual life.
  reasoning_layer_used: POB controlling text
  rationale: This clarifies “grounded” while keeping the petition and the body-and-spirit distinction.
- pob_phrase: and all by name
  simplified_phrase: and everyone else by name
  preserved_meaning: Ignatius greets by name the others who were not separately listed.
  reasoning_layer_used: POB controlling text and immediate literary context
  rationale: “Everyone else” connects the phrase naturally to the preceding list without losing individual recognition.
