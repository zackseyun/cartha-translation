translation:
  language: en
  text: 'Since everything comes to an end, life and death are both set before us. Each person will go to their own place. There are two kinds of coins: one belongs to God and the other to the world. Each kind bears its own stamp. In the same way, unbelievers bear the stamp of this world, while the faithful, in love, bear the stamp of God the Father through Jesus Christ. Unless we freely accept dying in relation to Christ’s suffering, his life is not in us.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Seeing then that all things have an end, and these two—life and death—are set before us together
  simplified_phrase: Since everything comes to an end, life and death are both set before us.
  preserved_meaning: All things end, and life and death remain the two realities placed before us.
  reasoning_layer_used: POB text and English witness
  rationale: The sentence uses common syntax without adding the draft’s unsupported path metaphor.
- pob_phrase: there are two coinages ... and each has its proper stamp impressed upon it
  simplified_phrase: There are two kinds of coins ... Each kind bears its own stamp.
  preserved_meaning: God and the world are pictured as distinct coinages whose stamps mark those belonging to them.
  reasoning_layer_used: POB controlling metaphor
  rationale: Short sentences clarify the comparison while preserving both the coin and stamp images.
- pob_phrase: unless we of our own free choice accept to die unto his passion
  simplified_phrase: Unless we freely accept dying in relation to Christ’s suffering
  preserved_meaning: Receiving Christ’s life is tied to willingly accepting death in relation to his suffering.
  reasoning_layer_used: POB text, English witness, and grounding review
  rationale: The broad relational wording avoids choosing between participation, martyrdom, and other possible senses.
