  previous_text: 'Since everything comes to an end, two paths lie before us: life and death. Each person will go to the place that belongs to them. Think of two kinds of coins: one belongs to God and the other to the world, and each bears its own stamp. In the same way, unbelievers bear the stamp of this world, while the faithful, living in love, bear the stamp of God the Father through Jesus Christ. Unless we freely choose to die in union with Christ’s suffering, his life is not in us.'
