  previous_text: 'So I did my part as someone committed to unity. But God does not dwell where there is division and anger. The Lord forgives everyone who repents and returns to unity with God and to the bishop’s council. I trust in the grace of Jesus Christ, who will break every chain that binds you. I urge you:


