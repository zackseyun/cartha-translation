  review_summary: 'The draft usefully clarifies that Ignatius writes from Smyrna and that he is being transported from Syria to Rome as a prisoner. However, several revisions go beyond warranted simplification: “deeply,” an explicit prayer/future formulation, “yet ... serve,” and “Remain in” respectively add intensity, alter the mode of the desire, narrow an obscure phrase, and recast a farewell as an exhortation. The recommended text preserves the genuine readability gains while retaining the POB’s meaning and ambiguity where the audit trail does not justify further interpretation.'
