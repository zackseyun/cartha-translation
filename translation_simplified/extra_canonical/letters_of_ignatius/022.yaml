- pob_phrase: From there I also write to you, giving thanks to the Lord and loving Polycarp as I love you too.
  simplified_phrase: I am also writing to you from Smyrna, thanking the Lord. I love Polycarp as I love you.
  preserved_meaning: Ignatius writes from Smyrna with thanksgiving and equal love for Polycarp and his readers.
  reasoning_layer_used: POB text and immediate context
  rationale: Naming the place and dividing the clauses make the sentence easier to follow.
- pob_phrase: from which I am being led as a prisoner to Rome
  simplified_phrase: I am being taken from Syria to Rome as a prisoner.
  preserved_meaning: Ignatius is being transported as a prisoner from Syria toward Rome.
  reasoning_layer_used: POB text and English witness
  rationale: Ordinary word order clarifies the journey while preserving his captivity.
- pob_phrase: I who am the very last of the faithful there, according as I was counted worthy to be found for the honor of God
  simplified_phrase: I am the least of the believers there. I was considered worthy to be found for God’s honor.
  preserved_meaning: Ignatius calls himself lowest among Syria’s believers and says he was judged worthy in relation to God’s honor.
  reasoning_layer_used: POB text with provisional English drafting witness
  rationale: Two sentences clarify his humility without adding service or defining the obscure connection.
