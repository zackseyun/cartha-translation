translation:
  language: en
  text: 'I am devoted to you and to those you sent to Smyrna to honor God. I am also writing to you from Smyrna, thanking the Lord. I love Polycarp as I love you. Remember me, just as I desire that Jesus Christ may remember you too.


    Pray for the church in Syria. I am being taken from Syria to Rome as a prisoner. I am the least of the believers there. I was considered worthy to be found for God’s honor. Farewell in God the Father and in Jesus Christ, our shared hope.'
