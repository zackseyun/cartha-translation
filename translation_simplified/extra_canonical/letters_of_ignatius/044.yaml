  - receive these teachings
- pob_phrase: principalities
  rendering: ruling powers
  claim: The term denotes powers that rule, without specifying their exact identity.
  evidence:
  - The POB places them beside angels but gives no more precise identification.
  - The grounding review requires preserving this ambiguity.
  confidence: moderate
  alternatives_preserved:
  - principalities
  - powers
