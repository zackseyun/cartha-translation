translation:
  language: en
  text: 'Could I not write to you about heavenly things? But I am afraid that I might harm you, since you are still like infants. So be patient with me. If you cannot take in these things, you may choke on them.


    Even though I am in chains, I can understand heavenly things—the ordered ranks of angels, the gathered ranks of ruling powers, and things both visible and invisible. Yet this understanding alone does not make me a disciple. For we still lack many things, so that we may not lack God.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: being infants ... not being able to take them in, you should be choked
  simplified_phrase: since you are still like infants ... If you cannot take in these things, you may choke on them
  preserved_meaning: The readers are compared to infants who may be harmed by teaching they cannot yet receive.
  reasoning_layer_used: POB text and immediate context
  rationale: The rewrite clarifies the food-and-choking image while preserving its warning.
- pob_phrase: the arrays of the angels and the musterings of the principalities
  simplified_phrase: the ordered ranks of angels, the gathered ranks of ruling powers
  preserved_meaning: Ignatius describes angels and other ruling powers with military images of ordered groups.
  reasoning_layer_used: POB wording, English witness, and grounding review
  rationale: “Gathered ranks” keeps the military image, while “ruling powers” avoids settling their exact identity.
- pob_phrase: I myself am not yet by reason of this a disciple
  simplified_phrase: Yet this understanding alone does not make me a disciple
  preserved_meaning: Understanding heavenly realities does not by itself establish discipleship.
  reasoning_layer_used: POB text and clause logic
  rationale: The causal point is stated directly in natural modern English.
interpretive_expansions:
- pob_phrase: take them in
  rendering: take in these things
  claim: “These things” refers to the heavenly matters Ignatius might write about.
  evidence:
