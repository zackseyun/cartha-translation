translation:
  language: en
  text: Ignatius, also called Theophorus, to the church in Smyrna in Asia—the church of God the Father and of Jesus Christ the Beloved. You have received every grace through mercy. You are full of faith and love and lack no grace. You are most worthy of God and bear holy treasures. Abundant greetings in a blameless spirit and in the word of God.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: which has been mercifully endowed with every grace, being filled with faith and love and lacking in no grace
  simplified_phrase: You have received every grace through mercy. You are full of faith and love and lack no grace.
  preserved_meaning: The church received every grace through mercy, abounds in faith and love, and lacks no grace.
  reasoning_layer_used: POB text and grounding review
  rationale: Short direct sentences preserve the passive sense without naming an unstated giver.
- pob_phrase: most reverend and bearing holy treasures
  simplified_phrase: You are most worthy of God and bear holy treasures.
  preserved_meaning: The church is commended in relation to God and retains the image of carrying sacred treasures.
  reasoning_layer_used: POB wording and grounding review of the underlying epithet
  rationale: The wording restores the God-directed commendation while keeping the holy-treasure image.
- pob_phrase: 'to the church which is in Smyrna of Asia, in a blameless spirit and in the word of God: abundant greeting'
  simplified_phrase: to the church in Smyrna in Asia ... Abundant greetings in a blameless spirit and in the word of God.
  preserved_meaning: Ignatius addresses the Smyrna church and associates his abundant greeting with a blameless spirit and God's word.
  reasoning_layer_used: POB text and public-domain English witness
  rationale: The address is divided into readable sentences without resolving the uncertain attachment more narrowly.
translation_notes:
  risk_flags:
  - risk: Direct Greek review is pending, so the attachment of “in a blameless spirit and in the word of God” remains uncertain.
    mitigation: The phrases remain attached generally to the greeting rather than specifically to Ignatius or the church.
  - risk: Theophorus is retained without explanation because its source-language meaning has not been audited here.
    mitigation: It is presented only as Ignatius’s alternate name.
