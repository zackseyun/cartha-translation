translation:
  language: en
  text: So keep away from those corrupt shoots that bear deadly fruit. Anyone who tastes their fruit dies at once. These people are not planted by the Father. If they were, they would be branches of the Cross, and their fruit would never perish. Through the Cross, in his suffering, Christ calls us—us who are his members. A head cannot exist without its members. God promises union, and he himself is this union.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: shun those vile offshoots that produce deadly fruit
  simplified_phrase: keep away from those corrupt shoots that bear deadly fruit
  preserved_meaning: The forceful warning and deadly plant image remain intact.
  reasoning_layer_used: POB text and English witness
  rationale: Common words replace archaic language without weakening the warning.
- pob_phrase: if they had been, they would have been seen to be branches of the Cross, and their fruit imperishable
  simplified_phrase: If they were, they would be branches of the Cross, and their fruit would never perish.
  preserved_meaning: Those planted by the Father belong to the Cross and bear enduring fruit.
  reasoning_layer_used: POB text and English witness
  rationale: A direct conditional sentence clarifies the contrast without adding a growth relation.
- pob_phrase: Now a head cannot be found without members, since God promises union, and this union is Himself
  simplified_phrase: A head cannot exist without its members. God promises union, and he himself is this union.
  preserved_meaning: The head and members are inseparable, and the promised union is identified with God himself.
  reasoning_layer_used: POB text and English witness
  rationale: Short sentences clarify the argument while preserving the striking identity claim.
interpretive_expansions:
- pob_phrase: He, through His passion, invites us, being His members
  rendering: Through the Cross, in his suffering, Christ calls us—us who are his members.
  claim: The unnamed “He” is Christ, while membership describes those called rather than the reason for the call.
  evidence:
  - The Cross and suffering identify the subject as Christ.
  - The following head-and-members statement supports retaining the members image.
  confidence: high
  alternatives_preserved:
  - The Cross remains the means by which Christ calls.
  - Christ’s suffering remains the setting of that call.
  - Membership remains appositional rather than causal.
