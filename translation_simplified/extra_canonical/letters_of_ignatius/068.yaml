translation:
  language: en
  text: Therefore, take care to keep one shared Eucharistic celebration. For there is one flesh of our Lord Jesus Christ and one cup that unites us in his blood. There is one altar, just as there is one bishop, together with the council of elders and the deacons, my fellow servants. Do this so that in everything you do, you may act in harmony with God.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: be careful to observe one Eucharist
  simplified_phrase: take care to keep one shared Eucharistic celebration
  preserved_meaning: The community must maintain one unified Eucharistic observance.
  reasoning_layer_used: POB text and immediate unity context
  rationale: This states the shared unity directly without adding a separate command to gather together.
- pob_phrase: the presbytery
  simplified_phrase: the council of elders
  preserved_meaning: The bishop serves alongside the recognized body of elders.
  reasoning_layer_used: POB ecclesial context
  rationale: This replaces an unfamiliar church term with a clear description of the leadership body.
- pob_phrase: so that whatever you do, you may do it in accordance with God
  simplified_phrase: Do this so that in everything you do, you may act in harmony with God
  preserved_meaning: Their actions should conform to God as the intended result of this exhortation.
  reasoning_layer_used: POB controlling syntax and meaning
  rationale: The wording remains an exhortational purpose rather than becoming a guaranteed future result.
interpretive_expansions:
- pob_phrase: one cup for union in his blood
  rendering: one cup that unites us in his blood
  claim: The cup is connected with the participants’ union in Christ’s blood.
  evidence:
