  preserved_meaning: People shaped by former religious practices entered a new hope.
  reasoning_layer_used: POB translation and English witness
  rationale: The shorter sentence preserves the contrast between former practices and new hope.
- pob_phrase: shaping their lives according to the Lord’s day
  simplified_phrase: shaped their lives around the Lord’s Day
  preserved_meaning: Their way of life was now oriented around the Lord’s Day rather than Sabbath observance.
  reasoning_layer_used: POB source-driven rendering
  rationale: The recast phrase makes the life-orienting contrast clear while retaining the key term.
- pob_phrase: For even the prophets, as his disciples, were awaiting him as their teacher through the Spirit.
  simplified_phrase: Even the prophets were his disciples. Through the Spirit, they waited for him as their teacher.
  preserved_meaning: The prophets were Christ’s disciples and anticipated him through the Spirit.
  reasoning_layer_used: POB translation and English witness
  rationale: Dividing the clause clarifies both their discipleship and Spirit-enabled expectation.
