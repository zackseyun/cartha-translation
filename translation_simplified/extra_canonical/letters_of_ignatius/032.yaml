translation:
  language: en
  text: 'Those who once followed ancient practices came to a new hope. They no longer observed Sabbath days, but shaped their lives around the Lord’s Day. On that day our life also arose through him and through his death—a death that some deny. This is the mystery through which we came to believe. Because of it, we endure patiently, so that we may be found to be disciples of Jesus Christ, our only teacher.


    If this is so, how can we live apart from him? Even the prophets were his disciples. Through the Spirit, they waited for him as their teacher. They rightly awaited him, and when he came, he raised them from the dead.'
  philosophy: optimal-equivalence
