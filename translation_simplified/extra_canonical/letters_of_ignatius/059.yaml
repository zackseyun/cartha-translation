- pob_phrase: Permit me to be an imitator of the passion of my God.
  simplified_phrase: Let me follow the example of my God in his suffering and death.
  preserved_meaning: Ignatius asks to imitate Christ’s passion.
  reasoning_layer_used: POB translation and immediate context
  rationale: The technical sense of “passion” is expressed plainly as suffering and death.
- pob_phrase: let him understand what I desire and have fellow-feeling with me, for he knows the things that constrain me
  simplified_phrase: let that person understand what I long for and sympathize with me, because that person knows what compels me
  preserved_meaning: A person who has Christ within should understand Ignatius’s desire and respond with sympathetic participation.
  reasoning_layer_used: POB translation and English witness
  rationale: Natural wording preserves both sympathetic participation and the force acting upon Ignatius.
interpretive_expansions:
