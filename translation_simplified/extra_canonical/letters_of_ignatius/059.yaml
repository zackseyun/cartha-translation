translation:
  language: en
  text: 'Even the farthest reaches of the universe and all the kingdoms of this world would do me no good. It is better for me to die for Jesus Christ than to rule over the whole earth. I seek the one who died for us. I long for the one who rose again [for us].


    I am experiencing the pains of a new birth. Brothers and sisters, bear with me. Do not keep me from living; do not desire my death. Do not give me—one who wants to belong to God—to the world, or lure me with material things. Let me receive the pure light. When I arrive there, then I will truly be human.


    Let me follow the example of my God in his suffering and death. If anyone has him within, let that person understand what I long for and sympathize with me, because that person knows what compels me.'
  philosophy: optimal-equivalence
