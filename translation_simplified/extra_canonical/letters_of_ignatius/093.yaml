translation:
  language: en
  text: 'Do not let people who sound convincing but teach strange doctrine shake you. Stand firm like an anvil under the hammer. A great athlete takes blows and still wins. Above all, we must endure everything for God’s sake, so that he, in turn, may endure us.


    Be even more diligent. Pay attention to the times. Wait for the one who is above every season: the Eternal One, the Invisible One who became visible for us, the Untouchable One, the One beyond suffering who suffered for us, and the One who endured in every way for us.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: those who seem convincing but teach strange doctrine dismay you
  simplified_phrase: people who sound convincing but teach strange doctrine shake you
  preserved_meaning: Persuasive teachers can unsettle believers while teaching doctrine that is alien or aberrant.
  reasoning_layer_used: POB translation and English witness
  rationale: The wording is direct while retaining the force of “strange doctrine.”
- pob_phrase: Stand firm, like an anvil when it is struck
  simplified_phrase: Stand firm like an anvil under the hammer
  preserved_meaning: The anvil image calls for steadfastness while being struck.
  reasoning_layer_used: POB translation and source image
  rationale: Naming the hammer makes the concrete image easier to picture without weakening it.
- pob_phrase: the Untouchable, the one incapable of suffering, who suffered for our sake
  simplified_phrase: the Untouchable One, the One beyond suffering who suffered for us
  preserved_meaning: The titles preserve the paradox of transcendence and real suffering on humanity’s behalf.
  reasoning_layer_used: POB translation and English witness
  rationale: Clearer titles preserve the deliberate theological tension without adding a human limitation.
