  simplified_phrase: poisonous weeds. Jesus Christ did not cultivate them
  preserved_meaning: The harmful-growth image and Christ’s lack of responsibility for it remain intact.
  reasoning_layer_used: POB text and English witness
  rationale: Familiar farming language preserves the metaphor without explaining it away.
- pob_phrase: as many as shall repent and enter into the unity of the Church
  simplified_phrase: Those who repent and come into the unity of the Church
  preserved_meaning: Repentance and entry into the Church’s unity remain distinct ideas.
  reasoning_layer_used: POB text
  rationale: Ordinary clause structure replaces the formal future construction.
- pob_phrase: If any man follows one that makes a schism
  simplified_phrase: Anyone who follows a person who causes a split
  preserved_meaning: Following someone who creates division remains the condemned action.
  reasoning_layer_used: POB text and English witness
  rationale: Inclusive wording and “split” make the warning immediately understandable.
