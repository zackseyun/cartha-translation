  reasoning_layer_used: POB text and English witness
  rationale: Common wording replaces an older figurative expression without weakening the warning.
- pob_phrase: remain inseparable from [God] Jesus Christ, from the bishop, and from the ordinances of the Apostles
  simplified_phrase: stay united with [God] Jesus Christ and the bishop, and ... do not depart from the apostles’ commands
  preserved_meaning: Readers must remain loyal to Christ, the bishop, and apostolic directives.
  reasoning_layer_used: POB text and English witness
  rationale: The dense coordination is recast into natural clauses while preserving each object of loyalty.
- pob_phrase: without the bishop, presbytery, and deacons
  simplified_phrase: apart from the bishop, the council of elders, and the deacons
  preserved_meaning: The person acts independently of the named church leaders.
  reasoning_layer_used: POB text and English witness
  rationale: The unfamiliar term “presbytery” is expressed by its institutional sense here.
