translation:
  language: en
  text: 'So be on your guard against such people. You will certainly be able to do this if you do not become proud, if you stay united with [God] Jesus Christ and the bishop, and if you do not depart from the apostles’ commands.


    Anyone inside the sanctuary is clean, but anyone outside it is unclean. In other words, anyone who acts apart from the bishop, the council of elders, and the deacons does not have a clean conscience.'
  philosophy: optimal-equivalence
