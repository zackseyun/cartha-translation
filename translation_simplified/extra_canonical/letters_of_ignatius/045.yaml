translation:
  language: en
  text: 'Therefore I urge you—not I myself, but the love of Jesus Christ—to feed only on Christian teaching. Stay away from strange plants, by which I mean heresy.


    These people mix poison into what they teach about Jesus Christ. They deceive others by appearing honorable. They are like people who put a deadly drug into wine sweetened with honey. Someone who does not know what is in it drinks without fear, enjoying its sweetness while drinking in death.'
  philosophy: optimal-equivalence
