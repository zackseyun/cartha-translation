translation:
  language: en
  text: 'In God, I welcomed the name you bear—a dearly loved name that is rightly yours. You bear it with upright character, through faith and love in Jesus Christ our Savior. You imitate God, and your hearts have been set on fire by the blood of God. You have fully carried out the work that fits who you are.


    You heard that I was traveling from Syria in chains for the sake of the common Name and hope. I hoped that, through your prayers, I would succeed in facing the wild beasts in Rome and so have the power to be a disciple. When you heard this, you eagerly came to see me.


    So, in God’s name, I have received your whole community through Onesimus. His love is beyond words, and he is also your bishop in the flesh.[1] I pray that you will love him in a way that honors Jesus Christ and that all of you will be like him. Blessed is the One who granted you such a bishop, in keeping with what you deserve.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: '1'
    text: “In the flesh” may mean that Onesimus is their bishop in person or may refer to his earthly service.
    reason: lexical_alternative
