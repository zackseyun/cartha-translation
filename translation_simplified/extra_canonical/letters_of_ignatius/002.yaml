- pob_phrase: in bonds for the sake of the common Name and hope
  simplified_phrase: in chains for the sake of the common Name and hope
  preserved_meaning: Ignatius is imprisoned for the sacred Name and hope held in common.
  reasoning_layer_used: POB wording and capitalization
  rationale: “In chains” clarifies imprisonment without narrowing who shares the Name and hope.
- pob_phrase: I have received your whole multitude in the person of Onesimus
  simplified_phrase: I have received your whole community through Onesimus
  preserved_meaning: Receiving Onesimus represented receiving the entire Ephesian community.
  reasoning_layer_used: POB text and English witness
  rationale: The representative relationship is expressed in natural modern English.
