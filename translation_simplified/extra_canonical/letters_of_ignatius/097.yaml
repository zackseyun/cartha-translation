translation_notes:
  risk_flags:
  - risk: “Reach God through suffering” may be mistaken for earning salvation by suffering.
    mitigation: The draft preserves the POB’s conditional wording and adds no claim about merit.
  - risk: “God’s courier” may sound like a formal church office.
    mitigation: The surrounding instructions identify the courier simply as the person chosen and sent to Syria.
