translation:
  language: en
  text: 'I have not been able to write to all the churches because, as God’s will directed, I had to sail suddenly from Troas to Neapolis. So you must write to the churches farther along the way. As one who has the mind of God, write so that they too may do the same: those who can should send messengers, and the others should send letters with the people you send. Then you will be honored for a deed that will always be remembered, and such a deed is worthy of you.


    I greet everyone by name, especially the wife of Epitropus, her entire household, and those belonging to her children. I greet my beloved Attalus. I also greet the person who will be chosen to go to Syria. May grace always be with him and with Polycarp, who sends him.


    I always bid you farewell in our God, Jesus Christ. Remain in him, in unity and under God’s oversight. I greet Alce, whose name is very dear to me. Farewell in the Lord.'
