  english_witness: 'The love of the brethren which are in Troas saluteth you; from whence also I write to you by the hand of Burrhus, whom ye sent with me jointly with the Ephesians your brethren. He hath refreshed me in all ways. And I would that all imitated him, for he is an ensample of the ministry of God. The Divine grace shall requite him in all things.


