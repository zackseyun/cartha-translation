translation:
  language: en
  text: 'The brothers and sisters in Troas send you their love and greetings. I am also writing to you from Troas. Burrhus is with me; you sent him to accompany me along with your fellow believers from Ephesus. He has encouraged and strengthened me in every way. I wish everyone would follow his example, because he shows what it means to serve God. God’s grace will reward him in every way.


    I greet your godly bishop, your honored council of elders, and the deacons who serve alongside me. I also greet each of you and all of you together in the name of Jesus Christ. I greet you in his flesh and blood, in his suffering and resurrection—both bodily and spiritual—and in unity with God and with one another. May grace, mercy, peace, and patience always be with you.'
  philosophy: optimal-equivalence
