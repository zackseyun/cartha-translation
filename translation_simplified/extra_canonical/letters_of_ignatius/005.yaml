translation:
  language: en
  text: 'So you should follow the same course as your bishop, sharing his mind—as you already do. Your honored council of elders, worthy of God, is tuned to the bishop like the strings of a lyre. In this way, Jesus Christ is sung in your unity and harmonious love.


    Every one of you should join together as a chorus. Be united in harmony, take your pitch from God, and sing with one voice through Jesus Christ to the Father. Then the Father may hear you and recognize from your good deeds that you are members of his Son. It is good for you to remain united and free from blame, so that you may always share in God.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: run in harmony with the mind of the bishop
  simplified_phrase: follow the same course as your bishop, sharing his mind
  preserved_meaning: The readers are to move in agreement with the bishop’s direction and outlook.
  reasoning_layer_used: POB text and public-domain English witness
  rationale: This explains the running image without reducing agreement to mere obedience.
- pob_phrase: being harmonious in unity and taking the key note of God
  simplified_phrase: Be united in harmony, take your pitch from God
  preserved_meaning: Their shared life and worship are ordered by God like singers following a musical pitch.
  reasoning_layer_used: POB musical imagery and immediate chorus context
  rationale: “Take your pitch” makes the musical metaphor natural and clear.
- pob_phrase: It is therefore beneficial for you to be in blameless unity
  simplified_phrase: It is good for you to remain united and free from blame
  preserved_meaning: Continuing in morally blameless unity benefits the whole community.
  reasoning_layer_used: POB text
  rationale: The abstract wording is recast as two direct qualities.
