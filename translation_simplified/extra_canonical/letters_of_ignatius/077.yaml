translation:
  language: en
  text: 'I give glory to Jesus Christ, the God who gave you such wisdom. I have seen that your faith is firm and cannot be shaken. It is as though you were nailed, in body and spirit, to the cross of the Lord Jesus Christ. Your love is firmly rooted in the blood of Christ.


    You are fully convinced that our Lord truly came from David''s family by human birth, yet is the Son of God by divine will and power. He was truly born of a virgin and baptized by John so that all righteousness might be fulfilled by him.


    For our sake, he was truly nailed to the cross in his human body under Pontius Pilate and Herod the tetrarch. We are the fruit of his most blessed suffering. Through his resurrection, he was to raise a banner for all ages for his holy and faithful people—whether Jews or Gentiles—in the one body of his Church.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: established in unshakable faith, as though nailed to the cross ... in flesh and spirit
  simplified_phrase: your faith is firm and cannot be shaken. It is as though you were nailed, in body and spirit, to the cross
  preserved_meaning: Their steadfast faith is pictured as bodily and spiritually fastened to Christ's cross.
  reasoning_layer_used: POB text and source witness
  rationale: Two shorter sentences preserve both the steadfast faith and the forceful nailing image.
- pob_phrase: truly descended from David according to the flesh
  simplified_phrase: truly came from David's family by human birth
  preserved_meaning: Jesus genuinely belongs to David's human family line.
  reasoning_layer_used: POB text and immediate christological context
  rationale: Common ancestry language clarifies the claim while preserving its emphasis on true humanity.
- pob_phrase: that through his resurrection he might raise a banner for all ages
  simplified_phrase: Through his resurrection, he was to raise a banner for all ages
  preserved_meaning: The resurrection serves the purpose of raising an enduring public sign for Christ's people.
  reasoning_layer_used: POB text, source witness, and grounding review
  rationale: The wording keeps the banner image and purpose orientation without claiming an added act of gathering.
