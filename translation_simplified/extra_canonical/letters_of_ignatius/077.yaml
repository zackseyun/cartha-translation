  english_witness: 'I give glory to Jesus Christ the God who bestowed such wisdom upon you; for I have perceived that ye are established in faith immovable, being as it were nailed on the cross of the Lord Jesus Christ, in flesh and in spirit, and firmly grounded in love in the blood of Christ, fully persuaded as touching our Lord that He is truly of the race of David according to the flesh, but Son of God by the Divine will and power, truly born of a virgin and baptized by John that all righteousness might be fulfilled by Him,


