translation:
  language: en
  text: 'I have heard that, in answer to your prayers and the loving concern you have in Christ Jesus, the church in Antioch of Syria is now at peace. Therefore, as a church of God, you should appoint a deacon to go there as God’s ambassador. He can congratulate the whole church when they gather and give glory to God’s name.


    Blessed in Jesus Christ is the person considered worthy of this service, and you yourselves will also be honored. If you desire it, you are able to do this for God’s name. The churches closest to you have sent bishops, while others have sent elders and deacons.'
