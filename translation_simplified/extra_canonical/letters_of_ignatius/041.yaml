translation:
  language: en
  text: 'When you obey the bishop as you would obey Jesus Christ, it is clear to me that you are not living according to merely human ways. You are following Jesus Christ, who died for us so that, by believing in his death, you might escape death.


    Therefore, as is already your custom, you must do nothing independently of the bishop. You must also obey the council of elders as you would obey the Apostles of Jesus Christ, our hope. For if we live in him, we will also be found in him.


    Likewise, the deacons who serve the mysteries of Jesus Christ must please everyone in every way. They are not merely attendants to food and drink, but servants of the Church of God. Therefore, they must avoid blame as they would avoid fire.'
  philosophy: optimal-equivalence
