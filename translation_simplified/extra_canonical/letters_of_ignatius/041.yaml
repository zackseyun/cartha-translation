  simplified_phrase: not living according to merely human ways. You are following Jesus Christ
  preserved_meaning: Their way of life follows Christ rather than ordinary human standards.
  reasoning_layer_used: POB translation and English witness
  rationale: The contrast is recast in direct modern English without weakening it.
- pob_phrase: do nothing without the bishop; but be obedient also to the presbytery
  simplified_phrase: do nothing independently of the bishop. You must also obey the council of elders
  preserved_meaning: The community must act under the bishop and obey its body of elders.
  reasoning_layer_used: POB translation and immediate context
  rationale: The institutional term and compressed command are made understandable to new readers.
- pob_phrase: not deacons of meats and drinks but servants of the Church of God
  simplified_phrase: not merely attendants to food and drink, but servants of the Church of God
  preserved_meaning: Their ministry is ecclesial rather than limited to serving meals.
  reasoning_layer_used: POB translation and English witness
  rationale: The contrast is clarified while retaining both kinds of service.
