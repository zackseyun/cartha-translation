  simplified_phrase: old, useless myths
  preserved_meaning: The myths are ancient and have no benefit.
  reasoning_layer_used: POB text and English witness
  rationale: Common wording preserves both their age and uselessness.
- pob_phrase: live according to Judaism
  simplified_phrase: practice Judaism
  preserved_meaning: The warning concerns continuing to follow Judaism as a religious way of life.
  reasoning_layer_used: POB text and immediate argument
  rationale: The concise verb states the religious practice clearly without broadening it to Jewish identity.
- pob_phrase: who manifested himself through Jesus Christ his Son
  simplified_phrase: This God revealed himself through his Son, Jesus Christ
  preserved_meaning: The one God made himself known through Jesus Christ, his Son.
  reasoning_layer_used: POB text and clause structure
  rationale: A separate sentence makes the referents and relationship easier to follow.
interpretive_expansions:
- pob_phrase: the divine prophets lived after Christ Jesus
  rendering: God’s prophets lived in accordance with Christ Jesus
  claim: The prophets’ lives were aligned with and shaped by Christ Jesus.
  evidence:
