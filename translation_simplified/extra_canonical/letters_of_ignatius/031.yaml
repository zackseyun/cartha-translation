translation_notes:
  risk_flags:
  - risk: “Lived in accordance with” interprets the difficult phrase “lived after Christ Jesus.”
    mitigation: It preserves a broad relation of alignment without narrowing the phrase to expectation.
  - risk: Naming “Christ’s grace” resolves an antecedent that is grammatically implicit in POB.
    mitigation: The prophets’ relation to Christ is the immediate context, and the wording avoids adding a new claim.
