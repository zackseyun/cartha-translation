translation:
  language: en
  text: 'Do not let strange teachings or old, useless myths lead you astray. If we still practice Judaism, we admit that we have not received grace.


    God’s prophets lived in accordance with Christ Jesus. That is why they too were persecuted. Christ’s grace inspired them so that disobedient people might become fully convinced that there is one God. This God revealed himself through his Son, Jesus Christ. The Son is his Word, who came forth from silence and pleased the one who sent him in every way.'
