translation:
  language: en
  text: But suppose some godless people—that is, unbelievers—are right when they say that he only seemed to suffer. They themselves are only a sham. If so, why am I in chains? Why do I want to face wild beasts? I would die for nothing. I would indeed be telling lies about the Lord.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: But if, as certain godless people—that is, unbelievers—say
  simplified_phrase: But suppose some godless people—that is, unbelievers—are right when they say
  preserved_meaning: Ignatius introduces his opponents’ claim as a condition he rejects.
  reasoning_layer_used: POB text and English witness
  rationale: The recast opening makes the hypothetical argument easier to follow.
- pob_phrase: while they themselves are mere appearances
  simplified_phrase: They themselves are only a sham.
  preserved_meaning: The opponents are dismissed through a wordplay on their claim that Christ’s suffering was only apparent.
  reasoning_layer_used: POB text and English witness
  rationale: “Sham” clearly preserves the accusation and the appearance wordplay.
- pob_phrase: Truly, then, I lie against the Lord.
  simplified_phrase: I would indeed be telling lies about the Lord.
  preserved_meaning: If Christ only seemed to suffer, Ignatius’s testimony about the Lord would be false.
  reasoning_layer_used: POB text and English witness
  rationale: The conditional form makes the conclusion clear without turning it into an actual confession.
