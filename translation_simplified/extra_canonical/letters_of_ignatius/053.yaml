  previous_text: 'Ignatius, also called Theophorus, writes to the church that has received mercy through the generosity of the Most High Father and of Jesus Christ, his only Son. This church is loved and enlightened by the will of the one who willed everything into existence, through faith in and love for Jesus Christ our God.


