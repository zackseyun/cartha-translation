  text: 'Ignatius, who is also called Theophorus, to the church that has found mercy in the generosity of the Most High Father and of Jesus Christ, his only Son; to the church beloved and enlightened through the will of him who willed all things that exist, by faith and love toward Jesus Christ our God; even to the church that has the presidency in the territory of the region of the Romans, worthy of God, worthy of honor, worthy of felicitation, worthy of praise, worthy of success, worthy in purity, and having the presidency of love, walking in the law of Christ and bearing the Father’s name; this church also I greet in the name of Jesus Christ, the Son of the Father. To those who in flesh and spirit are united to his every commandment, being filled with the grace of God without wavering, and filtered clear from every foreign stain: abundant greeting in Jesus Christ our God, in blamelessness.'
