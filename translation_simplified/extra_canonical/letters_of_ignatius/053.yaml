translation:
  language: en
  text: 'Ignatius, also called Theophorus, writes to the church that has received mercy through the generosity of the Most High Father and of Jesus Christ, his only Son. This church is loved and enlightened by the will of the one who willed all that exists, through faith in and love for Jesus Christ our God.


    You hold a leading place in the Roman region, and you lead in love. You are worthy of God, honor, celebration, praise, and success. You are pure. You live by the law of Christ and bear the Father’s name.


    I greet you in the name of Jesus Christ, the Son of the Father. In body and spirit, you are united with each of his commandments. God’s grace fills you, and you do not waver. You have been cleansed, as though filtered, from every foreign stain. I send you abundant greetings in Jesus Christ our God, with blamelessness.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the church that has the presidency in the territory of the region of the Romans
  simplified_phrase: You hold a leading place in the Roman region
  preserved_meaning: The Roman church holds a leading position in its region without defining the scope or form of that leadership.
  reasoning_layer_used: POB translation and English witness
  rationale: “Leading place” makes “presidency” understandable without adding leadership over other churches.
- pob_phrase: worthy of felicitation ... worthy in purity
  simplified_phrase: worthy of celebration ... You are pure
  preserved_meaning: The church deserves joyful honor and is commended for purity.
  reasoning_layer_used: POB translation
  rationale: The revision replaces two unnatural expressions with direct modern English.
- pob_phrase: filtered clear from every foreign stain
  simplified_phrase: cleansed, as though filtered, from every foreign stain
  preserved_meaning: The church is pictured as purified from every alien defilement.
  reasoning_layer_used: POB translation and English witness
  rationale: The result is clarified while the unusual filtering image remains visible.
