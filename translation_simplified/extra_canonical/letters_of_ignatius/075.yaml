translation:
  language: en
  text: 'Now about Philo, the deacon from Cilicia: he is well respected and now serves with me in the work of God’s word. With him is Rhaius Agathopus, a chosen man who followed me from Syria after saying farewell to this present life.[a] Both men speak well of you. I thank God for you because you welcomed them, just as I trust the Lord will welcome you. May those who dishonored them be redeemed through the grace of Jesus Christ.


    The believers in Troas send you their love. I am writing to you from here through Burrhus. The Ephesians and Smyrnaeans sent him with me as a sign of honor. The Lord Jesus Christ will honor them. They have set their hope on him in body, soul, and spirit, with faith, love, and unity.


    Farewell in Christ Jesus, the hope we all share.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The wording pictures Rhaius as having said farewell to his present life, though he was still traveling with Ignatius.
    reason: source_note
