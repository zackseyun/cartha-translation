  english_witness: 'But as touching Philo the deacon from Cilicia, a man of good report, who now also ministereth to me in the word of God, together with Rhaius Agathopus, an elect one who followeth me from Syria, having bidden farewell to this present life; the same who also bear witness to you--and I myself thank God on your behalf, because ye received them, as I trust the Lord will receive you. But may those who treated them with dishonor be redeemed through the grace of Jesus Christ.


