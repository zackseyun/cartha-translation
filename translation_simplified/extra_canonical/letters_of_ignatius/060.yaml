  reasoning_layer_used: POB text and English witness
  rationale: The directional wording makes the intended spiritual corruption clear.
- pob_phrase: who was from the seed of David
  simplified_phrase: who came from David’s family line
  preserved_meaning: Christ is identified as a descendant of David.
  reasoning_layer_used: POB text and English witness
  rationale: “Family line” clearly expresses the biblical ancestry image.
- pob_phrase: the food of corruption
