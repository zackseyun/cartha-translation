translation:
  language: en
  text: 'The ruler of this world wants to tear me apart and turn my mind away from God. So none of you who are nearby should help him. Instead, take my side—which is God’s side. Do not speak about Jesus Christ while also longing for what this world offers. Do not let envy live in you.


    Even if I myself, when I am with you, should beg you, do not obey me. Believe what I am writing now instead. I am writing while I am still alive, but I long to die. My desire has been crucified, and no fire of material desire burns in me. Only living water speaks within me, saying, “Come to the Father.”


    I find no pleasure in food that perishes or in the pleasures of this life. I desire the bread of God—the flesh of Christ, who came from David’s family line. For my drink, I desire his blood, which is love that can never perish.'
  philosophy: optimal-equivalence
