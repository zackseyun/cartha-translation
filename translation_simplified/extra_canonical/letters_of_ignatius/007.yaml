translation:
  language: en
  text: 'The more anyone sees that his bishop is silent, the more he should regard him with reverent fear. We should welcome everyone whom the master of a household sends to manage his own household as we would welcome the master who sent him. Therefore, we should clearly regard the bishop as the Lord himself.


    Onesimus freely speaks very highly of the orderly way you live together in God. You all live according to the truth, and false teaching has found no home among you. Indeed, you will not even listen to anyone unless he speaks truthfully about Jesus Christ.'
