  review_summary: The draft is substantially clearer and its rendering of heresy as “false teaching” is a warranted explanatory clarification. The final clause is also a clear expression of the immediate contrast between truth and heresy and of the stated requirement that speech concerning Jesus Christ be truthful. Revision is needed because “reserved” adds an unstated characterization to silence, while “may send someone” turns a concrete authority analogy into a mere possibility and weakens its force. The recommended text keeps the accessible wording while preserving silence and the commissioned-steward analogy.
