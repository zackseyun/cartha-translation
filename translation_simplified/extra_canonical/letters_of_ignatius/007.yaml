simplification_decisions:
- pob_phrase: in proportion as anyone sees that his bishop is silent, let him fear him the more
  simplified_phrase: The more anyone sees that his bishop is silent, the more he should regard him with reverent fear.
  preserved_meaning: The bishop's silence should increase rather than diminish reverence for him.
  reasoning_layer_used: POB text and grounding review
  rationale: The revision preserves literal silence without adding a reserved character or motive.
- pob_phrase: everyone whom the Master of the household sends to be steward over His own house, we ought to receive as Him that sent him
  simplified_phrase: We should welcome everyone whom the master of a household sends to manage his own household as we would welcome the master who sent him.
  preserved_meaning: A commissioned household manager is to be received with the authority of the master who sent him.
  reasoning_layer_used: POB household image and grounding review
  rationale: The wording explains “steward” while retaining the universal command, actual sending, and sender's authority.
- pob_phrase: no heresy has a home among you
  simplified_phrase: false teaching has found no home among you
  preserved_meaning: Teaching contrary to the truth is not accepted within their community.
  reasoning_layer_used: POB wording and immediate context
  rationale: “False teaching” clarifies “heresy” while preserving the image of having no home.
