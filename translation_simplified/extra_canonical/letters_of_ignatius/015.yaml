translation:
  language: en
  text: 'None of these things is hidden from you if your faith in Jesus Christ and your love for him are complete. Faith and love mark the beginning and the end of life: faith is the beginning, and love is the end. When the two are united, they are God, and everything else follows them toward what is truly noble.


    No one who professes faith sins, and no one who has love hates. A tree is known by its fruit. In the same way, those who claim to belong to Christ will be known by their actions. The Work is not a matter of profession. It is seen when a person is found in the power of faith to the end.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: The two, found in unity
  simplified_phrase: When the two are united
  preserved_meaning: Faith and love together are described as united.
  reasoning_layer_used: POB translation
  rationale: The wording makes the relationship easier to follow without resolving the difficult claim that follows.
- pob_phrase: everything else follows in their train toward true nobility
  simplified_phrase: everything else follows them toward what is truly noble
  preserved_meaning: Everything else follows united faith and love toward genuine nobility.
  reasoning_layer_used: POB translation and English witness
  rationale: The dated procession wording becomes direct English while retaining movement and outcome.
- pob_phrase: The tree is revealed by its fruit; likewise, those who profess to belong to Christ will be recognized by their actions.
  simplified_phrase: A tree is known by its fruit. In the same way, those who claim to belong to Christ will be known by their actions.
  preserved_meaning: Actions reveal whether a person's claim to belong to Christ is genuine, as fruit reveals a tree.
  reasoning_layer_used: POB translation and immediate context
  rationale: Two shorter sentences clarify the comparison without changing its force.
