translation:
  language: en
  text: 'Even though I was with your bishop only a short time, I shared deep fellowship with him—not merely on a human level, but in the Spirit. How much more, then, I rejoice for you, because you are closely united with him. In the same way, the Church is united with Jesus Christ, and Jesus Christ is united with the Father, so that everything may be joined together in harmony.


    Do not be deceived. Anyone who remains outside the altar’s boundaries lacks the bread of God.[a] If the prayer of one person and the prayer of another have such great power, how much more does the prayer of the bishop and the whole Church!


    Therefore, anyone who does not come to the congregation shows pride and has separated himself. For Scripture says, “God resists the proud.” So let us take care not to resist the bishop, so that through our submission we may give ourselves to God.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The POB places “of God” in brackets, marking the words as supplied or textually qualified.
    reason: source_note
