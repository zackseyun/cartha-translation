  reasoning_layer_used: POB text and English witness
  rationale: The familiar biblical name is clearer than the older fixed phrase.
- pob_phrase: the door of the Father, through which ... enter
  simplified_phrase: the door that leads to the Father ... all enter through him
  preserved_meaning: Christ remains the door through which all those named approach the Father.
  reasoning_layer_used: POB text and source image
  rationale: The direction of the door image is clarified without removing the image.
- pob_phrase: the Gospel has a unique preeminence
  simplified_phrase: the Gospel has a unique greatness
  preserved_meaning: The Gospel retains its distinctive excellence in Christ’s coming, suffering, and resurrection.
  reasoning_layer_used: POB text and immediate context
  rationale: The academic term is replaced without making the claim broader or absolute.
interpretive_expansions:
