translation:
  language: en
  text: 'The priests were good, but the High Priest is better. He has been entrusted with the Most Holy Place, and he alone has been entrusted with the hidden things of God. He is the door that leads to the Father. Abraham, Isaac, Jacob, the Prophets, the Apostles, and the whole Church all enter through him. All these come together in the unity of God.


    But the Gospel has a unique greatness in the coming of the Savior, our Lord Jesus Christ, and in his suffering and resurrection. The beloved Prophets pointed to him in their preaching, but the Gospel is the full realization of immortality. All these things are good together, if you believe through love.'
