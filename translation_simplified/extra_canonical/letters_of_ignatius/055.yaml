translation:
  language: en
  text: 'I do not want you to seek people’s approval. I want you to please God, as you already do. I will never have another opportunity like this to reach God. If you remain silent, no nobler deed could be credited to you. If you remain silent and leave me alone, I will be a word of God.[a] But if you want to preserve my bodily life, I will once again be only a cry.


    No—grant me just this: let me be poured out to God like a drink offering while the altar is still ready. Then join together as a loving chorus and sing to the Father in Jesus Christ. Sing because God has graciously allowed the bishop from Syria to be found in the West after calling him from the East. It is good for me to leave this world and go to God, so that I may rise to him.'
  philosophy: optimal-equivalence
  footnotes:
