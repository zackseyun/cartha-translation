translation:
  language: en
  text: 'Therefore, just as the Lord did nothing apart from the Father, [because he was united with him][a]—whether acting by himself or through the apostles—you also must do nothing apart from the bishop and the elders. Do not decide on your own, apart from the others, that anything is right. Instead, let there be one shared prayer, one appeal to God, one mind, and one hope, in love and blameless joy—which is Jesus Christ, than whom nothing is better.


    All of you, hurry to gather together as to one temple—God himself—and as to one altar—one Jesus Christ. He came from the one Father, is with the One, and went to the One.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The English witness marks these words with brackets; direct review of the Greek is still pending.
    reason: source_note
simplification_decisions:
- pob_phrase: without the bishop and the presbyters
  simplified_phrase: apart from the bishop and the elders
  preserved_meaning: The community must not act independently of its recognized leaders.
  reasoning_layer_used: POB text and public-domain English witness
  rationale: “Elders” gives the ordinary meaning of the church title “presbyters.”
- pob_phrase: do not attempt to think anything right for yourselves apart from others
  simplified_phrase: Do not decide on your own, apart from the others, that anything is right
  preserved_meaning: Readers are warned against isolated judgments detached from the community.
  reasoning_layer_used: POB text and public-domain English witness
  rationale: The difficult clause becomes a direct warning without dropping the reference to others.
- pob_phrase: Hasten, all of you, to come together as to one temple, even God; as to one altar, even to one Jesus Christ
  simplified_phrase: All of you, hurry to gather together as to one temple—God himself—and as to one altar—one Jesus Christ
  preserved_meaning: The temple and altar images urge the whole community toward unity in God and Christ.
  reasoning_layer_used: POB imagery and witness clause structure
  rationale: The images remain intact while the punctuation clarifies their identifications.
