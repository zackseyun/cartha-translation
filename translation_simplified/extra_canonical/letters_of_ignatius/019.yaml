translation:
  language: en
  text: 'My spirit is treated like refuse for the cross. The cross causes those who do not believe to stumble, but for us it is salvation and eternal life. Where is the wise person? Where is the skilled debater? Where is the boasting of those who are considered intelligent?


    For our God, Jesus Christ, was conceived in Mary’s womb according to God’s plan. He was a descendant of David, and he was also conceived by the Holy Spirit. He was born and was baptized so that, through his suffering, he might cleanse water.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: My spirit is made refuse for the cross
  simplified_phrase: My spirit is treated like refuse for the cross
  preserved_meaning: The speaker declares that his spirit is regarded as refuse in relation to the cross.
  reasoning_layer_used: POB text, English witness, and grounding review
  rationale: This keeps the statement declarative and preserves both the harsh image and the unexplained relation to the cross.
- pob_phrase: according to a dispensation
  simplified_phrase: according to God’s plan
  preserved_meaning: Jesus’ conception took place within God’s ordered purpose.
  reasoning_layer_used: Immediate christological context
  rationale: This expresses the divine arrangement in common English without retaining an opaque technical term.
- pob_phrase: from the seed of David
  simplified_phrase: a descendant of David
  preserved_meaning: Jesus belonged to David’s human family line.
  reasoning_layer_used: POB text and biblical lineage idiom
  rationale: The natural English expression clearly retains the ancestry claim.
interpretive_expansions:
- pob_phrase: according to a dispensation
  rendering: according to God’s plan
  claim: The dispensation is understood as God’s purposeful arrangement.
  evidence:
  - The phrase describes the manner of Jesus’ conception in the immediate sentence.
  - The POB context provides no competing interpretation.
  confidence: moderate
  alternatives_preserved:
