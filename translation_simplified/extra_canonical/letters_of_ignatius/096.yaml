translation:
  language: en
  text: 'Pay attention to the bishop, so that God may also pay attention to you. I am devoted to those who submit to the bishop, the elders, and the deacons. May God grant that I may share their portion in his presence. Work together, struggle together, run together, suffer together, lie down together, and rise up together, as God’s managers, assistants, and servants.


    Please the Commander in whose army you serve and from whom you will receive your pay. Let none of you be found to be a deserter. Let your baptism remain with you as your shield, your faith as your helmet, your love as your spear, and your endurance as your body armor. Let your deeds be like money deposited for the future, so that you may receive what is due to you. Therefore, be patient and gentle with one another, just as God is with you. May you always bring me joy.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: May it be granted me to have my portion with them in the presence of God
  simplified_phrase: May God grant that I may share their portion in his presence
  preserved_meaning: Ignatius asks to share their allotted standing before God, not merely their location.
  reasoning_layer_used: POB translation and grounding review
  rationale: The wording makes the request natural while preserving the portion-and-sharing concept.
- pob_phrase: God’s stewards, assessors, and ministers
  simplified_phrase: God’s managers, assistants, and servants
  preserved_meaning: The three roles of responsible management, accompanying support, and service remain distinct.
  reasoning_layer_used: POB translation structure and pending source-language review
  rationale: Common role words clarify the list without making “assessors” more specific than the evidence allows.
- pob_phrase: Let your works be your deposits, that you may receive your assets due to you
  simplified_phrase: Let your deeds be like money deposited for the future, so that you may receive what is due to you
  preserved_meaning: The financial image links present deeds with a future recompense.
  reasoning_layer_used: POB translation and English witness metaphor
  rationale: The banking image is explained plainly without adding a moral qualifier to “works.”
interpretive_expansions:
- pob_phrase: Let your works be your deposits
  rendering: Let your deeds be like money deposited for the future
  claim: The deposits are figurative and point toward a later recompense.
  evidence:
