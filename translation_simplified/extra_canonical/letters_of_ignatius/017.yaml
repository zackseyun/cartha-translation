translation:
  language: en
  text: 'Do not be deceived, my brothers and sisters. Those who corrupt households will not inherit the kingdom of God.


    If people who commit such sins with their bodies are put to death, how much more serious is it when someone corrupts the faith of God through evil teaching—the faith for which Jesus Christ was crucified! That person has defiled himself and will go into the fire that cannot be put out. The same will happen to anyone who listens to him.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: my brethren
  simplified_phrase: my brothers and sisters
  preserved_meaning: The address includes the whole community of believers.
  reasoning_layer_used: POB text and common English usage
  rationale: Inclusive wording clearly conveys the scope of the communal address.
- pob_phrase: do such things according to the flesh
  simplified_phrase: commit such sins with their bodies
  preserved_meaning: These sins involve bodily conduct, in contrast with corruption through teaching.
  reasoning_layer_used: Immediate contrast in the POB text
  rationale: The concrete wording makes the contrast with evil teaching easier to follow.
- pob_phrase: the unquenchable fire
  simplified_phrase: the fire that cannot be put out
  preserved_meaning: The fire is described as impossible to extinguish.
  reasoning_layer_used: POB source image
  rationale: The plain wording preserves the full force of the fire image.
interpretive_expansions:
- pob_phrase: how much more if a man
  rendering: how much more serious is it when someone
  claim: The incomplete comparison implies a judgment more serious than bodily death.
  evidence:
  - The phrase follows the statement that bodily offenders are put to death.
  - The POB preserves the rhetorical comparison “how much more.”
  confidence: high
  alternatives_preserved:
