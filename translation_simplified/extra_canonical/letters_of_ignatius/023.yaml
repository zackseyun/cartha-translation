- pob_phrase: Ignatius, who is also called Theophorus, to her who has been blessed
  simplified_phrase: From Ignatius, also called Theophorus. To the church ... blessed
  preserved_meaning: The sender, his alternate name, and the blessed recipient remain explicit.
  reasoning_layer_used: POB text and English witness
  rationale: The opening is divided into a natural sender-and-recipient form.
- pob_phrase: her who has been blessed through the grace of God the Father
  simplified_phrase: the church ... blessed by the grace of God the Father
  preserved_meaning: The church is blessed through the Father's grace.
  reasoning_layer_used: POB text
  rationale: The feminine pronoun is replaced by its clear referent.
- pob_phrase: I salute the church ... and I wish her abundant greeting
  simplified_phrase: I greet you, and I send you abundant greetings
  preserved_meaning: Ignatius directly greets the church and expresses his abundant good wishes.
  reasoning_layer_used: POB text and provisional drafting basis
  rationale: Formal third-person wording becomes natural direct address without merging the two expressions.
