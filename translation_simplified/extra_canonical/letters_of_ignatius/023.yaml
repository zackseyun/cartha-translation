translation:
  language: en
  text: 'From Ignatius, also called Theophorus.


    To the church in Magnesia on the Maeander, blessed by the grace of God the Father in Christ Jesus our Savior. In this grace I greet you, and I send you abundant greetings in God the Father and Jesus Christ.'
  philosophy: optimal-equivalence
