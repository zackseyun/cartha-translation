translation:
  language: en
  text: I know that you are filled with God, so I have written only a brief word of encouragement. Remember me in your prayers, so that I may reach God. Remember also the church in Syria. I am not worthy to be called one of its members. I need your prayers offered together and your love in God, so that the church in Syria may receive refreshment through the dew of your earnest prayers.
