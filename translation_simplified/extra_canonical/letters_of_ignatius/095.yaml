translation:
  language: en
  text: 'Stay away from evil practices—or rather, talk about them. Tell my sisters to love the Lord and to be content with their husbands in body and spirit. In the same way, charge my brothers in the name of Jesus Christ to love their wives, just as the Lord loved the Church.


    If anyone is able to remain sexually pure in honor of the Lord’s body, let that person do so without boasting. If that person boasts, that person is lost; and if this becomes known beyond the bishop, that person is defiled. When men and women marry, they should do so with the bishop’s consent, so that their marriage follows the Lord rather than being driven by lust. Let everything be done for the honor of God.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Flee evil arts—or rather, hold discourse about these.
  simplified_phrase: Stay away from evil practices—or rather, talk about them.
  preserved_meaning: The readers must avoid the evil practices while also discussing them.
  reasoning_layer_used: POB text and English witness
  rationale: Common wording replaces archaic expressions without adding a requirement to speak openly.
- pob_phrase: abide in chastity
  simplified_phrase: remain sexually pure
  preserved_meaning: The person continues in chastity without specifying all the boundaries of that state.
  reasoning_layer_used: POB wording and immediate marriage context
  rationale: This keeps the sexual sense clear while avoiding an overconfident celibacy expansion.
- pob_phrase: that the marriage may be after the Lord and not after concupiscence
  simplified_phrase: so that their marriage follows the Lord rather than being driven by lust
  preserved_meaning: Marriage should be ordered toward the Lord rather than ruled by sexual desire.
  reasoning_layer_used: POB contrast and English witness
  rationale: Natural English preserves the moral contrast and its force.
translation_notes:
  risk_flags:
