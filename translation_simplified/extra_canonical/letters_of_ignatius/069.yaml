  confidence: high
- pob_phrase: '[unto God]'
  rendering: before God
  claim: Ignatius’s hoped-for completion is understood in relation to God.
  evidence:
  - The POB retains the bracketed phrase “unto God” from its English drafting witness.
  confidence: moderate
  alternatives_preserved:
  - made complete for God
  - made complete unto God
  external_witnesses:
  - J. B. Lightfoot English witness
