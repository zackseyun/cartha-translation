translation:
  language: en
  text: 'I have not learned of anything like this among you. Even so, dear friends, I am warning you in advance because I see the devil’s traps ahead. So take up gentleness as your armor. Renew yourselves in faith, which is the Lord’s flesh, and in love, which is the blood of Jesus Christ.


    None of you should hold a grudge against a neighbor. Do not give the Gentiles any reason to speak against you. Otherwise, the foolish actions of a few may cause the whole godly community to be slandered. For it is written, “Woe to the one through whom my name is blasphemed for no reason in front of others.”'
  philosophy: optimal-equivalence
