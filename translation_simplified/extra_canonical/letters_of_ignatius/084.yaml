translation:
  language: en
  text: '[But] avoid divisions, because they are the beginning of evils. All of you should follow your bishop as Jesus Christ followed the Father. Follow the council of elders as you would the apostles, and respect the deacons as you respect God’s command. No one should conduct any church matter without the bishop. Consider a celebration of the Eucharist valid only when it is under the bishop’s oversight or when it is celebrated by someone he has authorized.


    Wherever the bishop is present, the people should gather there, just as wherever Jesus Christ is, there is the whole Church. Without the bishop’s authorization, no one may baptize or hold a fellowship meal. Whatever he approves is also pleasing to God, so that everything you do may be secure and valid.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the presbytery
  simplified_phrase: the council of elders
  preserved_meaning: The collective body of church elders remains distinct from the bishop and deacons.
  reasoning_layer_used: English witness and POB structure
  rationale: This common phrase explains the church office without using an unfamiliar historical term.
- pob_phrase: anything pertaining to the Church apart from the bishop
  simplified_phrase: conduct any church matter without the bishop
  preserved_meaning: Church activities are not to be carried out independently of episcopal oversight.
  reasoning_layer_used: POB controlling text
  rationale: The active wording states the same restriction in ordinary English.
- pob_phrase: a valid eucharist which is under the bishop or one to whom he has committed it
  simplified_phrase: a celebration of the Eucharist valid only when it is under the bishop’s oversight or celebrated by someone he has authorized
  preserved_meaning: The Eucharist is recognized as valid under the bishop’s authority, whether directly overseen or delegated.
  reasoning_layer_used: POB controlling text and public-domain witness
  rationale: The revision preserves oversight and delegation without requiring the bishop to lead personally.
interpretive_expansions:
- pob_phrase: apart from the bishop
  rendering: without the bishop’s authorization
  claim: The prohibition concerns acting without episcopal approval, not merely acting while the bishop is physically absent.
  evidence:
  - The following clause identifies what the bishop approves as acceptable.
  - The Eucharist clause permits responsibility to be delegated by the bishop.
  confidence: high
  alternatives_preserved:
  - without the bishop
  - apart from the bishop
