simplification_decisions:
- pob_phrase: have a blameless mind and are steadfast in patience
  simplified_phrase: your way of thinking is blameless and ... you remain steadfast in patience
  preserved_meaning: Their inner disposition is above reproach, and their patience is steady.
  reasoning_layer_used: POB translation and English witness
  rationale: The wording clarifies “mind” without adding faithfulness as a separate quality.
- pob_phrase: not from habit but by nature
  simplified_phrase: This is not simply a habit but part of your character.
  preserved_meaning: Their patience reflects settled character rather than mere repeated behavior.
  reasoning_layer_used: POB translation and English witness
  rationale: The contrast is expressed in familiar language without claiming how that character originated.
- pob_phrase: in him I saw the whole multitude of you
  simplified_phrase: When I saw him, it was as though I saw all of you.
  preserved_meaning: Polybius represented the whole community to Ignatius.
  reasoning_layer_used: POB translation and English witness
  rationale: The representative image becomes clear while remaining a comparison.
translation_notes:
  risk_flags:
  - risk: “Part of your character” may suggest an innate trait more strongly than the contrast requires.
    mitigation: The text contrasts character with mere habit but does not explain its origin.
  - risk: “Godly goodwill” may be less immediately transparent than a motivational paraphrase.
    mitigation: The phrase is retained to avoid claiming that devotion to God was the goodwill’s specific inward motive.
