translation:
  language: en
  text: 'I have learned that your way of thinking is blameless and that you remain steadfast in patience. This is not simply a habit but part of your character. Your bishop Polybius told me this. By the will of God and Jesus Christ, he visited me in Smyrna. He rejoiced greatly with me while I was in chains in Christ Jesus. When I saw him, it was as though I saw all of you.


    Through him I received your godly goodwill. So I gave glory, because I found that you imitate God, just as I had been told.'
