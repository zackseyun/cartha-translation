translation:
  language: en
  text: 'Those who reject God''s good gift are destroyed by their own arguments. It would be better for them to love, so that they too may rise again.


    Therefore, stay away from such people. Do not speak about them either in private or in public. Instead, pay close attention to the Prophets, and especially to the Gospel. In the Gospel, Christ''s suffering is shown to us, and his resurrection is accomplished.'
