  preserved_meaning: Ignatius addresses the Ephesian church under his additional name, Theophorus, while retaining the provisional location.
  reasoning_layer_used: POB translation and source-status note
  rationale: The recipient is named directly, and the brackets preserve the location’s provisional status.
- pob_phrase: has been blessed in greatness through the fullness of God the Father
  simplified_phrase: You have received a great blessing through the fullness of God the Father
  preserved_meaning: The church’s great blessing comes through the Father’s fullness.
  reasoning_layer_used: POB translation
  rationale: The clause is recast naturally while retaining both greatness and the relation expressed by “through.”
- pob_phrase: foreordained before the ages to be forever in abiding and unchangeable glory
