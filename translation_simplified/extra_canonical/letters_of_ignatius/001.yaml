translation:
  language: en
  text: Ignatius, also called Theophorus, to the church in Ephesus [of Asia].[a] You have received a great blessing through the fullness of God the Father. Before the ages began, God chose you for glory that lasts forever and never changes. By the will of the Father and of Jesus Christ our God, you are united and chosen in a true passion.[b] You are worthy of every joyful greeting. Abundant greetings to you in Christ Jesus and in blameless joy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The words “of Asia” remain bracketed because the underlying wording is provisional pending direct review of the Greek.
    reason: source_note
  - marker: b
    text: Here “passion” may refer to suffering, but the phrase’s precise meaning and relation to being united and chosen remain uncertain.
    reason: lexical_alternative
