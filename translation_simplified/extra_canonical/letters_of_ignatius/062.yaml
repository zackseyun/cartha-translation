translation:
  language: en
  text: 'Remember the church in Syria in your prayers. God is its shepherd in my place. Jesus Christ alone will be its bishop—he and your love.


    I am ashamed to be called one of them, because I am unworthy. I am the least of them, like someone born at the wrong time. Yet I have received mercy, so that I may be someone—if I truly reach God.


    My spirit greets you, as does the love of the churches that welcomed me in the name of Jesus Christ. They did not welcome me as merely a traveler passing through. Even churches that were not on my physical route went ahead of me from city to city.'
