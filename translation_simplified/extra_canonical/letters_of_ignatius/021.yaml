translation:
  language: en
  text: 'If Jesus Christ counts me worthy through your prayers, and if God wills, I intend to write you a second work. In it I will explain more fully what I have begun to say about God’s plan concerning Jesus Christ, the new man. This plan involves faith in him and love for him, and his suffering and resurrection—especially if the Lord reveals anything further to me.


    All of you, each and every one, should gather together in grace, united in one faith and in the one Jesus Christ. In his human ancestry he came from David’s line, and he is both Son of Man and Son of God. Gather in this way so that you may obey the bishop and the council of elders without divided minds, as you break the one bread. This bread is the medicine of immortality, the antidote to death, so that we may live forever in Jesus Christ.'
  philosophy: optimal-equivalence
