  rationale: “Work” communicates the intended writing more naturally than the dated term “tract.”
- pob_phrase: each one of you severally, person by person
  simplified_phrase: All of you, each and every one
  preserved_meaning: The call to gather includes every individual member.
  reasoning_layer_used: POB text and public-domain English witness
  rationale: The familiar phrase preserves the repeated emphasis on every person.
- pob_phrase: the presbytery without distraction of mind
