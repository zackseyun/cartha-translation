translation:
  language: en
  text: 'Therefore, let us not fail to recognize his goodness. If he dealt with us as our deeds deserve, we would be lost. Since we have become his disciples, let us learn to live in a way worthy of Christianity. Whoever is called by any other name does not belong to God.


    So throw away the corrupt old yeast, which has become stale and sour. Turn to the new yeast, Jesus Christ. Let him be the salt that preserves you, so that none of you rots. You will be tested by your flavor.


    It is outrageous to speak about Jesus Christ while practicing Judaism. Christianity did not put its faith in Judaism; rather, Judaism put its faith in Christianity. In Christianity, people of every language believed and were gathered together to God.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: if he were to imitate us according to our deeds
  simplified_phrase: if he dealt with us as our deeds deserve
  preserved_meaning: Their deeds would bring ruin if God responded to them on that basis.
  reasoning_layer_used: POB translation and immediate argument
  rationale: This recasts the opaque comparison as the consequence indicated by the next clause.
- pob_phrase: the vile leaven that has grown stale and sour
  simplified_phrase: the corrupt old yeast, which has become stale and sour
  preserved_meaning: The disciples must reject a corrupting influence depicted as spoiled leaven.
  reasoning_layer_used: POB translation and yeast imagery
  rationale: Yeast is the common modern term, while stale and sour preserves the image of corruption.
- pob_phrase: Be salted in him, so that none of you becomes putrid
  simplified_phrase: Let him be the salt that preserves you, so that none of you rots
  preserved_meaning: Christ is presented through salt imagery as keeping disciples from decay.
  reasoning_layer_used: POB translation and salt-decay contrast
  rationale: The relationship between salt and decay is made clear without removing the concrete image.
interpretive_expansions:
- pob_phrase: Be salted in him
  rendering: Let him be the salt that preserves you
  claim: The salt image presents Christ as protecting disciples from decay.
  evidence:
  - The next clause contrasts being salted with becoming putrid.
  - The surrounding yeast and flavor language sustains the food image.
  confidence: high
  alternatives_preserved:
  - Be seasoned in him
- pob_phrase: every tongue
  rendering: people of every language
  claim: Tongue refers to people distinguished by language rather than to the physical organ.
  evidence:
  - Believing and being gathered to God are actions of people.
  - The phrase describes the broad reach of Christianity.
  confidence: high
  alternatives_preserved:
  - every language group
