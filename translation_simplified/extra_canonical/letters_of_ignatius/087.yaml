translation:
  language: en
  text: 'Your prayer has gone out to the church in Antioch of Syria. I came from there as a prisoner, wearing chains that are pleasing to God, and I greet everyone there. I am not worthy to belong to that church, for I am the least of its members. God graciously granted me this by his will, not because of anything I had done. I pray that God will give me his grace in full, so that through your prayers I may come to God.


    For your work to be completed both on earth and in heaven, your church should appoint a representative for God’s honor. Send him to Syria to rejoice with them because they are now at peace. They have regained their proper standing, and their church has been restored to its full, proper condition.


    Therefore, I think you should send one of your own people with a letter. He can join them in giving glory to God for the calm that has come to them by God’s will. Through your prayers, they are already reaching a safe harbor. Since you are mature, let your plans also show maturity. If you desire to do good, God is ready to provide the means.'
  philosophy: optimal-equivalence
