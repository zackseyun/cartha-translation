translation:
  language: en
  text: 'If you love good students, you deserve no praise for that. Instead, use gentleness to bring more harmful people under discipline. Not every wound is healed with the same ointment. Use compresses to soothe sharp pain.


    In everything, be wise as a serpent and always innocent as a dove. You are made of flesh and spirit. Deal wisely with the visible things before you, and pray that the invisible things will be revealed to you. Then you will lack nothing and will have every spiritual gift in abundance.


    The present time needs you if it is to reach God, just as pilots need winds and a storm-tossed sailor needs a harbor. Stay alert and self-controlled, like an athlete who belongs to God. The prize is freedom from decay and eternal life, and you too are convinced of this. In everything I am devoted to you—I and the chains I wear, which you cherished.'
  philosophy: optimal-equivalence
