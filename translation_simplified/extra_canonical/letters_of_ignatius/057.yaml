- pob_phrase: I am a convict
  simplified_phrase: I am a prisoner under sentence
  preserved_meaning: Ignatius contrasts his condemned status with the apostles’ authority and freedom.
  reasoning_layer_used: POB text and English drafting witness
  rationale: This avoids the common modern sense of a former prisoner.
- pob_phrase: I will be a freedman of Jesus Christ
  simplified_phrase: I will be one whom Jesus Christ has set free
  preserved_meaning: His suffering leads to freedom granted by and belonging to Christ.
  reasoning_layer_used: POB contrast between slavery and freedom
  rationale: The release-from-slavery image remains clear without the historical term “freedman.”
