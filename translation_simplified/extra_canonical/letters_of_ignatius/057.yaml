translation:
  language: en
  text: 'I am writing to all the churches, and I want everyone to know that I willingly die for God—unless you stop me. I urge you not to show me kindness when it would work against me. Let me be handed over to the wild beasts, because through them I can reach God. I am God’s wheat, ground by the teeth of wild beasts so that I may become pure bread [of Christ].


    Instead, entice the wild beasts, so that they may become my grave and leave none of my body behind. Then, after I have fallen asleep in death, I will not burden anyone. I will truly be a disciple of Jesus Christ when the world can no longer see even my body. Plead with the Lord for me, so that through these wild beasts I may be found to be a sacrifice to God.


    I do not command you as Peter and Paul did. They were apostles; I am a prisoner under sentence. They were free, but even now I am a servant. Yet if I suffer, I will be one whom Jesus Christ has set free, and I will rise free in him. Here in chains, I am learning to give up every desire.'
