  review_summary: 'The draft substantially improves readability, especially by identifying the Ephesians as believers presently in Smyrna and by separating the farewell exhortations. Those contextual clarifications are warranted by the letter’s setting. However, the final clause changes both the grammar and force of the POB’s difficult wording: readers are told to “hold firmly to” a definite, personally identified “steadfast spirit,” rather than to possess a steadfast spirit in the text’s unusual relation to Jesus Christ. Retain the POB’s open formulation there, and avoid the slightly stronger purposive wording “to bring glory.”'
