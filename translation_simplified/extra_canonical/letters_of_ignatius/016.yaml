translation:
  language: en
  text: 'It is better to be silent and be genuine than to speak without being genuine. Teaching is good when the teacher practices what he teaches. There is one Teacher who spoke, and it happened. Even what he has done in silence is worthy of the Father.


    Whoever truly possesses the word of Jesus can also listen to his silence, so that he may become complete—acting through what he says and being known through what he leaves unsaid.


    Nothing is hidden from the Lord. Even our secrets are close to him. Therefore, let us do everything knowing that he lives in us, so that we may be his temples and he himself may be in us as our God. This is true, and the love we rightly show him will also make it plain for us to see.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: to be silent and to be than to speak and not to be
  simplified_phrase: to be silent and be genuine than to speak without being genuine
  preserved_meaning: The broad contrast between authentic reality and empty speech remains intact.
  reasoning_layer_used: POB text, immediate context, and grounding review
  rationale: “Be genuine” opens the paradox without limiting it only to conduct.
- pob_phrase: if the speaker practices
  simplified_phrase: when the teacher practices what he teaches
  preserved_meaning: Good teaching requires the teacher's practice to agree with the teaching.
  reasoning_layer_used: POB text and English witness
  rationale: The immediate context clearly supplies what the teacher practices.
- pob_phrase: through his speech he may act, and through his silence he may be known
  simplified_phrase: acting through what he says and being known through what he leaves unsaid
  preserved_meaning: Speech is a means of action, while silence is a means by which the person becomes known.
  reasoning_layer_used: POB text, English witness, and grounding review
  rationale: The parallel means expressed by speech and silence are retained in natural English.
interpretive_expansions:
- pob_phrase: to be ... not to be
  rendering: be genuine ... without being genuine
  claim: The language of being is presented as authentic reality rather than mere physical existence.
  evidence:
  - The contrast sets silent being against speech without corresponding reality.
  - The next sentence applies the contrast to a teacher who practices what he teaches.
  confidence: moderate
  alternatives_preserved:
  - The wording remains broader than merely living consistently with one's speech.
