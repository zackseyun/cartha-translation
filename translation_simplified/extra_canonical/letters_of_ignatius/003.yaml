translation:
  language: en
  text: 'As for my fellow servant Burrhus, he serves as your deacon by God’s will and is blessed in every way. I ask you to let him remain with me. This will bring honor to you and to your bishop.


    Crocus also is worthy of God and of you. I welcomed him as an example of your love for me, and he has helped me in every way. In the same way, may the Father of Jesus Christ refresh him, together with Onesimus, Burrhus, Euplus, and Fronto. When I looked on these men with love, it was as though I saw all of you.


    May I always find joy in you, if I am worthy of it. Since Jesus Christ has honored you, you should honor him in every way. Be fully united in obedience as you submit to your bishop and the body of elders. Then you may be made holy in every way.'
  philosophy: optimal-equivalence
