translation_notes:
  risk_flags:
  - risk: “Body of elders” interprets the institutional term “presbytery” as a collective group.
    mitigation: It preserves both the elders’ identity and the term’s collective sense.
  - risk: “Then” can sound more sequential than POB’s purpose-result construction.
    mitigation: It is retained only as a clear link between united submission and being made holy.
