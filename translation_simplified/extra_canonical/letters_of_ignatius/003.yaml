  english_witness: 'But as touching my fellow servant Burrhus, who by the will of God is your deacon blessed in all things, I pray that he may remain with me to the honor of yourselves and of your bishop. Yea, and Crocus also, who is worthy of God and of you whom I received as an ensample of the love which ye bear me, hath relieved me in all ways--even so may the Father of Jesus Christ refresh him--together with Onesimus and Burrhus and Euplus and Fronto; in whom I saw you all with the eyes of love.


    May I have joy of you always, if so be I an worthy of it. It is therefore meet for you in every way to glorify Jesus Christ who glorified you; that being perfectly joined together in one submission, submitting yourselves to your bishop and presbytery, ye may be sanctified in all things.'
