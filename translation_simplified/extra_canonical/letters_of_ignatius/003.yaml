  simplified_phrase: he serves as your deacon by God’s will
  preserved_meaning: Burrhus serves them as deacon according to God’s will.
  reasoning_layer_used: POB translation and English witness
  rationale: A direct sentence makes Burrhus’s role and its divine basis easier to follow.
- pob_phrase: In them I saw you all with the eyes of love
  simplified_phrase: When I looked on these men with love, it was as though I saw all of you
  preserved_meaning: Ignatius affectionately saw the delegates as representatives of the whole community.
  reasoning_layer_used: POB image and immediate context
  rationale: The wording explains the image while preserving love, sight, and representation.
- pob_phrase: your bishop and presbytery
  simplified_phrase: your bishop and the body of elders
  preserved_meaning: They are to submit to their bishop and the collective group of presbyters.
  reasoning_layer_used: POB ecclesial wording and English witness
  rationale: The unfamiliar institutional term is replaced with a clear collective description.
