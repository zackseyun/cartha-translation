translation:
  language: en
  text: I was allowed to see you represented in Damas, your godly bishop; in Bassus and Apollonius, your worthy elders; and in Zotion, the deacon and my fellow servant. I hope to rejoice in Zotion, because he submits to the bishop as to the grace of God, and to the body of elders as to the law of Jesus Christ.
