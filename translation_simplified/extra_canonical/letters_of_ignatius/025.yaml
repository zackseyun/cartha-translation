simplification_decisions:
- pob_phrase: see you in the person of Damas
  simplified_phrase: see you represented in Damas
  preserved_meaning: Ignatius saw the church community through its representatives.
  reasoning_layer_used: POB text and English witness
  rationale: The wording makes the representative sense of the idiom clear.
- pob_phrase: your worthy presbyters Bassus and Apollonius
  simplified_phrase: Bassus and Apollonius, your worthy elders
  preserved_meaning: Bassus and Apollonius held the church office named by presbyters.
  reasoning_layer_used: POB text and drafting witness
  rationale: “Elders” is the common English equivalent of “presbyters.”
- pob_phrase: whom I would gladly rejoice in
  simplified_phrase: I hope to rejoice in Zotion
  preserved_meaning: Ignatius expresses a prospective desire to rejoice in Zotion rather than present gladness.
  reasoning_layer_used: POB wording and grounding review
  rationale: A separate sentence preserves the wish-like force while clarifying its subject.
