translation:
  language: en
  text: 'I have learned that some people came through your area from elsewhere, bringing evil teaching. But you refused to let them plant that teaching in you. You closed your ears so that you would not accept what they sowed. You are stones prepared in advance for the temple God the Father is building. The cross of Jesus Christ is the lifting device that raises you up to the heights. The Holy Spirit is the rope, your faith is the winch, and love is the path that leads up to God.


    Therefore, all of you are traveling companions on this path. You carry your God, your shrine, your Christ, and your holy things with you. From head to foot, you are clothed in the commandments of Jesus Christ. I share in your celebration, and through this letter I am able to travel with you and rejoice with you. For you do not set your love on anything belonging merely to ordinary human life, but on God alone.'
  philosophy: optimal-equivalence
