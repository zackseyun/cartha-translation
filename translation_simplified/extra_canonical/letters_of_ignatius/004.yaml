translation:
  language: en
  text: 'I am not giving you orders as if I were someone important. Though I am in chains for the sake of the Name, I have not yet become complete in Jesus Christ. I am only beginning to be a disciple, so I speak to you as fellow students. You should train me for the contest through your faith, encouragement and correction, endurance, and patience.


    But love will not let me remain silent about you. So I am eager to urge you to run together in harmony with God’s mind. Jesus Christ, our life from whom we cannot be separated, is the Father’s mind. In the same way, the bishops appointed in the farthest parts of the earth are in harmony with the mind of Jesus Christ.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: I do not command you as though I were someone important
  simplified_phrase: I am not giving you orders as if I were someone important
  preserved_meaning: Ignatius humbly denies having the status to command his readers.
  reasoning_layer_used: POB translation and English witness
  rationale: The natural modern wording preserves his humility.
- pob_phrase: I ought to be trained by you for the contest
  simplified_phrase: You should train me for the contest
  preserved_meaning: The readers are to prepare Ignatius while the athletic contest image remains intact.
  reasoning_layer_used: POB translation and English witness
  rationale: The active sentence makes clear who trains whom.
- pob_phrase: our inseparable life
  simplified_phrase: our life from whom we cannot be separated
  preserved_meaning: Christ is the believers’ life and remains inseparably joined to them.
  reasoning_layer_used: POB translation
  rationale: The expanded clause makes the compressed description immediately understandable.
interpretive_expansions:
- pob_phrase: admonition
  rendering: encouragement and correction
  claim: Admonition includes constructive urging as well as warning or correction.
  evidence:
  - The term names one way the readers are to train Ignatius.
  confidence: moderate
  alternatives_preserved:
  - instruction
  - exhortation
- pob_phrase: are in the mind of Jesus Christ
  rendering: are in harmony with the mind of Jesus Christ
  claim: The bishops are aligned with Christ’s mind without implying that they possess it.
  evidence:
  - The preceding sentence calls believers to run in harmony with God’s mind.
  confidence: moderate
  alternatives_preserved:
  - are aligned with the mind of Jesus Christ
  - are ordered according to the mind of Jesus Christ
translation_notes:
  risk_flags:
