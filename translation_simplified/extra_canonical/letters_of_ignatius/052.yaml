translation:
  language: en
  text: 'The Smyrnaeans and Ephesians send you their love and greetings. Remember the church in Syria when you pray. I am not worthy even to be called one of its members, for I am the least of them.


    Farewell in Jesus Christ. Submit to the bishop as you would obey the commandment, and submit also to the council of elders. Each of you must love the others with an undivided heart.


    My spirit is offered up for you, not only now but also when I reach God. I am still in danger, but the Father is faithful in Jesus Christ and will grant both your request and mine. May we be found blameless in him.'
