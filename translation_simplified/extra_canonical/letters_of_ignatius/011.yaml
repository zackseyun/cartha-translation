translation:
  language: en
  text: 'Pray continually for all other people too. There is still hope that they will repent and find God. So let them learn at least from the way you live.


    When they burst out in anger, be gentle. When they speak proudly, be humble. When they insult you, pray for them. When they are in error, stand firm in the faith. When they are fierce, be gentle. Do not eagerly imitate them by paying them back.


    By patiently bearing with them, let us show ourselves to be their brothers. Instead, let us eagerly imitate the Lord. Let us compete with one another over who will suffer greater wrong, be cheated, and be treated as worthless. Then nothing planted by the devil will be found growing among you. Remain in Christ Jesus in complete purity and self-control, in both body and spirit.'
  philosophy: optimal-equivalence
