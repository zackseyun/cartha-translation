translation:
  language: en
  text: He is generous. If he did not give from his goodness so that those who have done wrong could be relieved of their sins[a], not even one person in ten thousand could be made alive.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “freed from their sins.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: those who have committed iniquities
  simplified_phrase: those who have done wrong
  preserved_meaning: The phrase refers to people who have committed wrongful acts.
  reasoning_layer_used: POB controlling translation
  rationale: Common wording replaces the formal term “iniquities” without minimizing wrongdoing.
- pob_phrase: not even a ten-thousandth part of mankind
  simplified_phrase: not even one person in ten thousand
  preserved_meaning: Without his gift, only an extremely small fraction of humanity could receive life.
  reasoning_layer_used: POB optimal-equivalence philosophy
  rationale: The same proportion is stated in familiar language.
- pob_phrase: could be made alive
  simplified_phrase: could be made alive
  preserved_meaning: Life is received through another’s action, while its precise kind remains unspecified.
  reasoning_layer_used: POB controlling translation
  rationale: The passive wording avoids defining the kind of life beyond the verse.
translation_notes:
  risk_flags:
  - risk: “Relieved of their sins” may concern guilt or consequences, or freedom from the sins themselves.
    mitigation: The main text stays broad, and the footnote preserves the alternative sense.
  - risk: “Made alive” may refer to spiritual or future life not defined in this verse.
    mitigation: The draft retains the POB wording without specifying the kind of life.
