  rationale: The legal wording makes the forensic contrast clear without suggesting military defeat.
- pob_phrase: nor to cast down one who has prevailed
  simplified_phrase: or bring down the person who prevails
  preserved_meaning: No one can overturn the favorable outcome of the person who wins.
  reasoning_layer_used: POB text and lexical adjudication
  rationale: “Prevails” retains the audited legal sense of vicerit while “bring down” uses common English.
- pob_phrase: will then be able
  simplified_phrase: when judgment comes, no one will be able
  preserved_meaning: The stated impossibility applies at the time of judgment.
  reasoning_layer_used: source clause and immediate context
  rationale: The timing is moved earlier in the sentence for easier reading.
interpretive_expansions:
