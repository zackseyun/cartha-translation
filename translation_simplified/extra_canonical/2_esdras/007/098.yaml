translation:
  language: en
  text: 'The seventh order—the greatest of all those described above—is this: They will celebrate with confidence, trust without being put to shame, and rejoice without fear. They are eager to see the face of the one they served during their lives. They will be glorified[a] and receive their reward from him.'
