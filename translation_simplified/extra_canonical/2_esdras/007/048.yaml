- pob_phrase: which has alienated us
  simplified_phrase: It has separated us
  preserved_meaning: The evil heart causes estrangement rather than merely creating distance.
  reasoning_layer_used: POB wording and source context
  rationale: A new sentence and a common verb make the result easier to follow.
- pob_phrase: into the ways of death, shown us the paths of perdition
  simplified_phrase: down the ways of death, shown us paths that end in destruction
  preserved_meaning: Both road images portray movement toward death and ruin.
  reasoning_layer_used: Latin source imagery and POB translation
  rationale: The wording explains “perdition” while retaining the distinct path images.
- pob_phrase: not for a few, but for almost all who have been created
  simplified_phrase: not merely to a few, but to almost everyone who has been created
  preserved_meaning: The condition affects nearly all created people, not absolutely everyone.
  reasoning_layer_used: POB quantitative qualification
  rationale: Common wording preserves the important limit expressed by “almost.”
