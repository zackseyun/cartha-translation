translation:
  language: en
  text: An evil heart has grown within us. It has separated us from God,[a] led us into corruption and down the ways of death, shown us paths that end in destruction, and taken us far from life. This has happened not merely to a few, but to almost everyone who has been created.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The surviving Latin says “from these things,” but several ancient versions support “from God.”
    reason: textual_variant
