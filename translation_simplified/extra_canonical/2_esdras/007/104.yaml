translation:
  language: en
  text: He answered me,[a] “Because you have found favor in my sight, I will show you this too. The day of judgment is the day when every case will be decided, and it will reveal the seal of truth to everyone. For just as a father does not send his son to speak for him at the judgment, neither does a son send his father, a master his slave, or a friend someone dear to him—”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This part of the verse comes from a restored fragment missing from most medieval Latin manuscripts.
    reason: source_note
simplification_decisions:
- pob_phrase: the day of judgment is a decisive day
  simplified_phrase: The day of judgment is the day when every case will be decided
  preserved_meaning: The final judgment decisively settles each case.
  reasoning_layer_used: source text and applied grammar revision
  rationale: The wording makes the judicial force of “decisive” immediately clear.
- pob_phrase: a father does not send a son, or a son a father, or a master a slave
  simplified_phrase: a father does not send his son ... neither does a son send his father, a master his slave
  preserved_meaning: One person cannot appoint someone close or subordinate to answer in his place.
  reasoning_layer_used: POB translation and restored-fragment rationale
  rationale: Possessives and repeated syntax clarify the relationships without changing the analogy.
- pob_phrase: a friend a beloved one
  simplified_phrase: a friend someone dear to him
  preserved_meaning: Even a deeply valued personal relationship cannot transfer representation at judgment.
  reasoning_layer_used: POB footnote and translation wording
  rationale: Common wording replaces the potentially confusing noun phrase “a beloved one.”
