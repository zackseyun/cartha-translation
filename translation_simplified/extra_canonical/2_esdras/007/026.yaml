translation:
  language: en
  text: Look, the time will come when the signs I foretold to you take place. The bride and the appearing city[a] will be seen, and what is now withdrawn from the earth will be revealed.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Latin names both “the bride” and “the appearing city” without explaining their relationship; some reconstructions instead read, “the city now hidden will appear.”
    reason: source_note
