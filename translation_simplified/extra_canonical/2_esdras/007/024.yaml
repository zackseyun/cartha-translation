base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/2_esdras/007/024.yaml
  text: They despised his law and denied his promises[a], and they did not keep faith with his statutes and did not perform his works.
  footnotes:
  - marker: a
    text: Or 'denied his covenants'.
    reason: previous_rendering
  revision_pass:
    model: gpt-5.4
    timestamp: '2026-04-23T11:42:02Z'
    unchanged: false
    changes_summary: Revised 'were not faithful to his statutes' to 'did not keep faith with his statutes' to more closely reflect fidem non habuerunt while preserving formal register and natural English.
translation:
  language: en
  text: They treated his law with contempt and rejected his promises.[a] They were not faithful to his commands, and they did not carry out his works.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “rejected his covenants.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: despised his law
  simplified_phrase: treated his law with contempt
  preserved_meaning: They regarded his law with active scorn, not mere indifference.
  reasoning_layer_used: POB base text and Latin source
  rationale: The verbal phrase makes the force of “despised” immediately clear.
- pob_phrase: did not keep faith with his statutes
  simplified_phrase: were not faithful to his commands
  preserved_meaning: They failed to respond faithfully to his authoritative requirements.
  reasoning_layer_used: latest revision pass and POB base text
  rationale: “Commands” makes “statutes” familiar while “faithful” preserves the relational force.
- pob_phrase: did not perform his works
  simplified_phrase: did not carry out his works
  preserved_meaning: They failed to perform the works identified as his without specifying the exact relation.
  reasoning_layer_used: POB base text and grounding review
  rationale: “Carry out” is natural English while retaining the source’s compact possessive expression.
translation_notes:
  risk_flags:
  - risk: “His works” remains compact and may be unclear to some readers.
    mitigation: The wording preserves the source ambiguity rather than adding an unsupported requirement.
  - risk: “Promises” has a documented alternative rendering.
    mitigation: The footnote preserves “covenants” while the source-driven main choice remains “promises.”
