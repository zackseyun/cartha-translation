  reasoning_layer_used: POB translation and applied revision rationale
  rationale: The shorter sentence states the same cause directly.
- pob_phrase: because we perish knowing it
  simplified_phrase: because we know that we are perishing
  preserved_meaning: We perish with awareness of what is happening to us.
  reasoning_layer_used: applied revision rationale
  rationale: The wording preserves knowing as awareness accompanying death rather than as knowledge that should prevent it.
