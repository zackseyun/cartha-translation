translation:
  language: en
  text: This is what the Most High has appointed for them after they are separated from the corruptible vessel—the mortal body. While they lived in that body, they served the Most High through hard labor and faced danger every hour, so that they might obey the Lawgiver’s law completely.
  philosophy: optimal-equivalence
