translation:
  language: en
  text: 'Their fifth reason for joy is this: They rejoice that they have now escaped what is subject to decay and over how they will inherit what is to come.[a] Though they still see the narrow road full of hardship, they rejoice because they have been delivered.'
  philosophy: optimal-equivalence
  footnotes:
