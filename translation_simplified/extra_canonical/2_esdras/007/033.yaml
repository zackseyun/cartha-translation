  preserved_meaning: The Most High becomes openly present in the place of judgment.
  reasoning_layer_used: POB translation and Latin source
  rationale: “Appear” and “judgment seat” express the same judicial scene in ordinary English.
- pob_phrase: long-suffering will be gathered up
  simplified_phrase: his patient restraint will come to an end
  preserved_meaning: The Most High will no longer delay judgment through patient restraint.
  reasoning_layer_used: applied lexical revision, immediate judgment context, and grounding review
  rationale: The direct wording makes the idiom’s result clear while keeping patient restraint distinct from mercy.
