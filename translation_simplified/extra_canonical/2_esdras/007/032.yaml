  preserved_meaning: The dead are still pictured as silently present in the dust until it gives them back.
  reasoning_layer_used: source text and applied revision
  rationale: “Remain there” is clearer than “dwell in it” while preserving the Latin clause and its silent-rest image.
- pob_phrase: the storehouses will give back the souls entrusted to them
  simplified_phrase: The storehouses where souls have been entrusted will also give them back
  preserved_meaning: Souls are pictured as entrusted to secure keeping and later released.
  reasoning_layer_used: POB controlling translation and source image
  rationale: The relative clause makes the relationship between the storehouses and the souls easier to follow.
