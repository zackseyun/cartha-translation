  rationale: The active wording is easier to follow while keeping creation by his word explicit.
- pob_phrase: blot out the multitude of acts of contempt
  simplified_phrase: erase their many acts of contempt
  preserved_meaning: The Judge removes numerous acts marked by contempt or defiance.
  reasoning_layer_used: audited lexical revision for Latin contemptionum
  rationale: “Erase” preserves the removal image, while “acts of contempt” retains the source-driven sense rather than generic offenses.
- pob_phrase: only a very few would be left from an innumerable multitude
  simplified_phrase: only a very few would remain from that countless multitude
  preserved_meaning: Almost none of the vast number would remain.
  reasoning_layer_used: latest revision pass
  rationale: “Remain” and “countless” express the contrast in direct modern English.
