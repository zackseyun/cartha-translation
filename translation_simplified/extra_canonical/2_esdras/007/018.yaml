  preserved_meaning: The righteous bear present hardship pictured as constricted space.
  reasoning_layer_used: source text and applied revision
  rationale: The added word “confining” makes the spatial image understandable without replacing it.
- pob_phrase: hoping for broad things
  simplified_phrase: hope for what is broad and spacious
  preserved_meaning: The righteous look forward to the contrasting spacious reality.
  reasoning_layer_used: source text and consistency revision
  rationale: “Broad and spacious” clarifies the contrast while preserving the repeated image.
- pob_phrase: those who have acted ungodly
  simplified_phrase: those who have lived ungodly lives
  preserved_meaning: The phrase describes people whose conduct has been ungodly.
  reasoning_layer_used: POB controlling text
  rationale: The new wording expresses habitual conduct in natural common English.
