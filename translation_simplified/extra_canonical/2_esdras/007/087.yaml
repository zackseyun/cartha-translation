translation:
  language: en
  text: The seventh way is worse than all the others described above.[a] This is because confusion will make them waste away, terrors will consume them, and fear will make them wither as they see the glory of the Most High. They sinned in his presence while they were alive, and in the last times they will begin to be judged before him.
