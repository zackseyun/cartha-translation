translation:
  language: en
  text: And if we have been told beforehand about an everlasting hope, yet have become completely empty and futile?
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: everlasting hope has been foretold to us
  simplified_phrase: we have been told beforehand about an everlasting hope
  preserved_meaning: The everlasting hope was announced to the people in advance.
  reasoning_layer_used: POB translation and Latin source
  rationale: The active wording uses a common phrase while retaining the advance announcement.
- pob_phrase: utterly vain
  simplified_phrase: completely empty and futile
  preserved_meaning: The people have come into a profound state of emptiness and futility.
  reasoning_layer_used: Applied lexical review of Latin vani
  rationale: This avoids the modern sense of conceit and preserves the source image of emptiness and futility.
- pob_phrase: but
  simplified_phrase: yet
  preserved_meaning: The announced hope stands in sharp tension with the people's present condition.
  reasoning_layer_used: POB syntax and independent grounding review
  rationale: “Yet” expresses the contrast naturally without turning it into a question about cause.
translation_notes:
  risk_flags:
  - risk: Latin vani can suggest emptiness, futility, or worthlessness.
    mitigation: “Empty and futile” preserves the central range without overstating absolute worthlessness.
  - risk: The compressed rhetorical question may still sound unusual in English.
    mitigation: The conditional form and question mark are retained to avoid adding an unsupported causal explanation.
