  text: Qui ergo commorantes sunt in terra, hinc cruciabuntur, quoniam sensum habentes iniquitatem fecerunt, et mandata accipientes non seruauerunt ea, et legem consecuti
  language: Latin
base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/2_esdras/007/072.yaml
  text: Therefore those who dwell on the earth will be tormented for this reason, because though they had understanding they committed iniquity, and though they received commandments they did not keep them, and though they obtained the law they dealt deceitfully with it.
  revision_pass:
    model: gpt-5.4
    timestamp: '2026-04-23T11:42:13Z'
    unchanged: false
    changes_summary: Simplified the final clause from 'dealt deceitfully with what they received' to 'dealt deceitfully with it' for closer alignment with the Latin and more natural, concise English.
translation:
  language: en
  text: 'Therefore, those who live on the earth will be tormented for this reason: they understood what was right, yet they did evil. They received commandments but did not obey them. They were given the law but treated it deceitfully.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: those who dwell on the earth
  simplified_phrase: those who live on the earth
  preserved_meaning: The judgment concerns earth's inhabitants.
  reasoning_layer_used: POB controlling text
  rationale: “Live” states the same idea in more common English.
- pob_phrase: though they had understanding they committed iniquity
  simplified_phrase: they understood what was right, yet they did evil
  preserved_meaning: They knowingly acted wickedly despite having moral understanding.
  reasoning_layer_used: POB controlling text and Latin source
  rationale: The rewrite makes the contrast clear without the abstract term “iniquity.”
- pob_phrase: though they received commandments they did not keep them, and though they obtained the law they dealt deceitfully with it
  simplified_phrase: They received commandments but did not obey them. They were given the law but treated it deceitfully.
  preserved_meaning: They disobeyed the commandments and acted deceitfully toward the law they received.
  reasoning_layer_used: POB controlling text and applied revision
  rationale: Two shorter sentences clarify the parallel charges while preserving deceit as distinct from disobedience.
interpretive_expansions:
- pob_phrase: had understanding
  rendering: understood what was right
  claim: Their understanding concerned the moral difference between right and evil conduct.
  evidence:
  - The immediate contrast is that they had understanding yet committed iniquity.
  confidence: high
  alternatives_preserved:
  - had understanding
translation_notes:
  risk_flags:
  - risk: “Understood what was right” makes the object of their understanding explicit.
    mitigation: The clarification is limited to the immediate contrast with doing evil.
