- pob_phrase: and do not count yourself among those who are tormented
  simplified_phrase: Do not count yourself among those who are tormented.
  preserved_meaning: The reader must not regard himself as belonging to those undergoing torment.
  reasoning_layer_used: source text and applied verse-boundary revision
  rationale: A separate sentence makes the command clear while retaining the restored clause.
- pob_phrase: a treasury of works is laid up for you with the Most High
  simplified_phrase: A treasure of deeds is kept for you with the Most High
  preserved_meaning: A valuable store of deeds is reserved for the person in the keeping of the Most High.
  reasoning_layer_used: Latin source, POB main text, and grounding review
  rationale: This keeps the treasure image without claiming that the deeds necessarily belong to the person.
- pob_phrase: until the last times
  simplified_phrase: until the final times
  preserved_meaning: The treasure remains hidden until the closing period.
  reasoning_layer_used: POB main text
  rationale: Final is natural modern English and does not specify the timing further.
