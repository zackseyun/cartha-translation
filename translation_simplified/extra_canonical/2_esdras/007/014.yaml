translation:
  language: en
  text: Therefore, if living people do not enter these narrow and empty hardships, they cannot receive what has been stored up.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: those who live
  simplified_phrase: living people
  preserved_meaning: The condition applies to people who are alive.
  reasoning_layer_used: POB base text
  rationale: This wording identifies the people plainly without the technical sound of “the living.”
- pob_phrase: these narrow and vain things
  simplified_phrase: these narrow and empty hardships
  preserved_meaning: The present conditions are constricted and marked by emptiness or futility.
  reasoning_layer_used: POB wording and immediate context
  rationale: “Hardships” clarifies the contextual referent while “empty” avoids limiting “vain” to transience.
interpretive_expansions:
- pob_phrase: things
  rendering: hardships
  claim: The “things” are difficult conditions that living people must enter.
  evidence:
  - The adjective “narrow” presents these conditions as constricting.
  - The sentence contrasts entering them with receiving what is stored up.
  confidence: moderate
  alternatives_preserved:
  - difficult conditions
  - trials
translation_notes:
  risk_flags:
  - risk: “Empty” does not carry every possible sense of “vain.”
    mitigation: It preserves the core image of lacking substance without selecting only a temporal meaning.
  - risk: “Hardships” makes the contextual nature of the “things” explicit.
    mitigation: The modifier “narrow” supports reading them as constricting conditions.
