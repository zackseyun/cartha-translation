simplification_decisions:
- pob_phrase: the one that remains of the four beasts
  simplified_phrase: the one beast left of the four
  preserved_meaning: This beast is the last remaining member of the group of four.
  reasoning_layer_used: applied revision and POB main text
  rationale: Naming the beast directly clarifies the partitive sense without suggesting it survived an attack by the others.
- pob_phrase: which I had made to reign in my age
  simplified_phrase: I had made to rule in my age
  preserved_meaning: The speaker had caused the four beasts to exercise rule during his age.
  reasoning_layer_used: POB main text and Latin source payload
  rationale: “Rule” is more familiar than “reign,” while “had made” preserves the earlier past action.
- pob_phrase: so that through them the end of my times might come
  simplified_phrase: so that through them the end of my times might come
  preserved_meaning: Their rule serves the purpose through which the end might arrive.
  reasoning_layer_used: independent grounding review and Latin purpose construction
  rationale: Retaining “might come” preserves the purpose-oriented modal force identified by the review.
translation_notes:
  risk_flags:
  - risk: “My age” and “my times” are unusual expressions in modern English.
    mitigation: They are retained to preserve the distinction between the speaker’s appointed age and its concluding times.
