- pob_phrase: And I looked, and behold
  simplified_phrase: I looked and saw
  preserved_meaning: The vision report still marks what the seer suddenly observed.
  reasoning_layer_used: POB translation and source clause
  rationale: This replaces the formal vision formula with direct modern English.
- pob_phrase: over all the earth
  simplified_phrase: over the whole earth
  preserved_meaning: Its wings extend across the entire earth.
  reasoning_layer_used: POB translation
  rationale: “Whole earth” is more natural while keeping the universal scope.
- pob_phrase: the clouds were gathering to it
  simplified_phrase: the clouds gathered toward it
  preserved_meaning: The clouds move in its direction rather than merely surrounding it.
  reasoning_layer_used: applied lexical revision
  rationale: “Toward it” clearly preserves the directional force of Latin ad eam.
