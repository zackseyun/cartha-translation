translation:
  language: en
  text: I saw that everything under heaven was under its rule. No one opposed it—not a single creature on earth.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: everything under heaven was subjected to it
  simplified_phrase: everything under heaven was under its rule
  preserved_meaning: Everything beneath heaven was subject to its authority.
  reasoning_layer_used: POB text and immediate imperial context
  rationale: This replaces the passive construction with a clear statement of universal rule.
- pob_phrase: no one contradicted it
  simplified_phrase: No one opposed it
  preserved_meaning: No one resisted or stood against its dominion.
  reasoning_layer_used: Latin source, applied lexical revision, and grounding review
  rationale: “Opposed” preserves the broader resistance implied by the dominion context without limiting it to speech.
- pob_phrase: not even one creature that is upon the earth
  simplified_phrase: not a single creature on earth
  preserved_meaning: No earthly creature was an exception.
  reasoning_layer_used: POB text
  rationale: This shortens the clause while retaining its absolute force.
translation_notes:
  risk_flags:
  - risk: “Opposed” is broader than the most literal verbal sense of Latin contradicebat.
    mitigation: The universal-subjection context and the audited lexical revision support resistance to rule as the intended force.
