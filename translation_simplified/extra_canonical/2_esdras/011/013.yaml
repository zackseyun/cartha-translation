  yaml_path: translation/extra_canonical/2_esdras/011/013.yaml
  text: And it happened that when it reigned, its end came and it did not appear, so that its place did not appear; then the next rose up and reigned, and it held power for a long time.
  revision_pass:
    model: gpt-5.4
    timestamp: '2026-04-23T19:49:50Z'
    unchanged: false
    changes_summary: Revised the disappearance clause for closer lexical alignment with the Latin ('did not appear ... its place did not appear') and removed an interpretive rendering ('could not be seen').
translation:
  language: en
  text: While it was ruling, its end came. It appeared no more, and its place could no longer be seen. Then the next one rose up and ruled for a long time.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And it happened that when it reigned, its end came
  simplified_phrase: While it was ruling, its end came.
  preserved_meaning: Its rule was underway when its end arrived.
  reasoning_layer_used: POB base text and Latin clause sequence
  rationale: The opening formula is compressed while preserving the time relationship.
- pob_phrase: it did not appear, so that its place did not appear
  simplified_phrase: It appeared no more, and its place could no longer be seen.
  preserved_meaning: Both it and its former place ceased to be apparent.
  reasoning_layer_used: Applied revision preserving both nonappearance clauses
  rationale: The wording keeps both disappearance statements without claiming that every trace was erased.
- pob_phrase: the next rose up and reigned, and it held power for a long time
  simplified_phrase: the next one rose up and ruled for a long time
  preserved_meaning: The successor began ruling and continued for a long period.
  reasoning_layer_used: POB base text
  rationale: The succession and lengthy rule are expressed in ordinary English.
translation_notes:
  risk_flags:
  - risk: “Could no longer be seen” may suggest visibility more specifically than the repeated Latin verb for appearing.
    mitigation: It is limited to the place and preserves nonappearance without implying destruction.
