translation:
  language: en
  text: The fourth beast that appeared defeated all the beasts before it.[a] By its power it controlled that age, causing great fear, and subjected the whole world to terrible oppression. For a long time it remained in the world, using deceit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Latin text of this verse is difficult in places; this translation follows its apparent sense.
    reason: textual_variant
