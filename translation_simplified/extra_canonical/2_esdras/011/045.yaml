  simplified_phrase: you eagle, with your terrifying wings
  preserved_meaning: The eagle is directly addressed together with its fearsome wings.
  reasoning_layer_used: POB translation and source syntax
  rationale: Using “with” makes the list flow naturally without weakening the curse.
- pob_phrase: your most wicked pinions
  simplified_phrase: your most wicked wing feathers
  preserved_meaning: The eagle’s feathers are condemned as extremely wicked.
  reasoning_layer_used: POB revision preserving Latin pessima
  rationale: “Wing feathers” explains the uncommon word “pinions” while retaining the distinct image.
- pob_phrase: all your worthless body
  simplified_phrase: your entire worthless body
  preserved_meaning: The condemnation extends to the eagle’s whole body.
  reasoning_layer_used: POB translation
  rationale: “Entire” expresses the same totality in more natural English.
