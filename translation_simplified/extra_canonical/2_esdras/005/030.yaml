simplification_decisions:
- pob_phrase: if you indeed hate
  simplified_phrase: if you truly hate
  preserved_meaning: The wording keeps the emphatic force of the repeated Latin verb without overstating it.
  reasoning_layer_used: Latin source and applied revision
  rationale: “Truly” expresses the emphasis more naturally than “indeed.”
- pob_phrase: they ought to be chastised
  simplified_phrase: you yourself should discipline them
  preserved_meaning: The people remain subject to chastisement, including its punitive and corrective range.
  reasoning_layer_used: POB main text, Latin castigari, and grounding review
  rationale: “Discipline” is clearer than “chastise” and broader than merely retributive punishment.
- pob_phrase: by your own hands
  simplified_phrase: you yourself
  preserved_meaning: God must personally carry out the discipline.
  reasoning_layer_used: Latin source, POB main text, and grounding review
  rationale: The explicit reflexive preserves the personal-agency force in natural English.
translation_notes:
  risk_flags:
  - risk: “Discipline” may sound less severe than “chastise.”
    mitigation: The accusatory context and emphatic personal agency retain the statement’s gravity.
