  review_summary: The draft appropriately preserves the conditional accusation and its emphasis, and it makes the uncommon “chastised” easier to understand. However, “receive their punishment” weakens the disciplinary range of castigari and shifts the concrete personal-agency image into a less direct idiom. “You yourself should discipline them” is clear modern English, retains the corrective/punitive force without making a doctrinal claim about the purpose of suffering, and explicitly conveys the force of “by your own hands.”
