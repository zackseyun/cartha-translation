  rationale: “Just described” expresses the passive phrase naturally while “even one” keeps its rhetorical force.
- pob_phrase: so you cannot find out the judgment
  simplified_phrase: In the same way, you cannot discover the judgment
  preserved_meaning: The inability to perform those tasks parallels the inability to uncover the judgment.
  reasoning_layer_used: POB controlling translation and Latin source
  rationale: A separate sentence makes the comparison clear without adding an object or explanation absent from the source.
