translation:
  language: en
  text: '“…him more than the one who made him?”


    I answered, “No, lord. I spoke because I am grieving. Every hour I am tormented deep inside as I try to understand the path of the Most High and investigate even part of his judgment.”


    He said to me, “You cannot.”


    I asked, “Why, lord? Or why was I born? Or why did my mother’s womb not become my grave, so that I would never see Jacob’s trouble?”'
