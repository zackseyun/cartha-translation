- pob_phrase: but I have spoken in grief
  simplified_phrase: I spoke because I am grieving
  preserved_meaning: His words arise from ongoing sorrow rather than defiance.
  reasoning_layer_used: POB translation and immediate context
  rationale: The causal wording makes the relationship between his grief and speech immediately clear.
- pob_phrase: my inward parts torment me every hour
  simplified_phrase: Every hour I am tormented deep inside
  preserved_meaning: He experiences continual, intense inner anguish.
  reasoning_layer_used: POB translation and Latin source image
  rationale: “Deep inside” communicates the bodily image naturally without reducing it to a vague emotion.
- pob_phrase: seek to grasp the path of the Most High and to search out part of his judgment
  simplified_phrase: try to understand the path of the Most High and investigate even part of his judgment
  preserved_meaning: He strives to comprehend both God’s way and some portion of God’s judgment.
  reasoning_layer_used: POB translation and source-grounded revision
  rationale: The rewrite clarifies the difficult idiom while keeping the path image and the two distinct objects of inquiry.
