translation:
  language: en
  text: Chaos will arise in many places,[a] fires will often break out, and wild animals will leave their own territories.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Chaos” may refer to chasms opening in the earth, though the Latin can also be read more generally.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: chaos will come in many places
  simplified_phrase: Chaos will arise in many places
  preserved_meaning: Chaos will occur at many locations without implying that it spreads from place to place.
  reasoning_layer_used: latest revision pass and earlier source-grounded revision
  rationale: “Arise” is natural English and remains compatible with both general chaos and physical chasms.
- pob_phrase: fire will often break out
  simplified_phrase: fires will often break out
  preserved_meaning: Outbreaks of fire will happen repeatedly.
  reasoning_layer_used: POB translation
  rationale: The plural naturally conveys repeated outbreaks in modern English.
- pob_phrase: wild beasts will leave their own region
  simplified_phrase: wild animals will leave their own territories
  preserved_meaning: Wild creatures will move beyond the lands they normally occupy.
  reasoning_layer_used: POB translation
  rationale: “Wild animals” and “territories” are clearer common-English equivalents.
translation_notes:
  risk_flags:
  - risk: Modern readers may understand “chaos” only as general disorder.
    mitigation: The footnote preserves the source-grounded possibility of chasms opening in the earth.
