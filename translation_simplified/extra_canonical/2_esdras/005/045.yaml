  confidence: high
translation_notes:
  risk_flags:
  - risk: “Creatures” could be read as including more than the living beings intended here.
    mitigation: The next sentence specifies “all living beings,” and the footnote preserves the broader lexical alternative.
  - risk: “Carry” is figurative rather than literal physical transport.
    mitigation: It preserves the source image of creation bearing its living inhabitants.
