translation:
  language: en
  text: For a baby cannot give birth, and someone who has grown old can no longer give birth. In the same way, I arranged the age I created.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: just as an infant does not bear children
  simplified_phrase: a baby cannot give birth
  preserved_meaning: A very young child is not yet able to bear children.
  reasoning_layer_used: POB text and Latin source image
  rationale: “Give birth” expresses the reproductive image in clearer modern English.
- pob_phrase: nor does one who has grown old bear any longer
  simplified_phrase: someone who has grown old can no longer give birth
  preserved_meaning: Old age marks the other period when bearing children no longer occurs.
  reasoning_layer_used: applied revision and POB text
  rationale: Repeating “give birth” makes the parallel explicit and removes the awkward ellipsis.
- pob_phrase: so I ordered the age that I created
  simplified_phrase: In the same way, I arranged the age I created
  preserved_meaning: God established the created age according to an ordered pattern.
  reasoning_layer_used: POB controlling rendering
  rationale: A new sentence clarifies the comparison while “arranged” avoids suggesting a spoken command.
translation_notes:
  risk_flags:
  - risk: “Arranged the age” remains an abstract expression.
    mitigation: The wording preserves POB’s broad created-age concept without narrowing its meaning.
