  preserved_meaning: Births during youthful strength are contrasted with later births.
  reasoning_layer_used: POB source-driven rendering
  rationale: The revised wording makes the life stage and its strength immediately clear.
- pob_phrase: born toward the time of old age, when the womb is failing
  simplified_phrase: born when she is nearing old age and her womb is growing weak
  preserved_meaning: Old age is approaching, and the womb is losing strength.
  reasoning_layer_used: applied revision and Latin source
  rationale: “Nearing” preserves the approaching-time force of “sub tempus,” while “growing weak” clarifies the image.
