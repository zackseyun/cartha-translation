translation:
  language: en
  text: The Sea of Sodom will cast out fish. At night it will make a sound that many people have never heard before, but everyone will hear it.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Sea of Sodom probably refers to the Dead Sea; this wording preserves the source's allusion to Sodom.
