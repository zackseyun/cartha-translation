simplification_decisions:
- pob_phrase: Rise therefore and eat some bread
  simplified_phrase: So get up and eat some bread
  preserved_meaning: The speaker urges the person to rise and take food.
  reasoning_layer_used: POB translation and corrected Latin source alignment
  rationale: “So get up” expresses the conclusion naturally in modern English.
- pob_phrase: do not abandon us like a shepherd his flock
  simplified_phrase: Do not leave us like a shepherd who abandons his flock
  preserved_meaning: The plea compares leaving the speakers with a shepherd deserting his sheep.
  reasoning_layer_used: POB translation and source-language image
  rationale: Adding a finite verb makes the comparison immediately clear without weakening it.
- pob_phrase: into the hands of evil wolves
  simplified_phrase: to evil wolves
  preserved_meaning: The flock is left exposed and surrendered to hostile predators.
  reasoning_layer_used: latest revision pass and Latin source sense
  rationale: “Abandons his flock to” conveys being handed over while avoiding the mixed image of wolves having hands.
translation_notes:
