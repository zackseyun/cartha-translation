translation:
  language: en
  text: I said, “But Lord, you rule over those at the end. What will the people before us do? What will we do? And what will the people after us do?”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: But behold, Lord
  simplified_phrase: But Lord
  preserved_meaning: The speaker directly appeals to the Lord while raising an objection.
  reasoning_layer_used: POB translation and revision pass
  rationale: The formal attention marker “behold” is omitted because it is awkward here and adds no separate claim.
- pob_phrase: you preside over those who are at the end
  simplified_phrase: you rule over those at the end
  preserved_meaning: The Lord exercises authority over those at the end, without defining the endpoint more narrowly.
  reasoning_layer_used: POB controlling meaning and grounding review
  rationale: “Rule over” expresses governing authority in common English while retaining the phrase’s ambiguity.
- pob_phrase: what will those do who were before us, or we ourselves, or those who will be after us?
  simplified_phrase: What will the people before us do? What will we do? And what will the people after us do?
  preserved_meaning: The active question separately includes earlier, present, and later generations.
  reasoning_layer_used: Latin “quid facient,” POB clause structure, and grounding review
  rationale: Three short questions clarify the groups without changing what they are asked to do into what will happen to them.
