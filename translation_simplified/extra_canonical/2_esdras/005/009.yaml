translation:
  language: en
  text: Women will give birth to monstrous offspring associated with menstruation.[a] Salty water will be found in fresh water. All friends will wage war against one another. Then understanding will be hidden, and insight will retreat into its storehouse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
