simplification_decisions:
- pob_phrase: monstrous things in menstruation
  simplified_phrase: monstrous offspring associated with menstruation
  preserved_meaning: This retains both monstrous births and menstruation without specifying how they are related.
  reasoning_layer_used: POB footnote and applied revision
  rationale: “Associated with” avoids the unsupported temporal claim made by “during.”
- pob_phrase: in sweet waters salty waters will be found
  simplified_phrase: Salty water will be found in fresh water
  preserved_meaning: The unnatural contrast between nonsalty and salty water remains intact.
  reasoning_layer_used: POB main text and Latin source
  rationale: “Fresh water” is the ordinary modern term for water that is not salty.
- pob_phrase: insight will withdraw into its storehouse
  simplified_phrase: insight will retreat into its storehouse
  preserved_meaning: Insight remains personified as withdrawing to a place where it cannot be reached.
  reasoning_layer_used: POB main text and source image
  rationale: “Retreat” reads naturally while preserving the storehouse image.
