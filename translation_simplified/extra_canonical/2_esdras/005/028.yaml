simplification_decisions:
- pob_phrase: why have you handed over the one to the many
  simplified_phrase: why have you handed the one over to the many?
  preserved_meaning: The Lord handed the unnamed one over to the power of the many.
  reasoning_layer_used: POB translation and corrected Latin verse alignment
  rationale: Natural word order clarifies the question without identifying the deliberately unnamed one.
- pob_phrase: prepared one root above the others
  simplified_phrase: establish one root above all the others
  preserved_meaning: One root was given a place above the other roots.
  reasoning_layer_used: Source image and POB controlling wording
  rationale: “Establish” clarifies the action while preserving the root image and its superior position.
- pob_phrase: and prepared ... and scattered
  simplified_phrase: Why did you establish ... and scatter
  preserved_meaning: Both divine actions remain parts of the same anguished question.
  reasoning_layer_used: POB syntax and optimal-equivalence philosophy
  rationale: Two questions make the parallel ideas easier to follow.
translation_notes:
  risk_flags:
