  rationale: The direct invitation to consider is recast in ordinary English.
- pob_phrase: the rain is greater than the drops, and the fire greater than the smoke
  simplified_phrase: Rain is greater than its drops, and fire is greater than its smoke
  preserved_meaning: The original comparisons between rain and drops and between fire and smoke remain distinct.
  reasoning_layer_used: source payload and POB translation
  rationale: Adding “its” clarifies each image without explaining it away.
- pob_phrase: so what has passed has greatly exceeded the measure, but
  simplified_phrase: In the same way, what has passed has gone far beyond the measure. Yet
  preserved_meaning: What has passed greatly exceeds the measure, in contrast with what remains.
  reasoning_layer_used: latest revision pass
  rationale: Two short sentences make the comparison and contrast easier to follow.
