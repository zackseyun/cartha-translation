translation:
  language: en
  text: He said to me, “Think about this. Rain is greater than its drops, and fire is greater than its smoke. In the same way, what has passed has gone far beyond the measure.[a] Yet the drops and the smoke remain.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “the measure of what has passed has been far greater.”
    reason: alternative_reading
