    changes_summary: Adjusted 'come upon us daily' to 'happen among us daily' to better reflect 'pertranseunt per nos cotidie'; added 'why' before the final clause for completeness and parallelism with 'propter quod'; retained the rest with only minor punctuation smoothing.
translation:
  language: en
  text: 'For I did not want to ask about the ways above,[a] but about what happens among us every day: Why has Israel been made an object of scorn among the nations? Why have the people you loved been handed over to godless peoples? And why has the law of our ancestors been reduced to nothing?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “what comes upon us.”
    reason: lexical_alternative
