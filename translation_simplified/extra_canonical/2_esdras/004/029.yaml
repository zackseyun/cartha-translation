  rationale: “Harvested” is more familiar than “reaped” while preserving the farming image.
- pob_phrase: the place where the evil has been sown ... the field where the good has been sown
  simplified_phrase: the place sown with evil ... the field sown with good
  preserved_meaning: Both evil and good have already been sown in their respective settings.
  reasoning_layer_used: Applied revision on repeated perfect aspect
  rationale: The shorter phrases reduce repetition without changing the completed sowing or the evil-good parallel.
- pob_phrase: For if ... the field ... will not come
  simplified_phrase: For if ... the field ... will not come
  preserved_meaning: The two unmet conditions lead to the stated result.
  reasoning_layer_used: POB translation and latest revision pass
  rationale: Keeping the conditions before the result makes the logic easier to follow and retains the source image of the coming field.
