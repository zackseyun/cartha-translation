translation:
  language: en
  text: We are all full of wickedness. Perhaps because of us—because of the sins of those who live there—the threshing floor of the righteous is being held back.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The threshing floor presents the image of the righteous people’s harvest being held back.
    reason: cultural_note
  - marker: b
    text: Or “being delayed.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: full of impiety
  simplified_phrase: full of wickedness
  preserved_meaning: Their lives are characterized by serious sin and ungodliness.
  reasoning_layer_used: POB base text and Latin source
  rationale: “Wickedness” communicates the moral force of “impiety” in common English.
- pob_phrase: And perhaps because of us ... because of the sins
  simplified_phrase: Perhaps because of us—because of the sins
  preserved_meaning: The speaker cautiously identifies human sin, including their own, as the cause.
  reasoning_layer_used: POB syntax and latest revision
  rationale: The dash clarifies the repeated cause without removing “perhaps.”
- pob_phrase: is kept back
  simplified_phrase: is being held back
  preserved_meaning: The righteous people’s threshing-floor image is hindered or withheld, not merely delayed.
  reasoning_layer_used: applied lexical revision
  rationale: “Being held back” is natural English while preserving the source verb’s broader force.
