translation:
  language: en
  text: He replied to me, “You are not in more of a hurry than the Most High.[a] You hurry for your own sake, but the Most High hurries for the sake of many. Have not the souls of the righteous in their chambers also asked about these things?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Are you in greater haste than the Most High? For your haste is for your own sake.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: And he answered me and said
  simplified_phrase: He replied to me
  preserved_meaning: He directly answers the speaker.
  reasoning_layer_used: POB base text
  rationale: The shorter wording gives the same speech introduction in natural English.
- pob_phrase: You do not hasten more than the Most High
  simplified_phrase: You are not in more of a hurry than the Most High
  preserved_meaning: The speaker’s urgency does not exceed the Most High’s.
  reasoning_layer_used: source-grounded applied revision
  rationale: “In more of a hurry” preserves the timing and urgency while keeping the main clause declarative.
- pob_phrase: for you hasten for your own sake, but the Most High for many
  simplified_phrase: You hurry for your own sake, but the Most High hurries for the sake of many
  preserved_meaning: The speaker’s urgency concerns himself, while the Most High acts with many in view.
  reasoning_layer_used: POB base text and Latin clause contrast
  rationale: Repeating “hurries” makes the compressed contrast clear without losing the source image.
interpretive_expansions:
- pob_phrase: Have not the souls of the righteous in their chambers asked about these things?
  rendering: Have not the souls of the righteous in their chambers also asked about these things?
  claim: The righteous souls share the speaker’s question.
  evidence:
