translation:
  language: en
  text: From the beginning, a grain of evil seed was planted in Adam’s heart. Think how much wickedness it has produced up to now—and how much it will still produce until the time of threshing comes.[a] But consider within yourself this grain of evil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Threshing separates grain from the rest of the harvested plant; here the image points to a coming time of separation.
    reason: cultural_note
