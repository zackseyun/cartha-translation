  preserved_meaning: Evil is pictured as seed placed in Adam’s inner life at the beginning.
  reasoning_layer_used: POB text and Latin source image
  rationale: The reordered sentence uses familiar wording while preserving the seed image.
- pob_phrase: how much ungodliness it has produced until now, and will still produce
  simplified_phrase: Think how much wickedness it has produced up to now—and how much it will still produce
  preserved_meaning: The evil seed has yielded extensive wickedness and will continue to do so.
  reasoning_layer_used: POB controlling meaning and grounding review
  rationale: The direct wording preserves continued production without implying that the future amount will be greater.
- pob_phrase: until the threshing floor comes
  simplified_phrase: until the time of threshing comes
  preserved_meaning: Evil continues producing its results until the future event pictured by threshing.
  reasoning_layer_used: POB image and Latin “area”
  rationale: The unusual idiom becomes readable while the threshing image remains.
