translation:
  language: en
  text: For I have seen how you tolerate those who sin and have spared those who act wickedly, but have destroyed your people and preserved your enemies, and have not made it clear—
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: endure those who sin
  simplified_phrase: tolerate those who sin
  preserved_meaning: God continues to bear with people who sin.
  reasoning_layer_used: POB text and Latin present tense
  rationale: “Tolerate” makes the ongoing forbearance clearer in common English.
- pob_phrase: those who act impiously
  simplified_phrase: those who act wickedly
  preserved_meaning: They behave in a morally and religiously wrong way.
  reasoning_layer_used: POB text
  rationale: “Act wickedly” clearly conveys the serious wrongdoing without the uncommon term “impiously.”
- pob_phrase: For I saw how
  simplified_phrase: For I have seen how
  preserved_meaning: The speaker bases the complaint on what he has witnessed.
  reasoning_layer_used: POB text and existing SPOB clarity revision
  rationale: The English perfect tense presents the observation naturally while leaving the later completed actions distinct.
translation_notes:
  risk_flags:
