translation:
  language: en
  text: As the people living on earth began to multiply, their children, peoples, and many nations multiplied as well. They once again began to act wickedly, even more wickedly than the people before them.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And it happened that when those who lived on the earth began to multiply
  simplified_phrase: As the people living on earth began to multiply
  preserved_meaning: The earth’s population began increasing.
  reasoning_layer_used: POB base text and source syntax
  rationale: The narrative formula is compressed while the timing and population growth remain clear.
- pob_phrase: they multiplied children and peoples and many nations
  simplified_phrase: their children, peoples, and many nations multiplied as well
  preserved_meaning: Their increase extended to children, peoples, and many nations.
  reasoning_layer_used: applied revision and repeated Latin multiplicaverunt
  rationale: The repeated image of multiplying is retained without the awkward impression that people directly produced nations.
- pob_phrase: they began again to act impiously, more than those before them
  simplified_phrase: They once again began to act wickedly, even more wickedly than the people before them
  preserved_meaning: They returned to wrongdoing and exceeded their predecessors in it.
  reasoning_layer_used: POB base text
  rationale: Common wording clarifies both the renewed wickedness and the comparison.
