simplification_decisions:
- pob_phrase: doing in all things as Adam and all his generations did
  simplified_phrase: In everything they acted as Adam and all his descendants did
  preserved_meaning: Their conduct was like that of Adam and the generations descended from him.
  reasoning_layer_used: POB text, latest revision pass, and grounding review
  rationale: This uses a direct sentence and clarifies that Adam’s “generations” are his descendants without implying deliberate imitation.
- pob_phrase: for they too had an evil heart
  simplified_phrase: for they too had evil hearts
  preserved_meaning: Each of them possessed the same evil inner moral condition.
  reasoning_layer_used: source-grounded lexical revision
  rationale: The plural wording is natural with “they” while retaining “had” rather than the misleading “made use of.”
translation_notes:
