  rationale: “Carried” makes the image natural without weakening the force of “bearing.”
- pob_phrase: transgressed
  simplified_phrase: disobeyed
  preserved_meaning: Adam and his descendants violated what was required of them.
  reasoning_layer_used: POB controlling translation
  rationale: “Disobeyed” expresses the action in common English without adding an object.
- pob_phrase: all who were born from him
  simplified_phrase: everyone descended from him
  preserved_meaning: The statement applies to all Adam’s descendants.
  reasoning_layer_used: POB controlling translation
  rationale: “Descended from him” clearly conveys ancestry rather than immediate birth.
translation_notes:
