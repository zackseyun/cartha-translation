translation:
  language: en
  text: You made the deep waters tremble and threw the age into turmoil. Your glory passed through the four gates—fire, earthquake, wind, and frost—so that you might give the law to Jacob’s descendants and your commandment to Israel’s descendants.[19]
  philosophy: optimal-equivalence
  footnotes:
  - marker: '19'
    text: The wording about the four gates is difficult and may reflect an uncertain text; it is kept here rather than reshaped to match Exodus.
    reason: textual_variant
