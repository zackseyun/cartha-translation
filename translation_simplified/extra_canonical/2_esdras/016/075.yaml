translation:
  language: en
  text: “Listen, my chosen people,” says the Lord. “Look, the days of trouble are here, and I will rescue you from them. Do not be afraid or waver.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Hear, my chosen ones
  simplified_phrase: Listen, my chosen people
  preserved_meaning: The Lord calls his chosen community to pay attention.
  reasoning_layer_used: POB base text and Latin source
  rationale: “Chosen people” naturally addresses the group who belong to the Lord.
- pob_phrase: behold, days of tribulation are here
  simplified_phrase: Look, the days of trouble are here
  preserved_meaning: A period of severe distress has now arrived.
  reasoning_layer_used: Applied revision and Latin adsunt
  rationale: “Are here” preserves the audited decision that the trouble is present, not merely near.
- pob_phrase: and from them I will deliver you. Do not fear or hesitate
  simplified_phrase: and I will rescue you from them. Do not be afraid or waver
  preserved_meaning: The Lord promises deliverance and commands his people not to fear or become unsteady.
  reasoning_layer_used: POB base text, restored Latin clause, and grounding review
  rationale: “Waver” keeps the broad sense of hesitation or uncertainty without narrowing it to discouragement.
translation_notes:
  risk_flags:
  - risk: “Waver” may be less familiar than “hesitate” to some readers.
    mitigation: It remains common English and better preserves the broader warning against doubt or instability.
