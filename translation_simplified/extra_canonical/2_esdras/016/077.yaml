translation:
  language: en
  text: 'For God is your guide. The Lord God says to you who obey my commands and instructions: Do not let your sins burden you or your wrongdoing overpower you.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: you who keep my commandments and my ordinances
  simplified_phrase: you who obey my commands and instructions
  preserved_meaning: The Lord addresses those who follow both kinds of divine requirements.
  reasoning_layer_used: POB base translation
  rationale: Common verbs and nouns make the address immediately understandable without merging its two parts.
- pob_phrase: do not let your sins weigh you down
  simplified_phrase: Do not let your sins burden you
  preserved_meaning: The image of sins pressing heavily on a person remains.
  reasoning_layer_used: POB base translation
  rationale: “Burden” states the same weight image in more natural English.
- pob_phrase: nor let your iniquities prevail over you
  simplified_phrase: or your wrongdoing overpower you
  preserved_meaning: Wrongdoing must not gain mastery over the hearers.
  reasoning_layer_used: POB base translation
  rationale: “Overpower” clearly expresses the force of “prevail over.”
translation_notes:
  risk_flags:
  - risk: “Instructions” may sound broader than the formal sense of “ordinances.”
    mitigation: It remains paired with “commands” to preserve two categories of divine requirements.
