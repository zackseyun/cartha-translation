translation:
  language: en
  text: The dead will be thrown away like dung. No one will be there to comfort them. The earth will be left desolate, and its cities will be torn down.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: will be cast out like dung
  simplified_phrase: will be thrown away like dung
  preserved_meaning: The dead are discarded with the same contempt as waste.
  reasoning_layer_used: source text and POB rendering
  rationale: “Thrown away” makes the action plain while retaining the harsh dung image.
- pob_phrase: they will have no one to comfort them
  simplified_phrase: No one will be there to comfort them
  preserved_meaning: The dead will be without anyone who can offer comfort.
  reasoning_layer_used: applied grammar revision
  rationale: The new sentence reads naturally without adding the rejected causal link to the next clause.
- pob_phrase: its cities will be demolished
  simplified_phrase: its cities will be torn down
  preserved_meaning: The earth’s cities will be destroyed by demolition.
  reasoning_layer_used: latest revision pass
  rationale: “Torn down” is common English that preserves deliberate physical destruction.
translation_notes:
  risk_flags:
  - risk: “No one will be there” recasts the Latin possession construction as an existential statement.
    mitigation: The wording still keeps the dead as those receiving no comfort and does not connect the clause causally to the desolate earth.
