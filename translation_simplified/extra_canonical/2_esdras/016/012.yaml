translation:
  language: en
  text: Will not the earth be completely crushed before him? The earth and its foundations tremble.[a] The sea surges from the deep. Its waves and fish will be thrown into turmoil before the Lord and before the glory of his power.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “are troubled.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: utterly crushed before him
  simplified_phrase: completely crushed before him
  preserved_meaning: The earth faces total destruction before him.
  reasoning_layer_used: POB base text
  rationale: Common wording preserves both the total force and the relation expressed by “before.”
- pob_phrase: The earth quakes, and its foundations
  simplified_phrase: The earth and its foundations tremble
  preserved_meaning: Both the earth and its foundations are shaken.
  reasoning_layer_used: POB text and retained footnote
  rationale: The recast sentence clearly gives the same action to the earth and its foundations.
- pob_phrase: the sea surges from the deep, and its waves and its fish will be troubled
  simplified_phrase: The sea surges from the deep. Its waves and fish will be thrown into turmoil
  preserved_meaning: The sea is violently stirred from its depths, and both its waves and fish will be disturbed.
  reasoning_layer_used: POB revision pass and Latin future passive
  rationale: Shorter sentences clarify the images while retaining the future force for both waves and fish.
translation_notes:
  risk_flags:
