translation:
  language: en
  text: They will act like madmen and spare no one. They will rob and devastate those who still[a] fear the Lord.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: An earlier rendering applies “still” to their plundering and ravaging rather than to those who fear the Lord.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: They will be like madmen
  simplified_phrase: They will act like madmen
  preserved_meaning: Their conduct is compared to the uncontrolled behavior of madmen.
  reasoning_layer_used: POB main text and Latin simile
  rationale: “Act like” makes the comparison about their behavior without weakening the image.
- pob_phrase: sparing no one, plundering and ravaging
  simplified_phrase: spare no one. They will rob and devastate
  preserved_meaning: They show no mercy as they seize property and cause widespread ruin.
  reasoning_layer_used: POB main text
  rationale: Two direct sentences replace the dense participial structure with common English.
- pob_phrase: those who still fear the Lord
  simplified_phrase: those who still fear the Lord
  preserved_meaning: The victims continue to revere the Lord despite persecution.
  reasoning_layer_used: applied grammar revision
  rationale: The wording is retained because the revision places “still” with those fearing the Lord.
translation_notes:
  risk_flags:
  - risk: “Devastate” may sound broader than physical ravaging alone.
    mitigation: It preserves the destructive force of “ravaging” without adding a specific kind of harm.
  - risk: The placement of “still” had an earlier alternative rendering.
    mitigation: The main text follows the adjudicated Latin grammar, while the footnote preserves the alternative.
