  preserved_meaning: The urgent call to pay attention remains.
  reasoning_layer_used: POB main text
  rationale: The direct warning is clearer than the biblical idiom “behold.”
- pob_phrase: a burning wrath is kindled against you
  simplified_phrase: Burning anger is rising against you
  preserved_meaning: Fierce hostility is being stirred up against the hearers.
  reasoning_layer_used: POB main text and latest revision pass
  rationale: Natural wording keeps the fire image and hostile direction.
- pob_phrase: a great multitude, and they will seize some of you and feed them with meat sacrificed to idols
  simplified_phrase: A large crowd will seize some of you and give them food sacrificed to idols
  preserved_meaning: A large hostile group will capture some hearers and subject them to an act connected with idol sacrifice.
  reasoning_layer_used: POB main text, footnotes, and independent grounding review
  rationale: “Crowd” avoids added coloring, while the footnote preserves the compressed clause’s disputed meanings.
