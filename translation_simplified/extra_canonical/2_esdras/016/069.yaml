translation:
  language: en
  text: Look! Burning anger is rising against you. A large crowd will seize some of you and give them food sacrificed to idols.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Latin is harsh and compressed. It may mean that those seized are forced to eat meat sacrificed to idols. It may instead mean that some are killed in connection with idol worship or are handed over as food after being killed.
    reason: lexical_alternative
