  reasoning_layer_used: POB text and source structure
  rationale: The abstract heading is recast as a direct sentence while preserving both suffering and groaning.
- pob_phrase: the beginning of famine and many will perish
  simplified_phrase: Famine will begin, and many will die
  preserved_meaning: Famine begins and causes the loss of many lives.
  reasoning_layer_used: POB text
  rationale: “Die” states the ordinary meaning of “perish” in clear modern English.
- pob_phrase: the beginning of evils and all will tremble
  simplified_phrase: Evils will begin, and everyone will tremble
  preserved_meaning: The onset of evils causes universal trembling.
  reasoning_layer_used: POB text and Latin source
  rationale: “Everyone” naturally expresses the POB’s universal “all” without weakening “tremble.”
