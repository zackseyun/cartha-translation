  preserved_meaning: Foreigners seize their property and ruin their dwellings.
  reasoning_layer_used: Latin source and applied lexical review
  rationale: Natural English verbs preserve the force of the acts against property and homes.
- pob_phrase: because in captivity and famine they beget their children
  simplified_phrase: because these people will have children while living in captivity and famine
  preserved_meaning: The afflicted people have children under conditions of captivity and hunger.
  reasoning_layer_used: POB clause connection and independent grounding review
  rationale: The wording keeps the causal link and prevents “they” from being mistaken for the foreigners.
