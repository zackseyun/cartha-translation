translation:
  language: en
  text: Think of an honorable and very beautiful woman who is outraged by a prostitute.[a] In the same way, righteousness will be outraged by wickedness when wickedness dresses itself up. Righteousness will accuse wickedness to its face when the one comes who defends the person who searches out every sin on earth. Therefore, do not be like wickedness or do what it does.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Latin is difficult and compressed, but it appears to portray righteousness as an honorable woman openly exposing wickedness, portrayed as a prostitute.
    reason: source_note
simplification_decisions:
- pob_phrase: As a respectable and very beautiful woman is indignant toward a prostitute
  simplified_phrase: Think of an honorable and very beautiful woman who is outraged by a prostitute.
  preserved_meaning: The comparison retains the honorable woman, the prostitute, and the woman's strong moral indignation.
  reasoning_layer_used: POB translation and source note
  rationale: A direct introductory sentence makes the compressed comparison easier to follow.
- pob_phrase: so righteousness will be indignant toward iniquity when it adorns itself
  simplified_phrase: In the same way, righteousness will be outraged by wickedness when wickedness dresses itself up.
  preserved_meaning: Righteousness remains personified as opposing wickedness when it makes itself attractive.
  reasoning_layer_used: POB translation and latest revision
  rationale: Repeated nouns clarify the referents while “dresses itself up” preserves the adornment image.
- pob_phrase: Therefore do not be like it or its works
  simplified_phrase: Therefore, do not be like wickedness or do what it does.
  preserved_meaning: The warning rejects both resemblance to wickedness and participation in its deeds.
  reasoning_layer_used: Applied source-grounded revision
  rationale: The wording states the two commands in ordinary English without merging them.
