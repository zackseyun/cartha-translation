translation:
  language: en
  text: …your sins, and do not let your wrongdoing overpower you.[a] How terrible for those who are tightly bound by their sins and covered by their wrongdoing! They are like a field surrounded by woods, with its seed covered by thorns. No one passes through that field. It is closed off and handed over to the fire to be consumed.
