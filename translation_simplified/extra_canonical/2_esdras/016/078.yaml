  simplified_phrase: and do not let your wrongdoing overpower you
  preserved_meaning: Wrongdoing must not gain mastery over the hearers.
  reasoning_layer_used: source-grounded applied revision
  rationale: “Overpower” states the force of “prevail over” in common English.
- pob_phrase: Woe to those who are bound fast by their sins and covered over by their iniquities
  simplified_phrase: How terrible for those who are tightly bound by their sins and covered by their wrongdoing!
  preserved_meaning: The warning retains both the binding and covering images without restricting the woe to the future.
  reasoning_layer_used: POB controlling translation and grounding review
  rationale: “How terrible for” explains “woe” while preserving its temporal openness.
- pob_phrase: just as a field is hemmed in by a forest and its seed is covered by thorns, through which no man passes; it is shut off and given over to be devoured by fire
  simplified_phrase: They are like a field surrounded by woods, with its seed covered by thorns. No one passes through that field. It is closed off and handed over to the fire to be consumed.
