translation:
  language: en
  text: You will be disgraced when your sins come into the open before others. On that day, your own wrongdoings will stand as your accusers.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: put to shame
  simplified_phrase: disgraced
  preserved_meaning: They will suffer public shame when their sins are revealed.
  reasoning_layer_used: POB translation and immediate context
  rationale: “Disgraced” clearly conveys public shame rather than only an inward feeling.
- pob_phrase: come forth before men
  simplified_phrase: come into the open before others
  preserved_meaning: Their hidden sins will become publicly known.
  reasoning_layer_used: POB revision rationale and Latin source
  rationale: The wording keeps the solemn image of sins emerging while making the exposure clear.
- pob_phrase: your iniquities will stand as accusers
  simplified_phrase: your own wrongdoings will stand as your accusers
  preserved_meaning: Their deeds are personified as witnesses that accuse them.
  reasoning_layer_used: POB translation and source syntax
  rationale: “Wrongdoings” is more familiar than “iniquities,” while the courtroom image remains intact.
