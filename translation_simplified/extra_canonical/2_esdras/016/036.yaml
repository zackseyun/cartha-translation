- pob_phrase: But hear these things and know them, slaves of the Lord.
  simplified_phrase: You who are slaves of the Lord, listen to these things and come to know them.
  preserved_meaning: The Lord’s slaves are commanded both to listen and to gain knowledge of the message.
  reasoning_layer_used: POB text and applied revision
