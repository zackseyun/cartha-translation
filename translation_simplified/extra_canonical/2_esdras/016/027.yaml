translation:
  language: en
  text: The grapes will offer themselves for harvest, but who will gather them? For there will be terrible devastation in various places.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: The grape will yield itself for the vintage
  simplified_phrase: The grapes will offer themselves for harvest
  preserved_meaning: The grapes present themselves for harvesting, preserving the vivid personification.
  reasoning_layer_used: Applied source-grounded revision on tradet se ad vindemiam
  rationale: “Harvest” replaces the unfamiliar “vintage,” while “offer themselves” keeps the source image.
- pob_phrase: who will gather it?
  simplified_phrase: who will gather them?
  preserved_meaning: The question asks who will collect the grapes.
  reasoning_layer_used: Applied source-grounded revision on adligabit
  rationale: The plural pronoun fits natural English while retaining the approved sense “gather.”
- pob_phrase: great desolation in places
  simplified_phrase: terrible devastation in various places
  preserved_meaning: Severe ruin will occur across plural locations without claiming that the locations are many.
  reasoning_layer_used: POB translation, Latin locis desertio multa, and grounding review
  rationale: “Terrible devastation” keeps multa with the desolation, while “various places” expresses locis naturally.
translation_notes:
  risk_flags:
  - risk: “Various places” is slightly more explicit than the bare Latin plural locis.
    mitigation: It indicates dispersed plural locations without adding the unsupported claim “many.”
