translation:
  language: en
  text: For the sins of their ancestors have increased among them, because they forgot me and offered sacrifices to other gods.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the sins of their fathers
  simplified_phrase: the sins of their ancestors
  preserved_meaning: The sins of earlier generations continued among their descendants.
  reasoning_layer_used: POB base text and Latin source
  rationale: “Ancestors” conveys the generational sense without suggesting only immediate fathers.
- pob_phrase: have increased in them
  simplified_phrase: have increased among them
  preserved_meaning: The ancestors’ sins increased within the descendant community.
  reasoning_layer_used: POB base text, Latin source, and grounding review
  rationale: “Among them” makes the collective sense clear without changing increase into strength or entrenchment.
- pob_phrase: sacrificed to foreign gods
  simplified_phrase: offered sacrifices to other gods
  preserved_meaning: They worshiped gods other than the speaking God by offering sacrifices.
  reasoning_layer_used: POB base text and Latin source
  rationale: This wording states the sacrificial act naturally while preserving the contrast with God.
translation_notes:
  risk_flags:
  - risk: “Other gods” gives less emphasis to their alien character than “foreign gods.”
    mitigation: It preserves the central contrast between God and the gods to whom the people sacrificed.
