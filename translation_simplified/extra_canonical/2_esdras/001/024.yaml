- pob_phrase: You would not obey me, Judah.
  simplified_phrase: You refused to obey me, Judah.
  preserved_meaning: Judah was unwilling to obey God.
  reasoning_layer_used: Latin source and POB text
  rationale: “Refused” clearly expresses deliberate unwillingness.
- pob_phrase: that they may keep my statutes
  simplified_phrase: so that they may obey my laws
  preserved_meaning: God gives the nations his name for the purpose of their obeying his established commands, without guaranteeing the outcome.
  reasoning_layer_used: Latin purpose clause, POB text, and grounding review
  rationale: “Obey my laws” is immediately understandable, while “may” preserves the purpose sense.
