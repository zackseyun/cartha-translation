  preserved_meaning: God claims the glory belonging to the other group.
  reasoning_layer_used: source text and applied pronoun review
  rationale: This wording makes the Latin pronoun contrast understandable in English.
- pob_phrase: everlasting tabernacles
  simplified_phrase: homes that will last forever
  preserved_meaning: God gives permanent dwelling places.
  reasoning_layer_used: POB translation and Latin source
  rationale: “Homes” clearly conveys the dwelling-place image without the opaque term “tabernacles.”
interpretive_expansions:
