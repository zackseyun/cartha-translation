translation:
  language: en
  text: I will take the glory of those others[a] for myself, and I will give my people homes that will last forever.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Latin uses different pronouns for the people whose glory is taken and the people who receive the homes.
