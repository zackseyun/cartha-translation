translation:
  language: en
  text: For you sinned in the sight of the Lord God and did evil in my sight. What can I do for you now? I am a widow and have been abandoned. Go, my children, and appeal to the Lord.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: because you sinned before the Lord God and did what is evil before me
  simplified_phrase: For you sinned in the sight of the Lord God and did evil in my sight
  preserved_meaning: Their sin and evil were committed in the presence of the Lord God and the speaker.
  reasoning_layer_used: source payload, POB base text, and grounding review
  rationale: “In the sight of” clearly preserves the repeated presence language and the causal opening.
- pob_phrase: I am a widow and forsaken
  simplified_phrase: I am a widow and have been abandoned
  preserved_meaning: The speaker is both widowed and left without support.
  reasoning_layer_used: source payload and POB base text
  rationale: The active verbal phrase makes “forsaken” immediately understandable without merging the two conditions.
- pob_phrase: ask the Lord
  simplified_phrase: appeal to the Lord
  preserved_meaning: The children must turn to the Lord with an unspecified request.
  reasoning_layer_used: applied revision and source payload
  rationale: “Appeal” is natural English and does not add the unsupported object “mercy.”
translation_notes:
  risk_flags:
  - risk: “Appeal” may imply an urgent plea more strongly than the general verb “ask.”
    mitigation: No requested object is supplied, so the source’s openness remains intact.
