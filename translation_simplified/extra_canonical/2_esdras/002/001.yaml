    mitigation: It is retained because the audited revision explicitly requires this source-driven term for the prophets.
  - risk: “Made my plans come to nothing” could be read as a broad claim that humans defeated every divine purpose.
    mitigation: The wording remains tied to this people's rejection of the commandments delivered through the prophets.
