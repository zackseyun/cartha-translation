translation:
  language: en
  text: 'So I say to you, Gentiles who hear and understand: Wait for your shepherd. He will give you eternal rest, because he is near—the one who will come at the end of the age. Be ready for the rewards of the kingdom.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: 'Therefore I say to you, Gentiles who hear and understand: await your shepherd'
  simplified_phrase: 'So I say to you, Gentiles who hear and understand: Wait for your shepherd.'
  preserved_meaning: The speaker directly addresses Gentiles who hear and understand and commands them to await their shepherd.
  reasoning_layer_used: The applied revision identifies the group as Gentiles in contrast with Israel in the preceding verse.
  rationale: “So,” “wait,” and a sentence break make the address and command easier to follow.
- pob_phrase: he will give you eternal rest, because he is near—the one who will come at the end of the age
  simplified_phrase: He will give you eternal rest, because he is near—the one who will come at the end of the age.
  preserved_meaning: The coming shepherd is near and will give his hearers rest that lasts forever.
  reasoning_layer_used: The POB preserves the Latin promise, nearness, and arrival at the end of the age.
  rationale: A separate sentence clarifies the shepherd’s action without changing the promise or timing.
- pob_phrase: Be ready for the rewards of the kingdom,
  simplified_phrase: Be ready for the rewards of the kingdom.
  preserved_meaning: The hearers must be prepared for the kingdom’s rewards.
  reasoning_layer_used: The latest revision restores the source clause “Parati estote ad praemia regni.”
  rationale: The source-close wording is already clear and avoids specifying how the rewards relate to the hearers.
translation_notes:
  risk_flags:
  - risk: “Gentiles” may be unfamiliar to some readers.
    mitigation: The term is retained because the audited revision requires the specific contrast with Israel.
