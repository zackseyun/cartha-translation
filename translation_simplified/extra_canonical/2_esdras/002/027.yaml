translation:
  language: en
  text: Others will cry and be sad, but you will be joyful and have plenty. The nations will envy you, but they will not be able to do anything against you, says the Lord.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: weep and be sorrowful
  simplified_phrase: cry and be sad
  preserved_meaning: Others will openly grieve.
  reasoning_layer_used: POB text and Latin source
  rationale: Common words preserve both the outward crying and the inward sadness.
- pob_phrase: cheerful and abundant
  simplified_phrase: joyful and have plenty
  preserved_meaning: The person addressed will have joy and abundance in contrast to others' grief.
  reasoning_layer_used: POB text and Latin source
  rationale: The rewrite makes the contrast natural without dropping either joy or abundance.
- pob_phrase: will be jealous ... able to do nothing against you
  simplified_phrase: will envy you ... not be able to do anything against you
  preserved_meaning: The nations' envy will not give them power to oppose the person addressed.
  reasoning_layer_used: POB text and applied source-grounded revision
  rationale: “Envy” is clearer here, while “anything against you” keeps the broad force of opposition.
translation_notes:
  risk_flags:
  - risk: “Have plenty” may suggest material wealth more specifically than the broad word “abundant.”
    mitigation: The wording remains general and does not name money, possessions, or any particular blessing.
