translation:
  language: en
  text: For light that never fades will shine on you forever. Flee from the shadow of this present age, and receive the joy of glory.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: everlasting light will shine for you through all eternity
  simplified_phrase: light that never fades will shine on you forever
  preserved_meaning: The promised light is unending and shines for the readers eternally.
  reasoning_layer_used: POB text and Latin source
  rationale: This replaces overlapping abstract time phrases with a clear image while retaining their emphasis.
- pob_phrase: the shadow of this age
  simplified_phrase: the shadow of this present age
  preserved_meaning: The command is to flee the darkness associated with the current age.
  reasoning_layer_used: POB text and Latin source
  rationale: Adding “present” makes the contrast with the coming eternal light easier to grasp.
interpretive_expansions:
- pob_phrase: this age
  rendering: this present age
  claim: The age being described is the current age in contrast with the eternity promised before it.
  evidence:
