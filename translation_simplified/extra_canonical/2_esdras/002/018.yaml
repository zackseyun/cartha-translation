  text: I will send my servants Isaiah and Jeremiah to help you. After their counsel, I have set apart and prepared for you twelve trees loaded with many kinds of fruit,
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: I will send you help—my servants Isaiah and Jeremiah.
  simplified_phrase: I will send my servants Isaiah and Jeremiah to help you.
  preserved_meaning: Isaiah and Jeremiah are the promised help being sent.
  reasoning_layer_used: POB text and Latin source
  rationale: The direct sentence clearly identifies the servants as the promised help.
- pob_phrase: By their counsel
  simplified_phrase: After their counsel
  preserved_meaning: The preparation is connected with Isaiah and Jeremiah’s counsel without implying that God follows their advice.
  reasoning_layer_used: Independent grounding review and source-supported temporal relationship
  rationale: The temporal wording avoids giving the prophets an unwarranted directive role.
- pob_phrase: sanctified ... twelve trees laden with various fruits
  simplified_phrase: set apart ... twelve trees loaded with many kinds of fruit
  preserved_meaning: The trees are specially designated and bear a variety of fruit.
  reasoning_layer_used: POB text and Latin source
  rationale: Common wording retains both the setting-apart action and the abundant-fruit image.
translation_notes:
  risk_flags:
  - risk: “Set apart” is less explicitly sacred than “sanctified.”
    mitigation: It preserves the act of special designation without implying moral holiness in the trees.
  - risk: “After their counsel” may leave the exact relationship between the counsel and preparation open.
    mitigation: This preserves the source’s connection without claiming that God acted under the prophets’ direction.
