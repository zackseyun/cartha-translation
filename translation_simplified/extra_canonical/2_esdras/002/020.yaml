translation:
  language: en
  text: Defend the widow’s rights. Give justice to the orphan. Give to those in need. Protect children who have no father. Give clothes to those who have none. Care for those who are broken or weak, and for those who have difficulty walking.
  philosophy: optimal-equivalence
