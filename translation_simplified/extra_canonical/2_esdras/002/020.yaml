  reasoning_layer_used: POB translation and Latin source
  rationale: The legal sense is expressed in direct, common English.
- pob_phrase: protect the fatherless, clothe the naked
  simplified_phrase: Protect children who have no father. Give clothes to those who have none.
  preserved_meaning: The commands still require protection and clothing for people who lack them.
  reasoning_layer_used: POB translation
  rationale: Traditional labels are replaced with clear descriptions.
- pob_phrase: care for the broken and the weak, the lame
  simplified_phrase: Care for those who are broken or weak, and for those who have difficulty walking.
  preserved_meaning: The command includes broken, weak, and mobility-impaired people.
  reasoning_layer_used: Latin source and applied revision
