translation:
  language: en
  text: 'I am Ezra. On Mount Horeb, the Lord commanded me to go to Israel. But when I went to them, they rejected me and flatly refused the Lord’s command. Therefore, I say to you, nations:'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: I, Ezra, received a command from the Lord on Mount Horeb, that I should go to Israel
  simplified_phrase: I am Ezra. On Mount Horeb, the Lord commanded me to go to Israel.
  preserved_meaning: Ezra identifies himself and reports where the Lord commanded him to go to Israel.
  reasoning_layer_used: POB base text
  rationale: Two direct sentences replace the dense introductory construction without changing its content.
- pob_phrase: they rejected me and spurned the commandment of the Lord
  simplified_phrase: they rejected me and flatly refused the Lord’s command
  preserved_meaning: Israel rejected Ezra and actively refused the Lord’s command.
  reasoning_layer_used: applied lexical revision
  rationale: “Flatly refused” preserves the audited force of an active, decisive rejection.
- pob_phrase: Therefore I say to you, O nations,
  simplified_phrase: 'Therefore, I say to you, nations:'
  preserved_meaning: Ezra turns to address the nations because of Israel’s rejection.
  reasoning_layer_used: latest revision pass and grounding review
  rationale: The comma marks direct address, while the colon shows that Ezra’s speech continues.
translation_notes:
  risk_flags:
  - risk: “Flatly refused” does not retain the literal image of spitting something out.
    mitigation: It clearly communicates the source verb’s audited figurative sense of forceful rejection.
