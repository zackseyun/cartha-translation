translation:
  language: en
  text: I will raise the dead wherever they lie and bring them out of their tombs, because I have known my name in them.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Latin wording is unusual and may mean “because my name is known in them” or possibly “because they have known my name.”
