  reasoning_layer_used: POB base translation
  rationale: “Tell” is common English for the formal verb “announce” in this context.
- pob_phrase: what and how great are the wonders of the Lord God that you have seen
  simplified_phrase: about the wonders of the Lord God that you have seen—what kind they are and how great they are
