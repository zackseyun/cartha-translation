  preserved_meaning: The number of the desired children is complete.
  reasoning_layer_used: POB text and latest revision pass
  rationale: This uses natural English while preserving desire and completeness without adding a time reference.
- pob_phrase: that your people, who were called from the beginning
  simplified_phrase: so that your people—the people called from the beginning—
  preserved_meaning: The purpose concerns the people whose calling reaches back to the beginning.
  reasoning_layer_used: Latin relative clause and applied revision
  rationale: The dash keeps the calling directly linked to the people while making the sentence easier to follow.
- pob_phrase: may be sanctified
  simplified_phrase: may be made holy
  preserved_meaning: The people may be set apart as holy.
  reasoning_layer_used: POB controlling translation
  rationale: “Made holy” expresses “sanctified” in language familiar to common readers.
