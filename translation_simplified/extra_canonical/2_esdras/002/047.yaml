translation:
  language: en
  text: He answered me, “He is the Son of God, whom they acknowledged while living in this world.”[a][b] Then I began to praise those who had bravely stood for the name of the Lord.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This direct identification of the crowned figure as “the Son of God” comes from the later Christian layer of this chapter; it should not automatically be applied to the Jewish apocalypse in chapters 3–14.
    reason: source_note
  - marker: b
    text: Literally, “in the age.”
    reason: lexical_alternative
