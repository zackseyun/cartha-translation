translation:
  language: en
  text: “Remember what I did to Sodom and Gomorrah. Their land lies covered with lumps of tar and heaps of ashes. I will do the same to those who did not listen to me,” says the Lord Almighty.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: whose land lies in clods of pitch and heaps of ashes
  simplified_phrase: Their land lies covered with lumps of tar and heaps of ashes.
  preserved_meaning: The land remains pictured as ruined beneath solid pitch and piled ashes.
  reasoning_layer_used: source payload and POB imagery
  rationale: A separate sentence and the common word “tar” make the destruction easier to picture.
- pob_phrase: So I will give those who did not listen to me
  simplified_phrase: I will do the same to those who did not listen to me
  preserved_meaning: God threatens the disobedient with destruction like that of Sodom and Gomorrah.
  reasoning_layer_used: tier-3 lexical adjudication and immediate context
  rationale: “Do the same to” expresses the contextual Late Latin sense and restores the parallel with “what I did.”
interpretive_expansions:
- pob_phrase: So I will give those
  rendering: I will do the same to those
  claim: “The same” makes explicit that the threatened action corresponds to what God did to Sodom and Gomorrah.
  evidence:
  - Latin sic points back to the preceding example.
  - The tier-3 review reads dabo contextually as “do to” in parallel with fecerim.
  confidence: high
  alternatives_preserved:
  - The form dabo can be rendered more literally as “I will give,” though that is unclear here.
translation_notes:
  risk_flags:
  - risk: Rendering dabo as “do” is less formally literal than “give.”
    mitigation: The tier-3 lexical ruling and the immediate verbal parallel support this contextual sense.
