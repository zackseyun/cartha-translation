translation:
  language: en
  text: At once, an immeasurable abundance of fruit sprang up, offering many kinds of delightful tastes. Flowers appeared in colors no one could copy, along with fragrances beyond human understanding. All these things were made on the third day.
  philosophy: optimal-equivalence
