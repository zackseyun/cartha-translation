simplification_decisions:
- pob_phrase: behold
  simplified_phrase: look!
  preserved_meaning: The urgent appeal for the Lord’s attention remains explicit.
  reasoning_layer_used: POB translation and Latin source
  rationale: The common word “look” preserves the force of Latin ecce.
- pob_phrase: which have been reckoned as nothing
  simplified_phrase: were considered nothing
  preserved_meaning: The nations had been judged insignificant or worthless.
  reasoning_layer_used: POB translation and Latin source
  rationale: The passive judgment remains while the wording becomes more natural.
- pob_phrase: rule over us and devour us
  simplified_phrase: rule over us and consume us
  preserved_meaning: The nations both dominate and destructively exploit the speaker’s people.
  reasoning_layer_used: POB translation and Latin source
  rationale: “Consume” keeps the devouring image without suggesting literal eating.
translation_notes:
  risk_flags:
