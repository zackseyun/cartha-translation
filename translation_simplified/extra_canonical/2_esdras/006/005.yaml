translation:
  language: en
  text: and before the present years were traced out, before the schemes of those who now sin were separated, and before those who had stored up faith were sealed—
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the present years were searched out
  simplified_phrase: the present years were traced out
  preserved_meaning: The years are pictured as being searched out or delineated.
  reasoning_layer_used: POB base text and Latin source
  rationale: “Traced out” keeps the search image without narrowing the years to a particular age.
- pob_phrase: the devices of those who now sin were estranged
  simplified_phrase: the schemes of those who now sin were separated
  preserved_meaning: The sinners’ designs were alienated or divided from something left unstated.
  reasoning_layer_used: POB base text
  rationale: “Schemes” and “separated” are clearer while avoiding the positive overtones of “set apart.”
- pob_phrase: those who have stored up faith
  simplified_phrase: those who had stored up faith
  preserved_meaning: Faith remains pictured as something accumulated before the faithful were sealed.
  reasoning_layer_used: POB base text and applied grammar revision
  rationale: The past perfect clarifies the sequence while preserving the stored-up-faith image.
translation_notes:
  risk_flags:
  - risk: “Separated” leaves unstated what the sinners’ schemes were separated from.
    mitigation: The object remains unstated because neither POB nor the supplied reasoning establishes it.
  - risk: The verse remains a sentence fragment ending with a dash.
    mitigation: The opening “and” and final dash are retained because the sentence continues across verse boundaries.
