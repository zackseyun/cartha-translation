translation:
  language: en
  text: 'When Zion’s time of humiliation has come to an end, and when this age, which has begun to pass away, is marked out,[a] I will perform these signs: the books will be opened before the face of heaven, and everyone will see them at the same time.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Marked out” may also be translated “sealed over.”
    reason: lexical_alternative
