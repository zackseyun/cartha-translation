  rationale: The rewrite turns an abstract passive clause into a clear statement without omitting Zion’s humiliation.
- pob_phrase: the age that is beginning to pass away
  simplified_phrase: this age, which has begun to pass away
  preserved_meaning: The present age is already entering its decline.
  reasoning_layer_used: POB controlling translation
