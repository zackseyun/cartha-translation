translation:
  language: en
  text: If the world was created for us, why have we not received it as our inheritance? How long will this go on?”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: created for our sake
  simplified_phrase: created for us
  preserved_meaning: The world was made for the benefit of the speaker's people.
  reasoning_layer_used: POB base text and Latin source
  rationale: The shorter wording expresses the same purpose in common English.
- pob_phrase: possess our world as an inheritance
  simplified_phrase: received it as our inheritance
  preserved_meaning: They expect the world intended for them to become their rightful possession.
  reasoning_layer_used: POB base text and immediate context
  rationale: Using “received” makes the inheritance image natural without removing it.
- pob_phrase: How long will this be?
  simplified_phrase: How long will this go on?
  preserved_meaning: The speaker asks how long the present deprivation will continue.
  reasoning_layer_used: POB base text
  rationale: The idiomatic question clearly points to an ongoing situation.
translation_notes:
  risk_flags:
  - risk: Replacing “possess” with “received” may shift emphasis from ownership to acquisition.
    mitigation: The phrase “as our inheritance” still clearly conveys rightful possession.
