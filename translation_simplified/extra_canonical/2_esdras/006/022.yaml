translation:
  language: en
  text: Suddenly, planted fields will look as though nothing had been planted. Storehouses that were full will suddenly be found empty. Then the trumpet will sound, and everyone who hears it will suddenly be terrified.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: places sown will appear unsown
  simplified_phrase: planted fields will look as though nothing had been planted
  preserved_meaning: Cultivated land will suddenly appear uncultivated.
  reasoning_layer_used: source payload and controlling POB text
  rationale: “Planted fields” expresses the agricultural image in ordinary English.
- pob_phrase: full storehouses will suddenly be found empty
  simplified_phrase: Storehouses that were full will suddenly be found empty
  preserved_meaning: Previously full storage places will be discovered empty without warning.
  reasoning_layer_used: controlling POB text
  rationale: The relative clause makes the reversal easier to follow.
- pob_phrase: the trumpet will sound, which when all hear, they will suddenly be terrified
  simplified_phrase: Then the trumpet will sound, and everyone who hears it will suddenly be terrified
  preserved_meaning: The trumpet blast will be heard by all and cause sudden terror.
  reasoning_layer_used: applied revision and source payload
  rationale: The clause is recast in natural English while retaining the universal hearing and sudden fear.
translation_notes:
  risk_flags:
