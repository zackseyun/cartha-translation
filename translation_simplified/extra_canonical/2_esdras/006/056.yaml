  preserved_meaning: The nations’ multitude is compared to one drop from a receptacle.
  reasoning_layer_used: POB text, Latin source, and grounding review
  rationale: “Great number” clarifies “abundance,” while “bucket” makes the receptacle concrete without adding motion.
