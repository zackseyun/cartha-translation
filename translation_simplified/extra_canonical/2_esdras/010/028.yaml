translation:
  language: en
  text: “Where is the angel Uriel, who came to me at the beginning? He is the one who brought me into this overwhelming visionary state of mind. Now my end is ruin, and my prayer has become a disgrace.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Uriel the angel
  simplified_phrase: the angel Uriel
  preserved_meaning: Uriel is identified as an angel.
  reasoning_layer_used: POB base text
  rationale: This title order is more natural in modern English.
- pob_phrase: this great bewilderment of mind
  simplified_phrase: this overwhelming visionary state of mind
  preserved_meaning: Ezra describes an intense visionary displacement, not ordinary confusion or joyful ecstasy.
  reasoning_layer_used: applied lexical revision and POB footnote 28
  rationale: The wording directly conveys both the vision-related character and its overwhelming force.
- pob_phrase: my end has become corruption, and my prayer a reproach
  simplified_phrase: my end is ruin, and my prayer has become a disgrace
  preserved_meaning: Ezra expects a destructive end and regards his prayer itself as disgraced.
  reasoning_layer_used: POB base text and grounding review
  rationale: Common wording preserves the predicative force without implying that the prayer causes shame.
interpretive_expansions:
