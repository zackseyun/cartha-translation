translation:
  language: en
  text: Our harp has been brought low, our hymn has fallen silent, and our joy is gone. The light of our lampstand has gone out. The ark of our covenant has been plundered, our holy things have been defiled, and the name by which we are called has nearly been profaned. Our children have been insulted, our priests have been burned, and our Levites have been taken into captivity. Our virgins have been defiled, and our women have suffered violence. Our righteous men have been carried away, our little ones have been handed over,[a] our young men have been forced into slavery, and our strong men have become weak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “have been betrayed.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: our rejoicing has been dissolved
  simplified_phrase: our joy is gone
  preserved_meaning: The community's rejoicing has ended amid its calamities.
  reasoning_layer_used: POB translation and immediate context
  rationale: The plain phrase communicates the loss of joy without an opaque metaphor.
- pob_phrase: the name that was called over us has been almost profaned
  simplified_phrase: the name by which we are called has nearly been profaned
  preserved_meaning: The people bear a sacred name that has nearly been treated as profane.
  reasoning_layer_used: POB translation and grounding review
  rationale: This wording explains the idiom while preserving the sacred force of “profaned.”
- pob_phrase: our young men have been enslaved
  simplified_phrase: our young men have been forced into slavery
  preserved_meaning: The young men were compelled to serve as slaves.
  reasoning_layer_used: POB controlling meaning
  rationale: The verbal phrase makes the coercion plain to modern readers.
