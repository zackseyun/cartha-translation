translation:
  language: en
  text: So do not be afraid or let your heart be filled with terror. Go inside and look at the building’s splendor—or its vast size—as far as your eyes are able to see.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Therefore do not fear, and do not let your heart be terrified
  simplified_phrase: So do not be afraid or let your heart be filled with terror
  preserved_meaning: The speaker gives two closely related commands against fear and inward terror.
  reasoning_layer_used: POB base text and Latin source
  rationale: Common wording preserves both the general fear and the terror of the heart.
- pob_phrase: go in and see
  simplified_phrase: Go inside and look at
  preserved_meaning: The hearer is commanded to enter and observe the building.
  reasoning_layer_used: POB base text
  rationale: Ordinary English makes the movement into the building explicit without adding a new idea.
- pob_phrase: the splendor or the greatness of the building, as much as your eyes are able to see
  simplified_phrase: the building’s splendor—or its vast size—as far as your eyes are able to see
  preserved_meaning: The sight concerns either the building’s magnificence or its great extent, limited by human vision.
  reasoning_layer_used: POB revision pass reflecting Latin vel
  rationale: The dash keeps the audited alternative “or,” while “vast size” clarifies greatness in this visual setting.
translation_notes:
  risk_flags:
  - risk: “Vast size” narrows the broader word “greatness” toward visible scale.
    mitigation: The command to look and the limit of eyesight make physical magnitude the strongest contextual sense.
