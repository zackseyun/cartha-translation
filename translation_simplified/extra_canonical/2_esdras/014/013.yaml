    mitigation: It directly preserves the idiom’s preparatory force and avoids narrowing it to household members.
  - risk: “Say farewell” presents renunciation as departure rather than moral rejection.
    mitigation: The explicit phrase “perishable life” anchors the command in mortality, as required by the audited context.
