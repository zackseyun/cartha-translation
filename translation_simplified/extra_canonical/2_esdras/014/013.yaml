translation:
  language: en
  text: So now put your affairs in order. Correct your people, comfort the humble among them, and say farewell to this perishable life.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: set your house in order
  simplified_phrase: put your affairs in order
  preserved_meaning: Ezra must prepare and arrange his personal and domestic affairs.
  reasoning_layer_used: POB base text, Latin source, and grounding review
  rationale: “Affairs” makes the preparatory idiom clear without limiting it to household members.
- pob_phrase: reprove your people, and comfort their humble ones
  simplified_phrase: Correct your people, comfort the humble among them
  preserved_meaning: Ezra must correct his people and encourage their humble members.
  reasoning_layer_used: POB base text
  rationale: The wording replaces formal language and clearly identifies who receives comfort.
- pob_phrase: renounce the corruptible life now
  simplified_phrase: say farewell to this perishable life
  preserved_meaning: Ezra must leave mortal, perishable life rather than merely reject immoral conduct.
  reasoning_layer_used: source-grounded lexical revision and immediate context
  rationale: “Perishable life” preserves the audited mortality-focused meaning in natural English.
translation_notes:
  risk_flags:
