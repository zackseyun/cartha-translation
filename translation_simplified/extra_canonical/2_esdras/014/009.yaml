translation:
  language: en
  text: For you will be taken up from among the people, and you will remain[a] with my son and with others like you until the times come to an end.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “you will dwell with my son.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: from among men
  simplified_phrase: from among the people
  preserved_meaning: Ezra will be removed from human society without specifying exactly how.
  reasoning_layer_used: POB translation and revision pass
  rationale: “People” is natural modern English and preserves the scope and ambiguity of the POB.
- pob_phrase: with those like you
  simplified_phrase: with others like you
  preserved_meaning: Ezra will be with people who share his relevant status or character.
  reasoning_layer_used: POB translation
  rationale: Adding “others” makes the comparison read naturally without defining how they are alike.
- pob_phrase: until the times are finished
  simplified_phrase: until the times come to an end
  preserved_meaning: This state continues for the full remaining period.
  reasoning_layer_used: POB translation and applied revisions
  rationale: The idiomatic wording keeps both the endpoint and the duration emphasized by the source.
translation_notes:
  risk_flags:
  - risk: “Taken up” may suggest a particular kind of heavenly removal.
    mitigation: The wording retains the POB image but does not explain the manner or destination.
  - risk: “Others like you” leaves the basis of likeness unstated.
    mitigation: The source and POB do not define the likeness, so the ambiguity is preserved.
