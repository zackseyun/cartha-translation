translation:
  language: en
  text: The Most High enabled the five men to understand. They took turns writing down what was spoken, using written characters they did not know.[a] They remained there for forty days.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: These may have been an unfamiliar script, shorthand, or a writing system God enabled them to use; the Latin does not specify.
    reason: lexical_alternative
