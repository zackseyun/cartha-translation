  yaml_path: translation/extra_canonical/2_esdras/012/048.yaml
  text: For I have not forsaken you, nor have I departed from you, but I came to this place to pray for the desolation of Zion and to seek mercy for the humiliation of your sanctuary.
  revision_pass:
    model: gpt-5.4
    timestamp: '2026-04-23T19:51:31Z'
    unchanged: false
    changes_summary: Changed 'withdrawn from you' to 'departed from you' for closer lexical alignment with excessi a vobis and more natural formal English. No other changes needed.
translation:
  language: en
  text: I have not abandoned you or left you. I came here to pray for Zion, which lies in ruins, and to ask for mercy for your sanctuary, which has been brought low.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: I have not forsaken you, nor have I departed from you
  simplified_phrase: I have not abandoned you or left you
  preserved_meaning: The speaker denies both abandoning the people and going away from them.
  reasoning_layer_used: POB text and revision rationale
  rationale: Common verbs preserve the two-part denial in immediately clear English.
- pob_phrase: to pray for the desolation of Zion
  simplified_phrase: to pray for Zion, which lies in ruins
  preserved_meaning: The prayer concerns Zion in its devastated condition and may be on its behalf.
  reasoning_layer_used: Latin source, POB translation, and grounding review
  rationale: This wording explains Zion's desolation without reducing “for” to a purely causal relation.
- pob_phrase: to seek mercy for the humiliation of your sanctuary
  simplified_phrase: to ask for mercy for your sanctuary, which has been brought low
  preserved_meaning: Mercy is sought for the sanctuary in its humiliated condition.
  reasoning_layer_used: Latin source, POB translation, and grounding review
  rationale: The passive wording clarifies the sanctuary's abasement without naming a cause.
interpretive_expansions:
- pob_phrase: the desolation of Zion
  rendering: Zion, which lies in ruins
  claim: Zion is in a devastated state.
  evidence:
  - POB explicitly identifies Zion's desolation.
  - The Latin phrase “pro desolatione Sion” names Zion's devastated condition.
  confidence: high
  alternatives_preserved:
  - The prayer may be about Zion's ruin or offered on Zion's behalf.
- pob_phrase: the humiliation of your sanctuary
  rendering: your sanctuary, which has been brought low
  claim: The sanctuary has suffered humiliation or abasement.
  evidence:
  - POB describes the sanctuary's humiliation.
  - The Latin “humilitate sanctificationis uestrae” presents it as brought low.
  confidence: high
  alternatives_preserved:
  - The wording does not specify who or what brought the sanctuary low.
translation_notes:
  risk_flags:
  - risk: “Lies in ruins” makes the nature of Zion's desolation concrete.
    mitigation: The source and POB directly support a devastated condition, while “for Zion” preserves the broader relation of prayer.
  - risk: “Sanctuary” may be unfamiliar to some readers.
    mitigation: The term is retained because it names the sacred place and preserves the POB's religious meaning.
