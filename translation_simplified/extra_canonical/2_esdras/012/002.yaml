translation:
  language: en
  text: I looked, and there before me, the remaining head could no longer be seen. The two wings that had gone over to it rose, then were put in place to rule. Their rule was brief and full of turmoil. I looked again, and they too could no longer be seen. The eagle’s entire body was burning, and the earth was deeply terrified.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: I looked, and behold
  simplified_phrase: I looked, and there before me
  preserved_meaning: The vision draws attention to what the seer now observes.
  reasoning_layer_used: POB base text and source image
  rationale: The wording conveys the force of “behold” in natural modern English.
- pob_phrase: arose and were set up to reign
  simplified_phrase: rose, then were put in place to rule
  preserved_meaning: The wings first rise and are then established in power as two distinct actions.
  reasoning_layer_used: applied grammar revision
  rationale: The sequence preserves both Latin verbs without the formal phrase “set up to reign.”
- pob_phrase: did not appear
  simplified_phrase: could no longer be seen
  preserved_meaning: The head and wings cease to be visible within the vision.
  reasoning_layer_used: POB lexical alignment and immediate context
  rationale: The clearer visual wording does not claim that they ceased to exist.
translation_notes:
  risk_flags:
  - risk: “Could no longer be seen” may suggest an observer’s limitation rather than visionary nonappearance.
    mitigation: The repeated vision setting keeps the wording tied to what appeared before the seer.
