translation:
  language: en
  text: And I said, “O Sovereign Lord, if you have looked on me with favor, if you have judged me righteous above many others, and if my prayer has surely risen into your presence, then give me strength and show yourself to me, your servant.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: if I have found favor before your eyes
  simplified_phrase: if you have looked on me with favor
  preserved_meaning: The speaker asks whether the Lord regards him favorably.
  reasoning_layer_used: POB base text
  rationale: The rewrite makes the biblical image natural without losing its sense.
- pob_phrase: if I have been justified before you more than many
  simplified_phrase: if you have judged me righteous above many others
  preserved_meaning: The speaker asks whether God has judged him righteous in comparison with many others.
  reasoning_layer_used: POB base text
  rationale: The active wording clearly identifies God as the one making the judgment.
- pob_phrase: if my petition has surely gone up before your face, strengthen me
  simplified_phrase: if my prayer has surely risen into your presence, then give me strength
  preserved_meaning: The speaker asks whether his plea has reached God and requests strength.
  reasoning_layer_used: POB base text and latest revision pass
  rationale: The wording preserves the upward image while replacing formal expressions with common English.
