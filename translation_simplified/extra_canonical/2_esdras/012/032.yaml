translation_notes:
  risk_flags:
  - risk: “Ungodly deeds” interprets the abstract plural “impieties” as acts.
    mitigation: It preserves both the religious-moral force and the source's plural expression.
  - risk: “Set their contempt before them” remains less immediately transparent than the rest of the verse.
    mitigation: The wording preserves the source image and avoids settling its possessive nuance.
