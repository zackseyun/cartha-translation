translation:
  language: en
  text: This is the Anointed One,[a] whom the Most High has reserved for the time of the end to stand against them and their ungodly deeds. He will rebuke them for the wrongs they have done and set their contempt before them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“Anointed One” has messianic force here: in this vision he acts as an end-time deliverer.'
    reason: source_note
simplification_decisions:
- pob_phrase: reserved for the end against them and their impieties
  simplified_phrase: reserved for the time of the end to stand against them and their ungodly deeds
  preserved_meaning: The Most High has set him apart for an end-time confrontation with these people and their impious acts.
  reasoning_layer_used: POB translation, Latin source, and messianic footnote
  rationale: This clarifies the time and opposition while retaining the religious force and plurality of their acts.
- pob_phrase: rebuke them for their injustices
  simplified_phrase: rebuke them for the wrongs they have done
  preserved_meaning: He will rebuke them for their unjust acts.
  reasoning_layer_used: POB translation and Latin source
  rationale: The concrete wording makes the abstract plural easier to understand.
- pob_phrase: set their contempt before them
  simplified_phrase: set their contempt before them
  preserved_meaning: He will confront them with their contempt without defining its precise nuance.
  reasoning_layer_used: POB translation and source-language image
  rationale: The image is retained because clearer paraphrases would resolve an ambiguity the audit leaves open.
interpretive_expansions:
- pob_phrase: for the end
  rendering: for the time of the end
  claim: The end is the final period when the reserved figure acts.
  evidence:
  - The POB footnote describes the figure as an end-time deliverer.
  - The verse says the Most High reserved him for this end.
  confidence: high
  alternatives_preserved:
