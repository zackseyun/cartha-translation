translation:
  language: en
  text: But the survivors of your people who are found within my holy borders[a] will be saved.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “within my holy boundary.”
    reason: lexical_alternative
  - marker: b
    text: The surviving Latin breaks off here; “will be saved” is preserved in other ancient versions.
    reason: source_note
simplification_decisions:
- pob_phrase: those of your people who are left
  simplified_phrase: the survivors of your people
  preserved_meaning: The verse refers to a remnant of the speaker’s people.
  reasoning_layer_used: POB text and revision history
  rationale: “Survivors” clearly preserves the distinct remnant sense in natural English.
- pob_phrase: who are found within my holy border
  simplified_phrase: who are found within my holy borders
  preserved_meaning: The survivors are located inside the speaker’s holy boundary.
  reasoning_layer_used: Latin source phrase and POB rendering
  rationale: The wording keeps the spatial image without adding an unsupported reference to land.
- pob_phrase: shall be saved
  simplified_phrase: will be saved
  preserved_meaning: The survivors are promised future deliverance.
  reasoning_layer_used: POB applied revision and ancient-version evidence
  rationale: “Will” is more common modern English while retaining the restored main verb.
translation_notes:
  risk_flags:
  - risk: “Survivors” may suggest a specific prior disaster more strongly than “those who are left.”
    mitigation: The term is limited by “of your people” and preserves the POB’s remnant sense.
  - risk: The main verb is absent from the defective surviving Latin.
    mitigation: Footnote b identifies its support in other ancient versions, following the POB revision.
