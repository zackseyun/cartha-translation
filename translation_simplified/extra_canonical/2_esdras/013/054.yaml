simplification_decisions:
- pob_phrase: forsaken what belongs to you
  simplified_phrase: set aside your own affairs
  preserved_meaning: He deliberately gave up attention to his own matters.
  reasoning_layer_used: POB translation and Latin source
  rationale: “Set aside” preserves deliberate renunciation while “affairs” clarifies what belonged to him.
- pob_phrase: devoted yourself to what belongs to me
  simplified_phrase: devoted yourself to my concerns
  preserved_meaning: He gave sustained attention to God's matters.
  reasoning_layer_used: POB translation and immediate contrast
  rationale: Naming “my concerns” makes the object clear and preserves the contrast with his own affairs.
- pob_phrase: searched out my law
  simplified_phrase: carefully studied my law
  preserved_meaning: He actively sought to understand God's law.
  reasoning_layer_used: POB translation and Latin source
  rationale: “Carefully studied” expresses sustained inquiry in familiar English.
