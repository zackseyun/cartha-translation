simplification_decisions:
- pob_phrase: nation against nation, and kingdom against kingdom
  simplified_phrase: One nation will be against another, and one kingdom against another.
  preserved_meaning: Nations and kingdoms will be set against one another.
  reasoning_layer_used: Applied revision, source idiom, and grounding review
  rationale: The wording preserves “nation” and the parallel opposition without adding a specific action.
- pob_phrase: And it shall be, when these things happen
  simplified_phrase: When these things happen
  preserved_meaning: The unfinished next event follows when the described events occur.
  reasoning_layer_used: POB syntax and immediate context
  rationale: Dropping the formal lead-in makes the continuing condition easier to follow.
- pob_phrase: the signs occur that I showed you before
  simplified_phrase: the signs I showed you before appear
  preserved_meaning: The previously revealed signs will take place or become evident.
  reasoning_layer_used: POB main text
  rationale: “Appear” gives the clause natural modern English while retaining its reference to earlier signs.
translation_notes:
