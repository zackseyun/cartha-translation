  text: But he will stand on top of Mount Zion. Then Zion will appear, and everyone will see it, made ready and built, just as you saw the mountain carved out without human hands.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: upon the summit of Mount Zion
  simplified_phrase: on top of Mount Zion
  preserved_meaning: He stands at Mount Zion’s highest point.
  reasoning_layer_used: POB text and Latin source
  rationale: “Top” gives the meaning of “summit” in common English.
- pob_phrase: Zion will come and be shown to all
  simplified_phrase: Zion will appear, and everyone will see it
  preserved_meaning: Zion becomes visibly present before everyone.
  reasoning_layer_used: POB text and Latin source
  rationale: The active wording makes Zion’s public appearance easier to understand.
- pob_phrase: prepared and built
  simplified_phrase: made ready and built
  preserved_meaning: Zion is both prepared and constructed.
  reasoning_layer_used: POB text and Latin source
  rationale: “Made ready” clarifies “prepared” without adding a claim of full completion.
