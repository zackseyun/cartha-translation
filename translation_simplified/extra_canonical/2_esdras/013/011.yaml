translation:
  language: en
  text: The wave of fire, the fiery breath, and the great storm all came together. They struck the advancing crowd that was ready to fight and burned them all up. In an instant, nothing remained visible of that countless crowd except ash dust and the smell of smoke. I saw this and was astonished.
