translation:
  language: en
  text: But he, my Son, will rebuke the nations that have come for their godless deeds—deeds that have drawn near like a storm. He will denounce to their faces their evil thoughts and torments.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the impieties of the nations that have come
  simplified_phrase: the nations that have come for their godless deeds
  preserved_meaning: The Son rebukes the arriving nations because of their irreverent wrongdoing.
  reasoning_layer_used: POB base text and Latin source
  rationale: “Godless deeds” expresses “impieties” in common English without weakening its moral and religious force.
- pob_phrase: these things that have drawn near like a storm
  simplified_phrase: deeds that have drawn near like a storm
  preserved_meaning: The nations’ impieties approach with the threatening force pictured by a storm.
  reasoning_layer_used: Latin grammar and POB imagery
  rationale: Repeating “deeds” clarifies the difficult pronoun while retaining the storm image.
- pob_phrase: he will reproach them to their faces with
  simplified_phrase: He will denounce to their faces
  preserved_meaning: The Son confronts them directly and speaks against their evil.
  reasoning_layer_used: applied lexical revision
  rationale: “Denounce” preserves the accusatory force of the Latin verb in more natural English.
