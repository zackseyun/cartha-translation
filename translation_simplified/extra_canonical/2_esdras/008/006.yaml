translation:
  language: en
  text: O Lord who rules over us, if you permit your servant to pray before you, give us seed for our hearts and cultivate our understanding, so that fruit may grow, by which every mortal person may live.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “every corruptible one,” referring here to mortal, perishable humanity.
    reason: simplification_note
  - marker: b
    text: Or, “permit your servant to pray before you and give us seed for our hearts.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: O Lord over us
  simplified_phrase: O Lord who rules over us
  preserved_meaning: The Lord has authority over the speakers.
  reasoning_layer_used: POB base text
  rationale: The verb makes the relationship expressed by “over us” immediately clear.
- pob_phrase: give us seed for the heart and cultivation for the understanding
  simplified_phrase: give us seed for our hearts and cultivate our understanding
  preserved_meaning: God is asked to provide inner seed and prepare human understanding for growth.
  reasoning_layer_used: source imagery and POB base text
  rationale: Turning “cultivation” into a verb creates natural English while preserving both agricultural images.
- pob_phrase: every corruptible one may live
  simplified_phrase: every mortal person may live
  preserved_meaning: Every frail, perishable human being may receive life.
  reasoning_layer_used: applied lexical revision
  rationale: “Mortal person” expresses perishability without implying moral corruption.
interpretive_expansions:
- pob_phrase: O Lord over us
  rendering: O Lord who rules over us
  claim: Being “over” the speakers denotes the Lord’s authority.
  evidence:
