  preserved_meaning: God supplies the developing body's physical members.
  reasoning_layer_used: POB translation
  rationale: “Limbs” gives the bodily sense of “members” in common English.
- pob_phrase: for nine months your formation bears your creature that has been created in it
  simplified_phrase: For nine months, your formed creation carries within it the creature you made
  preserved_meaning: God's formed work carries his creature through nine months of gestation.
