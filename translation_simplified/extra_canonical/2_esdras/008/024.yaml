translation:
  language: en
  text: Lord, hear the prayer of your servant. Listen to the plea of the creature you formed, and pay attention to my words. As long as I live, I will speak; as long as I can understand, I will answer.
  philosophy: optimal-equivalence
simplification_decisions:
