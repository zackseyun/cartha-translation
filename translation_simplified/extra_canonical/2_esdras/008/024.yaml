  simplified_phrase: Listen to the plea of the creature you formed
  preserved_meaning: The speaker asks God to hear the appeal of a human being whom God created.
  reasoning_layer_used: Applied revision and source wording
  rationale: This replaces an old idiom while preserving the image of humanity as formed by God.
- pob_phrase: For while I live I will speak
  simplified_phrase: As long as I live, I will speak
  preserved_meaning: The speaker intends to speak throughout the time he remains alive.
  reasoning_layer_used: Latin source and latest revision pass
  rationale: The ordinary time expression makes the clause immediately clear.
- pob_phrase: while I have understanding I will answer
  simplified_phrase: as long as I can understand, I will answer
  preserved_meaning: The speaker will respond while he retains the ability to understand.
  reasoning_layer_used: Latin source and latest revision pass
  rationale: The verbal wording is more natural without changing the condition placed on answering.
