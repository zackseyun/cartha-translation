translation:
  language: en
  text: For you agreed to obey and set out unwillingly.[a] You were given only a short time to live.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “went forward unwillingly.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: consented to obey
  simplified_phrase: agreed to obey
  preserved_meaning: The addressee willingly accepted the duty to obey.
  reasoning_layer_used: POB revision on Latin obaudire
  rationale: “Agreed” expresses consent in more common English while retaining obedience.
- pob_phrase: have advanced unwillingly
  simplified_phrase: set out unwillingly
  preserved_meaning: The addressee began or continued a journey despite reluctance.
  reasoning_layer_used: Tier 3 lexical adjudication on Latin profecta es
  rationale: “Set out” follows the source-driven journey sense and is clearer than “advanced.”
- pob_phrase: for no span has been given to you except only a little while to live
  simplified_phrase: You were given only a short time to live
  preserved_meaning: The allotted lifetime is very brief.
  reasoning_layer_used: POB base text and Latin source clause
  rationale: The shorter sentence removes redundancy without weakening the limit on lifespan.
translation_notes:
  risk_flags:
  - risk: The Latin journey expression may also suggest departure into death rather than merely beginning a journey.
    mitigation: The main text keeps the image “set out,” while the footnote preserves the alternative sense of moving forward.
