  text: Do not let this come upon us. Instead, spare your people and show mercy to those who belong to you, because you have mercy on what you have made.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: let it not be upon us
  simplified_phrase: Do not let this come upon us.
  preserved_meaning: The speaker pleads that the threatened outcome not fall on them.
  reasoning_layer_used: Applied source-grounded revision based on the Latin clause continuing from 8:44.
  rationale: “Come upon us” makes the plea natural while retaining the force of Latin super nos.
- pob_phrase: have mercy on your inheritance
  simplified_phrase: show mercy to those who belong to you
  preserved_meaning: God's people are his own possession and the objects of his mercy.
  reasoning_layer_used: POB main text and immediate parallel with “your people.”
  rationale: The wording explains the biblical possession image for readers unfamiliar with “inheritance” as a name for a people.
- pob_phrase: your own creation
  simplified_phrase: what you have made
  preserved_meaning: The appeal rests on God's mercy toward his creatures.
  reasoning_layer_used: POB main text controlled by Latin tuae creaturae.
  rationale: The active wording states the creator-creature relationship in common English.
interpretive_expansions:
- pob_phrase: your inheritance
  rendering: those who belong to you
  claim: The inheritance here refers to God's people as his possession.
  evidence:
  - It stands parallel to “your people” in the same plea.
  - The possessive “your” identifies the inheritance as belonging to God.
  confidence: high
  alternatives_preserved:
  - your inheritance
translation_notes:
  risk_flags:
  - risk: Replacing “inheritance” removes a traditional biblical metaphor.
    mitigation: “Those who belong to you” preserves its central possession meaning in direct language.
