translation:
  language: en
  text: What was foretold awaits you.[a] But thirst and the torments that have been prepared await them. The Most High did not want human beings to be destroyed. Yet the very people he created defiled his name.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Still more, they trampled his righteous ones.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: what has been foretold will receive you
  simplified_phrase: What was foretold awaits you
  preserved_meaning: The foretold events stand ready to meet the people addressed as “you.”
  reasoning_layer_used: POB revision and Latin source
  rationale: “Awaits” makes the personified image natural while preserving its direction.
- pob_phrase: thirst and torments, which have been prepared, will receive them
  simplified_phrase: thirst and the torments that have been prepared await them
  preserved_meaning: The other group faces thirst and multiple prepared torments.
  reasoning_layer_used: POB revision and Latin source
  rationale: The recast clause retains preparation without saying they were prepared specifically for this group.
- pob_phrase: man should be destroyed; but they themselves, who were created
  simplified_phrase: human beings to be destroyed. Yet the very people he created
  preserved_meaning: The Most High did not desire humanity’s destruction, but created people themselves dishonored him.
  reasoning_layer_used: POB text and source syntax
  rationale: Common collective wording and two sentences replace generic “man” and a difficult relative clause.
