translation:
  language: en
  text: Can you love what I have created more than I do? Yet you have often gone near to the unrighteous. You must never do that. Even in this, you will be remarkable before the Most High, because you have humbled yourself as you should.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: my creation
  simplified_phrase: what I have created
  preserved_meaning: God speaks of what he made and asserts his greater love for it.
  reasoning_layer_used: POB translation and immediate context
  rationale: The verbal wording is clearer without narrowing the scope of creation.
- pob_phrase: drawn yourself near to the unrighteous
  simplified_phrase: gone near to the unrighteous
  preserved_meaning: Ezra has brought himself near unrighteous people rather than merely compared himself with them.
  reasoning_layer_used: applied lexical revision and grounding review
  rationale: This natural wording preserves the source image of nearness without implying a narrower kind of association.
- pob_phrase: as is fitting
  simplified_phrase: as you should
  preserved_meaning: Ezra's humility is presented as proper conduct.
  reasoning_layer_used: POB translation
  rationale: The common expression states the same moral appropriateness directly.
