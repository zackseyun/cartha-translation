  preserved_meaning: His distress leads him to begin praying in God's presence.
  reasoning_layer_used: POB base text
  rationale: “So” states the same conclusion more plainly.
- pob_phrase: the falls of us who inhabit the earth
  simplified_phrase: that we who live on the earth have fallen
  preserved_meaning: The earth's inhabitants are viewed as fallen, not as having merely minor failings.
  reasoning_layer_used: Applied revision on Latin lapsos and POB revision history
  rationale: The wording preserves the strong image of falling without adding a degree of fallenness.
