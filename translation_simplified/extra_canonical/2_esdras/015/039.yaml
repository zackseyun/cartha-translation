translation:
  language: en
  text: Winds from the east will grow strong. They will hem it in together with the cloud he raised in anger. Then the star appointed to bring destruction will be violently attacked by winds from the east, south, and west.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Latin wording is very difficult, so the actions and what they refer to are uncertain. Another possible sense is that the cloud and the destructive star will be thrown into confusion toward the east and west.
    reason: textual_variant
