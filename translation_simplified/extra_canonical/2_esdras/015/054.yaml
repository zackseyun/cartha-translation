translation:
  language: en
  text: When were you made drunk? Make your face beautiful! A prostitute’s wages are in your bosom; therefore, you will be repaid.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Adorn the beauty of your face!
  simplified_phrase: Make your face beautiful!
  preserved_meaning: The command tells her to enhance her facial appearance.
  reasoning_layer_used: lexical revision and Latin speciem vultus tui
  rationale: The direct command replaces an awkward expression without changing its meaning.
- pob_phrase: The wages of a harlot are in your bosom
  simplified_phrase: A prostitute’s wages are in your bosom
  preserved_meaning: The city-as-woman image and the location of her immoral earnings remain intact.
  reasoning_layer_used: adjudicated lexical decision and Latin merces fornicariae in sinus tuos
  rationale: “Prostitute” is modern English, while “bosom” preserves the source image.
- pob_phrase: therefore you will receive repayment
  simplified_phrase: therefore, you will be repaid
  preserved_meaning: She will receive a corresponding return for her conduct.
  reasoning_layer_used: POB translation and Latin redditionem recipies
  rationale: The shorter passive wording clearly retains the wages-and-repayment connection.
translation_notes:
  risk_flags:
  - risk: “Repaid” could sound like ordinary compensation rather than judgment.
    mitigation: The surrounding prostitute’s-wages language preserves the source’s retributive irony.
  - risk: “Bosom” is less common today but carries the source’s bodily image.
    mitigation: It remains understandable and avoids narrowing the location to the breast.
