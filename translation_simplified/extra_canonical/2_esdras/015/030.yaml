  preserved_meaning: They are driven by intense anger.
  reasoning_layer_used: POB text and Latin source
  rationale: Common wording preserves the force of the repeated anger terms.
- pob_phrase: they will come with great force and stand for battle against them
  simplified_phrase: in great force. They will take their stand against them in battle
  preserved_meaning: They arrive powerfully and confront their opponents in battle.
  reasoning_layer_used: POB clause structure and Latin source
  rationale: Two direct clauses make the military action easier to follow.
- pob_phrase: lay waste the portion of the land of the Assyrians
  simplified_phrase: devastate part of the Assyrians’ land
  preserved_meaning: They destroy a portion, not necessarily all, of Assyrian territory.
  reasoning_layer_used: POB lexical scope
  rationale: The shorter wording retains the limited scope of “portion.”
