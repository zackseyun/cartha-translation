translation:
  language: en
  text: The Lord says, “How terrible for those who sin and do not obey my commands!”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Woe to those
  simplified_phrase: How terrible for those
  preserved_meaning: The Lord solemnly declares distress or doom against the people addressed without specifying when it occurs.
  reasoning_layer_used: POB text, Latin source, and grounding review
  rationale: This makes “woe” understandable while avoiding an unsupported future time frame.
- pob_phrase: do not keep my commandments
  simplified_phrase: do not obey my commands
  preserved_meaning: They fail to do what the Lord has commanded.
  reasoning_layer_used: POB text and Latin source
  rationale: “Do not obey” expresses the command’s sense in ordinary English.
- pob_phrase: says the Lord
  simplified_phrase: The Lord says
  preserved_meaning: The warning is spoken with the Lord’s authority.
  reasoning_layer_used: POB text
  rationale: Identifying the speaker first makes the quotation easier to follow.
translation_notes:
  risk_flags:
  - risk: Replacing “woe” may lessen its traditional prophetic resonance.
    mitigation: The exclamation “How terrible” preserves the declaration’s solemn force.
