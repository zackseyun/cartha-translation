  text: Then nations of Arabian dragons will come out with many chariots.[a] Their hissing will carry across the land and be heard a day's journey away,[b] making everyone who hears it afraid and trembling.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The difficult Latin literally says “nations of Arabian dragons.” The image may be symbolic, monstrous, or a description of a people whose precise meaning is now uncertain.
    reason: source_note
  - marker: b
    text: The Latin describes the distance the sound carries; it could also be read, less likely, as “from the day of their march.”
    reason: lexical_alternative
