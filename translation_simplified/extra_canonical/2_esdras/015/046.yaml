translation:
  language: en
  text: And you,[a] Asia, who shared in Babylon’s splendor and in the glory of Babylon’s appearance—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This address to Asia comes from the later Christian appendix commonly called 6 Ezra, not from the Jewish core of 4 Ezra.
    reason: source_note
simplification_decisions:
- pob_phrase: partner in the splendor of Babylon
  simplified_phrase: who shared in Babylon’s splendor
  preserved_meaning: Asia participated in the splendor associated with Babylon.
  reasoning_layer_used: POB translation and revision rationale
  rationale: The verbal form expresses the partnership more naturally without weakening it.
- pob_phrase: in the glory of her person
  simplified_phrase: in the glory of Babylon’s appearance
  preserved_meaning: Asia shared in the glory associated with Babylon’s personified outward appearance.
  reasoning_layer_used: Latin source phrase, POB wording, and grounding review
  rationale: The wording keeps both the distinct idea of glory and Babylon as the explicit referent.
translation_notes:
  risk_flags:
  - risk: “Appearance” may narrow the figurative range of the Latin persona.
    mitigation: The wording preserves Babylon’s personified outward image while avoiding the misleading modern sense of personality.
