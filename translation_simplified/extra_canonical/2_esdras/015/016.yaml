translation:
  language: en
  text: For there will be disorder among the people. They will overpower one another and ignore their king and the chief of their nobles, in their power.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: instability among men
  simplified_phrase: disorder among the people
  preserved_meaning: Society will be unsettled and lack stable order.
  reasoning_layer_used: POB base text and immediate context
  rationale: “Disorder” expresses social instability in common English.
- pob_phrase: overpowering one another, they will pay no attention to
  simplified_phrase: They will overpower one another and ignore
  preserved_meaning: They will dominate each other while disregarding recognized authorities.
  reasoning_layer_used: POB base text
  rationale: A direct clause and “ignore” make both actions easier to follow.
- pob_phrase: the chief of their nobles
  simplified_phrase: the chief of their nobles
  preserved_meaning: The text refers to one leader of the nobles, not to the nobles collectively.
  reasoning_layer_used: applied source-grounded grammar revision
  rationale: The audited singular leader is retained despite the phrase’s formality.
