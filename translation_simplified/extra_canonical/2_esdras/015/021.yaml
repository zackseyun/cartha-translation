    changes_summary: Changed 'do' to 'have done' for more natural and accurate English with 'to this day'; otherwise retained the formal structure and wording.
translation:
  language: en
  text: “I will treat them as they have treated the people I have chosen, right up to this day. I will give them their repayment in their own laps.[a] This is what the Lord God says:”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The “lap” pictures the fold of a garment used like a pouch.
    reason: cultural_note
simplification_decisions:
- pob_phrase: As they have done to my chosen ones ... so I will do
  simplified_phrase: I will treat them as they have treated the people I have chosen
  preserved_meaning: God will deal with them in the same way they dealt with his chosen people.
  reasoning_layer_used: POB translation and latest revision pass
  rationale: The reciprocal structure is recast in ordinary English without weakening the judgment.
- pob_phrase: to this day
  simplified_phrase: right up to this day
  preserved_meaning: Their treatment of God's people has continued to the present time.
  reasoning_layer_used: latest revision pass
  rationale: “Right up to” makes the continuing time span immediately clear.
- pob_phrase: repay into their lap
  simplified_phrase: give them their repayment in their own laps
  preserved_meaning: God will repay them while retaining the image of repayment received in a garment fold.
  reasoning_layer_used: applied lexical revision
  rationale: This removes the unsupported action “pour” while preserving the adjudicated lap image.
translation_notes:
  risk_flags:
  - risk: Modern readers may understand “lap” only as a body part.
    mitigation: The footnote explains the garment fold pictured as a pouch.
