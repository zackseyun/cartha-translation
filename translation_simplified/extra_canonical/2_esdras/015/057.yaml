translation:
  language: en
  text: Your cities will be destroyed. All your people in the open country will be killed by the sword. Those in the mountains will starve to death and eat flesh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Read together with the opening words of the next verse, this may mean “eat their own flesh.”
    reason: source_note
simplification_decisions:
- pob_phrase: Your cities will be shattered
  simplified_phrase: Your cities will be destroyed
  preserved_meaning: The cities will be violently ruined.
  reasoning_layer_used: POB main text and Latin source
  rationale: “Destroyed” states the result naturally without weakening the threatened devastation.
- pob_phrase: all your people in the field will fall by the sword
  simplified_phrase: All your people in the open country will be killed by the sword
  preserved_meaning: The people outside the cities will die through armed violence.
  reasoning_layer_used: POB revision rationale and Latin source
  rationale: The wording clarifies both the location and the familiar biblical idiom “fall by the sword.”
- pob_phrase: will perish by famine
  simplified_phrase: will starve to death
  preserved_meaning: Hunger will cause their deaths.
  reasoning_layer_used: POB main text
  rationale: “Starve to death” expresses the same event in common English.
translation_notes:
  risk_flags:
  - risk: “Eat flesh” does not identify whose flesh is eaten within this verse.
    mitigation: The main text keeps the source-bounded wording, while the footnote preserves the possible sense supplied across the verse break.
