- pob_phrase: every unbeliever
  simplified_phrase: everyone who does not believe
  preserved_meaning: Every person characterized by unbelief is included.
  reasoning_layer_used: POB base text and Latin source
  rationale: The verbal wording clarifies the label without implying a deliberate refusal to believe.
- pob_phrase: in his unbelief
