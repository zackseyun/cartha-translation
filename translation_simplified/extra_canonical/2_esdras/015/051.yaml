    changes_summary: Restored the omitted opening clause ('The burning that has been sent out against you will rise up'), replaced interpretive 'wretched' with the more literal 'made poor,' rendered plaga more accurately as 'blow,' and removed the unsupported addition 'your mighty ones and your lovers,' leaving the final phrase as the incomplete but faithful 'receive your own.'
translation:
  language: en
  text: The burning sent against you will flare up. The blow will leave you weak and impoverished, and you will be scourged with wounds, so that you will not be able to receive your own.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The surviving Latin says “your own” without identifying whom it means.
    reason: source_note
simplification_decisions:
- pob_phrase: The burning that has been sent out against you will rise up
  simplified_phrase: The burning sent against you will flare up
  preserved_meaning: The burning force sent against the addressee rises into action.
  reasoning_layer_used: POB text and source image
  rationale: “Flare up” conveys rising fire in natural English while preserving the burning image.
- pob_phrase: you will be weakened and made poor by the blow
  simplified_phrase: The blow will leave you weak and impoverished
  preserved_meaning: The blow causes weakness and deprivation.
  reasoning_layer_used: latest revision pass
  rationale: The active wording clarifies the cause while retaining the POB sense of being made poor.
- pob_phrase: and scourged by wounds
  simplified_phrase: and you will be scourged with wounds
  preserved_meaning: The addressee suffers scourging and wounds as physical punishment.
  reasoning_layer_used: source payload and independent grounding review
  rationale: This keeps the punishment image without adding that wounds cover the body.
translation_notes:
  risk_flags:
  - risk: “Your own” remains unclear because the surviving Latin does not identify its referent.
    mitigation: The main text preserves the ambiguity, and the footnote explains the source limitation.
  - risk: “Impoverished” may be read as financial loss alone.
    mitigation: Its placement with weakness, the blow, scourging, and wounds supports the broader sense of deprivation.
