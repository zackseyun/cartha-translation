translation:
  language: en
  text: So do not keep trying to find out how the ungodly will be tormented. Instead, seek to understand how the righteous will be saved, who the age belongs to, for whose sake it exists, and when it will be.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: do not be curious any longer about
  simplified_phrase: do not keep trying to find out
  preserved_meaning: The reader is told to stop pursuing this question.
  reasoning_layer_used: POB translation and Latin source
  rationale: This turns an abstract warning about curiosity into a direct command to stop investigating.
- pob_phrase: but inquire
  simplified_phrase: Instead, seek to understand
  preserved_meaning: Attention should turn from the ungodly's torment to the righteous's salvation.
  reasoning_layer_used: POB contrast and immediate sentence context
  rationale: This makes the shift in attention clear in ordinary English.
- pob_phrase: whose the age is, and for whose sake the age is, and when
  simplified_phrase: who the age belongs to, for whose sake it exists, and when it will be
  preserved_meaning: The questions concern the age's ownership, purpose, and time.
  reasoning_layer_used: POB syntax controlled by the Latin clauses
  rationale: Natural English replaces the difficult clause structure without making “when” refer specifically to the age's arrival.
interpretive_expansions:
- pob_phrase: and when
  rendering: and when it will be
  claim: The elliptical final question concerns the time of the age without specifying its arrival.
  evidence:
  - The POB places “when” after two questions about “the age.”
  - The Latin quando is elliptical and does not state an event such as coming.
  confidence: high
  alternatives_preserved:
