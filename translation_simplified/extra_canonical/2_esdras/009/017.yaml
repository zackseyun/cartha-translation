translation:
  language: en
  text: He answered me, “Just as a field is, so are its seeds. Just as flowers are, so are their colors. Just as the work is, so is what is created. And just as the farmer is, so is the threshing floor. For there was a time of the age.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: As the field is, so also are the seeds; and as the flowers are, so also are the colors
  simplified_phrase: Just as a field is, so are its seeds. Just as flowers are, so are their colors.
  preserved_meaning: The field-to-seeds and flowers-to-colors comparisons retain their original direction.
  reasoning_layer_used: POB translation and Latin parallel clauses
  rationale: Short parallel sentences make both comparisons easier to follow.
- pob_phrase: as the work is, so also is the creation; and as the farmer is, so also is the threshing floor
  simplified_phrase: Just as the work is, so is what is created. And just as the farmer is, so is the threshing floor.
  preserved_meaning: The work remains compared to its created result, and the farmer remains compared to the threshing floor.
  reasoning_layer_used: POB translation, source syntax, and grounding review
  rationale: “What is created” clarifies the abstract noun without reversing either comparison.
- pob_phrase: For there was a time of the age
  simplified_phrase: For there was a time of the age.
  preserved_meaning: The clause states the existence of a time associated with the age without adding “such” or recasting it as possession.
  reasoning_layer_used: Applied mistranslation revision
  rationale: The audited temporal wording is retained because a clearer paraphrase is not securely supported.
translation_notes:
  risk_flags:
