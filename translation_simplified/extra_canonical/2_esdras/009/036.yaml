translation:
  language: en
  text: As for us who received the law, we will perish because we sinned. Even our heart, which received the law, will perish.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Latin text here is rough. The main point is that those who received the law will perish, but the law itself will not perish and remains honored.
