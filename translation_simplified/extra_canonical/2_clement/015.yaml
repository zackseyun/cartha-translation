translation:
  language: en
  text: 'I do not think the counsel I have given about self-control is unimportant. Whoever puts it into practice will not regret it, but will save both himself and me, the one who counseled him. For there is a great reward in bringing back a soul that is wandering and perishing, so that it may be saved.


    This is what we can give back to God, who created us: if the speaker speaks with faith and love, and the hearer listens with faith and love.


    Therefore, let us remain faithful to what we have believed, living in righteousness and holiness. Then we may stand confidently before God, who says, “While you are still speaking, I will say, ‘Look, I am here.’”


    These words assure us of a great promise. The Lord says that he is even more ready to give than the person asking is ready to ask.


    Since we share in such great kindness, let us not keep ourselves from receiving so many good things. Just as these words bring great joy to those who put them into practice, they bring great condemnation to those who disobey them.'
  philosophy: optimal-equivalence
