  simplified_phrase: pursue what is good. Let us turn away from vice, which leads the way into sin
  preserved_meaning: The contrast between virtue and vice remains, along with the image of vice leading into sin.
  reasoning_layer_used: POB text and English witness
  rationale: Two direct sentences make the command and its image easier to follow.
- pob_phrase: seeing that they call in the fears of men
  simplified_phrase: when they bring human fears upon themselves
  preserved_meaning: People incur human fears while choosing present pleasure.
  reasoning_layer_used: POB text under provisional source status
  rationale: Natural wording preserves the unclear nature and source of the fears.
- pob_phrase: both themselves and their hearers
  simplified_phrase: both theirs and that of those who listen to them
  preserved_meaning: The doubled condemnation implicates both the teachers and their hearers.
  reasoning_layer_used: POB text and independent grounding review
  rationale: The revision preserves doubled condemnation without defining its mechanism.
