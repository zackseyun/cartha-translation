translation:
  language: en
  text: 'Therefore, my brothers and sisters, let us do the will of the Father who called us, so that we may live. Let us pursue what is good. Let us turn away from vice, which leads the way into sin, and flee from ungodliness so that evil does not overtake us.


    If we are diligent in doing good, peace will pursue us.


    People cannot find happiness when they bring human fears upon themselves and prefer present pleasure to the promise of what is coming. They do not understand how much torment present pleasure brings or how much joy the coming promise brings.


    It would be more tolerable if they alone did these things. But they keep teaching evil to innocent people. They do not realize that their condemnation will be doubled—both theirs and that of those who listen to them.'
  philosophy: optimal-equivalence
