translation:
  language: en
  text: 'Brothers and sisters, we should regard Jesus Christ as God and as the Judge of the living and the dead.


    We must not treat our salvation as something small or unimportant. If we think little of Christ, we will also expect little from him. Those who hear this message as though it concerned something unimportant are doing wrong. We also do wrong when we fail to understand what we were called from, who called us, what we were called to, and how much Jesus Christ suffered for us.


    How, then, can we repay him? What fruit would be worthy of his gift to us? How much we owe him for his many acts of mercy!


    He gave us light. He spoke to us as a father speaks to his children. He saved us when we were perishing.


    What praise can we give him? How can we repay him for all we have received?


    Our minds were crippled. We worshiped idols of wood and stone, gold, silver, and bronze—things made by human hands. Our whole life was nothing but death. We were wrapped in darkness, and a thick fog blinded us. But by his will the cloud surrounding us was removed, and we regained our sight.


    He had mercy on us. He saw how deeply we were lost in error and ruin, and in his compassion he saved us. We had no hope of salvation except the salvation that came from him.


    He called us when we were nothing, and by his will he brought us into being.'
