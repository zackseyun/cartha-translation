translation:
  language: en
  text: 'Therefore, brothers and sisters, let us leave behind our temporary home in this world and do the will of the One who called us. Let us not be afraid to leave this world.


    For the Lord says, “You will be like lambs surrounded by wolves.”


    But Peter asked him, “What if the wolves tear the lambs apart?”


    Jesus said to Peter, “The lambs should not fear the wolves once the lambs are dead. In the same way, do not fear those who kill you but can do nothing more to you. Instead, fear the One who, after you die, has power over soul and body and can cast them into Gehenna’s fire.”[a]


    Brothers and sisters, you know that our life in this body and in this world is lowly and brief. But Christ’s promise is great and wonderful: rest in the coming kingdom and eternal life.


    How, then, can we receive what he promised? We must live in holiness and righteousness. We must regard the things of this world as not belonging to us and must not desire them.


    For when we desire to possess them, we leave the righteous path.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gehenna is retained from the POB; here it names a place of fiery punishment.
    reason: cultural_note
simplification_decisions:
- pob_phrase: forsake our sojourn in this world
  simplified_phrase: leave behind our temporary home in this world
  preserved_meaning: Believers must treat their present life in the world as temporary rather than their lasting home.
  reasoning_layer_used: POB text and repeated sojourn language in the immediate context
  rationale: The concrete idea of a temporary stay is clearer as a temporary home.
- pob_phrase: the sojourn of this flesh in this world is mean and for a short time
  simplified_phrase: our life in this body and in this world is lowly and brief
  preserved_meaning: Present bodily life is humble in condition and short in duration.
  reasoning_layer_used: POB wording and public-domain English witness
  rationale: The rewrite replaces opaque “sojourn” and ambiguous modern “mean” with plain wording.
- pob_phrase: the rest of the kingdom that shall be and of life eternal
  simplified_phrase: rest in the coming kingdom and eternal life
  preserved_meaning: Christ promises both future kingdom rest and everlasting life.
  reasoning_layer_used: POB syntax and immediate promise context
  rationale: The shorter parallel phrasing makes the two promised blessings easier to follow.
interpretive_expansions:
- pob_phrase: are not able to do anything to you
  rendering: can do nothing more to you
  claim: Those who kill the hearers cannot harm them beyond death.
  evidence:
  - The clause directly follows “those who kill you.”
  - The next clause contrasts their limited power with power after death.
  confidence: high
