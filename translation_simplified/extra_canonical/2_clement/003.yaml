translation:
  language: en
  text: 'Since he has shown us such great mercy, we who are alive do not sacrifice to these dead gods or worship them. Instead, through him we have come to know the Father of truth. What response can we make to him except not denying the one through whom we came to know him?


    Yes, he himself says, “Whoever confesses me, I will confess before the Father.”


    So this is our reward, if we truly confess the one through whom we were saved.


    But how do we confess him? By doing what he says, obeying his commandments, and honoring him not only with our lips but with our whole heart and mind.


    He also says in Isaiah, “This people honors me with their lips, but their heart is far from me.”'
