translation:
  language: en
  text: 'But the Lord says, “No servant can serve two masters.” If we try to serve both God and wealth, it will do us no good.


    What good is it for someone to gain the whole world but lose his soul?


    This present age and the age to come are enemies. This age promotes adultery, moral corruption, greed, and deceit, but the coming age rejects them. So we cannot belong to both. We must turn away from one and remain faithful to the other.


    We should reject the things of this world because they are worthless, temporary, and destined to perish. Instead, we should love the things of the coming age because they are good and will never perish.


    If we do Christ’s will, we will find rest. But if we disobey his commands, nothing will save us from eternal punishment.


    Scripture also says in Ezekiel, “Even if Noah, Job, and Daniel were to rise up, they would not rescue their children from captivity.”


    If even such righteous men cannot rescue their children by their righteous deeds, how can we be confident that we will enter God’s kingdom if we do not keep our baptism pure and undefiled? Who will speak in our defense unless we are found to have done holy and righteous deeds?'
  philosophy: optimal-equivalence
