translation:
  language: en
  text: 'So then, my brothers and sisters, let us compete, because the contest is close at hand. Many enter contests whose prizes do not last, but not everyone receives the victor’s crown. It is given only to those who have worked hard and competed courageously.


    So let us compete, so that we may all receive the crown.


    Let us therefore run the straight course in the imperishable contest. Let us enter it in great numbers and compete, so that we too may receive the crown. And if we cannot all receive it, let us at least come near to it.


    We should know what happens when someone is caught cheating in a contest for a prize that does not last. First that person is whipped; then that person is removed and driven out of the racecourse.


    What do you think? What will happen to someone who cheats in the imperishable contest?


    For he says about those who have not kept the seal, “Their worm will not die, their fire will not be put out, and they will be a spectacle for all humanity.”'
