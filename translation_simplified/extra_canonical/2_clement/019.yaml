- pob_phrase: I read you an exhortation so that you may pay attention to what is written
  simplified_phrase: I am reading this appeal to you. Pay attention to what is written
  preserved_meaning: The speaker reads a written appeal and urges the hearers to heed it.
  reasoning_layer_used: POB text and English witness
  rationale: Two direct sentences replace a dense purpose clause without changing its force.
- pob_phrase: labor in the study of godliness and of the goodness of God
  simplified_phrase: work at studying godliness and the goodness of God
  preserved_meaning: The younger people are encouraged to make a sustained effort to study both godliness and God's goodness.
  reasoning_layer_used: POB text and grounding review
  rationale: Plain wording preserves study as the activity without adding growth or knowledge as specified outcomes.
- pob_phrase: they will gather the immortal fruit of the resurrection
  simplified_phrase: they will gather the undying fruit of the resurrection
  preserved_meaning: Resurrection is pictured as producing a lasting reward that the faithful harvest.
  reasoning_layer_used: POB text and source image
  rationale: The harvest image remains while “undying” replaces the less common “immortal.”
