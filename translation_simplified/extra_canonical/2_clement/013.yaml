  english_witness: 'Therefore, brethren, let us repent forthwith. Let us be sober unto that which is good: for we are full of much folly and wickedness. Let us wipe away from us our former sins, and let us not be found to be men pleasers. Neither let us desire to please one another only, but also those men that are without, by our righteousness, that the Name be not blasphemed by reason of us.


    For the Lord saith, Every way My Name is blasphemed among all the Gentiles; and again, Woe unto him by reason of whom My Name is blasphemed. Wherein is it blasphemed? In that ye do not the things which I desire.


    For the Gentiles, when they hear from our mouths the oracles of God, marvel at them for their beauty and greatness; then, when they discover that our works are not worthy of the words which we speak, forthwith they betake themselves to blasphemy, saying that it is an idle story and a delusion.


    For when they here from us that God saith, It is no thank unto you, if ye love them that love you, but this is thank unto you, if ye love your enemies and them that hate you; when they hear these things, I say, they marvel at their exceeding goodness; but when they see that we not only do not love us, they laugh us to scorn, and the Name is blasphemed.'
base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/2_clement/013.yaml
  text: 'Therefore, brothers and sisters, let us repent at once. Let us be sober-minded about what is good, for we are full of much foolishness and wickedness. Let us wipe away our former sins, and let us not be found to be people-pleasers. Let us not desire to please only one another, but also those who are outside, through our righteousness, so that the Name may not be blasphemed because of us.


    For the Lord says, “In every way my Name is blasphemed among all the Gentiles”; and again, “Woe to the one because of whom my Name is blasphemed.” How is it blasphemed? Because you do not do the things I desire.


    For when the Gentiles hear the oracles of God from our mouths, they marvel at their beauty and greatness. Then, when they discover that our works are not worthy of the words we speak, they immediately turn to blasphemy, saying that it is an empty story and a delusion.


    For when they hear from us that God says, “It is no credit to you if you love those who love you, but this is credit to you if you love your enemies and those who hate you,” when they hear these things, I say, they marvel at their extraordinary goodness. But when they see that we not only do not love us, they ridicule us, and the Name is blasphemed.'
