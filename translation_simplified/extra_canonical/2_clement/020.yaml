translation:
  language: en
  text: 'Do not be troubled when you see unrighteous people grow rich while God’s servants suffer hardship.


    So let us trust God, brothers and sisters. This present life is training us so that, in the life to come, we may receive the victor’s crown.


    A righteous person does not harvest fruit right away but waits for it.


    If God rewarded righteous people at once, we would immediately turn godliness into a business. We would appear to be righteous, though we would be seeking profit rather than what is godly. That is why divine judgment catches up with an unjust spirit and weighs it down with chains.


    Glory forever and ever belongs to the only invisible God, the Father of truth. He sent us the Savior and Prince of immortality, and through him revealed to us the truth and the heavenly life. Amen.'
  philosophy: optimal-equivalence
