translation:
  language: en
  text: 'Therefore, let us serve God with pure hearts, and we will be righteous. But if we refuse to serve him because we do not believe his promise, we will be miserable.


    For the prophetic word also says:


    “Wretched are those whose minds are divided. They doubt in their hearts and say, ‘We heard these promises long ago, even in the days of our ancestors. Yet we have waited day after day and have seen none of them fulfilled.’”


    You fools! Think of a tree—take a grapevine. First it sheds its leaves. Then a new shoot appears, followed by an unripe grape, and finally a fully ripe grape.


    In the same way, my people suffered turmoil and affliction, but afterward they will receive good things.


    Therefore, brothers and sisters, let us not be divided by doubt. Let us endure patiently with hope so that we too may receive our reward. The one who promised is faithful and will repay each person according to what they have done.


    Therefore, if we do what is right before God, we will enter his kingdom and receive the things he promised—things no ear has heard, no eye has seen, and no human heart has imagined.'
