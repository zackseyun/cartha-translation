translation:
  language: en
  text: '“Rejoice, woman who could not have children and never gave birth! Shout for joy, you who never went through labor! For the abandoned woman has more children than the married woman.”


    The words “Rejoice, woman who could not have children and never gave birth” refer to us. Our church once had no children, but then children were given to her.


    The words “Shout for joy, you who never went through labor” mean that we must not grow weary as we pray simply to God, like women growing weary in labor.


    The words “The abandoned woman has more children than the married woman” were spoken because our people seemed deserted and abandoned by God. But now that we have believed, we have become more numerous than those who seemed to have God.


    Another Scripture says, “I did not come to call the righteous, but sinners.”


    This means that it is right to save those who are perishing. It is truly a great and wonderful work—not to support what is already standing, but to set upright what is falling.


    In the same way, Christ wanted to save those who were perishing. He came and called us when we were already perishing, and he saved many.'
