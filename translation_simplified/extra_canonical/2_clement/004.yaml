translation:
  language: en
  text: 'Therefore, simply calling him “Lord” will not save us.


    For he says, “Not everyone who says to me, ‘Lord,’ will be saved, but only the one who does what is right.”


    So then, brothers and sisters, let our actions show that we acknowledge him. Let us love one another. We must not commit adultery, speak evil about one another, or be envious. Instead, we must exercise self-control, show mercy, and be kind. We should have compassion for one another and not be greedy. This is how our actions should acknowledge him—not by doing the opposite.


    We should fear God, not people.


    For this reason, if you do these things, the Lord said: “Even if you are gathered together with me in my embrace, if you do not obey my commandments, I will cast you away. I will say to you, ‘Go away from me; I do not know you—where you come from—you who do evil.’”'
