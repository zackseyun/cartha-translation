translation:
  language: en
  text: 'Therefore, brothers and sisters, if we do the will of God our Father, we will belong to the first church. This church is spiritual and was created before the sun and moon. But if we do not do the Lord’s will, we will be among those described by the Scripture that says, “My house was made a den of robbers.” So let us choose instead to belong to the church of life, so that we may be saved.


    Surely you know that the living church is the body of Christ. Scripture says, “God made the human being male and female.” The male is Christ, and the female is the church. The Books and the Apostles clearly declare that the church did not first come into existence in our time. She has existed from the beginning. She was spiritual, just as our Jesus also was spiritual, but she was revealed in the last days so that he might save us.


    The spiritual church was revealed in Christ’s flesh. This shows that anyone who protects her in the flesh and does not defile her will receive her again in the Holy Spirit. This flesh is a copy corresponding to the spirit. Therefore, anyone who defiles the copy will not receive the original as their inheritance. This is what he means, brothers and sisters: “Guard the flesh, so that you may share in the spirit.”


    If the flesh is the church and the spirit is Christ, then whoever treats the flesh shamefully treats the church shamefully. Such a person will not share in the spirit, who is Christ.


    How wonderful are the life and immortality that this flesh can inherit when the Holy Spirit is joined to it! No one can express or describe what the Lord has prepared for those he has chosen.'
