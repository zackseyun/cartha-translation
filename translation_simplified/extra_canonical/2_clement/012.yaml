translation:
  language: en
  text: 'Therefore, let us promptly await God’s kingdom in love and righteousness, because we do not know the day when God will appear.


    Someone asked the Lord when his kingdom would come. The Lord answered, “When the two become one, when the outside is like the inside, and when the male is together with the female, yet there is neither male nor female.”


    The two become one when we speak truth to one another. In two bodies there will be one soul, with no pretense between them.


    “The outside is like the inside” means this: the inside is the soul, and the outside is the body. Just as the body can be seen, let your good works also show what is in your soul.


    “When the male is together with the female, yet there is neither male nor female” means this: when a brother sees a sister, he should not think of her in terms of being female; and when a sister sees a brother, she should not think of him in terms of being male.


    The Lord says, “If you do these things, the kingdom of my Father will come.”'
