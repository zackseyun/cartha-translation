translation:
  language: en
  text: 'His disciples spoke again: “Tell us clearly how they came down from the invisible realms—from what cannot die into this mortal world.”


    The perfect Savior answered: “The Son of Man joined with his companion Sophia and brought forth a mighty light that was both male and female. Its male name is ‘Savior, All-Begetter.’ Its female name is ‘All-Begetter Sophia,’ though some call her ‘Pistis.’


    “Like [text missing][a] a drop from the light, everyone who enters the world is sent by him into the world of the Almighty, so that they may be watched over by him. At Sophia’s will, the chain of his forgetfulness bound the light. Through this, the matter could be revealed to the whole impoverished world: the Almighty’s pride and blindness, and the ignorance that named him.


    “But by the will of the great Light, I came from the realms above, bringing release from that chain[b] and stopping the work of the thieves. I awakened the drop sent from Sophia, so that through me it could bear abundant fruit, become complete, and never again be flawed. Through me, the Great Savior, it could be joined, so that his glory would be revealed. Sophia could also be restored from that flaw, so that her [text missing] children would never again become flawed. Instead, they could receive honor and glory, ascend to their Father, and understand the speech of the masculine Light.


    “You were sent by the Son, who was himself sent, so that you could receive light and separate yourselves from the oblivion connected with the authorities. Then it would never again appear because of you—that impure rubbing that comes from the terrifying fire that issued from their phallus. Trample their evil purpose underfoot.”'
  philosophy: optimal-equivalence
