translation:
  language: en
  text: 'After he rose from the dead, his twelve disciples and seven women remained his followers. They traveled to Galilee, to the mountain called “Harvesting Place and Joy.”[a] When they gathered there, they were trying to understand the fundamental nature and order of the world, divine providence, the power of the ruling authorities, and how the Savior deals with them within the mystery of the divine plan.


    The Savior appeared to them, not in the visible form he had before, but as the invisible spirit. Yet his likeness was like that of a tall, radiant angel. I must not describe exactly what he looked like, because no mortal could bear it. His flesh was entirely pure and perfect, like the flesh he had taught us about on the mountain called “Of Olives” in Galilee.


    He said, “Peace be with you! I give you my peace!”


    They were filled with awe and fear.


    The Savior laughed and asked them, “What are you thinking about? Why are you puzzled? What are you looking for?”


    Philip answered, “We want to understand the fundamental nature of the world and how it is ordered.”


    The Savior said to them, “I want you to understand this: From the foundation of the world until now, all who have been born on earth are dust. Though they have searched for God and tried to understand his being and likeness, they have not found him. Even the greatest sages have only guessed from the way the world is ordered and moves, and their guesses have not reached the truth.


    “Philosophers say that the universe is governed in three possible ways, but they disagree. Some say the world governs itself. Others say providence governs it, and still others say fate does. But none of these is true.


    “I repeat: none of these three human ideas comes close to the truth. But I came from the Infinite Light. I know him, and I am here to tell you exactly what the truth is. Whatever originates itself has an impure life because it made itself. The theory of providence has no wisdom, and the theory of fate has no insight.


    “But you have been given knowledge. Anyone else who deserves this knowledge will also receive it—anyone who was not begotten by the sowing of impure rubbing, but by the one who was sent first, for he is an immortal among mortals.”'
