translation:
  language: en
  text: 'Mary asked him, “Then, Lord, how can we know this?”


    The perfect Savior answered, “Begin with what is hidden and continue to the end of what is visible. As Thought flows out, it will itself show you how faith in invisible things can be found in visible things—things that belong to the unbegotten Father. Whoever has ears to hear, let that person hear!


    “The Lord of the World is not called ‘Father,’ but ‘Forefather.’ For the Father is the source of those who will become visible; yet he is the Forefather without beginning.[a] He sees himself within himself, as in a mirror. He appeared in his own likeness as the divine Self-Father, the one who reflects above all who reflect, the first to exist, the unbegotten Father. He is as old as the light before him, but he is not equal to that light in power.


    “Afterward, he revealed countless beings who reflect and bring themselves forth. They are equal in age and power, and they exist in glory. Their race is called ‘The Generation Above Which There Is No Kingdom.’ You yourselves became visible within this generation among these kingdoms. This whole multitude, above which there is no kingdom, is called ‘the Children of the Unbegotten Father,’ ‘God,’ ‘Savior,’[b] and ‘Son of God,’ whose likeness lives with you.


    “He is the Unknowable One, full of glory that can never be destroyed and joy that cannot be expressed. They all rest in him and continually rejoice in his unchanging glory with immeasurable, inexpressible joy. Until now, no one among all the aeons and their worlds had ever heard or known this.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The surviving wording in this statement is incomplete, and some words have been editorially supplied.
    reason: source_note
  - marker: b
    text: “Savior” is editorially supplied in the surviving text.
    reason: source_note
  - marker: c
    text: “Aeons” is a traditional term in this work for orders or realms within the heavenly world.
    reason: cultural_note
