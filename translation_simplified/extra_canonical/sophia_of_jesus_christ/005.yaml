translation:
  language: en
  text: 'Matthew asked him, “Lord and Savior, how was the Human revealed?”


    The perfect Savior answered, “I want you to know about the one who appeared before the world existed.


    “In the beginning was the infinite Father, who came into being by himself and made himself. [Some text is missing.] He was filled with radiant light beyond words. When he chose to make his likeness into a great power, the source of that light suddenly appeared as the deathless Human, both male and female. Through this immortal Human, they could receive salvation and awaken from forgetfulness. This would happen through the one sent as an interpreter, who lives with you until the impoverished thieves come to their end.


    “His companion is the Great Sophia. From the beginning, the self-begotten Father ordained her in him for union, in relation to the Immortal Human who first appeared as divinity and kingdom. The exact connection is unclear. The Father revealed this. [Some text is missing.] He is called ‘the Human’ and ‘the Self-Father.’ To display his own majesty, he created a mighty aeon named Ogdoad and gave Ogdoad great authority, including rule over the impoverished creation.


    “From that light and from the threefold male Spirit belonging to his companion Sophia, he created gods, angels, and archangels—countless multitudes to serve. Because this God created divinity and kingdom, he was called ‘God of gods’ and ‘King of kings.’ Within him, the Primal Human has his own unique mind and thought: thought itself, reflection, contemplation, reason, [some text is missing] and power. Every quality that exists there is perfect and deathless.


    “They are equal in being indestructible, but they differ in power. The difference is like that between father and son, between son and thought, and between thought and what comes after it. As I said before, among created beings the Monad—the one—comes first. After everything else, whatever appeared was revealed from his power. From created beings came everything that was fashioned; from what was fashioned came what was formed; and from what was formed came what was named. This is how differences arose among the unbegotten ones, from beginning to end.”'
