translation:
  language: en
  text: 'Bartholomew then asked him, “How is he called ‘the Human’ and ‘the Son of Man’ in the Gospel? Which of these names belongs to the Son?”


    The Holy One answered, “I want you to understand that the Primal Human is called ‘the Begetter’ and ‘the Self-Completed Mind.’ Together with his companion, Great Sophia, he contemplated and brought forth his firstborn son, who is both male and female. His male name is ‘First-Begotten Son of God.’ His female name is ‘First-Begotten Sophia, Mother of the Universe,’ whom some call ‘Love.’ This firstborn, who is called ‘Christ,’ has authority from his Father. From the Spirit and the Light, he created countless angels to serve.”


    His disciples said to him, “Lord, tell us about the one called ‘the Human,’ so that we may clearly understand his glory.”


    The perfect Savior said, “Let anyone who has ears listen! Because the first-begetting Father came from radiant light, he is named ‘Adam, the Eye of Light.’ His holy angels, who are beyond description and have no shadow, continually rejoice over the reflections they received from their Father. The whole kingdom of the Son of Man, who is called ‘the Son of God,’ is filled with joy beyond description—a shadowless joy that never changes—and with rejoicing over his glory, which cannot be destroyed. Until now, this glory has never been heard of or revealed in the aeons and the worlds that came afterward.[a] I came from the self-begotten, primal Infinite Light so that I could reveal everything to you.”'
