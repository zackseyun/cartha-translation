translation:
  language: en
  text: 'Philip asked, “Lord, then how did he appear to the perfect ones?”


    The perfect Savior answered him, “Before anything visible appeared, majesty and authority already existed in him. He contains everything that exists, but nothing contains him. He is entirely mind: thought, reflection, consideration, reason, and power. All these are equal powers and are the sources of everything that exists. Their entire race, from first to last, is in the foreknowledge of the infinite Father, who was never begotten.”


    Thomas asked him, “Lord and Savior, why did these things come into being, and why were they revealed?”


    The perfect Savior said, “I came from the Infinite to tell you everything. The Spirit Who Is was the one who begot. He had the power to beget and the nature to give form, so that the great wealth hidden within him could be revealed. Because of his mercy and love, he desired to bear fruit from himself. He did not want to enjoy his goodness alone. Instead, he wanted other spirits of the unmoving generation to produce bodies and spirits, glory and honor in indestructibility, and his infinite gift. In this way, his treasure could be revealed through the self-begotten God—the Father of everything indestructible and of those who would later come into being but had not yet appeared. There is a great difference among the indestructible ones.”


    He cried out, “Whoever has ears to hear about the infinite ones, let that person hear! I have spoken to those who are awake!”


    Then he continued, “Everything that comes from what can perish will perish, because it came from what can perish. But whatever comes from what cannot perish will not perish; it too cannot perish.


    “Many people went astray because they did not recognize this difference, and they died.”'
