translation:
  language: en
  text: 'Then Thomas asked [him], “Lord and Savior, how many aeons[a] are above the heavens?”


    The perfect Savior answered, “I praise you for asking about the great aeons, because your roots dwell in the infinities. When those I spoke about earlier were revealed, he [supplied . . .]


    (Coptic pages 109 and 110 are missing.)


    “[Text missing] and come together as one, we call them the ‘Assembly of the Eight.’[b] It appeared as both male and female. Its male part is called ‘Assembly,’ and its female part is called ‘Life.’ This showed that the life of all the aeons came from a female.


    “All names came from the originating principle. Because he was in harmony with his thought, powers quickly appeared and were called ‘gods.’ Through their wisdom, the gods of the gods revealed gods, and the gods revealed lords. Through their acts of thought, the lords of the lords revealed lords. Through their power, the lords revealed archangels. Through their words, the archangels revealed angels. [Text missing] Likenesses came from them, having the structure, form, and names of all the aeons and their worlds.


    “All the immortals I have just described receive their authority from the Immortal Human, who is called ‘Silence.’ When they contemplated in silence, without speaking aloud, her majesty was brought to completion. Since the indestructible ones had authority, each created a great kingdom within the Assembly of the Eight. They also created thrones, temples, and heavenly realms for their respective majesty. All of them came into being by the will of the Mother of the World.”


    Then the holy apostles said to him, “Lord and Savior, tell us about those who live in the aeons. We need to learn about them.”


    The perfect [text missing] Savior replied, “You may ask me anything, and I will answer you.


    “They created armies of angels—countless thousands upon thousands—for service and for their glory. They created virgin spirits, lights beyond description that never waver. These spirits suffer no frailty or weakness but instead act with determination.


    “In this way the aeons, the heavens, and the heavenly realms were quickly brought to completion in the glory of the Immortal Human and his partner Sophia. From there, all the aeons and worlds—including those that came later—received the pattern for making their own likenesses, both in the heavens of chaos and in their worlds.


    “Every nature, beginning with the revelation of chaos, lives in light without shadow, indescribable joy, and rejoicing beyond words. They continually enjoy glory that never fades [text missing] and endless rest that cannot be described among all the aeons and all the powers that came into being later. I have told you all this so that you may shine in the light even more than these.”'
