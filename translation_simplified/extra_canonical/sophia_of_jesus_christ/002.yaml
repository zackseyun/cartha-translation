  simplified_phrase: He Who Is cannot be put into words.
  preserved_meaning: His nature cannot be adequately expressed in language.
  reasoning_layer_used: POB translation and English witness
  rationale: The common idiom states the same limitation more clearly.
- pob_phrase: He is unbegotten, without beginning
  simplified_phrase: He was never brought into being and has no beginning
  preserved_meaning: He did not originate through generation and has no starting point.
  reasoning_layer_used: POB translation and immediate parallelism
  rationale: The rewrite explains “unbegotten” while keeping both ideas distinct.
- pob_phrase: He is beyond measure; he cannot be traced out.
  simplified_phrase: He is beyond all measure; no one can fully search him out.
  preserved_meaning: He cannot be measured or exhaustively investigated.
  reasoning_layer_used: POB translation and English witness
  rationale: The wording avoids a misleading physical sense of tracing.
