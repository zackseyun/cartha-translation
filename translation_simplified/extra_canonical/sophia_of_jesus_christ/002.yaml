translation:
  language: en
  text: 'Matthew said to him,[a] “Lord, no one can discover the truth except through you. So teach us the truth.”


    The Savior said, “He Who Is cannot be put into words. No power or authority knew him. Neither did anything contingent, nor anything created from the foundation of the world until now. Only he knew himself, along with anyone to whom he chooses to reveal himself through the one who originated from the First Light. From now on, I am the Great Savior, because he cannot die and lives forever.


    “He lives forever and was never born, because everyone who is born will perish in death. He was never brought into being and has no beginning, because everyone who has a beginning will also have an end. No one rules over him. Therefore, he has no name, because anyone who has a name was created by someone else. He Who Is has an appearance that belongs to him alone.[b] It is unlike anything you have ever seen or understood. His appearance is mysterious: it rises above everything and surpasses the world. It looks in every direction at once and sees itself by means of itself.


    “Because he is infinite, no one can ever fully understand him.


    He can never be destroyed, and nothing is like him.


    He is the good one who never changes.


    He has no defect.


    He lives forever.


    He is blessed.


    He cannot be known, but he knows himself.


    He is beyond all measure; no one can fully search him out.


    He is perfect, with no imperfection.


    His blessedness can never be destroyed.


    He is called ‘Father of the World.’”'
