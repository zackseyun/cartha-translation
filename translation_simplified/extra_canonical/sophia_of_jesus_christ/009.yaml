translation:
  language: en
  text: 'Mary asked him, “Holy Lord, where did your disciples come from? Where are they going, and how should they live while they are here?”


    The perfect Savior said to them, “I want you to understand this: Sophia, the Mother of the World and the partner, wanted to bring these into existence by herself, without her male counterpart. But the Father of the World willed to reveal his goodness, which no one can fully comprehend. So he created a curtain between the immortals and those who came afterward, so that what resulted could follow that [. . .]


    (Coptic pages 115–116 are missing.)


    [] “[. . .] and breath, so that two could become one, just as it was from the beginning, so that you could bear much fruit and rise to He Who Is from the beginning, with joy and glory beyond words, and with [honor and] the gift of [the Father of the World].


    “[Therefore], whoever knows [the Father fully] will go to the Father and [rest in] the Father who was never begotten. But [whoever knows him only partly] will go [to the deficiency] and find rest [in the Ogdoad].[a]


    “[Now], whoever comes to know the immortal [Spirit] of light in silence, by reflection and agreement with the truth, and gives me signs of the Invisible One, will become a light in the silent Spirit. Whoever knows the Son of Man through knowledge and love, and gives me a sign of [] the Son of Man, can go to the dwelling places of those in the Ogdoad.”'
