translation:
  language: en
  text: 'Then Mary stood up and greeted everyone. She said, “My brothers and sisters, do not weep or grieve. Do not let your hearts be divided, because his grace will be with all of you and will protect you. Instead, let us praise his greatness, because he has prepared us and made us human.”


    When Mary said these things, she turned their hearts toward the Good. Then they began to debate the Savior’s words.


    Peter said to Mary, “Sister, we know that the Savior loved you more than all other women. Tell us the words of the Savior that you remember—things you know but we do not and that we have not heard.”


    Mary answered, “I will tell you what has been hidden from you.” Then she began:


    “I saw the Lord in a vision, and I said to him, ‘Lord, I saw you in a vision today.’


    “He answered me, ‘You are blessed because you did not waver when you saw me. For where the mind is, there is the treasure.’


    “I asked him, ‘Lord, when someone sees a vision, do they see it through the soul or through the spirit?’


    “The Savior answered, ‘They see it neither through the soul nor through the spirit. Rather, the mind between the two is what sees the vision, and it …’”


    [Pages 11–14 of the manuscript are missing.]'
