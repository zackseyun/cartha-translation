translation:
  language: en
  text: 'Andrew answered the brothers and sisters, “You may say what you want about her words, but I do not believe the Savior said these things. These teachings seem foreign to his message.”


    Peter raised the same objections. He asked them, “Did the Savior really speak privately with a woman and keep it from us, instead of speaking openly to us? Are we now supposed to turn around and listen to her? Did he favor her over us?”


    Mary began to weep. She said to Peter, “My brother Peter, what are you thinking? Do you really believe I invented this in my own heart or am lying about the Savior?”


    Levi answered Peter, “Peter, you have always been angry. Now I see you arguing against this woman as the adversaries do. But if the Savior made her worthy, who are you to reject her? Surely the Savior knows her very well. That is why he loved her more than he loved us.


    “Instead, we should be ashamed of ourselves. We should clothe ourselves with perfect Humanity and make it our own, as he instructed us. We should preach the gospel without adding any rule or law beyond what the Savior said.”


    After [Levi said these things], they went out and began to teach and preach.


    The Gospel According to Mary'
