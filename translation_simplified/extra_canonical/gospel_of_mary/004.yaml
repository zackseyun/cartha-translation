translation:
  language: en
  text: 'Desire said, “I did not see you when you went down, but now I see you going up. Why are you lying, since you belong to me?”


    The soul answered, “I saw you, but you neither saw nor knew me. To you, I was only a garment, and you did not recognize me.” After saying this, the soul left with great joy.


    Then the soul came to the third power, called “Ignorance.” It questioned the soul: “Where are you going? Wickedness has you bound. Since you are bound, do not judge!”


    The soul replied, “Why do you judge me when I have not judged? I was bound, though I did not bind. They did not recognize me, but I have come to know that everything will dissolve—both what is on [earth] and what is in [heaven].”


    After overcoming the third power, the soul went up and saw the fourth power. This power had seven forms:


    The first is Darkness;


    The second, Desire;


    The third, Ignorance;


    The fourth, Zeal for Death;


    The fifth, the Kingdom of the Flesh;


    The sixth, the Foolish “Wisdom” of the Flesh;


    The seventh, the “Wisdom” of Anger.


    These are the seven powers of Wrath.


    They asked the soul, “Where have you come from, murderer? And where are you going, conqueror of space?”


    The soul answered, “What binds me has been killed. What surrounds me has been overcome. My desire is gone, and ignorance has died. In a [world], I was released from a world; in a type, from a type above;[a] and from the chain of forgetfulness, which exists only for a time. From now on, I will receive rest during the remaining time of the age, in silence.”


    When Mary had said this, she became silent, because this was as far as the Savior had spoken with her.'
