translation:
  language: en
  text: 'After the Blessed One finished speaking, he greeted them all and said, “Peace be with you! Make my peace your own. Be careful that no one leads you astray by saying, ‘Look here!’ or ‘Look there!’ The Son of Humanity is within you. Follow him! Those who seek him will find him.


    “Now go and proclaim the good news about the kingdom. Do not add any rules beyond those I gave you. Do not make a law as a lawgiver does, or that law may bind you.” After saying this, he left.


    But they were deeply grieved and wept bitterly. They said, “How can we go to the Gentiles—the non-Jewish peoples—and proclaim the good news about the kingdom of the Son of Humanity? If they did not spare him, why would they spare us?”'
