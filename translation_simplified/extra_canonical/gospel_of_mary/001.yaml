translation:
  language: en
  text: '“Then will [matter] be [destroyed], or not?”[a]


    The Savior said, “Every nature, every form, and every creature exists in and with the others. But they will dissolve back into their own roots, because the nature of matter dissolves into its own nature alone. Let anyone with ears listen!”


    Peter said to him, “You have explained everything to us. Now tell us one more thing: What is the sin of the world?”


    The Savior said, “Sin does not exist. But you bring sin into being when you act according to the nature of adultery, which is called ‘sin.’ That is why the Good came among you, up to the things of every nature, in order to restore it within its root.”


    Then he continued, “That is why you become sick and die: because [you love what deceives you. Let anyone who] can understand, understand!


    “Matter [gave birth to] a passion that has no image, because it comes from what is contrary to nature. This brings confusion throughout the body. That is why I told you to be content in your heart. If you are not content, seek contentment in the presence of nature’s many images. Let anyone with ears listen!”'
