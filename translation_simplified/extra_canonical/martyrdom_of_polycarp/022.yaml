translation:
  language: en
  text: The blessed Polycarp was put to death as a martyr on the second day of the first part of the month Xanthicus, on the seventh day before the Kalends—the first day—of March. It was a great Sabbath, at the eighth hour. Herodes arrested him. At that time, Philip of Tralles was high priest, and Statius Quadratus was proconsul. But this was during the reign of the eternal King, Jesus Christ. To him be glory, honor, greatness, and an eternal throne through every generation. Amen.
  philosophy: optimal-equivalence
