translation:
  language: en
  text: 'Brothers and sisters, we wish you God’s blessing as you live by the teaching of Jesus Christ, which agrees with the gospel. With Jesus Christ, may God be glorified for saving his holy chosen people. The blessed Polycarp suffered martyrdom; may we follow in his footsteps and be found in the kingdom of Jesus Christ.


    Gaius copied this account from the papers of Irenaeus, a disciple of Polycarp. Gaius had also lived with Irenaeus.


    I, Socrates, copied it in Corinth from Gaius’s copy. May grace be with everyone.


    I, Pionius, later copied it again from the copy mentioned above after searching for it. The blessed Polycarp appeared to me in a revelation, as I will explain later. I gathered the account together when age had nearly destroyed the copy. May the Lord Jesus Christ also gather me with his chosen people into his heavenly kingdom. Glory belongs to him, with the Father and the Holy Spirit, forever and ever. Amen.


    In the Moscow manuscript, the three preceding paragraphs read as follows:


    Gaius copied this account from the papers of Irenaeus. Gaius lived with Irenaeus, who had been a disciple of the holy Polycarp. Irenaeus was in Rome when Bishop Polycarp was martyred. He taught many people, and many excellent writings by him, faithful to accepted Christian teaching, are in circulation. In these writings he mentions Polycarp and says that Polycarp taught him. Irenaeus skillfully refuted every false teaching and passed on the universal rule of the Church just as he had received it from the saint.


    Irenaeus also reports that Marcion, from whom the Marcionites received their name, once met the holy Polycarp and said, “Recognize us, Polycarp.” Polycarp answered Marcion, “Yes, I recognize the firstborn of Satan.”


    The writings of Irenaeus also state that on the very day and hour when Polycarp was martyred in Smyrna, Irenaeus was in Rome and heard a voice like a trumpet saying, “Polycarp has been martyred.”


    As already stated, Gaius copied the papers of Irenaeus. Isocrates then made another copy from Gaius’s copy in Corinth.


    I, Pionius, later copied it again from the copy of Isocrates. I had searched for it in obedience to a revelation from the holy Polycarp, and I gathered the account together when age had nearly destroyed the copy. May the Lord Jesus Christ also gather me with his chosen people into his heavenly kingdom. Glory belongs to him, with the Father, the Son, and the Holy Spirit, forever and ever. Amen.'
