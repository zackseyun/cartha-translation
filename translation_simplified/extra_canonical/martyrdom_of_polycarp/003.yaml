translation:
  language: en
  text: 'Therefore, all martyrdoms that take place according to God’s will are blessed and noble. We must be very careful to recognize that God has power over all things.


    Who could fail to admire the martyrs’ nobility, patient endurance, and faithfulness to the Master? They were torn so severely by whips that the inner parts of their flesh could be seen, even their veins and arteries. Yet they endured so patiently that the people watching pitied them and wept. The martyrs themselves were so courageous that not one of them cried out or groaned. In this way they showed us all that, while Christ’s martyrs were being tortured, they were as though absent from their bodies—or rather, that the Lord was standing beside them and speaking with them.


    They focused on the grace of Christ and regarded the tortures of this world as nothing. At the cost of one hour of suffering, they gained freedom from eternal punishment. The fire of their cruel torturers felt cold to them because they kept before them their escape from the eternal fire that is never put out. With the eyes of their hearts, they looked toward the good things stored up for those who endure patiently—things no ear has heard and no eye has seen, and which have never entered the human heart. But the Lord showed these things to them, for they were no longer men but were already angels.[a]


    In the same way, those condemned to face wild animals endured terrible punishments. They were forced to lie on sharp shells and were subjected to many other kinds of torture. The devil hoped that the unrelenting pain might make them deny Christ, if that were possible, so he used many schemes against them.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This is exalted martyrdom language portraying them as already sharing the life of angels, not necessarily saying that humans literally become angels.
    reason: source_note
