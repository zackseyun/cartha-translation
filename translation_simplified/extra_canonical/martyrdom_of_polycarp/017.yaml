translation:
  language: en
  text: 'At last, the lawless men saw that the fire could not consume Polycarp’s body. So they ordered an executioner to approach him and stab him with a dagger. When the executioner did so, [a dove and] a great flow of blood came out and put out the fire. The whole crowd was amazed at the great difference between unbelievers and God’s chosen people.


    Among God’s chosen people was this man, Polycarp, the glorious martyr. In our own time he proved to be a teacher who faithfully passed on the apostles’ message and spoke prophetically. He was also bishop of the holy church in Smyrna. For every word he spoke came true, and every word will come true.'
