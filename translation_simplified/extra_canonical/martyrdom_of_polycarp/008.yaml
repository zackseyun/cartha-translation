translation:
  language: en
  text: 'So they took the boy with them. On Friday, around suppertime, the armed officers and horsemen set out as if they were going after a robber. They arrived together late that evening and found Polycarp in bed in an upstairs room of a cottage. He could have gone somewhere else, but he would not, saying, “May God’s will be done.”


    When Polycarp heard that they had arrived, he went downstairs and spoke with them. Those watching were amazed by his advanced age and steadfastness. They wondered why the authorities were so determined to arrest an old man like him. Polycarp immediately ordered that the men be served as much food and drink as they wanted. Then he persuaded them to give him one undisturbed hour to pray.


    They agreed, and he stood and prayed. He was so full of God’s grace that he prayed without stopping for two hours. Those listening were amazed, and many felt remorse for coming to arrest such a venerable old man.'
