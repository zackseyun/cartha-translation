translation:
  language: en
  text: 'But thanks be to God, for He truly prevailed over them all. By his own steadfastness, the noble Germanicus gave courage to the others who were afraid. He fought the wild beasts with extraordinary bravery. The proconsul tried to persuade him to take pity on himself because he was young. Instead, Germanicus forcefully drew the wild beast toward himself, wanting a quicker release from their unrighteous and lawless life.


    When the crowd saw this, they were amazed at the courage of the Christians, a people who loved and feared God. They shouted, “Away with the atheists![a] Find Polycarp!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The crowd called Christians “atheists” because Christians rejected the gods worshiped by their pagan neighbors.
    reason: cultural_note
