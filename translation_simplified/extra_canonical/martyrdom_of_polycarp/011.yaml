translation:
  language: en
  text: 'But the proconsul kept pressing him. Again he said, “Swear by Caesar’s guardian spirit.”[a]


    Polycarp answered, “If you think I will swear by it, you are mistaken. You pretend not to know who I am, so hear me clearly: I am a Christian. If you want to learn what Christians teach, set a day and let me speak.”


    The proconsul said, “Persuade the crowd.”


    Polycarp replied, “I would consider you worthy of a discussion. We have been taught to give rulers and authorities appointed by God the proper honor, as long as doing so does us no harm. But I do not consider this crowd worthy to hear me defend myself.”'
