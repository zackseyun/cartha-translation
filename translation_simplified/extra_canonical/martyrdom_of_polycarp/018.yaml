translation:
  language: en
  text: 'But the jealous and envious Evil One, the enemy of the community of righteous people, had seen the greatness of Polycarp’s martyrdom. He had seen Polycarp’s blameless life from the beginning, how he had been crowned with the crown of immortality, and how he had received a reward no one could deny. So the Evil One arranged matters so that we could not even take away Polycarp’s body, though many of us wanted to do so and to touch his holy flesh.


    He put forward Nicetes, the father of Herod and brother of Alce, to plead with the magistrate not to release Polycarp’s body. The reason given was, “Otherwise, they may abandon the crucified one and begin to worship this man.” This was done at the urgent request of the Jews, who also kept watch when we were about to take the body from the fire. They did not understand that we could never abandon Christ, who suffered for the salvation of all throughout the world who are saved. Though he was without fault, he suffered for sinners. Nor could we ever worship anyone else.


    We worship Christ because he is the Son of God. We cherish the martyrs as disciples and imitators of the Lord, as they deserve, because of their unequaled love for their own King and Teacher. May we too share with them as fellow disciples.'
