translation:
  language: en
  text: 'As Polycarp entered the stadium, a voice from heaven said to him, “Be strong, Polycarp. Be courageous.” No one saw who spoke, but the believers who were there heard the voice. When Polycarp was finally led in, the crowd erupted in a great uproar because they had heard that he had been arrested.


    The proconsul had Polycarp brought before him and asked if he was indeed Polycarp. When Polycarp said that he was, the proconsul tried to persuade him to deny Christ. “Think of your age,” he said, along with the other things officials usually say: “Swear by Caesar’s guardian spirit,[a] change your mind, and say, ‘Away with the atheists!’”


    Polycarp looked solemnly at the whole crowd of lawless pagans in the stadium and waved his hand toward them. Then he groaned, looked up to heaven, and said, “Away with the atheists!”


    The proconsul kept pressing him: “Take the oath, and I will release you. Insult Christ.”


    Polycarp answered, “I have served him for eighty-six years, and he has never wronged me. How could I now insult my King, who saved me?”'
