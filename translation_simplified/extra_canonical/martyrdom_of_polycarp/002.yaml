translation:
  language: en
  text: 'Brothers and sisters, we are writing to tell you what happened to those who suffered martyrdom, especially the blessed Polycarp. His martyrdom brought the persecution to an end, as though he had placed his seal on it. Nearly everything described above happened so that the Lord might once again show us what martyrdom faithful to the gospel looks like.


    Polycarp waited until he was handed over, just as the Lord did, so that we too might follow his example. We should care not only about what concerns us, but also about what concerns our neighbors. True and steadfast love seeks not only one’s own salvation, but the salvation of all fellow believers.'
