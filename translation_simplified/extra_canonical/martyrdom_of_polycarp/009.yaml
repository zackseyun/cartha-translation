translation:
  language: en
  text: 'At last Polycarp finished praying. He had remembered everyone he had ever met—whether unimportant or important, of low or high position—and the whole Church throughout the world. Then the time came for him to leave. They put him on a donkey and took him into the city, because it was a special Sabbath.


    Herod, the police captain, and Herod’s father, Nicetes, met him. They took him into their carriage and sat beside him. They tried to persuade him: “What harm is there in saying, ‘Caesar is Lord,’ offering incense, and saving yourself?” They added other arguments like these. At first Polycarp did not answer. But when they kept pressing him, he said, “I will not do what you advise.”


    When they could not persuade him, they threatened him and forced him to get out quickly. As he stepped down from the carriage, he bruised his shin. But he did not even turn around. He went on quickly, as though nothing had happened, while they took him to the stadium. The uproar there was so loud that no one could make out a single voice.'
