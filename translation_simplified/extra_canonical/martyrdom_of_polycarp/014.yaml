translation:
  language: en
  text: 'Everything happened with incredible speed—faster than anyone could describe. The crowds immediately gathered wood and bundles of sticks from the workshops and public baths. The Jews were especially eager to help, as was their custom.


    When the pile of wood was ready, Polycarp removed his outer clothes and loosened his belt. He also tried to take off his shoes, though he was not used to doing this himself. The believers had always eagerly competed to be the first to touch him. Even before his hair turned gray, they had honored him because of his holy life.


    They placed the implements prepared for the fire around him. When they were about to nail him to the stake, he said, “Leave me as I am. The One who gives me strength to endure the fire will also enable me to remain still on the pile, without the security you seek from the nails.”'
