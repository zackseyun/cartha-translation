translation:
  language: en
  text: 'Then the proconsul said, “I have wild animals here. I will throw you to them unless you change your mind.”


    Polycarp answered, “Call them in. We are not permitted to change from what is better to what is worse. But it is noble to turn from wrongdoing to righteousness.”


    The proconsul said again, “If you scorn the wild animals, I will have you burned to death unless you change your mind.”


    Polycarp replied, “You threaten me with a fire that burns for a time and soon goes out. You know nothing of the fire of the coming judgment and the eternal punishment reserved for the ungodly. Why do you wait? Come, do what you intend to do.”'
