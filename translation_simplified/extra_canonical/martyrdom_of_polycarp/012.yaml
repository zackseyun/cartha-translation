simplification_decisions:
- pob_phrase: unless you repent
  simplified_phrase: unless you change your mind
  preserved_meaning: The proconsul demands that Polycarp reverse his refusal rather than repent morally before God.
  reasoning_layer_used: Immediate dialogue and English witness
  rationale: This prevents a misleading spiritual sense while preserving the demand to reverse course.
- pob_phrase: if you despise the wild beasts
  simplified_phrase: if you scorn the wild animals
  preserved_meaning: The proconsul characterizes Polycarp as dismissing the threat of the beasts.
  reasoning_layer_used: POB wording and grounding review
  rationale: “Scorn” keeps the expressed attitude without reducing it to an inward lack of fear.
- pob_phrase: I will have you consumed by fire
  simplified_phrase: I will have you burned to death
  preserved_meaning: The proconsul threatens execution by fire.
  reasoning_layer_used: POB text and English witness
  rationale: The direct wording clearly states the threatened outcome.
