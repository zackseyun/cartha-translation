translation:
  language: en
  text: 'From the church of God in Smyrna, whose members live there as foreigners,


    to the church of God in Philomelium, whose members also live there as foreigners, and to every community of brothers and sisters in the holy and universal church, whose members live as foreigners wherever they are:


    May God the Father and our Lord Jesus Christ give you more and more mercy, peace, and love.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: The church of God living as foreigners in Smyrna, to the church of God living as foreigners in Philomelium
  simplified_phrase: From the church of God in Smyrna, whose members live there as foreigners, to the church of God in Philomelium, whose members also live there as foreigners
  preserved_meaning: Both named churches are presented as communities of resident foreigners.
  reasoning_layer_used: POB controlling text and English witness
  rationale: The letter’s sender and recipient are made explicit while the parallel foreign-resident descriptions are retained.
- pob_phrase: all the communities of brothers and sisters belonging to the holy and universal church living as foreigners in every place
  simplified_phrase: every community of brothers and sisters in the holy and universal church, whose members live as foreigners wherever they are
  preserved_meaning: The greeting includes every local community of the universal church and applies the foreign-resident image to all of them.
  reasoning_layer_used: POB controlling text
  rationale: The long phrase is divided so its scope and modifiers are easier to follow.
- pob_phrase: be multiplied to you
  simplified_phrase: give you more and more
  preserved_meaning: The prayer asks God to increase mercy, peace, and love for the recipients.
  reasoning_layer_used: POB controlling text and English witness
  rationale: The blessing’s sense of increase is expressed in ordinary English.
interpretive_expansions:
