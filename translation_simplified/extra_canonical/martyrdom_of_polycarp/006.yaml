translation:
  language: en
  text: 'When the honored Polycarp first heard about this, he was not at all troubled. He wanted to stay in town, but most of the people there persuaded him to leave. So he went to a farm near the city and stayed there with a few companions. As was his constant habit, he did nothing else night and day but pray for all people and for churches throughout the world.


    Three days before he was arrested, he fell into a trance while praying and saw his pillow burning with fire. He turned to those with him and said, “I must be burned alive.”'
