translation:
  language: en
  text: 'You asked for a fuller account of what happened. For now, however, we have sent you this summary through our brother Marcianus. After you have learned what happened, send this letter on to the brothers and sisters who live farther away. Then they too may glorify the Lord, who chooses from among his own servants.


    To God, who by his grace and generosity is able to bring us all into his eternal kingdom through his only-begotten Son, Jesus Christ, be glory, honor, power, and greatness forever. Greet all the saints. Everyone here sends you greetings. Euarestus, who wrote this letter, and his whole household also greet you.'
