  simplified_phrase: a fuller account of what happened
  preserved_meaning: The readers had requested a more detailed report of the events.
  reasoning_layer_used: POB translation and English witness
  rationale: The rewrite replaces a dense passive construction with a direct request.
- pob_phrase: When you have learned these things, circulate the letter also
  simplified_phrase: After you have learned what happened, send this letter on
  preserved_meaning: The recipients are to learn about the events and then pass the letter to others.
  reasoning_layer_used: POB translation and independent grounding review
  rationale: This keeps the focus on receiving the report without narrowing it to the act of reading.
- pob_phrase: Those who are with us greet you, as do Euarestus
  simplified_phrase: Everyone here sends you greetings. Euarestus ... also greet[s] you.
  preserved_meaning: The local group, Euarestus, and his household all send greetings.
  reasoning_layer_used: POB translation
  rationale: Two sentences make the distinct senders easier to follow.
