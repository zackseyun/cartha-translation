translation:
  language: en
  text: 'When the centurion saw the opposition from the Jews, he put Polycarp in the center and burned his body, as was their custom.


    Later, we gathered his bones. To us, they are worth more than precious stones and are finer than pure gold. We placed them in a suitable place.


    There, if the Lord permits, we will gather whenever we are able, with gladness and joy, and celebrate the anniversary of his martyrdom. This celebration will honor the memory of those who have already fought in the contest and will help train and prepare those who will face it in the future.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: burned him according to their custom
  simplified_phrase: burned his body, as was their custom
  preserved_meaning: The centurion burned Polycarp's remains in response to the opposition.
  reasoning_layer_used: POB text and immediate narrative context
  rationale: Naming his body avoids suggesting that Polycarp was burned alive at this point.
- pob_phrase: the birthday of his martyrdom
  simplified_phrase: the anniversary of his martyrdom
  preserved_meaning: The community planned to commemorate the date of Polycarp's martyrdom.
  reasoning_layer_used: POB text and historical context
  rationale: Anniversary clearly conveys the commemorative sense of the ancient expression.
- pob_phrase: for the training and preparation of those who will do so hereafter
  simplified_phrase: This celebration ... will help train and prepare those who will face it in the future
  preserved_meaning: The commemoration serves to prepare future believers for the martyrdom contest.
  reasoning_layer_used: POB purpose clause and contest imagery
  rationale: Making the celebration the subject avoids portraying the narrators as direct trainers.
interpretive_expansions:
- pob_phrase: his bones, which are more valuable than precious stones and finer than refined gold
  rendering: his bones. To us, they are worth more than precious stones and are finer than pure gold
  claim: The valuation expresses the community's regard for Polycarp's remains.
  evidence:
  - The first-person narrators gathered and placed the bones.
  - The comparison presents the bones as precious to the community.
  confidence: high
  alternatives_preserved:
  - The language may also reflect a broader early Christian view of martyrs' remains.
