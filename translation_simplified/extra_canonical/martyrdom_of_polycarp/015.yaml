translation:
  language: en
  text: 'So they did not nail him to the stake but tied him to it. With his hands tied behind him, he was like a noble ram from a great flock, prepared as an offering—a burnt sacrifice acceptable to God. He looked up to heaven and said:


    “O Lord God Almighty, Father of your beloved and blessed Son, Jesus Christ, through whom we have come to know you: you are the God of angels and powers, of all creation, and of all righteous people who live in your presence.


    “I bless you because you have granted me this day and hour, so that I may receive a place among the martyrs in the cup of Christ, leading to resurrection and eternal life for both soul and body, in the imperishability of the Holy Spirit. Receive me among them in your presence today as a rich and acceptable sacrifice. You prepared and revealed this beforehand, and now you have brought it about, for you are the faithful and true God.


    “For this reason, and for all things, I praise, bless, and glorify you through the eternal and heavenly High Priest, Jesus Christ, your beloved Son. Through him, with him and the Holy Spirit, be glory now and for all ages to come. Amen.”'
