translation:
  language: en
  text: 'As Polycarp said these things and much more, he was filled with courage and joy, and his face was full of grace. He did not shrink in fear at what had been said to him. Instead, his response amazed the proconsul. So the proconsul sent his herald into the center of the stadium to announce three times, “Polycarp has declared that he is a Christian.”


    When the herald made this announcement, the whole crowd of non-Jews and Jews living in Smyrna shouted loudly in uncontrollable rage: “This man is the teacher of Asia and the father of the Christians! He destroys our gods, and he teaches many people not to offer sacrifices to them or worship them!” Then they demanded that Philip, who was overseeing the games, release a lion to attack Polycarp. But Philip said he was not allowed to do that because he had already brought the games to an end.


    Then the whole crowd united in demanding that Polycarp be burned alive. For the vision about his pillow had to be fulfilled. While praying, he had seen his pillow on fire. He had turned to the believers with him and said prophetically, “I must be burned alive.”'
