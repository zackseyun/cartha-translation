translation:
  language: en
  text: But a man named Quintus, who had recently come from Phrygia, lost his courage when he saw the wild animals. He had forced himself and several others to present themselves voluntarily for arrest. After repeated appeals, the Roman governor persuaded him to swear an oath and offer incense. So, brothers and sisters, we do not praise people who turn themselves in, because the Gospel does not teach us to do that.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: compelled himself and some others to come forward voluntarily
  simplified_phrase: forced himself and several others to present themselves voluntarily for arrest
  preserved_meaning: Quintus deliberately drove himself and others to surrender by choice.
  reasoning_layer_used: POB text, English witness, and grounding review
  rationale: “Forced” preserves the strong sense of compulsion while “for arrest” clarifies the action’s result.
- pob_phrase: the proconsul persuaded him to swear the oath and offer incense
  simplified_phrase: the Roman governor persuaded him to swear an oath and offer incense
  preserved_meaning: The provincial official persuaded Quintus to perform both acts of compliance.
  reasoning_layer_used: POB text and historical context
  rationale: “Roman governor” explains the title, while “an oath” avoids implying details not stated here.
- pob_phrase: those who hand themselves over
  simplified_phrase: people who turn themselves in
  preserved_meaning: The author rejects voluntarily surrendering oneself to the authorities for martyrdom.
  reasoning_layer_used: POB text and narrative context
  rationale: The familiar expression clearly conveys voluntary self-surrender.
interpretive_expansions:
- pob_phrase: come forward voluntarily
  rendering: present themselves voluntarily for arrest
  claim: Their voluntary appearance amounted to surrendering themselves to the authorities.
  evidence:
  - The closing warning calls them people who hand themselves over.
  - The martyrdom setting indicates that official custody followed their appearance.
  confidence: high
  alternatives_preserved:
  - present themselves voluntarily
  - hand themselves over
- pob_phrase: brothers
  rendering: brothers and sisters
  claim: The address includes the whole community of believers.
  evidence:
  - The warning is addressed generally to the community of fellow believers.
  confidence: moderate
  alternatives_preserved:
  - brothers
  - fellow believers
translation_notes:
