  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/020.yaml
  text: 'So it happened to the blessed Polycarp, who suffered martyrdom in Smyrna together with those from Philadelphia—twelve in all. He is remembered by everyone more than the others, so that even pagans everywhere speak about him. For he showed himself to be not only a notable teacher but also a distinguished martyr, whose martyrdom everyone desires to imitate, since it followed the pattern of the gospel of Christ.


    By his endurance he overcame the unrighteous ruler in the conflict and thus received the crown of immortality. He rejoices in the company of the apostles and all righteous people, glorifies the almighty God and Father, and blesses our Lord Jesus Christ, the Savior of our souls, the helmsman of our bodies, and the shepherd of the universal church throughout the world.'
