translation:
  language: en
  text: 'This is what happened to the blessed Polycarp. He died as a martyr in Smyrna along with people from Philadelphia—twelve people altogether. He is remembered more widely than the others; even pagans everywhere speak about him. He proved to be both an outstanding teacher and an honored martyr. Everyone wants to follow his example in martyrdom because his death followed the pattern of the gospel of Christ.


    By his endurance, Polycarp defeated the unjust ruler in the contest. In this way he received the crown of immortal life. He rejoices with the apostles and all righteous people. He gives glory to God, the almighty Father, and praises our Lord Jesus Christ—the Savior of our souls, the helmsman who steers our bodies, and the shepherd of the whole church throughout the world.'
  philosophy: optimal-equivalence
