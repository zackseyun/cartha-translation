translation:
  language: en
  text: 'When he had said “Amen” and finished praying, those in charge of the fire set it alight. A great flame leaped up. We who were allowed to see it witnessed something astonishing, and we were kept safe so that we could tell others what happened.


    The fire curved around the martyr’s body like an arched chamber, like a ship’s sail filled with wind. It formed a wall around him. There in the middle, his body did not look like burning flesh, but like [a loaf baking in an oven or like] gold and silver being refined in a furnace. We also smelled a wonderful fragrance, like frankincense or some other costly spice carried on the air.'
