translation:
  language: en
  text: 'The men searching for Polycarp would not give up, so he moved to another farm. They arrived there almost at once. When they could not find him, they seized two young servants. Under torture, one of them revealed where he was.


    Polycarp could not stay hidden because those who betrayed him belonged to his own household. The police captain, whose name happened to be Herod, was eager to bring Polycarp into the stadium. In this way, Polycarp would fulfill the part assigned to him by sharing in Christ’s suffering. His betrayers, however, would face the same punishment as Judas.'
