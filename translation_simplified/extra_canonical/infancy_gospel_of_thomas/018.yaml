  preserved_meaning: Time passed before the incident occurred at an active building project.
  reasoning_layer_used: POB text and English witness
  rationale: Ordinary narrative wording makes the setting easier to grasp without changing it.
- pob_phrase: rise and do your work
  simplified_phrase: get up and do your work
  preserved_meaning: Jesus commands the dead man to rise and carry out his work without specifying prior activity.
  reasoning_layer_used: POB text and grounding review
  rationale: “Get up” is natural English, while “do your work” avoids the unsupported claim that he was returning to it.
- pob_phrase: saved many souls from death, and he will continue to save throughout all the days of his life
  simplified_phrase: saved many people from death, and he will keep saving people for the rest of his life
  preserved_meaning: The crowd says Jesus has rescued many persons from death and will continue doing so lifelong.
  reasoning_layer_used: POB text, English witness, and immediate context
  rationale: Common wording clarifies both “souls” and the extended expression for the remainder of his life.
