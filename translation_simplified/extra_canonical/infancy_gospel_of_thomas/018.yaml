translation:
  language: en
  text: '(1) Some time later, a building was under construction. A great commotion broke out, so Jesus got up and went there.


    He saw a man lying dead. Jesus took him by the hand and said, “I tell you, get up and do your work.” The man immediately got up and worshiped Jesus.


    (2) When the crowd saw this, they were amazed. They said, “This child is from heaven! He has saved many people from death, and he will keep saving people for the rest of his life.”'
