translation:
  language: en
  text: '(1) A teacher named Zacchaeus was standing nearby. He heard what Jesus was saying to his father Joseph and was greatly amazed.


    (2) He said to Joseph, “Brother, let me take him and teach him to read and write. He can gain every kind of knowledge, learn to love those his own age, honor the aged, and respect his elders. Then he may grow to care deeply for children and teach them in return.”


    (3) But Joseph said, “Who can control this child and teach him? Brother, do not think he is merely a little child.”


    The teacher replied, “Brother, give him to me. Do not worry about him.”


    (4) The child Jesus looked at them and said to the teacher, “You are a teacher by nature, yet you do not understand the name you bear. Because of my noble birth as a human being, I am both outside you and within you. But you, an expert in the law, do not know the law.”


    Then he said to Joseph, “I already existed when you were born. I stood beside you so that you, though you are my father, might receive from me teaching that no one else knows or can give. And you will bear the name of salvation.”


    (5) The Jews cried out, “What a new and unbelievable wonder! This child is perhaps five years old—oh, what words he speaks! We have never heard words like these. No expert in the law or Pharisee has ever spoken like this child.”


    (6) The child answered, “Why are you amazed? More than that, why do you not believe what I have told you? The truth is that I, who was created before this world, know exactly when you were born. I also know when your fathers and their fathers were born.”


    (7) Everyone who heard him was speechless and could no longer answer him. But he went up to them, skipped around, and said, “I was playing with you because I know you think in small ways and are amazed by small things.”


    (8) When the child’s encouraging words seemed to put them at ease, the teacher said to Joseph, “Bring him into the school. I will teach him the alphabet.”


    Joseph took Jesus by the hand and led him into the school. The teacher spoke kindly to win him over and brought him inside. Zacchaeus wrote out the alphabet and began teaching him by repeating the same letter again and again. But the child gave no answer.


    The teacher grew angry and struck him on the head.


    The child also grew angry and said, “I should teach you instead of being taught by you, because I understand these letters better than you do. What you teach is like a noisy gong or a clanging cymbal to me: it produces neither sound, glory, nor power of understanding.”


    (9) When the child’s anger passed, he skillfully recited every letter by himself, from alpha to omega. Looking straight at the teacher, he said, “If you do not understand the nature of alpha, how can you teach anyone beta? Hypocrite! If you know, teach me alpha first. Then I will trust you to speak about beta.” He then began teaching the teacher about the first letter, and the teacher could not answer him.


    (10) As many people listened, Jesus said to the teacher, “Listen, Teacher, and understand the arrangement of the first letter. Notice its sharp lines and its middle stroke. See how its lines point, stand with legs apart, come together, extend outward, trail behind, rise up, dance around, [a] move in triple rhythm, form two corners, and are the same in form, thickness, and family—raised, balanced, isometric, and of equal proportions. These are the lines of alpha.”'
