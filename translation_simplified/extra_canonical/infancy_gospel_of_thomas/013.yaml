translation:
  language: en
  text: '(1) Jesus was about eight years old. His father, Joseph, was a carpenter who made plows and yokes. Joseph received a bed from a rich man to make it very large and suitable. But one of the bed’s beams—whose ancient name is unclear[a]—was too short. Joseph was troubled and did not know what to do.


    Jesus came to him and said, “Lay the two boards down and line up their ends on your side.”


    (2) Joseph did exactly what Jesus said. Jesus stood at the other end, took hold of the shorter board, and stretched it until it was the same length as the other one.


    Then he told his father, “Do not be troubled. Make whatever you want to.”


    Joseph hugged and kissed him. He said, “I am blessed because God gave me this child.”'
  philosophy: optimal-equivalence
  footnotes:
