translation:
  language: en
  text: 'In the manuscript Hagios Saba 259, this passage comes after Chapter 16.


    (1) Once again, a young man was cutting wood into equal pieces. He cut the sole of his foot, bled to death, and died.


    (2) An uproar broke out, and Jesus ran to the scene. He pushed through the crowd, took hold of the injured foot, and it was healed at once. Then Jesus said to the young man, “Go and cut your wood.”


    (3) When the people saw this, they were amazed. They said, “He has saved many lives from death, and he will keep doing so throughout his life.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: he split the bottom of his foot, bled out, and died
  simplified_phrase: He cut the sole of his foot, bled to death, and died.
  preserved_meaning: The young man suffered a fatal cut to the underside of his foot.
  reasoning_layer_used: POB text and English witness
  rationale: “Sole” and “bled to death” express the same sequence in natural English without identifying a tool or wound depth.
- pob_phrase: A commotion arose ... Forcing his way through the crowd
  simplified_phrase: An uproar broke out ... He pushed through the crowd
  preserved_meaning: The accident caused public alarm, and Jesus had to make his way through the gathered people.
  reasoning_layer_used: POB text and English witness
  rationale: Common verbs make the action clear while preserving its urgency.
- pob_phrase: saved many souls from death ... all the days of his life
  simplified_phrase: saved many lives from death ... throughout his life
  preserved_meaning: The crowd says Jesus rescued many people from dying and would continue to do so.
  reasoning_layer_used: POB context and English witness
  rationale: “Lives” avoids suggesting only spiritual salvation in this physical-rescue context.
