  review_verdict: revise
  review_output_hash: 8f459db3dc0efd91e1a1173305ee4d20beed2a61dcc3cb3e8cce300fea8bd49c
  review_summary: The draft is substantially clearer and correctly renders the crowd’s “souls” as people/lives in this physical-rescue context rather than importing a narrowly spiritual sense. However, it should not state that an unspecified tool “cut deep into” the man’s foot. The replacement retains the clear sequence and sole-of-the-foot clarification while leaving the instrument and degree of depth unstated.
