translation:
  language: en
  text: '(1) A few days later, another teacher said to Joseph, Jesus’ father, “Brother, bring him to my school. I will gently persuade him as I teach him to read and write.”


    Joseph answered, “Brother, if you are brave enough, take him, and may you be kept safe.”


    The teacher took the child by the hand and led him away, deeply afraid and worried. But the child went gladly.


    (2) When Jesus entered the school, he saw a book lying on the reading stand and picked it up. He did not read its words, because it was not from God’s law. Instead, he began to speak such remarkable words that the teacher sitting across from him listened with great delight and urged him to continue. The people standing there were amazed at his holy words.


    (3) Joseph hurried to the school, fearing that this teacher too had suffered and was no longer inexperienced. But the teacher told Joseph, “Brother, understand this: I did take your child as a student, but he is filled with great grace and wisdom. So take him safely home with you.”


    (4) Jesus said to the teacher, “Because you have spoken and testified rightly, the one who was struck down will also be saved because of you.” Immediately, that teacher too was saved. Then Joseph took the child home.'
