translation:
  language: en
  text: '(1) The child Jesus was five years old. After the rain, he was playing at a shallow crossing in a flowing stream. He stirred up the muddy water and collected it in pools. Then, by his word alone, he made the water clean and good, without doing anything else.


    (2) Next he took soft clay from the mud and shaped it into twelve sparrows. He did this on the Sabbath, while many other children were with him.


    (3) A Jewish man saw Jesus doing this with the other children. He went to Joseph, Jesus’ father, and spoke against Jesus, saying, “He made clay on the Sabbath, which is not allowed, and shaped twelve sparrows.”


    (4) Joseph went to Jesus and scolded him. “Why are you doing these things on the Sabbath?” he asked.


    But in front of everyone, Jesus clapped his hands and shouted to the birds, “Go! Fly away like living birds!” The sparrows flew off, squawking as they went.


    (5) When the Pharisee saw this, he was amazed and told all his friends about it.'
