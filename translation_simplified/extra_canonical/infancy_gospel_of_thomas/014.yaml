translation:
  language: en
  text: '(1) Joseph saw how wise Jesus was and how much he understood. He wanted Jesus to learn his letters, so he sent him to another teacher.


    The teacher wrote out the alphabet for Jesus and said, “Say alpha.”


    (2) Jesus said, “First tell me what beta is, and I will tell you what alpha is.”


    The teacher became angry and struck him. Jesus cursed him, and the teacher fell down and died.


    (3) Jesus went home to his parents. Joseph called Jesus’ mother and told her, “Do not let him leave the house, so that anyone who provokes him might not die.”'
