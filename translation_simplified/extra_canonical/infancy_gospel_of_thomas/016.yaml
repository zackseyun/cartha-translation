  language: en
  text: '(1) James went into a wooded area to gather and bundle sticks so that they could make bread, and Jesus went with him. While they were gathering the sticks, a dangerous snake bit James on the hand.


    (2) James lay stretched out, dying. The child Jesus ran to him and blew on the bite. The bite was healed at once, the snake was destroyed, and James was saved.[a]'
