  text: '(1) Annas, the high priest’s son, said to Jesus, “Why are you doing this on the Sabbath?” Then he took a willow twig, broke apart the pools, and let out the water Jesus had gathered, leaving them dry.


    (2) When Jesus saw what he had done, he said, “Your fruit will have no root. Your shoot will wither like a branch scorched by a violent wind!”


    (3) The child immediately withered away.'
