translation:
  language: en
  text: '(1) After this, a baby who lived near Joseph became sick and died. His mother wept bitterly.


    When Jesus heard the loud mourning and confusion, he ran there at once. He found the child dead, touched his chest, and said, “Baby, I tell you: Do not die. Live, and stay with your mother.”


    Immediately the baby looked up and laughed. Jesus said to the mother, “Take your child, feed him milk, and remember me.”


    (2) The crowd standing there was amazed. They said, “This child truly is a god or an angel, because everything he says happens!”


    Then Jesus left and went back to playing with the other children.'
