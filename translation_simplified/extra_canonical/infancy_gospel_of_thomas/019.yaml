translation:
  language: en
  text: '(1) When Jesus was twelve years old, his parents went to Jerusalem for the Passover festival, as was their custom. But while they were returning home, Jesus stayed behind in Jerusalem, and his parents did not know it.


    (2) They thought he was with their group of travelers, so they traveled for a day. Then they looked for him among the relatives they knew. When they did not find him, they returned to Jerusalem and searched for him.


    After three days, they found him in the temple. He was sitting among the teachers, listening to them and asking them questions. Those who heard him were amazed by the questions he asked the elders and by the way he explained the main teachings of the law, the riddles, and the parables of the prophets.


    (3) His mother said to him, “Child, why have you done this to us? Look, we have been searching for you in pain and grief.”


    Jesus said, “Why were you looking for me? Didn’t you know that I must be in the place of my Father?”


    (4) The scribes and Pharisees said to Mary, “Are you the mother of this child?”


    She said, “I am.”


    They said to her, “You are blessed, because the Lord God has blessed the fruit of your womb. We have never seen such wisdom, worthy of praise, and such glorious virtue.”


    (5) Jesus got up and followed his mother from there, and he obeyed his parents. She treasured all these things and thought deeply about them in her heart.


    Jesus continued to grow in wisdom, maturity, and grace before God and people. To whom be the [glory …].'
