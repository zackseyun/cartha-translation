translation:
  language: en
  text: '(1) Jesus left that place with his father Joseph. As they were walking, someone ran into Jesus and struck his shoulder. Jesus said to him, “May you be cursed because of your leader!”[a]


    That child died at once.


    When the people saw this, they cried out, “Where did this child come from? Whatever he says happens!”


    (2) When the dead child’s parents saw what had happened, they blamed Joseph. They said, “Since you have this child, you cannot live with us in this village. If you want to stay here, teach him to bless people instead of cursing them, because our child has been taken from us.”'
