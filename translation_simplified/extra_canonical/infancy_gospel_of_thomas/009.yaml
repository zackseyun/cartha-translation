translation:
  language: en
  text: '(1) Many days later, Jesus was playing with some other children on the roof of an upstairs room. One child fell from the roof and died. When the other children saw what had happened, they went home and left Jesus there alone.


    (2) The dead child’s parents came and accused Jesus. “You pushed our child off the roof!” they said.


    Jesus answered, “I did not push him.”


    (3) They became furious and began shouting. Jesus came down from the roof and stood beside the child’s body. Then he called out loudly, “Zeno! Zeno!”—for that was the child’s name. “Get up and tell them whether I pushed you.”


    Zeno got up and said, “No, sir.”


    When they saw this, they were amazed.


    Then Jesus said to him, “Go back to sleep.”


    The child’s parents praised God and worshiped the child Jesus.'
