translation:
  language: en
  text: '(1) The teacher heard Jesus explain the first letter with such insight and describe its lines so well. He was overwhelmed by Jesus’ teaching and reply. He said, “How terrible for me! How terrible! I am confused and miserable. By taking this child as my student, I have brought shame on myself.


    (2) “Brother, take him away from me. I cannot bear his gaze or the clarity of his words. This child is not of this earth. He can even tame fire! Perhaps he existed before the world was created. What kind of womb carried him? What kind of mother raised him? I do not know. How terrible for me, brother! He leaves me stunned. My mind cannot keep up with him. I have deceived myself, and I am utterly miserable. I thought I would gain a student, but instead I have discovered that he is my teacher.


    (3) “Friends, think of my shame! I am an old man, yet a child has defeated me. I should be driven away to die, or else flee this village because of him. I can no longer show my face in public, especially before those who saw a very young child defeat me. What can I say to anyone about the lines of the first letter? The truth is, friends, I do not know. I understand neither its beginning nor its end!


    (4) “So, brother Joseph, take him safely home. This child is extraordinary—whether a god, an angel, or something else, I do not know.”'
