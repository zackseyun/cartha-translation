translation:
  language: en
  text: '(1) Joseph said to Jesus, “Why do you say such things? They suffer, and they hate us.”


    The child answered Joseph, “Since you understand wise sayings, you know where these words came from. They were spoken about a five-year-old. And they will not be raised; these will receive their punishment.”[a]


    Immediately, those who were accusing him became blind.


    (2) Joseph took Jesus by the ear and pulled it hard.


    (3) Jesus said to him, “It is enough for you to seek and find me. Do not go beyond that and beat me because you have taken on natural ignorance.[b] You have not clearly understood why I am yours. Look! I have submitted to you.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The wording and the people meant by “they” and “these” are unclear in the available English witness; review of the Greek source is pending.
    reason: source_note
  - marker: b
    text: The expression “natural ignorance” is obscure in the available English witness; review of the Greek source is pending.
    reason: source_note
