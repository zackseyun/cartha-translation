translation:
  language: en
  text: 'The Savior said to his disciples, “Brothers, the time has now come for us to stop our work and come to rest, because whoever comes to rest will rest forever. I tell you: Always rise beyond [. . .] what belongs to time [. . .]. [I tell] you, [. . .] do not fear those who [. . .] you. I [tell you], anger is terrifying, and [whoever] stirs up anger is a [terrifying person]. But because you have [been able to endure suffering], it may come out from [you . . .].


    “People received these teachings about anger with fear and trembling. Anger placed ruling powers [a] over them, because no one can escape anger. But when I came, I opened a path and taught people about the way of crossing over for the chosen and solitary ones [. . .], those who have known the Father and remained faithful to the truth. And you offered praise.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The English witness uses the term “archons,” meaning rulers or ruling powers.
    reason: source_note
