translation:
  language: en
  text: 'He [took] Judas, Matthew, and Mary [...] to show them [the farthest] boundary of heaven and earth.[a] When he placed his [hand] on them, they hoped they would be able to see it.


    Judas looked up and saw a place of great height. He also saw the abyss far below.


    Judas said to Matthew, “Brother, who can climb to such a height or descend into the abyss below, since there is a great inferno there, and great terror?”


    At that very moment, a word came from the height. Judas stood there and watched how the word descended.


    He asked the word, “Why have you come down?”


    The Son of Man greeted them and said, “A seed that came from a power lacked something, and it descended into the abyss of the earth. The Majesty remembered [it] and sent the [word to] it. The word lifted up the seed before [the presence] of the Majesty, so that [...] the first word would not be lost.”


    [His] disciples were amazed by everything he told them. They faithfully accepted it all, knowing that there is no use in considering evil.


    Then he said to his disciples, “Did I not tell you that the good will be lifted into the light like a voice that can be seen and a flash of lightning?”


    All his disciples praised him and said, “Lord, before you appeared here, who praised you, since all praise belongs to you? Who blessed [you], since every blessing belongs to you?”


    As they stood there, he saw two spirits carrying one soul with them. A great flash of lightning appeared. Then a word came from the Son of Man: “Give them their garments!”


    The small became the same as the large. They were [like] those who had been received above. [...] [There was no difference] between them. The [sayings] he [spoke convinced the] disciples.


    Mary [said to him, “Look, I] see the evil [that has influenced] people from the beginning as they live with one another.”


    The Lord [said to her], “When you see them, [you understand] much. They will [not remain there together]. But when you see the One Who Exists Forever, that will be the great vision.”


    They all said to him, “Explain this to us.”


    He said to them, “How do you want to see it: in a vision that passes away, or in a vision that lasts forever?”


    He continued, “Do all you can to save what will remain after [you]. Search for it and speak from within it, so that what you seek may be in harmony with you. For I [tell] you the truth: the living God [is] within you, [...] [just as you are] within God.”'
