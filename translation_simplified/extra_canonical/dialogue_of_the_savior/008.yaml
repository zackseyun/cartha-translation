translation:
  language: en
  text: 'Judas asked, “Lord, tell me: how does the shaking of an earthquake shake the earth?”


    The Lord picked up a stone and held it in his hand. He asked Judas, “What am I holding?”


    Judas answered, “A stone.”


    The Lord said to them, “What supports the earth also supports heaven. When a word comes from the Majesty, it reaches what supports heaven and earth. The earth does not move. If it did, it would fall. But it remains in place so that the first word will not fail.


    “The word established the world, lived in it, and breathed in its fragrance. I proclaim to all of you Sons of Man everything that cannot be moved, because you come from that place. You live in the hearts of those who speak with joy and truth. If the word comes from the Father’s body among human beings and people do not accept it, it will return to the place it came from.”'
  philosophy: optimal-equivalence
