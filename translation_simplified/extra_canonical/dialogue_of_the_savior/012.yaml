translation:
  language: en
  text: 'The disciples asked him, “What are fullness and deficiency?”


    He answered them, “You came from fullness, and you live in the place of deficiency.


    “Look! His light has poured down on me.”


    Matthew asked, “Lord, tell me: How do the dead die, and how do the living live?”


    The Lord said, “[You have] asked me about a [true] saying that no eye has seen, and you are the only ones I have heard ask about it. But I tell you: when what gives a person life is taken away, that person is called dead. When what is alive <enters into> what is dead, it is called alive.”


    Judas asked, “Tell us plainly: Why do some <die> while others live?”


    The Lord said, “Whatever comes from the truth will not die. Whatever comes from a woman will die.”


    Mary asked, “Lord, tell me why I have come to this place. Is it to gain or to lose?”


    The Lord answered, “You reveal the wealth of the one who reveals.”


    Mary asked him, “Lord, then is there a place forsaken (by) the truth, or lacking the truth?”


    The Lord said, “The place where I do not dwell.”


    Mary said, “Lord, you inspire fear and wonder in those who do not know [you], even [like a consuming fire].”


    Matthew asked, “Why do we not rest immediately?”


    The Lord said, “You will rest when you leave behind what you cannot take with you.”


    Matthew asked, “How can what is small be in harmony with what is great?”


    The Lord said, “By leaving these burdens behind.”'
