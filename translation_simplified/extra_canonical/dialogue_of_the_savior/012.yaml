  rationale: This avoids the uncommon sense of “animates” without defining the life-giving element more narrowly.
- pob_phrase: why have I come to this place to profit, or to lose?
  simplified_phrase: why I have come to this place. Is it to gain or to lose?
  preserved_meaning: Mary asks whether her coming will result in gain or loss.
  reasoning_layer_used: POB syntax and immediate context
  rationale: Two direct sentences make the contrast easier to follow.
- pob_phrase: By leaving behind what you cannot take with you, you will then rest.
  simplified_phrase: You will rest when you leave behind what you cannot take with you.
  preserved_meaning: Rest follows leaving behind what cannot accompany a person.
  reasoning_layer_used: POB causal sequence
  rationale: Ordinary clause order makes the condition and result clear.
