translation:
  language: en
  text: 'Mary said, “I want to understand everything [exactly as] it is.”[a]


    The Lord said, “Whoever seeks life—this will be their wealth. The [rest] the world offers is false, and its gold and silver deceive.”


    His disciples asked him, “What must we do to complete our work?”


    The Lord said to them, “Be ready for every circumstance. Blessed is the one who has known […] [conflict and has seen] the battle with his own eyes. He has neither killed nor been killed, but has come through victorious.”


    Judas asked, “Lord, tell me: What is the beginning of the path?”


    He answered, “Love and goodness. If even one of these had existed among the ruling powers,[b] evil would never have come into being.”


    Matthew said, “Lord, you have spoken easily about how everything will end.”


    The Lord said, “You have understood everything I told you and accepted it faithfully. If you know it, it is yours. If you do not, it is not yours.”


    They asked him, “Where are we going?”


    The Lord said, “Take the place you are able to reach.”


    Mary asked, “Can everything arranged in this way be seen?”


    The Lord said, “I have told you: the one who is able to see is also the one who reveals.”


    The twelve disciples asked him, “Teacher, [with] […] peace […] teach us […].”


    The Lord said, “[If you have understood] everything I have [told you], you will [become deathless, because] you […] everything.”


    Mary said, “I will say only one thing to the Lord about the secret of truth. We stand in it, and through it we are transparent to what belongs to the world.”


    Judas said to Matthew, “We want to understand what kind of garments we will wear when we leave behind the mortal [flesh].”


    The Lord said, “The rulers and administrators have garments that are given only for a time and do not last. But you, as sons of truth, must not clothe yourselves with such temporary garments. Instead, I tell you that you will be blessed when you take off your garments, because […] [laying aside what is] outward is no great thing.”


    […] said, “Is it I who speak, and is it I who receive […]?”


    The Lord said, “Yes, [the one who receives] your Father in [a reasoned way].”'
