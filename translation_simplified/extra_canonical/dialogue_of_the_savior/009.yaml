translation:
  language: en
  text: '“Whoever does not know the deed of completeness knows nothing.


    “Whoever does not stand in darkness cannot see the light.[a]


    “Whoever does not understand how fire came into existence will burn in it without knowing its origin.


    “If someone does not first understand water, that person knows nothing. What good does it do to be baptized in water without understanding it?


    “Whoever does not understand how the blowing wind came into existence will be blown away with it.


    “Whoever does not understand how the body they wear came into existence will be destroyed with it.


    “And how can anyone who does not know the Son know the [Father]?


    “Everything is hidden from anyone who does not know the root of everything.


    “Whoever does not know the root of iniquity will be familiar with it.


    “Those who do not understand how they came into being will not understand how they will depart.


    “Anyone who will [exalt himself] and consequently be humiliated is no stranger to this world.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The manuscript has a gap before the word “light.”
    reason: source_note
simplification_decisions:
- pob_phrase: knowing not its origin
  simplified_phrase: without knowing its origin
  preserved_meaning: The person suffers in the fire while remaining ignorant of how it came into existence.
  reasoning_layer_used: POB text and immediate context
  rationale: The wording keeps the broader origin sense rather than making it spatial.
- pob_phrase: what does it profit such a person to be baptized therein?
  simplified_phrase: What good does it do to be baptized in water without understanding it?
  preserved_meaning: Baptism in water gives no stated benefit to someone who does not understand water.
  reasoning_layer_used: Immediate context and POB syntax
  rationale: The archaic idiom and pronoun are replaced while preserving the rhetorical question.
- pob_phrase: will be no stranger to it
  simplified_phrase: will be familiar with it
  preserved_meaning: Ignorance of iniquity’s root leaves a person closely associated with iniquity.
  reasoning_layer_used: POB idiom and clause context
  rationale: The double negative is stated directly without adding a continuing temporal sense.
