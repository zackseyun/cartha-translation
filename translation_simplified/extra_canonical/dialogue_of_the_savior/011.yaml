translation:
  language: en
  text: 'Judas [said], “I truly want [to understand everything].”


    The [Lord] told him, “The living [God does not] dwell [anywhere in this] whole [realm] of deficiency.”


    Judas [asked], “Who [will rule over us]?”


    The Lord answered, “[Look, everything that exists dwells here, among] what will remain. You will [rule] over them.”


    Judas said, “Look, the ruling powers[a] are over us and will rule over us.”


    The Lord answered, “You are the ones who will rule over them. When you rid yourselves of jealousy, you will be clothed with light and enter the bridal chamber.”


    Judas asked, “How will we receive [our] garments?”


    The Lord answered, “Some will provide them for you, while others will receive [them]. […] They are the ones [who will give] you your garments. Who can reach that place when it is so [fearsome]? Yet the garments of life will be given to people because they know the path they will travel. In fact, even I find it difficult to reach that place.”


    Mary said, “In this way, each day has <enough> trouble of its own. Workers deserve their food. Students will be equal to their teachers.”


    She spoke as a woman who understood everything.'
