  reasoning_layer_used: POB terminology, manuscript brackets, and grounding review
  rationale: “Rulers” clarifies archons, while retaining “aeons” protects the technical ambiguity.
- pob_phrase: it is incumbent on the one who has known the works to work the [will] of the Father
  simplified_phrase: whoever has come to know the works must do the [will] of the Father
  preserved_meaning: Knowing the works brings an obligation to carry out the Father’s will.
  reasoning_layer_used: POB base text
  rationale: The direct wording preserves knowledge, duty, and action without the formal construction.
