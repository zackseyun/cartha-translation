translation:
  language: en
  text: 'Mary asked, “What kind of thing is the mustard seed? Does it belong to heaven or to the earth?”


    The Lord said, “After the Father established the world for himself, he left much of what remained with the Mother of All. That is why he sows and works.”


    Judas said, “You have spoken to us from the true mind. How should we pray?”


    The Lord said, “Pray in the place where there is no woman.”


    Matthew said, “He tells us, ‘Pray in the place where there is no woman.’ He means that the works of the female must be destroyed—not because there is another kind of birth, but because they must stop giving birth.”


    Mary asked, “Will they never be destroyed?”


    The Lord said, “[You] know that they will perish [again], and [the works of the female that are here] will [also be destroyed].”


    Judas said [to Matthew], “The works of the [female] will indeed perish. Then the rulers [will call upon their aeons], and we will be ready for them.”[a]


    The Lord said, “Will they see [you]? Will they see those who receive you? Look: a true word comes from the Father into the abyss in silence, like a flash of lightning, and it generates. Do they see it, or can they overcome it? Surely you know more clearly [the path] that [neither angel] nor authority knows. It is the path of the Father and the Son, for the two are one. You will travel on the [path] you have come to know. Even if the rulers become immensely powerful, they cannot reach it. I tell you the [truth]: even for me, it is difficult to reach.”


    [Mary] asked [the Lord], “If works [are destroyed], what actually destroys a work?”


    [The Lord said], “You know that [whenever] I destroy [it], it will return to its own place.”


    Judas asked, “How does the spirit become visible?”


    The Lord replied, “How does the sword [become visible]?”


    Judas asked, “How does the light become visible?”


    The Lord replied, “[It is] always [made visible] by itself.”


    Judas asked, “Who dissolves whose works? Do works [dissolve] the world, or does the world dissolve works?”


    The Lord [answered], “The one who [understands is the one who dissolves works], because whoever has come to know the works must do the [will] of the Father.”'
