translation:
  language: en
  text: 'The disciples said, “Lord, who is the one who seeks, and who is the one who reveals?”


    The Lord answered them, “The one who seeks is the same one who reveals.”


    Matthew again asked him, “Lord, when I listen to you and when I speak, who is speaking, and who is listening?”


    The Lord answered, “The one who speaks is the same one who listens, and the one who can see is the same one who reveals.”


    Mary said, “Lord, look: while I am clothed in a body, where do my tears come from, and where does my laughter come from?”


    The Lord answered, “The body weeps because of what it has done and what still remains to be done. The mind laughs because of the fruits of the spirit. Anyone who does not stand in darkness will not be able to see the light.


    “I tell you, whatever is without the light is darkness, and anyone who does not stand in darkness will not be able to see the light. But the children of deceit were taken away ... You will clothe yourselves with light, and so you will live forever ... If ... then every power above and below will treat you cruelly. In that place there will be weeping and gnashing of teeth over the end of everything.”'
  philosophy: optimal-equivalence
