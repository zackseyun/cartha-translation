  reasoning_layer_used: POB text and English witness
  rationale: The clothing image remains intact while the wording sounds natural.
- pob_phrase: weeps on account of its deeds, and on account of the deeds that still remain to be done
  simplified_phrase: weeps because of what it has done and what still remains to be done
  preserved_meaning: The tears concern both past deeds and deeds not yet completed.
  reasoning_layer_used: POB text and English witness
  rationale: The wording removes repetition without adding necessity or obligation.
- pob_phrase: will handle you cruelly
  simplified_phrase: will treat you cruelly
  preserved_meaning: The powers will subject the hearers to cruel treatment.
  reasoning_layer_used: POB text and English witness
  rationale: “Treat” expresses the same action in ordinary modern English.
