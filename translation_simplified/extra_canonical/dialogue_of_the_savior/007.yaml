simplification_decisions:
- pob_phrase: possesses a place in the heart [] to store them
  simplified_phrase: has room in their heart to hold them
  preserved_meaning: The person must have an inward capacity to receive and retain these questions.
  reasoning_layer_used: English witness and POB controlling text
  rationale: Common wording clarifies the image without reducing it to mere memory.
- pob_phrase: will not be detained in this world of poverty
  simplified_phrase: not be held back in this world of poverty
  preserved_meaning: The person will not remain confined by the world's impoverished condition.
  reasoning_layer_used: POB controlling text
  rationale: “Held back” is more natural while preserving both restraint and poverty images.
- pob_phrase: as long as you wear the flesh
  simplified_phrase: as [long as you] are clothed in flesh
  preserved_meaning: Seeing the place is impossible while Matthew remains embodied in flesh.
  reasoning_layer_used: English witness and POB controlling text
  rationale: The recast phrase reads naturally while retaining the clothing image and the term “flesh.”
