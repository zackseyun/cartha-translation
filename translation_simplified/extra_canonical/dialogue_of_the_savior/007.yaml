translation:
  language: en
  text: 'Mary asked her brothers, “Where will you keep [these] questions that you ask the Son of [Man]?”


    The Lord [said] to her, “Sister, [no one] can ask about these things [except] someone who has room in their heart to hold them. Such a person can leave [the world], enter the place [of life], and not be held back in this world of poverty.”


    Matthew said, “Lord, I want [to see] that place of life, [where] there is no evil, but only pure [light].”


    The Lord answered, “Brother Matthew, you cannot see it as [long as you] are clothed in flesh.”


    Matthew said, “Lord, [if I] cannot see it, at least let me know it.”


    The Lord said, “Anyone who has come to know themselves has seen it. Such a person does everything they are given to do. In this way, they have become like that place in goodness.”'
