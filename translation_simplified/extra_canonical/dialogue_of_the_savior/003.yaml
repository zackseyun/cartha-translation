  reasoning_layer_used: POB base text and manuscript lacunae
  rationale: The rewrite turns abstract and damaged wording into a natural sentence while retaining the missing-text marker.
- pob_phrase: The [] crossing place is certainly fearsome in [your] sight, yet do not hesitate to pass through it
