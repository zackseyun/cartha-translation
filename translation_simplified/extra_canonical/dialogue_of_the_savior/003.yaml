translation:
  language: en
  text: '“I will teach you when the time of destruction will come. The first power of darkness will overtake you. Do not be afraid or say, ‘Look, the time has come.’ But when you see a lone staff [...], know that [...] from the work [...] and the ruling powers [...] overtake you [...].


    “Fear is the true power [of darkness]. So if you fear what will soon overtake you, it will overpower you. Not one of them will free you or show you mercy. Instead, look at what is within you, because you have gained mastery over everything earthly. This [...] will carry you upward to a place where no one reigns and no tyrant rules.


    “When you [...] you will see those [...], and you too will hear them. I tell you, reason [...]. Reason is [...] where the truth is. But they [...] and you [...] the truth. This is [...] within the living mind. Therefore, [...] and your joy [...] so that [...] your souls [...], so that the word does not [...] what they raised up [...]. They could not understand it [...]. Make what is within you and what is outside you the same.


    “The crossing place will certainly look terrifying to you, but do not hesitate to pass through it. Its depth is great, and its height is vast! Be of one mind [...], and the fire [...] drops of dew [...] all the powers [...] you. They will [...], and all the powers [...] they [...] before. I tell you, [...] the soul [...] will become [...] in all of them [...] you are [...] and that [...] do not sleep [...] the sons [...] and you [...] you [...].”'
  philosophy: optimal-equivalence
