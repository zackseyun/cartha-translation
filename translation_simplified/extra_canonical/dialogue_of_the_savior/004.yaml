translation:
  language: en
  text: 'Matthew asked, “How [. . .]?”


    The Savior said, “[If you do not keep in order] what is inside you, [your work] will survive, but you [will not].”


    Judas said, “Lord, [I want to know about all] the deeds of the souls [belonging to] these little ones. When [. . .], where will they live? [. . .] the spirit [. . .]?”


    The Lord said, “[. . . accept] them. They do not die or perish, because they have understood [their] companions and the one who will accept them. For the truth seeks those who are wise and righteous.”


    The Savior said, “The mind is the lamp of the body. When [what is inside] you—[the soul]—is kept in order, your bodies will be [filled with light]. But when your hearts are dark, the light you hope for [will remain far from you]. I have called [you to myself] because I will soon leave, so that [you may receive] my word among [you. Look], I am sending it to [you].”[a]'
