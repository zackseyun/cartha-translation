translation:
  language: en
  text: 'This marriage is not like physical marriage. People who have sex with each other are satisfied with physical union. Then they cast off the trouble of bodily desire as if it were a heavy burden, [turning their faces] away from each other. But this marriage is different. When the two are joined [to each other], they become one life.


    [ ] This is why the prophet said about the first man and woman, “The two will become one flesh.” (Genesis 2:24)


    At first they were joined together while they lived with the Father. Then the woman led astray the man, who is her brother. This marriage has joined them together again. The soul has been united with her true love, her original master. As it is written, “The woman’s master is her husband.” (Genesis 3:16; Ephesians 5:23)


    Little by little, the soul recognized him. She rejoiced again and wept in his presence as she remembered her former shame as a widow. She made herself even more beautiful so that he would delight to live with her.


    The prophet said in the Psalms:


    “Listen, my daughter. Look and pay attention.

    Forget your people and your father’s house.

    Then the king will desire your beauty,

    for he is your lord.” (Psalm 45:10–11)


    He commands her to turn away from her people and from the crowd of her adulterers, among whom she once lived. She must devote herself to her king alone, her true Lord. She must forget her earthly father’s house, where her life was miserable, and instead remember her Father in heaven.


    In the same way, Abraham was told, “Leave your country, your relatives, and your father’s house.” (Genesis 12:1)


    So the soul [made herself beautiful] once more in her splendor and [desired] to worship her beloved; and [he also] loved her. When she was united with him, she received from him [ ] the seed of the life-giving Spirit. Through this seed she gives birth to children who live rightly and raises them. This is the great and perfect miracle of birth. Thus this marriage is completed by the Father’s will.


    It is fitting for the soul to renew herself and become again what she was before. Then she moves by her own will and receives from the Father the divine nature that renews her and restores her to the place where she was at first:


    This is resurrection from the dead.

    This is redemption from slavery.

    This is the upward journey to heaven.

    This is the path that leads up to the Father.


    Therefore the prophet said:


    “Praise the Lord, my soul.

    Let everything within me praise his holy name.

    My soul, praise God,

    who forgives all your sins,

    who heals all your diseases,

    who rescues your life from death,

    who crowns you with mercy,

    and who satisfies your longing with good things.

    Your youth will be renewed like the eagle’s.” (Psalm 103:1–5)


    After the soul becomes young again, she will ascend while praising the Father and her brother, who saved her. In this way the soul is saved by being born again. This salvation does not come from repeating formulas, mastering learned teachings, or studying books. It comes by the grace of the [Spirit]; it is the gift of the compassionate [God]. This is the way of this heavenly reality.


    Therefore the Savior calls out: “[ ] No one can come to me unless my Father draws him and brings him to me. And I will raise him up on the last day.” (John 6:44)'
