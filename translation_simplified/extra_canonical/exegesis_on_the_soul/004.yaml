- pob_phrase: It is appropriate that the soul regenerates herself
  simplified_phrase: It is fitting for the soul to renew herself
  preserved_meaning: Renewal is fitting and remains an action attributed to the soul rather than a command or passive event.
  reasoning_layer_used: POB wording and following agency clause
  rationale: The revision preserves both qualified necessity and the soul’s active role.
- pob_phrase: not by repeating formulas or by educated expertise or by learning from books
  simplified_phrase: does not come from repeating formulas, mastering learned teachings, or studying books
  preserved_meaning: Salvation is not gained through ritual speech, intellectual mastery, or book learning.
  reasoning_layer_used: POB three-part contrast
  rationale: The three rejected means remain distinct in natural modern English.
