translation:
  language: en
  text: 'Now the Holy Spirit speaks in many places about the prostitution of the soul—its spiritual unfaithfulness. Through the prophet Jeremiah, the Spirit says:


    “If a man divorces his wife and she marries another man, can she return to her first husband? Has she not completely defiled herself? ‘Yet you prostituted yourself to many shepherds, and then you returned to me,’ says the Lord. ‘Look carefully. See all the places where you prostituted yourself. You sat beside the roads, polluting the land by your prostitution and wickedness. You let many shepherds become a stumbling block to you. You acted shamelessly with everyone. You did not call on me as your relative, your father, or the guardian of your virginity.’” (Jeremiah 3:1–4)


    Again, the prophet Hosea says:


    “Bring charges against your mother, because she is no longer my wife, and I am no longer her husband. Let her remove her prostitution from my sight and her adultery from between her breasts. Otherwise, I will strip her naked as she was on the day she was born. I will make her like a wilderness, like a land without water, and I will make her [long for children but have none]. I will have no compassion on her children, because they are children of prostitution. Their mother prostituted herself and [acted shamefully toward her children]. […] She said, ‘I will go after my lovers. They gave me bread and water, clothes to wear, wine and oil, and everything I needed.’ So now I will shut her in, and she will not be able to chase after her lovers. She will look for them but will not find them. Then she will say, ‘I will return to my former husband, because I was better off then than I am now.’” (Hosea 2:2–7)


    Again, the Lord says in Ezekiel:


    “After all your wickedness, you built places of prostitution and displayed your beauty in the streets. You built such places on every street. You wasted your beauty, spread your legs in every alley, and committed more and more acts of prostitution. You prostituted yourself to the sons of Egypt, your neighbors—men great in flesh.” (Ezekiel 16:23–26)


    What does “the sons of Egypt, men great in flesh” mean? It means the kingdom of the flesh, the world we perceive through our senses, and earthly concerns. These things defile the soul here. She turns to them for bread, wine, oil, clothing, and other mindless outward things connected with the body—things she believes she needs.


    The Savior’s apostles warned about this prostitution: “Guard yourselves from it and cleanse yourselves from it.” They meant not only prostitution of the body, but especially prostitution of the soul. This is why the apostles write [to the churches] of God: so that [this kind of prostitution] will not happen among us.


    Yet the prostitution of the soul is the most difficult matter. Prostitution of the body also comes from it. Paul therefore wrote to the Corinthians, “I wrote to you in my letter, ‘Do not associate with prostitutes.’ I did not mean the prostitutes of this world, or greedy people, robbers, or idolaters. To avoid all such people, you would have to leave the world.” (1 Corinthians 5:9–10)


    Here Paul is speaking spiritually. As he said, “Our struggle is not against flesh and blood, but against the rulers of this dark world and the spirits of wickedness.” (Ephesians 6:12)


    As long as the soul keeps running everywhere, having sex with everyone she meets and defiling herself, she suffers what she deserves.'
