translation:
  language: en
  text: 'But let us ask whether the Lord revealed anything beforehand about the water and the cross. Concerning the water, Scripture says that Israel would refuse the baptism that brings forgiveness of sins and would make something for themselves instead.


    For the prophet says:


    “Be amazed, heaven,

    and let the earth tremble even more at this!

    For this people has done two evil things:

    they have abandoned me, the fountain of life,

    and dug for themselves a pit of death.


    “Is my holy mountain Sinai a barren rock?

    You will be like young birds

    fluttering in the air because they have lost their nest.”


    Again the prophet says:


    “I will go ahead of you and level mountains.

    I will crush bronze gates

    and break iron bars to pieces.

    I will give you treasures hidden in dark and secret places,

    so that they may know that I am the Lord God.”


    Scripture also says, “You will live in a high cave within a strong rock,” and, “His water will never fail. You will see the King in his glory, and you will reflect on the fear of the Lord.”


    Again, another prophet says:


    “The person who does these things

    will be like a tree planted beside flowing streams.

    It will bear fruit at the proper time.

    Its leaves will not fall,

    and everything that person does will prosper.


    “But the ungodly are not like this—not at all.

    They are like dust that the wind blows

    from the face of the earth.

    Therefore, the ungodly will not stand in the judgment,

    nor sinners among the gathered righteous.

    For the Lord knows the way of the righteous,

    but the way of the ungodly will perish.”


    You see how he pointed to the water and the cross together. This is what it means: Blessed are those who put their hope in the cross and go down into the water. The words “at the proper time” speak of the future reward: “Then,” he says, “I will repay.” But what does he say about the present? “Its leaves will not fall.” He means that every word you speak with faith and love will lead many people to turn to God and have hope.


    Again, another prophet says, “The land of Jacob was honored above the whole earth.” By this he means that God honors the vessel of his Spirit.


    What does he say next? “A river flowed from the right side, and beautiful trees grew beside it. Whoever eats from them will live forever.”


    He says this because we go down into the water burdened with sin and uncleanness. We rise from it bearing fruit in our hearts, with reverent fear and hope fixed on Jesus in spirit. “Whoever eats from them will live forever.” He means: “Whoever hears these words and believes will live forever.”'
