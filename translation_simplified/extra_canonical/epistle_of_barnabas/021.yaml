translation:
  language: en
  text: 'Therefore, it is good to learn the Lord’s commands written above and to live by them. Whoever does these things will receive glory in God’s kingdom. But whoever chooses the opposite will perish along with what they have done. This is why there is resurrection and why people receive what their deeds deserve.


    I urge those of you in higher positions: if you are willing to receive good advice from me, keep among you people whom you can help. Do not fail to do this.


    The day is near when everything will be destroyed together with the Evil One. The Lord is near, and he is bringing his reward.


    Again and again I urge you: guide one another with good laws. Give yourselves faithful counsel. Remove all hypocrisy from among you.


    May God, the Lord of the whole world, give you wisdom, sound judgment, learning, knowledge of his commands, and patience.


    Let God teach you. Carefully seek what the Lord requires of you, and act so that you may be found ready on the day of judgment.


    If you remember what is good, remember me too as you put these things into practice. Then my desire and careful work may accomplish something good. I urge you to grant me this favor.


    As long as the good vessel of your body remains with you, do not neglect any of these things. Keep searching them out, and obey every command, for they deserve obedience.


    That is why I was so eager to write as much as I could, so that I might bring you joy. Farewell, children of love and peace. May the Lord of glory and of every grace be with your spirit.'
