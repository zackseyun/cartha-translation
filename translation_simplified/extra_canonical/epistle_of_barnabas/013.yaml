translation:
  language: en
  text: 'Now let us consider which people receives the inheritance: this people or the people who came first. Does the covenant apply to us or to them?


    Listen to what Scripture says about these peoples: “Isaac prayed for his wife Rebekah because she could not have children, and she became pregnant. Rebekah then went to ask the Lord about this. The Lord told her, ‘Two nations are in your womb, and two peoples are within you. One people will overcome the other, and the greater will serve the lesser.’”


    You should understand what Isaac and Rebekah signify here, and how their story shows that one people is greater than the other.


    In another prophecy, Jacob speaks more plainly to his son Joseph: “Look, the Lord has allowed me to see your face again. Bring me your sons so that I may bless them.”


    Joseph brought Ephraim and Manasseh to him. He wanted Manasseh to be blessed because Manasseh was older, so Joseph placed him at Jacob’s right hand. But through the Spirit Jacob saw in this a pattern of the people who would come later. What does Scripture say? “Jacob crossed his hands. He placed his right hand on the head of Ephraim, the second and younger son, and blessed him. Joseph said to Jacob, ‘Move your right hand to Manasseh’s head, because he is my firstborn son.’ Jacob answered, ‘I know, my son, I know. But the greater will serve the lesser. Manasseh will also be blessed.’”


    Notice in which of these cases God appointed this people to come first and inherit the covenant.


    God also revealed this through Abraham, completing our understanding. What did God say to Abraham when Abraham alone believed and was counted righteous? “Look, Abraham, I have made you the father of nations who believe in God without being circumcised.”'
