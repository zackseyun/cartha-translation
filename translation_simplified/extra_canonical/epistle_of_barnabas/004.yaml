translation:
  language: en
  text: 'Therefore, we must carefully examine our own time and seek what has power to save us. Let us completely avoid every lawless deed, so that lawlessness does not overpower us. Let us reject the error of this present age, so that we may receive love in the age to come.


    We must not let ourselves become comfortable keeping company with sinners and wicked people, or we may become like them.


    The final offense is near. Scripture speaks about it, as Enoch says. The Master has shortened the appointed times and days so that his beloved people may hurry to receive their inheritance.


    The prophet also says, “Ten rulers will reign over the earth. After them another king will arise, and he will bring three of those kings down together.”


    Daniel speaks about the same thing: “I saw the fourth beast. It was wicked, strong, and harder to control than any other beast on earth. Ten horns rose from it. Then a little horn, an outgrowth, rose among them and brought three of the great horns down together.”


    You must understand this. I ask one more thing of you as one of your own, because I love each of you more than my own life: watch yourselves now. Do not become like those who keep adding sin to sin while claiming that our covenant still belongs to them also.


    The covenant is ours, but they lost it forever just after Moses received it. Scripture says, “Moses remained on the mountain, fasting for forty days and forty nights. He received the covenant from the Lord: stone tablets written by the finger of the Lord’s hand.”


    But they lost the covenant when they turned to idols. The Lord says, “Moses, Moses, go down quickly! Your people, whom you brought out of Egypt, have acted lawlessly.” Moses understood and threw the two tablets from his hands. Their covenant was shattered, so that the covenant of the beloved Jesus might be sealed on our hearts in the hope that springs from faith in him.


    I would gladly write much more. I do not write as a teacher, but as someone who loves you and does not want you to miss what we possess. I have been eager to write because I am your devoted servant. Therefore, let us remain watchful in these last days. All the time we have spent in faith will do us no good unless we now resist the lawlessness and coming offenses as God’s sons should. Then the Black One will not gain an entrance among us.


    Let us flee from every empty pursuit and completely hate the deeds of the evil way. Do not withdraw and live by yourselves as though you were already righteous. Instead, gather together and consider the good of everyone.


    Scripture says, “How terrible it will be for those who think themselves wise and consider themselves understanding!” Let us become spiritual people and a temple made complete for God. As far as we are able, let us train ourselves to fear God and strive to obey his commandments, so that we may rejoice in his rulings.


    The Lord judges the world without favoritism. Each person will receive what their deeds deserve. If someone is good, that person’s righteousness will go ahead on the way. If someone is evil, repayment for that evil is waiting ahead.


    We must not grow careless merely because we have been called. Otherwise, we may sleep on in our sins, and the prince of evil may gain power over us and drive us out of the Lord’s kingdom.


    My brothers, understand this also: although so many signs and wonders were performed among Israel, they were still abandoned. Therefore, let us be careful that we are not found among those described by Scripture: “Many are called, but few are chosen.”'
