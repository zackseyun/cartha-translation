  language: en
  text: 'I have done my best to explain everything to you plainly. I sincerely hope that I have left out nothing [about salvation and so failed to accomplish what I wanted].


    If I wrote to you about present or future things, you would not understand them because they are given in parables. That is enough about this subject.'
