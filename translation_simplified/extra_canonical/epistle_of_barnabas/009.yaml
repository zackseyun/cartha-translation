translation:
  language: en
  text: 'Furthermore, when he speaks about ears, he says that God circumcised our hearts. The Lord says through the prophet, “They listened to me with their ears.” Again he says, “Those far away will hear with their ears and understand what I have done.” And the Lord says, “Circumcise your hearts.”


    Again he says, “Listen, Israel, for this is what the Lord your God says: Whoever wants to live forever must listen to the voice of my servant.” Again he says, “Listen, heaven, and pay attention, earth, for the Lord has spoken these things as a testimony.” Again he says, “Listen to the Lord’s words, you rulers of this people.” And again, “Listen, my children, to the voice of one crying out in the wilderness.” Thus God circumcised our ears so that we would hear the word and believe.


    But the physical circumcision in which they put their confidence has been abolished. For he said that a circumcision that is not physical should be practiced. Yet they disobeyed, because an evil angel taught them cleverness.


    He says to them, “This is what the Lord your God says”—this is how I find the command—“Do not sow among thorns; be circumcised for your Lord.” What else does he say? “Cut away the hardness of your heart, and then you will no longer be stubborn.” Consider this also: “Look,” says the Lord, “all the Gentiles are uncircumcised in their flesh, but this people is uncircumcised in heart.”


    But you may say, “The people truly received circumcision as a sign that they belong to the covenant.” No, because every Syrian and Arabian is also circumcised, as are all the priests of idols. Do all of them belong to the covenant too? The Egyptians are also among those who practice circumcision.


    Therefore, beloved children, learn this fully: Abraham, who first established circumcision, was looking ahead in the spirit to Jesus. When he circumcised his household, he had received symbolic instruction through three letters.


    For Scripture says, “Abraham circumcised eighteen men of his household and three hundred.” What knowledge had he received? Notice that Scripture gives eighteen first and then, separately, three hundred. In the Greek system of writing numbers, “I” stands for ten and “H” for eight. Together, “IH” points to JESUS (IHSOYS). The letter “T” stands for three hundred, and its shape points to the cross through which grace would come. In this way, the first two letters reveal Jesus, and the remaining letter reveals the cross.


    The one who placed the gift of his covenant within us knows this: no one has ever learned from me a truer teaching. And I know that you are worthy.'
