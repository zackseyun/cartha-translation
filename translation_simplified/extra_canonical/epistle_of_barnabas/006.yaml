  language: en
  text: 'When he gave the command, what did he say?


    “Who wants to dispute with me? Let him confront me. Who wants to take me to court? Let him approach the servant of the Lord.


    Woe to you! You will all wear out like a garment, and moths will eat you up.”


    The prophet also spoke of him as a hard stone appointed to crush, saying, “Look! I will place in the fountains of Zion a very precious and chosen stone, an honored chief cornerstone.”


    And what does he say next? “Whoever puts his hope in him will live forever.” Does this mean that we put our hope in a stone? Certainly not! Rather, the Lord made his flesh strong. For he says, “He made me like a hard rock.”


    The prophet also says, “The stone the builders rejected has become the head of the corner.” And again, “This is the great and wonderful day the Lord has made.”


    I am writing plainly so that you may understand, though I am like refuse compared with the love you show me.


    What else does the prophet say? “A crowd of evildoers gathered around me. They surrounded me like bees around a honeycomb.” He also says, “They cast lots for my garment.”


    Because he was going to appear in human flesh and suffer, his suffering was revealed beforehand. The prophet says about Israel, “Woe to them! They have made an evil plan against themselves. They say, ‘Let us tie up the righteous one, because he is useless to us.’”


    And what does Moses, the other prophet, say to them? “This is what the Lord God says: Enter the good land that the Lord swore to give Abraham, Isaac, and Jacob. Take possession of that land flowing with milk and honey.”


    But what does knowledge say? Understand this: Put your hope in Jesus, who was going to appear to you in human flesh. A human being is earth that suffers, for Adam was created from the surface of the earth.


    So what does he mean by “the good land, a land flowing with milk and honey”? Brothers, blessed is our Lord, who has given us wisdom and understanding of his hidden truths. The prophet is speaking a parable about the Lord. Only a person who is wise, discerning, and loves the Lord will understand it.


    The Lord made us new by forgiving our sins. He made us into a new kind of people, giving us the souls of children, as though he were creating us again.


    Scripture speaks about us when God says to the Son, “Let us make humanity in our image and likeness. Let them rule over the animals of the earth, the birds of heaven, and the fish of the sea.” When the Lord saw the beautiful creation of humanity, he said, “Increase, multiply, and fill the earth.” These words refer to the Son.


    I will show you again how the Lord speaks about us. At the end he made a second creation, for the Lord says, “Look! I am making the last things like the first.” This is why the prophet announced, “Enter a land flowing with milk and honey, and rule over it.”


    So we have been created anew. As the Lord says through another prophet, “Look! I will remove their hearts of stone”—that is, the hearts of those whom the Spirit of the Lord foresaw—“and I will put hearts of flesh within them.” For the Lord himself was going to appear in human flesh and live in us.


    Brothers, our hearts are a holy dwelling place for the Lord.


    The Lord also says, “How shall I appear before the Lord my God and be glorified? I will confess you among my brothers and sing to you among the gathered saints.” Therefore, we are the people he brought into the good land.


    What, then, do the milk and honey mean? A young child is first kept alive by honey and then by milk. In the same way, faith in the promise and the word keep us alive. We will live and rule over the earth.


    Earlier we quoted, “Let them increase and multiply and rule over the fish.” But who can now rule over the animals, the fish, and the birds of heaven? To rule means to have power—to give commands and exercise dominion.


    Since this is not happening now, he was surely speaking to us about the age to come. Then we will be made perfect and become heirs of the Lord’s covenant.'
