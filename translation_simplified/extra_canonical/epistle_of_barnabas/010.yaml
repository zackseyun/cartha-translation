  language: en
  text: 'Moses said, “You shall not eat the pig,[a] the eagle, the falcon, the crow, or any fish without scales.” He understood these instructions as three ordinances.


    He also says in Deuteronomy, “I will establish my ordinances as a covenant with this people.” Therefore, God’s command was not a prohibition against eating these animals. Moses was speaking spiritually, using these food laws to give moral instruction.


    This is why he mentioned the pig. He meant, “Do not join yourself to people who are like pigs.” When such people live in luxury, they forget the Lord. When they are in need, they acknowledge him. In the same way, a pig pays no attention to its master while it is eating. When it is hungry, it cries out; once it is fed, it becomes silent again.


    Moses also said, “You shall not eat the eagle, falcon, kite, or crow.” He meant, “Do not join yourself to such people or become like them.” They will not work hard to provide for themselves. Instead, they lawlessly seize what belongs to others. They appear innocent while watching for someone to rob. In the same way, these birds do not obtain their own food but sit waiting to devour what belongs to others. Their behavior is destructive and evil.


    He also said, “You shall not eat the lamprey, octopus, or cuttlefish.” He meant, “Do not become like people who are utterly wicked and already condemned to death.” These creatures were regarded as cursed because they swim in the depths. Unlike other fish, they do not swim near the surface but live on the bottom of the deep sea.


    He also said, “You shall not eat the hare.” Why? He meant, “Do not sexually corrupt boys or become like those who do.” This was based on the belief that each year a hare develops another opening in its body, so that the number of openings corresponds to its age.[b]


    Again he said, “You shall not eat the hyena.” He meant, “Do not commit adultery or sexual immorality, and do not become like those who do.” Why? This was based on the belief that the hyena changes its sex from year to year, being male at one time and female at another.[b]


    He also rejected the weasel, and with good reason. He meant, “Do not become like those whom we hear about committing sexual impurity with their mouths. Do not join yourself to impure women who do the same.” This was based on the belief that the weasel conceives through its mouth.[b]


    Thus Moses received three ordinances concerning food and spoke them with a spiritual meaning. But the people followed their bodily desires and understood the ordinances as though they referred to eating.


    David also understood these same three ordinances when he said, “Blessed is the man who has not followed the counsel of the ungodly”—like the fish that descend through darkness into the depths—“and has not stood in the path of sinners”—like people who claim to fear the Lord but sin like pigs—“and has not sat in the seat of destroyers”—like birds sitting and waiting for prey. You now have the complete lesson about food.


    Moses also says, “You may eat every animal that has a divided hoof and chews the cud.” What does this mean? The one who receives food recognizes the one who provided it and rejoices in him after being refreshed. Moses spoke well when he gave attention to the commandment.


    What, then, does it mean? Join yourself to those who fear the Lord. They reflect in their hearts on the meaning of the word they have received. They proclaim the Lord’s ordinances and obey them. They know that meditation is joyful work, and they chew over the Lord’s word as an animal chews the cud.


    But why must the animal have a divided hoof? Because a righteous person walks in this present world while also looking forward to the holy world to come. You see how wise Moses was as a lawgiver.


    But how could the people have perceived or understood these things? We have rightly understood the commandments and now explain them as the Lord intended. For this purpose, he circumcised our ears and hearts—he made us able to hear and understand these things.'
