translation:
  language: en
  text: 'Yes, this is true. But what about the covenant God swore to give to the people, as he had promised their ancestors? Let us see whether he actually gave it. He did give it, but the people were not worthy to receive it because of their sins.


    For the prophet says, “Moses fasted on Mount Sinai for forty days and forty nights so that he might receive the Lord’s covenant and give it to the people. Moses received from the Lord the two tablets, written in the Spirit by the finger of the Lord’s hand.” Then Moses took the tablets and brought them down to give them to the people.


    But the Lord said to Moses, “Moses, Moses, go down quickly! Your people, whom you led out of Egypt, have acted wickedly.” Moses saw that they had once again made metal idols for themselves. So he threw the tablets from his hands, and the tablets of the Lord’s covenant shattered.


    Moses received the covenant, but the people were not worthy of it. How, then, did we receive it? Pay attention: Moses received it as a servant, but the Lord himself gave it to us so that we might become the people who belong to him as his inheritance. In doing so, he patiently endured for our sake.


    The Lord was revealed so that, at the same time, they might be brought to completion in their sins and we might receive the covenant through the one who inherited it—the Lord Jesus. He had been prepared beforehand for this purpose. He appeared in person to rescue our hearts from darkness. Our hearts had already been handed over to death and enslaved by sinful error. Through the word, he established the covenant within us.


    For Scripture tells how the Father commands him to rescue us from darkness and prepare a holy people for himself.


    Therefore the prophet says,


    “I, the Lord your God, called you in righteousness.

    I will take hold of your hand and strengthen you.

    I have given you as a covenant for the race

    and as a light to the Gentiles,

    to open blind eyes,

    to free prisoners from their chains,

    and to bring those who sit in darkness out of prison.”


    From this we understand what we were rescued from.


    Again the prophet says,


    “Look! I have appointed you as a light to the Gentiles,

    so that you may bring salvation to the ends of the earth.”


    This is what the Lord, the God who rescued you, says.


    Again the prophet says,


    “The Spirit of the Lord is upon me,

    because he anointed me to proclaim good news to the humble.

    He sent me to heal the brokenhearted,

    to announce freedom to captives

    and restored sight to the blind,

    to proclaim the Lord’s year of favor

    and the day when he repays what is due,

    and to comfort all who mourn.”'
