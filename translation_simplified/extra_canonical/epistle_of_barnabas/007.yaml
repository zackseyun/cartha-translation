translation:
  language: en
  text: 'Understand this, then, children of joy: the good Lord showed us everything beforehand, so that we would know whom to thank and praise in every situation.


    The Son of God is Lord and will judge the living and the dead. If he suffered so that his wound might give us life, we should believe that the Son of God could not have suffered except for our sake.


    When he was crucified, he was also given vinegar and gall to drink. Listen to how the temple priests revealed this matter. Scripture gives this command: “Whoever does not keep the fast will surely die.” The Lord was about to offer his own body—the vessel of his Spirit—as a sacrifice for our sins. So he commanded that the earlier symbol of Isaac, who was offered on the altar, should also be fulfilled.


    What does he say through the prophet? “Let them eat from the goat offered during the fast for all their sins.” Pay close attention: “Only the priests may eat all its entrails, unwashed, with vinegar.”


    Why? “You will give me gall mixed with vinegar to drink when I offer my flesh for the sins of my new people. Therefore, only you may eat while the people fast and mourn in sackcloth and ashes.” This showed that he had to suffer at their hands.


    Pay attention to the commands he gave: “Take two fine-looking goats that resemble each other and offer them. The priest must take one as a whole burnt offering for sins.”


    But what must they do with the other goat? “That one is accursed,” he says. Notice how it becomes a symbol of Jesus.


    “All of you must spit on it and jab it. Tie scarlet wool around its head, and then send it into the wilderness.” After this is done, the man who leads the goat into the wilderness removes the wool and puts it on a branch of the plant called Rachia.[a] We are accustomed to eating its shoots when we find them in the countryside. This thornbush alone has such sweet fruit.


    What does this mean? Pay attention. One goat is offered at the altar, while the other is accursed. Yet the accursed goat is also crowned. On that day they will see him with a long scarlet robe around his flesh and say, “Is this not the one we once crucified, despised, and spat on? He truly is the one who said then that he was the Son of God.”


    How, then, is he like the goat? The goats had to be fine-looking and alike so that, when they see him coming, they will be astonished by the resemblance. This, then, is a symbol of Jesus, who was going to suffer.


    But what does it mean that they place the wool among the thorns? It presents the church with a symbol of Jesus. Anyone who wanted to take away the scarlet wool had to endure much because the thorns were so harsh. Only through suffering could that person overcome them. Thus he says, “Those who desire to see me and attain my kingdom must take hold of me through suffering and distress.”'
