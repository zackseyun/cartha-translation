translation:
  language: en
  text: 'Since the days are evil and the Active One[a] himself holds authority, we must watch ourselves carefully and seek to know the Lord’s commands.


    Fear and patience support our faith, while endurance and self-control stand beside us. When these qualities remain in a pure spirit devoted to the Lord, wisdom, understanding, learning, and knowledge rejoice with them.


    Through all the prophets, God has made it clear that he does not desire sacrifices, whole burnt offerings, or other gifts. At one time he said:


    “What use are your many sacrifices to me?” says the Lord. “I have had enough of whole burnt offerings. I do not desire the fat of lambs or the blood of bulls and goats, even when you come to appear before me. Who required these things from you? Stop trampling through my courtyard. Bringing fine flour is useless, and incense is detestable to me. I cannot endure your New Moon festivals and Sabbaths.”


    Therefore, he set these things aside so that the new law of our Lord Jesus Christ, free from a yoke of compulsion, might have an offering not made by human hands.


    Again he says to them, “When your ancestors left Egypt, did I command them to bring me whole burnt offerings and sacrifices?


    “No. This is what I commanded them: None of you should hold an evil grudge against your neighbor, and you should not take pleasure in swearing falsely.”


    If we have understanding, we should recognize what our good Father intends. He speaks to us because he does not want us to go astray as they did. Instead, he wants us to seek the way to approach him.


    This is what he says to us: “The sacrifice offered to God is a broken heart. A heart that glorifies its Maker is a sweet-smelling offering to the Lord.” Therefore, brothers and sisters, we must learn clearly what concerns our salvation. Otherwise, the Evil One may bring error into us and throw us away from the life that is ours.'
