translation:
  language: en
  text: 'In the same way, he gives another prophetic picture of the cross. The prophet says, “When will these things happen?” The Lord answers, “When a tree is bent down and then stands upright, and when blood drips from a tree.” Once again, you are being taught about the cross and the one who was to be crucified.


    He also speaks through Moses. When a foreign nation attacked Israel, God wanted to remind the Israelites that their sins had brought them under the sentence of death. The Spirit spoke to Moses’ heart and told him to make a sign that pointed ahead to the cross and to the one who would suffer. For unless they placed their hope in him, their enemies would continue to wage war against them. So, in the middle of the battle, Moses piled weapons on top of one another. He stood higher than everyone else and stretched out his hands. Then Israel began to win again. But whenever he lowered his hands, the Israelites were killed by the sword.


    Why did this happen? It was to teach them that they could not be saved unless they placed their hope in him.


    Again, he says through another prophet, “All day long I have stretched out my hands to a disobedient people who spoke against my righteous way.”


    Moses also gives a sign that points ahead to Jesus: Jesus must suffer, but he—the one they will think they have destroyed—will bring the dead to life. This was pictured when Israel was dying. The Lord sent all kinds of snakes to bite the people, and they died. Sin had first come through the serpent in the time of Eve. So the Lord showed the Israelites that their own sin had handed them over to the suffering of death.


    Moses had commanded, “You shall not make a cast-metal or carved image to be your God.” Yet Moses himself made such an image to show them a sign that pointed ahead to Jesus. He made a bronze serpent, set it up where everyone could see it, and called the people together.


    When they gathered, they begged Moses to pray for them so that they might be healed. Moses told them, “Whenever any of you is bitten, come to the serpent placed on the tree. Believe and hope that this serpent, though itself dead, can give life, and you will immediately be saved.” They did so. Here again you see the glory of Jesus: all things are in him and for him.


    What did Moses say to Jesus—that is, Joshua son of Nun—when he gave him this name? Moses spoke as a prophet so that all the people would listen to Joshua alone, because the Father reveals everything concerning his Son Jesus.


    When Moses sent Joshua son of Nun to spy out the land, he gave him this name and said, “Take a book in your hands and write what the Lord says: in the last days, the Son of God will tear out the whole house of Amalek by the roots.”


    See once again: this is Jesus—not a son of man, but the Son of God—and he was revealed in the flesh through a symbolic figure. People will say that Christ is the son of David. But David himself, being afraid and recognizing the error of sinners, prophesies: “The Lord said to my Lord, ‘Sit at my right hand until I put your enemies beneath your feet like a footstool.’”


    Isaiah also says, “The Lord said to my Christ, the Lord, whose right hand I have taken hold of: ‘The nations will listen to him, and I will break the power of kings.’” Notice that David calls him Lord, not Son.'
