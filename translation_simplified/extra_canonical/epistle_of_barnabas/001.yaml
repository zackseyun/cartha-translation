translation:
  language: en
  text: 'I greet you in peace, sons and daughters, in the name of the Lord who loved us.


    God’s ordinances for you are great and abundant. I overflow with joy because I see your blessed and glorious spiritual life. The grace of the spiritual gift you received has taken deep root in you.


    So I have even more reason to rejoice and to hope for salvation, because I truly see that the Spirit has been poured out among you from the overflowing fountain of the Lord. I had long desired to see you, and what I saw filled me with amazement.


    I am convinced of this: when I spoke among you about many things, the Lord traveled with me along the way of righteousness. I therefore feel completely compelled to love you more than my own life, because great faith and love dwell in you through your hope in the life that comes from him.


    I wanted to share with you a small part of what I have received. Serving people with such spiritual life will itself be a reward for me. So I was eager to send you something small, so that alongside your faith you might also have complete knowledge.


    There are, then, three things the Lord has appointed: the hope of life, which is the beginning and the goal of our faith; righteousness, which is the beginning and the goal of judgment; and love expressed with joy and gladness, which bears witness to righteous deeds.


    Through his prophets, the Lord made known to us what belongs to the past and the present. He also gave us a first taste of what is still to come. As we see these things happening one by one, just as he said, we should offer a richer and greater offering in reverence for him. I will now set out a few things that can bring you joy in your present circumstances—not as a teacher, but as one of you.'
