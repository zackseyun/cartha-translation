translation:
  language: en
  text: 'Therefore, he speaks to them again about these matters:


    The Lord says, “Why do you fast for me and cry out so loudly today? This is not the fast I have chosen. It is not merely a person humbling himself. Even if you bend your neck like a hoop, wear sackcloth, and lie down in ashes, you still cannot call that an acceptable fast.


    “But to us he says, ‘Look! This is the fast I have chosen,’ says the Lord: ‘Undo every bond of wickedness. Loosen the tight cords of forced agreements. Set free those who have been crushed, and tear apart every unjust bond. Share your bread with the hungry. When you see someone without clothing, clothe him. Bring the homeless into your house. When you see a lowly person, do not despise him. Do not despise anyone in your own household or any of your own descendants.


    “‘Then your light will break out like the morning, and your healing will quickly appear. Righteousness will go ahead of you, and God’s glory will surround you.


    “‘Then you will call out, and God will answer. While you are still speaking, he will say, “Look, I am here.” This will happen if you remove oppression from among you, stop pointing accusing fingers, and stop speaking complaints; if you wholeheartedly share your bread with the hungry and show compassion to the person who has been brought low.’”


    For this reason, my brothers, the patient one knew beforehand that the people he had prepared in his beloved one would believe simply. So he revealed all these things to us in advance, so that we would not be like inexperienced sailors who wreck their ship on the law of those people.'
