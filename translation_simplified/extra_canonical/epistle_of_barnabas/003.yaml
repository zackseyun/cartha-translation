  preserved_meaning: The three distinct wrongs of oppression, hostile accusation, and complaining speech remain separate.
  reasoning_layer_used: Immediate quotation context and POB wording
  rationale: The wording explains difficult images without adding the unsupported idea of bitterness.
- pob_phrase: as novices, might not shipwreck ourselves on their law
  simplified_phrase: like inexperienced sailors who wreck their ship on the law of those people
  preserved_meaning: The warning retains both the readers’ inexperience and the shipwreck image.
  reasoning_layer_used: POB controlling text
  rationale: Making the implied sailors explicit clarifies the metaphor without identifying the law more precisely.
