translation:
  language: en
  text: 'This, then, is the way of light. Anyone who wants to travel on this way to the place appointed for them must be eager to do what is right. Here is the knowledge given to us so that we may walk in this way:


    Love the One who made you. Fear the One who created you. Glorify the One who rescued you from death. Be sincere in heart and rich in spirit. Do not join those who walk the way of death. Hate everything that displeases God, and hate all hypocrisy. Never abandon the Lord’s commandments.


    Do not exalt yourself. Instead, be humble in everything. Do not seek glory for yourself. Do not plot evil against your neighbor. Do not let presumption enter your heart.


    Do not commit sexual immorality. Do not commit adultery. Do not sexually exploit boys. Do not speak God’s word where people are unclean.[a] Do not show favoritism when correcting someone for sin. Be gentle. Be quiet. Stand in awe of the words you have heard. Do not hold a grudge against your brother.


    Do not waver over whether something will happen or not.[b] Do not misuse the name of the Lord. Love your neighbor more than your own life. Do not kill a child by abortion or after birth. Do not withhold your hand from your son or daughter; teach them from childhood to fear God.


    Do not covet your neighbor’s possessions or be greedy for profit. Do not attach yourself to the high and mighty. Instead, walk with those who are humble and righteous. Receive whatever happens to you as good, knowing that nothing happens apart from God. Do not be divided in your mind or deceitful in your speech.


    Obey your masters as though they represented God, with humble respect and fear. Do not treat an enslaved man or woman harshly when giving orders, though they hope in the same God. Otherwise, they may stop fearing the God who rules over you both. He did not come to call people according to their status, but to call those whom the Spirit has prepared.


    Share everything with your neighbor, and do not claim that anything belongs to you alone. If you share together in what lasts forever, how much more should you share things that do not last? Do not speak rashly, for the mouth can become a deadly trap. As far as you are able, keep yourself pure for the sake of your soul.


    Do not hold out your hands eagerly to receive and then pull them back when it is time to give. Love dearly—as you guard your own eyesight—everyone who teaches you the word of the Lord.


    Remember the day of judgment night and day. Every day seek out God’s holy people, either laboring with words, going to encourage them, and considering how you may save souls by your words, or working with your hands as a ransom for your sins.[c]


    Do not hesitate to give or complain when you give. Know the good Master who will pay your reward. Guard what you have received, neither adding to it nor taking away from it. Completely hate the Evil One. Judge fairly.


    Do not cause division. Instead, bring together those who are quarreling and make peace between them. Confess your sins. Do not go to prayer with an evil conscience.


    This is the way of light.'
