translation:
  language: en
  text: 'What do you think this symbolic pattern means? Israel was commanded to have men whose sins had reached their full measure offer a young cow, slaughter it, and burn it. Then children were to gather the ashes and put them in containers. They were to twist scarlet wool on a tree and use hyssop. Notice again the symbolic picture of the cross and the scarlet wool. Afterward, the children were to sprinkle each person so that the people could be purified from their sins.


    Understand how plainly this speaks to you. The calf represents Jesus. The sinful men who offer it represent those who handed Jesus over to be killed. After that, the men disappear from the picture; sinners receive no glory.


    The children who sprinkle the people represent those who preached to us about the forgiveness of sins and the cleansing of our hearts. There were twelve of them as a testimony to the tribes, because Israel has twelve tribes. Jesus gave them authority to preach the Gospel.


    But why are there three children who sprinkle? They are a testimony to Abraham, Isaac, and Jacob, because these three are mighty before God.


    Then the wool is placed on the tree. This means that Jesus’ kingdom is on the cross, and those who put their hope in him will live forever.


    Why are the wool and the hyssop used together? Because evil and foul days will come in his kingdom, and during those days we will be saved. A person who suffers bodily pain is healed through the foulness of the hyssop.


    To us, it is clear that these events happened for this reason. But their meaning was hidden from the people of Israel because they did not listen to the voice of the Lord.'
