translation:
  language: en
  text: 'Now let us turn to another lesson. There are two ways, each with its own teaching and power: the way of light and the way of darkness. There is a great difference between these two ways. God’s angels, who bring light, stand along one way; Satan’s angels stand along the other.


    The Lord rules from eternity past to eternity future. The other rules only during this present time of lawlessness.'
