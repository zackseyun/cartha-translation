  reasoning_layer_used: POB text and English witness
  rationale: The recast wording clearly connects teaching and power with each way.
- pob_phrase: The one is the Lord from all eternity and to all eternity, while the other is Lord of the present season of iniquity
  simplified_phrase: The Lord rules from eternity past to eternity future. The other rules only during this present time of lawlessness.
  preserved_meaning: The Lord’s eternal rule contrasts with the other ruler’s temporary authority during the current lawless time.
  reasoning_layer_used: POB text, English witness, and grounding review
  rationale: Short sentences preserve the contrast in authority and duration while retaining the bounded time of lawlessness.
