translation:
  language: en
  text: 'The Lord allowed his body to be handed over to decay for this purpose: so that our sins could be forgiven and we could be made clean through his sprinkled blood.


    Scripture speaks about him in passages that concern Israel and in passages that concern us. It says:


    “He was wounded because of your transgressions

    and crushed because of our sins.

    By his wounds we were healed.

    He was led like a sheep to be slaughtered,

    and like a lamb silent before its shearer.”


    Therefore, we should be deeply thankful to the Lord. He has revealed the past to us, given us wisdom for the present, and given us understanding about the future.


    Scripture also says, “The net is not spread for the birds unjustly.” This means that anyone who knows the righteous way but deliberately turns to the way of darkness will justly perish.


    Consider this also, my brothers. The Lord suffered for our souls even though he is Lord of the whole world. He is the one to whom God said when the world was founded, “Let us make humanity in our image and likeness.” How, then, could he endure suffering at human hands?


    Understand this: The prophets received grace from him and prophesied about him. But he himself suffered so that he might destroy death and reveal the resurrection of the dead. For this purpose, he had to appear in human flesh.


    At the same time, he would fulfill the promise made to the fathers and prepare a new people for himself. While he was on earth, he showed that after bringing about the resurrection, he himself would judge.


    What is more, he preached to Israel and taught them, performing many wonders and miracles. He loved Israel deeply.


    Then he chose his own apostles to proclaim his gospel. They were deeply sinful men, showing that he came to call sinners, not the righteous. In this way he revealed himself as the Son of God.


    If he had not come in human flesh, people could not have looked at him and been saved. After all, they cannot even look directly at the sun’s rays, though the sun will one day cease to exist and is only the work of his hands.


    Therefore, the Son of God came in human flesh to bring to completion the full record of sins committed by those who persecuted and killed his prophets.


    This is why he suffered. God says that they inflicted the wounds on his body: “When they strike their own shepherd, the sheep of the flock will be lost.”


    Yet he himself chose to suffer in this way, because he had to suffer on a tree. The prophet said about him:


    “Spare my soul from the sword,”


    and,


    “Pierce my flesh with nails,

    for gatherings of evildoers have risen against me.”


    Again he says:


    “Look, I have offered my back to be whipped

    and my cheeks to be struck,

    and I have set my face like hard rock.”'
