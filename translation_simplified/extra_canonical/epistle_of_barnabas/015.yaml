translation:
  language: en
  text: 'The Sabbath is also mentioned in the Ten Commandments, which God spoke to Moses face to face on Mount Sinai: “You must keep the Lord’s Sabbath holy with clean hands and a pure heart.”


    Elsewhere he says, “If my sons observe the Sabbath, I will show them mercy.”


    He also speaks about the Sabbath in the creation account: “God made everything with his hands in six days. He finished on the seventh day, rested on it, and made it holy.”


    Listen carefully, my children, to what this means: “He finished in six days.” This means that the Lord will bring everything to its end in six thousand years, because to him one day represents a thousand years. He himself confirms this to me by saying, “Look, a day of the Lord will be like a thousand years.” Therefore, my children, everything will come to its end in six days—that is, in six thousand years.


    “And he rested on the seventh day.” This means that his Son will come, bring the time of the Lawless One to an end, judge the ungodly, and change the sun, moon, and stars. Then he will truly rest on the seventh day.


    He also says, “You must keep it holy with clean hands and a pure heart.” So if we think that anyone—even someone with a pure heart—can now make holy the day God made holy, we are completely mistaken.


    Only afterward will we truly rest and make that day holy. This will happen when we have been made right with God and have received the promise, when wickedness is no more and the Lord has made everything new. Then we will be able to make the day holy, because God will first have made us holy.


    Finally, he says to them, “I cannot endure your new-moon festivals and your Sabbaths.” You see what he means: your present Sabbaths are not acceptable to me. What is acceptable is the Sabbath I have made. When I have brought everything to rest on that Sabbath, I will begin the eighth day—the beginning of another world.


    Therefore, we celebrate the eighth day with joy. On that day Jesus rose from the dead and, after being revealed, ascended into heaven.'
