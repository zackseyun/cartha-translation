translation:
  language: en
  text: 'But the way of the Black One is crooked and cursed. It leads to eternal death and punishment. Along this way are things that destroy human souls: idolatry, reckless behavior, arrogant displays of power, hypocrisy, double-mindedness, adultery, murder, robbery, pride, lawlessness, treachery, malice, stubbornness, witchcraft, magic, greed, and no fear of God.


    Those who follow this way persecute good people. They hate the truth and love lies. They do not recognize the reward of righteousness or hold firmly to what is good or to righteous judgment. They ignore widows and orphans. They keep watch for evil rather than fearing God. Gentleness and patience are far from them. They love worthless things and chase after repayment. They have no compassion for the poor and will not help those worn down by hard labor. They are quick to slander and do not acknowledge the One who made them. They murder children, corrupt God’s creatures, turn away from anyone in need, and oppress the afflicted. They defend the rich and judge the poor unjustly. They are sinful in everything.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: a way of eternal death with punishment wherein are the things that destroy men's souls
  simplified_phrase: It leads to eternal death and punishment. Along this way are things that destroy human souls
  preserved_meaning: The evil way ends in punished eternal death and contains soul-destroying practices.
  reasoning_layer_used: POB translation and immediate context
  rationale: Two direct sentences clarify both the destination and the contents of the way.
- pob_phrase: not cleaving to the good nor to the righteous judgment
  simplified_phrase: do not hold firmly to what is good or to righteous judgment
  preserved_meaning: They reject both goodness and righteous judgment as distinct objects of commitment.
  reasoning_layer_used: POB translation and grounding review
  rationale: Common wording removes the archaic verb while preserving the separate judgment element.
- pob_phrase: not toiling for him that is oppressed with toil
  simplified_phrase: will not help those worn down by hard labor
  preserved_meaning: They refuse effort on behalf of people burdened by exhausting work.
  reasoning_layer_used: English witness and immediate context
  rationale: The recast clearly identifies both the hardship and the refusal to help.
interpretive_expansions:
- pob_phrase: exhalation of power
  rendering: arrogant displays of power
  claim: Power is expressed outwardly in a proud and overbearing way.
  evidence:
