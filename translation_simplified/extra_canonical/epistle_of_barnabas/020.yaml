  - The English witness depicts power as something outwardly emitted.
  confidence: moderate
  alternatives_preserved:
  - exaltation of power
  - boasting in power
- pob_phrase: doubleness of heart
  rendering: double-mindedness
  claim: The vice involves an inwardly divided or duplicitous mind.
  evidence:
  - The phrase occurs in a moral list with hypocrisy and treachery.
  - This wording preserves a broader sense than allegiance alone.
  confidence: moderate
  alternatives_preserved:
  - duplicity
  - divided loyalties
