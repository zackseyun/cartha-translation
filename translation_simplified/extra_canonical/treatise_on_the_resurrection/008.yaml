translation:
  language: en
  text: 'Some people studying this question want to know whether people receive salvation immediately after leaving the body. No one should doubt this. [a] In fact, the visible parts of the body that are dead will not be saved. If they were, the living parts within them would rise.


    So what is the resurrection? It is the continuing revelation of those who have risen. If you remember reading in the Gospel that Elijah appeared with Moses beside him, do not think the resurrection is an illusion. It is not an illusion; it is real! Indeed, it would be more accurate to call the world an illusion than to call the resurrection an illusion. This resurrection has taken place through our Lord and Savior, Jesus Christ.'
