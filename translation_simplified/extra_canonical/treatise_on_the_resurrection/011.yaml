translation:
  language: en
  text: 'By the graciousness of my Lord Jesus Christ[a], I have received all of this. My children, I have taught you and your brothers and sisters about these things. I have left out nothing that could strengthen you. If anything I wrote while explaining the message is unclear, ask me, and I will explain it to you.


    Do not hesitate to share this with others among you, because it can be helpful.


    Many people are examining the questions I wrote to you about. May they have peace and grace.


    I send greetings to you and to everyone who loves you with the love of brothers and sisters.


    The Treatise on the Resurrection'
