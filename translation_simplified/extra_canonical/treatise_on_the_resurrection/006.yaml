translation:
  language: en
  text: 'What those who are saved have thought will not be lost. The minds of those who have known salvation will not perish either. So we were chosen for salvation and redemption. From the beginning, it was decided beforehand that we would not fall into the foolish thinking of those who do not know. Instead, we would enter the wisdom of those who know the truth. The truth they preserve cannot be lost and never will be.


    The system of the Fullness is strong. What broke away and became the world is weak. But the All remains secure. It did not come into being; it already existed.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The manuscript has a gap before “come into being,” so the wording here remains uncertain.
    reason: textual_variant
simplification_decisions:
- pob_phrase: What those who are saved have thought will not perish.
  simplified_phrase: What those who are saved have thought will not be lost.
  preserved_meaning: Their thoughts will not pass away or be destroyed.
  reasoning_layer_used: POB translation and English witness
  rationale: “Will not be lost” is natural English for the continued preservation of their thoughts.
- pob_phrase: because it was predetermined from the beginning
  simplified_phrase: From the beginning, it was decided beforehand
  preserved_meaning: Their salvation and path into wisdom were determined in advance.
  reasoning_layer_used: POB translation and English witness
  rationale: The clause is recast in ordinary English without weakening its claim of prior determination.
- pob_phrase: The All, however, is what is preserved.
  simplified_phrase: But the All remains secure.
  preserved_meaning: The reality designated as “the All” is preserved rather than lost.
  reasoning_layer_used: POB wording and source witness
  rationale: The technical title “the All” is retained while its passive construction is simplified.
