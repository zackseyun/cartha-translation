translation:
  language: en
  text: 'I know that I am giving my answer in complex language. Even so, the word of truth is not hard to understand. The answer came to light so that nothing would remain hidden and everything about existence would be revealed. This wiped out evil and revealed the chosen ones. All this flows from truth and spirit, and grace comes from truth.


    People do not consider you ignorant of this: the Savior swallowed up death by doing away with the perishable world. He transformed [it] into an imperishable age and raised himself up. Through the invisible, he swallowed up the visible. In this way, he prepared our way to immortality.'
  philosophy: optimal-equivalence
