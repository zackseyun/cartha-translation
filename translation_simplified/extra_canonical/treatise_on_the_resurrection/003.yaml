  reasoning_layer_used: POB translation and English witness
  rationale: The balanced academic construction becomes two direct actions without merging them.
- pob_phrase: All this is the emanation of truth and spirit, with grace coming from truth.
  simplified_phrase: All this flows from truth and spirit, and grace comes from truth.
  preserved_meaning: These events proceed from truth and spirit, while grace comes from truth.
  reasoning_layer_used: POB translation
  rationale: The common verb “flows” preserves the image of emanation without its technical wording.
- pob_phrase: People do not think that you are unaware that
  simplified_phrase: 'People do not consider you ignorant of this:'
