translation:
  language: en
  text: 'So, Rheginos, do not settle for partial truths. Do not live according to this flesh merely to agree with others. Instead, flee divisions and the things that bind you, and you will experience the resurrection now.


    What is mortal knows that it will die. Even if it lives for many years, it finally comes to that end. So why not consider yourself already raised and already arrived?


    If you possess the resurrection, why keep acting as if you will still die? You should know that you are already dead. You do not understand this because you have not been trained. Everyone should be trained in various ways. Then they will be released from this element[a], so that they will not fall into error, and they will receive again what was from the beginning.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Element” is retained because its precise meaning is unclear in the supplied English witness, and direct review of the Coptic is still pending.
    reason: source_note
