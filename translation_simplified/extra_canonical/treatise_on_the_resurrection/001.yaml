translation:
  language: en
  text: '[] My son Rheginos, some people want to learn about many things. They become absorbed in questions they cannot answer. If they manage to find answers, they tend to think they are very important. But I do not believe they have reached the word of truth. They seek only their own satisfaction. We, however, have received true satisfaction through our Savior, the Lord Christ. [] We received it when we came to know the truth and found rest in it.


    You have respectfully asked me for the correct understanding of the resurrection, so I am writing to tell you what is essential. Many people do not believe in the resurrection, but a few find it. Let us now discuss it.'
  philosophy: optimal-equivalence
