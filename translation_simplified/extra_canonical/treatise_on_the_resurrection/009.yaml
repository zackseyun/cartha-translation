translation:
  language: en
  text: 'But what am I telling you? Will those now alive die? How can they truly live when the world is an illusion? The rich become poor, and kings are brought down. Everything changes. The world is an illusion—if I am not overstating the matter.


    The resurrection, however, is not illusory or passing. It is the firm and lasting reality. It reveals what truly exists: the transfiguration of things and a transformation into what is new. For imperishability [will descend] upon what can perish. Light will pour down upon darkness and swallow it up. Then the Fullness will fill the Deficiency.[a] These are symbols and images of the resurrection. This brings about what is good.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Fullness” and “Deficiency” are retained as contrasting terms whose specialized sense is not made explicit here.
    reason: simplification_note
