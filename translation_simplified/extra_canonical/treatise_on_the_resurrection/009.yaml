  reasoning_layer_used: POB text and immediate contrast
  rationale: The rewrite makes the rhetorical question natural without resolving its paradox.
- pob_phrase: does not have that (illusory, passing) nature
  simplified_phrase: is not illusory or passing
  preserved_meaning: Resurrection differs from the world's unstable and temporary character.
  reasoning_layer_used: POB parenthetical clarification
  rationale: The parenthetical explanation becomes a direct statement in ordinary English.
- pob_phrase: because it is the reality that remains firm
  simplified_phrase: It is the firm and lasting reality.
  preserved_meaning: Resurrection is enduring reality rather than illusion.
  reasoning_layer_used: POB controlling translation
  rationale: A separate sentence makes the central contrast easier to follow.
