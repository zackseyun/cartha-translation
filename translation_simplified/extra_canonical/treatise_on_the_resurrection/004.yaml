translation:
  language: en
  text: Then, as the apostle truly said, “We suffered with him. We rose with him, and we went up to heaven with him.” While we live in this visible world, we wear it like clothing. We are rays of his light, and we remain with him until our light sets—that is, until we die in this life. Through him we are drawn to heaven, as rays are drawn by the sun, and nothing can hold us back. This is the spiritual resurrection, [] swallowing up the soul just as it swallows up the flesh.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: If we live visibly in this world, we wear this world.
  simplified_phrase: While we live in this visible world, we wear it like clothing.
  preserved_meaning: Life in the visible world is pictured as wearing the world.
  reasoning_layer_used: POB text and English witness
  rationale: The comparison makes the clothing image clear without replacing it.
- pob_phrase: We are his radiant beams, and we remain with him until our setting
  simplified_phrase: We are rays of his light, and we remain with him until our light sets
  preserved_meaning: Believers are pictured as Christ's rays whose setting represents death.
  reasoning_layer_used: POB text and immediate explanation
  rationale: Common words clarify the linked light and sunset images.
- pob_phrase: we ascended to heaven with him
  simplified_phrase: we went up to heaven with him
  preserved_meaning: The apostolic saying describes a shared ascent to heaven with him.
  reasoning_layer_used: POB text and English witness
  rationale: Went up expresses ascended in ordinary modern English.
interpretive_expansions:
- pob_phrase: we wear this world
  rendering: we wear it like clothing
  claim: The world is metaphorically pictured as something worn like a garment.
  evidence:
  - The verb “wear” supplies the clothing image in both POB and the English witness.
  confidence: high
  alternatives_preserved:
  - The image may imply more than temporary outward existence.
