translation:
  language: en
  text: 'However, some people do not believe because they cannot be persuaded. My son, that the dead will rise is a matter of faith, not a matter of argument.


    Some philosophers in this world do believe, so that at least they will rise. But no philosopher in this world should think that he can bring himself back to life from death. Through our faith, we know the Son of Man, and we believe that he rose from the dead. We declare of him, “He destroyed death.” For faith is great, and so are those who believe.'
