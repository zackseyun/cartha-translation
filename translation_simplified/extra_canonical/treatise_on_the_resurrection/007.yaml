translation:
  language: en
  text: 'So never doubt the resurrection, my son Rheginos. Before you entered this world, you did not live in flesh. Yet when you came here, you took on flesh.


    Why would you not take on flesh when you (return and) ascend into the aeon?[a] What is better than the flesh is what gives life. What came into being for your sake—does it not belong to you? And does not what belongs to you exist with you? Yet while you are in this world, what do you lack? This is what you have worked so hard to discover.


    Old age is the body’s afterbirth, and you are mortal. What you lack is a gain, because when you depart, you will not lose what is best. What is worse declines, but there is grace for it.


    So nothing can redeem us from this world. Yet we are the All,[b] and so we are saved. From beginning to end, we have obtained salvation. Let us think this way. Let us understand this way.'
  philosophy: optimal-equivalence
