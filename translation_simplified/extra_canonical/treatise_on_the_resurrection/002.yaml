translation:
  language: en
  text: 'How did the Lord preach while he lived in a human body, and after he revealed himself to be the Son of God? He lived here, where you now live, and spoke about the law that governs natural existence—though I call it “death.”


    Rheginos, the Son of God was also the Son of Man. He took both humanity and divinity upon himself. Therefore, as the Son of God, he could drive death away; and as the Son of Man, he brought about the restoration of the Fullness.[a] He could do this because he came from above as a seed of truth, before his lower structure came into existence.[b] Within that lower structure, many ruling powers and divine beings came into existence.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Fullness” is retained as a technical term in this work’s theological framework.
    reason: simplification_note
  - marker: b
    text: The word “lower” is supplied in the English witness; direct review of the Coptic is still pending.
    reason: source_note
