translation:
  language: en
  text: 'God had already planned everything in his mind together with his Son. In the past, he allowed us to follow our own uncontrolled desires and be led astray by pleasures and lusts. This was not because he delighted in our sins, but because he patiently endured them. He did not approve of that time of wickedness. Instead, he was bringing about the present time of righteousness. In that earlier time, our own actions showed that we were unworthy of life, so that now we might be made worthy by God’s goodness. It also became clear that we could not enter God’s kingdom by our own power, so that we might be enabled by his power.


    When our wickedness had fully run its course, it became completely clear that punishment and death were what it deserved. Then the time God had appointed came—the time for him to reveal his goodness and power. How great are God’s kindness and love! He did not hate us, reject us, or hold a grudge against us. Instead, he was patient and slow to anger. In compassion, he took our sins upon himself and gave his own Son as a ransom to set us free: the holy one for the lawless, the innocent for the evil, the righteous for the unrighteous, the one beyond decay for those subject to decay, and the immortal one for mortals.


    What else but his righteousness could have covered our sins?


    How could we, who were lawless and ungodly, be made right with God except through the Son of God?


    What a wonderful exchange! What a work beyond understanding! What unexpected blessings! The wickedness of many was hidden in the one Righteous Man, and the righteousness of the One made many wicked people right with God.


    In the past, God showed that our human nature was unable to obtain life. Now he has revealed a Savior who can save even those who have no ability of their own. For both reasons, God wanted us to trust in his goodness and to look to him as the one who nurtures us, our Father, teacher, counselor, healer, our mind, light, honor, glory, strength, and life.'
