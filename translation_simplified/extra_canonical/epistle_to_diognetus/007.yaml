translation:
  language: en
  text: 'As I said, what was entrusted to them was not discovered on earth. They would not guard a merely human invention so carefully, nor were they entrusted with secret teachings devised by human beings.


    Instead, the almighty Creator of the universe—the invisible God himself—sent truth and holy teaching down from heaven and planted them among humanity. This teaching surpasses human understanding, and he firmly established it in their hearts. He did not do this by sending some subordinate being, an angel, a ruler, someone who governs earthly affairs, or even someone entrusted with authority in heaven. He sent the very Maker and Creator of the universe.


    Through him God made the heavens and set the sea within its proper boundaries. Every element faithfully observes his mysteries. From him the sun received the course it must follow each day. The moon obeys him when he commands it to shine at night, and the stars obey him as they follow the moon’s course. Through him everything is ordered, given its limits, and placed under authority: heaven and everything in it, earth and everything on it, the sea and everything in it, fire, air, the abyss, everything in the heights and in the depths, and everything between them. This is the one God sent to humanity.


    Do you think he sent him to establish a dominion and fill people with fear and terror?


    No. He sent him with gentleness and meekness, as a king might send his son, who is also a king. He sent him as God. He sent him as a man to humanity. He sent him as Savior, persuading rather than forcing, for force is not an attribute of God.


    He sent him to call people, not to persecute them. He sent him in love, not in judgment.


    But he will send him in judgment, and who will be able to endure his presence?


    … Do you not see them thrown to wild animals to make them deny the Lord, yet they are not defeated?


    Do you not see that the more they are punished, the more others increase in number?


    These cannot be merely human works. They reveal God’s power and prove that he is present.'
