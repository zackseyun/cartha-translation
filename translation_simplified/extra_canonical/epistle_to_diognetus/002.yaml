translation:
  language: en
  text: 'Come, then, clear your mind of the assumptions that fill it. Break free from the habit that leads you astray, and begin again as if you were a new person, ready to hear a new account, just as you yourself said. Look carefully at those you call gods. Do not look only with your eyes; use your understanding to consider what they are made of and what form they have.


    Is not one made of stone, like the stones we walk on? Another is bronze, no better than the containers made for our everyday use. Another is wood that has already begun to rot. Another is silver and needs someone to guard it from thieves. Another is iron eaten away by rust. Still another is pottery, no more beautiful than an object used for the most degrading purpose.


    Are they not all made from materials that perish? Were they not fashioned with iron and fire? A sculptor made one, a bronze-worker another, a silversmith another, and a potter another. Before these craftspeople shaped them, could not the same materials have been formed into ordinary household objects? And could not ordinary objects made from those materials be shaped into gods by the same craftspeople?


    Could not human hands turn the things you now worship back into ordinary objects? Are they not all deaf and blind, without life or feeling, unable to move? Do they not all rot and decay?


    You call these things gods. You serve them as servants and worship them, and in the end you become entirely like them.


    That is why you hate Christians: they do not consider these things to be gods.


    Yet do not you who honor and worship them show even greater contempt for them? You leave the gods of stone and pottery unguarded, but you lock up the silver and gold ones at night and guard them during the day so that no one steals them. In this way, you mock and insult them.


    Consider also the honors you think you give them. If they can feel what is done to them, these honors actually torment them. But if they cannot feel anything, you insult them by trying to appease them with the blood and fat of sacrificed animals.


    Let one of you receive such treatment and allow these things to be done to him. No person would willingly endure such punishment, because a person has feeling and reason. A stone endures it only because it has no feeling. By your actions, then, you show that it has no feeling.


    I could say much more about why Christians refuse to be servants to gods like these. But if anyone thinks that what I have said is not enough, I see no reason to say more.'
