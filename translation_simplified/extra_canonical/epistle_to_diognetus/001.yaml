translation:
  language: en
  text: 'Most honored Diognetus, I see how eager you are to understand the Christian religion. You have asked careful and specific questions: What God do Christians trust, and how do they worship him? Why do they all disregard the world and scorn death? Why do they reject the gods of the Greeks and refuse to follow the superstition of the Jews? What kind of love do they have for one another? And why has this new movement or interest appeared in human life now, and not before?


    I gladly welcome your eagerness. I ask God, who enables us both to speak and to hear, to help me speak in a way that benefits you through hearing, and to help you listen in a way that does not disappoint me as the speaker.'
  philosophy: optimal-equivalence
