translation:
  language: en
  text: 'But I do not think you need me to explain why their rules about food, their superstitious Sabbath observance, their pride in circumcision, and their pretense in fasting and observing new moons are absurd and not worth considering.


    God created things for human use. Is it not irreverent to accept some as good but reject others as useless and unnecessary?


    Is it not profane to misrepresent God by saying that he forbids us to do anything good on the Sabbath?


    Is it not absurd to boast about cutting the flesh in circumcision as a sign that God has chosen them, as though this made God love them more than others?


    They study the stars and the moon and carefully observe months and days. Following their own preferences, they divide up God''s ordering of things and the changes of the seasons, making some times festivals and others times of mourning. Who would call this godliness rather than foolishness?


    So I believe you have learned enough to understand why Christians are right to keep away from the foolishness and error common among the Jews, and from their excessive concern with such observances and their pride. But do not expect any human being to teach you the mystery of the Christians’ own religion.'
