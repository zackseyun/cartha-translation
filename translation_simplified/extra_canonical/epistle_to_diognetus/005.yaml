translation:
  language: en
  text: 'Christians are no different from the rest of humanity in where they live, the language they speak, or the customs they follow.


    They do not have cities of their own. They do not speak some special language or live in some strange way. Their teaching is not a human invention produced by the thought and study of clever people. Nor are they devoted to any human teaching, as some are.


    Instead, they live in Greek and non-Greek cities, wherever life has placed them. They follow local customs in clothing, food, and the other details of daily life. Yet the way they live as citizens is remarkable and contrary to what anyone would expect.


    They live in their own countries, but as temporary residents. They take part in everything as citizens, yet endure every hardship as foreigners. Every foreign country is their homeland, and every homeland is foreign to them.


    They marry like everyone else and have children, but they do not abandon their newborn children. They share their food, but not their wives.


    They live in human bodies, but they do not live under the control of bodily desires. They live on earth, but their citizenship is in heaven.


    They obey the established laws, yet the way they live goes beyond what the laws require. They love everyone, yet everyone persecutes them.


    People do not know them, yet condemn them. They are put to death, yet receive life. They are poor, yet make many rich. They lack everything, yet have abundance in everything.


    They are dishonored, yet are glorified in their dishonor. People speak evil of them, yet they are shown to be in the right. When cursed, they bless; when insulted, they show respect.


    They do good, yet are punished as evildoers. When punished, they rejoice as though they were being brought to life.


    The Jews wage war against them as foreigners, and the Greeks persecute them. Yet those who hate them cannot explain why they are hostile toward them.'
