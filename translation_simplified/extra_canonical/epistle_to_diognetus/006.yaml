translation:
  language: en
  text: 'In short, Christians are to the world what the soul is to the body.


    The soul extends through every part of the body, and Christians live in cities throughout the world.


    The soul lives in the body but is not from the body. In the same way, Christians live in the world but are not from the world.


    The invisible soul is kept within the visible body. In the same way, people can see that Christians are in the world, but their religion itself cannot be seen.


    The flesh hates the soul and fights against it, even though the soul has done it no harm. This is because the soul keeps the flesh from giving itself over to pleasure. In the same way, the world hates Christians, even though they have done it no harm, because they resist its pleasures.


    The soul loves the flesh and every part of the body, even though the flesh hates it. In the same way, Christians love those who hate them.


    The soul is confined within the body, yet it holds the body together. In the same way, Christians are kept in the world as though in prison, yet they themselves hold the world together.


    Though the soul cannot die, it lives in a body that will die. In the same way, Christians live as strangers among things that will perish while they wait for what cannot perish in heaven.


    The soul benefits when it is treated harshly through lack of food and drink. In the same way, when Christians are punished, their numbers grow more each day.


    God has appointed Christians to this great role, and they are not permitted to refuse it.'
