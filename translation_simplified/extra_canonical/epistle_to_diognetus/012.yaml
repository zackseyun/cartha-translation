translation:
  language: en
  text: 'If you give careful attention to these truths, you will learn how generously God gives to those who love him rightly. They become like a delightful paradise. Within them grows a flourishing tree, covered with every kind of fruit.


    In this garden, a tree of knowledge and a tree of life have been planted. But the tree of knowledge does not bring death; disobedience does.


    Scripture clearly says that from the beginning God planted a tree [of knowledge and a tree][a] of life in the middle of Paradise. In this way, he revealed life through knowledge. But our first parents did not use it rightly, so the serpent deceived them and they became naked.


    There is no life without knowledge, and there is no sound knowledge without true life. That is why the two trees stand near each other.


    The apostle understood the force of this and condemned knowledge practiced apart from the truth of the command that leads to life. As he says, “Knowledge puffs up, but love builds up.”


    Anyone who thinks he knows something, but does not have the true knowledge confirmed by the way he lives, is actually ignorant. The serpent has deceived him because he did not love life. But whoever recognizes and desires life with reverence plants in hope and waits for fruit.


    Let your heart be knowledge, and let your life be true understanding.


    If you bear the tree and gather its fruit, you will always reap the harvest God desires. The serpent cannot touch this harvest, and deceit cannot spoil it. Eve is not corrupted, but the virgin is believed.


    Salvation is proclaimed. The apostles are filled with understanding. The Lord’s Passover moves forward. Congregations gather, and [all things] are put in order. As he teaches the saints, the Word rejoices. Through the Word the Father is glorified. To him be glory forever and ever. Amen.'
