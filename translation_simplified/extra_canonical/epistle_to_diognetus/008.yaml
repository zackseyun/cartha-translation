translation:
  language: en
  text: 'What human being knew anything about what God is like before God came?


    Do you accept the empty, senseless claims of those pretentious philosophers? Some said that God was fire—the very thing to which they themselves will go. Others said that God was water or some other element that God created.


    But if any of these claims deserves to be accepted, then any created thing could just as easily be called God.


    No, all of this is the trickery and deception of magicians. No one has seen or recognized God, but he revealed himself. He revealed himself through faith, for faith alone enables us to see God.


    God is the Master and Creator of the universe. He made everything and set it in order. He showed himself not only to be a friend to humanity, but also to be patient with us. This is what he always was, what he is, and what he always will be: kind, good, free from passion, and true. He alone is good.


    He formed a great plan beyond words and shared it only with his Son. As long as he kept his wise plan hidden and guarded it as a mystery, he seemed to be neglecting us and unconcerned about us.


    But then he revealed his plan through his beloved Son and made known the purpose he had prepared from the beginning. At once he gave us all these gifts: a share in his blessings, and the ability to see and understand things that none of us could ever have expected.'
