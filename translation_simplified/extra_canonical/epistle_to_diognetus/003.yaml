translation:
  language: en
  text: 'Next, I think you especially want to know why Christians do not worship in the same way as the Jews.


    The Jews are right to reject the kind of worship described above. They rightly say that they honor the one God of the universe and recognize him as their Master. But when they worship him in ways like those already mentioned, they are completely mistaken.


    The Greeks show their foolishness by offering gifts to images that cannot hear or understand. The Jews offer such gifts to God as though he needed them. They should recognize that this too is foolishness, not true worship.


    God made heaven, earth, and everything in them. He gives all of us what we need. So he cannot need anything that he himself gives to people who imagine they are giving it back to him.


    Some think they can worship God by offering blood, fat, and animals burned whole as sacrifices. But to me, they are no different from those who honor deaf images. One group offers gifts to things that cannot receive honor; the other offers gifts to the God who needs nothing.'
