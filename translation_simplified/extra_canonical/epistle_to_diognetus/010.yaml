translation:
  language: en
  text: 'If you also want this faith, you must first come to know the Father fully.


    God loved humanity. For our sake he made the world and placed everything on earth under our authority. He gave us reason and understanding. He allowed only us to look up toward heaven, and he made us in his own image. He sent us his only-begotten Son and promised us his heavenly kingdom. He will give that kingdom to those who have loved him.


    When you come to know the Father fully, think how much joy will fill you! Think how you will love the one who loved you first!


    As you love him, you will imitate his goodness. Do not be amazed that a human being can imitate God. We can do so if God wills it.


    Happiness is not found in ruling over your neighbors, trying to possess more than those who are weaker, having wealth, or using force against people beneath you. No one imitates God by doing these things. They have no place in his greatness.


    Instead, imitate God by carrying your neighbor’s burden. Use whatever advantage you have to help someone who is worse off. Share with people in need the possessions you received from God. In this way, you become as a god to those who receive your help.


    Then, though you live on earth, you will recognize that God lives in heaven. You will begin to proclaim the mysteries of God. You will love and admire those who are punished because they refuse to deny him. You will reject the world’s deception and error because you recognize the true life in heaven. You will despise what only appears to be death here on earth. Instead, you will fear the real death reserved for those condemned to the eternal fire, which will punish those handed over to it until the end.


    Then you will admire those who endure a fire that lasts only a short time for the sake of righteousness. You will call them blessed when you understand that fire...'
