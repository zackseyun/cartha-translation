translation:
  language: en
  text: 'My teaching is not strange, and my questions are not twisted. I was taught by the Apostles, and now I teach the Gentiles. I faithfully give the teachings handed down to all who come as students of the truth.


    Anyone who has been properly taught and has become a friend of the Word will want to understand clearly the lessons that the Word openly revealed to his disciples. He appeared to them and explained these lessons plainly. Unbelievers did not recognize him, but he explained these lessons to disciples whom he considered faithful and taught them the mysteries of the Father.


    For this reason, he sent out the Word so that he might appear to the world. The people dishonored him, the Apostles proclaimed him, and the Gentiles believed in him.


    This Word existed from the beginning. When he appeared, he seemed new, yet he was shown to be ancient. He is always born young in the hearts of God’s holy people.


    He is eternal. Today he was counted as the Son. Through him the Church grows rich, and grace unfolds and increases among God’s holy people. This grace gives understanding, reveals mysteries, announces the appointed times, rejoices over the faithful, and is given to those who seek it. These people do not break their pledges of faith or cross the boundaries set by the fathers.


    Therefore, reverence for the law is praised, the grace given through the prophets is recognized, the faith of the Gospels is firmly established, the teaching handed down by the Apostles is preserved, and the Church rejoices greatly.


    If you do not grieve this grace, you will understand the teachings the Word gives through those he chooses, whenever he chooses.


    The commanding Word moved us to speak all these things according to his will, though doing so required great effort. Because we love what has been revealed to us, we now share it with you.'
