translation:
  language: en
  text: Then those of us who are still alive—who have remained until then—will be caught up[a] together with them in the clouds to meet the Lord in the air.[b] In this way, we will always be with the Lord.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “snatched up”; the Greek describes sudden, forceful action.
    reason: lexical_alternative
  - marker: b
    text: Or “for a meeting with the Lord”; the verse does not explain what happens beyond this meeting.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: we who are alive, who remain
  simplified_phrase: those of us who are still alive—who have remained until then
  preserved_meaning: It identifies believers who are living and have not died by that point.
  reasoning_layer_used: lexical decisions for οἱ ζῶντες and οἱ περιλειπόμενοι
  rationale: The recast wording makes the two linked descriptions easier to follow.
- pob_phrase: will be caught up together with them
  simplified_phrase: will be caught up together with them
  preserved_meaning: Living believers will be suddenly taken up with the resurrected believers.
  reasoning_layer_used: lexical and theological decision for ἁρπαγησόμεθα
  rationale: The established wording stays because it preserves the forceful action without imposing a rapture system.
- pob_phrase: and so we will always be with the Lord
  simplified_phrase: In this way, we will always be with the Lord
  preserved_meaning: This sequence results in enduring fellowship with the Lord.
  reasoning_layer_used: lexical decisions for καὶ οὕτως and πάντοτε
  rationale: A new sentence makes the result clear while retaining “always.”
interpretive_expansions:
- pob_phrase: who remain
  rendering: who have remained until then
  claim: They remain alive until the point in the sequence Paul is describing.
  evidence:
