translation:
  language: en
  text: After all, if we believe that Jesus died and rose again, then God will also bring with Jesus those who have fallen asleep through Jesus.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Fallen asleep” means “died”; Paul uses sleep as a picture of believers’ death in this passage.
    reason: lexical_alternative
  - marker: b
    text: The phrase may also be understood as “those who have fallen asleep in Jesus”; the Greek can describe action through Jesus or close association with him.
    reason: alternative_reading
