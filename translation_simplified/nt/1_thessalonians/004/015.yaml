translation:
  language: en
  text: We tell you this by a word from the Lord:[a] When the Lord comes, those of us who are still living will certainly not go before those who have fallen asleep.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may mean either a saying from the Lord Jesus or a revelation given with the Lord’s authority.
    reason: alternative_reading
  - marker: b
    text: “Fallen asleep” is a picture of believers who have died.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: we who are living, who remain until the coming of the Lord
  simplified_phrase: When the Lord comes, those of us who are still living
  preserved_meaning: It refers to believers who remain alive up to the Lord’s coming.
  reasoning_layer_used: lexical decisions for οἱ ζῶντες, οἱ περιλειπόμενοι, and παρουσίαν
  rationale: The reordered clause states the same time relationship in ordinary English.
- pob_phrase: will certainly not precede
  simplified_phrase: will certainly not go before
  preserved_meaning: Living believers will in no way have priority over believers who have died.
  reasoning_layer_used: lexical decision for οὐ μὴ φθάσωμεν
  rationale: “Go before” makes the emphatic denial clearer while retaining its force.
- pob_phrase: those who have fallen asleep
  simplified_phrase: those who have fallen asleep
  preserved_meaning: The sleep metaphor refers to deceased believers and carries resurrection hope.
  reasoning_layer_used: lexical and theological decisions for τοὺς κοιμηθέντας
  rationale: The image is retained because replacing it with “the dead” would erase Paul’s metaphor.
translation_notes:
  risk_flags:
  - risk: Modern readers may take “fallen asleep” as literal sleep.
    mitigation: Footnote b explains that the phrase refers to believers who have died.
  - risk: “A word from the Lord” may sound like only a direct quotation from Jesus.
    mitigation: Footnote a preserves both a known saying and an authoritative revelation as possibilities.
