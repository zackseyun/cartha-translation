translation:
  language: en
  text: But we belong to the day, so let us stay sober and alert. Let us put on faith[a] and love as a breastplate, and the hope of salvation as a helmet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word translated “faith” can also mean “faithfulness” or “trust.”
