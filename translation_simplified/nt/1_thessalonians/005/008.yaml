  preserved_meaning: The command calls for sobriety with watchful self-control.
  reasoning_layer_used: POB lexical rationale for νήφω and immediate night-and-day context
  rationale: “Alert” makes the contextual force clear without removing literal sobriety.
- pob_phrase: having put on the breastplate of faith and love
  simplified_phrase: Let us put on faith and love as a breastplate
  preserved_meaning: Faith and love are pictured as protective armor believers take up.
  reasoning_layer_used: POB lexical decisions for ἐνδυσάμενοι and θώρακα
