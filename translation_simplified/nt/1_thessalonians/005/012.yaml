translation:
  language: en
  text: Brothers,[a] we ask you to give proper recognition to those who work hard among you. They lead you in the Lord[b] and give you corrective instruction.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “brothers and sisters”; the Greek says “brothers” but addresses the whole congregation.
    reason: lexical_alternative
  - marker: b
    text: Or “are over you in the Lord.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: to acknowledge
  simplified_phrase: to give proper recognition to
  preserved_meaning: The congregation is asked to recognize and value these workers without implying obedience or veneration.
  reasoning_layer_used: POB lexical and theological decisions for εἰδέναι
  rationale: This wording makes the relational sense of “acknowledge” clearer.
- pob_phrase: those who labor among you
  simplified_phrase: those who work hard among you
  preserved_meaning: Their service within the congregation requires strenuous effort.
  reasoning_layer_used: POB lexical decision for κοπιῶντας
  rationale: “Work hard” expresses strenuous labor in common English.
- pob_phrase: and lead you in the Lord and admonish you
  simplified_phrase: They lead you in the Lord and give you corrective instruction
  preserved_meaning: These workers exercise Lord-related leadership and provide pastoral correction.
  reasoning_layer_used: POB lexical and theological decisions for προϊσταμένους, ἐν κυρίῳ, and νουθετοῦντας
  rationale: A new sentence and a clear description replace the dense participial wording.
