simplification_decisions:
- pob_phrase: And because of this we also thank God continually
  simplified_phrase: That is why we also keep thanking God.
  preserved_meaning: Their thanksgiving continues and is caused by what the Thessalonians did.
  reasoning_layer_used: lexical decision for διὰ τοῦτο and εὐχαριστοῦμεν ... ἀδιαλείπτως
  rationale: The shorter sentence preserves both the causal link and ongoing thanksgiving.
- pob_phrase: you accepted it not as the word of men but, as it truly is, the word of God
  simplified_phrase: 'you did not accept it as a human word. You accepted it for what it truly is: God’s word.'
  preserved_meaning: They recognized the message as God’s word rather than a merely human word.
  reasoning_layer_used: lexical and theological decisions for λόγον ἀνθρώπων and λόγον θεοῦ
  rationale: Two sentences clarify the contrast while retaining the repeated key term “word.”
- pob_phrase: which is also at work in you who believe
  simplified_phrase: This word is also at work in you who believe.
  preserved_meaning: God’s word continues to operate effectively in believers.
  reasoning_layer_used: theological decision on the referent of ὃς and lexical decision for ἐνεργεῖται
  rationale: Naming “This word” makes the chosen antecedent clear without weakening the action.
