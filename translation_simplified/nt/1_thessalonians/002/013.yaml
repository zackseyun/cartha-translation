translation:
  language: en
  text: 'That is why we also keep thanking God. When you received God’s word that you heard from us, you did not accept it as a human word. You accepted it for what it truly is: God’s word. This word[a] is also at work in you who believe.'
  philosophy: optimal-equivalence
