translation:
  language: en
  text: They also killed the Lord Jesus and the prophets. They drove us out, do not please God, and are hostile to everyone.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “They” refers to the group described in the previous verse, not to all Jewish people in every time and place.
    reason: cultural_note
simplification_decisions:
- pob_phrase: who also killed the Lord Jesus and the prophets, and drove us out
  simplified_phrase: They also killed the Lord Jesus and the prophets. They drove us out
  preserved_meaning: The same group is accused of killing Jesus and the prophets and expelling Paul and his companions.
  reasoning_layer_used: Greek grammar and lexical decisions
  rationale: Two direct sentences make the long participial chain easier to follow without broadening “drove us out” to general persecution.
- pob_phrase: are not pleasing to God
  simplified_phrase: do not please God
  preserved_meaning: Their conduct continually fails to please God.
  reasoning_layer_used: Lexical decision for θεῷ μὴ ἀρεσκόντων
  rationale: The active wording is more natural in common English and keeps the ongoing judgment.
- pob_phrase: are hostile to all people
  simplified_phrase: are hostile to everyone
  preserved_meaning: They act in opposition to people generally.
  reasoning_layer_used: Lexical decision for πᾶσιν ἀνθρώποις ἐναντίων
  rationale: “Everyone” expresses “all people” more concisely while retaining the force of hostility.
translation_notes:
  risk_flags:
  - risk: Beginning with “They” could obscure that the description continues the specific group named in verse 14.
    mitigation: The footnote states the grammatical and historical scope.
