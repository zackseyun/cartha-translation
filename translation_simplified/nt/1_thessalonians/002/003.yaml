simplification_decisions:
- pob_phrase: our appeal
  simplified_phrase: the appeal we make
  preserved_meaning: Paul’s earnest urging and proclamation to his hearers
  reasoning_layer_used: Lexical decision for παράκλησις
  rationale: The verbal wording makes the abstract phrase easier to understand while retaining “appeal.”
- pob_phrase: does not come from error or impurity
  simplified_phrase: does not arise from error or impurity
  preserved_meaning: Error and moral impurity are denied as sources of the appeal
  reasoning_layer_used: Lexical and prepositional decisions for πλάνη, ἀκαθαρσία, and ἐκ/ἐξ
  rationale: “Does not arise from” expresses source naturally without narrowing “impurity.”
- pob_phrase: or deceit
  simplified_phrase: and it is not made with deceit
  preserved_meaning: The appeal is not delivered through deliberate trickery
  reasoning_layer_used: Lexical and prepositional decisions for δόλος and ἐν
  rationale: Keeping the appeal as subject preserves deceit as the manner of making it rather than a broad claim about conduct.
