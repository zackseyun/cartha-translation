  preserved_meaning: The glory in view is approval or acclaim received from human beings.
  reasoning_layer_used: POB lexical and theological decisions for δόξαν and ἐξ ἀνθρώπων
  rationale: “Praise” communicates human acclaim more directly, while the footnote preserves “glory” and “honor.”
- pob_phrase: neither from you nor from others
