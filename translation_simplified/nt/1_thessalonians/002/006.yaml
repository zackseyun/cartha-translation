  preserved_meaning: The speakers deny that they were pursuing human acclaim.
  reasoning_layer_used: POB lexical decision for ζητοῦντες and the surrounding sentence’s implied subject
  rationale: A finite verb makes the continuing thought natural in modern English without changing its force.
- pob_phrase: glory from people
