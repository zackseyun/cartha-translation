  reasoning_layer_used: POB lexical decisions for ἀπορφανισθέντες and πρὸς καιρὸν ὥρας
  rationale: The finite time clause is easier to follow while retaining the force of “torn away.”
- pob_phrase: with great longing
  simplified_phrase: with deep longing
  preserved_meaning: Paul felt an intense desire to reunite with the Thessalonians.
  reasoning_layer_used: POB lexical decision for ἐν πολλῇ ἐπιθυμίᾳ
  rationale: “Deep longing” expresses strong affection in familiar English.
- pob_phrase: to see your face
  simplified_phrase: to see you in person
  preserved_meaning: Paul desired a personal, physical reunion rather than merely continued affection at a distance.
