translation:
  language: en
  text: But brothers,[a] after we were torn away[b] from you for a short time—in person, but not in heart—we were all the more eager, with deep longing, to see you in person.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Paul’s word “brothers” likely addresses the whole believing community, including women.
    reason: cultural_note
  - marker: b
    text: More literally, “made orphans from you”; the Greek uses a vivid image of painful separation.
    reason: lexical_alternative
