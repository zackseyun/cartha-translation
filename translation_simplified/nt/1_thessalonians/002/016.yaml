translation:
  language: en
  text: They prevent us from speaking to the Gentiles—that is, non-Jews—so that they may be saved. By doing this, they continually fill up the measure of their sins. But wrath[a] has come upon them at last.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Wrath” likely means divine judgment, but Paul does not specify whether it is present, final, or both.
    reason: lexical_alternative
  - marker: b
    text: Or “has come upon them fully,” “completely,” or “to the end.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: by hindering us from speaking
  simplified_phrase: They prevent us from speaking
  preserved_meaning: Their ongoing action obstructs Paul and his coworkers from speaking.
  reasoning_layer_used: Lexical decision for κωλυόντων and the continuing context
  rationale: A direct sentence is easier to follow than the opening participial phrase.
- pob_phrase: so as always to fill up the measure of their sins
  simplified_phrase: By doing this, they continually fill up the measure of their sins
  preserved_meaning: Their obstruction results in a persistent filling up of their sins rather than stating their conscious goal.
  reasoning_layer_used: Theological decision on εἰς τὸ ἀναπληρῶσαι and lexical decision on πάντοτε
  rationale: The new sentence makes the result clear while preserving the biblical measure image.
- pob_phrase: the Gentiles
  simplified_phrase: the Gentiles—that is, non-Jews
  preserved_meaning: The term refers here to people outside the Jewish people, not geopolitical nations.
  reasoning_layer_used: Lexical decision for τοῖς ἔθνεσιν
  rationale: The brief explanation makes a biblical group label understandable to new readers.
