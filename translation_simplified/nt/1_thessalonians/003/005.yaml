translation:
  language: en
  text: That is why, when I could not bear it any longer, I sent Timothy to find out about your faith.[a] I was afraid that perhaps the tempter had tempted you and that our hard work might become pointless.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “faith” may also include the sense of trust or faithfulness.
    reason: alternative_reading
