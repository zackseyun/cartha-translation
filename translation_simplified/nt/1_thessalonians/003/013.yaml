simplification_decisions:
- pob_phrase: establish your hearts
  simplified_phrase: make your hearts firm
  preserved_meaning: God strengthens the inner person and gives it stability.
  reasoning_layer_used: Lexical decisions for στηρίξαι and καρδίας
  rationale: “Make firm” states the verb’s meaning directly while preserving the heart image.
- pob_phrase: your hearts blameless in holiness
  simplified_phrase: your hearts firm, blameless, and holy
  preserved_meaning: The hearts remain the object being made firm and are described as blameless and holy.
  reasoning_layer_used: Greek syntax and lexical decisions for καρδίας, ἀμέμπτους, and ἐν ἁγιωσύνῃ
  rationale: The qualities stay attached to “hearts” while the phrasing becomes easier to read.
- pob_phrase: at the coming of our Lord Jesus
  simplified_phrase: when our Lord Jesus comes
  preserved_meaning: The verse points to Jesus’ future arrival.
  reasoning_layer_used: Lexical decision for παρουσίᾳ
  rationale: A direct time clause is clearer than the abstract phrase “at the coming.”
translation_notes:
  risk_flags:
  - risk: “Holy ones” may sound unfamiliar to modern readers.
