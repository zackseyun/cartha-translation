simplification_decisions:
- pob_phrase: praying most earnestly
  simplified_phrase: we pray intensely
  preserved_meaning: Paul and his companions make their request with exceptional earnestness.
  reasoning_layer_used: Lexical decisions for ὑπερεκπερισσοῦ and δεόμενοι
  rationale: The finite clause is easier to read while retaining the prayer’s intensity.
- pob_phrase: to see your face
  simplified_phrase: that we may see you face to face
  preserved_meaning: They desire to be personally present with the Thessalonians.
  reasoning_layer_used: Lexical decision for ὑμῶν τὸ πρόσωπον
  rationale: This preserves the face image while clearly expressing a personal meeting.
- pob_phrase: to supply what is lacking in your faith
  simplified_phrase: provide what your faith still needs
  preserved_meaning: They want to supply what is deficient in the Thessalonians’ existing faith.
  reasoning_layer_used: Lexical decisions for καταρτίσαι, τὰ ὑστερήματα, and πίστις
  rationale: The plain wording retains the broad sense of supplying a lack without limiting it to strengthening.
translation_notes:
