translation:
  language: en
  text: Night and day, we pray intensely that we may see you face to face and provide what your faith still needs.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “complete what is still lacking in your faith.” The Greek can refer to what is missing or to what still needs strengthening or completion.
