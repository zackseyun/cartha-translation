translation:
  language: en
  text: We sent Timothy to strengthen you and encourage you in your faith. He is our brother and God’s fellow worker[a] in the good news of the Messiah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “co-worker with God.” Some manuscripts have different wording, such as “servant of God.”
    reason: alternative_reading
  - marker: b
    text: Greek “Christ.” “Messiah” is used here because the word functions as a title.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: and we sent Timothy, our brother and God's fellow worker ... to strengthen you
  simplified_phrase: We sent Timothy to strengthen you ... He is our brother and God’s fellow worker
  preserved_meaning: Timothy’s relationship to Paul and God remains tied to his mission of supporting the believers.
  reasoning_layer_used: POB syntax and lexical decisions
  rationale: Two sentences make the purpose easier to follow without changing Timothy’s roles.
- pob_phrase: in the gospel of the Messiah
  simplified_phrase: in the good news of the Messiah
  preserved_meaning: Timothy works in the sphere of the Messiah’s gospel without resolving the genitive.
  reasoning_layer_used: POB lexical decision for εὐαγγελίῳ τοῦ Χριστοῦ
  rationale: “Good news” explains “gospel” in ordinary English while preserving “of the Messiah.”
- pob_phrase: to encourage you concerning your faith
  simplified_phrase: encourage you in your faith
  preserved_meaning: Timothy gives pastoral support directed toward the Thessalonians’ faith.
  reasoning_layer_used: POB lexical decisions for παρακαλέσαι and ὑπὲρ τῆς πίστεως
  rationale: “In your faith” is more natural English and retains the supportive pastoral sense.
translation_notes:
  risk_flags:
