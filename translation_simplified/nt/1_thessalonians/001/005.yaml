translation:
  language: en
  text: because our gospel did not come to you through words alone. It also came with power, with the Holy Spirit, and with great conviction.[a] You know what kind of men we proved to be while we were among you, for your sake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “with great assurance” or “with great certainty.” The Greek does not specify whose assurance or conviction is meant.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: did not come to you in word only
  simplified_phrase: did not come to you through words alone
  preserved_meaning: The gospel was proclaimed verbally but was not merely speech.
  reasoning_layer_used: lexical decision for ἐν λόγῳ μόνον
  rationale: “Through words alone” expresses the contrast in natural English.
- pob_phrase: but also in power and in the Holy Spirit and with great conviction
  simplified_phrase: It also came with power, with the Holy Spirit, and with great conviction
  preserved_meaning: The gospel came with divine power, the personal Holy Spirit, and profound conviction or assurance.
  reasoning_layer_used: lexical and theological decisions for δύναμις, πνεῦμα ἅγιον, and πληροφορία
  rationale: A new sentence clarifies the threefold contrast without narrowing the assurance’s subject.
- pob_phrase: among you for your sake
  simplified_phrase: while we were among you, for your sake
  preserved_meaning: The missionaries’ demonstrated character was seen in their life among the Thessalonians and was for their benefit.
  reasoning_layer_used: lexical decisions for ἐν ὑμῖν and δι’ ὑμᾶς
  rationale: “While we were among you” makes the setting of their conduct immediately clear.
translation_notes:
  risk_flags:
