translation:
  language: en
  text: For they themselves tell what kind of visit we had with you,[a] and how you turned from idols to God to serve the living and true God.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek can also mean “what kind of entrance we had among you,” referring to the character and effect of our arrival.
    reason: lexical_alternative
  - marker: b
    text: The words “living and true God” contrast God with lifeless idols; compare Jeremiah 10:10.
    reason: cross_reference
