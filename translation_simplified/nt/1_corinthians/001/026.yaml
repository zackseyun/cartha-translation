simplification_decisions:
- pob_phrase: consider your calling
  simplified_phrase: think about what you were like when God called you
  preserved_meaning: Paul tells the Corinthians to reflect on their situation when they received God’s call.
  reasoning_layer_used: The lexical decision identifies “calling” as God’s call and reads “consider” as an exhortation.
  rationale: The rewrite makes the action and timing clear without treating “calling” as an occupation.
- pob_phrase: not many of you were wise by human standards
  simplified_phrase: Not many of you were wise by human standards.
  preserved_meaning: Few in the congregation were regarded as wise from a merely human viewpoint.
  reasoning_layer_used: The lexical decision explains κατὰ σάρκα as human assessment rather than literal flesh.
  rationale: A separate sentence makes the contrast easier to follow while retaining the audited wording.
- pob_phrase: not many were of noble birth
  simplified_phrase: not many came from noble families
  preserved_meaning: Few believers came from families of high social rank.
  reasoning_layer_used: The lexical decision defines εὐγενεῖς as high social lineage.
  rationale: “Came from noble families” communicates inherited social status in more familiar English.
interpretive_expansions:
- pob_phrase: your calling
  rendering: when God called you
  claim: The calling is God’s summons to the believers.
  evidence:
  - The POB lexical rationale says the term refers to God’s call that defines the believers’ status.
  - The following descriptions concern who the Corinthians were when called.
  confidence: high
  alternatives_preserved:
