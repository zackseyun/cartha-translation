  preserved_meaning: God's choice has the purpose of shaming those regarded as wise or strong.
  reasoning_layer_used: POB lexical rationale for ἵνα and καταισχύνῃ
  rationale: The infinitive states purpose naturally, and “put to shame” clearly expresses the verb.
- pob_phrase: the weak things of the world
