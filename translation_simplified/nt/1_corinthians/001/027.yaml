  preserved_meaning: God chooses what is regarded as weak within the present world order.
  reasoning_layer_used: POB lexical rationale for ἀσθενῆ and τοῦ κόσμου
  rationale: The recasting avoids stiff wording without narrowing the reference specifically to people.
