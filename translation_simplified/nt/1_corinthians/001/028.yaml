translation:
  language: en
  text: God chose what the world regards as low in status and despises—the things that are not[a]—to make powerless the things that are.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “those regarded as nothing.” Paul’s wording also preserves the broader contrast with “the things that are.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the lowborn things of the world and the despised things
  simplified_phrase: what the world regards as low in status and despises
  preserved_meaning: God chooses what lacks social standing and is treated with contempt.
  reasoning_layer_used: POB lexical decisions for ἀγενῆ and ἐξουθενημένα
  rationale: The recast wording makes the social judgment clear without weakening the rejection involved.
- pob_phrase: to nullify
  simplified_phrase: to make powerless
  preserved_meaning: God causes what appears important to lose its effectiveness or power.
  reasoning_layer_used: POB lexical decision for καταργήσῃ
  rationale: “Make powerless” states the verb’s force in more familiar English without implying annihilation.
- pob_phrase: the things that are not ... the things that are
  simplified_phrase: the things that are not ... the things that are
  preserved_meaning: Paul’s provocative contrast retains both its literal breadth and its contextual social force.
  reasoning_layer_used: POB theological decision on τὰ μὴ ὄντα and τὰ ὄντα
  rationale: The balanced wording is retained because simplifying it to social labels would erase the documented ambiguity.
translation_notes:
  risk_flags:
  - risk: Readers may take “the things that are not” only as a statement about nonexistence.
    mitigation: The footnote supplies the contextual social sense without replacing Paul’s broader wording.
