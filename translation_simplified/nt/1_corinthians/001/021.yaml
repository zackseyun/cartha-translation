translation:
  language: en
  text: For since, in God’s wisdom, the world did not come to know God through its own wisdom, God was pleased to save those who believe through the proclaimed message—a message the world considers foolish.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The phrase may also mean “through the foolishness of preaching.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: For since, in the wisdom of God, the world did not know God through wisdom
  simplified_phrase: For since, in God’s wisdom, the world did not come to know God through its own wisdom
  preserved_meaning: Paul gives the world’s failure to know God by its wisdom as the circumstance leading into God’s chosen means of salvation.
  reasoning_layer_used: Lexical decisions for ἐπειδὴ γὰρ, ἐν with σοφία, γινώσκω, and διά with σοφία
  rationale: The wording restores the causal link and clarifies whose wisdom failed without defining how God’s wisdom governed the situation.
- pob_phrase: through the foolishness of the proclamation
  simplified_phrase: through the proclaimed message—a message the world considers foolish
  preserved_meaning: God saves believers through a proclaimed message judged foolish by worldly standards.
  reasoning_layer_used: Theological decision for μωρία τοῦ κηρύγματος and POB cultural note
  rationale: The rewrite explains the irony while retaining the message as the primary sense.
- pob_phrase: God was pleased through ... to save those who believe
  simplified_phrase: God was pleased to save those who believe through ...
  preserved_meaning: Saving believers by this means accords with God’s good pleasure.
  reasoning_layer_used: Lexical decisions for εὐδοκέω, σῴζω, and πιστεύω
  rationale: Natural English word order makes the main action easier to follow.
interpretive_expansions:
- pob_phrase: through wisdom
  rendering: through its own wisdom
  claim: The wisdom by which the world failed to know God is the wisdom the world relied on.
  evidence:
  - The immediate argument contrasts the world’s wisdom with God’s wisdom.
  confidence: high
  alternatives_preserved:
  - through wisdom
- pob_phrase: the foolishness of the proclamation
  rendering: the proclaimed message—a message the world considers foolish
  claim: The foolishness is the world’s judgment of the proclaimed message, not God’s judgment of it.
  evidence:
  - The POB theological decision identifies the proclaimed message as the primary sense.
  - The POB cultural note says the world regards the message as foolish.
  confidence: high
  alternatives_preserved:
  - the foolish act or method of preaching
  - a blend of the message and the act of proclaiming it
translation_notes:
  risk_flags:
  - risk: “Its own wisdom” states explicitly that the world relied on human or worldly wisdom.
    mitigation: The immediate contrast supports this clarification while “in God’s wisdom” remains distinct.
  - risk: Emphasizing the message may obscure a possible reference to the act of preaching.
    mitigation: The footnote preserves that documented alternative.
