translation:
  language: en
  text: The Messiah did not send me to baptize, but to announce the good news. I was not to announce it with eloquent speech, so that the Messiah’s cross would not be emptied of its power.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Messiah” is traditionally translated “Christ.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: but to proclaim the good news—not in wisdom of speech
  simplified_phrase: but to announce the good news. I was not to announce it with eloquent speech
  preserved_meaning: Paul contrasts his mission to announce the good news with presenting it through rhetorical sophistication.
  reasoning_layer_used: POB lexical decisions for εὐαγγελίζεσθαι and σοφίᾳ λόγου
  rationale: Two sentences make the contrast clear while “eloquent speech” expresses the documented rhetorical sense.
- pob_phrase: so that the cross of Messiah might not be emptied
  simplified_phrase: so that the Messiah’s cross would not be emptied of its power
  preserved_meaning: Reliance on eloquence could make the Messiah’s cross ineffective in Paul’s proclamation.
  reasoning_layer_used: POB lexical alternative for κενωθῇ
  rationale: The added words explain what the concrete image of being emptied means here without removing that image.
interpretive_expansions:
- pob_phrase: might not be emptied
