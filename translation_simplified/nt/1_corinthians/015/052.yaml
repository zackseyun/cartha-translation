simplification_decisions:
- pob_phrase: in an instant, in the blink of an eye
  simplified_phrase: in an instant, as quickly as an eye blinks
  preserved_meaning: The event will happen with extreme suddenness.
  reasoning_layer_used: POB lexical decisions for ἐν ἀτόμῳ and ἐν ῥιπῇ ὀφθαλμοῦ
  rationale: The comparison makes the familiar image immediately clear without weakening its speed.
- pob_phrase: the dead will be raised imperishable
  simplified_phrase: the dead will be raised, never to decay
  preserved_meaning: Dead people will be raised in a state no longer subject to decay.
  reasoning_layer_used: POB lexical decision for ἄφθαρτοι and the resurrection context
  rationale: The phrase explains “imperishable” in common English while preserving bodily resurrection and freedom from decay.
- pob_phrase: and we will be changed
  simplified_phrase: And we will be changed.
  preserved_meaning: Paul retains the explicit contrast between the raised dead and “we.”
  reasoning_layer_used: POB theological decision on ἡμεῖς and ἀλλαγησόμεθα
  rationale: A separate short sentence highlights the contrast without defining “we” more narrowly than the text does.
