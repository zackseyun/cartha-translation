  preserved_meaning: Human beings who correspond to the heavenly man are like him.
  reasoning_layer_used: POB lexical and theological decisions for ὁ ἐπουράνιος and οἱ ἐπουράνιοι
  rationale: A new sentence clarifies the parallel and “people” prevents readers from mistaking them for angels.
