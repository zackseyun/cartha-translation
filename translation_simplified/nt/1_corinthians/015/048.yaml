- pob_phrase: As is the man of dust, so also are those of dust
  simplified_phrase: People made from dust are like the man made from dust
  preserved_meaning: People correspond to the representative man who was formed from dust.
  reasoning_layer_used: POB lexical decisions for οἷος ... τοιοῦτοι and χοϊκός
  rationale: The direct comparison is easier to follow while preserving the dust image and representative relationship.
- pob_phrase: and as is the heavenly man, so also are those who are heavenly
