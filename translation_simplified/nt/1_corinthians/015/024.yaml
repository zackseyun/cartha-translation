translation:
  language: en
  text: Then the end[a] will come. This will happen when Christ hands over the kingdom to God the Father and abolishes[b] every ruler, every authority, and every power.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the consummation” or “the goal.”
    reason: lexical_alternative
  - marker: b
    text: Or “nullifies” or “brings to nothing”; this means decisively ending their power, not necessarily annihilating them.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Then comes the end
  simplified_phrase: Then the end will come
  preserved_meaning: The end is the next future stage in Paul’s resurrection sequence.
  reasoning_layer_used: Lexical decision for εἶτα and τὸ τέλος
  rationale: The explicit future form is more natural in modern English.
- pob_phrase: when he hands over ... when he abolishes
  simplified_phrase: This will happen when Christ hands over ... and abolishes
  preserved_meaning: The end involves both transferring the kingdom and ending every hostile power.
  reasoning_layer_used: Source syntax and lexical decisions for παραδιδῷ and καταργήσῃ
  rationale: A second sentence removes the dense repeated clause structure without merging the two actions.
- pob_phrase: every ruler and every authority and power
  simplified_phrase: every ruler, every authority, and every power
  preserved_meaning: All rulers, authorities, and powers are included without exception.
  reasoning_layer_used: Latest doctrinal realignment and lexical decisions for the threefold list
  rationale: Repeating “every” makes the scope of each item immediately clear.
interpretive_expansions:
- pob_phrase: he
  rendering: Christ
  claim: The one who hands over the kingdom and abolishes the powers is Christ.
  evidence:
