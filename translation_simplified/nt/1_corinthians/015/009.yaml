- pob_phrase: the least of the apostles, who am not worthy
  simplified_phrase: the least of the apostles. I do not deserve
  preserved_meaning: Paul affirms his apostleship while humbly saying he is unworthy of the title.
  reasoning_layer_used: theological decision and sentence-level syntax
  rationale: Two sentences make the tension clear without resolving it away.
- pob_phrase: not worthy to be called an apostle
  simplified_phrase: do not deserve to be called an apostle
  preserved_meaning: Paul expresses moral unworthiness because of his past persecution.
  reasoning_layer_used: lexical decision for ἱκανός
  rationale: “Do not deserve” expresses “not worthy” in direct modern English.
- pob_phrase: the church of God
  simplified_phrase: God’s church
  preserved_meaning: The persecuted community belongs to God.
  reasoning_layer_used: lexical decision for ἐκκλησίαν τοῦ θεοῦ
  rationale: The possessive form is more natural while preserving the same relationship.
