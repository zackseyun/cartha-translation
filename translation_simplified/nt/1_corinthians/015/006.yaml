translation:
  language: en
  text: Then he appeared to more than five hundred brothers[a] all at once. Most of them were still alive when Paul wrote this, though some had fallen asleep.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “brothers and sisters.” The Greek says “brothers,” but this word can sometimes refer to the wider community of believers.
    reason: lexical_alternative
  - marker: b
    text: That is, they had died. “Fallen asleep” expresses death in light of the hope of resurrection.
    reason: lexical_alternative
