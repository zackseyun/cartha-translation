simplification_decisions:
- pob_phrase: borne the image
  simplified_phrase: shared the likeness
  preserved_meaning: Human beings share the form and condition represented by Adam and will share Christ’s heavenly likeness.
  reasoning_layer_used: POB lexical decisions for φορέω and εἰκών
  rationale: This replaces an opaque image-bearing expression while preserving the Adam-Christ comparison.
- pob_phrase: the man of dust
  simplified_phrase: the man made from dust
  preserved_meaning: The first man is Adam, whose origin from dust echoes Genesis.
  reasoning_layer_used: POB lexical decision for τοῦ χοϊκοῦ
  rationale: “Made from dust” states the concrete source image in ordinary English.
- pob_phrase: the heavenly man
  simplified_phrase: the man from heaven
  preserved_meaning: The second figure in the contrast is Christ, the heavenly man.
  reasoning_layer_used: POB lexical decision for τοῦ ἐπουρανίου and immediate context
  rationale: The recast phrase makes the parallel origin contrast easier to grasp.
translation_notes:
  risk_flags:
