translation:
  language: en
  text: If, speaking only from a human point of view,[a] I fought with wild beasts in Ephesus,[b] what good did that do me? If the dead are not raised, “Let us eat and drink, for tomorrow we die.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The phrase may describe either Paul's way of speaking or the merely human perspective he is considering.
    reason: lexical_alternative
  - marker: b
    text: “Fought with wild beasts” may refer to actual animals or picture a struggle against brutal human opponents.
    reason: alternative_reading
  - marker: c
    text: This saying quotes or echoes Isaiah 22:13.
    reason: cross_reference
