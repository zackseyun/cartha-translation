translation:
  language: en
  text: Then we would even be shown to be false witnesses about God. Our testimony would be against God[a], because we said that he raised the Messiah[b]. But if the dead are not raised, then God did not raise him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “about God”; the wording may describe testimony concerning God, though “against God” preserves the stronger sense in this argument.
    reason: lexical_alternative
  - marker: b
    text: Greek “Christ”; here the word functions as the title “Messiah.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Then we are even found to be false witnesses about God
  simplified_phrase: Then we would even be shown to be false witnesses about God
  preserved_meaning: If the resurrection claim is false, the apostles are exposed as giving false testimony about God.
  reasoning_layer_used: Lexical decision for εὑρισκόμεθα and immediate argumentative context
  rationale: “Would be shown” expresses the resulting status in clear conditional English.
- pob_phrase: because we testified about God that he raised the Messiah
  simplified_phrase: Our testimony would be against God, because we said that he raised the Messiah
  preserved_meaning: The apostles attributed the Messiah’s resurrection to God and would thereby testify against him if the claim were false.
  reasoning_layer_used: Theological decision for κατὰ τοῦ θεοῦ and lexical decision for ἐμαρτυρήσαμεν
  rationale: A separate sentence makes the severe force of “against God” easier to follow.
- pob_phrase: whom he did not raise if in fact the dead are not raised
  simplified_phrase: But if the dead are not raised, then God did not raise him
  preserved_meaning: The denial of resurrection would entail that God did not raise the Messiah.
  reasoning_layer_used: Lexical decisions for εἴπερ ἄρα and passive οὐκ ἐγείρονται
  rationale: Reordering the condition into ordinary English clarifies Paul’s logic while keeping resurrection passive.
interpretive_expansions:
- pob_phrase: Then we are even found
  rendering: Then we would even be shown
  claim: The resulting charge is conditional on the premise that the dead are not raised.
  evidence:
