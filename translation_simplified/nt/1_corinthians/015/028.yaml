translation:
  language: en
  text: But when all things have been brought under the Son’s rule, the Son himself will also come under the rule of God, who brought all things under the Son. This will happen so that God may be all in all.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “God may be everything in everyone.” The Greek expression is compact and broad, so its full meaning is not limited to this alternative.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: all things are subjected to him
  simplified_phrase: all things have been brought under the Son’s rule
  preserved_meaning: Everything is placed under the Son while the passive sense and cosmic scope remain.
  reasoning_layer_used: Lexical decisions for ὑποτάσσω, αὐτῷ, and τὰ πάντα
  rationale: Naming the Son and expressing subjection as coming under his rule makes the relationship immediately clear.
- pob_phrase: the Son himself will also be subjected to the one who subjected all things to him
  simplified_phrase: the Son himself will also come under the rule of God, who brought all things under the Son
  preserved_meaning: The Son’s future subjection to God remains direct without explaining away its theological tension.
  reasoning_layer_used: Lexical and theological decisions on the Son’s subjection
  rationale: Repeating the Son’s title removes confusing pronouns while preserving the sequence and relational direction.
- pob_phrase: so that God may be all in all
  simplified_phrase: This will happen so that God may be all in all
  preserved_meaning: God’s being all in all remains the purpose or result of the preceding subjection.
  reasoning_layer_used: Lexical decisions for ἵνα ᾖ and πάντα ἐν πᾶσιν
  rationale: A separate sentence clarifies what the purpose clause refers to without unpacking the deliberately compact final phrase.
interpretive_expansions:
- pob_phrase: are subjected / will also be subjected
  rendering: have been brought under the Son’s rule / will also come under the rule of God
  claim: The repeated subjection language describes being placed under another’s rule or authority.
  evidence:
  - The lexical decision for ὑποτάσσω preserves relational subjection.
  - The immediate argument concerns all things being placed under the Son and the Son under God.
  confidence: high
  alternatives_preserved:
  - are subjected
  - are put in subjection
- pob_phrase: the one who subjected all things to him
  rendering: God, who brought all things under the Son
  claim: The one who subjects all things to the Son is God.
  evidence:
  - God is the named subject in the verse’s concluding purpose clause.
  - The POB theological reasoning identifies the Son’s subjection as subjection to God.
  confidence: high
  alternatives_preserved:
  - the one who brought all things under the Son
translation_notes:
  risk_flags:
  - risk: “Under the rule” states the authority dimension more directly than the passive verb “be subjected.”
    mitigation: The wording retains both ordered relationships and does not explain the Son’s subjection doctrinally.
  - risk: “All in all” remains compact and may be difficult for new readers.
    mitigation: The footnote gives the principal alternative without narrowing the Greek expression.
