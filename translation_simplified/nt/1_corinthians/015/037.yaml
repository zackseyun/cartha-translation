translation:
  language: en
  text: What you sow is not the body that will later exist. It is only a bare seed, perhaps wheat or some other kind.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: you do not sow the body that will be
  simplified_phrase: What you sow is not the body that will later exist
  preserved_meaning: The seed being sown is contrasted with its future body.
  reasoning_layer_used: lexical and theological decisions on σῶμα and τὸ γενησόμενον
  rationale: The new wording clarifies the time contrast while retaining Paul's important term “body.”
- pob_phrase: but a bare kernel, perhaps of wheat or of some other kind
  simplified_phrase: It is only a bare seed, perhaps wheat or some other kind
  preserved_meaning: What is sown is an undeveloped seed, with wheat given as one possible example.
  reasoning_layer_used: lexical decisions on γυμνὸν, κόκκον, εἰ τύχοι, and σίτου
  rationale: “Bare seed” makes the agricultural image immediately clear without weakening the contrast.
translation_notes:
  risk_flags:
  - risk: Using “body” for what develops from a seed may sound unusual in modern English.
    mitigation: It is retained because it connects the analogy to Paul's argument about bodily resurrection.
