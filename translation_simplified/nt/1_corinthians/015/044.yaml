translation:
  language: en
  text: A natural body—one given life in the ordinary human way—is sown. A spiritual body—one given life by the Spirit—is raised.[a] If there is a natural body, there is also a spiritual body.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Natural” and “spiritual” do not mean physical and nonphysical; they contrast ordinary human life with life given by the Spirit. “Natural” may also be translated “soulish.”
    reason: lexical_alternative
