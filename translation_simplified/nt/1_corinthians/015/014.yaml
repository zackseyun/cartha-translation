simplification_decisions:
- pob_phrase: our proclamation
  simplified_phrase: the message we proclaim
  preserved_meaning: Paul means the publicly announced message, not merely the act of preaching.
  reasoning_layer_used: The lexical decision for κήρυγμα preserves its heralded-message sense.
  rationale: The verbal phrase is clearer than the abstract noun “proclamation.”
- pob_phrase: and your faith is empty
  simplified_phrase: Your faith is empty too.
  preserved_meaning: The repeated “empty” keeps Paul’s parallel between the message and their faith.
  reasoning_layer_used: The paired lexical decisions for κενός require the same rendering in both clauses.
  rationale: A short sentence clarifies the result, while “too” carries the connection.
translation_notes:
  risk_flags:
  - risk: “Message” could weaken the public-announcement sense of κήρυγμα.
    mitigation: The words “we proclaim” preserve that public heralding sense.
