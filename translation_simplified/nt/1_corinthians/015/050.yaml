translation:
  language: en
  text: 'Brothers,[a] I tell you this: human life in its present mortal condition—flesh and blood—cannot inherit the kingdom of God.[b] What is perishable cannot inherit what is imperishable.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “brothers and sisters”; the Greek says “brothers” but may include the whole congregation.
    reason: lexical_alternative
  - marker: b
    text: This does not deny bodily resurrection; Paul is saying that our present mortal condition must be transformed.
    reason: cultural_note
