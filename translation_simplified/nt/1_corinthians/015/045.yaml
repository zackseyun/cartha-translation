translation:
  language: en
  text: So Scripture also says, “The first man, Adam, became a living being.”[a] But the last Adam became a spirit who gives life.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a living soul,” the traditional wording of Genesis 2:7.
    reason: lexical_alternative
  - marker: b
    text: Or “a life-giving spirit.” This describes the last Adam and does not necessarily identify Christ with the Holy Spirit as a distinct person.
    reason: alternative_reading
