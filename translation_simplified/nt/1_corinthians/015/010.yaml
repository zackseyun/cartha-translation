translation:
  language: en
  text: But by God’s grace I am what I am, and his grace toward me was not empty—it produced real results. Instead, I worked harder than all of them. Yet it was not I, but God’s grace that was with me.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: his grace toward me did not prove empty
  simplified_phrase: his grace toward me was not empty—it produced real results
  preserved_meaning: God’s grace was effective while the source image of emptiness remains.
  reasoning_layer_used: Lexical decision for οὐ κενὴ ἐγενήθη
  rationale: The added explanation makes the metaphor immediately understandable.
- pob_phrase: I labored more than all of them
  simplified_phrase: I worked harder than all of them
  preserved_meaning: Paul exerted himself strenuously beyond the others.
  reasoning_layer_used: Lexical decision for ἐκοπίασα
  rationale: “Worked harder” is more common English while retaining strenuous effort.
- pob_phrase: yet not I, but the grace of God that was with me
  simplified_phrase: Yet it was not I, but God’s grace that was with me
  preserved_meaning: Paul’s real work and God’s effective grace remain in deliberate tension.
  reasoning_layer_used: Theological decision on Paul’s labor and divine grace
  rationale: The wording avoids resolving the statement toward either theological extreme.
interpretive_expansions:
- pob_phrase: did not prove empty
  rendering: was not empty—it produced real results
  claim: God’s grace toward Paul was effective rather than fruitless.
  evidence:
  - The lexical rationale says κενός can mean empty, without result, or in vain.
  - Paul immediately points to his strenuous labor as the resulting evidence.
  confidence: high
  alternatives_preserved:
  - was not in vain
  - did not become empty
translation_notes:
  risk_flags:
  - risk: “It produced real results” explains rather than merely reproduces the emptiness metaphor.
    mitigation: The main text retains “empty” before giving the concise explanation.
  - risk: Readers may try to resolve Paul’s labor and God’s grace into one theological system.
    mitigation: The translation preserves both claims without adding a doctrinal explanation.
