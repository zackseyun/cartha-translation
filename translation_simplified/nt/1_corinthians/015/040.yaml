  preserved_meaning: Each category has its own distinct kind of glory or splendor.
  reasoning_layer_used: Lexical decisions on δόξα, ἑτέρα, and the elliptical plurals
  rationale: Repeating “bodies” removes an opaque ellipsis while retaining “glory” and the qualitative contrast.
