simplification_decisions:
- pob_phrase: For just as in Adam all die
  simplified_phrase: For everyone in Adam dies.
  preserved_meaning: Everyone described as being in Adam dies.
  reasoning_layer_used: Lexical decisions for ὥσπερ γάρ, ἐν τῷ Ἀδάμ, πάντες, and ἀποθνῄσκουσιν
  rationale: A direct sentence replaces the dense comparison opening while keeping its explanatory link and broad scope.
- pob_phrase: so also in Messiah all will be made alive
  simplified_phrase: In the same way, everyone in Messiah will be made alive.
  preserved_meaning: The parallel group in Messiah will receive life through future divine action.
  reasoning_layer_used: Lexical decisions for οὕτως καί, ἐν τῷ Χριστῷ, πάντες, and ζῳοποιηθήσονται
  rationale: A second sentence makes the comparison easier to follow while preserving “Messiah” and the future passive.
translation_notes:
  risk_flags:
  - risk: “Everyone” could be read as resolving the theological scope of the two uses of “all.”
    mitigation: The wording remains unqualified and preserves the same parallel in both sentences.
  - risk: The phrases “in Adam” and “in Messiah” may remain unfamiliar to new readers.
    mitigation: They are retained because replacing them would over-interpret Paul’s compact representative language.
