translation:
  language: en
  text: For everyone in Adam dies. In the same way, everyone in Messiah[a] will be made alive.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek title translated “Messiah” can also be rendered “Christ.”
