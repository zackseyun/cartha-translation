simplification_decisions:
- pob_phrase: through which
  simplified_phrase: Through this good news
  preserved_meaning: The gospel mentioned in the previous verse is the means through which they are being saved.
  reasoning_layer_used: POB lexical decision for δι’ οὗ and immediate context
  rationale: Naming the antecedent removes an unclear pronoun without changing its reference.
- pob_phrase: I proclaimed as good news to you
  simplified_phrase: I announced to you
  preserved_meaning: Paul delivered the gospel message to the Corinthians.
  reasoning_layer_used: POB lexical decision for εὐηγγελισάμην
  rationale: Because “this good news” already identifies the message, “announced” avoids repetitive wording.
- pob_phrase: unless you believed in vain
  simplified_phrase: unless your belief was for nothing
  preserved_meaning: Paul warns that their act of believing may prove empty or futile.
  reasoning_layer_used: POB lexical decisions for εἰκῇ and ἐπιστεύσατε
  rationale: “For nothing” expresses the warning in common English while retaining its force.
