translation:
  language: en
  text: Through this good news you are also being saved,[a] if you keep holding firmly to the message I announced to you—unless your belief was for nothing.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “you are saved.” The Greek may describe salvation as ongoing or state it more generally.
