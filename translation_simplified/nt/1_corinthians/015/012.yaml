translation:
  language: en
  text: If it is proclaimed that the Messiah has been raised from the dead,[a] how can some of you say that the dead will not be raised?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Christ.” The Greek title can be translated either “Messiah” or “Christ.”
