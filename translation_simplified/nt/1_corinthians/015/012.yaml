simplification_decisions:
- pob_phrase: the Messiah is proclaimed as having been raised from the dead
  simplified_phrase: it is proclaimed that the Messiah has been raised from the dead
  preserved_meaning: The public proclamation declares the Messiah’s completed resurrection.
  reasoning_layer_used: Lexical decisions for κηρύσσεται and ἐγήγερται
  rationale: The direct clause avoids an abstract subject while preserving proclamation and the passive “has been raised.”
- pob_phrase: some among you
  simplified_phrase: some of you
  preserved_meaning: The claim comes from a subset within the Corinthian community.
  reasoning_layer_used: Lexical decision for ἐν ὑμῖν τινες
  rationale: “Some of you” expresses the same internal-group sense in natural English.
- pob_phrase: there is no resurrection of the dead
  simplified_phrase: the dead will not be raised
  preserved_meaning: They deny the general resurrection of dead people.
  reasoning_layer_used: Lexical decisions for ἀνάστασις νεκρῶν and οὐκ ἔστιν
  rationale: The verbal form makes the denial immediately understandable without limiting it to one event.
translation_notes:
  risk_flags:
  - risk: Changing the noun “resurrection” to a passive verb could seem narrower than the POB wording.
    mitigation: “The dead” preserves the broad category of the general resurrection.
