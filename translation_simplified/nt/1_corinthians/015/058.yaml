translation:
  language: en
  text: Therefore, my beloved brothers,[a] become firm and unshakable. Always give yourselves fully to the Lord’s work. You know that your hard work in the Lord is never wasted.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Brothers” can refer here to all fellow believers, including women.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: become steadfast, immovable
  simplified_phrase: become firm and unshakable
  preserved_meaning: They are commanded to become firmly established and not be moved from their position.
  reasoning_layer_used: POB lexical decisions for ἑδραῖοι, γίνεσθε, and ἀμετακίνητοι
  rationale: Common words preserve both the call to become firm and the strong image of resisting movement.
- pob_phrase: always abounding in the work of the Lord
  simplified_phrase: Always give yourselves fully to the Lord’s work
  preserved_meaning: Their participation in the Lord’s broad work should be continual and abundant.
  reasoning_layer_used: POB lexical decisions for περισσεύοντες, πάντοτε, and ἐν τῷ ἔργῳ τοῦ κυρίου
  rationale: The active wording expresses ongoing fullness without narrowing the Lord’s work to formal ministry.
- pob_phrase: knowing that your labor in the Lord is not in vain
  simplified_phrase: You know that your hard work in the Lord is never wasted
  preserved_meaning: Their wearying effort done in the Lord is not empty or fruitless.
  reasoning_layer_used: POB lexical and theological decisions for κόπος, κενός, and ἐν κυρίῳ
  rationale: A separate sentence replaces the dense participle and explains the idiom “not in vain” in ordinary English.
translation_notes:
  risk_flags:
  - risk: “Give yourselves fully” could be heard as emphasizing commitment more than abundant activity.
    mitigation: “Always” and “to the Lord’s work” retain the ongoing activity and its broad scope.
  - risk: “Brothers” may sound as though only men are addressed.
    mitigation: The footnote preserves the documented inclusive force for the whole church.
