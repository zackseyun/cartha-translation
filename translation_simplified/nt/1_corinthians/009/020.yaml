translation:
  language: en
  text: With the Jews, I lived like a Jew so that I could win them over. With those under the law,[a] I lived like someone under the law—even though I myself am not under the law—so that I could win them over.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “The law” here most likely means the law given through Moses.
    reason: cultural_note
simplification_decisions:
- pob_phrase: to the Jews I became as a Jew
  simplified_phrase: With the Jews, I lived like a Jew
  preserved_meaning: Paul adapted his conduct to Jewish people without implying that he ceased to be ethnically Jewish.
  reasoning_layer_used: lexical decision for ἐγενόμην and the repeated comparative ὡς
  rationale: The wording expresses an adopted way of living in ordinary English while keeping the comparison.
- pob_phrase: so that I might win Jews
  simplified_phrase: so that I could win them over
  preserved_meaning: Paul's purpose was to gain people through his missionary work.
  reasoning_layer_used: lexical decision for κερδαίνω
  rationale: “Win them over” makes the idiomatic sense clearer than “win Jews.”
- pob_phrase: to those under the law, as under the law
  simplified_phrase: With those under the law, I lived like someone under the law
  preserved_meaning: Paul adapted his conduct to people governed by the law while denying that he shared their status.
  reasoning_layer_used: lexical and theological decisions on νόμος and Paul's status
  rationale: The fuller comparison clarifies the compressed wording without resolving what “not under the law” means.
translation_notes:
  risk_flags:
  - risk: “Lived like a Jew” could be mistaken to mean that Paul was not ethnically Jewish.
    mitigation: The comparative wording presents adapted conduct, and the audit explicitly preserves Paul's Jewish ethnicity.
  - risk: Modern readers may not know which law is meant.
    mitigation: The footnote identifies the Mosaic law as the most likely referent while leaving the main text's broader wording intact.
