translation:
  language: en
  text: Among people who were not under the law of Moses, I lived like someone who was not under it, so that I might win them. Yet I was not outside God’s law, but under the Messiah’s law.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “within the Messiah’s law.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: To those outside the law, as one outside the law
  simplified_phrase: Among people who were not under the law of Moses, I lived like someone who was not under it
  preserved_meaning: Paul adapted his way of life among Gentiles without calling them morally lawless.
  reasoning_layer_used: Lexical and theological decisions on ἄνομος
  rationale: The rewrite states the covenantal meaning and turns the compressed phrase into a natural sentence.
- pob_phrase: though not being outside God’s law but under Messiah’s law
  simplified_phrase: Yet I was not outside God’s law, but under the Messiah’s law
  preserved_meaning: Paul remained morally accountable to God through the Messiah.
  reasoning_layer_used: Theological decision on ἔννομος Χριστοῦ
  rationale: A separate contrast sentence makes Paul’s qualification easier to follow.
- pob_phrase: so that I might win those outside the law
  simplified_phrase: so that I might win them
  preserved_meaning: Paul’s purpose was to win those same people over.
  reasoning_layer_used: Lexical decision on κερδάνω and immediate context
  rationale: The pronoun removes needless repetition while keeping the evangelistic purpose.
interpretive_expansions:
- pob_phrase: outside the law
  rendering: not under the law of Moses
  claim: The law in this contrast is the Mosaic law rather than moral law in general.
  evidence:
  - The immediate context contrasts those under the law with those outside it.
  - The POB lexical decision identifies the referents as people not under the Mosaic law.
  - Paul’s qualification rules out moral lawlessness.
  confidence: high
  alternatives_preserved:
  - without the law
  - outside the law
translation_notes:
  risk_flags:
  - risk: “I lived like” could be mistaken for complete conformity to Gentile behavior.
    mitigation: The next sentence clearly limits Paul’s adaptation by affirming his accountability under the Messiah’s law.
