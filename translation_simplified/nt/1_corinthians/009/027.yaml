translation:
  language: en
  text: But I discipline my body severely[a] and force it to serve me as a servant. Otherwise, after preaching to others, I myself might end up disqualified.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek can literally mean “pummel my body,” but here it pictures strict self-discipline.
    reason: lexical_alternative
  - marker: b
    text: “Disqualified” may also mean “rejected” or “unapproved”; the wording does not specify whether Paul means loss of salvation, reward, or ministry approval.
    reason: alternative_reading
