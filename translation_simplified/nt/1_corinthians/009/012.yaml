  text: If others have the right to receive support from you, do we not have an even greater right? Yet we have not used this right. Instead, we endure everything so that we do not put any obstacle in the way of the gospel of the Messiah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditional English often says “the gospel of Christ”; here “Messiah” preserves the title’s meaning.
    reason: lexical_alternative
