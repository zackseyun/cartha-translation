  rationale: “Really” keeps the rhetorical emphasis, while “for our benefit” makes “for our sake” immediately clear.
- pob_phrase: the one who plows ought to plow
  simplified_phrase: the person who plows should plow
  preserved_meaning: A worker rightly labors with an expectation of benefit.
  reasoning_layer_used: Lexical decisions for ὀφείλει and ὁ ἀροτριῶν
  rationale: “Person” and “should” express the generic worker and appropriate expectation in common English.
- pob_phrase: in hope of sharing
  simplified_phrase: with the same hope
  preserved_meaning: The one threshing shares the same expectation already stated for the one plowing.
  reasoning_layer_used: Source parallelism and lexical decision for ἐπ’ ἐλπίδι
  rationale: This avoids cumbersome repetition without merging the two farming actions.
