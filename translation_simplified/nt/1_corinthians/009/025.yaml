translation:
  language: en
  text: Every competitor practices self-control in every area. They do this to receive a crown[a] that will fade away, but we do it to receive a crown that will never fade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word means the victor’s wreath awarded in an athletic contest.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Everyone who competes
  simplified_phrase: Every competitor
  preserved_meaning: The wording still includes anyone engaged in the athletic contest.
  reasoning_layer_used: POB lexical decision for ἀγωνιζόμενος and immediate athletic context
  rationale: The noun form is shorter and more natural while keeping the contest image.
- pob_phrase: exercises self-control in all things
  simplified_phrase: practices self-control in every area
  preserved_meaning: Competitors habitually restrain themselves in every respect.
  reasoning_layer_used: POB lexical decisions for πάντα and ἐγκρατεύεται
  rationale: Common wording preserves both habitual discipline and its broad scope.
- pob_phrase: a perishable crown ... an imperishable one
  simplified_phrase: a crown that will fade away ... a crown that will never fade
  preserved_meaning: The athletes’ reward is temporary, while the believers’ reward endures.
  reasoning_layer_used: POB lexical and theological decisions for φθαρτός, στέφανος, and ἄφθαρτος
  rationale: The paired fading image makes the contrast clear without defining the reward more narrowly.
