translation:
  language: en
  text: Even if others do not recognize me as an apostle, I certainly am an apostle to you. You are the seal—the proof that confirms my apostleship in the Lord.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: If I am not an apostle to others
  simplified_phrase: Even if others do not recognize me as an apostle
  preserved_meaning: Paul acknowledges that others may deny his apostleship without conceding that their denial is true.
  reasoning_layer_used: theological decision on the force of Paul's claim
  rationale: The wording makes the rhetorical condition clear without limiting Paul's office.
- pob_phrase: yet I certainly am to you
  simplified_phrase: I certainly am an apostle to you
  preserved_meaning: Paul emphatically claims an apostolic relationship with the Corinthians.
  reasoning_layer_used: lexical decisions for ἀλλά γε and ἄλλοις
  rationale: Repeating “apostle” supplies the omitted complement while avoiding the possessive “your apostle.”
- pob_phrase: for you are the seal of my apostleship
  simplified_phrase: You are the seal—the proof that confirms my apostleship
  preserved_meaning: The Corinthians authenticate Paul's apostolic commission while the source image remains visible.
  reasoning_layer_used: lexical decision for σφραγίς and theological decision
  rationale: The added explanation makes the seal's authenticating force immediately understandable.
interpretive_expansions:
- pob_phrase: If I am not an apostle to others
  rendering: Even if others do not recognize me as an apostle
  claim: The condition concerns others' denial of Paul's apostleship, not Paul's admission that his office is limited.
  evidence:
  - The theological rationale identifies the statement as defensive and rhetorical rather than a literal limitation.
  confidence: high
  alternatives_preserved:
  - Even if I am no apostle to others
- pob_phrase: the seal of my apostleship
  rendering: the seal—the proof that confirms my apostleship
  claim: The Corinthians serve as validating evidence that Paul's apostleship is genuine.
  evidence:
  - The lexical rationale says σφραγίς depicts a seal that authenticates something as genuine.
  - The theological rationale grounds Paul's claim in the Corinthians' existence as a church.
  confidence: high
  alternatives_preserved:
  - seal
  - proof
  - authentication
translation_notes:
  risk_flags:
  - risk: “Do not recognize” makes the rhetorical force more explicit than the POB wording.
    mitigation: The POB theological rationale expressly says some may deny Paul's apostleship and rejects a literal limitation of it.
  - risk: Modern readers may still find “in the Lord” compressed.
    mitigation: The phrase is retained because the audit identifies it as a significant Pauline expression locating the Corinthians within their relationship to the Lord.
