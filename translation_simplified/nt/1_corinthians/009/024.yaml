  preserved_meaning: Everyone participating in the race is included.
  reasoning_layer_used: POB lexical alternative for τρέχοντες
  rationale: The shorter noun is natural English and preserves the repeated idea of running.
- pob_phrase: so that you may obtain it
  simplified_phrase: so that you may obtain the prize
  preserved_meaning: The command still urges purposeful effort toward the stated prize.
  reasoning_layer_used: POB lexical decision for ἵνα καταλάβητε
