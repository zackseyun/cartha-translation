translation:
  language: en
  text: For I am not aware of anything against me. But the fact that I know of nothing against me does not mean I am justified.[a] It is the Lord who examines me.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “acquitted” or “vindicated.” The word “justified” has the sense of being declared right in a legal judgment.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: For I am aware of nothing against myself
  simplified_phrase: For I am not aware of anything against me.
  preserved_meaning: Paul knows of no charge against himself and presents this as an explanation.
  reasoning_layer_used: Lexical decisions for γὰρ, οὐδὲν, ἐμαυτῷ, and σύνοιδα
  rationale: The direct wording keeps the explanatory link and total negation in natural English.
- pob_phrase: but I am not justified by this
  simplified_phrase: But the fact that I know of nothing against me does not mean I am justified.
  preserved_meaning: Paul’s favorable self-assessment is not the basis for a favorable verdict.
  reasoning_layer_used: Theological decision on the forensic nuance of δεδικαίωμαι
  rationale: The sentence explains what “this” means while retaining Paul’s key term “justified.”
- pob_phrase: the one who examines me is the Lord
  simplified_phrase: It is the Lord who examines me.
  preserved_meaning: The Lord, not Paul himself, carries out the authoritative scrutiny.
  reasoning_layer_used: Lexical decisions for ἀνακρίνων and κύριος
  rationale: The recast sentence reads naturally without turning examination into final condemnation.
interpretive_expansions:
- pob_phrase: by this
  rendering: the fact that I know of nothing against me
  claim: “This” refers to Paul’s awareness of no charge against himself.
  evidence:
