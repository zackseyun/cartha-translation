simplification_decisions:
- pob_phrase: We are fools for Messiah
  simplified_phrase: We are fools for the Messiah’s sake
  preserved_meaning: The apostles are called fools because of their commitment to the Messiah.
  reasoning_layer_used: Lexical decision for μωροί and διὰ Χριστόν
  rationale: “For the Messiah’s sake” clearly expresses the phrase’s causal or purposeful force without adding a perception verb.
- pob_phrase: we are weak, but you are strong; you are honored, but we are dishonored
  simplified_phrase: We are weak, but you are strong. You are honored, but we are dishonored.
  preserved_meaning: Paul’s emphatic contrasts between the apostles and Corinthians remain distinct.
  reasoning_layer_used: Lexical decisions and Greek pronoun contrast
  rationale: Short sentences make the three-part contrast easier to follow while preserving its parallel force.
translation_notes:
