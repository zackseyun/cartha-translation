translation:
  language: en
  text: For who makes you different from anyone else?[a] What do you have that you did not receive? If you received it, why do you boast as though it came from you?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Who distinguishes you from others?”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: For who makes you different?
  simplified_phrase: For who makes you different from anyone else?
  preserved_meaning: Paul challenges any claimed superiority over other people.
  reasoning_layer_used: POB lexical rationale and immediate context
  rationale: Adding “from anyone else” makes the comparison clear without narrowing its basis.
- pob_phrase: And if you did receive it
  simplified_phrase: If you received it
  preserved_meaning: The question assumes the thing possessed was received rather than self-produced.
  reasoning_layer_used: POB lexical rationale
  rationale: The shorter clause keeps the emphatic logic clear in natural English.
- pob_phrase: as if you had not received it
  simplified_phrase: as though it came from you
  preserved_meaning: Boasting wrongly treats a received advantage as self-originated.
  reasoning_layer_used: POB lexical and theological rationale
  rationale: The recasting states the contrast in language a modern reader can grasp immediately.
interpretive_expansions:
- pob_phrase: as if you had not received it
  rendering: as though it came from you
  claim: Not receiving the advantage implies that it originated with the person boasting.
  evidence:
  - The preceding question says every possession or endowment was received.
  - The POB rationale contrasts received things with what is self-generated.
  confidence: high
  alternatives_preserved:
  - as if you had not received it
translation_notes:
  risk_flags:
  - risk: “Came from you” makes the self-originating implication more explicit than the Greek wording.
    mitigation: The implication is directly supported by the repeated contrast between possessing and receiving.
