translation:
  language: en
  text: But I will come to you soon, if the Lord is willing. Then I will find out not what those who are puffed up with pride say, but what power they have.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: if the Lord wills
  simplified_phrase: if the Lord is willing
  preserved_meaning: Paul’s plans remain dependent on the Lord’s will.
  reasoning_layer_used: lexical and theological decisions
  rationale: This natural wording keeps the condition and leaves the title “Lord” unspecified.
- pob_phrase: the speech of those who are puffed up
  simplified_phrase: what those who are puffed up with pride say
  preserved_meaning: Paul refers to the claims of conceited people while retaining his inflation image.
  reasoning_layer_used: lexical decision and cross-reference note
  rationale: The wording explains the metaphor and replaces formal “speech” with an ordinary verb.
- pob_phrase: but the power
  simplified_phrase: but what power they have
  preserved_meaning: Paul contrasts their words with their power without defining what form that power takes.
  reasoning_layer_used: lexical and theological decisions
  rationale: The added pronoun makes the shared connection to the conceited people clear in English.
interpretive_expansions:
- pob_phrase: puffed up
  rendering: puffed up with pride
  claim: The inflation image describes an ongoing state of pride or conceit.
  evidence:
  - The lexical rationale identifies the expression as an ongoing state of conceit.
  - The POB note says Paul uses this term for people inflated with pride.
  confidence: high
  alternatives_preserved:
  - arrogant
  - inflated with pride
- pob_phrase: but the power
  rendering: but what power they have
  claim: The power being assessed is associated with the same conceited people whose words Paul will assess.
  evidence:
  - The Greek contrast places “speech” and “power” under the continuing reference to those who are puffed up.
  - The POB lexical alternatives include “the power they have” and “their power.”
  confidence: high
  alternatives_preserved:
  - but their power
  - but the power
translation_notes:
  risk_flags:
  - risk: “What power they have” may sound as though power is a personal possession.
    mitigation: The wording only clarifies the contextual connection and leaves the nature of the power undefined.
