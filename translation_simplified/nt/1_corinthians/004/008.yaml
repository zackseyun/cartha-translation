translation:
  language: en
  text: You are already full and satisfied! You are already rich! You have become kings without us! If only you really had become kings, so that we could reign with you too.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Paul is speaking ironically. The Corinthians act as if they are already fully satisfied, rich, and reigning as kings.
    reason: cultural_note
simplification_decisions:
- pob_phrase: Already you have had your fill
  simplified_phrase: You are already full and satisfied!
  preserved_meaning: The wording keeps the image of being completely filled while making the resulting satisfaction clear.
  reasoning_layer_used: lexical decision for κεκορεσμένοι ἐστέ
  rationale: The clearer phrase preserves both the completed fullness and Paul's irony.
- pob_phrase: apart from us
  simplified_phrase: without us
  preserved_meaning: The Corinthians imagine that they have reached royal status independently of the apostles.
  reasoning_layer_used: lexical decision for χωρὶς ἡμῶν
  rationale: “Without us” is the simpler documented alternative.
- pob_phrase: And I wish indeed that you had become kings
  simplified_phrase: If only you really had become kings
  preserved_meaning: Paul's ironic rebuke turns into an earnest wish that their reign were genuine.
  reasoning_layer_used: lexical decision for ὄφελόν γε and theological decision on tone
  rationale: “If only” states the unreal wish naturally in modern English.
interpretive_expansions:
- pob_phrase: you had become kings
  rendering: you really had become kings
  claim: Their supposed reign is not yet genuine.
  evidence:
  - The wish clause contrasts their claimed reign with the reign Paul actually desires.
  - The immediate context contrasts Corinthian self-perception with apostolic suffering.
  confidence: high
  alternatives_preserved:
  - The royal language remains figurative and is not reduced to general success.
translation_notes:
  risk_flags:
  - risk: The opening claims could be mistaken for sincere praise.
    mitigation: Exclamation marks convey the sharp tone, and the footnote identifies the irony.
