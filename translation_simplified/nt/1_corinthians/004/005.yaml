translation:
  language: en
  text: Therefore, do not pass judgment on anything before the right time. Wait until the Lord comes. He will bring into the light what is hidden in darkness and reveal what people intend in their hearts. Then each person’s praise will come from God.
  philosophy: optimal-equivalence
