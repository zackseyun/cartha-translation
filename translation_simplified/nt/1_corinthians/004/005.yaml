  preserved_meaning: Human judgment must not come prematurely, before the Lord’s coming.
  reasoning_layer_used: lexical and theological decisions on timing and judgment
  rationale: Two short sentences clarify that the Lord’s coming sets the proper time.
- pob_phrase: bring to light the hidden things of darkness
  simplified_phrase: bring into the light what is hidden in darkness
  preserved_meaning: The Lord will expose realities now concealed in darkness.
  reasoning_layer_used: lexical decision for φωτίσει and τὰ κρυπτὰ τοῦ σκότους
  rationale: The recast keeps the light-and-darkness image in natural English.
- pob_phrase: reveal the purposes of the hearts
