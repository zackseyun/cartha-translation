translation:
  language: en
  text: When any one of you has a case against another, how dare he take it to the unrighteous[a] for judgment instead of bringing it before the saints—God’s holy people?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the unjust.” Some translations say “unbelievers,” but the Greek says “the unrighteous.”
