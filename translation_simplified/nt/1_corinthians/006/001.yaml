simplification_decisions:
- pob_phrase: Does any one of you dare
  simplified_phrase: how dare he
  preserved_meaning: Paul’s question expresses strong disapproval of this audacious action.
  reasoning_layer_used: Lexical decision for Τολμᾷ and rhetorical syntax
  rationale: The recast question sounds natural while preserving Paul’s forceful challenge.
- pob_phrase: to be judged before the unrighteous
  simplified_phrase: take it to the unrighteous for judgment
  preserved_meaning: The believer brings the dispute before morally charged outside judges.
  reasoning_layer_used: Lexical decisions for κρίνεσθαι and ἐπὶ τῶν ἀδίκων
  rationale: The active English wording makes the court action immediately clear without replacing “unrighteous.”
- pob_phrase: and not before the saints
  simplified_phrase: instead of bringing it before the saints—God’s holy people
  preserved_meaning: The dispute should be brought before the Christian community rather than the unrighteous.
  reasoning_layer_used: Lexical and theological decisions for καὶ οὐχὶ and ἐπὶ τῶν ἁγίων
  rationale: “Instead of” clarifies the contrast, and the apposition explains the biblical term “saints.”
interpretive_expansions:
- pob_phrase: the saints
  rendering: the saints—God’s holy people
  claim: Here “saints” means the community of believers addressed by Paul.
  evidence:
