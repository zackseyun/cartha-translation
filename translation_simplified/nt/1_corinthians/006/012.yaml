translation:
  language: en
  text: “I am allowed to do anything,”[a] but not everything is beneficial. “I am allowed to do anything,” but I will not be controlled by anything.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek can also be read without quotation marks. Many understand these words as a Corinthian slogan that Paul quotes and then corrects.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: All things are lawful for me
  simplified_phrase: I am allowed to do anything
  preserved_meaning: The broad claim that every action is permitted remains intact.
  reasoning_layer_used: Lexical decision for Πάντα μοι ἔξεστιν and the theological decision to present it as a slogan
  rationale: The active wording is easier to understand while retaining the slogan’s sweeping ethical claim.
- pob_phrase: but not all things are beneficial
  simplified_phrase: but not everything is beneficial
  preserved_meaning: Permission does not mean that every action is beneficial.
  reasoning_layer_used: Lexical decision for συμφέρει
  rationale: Using “everything” avoids stiff repetition without weakening Paul’s qualification.
- pob_phrase: but I will not be mastered by anything
  simplified_phrase: but I will not be controlled by anything
  preserved_meaning: Paul refuses to come under the power of any behavior, appetite, or thing.
  reasoning_layer_used: Lexical decisions for ἐξουσιασθήσομαι and ὑπό τινος, confirmed by the grounding review
  rationale: The passive wording clearly preserves domination without implying that it occurs only with Paul’s consent.
translation_notes:
  risk_flags:
  - risk: Quotation marks interpret the repeated claim as a Corinthian slogan, though the Greek does not mark quotations.
    mitigation: The footnote preserves the reading that these are Paul’s own qualified words.
  - risk: “Allowed” is less juridical than “lawful.”
    mitigation: It retains the core sense of permission while Paul’s qualifications preserve the ethical force.
