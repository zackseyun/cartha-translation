translation:
  language: en
  text: 'Or do you not realize that unrighteous people will not inherit the kingdom of God? Do not be deceived: people who are sexually immoral, people who worship idols, adulterers, effeminate men,[a] and men who have sex with men[b] will not inherit God’s kingdom.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek term may mean “soft men,” “effeminate men,” morally weak men, or possibly male prostitutes or passive partners in male-male intercourse.
    reason: lexical_alternative
  - marker: b
    text: The Greek term is rare and debated; it may also be translated “men who practice homosexuality,” “sodomites,” or more broadly “men who engage in illicit sex with males.”
    reason: lexical_alternative
