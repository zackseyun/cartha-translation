translation:
  language: en
  text: Food is for the stomach, and the stomach for food.[a] But God will bring both to an end.[b] The body, however, is not for sexual immorality. It is for the Lord, and the Lord is for the body.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Many interpreters understand these words as a saying used by the Corinthians, but the Greek does not mark them as a quotation.
    reason: alternative_reading
  - marker: b
    text: Or “God will do away with both”; the Greek refers to food and the stomach.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: God will do away with both it and them
  simplified_phrase: God will bring both to an end
  preserved_meaning: God will end the temporary function of food and the stomach without necessarily implying annihilation.
  reasoning_layer_used: Lexical decision for καταργήσει and its pronoun references
  rationale: This removes confusing pronouns while preserving future cessation.
- pob_phrase: But the body is not for sexual immorality, but for the Lord
  simplified_phrase: The body, however, is not for sexual immorality. It is for the Lord
  preserved_meaning: The body is for the Lord rather than for sexual immorality.
  reasoning_layer_used: Lexical decisions for σῶμα, πορνείᾳ, and κύριος
  rationale: Two short sentences clarify the contrast without adding explicit purpose.
- pob_phrase: and the Lord for the body
  simplified_phrase: and the Lord is for the body
  preserved_meaning: Paul states a concise reciprocal relationship between the Lord and the body.
  reasoning_layer_used: Theological decision to retain reciprocal wording
  rationale: Supplying only the verb makes the clause natural without defining the relationship.
translation_notes:
  risk_flags:
  - risk: The repeated word “for” leaves the exact relationships compact and undefined.
    mitigation: This preserves the deliberate ambiguity of the Greek and POB reasoning.
  - risk: Readers may miss the possible Corinthian-slogan interpretation.
    mitigation: Footnote a preserves that ambiguity without deciding it in the main text.
