translation:
  language: en
  text: Or do you not know that the saints—God’s holy people—will judge the world? And if you will take part in judging the world, are you unfit to judge even the smallest cases?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “to serve in even the smallest courts.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the saints
  simplified_phrase: the saints—God’s holy people
  preserved_meaning: The saints are believers set apart to God, not an elite class of Christians.
  reasoning_layer_used: POB lexical and theological decisions on οἱ ἅγιοι
  rationale: The brief explanation prevents readers from mistaking “saints” for specially canonized people.
- pob_phrase: if the world is judged by you
  simplified_phrase: if you will take part in judging the world
  preserved_meaning: Believers will genuinely participate in future judgment without defining exactly how.
  reasoning_layer_used: POB decision on ἐν ὑμῖν and theological decision on future judgment
  rationale: The active wording makes the contextual sense clear while avoiding a claim of independent authority.
- pob_phrase: are you unworthy of the smallest courts?
  simplified_phrase: are you unfit to judge even the smallest cases?
  preserved_meaning: Paul sharply questions their fitness to handle matters of very little importance.
  reasoning_layer_used: POB lexical decisions on ἀνάξιοι, κριτήρια, and ἐλάχιστα
  rationale: Common judicial language communicates the point more naturally, while the footnote preserves the alternative image of courts.
interpretive_expansions:
- pob_phrase: the saints
  rendering: the saints—God’s holy people
  claim: Here “saints” means believers as a whole.
  evidence:
  - The POB theological decision identifies the saints as believers, the people of God.
  - The POB lexical rationale says this is the ordinary Pauline use.
  confidence: high
  alternatives_preserved:
  - A narrower group of especially holy believers is not adopted.
- pob_phrase: the world is judged by you
  rendering: you will take part in judging the world
  claim: Believers participate in the future judgment rather than necessarily exercising it independently.
  evidence:
  - The POB rationale takes ἐν ὑμῖν instrumentally or associatively.
  - The POB theological decision affirms real participation without specifying its mode.
  confidence: high
  alternatives_preserved:
  - The exact manner of participation remains unspecified.
  - Independent judicial authority is not asserted.
