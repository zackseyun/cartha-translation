translation:
  language: en
  text: Do you not realize that your bodies are parts of the Messiah? Should I then take these parts of the Messiah and make them parts of a prostitute? May that never happen![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Messiah” may also be translated “Christ.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Do you not know
  simplified_phrase: Do you not realize
  preserved_meaning: Paul appeals to something the readers should already understand.
  reasoning_layer_used: POB lexical decision for οὐκ οἴδατε
  rationale: “Realize” makes the rhetorical appeal more immediate in modern English.
- pob_phrase: members of Messiah
  simplified_phrase: parts of the Messiah
  preserved_meaning: Believers’ bodies belong to the Messiah as parts of a larger whole.
  reasoning_layer_used: POB lexical and theological decisions for μέλη and Χριστοῦ
  rationale: “Parts” clarifies the body image while retaining “Messiah” as the controlling title.
- pob_phrase: May it never be
  simplified_phrase: May that never happen!
  preserved_meaning: Paul forcefully rejects the proposed action.
  reasoning_layer_used: POB lexical and theological decisions for μὴ γένοιτο
  rationale: The added referent makes the strong repudiation immediately clear.
