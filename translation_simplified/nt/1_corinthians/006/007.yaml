  review_summary: 'The draft effectively makes Paul’s central point explicit: the existence of lawsuits among believers is itself the present defeat, not merely an unfavorable court result. “Lawsuits against one another” is contextually warranted and clearer than “among yourselves,” and “cheated” is an appropriate common-English rendering. Revise the two final questions because “allow yourselves” introduces an unsupported nuance of consenting to wrongdoing. Removing it preserves the passive force and Paul’s rhetorical challenge while remaining clear.'
