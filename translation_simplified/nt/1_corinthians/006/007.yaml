simplification_decisions:
- pob_phrase: Indeed, then, it is already altogether a defeat for you that
  simplified_phrase: Already, the very fact that ... is a complete defeat for you
  preserved_meaning: The lawsuits themselves already constitute a total defeat, regardless of their outcome.
  reasoning_layer_used: Lexical decisions for ἤδη, ὅλως, ἥττημα, and ὅτι
  rationale: The reordered clause states Paul's conclusion directly while preserving its timing, intensity, and force.
- pob_phrase: lawsuits among yourselves
  simplified_phrase: lawsuits against one another
  preserved_meaning: Members of the community are bringing legal disputes against each other.
  reasoning_layer_used: Lexical decisions for κρίματα and μεθ’ ἑαυτῶν
  rationale: Against one another makes the reciprocal legal conflict immediately clear.
- pob_phrase: Why not rather be wronged? Why not rather be defrauded?
  simplified_phrase: Why not be wronged instead? Why not be cheated instead?
  preserved_meaning: Paul challenges them to endure injustice or loss rather than pursue these lawsuits.
  reasoning_layer_used: Lexical decisions for διὰ τί οὐχὶ μᾶλλον, ἀδικεῖσθε, and ἀποστερεῖσθε
  rationale: Instead preserves the contrast, and cheated is more common English than defrauded without adding consent.
translation_notes:
  risk_flags:
  - risk: Defeat could be mistaken for losing a court case.
    mitigation: The phrase “the very fact that you have lawsuits” identifies the lawsuits themselves as the defeat.
