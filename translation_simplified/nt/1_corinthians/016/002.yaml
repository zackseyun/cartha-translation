translation:
  language: en
  text: On the first day of each week, each of you should personally[a] set aside and save some money, according to how much you have prospered. Do this so that no collections will need to be taken when I come.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may mean that each person should save the money privately, possibly at home.
    reason: lexical_alternative
