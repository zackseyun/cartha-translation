translation:
  language: en
  text: As for our brother Apollos,[a] I strongly urged him to come to you with the brothers. But he definitely did not want to come now. He will come when he has the opportunity.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Greek has “the brother” without explicitly saying “our.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Concerning Apollos our brother
  simplified_phrase: As for our brother Apollos
  preserved_meaning: Paul introduces Apollos as the next subject and identifies him as a fellow believer.
  reasoning_layer_used: POB lexical decision and applied revision
  rationale: “As for” is a natural way to introduce a new subject in modern English.
- pob_phrase: it was not at all his will to come now
  simplified_phrase: he definitely did not want to come now
  preserved_meaning: The decision was Apollos’s own emphatic unwillingness, not a statement about God’s will.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The active wording makes the implied subject clear while retaining the strong negative force.
- pob_phrase: Yet he will come when he has opportunity
  simplified_phrase: He will come when he has the opportunity
  preserved_meaning: Apollos still intends to come when a suitable time becomes available.
  reasoning_layer_used: POB lexical decision
  rationale: Adding “the” produces ordinary English without reducing opportunity to mere convenience.
translation_notes:
  risk_flags:
  - risk: “Did not want” may sound less formal than the noun “will.”
    mitigation: “Definitely” preserves the emphatic force, and the theological audit confirms that the will is Apollos’s.
