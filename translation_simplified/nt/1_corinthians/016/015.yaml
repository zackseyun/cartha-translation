translation:
  language: en
  text: 'Brothers,[a] I urge you: you know the household of Stephanas. They were among the first believers in Achaia—its “firstfruits”[b]—and they devoted themselves to serving the saints, God’s people.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “brothers and sisters”; the Greek form can address the whole congregation.
    reason: lexical_alternative
  - marker: b
    text: “Firstfruits” pictures them as the first part of a harvest set apart for God.
    reason: lexical_alternative
