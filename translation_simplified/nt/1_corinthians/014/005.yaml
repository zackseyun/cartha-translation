translation:
  language: en
  text: I want all of you to speak in tongues, but even more, I want you to prophesy. A person who prophesies benefits the church more than someone who speaks in tongues, unless the tongue-speaker interprets what was said.[a] This is so that the church may be built up.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “unless someone interprets.” The Greek could refer either to the tongue-speaker or, in the wider context, to another interpreter.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: but even more that you would prophesy
  simplified_phrase: but even more, I want you to prophesy
  preserved_meaning: Paul prefers prophecy without rejecting speaking in tongues.
  reasoning_layer_used: Lexical decisions for μᾶλλον δὲ and ἵνα προφητεύητε.
  rationale: Repeating “I want” makes the comparison immediately clear.
- pob_phrase: The one who prophesies is greater than the one who speaks in tongues
  simplified_phrase: A person who prophesies benefits the church more than someone who speaks in tongues
  preserved_meaning: Prophecy is more useful for the gathered church, not evidence of greater personal holiness.
  reasoning_layer_used: Theological decision on the relative superiority of prophecy.
  rationale: The functional wording avoids suggesting a higher spiritual rank.
- pob_phrase: so that the church may receive edification
  simplified_phrase: This is so that the church may be built up
  preserved_meaning: Interpretation serves the purpose of strengthening the gathered church.
  reasoning_layer_used: Lexical decision for οἰκοδομὴν λάβῃ and the grounding review.
  rationale: “So that” retains the purpose relation, while “built up” preserves the source image.
