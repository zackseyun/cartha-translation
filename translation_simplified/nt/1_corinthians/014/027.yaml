simplification_decisions:
- pob_phrase: If anyone speaks in a tongue
  simplified_phrase: If anyone speaks in a tongue
  preserved_meaning: The condition applies generally to any prospective speaker without defining the nature of the gift.
  reasoning_layer_used: Lexical decisions for τις and γλώσσῃ, with the theological decision to retain “tongue.”
  rationale: Keeping “anyone” preserves the singular, open-ended condition identified by the review.
- pob_phrase: let there be two, or at most three, and each in turn
  simplified_phrase: only two, or at most three, should speak, one at a time
  preserved_meaning: No more than three may speak, and they must speak separately rather than simultaneously.
  reasoning_layer_used: Lexical decisions for κατὰ δύο ἢ τὸ πλεῖστον τρεῖς and ἀνὰ μέρος.
  rationale: The direct wording clearly states both the numerical limit and the required order.
- pob_phrase: let one interpret
  simplified_phrase: One person must interpret
  preserved_meaning: A single person is required to make the tongue-speech intelligible to the assembly.
  reasoning_layer_used: Lexical decisions for εἷς and διερμηνευέτω.
  rationale: “Must” communicates the command’s force in ordinary modern English.
translation_notes:
  risk_flags:
  - risk: Readers may take “tongue” to mean only ecstatic speech or only a foreign language.
    mitigation: The footnote preserves “language” as an alternative and leaves the gift’s exact nature unresolved.
