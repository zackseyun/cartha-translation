translation:
  language: en
  text: If anyone speaks in a tongue,[a] only two, or at most three, should speak, one at a time. One person must interpret.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “in a language.” “Tongue” leaves open the exact nature of this spiritual gift.
