translation:
  language: en
  text: 'So what does this mean, brothers?[a] When you come together, each person has something to contribute: a psalm, a teaching, a revelation, a tongue,[b] and an interpretation. Everything must be done to build up the congregation.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Brothers” addresses the whole congregation, including women as well as men.
    reason: lexical_alternative
  - marker: b
    text: Or “a language.” “Tongue” preserves Paul’s term without deciding the precise kind of speech.
    reason: alternative_reading
