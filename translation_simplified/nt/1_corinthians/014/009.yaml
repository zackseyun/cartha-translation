translation:
  language: en
  text: In the same way, if you do not use your tongue to speak in a way people can understand, how can they understand what you say? You will be speaking into the air.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: So also with you
  simplified_phrase: In the same way
  preserved_meaning: Paul applies the preceding comparison to the Corinthians.
  reasoning_layer_used: Lexical decision for οὕτως καὶ ὑμεῖς.
  rationale: This transition naturally connects the verse to the preceding illustration.
- pob_phrase: if through the tongue you do not give intelligible speech
  simplified_phrase: if you do not use your tongue to speak in a way people can understand
  preserved_meaning: Speech must be recognizable and understandable to its hearers.
  reasoning_layer_used: Lexical decisions for διὰ τῆς γλώσσης, εὔσημον λόγον, and δῶτε.
  rationale: The wording retains the tongue image while avoiding a narrow reference to pronunciation.
- pob_phrase: how will what is spoken be understood?
  simplified_phrase: how can they understand what you say?
  preserved_meaning: Hearers cannot understand speech that does not communicate intelligibly.
  reasoning_layer_used: Lexical decisions for πῶς γνωσθήσεται and τὸ λαλούμενον.
  rationale: The active question states the same communicative point in ordinary English.
interpretive_expansions:
- pob_phrase: intelligible speech
  rendering: speak in a way people can understand
  claim: The speech must communicate meaning that hearers can understand, not merely be pronounced clearly.
  evidence:
  - The POB footnote defines the speech as recognizable and understandable to hearers.
  - The lexical rationale emphasizes comprehensibility.
  confidence: high
  alternatives_preserved:
  - distinct speech
  - a clear message
translation_notes:
  risk_flags:
  - risk: Making the hearers explicit could appear to add a new group.
    mitigation: The passive “be understood” already implies people who hear and understand the speech.
