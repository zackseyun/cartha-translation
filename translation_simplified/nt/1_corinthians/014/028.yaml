translation:
  language: en
  text: But if no one is there to interpret, the speaker must not speak publicly when the church gathers. Instead, he should speak to himself and to God.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: if there is no interpreter
  simplified_phrase: if no one is there to interpret
  preserved_meaning: No person is present to make the tongue understandable to others.
  reasoning_layer_used: POB lexical decision for διερμηνευτής
  rationale: The verb phrase is easier for a new reader while preserving the interpreter’s role.
- pob_phrase: keep silent in the church
  simplified_phrase: must not speak publicly when the church gathers
  preserved_meaning: The speaker may not address the gathered congregation without interpretation.
  reasoning_layer_used: POB theological decision on the scope of silence and lexical decision for ἐν ἐκκλησίᾳ
  rationale: This wording makes the setting and limited scope of the command clear.
- pob_phrase: and speak to himself and to God
  simplified_phrase: Instead, he should speak to himself and to God
  preserved_meaning: Speech not directed to the congregation may continue toward himself and God.
  reasoning_layer_used: POB lexical decisions for ἑαυτῷ, λαλείτω, and τῷ θεῷ
  rationale: A new sentence and “Instead” make the contrast easy to follow.
interpretive_expansions:
- pob_phrase: keep silent in the church
  rendering: must not speak publicly when the church gathers
  claim: The silence command restricts speech addressed to the congregation rather than every kind of speech.
  evidence:
  - The verse contrasts silence in the gathered church with speaking to oneself and to God.
  - The POB theological decision identifies public congregational speech as the command’s scope.
  confidence: high
  alternatives_preserved:
  - The speaker still speaks to himself and to God.
  - The wording does not define whether that nonpublic speech is audible.
