translation:
  language: en
  text: For if I pray using a tongue,[a] my spirit prays, but my mind is unproductive.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “using a language.” Here “tongue” refers to the Spirit-enabled speech discussed throughout this chapter, though the Greek word can also mean a human language.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: pray in a tongue
  simplified_phrase: pray using a tongue
  preserved_meaning: The prayer is expressed through the kind of speech Paul calls a tongue.
  reasoning_layer_used: Lexical decision for γλώσσῃ and immediate chapter context
  rationale: “Using” makes the relationship between the prayer and the tongue clearer without deciding what kind of language it is.
- pob_phrase: my mind is unfruitful
  simplified_phrase: my mind is unproductive
  preserved_meaning: The mind does not produce fruit, though the verse leaves the missing result unspecified.
  reasoning_layer_used: Lexical alternative for ἄκαρπος and grounding review
  rationale: “Unproductive” states the metaphor’s basic sense in common English without adding a particular result.
translation_notes:
  risk_flags:
  - risk: Modern readers may understand “tongue” only as a body part.
    mitigation: The footnote explains its special sense and preserves “language” as an alternative.
  - risk: “My spirit” could be mistaken for a direct reference to the Holy Spirit.
    mitigation: Lowercase wording follows the POB decision without making a stronger doctrinal claim.
