translation:
  language: en
  text: So the person who speaks in a tongue[a] should pray that he[b] may interpret it.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “in a language.” Here “tongue” means speech that the congregation cannot understand unless it is interpreted.
    reason: lexical_alternative
  - marker: b
    text: “He” refers here to any person who speaks in a tongue, not only to a man.
    reason: source_note
