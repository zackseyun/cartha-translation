translation:
  language: en
  text: Now, brothers,[a] suppose I come to you speaking in tongues.[b] How will that help you unless I speak to you with a revelation, knowledge, prophecy, or teaching?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word translated “brothers” can address a mixed congregation of brothers and sisters.
    reason: lexical_alternative
  - marker: b
    text: The Greek can also mean “languages,” but here it refers to the spiritual-speech phenomenon discussed in 1 Corinthians 12–14.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: if I come to you speaking in tongues, what will I benefit you
  simplified_phrase: suppose I come to you speaking in tongues. How will that help you
  preserved_meaning: Paul asks what practical benefit his speaking in tongues would give the congregation.
  reasoning_layer_used: POB lexical decision for ὠφελέω and source syntax
  rationale: Two shorter sentences replace an awkward construction while preserving Paul's question about benefit.
- pob_phrase: unless I speak to you either by revelation or by knowledge or by prophecy or by teaching
  simplified_phrase: unless I speak to you with a revelation, knowledge, prophecy, or teaching
  preserved_meaning: Beneficial speech comes through the four distinct categories Paul names.
  reasoning_layer_used: POB lexical decisions for the four parallel instrumental ἐν-phrases
  rationale: “With” keeps the parallel categories clear without suggesting that Paul originates or gives them.
translation_notes:
  risk_flags:
  - risk: “With” is less explicitly instrumental than POB's repeated “by.”
    mitigation: The clause still presents all four categories as the means or manner of beneficial speech.
