  preserved_meaning: The second person lacks relevant understanding or familiarity but is not necessarily a complete outsider.
  reasoning_layer_used: POB lexical and theological decisions on ἰδιώτης
  rationale: This explains “uninstructed” in ordinary English while the footnote preserves the plausible alternative.
- pob_phrase: he is convicted by all; he is examined by all
  simplified_phrase: through what everyone says, that person will be brought under conviction and carefully examined
  preserved_meaning: The whole gathering’s prophetic speech brings both moral conviction and searching evaluation without implying final condemnation.
  reasoning_layer_used: Immediate context and POB lexical decisions on ἐλέγχεται, ἀνακρίνεται, and ὑπὸ πάντων
  rationale: The passive parallelism keeps the two effects distinct while avoiding a legal reading of “convicted.”
