translation:
  language: en
  text: But if everyone prophesies and an unbeliever or someone unfamiliar with the gathering[a] comes in, through what everyone says, that person will be brought under conviction and carefully examined.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “an outsider.” The Greek term can describe someone who is uninformed, unfamiliar, or not part of the group that is speaking.
    reason: alternative_reading
