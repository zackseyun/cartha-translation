  language: en
  text: So then, speaking in tongues[a] is a sign[b] for people who do not believe, not for those who believe. But prophecy is for those who believe, not for those who do not believe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “speaking in languages.” “Tongues” keeps Paul’s established term without deciding whether he means foreign languages or ecstatic speech.
    reason: lexical_alternative
