translation:
  language: en
  text: 'The Law[a] says:


    “I will speak to this people

    through people who speak other languages

    and through the lips of foreigners.

    Even in this way, they will not listen to me,”

    says the Lord.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “the Law” refers broadly to Scripture; this quotation echoes Isaiah 28:11–12.
    reason: source_note
  - marker: b
    text: Because Israel’s God is speaking, some translations use “the LORD” to reflect the Hebrew background.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: In the Law it is written
  simplified_phrase: The Law says
  preserved_meaning: Paul introduces an authoritative quotation from Scripture.
  reasoning_layer_used: Lexical decisions for ἐν τῷ νόμῳ and γέγραπται
  rationale: The shorter wording introduces the quotation naturally, while the note explains the broad sense of “Law.”
- pob_phrase: By people of other tongues and by the lips of foreigners I will speak
  simplified_phrase: I will speak ... through people who speak other languages and through the lips of foreigners
  preserved_meaning: God speaks by means of foreign-language speakers while retaining the image of foreign lips.
  reasoning_layer_used: Lexical decisions for ἑτερογλώσσοις and χείλεσιν ἑτέρων
  rationale: Ordinary clause order and “other languages” clarify the means without removing the source image.
- pob_phrase: not even in this way will they listen to me
  simplified_phrase: Even in this way, they will not listen to me
  preserved_meaning: The people still refuse to respond despite this particular means of divine speech.
  reasoning_layer_used: Lexical decisions for οὐδ’ οὕτως and εἰσακούσονταί μου
  rationale: The wording preserves the emphatic reference to the manner of speaking rather than making it merely temporal.
translation_notes:
  risk_flags:
  - risk: “The Law says” could sound as though the quotation comes from the Pentateuch.
    mitigation: Footnote a explains that “Law” refers broadly to Scripture and identifies the echo of Isaiah.
