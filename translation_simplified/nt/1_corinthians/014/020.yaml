translation:
  language: en
  text: Brothers[a], do not become childish in your thinking. Be infants when it comes to evil[b], but become mature in your thinking.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Brothers and sisters”; the Greek word “brothers” addresses the congregation as a whole.
    reason: lexical_alternative
  - marker: b
    text: Or “malice”; the Greek word can refer to evil generally or to malicious intent.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: do not become children in your thinking
  simplified_phrase: do not become childish in your thinking
  preserved_meaning: Paul warns against immature thought, not against children themselves.
  reasoning_layer_used: Lexical decision for παιδία and immediate contrast with mature thinking.
  rationale: “Childish” states the intended kind of thinking more directly.
- pob_phrase: be infants in evil
  simplified_phrase: Be infants when it comes to evil
  preserved_meaning: Believers should have an infant-like lack of involvement or development in evil.
  reasoning_layer_used: Lexical decisions for κακία and νηπιάζετε.
  rationale: “When it comes to” makes the sphere of comparison clear while preserving the infant image.
translation_notes:
  risk_flags:
  - risk: “Childish” can sound broader than intellectual immaturity.
    mitigation: The phrase “in your thinking” confines the command to the same domain as the Greek.
