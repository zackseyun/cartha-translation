translation:
  language: en
  text: A person who speaks in a tongue is not speaking to people but to God, because no one understands. Instead, that person speaks mysteries in the Spirit.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “no one hears.” The Greek word can mean either “hears” or, in this context, “understands.”
    reason: lexical_alternative
  - marker: b
    text: Or “in spirit.” This may refer either to the Holy Spirit or to the speaker’s own spirit.
    reason: alternative_reading
