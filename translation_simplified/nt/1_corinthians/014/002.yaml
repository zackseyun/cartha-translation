  rationale: A direct relative clause is easier for common readers than a substantival participle.
- pob_phrase: does not speak to people but to God, for no one understands
  simplified_phrase: is not speaking to people but to God, because no one understands
  preserved_meaning: Tongue-speech is directed to God rather than understood by other people.
