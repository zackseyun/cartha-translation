translation:
  language: en
  text: So what should I do? I will pray with the spirit[a], but I will also pray with my mind. I will sing praise with the spirit, but I will also sing praise with my mind.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “With the spirit” may also be translated “in the spirit” or “by the spirit”; the Greek does not specify whether this means the Holy Spirit, the person’s own spirit, or spiritual utterance.
    reason: lexical_alternative
