translation:
  language: en
  text: 'Anyone who thinks he is a prophet or a spiritual person[a] must acknowledge this: what I am writing to you is a command from the Lord.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “spiritual person” means someone who considers himself spiritually endowed or directed by the Spirit.
    reason: simplification_note
  - marker: b
    text: The Greek can also be translated, “what I am writing to you is the Lord’s.” The word “command” is implied by the context.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: If anyone thinks he is a prophet or spiritual
  simplified_phrase: Anyone who thinks he is a prophet or a spiritual person
  preserved_meaning: The statement concerns any individual who regards himself as a prophet or as spiritually endowed.
  reasoning_layer_used: Lexical decisions for δοκεῖ, προφήτης, and πνευματικός
  rationale: Turning the condition into an “anyone who” clause reads more naturally while retaining the corrective self-assessment.
- pob_phrase: let him recognize
  simplified_phrase: must acknowledge this
  preserved_meaning: The person is required to accept the authority of Paul’s instruction.
  reasoning_layer_used: Lexical decision for ἐπιγινωσκέτω
  rationale: “Must acknowledge” makes the imperative force clear in common English.
- pob_phrase: is a command of the Lord
  simplified_phrase: is a command from the Lord
  preserved_meaning: Paul’s written instruction carries the Lord’s binding authority.
  reasoning_layer_used: Theological decision on the elliptical force of κυρίου ἐστίν
  rationale: “From the Lord” clearly identifies the command’s divine source without changing the POB interpretation.
translation_notes:
  risk_flags:
  - risk: “Spiritual person” may be understood as merely religious or morally mature.
    mitigation: The footnote preserves the POB sense of someone considered spiritually endowed or Spirit-directed.
  - risk: “Command” supplies a noun not explicitly present in the compressed Greek clause.
    mitigation: The alternate literal rendering is retained in a footnote.
