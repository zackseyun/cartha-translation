translation:
  language: en
  text: Women[a] should remain silent in church gatherings. They are not permitted to speak,[b] but should be in submission, just as the law[c] also says.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Wives”; the Greek word can mean either women or wives, and this verse does not mention husbands.
    reason: alternative_reading
  - marker: b
    text: The verse does not specify what kind of speaking is meant; some understand it more narrowly from the surrounding context.
    reason: lexical_alternative
  - marker: c
    text: Or “the Law”; Paul may mean the Mosaic Law specifically or Scripture more broadly.
    reason: alternative_reading
