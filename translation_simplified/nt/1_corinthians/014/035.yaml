translation:
  language: en
  text: But if they want to learn anything, they should ask their own husbands at home, because it is shameful for a woman[a] to speak when the church is gathered.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a wife.” The Greek word can mean either “woman” or “wife” here.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: let them ask their own husbands at home
  simplified_phrase: they should ask their own husbands at home
  preserved_meaning: The instruction directs them to ask their husbands in the domestic setting.
  reasoning_layer_used: Lexical decisions for ἐπερωτάτωσαν, τοὺς ἰδίους ἄνδρας, and ἐν οἴκῳ
  rationale: “They should ask” expresses the command in direct modern English.
- pob_phrase: for it is shameful
  simplified_phrase: because it is shameful
  preserved_meaning: The judgment about speaking gives the reason for the instruction to ask at home.
  reasoning_layer_used: Source conjunction γάρ and the theological decision to preserve the clause as written
  rationale: “Because” makes the causal link immediately clear.
- pob_phrase: in the assembly
  simplified_phrase: when the church is gathered
  preserved_meaning: The speaking takes place in the gathered congregation rather than merely inside a building.
  reasoning_layer_used: Lexical decision for ἐν ἐκκλησίᾳ
  rationale: This wording clearly presents the church as a gathered group.
translation_notes:
  risk_flags:
  - risk: Readers may assume that “speak” refers to one specific kind of speech.
    mitigation: The main text retains the broad verb and does not narrow the prohibition.
  - risk: The Greek may refer specifically to a wife rather than to a woman generally.
    mitigation: The footnote preserves “wife” as a viable contextual alternative.
