  preserved_meaning: Prophecy strengthens its hearers, retaining Paul’s building image.
  reasoning_layer_used: Lexical decision for οἰκοδομή
  rationale: “Build them up” replaces an unfamiliar church term with its clear underlying metaphor.
- pob_phrase: encouragement and consolation
  simplified_phrase: encourage them and comfort them
  preserved_meaning: The two distinct effects remain encouragement or urging and soothing comfort.
  reasoning_layer_used: Lexical decisions for παράκλησις and παραμυθία
  rationale: Common verbs make the three-part purpose easy to follow without merging these related ideas.
