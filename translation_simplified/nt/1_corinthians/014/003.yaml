simplification_decisions:
- pob_phrase: the one who prophesies
  simplified_phrase: the person who prophesies
  preserved_meaning: The phrase still refers to anyone characterized by prophesying without defining prophecy more narrowly.
  reasoning_layer_used: Lexical and theological decisions for ὁ δὲ προφητεύων
  rationale: “The person” is more immediate common English while retaining the POB’s broad theological term.
- pob_phrase: for edification
