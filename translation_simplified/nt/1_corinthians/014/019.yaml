simplification_decisions:
- pob_phrase: in the church
  simplified_phrase: when the church gathers
  preserved_meaning: Paul is speaking about the Christian community gathered for worship.
  reasoning_layer_used: lexical decision for ἐκκλησίᾳ
  rationale: The wording makes the communal setting clear to readers who may think only of a building.
- pob_phrase: with my mind
  simplified_phrase: with understanding
  preserved_meaning: Paul prefers intelligible, mentally engaged speech that can instruct others.
  reasoning_layer_used: lexical decision for τῷ νοΐ μου
  rationale: “With understanding” states the intended contrast in familiar English.
- pob_phrase: so that I may also instruct others
  simplified_phrase: so I can teach others
  preserved_meaning: The understandable words are meant to give others oral instruction.
  reasoning_layer_used: lexical decision for κατηχήσω
  rationale: “Teach” is more common than “instruct” while retaining the educational purpose.
interpretive_expansions:
