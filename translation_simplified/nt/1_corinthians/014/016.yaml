translation:
  language: en
  text: Otherwise, if you offer a blessing in the spirit,[a] how can an uninstructed person who is present join in by saying “Amen” to your words of thanks? They do not understand what you are saying.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “with the spirit”; the Greek does not specify whether this means the human spirit or Spirit-enabled speech.
    reason: alternative_reading
  - marker: b
    text: “Uninstructed person” may also mean an outsider, an ordinary person, or someone without special knowledge.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: if you bless in the spirit
  simplified_phrase: if you offer a blessing in the spirit
  preserved_meaning: The speaker gives a spoken blessing while the meaning of “spirit” remains open.
  reasoning_layer_used: Lexical and theological decisions for εὐλογῇς and πνεύματι
  rationale: “Offer a blessing” clarifies that this is an act of speech without resolving the ambiguity of “spirit.”
- pob_phrase: the one filling the place of the uninstructed
  simplified_phrase: an uninstructed person who is present
  preserved_meaning: A person lacking the needed understanding occupies a place in the gathered assembly.
  reasoning_layer_used: Lexical decision for ὁ ἀναπληρῶν τὸν τόπον τοῦ ἰδιώτου
  rationale: The idiom about filling a place becomes ordinary English while retaining the person's presence and lack of instruction.
- pob_phrase: at your thanksgiving
  simplified_phrase: to your words of thanks
  preserved_meaning: The phrase refers to spoken thanks rather than the later technical term “Eucharist.”
  reasoning_layer_used: Lexical and theological decisions for ἐπὶ τῇ σῇ εὐχαριστίᾳ
  rationale: “Words of thanks” clearly identifies a spoken act of thanksgiving and avoids sacramental overstatement.
interpretive_expansions:
- pob_phrase: say the Amen
  rendering: join in by saying “Amen”
  claim: Saying “Amen” is the listener's response of agreement with the spoken blessing.
  evidence:
  - The POB lexical rationale identifies “Amen” as a congregational response of assent.
  - The verse connects the inability to respond with not understanding the speaker.
  confidence: high
  alternatives_preserved:
  - say “Amen”
  - affirm with “Amen”
translation_notes:
  risk_flags:
  - risk: Readers may take “in the spirit” as naming either the human spirit or the Holy Spirit with certainty.
    mitigation: The main text retains the broad wording, and footnote a preserves the unresolved alternatives.
  - risk: Replacing the image of “filling the place” may lessen the sense of an assigned position in the assembly.
    mitigation: “Who is present” keeps the person situated in the gathering without preserving an opaque idiom.
