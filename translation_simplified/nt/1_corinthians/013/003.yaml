  reasoning_layer_used: Lexical decision for πάντα τὰ ὑπάρχοντά μου
  rationale: Common wording makes the total extent immediately clear.
- pob_phrase: And if ... and if
  simplified_phrase: Even if ... and even if
  preserved_meaning: Both escalating hypothetical acts remain distinct and emphatic.
  reasoning_layer_used: Lexical decision for καὶ ἐὰν ... καὶ ἐὰν
  rationale: Repeating “even if” makes the hypothetical escalation natural in modern English.
- pob_phrase: so that I may be burned
  simplified_phrase: to be burned
  preserved_meaning: The body is handed over for the purpose or result of burning.
  reasoning_layer_used: Lexical decisions for παραδῶ, ἵνα, and καυθήσομαι
  rationale: The infinitive expresses the same relationship more directly.
