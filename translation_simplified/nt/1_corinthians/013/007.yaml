translation:
  language: en
  text: Love bears up through everything.[a] It remains trusting,[b] keeps hoping, and endures through everything.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The word translated “bears up” can also mean “covers” or “protects.”
    reason: lexical_alternative
  - marker: b
    text: This does not mean love is gullible; it means love is inclined to trust.
    reason: lexical_alternative
