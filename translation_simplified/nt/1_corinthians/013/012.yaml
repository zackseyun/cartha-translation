translation:
  language: en
  text: For now, we see through a mirror, and what we see is like a riddle.[a] But then we will see face to face. Now I know only in part, but then I will know fully, just as I have been fully known.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek says “in a riddle,” describing perception that is indirect and puzzling; it is sometimes translated “dimly.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: in a mirror, dimly
  simplified_phrase: through a mirror, and what we see is like a riddle
  preserved_meaning: Present perception is mediated and puzzling.
  reasoning_layer_used: Lexical decisions and latest revision pass
  rationale: The rewrite makes the two Greek images understandable while retaining both the mirror and the riddle.
- pob_phrase: Now I know in part
  simplified_phrase: Now I know only in part
  preserved_meaning: Present knowledge is limited rather than absent.
  reasoning_layer_used: Lexical decision for γινώσκω ἐκ μέρους
  rationale: “Only” makes the contrast with future fuller knowledge immediately clear.
- pob_phrase: then I will know fully, just as I also have been fully known
  simplified_phrase: then I will know fully, just as I have been fully known
  preserved_meaning: Future knowledge will be fuller but is not equated with divine omniscience.
  reasoning_layer_used: Theological decision on future knowledge
  rationale: Keeping “fully” preserves the lexical link and the passage’s theological restraint.
interpretive_expansions:
