translation:
  language: en
  text: Even if I can prophesy and understand every mystery and have all knowledge, and even if I have faith[a] strong enough to move mountains, but do not have love, I am nothing.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “complete trust”; “faithfulness” is less likely here.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: if I have prophecy
  simplified_phrase: if I can prophesy
  preserved_meaning: Paul refers broadly to possessing prophetic ability.
  reasoning_layer_used: Lexical decision for προφητεία and the spiritual-gifts context
  rationale: The verb states the ability naturally without turning prophecy into an office.
- pob_phrase: all faith so as to move mountains
  simplified_phrase: faith strong enough to move mountains
  preserved_meaning: The faith described has extraordinary power, expressed through the mountain-moving image.
  reasoning_layer_used: Lexical and theological decisions for πίστις and ὥστε ὄρη μεθιστάναι
  rationale: This wording makes the result clear while retaining both “faith” and the source image.
- pob_phrase: And if ... and if ... but
  simplified_phrase: Even if ... and even if ... but
  preserved_meaning: No extraordinary spiritual ability gives a person worth without love.
  reasoning_layer_used: POB syntax and the verse's contrast
  rationale: The repeated “even if” makes the hypothetical contrast easier to follow.
interpretive_expansions:
- pob_phrase: have prophecy
  rendering: can prophesy
  claim: Possessing prophecy means having the ability to prophesy in this context.
  evidence:
  - The lexical record lists “the gift of prophecy” and “prophetic power” as viable senses.
  - The immediate context concerns spiritual capacities.
  confidence: high
  alternatives_preserved:
  - have prophecy
  - have the gift of prophecy
  - have prophetic power
translation_notes:
  risk_flags:
  - risk: Using a verb may narrow the broad noun “prophecy” toward the act of prophesying.
    mitigation: The wording avoids defining an office or specifying the prophecy's form.
  - risk: “Strong enough” could be mistaken for ordinary self-confidence.
    mitigation: The retained word “faith” and mountain-moving image preserve the extraordinary spiritual sense.
