simplification_decisions:
- pob_phrase: I spoke like a child, I thought like a child, I reasoned like a child
  simplified_phrase: I spoke, thought, and reasoned as a child does
  preserved_meaning: The three distinct activities of speaking, thinking, and reasoning remain in the same order.
  reasoning_layer_used: POB lexical decisions for ἐλάλουν, ἐφρόνουν, and ἐλογιζόμην
  rationale: Combining the repeated wording makes the sentence easier to read without merging the three ideas.
- pob_phrase: I put away the things of the child
  simplified_phrase: I left the ways of a child behind
  preserved_meaning: Paul describes leaving behind the patterns associated with childhood.
  reasoning_layer_used: POB lexical alternatives and rationale for κατήργηκα and τὰ τοῦ νηπίου
  rationale: The approved alternative “ways of a child” makes the Greek expression clear in natural English.
translation_notes:
  risk_flags:
  - risk: “Ways of a child” is less concrete than the literal phrase “things of the child.”
    mitigation: The wording uses a documented POB alternative and preserves the maturation metaphor.
  - risk: Modern readers may take “man” as excluding women from the broader lesson.
    mitigation: The term is retained because Paul presents himself with the Greek masculine singular as his representative example.
