translation:
  language: en
  text: If I speak in the tongues of human beings and angels,[a] but have no love, I have become no more than a ringing piece of bronze or a clashing cymbal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Tongues” can also mean “languages.” This wording does not decide whether angelic tongues are literal or are a way of describing the highest imaginable speech.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the tongues of men
  simplified_phrase: the tongues of human beings
  preserved_meaning: The contrast includes all humanity in relation to angels.
  reasoning_layer_used: POB lexical and theological decisions on ἀνθρώπων
  rationale: “Human beings” makes the inclusive sense immediately clear without weakening the human-angel contrast.
- pob_phrase: sounding bronze
  simplified_phrase: a ringing piece of bronze
  preserved_meaning: Paul pictures metal producing sound without love.
  reasoning_layer_used: POB lexical decision on χαλκὸς ἠχῶν
  rationale: Adding “piece of” makes the concrete metal image natural in modern English without inventing an instrument.
- pob_phrase: I have become sounding bronze
  simplified_phrase: I have become no more than a ringing piece of bronze
  preserved_meaning: Loveless speech leaves the speaker reduced to mere noise.
  reasoning_layer_used: POB lexical decisions on γέγονα and χαλκὸς ἠχῶν
  rationale: “No more than” clearly conveys the metaphor's force while retaining the resulting state of “have become.”
interpretive_expansions:
- pob_phrase: I have become sounding bronze or a clashing cymbal
  rendering: I have become no more than a ringing piece of bronze or a clashing cymbal
  claim: Without love, even extraordinary speech amounts only to noise.
  evidence:
  - The two metal images emphasize sound that lacks the value supplied by love.
  - The contrast introduced by “but” makes love the decisive missing quality.
  confidence: high
  alternatives_preserved:
  - A ringing gong may be intended by the first image.
  - The Greek may refer generally to sounding metal rather than an instrument.
translation_notes:
  risk_flags:
  - risk: “Tongues” may be read only as ecstatic speech.
    mitigation: The footnote preserves “languages” as a lexical alternative.
  - risk: Readers may take angelic tongues as a settled literal doctrine.
    mitigation: The footnote preserves both the literal and rhetorical readings documented by POB.
