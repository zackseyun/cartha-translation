- pob_phrase: If all were one member
  simplified_phrase: If all the parts were only one part
  preserved_meaning: All the body’s parts are collectively in view and cannot all be a single part.
  reasoning_layer_used: The lexical decisions define “all” collectively as the body’s parts and “member” as a body part.
  rationale: Naming the parts clarifies the subject while preserving Paul’s body image.
- pob_phrase: where would the body be?
  simplified_phrase: how could there be a body?
  preserved_meaning: No body could exist in the imagined case where all its parts were one part.
  reasoning_layer_used: The lexical rationale says the rhetorical question concerns the body’s existence in this hypothetical case.
  rationale: The recast question states the implied consequence in natural English.
