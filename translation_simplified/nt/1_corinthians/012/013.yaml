translation:
  language: en
  text: For all of us were baptized in[a] one Spirit into one body. This was true whether we were Jews or Greeks, servants or free people. We were all also given one Spirit[b] to drink.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “by one Spirit”; the Greek can describe either the setting or the means of baptism.
    reason: alternative_reading
  - marker: b
    text: Or “one spirit,” though the context strongly points to the Holy Spirit.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: For indeed, in one Spirit we all were baptized into one body
  simplified_phrase: For all of us were baptized in one Spirit into one body
  preserved_meaning: Everyone shares one baptism in the Spirit that incorporates them into one body.
  reasoning_layer_used: Lexical decisions for ἐν ἑνὶ πνεύματι and εἰς ἓν σῶμα
  rationale: The wording uses natural emphasis while preserving baptism as the single action and the body as its goal.
- pob_phrase: whether Jews or Greeks, whether slaves or free
  simplified_phrase: This was true whether we were Jews or Greeks, slaves or free people
  preserved_meaning: The shared baptism includes the stated ethnic and social groups without erasing their distinctions.
  reasoning_layer_used: Lexical decisions for Ἰουδαῖοι, Ἕλληνες, δοῦλοι, and ἐλεύθεροι
  rationale: A separate sentence makes both contrasts easier to follow while retaining the accurate term “slaves.”
- pob_phrase: and we all were given to drink one Spirit
  simplified_phrase: We were all also given one Spirit to drink
  preserved_meaning: Everyone shares in the one Spirit through the image of receiving a drink.
  reasoning_layer_used: Lexical decision for ἐποτίσθημεν and theological decision for ἓν πνεῦμα
  rationale: Ordinary word order improves readability without removing the passive construction or drinking image.
translation_notes:
  risk_flags:
  - risk: “In one Spirit” may be read only as describing a setting rather than possible agency.
    mitigation: Footnote a preserves “by one Spirit” and explains the grammatical ambiguity.
  - risk: “Given one Spirit to drink” remains an unusual image in modern English.
    mitigation: The image is retained because it conveys shared participation in the Spirit.
