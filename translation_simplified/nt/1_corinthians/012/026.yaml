translation:
  language: en
  text: If one part of the body suffers, every member shares its suffering. If a part is honored,[a] every member shares its joy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “is glorified.” In this context, the word likely means receiving honor.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: one member
  simplified_phrase: one part of the body
  preserved_meaning: Paul’s image of the church as one body with many interconnected parts remains explicit.
  reasoning_layer_used: lexical decision for ἓν μέλος and immediate body-metaphor context
  rationale: Naming the body makes the image immediately clear while “part” avoids the less familiar anatomical use of “member.”
- pob_phrase: all the members suffer with it
  simplified_phrase: every member shares its suffering
  preserved_meaning: The distress of one member is experienced in solidarity by the whole body.
  reasoning_layer_used: lexical decision for συμπάσχει
  rationale: “Shares its suffering” expresses the compound verb’s idea of suffering together in natural English.
- pob_phrase: all the members rejoice with it
  simplified_phrase: every member shares its joy
  preserved_meaning: The whole body joins in the joy when one part receives honor.
  reasoning_layer_used: lexical decisions for δοξάζεται and συγχαίρει
  rationale: The wording clearly presents honor as a shared cause for joy without suggesting divine glorification.
interpretive_expansions:
- pob_phrase: one member
  rendering: one part of the body
  claim: The member belongs to the body in Paul’s extended metaphor for the church.
  evidence:
  - The immediate context repeatedly presents believers as members of one body.
  - The POB lexical rationale identifies the church-body metaphor as controlling.
  confidence: high
  alternatives_preserved:
