translation:
  language: en
  text: But the eye cannot tell the hand, “I don’t need you.” In the same way, the head cannot tell the feet, “I don’t need you.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: say to the hand
  simplified_phrase: tell the hand
  preserved_meaning: The eye addresses the hand directly.
  reasoning_layer_used: Lexical decision for εἰπεῖν and τῇ χειρί
  rationale: “Tell the hand” is more natural in this direct-address sentence.
- pob_phrase: I have no need of you
  simplified_phrase: I don’t need you
  preserved_meaning: One body part cannot claim independence from another.
  reasoning_layer_used: Lexical decision for Χρείαν σου οὐκ ἔχω
  rationale: The approved verbal alternative expresses the same need without formal wording.
- pob_phrase: or again the head to the feet
  simplified_phrase: In the same way, the head cannot tell the feet
  preserved_meaning: The second body-part example parallels the first and retains the plural feet.
  reasoning_layer_used: Lexical decisions for ἢ πάλιν, ἡ κεφαλή, and τοῖς ποσίν
  rationale: A complete second sentence makes the implied verb clear while preserving the analogy.
translation_notes:
  risk_flags:
