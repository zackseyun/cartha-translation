translation:
  language: en
  text: If the whole body were an eye, how could it hear? If the whole body were nothing but hearing, how could it smell?
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: where would the hearing be?
  simplified_phrase: how could it hear?
  preserved_meaning: A body made entirely of an eye would lack the faculty of hearing.
  reasoning_layer_used: POB lexical decision for ἀκοή and conditional rationale for ποῦ
  rationale: The active question is more natural English while keeping hearing as a sensory function.
- pob_phrase: If the whole were hearing
  simplified_phrase: If the whole body were nothing but hearing
  preserved_meaning: The hypothetical body consists entirely of the single faculty of hearing.
  reasoning_layer_used: POB lexical decisions for ὅλον and ἀκοή
  rationale: Repeating “body” clarifies the Greek ellipsis, and “nothing but” preserves the force of “whole.”
- pob_phrase: where would the sense of smell be?
  simplified_phrase: how could it smell?
  preserved_meaning: A body consisting only of hearing would lack the faculty of smell.
  reasoning_layer_used: POB lexical and theological decisions for ὄσφρησις
  rationale: The verb gives common readers the same sensory-function meaning more directly.
translation_notes:
  risk_flags:
