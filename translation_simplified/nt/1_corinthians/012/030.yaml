simplification_decisions:
- pob_phrase: Not all ... do they?
  simplified_phrase: Does everyone ...? No.
  preserved_meaning: Each rhetorical question expects a negative answer and emphasizes that believers have different gifts.
  reasoning_layer_used: Lexical and theological decisions on μὴ πάντες
  rationale: Direct questions followed by “No” make the expected answer immediately clear.
- pob_phrase: gifts of healings
  simplified_phrase: gifts that bring healing
  preserved_meaning: The gifts result in acts or instances of healing rather than naming healing only as an abstraction.
  reasoning_layer_used: Lexical decision on χαρίσματα ἰαμάτων
  rationale: The clearer clause preserves both the gifts and their healing effect.
- pob_phrase: interpret
  simplified_phrase: interpret what is spoken in tongues
  preserved_meaning: The gift makes speech in tongues understandable to others.
  reasoning_layer_used: Lexical decision on διερμηνεύουσιν and immediate context
  rationale: Naming what is interpreted removes an unclear implied object.
