translation:
  language: en
  text: For a body is one, yet it has many parts. Though its parts are many, together they are one body. So also is the Messiah.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Christ.” “Messiah” preserves the meaning of the Greek title rather than treating it only as a name.
    reason: alternative_reading
  - marker: b
    text: The wording is literally “so also the Messiah.” The following verses explain how many members form one body.
    reason: cross_reference
simplification_decisions:
- pob_phrase: For just as the body is one and has many members
  simplified_phrase: For a body is one, yet it has many parts
  preserved_meaning: One body contains many distinct parts.
  reasoning_layer_used: Lexical decisions for body, one, and members
  rationale: “Parts” makes the physical body image immediately clear without removing its distinct components.
- pob_phrase: and all the members of the body, though they are many, are one body
  simplified_phrase: Though its parts are many, together they are one body
  preserved_meaning: The body's many parts collectively remain one unified body.
  reasoning_layer_used: Lexical decisions for the concessive phrase and one body
  rationale: A separate sentence and ordinary word order clarify the contrast between plurality and unity.
- pob_phrase: so also is Messiah
  simplified_phrase: So also is the Messiah
  preserved_meaning: Paul applies the body's corporate unity directly to the Messiah in a compressed statement.
  reasoning_layer_used: Theological decisions on Messiah and preserving theological tension
  rationale: The striking wording retains the source's corporate-identification force without inserting the church into the verse.
interpretive_expansions:
- pob_phrase: all the members of the body ... are one body
  rendering: together they are one body
  claim: The many parts collectively constitute the one body.
  evidence:
  - The source clause identifies all the many members as one body.
  - The POB rationale emphasizes corporate oneness.
  confidence: high
  alternatives_preserved:
  - are one body
translation_notes:
  risk_flags:
