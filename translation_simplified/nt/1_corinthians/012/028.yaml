translation:
  language: en
  text: 'God has appointed the following in the church: first, apostles; second, prophets; third, teachers; then miracles; then gifts of healing, forms of help, forms of guidance, and kinds of tongues.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “kinds of languages.” The Greek term can mean “tongues” or “languages.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: God has appointed in the church
  simplified_phrase: God has appointed the following in the church
  preserved_meaning: God appoints every person, gift, and function named in the list.
  reasoning_layer_used: Lexical decision for ἔθετο
  rationale: “The following” lets one governing action apply naturally to the whole list.
- pob_phrase: gifts of healings
  simplified_phrase: gifts of healing
  preserved_meaning: The phrase still refers to divinely given healing activity without specifying its varieties or instances.
  reasoning_layer_used: Lexical decision for χαρίσματα ἰαμάτων and grounding review
  rationale: The idiomatic singular avoids making an uncertain meaning of the Greek plurals explicit.
- pob_phrase: helps, administrations
  simplified_phrase: forms of help, forms of guidance
  preserved_meaning: The church includes functions of assistance and direction without defining fixed offices.
  reasoning_layer_used: Lexical decisions for ἀντιλήμψεις and κυβερνήσεις
  rationale: Common functional phrases replace opaque list terms while preserving their range.
translation_notes:
  risk_flags:
  - risk: “Gifts of healing” does not reproduce both Greek plurals.
    mitigation: It preserves the POB meaning in natural English without choosing among varied or repeated healings.
  - risk: “Forms of guidance” may not convey every governing or organizing nuance of κυβερνήσεις.
    mitigation: It follows a documented POB alternative and avoids implying a hierarchy.
