  rationale: “Brings about” makes the Spirit’s active role clearer in common English.
- pob_phrase: distributing to each one individually
  simplified_phrase: He gives them to each person individually
  preserved_meaning: The Spirit personally assigns the gifts to individual recipients.
  reasoning_layer_used: Lexical decisions for διαιροῦν, ἰδίᾳ, and ἑκάστῳ
  rationale: A new sentence replaces the dense participial clause while retaining individual distribution.
- pob_phrase: just as he wills
  simplified_phrase: just as he chooses
  preserved_meaning: The Spirit intentionally decides how the gifts are distributed.
  reasoning_layer_used: Lexical and theological decisions for βούλεται
  rationale: “Chooses” is ordinary modern English and preserves the Spirit’s personal agency.
