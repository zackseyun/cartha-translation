translation:
  language: en
  text: For through the Spirit, one person receives a message of wisdom.[a] Another receives a message of knowledge in keeping with the same Spirit.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a word of wisdom” or “an utterance of wisdom.”
    reason: lexical_alternative
  - marker: b
    text: Or “by the same Spirit.” The Greek wording differs from “through the Spirit.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: to one is given through the Spirit
  simplified_phrase: through the Spirit, one person receives
  preserved_meaning: The gift is bestowed on one member through the Holy Spirit rather than produced by that person.
  reasoning_layer_used: Lexical decisions for ᾧ, δίδοται, and διὰ τοῦ πνεύματος
  rationale: Active English clause order makes the distribution easier to follow while preserving the Spirit as the means.
- pob_phrase: and to another a message of knowledge
  simplified_phrase: Another receives a message of knowledge
  preserved_meaning: A different person receives the distinct gift of a knowledge-bearing message.
  reasoning_layer_used: Lexical decisions for ἄλλῳ and λόγος γνώσεως
  rationale: A complete second sentence makes the parallel distribution clear.
- pob_phrase: according to the same Spirit
  simplified_phrase: in keeping with the same Spirit
  preserved_meaning: The second gift accords with and comes from the one Spirit shared by all.
  reasoning_layer_used: Lexical decision for κατὰ τὸ αὐτὸ πνεῦμα
  rationale: The clearer idiom retains the distinction from the earlier phrase “through the Spirit.”
translation_notes:
  risk_flags:
  - risk: “Receives” changes the grammatical passive “is given.”
    mitigation: The wording still presents each message as bestowed rather than self-generated.
  - risk: “In keeping with” may sound less directly causal than “by.”
    mitigation: The footnote preserves the causal alternative while the main text follows POB’s chosen sense of accordance.
