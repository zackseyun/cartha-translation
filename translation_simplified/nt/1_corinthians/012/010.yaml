translation:
  language: en
  text: One person receives the gift of performing miracles; another, the gift of prophecy; another, the gift of discerning spirits; another, different kinds of tongues; and another, the gift of interpreting tongues.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Tongues” may also mean “languages.” The wording leaves open the exact nature of this spiritual gift.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: workings of miracles
  simplified_phrase: the gift of performing miracles
  preserved_meaning: Divine power produces miraculous deeds through the recipient.
  reasoning_layer_used: Lexical and theological decisions for ἐνεργήματα δυνάμεων
  rationale: The verbal phrase states the miraculous activity more naturally while retaining “miracles.”
- pob_phrase: discernments of spirits
  simplified_phrase: the gift of discerning spirits
  preserved_meaning: The recipient repeatedly distinguishes or evaluates spirits without specifying what kinds of spirits are meant.
  reasoning_layer_used: Lexical and theological decisions for διακρίσεις πνευμάτων
  rationale: A verbal form is clearer in common English and keeps “spirits” deliberately broad.
- pob_phrase: interpretation of tongues
  simplified_phrase: the gift of interpreting tongues
  preserved_meaning: The recipient makes the content of tongues intelligible.
  reasoning_layer_used: Lexical decisions for ἑρμηνεία and γλωσσῶν
  rationale: The verb “interpreting” is more direct while preserving the paired term “tongues.”
interpretive_expansions:
- pob_phrase: to another
  rendering: One person receives the gift … another, the gift
  claim: The listed manifestations are gifts distributed among different people.
  evidence:
