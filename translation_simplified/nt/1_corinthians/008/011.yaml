translation:
  language: en
  text: For the weak person—the brother[b] for whom Messiah died—is being ruined[a] because of how you use your knowledge.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “is destroyed” or “perishes.” The Greek leaves open whether Paul means severe spiritual harm, final destruction, or both.
    reason: alternative_reading
  - marker: b
    text: “Brother” means a fellow believer; in this context the principle may also apply to a sister in the faith.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the weak one
  simplified_phrase: the weak person
  preserved_meaning: The verse focuses on the believer whose conscience is weak.
  reasoning_layer_used: POB lexical decision for ὁ ἀσθενῶν
  rationale: “Weak person” is more natural modern English without adding “brother” too early.
- pob_phrase: is destroyed by your knowledge
  simplified_phrase: is being ruined because of how you use your knowledge
  preserved_meaning: The knowledgeable person’s conduct causes severe harm to the weak believer.
  reasoning_layer_used: POB lexical and theological decisions for ἀπόλλυται and ἐν τῇ σῇ γνώσει
  rationale: This keeps the weak person as the one harmed and avoids making knowledge an independent agent.
- pob_phrase: the brother for whom Messiah died
  simplified_phrase: the brother for whom Messiah died
  preserved_meaning: The harmed person is a fellow believer for whom Messiah died.
  reasoning_layer_used: POB lexical and theological decisions for ὁ ἀδελφός and Χριστός
  rationale: The key terms remain because they carry relational and redemptive weight.
interpretive_expansions:
- pob_phrase: by your knowledge
  rendering: because of how you use your knowledge
  claim: The harm comes through the knowledgeable person’s conduct, not through knowledge acting by itself.
  evidence:
  - The POB rationale identifies the person’s exercise of knowledge as the means of harm.
  - The immediate context describes freedom expressed through eating as the harmful conduct.
  confidence: high
  alternatives_preserved:
  - by your knowledge
  - because of your knowledge
translation_notes:
  risk_flags:
  - risk: “Being ruined” may sound less severe than the finalized POB wording “is destroyed.”
    mitigation: Footnote a preserves the stronger alternative and the full theological tension.
  - risk: “How you use” makes the contextual role of conduct explicit.
    mitigation: The POB rationale and immediate context directly support this bounded clarification.
