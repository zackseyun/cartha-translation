translation:
  language: en
  text: But not everyone has this knowledge. Some are still influenced by their former connection to idol worship.[a] When they eat this food, they regard it as food sacrificed to an idol. Their conscience is weak, and it becomes defiled.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek phrase is difficult and can be rendered more literally, “because of habit or custom until now with the idol.”
    reason: lexical_alternative
  - marker: b
    text: Some manuscripts have “conscience of the idol” or a related variation; the main text follows the SBLGNT reading.
    reason: textual_variant
