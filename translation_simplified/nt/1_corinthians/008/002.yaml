  rationale: Direct address expresses the same generic warning without an unclear generic masculine pronoun.
- pob_phrase: as he ought to know
  simplified_phrase: in the way you should
  preserved_meaning: The person's knowledge is deficient in its proper manner or measure, not wholly absent.
  reasoning_layer_used: Theological decision on the nature of Paul's critique and lexical decisions for καθὼς and δεῖ
  rationale: The fuller phrase makes Paul's standard of proper knowing immediately clear.
