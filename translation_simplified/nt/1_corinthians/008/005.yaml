translation:
  language: en
  text: For even if there are beings in heaven or on earth that people call “gods”—and indeed people recognize many gods and many lords[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “lords” means the many beings or powers given that title, not the one true Lord named in verse 6.
    reason: cross_reference
simplification_decisions:
- pob_phrase: there are so-called gods
  simplified_phrase: there are beings ... that people call “gods”
  preserved_meaning: The wording reports how alleged deities are designated without affirming that they are truly gods.
  reasoning_layer_used: Lexical and theological decisions on λεγόμενοι θεοὶ
  rationale: An active clause and quotation marks make Paul’s distance clear in ordinary English.
- pob_phrase: as indeed there are many gods and many lords
  simplified_phrase: indeed people recognize many gods and many lords
  preserved_meaning: Many beings or powers are treated as gods and lords, though they are not the one God and Lord of verse 6.
  reasoning_layer_used: Lexical rationale for ὥσπερ and theological decision on κύριοι
  rationale: Naming the people who grant these titles prevents the clause from affirming many true deities.
interpretive_expansions:
- pob_phrase: there are many gods and many lords
  rendering: people recognize many gods and many lords
  claim: Their status as gods and lords rests on human recognition and titles.
  evidence:
  - The POB rationale says the clause acknowledges beings regarded as gods and lords.
  - The POB footnote identifies beings or powers that people recognize by the title.
  - Verses 4–6 contrast these claimants with the one God and one Lord.
  confidence: high
  alternatives_preserved:
  - there are many gods and many lords
  - many are called gods and lords
translation_notes:
  risk_flags:
  - risk: “Beings” may sound more concrete than the Greek’s unspecified referent.
    mitigation: The term follows the POB explanation while “people call” preserves the designation rather than affirming true deity.
