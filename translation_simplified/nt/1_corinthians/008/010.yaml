- pob_phrase: For if someone sees you, who have knowledge
  simplified_phrase: For suppose someone ... sees that you, a person with knowledge
  preserved_meaning: The situation remains hypothetical, and the observer sees a person characterized by knowledge.
  reasoning_layer_used: Lexical decisions for γάρ, τις, ἴδῃ, and γνῶσιν
  rationale: “Suppose” and a reordered clause make the hypothetical example easier to follow while retaining the theme of knowledge.
- pob_phrase: his conscience, being weak
  simplified_phrase: someone whose conscience is weak
  preserved_meaning: The observer has a weak conscience that is vulnerable to harmful influence.
  reasoning_layer_used: Lexical decision for ἀσθενοῦς ὄντος and immediate context
  rationale: The modifier is placed beside “conscience” to remove the dense participial wording.
- pob_phrase: reclining in an idol’s temple
  simplified_phrase: reclining at a meal in an idol’s temple
  preserved_meaning: The knowledgeable person is dining in a place devoted to an idol.
  reasoning_layer_used: Lexical decisions for κατακείμενον and ἐν εἰδωλείῳ
  rationale: Adding “at a meal” explains the ancient dining posture without removing the concrete image.
