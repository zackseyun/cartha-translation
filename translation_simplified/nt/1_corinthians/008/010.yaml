translation:
  language: en
  text: For suppose someone whose conscience is weak sees that you, a person with knowledge, are reclining at a meal in an idol’s temple. Will that person’s conscience not be “built up”[a] to eat food sacrificed to idols?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “emboldened.” The Greek literally says “built up,” using Paul’s usual language for strengthening others with likely irony here.
    reason: lexical_alternative
