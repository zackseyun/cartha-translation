  text: So then, a man who gives his virgin in marriage does well. But a man who does not give her in marriage will do better.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “a man who marries his virgin fiancée does well, but a man who does not marry her will do better.” The Greek does not clearly identify the virgin woman’s relationship to him; she may be his daughter, ward, or fiancée.
    reason: alternative_reading
