  preserved_meaning: Neither spouse should withhold what is due within the marriage.
  reasoning_layer_used: Lexical decision for ἀποστερεῖτε in its marital context
  rationale: The new wording makes the object of withholding clear while keeping the command mutual and modest.
- pob_phrase: except perhaps by mutual agreement for a time
  simplified_phrase: A possible exception is when you both agree to do so for a limited time
  preserved_meaning: The exception is qualified, consensual, and temporary.
  reasoning_layer_used: Lexical decisions for εἰ μήτι ἂν, ἐκ συμφώνου, and πρὸς καιρόν
  rationale: The sentence directly states all three limits in common English.
- pob_phrase: and then come together again
  simplified_phrase: Then come together again as husband and wife
  preserved_meaning: The spouses are to resume their marital life together after the agreed period.
  reasoning_layer_used: POB footnote and theological decision for πάλιν ἐπὶ τὸ αὐτὸ ἦτε
  rationale: The clarifier explains the reunion without making the wording sexually explicit.
