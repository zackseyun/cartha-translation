translation:
  language: en
  text: Do not withhold marital intimacy from each other. A possible exception is when you both agree to do so for a limited time, so that you can devote yourselves to prayer. Then come together again as husband and wife, so that Satan does not tempt you because you lack self-control.
  philosophy: optimal-equivalence
