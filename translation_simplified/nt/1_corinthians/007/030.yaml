translation:
  language: en
  text: And those who weep should live as though they were not weeping. Those who rejoice should live as though they were not rejoicing. Those who buy should live as though they did not possess what they bought.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: as not weeping ... as not rejoicing
  simplified_phrase: should live as though they were not weeping ... as though they were not rejoicing
  preserved_meaning: Their emotions are real, but they must hold them with detachment.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The idiomatic wording expresses a manner of life rather than denying actual grief or joy.
- pob_phrase: those who buy as not possessing
  simplified_phrase: Those who buy should live as though they did not possess what they bought
  preserved_meaning: Buying is allowed, but possessions must not be treated as permanent or controlling.
  reasoning_layer_used: POB lexical decision for κατέχοντες and immediate context
  rationale: The added object makes the relationship between buying and possessing clear.
- pob_phrase: one repeated participial series
  simplified_phrase: three short parallel sentences
  preserved_meaning: The three distinct experiences retain their cumulative rhetorical force.
  reasoning_layer_used: POB syntax and repeated καί
  rationale: Short sentences make the parallel commands easier to follow without merging them.
interpretive_expansions:
- pob_phrase: as not
  rendering: should live as though
  claim: The repeated phrase describes the stance believers should take in daily life.
  evidence:
  - The POB footnote says the construction expresses a manner of living.
  - The theological rationale identifies the clauses as an exhortation to detachment.
  - The surrounding passage says the form of this world is passing away.
  confidence: high
  alternatives_preserved:
