translation:
  language: en
  text: Are you bound to a wife? Do not seek to be released.[a] Have you been released from a wife? Do not look for a wife.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'More interpretively: “Are you married? Do not seek a divorce. Are you divorced? Do not seek a wife.” The Greek says “bound” and “released,” which may include more than divorce alone.'
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Do not seek release
  simplified_phrase: Do not seek to be released
  preserved_meaning: The command forbids pursuing release from the marital bond.
  reasoning_layer_used: Lexical decisions for ζητέω and λύσις
  rationale: The verbal form is natural English while preserving the seeking and release language.
- pob_phrase: Are you released from a wife?
  simplified_phrase: Have you been released from a wife?
  preserved_meaning: The person is now free from a former marital bond, without specifying how it ended.
  reasoning_layer_used: Lexical decision for λέλυσαι and theological ambiguity guardrail
  rationale: The perfect construction sounds natural and does not restrict the release to divorce.
- pob_phrase: Do not seek a wife
  simplified_phrase: Do not look for a wife
  preserved_meaning: The command tells the unmarried person not to pursue marriage.
  reasoning_layer_used: Lexical decisions for ζητέω and γυναῖκα
  rationale: “Look for” is common English and retains the command’s force.
