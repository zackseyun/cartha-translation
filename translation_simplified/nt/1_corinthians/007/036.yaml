  text: But if a man thinks he is not treating his virgin properly,[a] and she is past her youth and the circumstances require it, let him do what he wants. He is not sinning. Let them marry.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “His virgin” may mean his fiancée or betrothed virgin. Traditionally, it has also been understood as his virgin daughter. The Greek is ambiguous.
