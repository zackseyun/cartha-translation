translation:
  language: en
  text: But if the unbelieving spouse separates, let that spouse separate. In such a case, the believing husband or wife is not enslaved.[a] God has called us[b] to live in peace.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “is not bound.” The Greek word means “enslaved,” but the verse does not define the full extent of this freedom.
    reason: lexical_alternative
  - marker: b
    text: Some manuscripts read “you” instead of “us.”
    reason: textual_variant
simplification_decisions:
- pob_phrase: the unbeliever
  simplified_phrase: the unbelieving spouse
  preserved_meaning: The person is the non-Christian spouse in the marriage under discussion.
  reasoning_layer_used: lexical decision and immediate context
  rationale: Naming the spouse prevents readers from mistaking this for any unbeliever.
- pob_phrase: let him separate
  simplified_phrase: let that spouse separate
  preserved_meaning: Paul permits the unbelieving spouse to separate rather than commanding the believer to cause it.
  reasoning_layer_used: lexical rationale and grounding review
  rationale: This keeps the spouse’s agency, the repeated verb, and gender-inclusive language.
- pob_phrase: The brother or the sister
  simplified_phrase: the believing husband or wife
  preserved_meaning: Either Christian spouse is included.
  reasoning_layer_used: lexical decision and marital context
  rationale: The marital roles make Paul’s believer-family language immediately understandable.
interpretive_expansions:
- pob_phrase: the unbeliever; The brother or the sister
  rendering: the unbelieving spouse; the believing husband or wife
  claim: Both expressions refer to spouses distinguished by whether they believe.
  evidence:
  - The surrounding passage addresses marriage between a believer and an unbeliever.
  - The POB lexical notes identify the contextual referents as spouses.
  confidence: high
  alternatives_preserved:
  - the unbeliever
  - the brother or the sister
- pob_phrase: God has called us in peace
  rendering: God has called us to live in peace
  claim: God’s calling is to be lived out in peace.
  evidence:
  - The POB rationale treats peace as the sphere or manner of God’s calling.
  - The clause contrasts peace with the marital conflict just described.
  confidence: high
  alternatives_preserved:
  - God has called us in peace
  - God has called us to peace
translation_notes:
  risk_flags:
  - risk: Readers may treat “not enslaved” as a complete ruling about remarriage.
    mitigation: The footnote states that the verse leaves the full extent of this freedom undefined.
  - risk: “Separates” may be understood only as legal divorce or only as physical departure.
    mitigation: The broader term preserves the POB’s intentional ambiguity.
