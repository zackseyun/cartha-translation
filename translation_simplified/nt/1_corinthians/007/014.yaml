translation:
  language: en
  text: For a husband who does not believe has been made holy through his believing wife. In the same way, a wife who does not believe has been made holy through the brother—her believing husband.[a] Otherwise, it follows that your children are unclean. But in fact, they are holy.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Greek says “the brother,” using Paul’s usual term for a fellow believer.
    reason: lexical_alternative
  - marker: b
    text: Here “made holy” and “holy” describe a set-apart status within the believing spouse’s family, not necessarily personal salvation.
    reason: cultural_note
simplification_decisions:
- pob_phrase: the unbelieving husband
  simplified_phrase: a husband who does not believe
  preserved_meaning: The husband is not a believer.
  reasoning_layer_used: Lexical decision for ἄπιστος
  rationale: The clause uses common English while keeping the contrast in faith.
- pob_phrase: the unbelieving wife has been made holy through the brother
  simplified_phrase: a wife who does not believe has been made holy through the brother—her believing husband
  preserved_meaning: The wife receives a holy status through her Christian husband while the source term “brother” remains visible.
  reasoning_layer_used: Lexical and theological decisions for ἀδελφῷ
  rationale: The apposition explains Paul’s family-language without replacing it.
- pob_phrase: otherwise your children are unclean, but as it is, they are holy
  simplified_phrase: Otherwise, it follows that your children are unclean. But in fact, they are holy.
  preserved_meaning: Paul contrasts the inferred alternative with the children’s actual holy status.
  reasoning_layer_used: Lexical decisions for ἐπεὶ ἄρα and νῦν δὲ, plus the revision preserving present tense
  rationale: Two short sentences make the inference clear and retain “are” in both clauses.
interpretive_expansions:
- pob_phrase: his wife; the brother
  rendering: his believing wife; the brother—her believing husband
  claim: The spouses through whom holiness comes are believers, and “the brother” is the Christian husband.
  evidence:
  - The immediate context contrasts a believing spouse with an unbelieving spouse.
  - Paul commonly calls a fellow believer a brother.
  - The POB theological decision identifies the brother as the believing husband.
  confidence: high
  alternatives_preserved:
  - the brother
  - the believing husband
