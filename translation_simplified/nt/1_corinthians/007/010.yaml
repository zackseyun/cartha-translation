  reasoning_layer_used: POB lexical decision for Τοῖς ... γεγαμηκόσιν
  rationale: The fuller phrase is more immediately natural for common readers.
- pob_phrase: I give this command—not I, but the Lord
  simplified_phrase: I give this command. It is not my own command, but the Lord’s
  preserved_meaning: Paul identifies this as a command already grounded in the Lord’s teaching.
  reasoning_layer_used: POB theological decision on “not I, but the Lord”
  rationale: Two sentences clarify the contrast without suggesting that Paul lacks authority.
- pob_phrase: must not separate from her husband
  simplified_phrase: must not separate from her husband
  preserved_meaning: The command forbids marital separation without narrowing it to modern legal divorce.
  reasoning_layer_used: POB lexical and theological decisions for μὴ χωρισθῆναι
  rationale: The key term remains because replacing it with “divorce” would remove the documented breadth.
