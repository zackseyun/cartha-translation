translation:
  language: en
  text: 'A wife does not have authority over her own body,[a] but her husband does. The same applies the other way around: a husband does not have authority over his own body, but his wife does.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “does not exercise authority over.” Here the authority is mutual between husband and wife.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: likewise also
  simplified_phrase: The same applies the other way around
  preserved_meaning: The second statement exactly reverses the spouses’ roles and emphasizes mutuality.
  reasoning_layer_used: Lexical decision for ὁμοίως δὲ καὶ and the theological decision on mutual authority
  rationale: This common expression makes Paul’s balanced parallel easier to follow without weakening it.
- pob_phrase: the husband does / the wife does
  simplified_phrase: but her husband does / but his wife does
  preserved_meaning: In each clause, the other spouse is the one said to have authority.
  reasoning_layer_used: Immediate marital context and lexical decisions for γυνή and ἀνήρ
  rationale: Adding the possessives makes each marital relationship immediately clear in English.
translation_notes:
  risk_flags:
  - risk: Modern readers may take “authority” as permitting unilateral domination or coercion.
    mitigation: The reversed second sentence and footnote preserve the verse’s reciprocal marital structure without adding such implications.
