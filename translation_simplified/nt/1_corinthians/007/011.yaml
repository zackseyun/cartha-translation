translation:
  language: en
  text: But if she separates from her husband,[a] she must remain unmarried or be reconciled with him. A husband must not divorce his wife.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also mean “even if she separates from her husband.”
    reason: lexical_alternative
  - marker: b
    text: The verb translated “divorce” can more literally mean “send away.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: if she does separate
  simplified_phrase: if she separates from her husband
  preserved_meaning: She separates from her spouse without specifying a formal divorce.
  reasoning_layer_used: lexical and theological decisions for χωρισθῇ
  rationale: The wording is more natural while preserving “separate” rather than collapsing it into “divorce.”
- pob_phrase: let her remain unmarried
  simplified_phrase: she must remain unmarried
  preserved_meaning: The instruction requires her to continue unmarried.
  reasoning_layer_used: lexical decision for μενέτω and ἄγαμος
  rationale: A direct command is clearer in modern English and retains the imperative force.
- pob_phrase: or else be reconciled to her husband
  simplified_phrase: or be reconciled with him
  preserved_meaning: Reconciliation with her husband is the stated alternative.
  reasoning_layer_used: lexical decisions for καταλλαγήτω and ἀνδρί
  rationale: Using “him” avoids needless repetition without weakening the relational meaning.
interpretive_expansions:
