translation:
  language: en
  text: A wife remains bound to her husband as long as he lives. But if he falls asleep in death, she is free to marry anyone she chooses—but only in the Lord.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Only in the Lord” is commonly understood to mean only to someone who belongs to the Lord, though it may more broadly mean in a way consistent with devotion to the Lord.
    reason: alternative_reading
