simplification_decisions:
- pob_phrase: has an unbelieving husband
  simplified_phrase: has a husband who does not share her Christian faith
  preserved_meaning: Her husband does not share her belief in Christ.
  reasoning_layer_used: lexical decision for ἄπιστον and immediate context
  rationale: The clause avoids suggesting marital unfaithfulness and makes the religious contrast clear.
- pob_phrase: he consents to live with her
  simplified_phrase: he is willing to keep living with her
  preserved_meaning: The husband willingly agrees to continue their shared married life.
  reasoning_layer_used: lexical decisions for συνευδοκεῖ and οἰκεῖν μετ’ αὐτῆς
  rationale: “Is willing” is common English, and “keep living” clarifies that the marriage is continuing.
- pob_phrase: she must not leave her husband
  simplified_phrase: she must not divorce him
  preserved_meaning: She must not end the marriage while he is willing to remain.
  reasoning_layer_used: theological decision and lexical decision for μὴ ἀφιέτω
  rationale: “Divorce” clearly communicates the marital force that a merely physical “leave” could obscure.
