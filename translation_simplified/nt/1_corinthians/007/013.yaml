translation:
  language: en
  text: If a woman has a husband who does not share her Christian faith, but he is willing to keep living with her, she must not divorce him.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek can also be translated “leave” or “send away”; here it refers to ending the marriage.
