translation:
  language: en
  text: Her interests are divided. The unmarried woman—that is, the virgin[a]—is concerned with the Lord’s interests, so that she may be holy in both body and spirit. But the married woman is concerned with the affairs of this world—with how she may please her husband.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “The unmarried woman and the virgin are concerned with the Lord’s interests.” The Greek may refer to two groups rather than describing the unmarried woman as the virgin.
    reason: alternative_reading
