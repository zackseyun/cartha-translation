translation:
  language: en
  text: If you were already circumcised when God called you, do not try to reverse it.[a] If you were uncircumcised when God called you, do not get circumcised.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “do not become uncircumcised”—that is, do not try to conceal or reverse the physical marks of circumcision.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Was anyone called while circumcised?
  simplified_phrase: If you were already circumcised when God called you
  preserved_meaning: The person was in a circumcised state at the time of God’s call.
  reasoning_layer_used: lexical and theological decisions
  rationale: The conditional form states the same general case more directly, while “already” preserves the completed state.
- pob_phrase: He should not try to reverse it.
  simplified_phrase: do not try to reverse it
  preserved_meaning: The person must not attempt to undo the visible result of circumcision.
  reasoning_layer_used: lexical decision and footnote
  rationale: Direct second-person wording makes Paul’s instruction immediate without changing its force.
- pob_phrase: He should not be circumcised.
  simplified_phrase: do not get circumcised
  preserved_meaning: A person uncircumcised when called should not undergo circumcision.
  reasoning_layer_used: lexical decision
  rationale: “Get circumcised” is clearer common English for undergoing the procedure.
