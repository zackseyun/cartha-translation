translation:
  language: en
  text: hand a man like this over to Satan for the destruction of the flesh,[a] so that the spirit may be saved on the day of the Lord.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the ruin of the flesh.” This may mean severe bodily judgment or the destruction of the man’s sinful, fleshly way of life.
    reason: lexical_alternative
  - marker: b
    text: Some manuscripts read “the day of our Lord Jesus” or “the day of the Lord Jesus.”
    reason: textual_variant
simplification_decisions:
- pob_phrase: such a man
  simplified_phrase: a man like this
  preserved_meaning: The wording still identifies the particular offender while describing the kind of conduct involved.
  reasoning_layer_used: Lexical decision for τὸν τοιοῦτον
  rationale: The new wording is more natural in common English without losing the categorical tone.
- pob_phrase: in the day of the Lord
  simplified_phrase: on the day of the Lord
  preserved_meaning: The phrase still points to the future day associated with the Lord.
  reasoning_layer_used: Lexical and theological decisions for ἐν τῇ ἡμέρᾳ τοῦ κυρίου
  rationale: English normally uses “on” for a particular day, while “of the Lord” remains unchanged.
- pob_phrase: destruction of the flesh
  simplified_phrase: destruction of the flesh
  preserved_meaning: The wording leaves open both bodily judgment and the ruin of the man’s sinful orientation.
  reasoning_layer_used: Theological decision on σάρξ and ὄλεθρος
  rationale: This difficult phrase is retained because clearer substitutes would resolve an ambiguity preserved by the Greek.
translation_notes:
  risk_flags:
  - risk: Modern readers may not know whether “flesh” means the body or a sinful orientation.
    mitigation: Footnote a states both interpretations without choosing between them.
  - risk: “Hand over to Satan” remains a severe and unusual biblical image.
    mitigation: The image is retained because replacing it would weaken the source text’s force.
