translation:
  language: en
  text: In the name of our Lord Jesus,[a] when you gather together, my spirit will be there with you, together with the power of our Lord Jesus,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “In the name of our Lord Jesus” means acting under his authority.
    reason: simplification_note
simplification_decisions:
- pob_phrase: when you are assembled
  simplified_phrase: when you gather together
  preserved_meaning: The church meets as a group for the action Paul describes.
  reasoning_layer_used: Lexical decision for συναχθέντων ὑμῶν
  rationale: The active wording is more natural while preserving the temporal and communal sense.
- pob_phrase: my spirit is with you
  simplified_phrase: my spirit will be there with you
  preserved_meaning: Paul claims real non-physical participation without explaining how it occurs.
  reasoning_layer_used: Theological decision on Paul’s presence
  rationale: “Will be there” clearly connects his spiritual presence with their future gathering.
- pob_phrase: with the power of our Lord Jesus
  simplified_phrase: together with the power of our Lord Jesus
  preserved_meaning: Jesus’ effective power accompanies the assembly and its action.
  reasoning_layer_used: Lexical decisions for σὺν and δυνάμει
  rationale: “Together with” makes the relationship easier to follow without reducing power to formal authority.
translation_notes:
  risk_flags:
  - risk: “My spirit will be there” could be read as defining how Paul is present.
    mitigation: The wording retains the source image but offers no metaphysical explanation.
