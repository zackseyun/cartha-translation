simplification_decisions:
- pob_phrase: And you are puffed up
  simplified_phrase: Yet you are puffed up with pride
  preserved_meaning: Paul rebukes their settled, inflated pride while retaining his metaphor.
  reasoning_layer_used: Lexical decision for πεφυσιωμένοι and immediate contrast
  rationale: “With pride” makes the metaphor clear without replacing it.
- pob_phrase: should you not rather have mourned
  simplified_phrase: Should you not instead have mourned
  preserved_meaning: The question contrasts their pride with the deep grief they should have shown.
  reasoning_layer_used: Lexical decisions for οὐχὶ μᾶλλον and ἐπενθήσατε
  rationale: “Instead” states the contrast naturally while “mourned” keeps its force.
- pob_phrase: the one who did this deed might be removed from among you
  simplified_phrase: the person who did this might be removed from among you
  preserved_meaning: Their mourning was to lead to the offender’s removal from the community, without defining the mechanism more narrowly than the source.
  reasoning_layer_used: Lexical and theological decisions for ἵνα ἀρθῇ and ἐκ μέσου ὑμῶν
  rationale: “Might be removed” preserves both the intended outcome and the passive wording.
