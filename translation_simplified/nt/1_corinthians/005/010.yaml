translation:
  language: en
  text: I certainly did not mean the sexually immoral people of this world, or those who are greedy, swindle others,[a] or worship idols. To avoid all such people, you would have to leave the world.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The word can also mean rob or extort, including taking from others by force or exploitation.
    reason: lexical_alternative
