  preserved_meaning: Paul emphatically clarifies the scope of his earlier instruction.
  reasoning_layer_used: Lexical decision for οὐ πάντως and immediate context
  rationale: A direct personal clause makes the clarification natural and complete in English.
- pob_phrase: the greedy and swindlers, or idolaters
  simplified_phrase: those who are greedy, swindle others, or worship idols
  preserved_meaning: The distinct vices of greed, exploitation, and idolatry remain separate.
  reasoning_layer_used: POB lexical decisions for πλεονέκταις, ἅρπαξιν, and εἰδωλολάτραις
  rationale: Verbal phrases explain the actions more clearly than compact labels.
- pob_phrase: since then you would have to go out of the world
  simplified_phrase: To avoid all such people, you would have to leave the world
  preserved_meaning: Complete separation from such people in society would require exiting the world itself.
  reasoning_layer_used: POB lexical and theological decisions on ἐπεὶ and ἐκ τοῦ κόσμου ἐξελθεῖν
  rationale: The consequence is stated in ordinary English while retaining the stark image of leaving the world.
