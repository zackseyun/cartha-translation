simplification_decisions:
- pob_phrase: though absent in body but present in spirit
  simplified_phrase: although I am not there in person, I am there in spirit
  preserved_meaning: Paul is physically absent but spiritually present with the congregation.
  reasoning_layer_used: lexical and theological decisions
  rationale: “Not there in person” clarifies bodily absence while retaining the important phrase “in spirit.”
- pob_phrase: have already judged, as though present
  simplified_phrase: have already judged ... just as if I were there
  preserved_meaning: Paul’s judgment is already settled and stands as though he were physically present.
  reasoning_layer_used: lexical decisions on ἤδη κέκρικα and ὡς παρών
  rationale: The reordered clause uses natural English without weakening the settled judgment.
- pob_phrase: the one who has done this thing
  simplified_phrase: the person who has done this in such a way
  preserved_meaning: The offender is identified by both the deed and the striking manner in which it was done.
  reasoning_layer_used: lexical decisions on τὸν ... κατεργασάμενον and οὕτως τοῦτο
  rationale: The wording restores the force of οὕτως while avoiding an added gendered noun.
translation_notes:
  risk_flags:
  - risk: “I am there in spirit” could be mistaken for a reference to the Holy Spirit.
    mitigation: The footnote gives POB’s preferred reading without ruling out the documented ambiguity.
