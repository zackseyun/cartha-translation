translation:
  language: en
  text: For there must also be opposing groups among you, so that it may also become clear which of you have stood the test.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: there must also be factions among you
  simplified_phrase: there must also be opposing groups among you
  preserved_meaning: Divisive groups are present within the congregation, and their existence is presented as necessary.
  reasoning_layer_used: Lexical and theological decisions on αἱρέσεις and δεῖ
  rationale: “Opposing groups” clarifies internal division while leaving the source of the necessity unstated.
- pob_phrase: those who are approved
  simplified_phrase: which of you have stood the test
  preserved_meaning: Some members are shown to be genuine after testing.
  reasoning_layer_used: Lexical decision on δόκιμοι
  rationale: The testing image is clearer than the abstract word “approved.”
- pob_phrase: may also become evident among you
  simplified_phrase: it may also become clear which of you
  preserved_meaning: The tested members may become openly recognizable within the community.
  reasoning_layer_used: Lexical decisions on ἵνα and φανεροὶ γένωνται
  rationale: “May become clear” preserves both the purpose/result nuance and the movement into visibility.
translation_notes:
  risk_flags:
  - risk: “Must” could be read as specifying divine necessity.
    mitigation: The text does not identify the source of the necessity, preserving POB’s theological tension.
  - risk: “Opposing groups” could suggest formal organizations.
    mitigation: “Among you” locates the groups within the congregation rather than identifying later doctrinal sects.
