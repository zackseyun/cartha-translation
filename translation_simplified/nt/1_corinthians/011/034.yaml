translation:
  language: en
  text: If anyone is hungry, he should eat at home, so that when you meet together, you will not come under judgment.[a] I will give instructions about the other matters when I come.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “condemnation.” Here “judgment” refers most naturally to the Lord’s present discipline, not final condemnation (verses 29–32).
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: let him eat at home
  simplified_phrase: he should eat at home
  preserved_meaning: The singular command directs a hungry person to eat in his domestic setting.
  reasoning_layer_used: Lexical decisions for ἐσθιέτω and ἐν οἴκῳ
  rationale: “He should eat” states the command in natural modern English.
- pob_phrase: so that you may not come together for judgment
  simplified_phrase: so that when you meet together, you will not come under judgment
  preserved_meaning: The church must avoid gathering in a way that exposes its members to serious divine judgment.
  reasoning_layer_used: Lexical and theological decisions for εἰς κρίμα and συνέρχησθε
  rationale: The recast clause clarifies the consequence without making the judgment self-imposed.
- pob_phrase: about the rest
  simplified_phrase: about the other matters
  preserved_meaning: Paul postpones further practical instructions until his visit.
  reasoning_layer_used: Lexical decision for Τὰ δὲ λοιπὰ
  rationale: “Other matters” clearly refers to issues still awaiting instruction.
interpretive_expansions:
- pob_phrase: come together for judgment
  rendering: when you meet together, you will not come under judgment
  claim: The warning concerns judgment faced by the Corinthians when they gather improperly.
  evidence:
  - The repeated gathering verb in this passage refers to the assembled church.
  - Verses 29–32 describe participants being judged and disciplined by the Lord.
  confidence: high
  alternatives_preserved:
  - come together for judgment
  - come together for condemnation
translation_notes:
  risk_flags:
