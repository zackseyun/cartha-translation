  review_summary: The draft usefully clarifies that Paul is addressing the church’s gathering and that further matters remain for his visit. However, “bring judgment on yourselves” adds a causative, potentially self-imposed sense not expressed by the source and obscures the contextual point that the Lord judges and disciplines. “Come under judgment” remains clear, reflects the consequence conveyed by εἰς κρίμα, and retains the Lord’s agency as supplied by the immediate context and footnote.
