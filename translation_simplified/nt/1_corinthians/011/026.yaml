  text: For every time you eat this bread and drink from the cup, you proclaim the Lord’s death until he comes again.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: as often as you eat
  simplified_phrase: every time you eat
  preserved_meaning: The action is repeated, and the statement applies each time it happens.
  reasoning_layer_used: Lexical decision for ὁσάκις ... ἐὰν
  rationale: “Every time” expresses the same repeated occurrence in more familiar English.
- pob_phrase: drink the cup
  simplified_phrase: drink from the cup
  preserved_meaning: Participants drink what is served in the identified cup of the meal.
  reasoning_layer_used: Lexical decision for ποτήριον and immediate context
  rationale: Adding “from” prevents readers from picturing the cup itself being consumed while retaining the source image.
- pob_phrase: until he comes
  simplified_phrase: until he comes again
  preserved_meaning: The proclamation continues until the Lord Jesus returns.
  reasoning_layer_used: Theological decision on the implied subject and contextual referent
  rationale: “Again” makes the intended return clear to readers unfamiliar with this biblical expression.
interpretive_expansions:
- pob_phrase: until he comes
  rendering: until he comes again
  claim: The coming is the future return of the Lord Jesus.
  evidence:
  - The nearest antecedent of “he” is “the Lord.”
  - The POB theological decision identifies this as the Lord’s return.
  confidence: high
translation_notes:
  risk_flags:
