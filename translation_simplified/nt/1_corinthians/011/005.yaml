translation:
  language: en
  text: But any woman who prays or prophesies while her head is uncovered dishonors her head.[a][b] That is the same as having her head shaved.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “any wife who prays or prophesies … dishonors her husband or head.” The words for “woman” and “head” allow these meanings in this context.
    reason: alternative_reading
  - marker: b
    text: “Uncovered” does not identify a specific kind of covering, such as a veil.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: every woman who prays or prophesies
  simplified_phrase: any woman who prays or prophesies
  preserved_meaning: The statement applies generally to each woman engaged in either activity.
  reasoning_layer_used: Lexical decision for γυνή and the two participles
  rationale: “Any woman” expresses the distributive sense in natural modern English.
- pob_phrase: with her head uncovered
  simplified_phrase: while her head is uncovered
  preserved_meaning: Her uncovered head is the circumstance in which she prays or prophesies.
  reasoning_layer_used: Lexical decision for ἀκατακαλύπτῳ τῇ κεφαλῇ
  rationale: The time clause makes the relationship clear without specifying the covering.
- pob_phrase: for that is one and the same as having been shaved
  simplified_phrase: That is the same as having her head shaved.
  preserved_meaning: Paul emphatically equates the uncovered state with the resulting state after shaving.
  reasoning_layer_used: Lexical decisions for ἓν γάρ ἐστιν καὶ τὸ αὐτό and τῇ ἐξυρημένῃ
  rationale: A separate sentence states the comparison directly and keeps its force.
translation_notes:
  risk_flags:
  - risk: “Her head” may refer to her physical head or metaphorically to her relational head.
    mitigation: The main text retains the ambiguity, and footnote a names both possibilities.
  - risk: Readers may assume that “uncovered” specifically means without a veil.
    mitigation: Footnote b states that the exact kind of covering is not identified.
