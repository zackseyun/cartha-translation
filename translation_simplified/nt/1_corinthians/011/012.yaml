translation:
  language: en
  text: For just as woman came from man at creation, so men are born through women. But everything comes from God.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Woman” and “man” can also mean “wife” and “husband,” but the broader meaning fits the references to creation and birth here.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: the woman is from the man
  simplified_phrase: woman came from man at creation
  preserved_meaning: Woman’s origin from man in creation remains distinct from human birth.
  reasoning_layer_used: POB lexical and theological decisions on ἐκ and the creation allusion
  rationale: “At creation” clarifies the setting without identifying the woman as “the first woman.”
- pob_phrase: the man is through the woman
  simplified_phrase: men are born through women
  preserved_meaning: Men come into the world by means of women.
  reasoning_layer_used: POB lexical decision on διά and theological distinction between “from” and “through”
  rationale: The plural wording expresses the generic relationship naturally while preserving means rather than source.
- pob_phrase: all things are from God
  simplified_phrase: everything comes from God
  preserved_meaning: God is the ultimate source of all things.
  reasoning_layer_used: POB lexical decision on ἐκ τοῦ θεοῦ
  rationale: This is ordinary English for the same climactic claim.
