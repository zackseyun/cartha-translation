- pob_phrase: houses for eating and drinking
  simplified_phrase: homes where you can eat and drink
  preserved_meaning: Private homes are contrasted with the gathered church as the proper place for ordinary meals.
  reasoning_layer_used: lexical decisions for οἰκίας and εἰς τὸ ἐσθίειν καὶ πίνειν
  rationale: The new wording expresses the practical contrast in ordinary English.
- pob_phrase: shame those who have nothing
