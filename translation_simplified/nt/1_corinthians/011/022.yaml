  preserved_meaning: Their conduct causes disgrace to members who lack material resources.
  reasoning_layer_used: lexical decision for καταισχύνετε and theological decision for τοὺς μὴ ἔχοντας
  rationale: The verbal phrase is clearer while retaining the deliberately broad description of those in need.
- pob_phrase: What should I say to you?
  simplified_phrase: What am I supposed to say to you?
  preserved_meaning: Paul expresses rhetorical perplexity before refusing to praise them.
  reasoning_layer_used: lexical decision for τί εἴπω ὑμῖν
  rationale: This common expression preserves the force of the deliberative question.
