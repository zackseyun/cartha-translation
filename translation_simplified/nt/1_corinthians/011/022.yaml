translation:
  language: en
  text: Don't you have homes where you can eat and drink? Or do you despise the church of God and bring shame on those who have nothing?[a] What am I supposed to say to you? Should I praise you? No, I do not praise you for this.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may also mean “the poor” or “those who have no food.” The Greek literally says “those not having.”
    reason: lexical_alternative
