translation:
  language: en
  text: But if a woman[a] wears her hair long, it is her glory, because her hair has been given to her in place of a covering.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word may also mean “wife,” depending on the context.
    reason: lexical_alternative
  - marker: b
    text: Or “as a covering.” The Greek may indicate either substitution or correspondence, so this phrase alone does not settle how the hair relates to a covering.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: if a woman has long hair
  simplified_phrase: if a woman wears her hair long
  preserved_meaning: The conditional statement concerns a woman having or wearing long hair.
  reasoning_layer_used: Lexical decision for κομᾷ and grounding review
  rationale: “Wears her hair long” expresses the verb naturally while “if” preserves the Greek condition.
- pob_phrase: instead of a covering
  simplified_phrase: in place of a covering
  preserved_meaning: Her hair is given in a role of substitution or correspondence to a covering.
  reasoning_layer_used: Lexical and theological decisions for ἀντί and περιβόλαιον
  rationale: “In place of” is common English, while the footnote preserves the possible correspondence sense.
- pob_phrase: it is her glory, because her hair has been given to her
  simplified_phrase: it is her glory, because her hair has been given to her
  preserved_meaning: The gift of her hair is presented as the reason it is her glory.
  reasoning_layer_used: Source conjunction ὅτι and lexical decisions for δόξα and δέδοται
  rationale: Keeping “because” makes Paul’s stated reason explicit and retains the passive gift.
translation_notes:
  risk_flags:
  - risk: “In place of” may sound as though the verse rules out an additional covering.
    mitigation: Footnote b preserves the possible correspondence sense and the passage’s interpretive tension.
