translation:
  language: en
  text: A man[a] should not cover his head[b], because he is the image and glory of God. But the woman is the glory of man.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek words can also mean “husband” and “wife,” but the context supports the broader meaning “man” and “woman.”
    reason: alternative_reading
  - marker: b
    text: The Greek refers generally to covering the head; it does not specify a veil.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: ought not to cover his head
  simplified_phrase: should not cover his head
  preserved_meaning: A man has a moral obligation not to cover his head in this setting.
  reasoning_layer_used: Lexical decisions for ὀφείλει and κατακαλύπτεσθαι τὴν κεφαλήν
  rationale: “Should not” is common English and retains the prohibition and concrete image.
- pob_phrase: since he is
  simplified_phrase: because he is
  preserved_meaning: Being God’s image and glory is the stated reason for the instruction.
  reasoning_layer_used: Lexical decision for ὑπάρχων
  rationale: “Because” makes the causal link immediately clear.
- pob_phrase: but the woman is the glory of man
  simplified_phrase: But the woman is the glory of man.
  preserved_meaning: Paul’s direct and asymmetrical theological statement remains intact.
  reasoning_layer_used: Theological decision to preserve tension and retain δόξα as “glory”
  rationale: The article is retained for natural English without softening the claim.
translation_notes:
  risk_flags:
  - risk: Readers may find “glory of man” difficult or theologically tense.
    mitigation: The wording remains because replacing “glory” would narrow or soften Paul’s claim.
  - risk: Modern readers may assume the verse refers only to spouses.
    mitigation: The text follows POB’s broader man/woman reading, while footnote a preserves the marital alternative.
