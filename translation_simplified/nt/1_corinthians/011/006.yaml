translation:
  language: en
  text: If a woman[a] leaves her head uncovered[b], she should also have her hair cropped close. But if it is disgraceful for a woman to have closely cropped hair or a shaved head, she should cover her head.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “wife” throughout this verse; the Greek word can mean either “woman” or “wife,” depending on the context.
    reason: alternative_reading
  - marker: b
    text: The Greek can also be translated “is not veiled”; no particular kind of head covering is specified.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: does not cover her head
  simplified_phrase: leaves her head uncovered
  preserved_meaning: Her head is not covered.
  reasoning_layer_used: Lexical decision for κατακαλύπτεται
  rationale: This states the condition naturally without specifying a garment.
- pob_phrase: have her hair cut off
  simplified_phrase: have her hair cropped close
  preserved_meaning: The hair is cut very short rather than merely trimmed.
  reasoning_layer_used: Lexical decisions for κειράσθω and τὸ κείρασθαι
  rationale: “Cropped close” distinguishes severe cutting from ordinary hair care.
- pob_phrase: to have her hair cut off or to be shaved
  simplified_phrase: to have closely cropped hair or a shaved head
  preserved_meaning: Very short cutting remains distinct from shaving.
  reasoning_layer_used: Lexical contrast between κείρασθαι and ξυρᾶσθαι
  rationale: The concrete results are easy to picture while preserving both states.
translation_notes:
  risk_flags:
  - risk: “Woman” may also mean “wife” in the broader passage.
    mitigation: Footnote a retains the alternative.
  - risk: “Cropped close” could sound less severe than shearing.
    mitigation: The phrase indicates very short hair and remains contrasted with shaving.
