translation:
  language: en
  text: Therefore, anyone who eats the bread in an unworthy way—or drinks the Lord’s cup that way—will be answerable for the Lord’s body and blood.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “In an unworthy way” describes how the person eats or drinks, not the person’s worth.
    reason: lexical_alternative
  - marker: b
    text: Or, “will be guilty concerning the Lord’s body and blood.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: eats the bread or drinks the cup of the Lord in an unworthy manner
  simplified_phrase: eats the bread in an unworthy way—or drinks the Lord’s cup that way
  preserved_meaning: The warning concerns either act and the manner in which it is done.
  reasoning_layer_used: lexical and theological decisions on ἢ and ἀναξίως
  rationale: Repeating the manner through “that way” makes its scope clear without changing “or” to “and.”
- pob_phrase: will be guilty concerning
  simplified_phrase: will be answerable for
  preserved_meaning: The person bears serious guilt or liability with respect to the Lord’s body and blood.
  reasoning_layer_used: lexical decision on ἔνοχος and its genitive complement
  rationale: “Answerable for” is a clearer approved alternative that avoids over-defining the legal nuance.
- pob_phrase: the cup of the Lord
  simplified_phrase: the Lord’s cup
  preserved_meaning: The cup belongs to and is associated with the Lord.
  reasoning_layer_used: lexical decision on τοῦ κυρίου
  rationale: The possessive form is more natural modern English and keeps the same association.
translation_notes:
  risk_flags:
  - risk: “Answerable for” may sound less explicitly judicial than “guilty concerning.”
    mitigation: Footnote b preserves the POB wording and its stronger guilt language.
  - risk: Readers may mistake “unworthy” as describing the participant.
    mitigation: Footnote a states that the phrase describes the manner of eating or drinking.
