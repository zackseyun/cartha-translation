  preserved_meaning: Paul contrasts this wisdom with what came before and speaks of spiritually mature hearers.
  reasoning_layer_used: Lexical decisions for δέ and ἐν τοῖς τελείοις
  rationale: The wording clarifies the kind of maturity while keeping the emphatic contrast.
- pob_phrase: but not a wisdom of this age or of the rulers of this age
  simplified_phrase: But it is not a wisdom of this age or of the rulers of this age
  preserved_meaning: This wisdom does not belong to the present age or its rulers.
