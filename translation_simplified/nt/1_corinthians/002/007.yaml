translation:
  language: en
  text: 'Instead, we speak God''s wisdom: the mystery[a] that had been hidden. Before the ages began, God predestined this wisdom for our glory.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “mystery” means God's plan that was once hidden and has now been revealed.
    reason: simplification_note
simplification_decisions:
- pob_phrase: But we speak God's wisdom in a mystery
  simplified_phrase: 'Instead, we speak God''s wisdom: the mystery'
  preserved_meaning: God's wisdom is the content being spoken and is identified as the mystery.
  reasoning_layer_used: POB lexical decisions for λαλοῦμεν, θεοῦ σοφίαν, and ἐν μυστηρίῳ
  rationale: The colon clarifies the relationship while retaining the direct-object force of “speak God's wisdom.”
- pob_phrase: the hidden wisdom
  simplified_phrase: the mystery that had been hidden
  preserved_meaning: God's wisdom was concealed in the past.
  reasoning_layer_used: POB lexical decision for τὴν ἀποκεκρυμμένην
  rationale: The relative clause avoids repetition and clearly identifies the mystery as formerly hidden.
- pob_phrase: before the ages
  simplified_phrase: Before the ages began
  preserved_meaning: God's determination preceded the temporal-cosmic ages.
  reasoning_layer_used: POB lexical decision for πρὸ τῶν αἰώνων
  rationale: Adding “began” makes the time expression natural without reducing its cosmic scope.
translation_notes:
  risk_flags:
  - risk: Modern readers may understand “mystery” as an unsolved puzzle.
    mitigation: The footnote explains its Pauline sense as God's once-hidden and now-revealed plan.
  - risk: “Predestined” may evoke a narrower doctrinal system than this verse states.
    mitigation: The term is retained for its lexical force without adding a doctrinal interpretation.
