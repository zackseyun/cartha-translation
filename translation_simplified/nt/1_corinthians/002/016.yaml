simplification_decisions:
- pob_phrase: who has known the mind of the Lord, that he may instruct him?
  simplified_phrase: who has understood the Lord’s mind and can teach him?
  preserved_meaning: No one understands the Lord’s thinking well enough to direct or teach him.
  reasoning_layer_used: Lexical decisions for ἔγνω, νοῦν, and ὃς συμβιβάσει αὐτόν
  rationale: The ordinary verbs “understood” and “teach” make the rhetorical question immediately clear.
- pob_phrase: the mind of Messiah
