simplification_decisions:
- pob_phrase: the spirit of the world
  simplified_phrase: the spirit of this world
  preserved_meaning: The lowercase spirit remains associated with the present fallen human order rather than the Holy Spirit.
  reasoning_layer_used: POB lexical decisions for πνεῦμα and κόσμου
  rationale: Using “this world” is natural English and avoids specifying how the spirit relates to the world.
- pob_phrase: but the Spirit from God
  simplified_phrase: Instead, we have received the Spirit from God
  preserved_meaning: The contrast identifies the received Spirit as the divine Spirit given by God.
  reasoning_layer_used: POB theological decision on πνεῦμα τὸ ἐκ τοῦ θεοῦ
  rationale: A new sentence makes the contrast easier to follow without weakening it.
- pob_phrase: the things graciously given to us by God
  simplified_phrase: what God has graciously given us
  preserved_meaning: The wording retains both the broad scope and the gracious character of God's giving.
  reasoning_layer_used: POB lexical decision for χαρισθέντα and the neuter plural construction
  rationale: Using “what” removes an awkward phrase without limiting the gifts in view.
