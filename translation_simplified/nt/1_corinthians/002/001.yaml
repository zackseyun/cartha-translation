- pob_phrase: proclaiming to you
  simplified_phrase: as I proclaimed
  preserved_meaning: The proclamation occurred in connection with Paul’s coming to the Corinthians.
  reasoning_layer_used: POB lexical decision for καταγγέλλων
  rationale: A finite clause replaces the awkward English participle while retaining its public declarative force.
