translation:
  language: en
  text: God has made these things[a] known to us through the Spirit, because the Spirit searches everything, even the depths of God.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek leaves “these things” unstated; it may also be translated “made them known to us.”
    reason: alternative_reading
  - marker: b
