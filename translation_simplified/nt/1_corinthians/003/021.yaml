  review_summary: 'The modernization of “let no one” to “no one should,” “for” to “because,” and “all things are yours” to “everything belongs to you” is clear and warranted. However, the main clause should make explicit the immediately established referent of Paul’s prohibition: human leaders. This is a contextual clarification, not an imported doctrinal claim; retaining “people” with a tentative footnote leaves a live modern-English misunderstanding of “boast about” insufficiently resolved.'
