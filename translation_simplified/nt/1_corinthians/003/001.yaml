simplification_decisions:
- pob_phrase: And I, brothers, was not able to speak to you
  simplified_phrase: Brothers, I could not speak to you
  preserved_meaning: Paul directly addresses the congregation and says he lacked the ability to address them in the desired way.
  reasoning_layer_used: Lexical decisions for Κἀγώ, ἀδελφοί, and οὐκ ἠδυνήθην
  rationale: The reordered address and “could not” express the same meaning in natural English.
- pob_phrase: but as fleshly people
  simplified_phrase: Instead, I spoke to you as fleshly people
  preserved_meaning: Paul contrasts speaking to spiritual people with speaking to people characterized as fleshly.
  reasoning_layer_used: Lexical decision for σαρκίνοις and the Greek contrast
  rationale: Supplying “I spoke” makes the contrast clear without adding necessity or compulsion.
- pob_phrase: one continuous contrast sentence
  simplified_phrase: two sentences linked by “Instead”
  preserved_meaning: The second statement remains the direct contrast to Paul’s inability in the first.
  reasoning_layer_used: POB syntax and immediate context
  rationale: The sentence break helps readers follow the contrast while keeping both images distinct.
translation_notes:
  risk_flags:
  - risk: “Fleshly people” may be unfamiliar to some modern readers.
    mitigation: The phrase preserves the source image, while “infants in Messiah” immediately clarifies the emphasis on immaturity.
