simplification_decisions:
- pob_phrase: whether Paul or Apollos or Cephas or the world or life or death
  simplified_phrase: Whether it is Paul or Apollos or Cephas, or the world or life or death
  preserved_meaning: The people and realities remain in one comprehensive series of alternatives.
  reasoning_layer_used: POB lexical decisions for εἴτε … εἴτε and the listed nouns
  rationale: Adding “it is” and grouping the list with commas improves readability while repeated “or” preserves its rhetorical force.
- pob_phrase: things present or things to come
  simplified_phrase: what is now or what is to come
  preserved_meaning: The contrast between present and future realities remains intact.
  reasoning_layer_used: POB lexical decisions for ἐνεστῶτα and μέλλοντα
  rationale: Common time language avoids both abstract wording and an added claim about existence.
- pob_phrase: all are yours
  simplified_phrase: everything belongs to you
  preserved_meaning: The conclusion still says that the whole list is theirs.
  reasoning_layer_used: POB lexical decisions for πάντα and ὑμῶν
  rationale: This wording expresses possession directly in common English.
translation_notes:
