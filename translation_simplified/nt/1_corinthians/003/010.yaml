  review_summary: 'The draft is substantially clearer and its clarification of “each one” as “every builder” is warranted by the immediate building metaphor and retains the individual warning. Revise the opening, however: the infinitive “grace to lay” narrows the relation between God’s given grace and Paul’s work into a specific purpose/ability claim. “Because God gave me grace” communicates the divine gift and its relation to Paul’s action without making that narrower claim. Using singular they avoids suggesting that the warning excludes women while preserving the distributive singular sense.'
