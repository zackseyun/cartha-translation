translation:
  language: en
  text: God gave me grace. In keeping with that grace, I laid a foundation like a wise master builder. Someone else is building on it. But every builder must be careful how they build.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: According to the grace of God given to me
  simplified_phrase: God gave me grace. In keeping with that grace
  preserved_meaning: Paul carried out his work in conformity with God’s grace, not merely through a gift limited to this task.
  reasoning_layer_used: lexical decisions for Κατὰ, χάριν, and τὴν δοθεῖσάν μοι
  rationale: Two short clauses make the gift and its governing relation to Paul’s work clear without narrowing its purpose.
- pob_phrase: and another builds on it
  simplified_phrase: Someone else is building on it
  preserved_meaning: A different worker continues building on the foundation Paul laid.
  reasoning_layer_used: lexical decisions for ἄλλος and ἐποικοδομεῖ
  rationale: The wording is natural modern English and keeps the continuing construction image.
- pob_phrase: let each one be careful how he builds
  simplified_phrase: every builder must be careful how they build
  preserved_meaning: Each individual worker is responsible for the manner of their building.
  reasoning_layer_used: lexical and theological decisions for ἕκαστος and βλεπέτω
  rationale: The wording identifies the people in view and preserves the warning’s individual, representative scope.
interpretive_expansions:
- pob_phrase: each one
  rendering: every builder
  claim: The warning addresses each person who builds on the foundation.
  evidence:
  - The surrounding clauses and repeated verb concern people building on Paul’s foundation.
  confidence: high
  alternatives_preserved:
  - The warning applies distributively to each worker.
translation_notes:
  risk_flags:
  - risk: Splitting the opening could make grace seem detached from Paul’s work.
    mitigation: “In keeping with that grace” explicitly connects the gift to his foundation-laying.
  - risk: Singular “they” does not mirror the Greek masculine form.
    mitigation: It preserves the representative singular sense without implying that only men are included.
