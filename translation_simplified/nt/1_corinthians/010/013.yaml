translation:
  language: en
  text: No temptation has come upon you except what people commonly face.[a] But God is faithful. He will not allow you to be tempted beyond what you can bear. Along with the temptation, he will also provide a way out,[b] so that you can endure it.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Temptation” can also mean “testing” or “trial” in this verse.
    reason: lexical_alternative
  - marker: b
    text: Or “an escape” or “an outcome”; God’s provision enables you to endure the temptation.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: No temptation has overtaken you except what is common to man
  simplified_phrase: No temptation has come upon you except what people commonly face
  preserved_meaning: Their temptation is a normal human experience, not something unique or superhuman.
  reasoning_layer_used: Lexical decisions for εἴληφεν and ἀνθρώπινος
  rationale: Common wording replaces the older generic phrase while retaining the human scope.
- pob_phrase: beyond what you are able
  simplified_phrase: beyond what you can bear
  preserved_meaning: God limits the temptation to what they are able to endure.
  reasoning_layer_used: Lexical decision for ὑπὲρ ὃ δύνασθε
  rationale: The documented alternative is clearer and anticipates the final idea of endurance.
- pob_phrase: with the temptation will also provide the way out
  simplified_phrase: Along with the temptation, he will also provide a way out
  preserved_meaning: God’s provision accompanies the temptation and enables perseverance.
  reasoning_layer_used: Lexical decisions for σὺν τῷ πειρασμῷ and ἔκβασιν
  rationale: Ordinary clause order clarifies that God provides help while the temptation is present.
translation_notes:
  risk_flags:
  - risk: “Temptation” may be read too narrowly as enticement to sin.
    mitigation: The footnote preserves the broader senses “testing” and “trial.”
  - risk: “A way out” may suggest immediate removal rather than endurance.
    mitigation: The purpose clause and footnote retain the emphasis on enduring the temptation.
