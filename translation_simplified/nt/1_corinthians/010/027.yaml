translation:
  language: en
  text: Suppose an unbeliever invites you to a meal, and you want to go. Eat whatever they serve you. For the sake of conscience,[a] do not ask questions about the food.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The next verse clarifies whose conscience Paul especially has in mind when someone raises a concern.
    reason: cross_reference
simplification_decisions:
- pob_phrase: If one of the unbelievers invites you
  simplified_phrase: Suppose an unbeliever invites you to a meal
  preserved_meaning: A non-Christian host invites a believer to dine.
  reasoning_layer_used: Lexical decisions for ἀπίστων and καλεῖ, together with the meal context
  rationale: The conditional is recast naturally, while “to a meal” makes the social setting clear.
- pob_phrase: eat whatever is set before you
  simplified_phrase: Eat whatever they serve you
  preserved_meaning: The believer may eat all the food the host provides.
  reasoning_layer_used: Lexical decision for πᾶν τὸ παρατιθέμενον ὑμῖν
  rationale: “Serve” states the meal action in ordinary English without narrowing the command.
- pob_phrase: asking no questions for the sake of conscience
  simplified_phrase: For the sake of conscience, do not ask questions about the food
  preserved_meaning: Do not investigate the food’s background merely because conscience could become an issue.
  reasoning_layer_used: Lexical decision for μηδὲν ἀνακρίνοντες and theological decision on συνείδησις
  rationale: The sentence directly names the food as the subject of inquiry while leaving whose conscience unspecified.
