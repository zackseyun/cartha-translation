simplification_decisions:
- pob_phrase: No, but what they sacrifice, they sacrifice to demons and not to God
  simplified_phrase: No. Instead, when people offer these sacrifices, they are sacrificing to demons, not to God.
  preserved_meaning: The sacrifices are directed to demons rather than to God.
  reasoning_layer_used: Lexical decisions for ἀλλ’ ὅτι, ἃ θύουσιν, δαιμονίοις, and καὶ οὐ θεῷ.
  rationale: Two sentences and an ordinary time clause make Paul's correction easier to follow.
- pob_phrase: sharers with demons
  simplified_phrase: participants with demons
  preserved_meaning: Paul warns against real participatory association with demons without claiming total allegiance.
  reasoning_layer_used: Lexical and theological decisions for κοινωνοὺς τῶν δαιμονίων.
  rationale: “Participants” states the relational involvement more naturally than “sharers” for modern readers.
