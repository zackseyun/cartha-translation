  preserved_meaning: The warning is against turning to idol worship.
  reasoning_layer_used: POB lexical decision for εἰδωλολάτραι and γίνεσθε
  rationale: The expanded wording explains “idolaters” while retaining the idea of becoming.
- pob_phrase: just as it is written
  simplified_phrase: Scripture says
  preserved_meaning: Paul introduces an authoritative written quotation.
  reasoning_layer_used: POB lexical decision for ὥσπερ γέγραπται
  rationale: The common citation formula is clearer without changing its function.
- pob_phrase: rose up to play
  simplified_phrase: got up to play
  preserved_meaning: The people moved from eating and drinking to the activity called “play.”
  reasoning_layer_used: POB lexical decisions for ἀνέστησαν and παίζειν
  rationale: “Got up” is ordinary English, while “play” remains to preserve the quotation’s ambiguity.
