translation:
  language: en
  text: Do not become worshipers of idols, as some of them did. Scripture says, “The people sat down to eat and drink, and they got up to play.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “to revel.” This quotation comes from Exodus 32:6, where their “play” was part of the idolatrous feast around the golden calf.
    reason: lexical_alternative
