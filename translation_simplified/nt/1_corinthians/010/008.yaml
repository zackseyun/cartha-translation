translation:
  language: en
  text: And we must not commit sexual immorality, as some of them did. In a single day, twenty-three thousand[b] fell dead.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek says “fell,” an image referring here to death under judgment.
    reason: lexical_alternative
  - marker: b
    text: Numbers 25:9 gives a total of twenty-four thousand. Paul says twenty-three thousand fell “in one day,” perhaps referring to those who died that day, but the difference is not resolved here.
    reason: cross_reference
