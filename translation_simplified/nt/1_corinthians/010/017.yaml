translation:
  language: en
  text: Because there is one bread,[a] we who are many are one body, since we all share in that one bread.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “one loaf” in both places. This emphasizes that everyone shares from the same loaf.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: for we all partake of the one bread
  simplified_phrase: since we all share in that one bread
  preserved_meaning: Every believer participates in the same bread, explaining their unity as one body.
  reasoning_layer_used: Lexical decision for μετέχομεν and theological decision on shared participation
  rationale: “Share in” expresses participation more clearly than the less common “partake of.”
- pob_phrase: Because there is one bread ... for
  simplified_phrase: Because there is one bread ... since
  preserved_meaning: The one bread grounds the believers’ unity, and their common participation explains that connection.
  reasoning_layer_used: Lexical decisions for ὅτι and γὰρ
  rationale: “Since” avoids repeating “because” while keeping the second clause explanatory.
translation_notes:
  risk_flags:
  - risk: Readers may take the verse as settling later debates about the Lord’s Supper.
    mitigation: The wording preserves Paul’s link between shared bread and one body without defining how that relationship works.
