  text: You cannot drink from both the Lord’s cup and the cup of demons. You cannot share in both the Lord’s table and the table of demons.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: drink the cup of the Lord and the cup of demons
  simplified_phrase: drink from both the Lord’s cup and the cup of demons
  preserved_meaning: The two cups represent incompatible participation.
  reasoning_layer_used: Lexical decisions for ποτήριον and οὐ δύνασθε; theological decision on categorical incompatibility.
  rationale: “Drink from” is natural English, and “both” makes the incompatibility clear.
- pob_phrase: partake of the table of the Lord and the table of demons
  simplified_phrase: share in both the Lord’s table and the table of demons
  preserved_meaning: Participation in the Lord’s table is incompatible with participation in the table of demons.
  reasoning_layer_used: Lexical decisions for τραπέζης and μετέχειν; theological decision on categorical incompatibility.
  rationale: “Share in” replaces archaic wording while preserving the table image and participatory force.
