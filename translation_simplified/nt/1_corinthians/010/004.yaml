translation:
  language: en
  text: They all drank the same spiritual drink. They kept drinking from a spiritual rock that was following them. That rock was the Messiah.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: and all drank the same spiritual drink
  simplified_phrase: They all drank the same spiritual drink.
  preserved_meaning: The whole group shared the same spiritually significant provision.
  reasoning_layer_used: Lexical decision for πάντες τὸ αὐτὸ and πνευματικὸν πόμα
  rationale: A separate sentence makes Paul’s emphasis on their shared experience immediately clear.
- pob_phrase: for they were drinking from a spiritual rock that followed them
  simplified_phrase: They kept drinking from a spiritual rock that was following them.
  preserved_meaning: Their drinking was ongoing, and the spiritual rock accompanied them.
  reasoning_layer_used: Lexical decisions for ἔπινον and ἀκολουθούσης
  rationale: “Kept drinking” and “was following” clearly preserve the two ongoing actions.
- pob_phrase: and the rock was the Messiah
  simplified_phrase: That rock was the Messiah.
  preserved_meaning: Paul directly identifies the wilderness rock with the Messiah in a typological sense.
  reasoning_layer_used: Theological decision on the identity statement and lexical decision for Χριστός
  rationale: A short sentence preserves the force of Paul’s claim without explaining away the image.
translation_notes:
  risk_flags:
  - risk: Modern readers may take “spiritual” to mean unreal or merely symbolic.
    mitigation: The term is retained because Paul uses it for divinely given, spiritually significant provision.
  - risk: “The rock was the Messiah” may sound like a literal equation of an object and a person.
    mitigation: The direct wording preserves Paul’s intentional typological tension without adding a philosophical explanation.
