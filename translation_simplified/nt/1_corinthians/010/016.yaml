translation:
  language: en
  text: When we bless the cup of blessing, are we not sharing in the Messiah’s blood? When we break the bread, are we not sharing in the Messiah’s body?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “participating in”; traditionally, “communion with.”
    reason: lexical_alternative
  - marker: b
    text: Greek Christos, meaning “Messiah”; traditionally translated “Christ.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: The cup of blessing that we bless—is it not
  simplified_phrase: When we bless the cup of blessing, are we not
  preserved_meaning: The blessed cup remains the subject of a rhetorical question expecting yes.
  reasoning_layer_used: Lexical decisions for εὐλογία, εὐλογοῦμεν, and οὐχί
  rationale: The time clause gives the sentence a more natural English flow while preserving the repeated blessing language.
- pob_phrase: a sharing in the blood of Messiah
  simplified_phrase: sharing in the Messiah’s blood
  preserved_meaning: The cup involves real participation in the Messiah’s blood without defining its mode.
  reasoning_layer_used: Theological decision on κοινωνία and lexical decision on Χριστός
  rationale: The possessive form is easier to read and keeps both the participatory force and the title Messiah.
- pob_phrase: The bread that we break—is it not a sharing in the body of Messiah?
  simplified_phrase: When we break the bread, are we not sharing in the Messiah’s body?
  preserved_meaning: Breaking the bread involves real participation in the Messiah’s body.
  reasoning_layer_used: Lexical decisions for ἄρτος, κλάω, κοινωνία, and σῶμα
  rationale: The action-first sentence is clearer while retaining the concrete breaking of bread and the rhetorical question.
translation_notes:
  risk_flags:
  - risk: “Sharing in” could be mistaken for mere social fellowship.
    mitigation: The objects “blood” and “body,” together with the lexical footnote, preserve the sense of real participation.
  - risk: Readers may expect the traditional title “Christ.”
    mitigation: The main text follows POB’s title policy, and the footnote preserves the traditional rendering.
