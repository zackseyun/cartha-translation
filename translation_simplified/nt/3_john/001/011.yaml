  simplified_phrase: do not copy what is evil. Copy what is good instead
  preserved_meaning: The reader must reject evil examples and imitate good ones.
  reasoning_layer_used: Lexical decisions for μὴ μιμοῦ, τὸ κακόν, and τὸ ἀγαθόν
  rationale: “Copy” and two short sentences make the moral contrast immediately clear.
- pob_phrase: The one who does good
  simplified_phrase: Anyone who does good
  preserved_meaning: Doing good characterizes a person whose source or belonging is God.
  reasoning_layer_used: Lexical decision for ὁ ἀγαθοποιῶν
  rationale: “Anyone” gives the proverbial statement natural modern form without changing its scope.
- pob_phrase: the one who does evil
  simplified_phrase: Anyone who does evil
  preserved_meaning: Doing evil reveals that a person has not seen God.
  reasoning_layer_used: Lexical and theological decisions for ὁ κακοποιῶν and οὐχ ἑώρακεν τὸν θεόν
  rationale: The parallel wording stays clear while preserving the verse’s strong Johannine warning.
