translation:
  language: en
  text: For I was filled with joy when brothers[a] came and testified about the truth in you,[b] just as you continue to live in the truth.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Brothers” may refer more broadly to fellow believers, including women.
    reason: lexical_alternative
  - marker: b
    text: The phrase may also mean “testified about your faithfulness to the truth”; more literally, “testified to your truth.”
