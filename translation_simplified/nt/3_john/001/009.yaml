translation:
  language: en
  text: I wrote something to the church.[a] But Diotrephes loves being the most important person among them, and he does not receive us.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “I wrote a brief note to the church.” The Greek says “something,” while some manuscripts have expanded wording.
    reason: textual_variant
  - marker: b
    text: “Receive us” may mean welcome us, accept us, or acknowledge us.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: who loves to be first among them
  simplified_phrase: loves being the most important person among them
  preserved_meaning: Diotrephes seeks preeminence within the church without specifying formal authority.
  reasoning_layer_used: Lexical decision for ὁ φιλοπρωτεύων αὐτῶν
  rationale: This explains the status sense of “first” in ordinary English.
- pob_phrase: does not receive us
  simplified_phrase: does not receive us
  preserved_meaning: Diotrephes rejects the writer and his associates without narrowing the kind of rejection.
  reasoning_layer_used: Lexical and theological decisions for οὐκ ἐπιδέχεται ἡμᾶς
  rationale: Keeping the present tense avoids adding a future or volitional nuance.
interpretive_expansions:
