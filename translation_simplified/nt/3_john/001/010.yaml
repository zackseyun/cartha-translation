- pob_phrase: For this reason, if I come, I will call attention to the works he is doing
  simplified_phrase: So if I come, I will call attention to what he is doing.
  preserved_meaning: John will bring Diotrephes’s ongoing conduct to notice if he comes.
  reasoning_layer_used: Lexical decisions for διὰ τοῦτο, ὑπομνήσω, and αὐτοῦ τὰ ἔργα ἃ ποιεῖ.
  rationale: Common wording preserves the causal link and the sense of public accountability.
- pob_phrase: maliciously babbling against us with evil words
  simplified_phrase: He spreads malicious nonsense about us.
  preserved_meaning: Diotrephes directs hostile, empty speech against John and his associates.
  reasoning_layer_used: Lexical decisions for λόγοις πονηροῖς and φλυαρῶν ἡμᾶς.
  rationale: A separate sentence clearly preserves both the emptiness and malice of his speech.
- pob_phrase: not content with these things, he himself does not receive the brothers, and he hinders those who want to do so
  simplified_phrase: But he does not stop there. He refuses to welcome the brothers and prevents others from welcoming them.
  preserved_meaning: His misconduct extends from slander to refusing hospitality and obstructing willing hosts.
  reasoning_layer_used: Lexical decisions for μὴ ἀρκούμενος, ἐπιδέχεται, τοὺς ἀδελφούς, and κωλύει.
  rationale: Short clauses clarify the escalation and state the implied act of hospitality.
