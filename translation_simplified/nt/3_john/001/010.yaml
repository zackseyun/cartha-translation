translation:
  language: en
  text: So if I come, I will call attention to what he is doing. He spreads malicious nonsense about us. But he does not stop there. He refuses to welcome the brothers, prevents others from welcoming them, and throws those who are willing to welcome them out of the church.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “The brothers” likely means traveling Christian brothers or missionaries.
    reason: lexical_alternative
