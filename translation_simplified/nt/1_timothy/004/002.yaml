simplification_decisions:
- pob_phrase: through the hypocrisy of liars
  simplified_phrase: through liars who pretend to be something they are not
  preserved_meaning: The liars use a false outward presentation without specifying what they pretend to be.
  reasoning_layer_used: Lexical decisions for ἐν, ὑποκρίσει, and ψευδολόγων
  rationale: The abstract phrase becomes a direct description while preserving the means, falsehood, and open-ended hypocrisy.
- pob_phrase: whose own conscience has been seared
  simplified_phrase: Their own consciences have been seared
  preserved_meaning: The liars remain in the resulting state pictured by seared consciences.
  reasoning_layer_used: Lexical decisions for κεκαυστηριασμένων and τὴν ἰδίαν συνείδησιν
  rationale: The plural wording is natural English and retains the possessive emphasis and searing image.
translation_notes:
  risk_flags:
  - risk: Readers may take “seared” as proving irreversible spiritual ruin.
    mitigation: The footnote explains the image without claiming permanent spiritual impossibility.
