translation:
  language: en
  text: For this purpose we work hard and suffer insults, because we have put our hope in the living God. He is the Savior of all people, especially of those who believe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The wording leaves open how God is Savior of all people while being Savior especially of believers.
    reason: alternative_reading
