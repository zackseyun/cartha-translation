  preserved_meaning: Their strenuous work serves the aim stated in the preceding context.
  reasoning_layer_used: Lexical decision for εἰς τοῦτο and κοπιῶμεν
  rationale: Common wording preserves both purpose and strenuous effort.
- pob_phrase: are reproached
  simplified_phrase: suffer insults
  preserved_meaning: They receive verbal scorn and public shame.
  reasoning_layer_used: Lexical decision for ὀνειδιζόμεθα
  rationale: The active English expression makes the mistreatment immediately clear.
- pob_phrase: especially of believers
  simplified_phrase: especially of those who believe
  preserved_meaning: God has a distinct, heightened saving relation to believers without narrowing the reference to all people.
  reasoning_layer_used: Lexical and theological decisions for μάλιστα πιστῶν
  rationale: The wording explains believers while preserving the verse's theological tension.
