translation:
  language: en
  text: Do not let anyone look down on you because you are young. Instead, set an example for the believers by what you say, how you live, and by your love, faith[a], and purity.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “faithfulness.” The Greek word can mean either faith or faithfulness here.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Let no one look down on your youth
  simplified_phrase: Do not let anyone look down on you because you are young
  preserved_meaning: Others must not treat Timothy with contempt because of his young age.
  reasoning_layer_used: Lexical decisions for μηδείς, καταφρονείτω, and τῆς νεότητος
  rationale: The causal wording makes the social meaning of “your youth” immediately clear.
- pob_phrase: be an example for the believers
  simplified_phrase: set an example for the believers
  preserved_meaning: Timothy must provide believers with a pattern worth following.
  reasoning_layer_used: Lexical decisions for τύπος, γίνου, and τῶν πιστῶν
  rationale: “Set an example” is natural modern English for serving as an exemplary pattern.
- pob_phrase: in speech, in conduct
  simplified_phrase: by what you say, how you live
  preserved_meaning: His words and way of life must both be exemplary.
  reasoning_layer_used: Lexical decisions for λόγος and ἀναστροφή
  rationale: Concrete wording replaces formal virtue-list terms without merging the two areas.
translation_notes:
  risk_flags:
  - risk: Readers may take “faith” only as inward belief, though the Greek may mean faithfulness.
    mitigation: The footnote preserves the documented alternative without resolving the ambiguity.
