  preserved_meaning: Paul affectionately gives Timothy a solemn responsibility.
  reasoning_layer_used: POB lexical decisions for παραγγελίαν, παρατίθεμαί, and τέκνον
  rationale: Natural word order and “dear” convey the affectionate address without adding a possessive.
- pob_phrase: in accordance with the prophecies previously made about you
  simplified_phrase: in keeping with the prophecies made earlier about you
  preserved_meaning: The earlier prophecies concerning Timothy ground or guide Paul's charge.
  reasoning_layer_used: POB lexical and theological decisions on κατά, προαγούσας, and Timothy's commissioning
  rationale: Common wording preserves the connection without imposing an ordination theory.
- pob_phrase: wage the good warfare
