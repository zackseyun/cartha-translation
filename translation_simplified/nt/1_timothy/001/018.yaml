translation:
  language: en
  text: Timothy, dear child, I entrust this charge to you in keeping with the prophecies made earlier about you.[a] I do this so that, with their help,[b] you may carry on the good campaign.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “spoken over you.”
    reason: lexical_alternative
  - marker: b
    text: The Greek may also mean “through them” or “in them.”
    reason: lexical_alternative
  - marker: c
    text: The Greek uses a military image, more literally, “wage the good warfare.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: This charge I entrust to you, child Timothy
