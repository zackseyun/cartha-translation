translation:
  language: en
  text: 'Understand this: the law is not put in place for a righteous man. It is put in place for lawless people and those who refuse to obey, for ungodly and sinful people, for those who dishonor what is holy and treat sacred things as common, for those who kill their fathers and those who kill their mothers,[a] and for murderers,'
