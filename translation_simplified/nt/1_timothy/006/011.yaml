simplification_decisions:
- pob_phrase: flee these things; but pursue
  simplified_phrase: run from these things. Instead, pursue
  preserved_meaning: Timothy must urgently reject the preceding evils and actively seek the listed virtues.
  reasoning_layer_used: Lexical decisions for φεῦγε and δίωκε, plus the revision preserving the contrast.
  rationale: Two sentences clarify the opposing commands while keeping their force.
- pob_phrase: godliness
  simplified_phrase: a life devoted to God
  preserved_meaning: Reverent living directed toward God.
  reasoning_layer_used: Lexical rationale for εὐσέβεια in the Pastoral Epistles.
  rationale: This phrase makes the virtue understandable to readers unfamiliar with “godliness.”
- pob_phrase: steadfastness
  simplified_phrase: endurance
  preserved_meaning: Continuing faithfully under pressure.
  reasoning_layer_used: Lexical decision for ὑπομονή and its listed alternatives.
  rationale: “Endurance” is more familiar while preserving durable constancy.
interpretive_expansions:
- pob_phrase: godliness
  rendering: a life devoted to God
  claim: The virtue describes reverent, God-oriented living.
  evidence:
