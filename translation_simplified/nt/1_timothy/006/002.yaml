translation:
  language: en
  text: Enslaved people whose masters believe in Christ must not treat them with contempt just because they are brothers in the faith.[a] Instead, they must serve them all the more, because those who receive the benefit are believers and are dearly loved.[b] This is what you must teach and urge.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “brothers and sisters”; the Greek word is “brothers.”
    reason: lexical_alternative
  - marker: b
    text: The Greek wording is difficult; it most likely means that the believing masters benefit from the enslaved people’s service.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: those who have believing masters
  simplified_phrase: Enslaved people whose masters believe in Christ
  preserved_meaning: The verse addresses enslaved people whose masters are fellow believers.
  reasoning_layer_used: POB lexical and theological decisions on the slavery context
  rationale: This names the implied social setting and explains what “believing” means.
- pob_phrase: must not despise them
  simplified_phrase: must not treat them with contempt
  preserved_meaning: They must not regard or treat their masters with contempt.
  reasoning_layer_used: POB lexical decision for καταφρονείτωσαν
  rationale: This expresses the verb’s strong force in familiar English.
- pob_phrase: believers and beloved
  simplified_phrase: believers and are dearly loved
  preserved_meaning: The beneficiaries are Christians who are objects of love.
  reasoning_layer_used: POB lexical decisions for πιστοί and ἀγαπητοί
  rationale: “Dearly loved” makes “beloved” immediately understandable without identifying who loves them.
interpretive_expansions:
- pob_phrase: those who have believing masters
  rendering: Enslaved people whose masters believe in Christ
  claim: The unstated subject is enslaved people, and the masters are Christian believers.
  evidence:
  - The household-slavery context and δεσπότας identify those addressed as enslaved people.
  - The POB rationale says πιστούς refers to belief in Christ.
  confidence: high
  alternatives_preserved:
  - those who have believing masters
- pob_phrase: because they are brothers
  rendering: because they are brothers in the faith
  claim: “Brothers” describes their shared relationship as fellow Christians.
  evidence:
  - The POB theological rationale identifies the phrase as a familial Christian relationship.
  confidence: high
  alternatives_preserved:
  - brothers and sisters
translation_notes:
  risk_flags:
  - risk: Readers may assume the beneficiaries are certainly the masters.
    mitigation: Footnote [b] marks the clause as difficult and identifies the masters only as the most likely referent.
  - risk: The verse may be mistaken for a general endorsement of slavery.
    mitigation: The text identifies the existing social setting without adding approval or commentary.
