translation:
  language: en
  text: Command those who are rich in this present age not to be proud or to put their hope in wealth, because wealth is uncertain. Instead, they must put their hope in God, who richly provides us with everything to enjoy.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: not to be arrogant
  simplified_phrase: not to be proud
  preserved_meaning: Rich people must not think too highly of themselves.
  reasoning_layer_used: POB lexical decision for μὴ ὑψηλοφρονεῖν
  rationale: “Proud” states the same moral warning in more familiar language.
- pob_phrase: nor to set their hope on the uncertainty of riches
  simplified_phrase: or to put their hope in wealth, because wealth is uncertain
  preserved_meaning: Wealth is an unreliable object of settled hope.
  reasoning_layer_used: POB lexical rationale for ἐπὶ πλούτου ἀδηλότητι
  rationale: The abstract phrase becomes a direct statement while preserving wealth’s uncertainty.
- pob_phrase: but on God, who richly provides us with everything for enjoyment
  simplified_phrase: Instead, they must put their hope in God, who richly provides us with everything to enjoy
  preserved_meaning: Hope belongs in the generous God who provides all things for human enjoyment.
  reasoning_layer_used: POB lexical and theological decisions for ἀλλ’ ἐπὶ θεῷ, πάντα, and πλουσίως
  rationale: The contrast becomes a new sentence while “richly” keeps the verse’s wealth wordplay.
translation_notes:
  risk_flags:
  - risk: “Everything” could be misread as a promise of unlimited personal wealth.
    mitigation: The wording preserves the source’s broad scope without adding a prosperity claim.
