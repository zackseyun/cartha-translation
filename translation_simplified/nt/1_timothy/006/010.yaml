translation:
  language: en
  text: The love of money is a root that produces all kinds of evil.[a] By craving money, some people have wandered away from the Christian faith and pierced themselves with many pains.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally, “The love of money is the root of all evil.” The Greek more naturally means one root that produces all kinds of evil.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: a root of all kinds of evils
  simplified_phrase: a root that produces all kinds of evil
  preserved_meaning: Love of money is one source of many different kinds of evil, not the sole cause of every evil.
  reasoning_layer_used: Lexical and theological decisions on ῥίζα and πάντων τῶν κακῶν
  rationale: The added verb makes the root image and its meaning immediately clear.
- pob_phrase: by craving it
  simplified_phrase: By craving money
  preserved_meaning: An intense desire for money led to the stated consequences.
  reasoning_layer_used: Lexical decisions on ἧς and ὀρεγόμενοι
  rationale: Repeating “money” removes an unclear pronoun without weakening the craving.
- pob_phrase: the faith
  simplified_phrase: the Christian faith
  preserved_meaning: The phrase refers to the Christian body of belief rather than faith in the abstract.
  reasoning_layer_used: Lexical and theological decision on πίστεως
  rationale: The contextual sense is stated directly for readers unfamiliar with this biblical usage.
interpretive_expansions:
- pob_phrase: the faith
  rendering: the Christian faith
  claim: The faith here means the Christian faith as an objective body of belief.
  evidence:
  - The POB theological decision identifies the phrase as objective Christian faith.
  - The article and usage in the Pastoral Epistles support this contextual sense.
  confidence: high
  alternatives_preserved:
  - faith in the sense of personal trust
translation_notes:
  risk_flags:
