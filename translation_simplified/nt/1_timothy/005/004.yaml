translation:
  language: en
  text: But if a widow has children or grandchildren,[a] they must first learn to show their godliness by caring for their own family and repaying their parents, grandparents, and other forebears.[b] This is acceptable to God.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek can also mean “children or descendants,” though “grandchildren” best fits this context.
    reason: lexical_alternative
  - marker: b
    text: The Greek refers broadly to forebears, especially parents or grandparents in this family setting.
    reason: lexical_alternative
