translation:
  language: en
  text: Some people’s sins are plain to see. Their sins go ahead of them to judgment.[a] But the sins of others follow behind them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Judgment” may mean evaluation in the present context, but it may also include the broader sense of divine judgment.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: The sins of some people are obvious
  simplified_phrase: Some people’s sins are plain to see
  preserved_meaning: Their sins are openly apparent.
  reasoning_layer_used: Lexical decision for πρόδηλοι
  rationale: “Plain to see” expresses the chosen sense of “obvious” in direct common English.
- pob_phrase: going before them to judgment
  simplified_phrase: Their sins go ahead of them to judgment
  preserved_meaning: The sins are pictured as reaching judgment before the people do.
  reasoning_layer_used: Lexical decisions for προάγουσαι and εἰς κρίσιν
  rationale: A new sentence makes the personified image easier to follow without weakening it.
- pob_phrase: but for others they follow after
  simplified_phrase: But the sins of others follow behind them
  preserved_meaning: Other people’s sins become evident only after following behind them.
  reasoning_layer_used: Lexical decision for ἐπακολουθοῦσιν and applied revision
  rationale: Naming “sins” removes an unclear pronoun while preserving the image of sins following people.
translation_notes:
  risk_flags:
  - risk: Readers may take “judgment” as only final divine judgment.
    mitigation: The footnote preserves both present evaluation and broader divine judgment.
  - risk: Repeating “sins” makes the Greek ellipsis explicit.
    mitigation: The repetition clarifies the subject without changing the contrast or metaphor.
