translation:
  language: en
  text: Do not lay hands on anyone too soon.[a] Do not take part in other people’s sins. Keep yourself pure.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In this context, “lay hands on” may refer more specifically to appointing or ordaining someone for ministry.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Do not lay hands on anyone hastily
  simplified_phrase: Do not lay hands on anyone too soon
  preserved_meaning: The warning concerns acting prematurely while retaining the source-language idiom.
  reasoning_layer_used: Lexical and theological decisions on χεῖρας ... ἐπιτίθει and ταχέως.
  rationale: “Too soon” expresses undue speed more plainly than “hastily.”
- pob_phrase: nor share in the sins of others
  simplified_phrase: Do not take part in other people’s sins
  preserved_meaning: Timothy must not become complicit in wrongdoing committed by others.
  reasoning_layer_used: Lexical decision on μηδὲ κοινώνει ἁμαρτίαις ἀλλοτρίαις.
  rationale: A separate sentence and “take part” make the prohibition immediately clear.
- pob_phrase: keep yourself pure
  simplified_phrase: Keep yourself pure
  preserved_meaning: Timothy must continually maintain broad moral purity.
  reasoning_layer_used: Lexical decisions on ἁγνὸν and τήρει.
  rationale: The familiar wording is already clear and avoids narrowing purity to chastity.
translation_notes:
  risk_flags:
  - risk: “Lay hands on” may be unclear to readers unfamiliar with ministry commissioning.
    mitigation: The footnote gives the likely contextual meaning without narrowing the main text.
  - risk: Readers may assume the second command is either certainly linked to appointment or certainly unrelated.
    mitigation: Separate commands preserve the Greek juxtaposition without forcing the precise connection.
