translation:
  language: en
  text: If a believing woman has widows in her family, she should support them. This keeps the burden from falling on the church, so the church can support widows who are truly without family support.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some manuscripts say “any believing man or woman” or “any believer,” broadening the instruction beyond women.
    reason: textual_variant
simplification_decisions:
- pob_phrase: any believing woman
  simplified_phrase: a believing woman
  preserved_meaning: The supplied Greek text refers specifically to a Christian woman.
  reasoning_layer_used: Lexical and theological decisions on τις πιστή
  rationale: This keeps the female subject and Christian identity without adding an unstated object of belief.
- pob_phrase: let her provide for them
  simplified_phrase: she should support them
  preserved_meaning: She is to give the widows sufficient practical and material help.
  reasoning_layer_used: Lexical decision on ἐπαρκείτω
  rationale: “Support” expresses the practical duty in direct modern English.
- pob_phrase: let the church not be burdened
  simplified_phrase: This keeps the burden from falling on the church
  preserved_meaning: Her support prevents the church from having to bear that obligation.
  reasoning_layer_used: Lexical decision on βαρείσθω and immediate context
  rationale: The active wording clearly preserves the intended normative result of her duty.
interpretive_expansions:
- pob_phrase: has widows
  rendering: has widows in her family
  claim: The widows are relatives or household members for whom she can provide.
  evidence:
  - The chapter assigns family responsibility before church support.
  - The POB rationale identifies material support as the context.
  confidence: high
- pob_phrase: those who are truly widows
  rendering: widows who are truly without family support
  claim: “Truly” identifies widows left without qualifying family provision and eligible for church support.
  evidence:
  - The POB rationale describes them as left alone and eligible for church support.
  - This verse contrasts family-supported widows with those the church should support.
  confidence: high
  alternatives_preserved:
  - widows who fully meet the chapter’s qualifications
translation_notes:
  risk_flags:
  - risk: “In her family” makes the implied relationship explicit.
    mitigation: The immediate context and POB rationale establish family responsibility.
  - risk: “Without family support” summarizes the contextual category of true widows.
    mitigation: The wording avoids claiming that absolutely no one can care for them.
