simplification_decisions:
- pob_phrase: Let the elders who lead well be considered worthy
  simplified_phrase: Elders who lead well should be recognized as worthy
  preserved_meaning: The church community is called to acknowledge faithful elders as deserving honor.
  reasoning_layer_used: Lexical decisions for πρεσβύτεροι, καλῶς προεστῶτες, and ἀξιούσθωσαν
  rationale: The direct wording is easier to read while retaining leadership and communal recognition.
- pob_phrase: those who labor
  simplified_phrase: those who work hard
  preserved_meaning: Their ministry requires strenuous effort.
  reasoning_layer_used: Lexical decision for κοπιῶντες
  rationale: “Work hard” expresses the exertion in familiar English.
- pob_phrase: in word and teaching
  simplified_phrase: at preaching and teaching
  preserved_meaning: These elders devote themselves to verbal proclamation and instruction.
  reasoning_layer_used: Lexical decisions and POB cultural note for ἐν λόγῳ and διδασκαλίᾳ
  rationale: “Preaching” makes the likely ministry setting clear without merging it with teaching.
interpretive_expansions:
- pob_phrase: in word
  rendering: at preaching
  claim: “Word” refers here to verbal ministry, likely public proclamation or preaching.
  evidence:
