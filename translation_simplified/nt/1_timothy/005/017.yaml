  text: Elders who lead well should be recognized as worthy of double honor,[a] especially[b] those who work hard at preaching and teaching.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Double honor” may include both respect and material support, especially in light of the next verse.
