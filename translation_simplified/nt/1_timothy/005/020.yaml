translation:
  language: en
  text: Rebuke those who are sinning in front of everyone,[a][b] so that the others will also be afraid.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “those who persist in sin”; the wording may suggest ongoing sinful conduct.
    reason: lexical_alternative
  - marker: b
    text: The immediate context may refer especially to elders who sin, though this verse says only “those who are sinning.”
    reason: cross_reference
simplification_decisions:
- pob_phrase: before everyone
  simplified_phrase: in front of everyone
  preserved_meaning: The rebuke takes place openly in the presence of the community.
  reasoning_layer_used: Lexical decision for ἐνώπιον πάντων
  rationale: “In front of everyone” expresses the public setting in familiar English.
- pob_phrase: the rest
  simplified_phrase: the others
  preserved_meaning: Those in the community besides the people being rebuked are meant.
  reasoning_layer_used: Lexical decision for οἱ λοιποί
  rationale: “The others” makes the implied group clearer without narrowing its scope.
- pob_phrase: may have fear
  simplified_phrase: will also be afraid
  preserved_meaning: The public rebuke is intended to produce sober fear in the others.
  reasoning_layer_used: Lexical decision for φόβον ἔχωσιν
  rationale: “Be afraid” is the POB-listed natural-English alternative and retains the force of fear.
translation_notes:
  risk_flags:
  - risk: “Be afraid” may sound like simple fright rather than sober or corrective fear.
    mitigation: The disciplinary context supplies the warning function without adding an unsupported object of fear.
  - risk: Readers may assume the offenders are either elders only or all church members.
    mitigation: The main text remains broad, while footnote b preserves the contextual possibility that elders are specifically meant.
