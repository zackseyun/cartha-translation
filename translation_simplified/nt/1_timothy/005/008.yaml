translation:
  language: en
  text: But anyone who does not give needed support to his own people,[a] especially those in his household, has denied the faith and is worse than an unbeliever.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “His own people” includes his relations and dependents, not only those in his household.
    reason: lexical_alternative
