  preserved_meaning: The duty involves practical care and provision for one’s relations and dependents.
  reasoning_layer_used: POB lexical decisions for τῶν ἰδίων and προνοεῖ
  rationale: The clearer wording preserves both the group’s broad scope and the concrete duty to support them.
- pob_phrase: members of his household
  simplified_phrase: those in his household
  preserved_meaning: People belonging to one’s household receive special emphasis within the broader group.
  reasoning_layer_used: POB lexical decision for οἰκείων and μάλιστα
  rationale: The shorter phrase keeps the narrowing force of “especially” without changing the relationship.
