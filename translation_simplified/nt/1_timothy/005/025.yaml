simplification_decisions:
- pob_phrase: Likewise also
  simplified_phrase: In the same way
  preserved_meaning: The verse remains closely linked to the parallel point in the previous verse.
  reasoning_layer_used: Lexical decision for ὡσαύτως and immediate context
  rationale: This common connector preserves the comparison without an awkward double adverb.
- pob_phrase: good works are evident
  simplified_phrase: good works are plain to see
  preserved_meaning: Good works can be readily recognized.
  reasoning_layer_used: Lexical decisions for ἔργα τὰ καλά and πρόδηλα
  rationale: The concrete phrase is clearer than the abstract word “evident.”
- pob_phrase: those that are otherwise cannot remain hidden
  simplified_phrase: Other works may not be obvious now, but they cannot stay hidden
  preserved_meaning: Works not presently evident will eventually become known.
  reasoning_layer_used: Lexical rationale, theological decision, and contextual logic from verse 24
  rationale: This states the contrast naturally without identifying the works as necessarily evil.
interpretive_expansions:
