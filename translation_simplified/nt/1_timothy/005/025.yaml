translation:
  language: en
  text: In the same way, good works are plain to see. Other works[a] may not be obvious now, but they cannot stay hidden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “works that are different” or “works that are not obvious.” Some understand these to be evil works, but the wording does not explicitly say that.
