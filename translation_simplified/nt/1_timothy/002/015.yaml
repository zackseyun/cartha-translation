translation:
  language: en
  text: Yet she will be saved through bearing children,[a][c] if they keep living in faith,[b] love, holiness, and self-control.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “through the childbirth.” Some understand this as a particular birth, possibly the Messiah’s, though it may simply mean bearing children in general.
    reason: alternative_reading
  - marker: b
    text: “Faith” may also mean “faithfulness” here.
    reason: lexical_alternative
  - marker: c
    text: The Greek shifts from singular (“she will be saved”) to plural (“if they keep living”).
    reason: source_note
