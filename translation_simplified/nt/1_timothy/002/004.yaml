translation:
  language: en
  text: He desires all people to be saved and to come to know the truth.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “wants” or “wills” all people to be saved; “desires” avoids settling a theological debate beyond what the wording itself says.
