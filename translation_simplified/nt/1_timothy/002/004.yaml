simplification_decisions:
- pob_phrase: who desires
  simplified_phrase: He desires
  preserved_meaning: The pronoun still refers to God in the previous verse.
  reasoning_layer_used: POB lexical decision for ὃς and immediate context
  rationale: An independent clause is easier to read while keeping the same antecedent.
- pob_phrase: to come to the knowledge of the truth
  simplified_phrase: to come to know the truth
  preserved_meaning: People enter into knowledge and recognition of the truth.
  reasoning_layer_used: POB lexical decisions for ἐπίγνωσις and ἐλθεῖν
  rationale: The verbal wording is more natural English without overstating full knowledge.
translation_notes:
  risk_flags:
