translation:
  language: en
  text: So, in every place, I want the men to pray. They should lift up holy hands, free from anger and quarreling.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “free from anger and doubt.” The Greek word may refer to inward doubt, though here it most likely means contentious disagreement in the gathered community.
    reason: lexical_alternative
