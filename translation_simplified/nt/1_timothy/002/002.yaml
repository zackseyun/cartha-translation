translation:
  language: en
  text: for kings and all people in high positions,[a] so that we may live peaceful, quiet lives, fully devoted to God and worthy of respect.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “all people in authority.” The Greek expression is broader than formal government office alone.
