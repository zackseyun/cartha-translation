translation:
  language: en
  text: But I do not allow a woman[a] to teach or to exercise authority[b] over a man. Instead, she is to be quiet.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a wife ... a husband.” The Greek words may refer either to a woman and a man generally or to a wife and husband.
    reason: alternative_reading
  - marker: b
    text: The rare Greek verb translated “exercise authority” may also mean “have authority” or, possibly, “domineer.”
    reason: lexical_alternative
  - marker: c
    text: Or “be silent.” The Greek word can mean quietness, calmness, or silence in this context.
    reason: lexical_alternative
