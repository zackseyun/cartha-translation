translation:
  language: en
  text: So a church overseer must live in a way that gives no valid reason for accusation. He must be the husband of one wife.[a] He must think clearly, control himself, behave honorably, welcome guests and strangers, and be able to teach.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a one-woman man”; this may emphasize faithfulness to one’s wife rather than marital status alone.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Therefore an overseer must be above reproach
  simplified_phrase: So a church overseer must live in a way that gives no valid reason for accusation
  preserved_meaning: The logical connection, office title, firm requirement, and absence of a sustainable charge are retained.
  reasoning_layer_used: Lexical decisions for οὖν, ἐπίσκοπον, δεῖ, and ἀνεπίλημπτον
  rationale: The sentence explains the biblical title and the idiom without implying sinless perfection.
- pob_phrase: sober-minded, self-controlled, respectable
  simplified_phrase: think clearly, control himself, behave honorably
  preserved_meaning: The overseer must show restrained judgment, disciplined conduct, and proper behavior.
  reasoning_layer_used: Lexical decisions for νηφάλιον, σώφρονα, and κόσμιον
  rationale: Common verbal phrases make the three distinct virtues easier to grasp.
- pob_phrase: hospitable, able to teach
  simplified_phrase: welcome guests and strangers, and be able to teach
  preserved_meaning: The overseer must receive others openly and have the capability to teach.
  reasoning_layer_used: Lexical decisions for φιλόξενον and διδακτικόν
  rationale: The wording explains hospitality while preserving teaching ability as a separate qualification.
interpretive_expansions:
- pob_phrase: above reproach
  rendering: live in a way that gives no valid reason for accusation
  claim: The qualification concerns conduct against which no sound charge can readily stand.
  evidence:
  - The POB lexical rationale explicitly describes a person against whom no valid charge can readily stick.
  confidence: high
  alternatives_preserved:
  - above reproach
  - blameless
- pob_phrase: hospitable
  rendering: welcome guests and strangers
  claim: Hospitality includes receiving strangers, not only entertaining friends.
  evidence:
  - The POB lexical decision gives “welcoming to strangers” as the fuller conceptual gloss.
  confidence: high
  alternatives_preserved:
  - hospitable
translation_notes:
  risk_flags:
  - risk: Explaining “above reproach” could be mistaken for requiring freedom from every accusation.
    mitigation: The word “valid” preserves the POB distinction between credible reproach and mere allegations.
  - risk: The disputed meaning of “husband of one wife” could be narrowed to marital faithfulness alone.
    mitigation: The literal main-text wording remains, and the footnote presents fidelity only as a possible emphasis.
