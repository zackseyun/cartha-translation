translation:
  language: en
  text: 'There is no denying that the mystery of godliness is great:


    He[a] was revealed in human flesh,

    was shown to be in the right in spirit,[b]

    was seen by angels,

    was proclaimed among the nations,[c]

    people in the world believed in him,

    and he was taken up in glory.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some manuscripts read “God was revealed in human flesh.” The critical Greek text reads “who,” represented here by “He.”
    reason: textual_variant
  - marker: b
    text: The Greek may also mean “was shown to be in the right by the Spirit” or “in the Spirit.”
    reason: alternative_reading
  - marker: c
    text: Or “was proclaimed among the Gentiles.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And undeniably, great is the mystery of godliness
  simplified_phrase: There is no denying that the mystery of godliness is great
  preserved_meaning: The greatness of this revealed truth is openly acknowledged.
  reasoning_layer_used: Lexical decisions for ὁμολογουμένως and μέγα ἐστὶν
  rationale: The wording uses ordinary English while retaining the emphatic opening.
- pob_phrase: He was revealed in flesh; was vindicated in spirit
  simplified_phrase: He was revealed in human flesh; was shown to be in the right in spirit
  preserved_meaning: Christ appeared in embodied human existence and was publicly shown to be in the right.
  reasoning_layer_used: Lexical and theological decisions for ἐν σαρκί, ἐδικαιώθη, and ἐν πνεύματι
  rationale: The wording explains the difficult terms without resolving the ambiguity of “spirit.”
- pob_phrase: was believed on in the world
  simplified_phrase: people in the world believed in him
  preserved_meaning: People in the world responded to the proclaimed Christ with faith in him.
  reasoning_layer_used: Lexical decisions for ἐπιστεύθη and ἐν κόσμῳ
  rationale: The active wording clarifies the personal object while preserving the source’s simple geographic scope.
interpretive_expansions:
- pob_phrase: was believed on in the world
  rendering: people in the world believed in him
  claim: The one believed in is Christ, the subject of the hymn.
  evidence:
  - The passive verb has a personal-object sense in the POB lexical rationale.
  - The surrounding lines consistently refer to Christ.
  confidence: high
  alternatives_preserved:
  - was believed on in the world
translation_notes:
  risk_flags:
  - risk: “In spirit” remains less immediately clear than the rest of the verse.
    mitigation: The wording preserves the source ambiguity, and footnote b gives both major readings.
  - risk: “Mystery of godliness” remains a specialized Pauline expression.
    mitigation: It is retained because replacing it could obscure revealed divine truth and its connection to godly living.
