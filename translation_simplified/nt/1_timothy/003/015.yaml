translation:
  language: en
  text: But if I am delayed, I am writing so that you will know how people should live as part of God’s household. This household is the assembly[a] of the living God, the pillar and support of the truth.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally, “church of the living God.”
    reason: lexical_alternative
  - marker: b
    text: The word translated “support” can also be rendered “bulwark” or “foundation.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: how one ought to conduct oneself in the household of God
  simplified_phrase: how people should live as part of God’s household
  preserved_meaning: God’s household is his people, and they are obligated to live rightly within that community.
  reasoning_layer_used: Lexical decisions for δεῖ, οἶκος, and ἀναστρέφεσθαι.
  rationale: Common wording replaces the formal construction while preserving required conduct among God’s people.
- pob_phrase: which is the assembly of the living God
  simplified_phrase: This household is the assembly of the living God
  preserved_meaning: God’s household and the assembly of the living God are the same community.
  reasoning_layer_used: Lexical decision for ἥτις and theological decision for ἐκκλησία.
  rationale: A new sentence clarifies the identification while retaining the source-driven term “assembly.”
- pob_phrase: the pillar and support of the truth
  simplified_phrase: the pillar and support of the truth
  preserved_meaning: The assembly upholds and stabilizes the truth without originating it.
  reasoning_layer_used: Lexical and theological decisions for στῦλος and ἑδραίωμα.
  rationale: The clear architectural image is retained, and “support” avoids overstating the assembly’s role.
interpretive_expansions:
- pob_phrase: in the household of God
  rendering: as part of God’s household
  claim: The household means the community of God’s people rather than a building.
  evidence:
  - The next phrase identifies the household as the assembly of the living God.
  - The POB lexical rationale prioritizes the social and covenantal sense.
  confidence: high
  alternatives_preserved:
  - in God’s house
translation_notes:
  risk_flags:
  - risk: “Pillar and support” could be misunderstood to mean that the assembly creates the truth.
    mitigation: The text retains POB’s “support,” whose audited sense is to uphold rather than originate truth.
  - risk: “Assembly” may be unfamiliar as a term for the church.
    mitigation: Footnote [a] gives “church” immediately after the term it explains.
