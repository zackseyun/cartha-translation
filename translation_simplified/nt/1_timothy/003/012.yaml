translation:
  language: en
  text: Deacons must each be the husband of one wife.[a] They must lead their children well and manage their own households well.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a one-woman man.” The phrase may refer to faithfulness in marriage; some understand it more specifically as ruling out polygamy or remarriage.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Deacons must be husbands of one wife
  simplified_phrase: Deacons must each be the husband of one wife
  preserved_meaning: Every deacon is required to meet this male-specific marital qualification.
  reasoning_layer_used: Lexical and theological decisions for μιᾶς γυναικὸς ἄνδρες
  rationale: The singular wording with “each” is easier to process while preserving the debated phrase.
- pob_phrase: managing their children
  simplified_phrase: lead their children well
  preserved_meaning: Deacons must exercise responsible oversight of their children.
  reasoning_layer_used: Lexical decision for προϊστάμενοι
  rationale: “Lead” is more natural with children and remains within the documented lexical range.
- pob_phrase: and their own households well
  simplified_phrase: and manage their own households well
  preserved_meaning: Deacons must responsibly oversee the whole household unit, not merely a building.
  reasoning_layer_used: Lexical decisions for προϊστάμενοι and τῶν ἰδίων οἴκων
  rationale: Repeating the verb makes the second responsibility clear without narrowing “households” to “families.”
