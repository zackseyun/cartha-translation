  simplified_phrase: He must manage his own household well
  preserved_meaning: A prospective overseer must responsibly manage the household under his care.
  reasoning_layer_used: Lexical decision and qualification context
  rationale: The participle becomes a direct requirement so the qualification is clear on its own.
- pob_phrase: having his children in submission
