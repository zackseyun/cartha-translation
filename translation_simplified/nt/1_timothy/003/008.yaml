simplification_decisions:
- pob_phrase: Deacons likewise must be dignified
  simplified_phrase: Deacons, too, must be worthy of respect
  preserved_meaning: Deacons hold a recognized church office and, like overseers, must have honorable character.
  reasoning_layer_used: Lexical and theological decisions on Διακόνους, ὡσαύτως, and σεμνούς
  rationale: This keeps the office and comparison while explaining dignified in common English.
- pob_phrase: not double-tongued
  simplified_phrase: must not be two-faced in what they say
  preserved_meaning: Deacons must not speak deceptively or say conflicting things to different people.
  reasoning_layer_used: Lexical decision on μὴ διλόγους
  rationale: The wording preserves the vivid image of duplicity and clearly limits it to speech.
- pob_phrase: not devoted to much wine
  simplified_phrase: must not indulge in much wine
  preserved_meaning: Deacons must not give themselves to excessive involvement with wine.
  reasoning_layer_used: Lexical decision on μὴ οἴνῳ πολλῷ προσέχοντας
  rationale: Indulge conveys excessive involvement without implying a clinical diagnosis.
