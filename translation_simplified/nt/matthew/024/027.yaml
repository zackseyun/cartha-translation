simplification_decisions:
- pob_phrase: For just as the lightning comes from the east and is seen as far as the west
  simplified_phrase: Lightning flashes from the east and can be seen as far away as the west.
  preserved_meaning: The lightning emerges in the east and is visible across the whole east-to-west span.
  reasoning_layer_used: POB lexical decisions for ἀστραπή, ἐξέρχεται, φαίνεται, and ἕως δυσμῶν
  rationale: Two natural clauses make the image easier to grasp while preserving its vast visible reach.
- pob_phrase: so will the coming of the Son of Man be
  simplified_phrase: In the same way, the coming of the Son of Man will be visible to all.
  preserved_meaning: The Son of Man's future coming will have the openly visible character illustrated by lightning.
  reasoning_layer_used: POB theological decision on παρουσία, lexical rationale for φαίνεται, and Matthew 24:23–27
  rationale: The comparison's intended point is stated directly instead of leaving the sentence sounding unfinished.
interpretive_expansions:
- pob_phrase: so will the coming of the Son of Man be
  rendering: the coming of the Son of Man will be visible to all
  claim: The coming will be public and unmistakably visible rather than hidden in a secret location.
  evidence:
