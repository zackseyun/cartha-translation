  text: This good news about God’s kingdom will be announced throughout the whole world and will serve as a witness to all nations. Then the end will come.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: good news of the kingdom
  simplified_phrase: good news about God’s kingdom
  preserved_meaning: The message concerns God’s reign without changing its theological focus.
  reasoning_layer_used: POB lexical decision for τῆς βασιλείας
  rationale: Using “about” makes the relationship clear, while “God’s” identifies the kingdom already understood in context.
- pob_phrase: will be proclaimed
  simplified_phrase: will be announced
  preserved_meaning: The good news will be made known publicly and widely.
  reasoning_layer_used: POB lexical decision for κηρυχθήσεται
  rationale: “Announced” is common English and retains the sense of public heralding.
- pob_phrase: as a testimony to all the nations, and then
  simplified_phrase: and will serve as a witness to all nations. Then
  preserved_meaning: The worldwide announcement bears witness to every nation before the end comes.
  reasoning_layer_used: POB lexical decisions for εἰς μαρτύριον and πᾶσιν τοῖς ἔθνεσιν
  rationale: A separate clause and sentence make the witness-bearing role and sequence easier to follow.
interpretive_expansions:
