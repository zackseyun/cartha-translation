translation:
  language: en
  text: Then people will hand you over to face persecution and will kill you. All the nations will hate you because of my name.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: That is, because you belong to Jesus and are loyal to him and all that his name represents.
    reason: simplification_note
  - marker: b
    text: The word translated “persecution” can also mean affliction or tribulation, including severe distress.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: hand you over to affliction and kill you
  simplified_phrase: hand you over to face persecution and will kill you
  preserved_meaning: People will place Jesus’ followers in hostile circumstances and kill them.
  reasoning_layer_used: POB lexical and theological decisions for θλῖψις
  rationale: “Face persecution” is clearer than “to affliction,” while the footnote preserves the broader tribulation range.
- pob_phrase: you will be hated by all the nations
  simplified_phrase: All the nations will hate you
  preserved_meaning: Opposition to Jesus’ followers will extend across the nations.
  reasoning_layer_used: POB lexical decision for ἔθνη
  rationale: The active clause is easier to read and retains the global scope.
- pob_phrase: because of my name
  simplified_phrase: because of my name
  preserved_meaning: The biblical image of Jesus’ name represents his person and allegiance to him.
  reasoning_layer_used: POB lexical rationale and footnote c
  rationale: The main text keeps the important name image, and the footnote explains it plainly.
