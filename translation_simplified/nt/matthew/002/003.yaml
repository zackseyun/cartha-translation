translation:
  language: en
  text: When King Herod heard the news, he was alarmed, and the people throughout Jerusalem were alarmed with him.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek says “all Jerusalem,” using the city’s name for its inhabitants. This may describe widespread alarm rather than every person individually.
