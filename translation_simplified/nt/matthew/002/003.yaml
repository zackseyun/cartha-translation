simplification_decisions:
- pob_phrase: heard this
  simplified_phrase: heard the news
  preserved_meaning: Herod heard the report brought by the magi.
  reasoning_layer_used: Immediate context and POB lexical rationale for ἀκούσας
  rationale: “The news” makes the implied object clear in ordinary English.
- pob_phrase: was troubled
  simplified_phrase: was alarmed
  preserved_meaning: Herod experienced inner disturbance or alarm.
  reasoning_layer_used: POB lexical decision for ἐταράχθη
  rationale: “Alarmed” clearly conveys the emotional force without overstating its degree.
- pob_phrase: all Jerusalem with him
  simplified_phrase: the people throughout Jerusalem were alarmed with him
  preserved_meaning: Jerusalem’s inhabitants broadly shared Herod’s alarm.
  reasoning_layer_used: POB lexical and theological decisions on πᾶσα Ἱεροσόλυμα and μετ’ αὐτοῦ
  rationale: The wording identifies the people and supplies the repeated verb while the footnote preserves the scope qualification.
interpretive_expansions:
- pob_phrase: all Jerusalem
  rendering: the people throughout Jerusalem
  claim: The city name refers corporately to its inhabitants rather than to the geographical place.
  evidence:
  - The POB lexical decision identifies the phrase as city-for-inhabitants metonymy.
  - The POB theological decision treats it as a corporate reference without narrowing it to leaders.
  confidence: high
  alternatives_preserved:
  - A general or hyperbolic reference to widespread alarm
  - Many inhabitants rather than every individual
translation_notes:
  risk_flags:
  - risk: “The people throughout Jerusalem” could be read as every inhabitant without exception.
    mitigation: The footnote states that the expression may indicate widespread rather than individually universal alarm.
