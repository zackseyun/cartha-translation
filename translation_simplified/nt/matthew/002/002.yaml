translation:
  language: en
  text: They asked, “Where is the one who was born king of the Jews? Because we saw his star in the east[a], we have come to pay him homage.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “at its rising.” The Greek phrase can mean “in the east” or refer to the star’s rising.
    reason: alternative_reading
  - marker: b
    text: Or “to worship him.” The Greek verb can mean showing deep respect to a king or worshiping God.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: saying
  simplified_phrase: They asked
  preserved_meaning: The magi introduce their direct question.
  reasoning_layer_used: POB lexical alternative and immediate context
  rationale: Because the speech is a question, “They asked” naturally expresses the participle’s function.
- pob_phrase: the one who has been born
  simplified_phrase: the one who was born
  preserved_meaning: The wording focuses on his birth without adding that he was a newborn.
  reasoning_layer_used: POB lexical decision
  rationale: The simple past is natural English and avoids the extra infancy nuance of “newborn.”
- pob_phrase: For we saw his star in the east and have come
  simplified_phrase: Because we saw his star in the east, we have come
  preserved_meaning: Seeing the star is explicitly presented as the reason for their journey and present arrival.
  reasoning_layer_used: POB lexical rationale for γάρ and ἤλθομεν
  rationale: “Because” preserves the explanatory link in natural modern dialogue.
translation_notes:
  risk_flags:
