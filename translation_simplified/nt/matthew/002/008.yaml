simplification_decisions:
- pob_phrase: And after sending them to Bethlehem, he said
  simplified_phrase: Then he sent them to Bethlehem and said
  preserved_meaning: Herod sent them before giving these instructions.
  reasoning_layer_used: POB lexical decision for πέμψας
  rationale: A direct clause makes the sequence easier to follow without changing it.
- pob_phrase: Go and search carefully for the child, and when you find him, report to me
  simplified_phrase: Go and search carefully for the child. When you find him, report back to me
  preserved_meaning: They must search carefully and return with news after finding the child.
  reasoning_layer_used: POB lexical decisions for ἐξετάσατε ἀκριβῶς and ἀπαγγείλατέ μοι
  rationale: Two sentences reduce clause overload, while “report back” naturally conveys bringing a report.
- pob_phrase: so that I too may come and worship him
  simplified_phrase: so that I too may come and worship him
  preserved_meaning: Herod presents the report as serving his purpose of coming to worship the child.
  reasoning_layer_used: POB lexical and theological decisions for ὅπως and προσκυνήσω αὐτῷ
  rationale: Retaining “may come” preserves purpose and future intention rather than mere ability.
