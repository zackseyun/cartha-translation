translation:
  language: en
  text: Then he sent them to Bethlehem and said, “Go and search carefully for the child. When you find him, report back to me, so that I too may come and worship[a] him.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “pay him homage” or “bow down to him.” The Greek verb can mean either worship or an act of deep respect before a royal figure.
