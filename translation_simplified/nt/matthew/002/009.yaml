translation:
  language: en
  text: After they heard the king, they went on their way. And look—the star they had seen in the east[a] went ahead of them until it came and stopped over the place where the child was.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “at its rising”; the Greek expression can refer either to the east as a direction or to a star’s rising.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: After hearing the king, they went on their way
  simplified_phrase: After they heard the king, they went on their way
  preserved_meaning: They left after listening to the king.
  reasoning_layer_used: POB lexical decision for ἀκούσαντες
  rationale: A full clause is easier to read than the opening participial phrase.
- pob_phrase: and behold
  simplified_phrase: And look—
  preserved_meaning: The narrator calls attention to the star with vividness but without claiming abrupt timing.
  reasoning_layer_used: POB lexical decision for ἰδού and grounding review
  rationale: “Look” preserves the attention marker without the unsupported temporal force of “suddenly.”
- pob_phrase: went before them until it came and stood over where the child was
  simplified_phrase: went ahead of them until it came and stopped over the place where the child was
  preserved_meaning: The star led them onward and then stopped above the child’s location.
  reasoning_layer_used: POB lexical decisions for προῆγεν, ἐστάθη, and ἐπάνω οὗ ἦν
  rationale: Common wording clarifies the movement and location while preserving the source image.
