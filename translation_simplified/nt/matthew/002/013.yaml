translation:
  language: en
  text: After they had gone, an angel of the Lord appeared to Joseph in a dream and said, “Get up, take the child and his mother, and flee to Egypt. Stay there until I tell you, because Herod is about to search for the child to kill him.[a]”
  philosophy: optimal-equivalence
  footnotes:
