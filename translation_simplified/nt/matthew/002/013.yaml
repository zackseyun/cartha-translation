  preserved_meaning: The angel’s appearance and message remain vivid without adding a claim of suddenness.
  reasoning_layer_used: POB lexical decisions for ἰδού and λέγων; grounding review
  rationale: The narrative marker is omitted rather than inaccurately turned into a temporal adverb.
- pob_phrase: in order to destroy him
  simplified_phrase: to kill him
  preserved_meaning: Herod intends to cause the child’s death.
  reasoning_layer_used: POB lexical decision for τοῦ ἀπολέσαι αὐτό and immediate context
  rationale: “Kill” states the contextual sense plainly, while the footnote preserves “destroy.”
