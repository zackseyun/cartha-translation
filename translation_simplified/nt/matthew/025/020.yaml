translation:
  language: en
  text: The one who had received five talents—a large sum of money—came forward and brought five more talents. He said, “Lord, you entrusted five talents to me. Look, I have gained five more talents.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: another five talents
  simplified_phrase: five more talents
  preserved_meaning: The servant brought and gained an additional amount equal to the first.
  reasoning_layer_used: POB lexical decision for ἄλλα πέντε τάλαντα
  rationale: “Five more talents” expresses the added equal amount in natural English.
- pob_phrase: saying
  simplified_phrase: He said
  preserved_meaning: The words that follow are spoken by the person who came forward.
  reasoning_layer_used: POB translation and source clause structure
  rationale: A new sentence replaces the participial construction with ordinary English.
- pob_phrase: Lord
  simplified_phrase: Lord
  preserved_meaning: The address retains both the social sense within the parable and possible Matthean resonance.
  reasoning_layer_used: POB theological decision for κύριος
  rationale: Keeping “Lord” avoids narrowing the address to only “Master.”
interpretive_expansions:
- pob_phrase: five talents
  rendering: five talents—a large sum of money
  claim: The talents in this verse are monetary units, not natural abilities.
  evidence:
  - The POB cultural note identifies a talent as a large unit of money.
  - The repeated gaining and bringing of talents presents them as money in the parable.
  confidence: high
  alternatives_preserved:
  - talents
- pob_phrase: you delivered five talents to me
  rendering: you entrusted five talents to me
  claim: The money was handed over for the servant to manage on the Lord’s behalf.
  evidence:
  - The POB lexical rationale says “entrusted” captures the contextual implication of παραδίδωμι.
  - The servant later returns with gains from what he received.
  confidence: high
  alternatives_preserved:
  - you delivered five talents to me
  - you handed five talents over to me
translation_notes:
  risk_flags:
  - risk: Modern readers may understand “talents” as personal abilities.
    mitigation: The first occurrence immediately identifies the talents as a large sum of money.
  - risk: “Lord” may sound exclusively divine rather than also addressing the servant’s master.
    mitigation: The servant-and-money setting supplies the immediate social sense while preserving POB’s broader resonance.
