translation:
  language: en
  text: Then the servant who had received one talent—a large amount of money—also came forward. He said, “Lord, I knew that you are a hard man,[a] reaping where you did not sow and gathering where you did not scatter seed.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “harsh man.” The Greek word can mean hard, harsh, or severe.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the one who had received the one talent also came and said
  simplified_phrase: the servant who had received one talent—a large amount of money—also came forward. He said
  preserved_meaning: This identifies the speaker as the servant entrusted with one monetary talent and preserves his place in the sequence.
  reasoning_layer_used: Immediate parable context and POB lexical decisions for προσελθὼν, δὲ καὶ, and τάλαντον
  rationale: The split sentence and monetary clarification prevent a modern reader from mistaking “talent” for an ability.
- pob_phrase: Lord
  simplified_phrase: Lord
  preserved_meaning: This keeps the audited project rendering of κύριος in the servant’s respectful address.
  reasoning_layer_used: POB theological decision for κύριος
  rationale: The controlling choice remains “Lord” because the context does not require “Master.”
- pob_phrase: reaping where you did not sow and gathering where you did not scatter
  simplified_phrase: reaping where you did not sow and gathering where you did not scatter seed
  preserved_meaning: This preserves both agricultural images while making the implied object of “scatter” clear.
  reasoning_layer_used: POB lexical rationale for ὅθεν οὐ διεσκόρπισας
  rationale: Adding “seed” makes the second farming image natural and understandable in English.
