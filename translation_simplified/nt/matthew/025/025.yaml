simplification_decisions:
- pob_phrase: And being afraid, I went away
  simplified_phrase: I was afraid, so I went away
  preserved_meaning: Fear remains the servant’s stated motive for going away and hiding the money.
  reasoning_layer_used: POB lexical decision for φοβηθεὶς and source clause sequence
  rationale: A causal main clause expresses the participle naturally without adding a new motive.
- pob_phrase: your talent
  simplified_phrase: your large sum of money
  preserved_meaning: The talent is correctly identified as a high-value monetary amount, not a natural ability.
  reasoning_layer_used: POB footnote and theological decision for τάλαντον
  rationale: The monetary meaning is placed in the text to prevent the likely modern misunderstanding.
- pob_phrase: you have what is yours
  simplified_phrase: you have what belongs to you
  preserved_meaning: The servant emphasizes that he is returning the master’s own property.
  reasoning_layer_used: POB lexical decision for ἔχεις τὸ σόν
  rationale: The revised wording makes the elliptical possessive expression clear in ordinary English.
translation_notes:
