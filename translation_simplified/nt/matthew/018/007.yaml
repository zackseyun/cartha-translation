translation:
  language: en
  text: Woe to the world because of stumbling blocks[a]. For stumbling blocks must come, but woe to the person[b] through whom a stumbling block comes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “offenses,” “causes of sin,” or “traps”; the term refers to something that causes a person to stumble, whether by offense, enticement, or an occasion for sin.
    reason: lexical_alternative
  - marker: b
    text: The Greek is grammatically masculine singular, but it represents any individual through whom such a stumbling block comes.
    reason: cultural_note
simplification_decisions:
- pob_phrase: it is necessary that the stumbling blocks come
  simplified_phrase: stumbling blocks must come
  preserved_meaning: The stumbling blocks are inevitable, but the basis of that necessity remains unstated.
  reasoning_layer_used: POB theological decision on ἀνάγκη
  rationale: “Must come” states the same necessity in shorter, natural English.
- pob_phrase: the man through whom the stumbling block comes
  simplified_phrase: the person through whom a stumbling block comes
  preserved_meaning: The warning concerns any individual who serves as the agent of a stumbling block.
  reasoning_layer_used: POB representative-force decision and footnote
  rationale: “Person” brings the documented representative sense into clear modern English.
- pob_phrase: for it is necessary ... but
  simplified_phrase: For ... must come, but
  preserved_meaning: The necessity explains the world's woe before the verse turns to individual responsibility.
  reasoning_layer_used: POB lexical decisions for γάρ and πλήν
  rationale: A new sentence eases reading while “For” and “but” retain both logical connections.
interpretive_expansions:
- pob_phrase: the man
  rendering: the person
  claim: The masculine singular represents any individual, not only a male.
  evidence:
