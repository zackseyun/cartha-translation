translation:
  language: en
  text: What do you think? If a man has one hundred sheep and one of them wanders away[a], will he not leave the ninety-nine on the mountains[b] and go look for the one that is wandering away[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “goes astray.” The Greek can mean wander, go astray, or be led astray.
    reason: lexical_alternative
  - marker: b
    text: Or “in the hills.”
    reason: lexical_alternative
  - marker: c
    text: Literally, “the one going astray”; traditionally, “the lost one.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: one of them goes astray
  simplified_phrase: one of them wanders away
  preserved_meaning: The sheep departs from the flock without specifying whether it was misled.
  reasoning_layer_used: POB lexical decision for πλανάω
  rationale: “Wanders away” makes the pastoral image immediately clear while retaining “goes astray” as an alternative.
- pob_phrase: go and seek
  simplified_phrase: go look for
  preserved_meaning: The man actively searches for the wandering sheep.
  reasoning_layer_used: POB lexical decision for ζητέω
  rationale: “Look for” is common modern English for searching in this setting.
- pob_phrase: the one going astray
  simplified_phrase: the one that is wandering away
  preserved_meaning: The ongoing action and verbal echo of the sheep's wandering remain active.
  reasoning_layer_used: POB lexical decision for τὸ πλανώμενον and grounding review
  rationale: The progressive wording avoids presenting the wandering as merely a completed past event.
