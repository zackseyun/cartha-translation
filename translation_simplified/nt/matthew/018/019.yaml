  preserved_meaning: The two people agree concerning the same broadly described request.
  reasoning_layer_used: Greek syntax and POB lexical decisions
  rationale: Reordering the phrase makes the relationship between their agreement and request immediately clear.
- pob_phrase: it will be done for them by my Father in heaven
  simplified_phrase: my Father in heaven will do it for them
  preserved_meaning: The Father is explicitly the one who grants the agreed request.
  reasoning_layer_used: POB lexical decision for γενήσεται αὐτοῖς and παρὰ τοῦ πατρός μου
  rationale: An active sentence is more direct while preserving the Father’s agency.
