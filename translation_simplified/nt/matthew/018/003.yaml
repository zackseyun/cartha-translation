- pob_phrase: unless you turn and become like children
  simplified_phrase: unless you turn and become like children
  preserved_meaning: Keeps both the decisive turning and the comparison with children without defining a particular childlike quality.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The wording preserves the two distinct changes and leaves the comparison open.
- pob_phrase: you will certainly not enter
  simplified_phrase: you will certainly not enter
