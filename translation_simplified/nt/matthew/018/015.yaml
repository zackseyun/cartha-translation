translation:
  language: en
  text: But if your brother[a] sins against you[b], go and show him his fault[c], just between the two of you. If he listens to you, you have won your brother.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek says “brother” in the masculine singular; in context it may refer more broadly to a fellow disciple.
    reason: lexical_alternative
  - marker: b
    text: Some manuscripts omit “against you,” reading, “If your brother sins.”
    reason: textual_variant
  - marker: c
    text: Or “confront him” or “reprove him.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: reprove him between you and him alone
  simplified_phrase: show him his fault, just between the two of you
  preserved_meaning: He must address the fault directly and privately.
  reasoning_layer_used: POB lexical decisions for ἔλεγξον and μεταξὺ σοῦ καὶ αὐτοῦ μόνου
  rationale: This replaces dated and awkward wording while preserving direct correction and privacy.
- pob_phrase: you have gained your brother
  simplified_phrase: you have won your brother
  preserved_meaning: The gain metaphor remains without adding the unstated idea of winning him back.
  reasoning_layer_used: POB lexical decision for ἐκέρδησας and grounding review
  rationale: “Won” is natural English and does not import the rejected nuance of regaining.
interpretive_expansions:
- pob_phrase: reprove him
  rendering: show him his fault
  claim: The command means bringing the brother’s fault to his attention.
  evidence:
  - The POB lexical rationale says ἐλέγχω means to expose or bring fault to light.
  confidence: high
  alternatives_preserved:
  - confront him
  - reprove him
translation_notes:
  risk_flags:
  - risk: “Show him his fault” states the verb’s contextual sense more explicitly than POB’s wording.
    mitigation: Footnote c preserves the more compact alternatives “confront” and “reprove.”
  - risk: “Won your brother” may remain unfamiliar to some readers.
    mitigation: It preserves the source metaphor without adding the unsupported word “back.”
