translation:
  language: en
  text: 'So, whenever you give to the needy, do not announce it with a trumpet, as the hypocrites do in the synagogues and on the streets so that people will praise them. I tell you the truth: they have received their reward in full.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Received their reward in full” uses a commercial expression meaning that they have already received all the reward they will get.
    reason: cultural_note
