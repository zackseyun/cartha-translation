translation:
  language: en
  text: So, whenever you give to the needy, do not sound a trumpet before you, as the hypocrites do in the synagogues and on the streets to be praised by others. I tell you the truth, they have received their reward in full.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The phrase 'received their reward in full' uses a Greek commercial term that refers to a receipt being paid in full. These people have already received all the reward they will ever get.
    reason: simplification_note
