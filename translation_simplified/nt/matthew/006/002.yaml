  preserved_meaning: The act remains charitable giving for people in need.
  reasoning_layer_used: POB lexical decision and footnote a
  rationale: This replaces the unfamiliar term “alms” with its clear contextual meaning.
- pob_phrase: do not sound a trumpet before you
  simplified_phrase: do not announce it with a trumpet
  preserved_meaning: The vivid trumpet image and the warning against conspicuous self-promotion are both preserved.
  reasoning_layer_used: POB lexical decision, footnote b, and immediate purpose clause
  rationale: “Announce it” makes the public-display force understandable without deciding whether the trumpet is literal or hyperbolic.
- pob_phrase: so that they may be glorified by people
  simplified_phrase: so that people will praise them
  preserved_meaning: Their purpose is to gain public acclaim from human observers.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: “Praise” states the contextual sense of human glorification in natural English.
