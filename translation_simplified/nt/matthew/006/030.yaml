  preserved_meaning: God gives the short-lived field grass its covering in the manner described in the preceding verses.
  reasoning_layer_used: POB lexical decision for οὕτως ἀμφιέννυσιν and immediate context
  rationale: This wording makes the backward reference clear in natural English.
- pob_phrase: which is here today and tomorrow is thrown into an oven
  simplified_phrase: which is here today and thrown into an oven tomorrow
  preserved_meaning: The grass exists only briefly before being burned as oven fuel.
  reasoning_layer_used: POB lexical decisions for σήμερον ὄντα and αὔριον εἰς κλίβανον βαλλόμενον
  rationale: Moving “tomorrow” produces smoother English without changing the time contrast.
- pob_phrase: will he not much more clothe you
  simplified_phrase: won't he do much more to clothe you
  preserved_meaning: The rhetorical question argues from God's care for grass to his far greater care for the disciples.
