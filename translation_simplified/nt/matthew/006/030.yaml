translation:
  language: en
  text: But if that is how God clothes the grass of the field, which is here today and thrown into an oven[a] tomorrow, won't he do much more to clothe you? You of little faith![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The oven is a baking oven; dried grass and field plants could be used as fuel.
    reason: cultural_note
  - marker: b
    text: Or “you who have little faith.” The Greek is a direct address rebuking inadequate trust.
    reason: lexical_alternative
simplification_decisions:
