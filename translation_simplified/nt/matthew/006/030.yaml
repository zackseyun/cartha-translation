translation:
  language: en
  text: But if that is how God clothes the grass of the field, which is here today and thrown into an oven[a] tomorrow, won't he clothe you even more? You of little faith[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The 'oven' refers to a domestic clay baking oven; dried grass and wild plants were commonly used as fuel.
    reason: simplification_note
  - marker: b
    text: Or 'you who have little faith.' The Greek word is a direct address expressing a gentle rebuke for inadequate trust.
    reason: simplification_note
