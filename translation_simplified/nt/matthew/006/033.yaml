translation:
  language: en
  text: But seek first his kingdom and his righteousness[a], and all these things will be given to you as well.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'his justice.' The Greek word can mean righteousness or justice; 'righteousness' is used here because it refers to living in a right relationship with God and doing his will, rather than just social or legal justice.
    reason: simplification_note
