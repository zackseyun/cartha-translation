  text: But be careful not to practice your righteousness in front of others in order to be seen by them[a]. Otherwise, you will have no reward from your Father in heaven[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “your acts of righteousness,” that is, your good deeds. Some ancient manuscripts read “your charitable giving.”
    reason: textual_variant
  - marker: b
    text: The Greek is plural, literally “in the heavens.”
    reason: lexical_alternative
