translation:
  language: en
  text: Be careful not to practice your righteousness in front of others just to be seen by them[a]. Otherwise, you will have no reward from your Father in heaven[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'your good deeds.' Some ancient manuscripts read 'your charitable giving.'
    reason: simplification_note
  - marker: b
    text: The Greek is plural, literally 'in the heavens.'
    reason: simplification_note
