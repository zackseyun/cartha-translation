  text: But store up treasures for yourselves in heaven, where moths and decay[a] do not destroy, and where thieves do not break in[b] and steal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'rust.' The Greek word refers broadly to any kind of consuming corrosion, eating away, or decay.
    reason: lexical_alternative
  - marker: b
    text: Literally 'dig through,' which refers to how thieves in antiquity would dig through the mud-brick walls of a house.
    reason: cultural_note
