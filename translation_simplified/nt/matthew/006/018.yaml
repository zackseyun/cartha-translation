simplification_decisions:
- pob_phrase: so that you may not appear to men to be fasting
  simplified_phrase: So that others will not see that you are fasting
  preserved_meaning: The fasting is not meant to be displayed to human observers.
  reasoning_layer_used: POB lexical decisions for ὅπως, μὴ φανῇς, and τοῖς ἀνθρώποις
  rationale: This keeps the purpose force while expressing the public-display concern in natural English.
- pob_phrase: but to your Father who is in secret
  simplified_phrase: but your Father who is in secret will
  preserved_meaning: The Father, rather than human observers, is the one before whom the fasting is evident.
  reasoning_layer_used: POB lexical and theological decisions for ἀλλὰ and τῷ ἐν τῷ κρυφαίῳ
  rationale: The recast completes the English contrast without adding the unsupported word “only.”
- pob_phrase: and your Father who sees in secret will reward you
  simplified_phrase: Your Father, who sees in secret, will reward you.
  preserved_meaning: The hidden Father sees hidden devotion and responds with a reward.
  reasoning_layer_used: POB lexical decisions for βλέπων and ἀποδώσει
  rationale: A new sentence makes the promise easier to follow while retaining the repeated “in secret” language.
