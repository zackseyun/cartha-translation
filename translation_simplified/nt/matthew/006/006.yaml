translation:
  language: en
  text: But when you pray, go into your private room[a]. Shut the door and pray to your Father who is in secret. And your Father, who sees in secret, will reward you[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'inner room' or 'storeroom.' Historically translated as 'closet,' the Greek refers to an interior room used for privacy or storage.
    reason: simplification_note
  - marker: b
    text: Or 'repay you.' The Greek verb can mean 'give back,' 'repay,' or 'reward' depending on context.
    reason: simplification_note
