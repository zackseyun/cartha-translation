translation:
  language: en
  text: Look at the birds in the sky[a]. They do not plant or harvest or store food in barns, and yet your heavenly Father feeds them. Are you not worth much more than they are?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally, 'birds of the air.'
    reason: simplification_note
simplification_decisions:
- preserved_meaning: Changed 'of the sky' to 'in the sky' because 'in the sky' is the natural, idiomatic way modern English speakers refer to birds in flight or in their natural habitat, while still representing the Greek 'τοῦ οὐρανοῦ'.
  reasoning_layer_used: POB audit trail
  rationale: Changed 'of the sky' to 'in the sky' because 'in the sky' is the natural, idiomatic way modern English speakers refer to birds in flight or in their natural habitat, while still representing the Greek 'τοῦ οὐρανοῦ'.
- preserved_meaning: Sow and reap are agricultural terms that, while still known, are less common in daily modern speech than plant and harvest. Replacing 'gather into barns' with 'store food in barns' clarifies the function of gathering (storing food/grain) for a general audience.
  reasoning_layer_used: POB audit trail
  rationale: Sow and reap are agricultural terms that, while still known, are less common in daily modern speech than plant and harvest. Replacing 'gather into barns' with 'store food in barns' clarifies the function of gathering (storing food/grain) for a general audience.
- preserved_meaning: 'Added ''yet'' to make the logical contrast explicit: despite the fact that birds do not engage in human agricultural labor (planting, harvesting, storing), God still feeds them. This clarifies the force of Jesus'' argument.'
  reasoning_layer_used: POB audit trail
  rationale: 'Added ''yet'' to make the logical contrast explicit: despite the fact that birds do not engage in human agricultural labor (planting, harvesting, storing), God still feeds them. This clarifies the force of Jesus'' argument.'
