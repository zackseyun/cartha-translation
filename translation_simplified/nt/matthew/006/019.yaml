translation:
  language: en
  text: Do not store up treasures for yourselves on earth, where moths and decay[a] destroy them, and where thieves break in[b] and steal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'rust'; the Greek word refers to any eating away or consuming deterioration, not only metal corrosion.
    reason: simplification_note
  - marker: b
    text: Literally 'dig through,' a reference to thieves digging through the mud-brick walls of ancient houses.
    reason: simplification_note
