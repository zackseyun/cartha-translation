translation_notes:
  source_alignment_notes: The translation aligns closely with the SBLGNT source text. The spatial contrast between earth and heaven is preserved, and the broad lexical value of 'βρῶσις' as 'decay' rather than strictly 'rust' is maintained. The literal meaning of 'διορύσσουσιν' ('dig through') is preserved in the cultural footnote.
  readability_notes:
  - The flow of the sentence is improved by placing the reflexive pronoun 'for yourselves' after the direct object 'treasures.' Pluralizing 'moth' and adding 'them' after 'destroy' prevents the phrasing from sounding overly stiff or archaic to modern readers.
  compression_notes:
  - No thematic or semantic content was compressed out. The complete list of destructive elements (moths, decay, thieves) remains fully intact.
  risk_flags:
