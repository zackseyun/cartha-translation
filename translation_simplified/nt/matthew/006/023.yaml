simplification_decisions:
- preserved_meaning: Changed 'the light in you' to 'the light inside you' to clarify the internal metaphorical nature of the light for a modern audience.
  reasoning_layer_used: POB audit trail
  rationale: Changed 'the light in you' to 'the light inside you' to clarify the internal metaphorical nature of the light for a modern audience.
- preserved_meaning: Rendered 'how great is the darkness!' as 'how great is that darkness!' to connect the final exclamation more directly and clearly to the internal darkness just described.
  reasoning_layer_used: POB audit trail
  rationale: Rendered 'how great is the darkness!' as 'how great is that darkness!' to connect the final exclamation more directly and clearly to the internal darkness just described.
- preserved_meaning: Preserved the footnote [a] because the Hebrew/Aramaic idiom of a 'bad/evil eye' meaning stinginess or moral badness is crucial to understanding the surrounding passage about money and cannot be easily translated with a single modern English word.
  reasoning_layer_used: POB audit trail
  rationale: Preserved the footnote [a] because the Hebrew/Aramaic idiom of a 'bad/evil eye' meaning stinginess or moral badness is crucial to understanding the surrounding passage about money and cannot be easily translated with a single modern English word.
retained_terms:
- term: bad eye
  reason: Retained the literal body metaphor of the 'eye' as it is crucial to Jesus's teaching on spiritual vision and perception, avoiding over-simplification.
- term: dark / darkness
  reason: Preserved the stark contrast of light and darkness which is a central biblical motif for spiritual truth versus error.
