translation:
  language: en
  text: 'That is why I tell you: do not worry about your life[a]—what you will eat—or about your body—what you will wear. Isn''t life more than food, and the body more than clothes?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word translated “life” can also mean “soul,” but here the context of food and clothing points to a person's life or self.
    reason: lexical_alternative
