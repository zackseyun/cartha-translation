simplification_decisions:
- preserved_meaning: Slightly compressed 'But you, when you...' to 'But when you...' to improve modern English flow. The contrastive force of the Greek 'σὺ δὲ' is still sufficiently carried by 'But' in contrast to the hypocrites in the preceding verses.
  reasoning_layer_used: POB audit trail
  rationale: Slightly compressed 'But you, when you...' to 'But when you...' to improve modern English flow. The contrastive force of the Greek 'σὺ δὲ' is still sufficiently carried by 'But' in contrast to the hypocrites in the preceding verses.
- preserved_meaning: Modern readers often associate 'anoint' exclusively with sacred rituals or royal ceremonies. Translating this as 'put oil on your head' accurately reflects the Greek verb's (ἀλείφω) reference to routine, daily grooming in first-century Jewish culture, directly preserving the theological decision that this is an instruction for normal presentation rather than ritual action.
