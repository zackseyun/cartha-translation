- pob_phrase: the mighty works done among you
  simplified_phrase: the miracles done among you
  preserved_meaning: These were deeds of divine power performed among the townspeople.
  reasoning_layer_used: POB lexical decision for αἱ δυνάμεις
  rationale: “Miracles” is an approved alternative that immediately identifies the deeds for modern readers.
- pob_phrase: had taken place in Tyre and Sidon
  simplified_phrase: had happened in Tyre and Sidon
  preserved_meaning: Jesus makes a contrary-to-fact comparison between the towns.
  reasoning_layer_used: POB lexical decision for ἐγένοντο and theological decision
  rationale: “Had happened” is plainer while preserving the hypothetical comparison.
- pob_phrase: they would have repented long ago in sackcloth and ashes
  simplified_phrase: their people would have repented long ago, wearing sackcloth and sitting in ashes
  preserved_meaning: The people of Tyre and Sidon would have shown repentance through traditional signs of mourning.
  reasoning_layer_used: POB lexical decisions for μετενόησαν and ἐν σάκκῳ καὶ σποδῷ
  rationale: The recast sentence clarifies the pronoun and preserves the concrete cultural image.
