translation:
  language: en
  text: Woe to you, Chorazin! Woe to you, Bethsaida! If the miracles done among you had happened in Tyre and Sidon, their people would have repented long ago, wearing sackcloth and sitting in ashes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sackcloth and ashes were signs of mourning and repentance.
    reason: cultural_note
