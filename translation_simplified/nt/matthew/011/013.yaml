simplification_decisions:
- pob_phrase: prophesied
  simplified_phrase: bore prophetic witness
  preserved_meaning: Both the Prophets and the Law testified prophetically.
  reasoning_layer_used: POB lexical rationale for ἐπροφήτευσαν
  rationale: This makes the Law’s personified prophetic role clearer without reducing prophecy to prediction.
- pob_phrase: all the prophets and the Law
  simplified_phrase: all the Prophets and the Law
  preserved_meaning: Jesus refers to Israel’s recognized scriptural witness.
  reasoning_layer_used: POB theological decision on the Law as a scriptural title
  rationale: Capitalization helps readers recognize the paired scriptural categories.
translation_notes:
  risk_flags:
  - risk: “Bore prophetic witness” is less direct than the source verb “prophesied.”
    mitigation: It preserves the POB rationale that both the Prophets and the personified Law gave prophetic testimony.
  - risk: “Until John” may imply either inclusion or exclusion of John at the boundary.
    mitigation: The footnote preserves both readings without deciding between them.
