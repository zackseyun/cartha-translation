simplification_decisions:
- pob_phrase: neither eating nor drinking
  simplified_phrase: neither eating nor drinking in the usual way
  preserved_meaning: John’s unusually strict, abstinent way of life remains contrasted with ordinary eating and drinking.
  reasoning_layer_used: POB lexical rationale and immediate context
  rationale: The added phrase prevents readers from thinking John never consumed food or drink.
- pob_phrase: they say
  simplified_phrase: people say
  preserved_meaning: The accusers remain indefinite and are not identified more narrowly than the Greek permits.
  reasoning_layer_used: POB lexical decision
  rationale: “People” makes the indefinite subject immediately clear in natural English.
- pob_phrase: He has a demon
  simplified_phrase: He has a demon
  preserved_meaning: The reported accusation retains the source wording without making it the narrator’s claim.
  reasoning_layer_used: POB theological and lexical decisions
  rationale: This clear wording preserves the controlled choice and its theological restraint.
interpretive_expansions:
- pob_phrase: neither eating nor drinking
  rendering: neither eating nor drinking in the usual way
  claim: The expression describes John’s ascetic manner rather than total abstinence from all food and liquid.
  evidence:
