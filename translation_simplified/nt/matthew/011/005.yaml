translation:
  language: en
  text: Blind people receive sight, people unable to walk normally walk, people with leprosy are cleansed, deaf people hear, dead people are raised, and poor people have good news proclaimed to them.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Or “have the gospel preached to them.” The Greek verb is passive: they are brought good news.'
    reason: lexical_alternative
  - marker: b
    text: This list echoes Isaiah 35:5–6 and 61:1, signs associated with the Messiah’s work.
    reason: cross_reference
simplification_decisions:
- pob_phrase: the lame walk
  simplified_phrase: people unable to walk normally walk
  preserved_meaning: People with impaired walking are restored to walk.
  reasoning_layer_used: POB lexical decisions
  rationale: Adding “normally” avoids limiting the group to people wholly unable to walk.
- pob_phrase: lepers are cleansed
  simplified_phrase: people with leprosy are cleansed
  preserved_meaning: People in the ancient leprosy category receive physical and ritual restoration.
  reasoning_layer_used: POB lexical decisions
  rationale: Person-centered wording clarifies the group while “cleansed” preserves the full restoration.
- pob_phrase: the blind; the deaf; the dead; the poor
  simplified_phrase: blind people; deaf people; dead people; poor people
  preserved_meaning: Each phrase still identifies the same group in the miracle list.
  reasoning_layer_used: POB lexical decisions
  rationale: Explicit references to people are clearer for modern readers.
translation_notes:
  risk_flags:
  - risk: Modern readers may equate ancient leprosy exactly with the modern diagnosis.
    mitigation: The wording follows the conventional referent without making a medical claim.
  - risk: “Unable to walk normally” may sound broader than total inability to walk.
    mitigation: That breadth matches the POB lexical rationale for the Greek category.
