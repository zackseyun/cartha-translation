  text: Just then, while he was still speaking, Judas, one of the twelve, arrived. A large crowd from the chief priests and elders of the people came with him, carrying swords and clubs.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And while he was still speaking, behold
  simplified_phrase: Just then, while he was still speaking
  preserved_meaning: Preserves both the timing and the vivid immediacy of Judas’s arrival.
  reasoning_layer_used: POB lexical decisions for ἔτι αὐτοῦ λαλοῦντος and ἰδού
  rationale: “Just then” gives the discourse marker natural force without the archaic “behold.”
- pob_phrase: Judas, one of the twelve, came, and with him a large crowd
  simplified_phrase: Judas, one of the twelve, arrived. A large crowd ... came with him
  preserved_meaning: Preserves Judas’s arrival with the crowd while making the sequence easier to follow.
  reasoning_layer_used: POB translation and lexical decisions
  rationale: Two sentences replace the long chain of clauses with clear modern narration.
- pob_phrase: from the chief priests and elders of the people
  simplified_phrase: A large crowd from the chief priests and elders of the people
  preserved_meaning: Preserves the leaders as the crowd’s source without explicitly claiming they sent it.
  reasoning_layer_used: POB theological decision on ἀπό
  rationale: Placing “from” beside “crowd” clarifies the connection while retaining the documented degree of implication.
