simplification_decisions:
- pob_phrase: Get up, let us go.
  simplified_phrase: Get up. Let’s go.
  preserved_meaning: Preserves both the command to rise and the call to leave together.
  reasoning_layer_used: POB translation and lexical decisions for ἐγείρεσθε and ἄγωμεν
  rationale: Two short sentences and “Let’s” make Jesus’ urgent words easier to follow.
- pob_phrase: the one betraying me
  simplified_phrase: the one who is betraying me
  preserved_meaning: Keeps the ongoing betrayal and its relational treachery in view.
  reasoning_layer_used: POB lexical and theological decisions for ὁ παραδιδούς
  rationale: The full relative clause is more natural for common English readers.
- pob_phrase: has come near
  simplified_phrase: is close
  preserved_meaning: Communicates that the betrayer’s approach now places him nearby.
  reasoning_layer_used: POB lexical decision for ἤγγικεν and immediate narrative context
  rationale: “Is close” expresses the immediate situation in simpler English without claiming full arrival.
