translation:
  language: en
  text: Then he said to them, “My soul is overwhelmed with sorrow, to the point of death. Stay here and keep watch[a] with me.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “stay awake.” The Greek includes both staying awake and watchful vigilance.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: My soul is deeply grieved, even to death
  simplified_phrase: My soul is overwhelmed with sorrow, to the point of death
  preserved_meaning: Jesus describes profound inner sorrow so extreme that it reaches the point of death.
  reasoning_layer_used: POB lexical and theological decisions for περίλυπος, ψυχή, and ἕως θανάτου
  rationale: Uses documented clearer alternatives while retaining “my soul” and the full intensity of Jesus’ anguish.
- pob_phrase: Remain here and keep watch with me
  simplified_phrase: Stay here and keep watch with me
  preserved_meaning: Jesus commands the disciples to remain nearby and be watchfully present with him.
  reasoning_layer_used: POB lexical decisions for μείνατε and γρηγορεῖτε
  rationale: Replaces formal “remain” with common “stay” while preserving the broader command to keep watch.
translation_notes:
  risk_flags:
  - risk: “Keep watch” may not clearly convey literal wakefulness.
    mitigation: The footnote preserves “stay awake” as the important alternate sense.
