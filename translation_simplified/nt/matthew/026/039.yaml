translation:
  language: en
  text: He went a little farther, fell facedown, and prayed, “My Father, if it is possible, let this cup[a] pass from me. Yet let this happen according to your will, not mine.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
