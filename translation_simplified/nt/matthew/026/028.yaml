simplification_decisions:
- pob_phrase: my blood of the covenant
  simplified_phrase: my blood—the blood of the covenant
  preserved_meaning: Jesus identifies his blood as covenant blood without adding “new” to the main text.
  reasoning_layer_used: POB lexical and theological decisions on τῆς διαθήκης
  rationale: The restatement makes the relationship between “blood” and “covenant” easier to follow.
- pob_phrase: which is poured out for many
  simplified_phrase: poured out for many
  preserved_meaning: Keeps the sacrificial image and the source wording “many.”
  reasoning_layer_used: POB lexical decisions on ἐκχυννόμενον and περὶ πολλῶν
  rationale: Removing the relative clause produces a more direct sentence without weakening the image.
- pob_phrase: for the forgiveness of sins
  simplified_phrase: so that sins may be forgiven
  preserved_meaning: Expresses forgiveness as the purpose or result of the blood being poured out.
  reasoning_layer_used: POB lexical decision on εἰς ἄφεσιν ἁμαρτιῶν
  rationale: A purpose clause makes the connection clear in current English.
