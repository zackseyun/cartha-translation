translation:
  language: en
  text: But Jesus said to Judas, “Friend, do what you came to do.”[a] Then those with Judas came up, grabbed Jesus, and seized him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Friend, why have you come?” The Greek words are brief and may be understood as a question.
    reason: alternative_reading
