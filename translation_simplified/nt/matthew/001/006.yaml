translation:
  language: en
  text: Jesse was the father of King David. David was the father of Solomon by the wife of Uriah[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek literally says “from the [woman] of Uriah,” using an abbreviated expression in which “woman” or “wife” is implied. It refers to Bathsheba by her relationship to Uriah rather than by name.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Jesse fathered David the king
  simplified_phrase: Jesse was the father of King David
  preserved_meaning: Jesse is named as David’s male genealogical parent, and David’s royal status remains prominent.
  reasoning_layer_used: POB lexical decisions for ἐγέννησεν and βασιλέα
  rationale: The recast uses familiar genealogical English while retaining David’s title.
- pob_phrase: David fathered Solomon
  simplified_phrase: David was the father of Solomon
  preserved_meaning: David is named as Solomon’s male genealogical parent.
  reasoning_layer_used: POB lexical decision for ἐγέννησεν
  rationale: “Was the father of” is immediately clear to readers unfamiliar with genealogical “fathered.”
- pob_phrase: by the wife of Uriah
  simplified_phrase: by the wife of Uriah
  preserved_meaning: Matthew identifies Solomon’s mother indirectly through Uriah and does not name Bathsheba.
  reasoning_layer_used: POB lexical and theological decisions for ἐκ τῆς τοῦ Οὐρίου
  rationale: The distinctive indirect reference is retained because it carries Matthew’s literary emphasis.
