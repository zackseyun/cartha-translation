translation_notes:
  source_alignment_notes: The Greek phrase 'ἐκ τῆς τοῦ Οὐρίου' (literally 'from the of Uriah') is kept as 'by the wife of Uriah.' We avoided modernizing this to 'Bathsheba' because the Greek text intentionally avoids her name to draw the reader's attention to Uriah, maintaining a significant connection to the narrative in 2 Samuel.
  readability_notes:
  - Structuring the genealogy with 'was the father of' and 'King David' makes the sentence structure sound more natural and less archaic to modern readers without losing any genealogical accuracy.
  compression_notes:
  - No historical or theological details were compressed or omitted. The connective 'δέ' (and/now) is left untranslated between the two sentences as modern English style naturally links these genealogical statements without needing explicit conjunctions.
  risk_flags:
  - risk: None. The potential risk of losing the significance of the indirect reference to Bathsheba is fully mitigated by retaining the exact phrasing and explaining it clearly in the footnote.
    mitigation: Flag retained for reviewer attention.
