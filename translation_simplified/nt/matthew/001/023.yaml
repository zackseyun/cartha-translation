translation:
  language: en
  text: Look, the virgin[a] will conceive and give birth to a son, and they will call him Immanuel—which means 'God with us.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'young woman.' However, the original Greek word and the story of Jesus' birth support 'virgin.'
    reason: simplification_note
