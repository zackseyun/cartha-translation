translation_notes:
  source_alignment_notes: The translation retains the indefinite plural third-person verb ('they will call') rather than turning it into a passive ('he will be named'), keeping alignment with Matthew's Greek 'kalesousin' and the POB stance. It also keeps the name explanation 'God with us' as a direct translation of the Hebrew/Greek compound meaning, avoiding any doctrinal expansion.
  readability_notes:
  - Changing 'Behold' to 'Look' and 'bear' to 'give birth to' significantly improves readability for readers unfamiliar with traditional biblical language. Replacing 'which is translated' with 'which means' also removes technical translation terminology from the narrative flow.
  compression_notes:
  - Removed technical footnotes discussing alternate translations of 'which is translated' and transliterative variations like 'Emmanuel' to avoid overwhelming the common reader. Kept only the critical footnote concerning 'young woman' vs 'virgin' due to its theological and historical importance.
  risk_flags:
  - risk: Using 'Look' instead of 'Behold' might slightly reduce the formal scriptural tone for some traditional readers, but it greatly increases accessibility for the target audience. There is also a risk of losing the literal 'his name' expression, but 'call him' is semantically identical in modern English.
    mitigation: Flag retained for reviewer attention.
