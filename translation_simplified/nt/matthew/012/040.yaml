translation:
  language: en
  text: For just as Jonah was inside a large sea creature[a] for three days and three nights, so the Son of Man will be in the heart of the earth[b] for three days and three nights.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “great fish.” The Greek word refers broadly to a large sea creature, not to one specific kind of animal.
    reason: lexical_alternative
  - marker: b
    text: “In the heart of the earth” may refer to burial, the grave, or the realm of the dead.
    reason: alternative_reading
  - marker: c
    text: “Three days and three nights” is sometimes understood as including parts of three days, though others understand it more strictly.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: in the belly of the sea creature
  simplified_phrase: inside a large sea creature
  preserved_meaning: Jonah was within the large sea creature.
  reasoning_layer_used: POB lexical decisions for κοιλία and κῆτος
  rationale: “Inside” is immediate common English, while “large sea creature” preserves the broad sense of the Greek.
- pob_phrase: three days and three nights
  simplified_phrase: for three days and three nights
  preserved_meaning: The full temporal expression remains unchanged in both parts of the comparison.
  reasoning_layer_used: POB lexical and theological decisions on the temporal expression
  rationale: Adding “for” makes the duration clear without deciding how strictly it should be counted.
- pob_phrase: in the heart of the earth
  simplified_phrase: in the heart of the earth
  preserved_meaning: The source metaphor and its open reference to burial, the grave, or the realm of the dead remain intact.
  reasoning_layer_used: POB theological decision on the earth metaphor
  rationale: The phrase is retained because replacing it would resolve an ambiguity the POB deliberately preserves.
translation_notes:
  risk_flags:
  - risk: “Inside” does not reproduce the specific belly image.
    mitigation: It conveys the image’s essential spatial force, while the verse’s comparison remains intact.
  - risk: Readers may take either the earth metaphor or the time expression too narrowly.
    mitigation: Separate footnotes clearly preserve the documented alternatives for each phrase.
