translation:
  language: en
  text: Either make both the tree and its fruit good, or make both the tree and its fruit rotten,[a][b] because a tree is known by its fruit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Rotten” can also be translated “bad.”
    reason: lexical_alternative
  - marker: b
    text: Here “make” may mean “consider” or “show to be,” though the Greek uses a command form.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: make the tree good and its fruit good
  simplified_phrase: make both the tree and its fruit good
  preserved_meaning: The tree and its fruit must share the same quality.
  reasoning_layer_used: POB lexical decisions and source parallelism
  rationale: Using “both” removes repetition without merging the tree and fruit.
- pob_phrase: for the tree is known by its fruit
  simplified_phrase: because a tree is known by its fruit
  preserved_meaning: The fruit reveals what kind of tree it is.
  reasoning_layer_used: POB lexical decision for ἐκ γὰρ τοῦ καρποῦ
  rationale: “Because” states the explanatory connection more naturally in modern English.
translation_notes:
  risk_flags:
