translation:
  language: en
  text: Or haven’t you read in the Law that on every Sabbath the priests in the temple break the Sabbath and yet are not guilty?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “The Law” refers to the Law of Moses, including its requirements for priests to serve on the Sabbath (Numbers 28:9–10).
    reason: cross_reference
simplification_decisions:
- pob_phrase: on the Sabbaths
  simplified_phrase: on every Sabbath
  preserved_meaning: The priests performed this service repeatedly on Sabbath days.
  reasoning_layer_used: POB lexical decision for τοῖς σάββασιν
  rationale: “Every Sabbath” expresses the repeated occasions in natural English.
- pob_phrase: profane the Sabbath
  simplified_phrase: break the Sabbath
  preserved_meaning: Their required temple work can be described with the strong language of Sabbath violation.
  reasoning_layer_used: POB lexical and theological decisions for βεβηλοῦσιν
  rationale: “Break” is a documented alternative that avoids the modern misunderstanding of “profane.”
- pob_phrase: and are guiltless
  simplified_phrase: and yet are not guilty
  preserved_meaning: The priests incur no legal guilt despite activity described as breaking the Sabbath.
  reasoning_layer_used: POB theological decision and lexical decision for ἀναίτιοί εἰσιν
  rationale: “Yet” makes the intended contrast clear without resolving its tension.
translation_notes:
  risk_flags:
  - risk: “Break” may sound less provocative than the source image of treating the Sabbath as profane.
    mitigation: The wording retains a strong violation claim and preserves the contrast that the priests are not guilty.
