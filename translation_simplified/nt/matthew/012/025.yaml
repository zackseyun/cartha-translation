  reasoning_layer_used: POB lexical decision for ἐρημοῦται
  rationale: “Brought to ruin” is an audited alternative in more familiar modern English.
- pob_phrase: city or house
  simplified_phrase: city or household
  preserved_meaning: The saying applies to a community or domestic unit divided against itself.
  reasoning_layer_used: POB lexical decision for πόλις ἢ οἰκία
  rationale: “Household” makes the likely social sense clear while a footnote preserves “house.”
