simplification_decisions:
- pob_phrase: your sons
  simplified_phrase: your own people
  preserved_meaning: The exorcists belong to the hearers’ own group, while the rhetorical contrast remains intact.
  reasoning_layer_used: POB lexical decision and grounding review
  rationale: This avoids suggesting that Jesus meant their literal children.
- pob_phrase: by whom
  simplified_phrase: by what power
  preserved_meaning: The question asks what personal power or authority enables their exorcisms.
  reasoning_layer_used: POB lexical rationale for instrumental ἐν τίνι
  rationale: This makes the comparison behind the rhetorical question clear.
- pob_phrase: Therefore
  simplified_phrase: So
  preserved_meaning: The exorcists’ actions provide the basis for the conclusion that follows.
  reasoning_layer_used: POB lexical decision for διὰ τοῦτο
  rationale: “So” preserves the inference in more common English.
interpretive_expansions:
- pob_phrase: your sons
  rendering: your own people
  claim: The phrase refers contextually to people associated with the hearers rather than necessarily to biological sons.
  evidence:
  - The POB lexical rationale says it likely means members of the hearers’ group or disciples.
  confidence: moderate
  alternatives_preserved:
  - your sons
