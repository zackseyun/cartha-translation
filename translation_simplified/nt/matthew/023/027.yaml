translation:
  language: en
  text: Woe to you, scribes and Pharisees, hypocrites! For you are like whitewashed tombs. They look beautiful on the outside, but inside they are full of dead people’s bones and every kind of impurity.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: For you are like whitewashed tombs, which outwardly appear beautiful
  simplified_phrase: For you are like whitewashed tombs. They look beautiful on the outside
  preserved_meaning: The tomb comparison explains the denunciation and contrasts attractive appearance with hidden reality.
  reasoning_layer_used: POB text and lexical decisions for γάρ, παρομοιάζετε, and ἔξωθεν
  rationale: Two sentences make the image easier to follow while “For” preserves its explanatory connection.
- pob_phrase: but inwardly are full of dead people's bones
  simplified_phrase: but inside they are full of dead people’s bones
  preserved_meaning: The tombs conceal human remains beneath their beautiful exterior.
  reasoning_layer_used: POB lexical decisions for ἔσωθεν, γέμουσιν, and ὀστέων νεκρῶν
  rationale: “Inside” is more familiar than “inwardly” and keeps the outside-inside contrast.
- pob_phrase: every kind of uncleanness
  simplified_phrase: every kind of impurity
  preserved_meaning: The broad wording includes both ritual defilement and moral corruption without choosing only one.
  reasoning_layer_used: POB lexical and theological decisions for πάσης ἀκαθαρσίας
  rationale: “Impurity” is clearer modern English while preserving the deliberately broad meaning.
translation_notes:
  risk_flags:
  - risk: Modern readers may understand “impurity” only as moral corruption.
    mitigation: “Every kind” keeps the term broad, preserving the ritual and moral dimensions documented by POB.
