simplification_decisions:
- pob_phrase: scribes and Pharisees, hypocrites, because
  simplified_phrase: scribes and Pharisees—you hypocrites—because
  preserved_meaning: Jesus directly denounces the scribes and Pharisees as hypocrites and then states the reason for the woe.
  reasoning_layer_used: POB translation, applied revision, and lexical decision for ὅτι
  rationale: Dashes make the direct accusation easier to follow while retaining the explicit causal link.
- pob_phrase: the tombs of the prophets
  simplified_phrase: the prophets’ tombs
  preserved_meaning: They build burial structures associated with the prophets.
  reasoning_layer_used: POB lexical decisions for οἰκοδομεῖτε, τάφους, and προφητῶν
  rationale: The possessive form is shorter and more natural without implying that the tombs are rebuilt.
- pob_phrase: the monuments of the righteous
  simplified_phrase: memorials to the righteous
  preserved_meaning: They decorate commemorative structures honoring righteous people.
  reasoning_layer_used: POB lexical and theological decisions for μνημεῖα and δικαίων
  rationale: “Memorials” clearly conveys commemoration while remaining distinct from the tombs already mentioned.
translation_notes:
  risk_flags:
  - risk: “Memorials” can refer broadly to commemorative structures rather than specifically to tomb monuments.
    mitigation: The POB lexical record lists “memorials” as a valid alternative and the parallel mention of tombs preserves the burial context.
