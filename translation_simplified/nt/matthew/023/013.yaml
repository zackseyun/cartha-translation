translation:
  language: en
  text: But woe to you, scribes and Pharisees, hypocrites! You shut people out of the kingdom of heaven. For you do not enter it yourselves, and you do not let those who are entering[a] go in.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “those trying to enter.” The Greek can refer to people entering or seeking to enter.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: you shut the kingdom of heaven before people
  simplified_phrase: You shut people out of the kingdom of heaven
  preserved_meaning: The leaders bar people from access to the kingdom while the image of shutting them out remains.
  reasoning_layer_used: POB lexical decisions for κλείετε and ἔμπροσθεν τῶν ἀνθρώπων
  rationale: Recasting the clause around “people” makes the barrier image immediately clear.
- pob_phrase: nor do you allow those who are entering to enter
  simplified_phrase: and you do not let those who are entering go in
  preserved_meaning: The leaders prevent people in the process of entering or seeking entry from doing so.
  reasoning_layer_used: POB lexical decision and footnote for τοὺς εἰσερχομένους and εἰσελθεῖν
  rationale: “Let … go in” removes awkward repetition without weakening the prohibition.
- pob_phrase: for you do not enter
  simplified_phrase: For you do not enter it yourselves
  preserved_meaning: Their own failure to enter explains and supports the charge that they shut others out.
  reasoning_layer_used: Source γάρ and independent grounding review
  rationale: Keeping “For” restores the explanatory connection, while “it yourselves” clarifies the contrast.
translation_notes:
  risk_flags:
  - risk: “Those who are entering” may also mean those trying to enter.
    mitigation: The footnote preserves this source-grounded participial alternative.
