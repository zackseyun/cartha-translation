  rationale: Naming the women makes the verse clear when read on its own.
- pob_phrase: some of the guard
  simplified_phrase: some of the guards
  preserved_meaning: Still refers to only part of the guard posted at the tomb.
  reasoning_layer_used: POB lexical decision
  rationale: The plural personal noun is more natural in common English.
- pob_phrase: reported to the chief priests
  simplified_phrase: told the chief priests
  preserved_meaning: Keeps the sense that the guards delivered information to the authorities.
  reasoning_layer_used: POB lexical decision
  rationale: “Told” expresses the report in simpler language.
