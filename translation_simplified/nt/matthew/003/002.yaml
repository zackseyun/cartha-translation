translation:
  language: en
  text: and said, “Change the way you think,[a] because the kingdom of heaven has come near.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally translated “Repent.” The Greek calls for a fundamental change in how you think, not merely feeling guilty or apologizing. In this context, that change should result in a changed life.
    reason: simplification_note
