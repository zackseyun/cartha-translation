  reasoning_layer_used: POB audit trail
  rationale: Converted the participle to a past-tense verb to fit standard narrative flow in modern English.
- simplified_phrase: Change your hearts and minds
  preserved_meaning: The POB notes emphasize that the Greek 'metanoeite' is a fundamental cognitive reorientation rather than just emotional remorse. 'Change your hearts and minds' captures this deep internal change in a way that modern readers can easily grasp.
  reasoning_layer_used: POB audit trail
  rationale: The POB notes emphasize that the Greek 'metanoeite' is a fundamental cognitive reorientation rather than just emotional remorse. 'Change your hearts and minds' captures this deep internal change in a way that modern readers can easily grasp.
- simplified_phrase: because
