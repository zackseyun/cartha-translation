translation_notes:
  source_alignment_notes: We aligned the translation with the Greek 'metanoeite' by emphasizing cognitive reorientation ('minds') along with lifestyle change ('hearts'), avoiding the modern emotional drift of 'repent' while preserving the POB's lexical analysis.
  readability_notes:
  - The sentence structure is simplified by replacing archaic conjunctions ('for') and verbs ('has drawn near') with modern, highly readable equivalents ('because', 'is near'), which flow naturally in contemporary English.
  compression_notes:
  - The perfect active indicative 'has drawn near' was compressed into 'is near'. While this slightly reduces the aspectual precision of the Greek perfect tense, it conveys the exact same functional imminence to a modern reader without syntactic clutter.
  risk_flags:
  - risk: By translating 'metanoeite' as 'Change your hearts and minds' instead of the traditional 'Repent', some readers familiar with traditional translations might initially find it unfamiliar, which is mitigated by the explanatory footnote.
    mitigation: Flag retained for reviewer attention.
