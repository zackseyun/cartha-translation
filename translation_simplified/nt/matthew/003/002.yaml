translation:
  language: en
  text: and said, “Change your hearts and minds[a], because the kingdom of heaven is near.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally translated as 'Repent.' The original Greek word means a complete change of mind and life direction, not just feeling guilty or apologizing.
    reason: simplification_note
simplification_decisions:
- simplified_phrase: and said
