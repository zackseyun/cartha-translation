translation:
  language: en
  text: 'For this is the one spoken of through Isaiah the prophet, who said: “A voice of one calling out in the wilderness: ‘Prepare the way of the Lord[a]; make his paths straight.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the LORD”; the quotation echoes Isaiah 40:3, where the Hebrew text has the divine name YHWH.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: through Isaiah the prophet, saying
  simplified_phrase: through Isaiah the prophet, who said
  preserved_meaning: Isaiah remains the prophetic speaker through whom the words were given.
  reasoning_layer_used: POB lexical decision for διὰ Ἠσαΐου τοῦ προφήτου and λέγοντος
  rationale: “Who said” gives a natural citation formula without adding a temporal nuance.
- pob_phrase: A voice of one crying
  simplified_phrase: A voice of one calling out
  preserved_meaning: The voice is loudly proclaiming rather than weeping.
  reasoning_layer_used: POB lexical decision for Φωνὴ βοῶντος
  rationale: “Calling out” prevents a common modern misunderstanding while retaining the herald’s cry.
- pob_phrase: For this is the one spoken of
  simplified_phrase: For this is the one spoken of
  preserved_meaning: The verse explains that John is the person identified in Isaiah’s prophecy.
  reasoning_layer_used: POB lexical decisions for γάρ, οὗτος, and ὁ ῥηθεὶς
  rationale: The wording preserves the explanatory link and the prophecy’s identification of John.
translation_notes:
  risk_flags:
  - risk: Modern readers may take “Lord” only as a general title and miss the Isaiah quotation’s divine-name background.
    mitigation: Footnote [a] preserves the alternative “the LORD” and identifies YHWH in Isaiah 40:3.
