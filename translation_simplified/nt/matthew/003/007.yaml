  rationale: “Coming to” is natural English and remains within the documented source range.
- pob_phrase: Offspring of vipers
  simplified_phrase: You offspring of vipers!
  preserved_meaning: John directly addresses those present with the same vivid prophetic rebuke.
  reasoning_layer_used: POB lexical decision on Γεννήματα ἐχιδνῶν
  rationale: Adding “You” and an exclamation mark makes the vocative clear and forceful in English.
- pob_phrase: many of the Pharisees and Sadducees
