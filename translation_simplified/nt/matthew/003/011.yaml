translation:
  language: en
  text: I baptize you with water for repentance[a], but the one coming after me is more powerful than I am. I am not even worthy to carry his sandals. He will baptize you with the Holy Spirit and fire.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek preposition translated 'with' can also be rendered 'in' (both here and in the phrase 'with the Holy Spirit and fire').
    reason: simplification_note
  - marker: b
    text: '''Fire'' can be understood as referring to purification or to judgment; the context leaves this open.'
    reason: simplification_note
