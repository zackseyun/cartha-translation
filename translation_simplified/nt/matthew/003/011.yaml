retained_terms:
- term: baptize
  reason: Retained as it is the central theological and ritual concept of the passage; translating it as 'immerse' or 'wash' would over-specify the mode or lose historical continuity.
- term: repentance
  reason: Kept as a core theological term. Simplifying to 'turning from sin' would lose the gravity and theological breadth of 'metanoia' in this specific baptismal context.
- term: Holy Spirit
  reason: Retained as the standard personal referent for the Third Person of the Trinity, consistent with historical Christian theology and the Greek context.
translation_notes:
  source_alignment_notes: Maintained the stark contrast between John's baptism and the Messiah's baptism, and preserved the ambiguity of the 'fire' metaphor as well as the dual lexical options for 'en' (in/with) via footnotes.
  readability_notes:
  - Deconstructed the complex Greek sentence structure into three shorter, punchier sentences. Replaced the relative clause with an independent clause to make the statement of humility highly accessible.
  compression_notes:
  - Omitted the word 'indeed' (μὲν) which acts as a transitional particle but adds unnecessary stiffness in modern English. Compressed 'He himself' to 'He' for better flow.
  risk_flags:
  - risk: Using 'with water' instead of 'in water' is more natural to modern ears but departs from POB's chosen rendering of 'en'; this risk is mitigated by an explicit footnote explaining the lexical alternative. Retaining 'repentance' assumes basic biblical literacy but is necessary to preserve theological depth.
    mitigation: Flag retained for reviewer attention.
