translation:
  language: en
  text: I baptize you with water for repentance[a], but the one coming after me is more powerful than I am. I am not worthy to carry his sandals. He himself will baptize you with the Holy Spirit and fire.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word translated “with” can also mean “in,” both here and in the phrase “with the Holy Spirit and fire.”
    reason: lexical_alternative
  - marker: b
    text: “Fire” may refer to purification or judgment; the wording leaves the image open.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: I indeed baptize you in water
  simplified_phrase: I baptize you with water
  preserved_meaning: John contrasts his water baptism with the coming one's baptism.
  reasoning_layer_used: POB lexical decisions for ἐν ὕδατι and the μὲν–δέ contrast
  rationale: “With water” is a documented alternative and sounds more natural in modern English.
- pob_phrase: the one coming after me is stronger than I
  simplified_phrase: the one coming after me is more powerful than I am
  preserved_meaning: The coming one has far greater power than John.
  reasoning_layer_used: POB lexical decision for ἰσχυρότερός μού
  rationale: “More powerful” states the comparison in ordinary English.
- pob_phrase: whose sandals I am not worthy to carry
  simplified_phrase: I am not worthy to carry his sandals
  preserved_meaning: John declares himself unworthy to perform even this humble service.
  reasoning_layer_used: POB lexical decisions for ἱκανός and βαστάσαι
  rationale: A separate sentence removes the difficult relative clause without adding emphasis.
translation_notes:
  risk_flags:
  - risk: “With” replaces POB's main choice “in” for the repeated Greek preposition.
    mitigation: Footnote a preserves both warranted renderings.
  - risk: The image of fire can suggest either purification or judgment.
    mitigation: The main text remains open, and footnote b identifies both possibilities.
