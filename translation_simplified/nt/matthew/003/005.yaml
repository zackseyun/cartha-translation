- pob_phrase: Jerusalem, all Judea, and all the region around the Jordan
  simplified_phrase: people from Jerusalem, from all Judea, and from all the region around the Jordan River
  preserved_meaning: People were coming from each of the three named geographic areas.
  reasoning_layer_used: POB theological decision and geographic-group rationale
  rationale: Making “people” explicit prevents readers from taking the regions as literal travelers.
- pob_phrase: the Jordan
  simplified_phrase: the Jordan River
  preserved_meaning: The geographic reference remains the Jordan.
  reasoning_layer_used: POB lexical decision for τοῦ Ἰορδάνου
  rationale: Adding “River” identifies the place clearly for readers unfamiliar with the shortened biblical name.
- pob_phrase: were going out
  simplified_phrase: were going out
  preserved_meaning: The response unfolded as ongoing or repeated action.
  reasoning_layer_used: POB lexical decision for ἐξεπορεύετο
  rationale: The progressive wording retains the force of the Greek imperfect.
