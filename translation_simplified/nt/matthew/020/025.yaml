translation:
  language: en
  text: But Jesus called them to himself and said, “You know that the rulers of the Gentiles[a] lord it over them, and their leading men[b] exercise authority over them.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the rulers of the nations.” In this Jewish context, “Gentiles” refers to non-Jewish peoples.
    reason: lexical_alternative
  - marker: b
    text: Or “their great ones” or “their high officials.” This refers to prominent men who hold power.
    reason: lexical_alternative
