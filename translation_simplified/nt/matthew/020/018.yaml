translation:
  language: en
  text: Look[a], we are going up to Jerusalem. The Son of Man[b] will be handed over[c] to the leading priests and teachers of the law. They will condemn him to death.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Behold.” This word calls attention to what Jesus is about to say.
    reason: lexical_alternative
  - marker: b
    text: “Son of Man” is the title Jesus usually used for himself and may echo Daniel 7:13–14.
    reason: cross_reference
  - marker: c
    text: Or “will be delivered over.” The verb can mean “will be betrayed” in a narrower context, but here it broadly means being handed into hostile custody.
    reason: lexical_alternative
