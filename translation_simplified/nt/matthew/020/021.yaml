translation:
  language: en
  text: He asked her, “What do you want?” She answered, “Give[a] these two sons of mine places beside you in your kingdom[b]—one at your right and one at your left.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “Say that”; here she asks Jesus to appoint them to these places.
    reason: lexical_alternative
  - marker: b
    text: “Kingdom” can also mean reign or royal rule.
    reason: lexical_alternative
