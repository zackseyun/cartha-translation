simplification_decisions:
- pob_phrase: many mighty works
  simplified_phrase: many miracles
  preserved_meaning: These were miraculous deeds that displayed power.
  reasoning_layer_used: POB lexical decision and footnote for δυνάμεις πολλὰς
  rationale: “Miracles” is the POB-approved alternative and is clearer in modern English.
- pob_phrase: because of their unbelief
  simplified_phrase: because they did not believe
  preserved_meaning: Their rejection and lack of faith caused his non-performance there.
  reasoning_layer_used: POB lexical decision for διὰ τὴν ἀπιστίαν αὐτῶν
  rationale: The concrete verbal clause expresses the same negative force more plainly.
translation_notes:
  risk_flags:
  - risk: “Miracles” is more interpretive than the power image in the Greek noun.
    mitigation: The footnote preserves “works of power” and explains the image.
  - risk: The causal wording could be mistaken for a claim that Jesus lacked power.
    mitigation: “Did not do” preserves Matthew’s statement of non-performance rather than inability.
