simplification_decisions:
- pob_phrase: For this reason I speak to them in parables, because
  simplified_phrase: 'That is why I speak to them in parables:'
  preserved_meaning: Jesus gives the reason he speaks to them in parables.
  reasoning_layer_used: POB causal decisions for διὰ τοῦτο and ὅτι
  rationale: A direct opening and colon express the same causal relationship in natural English.
- pob_phrase: though seeing, they do not see, and though hearing, they do not hear
  simplified_phrase: though they see, they do not see; though they hear, they do not hear
  preserved_meaning: The paradox contrasts outward perception with failure to grasp its significance.
  reasoning_layer_used: POB lexical and theological decisions on the participles
  rationale: Finite clauses and a semicolon clarify the parallel contrast without adding an unsupported intensifier.
- pob_phrase: nor do they understand
