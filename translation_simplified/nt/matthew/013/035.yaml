simplification_decisions:
- pob_phrase: so that what was spoken through the prophet might be fulfilled, saying
  simplified_phrase: Jesus spoke in parables so that what was spoken through the prophet might come true
  preserved_meaning: Jesus’ parabolic teaching remains linked to the fulfillment of the prophetic words.
  reasoning_layer_used: Immediate context, POB fulfillment formula, and lexical decision for ὅπως
  rationale: Naming Jesus’ action clarifies the connection while retaining the purpose/result force of “so that.”
- pob_phrase: I will open my mouth in parables
  simplified_phrase: I will speak in parables
  preserved_meaning: The quotation still announces teaching through parables.
  reasoning_layer_used: POB lexical decisions for Ἀνοίξω, ἐν παραβολαῖς, and στόμα μου
  rationale: The common English verb makes the idiom immediately clear without losing its function.
- pob_phrase: I will utter things hidden
  simplified_phrase: I will tell things hidden
  preserved_meaning: The speaker will disclose matters that have remained hidden.
  reasoning_layer_used: POB lexical decisions for ἐρεύξομαι and κεκρυμμένα
  rationale: “Tell” replaces the less common “utter” while preserving the act of speaking hidden things.
interpretive_expansions:
- pob_phrase: so that what was spoken through the prophet might be fulfilled
  rendering: Jesus spoke in parables so that what was spoken through the prophet might come true
  claim: Jesus’ speaking in parables is the action connected to the prophecy’s fulfillment.
  evidence:
  - Matthew 13:34 identifies Jesus’ parabolic speaking as the preceding action.
  - The POB audit says ὅπως links Jesus’ use of parables to fulfillment.
  confidence: high
  alternatives_preserved:
