translation:
  language: en
  text: 'For I tell you the truth: many prophets and righteous people[a] longed to see what you see, but did not see it, and to hear what you hear, but did not hear it.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the righteous”; the Greek means righteous persons.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: For truly I say to you that
  simplified_phrase: 'For I tell you the truth:'
  preserved_meaning: Preserves the solemn assurance and its explanatory connection to the preceding statement.
  reasoning_layer_used: POB lexical decisions for ἀμὴν, γὰρ, and λέγω ὑμῖν
  rationale: The recast formula is clearer modern English without weakening its force.
- pob_phrase: longed to see what you see and did not see it, and to hear what you hear and did not hear it
  simplified_phrase: longed to see what you see, but did not see it, and to hear what you hear, but did not hear it
  preserved_meaning: Keeps the strong desire and the parallel contrast between what earlier faithful people desired and what the disciples experience.
  reasoning_layer_used: POB lexical decisions for ἐπεθύμησαν and the parallel sight and hearing clauses
  rationale: Adding “but” makes each contrast immediately clear while retaining “longed” for strong desire.
translation_notes:
  risk_flags:
  - risk: Readers may expect the objects of seeing and hearing to be identified explicitly.
    mitigation: The wording keeps them implicit because the POB theological decision preserves the verse’s own ambiguity.
