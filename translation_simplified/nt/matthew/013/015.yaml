  simplified_phrase: They barely hear with their ears
  preserved_meaning: Their hearing is impaired or difficult.
  reasoning_layer_used: POB lexical decision for βαρέως and footnote a
  rationale: “Barely hear” expresses the difficult-hearing idiom in common English.
- pob_phrase: For this people's heart has grown dull, and ...
  simplified_phrase: For this people’s heart has grown dull. They ...
  preserved_meaning: The people remain spiritually and morally unresponsive.
  reasoning_layer_used: POB translation and lexical decision for ἐπαχύνθη
  rationale: A sentence break clarifies the description without weakening the heart image.
- pob_phrase: lest they should see ... and I will heal them
  simplified_phrase: lest they see ... and I will heal them
  preserved_meaning: The judicial tension and future promise of healing remain unresolved.
  reasoning_layer_used: POB theological decision and lexical decisions for μήποτε and ἰάσομαι
  rationale: Dropping “should” modernizes the clause while retaining “lest” and “will.”
