translation:
  language: en
  text: For this people’s heart has grown dull. They barely hear with their ears,[a] and they have closed their eyes, lest they see with their eyes, hear with their ears, understand with their heart, turn back,[b] and I will heal them.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “they heard heavily,” meaning they hear with difficulty.
    reason: lexical_alternative
  - marker: b
    text: Or “turn” or “return.”
    reason: lexical_alternative
  - marker: c
    text: Quoted from Isaiah 6:9–10.
    reason: cross_reference
