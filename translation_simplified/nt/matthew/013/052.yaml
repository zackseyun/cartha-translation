translation:
  language: en
  text: Then he said to them, “So every scribe trained for the kingdom of heaven[a] is like the head of a household[b] who brings out of his treasure[c] new things and old.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “who has become a disciple of the kingdom of heaven.”
    reason: alternative_reading
  - marker: b
    text: Or “master of a house.”
    reason: lexical_alternative
  - marker: c
    text: “Treasure” may also suggest a storeroom or treasury where valued things are kept.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Therefore every scribe who has been trained
  simplified_phrase: So every scribe trained
  preserved_meaning: The conclusion still follows from Jesus’ preceding teaching, and the scribe remains formed for the kingdom.
  reasoning_layer_used: POB translation and lexical decisions for Διὰ τοῦτο and μαθητευθεὶς
  rationale: The shorter wording uses natural English without narrowing training to conversion alone.
- pob_phrase: a master of a house
  simplified_phrase: the head of a household
  preserved_meaning: The person remains the one who holds authority and responsibility within the household.
  reasoning_layer_used: POB lexical and theological decisions for οἰκοδεσπότῃ
  rationale: This replaces the less familiar household title with a clear modern equivalent.
- pob_phrase: brings out of his treasure new things and old
  simplified_phrase: brings out of his treasure new things and old
  preserved_meaning: The image retains both valued possessions and a stored reserve from which old and new things are drawn.
  reasoning_layer_used: POB lexical decisions for ἐκβάλλει, θησαυρός, and καινὰ καὶ παλαιά
  rationale: The concrete treasure image and compact old-new contrast are already clear and should remain intact.
translation_notes:
  risk_flags:
  - risk: Modern readers may understand “scribe” only as a copyist.
    mitigation: The term is retained because POB deliberately avoids narrowing the role to a teacher of the law.
  - risk: “Treasure” may be heard only as wealth rather than a stored collection.
    mitigation: Footnote c preserves the storeroom or treasury sense.
