translation:
  language: en
  text: As a result, the crowd marveled when they saw the mute speaking,[a] the crippled made well,[b] the lame walking, and the blind seeing. They glorified the God of Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the deaf speaking.” The Greek word can mean deaf or mute; “speaking” here supports “mute.”
    reason: lexical_alternative
  - marker: b
    text: Or “the maimed restored” or “the maimed whole.”
    reason: lexical_alternative
