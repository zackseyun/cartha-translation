simplification_decisions:
- pob_phrase: Honor your father and your mother
  simplified_phrase: Honor your father and mother
  preserved_meaning: The command still requires honoring both parents.
  reasoning_layer_used: POB lexical decision for τὸν πατέρα καὶ τὴν μητέρα
  rationale: Removing the repeated “your” makes the command more natural without changing its scope.
- pob_phrase: Whoever speaks evil of father or mother
  simplified_phrase: Anyone who curses their father or mother
  preserved_meaning: The wording still condemns hostile speech directed against either parent.
  reasoning_layer_used: POB lexical decision for Ὁ κακολογῶν and its documented alternatives
  rationale: “Curses” is a clearer source-warranted term, while the footnote preserves the broader wording.
- pob_phrase: must surely die
  simplified_phrase: must surely die
  preserved_meaning: The solemn legal penalty remains severe without specifying who carries it out.
  reasoning_layer_used: POB theological decision on θανάτῳ τελευτάτω
  rationale: This phrase is retained because the clearer alternative could overstate human agency.
