translation:
  language: en
  text: Leave them alone. They are blind guides for blind people. But if one blind man guides another blind man,[b] both will fall into a pit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “ditch.”
    reason: lexical_alternative
  - marker: b
    text: The singular “blind man” represents anyone in this situation; the saying does not apply only to males.
    reason: cultural_note
simplification_decisions:
- pob_phrase: blind guides of the blind
  simplified_phrase: blind guides for blind people
  preserved_meaning: The guides and those following them are both described with the same blindness metaphor.
  reasoning_layer_used: POB lexical decision for τυφλῶν and footnote a
  rationale: The permitted alternative states the relationship more naturally in modern English.
- pob_phrase: if a blind man guides a blind man
  simplified_phrase: if one blind man guides another blind man
  preserved_meaning: The masculine singular form and the general condition remain intact.
  reasoning_layer_used: POB lexical and theological decisions for τυφλὸς ... τυφλόν
  rationale: “One” and “another” make the two roles immediately clear without overriding the source-driven gender choice.
- pob_phrase: Leave them alone; they are ... But if
  simplified_phrase: Leave them alone. They are ... But if
  preserved_meaning: The command, description, and warning-like turn remain distinct.
  reasoning_layer_used: POB translation and lexical decision for δέ
  rationale: Shorter sentences improve readability while “But” preserves the marked development.
