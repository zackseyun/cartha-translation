translation:
  language: en
  text: For I too am a man under authority, with soldiers under my command. I tell one, ‘Go,’ and he goes. I tell another, ‘Come,’ and he comes. I tell my servant[a], ‘Do this,’ and he does it.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Or “slave” (Greek: doulos).'
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: having soldiers under me
  simplified_phrase: with soldiers under my command
  preserved_meaning: The centurion has soldiers subject to his delegated military authority.
  reasoning_layer_used: POB lexical decision for ἔχων ὑπ’ ἐμαυτὸν στρατιώτας
  rationale: The clearer wording preserves the military chain of command.
- pob_phrase: And I say to this one ... and to another ... and to my servant
  simplified_phrase: I tell one ... I tell another ... I tell my servant
  preserved_meaning: The centurion gives distinct orders to two soldiers and his servant.
  reasoning_layer_used: POB lexical decisions and rhetorical structure
  rationale: Separate sentences make the repeated command-and-response pattern easy to follow.
- pob_phrase: For I also am
  simplified_phrase: For I too am
  preserved_meaning: The centurion explains his confidence by comparing his authority structure with Jesus’ authority.
  reasoning_layer_used: POB lexical decision for καὶ γὰρ and grounding review
  rationale: “For” retains the link to the preceding statement, while “too” expresses the comparison naturally.
translation_notes:
  risk_flags:
  - risk: “Under my command” makes the military sense of “under me” more explicit.
    mitigation: The soldiers and the POB chain-of-command rationale directly establish this sense.
  - risk: “Servant” can understate the possible social status conveyed by doulos.
    mitigation: The footnote preserves “slave” as the lexical alternative.
