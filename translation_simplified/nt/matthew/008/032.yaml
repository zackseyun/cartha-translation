translation:
  language: en
  text: Jesus said to the demons, “Go.” So the demons came out and went into the pigs. Then look! The whole herd rushed down the steep bank into the sea and died in the waters.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And he said to them
  simplified_phrase: Jesus said to the demons
  preserved_meaning: Identifies the speaker and those he addressed without changing the command.
  reasoning_layer_used: Immediate context and POB lexical audit
  rationale: The surrounding passage identifies Jesus and the demons clearly.
- pob_phrase: Then they came out and went into the pigs
  simplified_phrase: So the demons came out and went into the pigs
  preserved_meaning: Keeps both the demons’ exit and their movement into the animals.
  reasoning_layer_used: POB lexical decisions
  rationale: Naming the demons makes the action clear without merging its two stages.
- pob_phrase: and behold
  simplified_phrase: Then look!
  preserved_meaning: Preserves the vivid call to notice what follows without adding a timing claim.
  reasoning_layer_used: POB lexical decision for ἰδού
  rationale: “Look” gives the attention marker natural force in modern English.
interpretive_expansions:
- pob_phrase: he
  rendering: Jesus
  claim: The speaker is Jesus.
  evidence:
  - The immediate narrative context identifies Jesus as the one answering the demons.
  confidence: high
- pob_phrase: them / they
  rendering: the demons
  claim: Those addressed and those entering the pigs are the demons.
  evidence:
