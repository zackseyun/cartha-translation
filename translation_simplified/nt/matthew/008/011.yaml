  text: But I tell you that many will come from the east and the west[a] and will sit down to feast[b] with Abraham, Isaac, and Jacob in the kingdom of heaven.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The phrase 'from the east and the west' points to people coming from distant lands, including non-Jewish nations.
    reason: simplification_note
  - marker: b
    text: More literally, 'recline,' referring to how people lay on couches at a formal banquet.
    reason: simplification_note
simplification_decisions:
- simplified_phrase: from the east and the west
  preserved_meaning: Adding the definite articles makes the phrase sound more natural in modern English while retaining the geographical breadth.
  reasoning_layer_used: POB audit trail
  rationale: Adding the definite articles makes the phrase sound more natural in modern English while retaining the geographical breadth.
- simplified_phrase: sit down to feast
  preserved_meaning: Modern readers do not associate 'reclining' with dining. 'Sit down to feast' preserves the banquet and table fellowship imagery of 'ἀνακλιθήσονται' in a way that is natural and clear today.
  reasoning_layer_used: POB audit trail
  rationale: Modern readers do not associate 'reclining' with dining. 'Sit down to feast' preserves the banquet and table fellowship imagery of 'ἀνακλιθήσονται' in a way that is natural and clear today.
