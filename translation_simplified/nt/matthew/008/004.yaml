translation:
  language: en
  text: And Jesus said to him, "Be sure not to tell anyone. Instead, go, show yourself to the priest, and offer the gift that Moses commanded[a], as a testimony to them[b]."
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This instruction refers to the offering Moses required for a person cleansed of an infectious skin disease (historically translated as leprosy); see Leviticus 14.
    reason: cross_reference
  - marker: b
    text: The phrase can mean evidence of healing presented to the priests, or it may serve as an implicit warning to those who refuse to believe.
    reason: alternative_reading
