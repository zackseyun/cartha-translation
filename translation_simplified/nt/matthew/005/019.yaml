translation:
  language: en
  text: Therefore, whoever sets aside[a] even one of the least of these commandments and teaches others to do the same will be called least in the kingdom of heaven. But whoever obeys and teaches them—this person will be called great in the kingdom of heaven.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'breaks' or 'weakens.' The Greek verb literally means 'loosens' and here refers to treating a commandment as nonbinding.
    reason: simplification_note
simplification_decisions:
- simplified_phrase: sets aside
  preserved_meaning: The Greek verb 'λύω' literally means 'loosens' (i.e., weakening the force of a law). 'Sets aside' is more natural to modern readers than 'relaxes' in a legal context while preserving the exact theological sense.
  reasoning_layer_used: POB audit trail
  rationale: The Greek verb 'λύω' literally means 'loosens' (i.e., weakening the force of a law). 'Sets aside' is more natural to modern readers than 'relaxes' in a legal context while preserving the exact theological sense.
- simplified_phrase: teaches others to do the same
  preserved_meaning: Syntactically smoothed to modern English idiom without changing the generic reference of the Greek 'ἀνθρώπους'.
  reasoning_layer_used: POB audit trail
  rationale: Syntactically smoothed to modern English idiom without changing the generic reference of the Greek 'ἀνθρώπους'.
- simplified_phrase: obeys
  preserved_meaning: Using 'obeys' in the context of 'commandments' is a clearer and more idiomatic rendering of 'ποιέω' (does/practices) for a modern reader.
  reasoning_layer_used: POB audit trail
  rationale: Using 'obeys' in the context of 'commandments' is a clearer and more idiomatic rendering of 'ποιέω' (does/practices) for a modern reader.
- simplified_phrase: this person
  preserved_meaning: Preserves the emphatic contrast of the Greek demonstrative pronoun 'οὗτος' (this one) in a more natural English idiom.
  reasoning_layer_used: POB audit trail
  rationale: Preserves the emphatic contrast of the Greek demonstrative pronoun 'οὗτος' (this one) in a more natural English idiom.
retained_terms:
- term: commandments
  reason: Retained to preserve POB's source-grounded terminology.
- term: kingdom of heaven
  reason: Retained to preserve POB's source-grounded terminology.
translation_notes:
  source_alignment_notes: We preserved the structural contrast between the two halves of the verse, the future passive 'will be called' (κληθήσεται), and Matthew's characteristic theological phrase 'kingdom of heaven.'
  readability_notes:
  - We split the long compound sentence into two shorter, punchier sentences to improve reading flow. We used an em-dash to offset the demonstrative pronoun 'this person' naturally.
  compression_notes:
  - No semantic elements were compressed or omitted; the full range of meaning from the POB base text is intact.
  risk_flags:
