translation:
  language: en
  text: Therefore, whoever sets aside[a] even one of the least of these commandments and teaches others to do the same will be called least in the kingdom of heaven. But whoever obeys them and teaches them—this person will be called great in the kingdom of heaven.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “breaks” or “weakens.” The Greek verb literally means “loosens” and here refers to treating a commandment as nonbinding.
    reason: simplification_note
simplification_decisions:
- pob_phrase: relaxes one of the least of these commandments
  simplified_phrase: sets aside even one of the least of these commandments
  preserved_meaning: Even a commandment ranked among the least must not be weakened or treated as nonbinding.
  reasoning_layer_used: POB lexical decision for λύσῃ and the least-commandment construction
  rationale: “Sets aside” is clearer than legal-sounding “relaxes,” while “even one” highlights the minimum case.
- pob_phrase: teaches others to do so
  simplified_phrase: teaches others to do the same
  preserved_meaning: The person teaches people to treat the commandment in the same way.
  reasoning_layer_used: POB lexical decision for διδάξῃ οὕτως τοὺς ἀνθρώπους
  rationale: “Do the same” makes the backward reference natural and keeps the generic human reference.
- pob_phrase: does them and teaches them, this one
  simplified_phrase: obeys them and teaches them—this person
  preserved_meaning: The commandments are the object of both actions, and the obedient teacher is emphatically contrasted with the first person.
  reasoning_layer_used: POB lexical decisions for ποιήσῃ καὶ διδάξῃ and οὗτος
  rationale: Repeating “them” prevents ambiguity, while “this person” preserves the emphatic contrast.
translation_notes:
  risk_flags:
  - risk: “Obeys” states compliance more directly than the broad verb “does.”
    mitigation: The understood object is the commandments, so obedience expresses the contextual action without adding a reward doctrine.
