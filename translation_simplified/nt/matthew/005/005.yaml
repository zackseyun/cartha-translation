simplification_decisions:
- pob_phrase: Blessed are the meek
  simplified_phrase: God blesses humble and gentle people
  preserved_meaning: God gives his favor to people whose strength is expressed with humility and gentleness rather than weakness.
  reasoning_layer_used: POB lexical decision for οἱ πραεῖς
  rationale: The main text replaces the commonly misunderstood word “meek” with its plain meaning and makes the divine source of the blessing explicit.
- pob_phrase: they will inherit the earth
  simplified_phrase: he will give them the earth
  preserved_meaning: God will grant the earth to these humble and gentle people.
  reasoning_layer_used: POB lexical decision for κληρονομήσουσι and theological decision on τὴν γῆν
  rationale: “Give them” explains the inheritance promise in ordinary language while keeping “the earth” and its possible land sense.
translation_notes:
  risk_flags:
  - risk: “Give them” makes the implied giver explicit.
    mitigation: The beatitude presents the blessing and promised inheritance as coming from God.
  - risk: The land/earth explanation could wrongly imply that Psalm 37:11 has two settled referents.
    mitigation: Footnote a uses “may” and “as well as” to preserve the possible scopes.
