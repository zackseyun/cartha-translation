translation:
  language: en
  text: God blesses humble and gentle people, because he will give them the earth[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the land”; this promise likely echoes Psalm 37:11 and may be understood in terms of God's promised land as well as a broader promise concerning the earth.
