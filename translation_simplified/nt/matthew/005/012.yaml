translation_notes:
  source_alignment_notes: The simplified text strictly adheres to the semantic limits of the SBLGNT. 'Rejoice and be very glad' directly maps to the present imperatives χαίρετε and ἀγαλλιᾶσθε. The shift to singular 'heaven' aligns with standard modern equivalents for οὐρανοῖς, avoiding the overly literal 'heavens' which can confuse modern readers into thinking of physical space/sky. The comparative force of οὕτως is fully preserved in the phrase 'in the same way'.
  readability_notes:
  - The dense, semi-colon-connected sentence has been split into two shorter sentences, which enhances readability for common readers. The archaic-sounding prepositional phrase 'who were before you' has been smoothed to 'who lived before you' to sound more natural without altering the meaning.
  compression_notes:
  - No theological meaning or significant textual content was compressed or omitted. The explanatory footnote regarding the plural form of 'heavens' was removed because singular 'heaven' is clear and standard in modern English, making the technical footnote unnecessary for a general audience.
