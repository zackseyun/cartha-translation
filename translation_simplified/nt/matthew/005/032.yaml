translation_notes:
  source_alignment_notes: The split into two sentences does not alter the logical flow or conditional relationships of the source Greek. The gender-specific nouns ('wife', 'her') are maintained because they reflect the real-world ancient social and legal context of the discourse where husbands initiated divorce.
  readability_notes:
  - By breaking the verse into two sentences and removing the academic phrase 'on the ground of,' the text is immediately accessible to a modern reader. It flows naturally in public reading while retaining the solemn tone of the Sermon on the Mount.
  compression_notes:
  - No semantic content was compressed out. All lexical nuances are fully accounted for, with the passive voice ambiguity of 'moicheuthēnai' successfully preserved in footnote b.
  risk_flags:
