translation:
  language: en
  text: But I tell you that anyone who divorces his wife, except for sexual immorality[a], causes her to commit adultery[b]. And anyone who marries a divorced woman commits adultery.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word (porneia) is a broad term for any sexual unfaithfulness or illicit sexual behavior.
    reason: simplification_note
  - marker: b
    text: Or, 'causes her to be seen as an adulteress' (the Greek verb is passive in form, suggesting she is stigmatized or placed in an adulterous position by the divorce).
    reason: simplification_note
