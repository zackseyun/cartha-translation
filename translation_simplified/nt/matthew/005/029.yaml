translation:
  language: en
  text: But if your right eye causes you to stumble[a], tear it out and throw it away. It is better for you to lose one part of your body than for your whole body to be thrown into Gehenna[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Or: “causes you to sin.”'
    reason: lexical_alternative
  - marker: b
    text: Gehenna is the Greek form of a name associated with the Valley of Hinnom near Jerusalem; it is traditionally translated as “hell.”
    reason: source_note
