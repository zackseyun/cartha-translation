translation:
  language: en
  text: Be friendly toward your accuser without delay[a] while you are on the way with him. Otherwise, your accuser may hand you over to the judge. The judge will then hand you over to the officer, and you will be thrown into prison.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, more idiomatically in this legal context, “Come to terms quickly with your accuser.”
    reason: lexical_alternative
