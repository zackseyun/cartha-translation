translation:
  language: en
  text: Therefore, be perfect, just as your heavenly Father is perfect.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'complete,' 'whole,' or 'mature.' The Greek word denotes wholeness and completeness in love and moral integrity, rather than absolute metaphysical equality with God.
    reason: simplification_note
simplification_decisions:
- preserved_meaning: Changed the archaic and legalistic 'You, therefore, shall be' to 'Therefore, be'. This accurately captures the imperative/exhortational force of the Greek future middle indicative in a natural modern style.
  reasoning_layer_used: POB audit trail
  rationale: Changed the archaic and legalistic 'You, therefore, shall be' to 'Therefore, be'. This accurately captures the imperative/exhortational force of the Greek future middle indicative in a natural modern style.
- preserved_meaning: Moved 'Therefore' to the beginning of the sentence to improve readability and flow from the preceding verses.
  reasoning_layer_used: POB audit trail
  rationale: Moved 'Therefore' to the beginning of the sentence to improve readability and flow from the preceding verses.
- preserved_meaning: Updated 'as' to 'just as' to strengthen and clarify the comparative connection between the disciples' behavior and God's character.
  reasoning_layer_used: POB audit trail
  rationale: Updated 'as' to 'just as' to strengthen and clarify the comparative connection between the disciples' behavior and God's character.
retained_terms:
- term: 'perfect: Retained because it carries the strong, traditional ethical force of the comparison, though a footnote is maintained to explain its biblical nuance of maturity and wholeness.'
  reason: Retained to preserve POB's source-grounded terminology.
- term: 'heavenly Father: Retained as the established and clear title for God in this context.'
  reason: Retained to preserve POB's source-grounded terminology.
translation_notes:
  source_alignment_notes: The Greek 'Ἔσεσθε' is a future indicative functioning as an imperative command. The English translation 'be' directly represents this imperatival force for modern readers, avoiding the outdated 'shall be' which can sound like a passive prediction rather than an active command.
  readability_notes:
  - By shifting the conjunction 'therefore' to the beginning of the clause, we removed the parenthetical disruption found in 'You, therefore, shall be,' making the sentence significantly easier to read aloud.
  compression_notes:
  - No words or logical connections were omitted. The plural subject 'you' is grammatically implied in the English imperative command 'be' and remains clear from context.
  risk_flags:
  - risk: The word 'perfect' can be misunderstood as demanding flawless, sinless execution in a modern psychological sense. To prevent this, the footnote explaining the semantic range (complete, whole, mature) is preserved and simplified.
    mitigation: Flag retained for reviewer attention.
