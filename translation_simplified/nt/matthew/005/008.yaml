simplification_decisions:
- pob_phrase: the pure in heart
  simplified_phrase: those whose hearts are pure
  preserved_meaning: Purity remains an inward quality of the whole person, not merely an emotion.
  reasoning_layer_used: POB lexical decision for καθαροὶ τῇ καρδίᾳ
  rationale: The possessive clause is more natural to modern readers than the nominal phrase “the pure in heart.”
- pob_phrase: Blessed
  simplified_phrase: Blessed
  preserved_meaning: The word expresses divine favor and an enviable state rather than mere happiness.
  reasoning_layer_used: POB lexical decision for μακάριοι
  rationale: Keeping this major biblical term avoids reducing the promise to an emotion.
- pob_phrase: because they will see God
  simplified_phrase: because they will see God
  preserved_meaning: The causal link and concise future promise remain unchanged and unresolved.
  reasoning_layer_used: POB lexical and theological decisions for ὅτι and ὄψονται
  rationale: The direct wording preserves the promise’s theological depth without narrowing it.
