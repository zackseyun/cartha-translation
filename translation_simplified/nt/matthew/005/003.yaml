  text: God blesses those who are poor in spirit[a], because the kingdom of heaven is theirs[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Poor in spirit” can describe people who recognize their spiritual need, are humble, or both. The Greek phrase does not specify the idea more narrowly.
