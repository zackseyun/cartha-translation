translation:
  language: en
  text: Blessed are those who are poor in spirit[a], because the kingdom of heaven is theirs[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Poor in spirit” means spiritually needy, humble, or aware of one’s need before God. The phrase is left open because the Greek is compact and rich.
    reason: simplification_note
  - marker: b
    text: 'Greek: “kingdom of the heavens,” Matthew’s usual phrase for God’s kingdom.'
    reason: simplification_note
simplification_decisions:
- pob_phrase: Blessed are the poor in spirit
  simplified_phrase: Blessed are those who are poor in spirit
  preserved_meaning: Keeps the beatitude wording and the key phrase “poor in spirit,” while making the subject clearer for ordinary readers.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: POB intentionally does not flatten the phrase into only “humble” or “spiritually needy,” so SPOB keeps the phrase and explains it in a footnote.
- pob_phrase: because the kingdom of heaven is theirs
  simplified_phrase: because the kingdom of heaven is theirs
  preserved_meaning: Keeps the reason clause and the possessive force of the Greek.
  reasoning_layer_used: POB lexical decisions
  rationale: No compression is needed; the existing clause is already readable.
retained_terms:
- term: Blessed
  reason: Retained because it carries divine favor, not merely emotion.
- term: poor in spirit
  reason: Retained because replacing it would over-resolve a phrase POB keeps open.
- term: kingdom of heaven
  reason: Retained as Matthew’s established kingdom phrase.
translation_notes:
  source_alignment_notes: 'Keeps the Greek beatitude structure: blessing first, reason second. The main interpretive tension is preserved in the phrase “poor in spirit.”'
  readability_notes:
  - Adds “those who are” so the sentence reads naturally to modern readers.
  - Moves explanatory burden into concise footnotes instead of expanding the main line.
  compression_notes:
