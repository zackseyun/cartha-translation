  preserved_meaning: Salt remains the subject of Jesus’ metaphor and may lose its taste.
  reasoning_layer_used: POB lexical decision for μωρανθῇ
  rationale: Dropping the article makes the conditional statement more natural in English.
- pob_phrase: with what will it be made salty?
  simplified_phrase: how can it be made salty again?
  preserved_meaning: The question asks how lost saltiness could be restored by some means.
  reasoning_layer_used: POB lexical decision for ἐν τίνι ἁλισθήσεται
  rationale: The idiomatic question retains the passive restoration idea while avoiding awkward syntax.
- pob_phrase: by men
  simplified_phrase: by men.[a]
  preserved_meaning: The representative masculine is retained while the note clarifies that all people are meant.
  reasoning_layer_used: POB theological decision on ὑπὸ τῶν ἀνθρώπων
