translation:
  language: en
  text: Again, you have heard that it was said to people long ago, “Do not swear falsely,[a] but keep your oaths to the Lord.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Do not break an oath”; the Greek verb can refer either to swearing falsely or to breaking an oath.
    reason: lexical_alternative
  - marker: b
    text: Or “to the LORD,” reflecting the covenantal name of God in the Old Testament Scriptures behind this saying.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: to those of old
  simplified_phrase: to people long ago
  preserved_meaning: The saying was addressed to people of an earlier generation.
  reasoning_layer_used: POB lexical decision for τοῖς ἀρχαίοις and grounding review
  rationale: This is clear without adding the unsupported idea that they were “our ancestors.”
- pob_phrase: You shall not swear falsely
  simplified_phrase: Do not swear falsely
  preserved_meaning: The wording remains a direct prohibition against false swearing.
  reasoning_layer_used: POB lexical and theological decisions for ἐπιορκέω
  rationale: A direct imperative is more natural in modern English while retaining the command’s force.
- pob_phrase: you shall fulfill your oaths
  simplified_phrase: keep your oaths
  preserved_meaning: People must carry out the obligations they have sworn to fulfill.
  reasoning_layer_used: POB lexical decision for ἀποδώσεις and τοὺς ὅρκους σου
  rationale: “Keep your oaths” expresses the pledged obligation in familiar English.
translation_notes:
  risk_flags:
  - risk: “Swear falsely” may be understood only as lying while taking an oath, though the Greek can also include breaking an oath.
    mitigation: Footnote [a] preserves the broader lexical alternative.
  - risk: “Lord” may obscure the covenantal divine name in the Old Testament background.
    mitigation: Footnote [b] preserves “the LORD” as an alternative.
