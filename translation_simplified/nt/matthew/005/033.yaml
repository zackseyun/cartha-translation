translation:
  language: en
  text: Again, you have heard that it was said to our ancestors, ‘Do not swear falsely[a], but keep your oaths to the Lord[b].’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Do not break your oath”; the Greek verb can refer to either swearing falsely or breaking an oath.
    reason: simplification_note
  - marker: b
    text: Or “to the LORD,” reflecting the covenantal name of God in the Old Testament scriptures being referenced.
    reason: simplification_note
simplification_decisions:
- preserved_meaning: Changed 'those of old' to 'our ancestors' to make the historical reference immediately understandable to modern readers.
  reasoning_layer_used: POB audit trail
  rationale: Changed 'those of old' to 'our ancestors' to make the historical reference immediately understandable to modern readers.
- preserved_meaning: Changed the archaic imperative form 'You shall not' to the direct and natural modern imperative 'Do not'.
  reasoning_layer_used: POB audit trail
  rationale: Changed the archaic imperative form 'You shall not' to the direct and natural modern imperative 'Do not'.
- preserved_meaning: Simplified 'fulfill your oaths' to 'keep your oaths' to use a more common modern idiom while fully preserving the obligation of a sworn promise.
  reasoning_layer_used: POB audit trail
  rationale: Simplified 'fulfill your oaths' to 'keep your oaths' to use a more common modern idiom while fully preserving the obligation of a sworn promise.
retained_terms:
- term: 'Lord: Kept as the default rendering for ''κύριος'' in the context of divine majesty.'
  reason: Retained to preserve POB's source-grounded terminology.
- term: 'oaths: Kept because ''oath'' is the essential biblical concept here, and substituting it with ''promises'' would weaken the specific legal and religious weight of the original term.'
  reason: Retained to preserve POB's source-grounded terminology.
translation_notes:
  source_alignment_notes: The Greek 'ἠκούσατε ὅτι ἐρρέθη' is rendered as 'you have heard that it was said,' preserving the exact grammatical construction of the POB while maintaining a smooth narrative flow.
  readability_notes:
  - The sentence structure is simplified by using direct commands ('Do not...' and 'keep...') instead of the formal future-indicative-as-imperative ('You shall not...' and 'you shall fulfill'). This significantly improves readability for a modern audience without losing the authoritative tone.
  compression_notes:
  - No significant meaning was compressed. 'Those of old' was rendered as 'our ancestors,' which preserves the temporal and historical scope of the original dative plural 'τοῖς ἀρχαίοις' in a single, common English word.
  risk_flags:
  - risk: There is a slight risk that 'our ancestors' could be read as referring strictly to the Jewish ancestors of the speaker's audience, but this accurately reflects the historical context of the Sermon on the Mount and is the standard way 'τοῖς ἀρχαίοις' is rendered in modern historical-critical translations.
    mitigation: Flag retained for reviewer attention.
