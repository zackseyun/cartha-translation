translation:
  language: en
  text: But I tell you that anyone who is angry with his brother[a] will be subject to judgment. Whoever says to his brother, ‘Raca,’[b] will be subject to the council[c]. And whoever says, ‘Fool,’ will be subject to the fire of Gehenna[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some ancient manuscripts add 'without cause.' 'Brother' is used representatively to refer to any fellow believer or neighbor.
    reason: simplification_note
  - marker: b
    text: '''Raca'' is an Aramaic insult meaning ''empty-headed'' or ''good-for-nothing.'''
    reason: simplification_note
  - marker: c
    text: Or 'the Sanhedrin,' the Jewish ruling council.
    reason: simplification_note
  - marker: d
    text: Or 'hell'; 'Gehenna' refers to the Valley of Hinnom near Jerusalem, which Jesus used to picture fiery judgment.
    reason: simplification_note
