translation:
  language: en
  text: But I tell you that anyone who is angry with his brother[a][b] will be subject to judgment. Whoever says to his brother, “Raca,”[c] will be subject to the council[d]. And whoever says, “Fool,” will be subject to the Gehenna of fire.[e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some ancient manuscripts add “without cause.” The earliest and best-supported reading leaves it out.
    reason: textual_variant
  - marker: b
    text: “Brother” is used representatively here, so the warning is not limited to male siblings.
    reason: lexical_alternative
  - marker: c
    text: “Raca” is an Aramaic insult meaning roughly “empty-headed” or “good-for-nothing.”
    reason: cultural_note
  - marker: d
    text: Or “the Sanhedrin,” the Jewish ruling council.
    reason: alternative_reading
  - marker: e
    text: Or “hell of fire.” “Gehenna” is the term Jesus used, drawing on the Valley of Hinnom as imagery associated with judgment.
    reason: alternative_reading
