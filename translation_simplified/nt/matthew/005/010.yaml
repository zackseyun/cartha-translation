  - Converting 'theirs is' to 'belongs to them' makes the promise sound direct and clear without losing the declarative authority of the beatitude.
  compression_notes:
  - Slightly compressed the verbal aspect from a strict perfect passive ('have been persecuted') to a general passive state ('are persecuted') to make the text flow better in English.
