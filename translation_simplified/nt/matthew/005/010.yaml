  source_alignment_notes: Preserved the key theological term 'righteousness' (dikaiosyne) as the main text rendering while retaining 'justice' as a footnoted alternative, adhering to POB doctrine guidelines. Kept 'kingdom of heaven' intact to honor Matthew's distinct style.
