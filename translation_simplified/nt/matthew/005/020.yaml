translation:
  language: en
  text: I tell you that unless your righteousness[a] is greater than that of the scribes and Pharisees, you will certainly not enter the kingdom of heaven.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'justice.' The Greek word can mean both, but here it refers to living in a way that is right before God.
    reason: simplification_note
simplification_decisions:
- preserved_meaning: Removed the introductory 'For' to allow a more direct and natural start to the sentence in modern English, while retaining the personal authority of the declaration.
  reasoning_layer_used: POB audit trail
  rationale: Removed the introductory 'For' to allow a more direct and natural start to the sentence in modern English, while retaining the personal authority of the declaration.
- preserved_meaning: Changed 'exceeds' to 'is greater than' to make the comparative moral standard immediately clear to common readers.
  reasoning_layer_used: POB audit trail
  rationale: Changed 'exceeds' to 'is greater than' to make the comparative moral standard immediately clear to common readers.
retained_terms:
- term: righteousness
  reason: Preserved to match the default theological mapping of 'δικαιοσύνη' in Matthew, highlighting covenantal living rather than mere legal justice.
- term: scribes
  reason: Preserved to respect POB's decision against the narrower 'teachers of the law,' keeping standard historical terminology.
- term: Pharisees
  reason: Preserved as the standard proper noun for this religious group.
- term: kingdom of heaven
  reason: Preserved as Matthew's distinct and key theological phrase.
translation_notes:
  source_alignment_notes: The strong negative condition 'unless' (ἐὰν μὴ) and the emphatic future negation 'will certainly not enter' (οὐ μὴ εἰσέλθητε) are fully maintained to preserve the semantic force of the Greek text.
  readability_notes:
  - The comparison is simplified by using the common phrase 'is greater than' instead of the slightly more formal 'exceeds,' making the text flow better when read aloud.
  compression_notes:
  - No theological content or key words were compressed or omitted; the sentence structure remains parallel to the original Greek but flows more naturally.
  risk_flags:
  - risk: The retention of historical groups ('scribes and Pharisees') requires readers to have some basic biblical literacy, but modernizing them would violate POB's lexical decisions.
    mitigation: Flag retained for reviewer attention.
