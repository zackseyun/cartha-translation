simplification_decisions:
- pob_phrase: before men
  simplified_phrase: before people
  preserved_meaning: The audience is human beings generally, not males only.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: “People” directly communicates the documented generic sense to modern readers.
- pob_phrase: your good works
  simplified_phrase: your good deeds
  preserved_meaning: The visible actions remain morally good and belong to Jesus’ disciples.
  reasoning_layer_used: POB lexical decision
  rationale: “Good deeds” is clearer in common English while preserving the distinct actions.
- pob_phrase: glorify your Father
  simplified_phrase: give glory to your Father
  preserved_meaning: People respond to the disciples’ deeds by directing glory to God their Father.
  reasoning_layer_used: POB lexical decision
  rationale: “Give glory to” makes the God-directed response immediately understandable.
