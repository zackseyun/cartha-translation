translation:
  language: en
  text: In the same way, let your light shine before people, so that they may see your good deeds and give glory to your Father who is in the heavens.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “who is in heaven.” The Greek text uses the plural form, “in the heavens.”
