- preserved_meaning: Simplified 'say' to 'tell' for a more natural, direct, and contemporary spoken style in modern English, while preserving the contrastive 'But' and the direct address.
  reasoning_layer_used: POB audit trail
  rationale: Simplified 'say' to 'tell' for a more natural, direct, and contemporary spoken style in modern English, while preserving the contrastive 'But' and the direct address.
- preserved_meaning: The POB's 'in order to desire her' is grammatically precise to the Greek purpose construction (πρὸς τὸ), but is stylistically clunky in modern English. We simplified this to 'to desire her' to restore natural English flow while keeping the core meaning, and moved the strict purpose nuance and alternative 'lust' rendering to a footnote.
  reasoning_layer_used: POB audit trail
