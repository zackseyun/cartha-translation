  rationale: “Take oaths” prevents modern readers from mistaking “swear” for profanity.
- pob_phrase: neither by heaven
  simplified_phrase: Do not swear by heaven
  preserved_meaning: The specific prohibition against invoking heaven in an oath remains distinct.
  reasoning_layer_used: POB text and source clause structure
  rationale: A complete imperative makes the connection to the command clear.
- pob_phrase: because it is the throne of God
  simplified_phrase: because it is God’s throne
  preserved_meaning: Heaven remains identified as the throne belonging to God.
  reasoning_layer_used: POB text and applied revision
  rationale: The possessive form is more natural without changing the POB’s chosen explanation.
