translation:
  language: en
  text: 'For I tell you the truth: until heaven and earth pass away, not even the smallest letter[a] or the tiniest stroke of a letter[b] will ever pass away from the law until everything happens.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek specifically says “one iota,” the smallest letter of the Greek alphabet.
    reason: source_note
  - marker: b
    text: The Greek describes a tiny written mark that distinguishes one letter from another.
    reason: simplification_note
  - marker: c
    text: Or “until everything is accomplished” or “until everything comes to pass.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: For truly I say to you
