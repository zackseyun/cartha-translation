  preserved_meaning: This keeps both the link to the preceding statement and Jesus’ solemn authority.
  reasoning_layer_used: POB lexical decisions for γάρ and ἀμὴν λέγω ὑμῖν
  rationale: The revised wording is natural English while restoring the explanatory connective “For.”
- pob_phrase: not one iota or one stroke
  simplified_phrase: not even the smallest letter or the tiniest stroke of a letter
  preserved_meaning: The image still emphasizes that no written detail of the law will disappear.
  reasoning_layer_used: POB lexical decisions for ἰῶτα and κεραία
  rationale: The main text now explains unfamiliar writing terms immediately while footnotes preserve the Greek specificity.
- pob_phrase: until all things happen
  simplified_phrase: until everything happens
  preserved_meaning: The wording remains broad and does not choose between occurrence and accomplishment.
  reasoning_layer_used: POB lexical and theological decisions for πάντα γένηται
  rationale: “Everything” is smoother common English without narrowing the phrase’s meaning.
