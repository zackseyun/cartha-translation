translation_notes:
  source_alignment_notes: We carefully preserved the double cognate wordplay of the Greek (krima/krinete/krithesesthe and metra/metreite/metrethesetai) by keeping the repetitive elements of 'judge/judged' and 'measure/measure'. We also preserved the theological passive voice ('will be judged' and 'will be used to measure you') to retain POB's commitment to theological openness (leaving the agent of judgment unnamed, as in the Greek).
  readability_notes:
  - The complex relative clauses ('by which you...', 'with the...') were streamlined into simple, direct conditional/manner clauses. The archaic and awkward phrasing 'it will be measured to you' was updated to a more natural passive 'will be used to measure you' without losing the metaphor of the scale or measuring container.
  compression_notes:
  - No theological, historical, or lexical content was omitted. The compression is purely syntactic, replacing archaic structural idioms with modern equivalents.
  risk_flags:
  - risk: The primary risk was losing the 'divine passive' of the Greek verbs by changing them to active verbs (e.g., 'God will judge you' or 'others will measure you'). This risk was successfully mitigated by retaining passive phrasing in both clauses.
    mitigation: Flag retained for reviewer attention.
