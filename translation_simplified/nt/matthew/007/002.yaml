translation:
  language: en
  text: For the way you judge is how you will be judged, and the measure you use will be used to measure you.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'it will be measured back to you.' The Greek verb implies a reciprocal action, although 'back' is not explicitly written.
    reason: simplification_note
