translation:
  language: en
  text: For the way you judge is how you will be judged, and the measure you use will be used to measure you.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “it will be measured back to you.” The Greek does not explicitly say “back,” though the reciprocal sense is implied.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: with the judgment by which you judge, you will be judged
  simplified_phrase: the way you judge is how you will be judged
  preserved_meaning: The judgment applied to others will also govern how the hearers are judged.
  reasoning_layer_used: POB lexical decisions and theological decision
  rationale: The recast keeps judge/judged and leaves the judging agent unstated.
- pob_phrase: with the measure by which you measure, it will be measured to you
  simplified_phrase: the measure you use will be used to measure you
  preserved_meaning: The same measure used toward others will be applied to the hearers.
  reasoning_layer_used: POB lexical rationale for μέτρον and μετρεῖτε
  rationale: Natural passive wording preserves the measuring image and reciprocal parallel.
translation_notes:
  risk_flags:
  - risk: The smoother wording could imply a specific judge or agent.
    mitigation: Both clauses remain passive, preserving the source’s unstated agent.
  - risk: Readers may understand reciprocity as requiring the word “back” in Greek.
    mitigation: The footnote states that reciprocity is implied but “back” is not explicit.
