- pob_phrase: as one having authority
  simplified_phrase: as one who had authority
  preserved_meaning: Jesus taught with real authority without specifying its theological source.
  reasoning_layer_used: POB lexical and theological decisions for ὡς ἐξουσίαν ἔχων
  rationale: A finite relative clause replaces the awkward participle without reducing authority to confidence.
- pob_phrase: and not as their scribes
  simplified_phrase: and not like their scribes
  preserved_meaning: Jesus’ manner of teaching is contrasted with that of the listeners’ recognized scribes.
  reasoning_layer_used: POB lexical decisions for καὶ οὐχ ὡς and οἱ γραμματεῖς αὐτῶν
  rationale: “Not like” makes the comparison natural while retaining the historical title and “their.”
