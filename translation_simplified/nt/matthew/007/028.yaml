simplification_decisions:
- preserved_meaning: The narrative transition 'And it happened that' is a literal rendering of a Semitic-Greek idiom (Καὶ ἐγένετο) which sounds awkward and redundant in modern English when paired with 'when'. Streamlining this to 'When' dramatically improves readability without losing the temporal connection.
