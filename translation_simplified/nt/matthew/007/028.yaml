  rationale: The narrative transition 'And it happened that' is a literal rendering of a Semitic-Greek idiom (Καὶ ἐγένετο) which sounds awkward and redundant in modern English when paired with 'when'. Streamlining this to 'When' dramatically improves readability without losing the temporal connection.
- preserved_meaning: Adding 'speaking' idiomatizes the phrase 'finished these words' for modern readers, who naturally expect an action verb when referring to completing a discourse.
