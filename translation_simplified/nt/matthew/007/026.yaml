translation:
  language: en
  text: And everyone who hears these words of mine but does not do what they say will be like a foolish man[a] who built his house on the sand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a foolish person.” The Greek says “a foolish man,” using a man to represent anyone in this comparison.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: and does not do them
  simplified_phrase: but does not do what they say
  preserved_meaning: The hearer fails to carry out Jesus’ words.
  reasoning_layer_used: POB lexical decision and Matthew 7:24 parallel
  rationale: This removes an unclear pronoun while preserving the sense of failing to obey the words.
- pob_phrase: and does not
  simplified_phrase: but does not
  preserved_meaning: Hearing is contrasted with failing to act.
  reasoning_layer_used: Immediate discourse contrast
  rationale: “But” makes the verse’s central contrast easier to follow.
- pob_phrase: a foolish man
  simplified_phrase: a foolish man[a]
  preserved_meaning: The masculine figure represents everyone who hears but does not act.
  reasoning_layer_used: POB theological decision on representative language
  rationale: The main text retains the source-driven masculine wording while the footnote explains its general application.
interpretive_expansions:
- pob_phrase: does not do them
  rendering: does not do what they say
  claim: Doing the words means carrying out what they say.
  evidence:
  - The POB lexical rationale defines ποιέω here as doing or carrying out what is heard.
  - Matthew 7:24 uses the same hearing-and-doing contrast.
  confidence: high
  alternatives_preserved:
  - does not act on them
  - does not practice them
translation_notes:
  risk_flags:
  - risk: “Man” may sound as though the warning applies only to males.
    mitigation: The footnote explains that the masculine comparison represents anyone.
