translation:
  language: en
  text: You hypocrite! First take the beam[a] out of your own eye, and then you will see clearly to take the speck[b] out of your brother’s eye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word for 'beam' (dokos) refers to a large structural timber, log, or plank.
    reason: simplification_note
  - marker: b
    text: The Greek word for 'speck' (karphos) refers to a tiny dry particle, such as a splinter, piece of dust, or bit of straw.
    reason: simplification_note
