translation:
  language: en
  text: Jesus turned, saw her, and said, “Take courage, daughter! Your faith has saved you.”[a] And from that very moment, the woman was healed.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'has made you well.' The Greek verb can mean to save, heal, or make well; Jesus' words carry both physical and spiritual meaning.
    reason: simplification_note
