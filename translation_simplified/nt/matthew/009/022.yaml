translation_notes:
  source_alignment_notes: Maintains alignment with the SBLGNT participles (στραφεὶς καὶ ἰδὼν) by translating them as sequential actions ('turned, saw') which flows better in modern English. Preserves the double translation of σῴζω ('saved' in direct speech, 'healed' in narrative) to align with POB's theological handling of the Greek text.
  readability_notes:
  - Replaced the formal participial phrase 'turning and seeing her, said' with active past-tense verbs 'turned, saw... and said'. Replaced the archaic temporal idiom 'from that hour' with 'from that very moment' to clearly communicate instantaneous healing to contemporary readers.
  compression_notes:
  - Syntactic compression was applied to the sentence structure for improved readability, but no lexical elements or semantic details were omitted.
  risk_flags:
