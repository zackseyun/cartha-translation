  reasoning_layer_used: POB lexical decision for ἰδοὺ
  rationale: The archaic attention marker is omitted for smooth modern English.
- pob_phrase: came and were reclining at table with Jesus and his disciples
  simplified_phrase: came and joined Jesus and his disciples at the table
  preserved_meaning: The tax collectors and sinners joined Jesus and his disciples in shared table fellowship.
  reasoning_layer_used: POB lexical and theological decisions for συνανέκειντο and meal fellowship
  rationale: “Joined ... at the table” clearly conveys a shared meal without the awkward phrase “reclined with.”
