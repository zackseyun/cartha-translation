translation:
  language: en
  text: But so that you may know that the Son of Man[a] has authority on earth to forgive sins”—then he said to the paralyzed man, “Get up, pick up your mat, and go home.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The title 'Son of Man' is Jesus' primary self-designation, pointing back to a heavenly figure in Daniel 7:13-14 who is given divine authority.
    reason: simplification_note
simplification_decisions:
- simplified_phrase: then he said to the paralyzed man
  preserved_meaning: Changed the historical present 'says' to the standard English past tense 'said' for natural narrative flow. Replaced the clinical and slightly archaic 'paralytic' with 'paralyzed man' to make it clearer for modern readers.
  reasoning_layer_used: POB audit trail
  rationale: Changed the historical present 'says' to the standard English past tense 'said' for natural narrative flow. Replaced the clinical and slightly archaic 'paralytic' with 'paralyzed man' to make it clearer for modern readers.
- simplified_phrase: mat
  preserved_meaning: The Greek word 'kline' here refers to a portable sleeping pallet or mat. Using 'mat' prevents modern readers from imagining a large, heavy wooden bed frame, making the command to 'pick it up' realistic.
  reasoning_layer_used: POB audit trail
  rationale: The Greek word 'kline' here refers to a portable sleeping pallet or mat. Using 'mat' prevents modern readers from imagining a large, heavy wooden bed frame, making the command to 'pick it up' realistic.
- simplified_phrase: go home
