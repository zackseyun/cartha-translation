translation:
  language: en
  text: “But so that you may know that the Son of Man[a] has authority on earth to forgive sins—” then he said to the paralyzed man, “Get up, pick up your mat, and go home.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Son of Man” is a title Jesus used for himself. It may echo Daniel 7:13–14, where one like a son of man is given authority.
    reason: simplification_note
simplification_decisions:
- pob_phrase: then he says to the paralytic
  simplified_phrase: then he said to the paralyzed man
  preserved_meaning: Jesus turns to the person who cannot walk and addresses him directly.
  reasoning_layer_used: POB lexical decisions for λέγει and παραλυτικῷ
  rationale: The past tense fits natural English narration, and “paralyzed man” is clearer than “paralytic.”
- pob_phrase: pick up your bed
  simplified_phrase: pick up your mat
  preserved_meaning: Jesus commands him to lift and carry his sleeping place.
  reasoning_layer_used: POB lexical decision for κλίνη and footnote b
  rationale: “Mat” is an allowed contextual sense and avoids suggesting a large modern bed.
- pob_phrase: go to your house
  simplified_phrase: go home
  preserved_meaning: Jesus commands him to return to his own residence.
  reasoning_layer_used: POB lexical decision for εἰς τὸν οἶκόν σου
  rationale: “Go home” expresses the same command in ordinary English.
