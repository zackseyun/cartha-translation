translation:
  language: en
  text: Then a woman who had been bleeding for twelve years came up behind him and touched the fringe[a] of his clothing.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “tassel” or “hem.” The Greek word can refer to the fringe, border, or edge of a garment, possibly including the tassel-like border associated with Jewish dress. See Numbers 15:38 and Deuteronomy 22:12.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And behold
  simplified_phrase: Then
  preserved_meaning: Introduces the woman’s arrival as the next notable event in the narrative.
  reasoning_layer_used: POB lexical decision for Καὶ ἰδού
  rationale: “Then” gives a natural transition without adding the stronger timing implied by “Just then.”
- pob_phrase: who had been suffering from bleeding
  simplified_phrase: who had been bleeding
  preserved_meaning: She had an ongoing bleeding condition for twelve years.
  reasoning_layer_used: POB lexical decision for αἱμορροοῦσα
  rationale: The shorter wording states the chronic condition directly and avoids suggesting a more acute hemorrhage.
- pob_phrase: the fringe of his garment
  simplified_phrase: the fringe of his clothing
  preserved_meaning: She touched the fringe or border area of Jesus’ outer garment.
  reasoning_layer_used: POB lexical and theological decisions for κράσπεδον and ἱμάτιον
  rationale: “Clothing” is more familiar than “garment,” while the note preserves the ambiguous fringe, tassel, or hem senses.
translation_notes:
  risk_flags:
  - risk: “Then” conveys less of the vivid attention-directing force of “behold.”
    mitigation: It preserves a marked narrative transition without introducing the unsupported temporal force of “Just then.”
  - risk: “Clothing” is broader than the outer garment indicated by the context.
    mitigation: The wording remains accurate, and the footnote identifies the relevant garment edge.
