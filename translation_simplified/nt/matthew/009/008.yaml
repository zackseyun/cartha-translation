translation:
  language: en
  text: But when the crowds saw this, they were afraid[a]. They glorified God, who had given people authority like this.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “were filled with awe.” The Greek word more literally means “were afraid,” though the fear may include reverent amazement.
