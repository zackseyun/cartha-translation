simplification_decisions:
- pob_phrase: they were afraid and glorified God
  simplified_phrase: they were afraid. They glorified God
  preserved_meaning: The crowds responded with both fear and glorification of God.
  reasoning_layer_used: POB translation and lexical decisions
  rationale: Two sentences make the two reactions easier to follow without merging them.
- pob_phrase: such authority
  simplified_phrase: authority like this
  preserved_meaning: God had granted the kind of authority the crowds had just witnessed.
  reasoning_layer_used: POB lexical decision for τοιαύτην
  rationale: “Authority like this” is more natural in common English than “such authority.”
- pob_phrase: to men
  simplified_phrase: to people
  preserved_meaning: The Greek plural can represent human beings generally while retaining the striking claim that God gave this authority to humans.
  reasoning_layer_used: POB lexical alternatives and grounding review
  rationale: “People” avoids a likely male-only misunderstanding for modern readers.
translation_notes:
  risk_flags:
