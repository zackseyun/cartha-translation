translation:
  language: en
  text: After the crowd had been sent outside, he went in. He took the girl by the hand, and she rose.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “the girl was raised.” The Greek verb can be translated either way.
