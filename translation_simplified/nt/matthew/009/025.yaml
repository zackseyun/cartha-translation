simplification_decisions:
- pob_phrase: But when the crowd had been put outside
  simplified_phrase: After the crowd had been sent outside
  preserved_meaning: The crowd was removed before he entered.
  reasoning_layer_used: Lexical decision for ἐξεβλήθη and narrative sequence
  rationale: “Sent outside” is clearer than “put outside” while keeping the passive removal and avoiding excessive force.
- pob_phrase: he went in and took her by the hand
  simplified_phrase: he went in. He took the girl by the hand
  preserved_meaning: He entered and then took hold of her hand.
  reasoning_layer_used: Lexical decisions for εἰσελθών and ἐκράτησεν τῆς χειρὸς αὐτῆς
  rationale: Two short sentences make the sequence easier to follow, and “the girl” makes the pronoun clear.
- pob_phrase: the girl rose
  simplified_phrase: she rose
  preserved_meaning: The girl rose without the translation specifying agency more strongly than the Greek does.
  reasoning_layer_used: Theological decision for ἠγέρθη
  rationale: “She rose” avoids repetition while preserving the POB reading and its theological restraint.
translation_notes:
  risk_flags:
  - risk: “Sent outside” may suggest a specific verbal order not stated explicitly.
    mitigation: The passive removal remains central, and the wording avoids the stronger force of “driven out.”
  - risk: “Rose” can also be translated “was raised.”
    mitigation: The footnote preserves the documented grammatical and theological ambiguity.
