translation:
  language: en
  text: When Jesus enters the house, the blind men come to him. Jesus asks them, “Do you believe I can do this?” They answer, “Yes, Lord.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Yes, sir.” The word can be a respectful form of address while also allowing recognition of Jesus’ authority.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: When he entered the house, the blind men approached him
  simplified_phrase: When Jesus enters the house, the blind men come to him.
  preserved_meaning: Jesus enters the house, and the two blind men approach him there.
  reasoning_layer_used: Lexical decisions for ἐλθόντι, οἰκία, and προσῆλθον, with immediate context identifying Jesus.
  rationale: Naming Jesus removes an unclear pronoun, while two direct clauses make the action easier to follow.
- pob_phrase: Jesus said to them
  simplified_phrase: Jesus asks them
  preserved_meaning: Jesus directly addresses the men with a question.
  reasoning_layer_used: Source question Πιστεύετε and the decision to preserve Matthew’s historical-present style.
  rationale: “Asks” naturally introduces the following question and keeps the vivid present tense.
- pob_phrase: Do you believe that I am able to do this? They said to him
  simplified_phrase: Do you believe I can do this? They answer
  preserved_meaning: Jesus asks whether they trust his ability, and they reply affirmatively.
  reasoning_layer_used: Lexical decisions for πιστεύω, δύναμαι, and λέγουσιν.
  rationale: “Can” and “answer” express the same ideas in shorter, ordinary English.
translation_notes:
  risk_flags:
  - risk: “Lord” may sound like a full confession of Jesus’ divine identity rather than respectful address.
    mitigation: The footnote preserves “sir” as a possible reading without removing the text’s recognition of Jesus’ authority.
