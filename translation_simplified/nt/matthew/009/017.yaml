  reasoning_layer_used: POB lexical decision for οὐδέ and immediate context
  rationale: “People” makes the generic subject clear, while “Nor” preserves the connective force.
- pob_phrase: Otherwise
  simplified_phrase: If they do
  preserved_meaning: Using old wineskins leads to the stated consequences.
  reasoning_layer_used: POB lexical decision for εἰ δὲ μή γε
  rationale: The explicit conditional is easier to follow in common English.
- pob_phrase: Rather ... the wine is spilled
  simplified_phrase: Instead ... the wine spills out
  preserved_meaning: The corrective contrast and the loss of wine remain clear.
  reasoning_layer_used: POB lexical decisions for ἀλλά and ἐκχεῖται
  rationale: Common wording and active syntax make the contrast and result more direct.
translation_notes:
  risk_flags:
  - risk: Readers may treat “fresh” as referring only to age rather than usable condition.
    mitigation: Footnote a explains the Greek distinction between newly made wine and wineskins fresh in condition.
