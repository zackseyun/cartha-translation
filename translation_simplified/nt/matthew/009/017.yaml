translation:
  language: en
  text: Nor do people put new wine into old wineskins. If they do, the wineskins burst, the wine spills out, and the wineskins are ruined. Instead, they put new wine into fresh[a] wineskins, and both are preserved.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Greek uses two different words for “new”: one refers to wine that is newly made, and the other to wineskins that are fresh in condition.'
    reason: simplification_note
