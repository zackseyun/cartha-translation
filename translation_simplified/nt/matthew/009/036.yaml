  preserved_meaning: Jesus responded to the crowds with profound mercy and pity.
  reasoning_layer_used: POB lexical and theological decisions on compassion language
  rationale: The clearer emotional wording retains the depth of Jesus’ compassion.
- pob_phrase: they were harassed and cast down
  simplified_phrase: they were mistreated and beaten down
  preserved_meaning: The crowds had been badly treated, worn down, and brought low.
  reasoning_layer_used: POB lexical decisions for ἐσκυλμένοι and ἐρριμμένοι
  rationale: “Beaten down” preserves the thrown-down image in familiar English.
- pob_phrase: because they were ... like sheep without a shepherd
  simplified_phrase: because they were ... like sheep without a shepherd
  preserved_meaning: Their afflicted and leaderless condition explicitly explains Jesus’ compassion.
