translation:
  language: en
  text: Jesus answered them, “Truly I tell you, if you have faith and do not doubt, you will not only do what was done to the fig tree, but even if you say to this mountain, ‘Be lifted up and thrown into the sea,’ it will happen.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Truly I say to you
  simplified_phrase: Truly I tell you
  preserved_meaning: Preserves the solemn authority of Jesus’ declaration in natural modern English.
  reasoning_layer_used: POB lexical decision for Ἀμὴν λέγω ὑμῖν
  rationale: “Tell you” is a clear approved alternative that keeps the formula’s emphatic force.
- pob_phrase: Be taken up and thrown into the sea
  simplified_phrase: Be lifted up and thrown into the sea
  preserved_meaning: Keeps the vivid image of the mountain being raised and thrown into the sea.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: “Lifted up” clarifies the physical image without making it solely literal or metaphorical.
- pob_phrase: if you have faith and do not doubt, you will not only ... but even if
  simplified_phrase: if you have faith and do not doubt, you will not only ... but even if
  preserved_meaning: Keeps both examples under the condition of faith without doubt and preserves their escalation.
  reasoning_layer_used: POB lexical decisions and grounding review
  rationale: The joined construction prevents the mountain promise from becoming detached from its condition.
