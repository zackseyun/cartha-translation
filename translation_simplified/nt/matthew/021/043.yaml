simplification_decisions:
- pob_phrase: a nation producing its fruits
  simplified_phrase: a nation that produces the kingdom’s fruits
  preserved_meaning: Keeps the corporate recipient and fruitfulness image while making the kingdom the clear source of the fruits.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The relative clause reads naturally, and repeating “the kingdom” prevents “its” from seeming to refer to the nation.
interpretive_expansions:
- pob_phrase: its fruits
  rendering: the kingdom’s fruits
  claim: The fruits belong to the kingdom of God, not to the nation.
  evidence:
  - The Greek feminine pronoun most naturally refers to the feminine noun translated “kingdom,” not the neuter noun translated “nation.”
  - The POB lexical rationale identifies the kingdom as the pronoun’s most natural referent.
  confidence: high
translation_notes:
  risk_flags:
  - risk: “A nation” may be taken as identifying a specific ethnic or ecclesial group.
    mitigation: The main text retains POB’s generic wording, and the footnote preserves “a people” as an alternative.
