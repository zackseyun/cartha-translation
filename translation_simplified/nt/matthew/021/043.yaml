translation:
  language: en
  text: Therefore I tell you, the kingdom of God will be taken away from you and given to a nation that produces the kingdom’s fruits.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a people.” The Greek refers to a corporate group without identifying it more narrowly.
