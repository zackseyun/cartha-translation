  preserved_meaning: The em dash highlights the angels’ arrival without adding a claim that it happened suddenly.
  reasoning_layer_used: POB lexical decision for ἰδοὺ and grounding review
  rationale: Modern punctuation preserves the vivid turn while avoiding the archaic “behold.”
- pob_phrase: were ministering to him
  simplified_phrase: cared for him
  preserved_meaning: The angels provided ongoing care and service to Jesus.
  reasoning_layer_used: POB lexical decision and footnote for διηκόνουν
  rationale: “Cared for” is clearer than the church-associated term “ministering,” while the footnote preserves the service sense and ongoing aspect.
