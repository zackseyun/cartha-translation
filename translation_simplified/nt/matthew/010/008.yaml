translation:
  language: en
  text: Heal the sick, raise the dead, cleanse those with skin diseases,[a] drive out demons. You received without paying; give without paying.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally rendered 'lepers.' The Greek term refers more broadly to serious skin diseases in biblical times than to modern leprosy (Hansen’s disease) alone.
    reason: simplification_note
simplification_decisions:
- simplified_phrase: cleanse those with skin diseases
  preserved_meaning: The word 'lepers' can be misleading to modern readers who associate it exclusively with Hansen's disease. Using 'those with skin diseases' is historically more accurate to the broader category of biblical leprosy while maintaining the verb 'cleanse' (καθαρίζετε) to preserve the physical and ritual purification aspect.
  reasoning_layer_used: POB audit trail
  rationale: The word 'lepers' can be misleading to modern readers who associate it exclusively with Hansen's disease. Using 'those with skin diseases' is historically more accurate to the broader category of biblical leprosy while maintaining the verb 'cleanse' (καθαρίζετε) to preserve the physical and ritual purification aspect.
- simplified_phrase: drive out demons
  preserved_meaning: '''Drive out'' is a more natural, modern English equivalent for ἐκβάλλετε in contemporary speech than the archaic ''cast out,'' while fully retaining the force of spiritual expulsion.'
  reasoning_layer_used: POB audit trail
  rationale: '''Drive out'' is a more natural, modern English equivalent for ἐκβάλλετε in contemporary speech than the archaic ''cast out,'' while fully retaining the force of spiritual expulsion.'
- simplified_phrase: You received without paying; give without paying
  preserved_meaning: In modern English, 'freely' often means 'willingly' or 'generously' rather than 'gratis.' Replacing it with 'without paying' accurately conveys the meaning of δωρεὰν (without cost) and maintains the parallel rhetorical contrast of the original Greek.
  reasoning_layer_used: POB audit trail
  rationale: In modern English, 'freely' often means 'willingly' or 'generously' rather than 'gratis.' Replacing it with 'without paying' accurately conveys the meaning of δωρεὰν (without cost) and maintains the parallel rhetorical contrast of the original Greek.
