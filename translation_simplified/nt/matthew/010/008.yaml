translation:
  language: en
  text: Heal the sick, raise the dead, cleanse those with serious skin diseases,[a] and drive out demons. You received without charge; give without charge.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally rendered “lepers.” The biblical term can refer to serious skin diseases more broadly than modern leprosy (Hansen’s disease) alone.
    reason: cultural_note
simplification_decisions:
- pob_phrase: cleanse lepers
  simplified_phrase: cleanse those with serious skin diseases
  preserved_meaning: This retains both the broader biblical disease category and the physical and ritual force of “cleanse.”
  reasoning_layer_used: POB lexical decision and cultural footnote
  rationale: “Serious” prevents the phrase from suggesting every minor skin condition.
- pob_phrase: cast out demons
  simplified_phrase: drive out demons
  preserved_meaning: The demons are forcibly expelled.
  reasoning_layer_used: POB lexical decision
  rationale: “Drive out” expresses the same force in more natural modern English.
- pob_phrase: Freely you received; freely give
  simplified_phrase: You received without charge; give without charge
  preserved_meaning: What the disciples received at no cost must be given to others at no cost.
  reasoning_layer_used: POB lexical decision
  rationale: “Without charge” clearly means that recipients must not be charged.
translation_notes:
  risk_flags:
  - risk: “Serious skin diseases” does not map exactly onto a single modern diagnosis.
    mitigation: The footnote preserves the traditional term and explains the broader biblical usage.
