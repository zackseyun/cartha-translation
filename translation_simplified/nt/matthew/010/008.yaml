  reason: Retained to preserve POB's source-grounded terminology.
- term: raise the dead
  reason: Retained to preserve POB's source-grounded terminology.
translation_notes:
  source_alignment_notes: The Greek contains five straightforward plural imperatives (heal, raise, cleanse, drive out, give). The simplified text preserves all five commands in the exact same sequence and grammatical force, ensuring the theological impact of the disciples' commission is fully preserved.
  readability_notes:
  - Replacing the archaic 'cast out' with 'drive out' improves modern comprehension. Changing 'Freely you received; freely give' to 'You received without paying; give without paying' maintains the original sentence's dramatic cadence while eliminating potential modern semantic confusion over the word 'freely'.
  compression_notes:
  - No words or phrases were compressed or omitted to shorten the text. Rather, specific terms were updated for modern clarity while maintaining the identical structure and theological density.
  risk_flags:
  - risk: We corrected a clear error in the POB source text where the footnote marker [a] was incorrectly attached to 'the sick' instead of 'lepers' (as the footnote text itself specifically notes that it refers to the term 'lepers'). In the SPOB text, the footnote is properly placed on 'those with skin diseases'.
    mitigation: Flag retained for reviewer attention.
