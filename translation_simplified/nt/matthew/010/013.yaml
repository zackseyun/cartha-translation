  reasoning_layer_used: POB lexical decision and footnote a
  rationale: “Household” makes clear that the people, not the building, are being evaluated.
- pob_phrase: is worthy
  simplified_phrase: is ready to receive you
  preserved_meaning: The household is fit to welcome the messengers and their peace, not morally sinless.
  reasoning_layer_used: POB cultural note b and immediate context
  rationale: This wording prevents modern readers from mistaking “worthy” for moral merit.
- pob_phrase: let your peace come upon it; but if it is not worthy
