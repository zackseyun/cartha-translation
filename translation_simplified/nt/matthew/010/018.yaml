translation_notes:
  source_alignment_notes: Perfectly mirrors the Greek SBLGNT clause structure. The dative pronoun 'αὐτοῖς' is translated neutrally as 'to them' to prevent over-translating the text into a purely condemnatory statement, preserving the original's open-ended theological tension. 'Gentiles' represents 'ἔθνεσιν' in its typical Matthean contrast with Israel.
  readability_notes:
  - The sentence flows naturally in modern English without losing the gravity of Jesus' warning. Archaic phrasing has been avoided, and the relationship between clauses is immediate and clear.
  compression_notes:
  - No semantic compression was performed. All original components of the Greek text and POB translation are fully accounted for.
  risk_flags:
  - risk: The word 'Gentiles' may require minor biblical literacy, but replacing it with 'nations' or 'non-Jewish people' in the main text risks losing the specific covenantal distinction important to Matthew's theology. This is mitigated by the footnote.
