  preserved_meaning: Jesus first summoned the twelve disciples to himself, then gave them authority.
  reasoning_layer_used: POB lexical decision for προσκαλεσάμενος and grounding review
  rationale: The finite clause names Jesus clearly while preserving the participle’s sequence and reflexive force.
- pob_phrase: to cast them out
  simplified_phrase: to cast them out
  preserved_meaning: The disciples received authority to expel the unclean spirits.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The familiar biblical expression remains clear and preserves the exorcism image.
- pob_phrase: every disease and every sickness
  simplified_phrase: every disease and illness
  preserved_meaning: The wording retains both related Greek terms for conditions the disciples could heal.
  reasoning_layer_used: POB lexical decisions for νόσος and μαλακία
  rationale: Removing the repeated “every” and using “illness” makes the pair flow naturally without collapsing it.
