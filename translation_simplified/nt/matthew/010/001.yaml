translation:
  language: en
  text: After Jesus called his twelve disciples to him, he gave them authority over unclean spirits[a], to cast them out and to heal every disease and illness.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “power over unclean spirits.” The Greek word can refer to authority or the right to act; here Jesus gives the disciples authority to act.
    reason: lexical_alternative
