translation:
  language: en
  text: Jesus called his twelve disciples to him and gave them authority over unclean spirits[a], to cast them out and to heal every disease and illness.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'power over unclean spirits.' The Greek word refers to delegated authority, or the right to act on someone else's behalf.
    reason: simplification_note
