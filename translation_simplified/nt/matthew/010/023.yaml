simplification_decisions:
- pob_phrase: flee to the next one
  simplified_phrase: flee to the next city
  preserved_meaning: Jesus commands urgent departure to another city when persecution occurs.
  reasoning_layer_used: Lexical decision for φεύγετε and εἰς τὴν ἑτέραν
  rationale: Repeating “city” removes an unclear implied noun while retaining the force of “flee.”
- pob_phrase: For truly I say to you
  simplified_phrase: I tell you the truth
  preserved_meaning: Jesus introduces a solemn and authoritative statement.
  reasoning_layer_used: Lexical decision for ἀμήν
  rationale: The natural English formula preserves the solemn assurance without archaic word order.
- pob_phrase: you will certainly not finish going through ... until
  simplified_phrase: you certainly will not finish going through ... before
  preserved_meaning: The disciples’ traversal of Israel’s cities will remain incomplete when the Son of Man comes.
  reasoning_layer_used: Lexical decisions for οὐ μὴ τελέσητε and ἕως ἂν ἔλθῃ
  rationale: The reordered time clause is easier to follow while preserving emphatic negation and the future endpoint.
