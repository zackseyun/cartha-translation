translation:
  language: en
  text: For a disciple, becoming like his teacher is enough. For a servant, becoming like his master is enough. If people called the head of the household Beelzebul,[a] they will be even more ready to call members of his household that name.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beelzebub is a familiar traditional form of this name.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: It is enough for the disciple that he become like his teacher, and the slave like his master
  simplified_phrase: For a disciple, becoming like his teacher is enough. For a slave, becoming like his master is enough.
  preserved_meaning: A disciple and a slave should regard becoming like their respective superior as sufficient.
  reasoning_layer_used: POB lexical decisions for ἀρκετόν, μαθητής, δοῦλος, διδάσκαλος, and κύριος
  rationale: Two parallel sentences make the comparison easier to follow while retaining disciple, slave, teacher, and master.
- pob_phrase: the master of the house
  simplified_phrase: the head of the household
  preserved_meaning: The person who holds authority over the household is in view.
  reasoning_layer_used: POB lexical decision for οἰκοδεσπότης
  rationale: “Head of the household” expresses the authority plainly and keeps the household image.
interpretive_expansions:
- pob_phrase: how much more those of his household
  rendering: they will be even more ready to call members of his household that name
  claim: The final clause implies the verb and accusation from the preceding clause and applies them more strongly to the household members.
  evidence:
  - The Greek comparative πόσῳ μᾶλλον introduces an argument from the greater case to the lesser.
  - The preceding verb ἐπεκάλεσαν supplies the action omitted in the final clause.
  - The repeated household terms connect its head with its members.
  confidence: high
translation_notes:
  risk_flags:
