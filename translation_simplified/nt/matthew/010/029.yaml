  simplified_phrase: Two sparrows are sold for just one small copper coin, aren't they?
  preserved_meaning: Two sparrows had very little market value, and the question expects agreement.
  reasoning_layer_used: Lexical decisions for ἀσσαρίου and οὐχὶ, with the cultural note
  rationale: The familiar coin description replaces an opaque Roman term while retaining the rhetorical question.
- pob_phrase: Yet not one of them will fall to the ground apart from your Father.
  simplified_phrase: Yet not one of them will fall to the ground apart from your Father.
  preserved_meaning: Even a sparrow's fall does not occur independently of the Father's providential relation to it.
  reasoning_layer_used: Lexical and theological decision for ἄνευ τοῦ πατρὸς ὑμῶν
  rationale: The wording remains because clearer expansions would wrongly settle whether knowledge, care, or will is meant.
