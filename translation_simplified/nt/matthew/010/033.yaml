translation:
  language: en
  text: But anyone who denies me in front of people, I will also deny that person in front of my Father in heaven.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: whoever denies me before men
  simplified_phrase: anyone who denies me in front of people
  preserved_meaning: The warning applies to anyone who denies Jesus in the presence of others.
  reasoning_layer_used: POB lexical decisions for ὅστις and ἔμπροσθεν τῶν ἀνθρώπων
  rationale: “Anyone who” and “in front of people” express the general reference clearly without adding “other.”
- pob_phrase: I also will deny him
  simplified_phrase: I will also deny that person
  preserved_meaning: Jesus’ denial directly corresponds to that person’s denial of him.
  reasoning_layer_used: POB theological decision on reciprocal denial language
  rationale: Natural word order keeps the repeated verb and solemn reciprocity while making the generic reference clear.
- pob_phrase: my Father who is in heaven
  simplified_phrase: my Father in heaven
  preserved_meaning: Jesus identifies his Father as being in heaven.
  reasoning_layer_used: POB lexical decision for τοῦ ἐν οὐρανοῖς
  rationale: The shorter phrase gives the same meaning in ordinary English.
translation_notes:
  risk_flags:
  - risk: Gender-neutral wording does not reproduce the Greek masculine grammatical forms.
    mitigation: “People” and “that person” preserve their documented generic reference without suggesting that only males are meant.
