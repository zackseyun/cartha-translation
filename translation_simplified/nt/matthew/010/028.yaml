translation:
  language: en
  text: Do not fear people who kill your body; they cannot kill your soul. Instead, fear the one who can destroy both soul and body in Gehenna.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “in hell.” Gehenna, a name derived from the Valley of Hinnom, refers here to the place of final judgment.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: those who kill the body but are not able to kill the soul
  simplified_phrase: people who kill your body; they cannot kill your soul
  preserved_meaning: Human persecutors can kill the physical body but have no power to kill the soul.
  reasoning_layer_used: Lexical decisions for body, soul, and inability
  rationale: A direct address and two short clauses make the contrast easier to follow.
- pob_phrase: Rather
  simplified_phrase: Instead
  preserved_meaning: The command redirects fear from human killers to the one with final power.
  reasoning_layer_used: Lexical decision for μᾶλλον
  rationale: “Instead” expresses the corrective contrast in common English.
- pob_phrase: the one who is able to destroy both soul and body in Gehenna
  simplified_phrase: the one who can destroy both soul and body in Gehenna
  preserved_meaning: The wording retains decisive judgment, the body-soul distinction, Gehenna, and the unnamed identity.
  reasoning_layer_used: Lexical and theological decisions for ability, destroy, Gehenna, and the unnamed referent
  rationale: “Can” simplifies the wording without weakening the warning or resolving the referent.
translation_notes:
  risk_flags:
