translation:
  language: en
  text: Jesus replied, “Why do you ask me what is good? There is one who is good. But if you want to enter life, keep the commandments.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some manuscripts and the parallel accounts read, “Why do you call me good? No one is good except one—God.” Matthew’s SBLGNT text reads, “Why do you ask me about what is good? One is the good one.”
    reason: textual_variant
simplification_decisions:
- pob_phrase: And he said to him
  simplified_phrase: Jesus replied
  preserved_meaning: Jesus answers the man who has just questioned him.
  reasoning_layer_used: Immediate context and POB translation
  rationale: Naming Jesus and using “replied” makes the exchange immediately clear.
- pob_phrase: One is good
  simplified_phrase: There is one who is good
  preserved_meaning: Jesus points to one good person without explicitly identifying that person here.
  reasoning_layer_used: POB lexical decision and listed idiomatic alternative
  rationale: The idiomatic wording preserves the referential ambiguity without harmonizing Matthew to the parallels.
- pob_phrase: enter into life
  simplified_phrase: enter life
  preserved_meaning: The image of entering life remains without adding “eternal.”
  reasoning_layer_used: POB lexical decision and listed alternative
  rationale: Dropping the unnecessary preposition gives natural English while retaining the source image.
translation_notes:
  risk_flags:
