translation:
  language: en
  text: Jesus said to him, “If you want to be complete,[a] go and sell what you own, and give the money to the poor. Then you will have treasure in heaven. Come, follow me.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word can also mean “perfect” or “mature.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: If you want to be perfect
  simplified_phrase: If you want to be complete
  preserved_meaning: Jesus calls for wholehearted, undivided discipleship rather than implying sinless perfection.
  reasoning_layer_used: POB lexical and theological decisions on τέλειος
  rationale: “Complete” gives the contextual sense more clearly for modern readers.
- pob_phrase: sell your possessions and give to the poor
  simplified_phrase: sell what you own, and give the money to the poor
  preserved_meaning: The man must sell his property and use the proceeds to help poor people.
  reasoning_layer_used: POB lexical decisions and immediate command sequence
  rationale: The wording makes explicit what is given after the possessions are sold.
- pob_phrase: and you will have treasure in heaven; then come, follow me
  simplified_phrase: Then you will have treasure in heaven. Come, follow me.
  preserved_meaning: Jesus promises heavenly treasure and then summons the man to discipleship.
  reasoning_layer_used: POB syntax and lexical decision for δεῦρο
  rationale: Short sentences separate the promise from the final command.
interpretive_expansions:
- pob_phrase: give to the poor
  rendering: give the money to the poor
  claim: What is given is the proceeds from selling what he owns.
  evidence:
