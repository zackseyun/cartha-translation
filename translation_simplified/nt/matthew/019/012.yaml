translation:
  language: en
  text: For some are eunuchs because they were born that way from their mother’s womb. Some were made eunuchs by people, and some made themselves eunuchs for the sake of the kingdom of heaven.[a] The one who can accept this should accept it.[b]
  philosophy: optimal-equivalence
  footnotes:
