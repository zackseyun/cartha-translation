  reasoning_layer_used: POB lexical decision for εἶπεν
  rationale: “Told” expresses “said to” in more natural English.
- pob_phrase: Truly I say to you
  simplified_phrase: I tell you the truth
  preserved_meaning: Jesus introduces the statement with solemn authority.
  reasoning_layer_used: POB lexical and theological decisions for Ἀμὴν λέγω ὑμῖν
  rationale: This common wording clearly conveys the force of Jesus’ solemn formula.
- pob_phrase: will enter the kingdom of heaven with difficulty
  simplified_phrase: will have difficulty entering the kingdom of heaven
  preserved_meaning: Entering God’s kingdom is difficult for a rich man.
  reasoning_layer_used: POB lexical decisions for δυσκόλως and εἰσελεύσεται
  rationale: The recast clause is easier to read without strengthening the difficulty into impossibility.
