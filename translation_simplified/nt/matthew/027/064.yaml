translation:
  language: en
  text: So order the tomb to be secured until the third day. Otherwise his disciples may come, steal him, and tell the people, ‘He has been raised from the dead.’ Then the last deception will be worse than the first.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Therefore, order the tomb to be secured until the third day
  simplified_phrase: So order the tomb to be secured until the third day.
  preserved_meaning: Pilate is asked to take decisive official action because of the preceding concern.
  reasoning_layer_used: POB lexical decisions for οὖν, κέλευσον, and ἀσφαλισθῆναι
  rationale: “So” keeps the logical connection in more common English, while “order” and “secured” retain the scope of the request.
- pob_phrase: lest his disciples come and steal him and say to the people
  simplified_phrase: Otherwise his disciples may come, steal him, and tell the people
  preserved_meaning: The speakers fear a possibility rather than assert that the disciples will act.
  reasoning_layer_used: POB lexical decisions for μήποτε, ἐλθόντες, and εἴπωσιν
  rationale: “Otherwise” and “may” express the feared possibility without the less familiar word “lest.”
- pob_phrase: and the last deception will be worse than the first
  simplified_phrase: Then the last deception will be worse than the first.
  preserved_meaning: The feared resurrection claim is presented as a later deception worse than the earlier one.
  reasoning_layer_used: POB lexical decisions for ἡ ἐσχάτη πλάνη and χείρων τῆς πρώτης
  rationale: A separate sentence makes the consequence easier to follow without weakening the hostile charge.
translation_notes:
  risk_flags:
  - risk: Breaking the verse into three sentences could obscure the single chain of feared events.
    mitigation: “Otherwise” and “Then” preserve the logical sequence between the request, feared actions, and consequence.
