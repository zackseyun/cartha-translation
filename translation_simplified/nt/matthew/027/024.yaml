translation:
  language: en
  text: When Pilate saw that he was getting nowhere, but that a riot was beginning, he took water and washed his hands in front of the crowd. He said, “I am not responsible for this man’s death. You yourselves must take responsibility for it.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: he was gaining nothing, but rather that a riot was developing
  simplified_phrase: he was getting nowhere, but that a riot was beginning
  preserved_meaning: Pilate realized that his efforts were failing while public disorder was starting.
  reasoning_layer_used: POB lexical decisions for οὐδὲν ὠφελεῖ and θόρυβος γίνεται
  rationale: Common wording makes Pilate’s failed effort and the emerging riot immediately clear.
- pob_phrase: he took water and washed his hands before the crowd, saying
  simplified_phrase: he took water and washed his hands in front of the crowd. He said
  preserved_meaning: Pilate performed the symbolic action publicly and then declared his position.
  reasoning_layer_used: POB lexical decisions for λαβὼν ὕδωρ, ἀπενίψατο τὰς χεῖρας, and ἀπέναντι τοῦ ὄχλου
  rationale: Two sentences replace the dense participial structure while preserving the public handwashing.
- pob_phrase: I am innocent of this blood; you yourselves will see to it
  simplified_phrase: I am not responsible for this man’s death. You yourselves must take responsibility for it.
  preserved_meaning: Pilate claims no responsibility for the death and assigns the matter to the crowd.
  reasoning_layer_used: POB footnotes, lexical decisions for Ἀθῷός εἰμι, ἀπὸ τοῦ αἵματος τούτου, and ὑμεῖς ὄψεσθε, plus the theological decision
  rationale: The death-responsibility idiom is stated directly without turning Pilate’s words into a prediction of punishment.
interpretive_expansions:
- pob_phrase: I am innocent of this blood
  rendering: I am not responsible for this man’s death
  claim: The blood idiom refers to claimed freedom from responsibility for the person’s death.
  evidence:
  - The POB footnote explicitly explains the expression as freedom from responsibility for a person’s death.
  - The immediate context identifies the death at issue as Jesus’.
  confidence: high
  alternatives_preserved:
  - I am innocent of this blood
- pob_phrase: you yourselves will see to it
  rendering: You yourselves must take responsibility for it
  claim: Pilate assigns responsibility for the matter to the crowd rather than predicting a later reckoning.
  evidence:
  - The POB lexical rationale says the phrase functions like “see to it” or “take responsibility.”
  - The explicit pronoun emphasizes the crowd’s own role.
  confidence: high
  alternatives_preserved:
  - See to it yourselves
  - You yourselves will see to it
translation_notes:
  risk_flags:
  - risk: Direct wording could sound like the narrator agrees that Pilate bears no responsibility.
    mitigation: The statement remains inside Pilate’s direct speech, preserving it as his claim rather than the narrator’s judgment.
