translation:
  language: en
  text: I will give you the keys to the kingdom of heaven.[a] Whatever you bind on earth will have already been bound in heaven, and whatever you loose on earth will have already been loosed in heaven.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “the kingdom of the heavens,” a common phrase in Matthew.
    reason: lexical_alternative
  - marker: b
    text: “Bind” and “loose” can refer to forbidding and permitting, or to imposing and lifting obligations.
    reason: cultural_note
simplification_decisions:
- pob_phrase: the keys of the kingdom of heaven
  simplified_phrase: the keys to the kingdom of heaven
  preserved_meaning: The key metaphor and its connection with the kingdom remain intact.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: “Keys to” is more natural English without defining the authority represented by the keys.
- pob_phrase: will have been bound ... will have been loosed
  simplified_phrase: will have already been bound ... will have already been loosed
  preserved_meaning: The earthly actions correspond to completed heavenly determinations.
  reasoning_layer_used: POB lexical decisions and theological decision on aspect
  rationale: “Already” makes the prior-completion force easier for ordinary readers to recognize.
- pob_phrase: bind ... loose
  simplified_phrase: bind ... loose, with explanation in footnote
  preserved_meaning: The paired metaphor and its unresolved range of authoritative senses are retained.
  reasoning_layer_used: POB lexical decisions and cultural note
  rationale: The note clarifies possible meanings without reducing the metaphor to one interpretation.
interpretive_expansions:
- pob_phrase: will have been bound ... will have been loosed
  rendering: will have already been bound ... will have already been loosed
  claim: The heavenly binding or loosing is presented as completed before the corresponding future earthly state.
  evidence:
  - The Greek uses a future form of “to be” with perfect passive participles.
  - The POB theological rationale says the earthly action may correspond to a prior heavenly determination.
  confidence: moderate
  alternatives_preserved:
  - will have been bound ... will have been loosed
  - will be bound ... will be loosed
translation_notes:
  risk_flags:
  - risk: “Already” may sound more temporally definite than the English future perfect alone.
    mitigation: The POB aspect rationale directly supports prior completion, while moderate confidence preserves caution.
  - risk: Modern readers may not understand “bind” and “loose.”
    mitigation: The metaphor remains in the text, and footnote b gives its principal possible senses without choosing one.
