translation:
  language: en
  text: Jesus answered him, “Blessed are you, Simon Bar-Jonah,[a] because no human being[b] revealed this to you, but my Father in heaven did.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or Simon son of Jonah. Bar-Jonah is an Aramaic-style form.
    reason: lexical_alternative
  - marker: b
    text: Literally flesh and blood, meaning a merely human source.
    reason: cultural_note
simplification_decisions:
- pob_phrase: flesh and blood did not reveal this to you
  simplified_phrase: no human being revealed this to you
  preserved_meaning: Peter’s confession came by revelation from the Father, not from a merely human source.
  reasoning_layer_used: POB translation and cultural footnote
  rationale: No human being communicates the idiom in common English while the footnote preserves the literal phrase.
retained_terms:
- term: Simon Bar-Jonah
  reason: Retained because the POB preserves the Aramaic patronymic.
- term: Father in heaven
  reason: Retained as Jesus’ source of revelation language.
