translation:
  language: en
  text: An evil and adulterous generation asks for a sign, but no sign will be given to it except the sign of Jonah.[a] Then Jesus left them and went away.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Matthew 12:39–40 connects the sign of Jonah with Jonah’s three days and three nights and with the Son of Man.
    reason: cross_reference
simplification_decisions:
- pob_phrase: seeks a sign
  simplified_phrase: asks for a sign
  preserved_meaning: The generation seeks a validating sign from Jesus.
  reasoning_layer_used: POB lexical decision for ἐπιζητεῖ and immediate context
  rationale: “Asks for” makes the request clear without adding the stronger sense of “demands.”
- pob_phrase: And leaving them, he went away
  simplified_phrase: Then Jesus left them and went away
  preserved_meaning: Jesus departed from the people after answering them.
  reasoning_layer_used: POB lexical decisions for καταλιπὼν and ἀπῆλθεν
  rationale: Two direct verbs and an explicit subject replace the awkward participial clause.
interpretive_expansions:
- pob_phrase: he
