translation:
  language: en
  text: An evil and unfaithful[a] generation asks for a sign, but no sign will be given to it except the sign of Jonah.[b] Then he left them and went away.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek says adulterous, an image for covenant unfaithfulness.
    reason: lexical_alternative
  - marker: b
    text: Matthew 12:39–40 connects the sign of Jonah with Jonah’s three days and three nights and with the Son of Man.
    reason: cross_reference
