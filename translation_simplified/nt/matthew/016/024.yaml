simplification_decisions:
- pob_phrase: let him deny himself and take up his cross
  simplified_phrase: they must deny themselves, take up their cross
  preserved_meaning: Each person who wants to come after Jesus is commanded to deny self and take up that person’s own cross.
  reasoning_layer_used: POB inclusive-English footnote and source singular imperatives
  rationale: Singular “they” keeps the universal scope and individual responsibility in natural modern English.
- pob_phrase: to come after me ... follow me
  simplified_phrase: to come after me ... follow me
  preserved_meaning: The desire to come after Jesus remains distinct from his command to follow him.
  reasoning_layer_used: POB lexical decisions for ὀπίσω μου ἐλθεῖν and ἀκολουθείτω μοι
  rationale: Keeping two different expressions preserves the distinction documented by POB.
