translation:
  language: en
  text: And in the morning you say, “There will be stormy weather today, because the sky is red and cloudy.” You know how to read the signs in the sky, but you cannot read the signs of the times.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The signs of the times may refer to the spiritually significant character of that present time, including Jesus’ messianic works.
    reason: alternative_reading
