  text: When Peter answered, “From outsiders,” Jesus said to him, “Then the sons are exempt from paying the tax.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: When he said
  simplified_phrase: When Peter answered
  preserved_meaning: Peter responds to Jesus’ question in the preceding verse.
  reasoning_layer_used: Immediate context and POB lexical decision
  rationale: Naming Peter and using “answered” makes the exchange easy to follow.
- pob_phrase: From strangers
  simplified_phrase: From outsiders
  preserved_meaning: The tax comes from people outside the ruler’s household, not from his sons.
  reasoning_layer_used: POB footnote a and lexical decision for ἀλλοτρίων
  rationale: “Outsiders” preserves the household contrast without suggesting foreign nationality.
- pob_phrase: the sons are free
  simplified_phrase: the sons are exempt from paying the tax
  preserved_meaning: The ruler’s sons are not obligated to pay the tax under discussion.
  reasoning_layer_used: POB footnote b, lexical decision for ἐλεύθεροί, and immediate context
  rationale: The explicit wording prevents readers from mistaking “free” for general liberty.
interpretive_expansions:
- pob_phrase: the sons are free
  rendering: the sons are exempt from paying the tax
  claim: Their freedom means they are not required to pay the tax being discussed.
  evidence:
