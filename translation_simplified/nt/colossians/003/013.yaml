translation:
  language: en
  text: Be patient with one another. If any of you has a complaint against someone else, forgive that person. Just as the Lord forgave you, you must do the same.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: bearing with one another
  simplified_phrase: Be patient with one another
  preserved_meaning: Believers must continually respond to one another with relational patience.
  reasoning_layer_used: Lexical decision for ἀνεχόμενοι and immediate exhortation context
  rationale: The wording expresses ongoing forbearance without the harsh tone of “putting up with.”
- pob_phrase: forgiving each other, if anyone has a complaint against anyone
  simplified_phrase: If any of you has a complaint against someone else, forgive that person.
  preserved_meaning: Any interpersonal complaint calls for forgiveness within the community.
  reasoning_layer_used: Lexical decisions for χαριζόμενοι, ἑαυτοῖς, and μομφήν
  rationale: Recasting the conditional clause as a direct sentence makes the reciprocal command easier to follow.
- pob_phrase: just as the Lord also forgave you, so also you must do
  simplified_phrase: Just as the Lord forgave you, you must do the same.
  preserved_meaning: The Lord’s prior forgiveness is the pattern for the readers’ action.
  reasoning_layer_used: Theological decision on ὁ κύριος and revision decision on the final ellipsis
  rationale: “Do the same” completes the implied action naturally without replacing the title “the Lord.”
interpretive_expansions:
- pob_phrase: forgiving each other, if anyone has a complaint against anyone
  rendering: If any of you has a complaint against someone else, forgive that person.
  claim: The person against whom the complaint is held is the person to be forgiven.
  evidence:
  - The conditional clause directly qualifies the reciprocal command to forgive.
  - The POB lexical rationale places the command in an interpersonal community setting.
  confidence: high
  alternatives_preserved:
  - The complaint may also be described as a grievance.
translation_notes:
