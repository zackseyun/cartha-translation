translation:
  language: en
  text: Slaves[a], obey your earthly masters[b] in everything. Do not obey only when they are watching you, merely to please people. Instead, obey with a sincere heart because you fear the Lord.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word refers here to enslaved people, not modern employees.
    reason: cultural_note
  - marker: b
    text: Literally “masters according to the flesh,” meaning human masters whose authority belongs to this earthly life.
    reason: source_note
simplification_decisions:
- pob_phrase: those who are your masters according to the flesh
  simplified_phrase: your earthly masters
  preserved_meaning: These are human masters whose authority is limited to earthly relationships, in contrast with the Lord.
  reasoning_layer_used: POB lexical and theological decisions on κατὰ σάρκα and κυρίοις
  rationale: The documented alternative “earthly masters” makes the contrast understandable without softening slavery.
- pob_phrase: not with eye-service, as people-pleasers
  simplified_phrase: Do not obey only when they are watching you, merely to please people
  preserved_meaning: Their obedience must not be a performance given only under human observation.
  reasoning_layer_used: POB lexical decisions and cultural footnote on ὀφθαλμοδουλίαις and ἀνθρωπάρεσκοι
  rationale: The rare expression is unpacked into its stated meaning in ordinary English.
- pob_phrase: but with sincerity of heart, fearing the Lord
  simplified_phrase: Instead, obey with a sincere heart because you fear the Lord
  preserved_meaning: Sincere obedience is motivated by reverent fear of the Lord.
  reasoning_layer_used: POB lexical decisions on ἁπλότης καρδίας and φοβούμενοι
  rationale: The participial phrase becomes a direct statement of motivation while retaining fear-of-the-Lord language.
interpretive_expansions:
- pob_phrase: masters according to the flesh
  rendering: earthly masters
  claim: The masters are human authorities belonging to this earthly life, unlike the Lord.
  evidence:
  - The POB footnote identifies “earthly” as an allowed rendering.
  - The POB rationale says the phrase contrasts human relations with the Lord.
  confidence: high
  alternatives_preserved:
  - masters according to the flesh
- pob_phrase: not with eye-service
  rendering: Do not obey only when they are watching you
  claim: Eye-service means obedience performed only under a master's observation.
  evidence:
  - The POB cultural note gives this meaning directly.
  - The lexical rationale defines the compound as service performed only under observation.
  confidence: high
  alternatives_preserved:
  - eye-service
translation_notes:
  risk_flags:
  - risk: Modern readers may mistake the command as approval of slavery.
    mitigation: The text names the historical status plainly, while the footnote distinguishes slaves from employees without adding endorsement.
  - risk: “In everything” may sound as though earthly masters have unlimited authority.
    mitigation: “Earthly” and the contrast with “the Lord” preserve the POB qualifier that their authority is human and this-worldly.
