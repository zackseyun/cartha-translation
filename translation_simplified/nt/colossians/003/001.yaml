translation:
  language: en
  text: If[a] you were raised with the Messiah,[b] then keep seeking the things above, where the Messiah is seated at God’s right hand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This condition likely assumes that they truly were raised with the Messiah; it could be translated, “Since you were raised.”
