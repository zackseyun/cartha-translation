translation:
  language: en
  text: Let the word of Messiah live in you in all its richness.[a] With all wisdom,[b] teach and warn one another through psalms, hymns, and spiritual songs. Sing to God with grace in your hearts.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “In you” may refer to each believer or to the whole community together.
    reason: alternative_reading
  - marker: b
    text: “With all wisdom” may also describe how the word of Messiah lives among you.
    reason: source_note
  - marker: c
    text: Or “with thankfulness”; the Greek can convey grace, graciousness, or gratitude.
    reason: lexical_alternative
