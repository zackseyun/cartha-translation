- pob_phrase: will be repaid for what he has done wrong
  simplified_phrase: will be repaid for the wrong he has done
  preserved_meaning: The person will receive what is due for his completed wrongdoing.
  reasoning_layer_used: Lexical decisions for κομίσεται and ὃ ἠδίκησεν
  rationale: The revised wording states the wrongdoing once and keeps the retributive sense.
- pob_phrase: and there is no partiality
