translation:
  language: en
  text: In this renewed community, there is no distinction between Greek and Jew, circumcised and uncircumcised, barbarian (someone regarded as foreign and uncivilized) and Scythian, servant and free. Instead, the Messiah is everything and is in all.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the Messiah is everything and is in everyone.” The Greek expression “in all” may refer to all members of the renewed community, but it remains broad.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: where there is no Greek and Jew
  simplified_phrase: In this renewed community, there is no distinction between Greek and Jew
  preserved_meaning: These ethnic distinctions do not establish separate standing in the new humanity.
  reasoning_layer_used: The lexical rationale links “where” to the renewed community, and the source retains categorical negation.
  rationale: This states the community setting clearly without implying that ethnic identities cease to exist.
- pob_phrase: circumcision and uncircumcision
  simplified_phrase: circumcised and uncircumcised
  preserved_meaning: The covenantal and social contrast between the two groups remains.
  reasoning_layer_used: The lexical decision identifies the abstract nouns as social-religious identity markers.
  rationale: Naming the people directly makes the contrast easier to understand.
- pob_phrase: barbarian, Scythian, slave, free
  simplified_phrase: barbarian (someone regarded as foreign and uncivilized) and Scythian, slave and free
  preserved_meaning: The culturally loaded outsider label, specific ethnic name, and bonded-status contrast are retained.
  reasoning_layer_used: The lexical decisions preserve “barbarian,” “Scythian,” and the explicit slave-free opposition.
  rationale: The parenthetical explanation clarifies the ancient label without reducing it to neutral “foreigner.”
