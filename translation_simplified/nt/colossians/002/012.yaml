translation:
  language: en
  text: You were buried with him in baptism. In that baptism, you were also raised with him through faith in God’s active work—the work of God, who raised him from the dead.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, possibly, “In him, you were also raised,” if the phrase refers to Messiah rather than to baptism.
    reason: alternative_reading
  - marker: b
    text: Or “through trust.” The Greek word can sometimes mean “faithfulness,” but “faith” is more likely here.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: having been buried with him in baptism
  simplified_phrase: You were buried with him in baptism.
  preserved_meaning: Baptism remains closely linked with being buried together with Messiah.
  reasoning_layer_used: Lexical decision for συνταφέντες and theological decision on baptismal language
  rationale: A direct sentence removes the difficult opening participle while preserving burial with him.
- pob_phrase: in which you also were raised with him
  simplified_phrase: In that baptism, you were also raised with him
  preserved_meaning: The main reading still takes the relative phrase as referring to baptism.
  reasoning_layer_used: Lexical and theological decisions on ἐν ᾧ
  rationale: Repeating “baptism” clarifies the favored antecedent while the footnote preserves the alternative.
- pob_phrase: through faith in the working of God, who raised him from the dead
  simplified_phrase: through faith in God’s active work—the work of God, who raised him from the dead
  preserved_meaning: Faith is directed toward God’s effective activity, and the final clause identifies God as the one who raised Messiah.
  reasoning_layer_used: Lexical decisions for πίστις, ἐνέργεια, and the attributive participle
  rationale: The wording explains “working” without turning the identifying clause into a causal statement.
