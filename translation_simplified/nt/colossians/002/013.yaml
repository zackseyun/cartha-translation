    mitigation: The footnote notes its spiritual significance without replacing its bodily meaning.
  - risk: The pronouns “he” and “him” may be unclear when the verse stands alone.
    mitigation: The main text preserves POB’s pronouns, and a footnote identifies Christ as the referent of “him.”
