simplification_decisions:
- pob_phrase: These all perish with use
  simplified_phrase: These things are all used up and perish
  preserved_meaning: The regulated items are consumed through use and do not last.
  reasoning_layer_used: Lexical decisions for εἰς φθοράν and τῇ ἀποχρήσει
  rationale: The rewrite clearly shows that use consumes these temporary things.
- pob_phrase: according to the commandments and teachings of men
  simplified_phrase: These rules are based on human commandments and teachings
  preserved_meaning: The regulations follow a human rather than divine basis.
  reasoning_layer_used: Lexical rationale for κατὰ and theological analysis of the regulations
  rationale: A separate sentence directly characterizes the rules without implying that one set of rules comes from another.
interpretive_expansions:
- pob_phrase: according to the commandments and teachings of men
  rendering: These rules are based on human commandments and teachings
  claim: The final phrase directly characterizes the preceding regulations as humanly based.
  evidence:
  - The context in Colossians 2:20–21 supplies the regulations being described.
  - The POB rationale says κατὰ introduces the norm or basis of those regulations.
  confidence: high
  alternatives_preserved:
  - The critique may focus more sharply on regulations concerned with perishable things.
translation_notes:
  risk_flags:
