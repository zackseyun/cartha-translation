translation:
  language: en
  text: In him you also were circumcised, though no human hands performed it. The body of flesh[a] was stripped away in this circumcision of Messiah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Body of flesh” may describe the physical body, a body ruled by flesh, or the old fleshly existence; the wording remains open.
    reason: lexical_alternative
  - marker: b
    text: “Circumcision of Messiah” may mean circumcision done by Messiah, belonging to Messiah, or associated with him.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: with a circumcision not made by hands
  simplified_phrase: though no human hands performed it
  preserved_meaning: This circumcision was not a human ritual or action.
  reasoning_layer_used: Lexical decision for ἀχειροποιήτῳ
  rationale: The active wording explains the biblical idiom without removing its contrast with human action.
- pob_phrase: in the removal of the body of flesh
  simplified_phrase: The body of flesh was stripped away
  preserved_meaning: The circumcision involves the decisive removal or stripping off of the body of flesh.
  reasoning_layer_used: Lexical and theological decisions for ἀπέκδυσις and σάρξ
  rationale: A direct sentence clarifies the image while retaining the deliberately difficult phrase “body of flesh.”
- pob_phrase: in the circumcision of Messiah
  simplified_phrase: in this circumcision of Messiah
  preserved_meaning: The circumcision is connected with Messiah without specifying exactly how.
  reasoning_layer_used: Theological decision on the open genitive τοῦ Χριστοῦ
  rationale: Adding “this” improves the connection between the sentences while “of Messiah” preserves the ambiguity.
