translation:
  language: en
  text: Do not let anyone disqualify you. Such a person delights in humility and the worship of angels.[a] He goes on about what he has seen,[b][c] but his mind, shaped by the flesh, has puffed him up for no good reason.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also mean “the religion of angels” or “worship with angels.”
    reason: alternative_reading
  - marker: b
    text: Some manuscripts say “what he has not seen.”
    reason: textual_variant
  - marker: c
    text: The rare Greek verb may also mean “dwells on” or “enters into.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Let no one disqualify you
  simplified_phrase: Do not let anyone disqualify you
  preserved_meaning: No person should be allowed to rule the readers unworthy or deprive them of the prize.
  reasoning_layer_used: Lexical decision for καταβραβευέτω
  rationale: The direct command is clearer while retaining the contest-like idea of disqualification.
- pob_phrase: delighting in humility and the worship of angels
  simplified_phrase: Such a person delights in humility and the worship of angels
  preserved_meaning: The same person takes pleasure in the named religious practices.
  reasoning_layer_used: Lexical and theological decisions for θέλων and θρησκείᾳ τῶν ἀγγέλων
  rationale: A new sentence identifies the person clearly without resolving the debated angel phrase.
- pob_phrase: vainly puffed up by the mind of his flesh
  simplified_phrase: his mind, shaped by the flesh, has puffed him up for no good reason
  preserved_meaning: His flesh-oriented thinking produces groundless arrogance.
  reasoning_layer_used: Lexical and theological decisions for εἰκῇ, φυσιούμενος, νοὸς, and σάρξ
  rationale: The recast clause uses ordinary word order while retaining both the inflation image and “flesh.”
