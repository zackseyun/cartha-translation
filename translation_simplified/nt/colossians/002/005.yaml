simplification_decisions:
- pob_phrase: absent in the flesh
  simplified_phrase: absent in body
  preserved_meaning: Paul is physically absent, not absent in an ethical sense.
  reasoning_layer_used: Lexical decision for σαρκί and its contrast with πνεύματι.
  rationale: “In body” clearly expresses physical absence while preserving the contrast with spirit.
- pob_phrase: rejoicing and seeing
  simplified_phrase: I rejoice to see
  preserved_meaning: Paul rejoices as he observes their commendable condition.
  reasoning_layer_used: Lexical decisions for χαίρων and βλέπων.
  rationale: The participles become a natural English clause without defining how Paul sees them.
- pob_phrase: the firmness of your faith in Messiah
  simplified_phrase: how firm your faith in Messiah is
  preserved_meaning: Their faith in Messiah is stable and secure.
  reasoning_layer_used: Lexical and theological decisions for στερέωμα, πίστις, and Χριστός.
  rationale: The image of firmness remains in a clearer sentence.
translation_notes:
  risk_flags:
  - risk: “In spirit” may refer to Paul’s own spirit or possibly to the Holy Spirit.
    mitigation: Lowercase “spirit” retains POB’s preferred reading without eliminating the ambiguity.
  - risk: The main text may obscure the possible “faithfulness” nuance of πίστις.
    mitigation: The footnote preserves the documented alternative without adding perseverance.
