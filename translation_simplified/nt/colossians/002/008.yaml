translation:
  language: en
  text: Be on guard. Do not let anyone take you captive through philosophy and empty deception, following human tradition and the elemental principles of this world,[a] rather than Messiah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek phrase may also mean “the elemental spirits of the world.” It can refer either to basic principles or to cosmic spiritual powers.
    reason: alternative_reading
  - marker: b
    text: Greek “Christ”; “Messiah” brings out the title’s meaning here.
    reason: lexical_alternative
