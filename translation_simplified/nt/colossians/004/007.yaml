translation:
  language: en
  text: Tychicus is a beloved brother, a faithful minister,[a] and a fellow slave in the Lord.[b] He will tell you everything about me.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word can mean “minister” or “servant”; here it does not clearly refer to the church office of deacon.
    reason: lexical_alternative
  - marker: b
    text: Or “fellow servant” or “fellow bondservant.” “Fellow slave” emphasizes shared belonging and service under the Lord.
    reason: lexical_alternative
