  text: This mystery[a] was hidden from age after age and generation after generation. But now it was revealed to God’s saints.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “mystery” means God’s purpose that was once hidden but is now disclosed.
    reason: lexical_alternative
  - marker: b
    text: “Saints” means God’s holy people, not a special elite group.
    reason: simplification_note
