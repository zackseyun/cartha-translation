translation:
  language: en
  text: And through the Son, God was pleased to reconcile all things to himself by making peace through the Son’s blood on the cross—through him—whether things on earth or things in the heavens.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “All things” remains broad; this verse does not explain how this reconciliation relates to final salvation.
    reason: alternative_reading
  - marker: b
    text: Some manuscripts omit the repeated words “through him.”
    reason: textual_variant
simplification_decisions:
- pob_phrase: and through him to reconcile all things to himself
  simplified_phrase: And through the Son, God was pleased to reconcile all things to himself
  preserved_meaning: God’s pleasure includes reconciling all things to himself through the Son.
  reasoning_layer_used: POB syntax and theological decisions on the implied subject and mediator
  rationale: This wording supplies the contextual referents while retaining the infinitive’s link to verse 19.
- pob_phrase: having made peace through the blood of his cross
  simplified_phrase: by making peace through the Son’s blood on the cross
  preserved_meaning: God makes peace by means of the Son’s sacrificial blood and crucifixion.
  reasoning_layer_used: POB lexical and theological decisions on peace, blood, and cross
  rationale: The causal wording is easier to follow while preserving both concrete images.
- pob_phrase: whether the things on the earth or the things in the heavens
  simplified_phrase: whether things on earth or things in the heavens
  preserved_meaning: The reconciliation encompasses the same broad earthly and heavenly scope.
  reasoning_layer_used: POB lexical decisions on the correlative phrase and cosmic pair
  rationale: Removing repeated articles makes the pairing natural without narrowing it.
interpretive_expansions:
- pob_phrase: through him ... to himself ... his cross
  rendering: through the Son, God ... to himself ... the Son’s blood on the cross
  claim: God is the reconciler, while the Son is the mediator and crucified one.
  evidence:
  - Verse 19 supplies God as the implied subject of the continuing construction.
  - The POB audit identifies God as the likely referent of “himself.”
  - The surrounding hymn presents the Son as the agent of reconciliation.
  confidence: high
  alternatives_preserved:
