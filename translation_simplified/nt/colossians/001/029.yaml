simplification_decisions:
- pob_phrase: For this I also labor
  simplified_phrase: For this purpose, I also work hard
  preserved_meaning: Paul adds his strenuous effort toward the ministry goal just described.
  reasoning_layer_used: Lexical decisions for εἰς ὃ, καί, and κοπιῶ
  rationale: Common wording clarifies the purpose and strenuous effort while retaining “also.”
- pob_phrase: striving according to his working
  simplified_phrase: strive, in keeping with his work
  preserved_meaning: Paul's exertion corresponds to the effective divine work rather than merely his own strength.
  reasoning_layer_used: Lexical decisions for ἀγωνιζόμενος, κατά, and ἐνέργεια
  rationale: “In keeping with” states the relationship more naturally than “according to.”
- pob_phrase: which is working in me in power
  simplified_phrase: which is powerfully at work in me
  preserved_meaning: His work continues within Paul and operates with power.
  reasoning_layer_used: Lexical decisions for ἐνεργουμένην, ἐν ἐμοὶ, and ἐν δυνάμει
  rationale: The recast phrase retains the inward, ongoing, and powerful action in natural English.
