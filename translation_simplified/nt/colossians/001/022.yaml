translation:
  language: en
  text: But now, in his flesh-and-blood body, he has reconciled you to himself through his death.[a] His purpose is to bring you before him holy and blameless, with no valid accusation against you.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek can also be translated, “you have been reconciled.”
    reason: alternative_reading
  - marker: b
    text: “Blameless” can also mean “without blemish,” an image used for an acceptable sacrifice.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: in his body of flesh through death
  simplified_phrase: in his flesh-and-blood body ... through his death
  preserved_meaning: Reconciliation occurred in his real human body and was accomplished through his death.
  reasoning_layer_used: Lexical and theological decisions on σώμα, σάρξ, and διὰ τοῦ θανάτου
  rationale: The wording keeps the embodied setting and death as distinct ideas in natural English.
- pob_phrase: to present you
  simplified_phrase: His purpose is to bring you before him
  preserved_meaning: Reconciliation aims at their being presented in his evaluative presence.
  reasoning_layer_used: Lexical decisions on παραστῆσαι and κατενώπιον αὐτοῦ
  rationale: A separate purpose sentence makes the relationship easier to follow.
- pob_phrase: beyond reproach
  simplified_phrase: with no valid accusation against you
  preserved_meaning: They are not open to any charge that can be sustained before him.
  reasoning_layer_used: Lexical and theological decisions on ἀνεγκλήτους
  rationale: This wording makes the documented legal force clear without implying that no accusation is ever made.
interpretive_expansions:
- pob_phrase: has reconciled you
  rendering: has reconciled you to himself
  claim: The reconciliation restores the readers’ relationship with the acting person.
  evidence:
  - Verse 21 describes the readers’ former alienation and hostility.
  - POB identifies the preceding divine subject as the agent.
  confidence: high
  alternatives_preserved:
  - you have been reconciled
translation_notes:
  risk_flags:
  - risk: “Flesh-and-blood body” is more idiomatic than the concrete phrase “body of flesh.”
    mitigation: It still identifies a real human body and avoids the mistaken sense “sinful nature.”
  - risk: The referent of “he” remains implicit within this verse.
    mitigation: The pronoun is retained because POB does not replace it with a named referent.
