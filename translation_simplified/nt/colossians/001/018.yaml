translation:
  language: en
  text: He is the head of the body—that is, the church. He is the beginning,[a] the firstborn from the dead, so that he himself might come to have first place in everything.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the origin” or “the ruler.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the body, the church
  simplified_phrase: the body—that is, the church
  preserved_meaning: The church is identified as Christ’s body while the head-and-body image remains intact.
  reasoning_layer_used: Lexical and theological decisions for κεφαλή, σώματος, and ἐκκλησίας.
  rationale: The explanatory wording makes the relationship clear without defining “head” as only source or authority.
- pob_phrase: so that he himself might become preeminent in all things
  simplified_phrase: so that he himself might come to have first place in everything
  preserved_meaning: Christ comes to hold the foremost place in the full scope intended by the verse.
  reasoning_layer_used: Lexical decisions for ἵνα γένηται, ἐν πᾶσιν, and πρωτεύων.
  rationale: Common wording replaces “preeminent” while preserving becoming, emphasis, and universal scope.
translation_notes:
  risk_flags:
  - risk: Modern readers may hear “firstborn” as saying that Christ was created.
    mitigation: The phrase “from the dead” keeps the term tied to resurrection, as required by the POB reasoning.
  - risk: “Beginning” can carry more than one sense in this context.
    mitigation: The main POB choice remains in the text, and the lexical alternatives are retained in a footnote.
