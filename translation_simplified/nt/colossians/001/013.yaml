  preserved_meaning: Darkness is pictured as a ruling power over people.
  reasoning_layer_used: The POB lexical rationale for ἐξουσία allows the sense of ruling power.
  rationale: “Rule” makes the dominion image clearer without explaining darkness away.
- pob_phrase: transferred us into
  simplified_phrase: brought us into
  preserved_meaning: God moved us from one dominion into the Son’s kingdom.
  reasoning_layer_used: The POB lexical rationale for μεθίστημι and its kingdom imagery.
