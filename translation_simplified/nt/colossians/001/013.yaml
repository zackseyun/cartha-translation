simplification_decisions:
- pob_phrase: who rescued us
  simplified_phrase: He rescued us
  preserved_meaning: God is the one who decisively saves his people from hostile rule.
  reasoning_layer_used: Immediate context and the POB lexical decision for ἐρρύσατο.
  rationale: A complete sentence is easier to read while retaining “rescued.”
- pob_phrase: the authority of darkness
