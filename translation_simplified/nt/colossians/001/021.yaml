simplification_decisions:
- pob_phrase: who once were alienated
  simplified_phrase: once separated from God
  preserved_meaning: They formerly lived in a state of relational separation from God.
  reasoning_layer_used: Lexical decision for ἀπηλλοτριωμένους and its Pauline context
  rationale: “Separated from God” makes the relational meaning of “alienated” immediately clear.
- pob_phrase: hostile in mind
  simplified_phrase: hostile to him in your thoughts
  preserved_meaning: Their inward attitude was hostile toward God.
  reasoning_layer_used: Lexical decisions for ἐχθρούς and τῇ διανοίᾳ
  rationale: The wording identifies the inward sphere and implied object in natural English.
- pob_phrase: in evil deeds
  simplified_phrase: doing evil deeds
  preserved_meaning: Their inward hostility was present or manifested in evil conduct without asserting strict causation.
  reasoning_layer_used: Lexical and theological decisions for ἐν τοῖς ἔργοις τοῖς πονηροῖς
  rationale: An active phrase avoids the opaque expression “in evil deeds” while preserving outward conduct.
interpretive_expansions:
- pob_phrase: alienated and hostile in mind
  rendering: separated from God, hostile to him in your thoughts
  claim: God is the implied one from whom the readers were separated and toward whom they were hostile.
  evidence:
  - The following verse presents reconciliation through Christ as the answer to this former condition.
  - POB identifies the alienation as relational estrangement from God in Pauline usage.
  confidence: high
  alternatives_preserved:
  - The footnote retains the more literal “enemies in mind” construction.
translation_notes:
  risk_flags:
  - risk: Naming God and using “to him” makes the implied relational object explicit.
    mitigation: The immediate reconciliation context and POB lexical rationale strongly identify God as the referent.
  - risk: “Doing evil deeds” may sound like a separate action rather than the sphere or manifestation of hostility.
    mitigation: The coordinated wording avoids claiming that the deeds caused the hostility, and the footnote preserves the compact Greek relation.
