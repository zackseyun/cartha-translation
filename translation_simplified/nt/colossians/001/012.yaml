simplification_decisions:
- pob_phrase: who has qualified you
  simplified_phrase: who has made you fit to receive
  preserved_meaning: The Father has made them sufficient to participate in the inheritance, not merely given permission.
  reasoning_layer_used: Lexical decision for ἱκανόω
  rationale: This uses POB’s documented alternative to explain “qualified” in ordinary English.
- pob_phrase: for the share of the inheritance
  simplified_phrase: to receive your allotted share of the inheritance
  preserved_meaning: They receive a portion of an inheritance pictured as an allotment.
  reasoning_layer_used: Lexical decisions for μερίς and κλῆρος plus POB footnote b
  rationale: The wording removes the difficult noun chain while preserving the allotted-inheritance image.
- pob_phrase: of the saints in the light
  simplified_phrase: that belongs to God’s holy people and is in the light
  preserved_meaning: The inheritance belongs to God’s consecrated people and exists in the sphere described as light.
  reasoning_layer_used: Lexical decisions for ἅγιοι and ἐν τῷ φωτί
  rationale: The recast clarifies both “saints” and the POB-documented attachment of “in the light” to the inheritance.
interpretive_expansions:
