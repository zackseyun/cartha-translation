translation:
  language: en
  text: We have come to know and trust the love God has among us.[a] God is love. Whoever continues in love remains in God, and God remains in him.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the love God has in us” or “the love God has for us.” The Greek can refer to love within believers or present among their community; “for us” expresses the sense contextually.
    reason: alternative_reading
  - marker: b
    text: “Him” refers to anyone who continues in love.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: have come to know and have believed
  simplified_phrase: have come to know and trust
  preserved_meaning: Prior knowledge and settled belief continue in the present.
  reasoning_layer_used: POB lexical decisions for ἐγνώκαμεν and πεπιστεύκαμεν
  rationale: “Trust” makes the continuing force of belief clearer in ordinary English.
- pob_phrase: the love that God has for us
  simplified_phrase: the love God has among us
  preserved_meaning: God’s love is present and manifested within the believing community.
  reasoning_layer_used: POB lexical and theological decisions for ἐν ἡμῖν
  rationale: “Among us” follows the source-driven communal reading while the note preserves other live renderings.
- pob_phrase: the one who remains in love
  simplified_phrase: whoever continues in love
  preserved_meaning: A person perseveres within the sphere of divine love.
  reasoning_layer_used: POB lexical decision for ὁ μένων ἐν τῇ ἀγάπῃ
  rationale: “Continues” communicates enduring participation naturally while “remains” preserves mutual indwelling.
translation_notes:
  risk_flags:
  - risk: “Among us” may be heard as excluding love within individuals or God’s love for believers.
    mitigation: Footnote a preserves both the inward reading and the contextual “for us” rendering.
  - risk: Representative “him” may sound limited to men.
    mitigation: Footnote b explains that the masculine singular refers to anyone who continues in love.
