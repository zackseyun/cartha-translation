translation:
  language: en
  text: Dear friends, do not believe every spirit.[a] Instead, test the spirits to find out whether they come from God. Do this because many false prophets have gone out into the world and are now active there.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “spirits” refers to the spiritual sources behind prophetic claims; false prophets are the human agents through whom such claims are made.
    reason: cultural_note
