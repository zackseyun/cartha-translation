translation:
  language: en
  text: 'This is how God’s love was made clear among us[a]: he has sent his one and only Son[b] into the world so that we may live through him.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “in us.” The Greek can refer either to believers inwardly or to the believing community.
    reason: lexical_alternative
  - marker: b
    text: Traditionally, “his only begotten Son.” The Greek emphasizes that the Son is unique.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: In this the love of God was revealed among us
  simplified_phrase: This is how God’s love was made clear among us
  preserved_meaning: God openly demonstrated his love among the believing community.
  reasoning_layer_used: Lexical decisions for ἐν τούτῳ, ἐφανερώθη, and ἐν ἡμῖν
  rationale: The direct wording clarifies that the Son’s sending shows God’s love while retaining the communal sense.
- pob_phrase: that God has sent his one and only Son
  simplified_phrase: he has sent his one and only Son
  preserved_meaning: God’s sending of his unique Son is the act that revealed his love.
  reasoning_layer_used: Lexical and theological decisions for ὅτι, ἀπέσταλκεν, and μονογενής
  rationale: The pronoun avoids repetition while preserving the Son’s uniqueness and the continuing significance of his sending.
- pob_phrase: so that we might live through him
  simplified_phrase: so that we may live through him
  preserved_meaning: God sent the Son for the purpose that we receive life through him.
  reasoning_layer_used: Lexical decisions for ἵνα ζήσωμεν and δι’ αὐτοῦ
  rationale: “May live” clearly expresses God’s purpose without suggesting mere possibility.
