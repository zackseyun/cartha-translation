translation:
  language: en
  text: No one has ever seen God. If we love each other, God remains in us, and his love[a] is made complete in us.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “our love for God is made complete in us.” The Greek can mean either God’s love for us or our love for God; the context favors God’s love.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: No one has ever seen God; if we love one another
  simplified_phrase: No one has ever seen God. If we love each other
  preserved_meaning: No human has seen God, and mutual love introduces the stated condition.
  reasoning_layer_used: POB lexical decisions for τεθέαται, πώποτε, ἐὰν ἀγαπῶμεν, and ἀλλήλους
  rationale: Splitting the sentence and using “each other” makes the thought easier to follow without changing the condition.
- pob_phrase: his love is perfected in us
  simplified_phrase: his love is made complete in us
  preserved_meaning: God’s love reaches its intended completeness in believers with an ongoing result.
  reasoning_layer_used: POB lexical decision for τετελειωμένη ἐστιν and theological decision on ἡ ἀγάπη αὐτοῦ
  rationale: “Made complete” explains “perfected” in common English while preserving the completion sense.
translation_notes:
  risk_flags:
  - risk: Readers may take “his love” only as God’s love even though the Greek permits another reading.
    mitigation: The footnote preserves the alternative “our love for God” while retaining POB’s contextually favored reading.
