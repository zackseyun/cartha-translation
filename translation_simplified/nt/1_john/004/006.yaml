translation:
  language: en
  text: We come from God. Anyone who knows God listens to what we say.[a] Anyone who does not come from God does not listen to us. This is how we can tell the Spirit of truth from the spirit of error.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek can also mean “hears us,” but here it means listening receptively to the apostles’ testimony.
    reason: lexical_alternative
  - marker: b
    text: “The Spirit of truth” likely refers to the Holy Spirit, though the phrase could also be read more generally as “the spirit of truth.”
    reason: alternative_reading
