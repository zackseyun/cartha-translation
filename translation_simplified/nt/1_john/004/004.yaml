  text: Little children, you are from God. You have overcome them,[a] because the one who is in you is greater than the one who is in the world.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Them” means the opponents just mentioned, especially the false prophets.
