translation:
  language: en
  text: Suppose someone says, “I love God,” but hates his brother.[a] He is a liar. For if he does not love his brother, whom he has seen, he cannot love God, whom he has not seen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “brother or sister.” The Greek says “brother,” which can represent either in this context.
    reason: lexical_alternative
