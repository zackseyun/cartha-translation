  reasoning_layer_used: POB lexical decision for ἐάν τις εἴπῃ
  rationale: “Suppose someone” introduces the case in natural common English.
- pob_phrase: and hates his brother
  simplified_phrase: but hates his brother
  preserved_meaning: Hatred of one’s brother contradicts the claimed love for God.
  reasoning_layer_used: Immediate context and POB lexical decisions
  rationale: “But” makes the contrast clear without changing either claim.
- pob_phrase: for the one who does not love his brother whom he has seen cannot love God whom he has not seen
  simplified_phrase: For if he does not love his brother, whom he has seen, he cannot love God, whom he has not seen
  preserved_meaning: Failure to love a visible brother proves the claimed love for the unseen God impossible.
  reasoning_layer_used: POB lexical decision on γάρ and theological decision on οὐ δύναται ἀγαπᾶν
  rationale: “For” retains the explanation while the conditional form makes the logic easier to follow.
