simplification_decisions:
- pob_phrase: Beloved
  simplified_phrase: Dearly loved ones
  preserved_meaning: John affectionately addresses people who are loved while maintaining the verse’s repeated language of love.
  reasoning_layer_used: POB lexical decision for ἀγαπητοί
  rationale: This replaces a less familiar form of address with clear modern English.
- pob_phrase: if God so loved us
  simplified_phrase: if God loved us in this way
  preserved_meaning: The conditional form remains, while the wording points back to the manner of God’s love.
  reasoning_layer_used: POB lexical and theological decisions for εἰ and οὕτως
  rationale: This makes “so” clearer without changing “if” to the more interpretive “since.”
- pob_phrase: we also ought to love
  simplified_phrase: we too ought to love
  preserved_meaning: God’s love creates a real moral obligation for believers to love others.
  reasoning_layer_used: POB lexical decisions for καὶ ἡμεῖς and ὀφείλομεν
  rationale: “We too” expresses the emphatic response in natural English.
