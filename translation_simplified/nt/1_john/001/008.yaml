  reasoning_layer_used: POB lexical and theological decisions on ἁμαρτίαν and οὐκ ἔχομεν
  rationale: “Claim” and “there is no sin in us” make the denial clear in natural English.
- pob_phrase: we deceive ourselves, and the truth is not in us
  simplified_phrase: we deceive ourselves. The truth is not in us.
  preserved_meaning: Self-deception and the absence of truth remain two distinct consequences.
  reasoning_layer_used: POB lexical decision and theological decision on ἡ ἀλήθεια
  rationale: Two sentences reduce clause density without weakening the connection.
