translation:
  language: en
  text: If we say we have fellowship with him[b] but keep walking in the darkness,[a] we are lying and are not putting the truth into practice.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “The darkness” means the moral and spiritual realm opposed to God.
    reason: simplification_note
  - marker: b
    text: “Fellowship” means sharing a close relationship with him.
    reason: simplification_note
simplification_decisions:
- pob_phrase: we have fellowship with him
  simplified_phrase: we have fellowship with him[b]
  preserved_meaning: Fellowship remains a shared relationship with him without adding the idea of shared divine life.
  reasoning_layer_used: POB lexical decision for κοινωνίαν ἔχομεν
  rationale: The footnote explains the biblical term while the main text avoids an unsupported expansion.
- pob_phrase: and yet walk in the darkness
  simplified_phrase: but keep walking in the darkness
  preserved_meaning: The contrast, ongoing conduct, and moral-spiritual image of darkness are retained.
  reasoning_layer_used: POB lexical and theological decisions for περιπατῶμεν and ἐν τῷ σκότει
  rationale: “Keep walking” makes the continuing way of life clearer without flattening the image.
- pob_phrase: are not practicing the truth
  simplified_phrase: are not putting the truth into practice
  preserved_meaning: Their conduct does not follow or enact the truth.
  reasoning_layer_used: POB lexical decision for οὐ ποιοῦμεν τὴν ἀλήθειαν
  rationale: The wording clearly conveys the concrete action in the Johannine idiom.
interpretive_expansions:
- pob_phrase: walk in the darkness
  rendering: keep walking in the darkness
  claim: The walking describes continuing conduct rather than a single act.
  evidence:
  - The POB rationale identifies walking as a metaphor for one's manner of life.
  confidence: high
  alternatives_preserved:
  - walk in the darkness
  - live in the darkness
translation_notes:
  risk_flags:
