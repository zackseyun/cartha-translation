translation:
  language: en
  text: But if we walk through life in the light, as God himself is in the light, we share fellowship with one another.[a] And the blood of Jesus, God’s Son, cleanses us from every sin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some understand this as fellowship with God, but the Greek most naturally means mutual fellowship among believers.
    reason: alternative_reading
  - marker: b
    text: The Greek can also be translated “from all sin.”
    reason: lexical_alternative
