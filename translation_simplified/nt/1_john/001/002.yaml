  simplified_phrase: The life was revealed. We have seen it, and we testify about it. We proclaim
  preserved_meaning: The life was disclosed, witnessed by the apostles, and is now both attested and proclaimed.
  reasoning_layer_used: POB lexical decisions for ἐφανερώθη, ἑωράκαμεν, μαρτυροῦμεν, and ἀπαγγέλλομεν
  rationale: Breaking the long chain into three sentences makes each distinct action easy to follow.
- pob_phrase: the eternal life, which was with the Father
  simplified_phrase: the eternal life, which was with the Father
  preserved_meaning: The wording identifies the Son as life without replacing the source noun with a personal pronoun or name.
  reasoning_layer_used: POB theological decision on personal and nominal language
  rationale: This key wording remains unchanged because simplifying it to “he” would erase John’s life image.
