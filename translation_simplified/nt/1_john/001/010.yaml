simplification_decisions:
- pob_phrase: we make him a liar
  simplified_phrase: we are saying that he is a liar
  preserved_meaning: Denying that we have sinned directly treats God as a liar.
  reasoning_layer_used: The lexical decision for ποιοῦμεν αὐτὸν with ψεύστην preserves the force of declaring someone a liar.
  rationale: This wording explains the idiom without softening the accusation.
- pob_phrase: and his word is not in us
  simplified_phrase: His word[a] is not in us.
  preserved_meaning: God’s word is absent from those who deny their sin.
  reasoning_layer_used: The lexical decision for οὐκ ἔστιν ἐν ἡμῖν preserves the inward, relational sense.
  rationale: A separate sentence makes the conclusion easier to follow.
translation_notes:
