translation:
  language: en
  text: Everyone who believes that Jesus is the Messiah[a] has been born of God. Everyone who loves the God who gave them this new birth also loves everyone who has been born of God.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the Christ”; “Messiah” expresses the title’s meaning.
    reason: alternative_reading
  - marker: b
    text: The Greek uses forms of the same verb for God giving birth and people being born of him.
    reason: lexical_alternative
