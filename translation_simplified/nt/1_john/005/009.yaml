  preserved_meaning: The testimony is human in contrast with God’s, not limited to males.
  reasoning_layer_used: POB lexical decision and footnote a
  rationale: “People” makes the documented generic sense immediately clear.
- pob_phrase: receive the testimony
  simplified_phrase: accept testimony
  preserved_meaning: People treat human testimony as credible or valid.
  reasoning_layer_used: POB lexical decision for λαμβάνομεν
  rationale: “Accept” is the POB-listed alternative and is more natural here.
- pob_phrase: the testimony of God is greater, because this is the testimony of God
  simplified_phrase: God’s testimony is greater still. After all, this is God’s own testimony
  preserved_meaning: God’s testimony surpasses human testimony precisely because it is his testimony.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: Two sentences clarify the comparison and causal link while preserving the repeated key term.
