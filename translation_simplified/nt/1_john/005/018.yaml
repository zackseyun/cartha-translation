translation:
  language: en
  text: We know that those who have been born of God do not keep on sinning. Instead, the one who was born of God[a] guards them, and the evil one does not take hold of them to harm them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may instead mean, “those born of God guard themselves.” Many interpreters understand “the one who was born of God” as Jesus, who guards believers.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: everyone who has been born of God does not keep sinning
  simplified_phrase: those who have been born of God do not keep on sinning
  preserved_meaning: People born of God do not persist in sinful practice, though they may still sin.
  reasoning_layer_used: lexical and theological decisions on the Greek present tense
  rationale: This keeps the verbal focus on continuing sin without implying sinless perfection.
- pob_phrase: the one who was born of God keeps him
  simplified_phrase: the one who was born of God guards them
  preserved_meaning: The believer is protected while the identity of the one guarding remains ambiguous.
  reasoning_layer_used: lexical decision and documented syntactic ambiguity
  rationale: “Guards” makes the protective sense clear while the footnote preserves both readings.
- pob_phrase: the evil one does not touch him
  simplified_phrase: the evil one does not take hold of them to harm them
  preserved_meaning: Satan does not gain a harmful grasp on the believer.
  reasoning_layer_used: lexical decision for ἅπτεται and theological identification of the evil one
  rationale: The wording preserves the grasping image and explains its harmful force.
interpretive_expansions:
- pob_phrase: does not touch him
  rendering: does not take hold of them to harm them
  claim: The evil one’s touch means a harmful grasp rather than mere physical contact.
  evidence:
  - The lexical reasoning says ἅπτομαι can imply laying hold of someone to harm them.
  - The preceding statement that the believer is guarded supplies a protective context.
  confidence: high
  alternatives_preserved:
  - does not touch them
translation_notes:
  risk_flags:
  - risk: Readers may assume “the one who was born of God” certainly means Jesus.
    mitigation: The main text retains the ambiguous wording, and the footnote presents both major interpretations.
  - risk: The final clause could be mistaken for a promise of freedom from every kind of suffering.
    mitigation: The wording specifically describes the evil one’s harmful grasp rather than all suffering.
