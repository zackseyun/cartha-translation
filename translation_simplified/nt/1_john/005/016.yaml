  - he should pray for him
translation_notes:
  risk_flags:
  - risk: Readers may assume that “death” names one specific kind of death.
    mitigation: The main text remains unqualified, and footnote b preserves the documented possibilities.
  - risk: Making God explicit could hide that the Greek leaves the subject unstated.
    mitigation: Footnote c records the Greek form and the contextual basis for the clarification.
