translation:
  language: en
  text: If anyone sees his brother[a] committing a sin that does not lead to death,[b] he should ask God for him, and God will give him life.[c] This applies to those committing sins that do not lead to death. There is also sin that leads to death. I am not saying he should ask God about that.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “brother” likely means a fellow believer and may include a fellow Christian more broadly.
    reason: cultural_note
  - marker: b
    text: The Greek does not specify whether this death is physical death, spiritual death, or final condemnation.
    reason: alternative_reading
  - marker: c
    text: The Greek says “he will give him life”; God is understood as the giver in the context of prayer.
    reason: source_note
simplification_decisions:
- pob_phrase: he shall ask
  simplified_phrase: he should ask God for him
  preserved_meaning: The observer is directed to pray on behalf of the brother who sins.
  reasoning_layer_used: Lexical decision on αἰτήσει and the immediate prayer context
  rationale: The wording states the intended response in ordinary English without making it an absolute command.
- pob_phrase: God will give him life—to those committing sins not leading to death
  simplified_phrase: God will give him life. This applies to those committing sins that do not lead to death.
  preserved_meaning: God gives life in response to prayer for people whose sins do not lead to death.
  reasoning_layer_used: Lexical decisions on δώσει αὐτῷ ζωήν and the difficult plural dative phrase
  rationale: Two sentences replace the dense appositional construction while keeping both the singular brother and plural group.
- pob_phrase: There is sin leading to death
  simplified_phrase: There is also sin that leads to death
  preserved_meaning: Some sin belongs to a death-leading category without identifying one specific act.
  reasoning_layer_used: Lexical and theological decisions on ἔστιν ἁμαρτία πρὸς θάνατον
  rationale: Adding “also” clarifies the contrast while preserving the category’s deliberate vagueness.
interpretive_expansions:
- pob_phrase: he shall ask
  rendering: he should ask God for him
  claim: The request is prayer to God on behalf of the sinning brother.
  evidence:
