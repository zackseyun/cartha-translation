translation:
  language: en
  text: Whoever believes in the Son of God has this testimony within them.[a] Whoever does not believe God treats God as a liar,[b] because they have not believed God's testimony about his Son.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some manuscripts read “in him,” which may mean “in the Son,” rather than “within them.”
    reason: textual_variant
  - marker: b
    text: The Greek more literally says “has made him a liar”; rejecting God's testimony treats God as false.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: The one who believes
  simplified_phrase: Whoever believes
  preserved_meaning: The statement applies generally to any person who believes.
  reasoning_layer_used: POB lexical decision on ὁ πιστεύων
  rationale: “Whoever” expresses the generic meaning in more natural English.
- pob_phrase: has the testimony in himself
  simplified_phrase: has this testimony within them
  preserved_meaning: The believer possesses God's testimony internally.
  reasoning_layer_used: POB lexical and theological decisions on ἐν αὑτῷ
  rationale: “Within them” makes internal possession clear while using a natural generic pronoun.
- pob_phrase: has made him a liar
  simplified_phrase: treats God as a liar
  preserved_meaning: Rejecting God's testimony regards God as false.
  reasoning_layer_used: POB lexical rationale on ψεύστην πεποίηκεν αὐτόν
  rationale: The idiom is stated directly while preserving its forceful liar image.
interpretive_expansions:
