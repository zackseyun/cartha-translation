translation:
  language: en
  text: For every person born of God overcomes the world—the fallen order that opposes God. Our faith is the victory that has overcome it.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “our faithfulness.” The Greek word can mean faith, trust, or faithfulness; here “faith” best fits the context.
