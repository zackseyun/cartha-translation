simplification_decisions:
- pob_phrase: everyone who has been born of God
  simplified_phrase: every person born of God
  preserved_meaning: The wording still refers collectively to people whose birth from God has an ongoing result.
  reasoning_layer_used: Lexical and theological decisions on πᾶν τὸ γεγεννημένον
  rationale: Removing “who has been” makes the clause easier without changing its personal new-birth meaning.
- pob_phrase: the world
  simplified_phrase: the world—the fallen order that opposes God
  preserved_meaning: The Johannine image remains while its contextual sense is clarified.
  reasoning_layer_used: Lexical decision on κόσμον
  rationale: The brief explanation prevents readers from mistaking “world” for the planet or creation itself.
- pob_phrase: 'the world: our faith'
  simplified_phrase: it. Our faith is the victory
  preserved_meaning: Faith remains identified as the victory that has overcome the world.
  reasoning_layer_used: Lexical decision on αὕτη ἐστὶν ἡ νίκη and ἡ πίστις ἡμῶν
  rationale: Reordering the identification gives the second sentence a more natural English flow.
interpretive_expansions:
