  review_output_hash: d881552bb8b7a57d789ba9ea395d4fb5643659a96bdfe526cde7d08128cc13c3
  review_summary: The draft successfully makes the present/future contrast easier to read through shorter sentences and preserves the POB’s conditional passive wording, Christ-favored referent, and the alternative in a footnote. However, “Dearly loved friends” expands the source’s affectionate address beyond what the audit supports. “Loved ones” is common English, retains the love-language directly, and avoids introducing “friends” and “dearly.” The recommended text also restores the POB’s direct “We know that,” since “We know this:” can mildly make the following conditional clause sound like the full content of knowledge rather than preserving the original construction.
