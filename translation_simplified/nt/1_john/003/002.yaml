translation:
  language: en
  text: Loved ones, we are God’s children now. But what we will be has not yet been revealed. We know that if he is revealed,[a] we will be like him, because we will see him as he is.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek can also mean “if what we will be is revealed,” but the context favors Christ as the subject. It is often translated “when he appears.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Beloved
  simplified_phrase: Loved ones
  preserved_meaning: The address remains warm and identifies the readers as loved.
  reasoning_layer_used: Lexical decision for ἀγαπητοί
  rationale: This uses common English without adding friendship or extra intensity.
- pob_phrase: now we are children of God, and what we will be has not yet been revealed
  simplified_phrase: we are God’s children now. But what we will be has not yet been revealed.
  preserved_meaning: The readers’ present status remains contrasted with their unrevealed future state.
  reasoning_layer_used: Lexical decisions for νῦν, τέκνα θεοῦ, and οὔπω ἐφανερώθη
  rationale: Two short sentences make the present-future contrast easier to follow.
- pob_phrase: We know that if he is revealed
  simplified_phrase: We know that if he is revealed
  preserved_meaning: Christ remains the favored implicit subject while the conditional wording and passive voice are preserved.
  reasoning_layer_used: Theological decision on the referent of ἐὰν φανερωθῇ
  rationale: The direct construction avoids overstating the content of what is known.
translation_notes:
  risk_flags:
  - risk: The implicit Greek subject may refer to what believers will be rather than to Christ.
    mitigation: The footnote preserves this alternative and explains why the main text refers to Christ.
  - risk: “Like him” could be misunderstood as complete identity with Christ.
    mitigation: The wording states likeness, not sameness, in line with the lexical and theological decisions.
