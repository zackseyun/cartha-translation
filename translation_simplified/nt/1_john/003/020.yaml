translation:
  language: en
  text: For if our own heart says we are guilty, God is greater than our heart,[a] and he knows everything.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: God’s greatness is not limited to one meaning here. His complete knowledge is central, and the words may also include his authority over our self-condemnation.
    reason: alternative_reading
