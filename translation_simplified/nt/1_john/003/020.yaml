  preserved_meaning: The heart acts like an inner judge that finds us guilty.
  reasoning_layer_used: POB lexical decision for καταγινώσκῃ and καρδία
  rationale: This explains the judicial sense of “condemns” while keeping the heart image.
- pob_phrase: he knows all things
  simplified_phrase: he knows everything
  preserved_meaning: God’s knowledge is complete and comprehensive.
  reasoning_layer_used: POB lexical decision for γινώσκει πάντα
  rationale: “Everything” is more natural in common English and keeps the full scope.
