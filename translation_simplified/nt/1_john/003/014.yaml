translation:
  language: en
  text: We know we have passed out of death and into life because we love the brothers.[a] Anyone who does not love is still in death.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “brothers and sisters.” The Greek says “brothers,” but here it likely means fellow believers generally.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: have passed from death into life
  simplified_phrase: have passed out of death and into life
  preserved_meaning: A completed move from the realm of death into life has an ongoing result.
  reasoning_layer_used: Lexical decision for μεταβεβήκαμεν and ἐκ...εἰς
  rationale: Adding “out of” makes the movement image easier to grasp while preserving both directions.
- pob_phrase: The one who does not love remains in death
  simplified_phrase: Anyone who does not love is still in death
  preserved_meaning: A person characterized by not loving continues in the state or realm of death.
  reasoning_layer_used: Lexical decisions for ὁ μὴ ἀγαπῶν, μένει, and ἐν τῷ θανάτῳ
  rationale: “Anyone” and “is still” express the generic person and continuing state in natural English.
translation_notes:
  risk_flags:
  - risk: “Brothers” may sound as though only men are included.
    mitigation: The footnote preserves the likely inclusive reference to fellow believers.
  - risk: Readers may take “death” and “life” only as physical conditions.
    mitigation: The main text retains the source metaphor without narrowing its theological meaning.
