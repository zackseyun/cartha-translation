translation:
  language: en
  text: Everyone who has this hope fixed on him[a] purifies himself, just as he[b] is pure.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “has this hope in him.” The Greek can be understood either way; “fixed on him” makes the object of hope clear.
    reason: lexical_alternative
  - marker: b
    text: “He” most likely refers to the Son, Christ, though the Greek leaves the referent as a pronoun.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: has this hope set on him
  simplified_phrase: has this hope fixed on him
  preserved_meaning: This confident hope rests on and is directed toward him.
  reasoning_layer_used: Lexical decisions for ἐλπίδα and ἐπ’ αὐτῷ.
  rationale: “Fixed on him” states the direction of hope in natural modern English.
- pob_phrase: just as he is pure
  simplified_phrase: just as he is pure
  preserved_meaning: The person’s purification is compared with the purity of the unnamed referent.
  reasoning_layer_used: Theological decision on ἐκεῖνος and the grounding review.
  rationale: The natural pronoun preserves the ambiguity, while the footnote gives the likely referent.
translation_notes:
  risk_flags:
