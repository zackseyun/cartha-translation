translation:
  language: en
  text: 'See what kind of love the Father has given us: we are called children of God—and we truly are.[a] The world does not know us[b] because it did not know him.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some manuscripts do not include “and we are.”
    reason: textual_variant
  - marker: b
    text: Or “does not recognize us.”
    reason: lexical_alternative
  - marker: c
    text: “Him” most naturally refers to the Father here, though some understand it to refer to Christ.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: that we should be called children of God—and we are
  simplified_phrase: we are called children of God—and we truly are
  preserved_meaning: The Father's love results in believers being called God's children and actually being his children.
  reasoning_layer_used: Lexical decisions for ἵνα, κληθῶμεν, and καὶ ἐσμέν
  rationale: This removes the stiff “should be called” while preserving the emphatic affirmation.
- pob_phrase: For this reason the world does not know us
  simplified_phrase: The world does not know us
  preserved_meaning: The world's failure to know believers follows from their identity as God's children.
  reasoning_layer_used: Lexical decision for διὰ τοῦτο and immediate discourse logic
  rationale: The sentence sequence keeps the connection clear without a formal transition.
translation_notes:
  risk_flags:
  - risk: Omitting “For this reason” makes the logical link less explicit.
    mitigation: The immediate sequence still connects the world's response with believers' identity.
  - risk: Readers may assume “him” refers only to the Father.
    mitigation: The footnote preserves the possible reference to Christ.
