translation:
  language: en
  text: People who have been born of God do not make sin their way of life, because God's seed remains in them. They cannot keep on sinning, because they have been born of God.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “They cannot sin.” In context, this likely means they cannot continue in a settled pattern of sin.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Everyone who has been born of God does not practice sin
  simplified_phrase: People who have been born of God do not make sin their way of life
  preserved_meaning: New birth is incompatible with an ongoing pattern of sin, not every individual sinful act.
  reasoning_layer_used: Lexical and theological decisions on habitual sin
  rationale: The idiom “make sin their way of life” states the ongoing sense in natural English.
- pob_phrase: because his seed remains in him
  simplified_phrase: because God's seed remains in them
  preserved_meaning: The concrete seed metaphor remains without deciding whether it means God's word, life, or nature.
  reasoning_layer_used: Lexical and theological decisions on σπέρμα αὐτοῦ
  rationale: Naming God and using plural pronouns removes unclear references while preserving the debated image.
- pob_phrase: he is not able to keep sinning
  simplified_phrase: They cannot keep on sinning
  preserved_meaning: Those born of God cannot continue in habitual sin.
  reasoning_layer_used: Lexical decision on οὐ δύναται ἁμαρτάνειν
  rationale: The shorter wording is direct while retaining the present infinitive's likely ongoing force.
translation_notes:
  risk_flags:
  - risk: “Make sin their way of life” could sound broader than the Greek wording.
    mitigation: It is bounded by POB's documented choice that the verbs describe continuing or habitual sin.
  - risk: The seed metaphor may remain unclear to new readers.
    mitigation: The wording intentionally preserves the source's ambiguity rather than choosing a disputed interpretation.
