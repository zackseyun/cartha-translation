translation:
  language: en
  text: We must not be like Cain, who was from the evil one[a] and slaughtered[b] his brother. Why did he slaughter him? Because Cain’s deeds were evil, while his brother’s deeds were righteous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “from evil.” Here, “the evil one” most likely refers to Satan.
    reason: alternative_reading
  - marker: b
    text: Or “murdered.” “Slaughtered” preserves the Greek verb’s vivid force.
    reason: lexical_alternative
