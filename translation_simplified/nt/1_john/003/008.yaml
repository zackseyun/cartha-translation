translation:
  language: en
  text: 'Anyone who keeps on sinning as a way of life is from the devil,[a] because the devil has kept on sinning from the beginning. This is the very reason the Son of God was revealed: to destroy[b] the devil’s works.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “From the devil” describes moral and spiritual source or alignment, not literal birth from the devil.
    reason: simplification_note
  - marker: b
    text: The word translated “destroy” can also mean “undo” or “break up.”
    reason: lexical_alternative
