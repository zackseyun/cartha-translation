  preserved_meaning: His appearing had the purpose of taking away sins.
  reasoning_layer_used: Lexical decision for ἵνα and theological decision for αἴρω
  rationale: The infinitive states the same purpose in more natural English without choosing a specific atonement model.
- pob_phrase: and in him there is no sin
  simplified_phrase: There is no sin in him.
  preserved_meaning: He is completely without sin.
  reasoning_layer_used: Lexical decisions for ἁμαρτία and ἐν αὐτῷ
  rationale: A separate sentence makes the absolute statement easier to grasp while retaining the Johannine phrase “in him.”
