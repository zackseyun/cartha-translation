translation:
  language: en
  text: Anyone who keeps on sinning also practices lawlessness.[a] Sin is lawlessness.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek can be translated more literally as “does sin” and “does lawlessness.” In this context, the present forms refer to ongoing or characteristic conduct.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Everyone who practices sin
  simplified_phrase: Anyone who keeps on sinning
  preserved_meaning: The statement concerns ongoing or characteristic sinful conduct, not merely one isolated act.
  reasoning_layer_used: POB lexical and theological decisions on the present forms
  rationale: “Keeps on sinning” expresses the contextual force in natural common English.
- pob_phrase: also practices lawlessness
  simplified_phrase: also practices lawlessness
  preserved_meaning: The repeated action remains parallel to practicing sin and retains the key term “lawlessness.”
  reasoning_layer_used: POB lexical decision for καὶ τὴν ἀνομίαν ποιεῖ and grounding review
  rationale: Retaining “practices” avoids broadening the action into a general manner of life.
- pob_phrase: and sin is lawlessness
  simplified_phrase: Sin is lawlessness
  preserved_meaning: John directly defines sin as lawlessness rather than merely describing its result.
  reasoning_layer_used: POB lexical and theological decisions for ἀνομία
  rationale: A new sentence makes the stark definition easier to read without weakening it.
