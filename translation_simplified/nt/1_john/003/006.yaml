translation:
  language: en
  text: Those who stay united with him do not keep on sinning.[a] Those who keep on sinning have not seen him or known him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “do not sin ... those who sin.” Here the Greek forms may describe ongoing or characteristic action.
    reason: lexical_alternative
