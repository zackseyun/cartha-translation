  rationale: “Stay united with him” makes the relational image easier for a new reader to understand.
- pob_phrase: does not sin ... everyone who sins
  simplified_phrase: do not keep on sinning ... Those who keep on sinning
  preserved_meaning: The verse describes ongoing or characteristic sin rather than one isolated act.
  reasoning_layer_used: POB lexical and theological decisions on the Greek present forms
  rationale: The repeated phrase clearly preserves the verse’s parallel structure and ethical force.
- pob_phrase: nor known him
  simplified_phrase: or known him
  preserved_meaning: Under the shared negative, both seeing and knowing him are denied.
  reasoning_layer_used: POB lexical decision for οὐδὲ ἔγνωκεν
  rationale: “Has not ... or ...” is more natural common English than “has not ... nor ...” here.
