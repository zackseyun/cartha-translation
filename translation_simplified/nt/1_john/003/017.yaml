translation:
  language: en
  text: If someone has this world’s material resources and sees his brother in need but closes his heart to him, how does the love of God remain in him?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Brother” may represent a brother or sister who is a fellow believer.
    reason: lexical_alternative
  - marker: b
    text: “The love of God” may mean God’s love present in him or his love for God.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: whoever has the world's goods
  simplified_phrase: if someone has this world’s material resources
  preserved_meaning: The person possesses material means that could help meet another believer’s need.
  reasoning_layer_used: POB lexical decision for βίον τοῦ κόσμου
  rationale: “Material resources” clearly expresses the practical sense of “goods.”
- pob_phrase: But whoever ... and sees ... yet closes
  simplified_phrase: If someone ... and sees ... but closes
  preserved_meaning: The verse directly contrasts having resources and seeing need with deliberately withholding compassion.
  reasoning_layer_used: Source syntax, POB translation, and grounding review
  rationale: A direct conditional removes the added hypothetical prompt while keeping the rhetorical test clear.
- pob_phrase: closes his heart against him
  simplified_phrase: closes his heart to him
  preserved_meaning: The person deliberately withholds heartfelt compassion from his needy brother.
  reasoning_layer_used: POB lexical rationale for κλείσῃ τὰ σπλάγχνα αὐτοῦ ἀπ’ αὐτοῦ
  rationale: The familiar expression preserves both the heart image and the deliberate refusal.
translation_notes:
  risk_flags:
