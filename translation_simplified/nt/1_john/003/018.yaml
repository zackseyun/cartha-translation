simplification_decisions:
- pob_phrase: in word or with the tongue
  simplified_phrase: with words or speech
  preserved_meaning: Love must not remain only a verbal expression.
  reasoning_layer_used: Lexical decisions for λόγῳ and γλώσσῃ
  rationale: Common wording clarifies the idiom while the footnote preserves the tongue image.
- pob_phrase: but in deed
  simplified_phrase: Instead, let us love through our actions
  preserved_meaning: The strong contrast calls for love expressed in what people do.
  reasoning_layer_used: Lexical decisions for ἀλλά and ἔργον
  rationale: A new sentence and active wording make the contrast immediately clear.
- pob_phrase: and truth
  simplified_phrase: and in truth
  preserved_meaning: Love is genuine and consistent with God’s truth without reducing truth to sincerity alone.
  reasoning_layer_used: Theological decision on ἀλήθεια
  rationale: Retaining “truth” protects its broader Johannine meaning.
interpretive_expansions:
- pob_phrase: let us not love in word or with the tongue
  rendering: let us not love merely with words or speech
  claim: The verse rejects love limited to verbal expression, not loving words themselves.
  evidence:
