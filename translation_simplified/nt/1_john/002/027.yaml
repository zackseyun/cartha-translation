translation:
  language: en
  text: As for you, the anointing you received from him remains in you. You do not need anyone to teach you. His anointing teaches you about everything, and it is true, not a lie. Just as it taught you, remain in him.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The same Greek verb is translated “remains” and “remain” in this verse.
    reason: lexical_alternative
  - marker: b
    text: Some manuscripts read, “Just as it taught you, you remain in him.”
    reason: textual_variant
simplification_decisions:
- pob_phrase: the anointing that you received from him remains in you
  simplified_phrase: the anointing you received from him remains in you
  preserved_meaning: The received anointing continues to be present in the believers.
  reasoning_layer_used: lexical decision for χρῖσμα and μένει ἐν ὑμῖν
  rationale: The shorter clause keeps both the anointing metaphor and the Johannine language of remaining.
- pob_phrase: you have no need that anyone should teach you
  simplified_phrase: You do not need anyone to teach you.
  preserved_meaning: The verse directly states that no other teacher is needed without defining the statement more narrowly or absolutely.
  reasoning_layer_used: lexical and theological decisions on οὐ χρείαν ἔχετε ἵνα τις διδάσκῃ ὑμᾶς
  rationale: Ordinary English removes the awkward clause structure while preserving the full force of the statement.
- pob_phrase: as his anointing teaches you about all things, and is true and is not a lie
  simplified_phrase: His anointing teaches you about everything, and it is true, not a lie.
  preserved_meaning: The anointing teaches comprehensively and stands in direct contrast to falsehood.
  reasoning_layer_used: lexical decisions for περὶ πάντων, ἀληθές, and ψεῦδος
  rationale: A new sentence and common wording make the thought easier to follow without narrowing its scope.
translation_notes:
  risk_flags:
  - risk: Readers may take “You do not need anyone to teach you” as an absolute rejection of all human teachers.
    mitigation: The translation leaves the statement unexpanded so its immediate context can govern its scope.
  - risk: Readers may assume the anointing is explicitly identified as the Holy Spirit in the source text.
    mitigation: The main text preserves the source metaphor without adding a doctrinal identification.
