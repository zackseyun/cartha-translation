simplification_decisions:
- pob_phrase: Everyone who denies the Son does not have the Father either
  simplified_phrase: Those who deny the Son do not have the Father either
  preserved_meaning: The statement still applies universally to all who deny the Son.
  reasoning_layer_used: Lexical decisions for πᾶς ὁ ἀρνούμενος, ἀρνούμενος, and οὐδὲ
  rationale: The plural form is easier to follow while preserving the generic scope and the force of denial.
- pob_phrase: whoever confesses the Son has the Father also
  simplified_phrase: But those who confess the Son also have the Father
  preserved_meaning: Confessing the Son remains inseparably connected with having the Father.
  reasoning_layer_used: Lexical decisions for ὁ ὁμολογῶν and καὶ, plus the theological decision on τὸν πατέρα ἔχει
  rationale: A new sentence and explicit contrast make the parallel clear without weakening “confesses” or paraphrasing “have the Father.”
translation_notes:
  risk_flags:
  - risk: “Have the Father” may remain unfamiliar to some readers.
    mitigation: It is retained because the POB audit deliberately preserves this broad Johannine expression rather than narrowing it to fellowship or belonging.
