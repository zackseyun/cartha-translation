simplification_decisions:
- pob_phrase: you have an anointing from the Holy One
  simplified_phrase: the Holy One has given you an anointing
  preserved_meaning: The anointing comes from the Holy One and belongs to the readers.
  reasoning_layer_used: Lexical decisions for χρῖσμα, ἔχετε, and ἀπὸ τοῦ ἁγίου
  rationale: The active wording makes the source of the anointing easier to follow while retaining the biblical image.
- pob_phrase: you all know
  simplified_phrase: every one of you knows
  preserved_meaning: The best-supported reading refers to all the readers, not to knowing all things.
  reasoning_layer_used: Textual and lexical decision for πάντες
  rationale: This wording clearly shows that “all” describes the people who know.
interpretive_expansions:
- pob_phrase: have an anointing from the Holy One
  rendering: the Holy One has given you an anointing
  claim: The readers possess the anointing because it comes to them from the Holy One.
  evidence:
  - The source phrase says the anointing is “from the Holy One.”
  - POB describes it as a bestowed anointing from God.
  confidence: high
  alternatives_preserved:
  - The anointing may refer to the Holy Spirit or the Spirit’s work.
  - The Holy One may refer to the Father or the Son.
translation_notes:
  risk_flags:
