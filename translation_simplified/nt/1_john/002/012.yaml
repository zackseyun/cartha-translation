translation:
  language: en
  text: Little children, your sins have been forgiven for the sake of his name.[a] That is why I am writing to you.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “His” may refer to God or to Jesus; the Greek does not identify the referent here.
    reason: alternative_reading
  - marker: b
    text: The Greek may instead mean, “I am writing to tell you that your sins have been forgiven.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: I am writing to you, little children, because your sins have been forgiven
  simplified_phrase: Little children, your sins have been forgiven ... That is why I am writing to you.
  preserved_meaning: John addresses his readers affectionately and gives their forgiveness as the reason for writing.
  reasoning_layer_used: POB lexical decisions for τεκνία and ὅτι
  rationale: Reordering the cause before the result makes the relationship easier to follow without changing it.
- pob_phrase: for the sake of his name
  simplified_phrase: for the sake of his name
  preserved_meaning: Forgiveness rests on the personal and theological significance of his name.
  reasoning_layer_used: POB lexical and theological decisions for διὰ τὸ ὄνομα αὐτοῦ
  rationale: The biblical phrase is retained because replacing “name” would weaken its theological force.
translation_notes:
  risk_flags:
  - risk: Modern readers may assume that “his” must refer to Jesus or must refer to God.
    mitigation: Footnote a preserves the unresolved referent documented by POB.
  - risk: Dividing and reordering the sentence may make the causal reading seem exclusive.
    mitigation: Footnote b preserves the alternative content reading of the Greek conjunction.
