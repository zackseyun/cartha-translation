translation:
  language: en
  text: So now, little children, remain in him. Do this so that, if he is revealed,[a] we may be confident when he comes[c] and not shrink away from him in shame.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Or “if he appears.” The Greek expression is passive: “is revealed.”'
    reason: lexical_alternative
  - marker: b
    text: Or “be ashamed before him.” The wording may describe shame in his presence rather than shrinking away from him.
    reason: alternative_reading
  - marker: c
    text: Or “in his presence.” Here the Greek term refers to Christ’s future coming.
    reason: lexical_alternative
