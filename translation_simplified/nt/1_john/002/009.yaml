simplification_decisions:
- pob_phrase: The one who says he is
  simplified_phrase: Anyone who claims to be
  preserved_meaning: A representative person says that he occupies this spiritual state.
  reasoning_layer_used: Lexical decision for ὁ λέγων and the contrast within the verse
  rationale: “Anyone who claims” makes the representative statement and its contradiction easier to grasp.
- pob_phrase: and hates his brother
  simplified_phrase: but hates his brother
  preserved_meaning: Hatred stands in direct conflict with the person's claim to be in the light.
  reasoning_layer_used: Immediate clause contrast and preserved Johannine light-darkness imagery
  rationale: “But” states the contrast that the Greek conjunction carries in context.
- pob_phrase: until now
  simplified_phrase: still
  preserved_meaning: The person remains in darkness up to the present despite his claim.
  reasoning_layer_used: Lexical decision for ἕως ἄρτι
  rationale: “Still” expresses the continuing present condition in natural English.
