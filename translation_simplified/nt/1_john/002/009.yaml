translation:
  language: en
  text: Anyone who claims to be in the light but hates his brother[a] is still in the darkness.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “brother or sister.” Here the Greek word “brother” may represent either one.
