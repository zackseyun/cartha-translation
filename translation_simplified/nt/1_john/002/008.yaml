translation:
  language: en
  text: Yet I am also writing you a new commandment. It is true in him[a] and in you, because the darkness is passing away and the true light is already shining.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “It is true in the commandment and in you,” if the pronoun refers to the commandment rather than to Christ.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Again, I am writing to you a new commandment
  simplified_phrase: Yet I am also writing you a new commandment.
  preserved_meaning: John now presents the commandment as new in another sense, while retaining its Johannine title.
  reasoning_layer_used: Lexical decisions for πάλιν and ἐντολὴν καινὴν
  rationale: “Yet ... also” makes the contrast with the preceding verse clearer without changing the commandment’s meaning.
- pob_phrase: which is true in him and in you
  simplified_phrase: It is true in him and in you
  preserved_meaning: The commandment is a genuine reality in Christ and in the readers.
  reasoning_layer_used: Lexical and theological decisions for ὅ, ἀληθές, and ἐν αὐτῷ
  rationale: A new sentence removes the difficult relative clause while keeping Christ as the main referent.
translation_notes:
  risk_flags:
  - risk: “Yet I am also” interprets πάλιν as marking contrast as well as continuation.
    mitigation: The lexical rationale explicitly allows a renewed or contrasting statement, while the wording remains restrained.
  - risk: The pronoun in “in him” may instead refer to the commandment.
    mitigation: The main text keeps POB’s preferred personal reference, and footnote [a] preserves the alternative.
