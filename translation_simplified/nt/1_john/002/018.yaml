  preserved_meaning: The last hour is present, and current events correspond to the readers’ prior instruction.
  reasoning_layer_used: Lexical and theological decisions on “the last hour” and καθὼς.
  rationale: The sentence break improves clarity while “just as” preserves the explicit correspondence.
- pob_phrase: many antichrists have arisen
  simplified_phrase: many antichrists have appeared
  preserved_meaning: Many figures described by the same term have emerged and remain present.
  reasoning_layer_used: Lexical decision for γεγόνασιν.
  rationale: “Have appeared” is common English and retains the verb’s present result.
- pob_phrase: From this we know
  simplified_phrase: This is how we know
  preserved_meaning: The presence of many antichrists is evidence that this is the last hour.
  reasoning_layer_used: Lexical decision for ὅθεν and immediate context.
  rationale: The recast states the inference in natural English.
translation_notes:
  risk_flags:
