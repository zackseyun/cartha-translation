translation:
  language: en
  text: The world[a] is passing away, and so are its wrong desires. But whoever does God’s will remains forever.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “the world” means the human world in rebellion against God, not the physical creation itself.
    reason: simplification_note
simplification_decisions:
- pob_phrase: along with its desire
  simplified_phrase: and so are its wrong desires
  preserved_meaning: The world’s disordered desires share in its ongoing passing away.
  reasoning_layer_used: Lexical decision for ἐπιθυμία and the immediate context of 1 John 2:15–16
  rationale: The new clause is easier to follow, and the plural expresses the collective sense naturally.
- pob_phrase: the one who does
  simplified_phrase: whoever does
  preserved_meaning: Any person characterized by doing God’s will is in view.
  reasoning_layer_used: Lexical decision for ὁ δὲ ποιῶν
  rationale: “Whoever” removes a stiff construction while preserving its representative force.
interpretive_expansions:
- pob_phrase: its desire
  rendering: its wrong desires
  claim: The desires associated with the world are morally disordered, not neutral desires.
  evidence:
  - The immediate context names sinful desire and pride as belonging to the world.
  - The POB lexical rationale identifies a broad negative moral sense.
  confidence: high
  alternatives_preserved:
  - its desires
  - its cravings
