translation:
  language: en
  text: Beloved, the commandment I am writing to you is not new. It is an old commandment, one you have had from the beginning. This old commandment is the message[a] you heard.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “word.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: I am not writing a new commandment to you, but an old commandment
  simplified_phrase: the commandment I am writing to you is not new. It is an old commandment
  preserved_meaning: John contrasts a new commandment with the old one he is writing about.
  reasoning_layer_used: POB lexical decisions for γράφω, καινήν, παλαιάν, and ἐντολήν
  rationale: Two direct sentences make the contrast easier to follow while retaining “commandment,” “new,” and “old.”
- pob_phrase: that you have had from the beginning
  simplified_phrase: one you have had from the beginning
  preserved_meaning: The readers have possessed this commandment continuously since the unspecified beginning.
  reasoning_layer_used: POB lexical and theological decisions for εἴχετε and ἀπ’ ἀρχῆς
  rationale: The shorter relative clause preserves both continued possession and the deliberate ambiguity of “the beginning.”
- pob_phrase: The old commandment is the message that you heard
  simplified_phrase: This old commandment is the message you heard
  preserved_meaning: The old commandment is identified directly with the proclaimed message the readers heard.
  reasoning_layer_used: POB lexical and theological decisions for λόγος and ἠκούσατε
  rationale: Removing the unnecessary relative pronoun produces natural English without explaining or harmonizing the equation.
translation_notes:
  risk_flags:
  - risk: “Beloved” may sound less familiar than “dear friends” to some modern readers.
    mitigation: It is retained because POB treats its connection with John’s language of love as important.
  - risk: “From the beginning” could be understood in more than one way.
    mitigation: The wording remains undefined so the POB’s documented Johannine ambiguity is preserved.
