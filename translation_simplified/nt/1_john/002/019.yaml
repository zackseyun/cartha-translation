translation:
  language: en
  text: They went out from among us, but they did not belong with us. If they had belonged with us, they would have remained with us. But this happened so that it would become clear that not everyone belongs with us.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: They went out from us
  simplified_phrase: They went out from among us
  preserved_meaning: They departed from the community while the concrete image of going out remains.
  reasoning_layer_used: POB lexical decisions for ἐξῆλθαν and the first ἐξ ἡμῶν
  rationale: “From among us” clearly identifies the group they left without labeling the departure itself as apostasy.
- pob_phrase: they were not of us
  simplified_phrase: they did not belong with us
  preserved_meaning: They lacked the relational belonging expressed by “of us.”
  reasoning_layer_used: POB lexical and theological decisions for οὐκ ἦσαν ἐξ ἡμῶν
  rationale: “Belong with us” explains the idiom without adding “truly” or defining their spiritual status.
- pob_phrase: not all are of us
  simplified_phrase: not everyone belongs with us
  preserved_meaning: The broad conclusion denies that every person in view belongs with the community.
  reasoning_layer_used: POB lexical rationale for ὅτι οὐκ εἰσὶν πάντες ἐξ ἡμῶν
  rationale: “Not everyone” is natural English and avoids narrowing the clause to people currently among the group.
interpretive_expansions:
- pob_phrase: of us
  rendering: belong with us
  claim: The phrase describes relational belonging rather than merely physical location or association.
  evidence:
  - The POB lexical rationale identifies belonging or identity as the contextual sense.
  - The contrast with going out and remaining supports relational belonging.
  confidence: high
  alternatives_preserved:
  - The text does not define this as formal church membership.
  - The text does not state that they were never saved or never believers.
translation_notes:
  risk_flags:
  - risk: “Belong with us” could still be interpreted through later doctrines of church membership or perseverance.
    mitigation: The wording keeps community language and does not introduce “church,” “saved,” “believers,” or “truly.”
