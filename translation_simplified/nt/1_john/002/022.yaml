translation:
  language: en
  text: Who, then, is the liar? It is the person who denies that Jesus is the Messiah. That person is the antichrist—the one who denies the Father and the Son.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the Christ.” Here the Greek title means “the Messiah.”
    reason: alternative_reading
  - marker: b
    text: Or simply “antichrist.” Here the term may describe this kind of opponent, not only one particular end-time figure.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Who is the liar except the one who denies
  simplified_phrase: Who, then, is the liar? It is the person who denies
  preserved_meaning: The person characterized by this denial is identified as the liar.
  reasoning_layer_used: Lexical decision for ψεύστης and ἀρνούμενος
  rationale: Two direct sentences make the rhetorical identification easier to follow.
- pob_phrase: This is the antichrist
  simplified_phrase: That person is the antichrist
  preserved_meaning: The description points back to the person who denies Jesus as Messiah.
  reasoning_layer_used: Lexical decision for οὗτός ἐστιν and theological decision for ἀντίχριστος
  rationale: Naming the referent removes an unclear pronoun without narrowing the term.
translation_notes:
  risk_flags:
  - risk: Modern readers may assume “the antichrist” means only one future individual.
    mitigation: Footnote b preserves the Johannine possibility that the term describes a kind of opponent.
