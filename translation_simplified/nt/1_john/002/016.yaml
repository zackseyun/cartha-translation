translation:
  language: en
  text: For everything in the world—what the flesh desires[a], what the eyes desire, and boastful pride in the things of this life—does not come from the Father. It comes from the world.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Flesh” can refer to fallen human nature, and its desires are not limited to sexual desire.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: the desire of the flesh
  simplified_phrase: what the flesh desires
  preserved_meaning: The wording keeps “flesh” and its broad range of wrongful desires.
  reasoning_layer_used: Lexical and theological decisions for σάρξ and ἐπιθυμία.
  rationale: The verbal clause is easier to understand while preserving the key biblical term.
- pob_phrase: the desire of the eyes
  simplified_phrase: what the eyes desire
  preserved_meaning: The eyes remain the source or sphere of desire in the image.
  reasoning_layer_used: Lexical decision for τῶν ὀφθαλμῶν.
  rationale: The clause uses ordinary English without weakening the source image.
- pob_phrase: is not from the Father, but is from the world
  simplified_phrase: does not come from the Father. It comes from the world.
  preserved_meaning: The contrast between the two sources remains explicit and parallel.
  reasoning_layer_used: Lexical and theological decisions for ἐκ and κόσμος.
  rationale: Two short sentences make the central contrast easier to follow.
interpretive_expansions:
- pob_phrase: the pride of life
  rendering: boastful pride in the things of this life
  claim: The phrase concerns arrogant pride connected with one's present life or means of living without limiting it to specific examples.
  evidence:
  - The lexical rationale says βίος can refer broadly to one's manner or means of living.
  - The POB footnote presents status, possessions, and way of life only as possible inclusions.
  confidence: moderate
  alternatives_preserved:
  - arrogance of life
  - pretension of worldly living
translation_notes:
  risk_flags:
  - risk: Modern readers may take “world” to mean the physical creation or every person in it.
    mitigation: The listed desires and contrast with the Father preserve the contextual sense without replacing “world.”
  - risk: “Flesh” may be understood only as the physical body or sexual desire.
    mitigation: The anchored footnote preserves its broader metaphorical possibility.
