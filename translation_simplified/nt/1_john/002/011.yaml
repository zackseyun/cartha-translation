  simplified_phrase: whoever hates his brother
  preserved_meaning: This describes any person whose characteristic stance is hatred toward a brother.
  reasoning_layer_used: Lexical decision for μισῶν and theological decision on ἀδελφὸν
  rationale: “Whoever” is more direct while retaining “brother” as the source-driven wording.
- pob_phrase: is in the darkness and walks in the darkness
  simplified_phrase: is in the darkness and walks in it
  preserved_meaning: The person remains within darkness and conducts life under its influence.
  reasoning_layer_used: Lexical decisions for ἐν τῇ σκοτίᾳ and περιπατεῖ
  rationale: The pronoun removes heavy repetition without replacing the important walking image.
- pob_phrase: and does not know where he is going
  simplified_phrase: He does not know where he is going
  preserved_meaning: Hatred leaves the person unable to recognize his direction.
  reasoning_layer_used: Lexical decision for οὐκ οἶδεν ποῦ ὑπάγει
  rationale: A new sentence makes the movement of thought easier to follow.
