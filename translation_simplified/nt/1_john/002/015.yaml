translation:
  language: en
  text: Do not set your love on the world[a] or anything in it. If anyone loves the world, the love of the Father is not in him.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “the world” refers to the human order opposed to God, not to God’s creation or people as such.
    reason: simplification_note
  - marker: b
    text: “The love of the Father” most likely means “love for the Father,” though it may also mean “the Father’s love.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Do not love the world
  simplified_phrase: Do not set your love on the world
  preserved_meaning: The command forbids giving one’s love and allegiance to the world opposed to God.
  reasoning_layer_used: Lexical decision for ἀγαπᾶτε and theological decision on κόσμος
  rationale: “Set your love on” makes the directed attachment clear without changing the general prohibition.
- pob_phrase: or the things in the world
  simplified_phrase: or anything in it
  preserved_meaning: The prohibition includes what belongs to the world and attracts desire or allegiance.
  reasoning_layer_used: Lexical decision for μηδὲ τὰ ἐν τῷ κόσμῳ
  rationale: The shorter wording is natural English and retains the phrase’s full scope.
- pob_phrase: the love of the Father is not in him
  simplified_phrase: the love of the Father is not in him
  preserved_meaning: The wording preserves both the likely sense of love for the Father and the possible sense of the Father’s love.
  reasoning_layer_used: Lexical and theological decisions on ἡ ἀγάπη τοῦ πατρὸς and ἐν αὐτῷ
  rationale: This phrase remains unchanged because simplifying it would resolve a documented ambiguity.
translation_notes:
  risk_flags:
  - risk: Modern readers may take “the world” to mean creation or humanity in general.
    mitigation: Footnote a states the contextual ethical sense without replacing the biblical term.
  - risk: “The love of the Father” remains ambiguous in English as it is in Greek.
    mitigation: Footnote b gives the likely meaning while preserving the alternate reading.
