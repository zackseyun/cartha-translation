translation:
  language: en
  text: Children, I have written to you because you have come to know the Father. Fathers, I have written to you because you have come to know the one who is from the beginning.[a] Young men, I have written to you because you are strong, because God’s word remains in you, and because you have overcome the evil one.
  philosophy: optimal-equivalence
  footnotes:
