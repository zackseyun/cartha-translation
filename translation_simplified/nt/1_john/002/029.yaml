translation:
  language: en
  text: If you know that he[a] is righteous, then you also know that everyone who keeps doing what is right has been born of him.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “He” and “him” may refer either to God the Father or to the Son; the Greek does not specify which one.
    reason: alternative_reading
  - marker: b
    text: Or “born from him.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: you know that everyone who practices righteousness
  simplified_phrase: then you also know that everyone who keeps doing what is right
  preserved_meaning: Right conduct is a person’s continuing pattern of life.
  reasoning_layer_used: The lexical decision for πᾶς ὁ ποιῶν and τὴν δικαιοσύνην.
  rationale: “Keeps doing what is right” makes habitual righteous conduct immediately clear.
- pob_phrase: If you know ... you know
  simplified_phrase: If you know ... then you also know
  preserved_meaning: The second knowledge follows from the first.
  reasoning_layer_used: The source conditional and repeated knowledge verbs.
  rationale: “Then” and “also” clarify the sentence’s logical flow without changing its claim.
translation_notes:
  risk_flags:
  - risk: Readers may assume the pronouns name either the Father or the Son with certainty.
    mitigation: Footnote a preserves the source text’s unresolved referent.
  - risk: Replacing the second “righteousness” with common wording may make the repeated word-family less visible.
    mitigation: The main text retains “righteous” and describes the corresponding conduct as doing what is right.
