translation:
  language: en
  text: This is evidence that God's judgment is righteous,[a] so that you may be counted worthy of his kingdom.[b] You are also suffering for that kingdom.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a sign that God's judgment is righteous.”
    reason: lexical_alternative
  - marker: b
    text: 'The Greek may express either purpose or result: “so that” or “with the result that” you are counted worthy.'
    reason: alternative_reading
  - marker: c
    text: Or “suffering for the sake of that kingdom.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the righteous judgment of God
  simplified_phrase: God's judgment is righteous
  preserved_meaning: God's judgment has the same stated moral quality of righteousness.
  reasoning_layer_used: POB lexical decision for δικαίας κρίσεως
  rationale: The adjective-noun phrase becomes a direct clause that is easier to understand.
- pob_phrase: the kingdom of God, for which you are also suffering
  simplified_phrase: his kingdom. You are also suffering for that kingdom
  preserved_meaning: Their ongoing suffering remains connected to God's kingdom.
  reasoning_layer_used: POB lexical decisions for βασιλείας τοῦ θεοῦ and ὑπὲρ ἧς
  rationale: A separate sentence replaces the dense relative clause without weakening the connection.
- pob_phrase: so that you may be counted worthy
  simplified_phrase: so that you may be counted worthy
  preserved_meaning: God considers them worthy rather than suffering making them inherently worthy.
  reasoning_layer_used: POB lexical and theological decisions for εἰς τὸ καταξιωθῆναι
  rationale: The phrase is retained because it is already clear and protects the passive sense.
translation_notes:
  risk_flags:
  - risk: Readers may think suffering earns entry into God's kingdom.
    mitigation: “Counted worthy” preserves God's judgment rather than implying merit.
  - risk: “So that” may sound exclusively purposive though the Greek may indicate result.
    mitigation: Footnote b preserves both possibilities.
