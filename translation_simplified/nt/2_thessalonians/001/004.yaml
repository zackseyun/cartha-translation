translation:
  language: en
  text: So we ourselves boast about you among God’s churches. We tell them about your perseverance and faith as you endure all the persecution and suffering you are facing.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “faithfulness”; the word can refer either to faith or to steadfast loyalty, especially during suffering.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: among the churches of God
  simplified_phrase: among God’s churches
  preserved_meaning: The churches are assemblies that belong to God.
  reasoning_layer_used: POB lexical decision for ἐν ταῖς ἐκκλησίαις τοῦ θεοῦ
  rationale: The possessive form is shorter and more natural without changing the relationship to God.
- pob_phrase: because of your perseverance and faith
  simplified_phrase: We tell them about your perseverance and faith
  preserved_meaning: Their perseverance and faith are the grounds for Paul and his companions to boast.
  reasoning_layer_used: POB lexical decisions for ἐν ὑμῖν, ἐγκαυχᾶσθαι, and ὑπὲρ
  rationale: A second sentence makes the content and basis of the boasting easier to follow.
- pob_phrase: in all your persecutions and afflictions that you are enduring
  simplified_phrase: as you endure all the persecution and suffering you are facing
  preserved_meaning: Their faith and perseverance continue amid hostile oppression and broader suffering.
  reasoning_layer_used: POB lexical decisions for διωγμοῖς, θλίψεσιν, and αἷς ἀνέχεσθε
  rationale: Common wording preserves both kinds of hardship and their ongoing endurance.
translation_notes:
  risk_flags:
  - risk: Modern readers may hear “boast” as sinful self-praise.
    mitigation: Keeping “about you” and naming their perseverance and faith makes the positive basis clear.
  - risk: The main text’s “faith” may also carry the sense of faithfulness.
    mitigation: The footnote preserves that documented alternative without overriding the POB choice.
