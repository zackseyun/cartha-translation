translation:
  language: en
  text: These people will suffer the penalty of eternal destruction, away from the presence of the Lord and from the glory of his power.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or possibly, “destruction that comes from the presence of the Lord and from the glory of his power.” The Greek can mean either separation from or origin from.
