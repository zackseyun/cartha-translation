simplification_decisions:
- pob_phrase: These
  simplified_phrase: These people
  preserved_meaning: The phrase points back to the persecutors and opponents mentioned just before this verse.
  reasoning_layer_used: POB lexical decision for οἵτινες
  rationale: Adding “people” makes the reference immediately clear in common English.
- pob_phrase: will pay the penalty
  simplified_phrase: will suffer the penalty
  preserved_meaning: They will incur a judicial punishment.
  reasoning_layer_used: POB lexical decision for δίκην τίσουσιν
  rationale: “Suffer the penalty” states the legal consequence without the less direct payment idiom.
- pob_phrase: the glory of his might
  simplified_phrase: the glory of his power
  preserved_meaning: The phrase describes the glory belonging to or displaying the Lord’s strength.
  reasoning_layer_used: POB lexical decision for δόξα and ἰσχύς
  rationale: “Power” is more familiar than “might” while preserving the force of the phrase.
translation_notes:
  risk_flags:
  - risk: “Away from” could obscure the grammatically possible source reading of the Greek preposition.
    mitigation: The footnote preserves the alternative that the destruction comes from the Lord’s presence.
  - risk: “Eternal destruction” may be read as settling the precise nature of final punishment.
    mitigation: The wording remains unchanged and does not specify annihilation or eternal conscious punishment.
