translation:
  language: en
  text: On that day, he will come to be glorified among his saints—his holy people.[a] All who have believed will marvel at him. You will be among them because you believed the testimony we gave you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “in his saints”; this can suggest that his glory will be displayed in his holy people.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: among his saints
  simplified_phrase: among his saints—his holy people
  preserved_meaning: The saints are Christ’s holy people, not merely a specially recognized class of Christians.
  reasoning_layer_used: POB lexical and theological decisions on ἐν τοῖς ἁγίοις αὐτοῦ
  rationale: The gloss explains the biblical term while retaining it.
- pob_phrase: to be marveled at among all who have believed
  simplified_phrase: All who have believed will marvel at him
  preserved_meaning: Everyone who believed will respond to Christ with astonished admiration.
  reasoning_layer_used: POB lexical decisions on θαυμασθῆναι and πιστεύσασιν
  rationale: The active sentence is easier to follow and keeps the force of “marveled at.”
- pob_phrase: our testimony to you was believed
  simplified_phrase: you believed the testimony we gave you
  preserved_meaning: The Thessalonians believed the apostolic testimony delivered to them.
  reasoning_layer_used: POB lexical decisions on ἐπιστεύθη, μαρτύριον, and ἐφ’ ὑμᾶς
  rationale: The active wording identifies the hearers directly without changing what they believed.
interpretive_expansions:
- pob_phrase: because our testimony to you was believed
  rendering: You will be among them because you believed the testimony we gave you.
  claim: The Thessalonian readers are included among those who believed and will marvel at Christ.
  evidence:
  - The POB rationale says ὅτι explains why the Thessalonians are included among those who believed.
  - The context addresses the testimony delivered to and believed by “you.”
  confidence: high
translation_notes:
  risk_flags:
  - risk: Dividing the verse may reduce the visible parallel between Christ being glorified and marveled at.
    mitigation: The future statements and shared setting preserve the coordinated responses.
  - risk: “Among” may understate the possible sense that Christ’s glory is displayed in his people.
    mitigation: Footnote [a] preserves “in his saints” as a live alternative without making its implication definitive.
