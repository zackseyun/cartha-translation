translation:
  language: en
  text: Do not quickly become unsettled in your thinking or alarmed by any claim supposedly from us—whether it comes through a spirit,[a] a spoken message, or a letter—that says the day of the Lord has come.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a spiritual utterance” or “a prophetic revelation.”
    reason: lexical_alternative
  - marker: b
    text: Or “is already here.” The Greek can describe the day of the Lord as having arrived and now being present.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: that you not be quickly shaken from your mind or alarmed
  simplified_phrase: Do not quickly become unsettled in your thinking or alarmed
  preserved_meaning: They must not let the claim disturb their settled understanding or cause alarm.
  reasoning_layer_used: Lexical decisions for σαλευθῆναι, ἀπὸ τοῦ νοὸς, and θροεῖσθαι
  rationale: The wording explains the mental effect of the shaking image in natural English.
- pob_phrase: either by a spirit or by a message or by a letter as if from us
  simplified_phrase: by any claim supposedly from us—whether it comes through a spirit, a spoken message, or a letter
  preserved_meaning: Each of the three channels may carry a claim falsely attributed to Paul and his companions.
  reasoning_layer_used: Source syntax and lexical decisions for πνεύματος, λόγου, ἐπιστολῆς, and ὡς δι’ ἡμῶν
  rationale: Placing the shared attribution before the list prevents it from applying only to the letter.
- pob_phrase: to the effect that the day of the Lord has come
  simplified_phrase: that says the day of the Lord has come
  preserved_meaning: Every listed channel may communicate the claim that the eschatological day has arrived.
  reasoning_layer_used: Applied revision and theological decision for ἐνέστηκεν
  rationale: The simpler clause clearly gives the common content of all three possible communications.
