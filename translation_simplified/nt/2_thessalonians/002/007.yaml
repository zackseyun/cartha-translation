translation:
  language: en
  text: For the mystery—the hidden reality—of lawlessness is already at work. But the one who restrains now will continue to restrain until he is out of the way.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek does not identify who this restraining figure is; “the one now holding back” is also possible.
    reason: alternative_reading
  - marker: b
    text: Or “until he is removed” or “taken out of the way”; the Greek does not say exactly how this happens.
    reason: lexical_alternative
