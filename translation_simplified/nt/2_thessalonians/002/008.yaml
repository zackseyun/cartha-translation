translation:
  language: en
  text: Then the lawless one will be revealed. The Lord Jesus will kill him with the breath of his mouth[a] and bring him to nothing by appearing when he comes.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “with the spirit of his mouth.” The Greek word can mean “breath” or “spirit,” but “breath” best fits this expression.
    reason: lexical_alternative
  - marker: b
    text: Or, “by the manifestation of his presence.” The Greek word translated “coming” can also mean “presence.”
    reason: lexical_alternative
