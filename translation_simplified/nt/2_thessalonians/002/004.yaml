translation:
  language: en
  text: He opposes every so-called god and everything people worship, and he raises himself above them all. He goes so far as to take his seat in the temple of God[b], presenting himself as God.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “presenting himself as a god.”
    reason: alternative_reading
  - marker: b
    text: Or “sanctuary of God.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the one who opposes and exalts himself over
  simplified_phrase: He opposes ... and he raises himself above
  preserved_meaning: The figure continually opposes and elevates himself over all rivals.
  reasoning_layer_used: Lexical decisions for ἀντικείμενος and ὑπεραιρόμενος
  rationale: Two direct clauses make the actions easier to follow while preserving opposition and self-exaltation.
- pob_phrase: every so-called god or object of worship
  simplified_phrase: every so-called god and everything people worship
  preserved_meaning: The scope includes both beings called gods and all other objects of religious worship.
  reasoning_layer_used: Lexical decisions for λεγόμενον θεόν and σέβασμα
  rationale: The concrete wording explains “object of worship” without narrowing its broad religious sense.
- pob_phrase: so that he takes his seat ... displaying himself as being God
  simplified_phrase: He goes so far as to take his seat ... presenting himself as God
  preserved_meaning: His self-exaltation results in a deliberate, public claim to God's place and status.
  reasoning_layer_used: Lexical and theological decisions for ὥστε, καθίσαι, and ἀποδεικνύντα ἑαυτόν
  rationale: The new sentence preserves the result, enthronement-like action, and public self-presentation in natural English.
translation_notes:
  risk_flags:
  - risk: “God” may sound like the narrator affirms the figure's identity.
    mitigation: “Presenting himself as” marks it as the figure's blasphemous claim, while footnote a preserves “a god.”
  - risk: “Temple” may be read more broadly than the Greek term ναός.
    mitigation: Footnote b preserves the more specific lexical alternative “sanctuary.”
