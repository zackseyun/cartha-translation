translation_notes:
  risk_flags:
  - risk: “Refused” states the volitional force more directly than the participle alone.
    mitigation: The immediate contrast with taking pleasure in wrong strongly supports this nuance.
  - risk: “What is wrong” is less explicitly theological than “unrighteousness.”
    mitigation: The wording preserves the broad moral category without narrowing it to injustice or specific acts.
