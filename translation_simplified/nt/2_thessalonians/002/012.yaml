  language: en
  text: so that everyone who refused to believe the truth but took pleasure in what is wrong may be judged.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “may be condemned.” The Greek word more literally means “may be judged,” though the context points to an adverse judgment.
