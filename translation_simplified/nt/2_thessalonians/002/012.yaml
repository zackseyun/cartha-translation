simplification_decisions:
- pob_phrase: all ... who did not believe the truth
  simplified_phrase: everyone who refused to believe the truth
  preserved_meaning: All those who rejected the definite truth of the gospel are included.
  reasoning_layer_used: Lexical decisions for πάντες, οἱ μὴ πιστεύσαντες, and τῇ ἀληθείᾳ
  rationale: “Everyone” is more natural, while “refused” makes the deliberate contrast with taking pleasure in wrong clear.
- pob_phrase: took pleasure in unrighteousness
  simplified_phrase: took pleasure in what is wrong
  preserved_meaning: They found pleasure in morally wrong conduct rather than merely approving it intellectually.
  reasoning_layer_used: Lexical decision for εὐδοκήσαντες and τῇ ἀδικίᾳ
  rationale: “What is wrong” communicates the broad moral sense of “unrighteousness” in common English.
interpretive_expansions:
- pob_phrase: did not believe
  rendering: refused to believe
  claim: Their unbelief is presented as a willing rejection contrasted with taking pleasure in wrong.
  evidence:
  - The verse directly contrasts not believing the truth with willingly taking pleasure in unrighteousness.
