translation:
  language: en
  text: You now know what is holding him back,[a] so that he may be revealed when his own time comes.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek says “what” and does not identify who or what is holding him back.
    reason: simplification_note
  - marker: b
    text: Or “at his appointed time.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: And now you know
  simplified_phrase: You now know
  preserved_meaning: Paul appeals to what his readers already know from prior instruction.
  reasoning_layer_used: Lexical decision for οἴδατε and νῦν
  rationale: Natural English places “now” after the subject.
- pob_phrase: what is restraining him
  simplified_phrase: what is holding him back
  preserved_meaning: An unidentified force prevents the man from being revealed.
  reasoning_layer_used: Lexical and theological decisions for κατέχον
  rationale: “Holding him back” is common English while keeping the restrainer unidentified.
- pob_phrase: in his own time
  simplified_phrase: when his own time comes
  preserved_meaning: He will be revealed at the time that belongs to him, without specifying who appoints it.
  reasoning_layer_used: Lexical and theological decisions for καιρός
  rationale: The clause form is easier to understand and retains the documented ambiguity.
translation_notes:
  risk_flags:
  - risk: Readers may assume the restrainer is a particular person or power.
    mitigation: Footnote a states that the Greek leaves the restrainer unidentified.
  - risk: “When his own time comes” may sound less like an appointed time.
    mitigation: Footnote b preserves “at his appointed time” as an alternative.
