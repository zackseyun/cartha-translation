translation:
  language: en
  text: They suffer the penalty their wrongdoing has earned. They think it is a pleasure to indulge themselves in broad daylight. They are stains and blemishes. They take pleasure in their deceptions while feasting with you.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Some manuscripts read “love feasts” instead of “deceptions”: “They take pleasure in their love feasts while feasting with you.”'
    reason: textual_variant
simplification_decisions:
- pob_phrase: suffering the wages of unrighteousness
  simplified_phrase: They suffer the penalty their wrongdoing has earned
  preserved_meaning: Their wrongdoing brings a deserved painful consequence.
  reasoning_layer_used: POB lexical decision for ἀδικούμενοι and μισθὸν ἀδικίας
  rationale: This unpacks the biblical wages image as deserved punishment in clear English.
- pob_phrase: considering daytime indulgence a pleasure
  simplified_phrase: They think it is a pleasure to indulge themselves in broad daylight
  preserved_meaning: They openly enjoy luxurious self-indulgence during the day.
  reasoning_layer_used: POB lexical decision for ἡδονὴν ἡγούμενοι and τὴν ἐν ἡμέρᾳ τρυφήν
  rationale: The active wording makes their shameless daytime behavior easier to picture.
- pob_phrase: reveling in their deceptions while feasting with you
  simplified_phrase: They take pleasure in their deceptions while feasting with you
  preserved_meaning: They enjoy their deceit even while sharing meals with the believers.
  reasoning_layer_used: POB lexical decisions for ἐντρυφῶντες, ἀπάταις, and συνευωχούμενοι
  rationale: This replaces the less familiar “reveling” without changing the chosen textual reading.
