translation:
  language: en
  text: For if God did not spare the angels when they sinned, but threw them into Tartarus[a] and handed them over to chains of gloom to be held for judgment,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tartarus is the specific Greek term here for a place of punishment, sometimes translated “hell.”
    reason: source_note
  - marker: b
    text: Some manuscripts read “pits of gloom” instead of “chains of gloom.”
    reason: textual_variant
simplification_decisions:
- pob_phrase: cast them into Tartarus
  simplified_phrase: threw them into Tartarus
  preserved_meaning: God forcibly consigned the sinful angels to Tartarus.
  reasoning_layer_used: Lexical decision for ταρταρόω and theological decision to retain Tartarus
  rationale: “Threw” is more familiar than “cast” while keeping the force and specific destination.
- pob_phrase: committed them to chains of gloom
  simplified_phrase: handed them over to chains of gloom
  preserved_meaning: God placed the angels in dark confinement without defining the nature of the chains.
  reasoning_layer_used: Lexical decisions for παρέδωκεν and σειραῖς ζόφου
  rationale: “Handed them over” clearly expresses transfer into custody while preserving the compressed image.
- pob_phrase: to be kept for judgment
  simplified_phrase: to be held for judgment
  preserved_meaning: The angels remain in custody awaiting divine judgment.
  reasoning_layer_used: Lexical decisions for τηρουμένους and εἰς κρίσιν
  rationale: “Held” makes the continuing custody easier to understand without changing its purpose.
translation_notes:
  risk_flags:
  - risk: Modern readers may not recognize Tartarus.
    mitigation: The footnote explains the term without replacing its source-specific imagery.
  - risk: “Chains of gloom” may be read as strictly literal restraints.
    mitigation: The image is retained without specifying whether the chains are literal, metaphorical, locative, or instrumental.
