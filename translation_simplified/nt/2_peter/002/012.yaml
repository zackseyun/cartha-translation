translation:
  language: en
  text: But these people are like animals without reason—animals that live by instinct and are born to be caught and destroyed. They blaspheme[a] things they do not understand, and they too will be destroyed in their destruction.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “speak abusively about.”
    reason: lexical_alternative
