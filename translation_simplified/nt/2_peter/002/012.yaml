  preserved_meaning: The people are compared to animals governed by instinct and destined for capture and ruin.
  reasoning_layer_used: POB lexical decisions for ἄλογα ζῷα, γεγεννημένα φυσικὰ, and εἰς ἅλωσιν καὶ φθοράν
