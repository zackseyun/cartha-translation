translation:
  language: en
  text: For while that righteous man lived among them, day after day he tormented his righteous soul because of their lawless deeds and what he saw and heard[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek allows the relationship between what he saw and heard and their lawless deeds to be arranged in more than one way.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: that righteous man, living among them
  simplified_phrase: while that righteous man lived among them
  preserved_meaning: Lot’s ongoing residence among the lawless people forms the setting for his anguish.
  reasoning_layer_used: POB lexical decision for ἐγκατοικῶν ἐν αὐτοῖς
  rationale: A direct time clause is easier to follow than the embedded participial phrase.
- pob_phrase: was tormenting his righteous soul day after day with their lawless deeds
  simplified_phrase: day after day he tormented his righteous soul because of their lawless deeds
  preserved_meaning: His inward anguish was intense, continual, and caused by their lawless conduct.
  reasoning_layer_used: POB lexical and theological decisions for ἐβασάνιζεν, ψυχὴν δικαίαν, and ἀνόμοις ἔργοις
  rationale: The clause uses natural English order while retaining the active verb, repeated duration, and the term “soul.”
- pob_phrase: by what he saw and heard
  simplified_phrase: because of ... what he saw and heard
  preserved_meaning: His continual visual and auditory exposure contributed to his torment.
  reasoning_layer_used: POB lexical decisions for βλέμματι and ἀκοῇ and footnote b
  rationale: The wording avoids implying that he merely heard reports about the deeds, while the footnote preserves the flexible relationship.
translation_notes:
  risk_flags:
  - risk: The active wording may suggest that Lot deliberately harmed himself.
    mitigation: It retains the audited active voice, while “because of” identifies the surrounding lawlessness as the cause.
