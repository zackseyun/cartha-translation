translation:
  language: en
  text: For they speak boastful words that have no substance. They use self-indulgent bodily desires[a] and unrestrained sensual behavior to lure people who are barely escaping from those who live in error.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek says “desires of the flesh,” using “flesh” in a moral sense.
    reason: source_note
  - marker: b
    text: Or “who are just now escaping from those who live in error.”
    reason: alternative_reading
