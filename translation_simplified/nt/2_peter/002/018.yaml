  simplified_phrase: speak boastful words that have no substance
  preserved_meaning: Their impressive-sounding speech is proud but empty.
  reasoning_layer_used: Lexical decisions for ὑπέρογκα and ματαιότητος
  rationale: The concrete explanation makes the speech’s pompous and empty character immediately clear.
- pob_phrase: they entice by fleshly desires and sensuality
  simplified_phrase: They use self-indulgent bodily desires and unrestrained sensual behavior to lure people
  preserved_meaning: They lure others by morally corrupt bodily appetites and sensual conduct.
  reasoning_layer_used: Lexical and theological decisions for δελεάζουσιν, σάρξ, and ἀσελγείαις
  rationale: The wording explains the moral sense while the footnote preserves the Greek flesh image.
- pob_phrase: those who are barely escaping from those who live in error
  simplified_phrase: people who are barely escaping from those who live in error
  preserved_meaning: The victims are still precariously separating from people whose way of life is marked by error.
  reasoning_layer_used: Lexical and theological decisions for ὀλίγως, ἀποφεύγοντας, and ἀναστρεφομένους
  rationale: The simpler clause keeps both the ongoing escape and its uncertainty.
