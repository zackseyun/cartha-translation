simplification_decisions:
- pob_phrase: These are waterless springs
  simplified_phrase: These people are springs with no water
  preserved_meaning: The false teachers promise benefit but fail like springs that provide no water.
  reasoning_layer_used: Lexical decision for πηγαὶ ἄνυδροι and the personal referent of οἷς
  rationale: The wording identifies the people clearly while preserving the ironic spring image.
- pob_phrase: mists driven by a storm
  simplified_phrase: mists swept along by a storm
  preserved_meaning: The mists are powerless and carried by a violent storm.
  reasoning_layer_used: Lexical decision for ὁμίχλαι and ὑπὸ λαίλαπος ἐλαυνόμεναι
  rationale: “Swept along” makes the passive motion vivid in ordinary English.
- pob_phrase: the gloom of darkness has been kept
  simplified_phrase: The deepest darkness has been reserved
  preserved_meaning: Severe darkness remains set aside as judgment for them.
  reasoning_layer_used: Lexical decisions for ὁ ζόφος τοῦ σκότους and τετήρηται
  rationale: The revision expresses the intensified darkness and continuing reservation naturally.
