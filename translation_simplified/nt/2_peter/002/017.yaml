translation:
  language: en
  text: These people are springs with no water and mists swept along by a storm. The deepest darkness has been reserved for them.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “The gloom of darkness has been kept for them.”
