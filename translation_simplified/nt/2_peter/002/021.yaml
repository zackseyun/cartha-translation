translation:
  language: en
  text: For they would have been better off never knowing the way of righteousness—the way to live rightly before God—than knowing it and then turning back from the holy command given to them.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: it would have been better for them not to have known
  simplified_phrase: they would have been better off never knowing
  preserved_meaning: It preserves the comparison about what would have been preferable for them.
  reasoning_layer_used: Lexical decision for κρεῖττον and contextual reading of ἦν
  rationale: The new wording expresses the unreal past comparison in more natural English.
- pob_phrase: after knowing it, to turn back from
  simplified_phrase: knowing it and then turning back from
  preserved_meaning: It keeps both their knowledge and their later reversal.
  reasoning_layer_used: Lexical decisions for ἐπιγνοῦσιν and ὑποστρέψαι
  rationale: The ordinary clause order makes the sequence easier to follow while retaining the backward-motion image.
- pob_phrase: the holy commandment delivered to them
  simplified_phrase: the holy command given to them
  preserved_meaning: It retains the command's singular form, holiness, and transmission to them.
  reasoning_layer_used: Lexical decisions for ἁγίας ἐντολῆς and παραδοθείσης
  rationale: “Command” and “given” are clearer common equivalents without adding a tradition or stewardship nuance.
interpretive_expansions:
- pob_phrase: the way of righteousness
  rendering: the way of righteousness—the way to live rightly before God
  claim: The metaphor refers to a morally right way of life before God.
  evidence:
