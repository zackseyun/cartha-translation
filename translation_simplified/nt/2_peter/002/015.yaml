translation:
  language: en
  text: They abandoned the straight way and went astray. They followed the way of Balaam son of Bosor,[a] who loved the payment that came from wrongdoing.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bosor is the name used in the Greek text; in the Old Testament, Balaam is usually called the son of Beor.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Having abandoned the straight way, they went astray, having followed
  simplified_phrase: They abandoned the straight way and went astray. They followed
  preserved_meaning: They deliberately left the morally straight path and followed Balaam's way.
  reasoning_layer_used: Lexical decisions for καταλιπόντες, ἐπλανήθησαν, and ἐξακολουθήσαντες
  rationale: Two direct sentences replace the dense participial structure without changing the sequence of actions.
- pob_phrase: the straight way / the way of Balaam
  simplified_phrase: the straight way / the way of Balaam
  preserved_meaning: The verse's concrete moral-path image remains intact.
  reasoning_layer_used: Theological decision on moral-path imagery
  rationale: The repeated word “way” is retained because it carries the source metaphor.
- pob_phrase: the wages of unrighteousness
  simplified_phrase: the payment that came from wrongdoing
  preserved_meaning: Balaam loved compensation gained through morally wrong conduct.
  reasoning_layer_used: Lexical decisions for μισθὸν and ἀδικίας
  rationale: Common wording makes the corrupt payoff clear while keeping its moral force.
translation_notes:
  risk_flags:
