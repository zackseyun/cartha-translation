translation:
  language: en
  text: So the Lord knows how to rescue godly people from trials,[a] and how to keep unrighteous people under punishment until the day of judgment.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “from temptation.” The Greek word can refer to temptation, testing, or trial; the context here favors trials.
    reason: lexical_alternative
  - marker: b
    text: Or “to keep unrighteous people for the day of judgment, when they will be punished.” The Greek may describe either ongoing punishment or punishment connected with the coming judgment.
    reason: alternative_reading
