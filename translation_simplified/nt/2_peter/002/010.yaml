translation:
  language: en
  text: This is especially true of those who follow the flesh, craving what is impure, and who despise authority. They are bold and determined to have their own way. They do not tremble even as they speak evil of glorious beings.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Glorious beings” likely means heavenly beings, possibly angels, though the term does not identify them precisely.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: especially those who go after the flesh in the desire for defilement
  simplified_phrase: This is especially true of those who follow the flesh, craving what is impure
  preserved_meaning: The preceding judgment applies especially to people who pursue morally corrupt bodily desires, while the image of the flesh remains.
  reasoning_layer_used: Context and POB lexical decisions for μάλιστα, ὀπίσω σαρκὸς, and ἐν ἐπιθυμίᾳ μιασμοῦ
  rationale: The opening makes the link to the preceding judgment clear and recasts the dense phrase in ordinary English.
- pob_phrase: Bold, self-willed
  simplified_phrase: They are bold and determined to have their own way
  preserved_meaning: Their boldness is blameworthy and joined with stubborn self-assertion.
  reasoning_layer_used: POB lexical decisions for Τολμηταί and αὐθάδεις
  rationale: “Bold” avoids the unsupported specificity of “reckless,” while the second phrase clearly expresses self-will.
- pob_phrase: they do not tremble as they blaspheme glorious ones
  simplified_phrase: They do not tremble even as they speak evil of glorious beings
  preserved_meaning: They show no fearful restraint while speaking abusively against exalted beings.
  reasoning_layer_used: POB lexical and theological decisions for οὐ τρέμουσιν, βλασφημοῦντες, and δόξας
  rationale: The trembling image remains, while common wording conveys the broader force of blasphemous speech.
interpretive_expansions:
- pob_phrase: glorious ones
  rendering: glorious beings
  claim: The expression most likely refers to exalted personal beings rather than abstract glories.
  evidence:
  - The POB lexical decision identifies glorious heavenly beings as the likely referent.
  - The following verse mentions angels, supporting a personal heavenly referent.
  confidence: moderate
  alternatives_preserved:
  - angels
  - heavenly beings not otherwise identified
  - abstract dignities
translation_notes:
  risk_flags:
