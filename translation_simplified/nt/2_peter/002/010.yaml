    mitigation: The nearby phrase “craving what is impure” signals its morally charged sense without removing the biblical image.
  - risk: “Glorious beings” narrows the possible abstract sense of δόξας.
    mitigation: The footnote presents the personal heavenly referent as likely, not certain.
