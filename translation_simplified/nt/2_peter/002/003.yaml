  text: In their greed, they will exploit you[a] with words they have made up. The judgment against them was set long ago and is not sitting idle. Their destruction is not asleep.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek picture is of making money from people, literally treating them like merchandise.
    reason: lexical_alternative
