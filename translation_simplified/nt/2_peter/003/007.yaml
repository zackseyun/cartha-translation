translation:
  language: en
  text: But that same word has stored up the heavens and the earth that now exist. They are being kept for fire until the day of judgment and destruction of ungodly men.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “ungodly people.” The Greek word translated “men” can refer to human beings in general.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the present heavens and the earth
  simplified_phrase: the heavens and the earth that now exist
  preserved_meaning: This is the current created order, contrasted with the former world.
  reasoning_layer_used: lexical decision for νῦν and immediate context
  rationale: The relative clause expresses the time contrast more naturally in common English.
- pob_phrase: are stored up by the same word, being kept for fire
  simplified_phrase: that same word has stored up ... They are being kept for fire
  preserved_meaning: God’s same effective word caused the present state, and creation remains reserved for future fire.
  reasoning_layer_used: lexical decisions for τῷ αὐτῷ λόγῳ, τεθησαυρισμένοι, and τηρούμενοι
  rationale: Two sentences clarify the sequence while preserving both source images.
- pob_phrase: until the day of judgment and destruction of ungodly men
  simplified_phrase: until the day of judgment and destruction of ungodly men
  preserved_meaning: Judgment and destruction belong to the same future day.
  reasoning_layer_used: source syntax and grounding review
  rationale: Omitting a second article prevents the clause from sounding like two separate events.
translation_notes:
  risk_flags:
  - risk: “Stored up” may sound unusual when applied to creation.
    mitigation: It preserves the source image, while the next sentence clarifies that creation is being kept for fire.
  - risk: Readers may infer either cosmic annihilation or renewal from the reference to fire.
    mitigation: The wording leaves that question unresolved as the POB theological decision requires.
