simplification_decisions:
- pob_phrase: the words spoken beforehand by the holy prophets
  simplified_phrase: what the holy prophets said in the past
  preserved_meaning: The prophets had spoken these words previously, without implying that every word was a prediction.
  reasoning_layer_used: lexical decision for προειρημένων ῥημάτων
  rationale: The active clause and “in the past” express prior speech naturally without specifying how long ago it occurred.
- pob_phrase: the commandment of your apostles from the Lord and Savior
  simplified_phrase: the commandment your apostles delivered from the Lord and Savior
  preserved_meaning: The authoritative command comes from the Lord and Savior and is mediated by the apostles associated with the readers.
  reasoning_layer_used: lexical and theological decisions on ἐντολῆς and the Greek genitives
  rationale: “Delivered” clarifies the source-and-messenger relationship without weakening the command’s authority.
interpretive_expansions:
- pob_phrase: the commandment of your apostles from the Lord and Savior
  rendering: the commandment your apostles delivered from the Lord and Savior
  claim: The apostles conveyed a command whose source is the Lord and Savior.
  evidence:
  - The POB theological decision identifies the Lord and Savior as the command’s source and the apostles as its mediators.
  - The phrase links the commandment with both the apostles and the Lord and Savior.
  confidence: high
  alternatives_preserved:
  - the command of the Lord and Savior through your apostles
