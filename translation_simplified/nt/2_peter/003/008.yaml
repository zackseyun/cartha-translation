translation:
  language: en
  text: 'But there is one thing you must not overlook, dear friends: With the Lord, a single day is like a thousand years, and a thousand years are like a single day.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This echoes Psalm 90:4. “Like” expresses a comparison, not a literal formula equating one day with a thousand years.
    reason: cross_reference
