  rationale: The approved alternative makes the connection clear in a new sentence.
- pob_phrase: the elements, being burned, will be dissolved
  simplified_phrase: As the elements burn, they will break apart
  preserved_meaning: The elements undergo burning and disintegration without naming an agent.
  reasoning_layer_used: Lexical decisions for καυσούμενα and λυθήσεται
  rationale: Ordinary clause order clarifies the process while preserving the image of dissolution.
- pob_phrase: the works in it
  simplified_phrase: everything done on it
  preserved_meaning: The phrase refers broadly to works or deeds associated with the earth.
  reasoning_layer_used: Lexical decision for τὰ ἐν αὐτῇ ἔργα
  rationale: The approved alternative replaces an opaque phrase with natural English.
