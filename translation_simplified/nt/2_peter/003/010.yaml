translation:
  language: en
  text: But the day of the Lord will come like a thief. On that day, the heavens will pass away with a roar. As the elements[a] burn, they will break apart, and the earth and everything done on it will be found.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the heavenly bodies”; the term may refer to the components of the universe.
    reason: lexical_alternative
  - marker: b
    text: Some understand “will be found” to mean “will be laid bare” or “will be exposed.”
    reason: alternative_reading
  - marker: c
    text: Many manuscripts read “will be burned up” instead of “will be found.”
    reason: textual_variant
