translation:
  language: en
  text: Through these things, he has given us precious and very great promises. Through these promises, you may come to share in the divine nature,[a] after escaping the corruption in the world caused by sinful desire.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “participate in the divine nature.” This means sharing in what comes from God, not becoming divine in essence.
    reason: lexical_alternative
  - marker: b
    text: The Greek can also mean “desire” or “lust,” but the context shows that the desire here is sinful.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: through which he has granted to us his precious and very great promises
  simplified_phrase: Through these things, he has given us precious and very great promises.
  preserved_meaning: God generously gave the promises through the realities mentioned in the previous verse.
  reasoning_layer_used: Lexical decisions for δι’ ὧν and δεδώρηται.
  rationale: A direct sentence and common verb make the action clear without specifying the relative pronoun’s debated antecedent.
- pob_phrase: so that through these you may become sharers in the divine nature
  simplified_phrase: Through these promises, you may come to share in the divine nature
  preserved_meaning: The promises are the means by which believers may enter real participation in the divine nature.
  reasoning_layer_used: Lexical and theological decisions for διὰ τούτων and θείας κοινωνοὶ φύσεως.
  rationale: The verbal phrase “come to share” is easier to understand while preserving both becoming and participation.
- pob_phrase: having escaped the corruption that is in the world because of sinful desire
  simplified_phrase: after escaping the corruption in the world caused by sinful desire
  preserved_meaning: Believers escape the world’s moral and spiritual corruption, whose cause or sphere is sinful desire.
  reasoning_layer_used: Lexical decisions for ἀποφυγόντες, φθορά, and ἐν ἐπιθυμίᾳ.
  rationale: The time relationship and cause are recast in ordinary English without weakening the moral force.
