- pob_phrase: supply in your faith virtue
  simplified_phrase: supply your faith with virtue
  preserved_meaning: Virtue is to be generously furnished in connection with faith.
  reasoning_layer_used: The lexical decision preserves both the force of “supply” and the connection expressed by ἐν.
