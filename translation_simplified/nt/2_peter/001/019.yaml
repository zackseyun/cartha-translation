translation:
  language: en
  text: And the prophetic word has been confirmed even more.[a] You are right to pay close attention to it. It is like a lamp shining in a dark place until the day dawns and the morning star rises in your hearts.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “And we have the prophetic word as even more sure.” The Greek may mean that the apostles’ witness confirms the prophetic word, or it may emphasize how sure the prophetic word already is.
    reason: alternative_reading
  - marker: b
    text: “Morning star” may echo a title for the Messiah; compare Revelation 22:16.
    reason: cross_reference
