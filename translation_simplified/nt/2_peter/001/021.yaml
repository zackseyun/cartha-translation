translation:
  language: en
  text: No prophecy ever originated in human will. Instead, people spoke from God as the Holy Spirit carried them along.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: was never brought forth by the will of man
  simplified_phrase: never originated in human will
  preserved_meaning: Prophecy does not begin in human choice or initiative.
  reasoning_layer_used: lexical and theological decisions
  rationale: “Originated” states the intended source idea in natural modern English.
- pob_phrase: men spoke from God
  simplified_phrase: people spoke from God
  preserved_meaning: Human speakers truly spoke, but their message came from God.
  reasoning_layer_used: cultural note and theological decision
  rationale: “People” makes the representative human sense clear without changing the contrast with God.
interpretive_expansions:
- pob_phrase: was never brought forth
