  rationale: “Rule over” preserves the authority image without adding a claim about intention.
- pob_phrase: but we are fellow workers for your joy
  simplified_phrase: Instead, we work alongside you for your joy
  preserved_meaning: Paul and his companions labor with the Corinthians toward their joy rather than ruling over them.
