simplification_decisions:
- pob_phrase: the one who establishes us with you in Messiah
  simplified_phrase: the one who makes us stand firm together with you in Messiah
  preserved_meaning: God makes Paul and his companions firm in Messiah in shared participation with the Corinthians.
  reasoning_layer_used: Lexical decisions for βεβαιῶν and σὺν ὑμῖν, with the theological decision on εἰς Χριστόν.
  rationale: “Makes us stand firm together with you” expresses the security and shared participation more plainly.
- pob_phrase: and who anointed us, is God
  simplified_phrase: God is the one ... He is also the one who anointed us
  preserved_meaning: God is emphatically identified as the one who both establishes and anoints them.
  reasoning_layer_used: Lexical decisions for χρίσας and θεός.
  rationale: Two direct sentences clarify that God performs both actions while retaining “anointed.”
