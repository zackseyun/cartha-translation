simplification_decisions:
- pob_phrase: through you to pass into Macedonia
  simplified_phrase: visit you on my way to Macedonia
  preserved_meaning: Paul’s route to Macedonia would take him by way of the Corinthians.
  reasoning_layer_used: Lexical decisions for δι’ ὑμῶν and διελθεῖν
  rationale: The new wording turns an awkward travel expression into natural English while keeping the planned route.
- pob_phrase: again from Macedonia to come to you
  simplified_phrase: then come to you again from Macedonia
  preserved_meaning: Paul intended to return to the Corinthians after traveling in Macedonia.
  reasoning_layer_used: Lexical decisions for πάλιν and ἐλθεῖν πρὸς ὑμᾶς
  rationale: Ordinary clause order makes the return stage of the itinerary easier to follow.
- pob_phrase: by you to be sent on to Judea
  simplified_phrase: have you send me on to Judea
  preserved_meaning: The Corinthians would be the ones sending Paul onward toward Judea.
  reasoning_layer_used: Lexical decisions for ὑφ’ ὑμῶν and προπεμφθῆναι
  rationale: The active construction clearly identifies the Corinthians as helping Paul continue his journey.
interpretive_expansions:
