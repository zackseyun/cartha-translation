  preserved_meaning: The paired image remains concise while its bodily sense stays in the footnote.
  reasoning_layer_used: Theological decision on the implied complement
  rationale: Adding a finite verb improves readability without resolving the deliberate terseness.
- pob_phrase: to be pleasing to him
