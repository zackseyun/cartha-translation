simplification_decisions:
- pob_phrase: The one who prepared us for this very thing is God
  simplified_phrase: God is the one who made us ready for exactly this
  preserved_meaning: God purposefully fitted believers for the future state discussed in the preceding verses.
  reasoning_layer_used: Lexical decision for κατεργασάμενος and εἰς αὐτὸ τοῦτο
  rationale: The recast sentence uses common word order while retaining God's action and the emphatic reference to what was just discussed.
- pob_phrase: who gave us
  simplified_phrase: He gave us
  preserved_meaning: God's gift confirms his work of preparing believers.
  reasoning_layer_used: Lexical decision for δοὺς
  rationale: A new sentence replaces the relative clause without changing its subject or relationship to God's preparation.
- pob_phrase: the down payment of the Spirit
  simplified_phrase: the down payment of the Spirit
  preserved_meaning: The Spirit is connected with a present installment that guarantees future completion.
  reasoning_layer_used: Lexical and theological decisions for ἀρραβῶνα τοῦ πνεύματος
  rationale: The concrete payment image and the documented ambiguity are retained, with brief footnotes explaining both.
