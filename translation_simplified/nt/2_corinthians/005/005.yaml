translation:
  language: en
  text: God is the one who made us ready for exactly this. He gave us the down payment of the Spirit.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A down payment is the first part of what is promised and guarantees that the rest will follow.
    reason: simplification_note
  - marker: b
    text: This may mean that the Spirit himself is the down payment, or that God gave a down payment guaranteeing what the Spirit will complete.
