translation:
  language: en
  text: And he died for all,[a] so that those who live would no longer live for themselves. Instead, they would live for the one who died for them and was raised.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here, “for” can also be translated “on behalf of,” both here and later in the verse.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: so that those who live might no longer live for themselves, but for the one
  simplified_phrase: so that those who live would no longer live for themselves. Instead, they would live for the one
  preserved_meaning: Christ’s death redirects their lives away from themselves and toward him.
  reasoning_layer_used: POB lexical decisions for ἵνα, ἑαυτοῖς ζῶσιν, and the continuing dative contrast
  rationale: Splitting the contrast into two sentences makes the purpose and change of allegiance easier to follow.
- pob_phrase: might no longer live
  simplified_phrase: would no longer live
  preserved_meaning: The clause states the intended purpose of his death rather than uncertainty about its outcome.
  reasoning_layer_used: POB lexical decision for ἵνα
  rationale: “Would” expresses purpose more naturally in this sentence than the potentially uncertain-sounding “might.”
- pob_phrase: but for the one who died and was raised for them
  simplified_phrase: Instead, they would live for the one who died for them and was raised
  preserved_meaning: They are to live for Christ, who died on their behalf and was raised.
  reasoning_layer_used: POB lexical and theological decisions for ὑπὲρ αὐτῶν and ἐγερθέντι
  rationale: Repeating “live” makes the implied verb clear while retaining the passive resurrection wording.
translation_notes:
  risk_flags:
  - risk: “All” could be read as settling debates about the extent of Christ’s death.
    mitigation: The text keeps POB’s unrestricted wording without defining the group more narrowly or broadly.
  - risk: “Those who live” may be understood only as physical survival.
    mitigation: The phrase remains unchanged because POB preserves its spiritual and existential breadth without over-resolving it.
