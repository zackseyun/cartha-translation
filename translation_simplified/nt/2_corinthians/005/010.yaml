translation:
  language: en
  text: For all of us must be openly revealed before Messiah’s judgment seat.[a] Each person will receive what is due for the good or bad they have done through the body.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “appear before Messiah’s judgment seat.” The Greek verb can mean simply appearing, but it can also emphasize being openly revealed.
    reason: lexical_alternative
  - marker: b
    text: Or “done in the body.” The phrase refers to deeds carried out through one’s embodied life.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: we all must be revealed before the judgment seat of Messiah
  simplified_phrase: all of us must be openly revealed before Messiah’s judgment seat
  preserved_meaning: Every person must be disclosed before Messiah in a judicial setting.
  reasoning_layer_used: Lexical decisions for φανερωθῆναι, βήματος, and Χριστοῦ
  rationale: “Openly” clarifies the stronger sense of exposure while keeping people themselves as those revealed.
- pob_phrase: so that each one may receive what is due
  simplified_phrase: Each person will receive what is due
  preserved_meaning: Every individual will receive the fitting outcome of the evaluation.
  reasoning_layer_used: Lexical decisions for ἕκαστος and κομίσηται
  rationale: A separate sentence makes individual accountability easier to follow.
- pob_phrase: for what he has done in the body, whether good or bad
  simplified_phrase: for the good or bad they have done through the body
  preserved_meaning: The evaluation concerns good and bad deeds carried out in embodied life.
  reasoning_layer_used: Lexical decisions for τὰ διὰ τοῦ σώματος, ἀγαθὸν, and φαῦλον
  rationale: The wording retains the bodily instrument image while placing the moral contrast in natural English.
interpretive_expansions:
- pob_phrase: be revealed
  rendering: be openly revealed
  claim: The people will be disclosed rather than merely arrive at the judgment seat.
  evidence:
