translation:
  language: en
  text: So, if anyone is in Messiah, there is a new creation.[a] The old things have passed away. Look—new things have come![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may also be translated, “that person is a new creation”; the Greek says simply, “if anyone is in Messiah—new creation.”
    reason: alternative_reading
  - marker: b
    text: Some manuscripts and many translations say, “all things have become new,” but the Greek text used here says, “new things have come.”
    reason: textual_variant
simplification_decisions:
- pob_phrase: So then
  simplified_phrase: So
  preserved_meaning: The statement remains a conclusion drawn from the preceding argument.
  reasoning_layer_used: Lexical decision for ὥστε
  rationale: “So” expresses the logical connection in simpler everyday English.
- pob_phrase: the old things have passed away; behold, new things have come
  simplified_phrase: The old things have passed away. Look—new things have come!
  preserved_meaning: The contrast between what has ended and the resulting newness remains intact.
  reasoning_layer_used: Lexical decisions for παρῆλθεν, ἰδοὺ, and γέγονεν καινά
  rationale: Short sentences and “Look” make the contrast and attention marker immediately clear.
- pob_phrase: if anyone is in Messiah, there is a new creation
  simplified_phrase: if anyone is in Messiah, there is a new creation
  preserved_meaning: The wording preserves union with Messiah and does not restrict the new creation only to the individual.
  reasoning_layer_used: Theological decisions for ἐν Χριστῷ and καινὴ κτίσις
  rationale: These key terms remain because simpler substitutes would narrow the documented meaning.
translation_notes:
  risk_flags:
  - risk: “In Messiah” may be unfamiliar to readers new to Paul’s language.
    mitigation: It is retained because replacing it with “belongs to Messiah” could weaken the union-with-Messiah meaning.
  - risk: “There is a new creation” may sound less personal than the alternate reading.
    mitigation: The footnote preserves the possible individualized translation without resolving the Greek ambiguity.
