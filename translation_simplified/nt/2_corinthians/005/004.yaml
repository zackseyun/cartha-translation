translation:
  language: en
  text: For while we live in this tent, we groan because we are weighed down. We do not want to be unclothed. Instead, we want to be clothed over,[a] so that life may swallow up what is mortal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek pictures putting another garment on over one already worn.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: while we are in this tent
  simplified_phrase: while we live in this tent
  preserved_meaning: The tent remains a picture of present bodily existence.
  reasoning_layer_used: Lexical decision for σκήνει and surrounding context.
  rationale: The active wording is easier to understand without flattening Paul's image.
- pob_phrase: we groan, being burdened
  simplified_phrase: we groan because we are weighed down
  preserved_meaning: Their burden is the condition that accompanies and explains their groaning.
  reasoning_layer_used: Lexical decisions for στενάζομεν and βαρούμενοι.
  rationale: A direct cause clause replaces the awkward participle.
- pob_phrase: we do not want to be unclothed but to be further clothed
  simplified_phrase: We do not want to be unclothed. Instead, we want to be clothed over
  preserved_meaning: Paul contrasts being unclothed with receiving an added covering.
  reasoning_layer_used: Lexical and theological decisions for ἐκδύσασθαι and ἐπενδύσασθαι.
  rationale: Two sentences clarify the contrast while leaving its theological meaning unresolved.
