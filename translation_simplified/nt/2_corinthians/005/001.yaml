translation:
  language: en
  text: For we know that if our earthly home—this tent—is torn down, we have[a] a building from God. It is an eternal house in the heavens, not made by human hands.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek says “we have,” not “we will have,” leaving a tension between present possession and future realization.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: our earthly tent-house
  simplified_phrase: our earthly home—this tent
  preserved_meaning: The wording keeps both the house and tent images for our present mortal dwelling.
  reasoning_layer_used: POB lexical and theological decisions on the dwelling imagery
  rationale: The appositional phrase is easier to understand than the compound “tent-house” without replacing the image with “body.”
- pob_phrase: we have a building from God, a house
  simplified_phrase: we have a building from God. It is an eternal house
  preserved_meaning: God provides the enduring heavenly structure, and the present-tense “have” remains unchanged.
  reasoning_layer_used: POB lexical decisions on οἰκοδομή and ἔχομεν
  rationale: Two sentences clarify the contrast while preserving the debated present tense.
- pob_phrase: a house not made with hands
  simplified_phrase: not made by human hands
  preserved_meaning: The house is of divine rather than human origin.
  reasoning_layer_used: POB lexical decision on ἀχειροποίητος
  rationale: Adding “human” makes the biblical expression immediately clear without weakening its theological contrast.
translation_notes:
  risk_flags:
  - risk: Readers may take the tent and house only as literal structures.
    mitigation: The main text preserves Paul’s imagery rather than resolving its bodily referent, as required by the POB decision.
  - risk: The present “we have” may sound temporally puzzling.
    mitigation: The footnote preserves and briefly explains the source text’s present-future tension.
