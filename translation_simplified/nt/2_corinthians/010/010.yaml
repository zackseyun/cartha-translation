translation:
  language: en
  text: For they say[a], “His letters carry weight and are strong, but in person he is weak, and people look down on his speech.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “For he says.” The Greek uses a singular expression to report the opinion of Paul’s critics.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: His letters are weighty and strong
  simplified_phrase: His letters carry weight and are strong
  preserved_meaning: Paul’s critics describe his letters as serious and forceful while retaining the image of weight.
  reasoning_layer_used: Lexical decisions for βαρεῖαι and ἰσχυραί
  rationale: “Carry weight” makes the metaphor readily understandable without removing it.
- pob_phrase: his bodily presence is weak
  simplified_phrase: in person he is weak
  preserved_meaning: The criticism concerns Paul when physically present rather than his letters.
  reasoning_layer_used: Lexical decisions for παρουσία, τοῦ σώματος, and ἀσθενὴς
  rationale: “In person” expresses the letter-versus-presence contrast in ordinary English.
- pob_phrase: his speech is despised
  simplified_phrase: people look down on his speech
  preserved_meaning: Others treat Paul’s oral expression with contempt without limiting the criticism to his delivery.
  reasoning_layer_used: Lexical decisions for λόγος and ἐξουθενημένος
  rationale: The active wording identifies others’ contempt while preserving the broad term “speech.”
interpretive_expansions:
- pob_phrase: his speech is despised
  rendering: people look down on his speech
  claim: The passive evaluation is expressed as the contempt of unspecified people toward Paul’s speech.
  evidence:
  - The lexical rationale defines ἐξουθενημένος as being held in contempt.
  - The quotation reports the opinion of Paul’s critics.
  confidence: high
  alternatives_preserved:
  - his speech is despised
  - his speech is contemptible
  - his speech is of no account
translation_notes:
  risk_flags:
  - risk: “Carry weight” may suggest influence rather than rhetorical seriousness.
    mitigation: Pairing it with “strong” and retaining the weight image preserves the intended force.
