translation:
  language: en
  text: We do not boast beyond proper limits by taking credit for work others have done. Instead, we hope that as your community grows in faith, our ministry will expand greatly within the field assigned to us.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: not boasting beyond measure in the labors of others
  simplified_phrase: We do not boast beyond proper limits by taking credit for work others have done
  preserved_meaning: Paul refuses to claim others’ work as his own or boast outside proper bounds.
  reasoning_layer_used: POB lexical decisions for οὐκ εἰς τὰ ἄμετρα and ἐν ἀλλοτρίοις κόποις
  rationale: The rewrite keeps both the limit image and the point that Paul will not claim credit for another person’s work.
- pob_phrase: as your faith is growing among you
  simplified_phrase: as your community grows in faith
  preserved_meaning: The Corinthians’ believing faith is increasing within their community.
  reasoning_layer_used: POB lexical decisions for πίστεως and ἐν ὑμῖν
  rationale: The collective wording expresses “among you” naturally while retaining the key term “faith.”
- pob_phrase: we will be enlarged according to our sphere of ministry, unto abundance
  simplified_phrase: our ministry will expand greatly within the field assigned to us
  preserved_meaning: Paul hopes for a great expansion of his apostolic work within its proper assigned field.
  reasoning_layer_used: POB theological decisions for μεγαλυνθῆναι and κανών
  rationale: This states the contextual ministry sense directly instead of using the unclear image of Paul himself being enlarged.
