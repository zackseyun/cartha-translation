  simplified_phrase: The person the Lord commends is the one who is approved
  preserved_meaning: The Lord’s commendation identifies the person who is truly approved.
  reasoning_layer_used: The lexical and theological decisions retain “Lord” without specifying the referent further.
  rationale: A separate sentence makes the decisive contrast easier to follow.
interpretive_expansions:
- pob_phrase: not the one who commends himself who is approved
  rendering: not approved merely because he commends himself
  claim: Self-commendation is not the basis of genuine approval.
  evidence:
