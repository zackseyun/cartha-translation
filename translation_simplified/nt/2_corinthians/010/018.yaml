  simplified_phrase: a person is not approved merely because he commends himself
  preserved_meaning: Self-commendation does not establish that a person has passed evaluation.
  reasoning_layer_used: The lexical decisions for συνίστημι and δόκιμος preserve “commends” and “approved.”
