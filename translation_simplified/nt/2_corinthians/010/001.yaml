translation:
  language: en
  text: I, Paul, personally appeal to you by the meekness and gentleness of the Messiah[a]—I who am humble when I am with you in person,[b] but bold toward you when I am away.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Messiah” is the title traditionally rendered “Christ.”
    reason: lexical_alternative
  - marker: b
    text: “Humble” may echo what others said about Paul; it could also mean “lowly,” or, more interpretively, “timid.”
    reason: lexical_alternative
