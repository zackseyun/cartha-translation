translation:
  language: en
  text: For even if I boast a little more about the authority the Lord gave us, I will not be put to shame.[a] He gave us this authority to build you up, not to tear you down.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “I will not be ashamed.” The wording “be put to shame” better reflects the passive form of the Greek verb.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: even if I should boast somewhat more
  simplified_phrase: even if I boast a little more
  preserved_meaning: Paul speaks hypothetically about boasting to a modestly greater degree.
  reasoning_layer_used: Lexical decision for ἐάν, καυχήσωμαι, and περισσότερόν τι.
  rationale: The simpler conditional and common phrase retain the hypothetical tone and modest qualification.
- pob_phrase: which the Lord gave for building you up and not for tearing you down
  simplified_phrase: He gave us this authority to build you up, not to tear you down
  preserved_meaning: The Lord delegated authority to strengthen the Corinthians rather than ruin them.
  reasoning_layer_used: Lexical and theological decisions on delegated authority and the construction metaphor.
  rationale: A new sentence makes the purpose clear while preserving both sides of the building contrast.
translation_notes:
  risk_flags:
  - risk: Splitting the relative clause could make the repetition of “authority” sound more emphatic than in POB.
    mitigation: The repetition clearly identifies what the Lord gave without adding a new claim.
