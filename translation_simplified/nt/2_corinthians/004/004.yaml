  preserved_meaning: The phrase still identifies the people in the preceding context by their unbelief.
  reasoning_layer_used: POB lexical decisions for ἐν οἷς and τῶν ἀπίστων
  rationale: This removes an unclear backward reference and an awkward adjective used as a noun.
- pob_phrase: so that ... might not shine on them
  simplified_phrase: This keeps ... from shining on them
  preserved_meaning: The blinding prevents the gospel’s light from shining on those who do not believe.
  reasoning_layer_used: POB lexical and theological decisions for εἰς τὸ μὴ αὐγάσαι
  rationale: A new sentence makes the action and its result easier to follow.
- pob_phrase: who is the image of God
  simplified_phrase: The Messiah is the image of God
  preserved_meaning: The direct statement of the Messiah’s unique relation to God remains unchanged in substance.
  reasoning_layer_used: POB theological decision on εἰκὼν τοῦ θεοῦ
  rationale: A separate sentence makes clear who is the image of God.
