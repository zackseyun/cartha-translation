translation:
  language: en
  text: The god of this age[a] has blinded the minds of those who do not believe. This keeps the light of the gospel about the Messiah’s glory[b] from shining on them.[c] The Messiah is the image of God.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the god of this world”; “age” points to the present fallen era.
    reason: lexical_alternative
  - marker: b
    text: Greek Christos; it is translated “Messiah” here because it is used as a title.
    reason: source_note
  - marker: c
    text: Or “so that they might not see the light of the gospel”; the rare Greek verb can emphasize either the light shining or people seeing it.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: In their case ... the minds of the unbelieving
