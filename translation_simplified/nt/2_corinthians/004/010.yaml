simplification_decisions:
- pob_phrase: always carrying in the body
  simplified_phrase: We always carry ... in the body
  preserved_meaning: Paul and his fellow ministers continually bear Jesus’ death through bodily suffering.
  reasoning_layer_used: Lexical decisions for πάντοτε, περιφέροντες, and ἐν τῷ σώματι, with the immediate context
  rationale: The finite clause is easier to read while preserving the continual carrying image and first singular body phrase.
- pob_phrase: may also be revealed in our body
  simplified_phrase: may also be seen in our body
  preserved_meaning: The life of Jesus becomes visibly manifest in the apostles’ embodied experience.
  reasoning_layer_used: Lexical decision for φανερωθῇ and grounding review
  rationale: “May be seen” uses common English while retaining passive manifestation rather than making the body the agent.
- pob_phrase: body ... our body
  simplified_phrase: the body ... our body
  preserved_meaning: The singular wording presents the apostles’ embodied experience collectively.
  reasoning_layer_used: Theological decision on the number of σώμα
  rationale: Both singular forms remain to preserve the verse’s corporate rhetoric.
interpretive_expansions:
