translation:
  language: en
  text: For God, who said, “Light will shine out of darkness,”[a] has shone in our hearts. He did this so that we may know God’s glory in the face of the Messiah.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This echoes Genesis 1:3 and compares God’s work in believers to his creation of light.
    reason: cross_reference
  - marker: b
    text: Greek “Christ”; “Messiah” makes clear that this is a title.
    reason: lexical_alternative
  - marker: c
    text: Or, “in the person of the Messiah”; “face” preserves the image of visible divine glory.
    reason: alternative_reading
