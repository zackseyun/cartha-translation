simplification_decisions:
- pob_phrase: because we know that the one who raised Jesus
  simplified_phrase: Because we know that God raised Jesus to life
  preserved_meaning: Knowledge of God’s resurrection of Jesus is the reason for Paul’s continuing confidence.
  reasoning_layer_used: Lexical decisions for εἰδότες and ὁ ἐγείρας
  rationale: The causal opening is retained while God and resurrection to life are stated clearly.
- pob_phrase: will present us with you
  simplified_phrase: bring us into his presence together with you
  preserved_meaning: God will bring Paul and the Corinthians together before him in the future.
  reasoning_layer_used: Lexical and theological decisions for παραστήσει and σὺν ὑμῖν
  rationale: This explains “present” without limiting it to a specific courtroom setting.
interpretive_expansions:
- pob_phrase: the one who raised Jesus ... will present us
  rendering: God raised Jesus to life ... bring us into his presence
