simplification_decisions:
- pob_phrase: we who are living are always being handed over to death
  simplified_phrase: we who are alive are constantly being handed over to death
  preserved_meaning: The living apostles are continually subjected to death without weakening the destination or result.
  reasoning_layer_used: Lexical decisions for οἱ ζῶντες, ἀεί, παραδιδόμεθα, and εἰς θάνατον
  rationale: “Alive” and “constantly” are natural English while “handed over to death” preserves the source’s full force.
- pob_phrase: for Jesus’ sake
  simplified_phrase: because of Jesus
  preserved_meaning: Their danger results from their connection and allegiance to Jesus.
  reasoning_layer_used: Lexical decision for διὰ Ἰησοῦν and POB footnote a
  rationale: The approved alternative states the causal sense in common English.
- pob_phrase: the life of Jesus also may be revealed
  simplified_phrase: Jesus’ life may also be revealed
  preserved_meaning: Jesus’ life becomes visible through their mortal bodily existence.
  reasoning_layer_used: Lexical decisions for ἡ ζωὴ τοῦ Ἰησοῦ, καί, and φανερωθῇ
  rationale: The possessive form is easier to read while retaining the passive verb and the link marked by “also.”
