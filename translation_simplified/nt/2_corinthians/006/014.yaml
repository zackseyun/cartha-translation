translation:
  language: en
  text: Do not become bound together with unbelievers like mismatched animals under one yoke.[b] What partnership can there be between righteousness[a] and lawlessness? What fellowship can light have with darkness?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “justice” instead of “righteousness.”
    reason: lexical_alternative
  - marker: b
    text: This yoke image echoes Deuteronomy 22:10, which forbids yoking two different kinds of animals together.
    reason: cross_reference
