translation:
  language: en
  text: 'We are working together with God,[a] and we also urge you: do not receive God’s grace only for it to have no effect.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “As fellow workers, we also urge you.” The Greek does not name the one with whom Paul is working, but the context strongly points to God.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Working together with him
  simplified_phrase: We are working together with God
  preserved_meaning: Paul and his coworkers cooperate with the implied partner, most likely God.
  reasoning_layer_used: POB theological decision and immediate context in 5:18–6:1
  rationale: Naming God removes an unclear pronoun while retaining the documented alternative in a footnote.
- pob_phrase: not to receive the grace of God in vain
  simplified_phrase: do not receive God’s grace only for it to have no effect
  preserved_meaning: God’s grace must not be received without accomplishing its purpose.
  reasoning_layer_used: POB lexical decisions for χάρις and εἰς κενόν
  rationale: The wording keeps the key term “grace” while explaining the less familiar idiom “in vain.”
interpretive_expansions:
- pob_phrase: with him
  rendering: with God
  claim: The implied partner in Paul’s work is God.
  evidence:
  - The preceding context centers on God’s reconciling work and Paul’s service as an ambassador.
  - The POB theological decision identifies God as the most likely referent.
  confidence: high
  alternatives_preserved:
  - The Greek may be rendered without naming the partner.
  - The phrase may describe Paul and his companions as fellow workers.
translation_notes:
  risk_flags:
  - risk: Naming God could hide the grammatical ambiguity in the Greek participle.
    mitigation: The footnote preserves the objectless and fellow-worker reading.
  - risk: “Have no effect” may sound as though God’s grace lacks power in itself.
    mitigation: The wording places the warning on receiving grace without its intended result, not on any weakness in grace.
