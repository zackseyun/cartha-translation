translation:
  language: en
  text: Even in sorrow, we are always rejoicing. Although we are poor, we make many people rich. We have nothing, yet we possess everything.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The riches and possessions are likely spiritual rather than material, but Paul leaves the paradox unqualified.
    reason: simplification_note
simplification_decisions:
- pob_phrase: as sorrowful, yet always rejoicing
  simplified_phrase: Even in sorrow, we are always rejoicing.
  preserved_meaning: Sorrow and ongoing rejoicing remain present together.
  reasoning_layer_used: Lexical decisions for λυπούμενοι, ἀεὶ, δὲ, and χαίροντες.
  rationale: The new clause states the contrast in ordinary English without making the sorrow unreal.
- pob_phrase: as poor, yet making many rich
  simplified_phrase: Although we are poor, we make many people rich.
  preserved_meaning: The poor apostles nevertheless enrich many others.
  reasoning_layer_used: Lexical decisions for πτωχοί, πολλούς, and πλουτίζοντες.
  rationale: “Many people” makes the personal object explicit while leaving the kind of riches open.
- pob_phrase: as having nothing, and yet possessing everything
  simplified_phrase: We have nothing, yet we possess everything.
  preserved_meaning: Outward lack stands in paradoxical contrast with comprehensive possession.
  reasoning_layer_used: Lexical decisions for μηδὲν ἔχοντες, πάντα, and κατέχοντες.
  rationale: A direct sentence makes the final paradox easier to follow without resolving it.
translation_notes:
  risk_flags:
  - risk: Readers may take the riches and possessions as material wealth.
    mitigation: The footnote identifies the likely spiritual sense while preserving Paul's unqualified wording.
  - risk: Recasting repeated “as” clauses may reduce the catalog's comparative framing.
    mitigation: The repeated contrasts and all three paradoxes remain distinct.
