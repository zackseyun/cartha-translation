translation:
  language: en
  text: We are seen as unknown, yet we are recognized. We are dying, yet look—we are alive. We are disciplined,[a] yet we are not put to death.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek can mean corrective discipline or training that shapes a person.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: as unknown and yet well known
  simplified_phrase: We are seen as unknown, yet we are recognized
  preserved_meaning: Others may regard the apostles as unknown, although they are truly acknowledged.
  reasoning_layer_used: POB lexical decisions for ἀγνοούμενοι and ἐπιγινωσκόμενοι
  rationale: “Recognized” clearly expresses acknowledgment without suggesting mere fame.
- pob_phrase: as dying and behold, we live
  simplified_phrase: We are dying, yet look—we are alive
  preserved_meaning: The apostles continually face death but remain alive.
  reasoning_layer_used: POB lexical decisions for ἀποθνῄσκοντες, ἰδοὺ, and ζῶμεν
  rationale: “Look” carries the attention-calling force of “behold” in ordinary modern English.
- pob_phrase: as disciplined and not put to death
  simplified_phrase: We are disciplined, yet we are not put to death
  preserved_meaning: Their severe suffering may train or correct them, but it does not end in death.
  reasoning_layer_used: POB theological decision on παιδευόμενοι
  rationale: The retained term preserves the tension between corrective discipline and formative training.
