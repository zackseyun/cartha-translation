translation:
  language: en
  text: What can God’s temple and idols possibly have in common? We together are the temple of the living God. As God said, “I will live among them[a] and walk among them. I will be their God, and they will be my people.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “live in them.” The Greek can mean “in” or “among,” but the covenant setting points to God’s presence among his people as a community.
    reason: alternative_reading
