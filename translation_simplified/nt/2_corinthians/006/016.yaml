  preserved_meaning: God promises his continuing covenant presence among his people.
  reasoning_layer_used: Lexical and theological decisions on Ἐνοικήσω ἐν αὐτοῖς
  rationale: “Live among” is more familiar than “dwell among” without narrowing the promise to individual inward experience.
