translation:
  language: en
  text: 'I said this before when I was with you for the second time. Now, while I am away, I say it again in advance to those who sinned earlier and to everyone else: if I come again,[a] I will not spare them.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “if I come for a third time.” The Greek literally says “if I come again,” while the context suggests a visit after Paul’s second visit.
    reason: alternative_reading
