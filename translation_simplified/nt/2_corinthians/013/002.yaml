  preserved_meaning: The statement addresses both the earlier offenders and the rest of the congregation.
  reasoning_layer_used: Lexical decisions and theological scope decision
  rationale: Common wording preserves the distinction and comprehensive scope.
- pob_phrase: if I come again, I will not spare them
  simplified_phrase: if I come again, I will not spare them
  preserved_meaning: Paul says he will not hold back from severity on another visit.
  reasoning_layer_used: Lexical decision for οὐ φείσομαι and theological tension
