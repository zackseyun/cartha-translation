- pob_phrase: I have said before, and I say beforehand now while absent, as when present the second time
  simplified_phrase: I said this before when I was with you for the second time. Now, while I am away, I say it again in advance
  preserved_meaning: Paul repeats from a distance what he had already said during his second visit.
  reasoning_layer_used: Lexical decisions for προείρηκα, προλέγω, and the presence-absence contrast
  rationale: Two sentences make the timeline and repeated advance statement easier to follow.
- pob_phrase: those who sinned previously and to all the rest
