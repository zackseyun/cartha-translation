simplification_decisions:
- pob_phrase: since you are seeking proof
  simplified_phrase: Since you keep asking for proof
  preserved_meaning: The Corinthians are making an ongoing demand for evidence.
  reasoning_layer_used: Lexical decisions for ἐπεὶ, δοκιμήν, and ζητεῖτε
  rationale: “Since” keeps the causal link, while “keep asking” makes the continuing demand clear.
- pob_phrase: he is not weak toward you
  simplified_phrase: he is not weak toward you
  preserved_meaning: Messiah is not weak in relation to the Corinthians.
  reasoning_layer_used: Lexical decisions for εἰς ὑμᾶς and οὐκ ἀσθενεῖ
  rationale: The source wording is already clear and avoids adding a specific event of dealing with them.
- pob_phrase: but is powerful in you
  simplified_phrase: Instead, he is powerfully at work among you
  preserved_meaning: Messiah actively exercises power within the Corinthian church.
  reasoning_layer_used: Lexical decision for δυνατεῖ and theological decision for ἐν ὑμῖν
  rationale: The active phrase is natural English, and “among you” reflects the plural corporate setting.
interpretive_expansions:
- pob_phrase: but is powerful
  rendering: Instead, he is powerfully at work
  claim: Messiah’s power is active rather than merely a stated quality.
  evidence:
  - The lexical rationale permits “exercises power” for δυνατεῖ.
  - The clause directly contrasts Messiah’s power with weakness.
  confidence: high
  alternatives_preserved:
  - but is powerful
  - but is strong
translation_notes:
