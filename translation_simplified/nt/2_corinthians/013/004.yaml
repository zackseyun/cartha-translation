translation:
  language: en
  text: He was crucified in weakness, but he lives by God’s power. We too are weak in our union with him. Yet we will live with him by God’s power in relation to you.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “In relation to you” may also be translated “toward you,” “for you,” or “among you.”
    reason: lexical_alternative
  - marker: b
    text: “We will live with him” may refer to Christ-powered ministry among the Corinthians while also echoing future resurrection life.
    reason: alternative_reading
