  rationale: “Instead” clearly expresses the required reversal without a redundant English pairing.
- pob_phrase: so that such a person may not be overwhelmed by excessive sorrow
  simplified_phrase: so that his excessive sorrow may not overwhelm him
  preserved_meaning: Forgiveness and comfort are intended to keep sorrow from overcoming the person.
  reasoning_layer_used: Lexical decisions for καταποθῇ, ὁ τοιοῦτος, and περισσοτέρᾳ λύπῃ
  rationale: The active wording is easier to follow while preserving the purpose relation and danger.
- pob_phrase: forgive and comfort him
