translation:
  language: en
  text: For we are not like the many who peddle the word of God.[a] Instead, we speak with sincere motives, as those who speak from God. We speak in God’s presence and in Messiah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Peddle” pictures people marketing God’s word for their own gain and may also imply corrupting it.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the many, peddling the word of God
  simplified_phrase: the many who peddle the word of God
  preserved_meaning: Paul contrasts his ministry with a large group that treats God’s word as self-serving merchandise.
  reasoning_layer_used: Lexical decision for οἱ πολλοί and καπηλεύοντες
  rationale: A relative clause makes the contrast easier to follow while retaining the commercial image.
- pob_phrase: as from sincerity
  simplified_phrase: with sincere motives
  preserved_meaning: Their speech arises from genuine rather than self-serving motives.
  reasoning_layer_used: Lexical alternative for ἐξ εἰλικρινείας
  rationale: The approved alternative expresses the source of their speech in ordinary English.
- pob_phrase: before God we speak in Messiah
  simplified_phrase: We speak in God’s presence and in Messiah
  preserved_meaning: They speak under God’s direct awareness and within their relationship to Messiah.
  reasoning_layer_used: Lexical and theological decisions for κατέναντι θεοῦ and ἐν Χριστῷ
  rationale: The sentence is divided for clarity while retaining “Messiah” and the sense of God’s presence.
