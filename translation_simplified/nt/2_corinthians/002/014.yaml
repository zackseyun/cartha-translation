translation:
  language: en
  text: But thanks be to God! He always leads us in a victory procession in the Messiah.[a] Through us, he spreads everywhere the fragrance that comes from knowing him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also mean, “He always triumphs over us in the Messiah.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: leads us in triumphal procession
  simplified_phrase: leads us in a victory procession
  preserved_meaning: God leads the apostles in the public procession that celebrates his victory.
  reasoning_layer_used: Lexical and theological decisions for θριαμβεύοντι
  rationale: “Victory procession” explains the Roman triumph image without reducing it to generic victory.
- pob_phrase: makes the fragrance of the knowledge of him known through us
  simplified_phrase: through us, he spreads everywhere the fragrance that comes from knowing him
  preserved_meaning: God uses the apostles to make knowledge of him widely known like a fragrance.
  reasoning_layer_used: Lexical decisions for ὀσμή, γνώσις, φανερόω, and διά
  rationale: The active wording makes the fragrance metaphor easier to follow while preserving divine agency.
- pob_phrase: in every place
  simplified_phrase: everywhere
  preserved_meaning: The knowledge of God spreads in every location reached by the ministry.
  reasoning_layer_used: Lexical decision for ἐν παντὶ τόπῳ
  rationale: “Everywhere” is the direct common-English equivalent.
interpretive_expansions:
- pob_phrase: makes the fragrance of the knowledge of him known
  rendering: spreads everywhere the fragrance that comes from knowing him
  claim: The knowledge of God is pictured as a fragrance carried outward through apostolic ministry.
  evidence:
  - The source joins the fragrance image to knowledge of God.
  - “Through us” identifies the apostles as God’s instruments.
  - “In every place” emphasizes the fragrance’s wide spread.
  confidence: high
  alternatives_preserved:
  - makes known the fragrance of the knowledge of him
