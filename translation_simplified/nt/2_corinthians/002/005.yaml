simplification_decisions:
- pob_phrase: But if anyone has caused grief
  simplified_phrase: But if someone has caused grief
  preserved_meaning: A past action has caused grief whose effects continue.
  reasoning_layer_used: POB lexical decision for λελύπηκεν
  rationale: “Someone” is natural English, while “has caused” preserves the continuing effect.
- pob_phrase: he has grieved not me, but in part all of you—to some extent
  simplified_phrase: it is not me he has grieved, but, to some extent, all of you
  preserved_meaning: Paul redirects attention from himself to the whole congregation while qualifying the extent of its grief.
  reasoning_layer_used: POB lexical decisions for οὐκ ἐμὲ, ἀπὸ μέρους, and πάντας ὑμᾶς
  rationale: Keeping the contrast in one sentence avoids turning Paul’s words into a detached, overly sharp denial.
- pob_phrase: so that I may not overstate it
  simplified_phrase: though I do not want to overstate this
  preserved_meaning: Paul carefully limits how strongly he describes the congregation’s grief.
  reasoning_layer_used: POB main rendering and revision rationale for ἐπιβαρῶ
  rationale: The recast clause makes Paul’s rhetorical restraint easier to understand.
translation_notes:
  risk_flags:
  - risk: The final Greek verb may refer to burdening the readers rather than overstating the matter.
    mitigation: The main text follows the controlling POB rendering, and the footnote preserves the lexical alternative.
  - risk: The contrast could be read as an absolute denial that Paul felt any grief.
    mitigation: The connected contrast keeps the focus on redirecting attention to the congregation rather than isolating the denial.
