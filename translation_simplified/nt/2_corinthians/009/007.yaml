  text: Each person should give what he has already decided in his heart to give.[a] He should not give out of sorrow[b] or under pressure, for God loves a cheerful giver.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The words “he” and “his” refer to each person, not only to men.
    reason: cultural_note
