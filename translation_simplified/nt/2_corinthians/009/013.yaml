translation:
  language: en
  text: This ministry proves that your faith is genuine. Because of it, they glorify God for the obedience that goes with your confession of the gospel of the Messiah[a], and for the generous way you share with them and with everyone else.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the gospel of Christ.” “Messiah” preserves the meaning of the Greek title.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Because of the proof provided by this ministry
  simplified_phrase: This ministry proves that your faith is genuine
  preserved_meaning: The charitable ministry demonstrates the reality of their faith and love.
  reasoning_layer_used: Lexical rationale for δοκιμή and collection context
  rationale: The abstract phrase becomes a direct statement while retaining the idea of demonstrated genuineness.
- pob_phrase: the obedience of your confession
  simplified_phrase: the obedience that goes with your confession
  preserved_meaning: Their public confession of the gospel is accompanied by practical obedience.
  reasoning_layer_used: Lexical decisions for ὑποταγή and ὁμολογία plus applied revision
  rationale: This avoids suggesting that a confession itself performs obedience.
- pob_phrase: the generosity of your sharing with them and with everyone
  simplified_phrase: the generous way you share with them and with everyone else
  preserved_meaning: Their sharing is openhanded material participation directed toward these believers and others.
  reasoning_layer_used: Lexical decisions for ἁπλότης, κοινωνία, and εἰς
  rationale: The wording makes the financial generosity natural without reducing sharing to fellowship.
interpretive_expansions:
- pob_phrase: proof provided by this ministry
  rendering: This ministry proves that your faith is genuine
  claim: The relief ministry supplies evidence that their professed faith is genuine.
  evidence:
  - The lexical rationale says the collection demonstrates genuine faith and love.
  - The immediate clause links this proof with confession, obedience, and generous sharing.
  confidence: high
  alternatives_preserved:
  - This ministry provides proof of your commitment.
- pob_phrase: the obedience of your confession
  rendering: the obedience that goes with your confession
  claim: The obedience accompanies and demonstrates their confession rather than belonging grammatically to it as an acting subject.
  evidence:
  - The applied revision identifies obedience as demonstrated by or integral to the confession.
  - The lexical rationale describes concrete yielding in response to the gospel.
  confidence: high
  alternatives_preserved:
  - the obedience shown in your confession
  - the submission of your confession
translation_notes:
  risk_flags:
