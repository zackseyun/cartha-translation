translation:
  language: en
  text: The one who provides seed to those who plant it and bread to eat will also provide your seed and make it multiply. He will increase the harvest that grows from your righteousness.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the harvest that grows from your justice.” The Greek word can mean “righteousness” or, in some contexts, “justice.”
