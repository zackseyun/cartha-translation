translation:
  language: en
  text: So I decided it was necessary to urge the brothers[a] to go ahead to you and arrange beforehand the blessing[b] you had already promised. Then it would be ready as a blessing, not as greed.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “brothers and sisters,” if the delegation included both men and women.
    reason: lexical_alternative
  - marker: b
    text: Here “blessing” means the Corinthians’ promised contribution; it may also be rendered “generous gift.”
    reason: lexical_alternative
  - marker: c
    text: Or “not as a grudging exaction.” The Greek word more literally means “greed” or “covetousness.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Therefore I considered it necessary
  simplified_phrase: So I decided it was necessary
  preserved_meaning: Paul presents the advance arrangements as his considered practical judgment.
  reasoning_layer_used: Lexical decisions for ἡγησάμην and ἀναγκαῖον
  rationale: “Decided” communicates deliberate judgment in direct, common English.
- pob_phrase: prepare in advance your previously promised blessing
  simplified_phrase: arrange beforehand the blessing you had already promised
  preserved_meaning: The delegation is to organize the Corinthians’ pledged contribution before Paul arrives.
  reasoning_layer_used: Lexical decisions for προκαταρτίσωσι, προεπηγγελμένην, and εὐλογίαν
  rationale: This removes stacked modifiers while retaining prior preparation, the promise, and “blessing.”
- pob_phrase: so that it might be ready in this way as a blessing and not as greed
  simplified_phrase: Then it would be ready as a blessing, not as greed
  preserved_meaning: The contribution should be ready with the character of a blessing rather than greed.
  reasoning_layer_used: Lexical contrast between εὐλογία and πλεονεξία
  rationale: A separate sentence clarifies the result without narrowing Paul’s compressed contrast.
translation_notes:
