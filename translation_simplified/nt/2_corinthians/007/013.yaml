translation:
  language: en
  text: That is why we have been comforted.[a] Beyond that comfort, we rejoiced even more—far more—over Titus’s joy, because all of you refreshed his inner self.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “encouraged”; the Greek word can carry both senses here.
    reason: lexical_alternative
  - marker: b
    text: Or “his spirit has found rest”; here “spirit” means his inner self, not the Holy Spirit.
    reason: lexical_alternative
