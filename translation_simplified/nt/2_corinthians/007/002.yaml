  text: Make room for us in your hearts.[a] We have wronged no one. We have corrupted no one,[b] and we have taken advantage of no one.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek says “Make room for us,” a relational appeal that can also mean “Receive us” or “Welcome us.”
