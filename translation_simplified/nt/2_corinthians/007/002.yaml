simplification_decisions:
- pob_phrase: Make room for us
  simplified_phrase: Make room for us in your hearts
  preserved_meaning: Paul asks the Corinthians to restore relational space for him and his companions.
  reasoning_layer_used: Theological decision and immediate context in 6:11–13
  rationale: The added phrase makes the relational metaphor clear to readers who might picture physical space.
- pob_phrase: We have wronged no one, corrupted no one, taken advantage of no one.
  simplified_phrase: We have wronged no one. We have corrupted no one, and we have taken advantage of no one.
  preserved_meaning: Paul emphatically denies three distinct kinds of misconduct toward anyone.
  reasoning_layer_used: Lexical decisions and source repetition of οὐδένα
  rationale: Shorter sentences improve readability while retaining all three denials and the repeated “no one.”
interpretive_expansions:
