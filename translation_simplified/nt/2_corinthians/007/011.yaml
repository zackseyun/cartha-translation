translation:
  language: en
  text: Look at what this grief, which was in line with God’s will,[a] produced in you! You became deeply earnest. You were eager to clear yourselves. You felt indignation and fear. You had deep longing and zeal, and you took action to set things right.[b] In every way, you proved yourselves pure in this matter.
