  preserved_meaning: Paul speaks positively about the Corinthians and for their credit.
  reasoning_layer_used: Lexical and theological decisions for καύχησις and ὑπὲρ ὑμῶν
  rationale: The active clause reads naturally while retaining Paul’s positive boasting language.
- pob_phrase: in all our affliction
