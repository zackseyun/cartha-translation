  preserved_meaning: Paul says neither party to the wrong was his primary reason for writing.
  reasoning_layer_used: POB lexical decisions for ἕνεκεν and the two participles
  rationale: The active wording and repeated “person” make the contrast easier to follow.
- pob_phrase: your earnestness for us might be made known
  simplified_phrase: your deep concern for us would become clear
  preserved_meaning: The Corinthians’ serious concern for Paul and his companions was to become evident.
  reasoning_layer_used: POB lexical decisions for σπουδή, ὑπὲρ ἡμῶν, and φανερωθῆναι
  rationale: “Deep concern” and “become clear” express the same ideas in more familiar English.
- pob_phrase: among you before God
  simplified_phrase: among you before God
  preserved_meaning: Their concern became evident within their community under God’s witness.
  reasoning_layer_used: POB revision pass and theological decision
  rationale: This difficult phrase is retained because the audit deliberately preserves its tension.
