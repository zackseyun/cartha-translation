translation:
  language: en
  text: So even if I wrote to you, I did not do it because of the person who did wrong or the person who was wronged. I wrote so that your deep concern for us would become clear among you before God.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some manuscripts read, “so that our deep concern for you would become clear among you before God.”
    reason: textual_variant
