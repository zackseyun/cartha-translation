translation:
  language: en
  text: Brothers, we are telling you about the grace God has given among the churches in Macedonia.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “brothers and sisters”; the Greek masculine form often addresses the whole congregation.
    reason: lexical_alternative
  - marker: b
    text: Here “grace” includes God’s favor and may also point to the generosity his favor produced in these churches.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: We make known to you
  simplified_phrase: we are telling you about
  preserved_meaning: Paul is disclosing this matter to his readers.
  reasoning_layer_used: Lexical decision for Γνωρίζομεν
  rationale: The everyday wording preserves the verb’s communicative force without its formal phrasing.
- pob_phrase: the grace of God that has been given
  simplified_phrase: the grace God has given
  preserved_meaning: The grace comes from God and remains the result of his gift.
  reasoning_layer_used: Lexical and theological decisions for χάρις and δεδομένην
  rationale: The active wording is easier to read while retaining grace as the key theological term.
- pob_phrase: the churches of Macedonia
  simplified_phrase: the churches in Macedonia
  preserved_meaning: These are the Christian congregations located in Macedonia.
  reasoning_layer_used: Lexical decision for τῆς Μακεδονίας
  rationale: The location phrase is more natural in modern English without changing which churches Paul means.
translation_notes:
  risk_flags:
  - risk: Readers may take “grace” only as inward favor and miss its practical result in generous giving.
    mitigation: Footnote b preserves both the divine source and the contextual outworking.
