translation:
  language: en
  text: We have also sent our brother with them. We have tested him many times in many situations and found him diligent. Now he is even more diligent because he has great confidence in you.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek can also be understood, “Now he is much more earnest through his great confidence in you.” The overall sense is that his earnestness has increased in relation to you.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And we have sent with them our brother
  simplified_phrase: We have also sent our brother with them.
  preserved_meaning: Paul sent an unnamed male fellow believer along with the other delegates.
  reasoning_layer_used: Lexical decisions for συνεπέμψαμεν and ἀδελφὸν ἡμῶν.
  rationale: Natural word order clarifies that the brother accompanied the other delegates.
- pob_phrase: whom we have often tested in many matters and found to be diligent
  simplified_phrase: We have tested him many times in many situations and found him diligent.
  preserved_meaning: Repeated testing across varied circumstances demonstrated the brother’s diligence.
  reasoning_layer_used: Lexical decisions for ἐδοκιμάσαμεν, ἐν πολλοῖς πολλάκις, and σπουδαῖον ὄντα.
  rationale: A separate sentence clearly preserves both the testing and its favorable result.
- pob_phrase: but who is now even more diligent because of his great confidence in you
  simplified_phrase: Now he is even more diligent because he has great confidence in you.
  preserved_meaning: His confidence in the Corinthians explains his increased diligence.
  reasoning_layer_used: Lexical and theological decisions for σπουδαιότερον and πεποιθήσει.
  rationale: The direct clause removes the dense relative construction without changing the causal reading.
translation_notes:
  risk_flags:
