- pob_phrase: complete the doing of it also
  simplified_phrase: finish what you began
  preserved_meaning: They must carry through the contribution they had already started.
  reasoning_layer_used: lexical decisions and immediate context
  rationale: This replaces an awkward nominal phrase while retaining the command to bring the earlier action to completion.
- pob_phrase: the eagerness to will it
  simplified_phrase: You were eager to do it
  preserved_meaning: Their willing readiness to contribute is contrasted with the need to act.
  reasoning_layer_used: lexical decisions
  rationale: Natural English expresses the same positive willingness without the formal phrase “to will it.”
- pob_phrase: the completion from what you have
  simplified_phrase: complete it by giving from what you have
  preserved_meaning: They are to finish the collection using their present resources rather than beyond their means.
  reasoning_layer_used: theological decision and immediate context
  rationale: The wording makes the giving context clear while preserving the practical limit set by what they have.
