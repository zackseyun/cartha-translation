simplification_decisions:
- pob_phrase: For I do not mean that there should be
  simplified_phrase: My goal is not
  preserved_meaning: Paul explains and corrects how his purpose should be understood.
  reasoning_layer_used: Lexical decision for οὐ γὰρ and ἵνα
  rationale: The shorter wording states the same intended-purpose sense in direct English.
- pob_phrase: relief for others and hardship for you
  simplified_phrase: ease the burden on others by placing a burden on you
  preserved_meaning: Paul rejects helping others in a way that forces the Corinthians into hardship.
  reasoning_layer_used: Lexical decisions for ἄνεσις and θλῖψις
  rationale: The repeated burden language makes the practical contrast easy to grasp.
- pob_phrase: but equality
  simplified_phrase: Rather, the goal is equality
  preserved_meaning: Paul contrasts hardship-producing aid with equality as his aim.
  reasoning_layer_used: Lexical and theological decision for ἰσότης
  rationale: Equality remains in the text while the contrast is expressed as a complete sentence.
