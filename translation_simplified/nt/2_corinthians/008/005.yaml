translation:
  language: en
  text: They did not do what we expected.[a] Instead, they first gave themselves to the Lord and also to us, through the will of God.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “what we hoped.”
    reason: lexical_alternative
  - marker: b
    text: Or “by the will of God” or “in accordance with the will of God.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And not as we expected, but
  simplified_phrase: They did not do what we expected. Instead,
  preserved_meaning: Their response differed from the apostles’ expectation.
  reasoning_layer_used: Lexical decision for καθὼς ἠλπίσαμεν and the Greek contrast
  rationale: Two direct sentences make the contrast clear without changing “expected” to the viable alternative “hoped.”
- pob_phrase: they gave themselves first to the Lord and to us
  simplified_phrase: they first gave themselves to the Lord and also to us
  preserved_meaning: They personally offered themselves first to the Lord while committing themselves to Paul and his companions.
  reasoning_layer_used: Lexical and theological decisions for ἑαυτοὺς ἔδωκαν, πρῶτον, and the parallel datives
  rationale: The wording preserves self-giving, the Lord’s priority, and their subordinate cooperation with the apostles.
- pob_phrase: through the will of God
  simplified_phrase: through the will of God
  preserved_meaning: Their self-giving was related to God’s will without specifying agency, authorization, or accordance.
  reasoning_layer_used: Lexical and theological decision for διὰ θελήματος θεοῦ
  rationale: The phrase is retained because smoother alternatives would narrow its documented ambiguity.
translation_notes:
  risk_flags:
  - risk: “Through the will of God” may sound less natural than ordinary modern English.
    mitigation: The main text preserves the source ambiguity, while the footnote gives clearer viable alternatives.
  - risk: “Also to us” could be mistaken for placing the apostles on the Lord’s level.
    mitigation: The placement of “first” keeps the Lord’s priority visible without adding a stronger hierarchy than the verse states.
