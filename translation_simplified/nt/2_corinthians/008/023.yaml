translation:
  language: en
  text: Titus is my partner, working alongside me to serve you. Our brothers are messengers sent by the churches[a]. They display the glory of the Messiah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “apostles of the churches.” The Greek word can refer more broadly to representatives commissioned and sent by churches.
    reason: alternative_reading
  - marker: b
    text: Or “Christ.” “Messiah” translates the title used here.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: As for Titus, he is my partner and fellow worker for you
  simplified_phrase: Titus is my partner, working alongside me to serve you
  preserved_meaning: Titus shares Paul's work, which is directed toward the Corinthians.
  reasoning_layer_used: Lexical decisions for κοινωνός, συνεργός, and εἰς ὑμᾶς
  rationale: The participial wording makes the relationship and purpose easier to follow.
- pob_phrase: messengers of the churches
  simplified_phrase: messengers sent by the churches
  preserved_meaning: The brothers are representatives commissioned by congregations rather than holders of a specified apostolic office.
  reasoning_layer_used: Lexical and theological decisions for ἀπόστολοι ἐκκλησιῶν
  rationale: Adding “sent by” explains the commissioning built into “messengers” while the footnote preserves the alternative.
- pob_phrase: the glory of Messiah
  simplified_phrase: They display the glory of the Messiah
  preserved_meaning: The brothers embody or make visible the Messiah's glory.
  reasoning_layer_used: Lexical rationale for the verbless appositional phrase δόξα Χριστοῦ
  rationale: A complete sentence makes the Greek description understandable without weakening its glory image.
interpretive_expansions:
