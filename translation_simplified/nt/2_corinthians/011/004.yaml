translation:
  language: en
  text: For suppose someone comes and proclaims a Jesus different from the one we proclaimed. Or suppose you receive a different spirit from the one you received before, or accept a different gospel from the one you accepted before. You are all too willing to put up with it.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: For if someone comes and proclaims another Jesus, whom we did not proclaim
  simplified_phrase: For suppose someone comes and proclaims a Jesus different from the one we proclaimed.
  preserved_meaning: A newcomer presents a rival understanding of Jesus rather than the Jesus Paul proclaimed.
  reasoning_layer_used: POB lexical decision for ἄλλον Ἰησοῦν
  rationale: The comparison makes the warning immediately clear without reducing it to merely different wording about Jesus.
- pob_phrase: which you did not receive ... which you did not accept
  simplified_phrase: from the one you received before ... from the one you accepted before
  preserved_meaning: The new spirit and gospel contrast with what the Corinthians had previously received and accepted.
  reasoning_layer_used: POB lexical rationales for λαμβάνω, δέχομαι, and ἕτερος
  rationale: The repeated comparison is clearer while preserving the distinction between receiving a spirit and accepting a gospel.
- pob_phrase: you put up with it well enough
  simplified_phrase: You are all too willing to put up with it.
  preserved_meaning: Paul rebukes the Corinthians for readily tolerating rival teaching.
  reasoning_layer_used: POB theological decision on the irony of καλῶς ἀνέχεσθε
  rationale: The new wording communicates the ironic rebuke directly in natural English.
interpretive_expansions:
- pob_phrase: which you did not receive ... which you did not accept
  rendering: from the one you received before ... from the one you accepted before
  claim: The contrasts refer to the spirit and gospel the Corinthians had previously received and accepted.
  evidence:
  - The relative clauses contrast the different spirit and gospel with the Corinthians’ earlier reception.
  - The POB lexical rationale explicitly describes what they had previously received.
  confidence: high
  alternatives_preserved:
  - The precise identity of the different spirit remains unspecified.
- pob_phrase: you put up with it well enough
  rendering: You are all too willing to put up with it.
  claim: Paul is criticizing excessive tolerance rather than commending the Corinthians.
  evidence:
  - The POB theological decision identifies the phrase as an ironic rebuke.
  - The surrounding warning concerns tolerance of rival teachers and teaching.
  confidence: high
translation_notes:
  risk_flags:
