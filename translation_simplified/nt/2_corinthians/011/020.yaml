simplification_decisions:
- pob_phrase: For you put up with it if someone
  simplified_phrase: After all, you tolerate anyone who
  preserved_meaning: Paul explains his preceding irony by pointing to their actual tolerance of abusive people.
  reasoning_layer_used: POB lexical and theological decisions on γάρ, ἀνέχεσθε, and rhetorical tone
  rationale: The new wording makes the explanatory link and rebuke easier to follow.
- pob_phrase: if someone devours you, if someone takes from you
  simplified_phrase: anyone who devours you, takes from you
  preserved_meaning: The predatory image and the broad idea of exploitative taking both remain distinct.
  reasoning_layer_used: POB lexical decisions on κατεσθίει and λαμβάνει
  rationale: Combining the repeated conditions shortens the sentence without weakening either action.
- pob_phrase: if someone exalts himself
  simplified_phrase: sets himself above you
  preserved_meaning: The abuser arrogantly raises his own status in relation to the Corinthians.
  reasoning_layer_used: POB lexical decision on ἐπαίρεται
  rationale: This common expression preserves the reflexive image of self-exaltation.
