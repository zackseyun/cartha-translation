translation:
  language: en
  text: After all, you tolerate anyone who enslaves you. You tolerate anyone who devours you, takes from you,[a] sets himself above you, or strikes you in the face.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “takes advantage of you”; the wording does not specify exactly what is taken.
