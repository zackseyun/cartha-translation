translation:
  language: en
  text: Or did I sin by lowering myself so that you could be lifted up, because I proclaimed God’s gospel to you free of charge?
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: did I commit a sin
  simplified_phrase: did I sin
  preserved_meaning: Paul keeps the moral category of sin within a pointed rhetorical question.
  reasoning_layer_used: POB lexical decision for ἁμαρτίαν ἐποίησα
  rationale: The shorter verb form is natural English and is explicitly supported by the POB alternative.
- pob_phrase: by humbling myself so that you might be exalted
  simplified_phrase: by lowering myself so that you could be lifted up
  preserved_meaning: Paul contrasts his lowered position with the Corinthians being raised in honor or status.
  reasoning_layer_used: POB lexical decisions for ταπεινόω and ὑψόω
  rationale: The paired images make the status reversal easier to grasp while preserving its force.
- pob_phrase: the gospel of God to you free of charge
  simplified_phrase: God’s gospel to you free of charge
  preserved_meaning: Paul proclaimed the gospel belonging to or coming from God without requiring payment.
  reasoning_layer_used: POB lexical decisions for τὸ τοῦ θεοῦ εὐαγγέλιον and δωρεάν
  rationale: The possessive form is smoother without changing the POB’s theological wording or financial point.
translation_notes:
  risk_flags:
  - risk: “Lifted up” could be misunderstood as physical movement rather than increased honor or status.
    mitigation: Its direct contrast with “lowering myself” preserves Paul’s figurative status reversal.
  - risk: The question could be read as a sincere admission rather than irony.
    mitigation: The unchanged rhetorical question preserves the tension without adding commentary.
