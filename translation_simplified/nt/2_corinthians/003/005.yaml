simplification_decisions:
- pob_phrase: Not that we are sufficient in ourselves
  simplified_phrase: It is not that we are able on our own
  preserved_meaning: Paul qualifies his preceding claim while denying self-derived adequacy.
  reasoning_layer_used: Lexical decisions for οὐχ ὅτι, ἀφ’ ἑαυτῶν, and ἱκανοί
  rationale: The qualifying opener preserves Paul’s rhetorical turn while expressing sufficiency in common language.
- pob_phrase: to consider anything as coming from ourselves
  simplified_phrase: to regard anything as originating with us
  preserved_meaning: We cannot assess anything as having its source in ourselves.
  reasoning_layer_used: Lexical decisions for λογίσασθαί, τι, and ὡς ἐξ αὑτῶν
  rationale: “Regard” conveys mental assessment, while “originating” makes the source relationship clear.
- pob_phrase: our sufficiency is from God
  simplified_phrase: Our ability comes from God
  preserved_meaning: God is the source of the capacity we possess.
  reasoning_layer_used: Lexical decisions for ἡ ἱκανότης ἡμῶν and ἐκ τοῦ θεοῦ
  rationale: The concrete wording replaces an abstract construction without narrowing the claim to ministry.
translation_notes:
  risk_flags:
  - risk: “Ability” may sound narrower than the broad idea of adequacy.
    mitigation: The unrestricted “anything” and lack of a ministry qualifier preserve the broad scope.
