translation:
  language: en
  text: God has also made us able to serve under a new covenant—not according to the letter, but according to the Spirit.[a] For the letter[b] kills, but the Spirit gives life.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “spirit” in both places.
    reason: alternative_reading
  - marker: b
    text: “Letter” may also mean “written code.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: made us competent as servants
  simplified_phrase: made us able to serve
  preserved_meaning: God enabled Paul and his coworkers for service rather than merely declaring them adequate.
  reasoning_layer_used: Lexical decisions for ἱκάνωσεν and διακόνους.
  rationale: The verbal form is more natural while retaining both divine enablement and service.
- pob_phrase: servants of a new covenant
  simplified_phrase: serve under a new covenant
  preserved_meaning: Their service belongs to the new-covenant relationship.
  reasoning_layer_used: Lexical decision for καινῆς διαθήκης.
  rationale: “Under” makes the relationship clear without replacing the key biblical term “covenant.”
- pob_phrase: not of the letter but of the Spirit
  simplified_phrase: not according to the letter, but according to the Spirit
  preserved_meaning: Their new-covenant service is characterized by the Spirit rather than the letter.
  reasoning_layer_used: Lexical and theological decisions for γράμμα and πνεῦμα.
  rationale: The repeated phrase expresses the contrast in ordinary English while preserving both source images.
interpretive_expansions:
- pob_phrase: who also
  rendering: God has also
  claim: The relative pronoun refers to God as the one who enables the servants.
  evidence:
  - The preceding context says their competence comes from God.
  confidence: high
translation_notes:
  risk_flags:
  - risk: Capitalizing “Spirit” identifies the Holy Spirit although Greek capitalization does not decide the issue.
    mitigation: The footnote preserves the possible rendering “spirit.”
  - risk: Modern readers may take “letter” to mean a piece of correspondence.
    mitigation: The footnote gives “written code” as the contextual lexical alternative.
