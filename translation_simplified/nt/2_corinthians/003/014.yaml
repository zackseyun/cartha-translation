translation:
  language: en
  text: But their minds were dulled. Even today, when the old covenant[a] is read, that same veil remains and is not lifted, because in Messiah it is removed.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek says “old covenant,” traditionally called the “Old Testament.”
    reason: lexical_alternative
  - marker: b
    text: Or the final clause may mean, “because in Messiah the old covenant is set aside.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: their minds were hardened
  simplified_phrase: their minds were dulled
  preserved_meaning: Their capacity for spiritual perception had become insensitive without implying absolute inability.
  reasoning_layer_used: lexical decisions for ἐπωρώθη and νοήματα
  rationale: “Dulled” clearly expresses impaired understanding without overstating the hardening.
- pob_phrase: For until this very day, at the reading of the old covenant
  simplified_phrase: Even today, when the old covenant is read
  preserved_meaning: The condition continues whenever the old covenant is read.
  reasoning_layer_used: lexical decisions for the temporal phrase and ἐπὶ τῇ ἀναγνώσει
  rationale: Natural clause order makes the time and setting easy to follow.
- pob_phrase: the same veil remains, not being lifted
  simplified_phrase: that same veil remains and is not lifted
  preserved_meaning: The veil continues to obstruct perception, preserving the image linked to Moses.
  reasoning_layer_used: lexical decisions for κάλυμμα, μένει, and μὴ ἀνακαλυπτόμενον
  rationale: A coordinated clause replaces the awkward participle while retaining the veil image.
translation_notes:
  risk_flags:
  - risk: The final verb may refer to the old covenant rather than the veil.
    mitigation: The main text follows POB’s preferred veil referent, while footnote [b] preserves the significant alternative.
