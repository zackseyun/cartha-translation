translation:
  language: en
  text: You are clearly a letter from the Messiah,[a] delivered by us. This letter is written not with ink but with the Spirit of the living God. It is written not on stone tablets but on tablets of flesh—human hearts.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a letter of Christ.” The Greek can express either wording; here it likely means that the letter comes from the Messiah.
    reason: alternative_reading
  - marker: b
    text: This image of hearts of flesh echoes Ezekiel 11:19 and 36:26.
    reason: cross_reference
simplification_decisions:
- pob_phrase: showing that you are
  simplified_phrase: You are clearly
  preserved_meaning: The Corinthians are openly evident as the Messiah’s letter.
  reasoning_layer_used: Lexical decision for φανερούμενοι and grounding review
  rationale: This recasts the participle naturally without making the Corinthians active agents.
- pob_phrase: ministered by us
  simplified_phrase: delivered by us
  preserved_meaning: Paul and his coworkers are the agents through whom the Messiah’s letter comes.
  reasoning_layer_used: Lexical decision for διακονηθεῖσα
  rationale: “Delivered” preserves the letter metaphor and avoids unclear church terminology.
- pob_phrase: on tablets of hearts of flesh
  simplified_phrase: on tablets of flesh—human hearts
  preserved_meaning: Living human hearts are the tablets, in contrast to tablets made of stone.
  reasoning_layer_used: Lexical rationale, grammatical review, and Ezekiel cross-reference
  rationale: The apposition makes the image understandable while retaining flesh, hearts, and tablets.
interpretive_expansions:
- pob_phrase: tablets of hearts of flesh
  rendering: tablets of flesh—human hearts
  claim: The tablets are living human hearts, not tablets belonging to hearts.
  evidence:
  - The Greek construction identifies the tablets with hearts of flesh.
  - The lexical record lists “human hearts as tablets” as an idiomatic alternative.
  - The POB cross-reference links the image to Ezekiel’s heart-of-flesh language.
  confidence: high
  alternatives_preserved:
  - hearts of flesh
  - tablets that are hearts of flesh
translation_notes:
  risk_flags:
  - risk: “From the Messiah” resolves a Greek genitive that can also be rendered “of Christ.”
    mitigation: Footnote a preserves the more literal alternative and explains the main reading.
  - risk: Reordering “hearts of flesh” may make the Ezekiel wording less immediately recognizable.
    mitigation: The text retains the flesh-and-heart image, and footnote b identifies the echo.
