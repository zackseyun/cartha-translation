translation:
  language: en
  text: I am afraid that when I return, my God may humble me in your presence[a] and that I will mourn over many who sinned before and still have not repented of the impurity, sexual immorality, and shameless, unrestrained behavior they practiced.
  philosophy: optimal-equivalence
