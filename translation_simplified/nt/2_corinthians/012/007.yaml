translation:
  language: en
  text: Because these revelations were so extraordinary, a thorn in my flesh[a] was given to me to keep me from thinking too highly of myself—a messenger of Satan[b] that kept striking me, so that I would not think too highly of myself.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The exact affliction is not identified; the Greek image may also suggest a sharp stake or splinter.
    reason: lexical_alternative
  - marker: b
    text: The Greek word for “messenger” can also mean “angel.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: because of the surpassing greatness of the revelations
  simplified_phrase: because these revelations were so extraordinary
  preserved_meaning: The revelations were exceptional in greatness.
  reasoning_layer_used: lexical decision for ὑπερβολῇ
  rationale: The simpler clause keeps the strong emphasis without the abstract phrase “surpassing greatness.”
- pob_phrase: so that I might not exalt myself
  simplified_phrase: to keep me from thinking too highly of myself
  preserved_meaning: The affliction prevented Paul from becoming self-exalting or conceited.
  reasoning_layer_used: lexical decision for ὑπεραίρωμαι and source repetition
  rationale: Common wording clarifies the reflexive idea while retaining both occurrences.
- pob_phrase: so that it might torment me
  simplified_phrase: that kept striking me
  preserved_meaning: The messenger repeatedly afflicted Paul with the force of blows.
  reasoning_layer_used: lexical decision for κολαφίζῃ
  rationale: “Kept striking” preserves the verb’s violent image in natural English.
