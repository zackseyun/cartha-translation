translation:
  language: en
  text: I will boast about such a person.[a] But when it comes to myself, I will boast only about my weaknesses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “on behalf of such a person.” Paul’s indirect wording does not settle here whether he means another person or is distancing himself from his own experience.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: On behalf of such a one
  simplified_phrase: about such a person
  preserved_meaning: Paul refers indirectly to the particular person associated with the experience while maintaining rhetorical distance.
  reasoning_layer_used: lexical and theological decisions
  rationale: “Such a person” is natural English without turning the reference into a type or settling the person’s identity.
- pob_phrase: on behalf of myself I will not boast, except in my weaknesses
  simplified_phrase: when it comes to myself, I will boast only about my weaknesses
  preserved_meaning: Paul refuses to boast about himself apart from boasting about his own weaknesses.
  reasoning_layer_used: lexical and theological decisions
  rationale: The positive “only” construction states the exception clearly while preserving the contrast.
translation_notes:
  risk_flags:
  - risk: Readers may assume the person is certainly someone other than Paul.
    mitigation: The footnote preserves the autobiographical ambiguity and explains Paul’s rhetorical distance.
