translation:
  language: en
  text: 'In what way were you treated worse than the other churches? Only in this: I myself did not burden you by accepting your financial support. Forgive me for this wrong.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: For in what were you treated as inferior to the rest of the churches
  simplified_phrase: In what way were you treated worse than the other churches?
  preserved_meaning: Paul asks in what respect the Corinthians were put at a disadvantage compared with his other churches.
  reasoning_layer_used: Lexical decisions for ἡσσώθητε and ὑπὲρ τὰς λοιπὰς ἐκκλησίας.
  rationale: The direct question replaces difficult comparative wording while preserving the rhetorical comparison.
- pob_phrase: except that I myself did not become a burden to you
  simplified_phrase: 'Only in this: I myself did not burden you by accepting your financial support.'
  preserved_meaning: Paul personally refused financial support from the Corinthians.
  reasoning_layer_used: Lexical decision for οὐ κατενάρκησα ὑμῶν and cultural footnote b.
  rationale: The wording states the kind of burden plainly without weakening Paul's personal emphasis.
- pob_phrase: Forgive me this wrong
  simplified_phrase: Forgive me for this wrong.
  preserved_meaning: Paul ironically calls his refusal of support a wrong and asks their forgiveness.
  reasoning_layer_used: Lexical decisions for χαρίσασθέ μοι and τὴν ἀδικίαν ταύτην, guarded by the theological decision.
  rationale: The natural English construction retains the ironic sting without explaining it inside the verse.
interpretive_expansions:
- pob_phrase: did not become a burden to you
  rendering: did not burden you by accepting your financial support
  claim: The burden in view is financial support Paul declined to accept from the Corinthians.
  evidence:
  - The POB lexical rationale identifies a financial or material burden in this context.
  - POB cultural footnote b explicitly connects the phrase with accepting support from them.
  confidence: high
  alternatives_preserved:
  - did not become a burden to you
  - did not take advantage of you financially
translation_notes:
  risk_flags:
  - risk: “Treated worse” may sound broader than being placed at a comparative disadvantage.
    mitigation: The comparison with the other churches and the following financial explanation bound its meaning.
  - risk: Some readers may miss that “this wrong” is ironic.
    mitigation: The apparent mismatch between refusing support and calling it wrong preserves Paul's irony without added commentary.
