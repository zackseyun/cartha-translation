translation:
  language: en
  text: I know a man who is united with Messiah.[a] Fourteen years ago, he was caught up to the third heaven.[b] I do not know whether he was in his body or outside his body when this happened. God knows.
  philosophy: optimal-equivalence
  footnotes:
