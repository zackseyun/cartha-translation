- pob_phrase: a man in Messiah
  simplified_phrase: a man who is united with Messiah
  preserved_meaning: The man belongs to Messiah in Paul’s covenantal-union sense.
  reasoning_layer_used: lexical and theological decisions for ἐν Χριστῷ
  rationale: The clearer wording explains the relationship while retaining Messiah as a title.
- pob_phrase: who, fourteen years ago—whether in the body I do not know, or outside the body I do not know, God knows—was caught up
  simplified_phrase: Fourteen years ago, he was caught up ... I do not know whether ... God knows.
  preserved_meaning: The ascent occurred fourteen years earlier, but Paul does not know its bodily mode.
  reasoning_layer_used: source syntax and theological ambiguity decision
  rationale: Separate sentences untangle the interruption without resolving Paul’s uncertainty.
- pob_phrase: whether in the body ... or outside the body
  simplified_phrase: whether he was in his body or outside his body when this happened
  preserved_meaning: The experience may have been bodily or non-bodily.
  reasoning_layer_used: lexical decisions for ἐν σώματι and ἐκτὸς τοῦ σώματος
  rationale: Explicit pronouns make the contrast immediately understandable.
