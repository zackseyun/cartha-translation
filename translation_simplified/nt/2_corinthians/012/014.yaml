translation:
  language: en
  text: Look, this is the third time I am ready to visit you. I will not be a financial burden to you. I do not want your possessions; I want you. Children are not obligated to save up for their parents. Instead, parents should save up for their children.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: this is the third time I am ready to come to you
  simplified_phrase: this is the third time I am ready to visit you
  preserved_meaning: Paul is presently ready for a third intended visit without specifying how many visits occurred.
  reasoning_layer_used: POB theological decision on the third-time language
  rationale: “Visit” clarifies the purpose of his coming while retaining his present readiness.
- pob_phrase: I do not seek what is yours, but you
  simplified_phrase: I do not want your possessions; I want you
  preserved_meaning: Paul contrasts their material goods with the people themselves.
  reasoning_layer_used: POB lexical decision for ζητῶ τὰ ὑμῶν ἀλλὰ ὑμᾶς
  rationale: Two direct clauses make the contrast immediately clear.
- pob_phrase: children are not obligated to store up for their parents, but parents for their children
  simplified_phrase: Children are not obligated to save up for their parents. Instead, parents should save up for their children.
  preserved_meaning: The normal responsibility to accumulate provision runs from parents to children.
  reasoning_layer_used: POB lexical decisions for ὀφείλει and θησαυρίζειν
  rationale: “Save up” is common English that preserves the image of accumulated provision.
