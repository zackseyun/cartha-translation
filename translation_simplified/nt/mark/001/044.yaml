translation:
  language: en
  text: He said to him, "Make sure you don’t say anything to anyone. Instead, go, show yourself to the priest, and offer what Moses commanded for your cleansing, as a testimony to them."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'as a testimony against them.' The phrase can mean evidence presented to the priests and community, or it can refer more sharply to a warning or accusation against them.
    reason: simplification_note
