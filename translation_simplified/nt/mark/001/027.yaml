translation:
  language: en
  text: Everyone was amazed. They began talking with one another, saying, “What is this? A new teaching with authority![a] He even commands the unclean spirits, and they obey him!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “What is this? What is this new teaching with authority?” The Greek can be punctuated so that “new teaching” is part of the question.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: And they were all amazed
  simplified_phrase: Everyone was amazed.
  preserved_meaning: The whole crowd was struck with amazement.
  reasoning_layer_used: Lexical decision for ἐθαμβήθησαν and ἅπαντες
  rationale: “Everyone” states the crowd’s total reaction directly, and a short sentence gives it clarity.
- pob_phrase: so that they discussed among themselves
  simplified_phrase: They began talking with one another
  preserved_meaning: Their amazement led to a shared conversation.
  reasoning_layer_used: Lexical decision for ὥστε συζητεῖν πρὸς ἑαυτούς
  rationale: “Talking with one another” is more immediate than “discussed among themselves” while keeping the collective result.
- pob_phrase: A new teaching with authority!
  simplified_phrase: A new teaching with authority!
  preserved_meaning: The crowd recognizes both the newness of Jesus’ teaching and his commanding authority.
  reasoning_layer_used: Theological decision on the attachment of κατ’ ἐξουσίαν
  rationale: The main reading is retained because simplifying it would risk resolving the documented structural ambiguity.
translation_notes:
  risk_flags:
  - risk: “Unclean spirits” may be unfamiliar to readers new to biblical language.
    mitigation: The term is retained because “evil spirits” would weaken its documented ritual and moral force.
