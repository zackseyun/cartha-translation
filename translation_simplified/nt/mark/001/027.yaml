translation_notes:
  source_alignment_notes: Maintained the exclamatory declaration 'A new teaching with authority!' as the primary text, aligning with the POB's preferred reading. The alternate punctuation is preserved in footnote [a] to ensure the structural ambiguity is not completely flattened.
  readability_notes:
  - The sentence structure is smoothed by changing 'so that they discussed' to 'and began discussing,' which reads more naturally in contemporary narrative English while preserving the causal result of their amazement.
  compression_notes:
  - Slightly streamlined the initial conjunctions and crowd descriptors ('And they were all' to 'Everyone was') to increase the punchiness of the narrative opening without losing the sense of totality (ἅπαντες).
  risk_flags:
  - risk: Retaining 'unclean spirits' instead of 'evil spirits' risks sounding slightly traditional to readers completely unfamiliar with biblical terms, but it was deemed necessary to prevent theological flattening.
    mitigation: Flag retained for reviewer attention.
