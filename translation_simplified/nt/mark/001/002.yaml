translation_notes:
  source_alignment_notes: The draft maintains strict alignment with the SBLGNT source text by preserving the citation 'in the prophet Isaiah' rather than harmonizing it to 'the prophets.' It translates 'ἄγγελος' as 'messenger' to respect the context of John the Baptist's human role, avoiding the misleading connotations of 'angel' in this context. The translation 'I am sending' accurately represents the progressive present aspect of 'ἀποστέλλω' in modern English.
  readability_notes:
  - Replacing 'Behold' with 'Look' makes the prophecy feel immediate and conversational without diminishing its gravity. Switching the word order to 'the prophet Isaiah' and replacing the Hebrew idiom 'before your face' with 'ahead of you' removes unnatural grammatical friction, allowing a modern reader to focus on the semantic content of the passage.
  compression_notes:
  - The footnote detailing the literal Greek expression 'before your face' (footnote [c] in the POB) was removed because 'ahead of you' is a standard and completely accurate English rendering of the idiom. Keeping this footnote would create unnecessary technical overhead for the target audience. However, the footnotes highlighting the textual variant and the composite nature of the citation are preserved as they are critical for resolving potential confusion regarding the quotation's origin.
  risk_flags:
  - risk: There is a minor risk that 'Look' might feel slightly less formal than 'Behold' to traditional readers, but it is necessary for accessibility. Additionally, maintaining the attribution of Malachi's words to Isaiah carries historical and theological difficulty, but this is handled responsibly by retaining the text's original reading and explaining the composite quote in footnote [b] rather than smoothing over the tension.
    mitigation: Flag retained for reviewer attention.
