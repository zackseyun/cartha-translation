translation_notes:
  source_alignment_notes: The translation preserves the temporal tension of the Greek perfect verbs. 'Peplerotai' (has been fulfilled) is represented by 'has come' to show the arrival of the new era, and 'eggiken' (has drawn near) is represented by 'is near' to show immediate proximity. 'The appointed time' aligns precisely with 'kairos' as a specific, decisive moment rather than general time.
  readability_notes:
  - The passive 'has been fulfilled' was converted to the active 'has come' to improve comprehension. The narrative flow is enhanced by resolving the participle 'and saying' into 'He was saying,' which fits modern storytelling style.
  compression_notes:
  - Syntactic compression was applied by omitting the preposition 'in' from 'believe in the good news,' converting it to 'believe the good news' to match natural modern usage.
  risk_flags:
  - risk: Using the term 'Repent' may carry moralistic or archaic baggage for some modern readers, but it is retained to avoid theological dilution. 'The appointed time' is slightly formal, but necessary to prevent the loss of the distinction between 'kairos' and general clock time.
    mitigation: Flag retained for reviewer attention.
