translation:
  language: en
  text: He said to them, “Let’s go somewhere else, to the neighboring towns[a], so I can preach there too. That is why I came out.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word can refer to smaller settlements, something between villages and towns.
    reason: lexical_alternative
  - marker: b
    text: Or “for this purpose I came out.” This phrase may refer specifically to Jesus leaving his immediate location, or more broadly to his purpose in going out to preach.
    reason: alternative_reading
