  text: People from all over the Judean countryside and all the people of Jerusalem were going out to John. He was baptizing them in the Jordan River as they confessed their sins.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: all the Judean countryside
  simplified_phrase: People from all over the Judean countryside
  preserved_meaning: People were coming from throughout the region without claiming that every resident came.
  reasoning_layer_used: POB lexical and theological decisions on πᾶσα ἡ Ἰουδαία χώρα
  rationale: The geographic wording preserves the broad collective force of “all” without making it mathematically universal.
- pob_phrase: they were being baptized by him
  simplified_phrase: He was baptizing them
  preserved_meaning: John repeatedly performed the baptisms as the people came.
  reasoning_layer_used: POB lexical decision on the imperfect passive ἐβαπτίζοντο and contextual referent ὑπ’ αὐτοῦ
  rationale: The active sentence is easier to read while retaining the ongoing action and the same participants.
- pob_phrase: confessing their sins
  simplified_phrase: as they confessed their sins
  preserved_meaning: Their confession accompanied their baptism.
  reasoning_layer_used: POB lexical decision on the attendant participle ἐξομολογούμενοι
  rationale: A finite clause states the relationship more naturally in modern English.
