  rationale: The smoother past-tense sentence is easier to read without changing the action.
- pob_phrase: What have I to do with you
  simplified_phrase: What do you have to do with me
  preserved_meaning: Preserves the idiom's sharp expression of distance and conflict.
  reasoning_layer_used: POB lexical decision and idiom footnote
  rationale: This common wording makes the protest immediately understandable.
- pob_phrase: I adjure you by God
  simplified_phrase: I solemnly beg you in God’s name
  preserved_meaning: Preserves both the urgent plea and its striking oath-like appeal to God.
  reasoning_layer_used: POB lexical and theological decisions for ὁρκίζω σε τὸν θεόν
  rationale: “Solemnly beg” is accessible while retaining more force than an ordinary request.
