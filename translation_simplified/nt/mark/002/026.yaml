  text: how he entered the house of God during the time of Abiathar the high priest[a], and ate the bread of the Presence[b]—which only priests are allowed to eat—and also gave some to those who were with him?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'during the high priesthood of Abiathar.' The Greek phrase can also be understood more broadly as referring to the lifetime or the story of Abiathar the high priest.
