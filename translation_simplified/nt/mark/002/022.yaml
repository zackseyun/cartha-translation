translation:
  language: en
  text: No one puts new wine into old wineskins. Otherwise, the wine will burst the skins, and both the wine and the skins will be ruined. Instead, new wine is for fresh wineskins.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word translated “fresh” is different from the word translated “new” for the wine. It emphasizes newness or freshness in contrast with the old skins.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And no one puts new wine into old wineskins.
  simplified_phrase: No one puts new wine into old wineskins.
  preserved_meaning: The saying begins with the same universal statement and retains the cultural image of wineskins.
  reasoning_layer_used: POB translation and lexical decisions
  rationale: Removing the opening “And” makes the sentence more direct without changing its meaning.
- pob_phrase: the wine will burst the wineskins, and the wine is ruined, and the wineskins too
  simplified_phrase: the wine will burst the skins, and both the wine and the skins will be ruined
  preserved_meaning: The fermenting wine bursts the containers, ruining both wine and skins.
  reasoning_layer_used: POB lexical decisions
  rationale: Combining the repeated losses into “both” makes the result easier to follow while preserving each loss.
- pob_phrase: But new wine is for fresh wineskins.
  simplified_phrase: Instead, new wine is for fresh wineskins.
  preserved_meaning: The final clause remains a general principle rather than becoming a command.
  reasoning_layer_used: POB theological decision on the elliptical clause
  rationale: “Instead” clearly marks the contrast while “is for” retains the saying’s non-imperative form.
translation_notes:
  risk_flags:
  - risk: Readers may take “fresh” as merely a stylistic synonym for “new.”
    mitigation: The footnote explains the distinct Greek wording and qualitative contrast without defining the skins as unused or worn-out.
