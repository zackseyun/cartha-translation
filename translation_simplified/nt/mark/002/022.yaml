translation:
  language: en
  text: No one puts new wine into old wineskins. Otherwise, the wine will burst the skins, and both the wine and the skins will be ruined. Instead, new wine is for fresh wineskins.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word for 'fresh' is different from the word for 'new' used of the wine. It means 'new in quality' (unused), contrasting with 'old' (worn-out) skins.
    reason: simplification_note
