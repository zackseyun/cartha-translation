  text: When the teachers of the law who were Pharisees saw that Jesus was eating[a] with sinners and tax collectors, they asked his disciples, "Why does he eat with tax collectors and sinners?"
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, more dynamically, 'shares meals with.' The Greek literally says 'eats with,' which in context implies close table fellowship.
