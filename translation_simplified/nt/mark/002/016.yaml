  text: When the teachers of the law who were Pharisees saw that Jesus was eating[a] with sinners and tax collectors, they were asking his disciples, “Why does he eat with tax collectors and sinners?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
