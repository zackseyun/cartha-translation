translation:
  language: en
  text: He began to teach them that the Son of Man must suffer many things. He must be rejected by the Jewish elders, the chief priests, and the teachers of the law. He must be killed and rise again after three days.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mark says “after three days”; some English traditions express the timing as “on the third day.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: the elders and the chief priests and the scribes
  simplified_phrase: the Jewish elders, the chief priests, and the teachers of the law
  preserved_meaning: The three distinct groups of recognized Jewish leaders remain separate.
  reasoning_layer_used: POB lexical decisions for πρεσβύτεροι, ἀρχιερεῖς, and γραμματεῖς
  rationale: The functional wording prevents readers from mistaking the elders for merely older people or the scribes for copyists.
- pob_phrase: must suffer many things, and be rejected ... and be killed, and after three days rise again
  simplified_phrase: must suffer many things. He must be rejected ... He must be killed and rise again after three days
  preserved_meaning: The necessity and sequence of suffering, rejection, death, and resurrection are retained.
  reasoning_layer_used: POB translation and theological decision for δεῖ
  rationale: Short sentences make the prediction easier to follow while repeating “must” to preserve its force.
interpretive_expansions:
- pob_phrase: the elders ... and the scribes
  rendering: the Jewish elders ... and the teachers of the law
  claim: These titles identify Jewish leaders, including experts in the law, rather than simply older people and copyists.
  evidence:
  - The POB identifies the elders as a recognized Jewish leadership group.
  - The POB says the scribes functioned as legal experts and lists “teachers of the law” as an alternative.
  confidence: high
  alternatives_preserved:
  - elders
  - scribes
  - legal experts
translation_notes:
  risk_flags:
  - risk: Repeating “must” could imply separate necessities more emphatically than the single Greek verb.
    mitigation: The repetition only carries the same governing necessity across the simplified sentences.
  - risk: “Teachers of the law” replaces the historically specific title “scribes.”
    mitigation: The POB lists this functional equivalent, and the rendering prevents a common modern misunderstanding.
