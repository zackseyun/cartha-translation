translation:
  language: en
  text: When they return from the marketplace, they do not eat until they wash themselves.[a] They follow many other practices they have received, including washing cups, pitchers, copper vessels, and dining couches.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “immerse themselves.” The Greek uses a verb often translated “baptize,” but here it refers to ritual washing connected with purity customs.
    reason: lexical_alternative
  - marker: b
    text: Some manuscripts omit “and dining couches.”
    reason: textual_variant
