  text: 'For Moses said: “Honor your father and your mother.” He also said: “Anyone who speaks evil of a father or mother must certainly die.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: For Moses said ... and ...
  simplified_phrase: For Moses said ... He also said ...
  preserved_meaning: Keeps both sayings as Moses’ supporting testimony while separating them for clarity.
  reasoning_layer_used: Immediate context and POB connective rationale
  rationale: Two complete sentences make the paired quotations easier to follow.
- pob_phrase: Whoever speaks evil of
  simplified_phrase: Anyone who speaks evil of
  preserved_meaning: Retains the broad reference to any person and the verb’s general sense of reviling or cursing.
  reasoning_layer_used: POB lexical decision for Ὁ κακολογῶν
  rationale: “Anyone who” is more natural modern English without narrowing the offense.
- pob_phrase: must surely die
  simplified_phrase: must certainly die
  preserved_meaning: Preserves both the required legal consequence and the certainty expressed by the formula.
  reasoning_layer_used: POB lexical and theological decisions for θανάτῳ τελευτάτω
  rationale: “Must certainly die” makes the legal formula transparent without specifying execution.
translation_notes:
  risk_flags:
  - risk: “Speaks evil of” may be understood more broadly than formal cursing.
    mitigation: The wording follows POB’s chosen broad lexical sense rather than narrowing the verb.
  - risk: “Must certainly die” may sound descriptive rather than judicial.
    mitigation: The word “must” retains the formula’s obligatory legal force.
