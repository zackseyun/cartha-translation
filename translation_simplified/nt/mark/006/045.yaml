translation:
  language: en
  text: Immediately Jesus made his disciples get into the boat and go ahead of him to the other side, toward Bethsaida. He would stay behind until he had dismissed the crowd.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: he compelled his disciples
  simplified_phrase: Jesus made his disciples
  preserved_meaning: Jesus strongly directed his disciples rather than merely suggesting that they leave.
  reasoning_layer_used: POB lexical decision for ἠνάγκασεν and narrative context
  rationale: “Made” is common English and retains the force of Jesus’ command.
- pob_phrase: go ahead
  simplified_phrase: go ahead of him
  preserved_meaning: The disciples were to leave before Jesus.
  reasoning_layer_used: POB lexical decision for προάγειν
  rationale: Adding “of him” makes the relational meaning immediately clear.
- pob_phrase: until he himself dismissed the crowd
  simplified_phrase: He would stay behind until he had dismissed the crowd.
  preserved_meaning: Jesus personally remained to send the crowd away before following the disciples.
  reasoning_layer_used: POB lexical decisions for ἕως, αὐτός, and ἀπολύει
  rationale: A separate sentence clarifies Jesus’ action while preserving the temporal limit expressed by “until.”
interpretive_expansions:
- pob_phrase: he himself
  rendering: He would stay behind
  claim: Jesus remained with the crowd when the disciples left ahead of him.
  evidence:
  - The disciples are told to go ahead, while emphatic αὐτός assigns the dismissal to Jesus personally.
  - The temporal marker “until” relates their departure to Jesus’ dismissal of the crowd.
  confidence: high
