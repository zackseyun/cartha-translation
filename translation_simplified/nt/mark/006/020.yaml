translation:
  language: en
  text: Herod feared John because he knew that John was a righteous and holy man, and he kept John safe. When Herod heard John, he was very confused, yet he was glad to listen to him.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some manuscripts read “he did many things” instead of “he was very confused.”
    reason: textual_variant
simplification_decisions:
- pob_phrase: knowing that he was a righteous and holy man
  simplified_phrase: because he knew that John was a righteous and holy man
  preserved_meaning: Preserves John's moral uprightness and holiness as the reason for Herod's response.
  reasoning_layer_used: POB lexical decision for εἰδὼς
  rationale: The causal wording and repeated name make the relationship clear.
- pob_phrase: when he heard him ... yet he listened to him gladly
  simplified_phrase: When Herod heard John ... yet he was glad to listen to him
  preserved_meaning: Preserves the contrast between Herod's perplexity and his pleasure in hearing John.
  reasoning_layer_used: POB lexical decisions for ἀκούσας αὐτοῦ and ἡδέως αὐτοῦ ἤκουεν
  rationale: Varied wording avoids awkward repetition without merging the two hearing clauses.
- pob_phrase: he was greatly perplexed
  simplified_phrase: he was very confused
  preserved_meaning: Keeps Herod's strong uncertainty in common English.
  reasoning_layer_used: POB lexical and textual decisions for πολλὰ ἠπόρει
  rationale: “Very confused” clearly expresses the preferred critical-text reading.
translation_notes:
  risk_flags:
  - risk: “Confused” may sound less like being at a loss than “perplexed.”
    mitigation: The intensifier “very” retains the strength of Herod's reaction.
  - risk: A significant manuscript tradition reads “he did many things.”
    mitigation: The alternative is retained in footnote [a].
