translation:
  language: en
  text: Wherever he entered villages, cities, or countryside, people laid the sick in the marketplaces. They begged him to let them touch even the fringe of his garment[a], and everyone who touched it was healed.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'hem' or 'tassel/fringe.' The word can refer to the edge of a garment and may evoke Jewish garment tassels.
    reason: simplification_note
  - marker: b
    text: The Greek verb can mean 'were saved'; in this context it refers to physical healing and restoration.
    reason: simplification_note
