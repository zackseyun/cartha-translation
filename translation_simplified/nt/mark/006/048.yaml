translation:
  language: en
  text: He saw them straining at the oars because the wind was against them. Around the fourth watch of the night[a], he came to them, walking on the sea[b], and he intended to pass by them.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The fourth watch of the night was roughly 3:00 to 6:00 a.m. in Roman timekeeping.
    reason: cultural_note
  - marker: b
    text: Or “walking on the water.” The Greek says “on the sea.”
    reason: lexical_alternative
  - marker: c
    text: This may simply mean that he intended to go past them, but it may also echo Old Testament scenes where God “passes by” in self-revelation.
    reason: alternative_reading
