translation:
  language: en
  text: At about three in the afternoon,[a] Jesus cried out loudly, “Eloi, Eloi, lema sabachthani?”[b] This means, “My God, my God, why have you forsaken me?”[c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally “at the ninth hour,” using the ancient way of counting daylight hours.
    reason: cultural_note
  - marker: b
    text: Some manuscripts and many English traditions have “lama sabachthani” instead of “lema sabachthani.”
    reason: textual_variant
  - marker: c
    text: Jesus’s words echo Psalm 22:1.
    reason: cross_reference
  - marker: d
    text: Or “why did you forsake me?”
    reason: lexical_alternative
