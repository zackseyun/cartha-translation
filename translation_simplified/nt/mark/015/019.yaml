translation:
  language: en
  text: They kept hitting him on the head with a reed and spitting on him. They also knelt before him and bowed down in mock honor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek verb can also mean “worship,” but here the soldiers are mocking him by acting as though they honor a king.
    reason: lexical_alternative
