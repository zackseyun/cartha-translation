translation:
  language: en
  text: “Let the Messiah[a], the King of Israel, come down from the cross now, so we can see and believe!” Those crucified beside him also kept insulting him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the Christ.” Here “Messiah” presents the title in its royal, anointed sense.
    reason: alternative_reading
