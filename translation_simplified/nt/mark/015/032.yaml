  simplified_phrase: so we can see and believe
  preserved_meaning: The mockers demand visible proof before claiming they will believe.
  reasoning_layer_used: Lexical decision for ἵνα with subjunctives
  rationale: The simpler clause preserves the purpose expressed in the taunt.
- pob_phrase: those who were crucified with him
  simplified_phrase: those crucified beside him
  preserved_meaning: The other people undergoing crucifixion alongside Jesus joined the mockery.
  reasoning_layer_used: Lexical decision for οἱ συνεσταυρωμένοι σὺν αὐτῷ
  rationale: The shorter wording keeps both shared crucifixion and physical proximity.
- pob_phrase: were also insulting him
  simplified_phrase: also kept insulting him
  preserved_meaning: Their insults were ongoing and joined the earlier mockery.
  reasoning_layer_used: Lexical decision for the imperfect ὠνείδιζον and linking καί
  rationale: “Kept insulting” clearly conveys continuing action in common English.
