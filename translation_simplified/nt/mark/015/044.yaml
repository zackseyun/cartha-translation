translation:
  language: en
  text: Pilate was surprised that Jesus was already dead. He called for the centurion, a Roman army officer, and asked whether Jesus had been dead for some time.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “whether Jesus had already died.”
