simplification_decisions:
- pob_phrase: was amazed that he had already died
  simplified_phrase: was surprised that Jesus was already dead
  preserved_meaning: Pilate was astonished by the report that Jesus had died so quickly.
  reasoning_layer_used: POB lexical decision for ἐθαύμασεν and εἰ ἤδη τέθνηκεν
  rationale: “Surprised” is common English, while “already dead” preserves the completed death and resulting state.
- pob_phrase: summoning the centurion
  simplified_phrase: He called for the centurion, a Roman army officer
  preserved_meaning: Pilate called the centurion to question him.
  reasoning_layer_used: POB lexical decisions for προσκαλεσάμενος and κεντυρίωνα
  rationale: A new sentence removes the stiff participle, and the brief explanation makes the Roman rank understandable.
- pob_phrase: whether he had died already
  simplified_phrase: whether Jesus had been dead for some time
  preserved_meaning: Pilate asked whether Jesus had already been dead for an interval.
  reasoning_layer_used: POB lexical decision and footnote for εἰ πάλαι ἀπέθανεν
  rationale: The wording clearly expresses the relative interval intended by πάλαι without suggesting a long time.
