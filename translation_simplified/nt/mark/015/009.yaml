  preserved_meaning: Pilate asks whether the people want him to free the prisoner identified by this title.
  reasoning_layer_used: The lexical and theological decisions require “release,” the recipient “to you,” and the fixed title “King of the Jews.”
  rationale: Ordinary English word order makes the question easier to understand while keeping every key element.
