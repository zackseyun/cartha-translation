translation:
  language: en
  text: Early in the morning, the chief priests, elders, scribes, and the entire Jewish ruling council met at once to consult together.[a] Then they bound Jesus, took him away, and handed him over to Pilate.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This council was also called the Sanhedrin.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And immediately, early in the morning
  simplified_phrase: Early in the morning ... met at once
  preserved_meaning: The consultation happened early and with Mark's sense of urgent action.
  reasoning_layer_used: Lexical decisions for εὐθὺς and πρωῒ
  rationale: Reordering the time phrases gives natural English while retaining both timing and urgency.
- pob_phrase: held a consultation with the elders and scribes and the whole council
  simplified_phrase: the chief priests, elders, scribes, and the entire Jewish ruling council met at once to consult together
  preserved_meaning: All the named leaders took part in one deliberative gathering.
  reasoning_layer_used: Lexical decisions for συμβούλιον ποιήσαντες and ὅλον τὸ συνέδριον
  rationale: The purpose clause keeps meeting and consultation as one event rather than successive actions.
- pob_phrase: led him away
  simplified_phrase: took him away
  preserved_meaning: Jesus was removed while bound and under custody, not physically carried.
  reasoning_layer_used: Lexical decision for ἀπήνεγκαν
  rationale: The approved alternative is direct and clear within the custody sequence.
interpretive_expansions:
- pob_phrase: the whole council
  rendering: the entire Jewish ruling council
  claim: The council was the Jewish governing body known as the Sanhedrin.
  evidence:
  - The POB footnote identifies συνέδριον as the Jewish ruling council.
  - The theological decision treats the term as an institutional-historical title.
  confidence: high
  alternatives_preserved:
  - the whole council
  - the whole Sanhedrin
translation_notes:
  risk_flags:
  - risk: “At once” may sound emphatic when attached to the meeting.
    mitigation: It preserves εὐθὺς and Mark's narrative urgency in natural word order.
  - risk: “Took him away” can be broader than removal under guard.
    mitigation: “Bound” and “handed him over” clearly preserve the custody setting.
