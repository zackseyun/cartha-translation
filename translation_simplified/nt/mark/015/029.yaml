translation:
  language: en
  text: People passing by insulted him. They shook their heads and said, “Aha! So you are the one who would tear down the temple[a] and build it in three days![b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More specifically, “the sanctuary.”
    reason: lexical_alternative
  - marker: b
    text: Or “rebuild it in three days”; the Greek verb means “build,” though rebuilding may be implied here.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: those passing by were reviling him
  simplified_phrase: People passing by insulted him
  preserved_meaning: Bystanders were speaking abusively against Jesus as they went past.
  reasoning_layer_used: Lexical decision for παραπορευόμενοι and ἐβλασφήμουν
  rationale: “Insulted” clearly conveys hostile abusive speech without suggesting only technical blasphemy.
- pob_phrase: shaking their heads and saying
  simplified_phrase: They shook their heads and said
  preserved_meaning: Their head-shaking accompanied their derisive words.
  reasoning_layer_used: Lexical decision for κινοῦντες τὰς κεφαλὰς αὐτῶν
  rationale: A separate sentence replaces the dense participial structure with ordinary English.
- pob_phrase: You who would tear down the temple and build it in three days
  simplified_phrase: So you are the one who would tear down the temple and build it in three days!
  preserved_meaning: The bystanders taunt Jesus with the reported temple accusation.
  reasoning_layer_used: Lexical and theological decisions on ὁ καταλύων and the temple saying
  rationale: The added framing makes the direct address natural while leaving the accusation uninterpreted.
translation_notes:
  risk_flags:
  - risk: Readers may understand “build it” as rebuilding rather than as the Greek verb’s broader wording.
    mitigation: The footnote preserves both the direct sense and the contextual alternative.
  - risk: “Temple” may suggest the whole complex rather than the sanctuary proper.
    mitigation: The footnote preserves the more specific lexical possibility.
