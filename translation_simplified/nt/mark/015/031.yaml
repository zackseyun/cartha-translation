translation:
  language: en
  text: The chief priests, together with the scribes, also mocked Jesus. They kept saying to one another, “He saved others, but he cannot save himself!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may emphasize the chief priests speaking to one another, with the scribes joining them.
