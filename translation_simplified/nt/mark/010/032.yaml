- pob_phrase: Jesus was going ahead of them
  simplified_phrase: Jesus was walking ahead of them
  preserved_meaning: Jesus was traveling in front of the group.
  reasoning_layer_used: POB lexical decision for προάγων αὐτούς
  rationale: “Walking ahead” makes the travel scene natural without turning Jesus’ position into an explicit claim that he was leading them.
- pob_phrase: they were astonished, while those who were following were afraid
  simplified_phrase: They were astonished, but those who were following were afraid.
  preserved_meaning: The two distinct emotional responses remain separate, while neither group is identified more specifically than the source allows.
  reasoning_layer_used: POB theological decision on the emotional distinction and lexical decision for οἱ δὲ ἀκολουθοῦντες
  rationale: A separate sentence and “but” clarify the contrast while preserving the referential ambiguity.
- pob_phrase: And taking the Twelve aside again, he began to tell them the things that were about to happen to him
  simplified_phrase: Jesus again took the Twelve aside and began telling them what was about to happen to him
  preserved_meaning: Jesus privately addressed the Twelve once more and began describing his impending experiences.
  reasoning_layer_used: POB lexical decisions for παραλαβών, πάλιν, ἤρξατο λέγειν, and τὰ μέλλοντα αὐτῷ συμβαίνειν
  rationale: The active clause and “what” replace formal scaffolding with direct modern English.
