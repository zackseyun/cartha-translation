translation:
  language: en
  text: He said to them, “Go everywhere in the world and publicly announce the good news[a] to all creation.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the gospel.”
    reason: lexical_alternative
  - marker: b
    text: Or “to every creature.” The Greek can refer to creation as a whole or to each creature.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Go into all the world
  simplified_phrase: Go everywhere in the world
  preserved_meaning: The command sends them throughout the whole world.
  reasoning_layer_used: Lexical decision for κόσμον ἅπαντα
  rationale: “Everywhere in the world” expresses the universal scope in more familiar English.
- pob_phrase: proclaim
  simplified_phrase: publicly announce
  preserved_meaning: They must openly deliver an authoritative message.
  reasoning_layer_used: Lexical decision for κηρύξατε
  rationale: The phrase explains the heralding sense without the church-specific feel of “preach.”
- pob_phrase: to all creation
  simplified_phrase: to all creation
  preserved_meaning: The commission retains its broad, possibly cosmic scope.
  reasoning_layer_used: Theological decision on πάσῃ τῇ κτίσει
  rationale: This wording is retained because a simpler phrase could wrongly limit the command to individual people.
interpretive_expansions:
- pob_phrase: proclaim
  rendering: publicly announce
  claim: The proclamation is an open announcement, not merely private speech.
  evidence:
  - The lexical rationale describes κηρύσσω as heralding or publicly proclaiming.
  confidence: high
  alternatives_preserved:
  - proclaim
  - preach
translation_notes:
  risk_flags:
  - risk: “All creation” may sound as though nonhuman creation is the direct audience.
    mitigation: The footnote preserves the distributive reading while the main text keeps the Greek phrase broad.
