translation:
  language: en
  text: After they came out of the tomb,[a] they fled because they were trembling and overwhelmed with astonishment. They said nothing to anyone, for they were afraid.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Some manuscripts add a shorter ending: “They briefly reported to those around Peter everything they had been commanded. After this, Jesus himself sent out through them, from east to west, the sacred and imperishable proclamation of eternal salvation. Amen.”'
