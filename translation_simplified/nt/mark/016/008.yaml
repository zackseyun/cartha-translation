simplification_decisions:
- pob_phrase: And they went out and fled from the tomb
  simplified_phrase: After they came out of the tomb, they fled
  preserved_meaning: The women came out of the tomb and then fled from it.
  reasoning_layer_used: POB lexical decisions for ἐξελθοῦσαι and ἔφυγον
  rationale: The temporal clause clarifies the sequence while retaining the vivid verb “fled.”
- pob_phrase: trembling and astonishment had seized them
  simplified_phrase: they were trembling and overwhelmed with astonishment
  preserved_meaning: Bodily shaking and profound amazement had taken hold of the women.
  reasoning_layer_used: POB lexical decisions for τρόμος, ἔκστασις, and εἶχεν αὐτὰς
  rationale: The wording states their condition naturally while preserving the physical image and emotional intensity.
- pob_phrase: And they said nothing to anyone, for they were afraid
  simplified_phrase: They said nothing to anyone, for they were afraid
  preserved_meaning: Their continuing fear explains their complete silence.
  reasoning_layer_used: POB lexical decisions for οὐδενὶ οὐδὲν, ἐφοβοῦντο, and final γάρ
  rationale: Dropping the opening conjunction improves flow while the final “for” preserves Mark’s abrupt close.
translation_notes:
  risk_flags:
