simplification_decisions:
- pob_phrase: After he had risen, early on the first day of the week
  simplified_phrase: Early on the first day of the week, after he had risen
  preserved_meaning: His resurrection preceded this appearance, which took place early on the first day of the week.
  reasoning_layer_used: POB lexical decisions for Ἀναστὰς, πρωῒ, and πρώτῃ σαββάτου
  rationale: Reordering the time phrases gives the sentence a more natural English opening without changing the sequence.
- pob_phrase: Mary Magdalene, from whom he had cast out seven demons
  simplified_phrase: Mary Magdalene. He had driven seven demons out of her.
  preserved_meaning: Jesus had previously expelled seven demons from Mary Magdalene.
  reasoning_layer_used: POB lexical decisions for παρ’ ἧς, ἐκβεβλήκει, and ἑπτὰ δαιμόνια
  rationale: A separate sentence removes the difficult relative clause while retaining the prior exorcism and the number seven.
- pob_phrase: cast out
  simplified_phrase: driven ... out
  preserved_meaning: The demons were forcefully expelled from Mary.
  reasoning_layer_used: POB lexical alternative for ἐκβεβλήκει
  rationale: “Driven out” is common modern English and preserves the force of the exorcism.
