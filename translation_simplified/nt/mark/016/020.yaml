translation:
  language: en
  text: They went out and announced the message everywhere. The Lord worked with them and confirmed the message through the signs that accompanied it.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the word.” Here it means the message they announced.
    reason: lexical_alternative
  - marker: b
    text: The Greek may also be translated “the signs that followed.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And they went out and proclaimed everywhere
  simplified_phrase: They went out and announced the message everywhere.
  preserved_meaning: They publicly spread the message wherever they went.
  reasoning_layer_used: Lexical decisions for ἐξελθόντες, ἐκήρυξαν, πανταχοῦ, and λόγος
  rationale: “Announced the message” states the action plainly for readers unfamiliar with “proclaimed.”
- pob_phrase: while the Lord worked with them and confirmed the message
  simplified_phrase: The Lord worked with them and confirmed the message
  preserved_meaning: The risen Lord supported their mission and validated their message.
  reasoning_layer_used: Theological decisions on the Lord’s referent and the signs’ function
  rationale: A new sentence makes the Lord’s concurrent work easier to follow.
- pob_phrase: through the accompanying signs
  simplified_phrase: through the signs that accompanied it
  preserved_meaning: The signs attended the message and served as divine confirmation of it.
  reasoning_layer_used: Lexical decision for τῶν ἐπακολουθούντων σημείων and the function-of-signs rationale
  rationale: The pronoun keeps the focus on the confirmed message without shifting it to the act of preaching.
interpretive_expansions:
- pob_phrase: proclaimed everywhere
  rendering: announced the message everywhere
  claim: What they announced was the message later said to be confirmed.
  evidence:
  - The following clause identifies the λόγος as the message being confirmed.
  - POB’s lexical decision understands λόγος as the preached gospel message.
  confidence: high
  alternatives_preserved:
  - proclaimed everywhere
- pob_phrase: the accompanying signs
  rendering: the signs that accompanied it
  claim: The signs accompanied the message that the Lord confirmed.
  evidence:
  - The immediate syntax links the signs to the confirmation of the message.
  - POB’s lexical audit identifies “it” as referring to the message.
  confidence: moderate
  alternatives_preserved:
  - the accompanying signs
  - the signs that followed
translation_notes:
  risk_flags:
  - risk: “Accompanied it” supplies a referent that the Greek leaves unstated.
    mitigation: The context and POB audit support “the message,” while footnote b preserves the less specific alternative.
  - risk: “Announced” may sound less public than “proclaimed.”
    mitigation: “Everywhere” preserves the broad public scope of their mission.
