translation:
  language: en
  text: They will pick up snakes. If they drink anything deadly, it will certainly not harm them. They will place their hands on sick people, and the sick will recover.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some early manuscripts do not include Mark 16:9–20; this verse is part of the longer ending of Mark.
    reason: textual_variant
