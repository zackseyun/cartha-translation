- pob_phrase: and if they drink anything deadly
  simplified_phrase: If they drink anything deadly
  preserved_meaning: The condition remains broad and is not narrowed specifically to poison.
  reasoning_layer_used: Lexical decisions for κἂν and θανάσιμόν τι
  rationale: A new sentence makes the condition easier to follow without weakening it.
- pob_phrase: they will lay hands on the sick
  simplified_phrase: They will place their hands on sick people
  preserved_meaning: Believers physically put their hands on people who are ill.
  reasoning_layer_used: Lexical decisions for ἐπὶ ἀρρώστους and χεῖρας ἐπιθήσουσιν
  rationale: The wording explains the biblical idiom while preserving its physical image.
- pob_phrase: and they will recover
  simplified_phrase: and the sick will recover
  preserved_meaning: The sick people become well after hands are placed on them.
  reasoning_layer_used: Lexical decision for καλῶς ἕξουσιν
  rationale: Naming the sick again removes an unclear pronoun reference.
