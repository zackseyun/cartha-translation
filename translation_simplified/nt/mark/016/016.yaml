simplification_decisions:
- pob_phrase: The one who has believed and been baptized
  simplified_phrase: Anyone who believes and is baptized
  preserved_meaning: Belief and baptism remain joined as the description of the person who will be saved.
  reasoning_layer_used: POB lexical alternatives and theological decision
  rationale: The idiomatic wording is easier to read while preserving the generic singular and passive baptism.
- pob_phrase: but the one who has disbelieved
  simplified_phrase: But anyone who does not believe
  preserved_meaning: Lack of belief remains the stated basis of the contrasting condemnation.
  reasoning_layer_used: POB lexical alternative
  rationale: The common English negative makes the contrast immediately clear without adding a doctrinal conclusion.
- pob_phrase: will be saved ... will be condemned
  simplified_phrase: will be saved. But ... will be condemned.
  preserved_meaning: The two future outcomes and their contrast remain unchanged.
  reasoning_layer_used: POB clause structure and lexical decisions
  rationale: Dividing the contrast into two sentences improves readability without weakening either outcome.
translation_notes:
