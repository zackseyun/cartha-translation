translation:
  language: en
  text: But he tells them, “Do not be alarmed. You are looking for Jesus the Nazarene,[a] who has been crucified. He has been raised from the dead. He is not here.[b] Look at the place where they laid him.”
  philosophy: optimal-equivalence
  footnotes:
