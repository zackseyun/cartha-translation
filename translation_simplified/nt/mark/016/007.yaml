translation:
  language: en
  text: But go and give this message to his disciples and Peter:[a] “He is going into Galilee ahead of you. You will see him there, just as he told you.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Peter is named separately from Jesus’ disciples. This may point to his restoration after denying Jesus, but the Greek does not explicitly say “especially Peter.”
    reason: alternative_reading
  - marker: b
    text: “Into Galilee” can also be translated “to Galilee.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: go, tell his disciples and Peter
  simplified_phrase: go and give this message to his disciples and Peter
  preserved_meaning: The women are commanded to leave and report the message to Jesus’ disciples and Peter.
  reasoning_layer_used: Lexical decisions for ὑπάγετε and εἴπατε
  rationale: Combining the commands with “give this message” makes their relationship immediately clear without weakening either command.
- pob_phrase: He is going ahead of you into Galilee
  simplified_phrase: He is going into Galilee ahead of you
  preserved_meaning: Jesus will travel to Galilee before them.
  reasoning_layer_used: Lexical decisions for Προάγει and εἰς τὴν Γαλιλαίαν
  rationale: The reordered phrase follows ordinary English while keeping both prior movement and direction into Galilee.
- pob_phrase: There you will see him
  simplified_phrase: You will see him there
  preserved_meaning: They will see Jesus in Galilee.
  reasoning_layer_used: Lexical decisions for ἐκεῖ and αὐτὸν ὄψεσθε
  rationale: Natural English word order makes the promise easier to read without changing its focus.
translation_notes:
  risk_flags:
  - risk: “Give this message” is less verbally direct than “tell.”
    mitigation: The quotation immediately supplies the exact message they must report.
  - risk: Peter’s separate naming may invite readers to assume a specific explanation.
    mitigation: The main text leaves the implication unstated, and the footnote marks restoration as only a possibility.
