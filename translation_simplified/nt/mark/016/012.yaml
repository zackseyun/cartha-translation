simplification_decisions:
- pob_phrase: After these things
  simplified_phrase: Later
  preserved_meaning: The appearance happened after the preceding events.
  reasoning_layer_used: Lexical decision for Μετὰ δὲ ταῦτα
  rationale: “Later” expresses the sequence in more natural modern English.
- pob_phrase: he appeared in a different form to two of them as they were walking
  simplified_phrase: two of them were walking ... when he appeared to them in a different form
  preserved_meaning: He appeared during their walk, and his form was different.
  reasoning_layer_used: Lexical decisions for περιπατοῦσιν, ἐφανερώθη, and ἐν ἑτέρᾳ μορφῇ
  rationale: The reordered sentence is easier to follow without explaining the mysterious difference.
- pob_phrase: on their way into the countryside
  simplified_phrase: walking into the countryside
  preserved_meaning: They were traveling toward a rural area.
  reasoning_layer_used: Lexical decisions for πορευομένοις and εἰς ἀγρόν
  rationale: Combining the overlapping movement phrases avoids awkward repetition.
translation_notes:
  risk_flags:
