translation:
  language: en
  text: He had healed so many people that everyone with a painful affliction[b] was pressing forward[a] to touch him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'falling upon him.' The Greek describes a crowd surging forward with physical pressure.
    reason: simplification_note
  - marker: b
    text: Literally 'scourges,' referring to severe suffering or disease.
    reason: simplification_note
simplification_decisions:
- preserved_meaning: Converts a slightly archaic connective 'For...' and result clause into a natural modern English causal construction without losing the explanatory meaning.
  reasoning_layer_used: POB audit trail
  rationale: Converts a slightly archaic connective 'For...' and result clause into a natural modern English causal construction without losing the explanatory meaning.
- preserved_meaning: Simplifies the dual prepositional force and infinitive ('in order to') to make it flow more naturally while retaining the crowd's intense physical movement.
  reasoning_layer_used: POB audit trail
  rationale: Simplifies the dual prepositional force and infinitive ('in order to') to make it flow more naturally while retaining the crowd's intense physical movement.
