translation_notes:
  source_alignment_notes: The Greek verb 'ἐπιπίπτειν' carries a very strong physical sense of falling upon or crowding someone. 'Pressing forward' with footnote [a] preserves this. 'μάστιγας' is literally 'scourges' (whips), which refers to debilitating, painful conditions; 'painful affliction' with footnote [b] retains this vivid imagery without using the clinical 'diseases' or the overly literal 'whips'.
  readability_notes:
  - By transforming the multi-clause sentence into a more direct cause-and-effect structure, we reduce cognitive load for readers new to biblical prose while keeping the narrative suspense and action intact.
  compression_notes:
  - We consolidated the purpose clause 'in order to touch him' into 'to touch him' and shifted the independent explanatory clause 'For he had healed...' into a dependent clause to create a single natural sentence.
  risk_flags:
  - risk: There is a minor risk that 'pressing forward' does not sound as violent as 'falling upon,' but the footnote preserves this nuance. 'Affliction' might be a slightly elevated vocabulary word, but it is necessary to avoid narrowing the theological range of 'scourges' to merely clinical diseases.
    mitigation: Flag retained for reviewer attention.
