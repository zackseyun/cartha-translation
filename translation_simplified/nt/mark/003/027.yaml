translation:
  language: en
  text: But no one can enter a strong man's house and plunder his possessions[a] unless he first ties up the strong man[b]. Then he will plunder the house.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “vessels” or “things.”
    reason: lexical_alternative
  - marker: b
    text: The “strong man” is part of Jesus' metaphor for overpowering Satan; the image is kept in the main text rather than explained there.
    reason: cross_reference
simplification_decisions:
- pob_phrase: the house of the strong man
  simplified_phrase: a strong man's house
  preserved_meaning: The house still belongs to the strong man in Jesus' metaphor.
  reasoning_layer_used: POB lexical decision for τοῦ ἰσχυροῦ and theological decision to retain the metaphor
  rationale: The possessive form is more natural in common English.
- pob_phrase: his goods
  simplified_phrase: his possessions
  preserved_meaning: The objects in the house remain the property seized by force.
  reasoning_layer_used: POB lexical decision for τὰ σκεύη αὐτοῦ
  rationale: “Possessions” is clearer to modern readers while the note preserves the literal wording.
- pob_phrase: then indeed he will plunder his house
  simplified_phrase: Then he will plunder the house
  preserved_meaning: The future plundering follows only after the strong man is tied up.
  reasoning_layer_used: POB lexical decisions for καὶ τότε and διαρπάσει
  rationale: Dropping “indeed” gives natural English without changing the stated result.
