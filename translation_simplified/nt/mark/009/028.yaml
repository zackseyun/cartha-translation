  reasoning_layer_used: POB lexical and theological decisions for ἠδυνήθημεν, ἐκβαλεῖν, and αὐτό
  rationale: The contraction is natural English, while naming the spirit clarifies the pronoun’s preferred referent.
- pob_phrase: were asking him privately
