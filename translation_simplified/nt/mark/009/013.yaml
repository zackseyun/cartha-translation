  text: But I tell you, Elijah too has already come,[a] and they did whatever they wanted to him, just as it is written about him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jesus is referring to John the Baptist, whose ministry fulfilled the promised coming of Elijah; see Mark 9:11–12 and compare Matthew 11:14; 17:12–13.
    reason: cross_reference
