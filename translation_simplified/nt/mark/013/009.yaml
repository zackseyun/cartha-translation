translation:
  language: en
  text: But be on your guard. People will hand you over to councils. You will be beaten in synagogues and brought before governors and kings because of me. This will serve as a testimony to them.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “as a witness to them”; the phrase may also mean “as testimony against them.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: But watch yourselves.
  simplified_phrase: But be on your guard.
  preserved_meaning: Jesus commands the disciples to remain alert to the danger they will face.
  reasoning_layer_used: POB lexical decision for βλέπετε and its listed alternatives
  rationale: “Be on your guard” makes the warning force immediately clear in common English.
- pob_phrase: and you will stand before governors and kings
  simplified_phrase: and brought before governors and kings
  preserved_meaning: The disciples will be compelled to appear before both kinds of authorities.
  reasoning_layer_used: POB lexical decision for σταθήσεσθε and Greek passive form
  rationale: “Brought before” expresses the formal and involuntary appearance more naturally.
- pob_phrase: because of me, as a testimony to them
  simplified_phrase: because of me. This will serve as a testimony to them.
  preserved_meaning: Allegiance to Jesus causes the persecution, and the resulting appearance becomes testimony to the rulers.
  reasoning_layer_used: POB lexical and theological decisions for ἕνεκεν ἐμοῦ and εἰς μαρτύριον αὐτοῖς
  rationale: Two sentences clarify the relationship without resolving the documented ambiguity.
