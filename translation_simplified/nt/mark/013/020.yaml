simplification_decisions:
- pob_phrase: cut short the days
  simplified_phrase: cut those days short
  preserved_meaning: The Lord shortened the period of distress described in the preceding verses.
  reasoning_layer_used: POB lexical decision for ἐκολόβωσεν and τὰς ἡμέρας
  rationale: Natural English word order keeps the forceful image of cutting the days short.
- pob_phrase: no flesh would have been saved
  simplified_phrase: no one would have been left alive
  preserved_meaning: Without the shortening, no human life would survive the catastrophic distress.
  reasoning_layer_used: POB theological decision on physical preservation and immediate context
  rationale: The contextual sense is made clear while the literal image is retained in a footnote.
- pob_phrase: for the sake of the elect, whom he chose
  simplified_phrase: for the sake of the people he chose
  preserved_meaning: God shortened the days on behalf of those he chose without defining a doctrine of election.
  reasoning_layer_used: POB lexical and theological decisions for ἐκλεκτούς and ἐξελέξατο
  rationale: This removes awkward repetition while preserving both God’s choosing and the identified people.
interpretive_expansions:
- pob_phrase: would have been saved
  rendering: would have been left alive
  claim: Here being saved means preservation of human life during the catastrophic distress.
  evidence:
  - The immediate context describes unparalleled distress and mortal danger.
  - The POB theological audit identifies physical preservation as the immediate sense.
  - POB lists “would have survived” and “would have been preserved alive” as alternatives.
  confidence: high
  alternatives_preserved:
  - The literal wording “no flesh” is preserved in the footnote.
  - The verse does not address eternal salvation directly.
translation_notes:
  risk_flags:
