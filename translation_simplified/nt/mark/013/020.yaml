  language: en
  text: If the Lord had not cut those days short, no one[a] would have been left alive. But for the sake of the people he chose, he cut those days short.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “no flesh,” a biblical expression meaning no human being or no one.
