- pob_phrase: There will be earthquakes in various places; there will be famines.
  simplified_phrase: There will be earthquakes in various places and famines.
  preserved_meaning: Earthquakes will occur in multiple locations, and severe food shortages will occur.
  reasoning_layer_used: POB translation and lexical decisions for σεισμοί, κατὰ τόπους, and λιμοί
  rationale: Combining the repeated construction makes the sentence smoother without merging the two events.
- pob_phrase: These are the beginning of birth pains.
  simplified_phrase: These are only the first sufferings, like the first pains of childbirth.
  preserved_meaning: These events are preliminary distress rather than the end, while the childbirth image remains intact.
  reasoning_layer_used: POB theological decision and lexical rationale for ἀρχὴ ὠδίνων
  rationale: The wording explains the metaphor in the text while preserving its force and preliminary character.
