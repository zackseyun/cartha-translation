translation:
  language: en
  text: For nation will rise against nation, and kingdom against kingdom. There will be earthquakes in various places and famines. These are only the first sufferings, like the first pains of childbirth.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The childbirth image describes sufferings that begin before what follows.
    reason: simplification_note
