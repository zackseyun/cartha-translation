- pob_phrase: the chosen ones
  simplified_phrase: God’s chosen people
  preserved_meaning: These are people chosen by God, without using the technical term “elect.”
  reasoning_layer_used: POB lexical and theological decisions for ἐκλεκτούς
  rationale: The wording states the understood chooser and makes the group plainly human.
- pob_phrase: from the four winds
  simplified_phrase: from the four winds—that is, from every direction
  preserved_meaning: The biblical wind image and its idiomatic worldwide scope are both retained.
  reasoning_layer_used: POB cultural note and lexical rationale for ἐκ τῶν τεσσάρων ἀνέμων
  rationale: The inline explanation prevents modern readers from mistaking the phrase for literal winds.
- pob_phrase: from the end of the earth to the end of heaven
  simplified_phrase: from the farthest end of the earth to the farthest end of heaven
  preserved_meaning: The gathering extends across the whole spatial range described by the source.
  reasoning_layer_used: POB lexical decisions and scope-of-gathering theological decision
  rationale: Adding “farthest” makes the extremity expressed by ἄκρον immediately clear.
