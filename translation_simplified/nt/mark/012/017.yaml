  text: But Jesus said to them, “Give back to Caesar what belongs to Caesar, and give back to God what belongs to God.” They were completely amazed at him.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the things that are Caesar’s
  simplified_phrase: what belongs to Caesar
  preserved_meaning: Caesar is to receive what is rightfully his without defining the scope of his claims.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: Common possessive wording improves clarity while preserving the unresolved civic tension.
- pob_phrase: and to God the things that are God’s
  simplified_phrase: and give back to God what belongs to God
  preserved_meaning: The second command remains parallel to the first and applies the same verb to what belongs to God.
  reasoning_layer_used: POB lexical decision and source parallelism
  rationale: Repeating the verb makes the elliptical clause immediately understandable.
- pob_phrase: And they were utterly amazed at him
  simplified_phrase: They were completely amazed at him
  preserved_meaning: Their reaction remains one of intense amazement directed at Jesus.
  reasoning_layer_used: POB lexical decision for ἐξεθαύμαζον and ἐπ’ αὐτῷ
  rationale: “Completely amazed” expresses the same intensity in more familiar English.
