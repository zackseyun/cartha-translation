translation:
  language: en
  text: They came and said to him, “Teacher, we know you are truthful and are not swayed by anyone. You do not show favoritism, but truly teach the way of God. Is it lawful to pay the poll tax[a] to Caesar or not? Should we pay it, or not?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This was the Roman census or poll tax.
    reason: cultural_note
