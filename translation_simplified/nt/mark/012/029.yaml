translation:
  language: en
  text: 'Jesus answered, “The most important commandment is this: ‘Hear, Israel: The Lord[a] our God, the Lord is one.’[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This quotation comes from Deuteronomy 6:4; “Lord” represents the divine name YHWH in its Greek form.
    reason: cross_reference
  - marker: b
    text: This may also be translated, “The Lord our God is one Lord,” or, “The Lord is our God, the Lord alone.” The wording may emphasize that God is one, that he alone is Israel’s God, or both.
    reason: alternative_reading
