  text: 'David himself said this in the Holy Spirit[a]: “The Lord said to my Lord, ‘Sit at my right hand until I put your enemies under your feet.’”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “by the Holy Spirit.”
