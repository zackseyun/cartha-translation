simplification_decisions:
- pob_phrase: David himself said in the Holy Spirit
  simplified_phrase: David himself said this in the Holy Spirit
  preserved_meaning: David is emphasized as the speaker, and his words are connected with the Holy Spirit without defining the precise mode of inspiration.
  reasoning_layer_used: POB lexical and theological decisions on αὐτός and ἐν τῷ πνεύματι τῷ ἁγίῳ
  rationale: Adding “this” and a colon clearly connects the Spirit phrase to the quotation that follows.
- pob_phrase: The Lord said to my Lord
  simplified_phrase: The Lord said to my Lord
  preserved_meaning: The repeated title “Lord” and the christological force of Jesus’ argument remain intact.
  reasoning_layer_used: POB lexical and theological decisions on κύριος
  rationale: The wording is retained because replacing either title would obscure the deliberate repetition.
- pob_phrase: put your enemies under your feet
  simplified_phrase: put your enemies under your feet
  preserved_meaning: The concrete image of enemies being subjected remains unchanged.
  reasoning_layer_used: POB lexical decision on ὑποκάτω τῶν ποδῶν σου
  rationale: The familiar image is already clear and should not be flattened into an abstract phrase.
translation_notes:
  risk_flags:
  - risk: “In the Holy Spirit” may sound unusual to modern readers.
    mitigation: The alternative “by the Holy Spirit” is supplied in a footnote without narrowing the main text.
  - risk: English readers may assume both uses of “Lord” have exactly the same referent.
    mitigation: The Psalm footnote distinguishes the divine name from David’s lord while preserving Mark’s repeated wording.
