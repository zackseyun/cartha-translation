translation:
  language: en
  text: But worries about this age[a] and the deceit of riches choke the word. Desires for other things also choke it as they enter in. Then the word bears no fruit.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “this world,” meaning the present world-order.
    reason: lexical_alternative
  - marker: b
    text: The Greek most directly refers to the word, though it may also suggest that the hearer or the growing seed becomes unfruitful.
    reason: alternative_reading
