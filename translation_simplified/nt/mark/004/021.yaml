  reasoning_layer_used: POB translation and lexical decision for ἔλεγεν
  rationale: “Went on to say” gives natural English while retaining the imperfect verb’s continuing narrative sense.
- pob_phrase: under a basket
  simplified_phrase: under a measuring basket
  preserved_meaning: The lamp is absurdly hidden beneath a container used for measuring.
  reasoning_layer_used: POB lexical decision and cultural footnote for μόδιον
  rationale: Adding “measuring” makes the unfamiliar household object understandable without using the archaic term “bushel.”
- pob_phrase: Is it not to be put on the lampstand?
  simplified_phrase: Doesn’t it come to be put on a lampstand?
  preserved_meaning: A lamp’s proper purpose is to be placed where its light can be seen.
  reasoning_layer_used: POB translation, lexical decisions, and theological decision on personification
  rationale: The modern rhetorical question restores the source’s pointed contrast and repeats the vivid image of the lamp coming.
