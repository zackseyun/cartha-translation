translation:
  language: en
  text: He went on to say to them, “A lamp does not come so that it can be put under a measuring basket[a] or under a bed, does it? Doesn’t it come to be put on a lampstand?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This was a container used to measure dry goods, traditionally called a bushel.
    reason: cultural_note
