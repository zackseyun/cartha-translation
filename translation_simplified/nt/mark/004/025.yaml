simplification_decisions:
- pob_phrase: For whoever has, more will be given to him
  simplified_phrase: This is because whoever has will receive more
  preserved_meaning: The saying explains the previous statement and promises an increase without specifying what is given.
  reasoning_layer_used: POB translation and theological decision on the implied object
  rationale: “This is because” makes the connection clear, while “receive more” expresses the passive construction naturally.
- pob_phrase: and whoever does not have, even what he has will be taken away from him
  simplified_phrase: But whoever does not have will lose even what he has
  preserved_meaning: The contrasting person suffers the forced loss of even his present possession.
  reasoning_layer_used: POB lexical decisions for οὐκ ἔχει and ἀρθήσεται ἀπ’ αὐτοῦ
  rationale: A separate sentence with “but” and “lose” makes the contrast and result easier to grasp.
translation_notes:
  risk_flags:
