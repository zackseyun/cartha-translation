  rationale: “Jesus himself” preserves the emphasis, while “back of the boat” makes “stern” immediately clear.
- pob_phrase: asleep on the cushion; and they woke him and said to him
  simplified_phrase: asleep on a cushion. They woke him and said
  preserved_meaning: Keeps Jesus’ sleeping state and the disciples’ actions while dividing the long sentence.
  reasoning_layer_used: POB translation and lexical decisions for καθεύδων, ἐγείρουσιν, and λέγουσιν
  rationale: Two sentences and less repetition produce natural English without changing the sequence.
- pob_phrase: do you not care that we are perishing?
  simplified_phrase: do you not care that we are perishing?
  preserved_meaning: Retains the disciples’ urgent, accusatory question and their fear of imminent death.
  reasoning_layer_used: POB theological decision and lexical decisions for οὐ μέλει σοι and ἀπολλύμεθα
  rationale: The forceful wording remains because softening it would erase the narrative tension.
