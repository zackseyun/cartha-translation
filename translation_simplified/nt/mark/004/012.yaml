simplification_decisions:
- pob_phrase: seeing they may see and not perceive
  simplified_phrase: they may see but not perceive
  preserved_meaning: 'The paradox remains: physical seeing does not lead to true perception.'
  reasoning_layer_used: POB lexical decision for βλέποντες βλέπωσι and ἴδωσιν
  rationale: The contrast preserves the doubled expression's force without adding a continuing-duration sense.
- pob_phrase: hearing they may hear and not understand
  simplified_phrase: hear but not understand
  preserved_meaning: Hearing occurs without genuine understanding.
  reasoning_layer_used: POB lexical decision for ἀκούοντες ἀκούωσι and συνιῶσιν
  rationale: The shorter clause expresses the same paradox in natural English.
- pob_phrase: it be forgiven them
  simplified_phrase: be forgiven
  preserved_meaning: Forgiveness remains a passive act received by those who turn back.
  reasoning_layer_used: POB lexical decision for ἀφεθῇ αὐτοῖς
  rationale: The natural English passive avoids the opaque impersonal construction.
