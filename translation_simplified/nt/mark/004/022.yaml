simplification_decisions:
- pob_phrase: except to be revealed
  simplified_phrase: except so that it may be revealed
  preserved_meaning: Hiddenness is ordered toward disclosure without making divine causation explicit.
  reasoning_layer_used: POB theological decision on the repeated ἵνα clauses
  rationale: Adding “so that it may” makes the purpose nuance easier to follow in modern English.
- pob_phrase: nor has anything become concealed
  simplified_phrase: and nothing has become concealed
  preserved_meaning: The second clause still describes something coming into a concealed state.
  reasoning_layer_used: POB lexical decision for ἐγένετο and ἀπόκρυφον
  rationale: The wording keeps “has become” while replacing the formal connector “nor” with a clearer parallel clause.
- pob_phrase: except to come to light
  simplified_phrase: except so that it may come to light
  preserved_meaning: Concealment is not final but leads toward open disclosure.
  reasoning_layer_used: POB translation and lexical decision for ἔλθῃ εἰς φανερόν
  rationale: The fuller connector clarifies the relationship while preserving the movement image in “come to light.”
