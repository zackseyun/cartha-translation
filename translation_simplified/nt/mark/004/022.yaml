translation:
  language: en
  text: For nothing is hidden except so that it may be revealed, and nothing has become concealed except so that it may come to light.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Greek may also describe the result: “Nothing is hidden except that it will be revealed, and nothing has become concealed except that it will come to light.”'
