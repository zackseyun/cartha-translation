simplification_decisions:
- pob_phrase: was not speaking to them without a parable
  simplified_phrase: would speak to the crowds only in parables
  preserved_meaning: Jesus regularly used parables when speaking publicly to the crowds.
  reasoning_layer_used: POB lexical decisions and immediate context
  rationale: The positive wording is clearer while “would” preserves the customary force of the imperfect verb.
- pob_phrase: but in private he was explaining everything
  simplified_phrase: But in private, he would explain everything
  preserved_meaning: Jesus regularly gave private explanations without narrowing the stated scope of “everything.”
  reasoning_layer_used: POB lexical and theological decisions
  rationale: A separate sentence sharpens the public-private contrast and preserves the ongoing action.
interpretive_expansions:
- pob_phrase: to them
  rendering: to the crowds
  claim: The pronoun refers to the crowds who heard Jesus’ public teaching.
  evidence:
