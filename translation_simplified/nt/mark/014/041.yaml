translation:
  language: en
  text: He comes back for the third time and says to them, “Are you still sleeping and resting?[a] It is enough.[b] The hour has come. Look, the Son of Man is being handed over into the hands of sinners.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Sleep on and rest.” The Greek may express ironic permission rather than a rhetorical question.
    reason: alternative_reading
  - marker: b
    text: “It is enough” translates a difficult expression; “Enough!” is another possible rendering.
    reason: lexical_alternative
