translation:
  language: en
  text: But Peter denied it again. A little while later, the people standing nearby kept saying to Peter, “Surely you are one of them, because you are also a Galilean, and the way you speak sounds like theirs.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some manuscripts omit “and the way you speak sounds like theirs.”
    reason: textual_variant
