translation:
  language: en
  text: Immediately, while Jesus was still speaking, Judas arrived. He was one of the Twelve. A crowd carrying swords and clubs came with him from the chief priests, the scribes, and the elders.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “From” identifies the leaders as the crowd’s source or authority without specifying how the crowd was dispatched.
    reason: simplification_note
