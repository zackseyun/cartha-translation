translation:
  language: en
  text: For you always have poor people with you, and whenever you want, you can do good to them. But you do not always have me.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the poor
  simplified_phrase: poor people
  preserved_meaning: Keeps the reference to people who are poor while avoiding an abstract-sounding label.
  reasoning_layer_used: POB lexical decision for πτωχούς
  rationale: The POB lists “poor people” as a valid clearer alternative.
- pob_phrase: you are able to do good to them
  simplified_phrase: you can do good to them
  preserved_meaning: Keeps both their ability and the concrete action of benefiting poor people.
  reasoning_layer_used: POB lexical decisions for δύνασθε and αὐτοῖς εὖ ποιῆσαι
  rationale: “Can” is common English and does not reduce doing good to mere goodwill.
- pob_phrase: and whenever you want, you are able to do good to them; but you do not always have me
  simplified_phrase: and whenever you want, you can do good to them. But you do not always have me.
  preserved_meaning: Keeps the ongoing opportunity to help poor people and the contrast with Jesus’ limited presence.
  reasoning_layer_used: POB translation, lexical decisions, and theological decision
  rationale: Two sentences make the contrast easier to follow without shifting the final clause into the future tense.
