  reasoning_layer_used: POB lexical decisions for the temporal clause and κάτω
  rationale: “Meanwhile” keeps the narrative link, while “was down” expresses location in ordinary English.
- pob_phrase: one of the high priest’s servant girls came
  simplified_phrase: when one of the high priest’s servant girls came
  preserved_meaning: A female household servant associated with the high priest arrived during this scene.
