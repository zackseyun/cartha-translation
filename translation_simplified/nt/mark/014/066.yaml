translation:
  language: en
  text: Meanwhile, Peter was down in the courtyard when one of the high priest’s servant girls[a] came.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “slave girls.” The Greek word can refer to female household servants or slaves.
