simplification_decisions:
- pob_phrase: lest there be an uproar from the people
  simplified_phrase: or there may be an uproar from the people
  preserved_meaning: The wording still presents the uproar as the feared result while avoiding the less familiar word “lest.”
  reasoning_layer_used: POB lexical decisions for μήποτε, ἔσται, θόρυβος, and τοῦ λαοῦ
  rationale: “Or there may be” expresses the feared possibility in common modern English without strengthening “uproar” to “riot.”
- pob_phrase: For they were saying
  simplified_phrase: For they were saying
  preserved_meaning: The explanatory link to the preceding verse and the ongoing or repeated speech remain intact.
  reasoning_layer_used: POB lexical decisions for γάρ and ἔλεγον
  rationale: These words are already clear and preserve source features that should not be compressed away.
translation_notes:
  risk_flags:
  - risk: “From the people” may imply more direct agency than the Greek requires.
    mitigation: The footnote preserves the alternative sense that the uproar could occur among the people.
