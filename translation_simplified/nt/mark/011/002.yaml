translation:
  language: en
  text: He said to them, “Go into the village across from you. As soon as you enter it, you will find a colt tied there that no person has ridden yet. Untie it and bring it.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the village opposite you
  simplified_phrase: the village across from you
  preserved_meaning: The village is opposite the disciples’ present location.
  reasoning_layer_used: POB lexical decision for τὴν κατέναντι ὑμῶν
  rationale: “Across from you” is more natural common English than “opposite you.”
- pob_phrase: a colt tied there, on which no one has yet sat
  simplified_phrase: a colt tied there that no person has ridden yet
  preserved_meaning: The tied colt has not yet been ridden by any human.
  reasoning_layer_used: Greek source, POB footnote b, and lexical rationale for οὔπω and ἀνθρώπων
  rationale: “Ridden” fits an animal naturally, while “no person” and “yet” retain the explicit human reference and time limit.
- pob_phrase: Go into the village opposite you, and as soon as you enter it, you will find
  simplified_phrase: Go into the village across from you. As soon as you enter it, you will find
  preserved_meaning: The disciples will find the colt upon entering the village.
  reasoning_layer_used: POB syntax and lexical decision for εὐθὺς
  rationale: Two sentences make the instructions easier to follow without separating their sequence.
