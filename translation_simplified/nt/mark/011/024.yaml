  reasoning_layer_used: POB lexical decision for διὰ τοῦτο
  rationale: “So” expresses the same connection in more natural common English.
- pob_phrase: whatever you pray and ask for
  simplified_phrase: whatever you pray and ask for
  preserved_meaning: Prayer and asking remain distinct parts of the request.
  reasoning_layer_used: POB lexical decisions for προσεύχεσθε and αἰτεῖσθε
  rationale: The paired verbs are retained because compressing them could erase a source distinction.
- pob_phrase: believe that you have received it
  simplified_phrase: believe that you have already received it
  preserved_meaning: Faith treats the requested thing as received before the future promise is realized.
  reasoning_layer_used: POB lexical and theological decisions for ἐλάβετε
  rationale: “Already” makes the intended completed-action sequence immediately clear.
