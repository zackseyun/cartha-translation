  language: en
  text: But if you do not forgive others, your Father in heaven will not forgive the wrongs you have done.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This sentence is absent from the earliest Greek manuscripts and early Coptic translations, though it appears in many later Greek, Latin, and Syriac manuscripts. It was probably added to bring this passage into line with Matthew 6:15.
