  rationale: “Replied” makes the conversational response clear without removing the mild contrast.
- pob_phrase: I will ask you one question
  simplified_phrase: I have one question for you
  preserved_meaning: Jesus introduces a single counter-question that requires their answer.
  reasoning_layer_used: POB lexical decision for Ἐπερωτήσω ὑμᾶς ἕνα λόγον
  rationale: The new wording expresses the same intent in more natural conversational English.
- pob_phrase: by what authority I do these things
  simplified_phrase: what authority I have to do these things
  preserved_meaning: The dispute concerns Jesus’ legitimate authority, not merely his ability to act.
  reasoning_layer_used: POB theological and lexical decisions for ἐν ποίᾳ ἐξουσίᾳ
  rationale: This form is easier to follow while retaining the key term “authority.”
