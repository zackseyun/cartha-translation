translation:
  language: en
  text: The people in front of Jesus and those behind him were shouting, “Hosanna![a] Blessed is the one who comes in the name of the Lord!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Hosanna” means something like “Please save!” or “Save now!” and was also used as a shout of praise.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: those going ahead and those following
  simplified_phrase: the people in front of Jesus and those behind him
  preserved_meaning: The crowd remains divided into the groups ahead of and behind Jesus in the procession.
  reasoning_layer_used: Immediate context and POB lexical rationale
  rationale: Naming Jesus makes the two groups’ positions clear without changing their relationship to him.
- pob_phrase: were crying out
  simplified_phrase: were shouting
  preserved_meaning: The crowd was repeatedly making a loud public acclamation.
  reasoning_layer_used: POB lexical decision for ἔκραζον
  rationale: “Were shouting” is common English and preserves the imperfect verb’s ongoing force.
- pob_phrase: Hosanna
  simplified_phrase: Hosanna![a]
  preserved_meaning: The recognized liturgical cry retains both its scriptural resonance and its plea for salvation.
  reasoning_layer_used: POB lexical decision and footnote
  rationale: The traditional term remains in the text, while the footnote explains it for new readers.
