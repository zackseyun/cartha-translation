translation:
  language: en
  text: But I did not want to do anything without your consent. That way, your good deed would come from your own free choice, not as if you had been forced.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Good deed” may also mean “goodness” or “kindness.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: I wanted to do nothing
  simplified_phrase: I did not want to do anything
  preserved_meaning: Paul refused to act in this matter without Philemon’s consent.
  reasoning_layer_used: Lexical decision for οὐδὲν ἠθέλησα ποιῆσαι
  rationale: The natural negative wording preserves Paul’s personal volition.
- pob_phrase: so that your good deed might not be as if by compulsion, but voluntary
  simplified_phrase: That way, your good deed would come from your own free choice, not as if you had been forced
  preserved_meaning: Philemon’s response was to be freely chosen rather than coerced.
  reasoning_layer_used: Lexical and theological decisions on ἀνάγκη and ἑκούσιον
  rationale: The rewrite states the contrast in familiar language while retaining the softening force of “as if.”
