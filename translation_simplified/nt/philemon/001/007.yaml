translation:
  language: en
  text: Your love has given me great joy and encouragement, brother, because you have refreshed the hearts[a] of the saints.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek expression refers to their deep inner life and affections.
    reason: lexical_alternative
  - marker: b
    text: Here “saints” means God’s people, those set apart for him.
    reason: simplification_note
simplification_decisions:
- pob_phrase: For I had much joy and encouragement because of your love
  simplified_phrase: Your love has given me great joy and encouragement
  preserved_meaning: Philemon’s love caused Paul to experience strong joy and encouragement.
  reasoning_layer_used: Lexical decisions for πολλὴν ἔσχον and ἐπὶ τῇ ἀγάπῃ σου
  rationale: The active wording states the same causal relationship in more natural English.
- pob_phrase: the hearts of the saints have been refreshed through you
  simplified_phrase: you have refreshed the hearts of the saints
  preserved_meaning: Philemon was the one through whom the saints received lasting refreshment.
  reasoning_layer_used: Lexical decisions for σπλάγχνα, ἀναπέπαυται, and διὰ σοῦ
  rationale: The direct active clause is easier to follow while retaining the heart image and Philemon’s agency.
- pob_phrase: brother
  simplified_phrase: brother
  preserved_meaning: Paul directly addresses Philemon as a male member of the Christian family.
  reasoning_layer_used: Lexical decision for ἀδελφέ
  rationale: The familial title remains because it is clear and theologically meaningful.
translation_notes:
  risk_flags:
  - risk: Modern readers may take “saints” to mean only officially canonized people.
    mitigation: A footnote explains Paul’s use of the term for God’s set-apart people.
  - risk: “Hearts” may be understood as emotions alone.
    mitigation: A footnote preserves the broader sense of deep inner life and affections.
