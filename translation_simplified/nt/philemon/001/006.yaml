simplification_decisions:
- pob_phrase: the fellowship of your faith
  simplified_phrase: your sharing in the faith
  preserved_meaning: Philemon actively participates in and expresses the shared Christian faith.
  reasoning_layer_used: Lexical and theological decisions on κοινωνία
  rationale: “Sharing in the faith” preserves communal participation without suggesting only evangelism.
- pob_phrase: may become effective in the knowledge of
  simplified_phrase: may become effective through knowing
  preserved_meaning: Knowledge is the means by which Philemon’s sharing becomes effective.
  reasoning_layer_used: Lexical decisions on ἐνεργὴς γένηται and ἐν ἐπιγνώσει
  rationale: The verbal form is natural English without adding a progressive process.
- pob_phrase: every good thing that is in us
  simplified_phrase: every good thing among us
  preserved_meaning: The good is found collectively among Paul, Philemon, and fellow believers.
  reasoning_layer_used: Lexical and theological decisions on τοῦ ἐν ἡμῖν
  rationale: “Among us” clearly expresses the collective sense and avoids an inward psychological reading.
interpretive_expansions:
