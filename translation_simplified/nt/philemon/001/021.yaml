simplification_decisions:
- pob_phrase: Confident of your obedience, I wrote to you
  simplified_phrase: I am confident you will obey, so I wrote to you
  preserved_meaning: Paul’s settled confidence in Philemon’s obedience is the basis for writing.
  reasoning_layer_used: Lexical decisions for πεποιθὼς and ὑπακοή, with the theological decision to retain obedience.
  rationale: The participial phrase becomes a direct statement and a clear cause-and-result link.
- pob_phrase: knowing that you will do
  simplified_phrase: I know you will do
  preserved_meaning: Paul expresses assured knowledge about Philemon’s future action.
  reasoning_layer_used: Lexical decision for εἰδὼς and ποιήσεις.
  rationale: A separate sentence removes the dense participial structure without weakening Paul’s confidence.
- pob_phrase: even more than I say
  simplified_phrase: even more than I ask
  preserved_meaning: Paul expects Philemon to exceed his stated request but leaves the additional action unspecified.
  reasoning_layer_used: Lexical decision for καὶ ὑπὲρ ἃ λέγω and the theological decision to preserve its open-ended implication.
  rationale: In this letter’s appeal, “ask” makes the practical sense of “say” immediately clear.
interpretive_expansions:
- pob_phrase: more than I say
  rendering: more than I ask
  claim: Paul’s words here refer to the request he has made to Philemon.
  evidence:
  - The immediate context is Paul’s appeal to Philemon.
  - The POB footnote itself describes this as Paul’s specific request.
  confidence: high
  alternatives_preserved:
  - more than I say
  - beyond what I am saying
translation_notes:
  risk_flags:
  - risk: “Ask” is more context-specific than the source verb’s broad sense “say.”
    mitigation: The footnote preserves the broader lexical alternative.
  - risk: Readers may assume Paul specifically expects Onesimus to be freed.
    mitigation: The wording and footnote leave the expected additional action unspecified.
