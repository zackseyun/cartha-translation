translation:
  language: en
  text: because I hear that you have love and faith toward the Lord Jesus and for all God’s holy people.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The sense may be more specifically, “your faith toward the Lord Jesus and your love for all God’s holy people.”
    reason: alternative_reading
  - marker: b
    text: Or “faithfulness”; the Greek word can mean faith, trust, or faithfulness.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: I hear of your love and faith that you have
  simplified_phrase: I hear that you have love and faith
  preserved_meaning: Paul has heard about Philemon’s love and faith.
  reasoning_layer_used: Lexical decision for ἀκούων and applied revisions
  rationale: The recast removes an awkward relative clause while preserving the present report and its causal link.
- pob_phrase: all the saints
  simplified_phrase: all God’s holy people
  preserved_meaning: The phrase refers to the whole community of believers, not an exceptional class.
  reasoning_layer_used: Lexical decision for ἁγίους and grounding review
  rationale: The permitted alternative makes Paul’s communal designation clear to modern readers.
- pob_phrase: toward the Lord Jesus and for all the saints
  simplified_phrase: toward the Lord Jesus and for all God’s holy people
  preserved_meaning: The distinct directions and their unresolved relationship to love and faith remain intact.
  reasoning_layer_used: Theological decision on distributive ambiguity
  rationale: Keeping both prepositions avoids settling the Greek construction in the main text.
translation_notes:
  risk_flags:
  - risk: Readers may assume love and faith relate identically to Jesus and God’s people.
    mitigation: Footnote a preserves the likely distributive sense without making it certain.
  - risk: “Faith” may also carry the sense of faithfulness here.
    mitigation: Footnote b preserves the lexical alternative.
