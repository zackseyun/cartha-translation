simplification_decisions:
- pob_phrase: I wanted to keep him with me
  simplified_phrase: I wanted to have him stay with me
  preserved_meaning: Paul desired to retain Onesimus in his company.
  reasoning_layer_used: Lexical decisions for πρὸς ἐμαυτὸν and κατέχειν
  rationale: “Have him stay” makes the relational sense of “keep” immediately clear.
- pob_phrase: so that on your behalf he might serve me
  simplified_phrase: so he could serve me on your behalf
  preserved_meaning: Paul wanted Onesimus to assist him as a service rendered on Philemon’s behalf.
  reasoning_layer_used: Lexical decisions for ἵνα, ὑπὲρ σοῦ, and μοι διακονῇ
  rationale: The reordered clause follows natural English while retaining purpose and representation.
- pob_phrase: in the chains of the gospel
  simplified_phrase: while I am in the chains of the gospel
  preserved_meaning: Paul’s literal imprisonment is closely connected with the gospel without fully defining that connection.
  reasoning_layer_used: Lexical and theological decisions for δεσμοῖς τοῦ εὐαγγελίου
  rationale: “While” clarifies the setting while the concrete image and compact genitive remain intact.
