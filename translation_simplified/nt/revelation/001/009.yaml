translation:
  language: en
  text: I, John, am your brother, and I share with you in the tribulation, kingdom, and endurance that are in Jesus. I was on the island called Patmos because of God’s word and the testimony of Jesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “the testimony about Jesus.” The Greek can mean either testimony given by Jesus or testimony concerning Jesus.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: your brother and fellow participant
  simplified_phrase: your brother, and I share with you
  preserved_meaning: John identifies himself as family in Christ and as sharing the readers’ experience.
  reasoning_layer_used: Lexical decisions for συγκοινωνός and ἀδελφὸς ὑμῶν
  rationale: The verb phrase expresses shared participation more naturally than the title “fellow participant.”
- pob_phrase: in the tribulation and kingdom and endurance in Jesus
  simplified_phrase: in the tribulation, kingdom, and endurance that are in Jesus
  preserved_meaning: The whole three-part series remains connected with Jesus and shared by John and his readers.
  reasoning_layer_used: Lexical decisions for the coordinated nouns and ἐν Ἰησοῦ
  rationale: The relative clause clearly applies “in Jesus” to all three realities.
- pob_phrase: because of the word of God
  simplified_phrase: because of God’s word
  preserved_meaning: God’s word remains the stated reason John was on Patmos.
  reasoning_layer_used: Lexical decision for διὰ τὸν λόγον τοῦ θεοῦ
  rationale: The possessive form is shorter and more natural without specifying the circumstances.
translation_notes:
  risk_flags:
  - risk: Modern readers may understand “the testimony of Jesus” in only one of its two possible senses.
    mitigation: The footnote preserves both testimony given by Jesus and testimony about Jesus.
  - risk: “Tribulation” may be less familiar than “suffering.”
    mitigation: The term is retained because the POB audit identifies its special apocalyptic weight.
