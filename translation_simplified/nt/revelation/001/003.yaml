translation:
  language: en
  text: The person who reads this prophecy aloud[a] is blessed. So are all who hear its words and live by what is written in it, because the time[b] is near.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may simply mean “reads,” but it likely describes someone reading aloud to an assembled group.
    reason: lexical_alternative
  - marker: b
    text: Or “the appointed time.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Blessed is the one who reads aloud, and those who hear
  simplified_phrase: The person who reads this prophecy aloud is blessed. So are all who hear its words
  preserved_meaning: Both the public reader and the hearers receive the same blessing.
  reasoning_layer_used: Public-reading setting and lexical decisions for ἀναγινώσκων and οἱ ἀκούοντες
  rationale: Two short sentences clarify the singular reader and plural hearers without losing the public setting.
- pob_phrase: keep what is written in it
  simplified_phrase: live by what is written in it
  preserved_meaning: The hearers must faithfully put the prophecy into practice.
  reasoning_layer_used: Lexical rationale for τηροῦντες
  rationale: “Live by” expresses obedient adherence more clearly than the potentially vague “keep.”
- pob_phrase: for the time is near
  simplified_phrase: because the time is near
  preserved_meaning: The nearness of the decisive time gives the reason for the blessing and exhortation.
  reasoning_layer_used: Lexical and theological decisions for καιρός ἐγγύς
  rationale: “Because” makes the verse’s reason clause immediately clear while preserving its unresolved eschatological tension.
translation_notes:
  risk_flags:
  - risk: “Live by” may sound broader than the Greek command to keep or observe.
    mitigation: The wording retains the audited sense of faithful, obedient adherence.
  - risk: “Time” may not convey the possible sense of an appointed decisive moment.
    mitigation: A footnote preserves that lexical alternative without forcing an eschatological scheme.
