simplification_decisions:
- pob_phrase: made us a kingdom, priests to his God and Father
  simplified_phrase: made us a kingdom and priests who serve his God and Father
  preserved_meaning: The redeemed form one kingdom and are priests in relation to Jesus’ God and Father.
  reasoning_layer_used: Lexical and theological decisions on βασιλείαν, ἱερεῖς, and the dative phrase
  rationale: The rewrite clarifies the relationship while keeping “kingdom,” “priests,” and “his God and Father” distinct.
- pob_phrase: to him be the glory and the dominion
  simplified_phrase: Glory and dominion belong to him
  preserved_meaning: The words ascribe both glory and sovereign rule to him.
  reasoning_layer_used: Lexical decisions on αὐτῷ, δόξα, and κράτος
  rationale: An explicit English verb makes the verbless doxology immediately clear.
