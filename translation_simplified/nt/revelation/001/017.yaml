  text: When I saw him, I collapsed at his feet as if I were dead. Then he laid his right hand on me and said, “Do not be afraid. I am the First and the Last.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And when I saw him, I fell at his feet like a dead man.
  simplified_phrase: When I saw him, I collapsed at his feet as if I were dead.
  preserved_meaning: John fell before him in an overwhelmed, deathlike state but did not literally die.
  reasoning_layer_used: POB lexical decision for ἔπεσα πρὸς τοὺς πόδας αὐτοῦ and ὡς νεκρός
  rationale: “Collapsed” makes the physical force of the fall immediate while the simile keeps it nonliteral.
- pob_phrase: And he placed his right hand on me, saying
  simplified_phrase: Then he laid his right hand on me and said
  preserved_meaning: He touched John with his explicitly identified right hand while speaking to him.
  reasoning_layer_used: POB lexical decisions for ἔθηκεν, τὴν δεξιὰν, and λέγων
  rationale: The finite verbs and “Then” create natural English narrative without losing the symbolic right-hand detail.
- pob_phrase: Do not fear
  simplified_phrase: Do not be afraid
  preserved_meaning: He commands John to stop being fearful.
  reasoning_layer_used: POB listed lexical alternative for Μὴ φοβοῦ
  rationale: The approved alternative is more familiar in modern speech while retaining the command’s solemn force.
translation_notes:
  risk_flags:
  - risk: “Collapsed” may sound more involuntary than the general verb “fell.”
    mitigation: The surrounding vision and deathlike comparison support a sudden physical fall without specifying its precise cause.
