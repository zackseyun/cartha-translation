translation:
  language: en
  text: and among the lampstands was one like a son of man.[a] He wore a robe that reached his feet and a golden sash across his chest.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “one like the Son of Man.” The Greek echoes Daniel 7:13 and here refers to the exalted Jesus.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: in the midst of the lampstands
  simplified_phrase: among the lampstands
  preserved_meaning: The figure is located within the group of lampstands.
  reasoning_layer_used: Lexical decision for ἐν μέσῳ
  rationale: “Among” gives the same spatial sense in more familiar English.
- pob_phrase: clothed in a robe reaching to the feet
  simplified_phrase: He wore a robe that reached his feet
  preserved_meaning: The figure is dressed in a full-length robe.
  reasoning_layer_used: Lexical decisions for ἐνδεδυμένον and ποδήρη
  rationale: A direct sentence replaces the dense participial description without losing the robe’s length.
- pob_phrase: girded across the chest with a golden sash
  simplified_phrase: a golden sash across his chest
  preserved_meaning: The golden sash is worn high across the torso.
  reasoning_layer_used: Lexical decisions for περιεζωσμένον, πρὸς τοῖς μαστοῖς, and ζώνην χρυσᾶν
  rationale: The simpler wording keeps both the clothing image and the sash’s location.
translation_notes:
  risk_flags:
  - risk: Readers may take “a son of man” as merely a generic human figure.
    mitigation: The footnote preserves the Daniel 7 allusion and the traditional christological reading.
