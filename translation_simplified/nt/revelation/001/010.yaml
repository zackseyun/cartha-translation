translation:
  language: en
  text: On the Lord’s day,[a] I found myself in the Spirit.[b] Then I heard a loud voice behind me, sounding like a trumpet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Less likely: “on the day of the Lord.” The Greek wording means “the Lord’s day,” not the usual phrase for the future day of the Lord.'
    reason: alternative_reading
  - marker: b
    text: Or “in spirit.” This likely refers to the Holy Spirit’s prophetic influence, but the text does not explicitly say John was in a trance.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: I came to be in the Spirit on the Lord’s day
  simplified_phrase: On the Lord’s day, I found myself in the Spirit
  preserved_meaning: John entered a state described as being in the Spirit on the Lord’s day.
  reasoning_layer_used: Lexical and theological decisions for ἐγενόμην, ἐν πνεύματι, and κυριακῇ ἡμέρᾳ
  rationale: The reordered clause reads naturally while retaining the change of state and the unresolved meaning of “in the Spirit.”
- pob_phrase: and I heard behind me a loud voice like a trumpet
  simplified_phrase: Then I heard a loud voice behind me, sounding like a trumpet
  preserved_meaning: John heard a forceful voice from behind whose sound resembled a trumpet.
  reasoning_layer_used: Lexical decisions for ἤκουσα, ὀπίσω μου, φωνὴν μεγάλην, and ὡς σάλπιγγος
  rationale: Ordinary English word order and “sounding like” make clear that the comparison concerns the voice’s sound.
translation_notes:
  risk_flags:
  - risk: “I found myself” may suggest surprise more strongly than the Greek states.
    mitigation: The wording mainly conveys entry into a state, while the footnote avoids defining the experience as a trance.
  - risk: Modern readers may identify “the Lord’s day” too confidently with a particular day.
    mitigation: The text retains the source phrase without naming a weekday, and the footnote preserves the less likely alternative.
