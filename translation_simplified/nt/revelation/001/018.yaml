simplification_decisions:
- pob_phrase: and the Living One
  simplified_phrase: I am the Living One.
  preserved_meaning: Jesus identifies himself by the title “the Living One.”
  reasoning_layer_used: Immediate context and POB lexical decision for ὁ ζῶν
  rationale: Supplying the implied “I am” makes the title a clear sentence when the verse stands alone.
- pob_phrase: I became dead
  simplified_phrase: I died
  preserved_meaning: Jesus truly passed into death.
  reasoning_layer_used: POB lexical decision for ἐγενόμην νεκρός
  rationale: The direct verb expresses the transition naturally in modern English.
- pob_phrase: behold
  simplified_phrase: look
  preserved_meaning: Attention is vividly drawn to Jesus being alive after death.
  reasoning_layer_used: POB lexical decision for ἰδού
  rationale: “Look” keeps the attention-directing force without archaic wording.
interpretive_expansions:
- pob_phrase: and the Living One
  rendering: I am the Living One.
  claim: The title completes the self-identification begun in the preceding verse.
  evidence:
  - The phrase is coordinated with the preceding self-identification in Revelation 1:17.
  - The POB audit treats ὁ ζῶν as a title.
  confidence: high
  alternatives_preserved:
  - the one who lives
translation_notes:
  risk_flags:
  - risk: “I died” is less formally close to “I became dead.”
    mitigation: It still clearly expresses the transition into death rather than only a past state.
  - risk: Readers may mistake Hades for final punishment.
    mitigation: The footnote defines it as the realm of the dead and distinguishes it from final punishment.
