translation:
  language: en
  text: John sends this message to the seven churches in the Roman province of Asia. May grace and peace come to you from him who is, who was, and who is coming,[a] and from the seven spirits[b] before his throne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, more traditionally, “from the one who is and who was and who is to come.”
    reason: lexical_alternative
  - marker: b
    text: “The seven spirits” may symbolize the fullness of the Holy Spirit or may refer to seven heavenly spirits; the Greek text says “seven spirits.”
    reason: alternative_reading
