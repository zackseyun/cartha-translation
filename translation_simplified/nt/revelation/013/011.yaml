translation:
  language: en
  text: Then I saw another beast rising out of the earth.[a] It had two horns like a lamb’s horns, and it was speaking like a dragon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “rising from the land.” The Greek word can mean “earth” or “land.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And I saw another beast coming up out of the earth
  simplified_phrase: Then I saw another beast rising out of the earth
  preserved_meaning: John sees a second beast in the act of emerging from the earth.
  reasoning_layer_used: Lexical decision for ἀναβαῖνον ἐκ τῆς γῆς and immediate narrative context
  rationale: “Then” and “rising” make the vision’s sequence and motion easy to follow.
- pob_phrase: and it had two horns like a lamb
  simplified_phrase: It had two horns like a lamb’s horns
  preserved_meaning: The beast’s horns resemble those of a lamb without identifying it as the Lamb.
  reasoning_layer_used: Lexical and theological decisions for κέρατα δύο ὅμοια ἀρνίῳ
  rationale: Repeating “horns” makes the comparison immediately clear in English.
- pob_phrase: and it was speaking like a dragon
  simplified_phrase: and it was speaking like a dragon
  preserved_meaning: Its ongoing speech is compared with a dragon’s speech, not equated with the dragon itself.
  reasoning_layer_used: Lexical decisions for ἐλάλει and ὡς δράκων
  rationale: The wording stays direct because it already expresses both ongoing action and comparison clearly.
translation_notes:
  risk_flags:
  - risk: “Earth” could be read as excluding the valid sense “land.”
    mitigation: The footnote preserves the documented lexical alternative.
  - risk: “A lamb’s horns” may suggest an ordinary physical description rather than a symbolic resemblance.
    mitigation: The wording retains the lamb and horn images without explaining or resolving their symbolism.
