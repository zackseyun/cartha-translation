translation:
  language: en
  text: All who live on the earth will worship him—everyone whose name has not been written in the book of life that belongs to the Lamb who was slain from the foundation of the world.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “everyone whose name has not been written from the foundation of the world in the book of life that belongs to the Lamb who was slain.” The Greek phrase “from the foundation of the world” may describe either when the Lamb was slain or when the names were written.
    reason: alternative_reading
