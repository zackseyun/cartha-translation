translation:
  language: en
  text: This is so that no one can buy or sell unless he[a] has the mark, the beast’s name, or the number of its name.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek literally says “the one who has”; the masculine singular is used generically here.
    reason: lexical_alternative
  - marker: b
    text: Or “the number of his name.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: so that no one can
  simplified_phrase: This is so that no one can
  preserved_meaning: The restriction is the purpose or result of the preceding action.
  reasoning_layer_used: Lexical decision for ἵνα μή τις δύνηται
  rationale: “This is” supplies a natural link to the preceding context, while “so that” preserves the purpose/result force.
- pob_phrase: the name of the beast
  simplified_phrase: the beast’s name
  preserved_meaning: The required identifier is the name belonging to the beast.
  reasoning_layer_used: Lexical decision for τὸ ὄνομα τοῦ θηρίου
  rationale: The possessive form is clearer natural English without changing the relationship.
translation_notes:
  risk_flags:
  - risk: The three phrases may be read as wholly separate identifiers rather than closely related descriptions.
    mitigation: Commas preserve the POB list without forcing an appositional interpretation.
  - risk: The generic “he” may sound male-exclusive to modern readers.
    mitigation: Footnote a explains that the Greek masculine singular is generic.
