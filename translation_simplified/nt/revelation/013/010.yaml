translation:
  language: en
  text: If anyone is destined for captivity,[a] that person will go into captivity. If anyone is destined to be killed with the sword, that person must be killed with the sword.[b] This calls for endurance and faith from the saints.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “If anyone goes into captivity, that person will go into captivity”; the line may describe an appointed destiny rather than give a command.
    reason: alternative_reading
  - marker: b
    text: Some manuscripts read, “If anyone kills with the sword, that person must be killed with the sword.”
    reason: textual_variant
  - marker: c
    text: Or “faithfulness.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: If anyone is for captivity, into captivity he goes
  simplified_phrase: If anyone is destined for captivity, that person will go into captivity
  preserved_meaning: The repeated captivity language presents a solemn, appointed outcome.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The rewrite replaces the opaque phrase “is for captivity” while retaining its repetition and judicial force.
- pob_phrase: if anyone is to be killed with the sword, with the sword he must be killed
  simplified_phrase: If anyone is destined to be killed with the sword, that person must be killed with the sword
  preserved_meaning: The person appointed to death by the sword faces that outcome.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The sentence uses ordinary English while preserving the sword image, passive sense, and inevitability.
- pob_phrase: Here is the endurance and the faith of the saints
  simplified_phrase: This calls for endurance and faith from the saints
  preserved_meaning: The threatened suffering is the setting in which the saints need endurance and faith.
  reasoning_layer_used: Immediate context and POB lexical decisions
  rationale: The demonstrative expression is recast to make its connection with the preceding warning clear.
interpretive_expansions:
- pob_phrase: is for captivity
  rendering: is destined for captivity
  claim: The clause describes an appointed outcome rather than issuing a command.
  evidence:
  - The POB theological decision adopts descriptive inevitability or judicial destiny.
  - The repeated captivity phrase gives the line a proverbial, emphatic form.
  confidence: moderate
  alternatives_preserved:
  - If anyone goes into captivity, that person will go into captivity.
  - The line could be read without explicitly stating destiny.
- pob_phrase: Here is the endurance and the faith of the saints
  rendering: This calls for endurance and faith from the saints
  claim: The preceding prospect of suffering is the situation requiring the saints' endurance and faith.
  evidence:
  - The immediate context places the closing statement after captivity and death by the sword.
  - The POB rationale describes endurance as persevering constancy under suffering.
  confidence: high
  alternatives_preserved:
  - Here is the endurance and faith of the saints.
  - Faith may carry the nuance of faithfulness.
translation_notes:
  risk_flags:
  - risk: “Destined” may sound more explicit or fatalistic than the terse Greek.
    mitigation: Footnote a preserves the less interpretive wording and notes the ambiguity.
  - risk: The sword clause has a significant manuscript variant with a retributive sense.
    mitigation: Footnote b states the variant without replacing the adopted POB reading.
