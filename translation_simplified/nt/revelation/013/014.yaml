translation:
  language: en
  text: It deceives those who live on the earth through the signs it was given to perform in the beast’s presence. It tells them to make an image for the beast[a]—the beast that had a sword wound and yet lived.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “an image of the beast”; the Greek more literally says “an image for the beast.”
    reason: lexical_alternative
  - marker: b
    text: Or “came to life.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: those who dwell on the earth
  simplified_phrase: those who live on the earth
  preserved_meaning: The phrase still identifies the earth’s inhabitants.
  reasoning_layer_used: POB lexical decision for κατοικοῦντας / κατοικοῦσιν ἐπὶ τῆς γῆς
  rationale: “Live” is more common than “dwell” while retaining the verbal expression.
- pob_phrase: because of the signs that it was given to perform
  simplified_phrase: through the signs it was given to perform
  preserved_meaning: The signs are the means and basis of the deception, while the giver remains unnamed.
  reasoning_layer_used: POB lexical decision for διὰ τὰ σημεῖα and theological decision on the divine passive
  rationale: “Through” makes the instrumental connection clear without identifying who granted the signs.
- pob_phrase: the beast that had the wound of the sword and yet lived
  simplified_phrase: the beast that had a sword wound and yet lived
  preserved_meaning: The beast suffered a sword-inflicted wound but nevertheless lived.
  reasoning_layer_used: POB lexical decisions for μάχαιρα and καὶ ἔζησεν
  rationale: “A sword wound” is natural English and preserves both the weapon and the contrast.
translation_notes:
  risk_flags:
  - risk: Readers could take “image for the beast” as excluding an image representing the beast.
    mitigation: Footnote a preserves “image of the beast” as a viable alternative.
  - risk: “Yet lived” may suggest survival rather than restoration to life.
    mitigation: Footnote b preserves “came to life” without making it the main-text claim.
