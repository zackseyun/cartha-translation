translation:
  language: en
  text: It was given to him to wage war against God’s holy people and conquer them. He was also given authority over every tribe, people, language, and nation.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: to make war against the saints
  simplified_phrase: to wage war against God’s holy people
  preserved_meaning: He engages in hostile conflict with the people set apart for God.
  reasoning_layer_used: POB lexical decisions for ποιῆσαι πόλεμον, μετὰ τῶν ἁγίων, and ἁγίων
  rationale: This uses natural modern wording and prevents “saints” from suggesting only officially recognized individuals.
- pob_phrase: and authority was given to him
  simplified_phrase: He was also given authority
  preserved_meaning: His authority is delegated by an unnamed giver.
  reasoning_layer_used: POB theological decision on the unnamed divine passive
  rationale: A new sentence is easier to follow while the passive still leaves the giver unnamed.
- pob_phrase: over every tribe and people and language and nation
  simplified_phrase: over every tribe, people, language, and nation
  preserved_meaning: His authority extends across all four kinds of human groups named in the source.
  reasoning_layer_used: POB lexical decisions for the fourfold scope formula
  rationale: Modern list punctuation improves readability without merging the distinct groups.
translation_notes:
  risk_flags:
  - risk: Replacing “saints” may reduce continuity with Revelation’s traditional key term.
    mitigation: “God’s holy people” directly preserves the referent established in the POB lexical rationale.
  - risk: The repeated passive may still sound somewhat formal.
    mitigation: It is retained because naming the giver or saying “allowed” would resolve tension the POB preserves.
