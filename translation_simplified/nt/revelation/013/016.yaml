translation:
  language: en
  text: It causes everyone, whether they are of low or high status, rich or poor, free people or slaves, to be given a mark[a] on their right hand or forehead.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “so that they might give them a mark.” The Greek wording is difficult, so the main text gives its sense in natural English.
