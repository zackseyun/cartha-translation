  preserved_meaning: The expression includes people of every social rank.
  reasoning_layer_used: POB lexical decision for τοὺς μικροὺς καὶ τοὺς μεγάλους
  rationale: The clearer wording prevents readers from mistaking the pair for physical size or age.
- pob_phrase: the rich and the poor, and the free and the slaves
  simplified_phrase: rich or poor, free people or slaves
  preserved_meaning: The paired contrasts retain the full range of economic and legal status.
  reasoning_layer_used: POB lexical and theological decisions for the status pairs
  rationale: Ordinary English uses “or” naturally after “whether” while keeping each contrast distinct.
- pob_phrase: on their right hand or on their forehead
  simplified_phrase: on their right hand or forehead
  preserved_meaning: The mark may be placed in either named location.
  reasoning_layer_used: POB lexical decisions for hand and forehead
  rationale: Removing the repeated preposition makes the phrase smoother without changing either location.
