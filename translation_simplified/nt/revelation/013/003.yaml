translation:
  language: en
  text: One of its heads looked as if it had been slaughtered to death,[a] but its deadly wound was healed. The whole earth[b] was amazed and followed the beast.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek describes the head as looking as if it had been slaughtered; it does not explain the exact nature of its apparent death and recovery.
    reason: lexical_alternative
  - marker: b
    text: Or “the whole land,” though “the whole earth” is more likely in this setting.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: was as if slaughtered to death
  simplified_phrase: looked as if it had been slaughtered to death
  preserved_meaning: The head appeared mortally slaughtered without asserting exactly what happened.
  reasoning_layer_used: Lexical and theological decisions on ὡς ἐσφαγμένην and the apparent death.
  rationale: “Looked as if” makes the visionary comparison natural while preserving its ambiguity.
- pob_phrase: marveled
  simplified_phrase: was amazed
  preserved_meaning: The whole earth responded with astonishment.
  reasoning_layer_used: Lexical decision on ἐθαυμάσθη.
  rationale: “Was amazed” is more familiar English and does not define the response as positive or negative.
- pob_phrase: followed after the beast
  simplified_phrase: followed the beast
  preserved_meaning: The earth went after the beast, including the contextual sense of allegiance.
  reasoning_layer_used: Lexical decision on ὀπίσω τοῦ θηρίου.
  rationale: Removing the redundant “after” gives natural English without weakening the act of following.
translation_notes:
  risk_flags:
  - risk: Readers may take the apparent slaughter as a definite literal death.
    mitigation: The main text says “looked as if,” and footnote a preserves the unresolved interpretation.
  - risk: “Followed” may be heard as movement only rather than allegiance.
    mitigation: The beast context supports allegiance while the wording retains the source image of going after it.
