translation:
  language: en
  text: They worshiped the dragon because he had given authority to the beast. They also worshiped the beast and said, “Who is like the beast?[a] Who can wage war against it?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This praise likely echoes Old Testament words about no one being like God (for example, Exodus 15:11 and Psalm 35:10), but here it is blasphemously applied to the beast.
    reason: cross_reference
simplification_decisions:
- pob_phrase: And they worshiped the dragon ... and they worshiped the beast, saying
  simplified_phrase: They worshiped the dragon ... They also worshiped the beast and said
  preserved_meaning: The people worship both the dragon and the beast, and their words praise the beast.
  reasoning_layer_used: POB translation and lexical decision for προσεκύνησαν
  rationale: Two sentences make the sequence easier to follow while retaining the repeated act of worship.
- pob_phrase: who is able to make war with it?
  simplified_phrase: Who can wage war against it?
  preserved_meaning: The question claims that no one has the ability to engage the beast in war.
  reasoning_layer_used: POB lexical alternatives for δύναται and πολεμῆσαι μετ’ αὐτοῦ
  rationale: “Can wage war against” is clearer modern English and keeps the military force.
- pob_phrase: Who is like the beast
  simplified_phrase: Who is like the beast?
  preserved_meaning: The rhetorical praise presents the beast as incomparable while preserving the biblical echo.
  reasoning_layer_used: POB theological decision on divine incomparability language
  rationale: The wording remains unchanged so the allusion is explained only in the footnote.
translation_notes:
  risk_flags:
  - risk: Readers may miss that “Who is like the beast?” blasphemously imitates praise of God.
    mitigation: A brief cross-reference footnote identifies the likely Old Testament echo.
  - risk: The pronoun “it” may sound less personal than the beast’s ruler-like portrayal.
    mitigation: It is retained because the POB follows the neuter Greek noun and avoids added interpretation.
