translation:
  language: en
  text: It exercises all the first beast’s authority in the first beast’s presence.[a] It causes the earth and those who live on it to worship the first beast, whose mortal wound was healed.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “before the first beast.” The second beast acts under its gaze or in its immediate presence.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: all the authority of the first beast
  simplified_phrase: all the first beast’s authority
  preserved_meaning: The second beast exercises the full authority belonging to the first beast.
  reasoning_layer_used: Lexical decisions for ἐξουσίαν and πᾶσαν
  rationale: The possessive form is easier to read while retaining the authority’s scope and source.
- pob_phrase: those who dwell on it
  simplified_phrase: those who live on it
  preserved_meaning: The phrase refers to the people living on the earth without adding universal quantification.
  reasoning_layer_used: Lexical decision for τοὺς ἐν αὐτῇ κατοικοῦντας and grounding review
  rationale: “Live” is more familiar than “dwell,” while omitting “all” avoids overstating the Greek.
- pob_phrase: in its presence
  simplified_phrase: in the first beast’s presence
  preserved_meaning: The second beast acts before or under the gaze of the first beast.
  reasoning_layer_used: Lexical decision for ἐνώπιον αὐτοῦ
  rationale: Repeating “the first beast” clarifies the pronoun without resolving the spatial nuance.
translation_notes:
  risk_flags:
  - risk: Repeating “the first beast” is less compact than the Greek pronoun.
    mitigation: The repetition prevents confusion between the two beasts without changing the referent.
