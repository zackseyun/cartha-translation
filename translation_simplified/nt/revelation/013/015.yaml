translation:
  language: en
  text: He was allowed to give breath[a] to the beast’s image, so that the image could even speak and cause anyone who refused to worship it to be killed.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “spirit” or “life.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: it was given to him to give breath
  simplified_phrase: He was allowed to give breath
  preserved_meaning: The figure receives permission or ability from an unnamed giver to animate the image.
  reasoning_layer_used: Lexical and theological decisions on ἐδόθη and αὐτῷ
  rationale: The active English wording is easier to follow while leaving the giver unidentified.
- pob_phrase: the image of the beast
  simplified_phrase: the beast’s image
  preserved_meaning: The image belongs to or represents the beast without being narrowed to a statue.
  reasoning_layer_used: Lexical decision on εἰκών and θηρίον
  rationale: The possessive form removes repetition while retaining both established terms.
- pob_phrase: those who would not worship the image of the beast
  simplified_phrase: anyone who refused to worship it
  preserved_meaning: All who reject worship of the beast’s image face death.
  reasoning_layer_used: Lexical decisions on ὅσοι ἐὰν μὴ προσκυνήσωσιν and προσκυνέω
  rationale: “Anyone who refused” states the envisioned noncompliance in direct modern English.
translation_notes:
  risk_flags:
  - risk: “He was allowed” may sound more explicitly permissive than the Greek passive.
    mitigation: It follows a documented POB alternative and still leaves the granting agent unnamed.
  - risk: “Breath” may be mistaken for a claim that the image received true life.
    mitigation: The wording preserves the concrete animation image, while the footnote records the lexical alternatives.
