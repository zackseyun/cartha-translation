translation:
  language: en
  text: Then I saw a beast rising out of the sea. It had ten horns and seven heads. On its horns were ten crowns,[a] and on its heads were blasphemous names.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More specifically, royal diadems.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: a beast coming up out of the sea, having ten horns and seven heads
  simplified_phrase: a beast rising out of the sea. It had ten horns and seven heads
  preserved_meaning: The beast emerges from within the sea and retains the visionary features of ten horns and seven heads.
  reasoning_layer_used: Lexical decisions for ἐκ τῆς θαλάσσης, ἀναβαῖνον, κέρατα, and κεφαλάς
  rationale: Two direct sentences make the unfolding vision easier to follow without interpreting its symbols.
- pob_phrase: and on its horns ten crowns
  simplified_phrase: On its horns were ten crowns
  preserved_meaning: The ten crowns are located on the beast's horns.
  reasoning_layer_used: Lexical and theological decision for διαδήματα
  rationale: Ordinary English word order clarifies the image while the footnote preserves the specific sense of diadems.
- pob_phrase: names of blasphemy
  simplified_phrase: blasphemous names
  preserved_meaning: The names on the heads express blasphemy.
  reasoning_layer_used: Documented lexical alternative for ὀνόματα βλασφημίας
  rationale: The attributive form is natural modern English and remains within the POB's documented ambiguity.
translation_notes:
  risk_flags:
  - risk: Readers may seek symbolic identifications for the beast, horns, or heads.
    mitigation: The translation retains the images without identifying them as a ruler, kingdom, empire, or satanic agent.
