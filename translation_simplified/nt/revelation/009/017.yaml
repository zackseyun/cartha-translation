  preserved_meaning: John sees both the horses and the people mounted on them.
  reasoning_layer_used: POB lexical decision for καθημένους ἐπ’ αὐτῶν
  rationale: “Their riders” expresses the same image more directly in common English.
- pob_phrase: they had breastplates
  simplified_phrase: The riders wore breastplates
  preserved_meaning: The mounted figures are the ones equipped with protective chest armor.
  reasoning_layer_used: Greek syntax and POB lexical decision for θώρακας
  rationale: Naming the riders again removes pronoun ambiguity and makes possession of the armor natural in English.
- pob_phrase: and the heads of the horses were like lions’ heads
  simplified_phrase: The horses had heads like lions’ heads
  preserved_meaning: The vision compares the horses’ heads to the heads of lions.
  reasoning_layer_used: POB lexical decision for ὡς κεφαλαὶ λεόντων
  rationale: The active construction is easier to read while preserving the full comparison.
