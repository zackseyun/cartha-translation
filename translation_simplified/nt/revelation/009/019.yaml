  reasoning_layer_used: Lexical decisions for ὅμοιαι ὄφεσιν and ἔχουσαι κεφαλάς
  rationale: “Snakes” and “with heads” preserve the vivid image in natural modern English.
- pob_phrase: with them they do harm
  simplified_phrase: they cause harm with them
  preserved_meaning: The snake-like tails and their heads are the means by which the horses inflict harm.
  reasoning_layer_used: Lexical decisions for ἐν αὐταῖς and ἀδικοῦσιν
  rationale: Keeping “with them” avoids limiting the instrument of harm to the tails alone.
