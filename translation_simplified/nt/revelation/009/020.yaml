translation:
  language: en
  text: The rest of humanity—those who were not killed by these plagues—did not even repent of the things their own hands had made. Their repentance would have meant no longer worshiping demons and idols made of gold, silver, bronze, stone, and wood.[a] These idols cannot see, hear, or walk.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Greek can describe either the purpose or the intended result of repentance: that they would no longer worship them.'
    reason: alternative_reading
