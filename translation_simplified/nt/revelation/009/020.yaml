  preserved_meaning: Their repentance concerned the idols they had made and worshiped.
  reasoning_layer_used: POB lexical rationale for ἐκ τῶν ἔργων τῶν χειρῶν αὐτῶν
  rationale: This keeps the concrete hand-made image while making the idiom immediately understandable.
- pob_phrase: the idols of gold and silver and bronze and stone and wood, which can neither see nor hear nor walk
