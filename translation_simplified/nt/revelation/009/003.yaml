translation:
  language: en
  text: Then locusts came out of the smoke onto the earth. They were given authority[a], like the authority scorpions on the earth have.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “power.” The word here indicates that their ability to act was granted to them.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And out of the smoke came locusts onto the earth
  simplified_phrase: Then locusts came out of the smoke onto the earth.
  preserved_meaning: The locusts visibly emerge from within the smoke and move onto the earth.
  reasoning_layer_used: Lexical decisions for ἐκ, ἐξέρχομαι, and εἰς τὴν γῆν
  rationale: Ordinary subject-first order makes the movement easier to follow while preserving the emergence image.
- pob_phrase: and authority was given to them
  simplified_phrase: They were given authority
  preserved_meaning: Their authority is granted rather than independently possessed, while the giver remains unstated.
  reasoning_layer_used: Theological decision on the divine passive and ἐξουσία
  rationale: A new sentence and indirect passive sound natural without weakening the idea of delegated permission.
- pob_phrase: the scorpions of the earth
  simplified_phrase: scorpions on the earth
  preserved_meaning: The comparison is with earthly scorpions.
  reasoning_layer_used: Lexical decision for οἱ σκορπίοι τῆς γῆς
  rationale: “On the earth” expresses the same contrast in clearer modern English.
translation_notes:
  risk_flags:
  - risk: Modern readers may hear “authority” only as official status rather than granted capacity to act.
    mitigation: The footnote gives “power” as an alternative while explaining that the capacity was granted.
