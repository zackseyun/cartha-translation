  preserved_meaning: The fifth trumpet sounds before John reports what he sees.
  reasoning_layer_used: POB translation and source clause sequence
  rationale: Two sentences make the sequence easier to follow without changing it.
- pob_phrase: a star that had fallen
  simplified_phrase: a star that had already fallen
  preserved_meaning: The star’s fall occurred before John saw it.
  reasoning_layer_used: POB lexical decision for πεπτωκότα
  rationale: “Already” states the completed prior fall in common English.
- pob_phrase: the key to the shaft of the abyss
  simplified_phrase: the key to the shaft that opens into the abyss
  preserved_meaning: The key controls access through the shaft to the abyss.
  reasoning_layer_used: POB lexical decisions for φρέαρ and ἄβυσσος
  rationale: The added clause clearly distinguishes the access shaft from the abyss itself.
