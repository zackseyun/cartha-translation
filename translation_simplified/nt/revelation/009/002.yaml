translation:
  language: en
  text: He opened the shaft leading to the abyss.[a] Smoke rose from it like smoke from a huge furnace. The smoke from the shaft darkened the sun and the air.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “the pit of the abyss”; traditionally, “the bottomless pit.”
