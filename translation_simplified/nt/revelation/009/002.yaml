simplification_decisions:
- pob_phrase: the shaft of the abyss
  simplified_phrase: the shaft leading to the abyss
  preserved_meaning: The shaft remains distinct from the abyss and serves as its opening or access passage.
  reasoning_layer_used: Lexical and theological decisions for φρέαρ and ἄβυσσος
  rationale: “Leading to” makes the relationship clear without identifying the shaft as the abyss itself.
- pob_phrase: smoke went up from the shaft like the smoke of a great furnace
  simplified_phrase: Smoke rose from it like smoke from a huge furnace.
  preserved_meaning: Smoke moves upward from the shaft and is compared to smoke from an immense furnace.
  reasoning_layer_used: Lexical decisions for ἀνέβη and the furnace comparison
  rationale: A shorter sentence and “rose” express the same motion and vivid comparison naturally.
- pob_phrase: the sun and the air were darkened by the smoke from the shaft
  simplified_phrase: The smoke from the shaft darkened the sun and the air.
  preserved_meaning: The smoke causes both the sun and the atmosphere to become dark.
  reasoning_layer_used: Lexical decisions for ἐσκοτώθη, ἀήρ, and the causal ἐκ phrase
  rationale: The active sentence states the same cause and result more directly.
interpretive_expansions:
- pob_phrase: the shaft of the abyss
  rendering: the shaft leading to the abyss
  claim: The shaft is an access passage to the abyss rather than another name for the abyss.
  evidence:
  - The POB lexical rationale describes φρέαρ as the opening or access passage.
  - The theological decision requires preserving the distinction between the shaft and the abyss.
  confidence: high
  alternatives_preserved:
  - the pit of the abyss
  - the bottomless pit
translation_notes:
  risk_flags:
  - risk: “Leading to” makes the shaft’s access function more explicit than the Greek genitive alone.
    mitigation: The wording follows the POB lexical and theological rationale while preserving the two distinct images.
