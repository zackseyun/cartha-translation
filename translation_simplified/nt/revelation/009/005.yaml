  preserved_meaning: The victims suffer severe affliction for a fixed five-month period rather than being killed.
  reasoning_layer_used: lexical decision on βασανισθήσονται and μῆνας πέντε
  rationale: A new sentence clarifies the contrast and removes the awkward repeated construction.
- pob_phrase: their torment was like the torment of a scorpion
  simplified_phrase: The torment they caused was like the pain of a scorpion
