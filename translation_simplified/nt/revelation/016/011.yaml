translation:
  language: en
  text: Because of their pain and sores, they blasphemed the God of heaven—they spoke evil against him. But they did not repent of what they had done.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And they blasphemed the God of heaven because of their pains and their sores
  simplified_phrase: Because of their pain and sores, they blasphemed the God of heaven—they spoke evil against him.
  preserved_meaning: Their suffering caused them to respond by speaking irreverently against God.
  reasoning_layer_used: Lexical decisions for ἐβλασφήμησαν, πόνος, and ἕλκος, with the theological decision on causal ἐκ.
  rationale: Fronting the cause and defining “blasphemed” makes the response clear while preserving the biblical title.
- pob_phrase: they did not repent of their deeds
  simplified_phrase: they did not repent of what they had done
  preserved_meaning: They did not turn away in repentance from their previous actions.
  reasoning_layer_used: Lexical decisions for μετενόησαν and ἐκ τῶν ἔργων αὐτῶν.
  rationale: “What they had done” is more natural than “their deeds” without weakening the moral force of repentance.
interpretive_expansions:
- pob_phrase: blasphemed
  rendering: blasphemed ...—they spoke evil against him
  claim: The added phrase explains blasphemy as hostile, irreverent speech directed against God.
  evidence:
