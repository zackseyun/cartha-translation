translation:
  language: en
  text: Then they gathered them at the place called Armageddon in Hebrew.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Greek has “he” or “it gathered them.” The main text uses “they” because the preceding verses say that the unclean spirits gather the kings.
    reason: alternative_reading
  - marker: b
    text: “In Hebrew” may refer more broadly to the Hebrew or Aramaic language used for this Semitic name.
    reason: lexical_alternative
