translation:
  language: en
  text: The fifth[a] poured out his bowl on the beast’s throne. Its kingdom became dark, and they kept gnawing their tongues because of the pain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: That is, the fifth in the series; the Greek does not repeat the word “angel” here.
    reason: simplification_note
simplification_decisions:
- pob_phrase: And the fifth poured out his bowl on the throne of the beast
  simplified_phrase: The fifth poured out his bowl on the beast’s throne.
  preserved_meaning: The fifth in the series pours the bowl directly on the beast’s seat of rule.
  reasoning_layer_used: POB lexical decisions for ὁ πέμπτος, φιάλην, and ἐπὶ τὸν θρόνον τοῦ θηρίου
  rationale: The possessive form and a sentence break make the action easier to follow without adding “angel” to the text.
- pob_phrase: its kingdom became darkened
  simplified_phrase: Its kingdom became dark
  preserved_meaning: Darkness comes upon the beast’s kingdom as a result of the judgment.
  reasoning_layer_used: POB lexical and theological decisions for ἡ βασιλεία αὐτοῦ and ἐσκοτωμένη
  rationale: “Became dark” is more natural English while retaining the onset and result of the darkness.
- pob_phrase: they were gnawing their tongues because of the pain
  simplified_phrase: they kept gnawing their tongues because of the pain
  preserved_meaning: Their tongue-gnawing continues under extreme pain.
  reasoning_layer_used: POB lexical decision for imperfect ἐμασῶντο
  rationale: “Kept gnawing” clearly expresses the Greek verb’s ongoing action.
translation_notes:
  risk_flags:
  - risk: “The fifth” may seem incomplete to readers encountering the verse alone.
    mitigation: The anchored footnote explains the implied place in the series without inserting “angel” into the main text.
