translation:
  language: en
  text: The great city was split into three parts, and the cities of the nations fell. God remembered Babylon the great for judgment[a], in order to give her the cup of wine—the fury of his wrath.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “Babylon the great was remembered before God.” This biblical expression means that she came under God’s notice for judgment.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Babylon the great was remembered before God
  simplified_phrase: God remembered Babylon the great for judgment
  preserved_meaning: Babylon came under God’s judicial notice.
  reasoning_layer_used: POB theological decision on the judgment idiom
  rationale: The active wording is easier to follow, while “for judgment” prevents the sense that God had forgotten Babylon.
- pob_phrase: to give her
  simplified_phrase: in order to give her
  preserved_meaning: Giving Babylon the cup is the purpose or result of God’s remembering her.
  reasoning_layer_used: POB lexical decision on δοῦναι αὐτῇ and grounding review
  rationale: “In order to” makes the infinitive’s relationship explicit instead of presenting the giving as a separate completed action.
- pob_phrase: the cup of the wine of the fury of his wrath
  simplified_phrase: the cup of wine—the fury of his wrath
  preserved_meaning: The cup and wine remain images of judgment, and both fury and wrath retain the original intensification.
  reasoning_layer_used: POB lexical and theological decisions on ποτήριον, θυμός, and ὀργή
  rationale: The dash clarifies the dense chain without adding the unsupported phrase “filled with.”
interpretive_expansions:
- pob_phrase: was remembered before God
  rendering: God remembered Babylon the great for judgment
  claim: God’s remembrance means that Babylon came under his judicial notice.
  evidence:
