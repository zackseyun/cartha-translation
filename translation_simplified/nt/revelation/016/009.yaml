  text: The people were scorched by intense heat. They blasphemed the name of God, who has authority over these plagues. But they did not repent so that they would give him glory.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: were scorched with great heat
  simplified_phrase: were scorched by intense heat
  preserved_meaning: The people suffered severe scorching caused by heat.
  reasoning_layer_used: Lexical decisions for ἐκαυματίσθησαν and καῦμα μέγα
  rationale: “By intense heat” states the cause naturally while preserving the plague’s severity.
- pob_phrase: and they blasphemed ... and they did not repent
  simplified_phrase: They blasphemed ... But they did not repent
  preserved_meaning: They responded to suffering with blasphemy rather than repentance.
  reasoning_layer_used: Lexical decisions and immediate context
  rationale: Short sentences and “but” make the contrast clear without changing it.
- pob_phrase: did not repent to give him glory
  simplified_phrase: did not repent so that they would give him glory
  preserved_meaning: Giving God glory is presented as the expected purpose or result of repentance.
  reasoning_layer_used: Lexical rationale for δοῦναι αὐτῷ δόξαν and grounding review
  rationale: “So that” keeps the infinitive dependent on repentance instead of making two separate actions.
