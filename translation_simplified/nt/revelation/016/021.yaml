translation:
  language: en
  text: Huge hailstones, each weighing about a talent,[a] come down from heaven onto the people. The people blasphemed God because this plague of hail is terribly severe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A talent was a very large ancient unit of weight; the Greek gives an approximate comparison, not an exact measurement.
    reason: cultural_note
simplification_decisions:
- pob_phrase: great hail, about a talent in weight
  simplified_phrase: Huge hailstones, each weighing about a talent
  preserved_meaning: The hail consists of extraordinarily heavy stones whose weight is compared approximately to a talent.
  reasoning_layer_used: POB lexical decision and footnote on χάλαζα μεγάλη and ὡς ταλαντιαία
  rationale: The plural makes the individual stones easier to picture while retaining the source image and approximate weight.
- pob_phrase: comes down from heaven upon the people
  simplified_phrase: come down from heaven onto the people
  preserved_meaning: The hail descends from heaven and strikes people generally.
  reasoning_layer_used: POB lexical and theological decisions on καταβαίνει, οὐρανός, and ἄνθρωποι
  rationale: Ordinary word order and “onto” clarify the action while preserving the vivid present tense and “heaven.”
- pob_phrase: because of the plague of the hail, because its plague is exceedingly severe
  simplified_phrase: because this plague of hail is terribly severe
  preserved_meaning: The extreme severity of the hail plague prompts the people to blaspheme God.
  reasoning_layer_used: POB lexical decision on πληγή and the explanatory ὅτι clause
  rationale: Combining the repeated causal wording produces a direct sentence without weakening the plague’s severity.
