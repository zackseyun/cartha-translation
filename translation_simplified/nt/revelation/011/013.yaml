translation:
  language: en
  text: At that very time, a great earthquake struck. One tenth of the city fell, and the earthquake killed seven thousand people. Everyone else became terrified and gave glory to the God of heaven.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And in that hour there was a great earthquake
  simplified_phrase: At that very time, a great earthquake struck.
  preserved_meaning: The earthquake happened at the same vividly marked time.
  reasoning_layer_used: POB lexical decisions for ἐν ἐκείνῃ τῇ ὥρᾳ and ἐγένετο
  rationale: The new wording uses natural event language while preserving the temporal immediacy.
- pob_phrase: and a tenth of the city fell, and seven thousand people were killed in the earthquake
  simplified_phrase: One tenth of the city fell, and the earthquake killed seven thousand people.
  preserved_meaning: The disaster affected a specified portion of the city and killed a specified number of people.
  reasoning_layer_used: POB lexical decisions for τὸ δέκατον, ἔπεσεν, ἀπεκτάνθησαν, and ὀνόματα ἀνθρώπων
  rationale: The active sentence clearly connects the deaths to the earthquake without changing the figures or mode of destruction.
- pob_phrase: and the rest became terrified
  simplified_phrase: Everyone else became terrified
  preserved_meaning: Those remaining after the deaths entered a state of intense fear.
  reasoning_layer_used: POB lexical decisions for οἱ λοιποὶ and ἔμφοβοι ἐγένοντο
  rationale: “Everyone else” is clearer common English than “the rest” while avoiding the more interpretive term “survivors.”
translation_notes:
  risk_flags:
  - risk: Readers may assume that giving glory to God proves genuine repentance.
    mitigation: The wording retains the POB statement without defining the spiritual quality of their response.
  - risk: Readers may understand that the whole tenth of the city collapsed.
    mitigation: The text keeps the broader verb “fell,” preserving the source text’s lack of detail.
