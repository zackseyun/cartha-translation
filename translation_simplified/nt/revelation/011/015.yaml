translation:
  language: en
  text: The seventh angel blew his trumpet. Loud voices in heaven said, “The kingdom of the world[a] has now become the kingdom of our Lord and of his Messiah,[b] and he will reign forever and ever.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some manuscripts read “the kingdoms of the world” or “the kingdom of this world.” The main text follows the singular reading, “the kingdom of the world.”
    reason: textual_variant
  - marker: b
    text: Or “his Christ.” “Messiah” preserves the Greek word’s sense as a title.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: sounded his trumpet
  simplified_phrase: blew his trumpet
  preserved_meaning: The seventh angel caused his trumpet to sound.
  reasoning_layer_used: Lexical decision for ἐσάλπισεν
  rationale: “Blew his trumpet” is familiar English and preserves the instrument implied by the verb.
- pob_phrase: and there were loud voices in heaven, saying
  simplified_phrase: Loud voices in heaven said
  preserved_meaning: Loud voices in the heavenly realm made the proclamation.
  reasoning_layer_used: Lexical decisions for φωναὶ μεγάλαι, ἐν τῷ οὐρανῷ, and λέγοντες
  rationale: A direct sentence removes the awkward introductory construction without changing the speakers or setting.
- pob_phrase: has become that of our Lord and of his Messiah
  simplified_phrase: has now become the kingdom of our Lord and of his Messiah
  preserved_meaning: The world’s kingdom has undergone a completed transition and is now the kingdom ruled by the Lord and his Messiah.
  reasoning_layer_used: Lexical and theological decisions for ἐγένετο, βασιλεία, the genitives, and Χριστός
  rationale: Repeating “kingdom” makes the relationship clear while preserving the completed transition expressed by “has become.”
interpretive_expansions:
- pob_phrase: has become that of our Lord and of his Messiah
  rendering: has now become the kingdom of our Lord and of his Messiah
  claim: The proclamation presents the transition as completed with a present result.
  evidence:
  - POB uses the present perfect to convey the aorist’s now-accomplished force.
  - The immediate proclamation identifies the kingdom as that of the Lord and his Messiah.
  confidence: high
  alternatives_preserved:
  - has become that of our Lord and of his Messiah
translation_notes:
  risk_flags:
  - risk: The singular pronoun “he” has a compressed antecedent that may be understood in more than one way.
    mitigation: The draft retains POB’s singular wording without identifying the referent more explicitly.
  - risk: Repeating “kingdom” is more explicit than the POB phrase “that of.”
    mitigation: The repetition only supplies the omitted English noun and preserves the singular kingdom and completed transition.
