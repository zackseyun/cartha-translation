translation:
  language: en
  text: The nations became angry, and your wrath came. The time also came for the dead to be judged, for you to reward your servants[a]—the prophets, the saints, and those who fear your name, whether low or high in status—and to destroy those who destroy the earth.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “slaves”; the Greek word can mean either servants or slaves, depending on the context.
    reason: alternative_reading
  - marker: b
    text: The Greek may also mean “those who ruin or corrupt the earth”; “land” is also possible instead of “earth.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: and your wrath came, and the time for the dead to be judged
  simplified_phrase: and your wrath came. The time also came for the dead to be judged
  preserved_meaning: God’s judicial wrath arrives at the appointed time when the dead are judged.
  reasoning_layer_used: POB syntax and lexical decisions for wrath, time, and judgment
  rationale: Splitting the long sentence and supplying the implied verb makes the sequence easier to follow.
- pob_phrase: and to give the reward to your servants
  simplified_phrase: for you to reward your servants
  preserved_meaning: God gives his servants their reward.
  reasoning_layer_used: POB lexical and theological decisions for reward and servants
  rationale: An active clause states the same action more directly while retaining the chosen terms.
- pob_phrase: the small and the great
  simplified_phrase: whether low or high in status
  preserved_meaning: God’s people of every social standing are included.
  reasoning_layer_used: POB lexical rationale for the comprehensive status pair
  rationale: The status contrast is made explicit because “small and great” is opaque in modern English.
interpretive_expansions:
- pob_phrase: the small and the great
  rendering: whether low or high in status
  claim: The pair refers comprehensively to differences in social standing.
  evidence:
