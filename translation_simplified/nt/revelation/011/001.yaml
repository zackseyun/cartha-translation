translation:
  language: en
  text: Then I was given a reed like a rod, and I was told, “Get up and measure God’s temple[a], the altar, and the people worshiping in the temple.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “God’s sanctuary.” The Greek word can refer specifically to the inner temple rather than the whole temple complex.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: saying
  simplified_phrase: and I was told
  preserved_meaning: The command accompanies the reed, while the speaker remains unidentified.
  reasoning_layer_used: Lexical and theological decisions on λέγων
  rationale: This reads naturally without naming an angel, voice, or other speaker.
- pob_phrase: Rise and measure
  simplified_phrase: Get up and measure
  preserved_meaning: John receives two direct commands to rise and begin measuring.
  reasoning_layer_used: Lexical decisions on Ἔγειρε and μέτρησον
  rationale: “Get up” is common English and keeps both commands distinct.
- pob_phrase: those who worship in it
  simplified_phrase: the people worshiping in the temple
  preserved_meaning: The worshipers located in the temple are also to be measured.
  reasoning_layer_used: Lexical decisions on τοὺς προσκυνοῦντας and ἐν αὐτῷ
  rationale: Repeating “the temple” prevents readers from attaching the location to the altar.
translation_notes:
  risk_flags:
  - risk: “I was told” recasts the abrupt Greek participle as a passive clause.
    mitigation: It keeps the speaker unidentified and clearly connects the command to John.
  - risk: “Temple” may suggest the entire temple complex.
    mitigation: The footnote preserves the possible narrower sense “sanctuary.”
