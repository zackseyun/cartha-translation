translation:
  language: en
  text: God’s temple in heaven was opened,[a] and the ark of his covenant was seen inside it. There were flashes of lightning, voices,[b] crashing thunder, an earthquake, and a severe hailstorm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “sanctuary,” referring more specifically to the inner holy dwelling.
    reason: lexical_alternative
  - marker: b
    text: Or “sounds” or “rumblings”; Revelation repeatedly uses “voices” in scenes of God’s majesty and judgment.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the temple of God in heaven
  simplified_phrase: God’s temple in heaven
  preserved_meaning: The temple belongs to God and is located in heaven.
  reasoning_layer_used: Lexical decisions for ναός and ὁ ἐν τῷ οὐρανῷ
  rationale: The possessive form is more direct while preserving the location and ownership.
- pob_phrase: the ark of his covenant was seen in his temple
  simplified_phrase: the ark of his covenant was seen inside it
  preserved_meaning: The ark was actually seen within God’s heavenly temple.
  reasoning_layer_used: Lexical decisions for ὤφθη and ἐν τῷ ναῷ αὐτοῦ
  rationale: This keeps the reported passive event and avoids an awkward repetition of “temple.”
- pob_phrase: peals of thunder and an earthquake and great hail
  simplified_phrase: crashing thunder, an earthquake, and a severe hailstorm
  preserved_meaning: Thunder, an earthquake, and powerful hail accompanied the vision.
  reasoning_layer_used: Lexical decisions for βρονταί, σεισμός, and χάλαζα μεγάλη
  rationale: These concrete modern expressions preserve the scene’s dramatic force.
translation_notes:
  risk_flags:
  - risk: “Inside it” does not repeat that the temple belongs to God.
    mitigation: The immediately preceding words “God’s temple” make the reference clear.
  - risk: Readers may understand “voices” only as spoken speech.
    mitigation: The footnote preserves the possible senses “sounds” and “rumblings.”
