translation:
  language: en
  text: Their body[a] lies dead in the street of the great city[c]. Spiritually,[b] this city is called Sodom and Egypt. It is also where their Lord was crucified.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek says “body” in the singular, treating the two witnesses as a unit; it may also be rendered “their dead bodies.”
    reason: alternative_reading
  - marker: b
    text: Or “Figuratively.”
    reason: lexical_alternative
  - marker: c
    text: The words “where their Lord was crucified” point to Jerusalem, though the symbolic title is retained.
    reason: cross_reference
simplification_decisions:
- pob_phrase: their dead body lies
  simplified_phrase: their body lies dead
  preserved_meaning: The witnesses are dead, and the singular body presents them as a unit.
  reasoning_layer_used: Lexical and theological decisions on πτῶμα
  rationale: The recast is more natural English while preserving the corporate singular.
- pob_phrase: which is spiritually called Sodom and Egypt
  simplified_phrase: Spiritually, this city is called Sodom and Egypt.
  preserved_meaning: The names symbolically characterize the great city without replacing its identity.
  reasoning_layer_used: Lexical decision on πνευματικῶς and theological decision on symbolic naming
  rationale: A separate sentence makes the symbolic naming easier to follow.
- pob_phrase: where also their Lord was crucified
  simplified_phrase: It is also where their Lord was crucified.
  preserved_meaning: The great city is the place where the witnesses’ Lord was crucified.
  reasoning_layer_used: Lexical decisions on ὅπου καί, κύριος, and σταυρόω
  rationale: An explicit pronoun clarifies the connection to the city.
translation_notes:
