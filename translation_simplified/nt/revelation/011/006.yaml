translation:
  language: en
  text: They have authority to shut the sky[a] so that no rain falls while they are prophesying. They also have authority over the waters to turn them into blood and to strike the earth with every kind of plague as often as they wish.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “shut heaven.” The Greek word can mean either “sky” or “heaven”; “sky” fits the reference to rain.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: These have the authority
  simplified_phrase: They have authority
  preserved_meaning: The witnesses possess granted authority, not merely ability.
  reasoning_layer_used: Lexical decision for οὗτοι and ἐξουσίαν
  rationale: The pronoun gives natural English while the context supplies its referent.
- pob_phrase: during the days of their prophecy
  simplified_phrase: while they are prophesying
  preserved_meaning: Rain is withheld throughout their period of prophetic witness.
  reasoning_layer_used: Lexical decision for τὰς ἡμέρας τῆς προφητείας αὐτῶν
  rationale: The verbal form expresses the same time period more plainly.
- pob_phrase: to strike the earth with every plague
  simplified_phrase: to strike the earth with every kind of plague
  preserved_meaning: They may afflict the earth repeatedly with plagues of every sort.
  reasoning_layer_used: Restored lexical decision for ἐν πάσῃ πληγῇ
  rationale: “Every kind” makes the distributive sense clear without suggesting a fixed list.
translation_notes:
  risk_flags:
  - risk: The actions may be read as only literal or only symbolic.
    mitigation: The wording preserves the apocalyptic acts directly without deciding how they are fulfilled.
