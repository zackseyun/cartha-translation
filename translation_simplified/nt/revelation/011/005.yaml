simplification_decisions:
- pob_phrase: And if anyone wants to harm them
  simplified_phrase: If anyone wants to harm them
  preserved_meaning: The condition still concerns anyone who intends hostile action against the two witnesses.
  reasoning_layer_used: Lexical decision for ἀδικῆσαι and modern sentence structure
  rationale: Removing the opening “And” gives the warning a more direct beginning without changing its connection or force.
- pob_phrase: and if anyone should want to harm them, in this way he must be killed
  simplified_phrase: Anyone who wants to harm them must be killed in this way
  preserved_meaning: The repeated warning still presents death by the described fire as necessary for anyone seeking to harm them.
  reasoning_layer_used: Lexical decisions for θελήσῃ, οὕτως, δεῖ, and ἀποκτανθῆναι
  rationale: A direct second sentence removes the awkward conditional wording while keeping the repetition, necessity, and manner of death.
- pob_phrase: fire comes out of their mouth and devours their enemies
  simplified_phrase: fire comes out of their mouth and devours their enemies
  preserved_meaning: The vivid fire-from-the-mouth image and its destructive force remain uninterpreted.
  reasoning_layer_used: Theological decision to preserve the apocalyptic image
  rationale: The wording is retained because replacing the image with an explanation would resolve an ambiguity the POB deliberately preserves.
