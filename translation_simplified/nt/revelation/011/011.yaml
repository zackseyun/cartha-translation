translation:
  language: en
  text: After the three and a half days, a breath of life from God entered them. They stood on their feet, and great fear came over the people watching them.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “A breath of life from God” may also be translated “a spirit of life from God” or, possibly, “the Spirit of life from God.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: And after the three and a half days
  simplified_phrase: After the three and a half days
  preserved_meaning: The event happened after the specific three-and-a-half-day period.
  reasoning_layer_used: Lexical decision for μετὰ τὰς τρεῖς ἡμέρας καὶ ἥμισυ.
  rationale: Removing the opening “And” gives a cleaner modern sentence without changing the timing.
- pob_phrase: a breath of life from God entered into them
  simplified_phrase: a breath of life from God entered them
  preserved_meaning: God was the source of the life-giving breath that went inside them.
  reasoning_layer_used: Lexical decisions for πνεῦμα ζωῆς, ἐκ τοῦ θεοῦ, and εἰσῆλθεν ἐν αὐτοῖς.
  rationale: The shorter verb phrase is natural English and still conveys internal entry.
- pob_phrase: great fear fell on those watching them
  simplified_phrase: great fear came over the people watching them
  preserved_meaning: The witnesses were suddenly overcome by intense fear.
  reasoning_layer_used: Lexical decisions for φόβος μέγας, ἐπέπεσεν ἐπὶ, and τοὺς θεωροῦντας αὐτούς.
  rationale: “Came over” is a familiar English idiom that preserves the fear’s force.
