translation:
  language: en
  text: When they finish giving their testimony, the beast that comes up out of the abyss will go to war with them. It will conquer them and kill them.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: finish their testimony
  simplified_phrase: finish giving their testimony
  preserved_meaning: They complete their work of bearing witness.
  reasoning_layer_used: Lexical decision for τελέσωσιν and μαρτυρίαν
  rationale: Adding “giving” makes the action natural in common English without changing its witness-bearing sense.
- pob_phrase: will make war with them
  simplified_phrase: will go to war with them
  preserved_meaning: The beast begins hostile conflict with the witnesses.
  reasoning_layer_used: Lexical and theological decision for ποιήσει μετ’ αὐτῶν πόλεμον
  rationale: “Go to war with” is clearer English while retaining the source-driven “with them.”
- pob_phrase: and conquer them and kill them
  simplified_phrase: It will conquer them and kill them.
  preserved_meaning: The beast overcomes the witnesses and then kills them.
  reasoning_layer_used: Lexical decisions for νικήσει and ἀποκτενεῖ
  rationale: A new sentence clarifies the sequence while preserving both distinct actions.
translation_notes:
  risk_flags:
  - risk: “Abyss” may be unfamiliar to new readers.
    mitigation: It is retained because it is a key apocalyptic term and avoids the more interpretive “bottomless pit.”
