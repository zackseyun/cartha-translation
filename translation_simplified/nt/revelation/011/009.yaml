translation:
  language: en
  text: For three and a half days, some people from different peoples, tribes, languages, and nations look at their dead body.[a] They do not allow their bodies to be placed in a tomb.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Greek first says “their dead body” in the singular, then “their bodies” in the plural. The singular may present the two witnesses as one united witness.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And some from the peoples and tribes and languages and nations look at their dead body for three and a half days
