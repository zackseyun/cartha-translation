  preserved_meaning: Only some people from these groups look at the body throughout the stated period.
  reasoning_layer_used: POB lexical decisions for the partitive construction, group list, duration, and visual action
  rationale: Moving the time phrase first and adding “people” makes the sentence easier to follow without changing its scope.
- pob_phrase: and they do not allow their bodies to be laid in a tomb
  simplified_phrase: They do not allow their bodies to be placed in a tomb.
  preserved_meaning: The observers prevent the witnesses’ bodies from being put in a burial place.
  reasoning_layer_used: POB lexical decisions for ἀφίουσιν and μνῆμα
  rationale: A new sentence and “placed” express the burial action in direct modern English.
