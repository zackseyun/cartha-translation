  rationale: “Live” is more familiar than “dwell,” while the footnote preserves the phrase’s recurring theological force.
- pob_phrase: rejoice over them and celebrate
  simplified_phrase: rejoice at their deaths and celebrate
  preserved_meaning: The people respond to the two prophets’ deaths with both gladness and festive celebration.
  reasoning_layer_used: lexical rationale and immediate context
  rationale: Naming the deaths makes the object of their rejoicing clear without merging the two distinct verbs.
- pob_phrase: because these two prophets tormented those who dwell on the earth
  simplified_phrase: because these two prophets tormented the people who live on the earth
  preserved_meaning: The prophets caused severe distress to the same earth-dwelling group.
  reasoning_layer_used: lexical and theological decisions
  rationale: The rewrite uses ordinary word order while retaining the strong verb “tormented” and the repeated group description.
