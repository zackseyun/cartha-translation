translation:
  language: en
  text: They said, “Lord God Almighty, you are the one who is and who was.[a] We give thanks to you because you have taken up your great power and begun to reign.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some manuscripts and translations elsewhere in Revelation add “and who is to come,” but the Greek text here does not include that phrase.
    reason: textual_variant
  - marker: b
    text: Or “have reigned” or “have become King.” Here the wording likely points to God openly displaying his royal rule.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: saying
  simplified_phrase: They said
  preserved_meaning: The elders from the previous verse introduce their words of worship.
  reasoning_layer_used: lexical decision for λέγοντες and immediate context
  rationale: A complete clause is easier for modern readers than a dangling participle.
- pob_phrase: who is and who was
  simplified_phrase: you are the one who is and who was
  preserved_meaning: The shortened divine designation retains both present and past forms without adding “who is to come.”
  reasoning_layer_used: lexical and theological decisions for ὁ ὢν καὶ ὁ ἦν
  rationale: Direct address makes the title sequence easier to follow while preserving its deliberate shorter form.
- pob_phrase: you have taken your great power
  simplified_phrase: you have taken up your great power
  preserved_meaning: God has decisively assumed the exercise of his own great power.
  reasoning_layer_used: lexical decision for εἴληφας and theological decision for ἐβασίλευσας
  rationale: “Taken up” clarifies active exercise without weakening the source image of taking.
translation_notes:
  risk_flags:
  - risk: “Taken up” may sound as though God previously lacked power.
    mitigation: The wording still says “your” power, and “begun to reign” follows POB’s distinction between sovereignty and its public manifestation.
