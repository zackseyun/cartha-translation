translation:
  language: en
  text: Flashes of lightning, sounds, and peals of thunder come from the throne.[a] Seven fiery lamps burn in front of the throne.[b] These are the seven spirits of God.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “voices” instead of “sounds.”
    reason: lexical_alternative
  - marker: b
    text: Or “seven burning torches of fire.”
    reason: lexical_alternative
  - marker: c
    text: Many understand “the seven spirits of God” as a symbol of the fullness of the one Holy Spirit, but the Greek text says “seven spirits.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: And from the throne come flashes of lightning and sounds and peals of thunder
  simplified_phrase: Flashes of lightning, sounds, and peals of thunder come from the throne.
  preserved_meaning: Repeated storm-like signs issue from the throne.
  reasoning_layer_used: Lexical decisions for ἐκπορεύονται, ἀστραπαί, φωναί, and βρονταί
  rationale: Ordinary English word order makes the vivid three-part scene easier to follow.
- pob_phrase: before the throne were seven lamps of fire burning
  simplified_phrase: Seven fiery lamps burn in front of the throne.
  preserved_meaning: Seven fire-bearing lamps are continually burning at the throne.
  reasoning_layer_used: Lexical decisions for λαμπάδες πυρός, καιόμεναι, and ἐνώπιον
  rationale: The active sentence removes the awkward construction while preserving the fire image and location.
- pob_phrase: which are the seven spirits of God
  simplified_phrase: These are the seven spirits of God.
  preserved_meaning: The lamps are symbolically identified with the seven spirits of God.
  reasoning_layer_used: Lexical and theological decisions for ἅ εἰσιν and τὰ ἑπτὰ πνεύματα τοῦ θεοῦ
  rationale: A new sentence clarifies the symbolic identification without interpreting the plural.
