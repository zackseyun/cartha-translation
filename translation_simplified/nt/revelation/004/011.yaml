  preserved_meaning: The three distinct qualities ascribed to God remain intact.
  reasoning_layer_used: POB lexical decisions for δόξα, τιμή, and δύναμις
  rationale: Removing repeated articles makes the list natural in modern English without weakening its worshipful force.
- pob_phrase: you created all things
  simplified_phrase: you created everything
  preserved_meaning: God created the whole of creation.
  reasoning_layer_used: POB lexical decision for ἔκτισας τὰ πάντα
  rationale: “Everything” communicates the same comprehensive scope more directly.
- pob_phrase: and because of your will they existed and were created
  simplified_phrase: Because of your will, all things existed and were created.
  preserved_meaning: God’s will is the reason for both their existence and their creation, and the two verbs remain distinct.
  reasoning_layer_used: POB lexical and theological decisions for διὰ τὸ θέλημά σου and ἦσαν καὶ ἐκτίσθησαν
  rationale: A new sentence clarifies the causal statement while preserving both actions.
