translation:
  language: en
  text: 'Each of the four living creatures has six wings. They are full of eyes all around, both outside and inside. They never rest, day or night, as they say:


    “Holy, holy, holy

    is the Lord God, the Almighty,

    who was, who is, and who is coming.”[a]'
