simplification_decisions:
- pob_phrase: the four living creatures, each one of them having six wings
  simplified_phrase: Each of the four living creatures has six wings
  preserved_meaning: Every individual heavenly creature has six wings.
  reasoning_layer_used: Lexical decisions for ζῷα, ἓν καθ’ ἓν αὐτῶν, and ἔχων ἀνὰ πτέρυγας ἕξ
  rationale: A direct sentence replaces the dense participial construction while preserving the distributive emphasis.
- pob_phrase: are full of eyes all around and within
  simplified_phrase: They are full of eyes all around, both outside and inside
  preserved_meaning: The creatures have eyes covering both external and internal dimensions.
  reasoning_layer_used: Lexical decisions for κυκλόθεν καὶ ἔσωθεν and γέμουσιν ὀφθαλμῶν
  rationale: “Outside and inside” makes the two spatial dimensions immediately clear without weakening the image.
- pob_phrase: they have no rest day and night, saying
  simplified_phrase: They never rest, day or night, as they say
  preserved_meaning: Their worship continues without rest at any time.
  reasoning_layer_used: Lexical decisions for ἀνάπαυσιν οὐκ ἔχουσιν, ἡμέρας καὶ νυκτός, and λέγοντες
  rationale: The clause is recast in ordinary English without reducing lack of rest to mere verbal repetition.
