simplification_decisions:
- pob_phrase: Immediately I was in the Spirit
  simplified_phrase: At once I found myself in the Spirit
  preserved_meaning: John suddenly entered a prophetic, visionary state associated with the Spirit.
  reasoning_layer_used: Lexical and theological decisions for εὐθέως, ἐγενόμην, and ἐν πνεύματι
  rationale: “Found myself” naturally conveys entry into the state rather than merely remaining in it.
- pob_phrase: and behold, a throne stood in heaven
  simplified_phrase: There before me, a throne stood in heaven
  preserved_meaning: John’s attention is suddenly drawn to a throne established in heaven.
  reasoning_layer_used: Lexical decisions for ἰδοὺ, θρόνος, ἔκειτο, and ἐν τῷ οὐρανῷ
  rationale: “There before me” preserves the attention-drawing force of “behold” in common English.
- pob_phrase: and one seated on the throne
  simplified_phrase: with someone seated on it
  preserved_meaning: The throne has an occupant whose identity is not specified here.
  reasoning_layer_used: Lexical decision for καθήμενος
  rationale: “Someone seated on it” completes the image clearly without identifying the occupant.
translation_notes:
  risk_flags:
  - risk: Capitalizing “Spirit” may favor the Holy Spirit over a general visionary state.
    mitigation: The footnote preserves “in spirit” and explains the Greek ambiguity.
