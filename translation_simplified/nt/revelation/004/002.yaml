translation:
  language: en
  text: At once I found myself in the Spirit.[a] There before me, a throne stood in heaven, with someone seated on it.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “in spirit.” The Greek may refer either to the Holy Spirit or to a spiritual, visionary state.
