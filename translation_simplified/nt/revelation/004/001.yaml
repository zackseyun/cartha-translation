translation:
  language: en
  text: After these things, I looked and saw a door standing open in heaven. The voice I had heard at first spoke to me, sounding like a trumpet. It said, “Come up here, and I will show you what must take place after these things.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: I looked, and behold
  simplified_phrase: I looked and saw
  preserved_meaning: John’s attention is drawn to what appears in the vision.
  reasoning_layer_used: POB lexical decisions for εἶδον and ἰδοὺ
  rationale: The direct wording conveys visual attention without the uncommon discourse marker “behold.”
- pob_phrase: the first voice that I had heard, like a trumpet speaking with me, said
  simplified_phrase: The voice I had heard at first spoke to me, sounding like a trumpet. It said
  preserved_meaning: The earlier voice addresses John and has a trumpet-like sound.
  reasoning_layer_used: POB lexical decisions and revision rationale
  rationale: Two sentences remove the tangled modifier while keeping the comparison attached to the voice.
- pob_phrase: After these things ... after these things
  simplified_phrase: After these things ... after these things
  preserved_meaning: The verse marks temporal sequence without defining its end-times significance.
  reasoning_layer_used: POB theological decision on repeated μετὰ ταῦτα
  rationale: The deliberate repetition remains because simplifying it could erase the source’s temporal emphasis.
translation_notes:
  risk_flags:
  - risk: “I looked and saw” expresses the effect of “behold” rather than retaining its elevated tone.
    mitigation: The wording still marks John’s focused visual attention and keeps the visionary setting clear.
