translation:
  language: en
  text: The first one blew his trumpet. Then hail and fire mixed with blood came, and it was thrown onto the earth.[a] A third of the earth and a third of the trees were burned up. All the green grass was also burned up.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “land”; the Greek word can mean either, but the wider context favors “earth” here.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And the first sounded his trumpet
  simplified_phrase: The first one blew his trumpet
  preserved_meaning: The first in the ordered group sounded the trumpet without explicitly adding “angel.”
  reasoning_layer_used: Lexical decision for ὁ πρῶτος and ἐσάλπισεν
  rationale: “The first one” makes the ellipsis natural, while “blew” is common English for sounding a trumpet.
- pob_phrase: and there came hail and fire mixed with blood, and it was thrown onto the earth
  simplified_phrase: Then hail and fire mixed with blood came, and it was thrown onto the earth
  preserved_meaning: The vivid elements arrive as one collective phenomenon and are cast onto the earth.
  reasoning_layer_used: Lexical decisions for ἐγένετο, μεμιγμένα ἐν αἵματι, and ἐβλήθη
  rationale: Ordinary narrative order clarifies the event while retaining the singular collective action and apocalyptic image.
- pob_phrase: a third of the earth was burned up, and a third of the trees was burned up
  simplified_phrase: A third of the earth and a third of the trees were burned up
  preserved_meaning: Exactly one-third of each distinct object is consumed by fire.
  reasoning_layer_used: Lexical decisions for the partitive expressions and κατεκάη
  rationale: Combining the repeated clauses reduces heaviness without merging the two measured losses.
translation_notes:
  risk_flags:
  - risk: “The first one” still depends on the preceding context to identify the trumpet-bearing angel.
    mitigation: This preserves POB’s decision not to add the unexpressed noun “angel.”
  - risk: Combining the two one-third clauses reduces the source’s rhetorical repetition.
    mitigation: Both separate proportions and the force of “burned up” remain explicit.
