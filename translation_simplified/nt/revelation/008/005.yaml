translation:
  language: en
  text: Then the angel took the incense burner. He filled it with fire from the altar and threw it onto the earth. Thunderclaps, sounds,[a] flashes of lightning, and an earthquake followed.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “voices.” The Greek word can mean either voices or other sounds here.
    reason: lexical_alternative
