simplification_decisions:
- pob_phrase: a third of the creatures in the sea
  simplified_phrase: one-third of the sea creatures
  preserved_meaning: The same proportion of animate creatures in the sea died.
  reasoning_layer_used: lexical decisions for κτισμάτων and τὸ τρίτον
  rationale: The compact phrase keeps both the quantity and the sea-creature referent clear.
- pob_phrase: the ones that have living souls
  simplified_phrase: those that had life
  preserved_meaning: The phrase identifies the creatures as animate without making a technical claim about animal souls.
  reasoning_layer_used: lexical and theological decisions for ψυχάς
  rationale: The contextual alternative is clearer in modern English, while the footnote preserves the source term.
- pob_phrase: died, and a third of the ships were destroyed
  simplified_phrase: died. One-third of the ships were destroyed.
  preserved_meaning: The deaths of sea creatures and the destruction of ships remain distinct paired consequences.
  reasoning_layer_used: discourse structure and lexical decisions for ἀπέθανε and διεφθάρησαν
  rationale: Two short sentences make the two results easier to follow without adding a connective.
translation_notes:
