translation:
  language: en
  text: Then another angel came and stood at the altar. He held a golden incense burner. He was given a large amount of incense to offer on the golden altar before the throne, together with[a] the prayers of all God’s holy people.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “to the prayers”; here the incense accompanies or is added to their prayers.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: holding a golden censer
  simplified_phrase: He held a golden incense burner.
  preserved_meaning: The angel holds a gold vessel used for burning incense.
  reasoning_layer_used: POB lexical decision for λιβανωτὸν χρυσοῦν
  rationale: “Incense burner” explains the less familiar word “censer” without changing the object.
- pob_phrase: much incense was given to him
  simplified_phrase: He was given a large amount of incense
  preserved_meaning: The passive action and substantial quantity of incense remain explicit.
  reasoning_layer_used: POB lexical decision for ἐδόθη αὐτῷ θυμιάματα πολλὰ
  rationale: “A large amount” is more natural modern English than “much” in this sentence.
- pob_phrase: all the saints
  simplified_phrase: all God’s holy people
  preserved_meaning: The phrase refers to all people consecrated to God, not only specially recognized individuals.
  reasoning_layer_used: POB lexical rationale for ἅγιοι
  rationale: The clearer equivalent prevents modern readers from misunderstanding “saints” as a select class.
translation_notes:
