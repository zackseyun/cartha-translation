translation:
  language: en
  text: Then I saw and heard an eagle[a] flying high overhead.[b] It cried out in a loud voice, “Woe! Woe! Woe to those who live on the earth because of the trumpet blasts still to come from the three angels who are about to sound their trumpets!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some manuscripts read “one angel” instead of “one eagle.”
    reason: textual_variant
  - marker: b
    text: The Greek term refers to the open sky at its highest point; it may also be translated “in midair.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: flying in midheaven
  simplified_phrase: flying high overhead
  preserved_meaning: The eagle flies in the open sky at its highest point.
  reasoning_layer_used: POB lexical decision for μεσουρανήματι
  rationale: This replaces an unfamiliar term while preserving the elevated sky image.
- pob_phrase: saying with a loud voice
  simplified_phrase: It cried out in a loud voice
  preserved_meaning: The eagle makes a forceful public proclamation.
  reasoning_layer_used: POB lexical decision for φωνῇ μεγάλῃ
  rationale: A direct sentence sounds natural and keeps the proclamation's force.
- pob_phrase: because of the remaining trumpet-blasts of the three angels who are about to sound
  simplified_phrase: because of the trumpet blasts still to come from the three angels who are about to sound their trumpets
  preserved_meaning: Three imminent trumpet blasts will bring the announced woes.
  reasoning_layer_used: POB lexical decisions for ἐκ, λοιπῶν, and μέλλω
  rationale: The recast clause makes the cause and imminence easier to follow.
translation_notes:
  risk_flags:
