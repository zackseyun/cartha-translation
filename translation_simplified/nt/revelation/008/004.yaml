translation:
  language: en
  text: The smoke from the incense rose from the angel’s hand into the presence of God, together with the prayers of the saints.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Saints” means God’s holy people.
    reason: simplification_note
  - marker: b
    text: The incense-smoke is associated with the prayers here, but the verse does not say they are identical.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: the smoke of the incense went up
  simplified_phrase: the smoke from the incense rose
  preserved_meaning: The concrete image of incense-smoke moving upward remains intact.
  reasoning_layer_used: Lexical decisions for ἀνέβη, καπνὸς, and θυμιαμάτων
  rationale: “Rose” expresses the upward movement in more direct natural English.
- pob_phrase: from the hand of the angel
  simplified_phrase: from the angel’s hand
  preserved_meaning: The vision still presents the smoke as rising from what the angel holds.
  reasoning_layer_used: Lexical decision for ἐκ χειρὸς τοῦ ἀγγέλου
  rationale: The possessive form is easier to read without weakening the image.
- pob_phrase: before God
  simplified_phrase: into the presence of God
  preserved_meaning: The smoke and prayers rise to where God is present.
  reasoning_layer_used: Lexical decision for ἐνώπιον τοῦ θεοῦ
  rationale: “In the presence of God” makes the sense of “before God” immediately clear.
translation_notes:
  risk_flags:
  - risk: “Together with” could be read as identifying the incense-smoke with the prayers.
    mitigation: Footnote b preserves the POB’s deliberate ambiguity by stating only an association.
  - risk: Modern readers may understand “saints” as only specially canonized individuals.
    mitigation: Footnote a identifies the term broadly as God’s holy people.
