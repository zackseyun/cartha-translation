translation:
  language: en
  text: Then the third angel blew his trumpet. A great star[b] fell from heaven[a], blazing like a torch. It fell on one-third of the rivers and on the springs of water.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “from the sky.” The Greek word can mean heaven or sky; “heaven” fits the setting of this vision.
    reason: lexical_alternative
  - marker: b
    text: The vision does not explain here what the “star” represents; it may be understood as an angelic being, a meteor-like object, or a symbolic power.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: And the third angel sounded his trumpet
  simplified_phrase: Then the third angel blew his trumpet
  preserved_meaning: The third angel causes the trumpet to sound in the sequence of the vision.
  reasoning_layer_used: Lexical decision for ἐσάλπισεν
  rationale: “Blew his trumpet” is direct, common English for the same action.
- pob_phrase: burning like a torch
  simplified_phrase: blazing like a torch
  preserved_meaning: The star appears intensely on fire while retaining the torch simile.
  reasoning_layer_used: Lexical decision for καιόμενος ὡς λαμπάς
  rationale: “Blazing” makes the fiery visual image immediate without changing the comparison.
- pob_phrase: a third of the rivers and on the springs of the waters
  simplified_phrase: one-third of the rivers and on the springs of water
  preserved_meaning: The impact reaches one-third of the rivers as well as water springs.
  reasoning_layer_used: Lexical decisions for τὸ τρίτον and πηγὰς τῶν ὑδάτων
  rationale: The revised wording states the proportion clearly and removes an unnatural English construction.
