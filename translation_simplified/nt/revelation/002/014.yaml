translation:
  language: en
  text: But I have a few things against you. There are some among you who follow Balaam’s teaching. Balaam taught Balak to put a stumbling block in the path of the sons of Israel,[a] enticing them to eat food sacrificed to idols and to commit sexual immorality.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek expression “sons of Israel” can also be translated “children of Israel” or “Israelites.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: you have there some who hold to the teaching of Balaam
  simplified_phrase: There are some among you who follow Balaam’s teaching
  preserved_meaning: Some people among the addressed church continue to adhere to Balaam’s teaching.
  reasoning_layer_used: The lexical decision for κρατοῦντας identifies adherence to a teaching rather than physical holding.
  rationale: This states the relationship naturally while preserving their continuing allegiance.
- pob_phrase: who taught Balak
  simplified_phrase: Balaam taught Balak
  preserved_meaning: Balaam instructed Balak in how to lead Israel into sin.
  reasoning_layer_used: The POB translation and revision record support the natural past-tense rendering “taught.”
  rationale: Repeating Balaam’s name makes the instructor unmistakable.
- pob_phrase: to put a stumbling block before the sons of Israel
  simplified_phrase: to put a stumbling block in the path of the sons of Israel
  preserved_meaning: Balak was taught to entice the sons of Israel toward moral and spiritual ruin.
  reasoning_layer_used: The theological decision requires preserving the stumbling-block metaphor.
  rationale: “In the path” makes the image easier to picture without replacing it.
interpretive_expansions:
- pob_phrase: to eat food sacrificed to idols and to commit sexual immorality
  rendering: enticing them to eat food sacrificed to idols and to commit sexual immorality
  claim: The two acts describe the wrongdoing toward which the stumbling block drew Israel.
  evidence:
  - The Greek infinitives follow the stumbling-block clause and identify the intended or resulting misconduct.
  - The POB rationale describes the image as enticement into sin.
  confidence: high
  alternatives_preserved:
  - The wording allows both intended enticement and resulting misconduct.
translation_notes:
  risk_flags:
  - risk: “Enticing them” makes the moral function of the stumbling block explicit.
    mitigation: It preserves both distinct acts without limiting the connection to completed results.
