translation:
  language: en
  text: I know how you are suffering and how poor you are. Yet you are rich. I also know the slander[a] that comes from those who say they are Jews but are not. They are a synagogue of Satan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “blasphemy”; here the word means hostile, defamatory speech against the believers.
    reason: lexical_alternative
  - marker: b
    text: “Synagogue” can also mean an assembly or gathering; the phrase is retained literally.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: your affliction and your poverty
  simplified_phrase: how you are suffering and how poor you are
  preserved_meaning: The believers are enduring hardship while living in material poverty.
  reasoning_layer_used: POB lexical decisions for θλῖψις and πτωχεία
  rationale: Concrete verbal phrasing makes both conditions immediately clear without increasing their severity.
- pob_phrase: but you are rich
  simplified_phrase: Yet you are rich.
  preserved_meaning: Their poverty stands in sharp paradoxical contrast to another kind of richness left unstated.
  reasoning_layer_used: POB theological decision on πλούσιος
  rationale: A separate short sentence highlights the contrast while preserving the Greek's deliberate lack of qualification.
- pob_phrase: the slander of those who say that they are Jews and are not, but are a synagogue of Satan
  simplified_phrase: the slander that comes from those who say they are Jews but are not. They are a synagogue of Satan.
  preserved_meaning: The hostile speech comes from people whose stated Jewish identity is denied in the verse's polemical sense, and they are starkly characterized as Satan's synagogue.
  reasoning_layer_used: POB lexical and theological decisions on βλασφημία, ἐκ τῶν λεγόντων, Ἰουδαίους, and συναγωγὴ τοῦ Σατανᾶ
  rationale: Breaking the clause into two sentences clarifies the source of the slander while retaining the exact theological tension and image.
translation_notes:
  risk_flags:
  - risk: Modern readers may take “you are rich” as material wealth.
    mitigation: The wording remains unqualified because POB intentionally preserves the source text's implied contrast.
  - risk: The denial concerning those who say they are Jews may be misread as an ethnic denial or generalized against Jewish people.
    mitigation: The translation neither adds ethnic claims nor broadens the verse beyond the specific opponents addressed.
