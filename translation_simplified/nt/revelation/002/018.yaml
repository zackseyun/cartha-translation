  preserved_meaning: The command addresses the angel associated with the Thyatira church.
  reasoning_layer_used: Lexical decisions for ἀγγέλῳ and ἐκκλησίας
  rationale: Ordinary English word order makes the command immediately clear while retaining “angel” and “church.”
- pob_phrase: These things says the Son of God
  simplified_phrase: This is what the Son of God says
  preserved_meaning: The Son of God formally introduces his message.
  reasoning_layer_used: Lexical and theological decisions for Τάδε and ὁ υἱὸς τοῦ θεοῦ
  rationale: The smoother formula preserves the speaker’s full christological title.
- pob_phrase: the one who has his eyes like a flame of fire, and his feet like burnished bronze
  simplified_phrase: the one whose eyes are like blazing fire and whose feet are like burnished bronze
