translation:
  language: en
  text: 'Do not be afraid of the suffering that will soon come upon you. Pay attention: the devil will soon throw some of you into prison so that you may be tested.[a] You will face severe suffering for ten days. Remain faithful until death,[b] and I will give you the crown of life.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word can also mean “tempted” or “tried.”
    reason: lexical_alternative
  - marker: b
    text: “Until death” can also mean “even to the point of death,” including death for remaining faithful.
    reason: alternative_reading
  - marker: c
    text: This crown is a victor’s wreath or prize, not a royal crown.
    reason: cultural_note
simplification_decisions:
- pob_phrase: what you are about to suffer
  simplified_phrase: the suffering that will soon come upon you
  preserved_meaning: Suffering is imminent and will affect the hearers.
  reasoning_layer_used: Lexical decision for μέλλω + πάσχειν
  rationale: This wording expresses the coming suffering in natural English.
- pob_phrase: Look
  simplified_phrase: Pay attention
  preserved_meaning: Jesus calls special attention to the warning that follows.
  reasoning_layer_used: Lexical decision for ἰδού
  rationale: This directly conveys the particle’s attention-drawing function.
- pob_phrase: you will have tribulation
  simplified_phrase: You will face severe suffering
  preserved_meaning: The believers will endure weighty, oppressive suffering.
  reasoning_layer_used: Lexical decision for θλῖψις
  rationale: This makes the force of “tribulation” immediately understandable.
interpretive_expansions:
- pob_phrase: tribulation
  rendering: severe suffering
  claim: The coming suffering will be serious and oppressive, not ordinary trouble.
  evidence:
  - The lexical rationale describes θλῖψις as weighty, oppressive suffering.
  - The immediate context includes imprisonment and tested faithfulness.
  confidence: high
  alternatives_preserved:
  - tribulation
  - affliction
  - distress
translation_notes:
  risk_flags:
  - risk: Replacing “tribulation” may reduce its established resonance in Revelation.
    mitigation: “Severe suffering” preserves its weight in immediately clear language.
  - risk: “Until death” may be read only as lifelong faithfulness rather than possible martyrdom.
    mitigation: Footnote b preserves the possible sense “even to the point of death.”
