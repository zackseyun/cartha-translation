simplification_decisions:
- pob_phrase: To the angel of the church in Ephesus write
  simplified_phrase: Write this to the angel of the church in Ephesus
  preserved_meaning: John is commanded to address the church’s angel, though the referent may be a messenger.
  reasoning_layer_used: Lexical and theological decisions for ἀγγέλῳ and γράψον.
  rationale: Ordinary English word order makes the command immediately clear while retaining “angel” and its footnoted alternative.
- pob_phrase: These things says the one who holds
  simplified_phrase: This is what the one who holds ... says
  preserved_meaning: The words introduce a solemn declaration from the one who firmly possesses the stars.
  reasoning_layer_used: Lexical decision for Τάδε λέγει and κρατῶν.
  rationale: The smoother formula is easier to read without weakening the prophetic introduction or the sense of control.
- pob_phrase: the seven golden lampstands
  simplified_phrase: the seven gold lampstands
  preserved_meaning: The concrete image remains seven lampstands made of gold.
  reasoning_layer_used: Lexical decisions for λυχνιῶν and χρυσῶν.
  rationale: “Gold lampstands” is common modern English and preserves the object and material.
translation_notes:
  risk_flags:
  - risk: Readers may assume “angel” can only mean a heavenly being.
    mitigation: The anchored footnote preserves the debated alternative “messenger.”
