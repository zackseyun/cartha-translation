translation:
  language: en
  text: I know where you live. It is where Satan’s throne is. Yet you hold firmly to my name. You did not deny your faith in me,[a] even during the time when Antipas—my witness[b] and my faithful one—was killed among you, where Satan lives.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also mean “my faith” or “my faithfulness.”
    reason: alternative_reading
  - marker: b
    text: The Greek word for “witness” can also carry the sense “martyr” here.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: I know where you live—where Satan’s throne is
  simplified_phrase: I know where you live. It is where Satan’s throne is.
  preserved_meaning: Jesus knows they live where Satan’s throne is located.
  reasoning_layer_used: POB lexical decisions for κατοικεῖς and the throne image
  rationale: Two short sentences clarify the relationship while preserving the apocalyptic image.
- pob_phrase: you hold fast my name
  simplified_phrase: you hold firmly to my name
  preserved_meaning: They remain steadfastly loyal to Jesus’ name.
  reasoning_layer_used: POB lexical decisions for κρατεῖς and τὸ ὄνομά μου
  rationale: “Hold firmly” is common English and preserves the image of a strong grip.
- pob_phrase: even in the days of Antipas ... who was killed among you
  simplified_phrase: even during the time when Antipas ... was killed among you
  preserved_meaning: They did not deny faith during the period marked by Antipas’s death among them.
  reasoning_layer_used: POB lexical decisions for the temporal phrase and παρ’ ὑμῖν
  rationale: The recast clarifies the timing without suggesting that the church killed Antipas.
interpretive_expansions:
- pob_phrase: you did not deny faith in me
  rendering: You did not deny your faith in me
  claim: The faith being confessed belongs to the addressed believers.
  evidence:
