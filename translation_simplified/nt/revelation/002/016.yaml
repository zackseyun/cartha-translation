translation:
  language: en
  text: So repent. If you do not repent, I am coming to you quickly, and I will make war against them[a] with the sword of my mouth.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek expression can literally mean “with them,” but here it means “against them.”
    reason: lexical_alternative
