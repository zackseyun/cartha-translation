simplification_decisions:
- pob_phrase: Therefore repent
  simplified_phrase: So repent
  preserved_meaning: Christ draws a direct conclusion from the preceding rebuke and commands decisive repentance.
  reasoning_layer_used: lexical decision for οὖν and μετανόησον
  rationale: “So” states the logical connection in more common English while retaining the command to repent.
- pob_phrase: But if not
  simplified_phrase: If you do not repent
  preserved_meaning: The warning applies if the church fails to obey the command to repent.
  reasoning_layer_used: lexical decision for εἰ δὲ μή and immediate context
  rationale: Repeating “repent” makes the implied condition immediately clear.
- pob_phrase: I am coming to you quickly, and I will make war against them
  simplified_phrase: I am coming to you quickly, and I will make war against them
  preserved_meaning: Christ addresses the church as “you” while directing the threatened warfare against “them.”
  reasoning_layer_used: theological decision on corporate address and targeted judgment
  rationale: The distinct pronouns are retained so the text’s deliberate tension is not erased.
interpretive_expansions:
- pob_phrase: if not
  rendering: If you do not repent
