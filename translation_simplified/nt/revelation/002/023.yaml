translation:
  language: en
  text: I will put her children to death.[a] Then all the churches will know that I am the one who searches hearts and minds.[b] I will give each of you what your works deserve.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek literally says “kill her children with death”; it may also mean “kill them with pestilence.”
    reason: lexical_alternative
  - marker: b
    text: Literally “kidneys and hearts,” a biblical expression for hidden thoughts, motives, and desires.
    reason: cultural_note
simplification_decisions:
- pob_phrase: kill her children with death
  simplified_phrase: put her children to death
  preserved_meaning: Jesus declares that he will kill them in judgment.
  reasoning_layer_used: Lexical decision for ἀποκτενῶ and ἐν θανάτῳ
  rationale: The main text states the judgment naturally while the footnote preserves the unusual Greek image and possible sense of pestilence.
- pob_phrase: and all the churches will know
  simplified_phrase: Then all the churches will know
  preserved_meaning: The judgment results in recognition by all the churches.
  reasoning_layer_used: Lexical decision for γνώσονται and clause context
  rationale: “Then” makes the result clear and breaks the long sentence into readable units.
- pob_phrase: I will give to each of you according to your works
  simplified_phrase: I will give each of you what your works deserve
  preserved_meaning: Each person receives recompense based on their works.
  reasoning_layer_used: Lexical decisions for δώσω and κατὰ τὰ ἔργα ὑμῶν
  rationale: The wording makes the judicial sense of “give” clear while retaining the key term “works.”
interpretive_expansions:
- pob_phrase: according to your works
  rendering: what your works deserve
  claim: The giving is judicial recompense based on each person’s works.
  evidence:
  - The POB rationale says “give” carries the sense of recompense in this judgment context.
  - The distributive “each of you” presents an individual judgment.
  confidence: high
  alternatives_preserved:
  - according to your works
translation_notes:
  risk_flags:
  - risk: “Put her children to death” no longer displays the Greek repetition “kill with death” in the main text.
    mitigation: Footnote a preserves the literal wording, its judgment force, and the pestilence alternative.
  - risk: “Her children” may be misunderstood as certainly biological or certainly figurative.
    mitigation: The main text retains “children” without resolving the documented ambiguity.
