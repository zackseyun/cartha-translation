simplification_decisions:
- pob_phrase: The one who has an ear, let him hear
  simplified_phrase: Anyone who has an ear, let him hear
  preserved_meaning: The representative singular remains a call for each person to receive the message.
  reasoning_layer_used: Lexical and theological decisions on ὁ ἔχων οὖς and ἀκουσάτω
  rationale: “Anyone who” makes the representative sense clear while “hear” preserves the formulaic command.
- pob_phrase: The one who conquers
  simplified_phrase: Whoever conquers
  preserved_meaning: The promise applies to each person characterized by overcoming.
  reasoning_layer_used: Lexical decision on ὁ νικῶν
  rationale: “Whoever” states the representative force naturally without weakening “conquers.”
- pob_phrase: will certainly not be harmed by the second death
  simplified_phrase: will certainly suffer no harm from the second death
  preserved_meaning: The emphatic denial and the second death as the source of harm remain intact.
  reasoning_layer_used: Lexical decisions on οὐ μή, ἀδικηθῇ, and ἐκ
  rationale: This structure is natural English and retains the promise’s strong negation.
translation_notes:
  risk_flags:
  - risk: “The second death” remains unexplained for new readers.
    mitigation: It is intentionally retained because of its theological importance and later explanation in Revelation.
