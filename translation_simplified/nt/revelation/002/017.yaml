translation:
  language: en
  text: The one who has an ear must listen to what the Spirit says to the churches. I will give the one who conquers[a] some of the hidden manna. I will also give him a white stone[b] with a new name written on it. No one knows this name except the one who receives it.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the one who overcomes.”
    reason: lexical_alternative
  - marker: b
    text: The white stone may suggest a voting pebble, a sign of acquittal, or a token of admission, but the text does not specify its meaning.
    reason: cultural_note
simplification_decisions:
- pob_phrase: The one who has an ear, let him hear what the Spirit says
  simplified_phrase: The one who has an ear must listen to what the Spirit says
  preserved_meaning: The singular image and the command to heed the Spirit remain intact.
  reasoning_layer_used: Lexical decisions for ὁ ἔχων οὖς and ἀκουσάτω
  rationale: “Must listen” expresses the imperative naturally in modern English.
- pob_phrase: To the one who conquers I will give some of the hidden manna
  simplified_phrase: I will give the one who conquers some of the hidden manna
  preserved_meaning: The promised share of concealed manna still belongs to the one who conquers.
  reasoning_layer_used: Lexical decisions for τῷ νικῶντι and τοῦ μάννα τοῦ κεκρυμμένου
  rationale: Natural English word order makes the recipient and gift easier to follow.
- pob_phrase: and I will give him a white stone, and a new name written on it, which no one knows except the one who receives it
  simplified_phrase: I will also give him a white stone with a new name written on it. No one knows this name except the one who receives it.
  preserved_meaning: The stone bears a secret new name known only by its recipient.
  reasoning_layer_used: Lexical decisions for ψῆφον λευκήν, ὄνομα καινὸν, and the relative clause
  rationale: Two sentences clarify that the final clause refers to the new name.
translation_notes:
  risk_flags:
  - risk: Readers may assume one specific symbolic meaning for the white stone.
    mitigation: The footnote preserves the possible backgrounds without choosing among them.
  - risk: “Must listen” is less formally parallel to POB’s “let him hear.”
    mitigation: It preserves the imperative force while using ordinary modern English.
