translation:
  language: en
  text: Look! I am throwing her onto a bed.[a] I am also bringing great suffering on those who commit adultery with her, unless they turn away from her deeds.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “onto a sickbed.” The Greek says “onto a bed,” but the judgment context may imply a bed of illness or suffering.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: and those who commit adultery with her into great affliction
  simplified_phrase: I am also bringing great suffering on those who commit adultery with her
  preserved_meaning: The same imminent judgment brings severe suffering on those committing adultery with her.
  reasoning_layer_used: POB lexical decisions for βάλλω and θλῖψις, with the Greek clause structure
  rationale: The full English clause preserves the present force and shared judgment action while making the result clear.
- pob_phrase: unless they repent of her works
  simplified_phrase: unless they turn away from her deeds
  preserved_meaning: They must reject the actions associated with her to avoid the judgment.
  reasoning_layer_used: POB lexical decision for μετανοέω with ἐκ and ἔργον
  rationale: “Turn away” states repentance plainly, while “deeds” keeps the reference to her actions.
- pob_phrase: her onto a bed
  simplified_phrase: her onto a bed
  preserved_meaning: The concrete bed image remains without deciding that it must be a sickbed.
  reasoning_layer_used: POB theological decision on κλίνη
  rationale: The main text preserves the documented ambiguity, and the footnote explains the likely judgment sense.
translation_notes:
  risk_flags:
  - risk: Readers may not recognize the bed as an image of judgment or suffering.
    mitigation: The footnote presents the sickbed interpretation without making it certain.
  - risk: Adultery may carry both literal and symbolic force in Revelation.
    mitigation: The concrete term is retained so neither dimension is excluded.
