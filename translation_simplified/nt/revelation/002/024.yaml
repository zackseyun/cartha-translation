translation:
  language: en
  text: But I say this to the rest of you in Thyatira—you who do not accept this teaching and have not come to know what are called “the deep things of Satan.”[a] I will not place any other burden on you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “the depths of Satan.” The expression may echo a claim to deep spiritual knowledge, but it does not make clear exactly how the label was being used.
    reason: lexical_alternative
