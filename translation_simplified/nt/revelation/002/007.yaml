simplification_decisions:
- pob_phrase: let him hear
  simplified_phrase: must listen
  preserved_meaning: The command calls each hearer to pay attention to the Spirit’s message.
  reasoning_layer_used: Lexical decision for ἀκουσάτω
  rationale: “Must listen” gives the imperative clear force in modern English.
- pob_phrase: I will give to eat from
  simplified_phrase: I will allow ... to eat from
  preserved_meaning: The speaker grants the conqueror access to eat from the tree of life.
  reasoning_layer_used: Lexical decisions for δώσω αὐτῷ and φαγεῖν
  rationale: “Allow ... to eat” makes the compressed construction natural without introducing legal-right language.
- pob_phrase: the paradise of God
  simplified_phrase: God’s paradise
  preserved_meaning: The tree of life is in the paradise belonging to God.
  reasoning_layer_used: Lexical decisions for παραδείσῳ and τοῦ θεοῦ
  rationale: The possessive form is simpler while preserving the theological term “paradise.”
interpretive_expansions:
- pob_phrase: I will give to eat from
  rendering: I will allow ... to eat from
  claim: The promised gift includes granted permission or access to eat from the tree of life.
  evidence:
  - The Greek joins “I will give” to the infinitive “to eat.”
  - The POB audit describes this as a personal gift to the conqueror.
  confidence: high
  alternatives_preserved:
  - I will give the one who conquers access to eat from the tree of life.
translation_notes:
  risk_flags:
