translation:
  language: en
  text: He swore by the one who lives forever and ever—the one who created heaven and everything in it, the earth and everything on it, and the sea and everything in it. His oath was that there would be no more delay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “time will be no more.” Here “time” means the waiting period before God’s final action.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: the things in it / the things on it
  simplified_phrase: everything in it / everything on it
  preserved_meaning: All that belongs to heaven, earth, and sea remains included in the creation formula.
  reasoning_layer_used: POB lexical decisions on τὰ ἐν αὐτῷ and the heaven-earth-sea structure
  rationale: “Everything” is more natural than “the things” while preserving the repeated cosmic scope.
- pob_phrase: and swore ... that there will no longer be any delay
  simplified_phrase: He swore ... His oath was that there would be no more delay.
  preserved_meaning: The angel makes a solemn oath whose content is that the delay has ended.
  reasoning_layer_used: POB lexical decisions on ὤμοσεν and ὅτι
  rationale: Two sentences make the long oath formula easier to follow without separating the oath from its content.
- pob_phrase: there will no longer be any delay
  simplified_phrase: there would be no more delay
  preserved_meaning: The waiting period before God’s final action is over, not time itself.
  reasoning_layer_used: POB theological decision on χρόνος οὐκέτι ἔσται and Revelation 10:7 context
  rationale: The simpler wording keeps POB’s contextual reading and avoids suggesting that time ceases to exist.
translation_notes:
  risk_flags:
  - risk: Rendering χρόνος as “delay” does not display the more literal wording in the main text.
    mitigation: The footnote preserves “time will be no more” and briefly explains the contextual choice.
