  reasoning_layer_used: POB lexical decision and doctrine-realignment revision
  rationale: Two sentences make the sequence easier to follow while retaining the audited relational wording “spoke with me.”
- pob_phrase: the scroll that is opened
  simplified_phrase: the open scroll
  preserved_meaning: The scroll remains in the state produced by its opening.
  reasoning_layer_used: POB lexical decision for ἠνεῳγμένον
  rationale: “Open scroll” expresses the continuing state in ordinary English.
- pob_phrase: the angel who is standing on the sea and on the land
  simplified_phrase: the angel who is standing on the sea and on the land
  preserved_meaning: The angel’s vivid stance spans sea and land.
  reasoning_layer_used: POB lexical and theological decisions for γῆ
  rationale: The image and repeated “on” remain unchanged because they carry important apocalyptic force.
