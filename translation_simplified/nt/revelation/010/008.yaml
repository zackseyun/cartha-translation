translation:
  language: en
  text: Then the voice I had heard from heaven spoke with me again. It said, “Go and take the open scroll[a] in the hand of the angel who is standing on the sea and on the land.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “little scroll.” Nearby verses call it a little scroll, but this verse simply says “scroll.”
    reason: alternative_reading
  - marker: b
    text: Or “earth.”
    reason: lexical_alternative
simplification_decisions:
