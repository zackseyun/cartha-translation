  preserved_meaning: The angel is holding the scroll in the hand named by the Greek text.
  reasoning_layer_used: Lexical decision for ἔχων and immediate context from verse 1
  rationale: A finite verb replaces the awkward participial opening while keeping its link to the angel.
- pob_phrase: a little scroll that had been opened
  simplified_phrase: a little scroll that had been opened
  preserved_meaning: The object is small, and a prior opening has left it open.
  reasoning_layer_used: Lexical decisions for βιβλαρίδιον and ἠνεῳγμένον
  rationale: This wording is already clear and preserves both the diminutive image and the perfect passive force.
- pob_phrase: his right foot on the sea, and his left on the land
  simplified_phrase: his right foot on the sea and his left foot on the land
  preserved_meaning: The angel deliberately stands with one foot on the sea and the other on dry land.
