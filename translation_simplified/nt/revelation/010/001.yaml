translation:
  language: en
  text: Then I saw another mighty angel coming down from heaven. He was wrapped in a cloud, with a rainbow[a] over his head. His face was like the sun, and his feet looked like pillars of fire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word may also describe a radiant halo, but “rainbow” is its usual meaning and fits the imagery in Revelation.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And I saw another mighty angel coming down from heaven
  simplified_phrase: Then I saw another mighty angel coming down from heaven.
  preserved_meaning: John sees an exceptionally strong angel descending from heaven.
  reasoning_layer_used: Lexical decisions and target style
  rationale: “Then” gives a natural narrative transition while keeping the angel’s identity neutral.
- pob_phrase: clothed with a cloud
  simplified_phrase: He was wrapped in a cloud
  preserved_meaning: The cloud envelops the angel like clothing.
  reasoning_layer_used: Lexical decision for περιβεβλημένον νεφέλην
  rationale: “Wrapped in” makes the image immediately clear without removing its force.
- pob_phrase: and his feet like pillars of fire
  simplified_phrase: and his feet looked like pillars of fire
  preserved_meaning: The angel’s feet are visually compared to fiery pillars.
  reasoning_layer_used: Lexical decision for στῦλοι πυρός
  rationale: Adding “looked” makes the comparison complete in ordinary English.
translation_notes:
  risk_flags:
  - risk: Readers may identify the mighty angel as either Christ or a created angel.
    mitigation: The text retains “another mighty angel” and does not settle the disputed identity.
  - risk: “Rainbow” may conceal the possible sense of a radiant halo.
    mitigation: The footnote preserves the lexical alternative without weakening the preferred reading.
