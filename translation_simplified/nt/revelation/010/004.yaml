translation:
  language: en
  text: When the seven thunders spoke, I was about to write down what they said. But I heard a voice from heaven say, “Seal up what the seven thunders said, and do not write those words down.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And when the seven thunders spoke, I was about to write
  simplified_phrase: When the seven thunders spoke, I was about to write down what they said.
  preserved_meaning: John was on the verge of recording the thunders’ message when he was interrupted.
  reasoning_layer_used: Lexical decisions for ἤμελλον γράφειν and ἐλάλησαν, with immediate context.
  rationale: The object of “write down” is supplied from the next clause to make the action immediately clear.
- pob_phrase: and I heard a voice from heaven saying
  simplified_phrase: But I heard a voice from heaven say
  preserved_meaning: An unidentified voice from heaven interrupts John with a command.
  reasoning_layer_used: Theological decision to leave the heavenly speaker unidentified.
  rationale: “But” makes the interruption clear while retaining the text’s restraint about who speaks.
- pob_phrase: do not write them
  simplified_phrase: do not write those words down
  preserved_meaning: John must not record the things spoken by the seven thunders.
  reasoning_layer_used: Lexical decision for the plural αὐτά and its spoken-content referent.
  rationale: “Those words” gives the plural pronoun a natural and unambiguous English referent.
interpretive_expansions:
