- pob_phrase: in the days of the voice of the seventh angel
  simplified_phrase: when the seventh angel’s voice is heard
  preserved_meaning: The seventh angel’s voice marks the appointed time without being merged with the trumpet blast.
  reasoning_layer_used: POB lexical decision for φωνή and immediate context
  rationale: This replaces an opaque time expression while keeping the voice distinct from the trumpet.
- pob_phrase: the mystery of God
  simplified_phrase: God’s mystery—his once-hidden plan
  preserved_meaning: God’s hidden purpose reaches its promised fulfillment.
  reasoning_layer_used: POB lexical and theological decisions for μυστήριον and ἐτελέσθη
  rationale: The biblical term remains while a brief explanation makes its contextual sense clear.
- pob_phrase: his own slaves, the prophets
  simplified_phrase: his own slaves, the prophets
  preserved_meaning: The prophets belong to God and serve as his commissioned agents.
  reasoning_layer_used: POB theological decision and regression fix for δοῦλος
  rationale: The contested term is retained because divine ownership is emphasized, with “servants” noted as an alternative.
