translation:
  language: en
  text: But when the seventh angel’s voice is heard, as he is about to sound the trumpet, then God’s mystery—his once-hidden plan—is fulfilled, just as God proclaimed the good news to his own slaves, the prophets.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “his own servants.” The Greek word can mean servants or slaves; here it emphasizes that they belong to God.
    reason: lexical_alternative
