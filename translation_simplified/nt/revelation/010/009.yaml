translation:
  language: en
  text: I went over to the angel and told him to give me the little scroll.[a] He says to me,[b] “Take it and eat it up. It will make your stomach bitter, but in your mouth it will be sweet like honey.”
  philosophy: optimal-equivalence
  footnotes:
