translation:
  language: en
  text: I took the little scroll[a] from the angel’s hand and ate it. It tasted as sweet as honey in my mouth, but after I ate it, my stomach was made bitter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “little book.” The Greek refers to a small written document, likely a scroll.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: from the hand of the angel
  simplified_phrase: from the angel’s hand
  preserved_meaning: John received the scroll directly from the angel’s hand.
  reasoning_layer_used: Lexical decision for ἐκ τῆς χειρὸς τοῦ ἀγγέλου
  rationale: The possessive form is more natural while preserving the vivid physical image.
- pob_phrase: in my mouth it was sweet like honey
  simplified_phrase: It tasted as sweet as honey in my mouth
  preserved_meaning: The eaten scroll had honey-like sweetness in John’s mouth.
  reasoning_layer_used: Lexical decision for ὡς μέλι γλυκύ
  rationale: The active wording states the same sensory comparison in ordinary English.
- pob_phrase: and when I had eaten it
  simplified_phrase: but after I ate it
  preserved_meaning: The bitterness followed the sweetness after John ate the scroll.
  reasoning_layer_used: Lexical decision for ὅτε ἔφαγον αὐτό and immediate clause contrast
  rationale: “After” clarifies the sequence, while “but” makes the stated contrast easy to follow.
