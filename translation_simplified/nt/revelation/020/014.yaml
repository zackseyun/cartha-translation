translation:
  language: en
  text: Death and Hades[a] were thrown into the lake of fire. The lake of fire is the second death.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hades refers to the realm of the dead. It is distinct here from the lake of fire, so translating it as “hell” could be misleading.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And Death and Hades were thrown
  simplified_phrase: Death and Hades were thrown
  preserved_meaning: Death remains personified, Hades remains distinct, and both are forcibly consigned to the lake of fire.
  reasoning_layer_used: Lexical decisions on θάνατος, ᾅδης, and ἐβλήθησαν
  rationale: Removing the opening “And” makes the verse read naturally without changing the event.
- pob_phrase: This is the second death, the lake of fire
  simplified_phrase: The lake of fire is the second death
  preserved_meaning: The statement still identifies the lake of fire as the second death.
  reasoning_layer_used: Lexical decision on οὗτος and the Greek appositional structure
  rationale: Naming the referent directly avoids an unclear “This” and an awkward apposition.
translation_notes:
  risk_flags:
  - risk: Modern readers may mistake Hades for the final place of punishment.
    mitigation: The footnote identifies it as the realm of the dead and keeps it distinct from the lake of fire.
