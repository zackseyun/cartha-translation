translation:
  language: en
  text: They advanced over the vast expanse of the earth. They surrounded the camp of the saints[a] and the beloved city.[b] Then fire came down from heaven and consumed them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Saints” means God’s holy people.
    reason: simplification_note
  - marker: b
    text: The verse does not name the beloved city; it may refer to Jerusalem or, more broadly, the city of God.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: came up over the breadth of the earth
  simplified_phrase: advanced over the vast expanse of the earth
  preserved_meaning: The hostile forces move forward across the earth’s great breadth.
  reasoning_layer_used: Lexical decision for ἀνέβησαν and ἐπὶ τὸ πλάτος τῆς γῆς
  rationale: “Advanced” and “vast expanse” make the movement and wide extent clear without adding a geographic plain.
- pob_phrase: And they came up ... and surrounded
  simplified_phrase: They advanced ... . They surrounded
  preserved_meaning: The advance and encirclement remain distinct actions in sequence.
  reasoning_layer_used: Source clause structure and readability guidance
  rationale: Two short sentences make the action easier to follow.
- pob_phrase: And fire came down from heaven
  simplified_phrase: Then fire came down from heaven
  preserved_meaning: Heavenly fire follows and destroys the surrounding forces.
  reasoning_layer_used: Immediate narrative context
  rationale: “Then” clearly marks the sequence already conveyed by the source conjunction.
translation_notes:
  risk_flags:
  - risk: Readers may assume the beloved city is explicitly named as Jerusalem.
    mitigation: The footnote preserves the POB’s deliberate ambiguity.
