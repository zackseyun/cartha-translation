translation:
  language: en
  text: I saw thrones, and they sat on them. Judgment was given to them. I also saw the souls of those who had been beheaded because of the testimony of Jesus[a] and because of God’s word, and the souls of those who had not worshiped the beast or its image and had not received the mark on their forehead or hand. They came to life and reigned with the Messiah[b] for a thousand years.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “because of their testimony about Jesus.” The phrase may mean testimony given by Jesus or testimony about Jesus.
    reason: alternative_reading
  - marker: b
    text: Or, “with Christ.” Messiah is used because the Greek word functions as a title here.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And I saw thrones, and they sat on them, and judgment was given to them
  simplified_phrase: I saw thrones, and they sat on them. Judgment was given to them.
  preserved_meaning: The vision includes thrones, unnamed occupants, and judgment granted to them.
  reasoning_layer_used: Lexical and theological decisions on the implicit subject and κρίμα
  rationale: The sentence break improves readability without identifying the occupants or narrowing the meaning of judgment.
- pob_phrase: the souls of those who had been beheaded ... and those who had not worshiped the beast
  simplified_phrase: the souls of those who had been beheaded ... and the souls of those who had not worshiped the beast
  preserved_meaning: The two coordinated descriptions remain distinct without deciding whether they identify one group or two.
  reasoning_layer_used: Source syntax, reviewer finding, and the lexical decision on ψυχάς
  rationale: Repeating “the souls of” makes the coordination readable while avoiding the earlier one-group identification.
- pob_phrase: had not received the mark on their forehead and on their hand
  simplified_phrase: had not received the mark on their forehead or hand
  preserved_meaning: Each person refused the mark in either named location.
  reasoning_layer_used: Lexical decisions on χάραγμα and the distributive body-part nouns
  rationale: The shorter wording keeps the mark and both locations clear in natural English.
interpretive_expansions:
- pob_phrase: and those who had not worshiped the beast or its image
  rendering: and the souls of those who had not worshiped the beast or its image
  claim: The second coordinated group is presented as another object seen in the vision.
  evidence:
  - The clause continues the accusative sequence begun with “the souls.”
  - Those described come to life in the following clause.
  confidence: moderate
  alternatives_preserved:
  - The two descriptions may refer to the same group.
  - They may refer to two coordinated groups.
translation_notes:
  risk_flags:
  - risk: “They” remains indefinite and may feel unclear in English.
    mitigation: It is retained because the Greek does not identify who sat on the thrones.
  - risk: Repeating “the souls of” may suggest two groups more strongly than the Greek requires.
    mitigation: The coordination is retained without stating whether the descriptions refer to one group or two.
