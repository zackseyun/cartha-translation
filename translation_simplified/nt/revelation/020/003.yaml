translation:
  language: en
  text: He threw him into the abyss,[a] shut it, and sealed it over him so that he would no longer deceive the nations until the thousand years were over. After that, he must be released for a short time.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “bottomless pit.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: and shut it and sealed it over him
  simplified_phrase: shut it, and sealed it over him
  preserved_meaning: The abyss is closed and secured above him.
  reasoning_layer_used: POB lexical decisions for ἔκλεισεν and ἐσφράγισεν ἐπάνω αὐτοῦ
  rationale: The compact verb sequence preserves both actions and the spatial image.
- pob_phrase: so that he might no longer deceive the nations
  simplified_phrase: so that he would no longer deceive the nations
  preserved_meaning: The confinement is intended to prevent his further deception of the nations.
  reasoning_layer_used: POB lexical decision for ἵνα μὴ πλανήσῃ ἔτι τὰ ἔθνη and grounding review
  rationale: “Would” keeps the purpose sense without adding a claim about his ability.
- pob_phrase: until the thousand years were finished. After these things
  simplified_phrase: until the thousand years were over. After that
  preserved_meaning: His confinement lasts to the end of the thousand years, and his release follows.
  reasoning_layer_used: POB lexical and theological decisions for ἄχρι τελεσθῇ and μετὰ ταῦτα
  rationale: Common temporal wording clarifies the sequence without interpreting the thousand years.
translation_notes:
  risk_flags:
  - risk: Readers may assume that “the thousand years” must be literal.
    mitigation: The unqualified wording preserves both literal and symbolic interpretations.
  - risk: The pronouns require the surrounding passage to identify their referents.
    mitigation: They remain because this verse does not repeat those identities.
