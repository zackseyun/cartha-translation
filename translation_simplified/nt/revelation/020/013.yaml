translation:
  language: en
  text: The sea gave up the dead in it. Death and Hades[a] also gave up the dead within them. Each person was judged by what they had done.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hades means the realm of the dead; it is distinct from the term often translated “hell.”
