translation:
  language: en
  text: If anyone was not found recorded in the book of life,[a] that person was thrown into the lake of fire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek can also be translated “the scroll of life.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: found written in the book of life
  simplified_phrase: found recorded in the book of life
  preserved_meaning: The judgment concerns whether the person’s name is entered in the book of life.
  reasoning_layer_used: POB lexical decisions for γεγραμμένος and ἐν τῇ βίβλῳ τῆς ζωῆς
  rationale: “Recorded” states the idea naturally while preserving the image of a written register.
- pob_phrase: he was thrown
  simplified_phrase: that person was thrown
  preserved_meaning: The singular individual introduced by “anyone” is forcibly thrown into the lake of fire.
  reasoning_layer_used: POB lexical alternative and theological decision on the representative singular
  rationale: “That person” prevents a male-only reading without changing the singular reference.
translation_notes:
  risk_flags:
  - risk: “Recorded” is less direct than the Greek image of being written.
    mitigation: The book imagery remains explicit, and “recorded” is a documented POB lexical alternative.
