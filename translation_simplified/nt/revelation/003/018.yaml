translation:
  language: en
  text: 'Take my advice: buy from me gold refined by fire, so that you can become rich. Buy from me white clothes and put them on, so that the shame of your nakedness will not be exposed. Also buy from me eye ointment to anoint your eyes, so that you can see.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: I counsel you to buy from me
  simplified_phrase: 'Take my advice: buy from me'
  preserved_meaning: Jesus gives weighty advice and directs the hearer to obtain each item from him.
  reasoning_layer_used: POB lexical decisions for συμβουλεύω, ἀγοράσαι, and παρ’ ἐμοῦ
  rationale: The direct wording is easier to follow, while repeated “from me” keeps Jesus as the source of the whole list.
- pob_phrase: white garments so that you may clothe yourself
  simplified_phrase: white clothes and put them on
  preserved_meaning: The hearer must personally obtain and wear the white clothing.
  reasoning_layer_used: POB lexical decisions for ἱμάτια λευκά and the middle voice of περιβάλῃ
  rationale: Common wording preserves both the white-clothing image and personal appropriation.
- pob_phrase: eye salve to anoint your eyes
  simplified_phrase: eye ointment to anoint your eyes
  preserved_meaning: A medicinal eye preparation is applied by anointing while retaining the symbolic resonance.
  reasoning_layer_used: POB lexical and theological decisions for κολλούριον and ἐγχρῖσαι
  rationale: “Eye ointment” is immediately understandable, while “anoint” preserves the chosen source-language force.
translation_notes:
  risk_flags:
  - risk: Repeating “buy from me” makes the shared source phrase explicit before each item.
    mitigation: The repetition clarifies that Jesus is the source of all three items in the coordinated series.
  - risk: “Eye ointment” may sound less traditional than “eye salve.”
    mitigation: It preserves the documented medicinal meaning while retaining “anoint” for the application image.
