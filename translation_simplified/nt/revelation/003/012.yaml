translation:
  language: en
  text: I will make the one who conquers[a] a pillar in the temple of my God. He will never again leave it. I will write on him the name of my God. I will also write on him the name of the city of my God—the new Jerusalem, which comes down out of heaven from my God—and my own new name.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the one who overcomes.” In Revelation, this refers to remaining faithful and gaining victory.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: The one who conquers—I will make him a pillar
  simplified_phrase: I will make the one who conquers a pillar
  preserved_meaning: Jesus promises to make the faithful conqueror a pillar while retaining the architectural image.
  reasoning_layer_used: POB lexical decisions for ὁ νικῶν, ποιήσω, and στῦλον
  rationale: Ordinary English word order removes the disruptive dash without weakening the promise or metaphor.
- pob_phrase: he will never go out from it anymore
  simplified_phrase: He will never again leave it
  preserved_meaning: The conqueror will permanently remain in the temple.
  reasoning_layer_used: POB lexical decision for the emphatic negation ἔξω οὐ μὴ ἐξέλθῃ ἔτι
  rationale: “Never again leave it” expresses the same emphatic finality in natural English.
- pob_phrase: And I will write on him ... and ... and
  simplified_phrase: I will write on him ... I will also write on him ... and
  preserved_meaning: All three names are written on the conqueror, with every occurrence of “my God” and the emphatic final phrase retained.
  reasoning_layer_used: POB lexical and theological decisions on γράψω ἐπ’ αὐτόν, repeated “my God,” and τὸ ὄνομά μου τὸ καινόν
  rationale: Dividing the long list into two sentences improves readability while preserving its parallel elements.
translation_notes:
  risk_flags:
  - risk: “Leave it” could make the pillar image seem physically literal rather than symbolic.
    mitigation: The text retains “a pillar” and the temple setting, leaving the metaphor's permanence and honor intact.
