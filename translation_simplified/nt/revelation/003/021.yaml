translation:
  language: en
  text: The one who conquers[a]—I will give him[b] the privilege of sitting with me on my throne, just as I conquered and sat down with my Father on his throne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the one who overcomes.” “Conquers” preserves the repeated victory language in this verse.
    reason: lexical_alternative
  - marker: b
    text: “Him” represents every believer who conquers.
    reason: simplification_note
simplification_decisions:
- pob_phrase: I will grant him to sit
  simplified_phrase: I will give him the privilege of sitting
  preserved_meaning: Jesus grants the conqueror the privilege of sharing his throne.
  reasoning_layer_used: POB lexical decision for δώσω with καθίσαι
  rationale: The rewrite replaces an unnatural construction while retaining the sense of a granted privilege.
- pob_phrase: just as I also conquered
  simplified_phrase: just as I conquered
  preserved_meaning: Jesus’ own victory remains the basis of the comparison.
  reasoning_layer_used: POB lexical decisions for ὡς, κἀγώ, and ἐνίκησα
  rationale: English does not need “also” here because “just as” already makes the parallel clear.
translation_notes:
  risk_flags:
  - risk: “Privilege” could draw attention away from the concrete throne image.
    mitigation: The text retains “sitting with me on my throne” in full.
