translation:
  language: en
  text: Look! I am standing at the door and knocking. If anyone hears my voice and opens the door, I will come in and share a meal with that person, and that person will share a meal with me.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The shared meal pictures close, mutual fellowship. The text does not specify whether this refers particularly to the Lord’s Supper, conversion, or restored fellowship.
    reason: cross_reference
simplification_decisions:
- pob_phrase: I stand at the door and knock
  simplified_phrase: I am standing at the door and knocking
  preserved_meaning: Jesus remains at the door and continues knocking.
  reasoning_layer_used: POB lexical decisions for ἕστηκα and κρούω
  rationale: The continuous forms make the ongoing posture and action immediately clear.
- pob_phrase: I will come in to him
  simplified_phrase: I will come in
  preserved_meaning: Jesus enters when the person opens the door, with the following meal retaining the personal direction.
  reasoning_layer_used: POB lexical decision for εἰσελεύσομαι πρὸς αὐτόν and immediate meal context
  rationale: This avoids an unsupported purpose clause while keeping the entry tied to the person.
- pob_phrase: dine with him, and he with me
  simplified_phrase: share a meal with that person, and that person will share a meal with me
  preserved_meaning: The concrete meal image and its emphatic two-way fellowship remain explicit.
  reasoning_layer_used: POB lexical and theological decisions on δειπνήσω and reciprocal fellowship
  rationale: Common meal language clarifies dining without merging the two directions of fellowship.
translation_notes:
  risk_flags:
  - risk: The meal may be taken as one specific theological application.
    mitigation: The footnote preserves the POB ambiguity among the Lord’s Supper, conversion, and restored fellowship.
  - risk: Separating the reciprocal meal into two clauses may sound repetitive.
    mitigation: The repetition preserves the source’s deliberate emphasis on mutual fellowship.
