translation:
  language: en
  text: 'Write this to the angel[a] of the church in Sardis:


    This is what the one who has the seven spirits of God[b] and the seven stars says: I know what you do. You have a reputation for being alive, but you are dead.'
  philosophy: optimal-equivalence
  footnotes:
