translation:
  language: en
  text: Look! I am giving some people from the synagogue of Satan.[a] They claim to be Jews, but they are not; they are lying. I will make them come and bow down at your feet,[b] and they will know that I have loved you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek literally says “giving from the synagogue of Satan,” probably referring to some people from that group rather than the whole group.
    reason: lexical_alternative
  - marker: b
    text: The Greek verb can also mean “worship,” but here it describes bowing in submission rather than giving believers divine worship.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: those who call themselves Jews and are not, but are lying
  simplified_phrase: They claim to be Jews, but they are not; they are lying.
  preserved_meaning: The group’s claim is rejected as false without further defining the nature of their identity.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: A separate sentence makes the sharp contrast easier to follow without resolving its theological tension.
- pob_phrase: come and bow down before your feet
  simplified_phrase: come and bow down at your feet
  preserved_meaning: They will perform an embodied act of homage and submission rather than divine worship.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: “At your feet” is natural English and preserves the physical image of bowing.
- pob_phrase: I am giving some from the synagogue of Satan
  simplified_phrase: I am giving some people from the synagogue of Satan
  preserved_meaning: Jesus is presently giving certain people from this group, not necessarily the whole group.
  reasoning_layer_used: POB lexical decision and footnote
  rationale: Adding “people” completes the partitive expression in clear English without supplying an unstated recipient.
translation_notes:
  risk_flags:
  - risk: The statement about claimed Jewish identity could be misused as a general ethnic denial or anti-Jewish claim.
    mitigation: The wording remains limited to this specific group and does not explain the accusation beyond the text.
  - risk: “Giving some people” supplies an object not explicitly stated after the Greek verb.
    mitigation: The footnote preserves the literal construction and explains the probable partitive sense.
