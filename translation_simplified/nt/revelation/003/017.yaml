translation:
  language: en
  text: because you say, “I am rich. I have gained wealth and need nothing.” But you do not know that you are wretched and deserving of pity, poor, blind, and naked.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: I am rich, and I have become wealthy, and I have need of nothing
  simplified_phrase: I am rich. I have gained wealth and need nothing.
  preserved_meaning: The speaker claims both acquired wealth and complete self-sufficiency.
  reasoning_layer_used: POB lexical decisions for πεπλούτηκα and οὐδὲν χρείαν ἔχω
  rationale: Short clauses make the boast clear while retaining its distinct claims.
- pob_phrase: pitiable
  simplified_phrase: deserving of pity
  preserved_meaning: The person is in a condition that rightly evokes pity.
  reasoning_layer_used: POB lexical decision for ἐλεεινός
  rationale: The common phrase is clearer without merging this word with “wretched.”
- pob_phrase: and you do not know
  simplified_phrase: But you do not know
  preserved_meaning: The church is unaware that its true condition contradicts its confident claim.
  reasoning_layer_used: POB lexical decision for οὐκ οἶδας and immediate contrast
  rationale: “But” makes the sharp contrast natural in modern English.
translation_notes:
  risk_flags:
  - risk: Readers may take the poverty, blindness, and nakedness only literally.
    mitigation: The main text preserves POB’s deliberate refusal to add the interpretive qualifier “spiritually.”
  - risk: Breaking the quotation into short sentences may reduce the piling-up effect of the Greek clauses.
    mitigation: All three claims remain in sequence, preserving the force of the boast.
