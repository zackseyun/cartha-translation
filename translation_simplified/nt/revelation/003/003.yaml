translation:
  language: en
  text: So remember how you received and heard the message.[a] Remain faithful to it, and repent. If you do not stay awake, I will come upon you like a thief.[b] You will certainly not know what hour I will come.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “remember what you received and heard.” The Greek says “how,” which may point to the way they first received the message, though it may refer to the message itself.
    reason: alternative_reading
  - marker: b
    text: This describes a sudden, unexpected coming but does not specify whether it means final judgment or a more immediate act of discipline.
    reason: cross_reference
simplification_decisions:
- pob_phrase: Therefore remember how you have received and heard
  simplified_phrase: So remember how you received and heard the message
  preserved_meaning: The command recalls the manner of their earlier reception and hearing while keeping its present importance.
  reasoning_layer_used: Lexical decision for πῶς and theological decision on the exhortation
  rationale: The shorter wording is natural English, while “how” and the footnote preserve the documented ambiguity.
- pob_phrase: keep it
  simplified_phrase: Remain faithful to it
  preserved_meaning: They must continue to hold to and obey what they received.
  reasoning_layer_used: Lexical decision for τηρέω
  rationale: This makes the command understandable without limiting it to either retention or obedience alone.
- pob_phrase: you will certainly not know at what hour
  simplified_phrase: You will certainly not know what hour
  preserved_meaning: The emphatic denial and the specific hour remain intact.
  reasoning_layer_used: Lexical decisions for οὐ μὴ γνῷς and ποίαν ὥραν
  rationale: Removing “at” produces smoother modern English without weakening the warning.
interpretive_expansions:
- pob_phrase: received and heard; keep it
  rendering: received and heard the message. Remain faithful to it
  claim: What they received and heard was a message to which they must remain obedient and committed.
  evidence:
  - POB supplies “it” as referring to what was received and heard.
  - The τηρέω rationale preserves both obedience and retention.
  confidence: high
  alternatives_preserved:
  - The footnote retains the possible reading “what you received and heard.”
translation_notes:
  risk_flags:
  - risk: “Remain faithful” may sound less like guarding or retaining the message than Greek τηρέω.
    mitigation: The wording preserves continuing commitment, and the audit records both retention and obedience.
  - risk: Readers may assume the thief image refers only to the final coming.
    mitigation: The footnote preserves the POB’s unresolved range of final judgment or more immediate discipline.
