translation:
  language: en
  text: 'Write this to the angel[a] of the church in Laodicea: “This is what the Amen says—the faithful and true witness, the beginning of God’s creation.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “messenger.”
    reason: lexical_alternative
  - marker: b
    text: Or “the source or origin of God’s creation” or “the ruler over God’s creation.” The Greek word can have any of these meanings.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: And write to the angel of the church in Laodicea
  simplified_phrase: Write this to the angel of the church in Laodicea
  preserved_meaning: John is commanded to address the church’s angel, with “messenger” still noted as possible.
  reasoning_layer_used: POB lexical decision for ἀγγέλῳ
  rationale: The smoother command keeps “angel” while the footnote preserves its ambiguity.
- pob_phrase: These things says the Amen
  simplified_phrase: This is what the Amen says
  preserved_meaning: Christ speaks under the distinctive title “the Amen.”
  reasoning_layer_used: POB lexical decisions for Τάδε and ὁ Ἀμήν
  rationale: Ordinary English word order improves clarity without translating away the title.
- pob_phrase: the beginning of the creation of God
  simplified_phrase: the beginning of God’s creation
  preserved_meaning: The direct rendering “beginning” remains intentionally open to other senses of the Greek word.
  reasoning_layer_used: POB lexical and theological decisions for ἀρχή
  rationale: The possessive form is more natural English, while the footnote retains the contested alternatives.
translation_notes:
  risk_flags:
  - risk: “Beginning” may be understood as saying that Christ was the first created being.
    mitigation: The footnote preserves the viable senses “source or origin” and “ruler” without resolving the tension.
  - risk: Modern readers may assume “angel” can only mean a heavenly being.
    mitigation: The footnote retains “messenger” as an interpretively possible alternative.
