translation:
  language: en
  text: Because you have held firmly to my word of endurance,[a] I in turn will keep you from[b] the hour of testing that is about to come on the whole inhabited world. It will test those who live on the earth.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may also mean “the word about my endurance” or “my message calling you to endure.”
    reason: lexical_alternative
  - marker: b
    text: This may mean protection through that time or being kept out of it; the wording does not explain how the protection will occur.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: have kept my word of endurance
  simplified_phrase: have held firmly to my word of endurance
  preserved_meaning: They remained faithful to Jesus’ word, while the phrase “word of endurance” remains open to its related meanings.
  reasoning_layer_used: Lexical decision for ἐτήρησας and theological decision on the genitive phrase
  rationale: “Held firmly to” makes faithful keeping clearer without resolving the documented ambiguity.
- pob_phrase: I also will keep you from
  simplified_phrase: I in turn will keep you from
  preserved_meaning: Jesus’ promised keeping answers their prior keeping of his word.
  reasoning_layer_used: Lexical decisions for κἀγώ and τηρήσω ἐκ
  rationale: “In turn” clearly expresses the reciprocal force while retaining the contested phrase “keep you from.”
- pob_phrase: that is about to come upon the whole inhabited world, to test those who dwell on the earth
  simplified_phrase: that is about to come on the whole inhabited world. It will test those who live on the earth.
  preserved_meaning: The coming worldwide time of testing has the earth’s inhabitants as its objects.
  reasoning_layer_used: Lexical decisions for μέλλω, οἰκουμένη, πειράσαι, and κατοικοῦντας
  rationale: Two sentences reduce the clause load while preserving the global scope and purpose.
translation_notes:
  risk_flags:
  - risk: “Held firmly to” may sound stronger than the broad verb “kept.”
    mitigation: The wording remains within the documented sense of guarding or observing Jesus’ word.
  - risk: Readers may interpret “keep you from” according to a particular end-times system.
    mitigation: Footnote b preserves the alternatives and explicitly leaves the means of protection unsettled.
