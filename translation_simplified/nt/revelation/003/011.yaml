translation:
  language: en
  text: I am coming soon.[a] Hold firmly to what you have, so that no one takes away your crown.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “quickly.” The Greek can refer either to nearness in time or to swiftness of action.
    reason: alternative_reading
  - marker: b
    text: This is an honor-crown awarded for victory, not specifically the crown of a king.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: hold fast what you have
  simplified_phrase: Hold firmly to what you have
  preserved_meaning: Christ commands continued, determined perseverance without specifying what they possess.
  reasoning_layer_used: POB lexical decisions for κράτει and ὃ ἔχεις
  rationale: “Hold firmly to” makes the command immediately clear while keeping its force and unspecified object.
- pob_phrase: may take your crown
  simplified_phrase: takes away your crown
  preserved_meaning: Faithful perseverance prevents another person from depriving the hearer of the promised honor-crown.
  reasoning_layer_used: POB lexical decision for λάβῃ and στέφανόν
  rationale: “Takes away” states the threatened loss in ordinary English without adding the stronger idea of seizure.
translation_notes:
  risk_flags:
  - risk: Readers may understand “soon” only as a fixed chronological claim.
    mitigation: Footnote a preserves the possible sense “quickly” and the source ambiguity.
  - risk: Readers may picture a royal diadem rather than a victor’s honor-crown.
    mitigation: Footnote b explains the crown image without replacing it in the text.
