- pob_phrase: the song of Moses, the slave of God
  simplified_phrase: the song of Moses, God’s slave
  preserved_meaning: Moses belongs to God and serves under God’s commission.
  reasoning_layer_used: Lexical and theological decisions for δοῦλος
  rationale: The shorter possessive form keeps the deliberately strong word “slave.”
- pob_phrase: Great and marvelous are your works
