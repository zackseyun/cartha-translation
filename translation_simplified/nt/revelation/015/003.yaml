  preserved_meaning: God’s acts are great and evoke wonder.
  reasoning_layer_used: Lexical decisions for μεγάλα, θαυμαστά, and ἔργα
  rationale: Natural word order and familiar terms make the praise immediately clear.
- pob_phrase: righteous and true are your ways
  simplified_phrase: Your ways of acting are righteous and true
  preserved_meaning: God’s manner of acting is morally right and true.
  reasoning_layer_used: Lexical rationale for ὁδοί
