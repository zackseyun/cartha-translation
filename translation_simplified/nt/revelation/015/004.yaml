translation:
  language: en
  text: Lord, is there anyone who will not fear you and honor your name? You alone are holy. Every nation will come and worship before you, because your righteous acts[a] have been clearly shown.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “righteous judgments”; the Greek expression can also refer to verdicts or commands, but here it most likely means God’s just deeds made visible.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Who will not fear, Lord, and glorify your name?
  simplified_phrase: Lord, is there anyone who will not fear you and honor your name?
  preserved_meaning: The question strongly expects that no one will refuse to fear and honor the Lord.
  reasoning_layer_used: Lexical decisions for τίς οὐ μὴ φοβηθῇ and δοξάσει τὸ ὄνομά σου
  rationale: The recast question clarifies its rhetorical force while preserving reverent fear and honor for God’s name.
- pob_phrase: all the nations
  simplified_phrase: Every nation
  preserved_meaning: All nations will come to worship God.
  reasoning_layer_used: Lexical decision for πάντα τὰ ἔθνη
  rationale: The collective singular is natural English while retaining the universal national scope.
- pob_phrase: have been revealed
  simplified_phrase: have been clearly shown
  preserved_meaning: God’s righteous acts have become visible.
  reasoning_layer_used: Lexical decision for ἐφανερώθησαν
  rationale: The wording expresses manifestation plainly without adding an audience.
translation_notes:
  risk_flags:
  - risk: Modern readers may understand “fear” only as terror.
    mitigation: The term is retained for lexical force, while the worship setting and paired honor indicate reverent fear.
  - risk: “Righteous acts” may obscure the possible judicial sense.
    mitigation: The footnote preserves “righteous judgments” as a lexical alternative.
