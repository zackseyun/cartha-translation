translation:
  language: en
  text: I saw what looked like a sea of glass mixed with fire. Those who were victorious over the beast, over its image, and over the number of its name[a] stood on the sea of glass. They held harps of God.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also emphasize that they had come out from, or been delivered from, the beast’s power.
    reason: alternative_reading
  - marker: b
    text: Or “God’s harps”; the phrase may mean harps belonging to God, coming from God, or dedicated to God.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: what appeared to be
  simplified_phrase: what looked like
  preserved_meaning: John describes a visionary appearance rather than identifying a literal sea.
  reasoning_layer_used: Lexical decision for ὡς
  rationale: “What looked like” expresses visionary comparison in everyday English.
- pob_phrase: and those who were victorious ... standing on the sea of glass
  simplified_phrase: Those who were victorious ... stood on the sea of glass.
  preserved_meaning: The victors are positioned on the glass sea in the vision.
  reasoning_layer_used: Lexical decisions for νικῶντας and ἑστῶτας ἐπὶ
  rationale: A complete sentence removes the difficult participial structure without weakening the image.
- pob_phrase: holding harps of God
  simplified_phrase: They held harps of God.
  preserved_meaning: The people possess harps whose precise relationship to God remains open.
  reasoning_layer_used: Lexical decision for κιθάρας τοῦ θεοῦ
  rationale: The shorter sentence identifies who holds the harps while retaining the ambiguity.
translation_notes:
  risk_flags:
  - risk: “Looked like” may sound less solemn than “appeared to be.”
    mitigation: The sea-of-glass imagery maintains the vision’s gravity.
  - risk: Readers may take “harps of God” to mean only that God owns them.
    mitigation: Footnote b preserves the possibilities of possession, source, and dedication.
