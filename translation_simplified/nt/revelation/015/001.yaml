  text: 'Then I saw another great and marvelous sign in heaven: seven angels with seven last plagues. These plagues were the last because God’s wrath was brought to completion in them.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And I saw another sign in heaven, great and marvelous
  simplified_phrase: Then I saw another great and marvelous sign in heaven
  preserved_meaning: John sees another awe-inspiring symbolic vision in the heavenly realm.
  reasoning_layer_used: Lexical decisions for σημεῖον, ἐν τῷ οὐρανῷ, and μέγα καὶ θαυμαστόν
  rationale: Natural English word order preserves the sign’s grandeur and heavenly setting.
- pob_phrase: seven angels having seven last plagues
  simplified_phrase: seven angels with seven last plagues
  preserved_meaning: The seven angels possess the plagues that complete the sequence.
  reasoning_layer_used: Lexical decisions for ἔχοντας, πληγὰς, and τὰς ἐσχάτας
  rationale: “With” replaces the stiff participle “having” while keeping the angels linked to the plagues.
- pob_phrase: because in them the wrath of God was finished
  simplified_phrase: These plagues were the last because God’s wrath was brought to completion in them
  preserved_meaning: The plagues are last because God’s judicial wrath reaches its intended completion in them.
  reasoning_layer_used: Lexical and theological decisions for ὅτι, ἐν αὐταῖς, ἐτελέσθη, and ὁ θυμὸς τοῦ θεοῦ
  rationale: Naming the plagues removes pronoun ambiguity and preserves completion rather than mere cessation.
interpretive_expansions:
- pob_phrase: because in them the wrath of God was finished
  rendering: These plagues were the last because God’s wrath was brought to completion in them
  claim: The causal clause explains why the plagues are called the last.
  evidence:
  - The lexical rationale for ὅτι says the clause gives the reason these plagues are called the last.
  - The theological rationale says God’s wrath reaches its intended completion in these plagues.
  confidence: high
  alternatives_preserved:
  - God’s wrath was completed in them
  - God’s wrath was finished in them
translation_notes:
  risk_flags:
  - risk: “Brought to completion” is more explicit than “finished.”
    mitigation: It follows the audited lexical and theological decision that ἐτελέσθη denotes intended completion.
