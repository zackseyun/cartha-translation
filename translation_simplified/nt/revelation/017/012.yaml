simplification_decisions:
- pob_phrase: And the ten horns that you saw are ten kings
  simplified_phrase: The ten horns you saw are ten kings.
  preserved_meaning: The vision identifies the horns with kings without deciding whether the kings are literal or symbolic.
  reasoning_layer_used: Lexical and theological decisions on κέρατα and βασιλεῖς
  rationale: The shorter sentence keeps both the horn image and the explicit identification with kings.
- pob_phrase: who have not yet received a kingdom, but they receive authority as kings
  simplified_phrase: They have not yet received a kingdom. But they receive authority as kings
  preserved_meaning: Kingdom and ruling authority remain distinct, and the authority is still received rather than inherent.
  reasoning_layer_used: Lexical decisions on βασιλείαν, ἐξουσίαν, and ὡς βασιλεῖς
  rationale: Splitting the contrast into two sentences makes it easier to follow without merging its key terms.
translation_notes:
  risk_flags:
  - risk: Modern readers may take “one hour” as exactly sixty minutes.
    mitigation: The footnote preserves the likely sense of a brief, limited period without removing the vision’s wording.
