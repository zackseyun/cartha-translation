translation:
  language: en
  text: The beast was, but is not. It is itself an eighth[a] and is from the seven.[b] It is headed for destruction.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “an eighth king.” The context implies “king,” but the Greek does not state it.
    reason: alternative_reading
  - marker: b
    text: Or “one of the seven.” “From the seven” may express origin, membership, or another close relationship.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the beast that was and is not
  simplified_phrase: The beast was, but is not.
  preserved_meaning: The beast’s former existence and present absence remain in stark contrast.
  reasoning_layer_used: Lexical decision for ὃ ἦν καὶ οὐκ ἔστιν
  rationale: A separate sentence clarifies the contrast without explaining away the recurring formula.
- pob_phrase: is itself an eighth and is from the seven
  simplified_phrase: It is itself an eighth and is from the seven.
  preserved_meaning: The beast is emphatically an eighth while its exact relation to the seven remains open.
  reasoning_layer_used: Lexical and theological decisions for αὐτός, ὄγδοός, and ἐκ τῶν ἑπτά
  rationale: The wording remains readable while preserving both deliberate ambiguities.
- pob_phrase: it goes to destruction
  simplified_phrase: It is headed for destruction.
  preserved_meaning: The beast is moving toward its final ruin.
  reasoning_layer_used: Lexical decisions for εἰς ἀπώλειαν and ὑπάγει
  rationale: This common expression clearly preserves movement toward a grave final end.
translation_notes:
  risk_flags:
  - risk: “An eighth” remains unusual without an expressed noun.
    mitigation: Footnote a gives the plausible reading “an eighth king” without adding it to the text.
  - risk: Readers may understand “from the seven” only as origin.
    mitigation: Footnote b preserves the possible membership and close-relation senses.
