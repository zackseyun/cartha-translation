simplification_decisions:
- pob_phrase: with whom the kings of the earth committed sexual immorality
  simplified_phrase: The kings of the earth committed sexual immorality with her
  preserved_meaning: The earthly kings participated in the woman’s sexual immorality.
  reasoning_layer_used: Lexical decision for μεθ’ ἧς and theological decision on πορνεύω
  rationale: The smoother clause order and permitted alternative “with her” clarify the sentence without weakening the metaphor.
- pob_phrase: those who dwell on the earth
  simplified_phrase: the people living on the earth
  preserved_meaning: The phrase refers broadly to the earth’s inhabitants.
  reasoning_layer_used: Lexical decision for οἱ κατοικοῦντες τὴν γῆν
  rationale: “People living on the earth” uses common English while retaining the phrase’s broad scope.
- pob_phrase: became drunk from the wine
  simplified_phrase: became drunk on the wine
  preserved_meaning: Her wine is the source or cause of their drunkenness.
  reasoning_layer_used: Lexical decisions for ἐμεθύσθησαν and ἐκ τοῦ οἴνου
  rationale: “Drunk on the wine” is more idiomatic English and keeps the wine image and causal force.
