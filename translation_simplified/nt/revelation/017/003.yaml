translation:
  language: en
  text: Then he carried me away in the Spirit[a] to a wilderness. There I saw a woman sitting on a scarlet beast. The beast was full of blasphemous names and had seven heads and ten horns.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “in spirit.” The phrase describes a visionary experience and may refer to a spiritual state or to being carried along by the Spirit.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: And he carried me away in the Spirit into a wilderness.
  simplified_phrase: Then he carried me away in the Spirit to a wilderness.
  preserved_meaning: The speaker is transported to a desolate place during a Spirit-related visionary experience.
  reasoning_layer_used: POB lexical and theological decisions for ἀπήνεγκέν, εἰς ἔρημον, and ἐν πνεύματι
  rationale: “Then” gives natural narrative flow while retaining the transport, location, and Spirit language.
- pob_phrase: And I saw a woman sitting on a scarlet beast, full of blasphemous names
  simplified_phrase: There I saw a woman sitting on a scarlet beast. The beast was full of blasphemous names
  preserved_meaning: The woman sits on a scarlet beast characterized by blasphemous names.
  reasoning_layer_used: POB lexical decisions for καθημένην ἐπὶ, θηρίον, κόκκινον, and γέμοντα ὀνόματα βλασφημίας
  rationale: Two sentences make clear that the beast, not the woman, bears the names.
- pob_phrase: having seven heads and ten horns
  simplified_phrase: and had seven heads and ten horns
  preserved_meaning: The seven heads and ten horns remain distinct features of the beast.
  reasoning_layer_used: POB lexical decisions for ἔχων, κεφαλὰς ἑπτὰ, and κέρατα δέκα
  rationale: A finite verb is easier to follow than the participle without weakening the imagery.
translation_notes:
  risk_flags:
  - risk: Capitalizing “Spirit” favors the Holy Spirit interpretation even though the Greek can also mean “in spirit.”
    mitigation: The footnote preserves the documented alternative and identifies the phrase as visionary language.
