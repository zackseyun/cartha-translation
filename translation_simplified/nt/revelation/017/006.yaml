translation:
  language: en
  text: I saw that the woman was drunk with the blood of God’s holy people and with the blood of the witnesses of Jesus.[a] When I saw her, I was greatly amazed.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “the martyrs of Jesus.” The word can mean “witnesses” or “martyrs”; the mention of their blood makes “martyrs” especially fitting here.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the saints
  simplified_phrase: God’s holy people
  preserved_meaning: They are people set apart as belonging to God.
  reasoning_layer_used: POB lexical decision for τῶν ἁγίων
  rationale: This avoids the common misunderstanding that only specially recognized individuals are meant.
- pob_phrase: I marveled greatly
  simplified_phrase: I was greatly amazed
  preserved_meaning: John reacted with intense astonishment.
  reasoning_layer_used: POB lexical decision for ἐθαύμασα and θαῦμα μέγα
  rationale: The modern expression keeps both the amazement and its strong emphasis.
