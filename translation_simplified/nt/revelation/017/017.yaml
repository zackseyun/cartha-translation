simplification_decisions:
- pob_phrase: to act with one purpose
  simplified_phrase: to share one purpose
  preserved_meaning: The rulers have a unified intent while remaining responsible for their actions.
  reasoning_layer_used: POB lexical decision for ποιῆσαι μίαν γνώμην
  rationale: “Share one purpose” states their unified resolve without suggesting they rally behind someone else’s plan.
- pob_phrase: to give their kingdom to the beast
  simplified_phrase: hand their kingdom over to the beast
  preserved_meaning: The rulers yield their dominion to the beast.
  reasoning_layer_used: POB lexical decisions for δοῦναι τὴν βασιλείαν αὐτῶν and τῷ θηρίῳ
  rationale: “Hand over” clearly expresses the transfer of rule while preserving the beast imagery.
- pob_phrase: the words of God
  simplified_phrase: God’s words
  preserved_meaning: God’s prophetic declarations reach their appointed fulfillment.
  reasoning_layer_used: POB lexical decisions for οἱ λόγοι τοῦ θεοῦ and ἄχρι τελεσθήσονται
  rationale: The possessive form is shorter and natural while preserving the prophetic meaning.
