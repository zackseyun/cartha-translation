translation:
  language: en
  text: It is these—the ten horns you saw and the beast—who will hate the prostitute. They will devastate her and leave her naked.[a] They will eat her flesh[b] and burn her up with fire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “strip her bare.” “Naked” also conveys public exposure and humiliation.
    reason: lexical_alternative
  - marker: b
    text: This violent image of eating her flesh depicts total destruction within Revelation’s symbolic vision.
    reason: cultural_note
simplification_decisions:
- pob_phrase: the ten horns that you saw, and the beast—these will hate
  simplified_phrase: It is these—the ten horns you saw and the beast—who will hate
  preserved_meaning: The horns and the beast are emphasized as allied agents acting together.
  reasoning_layer_used: Theological decision on the collective subject and emphatic resumptive pronoun
  rationale: The cleft sentence preserves the Greek emphasis in more natural English.
- pob_phrase: they will make her desolate and naked
  simplified_phrase: They will devastate her and leave her naked
  preserved_meaning: They will ruin her completely and expose her to humiliation.
  reasoning_layer_used: Lexical decisions for ἠρημωμένην ποιήσουσιν and γυμνήν
  rationale: “Devastate” and “leave” clearly express the resulting ruin and exposure.
- pob_phrase: they will eat her flesh, and they will burn her up with fire
  simplified_phrase: They will eat her flesh and burn her up with fire
  preserved_meaning: The gruesome apocalyptic images portray violent and complete destruction.
  reasoning_layer_used: Lexical decisions for σάρκας, φάγονται, and κατακαύσουσιν ἐν πυρί
  rationale: Removing the repeated subject makes the sequence smoother without weakening either image.
translation_notes:
  risk_flags:
  - risk: Modern readers may take the violence as ordinary narrative rather than symbolic vision.
    mitigation: The flesh footnote identifies the language as apocalyptic imagery without resolving the prostitute’s identity.
  - risk: “Devastate” may sound less like traditional biblical judgment language than “make desolate.”
    mitigation: It preserves the resultative sense while making the destruction immediately clear.
