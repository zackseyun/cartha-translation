translation:
  language: en
  text: The beast you saw once was, but now is not. It is about to come up out of the abyss and go to destruction. Everyone living on earth whose name has not been written in the book of life since the world was founded will be amazed when they see the beast,[a] because it once was, now is not, and will be present.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “will be amazed to see that the beast once was, now is not, and will come or appear.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: The beast that you saw was, and is not
  simplified_phrase: The beast you saw once was, but now is not
  preserved_meaning: The beast existed in the past but is absent in the present.
  reasoning_layer_used: lexical decision for ἦν καὶ οὐκ ἔστιν
  rationale: The added time words make the stark contrast immediately clear without explaining the beast’s identity.
- pob_phrase: those who dwell on the earth
  simplified_phrase: Everyone living on earth
  preserved_meaning: The expression identifies the earth’s inhabitants as a group.
  reasoning_layer_used: lexical decision for οἱ κατοικοῦντες ἐπὶ τῆς γῆς
  rationale: “Living” is more natural than “dwell,” while “everyone” keeps the group-wide scope.
- pob_phrase: from the foundation of the world
  simplified_phrase: since the world was founded
  preserved_meaning: The names are described as unwritten from the world’s beginning.
  reasoning_layer_used: theological decision on temporal attachment
  rationale: The modern wording keeps the phrase attached to the writing of the name without resolving its theological tension.
interpretive_expansions:
- pob_phrase: was, and is not
  rendering: once was, but now is not
  claim: The two verbs contrast the beast’s past existence with its present absence.
  evidence:
  - The Greek uses a past-tense verb followed by a present-tense negation.
  - The POB rationale identifies this as a stark temporal contrast.
  confidence: high
  alternatives_preserved:
  - was and is not
  - existed and does not exist
translation_notes:
  risk_flags:
  - risk: “Once” and “now” make the implied temporal contrast explicit.
    mitigation: They do not identify dates or explain how the beast ceased to be.
  - risk: “Will be present” remains less idiomatic than “will come” or “will appear.”
    mitigation: It preserves the POB’s source-driven lexical choice and the contrast with “is not.”
