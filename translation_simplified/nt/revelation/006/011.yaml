translation:
  language: en
  text: Each of them was given a white robe. They were told to rest a little longer, until their fellow servants and brothers—those who were about to be killed just as they had been—were also brought to completion.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek says they were to “be made complete.” This may mean that the whole group, or their full number, would be complete.
    reason: alternative_reading
  - marker: b
    text: “Brothers” may refer more broadly to fellow believers, including women, though the Greek uses a masculine plural word.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And a white robe was given to each of them, and they were told
  simplified_phrase: Each of them was given a white robe. They were told
  preserved_meaning: Every martyr receives a white robe and is then instructed.
  reasoning_layer_used: POB lexical decisions for στολή λευκή, ἑκάστῳ, and ἐρρέθη αὐτοῖς
  rationale: Two short sentences make the sequence easier to follow without changing its passive form.
- pob_phrase: who are about to be killed just as they were
  simplified_phrase: those who were about to be killed just as they had been
  preserved_meaning: Their fellow believers would suffer the same kind of death as the martyrs already had.
  reasoning_layer_used: POB lexical decisions for μέλλοντες ἀποκτέννεσθαι and ὡς καὶ αὐτοί
  rationale: Adjusted tense and pronouns clarify the time relationship in natural English.
- pob_phrase: should also be completed
  simplified_phrase: were also brought to completion
  preserved_meaning: The fellow slaves and brothers are passively made complete, without specifying whether this means the group or its number.
  reasoning_layer_used: POB theological decision on πληρωθῶσιν
  rationale: The wording is more natural while preserving the broad passive sense and its documented ambiguity.
translation_notes:
