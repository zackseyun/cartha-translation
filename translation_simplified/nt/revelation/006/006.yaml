translation:
  language: en
  text: Then I heard what sounded like a voice coming from among the four living creatures. It said, “One quart[b] of wheat for a denarius, and three quarts of barley for a denarius.[a] Do not harm the oil or the wine.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A denarius was usually a laborer’s pay for a full day; these prices show a severe food shortage.
    reason: cultural_note
  - marker: b
    text: The Greek measure was about a quart (one liter), roughly one person’s daily grain ration.
    reason: cultural_note
simplification_decisions:
- pob_phrase: what seemed to be a voice in the midst of the four living creatures
  simplified_phrase: what sounded like a voice coming from among the four living creatures
  preserved_meaning: John heard something resembling a voice from within the group of throne-room beings.
  reasoning_layer_used: Lexical decisions for ὡς φωνὴν and ἐν μέσῳ τῶν τεσσάρων ζῴων
  rationale: Natural auditory wording preserves both the uncertainty and the voice’s location.
- pob_phrase: saying
  simplified_phrase: It said
  preserved_meaning: The voice introduces the proclamation that follows.
  reasoning_layer_used: Lexical decision for λέγουσαν
  rationale: A separate sentence avoids an awkward participial clause without changing the speaker.
- pob_phrase: and do not harm the oil and the wine
  simplified_phrase: Do not harm the oil or the wine
  preserved_meaning: Neither commodity is to be damaged.
  reasoning_layer_used: Lexical decisions for μὴ ἀδικήσῃς, τὸ ἔλαιον, and τὸν οἶνον
  rationale: English normally uses “or” after a negative command applying to two items.
translation_notes:
  risk_flags:
  - risk: “Quart” is only an approximate equivalent of the ancient dry measure.
    mitigation: The footnote gives the approximate liter value and daily-ration context.
  - risk: Modern readers may not know the value of a denarius.
    mitigation: The footnote identifies it as a typical full day’s wage and explains the scarcity.
