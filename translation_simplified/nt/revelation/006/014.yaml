translation:
  language: en
  text: The sky vanished like a scroll being rolled up.[a] Every mountain and island was moved out of place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the sky withdrew” or “the sky was parted”; the Greek can describe separation or withdrawal.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the sky vanished like a scroll being rolled up
  simplified_phrase: The sky vanished like a scroll being rolled up.
  preserved_meaning: The visible sky vanishes in a way compared to a scroll rolling up, while the note preserves the possible senses of parting or withdrawal.
  reasoning_layer_used: Lexical and theological decisions for οὐρανός and ἀπεχωρίσθη
  rationale: This keeps the broad main wording and avoids narrowing the vision to a specific spatial mechanism.
- pob_phrase: every mountain and island was moved from its place
  simplified_phrase: Every mountain and island was moved out of place.
  preserved_meaning: Each mountain and island is displaced from its own location.
  reasoning_layer_used: Lexical decisions for πᾶν, ἐκ τῶν τόπων αὐτῶν, and ἐκινήθησαν
  rationale: “Moved out of place” states the displacement in natural modern English.
- pob_phrase: one sentence joined by “and”
  simplified_phrase: two sentences
  preserved_meaning: The sky’s disappearance and the displacement of the land remain successive parts of the same vision.
  reasoning_layer_used: SPOB readability guidance
  rationale: A sentence break makes the two cosmic images easier to follow.
translation_notes:
  risk_flags:
  - risk: “Vanished” may suggest annihilation rather than separation or withdrawal.
    mitigation: The footnote preserves the Greek verb’s live alternatives without fixing the vision’s mechanism.
