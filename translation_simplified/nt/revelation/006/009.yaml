translation:
  language: en
  text: When he opened the fifth seal, I saw under the altar the souls of those who had been slaughtered[a] because of God’s word and because of their testimony.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “had been slain.” “Slaughtered” preserves the word’s violent and sacrificial force.
    reason: lexical_alternative
  - marker: b
    text: Or “witness.” The Greek may refer to testimony borne or witness given.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And when he opened the fifth seal, I saw
  simplified_phrase: When he opened the fifth seal, I saw
  preserved_meaning: Opening the fifth seal introduces what John sees.
  reasoning_layer_used: POB lexical decisions and narrative context
  rationale: Removing the opening “And” makes the sentence more natural without changing the sequence.
- pob_phrase: because of the word of God
  simplified_phrase: because of God’s word
  preserved_meaning: God’s word was a cause of their deaths.
  reasoning_layer_used: POB lexical decision for διὰ τὸν λόγον τοῦ θεοῦ
  rationale: The possessive form is shorter and preserves the causal meaning.
- pob_phrase: because of the testimony they had
  simplified_phrase: because of their testimony
  preserved_meaning: Their testimony was also a cause of their deaths.
  reasoning_layer_used: POB lexical decisions for μαρτυρίαν and ἣν εἶχον
  rationale: The possessive form expresses the same relationship in clearer English.
translation_notes:
  risk_flags:
  - risk: “Souls” could be taken as a complete doctrine of human nature.
    mitigation: The wording stays within John’s visionary scene without explaining beyond it.
  - risk: “Testimony” may mean testimony borne or witness given.
    mitigation: The footnote preserves both senses without resolving the ambiguity.
