simplification_decisions:
- pob_phrase: And I saw when the Lamb opened
  simplified_phrase: I saw the Lamb open
  preserved_meaning: John witnessed the Lamb opening a seal.
  reasoning_layer_used: Lexical decisions for εἶδον and ὅτε
  rationale: The direct construction is clearer English without changing the event John saw.
- pob_phrase: and I heard one of the four living creatures saying
  simplified_phrase: Then I heard one of the four living creatures say
  preserved_meaning: John next heard one throne-room being speak.
  reasoning_layer_used: Lexical decision for ζῴων and λέγοντος
  rationale: The finite verb and separate sentence make the narrative easier to follow.
- pob_phrase: with a voice like thunder
  simplified_phrase: in a voice like thunder
  preserved_meaning: The creature’s voice sounded like thunder.
  reasoning_layer_used: Lexical decision for ὡς φωνῇ βροντῆς
  rationale: The natural English phrasing keeps the source-language simile intact.
