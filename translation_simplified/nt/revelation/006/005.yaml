translation:
  language: en
  text: When he opened the third seal, I heard the third living creature say, “Come.”[a] Then I looked, and there before me was a black horse. Its rider held a pair of scales in his hand.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The command may be addressed either to John or to the horse and its rider.
    reason: alternative_reading
  - marker: b
    text: These were weighing scales, probably used here for measuring out food.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And when he opened the third seal
  simplified_phrase: When he opened the third seal
  preserved_meaning: The opening of the third seal begins this part of the vision.
  reasoning_layer_used: POB lexical decision for σφραγῖδα τὴν τρίτην
  rationale: Removing the opening “And” makes the sentence more natural without changing the sequence.
- pob_phrase: And I looked, and behold, a black horse
  simplified_phrase: Then I looked, and there before me was a black horse
  preserved_meaning: John suddenly sees a black horse in the unfolding vision.
  reasoning_layer_used: POB lexical decisions for εἶδον, ἰδού, and ἵππος μέλας
  rationale: The new wording preserves the vivid appearance while replacing “behold” with common English.
- pob_phrase: the one sitting on it had a pair of scales in his hand
  simplified_phrase: Its rider held a pair of scales in his hand
  preserved_meaning: The person mounted on the horse carries weighing scales.
  reasoning_layer_used: POB lexical decisions for ὁ καθήμενος ἐπ’ αὐτὸν and ζυγόν
  rationale: “Its rider” naturally compresses the participial phrase while keeping the scales distinct and concrete.
