translation:
  language: en
  text: I looked, and there before me was a pale green horse.[a] Its rider was named Death, and Hades—the realm of the dead—followed along with him. They were given authority over one-fourth of the earth to kill by the sword, famine, plague,[b] and the earth’s wild animals.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a pale horse.” The Greek describes a greenish, sickly pale color.
    reason: lexical_alternative
  - marker: b
    text: Or “death.” Here the word refers to plague in an Old Testament judgment list.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: And I looked, and behold
  simplified_phrase: I looked, and there before me was
  preserved_meaning: John suddenly sees the horse and draws attention to it.
  reasoning_layer_used: POB translation and source clause
  rationale: The recasting expresses the vision naturally without weakening its vivid arrival.
- pob_phrase: the name of the one seated on it was Death
  simplified_phrase: Its rider was named Death
  preserved_meaning: The horse’s rider is the personified figure Death.
  reasoning_layer_used: POB lexical decision on the seated figure and naming formula
  rationale: “Rider” makes the same identification direct and easy to follow.
- pob_phrase: with sword and with famine and with pestilence and by the wild beasts of the earth
  simplified_phrase: by the sword, famine, plague, and the earth’s wild animals
  preserved_meaning: Their means of killing are armed violence, famine, disease, and wild animals.
  reasoning_layer_used: POB lexical decisions and Ezekiel judgment-list rationale
  rationale: The shorter list keeps all four distinct judgments while replacing uncommon wording.
interpretive_expansions:
