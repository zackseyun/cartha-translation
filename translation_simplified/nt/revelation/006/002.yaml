translation:
  language: en
  text: I looked, and there before me was a white horse! Its rider[b] held a bow. He was given a crown,[a] and he rode out, conquering as he went, to conquer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a victor’s crown.” The Greek word often means a wreath or crown awarded for victory rather than a royal crown.
    reason: lexical_alternative
  - marker: b
    text: The text does not identify the rider, and interpretations vary widely.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: And I looked, and behold, a white horse
  simplified_phrase: I looked, and there before me was a white horse!
  preserved_meaning: John suddenly sees a white horse in the vision.
  reasoning_layer_used: Lexical decisions for εἶδον, ἰδού, and ἵππος λευκός
  rationale: The direct exclamation preserves the vivid force of “behold” in ordinary English.
- pob_phrase: the one sitting on it had a bow
  simplified_phrase: Its rider held a bow
  preserved_meaning: The person seated on the horse possesses a bow.
  reasoning_layer_used: Lexical decision for ὁ καθήμενος ἐπ’ αὐτὸν and ἔχων τόξον
  rationale: “Its rider” replaces the heavy participial phrase without identifying who the rider is.
- pob_phrase: he went out conquering and to conquer
  simplified_phrase: he rode out, conquering as he went, to conquer
  preserved_meaning: The rider departs while conquering and with conquest as his purpose or goal.
  reasoning_layer_used: Lexical decisions for ἐξῆλθεν, νικῶν, and ἵνα νικήσῃ
  rationale: The wording distinguishes ongoing conquest from the further goal of conquering.
interpretive_expansions:
- pob_phrase: he went out
  rendering: he rode out
  claim: The rider leaves on the horse rather than departing on foot.
  evidence:
