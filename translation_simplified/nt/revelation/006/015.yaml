translation:
  language: en
  text: The kings of the earth, prominent men, commanders, the rich, the strong, and everyone—slave or free—hid in caves and among the mountain rocks.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the great men
  simplified_phrase: prominent men
  preserved_meaning: People of high social rank or public importance are included.
  reasoning_layer_used: POB lexical decision for μεγιστᾶνες
  rationale: “Prominent men” expresses social standing more clearly without narrowing the group to hereditary nobles.
- pob_phrase: every slave and free person
  simplified_phrase: everyone—slave or free
  preserved_meaning: The judgment scene includes people of both bonded and free social status.
  reasoning_layer_used: POB lexical and theological decisions for πᾶς δοῦλος καὶ ἐλεύθερος
  rationale: The recast is natural English while retaining “slave” and the full slave/free contrast.
- pob_phrase: among the rocks of the mountains
  simplified_phrase: among the mountain rocks
  preserved_meaning: They seek concealment among rocky formations in the mountains.
  reasoning_layer_used: POB lexical decision for εἰς τὰς πέτρας τῶν ὀρέων
  rationale: The shorter phrase preserves the mountain-rock image in ordinary English.
translation_notes:
  risk_flags:
  - risk: “Everyone” could be read more broadly than the paired Greek expression.
    mitigation: The dash immediately limits the phrase to the representative contrast “slave or free.”
