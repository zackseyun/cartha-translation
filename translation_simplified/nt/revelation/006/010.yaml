translation:
  language: en
  text: They cried out in a loud voice, “Holy and true Master,[a] how long before you judge and avenge our blood on those who live on the earth?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Sovereign Lord.” The title emphasizes God’s absolute authority and differs from the usual Greek word for “Lord.”
    reason: lexical_alternative
  - marker: b
    text: Or “against those who live on the earth”; the Greek marks them as the target of vengeance.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: And they cried out with a loud voice, saying
  simplified_phrase: They cried out in a loud voice
  preserved_meaning: Their appeal was spoken with urgency and great volume.
  reasoning_layer_used: Lexical decisions for ἔκραξαν and φωνῇ μεγάλῃ
  rationale: Removing “saying” makes the introduction natural while retaining the force and image of the loud cry.
- pob_phrase: How long, Master, holy and true
  simplified_phrase: Holy and true Master, how long
  preserved_meaning: They appeal to God by his holiness, truth, and absolute authority.
  reasoning_layer_used: Lexical and theological decision for δεσπότης
  rationale: Reordering the address follows natural English without replacing the distinct title “Master.”
- pob_phrase: will you refrain from judging and avenging
  simplified_phrase: how long before you judge and avenge
  preserved_meaning: The martyrs plead for God to end the delay and act with judgment and vengeance.
  reasoning_layer_used: Lexical decision for οὐ κρίνεις καὶ ἐκδικεῖς and doctrine realignment
  rationale: The direct question is easier to follow and preserves both judicial actions.
translation_notes:
  risk_flags:
