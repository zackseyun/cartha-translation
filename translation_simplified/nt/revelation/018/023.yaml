translation:
  language: en
  text: No lamp will ever shine in you again. The voices of a groom and bride will never be heard in you again. For your merchants were powerful people on earth, and through your sorcery[a] all the nations were led astray.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “magic arts” or “witchcraft.” The word refers to sorcery and magical deception.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the light of a lamp will never shine in you again
  simplified_phrase: No lamp will ever shine in you again
  preserved_meaning: Babylon will permanently lose ordinary light and life under irreversible judgment.
  reasoning_layer_used: Lexical decision for οὐ μή and theological decision on finality
  rationale: The shorter sentence keeps the lamp image and the emphatic “never again.”
- pob_phrase: the voice of bridegroom and bride
  simplified_phrase: the voices of a groom and bride
  preserved_meaning: Wedding voices and the life they represent will cease in Babylon.
  reasoning_layer_used: Lexical decision for φωνὴ νυμφίου καὶ νύμφης
  rationale: “Groom” is more familiar than “bridegroom,” while “voices” preserves the audible image.
- pob_phrase: the great ones of the earth
  simplified_phrase: powerful people on earth
  preserved_meaning: The merchants held exceptional worldly prominence and power.
  reasoning_layer_used: Lexical decision for οἱ μεγιστᾶνες τῆς γῆς
  rationale: The wording explains their high status without narrowing them to nobles or political rulers.
translation_notes:
  risk_flags:
  - risk: “Powerful people” may sound broader than the commercial elites intended in context.
    mitigation: The subject remains explicitly “your merchants,” preserving the commercial setting.
