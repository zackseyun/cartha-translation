translation:
  language: en
  text: Give her torment and mourning in the same measure that she exalted herself and lived in luxury.[a] For in her heart she says, “I sit as a queen. I am not a widow, and I will certainly never experience mourning.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek can also mean that she lived self-indulgently or sensuously.
    reason: lexical_alternative
