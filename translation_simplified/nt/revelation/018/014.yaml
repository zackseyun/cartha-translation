simplification_decisions:
- pob_phrase: the fruit of your soul’s desire
  simplified_phrase: the fruit your soul longed for
  preserved_meaning: The fruit image and the intensity of inward desire are both retained.
  reasoning_layer_used: POB lexical decisions for ὀπώρα and ψυχή with ἐπιθυμία
  rationale: The verbal wording is easier to understand than the abstract genitive phrase.
- pob_phrase: all the rich and splendid things
  simplified_phrase: all your luxurious and splendid things
  preserved_meaning: The phrase still refers broadly to Babylon’s costly, showy possessions.
  reasoning_layer_used: POB lexical decisions for λιπαρά and λαμπρά
  rationale: “Luxurious” makes the material opulence clearer than “rich.”
- pob_phrase: have perished from you
  simplified_phrase: have vanished
  preserved_meaning: The luxuries are presented as irretrievably lost.
  reasoning_layer_used: POB lexical decision for ἀπώλετο ἀπὸ σοῦ and immediate context
  rationale: “Have vanished” states the loss naturally, while the next clause preserves its finality.
translation_notes:
  risk_flags:
  - risk: “Fruit” may sound like literal produce rather than an image for what Babylon desired.
    mitigation: The source image is retained because the POB lexical reasoning treats desired produce as intentional.
  - risk: The passive wording may conceal the Greek verb’s indefinite plural subject.
    mitigation: The footnote preserves the alternative sense that unspecified people will never find these things.
