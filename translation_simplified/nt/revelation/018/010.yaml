translation:
  language: en
  text: They stand far away because they are afraid of her torment. They say, “Woe, woe[a] to you, Babylon, you great and strong city! Your judgment has come in a single hour.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Alas, alas.” “Woe” expresses both sorrow and coming doom.
    reason: lexical_alternative
