translation:
  language: en
  text: The music of harpists, musicians, flute players, and trumpeters will never be heard in you again. No skilled worker of any trade will ever be found in you again. The sound of a mill will never be heard in you again.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the sound of harpists and musicians and flute players and trumpeters
  simplified_phrase: The music of harpists, musicians, flute players, and trumpeters
  preserved_meaning: The city's varied musical life will become permanently silent.
  reasoning_layer_used: Lexical decisions for φωνή and the four kinds of performers
  rationale: “The music of” naturally expresses the sound made by these performers.
- pob_phrase: no craftsman of any craft
  simplified_phrase: No skilled worker of any trade
  preserved_meaning: Every kind of skilled craft labor will disappear from the city.
  reasoning_layer_used: Lexical decision for πᾶς τεχνίτης πάσης τέχνης
  rationale: This avoids formal repetition while preserving the phrase's full scope.
- pob_phrase: and ... and ... and
  simplified_phrase: Three separate sentences
  preserved_meaning: Music, skilled labor, and milling will each cease completely.
  reasoning_layer_used: Theological decision on the threefold declaration of judgment
  rationale: Short sentences clarify the three images without weakening their repeated finality.
