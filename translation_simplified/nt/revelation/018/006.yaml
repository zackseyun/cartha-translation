translation:
  language: en
  text: Pay her back as she herself repaid others.[a] Repay her double for what she has done. In the cup she mixed, mix a double portion for her.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also emphasize the command as “double the double things for her.”
    reason: lexical_alternative
  - marker: b
    text: The mixed cup pictures a prepared drink, likely representing judgment.
    reason: cultural_note
simplification_decisions:
- pob_phrase: as she herself has paid back
  simplified_phrase: as she herself repaid others
  preserved_meaning: Babylon receives the same kind of retribution she inflicted.
  reasoning_layer_used: Lexical decision for ὡς καὶ αὐτὴ ἀπέδωκεν
  rationale: Supplying “others” makes the implied object clear without weakening the emphatic “herself.”
- pob_phrase: according to her works
  simplified_phrase: for what she has done
  preserved_meaning: Her repayment is based on her own deeds.
  reasoning_layer_used: Lexical decision for κατὰ τὰ ἔργα αὐτῆς
  rationale: Common wording replaces the biblical idiom while retaining measured recompense.
interpretive_expansions:
- pob_phrase: as she herself has paid back
  rendering: as she herself repaid others
  claim: Babylon’s prior repayment was directed toward other people.
  evidence:
  - The verb’s missing object is supplied by the reciprocal judgment context.
  - The POB rationale says the clause points to Babylon’s own prior actions.
  confidence: high
  alternatives_preserved:
  - as she herself has paid back
translation_notes:
  risk_flags:
  - risk: “Double” may be read as an exact mathematical penalty.
    mitigation: The wording preserves POB’s ambiguity between literal doubling and rhetorically intensified judgment.
  - risk: Modern readers may not recognize the mixed cup as judgment imagery.
    mitigation: Footnote b explains the likely symbolism while keeping the source image in the text.
