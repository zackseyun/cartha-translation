translation:
  language: en
  text: I heard another voice from heaven say, “My people, come out of her,[a] so that you do not take part in her sins and so that you do not suffer any of her plagues.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Her” refers to Babylon, which Revelation portrays as a woman as well as a city and system.
    reason: cultural_note
simplification_decisions:
- pob_phrase: And I heard another voice from heaven saying
  simplified_phrase: I heard another voice from heaven say
  preserved_meaning: John hears an additional heavenly voice introduce the command.
  reasoning_layer_used: Lexical decisions for ἄλλην φωνὴν and ἐκ τοῦ οὐρανοῦ
  rationale: The finite verb gives the narrative introduction in natural English without adding a temporal sequence.
- pob_phrase: Come out of her, my people
  simplified_phrase: My people, come out of her
  preserved_meaning: The heavenly voice directly summons God’s people to leave personified Babylon.
  reasoning_layer_used: Lexical and theological decisions for Ἐξέλθατε, ὁ λαός μου, and ἐξ αὐτῆς
  rationale: Placing the address first makes the audience immediately clear while preserving the direct command.
- pob_phrase: share in her sins ... receive any of her plagues
  simplified_phrase: take part in her sins ... suffer any of her plagues
  preserved_meaning: God’s people must avoid complicity in Babylon’s sins and the judgments that come upon her.
  reasoning_layer_used: Lexical decisions for συγκοινωνήσητε, λάβητε, and πληγῶν
  rationale: “Take part” and “suffer” clearly express participation in sin and undergoing judgment.
interpretive_expansions:
- pob_phrase: receive any of her plagues
  rendering: suffer any of her plagues
  claim: Receiving the plagues means undergoing the divine judgments inflicted on Babylon.
  evidence:
  - The POB lexical rationale identifies the plagues as divinely inflicted judgments.
  - The POB rationale explains “receive” as coming under judgment.
  confidence: high
  alternatives_preserved:
  - receive any of her plagues
translation_notes:
  risk_flags:
  - risk: Readers may not know whom the feminine pronoun “her” identifies.
    mitigation: The footnote identifies Babylon while preserving Revelation’s personification.
  - risk: “Suffer” is less formally close to the source verb than “receive.”
    mitigation: It clearly conveys the supported contextual sense of undergoing Babylon’s plagues.
