translation:
  language: en
  text: Heaven, rejoice over her! You saints, apostles, and prophets, rejoice too, because God has judged her in your case.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek is compressed and may also mean, “God has judged her for your sake” or “God has avenged you on her.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Rejoice over her, O heaven
  simplified_phrase: Heaven, rejoice over her!
  preserved_meaning: Heaven is directly summoned to rejoice over Babylon’s fall.
  reasoning_layer_used: Lexical decisions for Εὐφραίνου, ἐπ’ αὐτῇ, and οὐρανέ.
  rationale: The direct command keeps the personified address without the unfamiliar vocative “O.”
- pob_phrase: and you saints and apostles and prophets
  simplified_phrase: You saints, apostles, and prophets, rejoice too
  preserved_meaning: The saints, apostles, and prophets share the command to rejoice.
  reasoning_layer_used: Lexical decisions for οἱ ἅγιοι, οἱ ἀπόστολοι, and οἱ προφῆται.
  rationale: Repeating the command makes the coordinated address easy to follow.
- pob_phrase: God has judged your judgment from her
  simplified_phrase: God has judged her in your case
  preserved_meaning: God has acted judicially against Babylon in a matter concerning his people.
  reasoning_layer_used: Lexical and theological decisions for κρίνω, κρίμα, and ἐξ αὐτῆς.
  rationale: This keeps Babylon as the object of judgment without defining the action explicitly as vengeance.
interpretive_expansions:
- pob_phrase: your judgment from her
  rendering: her in your case
  claim: Babylon is judged in a judicial matter concerning the addressed believers.
  evidence:
  - The lexical record offers “your legal case” as an alternative.
  - The theological record identifies judicial action on behalf of the saints.
  - The context concerns Babylon’s fall and accountability.
  confidence: moderate
  alternatives_preserved:
  - God has judged her for your sake.
  - God has avenged you on her.
translation_notes:
  risk_flags:
  - risk: “In your case” clarifies the legal image beyond the compressed Greek.
    mitigation: The footnote preserves the main interpretive alternatives.
  - risk: “Rejoice over her” may be misunderstood apart from the surrounding judgment scene.
    mitigation: The verse states God’s judicial action as the reason for rejoicing.
