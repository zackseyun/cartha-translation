translation:
  language: en
  text: The kings of the earth joined her in sexual immorality[a] and in living a life of luxury. When they see the smoke from her burning, they will weep and mourn[b] for her.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In Revelation, this sexual imagery also points to corrupt and idolatrous alliances.
    reason: lexical_alternative
  - marker: b
    text: The Greek describes open, demonstrative mourning and can also be translated “beat themselves in grief.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the kings of the earth who committed sexual immorality and lived in luxury with her
  simplified_phrase: The kings of the earth joined her in sexual immorality and in living a life of luxury.
  preserved_meaning: The rulers participated with Babylon in both sexualized corruption and self-indulgent luxury.
  reasoning_layer_used: POB lexical and theological decisions on πορνεύω, μετά, and στρηνιάω
  rationale: An independent sentence makes the two forms of participation easier to follow while retaining the sexual metaphor.
- pob_phrase: will weep and mourn over her when they see the smoke of her burning
  simplified_phrase: When they see the smoke from her burning, they will weep and mourn for her.
  preserved_meaning: Seeing Babylon burn leads the rulers to audible and demonstrative grief for her.
  reasoning_layer_used: POB lexical decisions on κλαίω, κόπτω, and πύρωσις
  rationale: Natural clause order and “smoke from” clarify the sequence without weakening the burning image.
