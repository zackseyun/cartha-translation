  rationale: The rewrite makes the accumulated heap easier to picture while retaining its vertical force.
- pob_phrase: her wrongdoings
  simplified_phrase: the wrongs she has done
  preserved_meaning: This refers to her evil acts and remains distinct from “sins.”
  reasoning_layer_used: POB lexical and theological decisions for ἀδικήματα
  rationale: Everyday wording preserves the distinction between the two Greek terms.
- pob_phrase: God has remembered
