translation:
  language: en
  text: For all the nations have drunk her wine—the wine of wrath linked to her sexual immorality.[a] The kings of the earth joined her in sexual immorality,[b] and the merchants of the earth grew rich through the power of her decadent luxury.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also mean “the wine of the passion of her sexual immorality,” and the relationship among these ideas is not fully defined.
    reason: lexical_alternative
  - marker: b
    text: Here sexual immorality likely pictures corrupt, idolatrous, and exploitative alliance.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: the wine of the wrath of her sexual immorality
  simplified_phrase: her wine—the wine of wrath linked to her sexual immorality
  preserved_meaning: Babylon’s sexual immorality is connected with intoxicating wine and wrath without defining the exact relationship.
  reasoning_layer_used: lexical decisions and footnote a
  rationale: The recast unpacks the dense phrase while preserving its imagery and ambiguity.
- pob_phrase: committed sexual immorality with her
  simplified_phrase: joined her in sexual immorality
  preserved_meaning: The kings participated with Babylon in the conduct pictured by the sexual metaphor.
  reasoning_layer_used: lexical and theological decisions
  rationale: The natural wording retains the deliberate sexual image.
- pob_phrase: grew rich from the power of her luxury
  simplified_phrase: grew rich through the power of her decadent luxury
  preserved_meaning: Babylon’s excessive luxury exerted an enriching economic force.
  reasoning_layer_used: lexical decisions for δύναμις and στρῆνος
  rationale: “Decadent” clarifies corrupt excess while “power” remains explicit.
interpretive_expansions:
- pob_phrase: her luxury
  rendering: her decadent luxury
  claim: The luxury is self-indulgent excess rather than ordinary comfort.
  evidence:
  - The POB rationale says στρῆνος denotes arrogant luxury or self-indulgent excess.
  confidence: high
  alternatives_preserved:
  - self-indulgent luxury
translation_notes:
  risk_flags:
  - risk: Readers may assume “linked to” defines the exact relationship in the Greek phrase.
    mitigation: Footnote a states that the relationship is not fully defined and preserves “passion.”
  - risk: Readers may take the sexual language only literally.
    mitigation: Footnote b presents the likely metaphorical force without removing the source image.
