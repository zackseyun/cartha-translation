translation:
  language: en
  text: 'He cried out in a powerful voice: “Fallen, fallen is Babylon the great! She has become a home for demons. She is a prison[a] for every unclean spirit, every unclean bird, and every unclean and hated beast.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The word translated “prison” can also mean a place where they live or gather.
    reason: lexical_alternative
  - marker: b
    text: Some manuscripts do not include “and every unclean and hated beast.”
    reason: textual_variant
simplification_decisions:
- pob_phrase: with a mighty voice
  simplified_phrase: in a powerful voice
  preserved_meaning: His cry was forceful and commanding.
  reasoning_layer_used: Lexical decision for ἐν ἰσχυρᾷ φωνῇ
  rationale: “Powerful” is more familiar than “mighty” while retaining the voice’s strength.
- pob_phrase: She has become a dwelling place of demons
  simplified_phrase: She has become a home for demons
  preserved_meaning: Fallen Babylon is now inhabited by demons.
  reasoning_layer_used: Lexical decision for κατοικητήριον
  rationale: “Home” expresses an inhabited place in direct modern English.
- pob_phrase: a prison of every unclean spirit, a prison of every unclean bird, and a prison of every unclean and hated beast
  simplified_phrase: a prison for every unclean spirit, every unclean bird, and every unclean and hated beast
  preserved_meaning: Babylon is pictured as a place that keeps every kind of unclean spirit, bird, and beast.
  reasoning_layer_used: Lexical and theological decisions for φυλακή and θηρίον
  rationale: The shorter list keeps the prison image and treats “beast” as an ordinary animal, not Revelation’s titled Beast.
translation_notes:
  risk_flags:
  - risk: “Prison” may imply confinement more narrowly than the Greek requires.
    mitigation: The footnote preserves the possible sense of a place inhabited or frequented.
  - risk: The beast clause is absent from some manuscripts.
    mitigation: The textual footnote identifies the omission without removing the clause from the main text.
