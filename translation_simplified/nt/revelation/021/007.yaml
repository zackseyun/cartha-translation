translation:
  language: en
  text: Whoever overcomes[a] will inherit these things. I will be his God, and he will be my son.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “conquers.” In Revelation, this means continuing faithfully and prevailing.
