translation:
  language: en
  text: The city is laid out as a square, as long as it is wide. He measured the city with the measuring rod, and the measurement was twelve thousand stadia.[a] Its length, width, and height are all equal.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A stadion was an ancient unit of distance. Twelve thousand stadia is roughly 1,380 miles or 2,220 kilometers, depending on the exact length used.
    reason: cultural_note
  - marker: b
    text: This means the city has the form of a perfect cube, though the Greek directly states that its three dimensions are equal.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: the city lies foursquare
  simplified_phrase: the city is laid out as a square
  preserved_meaning: The city has a square, four-sided layout.
  reasoning_layer_used: Lexical decisions for τετράγωνος and κεῖται
  rationale: This replaces elevated architectural language with a clear present-tense description.
- pob_phrase: its length is as great as its width
  simplified_phrase: as long as it is wide
  preserved_meaning: The city's length and width are equal.
  reasoning_layer_used: Lexical decision for τὸ μῆκος αὐτῆς ὅσον τὸ πλάτος
  rationale: The shorter comparison states the same equality in ordinary English.
- pob_phrase: twelve thousand stadia
  simplified_phrase: the measurement was twelve thousand stadia
  preserved_meaning: The measured extent remains expressed in the ancient source unit.
  reasoning_layer_used: Theological decision to retain the ancient unit
  rationale: This clarifies the number's role without replacing the source-based unit.
translation_notes:
  risk_flags:
  - risk: Modern readers may not understand the size represented by stadia.
    mitigation: Footnote a gives approximate modern equivalents without replacing the ancient unit.
  - risk: Readers may miss that equal length, width, and height imply a cube.
    mitigation: Footnote b explains the implication while distinguishing it from the Greek wording.
