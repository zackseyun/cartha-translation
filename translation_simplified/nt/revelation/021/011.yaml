translation:
  language: en
  text: The city had the glory of God. Its radiance was like a very precious stone—like jasper, clear as crystal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “jasper, sparkling like crystal.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: having the glory of God
  simplified_phrase: The city had the glory of God.
  preserved_meaning: The city bears God’s manifested divine glory.
  reasoning_layer_used: Greek grammar and theological decision
  rationale: Naming the city clarifies the participle’s antecedent while retaining the theological term “glory.”
- pob_phrase: like a most precious stone
  simplified_phrase: like a very precious stone
  preserved_meaning: The stone is of exceptional value.
  reasoning_layer_used: Lexical decision
  rationale: “Very precious” expresses the superlative naturally in common English.
- pob_phrase: like a jasper stone
  simplified_phrase: like jasper
  preserved_meaning: The radiance is compared specifically to the gemstone jasper.
  reasoning_layer_used: Lexical decision
  rationale: Removing the repeated word “stone” makes the comparison smoother without losing the gemstone image.
translation_notes:
  risk_flags:
  - risk: “Clear as crystal” may emphasize transparency rather than sparkling brilliance.
    mitigation: The footnote preserves the documented alternative “sparkling like crystal.”
