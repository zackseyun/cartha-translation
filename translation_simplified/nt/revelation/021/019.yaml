translation:
  language: en
  text: The foundations of the city wall were decorated with every kind of precious stone. The first foundation was jasper, the second was sapphire, the third was chalcedony,[a] and the fourth was emerald.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Chalcedony” is the traditional name; the exact identity of some ancient gemstones is uncertain.
    reason: cultural_note
simplification_decisions:
- pob_phrase: The foundations of the wall of the city
  simplified_phrase: The foundations of the city wall
  preserved_meaning: The foundations belong to the wall surrounding the city.
  reasoning_layer_used: Lexical decisions for θεμέλιοι, τεῖχος, and πόλεως
  rationale: Natural English uses “city wall” instead of the longer nested phrase.
- pob_phrase: were adorned with every kind of precious stone
  simplified_phrase: were decorated with every kind of precious stone
  preserved_meaning: Every variety of precious stone beautified the foundations.
  reasoning_layer_used: Lexical decision for κεκοσμημένοι and παντὶ λίθῳ τιμίῳ
  rationale: “Decorated” is more familiar than “adorned” while keeping the completed passive description.
- pob_phrase: the first foundation was jasper, the second sapphire
  simplified_phrase: The first foundation was jasper, the second was sapphire
  preserved_meaning: Each numbered foundation is identified with a particular gemstone.
  reasoning_layer_used: Lexical decision for ὁ θεμέλιος ὁ πρῶτος and gemstone terms
  rationale: Repeating “was” makes the sequence immediately clear without interpreting the stones symbolically.
translation_notes:
  risk_flags:
  - risk: Modern gemstone names may not identify every ancient stone precisely.
    mitigation: The footnote preserves the documented uncertainty, especially for chalcedony.
