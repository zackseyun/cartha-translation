  text: The fifth foundation was decorated with sardonyx; the sixth with sardius[a]; the seventh with chrysolite; the eighth with beryl; the ninth with topaz; the tenth with chrysoprase; the eleventh with jacinth[b]; and the twelfth with amethyst.
