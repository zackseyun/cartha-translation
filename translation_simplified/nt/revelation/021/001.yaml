translation:
  language: en
  text: And I saw a new heaven and a new earth, for the first heaven and the first earth[a] had passed away, and the sea[b] was no more.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'the former heaven and the former earth.' This refers to the current world order in contrast to the new creation.
    reason: simplification_note
  - marker: b
    text: The 'sea' can be understood literally, but in the symbolic language of Revelation it often represents chaos, evil, or separation.
    reason: simplification_note
