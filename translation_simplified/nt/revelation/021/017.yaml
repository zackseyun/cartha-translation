  text: 'He measured the city’s wall: 144 cubits by human measure, which is also an angel’s measure.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A cubit was an ancient unit based on the length of a person’s forearm.
    reason: cultural_note
  - marker: b
    text: The Greek may stress either that the angel used a human unit or that human and angelic measures correspond here.
    reason: alternative_reading
