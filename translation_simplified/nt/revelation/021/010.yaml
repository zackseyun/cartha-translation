  reasoning_layer_used: POB lexical and theological decisions on ἀπήνεγκέν, ἐν πνεύματι, and ἐπὶ ὄρος μέγα καὶ ὑψηλόν
  rationale: The smoother “to” keeps the movement while retaining “carried away,” both mountain descriptions, and the visionary formula.
- pob_phrase: and showed me the holy city
  simplified_phrase: He showed me the holy city
  preserved_meaning: The guide directs John’s sight to the holy city.
  reasoning_layer_used: POB lexical decisions on ἔδειξέν μοι, πόλιν, and ἁγίαν
  rationale: A new sentence makes the two actions easier to follow without changing their sequence.
