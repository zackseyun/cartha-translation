  preserved_meaning: Jasper was the substance of the city wall.
  reasoning_layer_used: The lexical decision for ἐνδώμησις favors the wall’s material while preserving the construction alternative in a footnote.
  rationale: The active wording is easier to understand than the abstract phrase “the material of its wall.”
- pob_phrase: the city was pure gold
  simplified_phrase: the city itself was pure gold
  preserved_meaning: The city, in contrast with its wall, consisted of pure gold.
  reasoning_layer_used: The lexical decisions identify χρυσίον as material gold and καθαρόν as refined purity.
  rationale: “Itself” makes the shift from the wall to the city immediately clear.
- pob_phrase: like pure glass
  simplified_phrase: as clear as glass
  preserved_meaning: The gold had the radiant clarity associated with glass.
  reasoning_layer_used: The lexical rationale for ὕαλῳ καθαρῷ identifies clarity or transparency as the comparison’s visual force.
  rationale: “As clear as glass” communicates the image naturally while retaining the comparison.
