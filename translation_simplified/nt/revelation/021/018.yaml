translation:
  language: en
  text: The wall was made[a] of jasper, and the city itself was pure gold, as clear as glass.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may refer to the wall’s construction or to the material from which it was made.
    reason: lexical_alternative
  - marker: b
    text: Or “like pure glass”; the comparison emphasizes radiant clarity.
    reason: lexical_alternative
