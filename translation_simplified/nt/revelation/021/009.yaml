translation:
  language: en
  text: Then one of the seven angels came and spoke with me. He was one of the angels who had the seven bowls full of the seven last plagues. He said, “Come. I will show you the bride, the wife of the Lamb.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: one of the seven angels who had the seven bowls full of the seven last plagues came and spoke with me
  simplified_phrase: one of the seven angels came and spoke with me. He was one of the angels who had the seven bowls full of the seven last plagues
  preserved_meaning: The same angel is identified as one of the seven who possessed the plague-filled bowls.
  reasoning_layer_used: POB lexical decisions for the angels, bowls, and plagues
  rationale: Dividing the long sentence makes the angel’s action and identity easier to follow.
- pob_phrase: saying, “Come, I will show you
  simplified_phrase: He said, “Come. I will show you
  preserved_meaning: The angel invites John to come and promises to show him the bride.
  reasoning_layer_used: POB lexical decisions for λέγων, Δεῦρο, and δείξω σοι
  rationale: A direct speech verb and two short sentences sound natural while keeping both statements distinct.
translation_notes:
  risk_flags:
  - risk: Splitting the identifying clause into a second sentence could momentarily sound like new information about a different group.
    mitigation: Repeating “the angels” clearly links the description back to the same seven angels.
