translation:
  language: en
  text: But cowards, those who do not believe[a], those who do detestable things, murderers, sexually immoral people, those who practice sorcery, idol worshipers, and all liars will have their share in the lake that burns with fire and sulfur.[b] This is the second death.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “those who are faithless” or “unfaithful.”
    reason: alternative_reading
  - marker: b
    text: Sulfur is traditionally called “brimstone.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the cowardly and unbelieving and detestable
  simplified_phrase: cowards, those who do not believe, those who do detestable things
  preserved_meaning: Cowardice, unbelief, and morally abhorrent conduct remain distinct categories.
  reasoning_layer_used: POB lexical decisions for δειλοῖς, ἀπίστοις, and ἐβδελυγμένοις
  rationale: Direct descriptions make these categories easier to understand without weakening their force.
- pob_phrase: sorcerers and idolaters
  simplified_phrase: those who practice sorcery, idol worshipers
  preserved_meaning: The wording identifies occult practitioners and those who worship idols.
  reasoning_layer_used: POB lexical decisions for φαρμάκοις and εἰδωλολάτραις
  rationale: Unfamiliar labels are unpacked into clear descriptions.
- pob_phrase: their portion will be in the lake burning with fire and sulfur, which is the second death
  simplified_phrase: will have their share in the lake that burns with fire and sulfur. This is the second death.
  preserved_meaning: The lake remains their allotted destiny and is identified as the second death.
  reasoning_layer_used: POB lexical decisions for τὸ μέρος αὐτῶν and ὅ ἐστιν ὁ θάνατος ὁ δεύτερος
  rationale: “Their share” preserves the assigned outcome, while two sentences clarify the explanation.
