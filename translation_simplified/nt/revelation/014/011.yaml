simplification_decisions:
- pob_phrase: And the smoke of their torment goes up
  simplified_phrase: The smoke from their torment rises
  preserved_meaning: The concrete image of smoke continually rising from torment remains intact.
  reasoning_layer_used: Lexical decisions for καπνὸς, βασανισμοῦ, and ἀναβαίνει
  rationale: Natural word order and “rises” make the image immediately clear.
- pob_phrase: and they have no rest day and night
  simplified_phrase: They have no rest, day or night
  preserved_meaning: Those under judgment never receive rest.
  reasoning_layer_used: Lexical decision for ἀνάπαυσιν and temporal idiom ἡμέρας καὶ νυκτός
  rationale: A new sentence and commas clarify the force of continual unrest.
- pob_phrase: those who worship the beast and its image, and whoever receives the mark of its name
  simplified_phrase: those who worship the beast and its image, and whoever receives the mark of its name
  preserved_meaning: Both worshipers and recipients of the beast’s mark are described as having no rest.
  reasoning_layer_used: POB theological decision on the final clause
  rationale: The wording remains broad while the footnote preserves the Greek clause’s abrupt shift.
translation_notes:
