translation:
  language: en
  text: 'The smoke from their torment rises forever and ever.[a] They have no rest, day or night: those who worship the beast and its image, and whoever receives the mark of its name.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “for ages of ages.”
    reason: lexical_alternative
  - marker: b
    text: The Greek ends abruptly, “and if anyone receives the mark of its name,” apparently adding to the description of those under judgment.
