translation:
  language: en
  text: This calls for endurance from God’s holy people—those who keep God’s commandments and the faith of Jesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “faith in Jesus”; alternatively, “the faithfulness of Jesus.” The Greek phrase can mean any of these.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Here is the endurance of the saints
  simplified_phrase: This calls for endurance from God’s holy people
  preserved_meaning: The present situation requires God’s people to remain steadfast under trial.
  reasoning_layer_used: Lexical decisions for Ὧδε, ὑπομονή, and ἅγιοι, with the immediate context
  rationale: The wording explains “saints” and expresses the verse’s exhortatory force in natural English.
- pob_phrase: those who keep the commandments of God
  simplified_phrase: those who keep God’s commandments
  preserved_meaning: The holy people are identified as those who faithfully obey God’s authoritative commands.
  reasoning_layer_used: Lexical decisions for τηροῦντες and ἐντολάς
  rationale: The possessive form is easier to read while retaining “commandments.”
interpretive_expansions:
- pob_phrase: Here is the endurance of the saints
  rendering: This calls for endurance from God’s holy people
  claim: The statement points to a circumstance requiring the endurance of God’s people.
  evidence:
  - Revelation 14:9–12 places the saying in a context of persecution and allegiance.
  - Revelation 13:10 uses a similar formula as an appeal for endurance.
  confidence: moderate
  alternatives_preserved:
  - Here is the endurance of God’s holy people.
translation_notes:
