translation:
  language: en
  text: They are singing a song that seems to be new before the throne, the four living creatures, and the elders.[a] No one could learn that song except the one hundred forty-four thousand—the people who had been purchased from the earth.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “They are singing as if it were a new song” or “like a new song.” The wording describes how the song is perceived in the vision.
    reason: lexical_alternative
  - marker: b
    text: Or “redeemed from the earth.” The Greek word literally means “purchased” or “bought.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: they are singing what seemed to be a new song
  simplified_phrase: They are singing a song that seems to be new
  preserved_meaning: The song is perceived as new within the vision without denying that it truly is new.
  reasoning_layer_used: Lexical and theological decisions for ὡς and ᾠδὴν καινὴν
  rationale: The connected clause is smooth while retaining the vision’s appearance language.
- pob_phrase: before the throne and before the four living creatures and the elders
  simplified_phrase: before the throne, the four living creatures, and the elders
  preserved_meaning: They sing in the presence of the heavenly throne and the beings around it.
  reasoning_layer_used: Lexical decisions for ἐνώπιον and the heavenly group titles
  rationale: Removing the repeated preposition makes the list easier to read without changing the setting.
- pob_phrase: And no one was able to learn the song except the one hundred forty-four thousand, those who had been purchased from the earth
  simplified_phrase: No one could learn that song except the one hundred forty-four thousand—the people who had been purchased from the earth
  preserved_meaning: Only this purchased group could learn the song, and the marketplace image remains intact.
  reasoning_layer_used: Lexical and theological decisions for οὐδεὶς ἐδύνατο, εἰ μὴ, and ἠγορασμένοι
  rationale: One direct sentence removes repetition and clearly identifies the group.
translation_notes:
  risk_flags:
  - risk: “Seems to be new” could be mistaken for a denial that the song is truly new.
    mitigation: Footnote a explains that the wording marks perception within the vision.
  - risk: “Purchased” may sound unusually commercial to modern readers.
    mitigation: Footnote b preserves “redeemed” as an alternative while explaining the literal metaphor.
