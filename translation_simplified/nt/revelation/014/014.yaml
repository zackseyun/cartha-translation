translation:
  language: en
  text: Then I looked, and there was a white cloud. Sitting on the cloud was someone like a son of man.[a] He had a golden crown[b] on his head and held a sharp sickle in his hand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “someone like the Son of Man.” This wording echoes Daniel 7:13 and is often understood as a messianic title, though the Greek says “like a son of man.”
    reason: alternative_reading
  - marker: b
    text: The Greek word translated “crown” often refers to a victor’s wreath rather than a royal crown.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And I looked, and behold, a white cloud
  simplified_phrase: Then I looked, and there was a white cloud
  preserved_meaning: John’s attention is suddenly drawn to a white cloud in the vision.
  reasoning_layer_used: Lexical decision for ἰδοὺ and narrative context
  rationale: The direct wording conveys the sudden sight without the unfamiliar command “behold.”
- pob_phrase: seated on the cloud was one like a son of man
  simplified_phrase: Sitting on the cloud was someone like a son of man
  preserved_meaning: John sees a humanlike figure on the cloud without making the phrase an explicit title.
  reasoning_layer_used: Lexical and theological decisions for ὅμοιον υἱὸν ἀνθρώπου
  rationale: “Someone” and “sitting” are more natural while preserving the deliberate Danielic ambiguity.
- pob_phrase: having on his head a golden crown and in his hand a sharp sickle
  simplified_phrase: He had a golden crown on his head and held a sharp sickle in his hand
  preserved_meaning: The figure wears a golden crown and carries a sharp harvesting blade.
  reasoning_layer_used: Lexical decisions for στέφανον χρυσοῦν and δρέπανον ὀξύ
  rationale: A complete sentence replaces the stiff participial structure without changing either image.
translation_notes:
  risk_flags:
  - risk: Readers may take “a son of man” as generic and miss the echo of Daniel 7:13.
    mitigation: Footnote a preserves the messianic-title reading without forcing it into the text.
  - risk: “Crown” may suggest only a royal diadem rather than a victor’s wreath.
    mitigation: Footnote b retains the Greek word’s possible victory nuance.
