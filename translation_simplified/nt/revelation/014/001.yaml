translation:
  language: en
  text: Then I looked, and there before me was the Lamb, standing on Mount Zion. With him were 144,000 people. His name and his Father’s name were written on their foreheads.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some manuscripts read only, “his Father’s name was written on their foreheads.”
    reason: textual_variant
simplification_decisions:
- pob_phrase: Then I looked, and behold
  simplified_phrase: Then I looked, and there before me
  preserved_meaning: John’s vision advances and directs heightened attention to what appears.
  reasoning_layer_used: POB lexical decision for Καὶ εἶδον and ἰδοὺ
  rationale: The wording preserves the vivid attention marker without the less familiar word “behold.”
- pob_phrase: the Lamb was standing on Mount Zion, and with him were
  simplified_phrase: the Lamb, standing on Mount Zion. With him were
  preserved_meaning: The Lamb remains pictured in a standing position on Mount Zion with the numbered group.
  reasoning_layer_used: POB lexical decisions for ἑστὸς, ἐπὶ τὸ ὄρος Σιών, and μετ’ αὐτοῦ
  rationale: Splitting the sentence makes the vision easier to follow while retaining its setting and standing-state image.
- pob_phrase: one hundred forty-four thousand who had his name and his Father’s name written
  simplified_phrase: 144,000 people. His name and his Father’s name were written
  preserved_meaning: The exact numbered group bears two distinct names as written inscriptions.
  reasoning_layer_used: POB lexical and theological decisions on the number and the two names
  rationale: Digits and two short sentences reduce complexity without merging or omitting either name.
interpretive_expansions:
- pob_phrase: one hundred forty-four thousand
  rendering: 144,000 people
  claim: The number refers to a group of people with names written on their foreheads.
  evidence:
  - The plural participle ἔχουσαι describes the numbered group as bearing the names.
  - The immediate image gives the group human foreheads.
  confidence: high
  alternatives_preserved:
  - 144,000
translation_notes:
  risk_flags:
