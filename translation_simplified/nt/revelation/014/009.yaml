  simplified_phrase: Then another angel—the third—followed them
  preserved_meaning: This is another angel and specifically the third in the sequence.
  reasoning_layer_used: Lexical decision for ἄλλος ἄγγελος τρίτος and narrative context
  rationale: “Then” and the dash make the sequence and apposition easier to follow.
- pob_phrase: saying with a loud voice
  simplified_phrase: He called out loudly
  preserved_meaning: The angel delivers an emphatic public proclamation.
  reasoning_layer_used: Lexical decision for λέγων ἐν φωνῇ μεγάλῃ
  rationale: A direct sentence replaces the awkward participial phrase without weakening its force.
- pob_phrase: on his forehead or on his hand
  simplified_phrase: on his forehead or hand
  preserved_meaning: The mark may be received at either of the two named locations.
  reasoning_layer_used: Lexical and theological decisions for ἐπὶ τοῦ μετώπου αὐτοῦ ἢ ἐπὶ τὴν χεῖρα αὐτοῦ
  rationale: Removing the repeated preposition gives natural English while retaining the generic singular pronoun.
