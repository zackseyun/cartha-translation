translation:
  language: en
  text: Then another angel—the third—followed them. He called out loudly, “If anyone worships[a] the beast and its image and receives a mark on his forehead or hand,[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “bows down to.” Here the action expresses worshipful allegiance to the beast.
    reason: lexical_alternative
  - marker: b
    text: The Greek says “his forehead or his hand,” using a singular masculine pronoun generically with “anyone.”
    reason: source_note
simplification_decisions:
