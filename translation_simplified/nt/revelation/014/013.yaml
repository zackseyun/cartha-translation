translation:
  language: en
  text: 'Then I heard a voice from heaven say, “Write this: From now on, blessed are those who die in the Lord.”


    “Yes,” says the Spirit, “so that they will rest from their hard labor, for their works go with them.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: a voice from heaven saying
  simplified_phrase: a voice from heaven say
  preserved_meaning: John hears a heavenly voice introduce the command.
  reasoning_layer_used: lexical decision for φωνῆς ἐκ τοῦ οὐρανοῦ λεγούσης
  rationale: An ordinary English speech construction replaces the awkward participle.
- pob_phrase: the dead who die in the Lord from now on
  simplified_phrase: From now on, blessed are those who die in the Lord
  preserved_meaning: The declared blessing applies from this point onward to people who die in the Lord.
  reasoning_layer_used: lexical and theological decisions for οἱ νεκροὶ, ἐν κυρίῳ, and ἀπ’ ἄρτι
  rationale: Removing the redundant English phrase “the dead who die” improves clarity while retaining “in the Lord” without narrowing it.
- pob_phrase: rest from their labors, for their works follow with them
  simplified_phrase: rest from their hard labor, for their works go with them
  preserved_meaning: Their wearisome effort ends, while their works accompany them.
  reasoning_layer_used: lexical and theological decisions for κόπων, ἔργα, and ἀκολουθεῖ μετ’ αὐτῶν
  rationale: “Hard labor” explains the toil involved, and “go with them” makes the accompanying image natural without defining the works as meritorious.
translation_notes:
  risk_flags:
  - risk: “Those who die” does not explicitly repeat POB’s noun “the dead.”
    mitigation: The same group is identified naturally in English by the act that characterizes them.
  - risk: “Works” may sound like a claim that deeds earn blessedness.
    mitigation: The wording only says that their works accompany them, preserving POB’s theological restraint.
