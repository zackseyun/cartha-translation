simplification_decisions:
- pob_phrase: And I saw another angel flying in midheaven
  simplified_phrase: Then I saw another angel flying high in the sky
  preserved_meaning: John sees an additional angel flying in the elevated heavenly expanse.
  reasoning_layer_used: POB lexical decision for ἐν μεσουρανήματι and its footnote
  rationale: The common phrase keeps the elevated sky image while the footnote preserves the term's apocalyptic character.
- pob_phrase: having an eternal gospel to proclaim
  simplified_phrase: He had an eternal gospel to proclaim
  preserved_meaning: The angel possesses the enduring gospel for the purpose of announcing it.
  reasoning_layer_used: POB lexical and theological decisions for εὐαγγέλιον αἰώνιον and εὐαγγελίσαι
  rationale: A new sentence replaces the difficult participial structure while retaining the source-driven term “gospel.”
- pob_phrase: to those who dwell on the earth, and to every nation and tribe and language and people
  simplified_phrase: to everyone living on earth—to every nation, tribe, language, and people
  preserved_meaning: The proclamation addresses all earth's inhabitants across every human group.
  reasoning_layer_used: POB idiom decision and fourfold universal-scope rationale
  rationale: “Everyone living” makes the inhabitant idiom immediate while preserving the complete four-part formula.
