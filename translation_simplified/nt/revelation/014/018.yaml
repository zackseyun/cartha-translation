translation:
  language: en
  text: 'Then another angel came from the altar. He had authority over the fire. In a loud voice, he called to the one with the sharp sickle: “Send out your sharp sickle[a] and gather the clusters from the vine of the earth[b], because its grapes are ripe.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Put in your sharp sickle.” The Greek verb literally means “send,” but “put in” is a natural expression for beginning a harvest.
    reason: lexical_alternative
  - marker: b
    text: “The vine of the earth” is a vision-image connected with judgment in this passage, but the verse does not directly say whom it represents.
    reason: cross_reference
simplification_decisions:
- pob_phrase: And another angel came out from the altar, the one who has authority over the fire
  simplified_phrase: Then another angel came from the altar. He had authority over the fire.
  preserved_meaning: The angel emerges in sequence from the heavenly altar and exercises authority over the fire.
  reasoning_layer_used: Lexical decisions for ἄλλος ἄγγελος, ἐκ τοῦ θυσιαστηρίου, and ὁ ἔχων ἐξουσίαν ἐπὶ τοῦ πυρός
  rationale: Two short sentences clarify the angel’s action and description without changing either idea.
- pob_phrase: and he called out with a loud voice to the one who had the sharp sickle, saying
  simplified_phrase: 'In a loud voice, he called to the one with the sharp sickle:'
  preserved_meaning: The angel loudly addresses the figure carrying the sharp sickle.
  reasoning_layer_used: Lexical decisions for ἐφώνησεν φωνῇ μεγάλῃ and τῷ ἔχοντι τὸ δρέπανον τὸ ὀξὺ
  rationale: A direct introduction to the quotation removes heavy clause stacking while retaining the explicit voice image.
- pob_phrase: gather the clusters of the vine of the earth
  simplified_phrase: gather the clusters from the vine of the earth
  preserved_meaning: The command gathers grape clusters while preserving the unexplained apocalyptic vine image.
  reasoning_layer_used: Lexical decisions for τρύγησον, τοὺς βότρυας, and τῆς ἀμπέλου τῆς γῆς; theological decision on metaphor
  rationale: “From” makes the harvesting relationship natural in English without identifying what the vine represents.
