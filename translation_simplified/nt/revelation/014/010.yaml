translation:
  language: en
  text: He too will drink the wine of God’s wrath from the cup of his anger. It has been prepared at full strength in the cup.[a] He will be tormented with fire and sulfur in the presence of the holy angels and the Lamb.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek describes wine that has been prepared but not watered down.
    reason: simplification_note
simplification_decisions:
- pob_phrase: he also will drink from the wine of God's wrath
  simplified_phrase: He too will drink the wine of God’s wrath
  preserved_meaning: The person also receives the judgment pictured as drinking wine.
  reasoning_layer_used: lexical decisions for αὐτός, πίεται, and ἐκ τοῦ οἴνου
  rationale: “He too” and the recast word order make the image natural without weakening its personal and additive force.
- pob_phrase: poured full strength into the cup of his anger
  simplified_phrase: from the cup of his anger. It has been prepared at full strength in the cup
  preserved_meaning: God’s anger is pictured as undiluted wine prepared in a cup.
  reasoning_layer_used: lexical and theological decisions for τοῦ κεκερασμένου ἀκράτου and τῆς ὀργῆς αὐτοῦ
  rationale: Two sentences clarify the difficult wine idiom while preserving the cup and the distinction between wrath and anger.
- pob_phrase: before the holy angels and before the Lamb
  simplified_phrase: in the presence of the holy angels and the Lamb
  preserved_meaning: The torment occurs in their sight and presence.
  reasoning_layer_used: lexical decision for ἐνώπιον
  rationale: “In the presence of” prevents readers from mistaking “before” for a time reference.
translation_notes:
  risk_flags:
  - risk: Splitting the wine-and-cup image into two sentences may make it feel less compact than the Greek.
    mitigation: The repeated cup reference keeps the preparation, full strength, and divine anger within one image.
