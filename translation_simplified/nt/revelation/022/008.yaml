translation:
  language: en
  text: I am John. I am hearing and seeing these things myself. When I heard and saw them, I fell down at the feet of the angel who was showing them to me, to worship.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “to bow down” or “to pay homage.” Here “worship” fits the usual meaning of the Greek verb in Revelation and the angel’s rebuke in the next verse.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And I, John, am the one hearing and seeing these things.
  simplified_phrase: I am John. I am hearing and seeing these things myself.
  preserved_meaning: John emphatically identifies himself as the person presently receiving the revelation by hearing and seeing it.
  reasoning_layer_used: Lexical decisions for Κἀγὼ and ὁ ἀκούων καὶ βλέπων.
  rationale: Two direct sentences replace the wooden participial construction while retaining its ongoing sense.
- pob_phrase: I fell down to worship before the feet of the angel
  simplified_phrase: I fell down at the feet of the angel ... to worship.
  preserved_meaning: John physically falls before the angel in an act presented as worship.
  reasoning_layer_used: Lexical and theological decisions for ἔπεσα, προσκυνῆσαι, and ἔμπροσθεν τῶν ποδῶν.
  rationale: The idiomatic wording preserves the physical image and the seriousness of the mistaken act.
- pob_phrase: the angel who was showing me these things
  simplified_phrase: the angel who was showing them to me
  preserved_meaning: The angel John approached was still serving as the one showing him the revelation.
  reasoning_layer_used: Lexical decision for τοῦ δεικνύοντός μοι ταῦτα and the grounding review.
  rationale: Keeping the description attached to “the angel” preserves its direct relationship to the worship scene.
translation_notes:
  risk_flags:
  - risk: The shift from present “am hearing and seeing” to past “heard and saw” may sound unusual.
    mitigation: The wording follows the POB audit’s deliberate distinction between the Greek present participles and past-tense verbs.
  - risk: The phrase “to worship” could be read as purpose without an explicit object.
    mitigation: Its placement after falling at the angel’s feet retains the source connection, while the footnote and next verse preserve the narrative tension.
