translation:
  language: en
  text: There will never be night again. They will not need light from lamps or from the sun, because the Lord God will shine on them. They will reign forever and ever.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And night will be no more
  simplified_phrase: There will never be night again.
  preserved_meaning: Night will cease and not return in the final state.
  reasoning_layer_used: Lexical decision for οὐκ ἔσται ἔτι and the future-vision context
  rationale: The new sentence states the same cessation in more direct modern English.
- pob_phrase: they will have no need of lamplight or sunlight
  simplified_phrase: They will not need light from lamps or from the sun
  preserved_meaning: Neither artificial light nor the sun's light will be needed.
  reasoning_layer_used: Lexical decisions for οὐκ ἔχουσιν χρείαν, φωτὸς λύχνου, and φῶς ἡλίου
  rationale: The wording makes both sources of light immediately clear while retaining the future sense.
- pob_phrase: because the Lord God will shine on them, and they will reign forever and ever
  simplified_phrase: because the Lord God will shine on them. They will reign forever and ever.
  preserved_meaning: God will be their light, and they will rule without end.
  reasoning_layer_used: Lexical decisions for φωτίσει ἐπ’ αὐτούς, βασιλεύσουσιν, and the eternal-duration idiom
  rationale: Dividing the clauses improves readability without weakening the light image or eternal reign.
