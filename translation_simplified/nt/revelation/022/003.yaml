  rationale: The shorter sentence preserves both the comprehensive scope and the future removal.
- pob_phrase: in it
  simplified_phrase: in the city
  preserved_meaning: The throne will be located in the new Jerusalem.
  reasoning_layer_used: Lexical decision for ἐν αὐτῇ and discourse context
