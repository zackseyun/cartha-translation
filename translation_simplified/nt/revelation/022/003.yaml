- pob_phrase: his slaves will worship him
  simplified_phrase: his slaves will worship him
  preserved_meaning: Those who belong wholly to him will render sacred worship to him.
  reasoning_layer_used: Lexical and theological decisions for δοῦλοι, λατρεύσουσιν, and the singular pronouns
