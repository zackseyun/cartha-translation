translation:
  language: en
  text: The Spirit and the bride say, “Come!”[a] Let anyone who hears say, “Come!” Let anyone who is thirsty come. Let anyone who wants it take the water of life without cost.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The first two calls may be asking the Lord to come. The rest of the verse invites people to come and receive life.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: And the Spirit and the bride say
  simplified_phrase: The Spirit and the bride say
  preserved_meaning: The Spirit and the symbolic bride speak together.
  reasoning_layer_used: Lexical and theological decisions
  rationale: Dropping the opening “And” creates a natural English opening while preserving both speakers and the bride image.
- pob_phrase: the one who hears / the one who is thirsty
  simplified_phrase: anyone who hears / anyone who is thirsty
  preserved_meaning: The calls apply generally to every person described.
  reasoning_layer_used: Lexical decisions
  rationale: “Anyone who” expresses the generic singular naturally without changing its scope.
- pob_phrase: the one who desires take the water of life freely
  simplified_phrase: anyone who wants it take the water of life without cost
  preserved_meaning: Anyone desiring the offered water may take it as a free gift.
  reasoning_layer_used: Lexical decisions for ὁ θέλων and δωρεάν
  rationale: “Wants it” supplies the clear contextual object, and “without cost” plainly states that the gift is free.
interpretive_expansions:
- pob_phrase: the one who desires
  rendering: anyone who wants it
  claim: The desire is for the water of life offered in the same clause.
  evidence:
  - The immediate clause names the water of life as what the willing person may take.
  - The POB lexical rationale permits making the offered gift the object of desire.
  confidence: high
translation_notes:
  risk_flags:
  - risk: Readers may assume every call to “Come” has the same addressee.
    mitigation: The footnote preserves the likely shift from asking the Lord to come to inviting thirsty people.
