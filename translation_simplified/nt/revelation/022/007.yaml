translation:
  language: en
  text: Pay attention! I am coming soon.[a] Blessed is anyone who keeps the words of this book’s prophecy.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “quickly”; the Greek may refer to coming soon or coming swiftly and suddenly.
    reason: lexical_alternative
  - marker: b
    text: The ancient book would have been a scroll.
    reason: cultural_note
simplification_decisions:
- pob_phrase: And behold
  simplified_phrase: Pay attention!
  preserved_meaning: The speaker solemnly calls readers to notice what follows.
  reasoning_layer_used: Lexical decision for ἰδού
  rationale: This gives the attention-commanding force in direct modern English.
- pob_phrase: the one who keeps
  simplified_phrase: anyone who keeps
  preserved_meaning: The blessing applies generally to every person who guards and observes these words.
  reasoning_layer_used: Lexical decision for ὁ τηρῶν
  rationale: “Anyone” makes the generic sense clear without narrowing “keeps” to obedience alone.
- pob_phrase: the words of the prophecy of this book
  simplified_phrase: the words of this book’s prophecy
  preserved_meaning: The words belong to the prophecy presented by this book.
  reasoning_layer_used: Source syntax and lexical decisions for λόγους, προφητείας, and βιβλίου τούτου
  rationale: The possessive wording preserves the linked relationship while avoiding a dense chain of “of” phrases.
translation_notes:
  risk_flags:
  - risk: “Pay attention” is less elevated than “behold.”
    mitigation: The exclamation preserves the solemn call for attention.
  - risk: Modern readers may picture a bound volume when they read “book.”
    mitigation: The footnote explains that the ancient form was a scroll.
