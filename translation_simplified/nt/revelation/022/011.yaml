- pob_phrase: the one who does wrong
  simplified_phrase: anyone who does wrong
  preserved_meaning: The wording still describes any person characterized by wrongdoing.
  reasoning_layer_used: lexical decision for ὁ ἀδικῶν
  rationale: “Anyone” expresses the generic personal force in natural English.
- pob_phrase: the righteous still practice righteousness
  simplified_phrase: anyone who is righteous still do what is right
  preserved_meaning: Righteous people are told to continue acting righteously.
  reasoning_layer_used: lexical decisions for δικαιοσύνην and ποιησάτω
  rationale: “Do what is right” makes active righteous conduct immediately understandable.
- pob_phrase: and ... and ... and
  simplified_phrase: four short parallel sentences
  preserved_meaning: All four contrasting commands retain equal force and repeated “still.”
  reasoning_layer_used: theological decision on imperative force
  rationale: Short sentences clarify the solemn four-part contrast without changing the commands.
interpretive_expansions:
- pob_phrase: the filthy
  rendering: anyone who is morally filthy
  claim: The filth refers to moral defilement rather than physical dirt.
  evidence:
