translation:
  language: en
  text: I, Jesus, have sent my angel to testify to you about these things for the churches.[a] I am David’s root and his descendant.[b] I am the bright morning star.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also mean “in the churches” or “concerning the churches.”
    reason: lexical_alternative
  - marker: b
    text: Or “his offspring.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: to testify to you these things
  simplified_phrase: to testify to you about these things
  preserved_meaning: The angel bears witness to the contents of the revelation.
  reasoning_layer_used: Lexical decision for μαρτυρῆσαι and ταῦτα
  rationale: Adding “about” makes the testimony construction natural in modern English without changing its object.
- pob_phrase: the root and the descendant of David
  simplified_phrase: David’s root and his descendant
  preserved_meaning: Jesus is presented as both prior to David and descended from him.
  reasoning_layer_used: Messianic-Davidic theological decision
  rationale: The possessive wording is easier to follow while preserving the root image and its paradox.
- pob_phrase: the bright morning star
  simplified_phrase: I am the bright morning star
  preserved_meaning: Jesus directly identifies himself by this vivid messianic title.
  reasoning_layer_used: Christological title decision
  rationale: A separate sentence makes the final title clear and emphatic without explaining it away.
translation_notes:
  risk_flags:
  - risk: “David’s root” may sound unusual to readers unfamiliar with biblical imagery.
    mitigation: The concrete root image is retained because it carries the verse’s deliberate theological tension.
  - risk: “For the churches” does not express every possible nuance of the Greek preposition.
    mitigation: The footnote preserves the important alternatives without narrowing the main text further.
