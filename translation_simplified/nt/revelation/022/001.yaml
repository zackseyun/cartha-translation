simplification_decisions:
- pob_phrase: And he showed me
  simplified_phrase: Then he showed me
  preserved_meaning: The guide continues showing John the vision.
  reasoning_layer_used: POB lexical decision for ἔδειξέν and narrative context
  rationale: “Then” marks the next event naturally without changing the visionary action.
- pob_phrase: a river of the water of life, bright as crystal
  simplified_phrase: a river of the water of life. It was bright like crystal
  preserved_meaning: The life-water imagery and crystal-bright comparison remain distinct.
  reasoning_layer_used: POB lexical decisions for ὕδατος ζωῆς, λαμπρόν, and ὡς κρύσταλλον
  rationale: A new sentence makes the description easier to follow while preserving both images.
- pob_phrase: flowing out from the throne of God and of the Lamb
  simplified_phrase: flowed from the throne of God and the Lamb
  preserved_meaning: The river comes from the one throne associated with both God and the Lamb.
  reasoning_layer_used: POB lexical decision for ἐκπορευόμενον and shared-throne theological decision
  rationale: The finite verb is more natural English, and the singular throne remains explicit.
