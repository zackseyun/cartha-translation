translation:
  language: en
  text: He said to me, “These words are true and can be trusted. The Lord, the God of the spirits of the prophets, sent his angel to show his slaves[b] what must happen soon.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “what must happen quickly.” The Greek can refer either to how soon the events begin or to how quickly they occur.
    reason: alternative_reading
  - marker: b
    text: Or “servants” or “bondservants.” Here “slaves” emphasizes that they belong to God.
    reason: lexical_alternative
