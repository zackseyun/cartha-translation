simplification_decisions:
- pob_phrase: Behold
  simplified_phrase: Look!
  preserved_meaning: The solemn command calls the hearer’s attention to what follows.
  reasoning_layer_used: POB lexical decision for Ἰδοὺ
  rationale: “Look!” uses a listed alternative that is clearer to readers unfamiliar with “behold.”
- pob_phrase: Behold, I am coming soon, and my reward is with me
  simplified_phrase: Look! I am coming soon. My reward is with me
  preserved_meaning: The speaker announces his imminent coming and says that his reward accompanies him.
  reasoning_layer_used: POB lexical decisions and optimal-equivalence philosophy
  rationale: Short sentences make the announcement easier to follow without weakening its urgency.
- pob_phrase: to repay each one according to what his work is
  simplified_phrase: I will repay each one according to his work
  preserved_meaning: Each individual receives recompense corresponding to his work.
  reasoning_layer_used: POB lexical and theological decisions on ἀποδοῦναι and individual recompense
  rationale: A direct finite clause removes awkward wording while retaining “repay,” “each one,” and “his work.”
translation_notes:
  risk_flags:
  - risk: “Look!” is less elevated than POB’s “Behold.”
    mitigation: The exclamation preserves the prophetic attention-getting force in common English.
  - risk: “Reward” may be heard as only positive recompense.
    mitigation: The main text retains POB’s chosen term and does not impose a doctrinal conclusion beyond the verse.
