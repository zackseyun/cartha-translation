translation:
  language: en
  text: The tree of life stood in the middle of the city’s street and on this side and that side of the river. It bore twelve fruits, giving its fruit each month.[a] Its leaves are for the healing of the nations.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The phrase may mean twelve kinds of fruit or a complete, abundant cycle of fruitfulness.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: in the middle of its street
  simplified_phrase: in the middle of the city’s street
  preserved_meaning: The tree is located within the city’s street.
  reasoning_layer_used: POB lexical decision for πλατείας and immediate city context
  rationale: Naming the city makes the unclear pronoun “its” immediately understandable.
- pob_phrase: bearing twelve fruits, yielding its fruit each month
  simplified_phrase: It bore twelve fruits, giving its fruit each month
  preserved_meaning: The tree regularly produces twelve fruits on a monthly cycle.
  reasoning_layer_used: POB lexical decisions and applied revision
  rationale: A new sentence and common verb make the recurring fruitfulness easier to follow.
- pob_phrase: And the leaves of the tree are for the healing of the nations
  simplified_phrase: Its leaves are for the healing of the nations
  preserved_meaning: The tree’s leaves serve to heal the nations.
  reasoning_layer_used: POB lexical decisions for θεραπείαν and ἐθνῶν
  rationale: The pronoun removes repetition while retaining the healing and worldwide scope.
translation_notes:
  risk_flags:
  - risk: The singular tree appears both in the street and on the two sides of the river.
    mitigation: The wording preserves the Greek text’s compressed visionary geography without explaining it away.
  - risk: “Twelve fruits” may be read as only twelve individual pieces of fruit.
    mitigation: The footnote preserves the possible senses of twelve kinds or a full cycle of fruitfulness.
