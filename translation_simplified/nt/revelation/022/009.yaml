  text: He said to me, “Do not do that! Like you, I am a servant under God.[a] Your brothers the prophets, and everyone who keeps the words of this book, are also his servants. Worship God.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word may also be translated “fellow servant,” but it stresses shared slave-status under God.
    reason: lexical_alternative
