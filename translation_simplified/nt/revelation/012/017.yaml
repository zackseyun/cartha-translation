translation:
  language: en
  text: The dragon became furious with the woman. It went away to wage war against the rest of her offspring—those who obey God’s commandments and hold to the testimony of Jesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may mean “the testimony about Jesus” or “Jesus’ own testimony.” The Greek wording can mean either.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: became enraged
  simplified_phrase: became furious
  preserved_meaning: The dragon’s anger intensifies into a hostile reaction.
  reasoning_layer_used: Lexical decision for ὠργίσθη and the apocalyptic context.
  rationale: “Became furious” is immediate common English without weakening the anger.
- pob_phrase: went away to make war with
  simplified_phrase: went away to wage war against
  preserved_meaning: The dragon departs in order to attack the woman’s remaining offspring.
  reasoning_layer_used: Lexical decisions for ἀπῆλθεν, ποιῆσαι πόλεμον, and μετά.
  rationale: “Wage war against” expresses the adversarial Greek construction naturally.
- pob_phrase: those who keep the commandments of God
  simplified_phrase: those who obey God’s commandments
  preserved_meaning: The offspring faithfully observe what God commands.
  reasoning_layer_used: Lexical decisions for τηρέω and ἐντολαί.
  rationale: “Obey” makes faithful observance clear while retaining “commandments.”
translation_notes:
  risk_flags:
  - risk: “The testimony of Jesus” remains unclear in English because the Greek genitive is genuinely ambiguous.
    mitigation: The main text preserves the ambiguity, and the footnote gives both principal readings.
