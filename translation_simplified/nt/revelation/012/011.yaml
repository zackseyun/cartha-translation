translation:
  language: en
  text: They conquered him[a] by the blood of the Lamb and by the message they testified to. They did not love their own lives[b] so much that they were unwilling to die.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “overcame him.”
    reason: lexical_alternative
  - marker: b
    text: The Greek word can also mean “soul” or “self”; here it refers to their earthly lives.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the word of their testimony
  simplified_phrase: the message they testified to
  preserved_meaning: Their spoken witness was the message through which they conquered.
  reasoning_layer_used: Lexical rationale for λόγον τῆς μαρτυρίας αὐτῶν
  rationale: This replaces an opaque phrase while preserving both the message and the act of testifying.
- pob_phrase: their life
  simplified_phrase: their own lives
  preserved_meaning: Each believer was willing to surrender earthly life.
  reasoning_layer_used: Lexical and theological decisions for ψυχή
  rationale: The natural English plural keeps the Greek distributive sense without suggesting a body-soul contrast.
- pob_phrase: even unto death
  simplified_phrase: so much that they were unwilling to die
  preserved_meaning: They did not cling to life when faithfulness led to death.
  reasoning_layer_used: Lexical rationale for ἄχρι θανάτου and martyrdom context
  rationale: The recast clause clearly expresses willingness to face death while retaining the verb “love.”
interpretive_expansions:
- pob_phrase: they did not love their life even unto death
  rendering: They did not love their own lives so much that they were unwilling to die.
  claim: Their loyalty was not abandoned in order to preserve their earthly lives.
  evidence:
  - The POB rationale identifies willingness to die as the contextual sense.
  - The phrase “unto death” marks dying as the limit of their self-giving.
  confidence: high
  alternatives_preserved:
  - They did not love their lives even to the point of death.
  - They did not hold their lives dear when facing death.
translation_notes:
  risk_flags:
  - risk: The final clause could be misread as contempt for life or a desire for death.
    mitigation: The wording frames death as something they were willing to face, not something they sought.
