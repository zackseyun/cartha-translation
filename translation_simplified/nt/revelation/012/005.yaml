translation:
  language: en
  text: She gave birth to a son—a male child. He is about to shepherd[a] all the nations with an iron rod. Then her child was snatched up to God and to his throne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “rule.” The word means “shepherd,” but here it also describes royal authority, echoing Psalm 2.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: And she gave birth to a son, a male child, who is about to shepherd
  simplified_phrase: She gave birth to a son—a male child. He is about to shepherd
  preserved_meaning: The wording keeps both descriptions of the child and the future-oriented force of his mission.
  reasoning_layer_used: POB lexical decisions for υἱόν, ἄρσεν and μέλλει ποιμαίνειν
  rationale: Two sentences make the child and his mission easier to follow without removing the deliberate emphasis.
- pob_phrase: and her child was snatched up
  simplified_phrase: Then her child was snatched up
  preserved_meaning: The child is suddenly and forcefully taken upward.
  reasoning_layer_used: POB lexical decision for ἡρπάσθη
  rationale: “Then” clearly marks the next event while “snatched up” preserves its abrupt force.
translation_notes:
  risk_flags:
  - risk: “About to” may sound more immediately chronological than the apocalyptic context requires.
    mitigation: It is retained because the controlling POB decision preserves the force of μέλλει rather than reducing it to a simple future.
  - risk: Modern readers may understand “shepherd” only as animal care.
    mitigation: The footnote preserves the Psalm 2 sense of royal rule while keeping the source metaphor in the text.
