simplification_decisions:
- pob_phrase: the great dragon was thrown down—the ancient serpent
  simplified_phrase: The great dragon was thrown down. He is the ancient serpent
  preserved_meaning: The dragon is forcibly expelled and identified as the ancient serpent.
  reasoning_layer_used: POB lexical decisions for ἐβλήθη and ὁ ὄφις ὁ ἀρχαῖος
  rationale: Two sentences make the identification easier to follow while preserving the downward force and serpent image.
- pob_phrase: the one called the Devil and Satan
  simplified_phrase: called the Devil and Satan
  preserved_meaning: The dragon bears both recognized names without further doctrinal explanation.
  reasoning_layer_used: POB theological decision on Διάβολος and Σατανᾶς
  rationale: Removing “the one” produces natural English while keeping both titles in apposition.
- pob_phrase: He was thrown down to the earth, and his angels were thrown down with him.
  simplified_phrase: He was thrown down to the earth, and his angels were thrown down with him.
  preserved_meaning: The repeated verb emphasizes that both the dragon and his angels are forcibly expelled to earth.
  reasoning_layer_used: POB lexical decisions for ἐβλήθη, ἐβλήθησαν, γῆ, and ἄγγελοι
  rationale: The repetition remains because it carries deliberate emphasis and is already clear.
