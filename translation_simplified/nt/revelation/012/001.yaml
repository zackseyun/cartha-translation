translation:
  language: en
  text: A great sign appeared in heaven. It was a woman clothed with the sun. The moon was under her feet, and on her head she wore a crown[a] of twelve stars.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a wreath” or “a victor’s crown.” The Greek word refers to a wreath-like crown, not a royal diadem.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: 'And a great sign appeared in heaven: a woman'
  simplified_phrase: A great sign appeared in heaven. It was a woman
  preserved_meaning: The woman is presented as the great symbolic sign seen in heaven.
  reasoning_layer_used: Lexical decision for σημεῖον and theological decision not to identify the woman
  rationale: Two sentences make the visionary introduction easier to follow without explaining the woman’s identity.
- pob_phrase: and the moon under her feet
  simplified_phrase: The moon was under her feet
  preserved_meaning: The moon remains spatially beneath the woman’s feet.
  reasoning_layer_used: Lexical decision for ἡ σελήνη ὑποκάτω τῶν ποδῶν αὐτῆς
  rationale: Adding a verb turns the compressed image into a complete English sentence.
- pob_phrase: and on her head a crown of twelve stars
  simplified_phrase: and on her head she wore a crown of twelve stars
  preserved_meaning: A twelve-star crown rests on the woman’s head.
  reasoning_layer_used: Lexical decisions for στέφανος and ἀστέρων δώδεκα
  rationale: The ordinary verb “wore” clarifies the image while the footnote preserves the crown’s specific nuance.
translation_notes:
  risk_flags:
  - risk: Readers may assume the woman is one specific biblical or ecclesial figure.
    mitigation: The text describes her without identifying her, preserving the POB’s theological restraint.
  - risk: The word “crown” may suggest a royal diadem.
    mitigation: The footnote explains that the Greek term refers to a wreath-like or victor’s crown.
