translation:
  language: en
  text: So rejoice, heavens, and all who live there! But terrible trouble awaits the earth and the sea,[a] because the devil has come down to you in great fury. He knows that he has only a little time.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the land and the sea.” Here “earth” fits the passage’s cosmic scope.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Therefore
  simplified_phrase: So
  preserved_meaning: The command follows from the heavenly victory described earlier.
  reasoning_layer_used: POB lexical decision for διὰ τοῦτο
  rationale: “So” keeps the logical connection in more natural everyday English.
- pob_phrase: O heavens, and you who dwell in them
  simplified_phrase: heavens, and all who live there
  preserved_meaning: The heavens and their inhabitants are directly commanded to rejoice.
  reasoning_layer_used: POB lexical decisions for οἱ οὐρανοὶ and οἱ ἐν αὐτοῖς σκηνοῦντες
  rationale: This removes the formal “O” and replaces “dwell” with the clearer “live.”
- pob_phrase: Woe to the earth and the sea
  simplified_phrase: terrible trouble awaits the earth and the sea
  preserved_meaning: The prophetic warning announces severe peril for the earthly realm.
  reasoning_layer_used: POB lexical decision for οὐαὶ and theological decision on the earthly addressee
  rationale: The warning is stated directly for readers unfamiliar with the biblical term “woe.”
