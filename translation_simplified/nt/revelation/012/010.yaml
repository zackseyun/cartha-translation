translation:
  language: en
  text: Then I heard a loud voice in heaven say, “Now the salvation, power, and kingdom of our God have come. The authority of his Messiah[a] has also come. This is because the accuser of our brothers[b] has been thrown down. He is the one who accuses them before our God day and night.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Christ.” Messiah means God’s Anointed One.
    reason: lexical_alternative
  - marker: b
    text: “Brothers” may refer to fellow believers as a whole, including women as well as men.
    reason: cultural_note
simplification_decisions:
- pob_phrase: And I heard a loud voice in heaven saying
  simplified_phrase: Then I heard a loud voice in heaven say
  preserved_meaning: John hears a loud heavenly voice begin a proclamation.
  reasoning_layer_used: POB lexical decisions for φωνὴν μεγάλην and ἐν τῷ οὐρανῷ
  rationale: The finite verb “say” is more natural than the participle “saying.”
- pob_phrase: Now have come the salvation and the power and the kingdom of our God, and the authority of his Messiah
  simplified_phrase: Now the salvation, power, and kingdom of our God have come. The authority of his Messiah has also come.
  preserved_meaning: God’s salvation, effective power, royal rule, and his Messiah’s rightful authority have now arrived decisively.
  reasoning_layer_used: POB lexical decisions for ἐγένετο, βασιλεία, ἐξουσία, and Χριστός
  rationale: Two sentences make the long series easier to follow while keeping power and authority distinct.
- pob_phrase: because the accuser of our brothers has been thrown down, the one who accuses them
  simplified_phrase: This is because the accuser of our brothers has been thrown down. He is the one who accuses them
  preserved_meaning: The proclamation follows the accuser’s forcible defeat, and his continual accusing role is identified.
  reasoning_layer_used: POB lexical decisions for ὅτι, ἐβλήθη, κατήγωρ, and the present participle κατηγορῶν
  rationale: Separate sentences clarify the cause and identify the accuser without weakening the image of being thrown down.
translation_notes:
  risk_flags:
  - risk: Splitting the compound declaration may slightly reduce its cumulative rhetorical force.
    mitigation: The repeated “have come” keeps the proclamation’s decisive arrival and parallel structure.
