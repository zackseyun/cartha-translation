  preserved_meaning: The tail remains the agent of both actions, and the POB tense shift is retained.
  reasoning_layer_used: source payload, POB translation, and applied revision
  rationale: The sentence break clarifies the image without changing the protected past-tense verb.
- pob_phrase: stood before the woman
  simplified_phrase: stood in front of the woman
  preserved_meaning: The dragon positions himself directly before the woman.
  reasoning_layer_used: POB translation
  rationale: “In front of” states the spatial relationship in common English.
- pob_phrase: so that when she gave birth, he might devour her child
  simplified_phrase: so that he could devour her child when it was born
  preserved_meaning: The dragon waits intending to consume the child at birth.
  reasoning_layer_used: source payload and POB translation
  rationale: The reordered clause preserves both the dragon’s purpose and the timing.
