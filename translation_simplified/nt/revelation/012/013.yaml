translation:
  language: en
  text: When the dragon realized that he had been thrown down to the earth, he chased after the woman who gave birth to the male child.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Chased after” can also mean “persecuted”; the Greek word likely includes both ideas here.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: saw that he had been thrown down
  simplified_phrase: realized that he had been thrown down
  preserved_meaning: The dragon became aware that he had been forcibly expelled to the earth.
  reasoning_layer_used: POB translation and lexical decision for ἐβλήθη
  rationale: “Realized” clearly expresses his recognition of what had happened.
- pob_phrase: he pursued the woman
  simplified_phrase: he chased after the woman
  preserved_meaning: The dragon actively and hostilely pursued the woman, with persecution also in view.
  reasoning_layer_used: POB lexical decision and footnote for ἐδίωξεν
  rationale: “Chased after” is clear modern English and retains the action’s hostile force.
- pob_phrase: who had given birth to the male child
  simplified_phrase: who gave birth to the male child
  preserved_meaning: The woman had previously delivered the male child.
  reasoning_layer_used: POB lexical and theological decisions for ἔτεκεν and τὸν ἄρσενα
  rationale: The simple past is natural here and does not identify the symbolic figures.
translation_notes:
  risk_flags:
  - risk: “Realized” is less visually literal than “saw.”
    mitigation: It preserves the contextual sense that the dragon recognized his expulsion.
  - risk: “Chased after” may not by itself convey the full sense of persecution.
    mitigation: The footnote preserves that lexical possibility without obscuring the concrete pursuit.
