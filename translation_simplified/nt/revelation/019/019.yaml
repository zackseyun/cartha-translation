translation:
  language: en
  text: Then I saw the beast, the kings of the earth, and their armies gathered to wage war against the one sitting on the horse and against his army.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And I saw
  simplified_phrase: Then I saw
  preserved_meaning: John reports the next event in his vision.
  reasoning_layer_used: Immediate narrative context and source conjunction καί.
  rationale: “Then” gives the sequence in natural English.
- pob_phrase: to make war against
  simplified_phrase: to wage war against
  preserved_meaning: The assembled forces intend hostile warfare against their opponents.
  reasoning_layer_used: Lexical decision for ποιῆσαι τὸν πόλεμον and the contextual adversative force of μετά.
  rationale: “Wage war” is clear modern English with the same military force.
- pob_phrase: the one seated on the horse
  simplified_phrase: the one sitting on the horse
  preserved_meaning: The figure remains descriptively identified without adding a christological title.
  reasoning_layer_used: Lexical decision for τοῦ καθημένου and the theological decision to preserve the description.
  rationale: “Sitting” is more common than “seated” without interpreting the figure further.
translation_notes:
  risk_flags:
  - risk: “Gathered” could be read as active or passive in English.
    mitigation: Keeping it as a modifier preserves the state of assembly without naming an agent.
