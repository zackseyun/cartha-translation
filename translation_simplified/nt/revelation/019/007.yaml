  rationale: Common wording replaces “exult” without reducing the force of the paired verbs.
- pob_phrase: the marriage of the Lamb has come
  simplified_phrase: the Lamb’s marriage has come
  preserved_meaning: The proclaimed marriage has arrived and now has present significance.
  reasoning_layer_used: POB lexical decision for γάμος and ἦλθεν
  rationale: The possessive form is easier to read while retaining the marriage image and completed arrival.
