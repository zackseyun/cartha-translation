translation:
  language: en
  text: Let us rejoice and celebrate with great joy! Let us give glory to him,[a] because the Lamb’s marriage has come, and his bride[b] has made herself ready.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “we will give glory to him.” The Greek form is future, but it likely continues the call to rejoice and celebrate.
    reason: alternative_reading
  - marker: b
    text: Or, “wife.” The Greek word can mean “woman,” “wife,” or, in a wedding setting, “bride.”
    reason: lexical_alternative
