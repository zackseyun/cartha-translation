  preserved_meaning: John sees one specific angel in the striking apocalyptic location, and the angel speaks forcefully.
  reasoning_layer_used: Lexical and theological decisions on ἕνα ἄγγελον, ἑστῶτα ἐν τῷ ἡλίῳ, and ἔκραξεν
  rationale: Two sentences clarify the vision while preserving its vivid image and force.
- pob_phrase: all the birds flying in midheaven
  simplified_phrase: all the birds flying in the middle of the sky
  preserved_meaning: The summons addresses every bird flying in the central region of the sky.
  reasoning_layer_used: Lexical decision on πᾶσι τοῖς ὀρνέοις and μεσουράνημα
  rationale: Plain wording preserves the specific mid-sky image without a technical term.
- pob_phrase: the great supper of God
  simplified_phrase: God’s great supper
  preserved_meaning: The meal belongs to or is appointed by God, while “supper” retains the contextual link with the marriage supper.
  reasoning_layer_used: Lexical decision on εἰς τὸ δεῖπνον τὸ μέγα τοῦ θεοῦ
  rationale: The possessive form is natural English and keeps the same relationship.
