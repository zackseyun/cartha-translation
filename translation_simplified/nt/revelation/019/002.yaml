translation:
  language: en
  text: This is because his judgments are true and just. He judged the great prostitute, who corrupted the earth through her sexual immorality. He also avenged the blood of his servants[a] at her hand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “servants.” The Greek word can mean either “slave” or “servant”; “slave” emphasizes that they belong fully to God.
    reason: alternative_reading
