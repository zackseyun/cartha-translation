  preserved_meaning: God’s judgment of the great prostitute is a reason his judgments are praised as true and just.
  reasoning_layer_used: POB syntax and lexical decisions for κρίσεις, ἀληθιναί, and δίκαιαι
  rationale: Shorter sentences make the logic easier to follow while preserving the judicial meaning.
- pob_phrase: corrupted the earth with her sexual immorality
  simplified_phrase: corrupted the earth through her sexual immorality
  preserved_meaning: Her sexual immorality was the means by which she corrupted the earth.
  reasoning_layer_used: POB lexical rationale for ἔφθειρεν and πορνείᾳ
  rationale: “Through” expresses the means naturally while retaining both source ideas.
- pob_phrase: avenged the blood of his slaves from her hand
  simplified_phrase: avenged the blood of his slaves at her hand
  preserved_meaning: God carried out justice for his slain slaves against the one responsible for their blood.
  reasoning_layer_used: POB lexical rationale for ἐξεδίκησεν and ἐκ χειρὸς αὐτῆς, plus the theological decision on δοῦλοι
  rationale: “At her hand” clarifies her agency without replacing the source idiom with a stronger statement of guilt.
