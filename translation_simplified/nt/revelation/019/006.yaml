translation:
  language: en
  text: Then I heard what sounded like a vast crowd. Their voices were like the roar of many waters and the crash of mighty thunder. They were saying, “Hallelujah! For the Lord God, the Almighty,[a] has begun to reign.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some manuscripts read “the Lord our God, the Almighty.” The printed Greek text reads more literally, “the Lord, the God, the Almighty.”
    reason: textual_variant
  - marker: b
    text: The Greek may also be translated “reigns,” “has reigned,” or “has become king”; here it celebrates God’s reign being decisively revealed.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the voice of a great multitude
  simplified_phrase: the voices of a vast crowd
  preserved_meaning: A very large assembled group is heard proclaiming praise.
  reasoning_layer_used: POB lexical decision for ὄχλου πολλοῦ and φωνή
  rationale: “Vast crowd” and “voices” make the collective proclamation immediately clear.
- pob_phrase: like the voice of many waters
  simplified_phrase: like the roar of many waters
  preserved_meaning: The crowd’s sound is compared with overwhelming waters.
  reasoning_layer_used: POB lexical decision for ὡς and ὑδάτων πολλῶν
  rationale: “Roar” clarifies the auditory image while retaining “many waters.”
- pob_phrase: like the voice of mighty thunders
  simplified_phrase: the crash of mighty thunder
  preserved_meaning: The proclamation is compared with powerful thunder.
  reasoning_layer_used: POB lexical decision for βροντῶν ἰσχυρῶν
  rationale: “Crash of mighty thunder” expresses the image in natural modern English.
translation_notes:
  risk_flags:
  - risk: “Has begun to reign” could imply that God did not rule before this moment.
    mitigation: Footnote b explains that the phrase refers to the decisive revelation of God’s reign.
  - risk: The record differs over whether the text should say “God” or “our God.”
    mitigation: The main text follows the printed Greek, while footnote a preserves the manuscript variant.
