simplification_decisions:
- pob_phrase: And he says to me
  simplified_phrase: Then he said to me
  preserved_meaning: The speaker addresses John personally as the narrative continues.
  reasoning_layer_used: source syntax and narrative context
  rationale: Ordinary past-tense narration is easier to follow than the Greek historical present.
- pob_phrase: those who have been invited to the wedding supper of the Lamb
  simplified_phrase: those invited to the Lamb’s wedding supper
  preserved_meaning: The guests have received an invitation to the Lamb’s celebratory meal.
  reasoning_layer_used: lexical and theological decisions on κεκλημένοι, γάμου, and ἀρνίον
  rationale: The shorter wording preserves the invitation, wedding image, and title “Lamb.”
- pob_phrase: These are the true words of God
  simplified_phrase: These are God’s true words
  preserved_meaning: The words belong to God and are true and reliable.
  reasoning_layer_used: lexical decisions on ἀληθινοὶ and τοῦ θεοῦ
  rationale: The possessive form is more natural English without changing the claim.
translation_notes:
  risk_flags:
  - risk: “Invited” may obscure the more literal “called” and its possible theological resonance.
    mitigation: Footnote a preserves the lexical alternative without imposing effectual calling.
  - risk: “God’s true words” could suggest only ownership rather than divine source and reliability.
    mitigation: Footnote c preserves the documented sense of reliability and divine source.
