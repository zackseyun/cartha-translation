translation_notes:
  risk_flags:
  - risk: “Containing” makes the relationship between the winepress and wine more explicit than the POB wording.
    mitigation: It does not identify the wine itself with fury or resolve how the following genitives relate.
  - risk: Modern readers may hear “shepherd” as only gentle care.
    mitigation: The iron rod preserves the judicial force, and the footnote gives “rule” as an alternative.
