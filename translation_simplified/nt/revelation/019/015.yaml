translation:
  language: en
  text: A sharp sword comes from his mouth so that he may strike the nations with it. He himself will shepherd[a] them with an iron rod. He himself treads the winepress containing the wine of the fury of the wrath of God the Almighty.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “rule.” The Greek literally says “shepherd,” combining the images of a ruler and a shepherd.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: And from his mouth comes a sharp sword, so that with it he may strike the nations
  simplified_phrase: A sharp sword comes from his mouth so that he may strike the nations with it.
  preserved_meaning: The sword comes from his mouth as the means by which he strikes the nations.
  reasoning_layer_used: POB lexical decisions for ἐκπορεύεται, ῥομφαία ὀξεῖα, and ἵνα ἐν αὐτῇ πατάξῃ
  rationale: Natural clause order clarifies the sentence while preserving its purpose and judgment imagery.
- pob_phrase: he himself will shepherd them with an iron rod
  simplified_phrase: He himself will shepherd[a] them with an iron rod.
  preserved_meaning: His rule retains both the shepherd image and the judicial force of the iron rod.
  reasoning_layer_used: POB theological decision on ποιμανεῖ and its Psalm 2 allusion
  rationale: A separate sentence clarifies the image while retaining the emphatic subject and chosen metaphor.
- pob_phrase: he himself treads the winepress of the wine of the fury of the wrath of God the Almighty
  simplified_phrase: He himself treads the winepress containing the wine of the fury of the wrath of God the Almighty.
  preserved_meaning: The winepress is associated with God’s intense judgment while both “fury” and “wrath” remain distinct.
  reasoning_layer_used: POB lexical and theological decisions on the winepress and compounded wrath expression
  rationale: “Containing” makes the winepress relationship clear without equating the wine directly with divine fury.
