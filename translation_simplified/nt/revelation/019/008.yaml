translation:
  language: en
  text: She was given bright, clean, fine linen to dress herself in. This fine linen represents the righteous deeds of God’s holy people.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: it was given to her to clothe herself with fine linen
  simplified_phrase: She was given ... fine linen to dress herself in
  preserved_meaning: The linen is given to the bride, while she actively dresses herself and the giver remains unnamed.
  reasoning_layer_used: Lexical decisions for ἐδόθη, αὐτῇ, and ἵνα περιβάληται.
  rationale: The recast sentence uses natural English while preserving both the passive gift and the reflexive action.
- pob_phrase: fine linen, bright and clean
  simplified_phrase: bright, clean, fine linen
  preserved_meaning: The garment remains luxurious linen described by its visible brightness and cleanness.
  reasoning_layer_used: Lexical decisions for βύσσινον, λαμπρόν, and καθαρόν.
  rationale: Reordering the adjectives makes the description flow naturally without changing its imagery.
- pob_phrase: the righteous deeds of the saints
  simplified_phrase: the righteous deeds of God’s holy people
  preserved_meaning: The linen symbolizes the righteous conduct of those who belong to God.
  reasoning_layer_used: Lexical and theological decisions for δικαιώματα and τῶν ἁγίων.
  rationale: The wording keeps “righteous deeds” while explaining “saints” for readers unfamiliar with the biblical term.
interpretive_expansions:
- pob_phrase: the fine linen is
  rendering: This fine linen represents
  claim: The identification is symbolic rather than a literal equation of cloth and actions.
  evidence:
  - The immediate clause explains the garment’s meaning.
  - The POB theological decision explicitly describes the garment as symbolizing the saints’ deeds.
  confidence: high
  alternatives_preserved:
  - the fine linen is
  - the fine linen stands for
- pob_phrase: the saints
  rendering: God’s holy people
  claim: Here “saints” refers broadly to God’s people, not only to a specially recognized group.
  evidence:
  - The POB lexical rationale identifies ἅγιοι as a standard New Testament name for God’s holy people.
  confidence: high
  alternatives_preserved:
  - the saints
  - the holy ones
translation_notes:
  risk_flags:
  - risk: Making “fine linen” the stated object of “was given” is more explicit than the Greek grammar.
    mitigation: The POB theological reasoning treats the garment as given, while the passive still leaves the giver unnamed.
  - risk: “Represents” may weaken the source’s direct metaphor.
    mitigation: The linen image is retained and immediately tied to the righteous deeds it signifies.
