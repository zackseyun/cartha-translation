- pob_phrase: And the beast was captured, and with it the false prophet
  simplified_phrase: The beast was captured, along with the false prophet.
  preserved_meaning: The false prophet is associated with the beast’s capture without adding a separate capture verb.
  reasoning_layer_used: Greek syntax and POB lexical decision on μετ’ αὐτοῦ
  rationale: “Along with” makes the coordinated scene clear without overstating the singular verb.
- pob_phrase: who had performed the signs in its presence, by which he deceived
  simplified_phrase: The false prophet had performed signs in the beast’s presence. Through these signs he deceived
  preserved_meaning: The false prophet used signs performed before the beast as the means of deception.
  reasoning_layer_used: POB lexical decisions on σημεῖα, ἐνώπιον αὐτοῦ, and ἐν οἷς
  rationale: Two sentences and explicit nouns clarify the relationships in the dense clause.
- pob_phrase: The two of them were thrown alive into the lake of fire that burns with sulfur.
  simplified_phrase: Both were thrown alive into the lake of fire burning with sulfur.
  preserved_meaning: The two figures are forcibly thrown in alive, and the concrete judgment image remains intact.
  reasoning_layer_used: POB lexical and theological decisions on final judgment imagery
  rationale: “Both” is concise while preserving every element of the image.
