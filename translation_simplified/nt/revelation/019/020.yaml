translation:
  language: en
  text: The beast was captured, along with the false prophet.[a] The false prophet had performed signs in the beast’s presence. Through these signs he deceived those who had received the beast’s mark and those who worshiped its image. Both were thrown alive into the lake of fire burning with sulfur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also be rendered “with him” or “before him”; its pronouns refer back to “the beast,” which is grammatically neuter.
    reason: lexical_alternative
