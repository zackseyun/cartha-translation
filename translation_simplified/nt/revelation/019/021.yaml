  preserved_meaning: The sword belongs to the one riding the horse.
  reasoning_layer_used: lexical decision and immediate context
  rationale: “The rider” expresses the participial phrase in direct, natural English.
- pob_phrase: all the birds were filled from their flesh
  simplified_phrase: All the birds ate their flesh until they were full
  preserved_meaning: The birds became fully fed from the dead people’s literal flesh.
  reasoning_layer_used: lexical decisions for ἐχορτάσθησαν and ἐκ τῶν σαρκῶν αὐτῶν
