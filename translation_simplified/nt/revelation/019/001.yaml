translation:
  language: en
  text: After all this, I heard what sounded like the loud voice of a vast crowd in heaven. They were saying, “Hallelujah![a] Salvation, glory, and power belong to our God!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Hallelujah” means “Praise Yah,” or “Praise the LORD.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: After these things
  simplified_phrase: After all this
  preserved_meaning: The vision moves forward after the preceding events.
  reasoning_layer_used: Lexical decision for Μετὰ ταῦτα and Revelation’s narrative sequence
  rationale: This refers naturally to the events John has just seen.
- pob_phrase: what seemed to be the loud voice of a great multitude
  simplified_phrase: what sounded like the loud voice of a vast crowd
  preserved_meaning: John hears a massive assembly as one loud voice without claiming exact identification.
  reasoning_layer_used: Lexical decisions for ὡς, φωνὴν μεγάλην, and ὄχλου πολλοῦ
  rationale: This preserves both the perceived sound and the crowd whose voice it is.
- pob_phrase: saying
  simplified_phrase: They were saying
  preserved_meaning: The heavenly crowd voices the acclamation that follows.
  reasoning_layer_used: Lexical decision for λεγόντων and English sentence structure
  rationale: A separate sentence makes the speaker clear without strengthening the verb.
translation_notes:
  risk_flags:
  - risk: “Crowd” may sound less formal than “multitude.”
    mitigation: “Vast” preserves the scale, while the heavenly setting maintains the solemn context.
  - risk: “After all this” is less formally plural than “after these things.”
    mitigation: “All” retains the reference to the preceding series of events.
