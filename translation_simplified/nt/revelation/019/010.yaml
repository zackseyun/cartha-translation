translation:
  language: en
  text: I fell down at his feet to worship him. But he said to me, “Do not do that! I am a fellow slave, just like you and your brothers[a] who hold the testimony of Jesus.[b] Worship God! For the testimony of Jesus is the spirit of prophecy.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “brothers” may include both brothers and sisters who believe.
    reason: lexical_alternative
  - marker: b
    text: “The testimony of Jesus” may mean testimony about Jesus or testimony given by Jesus; the same ambiguity applies at the end of the verse.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: I fell before his feet
  simplified_phrase: I fell down at his feet
  preserved_meaning: John physically lowered himself before the angel in an act of worship.
  reasoning_layer_used: lexical decision for ἔπεσα ἔμπροσθεν τῶν ποδῶν αὐτοῦ
  rationale: The common English idiom keeps both the posture and its direction toward the angel.
- pob_phrase: See that you do not!
  simplified_phrase: Do not do that!
  preserved_meaning: The angel abruptly and firmly forbids John’s attempted worship.
  reasoning_layer_used: lexical decision for Ὅρα μή
  rationale: The direct prohibition is clearer while retaining the force of the Greek command.
- pob_phrase: I am a fellow slave with you and with your brothers
  simplified_phrase: I am a fellow slave, just like you and your brothers
  preserved_meaning: The angel shares their subordinate status and is not entitled to worship.
  reasoning_layer_used: lexical and theological decisions for σύνδουλος
  rationale: The recast sentence explains the shared status without weakening “slave” to “servant.”
translation_notes:
  risk_flags:
  - risk: “The testimony of Jesus” remains difficult and grammatically ambiguous.
    mitigation: The footnote preserves both documented meanings without choosing between them.
  - risk: Modern readers may hear “brothers” as excluding women.
    mitigation: The footnote notes its likely representative use while retaining the source wording.
