translation:
  language: en
  text: A voice came from the throne and said, “Praise our God, all his slaves[a] and all who fear him[b]—people of low and high status alike.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word can also be translated “servants” or “bondservants,” but “slaves” emphasizes that they belong wholly to God.
    reason: lexical_alternative
  - marker: b
    text: To “fear” God means to regard him with reverent awe and allegiance.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: a voice came from the throne, saying
  simplified_phrase: a voice came from the throne and said
  preserved_meaning: The throne remains the source of the spoken command.
  reasoning_layer_used: POB lexical decisions for ἀπὸ τοῦ θρόνου, ἐξῆλθεν, and λέγουσα
  rationale: A finite verb is more natural in common English than the participle “saying.”
- pob_phrase: all his slaves
  simplified_phrase: all his slaves
  preserved_meaning: God’s people are portrayed as wholly belonging to him in allegiance and worship.
  reasoning_layer_used: POB theological decision for δοῦλοι and regression fix
  rationale: The strong term is retained because replacing it with “servants” would weaken the controlling theological choice.
- pob_phrase: the small and the great
  simplified_phrase: people of low and high status alike
  preserved_meaning: The summons includes people across the full range of social standing.
  reasoning_layer_used: POB lexical decision for οἱ μικροὶ καὶ οἱ μεγάλοι
  rationale: The social contrast is stated directly because the literal English expression is easily misunderstood as physical size.
interpretive_expansions:
- pob_phrase: the small and the great
  rendering: people of low and high status alike
  claim: The pair refers to social standing rather than physical size.
  evidence:
  - The POB lexical rationale identifies people of low and high status.
  - The paired adjectives express the breadth of the summons.
  confidence: high
  alternatives_preserved:
  - the small and the great
  - the least and the greatest
translation_notes:
  risk_flags:
  - risk: Modern readers may hear “slaves” only through human abuse and miss the belonging-and-allegiance sense.
    mitigation: A lexical footnote preserves the alternatives and explains why the stronger term remains.
  - risk: The relation between “his slaves” and “those who fear him” may be read as either overlapping descriptions or coordinated groups.
    mitigation: The wording retains “and” rather than forcing the appositional reading.
