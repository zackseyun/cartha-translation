translation:
  language: en
  text: Then I saw heaven opened. Look! There was a white horse. Its rider is called Faithful and True. He judges and wages war in righteousness.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “He judges and wages war with justice.”
