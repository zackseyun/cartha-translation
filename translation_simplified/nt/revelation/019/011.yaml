simplification_decisions:
- pob_phrase: And I saw heaven opened, and behold, a white horse
  simplified_phrase: Then I saw heaven opened. Look! There was a white horse.
  preserved_meaning: John sees heaven in an opened state and suddenly beholds a white horse.
  reasoning_layer_used: Lexical decisions for ἠνεῳγμένον and ἰδού
  rationale: Short sentences make the vision easier to follow while “Look!” keeps its vivid force.
- pob_phrase: the one sitting on it
  simplified_phrase: Its rider
  preserved_meaning: The person seated on the white horse is identified.
  reasoning_layer_used: Lexical alternative for ὁ καθήμενος ἐπ’ αὐτόν
  rationale: “Rider” is the natural plain-English term in this context.
- pob_phrase: is called Faithful and True
  simplified_phrase: is called Faithful and True
  preserved_meaning: Faithful and True remain title-like names of the exalted rider.
  reasoning_layer_used: Lexical and theological decisions for πιστός and ἀληθινός
  rationale: The established titles are retained because simpler substitutes would weaken their theological force.
translation_notes:
  risk_flags:
  - risk: “Rider” is slightly more interpretive than the Greek phrase “the one sitting on it.”
    mitigation: The white-horse context makes the same referent clear without adding a new claim.
  - risk: Modern readers may hear “righteousness” as personal piety rather than just action.
    mitigation: The footnote preserves “justice” as the contextual lexical alternative.
