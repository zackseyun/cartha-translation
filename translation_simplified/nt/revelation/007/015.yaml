translation:
  language: en
  text: That is why they are before God’s throne. They serve him day and night in his temple. And the one who sits on the throne will spread his tent over them.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “will dwell over them” or “will shelter them.” The Greek uses the image of a tent or tabernacle.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: For this reason they are before the throne of God
  simplified_phrase: That is why they are before God’s throne.
  preserved_meaning: Their place before God’s throne follows from the preceding explanation.
  reasoning_layer_used: Lexical decisions for διὰ τοῦτό and ἐνώπιον
  rationale: “That is why” keeps the causal link in direct, natural English.
- pob_phrase: and they serve him day and night in his temple
  simplified_phrase: They serve him day and night in his temple.
  preserved_meaning: Their sacred service to God is continual and takes place in his temple.
  reasoning_layer_used: Lexical decisions for λατρεύουσιν, ἡμέρας καὶ νυκτός, and ναῷ
  rationale: A separate sentence makes the action easier to follow without reducing service to praise alone.
- pob_phrase: and the one seated on the throne will spread his tent over them
  simplified_phrase: And the one who sits on the throne will spread his tent over them.
  preserved_meaning: God’s protective presence is expressed through the biblical tent image.
  reasoning_layer_used: Lexical and theological decisions for σκηνώσει ἐπ’ αὐτούς
  rationale: The finite clause reads naturally while preserving the title and tabernacle imagery.
translation_notes:
  risk_flags:
  - risk: Modern readers may picture only a literal tent.
    mitigation: The footnote identifies dwelling and shelter while retaining the image’s directional force.
