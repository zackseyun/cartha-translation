translation:
  language: en
  text: After this, I looked, and there before me was a vast multitude. No one could count them. They were from every nation, tribe, people, and language. They stood before the throne and before the Lamb, wearing white robes and holding palm branches in their hands.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: After these things I looked, and behold
  simplified_phrase: After this, I looked, and there before me was
  preserved_meaning: John sees the next scene in the vision, and attention is drawn to what appears.
  reasoning_layer_used: POB lexical decisions for Μετὰ ταῦτα and εἶδον, καὶ ἰδοὺ
  rationale: Natural scene-setting preserves both the sequence and the attention-marking force of “behold.”
- pob_phrase: a great multitude that no one was able to count
  simplified_phrase: a vast multitude. No one could count them.
  preserved_meaning: The group is so large that no human can count it.
  reasoning_layer_used: POB lexical decision for ὄχλος πολύς and the relative clause
  rationale: Two short sentences make the scale and human inability immediately clear.
- pob_phrase: clothed in white robes, with palm branches in their hands
  simplified_phrase: wearing white robes and holding palm branches in their hands
  preserved_meaning: The multitude wears white robes and has palm branches in hand.
  reasoning_layer_used: POB lexical decisions for περιβεβλημένους and φοίνικες
  rationale: Ordinary active wording preserves both visible images without interpreting their symbolism.
translation_notes:
