translation:
  language: en
  text: He said, “Do not harm the earth, the sea, or the trees until we have marked our God’s slaves[a] with a seal on their foreheads.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word can also mean “servants” or “bondservants,” but “slaves” emphasizes that they belong to God.
    reason: lexical_alternative
