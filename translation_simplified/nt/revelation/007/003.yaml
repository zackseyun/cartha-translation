  reasoning_layer_used: Source syntax and immediate discourse
  rationale: A finite verb is clearer in ordinary English than the participle “saying.”
- pob_phrase: until we have sealed the slaves of our God
  simplified_phrase: until we have marked our God’s slaves with a seal
  preserved_meaning: The harm is delayed until God’s people receive the identifying seal.
  reasoning_layer_used: Lexical decisions for σφραγίσωμεν and δούλους
  rationale: The wording explains the action while preserving the concrete seal image and the term “slaves.”
- pob_phrase: the earth or the sea or the trees
