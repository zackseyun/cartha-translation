translation:
  language: en
  text: 'I answered him, “My lord, you know.”


    He told me, “These people are coming out of the great tribulation.[a] They washed their robes and made them white in the blood of the Lamb.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the great affliction” or “the great distress.” The Greek word describes severe pressure or suffering.
    reason: lexical_alternative
  - marker: b
    text: The words “in the blood of the Lamb” preserve Revelation’s striking image of blood bringing cleansing. The Greek may also be translated “by the blood.”
    reason: lexical_alternative
