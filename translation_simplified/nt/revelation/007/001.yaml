translation:
  language: en
  text: After this, I saw four angels standing at the four corners of the earth.[a] They were holding back the earth’s four winds so that no wind would blow across the earth or sea, or against any tree.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “The four corners of the earth” is a traditional expression for the earth’s farthest reaches or its four directions.
    reason: cultural_note
