  simplified_phrase: After this, I saw four angels standing at the four corners of the earth. They were holding back
  preserved_meaning: John sees four standing angels who are restraining the winds.
  reasoning_layer_used: POB syntax and lexical decisions
  rationale: Two sentences make the vision easier to follow without changing the angels’ posture or action.
- pob_phrase: the four winds of the earth
  simplified_phrase: the earth’s four winds
  preserved_meaning: The angels restrain the winds associated with the four directions of the earth.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The possessive form is more natural while retaining the cosmic scope and fourfold image.
- pob_phrase: on the earth or on the sea or on any tree
  simplified_phrase: across the earth or sea, or against any tree
  preserved_meaning: No wind reaches any of the three named domains.
  reasoning_layer_used: POB lexical decision on the coordinated negation
  rationale: Natural English prepositions clarify how wind affects each domain while preserving all three.
