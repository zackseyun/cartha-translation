translation:
  language: en
  text: One of the elders says to me, “Do not weep. Look! The Lion from the tribe of Judah,[a] the Root of David, has conquered. Therefore, he can open the scroll and its seven seals.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally, “the Lion of the tribe of Judah.”
    reason: lexical_alternative
  - marker: b
    text: The final sentence may be translated more literally, “He has conquered to open the scroll and its seven seals.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Behold
  simplified_phrase: Look!
  preserved_meaning: The speaker urgently draws attention to the victorious Lion.
  reasoning_layer_used: POB lexical decision for ἰδού
  rationale: “Look” keeps the force of the Greek marker without archaic wording.
- pob_phrase: has conquered, to open the scroll and its seven seals
  simplified_phrase: has conquered. Therefore, he can open the scroll and its seven seals.
  preserved_meaning: His victory enables and authorizes the opening of the sealed scroll.
  reasoning_layer_used: POB theological decision on ἀνοῖξαι after ἐνίκησεν
  rationale: Two sentences make the victory-to-opening relationship immediately clear.
interpretive_expansions:
- pob_phrase: has conquered, to open
  rendering: has conquered. Therefore, he can open
  claim: The conquest results in his ability and right to open the scroll.
  evidence:
  - The POB theological rationale says that victory grounds access to the scroll.
  confidence: high
  alternatives_preserved:
  - has conquered to open
  - has conquered, so that he can open
translation_notes:
  risk_flags:
  - risk: “Therefore” states the result relationship more explicitly than the Greek infinitive alone.
    mitigation: The footnote preserves the more literal construction, and the POB reasoning supports the result relationship.
  - risk: “Root of David” may remain unfamiliar to new readers.
    mitigation: The title is retained because its messianic image and scriptural resonance are theologically important.
