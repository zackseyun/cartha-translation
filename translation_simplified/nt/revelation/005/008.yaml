simplification_decisions:
- pob_phrase: And when he took the scroll
  simplified_phrase: When the Lamb took the scroll
  preserved_meaning: The Lamb is the one who takes the scroll.
  reasoning_layer_used: Immediate context and the established title for ἀρνίον
  rationale: Naming the Lamb removes an unclear pronoun without changing the actor.
- pob_phrase: fell down before the Lamb, each holding
  simplified_phrase: fell down before him. Each one held
  preserved_meaning: All the living creatures and elders bow while holding the items described.
  reasoning_layer_used: POB lexical decision for ἔχοντες ἕκαστος
  rationale: Two sentences replace the dense participial structure with ordinary English.
- pob_phrase: golden bowls full of incense, which are the prayers of the saints
  simplified_phrase: golden bowls full of incense—the prayers of the saints
  preserved_meaning: The worship scene directly identifies the incense imagery with the saints’ prayers.
  reasoning_layer_used: POB theological decision on the equative clause
  rationale: The apposition keeps the direct symbolic identification without a difficult relative clause.
