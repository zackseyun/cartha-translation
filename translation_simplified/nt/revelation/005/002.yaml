simplification_decisions:
- pob_phrase: And I saw a mighty angel proclaiming with a loud voice
  simplified_phrase: Then I saw a mighty angel. He called out loudly
  preserved_meaning: John sees a powerful angel making a forceful public announcement.
  reasoning_layer_used: The lexical decisions identify the angel as mighty and the speech as a loud public proclamation.
  rationale: Two direct sentences make the scene easier to follow without weakening the angel or his announcement.
- pob_phrase: Who is worthy to open the scroll and break its seals?
  simplified_phrase: Who is worthy to open the scroll and break its seals?
  preserved_meaning: The question seeks someone qualified for the solemn task of opening the sealed scroll.
  reasoning_layer_used: The lexical and theological decisions require “worthy,” “scroll,” and the concrete image of broken seals.
  rationale: These key terms remain because simpler substitutes would weaken the scene’s theological and physical imagery.
translation_notes:
  risk_flags:
  - risk: “Called out” may sound less formal than “proclaiming.”
    mitigation: The mighty angel, loud delivery, and solemn question preserve the public force of the announcement.
