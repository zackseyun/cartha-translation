translation:
  language: en
  text: 'Then they sing a new song:


    “You are worthy to take the scroll and open its seals, because you were slain. By your blood[b] you purchased people for God[a] from every tribe, language, people, and nation.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “you purchased people to God.” The Greek can be understood either way.
    reason: lexical_alternative
  - marker: b
    text: Or “with your blood.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And they sing a new song, saying
  simplified_phrase: 'Then they sing a new song:'
  preserved_meaning: They begin singing the words that follow as a new song.
  reasoning_layer_used: Lexical decision for ᾄδουσιν and ᾠδὴν καινὴν
  rationale: A colon introduces the song more directly than “saying.”
- pob_phrase: to take the scroll and to open its seals
  simplified_phrase: to take the scroll and open its seals
  preserved_meaning: The Lamb is worthy both to receive the ancient scroll and to open what seals it.
  reasoning_layer_used: Lexical decisions for τὸ βιβλίον and ἀνοῖξαι τὰς σφραγῖδας αὐτοῦ
  rationale: Removing the repeated “to” makes the paired actions easier to read without merging them.
- pob_phrase: you purchased for God people
  simplified_phrase: you purchased people for God
  preserved_meaning: The Lamb bought people so that they belong to God.
  reasoning_layer_used: Theological decision supplying the implied human object and lexical decision for τῷ θεῷ
  rationale: Ordinary English word order makes the object of “purchased” immediately clear.
translation_notes:
  risk_flags:
  - risk: “Slain” may be less familiar than “killed” to some readers.
    mitigation: It is retained because it preserves the violent and sacrificial force identified in the POB reasoning.
  - risk: “For God” may appear to settle the Greek dative completely.
    mitigation: A footnote preserves the possible rendering “to God.”
