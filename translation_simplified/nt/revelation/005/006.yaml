translation:
  language: en
  text: Then I saw a Lamb standing between the throne and the four living creatures, among the elders. It looked as though it had been slain.[a] It had seven horns and seven eyes. The seven eyes are the seven Spirits of God, sent out into all the earth.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “as slain” or “as if slaughtered.”
    reason: lexical_alternative
  - marker: b
    text: The text says “the seven Spirits of God.” Some understand this as a symbolic way of describing the Holy Spirit in sevenfold fullness.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: And I saw, in the midst of the throne and of the four living creatures, and in the midst of the elders, a Lamb standing
  simplified_phrase: Then I saw a Lamb standing between the throne and the four living creatures, among the elders.
  preserved_meaning: The Lamb stands between the throne and the living creatures while also being among the elders.
  reasoning_layer_used: POB lexical alternatives for ἐν μέσῳ and the grounding review
  rationale: The reordered sentence introduces the Lamb early and makes the two spatial relations clear.
- pob_phrase: a Lamb standing as though it had been slain
  simplified_phrase: a Lamb standing ... It looked as though it had been slain
  preserved_meaning: The living Lamb bears the appearance of having suffered sacrificial slaughter.
  reasoning_layer_used: POB lexical decisions for ἑστηκὸς and ὡς ἐσφαγμένον
  rationale: Dividing the description into two sentences makes the paradox easier to understand.
- pob_phrase: having seven horns and seven eyes, which are the seven Spirits of God
  simplified_phrase: It had seven horns and seven eyes. The seven eyes are the seven Spirits of God
  preserved_meaning: The horns and eyes remain literal, and the identification refers to the eyes.
  reasoning_layer_used: POB lexical and theological decisions on οἵ εἰσιν
  rationale: Repeating “the seven eyes” prevents confusion about what the clause identifies.
translation_notes:
  risk_flags:
  - risk: “Between” selects a clearer spatial alternative rather than reproducing the repeated Greek phrase formally.
    mitigation: It is a documented POB alternative and preserves the distinct relation between the throne, living creatures, and elders.
  - risk: The identity of “the seven Spirits of God” remains debated.
    mitigation: The main text retains the POB phrase, while the footnote presents one interpretation without making it definitive.
