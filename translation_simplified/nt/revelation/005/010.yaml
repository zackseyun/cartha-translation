simplification_decisions:
- pob_phrase: you made them a kingdom and priests to our God
  simplified_phrase: You made them into a kingdom, and you made them priests for our God.
  preserved_meaning: The redeemed are formed collectively as a kingdom and are also made priests in service to God.
  reasoning_layer_used: POB lexical and theological decisions on βασιλείαν, ἱερεῖς, and τῷ θεῷ ἡμῶν
  rationale: Repeating “you made them” separates the two roles, while “into” clarifies that they were formed as a kingdom.
- pob_phrase: and they will reign on the earth
  simplified_phrase: They will reign on the earth.
  preserved_meaning: Their reign is future and will take place on the earth without changing “on” to the stronger “over.”
  reasoning_layer_used: POB lexical and theological decisions on βασιλεύουσιν and ἐπὶ τῆς γῆς
  rationale: A new sentence improves readability while retaining the adopted future reading and the earth image.
