translation_notes:
  source_alignment_notes: Maintains ὅτι as causal ('Because') and preserves the passive voice of ἐλευθερωθήσεται ('will also be set free'). Keeps the emphatic αὐτὴ ('itself') and the additive καὶ ('also'). Follows POB's decision to render τῆς δόξης adjectivally as 'glorious' while keeping the literal genitive phrase in the footnote.
  readability_notes:
  - The literal transition 'set free from slavery to decay into...' is awkward in English because it sounds like creation is being set free 'into' something directly from 'decay'. Adding 'and brought into' clarifies the physical and spiritual movement described by the Greek preposition εἰς. Using 'God's children' improves natural sentence cadence.
  compression_notes:
  - No theological or textual elements have been compressed or omitted. The sentence structure was adjusted only to clarify the prepositions and genitive relationships.
