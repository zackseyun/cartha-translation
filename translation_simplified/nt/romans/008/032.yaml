  rationale: Removing “indeed” avoids stiffness without weakening the force of the sentence.
- pob_phrase: gave him over
  simplified_phrase: gave him over
  preserved_meaning: God handed the Son over to suffering and death rather than merely letting him go.
  reasoning_layer_used: POB lexical decision for παρέδωκεν αὐτόν
  rationale: The source-grounded wording is retained because “gave him up” could sound less specific.
- pob_phrase: how will he not also with him graciously give us all things?
  simplified_phrase: how will he not also, along with him, graciously give us all things?
  preserved_meaning: God’s gift of all things comes together with his gift of the Son.
  reasoning_layer_used: POB lexical decisions for σὺν αὐτῷ and χαρίσεται
  rationale: “Along with him” clarifies the relationship while preserving the rhetorical question and gracious giving.
