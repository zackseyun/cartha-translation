simplification_decisions:
- pob_phrase: if you live according to the flesh
  simplified_phrase: if you live according to your sinful nature
  preserved_meaning: Paul’s flesh-Spirit contrast concerns a sinful way of life.
  reasoning_layer_used: POB lexical decision for κατὰ σάρκα
  rationale: The contextual rendering prevents readers from mistaking “flesh” for the physical body.
- pob_phrase: you are going to die; but if
  simplified_phrase: you are going to die. But if
  preserved_meaning: The two conditional outcomes remain directly contrasted.
  reasoning_layer_used: POB syntax and cross-check summary
  rationale: Two sentences make the warning and contrast easier to follow.
- pob_phrase: put to death the deeds of the body
  simplified_phrase: put the sinful deeds of the body to death
  preserved_meaning: The Spirit empowers believers to decisively oppose bodily actions governed by sin.
  reasoning_layer_used: POB lexical rationale and Romans 8:12–13 context
  rationale: The reordered phrase is natural English, while “sinful” makes its ethical sense clear.
interpretive_expansions:
- pob_phrase: the deeds of the body
  rendering: the sinful deeds of the body
  claim: The deeds in view are sinful bodily practices, not ordinary physical actions.
  evidence:
  - The POB lexical rationale identifies a concrete ethical sense.
  - Romans 8:12–13 contrasts the flesh with Spirit-enabled resistance to sin.
  confidence: high
  alternatives_preserved:
  - the deeds of the body
  - the practices of the body
  - the actions of the body
translation_notes:
  risk_flags:
  - risk: Adding “sinful” could be read as calling the body itself evil.
    mitigation: The wording modifies “deeds,” preserving the body as the sphere of action rather than the source of evil.
