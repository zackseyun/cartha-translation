translation:
  language: en
  text: Those whose destiny he decided beforehand[a], he also called. Those he called, he also justified—that is, declared righteous. And those he justified, he also glorified.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “predestined” or “foreordained.”
    reason: lexical_alternative
  - marker: b
    text: The Greek verb is in the past form, “glorified.” Some understand this to refer to future glory so certain that it is described as already completed.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: those whom he predestined
  simplified_phrase: those whose destiny he decided beforehand
  preserved_meaning: God determined their destiny in advance without defining the doctrine more narrowly.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: This uses the POB’s explanatory alternative while preserving prior determination.
- pob_phrase: those whom he called ... those whom he justified
  simplified_phrase: Those he called ... those he justified
  preserved_meaning: The same people remain linked through every action in the sequence.
  reasoning_layer_used: POB Greek grammar decision
  rationale: Shorter clauses and ordinary word order make the repeated chain easier to follow.
- pob_phrase: justified
  simplified_phrase: justified—that is, declared righteous
  preserved_meaning: Justification retains its Pauline forensic sense.
  reasoning_layer_used: POB lexical decision
  rationale: The gloss explains a key theological term using the POB’s approved alternative.
