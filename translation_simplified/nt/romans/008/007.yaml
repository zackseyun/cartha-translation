  readability_notes:
  - Breaking the single Greek sentence into two sentences drastically reduces cognitive load for the modern reader. Replacing the repetitive 'for... for...' sequence with a semicolon/period structure improves flow and makes the logical connection easier to grasp.
  compression_notes:
  - No semantic content or theological nuances were compressed or omitted. The elliptical final clause of the Greek ('for neither is it able') was lightly expanded to 'nor is it even able to do so' to provide proper English syntax without adding non-textual meaning.
