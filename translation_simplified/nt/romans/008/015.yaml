translation:
  language: en
  text: For you did not receive a spirit of slavery that leads you back into fear. Instead, you received a spirit of adoption as sons[a], by whom[b] we cry out, “Abba! Father!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek term refers to being legally adopted with the full rights and inheritance of a son. Some translations read 'the Spirit of adoption.'
    reason: clarification_and_alternative_reading
  - marker: b
    text: Or 'in whom.' The Greek relative pronoun is grammatically neuter to match the word 'spirit,' but refers here to the personal Holy Spirit.
    reason: lexical_alternative
