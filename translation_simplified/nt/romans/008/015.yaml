  rationale: A relative clause expresses the same movement in natural English.
- pob_phrase: but you received
  simplified_phrase: Instead, you received
  preserved_meaning: The adoption contrast replaces slavery and fear.
  reasoning_layer_used: POB translation and source contrast
  rationale: A new sentence makes the sharp contrast easier to follow.
- pob_phrase: we cry
