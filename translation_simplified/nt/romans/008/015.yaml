translation:
  language: en
  text: For you did not receive a spirit of slavery that leads you back into fear. Instead, you received a spirit of adoption as sons[a], by whom[b] we cry out, “Abba! Father!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek term describes legal adoption as sons, with the status and inheritance associated with sonship. This legal language includes all God’s children. Or, “the Spirit of adoption.”
    reason: lexical_alternative
  - marker: b
    text: Or, “in whom.” The Greek pronoun is grammatically neuter to match “spirit.” In this context, it likely refers to the personal Holy Spirit.
    reason: lexical_alternative
