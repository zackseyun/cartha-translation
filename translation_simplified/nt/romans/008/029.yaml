translation:
  language: en
  text: For those whom God knew beforehand[a], he also predestined to be made like the image of his Son, so that his Son might be the firstborn among many brothers[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “foreknew”; some understand this relationally, meaning God set his regard on them beforehand.
    reason: alternative_reading
  - marker: b
    text: The Greek word for “brothers” is grammatically masculine, but here it may include both men and women in God’s family.
    reason: cultural_note
simplification_decisions:
- pob_phrase: those whom he foreknew
  simplified_phrase: those whom God knew beforehand
  preserved_meaning: God knew these people in advance without specifying how that foreknowledge should be understood.
  reasoning_layer_used: POB lexical and theological decisions for προέγνω
  rationale: The common phrase “knew beforehand” preserves the documented ambiguity, while the footnote retains “foreknew” and the relational alternative.
- pob_phrase: predestined to be conformed to the image of his Son
  simplified_phrase: predestined to be made like the image of his Son
  preserved_meaning: God determined beforehand that they would be transformed into the likeness represented by his Son’s image.
  reasoning_layer_used: POB lexical decisions for προώρισεν, συμμόρφους, and εἰκόνος
  rationale: “Made like” replaces the abstract “conformed” while retaining “predestined” and the important biblical image.
- pob_phrase: so that he might be the firstborn
  simplified_phrase: so that his Son might be the firstborn
  preserved_meaning: God’s Son is the intended firstborn among the many brothers.
  reasoning_layer_used: Immediate syntax and POB lexical decision for πρωτότοκον
  rationale: Repeating “his Son” makes the pronoun’s referent clear while preserving the firstborn metaphor.
interpretive_expansions:
- pob_phrase: he ... his Son ... he
  rendering: God ... his Son ... his Son
  claim: The one who foreknew and predestined is God, and the one who is firstborn is his Son.
  evidence:
  - The possessive phrase “his Son” distinguishes God from the Son.
  - The purpose clause refers back to the Son as the intended firstborn.
  confidence: high
translation_notes:
  risk_flags:
  - risk: “Predestined” remains a difficult and doctrinally sensitive term.
    mitigation: It is retained because the POB identifies it as the precise rendering, without adding a doctrinal mechanism.
  - risk: “Firstborn” may be misunderstood as referring only to birth order.
    mitigation: The biblical metaphor is retained because the POB requires its theological force to remain intact.
