translation_notes:
  source_alignment_notes: The translation remains tightly aligned with the Greek text (SBLGNT). The word order and logical structure (For those whom... he also...) are preserved. The grammatical gender of 'brothers' is respected in the text and expanded in the footnotes.
  readability_notes:
  - Using 'knew beforehand' instead of 'foreknew' removes a minor barrier to comprehension for readers unfamiliar with high theological jargon. Specifying 'his Son' in the final purpose clause ('so that his Son might be') rather than just 'he' clarifies the subject immediately.
  compression_notes:
  - Minimal compression was used; the complex sentence structure was maintained to preserve the chain-like link of Paul's argument (the Golden Chain of salvation), but the phrasing was smoothed out for modern ears.
  risk_flags:
  - risk: Theological sensitivity around the terms 'foreknowledge' and 'predestination' is mitigated by preserving the literal sense in the text and offering the standard interpretations in the footnotes without taking a denominational stance.
    mitigation: Flag retained for reviewer attention.
