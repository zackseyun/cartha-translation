translation:
  language: en
  text: For those whom God knew beforehand[a], he also predestined to be conformed to the image of his Son, so that his Son might be the firstborn among many brothers[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'foreknew'; some understand this in a relational sense, meaning God set his special love on them beforehand.
    reason: simplification_note
  - marker: b
    text: The Greek word for 'brothers' is grammatically masculine, but in this context, it includes both men and women in God's family.
    reason: simplification_note
