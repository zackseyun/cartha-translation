translation:
  language: en
  text: But if the Messiah is in you, although the body is dead[a] because of sin, the spirit[b] is life because of righteousness.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “is mortal” or “is subject to death.”
    reason: lexical_alternative
  - marker: b
    text: Or “the Spirit is life.” The Greek word can refer either to the human spirit enlivened by God or to the Holy Spirit.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: the body is dead ... but the spirit is life
  simplified_phrase: although the body is dead ... the spirit is life
  preserved_meaning: The strong contrast between the body and the spirit remains intact.
  reasoning_layer_used: Source syntax and POB audit trail
  rationale: The concessive clause expresses the Greek contrast in more natural modern English.
- pob_phrase: the Messiah
  simplified_phrase: the Messiah
  preserved_meaning: Christos retains its force as a title.
  reasoning_layer_used: POB lexical decision for Χριστός
  rationale: This key title remains because replacing it would hide the POB's lexical choice.
- pob_phrase: the spirit is life
  simplified_phrase: the spirit is life
  preserved_meaning: The ambiguity between the human spirit and the Holy Spirit and the noun image of life are preserved.
  reasoning_layer_used: POB lexical and theological decisions for πνεῦμα and ζωή
  rationale: Lowercase “spirit” and the footnote preserve the ambiguity without weakening “is life.”
translation_notes:
  risk_flags:
  - risk: Readers may take “the body is dead” as literal present physical death.
    mitigation: Footnote a gives the supported mortality senses without adding a notion of doom.
  - risk: Lowercase “spirit” may appear to exclude the Holy Spirit.
    mitigation: Footnote b explicitly preserves both documented readings.
