simplification_decisions:
- pob_phrase: all things work together for good
  simplified_phrase: all things work together to bring good
  preserved_meaning: All circumstances jointly lead toward a good result without making God the explicit subject of “work together.”
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The active result phrase avoids the awkward sequence “for good for those” while preserving the textual ambiguity.
- pob_phrase: for those who love God—for those who are called
  simplified_phrase: to those who love God—those whom God has called
  preserved_meaning: Both descriptions identify the same group of people.
  reasoning_layer_used: POB syntax and immediate context
  rationale: Removing the repeated “for those” makes the relationship clear and natural.
- pob_phrase: called according to purpose
  simplified_phrase: God has called according to his purpose
  preserved_meaning: The calling accords with the intentional divine purpose identified in the surrounding context.
  reasoning_layer_used: POB lexical rationale and Romans 8:29–30
  rationale: Naming God and using “his” makes the otherwise opaque phrase understandable while the source wording remains in a footnote.
interpretive_expansions:
- pob_phrase: called according to purpose
  rendering: God has called according to his purpose
  claim: God is the implied caller, and the purpose is his.
  evidence:
  - The POB audit defines the purpose here as an intentional divine purpose or plan.
  - Romans 8:29–30 presents God as the one who foreknows, predestines, calls, justifies, and glorifies.
  confidence: high
  alternatives_preserved:
  - according to purpose
translation_notes:
  risk_flags:
  - risk: Readers may mistake the explicit “God” as the subject of “work together.”
    mitigation: The sentence keeps “all things” as that clause’s subject, and footnote [a] records the explicit-God textual variant.
  - risk: Adding “his” makes an implicit contextual reference explicit.
    mitigation: Footnote [b] preserves the source-aligned wording without the possessive.
