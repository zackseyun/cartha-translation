translation:
  language: en
  text: We know that all things work together[a] to bring good to those who love God—those whom God has called according to his purpose.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some manuscripts read, “God works all things together for good.”
