  text: 'What the law was powerless to do, because it was weakened by human flesh, God did: he sent his own Son in the likeness of sinful flesh[a] as a sin offering[b]. In this way, he condemned sin in the flesh.'
  philosophy: optimal-equivalence
  footnotes:
