translation:
  language: en
  text: If the Spirit of the One who raised Jesus from the dead lives in you, then the One who raised Messiah Jesus[b] from the dead will also give life to your mortal bodies because of his Spirit who lives in you[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, 'through his Spirit who lives in you.'
    reason: alternative_reading
  - marker: b
    text: Greek 'Christ Jesus'; 'Messiah' preserves the title meaning of the Greek 'Christos.'
    reason: lexical_alternative
