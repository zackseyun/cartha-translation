simplification_decisions:
- pob_phrase: not in the flesh but in the Spirit, if indeed
  simplified_phrase: not in the flesh but in the Spirit, if indeed
  preserved_meaning: The condition qualifies the whole contrast between life in the flesh and life in the Spirit.
  reasoning_layer_used: Source syntax and grounding review
  rationale: Keeping the contrast in one sentence prevents the condition from appearing to apply only to the second half.
- pob_phrase: dwells in you
  simplified_phrase: lives in you
  preserved_meaning: God’s Spirit has an abiding presence in the readers.
  reasoning_layer_used: POB lexical decision for οἰκεῖ
  rationale: “Lives” is clearer common English while retaining the indwelling sense.
- pob_phrase: Spirit of Messiah
  simplified_phrase: Spirit of the Messiah
  preserved_meaning: Messiah remains the project’s title-based rendering of Χριστός.
  reasoning_layer_used: POB lexical decision and regression fix
  rationale: The article makes the title natural in English without changing its meaning.
translation_notes:
  risk_flags:
  - risk: Modern readers may mistake “flesh” for the physical body alone.
    mitigation: Footnote a preserves the contextual lexical alternative without replacing Paul’s key image.
  - risk: The final “him” could be read as referring either to the Messiah or, more broadly, to God.
    mitigation: The pronoun remains unspecified because POB preserves the Greek wording and its contextual tension.
