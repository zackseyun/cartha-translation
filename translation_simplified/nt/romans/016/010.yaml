simplification_decisions:
- pob_phrase: the approved one in Messiah
  simplified_phrase: who has been tested and approved in Messiah
  preserved_meaning: Apelles has been found genuine and worthy of approval in relation to Messiah.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The relative clause is natural English, while “tested and approved” preserves the full commendatory force of δόκιμος.
- pob_phrase: those of the household of Aristobulus
  simplified_phrase: those in Aristobulus’s household
  preserved_meaning: The greeting is for people associated with Aristobulus’s household rather than necessarily Aristobulus himself.
  reasoning_layer_used: POB lexical rationale and grounding review
  rationale: The revised wording states the household association directly without suggesting ownership.
interpretive_expansions:
- pob_phrase: the approved one
  rendering: who has been tested and approved
  claim: The approval follows the sense of being tested and found genuine, without naming a particular approved quality.
  evidence:
  - The POB lexical rationale defines δόκιμος as someone tested and found genuine or approved.
  - The grounding review rejects narrowing the commendation specifically to faithfulness.
  confidence: high
  alternatives_preserved:
  - who is approved
  - who has proven genuine
translation_notes:
  risk_flags:
