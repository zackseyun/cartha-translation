simplification_decisions:
- pob_phrase: the church in their house
  simplified_phrase: the church that meets in their house
  preserved_meaning: The church is the assembly associated with and gathering in their home.
  reasoning_layer_used: POB lexical decision for κατ’ οἶκον αὐτῶν ἐκκλησίαν
  rationale: Stating that the church meets there prevents readers from mistaking the building for the church.
- pob_phrase: Greet Epaenetus, my beloved
  simplified_phrase: Greet my beloved Epaenetus
  preserved_meaning: Paul warmly identifies Epaenetus as someone dear to him.
  reasoning_layer_used: POB lexical decision for ἀγαπητόν μου
  rationale: The reordered phrase follows natural English without weakening Paul’s affection.
- pob_phrase: the firstfruits of Asia for Messiah
  simplified_phrase: the firstfruits of Asia for the Messiah
  preserved_meaning: Paul’s firstfruits image and the title Messiah are retained.
  reasoning_layer_used: POB theological decisions for ἀπαρχή and Χριστός
  rationale: Adding the article makes Messiah natural as an English title while preserving the metaphor.
translation_notes:
  risk_flags:
  - risk: Modern readers may not understand the firstfruits metaphor as referring to an earliest believer.
    mitigation: The alternative-reading footnote explains the likely sense without replacing Paul’s image.
  - risk: Asia may be mistaken for the modern continent rather than the Roman province.
    mitigation: The main text retains POB’s concise wording, though this distinction is not central to the greeting.
