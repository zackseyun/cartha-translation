translation:
  language: en
  text: Greet Andronicus and Junia[a]. They are my kin and were imprisoned with me. They are notable among the apostles[b], and they were in Messiah before me.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Junia: Alternatively, “Junias,” a masculine name; the feminine reading is more likely from the Greek form and historical usage.'
    reason: alternative_reading
  - marker: b
    text: Or “outstanding among the apostles”; the phrase may also mean “well known to the apostles.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: my kinsmen
  simplified_phrase: my kin
  preserved_meaning: The wording can refer either to relatives or to people of the same ethnic community.
  reasoning_layer_used: POB lexical decision for συγγενεῖς μου
  rationale: “Kin” is more natural today while preserving the documented ambiguity.
- pob_phrase: my fellow prisoners
  simplified_phrase: were imprisoned with me
  preserved_meaning: Andronicus and Junia shared imprisonment with Paul.
  reasoning_layer_used: POB lexical decision for συναιχμαλώτους μου
  rationale: The clause explains the relationship directly instead of using the compact label “fellow prisoners.”
- pob_phrase: Greet Andronicus and Junia, my kinsmen and my fellow prisoners.
  simplified_phrase: Greet Andronicus and Junia. They are my kin and were imprisoned with me.
  preserved_meaning: Paul commands a greeting and identifies both people by their ties to him.
  reasoning_layer_used: POB translation and source syntax
  rationale: Two short sentences make the relationships easier to follow.
translation_notes:
  risk_flags:
  - risk: “Kin” may still be understood only as family by some readers.
    mitigation: The wording avoids the narrower “relatives” and leaves the familial or ethnic sense unresolved.
  - risk: “Notable among the apostles” may imply that both people were apostles.
    mitigation: Footnote b preserves the alternative meaning “well known to the apostles.”
