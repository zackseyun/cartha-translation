translation:
  language: en
  text: Give greetings to Philologus and Julia[a], Nereus and his sister, Olympas, and all God’s holy people who are with them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or possibly “Julias,” if the name is masculine; the Greek form is commonly understood as the feminine name “Julia.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Greet
  simplified_phrase: Give greetings to
  preserved_meaning: Paul directs his readers to convey greetings to these people.
  reasoning_layer_used: POB lexical decision for ἀσπάσασθε
  rationale: The permitted alternative makes the letter-writing context clearer.
- pob_phrase: all the saints
  simplified_phrase: all God’s holy people
  preserved_meaning: The phrase identifies all the fellow believers associated with those named.
  reasoning_layer_used: POB lexical and theological decisions for πάντας ἁγίους
  rationale: This wording avoids suggesting only formally canonized saints.
- pob_phrase: with them
  simplified_phrase: who are with them
  preserved_meaning: These believers are in the company of the named people.
  reasoning_layer_used: POB lexical decision for τοὺς σὺν αὐτοῖς
  rationale: The full clause makes the association easier to follow.
translation_notes:
  risk_flags:
  - risk: “God’s holy people” is more explanatory than the traditional term “saints.”
    mitigation: The POB audit explicitly lists it as an alternative expressing Paul’s designation for fellow believers.
  - risk: The gender of Julia has occasionally been disputed.
    mitigation: The main text keeps the preferred feminine reading and the footnote preserves “Julias.”
