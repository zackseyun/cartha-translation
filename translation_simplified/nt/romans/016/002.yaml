translation:
  language: en
  text: Welcome her in the Lord in a way that is fitting for God's people, and help her with whatever she needs from you. She herself has become a patron of many, including me.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: in a manner worthy of the saints
  simplified_phrase: in a way that is fitting for God's people
  preserved_meaning: The welcome should be appropriate for fellow believers, whom Paul calls holy.
  reasoning_layer_used: POB lexical decision for ἀξίως τῶν ἁγίων and grounding review
  rationale: “God's people” prevents readers from mistaking “saints” for an exceptional class of believers.
- pob_phrase: assist her in whatever matter she may need from you
  simplified_phrase: help her with whatever she needs from you
  preserved_meaning: They are to provide whatever practical support Phoebe requires.
  reasoning_layer_used: POB lexical decisions for παραστῆτε and πρᾶγμα
  rationale: The shorter wording keeps the command broad while removing formal phrasing.
- pob_phrase: for she herself has become a patron of many, and of myself as well
  simplified_phrase: She herself has become a patron of many, including me.
  preserved_meaning: Phoebe has an established role supporting many people, Paul included.
  reasoning_layer_used: POB lexical and theological decisions for προστάτις and ἐγενήθη
  rationale: A new sentence clarifies the reason while retaining her significant role and its present relevance.
translation_notes:
  risk_flags:
  - risk: “God's people” does not reproduce Paul's established title “saints.”
    mitigation: The POB audit identifies it as a valid equivalent for ordinary believers and the context retains their relation to the Lord.
  - risk: Modern readers may not know the social scope of “patron.”
    mitigation: The term is retained because the POB finds “helper” too weak and “protector” too narrow.
