translation:
  language: en
  text: Greet Herodion, my kinsman.[a] Greet those associated with Narcissus who are in the Lord.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “my relative” or “my fellow Jew”; the Greek can mean either one.
    reason: lexical_alternative
  - marker: b
    text: This probably refers to believers from Narcissus’s household or estate.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: my kinsman
  simplified_phrase: my kinsman, with a plain-language footnote
  preserved_meaning: The wording leaves open whether Herodion was Paul’s relative or fellow Jew.
  reasoning_layer_used: POB lexical and theological decisions on συγγενής
  rationale: Retaining “kinsman” avoids narrowing the relationship, while the footnote explains its range.
- pob_phrase: those of Narcissus
  simplified_phrase: those associated with Narcissus
  preserved_meaning: The people have some connection to Narcissus, but its exact nature is not stated.
  reasoning_layer_used: POB lexical and theological decisions on τοὺς ἐκ τῶν Ναρκίσσου
  rationale: “Associated with” is clearer modern English without making household membership certain.
- pob_phrase: who are in the Lord
  simplified_phrase: who are in the Lord
  preserved_meaning: Paul identifies the people by their union with or belonging to the Lord.
  reasoning_layer_used: POB lexical decision on τοὺς ὄντας ἐν κυρίῳ
  rationale: The established Pauline expression remains clear enough and preserves its theological force.
translation_notes:
  risk_flags:
  - risk: “Kinsman” may be unfamiliar or sound only familial to some readers.
    mitigation: Footnote [a] states both possible senses without choosing between them.
  - risk: Readers may not know how the group was associated with Narcissus.
    mitigation: Footnote [b] gives the probable household or estate setting without placing it in the main text.
