translation:
  language: en
  text: For God’s wrath is being revealed from heaven against all godlessness and wrongdoing by people who suppress the truth through wrongdoing.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “while living in wrongdoing”; the phrase may describe the setting rather than the means of suppressing the truth.
    reason: lexical_alternative
