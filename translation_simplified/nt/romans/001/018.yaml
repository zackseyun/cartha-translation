- pob_phrase: all ungodliness
  simplified_phrase: all godlessness
  preserved_meaning: Open rejection or disregard of God remains distinct from other wrongdoing.
  reasoning_layer_used: POB lexical decision for ἀσέβεια
  rationale: “Godlessness” makes the offense’s God-directed nature immediately clear.
- pob_phrase: unrighteousness
  simplified_phrase: wrongdoing
  preserved_meaning: The broad range of morally and relationally wrong conduct is retained.
  reasoning_layer_used: POB lexical decision for ἀδικία and grounding review
  rationale: “Wrongdoing” is clearer than “unrighteousness” and broader than “wickedness.”
- pob_phrase: in unrighteousness
  simplified_phrase: through wrongdoing
  preserved_meaning: Their wrongdoing is presented as the means by which they suppress the truth.
  reasoning_layer_used: POB lexical decision for ἐν ἀδικίᾳ
  rationale: “Through” expresses the preferred instrumental sense in natural English.
interpretive_expansions:
