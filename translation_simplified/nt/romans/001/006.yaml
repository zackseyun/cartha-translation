simplification_decisions:
- preserved_meaning: Improves readability and flow for the modern reader while maintaining the exact sense of inclusion among the Gentile nations mentioned in the previous verse.
  reasoning_layer_used: POB audit trail
  rationale: Improves readability and flow for the modern reader while maintaining the exact sense of inclusion among the Gentile nations mentioned in the previous verse.
- preserved_meaning: Translates the archaic and ambiguous 'called of' into a natural modern phrasing ('called to belong to') that correctly represents the genitive relationship of possession/relationship, while keeping the other options in the footnote.
  reasoning_layer_used: POB audit trail
  rationale: Translates the archaic and ambiguous 'called of' into a natural modern phrasing ('called to belong to') that correctly represents the genitive relationship of possession/relationship, while keeping the other options in the footnote.
