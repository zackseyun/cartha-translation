translation_notes:
  source_alignment_notes: The Greek relative clause 'ἐν οἷς ἐστε' is naturally rendered 'among them you are'. The dative plural relative pronoun refers back to the nations in verse 5. The genitive 'Ἰησοῦ Χριστοῦ' following the verbal adjective 'κλητοί' is represented as belonging, which is the most natural way to express this relationship in modern English.
  readability_notes:
  - The phrase 'called of' is archaic in contemporary English and often misunderstood as agency ('called by'). Changing it to 'called to belong to' makes the relational aspect immediate and clear to modern readers.
  compression_notes:
  - No information was compressed or omitted; rather, the compressed Greek genitive relation was slightly unpacked for English clarity.
  risk_flags:
  - risk: There is a minor risk of over-specifying the genitive relation as possession ('belong to'), but this is the standard consensus reading for this construction and is balanced by the literal rendering provided in the footnote.
    mitigation: Flag retained for reviewer attention.
