translation:
  language: en
  text: I always pray that somehow, at last, by God’s will, I may succeed[a] in coming to you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “I may have a successful journey” or “I may be prospered.”
