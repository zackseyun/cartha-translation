translation:
  language: en
  text: For ever since the world was created, God’s invisible qualities—his eternal power and divine nature[a]—have been clearly seen. They are understood through what has been made, so that people have no excuse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or *divinity*. The Greek word refers to divine character or qualities, rather than his inner divine essence (deity).
    reason: lexical_alternative
