translation_notes:
  source_alignment_notes: The simplified translation maintains alignment with the Greek source SBLGNT. 'God’s righteousness' aligns with 'δικαιοσύνη θεοῦ', 'from faith to faith' aligns with 'ἐκ πίστεως εἰς πίστιν', and 'the righteous person will live by faith' represents the quotation of Habakkuk 2:4 ('Ὁ δὲ δίκαιος ἐκ πίστεως ζήσεται') as adapted by Paul, keeping the future tense of 'ζήσεται'.
  readability_notes:
  - By using the Saxon genitive ('God's righteousness' instead of 'the righteousness of God'), changing 'shall' to 'will', and replacing 'the righteous one' with 'the righteous person', the verse reads like natural, modern English while retaining its theological weight. Footnotes have been stripped of technical jargon (such as 'crux', 'substantival adjective', and 'transliterated Greek').
  compression_notes:
  - Academic explanations in the footnotes were compressed and simplified. The translation itself is not significantly shorter than POB, but grammatical friction was reduced to enhance flow and comprehension.
  risk_flags:
  - risk: There is a minor risk that 'God’s righteousness' might be interpreted slightly more as a personal attribute of God rather than a status given by God when compared to 'righteousness of God', but the footnote offering 'justice' and the flexibility of the English genitive mitigate this.
    mitigation: Flag retained for reviewer attention.
