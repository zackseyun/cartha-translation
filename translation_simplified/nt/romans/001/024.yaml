simplification_decisions:
- simplified_phrase: Therefore, God gave them over to impurity in the desires of their hearts
  preserved_meaning: Moved the destination of the handing over ('to impurity') closer to the verb ('gave them over') to avoid the awkward English structure of separating them with the long phrase 'in the desires of their hearts'. This greatly improves readability without changing any semantic weight.
  reasoning_layer_used: POB audit trail
  rationale: Moved the destination of the handing over ('to impurity') closer to the verb ('gave them over') to avoid the awkward English structure of separating them with the long phrase 'in the desires of their hearts'. This greatly improves readability without changing any semantic weight.
- simplified_phrase: so that their bodies would be dishonored
  preserved_meaning: Converted the nominalized prepositional phrase ('for the dishonoring of') back into a natural result clause with a passive verb ('would be dishonored') to match the Greek passive infinitive (ἀτιμάζεσθαι) and flow more naturally in modern English.
  reasoning_layer_used: POB audit trail
  rationale: Converted the nominalized prepositional phrase ('for the dishonoring of') back into a natural result clause with a passive verb ('would be dishonored') to match the Greek passive infinitive (ἀτιμάζεσθαι) and flow more naturally in modern English.
retained_terms:
- term: gave them over
  reason: Preserves the judicial sense of divine abandonment without over-interpreting it as 'judicially abandoned' or softening it to merely 'allowed them'.
- term: desires of their hearts
  reason: Preserves biblical anthropology ('hearts') and maintains a broad moral scope ('desires') rather than narrowing it prematurely to sexual 'lusts'.
- term: impurity
  reason: Maintains the moral-religious sense of uncleanness in a modern, non-archaic English word.
translation_notes:
  source_alignment_notes: The passive voice of 'ἀτιμάζεσθαι' is preserved through 'would be dishonored'. The prepositional phrase 'ἐν ταῖς ἐπιθυμίαις' (in the desires) is kept intact rather than being simplified to 'by' or 'through', respecting the POB lexical decision to represent the operative sphere.
  readability_notes:
  - Simplified the complex Greek sentence structure by rearranging the nested prepositional phrases. Moving 'to impurity' directly after 'gave them over' reduces cognitive load for the reader.
  compression_notes:
