  text: For although they knew God, they did not glorify him as God or thank him. Instead, their thinking[a] became futile, and their foolish hearts[b] were darkened.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “their reasoning,” “their thoughts,” or “their speculations.”
    reason: lexical_alternative
  - marker: b
    text: Greek has the singular “heart,” used collectively for their inner life.
    reason: source_note
