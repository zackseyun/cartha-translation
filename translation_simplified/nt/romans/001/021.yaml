  readability_notes:
  - Split a single, dense compound sentence into two shorter, more manageable sentences to improve comprehension for a general reader.
  - Changed 'their senseless heart was' to 'their foolish hearts were' to avoid a grammatically awkward plural-singular clash ('their heart was' vs 'their hearts were' in a non-distributive sense).
  compression_notes:
