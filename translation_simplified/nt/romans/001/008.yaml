translation_notes:
  source_alignment_notes: 'The simplified draft maintains the core structure of Paul’s thanksgiving: the initial priority (First of all), the direction of thanks (to my God), the mediator (through Jesus Messiah), the recipients (for all of you), and the cause (the worldwide reputation of their faith). The continuous passive aspect of καταγγέλλεται is preserved in ''is being spoken of''. Note that footnote marker [a] was relocated from ''First'' to ''Jesus Messiah'' to correctly align with the note text ''Or Christ''.'
  readability_notes:
  - '''First of all'' flows better than a solitary ''First'' at the start of a sentence in common modern English. ''Is being spoken of'' is more natural to the modern ear than ''is being proclaimed'' while conveying the same sense of widespread discussion.'
  compression_notes:
  - No major clauses were compressed or deleted, preserving the density of the original thought structure in a more readable format.
  risk_flags:
