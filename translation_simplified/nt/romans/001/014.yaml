  text: I am obligated to both Greeks and barbarians[a], to both the wise and the foolish.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'foreigners' or 'non-Greeks'. In the ancient world, 'barbarian' referred to anyone who did not speak Greek or share Greek culture, rather than someone who was wild or violent.
