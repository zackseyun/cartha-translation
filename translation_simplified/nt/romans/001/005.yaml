translation:
  language: en
  text: Through Jesus, we received grace and a commission to serve as apostles. Our purpose is to bring about the obedience of faith[a] among all the nations[b], for the sake of his name.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
