simplification_decisions:
- pob_phrase: Through whom
  simplified_phrase: Through Jesus
  preserved_meaning: Jesus is the one through whom grace and the commission were received.
  reasoning_layer_used: Immediate context and POB lexical rationale
  rationale: Naming the antecedent removes an obstacle for readers starting at this verse.
- pob_phrase: and apostleship
  simplified_phrase: and a commission to serve as apostles
  preserved_meaning: The distinct gift of a commissioned apostolic role remains separate from grace.
  reasoning_layer_used: POB lexical decision
  rationale: The concrete wording explains the unfamiliar abstract term without collapsing the two gifts.
- pob_phrase: for the obedience of faith
  simplified_phrase: Our purpose is to bring about the obedience of faith
  preserved_meaning: The apostolic ministry aims at obedience connected with faith while leaving that connection open.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: A new sentence makes the purpose clear while retaining the documented ambiguity.
interpretive_expansions:
- pob_phrase: Through whom
  rendering: Through Jesus
  claim: The relative pronoun refers to Jesus.
  evidence:
  - Romans 1:4 immediately identifies Jesus Christ as the antecedent.
  - The POB rationale explicitly connects the phrase to Jesus Messiah.
  confidence: high
- pob_phrase: apostleship
  rendering: a commission to serve as apostles
  claim: Apostleship here refers to a commissioned apostolic role.
  evidence:
  - The POB lexical rationale defines apostleship as Paul’s commissioned role.
  - The POB lists “an apostolic commission” as an allowed alternative.
  confidence: high
  alternatives_preserved:
  - apostleship
  - an apostolic commission
