translation:
  language: en
  text: For all who have sinned apart from the law[a] will also perish apart from the law. And all who have sinned under the law[b] will be judged by the law.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'without the law'; this refers to people who did not live under the Mosaic covenant.
    reason: simplification_note
  - marker: b
    text: Or 'in the law'; this refers to those within the jurisdiction of the Mosaic covenant.
    reason: simplification_note
simplification_decisions:
- simplified_phrase: have sinned
  preserved_meaning: Changed to the present perfect 'have sinned' to make the sentence sound more natural to modern readers, while still maintaining the aorist past-tense aspect of the original Greek.
  reasoning_layer_used: POB audit trail
  rationale: Changed to the present perfect 'have sinned' to make the sentence sound more natural to modern readers, while still maintaining the aorist past-tense aspect of the original Greek.
- simplified_phrase: by the law
  preserved_meaning: Simplified 'through the law' to 'by the law' for modern English clarity. This retains the judicial standard and means of judgment without using overly academic prepositional phrasing.
  reasoning_layer_used: POB audit trail
  rationale: Simplified 'through the law' to 'by the law' for modern English clarity. This retains the judicial standard and means of judgment without using overly academic prepositional phrasing.
- simplified_phrase: For all who have sinned... And all who have sinned...
  preserved_meaning: Divided the long, dense compound sentence into two shorter, parallel sentences to improve readability and sentence flow for a general audience.
  reasoning_layer_used: POB audit trail
  rationale: Divided the long, dense compound sentence into two shorter, parallel sentences to improve readability and sentence flow for a general audience.
retained_terms:
- term: the law
  reason: Retained 'the law' (nomos) as it is a crucial theological concept referring specifically to the Mosaic law in this context, which is clarified in the footnotes.
- term: perish
  reason: Retained 'perish' (apollumi) to preserve the original theological tension regarding the nature of final judgment, avoiding over-specifying it as either annihilation or eternal punishment.
translation_notes:
  source_alignment_notes: The translation carefully preserves the contrasts of the Greek text (anomōs vs. en nomō). The parallel structures are maintained even when split into two sentences.
  readability_notes:
  - By converting a complex compound sentence into two shorter declarative sentences and using 'have sinned' instead of the simple past 'sinned,' the text reads much more naturally in modern English without losing its solemn tone.
  compression_notes:
  - No significant theological or lexical meaning was compressed out. The change from 'through the law' to 'by the law' simplifies the preposition without losing the instrumental sense of the law in judgment.
  risk_flags:
  - risk: There is a slight risk that 'by the law' could be interpreted as 'by means of' rather than 'according to the standard of,' but this is the standard way modern readers understand judicial standards, and it remains faithful to the Greek 'dia'.
    mitigation: Flag retained for reviewer attention.
