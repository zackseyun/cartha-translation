translation:
  language: en
  text: So the person who is naturally uncircumcised, while keeping the law, will judge you. Even though you have the written law[a] and circumcision, you still break the law.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'the written code'; Greek literally reads 'the letter'.
    reason: simplification_note
