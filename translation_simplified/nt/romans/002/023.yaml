translation_notes:
  source_alignment_notes: The Greek phrase 'διὰ τῆς παραβάσεως τοῦ νόμου' (literally 'through the transgression of the law') is rendered as 'by breaking the law'. 'Breaking' is the most natural modern English equivalent for 'παράβασις' in this context. The second-person singular focus is preserved.
  readability_notes:
  - The sentence structure is simplified from a complex relative-clause question ('You who boast..., do you...') into a direct, compound-contrast question ('You boast..., but do you...'), which flows much better in contemporary spoken English.
  compression_notes:
  - No theological or rhetorical meaning has been lost. The essential tension between claiming status via the law and shaming God through disobedience is kept fully intact.
  risk_flags:
  - risk: Using 'breaking' instead of 'transgression' slightly softens the specific lexical nuance of crossing a defined boundary, but this is a very low-risk trade-off for significantly higher readability, and the nuance is preserved in the footnote.
    mitigation: Flag retained for reviewer attention.
