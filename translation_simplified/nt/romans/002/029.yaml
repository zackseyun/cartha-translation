translation:
  language: en
  text: Rather, a true Jew is one inwardly,[a] and circumcision is a matter of the heart—by the Spirit, not by the letter. This person's praise comes not from people, but from God.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'in spirit'; that is, in an inward, spiritual reality rather than an outward, written code.
    reason: simplification_note
simplification_decisions:
- simplified_phrase: Rather, a true Jew is one inwardly
  preserved_meaning: Using 'Rather' instead of 'But' sharpens the contrast with the preceding verse (v. 28). Adding 'true' clarifies Paul's argument that inward reality defines covenant membership, making the paradox accessible to modern readers.
  reasoning_layer_used: POB audit trail
  rationale: Using 'Rather' instead of 'But' sharpens the contrast with the preceding verse (v. 28). Adding 'true' clarifies Paul's argument that inward reality defines covenant membership, making the paradox accessible to modern readers.
- simplified_phrase: circumcision is a matter of the heart
  preserved_meaning: '''A matter of the heart'' is a natural modern idiom that perfectly preserves the metaphor of spiritual circumcision without sounding archaic.'
  reasoning_layer_used: POB audit trail
  rationale: '''A matter of the heart'' is a natural modern idiom that perfectly preserves the metaphor of spiritual circumcision without sounding archaic.'
- simplified_phrase: This person's praise
  preserved_meaning: By splitting the long POB sentence into two, 'whose' was changed to 'This person's' to provide a clear, direct grammatical subject for the second sentence.
  reasoning_layer_used: POB audit trail
  rationale: By splitting the long POB sentence into two, 'whose' was changed to 'This person's' to provide a clear, direct grammatical subject for the second sentence.
