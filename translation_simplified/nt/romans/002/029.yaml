translation:
  language: en
  text: Rather, a person is a true Jew inwardly, and their circumcision is of the heart—by the Spirit,[a] not by the letter. Such a person’s praise comes from God, not from people.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “in spirit”; the phrase may refer to inward spiritual reality rather than specifically to the Holy Spirit.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: But the Jew is one inwardly
  simplified_phrase: Rather, a person is a true Jew inwardly
  preserved_meaning: Jew refers to covenantal and religious identity expressed inwardly.
  reasoning_layer_used: POB lexical decision and immediate contrast
  rationale: The recast wording makes Paul’s contrast understandable while retaining inward Jewish identity.
- pob_phrase: circumcision is of the heart
  simplified_phrase: their circumcision is of the heart
  preserved_meaning: The heart remains the locus of the covenantal circumcision metaphor.
  reasoning_layer_used: POB lexical decision and grounding review
  rationale: The possessive link clarifies whose circumcision is meant without weakening the heart-circumcision image.
- pob_phrase: whose praise is not from people but from God
  simplified_phrase: Such a person’s praise comes from God, not from people
  preserved_meaning: God rather than people is the source of this person’s praise.
  reasoning_layer_used: POB lexical decision
  rationale: A separate sentence replaces the difficult relative clause with a clear subject.
interpretive_expansions:
- pob_phrase: the Jew is one inwardly
  rendering: a person is a true Jew inwardly
  claim: The inward Jew is presented as the genuine Jew in Paul’s contrast.
  evidence:
  - The immediate contrast in Romans 2:28–29 opposes outward identity to inward reality.
  - The POB rationale describes the contrast as covenantal and religious.
  confidence: high
  alternatives_preserved:
  - a Jew inwardly
