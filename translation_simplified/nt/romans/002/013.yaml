simplification_decisions:
- pob_phrase: the hearers of the law
  simplified_phrase: those who hear the law
  preserved_meaning: Merely hearing the law does not make someone righteous before God.
  reasoning_layer_used: POB lexical decision for ἀκροαταί
  rationale: The verbal form is more natural in common English while preserving the contrast with action.
- pob_phrase: the doers of the law
  simplified_phrase: those who do what the law says
  preserved_meaning: The contrasting group acts according to the law rather than only hearing it.
  reasoning_layer_used: POB lexical rationale for ποιηταί and independent grounding review
  rationale: This wording directly explains the otherwise unusual phrase “doers of the law.”
- pob_phrase: but
  simplified_phrase: Rather,
  preserved_meaning: The strong contrast between hearing and doing remains intact.
  reasoning_layer_used: Source rhetorical contrast and POB syntax
  rationale: A sentence break makes the contrast easier to follow without weakening it.
interpretive_expansions:
- pob_phrase: the doers of the law
  rendering: those who do what the law says
  claim: Doing the law means acting on its requirements.
  evidence:
  - The POB lexical rationale contrasts merely hearing the law with acting on it.
  - The Greek ποιηταί denotes those who do rather than only hear.
  confidence: high
  alternatives_preserved:
  - doers of the law
  - those who practice the law
translation_notes:
  risk_flags:
