translation:
  language: en
  text: For it is not those who hear the law who are righteous before God. Rather, those who do what the law says will be justified.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “will be declared righteous”; alternatively, “will be vindicated.”
