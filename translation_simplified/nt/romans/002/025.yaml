translation:
  language: en
  text: Circumcision indeed has value if you keep the law; but if you break the law, your circumcision has become uncircumcision.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: That is, circumcision loses its covenant value when the law is broken.
    reason: simplification_note
simplification_decisions:
- pob_phrase: is beneficial
  simplified_phrase: has value
  preserved_meaning: Circumcision provides real benefit under the stated condition.
  reasoning_layer_used: POB lexical decision for ὠφελεῖ
  rationale: The POB lists “is of value” as an equivalent, and “has value” is natural modern English.
- pob_phrase: if you practice the law
  simplified_phrase: if you keep the law
  preserved_meaning: The benefit depends on obeying the law.
  reasoning_layer_used: POB lexical decision for ἐὰν νόμον πράσσῃς
  rationale: The POB explicitly permits “keep the law” as the clearer English idiom.
- pob_phrase: if you are a transgressor of the law
  simplified_phrase: if you break the law
  preserved_meaning: The contrast concerns violating the law.
  reasoning_layer_used: POB lexical decision for παραβάτης νόμου
  rationale: The active wording removes a formal noun while preserving the covenantal violation.
translation_notes:
  risk_flags:
  - risk: “Has become uncircumcision” is culturally distant and may sound like a literal physical reversal.
    mitigation: The footnote explains the covenantal loss of value without weakening Paul’s concrete image.
