simplification_decisions:
- pob_phrase: You, therefore, who teach another
  simplified_phrase: So you teach someone else
  preserved_meaning: The wording keeps the logical transition, the act of teaching, and the singular person being taught.
  reasoning_layer_used: POB lexical decisions for οὖν, διδάσκων, and ἕτερον
  rationale: A direct clause with “So” is easier to follow than the formal relative-clause structure.
- pob_phrase: do you not teach yourself?
  simplified_phrase: but do you not teach yourself?
  preserved_meaning: The question still rebukes the teacher for failing to apply the teaching personally.
  reasoning_layer_used: POB lexical decisions for σεαυτόν and οὐ διδάσκεις
  rationale: Adding “but” makes the sharp contrast explicit without changing the accusation.
- pob_phrase: You who proclaim, “Do not steal,” do you steal?
  simplified_phrase: You proclaim, “Do not steal,” but do you steal?
  preserved_meaning: The public announcement, direct prohibition, and accusatory question all remain distinct.
  reasoning_layer_used: POB lexical decisions for κηρύσσων, μὴ κλέπτειν, and κλέπτεις
  rationale: Two direct clauses make Paul’s challenge immediately clear while preserving its parallel force.
translation_notes:
  risk_flags:
  - risk: The added “but” is not a separate Greek word in either question.
    mitigation: It only exposes the contrast already carried by the paired rhetorical clauses.
