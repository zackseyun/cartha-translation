translation:
  language: en
  text: Therefore, you have no excuse, O man[a]—every one of you who judges. By judging someone else, you condemn yourself, because you who judge practice the same things.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “O person” or “O human being.” The Greek word for “man” is masculine in form but refers here to any human being.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: you are without excuse
  simplified_phrase: you have no excuse
  preserved_meaning: The addressee has no valid defense.
  reasoning_layer_used: POB lexical decision for ἀναπολόγητος
  rationale: The idiomatic wording keeps the judicial force in clearer English.
- pob_phrase: O man, every one who judges
  simplified_phrase: O man—every one of you who judges
  preserved_meaning: The masculine singular address applies universally to each person who judges.
  reasoning_layer_used: POB lexical and theological decisions for ὦ ἄνθρωπε and πᾶς ὁ κρίνων
  rationale: The dash makes the apposition clear while retaining its representative masculine form and universal scope.
- pob_phrase: in passing judgment on another
  simplified_phrase: By judging someone else
  preserved_meaning: The act of judging another is the means by which the judge condemns himself.
  reasoning_layer_used: POB lexical rationale for ἐν ᾧ κρίνεις τὸν ἕτερον and grounding review
  rationale: “By judging” clearly preserves the source construction’s instrumental force.
translation_notes:
  risk_flags:
  - risk: “By judging” emphasizes the instrumental nuance more directly than the construction’s temporal nuance.
    mitigation: The act itself still supplies the occasion of self-condemnation, as the immediate clause makes clear.
