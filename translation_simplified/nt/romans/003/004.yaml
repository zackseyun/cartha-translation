translation_notes:
  source_alignment_notes: Preserves the Greek passive reading 'when you are judged' (εν τω κρινεσθαι σε) in the main text, while keeping the Hebrew Psalm 51:4 variant ('when you judge') in a footnote, exactly matching the textual-critical framework of the POB.
  readability_notes:
  - Smoothed the syntax by turning the noun phrase 'every person a liar' into a clausal condition ('even if every person is a liar'), which flows better in contemporary English. Updated archaic markers to help modern readers follow the rapid legal metaphor of the Psalm citation.
  compression_notes:
