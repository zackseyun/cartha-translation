translation:
  language: en
  text: 'Absolutely not! Let God be true, even if every person is a liar. As it is written: “So that you may be proven right[a] in your words, and prevail when you are judged.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, 'be justified' or 'be vindicated.'
    reason: simplification_note
  - marker: b
    text: Or, 'when you judge'; this reflects the Hebrew wording of Psalm 51:4 more directly, while Romans' Greek wording is naturally read as 'when you are judged.'
    reason: simplification_note
simplification_decisions:
- simplified_phrase: Absolutely not!
  preserved_meaning: Replaced the archaic 'May it never be!' with 'Absolutely not!' to capture Paul's intense rhetorical repudiation in immediate, highly emphatic modern English.
  reasoning_layer_used: POB audit trail
  rationale: Replaced the archaic 'May it never be!' with 'Absolutely not!' to capture Paul's intense rhetorical repudiation in immediate, highly emphatic modern English.
- simplified_phrase: even if every person is a liar
  preserved_meaning: Introduced 'even if' to clarify the logical relationship and sharp contrast between God's absolute truthfulness and human untrustworthiness for a modern reader.
  reasoning_layer_used: POB audit trail
  rationale: Introduced 'even if' to clarify the logical relationship and sharp contrast between God's absolute truthfulness and human untrustworthiness for a modern reader.
- simplified_phrase: be proven right
  preserved_meaning: Translated 'δικαιωθῇς' as 'be proven right' to make the forensic, judicial sense of vindication immediately clear without relying on the heavily ecclesiastical word 'justified' in the main text. Traditional alternatives are preserved in the footnote.
  reasoning_layer_used: POB audit trail
  rationale: Translated 'δικαιωθῇς' as 'be proven right' to make the forensic, judicial sense of vindication immediately clear without relying on the heavily ecclesiastical word 'justified' in the main text. Traditional alternatives are preserved in the footnote.
