translation:
  language: en
  text: Since God is one[a], he will declare circumcised people righteous by faith and uncircumcised people righteous through faith[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “if indeed God is one.”
    reason: alternative_reading
  - marker: b
    text: Paul uses two different expressions, “by faith” and “through faith”; the difference may be stylistic rather than a sharp contrast.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: will justify
  simplified_phrase: will declare ... righteous
  preserved_meaning: God will give both groups a righteous standing.
  reasoning_layer_used: POB lexical decision for δικαιώσει
  rationale: The recorded alternative explains the theological term in common English while retaining the future tense.
- pob_phrase: the circumcised ... the uncircumcised
  simplified_phrase: circumcised people ... uncircumcised people
  preserved_meaning: The source refers to people by whether they are circumcised.
  reasoning_layer_used: POB lexical decisions for περιτομήν and ἀκροβυστίαν
  rationale: Adding “people” makes both metonymic labels immediately understandable without replacing them with ethnic names.
- pob_phrase: by faith ... through faith
  simplified_phrase: by faith ... through faith
  preserved_meaning: Both groups are declared righteous in relation to faith, while the Greek prepositional difference remains visible.
  reasoning_layer_used: POB theological decision on ἐκ πίστεως and διὰ τῆς πίστεως
  rationale: The distinct expressions are retained without claiming that they mark a doctrinal contrast.
translation_notes:
  risk_flags:
  - risk: “Circumcised people” and “uncircumcised people” may still be culturally unfamiliar.
    mitigation: The wording identifies them as groups of people while avoiding the less certain ethnic labels “Jews” and “Gentiles.”
  - risk: Readers may infer a strong distinction between “by” and “through.”
    mitigation: Footnote [b] states that the difference may be stylistic.
