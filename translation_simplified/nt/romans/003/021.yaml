- simplified_phrase: testified to by
  preserved_meaning: Changed 'attested' to 'testified to' because 'attested' is too academic for a modern common reader. 'Testified to' maintains the legal and witness connotations of the Greek word μαρτυρουμένη in simpler English.
  reasoning_layer_used: POB audit trail
  rationale: Changed 'attested' to 'testified to' because 'attested' is too academic for a modern common reader. 'Testified to' maintains the legal and witness connotations of the Greek word μαρτυρουμένη in simpler English.
- simplified_phrase: the righteousness of God
  preserved_meaning: Retained the exact phrase rather than using a dynamic equivalent like 'God's way of making people right.' This preserves the theological ambiguity of the genitive θεοῦ (the righteousness that is God's own attribute vs. the righteousness that comes from God as a gift), keeping the text in line with POB's theological decisions.
