simplification_decisions:
- pob_phrase: in God’s forbearance
  simplified_phrase: while holding back immediate judgment
  preserved_meaning: God deliberately restrained the judgment that sin deserved.
  reasoning_layer_used: POB lexical decision for ἀνοχῇ and immediate context
  rationale: This explains the specific kind of patience meant by “forbearance.”
- pob_phrase: for the demonstration of his righteousness
  simplified_phrase: to show his righteousness
  preserved_meaning: God’s action displays his righteousness at the present time.
  reasoning_layer_used: POB lexical decision for ἔνδειξιν
  rationale: The active phrase is clearer without strengthening “demonstration” into “proof.”
- pob_phrase: so that he might be just and the justifier of the one who has faith in Jesus
  simplified_phrase: In this way, he is just, and he justifies anyone who has faith in Jesus
  preserved_meaning: God is both just and the one who justifies those who trust in Jesus.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The verb “justifies” preserves Paul’s just/justifies connection in natural English.
