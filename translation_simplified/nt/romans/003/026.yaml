  reasoning_layer_used: POB audit trail
  rationale: Converted the academic noun phrase 'for the demonstration of' into an active infinitive 'to show' for natural reading.
- simplified_phrase: He did this to prove that he is just, and that he justifies anyone who has faith in Jesus
