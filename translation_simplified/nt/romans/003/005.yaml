simplification_decisions:
- pob_phrase: demonstrates God’s righteousness
  simplified_phrase: shows God’s righteousness
  preserved_meaning: Human wrongdoing makes God’s righteousness evident.
  reasoning_layer_used: POB lexical decision for συνίστησιν
  rationale: “Shows” is the clearest common equivalent among the documented alternatives.
- pob_phrase: Is God unjust to inflict wrath?
  simplified_phrase: God is not unjust to bring wrath, is he?
  preserved_meaning: Paul voices an objection that expects the answer that God is not unjust in judgment.
  reasoning_layer_used: POB lexical and theological decisions for μὴ ἄδικος and ἐπιφέρων τὴν ὀργήν
  rationale: The negative tag preserves the expected answer, while “bring wrath” avoids the formal verb “inflict” without naming an unstated recipient.
- pob_phrase: I am speaking in a human way
  simplified_phrase: I am speaking from a human perspective
  preserved_meaning: Paul identifies the objection as reasoning expressed from a merely human standpoint.
  reasoning_layer_used: POB lexical decision for κατὰ ἄνθρωπον λέγω
  rationale: “From a human perspective” states the idiom naturally for modern readers.
translation_notes:
  risk_flags:
  - risk: The negative tag makes the rhetorical expectation more explicit than a neutral English question would.
    mitigation: This force is warranted by μή and required by the POB theological audit.
  - risk: “Bring wrath” retains a biblical term that some new readers may find conceptually difficult.
    mitigation: Keeping “wrath” preserves the judicial gravity of the POB wording without adding a recipient.
