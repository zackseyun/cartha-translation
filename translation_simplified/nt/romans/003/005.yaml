translation:
  language: en
  text: But if our unrighteousness shows God’s righteousness[a], what should we say? God is not unjust to bring wrath, is he? (I am speaking from a human perspective.)
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “our injustice shows God’s justice.”
