translation:
  language: en
  text: God presented him as an atoning sacrifice[a] through faith in his blood[b]. He did this to show his righteousness[c], because he had passed over the sins committed in the past.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “propitiation”; or “mercy seat,” the gold cover of the Ark of the Covenant where atoning blood was sprinkled in the Old Testament.
    reason: lexical_alternative
  - marker: b
    text: Or “through faith, by his blood.”
    reason: alternative_reading
  - marker: c
    text: Or “justice.”
    reason: lexical_alternative
