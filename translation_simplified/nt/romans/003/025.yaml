translation:
  language: en
  text: God presented him as an atoning sacrifice[a] through faith in his blood[b]. He did this to show his righteousness[c], because he had passed over the sins committed in the past.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'propitiation' (an offering that satisfies God's anger); or 'mercy seat' (the gold cover of the Ark of the Covenant where blood was sprinkled for forgiveness in the Old Testament).
    reason: simplification_note
  - marker: b
    text: Or 'through faith, by his blood'.
    reason: simplification_note
  - marker: c
    text: Or 'justice'.
    reason: simplification_note
