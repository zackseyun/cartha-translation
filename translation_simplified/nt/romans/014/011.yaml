  preserved_meaning: The Lord solemnly guarantees the declaration by his life.
  reasoning_layer_used: POB lexical rationale for Ζῶ ἐγώ
  rationale: Adding “surely” communicates the oath-like force of the idiom.
- pob_phrase: every tongue will confess to God
