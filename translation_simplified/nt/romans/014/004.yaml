translation:
  language: en
  text: Who are you to judge someone else’s household servant? He stands or falls before his own master. But he will be made to stand, because the Lord is able to make him stand.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: another's household slave
  simplified_phrase: someone else’s household slave
  preserved_meaning: The person belongs to another household while the bonded status remains explicit.
  reasoning_layer_used: POB lexical decision for ἀλλότριον οἰκέτην
  rationale: “Someone else’s” is more conversational, while “household slave” preserves the socially significant relation.
- pob_phrase: before his own lord
  simplified_phrase: before his own master
  preserved_meaning: The slave is accountable to his own master, not to an outsider.
  reasoning_layer_used: POB lexical rationale and household analogy
  rationale: “Master” makes the household analogy immediately clear without changing the relation expressed.
- pob_phrase: and he will be made to stand, for
  simplified_phrase: But he will be made to stand, because
  preserved_meaning: The Lord’s power grounds the assurance that the person will stand.
  reasoning_layer_used: POB lexical decisions for σταθήσεται and δυνατεῖ γὰρ
  rationale: A new sentence and explicit causal wording clarify the contrast and reason while retaining divine agency.
translation_notes:
  risk_flags:
