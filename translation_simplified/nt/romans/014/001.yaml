simplification_decisions:
- pob_phrase: Receive the one
  simplified_phrase: Welcome anyone
  preserved_meaning: Take the person into your company and fellowship.
  reasoning_layer_used: POB lexical decision for προσλαμβάνεσθε
  rationale: “Welcome” states the communal acceptance naturally, while “anyone” avoids awkward generic wording.
- pob_phrase: not for disputes over opinions
  simplified_phrase: but not in order to argue about opinions
  preserved_meaning: Do not welcome the person for the purpose of contentious debate over differing views.
  reasoning_layer_used: POB lexical decisions for μὴ εἰς, διακρίσεις, and διαλογισμῶν
  rationale: The purpose clause is made explicit in ordinary English without narrowing “opinions” to scruples.
translation_notes:
