translation:
  language: en
  text: Anyone who observes the day does so for the Lord. Anyone who eats does so for the Lord, because he gives thanks to God. Anyone who does not eat refrains for the Lord, and he gives thanks to God.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: The one who observes the day, observes it for the Lord.
  simplified_phrase: Anyone who observes the day does so for the Lord.
  preserved_meaning: The person gives practical regard to the unspecified day for the Lord.
  reasoning_layer_used: POB lexical and theological decisions on φρονέω and ἡμέραν
  rationale: “Does so” removes awkward repetition without identifying which day is meant.
- pob_phrase: the one who eats, eats for the Lord
  simplified_phrase: Anyone who eats does so for the Lord
  preserved_meaning: Eating in the disputed matter is practiced for the Lord.
  reasoning_layer_used: POB lexical decision on ἐσθίων and κυρίῳ
  rationale: The shorter wording keeps the action and its purpose clear.
- pob_phrase: the one who does not eat, does not eat for the Lord
  simplified_phrase: Anyone who does not eat refrains for the Lord
  preserved_meaning: The non-eater specifically refrains from eating for the Lord.
  reasoning_layer_used: POB lexical decision on ὁ μὴ ἐσθίων and grounding review
  rationale: “Refrains” avoids vague “does this” while preserving the explicit eating contrast.
translation_notes:
  risk_flags:
  - risk: “The day” could be mistaken for a specifically identified Sabbath, feast, or fast day.
    mitigation: The text retains POB’s intentionally general wording and adds no identification.
  - risk: “Refrains” may be read more broadly than refraining from food.
    mitigation: The preceding words “does not eat” explicitly define the act of refraining.
