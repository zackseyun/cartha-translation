translation:
  language: en
  text: For if your brother[a] is distressed by what you eat, you are no longer walking as love requires. Do not allow what you eat to destroy[b] the person for whom Messiah died.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word for “brother” may represent a brother or sister in the community of believers.
    reason: lexical_alternative
  - marker: b
    text: Or, “ruin”; the strong Greek verb warns of severe harm without specifying the precise doctrinal outcome.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: is grieved because of food
  simplified_phrase: is distressed by what you eat
  preserved_meaning: Another believer experiences sorrow or distress because of the reader’s food choice.
  reasoning_layer_used: POB lexical decision for λυπεῖται and βρῶμα
  rationale: “Distressed” and “what you eat” express the same ideas in more natural modern English.
- pob_phrase: walking according to love
  simplified_phrase: walking as love requires
  preserved_meaning: Love remains the standard by which the reader’s conduct is measured.
  reasoning_layer_used: POB lexical decisions for περιπατεῖς and κατὰ ἀγάπην
  rationale: This keeps the walking image while making the ethical standard immediately clear.
- pob_phrase: Do not destroy that one with your food
  simplified_phrase: Do not allow what you eat to destroy the person
  preserved_meaning: The reader must not cause severe harm to the other believer through a food choice.
  reasoning_layer_used: POB lexical and theological decisions for ἀπόλλυε and τῷ βρώματί σου
  rationale: The recast sentence removes the awkward instrumental word order without weakening the warning.
translation_notes:
  risk_flags:
  - risk: “Destroy” may be read as defining a specific doctrine of final perdition.
    mitigation: Footnote b preserves the verb’s range and the POB’s unresolved theological tension.
  - risk: “Do not allow” may sound less direct than the Greek prohibition.
    mitigation: The wording remains an imperative and directly assigns responsibility for preventing the harm.
