translation:
  language: en
  text: But if someone doubts whether it is right to eat and then eats, he is condemned, because he is not acting from faith.[a] Everything that does not come from faith is sin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “From faith” can include acting with settled conviction before God.
    reason: lexical_alternative
