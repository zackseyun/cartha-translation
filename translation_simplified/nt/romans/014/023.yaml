  preserved_meaning: The doubt concerns whether eating is right, and eating despite that doubt results in condemnation.
  reasoning_layer_used: Immediate context and POB lexical rationale for διακρινόμενος
  rationale: Naming the object of doubt makes the contextual scruple clear without specifying who condemns.
- pob_phrase: because it is not from faith
