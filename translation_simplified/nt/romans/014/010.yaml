translation:
  language: en
  text: But why do you judge your brother? Or why do you too look down on your brother? For we will all stand before God’s judgment seat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some manuscripts read “the judgment seat of Christ.”
