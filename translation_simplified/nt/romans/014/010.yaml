simplification_decisions:
- pob_phrase: But you, why do you judge your brother?
  simplified_phrase: But why do you judge your brother?
  preserved_meaning: The question remains a direct, contrasting rebuke against judging a brother.
  reasoning_layer_used: POB lexical decision for Σὺ δὲ and τί κρίνεις
  rationale: Natural word order preserves the contrast without the awkward isolated pronoun.
- pob_phrase: Or you also, why do you despise your brother?
  simplified_phrase: Or why do you too look down on your brother?
  preserved_meaning: The second person is also rebuked for treating a brother as beneath regard.
  reasoning_layer_used: POB lexical decisions for ἢ καὶ σὺ and τί ἐξουθενεῖς
  rationale: “Too” keeps the additive emphasis, while “look down on” clearly expresses contempt.
- pob_phrase: For we will all stand before the judgment seat of God
  simplified_phrase: For we will all stand before God’s judgment seat
  preserved_meaning: Everyone will appear before God as judge, which explains the preceding rebukes.
  reasoning_layer_used: POB lexical and theological decisions for γάρ, βῆμα, and τοῦ θεοῦ
  rationale: The possessive form is smoother English while preserving the causal link and courtroom image.
translation_notes:
  risk_flags:
  - risk: “Look down on” may sound less severe than “despise.”
    mitigation: The phrase still conveys treating another person with contempt and follows a POB-approved alternative.
  - risk: Some manuscripts identify the judgment seat with Christ rather than God.
    mitigation: The main text follows SBLGNT, and the variant is retained in footnote [a].
