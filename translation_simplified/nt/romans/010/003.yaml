translation:
  language: en
  text: For they did not understand God's righteousness[a], and they tried to set up their own. So they did not submit to God's righteousness[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'the righteousness of God'; in Paul this can also include God's righteous way of making people right.
    reason: simplification_note
  - marker: b
    text: Or 'the righteousness that comes from God.'
    reason: simplification_note
