translation:
  language: en
  text: For they did not understand the righteousness of God[a], and they tried to establish their own righteousness. So they did not submit to the righteousness of God.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “justice.” In Paul, “righteousness” here can include God's righteous way of making people right.
    reason: lexical_alternative
  - marker: b
    text: “The righteousness of God” may also mean “righteousness from God” or “God's righteousness.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: being ignorant of
  simplified_phrase: they did not understand
  preserved_meaning: They failed to recognize the righteousness of God without implying deliberate rejection.
  reasoning_layer_used: POB lexical decision for ἀγνοοῦντες
  rationale: A direct clause is easier to understand than the participial construction.
- pob_phrase: seeking to establish their own
  simplified_phrase: they tried to establish their own righteousness
  preserved_meaning: They attempted to establish a righteousness of their own.
  reasoning_layer_used: POB lexical decisions for ζητοῦντες, στῆσαι, and ἰδίαν
  rationale: Naming “righteousness” makes the implied object immediately clear.
- pob_phrase: they did not submit to the righteousness of God
  simplified_phrase: So they did not submit to the righteousness of God
  preserved_meaning: Their failure to understand and their competing effort explain their lack of submission.
  reasoning_layer_used: POB syntax and lexical decision for ὑπετάγησαν
  rationale: A separate sentence makes the causal relationship clear while preserving submission language.
interpretive_expansions:
- pob_phrase: being ignorant ... and seeking ... they did not submit
  rendering: They did not understand ... and they tried ... So they did not submit
  claim: The first two actions explain the resulting failure to submit.
