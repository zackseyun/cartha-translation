translation:
  language: en
  text: Those of us who are strong should bear with the limitations of those who are weak, rather than please ourselves.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: We who are strong
  simplified_phrase: Those of us who are strong
  preserved_meaning: The speaker includes himself among believers whose consciences are strong.
  reasoning_layer_used: POB theological decision on the strong and the weak
  rationale: This sounds natural while preserving the contextual strong-and-weak contrast.
- pob_phrase: bear the weaknesses of the weak
  simplified_phrase: bear with the limitations of those who are weak
  preserved_meaning: The strong must patiently support believers whose consciences impose greater restrictions.
  reasoning_layer_used: POB lexical decisions for ἀσθενήματα and βαστάζειν
  rationale: “Limitations” avoids implying physical illness or moral failure, while “bear with” retains active patient responsibility.
- pob_phrase: and not please ourselves
  simplified_phrase: rather than please ourselves
  preserved_meaning: Supporting the weak is contrasted with pursuing one's own preferences.
  reasoning_layer_used: POB lexical decision for καὶ μὴ ἑαυτοῖς ἀρέσκειν
  rationale: “Rather than” makes the ethical contrast clear without adding the unsupported emphasis of “just.”
translation_notes:
  risk_flags:
  - risk: “Bear with” could be heard as mere tolerance.
    mitigation: Its object, “the limitations,” and the obligation expressed by “should” retain the call to patient support.
