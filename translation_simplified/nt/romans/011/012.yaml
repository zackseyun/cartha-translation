  reasoning_layer_used: POB lexical decisions for πλοῦτος, κόσμου, and ἐθνῶν
  rationale: “Brought riches to” expresses the result naturally while preserving the riches metaphor.
- pob_phrase: how much more will their fullness mean?
  simplified_phrase: how much greater riches will their fullness bring!
  preserved_meaning: Their fullness will produce a result greater than the riches already described.
  reasoning_layer_used: Immediate parallel and POB theological decision on πλήρωμα
  rationale: Supplying the implied riches makes the lesser-to-greater argument clear without defining fullness.
