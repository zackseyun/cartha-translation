translation:
  language: en
  text: When it comes to the gospel, they are enemies for your benefit. But when it comes to God’s choosing, they are loved because of the fathers.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “The fathers” refers to Israel’s patriarchs, especially Abraham, Isaac, and Jacob.
    reason: simplification_note
simplification_decisions:
- pob_phrase: With respect to the gospel ... with respect to election
  simplified_phrase: When it comes to the gospel ... when it comes to God’s choosing
  preserved_meaning: Preserves the two contrasting perspectives on the same people.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The repeated wording makes Paul’s contrast clear in common English.
- pob_phrase: for your sake
  simplified_phrase: for your benefit
  preserved_meaning: Their status regarding the gospel has served the inclusion of the Gentile readers.
  reasoning_layer_used: POB lexical rationale and Romans 11 context
  rationale: “For your benefit” clearly expresses the beneficial sense supported by Paul’s argument.
- pob_phrase: they are beloved
  simplified_phrase: they are loved
  preserved_meaning: They remain the objects of covenantal love despite their status regarding the gospel.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: “Loved” is more familiar while preserving the verse’s theological tension.
interpretive_expansions:
- pob_phrase: election
  rendering: God’s choosing
  claim: Election here means God’s act and purpose of choosing.
  evidence:
  - The POB lexical rationale identifies the term as God’s electing purpose.
  - Romans 11:5–7 places election within God’s choosing.
  - Romans 11:29 grounds the argument in God’s continuing call.
  confidence: high
  alternatives_preserved:
  - election
  - God’s electing purpose
translation_notes:
  risk_flags:
  - risk: “God’s choosing” makes the implied agent explicit.
    mitigation: The POB audit and immediate context directly identify election as God’s choosing.
  - risk: “Enemies” could be mistaken for a denial of God’s love.
    mitigation: The contrasting statement that they are loved preserves Paul’s deliberate tension.
