translation:
  language: en
  text: So I ask, did they stumble so that they would fall? Absolutely not![a] Instead, because of their trespass, salvation has come to the Gentiles,[b] to make Israel jealous.[c]
  philosophy: optimal-equivalence
  footnotes:
