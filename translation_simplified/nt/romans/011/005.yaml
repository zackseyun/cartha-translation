simplification_decisions:
- pob_phrase: So then, in the present time also
  simplified_phrase: So too, at the present time
  preserved_meaning: This draws the same conclusion for Paul's time as for Elijah's day.
  reasoning_layer_used: POB lexical decision for οὕτως οὖν καὶ and ἐν τῷ νῦν καιρῷ
  rationale: The shorter wording preserves both the inference and the temporal parallel.
- pob_phrase: a remnant
  simplified_phrase: a remnant—a small group of Israelites
  preserved_meaning: The remnant is the surviving minority of Israel discussed in the passage.
  reasoning_layer_used: POB lexical rationale and Romans 11:1–5
  rationale: The gloss explains an important biblical term without removing it.
- pob_phrase: according to the election of grace
  simplified_phrase: in keeping with God's gracious election
  preserved_meaning: Election remains related to grace without defining grace solely as its cause.
  reasoning_layer_used: POB lexical and theological decisions for κατ’ ἐκλογὴν χάριτος
  rationale: “In keeping with” avoids the causal narrowing of “because of” while making the phrase more natural.
interpretive_expansions:
- pob_phrase: a remnant
  rendering: a remnant—a small group of Israelites
  claim: The remnant here consists of a minority from Israel.
  evidence:
  - Romans 11:1–5 explicitly concerns whether God has rejected his people Israel.
  confidence: high
  alternatives_preserved:
  - a surviving minority
- pob_phrase: the election of grace
  rendering: God's gracious election
  claim: God is the one whose election is in view.
  evidence:
  - Romans 11:2–4 presents God as preserving a people in the parallel from Elijah's time.
  confidence: high
  alternatives_preserved:
  - the election of grace
  - election by grace
