  rationale: “Knew beforehand” is easier to understand while the note preserves the debated stronger reading.
- pob_phrase: in the passage about Elijah
  simplified_phrase: in the passage about Elijah
  preserved_meaning: It identifies the section of Scripture concerning Elijah rather than a location.
  reasoning_layer_used: POB lexical decision on ἐν Ἠλίᾳ
  rationale: This explanatory wording keeps the Greek idiom understandable in English.
- pob_phrase: how he appeals to God against Israel
  simplified_phrase: how he appeals to God against Israel
  preserved_meaning: It retains both Elijah’s appeal and its adversarial direction against Israel.
  reasoning_layer_used: POB lexical decisions on ἐντυγχάνει and κατά
  rationale: The present tense and distinct force of the appeal are preserved.
