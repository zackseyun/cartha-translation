translation:
  language: en
  text: God has not rejected his people, whom he knew beforehand.[a] Or do you not know what Scripture says in the passage about Elijah—how he appeals to God against Israel?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “foreknew.” The Greek says that God knew his people beforehand; this verse does not settle whether that also implies that he chose them beforehand.
    reason: lexical_alternative
