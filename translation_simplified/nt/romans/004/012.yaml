translation:
  language: en
  text: He is also the father of those who are circumcised, but not merely circumcised. They also walk in the footsteps of the faith that our father Abraham had before he was circumcised.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the father of circumcision
  simplified_phrase: the father of those who are circumcised
  preserved_meaning: Abraham is the father of the circumcised community, not of the ritual itself.
  reasoning_layer_used: POB lexical decision for πατέρα περιτομῆς
  rationale: The concrete wording is clearer than the abstract phrase for modern readers.
- pob_phrase: to those who are not merely circumcised, but who also walk
  simplified_phrase: but not merely circumcised. They also walk
  preserved_meaning: Abraham's fatherhood is restricted to circumcised people who also follow his pattern of faith.
  reasoning_layer_used: POB theological decision and grounding review
  rationale: Two sentences preserve the qualification without turning it into two causes.
- pob_phrase: while uncircumcised
  simplified_phrase: before he was circumcised
  preserved_meaning: Abraham had this faith while he was still in an uncircumcised state.
  reasoning_layer_used: POB lexical decision for ἐν ἀκροβυστίᾳ
  rationale: The temporal sequence is easier to understand in ordinary English.
interpretive_expansions:
- pob_phrase: while uncircumcised
  rendering: before he was circumcised
  claim: Abraham's faith preceded his circumcision.
  evidence:
  - The POB lexical rationale identifies the phrase as temporal and refers to Abraham's faith before circumcision.
  - The immediate argument contrasts Abraham's faith with his later circumcision.
  confidence: high
  alternatives_preserved:
  - while uncircumcised
translation_notes:
  risk_flags:
