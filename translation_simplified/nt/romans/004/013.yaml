translation:
  language: en
  text: The promise that Abraham or his offspring[a] would inherit the world was not given through the law. It was given through the righteousness of faith.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “seed.” The Greek word is singular but can refer collectively to descendants.
    reason: lexical_alternative
  - marker: b
    text: The phrase may also mean “righteousness that comes by faith” or “righteousness by faith.” Here “faith” may also be translated “trust” or “faithfulness.”
    reason: alternative_reading
