simplification_decisions:
- preserved_meaning: Converted the awkward substantival participle 'the one not working' into the natural relative clause 'the one who does not work'.
  reasoning_layer_used: POB audit trail
  rationale: Converted the awkward substantival participle 'the one not working' into the natural relative clause 'the one who does not work'.
- preserved_meaning: Changed 'but believing in' to 'but believes in' to maintain parallel structure with the preceding verb.
  reasoning_layer_used: POB audit trail
  rationale: Changed 'but believing in' to 'but believes in' to maintain parallel structure with the preceding verb.
- preserved_meaning: Used the singular gender-neutral 'their faith' instead of 'his faith' to better match modern standard English usage without changing the universal application.
  reasoning_layer_used: POB audit trail
  rationale: Used the singular gender-neutral 'their faith' instead of 'his faith' to better match modern standard English usage without changing the universal application.
- preserved_meaning: Corrected the placement of footnote [a] (which was erroneously placed on 'working' in the POB source) to associate 'trusts' with 'believes'.
  reasoning_layer_used: POB audit trail
  rationale: Corrected the placement of footnote [a] (which was erroneously placed on 'working' in the POB source) to associate 'trusts' with 'believes'.
retained_terms:
- term: believes (πιστεύοντι) - Retained to preserve the core Pauline contrast between faith and works.
  reason: Retained to preserve POB's source-grounded terminology.
- term: justifies (δικαιοῦντα) - Preserved to maintain the forensic/theological weight without importing denominational bias.
  reason: Retained to preserve POB's source-grounded terminology.
- term: ungodly (ἀσεβῆ) - Maintained to keep the precise theological focus on impiety rather than general moral evil.
  reason: Retained to preserve POB's source-grounded terminology.
- term: counted (λογίζεται) - Retained to preserve the essential accounting and imputation metaphor.
  reason: Retained to preserve POB's source-grounded terminology.
- term: righteousness (δικαιοσύνη) - Kept to maintain the critical lexical link to 'justifies'.
  reason: Retained to preserve POB's source-grounded terminology.
translation_notes:
  source_alignment_notes: Maintains strict SBLGNT semantic boundaries. Every Greek lemma (ἐργαζομένῳ, πιστεύοντι, δικαιοῦντα, ἀσεβῆ, λογίζεται, πίστις, δικαιοσύνην) is accurately accounted for, keeping the doctrinal force intact.
  readability_notes:
  - Replacing direct participle translations ('not working', 'believing') with active verbs in relative clauses ('who does not work, but believes') dramatically improves readability without losing accuracy. Standardizing 'their faith' sounds much more natural to modern ears.
  compression_notes:
  - No words or concepts were compressed or omitted; the full rhetorical and theological force of the Pauline argument remains perfectly intact.
