translation_notes:
  source_alignment_notes: The Greek perfect infinitive 'heurekenai' is represented by 'has found'. The phrase 'kata sarka' (according to the flesh) syntactically modifies 'forefather' (propatora) in the primary reading, which is rendered as 'physical ancestor'. The alternative syntax (where it modifies 'has found') is preserved in the footnote.
  readability_notes:
  - By translating 'according to the flesh' as 'physical ancestor', we avoid the theological jargon of 'flesh' which often confuses modern readers, while still conveying the exact genealogical relationship Paul intended.
  compression_notes:
  - No clauses were omitted. The phrase 'forefather according to the flesh' was compressed into 'physical ancestor' to reduce cognitive load and remove archaic phrasing.
  risk_flags:
  - risk: There is a minor risk that simplifying 'according to the flesh' removes a signature Pauline term, but this is mitigated by documenting the literal phrase in the footnote.
    mitigation: Flag retained for reviewer attention.
