translation:
  language: en
  text: He received the sign of circumcision as a seal of the righteousness[a] he had by faith while he was still uncircumcised. In this way, he became the father of all who believe without being circumcised, so that righteousness might be counted[b] to them as well.
  philosophy: optimal-equivalence
