translation:
  language: en
  text: He received circumcision as a sign and as a seal of the righteousness[a] he had through faith while he was still uncircumcised. This was so that he might be the father of all who believe while uncircumcised, and so that righteousness might be counted[b] to them as well.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “justice” instead of “righteousness” throughout this verse.
    reason: lexical_alternative
  - marker: b
    text: Or “credited” or “reckoned.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the sign of circumcision as a seal
  simplified_phrase: circumcision as a sign and as a seal
  preserved_meaning: Circumcision remains both the outward sign and the authenticating seal.
  reasoning_layer_used: POB lexical decisions for σημεῖον, περιτομή, and σφραγίς
  rationale: Reordering the phrase makes both images easier to recognize without flattening either one.
- pob_phrase: the righteousness of the faith that he had while uncircumcised
  simplified_phrase: the righteousness he had through faith while he was still uncircumcised
  preserved_meaning: Abraham had righteousness through faith before he was circumcised.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The dense genitive chain becomes a direct statement while preserving the sequence central to Paul’s argument.
- pob_phrase: so that he might be the father ... so that righteousness might be counted
  simplified_phrase: This was so that he might be the father ... and so that righteousness might be counted
  preserved_meaning: Both linked purpose clauses remain purposes rather than completed results caused by circumcision.
  reasoning_layer_used: POB syntax and independent grounding review
  rationale: A new sentence improves readability while retaining the repeated purpose relationship.
translation_notes:
  risk_flags:
  - risk: The phrase “This was so that” could be misread as making circumcision the cause of righteousness.
    mitigation: The first sentence states that Abraham already had righteousness through faith before circumcision.
