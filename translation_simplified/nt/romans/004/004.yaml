translation_notes:
  source_alignment_notes: Preserves the Paulic economic metaphor contrasting earned pay (μισθός) and debt/obligation (ὀφείλημα) against unearned gift/favor (χάρις).
  readability_notes:
  - Converting the highly formal, substantival construction 'to the one who works' into a conditional-style clause ('when someone works') increases readability for modern readers without shifting theological meaning.
  compression_notes:
  - No lexical details or theological pressures were compressed; the sentence structure was merely streamlined for readability.
  risk_flags:
  - risk: Rendering 'charis' as 'gift' rather than 'grace' fits the economic metaphor perfectly, but risks obscuring the thematic connection to Paul's theology of grace; this risk is mitigated by footnote [a].
    mitigation: Flag retained for reviewer attention.
