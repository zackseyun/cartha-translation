translation:
  language: en
  text: As it is written, “I have made you the father of many nations.”[b] Abraham is our father in the presence of the God he believed in—the God who gives life to the dead and calls things that do not exist as though they exist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, more interpretively, “calls into existence the things that do not exist.”
    reason: alternative_reading
  - marker: b
    text: “Nations” may also mean “Gentiles,” but the broader sense is more likely in this quotation from Genesis.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: “I have made you the father of many nations”—in the presence of the God
  simplified_phrase: “I have made you the father of many nations.” Abraham is our father in the presence of the God
  preserved_meaning: The phrase about God’s presence describes Abraham as the father of all believers from verse 16.
  reasoning_layer_used: Immediate context and POB syntax
  rationale: Restating the interrupted connection makes the sentence understandable without changing its claim.
- pob_phrase: the things that are not as though they were
  simplified_phrase: things that do not exist as though they exist
  preserved_meaning: God speaks of nonexistent things as existing without explicitly defining this as creation from nothing.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: Naming existence on both sides removes an unclear ellipsis while preserving the documented ambiguity.
interpretive_expansions:
