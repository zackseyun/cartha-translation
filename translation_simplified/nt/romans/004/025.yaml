simplification_decisions:
- pob_phrase: because of our trespasses
  simplified_phrase: because of our wrongdoings
  preserved_meaning: This refers to our specific moral offenses rather than physical trespassing.
  reasoning_layer_used: POB lexical decision for παραπτώματα
  rationale: “Wrongdoings” communicates moral guilt more immediately to modern readers.
- pob_phrase: for our justification
  simplified_phrase: so that we could be declared right with God
  preserved_meaning: Jesus' resurrection is bound up with believers receiving God's favorable judicial verdict.
  reasoning_layer_used: POB lexical and theological decisions for δικαίωσις and διά
  rationale: The declarative wording preserves justification's legal force without relying on a technical term.
interpretive_expansions:
- pob_phrase: for our justification
  rendering: so that we could be declared right with God
  claim: Justification is God's declaration that believers are right before him, not merely their moral improvement.
  evidence:
  - The POB identifies δικαίωσις as legal-soteriological and offers “being declared righteous.”
  - Romans 4:22–25 speaks of righteousness being counted to believers.
  confidence: high
  alternatives_preserved:
  - justification
  - acquittal
  - being declared righteous
translation_notes:
  risk_flags:
