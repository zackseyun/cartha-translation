translation:
  language: en
  text: Indeed, it is rare for anyone to die for a righteous person[a]. Yet for a good person, someone might actually dare to die.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The contrast between a 'righteous' person (someone who is upright and fair) and a 'good' person (someone who is kind and generous) may be intentional.
    reason: simplification_note
simplification_decisions:
- simplified_phrase: Indeed, it is rare for anyone to die for a righteous person
  preserved_meaning: The word 'hardly' followed by a future tense can sound unnatural to modern readers. Converting this to 'it is rare' preserves the original sense of scarcity and difficulty while improving readability.
  reasoning_layer_used: POB audit trail
  rationale: The word 'hardly' followed by a future tense can sound unnatural to modern readers. Converting this to 'it is rare' preserves the original sense of scarcity and difficulty while improving readability.
- simplified_phrase: Yet for a good person, someone might actually dare to die
  preserved_meaning: Splitting the dense verse into two sentences and using 'Yet' helps clarify the contrast Paul is drawing, and replacing 'might even' with 'might actually' retains the ascensive force of the Greek 'kai' in a more modern voice.
  reasoning_layer_used: POB audit trail
  rationale: Splitting the dense verse into two sentences and using 'Yet' helps clarify the contrast Paul is drawing, and replacing 'might even' with 'might actually' retains the ascensive force of the Greek 'kai' in a more modern voice.
