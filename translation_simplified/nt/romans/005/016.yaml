simplification_decisions:
- pob_phrase: the gift is not like what came through the one who sinned
  simplified_phrase: God’s gift is not like the result of what the one man did when he sinned
  preserved_meaning: The gift is contrasted with the result that came through Adam’s sin.
  reasoning_layer_used: POB lexical decision for δι’ ἑνὸς ἁμαρτήσαντος and immediate context
  rationale: This unpacks the compressed comparison while retaining the personal reference and its result.
- pob_phrase: the judgment from one trespass led to condemnation
  simplified_phrase: The judgment from one trespass led to condemnation
  preserved_meaning: One trespass occasioned a judicial judgment whose outcome was condemnation.
  reasoning_layer_used: POB lexical decisions for κρίμα, ἐξ ἑνὸς, and κατάκριμα
  rationale: Keeping “from” corrects the draft’s merely temporal wording and preserves causation.
- pob_phrase: the gracious gift from many trespasses led to justification
  simplified_phrase: after many trespasses, the gracious gift led to justification
  preserved_meaning: The gracious gift brought justification despite the accumulated many trespasses.
  reasoning_layer_used: POB lexical and theological decisions for χάρισμα, παραπτωμάτων, and δικαίωμα
  rationale: The recast clause reads naturally without suggesting that the trespasses produced the gift.
