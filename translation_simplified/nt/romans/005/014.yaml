translation_notes:
  source_alignment_notes:
  - The translation honors 'ἀλλὰ' with 'Yet' to mark the contrast. It maintains the reach of death's rule over those who did not sin like Adam did. It maintains the future-pointing participle 'τοῦ μέλλοντος' as 'the one who was to come' with a footnote clarifying the Christological referent.
  readability_notes:
  - Split the highly complex Greek relative clause structure into two distinct sentences to improve flow and comprehension for a general reader.
  compression_notes:
  - No semantic compression was done; rather, implicit temporal elements ('the time of') and semantic expansions of 'transgression' ('broke a command') were introduced to aid immediate comprehension.
  risk_flags:
  - risk: There is a minor risk that simplifying 'transgression' to 'broke a command' loses the specific lexical nuance of 'parabasis' (stepping over a line), but this is mitigated by the highly clear conceptual equivalent of breaking a divine command.
    mitigation: Flag retained for reviewer attention.
