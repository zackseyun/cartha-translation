translation:
  language: en
  text: Yet death ruled from the time of Adam to the time of Moses, even over those who did not sin in the same way Adam did when he broke a command. Adam is a pattern[a] of the one who was to come[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'foreshadowing' or 'type'.
    reason: simplification_note
  - marker: b
    text: The referent in context is Christ.
    reason: simplification_note
simplification_decisions:
- preserved_meaning: Changed 'reigned' to 'ruled' to keep the personification of death active but more natural to modern readers.
  reasoning_layer_used: POB audit trail
  rationale: Changed 'reigned' to 'ruled' to keep the personification of death active but more natural to modern readers.
- preserved_meaning: Simplified 'from Adam until Moses' to 'from the time of Adam to the time of Moses' to clarify that this refers to a historic era.
  reasoning_layer_used: POB audit trail
  rationale: Simplified 'from Adam until Moses' to 'from the time of Adam to the time of Moses' to clarify that this refers to a historic era.
- preserved_meaning: Rendered 'in the likeness of Adam's transgression' as 'in the same way Adam did when he broke a command' to avoid archaic phrasing ('transgression', 'likeness') while maintaining the theological distinction of Adam's specific disobedience of a direct command.
  reasoning_layer_used: POB audit trail
  rationale: Rendered 'in the likeness of Adam's transgression' as 'in the same way Adam did when he broke a command' to avoid archaic phrasing ('transgression', 'likeness') while maintaining the theological distinction of Adam's specific disobedience of a direct command.
- preserved_meaning: Clarified the relative pronoun 'who is' to 'Adam is' because the antecedent 'Adam' is distant and needs explicit restatement for readability.
  reasoning_layer_used: POB audit trail
  rationale: Clarified the relative pronoun 'who is' to 'Adam is' because the antecedent 'Adam' is distant and needs explicit restatement for readability.
- preserved_meaning: Rendered 'type' as 'pattern' in the main text, moving 'foreshadowing' and 'type' to a footnote.
  reasoning_layer_used: POB audit trail
  rationale: Rendered 'type' as 'pattern' in the main text, moving 'foreshadowing' and 'type' to a footnote.
