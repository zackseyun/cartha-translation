simplification_decisions:
- pob_phrase: present yourselves as slaves for obedience
  simplified_phrase: present yourselves as slaves in order to obey
  preserved_meaning: People place themselves at another's disposal for the purpose of obeying.
  reasoning_layer_used: POB lexical decision for παριστάνετε and εἰς ὑπακοήν
  rationale: The purpose clause is clearer than the compressed noun phrase without adding a personal object.
- pob_phrase: you are slaves of the one whom you obey
  simplified_phrase: you are slaves of the one you obey
  preserved_meaning: Obedience places a person under the controlling power of what is obeyed.
  reasoning_layer_used: POB lexical decision for ᾧ ὑπακούετε
  rationale: Removing formal “whom” makes the clause natural while retaining the personal wording.
- pob_phrase: —either of sin leading to death, or of obedience leading to righteousness
  simplified_phrase: You are either slaves of sin, which leads to death, or slaves of obedience, which leads to righteousness.
  preserved_meaning: Sin and obedience remain opposing masters with their distinct outcomes.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: A new sentence and repeated “slaves” clarify the parallel contrast without weakening its imagery.
