translation:
  language: en
  text: Don't you know that if you present yourselves to someone as slaves to obey them, you are slaves of the one you obey? You are either slaves of sin, which leads to death, or of obedience, which leads to righteousness[a].
  philosophy: optimal-equivalence
  footnotes:
