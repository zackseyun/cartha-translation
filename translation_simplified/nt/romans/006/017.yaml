simplification_decisions:
- pob_phrase: But thanks be to God that, though you were slaves of sin
  simplified_phrase: But thank God! Though you were once slaves to sin
  preserved_meaning: God receives thanks, and sin's former ownership and domination remain explicit.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The shorter praise and added “once” make the past-to-present contrast immediately clear.
- pob_phrase: you obeyed from the heart
  simplified_phrase: you obeyed from the heart
  preserved_meaning: The wording retains both genuine obedience and the source's heart image of inward sincerity.
  reasoning_layer_used: POB lexical decision for ὑπηκούσατε and ἐκ καρδίας
  rationale: This already uses clear common English and preserves the concrete image.
- pob_phrase: the pattern of teaching to which you were handed over
  simplified_phrase: the teaching pattern you were placed under
  preserved_meaning: Believers remain the passive recipients of commitment to an authoritative pattern of teaching.
  reasoning_layer_used: POB passive-voice decision and grounding review
  rationale: “Placed under” clarifies the unusual passive relationship without reversing who is acted upon.
interpretive_expansions:
- pob_phrase: to which you were handed over
  rendering: you were placed under
  claim: The teaching pattern had an authoritative claim over the believers.
  evidence:
  - The passive παρεδόθητε presents the believers as acted upon in relation to the teaching pattern.
  - Romans 6:16–18 frames their obedience as a change from sin's domination.
  confidence: moderate
  alternatives_preserved:
  - handed over to
  - committed to
translation_notes:
  risk_flags:
  - risk: “Placed under” makes the teaching's authority more explicit than the source idiom does by itself.
    mitigation: The passive direction is preserved, and the immediate obedience context supports this bounded clarification.
