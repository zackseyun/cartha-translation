translation:
  language: en
  text: I am using a human example because of the weakness of your flesh[a]. For just as you once offered the parts of your body as slaves to impurity and to lawlessness, leading to more lawlessness, so now offer them as slaves to righteousness[b], leading to holiness.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word for 'flesh' can also refer to our 'sinful nature' here, though the expression is broader.
    reason: simplification_note
  - marker: b
    text: Or 'justice.'
    reason: simplification_note
simplification_decisions:
- simplified_phrase: I am using a human example
  preserved_meaning: More natural for modern readers while retaining the sense of Paul deploying an everyday analogy to accommodate human limitations.
  reasoning_layer_used: POB audit trail
  rationale: More natural for modern readers while retaining the sense of Paul deploying an everyday analogy to accommodate human limitations.
- simplified_phrase: the parts of your body
  preserved_meaning: '''Members'' is highly archaic and often misunderstood by modern readers. ''Parts of your body'' preserves the physical, somatic reference without sounding obsolete.'
  reasoning_layer_used: POB audit trail
  rationale: '''Members'' is highly archaic and often misunderstood by modern readers. ''Parts of your body'' preserves the physical, somatic reference without sounding obsolete.'
- simplified_phrase: leading to more lawlessness
  preserved_meaning: Clarifies the recursive/progressive nature of sin ('unto lawlessness') in a more flowing English sentence structure.
  reasoning_layer_used: POB audit trail
  rationale: Clarifies the recursive/progressive nature of sin ('unto lawlessness') in a more flowing English sentence structure.
- simplified_phrase: holiness
  preserved_meaning: '''Sanctification'' is dense theological jargon; ''holiness'' is immediately accessible to common readers while still retaining the resultative/processive ethical goal.'
  reasoning_layer_used: POB audit trail
  rationale: '''Sanctification'' is dense theological jargon; ''holiness'' is immediately accessible to common readers while still retaining the resultative/processive ethical goal.'
