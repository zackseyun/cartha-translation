translation:
  language: en
  text: I am using a human example because of the weakness of your flesh[a]. Just as you once offered the parts of your bodies as servants to impurity and lawlessness, leading to lawlessness, now offer them as servants to righteousness[b], leading to holiness.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word for “flesh” can also mean “sinful nature” here, though the expression is broader.
    reason: lexical_alternative
  - marker: b
    text: Or “justice.”
    reason: lexical_alternative
