simplification_decisions:
- pob_phrase: have become united with him
  simplified_phrase: have become united with him
  preserved_meaning: Preserves both entering into union with Christ and its continuing result.
  reasoning_layer_used: POB lexical decision for γεγόναμεν and σύμφυτοι
  rationale: The reviewed wording restores the active perfect sense rather than recasting it as passive.
- pob_phrase: in the likeness of his death
  simplified_phrase: in a death like his
  preserved_meaning: Keeps the qualifying comparison without defining how believers participate in Christ's death.
  reasoning_layer_used: POB lexical and theological decisions for τῷ ὁμοιώματι
  rationale: The direct comparison is easier to understand while preserving the theological tension.
- pob_phrase: we will certainly also be united with him in the likeness of his resurrection
  simplified_phrase: we will certainly also be united with him in a resurrection like his
  preserved_meaning: Retains the emphasis, supplies the Greek ellipsis, and carries the comparison into the resurrection clause.
  reasoning_layer_used: POB lexical decisions for ἀλλὰ καί, τῆς ἀναστάσεως, and ἐσόμεθα
  rationale: The parallel wording makes the implied predicate clear in natural English.
translation_notes:
  risk_flags:
  - risk: “A death like his” could be mistaken for an identical physical death.
    mitigation: The phrase “like his” preserves Paul's qualification, and the surrounding union language signals participation rather than identity.
