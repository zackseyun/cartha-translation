simplification_decisions:
- pob_phrase: Therefore
  simplified_phrase: So
  preserved_meaning: The command remains an inference from Paul’s preceding argument.
  reasoning_layer_used: POB lexical decision for οὖν
  rationale: “So” expresses the same logical connection in more immediate English.
- pob_phrase: reign in your mortal body
  simplified_phrase: rule as king over your body, which is subject to death
  preserved_meaning: Sin remains personified as a royal power acting upon the believer’s mortal body.
  reasoning_layer_used: POB lexical and theological decisions for βασιλευέτω and θνητῷ
  rationale: The recasting explains both the royal image and the less familiar word “mortal.”
- pob_phrase: so that you obey its desires
  simplified_phrase: and make you obey your body’s desires
  preserved_meaning: Obedience to bodily desires is presented as the intended or resulting outcome of sin’s rule.
  reasoning_layer_used: POB lexical decisions for εἰς τὸ ὑπακούειν and αὐτοῦ
  rationale: The active wording makes the consequence and the chosen antecedent easier to follow.
interpretive_expansions:
- pob_phrase: its desires
  rendering: your body’s desires
  claim: The pronoun refers to the mortal body.
  evidence:
