  text: Live in harmony with one another[a]. Do not aim for high status, but willingly go along with the lowly[b]. Do not think you are wiser than you are.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'do not pursue status' or 'do not be proud.'
