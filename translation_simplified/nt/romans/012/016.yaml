- pob_phrase: do not set your mind on high things, but associate with the lowly
  simplified_phrase: Do not set your mind on high things, but associate with the lowly
  preserved_meaning: The contrast includes pride, lofty aspirations, and identification with lowly people or things.
  reasoning_layer_used: POB theological decision preserving the ambiguity of τὰ ὑψηλά and τοῖς ταπεινοῖς
  rationale: The broad wording and footnotes avoid narrowing the command to social advancement alone.
- pob_phrase: Do not become wise in your own sight
  simplified_phrase: Do not think of yourselves as wise
  preserved_meaning: Paul warns against judging oneself to be wise.
  reasoning_layer_used: POB lexical decision for φρόνιμοι παρ’ ἑαυτοῖς
  rationale: The recasting removes an opaque idiom while retaining its warning against self-conceit.
