translation:
  language: en
  text: 'By the grace given to me, I say to everyone among you: Do not think more highly of yourself than you should. Instead, think with sound judgment,[a] as God has assigned to each a measure of faith.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “think so as to be sober-minded.”
    reason: lexical_alternative
  - marker: b
    text: Or “the measure of faith,” or possibly “a measure of faithfulness” or “a measure of trust.” The Greek does not specify the exact sense.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: For by the grace given to me I say
  simplified_phrase: By the grace given to me, I say
  preserved_meaning: Paul speaks on the basis of the grace given to him.
  reasoning_layer_used: POB lexical decision for διὰ τῆς χάριτος τῆς δοθείσης μοι
  rationale: Dropping “For” eases the opening while “By” preserves grace as the basis of Paul's address.
- pob_phrase: not to think of himself more highly than he ought to think
  simplified_phrase: Do not think more highly of yourself than you should
  preserved_meaning: Each person must avoid an inflated view of himself.
  reasoning_layer_used: POB lexical decisions for μὴ ὑπερφρονεῖν and παρ’ ὃ δεῖ φρονεῖν
  rationale: Direct address removes the dense infinitive construction and keeps the pronouns consistent.
- pob_phrase: but to think with sound judgment, as God has apportioned
  simplified_phrase: Instead, think with sound judgment, as God has assigned
  preserved_meaning: Each person should judge himself sensibly in keeping with God's distribution.
  reasoning_layer_used: POB lexical decisions for σωφρονεῖν and ἐμέρισεν
  rationale: “Instead” sharpens the contrast, and “assigned” replaces the less familiar “apportioned.”
