translation:
  language: en
  text: Do not conform to the pattern of this age[a], but be transformed by the renewing of your mind. Then you will be able to discern[b] what God’s will is—his good, pleasing, and perfect will.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “this world.” “Age” refers to the present era and its values.
    reason: simplification_note
  - marker: b
    text: Or “to test and approve.” This refers to evaluating and recognizing what is true and right.
    reason: simplification_note
