translation:
  language: en
  text: The one who encourages should do so with encouragement[a]. The one who shares should do so with generosity[b]. The one who leads should lead with diligence. The one who shows mercy should do so with cheerfulness.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'exhorting... with exhortation.' The Greek verb and noun can mean both encouraging/encouragement and exhorting/exhortation.
    reason: simplification_note
  - marker: b
    text: Or 'with sincerity' or 'with simplicity.' The Greek word can mean both sincere simplicity and material generosity.
    reason: simplification_note
