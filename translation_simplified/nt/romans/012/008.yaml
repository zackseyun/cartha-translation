translation:
  language: en
  text: If your gift is encouraging others, encourage them[a]. If it is sharing, share generously[b]. If it is leading, lead diligently. If it is showing mercy, show mercy cheerfully.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “exhorting others, exhort them.” The Greek verb and noun can refer to either encouraging or exhorting.
    reason: lexical_alternative
  - marker: b
    text: Or “with sincerity” or “with simplicity.” In the context of sharing, the Greek word most likely means generosity.
    reason: lexical_alternative
