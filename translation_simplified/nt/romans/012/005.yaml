translation:
  language: en
  text: So although there are many of us, we are one body in Messiah[a]. Each of us belongs to the others as a part of that body.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Or: “in Christ.” The Greek title translated “Messiah” can be rendered either way; “Messiah” preserves its sense as a title.'
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: so we, though many
  simplified_phrase: So although there are many of us
  preserved_meaning: Paul contrasts the believers’ many individual identities with their unity.
  reasoning_layer_used: POB lexical decision for οὕτως and οἱ πολλοὶ
  rationale: The full clause expresses the contrast in more natural English.
- pob_phrase: are one body in Messiah
  simplified_phrase: we are one body in Messiah
  preserved_meaning: Believers share corporate unity through union with Messiah.
  reasoning_layer_used: POB lexical and theological decisions for ἓν σῶμά and ἐν Χριστῷ
  rationale: A separate sentence keeps the body image prominent and easy to follow.
- pob_phrase: individually members of one another
  simplified_phrase: Each of us belongs to the others as a part of that body
  preserved_meaning: Every believer is mutually connected to the others within the one body.
  reasoning_layer_used: POB lexical decisions for καθ’ εἷς, ἀλλήλων, and μέλη, with the immediate body analogy
  rationale: This avoids the unclear phrase “parts of one another” while preserving mutual belonging and the body image.
interpretive_expansions:
- pob_phrase: members of one another
  rendering: belongs to the others as a part of that body
  claim: The reciprocal relation is mutual belonging within the one body already named.
  evidence:
  - Romans 12:4–5 frames individual members as parts of one body.
  - The POB audit identifies ἀλλήλων as a mutual relation among believers.
  confidence: high
  alternatives_preserved:
  - members of one another
  - each one individually belongs to the others
translation_notes:
  risk_flags:
  - risk: “Belongs to the others” could be mistaken for ownership.
    mitigation: “As a part of that body” limits the phrase to corporate and reciprocal belonging.
