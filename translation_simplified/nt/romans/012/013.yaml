simplification_decisions:
- pob_phrase: sharing in the needs
  simplified_phrase: Help meet the needs
  preserved_meaning: Believers actively participate in supplying what others need.
  reasoning_layer_used: POB lexical decision for κοινωνοῦντες
  rationale: This states the active help intended by sharing in others’ needs.
- pob_phrase: the saints
  simplified_phrase: God’s people
  preserved_meaning: The people in view are believers, understood corporately as holy to God.
  reasoning_layer_used: POB theological decision on the referent of ἁγίων
  rationale: This prevents readers from mistaking them for a restricted class of canonized saints.
- pob_phrase: pursuing hospitality
  simplified_phrase: eagerly look for opportunities to welcome strangers
  preserved_meaning: Hospitality requires intentionally seeking occasions to welcome outsiders.
  reasoning_layer_used: POB lexical decisions for φιλοξενίαν and διώκοντες
  rationale: The wording preserves both the welcome of strangers and the urgency of pursuit.
