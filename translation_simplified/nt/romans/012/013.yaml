translation_notes:
  source_alignment_notes: Maintains strict correspondence with the Greek participles in SBLGNT. The dative phrase 'ταῖς χρείαις τῶν ἁγίων' is rendered faithfully as 'needs of the saints,' and 'κοινωνοῦντες' is translated as 'sharing in' with 'contributing to' offered as an alternative in the footnotes.
  readability_notes:
  - The sentence is streamlined into direct active instructions, resolving the potential awkwardness of dangling participles for modern readers who may not be accustomed to epistolary style.
  compression_notes:
  - No source content was omitted. Simplification was achieved through syntactic restructuring and adding natural adverbial emphasis ('eagerly') rather than conceptual subtraction.
  risk_flags:
  - risk: Modern readers may misunderstand 'saints' as deceased canonized individuals rather than living believers, a risk accepted to preserve the required Pauline theological terminology.
    mitigation: Flag retained for reviewer attention.
