translation:
  language: en
  text: 'As Scripture says: “Look, I am placing in Zion a stone that makes people stumble and a rock that causes offense, and anyone who believes in him will not be put to shame.”[him][shame]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: him
