  preserved_meaning: The stone and rock images remain causes of stumbling and offense.
  reasoning_layer_used: POB lexical alternatives and Romans 9:32–33
  rationale: Active clauses explain both images without merging them.
- pob_phrase: the one who believes in him
  simplified_phrase: anyone who believes in him
  preserved_meaning: The promise applies generically to every person who believes in the Messiah.
  reasoning_layer_used: POB lexical and theological decisions
