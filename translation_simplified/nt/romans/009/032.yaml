translation:
  language: en
  text: Why? Because they did not pursue righteousness through faith, but as if it could be gained by works. They stumbled over the stone that causes people to stumble.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This alludes to Isaiah 8:14; see also Isaiah 28:16 in the next verse.
    reason: cross_reference
simplification_decisions:
- pob_phrase: it was not from faith
  simplified_phrase: they did not pursue righteousness through faith
  preserved_meaning: Israel did not pursue righteousness on the basis of faith.
  reasoning_layer_used: Immediate context and POB theological decision
  rationale: Naming righteousness and its pursuit makes the implied contrast clear.
- pob_phrase: but as if from works
  simplified_phrase: but as if it could be gained by works
  preserved_meaning: They pursued righteousness as though works could obtain it, while the qualifying force of “as if” remains.
  reasoning_layer_used: POB lexical rationale and grounding review
  rationale: This states attainability rather than incorrectly suggesting that righteousness originated in works.
- pob_phrase: the stone of stumbling
  simplified_phrase: the stone that causes people to stumble
  preserved_meaning: The stone remains a concrete obstacle over which people stumble.
  reasoning_layer_used: POB lexical decision and Isaiah allusion
  rationale: The verbal form is clearer in common English and preserves the source image.
interpretive_expansions:
- pob_phrase: it was not from faith, but as if from works
  rendering: they did not pursue righteousness through faith, but as if it could be gained by works
  claim: The implied object is righteousness, which Israel pursued as though works could obtain it.
  evidence:
  - Romans 9:31–32 identifies righteousness as the goal Israel pursued.
  - The POB rationale says righteousness was treated as attainable on the basis of works.
  confidence: high
  alternatives_preserved:
  - The wording retains “as if” rather than asserting that works truly gain righteousness.
translation_notes:
  risk_flags:
  - risk: Making “righteousness” explicit goes beyond the words repeated in this verse.
    mitigation: The immediate context names righteousness as the object being pursued.
