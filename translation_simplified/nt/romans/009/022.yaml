translation:
  language: en
  text: But what if God wanted to show his wrath and make his power known, yet endured with great patience vessels of wrath prepared for destruction,[prepared for destruction][vessels of wrath]
  philosophy: optimal-equivalence
  footnotes:
  - marker: prepared for destruction
    text: The wording does not say who prepared these vessels. Interpreters differ on whether this implies God's action, people's self-hardening, or simply their readiness for judgment.
    reason: alternative_reading
  - marker: vessels of wrath
    text: “Vessels” keeps the pottery picture from the preceding verses and refers here to those facing God's wrath.
    reason: simplification_note
simplification_decisions:
- pob_phrase: wanting to display his wrath and make known his power
  simplified_phrase: wanted to show his wrath and make his power known
  preserved_meaning: God intends to reveal both his judicial wrath and his power.
  reasoning_layer_used: POB lexical decisions for θέλων, ἐνδείξασθαι, ὀργή, and γνωρίσαι
  rationale: Ordinary word order and “show” make the clause easier to read without weakening its force.
- pob_phrase: endured with great patience vessels of wrath
  simplified_phrase: yet endured with great patience vessels of wrath
  preserved_meaning: God bore with these vessels to an explicitly great degree of patience.
  reasoning_layer_used: POB lexical decision for ἐν πολλῇ μακροθυμίᾳ and grounding review
  rationale: “Yet” clarifies the contrast while retaining the stated extent of God's patience.
- pob_phrase: But what if
  simplified_phrase: But what if
  preserved_meaning: The verse remains a rhetorical conditional connected to the preceding argument and continuing into verse 23.
  reasoning_layer_used: POB theological decision on the unfinished conditional
  rationale: This wording must remain because completing or asserting the thought would over-resolve Paul's syntax.
translation_notes:
  risk_flags:
  - risk: “Prepared for destruction” may be read as naming God as the agent.
    mitigation: The passive remains agentless, and the footnote preserves the documented alternatives.
  - risk: “Vessels of wrath” may be unclear to readers unfamiliar with the pottery context.
    mitigation: The image is retained for inter-verse coherence and briefly explained in a footnote.
