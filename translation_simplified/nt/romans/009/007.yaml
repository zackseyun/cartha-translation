translation:
  language: en
  text: Nor are all of Abraham’s offspring children. Rather, “Through Isaac your offspring will be named.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Nor is it the case that because they are Abraham’s offspring, they are all children.
  simplified_phrase: Nor are all of Abraham’s offspring children.
  preserved_meaning: Physical descent from Abraham does not by itself make everyone part of the promised line.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The shorter negative construction keeps “children” indefinite and preserves the contrast.
- pob_phrase: Rather, “In Isaac your offspring will be called.”
  simplified_phrase: Rather, “Through Isaac your offspring will be named.”
  preserved_meaning: Isaac is the line through whom Abraham’s offspring receive their designation.
  reasoning_layer_used: POB lexical decisions and latest doctrine realignment
  rationale: “Through Isaac” makes the lineal sense clear, while “named” preserves the audited wording without adding interpretation.
translation_notes:
  risk_flags:
  - risk: Readers may take “children” as referring only to biological children.
    mitigation: The contrast with “offspring” and the quotation about Isaac preserve the distinction without overexplaining it.
