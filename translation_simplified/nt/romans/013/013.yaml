simplification_decisions:
- pob_phrase: Let us walk properly
  simplified_phrase: Let us live properly
  preserved_meaning: The command concerns a person’s way of life.
  reasoning_layer_used: POB lexical decision for περιπατήσωμεν
  rationale: “Live” makes Paul’s metaphorical use of “walk” immediately clear.
- pob_phrase: revelries
  simplified_phrase: wild partying
  preserved_meaning: The phrase describes riotous feasting or carousing, often involving drink.
  reasoning_layer_used: POB lexical decision for κώμοις
  rationale: “Wild partying” is common English and avoids the sexual narrowing of “orgies.”
- pob_phrase: strife
  simplified_phrase: fighting
  preserved_meaning: The vice is discord and contentious conflict.
  reasoning_layer_used: POB lexical decision for ἔριδι
  rationale: “Fighting” is more familiar than “strife” while retaining the negative force.
translation_notes:
  risk_flags:
  - risk: “As in the daytime” may sound unusual in modern English.
    mitigation: It is retained to preserve the source’s day-and-darkness image without adding an identity claim.
  - risk: “Sensuality” may be understood too narrowly as sexual desire.
    mitigation: Its pairing with “sexual immorality” preserves the POB wording for shameless, unrestrained conduct.
