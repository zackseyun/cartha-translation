translation:
  language: en
  text: Every person should submit to the governing authorities, because no authority exists unless it comes from God. The authorities that exist have been put in place by God.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Let every person be subject to
  simplified_phrase: Every person should submit to
  preserved_meaning: Everyone is called to live under the governing authorities.
  reasoning_layer_used: POB lexical decision for ὑποτασσέσθω
  rationale: “Should submit” states the command in clear modern English without strengthening it to unquestioning obedience.
- pob_phrase: there is no authority except from God
  simplified_phrase: no authority exists unless it comes from God
  preserved_meaning: God is the ultimate source of governing authority.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: “Comes from God” preserves divine source rather than reducing the claim to mere permission.
- pob_phrase: those that exist have been appointed by God
  simplified_phrase: The authorities that exist have been put in place by God
  preserved_meaning: Existing authorities stand in a divinely ordered position.
  reasoning_layer_used: POB lexical decision for τεταγμέναι
  rationale: “Put in place” plainly expresses appointment without implying approval of every act of a ruler.
translation_notes:
  risk_flags:
  - risk: Readers may take divine ordering as approval of everything governments do.
    mitigation: The wording states that authorities are put in place by God but adds no claim that every governmental act is morally approved.
