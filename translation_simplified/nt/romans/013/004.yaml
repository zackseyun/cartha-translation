translation:
  language: en
  text: The governing authority is God’s servant, working for your good. But if you do evil, be afraid, because it does not carry the sword for no reason. It is God’s servant, an avenger who brings wrath against anyone who practices evil.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: it is God’s servant for your good
  simplified_phrase: The governing authority is God’s servant, working for your good
  preserved_meaning: The civil authority serves under God for the reader’s benefit.
  reasoning_layer_used: Immediate context and POB lexical decisions for διάκονος, σοὶ, and εἰς τὸ ἀγαθόν
  rationale: Naming the governing authority clarifies the pronoun, while “working” makes its beneficial role natural in English.
- pob_phrase: does not bear the sword for nothing
  simplified_phrase: does not carry the sword for no reason
  preserved_meaning: The authority’s sword has a real punitive purpose.
  reasoning_layer_used: POB lexical decisions for μάχαιρα, φορέω, and εἰκῇ
  rationale: “Carry” and “for no reason” are common English while retaining the concrete sword image.
- pob_phrase: an avenger for wrath against the one who practices evil
  simplified_phrase: an avenger who brings wrath against anyone who practices evil
  preserved_meaning: The authority has an avenging role directed against habitual evil conduct.
  reasoning_layer_used: POB lexical and theological decisions for ἔκδικος, εἰς ὀργὴν, and πράσσοντι
  rationale: The clause becomes readable without replacing either avenging or wrath with general punishment.
interpretive_expansions:
- pob_phrase: it
  rendering: The governing authority
  claim: The pronoun refers to the governing authority discussed in the surrounding passage.
  evidence:
  - Romans 13:1–3 identifies governing authorities as the subject.
  - The POB rationale places διάκονος in a civic context.
  confidence: high
  alternatives_preserved:
