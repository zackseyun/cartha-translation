translation:
  language: en
  text: So did what is good bring death to me? Absolutely not! Rather, sin used what is good to produce death in me, so that it might be shown to be sin.[a] In this way, through the commandment, sin might become exceedingly sinful.[b]
  philosophy: optimal-equivalence
  footnotes:
