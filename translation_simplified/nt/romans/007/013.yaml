  reasoning_layer_used: POB lexical and theological decisions
  rationale: “Bring death” makes the causal question natural without blaming what is good.
- pob_phrase: May it never be!
  simplified_phrase: Absolutely not!
  preserved_meaning: Paul's emphatic rejection remains forceful.
  reasoning_layer_used: POB lexical decision for μὴ γένοιτο
  rationale: The modern expression preserves the strength of Paul's denial.
- pob_phrase: by producing death in me through what is good
  simplified_phrase: sin used what is good to produce death in me
  preserved_meaning: Sin remains the agent producing death in Paul through what is good.
  reasoning_layer_used: POB lexical decisions and theological agency structure
  rationale: The active wording clarifies agency while retaining “death in me.”
interpretive_expansions:
