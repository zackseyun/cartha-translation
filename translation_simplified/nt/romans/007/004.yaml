translation:
  language: en
  text: So, my brothers[a], you also were put to death to the law through the body of the Messiah[b]. This was so that you might belong to another[c]—to the one who was raised from the dead—in order that we might bear fruit for God.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “brothers and sisters”; the Greek word can refer to a mixed group of believers.
    reason: lexical_alternative
  - marker: b
    text: Or “Christ”; “Messiah” is a title meaning “Anointed One.”
    reason: lexical_alternative
  - marker: c
    text: Literally “so that you might become another’s”; this continues the marriage illustration from the previous verses.
    reason: cultural_note
