translation:
  language: en
  text: So, my brothers[a], you also were put to death to the law through the body of the Messiah[b]. This was so you might belong to another[c]—to the one who was raised from the dead—in order that we might bear fruit for God.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'brothers and sisters'; the Greek word can refer to a mixed group of believers.
    reason: simplification_note
