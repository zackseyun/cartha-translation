simplification_decisions:
- preserved_meaning: Changed 'fleshly' to 'made of flesh' to clearly convey the meaning of σάρκινος (human/physical weakness) without resorting to the interpretive 'sinful nature' paraphrase, thus preserving POB's theological boundaries.
  reasoning_layer_used: POB audit trail
  rationale: Changed 'fleshly' to 'made of flesh' to clearly convey the meaning of σάρκινος (human/physical weakness) without resorting to the interpretive 'sinful nature' paraphrase, thus preserving POB's theological boundaries.
- preserved_meaning: Unpacked 'sold under sin' to 'sold as a slave to sin' to make the underlying slave-market metaphor immediately clear to a modern reader.
  reasoning_layer_used: POB audit trail
  rationale: Unpacked 'sold under sin' to 'sold as a slave to sin' to make the underlying slave-market metaphor immediately clear to a modern reader.
retained_terms:
- term: spiritual (πνευματικός) - retained to maintain the core contrast with human weakness
  reason: Retained to preserve POB's source-grounded terminology.
- term: the law (νόμος) - kept lowercase as in POB to preserve immediate lexical form without over-specifying
  reason: Retained to preserve POB's source-grounded terminology.
translation_notes:
  source_alignment_notes: The rendering 'made of flesh' directly aligns with σάρκινος (composed of flesh), and 'sold as a slave to sin' captures the full force of the perfect passive participle of πιπράσκω (to sell) combined with the prepositional phrase ὑπὸ τὴν ἁμαρτίαν (under sin).
  readability_notes:
  - The simplified text avoids the archaic-sounding 'fleshly' and the overly dense clause 'sold under sin,' flowing more naturally in modern English while retaining its solemn, scriptural tone.
  compression_notes:
  - No theological content was compressed or omitted. The sentence structure remains identical, but the internal metaphors are rendered with higher English transparency.
  risk_flags:
  - risk: There is a slight risk that 'made of flesh' could be read dualistically, but this literal nuance of σάρκινος is safeguarded by the footnote 'fleshly' and the context of moral bondage.
    mitigation: Flag retained for reviewer attention.
