translation:
  language: en
  text: What should we say, then? Is the law sin? Absolutely not! But I would not have recognized sin except through the law. I would not have known about coveting[a] if the law had not said, “You shall not covet.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “desire,” but the commandment quoted here favors the more specific sense “coveting.”
    reason: lexical_alternative
