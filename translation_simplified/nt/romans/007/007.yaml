translation:
  language: en
  text: What should we say then? Is the law sin? Absolutely not! In fact, I would not have known what sin is if it weren't for the law. For I would not have known what it means to covet[a] if the law had not said, "You shall not covet."
  philosophy: optimal-equivalence
  footnotes:
