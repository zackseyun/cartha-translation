translation_notes:
  source_alignment_notes: The source Greek text employs three different verbs for doing/performing actions (κατεργάζομαι, πράσσω, ποιῶ). POB attempted to mirror this with 'doing', 'practice', and 'do'. SPOB collapses the distinction between πράσσω and ποιῶ to 'do' (as 'do what I want' and 'do the very thing I hate') to match natural English usage, which is standard in modern translations.
  readability_notes:
  - By splitting the verse into two sentences and simplifying the verb structure, the text gains a rhythmic quality that emphasizes the speaker's frustration and conflict.
  compression_notes:
  - The explicit causal marker 'because' from the POB text is rendered implicitly through sentence juxtaposition. This maintains the causal relationship without cluttering the sentence structure.
  risk_flags:
  - risk: Collapsing the lexical distinction between 'practice' and 'do' loses a minor stylistic feature of the Greek, though they function as synonyms in this context.
