simplification_decisions:
- pob_phrase: I was once alive apart from the law
  simplified_phrase: At one time I was alive without the law
  preserved_meaning: Paul describes a former state of being alive while separate from the law.
  reasoning_layer_used: POB lexical decisions for ἔζων, χωρίς νόμου, and ποτέ
  rationale: Common temporal wording and “without” make the clause easier to grasp while preserving its life-and-separation ideas.
- pob_phrase: but when the commandment came
  simplified_phrase: But when the commandment came
  preserved_meaning: The commandment’s coming marks the change in Paul’s account.
  reasoning_layer_used: POB lexical decision for ἐλθούσης τῆς ἐντολῆς
  rationale: The biblical term “commandment” remains because it connects this verse to the law and following context.
- pob_phrase: sin came to life
  simplified_phrase: sin sprang to life
  preserved_meaning: Sin is personified as becoming alive and active.
  reasoning_layer_used: POB lexical decisions for ἁμαρτία and ἀνέζησεν
  rationale: “Sprang to life” gives modern readers the force of the animation image without treating sin as literally alive.
translation_notes:
  risk_flags:
  - risk: “Without the law” could be mistaken for simple lawlessness.
    mitigation: The definite phrase “the law” and the following “commandment” retain the specific Pauline context.
  - risk: Paul’s “I” may be read only as autobiography.
    mitigation: No explanatory wording resolves whether Paul speaks personally or representatively.
