simplification_decisions:
- pob_phrase: For I know
  simplified_phrase: I know
  preserved_meaning: Paul states his knowledge while the omitted connective is left implicit.
  reasoning_layer_used: POB translation and review
  rationale: Dropping the opening “For” gives smoother modern English without changing the claim.
- pob_phrase: the willing is present with me
  simplified_phrase: I have the desire to do what is good
  preserved_meaning: Paul wants to do what is morally good.
  reasoning_layer_used: POB lexical decisions and immediate contrast
  rationale: The personal wording makes the abstract expression clear while preserving its contrast with action.
- pob_phrase: the doing of the good is not
  simplified_phrase: but I cannot do it
  preserved_meaning: Paul does not succeed in carrying out the good he desires.
  reasoning_layer_used: POB lexical rationale for the elliptical negative and grounding review
  rationale: Completing the Greek ellipsis avoids the unclear English phrase “doing it is not.”
interpretive_expansions:
- pob_phrase: the willing
  rendering: the desire to do what is good
  claim: The object of Paul’s willing is made explicit as doing what is good.
  evidence:
  - The following clause identifies the intended action as doing the good.
  confidence: high
  alternatives_preserved:
  - the willingness to do good
- pob_phrase: the doing of the good is not
  rendering: I cannot do it
  claim: The terse negative is expressed as Paul’s inability to carry out the good he desires.
  evidence:
  - POB identifies the final negative as elliptical and requiring completion in English.
  - The immediate contrast is between willing and actual performance.
  confidence: high
  alternatives_preserved:
  - I do not carry it out
  - I am unable to do it
translation_notes:
  risk_flags:
  - risk: “I cannot do it” states the force of the Greek ellipsis more directly than POB.
    mitigation: The immediate willing-versus-doing contrast and POB rationale support this bounded completion.
  - risk: “Flesh” may be misunderstood as referring only to the physical body.
    mitigation: The lexical-alternative footnote preserves “sinful nature” without resolving Paul’s theological tension in the text.
