translation:
  language: en
  text: But now we have been released from the law, because we died to what used to hold us captive, so that we serve in the new way of the Spirit[a] and not in the old way of the written code[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “in newness of spirit.”
    reason: alternative_reading
  - marker: b
    text: Or “in oldness of the letter.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: having died to what held us
  simplified_phrase: because we died to what used to hold us captive
  preserved_meaning: Believers died in relation to what had bound them; the law itself did not die.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The causal clause is easier to follow while keeping believers as the ones who died.
- pob_phrase: so that we serve
  simplified_phrase: so that we serve
  preserved_meaning: Release from the law leads to a new manner of service.
  reasoning_layer_used: Grounding review and Greek result-purpose construction
  rationale: Retaining “so that” preserves the explicit result-purpose connection.
- pob_phrase: in newness of the Spirit and not in oldness of the letter
  simplified_phrase: in the new way of the Spirit and not in the old way of the written code
  preserved_meaning: Service empowered by the Spirit contrasts with service governed by the old written law.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: “New way” and “old way” clarify the contrast, while “written code” explains Paul’s use of “letter.”
interpretive_expansions:
- pob_phrase: what held us
  rendering: what used to hold us captive
  claim: The former relationship to the law involved bondage.
  evidence:
  - The POB rationale says the phrase preserves the sense of prior bondage.
  confidence: high
  alternatives_preserved:
  - what held us
  - that by which we were bound
- pob_phrase: the letter
  rendering: the written code
  claim: Here “letter” refers to the law in its written form.
  evidence:
  - The immediate context identifies the law as the controlling referent.
  - The POB lists “the written code” as a lexical alternative.
  confidence: high
  alternatives_preserved:
  - the letter
translation_notes:
  risk_flags:
  - risk: “Written code” may obscure Paul’s recurring verbal contrast between Spirit and letter.
    mitigation: Footnote [b] preserves the more literal wording.
