translation:
  language: en
  text: But now we have been released from the law, because we died to what used to hold us captive. Now we serve in the new way of the Spirit[a] and not in the old way of the written code[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'in newness of spirit.'
    reason: simplification_note
  - marker: b
    text: Or 'in oldness of the letter.'
    reason: simplification_note
simplification_decisions:
- pob_phrase: have been released from the law
  simplified_phrase: have been released from the law
  preserved_meaning: Retained 'released' to preserve the relational setting free from the law's binding claim without implying the law itself ceased to exist, which aligns with the key POB lexical decision.
  reasoning_layer_used: POB audit trail
  rationale: Retained 'released' to preserve the relational setting free from the law's binding claim without implying the law itself ceased to exist, which aligns with the key POB lexical decision.
- pob_phrase: having died to what held us
  simplified_phrase: because we died to what used to hold us captive
  preserved_meaning: Converted the aorist participle 'having died' into a causal clause ('because we died') to make the logical connection clearer for a modern reader, while firmly preserving the key theological decision that it is believers who died, not the law. Expanded 'what held us' slightly to 'what used to hold us captive' to naturally capture the restrictive force of the Greek verb.
  reasoning_layer_used: POB audit trail
  rationale: Converted the aorist participle 'having died' into a causal clause ('because we died') to make the logical connection clearer for a modern reader, while firmly preserving the key theological decision that it is believers who died, not the law. Expanded 'what held us' slightly to 'what used to hold us captive' to naturally capture the restrictive force of the Greek verb.
- pob_phrase: serve in newness of the Spirit and not in oldness of the letter
  simplified_phrase: serve in the new way of the Spirit and not in the old way of the written code
  preserved_meaning: Simplified the literal but stiff 'newness of... oldness of...' into 'new way of... old way of...' to restore idiomatic symmetry. 'Written code' replaces 'letter' to clarify the referent (the Mosaic law's written regulations) to a modern reader, while preserving the literal 'letter' in a footnote.
  reasoning_layer_used: POB audit trail
  rationale: Simplified the literal but stiff 'newness of... oldness of...' into 'new way of... old way of...' to restore idiomatic symmetry. 'Written code' replaces 'letter' to clarify the referent (the Mosaic law's written regulations) to a modern reader, while preserving the literal 'letter' in a footnote.
