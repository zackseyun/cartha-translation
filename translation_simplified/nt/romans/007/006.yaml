translation_notes:
  source_alignment_notes: The translation carefully preserves the nominative plural subject of the participle 'having died' (referring to 'we'), ensuring the theological point remains that believers died to the law. The sharp Pauline contrast between Spirit and letter (rendered here as 'written code') remains the structural anchor of the verse.
  readability_notes:
  - Breaking the long Greek sentence into two shorter English sentences ('...what used to hold us captive. Now we serve...') significantly improves readability and flow for modern readers without losing any syntactic connections.
  compression_notes:
  - No theological or historical information was compressed or omitted. The abstract noun constructs ('newness of', 'oldness of') were resolved into idiomatic expressions ('new way of', 'old way of') to remove linguistic friction.
  risk_flags:
  - risk: There is a minor risk that translating 'letter' as 'written code' loses the immediate word-for-word connection to other passages (like 2 Cor 3:6), but this is mitigated by preserving the literal rendering 'letter' in the footnote.
    mitigation: Flag retained for reviewer attention.
