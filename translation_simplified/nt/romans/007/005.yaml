  preserved_meaning: The sinful passions operated through bodily parts or faculties as instruments of action.
  reasoning_layer_used: POB lexical decision and cultural note on μέλεσιν
  rationale: This avoids the misleading modern sense of organizational members without broadening the phrase to the whole body.
- pob_phrase: to bear fruit for death
  simplified_phrase: producing fruit that leads to death
  preserved_meaning: The wording preserves both the fruit-bearing image and its deadly result.
  reasoning_layer_used: POB lexical decisions on καρποφορῆσαι and τῷ θανάτῳ
  rationale: The result is stated in natural modern English while Paul’s organic metaphor remains intact.
