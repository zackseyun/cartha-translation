simplification_decisions:
- pob_phrase: Older women likewise are to be reverent in behavior
  simplified_phrase: Older women should also behave in a way that shows reverence.
  preserved_meaning: Their behavior should be appropriate to holiness, in parallel with the instruction to older men.
  reasoning_layer_used: POB lexical decisions for ὡσαύτως, ἐν καταστήματι, and ἱεροπρεπεῖς
  rationale: The clause is recast in ordinary English while keeping both the link to the previous verse and the call to reverent conduct.
- pob_phrase: not slanderers
  simplified_phrase: They must not slander others
  preserved_meaning: Older women must not make harmful false accusations about people.
  reasoning_layer_used: POB lexical decision for μὴ διαβόλους
  rationale: The noun label becomes a direct verbal command without changing its ethical meaning.
- pob_phrase: nor enslaved to much wine, teachers of what is good
  simplified_phrase: or be enslaved to much wine. They should teach what is good.
  preserved_meaning: Wine must not dominate them, and the content of their teaching must be good.
