translation:
  language: en
  text: For God’s grace has appeared.[a] It brings salvation to all people.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also be translated, “has appeared, saving all people” or “has appeared to all people.”
    reason: lexical_alternative
  - marker: b
    text: “All people” means humanity, not males only, and does not settle the debated question of whether this means every individual or all groups of people.
