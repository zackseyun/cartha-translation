simplification_decisions:
- pob_phrase: Speak these things
  simplified_phrase: Speak about these things
  preserved_meaning: Titus must continue communicating the preceding instructions without narrowing them to teaching alone.
  reasoning_layer_used: Lexical decision for Ταῦτα and λάλει
  rationale: The added preposition makes the expression natural in modern English while keeping its broad reference.
- pob_phrase: exhort and rebuke
  simplified_phrase: Urge people to put them into practice, and rebuke them when they do wrong
  preserved_meaning: Titus must press for obedience and directly correct wrongdoing.
  reasoning_layer_used: Lexical decisions for παρακάλει and ἔλεγχε
  rationale: The wording clearly distinguishes moral urging from corrective rebuke.
- pob_phrase: with all authority
  simplified_phrase: Do all this with full authority
  preserved_meaning: Titus is to carry out these ministerial duties with the full weight of delegated authority.
  reasoning_layer_used: Lexical and theological decisions for μετὰ πάσης ἐπιταγῆς
  rationale: A separate sentence clarifies that authority governs the whole set of commands without implying personal autonomy.
interpretive_expansions:
- pob_phrase: exhort and rebuke
  rendering: Urge people to put them into practice, and rebuke them when they do wrong
  claim: The urging calls for response to the preceding instructions, while rebuke addresses wrongdoing.
  evidence:
  - “These things” refers back to the chapter’s instructions.
  - The POB rationale gives παρακαλέω directive and moral force.
  - The POB rationale describes ἐλέγχω as exposing and correcting wrong.
  confidence: high
  alternatives_preserved:
  - encourage
  - correct
translation_notes:
  risk_flags:
  - risk: “Full authority” could be mistaken for autonomous personal power.
    mitigation: The audit identifies it as delegated ministerial authority grounded in the apostolic instruction.
