translation:
  language: en
  text: practice self-control, be pure, work at home[a], be kind, and submit to their own husbands[b], so that the word of God may not be slandered.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The rare Greek term refers to doing household work; it does not itself mean being confined to the home.
    reason: simplification_note
  - marker: b
    text: Or “be subject to their own husbands.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: self-controlled
  simplified_phrase: practice self-control
  preserved_meaning: Sound judgment is expressed through prudent self-mastery.
  reasoning_layer_used: Lexical decision for σώφρονας
  rationale: The verbal form makes the expected conduct more direct without narrowing the virtue.
- pob_phrase: being subject to their own husbands
  simplified_phrase: submit to their own husbands
  preserved_meaning: The verse describes ordered submission within each woman’s own marriage.
  reasoning_layer_used: Lexical and theological decisions for ὑποτασσομένας τοῖς ἰδίοις ἀνδράσιν
  rationale: “Submit to” is clearer modern English while retaining the relationship and its limited scope.
