translation:
  language: en
  text: Older men are to be clear-headed, worthy of respect, and self-controlled. They are to be spiritually healthy in faith,[a] love, and patient endurance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “faithfulness.” The Greek word can mean either faith or faithfulness here.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: temperate
  simplified_phrase: clear-headed
  preserved_meaning: The men must show sobriety and broad ethical self-restraint, not merely abstain from wine.
  reasoning_layer_used: Lexical decision for νηφαλίους
  rationale: “Clear-headed” is more immediately understandable than “temperate” and does not limit the command to alcohol.
- pob_phrase: dignified
  simplified_phrase: worthy of respect
  preserved_meaning: Their noble seriousness should invite respect from others.
  reasoning_layer_used: Lexical decision for σεμνούς
  rationale: The expanded phrase states the social force of the virtue in common English.
- pob_phrase: sound in faith, in love, and in steadfastness
  simplified_phrase: spiritually healthy in faith, love, and patient endurance
  preserved_meaning: The health metaphor applies figuratively to three core Christian virtues, including constancy under difficulty.
  reasoning_layer_used: Lexical decisions for ὑγιαίνοντας and ὑπομονῇ
  rationale: The wording preserves the health image while explaining its spiritual sense and the character of steadfastness.
interpretive_expansions:
- pob_phrase: sound
  rendering: spiritually healthy
  claim: The health language describes Christian character rather than physical health.
  evidence:
  - Faith, love, and endurance identify the figurative domain.
  - The POB rationale recognizes doctrinal or moral soundness here.
  confidence: high
  alternatives_preserved:
  - sound
  - healthy in Christian character
- pob_phrase: steadfastness
  rendering: patient endurance
  claim: This virtue means continuing patiently through difficulty.
  evidence:
  - The POB rationale defines ὑπομονή as patient endurance under difficulty.
  confidence: high
  alternatives_preserved:
  - steadfastness
  - perseverance
translation_notes:
  risk_flags:
  - risk: “Clear-headed” could suggest mental alertness alone.
    mitigation: Its place beside self-control retains the broader ethical emphasis.
  - risk: The text uses “faith” although “faithfulness” remains possible.
    mitigation: The footnote preserves the documented ambiguity.
