translation:
  language: en
  text: But when his appointed times came, God revealed his word through the proclamation he entrusted to me, in keeping with the command of God our Savior.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “through preaching”; the Greek can refer either to proclaiming or to the message proclaimed.
    reason: lexical_alternative
  - marker: b
    text: The clause may instead mean “his word, which he entrusted to me.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: in his own times
  simplified_phrase: when his appointed times came
  preserved_meaning: God chose the times when he would reveal his word.
  reasoning_layer_used: lexical and theological decisions on καιροῖς ἰδίοις
  rationale: The rewrite makes the divine timing clear while preserving the possessive force.
- pob_phrase: through the proclamation with which I was entrusted
  simplified_phrase: through the proclamation he entrusted to me
  preserved_meaning: God made his word known through a proclamation assigned to Paul.
  reasoning_layer_used: lexical decisions on κήρυγμα, ὃ, and ἐπιστεύθην
  rationale: The active wording removes the difficult relative clause without changing its preferred referent.
- pob_phrase: according to the command
  simplified_phrase: in keeping with the command
  preserved_meaning: Paul’s entrusted proclamation conformed to God’s authoritative directive.
  reasoning_layer_used: lexical decision on κατ’ ἐπιταγὴν
  rationale: This common expression clearly conveys conformity to an authoritative command.
interpretive_expansions:
