  reasoning_layer_used: POB lexical decisions for ἐπ’ ἐλπίδι, ζωῆς αἰωνίου, and ἣν
  rationale: The new sentence states the contextual connection without defining hope as the ministry’s basis or goal.
- pob_phrase: the God who does not lie
  simplified_phrase: God, who does not lie
  preserved_meaning: The text affirms God’s truthfulness without strengthening it to “cannot lie.”
  reasoning_layer_used: POB lexical and theological decisions for ἀψευδής
  rationale: The natural clause preserves the exact force of the POB choice.
- pob_phrase: before the ages began
