simplification_decisions:
- pob_phrase: They profess to know God
  simplified_phrase: They claim to know God
  preserved_meaning: Their words present an outward claim to know God without establishing that the claim is sincere.
  reasoning_layer_used: POB lexical decision for ὁμολογοῦσιν and footnote a
  rationale: “Claim” is more familiar than “profess” and preserves the contrast with their conduct.
- pob_phrase: but by their works they deny him
  simplified_phrase: but their actions deny him
  preserved_meaning: Their conduct functions as a denial of the God they say they know.
  reasoning_layer_used: POB lexical and theological decisions for τοῖς δὲ ἔργοις and ἀρνοῦνται
  rationale: “Actions” clearly expresses the ethical sense of “works” while retaining the force of “deny.”
- pob_phrase: being detestable and disobedient and unfit for every good work
  simplified_phrase: They are detestable and disobedient, unfit for any good work.
  preserved_meaning: The people are morally repulsive, refuse obedience, and fail the standard for good work.
  reasoning_layer_used: POB lexical decisions for βδελυκτοί, ἀπειθεῖς, and ἀδόκιμοι
  rationale: A new sentence removes the awkward participle and makes the three judgments easier to follow.
