translation:
  language: en
  text: For people who are pure, everything is pure.[a] But for people who are defiled and do not believe, nothing is pure. Rather, both their minds and their consciences are defiled.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word can also mean “clean” and includes both ritual and moral purity throughout this verse.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: All things are pure to the pure
  simplified_phrase: For people who are pure, everything is pure
  preserved_meaning: The statement keeps its broad scope and its contrast between pure things and pure people.
  reasoning_layer_used: Lexical decisions for πάντα and καθαρός
  rationale: The recast clause is more natural while preserving the repeated purity language.
- pob_phrase: those who are defiled and unbelieving
  simplified_phrase: people who are defiled and do not believe
  preserved_meaning: It retains both their corrupted state and their lack of genuine belief.
  reasoning_layer_used: Lexical decisions for μεμιαμμένοις and ἀπίστοις
  rationale: The verbal phrase “do not believe” is easier for common readers than “unbelieving.”
- pob_phrase: both their mind and their conscience are defiled
  simplified_phrase: both their minds and their consciences are defiled
  preserved_meaning: Both the faculty of thought and the faculty of moral judgment remain affected.
  reasoning_layer_used: Lexical decisions for νοῦς, συνείδησις, and καὶ ... καὶ
  rationale: Plural nouns agree naturally with “people” without weakening the emphasis on both faculties.
translation_notes:
  risk_flags:
  - risk: Modern readers may hear “pure” as only moral purity.
    mitigation: The footnote preserves the Greek word’s ritual and moral range.
