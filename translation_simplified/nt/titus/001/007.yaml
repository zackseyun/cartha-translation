translation:
  language: en
  text: After all, an overseer must live in a way that leaves no valid reason to accuse him, as someone who manages what belongs to God. He must not insist on having his own way, be quick to lose his temper, make a habit of drinking too much wine, be violent, or greedily seek shameful profit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: An overseer may also be called a “bishop.” The Greek word describes someone who oversees without specifying later forms of church structure.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: For an overseer must be above reproach
  simplified_phrase: After all, an overseer must live in a way that leaves no valid reason to accuse him
  preserved_meaning: The overseer is required to have no legitimate charge against his conduct.
  reasoning_layer_used: Lexical decisions for δεῖ, γὰρ, ἐπίσκοπον, and ἀνέγκλητον
  rationale: This wording explains the moral requirement without suggesting sinless perfection.
- pob_phrase: as God's steward
  simplified_phrase: as someone who manages what belongs to God
  preserved_meaning: The overseer manages God's affairs under God's ownership and authority.
  reasoning_layer_used: Lexical decision for ὡς θεοῦ οἰκονόμον
  rationale: The common verb “manages” clarifies the steward image while preserving God's ownership.
- pob_phrase: not self-willed, not quick-tempered, not given to wine, not violent, not greedy for shameful gain
  simplified_phrase: must not insist on having his own way, be quick to lose his temper, make a habit of drinking too much wine, be violent, or greedily seek shameful profit
  preserved_meaning: The verse forbids stubborn self-pleasing, a tendency toward anger, habitual wine-related excess, violence, and greed for morally disgraceful profit.
  reasoning_layer_used: Lexical decisions for αὐθάδη, ὀργίλον, πάροινον, πλήκτην, and αἰσχροκερδῆ
  rationale: Everyday phrases preserve each distinct disqualifying trait and keep the wine prohibition character-based.
interpretive_expansions:
