translation:
  language: en
  text: These false teachers must be silenced.[a] They are disrupting entire households[b] by teaching things they should not teach for shameful profit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek literally says “have their mouths stopped”; it does not specify how their teaching is to be stopped.
    reason: lexical_alternative
  - marker: b
    text: A household included the family and others who depended on the home.
    reason: cultural_note
simplification_decisions:
- pob_phrase: They must be silenced, since they are upsetting
  simplified_phrase: These false teachers must be silenced. They are disrupting
  preserved_meaning: The command remains forceful, and their household disruption remains the reason for it.
  reasoning_layer_used: Lexical and theological decisions on ἐπιστομίζειν and οἵτινες
  rationale: Two direct sentences make the command and its reason easier to follow.
- pob_phrase: upsetting whole households
  simplified_phrase: disrupting entire households
  preserved_meaning: Their teaching seriously destabilizes household units without implying total destruction.
  reasoning_layer_used: Lexical decisions on ἀνατρέπουσιν and ὅλους οἴκους
  rationale: “Disrupting” clearly conveys serious harm to household life.
- pob_phrase: for the sake of shameful gain
  simplified_phrase: for shameful profit
  preserved_meaning: Disgraceful financial gain motivates their improper teaching.
  reasoning_layer_used: Lexical decision on αἰσχροῦ κέρδους χάριν
  rationale: “Shameful profit” keeps shame attached to the gain without implying particular methods or an exclusive motive.
interpretive_expansions:
- pob_phrase: They
  rendering: These false teachers
  claim: The pronoun refers to the false teachers described in the preceding verse.
  evidence:
  - The POB lexical rationale identifies the antecedent as the false teachers of the previous verse.
  confidence: high
  alternatives_preserved:
  - They
