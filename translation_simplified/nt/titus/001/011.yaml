translation_notes:
  risk_flags:
  - risk: “Silenced” could be mistaken for a command prescribing physical or civil punishment.
    mitigation: Footnote a says the verse does not specify how their teaching is to be stopped.
  - risk: Modern readers may understand “households” as buildings rather than social units.
    mitigation: Footnote b explains that the term includes family and dependents.
