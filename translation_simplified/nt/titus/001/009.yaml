translation:
  language: en
  text: He must hold firmly to the trustworthy message that agrees with the teaching. Then he will be able to use sound teaching both to urge others and to rebuke those who contradict it.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The word translated “rebuke” can also mean “refute,” exposing or proving someone wrong.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: holding firmly to the trustworthy word in accordance with the teaching
  simplified_phrase: He must hold firmly to the trustworthy message that agrees with the teaching
  preserved_meaning: A church leader must steadfastly adhere to the reliable message that conforms to recognized Christian teaching.
  reasoning_layer_used: POB lexical and theological decisions on ἀντεχόμενον, πιστοῦ λόγου, and κατὰ τὴν διδαχήν
  rationale: The finite sentence and “agrees with” make the relationship easier to follow while preserving steadfast adherence and conformity.
- pob_phrase: so that he may be able both to exhort by sound teaching
  simplified_phrase: Then he will be able to use sound teaching both to urge others
  preserved_meaning: Firm adherence equips him to give authoritative positive instruction through sound teaching.
  reasoning_layer_used: POB lexical decisions on δυνατὸς ᾖ, παρακαλεῖν, and sound teaching
  rationale: “Urge others” replaces the less familiar “exhort” without reducing it to mere comfort.
- pob_phrase: to rebuke those who contradict it
  simplified_phrase: to rebuke those who contradict it
  preserved_meaning: He must also confront and correct people who speak against the trustworthy teaching.
  reasoning_layer_used: POB lexical and theological decisions on ἀντιλέγοντας and ἐλέγχειν
  rationale: The main wording retains the pastoral corrective force, while the footnote preserves the possible sense “refute.”
translation_notes:
  risk_flags:
  - risk: “Message” is broader than the retained biblical term “word.”
    mitigation: The wording preserves POB’s sense of the reliable apostolic content rather than a single spoken word.
  - risk: The pronoun “it” may refer to either the trustworthy message or sound teaching.
    mitigation: The context treats these as closely related, so the wording does not force an unnecessary distinction.
