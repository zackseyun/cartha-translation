translation:
  language: en
  text: For we too were once foolish and disobedient. We were led astray[a] and enslaved to all kinds of desires and pleasures. We lived with ill will and envy. We were hateful[b] and hated one another.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “deceived.”
    reason: lexical_alternative
  - marker: b
    text: Or “hated.” The Greek word may describe people who are hateful or people who are hated.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: For we ourselves also were once
  simplified_phrase: For we too were once
  preserved_meaning: Paul includes himself and his companions in this former condition while connecting the verse to what came before.
  reasoning_layer_used: POB lexical decision for ἦμεν γάρ ποτε καὶ ἡμεῖς
  rationale: The shorter wording retains the connection, inclusion, and past time in natural English.
- pob_phrase: various desires and pleasures
  simplified_phrase: all kinds of desires and pleasures
  preserved_meaning: Their bondage involved many kinds of disordered longing and pleasure.
  reasoning_layer_used: POB lexical and theological decisions for ἐπιθυμίαις, ἡδοναῖς, and δουλεύοντες
  rationale: “All kinds of” is more familiar than “various” without narrowing desires to sexual lust.
- pob_phrase: spending our lives in malice and envy
  simplified_phrase: We lived with ill will and envy
  preserved_meaning: Their former way of life was marked by hostility toward others and envy.
  reasoning_layer_used: POB lexical decision for ἐν κακίᾳ καὶ φθόνῳ διάγοντες
  rationale: “Ill will” makes interpersonal malice immediately understandable while retaining envy as a distinct vice.
translation_notes:
  risk_flags:
