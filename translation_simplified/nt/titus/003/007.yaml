  preserved_meaning: His grace is the means of justification, which precedes becoming heirs.
  reasoning_layer_used: Lexical and theological decisions for δικαιωθέντες and τῇ ἐκείνου χάριτι.
  rationale: The reordered clause uses natural English while preserving passive justification and sequence.
- pob_phrase: we might become heirs according to the hope of eternal life
  simplified_phrase: we might become heirs in hope of eternal life
  preserved_meaning: We enter the status of heirs in expectation of eternal life.
  reasoning_layer_used: POB footnote and lexical decisions for κληρονόμοι, γενηθῶμεν, and κατ’ ἐλπίδα.
  rationale: “In hope” uses the documented alternative while preserving inheritance and future expectation.
translation_notes:
