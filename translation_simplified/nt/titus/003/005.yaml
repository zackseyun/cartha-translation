translation:
  language: en
  text: He saved us—not because of righteous deeds we ourselves had done, but because of his mercy. He saved us through the washing of rebirth[a] and renewal by the Holy Spirit.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Washing” may refer to baptism, cleansing imagery, or both.
    reason: lexical_alternative
  - marker: b
    text: Or “renewal of the Holy Spirit”; the Greek allows more than one way to relate the Holy Spirit to “renewal.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: not from works done in righteousness, which we ourselves did
  simplified_phrase: not because of righteous deeds we ourselves had done
  preserved_meaning: Our own righteous actions were not the basis of salvation, with emphasis on “we ourselves.”
  reasoning_layer_used: Lexical decisions for οὐκ ἐξ ἔργων, δικαιοσύνη, and emphatic ἡμεῖς.
  rationale: “Righteous deeds” states the difficult phrase naturally while retaining righteousness and human action.
- pob_phrase: according to his mercy he saved us
  simplified_phrase: but because of his mercy. He saved us
  preserved_meaning: God’s mercy, rather than human deeds, is the basis of his saving action.
  reasoning_layer_used: Lexical decision for κατὰ τὸ αὐτοῦ ἔλεος.
  rationale: Reordering and repeating “He saved us” makes the contrast and following means easier to follow.
- pob_phrase: through the washing of regeneration and renewal by the Holy Spirit
  simplified_phrase: through the washing of rebirth and renewal by the Holy Spirit
  preserved_meaning: Salvation comes through washing associated with new birth and through the Spirit’s renewing work.
  reasoning_layer_used: Lexical and theological decisions for λουτρόν, παλιγγενεσία, and πνεύματος ἁγίου.
  rationale: “Rebirth” explains “regeneration” without defining the washing as baptism or metaphor.
interpretive_expansions:
- pob_phrase: according to his mercy
  rendering: because of his mercy
  claim: God’s mercy is the basis of his saving action.
  evidence:
  - The POB lexical rationale says κατά expresses standard or basis.
  - The immediate context contrasts human deeds with God’s mercy.
  confidence: high
  alternatives_preserved:
  - in keeping with his mercy
translation_notes:
  risk_flags:
