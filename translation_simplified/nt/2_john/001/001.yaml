translation:
  language: en
  text: From the elder to the chosen lady[a] and her children, whom I love in truth.[b] I am not the only one who loves them. Everyone who has come to know the truth loves them too.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The “lady” may be a Christian woman, a local church pictured as a lady, or a woman named Kyria.
    reason: alternative_reading
  - marker: b
    text: “In truth” may mean “truly” and may also carry the sense “in the truth.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: The elder, to the chosen lady and her children
  simplified_phrase: From the elder to the chosen lady and her children
  preserved_meaning: The writer identifies himself as the elder and names the recipients without resolving who the lady is.
  reasoning_layer_used: lexical and theological decisions on πρεσβύτερος and ἐκλεκτῇ κυρίᾳ
  rationale: Adding “From” makes the letter opening natural in modern English.
- pob_phrase: and not I alone, but also all who have come to know the truth
  simplified_phrase: I am not the only one who loves them. Everyone who has come to know the truth loves them too.
  preserved_meaning: The wider community that knows the truth shares the elder’s love for the recipients.
  reasoning_layer_used: lexical decision on οὐκ ἐγὼ μόνος ἀλλὰ καὶ πάντες
  rationale: Two direct sentences make the contrast and implied repeated verb easy to follow.
