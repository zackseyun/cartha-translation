translation:
  language: en
  text: Anyone who moves on ahead and does not stay with the teaching of the Messiah does not have God.[a] But whoever stays with that teaching has both the Father and the Son.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Moves on ahead” may also mean “goes too far” or “runs ahead.” Some manuscripts have “transgresses.”
    reason: textual_variant
  - marker: b
    text: “The teaching of the Messiah” may mean the teaching given by the Messiah or the teaching about him.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Everyone who goes on ahead
  simplified_phrase: Anyone who moves on ahead
  preserved_meaning: The image of advancing beyond the true teaching remains without defining it as transgression.
  reasoning_layer_used: POB lexical and theological decisions on προάγων
  rationale: “Moves on ahead” expresses the metaphor in natural modern English.
- pob_phrase: The one who remains in the teaching, this one
  simplified_phrase: But whoever stays with that teaching
  preserved_meaning: The person who continues in the same teaching is emphatically contrasted with the one who moves ahead.
  reasoning_layer_used: POB lexical decisions on μένω and οὗτος
  rationale: The contrast and emphasis are carried by “But whoever” without the awkward repetition.
