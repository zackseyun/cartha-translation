simplification_decisions:
- pob_phrase: And now I ask you, lady
  simplified_phrase: Now, lady, I ask you this
  preserved_meaning: John respectfully addresses the lady and makes a request.
  reasoning_layer_used: The lexical and theological decisions retain “ask” and the deliberately ambiguous “lady.”
  rationale: The reordered opening is natural English while leaving the request connected to what follows.
- pob_phrase: not as though I were writing to you a new commandment
  simplified_phrase: I am not writing you a new commandment
  preserved_meaning: John denies that the commandment he writes is new.
  reasoning_layer_used: The lexical decision preserves the Johannine phrase “new commandment.”
  rationale: A direct statement removes the awkward comparative wording without changing the contrast.
- pob_phrase: 'but the one we have had from the beginning: that we love one another'
  simplified_phrase: but the one we have had from the beginning—that we love one another
  preserved_meaning: Mutual love is the content of the commandment they have long possessed.
  reasoning_layer_used: The lexical decisions preserve both “from the beginning” and “love one another.”
  rationale: The dash clearly links mutual love to the longstanding commandment.
translation_notes:
  risk_flags:
  - risk: “Lady” may seem to identify one particular woman even though the referent is uncertain.
    mitigation: The footnote preserves the woman, church, and proper-name possibilities.
