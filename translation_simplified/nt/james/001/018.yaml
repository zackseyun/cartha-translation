  - Replaced 'Having willed it' with the more common and active 'Because he willed it'. Changed 'by the word of truth' to 'through the word of truth' for smoother flow. Used 'would be' instead of 'might be' to feel more direct to a modern reader.
  compression_notes:
  - No major semantic compressions were made; the structural density was slightly relaxed, and the metaphorical meaning of 'firstfruits' was moved to an explanatory footnote to keep the text crisp.
  risk_flags:
