translation:
  language: en
  text: 'Religion that is pure and faultless before God the Father is this: to care[a] for orphans and widows in their distress, and to keep oneself unstained by the world[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'to visit'; the Greek verb can mean both visiting and actively providing care.
    reason: simplification_note
  - marker: b
    text: Here, 'the world' refers to the corrupt moral system opposed to God, not to creation itself.
    reason: simplification_note
simplification_decisions:
- preserved_meaning: Changed 'undefiled' to 'faultless' to eliminate archaic ritualistic language while keeping the ethical contrast clean and powerful.
  reasoning_layer_used: POB audit trail
  rationale: Changed 'undefiled' to 'faultless' to eliminate archaic ritualistic language while keeping the ethical contrast clean and powerful.
- preserved_meaning: Updated 'affliction' to 'distress' to use a more common and emotionally immediate word for modern readers.
  reasoning_layer_used: POB audit trail
  rationale: Updated 'affliction' to 'distress' to use a more common and emotionally immediate word for modern readers.
- preserved_meaning: Adjusted 'unstained from the world' to 'unstained by the world' to match natural modern English prepositional usage.
  reasoning_layer_used: POB audit trail
  rationale: Adjusted 'unstained from the world' to 'unstained by the world' to match natural modern English prepositional usage.
retained_terms:
- term: Religion (θρησκεία) is retained as it represents the outward, active practice of faith rather than internal belief alone.
  reason: Retained to preserve POB's source-grounded terminology.
- term: God the Father is retained to maintain the exact divine relationship defined in the source.
  reason: Retained to preserve POB's source-grounded terminology.
- term: Orphans and widows are retained because they represent the specific class of socially vulnerable people emphasized in biblical ethics.
  reason: Retained to preserve POB's source-grounded terminology.
- term: The world is retained in the main text to avoid over-interpreting the Greek 'κόσμος', using a cultural footnote to clarify its ethical meaning.
  reason: Retained to preserve POB's source-grounded terminology.
translation_notes:
  source_alignment_notes:
  - The translation of 'ἐπισκέπτεσθαι' as 'to care for' is maintained because active assistance is the primary contextual meaning, with 'visit' preserved in footnote [a].
  - The pronoun 'oneself' (ἑαυτόν) is kept to maintain a gender-accurate translation of James's general ethical maxim.
  readability_notes:
  - Replacing 'affliction' with 'distress' removes academic stiffness and highlights the immediate trouble of the vulnerable.
  - The syntax flows as a direct, parallel list, making the two-part definition of pure religion easy to memorize and understand.
  compression_notes:
  - No clauses or words were omitted; the semantic density and exact ethical commands of the POB are fully preserved.
  risk_flags:
