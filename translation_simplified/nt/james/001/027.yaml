translation_notes:
  risk_flags:
  - risk: “Unpolluted” may initially suggest physical or environmental pollution.
    mitigation: Its pairing with “pure” and “unstained” keeps the intended moral-defilement image clear.
  - risk: “From the world” could be mistaken for rejection of creation or society itself.
    mitigation: Footnote [b] limits the phrase to the morally corrupt order opposed to God.
