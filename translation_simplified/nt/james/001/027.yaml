translation:
  language: en
  text: 'The religion God the Father considers pure and unpolluted is this: caring[a] for orphans and widows in their distress, and keeping oneself unstained from the world.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “visiting”; the Greek verb includes personal attention and active care.
    reason: lexical_alternative
  - marker: b
    text: Here, “the world” means the morally corrupt order opposed to God, not creation itself.
    reason: cultural_note
simplification_decisions:
- pob_phrase: Religion that is pure and undefiled before God the Father
  simplified_phrase: The religion God the Father considers pure and unpolluted
  preserved_meaning: God evaluates this religious practice as free from moral defilement.
  reasoning_layer_used: POB lexical decisions for παρὰ τῷ θεῷ καὶ πατρὶ and ἀμίαντος
  rationale: “Considers” clarifies divine evaluation, while “unpolluted” preserves the contamination image without implying faultlessness.
- pob_phrase: to care for orphans and widows in their affliction
  simplified_phrase: caring for orphans and widows in their distress
  preserved_meaning: True religious practice includes active help for vulnerable people in trouble.
  reasoning_layer_used: POB lexical decisions for ἐπισκέπτεσθαι and θλῖψις
  rationale: The gerund fits the recast sentence, and “distress” is clearer than “affliction.”
- pob_phrase: to keep oneself unstained from the world
  simplified_phrase: keeping oneself unstained from the world
  preserved_meaning: Each person must actively guard against moral contamination from the world.
  reasoning_layer_used: POB lexical and theological decisions for τηρεῖν, ἑαυτόν, and κόσμος
  rationale: The wording retains both active guarding and the source relationship expressed by “from.”
