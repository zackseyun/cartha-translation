simplification_decisions:
- simplified_phrase: after conceiving
  preserved_meaning: Shortens the clause and simplifies the verbal structure while keeping the essential biological/conception imagery.
  reasoning_layer_used: POB audit trail
  rationale: Shortens the clause and simplifies the verbal structure while keeping the essential biological/conception imagery.
- simplified_phrase: gives birth to
  preserved_meaning: The original Greek verb (apokyei) carries childbirth imagery. Rendering both verbs as 'gives birth to' reinforces the parallel metaphor of family descent (desire gives birth to sin, sin gives birth to death) in a way that is highly readable and punchy for modern readers.
  reasoning_layer_used: POB audit trail
