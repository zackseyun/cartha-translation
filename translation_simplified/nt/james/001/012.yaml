translation:
  language: en
  text: The man who endures a trial is blessed.[a] He is blessed because, after he has stood the test and been approved, he will receive the crown of life,[b] which God promised to those who love him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word can mean “trial,” “temptation,” or “testing,” but here the focus is on enduring a test.
    reason: lexical_alternative
  - marker: b
    text: The Greek term can refer to a victor’s wreath, not necessarily a royal crown.
    reason: cultural_note
