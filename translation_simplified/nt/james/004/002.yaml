translation:
  language: en
  text: You desire things but do not have them[a]. You murder[b] and envy[c], but you cannot obtain what you want. You fight and wage war. You do not have because you do not ask[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “You covet”; the Greek verb refers to strong desire, often wrongful in this context.
    reason: lexical_alternative
  - marker: b
    text: Or “You kill”; the Greek verb often means “murder,” though some interpreters understand the wording rhetorically.
    reason: lexical_alternative
  - marker: c
    text: Or “you are jealous.”
    reason: lexical_alternative
  - marker: d
    text: The context implies asking God, though the Greek text does not state this explicitly.
    reason: cross_reference
