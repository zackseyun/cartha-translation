translation:
  language: en
  text: You desire things but do not have them[a]. You murder[b] and envy[c], but you cannot obtain what you want. So you fight and wage war. You do not have because you do not ask[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'You covet'; the Greek verb refers to a strong, often wrongful desire.
    reason: simplification_note
  - marker: b
    text: Or 'You kill'; the Greek verb specifically means 'murder,' though some interpreters understand this metaphorically.
    reason: simplification_note
  - marker: c
    text: Or 'you are jealous.'
    reason: simplification_note
  - marker: d
    text: The context implies asking God, though the Greek text does not state this explicitly.
    reason: simplification_note
