  rationale: Uses 'fails' to capture the active neglect of duty (omission) implied by the contrast between knowing and not acting.
- simplified_phrase: it is sin for them
  preserved_meaning: Updates the generic singular pronoun to the modern gender-inclusive 'them' to match contemporary English usage while keeping the personal application intact.
  reasoning_layer_used: POB audit trail
  rationale: Updates the generic singular pronoun to the modern gender-inclusive 'them' to match contemporary English usage while keeping the personal application intact.
