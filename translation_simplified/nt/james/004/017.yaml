translation_notes:
  source_alignment_notes: The logical connector 'So' (οὖν) is retained to preserve the link to the preceding context. The qualitative nature of the anarthrous noun 'sin' (ἁμαρτία) is preserved by translating it as 'it is sin' rather than 'it is a sin'.
  readability_notes:
  - Replacing the convoluted dative chain ('for the one... it is sin for him') with a simple conditional structure ('if anyone... it is sin for them') drastically improves flow for contemporary readers without losing structural fidelity.
  compression_notes:
  - The literal wording was slightly tightened for readability, but no semantic elements or theological pressures were compressed out. The POB footnote was omitted because the main text translation now naturally covers the generic 'whoever/anyone' scope without requiring a complex alternative note.
  risk_flags:
