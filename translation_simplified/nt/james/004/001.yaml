translation:
  language: en
  text: Where do the wars and the fights among you come from? Don’t they come from this—from the pleasures that wage war within you?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “conflicts and quarrels.” The Greek uses military terms for disputes within the community.
    reason: lexical_alternative
  - marker: b
    text: Literally, “in your members.” This can refer to bodily parts or, more broadly, to the inner faculties of a person.
    reason: lexical_alternative
