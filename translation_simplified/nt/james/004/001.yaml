translation_notes:
  source_alignment_notes: The simplified draft maintains the structural links between external fights and internal desires. We retained the repetition of 'where' (πόθεν) as 'Where do... and where do...' to match the source rhetorical weight. The translation of 'μέλεσιν' as 'inside your bodies' closely aligns with the literal physical reference of 'members' without straying into purely psychological abstraction.
  readability_notes:
  - Simplified the complex sentence structure by turning 'Is it not from here—from your pleasures...' into 'Don't they come from this—from the pleasures...'. This flows naturally in spoken or written modern English while retaining the punchy rhetorical flow.
  compression_notes:
  - Compressed the double 'from where come' into a more natural double 'where do... come from'. Merged and simplified some of the dense footnote explanations to make them more accessible to lay readers.
  risk_flags:
  - risk: Using 'inside your bodies' for 'in your members' could slightly narrow the scope of 'members' (which can also mean faculties), but this is mitigated by the clarifying footnote.
    mitigation: Flag retained for reviewer attention.
