translation:
  language: en
  text: Where do the wars and where do the fights among you come from? Don't they come from this—from the pleasures that wage war inside your bodies?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'conflicts and quarrels.' The Greek uses military terms for disputes within the community.
    reason: simplification_note
  - marker: b
    text: The Greek word literally refers to bodily parts, pointing to the struggle of desires within a person.
    reason: simplification_note
simplification_decisions:
- preserved_meaning: Rephrased the archaic 'From where come...' to 'Where do... come from?' to match modern questioning style while preserving the double interrogative structure ('Where do the wars and where do the fights...').
  reasoning_layer_used: POB audit trail
  rationale: Rephrased the archaic 'From where come...' to 'Where do... come from?' to match modern questioning style while preserving the double interrogative structure ('Where do the wars and where do the fights...').
- preserved_meaning: Translated 'in your members' to 'inside your bodies' to make the bodily metaphor (Greek 'melē') immediately understandable to modern readers without using the archaic or ecclesiastical term 'members'.
  reasoning_layer_used: POB audit trail
  rationale: Translated 'in your members' to 'inside your bodies' to make the bodily metaphor (Greek 'melē') immediately understandable to modern readers without using the archaic or ecclesiastical term 'members'.
- preserved_meaning: Rendered the rhetorical question 'Is it not from here...' as 'Don't they come from this...', which is a much more natural way of expressing the expected affirmative answer in modern English.
  reasoning_layer_used: POB audit trail
  rationale: Rendered the rhetorical question 'Is it not from here...' as 'Don't they come from this...', which is a much more natural way of expressing the expected affirmative answer in modern English.
