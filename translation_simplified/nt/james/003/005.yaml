translation:
  language: en
  text: So also the tongue is a small part of the body, yet it boasts of great things. See how a small fire[a] sets a huge forest[b] ablaze!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “See how great a fire sets ablaze how great a forest.” The Greek wording can be read either as emphasizing the contrast between a small fire and a large forest or as expressing the great scale of both.
    reason: alternative_reading
  - marker: b
    text: Or “wood,” “timber,” or “brushwood.” The Greek word can refer broadly to combustible material or woodland.
    reason: lexical_alternative
