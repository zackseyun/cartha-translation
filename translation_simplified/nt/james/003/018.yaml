translation:
  language: en
  text: And a harvest of righteousness[a] is sown in peace by those who make peace[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a harvest of justice.” The Greek word can include both doing what is right and treating people justly.
    reason: lexical_alternative
  - marker: b
    text: Or “for those who make peace.” The Greek wording can be understood differently, though “by those who make peace” best fits the passive verb here.
    reason: alternative_reading
