translation:
  language: en
  text: And the prayer offered in faith will save the sick person[a], and the Lord will raise him up. And if[b] he has committed sins, he will be forgiven.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'will heal' or 'will make well'; the Greek word means 'save' but frequently refers to healing from physical illness.
    reason: simplification_note
  - marker: b
    text: Or 'even if'.
    reason: simplification_note
