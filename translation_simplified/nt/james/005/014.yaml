translation:
  language: en
  text: If anyone among you is sick[a], he should call for the elders of the church. The elders should pray over him and anoint him with oil[b] in the name of the Lord.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “weak.” The Greek word can refer to weakness more broadly, but the context of prayer, anointing, and healing strongly suggests physical sickness here.
    reason: lexical_alternative
  - marker: b
    text: The oil may have been medicinal, symbolic, or both; the text does not specify its function.
    reason: cultural_note
