translation:
  language: en
  text: In the same way, was not Rahab the prostitute also justified[a] by works when she welcomed the messengers[b] and sent them out by a different route?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'shown to be righteous' or 'declared righteous.' The Greek text uses the word for 'justified,' and the translation preserves this term to keep the theological depth and connection to the surrounding passage.
    reason: lexical_alternative
  - marker: b
    text: The Greek word can mean 'angels' or 'messengers.' The context here refers to the human spies Rahab received in Joshua 2.
    reason: cross_reference
