translation:
  language: en
  text: For anyone who keeps the whole law but stumbles in just one point has become guilty of breaking all of it.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word for 'stumbles' is a metaphor for committing a moral failure or breaking a command. Being 'guilty of breaking all of it' means that violating even one part of the law makes a person accountable for the whole law.
    reason: simplification_note
simplification_decisions:
- simplified_phrase: anyone who keeps
  reasoning_layer_used: POB audit trail
- simplified_phrase: stumbles in just one point
  reasoning_layer_used: POB audit trail
- simplified_phrase: guilty of breaking all of it
  reasoning_layer_used: POB audit trail
retained_terms:
- term: stumbles
  reason: We retained the metaphor of stumbling (πταίω) because it is a vivid source-language image that James uses to define moral failure, and POB's audit trail prioritizes preserving this imagery.
- term: law
  reason: We retained 'law' (νόμος) as it is the central theological entity being discussed, and any substitution would obscure the covenantal and legal framework of the passage.
translation_notes:
  source_alignment_notes: The translation preserves the logical connector 'For' (γὰρ) and maintains the perfect-tense verb 'has become' (γέγονεν) to show the ongoing state of culpability that results from a single violation.
  readability_notes:
  - The sentence structure is kept single and direct, matching James's concise style. By substituting 'anyone who' and clarifying 'guilty of breaking,' the verse sounds more natural when read aloud.
  compression_notes:
  - The core POB text is not compressed, as it is already quite short. However, the original two scholarly footnotes were consolidated and simplified into a single lay-friendly explanation of the 'stumbling' and 'guilt' concepts.
  risk_flags:
  - risk: There is a minor risk that adding the word 'breaking' before 'all of it' might be perceived as adding to the text, but this addition is justified because it directly glosses the theological concept of accountability to the whole law without introducing non-biblical ideas.
    mitigation: Flag retained for reviewer attention.
