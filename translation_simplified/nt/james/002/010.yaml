translation:
  language: en
  text: For anyone who obeys the whole law but stumbles at just one point has become guilty under the whole law.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Stumbles” is a picture of moral failure. Breaking even one part makes a person accountable under the whole law; it does not mean that the person has personally broken every command.
    reason: simplification_note
simplification_decisions:
- pob_phrase: keeps the whole law
  simplified_phrase: obeys the whole law
  preserved_meaning: The person observes the law's commands.
  reasoning_layer_used: POB lexical decision for τηρήσῃ
  rationale: “Obeys” makes the moral and legal sense of “keeps” immediately clear.
- pob_phrase: stumbles in one point
  simplified_phrase: stumbles at just one point
  preserved_meaning: A person fails morally in a single requirement of the law.
  reasoning_layer_used: POB lexical decisions for πταίσῃ and ἐν ἑνί
  rationale: This retains the stumbling image while clearly stressing a single point of failure.
- pob_phrase: guilty of all of it
  simplified_phrase: guilty under the whole law
  preserved_meaning: Breaking one part leaves the person accountable with respect to the law as a whole.
  reasoning_layer_used: POB theological decision on the scope of culpability
  rationale: “Under the whole law” avoids implying that the person personally broke every command.
interpretive_expansions:
- pob_phrase: guilty of all of it
  rendering: guilty under the whole law
  claim: The guilt concerns accountability to the law as a whole, not the commission of every individual offense.
  evidence:
  - The POB renders πάντων ἔνοχος as guilt or liability with respect to the whole law.
  - The POB theological decision rejects the claim that every command was individually broken.
  confidence: high
  alternatives_preserved:
  - accountable under the whole law
  - liable with respect to the whole law
translation_notes:
  risk_flags:
  - risk: “Under the whole law” makes the sphere of accountability more explicit than the POB wording.
    mitigation: The wording follows the POB theological decision and the reviewed meaning of πάντων ἔνοχος.
