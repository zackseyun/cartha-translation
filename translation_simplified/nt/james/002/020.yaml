translation:
  language: en
  text: But do you want to know, you foolish man[a], that faith without works is useless[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek literally says “empty man”; it can describe someone who is hollow, foolish, or vain.
    reason: lexical_alternative
  - marker: b
    text: Or “is idle” or “is ineffective.” The Greek term means inactive or unproductive.
    reason: lexical_alternative
