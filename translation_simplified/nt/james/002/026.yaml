simplification_decisions:
- pob_phrase: For just as the body without the spirit is dead, so also
  simplified_phrase: For a body with no spirit is dead. In the same way,
  preserved_meaning: The body’s death remains the comparison for the death of faith without works.
  reasoning_layer_used: POB lexical decisions for ὥσπερ, γὰρ, and οὕτως καὶ
  rationale: Two short sentences make the analogy easier to follow while retaining its explanatory link.
- pob_phrase: without the spirit
  simplified_phrase: with no spirit
  preserved_meaning: The body lacks the spirit that gives it life, while “breath” remains a possible reading.
  reasoning_layer_used: POB lexical and theological decision for χωρὶς πνεύματος
  rationale: “With no” is common English and preserves the source image.
- pob_phrase: faith without works
  simplified_phrase: faith with no works
  preserved_meaning: Faith lacking works is declared dead, with both key terms kept distinct.
  reasoning_layer_used: POB lexical and theological decisions for πίστις and χωρὶς ἔργων
  rationale: The clearer syntax retains “faith” and “works” because they are central to James’s argument.
