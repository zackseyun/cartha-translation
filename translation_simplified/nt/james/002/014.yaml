translation:
  language: en
  text: My brothers[a], what good is it if someone says he has faith[b] but does not have works? Can that faith[c] save him?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “brothers and sisters.” The Greek plural word refers to both men and women in the Christian community.
    reason: lexical_alternative
  - marker: b
    text: The Greek word for “faith” can also mean “trust” or, in some contexts, “faithfulness.”
    reason: lexical_alternative
  - marker: c
    text: 'Or “such faith.” The Greek literally says “the faith,” pointing back to the kind just mentioned: faith that someone says he has but that is not accompanied by works.'
    reason: alternative_reading
