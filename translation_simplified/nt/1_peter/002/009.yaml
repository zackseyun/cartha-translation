translation:
  language: en
  text: But you are a chosen people,[a] a royal priesthood, a holy nation, and a people who belong to God. All this is so that you may proclaim how great he is and what he has done.[b] He is the one who called you out of darkness into his marvelous light.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a chosen race.” The Greek word refers to a people or family line, not necessarily to a modern ethnic category.
    reason: lexical_alternative
  - marker: b
    text: The Greek expression includes God’s praiseworthy qualities and may also be rendered “his praises” or “his mighty deeds.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: a people for his own possession
  simplified_phrase: a people who belong to God
  preserved_meaning: God has a special claim on this people; they belong to him as his covenant people.
  reasoning_layer_used: POB lexical decision and theological decision on the implied possessor
  rationale: “For his own possession” is difficult modern English. The simpler wording expresses the same relationship and names God as the possessor, as the POB reasoning already permits.
- pob_phrase: so that you may proclaim the excellencies
  simplified_phrase: All this is so that you may proclaim how great he is and what he has done
  preserved_meaning: Their corporate identity has the purpose of publicly declaring God’s praiseworthy character and acts.
  reasoning_layer_used: POB lexical rationale for ὅπως, τὰς ἀρετὰς, and ἐξαγγείλητε
  rationale: The abstract word “excellencies” is unfolded into ordinary English while retaining both the purpose clause and the public force of “proclaim.” The footnote preserves documented lexical alternatives.
- pob_phrase: of the one who called you out of darkness into his marvelous light
  simplified_phrase: He is the one who called you out of darkness into his marvelous light
  preserved_meaning: God is identified as the one who delivered and summoned them from darkness into his light.
  reasoning_layer_used: POB lexical decisions for τοῦ ... καλέσαντος, ἐκ σκότους, and εἰς τὸ θαυμαστὸν αὐτοῦ φῶς
  rationale: Turning the dense participial phrase into a separate sentence makes the relationship immediately clear while preserving the movement imagery and elevated description of God’s light.
interpretive_expansions:
- pob_phrase: his own possession
  rendering: belong to God
  claim: The implied possessor is God.
  evidence:
  - The immediate context identifies the divine caller and refers to “his marvelous light.”
  - The POB theological decision explicitly authorizes making God as possessor clear in English.
  confidence: high
  alternatives_preserved:
  - a people for his own possession
- pob_phrase: the excellencies
  rendering: how great he is and what he has done
  claim: The proclamation concerns both God’s praiseworthy character and his acts.
  evidence:
  - The POB lexical rationale states that ἀρετή here refers broadly to God’s praiseworthy character and acts.
  - The recorded alternatives “the praises” and “the mighty deeds” reflect both dimensions and are preserved in the footnote.
  confidence: high
  alternatives_preserved:
  - the excellencies
  - his praises
  - his mighty deeds
retained_terms:
- term: chosen people
  reason: Preserves corporate election and the Old Testament covenant echo without misleading modern ethnic overtones.
- term: royal priesthood
  reason: Preserves both the royal and priestly dimensions of the Greek phrase and its echo of Exodus 19:6.
- term: holy nation
  reason: Preserves the direct covenant title and the biblical concept of a people set apart to God.
- term: darkness ... marvelous light
  reason: Retains the source-language image of movement from one realm or condition into another.
translation_notes:
  source_alignment_notes: The draft preserves all four corporate identity descriptions, the purpose of proclamation, God as the implied possessor and caller, and the movement from darkness into light. It does not soften the covenant titles or resolve their broader theological implications beyond the verse.
  readability_notes:
  - The long POB sentence is divided into three shorter sentences.
  - The ownership phrase is recast as the direct and natural expression “belong to God.”
  - The abstract term “excellencies” is explained in common English while its lexical range remains visible in a footnote.
  - The contrastive opening “But you” and the emphatic direct address are retained.
  risk_flags:
  - risk: Unfolding “excellencies” as “how great he is and what he has done” could appear to choose between divine qualities and deeds.
    mitigation: The main text deliberately includes both, and footnote b preserves the POB’s documented alternatives.
  - risk: Naming God in “belong to God” makes an implied referent explicit.
    mitigation: The immediate context and the POB theological audit both identify God as the intended possessor.
