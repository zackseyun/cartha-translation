translation:
  language: en
  text: He himself bore our sins in his body on the tree.[a] He did this so that we might die to sins and live for righteousness. By his wound you were healed.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “on the cross.” The Greek says “on the tree,” likely echoing Deuteronomy 21:23.
    reason: alternative_reading
  - marker: b
    text: Or “By his bruise” or “By his stripe.” The singular wording echoes Isaiah 53:5. In this context, healing is connected with sins and righteousness, but the wording does not limit it to only physical or only spiritual healing.
    reason: cross_reference
simplification_decisions:
- pob_phrase: He himself bore our sins in his body on the tree
  simplified_phrase: He himself bore our sins in his body on the tree.
  preserved_meaning: Christ emphatically and personally bore human sins through his bodily suffering on the tree.
  reasoning_layer_used: POB lexical decisions for αὐτός, ἀνήνεγκεν, ἐν τῷ σώματι αὐτοῦ, and ἐπὶ τὸ ξύλον; theological decision on ξύλον
  rationale: This wording is already direct and carries several protected source-language ideas. “He himself,” “bore,” “in his body,” and “tree” were retained because simplifying them further would weaken the emphasis, embodied suffering, sin-bearing language, or scriptural echo.
- pob_phrase: so that, having died to sins, we might live to righteousness
  simplified_phrase: He did this so that we might die to sins and live for righteousness.
  preserved_meaning: Christ bore sins for the purpose of enabling a decisive break from sins and a life directed toward righteousness.
  reasoning_layer_used: POB lexical decisions for ταῖς ἁμαρτίαις ἀπογενόμενοι and τῇ δικαιοσύνῃ; source purpose clause introduced by ἵνα
  rationale: The dense participial construction was recast as a new sentence with ordinary English clause order. “Die to sins” preserves the source image of decisive separation, while “live for righteousness” makes the direction of the new life clearer than the less natural phrase “live to righteousness.”
- pob_phrase: By his wound you were healed.
  simplified_phrase: By his wound you were healed.
  preserved_meaning: The readers' healing came through Christ's singular wound, with the broad healing language and Isaiah 53 echo left intact.
  reasoning_layer_used: POB lexical decisions for μώλωπι and ἰάθητε; theological decision on the extent of healing
  rationale: The POB wording is concise and understandable. It was retained so the translation would not narrow healing to either a physical-only or spiritual-only claim.
interpretive_expansions:
- pob_phrase: so that, having died to sins, we might live to righteousness
  rendering: He did this so that we might die to sins and live for righteousness.
  claim: The preceding act of bearing sins is explicitly presented as having the stated purpose.
  evidence:
  - The Greek purpose conjunction ἵνα introduces the clause.
  - The immediate grammatical context connects the purpose clause to Christ bearing sins in his body.
  confidence: high
  alternatives_preserved:
  - The wording still presents dying to sins and living for righteousness as two distinct, related outcomes.
retained_terms:
- term: bore our sins
  reason: This preserves the POB's source-driven sin-bearing language and its Isaianic and sacrificial resonance without imposing a narrower technical explanation.
- term: tree
  reason: The Greek uses ξύλον, and the POB intentionally retains “tree” to preserve the likely echo of Deuteronomy 21:23; “cross” remains in a footnote.
- term: righteousness
  reason: This is the project's established rendering of δικαιοσύνη and preserves the major biblical concept while “for” makes the phrase natural in English.
- term: wound
  reason: This clear modern term preserves the singular collective image and the echo of Isaiah 53:5.
translation_notes:
  source_alignment_notes: 'The draft preserves every controlling POB decision: emphatic “he himself,” Christ''s bearing of sins in his body, “tree” rather than replacing it with “cross,” the death-to-sins image, life directed toward righteousness, the singular wound, and broad unqualified healing language.'
  readability_notes:
  - Divided the long POB sentence after “tree” to reduce clause density.
  - Changed the participial phrase “having died to sins” into the finite expression “we might die to sins.”
  - Changed the awkward “live to righteousness” to the more natural “live for righteousness.”
  - Added “He did this” to make the purpose relationship immediately clear without adding a new event or doctrine.
  risk_flags:
  - risk: Modern readers may initially understand “tree” as something other than the cross.
    mitigation: Footnote [a] states the alternative “cross” and explains why “tree” remains in the main text.
  - risk: Readers may restrict “you were healed” to physical healing or, conversely, to spiritual healing alone.
    mitigation: Footnote [b] preserves the POB's theological tension by connecting healing with the immediate context without limiting its scope.
  - risk: “Die to sins” is figurative language and may be less immediately transparent than a paraphrase such as “break away from sins.”
    mitigation: The image was retained because the POB lexical decision treats it as important; the surrounding purpose statement makes its ethical direction clear.
