translation:
  language: en
  text: For the Lord’s sake, submit to every institution of human government, whether to a king as the highest authority,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “as supreme.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Submit yourselves to every human institution
  simplified_phrase: submit to every institution of human government
  preserved_meaning: Believers are commanded to place themselves under each civic institution, not under every individual human being or every kind of human organization.
  reasoning_layer_used: POB lexical decisions for Ὑποτάγητε and κτίσει; POB theological decision on the nature of civil authority; immediate context of kings and governors
  rationale: “Submit to” is natural modern English without the unnecessary reflexive “yourselves.” “Of human government” makes the civic meaning of “institution” clear on first reading.
- pob_phrase: for the Lord’s sake
  simplified_phrase: For the Lord’s sake
  preserved_meaning: Submission to civic institutions is motivated by the believer’s relationship to the Lord.
  reasoning_layer_used: POB lexical decision for διὰ τὸν κύριον and theological decision to leave κύριον as “Lord”
  rationale: Moving the phrase to the beginning makes the reason for the command immediately clear. “Lord” remains unspecified, as in the source and POB.
- pob_phrase: whether to a king as one in authority
  simplified_phrase: whether to a king as the highest authority
  preserved_meaning: A king is the first example in the continuing whether-or construction and is presented as holding the higher civil position in relation to the governors mentioned next.
  reasoning_layer_used: POB lexical decisions for εἴτε, βασιλεῖ, and ὡς ὑπερέχοντι; POB footnote “as supreme”; immediate king-and-governors sequence
  rationale: “The highest authority” preserves the hierarchical force of ὑπερέχοντι that “who holds authority” weakened, while the governmental context keeps the claim within the sphere of civil authority. “King” and “whether” are retained so the wording remains generic and continues naturally into verse 14.
interpretive_expansions:
- pob_phrase: every human institution
  rendering: every institution of human government
  claim: The institutions in view are civic or governmental institutions.
  evidence:
  - The POB lexical rationale for κτίσει identifies a humanly ordered civic structure or institution.
  - The following examples are a king and governors.
  - The POB theological decision explicitly identifies the subject as civic structures.
  confidence: high
  alternatives_preserved:
  - The wording does not claim that these institutions exist independently of God’s sovereignty.
  - It does not render the phrase as every individual human creature.
- pob_phrase: as one in authority
  rendering: as the highest authority
  claim: Within the civil hierarchy described here, the king occupies the position above the governors mentioned in the continuation.
  evidence:
  - The POB lexical alternatives for ὡς ὑπερέχοντι include “as supreme” and “as the one who is above others.”
  - The POB footnote preserves “as supreme.”
  - The following verse distinguishes governors from the king and describes them as sent by him.
  confidence: high
  alternatives_preserved:
  - The footnote preserves the concise alternative “as supreme.”
  - The wording does not claim that the king possesses unlimited authority in every sphere.
retained_terms:
- term: Lord
  reason: This is the POB’s stable rendering of κύριος. The source does not specify “Jesus” or “God,” so the title remains open rather than being expanded.
- term: king
  reason: The POB retains the broad lexical sense of βασιλεύς rather than narrowing it historically to “emperor.”
translation_notes:
  source_alignment_notes: The revision preserves the command, its Lord-centered motive, the distributive force of “every,” the civic sense of κτίσει, the generic title “king,” and the open whether-or construction continuing into verse 14. It restores the higher-ranking force of ὡς ὑπερέχοντι without presenting civil authority as unlimited.
  readability_notes:
  - The motive is placed first so readers immediately understand why the command is given.
  - “Of human government” identifies the kind of institution meant on first reading.
  - “As the highest authority” clearly expresses the king’s higher place in the civil hierarchy.
  compression_notes:
  - The reflexive “yourselves” is omitted because modern English “submit to” carries the same force in this command.
  - The lexical alternatives “human creation” and “ordinance of man” are omitted because they would not help most readers understand the contextual civic meaning.
  risk_flags:
  - risk: “Of human government” states the civic domain more explicitly than the POB main text.
    mitigation: The clarification is directly supported by the POB footnote, lexical rationale, theological decision, and the immediate references to a king and governors.
  - risk: “The highest authority” may sound absolute if read outside its context.
    mitigation: The phrase appears within “institutions of human government,” limiting the ranking to the civil sphere; the source and following contrast with governors support this hierarchical wording.
