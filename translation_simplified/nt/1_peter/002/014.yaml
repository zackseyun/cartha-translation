translation:
  language: en
  text: or to governors, who are sent through him[a] to punish those who do evil and praise those who do good.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “sent by him.” “Him” most naturally refers to the king or emperor mentioned in the previous verse. Some understand this more broadly as referring to God’s ordering of authority.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: as those sent through him
  simplified_phrase: who are sent through him
  preserved_meaning: Governors act as delegated authorities sent through the king or emperor mentioned in the previous verse.
  reasoning_layer_used: POB lexical and theological decisions on ὡς, δι’ αὐτοῦ, and πεμπομένοις
  rationale: Recasts the compressed participial wording as a natural relative clause while retaining “through him,” the controlling POB rendering and referent decision.
- pob_phrase: for the punishment of evildoers
  simplified_phrase: to punish those who do evil
  preserved_meaning: Governors are sent to impose punishment on people who do evil.
  reasoning_layer_used: POB lexical decisions on εἰς ἐκδίκησιν and κακοποιῶν
  rationale: Changes abstract nouns and the compact term “evildoers” into a direct verb phrase that is easier for a common reader to understand.
- pob_phrase: and the praise of those who do good
  simplified_phrase: and praise those who do good
  preserved_meaning: Governors are also sent to commend people whose conduct is good.
  reasoning_layer_used: POB lexical decisions on ἔπαινον and ἀγαθοποιῶν
  rationale: Turns the abstract expression “the praise of” into the direct verb “praise” while preserving the parallel contrast between punishing evil and praising good.
- pob_phrase: or to governors
  simplified_phrase: or to governors
  preserved_meaning: The verse continues the either-or structure begun in the previous verse.
  reasoning_layer_used: POB lexical decision on εἴτε and immediate context of verse 13
  rationale: Retained because the fragment must remain connected to the command and first alternative in the preceding verse.
retained_terms:
- term: governors
  reason: This is the POB’s specific civic rendering of ἡγεμόσιν without over-specifying Roman administrative offices.
- term: through him
  reason: Retains the POB’s source-driven rendering of δι’ αὐτοῦ and its chosen connection to the king or emperor in the previous verse; the footnote preserves the alternate understanding.
translation_notes:
  source_alignment_notes: 'The draft preserves the continuing “or” structure, the delegated role of governors, the POB’s chosen wording “through him,” and the two distinct governmental purposes: punishing those who do evil and praising those who do good. The documented uncertainty about the referent and force of δι’ αὐτοῦ remains in the footnote.'
  readability_notes:
  - 'Converted two abstract purpose phrases into coordinated active verbs: “to punish” and “praise.”'
  - Replaced “evildoers” with the immediately understandable phrase “those who do evil.”
  - Changed “as those sent” to the more natural English clause “who are sent.”
  risk_flags:
  - risk: The pronoun “him” has no explicit antecedent within this verse because the verse continues the sentence from verse 13.
    mitigation: The footnote identifies the king or emperor in the previous verse as the most natural referent and preserves the broader interpretation involving God.
  - risk: The phrase “through him” is less idiomatic in modern English than “by him.”
    mitigation: It is retained to honor the controlling POB lexical decision; the more natural alternative is supplied in the footnote.
