translation:
  language: en
  text: Once you were not a people,[a] but now you are God’s people. Once you had not received mercy, but now you have received mercy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Peter echoes Hosea 1:9–10 and 2:23, using Israel’s restoration language for his readers’ new identity as part of God’s people.
    reason: cross_reference
simplification_decisions:
- pob_phrase: you who once were not a people, but now are God's people
  simplified_phrase: Once you were not a people, but now you are God’s people.
  preserved_meaning: The readers formerly lacked a shared identity as a people but now belong corporately to God as his people.
  reasoning_layer_used: POB lexical decisions for οἵ, ποτε, λαός, θεοῦ, δέ, and νῦν; theological decision on Hosea and covenant identity
  rationale: The relative construction “you who” depends on the previous verse and is less natural when this verse is read alone. Recasting it as a complete sentence directly addresses the same audience. The wording still preserves the important distinction between “not a people” and “God’s people” rather than changing the first clause to “not God’s people.”
- pob_phrase: you who had not received mercy, but now have received mercy
  simplified_phrase: Once you had not received mercy, but now you have received mercy.
  preserved_meaning: Their former state of not having received mercy is contrasted with their present standing as recipients of mercy.
  reasoning_layer_used: POB lexical decisions for οὐκ ἠλεημένοι, ἐλεηθέντες, δέ, and νῦν
  rationale: A second complete sentence makes the parallel reversal easier to follow. Adding “Once” carries forward the explicit former-versus-now contrast from the first half without changing the meaning. “Received mercy” retains the POB’s chosen natural-English rendering and its emphasis on mercy given to them.
retained_terms:
- term: mercy
  reason: This is a central biblical concept and directly reflects the POB’s lexical choice; replacing it with a broader phrase such as “kindness” would weaken the meaning.
- term: a people / God’s people
  reason: These expressions preserve the corporate covenant-identity language and the deliberate distinction between the two clauses.
translation_notes:
  source_alignment_notes: 'The draft preserves both parallel reversals: once/not a people versus now/God’s people, and formerly not receiving mercy versus now receiving mercy. It does not narrow the verse to an ethnic or denominational claim, and it retains the POB’s source-driven distinction between “not a people” and “God’s people.”'
  readability_notes:
  - The two parallel contrasts are presented as two short, complete sentences.
  - The audience remains directly addressed as “you.”
  - The repeated “Once … but now” structure makes the former and present states immediately clear.
  compression_notes:
  - The lexical-alternative footnote about “shown mercy” was omitted because “received mercy” is already clear and the alternative does not materially aid a common reader.
  - The Hosea footnote was retained because it explains the important covenant-restoration background without burdening the main text.
  risk_flags:
  - risk: Repeating “Once” in the second sentence is more explicit than the POB’s second clause, where the former state is conveyed without repeating ποτε.
    mitigation: The repetition only clarifies the parallel temporal contrast already established by the Greek structure and POB wording; it adds no new historical or theological claim.
  - risk: Turning the dependent “you who” clauses into independent sentences may make the connection to the previous verse less visible.
    mitigation: Direct second-person address is preserved, while the verse becomes publication-readable on its own. No change is made to the audience or claims.
