translation:
  language: en
  text: When he was insulted, he did not answer with insults. When he suffered, he made no threats. Instead, he continued to entrust himself to the one who judges justly.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: who, when he was insulted, did not insult in return
  simplified_phrase: When he was insulted, he did not answer with insults.
  preserved_meaning: Christ did not retaliate verbally when others verbally abused him.
  reasoning_layer_used: POB lexical decisions for λοιδορούμενος and ἀντελοιδόρει
  rationale: The relative clause was recast as a direct sentence, and “answer with insults” states the reciprocal verbal response in ordinary English while preserving the force of “in return.”
- pob_phrase: when he suffered, he did not threaten
  simplified_phrase: When he suffered, he made no threats.
  preserved_meaning: Christ did not respond to suffering by uttering threats.
  reasoning_layer_used: POB lexical decisions for πάσχων and ἠπείλει
  rationale: “Made no threats” is concise, natural English and retains the distinct response described in this clause rather than merging it with the preceding refusal to insult.
- pob_phrase: but kept entrusting himself
  simplified_phrase: Instead, he continued to entrust himself
  preserved_meaning: During his suffering, Christ repeatedly or continually committed himself rather than retaliating.
  reasoning_layer_used: POB lexical decisions for δὲ and παρεδίδου
  rationale: “Instead” clearly marks the contrast, while “continued to” preserves the imperfective, ongoing force represented by POB’s “kept.”
- pob_phrase: to the one who judges justly
  simplified_phrase: to the one who judges justly
  preserved_meaning: Christ entrusted himself to the just judgment of the implied divine referent without the translation specifying a title or person more narrowly than the text does.
  reasoning_layer_used: POB lexical decision for τῷ κρίνοντι δικαίως and theological decision on its referent
  rationale: This wording is already clear common English and preserves the deliberately descriptive reference and its theological restraint.
retained_terms:
- term: entrust himself
  reason: This preserves the important idea of Christ committing himself to another’s care and judgment; a looser phrase such as “trusted” could omit the reflexive force retained by POB.
translation_notes:
  source_alignment_notes: 'The draft preserves all three responses in the Greek: no retaliatory insult, no threat during suffering, and continued self-entrustment to the one characterized by just judgment. It does not explicitly identify that judge as God the Father, in keeping with POB’s theological decision to retain the descriptive wording.'
  readability_notes:
  - The long coordinated sentence was divided into three short sentences.
  - “Did not answer with insults” makes reciprocal verbal non-retaliation immediately clear.
  - “Instead” makes the contrast between retaliation and self-entrustment easy to follow.
  risk_flags:
  - risk: Changing “insult in return” to “answer with insults” could be read as describing only an immediate verbal reply.
    mitigation: The wording still clearly conveys reciprocal verbal retaliation, which is the controlling lexical sense documented by POB.
  - risk: “Continued to entrust” may sound slightly formal to some readers.
    mitigation: The term is retained because simpler substitutes such as “trusted” risk losing the source-driven sense of committing himself to another during ongoing suffering.
