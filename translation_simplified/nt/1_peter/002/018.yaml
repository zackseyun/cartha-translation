translation:
  language: en
  text: Household servants,[a] submit to your masters with complete respect. Submit not only to those who are good and gentle, but also to those who are crooked.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “household slaves.” The Greek term refers specifically to servants or slaves who belonged to a household.
    reason: lexical_alternative
  - marker: b
    text: “Crooked” means morally twisted, harsh, or unjust.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Household servants, submitting yourselves to your masters
  simplified_phrase: Household servants, submit to your masters
  preserved_meaning: The domestic dependents are directly commanded to place themselves under their masters’ authority.
  reasoning_layer_used: POB lexical decisions for οἰκέται, ὑποτασσόμενοι, and δεσπόταις; applied-revision record
  rationale: The imperatival participle is expressed as a direct command in natural modern English. “Household servants” and “masters” remain because they preserve the specific domestic social relationship identified by POB.
- pob_phrase: with all respect
  simplified_phrase: with complete respect
  preserved_meaning: Their submission is to be marked by full respectful deference, not necessarily by terror.
  reasoning_layer_used: POB lexical and theological decisions for ἐν παντὶ φόβῳ
  rationale: “Complete respect” makes the force of “all” immediately clear while preserving POB’s contextual choice of respect rather than emotional fear.
- pob_phrase: not only to the good and gentle but also to the crooked
  simplified_phrase: Submit not only to those who are good and gentle, but also to those who are crooked.
  preserved_meaning: The command applies to morally good and humane masters as well as to masters who are morally twisted, harsh, or unjust.
  reasoning_layer_used: POB lexical decisions for ἀγαθοῖς, ἐπιεικέσιν, and σκολιοῖς
  rationale: The contrast is made into a second sentence and the command is repeated so readers can follow it easily. The source-language image “crooked” is retained and explained in a footnote rather than narrowed to only “harsh” or “unjust.”
retained_terms:
- term: household servants
  reason: Retains POB’s careful rendering of the specific domestic dependent class without reducing it to generic servants or presenting “slaves” as the only possible English equivalent.
- term: masters
  reason: Accurately preserves the authority relationship denoted by δεσπόταις and avoids confusion with divine titles.
- term: crooked
  reason: Preserves the source-language metaphor of moral crookedness or twistedness; the footnote supplies clearer contextual equivalents.
translation_notes:
  source_alignment_notes: 'The draft preserves every controlling POB lexical choice: the domestic scope of “household servants,” the command to submit, respectful deference rather than terror, the authority term “masters,” and the contrast between good and gentle masters and crooked ones. The documented breadth of “crooked” is preserved through a footnote.'
  readability_notes:
  - Changed the participial wording into a direct modern-English command.
  - Split the dense exhortation into two sentences.
  - Repeated “submit” in the second sentence so the contrast is immediately clear.
  - Used “those who are” to identify the two kinds of masters naturally.
  compression_notes:
  - The literal alternative “in all fear” is not included because POB concludes that “respect” best communicates the contextual sense; no important ambiguity is lost for the common reader.
  - The detailed distinction between οἰκέτης and the broader δοῦλος is compressed into the footnote’s explanation of household servants or slaves.
  risk_flags:
  - risk: “Household servants” may sound like freely employed domestic workers and therefore soften the historical dependency or enslavement involved.
    mitigation: Footnote [a] preserves “household slaves” as a valid alternative and states that the people addressed were servants or slaves belonging to a household.
  - risk: Modern readers may understand “crooked” only as financially dishonest.
    mitigation: Footnote [b] explains its broader moral sense as twisted, harsh, or unjust.
  - risk: The command could be read as approving abusive masters or the institution itself.
    mitigation: The translation does not add such approval; it retains the verse’s command and its explicit negative description of certain masters without doctrinal smoothing or commentary.
