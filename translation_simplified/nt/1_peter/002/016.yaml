translation:
  language: en
  text: Live as free people, but do not use your freedom to cover up evil. Instead, live as servants of God.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word can also mean “servants.” “Slaves” preserves the strong contrast with “free people” and emphasizes that they belong completely to God.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: as free people
  simplified_phrase: Live as free people
  preserved_meaning: Believers are to conduct themselves as people who are free.
  reasoning_layer_used: Source syntax, immediate context, and the POB choice of “free people” for ἐλεύθεροι
  rationale: The isolated phrase “as free people” is incomplete in ordinary English. Adding “Live” makes the implied conduct explicit and produces a clear sentence without changing the kind of freedom described.
- pob_phrase: and not using freedom as a cover for evil
  simplified_phrase: but do not use your freedom to cover up evil
  preserved_meaning: Freedom must not be used to conceal morally wrong behavior.
  reasoning_layer_used: POB lexical decisions for ἐπικάλυμμα, ἔχοντες … τὴν ἐλευθερίαν, and κακίας
  rationale: “Cover up” is common modern English that retains the source image of concealing wrongdoing. “Your freedom” makes the relationship to the addressed readers natural and clear.
- pob_phrase: but as slaves of God
  simplified_phrase: Instead, live as slaves of God
  preserved_meaning: Though free, believers belong wholly to God and must live under his authority.
  reasoning_layer_used: POB lexical and theological decisions for δοῦλοι and θεοῦ δοῦλοι
  rationale: “Instead” clearly marks the contrast, while the repeated verb “live” completes the clause in natural English. “Slaves” is retained because the strong paradox between freedom and total belonging to God is central to the verse.
interpretive_expansions:
- pob_phrase: as free people … but as slaves of God
  rendering: Live as free people … Instead, live as slaves of God
  claim: The phrases describe how the readers are to live.
  evidence:
  - The Greek uses ὡς (“as”) phrases to characterize the readers’ conduct.
  - The immediate context of 1 Peter 2:15–17 concerns doing good and commands how believers should conduct themselves.
  - The POB rendering is an elliptical continuation that requires an implied governing idea in standalone English.
  confidence: high
  alternatives_preserved:
  - as free people … but as slaves of God
retained_terms:
- term: slaves of God
  reason: The POB audit requires the stronger term because it preserves the deliberate contrast between being free and belonging completely to God; the footnote records “servants” as a lexical alternative.
translation_notes:
  source_alignment_notes: 'The draft preserves all three source movements: living as free people, refusing to make freedom a concealment for evil, and living as those wholly belonging to God. It retains both the covering image and the freedom/slavery paradox.'
  readability_notes:
  - The elliptical POB wording is recast as two direct sentences.
  - “Cover up evil” uses familiar language while preserving the concrete concealment metaphor.
  - Repeating “live” prevents the final contrast from sounding like a fragment.
  risk_flags:
  - risk: Adding “Live” makes the implied governing idea explicit rather than reproducing the Greek clause structure.
    mitigation: The immediate context concerns conduct, and the expansion is recorded with high-confidence contextual and syntactic evidence.
  - risk: The word “slaves” may carry modern associations not identical to the ancient setting.
    mitigation: The main text retains it because POB identifies total belonging and the contrast with freedom as essential; the footnote gives “servants” as an alternate lexical sense without weakening the main rendering.
