translation:
  language: en
  text: You are coming to him—the living stone. People rejected him, but God chose him and considers him precious.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: As you come to him, a living stone
  simplified_phrase: You are coming to him—the living stone.
  preserved_meaning: The readers continue to come to the person described by the central metaphor of the living stone.
  reasoning_layer_used: POB lexical decisions for Πρὸς ὃν, προσερχόμενοι, λίθον, and ζῶντα; POB theological decision identifying the stone as the Lord Jesus/Messiah while retaining the pronoun
  rationale: A direct sentence and an em dash make the apposition clear without the previous draft’s repetitive “come...coming” construction. The present progressive preserves the ongoing action, and the living-stone image remains intact.
- pob_phrase: rejected by men but chosen and precious in the sight of God
  simplified_phrase: People rejected him, but God chose him and considers him precious.
  preserved_meaning: Human rejection is contrasted with God’s choice and high valuation of him.
  reasoning_layer_used: POB lexical decisions for ὑπὸ ἀνθρώπων, ἀποδεδοκιμασμένον, παρὰ δὲ θεῷ, ἐκλεκτὸν, and ἔντιμον; POB footnote explaining the inclusive reference of “men”
  rationale: Short active clauses identify the agents clearly. “People” directly communicates the POB footnote’s explanation that human beings generally are in view, avoiding a likely male-only reading. “Considers him precious” preserves both God’s evaluative perspective and the stone imagery.
interpretive_expansions:
- pob_phrase: him, a living stone
  rendering: him—the living stone
  claim: “The living stone” directly describes the person referred to as “him.”
  evidence:
  - The Greek places λίθον ζῶντα (“a living stone”) in apposition to the relative pronoun’s referent.
  - The POB theological decision identifies the stone imagery as describing the Lord Jesus/Messiah in the immediate context of 1 Peter 2:3–8.
  confidence: high
  alternatives_preserved:
  - The main text retains the pronoun “him” rather than inserting “Jesus” or “Christ.”
- pob_phrase: by men
  rendering: People rejected him
  claim: The rejection comes from human beings generally, not only from males.
  evidence:
  - The POB footnote explicitly explains “men” as “human beings or people.”
  - The POB lexical rationale states that the phrase contrasts human evaluation with God’s evaluation and does not claim that only males are in view.
  confidence: high
  alternatives_preserved:
  - The grammatically masculine form of the Greek is documented in the POB audit trail, though not represented by the potentially ambiguous English word “men.”
retained_terms:
- term: living stone
  reason: This paradoxical building-stone image is central to the verse and the surrounding context, so it must not be flattened into an abstract description.
- term: precious
  reason: This preserves both God’s high valuation of him and the stone imagery supported by the POB lexical decision.
translation_notes:
  source_alignment_notes: The revision preserves the ongoing movement toward “him,” directly identifies him through the living-stone apposition without inserting his name, and keeps the contrast between human rejection and God’s choice and valuation. “People” follows the inclusive meaning already documented in the POB footnote, while the active clauses retain the source agents and actions.
  readability_notes:
  - The repetitive “As you come...you are coming” wording has been replaced with one natural present-progressive clause.
  - The em dash makes clear on first reading that “the living stone” describes “him.”
  - The participial contrast has been recast as two short active clauses.
  - Using “people” removes the need for a footnote explaining that “men” is generic.
  compression_notes:
  - The POB footnote about the inclusive meaning of “men” is incorporated directly into the main text through “people.”
  - The alternate forms “to whom, coming” and “as you are coming to him” are omitted because they do not materially help a common reader and the ongoing sense remains in “are coming.”
  risk_flags:
  - risk: The definite wording “the living stone” is more explicit than the POB’s appositional “a living stone.”
    mitigation: The wording identifies the metaphorical role of the already specified person without adding a new referent; the immediate context and POB theological reasoning identify him as the living stone.
  - risk: Using “people” does not reproduce the Greek phrase’s grammatically masculine form or the POB main-text wording “men.”
    mitigation: The POB itself states that the reference includes human beings or people generally. The revision communicates that intended scope directly and avoids a misleading male-only interpretation.
  - risk: Active clauses are less formally parallel to the Greek passive participles.
    mitigation: 'The same agents, actions, and contrast are retained: people reject him, while God chooses and values him.'
