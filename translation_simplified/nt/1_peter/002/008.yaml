translation:
  language: en
  text: and, “a stone that makes people stumble and a rock that makes them fall.” They stumble because they disobey the word, and they were also appointed to this.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: a stone of stumbling
  simplified_phrase: a stone that makes people stumble
  preserved_meaning: The stone remains the cause or occasion of stumbling.
  reasoning_layer_used: POB translation and source image
  rationale: The abstract phrase “of stumbling” was recast as a direct verbal clause while preserving the stone-and-stumbling image.
- pob_phrase: a rock of offense
  simplified_phrase: a rock that makes them fall
  preserved_meaning: The rock remains an obstacle that brings about a fall.
  reasoning_layer_used: POB translation and parallel source imagery
  rationale: Modern readers may understand “offense” mainly as hurt feelings. Rendering the image as causing a fall clarifies its force and preserves its parallel with stumbling.
- pob_phrase: They stumble because they disobey the word
  simplified_phrase: They stumble because they disobey the word
  preserved_meaning: Their stumbling is connected directly to their disobedience to the word.
  reasoning_layer_used: POB controlling text
  rationale: The POB wording is already direct and clear, so it was retained.
- pob_phrase: and to this they were also appointed
  simplified_phrase: and they were also appointed to this
  preserved_meaning: The appointment remains directed toward the preceding outcome without specifying the antecedent more narrowly than the POB does.
  reasoning_layer_used: Applied doctrine-realignment revision preserving “to this”
  rationale: The clause was reordered into more natural English, but the deliberately nonspecific expression “this” was retained.
interpretive_expansions:
- pob_phrase: a stone of stumbling and a rock of offense
  rendering: a stone that makes people stumble and a rock that makes them fall
  claim: The stone and rock are pictured as obstacles over which people stumble and fall, not as objects that merely cause emotional offense.
  evidence:
  - 'The POB preserves two physical images: “stone” and “rock.”'
  - The first image explicitly names stumbling, which guides the parallel sense of the second image.
  - 'The following sentence repeats the action: “They stumble.”'
  confidence: high
  alternatives_preserved:
  - The main text does not identify more precisely what “this” in the appointment clause refers to.
  - The broader figurative significance of the stumbling and falling is not expanded beyond the verse.
retained_terms:
- term: the word
  reason: This is a major biblical term retained from the controlling POB text; replacing it with a narrower expression such as “message” could over-specify its sense.
- term: appointed
  reason: The term preserves the theological force of the POB clause and its source-driven decision without explaining away the difficult statement.
translation_notes:
  source_alignment_notes: The draft preserves both parallel stone images, the causal link between disobedience and stumbling, and the adjudicated POB wording “to this.” It does not resolve what precisely the appointment concerns.
  readability_notes:
  - Converted abstract noun phrases into direct clauses.
  - Used “fall” to prevent the modern emotional sense of “offense” from obscuring the physical stumbling image.
  - Reordered the final clause into ordinary modern English.
  risk_flags:
  - risk: “Makes them fall” could be read as stronger or more mechanically causal than the traditional phrase “rock of offense.”
    mitigation: The rendering is anchored by the parallel stumbling image and the next sentence, while retaining the distinct rock-and-fall picture.
  - risk: The antecedent of “this” is difficult and potentially theologically disputed.
    mitigation: The draft preserves the POB’s intentionally nonspecific “this” and adds no explanatory resolution.
