translation:
  language: en
  text: 'For Scripture says: “Look, I lay in Zion a chosen and honored cornerstone, and whoever believes in him will certainly not be put to shame.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: For it stands in Scripture
  simplified_phrase: For Scripture says
  preserved_meaning: The following quotation comes from Scripture and supports Peter’s preceding statement.
  reasoning_layer_used: POB lexical decision for περιέχει ἐν γραφῇ and applied revision history
  rationale: “Scripture says” is a documented alternative that expresses the introductory Greek idiom directly and naturally.
- pob_phrase: Behold
  simplified_phrase: Look
  preserved_meaning: The quotation begins with a command calling attention to God’s declaration.
  reasoning_layer_used: POB lexical decision for Ἰδοὺ
  rationale: “Look” preserves the command to pay attention in familiar modern English.
- pob_phrase: I lay in Zion
  simplified_phrase: I lay in Zion
  preserved_meaning: God declares that he places the cornerstone in Zion as part of the building image.
  reasoning_layer_used: POB lexical decisions for τίθημι and ἐν Σιὼν; independent grounding review
  rationale: The simple present preserves the source and POB wording without adding the progressive sense that the action is specifically ongoing.
- pob_phrase: a chosen and honored cornerstone
  simplified_phrase: a chosen and honored cornerstone
  preserved_meaning: The cornerstone is distinctly described as both chosen and honored.
  reasoning_layer_used: POB lexical and theological decisions for λίθον ἀκρογωνιαῖον, ἐκλεκτόν, and ἔντιμον
  rationale: This clear wording preserves the building image, both descriptors, and their attachment to the cornerstone.
- pob_phrase: the one who believes in him
  simplified_phrase: whoever believes in him
  preserved_meaning: The promise applies to anyone who believes in the person represented by the cornerstone.
  reasoning_layer_used: POB lexical decision for ὁ πιστεύων ἐπ’ αὐτῷ and theological decision on the personal referent
  rationale: “Whoever” is more natural common English, while “him” preserves Peter’s personal application of the stone passage to Christ.
- pob_phrase: will certainly not be put to shame
  simplified_phrase: will certainly not be put to shame
  preserved_meaning: The believer receives an emphatic assurance that he or she will not be shamed.
  reasoning_layer_used: POB lexical decision for οὐ μὴ καταισχυνθῇ
  rationale: The POB wording is understandable and preserves both the shame language and the strongly emphatic negative.
retained_terms:
- term: Zion
  reason: This biblical place-name is part of the prophetic quotation and should remain stable.
- term: cornerstone
  reason: This clear, standard term preserves the source’s central building image and Peter’s application of it.
translation_notes:
  source_alignment_notes: The corrected draft follows every controlling POB decision. It introduces the quotation as scriptural support, retains the attention command, uses the simple present “I lay,” locates the chosen and honored cornerstone in Zion, preserves the personal pronoun “him,” and conveys the emphatic assurance that believers will not be put to shame.
  readability_notes:
  - Replaced the impersonal expression “it stands in Scripture” with the direct, documented alternative “Scripture says.”
  - Used “Look” instead of the less familiar “Behold.”
  - Used “whoever” instead of “the one who.”
  - Kept the quotation as one manageable sentence because the clauses are direct and closely connected.
  compression_notes:
  - No central image, descriptor, personal referent, or emphatic force was removed.
  - No footnote was retained because none of the documented alternatives is needed for first-read understanding.
  risk_flags:
  - risk: “Look” is less elevated than “Behold.”
    mitigation: It retains the direct command to pay attention in language readily understood by modern readers.
  - risk: The stone metaphor may lead some readers to expect the pronoun “it.”
    mitigation: The personal pronoun “him” is deliberately retained according to the POB theological decision and Peter’s christological application in 1 Peter 2:4–8.
