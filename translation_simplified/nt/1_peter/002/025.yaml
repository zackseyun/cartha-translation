translation:
  language: en
  text: For you were like sheep that were wandering away.[a] But now you have come back[b] to the Shepherd and Overseer[c] of your souls.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may also mean “being led astray.”
    reason: lexical_alternative
  - marker: b
    text: The Greek may also be understood as “you were brought back.”
    reason: alternative_reading
  - marker: c
    text: Or “Guardian”; traditionally, “Bishop.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: like sheep going astray
  simplified_phrase: like sheep that were wandering away
  preserved_meaning: The readers’ former condition is compared to sheep straying from where they belong, without specifying what caused them to stray.
  reasoning_layer_used: POB lexical decision for πλανώμενοι and its Isaianic pastoral background
  rationale: The relative clause is easier to process than the participial wording, and “wandering away” preserves the sheep image and the documented uncertainty about agency.
- pob_phrase: but now you have returned
  simplified_phrase: But now you have come back
  preserved_meaning: A completed change has taken place and remains relevant in the present, while the Greek voice does not require the translation to specify whether they returned or were brought back.
  reasoning_layer_used: POB lexical and theological decisions for ἀλλὰ ἐπεστράφητε νῦν
  rationale: “Come back” is common modern English for “returned.” The footnote preserves the possible passive nuance rather than resolving the tension between divine action and human response.
- pob_phrase: the Shepherd and Overseer of your souls
  simplified_phrase: the Shepherd and Overseer of your souls
  preserved_meaning: Christ is identified by two distinct titles as the one who shepherds and watches over their souls.
  reasoning_layer_used: POB lexical and theological decisions for ποιμένα, ἐπίσκοπον, and ψυχῶν
  rationale: These terms are retained because replacing or merging them would obscure the two Christological titles or weaken the spiritual-care meaning of “souls.” The footnote clarifies the lexical alternatives for “Overseer.”
retained_terms:
- term: Shepherd
  reason: Retained as a Christological title and to preserve the verse’s central pastoral image.
- term: Overseer
  reason: Retained as the transparent modern title chosen by POB; it avoids the later church-office associations of “Bishop.”
- term: souls
  reason: Retained to preserve the POB lexical choice and the context of Christ’s spiritual care without reducing ψυχή merely to physical life.
translation_notes:
  source_alignment_notes: The draft preserves the causal link introduced by “For,” the comparison with wandering sheep, the strong contrast marked by “But now,” the completed return with present relevance, both titles applied to Christ, and the object of his care, “your souls.” Footnotes retain the documented lexical and voice ambiguities.
  readability_notes:
  - Changed the participial phrase “sheep going astray” into the more immediately understandable relative clause “sheep that were wandering away.”
  - Replaced “returned” with the common expression “come back.”
  - Kept the verse in two short sentences to make the former-state/present-state contrast clear.
  risk_flags:
  - risk: “Come back” could sound as though the readers acted without divine agency.
    mitigation: Footnote [b] explicitly preserves the possible passive meaning, “you were brought back.”
  - risk: “Overseer” may be understood only as an institutional office.
    mitigation: Capitalization and coordination with “Shepherd” identify it as a title for Christ, while footnote [c] records the principal lexical alternatives.
