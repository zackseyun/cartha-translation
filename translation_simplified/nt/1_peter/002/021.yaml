simplification_decisions:
- pob_phrase: For you were called to this
  simplified_phrase: You were called to endure suffering like this
  preserved_meaning: The readers' calling includes enduring the kind of unjust suffering described in the preceding context.
  reasoning_layer_used: POB lexical decision for εἰς τοῦτο and immediate context
  rationale: The POB wording depends on the preceding verse to explain “this.” Naming suffering directly makes the reference clear, while “like this” keeps it tied to the specific situation already described.
- pob_phrase: because Messiah also suffered for you
  simplified_phrase: because Messiah also suffered for you
  preserved_meaning: Messiah's suffering is presented as the ground for the readers' calling, while “for you” retains its benefactive and possible representative breadth.
  reasoning_layer_used: POB lexical and theological decisions for ὅτι, Χριστός, ἔπαθεν, and ὑπὲρ ὑμῶν
  rationale: The explicit word “because” is retained to preserve the source's clear causal relationship. “For you” remains unchanged so the text does not narrow the phrase to mere benefit or force an explicit substitutionary formula.
- pob_phrase: leaving you an example so that you might follow in his steps
  simplified_phrase: He left you an example, so that you might follow in his footsteps
  preserved_meaning: Messiah provided a model of suffering that his people are intended to follow.
  reasoning_layer_used: POB lexical decisions for ὑμῖν ὑπολιμπάνων, ὑπογραμμόν, ἵνα, ἐπακολουθήσητε, and τοῖς ἴχνεσιν αὐτοῦ
  rationale: The participial phrase is recast as a new sentence with an ordinary finite verb. “Footsteps” preserves the source image in familiar English, and the footnote retains the concrete picture of learners tracing a model.
interpretive_expansions:
- pob_phrase: called to this
  rendering: called to endure suffering like this
  claim: “This” points back to enduring unjust suffering in the preceding context.
  evidence:
  - The POB lexical rationale explicitly says εἰς τοῦτο points back to the preceding call to endure unjust suffering.
  - Messiah's suffering and example in the rest of the verse confirm that suffering is the immediate subject.
  confidence: high
  alternatives_preserved:
  - The wording “like this” retains the backward reference and does not claim that every form or circumstance of suffering is identical.
retained_terms:
- term: Messiah
  reason: Retained as the POB's source-driven rendering of Χριστός functioning as a title.
translation_notes:
  source_alignment_notes: 'The draft preserves the sequence and logic of the source: the readers were called to endure unjust suffering because Messiah suffered for them, leaving a model for them to follow. It explicitly retains the causal force of ὅτι as “because,” preserves “also” and “for you,” and does not specify the manner of Messiah''s suffering beyond the source.'
  readability_notes:
  - The backward-pointing “this” is clarified from the immediate context.
  - The long sentence is divided after Messiah's suffering while the explicit causal connector remains in the first sentence.
  - The participle “leaving” is recast as the finite clause “He left.”
  - “In his steps” becomes the familiar but still image-rich “in his footsteps.”
  compression_notes:
  - The concrete pedagogical image within “example” is kept in a concise footnote rather than explained in the main text.
  risk_flags:
  - risk: Making “this” explicit could overstate what the isolated verse says.
    mitigation: The expansion follows the POB's lexical rationale and uses “like this” to preserve the reference to the preceding context.
  - risk: “For you” could be interpreted too narrowly as either mere benefit or explicit substitution.
    mitigation: The phrase is retained without a doctrinal gloss, preserving the breadth documented in the POB theological decision.
