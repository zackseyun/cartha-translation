translation:
  language: en
  text: Dear friends, I urge you, as foreigners and exiles in this world,[a] to keep away from sinful desires of the flesh.[b] These desires wage war against the soul.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The words translated “foreigners and exiles” describe people who live somewhere without fully belonging there. Believers do not fully belong to the present world.
    reason: lexical_alternative
  - marker: b
    text: Literally, “fleshly desires.” This means desires arising from fallen human flesh, not merely bodily needs or sexual desire.
    reason: lexical_alternative
  - marker: c
    text: “The soul” may also be understood as “the life” or “the self.” Here it refers to the person’s inner life, without requiring a strict separation of body and soul.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Beloved
  simplified_phrase: Dear friends
  preserved_meaning: Peter warmly addresses the readers as people who are loved.
  reasoning_layer_used: POB lexical decision for Ἀγαπητοί and its listed alternative “Dear friends”
  rationale: “Dear friends” is natural contemporary English and clearly communicates the affectionate address without adding an unnecessary intensifier.
- pob_phrase: as sojourners and exiles
  simplified_phrase: as foreigners and exiles in this world
  preserved_meaning: Believers live as outsiders who do not fully belong to the present world.
  reasoning_layer_used: POB lexical decisions for παροίκους and παρεπιδήμους, together with footnote a
  rationale: “Sojourners” is uncommon in modern English. “Foreigners” is clearer, while “exiles” retains the force of the second term and the pair’s outsider imagery.
- pob_phrase: to abstain from
  simplified_phrase: to keep away from
  preserved_meaning: The readers are earnestly called to continue refusing these desires.
  reasoning_layer_used: POB lexical decision for ἀπέχεσθαι
  rationale: “Keep away from” is common English and conveys continuing restraint without weakening the exhortation.
- pob_phrase: fleshly desires
  simplified_phrase: sinful desires of the flesh
  preserved_meaning: These are morally corrupt desires arising from fallen human flesh.
  reasoning_layer_used: POB lexical and theological decisions for σαρκικῶν ἐπιθυμιῶν
  rationale: “Sinful” prevents readers from mistaking the phrase for all physical desires, while “of the flesh” preserves the source image and its theological tension.
- pob_phrase: which wage war against the soul
  simplified_phrase: These desires wage war against the soul
  preserved_meaning: The desires actively attack the person’s inner life.
  reasoning_layer_used: POB lexical decisions for αἵτινες, στρατεύονται, and ψυχή
  rationale: A separate sentence is easier to follow. Repeating “These desires” gives the sentence an explicit antecedent while preserving the military image and the reference to the soul.
interpretive_expansions:
- pob_phrase: as sojourners and exiles
  rendering: as foreigners and exiles in this world
  claim: The readers’ outsider status concerns their relationship to the present world, not only their civil residence.
  evidence:
  - POB footnote a says the paired terms emphasize that believers do not fully belong to the present age or society.
  - The POB rationale for παρεπιδήμους explicitly preserves the theological sense of not fully belonging to the present world.
  - The immediate exhortation concerns moral conduct appropriate to that outsider identity.
  confidence: high
  alternatives_preserved:
  - The wording still permits the terms’ ordinary social sense of foreigners and exiles.
- pob_phrase: fleshly desires
  rendering: sinful desires of the flesh
  claim: The desires in view are morally corrupt rather than all bodily or human desires.
  evidence:
  - The POB lexical rationale says σαρκικός here points to desires arising from fallen human flesh.
  - The POB footnote explicitly lists “sinful desires” as an interpretive rendering.
  - The following clause describes these desires as waging war against the soul.
  confidence: high
  alternatives_preserved:
  - The phrase “of the flesh” retains the source metaphor rather than replacing it with a complete doctrinal paraphrase.
  - The footnote preserves the more literal wording “fleshly desires.”
retained_terms:
- term: exiles
  reason: Retains the weight of the second outsider term and distinguishes it from “foreigners.”
- term: flesh
  reason: Preserves the source-language image and theological tension while “sinful” clarifies its moral sense here.
- term: wage war
  reason: Preserves the vivid military metaphor for the desires’ active hostility.
- term: soul
  reason: Preserves the POB’s anthropologically weighty rendering of ψυχή without forcing a technical body-soul division.
translation_notes:
  source_alignment_notes: The draft preserves the affectionate address, earnest appeal, paired outsider identity, ongoing moral restraint, flesh imagery, military metaphor, and reference to the soul. Its clarifying language follows the POB’s lexical alternatives, footnotes, and theological reasoning. The revision replaces the awkward “Dearly loved ones” with the POB-listed “Dear friends” and makes the antecedent of the second sentence explicit.
  readability_notes:
  - The dense exhortation is divided into two sentences.
  - “Sojourners” and “abstain” are replaced with common English.
  - The moral sense of “fleshly” is clarified without removing the flesh image.
  - “These desires” clearly identifies what wages war.
  - Footnotes preserve important lexical range without burdening the main text.
  compression_notes:
  - The ongoing force of the Greek infinitive is conveyed naturally by “keep away” rather than explained in the main text.
  - The social and theological implications of the paired outsider terms are summarized by “in this world,” with fuller explanation in footnote a.
  risk_flags:
  - risk: Adding “in this world” could appear to make the outsider language exclusively theological.
    mitigation: The main text retains ordinary social terms, and footnote a explains the underlying image of living somewhere without fully belonging there.
  - risk: Adding “sinful” could appear to replace the source’s flesh metaphor with a doctrinal conclusion.
    mitigation: “Of the flesh” remains in the main text, and footnote b preserves the literal wording and guards against over-narrowing.
  - risk: Modern readers may understand “soul” as requiring a strict body-soul division.
    mitigation: Footnote c preserves the alternatives “life” and “self” and states that the verse does not require such a strict separation.
