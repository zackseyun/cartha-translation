simplification_decisions:
- pob_phrase: Honor everyone, love the brotherhood, fear God, honor the king.
  simplified_phrase: Honor everyone. Love the community of fellow believers. Fear God. Honor the king.
  preserved_meaning: 'All four distinct commands remain: honor everyone, love the believing community, fear God, and honor the civil ruler.'
  reasoning_layer_used: POB syntax, lexical decisions, and theological decision distinguishing the response due to God from that due to the ruler
  rationale: The compact series was divided into four short sentences so each command is immediately clear. The repeated verb “honor” and the stronger command “Fear God” were retained to preserve the source pattern and theological hierarchy.
- pob_phrase: the brotherhood
  simplified_phrase: the community of fellow believers
  preserved_meaning: The command concerns the corporate community of believers and retains the relational sense of believers as fellows joined together.
  reasoning_layer_used: POB lexical decision for ἀδελφότητα and POB explanatory footnote
  rationale: The POB footnote directly defines the brotherhood as the community of fellow believers. This wording makes the referent clear without the unsupported totalizing word “whole.”
- pob_phrase: the king
  simplified_phrase: the king
  preserved_meaning: The civil ruler is to be honored, while only God is to be feared.
  reasoning_layer_used: POB lexical decision for βασιλέα and theological decision
  rationale: The source-driven term “king” remains in the main text. The likely Roman referent, the emperor, is preserved as an alternative in the footnote rather than replacing the Greek wording.
interpretive_expansions:
- pob_phrase: the brotherhood
  rendering: the community of fellow believers
  claim: The brotherhood refers to the corporate community of fellow believers.
  evidence:
  - The POB lexical rationale says ἀδελφότης denotes the brotherhood or fellowship of fellow believers.
  - The POB footnote defines “the brotherhood” as the community of fellow believers.
  confidence: high
  alternatives_preserved:
  - the brotherhood
  - the family of believers
  - the brotherhood of believers
  - the community of brothers and sisters
retained_terms:
- term: fear
  reason: Retained because the POB lexical and theological decisions require the stronger response toward God, distinguished from the honor given to the ruler.
- term: king
  reason: Retained as the direct source-driven rendering; the likely historical referent “emperor” is supplied in a footnote.
translation_notes:
  source_alignment_notes: The draft preserves all four imperatives, both occurrences of “honor,” the special command to love the believing community, and the deliberate distinction between fearing God and honoring the ruler. The emperor note is correctly attached to “the king,” and the POB explanation of “the brotherhood” is incorporated into the main text without adding the unsupported word “whole.”
  readability_notes:
  - The comma-linked series was divided into four short commands.
  - The opaque term “brotherhood” was expressed as “the community of fellow believers,” following the POB explanation.
  - The historical alternative “emperor” remains in a concise footnote so it does not override the source-driven main text.
  compression_notes:
  - The separate POB explanation of “the brotherhood” was compressed into the main-text phrase “the community of fellow believers.”
  risk_flags:
  - risk: Replacing “brotherhood” may make its familial source image less explicit.
    mitigation: The rendering follows the POB’s own explanatory footnote and preserves the corporate, relational meaning through “community of fellow believers.”
  - risk: Modern readers may understand “king” generically rather than as the Roman emperor.
    mitigation: The footnote gives the likely historical referent while preserving the Greek term in the main text.
