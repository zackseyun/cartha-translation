translation:
  language: en
  text: So honor belongs to you who believe.[a] But as for those who do not believe:[b] “The stone the builders rejected has become the stone at the head of the corner.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the stone is precious to you who believe.”
    reason: alternative_reading
  - marker: b
    text: Or “those who disobey.” The word can describe refusing to believe and therefore disobeying.
    reason: lexical_alternative
  - marker: c
    text: Traditionally, “the cornerstone” or “the chief cornerstone.” The Greek wording is literally “the head of the corner.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Therefore, for you who believe is the honor
  simplified_phrase: So honor belongs to you who believe
  preserved_meaning: Believers are the ones to whom honor belongs.
  reasoning_layer_used: POB lexical and theological decisions on τιμή and τοῖς πιστεύουσιν
  rationale: Recast the Greek-shaped word order into ordinary English while retaining “honor” as the controlling interpretation. The possible sense that the stone is precious to believers remains in footnote a.
- pob_phrase: but for those who do not believe
  simplified_phrase: But as for those who do not believe
  preserved_meaning: The verse contrasts believers with people who refuse belief.
  reasoning_layer_used: POB lexical decision on ἀπιστοῦσιν
  rationale: “As for” gives the following quotation a natural English introduction without changing unbelief into disobedience. The lexical alternative is retained in footnote b.
- pob_phrase: The stone that the builders rejected—this one has become
  simplified_phrase: The stone the builders rejected has become
  preserved_meaning: The very stone evaluated and rejected by the builders later received the decisive place in the building image.
  reasoning_layer_used: POB lexical decisions on λίθος, ἀπεδοκίμασαν, and οἰκοδομοῦντες
  rationale: Removed the heavy relative clause and emphatic resumptive wording because natural English identifies the same stone without repeating “this one.” The stone, builders, rejection, and reversal are all preserved.
- pob_phrase: the head of the corner
  simplified_phrase: the stone at the head of the corner
  preserved_meaning: The rejected stone becomes the stone occupying the head position of the corner.
  reasoning_layer_used: POB lexical and theological decisions on κεφαλὴν γωνίας
  rationale: Repeated “stone” to help readers follow the architectural image while retaining the source-language “head” and “corner” rather than narrowing the expression to “cornerstone.” The familiar rendering remains in footnote c.
interpretive_expansions:
- pob_phrase: the head of the corner
  rendering: the stone at the head of the corner
  claim: The thing that assumes the head position at the corner is the previously rejected stone.
  evidence:
  - The quotation explicitly names λίθος (“stone”) as its subject.
  - The predicate κεφαλὴν γωνίας describes the new position or status of that same stone.
  - The POB rationale requires the wording “head of the corner” to remain transparent rather than being reduced to one architectural interpretation.
  confidence: high
  alternatives_preserved:
  - the cornerstone
  - the chief cornerstone
retained_terms:
- term: honor
  reason: This preserves the POB's controlling interpretation of τιμή and the contrast with shame, while the possible sense “preciousness” remains in a footnote.
- term: head of the corner
  reason: This preserves the source-language image and the POB's decision not to narrow it in the main text to the traditional architectural term “cornerstone.”
translation_notes:
  source_alignment_notes: The draft preserves the direct contrast between those who believe and those who do not, keeps “honor” as the main sense of τιμή, and retains the rejected-stone quotation with its reversal. It also preserves the literal pressure of “head of the corner” while clarifying that the phrase still refers to the stone.
  readability_notes:
  - Changed Greek-shaped word order into the natural clause “honor belongs to you.”
  - Used two sentences so the contrast and quotation are easier to follow.
  - Removed unnecessary repetition in “this one” while preserving the identity of the rejected and exalted stone.
  - Added “the stone at” before “the head of the corner” to make the image easier to track.
  compression_notes:
  - The emphatic resumptive phrase “this one” was compressed because English can identify the same stone through a continuous subject without losing the reversal.
  - The full explanations of the alternate meanings of τιμή and ἀπιστοῦσιν were shortened in the footnotes but their substantive ambiguities were retained.
  risk_flags:
  - risk: “Belongs” could make the relationship between honor and believers sound more explicit than the verbless Greek clause.
    mitigation: This follows the POB's chosen theological reading that honor belongs to believers; footnote a preserves the alternative interpretation.
  - risk: Repeating “stone” in “the stone at the head of the corner” slightly explains the predicate metaphor.
    mitigation: The addition only identifies the grammatical subject within the image and does not choose among the possible architectural meanings; “cornerstone” remains a footnoted alternative.
  - risk: Removing “this one” reduces the citation's explicit emphasis on the rejected stone.
    mitigation: The single continuous English subject still makes clear that the rejected stone is the one that receives the new position.
