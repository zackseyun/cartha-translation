translation:
  language: en
  text: Like newborn babies, long for pure spiritual milk, so that by it you may grow toward the fullness of salvation.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word translated “spiritual” can also mean “rational” or “reasonable.” Here it describes nourishment for the inner life, not literal milk.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Like newborn infants
  simplified_phrase: Like newborn babies
  preserved_meaning: Believers are compared to children who have only recently been born.
  reasoning_layer_used: Lexical decision for ἀρτιγέννητα βρέφη
  rationale: “Babies” is more familiar in common English than “infants” and preserves the newborn-child image.
- pob_phrase: long for the pure, rational milk
  simplified_phrase: long for pure spiritual milk
  preserved_meaning: The command calls for earnest desire for pure, nonliteral nourishment for the inner life.
  reasoning_layer_used: Lexical and theological decisions for λογικός, ἄδολος, γάλα, and ἐπιποθήσατε
  rationale: The audited lexical and theological decisions establish “spiritual” as the controlling contextual sense of λογικός. The force of earnest desire and the pure-milk image remain intact, while the formally possible alternatives are preserved in the footnote.
- pob_phrase: so that by it you may grow into salvation
  simplified_phrase: so that by it you may grow toward the fullness of salvation
  preserved_meaning: The spiritual nourishment is the means by which believers grow toward salvation’s complete realization.
  reasoning_layer_used: Lexical decisions and theological guardrail for ἵνα, ἐν αὐτῷ, αὐξηθῆτε, and εἰς σωτηρίαν
  rationale: “So that” retains the explicit purpose relation identified by the grounding review. “By it” keeps the milk as the means of growth, and “toward the fullness of salvation” makes the audited directional and consummation sense understandable without suggesting that growth earns salvation.
interpretive_expansions:
- pob_phrase: grow into salvation
  rendering: grow toward the fullness of salvation
  claim: The growth moves toward salvation’s complete realization or consummation, without implying that spiritual growth earns salvation.
  evidence:
  - The lexical rationale says εἰς marks goal or result.
  - The POB theological decision says the Greek expresses movement toward salvation’s consummation.
  - The POB rationale warns against making salvation merely future-earned or flattening it into a purely present or purely future formula.
  confidence: high
  alternatives_preserved:
  - grow into salvation
  - grow up in your salvation
  - grow unto salvation
retained_terms:
- term: salvation
  reason: This is a central theological term, and replacing it would obscure the verse’s stated goal.
translation_notes:
  source_alignment_notes: The revision preserves the newborn-baby comparison, the command to desire earnestly, the purity and milk imagery, the audited spiritual sense of λογικός, the milk as the means of growth, and movement toward salvation’s consummation. It restores “so that ... may grow,” correcting the earlier wording that weakened the Greek purpose clause into mere possibility.
  readability_notes:
  - Replaced “infants” with the more familiar “babies.”
  - Used “spiritual milk” in the main text to prevent readers from mistaking the milk for literal food.
  - Clarified the directional phrase “into salvation” as “toward the fullness of salvation.”
  - Kept the verse as one flowing sentence because the restored “so that” construction clearly connects the command with its purpose.
  compression_notes:
  - The definite article before “milk” is not represented separately because natural English does not require it here.
  risk_flags:
  - risk: “Spiritual” is more interpretive than the formally possible renderings “rational” or “reasonable.”
    mitigation: It follows the controlling lexical and theological decision, and the alternatives are retained in the footnote.
  - risk: “Fullness of salvation” states the consummation sense more explicitly than the POB main text.
    mitigation: The expansion is directly supported by the POB theological rationale and remains directional, without imposing a denominational account of merit, sanctification, or assurance.
