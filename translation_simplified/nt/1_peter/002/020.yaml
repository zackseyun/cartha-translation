translation:
  language: en
  text: What credit is there if you endure a beating while you are sinning? But if you endure suffering while you are doing good, this is grace before God.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “this finds favor with God” or “this is commendable before God.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: For what credit is it if, when you are sinning and being beaten, you endure?
  simplified_phrase: What credit is there if you endure a beating while you are sinning?
  preserved_meaning: Enduring physical punishment while engaged in sin brings no credit or commendation.
  reasoning_layer_used: POB lexical decisions for κλέος, ἁμαρτάνοντες, κολαφιζόμενοι, and ὑπομενεῖτε; doctrine-realignment revision
  rationale: Reordered the dense participial construction into ordinary English while retaining “credit,” the physical force of “beating,” the moral force and ongoing aspect of “sinning,” and the command's emphasis on enduring.
- pob_phrase: But if, when you are doing good and suffering, you endure
  simplified_phrase: But if you endure suffering while you are doing good
  preserved_meaning: The contrasting case is steadfast endurance of suffering while continuing to do good.
  reasoning_layer_used: POB lexical decisions for ἀγαθοποιοῦντες, πάσχοντες, and ὑπομενεῖτε; doctrine-realignment revision
  rationale: Placed the main action first and used “while” to make the relationship between doing good and suffering immediately clear. The broad term “suffering” and the ongoing sense of “doing good” remain intact.
- pob_phrase: this is grace before God
  simplified_phrase: this is grace before God
  preserved_meaning: Such endurance has the character of grace or favor in God's estimation, without resolving the lexical nuance too narrowly.
  reasoning_layer_used: POB lexical decision for χάρις and παρὰ θεῷ; theological decision on the closing clause
  rationale: Retained the controlling theological wording because replacing “grace” in the main text would erase its documented resonance. The footnote gives the clearer contextual senses of divine favor and commendation.
retained_terms:
- term: grace
  reason: POB deliberately retains the theologically important sense of χάρις while acknowledging the contextual alternatives “favor” and “commendable” in a footnote.
- term: before God
  reason: This is the documented POB rendering of παρὰ θεῷ and preserves the sense of standing in God's presence and estimation.
translation_notes:
  source_alignment_notes: The draft preserves the verse's contrast between enduring deserved physical punishment while sinning and enduring suffering while doing good. Both occurrences of ὑπομένω remain explicit, the ongoing force of the participles is represented with “while you are,” and the documented χάρις ambiguity is preserved through the main text and footnote.
  readability_notes:
  - Reordered both clauses so that “endure” appears before the circumstances in which endurance occurs.
  - Changed “being beaten” to the concrete noun phrase “a beating” without weakening the image of physical abuse.
  - Kept the parallel wording “endure a beating” and “endure suffering” to make the contrast easy to follow.
  risk_flags:
  - risk: “Grace before God” may be less immediately transparent than “finds favor with God.”
    mitigation: Retained it because it is the audited POB theological choice and supplied both contextual alternatives in a concise footnote.
  - risk: Recasting the participles could weaken their ongoing aspect.
    mitigation: Used “while you are sinning” and “while you are doing good” to preserve concurrent, continuing action.
