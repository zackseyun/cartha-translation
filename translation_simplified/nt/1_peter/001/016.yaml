translation:
  language: en
  text: because Scripture says,[a] “You shall be holy, because I am holy.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'This can also be expressed as a direct command: “Be holy.” The Greek quotation follows the wording of Scripture and uses the future form, “You shall be holy.”'
    reason: alternative_reading
simplification_decisions:
- pob_phrase: because it is written
  simplified_phrase: because Scripture says
  preserved_meaning: The words of Scripture provide the reason for the preceding command and remain authoritative.
  reasoning_layer_used: Lexical decision for διότι and γέγραπται; immediate context
  rationale: “Scripture says” is more direct for a common reader than the traditional citation formula “it is written,” while “because” keeps the verse’s causal link to the preceding exhortation.
- pob_phrase: You shall be holy
  simplified_phrase: You shall be holy
  preserved_meaning: The quotation has both a future form and the force of a command.
  reasoning_layer_used: Lexical and theological decisions for ἔσεσθε; Levitical citation form
  rationale: Although “shall” is less common in everyday English, it is retained here because replacing it with either “will” or “must” would erase part of the documented tension between future wording and command force. The footnote gives the clearer imperative alternative.
- pob_phrase: because I am holy
  simplified_phrase: because I am holy
  preserved_meaning: God’s own holiness is the reason his people are called to be holy.
  reasoning_layer_used: Lexical decisions for ὅτι, ἐγώ, and ἅγιος; theological rationale
  rationale: The wording is already clear, concise, and important for preserving the repeated term “holy” and God’s emphatic self-reference.
retained_terms:
- term: holy
  reason: This is the central biblical and theological term in the citation. Replacing it with “set apart” would narrow its ethical and covenantal meaning.
- term: shall
  reason: Retained to preserve the Greek quotation’s future form together with its imperative-like force; the footnote explains the alternative direct command.
translation_notes:
  source_alignment_notes: The draft keeps διότι as a causal connector, renders the Scripture-citation formula in plain active English, preserves both occurrences of “holy,” and retains the POB decision to represent ἔσεσθε with “shall” rather than reducing it to either prediction or simple command.
  readability_notes:
  - Changed the passive formula “it is written” to the direct and familiar “Scripture says.”
  - Kept the quotation as one short sentence because its parallel wording is already easy to follow.
  - Used a footnote to explain the less familiar force of “shall” without interrupting the verse.
  risk_flags:
  - risk: “Scripture says” does not reproduce the perfect passive form of “it is written” as directly as the POB wording.
    mitigation: The phrase still clearly identifies Scripture as the authoritative source, while the source-alignment note records the underlying citation formula.
  - risk: Modern readers may hear “shall” as merely formal or archaic.
    mitigation: The footnote explains that the Greek future wording also carries the force of a command and gives “Be holy” as the direct alternative.
