translation:
  language: en
  text: It was revealed to the prophets that, in these things, they were serving not themselves but you. These same things have now been announced to you through those who preached the good news to you by the Holy Spirit sent from heaven. Angels long to peer into these things.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: To them it was revealed
  simplified_phrase: It was revealed to the prophets
  preserved_meaning: The revelation was given to the prophets mentioned in the preceding context, while the one who revealed it remains unstated.
  reasoning_layer_used: POB lexical decision for οἷς and ἀπεκαλύφθη; immediate context
  rationale: Replacing the pronoun with its clear antecedent helps readers follow the verse without changing the passive construction or supplying an unstated divine agent.
- pob_phrase: that they were serving not themselves but you in these things
  simplified_phrase: that, in these things, they were serving not themselves but you
  preserved_meaning: The prophets’ continuing past service benefited later believers rather than themselves.
  reasoning_layer_used: POB lexical decisions for οὐχ ἑαυτοῖς ὑμῖν δὲ, διηκόνουν, and αὐτά; theological decision on prophetic ministry
  rationale: Moving “in these things” earlier makes the contrast easier to follow while retaining both the service language and the beneficiaries.
- pob_phrase: which now have been announced to you
  simplified_phrase: These same things have now been announced to you
  preserved_meaning: The realities spoken of by the prophets are the realities now proclaimed to the readers.
  reasoning_layer_used: POB lexical decision for ἃ νῦν ἀνηγγέλη; theological decision on continuity between prophecy and gospel proclamation
  rationale: A new sentence reduces clause density, while “these same things” clearly preserves the link between the prophetic message and its present announcement.
- pob_phrase: through those who preached the good news to you by the Holy Spirit sent from heaven
  simplified_phrase: through those who preached the good news to you by the Holy Spirit sent from heaven
  preserved_meaning: Human proclaimers brought the good news through the agency of the personal Holy Spirit, who was sent from heaven.
  reasoning_layer_used: POB lexical decisions for διὰ τῶν εὐαγγελισαμένων ὑμᾶς, πνεύματι ἁγίῳ, and ἀποσταλέντι ἀπ’ οὐρανοῦ; POB theological decision on the Holy Spirit
  rationale: This wording is already direct modern English and preserves the distinct roles of the human preachers and the Holy Spirit.
- pob_phrase: things into which angels long to look
  simplified_phrase: Angels long to peer into these things
  preserved_meaning: Angels continually desire to examine these salvation realities with eager, intent attention.
  reasoning_layer_used: POB lexical decisions for εἰς ἃ, ἐπιθυμοῦσιν, ἄγγελοι, and παρακύψαι; POB footnote c
  rationale: A separate sentence is easier to read. “Peer into” preserves both the source preposition and the vivid sense of intent observation better than the more general “look.”
interpretive_expansions:
- pob_phrase: To them
  rendering: to the prophets
  claim: The recipients of the revelation are the prophets discussed in the preceding verse.
  evidence:
  - The POB lexical rationale states that οἷς refers back to the prophets in the previous verse.
  - The immediate context of 1 Peter 1:10–11 discusses the prophets who searched and inquired about this salvation.
  confidence: high
retained_terms:
- term: revealed
  reason: Retains the source’s passive construction and important revelatory register without naming an unstated agent.
- term: Holy Spirit
  reason: Preserves the POB’s source-driven and theological identification of the personal divine agent in gospel proclamation.
translation_notes:
  source_alignment_notes: The draft preserves the prophets as recipients of revelation, the contrast between serving themselves and serving later believers, the continuity between prophecy and present gospel proclamation, the Holy Spirit’s heavenly mission and agency, and the angels’ continuing desire to look intently into these realities.
  readability_notes:
  - The long POB sentence is divided into three sentences.
  - The antecedent “the prophets” replaces an initially unclear pronoun.
  - “These same things” makes the connection between prophecy and gospel proclamation easy to follow.
  - “Peer into” gives ordinary readers the vivid force documented in the POB footnote.
  compression_notes:
  - The lexical footnotes are omitted because the main text communicates the beneficiary contrast, the good-news verb, and the vivid looking image clearly without requiring alternate wording.
  risk_flags:
  - risk: Naming “the prophets” in place of “them” makes the antecedent explicit.
    mitigation: The immediate context and the POB lexical rationale identify the antecedent with high confidence.
  - risk: “Peer into” is more vivid than the POB main text’s “look.”
    mitigation: The POB lexical rationale and footnote explicitly document “peer into” as a source-supported rendering that preserves eager, intent observation.
