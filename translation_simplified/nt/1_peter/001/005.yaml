translation:
  language: en
  text: God is guarding you by his power through faith for a salvation ready to be revealed in the last time.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “through trust”; less likely here, “through faithfulness.”
    reason: lexical_alternative
  - marker: b
    text: Or “at the last time.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: who are being guarded by the power of God
  simplified_phrase: God is guarding you by his power
  preserved_meaning: God is the one who continually guards the addressees, and his power is the means by which he guards them.
  reasoning_layer_used: Lexical decisions for φρουρουμένους and ἐν δυνάμει θεοῦ; contextual decision for τοὺς; independent grounding review
  rationale: The active construction and explicit “you” make the standalone verse easier to understand. Naming God as the one guarding while retaining “by his power” preserves the source distinction between the guarder and the means of guarding.
- pob_phrase: through faith
  simplified_phrase: through faith
  preserved_meaning: Faith remains the mediating means through which the addressees participate in God’s guarding.
  reasoning_layer_used: Lexical and theological decisions for διὰ πίστεως
  rationale: The key theological term is retained so that neither God’s action nor the believers’ response is obscured. The documented lexical alternatives remain in a footnote.
- pob_phrase: for a salvation
  simplified_phrase: for a salvation
  preserved_meaning: Salvation is the forward-looking goal or result of God’s guarding.
  reasoning_layer_used: Lexical decision for εἰς σωτηρίαν; theological decision on salvation’s future revealed fullness; independent grounding review
  rationale: Retaining the POB wording avoids adding the unsupported journey or arrival image suggested by “to bring you to.” The following clause makes the future orientation clear.
- pob_phrase: ready to be revealed in the last time
  simplified_phrase: ready to be revealed in the last time
  preserved_meaning: Salvation awaits its future unveiling at the decisive final time.
  reasoning_layer_used: Lexical decisions for ἑτοίμην ἀποκαλυφθῆναι and ἐν καιρῷ ἐσχάτῳ
  rationale: The wording is understandable and preserves both the revelation image and the future eschatological orientation without imposing a detailed end-times scheme.
interpretive_expansions:
- pob_phrase: who
  rendering: you
  claim: The people being guarded are the letter’s addressees.
  evidence:
  - The Greek article τοὺς resumes the addressees from the preceding verse.
  - The POB lexical rationale states that “you” is implied by the context of verse 4.
  confidence: high
  alternatives_preserved:
  - A relative construction beginning with “who” remains possible when verses 4–5 are printed as one sentence.
retained_terms:
- term: faith
  reason: This preserves the POB’s primary rendering of πίστις and the theological relationship between God’s guarding and the believers’ response.
- term: salvation
  reason: This major biblical term preserves the future goal and revealed fullness described by the verse.
- term: last time
  reason: This preserves the decisive eschatological timing without imposing a more specific end-times framework.
translation_notes:
  source_alignment_notes: 'The revision preserves all central source relationships: God is the one continually guarding; his power is the means of that guarding; faith is the mediating means; salvation is its forward-looking goal or result; and that salvation is ready for future revelation in the decisive last time. It does not add a process-of-arrival image or resolve wider theological questions about perseverance, apostasy, or the present and future dimensions of salvation.'
  readability_notes:
  - The dependent relative clause is recast as a direct statement because the verse is presented on its own.
  - 'The active construction places the actor, action, recipient, and means in ordinary English order: “God is guarding you by his power.”'
  - The explicit “you” identifies the addressees without requiring readers to reconstruct the grammatical connection to verse 4.
  risk_flags:
  - risk: Using an active clause instead of the Greek passive could weaken the emphasis on the recipients as those being guarded.
    mitigation: The sentence still explicitly says that God is guarding “you” and preserves the ongoing guarding image.
  - risk: Making “you” explicit removes the visible relative-clause link to verse 4.
    mitigation: The POB rationale identifies the addressees as the implied referent and permits “you who” as an alternative; the direct statement improves standalone clarity without changing the referent.
  - risk: The phrase “for a salvation” is less conversational than “for salvation.”
    mitigation: It is retained because it naturally connects salvation with the modifier “ready to be revealed” and preserves the POB’s forward-looking formulation without adding unsupported process imagery.
