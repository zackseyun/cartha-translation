translation:
  language: en
  text: They searched to learn what person or what time the Spirit of the Messiah within them was indicating. The Spirit testified beforehand about the sufferings for the Messiah[a] and the glories that would follow.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “the sufferings of the Messiah.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: inquiring into
  simplified_phrase: They searched to learn
  preserved_meaning: The prophets actively investigated the meaning of what had been revealed to them.
  reasoning_layer_used: Immediate context and lexical decision for ἐραυνῶντες
  rationale: The participle depends on the prophets mentioned in the preceding verse. Turning it into a direct clause makes the activity immediately clear while retaining its investigative force.
- pob_phrase: what person or what time
  simplified_phrase: what person or what time
  preserved_meaning: The prophets' inquiry concerned both the person being indicated and the time involved.
  reasoning_layer_used: Lexical decision for εἰς τίνα ἢ ποῖον καιρόν
  rationale: This wording is retained because the source construction is difficult and the POB audit specifically requires both parts of the inquiry rather than reducing it to a question only about time.
- pob_phrase: the Spirit of Messiah in them was indicating
  simplified_phrase: the Spirit of the Messiah within them was indicating
  preserved_meaning: The Spirit associated with the Messiah was present and active in the prophets, giving ongoing indications.
  reasoning_layer_used: Lexical and theological decisions for τὸ ἐν αὐτοῖς πνεῦμα Χριστοῦ and ἐδήλου
  rationale: “Within them” is clearer modern English for “in them.” The direct title “Spirit of the Messiah” and the ongoing force of “was indicating” are preserved rather than explained away.
- pob_phrase: as it testified beforehand
  simplified_phrase: The Spirit testified beforehand
  preserved_meaning: The Spirit indicated these matters by bearing witness in advance.
  reasoning_layer_used: Lexical decision for προμαρτυρόμενον
  rationale: The long sentence is divided into two. Repeating “The Spirit” gives the participle a clear subject without weakening either its witness imagery or its advance testimony.
- pob_phrase: the sufferings for Messiah
  simplified_phrase: the sufferings for the Messiah
  preserved_meaning: The predicted sufferings were directed toward or concerned the Messiah, while the exact force of the source preposition remains somewhat disputed.
  reasoning_layer_used: Final POB text, applied revisions, and theological decision on εἰς
  rationale: The controlling POB wording is retained with the natural English article. The plausible possessive interpretation remains in the footnote so the documented ambiguity is not flattened.
- pob_phrase: the glories after these things
  simplified_phrase: the glories that would follow
  preserved_meaning: Multiple glorious outcomes were foretold as coming after the sufferings.
  reasoning_layer_used: Lexical decision for τὰς μετὰ ταῦτα δόξας
  rationale: The POB-listed natural alternative replaces an awkward literal temporal phrase while preserving both the future sequence and the plural “glories.”
retained_terms:
- term: Messiah
  reason: The POB doctrine and lexical decisions require Χριστός to be translated as the title “Messiah” here.
- term: Spirit of the Messiah
  reason: This direct theological wording is retained because paraphrasing it could weaken the source text's presentation of the Messiah's Spirit as active within the prophets.
- term: glories
  reason: The plural is retained because it may refer to the Messiah's manifold glorious outcomes after the sufferings.
translation_notes:
  source_alignment_notes: 'The draft follows the final, regression-corrected POB reading: “Messiah” is retained, and the main text uses “sufferings for the Messiah” rather than restoring the earlier interpretive wording “destined for the Messiah.” It preserves the twofold inquiry, the Spirit''s presence in the prophets, advance testimony, the sufferings, and the subsequent plural glories.'
  readability_notes:
  - The dependent participle is recast as a complete sentence with the prophets represented by “They” from the preceding context.
  - The dense source sentence is divided into two sentences.
  - “Within them” clarifies the location of the Spirit without changing the theological claim.
  - “That would follow” gives the temporal relationship in natural modern English.
  risk_flags:
  - risk: “What person or what time” remains less idiomatic than a freer paraphrase.
    mitigation: It is retained because the POB reasoning treats the distinction as source-significant; the surrounding sentence has been simplified to reduce the remaining difficulty.
  - risk: “Sufferings for the Messiah” can be understood in more than one way.
    mitigation: The main text follows the final POB decision, while the footnote preserves the important alternative “the sufferings of the Messiah.”
  - risk: Splitting the sentence could make the testimony sound separate from the Spirit's act of indicating.
    mitigation: The second sentence repeats “The Spirit,” preserving that the advance testimony explains how the Spirit was indicating these things.
