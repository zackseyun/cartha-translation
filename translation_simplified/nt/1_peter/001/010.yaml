translation:
  language: en
  text: The prophets who prophesied about the grace for you[a] searched diligently and investigated carefully to learn about this salvation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “the grace that was to come to you.” The context points toward this future sense, though this verse does not state it explicitly.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Concerning this salvation, the prophets who prophesied about the grace for you searched and investigated carefully
  simplified_phrase: The prophets who prophesied about the grace for you searched diligently and investigated carefully to learn about this salvation
  preserved_meaning: The prophets earnestly searched and thoroughly investigated the salvation about which they had prophesied.
  reasoning_layer_used: POB syntax, lexical decisions for περί, ἐξεζήτησαν, and ἐξηραύνησαν, and the awkward-English revision history
  rationale: The long subject no longer interrupts the connection between the topic and the main verbs. Placing “this salvation” at the end and expressing it as what they sought to learn about produces natural English while retaining the same topic and both intensified search verbs.
- pob_phrase: searched and investigated carefully
  simplified_phrase: searched diligently and investigated carefully
  preserved_meaning: The two coordinated verbs describe earnest searching followed by thorough investigation.
  reasoning_layer_used: POB lexical decisions for ἐξεζήτησαν and ἐξηραύνησαν
  rationale: “Diligently” makes the earnest force of the first verb clear, while “investigated carefully” keeps the second verb distinct and preserves the rhetorical intensification.
- pob_phrase: the grace for you
  simplified_phrase: the grace for you
  preserved_meaning: The prophecy concerned grace directed toward or benefiting the readers, without explicitly stating in the main text that it was future.
  reasoning_layer_used: POB lexical and theological decisions for χάριτος and εἰς ὑμᾶς
  rationale: The key theological term “grace” and the source-driven wording “for you” are retained. The future interpretation remains in a footnote rather than being added to the main text.
interpretive_expansions:
- pob_phrase: Concerning this salvation ... searched and investigated carefully
  rendering: searched diligently and investigated carefully to learn about this salvation
  claim: The prophets’ searching and investigation were directed toward gaining knowledge about this salvation.
  evidence:
  - The topic phrase Περὶ ἧς σωτηρίας identifies this salvation as the subject of the searching and investigation.
  - The POB lexical rationale understands ἐκζητέω as earnest seeking and ἐξεραυνάω as thorough investigation.
  - The immediate construction connects both search verbs with the topic of salvation.
  confidence: high
  alternatives_preserved:
  - Concerning this salvation, the prophets ... searched and investigated carefully.
retained_terms:
- term: prophets
  reason: This names the recognized biblical messengers in view and preserves the POB’s identification of the group.
- term: prophesied
  reason: This preserves their specific prophetic activity rather than reducing it to ordinary speech.
- term: grace
  reason: This is the POB’s theologically significant rendering of χάρις and maintains continuity with the surrounding passage.
- term: salvation
  reason: This preserves the theological weight of σωτηρία and its connection with the preceding context.
translation_notes:
  source_alignment_notes: 'The draft retains every major source element: this salvation, the prophets, their prophecy about grace for the readers, and the two distinct verbs of earnest searching and careful investigation. It does not add a future expression to the main text.'
  readability_notes:
  - The topic phrase has been moved from the front to the end so the subject and verbs are easier to follow.
  - The purpose phrase “to learn about” clarifies how the salvation relates to the two search verbs in ordinary English.
  - The sentence remains a single publication-readable unit because its structure is now direct.
  risk_flags:
  - risk: “To learn about” states the implied aim of the searching more directly than the POB wording.
    mitigation: The phrase is narrowly grounded in the topic construction and the meanings of the two search verbs; it does not specify what conclusions the prophets reached.
  - risk: A future sense may be inferred for “the grace for you.”
    mitigation: The main text follows the POB decision not to make that future sense explicit, while the alternative is preserved in footnote a.
