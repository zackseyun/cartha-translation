translation:
  language: en
  text: But you yourselves must be holy[a] in every part of your lives[b], just as the Holy One who called you is holy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “become holy.” The Greek may emphasize entering into or showing this state, but “be holy” is the more natural command in English.
    reason: lexical_alternative
  - marker: b
    text: Or “in your whole way of life.” The Greek refers to a person’s entire manner of living.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: but as the Holy One who called you is holy, you yourselves also be holy
  simplified_phrase: But you yourselves must be holy ... just as the Holy One who called you is holy
  preserved_meaning: Believers are commanded to correspond to the holiness of God, who called them. The emphatic “yourselves” and both occurrences of “holy” are retained.
  reasoning_layer_used: POB lexical decisions for ἀλλὰ, κατὰ, καὶ αὐτοὶ, and ἅγιος; POB theological decision on the correspondence between God’s holiness and the believers’ call
  rationale: Placing the command before the comparison gives modern readers the main point sooner. “Just as” clearly preserves God’s holiness as the pattern, while “must” naturally conveys the force of the imperative.
- pob_phrase: in all your conduct
  simplified_phrase: in every part of your lives
  preserved_meaning: The command to holiness applies comprehensively to the readers’ entire manner and pattern of life, not merely to isolated actions.
  reasoning_layer_used: POB lexical decision for ἐν πάσῃ ἀναστροφῇ; immediate contextual contrast with the readers’ former pattern of desires
  rationale: This plain wording preserves the broad lifestyle sense of “conduct” more clearly than “in everything you do.” The footnote also gives the lexical alternative “in your whole way of life.”
- pob_phrase: be holy
  simplified_phrase: must be holy
  preserved_meaning: The wording remains a direct command to holiness without imposing a particular doctrine of sanctification as a process.
  reasoning_layer_used: POB lexical decision for γενήθητε and POB theological decision on the force of the imperative
  rationale: “Must” makes the command explicit in ordinary English. The documented alternative “become holy” remains in a footnote.
retained_terms:
- term: Holy One
  reason: Retained as the POB’s source-driven title for God, preserving both the personal reference and the theological weight of God’s holiness.
- term: holy
  reason: Retained in both clauses to preserve the deliberate source-language repetition and the correspondence between God’s character and the believers’ lives.
translation_notes:
  source_alignment_notes: The draft retains the contrast introduced by ἀλλά, the emphatic force of αὐτοί (“yourselves”), the correspondence expressed by κατά (“just as”), both occurrences of ἅγιος (“holy”), God as the one who called the readers, and the comprehensive lifestyle scope of πάσῃ ἀναστροφῇ. The clauses are reordered only to improve readability. The footnote markers are attached to the phrases they actually explain, correcting the apparent marker reversal in the POB record without changing the documented alternatives.
  readability_notes:
  - The command comes before the comparison so readers encounter the main exhortation immediately.
  - “In every part of your lives” plainly expresses an entire way of life rather than suggesting only separate actions.
  - The sentence remains solemn and direct while using ordinary modern syntax.
  risk_flags:
  - risk: Reordering the clauses could make God’s holiness seem secondary.
    mitigation: “Just as” explicitly preserves God’s holiness as the pattern for the believers’ holiness.
  - risk: “In every part of your lives” could be read as referring to life categories rather than an ongoing manner of living.
    mitigation: The wording remains comprehensive, and footnote b explicitly states that the Greek refers to a person’s entire manner of living.
  - risk: Adding “must” may sound stronger than a bare English imperative.
    mitigation: It is used to communicate the force of the Greek command clearly, while retaining “be holy” rather than shifting the main text to the process-oriented alternative “become holy.”
