translation:
  language: en
  text: You have not seen him, yet you love him. You do not see him now, yet you believe in him and rejoice with glorious joy[a] that words cannot express.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “joy that is full of glory.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Though you have not seen him, you love him.
  simplified_phrase: You have not seen him, yet you love him.
  preserved_meaning: The readers love Jesus despite never having seen him.
  reasoning_layer_used: POB lexical decisions for ὃν, ἰδόντες, and ἀγαπᾶτε
  rationale: The concessive relationship is expressed with a direct statement followed by “yet,” which is easier to process while preserving the contrast between not seeing and loving.
- pob_phrase: Though you do not now see him, yet believing in him
  simplified_phrase: You do not see him now, yet you believe in him
  preserved_meaning: The readers presently cannot see Jesus but continue to believe in him.
  reasoning_layer_used: POB lexical and theological decisions for ἄρτι, ὁρῶντες, πιστεύοντες, εἰς ὃν, and δὲ
  rationale: The participial phrase is recast as a finite clause in ordinary English. “Believe in him” is retained rather than changed to “trust” or “have faith,” following the controlling POB decision.
- pob_phrase: you rejoice with inexpressible and glorious joy
  simplified_phrase: you rejoice with glorious joy that words cannot express
  preserved_meaning: Their rejoicing is marked by joy beyond verbal expression and associated with glory.
  reasoning_layer_used: POB lexical decisions for ἀγαλλιᾶσθε, χαρᾷ, ἀνεκλαλήτῳ, and δεδοξασμένῃ; POB theological decision and final base rendering
  rationale: The abstract adjective “inexpressible” is unfolded as the common phrase “that words cannot express.” “Glorious joy” remains in the main text, while the documented alternative “joy that is full of glory” is retained in a footnote.
retained_terms:
- term: believe in him
  reason: Preserves the POB’s source-driven and theological choice for πιστεύοντες εἰς ὃν.
- term: glorious
  reason: Preserves the controlling POB rendering of δεδοξασμένῃ while the plausible “full of glory” sense remains in a footnote.
translation_notes:
  source_alignment_notes: 'The draft preserves the verse’s two contrasts: the readers have not seen Jesus but love him, and they do not see him now but believe in him and rejoice. It retains the distinct ideas of love, present non-sight, belief in Jesus, rejoicing, inexpressibility, and glory.'
  readability_notes:
  - Recast both concessive clauses into direct statements joined by “yet.”
  - Changed “inexpressible” to the immediately understandable phrase “that words cannot express.”
  - Kept the repeated “rejoice” and “joy” because both ideas are present in the Greek and carry the verse’s emphasis.
  risk_flags:
  - risk: “Glorious” can flatten the perfect passive force of δεδοξασμένῃ.
    mitigation: The main text follows the controlling POB wording, and the footnote preserves the important alternative “joy that is full of glory.”
  - risk: The pronoun “him” depends on the preceding context for its referent.
    mitigation: It is retained because the POB identifies the referent as Jesus Christ from the prior context and deliberately prefers natural “him” over “whom.”
