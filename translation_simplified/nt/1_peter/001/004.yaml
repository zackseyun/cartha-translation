simplification_decisions:
- pob_phrase: into an inheritance
  simplified_phrase: into an inheritance
  preserved_meaning: The believers are brought into the inheritance that is the goal of the new birth described in the surrounding sentence.
  reasoning_layer_used: POB translation and applied revision
  rationale: The audited revision specifically restored and protected “into,” so that wording is retained. “Inheritance” is also retained because it is a clear, important biblical concept.
- pob_phrase: imperishable and undefiled and unfading
  simplified_phrase: that can never perish, be stained, or fade away
  preserved_meaning: The inheritance is not subject to destruction, defilement, or loss of glory and freshness.
  reasoning_layer_used: POB translation and Greek source payload
  rationale: The three coordinated qualities remain distinct, but abstract adjectives are recast as plain verbal phrases. “Be stained” makes the image behind “undefiled” easier to grasp without reducing it to a vague claim that the inheritance is merely good.
- pob_phrase: kept in the heavens for you
  simplified_phrase: an inheritance kept in heaven for you
  preserved_meaning: God's promised inheritance remains securely reserved in the heavenly realm for the readers.
  reasoning_layer_used: POB translation and immediate syntax
  rationale: The participial phrase is attached through a repeated noun, avoiding a dense string of modifiers. Singular English “heaven” naturally expresses the same heavenly location conveyed by the POB's “the heavens.”
retained_terms:
- term: inheritance
  reason: This is a central biblical image for what God has promised his people, and it remains understandable in common English.
translation_notes:
  source_alignment_notes: The draft preserves the source sequence of three qualities and the POB's audited choice “into.” It also keeps the final idea that the inheritance is reserved in heaven for the readers.
  readability_notes:
  - Converted three abstract adjectives into parallel verbal phrases.
  - Repeated “an inheritance” after the dash so the final modifier is immediately clear.
  - Used common English “in heaven” instead of the less natural “in the heavens.”
  risk_flags:
  - risk: “Be stained” is more image-based than the POB's theological term “undefiled.”
    mitigation: The rendering preserves the distinct idea of contamination or defilement and does not merge it with imperishability or unfadingness.
  - risk: The opening word “into” leaves this verse grammatically connected to the preceding context.
    mitigation: This dependence is intentional because the applied revision expressly identifies “into” as the protected rendering.
