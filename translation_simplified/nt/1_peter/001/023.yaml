translation:
  language: en
  text: You have been born again—not from seed that perishes, but from seed that never perishes—through the living and enduring word of God.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “through the word of the living and enduring God.” The Greek wording can describe either the word or God as living and enduring, though the context favors “word.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: having been born again
  simplified_phrase: You have been born again
  preserved_meaning: God has already brought the readers to new birth, and the result continues in the present.
  reasoning_layer_used: POB lexical decision for ἀναγεγεννημένοι and Greek grammar
  rationale: The participial clause was recast as a direct statement so it reads naturally as a standalone verse. The perfect passive sense is retained in “have been born.”
- pob_phrase: not from perishable seed but imperishable
  simplified_phrase: not from seed that perishes, but from seed that never perishes
  preserved_meaning: The source of their new birth is contrasted through the image of ordinary seed that dies and seed that cannot perish.
  reasoning_layer_used: POB lexical decisions for σπορά, φθαρτός, and ἄφθαρτος
  rationale: The seed image and its sharp contrast are preserved, while the abstract adjectives are unpacked as short, familiar clauses.
- pob_phrase: through the living and abiding word of God
  simplified_phrase: through the living and enduring word of God
  preserved_meaning: God’s word is the means of new birth and is characterized as living and continuing permanently.
  reasoning_layer_used: POB lexical decisions for διά, λόγος, ζάω, and μένω; POB theological decision on modifier attachment
  rationale: “Through” and “word of God” remain unchanged because they carry the selected means and genitive relationships. “Enduring” communicates the durative force of “abiding” more immediately to a common reader. The preferred attachment of both descriptions to “word” remains in the text, while the genuine alternative is retained in a footnote.
retained_terms:
- term: born again
  reason: This is a major biblical concept and directly preserves the new-birth imagery of the Greek and the POB.
- term: seed
  reason: The source-language birth image and the contrast between what perishes and what does not must remain visible.
- term: word of God
  reason: This preserves the POB’s selected lexical and grammatical relationship rather than replacing “word” with the more interpretive “message.”
translation_notes:
  source_alignment_notes: 'The draft preserves the POB’s controlling reading: the readers have been born again by means of God’s word, and that word is living and enduring. It retains the passive new-birth language, the seed metaphor, the perishable/imperishable contrast, and the documented grammatical ambiguity in a footnote.'
  readability_notes:
  - The opening participle is recast as a direct sentence addressed to the readers.
  - Abstract adjectives are expressed as familiar verbal clauses.
  - Dashes keep the seed contrast together without obscuring the main statement.
  - “Enduring” replaces the less immediately clear “abiding.”
  risk_flags:
  - risk: Changing the participle to a finite sentence may make the verse appear less syntactically dependent on the preceding context.
    mitigation: The perfect passive meaning and continuing result are preserved in “You have been born again,” which is clearer for a standalone verse record.
  - risk: “Never perishes” may sound slightly more emphatic than the single adjective “imperishable.”
    mitigation: It is a direct plain-language expression of the same lexical contrast and does not add a new theological claim.
  - risk: English phrasing may conceal the possible attachment of “living and enduring” to “God.”
    mitigation: The main text follows the POB’s contextually favored reading, and the genuine alternative remains in footnote a.
