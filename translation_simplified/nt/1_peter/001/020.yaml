translation:
  language: en
  text: He was known beforehand, before the world was founded, but he was revealed at the end of the times for your sake.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “was chosen beforehand.” The Greek says that he was known beforehand. This may imply God’s purpose, but it does not necessarily mean “chosen.”
    reason: lexical_alternative
  - marker: b
    text: Or “in these last times.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: He was foreknown
  simplified_phrase: He was known beforehand
  preserved_meaning: The Messiah was known before creation, without turning foreknowledge into an explicit statement that he was chosen or destined.
  reasoning_layer_used: POB lexical and theological decisions for προεγνωσμένου
  rationale: “Known beforehand” expresses the lexical sense in common English while preserving the documented theological tension. The possible sense “chosen beforehand” remains in a footnote rather than being imposed on the main text.
- pob_phrase: before the foundation of the world
  simplified_phrase: before the world was founded
  preserved_meaning: This happened before the world's beginning or creation.
  reasoning_layer_used: POB lexical decision for πρὸ καταβολῆς κόσμου
  rationale: The passive clause is easier for a modern reader while retaining the source image of the world being founded.
- pob_phrase: but was revealed
  simplified_phrase: but he was revealed
  preserved_meaning: The Messiah was openly disclosed or made known in history.
  reasoning_layer_used: POB lexical decision for φανερωθέντος and the antecedent supplied from verse 19
  rationale: Repeating “he” makes the contrast easier to follow without adding a new claim.
- pob_phrase: at the end of the times
  simplified_phrase: at the end of the times
  preserved_meaning: His revelation occurred in the climactic, eschatological period described by the Greek phrase.
  reasoning_layer_used: POB lexical and theological decisions for ἐπ’ ἐσχάτου τῶν χρόνων
  rationale: This wording is retained because the POB deliberately avoids adding the word “these” and preserves the phrase’s temporal force.
- pob_phrase: for your sake
  simplified_phrase: for your sake
  preserved_meaning: The Messiah was revealed for the readers’ benefit.
  reasoning_layer_used: POB lexical decision for δι’ ὑμᾶς
  rationale: The phrase is already clear and more fully conveys benefit than the shorter “for you.”
translation_notes:
  source_alignment_notes: The draft keeps the POB’s controlling distinction between being known beforehand and the stronger interpretation “chosen beforehand.” It also preserves the creation-foundation image, the passive revelation language, the eschatological time reference, and the benefit expressed by “for your sake.”
  readability_notes:
  - Replaced the uncommon theological word “foreknown” with the plain phrase “known beforehand.”
  - Recast “the foundation of the world” as “the world was founded” while preserving the original image.
  - Repeated the subject “he” after “but” to make the contrast immediately clear.
  risk_flags:
  - risk: “Known beforehand” could be read as bare advance awareness and may not convey every possible implication of divine purpose.
    mitigation: The main text follows the POB’s deliberately restrained lexical choice, while footnote [a] preserves “chosen beforehand” as a possible interpretation.
  - risk: “At the end of the times” may sound less familiar than “in these last times.”
    mitigation: The POB wording is retained to avoid adding the deictic word “these”; footnote [b] gives the smoother alternative.
