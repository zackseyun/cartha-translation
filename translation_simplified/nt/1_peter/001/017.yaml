translation:
  language: en
  text: If you call God “Father”—the one who judges each person impartially according to what they do—then live in fear of him throughout your time as foreigners.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “If you call on God as Father.”
    reason: lexical_alternative
  - marker: b
    text: “Fear” may also convey reverence or reverent awe, but it retains the seriousness of being accountable to God as judge.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: call as Father the one who judges
  simplified_phrase: call God “Father”—the one who judges
  preserved_meaning: Believers address God as Father, and this same Father is the judge.
  reasoning_layer_used: POB lexical decisions for ἐπικαλεῖσθε and πατέρα; immediate clause context
  rationale: The POB wording is accurate but difficult in ordinary English. Naming God directly and using quotation marks makes the act of addressing him as Father immediately clear without weakening the link between Father and judge.
- pob_phrase: judges impartially according to each person's work
  simplified_phrase: judges each person impartially according to what they do
  preserved_meaning: God evaluates every individual without favoritism on the basis of that person's conduct.
  reasoning_layer_used: POB lexical decision for ἀπροσωπολήμπτως and κατὰ τὸ ἑκάστου ἔργον; theological decision on judgment according to works
  rationale: “What they do” expresses the collective sense of singular “work” in common English while preserving individual accountability and avoiding any added doctrinal framework.
- pob_phrase: conduct yourselves in fear
  simplified_phrase: live in fear of him
  preserved_meaning: The command concerns one's whole manner of life and retains the morally serious response of fear before God.
  reasoning_layer_used: POB lexical decisions for ἐν φόβῳ and ἀναστράφητε; theological decision to retain “fear”
  rationale: “Live” is more natural than “conduct yourselves.” The rendering keeps “fear” rather than softening it to reverence, and makes its contextual object explicit.
- pob_phrase: during the time of your sojourn
  simplified_phrase: throughout your time as foreigners
  preserved_meaning: Their present life is pictured as a temporary residence away from their true home.
  reasoning_layer_used: POB lexical decisions for παροικίας and the full duration phrase; POB footnote b
  rationale: “Sojourn” is unfamiliar to many readers. “Your time as foreigners” preserves both temporary residence and outsider status without implying a specifically political exile.
interpretive_expansions:
- pob_phrase: call as Father the one
  rendering: call God “Father”
  claim: The one being addressed as Father is God.
  evidence:
  - The POB rationale explicitly states that believers address God as Father.
  - The immediate context describes this Father as the impartial divine judge.
  confidence: high
  alternatives_preserved:
  - call on God as Father
- pob_phrase: in fear
  rendering: in fear of him
  claim: The fear is directed toward God, the Father and judge named in the conditional clause.
  evidence:
  - The command follows directly from the description of God as the impartial judge.
  - The POB theological rationale links φόβος to God the Father as judge.
  confidence: high
  alternatives_preserved:
  - with reverence
  - in reverent awe
retained_terms:
- term: Father
  reason: This is the central relational title in the verse and must remain linked to God's role as impartial judge.
- term: fear
  reason: The POB deliberately retains the source term's moral seriousness and the tension between divine fatherhood and judgment.
- term: impartially
  reason: This clear modern term accurately preserves the statement that God judges without favoritism.
translation_notes:
  source_alignment_notes: The draft preserves the conditional structure, God's identification as Father and impartial judge, judgment according to each person's conduct, the command to live in fear, and the foreign-resident image. It does not specify a doctrinal system of merit, final judgment, or assurance.
  readability_notes:
  - The dense single clause is clarified with an em dash and an explicit “then.”
  - “What they do” replaces the less natural collective singular “work.”
  - “Live” replaces the formal expression “conduct yourselves.”
  - “Time as foreigners” replaces the uncommon word “sojourn” while retaining its core image.
  compression_notes:
  - The ideas of temporary residence and foreign status are combined in “time as foreigners”; the wording does not specify political exile.
  - The collective sense of each person's “work” is expressed as “what they do.”
  risk_flags:
  - risk: Adding “God” and “of him” makes implicit referents explicit.
    mitigation: Both referents are strongly established by the POB rationale and immediate context, and they are documented as interpretive expansions.
  - risk: “What they do” could be heard as multiple deeds rather than the Greek collective singular “work.”
    mitigation: The phrase preserves the intended basis in each person's conduct and does not add a theological explanation.
  - risk: “Foreigners” may be understood socially or politically rather than as a temporary-residence image.
    mitigation: “Throughout your time” retains the temporary dimension, and no claim of forced political exile is added.
