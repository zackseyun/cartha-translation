simplification_decisions:
- pob_phrase: the outcome of your faith
  simplified_phrase: what your faith leads to
  preserved_meaning: Faith reaches a realized result or outcome, identified here as salvation.
  reasoning_layer_used: POB lexical decision for τέλος and its BDAG-based rationale
  rationale: The verbal phrase is easier for a common reader to understand than the abstract expression “the outcome of your faith.” It preserves the POB choice of realized result without making τέλος merely temporal or presenting it only as an intended goal.
- pob_phrase: the salvation of your souls
  simplified_phrase: the salvation of your souls
  preserved_meaning: The readers receive salvation concerning their souls, without the translation imposing a detailed body-soul theory.
  reasoning_layer_used: POB lexical and theological decisions for σωτηρίαν and ψυχῶν
  rationale: “Salvation” and “souls” are retained because they are important biblical terms and are the controlling POB choices. The footnote preserves the documented range of “souls” as “lives” or “persons.”
- pob_phrase: as you receive
  simplified_phrase: as you receive
  preserved_meaning: The receiving is presented as ongoing and remains linked to the preceding context.
  reasoning_layer_used: POB lexical decision for κομιζόμενοι and source syntax
  rationale: This wording is already clear and preserves both the participial connection and the ongoing sense without overstating the Greek voice.
interpretive_expansions:
- pob_phrase: the outcome of your faith
  rendering: what your faith leads to
  claim: The outcome is the realized result to which faith leads, namely salvation.
  evidence:
  - The POB lexical rationale says τέλος denotes the realized result of faith in this context.
  - The following appositional phrase identifies that result as “the salvation of your souls.”
  confidence: high
  alternatives_preserved:
  - end
  - goal
  - result
retained_terms:
- term: faith
  reason: This is the POB’s source-driven and theologically stable rendering of πίστις; replacing it with “trust” or “faithfulness” would shift the documented choice.
- term: salvation
  reason: This preserves the standard theological rendering of σωτηρία and its present and future fullness in 1 Peter.
- term: souls
  reason: This is the POB’s chosen direct rendering of ψυχῶν and preserves the source-language tension; its broader lexical possibilities are noted in the footnote.
translation_notes:
  source_alignment_notes: 'The draft preserves the source sequence: ongoing reception, the result of the readers’ faith, and the identification of that result as the salvation of their souls. It keeps the participial link to the preceding context through the opening “as.”'
  readability_notes:
  - The abstract noun phrase “the outcome of your faith” is recast as the natural verbal phrase “what your faith leads to.”
  - The dash clearly introduces “the salvation of your souls” as the explanation of what faith leads to.
  - The sentence remains a continuation of the preceding verse, matching the source and POB structure.
  compression_notes:
  - The separate lexical alternatives for τέλος are not listed in a footnote because the plain-language phrase already conveys the POB’s preferred result sense; they remain documented in the interpretive-expansion record.
  - The ψυχῶν alternatives are compressed into one concise reader-facing footnote.
  risk_flags:
  - risk: “What your faith leads to” could be read as assigning salvation to faith as an independent cause.
    mitigation: The wording is limited to the POB’s result sense of τέλος and does not say faith earns or causes salvation.
  - risk: Modern readers may understand “souls” as excluding bodily or whole-person salvation.
    mitigation: The footnote preserves “lives” and “persons” as possible meanings, while the audit rationale states that no strict body-soul dualism is being imposed.
