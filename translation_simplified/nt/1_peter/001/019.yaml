translation:
  language: en
  text: but by the precious blood of Messiah[a]—blood like that of a lamb with no blemish or spot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Christ.” “Messiah” makes the meaning of the Greek title clearer here.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: but with the precious blood of Messiah
  simplified_phrase: but by the precious blood of Messiah
  preserved_meaning: The strong contrast with perishable means in the previous verse remains, and Messiah’s literal blood remains the means by which the action is accomplished.
  reasoning_layer_used: POB lexical decisions for ἀλλὰ, τιμίῳ, αἵματι, and Χριστοῦ; immediate context in 1 Peter 1:18–19
  rationale: In this continuing sentence, “by” is more natural for modern readers than “with” while preserving the instrumental sense. “Precious blood” and “Messiah” are retained because they carry the source-driven sacrificial and christological meaning.
- pob_phrase: like that of a lamb without blemish and without spot
  simplified_phrase: blood like that of a lamb with no blemish or spot
  preserved_meaning: Messiah’s blood is compared with the blood of a sacrificially acceptable lamb, and both descriptions of the lamb’s perfection remain present.
  reasoning_layer_used: POB lexical decisions for ὡς, ἀμνοῦ, ἀμώμου, καὶ, and ἀσπίλου
  rationale: Repeating “blood” makes the comparison immediately clear. “With no blemish or spot” is shorter and more natural than the repeated “without,” while preserving the paired sacrificial images rather than reducing them to a general word such as “perfect.”
retained_terms:
- term: precious blood
  reason: The concrete noun “blood” must remain because it conveys Messiah’s sacrificial death through the source-language image; “precious” preserves both value and honor.
- term: Messiah
  reason: POB doctrine treats Χριστός as a title here and therefore prefers “Messiah”; the traditional rendering “Christ” is retained in the anchored footnote.
- term: blemish or spot
  reason: Both sacrificial descriptors are retained so the source’s paired images are not flattened into a single generalized description.
translation_notes:
  source_alignment_notes: The draft preserves the verse’s contrast, the literal reference to blood, the comparison specifically involving blood, the lamb image, both sacrificial descriptors, and POB’s title rendering “Messiah.” It remains a sentence fragment because the Greek and POB text continue the sentence begun in the preceding verse.
  readability_notes:
  - Changed instrumental “with” to the more natural “by.”
  - Repeated “blood” after the dash so readers can identify what is being compared.
  - Compressed “without blemish and without spot” to “with no blemish or spot” without removing either image.
  compression_notes:
  - The repeated preposition in the paired description was compressed, but both “blemish” and “spot” were preserved.
  risk_flags:
  - risk: Changing “with” to “by” could appear to alter the grammatical relationship.
    mitigation: The immediate context concerns the means of redemption, so “by” naturally expresses the same instrumental force.
  - risk: Using “or” instead of POB’s “and” may seem to weaken the coordination.
    mitigation: In the negative English construction “no blemish or spot,” both defects are denied; neither source descriptor is omitted.
