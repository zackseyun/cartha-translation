translation:
  language: en
  text: Since you have purified your souls by obeying the truth for sincere brotherly love,[a] love one another earnestly from the heart.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Brotherly love” means the family-like love shared by fellow believers, including both sisters and brothers.
    reason: lexical_alternative
  - marker: b
    text: Some manuscripts read “from a pure heart.”
    reason: textual_variant
simplification_decisions:
- pob_phrase: Having purified your souls by obedience to the truth
  simplified_phrase: Since you have purified your souls by obeying the truth
  preserved_meaning: The purification was completed before the command to love and remains relevant to that command. It took place through their obedient response to the truth.
  reasoning_layer_used: POB lexical decisions for ἡγνικότες and ἐν τῇ ὑπακοῇ τῆς ἀληθείας; independent grounding review
  rationale: “Since” keeps the opening clause joined to the main command instead of turning it into a separate assertion. The active phrase “by obeying” replaces the abstract wording “by obedience to” while preserving obedience as the means of purification.
- pob_phrase: for sincere brotherly love
  simplified_phrase: for sincere brotherly love
  preserved_meaning: Purification through obedience is directed toward, or results in, genuine family-like affection among believers.
  reasoning_layer_used: POB lexical and theological decisions for εἰς φιλαδελφίαν ἀνυπόκριτον and φιλαδελφίαν
  rationale: The wording retains the documented goal-or-result range of “for.” Keeping “brotherly love” also preserves the distinction between the two Greek love expressions, while the footnote explains that both women and men are included.
- pob_phrase: love one another earnestly from the heart
  simplified_phrase: love one another earnestly from the heart
  preserved_meaning: Believers are commanded to love each other with heartfelt intensity and persistence.
  reasoning_layer_used: POB lexical decisions for ἀγαπήσατε, ἀλλήλους, ἐκτενῶς, and ἐκ καρδίας; POB textual-variant decision
  rationale: This wording is already clear and direct. It preserves the command, the intensity of the love, and the source-language heart image. “Pure” remains in a textual-variant footnote rather than being added to the base text.
interpretive_expansions:
- pob_phrase: Having purified your souls
  rendering: Since you have purified your souls
  claim: The completed purification forms the background or basis for the following command to love.
  evidence:
  - The Greek perfect participle ἡγνικότες precedes and is syntactically linked to the main imperative ἀγαπήσατε.
  - The POB lexical rationale identifies the purification as completed with continuing relevance prior to the imperative.
  - The immediate sentence presents the participial clause as the setting for the command.
  confidence: moderate
  alternatives_preserved:
  - “Since” can convey the prior setting without requiring purification to be the sole cause of the command; “having” or “now that” remain possible ways to express the relationship.
retained_terms:
- term: souls
  reason: POB retains the direct lexical equivalent because it refers to the persons themselves in their inner life and should not be reduced merely to “lives” or “selves.”
- term: brotherly love
  reason: This preserves the familial force of φιλαδελφία and its distinction from the following broader command to love; the inclusive scope is explained in footnote [a].
- term: from the heart
  reason: This preserves the source-language heart image and follows the base text without importing the variant adjective “pure.”
translation_notes:
  source_alignment_notes: The draft follows the SBLGNT base text and the controlling POB decisions. It keeps purification prior to and connected with the imperative, obedience to the truth as its means, the goal-or-result range of “for,” the distinction between the two Greek love expressions, and the base reading “from the heart.” “Since” expresses the participial clause as the background for the command without claiming a more specific causal mechanism.
  readability_notes:
  - The abstract phrase “by obedience to the truth” is recast as the active phrase “by obeying the truth.”
  - The opening participle is expressed with “Since” so modern readers can readily follow its connection to the main command.
  - The verse remains one sentence because the opening clause directly frames the imperative.
  compression_notes:
  - The inclusive meaning of “brotherly love” is explained in a short footnote rather than expanded in the verse.
  - The goal-or-result range of “for” is left open rather than resolved with a longer explanatory phrase.
  risk_flags:
  - risk: “Since” may be heard as asserting strict causality beyond what the participle alone specifies.
    mitigation: The rendering is intended to mark the completed purification as the command’s background or basis, not to define an exclusive causal relationship; the purpose-or-result wording remains unchanged.
  - risk: Modern readers may understand “brotherly love” as referring only to men.
    mitigation: Footnote [a] states that the expression includes both sisters and brothers among fellow believers.
  - risk: The active wording may make purification sound wholly self-produced.
    mitigation: The verse retains the source text’s active construction but explicitly identifies obedience to the truth as the means, without adding a claim about independent human power.
  - risk: Readers may assume “from a pure heart” belongs in the base text.
    mitigation: The main text follows SBLGNT, while footnote [b] records the manuscript variant without importing it.
