translation:
  language: en
  text: He has gone into heaven and is at the right hand of God. Angels, authorities, and powers have been made subject to him.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: who is at the right hand of God, having gone into heaven
  simplified_phrase: He has gone into heaven and is at the right hand of God.
  preserved_meaning: Jesus entered heaven and now occupies the exalted position at God's right hand.
  reasoning_layer_used: POB lexical decisions for ὅς, πορευθεὶς, εἰς οὐρανόν, and ἐν δεξιᾷ θεοῦ; POB theological decision on Christ's exaltation
  rationale: The dense relative and participial construction is recast as a direct sentence in ordinary English. “Into heaven” and the important biblical idiom “at the right hand of God” are retained.
- pob_phrase: with angels and authorities and powers subjected to him
  simplified_phrase: Angels, authorities, and powers have been made subject to him.
  preserved_meaning: The full three-part list of heavenly or cosmic beings and powers has been brought into subordination to Christ.
  reasoning_layer_used: POB lexical decisions for ὑποταγέντων, αὐτῷ, ἀγγέλων, ἐξουσιῶν, and δυνάμεων; POB theological decision on the identity of the cosmic powers
  rationale: The awkward “with” construction becomes a separate sentence. “Have been made subject” clearly preserves the passive force and completed subordination without classifying the beings as good, evil, or mixed.
interpretive_expansions:
- pob_phrase: who
  rendering: He
  claim: The pronoun refers to Jesus Messiah from the preceding context.
  evidence:
  - The POB lexical rationale explicitly identifies Jesus Messiah in the previous verse as the antecedent of ὅς.
  - The verse continues the description of Christ's resurrection and exaltation from 1 Peter 3:21.
  confidence: high
  alternatives_preserved:
  - In continuous context, the verse may still be introduced with the relative pronoun “who.”
retained_terms:
- term: at the right hand of God
  reason: This biblical image carries important spatial-relational and exaltation meaning that should not be reduced to a paraphrase about honor alone.
- term: angels, authorities, and powers
  reason: The three distinct terms preserve the source list and its unresolved breadth concerning heavenly or cosmic beings.
translation_notes:
  source_alignment_notes: 'The draft preserves every source element: Christ''s movement into heaven, his position at God''s right hand, the threefold list of angels, authorities, and powers, and their completed passive subjection to him. It does not specify the moral character of those beings.'
  readability_notes:
  - Changed the relative-participial structure into two short declarative sentences.
  - Used “have been made subject” to express completed subordination in familiar English.
  - Retained the established biblical right-hand image because replacing it would lose theological force.
  compression_notes:
  - The connective “with” is not represented as a separate word; its accompanying circumstance is expressed by the second sentence.
  - No footnote is retained because the main text already uses the more source-precise “into heaven,” and the alternative “to heaven” adds little for a common reader.
  risk_flags:
  - risk: Changing “who” to “He” could weaken the visible grammatical link to the preceding verse.
    mitigation: The referent is securely established by the immediate context and POB lexical rationale; the change makes the verse readable as a direct sentence without changing its subject.
  - risk: “Made subject” may sound as though an unnamed agent imposed the subordination.
    mitigation: This preserves the Greek passive and avoids supplying an agent not explicitly named in the clause.
