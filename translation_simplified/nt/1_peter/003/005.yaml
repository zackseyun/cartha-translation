translation:
  language: en
  text: 'For this is also how the holy women of earlier times who hoped in God made themselves beautiful: they submitted to their own husbands.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: in this way formerly also
  simplified_phrase: this is also how ... of earlier times
  preserved_meaning: The women of past generations provide an example of the kind of adornment described in the preceding context.
  reasoning_layer_used: POB lexical decisions for οὕτως and ποτε; discourse context
  rationale: Reordered the temporal and demonstrative wording into natural English while preserving both the backward reference and the historical setting.
- pob_phrase: the holy women who hoped in God
  simplified_phrase: the holy women of earlier times who hoped in God
  preserved_meaning: These women were holy and were characterized by hope directed toward God.
  reasoning_layer_used: POB lexical decisions for ἅγιαι γυναῖκες and ἐλπίζουσαι εἰς θεόν
  rationale: Kept the important biblical term “holy” and the direct statement that their hope was in God.
- pob_phrase: adorned themselves
  simplified_phrase: made themselves beautiful
  preserved_meaning: Their conduct was the adornment or beauty being described in the immediate context.
  reasoning_layer_used: POB lexical decision for ἐκόσμουν ἑαυτάς and its listed alternative
  rationale: Replaced the less common verb “adorned” with the POB-approved plain-language alternative while preserving the beauty image.
- pob_phrase: submitting to their own husbands
  simplified_phrase: they submitted to their own husbands
  preserved_meaning: Submission to their own husbands describes the manner in which these women made themselves beautiful.
  reasoning_layer_used: POB lexical decision for ὑποτασσόμεναι; POB theological decision on marital scope
  rationale: Turned the participial phrase into a full clause for easier reading. Retained “their own” so the statement remains limited to the marital relationship rather than being broadened to all women and men.
interpretive_expansions:
- pob_phrase: adorned themselves, submitting to their own husbands
  rendering: 'made themselves beautiful: they submitted to their own husbands'
  claim: Their submission explains the manner of beauty or adornment meant here.
  evidence:
  - The POB lexical rationale states that the present participle expresses the manner in which they adorned themselves.
  - The immediate context concerns true beauty and adornment.
  confidence: high
  alternatives_preserved:
  - The wording still preserves the concrete beauty/adornment image rather than reducing it to general good conduct.
retained_terms:
- term: holy
  reason: This is the standard POB rendering of ἅγιος and preserves a significant biblical concept that “godly” would weaken.
- term: submitted
  reason: This preserves the POB lexical and theological decision for ὑποτασσόμεναι while keeping the scope limited to their own husbands.
translation_notes:
  source_alignment_notes: The draft retains the explanatory connector “For,” the backward-pointing “this is ... how,” the historical reference, the description “holy,” hope directed toward God, the adornment/beauty image, and submission specifically to each woman’s own husband. It does not broaden the verse into a claim about all women and all men.
  readability_notes:
  - Recast the opening into ordinary English word order.
  - Used “of earlier times” instead of the more formal “formerly.”
  - Changed the participial ending into a short independent clause after a colon.
  - Used “made themselves beautiful,” an alternative already documented by the POB lexical decision, instead of the less familiar “adorned themselves.”
  risk_flags:
  - risk: “Made themselves beautiful” could be mistaken for outward beautification.
    mitigation: The colon immediately identifies submission to their own husbands as the kind of beauty in view, preserving the contextual meaning.
  - risk: Restructuring the participle as a separate clause could obscure its manner relationship.
    mitigation: 'The colon makes the explanatory relationship explicit: their submission describes how they made themselves beautiful.'
