translation:
  language: en
  text: Sarah, for example, obeyed Abraham and called him “lord.” You have become her children if you do what is good and do not let any intimidation make you afraid.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “are not afraid of anything frightening.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: just as Sarah obeyed Abraham
  simplified_phrase: Sarah, for example, obeyed Abraham
  preserved_meaning: Sarah is presented as the specific model corresponding to the faithful conduct described in the preceding context, and the direct meaning “obeyed” is retained.
  reasoning_layer_used: POB lexical decisions for ὡς and ὑπήκουσεν; theological decision on Sarah’s exemplary obedience; independent grounding review
  rationale: “For example” clearly presents Sarah as the model while avoiding the vagueness of “did the same.” It expresses the comparative relationship in natural, plain English.
- pob_phrase: calling him lord
  simplified_phrase: called him “lord”
  preserved_meaning: Sarah used “lord” as a respectful designation for Abraham, not as a divine title.
  reasoning_layer_used: POB lexical decisions for κύριον and καλοῦσα
  rationale: A finite verb is easier to read than the participial phrase. Quotation marks identify “lord” as what Sarah called Abraham, while lowercase preserves its nondivine sense.
- pob_phrase: if you do good
  simplified_phrase: if you do what is good
  preserved_meaning: The readers display the conduct associated with being Sarah’s children by doing good.
  reasoning_layer_used: POB lexical decision for ἀγαθοποιοῦσαι and theological decision on the conditional force of the participles
  rationale: “Do what is good” is immediately understandable while preserving the conditional force and the distinct command to good conduct.
- pob_phrase: do not fear any intimidation
  simplified_phrase: do not let any intimidation make you afraid
  preserved_meaning: They must not yield to fear when faced with intimidation or frightening pressure.
  reasoning_layer_used: POB lexical decisions for μὴ φοβούμεναι and μηδεμίαν πτόησιν
  rationale: This wording plainly shows the relationship between intimidation and fear while retaining both the external pressure and the inward response. The broader lexical possibility remains in the footnote.
retained_terms:
- term: lord
  reason: The POB retains the source term as Sarah’s respectful designation for Abraham. Lowercase and quotation marks distinguish it from a divine title.
translation_notes:
  source_alignment_notes: The revision presents Sarah directly as the example introduced by the Greek comparison, retains the source-driven verb “obeyed,” preserves the figurative image of becoming her children, and maintains the POB’s conditional reading of the closing participles. It adds no broader theology of marriage.
  readability_notes:
  - Replaced the vague opening “did the same” with “for example” to state Sarah’s exemplary role clearly.
  - Changed participial wording into ordinary finite verbs.
  - Recast the final clause to make the connection between intimidation and fear immediately clear.
  risk_flags:
  - risk: Modern readers may mistake “lord” for a divine title or treat it as a comprehensive statement about marital authority.
    mitigation: The word is lowercase and quoted as Sarah’s form of address; the translation adds no broader doctrinal claim.
  - risk: “Intimidation” may sound narrower than the Greek term, which can also refer to terror or anything frightening.
    mitigation: The main text follows the POB’s contextual choice, and the footnote preserves the broader lexical alternative.
