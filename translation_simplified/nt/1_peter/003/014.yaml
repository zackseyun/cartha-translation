translation:
  language: en
  text: But even if you suffer for doing what is righteous, you are blessed. Do not fear their fear, and do not be troubled.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Their fear” may mean “fear of them” or “what they fear.” The wording reflects Isaiah 8:12 and leaves both meanings open.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: even if you should suffer
  simplified_phrase: even if you suffer
  preserved_meaning: Suffering for righteousness is presented as a real possibility, not as a certainty.
  reasoning_layer_used: Lexical decision for πάσχοιτε and the concessive construction ἀλλ’ εἰ καὶ
  rationale: In this conditional sentence, “even if you suffer” is more natural for common readers while still expressing the possibility conveyed by the Greek optative.
- pob_phrase: for righteousness
  simplified_phrase: for doing what is righteous
  preserved_meaning: The suffering happens because of morally upright conduct before God and others.
  reasoning_layer_used: Lexical and theological decisions for διὰ δικαιοσύνην; immediate Petrine ethical context
  rationale: The rendering explains how righteousness appears in this context while retaining the key theological word “righteous.”
- pob_phrase: you are blessed
  simplified_phrase: you are blessed
  preserved_meaning: Those who suffer for righteousness remain under God’s favor; the statement is not merely about feeling happy or being fortunate.
  reasoning_layer_used: Lexical decision for μακάριοι
  rationale: “Blessed” is already clear and preserves the biblical and theological force better than its alternatives.
- pob_phrase: their fear
  simplified_phrase: their fear
  preserved_meaning: The phrase may refer either to fear of the persecutors or to what those people themselves fear, while echoing Isaiah 8:12.
  reasoning_layer_used: Lexical decision for τὸν φόβον αὐτῶν, theological realignment revision, and POB footnote
  rationale: The unusual wording is intentionally retained because making it smoother in the main text would settle an ambiguity the POB preserves. The footnote explains the two main possibilities.
- pob_phrase: nor be troubled
  simplified_phrase: and do not be troubled
  preserved_meaning: Readers are commanded not to give way to inward agitation or alarm.
  reasoning_layer_used: Lexical decisions for μηδὲ ταραχθῆτε and δέ
  rationale: Using “and” instead of “nor” gives the coordinated command more natural modern English without weakening it.
interpretive_expansions:
- pob_phrase: for righteousness
  rendering: for doing what is righteous
  claim: Here righteousness is expressed in upright conduct for which believers may suffer.
  evidence:
  - The POB lexical rationale says the context concerns suffering for upright conduct before God and others.
  - The immediate context contrasts suffering for good conduct with suffering for evil.
  - The POB lists “for doing what is right” as an interpretive alternative while retaining the righteousness concept as controlling.
  confidence: high
  alternatives_preserved:
  - for righteousness
  - because of righteousness
retained_terms:
- term: blessed
  reason: It preserves the theological force of μακάριοι and avoids reducing the statement to emotion or favorable circumstances.
- term: righteous
  reason: It preserves the POB’s controlling theological decision for δικαιοσύνη while the surrounding wording explains its ethical sense.
- term: their fear
  reason: It preserves the deliberate ambiguity and the echo of Isaiah 8:12; the footnote supplies the principal interpretations.
translation_notes:
  source_alignment_notes: The draft preserves the concessive condition, the causal link between righteous conduct and suffering, the declaration of blessing, and both prohibitions. It also follows the doctrine-realignment revision by retaining “their fear” rather than choosing one interpretation.
  readability_notes:
  - The potential construction “should suffer” is recast as the more direct conditional “even if you suffer.”
  - The abstract phrase “for righteousness” is expressed as conduct—“for doing what is righteous”—without dropping the theological root.
  - The final coordinated prohibition uses modern “and” rather than “nor.”
  - A short footnote explains the one deliberately difficult phrase instead of over-resolving it in the main text.
  risk_flags:
  - risk: “For doing what is righteous” makes the ethical-conduct sense more explicit than the abstract noun in POB.
    mitigation: The immediate context and POB rationale strongly support upright conduct, and the rendering retains the theological term “righteous.”
  - risk: “Their fear” remains less immediately natural than ordinary modern English.
    mitigation: The wording is necessary to preserve the source ambiguity and Isaiah 8:12 echo; a concise footnote explains both major readings.
