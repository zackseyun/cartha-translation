translation:
  language: en
  text: For the Lord’s eyes are on righteous people, and his ears are open to their prayer. But his face is against those who do evil.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the righteous
  simplified_phrase: righteous people
  preserved_meaning: The Lord’s attentive regard is directed toward people characterized as righteous, not merely toward people performing isolated right actions.
  reasoning_layer_used: POB lexical decision for ἐπὶ δικαίους and independent grounding review
  rationale: “Righteous people” explains the substantival adjective in ordinary English while preserving the source’s characterizing category and avoiding an overly action-based paraphrase.
- pob_phrase: their prayer
  simplified_phrase: their prayer
  preserved_meaning: The Lord is attentive to the collective prayer or plea of righteous people.
  reasoning_layer_used: POB lexical decision for εἰς δέησιν αὐτῶν and independent grounding review
  rationale: The collective singular is clear in English and remains aligned with the source noun and POB wording.
- pob_phrase: but the face of the Lord is against
  simplified_phrase: But his face is against
  preserved_meaning: The Lord personally opposes those who do evil, expressed through the source text’s image of his face.
  reasoning_layer_used: POB lexical and theological decisions on πρόσωπον δὲ κυρίου
  rationale: Beginning a new sentence makes the contrast immediately clear. Using “his” avoids cumbersome repetition while keeping the Lord as the unambiguous referent and preserving the image of his face.
retained_terms:
- term: righteous
  reason: This key biblical category preserves the characterizing force of δικαίους more fully than an action-based expression such as “those who do what is right.”
- term: eyes, ears, and face
  reason: These source-language images are retained because they communicate the Lord’s attentive favor and personal opposition and echo the Psalm cited by the verse.
translation_notes:
  source_alignment_notes: The revision preserves the causal opening “For,” the Lord’s attentive regard toward righteous people, his openness to their collective prayer, the adversative contrast, and his opposition to those who do evil. It also retains the parallel imagery of the Lord’s eyes, ears, and face. The reviewed action-focused wording and unnecessary plural “prayers” have been corrected.
  readability_notes:
  - Rendered the noun-like expression “the righteous” as “righteous people,” which is natural English while preserving a category of character or identity.
  - Divided the favorable and adverse clauses into two sentences so the contrast is easy to follow.
  - Used “his” in the final clause because the Lord remains the clear referent.
  compression_notes:
  - Omitted the POB note explaining the Greek ellipsis behind “his ears are open” because the supplied English wording is already clear.
  - Omitted the alternative “because” because “For” clearly preserves the causal link in publication text.
  risk_flags:
  - risk: “Righteous” may be unfamiliar or carry assumptions for readers new to biblical language.
    mitigation: Adding “people” makes its grammatical function clear while retaining the source’s important characterizing category.
  - risk: The bodily imagery could be mistaken for a literal description of God’s physical form.
    mitigation: The imagery remains because the POB theological decision requires its literary and theological force to be preserved; no commentary was inserted into the verse.
