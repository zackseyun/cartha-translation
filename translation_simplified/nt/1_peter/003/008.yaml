translation:
  language: en
  text: Finally, all of you, be united in how you think. Share one another’s feelings. Love one another as brothers.[a] Be tenderhearted, and have a humble attitude.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek uses sibling-family language. “Brothers” here refers to the whole community of believers.
    reason: lexical_alternative
  - marker: b
    text: Some manuscripts read “courteous” or “friendly” instead of “humble.”
    reason: textual_variant
simplification_decisions:
- pob_phrase: Finally, all of you, be like-minded
  simplified_phrase: Finally, all of you, be united in how you think.
  preserved_meaning: The whole audience is called to share a common mindset and outlook.
  reasoning_layer_used: POB lexical decisions for Τὸ δὲ τέλος, πάντες, and ὁμόφρονες
  rationale: The adjective “like-minded” is recast as a direct, ordinary-English command while preserving its cognitive emphasis.
- pob_phrase: sympathetic
  simplified_phrase: Share one another’s feelings.
  preserved_meaning: Believers are to enter into and respond to the feelings of others.
  reasoning_layer_used: POB lexical decision for συμπαθεῖς
  rationale: The abstract adjective is expressed as a clear action without reducing it to general kindness.
- pob_phrase: loving as brothers
  simplified_phrase: Love one another as brothers.
  preserved_meaning: The believing community is to show the familial affection associated with siblings.
  reasoning_layer_used: POB lexical and theological decisions for φιλάδελφοι
  rationale: Adding “one another” makes the relationship natural in English while retaining the source’s brother imagery. The inclusive community sense remains explained in a footnote rather than replacing the wording.
- pob_phrase: tenderhearted
  simplified_phrase: Be tenderhearted
  preserved_meaning: Believers are to have deep inward compassion and warmhearted mercy.
  reasoning_layer_used: POB lexical decision for εὔσπλαγχνοι
  rationale: The term is already understandable and preserves the source’s strong inward-compassion image, so it is retained within a complete command.
- pob_phrase: humble-minded
  simplified_phrase: have a humble attitude
  preserved_meaning: Believers are to possess humility in their mindset and disposition.
  reasoning_layer_used: POB lexical and theological decisions for ταπεινόφρονες
  rationale: “Humble attitude” is more natural common English than “humble-minded” while preserving the mental and dispositional nuance. The manuscript variant remains in a footnote.
retained_terms:
- term: brothers
  reason: Retains the Greek sibling-family image and the POB’s source-driven gendered wording; the representative community sense is clarified in a footnote.
- term: tenderhearted
  reason: Preserves the source term’s image of deep inward compassion and remains understandable in modern English.
translation_notes:
  source_alignment_notes: 'The draft preserves all five exhortations in the Greek adjective sequence: shared outlook, sympathy, sibling-like love, deep compassion, and humility of attitude. It follows the SBLGNT reading ταπεινόφρονες and preserves the significant variant only in a footnote.'
  readability_notes:
  - The dense list of adjectives is divided into four short sentences.
  - Abstract qualities are recast as direct commands in natural English.
  - The final comma is replaced with publication-ready sentence punctuation.
  risk_flags:
  - risk: “Be united in how you think” could be heard as requiring complete agreement on every matter.
    mitigation: The wording is limited to unity of outlook and does not add claims about uniformity; it remains anchored to the POB sense of “like-minded.”
  - risk: The masculine wording “brothers” may be mistaken as excluding women.
    mitigation: The footnote states that the sibling-family term refers to the whole believing community.
