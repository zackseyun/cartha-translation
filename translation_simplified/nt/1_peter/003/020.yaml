translation:
  language: en
  text: They had disobeyed long ago, in the days of Noah. While the ark was being prepared, God waited patiently. Only a few people[a]—eight in all—entered it and were brought safely through water.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “souls.” Here the word means persons.
    reason: lexical_alternative
  - marker: b
    text: Or “were saved through water.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: who formerly were disobedient
  simplified_phrase: They had disobeyed long ago
  preserved_meaning: The people in view refused to obey at an earlier time.
  reasoning_layer_used: POB lexical decisions for ἀπειθήσασίν and ποτε
  rationale: The active wording is easier to understand than the participial phrase while preserving deliberate disobedience rather than reducing it to intellectual unbelief. “Long ago” expresses the past-time reference of “formerly.”
- pob_phrase: when the patience of God was waiting in the days of Noah
  simplified_phrase: in the days of Noah. … God waited patiently
  preserved_meaning: God restrained judgment and continued waiting during Noah’s time.
  reasoning_layer_used: POB lexical decisions for ἀπεξεδέχετο and μακροθυμία
  rationale: The abstract phrase becomes the natural clause “God waited patiently.” Dividing the sentence makes the time setting easier to follow while the surrounding “while” clause preserves the ongoing character of the waiting.
- pob_phrase: while the ark was being prepared
  simplified_phrase: While the ark was being prepared
  preserved_meaning: The ark was in the process of being made ready during God’s patient waiting.
  reasoning_layer_used: POB lexical decisions for κατασκευαζομένης and κιβωτοῦ
  rationale: This wording is already clear and preserves the broader idea of preparation without limiting it to construction alone.
- pob_phrase: into which a few—that is, eight persons
  simplified_phrase: Only a few people—eight in all—entered it
  preserved_meaning: A small number, specifically eight human beings, went into the ark.
  reasoning_layer_used: POB lexical decisions for εἰς ἣν, ὀλίγοι, and ψυχαί; POB theological decision on ψυχαί
  rationale: “Entered it” naturally expresses the movement into the ark. “Only” brings out the stated small number, and “eight in all” gives the exact total clearly. “People” avoids suggesting a technical distinction between souls and bodies.
- pob_phrase: were brought safely through water
  simplified_phrase: were brought safely through water
  preserved_meaning: The eight were preserved through the danger associated with the water.
  reasoning_layer_used: POB lexical decision for διεσώθησαν and δι’ ὕδατος; POB theological decision on soteriological wording; independent grounding review
  rationale: The concrete preservation language remains rather than being replaced by the more theologically loaded “saved.” The wording leaves “water” without an added definite article, preserving the POB’s deliberate openness and the transition to baptism in the next verse.
interpretive_expansions:
- pob_phrase: a few
  rendering: Only a few
  claim: The number preserved was notably small.
  evidence:
  - The POB lexical rationale states that the point is the small number saved.
  - The following phrase specifies eight persons.
  confidence: high
  alternatives_preserved:
  - a few
- pob_phrase: into which
  rendering: entered it
  claim: The eight people moved into the ark.
  evidence:
  - The POB lexical decision says εἰς indicates movement into rather than mere location.
  - The relative pronoun refers to the ark.
  confidence: high
  alternatives_preserved:
  - went into it
  - into which
retained_terms:
- term: ark
  reason: This is the established and accurate term in the account of Noah, and the POB lexical decision retains it.
translation_notes:
  source_alignment_notes: The revision preserves past disobedience, God’s ongoing patient delay, the preparation of the ark, movement into it, the small total of eight persons, and their concrete preservation through water. It removes the added article before “water,” resolving the grounding review’s concern and retaining the POB’s wording for the transition to baptism. The valid alternative “were saved through water” remains in a footnote. Footnote markers are attached to the phrases they explain.
  readability_notes:
  - The long dependent construction is divided into three short sentences.
  - The abstract wording about God’s patience is recast as the direct clause “God waited patiently.”
  - “Entered it” replaces the difficult relative construction “into which.”
  - “Eight in all” explains the exact number immediately.
  compression_notes:
  - The progressive sense of God’s waiting is conveyed by its placement within the “while” construction without retaining the abstract wording “the patience of God was waiting.”
  - The ark is called “it” in the final sentence to avoid unnecessary repetition.
  risk_flags:
  - risk: Changing the opening relative pronoun “who” to “They” slightly reduces the verse’s visible grammatical link to the preceding verse.
    mitigation: The pronoun still signals continuation from the preceding context and avoids supplying an antecedent not named in this verse.
  - risk: “Only” makes the smallness implied by “a few” explicit.
    mitigation: The POB lexical rationale expressly says the small number is the point, and the exact total of eight limits the emphasis.
  - risk: “Through water” can be understood in more than one way, including passage through danger or instrumentality.
    mitigation: That openness belongs to the controlling POB rendering and supports the transition to the baptism comparison in the next verse; the alternative “saved through water” is footnoted.
