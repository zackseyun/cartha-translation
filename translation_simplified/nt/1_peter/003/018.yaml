translation:
  language: en
  text: Messiah also suffered once for sins.[a] He, the righteous one, suffered for the unrighteous so that he might bring you to God. He was put to death in the flesh but made alive in the spirit.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some manuscripts read “died” instead of “suffered.”
    reason: textual_variant
  - marker: b
    text: Or “made alive by the Spirit.” The Greek may refer either to life in the sphere of spirit or to being made alive through the Holy Spirit.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: For Messiah also suffered once for sins, the righteous for the unrighteous
  simplified_phrase: Messiah also suffered once for sins. He, the righteous one, suffered for the unrighteous
  preserved_meaning: Messiah suffered a single time for sins, and the righteous Messiah suffered on behalf of unrighteous people.
  reasoning_layer_used: POB lexical decisions for Χριστός, ἅπαξ, περὶ ἁμαρτιῶν, δίκαιος, and ὑπὲρ ἀδίκων; substitutionary-force theological decision
  rationale: The long opening clause was divided into two sentences, and the implied subject was made explicit. The representative contrast between the righteous Messiah and the unrighteous remains intact without expanding it into a fuller theory of atonement.
- pob_phrase: so that he might bring you to God
  simplified_phrase: so that he might bring you to God
  preserved_meaning: Messiah’s suffering had the purpose of bringing people into God’s presence and granting them access to him.
  reasoning_layer_used: POB lexical decision for προσαγάγῃ
  rationale: This phrase is already clear common English and preserves the verb’s relational and access-related sense without adding interpretation.
- pob_phrase: having been put to death in the flesh but made alive in the spirit
  simplified_phrase: He was put to death in the flesh but made alive in the spirit
  preserved_meaning: Messiah was put to death with respect to embodied mortal existence and made alive with respect to spirit, while the precise force of “spirit” remains open.
  reasoning_layer_used: POB lexical decisions for θανατωθεὶς, σαρκί, ζῳοποιηθεὶς, and πνεύματι; flesh/spirit theological decision
  rationale: The participial construction was recast as a direct sentence. “Flesh” and lowercase “spirit” were retained because replacing or capitalizing them would resolve the deliberate Greek ambiguity. The alternative agency reading is preserved in the footnote.
retained_terms:
- term: Messiah
  reason: The POB requires this title for Χριστός to preserve its messianic sense.
- term: flesh
  reason: This preserves the source-language contrast with “spirit” and avoids interpreting the word as either merely “body” or “sinful nature.”
- term: spirit
  reason: Lowercase “spirit” preserves the debated sphere/aspect reading in the main text; the possible reference to the Holy Spirit as agent remains in a footnote.
translation_notes:
  source_alignment_notes: The draft follows the SBLGNT reading “suffered,” retains “once” without adding “for all,” preserves “the righteous for the unrighteous,” and leaves the final flesh/spirit contrast unresolved as required by the POB audit trail.
  readability_notes:
  - The dense Greek-style sentence was divided into three short English sentences.
  - The participial phrase “having been put to death” was changed to the direct clause “He was put to death.”
  - The repeated verb “suffered” makes the relationship between “the righteous one” and “the unrighteous” immediately clear.
  compression_notes:
  - No central claim was removed.
  - The second sentence restates “suffered” to clarify the compact phrase “the righteous for the unrighteous.”
  risk_flags:
  - risk: Repeating “suffered” could sound more expansive than the compact Greek construction.
    mitigation: The repetition only supplies the verb already governing the contrast and adds no new event or doctrinal claim.
  - risk: Modern readers may take “spirit” as an unambiguous reference to either Messiah’s human spirit or the Holy Spirit.
    mitigation: Lowercase wording preserves the POB’s main reading, while footnote b explicitly records the Holy Spirit agency reading and the underlying ambiguity.
