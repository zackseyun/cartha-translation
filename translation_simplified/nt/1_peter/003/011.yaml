translation:
  language: en
  text: But let him turn his back on evil and do what is good.[a] Let him seek peace and go after it.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek says “him,” but the command applies to anyone.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: turn away from evil
  simplified_phrase: turn his back on evil
  preserved_meaning: He must decisively reject what is morally evil.
  reasoning_layer_used: POB lexical decision for ἐκκλινάτω and ἀπὸ κακοῦ
  rationale: “Turn his back on” is a familiar directional image that preserves the Greek verb’s force rather than reducing the command to merely avoiding evil.
- pob_phrase: do good
  simplified_phrase: do what is good
  preserved_meaning: He must actively practice morally good conduct.
  reasoning_layer_used: POB lexical decision for ποιησάτω ἀγαθόν
  rationale: The expanded wording is immediately clear in modern English while keeping the active ethical command.
- pob_phrase: let him seek peace and pursue it
  simplified_phrase: Let him seek peace and go after it.
  preserved_meaning: He must both look for peace and actively continue after it.
  reasoning_layer_used: POB lexical decisions for ζητησάτω, εἰρήνην, and διωξάτω αὐτήν
  rationale: “Go after it” expresses the strong pursuit image in common English while preserving the progression from seeking peace to pursuing it.
- pob_phrase: let him
  simplified_phrase: let him
  preserved_meaning: The masculine singular command has representative, generic force.
  reasoning_layer_used: POB grammatical and theological decision on third-person singular imperatives
  rationale: The main text retains the audited source form, while the anchored footnote explains to common readers that the command applies generally.
retained_terms:
- term: peace
  reason: This standard biblical term preserves the broad meaning of εἰρήνη and clearly remains the object of both commands.
translation_notes:
  source_alignment_notes: 'The draft preserves all four commands: turn away, do good, seek peace, and pursue peace. It retains “But” for the mild contrast and “let him” for the representative masculine singular form.'
  readability_notes:
  - The verse is divided into two short sentences.
  - “Turn his back on” and “go after it” use familiar English while preserving the source-language movement images.
  - The footnote briefly explains the generic force of “him.”
  risk_flags:
  - risk: “Turn his back on” could be read as an English idiom rather than a directional image.
    mitigation: The idiom matches the POB decision that the command means decisive moral turning away, and “evil” keeps the ethical domain explicit.
  - risk: Modern readers may assume that “him” limits the command to men.
    mitigation: Footnote [a] states that the Greek form is masculine but representative and applies to anyone.
