translation:
  language: en
  text: Do not pay back evil with evil or insult with insult. Instead, respond by blessing. God called you to live this way so that you might inherit a blessing.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: not repaying evil for evil or insult for insult
  simplified_phrase: Do not pay back evil with evil or insult with insult.
  preserved_meaning: Believers must not retaliate against wrongdoing or abusive speech by responding in kind.
  reasoning_layer_used: Source syntax and POB lexical decisions for ἀποδιδόντες, κακὸν ἀντὶ κακοῦ, and λοιδορίαν ἀντὶ λοιδορίας.
  rationale: The participial exhortation is recast as a direct command, and the more conversational phrasal verb “pay back” makes the retaliatory exchange clear while preserving the moral force of “evil” and the parallel “insult with insult.”
- pob_phrase: but on the contrary blessing
  simplified_phrase: Instead, respond by blessing.
  preserved_meaning: 'Rather than retaliating, believers are to make the opposite response: blessing.'
  reasoning_layer_used: POB lexical decision for τοὐναντίον δὲ and εὐλογοῦντες, supported by the immediate ethical contrast.
  rationale: “Instead” expresses the strong reversal naturally. “Respond by blessing” supplies an ordinary English verbal frame without narrowing blessing to either speaking well or invoking God’s favor.
- pob_phrase: because you were called to this
  simplified_phrase: God called you to live this way
  preserved_meaning: God’s calling includes the pattern of blessing rather than retaliating.
  reasoning_layer_used: POB theological decision and explanatory footnote c concerning the divine caller and the immediate referent of “this.”
  rationale: The passive and the vague pointer “this” are made explicit so a new reader can readily identify both the caller and the conduct in view. “Live this way” remains broad enough to include the wider Christian pattern of suffering and non-retaliation.
- pob_phrase: so that you might inherit a blessing
  simplified_phrase: so that you might inherit a blessing
  preserved_meaning: The calling has the intended purpose or result that believers receive blessing as heirs.
  reasoning_layer_used: POB lexical decisions for ἵνα, εὐλογίαν, and κληρονομήσητε.
  rationale: This wording is already clear and preserves the important inheritance image rather than reducing it to merely receiving something.
interpretive_expansions:
- pob_phrase: you were called to this
  rendering: God called you to live this way
  claim: God is the one who calls believers, and “this” points primarily to responding to mistreatment with blessing rather than retaliation.
  evidence:
  - POB footnote c explicitly identifies God as the caller and explains the response in view.
  - The POB theological decision says the immediate context favors linking “to this” with the preceding exhortation.
  - The passive ἐκλήθητε is understood in the POB rationale as referring to God’s calling.
  confidence: high
  alternatives_preserved:
  - The calling may also refer more broadly to the Christian life of suffering and non-retaliation; “live this way” does not exclude that wider scope.
retained_terms:
- term: evil
  reason: It preserves the moral weight of the POB and the source rather than reducing the meaning to generic harm or unpleasantness.
- term: blessing
  reason: It preserves the lexical breadth of speaking well and invoking favor, as well as the deliberate repetition between giving blessing and inheriting blessing.
- term: inherit
  reason: It preserves the covenantal and familial image of receiving blessing as an heir.
translation_notes:
  source_alignment_notes: 'The draft preserves all three movements of the Greek and POB: refusal to retaliate, the emphatic reversal toward blessing, and God’s calling with the purpose or result of inheriting blessing. It retains the parallel forms “evil with evil” and “insult with insult,” as well as the repeated blessing language.'
  readability_notes:
  - The opening participle is turned into a direct command.
  - The verse is divided into short sentences to make the contrast and reason easy to follow.
  - The vague phrase “called to this” is clarified from the POB’s own theological reasoning.
  compression_notes:
  - The lexical footnote about “reviling” is omitted because “insult” is clear and the alternate does not materially aid a common reader.
  - The footnote on “on the contrary” is absorbed into the natural transition “Instead.”
  - The explanatory calling footnote is incorporated into the main text.
  risk_flags:
  - risk: Naming God in the main text makes the divine agent explicit although the Greek uses a passive construction.
    mitigation: The POB lexical rationale, theological decision, and footnote c all explicitly identify God as the caller; the expansion is documented rather than presented as independent source wording.
  - risk: “Respond by blessing” could be heard only as spoken words.
    mitigation: The retained term “blessing” preserves the POB’s intended breadth, including both speaking well and invoking God’s favor.
