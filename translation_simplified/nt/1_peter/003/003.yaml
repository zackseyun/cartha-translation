translation:
  language: en
  text: The way you make yourselves beautiful should not be centered on outward things—braided hair, gold jewelry, or clothing.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Or, more literally, “Your adornment must not be outward: braided hair, gold jewelry, or putting on clothing.” In context, Peter gives priority to inner character rather than imposing a complete ban on grooming, jewelry, or clothing.'
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Do not let your adornment be the outward one
  simplified_phrase: The way you make yourselves beautiful should not be centered on outward things
  preserved_meaning: Outward appearance must not be the defining focus of their adornment; inner character has priority in the continuing sentence.
  reasoning_layer_used: POB theological decision and immediate context in verse 4
  rationale: The concrete phrase “the way you make yourselves beautiful” explains “adornment” in common English. “Centered on” preserves the POB’s comparative or subordinating reading without turning the verse into an absolute prohibition.
- pob_phrase: braiding of hair
  simplified_phrase: braided hair
  preserved_meaning: Hair arranged in braids is one example of outward adornment.
  reasoning_layer_used: POB lexical decision for ἐμπλοκῆς τριχῶν
  rationale: The adjective construction is shorter and more natural while retaining the same image.
- pob_phrase: wearing of gold jewelry
  simplified_phrase: gold jewelry
  preserved_meaning: Gold ornaments worn as outward decoration are in view.
  reasoning_layer_used: POB lexical decision for περιθέσεως χρυσίων
  rationale: Within a list of outward things, the act of wearing is understood and does not need to be repeated.
- pob_phrase: putting on of clothing
  simplified_phrase: clothing
  preserved_meaning: Clothing is retained as the third example of outward adornment without adding a quality such as costly or fine.
  reasoning_layer_used: POB lexical decision for ἐνδύσεως ἱματίων and independent grounding review
  rationale: The compact noun fits the parallel list and remains faithful to the source’s general term for clothing. The literal action, “putting on clothing,” remains in the footnote.
interpretive_expansions:
- pob_phrase: Do not let your adornment be the outward one
  rendering: should not be centered on outward things
  claim: The prohibition subordinates outward display to inner character rather than absolutely banning every listed practice.
  evidence:
  - The POB theological decision explicitly chooses a comparative or subordinating sense.
  - Verse 4 contrasts outward adornment with the hidden person of the heart.
  - An absolute reading of “putting on clothing” would imply a blanket prohibition on wearing clothes.
  confidence: high
  alternatives_preserved:
  - The more literal negative wording is preserved in footnote a.
translation_notes:
  source_alignment_notes: The draft preserves the three distinct examples—hair, gold, and clothing—and follows the POB’s audited comparative reading. It corrects the earlier unsupported narrowing from “clothing” to “fine clothing” while retaining the approved clarity of “should not be centered on.”
  readability_notes:
  - Replaced the abstract noun “adornment” in the main text with the familiar phrase “the way you make yourselves beautiful.”
  - Converted the three verbal-noun expressions into a compact, parallel list.
  - Kept the sentence direct and used familiar vocabulary.
  compression_notes:
  - The actions of braiding, wearing, and putting on are compressed into concrete noun phrases because the opening clause already presents them as ways of making oneself beautiful.
  - The em dash introduces the three examples of outward adornment.
  risk_flags:
  - risk: “Centered on” states the comparative interpretation more explicitly than the surface form of the Greek negation.
    mitigation: This follows the POB’s chosen theological reading and the contrast in verse 4; the more literal construction is preserved in footnote a.
  - risk: Reducing “putting on of clothing” to “clothing” omits the verbal-noun form.
    mitigation: The action is readily understood within the list of ways people make themselves beautiful, and the literal wording remains in footnote a.
