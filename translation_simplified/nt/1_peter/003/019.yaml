translation:
  language: en
  text: In this,[a] he also went and delivered a proclamation[b] to the spirits held in prison.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “in whom”; alternatively, “by this.” The Greek can be understood in more than one way in relation to the preceding sentence.
    reason: alternative_reading
  - marker: b
    text: Or “preached.” The word means to announce a message publicly, but this verse does not say what the message was.
    reason: lexical_alternative
  - marker: c
    text: The verse does not identify these spirits. They may be deceased humans or fallen angelic beings.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: in which
  simplified_phrase: In this
  preserved_meaning: The action remains connected to the preceding clause without defining that connection as personal, instrumental, or strictly temporal.
  reasoning_layer_used: POB lexical and theological decisions on ἐν ᾧ
  rationale: “In this” is more natural in common English while retaining the deliberately open reference. Footnote a preserves the major alternatives.
- pob_phrase: he went and proclaimed
  simplified_phrase: he also went and delivered a proclamation
  preserved_meaning: He went and made an announcement whose content and purpose are not specified.
  reasoning_layer_used: POB lexical decision on πορευθεὶς and theological decision on ἐκήρυξεν
  rationale: “Delivered a proclamation” makes the action immediately understandable while avoiding the evangelistic implication that “preached” may carry.
- pob_phrase: to the spirits in prison
  simplified_phrase: to the spirits held in prison
  preserved_meaning: The recipients are spirits under confinement, but their identity remains unresolved.
  reasoning_layer_used: POB lexical decisions on πνεύμασιν and ἐν φυλακῇ; POB theological decision on the spirits’ identity
  rationale: Adding “held” expresses the ordinary meaning of being in prison without identifying the spirits or changing the imprisonment image.
retained_terms:
- term: spirits
  reason: The source and POB intentionally leave their identity open; replacing this with “souls,” “dead people,” or “fallen angels” would settle a disputed interpretation.
- term: proclamation
  reason: This preserves the heralding sense while leaving the message’s content unspecified.
- term: prison
  reason: The confinement image is clear in ordinary English and is important to the source wording.
translation_notes:
  source_alignment_notes: 'The draft preserves the additive force of “also,” the movement expressed by “went,” the unspecified proclamation, the prison image, and both major documented ambiguities: the reference of ἐν ᾧ and the identity of the spirits.'
  readability_notes:
  - The opening was recast from the less natural “in which” to “In this,” with the ambiguity retained in a footnote.
  - The verb “proclaimed” was unpacked as the natural English phrase “delivered a proclamation.”
  - “Held in prison” makes the condition of the spirits explicit without interpreting who they are.
  risk_flags:
  - risk: “In this” may still be unclear when the verse is read apart from verse 18.
    mitigation: The phrase must remain connected to the preceding context, and footnote a explains the genuine grammatical alternatives without choosing among them.
  - risk: Readers may assume that the proclamation was the gospel, a declaration of judgment, or an announcement of victory.
    mitigation: The main text uses the neutral term “proclamation,” and footnote b states that the verse does not specify its content.
  - risk: Readers may identify the imprisoned spirits too confidently.
    mitigation: The main text retains “spirits,” and footnote c presents the principal possibilities without resolving the debate.
