translation:
  language: en
  text: When the Chief Shepherd is revealed[a], you will receive the crown[b] of glory that will never fade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “appears.”
    reason: alternative_reading
  - marker: b
    text: The Greek word translated “crown” can refer to a wreath awarded as a prize of honor, not specifically a royal crown.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And when the Chief Shepherd is revealed
  simplified_phrase: When the Chief Shepherd is revealed
  preserved_meaning: The promised reward comes when Christ, the supreme shepherd, is manifested.
  reasoning_layer_used: POB lexical and theological decisions for φανερωθέντος and ἀρχιποίμενος
  rationale: The opening “And” was omitted because the verse reads naturally without it. “Is revealed” and the title “Chief Shepherd” were retained to preserve the passive manifestation language and the Christological title.
- pob_phrase: the unfading crown of glory
  simplified_phrase: the crown of glory that will never fade
  preserved_meaning: The recipients will receive the specified enduring prize of honor associated with glory.
  reasoning_layer_used: POB lexical decisions for ἀμαράντινον, τῆς δόξης, and στέφανον; independent grounding review
  rationale: The compact adjective “unfading” was expanded into the immediately understandable clause “that will never fade.” The definite article “the” was retained as required by the Greek and POB, and “crown of glory” preserves the reward image and genitive relationship.
retained_terms:
- term: Chief Shepherd
  reason: This is the POB’s clear rendering of the Christological title ἀρχιποίμενος and preserves the shepherd image.
- term: crown of glory
  reason: This preserves the biblical reward metaphor and the POB’s compact relationship between crown and glory; the footnote clarifies the possible honor-wreath sense.
translation_notes:
  source_alignment_notes: The revision preserves the temporal force and passive manifestation nuance of the Greek participle, the title “Chief Shepherd,” the future promise of receiving the reward, the definite article before “crown,” and the image of a crown that does not fade. The footnotes preserve the documented alternative “appears” and qualify the possible wreath sense without presenting it as the only possible referent.
  readability_notes:
  - Expanded “unfading” into the more immediately understandable clause “that will never fade.”
  - Kept the sentence short and direct while preserving its solemn tone.
  compression_notes:
  - Omitted the initial connective “And” because it is unnecessary in a clear standalone English verse and does not change the central meaning.
  risk_flags:
  - risk: Modern readers may assume that “crown” refers specifically to a royal crown.
    mitigation: The lexical footnote explains that the Greek word can refer to a prize wreath while avoiding the claim that it must denote a literal wreath.
  - risk: Rendering “is revealed” simply as “appears” could flatten the passive manifestation nuance.
    mitigation: The main text retains “is revealed,” while “appears” remains as an alternative in a footnote.
