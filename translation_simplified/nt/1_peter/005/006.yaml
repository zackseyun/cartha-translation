    mitigation: The expansion is directly supported by the POB lexical rationale and retains the source’s lifting image.
  - risk: The reflexive English command may obscure that the Greek imperative is passive in form.
    mitigation: Footnote [a] gives the direct passive alternative, “Be humbled,” and explains the commonly understood reflexive force.
