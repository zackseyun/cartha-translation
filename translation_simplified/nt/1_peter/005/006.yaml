translation:
  language: en
  text: So humble yourselves[a] under God’s mighty hand, so that he may lift you up to honor at the proper time.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Be humbled.” The Greek command is passive in form, but it is commonly understood here to mean “humble yourselves.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: therefore
  simplified_phrase: So
  preserved_meaning: This command follows from the preceding teaching that God opposes the proud but gives grace to the humble.
  reasoning_layer_used: Lexical decision for οὖν and immediate context
  rationale: “So” expresses the same logical conclusion in more common English.
- pob_phrase: under the mighty hand of God
  simplified_phrase: under God’s mighty hand
  preserved_meaning: Believers are to humble themselves in submission to God’s powerful and sovereign action.
  reasoning_layer_used: Lexical and theological decisions for ὑπὸ τὴν κραταιὰν χεῖρα τοῦ θεοῦ
  rationale: The possessive form is more natural in modern English while preserving the biblical image of God’s mighty hand.
- pob_phrase: he may exalt you
  simplified_phrase: he may lift you up to honor
  preserved_meaning: God is the one who will raise the humble to honor or vindication.
  reasoning_layer_used: Lexical decision for ὑμᾶς ὑψώσῃ
  rationale: “Lift you up to honor” explains the intended sense of “exalt” while retaining the source’s upward image.
- pob_phrase: at the proper time
  simplified_phrase: at the proper time
  preserved_meaning: God acts at the fitting or appointed time, not merely after an unspecified amount of time.
  reasoning_layer_used: Lexical decision for ἐν καιρῷ
  rationale: The POB wording is already clear and accurately conveys the source meaning.
interpretive_expansions:
- pob_phrase: exalt you
  rendering: lift you up to honor
  claim: The lifting refers to elevation to honor or vindication rather than physical movement.
  evidence:
  - The POB lexical rationale states that ὑψόω here refers to God raising the humble to honor or vindication.
  - The contrast between present humility and God’s later exaltation supports this sense.
  confidence: high
  alternatives_preserved:
  - exalt you
  - raise you up
  - lift you up in vindication
retained_terms:
- term: mighty hand
  reason: This recognizable biblical image preserves the source metaphor for God’s powerful, sovereign action.
translation_notes:
  source_alignment_notes: The draft preserves the reflexive command, the logical connection to the preceding context, submission under God’s mighty hand, God’s agency in later exaltation, and the fitting or appointed character of the time. The footnote directly retains the audited passive alternative, “Be humbled,” without introducing the unsupported idea of merely allowing oneself to be humbled.
  readability_notes:
  - Replaced the more formal connector “therefore” with “So.”
  - Changed the genitive phrase to the natural possessive “God’s mighty hand.”
  - Explained “exalt” as “lift you up to honor” while preserving the upward image.
  risk_flags:
