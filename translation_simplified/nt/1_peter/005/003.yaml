translation:
  language: en
  text: Do not dominate the people entrusted to your care.[a] Instead, become examples for the flock.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek literally says “the lots” or “the allotted portions,” referring here to the portions of God’s flock entrusted to each elder’s care.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: not domineering over
  simplified_phrase: Do not dominate
  preserved_meaning: Elders must not exercise their authority in an oppressive or overbearing way; the wording does not forbid legitimate leadership.
  reasoning_layer_used: POB lexical decision and theological decision for κατακυριεύοντες
  rationale: “Dominate” is direct, common English that preserves the verb’s negative force without suggesting that every exercise of authority is forbidden.
- pob_phrase: those allotted to your care
  simplified_phrase: the people entrusted to your care
  preserved_meaning: The phrase refers to believers placed under each elder’s pastoral care, emphasizing stewardship rather than ownership.
  reasoning_layer_used: POB lexical decision for τῶν κλήρων, theological decision on church leadership, and latest doctrine realignment
  rationale: “The people entrusted to your care” immediately identifies the human referent and restores the audited stewardship emphasis. The literal allotment image is retained in the footnote.
- pob_phrase: but becoming examples to the flock
  simplified_phrase: Instead, become examples for the flock
  preserved_meaning: Exemplary conduct is the required contrast to domineering leadership, and elders are to embody such conduct in practice.
  reasoning_layer_used: POB lexical decisions for ἀλλά, γινόμενοι, τύποι, and τοῦ ποιμνίου
  rationale: A separate sentence makes the strong contrast easier to follow. “Become” preserves the verbal force, while “examples” and “flock” retain the POB’s chosen terms and pastoral image.
interpretive_expansions:
- pob_phrase: those allotted to your care
  rendering: the people entrusted to your care
  claim: The allotted portions are groups of believers placed under the elders’ pastoral care.
  evidence:
  - The immediate context addresses elders shepherding God’s flock.
  - The POB lexical rationale identifies the phrase as portions of God’s people assigned to particular elders’ care.
  - The POB theological decision explicitly rejects an ownership or merely territorial sense.
  - The latest doctrine realignment restores the stewardship wording “those entrusted to you.”
  confidence: high
  alternatives_preserved:
  - The literal sense “the lots” or “the allotted portions” is preserved in footnote a.
retained_terms:
- term: flock
  reason: This preserves the source-language pastoral image of the believing community as sheep under care.
- term: become
  reason: This preserves the active, developing force of γινόμενοι rather than reducing it to a static description.
translation_notes:
  source_alignment_notes: 'The draft preserves the verse’s two-part contrast: elders must not use authority oppressively but must embody a pattern others can follow. It follows the POB’s controlling interpretation of τῶν κλήρων as people entrusted to pastoral care while retaining the literal allotment language in a footnote.'
  readability_notes:
  - The dense participial contrast is recast as two short imperative sentences.
  - “Dominate” replaces the less common verbal form “domineering over.”
  - The human referent of the allotted portions is stated directly as “the people.”
  compression_notes:
  - The coordination carried over from the preceding verse is expressed as a direct command suitable for this verse in context.
  - No distinct command, contrast, or pastoral image has been removed.
  risk_flags:
  - risk: “Dominate” could be read broadly as condemning all leadership.
    mitigation: Its ordinary negative sense indicates oppressive control, and the positive contrast with becoming examples clarifies that exemplary leadership remains in view.
  - risk: Replacing “allotted” with “entrusted” could hide the Greek allotment image.
    mitigation: Footnote a explicitly preserves the literal wording and explains its contextual reference.
