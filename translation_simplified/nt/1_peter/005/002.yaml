translation:
  language: en
  text: Care for God’s flock among you as a shepherd. Watch over them, not because you are forced to, but willingly, according to God.[a] Do not serve for shameful profit, but eagerly.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “as God would have it” or “in keeping with God’s will.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Shepherd the flock of God among you
  simplified_phrase: Care for God’s flock among you as a shepherd
  preserved_meaning: The elders must actively care for the people who belong to God, while the flock-and-shepherd image remains explicit.
  reasoning_layer_used: POB lexical decision for ποιμάνατε and τὸ ἐν ὑμῖν ποίμνιον τοῦ θεοῦ
  rationale: The verb “shepherd” may be unfamiliar as a command. Recasting it as “care ... as a shepherd” makes the required action clear without removing the pastoral metaphor or implying that the flock belongs to the elders.
- pob_phrase: exercising oversight
  simplified_phrase: Watch over them
  preserved_meaning: The elders are to supervise and care for God’s flock without turning the activity into a formal church-office title.
  reasoning_layer_used: POB lexical and theological decisions for ἐπισκοποῦντες
  rationale: “Watch over” is ordinary English that retains both attentive care and oversight. The separate sentence also makes clear how the shepherding is carried out.
- pob_phrase: not under compulsion but willingly
  simplified_phrase: not because you are forced to, but willingly
  preserved_meaning: Their service must arise from willing choice rather than coercion or pressured necessity.
  reasoning_layer_used: POB lexical decisions for μὴ ἀναγκαστῶς and ἀλλὰ ἑκουσίως
  rationale: “Not because you are forced to” states the contrast in immediately understandable English while retaining “willingly” as the positive command.
- pob_phrase: according to God
  simplified_phrase: according to God
  preserved_meaning: The service must correspond in some way to God—possibly to his will, standard, or desired manner—without resolving the compressed phrase too narrowly.
  reasoning_layer_used: POB lexical and theological decision for κατὰ θεόν
  rationale: The wording is retained because the audit explicitly protects its semantic compression. The footnote gives the leading clearer interpretations without making either one certain in the text.
- pob_phrase: nor for shameful gain, but eagerly
  simplified_phrase: Do not serve for shameful profit, but eagerly
  preserved_meaning: The elders must not be motivated by disgraceful financial benefit; they must undertake the work with readiness and eagerness.
  reasoning_layer_used: POB lexical decisions for μηδὲ αἰσχροκερδῶς and ἀλλὰ προθύμως
  rationale: A direct command is easier to follow than the coordinated adverbial phrase. “Profit” clarifies the economic sense of “gain,” while “eagerly” remains distinct from the earlier “willingly.”
retained_terms:
- term: flock
  reason: Retained to preserve the source-language pastoral image and God’s ownership of the people.
- term: according to God
  reason: Retained because the POB reasoning deliberately leaves open whether the phrase points especially to God’s will, standard, or manner.
- term: shameful
  reason: Retained to preserve the strong moral judgment attached to pursuing profit from this service.
translation_notes:
  source_alignment_notes: 'The draft preserves every major contrast in the source: shepherding and oversight, coercion versus willingness, conformity to God, and shameful profit versus eagerness. It keeps God—not the elders—as owner of the flock and avoids converting oversight into a denominational office title. The placement of footnote [a] after “according to God” aligns the note with κατὰ θεόν, the phrase discussed in the POB lexical and theological reasoning.'
  readability_notes:
  - The long POB sentence is divided into three short sentences.
  - The verbal command “Shepherd” is expressed as the clearer action “Care ... as a shepherd,” preserving the image.
  - “Exercising oversight” becomes the common expression “Watch over them.”
  - “Under compulsion” becomes “because you are forced to.”
  compression_notes:
  - The pronoun “them” refers directly to God’s flock and avoids repeating the full noun phrase.
  - “Do not serve” gathers the ongoing shepherding and oversight activity into a natural command without merging or deleting either activity from the preceding sentences.
  risk_flags:
  - risk: “Care for ... as a shepherd” could be read as softer than the imperative “Shepherd.”
    mitigation: The wording remains a direct command, explicitly retains the shepherd image, and is followed by the concrete command “Watch over them.”
  - risk: “Watch over” may emphasize care more than administration.
    mitigation: The phrase naturally includes responsible supervision, and the theological guardrail against importing a technical office title is maintained.
  - risk: “According to God” remains difficult for a common reader.
    mitigation: It is retained to protect the documented ambiguity, with two clear interpretive alternatives supplied in the footnote.
