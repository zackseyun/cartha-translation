translation:
  language: en
  text: Hand all your anxiety over to him, because he cares for you.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: casting all your anxiety on him
  simplified_phrase: Hand all your anxiety over to him
  preserved_meaning: Transfer every anxious concern to God rather than continuing to carry it yourself.
  reasoning_layer_used: POB lexical decisions for πᾶσαν, μέριμναν, ἐπιρίψαντες, and ἐπ’ αὐτόν; POB theological decision identifying the pronoun's referent from verse 6
  rationale: “Hand ... over” is immediately understandable modern English and preserves the source image of transferring a burden onto another. “All” retains the comprehensive force, and “anxiety” retains the POB distinction between anxious worry and neutral concern. The participial wording is recast as a direct exhortation so the verse reads naturally on its own.
- pob_phrase: because he cares for you
  simplified_phrase: because he cares for you
  preserved_meaning: God's active concern for his people is the reason they can entrust their anxiety to him.
  reasoning_layer_used: POB lexical decisions for ὅτι, μέλει, and περὶ ὑμῶν; approved POB main text
  rationale: The clause is already clear, natural English and preserves both the stated reason and its relational force.
retained_terms:
- term: anxiety
  reason: The POB deliberately uses this term for anxious care or worry rather than neutral concern; it is also clear in modern English.
translation_notes:
  source_alignment_notes: The draft preserves the verse's full scope (“all”), anxious-care sense (“anxiety”), burden-transfer image (“hand ... over”), contextual pronoun (“him,” referring to God in verse 6), and causal basis (“because he cares for you”).
  readability_notes:
  - Recast the dependent participle as a direct exhortation for clear standalone reading.
  - Used the familiar expression “hand ... over” instead of the less common biblical expression “cast ... on.”
  risk_flags:
  - risk: Changing the participle “casting” into a direct exhortation may make its grammatical dependence on the command in verse 6 less visible.
    mitigation: The rendering preserves the same exhortational action, while the source-alignment record notes that “him” refers to God from the immediate context.
  - risk: “Hand ... over” softens the physical motion in the source image of casting something onto another.
    mitigation: The phrase still clearly presents anxiety as a burden transferred from the reader to God and avoids the overly colloquial “throw.”
