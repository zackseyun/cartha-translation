translation:
  language: en
  text: She who is in Babylon[a][b] and was chosen together with you sends you greetings. Mark, my son,[c] also sends you greetings.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek does not say exactly who “she” is. It may mean, “The church in Babylon, chosen together with you.”
    reason: alternative_reading
  - marker: b
    text: “Babylon” may be a symbolic name for Rome, but the text itself says “Babylon.”
    reason: cultural_note
  - marker: c
    text: “My son” probably describes Mark as Peter’s spiritual son, not his biological son.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: She who is in Babylon, chosen together with you, greets you
  simplified_phrase: She who is in Babylon and was chosen together with you sends you greetings.
  preserved_meaning: An unnamed feminine referent in Babylon shares in God’s choosing with the readers and greets them.
  reasoning_layer_used: POB lexical and theological decisions on ἡ ... συνεκλεκτὴ, συνεκλεκτὴ, and ἀσπάζεται
  rationale: The added finite verb “was” makes the elliptical description easier to follow without supplying an identity such as “church” or “woman.” “Sends you greetings” is a natural English expression of the letter-writing sense of the Greek verb.
- pob_phrase: and so does Mark, my son
  simplified_phrase: Mark, my son, also sends you greetings.
  preserved_meaning: Mark joins in sending greetings, and Peter calls him his son.
  reasoning_layer_used: POB lexical decisions on Μᾶρκος and ὁ υἱός μου
  rationale: A separate sentence removes the compressed expression “and so does” and states the shared action directly. The familial wording “my son” remains unchanged because the source does not explicitly say “spiritual son.”
- pob_phrase: in Babylon
  simplified_phrase: in Babylon
  preserved_meaning: The named location remains Babylon without deciding whether it refers literally to Babylon or symbolically to Rome.
  reasoning_layer_used: POB lexical and theological decision on ἐν Βαβυλῶνι
  rationale: The place name is retained exactly because replacing it with “Rome” would resolve a documented ambiguity.
retained_terms:
- term: Babylon
  reason: The Greek directly names Babylon, while a possible symbolic reference to Rome remains historically debated.
- term: my son
  reason: The source uses literal familial language; the likely spiritual relationship is explained only in a footnote.
- term: She who is
  reason: This preserves the feminine singular expression and avoids supplying an unstated noun such as “church” or identifying a particular woman.
translation_notes:
  source_alignment_notes: 'The draft preserves all controlling POB choices: the feminine referent remains unnamed, Babylon remains in the main text, “chosen together with you” retains the shared-election sense, and Mark remains “my son.” The common church interpretation, the possible identification of Babylon with Rome, and the likely spiritual sense of “son” remain in footnotes rather than being asserted in the translation.'
  readability_notes:
  - The long coordinated sentence is divided into two short sentences.
  - “Sends you greetings” makes the epistolary action explicit in ordinary modern English.
  - The finite wording “was chosen” makes the elliptical modifier easier to understand.
  compression_notes:
  - The second occurrence of the greeting is stated directly rather than through the compressed phrase “and so does.”
  - No documented ambiguity or distinct source idea was removed.
  risk_flags:
  - risk: Readers may assume “she” refers to a particular woman.
    mitigation: Footnote [a] states that the Greek leaves the identity implicit and gives the common church interpretation.
  - risk: Readers may assume Babylon must be the Mesopotamian city.
    mitigation: Footnote [b] preserves the possible symbolic reference to Rome without changing the main text.
  - risk: Readers may understand Mark as Peter’s biological son.
    mitigation: Footnote [c] explains the likely spiritual sense while retaining the source’s literal familial language.
