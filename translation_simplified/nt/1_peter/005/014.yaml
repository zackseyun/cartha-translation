simplification_decisions:
- pob_phrase: with a kiss of love
  simplified_phrase: with a loving kiss
  preserved_meaning: The greeting is expressed through a kiss characterized by love. Both the concrete kiss and its loving character are retained.
  reasoning_layer_used: POB lexical decision for ἐν φιλήματι ἀγάπης and independent grounding review
  rationale: “A loving kiss” is natural modern English and is a direct alternative documented in the POB audit trail. It avoids implying that the kiss must demonstrate or prove the readers’ love.
- pob_phrase: who are in Messiah
  simplified_phrase: who are united with Messiah
  preserved_meaning: The blessing is for everyone whose identity and life are joined to the Messiah.
  reasoning_layer_used: POB lexical and theological rationales for τοῖς ἐν Χριστῷ
  rationale: The POB reasoning explicitly says that the phrase denotes union with the Anointed One. “United with Messiah” makes this relationship clear to readers who might misunderstand the literal English phrase “in Messiah,” while retaining the source-driven title “Messiah.”
interpretive_expansions:
- pob_phrase: who are in Messiah
  rendering: who are united with Messiah
  claim: Being “in Messiah” describes union with the Messiah rather than physical location.
  evidence:
  - The POB lexical rationale states that the phrase denotes union with the Anointed One.
  - The POB theological decision explicitly identifies union with the Anointed One as the theological sense of ἐν Χριστῷ.
  confidence: high
  alternatives_preserved:
  - who are in Messiah
  - who are in Christ
retained_terms:
- term: Messiah
  reason: POB’s controlling theological decision renders Χριστός as the title “Messiah”; the traditional form “Christ” is preserved in the footnote.
translation_notes:
  source_alignment_notes: 'The draft preserves both parts of the verse: the mutual command to greet with a kiss characterized by love and the inclusive blessing of peace. It retains the concrete kiss image, the full scope of “all of you,” and the source-driven title “Messiah.”'
  readability_notes:
  - “A loving kiss” naturally expresses that love characterizes the kiss without adding a demonstrative or performative sense.
  - “United with Messiah” makes the relational meaning of “in Messiah” understandable on first reading.
  - The verse remains two short, direct sentences.
  risk_flags:
  - risk: “United with Messiah” states the relational sense more explicitly than the POB main text.
    mitigation: This clarification is directly supported by both the POB lexical and theological rationales. The familiar traditional wording is also preserved in a footnote.
