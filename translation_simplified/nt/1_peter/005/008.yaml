translation:
  language: en
  text: Keep a clear mind[a] and stay spiritually awake. Your adversary, the devil, walks around like a roaring lion, looking for someone to devour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally, “Be sober-minded.” Here the Greek refers to mental clarity and self-control, not abstaining from alcohol.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Be clear-minded; stay alert.
  simplified_phrase: Keep a clear mind and stay spiritually awake.
  preserved_meaning: 'Preserves the two distinct commands: maintain mental clarity and remain watchfully alert.'
  reasoning_layer_used: POB lexical decisions for νήψατε and γρηγορήσατε; doctrine realignment; immediate devil/lion context
  rationale: “Keep a clear mind” is more natural common English than the adjectival command “Be clear-minded.” “Stay spiritually awake” makes the kind of vigilance clear without merging it with mental clarity.
- pob_phrase: Your adversary, the devil
  simplified_phrase: Your adversary, the devil
  preserved_meaning: Identifies the hostile opponent as the personal evil being called the devil while leaving room for the possible legal coloring of “adversary.”
  reasoning_layer_used: POB lexical and theological decisions for ἀντίδικος and διάβολος
  rationale: These terms remain understandable and carry important source-driven meaning that broader wording such as “enemy” could partially obscure.
- pob_phrase: walks around like a roaring lion
  simplified_phrase: walks around like a roaring lion
  preserved_meaning: Retains both the ordinary movement verb and the vivid image of a threatening predator.
  reasoning_layer_used: POB lexical and theological decisions for περιπατεῖ and ὡς λέων ὠρυόμενος
  rationale: The wording is already clear modern English. Keeping “walks around” follows the POB choice not to build the interpretive idea of prowling into the main text.
- pob_phrase: seeking someone to devour
  simplified_phrase: looking for someone to devour
  preserved_meaning: The devil actively searches for a person to consume, as a lion attacks prey.
  reasoning_layer_used: POB lexical decisions for ζητῶν, τινα, and καταπιεῖν
  rationale: “Looking for” is more immediate common English than “seeking,” while “devour” is retained because it preserves the violent force of the lion image.
interpretive_expansions:
- pob_phrase: stay alert
  rendering: stay spiritually awake
  claim: The required alertness concerns vigilance against spiritual attack, not merely physical wakefulness or general attentiveness.
  evidence:
  - The following clause identifies the devil as the threatening adversary.
  - The roaring-lion comparison presents an active spiritual danger.
  - The POB rationale describes γρηγορήσατε as wakeful vigilance and νήψατε as mental clarity under spiritual attack.
  - The source keeps mental clarity and alertness as paired but distinct commands.
  confidence: high
  alternatives_preserved:
  - stay alert
  - be watchful
  - keep watch
retained_terms:
- term: adversary
  reason: It preserves the hostile-opponent sense and leaves room for the legal nuance documented in the POB lexical decision.
- term: the devil
  reason: The POB identifies διάβολος here as the recognized personal designation for Satan, not merely a generic slanderer.
- term: devour
  reason: It preserves the violent predatory force and source-language image of swallowing up.
translation_notes:
  source_alignment_notes: The draft follows the POB’s restored reading “clear-minded,” keeps the two opening commands distinct, retains “walks around” rather than strengthening it to “prowls,” and preserves the roaring-lion and devouring imagery. The traditional “sober-minded” rendering remains in a concise lexical footnote.
  readability_notes:
  - Recast “Be clear-minded” as the more natural command “Keep a clear mind.”
  - Made the domain of alertness explicit to prevent readers from understanding the command as merely staying physically awake.
  - Replaced “seeking” with the common phrase “looking for.”
  compression_notes:
  - Compressed the detailed explanation of νήφω into one reader-focused footnote while preserving the traditional alternative and the distinction from literal sobriety.
  - Omitted the optional “prowls around” footnote because the main wording is clear and the alternative is not necessary for ordinary-reader understanding.
  risk_flags:
  - risk: Adding “spiritually” could be mistaken for inserting a separate doctrinal idea.
    mitigation: The immediate reference to the devil and the predatory lion image clearly establish spiritual attack as the domain of the alertness command; the expansion is documented rather than treated as unmarked certainty.
  - risk: “Spiritually awake” might appear to overlap with “Keep a clear mind.”
    mitigation: The wording preserves separate mental-clarity and vigilance commands, matching the two Greek imperatives and the POB lexical reasoning.
  - risk: Retaining “adversary” is slightly less common than “enemy.”
    mitigation: The term remains broadly understandable and protects the hostile and potentially legal nuance intentionally preserved by the POB.
