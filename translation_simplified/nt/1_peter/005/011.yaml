translation:
  language: en
  text: Ruling power belongs to him forever and ever. Amen.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: To him be the dominion
  simplified_phrase: Ruling power belongs to him
  preserved_meaning: The doxology directly ascribes sovereign ruling power to God; it does not express a wish that he might acquire it.
  reasoning_layer_used: POB lexical decision for αὐτῷ and κράτος; POB theological decision on the implied verbal predicate; independent grounding review
  rationale: “Ruling power” explains the less familiar “dominion,” while “belongs to him” expresses the Greek verbless doxology as a clear present ascription. It avoids the misleading wish-like sense of the earlier wording, “May ruling power be his.”
- pob_phrase: forever and ever
  simplified_phrase: forever and ever
  preserved_meaning: God’s ruling power belongs to him for an emphatically unending duration.
  reasoning_layer_used: POB lexical decision for εἰς τοὺς αἰῶνας τῶν αἰώνων
  rationale: This familiar English expression clearly conveys unending duration and preserves the emphatic force of the source idiom.
- pob_phrase: Amen
  simplified_phrase: Amen
  preserved_meaning: The conventional closing affirmation retains its biblical and liturgical force.
  reasoning_layer_used: POB lexical decision for ἀμήν
  rationale: This established biblical term is retained because replacing it would weaken the recognizable closing affirmation.
interpretive_expansions:
- pob_phrase: dominion
  rendering: ruling power
  claim: The power ascribed to God is sovereign power exercised in rule, not merely abstract strength.
  evidence:
  - The POB lexical rationale states that κράτος in this doxology denotes ruling power or dominion rather than mere abstract strength.
  - The preceding context identifies God as the referent of “him.”
  confidence: high
  alternatives_preserved:
  - dominion
  - might
  - power
  - strength
retained_terms:
- term: Amen
  reason: It is the conventional English transliteration and preserves the verse’s closing biblical and liturgical affirmation.
translation_notes:
  source_alignment_notes: The draft preserves POB’s identification of God as the referent, its interpretation of κράτος as sovereign ruling power, its emphatic expression of unending duration, and its treatment of the Greek verbless clause as a doxological ascription. The declarative wording reflects POB’s acknowledged alternative, “To him belongs the dominion,” without introducing an optative sense.
  readability_notes:
  - Replaced the formal construction “To him be” with the direct modern statement “belongs to him.”
  - Explained the less familiar word “dominion” as “ruling power.”
  - Kept the verse brief and solemn.
  risk_flags:
  - risk: “Belongs to him” may sound slightly less formally doxological than POB’s “To him be.”
    mitigation: It is an alternative reading explicitly recognized in the POB theological reasoning and more clearly communicates a present, enduring ascription rather than a wish.
