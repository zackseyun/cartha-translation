translation:
  language: en
  text: Above all, keep loving one another deeply, because love covers many sins.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This wording echoes Proverbs 10:12. “Covers” may include overlooking offenses rather than stirring them up, but the wording does not limit the meaning to that explanation alone.
    reason: cross_reference
simplification_decisions:
- pob_phrase: maintain fervent love for one another
  simplified_phrase: keep loving one another deeply
  preserved_meaning: The believers are to continue in intense, earnest mutual love.
  reasoning_layer_used: POB lexical decisions for ἔχοντες, ἐκτενῆ, and εἰς ἑαυτούς; applied revision establishing exhortational force
  rationale: “Keep loving” expresses the continuing command in ordinary English, while “deeply” communicates the intensity of “fervent” without using less familiar religious vocabulary.
- pob_phrase: a multitude of sins
  simplified_phrase: many sins
  preserved_meaning: Love covers a great number of sins.
  reasoning_layer_used: POB lexical decision for πλῆθος, which lists “many” as an acceptable alternative
  rationale: “Many” is immediately understandable and preserves the collective sense, though in a less formal expression.
- pob_phrase: love covers
  simplified_phrase: love covers
  preserved_meaning: The source-language metaphor remains open as to precisely how love covers sins.
  reasoning_layer_used: POB lexical and theological decisions for καλύπτει; Proverbs 10:12 echo
  rationale: The metaphor is retained rather than replaced with “forgives,” “conceals,” or “overlooks,” since any one of those would narrow the documented ambiguity.
retained_terms:
- term: covers
  reason: Retains the source metaphor and its deliberate theological openness.
- term: sins
  reason: Preserves the standard biblical term because a softer substitute such as “mistakes” or “faults” would weaken the meaning.
translation_notes:
  source_alignment_notes: The draft preserves the priority expressed by πρὸ πάντων, the reciprocal force of εἰς ἑαυτούς, the intensity of ἐκτενῆ, the causal force of ὅτι, and the covering metaphor of καλύπτει. It does not specify whose sins are covered or define covering as forgiveness, concealment, or overlooking alone.
  readability_notes:
  - Recast the abstract phrase “maintain fervent love” as the direct verbal command “keep loving.”
  - Used “deeply” instead of the less common “fervently.”
  - Changed “a multitude of” to the common equivalent “many.”
  compression_notes:
  - “A multitude of sins” is compressed to “many sins” without changing the claim that a great number is in view.
  risk_flags:
  - risk: “Deeply” may emphasize intensity more than the possible persistence nuance of ἐκτενῆ.
    mitigation: “Keep loving” carries the continuing or persistent aspect, while “deeply” carries the intensity.
  - risk: Readers may interpret “covers” as hiding wrongdoing or as automatic forgiveness.
    mitigation: The footnote notes a contextually supported sense while preserving the metaphor’s broader ambiguity.
