translation:
  language: en
  text: 'This is why the gospel was also proclaimed to the dead: although they were judged by human standards in bodily life,[a] they might live according to God in the spirit.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek literally says “according to men in the flesh.” The exact kind of judgment is not specified; the wording may point to human judgment or to judgment experienced in bodily human life.
    reason: lexical_alternative
  - marker: b
    text: Or “in spirit.” This may refer to a spiritual mode or sphere of life, in contrast with bodily life. Some understand it more specifically as life by the Spirit.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: For this is why
  simplified_phrase: This is why
  preserved_meaning: The verse explains the purpose or reason connected with the preceding discussion.
  reasoning_layer_used: POB lexical decision for εἰς τοῦτο
  rationale: Removing “For” makes the opening more natural in common English without losing its explanatory connection.
- pob_phrase: the gospel was also proclaimed to the dead
  simplified_phrase: the gospel was also proclaimed to the dead
  preserved_meaning: The good news was announced even to those called “the dead,” whose precise identity remains unspecified.
  reasoning_layer_used: POB lexical decisions for νεκροῖς and εὐηγγελίσθη; POB theological decision on the identity of “the dead”
  rationale: This wording is already clear and preserves the deliberate ambiguity rather than identifying the dead as physically or spiritually dead.
- pob_phrase: though judged according to men in the flesh
  simplified_phrase: although they were judged by human standards in bodily life
  preserved_meaning: They underwent judgment according to a human standard or perspective within the sphere of bodily human existence.
  reasoning_layer_used: POB lexical decisions for κριθῶσι, κατὰ ἀνθρώπους, and σαρκὶ; POB theological decision on the force of the contrast
  rationale: “Human standards” clearly expresses the standard or perspective conveyed by “according to men,” while “bodily life” prevents readers from mistaking “flesh” for sinful nature. Footnote [a] preserves the literal wording and uncertainty about the kind of judgment.
- pob_phrase: they might live according to God in the spirit
  simplified_phrase: they might live according to God in the spirit
  preserved_meaning: Their intended life is defined by God and belongs to a spiritual mode or sphere, in deliberate contrast with bodily existence.
  reasoning_layer_used: POB lexical decisions for ζῶσι, κατὰ θεὸν, and πνεύματι; POB theological decision to preserve the unresolved contrast
  rationale: The wording retains the important parallel between human standards and God, and between bodily life and spirit. Footnote [b] cautiously explains the spiritual sense without suggesting a particular postmortem location and preserves the possible reference to the Holy Spirit.
interpretive_expansions:
- pob_phrase: according to men
  rendering: by human standards
  claim: The phrase concerns a human standard or perspective rather than limiting “men” to adult males.
  evidence:
  - The POB lexical rationale states that κατά with the accusative expresses standard or perspective.
  - The POB footnote gives “according to human standards” as an allowed rendering.
  - The phrase stands in deliberate contrast with “according to God.”
  confidence: high
  alternatives_preserved:
  - according to people
  - according to men
- pob_phrase: in the flesh
  rendering: in bodily life
  claim: “Flesh” here refers to the sphere of bodily human existence rather than specifically to sinful nature.
  evidence:
  - The POB lexical rationale identifies a literal, non-metaphorical use of σάρξ.
  - The immediate contrast is with “in the spirit.”
  confidence: high
  alternatives_preserved:
  - in the flesh
  - with respect to the flesh
  - in the body
retained_terms:
- term: the dead
  reason: Retained to avoid resolving the disputed identity of those who received the proclamation.
- term: the gospel
  reason: Retained as a major biblical term that clearly conveys the good news proclaimed.
- term: spirit
  reason: Retained in lowercase to preserve the flesh-spirit contrast without deciding whether the phrase specifically refers to the Holy Spirit.
translation_notes:
  source_alignment_notes: The draft preserves the verse’s explanatory and purpose structure, passive proclamation, reference to “the dead,” and two-part contrast between judgment in bodily human existence and life according to God in the spirit. It does not decide whether the dead were physically or spiritually dead, what precise judgment occurred, or whether “spirit” specifically refers to the Holy Spirit.
  readability_notes:
  - The unnecessary opening connective “For” was removed.
  - “According to men” was recast inclusively and idiomatically as “by human standards.”
  - “In the flesh” was expressed as “in bodily life” to prevent confusion with the concept of sinful nature.
  - The balanced single sentence preserves the central contrast.
  - Footnote [b] uses “mode or sphere of life” rather than “spiritual realm,” avoiding an unintended suggestion of a postmortem location.
  risk_flags:
  - risk: “By human standards” may sound more specifically like judgment performed by people than the Greek requires.
    mitigation: Footnote [a] gives the literal wording and states that the exact kind of judgment remains unspecified.
  - risk: “Bodily life” interprets the domain of “flesh” rather than retaining the biblical term.
    mitigation: The rendering follows the POB rationale that this is bodily human existence, not sinful nature, and footnote [a] preserves the literal expression.
  - risk: Readers may identify “the spirit” directly with the Holy Spirit.
    mitigation: Lowercase “spirit” is retained, and footnote [b] presents life by the Spirit only as one possible understanding.
