translation:
  language: en
  text: And if the righteous is saved with great difficulty,[a] where will the ungodly and the sinner appear?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This means that the righteous are saved through severe trials, not that their final salvation is uncertain. It may also be translated “is barely saved.”
    reason: lexical_alternative
  - marker: b
    text: Or “where will the ungodly and the sinner be found?”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: is scarcely saved
  simplified_phrase: is saved with great difficulty
  preserved_meaning: The righteous person’s salvation involves difficulty and severe trial; the verse does not say that final salvation is uncertain.
  reasoning_layer_used: POB lexical decision for μόλις and theological decision on μόλις σῴζεται
  rationale: “Scarcely” can sound archaic or suggest that salvation is doubtful. “With great difficulty” uses the documented lexical alternative and makes the hardship clearer while the footnote preserves the theological qualification.
- pob_phrase: the righteous
  simplified_phrase: the righteous
  preserved_meaning: A representative singular referring to the person who is righteous.
  reasoning_layer_used: POB lexical and theological decisions for δίκαιος
  rationale: The term was retained because the POB deliberately preserves the Greek representative singular and its compact proverbial form.
- pob_phrase: where will the ungodly and the sinner appear?
  simplified_phrase: where will the ungodly and the sinner appear?
  preserved_meaning: The rhetorical question contrasts the righteous person’s difficult salvation with the far more serious position of those who do not honor God and who sin.
  reasoning_layer_used: POB lexical decisions for ἀσεβής, ἁμαρτωλός, ποῦ, and φανεῖται
  rationale: The wording preserves both distinct descriptions and the source-language image of appearing somewhere rather than replacing the question with the more interpretive “what will happen to them?”
retained_terms:
- term: the righteous
  reason: Retained to preserve the representative singular and the POB’s source-driven theological wording.
- term: the ungodly
  reason: Retained because it expresses the moral and religious sense of a person who does not honor God.
- term: the sinner
  reason: Retained as a familiar biblical term and kept distinct from “the ungodly,” as in the Greek.
translation_notes:
  source_alignment_notes: The draft preserves the verse’s conditional structure, representative singular, two distinct descriptions of the unrighteous, and rhetorical question. It renders μόλις with the POB-authorized alternative “with difficulty” and retains “appear” as the controlling sense of φανεῖται.
  readability_notes:
  - Replaced the potentially archaic and misleading “scarcely” with the clearer phrase “with great difficulty.”
  - Kept the sentence compact to preserve its proverbial and rhetorical force.
  - Anchored both explanatory footnotes directly in the translation text.
  risk_flags:
  - risk: “With great difficulty” could be misunderstood as uncertainty about final salvation.
    mitigation: Footnote [a] states that the difficulty concerns severe trials, not uncertainty about final salvation.
  - risk: “Where will ... appear?” may remain less immediately transparent than “what will happen?”
    mitigation: The wording preserves the source image and rhetorical force; footnote [b] supplies the documented alternative “be found.”
