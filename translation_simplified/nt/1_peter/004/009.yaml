simplification_decisions:
- pob_phrase: Be hospitable to one another
  simplified_phrase: Show hospitality to one another
  preserved_meaning: Believers are commanded to practice hospitality mutually within the community.
  reasoning_layer_used: POB lexical decisions for φιλόξενοι and εἰς ἀλλήλους, including the documented alternative “Show hospitality”
  rationale: The action-focused wording is natural contemporary English and preserves both the exhortational force of φιλόξενοι and the reciprocal direction of εἰς ἀλλήλους. It avoids narrowing hospitality to welcoming people specifically “as guests.”
- pob_phrase: without grumbling
  simplified_phrase: without grumbling
  preserved_meaning: Hospitality must not be accompanied by discontented complaint.
  reasoning_layer_used: POB lexical decisions for ἄνευ and γογγυσμοῦ
  rationale: The POB wording is already clear and precisely conveys the absence of discontented complaint, so it is retained.
retained_terms:
- term: hospitality
  reason: This familiar term best preserves the broad practice expressed by φιλόξενοι without reducing it to a greeting, lodging, or another single form of care.
translation_notes:
  source_alignment_notes: The draft preserves the command conveyed by the imperatival adjective φιλόξενοι, the mutual direction of εἰς ἀλλήλους, the absence expressed by ἄνευ, and the discontented complaint conveyed by γογγυσμοῦ. “Show hospitality” is a documented POB lexical alternative.
  readability_notes:
  - Uses the direct, action-focused phrase “Show hospitality” instead of the adjectival construction “Be hospitable.”
  - Keeps the verse as one short and readily understood command.
  risk_flags:
  - risk: Some readers may understand hospitality mainly as entertaining guests at home.
    mitigation: The text does not add a narrower setting such as a home, meal, or lodging, leaving the term’s broader sense intact.
