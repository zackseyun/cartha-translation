translation:
  language: en
  text: For the time has come for judgment to begin with God’s household—his own people.[a] And if it begins first with us, what will the outcome be for those who disobey God’s gospel?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word can mean “house” or “household.” Here it refers to God’s people, not a building.
    reason: lexical_alternative
  - marker: b
    text: “Those who disobey” can also mean “those who refuse to believe.” The Greek expression joins the ideas of unbelief and disobedience in response to the gospel.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: it is time for judgment to begin
  simplified_phrase: the time has come for judgment to begin
  preserved_meaning: The fitting or appointed time for God’s judgment has arrived.
  reasoning_layer_used: Lexical decision for καιρός and immediate context
  rationale: “The time has come” is more natural common English while retaining the sense of a significant, appointed time rather than merely elapsed time.
- pob_phrase: from the household of God
  simplified_phrase: with God’s household—his own people
  preserved_meaning: God’s judgment starts with the community that belongs to him.
  reasoning_layer_used: Lexical and theological decisions for ἀπὸ τοῦ οἴκου τοῦ θεοῦ
  rationale: “With” is natural English for identifying where a process begins. The short gloss explains that “household” means God’s people, not a physical building, while retaining the biblical household image.
- pob_phrase: if it begins first from us
  simplified_phrase: if it begins first with us
  preserved_meaning: Peter includes himself and his believing readers among God’s household, where judgment starts first.
  reasoning_layer_used: Lexical decision for εἰ δὲ πρῶτον ἀφ’ ἡμῶν
  rationale: Repeating “with” makes the connection to the previous sentence clear in ordinary English while preserving “first” and “us.”
- pob_phrase: the gospel of God
  simplified_phrase: God’s gospel
  preserved_meaning: The gospel belongs to God and comes from him.
  reasoning_layer_used: Lexical decision for τῷ τοῦ θεοῦ εὐαγγελίῳ
  rationale: The possessive form is shorter and more natural without weakening the theological weight of “gospel.”
interpretive_expansions:
- pob_phrase: the household of God
  rendering: God’s household—his own people
  claim: God’s household here refers to the community of believers rather than a building.
  evidence:
  - The POB theological decision explicitly identifies the referent as God’s people.
  - The following phrase “from us” identifies the household with Peter and other believers.
  - First Peter 2:5 describes believers corporately as a spiritual house.
  confidence: high
  alternatives_preserved:
  - The underlying Greek can also be rendered “the house of God,” as noted in the footnote.
retained_terms:
- term: judgment
  reason: This preserves the text’s serious but deliberately broad description of God’s dealings with his people; “condemnation” would be too narrow and “discipline” too weak.
- term: household
  reason: This retains the source-language house/household image while the added gloss makes its communal meaning clear.
- term: gospel
  reason: This is a major biblical term, and replacing it entirely could hide the concept of God’s proclaimed saving message.
translation_notes:
  source_alignment_notes: The draft preserves the causal opening, the arrival of the appointed time, judgment beginning with God’s people, Peter’s inclusion of himself among them, and the rhetorical contrast with those who disobey the gospel. It does not redefine judgment as either condemnation or discipline.
  readability_notes:
  - Changed “it is time” to the more natural “the time has come.”
  - Used a brief in-text gloss to explain “God’s household” on first reading.
  - Used the ordinary English construction “begin with” instead of “begin from.”
  - Kept the rhetorical question and divided the thought into two manageable sentences.
  compression_notes:
  - The lexical alternative “end” for “outcome” was not footnoted because “outcome” is already clear and preserves the intended contrast.
  - The possessive/source nuance of “God’s gospel” is expressed compactly rather than explained in the main text.
  risk_flags:
  - risk: Rendering ἀπό with “with” could appear to weaken the repeated source-language idea of a starting point.
    mitigation: English naturally says that a process “begins with” a group; “begins first with us” still clearly marks the starting point and follows a POB-listed alternative.
  - risk: The gloss “his own people” makes the household referent explicit.
    mitigation: This is strongly supported by the immediate phrase “with us,” the POB theological rationale, and 1 Peter 2:5; the original household image remains in the main text.
  - risk: Modern readers may understand “disobey” as conduct alone rather than refusal to believe the gospel.
    mitigation: A lexical footnote preserves the intertwined senses of unbelief and disobedience without forcing one sense into the main text.
