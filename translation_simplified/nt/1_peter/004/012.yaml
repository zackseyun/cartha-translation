simplification_decisions:
- pob_phrase: Beloved
  simplified_phrase: Dear friends
  preserved_meaning: Peter addresses the readers with warm pastoral affection.
  reasoning_layer_used: POB lexical decision for Ἀγαπητοί, including the recorded alternative “Dear friends”
  rationale: “Dear friends” is a clear, natural form of direct address. It preserves the affectionate tone without redundantly combining “loved” and “friends.”
- pob_phrase: the fiery trial among you
  simplified_phrase: the fiery suffering among you
  preserved_meaning: The community is undergoing severe suffering described through the source’s fire image.
  reasoning_layer_used: POB lexical decisions for πυρώσει and ἐν ὑμῖν; immediate suffering and persecution context identified in the POB reasoning
  rationale: “Suffering” states the contextual nature of the ordeal more plainly, while “fiery” preserves the source’s burning image. “Among you” retains the corporate setting.
- pob_phrase: that is happening to test you
  simplified_phrase: that is happening to test you
  preserved_meaning: The ongoing suffering serves to test or prove the readers rather than entice them to sin.
  reasoning_layer_used: POB lexical decisions for πρὸς πειρασμόν and γινομένῃ; POB theological decision on testing rather than temptation
  rationale: The POB wording is already clear and preserves both the ongoing occurrence and its testing purpose.
- pob_phrase: as though something strange were happening to you
  simplified_phrase: Do not think that something strange is happening to you
  preserved_meaning: The readers must not regard their suffering as alien, unexpected, or out of place.
  reasoning_layer_used: POB lexical decisions for ξενίζεσθε, ὡς ξένου, and συμβαίνοντος
  rationale: The comparative clause is recast as a short direct sentence for easier reading while preserving the repeated theme of surprise and strangeness.
interpretive_expansions:
- pob_phrase: fiery trial
  rendering: fiery suffering
  claim: The ordeal is severe suffering described with fire imagery.
  evidence:
  - The POB rationale for πυρώσει identifies the expression as a metaphor for severe suffering that tests believers.
  - The POB theological decision identifies suffering and persecution as the immediate context.
  - The POB renders the event as a trial rather than literal burning.
  confidence: high
  alternatives_preserved:
  - The fire image remains explicit in “fiery.”
  - The corporate sense remains explicit in “among you.”
  - The testing purpose remains distinct from the description of the suffering.
translation_notes:
  source_alignment_notes: The draft preserves the affectionate address, the linked ideas of surprise and strangeness, the corporate setting, the fire image, the ongoing nature of the suffering, and its testing purpose. It follows the POB reading of πειρασμός as testing rather than temptation. The revised address uses the audit-supported alternative “Dear friends” and removes the unsupported redundancy of “Dearly loved friends.”
  readability_notes:
  - The long POB sentence is divided into two direct sentences.
  - “Trial” is clarified contextually as “suffering,” while “fiery” preserves the source image.
  - The final comparative construction is expressed as a direct command in natural modern English.
  - “Dear friends” provides an idiomatic and concise pastoral address.
  compression_notes:
  - The final comparative clause is recast as a direct sentence without removing its force.
  - No footnote is retained because the main text clearly preserves the fire image and the context-supported sense of testing.
  risk_flags:
  - risk: “Fiery suffering” is less conventional than “fiery trial” and might be understood only as a statement of intensity.
    mitigation: The word “fiery” keeps the burning image explicit, and the following clause separately identifies the suffering as a test.
  - risk: Changing “as though” to “Do not think” alters the grammatical form.
    mitigation: 'The direct command preserves the contextual force: readers must not regard what is happening as strange.'
