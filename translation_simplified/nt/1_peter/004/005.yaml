translation:
  language: en
  text: They will have to answer to the one who is ready to judge both the living and the dead.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: will give an account
  simplified_phrase: will have to answer
  preserved_meaning: They will be required to answer for themselves before the judge.
  reasoning_layer_used: POB lexical decision for ἀποδώσουσιν λόγον
  rationale: The POB identifies this Greek expression as an idiom meaning to give an account or answer for oneself. “Will have to answer” states that judicial obligation in more immediately understandable English.
- pob_phrase: the one who stands ready to judge
  simplified_phrase: the one who is ready to judge
  preserved_meaning: The judge is presently ready and prepared to judge.
  reasoning_layer_used: POB lexical decision for ἑτοίμως ἔχοντι κρῖναι and its documented lexical alternative
  rationale: “Is ready to judge” is the POB’s documented alternative and is more direct for common readers while retaining the force of poised readiness.
- pob_phrase: the living and the dead
  simplified_phrase: both the living and the dead
  preserved_meaning: The judgment includes living people and dead people, with the same broad scope as the POB wording.
  reasoning_layer_used: POB lexical decision for ζῶντας καὶ νεκρούς
  rationale: Adding “both” makes the two inclusive groups easier to process without changing their meaning.
translation_notes:
  source_alignment_notes: The draft preserves the POB’s judicial meaning, the judge’s present readiness, and the comprehensive phrase “the living and the dead.” It also retains “the one” and does not identify the judge explicitly as God or Christ, preserving the theological tension documented by the POB.
  readability_notes:
  - Replaced the formal idiom “give an account” with the direct expression “have to answer.”
  - Used “is ready” instead of the more figurative “stands ready.”
  - Kept the verse as one short, natural sentence.
  risk_flags:
  - risk: “Have to answer” could be read as merely replying to a question rather than facing judicial accountability.
    mitigation: The immediate wording “the one who is ready to judge” keeps the answer clearly within a judicial setting.
