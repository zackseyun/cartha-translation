translation:
  language: en
  text: For none of you should suffer as a murderer, a thief, an evildoer, or someone who meddles in other people’s affairs.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: For let none of you suffer
  simplified_phrase: For none of you should suffer
  preserved_meaning: No individual among Peter’s readers is to bring suffering on himself through wrongdoing; “For” keeps the verse connected to the surrounding explanation.
  reasoning_layer_used: POB lexical decision for μὴ γάρ, τις ὑμῶν, and πασχέτω
  rationale: The direct construction “none of you should” is more natural in modern English than “let none of you,” while preserving both the prohibition and the explanatory connection.
- pob_phrase: as a murderer or a thief or an evildoer
  simplified_phrase: as a murderer, a thief, an evildoer
  preserved_meaning: The three distinct kinds of wrongdoing remain separate, and suffering is still presented as occurring on the basis of such conduct.
  reasoning_layer_used: POB lexical decisions for ὡς, φονεύς, κλέπτης, and κακοποιός
  rationale: Modern list punctuation makes the series easier to read without weakening or combining its individual charges.
- pob_phrase: or as a meddler[a]
  simplified_phrase: or someone who meddles in other people’s affairs
  preserved_meaning: The final offense is wrongful intrusion into matters that belong to others.
  reasoning_layer_used: POB lexical and theological decisions for ἀλλοτριεπίσκοπος, supported by the POB footnote
  rationale: The rare term’s intended sense is stated directly in the text so readers do not have to infer what kind of meddling is meant. This also avoids the lighter tone of “busybody” and the obscurity of the literal compound.
interpretive_expansions:
- pob_phrase: a meddler[a]
  rendering: someone who meddles in other people’s affairs
  claim: The meddling consists of intrusive involvement in matters belonging to other people.
  evidence:
  - The POB footnote explains the term as “one who oversees another’s affairs,” meaning someone who meddles in matters not his own.
  - The POB lexical decision identifies “a meddler in other people’s affairs” as the chosen sense of ἀλλοτριεπίσκοπος.
  - The POB theological decision says wrongful intrusion best fits this list of blameworthy behaviors.
  confidence: high
  alternatives_preserved:
  - busybody
  - one who meddles in matters not his own
retained_terms:
- term: evildoer
  reason: This preserves the source term’s broad moral sense without narrowing it to a legally defined criminal offense.
translation_notes:
  source_alignment_notes: The draft preserves the prohibition, the explanatory force of “For,” the broad sense of suffering, all four distinct offenses, and the POB’s source-driven interpretation of the rare final term. It does not add “punishment,” which would over-specify πασχέτω.
  readability_notes:
  - Recast the formal imperative “let none of you” as the more natural “none of you should.”
  - Used ordinary list punctuation instead of repeating “or” before every item.
  - Moved the POB footnote’s essential explanation of “meddler” into the main text.
  compression_notes:
  - The lexical footnote is omitted because its central clarification now appears directly in the verse.
  - The alternatives “busybody” and the literal “one who oversees another’s affairs” are not printed because they do not improve first-read understanding.
  risk_flags:
  - risk: Expanding “meddler” in the main text could appear to resolve a rare lexical term too strongly.
    mitigation: The expansion follows the POB’s lexical and theological decisions and preserves the documented alternatives in the audit field rather than introducing a new interpretation.
