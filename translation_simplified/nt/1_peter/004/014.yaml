translation:
  language: en
  text: If people insult you because you bear the name of the Messiah,[a] you are blessed, because the Spirit of glory and of God rests on you.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Greek “Christ.” “Messiah” is used here because the word functions as a title.
    reason: lexical_alternative
  - marker: b
    text: This may also mean “the glorious Spirit of God” or “the Spirit of glory, that is, the Spirit of God.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: If you are insulted in the name of Messiah
  simplified_phrase: If people insult you because you bear the name of the Messiah
  preserved_meaning: The insults come because of the person’s association with Jesus as Messiah, while the biblical image of bearing his name remains present.
  reasoning_layer_used: POB lexical decision for ἐν ὀνόματι Χριστοῦ and contested-title guidance for Χριστοῦ
  rationale: “In the name of Messiah” may sound as though the insults are spoken with his authority. The revised wording makes the intended association clear without reducing the phrase to the less vivid “because of the Messiah.”
- pob_phrase: you are blessed
  simplified_phrase: you are blessed
  preserved_meaning: Those who suffer verbal disgrace for association with the Messiah stand under divine blessing.
  reasoning_layer_used: POB lexical decision for μακάριοι
  rationale: “Blessed” is already understandable and preserves the theological weight that “happy” or “fortunate” would weaken.
- pob_phrase: the Spirit of glory and of God
  simplified_phrase: the Spirit of glory and of God
  preserved_meaning: The wording leaves open whether “of glory” and “of God” are coordinated descriptions or whether the second explains the first.
  reasoning_layer_used: POB theological decision on τὸ τῆς δόξης καὶ τὸ τοῦ θεοῦ πνεῦμα
  rationale: Although the phrase is unusual in English, smoothing it in the main text would resolve an ambiguity that the POB deliberately preserves. A footnote gives the principal readable alternatives.
- pob_phrase: rests upon you
  simplified_phrase: rests on you
  preserved_meaning: God’s Spirit settles or remains on those being insulted for the Messiah’s name, retaining the source image and its Isaianic resonance.
  reasoning_layer_used: POB lexical decision for ἀναπαύεται
  rationale: “Rests on” is more common modern English than “rests upon” and carries the same image.
interpretive_expansions:
- pob_phrase: in the name of Messiah
  rendering: because you bear the name of the Messiah
  claim: The insult is directed at believers because they are identified or associated with the Messiah.
  evidence:
  - The POB lexical rationale states that ἐν ὀνόματι denotes association with or action on account of the name or identity of Jesus as Messiah.
  - The immediate clause links the verbal abuse to the Messiah’s name rather than to an insult performed under his authority.
  confidence: high
  alternatives_preserved:
  - in the name of the Messiah
  - for the name of the Messiah
  - because of the Messiah
retained_terms:
- term: Messiah
  reason: The POB treats Χριστός as an active title here and explicitly prefers “Messiah” over the name-like rendering “Christ.”
- term: blessed
  reason: This preserves the beatitude-like and theological force of μακάριοι.
- term: glory
  reason: This standard biblical term preserves the connection with divine splendor and presence.
- term: Spirit of glory and of God
  reason: The unusual wording is retained because making it smoother would settle a documented grammatical and theological ambiguity.
translation_notes:
  source_alignment_notes: 'The draft preserves every central POB decision: verbal abuse rather than general persecution, association with the Messiah’s name, the titular rendering “Messiah,” the theological term “blessed,” the unresolved construction “Spirit of glory and of God,” and the image of the Spirit resting on believers.'
  readability_notes:
  - Changed the passive “you are insulted” to the natural active form “people insult you.”
  - Clarified the potentially opaque phrase “in the name of Messiah” while retaining its name-bearing image.
  - Shortened “rests upon” to the more common “rests on.”
  - Used footnotes to explain the title “Messiah” and the deliberately preserved ambiguity about the Spirit.
  compression_notes:
  - No source idea was removed.
  - The social-shame dimension of ὀνειδίζεσθε is conveyed by “insult,” while the more formal alternatives “reproach” and “revile” were not retained.
  - The two principal interpretations of the Spirit phrase are compressed into one footnote rather than explained in the verse.
  risk_flags:
  - risk: “Bear the name” may suggest a formal naming act more strongly than the Greek requires.
    mitigation: The causal wording “because” clearly frames the phrase as identification with the Messiah, and the alternatives remain documented in the interpretive-expansion record.
  - risk: “The Spirit of glory and of God” remains less natural than ordinary modern English.
    mitigation: The wording is intentionally retained to avoid flattening the POB’s documented ambiguity, with clear alternatives supplied in a footnote.
