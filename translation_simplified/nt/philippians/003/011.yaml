simplification_decisions:
- preserved_meaning: The Greek verb 'katantēso' refers to arriving at a destination or goal. While 'attain to' is a faithful rendering, it feels overly formal to modern readers. 'Reach' is clear, direct, and maintains the metaphorical sense of arriving at the eschatological goal.
