translation_notes:
  source_alignment_notes: The translation preserves the aorist subjunctive force of 'katantēso' after 'ei pōs' by using 'may reach.' The choice of 'resurrection from the dead' for 'exanastasin tēn ek nekrōn' aligns with POB's decision to avoid awkward neologisms in the main text while documenting the specific compound form in a footnote.
