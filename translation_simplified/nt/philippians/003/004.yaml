translation:
  language: en
  text: Still, I myself have reasons for confidence based on human credentials.[a] If anyone else thinks they have such reasons for confidence, I have more.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “in the flesh,” meaning confidence based on human credentials or outward status.
