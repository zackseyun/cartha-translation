translation_notes:
  source_alignment_notes: The Greek features a strict parallel structure with δύο prepositional phrases starting with κατά (κατὰ ζῆλος... κατὰ δικαιοσύνην...). This is preserved via the 'As for... as for...' parallel structure. The participles (διώκων, γενόμενος) are converted into main verbs ('I persecuted', 'I was') because a literal participial translation in English sounds overly formal and disconnected from the main narrative flow.
  readability_notes:
  - The sentence is made highly readable by introducing the active subject 'I' (which is grammatically implied by the context of Paul's personal credentials) and using simple past-tense verbs. This removes the syntactic strain of POB's literal participles while keeping the flow dignified.
  compression_notes:
  - No theological or historical details are lost. The literal footnote 'Lit. in the law' was omitted because 'under the law' is universally understood and idiomatic in English, making the technical note unnecessary for a common reader.
  risk_flags:
  - risk: None. The translation strictly respects the POB theological decision that Paul's blamelessness is tied to his standing under the law, not absolute perfection before God.
    mitigation: Flag retained for reviewer attention.
