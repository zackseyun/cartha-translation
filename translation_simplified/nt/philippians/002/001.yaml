  preserved_meaning: The encouragement arises within the believer’s relationship with Messiah.
  reasoning_layer_used: POB lexical decision for ἐν Χριστῷ
  rationale: The fuller clause makes the compact biblical expression understandable while retaining Messiah.
- pob_phrase: comfort from love
  simplified_phrase: love gives you any comfort
  preserved_meaning: Love is presented as the source of comfort.
  reasoning_layer_used: POB lexical decision for ἀγάπης
  rationale: An active clause states the same source relationship in ordinary English.
- pob_phrase: fellowship of the Spirit
  simplified_phrase: fellowship that comes from the Spirit
  preserved_meaning: The main reading connects shared fellowship with the Holy Spirit.
  reasoning_layer_used: POB theological decision for κοινωνία πνεύματος
  rationale: The wording clarifies fellowship while the footnote preserves the uncertain genitive relationship.
