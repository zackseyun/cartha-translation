translation:
  language: en
  text: So then, my dear friends, just as you have always obeyed, keep obeying. Do this not only when I am with you, but even more now that I am away. Work out your own salvation[a] with fear and trembling[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Work out” means to live out and express your salvation in daily life, not to earn it by human effort.
    reason: simplification_note
  - marker: b
    text: “Fear and trembling” means to have deep, reverent awe and humility before God, rather than being terrified.
    reason: simplification_note
