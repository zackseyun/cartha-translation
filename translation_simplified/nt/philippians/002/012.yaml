translation:
  language: en
  text: So then, my dear friends, you have always obeyed—not only when I was with you, but even more now that I am away. Work out your own salvation[a] with fear and trembling[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Work out” means to carry your salvation through in daily life, not to earn it.
    reason: simplification_note
  - marker: b
    text: “Fear and trembling” describes deep reverent awe and serious humility before God.
    reason: simplification_note
simplification_decisions:
- pob_phrase: my beloved
  simplified_phrase: my dear friends
  preserved_meaning: Paul’s warm pastoral affection for the Philippians.
  reasoning_layer_used: POB lexical decision for ἀγαπητοί μου
  rationale: “My dear friends” expresses the affectionate address in natural modern English.
- pob_phrase: in my presence ... in my absence
  simplified_phrase: when I was with you ... now that I am away
  preserved_meaning: The contrast between Paul’s presence and absence.
  reasoning_layer_used: POB lexical decisions for παρουσίᾳ and ἀπουσίᾳ
  rationale: The verbal wording makes the contrast immediately clear.
- pob_phrase: just as you have always obeyed—not only ...—work out
  simplified_phrase: you have always obeyed—not only ... . Work out
  preserved_meaning: Their established obedience leads into the command to live out their salvation.
  reasoning_layer_used: Source syntax and independent grounding review
  rationale: Two sentences clarify the structure without adding another command.
translation_notes:
  risk_flags:
