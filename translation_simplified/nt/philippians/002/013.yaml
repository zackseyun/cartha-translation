translation:
  language: en
  text: For God is working in you, making you willing and enabling you to do what pleases him[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “producing in you both the willing and the working.”
    reason: lexical_alternative
  - marker: b
    text: Or “according to what pleases him.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: God is the one working in you
  simplified_phrase: God is working in you
  preserved_meaning: God remains the one actively at work in his people.
  reasoning_layer_used: POB lexical decision for ὁ ἐνεργῶν ἐν ὑμῖν
  rationale: The finite clause is more natural while preserving ongoing divine activity.
- pob_phrase: both to will and to work
  simplified_phrase: making you willing and enabling you to do
  preserved_meaning: God works at the level of both volition and action.
  reasoning_layer_used: POB theological decision on divine agency and human willing and working
  rationale: This avoids the likely misreading of “will” as a future-tense helper verb.
- pob_phrase: for his good pleasure
  simplified_phrase: what pleases him
  preserved_meaning: The willing and doing serve what God regards with favor.
  reasoning_layer_used: POB lexical decision for ὑπὲρ τῆς εὐδοκίας
  rationale: The concrete wording communicates the phrase in ordinary English.
interpretive_expansions:
- pob_phrase: both to will and to work
  rendering: making you willing and enabling you to do
  claim: The two infinitives describe God's activity in both human willingness and action.
  evidence:
  - The POB theological rationale explicitly identifies volition and action.
  - The source repeats the ἐνεργ- word group for God's working and human action.
  confidence: high
  alternatives_preserved:
  - both the willing and the working
- pob_phrase: for his good pleasure
  rendering: what pleases him
  claim: The implied possessor of the good pleasure is God.
  evidence:
  - The POB lexical rationale says “his” is implied by God as the subject.
  - The POB treats ὑπέρ here as expressing purpose or benefit.
  confidence: high
  alternatives_preserved:
  - according to what pleases him
translation_notes:
  risk_flags:
  - risk: “Enabling” may sound like God provides only potential rather than also bringing about action.
    mitigation: The clause says God is actively working in them, and footnote a preserves “the working.”
  - risk: English “you” does not show whether the scope is individual, corporate, or both.
    mitigation: The unqualified wording preserves the POB's deliberate openness.
