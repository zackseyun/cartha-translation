translation:
  language: en
  text: He nearly died for the work of the Messiah, risking his life to make up for the help you could not provide in person.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The phrase 'help you could not provide in person' (traditionally 'what was lacking in your service') refers to the practical assistance the Philippians were unable to deliver themselves due to their physical distance, rather than any failure or unwillingness on their part.
    reason: cultural_note
simplification_decisions:
- simplified_phrase: for the work of the Messiah
  preserved_meaning: Smoothed the double-preposition construction ('because for') into natural English while keeping 'the Messiah' as a title to honor the theological decision.
  reasoning_layer_used: POB audit trail
  rationale: Smoothed the double-preposition construction ('because for') into natural English while keeping 'the Messiah' as a title to honor the theological decision.
- simplified_phrase: He nearly died
