simplification_decisions:
- preserved_meaning: Righteousness is a crucial theological concept in Pauline literature that denotes moral and spiritual rightness. Replacing it entirely would weaken the biblical concept, but providing the 'justice' footnote preserves the documented lexical range of the Greek 'dikaiosyne'.
  reasoning_layer_used: POB audit trail
  rationale: Righteousness is a crucial theological concept in Pauline literature that denotes moral and spiritual rightness. Replacing it entirely would weaken the biblical concept, but providing the 'justice' footnote preserves the documented lexical range of the Greek 'dikaiosyne'.
- preserved_meaning: Translating 'Christos' as the title 'Messiah' is a core POB theological decision that restores its redemptive-historical significance. The footnote helps modern readers connect this with the more familiar 'Jesus Christ'.
  reasoning_layer_used: POB audit trail
  rationale: Translating 'Christos' as the title 'Messiah' is a core POB theological decision that restores its redemptive-historical significance. The footnote helps modern readers connect this with the more familiar 'Jesus Christ'.
- preserved_meaning: It is more natural and clear for a modern reader than the strictly literal 'through', as it explicitly marks Jesus as the source/mediator of this righteousness.
