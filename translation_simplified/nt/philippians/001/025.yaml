  preserved_meaning: The aim includes their joy bound up with faith without defining the genitive more narrowly.
  reasoning_layer_used: POB theological decision on χαρὰν τῆς πίστεως
  rationale: “Have joy” supplies a natural English verb without adding the unsupported process implied by “find joy.”
