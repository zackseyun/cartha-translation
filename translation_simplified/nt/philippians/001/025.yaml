simplification_decisions:
- pob_phrase: And convinced of this, I know
  simplified_phrase: Because I am convinced of this, I know
  preserved_meaning: Paul’s settled conviction supports what he says he knows.
  reasoning_layer_used: POB lexical decision for πεποιθὼς and immediate syntax
  rationale: The full causal clause is easier to follow than the opening participial phrase.
- pob_phrase: for your progress and joy
  simplified_phrase: to help you make progress and have joy
  preserved_meaning: Paul expects his continued presence to serve their progress and joy.
  reasoning_layer_used: POB translation and contextual purpose construction
  rationale: The active purpose clause clearly shows how his remaining relates to their growth and joy.
- pob_phrase: joy in the faith
