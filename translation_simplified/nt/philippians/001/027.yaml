translation:
  language: en
  text: Only live in a way worthy of the gospel of Messiah.[a] Then, whether I come to see you or am absent, I may hear that you are standing firm in one spirit,[b] striving together with one soul for the faith of the gospel.[c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “conduct yourselves.” The Greek verb has civic overtones and can literally mean “live as citizens.”
    reason: lexical_alternative
  - marker: b
    text: Or “in one Spirit,” referring to the Holy Spirit.
    reason: alternative_reading
  - marker: c
    text: Or “with one mind.”
    reason: lexical_alternative
  - marker: d
    text: Or “contending side by side for faith in the gospel.”
    reason: alternative_reading
simplification_decisions:
