  preserved_meaning: Paul’s controlling command concerns a way of life fitting the gospel.
  reasoning_layer_used: POB lexical decisions for Μόνον, ἀξίως, and πολιτεύεσθε
  rationale: The simpler wording keeps “Only” and moves the civic nuance to a footnote.
- pob_phrase: whether I come and see you or am absent
  simplified_phrase: whether I come to see you or am absent
  preserved_meaning: Paul may either visit them personally or remain away.
  reasoning_layer_used: POB idiomatic rendering and revision trail
  rationale: Ordinary English removes an awkward coordination without changing either possibility.
- pob_phrase: with one soul striving together
