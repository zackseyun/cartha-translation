  preserved_meaning: They contend together with united inner resolve while the soul image remains distinct.
  reasoning_layer_used: POB lexical decisions for μιᾷ ψυχῇ and συναθλοῦντες
  rationale: The reordered phrase reads naturally without implying that the group literally forms one soul.
