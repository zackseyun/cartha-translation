translation:
  language: en
  text: It is right for me to think of all of you this way, because I hold you in my heart.[a] All of you share grace with me, both while I am in chains and as I defend the gospel and show that it is true.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “because you hold me in your heart.” The Greek can be read either way.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: For it is right for me to think this about all of you
  simplified_phrase: It is right for me to think of all of you this way
  preserved_meaning: Paul says his settled regard for every Philippian is right.
  reasoning_layer_used: POB lexical decisions for δίκαιον, φρονεῖν, and ὑπὲρ πάντων ὑμῶν
  rationale: The wording is more natural while preserving Paul’s ethical judgment and attitude.
- pob_phrase: because I have you in my heart
  simplified_phrase: because I hold you in my heart
  preserved_meaning: Paul keeps the Philippians in his deep affection, while the reverse reading remains possible.
  reasoning_layer_used: POB lexical and theological decision on the ambiguous heart-clause
  rationale: “Hold you in my heart” is idiomatic English, and the footnote preserves the Greek ambiguity.
- pob_phrase: since both in my chains and in the defense and confirmation of the gospel, all of you are fellow partakers with me of grace
  simplified_phrase: All of you share grace with me, both while I am in chains and as I defend the gospel and show that it is true
  preserved_meaning: The Philippians jointly participate in grace with Paul in both his imprisonment and his gospel work.
  reasoning_layer_used: POB lexical decisions for δεσμοῖς, ἀπολογίᾳ, βεβαιώσει, συγκοινωνούς, and χάριτος
  rationale: The active clauses clarify the sentence while retaining its both-and coordination and the image of chains.
