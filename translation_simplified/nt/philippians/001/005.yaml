simplification_decisions:
- pob_phrase: because of your partnership
  simplified_phrase: because you have joined me as partners
  preserved_meaning: The Philippians actively share with Paul rather than merely feeling warm fellowship.
  reasoning_layer_used: POB lexical decision for κοινωνίᾳ and immediate context
  rationale: The active clause makes the collaborative relationship easier to grasp.
- pob_phrase: in the gospel
