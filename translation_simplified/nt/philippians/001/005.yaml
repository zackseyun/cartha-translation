  preserved_meaning: The established Pauline term and its theological weight remain intact.
  reasoning_layer_used: POB lexical decision for εὐαγγέλιον
  rationale: Keeping “gospel” avoids weakening this key biblical concept.
- pob_phrase: from the first day until now
  simplified_phrase: from the first day until now
  preserved_meaning: Their partnership began at the start and has continued to the present.
