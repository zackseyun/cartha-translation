  reasoning_layer_used: POB audit trail
  rationale: Converting the passive construction 'have become known' to 'it has become clear... that' improves readability for a modern reader. Explaining 'in Messiah' as 'for the Messiah' clarifies the causal/allegiance-based aspect of the Greek preposition 'en' in context, while the footnote preserves the union-with-Christ alternative.
- simplified_phrase: to the whole imperial guard and to everyone else
