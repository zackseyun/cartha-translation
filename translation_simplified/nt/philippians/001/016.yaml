translation_notes:
  source_alignment_notes: The participle 'knowing' (eidotes) is retained to preserve the causal/logical connection between the believers' knowledge of Paul's divine appointment and their motive of love. The structural parallel between the two groups (verses 16 and 17) is maintained by clearly defining the first group here.
  readability_notes:
  - Converting 'for the defense of' to 'to defend' removes nominal heaviness. Using 'the first group' instead of 'the former' prevents the reader from having to pause and work out grammatical antecedents.
  compression_notes:
