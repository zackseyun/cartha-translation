  rationale: This removes awkward English while keeping both the personal emphasis and explanatory connection.
- pob_phrase: to live is Christ
  simplified_phrase: living means Christ
  preserved_meaning: Christ broadly defines what living signifies for Paul without limiting the phrase to one application.
  reasoning_layer_used: Greek nominal predicate, immediate context, and grounding review
  rationale: “Means” makes the compressed relation easier to grasp while preserving its deliberate breadth.
- pob_phrase: to die is gain
  simplified_phrase: dying means gain
  preserved_meaning: Paul regards death as a benefit while retaining the verse’s balanced contrast.
  reasoning_layer_used: POB lexical decisions for τὸ ἀποθανεῖν and κέρδος
  rationale: The matching gerund structure gives modern readers clear and natural parallelism.
interpretive_expansions:
