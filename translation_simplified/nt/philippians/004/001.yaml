translation:
  language: en
  text: So then, my beloved brothers[a], whom I deeply long for, you are my joy and my crown[b]. Stand firm in the Lord in this way, my beloved.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word for “brothers” is masculine, but here Paul is addressing the whole congregation, including both men and women.
    reason: cultural_note
  - marker: b
    text: Or “victor’s crown”; the Greek term refers to a wreath awarded to a winner.
    reason: lexical_alternative
