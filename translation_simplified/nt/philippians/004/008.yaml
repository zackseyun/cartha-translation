  language: en
  text: Finally, brothers,[a] think about whatever is true, worthy of respect, right, pure, lovely, and admirable—anything morally excellent or worthy of praise.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “brothers and sisters”; the Greek word can refer to the entire community of believers.
