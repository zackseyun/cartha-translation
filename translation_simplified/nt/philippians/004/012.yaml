translation:
  language: en
  text: 'I know how to live when I am brought low, and I know how to live with plenty. In any and every situation I have learned the secret[a]: whether I am well fed or hungry, whether I have plenty or am in need.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “I have been initiated.” Paul uses initiation language as a metaphor for learning a secret.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: I know how to be brought low
  simplified_phrase: I know how to live when I am brought low
  preserved_meaning: Paul has practical knowledge of living under lowered or humbling circumstances.
  reasoning_layer_used: POB lexical decision for ταπεινοῦσθαι and grounding review
  rationale: This keeps the broad passive hardship sense without narrowing it to material scarcity or adding a coping claim.
- pob_phrase: I know how to abound
  simplified_phrase: I know how to live with plenty
  preserved_meaning: Paul knows how to live when he has more than enough.
  reasoning_layer_used: POB lexical decision for περισσεύειν
  rationale: “Live with plenty” states the broad sense of abundance in familiar English.
- pob_phrase: both to be well fed and to be hungry, both to abound and to be in need
  simplified_phrase: whether I am well fed or hungry, whether I have plenty or am in need
  preserved_meaning: The two contrasting pairs cover fullness and hunger, abundance and deprivation.
  reasoning_layer_used: POB lexical decisions and clause structure
  rationale: The “whether...or” pattern preserves both contrasts in natural modern English.
translation_notes:
  risk_flags:
  - risk: “Brought low” may remain less immediately concrete than the surrounding examples.
    mitigation: The following contrasts of hunger, plenty, and need show that difficult circumstances are in view.
