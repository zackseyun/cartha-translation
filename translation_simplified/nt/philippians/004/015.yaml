translation:
  language: en
  text: And you yourselves also know, Philippians, that when my gospel work with you first began, when I left Macedonia, no church shared with me through giving and receiving[a] except you alone.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “in the account of giving and receiving.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: at the beginning of the gospel
  simplified_phrase: when my gospel work with you first began
  preserved_meaning: This refers to the beginning stage of Paul’s gospel work associated with the Philippians.
  reasoning_layer_used: POB lexical rationale and immediate context
  rationale: The clearer wording avoids suggesting the beginning of Christianity in general.
- pob_phrase: when I departed from Macedonia
  simplified_phrase: when I left Macedonia
  preserved_meaning: Paul’s departure from Macedonia remains the historical event in view.
  reasoning_layer_used: POB lexical alternatives
  rationale: “Left” is the ordinary modern equivalent of the formal verb “departed.”
- pob_phrase: shared with me in the matter of giving and receiving
  simplified_phrase: shared with me through giving and receiving
  preserved_meaning: The churches are described in terms of tangible material partnership with Paul.
  reasoning_layer_used: POB lexical rationale
  rationale: “Through” clearly presents giving and receiving as the form of their partnership.
interpretive_expansions:
- pob_phrase: at the beginning of the gospel
  rendering: when my gospel work with you first began
  claim: The phrase concerns the beginning of Paul’s gospel work connected with the Philippians.
  evidence:
  - The POB rationale identifies the beginning stage of Paul’s gospel work with them.
  - Philippians 4:10–19 discusses the Philippians’ material partnership with Paul.
  confidence: moderate
  alternatives_preserved:
  - at the beginning of the gospel
translation_notes:
  risk_flags:
  - risk: “Giving and receiving” may still sound like ordinary exchange rather than material partnership.
    mitigation: The verb “shared” supplies the partnership sense, while the footnote preserves the possible accounting nuance.
