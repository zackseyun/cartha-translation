translation:
  language: en
  text: For he powerfully proved the Jews[c] wrong in public, showing from the Scriptures that Jesus is the Messiah.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “that the Messiah is Jesus.” The Greek allows either English word order.
    reason: lexical_alternative
  - marker: b
    text: Greek “the Christ”; “Messiah” is used here because it is a title.
    reason: lexical_alternative
  - marker: c
    text: Here “the Jews” refers to the Jewish people with whom Apollos was debating.
    reason: cultural_note
simplification_decisions:
- pob_phrase: powerfully refuted
  simplified_phrase: powerfully proved ... wrong
  preserved_meaning: Apollos thoroughly and effectively showed that his opponents’ position was mistaken.
  reasoning_layer_used: The lexical decision for διακατηλέγχετο lists “proved wrong,” while εὐτόνως supplies the force of “powerfully.”
  rationale: The simpler phrase makes the adversarial and evidential sense immediately clear.
- pob_phrase: demonstrating through the Scriptures
  simplified_phrase: showing from the Scriptures
  preserved_meaning: Apollos used the Scriptures as the evidence for his case.
  reasoning_layer_used: The lexical decisions allow “showing” and “from the Scriptures” as natural equivalents.
  rationale: The rewrite replaces formal wording while preserving Scripture as the means of proof.
translation_notes:
  risk_flags:
  - risk: “The Jews” could be misread as referring to all Jewish people.
    mitigation: Footnote c limits the phrase to Apollos’s Jewish debate partners in context.
  - risk: “Proved ... wrong” may sound more absolute than ordinary modern debate language.
    mitigation: The source verb itself carries the strong sense of thoroughly refuting opponents.
