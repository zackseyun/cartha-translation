translation:
  language: en
  text: He found a Jew named Aquila, who was from Pontus. Aquila and his wife, Priscilla, had recently come from Italy because Claudius had ordered all the Jews to leave Rome.[a] He went to them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “ordered all the Jews to be expelled from Rome.” The Greek more literally describes them as being separated from Rome.
    reason: lexical_alternative
