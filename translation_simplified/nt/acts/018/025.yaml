translation:
  language: en
  text: He had been taught the Lord’s way. His spirit burned with zeal,[a] and he spoke and taught accurately about Jesus, though he knew only the baptism of John.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “He was fervent in the Spirit,” possibly referring to the Holy Spirit.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: had been instructed in the way of the Lord
  simplified_phrase: had been taught the Lord’s way
  preserved_meaning: He had already received instruction about the Lord’s way and retained it.
  reasoning_layer_used: Lexical decisions for κατηχημένος and τὴν ὁδὸν τοῦ κυρίου
  rationale: Common wording preserves both prior instruction and the biblical “way” image.
- pob_phrase: being fervent in spirit
  simplified_phrase: His spirit burned with zeal
  preserved_meaning: He had intense inward enthusiasm.
  reasoning_layer_used: Lexical and theological decisions for ζέων τῷ πνεύματι
  rationale: The burning image clearly conveys the force of his fervor without resolving the ambiguity.
- pob_phrase: the things concerning Jesus, knowing only the baptism of John
  simplified_phrase: about Jesus, though he knew only the baptism of John
  preserved_meaning: His accurate teaching about Jesus existed alongside a real limitation in his knowledge.
  reasoning_layer_used: Lexical decision and contextual rationale for τὰ περὶ τοῦ Ἰησοῦ and ἐπιστάμενος μόνον
  rationale: Plain wording retains the contextual contrast identified in the POB audit.
translation_notes:
  risk_flags:
  - risk: “His spirit” favors inward human zeal even though the Greek may refer to the Holy Spirit.
    mitigation: The footnote presents the Holy Spirit reading as a live possibility without making it exclusive.
