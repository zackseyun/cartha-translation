translation:
  language: en
  text: A Jew named Apollos, a native of Alexandria, came to Ephesus. He was an eloquent speaker[a] and had a powerful command of the Scriptures.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a learned man”; the Greek word can refer to eloquence or learning.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: A certain Jew named Apollos
  simplified_phrase: A Jew named Apollos
  preserved_meaning: Apollos is introduced as a Jewish man who is new to the account.
  reasoning_layer_used: Lexical decisions for τις and Ἰουδαῖος
  rationale: The indefinite article introduces him naturally without the stiff phrase “a certain.”
- pob_phrase: an Alexandrian by birth
  simplified_phrase: a native of Alexandria
  preserved_meaning: Apollos was Alexandrian by origin without requiring Alexandria to be his literal birthplace.
  reasoning_layer_used: Lexical decision for Ἀλεξανδρεὺς τῷ γένει and grounding review
  rationale: “A native of Alexandria” clearly expresses origin without making the source more specific.
- pob_phrase: being mighty in the Scriptures
  simplified_phrase: had a powerful command of the Scriptures
  preserved_meaning: Apollos had exceptional ability and knowledge concerning the sacred Scriptures.
  reasoning_layer_used: Lexical decisions for δυνατὸς ὢν and ἐν ταῖς γραφαῖς
  rationale: This keeps the phrase’s strength while clarifying the kind of ability meant.
translation_notes:
  risk_flags:
  - risk: “Eloquent” may carry only one of the two documented senses of λόγιος.
    mitigation: The footnote preserves “learned” as the lexical alternative.
