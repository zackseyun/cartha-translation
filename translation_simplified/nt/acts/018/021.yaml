  simplified_phrase: said goodbye and told them
  preserved_meaning: He took leave of the people and spoke before departing.
  reasoning_layer_used: Lexical decisions for ἀποταξάμενος and καὶ εἰπών
  rationale: Common verbs replace the formal participial wording while keeping both actions.
- pob_phrase: I will return to you again
  simplified_phrase: I will come back to you
  preserved_meaning: He intended to visit them again.
  reasoning_layer_used: Lexical decisions for Πάλιν, ἀνακάμψω, and πρὸς ὑμᾶς
  rationale: “Come back” naturally expresses both returning and the force of “again.”
- pob_phrase: he set sail from Ephesus
  simplified_phrase: Then he sailed from Ephesus
  preserved_meaning: He departed from Ephesus by sea after speaking.
  reasoning_layer_used: Lexical decision for ἀνήχθη and source clause sequence
  rationale: “Sailed” states the nautical action plainly, and “Then” preserves the sequence.
