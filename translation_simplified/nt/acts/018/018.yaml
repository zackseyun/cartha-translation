translation:
  language: en
  text: Paul stayed there for many more days. Then he said goodbye to the brothers[a] and sailed for Syria with Priscilla and Aquila. At Cenchreae, Paul had his head shaved[b] because he was under a vow.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Brothers” likely includes the whole community of believers, both men and women.
    reason: lexical_alternative
  - marker: b
    text: The Greek may mean that Paul had his hair cut rather than completely shaved; some interpreters understand Aquila as the person who did this, though the grammar most naturally points to Paul.
    reason: alternative_reading
  - marker: c
    text: The text does not say what kind of vow this was, though many connect it with a Nazirite-type vow.
    reason: cultural_note
simplification_decisions:
- pob_phrase: After Paul had remained many more days
  simplified_phrase: Paul stayed there for many more days
  preserved_meaning: Paul continued in the same place for a considerable time.
  reasoning_layer_used: lexical decision for προσμείνας and ἡμέρας ἱκανὰς
  rationale: A direct sentence with “stayed” is easier to read than the opening dependent clause.
- pob_phrase: he said farewell to the brothers and sailed away for Syria, and with him were Priscilla and Aquila
  simplified_phrase: Then he said goodbye to the brothers and sailed for Syria with Priscilla and Aquila
  preserved_meaning: Paul took leave of the believers and departed by ship for Syria accompanied by Priscilla and Aquila.
  reasoning_layer_used: lexical decisions and applied awkward-English revision
  rationale: The companion clause becomes a natural modifier without losing who traveled with Paul.
- pob_phrase: In Cenchreae he had his head shaved, for he was under a vow
  simplified_phrase: At Cenchreae, Paul had his head shaved because he was under a vow
  preserved_meaning: Paul underwent the haircut at Cenchreae in connection with an ongoing vow.
  reasoning_layer_used: lexical and theological decisions for κειράμενος and εὐχή
  rationale: Naming Paul again makes the likely subject clear while the footnote preserves the debated alternative.
translation_notes:
