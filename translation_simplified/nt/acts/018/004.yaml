simplification_decisions:
- pob_phrase: he was reasoning in the synagogue every Sabbath
  simplified_phrase: Every Sabbath, he reasoned with people in the synagogue
  preserved_meaning: He repeatedly engaged others in reasoned discussion at the synagogue.
  reasoning_layer_used: Lexical decision for διελέγετο and the distributive phrase κατὰ πᾶν σάββατον.
  rationale: The active wording and reordered time phrase make the repeated dialogue easier to follow.
- pob_phrase: persuading Jews and Greeks
  simplified_phrase: tried to persuade both Jews and Greeks
  preserved_meaning: He made an ongoing effort to convince both groups without implying certain success.
  reasoning_layer_used: Lexical decision for the imperfect ἔπειθέν and theological decision for Ἕλληνας.
  rationale: “Tried to persuade” preserves ongoing effort, while “Greeks” avoids narrowing their identity.
