translation:
  language: en
  text: But if the questions concern a word, names, and your own law,[a] deal with them yourselves. I do not want to judge such matters.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “A word” could also mean a message, teaching, or disputed terminology.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: if these are questions about
  simplified_phrase: if the questions concern
  preserved_meaning: The issues are matters of dispute or inquiry.
  reasoning_layer_used: Lexical decision for ζητήματα and the approved revision
  rationale: The shorter clause keeps the procedural sense while reading more naturally.
- pob_phrase: you yourselves will see to it
  simplified_phrase: deal with them yourselves
  preserved_meaning: Gallio emphatically tells the parties to handle the issues without him.
  reasoning_layer_used: Lexical decision for ὄψεσθε αὐτοί
  rationale: The idiom is stated directly while preserving the emphasis on “yourselves.”
- pob_phrase: be a judge of these things
  simplified_phrase: judge such matters
  preserved_meaning: Gallio does not want to adjudicate the disputes just named.
  reasoning_layer_used: Lexical decisions for κριτής, τούτων, and οὐ βούλομαι εἶναι
  rationale: The verb form removes an awkward noun phrase without strengthening his refusal.
