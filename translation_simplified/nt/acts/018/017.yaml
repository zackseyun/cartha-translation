translation:
  language: en
  text: Then they all grabbed Sosthenes,[a] the leader of the synagogue. They were beating him in front of the judge’s platform, but Gallio ignored what was happening.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some manuscripts say “all the Greeks” instead of leaving the group unidentified. The earliest text is shorter.
    reason: textual_variant
simplification_decisions:
- pob_phrase: seized
  simplified_phrase: grabbed
  preserved_meaning: They forcefully took hold of Sosthenes before beating him.
  reasoning_layer_used: Lexical decision for ἐπιλαβόμενοι
  rationale: “Grabbed” expresses the hostile action in immediate common English.
- pob_phrase: the synagogue ruler
  simplified_phrase: the leader of the synagogue
  preserved_meaning: Sosthenes held the synagogue’s leading official role.
  reasoning_layer_used: Lexical decision for ἀρχισυνάγωγον
  rationale: “Leader” is easier for modern readers to understand than “ruler.”
- pob_phrase: in front of the tribunal
  simplified_phrase: in front of the judge’s platform
  preserved_meaning: The beating occurred before the official platform where Gallio exercised judicial authority.
  reasoning_layer_used: Lexical decision for ἔμπροσθεν τοῦ βήματος
  rationale: This explains the physical and judicial setting without the technical word “tribunal.”
translation_notes:
  risk_flags:
  - risk: Readers may wonder who the attackers were.
    mitigation: “They all” preserves the source ambiguity, and the footnote explains the manuscript variant.
  - risk: “Judge’s platform” is less technical than “tribunal.”
    mitigation: It preserves both the physical platform and its judicial function.
