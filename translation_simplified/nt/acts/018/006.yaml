translation:
  language: en
  text: They opposed him and abused him with their words. Then he shook out his clothes[a] and said, “Your blood is on your own heads.[b] I am innocent. From now on, I will go to the Gentiles.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Shaking out his clothes was a symbolic way of separating himself from them and their response.
    reason: cultural_note
  - marker: b
    text: This means they are responsible for the consequences of rejecting the message.
    reason: cultural_note
  - marker: c
    text: Gentiles are people who are not Jews.
    reason: simplification_note
