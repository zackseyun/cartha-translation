translation:
  language: en
  text: Apollos wanted to cross over to Achaia. The brothers[a] encouraged him and wrote to the disciples, asking them to welcome him. After he arrived, he was a great help to those who had come to faith through grace.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “The brothers” may include the wider community of believers, including women, though the Greek uses a masculine form.
    reason: lexical_alternative
  - marker: b
    text: Or, “through grace he was a great help to those who had come to faith.” The Greek phrase “through grace” may describe Apollos’s help rather than how they came to faith.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: And when he wanted to go across to Achaia
  simplified_phrase: Apollos wanted to cross over to Achaia.
  preserved_meaning: Apollos freely intended to make the crossing to Achaia.
  reasoning_layer_used: Lexical decisions for βουλομένου and διελθεῖν
  rationale: Naming Apollos and using a separate sentence makes the travel plan immediately clear.
- pob_phrase: wrote to the disciples to welcome him
  simplified_phrase: wrote to the disciples, asking them to welcome him
  preserved_meaning: The brothers sent a written request that the disciples receive Apollos favorably.
  reasoning_layer_used: Lexical decisions for ἔγραψαν and ἀποδέξασθαι
  rationale: “Asking them” makes the purpose of the letter natural in modern English.
- pob_phrase: greatly helped those who had believed through grace
  simplified_phrase: was a great help to those who had come to faith through grace
  preserved_meaning: Apollos substantially benefited people whose prior faith had come through grace.
  reasoning_layer_used: Lexical and theological decisions for συνεβάλετο, πεπιστευκόσιν, and διὰ τῆς χάριτος
  rationale: “Come to faith” clearly expresses their settled prior believing without losing grace as its means.
translation_notes:
  risk_flags:
  - risk: Readers may take “brothers” as excluding women.
    mitigation: Footnote a preserves the source form while noting its possible wider reference.
  - risk: The placement of “through grace” is genuinely ambiguous.
    mitigation: The main text follows the POB reading, and footnote b preserves the alternative.
