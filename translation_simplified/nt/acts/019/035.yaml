translation:
  language: en
  text: After the city clerk quieted the crowd, he said, “Men of Ephesus, surely every man knows that the city of Ephesus is the recognized guardian of the great Artemis’s temple[a] and of the image said to have fallen from heaven.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek title describes a city officially recognized as keeper of a temple or cult.
    reason: cultural_note
  - marker: b
    text: The Greek refers to something believed to have fallen from the sky, probably the sacred image associated with Artemis.
    reason: lexical_alternative
