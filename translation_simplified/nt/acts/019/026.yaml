translation:
  language: en
  text: You see and hear that this Paul has persuaded many people and turned them away from idol worship—not only in Ephesus but in almost all of Asia. He says, “Gods made by human hands are not gods.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: not only in Ephesus but in almost all of Asia, this Paul has persuaded and turned away a considerable crowd
  simplified_phrase: this Paul has persuaded many people and turned them away from idol worship—not only in Ephesus but in almost all of Asia
  preserved_meaning: Paul both persuaded a significant number of people and caused them to abandon idol worship across the stated region.
  reasoning_layer_used: Lexical decisions for πείσας, μετέστησεν, and ἱκανὸν ὄχλον
  rationale: The new order reads naturally while keeping persuasion and turning away as distinct actions.
- pob_phrase: saying that
  simplified_phrase: He says
  preserved_meaning: Demetrius reports the claim Paul was making.
  reasoning_layer_used: Lexical decision for λέγων ὅτι
  rationale: A new sentence avoids a long chain of clauses without changing who speaks.
- pob_phrase: gods made by hands
  simplified_phrase: gods made by human hands
  preserved_meaning: The gods in question are idols produced by human craftsmanship.
  reasoning_layer_used: Lexical decision and cultural note for οἱ διὰ χειρῶν γινόμενοι
  rationale: Adding “human” makes the idiom clear while preserving the image of hands making idols.
