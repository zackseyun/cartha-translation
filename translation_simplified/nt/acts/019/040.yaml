translation:
  language: en
  text: For we are in danger of being charged with rioting because of what happened today.[a] There is no valid reason for it, and we will not be able to explain this commotion. After saying these things, he dismissed the assembly.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “sedition” or “insurrection”; “rioting” best fits this public uproar.
    reason: lexical_alternative
  - marker: b
    text: Here “assembly” means the civic gathering in Ephesus, not the church.
    reason: cross_reference
