translation:
  language: en
  text: Some traveling Jewish exorcists also tried to use the name of the Lord Jesus over people who had evil spirits. They said, “I put you under oath by Jesus, whom Paul proclaims.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Put you under oath” can also be translated “solemnly charge you.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: some also of the itinerant Jewish exorcists
  simplified_phrase: some traveling Jewish exorcists also
  preserved_meaning: Some Jewish exorcists who went from place to place also attempted this practice.
  reasoning_layer_used: POB lexical decision for περιερχομένων and clause syntax
  rationale: “Traveling” and natural word order identify the group more clearly.
- pob_phrase: attempted to invoke the name
  simplified_phrase: tried to use the name
  preserved_meaning: They attempted to employ Jesus’ name as part of an exorcistic formula.
  reasoning_layer_used: POB lexical decisions for ἐπεχείρησαν and ὀνομάζειν ἐπὶ ... τὸ ὄνομα
  rationale: The wording keeps both the attempted action and the formulaic use of Jesus’ name.
- pob_phrase: I adjure you
  simplified_phrase: I put you under oath
  preserved_meaning: The speaker formally binds the addressed spirits by an oath in Jesus’ name.
  reasoning_layer_used: POB lexical decision for Ὁρκίζω ὑμᾶς and grounding review
  rationale: This clear wording retains the central oath-binding force that “command” weakened.
translation_notes:
  risk_flags:
  - risk: “Use the name” is less formally exorcistic than “invoke the name.”
    mitigation: The phrase “over people who had evil spirits” and the quoted oath make the formulaic use clear.
  - risk: Modern readers may find “put you under oath” unusual when addressed to spirits.
    mitigation: The footnote gives “solemnly charge you” while preserving the oath sense in the main text.
