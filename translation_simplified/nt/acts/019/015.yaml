  preserved_meaning: The spirit responds directly to the men.
  reasoning_layer_used: Lexical decision for ἀποκριθὲν and εἶπεν αὐτοῖς
  rationale: “Replied to them” is natural speech introduction and keeps both the response and its addressees.
- pob_phrase: Jesus I know, and Paul I recognize—but who are you?
  simplified_phrase: I know Jesus, and I recognize Paul. But who are you?
  preserved_meaning: The spirit knows Jesus, recognizes Paul, and contrasts them with the unknown exorcists.
