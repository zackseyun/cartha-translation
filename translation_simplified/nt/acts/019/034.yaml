translation:
  language: en
  text: 'But when they realized that he was a Jew[a], they all shouted together for about two hours: “Great is Artemis of the Ephesians!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a Judean.” Here “Jew” is more likely because the crowd was reacting to his ethnic and religious identity, not merely his place of origin.
