translation:
  language: en
  text: 'He asked them, “When you believed, did you receive the Holy Spirit?”[a]


    They answered, “No. We have not even heard that there is a Holy Spirit.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “After you believed, did you receive the Holy Spirit?” The Greek does not specify the exact timing.
    reason: lexical_alternative
  - marker: b
    text: This may also mean, “We have not even heard whether there is a Holy Spirit,” or, “We have not even heard that the Holy Spirit has been given.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: And he said to them
  simplified_phrase: He asked them
  preserved_meaning: He addressed them with a question.
  reasoning_layer_used: Lexical decision for εἶπέν τε and immediate sentence form
  rationale: “Asked” expresses the plain function of his speech in natural English.
- pob_phrase: Did you receive the Holy Spirit when you believed?
  simplified_phrase: When you believed, did you receive the Holy Spirit?
  preserved_meaning: Receiving the Holy Spirit is temporally related to believing without defining the exact sequence.
  reasoning_layer_used: Lexical and theological decisions on πιστεύσαντες
  rationale: Moving the time phrase first makes the question easier to follow while preserving its flexibility.
- pob_phrase: And they said to him, “No, we have not even heard”
  simplified_phrase: They answered, “No. We have not even heard”
  preserved_meaning: Their reply strongly denies any prior awareness of the Holy Spirit.
  reasoning_layer_used: Lexical decisions on οἱ δὲ πρὸς αὐτόν and Ἀλλ’ οὐδ’
  rationale: A direct dialogue tag and two short sentences make the emphatic response clearer.
translation_notes:
  risk_flags:
  - risk: Readers may take “when” as proving that receiving the Spirit happened at the exact moment of belief.
    mitigation: Footnote a preserves the Greek participle’s temporal flexibility.
  - risk: “There is a Holy Spirit” may sound like a denial of the Spirit’s existence rather than ignorance of his presence or giving.
    mitigation: Footnote b preserves the principal contextual alternatives without changing the main reading.
