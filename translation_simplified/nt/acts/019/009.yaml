translation:
  language: en
  text: But some became hardened. They refused to obey[a] and spoke evil of the Way[b] in front of the crowd. So Paul left them and separated the disciples from them. Every day he reasoned with people in Tyrannus’s lecture hall.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “refused to believe” or “refused to be persuaded.”
    reason: lexical_alternative
  - marker: b
    text: “The Way” was an early name for the Christian movement.
    reason: cultural_note
simplification_decisions:
- pob_phrase: when some became hardened and disobedient
  simplified_phrase: some became hardened. They refused to obey
  preserved_meaning: Their resistance developed into a willful refusal to accept Paul’s message.
  reasoning_layer_used: Lexical decisions for ἐσκληρύνοντο and ἠπείθουν
  rationale: Two sentences clarify the progression while retaining both hardness and disobedience.
- pob_phrase: he withdrew from them and set apart the disciples
  simplified_phrase: Paul left them and separated the disciples from them
  preserved_meaning: Paul decisively departed from the opponents and distinguished the disciples from them.
  reasoning_layer_used: Lexical decisions for ἀποστὰς and ἀφώρισεν
  rationale: Direct wording makes the two acts and their participants immediately clear.
- pob_phrase: reasoning daily in the lecture hall of Tyrannus
  simplified_phrase: Every day he reasoned with people in Tyrannus’s lecture hall
  preserved_meaning: Paul regularly engaged in reasoned discourse at that instructional venue.
  reasoning_layer_used: Lexical decisions for καθ’ ἡμέραν, διαλεγόμενος, and σχολῇ
  rationale: Ordinary word order clarifies the repeated activity without weakening its reasoned character.
interpretive_expansions:
- pob_phrase: reasoning daily
  rendering: Every day he reasoned with people
  claim: Paul’s reasoning involved other people rather than private reflection.
  evidence:
  - The verb διαλέγομαι here denotes reasoned discourse or argumentation.
  - The lecture hall setting indicates an audience for Paul’s activity.
  confidence: high
  alternatives_preserved:
  - reasoning every day
  - holding daily discussions
