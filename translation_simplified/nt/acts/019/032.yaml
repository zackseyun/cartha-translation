translation:
  language: en
  text: Some people were shouting one thing, and others something else. The gathering[a] was in confusion, and most of them did not know why they had gathered.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word here means a public gathering, not the church.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: So then some were shouting one thing and some another
  simplified_phrase: Some people were shouting one thing, and others something else.
  preserved_meaning: Different groups continued shouting different things.
  reasoning_layer_used: POB lexical decision for ἄλλοι ... ἄλλο τι and the imperfect ἔκραζον
  rationale: The revised contrast is easier to follow while keeping the scene’s ongoing noise.
- pob_phrase: the assembly was in confusion
  simplified_phrase: The gathering was in confusion
  preserved_meaning: The assembled public crowd was disordered and confused.
  reasoning_layer_used: POB lexical decisions for ἐκκλησία and συγκεχυμένη
  rationale: “Gathering” avoids a likely church meaning while the footnote identifies the civic sense.
- pob_phrase: why they had come together
  simplified_phrase: why they had gathered
  preserved_meaning: Most people did not know the reason for their prior gathering.
  reasoning_layer_used: POB lexical decision for συνεληλύθεισαν
  rationale: “Had gathered” is shorter and preserves the prior completed action.
