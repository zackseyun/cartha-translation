translation:
  language: en
  text: Our trade is in danger of falling into disrepute. Not only that, but people may come to regard the temple of the great goddess Artemis as worthless. The greatness of Artemis herself may even be brought down, though all Asia[a] and the world[b] worship her.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “Asia” means the Roman province of Asia, not the modern continent.
    reason: cultural_note
  - marker: b
    text: Or “the inhabited world,” especially the wider Roman world.
    reason: lexical_alternative
