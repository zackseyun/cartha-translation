translation:
  language: en
  text: But Peter sent everyone outside. Then he knelt down and prayed. He turned toward the body and said, “Tabitha, arise.”[a] She opened her eyes, and when she saw Peter, she sat up.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “get up.” The Greek command can mean either; “arise” preserves the solemn tone and the scene’s connection with restoration to life.
    reason: lexical_alternative
