translation:
  language: en
  text: Everyone who heard him was amazed. They kept asking, “Isn’t this the man who, in Jerusalem, devastated those who call on this name?[a] Hadn’t he come here specifically to take them as prisoners before the chief priests?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “This name” refers to Jesus. To “call on” his name is to invoke or appeal to him.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: all who heard him were amazed and were saying
  simplified_phrase: Everyone who heard him was amazed. They kept asking
  preserved_meaning: All the hearers remained astonished and repeatedly voiced the questions that follow.
  reasoning_layer_used: Lexical decisions for ἐξίσταντο and πάντες οἱ ἀκούοντες
  rationale: Two sentences clarify the reaction, while “kept asking” preserves its ongoing character.
- pob_phrase: devastated in Jerusalem those who call on this name
  simplified_phrase: who, in Jerusalem, devastated those who call on this name
  preserved_meaning: Jerusalem was where Saul violently attacked those who invoked Jesus’ name.
  reasoning_layer_used: Lexical and theological decisions for πορθήσας, ἐν Ἰερουσαλήμ, and τὸ ὄνομα τοῦτο
  rationale: The commas clearly connect Jerusalem with Saul’s devastating activity rather than the victims’ residence.
- pob_phrase: that he might bring them bound before the chief priests
  simplified_phrase: to take them as prisoners before the chief priests
  preserved_meaning: Saul intended to detain the believers and present them to the chief-priestly authorities.
  reasoning_layer_used: Lexical decisions for δεδεμένους and ἀγάγῃ ἐπὶ τοὺς ἀρχιερεῖς
  rationale: “As prisoners” explains their bound state, while “before” retains the judicial setting.
translation_notes:
  risk_flags:
  - risk: “As prisoners” makes the physical image of being bound less visible.
    mitigation: It preserves forced detention without specifying chains or another means of binding.
  - risk: The footnote explicitly identifies Jesus although the main text leaves the referent implicit.
    mitigation: The main text retains “this name,” and the note gives only the contextually clear referent.
