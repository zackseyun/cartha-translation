translation:
  language: en
  text: He held out his hand and raised her up.[a] Then he called in God’s holy people and the widows and presented her to them alive.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This can also mean “helped her up” or “made her stand.” Here it also echoes resurrection language.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: giving her his hand
  simplified_phrase: held out his hand
  preserved_meaning: He extended his hand to help her rise.
  reasoning_layer_used: POB lexical decision for δοὺς ... χεῖρα
  rationale: This expresses the physical action in natural modern English.
- pob_phrase: the saints
  simplified_phrase: God’s holy people
  preserved_meaning: The group is the local community of people set apart as God’s own.
  reasoning_layer_used: POB lexical decision for τοὺς ἁγίους and immediate narrative context
  rationale: This avoids suggesting a special canonized class while preserving the biblical designation.
- pob_phrase: then he called the saints and the widows and presented her alive
  simplified_phrase: Then he called in God’s holy people and the widows and presented her to them alive
  preserved_meaning: Peter summoned both distinct groups and brought Tabitha before them as alive.
  reasoning_layer_used: POB lexical decisions for φωνήσας, τὰς χήρας, παρέστησεν, and ζῶσαν
  rationale: “Called in” and “to them” make the sequence and recipients clear.
interpretive_expansions:
- pob_phrase: the saints
  rendering: God’s holy people
  claim: The saints are the local Christian community belonging to God, not an exceptional class.
  evidence:
  - The POB audit defines ἅγιοι as a standard NT designation for God’s holy people.
  - Acts 9:32 and 9:41 place this designation within the local Christian community.
  confidence: high
  alternatives_preserved:
