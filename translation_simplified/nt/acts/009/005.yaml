translation:
  language: en
  text: He asked, “Who are you, Lord[a]?” The speaker answered, “I am Jesus, the one you are persecuting.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “sir.” The Greek word can be a respectful form of address, but “Lord” fits the setting in which Jesus reveals himself.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: And he said
  simplified_phrase: He asked
  preserved_meaning: He speaks the question directly to the heavenly speaker.
  reasoning_layer_used: Lexical decision for εἶπεν and the interrogative form of Τίς εἶ
  rationale: “Asked” makes the function of his words immediately clear.
- pob_phrase: And he said
  simplified_phrase: The speaker answered
  preserved_meaning: The previously unidentified speaker responds to the question.
  reasoning_layer_used: Source dialogue and revelatory context
  rationale: Naming the role avoids confusing the two speakers without identifying him before his reply.
- pob_phrase: whom you are persecuting
  simplified_phrase: the one you are persecuting
  preserved_meaning: Jesus identifies himself as the object of Saul’s ongoing persecution.
  reasoning_layer_used: Lexical decisions for ὃν, σὺ, and διώκεις
  rationale: “The one” is more natural in common English than “whom.”
translation_notes:
  risk_flags:
  - risk: “Lord” may sound like Saul already fully understands the speaker’s identity.
    mitigation: The anchored footnote preserves “sir” as a possible respectful address.
