simplification_decisions:
- pob_phrase: In those days it happened that she became sick and died.
  simplified_phrase: During that time, she became ill and died.
  preserved_meaning: She fell ill and died during the period already described.
  reasoning_layer_used: The lexical decisions treat “it happened” as a narrative formula and “in those days” as a temporal expression.
  rationale: The rewrite removes an awkward event-introducing formula while retaining the time and sequence.
- pob_phrase: After washing her, they laid her in an upstairs room.
  simplified_phrase: They washed her and then laid her in a room upstairs.
  preserved_meaning: The washing occurred after her death and before they placed her in an upper-story room.
  reasoning_layer_used: The lexical decisions establish both the sequence of actions and the room’s ordinary upper-floor location.
  rationale: Two coordinated actions with “then” are easier to follow than an opening participial phrase.
translation_notes:
  risk_flags:
  - risk: Removing “it happened” may reduce the feel of the Greek narrative formula.
    mitigation: “During that time” still introduces the event naturally without adding an unsupported discourse marker.
