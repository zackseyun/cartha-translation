translation:
  language: en
  text: So the church throughout Judea, Galilee, and Samaria had peace and was being built up.[a] It lived in reverent fear of the Lord and with the encouragement of the Holy Spirit,[b] and it kept growing in number.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some manuscripts read “the churches” instead of “the church.”
    reason: textual_variant
  - marker: b
    text: The Greek word translated “encouragement” can also mean “comfort” or “exhortation.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: throughout all Judea and Galilee and Samaria
  simplified_phrase: throughout Judea, Galilee, and Samaria
  preserved_meaning: The one church extended across all three named regions.
  reasoning_layer_used: lexical decision for καθ’ ὅλης
  rationale: “Throughout” already conveys the regional extent, so the extra “all” is unnecessary in English.
- pob_phrase: walking in the fear of the Lord
  simplified_phrase: lived in reverent fear of the Lord
  preserved_meaning: The church conducted its life with reverent awe toward the Lord.
  reasoning_layer_used: lexical and theological decisions for πορευομένη and φόβος
  rationale: “Lived” makes the conduct metaphor clear while “reverent” prevents fear from sounding like terror.
- pob_phrase: it was multiplying
  simplified_phrase: it kept growing in number
  preserved_meaning: The church experienced an ongoing numerical increase.
  reasoning_layer_used: lexical decision for ἐπληθύνετο
  rationale: This wording states the ongoing numerical growth in ordinary English.
