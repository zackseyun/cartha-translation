translation:
  language: en
  text: Peter got up and went with them. When he arrived, they took him to the room upstairs. All the widows stood beside him, weeping and showing him the clothes worn close to the body and the other clothing that Dorcas had made while she was with them.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dorcas is the Greek name of the woman also called Tabitha in Acts 9:36.
    reason: cross_reference
