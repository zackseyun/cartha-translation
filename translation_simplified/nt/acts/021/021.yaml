translation:
  language: en
  text: But they have been told that you teach all the Jews living among the Gentiles to turn away from Moses.[a] You tell them not to circumcise their children and not to live according to Jewish customs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “Moses” refers to the law of Moses and to Jewish practices passed down from their ancestors.
    reason: cultural_note
