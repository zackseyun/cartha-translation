simplification_decisions:
- pob_phrase: came to the steps
  simplified_phrase: reached the stairs
  preserved_meaning: He arrived at the stairway leading upward.
  reasoning_layer_used: POB lexical decision for ἐγένετο ἐπὶ τοὺς ἀναβαθμούς
  rationale: “Reached the stairs” expresses the same arrival more directly in common English.
- pob_phrase: it happened that he was being carried by the soldiers
  simplified_phrase: the soldiers carried him
  preserved_meaning: The soldiers bore him through the crowd’s violence.
  reasoning_layer_used: POB lexical decisions for συνέβη, βαστάζεσθαι, and ὑπὸ τῶν στρατιωτῶν
  rationale: The direct clause removes an awkward narrative frame while keeping the action and its agents.
- pob_phrase: because of the violence of the crowd
  simplified_phrase: because the crowd was so violent
  preserved_meaning: The crowd’s violent behavior caused the soldiers to carry him.
  reasoning_layer_used: POB lexical decisions for διὰ τὴν βίαν τοῦ ὄχλου
  rationale: The clause states the same cause in natural modern English without calling the crowd a mob.
