simplification_decisions:
- pob_phrase: On the next day
  simplified_phrase: The next day
  preserved_meaning: The visit occurred on the following day.
  reasoning_layer_used: Lexical decision for τῇ δὲ ἐπιούσῃ
  rationale: Removing “On” gives the same time reference in more natural English.
- pob_phrase: Paul went in with us to James
  simplified_phrase: Paul went with us to see James
  preserved_meaning: Paul accompanied the narrator’s group as they went to James.
  reasoning_layer_used: Lexical decisions for εἰσῄει, σὺν ἡμῖν, and πρὸς Ἰάκωβον
  rationale: “To see James” clearly expresses movement toward him without adding an identity or title.
- pob_phrase: all the elders were present
  simplified_phrase: All the elders were there
  preserved_meaning: Every elder attended the gathering.
  reasoning_layer_used: Lexical and theological decisions for παρεγένοντο and οἱ πρεσβύτεροι
  rationale: “Were there” makes their presence plain while retaining the neutral title “elders.”
