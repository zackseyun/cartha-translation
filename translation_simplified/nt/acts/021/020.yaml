translation:
  language: en
  text: When they heard this, they gave glory to God. Then they said to him, “Brother, you can see that many thousands[a] of Jews[b] have believed, and all of them are deeply devoted to the law of Moses.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “many tens of thousands”; the Greek can mean either tens of thousands or, more generally, a very large number.
    reason: lexical_alternative
  - marker: b
    text: Or “Judeans,” if the term is understood geographically.
    reason: lexical_alternative
