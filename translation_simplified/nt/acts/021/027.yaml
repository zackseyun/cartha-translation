translation:
  language: en
  text: As the seven-day period was about to end, the Jews from the province of Asia saw him in the temple complex. They stirred up the whole crowd[a] and seized him.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “threw the whole crowd into confusion.”
    reason: lexical_alternative
  - marker: b
    text: The Greek expression is literally “laid hands on him,” meaning they took hold of him by force.
    reason: simplification_note
