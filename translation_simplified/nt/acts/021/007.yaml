translation:
  language: en
  text: We completed our voyage from Tyre and arrived at Ptolemais. There we greeted the brothers[a] and stayed with them for one day.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “brothers and sisters”; the Greek says “brothers,” which can refer more broadly to fellow believers.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: having finished the voyage from Tyre
  simplified_phrase: completed our voyage from Tyre
  preserved_meaning: Their sea journey beginning at Tyre came to its end.
  reasoning_layer_used: Lexical decision for τὸν πλοῦν διανύσαντες
  rationale: A direct verb replaces the formal participial phrase while retaining completion of the voyage.
- pob_phrase: arrived at Ptolemais, and after greeting the brothers
  simplified_phrase: arrived at Ptolemais. There we greeted the brothers
  preserved_meaning: They reached Ptolemais before greeting the local believers.
  reasoning_layer_used: Lexical decisions for κατηντήσαμεν and ἀσπασάμενοι
  rationale: Two sentences make the sequence clear without changing the order of events.
- pob_phrase: we stayed with them one day
  simplified_phrase: stayed with them for one day
  preserved_meaning: They remained in the believers’ company for a single day.
  reasoning_layer_used: Lexical decisions for ἐμείναμεν, ἡμέραν μίαν, and παρ’ αὐτοῖς
  rationale: Adding “for” makes the duration immediately natural in modern English.
