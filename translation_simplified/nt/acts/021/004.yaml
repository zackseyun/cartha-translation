simplification_decisions:
- pob_phrase: After finding the disciples, we stayed there seven days.
  simplified_phrase: We found the disciples and stayed there for seven days.
  preserved_meaning: The disciples were found before the seven-day stay began.
  reasoning_layer_used: Lexical decisions for ἀνευρόντες, ἐπεμείναμεν αὐτοῦ, and ἡμέρας ἑπτά
  rationale: Two direct verbs and “for” make the sequence and duration immediately clear.
- pob_phrase: not to go up to Jerusalem
  simplified_phrase: not to go to Jerusalem
  preserved_meaning: The disciples repeatedly urged Paul not to proceed to Jerusalem.
  reasoning_layer_used: Lexical decision for μὴ ἐπιβαίνειν and the travel context
  rationale: “Go to” clearly states the destination without adding an unsupported continuative nuance.
translation_notes:
  risk_flags:
  - risk: Readers may assume the Spirit directly prohibited Paul’s journey.
    mitigation: The footnote preserves the possibility that the disciples inferred their warning from a Spirit-given revelation of suffering.
