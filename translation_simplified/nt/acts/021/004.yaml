translation:
  language: en
  text: We found the disciples and stayed there for seven days. Through the Spirit, they kept telling Paul not to go to Jerusalem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “by the Spirit.” The Spirit may have revealed that Paul would suffer, and the disciples may then have concluded that he should not go to Jerusalem.
