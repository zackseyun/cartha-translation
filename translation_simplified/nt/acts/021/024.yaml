translation:
  language: en
  text: Take these men with you and join them in the purification ritual. Pay their expenses so that they can shave their heads. Then everyone will know that the reports they have heard about you have no basis. Instead, they will know that you too live in line with the law and keep it.
  philosophy: optimal-equivalence
