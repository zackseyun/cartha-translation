translation:
  language: en
  text: Our people—the nation of twelve tribes—earnestly serve God night and day, hoping to receive what he promised. King Agrippa, my Jewish accusers have brought charges against me because of this very hope.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: our twelve tribes
  simplified_phrase: our people—the nation of twelve tribes
  preserved_meaning: Israel is viewed collectively as the people descended from the twelve tribes.
  reasoning_layer_used: POB lexical decision for τὸ δωδεκάφυλον ἡμῶν
  rationale: The explanatory phrase makes the collective sense clear without suggesting twelve separate groups acting independently.
- pob_phrase: hope to attain
  simplified_phrase: hoping to receive what he promised
  preserved_meaning: Israel hopes to reach the fulfillment of God's promise mentioned in the previous verse.
  reasoning_layer_used: POB lexical and theological decisions on the reference of the hope
  rationale: Common wording replaces the abstract verb “attain” while keeping the hope tied to God's promise.
- pob_phrase: It is concerning this hope that I am accused by the Jews, O king
  simplified_phrase: King Agrippa, my Jewish accusers have brought charges against me because of this very hope
  preserved_meaning: Paul directly tells the king that Jewish opponents have formally accused him over this hope.
  reasoning_layer_used: POB lexical decisions for ἐγκαλοῦμαι, ὑπὸ Ἰουδαίων, and βασιλεῦ
  rationale: The active legal wording is easier to follow and avoids implying that all Jewish people accused Paul.
interpretive_expansions:
- pob_phrase: to which
  rendering: what he promised
  claim: The goal of the tribes' hope is God's promise from the preceding verse.
  evidence:
  - The immediate antecedent in Acts 26:6 is the promise God made to the ancestors.
  - The POB theological decision explicitly links the hope to that promise without naming resurrection here.
  confidence: high
  alternatives_preserved:
  - The text does not specify resurrection in this verse.
  - The promise's fuller content remains supplied by the surrounding context.
- pob_phrase: by the Jews
  rendering: my Jewish accusers
  claim: The phrase identifies Paul's legal opponents rather than all Jewish people.
  evidence:
  - The courtroom setting limits the phrase to those bringing the accusation.
  - The POB footnote warns against reading the wording as a universal statement about Jews.
  confidence: high
  alternatives_preserved:
  - by Jews
  - by Jewish people
translation_notes:
  risk_flags:
  - risk: “Receive what he promised” makes the preceding verse's antecedent explicit.
    mitigation: It does not identify the promise as resurrection or add content beyond the POB's established link.
  - risk: “Because of” emphasizes the accusation's cause rather than only its subject.
    mitigation: The POB lists this causal wording as a contextual alternative, and the legal setting supports it.
