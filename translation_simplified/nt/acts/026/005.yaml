- pob_phrase: They have known me from the beginning, if they are willing to testify
  simplified_phrase: They have known me from the beginning. If they are willing to testify, they can confirm
  preserved_meaning: They have known Paul since earlier times, but whether they testify depends on their willingness.
  reasoning_layer_used: POB lexical decisions for προγινώσκοντες, ἄνωθεν, and ἐὰν θέλωσι μαρτυρεῖν
  rationale: Two sentences clarify the legal statement while keeping willingness tied directly to testifying.
- pob_phrase: I lived as a Pharisee according to the strictest sect of our religion
  simplified_phrase: I lived as a Pharisee, belonging to the strictest group within our religion
  preserved_meaning: Paul identifies himself with the Pharisees, the most rigorous recognized party within Judaism.
  reasoning_layer_used: POB lexical and theological decisions for ἀκριβεστάτην, αἵρεσιν, θρησκείας, and Φαρισαῖος
  rationale: “Belonging to the strictest group” avoids the misleading modern sense of “sect” without portraying the group as something Paul merely followed.
