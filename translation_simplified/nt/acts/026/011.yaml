translation:
  language: en
  text: In every synagogue, I punished them again and again and tried to force them to blaspheme. I was extremely enraged with them, and I kept persecuting them even as far as foreign cities.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “cities outside”; this likely means cities beyond Judea.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: in all the synagogues, punishing them many times
  simplified_phrase: In every synagogue, I punished them again and again
  preserved_meaning: Paul repeatedly punished believers throughout the synagogues.
  reasoning_layer_used: Lexical decisions for κατὰ πάσας τὰς συναγωγάς, πολλάκις, and τιμωρῶν
  rationale: The active clause and “again and again” clearly convey the scope and repetition.
- pob_phrase: being exceedingly enraged against them
  simplified_phrase: I was extremely enraged with them
  preserved_meaning: Paul’s hostility toward them was extraordinarily intense.
  reasoning_layer_used: Lexical decisions for περισσῶς and ἐμμαινόμενος
  rationale: A separate coordinated clause preserves the intense rage without making it an explicit cause.
- pob_phrase: I kept persecuting them even to the foreign cities
  simplified_phrase: I kept persecuting them even as far as foreign cities
  preserved_meaning: Paul’s ongoing persecution extended to cities beyond his usual region.
  reasoning_layer_used: Lexical decisions for ἐδίωκον and ἕως καὶ εἰς τὰς ἔξω πόλεις
  rationale: “Even as far as” preserves the movement and geographic extent in natural English.
translation_notes:
  risk_flags:
  - risk: Modern readers may assume a specific object of “blaspheme.”
    mitigation: The object remains unstated, following the Greek and the POB theological decision.
  - risk: “Foreign cities” is more idiomatic than the literal phrase “cities outside.”
    mitigation: The footnote preserves the literal alternative and its likely geographic sense.
