simplification_decisions:
- pob_phrase: but first to those in Damascus, then also in Jerusalem, and throughout all the region of Judea, and to the Gentiles, I proclaimed
  simplified_phrase: But I preached first to the people in Damascus, then in Jerusalem and throughout Judea, and also to the Gentiles.
  preserved_meaning: Paul publicly delivered the message in the stated geographic and ethnic sequence.
  reasoning_layer_used: Lexical decisions for the locations, sequence, Gentiles, and ἀπήγγελλον.
  rationale: The sentence is reordered into normal English while keeping every audience and the sequence.
- pob_phrase: they should repent and turn to God
  simplified_phrase: I told them to repent and turn to God
  preserved_meaning: Paul called for both repentance and a turn toward God.
  reasoning_layer_used: Lexical decisions for μετανοεῖν and ἐπιστρέφειν ἐπὶ τὸν θεόν.
  rationale: Direct wording makes the content of Paul's preaching easier to follow without merging the two responses.
- pob_phrase: doing works worthy of repentance
  simplified_phrase: let their actions show their repentance
  preserved_meaning: Conduct should fittingly accompany and give evidence of repentance.
  reasoning_layer_used: Theological decision on repentance, turning, and works.
  rationale: The wording explains the biblical phrase without presenting actions as the basis of acceptance.
