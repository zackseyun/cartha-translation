translation:
  language: en
  text: to open their eyes so they may turn from darkness to light and from Satan’s authority[a] to God, and so they may receive forgiveness of sins and an inheritance among those who have been made holy by faith in me.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Satan’s power” or “Satan’s dominion.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the authority of Satan
  simplified_phrase: Satan’s authority
  preserved_meaning: Satan’s ruling authority remains distinct from mere physical strength.
  reasoning_layer_used: lexical decision for ἐξουσία
  rationale: The possessive form is more natural while retaining POB’s preferred term.
- pob_phrase: that they may receive forgiveness of sins
  simplified_phrase: and so they may receive forgiveness of sins
  preserved_meaning: Receiving forgiveness remains coordinated with the verse’s purpose rather than placed later in time.
  reasoning_layer_used: purpose sequence for τοῦ λαβεῖν
  rationale: The added coordination clarifies the purpose sequence without implying a temporal next step.
- pob_phrase: among those who have been sanctified
  simplified_phrase: among those who have been made holy
  preserved_meaning: The inheritance is shared among people whom God has brought into an enduring holy state.
  reasoning_layer_used: lexical decision for ἡγιασμένοις
  rationale: “Made holy” explains “sanctified” while preserving its passive verbal force.
translation_notes:
  risk_flags:
  - risk: “Authority” may be understood too narrowly as formal permission.
    mitigation: The footnote preserves the possible senses of power and dominion.
