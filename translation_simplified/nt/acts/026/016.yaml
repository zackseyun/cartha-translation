simplification_decisions:
- pob_phrase: But rise and stand on your feet
  simplified_phrase: But get up and stand on your feet
  preserved_meaning: Jesus commands Paul to rise immediately while retaining the vivid bodily image.
  reasoning_layer_used: Lexical decisions for ἀνάστηθι and στῆθι ἐπὶ τοὺς πόδας σου.
  rationale: “Get up” is more common than “rise,” while “stand on your feet” preserves the source image.
- pob_phrase: 'for I have appeared to you for this purpose: to appoint you'
  simplified_phrase: 'I have appeared to you for this purpose: to appoint you'
  preserved_meaning: Jesus’ appearance has the stated purpose of formally commissioning Paul.
  reasoning_layer_used: Lexical decisions for εἰς τοῦτο γὰρ, ὤφθην σοι, and προχειρίσασθαί σε.
  rationale: A new sentence makes the purpose statement easier to follow without weakening “appeared” or “appoint.”
- pob_phrase: both of the things in which you have seen me and of the things in which I will appear to you
  simplified_phrase: of what you have seen of me and of what you will see when I appear to you
  preserved_meaning: Paul must witness to both the present revelation and what Jesus will reveal in future appearances.
  reasoning_layer_used: Lexical decisions for both relative clauses and the theological decision on appearance language.
  rationale: The compressed clauses are recast in natural English while explicitly retaining Jesus’ future appearance.
interpretive_expansions:
- pob_phrase: the things in which I will appear to you
  rendering: what you will see when I appear to you
  claim: Future appearances of Jesus will provide further content for Paul’s witness.
  evidence:
  - The future appearance verb links later revelation to Paul’s commission.
  - The POB lexical rationale identifies future revelations as the content of Paul’s witness.
  confidence: moderate
  alternatives_preserved:
