translation:
  language: en
  text: I asked, “Who are you, Lord?”[a] The Lord answered, “I am Jesus, the one you are persecuting.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Who are you, sir?” The Greek word can be a respectful form of address, but “Lord” fits this heavenly appearance because the speaker immediately identifies himself as Jesus.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: And I said
  simplified_phrase: I asked
  preserved_meaning: Saul spoke the question to the heavenly speaker.
  reasoning_layer_used: 'Lexical decision: the connective is mild, and the direct speech is a question.'
  rationale: “Asked” expresses the function of the speech naturally without changing its content.
- pob_phrase: And the Lord said
  simplified_phrase: The Lord answered
  preserved_meaning: The identified Lord responded directly to Saul.
  reasoning_layer_used: Lexical and theological decisions retain κύριος as “Lord.”
  rationale: “Answered” makes the question-and-response flow clear while preserving the title “Lord.”
- pob_phrase: whom you are persecuting
  simplified_phrase: the one you are persecuting
  preserved_meaning: Jesus identifies himself as the ongoing target of Saul’s persecution.
  reasoning_layer_used: 'Lexical decision: διώκω has the hostile sense “persecute,” and the present tense indicates ongoing action.'
  rationale: “The one” avoids formal “whom” while keeping the personal identification and ongoing action.
translation_notes:
  risk_flags:
  - risk: Changing “said” to “asked” and “answered” makes the speech functions explicit.
    mitigation: The question form and immediate reply directly establish those functions.
