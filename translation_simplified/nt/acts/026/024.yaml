translation:
  language: en
  text: As Paul continued his defense, Festus called out loudly, “Paul, you are out of your mind! All your learning is driving you mad.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: As he was saying these things in his defense
  simplified_phrase: As Paul continued his defense
  preserved_meaning: Paul was still giving his legal and verbal defense when Festus spoke.
  reasoning_layer_used: POB lexical decision for ἀπολογουμένου
  rationale: Naming Paul and using “continued” makes the ongoing action easier to follow.
- pob_phrase: Festus said with a loud voice
  simplified_phrase: Festus called out loudly
  preserved_meaning: Festus spoke forcefully enough to interrupt Paul.
  reasoning_layer_used: POB lexical decision for μεγάλῃ τῇ φωνῇ
  rationale: “Called out loudly” expresses the vivid interruption in ordinary English.
- pob_phrase: Your great learning is driving you into madness
  simplified_phrase: All your learning is driving you mad
  preserved_meaning: Festus accused Paul’s extensive learning of pushing him into insanity.
  reasoning_layer_used: POB lexical decisions for τὰ πολλά γράμματα, εἰς μανίαν, and περιτρέπει
  rationale: The revised wording is natural English while retaining both the cause and movement toward madness.
