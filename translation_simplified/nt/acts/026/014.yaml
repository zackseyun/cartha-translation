translation:
  language: en
  text: After we had all fallen to the ground, I heard a voice speak to me in Hebrew:[a] “Saul, Saul, why are you persecuting me? It is hard for you to kick against the pointed prods used to drive animals.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or possibly “in Aramaic”; the Greek expression literally says “in the Hebrew language or dialect.”
    reason: alternative_reading
  - marker: b
    text: This proverb means that resisting the speaker only brings harm to oneself.
    reason: cultural_note
