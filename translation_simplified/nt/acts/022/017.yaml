  rationale: Removing the event formula makes the sequence direct and natural without losing the transition.
- pob_phrase: while I was praying in the temple, I fell into a trance
  simplified_phrase: I fell into a trance while I was praying in the temple
  preserved_meaning: The trance began during Paul’s prayer in the temple.
