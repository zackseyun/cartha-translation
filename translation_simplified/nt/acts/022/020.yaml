translation:
  language: en
  text: When Stephen, your witness,[a] was being killed and his blood was being poured out, I myself was there, approving what they were doing and guarding the cloaks of those who were killing him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “martyr.” The Greek word means “witness,” but it later became especially associated with someone who dies for bearing witness.
    reason: lexical_alternative
