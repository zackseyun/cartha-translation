translation:
  language: en
  text: I am a Jewish man. I was born in Tarsus in Cilicia, but I grew up here in this city. I studied at the feet of Gamaliel[a] and received strict training in the law of our fathers. I was zealous for God, just as all of you are today.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “At the feet of Gamaliel” means that Gamaliel was his teacher.
    reason: cultural_note
simplification_decisions:
- pob_phrase: born in Tarsus of Cilicia, but brought up in this city
  simplified_phrase: I was born in Tarsus in Cilicia, but I grew up here in this city.
  preserved_meaning: Paul contrasts his birthplace with the city where he was raised.
  reasoning_layer_used: POB lexical decisions for γεγεννημένος and ἀνατεθραμμένος
  rationale: Two direct clauses make the geographic contrast easier to follow.
- pob_phrase: at the feet of Gamaliel, educated according to the strictness
  simplified_phrase: I studied at the feet of Gamaliel and received strict training
  preserved_meaning: Paul was formally educated under Gamaliel with rigorous attention to the law.
  reasoning_layer_used: POB lexical and theological decisions for παρὰ τοὺς πόδας Γαμαλιήλ and κατὰ ἀκρίβειαν
  rationale: The rewrite explains the educational relationship while preserving its vivid image.
- pob_phrase: being zealous for God just as all of you are today
  simplified_phrase: I was zealous for God, just as all of you are today.
  preserved_meaning: Paul identifies his own zeal for God with the present zeal of his audience.
  reasoning_layer_used: POB lexical decision for ζηλωτὴς and καθώς
  rationale: A finite verb makes the comparison clear without weakening Paul's solidarity with his hearers.
