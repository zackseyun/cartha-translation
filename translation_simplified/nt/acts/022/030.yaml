translation:
  language: en
  text: The next day, the commander wanted to find out for certain what the Jews[a] were accusing Paul of. So he released Paul and ordered the chief priests and the whole council[b] to meet. Then he brought Paul down and had him stand before them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Greek says “the Jews”; here it refers to Paul’s accusers, not to every Jewish person.
    reason: lexical_alternative
  - marker: b
    text: This council was the Sanhedrin, the Jewish ruling body in Jerusalem.
    reason: cultural_note
simplification_decisions:
- pob_phrase: wanting to know for certain what he was being accused of by the Jews
  simplified_phrase: wanted to find out for certain what the Jews were accusing Paul of
  preserved_meaning: The commander sought reliable knowledge of the accusation against Paul.
  reasoning_layer_used: Lexical decisions for βουλόμενος, γνῶναι τὸ ἀσφαλές, and τὸ τί κατηγορεῖται
  rationale: The active wording is easier to follow while retaining the purpose and certainty of the Greek.
- pob_phrase: ordered the chief priests and the whole council to assemble
  simplified_phrase: ordered the chief priests and the whole council to meet
  preserved_meaning: The commander authoritatively summoned all the council members.
  reasoning_layer_used: Lexical decisions for ἐκέλευσεν συνελθεῖν and πᾶν τὸ συνέδριον
  rationale: “Meet” is more familiar than “assemble” without weakening the official command.
- pob_phrase: bringing Paul down, he set him before them
  simplified_phrase: Then he brought Paul down and had him stand before them
  preserved_meaning: The commander moved Paul to the meeting place and formally presented him to the council.
  reasoning_layer_used: Lexical decisions for καταγαγὼν τὸν Παῦλον and ἔστησεν εἰς αὐτούς
  rationale: Two direct verbs replace the awkward participial structure while preserving the movement and presentation.
interpretive_expansions:
- pob_phrase: he
  rendering: the commander
  claim: The acting official is the Roman commander from the preceding context.
  evidence:
  - The immediate narrative context identifies the commander as the person seeking the facts and directing Paul’s custody.
  confidence: high
  alternatives_preserved:
  - he
translation_notes:
  risk_flags:
  - risk: “The Jews” could be misread as referring to all Jewish people.
    mitigation: The footnote limits the reference to Paul’s accusers while preserving the POB’s source-driven wording.
  - risk: “Released Paul” could sound like complete freedom from Roman custody.
    mitigation: The following actions show that the commander still controlled Paul’s movement and appearance before the council.
