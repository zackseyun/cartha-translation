simplification_decisions:
- pob_phrase: And since I could not see because of the brightness of that light
  simplified_phrase: The brightness of that light left me unable to see. So
  preserved_meaning: The extraordinary light caused Paul’s inability to see, which explains why others had to lead him.
  reasoning_layer_used: Lexical decisions for ἐνέβλεπον, ἀπὸ τῆς δόξης τοῦ φωτὸς ἐκείνου, and ὡς δὲ
  rationale: Two direct sentences make the cause and result easier to follow.
- pob_phrase: being led by the hand by those who were with me
  simplified_phrase: the people with me took me by the hand and led me
  preserved_meaning: Those accompanying Paul physically guided him by the hand.
  reasoning_layer_used: Lexical decisions for χειραγωγούμενος and ὑπὸ τῶν συνόντων μοι
  rationale: An active clause removes the awkward participle while preserving the vivid hand-guidance.
- pob_phrase: I came into Damascus
  simplified_phrase: led me into Damascus
  preserved_meaning: Paul entered Damascus with their help.
  reasoning_layer_used: Lexical decision for ἦλθον εἰς Δαμασκόν
  rationale: Combining the arrival with the leading produces natural English without losing movement into the city.
