translation:
  language: en
  text: The high priest and the entire council of elders can confirm what I have said. They also gave me letters to the brothers in Damascus.[a] I was traveling there to bring the people in Damascus to Jerusalem bound, so that they could be punished.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “brothers and sisters.” The Greek says “brothers,” but in some contexts it can refer to a wider community.
    reason: lexical_alternative
