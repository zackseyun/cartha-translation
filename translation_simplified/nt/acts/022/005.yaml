- pob_phrase: as also the high priest and the whole council of elders can testify for me
  simplified_phrase: The high priest and the entire council of elders can confirm what I have said
  preserved_meaning: Both authorities can corroborate Paul’s account.
  reasoning_layer_used: Lexical decisions for ὡς καὶ, μαρτυρεῖ μοι, and πᾶν τὸ πρεσβυτέριον
  rationale: This turns the difficult opening comparison into a direct statement of corroboration.
- pob_phrase: From them I also received letters to the brothers in Damascus
  simplified_phrase: They also gave me letters to the brothers in Damascus
  preserved_meaning: The high priest and council supplied letters directed to the Damascus brothers.
  reasoning_layer_used: Lexical decisions for παρ’ ὧν, ἐπιστολάς, and πρὸς τοὺς ἀδελφοὺς
  rationale: The active sentence identifies the senders while preserving the letters’ direction and “brothers.”
- pob_phrase: to bring also those who were there, bound, to Jerusalem
  simplified_phrase: to bring the people in Damascus to Jerusalem bound
  preserved_meaning: Paul intended to take the people located in Damascus to Jerusalem while they were bound.
  reasoning_layer_used: Lexical decisions for ἄξων, τοὺς ἐκεῖσε ὄντας, and δεδεμένους
  rationale: Naming Damascus clarifies who “those who were there” means while retaining the source image “bound.”
