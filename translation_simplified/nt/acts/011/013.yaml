simplification_decisions:
- pob_phrase: And he reported to us how
  simplified_phrase: He told us how
  preserved_meaning: He relayed to the group what he had experienced.
  reasoning_layer_used: The lexical decision allows “told” while retaining “how” to introduce the report.
  rationale: “Told us” is more familiar in ordinary narrative.
- pob_phrase: the angel standing in his house and saying
  simplified_phrase: the angel standing in his house. The angel said
  preserved_meaning: The same angel stood in his house and spoke to him.
  reasoning_layer_used: The lexical decisions preserve the angel’s posture and speech.
  rationale: Two sentences make the participial structure easier to follow.
- pob_phrase: Send to Joppa and summon Simon
  simplified_phrase: Send someone to Joppa and send for Simon
  preserved_meaning: He was commanded to dispatch a person to Joppa to bring Simon.
  reasoning_layer_used: The lexical rationale identifies an implicit object for “Send” and permits “send for” for “summon.”
  rationale: The wording makes the implied person clear and uses a familiar phrase without adding a destination.
