translation:
  language: en
  text: But some of the believers were men from Cyprus and Cyrene. When they arrived in Antioch, they also spoke to Greek-speaking Jews, telling them the good news about the Lord Jesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some manuscripts say “Greeks.” If that reading is original, these men were speaking to Gentiles, not only to Greek-speaking Jews.
    reason: textual_variant
simplification_decisions:
- pob_phrase: some of them
  simplified_phrase: some of the believers
  preserved_meaning: An unspecified group within the previously mentioned believers is in view.
  reasoning_layer_used: source context and lexical decision for τινες
  rationale: Naming the implied group makes the sentence understandable without the preceding verse.
- pob_phrase: who, when they came to Antioch, were also speaking
  simplified_phrase: When they arrived in Antioch, they also spoke
  preserved_meaning: Their speaking in Antioch expanded the audience of their message.
  reasoning_layer_used: lexical decisions for ἐλθόντες, ἐλάλουν, and καί
  rationale: Two shorter sentences remove the dense relative clause while retaining the time and added audience.
- pob_phrase: proclaiming the good news about the Lord Jesus
  simplified_phrase: telling them the good news about the Lord Jesus
  preserved_meaning: They verbally announced the gospel centered on the Lord Jesus.
  reasoning_layer_used: lexical decisions for εὐαγγελιζόμενοι and τὸν κύριον Ἰησοῦν
  rationale: “Telling them” is common English while preserving verbal gospel proclamation and Jesus’ title.
interpretive_expansions:
- pob_phrase: the Hellenists
  rendering: Greek-speaking Jews
  claim: The printed Greek text refers to Jews who spoke Greek.
  evidence:
  - The SBLGNT reads Ἑλληνιστάς, which the POB lexical decision identifies as Greek-speaking Jews.
  - The POB theological decision retains “Greeks” only as a textual variant.
  confidence: high
  alternatives_preserved:
  - Greeks, meaning Gentiles, is preserved in the footnote.
