translation:
  language: en
  text: One of them, named Agabus, stood up. Through the Spirit, he made known that a great famine would soon come over the inhabited world.[a] This famine happened during the time of Claudius.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the whole world.” Here “inhabited world” may refer more specifically to the Roman world.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And one of them, named Agabus, stood up and indicated by the Spirit
  simplified_phrase: One of them, named Agabus, stood up. Through the Spirit, he made known
  preserved_meaning: Agabus stood up and communicated a revelation given through the Holy Spirit.
  reasoning_layer_used: Lexical decisions for ἀναστὰς, ἐσήμανεν, and διὰ τοῦ πνεύματος; theological decision on the Spirit
  rationale: Shorter clauses clarify the action while keeping the Spirit as the revelation’s source.
- pob_phrase: was about to come over the whole inhabited world
  simplified_phrase: would soon come over the inhabited world
  preserved_meaning: The great famine was impending and would affect the inhabited world.
  reasoning_layer_used: Lexical decisions for μέλλειν ἔσεσθαι and ἐφ’ ὅλην τὴν οἰκουμένην
  rationale: “Would soon come over” expresses imminence without adding a spreading-process image.
- pob_phrase: which happened in the time of Claudius
  simplified_phrase: This famine happened during the time of Claudius.
  preserved_meaning: The predicted famine occurred during the period of Claudius.
  reasoning_layer_used: Lexical decisions for ἐγένετο and ἐπὶ Κλαυδίου
  rationale: Naming the famine removes ambiguity and makes Luke’s confirmation clear.
translation_notes:
  risk_flags:
  - risk: Modern readers may take “inhabited world” to mean the entire globe.
