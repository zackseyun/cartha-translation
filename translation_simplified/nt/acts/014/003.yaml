translation:
  language: en
  text: So they stayed there for a long time, speaking boldly for the Lord.[a] The Lord was confirming the message of his grace by enabling signs and wonders to be done through their hands.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “speaking boldly in the Lord.” The Greek may mean that their boldness came from relying on the Lord or was exercised in relation to him.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: stayed there a considerable time
  simplified_phrase: stayed there for a long time
  preserved_meaning: They remained there for a substantial period without specifying its exact length.
  reasoning_layer_used: Lexical decision for ἱκανὸν ... χρόνον
  rationale: “For a long time” is more natural common English and preserves the substantial duration.
- pob_phrase: was bearing witness to the word of his grace
  simplified_phrase: was confirming the message of his grace
  preserved_meaning: The Lord continually authenticated the proclaimed message while leaving its relation to grace open.
  reasoning_layer_used: Lexical decisions for μαρτυρέω, λόγος, and χάρις; grounding review
  rationale: “Was confirming” keeps the ongoing attestation, while “of his grace” preserves the documented ambiguity.
- pob_phrase: granting signs and wonders to be done through their hands
  simplified_phrase: by enabling signs and wonders to be done through their hands
  preserved_meaning: The Lord empowered miraculous acts while the apostles served as his instruments.
  reasoning_layer_used: Lexical decisions for διδόντι, σημεῖα καὶ τέρατα, and διὰ τῶν χειρῶν αὐτῶν
  rationale: “Enabling” makes the Lord’s agency clear while preserving the paired terms and the concrete hands image.
translation_notes:
  risk_flags:
  - risk: “Confirming” is less explicitly testimonial than “bearing witness.”
    mitigation: The ongoing form and the signs and wonders retain the sense of continuing divine attestation.
  - risk: “For the Lord” may not express the possible basis or sphere of their boldness.
    mitigation: Footnote [a] preserves the important alternative “in the Lord.”
