translation:
  language: en
  text: After they appointed elders for the believers in every church[a], they prayed and fasted. Then they placed the believers in the care of the Lord, in whom they had put their faith.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also mean that they chose or elected the elders, but it does not specify a particular voting process.
    reason: alternative_reading
  - marker: b
    text: “The believers” may instead refer specifically to the newly appointed elders.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: And after appointing elders for them in every church, and praying with fasting
  simplified_phrase: After they appointed elders for the believers in every church, they prayed and fasted.
  preserved_meaning: Elders were appointed in each congregation, with prayer and fasting before the believers were entrusted to the Lord.
  reasoning_layer_used: Lexical decisions for κατ’ ἐκκλησίαν, πρεσβυτέρους, προσευξάμενοι, and μετὰ νηστειῶν
  rationale: Two shorter clauses make the sequence clear while keeping prayer and fasting distinct.
- pob_phrase: they entrusted them to the Lord
  simplified_phrase: they placed the believers in the care of the Lord
  preserved_meaning: The believers were committed to the Lord’s personal care.
  reasoning_layer_used: Lexical decision for παρέθεντο and theological decision on αὐτοὺς
  rationale: The concrete phrase explains “entrusted” in familiar English without weakening its relational force.
- pob_phrase: in whom they had believed
  simplified_phrase: in whom they had put their faith
  preserved_meaning: The believers had already placed settled trust in the Lord.
  reasoning_layer_used: Lexical decision for εἰς ὃν πεπιστεύκεισαν
  rationale: “Put their faith” clearly expresses belief directed toward the Lord.
interpretive_expansions:
- pob_phrase: them
  rendering: the believers
  claim: Those placed in the Lord’s care were the believers in the congregations.
  evidence:
  - The POB theological decision identifies the believers or congregations as the most natural referent.
  - Acts 14 broadly focuses on strengthening the disciples.
  confidence: moderate
  alternatives_preserved:
  - The pronoun may refer specifically to the newly appointed elders.
translation_notes:
  risk_flags:
