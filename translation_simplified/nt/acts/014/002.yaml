translation:
  language: en
  text: But the Jews who refused to believe the message stirred up the non-Jews. They poisoned the non-Jews’ attitudes toward the brothers.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Refused to believe” can also be translated “were disobedient.” Here it refers to rejecting the message.
    reason: lexical_alternative
  - marker: b
    text: “Brothers” here likely includes all the believers, both men and women.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the Gentiles
  simplified_phrase: the non-Jews
  preserved_meaning: The people stirred up were those outside the Jewish community.
  reasoning_layer_used: POB lexical decision for τῶν ἐθνῶν
  rationale: “Non-Jews” makes the Jewish-Gentile contrast immediately clear to new readers.
- pob_phrase: poisoned their minds
  simplified_phrase: poisoned the non-Jews’ attitudes
  preserved_meaning: Their inner disposition toward the believers was deliberately corrupted.
  reasoning_layer_used: POB lexical decision and footnote for ἐκάκωσαν τὰς ψυχὰς
  rationale: “Attitudes” avoids a literal misunderstanding of “minds” while retaining the vivid poison image.
- pob_phrase: one dense coordinated sentence
  simplified_phrase: two short sentences
  preserved_meaning: The opponents both stirred up the non-Jews and corrupted their disposition.
  reasoning_layer_used: POB syntax and lexical decisions
  rationale: The sentence break makes the two distinct hostile actions easier to follow.
interpretive_expansions:
- pob_phrase: refused to believe
  rendering: refused to believe the message
  claim: The implied object of their refusal was the apostolic message.
  evidence:
  - The POB lexical rationale identifies rejection of the gospel as the contextual sense.
  - The immediate evangelistic context supplies the implied object.
  confidence: high
  alternatives_preserved:
