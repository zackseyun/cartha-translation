    mitigation: The restrictive phrase “who refused to believe the message” identifies the local opposing group.
  - risk: “Poisoned” could be mistaken for literal physical poisoning.
    mitigation: Its object, “attitudes,” clearly marks the expression as an image of hostile influence.
