simplification_decisions:
- pob_phrase: And from there they sailed away to Antioch
  simplified_phrase: From there they sailed to Antioch
  preserved_meaning: They departed by sea from the previous place and went to Antioch.
  reasoning_layer_used: Lexical decisions for κἀκεῖθεν and ἀπέπλευσαν
  rationale: “From there” already makes the departure clear, so “away” is unnecessary.
- pob_phrase: where they had been entrusted to the grace of God
  simplified_phrase: where they had been entrusted to God’s grace
  preserved_meaning: Antioch was the place from which they had earlier been placed into the care of God’s grace.
  reasoning_layer_used: Lexical and theological decisions for ὅθεν, παραδίδωμι, and τῇ χάριτι τοῦ θεοῦ
  rationale: The relative clause preserves Antioch’s link to their earlier entrusting while “God’s grace” is more natural English.
- pob_phrase: the work that they had fulfilled
  simplified_phrase: the work they had completed
  preserved_meaning: They brought the work assigned to them to completion.
  reasoning_layer_used: Lexical decision and POB footnote for ὃ ἐπλήρωσαν
  rationale: “Completed” is the documented plain-English alternative to “fulfilled.”
