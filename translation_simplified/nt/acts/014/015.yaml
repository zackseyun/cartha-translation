translation:
  language: en
  text: They said, “Men, why are you doing this? We too are human beings, just like you. We are bringing you good news, calling you to turn away from these worthless things[a] to the living God, who made heaven, earth, the sea, and everything in them.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Worthless things” refers here to futile pagan worship, including idols.
    reason: cultural_note
simplification_decisions:
- pob_phrase: We also are men with the same nature as you
  simplified_phrase: We too are human beings, just like you
  preserved_meaning: Paul and Barnabas share the crowd’s human condition and are not gods.
  reasoning_layer_used: lexical and theological decisions on ὁμοιοπαθεῖς and ἄνθρωποι
  rationale: The clearer wording preserves the emphatic rejection of divine honors.
- pob_phrase: bringing you good news to turn
  simplified_phrase: bringing you good news, calling you to turn
  preserved_meaning: The good news urges the hearers to turn from false worship to God.
  reasoning_layer_used: lexical decision on εὐαγγελιζόμενοι and ἐπιστρέφειν
  rationale: The added finite idea makes the purpose relationship clear in natural English.
- pob_phrase: the heaven and the earth and the sea and everything in them
  simplified_phrase: heaven, earth, the sea, and everything in them
  preserved_meaning: The living God made the whole created order and all it contains.
  reasoning_layer_used: lexical decisions on τὸν οὐρανὸν and πάντα τὰ ἐν αὐτοῖς
  rationale: The creation formula is recast in ordinary English without reducing its scope.
