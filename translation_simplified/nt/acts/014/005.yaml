simplification_decisions:
- pob_phrase: And when an attempt was made by both the Gentiles and the Jews
  simplified_phrase: Then both Gentiles and Jews ... tried
  preserved_meaning: Both groups joined in hostile action that had begun but was not completed in this verse.
  reasoning_layer_used: POB lexical decisions for ὡς δὲ, ἐγένετο, ὁρμή, and τε καὶ
  rationale: The active wording removes the heavy passive construction while preserving the attempted action.
- pob_phrase: together with their rulers
  simplified_phrase: together with their leaders
  preserved_meaning: People in civic or communal authority joined them.
  reasoning_layer_used: POB lexical decision for σὺν τοῖς ἄρχουσιν αὐτῶν
  rationale: “Leaders” is common English and remains within the POB's approved alternatives.
- pob_phrase: to mistreat them and to stone them
  simplified_phrase: to mistreat Paul and Barnabas and stone them
  preserved_meaning: The opponents intended both abusive treatment and stoning, without stating that either was completed.
  reasoning_layer_used: POB lexical decisions for ὑβρίσαι, λιθοβολῆσαι, and αὐτούς
  rationale: Naming Paul and Barnabas makes the pronoun clear without adding a result such as death.
interpretive_expansions:
