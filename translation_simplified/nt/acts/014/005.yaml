translation:
  language: en
  text: Then both Gentiles and Jews, together with their leaders, tried[a] to mistreat Paul and Barnabas and stone them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also describe a violent rush or assault, but the actions were not yet completed.
