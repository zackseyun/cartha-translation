  rationale: A finite verb is clearer and more natural in modern narrative.
- pob_phrase: Give me also this authority
  simplified_phrase: Give me this authority too
  preserved_meaning: Simon asks to share the same delegated capacity he has observed.
  reasoning_layer_used: POB lexical decisions for Δότε, κἀμοί, ἐξουσίαν, and ταύτην
  rationale: The new word order expresses inclusion naturally while retaining “authority” rather than flattening it to “power.”
- pob_phrase: anyone on whom I lay my hands may receive
  simplified_phrase: anyone I lay my hands on will receive
  preserved_meaning: Simon wants his laying on of hands to result in any chosen person receiving the Spirit.
  reasoning_layer_used: POB lexical decisions for ᾧ ἐὰν, ἐπιθῶ τὰς χεῖρας, and λαμβάνῃ
  rationale: Ordinary English clause order keeps the concrete action and intended result clear.
