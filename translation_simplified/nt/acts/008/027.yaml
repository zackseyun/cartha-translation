translation:
  language: en
  text: So he got up and went. Now there was an Ethiopian man, a eunuch,[a] who was a high official serving Candace,[b] queen of the Ethiopians. He was in charge of her entire treasury and had come to Jerusalem to worship.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek term can also mean “court official” in some contexts, but here it probably means “eunuch” literally.
    reason: lexical_alternative
  - marker: b
    text: “Candace” may have been a title for the queen rather than her personal name.
    reason: cultural_note
simplification_decisions:
- pob_phrase: And behold, an Ethiopian man
  simplified_phrase: Now there was an Ethiopian man
  preserved_meaning: The wording introduces the man as the new focus of the scene.
  reasoning_layer_used: POB lexical decision for ἰδοὺ
  rationale: “Now there was” preserves the attention shift without the unfamiliar “behold.”
- pob_phrase: a high official of Candace
  simplified_phrase: a high official serving Candace
  preserved_meaning: He held a position of authority under the queen.
  reasoning_layer_used: POB lexical decisions for δυνάστης and the genitive phrase
  rationale: “Serving” makes his relationship to the queen clear in ordinary English.
- pob_phrase: who was over all her treasury
  simplified_phrase: He was in charge of her entire treasury
  preserved_meaning: He administered all the queen’s treasury.
  reasoning_layer_used: POB lexical decision for ἐπὶ πάσης τῆς γάζης αὐτῆς
  rationale: A separate sentence and “in charge of” express his responsibility more naturally.
translation_notes:
  risk_flags:
  - risk: Modern readers may understand “eunuch” only as a job title or only as a bodily description.
    mitigation: The main text keeps the likely literal sense, while footnote a preserves the broader lexical possibility.
  - risk: Replacing “behold” may reduce Luke’s vivid narrative emphasis.
    mitigation: “Now there was” retains an explicit shift of attention to the Ethiopian man.
