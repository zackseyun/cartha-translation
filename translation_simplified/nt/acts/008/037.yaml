translation:
  language: en
  text: Philip said, “If you believe with all your heart, you may be baptized.” The man answered, “I believe that Jesus is the Messiah, the Son of God.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This verse is absent from the earliest Greek manuscripts and early Coptic translations. It appears in the Byzantine majority and Latin traditions and was cited by Irenaeus and Cyprian in the late second century; many scholars regard it as an early baptismal confession later added to Acts.
    reason: textual_variant
