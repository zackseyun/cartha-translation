translation:
  language: en
  text: For unclean spirits came out of many people, shouting loudly, and many who were paralyzed or could not walk properly were healed.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: For many who had unclean spirits, they came out
  simplified_phrase: For unclean spirits came out of many people
  preserved_meaning: The unclean spirits left the people who had them.
  reasoning_layer_used: Theological decision and lexical decisions for τῶν ἐχόντων and ἐξήρχοντο
  rationale: The clause is recast to identify the spirits clearly as the subject of “came out.”
- pob_phrase: crying with a loud voice
  simplified_phrase: shouting loudly
  preserved_meaning: The spirits made loud cries as they came out.
  reasoning_layer_used: Lexical decision for βοῶντα φωνῇ μεγάλῃ
  rationale: The common phrase states both the crying and its loud volume without awkward repetition.
- pob_phrase: lame
  simplified_phrase: could not walk properly
  preserved_meaning: Many people with serious difficulty walking were healed.
  reasoning_layer_used: Lexical decision for χωλοὶ
  rationale: The physical condition is expressed directly for readers unfamiliar with the biblical use of “lame.”
interpretive_expansions:
- pob_phrase: they came out
  rendering: unclean spirits came out of many people
  claim: The spirits came out from the afflicted people rather than merely appearing.
  evidence:
  - The POB theological decision identifies the unclean spirits as those coming out of the people.
  - The genitive construction identifies the affected people as those who had the spirits.
  confidence: high
  alternatives_preserved:
  - The afflicted people may be understood as the human setting of the spirits’ departure.
translation_notes:
  risk_flags:
  - risk: “Could not walk properly” may sound more absolute than some cases covered by “lame.”
    mitigation: The wording retains the core mobility impairment without using a term now often considered dated.
