translation:
  language: en
  text: An angel of the Lord said to Philip, “Get up and go south[a] to the road that leads down from Jerusalem to Gaza.” This road is deserted.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “go at noon.” The Greek can refer either to the direction south or to midday.
    reason: alternative_reading
  - marker: b
    text: Or “This is desert,” possibly meaning that the road passes through a desert region.
    reason: lexical_alternative
