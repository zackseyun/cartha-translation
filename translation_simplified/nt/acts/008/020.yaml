translation:
  language: en
  text: But Peter said to him, “May your silver—your money—perish with you, because you thought you could obtain God’s gift by paying for it.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: your silver
  simplified_phrase: your silver—your money
  preserved_meaning: The wording keeps the Greek image of silver while immediately explaining that it means money.
  reasoning_layer_used: POB lexical decision for ἀργύριον
  rationale: The brief explanation makes the ancient money reference clear without losing the concrete image.
- pob_phrase: acquire the gift of God with money
  simplified_phrase: obtain God’s gift by paying for it
  preserved_meaning: Simon believed he could gain God’s gift through payment.
  reasoning_layer_used: POB lexical decisions for κτᾶσθαι and διὰ χρημάτων
  rationale: “Obtain” and “paying for it” express the transaction in ordinary modern English.
translation_notes:
  risk_flags:
  - risk: “Perish with you” may sound like a prediction rather than an imprecatory pronouncement.
    mitigation: Keeping “May” preserves the optative force and avoids asserting final condemnation.
