translation:
  language: en
  text: But when Simon saw that the Spirit[a] was given through the apostles placing their hands on people, he offered the apostles money.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the Holy Spirit.” The Greek says “the Spirit,” referring here to the Holy Spirit.
