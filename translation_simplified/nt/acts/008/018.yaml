simplification_decisions:
- pob_phrase: through the laying on of the apostles’ hands
  simplified_phrase: through the apostles placing their hands on people
  preserved_meaning: The apostles’ action was the means through which the Spirit was given.
  reasoning_layer_used: POB lexical and theological decisions on means and agency
  rationale: The concrete wording explains the biblical expression while “through” preserves instrumentality.
- pob_phrase: he offered them money
  simplified_phrase: he offered the apostles money
  preserved_meaning: Simon responded by proposing payment to the apostles.
  reasoning_layer_used: POB lexical decisions for προσήνεγκεν, αὐτοῖς, and χρήματα
  rationale: Repeating “the apostles” makes the recipient clear.
interpretive_expansions:
- pob_phrase: the laying on of the apostles’ hands
  rendering: the apostles placing their hands on people
  claim: The apostles placed their hands on the people receiving the Spirit.
  evidence:
