  preserved_meaning: Saul forcibly removed men and women and repeatedly delivered them into official custody.
  reasoning_layer_used: lexical decisions for σύρων, παρεδίδου, and εἰς φυλακήν
  rationale: The wording preserves both the forceful removal and the intervening handover into custody.
