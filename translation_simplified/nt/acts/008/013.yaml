translation:
  language: en
  text: Even Simon himself believed. After he was baptized, he stayed close to Philip. As he watched signs and great acts of power take place, he was amazed.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek can also be understood as “great miracles.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And Simon himself also believed
  simplified_phrase: Even Simon himself believed
  preserved_meaning: Simon too responded by believing, with emphasis on Simon himself.
  reasoning_layer_used: Lexical decision for καὶ αὐτός and theological decision for ἐπίστευσεν
  rationale: “Even Simon himself” expresses the emphasis naturally without judging whether his faith was genuine.
- pob_phrase: after being baptized he continued with Philip
  simplified_phrase: After he was baptized, he stayed close to Philip
  preserved_meaning: His baptism came first, followed by an ongoing attachment to Philip.
  reasoning_layer_used: Lexical decisions for βαπτισθείς and ἦν προσκαρτερῶν
  rationale: A separate sentence makes the sequence and continued closeness easier to follow.
- pob_phrase: as he saw signs and great works of power happening, he was amazed
  simplified_phrase: As he watched signs and great acts of power take place, he was amazed
  preserved_meaning: Simon repeatedly witnessed extraordinary signs and manifestations of power and remained astonished.
  reasoning_layer_used: Lexical decisions for θεωρῶν, σημεῖα, δυνάμεις μεγάλας, γινομένας, and ἐξίστατο
  rationale: “Watched,” “acts,” and “take place” make the scene natural while preserving both the signs and the power image.
translation_notes:
  risk_flags:
  - risk: Readers may assume that “believed” settles whether Simon was genuinely converted.
    mitigation: The text leaves “believed” unqualified, preserving the narrative’s theological tension.
  - risk: “Great acts of power” may be understood more broadly than miracles.
    mitigation: The footnote preserves “great miracles” as the contextual lexical alternative.
