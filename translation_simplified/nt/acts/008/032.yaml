translation:
  language: en
  text: 'This is the passage of Scripture he was reading: “He was led like a sheep to be slaughtered. And as a lamb is silent before the person shearing it, so he does not open his mouth.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: The passage of Scripture that he was reading was this
  simplified_phrase: This is the passage of Scripture he was reading
  preserved_meaning: The words that follow are the specific sacred passage he was reading.
  reasoning_layer_used: Lexical decisions for περιοχή, γραφή, and ἀνεγίνωσκεν
  rationale: The shorter clause keeps “passage,” “Scripture,” and the ongoing act of reading.
- pob_phrase: Like a sheep he was led to slaughter
  simplified_phrase: He was led like a sheep to be slaughtered
  preserved_meaning: He is compared to a sheep being led toward death.
  reasoning_layer_used: Lexical decisions for ὡς πρόβατον, ἐπὶ σφαγήν, and ἤχθη
  rationale: Ordinary English word order makes the same simile easier to grasp.
- pob_phrase: like a lamb before the one shearing it is silent
  simplified_phrase: as a lamb is silent before the person shearing it
  preserved_meaning: The lamb remains silent in front of the person removing its wool.
  reasoning_layer_used: Lexical decisions for ἀμνός, ἐναντίον, κείραντος, and ἄφωνος
  rationale: The recast clause removes awkward participial order while preserving the shearing image.
