translation:
  language: en
  text: But Philip was found at Azotus.[a] As he traveled on, he told the good news in every city he passed through until he reached Caesarea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “appeared at Azotus.” The wording may suggest that God suddenly moved Philip there, but it does not say so directly.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: as he passed through, he was proclaiming
  simplified_phrase: As he traveled on, he told
  preserved_meaning: Philip continued traveling and repeatedly shared the good news.
  reasoning_layer_used: Lexical decisions for διερχόμενος and εὐηγγελίζετο
  rationale: The simpler verbs preserve both his movement and his ongoing proclamation.
- pob_phrase: to all the cities
  simplified_phrase: in every city he passed through
  preserved_meaning: Philip shared the good news throughout the cities on his route.
  reasoning_layer_used: Lexical decision for τὰς πόλεις πάσας
  rationale: The new wording makes the route-based distributive sense immediately clear.
- pob_phrase: until he came to Caesarea
  simplified_phrase: until he reached Caesarea
  preserved_meaning: Caesarea was the endpoint of the journey described here.
  reasoning_layer_used: Lexical decisions for ἕως τοῦ ἐλθεῖν αὐτὸν and εἰς Καισάρειαν
  rationale: “Reached” states the destination naturally without changing the endpoint.
translation_notes:
  risk_flags:
  - risk: “Was found” may sound unusual or leave the manner of Philip’s arrival unclear.
    mitigation: The wording preserves the Greek ambiguity, while the footnote gives the possible extraordinary sense without asserting it.
