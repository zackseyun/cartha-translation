  text: When they entered Jerusalem, they went upstairs to the room where they were staying. Those staying there were Peter, John, James, and Andrew; Philip and Thomas; Bartholomew and Matthew; James son of Alphaeus; Simon the Zealot; and Judas son of James.[a]
