translation:
  language: en
  text: While Jesus was staying with them[a], he ordered them, “Do not leave Jerusalem. Instead, wait for the promise of the Father, which you heard from me.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “meeting with them”; some understand this as “eating with them.”
