simplification_decisions:
- pob_phrase: And while staying with them, he ordered them
  simplified_phrase: While Jesus was staying with them, he ordered them
  preserved_meaning: Jesus was with the apostles when he gave an authoritative command.
  reasoning_layer_used: POB lexical and theological decisions on συναλιζόμενος and παρήγγειλεν
  rationale: Naming Jesus makes the pronoun clear while retaining the debated participle’s general sense.
- pob_phrase: not to depart from Jerusalem
  simplified_phrase: Do not leave Jerusalem.
  preserved_meaning: The apostles were commanded to remain in Jerusalem.
  reasoning_layer_used: POB lexical decision on μὴ χωρίζεσθαι
  rationale: Direct speech and “leave” express the command in ordinary English.
- pob_phrase: but to wait for the promise of the Father
  simplified_phrase: Instead, wait for the promise of the Father
  preserved_meaning: They were to remain expectantly until the Father’s promise was fulfilled.
  reasoning_layer_used: POB lexical decisions on περιμένειν and τὴν ἐπαγγελίαν τοῦ πατρὸς
  rationale: A separate sentence reduces clause density without explaining the promise beyond the source.
