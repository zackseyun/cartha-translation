translation:
  language: en
  text: They said, “Men of Galilee, why are you standing and looking into heaven? This Jesus[a] has been taken from you up into heaven. He will come back in the same way you saw him go into heaven.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally, “This same Jesus.” The Greek explicitly says “This Jesus.”
    reason: lexical_alternative
