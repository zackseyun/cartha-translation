simplification_decisions:
- pob_phrase: For John baptized with water
  simplified_phrase: For John baptized people with water
  preserved_meaning: John’s water baptism explains and contrasts with the promised baptism in the Holy Spirit.
  reasoning_layer_used: POB translation and lexical decisions for ὅτι, ἐβάπτισεν, and ὕδατι
  rationale: “For” keeps the link to Jesus’ preceding instruction, while “people” supplies the verb’s understood recipients.
- pob_phrase: in the Holy Spirit
  simplified_phrase: in the Holy Spirit
  preserved_meaning: The wording leaves open whether the Spirit is the sphere or means of baptism.
  reasoning_layer_used: POB theological decision for ἐν πνεύματι ἁγίῳ
  rationale: The phrase is retained because replacing it would resolve a documented theological ambiguity.
interpretive_expansions:
- pob_phrase: John baptized
  rendering: John baptized people
  claim: People are the understood recipients of John’s baptism.
  evidence:
  - John’s baptismal activity requires recipients even though the Greek leaves the object unstated here.
  confidence: high
translation_notes:
  risk_flags:
