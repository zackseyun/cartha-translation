translation:
  language: en
  text: Men, my brothers, the Scripture had to be fulfilled. The Holy Spirit had spoken it beforehand through David’s mouth about Judas, who became a guide for those who arrested Jesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Through David’s mouth” means that the Holy Spirit spoke through David as his human messenger.
    reason: cultural_note
simplification_decisions:
- pob_phrase: Men, brothers
  simplified_phrase: Men, my brothers
  preserved_meaning: The address explicitly identifies the hearers as men and as brothers.
  reasoning_layer_used: Lexical decision for Ἄνδρες ἀδελφοί
  rationale: Adding “my” makes the direct address natural in English without removing either noun.
- pob_phrase: it was necessary for the Scripture to be fulfilled
  simplified_phrase: the Scripture had to be fulfilled
  preserved_meaning: Scripture’s fulfillment was necessary, without explaining the cause of that necessity.
  reasoning_layer_used: Lexical and theological decisions for ἔδει and πληρωθῆναι
  rationale: “Had to be fulfilled” states the same necessity in more direct common English.
- pob_phrase: which the Holy Spirit spoke beforehand through the mouth of David concerning Judas
  simplified_phrase: The Holy Spirit had spoken it beforehand through David’s mouth about Judas
  preserved_meaning: The Holy Spirit is the speaker, David is the human instrument, and Judas is the subject.
  reasoning_layer_used: Lexical decisions and theological decision on agency in inspiration
  rationale: A new sentence and common “about” clarify the relationships while retaining the mouth image.
translation_notes:
  risk_flags:
  - risk: “Had to” could be read as defining how divine necessity operated.
    mitigation: The text gives no cause or mechanism, preserving the POB’s theological restraint.
  - risk: The image “through David’s mouth” may be unfamiliar to some readers.
    mitigation: The footnote explains the image without weakening divine and human agency in the main text.
