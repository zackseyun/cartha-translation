simplification_decisions:
- pob_phrase: the place of this ministry and apostleship
  simplified_phrase: Judas’s place in this ministry and in the office of apostle
  preserved_meaning: The chosen man would assume Judas’s vacant apostolic role and its entrusted service.
  reasoning_layer_used: Lexical decisions for τόπον, διακονίας, and ἀποστολῆς
  rationale: “Office of apostle” explains the uncommon term “apostleship” without reducing it to a general mission.
- pob_phrase: from which Judas turned aside
  simplified_phrase: Judas turned aside from this role
  preserved_meaning: Judas deviated from and abandoned his appointed ministry and apostleship.
  reasoning_layer_used: Lexical decision for παρέβη and ἀφ’ ἧς
  rationale: A new sentence and an explicit referent make the departure easier to follow.
- pob_phrase: to go to his own place
  simplified_phrase: went to his own place
  preserved_meaning: Judas went to an ominously described destination that the text does not define.
  reasoning_layer_used: Lexical and theological decisions for εἰς τὸν τόπον τὸν ἴδιον
  rationale: The simpler verb form retains the deliberate “place” contrast and the destination’s ambiguity.
