translation:
  language: en
  text: 'For it is written in the book of Psalms:


    “Let his home become deserted,

    and let no one live there.”


    It also says,


    “Let someone else take his office.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Office” can also mean “overseership,” but it does not necessarily refer to the later church office of bishop.
    reason: lexical_alternative
