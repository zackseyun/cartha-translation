  preserved_meaning: The person's residence is to be left uninhabited.
  reasoning_layer_used: Lexical decisions for ἔπαυλις and ἔρημος
  rationale: “Home” and “deserted” express the habitation image in familiar English.
- pob_phrase: let there be no one dwelling in it
  simplified_phrase: let no one live there
  preserved_meaning: The second jussive wish directly calls for the place to have no inhabitant.
  reasoning_layer_used: Lexical decision for μὴ ἔστω ὁ κατοικῶν ἐν αὐτῇ
  rationale: The coordinated “and let” preserves the distinct imperative in natural English.
- pob_phrase: and, ‘Let another take his office.’
