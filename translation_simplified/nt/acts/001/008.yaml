translation:
  language: en
  text: But when the Holy Spirit comes upon you, you will receive power. You will be my witnesses in Jerusalem, throughout Judea, in Samaria, and to the farthest parts of the earth.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: But you will receive power when the Holy Spirit has come upon you
  simplified_phrase: But when the Holy Spirit comes upon you, you will receive power.
  preserved_meaning: The disciples will receive power when the Holy Spirit comes upon them.
  reasoning_layer_used: POB lexical decisions for λήμψεσθε, δύναμιν, and ἐπελθόντος ... ἐφ’ ὑμᾶς
  rationale: The reordered clause and sentence break present the event and result clearly.
- pob_phrase: in all Judea and Samaria
  simplified_phrase: throughout Judea, in Samaria
  preserved_meaning: The witness extends across all Judea and also into Samaria without applying Judea’s explicit full scope to Samaria.
  reasoning_layer_used: POB lexical decisions for ἐν πάσῃ τῇ Ἰουδαίᾳ and καὶ Σαμαρείᾳ
  rationale: Separate wording keeps the Greek scope of “all” limited to Judea.
- pob_phrase: to the end of the earth
  simplified_phrase: to the farthest parts of the earth
  preserved_meaning: Their witness will reach the earth’s remotest extent.
  reasoning_layer_used: POB lexical decision for ἕως ἐσχάτου τῆς γῆς
  rationale: The idiomatic meaning is made direct while preserving the global horizon.
translation_notes:
  risk_flags:
  - risk: “Power” could be understood as merely political or physical power.
    mitigation: Its direct connection to the Holy Spirit preserves the sense of divine enablement.
