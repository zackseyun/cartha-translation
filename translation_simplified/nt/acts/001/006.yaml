translation:
  language: en
  text: When they were together, they asked him, “Lord, is now the time for you to restore the kingdom to Israel?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “for Israel.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: So when they had come together
  simplified_phrase: When they were together
  preserved_meaning: The disciples were gathered when they asked the question.
  reasoning_layer_used: Lexical decision for Οἱ μὲν οὖν συνελθόντες
  rationale: This recasts the temporal participle in ordinary English without laboring the discourse connector.
- pob_phrase: they asked him, saying
  simplified_phrase: they asked him
  preserved_meaning: They directly addressed Jesus with the question that follows.
  reasoning_layer_used: Lexical decisions for ἠρώτων αὐτὸν and λέγοντες
  rationale: English quotation marks make the extra word “saying” unnecessary.
- pob_phrase: is it at this time that you are restoring
  simplified_phrase: is now the time for you to restore
  preserved_meaning: They ask whether the present period is the appointed time for restoration.
  reasoning_layer_used: Lexical decisions for ἐν τῷ χρόνῳ τούτῳ and ἀποκαθιστάνεις
  rationale: The new question form is easier to follow while retaining both present timing and restoration.
translation_notes:
  risk_flags:
  - risk: “Is now the time” may sound slightly more prospective than the Greek present tense.
    mitigation: The wording still asks whether restoration is occurring in the present period and does not specify how it will happen.
  - risk: Readers may take the kingdom as exclusively political or exclusively spiritual.
    mitigation: The text retains the unqualified phrase “the kingdom to Israel” and does not resolve the disciples’ expectation.
