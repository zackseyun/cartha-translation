  preserved_meaning: The words refer back to what Jesus had just said.
  reasoning_layer_used: Lexical decision for ταῦτα
  rationale: The documented alternative “this” is more natural in common English.
- pob_phrase: as they were watching, he was lifted up
  simplified_phrase: he was lifted up as they watched
  preserved_meaning: They witnessed his visible upward movement.
  reasoning_layer_used: Lexical decisions for βλεπόντων αὐτῶν and ἐπήρθη
  rationale: The reordered clause is easier to read while retaining both the witnesses and the upward movement.
- pob_phrase: and a cloud took him out of their sight
  simplified_phrase: Then a cloud took him from their sight
  preserved_meaning: The cloud removed him from their visible view.
  reasoning_layer_used: Lexical decisions for ὑπέλαβεν and ἀπὸ τῶν ὀφθαλμῶν αὐτῶν
  rationale: “Then” begins a short new sentence and clarifies the narrative sequence without explaining the cloud symbolically.
