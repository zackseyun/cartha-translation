- pob_phrase: to defile the temple
  simplified_phrase: to make the temple ritually unclean
  preserved_meaning: Paul was accused of violating the temple's sacred purity.
  reasoning_layer_used: The lexical rationale defines the verb as profaning or making ritually unclean.
  rationale: This wording clearly distinguishes ritual impurity from ordinary dirt.
- pob_phrase: and we seized him
  simplified_phrase: and we seized him
  preserved_meaning: The accusers claim they took forceful hold of Paul.
  reasoning_layer_used: The lexical rationale preserves the physical and hostile force of “seized.”
  rationale: Keeping “and” avoids adding a causal link not stated in the source.
