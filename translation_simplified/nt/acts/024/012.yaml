  rationale: The recast removes the difficult repeated negatives while preserving their full scope.
- pob_phrase: throughout the city
  simplified_phrase: anywhere else in the city
  preserved_meaning: The denial extends to every other place in the city.
  reasoning_layer_used: lexical decision for κατὰ τὴν πόλιν
