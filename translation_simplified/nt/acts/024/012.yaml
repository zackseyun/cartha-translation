translation:
  language: en
  text: They did not find me arguing with anyone[a] or stirring up a crowd[b]—not in the temple, in the synagogues, or anywhere else in the city.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also mean “disputing” or “discussing,” but the context suggests a contentious public argument.
    reason: lexical_alternative
  - marker: b
    text: This may also mean “causing a crowd to gather”; it suggests a public disturbance, but not necessarily a riot.
    reason: lexical_alternative
