translation:
  language: en
  text: After two years had passed, Porcius Festus took Felix’s place. Felix wanted to build up favor with the Jews,[a] so he left Paul bound.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek expression can also mean “to do the Jews a favor” or “to gain their goodwill.”
    reason: lexical_alternative
