translation:
  language: en
  text: He ordered the centurion to keep Paul in custody but allow him some freedom. The centurion was not to stop any of Paul’s own people[a] from helping with his needs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This means people associated with Paul, such as his companions or supporters, not necessarily his relatives.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: yet to let him have some freedom
  simplified_phrase: but allow him some freedom
  preserved_meaning: Paul remained guarded but received limited freedom rather than full release.
  reasoning_layer_used: Lexical decision for ἔχειν ἄνεσιν and connective decision for τε ... καὶ.
  rationale: The contrastive wording makes the combination of custody and leniency immediately clear.
- pob_phrase: to prevent none of his own people
  simplified_phrase: was not to stop any of Paul’s own people
  preserved_meaning: No one associated with Paul was to be hindered from assisting him.
  reasoning_layer_used: Lexical decisions for μηδένα κωλύειν and τῶν ἰδίων αὐτοῦ.
  rationale: The positive-sounding double negative is recast in ordinary English without weakening its universal force.
- pob_phrase: from attending to his needs
  simplified_phrase: from helping with his needs
  preserved_meaning: Paul’s associates could provide practical assistance while he was in custody.
  reasoning_layer_used: Lexical decision for ὑπηρετεῖν αὐτῷ.
  rationale: “Helping” is more direct than “attending to” while retaining the practical-service sense.
