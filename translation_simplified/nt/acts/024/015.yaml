translation:
  language: en
  text: I place my hope in God, and these men themselves share that hope:[a] both the righteous and the unrighteous will rise from the dead.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also mean that they themselves await this resurrection.
