simplification_decisions:
- pob_phrase: having hope in God
  simplified_phrase: I place my hope in God
  preserved_meaning: Paul’s hope is directed toward God.
  reasoning_layer_used: lexical decision for ἐλπίδα ἔχων and εἰς τὸν θεόν
  rationale: A direct finite clause reads naturally while keeping God as the object of Paul’s hope.
- pob_phrase: which these men themselves also accept
  simplified_phrase: and these men themselves share that hope
  preserved_meaning: Paul says his opponents hold the same expectation.
  reasoning_layer_used: lexical decision for καὶ αὐτοὶ οὗτοι and προσδέχονται
  rationale: “Share that hope” clearly expresses their common belief while retaining the emphasis on the men themselves.
- pob_phrase: there is going to be a resurrection of both the righteous and the unrighteous
  simplified_phrase: both the righteous and the unrighteous will rise from the dead
  preserved_meaning: People in both moral groups will be raised, without specifying timing or judgment order.
  reasoning_layer_used: lexical and theological decisions for ἀνάστασιν and δικαίων τε καὶ ἀδίκων
  rationale: The active wording explains resurrection plainly while preserving both groups and the future event.
interpretive_expansions:
- pob_phrase: resurrection
  rendering: will rise from the dead
  claim: The resurrection is a rising from death, not merely survival or renewal.
  evidence:
