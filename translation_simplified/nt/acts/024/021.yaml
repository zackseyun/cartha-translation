simplification_decisions:
- pob_phrase: this one statement that I shouted
  simplified_phrase: the one thing I shouted
  preserved_meaning: Paul points to one specific public declaration.
  reasoning_layer_used: Lexical decisions for φωνῆς, ἐκέκραξα, and μιᾶς ταύτης
  rationale: The wording keeps both the singular focus and the force of speaking loudly.
- pob_phrase: while standing among them
  simplified_phrase: while I stood among them
  preserved_meaning: Paul describes where he was when he spoke.
  reasoning_layer_used: Lexical decision for ἐν αὐτοῖς ἑστὼς
  rationale: A finite clause is easier to read than the participial construction.
- pob_phrase: I am being judged before you today
  simplified_phrase: I am on trial before you today
  preserved_meaning: Paul is presently undergoing judicial examination in their presence.
  reasoning_layer_used: Lexical decisions for κρίνομαι and ἐφ’ ὑμῶν
  rationale: “On trial” clearly conveys the courtroom setting while “before you” avoids naming them as the sole judges.
