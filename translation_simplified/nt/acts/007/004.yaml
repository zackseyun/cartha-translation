translation:
  language: en
  text: Then he left the land of the Chaldeans and settled in Haran. After his father died, God brought him from there to this land where you now live.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek can also be translated “he brought him”; it does not name the subject here, but the context indicates God.
    reason: lexical_alternative
  - marker: b
    text: Stephen places this move after Abraham’s father died; compare Genesis 11:32 and 12:4.
    reason: cross_reference
simplification_decisions:
- pob_phrase: after he had gone out from the land of the Chaldeans
  simplified_phrase: he left the land of the Chaldeans
  preserved_meaning: Abraham departed from the Chaldeans’ land before settling in Haran.
  reasoning_layer_used: Lexical decision for ἐξελθὼν and its sequence before κατῴκησεν.
  rationale: A direct finite verb states the same sequence more naturally.
- pob_phrase: And from there, after his father died, God moved him into this land
  simplified_phrase: After his father died, God brought him from there to this land
  preserved_meaning: God caused Abraham to relocate from Haran to the land Stephen’s hearers occupied.
  reasoning_layer_used: Lexical decision for μετῴκισεν and theological decision to supply God as subject.
  rationale: “Brought him from there” makes the movement and its starting point immediately clear.
- pob_phrase: in which you now live
  simplified_phrase: where you now live
  preserved_meaning: Stephen identifies the destination as the land occupied by his present hearers.
  reasoning_layer_used: Lexical decision for εἰς ἣν ὑμεῖς νῦν κατοικεῖτε.
  rationale: “Where” is clearer common English than “in which.”
translation_notes:
  risk_flags:
