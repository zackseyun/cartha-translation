    mitigation: The context supports the POB choice, and footnote a preserves the grammatical ambiguity.
  - risk: The stated sequence creates an apparent chronological tension with Genesis.
    mitigation: The wording remains unchanged in meaning, and footnote b identifies the relevant passages.
