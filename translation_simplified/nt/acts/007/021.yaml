translation:
  language: en
  text: But after he was left outside, Pharaoh’s daughter picked him up and raised him as her own son.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: when he had been exposed
  simplified_phrase: after he was left outside
  preserved_meaning: The infant had been set out and left vulnerable, without asserting that he was deliberately abandoned.
  reasoning_layer_used: POB lexical decision for ἐκτεθέντος
  rationale: “Left outside” makes the historical sense of infant exposure immediately understandable.
- pob_phrase: took him up
  simplified_phrase: picked him up
  preserved_meaning: Pharaoh’s daughter physically took up the exposed child before raising him.
  reasoning_layer_used: POB lexical decision for ἀνείλατο
  rationale: “Picked him up” is the POB’s clear lexical alternative and keeps this action distinct from adoption.
translation_notes:
  risk_flags:
  - risk: “Left outside” may sound less technical than the historical term “exposed.”
    mitigation: The wording preserves the concrete act and vulnerability without adding a motive such as abandonment.
