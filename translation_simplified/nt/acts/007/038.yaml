- pob_phrase: This is the one who was in the assembly in the wilderness
  simplified_phrase: This Moses was among the people of Israel gathered in the wilderness
  preserved_meaning: Moses was present with Israel’s gathered people in the wilderness.
  reasoning_layer_used: Lexical and theological decisions on ἐκκλησία and ὁ γενόμενος
  rationale: This wording identifies Moses directly and avoids suggesting the later institutional church.
- pob_phrase: with the angel who was speaking to him on Mount Sinai, and with our fathers
  simplified_phrase: He was there with our fathers and with the angel who was speaking to him on Mount Sinai
  preserved_meaning: Moses was with Israel’s forefathers and the speaking angel at Sinai.
  reasoning_layer_used: Lexical decisions on ἀγγέλου, λαλοῦντος, and πατέρων ἡμῶν
  rationale: A separate sentence makes the relationships easier to follow while retaining the ongoing speech.
- pob_phrase: to give to us
  simplified_phrase: to pass on to us
  preserved_meaning: Moses received the revelation so that Israel would receive it through him.
  reasoning_layer_used: Lexical decisions on δοῦναι and ἡμῖν
  rationale: “Pass on” clearly shows Moses delivering what he had received.
