translation:
  language: en
  text: This Moses was among the people of Israel gathered in the wilderness. He was there with our fathers[a] and with the angel who was speaking to him on Mount Sinai. Moses received living oracles—messages from God—to pass on to us.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Our fathers” means Israel’s forefathers.
    reason: lexical_alternative
  - marker: b
    text: Or “living words” or “life-giving oracles.”
    reason: lexical_alternative
