translation:
  language: en
  text: This was the same Moses they had rejected when they said, “Who appointed you to be ruler and judge?” Yet God sent this same man to be both ruler and redeemer,[a] through the angel who appeared to him in the bush.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “deliverer.” Here “redeemer” means one who brings release or freedom.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: This Moses, whom they rejected, saying
  simplified_phrase: This was the same Moses they had rejected when they said
  preserved_meaning: The man they rejected was the very Moses whom God later commissioned.
  reasoning_layer_used: Lexical decision for Τοῦτον ... τοῦτον
  rationale: “The same Moses” preserves the emphatic identification in natural English.
- pob_phrase: this man God sent as both ruler and redeemer
  simplified_phrase: Yet God sent this same man to be both ruler and redeemer
  preserved_meaning: God appointed the rejected Moses to the paired roles of ruler and redeemer.
  reasoning_layer_used: Lexical and theological decisions for ἄρχοντα and λυτρωτὴν
  rationale: The new clause highlights the reversal while retaining both distinct roles.
- pob_phrase: by the hand of the angel
  simplified_phrase: through the angel
  preserved_meaning: The angel served as the agent through whom God commissioned Moses.
  reasoning_layer_used: Lexical decision for σὺν χειρὶ
  rationale: “Through” states the idiom’s agency clearly for modern readers.
translation_notes:
  risk_flags:
  - risk: Replacing the hand idiom may reduce its concrete biblical imagery.
    mitigation: The wording still preserves the angel’s mediating agency.
  - risk: “Redeemer” may sound broader than Moses’ role to some readers.
    mitigation: The footnote defines its release sense and preserves “deliverer” as an alternative.
