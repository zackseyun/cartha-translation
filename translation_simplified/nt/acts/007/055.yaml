translation:
  language: en
  text: But he was full of the Holy Spirit. He looked intently into heaven and saw God’s glory, and he saw Jesus standing at God’s right hand.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: God’s “right hand” is a biblical image for the place of highest honor and authority.
    reason: cross_reference
simplification_decisions:
- pob_phrase: But being full of the Holy Spirit
  simplified_phrase: But he was full of the Holy Spirit.
  preserved_meaning: Stephen was already in an ongoing state of being filled with the divine Holy Spirit.
  reasoning_layer_used: Lexical and theological decisions for ὑπάρχων and πλήρης πνεύματος ἁγίου.
  rationale: A complete sentence replaces the awkward opening participle while preserving Stephen’s state.
- pob_phrase: he gazed into heaven
  simplified_phrase: He looked intently into heaven
  preserved_meaning: Stephen directed a focused, intense look into the supernatural realm of heaven.
  reasoning_layer_used: Lexical decisions for ἀτενίσας and εἰς τὸν οὐρανόν.
  rationale: The common phrase “looked intently” makes the force of “gazed” immediately clear.
- pob_phrase: the glory of God, and Jesus standing at the right hand of God
  simplified_phrase: God’s glory, and he saw Jesus standing at God’s right hand
  preserved_meaning: Stephen saw God’s manifested majesty and the exalted Jesus in a standing posture.
  reasoning_layer_used: Lexical and theological decisions for δόξαν θεοῦ, ἑστῶτα, and ἐκ δεξιῶν τοῦ θεοῦ.
  rationale: The repeated verb clarifies the two objects of Stephen’s vision while retaining the right-hand image.
translation_notes:
  risk_flags:
  - risk: Modern readers may take “God’s right hand” only as a physical location.
    mitigation: The footnote explains its biblical meaning of highest honor and authority.
