simplification_decisions:
- pob_phrase: when Jacob heard that there was grain in Egypt
  simplified_phrase: Jacob heard that Egypt had grain
  preserved_meaning: Jacob received news that grain was in Egypt.
  reasoning_layer_used: Lexical decision for ἀκούσας and σιτία
  rationale: The shorter clause keeps both the report and the contextually likely sense “grain.”
- pob_phrase: sent out our fathers the first time
  simplified_phrase: sent our fathers there for the first time
  preserved_meaning: Jacob sent Israel’s male forefathers to Egypt on the first of multiple visits.
  reasoning_layer_used: Lexical and theological decisions for ἐξαπέστειλεν, τοὺς πατέρας ἡμῶν, and πρῶτον
  rationale: “There” makes the journey clear while “our fathers” and the first-visit sequence remain intact.
interpretive_expansions:
