  text: God gave Abraham no land there as an inheritance—not even enough ground to set one foot on. Yet God promised to give the land to Abraham as his possession and to his offspring after him, even though Abraham had no child.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “when Abraham had no child.” The context favors “even though.”
    reason: alternative_reading
