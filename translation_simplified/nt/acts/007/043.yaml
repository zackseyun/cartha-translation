translation:
  language: en
  text: You carried Moloch’s tent and the star of the god Rephan[a]—the images you made so you could worship them. So I will send you into exile beyond Babylon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some translations read “your god Rephan,” following the Hebrew wording of Amos 5:26; Acts reads “the god Rephan.”
    reason: alternative_reading
  - marker: b
    text: Acts reads “beyond Babylon,” while Amos 5:27 is commonly translated “beyond Damascus.”
    reason: cross_reference
simplification_decisions:
- pob_phrase: you took up the tent of Moloch
  simplified_phrase: you carried Moloch’s tent
  preserved_meaning: The people bore an idolatrous portable tent associated with Moloch.
  reasoning_layer_used: Lexical decision for ἀνελάβετε and σκηνή
  rationale: “Carried” makes the action clear while “tent” avoids confusion with God’s tabernacle.
- pob_phrase: the images that you made to worship them
  simplified_phrase: the images you made so you could worship them
  preserved_meaning: They made the idolatrous representations for worship.
  reasoning_layer_used: Lexical decisions for τύπους, ἐποιήσατε, and προσκυνεῖν αὐτοῖς
  rationale: The purpose clause is recast in ordinary English without weakening the accusation.
- pob_phrase: I will deport you beyond Babylon
  simplified_phrase: I will send you into exile beyond Babylon
  preserved_meaning: God announces forced removal to a place beyond Babylon.
  reasoning_layer_used: Lexical decision for μετοικιῶ and theological decision on Babylon
  rationale: “Send you into exile” explains deportation while retaining Acts’ destination.
translation_notes:
  risk_flags:
  - risk: “Star” may be understood as the celestial body rather than an idolatrous representation.
    mitigation: The following phrase identifies the tent and star as worshiped images without replacing the source’s concrete word.
  - risk: Readers may expect “Damascus” from Amos 5:27.
    mitigation: The main text preserves Acts’ “Babylon,” and the footnote records the difference.
