translation:
  language: en
  text: “I am the God of your fathers,[a] the God of Abraham and Isaac and Jacob.” Moses was terrified. He did not dare to look closely.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “fathers” means Moses’s forefathers or ancestors.
    reason: simplification_note
  - marker: b
    text: The Greek can also mean “examine” or “consider carefully.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Then Moses became terrified and did not dare to look closely.
  simplified_phrase: Moses was terrified. He did not dare to look closely.
  preserved_meaning: Moses responded with intense fear and would not look carefully at the sight.
  reasoning_layer_used: Applied revision and lexical decisions for ἔντρομος, οὐκ ἐτόλμα, and κατανοῆσαι.
  rationale: Two short sentences make Moses’s response easier to follow without weakening his fear or reluctance.
- pob_phrase: your fathers
  simplified_phrase: your fathers, with a clarifying footnote
  preserved_meaning: God identifies himself as the God of Moses’s covenant forefathers.
  reasoning_layer_used: Lexical and theological decisions for τῶν πατέρων σου.
  rationale: The main text keeps the covenantal wording while the note prevents modern readers from taking it as only Moses’s parents.
translation_notes:
  risk_flags:
  - risk: Modern readers may misunderstand “fathers” as Moses’s immediate male parents.
    mitigation: A brief footnote explains that the word refers to his forefathers or ancestors.
