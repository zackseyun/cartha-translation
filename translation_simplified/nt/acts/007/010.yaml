translation:
  language: en
  text: God rescued Joseph from all his troubles. He gave Joseph favor with Pharaoh, the king of Egypt, and wisdom. Then he appointed Joseph to rule over Egypt and Pharaoh’s entire household.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: rescued him from all his afflictions
  simplified_phrase: rescued Joseph from all his troubles
  preserved_meaning: Joseph was rescued from all the hardships and suffering he endured.
  reasoning_layer_used: POB lexical decisions for ἐξείλατο and θλίψεων
  rationale: “Troubles” gives the broad narrative sense in common English while “rescued” retains active deliverance.
- pob_phrase: gave him favor and wisdom before Pharaoh king of Egypt
  simplified_phrase: gave Joseph favor with Pharaoh, the king of Egypt, and wisdom
  preserved_meaning: God gave Joseph both Pharaoh’s favorable regard and practical wisdom.
  reasoning_layer_used: POB lexical decisions for χάριν, σοφίαν, and ἐναντίον
  rationale: The wording explains the relational sense of “favor” while keeping favor and wisdom together as gifts.
- pob_phrase: appointed him ruler over Egypt and over all his household
  simplified_phrase: appointed Joseph to rule over Egypt and Pharaoh’s entire household
  preserved_meaning: Joseph was formally placed in authority over Egypt and Pharaoh’s household and estate.
  reasoning_layer_used: POB lexical decisions for κατέστησεν, ἡγούμενον, and ὅλον τὸν οἶκον αὐτοῦ
  rationale: The verbal form is easier to read, and naming Pharaoh removes the household pronoun’s ambiguity.
interpretive_expansions:
- pob_phrase: and rescued him ... and gave him ... and appointed him
  rendering: God rescued Joseph ... He gave Joseph ... he appointed Joseph
  claim: The unnamed acting subject is God, and the man receiving these actions is Joseph.
  evidence:
  - Acts 7:9 identifies Joseph and says that God was with him.
  - The POB theological decision identifies God as the implied subject continuing from the prior context.
  confidence: high
  alternatives_preserved:
  - Retain the coordinated pronouns when read with Acts 7:9.
translation_notes:
  risk_flags:
  - risk: Naming God and Joseph makes referents explicit that the Greek leaves implicit.
    mitigation: The immediate context and POB theological reasoning clearly establish both referents.
  - risk: “Favor with Pharaoh” may sound less formal than “favor before Pharaoh.”
    mitigation: It preserves the POB footnote’s sense of Pharaoh’s favorable regard without separating favor from wisdom.
