  text: When Moses saw it,[a] he was amazed. As he came closer to look carefully, a voice from the Lord came to him:[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the vision.” Here the word refers to the visible sight of the burning bush.
