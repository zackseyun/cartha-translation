  rationale: “Was amazed” expresses the same reaction in familiar English without repeating “saw” and “sight.”
- pob_phrase: as he came near to look closely
  simplified_phrase: as he came closer to look carefully
  preserved_meaning: Moses moved toward the bush to examine it attentively.
  reasoning_layer_used: Lexical decisions for προσερχομένου and κατανοῆσαι.
  rationale: The wording clearly preserves both his movement and careful attention.
- pob_phrase: a voice of the Lord came
  simplified_phrase: a voice from the Lord came to him
  preserved_meaning: The Lord’s voice came directly to Moses.
  reasoning_layer_used: Lexical and theological decisions for ἐγένετο φωνὴ κυρίου, with the grounding review’s restoration of the recipient.
