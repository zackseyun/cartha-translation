translation:
  language: en
  text: They said to Aaron, “Make gods[a] for us that will go ahead of us, because we do not know what has happened to this Moses who led us out of the land of Egypt.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “idols.” The Greek literally says “gods,” preserving the people’s own claim.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: saying to Aaron
  simplified_phrase: They said to Aaron
  preserved_meaning: The people address Aaron and make the request that follows.
  reasoning_layer_used: The lexical decision identifies the participle as introducing the people’s speech.
  rationale: A complete clause is easier for a modern reader than a dependent participle.
- pob_phrase: who will go before us
  simplified_phrase: that will go ahead of us
  preserved_meaning: The requested gods are to precede the people.
  reasoning_layer_used: The lexical decision defines the verb as going before or preceding.
  rationale: “Go ahead of us” is natural English without adding the stronger idea of leading.
- pob_phrase: for this Moses ... we do not know what has happened to him
  simplified_phrase: because we do not know what has happened to this Moses
  preserved_meaning: Their uncertainty about Moses is the reason for their request.
  reasoning_layer_used: The lexical decision states that γάρ introduces the reason for the request.
  rationale: Reordering the clause makes the cause-and-effect relationship immediately clear.
translation_notes:
  risk_flags:
  - risk: Reordering the sentence may make the causal relationship more explicit in English than the POB word order does.
    mitigation: The POB lexical reasoning explicitly identifies the clause as the reason for the request.
  - risk: Modern readers may understand “gods” as endorsing the people’s claim.
    mitigation: The footnote identifies “idols” as the referential alternative while retaining the source-driven wording.
