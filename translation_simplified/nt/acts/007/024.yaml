- pob_phrase: someone being wronged
  simplified_phrase: someone being mistreated
  preserved_meaning: The person was suffering unjust treatment.
  reasoning_layer_used: Lexical decision for ἀδικούμενον
  rationale: “Mistreated” expresses the injustice in familiar English.
- pob_phrase: he defended him
  simplified_phrase: he stepped in to defend him
  preserved_meaning: Moses intervened to protect the victim from his attacker.
  reasoning_layer_used: Lexical decision for ἠμύνατο
  rationale: “Stepped in” makes the act of intervention immediately clear.
- pob_phrase: And when he saw ... he defended him and brought justice
  simplified_phrase: When he saw ... he stepped in to defend him. He brought justice
  preserved_meaning: Seeing the abuse led Moses both to defend the victim and to act against the Egyptian.
  reasoning_layer_used: POB syntax and optimal-equivalence philosophy
  rationale: Two sentences clarify the sequence without merging the distinct actions.
translation_notes:
  risk_flags:
  - risk: “Brought justice” may sound like a formal legal proceeding.
    mitigation: The phrase “by striking down the Egyptian” shows that Moses acted directly, while footnote a preserves the avenging sense.
  - risk: “Striking down” may be read as explicitly meaning “killed.”
    mitigation: Footnote b distinguishes the verb’s basic meaning from its fatal outcome in context.
