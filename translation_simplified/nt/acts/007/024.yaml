translation:
  language: en
  text: When he saw someone being mistreated, he stepped in to defend him. He brought justice[a] for the oppressed man by striking down the Egyptian.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “avenged the oppressed man.” The Greek expression can refer to justice, vindication, or vengeance.
    reason: lexical_alternative
  - marker: b
    text: Or “by striking the Egyptian.” The wording itself means “strike,” though the context indicates that the blow was fatal.
    reason: lexical_alternative
