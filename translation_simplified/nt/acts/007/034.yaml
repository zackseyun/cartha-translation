translation:
  language: en
  text: I have certainly seen how my people are being mistreated in Egypt. I have heard their groaning, and I have come down to rescue them. Now come. I will send you to Egypt.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: I have surely seen the mistreatment of my people in Egypt
  simplified_phrase: I have certainly seen how my people are being mistreated in Egypt
  preserved_meaning: God emphatically declares that he has seen the harsh treatment of his people.
  reasoning_layer_used: Lexical decisions for ἰδὼν εἶδον and κάκωσιν
  rationale: The active clause is easier to understand while retaining the emphatic certainty and wrongful treatment.
- pob_phrase: I have come down to deliver them
  simplified_phrase: I have come down to rescue them
  preserved_meaning: God describes his intervention with the image of descending to save his people.
  reasoning_layer_used: Lexical decision for ἐξελέσθαι and theological decision on divine descent
  rationale: “Rescue” is clearer modern English, while “come down” preserves the source-language image.
- pob_phrase: And now come, I will send you to Egypt
  simplified_phrase: Now come. I will send you to Egypt.
  preserved_meaning: God calls Moses forward and commissions him to go to Egypt.
  reasoning_layer_used: Lexical decisions for δεῦρο and ἀποστείλω
  rationale: Two short sentences make the command and commission immediately clear without merging them.
translation_notes:
