translation:
  language: en
  text: Was there any prophet your fathers[a] did not persecute? They killed those who foretold the coming of the Righteous One. And now you have become his betrayers and murderers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “fathers” means their ancestors.
    reason: simplification_note
simplification_decisions:
- pob_phrase: Which of the prophets did your fathers not persecute?
  simplified_phrase: Was there any prophet your fathers did not persecute?
  preserved_meaning: The rhetorical question still implies that their fathers persecuted every prophet.
  reasoning_layer_used: POB lexical decision for τίνα τῶν προφητῶν and οἱ πατέρες ὑμῶν
  rationale: The recast question is easier to follow while retaining the accusation and the chosen term “fathers.”
- pob_phrase: those who announced beforehand
  simplified_phrase: those who foretold
  preserved_meaning: The prophets proclaimed the Righteous One’s coming before it happened.
  reasoning_layer_used: POB lexical decision for τοὺς προκαταγγείλαντας
  rationale: “Foretold” expresses prior proclamation in concise, familiar English.
- pob_phrase: of whom you have now become betrayers and murderers
  simplified_phrase: And now you have become his betrayers and murderers
  preserved_meaning: Stephen directly accuses his hearers of betraying and murdering the Righteous One.
  reasoning_layer_used: POB lexical decisions for οὗ, νῦν, προδόται, φονεῖς, and ἐγένεσθε
  rationale: A new sentence and the pronoun “his” make the connection clear without weakening the charge.
translation_notes:
  risk_flags:
  - risk: Modern readers may understand “fathers” as immediate parents.
    mitigation: A brief footnote identifies them as ancestors while preserving POB’s chosen wording.
