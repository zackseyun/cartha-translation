translation:
  language: en
  text: But God said that his offspring[a] would live as foreigners in a land that was not their own. They would be enslaved and mistreated there for four hundred years.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek speaks of “offspring” as one collective whole.
    reason: source_note
simplification_decisions:
- pob_phrase: 'spoke in this way: that'
  simplified_phrase: said that
  preserved_meaning: God introduced the content of what he had spoken.
  reasoning_layer_used: Lexical decisions for ἐλάλησεν δὲ οὕτως and ὅτι
  rationale: The shorter wording gives the same introduction in ordinary English.
- pob_phrase: would be a foreign resident in a strange land
  simplified_phrase: would live as foreigners in a land that was not their own
  preserved_meaning: Abraham’s offspring would reside as outsiders outside their own land.
  reasoning_layer_used: Lexical decisions for πάροικον and ἐν γῇ ἀλλοτρίᾳ
  rationale: The plural wording is natural English and does not add the organized sense of “community.”
- pob_phrase: they would enslave it and mistreat it
  simplified_phrase: They would be enslaved and mistreated there
  preserved_meaning: Abraham’s collective offspring would suffer both slavery and ill-treatment in that land.
  reasoning_layer_used: Theological decision on the collective singular and lexical decisions for δουλόω and κακόω
  rationale: The passive wording avoids the confusing pronoun “it” while preserving both harms.
interpretive_expansions:
- pob_phrase: in a strange land
  rendering: in a land that was not their own
  claim: The land was foreign because it did not belong to Abraham’s offspring.
  evidence:
