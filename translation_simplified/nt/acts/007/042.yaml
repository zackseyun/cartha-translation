translation:
  language: en
  text: 'But God turned away and gave them over to serve[a] the army of heaven—that is, the heavenly bodies. This happened just as it is written in the book of the prophets: “People of Israel, was it really to me that you offered slaughtered animals and sacrifices for forty years in the wilderness?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “worship.” The Greek verb refers here to religious service.
    reason: lexical_alternative
  - marker: b
    text: This quotation is from Amos 5:25.
    reason: cross_reference
