  simplified_phrase: our ancestors
  preserved_meaning: Stephen is speaking about Israel's forefathers.
  reasoning_layer_used: POB lexical alternatives
  rationale: “Ancestors” is immediately clear to modern readers and is an approved POB alternative.
- pob_phrase: were unwilling to become obedient to him
  simplified_phrase: refused to obey Moses
  preserved_meaning: They willfully rejected obedience to Moses.
  reasoning_layer_used: POB lexical rationale and prior-verse referent
  rationale: The active wording is clearer while retaining the force of deliberate unwillingness.
- pob_phrase: turned back in their hearts to Egypt
  simplified_phrase: in their hearts they turned back toward Egypt
  preserved_meaning: Their desires and allegiance turned inwardly toward Egypt rather than describing an actual return.
  reasoning_layer_used: POB theological decision
  rationale: The wording preserves the heart image while making Egypt the direction of their inward turning.
interpretive_expansions:
