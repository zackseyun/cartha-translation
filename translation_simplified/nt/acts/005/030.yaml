translation:
  language: en
  text: The God of our fathers raised up Jesus.[a] You killed him by hanging him on a tree.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “raised.” This may refer to Jesus’ resurrection, though the Greek does not explicitly say “from the dead” here.
    reason: lexical_alternative
  - marker: b
    text: Or “on a cross.” The Greek says “on a tree,” likely echoing Deuteronomy 21:23.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: whom you killed
  simplified_phrase: You killed him
  preserved_meaning: The hearers remain directly responsible for Jesus’ death.
  reasoning_layer_used: POB translation and lexical decision for διεχειρίσασθε
  rationale: A separate sentence removes the difficult relative clause without weakening the accusation.
- pob_phrase: by hanging on a tree
  simplified_phrase: by hanging him on a tree
  preserved_meaning: Hanging Jesus on the tree was the means by which they killed him.
  reasoning_layer_used: POB lexical decisions for κρεμάσαντες and ἐπὶ ξύλου
  rationale: Adding “him” makes the action clear while preserving the tree image and its biblical resonance.
translation_notes:
  risk_flags:
