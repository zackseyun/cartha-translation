    mitigation: Footnote a preserves the resurrection sense without making the Greek more explicit than it is.
  - risk: Modern readers may not recognize that “tree” refers to the cross.
    mitigation: Footnote b identifies the alternative while retaining the source image and likely Deuteronomic echo.
