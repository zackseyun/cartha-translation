  rationale: The ordinary expression “called in” makes the prior action clear without a formal participial phrase.
- pob_phrase: they beat them, ordered them not to speak in the name of Jesus, and released them
  simplified_phrase: beat them. Then they ordered them not to speak in the name of Jesus and released them
  preserved_meaning: The council beat, prohibited, and released the apostles in sequence.
  reasoning_layer_used: Source syntax and lexical decisions for δείραντες, παρήγγειλαν, and ἀπέλυσαν
  rationale: Two sentences make the sequence easier to follow while retaining each distinct action.
- pob_phrase: in the name of Jesus
  simplified_phrase: in the name of Jesus
  preserved_meaning: The command concerns witness connected with Jesus and his authority without narrowing the idiom to one sense.
