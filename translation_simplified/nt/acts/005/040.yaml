  language: en
  text: They called the apostles in and beat them. Then they ordered them not to speak in the name of Jesus[a] and released them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This can also mean “about Jesus” or “under Jesus’ authority.”
