translation:
  language: en
  text: But Peter said to her, “Tell me, is this how much you sold the land for?” She said, “Yes, that is how much.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Peter answered her
  simplified_phrase: Peter said to her
  preserved_meaning: Peter addressed her as the narrative turned to his questioning of her.
  reasoning_layer_used: The lexical rationale treats ἀποκρίνομαι as a narrative dialogue expression.
  rationale: “Said to her” is more natural here because Peter begins with a question rather than answering one.
- pob_phrase: did you sell the land for this much?
  simplified_phrase: is this how much you sold the land for?
  preserved_meaning: Peter asks whether the indicated amount was the land’s sale price.
  reasoning_layer_used: The lexical decisions identify εἰ as a yes-or-no question and τοσούτου as the amount just mentioned.
  rationale: The recast question makes the reference to the amount immediately clear.
- pob_phrase: Yes, for this much.
  simplified_phrase: Yes, that is how much.
  preserved_meaning: She confirms that the indicated amount was the sale price.
  reasoning_layer_used: The lexical rationale preserves the repeated τοσούτου consistently in her reply.
  rationale: The complete English reply is easier to understand than the elliptical wording.
translation_notes:
  risk_flags:
  - risk: Rendering “answered” as “said” may appear less formally tied to ἀπεκρίθη.
    mitigation: The wording preserves its contextual function as introducing Peter’s speech to her.
