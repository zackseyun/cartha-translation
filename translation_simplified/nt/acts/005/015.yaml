translation:
  language: en
  text: As a result, people even carried the sick out into the streets[a] and laid them on cots and mats. They did this so that, as Peter passed by, even his shadow might fall across some of them.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “into the public squares.” The Greek can refer to broad streets or open public areas.
    reason: lexical_alternative
  - marker: b
    text: This verse describes what the people hoped would happen; it does not say here that Peter’s shadow itself healed anyone.
    reason: cross_reference
simplification_decisions:
- pob_phrase: so that they even carried
  simplified_phrase: As a result, people even carried
  preserved_meaning: Their action resulted from the apostles’ growing influence in the preceding context.
  reasoning_layer_used: lexical decision for ὥστε
  rationale: “As a result” makes the connection clear without an awkward opening clause.
- pob_phrase: so that as Peter was coming by
  simplified_phrase: They did this so that, as Peter passed by
  preserved_meaning: The people positioned the sick with a particular hope as Peter moved near them.
  reasoning_layer_used: lexical and theological decisions for ἵνα and ἐρχομένου Πέτρου
  rationale: A new sentence clarifies the purpose while preserving the people’s intention.
- pob_phrase: his shadow might overshadow some of them
  simplified_phrase: his shadow might fall across some of them
  preserved_meaning: They hoped Peter’s literal shadow might pass over sick individuals.
  reasoning_layer_used: lexical decisions for σκιὰ, ἐπισκιάσῃ, and τινὶ αὐτῶν
  rationale: “Fall across” expresses the physical shadow image in common English.
translation_notes:
  risk_flags:
  - risk: “Fall across” does not preserve the verbal link between “overshadow” and other New Testament passages.
    mitigation: It preserves the literal shadow image, while the POB audit retains the lexical connection.
  - risk: Readers may infer that Peter’s shadow certainly healed people.
    mitigation: The modal “might” and footnote preserve the verse’s restraint.
