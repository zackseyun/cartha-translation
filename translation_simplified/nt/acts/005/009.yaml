translation:
  language: en
  text: But Peter said to her, “Why did you and your husband agree[a] to test the Spirit of the Lord? Look! The feet of those who buried your husband are at the door. They will carry you out too.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “conspire together.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Why did you agree together
  simplified_phrase: Why did you and your husband agree
  preserved_meaning: Peter accuses Sapphira and Ananias of making a mutual agreement.
  reasoning_layer_used: Lexical decision for συμφωνέω and immediate context
  rationale: Naming her husband makes the plural agreement clear without strengthening the verb to “conspire.”
- pob_phrase: Look, the feet of those who buried your husband are at the door, and they will carry you out.
  simplified_phrase: Look! The feet of those who buried your husband are at the door. They will carry you out too.
  preserved_meaning: The same people who buried Ananias have arrived and will carry Sapphira out.
  reasoning_layer_used: Lexical decisions for ἰδού, οἱ πόδες, and ἐξοίσουσίν σε
  rationale: Short sentences clarify the warning while preserving the vivid image of their feet at the door.
interpretive_expansions:
- pob_phrase: you
  rendering: you and your husband
  claim: The plural address refers to Sapphira and her husband, Ananias.
  evidence:
  - The verb describes a mutual agreement involving plural “you.”
  - The immediate context identifies Ananias as her husband and partner in the act.
  confidence: high
  alternatives_preserved:
  - you both
- pob_phrase: they will carry you out
  rendering: They will carry you out too
  claim: Sapphira will be carried out as her husband was.
  evidence:
  - The same people have just returned from burying her husband.
  - Peter directly parallels what happened to Ananias with what will happen to Sapphira.
  confidence: high
  alternatives_preserved:
  - they will carry you out
translation_notes:
  risk_flags:
  - risk: “You and your husband” makes the plural referent explicit rather than leaving it grammatical.
    mitigation: The immediate narrative and the POB rationale clearly identify their mutual agreement.
  - risk: “Too” states the burial parallel more directly than the Greek wording.
    mitigation: The preceding clause explicitly identifies those who buried her husband as the ones who will carry her out.
