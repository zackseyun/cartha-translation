translation:
  language: en
  text: Wasn’t the property yours before it was sold? And after it was sold, wasn’t the money still under your control? Why did you decide in your heart to do this? You have lied not to men,[a] but to God.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “men” means human beings generally, not males only.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: While it remained unsold, did it not remain yours?
  simplified_phrase: Wasn’t the property yours before it was sold?
  preserved_meaning: Ananias continued to own the property before the sale.
  reasoning_layer_used: Lexical decisions for μένον / ἔμενεν and σοὶ
  rationale: The simpler question removes awkward repetition while preserving continued possession.
- pob_phrase: after it was sold, was it not under your authority?
  simplified_phrase: after it was sold, wasn’t the money still under your control?
  preserved_meaning: Ananias retained the right to decide what to do with the sale proceeds.
  reasoning_layer_used: Lexical and theological decisions for ἐξουσία
  rationale: “The money” identifies the contextual referent, while “under your control” expresses rightful freedom plainly.
- pob_phrase: Why is it that you have set this matter in your heart?
  simplified_phrase: Why did you decide in your heart to do this?
  preserved_meaning: The act arose from Ananias’s inward resolve or intention.
  reasoning_layer_used: Lexical decision for ἔθου ἐν τῇ καρδίᾳ σου
  rationale: “Decide” clarifies the idiom while retaining the heart image.
