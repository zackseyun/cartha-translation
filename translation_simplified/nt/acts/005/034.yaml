translation:
  language: en
  text: But a Pharisee named Gamaliel stood up during the council meeting.[a] He was a teacher of the law, honored by all the people. He ordered the men to be taken outside for a short time.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This was the Jewish ruling council, also called the Sanhedrin.
    reason: cultural_note
simplification_decisions:
- pob_phrase: stood up in the council
  simplified_phrase: stood up during the council meeting
  preserved_meaning: Gamaliel publicly rose while the ruling council was assembled.
  reasoning_layer_used: POB lexical decision for συνεδρίῳ and cultural note
  rationale: “During the council meeting” makes the setting clear without requiring readers to know the Sanhedrin.
- pob_phrase: a teacher of the law honored by all the people
  simplified_phrase: He was a teacher of the law, honored by all the people.
  preserved_meaning: Gamaliel taught the law and was widely esteemed.
  reasoning_layer_used: POB lexical decisions for νομοδιδάσκαλος, τίμιος, and παντὶ τῷ λαῷ
  rationale: A separate sentence makes Gamaliel’s role and reputation easier to follow.
- pob_phrase: ordered the men to be put outside for a short time
  simplified_phrase: ordered the men to be taken outside for a short time
  preserved_meaning: He authoritatively directed that the male defendants be removed temporarily.
  reasoning_layer_used: POB lexical and theological decisions for ἐκέλευσεν, ἔξω ποιῆσαι, βραχύ, and τοὺς ἀνθρώπους
  rationale: “Taken outside” expresses the removal idiom in natural English while retaining its force and duration.
translation_notes:
  risk_flags:
  - risk: “Council” could sound like an ordinary local meeting.
    mitigation: The footnote identifies it as the Jewish ruling council, the Sanhedrin.
