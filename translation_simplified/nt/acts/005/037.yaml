translation:
  language: en
  text: Afterward, Judas the Galilean rose up during the census[a] and drew people away to follow him. He too died, and everyone he had won over was scattered.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “official registration.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: After this
  simplified_phrase: Afterward
  preserved_meaning: Judas appeared later than the person and events just mentioned.
  reasoning_layer_used: Lexical decision for μετὰ τοῦτον
  rationale: “Afterward” expresses the temporal sequence in ordinary English.
- pob_phrase: in the days of the census
  simplified_phrase: during the census
  preserved_meaning: Judas emerged at the time of the census or registration.
  reasoning_layer_used: Lexical decision for ἐν ταῖς ἡμέραις τῆς ἀπογραφῆς
  rationale: “During” replaces an older time expression without changing the event.
- pob_phrase: all who were persuaded by him
  simplified_phrase: everyone he had won over
  preserved_meaning: The people scattered were those whom Judas had persuaded.
  reasoning_layer_used: Lexical decision for πάντες ὅσοι ἐπείθοντο αὐτῷ
  rationale: “Won over” states the same persuasion more naturally and remains distinct from following him.
translation_notes:
  risk_flags:
  - risk: “Drew people away” may leave their former allegiance unstated.
    mitigation: This preserves the verb’s defection sense without adding an unsupported political label such as rebellion.
