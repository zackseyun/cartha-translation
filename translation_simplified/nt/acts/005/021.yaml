translation:
  language: en
  text: When they heard this, they went into the temple courts at daybreak and were teaching there. When the high priest and those with him arrived, they called together the Sanhedrin[a] and the whole council of the sons of Israel.[b] Then they sent to the prison for the apostles to be brought.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Sanhedrin was the Jewish ruling council.
    reason: cultural_note
  - marker: b
    text: This may also be expressed as “the whole council of Israel” or “the whole body of Israel’s elders.”
    reason: lexical_alternative
