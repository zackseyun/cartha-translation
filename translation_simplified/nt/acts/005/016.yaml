simplification_decisions:
- pob_phrase: the multitude from the towns around Jerusalem was coming together
  simplified_phrase: Large numbers of people also kept coming from the towns around Jerusalem
  preserved_meaning: Many people from nearby towns came repeatedly or over a period of time.
  reasoning_layer_used: Lexical decisions for τὸ πλῆθος, συνήρχετο, and τῶν πέριξ πόλεων Ἰερουσαλήμ
  rationale: Ordinary wording preserves the large number, location, and ongoing action.
- pob_phrase: bringing the sick and those troubled by unclean spirits
  simplified_phrase: They brought sick people and those troubled by unclean spirits
  preserved_meaning: The people brought both the physically ill and those afflicted by personal evil spirits.
  reasoning_layer_used: Lexical and theological decisions for ἀσθενεῖς and ὑπὸ πνευμάτων ἀκαθάρτων
  rationale: A separate sentence clarifies the action while retaining the biblical term “unclean spirits.”
- pob_phrase: they were all being healed
  simplified_phrase: All of them were being healed
  preserved_meaning: Every afflicted person brought in this ongoing scene received healing.
  reasoning_layer_used: Lexical and theological decisions for ἐθεραπεύοντο and ἅπαντες
  rationale: This wording preserves both the ongoing healing and its comprehensive scope.
translation_notes:
  risk_flags:
