  preserved_meaning: Satan acted upon Ananias’s heart, resulting in Ananias’s accountable lie.
  reasoning_layer_used: Lexical and theological decisions on Satan’s agency and the infinitive construction
  rationale: The result clause is easier English while preserving the heart image and unresolved tension about agency.
- pob_phrase: some of the price of the land
  simplified_phrase: some of the money from selling the land
  preserved_meaning: Ananias retained part of the land’s sale price.
  reasoning_layer_used: Lexical decisions for ἀπὸ τῆς τιμῆς and τοῦ χωρίου
  rationale: The revised wording makes the sale context immediately clear without narrowing “land” to “field.”
