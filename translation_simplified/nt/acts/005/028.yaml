  text: 'They said, “We gave you strict orders: do not teach under the authority of this name. But look—you have filled Jerusalem with your teaching! And you intend to bring this man’s blood upon us.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: That is, “hold us responsible for this man’s death.” The words “bring this man’s blood upon us” picture guilt for his death being placed on them.
