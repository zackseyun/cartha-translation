translation:
  language: en
  text: That is why I asked to meet with you and speak with you. I am wearing this chain because of the hope of Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Israel’s hope,” likely referring to the covenant promises and the hope of resurrection that Paul proclaims.
