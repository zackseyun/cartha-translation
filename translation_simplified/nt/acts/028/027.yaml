translation:
  language: en
  text: For these people’s hearts have become dull. They heard with difficulty, and they closed their eyes. Otherwise,[a] they might see with their eyes, hear with their ears, understand with their hearts, and turn back,[b] and I would heal them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “so that they would not see ... hear ... understand ... and turn back, and I would heal them.” The Greek can carry this stronger purpose nuance.
    reason: alternative_reading
  - marker: b
    text: “Turn back” may also be translated “turn,” “return,” or, in this context, “repent.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the heart of this people has become dull
  simplified_phrase: these people’s hearts have become dull
  preserved_meaning: The people’s inner understanding has become insensitive.
  reasoning_layer_used: POB lexical decisions for ἐπαχύνθη and καρδία
  rationale: The plural sounds natural while retaining the biblical image of a dull heart.
- pob_phrase: with their ears they heard heavily
  simplified_phrase: They heard with difficulty
  preserved_meaning: Their hearing was heavy or dull rather than receptive.
  reasoning_layer_used: POB lexical decision for βαρέως ἤκουσαν
  rationale: This replaces an opaque expression with its documented sense while retaining “heard.”
- pob_phrase: otherwise they might see ... and turn back, and I would heal them
  simplified_phrase: Otherwise, they might see ... and turn back, and I would heal them
  preserved_meaning: The healing remains within the same contingent quotation logic as seeing, hearing, understanding, and turning back.
  reasoning_layer_used: POB lexical and theological decisions for μήποτε, ἐπιστρέψωσιν, and ἰάσομαι
  rationale: Keeping one sentence preserves the judicial-hardening tension without making healing a simple temporal result.
translation_notes:
  risk_flags:
  - risk: Plural “hearts” changes the source’s collective singular image.
    mitigation: The wording retains heart language and applies the same condition to the whole people.
  - risk: “Otherwise” may understate the stronger purpose nuance of μήποτε.
    mitigation: Footnote a preserves the stronger reading without resolving the theological tension.
