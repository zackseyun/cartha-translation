simplification_decisions:
- pob_phrase: when Paul had gathered a bundle of sticks and put them on the fire
  simplified_phrase: Paul gathered a bundle of sticks and put it on the fire
  preserved_meaning: Paul first collected fuel and then placed the bundle on the fire.
  reasoning_layer_used: The lexical decisions identify gathering and placing as the natural sequence of the two participles.
  rationale: A separate sentence presents the sequence more directly.
- pob_phrase: a viper came out because of the heat
  simplified_phrase: Because of the heat, a viper came out
  preserved_meaning: The fire’s heat caused the viper to emerge.
  reasoning_layer_used: The lexical rationale treats the Greek preposition as expressing cause here.
  rationale: Moving the cause first makes the connection immediately clear.
- pob_phrase: fastened onto his hand
  simplified_phrase: fastened onto his hand
  preserved_meaning: The viper attached itself to Paul’s hand without specifying exactly how.
  reasoning_layer_used: The lexical decision preserves the verb’s broad image rather than narrowing it to a bite.
  rationale: The wording is retained because it is clear and protects the source ambiguity.
