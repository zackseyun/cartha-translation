translation:
  language: en
  text: 'The Holy Spirit said, “Go to this people and tell them: ‘You will certainly hear, but you will never understand what you hear. You will certainly see, but you will never perceive what you see.’”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek repeats the words for hearing and seeing to emphasize both actions; the final “perceive” can also be translated “see.”
    reason: lexical_alternative
