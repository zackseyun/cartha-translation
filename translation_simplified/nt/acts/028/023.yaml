translation:
  language: en
  text: They set a day to meet with Paul. On that day, more of them came to the place where he was staying. From morning until evening, Paul used both the Law of Moses and the Prophets as he explained and solemnly testified about the kingdom of God and tried to persuade them about Jesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “persuaded them”; the Greek may emphasize either persuasion itself or the attempt to persuade.
    reason: lexical_alternative
