translation:
  language: en
  text: When the islanders saw the creature hanging from his hand, they said to one another, “Surely this man is a murderer. He survived the sea, but Justice[a] has not allowed him to go on living.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Justice” is pictured as a power that punishes wrongdoing, reflecting the islanders’ beliefs.
    reason: cultural_note
simplification_decisions:
- pob_phrase: whom Justice has not allowed to live, though he was brought safely from the sea
  simplified_phrase: He survived the sea, but Justice has not allowed him to go on living.
  preserved_meaning: The man survived the sea ordeal, yet the islanders believed retributive Justice would now kill him.
  reasoning_layer_used: Lexical decisions for διασωθέντα and δίκη, plus the theological decision on personification
  rationale: Two direct clauses make the islanders’ reasoning easier to follow while preserving personified Justice.
- pob_phrase: has not allowed to live
  simplified_phrase: has not allowed him to go on living
  preserved_meaning: Justice supposedly would not permit the man to continue living.
  reasoning_layer_used: Lexical decision for ζῆν οὐκ εἴασεν
  rationale: Adding “go on” clarifies that continued life is in view.
translation_notes:
  risk_flags:
  - risk: Readers may mistake the islanders’ belief about Justice for the narrator’s own claim.
    mitigation: The statement remains inside their quotation, and the footnote identifies it as their belief.
  - risk: “He survived the sea” compresses the passive wording about being brought safely through danger.
    mitigation: It preserves the contextual result without suggesting spiritual salvation.
