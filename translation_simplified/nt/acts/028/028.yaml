translation:
  language: en
  text: 'So know this: this salvation of God has been sent to the Gentiles,[a] and they too will listen.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “this salvation from God.” The Greek can express this relationship in more than one closely related way.
    reason: lexical_alternative
  - marker: b
    text: Or “they too will hear.” The word can mean simply hearing or listening with a receptive response.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Therefore let it be known to you
  simplified_phrase: So know this
  preserved_meaning: Paul draws a conclusion and announces it directly to his hearers.
  reasoning_layer_used: Lexical decisions for οὖν and γνωστὸν ... ἔστω ὑμῖν
  rationale: The direct command keeps the logical link and declarative force in ordinary English.
- pob_phrase: this salvation of God
  simplified_phrase: this salvation of God
  preserved_meaning: “This” points back to the salvation proclaimed, while “of God” preserves the Greek relationship.
  reasoning_layer_used: Lexical and theological decisions for τοῦτο τὸ σωτήριον τοῦ θεοῦ
  rationale: Retaining the phrase protects both the demonstrative link and the documented genitive ambiguity.
- pob_phrase: they also will listen
  simplified_phrase: they too will listen
  preserved_meaning: The Gentiles are emphatically expected to receive what they hear rather than merely hear it.
  reasoning_layer_used: Lexical and theological decisions for αὐτοὶ καὶ ἀκούσονται
  rationale: “They too” naturally preserves the additive emphasis, while “listen” conveys receptive hearing.
translation_notes:
  risk_flags:
  - risk: “Of God” may be understood only as possession rather than source.
    mitigation: Footnote a preserves “from God” as a closely related alternative.
  - risk: “Will listen” may seem stronger than the basic sense “will hear.”
    mitigation: Footnote b records the lexical alternative without suggesting conversion.
