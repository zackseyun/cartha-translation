translation:
  language: en
  text: The local people were exceptionally kind to us.[a] They lit a fire and welcomed every one of us because the rain had set in and it was cold.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek term means people who did not speak Greek; here it does not imply that they were savage.
