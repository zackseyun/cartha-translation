- pob_phrase: It happened that after three days he called together the leading men of the Jews
  simplified_phrase: Three days later, Paul called together the leading Jewish men
  preserved_meaning: After three days, Paul summoned prominent Jewish representatives.
  reasoning_layer_used: Lexical decisions for the temporal expression, gathering verb, and social prominence
  rationale: This removes the heavy narrative frame while retaining the time, action, and status of the men.
- pob_phrase: the customs of our fathers
  simplified_phrase: the customs handed down by our ancestors
  preserved_meaning: Paul says he did not violate inherited Jewish customs.
  reasoning_layer_used: Lexical decision for τοῖς ἔθεσι τοῖς πατρῴοις
  rationale: This clearly expresses that the customs came from earlier generations.
- pob_phrase: was delivered as a prisoner from Jerusalem into the hands of the Romans
  simplified_phrase: was handed over as a prisoner from Jerusalem into the hands of the Romans
  preserved_meaning: Paul was transferred from Jerusalem into Roman custody while a prisoner.
  reasoning_layer_used: Lexical decisions for δέσμιος, παρεδόθην, and the hands idiom
  rationale: “Handed over” clearly presents one legal transfer while preserving the image of Roman hands.
