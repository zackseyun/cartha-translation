translation:
  language: en
  text: Three days later, Paul called together the leading Jewish men. When they had gathered, he said, “Brothers,[a] I did nothing against the Jewish people or the customs handed down by our ancestors. Even so, I was handed over as a prisoner from Jerusalem into the hands of the Romans.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Paul is addressing the Jewish men as fellow members of his people.
    reason: cultural_note
