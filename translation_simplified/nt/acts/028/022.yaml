translation:
  language: en
  text: But we think it is right to hear your views directly from you. After all, we know that people everywhere speak against this sect.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “sect” means a religious party or movement, not necessarily a heresy.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: we consider it proper
  simplified_phrase: we think it is right
  preserved_meaning: The speakers politely judge that hearing Paul is appropriate.
  reasoning_layer_used: Lexical decision for ἀξιοῦμεν
  rationale: Common wording preserves the polite judgment without sounding formal or demanding.
- pob_phrase: to hear from you what you think
  simplified_phrase: to hear your views directly from you
  preserved_meaning: They want Paul’s own account of his viewpoint.
  reasoning_layer_used: Lexical decisions for παρὰ σοῦ ἀκοῦσαι and ἃ φρονεῖς
  rationale: The recast phrase makes both the viewpoint and direct-source nuances immediately clear.
- pob_phrase: for concerning this sect it is known to us that it is spoken against everywhere
  simplified_phrase: After all, we know that people everywhere speak against this sect
  preserved_meaning: They know the Christian group is widely criticized by people.
  reasoning_layer_used: Lexical and theological decisions for αἵρεσις, γνωστὸν ἡμῖν ἐστιν, and ἀντιλέγεται
  rationale: The active sentence is easier to follow while retaining “sect” and the verbal image of speaking against it.
