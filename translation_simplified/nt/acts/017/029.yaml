translation:
  language: en
  text: So, since we are God’s offspring, we should not think that the Divine Being[a] is like an image made of gold, silver, or stone—something designed and shaped by human beings.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the Deity” or “the divine nature”; here the term refers to the true God.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Therefore, since we are God’s offspring, we ought not to think
  simplified_phrase: So, since we are God’s offspring, we should not think
  preserved_meaning: Paul draws a morally binding conclusion from humanity’s relationship to God.
  reasoning_layer_used: Lexical decisions for οὖν, γένος, and οὐκ ὀφείλομεν
  rationale: Common connecting and obligation words make the inference easier to follow.
- pob_phrase: like gold or silver or stone, an image formed
  simplified_phrase: like an image made of gold, silver, or stone
  preserved_meaning: God must not be compared to a manufactured image made from any of the three named materials.
  reasoning_layer_used: Lexical decisions for the materials and χαράγματι
  rationale: Reordering the phrase makes clear that the materials belong to the image.
- pob_phrase: formed by human skill and imagination
  simplified_phrase: designed and shaped by human beings
  preserved_meaning: The image comes from both human conception and human craftsmanship.
  reasoning_layer_used: Lexical decisions for τέχνης, ἐνθυμήσεως, and ἀνθρώπου
  rationale: Two concrete verbs clearly preserve the mental design and physical craft involved.
