translation:
  language: en
  text: Then the brothers[a] immediately sent Paul away, as far as the coast[b]. Silas and Timothy both stayed behind there.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “brothers and sisters”; the Greek says “brothers” but can refer collectively to fellow believers.
    reason: lexical_alternative
  - marker: b
    text: Or “to the sea” or “toward the sea”; the Greek leaves open whether Paul went only to the coast or continued by sea.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: sent Paul away to go as far as the sea
  simplified_phrase: sent Paul away, as far as the coast
  preserved_meaning: The believers promptly sent Paul out of the area toward the seacoast.
  reasoning_layer_used: Lexical decision for ἐξαπέστειλαν and ἕως ἐπὶ τὴν θάλασσαν
  rationale: Removing “to go” avoids repetition, while “coast” makes the destination clear without deciding what happened next.
- pob_phrase: but both Silas and Timothy remained there
  simplified_phrase: Silas and Timothy both stayed behind there
  preserved_meaning: Silas and Timothy remained in the place Paul left.
  reasoning_layer_used: Lexical decisions for ὑπέμεινάν, τε ... καὶ, and ἐκεῖ
  rationale: “Stayed behind” states the contrast with Paul’s departure in ordinary English.
translation_notes:
  risk_flags:
  - risk: “Coast” may sound more specific than the Greek word “sea.”
    mitigation: Footnote [b] preserves the literal and directional alternatives.
