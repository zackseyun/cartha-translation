translation:
  language: en
  text: But the Jews[a] became jealous. They gathered some wicked men from the marketplace, formed a mob, and caused an uproar throughout the city. Then they went to Jason’s house and tried to bring them out before the public assembly.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “the Jews” refers to a particular group of Jews in Thessalonica, not to all Jews everywhere.
    reason: simplification_note
