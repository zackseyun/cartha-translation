translation:
  language: en
  text: And from one man[a] he made every human nation to live across the whole face of the earth. He set their appointed times and the boundaries of the places where they lived.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some manuscripts read “from one blood” instead of “from one.” The main text follows the reading “from one,” with “man” supplied for clarity.
