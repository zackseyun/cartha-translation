simplification_decisions:
- pob_phrase: every nation of mankind
  simplified_phrase: every human nation
  preserved_meaning: Each distinct nation belongs to the one human race.
  reasoning_layer_used: POB lexical decision for πᾶν ἔθνος ἀνθρώπων
  rationale: The shorter phrase expresses the same collective human sense in ordinary English.
- pob_phrase: having determined their appointed times
  simplified_phrase: He set their appointed times
  preserved_meaning: God determined the significant periods assigned to the nations.
  reasoning_layer_used: POB lexical decisions for ὁρίσας and προστεταγμένους καιρούς
  rationale: A new sentence removes the dense participial structure and avoids repetitive wording.
- pob_phrase: the boundaries of their dwelling place
  simplified_phrase: the boundaries of the places where they lived
  preserved_meaning: God set the geographic limits of the nations’ habitation.
  reasoning_layer_used: POB lexical decisions for ὁροθεσίας and τῆς κατοικίας αὐτῶν
  rationale: This replaces formal wording without adding a future time frame or losing the boundary image.
