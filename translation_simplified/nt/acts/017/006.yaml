translation:
  language: en
  text: But they could not find them. So they dragged Jason and some brothers[a] before the city authorities and shouted, “These men have turned the world upside down,[b] and now they have come here too!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Brothers” means fellow believers here; the group may also have included women.
    reason: lexical_alternative
  - marker: b
    text: Here “the world” means the inhabited world known to them, especially the Roman world.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: But when they did not find them, they dragged
  simplified_phrase: But they could not find them. So they dragged
  preserved_meaning: Their failure to find the men led to the forceful seizure of others.
  reasoning_layer_used: The lexical decisions preserve the participle’s preceding circumstance and the coercive force of “dragged.”
  rationale: Two short sentences make the sequence and result immediately clear.
- pob_phrase: some brothers
  simplified_phrase: some brothers[a]
  preserved_meaning: Jason was taken with members of the Christian community.
  reasoning_layer_used: The lexical decision retains the masculine form while allowing an inclusive community sense in a note.
  rationale: The biblical community term stays in the text and is explained for new readers.
- pob_phrase: These men who have turned the world upside down have come here also
  simplified_phrase: These men have turned the world upside down, and now they have come here too
  preserved_meaning: The accusers claim that these men caused widespread upheaval and had now arrived there.
  reasoning_layer_used: The lexical decisions preserve the vivid upheaval image, the likely Roman-world scope, and the emphasis of “also.”
  rationale: A direct two-part accusation is easier to follow than the dense relative clause.
translation_notes:
  risk_flags:
  - risk: “World” may be mistaken for the entire globe.
    mitigation: Footnote b preserves the likely inhabited or Roman-world scope.
  - risk: “Brothers” may be read as excluding women in every possible referent.
    mitigation: Footnote a states the community sense and preserves the contextual uncertainty.
