translation:
  language: en
  text: As I went around, I looked carefully at the things you worship. I even found an altar inscribed, “To an unknown god.”[a] So I proclaim to you what you worship without knowing.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “To the unknown god.”
    reason: lexical_alternative
  - marker: b
    text: Or, “whom you worship without knowing.” The Greek says “what,” leaving the reference impersonal.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: as I was passing through and observing your objects of worship
  simplified_phrase: As I went around, I looked carefully at the things you worship
  preserved_meaning: Paul moved among their religious sites and attentively examined their revered objects.
  reasoning_layer_used: Lexical decisions for διερχόμενος, ἀναθεωρῶν, and σεβάσματα
  rationale: Common verbs replace dense participial wording while preserving attentive observation.
- pob_phrase: an altar on which had been inscribed
  simplified_phrase: an altar inscribed
  preserved_meaning: The altar already bore a dedicatory inscription.
  reasoning_layer_used: Lexical decision for ἐπεγέγραπτο
  rationale: The shorter construction preserves the inscription on the altar.
- pob_phrase: Therefore, what you worship in ignorance—this I proclaim to you
  simplified_phrase: So I proclaim to you what you worship without knowing
  preserved_meaning: Paul draws an inference from the inscription and publicly declares the unknown object of their worship.
  reasoning_layer_used: Lexical and theological decisions for ὃ οὖν, ἀγνοοῦντες, εὐσεβεῖτε, and καταγγέλλω
  rationale: Ordinary clause order clarifies the statement while retaining the impersonal “what.”
translation_notes:
  risk_flags:
  - risk: “Things you worship” is less technical than “objects of worship.”
    mitigation: It remains broad enough to include the Athenians’ revered religious objects.
  - risk: Readers may expect “whom” because Paul proceeds to speak about God.
    mitigation: The main text preserves the Greek neuter “what,” and the personal alternative appears in a footnote.
