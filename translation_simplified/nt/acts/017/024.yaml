  preserved_meaning: God's existing sovereignty over all creation remains a direct statement.
  reasoning_layer_used: lexical decision for ὑπάρχων κύριος
  rationale: A finite verb is clearer than the participial phrase without making it causal.
- pob_phrase: does not dwell in temples made by hands
