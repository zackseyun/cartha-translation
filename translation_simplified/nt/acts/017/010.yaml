translation:
  language: en
  text: The brothers[a] immediately sent both Paul and Silas away to Berea during the night. When Paul and Silas arrived, they went into the synagogue of the Jews.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “brothers and sisters.” The Greek says “brothers,” but it can refer to the wider community of believers.
    reason: lexical_alternative
  - marker: b
    text: This identifies the synagogue of Berea’s Jewish community; it is not a negative judgment.
    reason: simplification_note
simplification_decisions:
- pob_phrase: by night
  simplified_phrase: during the night
  preserved_meaning: The believers sent Paul and Silas away at nighttime.
  reasoning_layer_used: POB lexical decision for διὰ νυκτός
  rationale: The alternative already documented by POB is more immediately clear in modern English.
- pob_phrase: and when they arrived, they went
  simplified_phrase: When Paul and Silas arrived, they went
  preserved_meaning: Paul and Silas arrived in Berea and then entered the synagogue.
  reasoning_layer_used: POB lexical decisions for οἵτινες and παραγενόμενοι
  rationale: Repeating the names removes pronoun ambiguity after dividing the long sentence.
translation_notes:
  risk_flags:
