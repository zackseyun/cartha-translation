simplification_decisions:
- pob_phrase: has fixed a day on which
  simplified_phrase: has set a day when
  preserved_meaning: God has established a definite future day.
  reasoning_layer_used: The lexical decision treats ἔστησεν as setting or appointing.
  rationale: “Set a day when” is ordinary English with the same solemn force.
- pob_phrase: by a man whom he appointed
  simplified_phrase: through a man he has appointed
  preserved_meaning: God will carry out judgment through the appointed man.
  reasoning_layer_used: The lexical and theological decisions require the gender-specific “man” and the idea of appointment.
  rationale: The active wording is easier to follow without identifying the man beyond the POB.
- pob_phrase: having given proof to all by raising him from the dead
  simplified_phrase: He has given everyone proof of this by raising that man from the dead
  preserved_meaning: The resurrection publicly validates the appointed man and the coming judgment.
  reasoning_layer_used: The lexical rationale understands the participle as the means by which God gave proof.
  rationale: A separate sentence makes the connection between proof and resurrection clear.
