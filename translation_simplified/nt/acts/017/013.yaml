translation:
  language: en
  text: But when the Jews from Thessalonica found out that Paul had also proclaimed the word of God in Berea, they went to Berea too. They stirred up the crowds and threw them into turmoil.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: learned that the word of God had been proclaimed by Paul in Berea also
  simplified_phrase: found out that Paul had also proclaimed the word of God in Berea
  preserved_meaning: The group received news that Paul had publicly announced God’s message in an additional city.
  reasoning_layer_used: Lexical decisions for ἔγνωσαν, κατηγγέλη, ὑπὸ τοῦ Παύλου, and καί
  rationale: The active wording and familiar phrase “found out” make the report easier to follow without changing its content.
- pob_phrase: they came there too
  simplified_phrase: they went to Berea too
  preserved_meaning: Their opposition extended from Thessalonica to Berea.
  reasoning_layer_used: Lexical decision for ἦλθον κἀκεῖ
  rationale: Naming Berea removes an unclear location reference while preserving the repeated movement.
- pob_phrase: stirring up and troubling the crowds
  simplified_phrase: They stirred up the crowds and threw them into turmoil.
  preserved_meaning: They both agitated the crowds and caused public disturbance.
  reasoning_layer_used: Lexical decisions for σαλεύοντες and ταράσσοντες
  rationale: A separate sentence preserves both actions and clearly conveys the intensifying unrest.
translation_notes:
  risk_flags:
  - risk: Changing the passive proclamation clause to active wording could reduce its emphasis on the message itself.
    mitigation: The text retains “the word of God” and explicitly names Paul as the source does.
