translation:
  language: en
  text: So then, in the past God was patient during the times when people did not know him. But now he commands everyone everywhere to repent.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: To repent is to change one’s mind and turn away from sin.
    reason: simplification_note
simplification_decisions:
- pob_phrase: Therefore, having overlooked the times of ignorance
  simplified_phrase: So then, in the past God was patient during the times when people did not know him
  preserved_meaning: God showed forbearance during the former period of ignorance without approving it.
  reasoning_layer_used: Lexical and theological decisions on ὑπεριδών and τῆς ἀγνοίας
  rationale: This wording states the past setting and God’s forbearance in natural English.
- pob_phrase: God now commands
  simplified_phrase: But now he commands
  preserved_meaning: God’s present command contrasts with his former patience.
  reasoning_layer_used: Lexical decision on τὰ νῦν and discourse contrast
  rationale: A new sentence beginning with “But now” makes the time contrast clear.
- pob_phrase: all people everywhere
  simplified_phrase: everyone everywhere
  preserved_meaning: The command applies universally and is not restricted to males or Gentiles.
  reasoning_layer_used: Lexical and theological decisions on τοῖς ἀνθρώποις πάντας πανταχοῦ
  rationale: “Everyone everywhere” expresses the same universal scope more directly.
interpretive_expansions:
- pob_phrase: times of ignorance
  rendering: times when people did not know him
  claim: The ignorance in Paul’s argument concerns lack of knowledge of God.
  evidence:
  - The lexical rationale identifies a prior lack of knowledge of God among the nations.
  - The Areopagus context concerns people worshiping without knowing the true God.
  confidence: high
  alternatives_preserved:
  - times of ignorance
- pob_phrase: repent
  rendering: To repent is to change one’s mind and turn away from sin.
  claim: Repentance includes both changed thinking and moral turning.
  evidence:
  - The lexical rationale preserves both the cognitive and moral-turning dimensions of μετανοεῖν.
  confidence: high
  alternatives_preserved:
  - change their thinking
  - turn in repentance
