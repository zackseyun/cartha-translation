translation:
  language: en
  text: People do not serve God with their hands to supply something he needs.[a] He himself gives life, breath, and everything else to all.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also mean “worship.” Here it refers to religious service that does not meet any need in God.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Nor is he served by human hands
  simplified_phrase: People do not serve God with their hands
  preserved_meaning: Human activity, especially religious service, does not sustain God.
  reasoning_layer_used: Lexical and theological decisions on θεραπεύεται and “human hands”
  rationale: The active wording is easier to follow while retaining service and the concrete image of hands.
- pob_phrase: as though he needed anything
  simplified_phrase: to supply something he needs
  preserved_meaning: God does not receive human service because he lacks something.
  reasoning_layer_used: Lexical decision on προσδεόμενός τινος
  rationale: The purpose wording makes the rhetorical contrast clear without claiming that God needs anything.
- pob_phrase: gives to all life and breath and all things
  simplified_phrase: gives life, breath, and everything else to all
  preserved_meaning: All recipients depend on God for life and everything they possess.
  reasoning_layer_used: Lexical decisions on πᾶσι, πνοή, and καὶ τὰ πάντα
  rationale: The reordered list sounds natural while preserving its unrestricted scope and total force.
