  preserved_meaning: The accusation concerns ongoing opposition to Roman imperial rulings.
  reasoning_layer_used: lexical decisions for ἀπέναντι, δογμάτων, and πράσσουσι
  rationale: “Going against” is common English, while “official” clarifies what kind of decrees are meant.
- pob_phrase: saying that there is another king—Jesus
  simplified_phrase: by saying that Jesus is another king
  preserved_meaning: They are accused of presenting Jesus as a distinct royal claimant alongside Caesar.
  reasoning_layer_used: lexical and theological decisions for βασιλέα ἕτερον and εἶναι Ἰησοῦν
  rationale: Direct English clause order identifies Jesus clearly without weakening the political force of “king.”
