translation:
  language: en
  text: 'That is why I came without objecting when I was sent for.[a] Now I ask: Why did you send for me?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “without hesitation.” The Greek emphasizes that Peter did not resist or protest.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Therefore I came
  simplified_phrase: That is why I came
  preserved_meaning: Peter’s coming follows from the explanation he has just given.
  reasoning_layer_used: Lexical decision for διὸ and immediate discourse context.
  rationale: The clearer transition preserves the logical link to the previous verse.
- pob_phrase: without objection
  simplified_phrase: without objecting
  preserved_meaning: Peter came without resisting or speaking against the request.
  reasoning_layer_used: Lexical decision for ἀναντιρρήτως.
  rationale: The verbal form sounds more natural while retaining the Greek emphasis on not protesting.
- pob_phrase: So I ask, for what reason did you send for me?
  simplified_phrase: 'Now I ask: Why did you send for me?'
  preserved_meaning: Peter directly asks the purpose for which they summoned him.
  reasoning_layer_used: Lexical decisions for πυνθάνομαι, οὖν, τίνι λόγῳ, and μετεπέμψασθέ με.
  rationale: A direct question expresses the same inquiry in ordinary modern English.
translation_notes:
  risk_flags:
  - risk: “Without objecting” may be read more narrowly than the alternative “without hesitation.”
    mitigation: The footnote preserves the smoother lexical alternative while explaining the main sense.
