translation:
  language: en
  text: So he welcomed them inside and gave them a place to stay. The next day, he got up and left with them. Some of the brothers from Joppa also went along.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Brothers” may refer more broadly to fellow believers, including both men and women, but the Greek word here is masculine plural.
    reason: lexical_alternative
