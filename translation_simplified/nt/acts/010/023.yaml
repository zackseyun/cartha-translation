  simplified_phrase: welcomed them inside and gave them a place to stay
  preserved_meaning: Peter received the visitors and provided lodging for them.
  reasoning_layer_used: POB lexical decisions for εἰσκαλεσάμενος and ἐξένισεν
  rationale: The wording makes the concrete act of hospitality immediately clear.
- pob_phrase: went out with them
