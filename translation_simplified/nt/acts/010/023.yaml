  preserved_meaning: Peter departed in the visitors’ company.
  reasoning_layer_used: POB lexical decisions for ἐξῆλθεν and σὺν αὐτοῖς
  rationale: “Left with them” is more natural in a travel narrative while keeping the same movement.
- pob_phrase: and some of the brothers from Joppa went with him
  simplified_phrase: Some of the brothers from Joppa also went along
  preserved_meaning: Several brothers from Joppa accompanied Peter on the journey.
  reasoning_layer_used: POB lexical and theological decisions for ἀδελφῶν and συνῆλθον αὐτῷ
  rationale: A separate sentence reduces clause density while retaining “brothers” and their accompaniment.
