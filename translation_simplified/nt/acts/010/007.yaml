translation:
  language: en
  text: After the angel who had spoken to him left, he called two of his household servants[a] and a devout soldier who was one of his attendants.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “two of his household slaves.” The Greek refers to people serving within a household.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: When the angel who was speaking to him had gone away
  simplified_phrase: After the angel who had spoken to him left
  preserved_meaning: The angel’s departure happened before Cornelius called the three men.
  reasoning_layer_used: Lexical decisions for ὡς δὲ, ἀπῆλθεν, and ὁ λαλῶν αὐτῷ
  rationale: The simpler clause keeps the same sequence and identifies the angel as the one who spoke to him.
- pob_phrase: a devout soldier from among those attending him
  simplified_phrase: a devout soldier who was one of his attendants
  preserved_meaning: The soldier was devout and belonged to the group that personally attended Cornelius.
  reasoning_layer_used: Lexical decisions for εὐσεβῆ and τῶν προσκαρτερούντων αὐτῷ
  rationale: The relative clause expresses the partitive relationship in ordinary English.
translation_notes:
  risk_flags:
