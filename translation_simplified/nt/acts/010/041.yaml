translation:
  language: en
  text: Jesus did not appear to all the people. He appeared only to witnesses God had chosen beforehand—to us. We ate and drank with him after he rose from the dead.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “after he was raised from the dead.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: not to all the people, but to witnesses
  simplified_phrase: Jesus did not appear to all the people. He appeared only to witnesses
  preserved_meaning: Jesus appeared to a limited group rather than to all the people.
  reasoning_layer_used: POB lexical decision for οὐ παντὶ τῷ λαῷ and its stated contextual scope
  rationale: Two complete sentences make the contrast clear while preserving its limited scope.
- pob_phrase: witnesses who had been chosen beforehand by God—to us
  simplified_phrase: witnesses God had chosen beforehand—to us
  preserved_meaning: God selected these witnesses in advance, and Peter identifies himself and his companions as that group.
  reasoning_layer_used: POB lexical decisions for προκεχειροτονημένοις, ὑπὸ τοῦ θεοῦ, and ἡμῖν
  rationale: An active clause is easier to read without changing God’s role or the prior selection.
- pob_phrase: who ate and drank with him
  simplified_phrase: We ate and drank with him
  preserved_meaning: The chosen witnesses shared actual food and drink with the risen Jesus.
  reasoning_layer_used: POB lexical rationale for συνεφάγομεν καὶ συνεπίομεν αὐτῷ
  rationale: A direct sentence clarifies who shared the meal and keeps the concrete bodily evidence.
interpretive_expansions:
- pob_phrase: not to all the people, but to witnesses
  rendering: Jesus did not appear to all the people. He appeared only to witnesses
  claim: The omitted action is Jesus appearing to people after his resurrection.
  evidence:
  - The POB lexical rationale says the phrase defines those to whom Jesus appeared.
  - The contrast between all the people and selected witnesses requires the same appearance action in both clauses.
  confidence: high
translation_notes:
  risk_flags:
  - risk: Using “only” could be mistaken as denying any other resurrection appearances.
    mitigation: Its scope remains the verse’s contrast between all the people and the witnesses God selected.
