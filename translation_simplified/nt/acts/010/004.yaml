translation:
  language: en
  text: But Cornelius stared at him and became afraid. “What is it, Lord?” he asked. He answered, “Your prayers and the mercy you have shown to people in need have risen into God’s presence as a memorial.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: But he stared at him, and becoming afraid, said
  simplified_phrase: But Cornelius stared at him and became afraid. “What is it, Lord?” he asked.
  preserved_meaning: Cornelius fixes his gaze on the heavenly messenger, becomes afraid, and responds with reverence.
  reasoning_layer_used: POB lexical decisions and narrative context
  rationale: Naming Cornelius and using two sentences clarify the participants and sequence without weakening his fear.
- pob_phrase: your acts of mercy
  simplified_phrase: the mercy you have shown to people in need
  preserved_meaning: Cornelius mercifully gave help to needy people.
  reasoning_layer_used: POB lexical decision for ἐλεημοσύναι
  rationale: The wording explains the charitable action while retaining its character as mercy.
- pob_phrase: have gone up as a memorial before God
  simplified_phrase: have risen into God’s presence as a memorial
  preserved_meaning: His prayers and mercy ascend before God with the force of a memorial.
  reasoning_layer_used: POB lexical decisions for ἀνέβησαν, εἰς μνημόσυνον, and ἔμπροσθεν τοῦ θεοῦ
  rationale: This recasts the clause naturally while preserving both the upward image and memorial language.
