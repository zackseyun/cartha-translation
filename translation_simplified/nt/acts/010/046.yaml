simplification_decisions:
- pob_phrase: they were hearing them speaking
  simplified_phrase: they heard them speaking
  preserved_meaning: They heard the speech while it was taking place.
  reasoning_layer_used: Lexical decision for ἤκουον and natural English aspect
  rationale: The phrase “them speaking” preserves the ongoing action in more natural English.
- pob_phrase: magnifying God
  simplified_phrase: praising God
  preserved_meaning: They were openly honoring and exalting God.
  reasoning_layer_used: Lexical alternatives for μεγαλυνόντων
  rationale: “Praising” is the supplied common-English alternative for exalting God.
- pob_phrase: Then Peter answered
  simplified_phrase: Then Peter responded
  preserved_meaning: Peter spoke in reaction to what had happened.
  reasoning_layer_used: Lexical alternatives for ἀπεκρίθη
  rationale: “Responded” avoids implying that someone had asked Peter a direct question.
