translation:
  language: en
  text: When Peter came in, Cornelius met him. He fell at Peter’s feet and showed him deep reverence.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “worshiped him.” The Greek word can mean worship or an act of bowing down to show homage, depending on the context.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And when Peter entered
  simplified_phrase: When Peter came in
  preserved_meaning: Peter’s entrance sets the time for Cornelius’s response.
  reasoning_layer_used: POB lexical decision for εἰσελθεῖν
  rationale: “Came in” is more conversational and keeps the same simple event.
- pob_phrase: fell at his feet
  simplified_phrase: fell at Peter’s feet
  preserved_meaning: Cornelius physically lowered himself before Peter in abasement.
  reasoning_layer_used: POB lexical decision for πεσὼν ἐπὶ τοὺς πόδας
  rationale: Repeating Peter’s name makes the action immediately clear.
- pob_phrase: paid him homage
  simplified_phrase: showed him deep reverence
  preserved_meaning: Cornelius treated Peter with an excessive and serious gesture of honor.
  reasoning_layer_used: POB lexical and theological decisions for προσεκύνησεν
  rationale: “Deep reverence” communicates homage in common English without asserting divine worship.
