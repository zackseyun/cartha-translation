translation:
  language: en
  text: For David did not go up into the heavens.[a] But David himself says, “The Lord said to my Lord, ‘Sit at my right hand.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Psalm 110:1. In Hebrew, the first “Lord” represents the divine name YHWH; compare, “The LORD said to my Lord.”
    reason: source_note
simplification_decisions:
- pob_phrase: did not ascend into the heavens
  simplified_phrase: did not go up into the heavens
  preserved_meaning: David did not rise from earth into heaven.
  reasoning_layer_used: lexical decision for ἀνέβη and τοὺς οὐρανούς
  rationale: “Go up” is more familiar than “ascend” while preserving the upward image and plural “heavens.”
- pob_phrase: but he himself says
  simplified_phrase: But David himself says
  preserved_meaning: David is emphatically identified as the speaker of the psalm.
  reasoning_layer_used: lexical decision for λέγει δὲ αὐτός
  rationale: Repeating David’s name makes the pronoun clear while retaining the contrast and emphasis.
- pob_phrase: The Lord said to my Lord
  simplified_phrase: The Lord said to my Lord
  preserved_meaning: Both Greek occurrences of κύριος remain “Lord,” with their distinction supplied by context.
  reasoning_layer_used: theological decision on κύριος
  rationale: The wording remains unchanged because the Greek uses the same title twice and the Hebrew background stays in the footnote.
translation_notes:
  risk_flags:
  - risk: Replacing “ascend” with “go up” slightly reduces the elevated scriptural register.
    mitigation: The upward movement and “the heavens” are retained.
  - risk: Readers may not realize that the two uses of “Lord” have different Hebrew backgrounds.
    mitigation: The footnote identifies YHWH behind the first occurrence.
