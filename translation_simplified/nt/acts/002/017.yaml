translation:
  language: en
  text: God says, “In the last days, I will pour out from my Spirit[b] on all flesh.[a] Your sons and your daughters will prophesy. Your young men will see visions, and your old men will dream dreams.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: That is, on all people; the Greek says “all flesh,” preserving the prophetic image.
    reason: lexical_alternative
  - marker: b
    text: Traditional English often says “of my Spirit,” but the Greek more literally says “from my Spirit.”
    reason: lexical_alternative
