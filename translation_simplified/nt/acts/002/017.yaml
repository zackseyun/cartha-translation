  preserved_meaning: God announces what he will do in the last days.
  reasoning_layer_used: POB lexical decisions for the temporal phrase, citation formula, and pouring image
  rationale: Direct quotation removes the dense introductory structure while preserving its prophetic force.
- pob_phrase: and your sons and your daughters will prophesy, and your young men will see visions
  simplified_phrase: Your sons and your daughters will prophesy. Your young men will see visions
  preserved_meaning: Both sons and daughters will prophesy, and young men will receive visions.
  reasoning_layer_used: POB lexical decisions on gendered groups and prophetic terminology
  rationale: Two sentences make the parallel promises easier to follow without merging them.
- pob_phrase: and your old men will dream dreams
  simplified_phrase: and your old men will dream dreams
  preserved_meaning: The age contrast and concrete dream expression remain intact.
  reasoning_layer_used: POB lexical decision on the age-based contrast and cognate dream expression
  rationale: The vivid, natural phrase is already clear and should not be generalized.
translation_notes:
  risk_flags:
  - risk: “All flesh” may be mistaken for bodies rather than people broadly.
    mitigation: Footnote a gives the idiomatic meaning while retaining the prophetic image.
  - risk: “From my Spirit” may sound as though God's Spirit is divided.
    mitigation: The wording follows the Greek preposition without claiming that the Spirit is partitioned.
