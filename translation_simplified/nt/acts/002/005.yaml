translation:
  language: en
  text: Devout Jewish men[a] from all over the world[b] were living in Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek can also mean “Judean men,” but “Jewish men” best fits people who came from many nations.
    reason: alternative_reading
  - marker: b
    text: Literally, “from every nation under heaven,” a biblical expression for the whole world.
    reason: lexical_alternative
