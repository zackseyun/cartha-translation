translation:
  language: en
  text: 'Men of Israel, listen to this: Jesus the Nazarene was a man whom God confirmed to you through miracles, wonders, and signs. God did these works through him among you, as you yourselves know—'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: hear these words
  simplified_phrase: listen to this
  preserved_meaning: Peter commands the men to pay attention to what he is about to say.
  reasoning_layer_used: Lexical decision for ἀκούσατε τοὺς λόγους τούτους
  rationale: The simpler phrase keeps the imperative force without turning “words” into a broader message.
- pob_phrase: a man attested to you by God
  simplified_phrase: a man whom God confirmed to you
  preserved_meaning: God publicly demonstrated Jesus to the audience while Jesus is explicitly called a man.
  reasoning_layer_used: Lexical and Christological decisions for ἄνδρα ἀποδεδειγμένον ἀπὸ τοῦ θεοῦ
  rationale: “Confirmed” makes the difficult term “attested” easier while retaining God’s validating action and Jesus’ humanity.
- pob_phrase: with miracles and wonders and signs that God did through him in your midst
  simplified_phrase: through miracles, wonders, and signs. God did these works through him among you
  preserved_meaning: The three kinds of extraordinary works remain distinct, with God as the actor and Jesus as the mediating agent.
  reasoning_layer_used: Lexical and theological decisions for the miracle triad and agency clause
  rationale: Two sentences clarify the dense clause without changing who performed the works or through whom they were done.
translation_notes:
  risk_flags:
  - risk: “Confirmed” may sound less explicitly public than “attested.”
    mitigation: “To you” and the audience’s own knowledge keep the public evidential setting clear.
