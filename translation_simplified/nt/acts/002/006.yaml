  simplified_phrase: the crowd gathered. They were bewildered
  preserved_meaning: The people assembled and became confused by what was happening.
  reasoning_layer_used: Lexical decisions for συνῆλθε and συνεχύθη
  rationale: Two short sentences make the sequence easier to follow without changing it.
- pob_phrase: each one was hearing them speaking
  simplified_phrase: each person kept hearing the speakers use
  preserved_meaning: Every individual continually heard those already in view speaking.
  reasoning_layer_used: Lexical decisions for ἤκουον, εἷς ἕκαστος, and λαλούντων αὐτῶν
  rationale: “Kept hearing” naturally preserves the ongoing force, while “the speakers” clarifies the pronoun.
- pob_phrase: in his own dialect
  simplified_phrase: in his own dialect
  preserved_meaning: Each hearer recognized his own native or regional form of speech.
  reasoning_layer_used: Lexical and theological decisions for τῇ ἰδίᾳ διαλέκτῳ
  rationale: The key term and singular distributive wording remain, with the broader alternative noted.
