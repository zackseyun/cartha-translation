translation:
  language: en
  text: When this sound occurred, the crowd gathered. They were bewildered because each person kept hearing the speakers use his own dialect.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “his own language.” The Greek word points especially to a regional or native form of speech.
    reason: lexical_alternative
