  language: en
  text: They saw tongues that looked like fire, divided among them. What appeared came to rest on each one of them.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also be understood as “dividing tongues like fire” or “tongues, as if of fire.” It emphasizes both what they saw and how it was distributed among them.
