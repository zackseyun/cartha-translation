translation:
  language: en
  text: Therefore,[a] he was exalted to God's right hand. He received from the Father the promise of the Holy Spirit,[b] and he has poured out what you yourselves are seeing and hearing.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “he was exalted by God's right hand.” The Greek may refer either to his place at God's right hand or to God's power exalting him.
    reason: alternative_reading
  - marker: b
    text: The Greek may mean either that the Holy Spirit is the promised gift or that the promise concerns the Holy Spirit.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: having been exalted to the right hand of God
  simplified_phrase: he was exalted to God's right hand
  preserved_meaning: Jesus was raised to the place of honor and rule beside God.
  reasoning_layer_used: POB lexical and theological decisions on τῇ δεξιᾷ and ὑψωθείς
  rationale: A direct finite clause makes the enthronement statement easier to follow.
- pob_phrase: and having received from the Father
  simplified_phrase: He received from the Father
  preserved_meaning: The Son received the promise from the Father before pouring it out.
  reasoning_layer_used: POB lexical decision on λαβὼν παρὰ τοῦ πατρός
  rationale: A new sentence removes the dense chain of participles while keeping the sequence and source.
- pob_phrase: he has poured out this that you yourselves are seeing and hearing
  simplified_phrase: he has poured out what you yourselves are seeing and hearing
  preserved_meaning: The visible and audible events are the present result of what Jesus poured out.
  reasoning_layer_used: POB lexical decisions on ἐξέχεεν, τοῦτο, ὑμεῖς, and βλέπετε καὶ ἀκούετε
  rationale: Using “what” replaces an awkward English construction without naming the manifestation more narrowly than the Greek does.
translation_notes:
  risk_flags:
  - risk: Readers may take “God's right hand” as a physical location only.
    mitigation: The main text preserves the POB enthronement wording, while footnote a retains the grammatical alternative.
  - risk: “The promise of the Holy Spirit” remains open to two related senses.
    mitigation: Footnote b preserves both senses rather than forcing one interpretation.
