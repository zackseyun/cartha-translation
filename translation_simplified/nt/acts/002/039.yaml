translation:
  language: en
  text: For the promise is for you and your children. It is also for all who are far away—for everyone the Lord our God calls.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Far away” may refer to people who are geographically distant, distant from God’s covenant people, or both.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: for you and for your children and for all who are far off
  simplified_phrase: for you and your children. It is also for all who are far away
  preserved_meaning: The promise extends to the hearers, their children, and distant people.
  reasoning_layer_used: POB lexical decisions for τέκνοις and πᾶσι τοῖς εἰς μακράν
  rationale: Two sentences make the groups easier to follow without narrowing who is far away.
- pob_phrase: as many as the Lord our God calls
  simplified_phrase: for everyone the Lord our God calls
  preserved_meaning: The promise applies comprehensively to those God calls without defining how that call works.
  reasoning_layer_used: POB lexical and theological decisions for ὅσους ἂν προσκαλέσηται
  rationale: “Everyone” expresses the comprehensive force in more natural English.
