  preserved_meaning: Hades remains the named realm of the dead, not hell or merely the grave.
  reasoning_layer_used: lexical and theological decisions
  rationale: The brief gloss explains an unfamiliar term without replacing the Greek wording.
- pob_phrase: nor will you let
  simplified_phrase: or let
  preserved_meaning: God will neither abandon the speaker nor permit his Holy One to decay.
  reasoning_layer_used: source syntax and lexical decision
  rationale: The shorter coordination is natural English and keeps both negative claims distinct.
- pob_phrase: see decay
  simplified_phrase: see bodily decay
  preserved_meaning: The Holy One will not undergo physical decomposition.
  reasoning_layer_used: lexical decision and immediate resurrection context
  rationale: Adding “bodily” prevents readers from mistaking decay for moral corruption.
