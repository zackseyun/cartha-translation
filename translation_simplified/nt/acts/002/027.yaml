translation:
  language: en
  text: because you will not abandon my soul to Hades[a]—the realm of the dead—or let your Holy One[b] see bodily decay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek has “Hades”; the Hebrew Psalm behind this quotation has “Sheol.”
    reason: alternative_reading
  - marker: b
    text: Or “your faithful one.”
    reason: lexical_alternative
