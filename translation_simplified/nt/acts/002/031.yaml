translation:
  language: en
  text: 'David saw beforehand what would happen. He spoke about the Messiah[a] rising from the dead: the Messiah was not abandoned to Hades, the realm of the dead, and his flesh did not decay.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally, “Christ.” Here “Messiah” presents the word as the title of God’s promised anointed one.
    reason: lexical_alternative
