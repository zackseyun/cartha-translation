translation:
  language: en
  text: 'Therefore, let all the people of Israel know for certain: God has made this Jesus, whom you crucified, both Lord and Messiah.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Christ.” Messiah is the title meant here.
    reason: alternative_reading
  - marker: b
    text: “Has made” means that God exalted Jesus and publicly installed him as Lord and Messiah, not that Jesus’ divine nature changed.
    reason: lexical_alternative
