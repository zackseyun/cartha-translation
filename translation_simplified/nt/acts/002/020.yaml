  preserved_meaning: The moon-to-blood image occurs before the day of the Lord.
  reasoning_layer_used: Lexical decisions for εἰς αἷμα and πρὶν ἢ ἐλθεῖν
  rationale: Repeating the verb and dividing the sentence makes the image and sequence immediately clear.
translation_notes:
  risk_flags:
