  preserved_meaning: The sun undergoes a transition into darkness while the passive transformation image remains.
  reasoning_layer_used: Lexical decisions for μεταστραφήσεται and εἰς σκότος
  rationale: The shorter wording is more natural while preserving the future passive change.
- pob_phrase: and the moon into blood, before
