translation:
  language: en
  text: They praised God and were well regarded by all the people. Every day the Lord kept adding to their number[a] those who were being saved.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek phrase translated “to their number” can also mean “together” or “in the same place.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: praising God and having favor with all the people
  simplified_phrase: They praised God and were well regarded by all the people
  preserved_meaning: The community continued praising God and enjoyed the goodwill of the wider populace.
  reasoning_layer_used: POB lexical decisions for αἰνοῦντες and ἔχοντες χάριν πρὸς ὅλον τὸν λαόν
  rationale: Finite verbs and “well regarded” make the description immediately clear without reversing who showed favor.
- pob_phrase: was adding day by day
  simplified_phrase: Every day the Lord kept adding
  preserved_meaning: The Lord repeatedly added people on successive days.
  reasoning_layer_used: POB lexical decisions for προσετίθει and καθ’ ἡμέραν
  rationale: “Kept adding” naturally preserves the Greek verb’s ongoing and repeated force.
- pob_phrase: those who were being saved to them
  simplified_phrase: to their number those who were being saved
  preserved_meaning: Those undergoing God’s saving action were added to the existing community.
  reasoning_layer_used: POB theological decisions for τοὺς σῳζομένους and ἐπὶ τὸ αὐτό
  rationale: The reordered clause reads naturally while retaining both ongoing salvation and addition to the group.
translation_notes:
  risk_flags:
  - risk: “Well regarded” may sound less relational than the biblical image of having favor.
    mitigation: The wording still conveys the people’s goodwill without implying that the believers showed favor to them.
  - risk: “To their number” resolves a genuinely difficult Greek phrase toward group membership.
    mitigation: The footnote preserves the alternatives “together” and “in the same place.”
