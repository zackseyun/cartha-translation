translation:
  language: en
  text: Every day they kept gathering together in the temple courts, united in purpose. In one home after another, they broke bread[a] and shared meals with joy and open hearts.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Broke bread” may mean ordinary shared meals, though it may also include the Lord’s Supper.
    reason: alternative_reading
  - marker: b
    text: The Greek may also be expressed as “sincere hearts” or “generous hearts.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: continuing together with one purpose in the temple courts
  simplified_phrase: kept gathering together in the temple courts, united in purpose
  preserved_meaning: They persistently met as a unified community in the temple complex.
  reasoning_layer_used: Lexical decisions for προσκαρτεροῦντες, ὁμοθυμαδόν, and ἱερόν
  rationale: The rewrite makes the ongoing action and shared purpose clear in ordinary English.
- pob_phrase: breaking bread from house to house
  simplified_phrase: In one home after another, they broke bread
  preserved_meaning: They repeatedly practiced table fellowship in various homes without limiting it to either ordinary meals or the Lord’s Supper.
  reasoning_layer_used: Lexical and theological decisions for κλῶντές ἄρτον and κατ’ οἶκον
  rationale: The new order clarifies the repeated movement among homes while retaining the deliberate ambiguity of “broke bread.”
- pob_phrase: sharing meals with gladness and simplicity of heart
  simplified_phrase: shared meals with joy and open hearts
  preserved_meaning: Their communal meals were marked by gladness and unaffected, sincere openness.
  reasoning_layer_used: Lexical decisions for τροφῆς, ἀγαλλιάσει, and ἀφελότητι καρδίας
  rationale: “Joy” and “open hearts” communicate the emotional and inward qualities without opaque biblical phrasing.
translation_notes:
