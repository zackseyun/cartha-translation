translation:
  language: en
  text: Peter said many other things to them. He gave solemn testimony and kept urging them, “Be saved from this crooked generation.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Save yourselves from this crooked generation.” The Greek says “be saved,” while the command still calls the hearers to respond.
