  preserved_meaning: The speaker is Peter.
  reasoning_layer_used: Immediate narrative context and the lexical note identifying Peter's hearers.
  rationale: Naming Peter removes an unclear pronoun for readers encountering the verse alone.
- pob_phrase: this crooked generation
  simplified_phrase: this crooked generation
  preserved_meaning: Peter describes his contemporaries with a vivid moral image of crookedness.
  reasoning_layer_used: Lexical decisions for γενεᾶς and σκολιᾶς.
