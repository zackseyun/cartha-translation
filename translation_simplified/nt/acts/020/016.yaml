translation:
  language: en
  text: Paul had decided to sail past Ephesus rather than spend time in the Roman province of Asia. He was hurrying so that, if possible, he could be in Jerusalem on the day of Pentecost.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “arrive in Jerusalem on the day of Pentecost.” The Greek may refer either to being there by that day or to arriving that day.
    reason: alternative_reading
