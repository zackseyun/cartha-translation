translation:
  language: en
  text: But we went ahead to the ship and sailed for Assos. We planned to take Paul on board there. He had arranged it that way[a] because he intended to travel by land himself.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “It had been arranged that way.”
    reason: alternative_reading
  - marker: b
    text: The Greek may mean that Paul intended to travel on foot, in contrast to their voyage by ship.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: having gone ahead to the ship, set sail for Assos
  simplified_phrase: went ahead to the ship and sailed for Assos
  preserved_meaning: The group reached the ship before Paul and then departed by sea for Assos.
  reasoning_layer_used: Lexical decisions for προελθόντες and ἀνήχθημεν
  rationale: Ordinary past-tense verbs make the sequence clear without a heavy participial structure.
- pob_phrase: intending to take Paul on board from there
  simplified_phrase: planned to take Paul on board there
  preserved_meaning: The group intended to bring Paul aboard the ship at Assos.
  reasoning_layer_used: Lexical decisions for μέλλοντες ἀναλαμβάνειν and ἐκεῖθεν
  rationale: This keeps the maritime action explicit while stating the plan naturally.
- pob_phrase: for so he had arranged, since he himself intended to go by land
  simplified_phrase: He had arranged it that way because he intended to travel by land himself
  preserved_meaning: Paul arranged for the group to sail while he traveled separately by land.
  reasoning_layer_used: Lexical decisions for διατεταγμένος ἦν and μέλλων αὐτὸς πεζεύειν
  rationale: A separate sentence gives the plan and its reason in normal English order without adding a destination.
translation_notes:
  risk_flags:
  - risk: The Greek form behind “he had arranged” is formally passive.
    mitigation: Footnote a preserves the possible impersonal reading.
  - risk: “By land” may be broader than the possible sense “on foot.”
    mitigation: Footnote b preserves that lexical possibility and its contrast with sailing.
