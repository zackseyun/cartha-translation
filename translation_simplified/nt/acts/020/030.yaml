simplification_decisions:
- pob_phrase: from among your own selves
  simplified_phrase: Even from among you
  preserved_meaning: The threat will come from within the Ephesian community itself.
  reasoning_layer_used: Lexical decision for ἐξ ὑμῶν αὐτῶν.
  rationale: “Even” preserves the internal-source emphasis without the awkward phrase “your own selves.”
- pob_phrase: to draw away the disciples after themselves
  simplified_phrase: to draw the disciples away to follow them
  preserved_meaning: The men aim to separate the disciples from their present allegiance and gain them as followers.
  reasoning_layer_used: Lexical decisions for ἀποσπάω and ὀπίσω ἑαυτῶν.
  rationale: The wording preserves the drawing-away image and clearly expresses the allegiance idiom without implying coercion.
interpretive_expansions:
- pob_phrase: after themselves
  rendering: to follow them
  claim: The men seek to gain the disciples as their own followers.
  evidence:
  - The lexical rationale identifies the idiom as indicating allegiance or following.
  - The purpose clause describes their aim of drawing the disciples away.
  confidence: high
  alternatives_preserved:
  - after themselves
  - behind them
translation_notes:
  risk_flags:
