translation:
  language: en
  text: In everything I did, I showed you that you must work hard in this way to help those who are weak.[a] Remember also the words of the Lord Jesus. He himself said, “It is more blessed to give than to receive.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “support those who are weak.” The word may refer to ongoing support, not just help in a single moment.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: In everything I showed you
  simplified_phrase: In everything I did, I showed you
  preserved_meaning: Paul's whole pattern of conduct served as an example.
  reasoning_layer_used: Lexical decision for ὑπέδειξα and its context
  rationale: Adding “I did” makes clear that Paul showed them by his actions.
- pob_phrase: by laboring in this way it is necessary to help
  simplified_phrase: you must work hard in this way to help
  preserved_meaning: Paul's strenuous labor models an obligation to aid vulnerable people.
  reasoning_layer_used: Lexical decisions for κοπιῶντας, δεῖ, and ἀντιλαμβάνεσθαι
  rationale: The active wording states the obligation naturally while retaining strenuous work and help.
- pob_phrase: and to remember the words of the Lord Jesus
  simplified_phrase: Remember also the words of the Lord Jesus
  preserved_meaning: Remembering Jesus' saying remains a distinct obligation.
  reasoning_layer_used: Lexical decision for μνημονεύειν τε
  rationale: A new sentence makes the coordinated command easier to follow.
interpretive_expansions:
- pob_phrase: it is necessary
  rendering: you must
  claim: The obligation is addressed directly to Paul's hearers.
  evidence:
  - The clause says Paul showed “you” what was necessary.
  - The surrounding speech directly instructs the Ephesian elders.
  confidence: high
  alternatives_preserved:
  - it is necessary
  - we must
translation_notes:
  risk_flags:
  - risk: “Those who are weak” could be read as only physically weak.
    mitigation: The broad wording is retained without narrowing it to the poor, sick, or spiritually weak.
