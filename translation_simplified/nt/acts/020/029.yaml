translation:
  language: en
  text: I know that after I leave,[a] fierce wolves will come in among you. They will show no mercy to the flock.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek expression literally says “after my coming” or “after my arrival,” but here it means after Paul leaves.
    reason: source_note
simplification_decisions:
- pob_phrase: after my departure
  simplified_phrase: after I leave
  preserved_meaning: The warning concerns what will happen once Paul is gone.
  reasoning_layer_used: POB lexical and theological decisions on ἄφιξις
  rationale: The direct clause is easier than the abstract noun while preserving the contextual sense.
- pob_phrase: not sparing the flock
  simplified_phrase: They will show no mercy to the flock
  preserved_meaning: The intruders will treat the flock ruthlessly.
  reasoning_layer_used: POB lexical decision on μὴ φειδόμενοι
  rationale: A separate sentence makes the action clear while retaining its severity.
- pob_phrase: fierce wolves will come in among you
  simplified_phrase: fierce wolves will come in among you
  preserved_meaning: Dangerous people will intrude into the community, but the verse does not identify them more narrowly.
  reasoning_layer_used: POB lexical and theological decisions on λύκοι βαρεῖς and εἰς ὑμᾶς
  rationale: The vivid wolf image remains because replacing it would weaken the warning and over-interpret the intruders.
