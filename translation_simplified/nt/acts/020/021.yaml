  review_summary: The finite first-person wording is a warranted, clearer resolution of Paul’s participle in this first-person speech, and “turning to God in repentance” helpfully explains the God-directed character of repentance without reducing it to a mere change of mind. However, “they must” adds a modal requirement not stated in the Greek and converts Paul’s testimony about repentance and faith into a more specific formulation of his hearers’ duty. Removing the modal preserves both the source wording and the live distinction between the content of Paul’s testimony and its intended response.
