translation:
  language: en
  text: Watch yourselves carefully, and watch over the whole flock. The Holy Spirit has appointed you as overseers among them to shepherd the church of God.[a] He obtained the church through the blood of his own.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some manuscripts read “the church of the Lord.”
    reason: textual_variant
  - marker: b
    text: This may mean “through the blood of his own Son”; traditionally, “with his own blood.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Pay careful attention to yourselves and to all the flock
  simplified_phrase: Watch yourselves carefully, and watch over the whole flock
  preserved_meaning: Both the leaders and the entire flock require ongoing vigilance.
  reasoning_layer_used: Lexical decisions for προσέχετε and παντὶ τῷ ποιμνίῳ
  rationale: Repeating “watch” makes both objects of vigilance immediately clear.
- pob_phrase: in which the Holy Spirit has appointed you overseers
  simplified_phrase: The Holy Spirit has appointed you as overseers among them
  preserved_meaning: The Spirit placed these leaders within the flock in a supervisory role.
  reasoning_layer_used: Lexical decisions for ἐν ᾧ, ἔθετο, and ἐπισκόπους
  rationale: A new sentence and “among them” replace the difficult collective construction.
- pob_phrase: to shepherd the church of God, which he obtained
  simplified_phrase: to shepherd the church of God. He obtained the church
  preserved_meaning: Their appointment is for caring for God’s church, which he acquired.
  reasoning_layer_used: Lexical decisions for ποιμαίνειν, ἐκκλησίαν, and περιεποιήσατο
  rationale: The purpose infinitive and shepherd image remain while the relative clause becomes a clear sentence.
translation_notes:
  risk_flags:
  - risk: “The blood of his own” is unusual English because the Greek leaves the person unstated.
    mitigation: The main text preserves the audited ambiguity, and the footnote gives both major interpretations.
  - risk: “He” requires readers to identify God as the antecedent.
    mitigation: Its placement after “the church of God” keeps the reference clear without resolving the Christological tension.
