translation:
  language: en
  text: But Paul went down, threw himself over him, and held him close. He said, “Do not be alarmed. His life is in him.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may mean that he had not died or that his life had been restored; the Greek does not settle the question.
    reason: alternative_reading
