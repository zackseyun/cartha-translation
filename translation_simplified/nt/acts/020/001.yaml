translation:
  language: en
  text: When the uproar ended, Paul sent for the disciples. He encouraged them, said goodbye,[a] and left for Macedonia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “greeted them”; the Greek word can mean either greeting someone or saying goodbye when leaving.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: After the uproar had ceased
  simplified_phrase: When the uproar ended
  preserved_meaning: Paul acted only after the public disturbance was over.
  reasoning_layer_used: POB lexical decision for Μετὰ δὲ τὸ παύσασθαι and θόρυβον
  rationale: The shorter wording keeps the same time sequence and the intensity of the disturbance.
- pob_phrase: and after encouraging them and saying farewell
  simplified_phrase: He encouraged them, said goodbye
  preserved_meaning: Paul strengthened the disciples and took leave of them before departing.
  reasoning_layer_used: POB lexical decisions for παρακαλέσας and ἀσπασάμενος
  rationale: Two direct verbs make the sequence easier to follow without merging the distinct actions.
- pob_phrase: he departed to go to Macedonia
  simplified_phrase: left for Macedonia
  preserved_meaning: Paul departed with Macedonia as his intended destination.
  reasoning_layer_used: POB lexical decisions for ἐξῆλθεν and πορεύεσθαι εἰς Μακεδονίαν
  rationale: This common travel expression states the same departure and destination more naturally.
translation_notes:
  risk_flags:
  - risk: “Said goodbye” selects the departure sense of a Greek word that can also mean “greeted.”
    mitigation: The footnote preserves the documented lexical alternative.
