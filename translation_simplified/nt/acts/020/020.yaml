- pob_phrase: did not shrink back from declaring to you
  simplified_phrase: did not hold back from telling you
  preserved_meaning: Paul refused to withhold what he made known.
  reasoning_layer_used: Lexical decisions for ὑπεστειλάμην and ἀναγγεῖλαι
  rationale: The wording uses POB's approved alternatives in more familiar English.
- pob_phrase: anything that was profitable
