  preserved_meaning: The content was beneficial to the hearers rather than financially profitable.
  reasoning_layer_used: Lexical and theological decisions for τῶν συμφερόντων
  rationale: “Help you” prevents a likely financial misunderstanding while retaining the broad benefit.
- pob_phrase: and teaching you publicly and from house to house
  simplified_phrase: or from teaching you in public and from house to house
  preserved_meaning: Paul did not hold back from teaching in either open settings or repeated personal visits to homes.
  reasoning_layer_used: Greek coordination and lexical decisions for διδάξαι, δημοσίᾳ, and κατ’ οἴκους
  rationale: Repeating “from” keeps both activities under “did not hold back” while preserving the house-to-house image.
