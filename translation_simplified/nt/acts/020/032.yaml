translation:
  language: en
  text: And now I entrust you to God and to the message of his grace.[a] This message can strengthen you and give you the inheritance shared by all who have been made holy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “God, who can strengthen you and give you the inheritance,” if the phrase refers primarily to God rather than to the message of his grace.
    reason: alternative_reading
