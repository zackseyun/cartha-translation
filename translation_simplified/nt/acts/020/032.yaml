  simplified_phrase: the message of his grace
  preserved_meaning: God’s gracious word is the proclaimed message entrusted to the hearers.
  reasoning_layer_used: POB lexical decision for λόγος
  rationale: “Message” makes the intended sense of “word” clear while retaining grace as its content.
- pob_phrase: to build up
  simplified_phrase: strengthen you
  preserved_meaning: The message can spiritually strengthen the people Paul addresses.
  reasoning_layer_used: POB lexical rationale for οἰκοδομῆσαι
  rationale: “Strengthen” states the recognized metaphorical sense without narrowing it to faith alone.
- pob_phrase: among all those who have been sanctified
  simplified_phrase: shared by all who have been made holy
  preserved_meaning: The inheritance belongs with the whole people whom God has made holy.
  reasoning_layer_used: POB lexical decision for ἐν τοῖς ἡγιασμένοις πᾶσιν
  rationale: Common wording preserves both the shared inheritance and the passive act of being made holy.
