translation:
  language: en
  text: When he saw that this pleased the Jews,[a] he went on to arrest Peter too. This happened during the Festival of Unleavened Bread.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the Judeans,” or possibly “the Jewish leaders” in this context. The Greek text simply says “the Jews.”
    reason: lexical_alternative
  - marker: b
    text: This was the festival period following Passover, when people ate bread made without yeast.
    reason: cultural_note
simplification_decisions:
- pob_phrase: it was pleasing to the Jews
  simplified_phrase: this pleased the Jews
  preserved_meaning: His previous action gained the approval of the Jews.
  reasoning_layer_used: Lexical decision for ἀρεστόν ἐστιν and theological decision for Ἰουδαίοις
  rationale: The active wording is easier to read while retaining the source’s broad designation.
- pob_phrase: he proceeded to arrest Peter also
  simplified_phrase: he went on to arrest Peter too
  preserved_meaning: He added Peter as another target for arrest.
  reasoning_layer_used: Lexical decisions for προσέθετο, συλλαβεῖν, and καὶ Πέτρον
  rationale: Common phrasing preserves both the legal action and the additive force.
- pob_phrase: Now these were the days of Unleavened Bread
  simplified_phrase: This happened during the Festival of Unleavened Bread
  preserved_meaning: The arrest occurred during the specifically named Jewish festival period.
  reasoning_layer_used: Lexical and theological decisions for τῶν ἀζύμων
  rationale: The temporal note becomes direct English without collapsing the festival into Passover.
