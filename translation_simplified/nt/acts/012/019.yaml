translation:
  language: en
  text: Herod searched for him but could not find him. He questioned the guards and ordered them taken away to be executed.[a] Then he left Judea, went down to Caesarea, and stayed there.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “ordered them to be led away.” In this context, this likely means they were taken away for execution.
