- pob_phrase: after searching for him and not finding him
  simplified_phrase: searched for him but could not find him
  preserved_meaning: Herod deliberately searched, failed to find him, and then acted against the guards.
  reasoning_layer_used: Lexical decisions for ἐπιζητήσας and μὴ εὑρὼν
  rationale: A direct finite clause makes the sequence easier to follow.
- pob_phrase: examined the guards
  simplified_phrase: questioned the guards
  preserved_meaning: Herod conducted an official inquiry into the guards’ failure.
  reasoning_layer_used: Lexical decision for ἀνακρίνας
  rationale: “Questioned” communicates the action more plainly than “examined.”
- pob_phrase: Then he went down from Judea to Caesarea
  simplified_phrase: Then he left Judea, went down to Caesarea
  preserved_meaning: Herod traveled from Judea to the coastal city of Caesarea.
  reasoning_layer_used: Lexical decision for κατελθὼν and geographical context
  rationale: Adding “left” clarifies the point of departure while retaining the source’s downward-travel image.
