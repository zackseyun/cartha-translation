translation:
  language: en
  text: He was very angry[a] with the people of Tyre and Sidon. But they came to him united in purpose. After persuading Blastus, an official in charge of the king’s private quarters, they kept asking for peace because their country got its food supply from the king’s territory.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek can also mean that he was openly hostile toward them.
    reason: lexical_alternative
