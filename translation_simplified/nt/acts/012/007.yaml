  simplified_phrase: Suddenly, an angel of the Lord stood beside Peter
  preserved_meaning: The angel became vividly and suddenly present close to Peter.
  reasoning_layer_used: POB lexical decisions for ἰδοὺ and ἐπέστη
  rationale: “Suddenly” conveys the vivid arrival, while “beside Peter” makes the angel’s proximity clear.
- pob_phrase: in the cell
