translation:
  language: en
  text: Suddenly, an angel of the Lord stood beside Peter, and a light shone in the prison cell. The angel struck Peter on the side, woke him, and said, “Get up quickly!” Peter’s chains fell from his hands.
  philosophy: optimal-equivalence
