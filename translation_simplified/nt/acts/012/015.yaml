translation:
  language: en
  text: The others told her, “You are out of your mind!” But she continued to insist that it was true. They kept replying, “It is his angel.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek simply says “his angel.” It may refer to his guardian angel or an angel representing him. Some interpreters understand it as his spirit or ghost.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: But they said to her
  simplified_phrase: The others told her
  preserved_meaning: The people with Rhoda directly rejected what she was saying.
  reasoning_layer_used: Immediate narrative context and POB syntax
  rationale: “The others” makes the change of speakers clear without changing who spoke.
- pob_phrase: But she kept insisting that it was so
  simplified_phrase: But she continued to insist that it was true
  preserved_meaning: Her emphatic insistence continued despite their response.
  reasoning_layer_used: POB lexical decisions for διϊσχυρίζετο and οὕτως ἔχειν
  rationale: “It was true” expresses the idiom in common English while preserving her continued insistence.
- pob_phrase: And they kept saying
  simplified_phrase: They kept replying
  preserved_meaning: They repeatedly answered her with the same explanation.
  reasoning_layer_used: POB lexical decision for imperfect ἔλεγον
  rationale: “Replying” clarifies the exchange while “kept” preserves repeated speech.
