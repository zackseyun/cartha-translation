simplification_decisions:
- pob_phrase: saying to them
  simplified_phrase: He told them
  preserved_meaning: Paul directly addresses the ship’s company.
  reasoning_layer_used: POB lexical decision for λέγων αὐτοῖς
  rationale: A finite verb makes the narrative introduction natural in modern English.
- pob_phrase: I perceive
  simplified_phrase: I can tell
  preserved_meaning: Paul expresses an informed judgment rather than mere visual sight.
  reasoning_layer_used: POB lexical decision for θεωρῶ
  rationale: “I can tell” communicates discernment in familiar language.
- pob_phrase: is about to be with disaster and great loss
  simplified_phrase: is going to involve disaster and great loss
  preserved_meaning: The voyage is expected to include severe hardship and loss without being portrayed as their agent.
  reasoning_layer_used: POB lexical decisions for μέλλειν ἔσεσθαι and μετὰ ὕβρεως καὶ πολλῆς ζημίας
  rationale: “Involve” clearly preserves the Greek sense of accompanying circumstance or result.
