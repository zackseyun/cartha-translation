translation:
  language: en
  text: We boarded a ship from Adramyttium that was about to sail to destinations along Asia.[a][b] Then we put out to sea. Aristarchus, a Macedonian from Thessalonica, was with us.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “Asia” means the Roman province in western Asia Minor, not the modern continent.
    reason: cultural_note
  - marker: b
    text: Or “to ports along the coast of Asia.”
    reason: lexical_alternative
