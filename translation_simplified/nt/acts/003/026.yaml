translation:
  language: en
  text: God raised up[a] his servant[b] and sent him to you first. He sent him to bless you by turning each of you away from your wicked ways.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Raised up” may mean that God brought forth or appointed his servant, rather than that he raised him from the dead.
    reason: alternative_reading
  - marker: b
    text: The Greek word can also mean “child,” but “servant” likely reflects the Servant described in Isaiah.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: To you first, God, having raised up his servant, sent him
  simplified_phrase: God raised up his servant and sent him to you first.
  preserved_meaning: God gave Peter’s Jewish audience first priority while the sense of “raised up” remains open.
  reasoning_layer_used: POB lexical and theological decisions on ὑμῖν πρῶτον and ἀναστήσας
  rationale: The clause is reordered and the participle becomes a finite verb for natural English without resolving its ambiguity.
- pob_phrase: sent him to bless you by turning each of you from your wicked ways
  simplified_phrase: He sent him to bless you by turning each of you away from your wicked ways.
  preserved_meaning: The blessing comes as each person is turned away from evil conduct.
  reasoning_layer_used: POB lexical decisions on εὐλογοῦντα, ἐν τῷ ἀποστρέφειν, ἕκαστον, and πονηρίαι
  rationale: A second sentence reduces clause density while keeping blessing, means, individual scope, and moral force distinct.
