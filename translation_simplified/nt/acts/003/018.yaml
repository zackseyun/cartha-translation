simplification_decisions:
- pob_phrase: God thus fulfilled
  simplified_phrase: this is how God fulfilled
  preserved_meaning: The Messiah’s suffering was the way God fulfilled his prior announcement.
  reasoning_layer_used: POB lexical decision for οὕτως
  rationale: The common phrase “this is how” makes the manner of fulfillment immediately clear.
- pob_phrase: through the mouth of all the prophets
  simplified_phrase: through the words of all the prophets
  preserved_meaning: God communicated the announcement through the prophets’ speech.
  reasoning_layer_used: POB lexical decision and footnote for διὰ στόματος πάντων τῶν προφητῶν
  rationale: “Through the words” preserves the speech image without using an unfamiliar biblical idiom.
- pob_phrase: that his Messiah would suffer
  simplified_phrase: his Messiah would suffer
  preserved_meaning: The prophets announced the suffering of God’s appointed Messiah without adding necessity.
  reasoning_layer_used: POB lexical and theological decisions for παθεῖν and Χριστός
  rationale: A colon states the prophetic content clearly while retaining the title “Messiah.”
translation_notes:
  risk_flags:
