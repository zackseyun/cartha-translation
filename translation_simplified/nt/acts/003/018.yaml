translation:
  language: en
  text: But this is how God fulfilled what he had announced beforehand through the words of all the prophets:[a] his Messiah would suffer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek more literally says “through the mouth of all the prophets.”
