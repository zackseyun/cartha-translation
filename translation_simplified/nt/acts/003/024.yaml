  preserved_meaning: Samuel begins the successive line of prophets in view.
  reasoning_layer_used: Lexical decisions for ἀπὸ Σαμουὴλ and τῶν καθεξῆς
  rationale: This wording clearly links “after him” to the prophets rather than to when they spoke.
- pob_phrase: as many as spoke
  simplified_phrase: who came after him and spoke
  preserved_meaning: The statement includes all the prophets in that succession who spoke.
  reasoning_layer_used: Lexical decision for ὅσοι ἐλάλησαν
  rationale: The separate verb “spoke” preserves the inclusive phrase without the awkward wording “as many as.”
