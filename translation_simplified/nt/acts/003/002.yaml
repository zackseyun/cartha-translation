translation:
  language: en
  text: A man who had been lame since birth[a] was being carried. Every day, people would place him at the temple gate called Beautiful so he could ask those entering the temple for money or other charitable gifts.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek expression is literally “from his mother’s womb,” meaning from birth.
    reason: simplification_note
  - marker: b
    text: Here “temple” means the whole temple complex, not only the inner sanctuary.
    reason: cultural_note
