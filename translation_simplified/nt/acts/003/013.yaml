translation:
  language: en
  text: The God of Abraham, Isaac, and Jacob is the God of our fathers. He has glorified his servant Jesus.[a] You handed Jesus over and denied him in Pilate’s presence when Pilate had decided to release him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “his child Jesus.” The Greek word can mean either “child” or “servant,” but “servant” likely echoes Isaiah’s language about the Lord’s Servant.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: The God of Abraham and Isaac and Jacob, the God of our fathers
  simplified_phrase: The God of Abraham, Isaac, and Jacob is the God of our fathers.
  preserved_meaning: The same covenant God is identified with both the patriarchs and Israel’s fathers.
  reasoning_layer_used: lexical decision and covenantal formula
  rationale: A complete sentence and standard list punctuation make the opening easier to follow.
- pob_phrase: has glorified his servant Jesus
  simplified_phrase: He has glorified his servant Jesus.
  preserved_meaning: God glorified Jesus, who is identified with the Lord’s Servant.
  reasoning_layer_used: lexical and theological decisions
  rationale: A new sentence clarifies the subject while retaining the key theological terms.
- pob_phrase: whom you handed over and denied before Pilate, when he had decided to release him
  simplified_phrase: You handed Jesus over and denied him in Pilate’s presence when Pilate had decided to release him.
  preserved_meaning: The hearers surrendered and denied Jesus although Pilate’s decision concerned releasing him.
  reasoning_layer_used: lexical decisions and clause-level syntax
  rationale: Repeated names remove unclear pronouns, and “in Pilate’s presence” explains the setting.
translation_notes:
  risk_flags:
  - risk: “Our fathers” may sound less immediate than “our ancestors.”
