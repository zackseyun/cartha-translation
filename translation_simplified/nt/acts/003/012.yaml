translation:
  language: en
  text: But when Peter saw the crowd’s reaction, he said to the people, “Men of Israel, why does this amaze you? Why are you staring at us as if we had made this man walk by our own power or religious devotion?”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: he answered the people
  simplified_phrase: he said to the people
  preserved_meaning: Peter responds publicly to the crowd’s reaction.
  reasoning_layer_used: POB lexical decision for ἀπεκρίνατο πρὸς τὸν λαόν
  rationale: The common verb “said” reads naturally because the surrounding clause already shows that Peter is responding.
- pob_phrase: why do you marvel at this
  simplified_phrase: why does this amaze you
  preserved_meaning: Peter questions the crowd’s amazement at the healing.
  reasoning_layer_used: POB lexical decision for θαυμάζετε
  rationale: “Amaze” expresses the same wonder in more familiar modern English.
- pob_phrase: by our own power or godliness
  simplified_phrase: by our own power or religious devotion
  preserved_meaning: Peter denies that either personal ability or spiritual quality caused the healing.
  reasoning_layer_used: POB lexical and theological decisions for ἰδίᾳ δυνάμει and εὐσεβείᾳ
  rationale: “Religious devotion” makes the religious sense of “godliness” immediately clear without introducing a doctrine of merit.
