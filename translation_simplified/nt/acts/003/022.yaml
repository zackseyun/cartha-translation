translation:
  language: en
  text: Moses said, “The Lord God will raise up for you a prophet from among your brothers, like me.[a] You must listen to and obey him in everything he says to you.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “from among your fellow Israelites.” Here “brothers” refers to the people of Israel as covenant relatives.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Moses indeed said
  simplified_phrase: Moses said
  preserved_meaning: Moses introduces the prophetic quotation.
  reasoning_layer_used: Lexical decision for μὲν
  rationale: Leaving the discourse particle implicit avoids both formal wording and an unsupported reflexive emphasis.
- pob_phrase: You shall listen to him
  simplified_phrase: You must listen to and obey him
  preserved_meaning: The prophet’s hearers are required to heed him obediently.
  reasoning_layer_used: Lexical decision for αὐτοῦ ἀκούσεσθε
  rationale: “Must” and “obey” make the covenantal command clear to modern readers.
- pob_phrase: in everything he says to you
  simplified_phrase: in everything he says to you
  preserved_meaning: The requirement applies comprehensively to whatever the prophet says.
  reasoning_layer_used: Lexical decision for κατὰ πάντα ὅσα ἂν λαλήσῃ πρὸς ὑμᾶς
  rationale: Retaining the broad clause avoids narrowing the prophet’s words to direct instructions.
interpretive_expansions:
- pob_phrase: listen to him
  rendering: listen to and obey him
  claim: Listening here includes obediently heeding the prophet.
  evidence:
  - The POB lexical rationale distinguishes obedient heed from mere hearing.
  - The future form has imperatival and covenantal force in the quotation.
  confidence: high
  alternatives_preserved:
  - listen to him
translation_notes:
  risk_flags:
