translation:
  language: en
  text: Because of faith in his name,[a] his name itself[b] has made this man strong—the man you see and know. The faith that is through him has given this man complete health, right in front of all of you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “trust in his name.”
    reason: lexical_alternative
  - marker: b
    text: “His name” refers to Jesus himself and his authority.
    reason: simplification_note
simplification_decisions:
- pob_phrase: on the basis of faith in his name
  simplified_phrase: Because of faith in his name
  preserved_meaning: Faith in Jesus’ name is presented as the basis of the healing.
  reasoning_layer_used: Lexical decision for ἐπὶ with the dative
  rationale: “Because of” states the causal sense in more familiar English.
- pob_phrase: this man whom you see and know
  simplified_phrase: this man strong—the man you see and know
  preserved_meaning: The hearers can directly see and recognize the healed man.
  reasoning_layer_used: Lexical decision for θεωρεῖτε καὶ οἴδατε
  rationale: A dash separates the identifying phrase and makes the sentence easier to follow.
- pob_phrase: this wholeness in the presence of all of you
  simplified_phrase: complete health, right in front of all of you
  preserved_meaning: The man received full physical restoration publicly and undeniably.
  reasoning_layer_used: Lexical decisions for ὁλοκληρίαν and ἀπέναντι πάντων ὑμῶν
  rationale: The wording replaces abstract expressions with clear language about full health and a public event.
translation_notes:
  risk_flags:
  - risk: “The faith that is through him” remains less idiomatic because the Greek does not specify exactly how faith is through Jesus.
    mitigation: The wording preserves the documented ambiguity rather than choosing whose faith it was or saying Jesus generated it.
  - risk: Modern readers may hear “his name” as a verbal formula.
    mitigation: A footnote explains that the phrase refers to Jesus himself and his authority.
