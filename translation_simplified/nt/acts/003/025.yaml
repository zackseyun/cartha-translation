translation:
  language: en
  text: You are the sons[a] who inherit the promises of the prophets and share in the covenant God made with your ancestors. God said to Abraham, “In your offspring[b] all the families of the earth will be blessed.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Greek “sons”; here the word refers to those who inherit the prophets’ promises and share in the covenant.
    reason: lexical_alternative
  - marker: b
    text: Or “seed”; “offspring” can refer collectively to Abraham’s descendants while also allowing a singular representative sense.
    reason: alternative_reading
