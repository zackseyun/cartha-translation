simplification_decisions:
- pob_phrase: every person who does not listen
  simplified_phrase: anyone who does not listen
  preserved_meaning: The warning applies to every individual who fails to heed the prophet.
  reasoning_layer_used: POB lexical decision for πᾶσα ψυχὴ and the indefinite relative clause
  rationale: “Anyone” expresses the same universal warning in more natural English.
- pob_phrase: will be utterly destroyed from among the people
  simplified_phrase: will be completely destroyed—removed from among the people
  preserved_meaning: The judgment is severe and removes the person from within the covenant people.
  reasoning_layer_used: POB lexical and theological decisions for ἐξολεθρευθήσεται ἐκ τοῦ λαοῦ
  rationale: The dash makes the destruction-and-removal relationship easier to grasp without defining the judgment’s mode or timing.
translation_notes:
  risk_flags:
  - risk: “Removed” alone could sound like mere exclusion.
    mitigation: “Completely destroyed” remains the controlling wording, while the footnote preserves “cut off.”
