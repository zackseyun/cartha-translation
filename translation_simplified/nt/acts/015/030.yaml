translation:
  language: en
  text: So they were sent off and went down to Antioch.[a] They gathered the group and delivered the letter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Went down” reflects the journey from Jerusalem’s higher elevation to Antioch.
    reason: cultural_note
simplification_decisions:
- pob_phrase: after being sent off, they went down to Antioch
  simplified_phrase: they were sent off and went down to Antioch
  preserved_meaning: They formally departed for Antioch with authorization from the Jerusalem gathering.
  reasoning_layer_used: Lexical decision for ἀπολυθέντες and κατῆλθον
  rationale: The finite verbs make the sequence easier to follow while retaining “sent off” and the downward direction.
- pob_phrase: after gathering the multitude
  simplified_phrase: They gathered the group
  preserved_meaning: They brought together the gathered body in Antioch without defining it as a formal congregation.
  reasoning_layer_used: Lexical decisions for συναγαγόντες and τὸ πλῆθος
  rationale: “The group” is natural modern English and preserves the referent’s documented breadth.
- pob_phrase: they delivered the letter
  simplified_phrase: delivered the letter
  preserved_meaning: They formally presented the letter to the gathered group.
  reasoning_layer_used: Lexical decisions for ἐπέδωκαν and ἐπιστολήν
  rationale: The clear modern wording already preserves both the official action and the ordinary term “letter.”
translation_notes:
  risk_flags:
  - risk: “The group” may sound less numerous than “the multitude.”
    mitigation: The wording preserves the gathered body without narrowing it to a formal assembly or congregation.
