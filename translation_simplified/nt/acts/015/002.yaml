translation:
  language: en
  text: A serious disagreement and debate arose between Paul and Barnabas and the men from Judea. So the community appointed Paul, Barnabas, and some others from among its members to travel up to Jerusalem and meet with the apostles and elders about this issue.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: after no small dissension and debate had arisen
  simplified_phrase: A serious disagreement and debate arose
  preserved_meaning: The conflict was serious and included active verbal debate.
  reasoning_layer_used: Lexical decisions for στάσεως, ζητήσεως, and οὐκ ὀλίγης
  rationale: “Serious” directly expresses the emphasis of the Greek litotes in modern English.
- pob_phrase: they appointed Paul and Barnabas and some others from among them
  simplified_phrase: the community appointed Paul, Barnabas, and some others from among its members
  preserved_meaning: The local community formally selected an unspecified number of additional delegates.
  reasoning_layer_used: Lexical and theological decisions for ἔταξαν and τινας ἄλλους ἐξ αὐτῶν
  rationale: The wording identifies the implied group without adding a specific form of church government or number of delegates.
- pob_phrase: to go up to the apostles and elders in Jerusalem about this issue
  simplified_phrase: to travel up to Jerusalem and meet with the apostles and elders about this issue
  preserved_meaning: The delegates went to Jerusalem to address the disputed issue with the apostles and elders.
  reasoning_layer_used: Lexical decisions for ἀναβαίνειν and περὶ τοῦ ζητήματος τούτου
  rationale: The clause clarifies the journey and its purpose while preserving travel “up” to Jerusalem.
