translation:
  language: en
  text: The apostles and elders, together with the whole church, decided it would be good to choose men from their own group and send them to Antioch with Paul and Barnabas. They chose Judas, also called Barsabbas, and Silas. Both were leaders among the brothers.[a]
  philosophy: optimal-equivalence
