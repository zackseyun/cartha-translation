simplification_decisions:
- pob_phrase: some went out from us
  simplified_phrase: some people went out from our group
  preserved_meaning: These people belonged to and departed from the Jerusalem group.
  reasoning_layer_used: lexical decisions for τινὲς ἐξ ἡμῶν and ἐξελθόντες
  rationale: “Our group” makes their relationship to the speakers clear in ordinary English.
- pob_phrase: troubled you with words, unsettling your souls
  simplified_phrase: disturbed you by what they said, throwing you into confusion
  preserved_meaning: Their speech both caused distress and disrupted the hearers inwardly.
  reasoning_layer_used: lexical decisions for λόγοις, ἐτάραξαν, and ἀνασκευάζοντες τὰς ψυχὰς ὑμῶν
  rationale: The two phrases preserve the distinct effects of distress and inner confusion.
- pob_phrase: to whom we gave no instructions
  simplified_phrase: without instructions from us
  preserved_meaning: The Jerusalem leaders had not directed or authorized these people.
  reasoning_layer_used: theological decision on apostolic authorization
  rationale: Placing the denial beside their departure removes the unclear relative clause.
