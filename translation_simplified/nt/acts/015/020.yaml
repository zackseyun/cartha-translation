translation:
  language: en
  text: Instead, we should write to them and tell them to avoid anything made unclean through its connection with idols,[a] sexual immorality,[b] meat from animals that were strangled,[c] and blood.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This refers broadly to defilement connected with idols, not only to food sacrificed to them.
    reason: lexical_alternative
  - marker: b
    text: The Greek may refer broadly to sexual immorality or more specifically to prohibited sexual unions.
    reason: alternative_reading
  - marker: c
    text: Strangled animals had not been properly drained of blood.
    reason: cultural_note
