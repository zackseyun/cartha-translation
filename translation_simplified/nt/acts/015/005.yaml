translation:
  language: en
  text: But some from the party of the Pharisees who had come to believe stood up and said, “The Gentile believers must be circumcised, and they must be commanded to keep the law of Moses.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Party” may also be translated “sect.” Here it means a recognized Jewish group, not “heresy.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: some of those from the party of the Pharisees who had believed
  simplified_phrase: some from the party of the Pharisees who had come to believe
  preserved_meaning: The speakers belonged to the Pharisaic party and had previously believed.
  reasoning_layer_used: Lexical and theological decisions on αἵρεσις and πεπιστευκότες
  rationale: The shorter wording preserves both their group identity and the tension that they had believed.
- pob_phrase: saying that it is necessary to circumcise them
  simplified_phrase: said, “The Gentile believers must be circumcised”
  preserved_meaning: The speakers claimed that circumcision was necessary for the people under discussion.
  reasoning_layer_used: Immediate context and lexical decisions on δεῖ and περιτέμνειν αὐτούς
  rationale: Direct speech and the named contextual referent make the demand immediately clear.
- pob_phrase: and to command them to keep the law of Moses
  simplified_phrase: and they must be commanded to keep the law of Moses
  preserved_meaning: The speakers also demanded an authoritative command to observe Moses’ law.
  reasoning_layer_used: Lexical decisions on παραγγέλλειν, τηρεῖν, and τὸν νόμον Μωϋσέως
  rationale: The passive wording clearly distinguishes the command from the required law-keeping.
interpretive_expansions:
- pob_phrase: them
  rendering: The Gentile believers
  claim: The people whom the Pharisaic speakers wanted circumcised were the Gentile believers being discussed.
  evidence:
  - Acts 15:1 identifies circumcision of Gentile believers as the dispute.
  - Acts 15:3–4 immediately describes the conversion of the Gentiles.
  confidence: high
  alternatives_preserved:
  - them
translation_notes:
  risk_flags:
  - risk: Naming the Gentile believers makes an implicit pronoun explicit.
    mitigation: The immediate context securely identifies the referent without resolving any disputed doctrine.
