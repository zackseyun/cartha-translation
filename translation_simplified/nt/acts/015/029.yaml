translation:
  language: en
  text: Stay away from food sacrificed to idols, from blood, from meat from strangled animals, and from sexual immorality.[a] If you avoid these things, you will do well. Farewell.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek term can refer broadly to sexual immorality, though some understand it here more specifically in light of the prohibitions in Leviticus.
    reason: alternative_reading
  - marker: b
    text: Or “Stay well.” This was a customary way to close a letter.
    reason: lexical_alternative
