translation:
  language: en
  text: so that the remnant of humanity may seek the Lord—even all the Gentiles[a] who are called by my name, says the Lord, who does these things.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “all the nations.” Here “Gentiles” means people who are not Jews, the issue being discussed by the Jerusalem Council.
    reason: alternative_reading
  - marker: b
    text: This echoes Amos 9:12 as reflected in the Greek Scriptures, emphasizing Gentiles who bear the Lord’s name.
    reason: cross_reference
simplification_decisions:
- pob_phrase: the remnant of mankind
  simplified_phrase: the remnant of humanity
  preserved_meaning: A remaining group from humanity is in view, with the prophetic remnant image retained.
  reasoning_layer_used: lexical decision for οἱ κατάλοιποι τῶν ἀνθρώπων
  rationale: “Humanity” makes the generic reference clear without losing “remnant.”
- pob_phrase: on whom my name has been called
  simplified_phrase: who are called by my name
  preserved_meaning: These Gentiles belong to and are identified with the Lord.
  reasoning_layer_used: lexical rationale for the divine-name idiom
  rationale: The idiom is recast in natural English while preserving its covenantal sense.
- pob_phrase: even all the Gentiles
  simplified_phrase: —even all the Gentiles
  preserved_meaning: The Gentiles are included in the people who may seek the Lord.
  reasoning_layer_used: theological decision on ἔθνη in Acts 15
  rationale: The dash makes the explanatory connection easier to follow without weakening “all.”
translation_notes:
  risk_flags:
  - risk: “Called by my name” may be heard only as a label rather than as belonging to the Lord.
    mitigation: The wording follows POB’s approved idiomatic alternative and the cross-reference note mentions bearing the Lord’s name.
