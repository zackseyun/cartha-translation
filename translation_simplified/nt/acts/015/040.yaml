translation:
  language: en
  text: But Paul chose Silas and set out after the brothers[a] entrusted Paul to the grace of the Lord.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Brothers” may include the whole community of believers, including women.
    reason: cultural_note
  - marker: b
    text: Or “commended Paul to the grace of the Lord.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: departed
  simplified_phrase: set out
  preserved_meaning: Paul began his journey with Silas.
  reasoning_layer_used: Lexical decision for ἐξῆλθεν in a travel narrative.
  rationale: “Set out” is more natural modern English for beginning a journey.
- pob_phrase: having been commended by the brothers
  simplified_phrase: after the brothers entrusted Paul
  preserved_meaning: The believing community placed Paul in the Lord’s care before he left.
  reasoning_layer_used: Lexical decision for παραδοθεὶς and its stated alternatives.
  rationale: The active clause makes the sequence and participants immediately clear.
- pob_phrase: to the grace of the Lord
  simplified_phrase: to the grace of the Lord
  preserved_meaning: Paul was placed under the Lord’s gracious favor and care.
  reasoning_layer_used: Lexical and theological decisions for χάρις and κύριος.
  rationale: The wording stays unchanged because “grace” and “Lord” preserve key theological meaning and ambiguity.
translation_notes:
  risk_flags:
  - risk: “Entrusted” may sound like the Lord’s grace was given a task rather than Paul being placed in divine care.
    mitigation: The lexical footnote preserves “commended,” while the retained phrase “to the grace of the Lord” keeps the established idiom.
