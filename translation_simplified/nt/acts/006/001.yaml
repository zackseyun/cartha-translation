translation:
  language: en
  text: In those days, the number of disciples kept growing. The Hellenists[a] brought a complaint against the Hebrews because widows from the Hellenist community were being overlooked in the daily aid distribution.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hellenists were likely Greek-speaking Jews, while the Hebrews were likely Aramaic- or Hebrew-speaking Jews.
    reason: cultural_note
simplification_decisions:
- pob_phrase: as the disciples were increasing in number
  simplified_phrase: the number of disciples kept growing
  preserved_meaning: The community of disciples was continuing to grow numerically.
  reasoning_layer_used: lexical decision for πληθυνόντων and its background circumstance
  rationale: The shorter clause uses ordinary English while preserving ongoing numerical growth.
- pob_phrase: a complaint arose from the Hellenists against the Hebrews
  simplified_phrase: The Hellenists brought a complaint against the Hebrews
  preserved_meaning: The Hellenists voiced a grievance directed against the Hebrews.
  reasoning_layer_used: lexical and theological decisions for γογγυσμός, Ἑλληνισταί, and Ἑβραῖοι
  rationale: The active wording is easier to follow while retaining both historical group labels and the conflict.
- pob_phrase: their widows were being overlooked
  simplified_phrase: widows from the Hellenist community were being overlooked
  preserved_meaning: The affected widows belonged to the Hellenist group, and the overlooking was ongoing without asserting intent.
  reasoning_layer_used: lexical decision for αἱ χῆραι αὐτῶν and imperfect passive παρεθεωροῦντο
  rationale: Naming the group removes an unclear pronoun without strengthening the charge to deliberate mistreatment.
