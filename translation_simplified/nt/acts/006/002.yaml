translation:
  language: en
  text: So the Twelve called all the disciples[a] together and said, “It is not right for us to leave the work of proclaiming God’s word in order to serve at the tables where food and other resources are distributed.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the large gathering of the disciples.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the whole group of the disciples
  simplified_phrase: all the disciples
  preserved_meaning: The Twelve convened the entire disciple community.
  reasoning_layer_used: POB lexical decision on τὸ πλῆθος τῶν μαθητῶν
  rationale: The shorter wording expresses the POB’s collective sense in ordinary English.
- pob_phrase: abandon the word of God
  simplified_phrase: leave the work of proclaiming God’s word
  preserved_meaning: The apostles must not set aside their responsibility for God’s message.
  reasoning_layer_used: POB lexical and theological decisions on καταλείπω and λόγος τοῦ θεοῦ
  rationale: The rewrite makes the apostolic task clear while retaining the serious force of leaving it.
- pob_phrase: serve tables
  simplified_phrase: serve at the tables where food and other resources are distributed
  preserved_meaning: The phrase refers to practical service connected with the community’s shared provisions.
  reasoning_layer_used: POB cultural note and lexical decision on τραπέζαις
  rationale: The concrete table image remains while its unfamiliar community function is explained.
interpretive_expansions:
- pob_phrase: the word of God
  rendering: the work of proclaiming God’s word
  claim: The phrase here concerns the apostles’ work of communicating God’s message.
  evidence:
  - The POB lexical rationale identifies preaching and teaching as the likely sense in Acts.
  - The immediate contrast is between apostolic responsibility and practical distribution.
  confidence: high
  alternatives_preserved:
  - God’s word remains explicit rather than being replaced by “message.”
- pob_phrase: serve tables
  rendering: serve at the tables where food and other resources are distributed
  claim: Serving tables includes handling the community’s practical distribution.
  evidence:
  - The POB cultural note explicitly identifies meals and community resources.
  - The surrounding complaint concerns the daily distribution.
  confidence: high
  alternatives_preserved:
  - The wording does not specify whether the service involved only food or also funds.
translation_notes:
  risk_flags:
  - risk: “Proclaiming” makes the function of “the word of God” more explicit than the Greek phrase alone.
    mitigation: The wording retains “God’s word,” and the POB rationale supports the preaching and teaching sense.
  - risk: Explaining the tables may sound as though practical service has less value.
    mitigation: The verse presents a difference in responsibility, and the wording makes no judgment about dignity.
