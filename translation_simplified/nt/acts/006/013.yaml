  rationale: The split sentences make the legal action easier to follow without intensifying it.
- pob_phrase: does not stop speaking
  simplified_phrase: keeps speaking
  preserved_meaning: The witnesses accuse him of continually speaking this way.
  reasoning_layer_used: POB lexical decision for οὐ παύεται
  rationale: “Keeps speaking” expresses the same ongoing action in more natural English.
- pob_phrase: against this holy place and the law
  simplified_phrase: against this holy place—the temple—and against the law
  preserved_meaning: The accusation is directed against both the Jerusalem temple and the law.
  reasoning_layer_used: POB theological decision on the holy place and the law
  rationale: Naming the temple clarifies the setting, while repeating “against” keeps both targets distinct.
