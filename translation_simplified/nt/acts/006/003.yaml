    mitigation: The footnote preserves the masculine Greek form while noting the possible wider audience.
  - risk: Readers may not know whether “the Spirit” means the Holy Spirit.
    mitigation: Capitalization follows the POB decision, and the footnote preserves the explicit alternative.
