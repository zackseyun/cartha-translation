translation:
  language: en
  text: But brothers[a], choose seven men from among you who are well spoken of and full of the Spirit and wisdom.[b] We will put them in charge of this work.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word is masculine, though the address may include the wider community of believers.
    reason: cultural_note
  - marker: b
    text: Or “full of the Holy Spirit and wisdom”; the Greek says “the Spirit and wisdom.”
    reason: alternative_reading
  - marker: c
    text: “This work” means overseeing the daily distribution mentioned in the surrounding passage.
    reason: cross_reference
simplification_decisions:
- pob_phrase: select from among yourselves
  simplified_phrase: choose seven men from among you
  preserved_meaning: The community must choose the men from within its own membership.
  reasoning_layer_used: lexical decision for ἐπισκέψασθε and ἐξ ὑμῶν
  rationale: “Choose” and “from among you” express the same communal selection in more familiar English.
- pob_phrase: men who are well attested
  simplified_phrase: men ... who are well spoken of
  preserved_meaning: Others must give favorable testimony about the men.
  reasoning_layer_used: lexical decision for μαρτυρουμένους
  rationale: “Well spoken of” makes the testimonial sense immediately clear.
- pob_phrase: whom we will appoint over this duty
  simplified_phrase: We will put them in charge of this work
  preserved_meaning: The apostles will formally assign the selected men responsibility for the task.
  reasoning_layer_used: lexical decisions for καταστήσομεν and ἐπὶ τῆς χρείας ταύτης
  rationale: A new sentence and common wording clarify both appointment and entrusted responsibility.
translation_notes:
  risk_flags:
