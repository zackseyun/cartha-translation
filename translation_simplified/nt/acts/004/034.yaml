  reasoning_layer_used: Lexical decisions for ὅσοι, κτήτορες, χωρίων, οἰκιῶν, and ὑπῆρχον
  rationale: A direct relative clause is clearer than the formal phrase “as many as were owners.”
- pob_phrase: were selling them and bringing the proceeds of what was sold
  simplified_phrase: were selling them and bringing the money from the sales
  preserved_meaning: The owners repeatedly sold property and brought the money received from those sales.
