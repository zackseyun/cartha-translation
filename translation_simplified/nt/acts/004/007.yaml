simplification_decisions:
- pob_phrase: after setting them in the midst
  simplified_phrase: made them stand in the middle
  preserved_meaning: The leaders placed Peter and John at the center before questioning them.
  reasoning_layer_used: Lexical decision for στήσαντες and ἐν τῷ μέσῳ
  rationale: The new wording expresses the physical action and setting in ordinary English.
- pob_phrase: they began asking
  simplified_phrase: began questioning them
  preserved_meaning: The leaders started an inquiry directed at Peter and John.
  reasoning_layer_used: Lexical decision for ἐπυνθάνοντο
  rationale: “Questioning” fits an official interrogation while retaining the likely inceptive force.
- pob_phrase: in what name
  simplified_phrase: in whose name
  preserved_meaning: They ask whose name and representative authority stood behind the act.
  reasoning_layer_used: Lexical and theological decisions for ἐν ποίῳ ὀνόματι
  rationale: “Whose name” makes the biblical idiom natural without merging it with the distinct question about power.
translation_notes:
  risk_flags:
  - risk: “Began questioning” selects the inceptive nuance of the Greek imperfect.
    mitigation: This follows the POB choice, though ongoing inquiry remains grammatically possible.
  - risk: The word “this” does not explicitly identify the healing.
    mitigation: It preserves the source wording and leaves the immediate context to supply the referent.
