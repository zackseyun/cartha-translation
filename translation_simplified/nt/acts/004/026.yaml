simplification_decisions:
- pob_phrase: the rulers were gathered together
  simplified_phrase: the rulers came together
  preserved_meaning: The rulers assembled in coordinated opposition.
  reasoning_layer_used: Lexical decision for συνήχθησαν and ἐπὶ τὸ αὐτό
  rationale: The active English wording is easier to read while retaining their united action.
- pob_phrase: took their stand
  simplified_phrase: took their stand
  preserved_meaning: The kings deliberately positioned themselves in opposition.
  reasoning_layer_used: Lexical decision for παρέστησαν and Psalm 2:2 echo
  rationale: This clear image was retained because “stood” would weaken the deliberate hostility.
- pob_phrase: his Messiah
  simplified_phrase: his Messiah
  preserved_meaning: The rulers oppose the Lord’s appointed messianic king.
  reasoning_layer_used: Theological decision for Χριστός in the Psalm 2 citation
  rationale: “Messiah” preserves the controlling Old Testament title, with “Christ” noted as an alternative.
translation_notes:
  risk_flags:
  - risk: Changing the passive “were gathered” to “came together” may reduce the formal echo of Psalm 2.
    mitigation: The wording still preserves the rulers’ collective and coordinated opposition.
