simplification_decisions:
- pob_phrase: And seeing
  simplified_phrase: When they saw
  preserved_meaning: Seeing the healed man was the circumstance that left them unable to answer.
  reasoning_layer_used: The lexical decision treats the participle as contemporaneous with the main verb and allows a time clause.
  rationale: A time clause is clearer in ordinary English, while omitting “And” avoids implying a stronger contrast.
- pob_phrase: standing with them
  simplified_phrase: standing there with Peter and John
  preserved_meaning: The healed man was visibly present alongside the two apostles.
  reasoning_layer_used: The immediate context identifies “them” as Peter and John, and σύν expresses accompaniment.
  rationale: Naming Peter and John removes an unclear pronoun for readers entering the verse directly.
- pob_phrase: they had nothing to say in reply
  simplified_phrase: they had nothing they could say in reply
  preserved_meaning: They lacked any effective response to what Peter and John had said.
  reasoning_layer_used: The lexical rationale says the idiom expresses no basis or ability to respond against the apostles’ claim.
  rationale: Adding “could” expresses the idiom naturally without strengthening it to “contradict.”
