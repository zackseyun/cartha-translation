translation:
  language: en
  text: The large number of people who had believed were united in heart and soul. Not one of them claimed that anything they owned was theirs alone. Instead, they shared everything they had.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: The multitude of those who had believed
  simplified_phrase: The large number of people who had believed
  preserved_meaning: A sizable community had already come to believe.
  reasoning_layer_used: Lexical decision for πλήθους and τῶν πιστευσάντων
  rationale: Common wording preserves both the large number and the believers’ prior response.
- pob_phrase: were of one heart and soul
  simplified_phrase: were united in heart and soul
  preserved_meaning: They shared profound inner unity and purpose.
  reasoning_layer_used: Lexical decision for καρδία καὶ ψυχὴ μία
  rationale: The rewrite explains the idiom while retaining both source-language images.
- pob_phrase: all things were held in common among them
  simplified_phrase: they shared everything they had
  preserved_meaning: Their possessions were available for the community’s shared use.
  reasoning_layer_used: Lexical decision for πάντα κοινά and POB footnote a
  rationale: The active wording uses POB’s approved dynamic alternative and is easier to understand.
interpretive_expansions:
- pob_phrase: was his own
  rendering: was theirs alone
  claim: The verse denies treating possessions as exclusively private, not the mere fact of ownership.
  evidence:
  - The lexical rationale says ἴδιον emphasizes private or exclusive ownership.
  - The theological decision describes voluntary communal sharing without imposing a later economic system.
  confidence: high
  alternatives_preserved:
  - claimed it as their own
  - said it belonged exclusively to them
translation_notes:
  risk_flags:
  - risk: “They shared everything” could be read as mandatory collective ownership.
    mitigation: The preceding sentence frames the practice as refusing exclusive claims, in line with POB’s descriptive reading.
