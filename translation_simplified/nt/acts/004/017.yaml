translation:
  language: en
  text: But to keep this from spreading any further among the people, let us warn them[a] not to speak to anyone in this name from now on.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “threaten them.” The Greek implies intimidation by authorities.
    reason: lexical_alternative
  - marker: b
    text: “In this name” means in connection with and under the authority of Jesus’ name.
    reason: simplification_note
simplification_decisions:
- pob_phrase: But so that it may not spread any further
  simplified_phrase: But to keep this from spreading any further
  preserved_meaning: The council intends to prevent its continued spread.
  reasoning_layer_used: Lexical decision for διανεμηθῇ and ἐπὶ πλεῖον
  rationale: The purpose clause is recast in ordinary English without weakening its comparative force.
- pob_phrase: not to speak any longer to anyone
  simplified_phrase: not to speak to anyone ... from now on
  preserved_meaning: They are forbidden to continue speaking to any person.
  reasoning_layer_used: Lexical decisions for μηκέτι λαλεῖν and μηδενὶ ἀνθρώπων
  rationale: Moving the time phrase to the end makes the prohibition easier to follow.
- pob_phrase: in this name
  simplified_phrase: in this name
  preserved_meaning: The apostles are forbidden to speak in association with and under Jesus’ authority.
  reasoning_layer_used: Lexical decision for ἐπὶ τῷ ὀνόματι τούτῳ
  rationale: The key biblical expression is retained and briefly explained in a note.
translation_notes:
  risk_flags:
