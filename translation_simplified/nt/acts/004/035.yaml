translation:
  language: en
  text: They kept placing them[a] at the apostles’ feet, and they were being distributed to each person according to their need.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Them” refers to the proceeds from the property sales mentioned in the previous verse.
    reason: cross_reference
simplification_decisions:
- pob_phrase: they were laying
  simplified_phrase: They kept placing
  preserved_meaning: The action happened repeatedly or continually.
  reasoning_layer_used: lexical decision for ἐτίθουν
  rationale: “Kept placing” clearly expresses the imperfect verb’s ongoing or repeated action.
- pob_phrase: it was being distributed
  simplified_phrase: they were being distributed
  preserved_meaning: The proceeds were distributed as an ongoing practice.
  reasoning_layer_used: lexical decision for διεδίδετο and the contextual object from verse 34
  rationale: The progressive passive preserves the ongoing action while the plural pronoun connects naturally with “them.”
- pob_phrase: to each one according as anyone had need
  simplified_phrase: to each person according to their need
  preserved_meaning: Each person received an amount corresponding to that person’s need.
  reasoning_layer_used: lexical decisions for ἑκάστῳ and καθότι ἄν τις χρείαν εἶχεν
  rationale: The modern wording preserves both individual distribution and proportion to need.
translation_notes:
  risk_flags:
  - risk: The plural “they” differs from the Greek singular passive verb.
    mitigation: It refers naturally to the collectively understood proceeds and retains the passive, ongoing distribution.
