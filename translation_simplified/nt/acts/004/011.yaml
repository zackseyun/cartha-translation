simplification_decisions:
- pob_phrase: the stone that was rejected by you, the builders
  simplified_phrase: the stone you builders rejected
  preserved_meaning: The leaders are directly accused of rejecting Jesus, pictured as a stone.
  reasoning_layer_used: Lexical decisions for ἐξουθενηθεὶς, ὑφ’ ὑμῶν, and οἰκοδόμων
  rationale: The active wording is easier to follow while preserving the accusation and building image.
- pob_phrase: which has become the cornerstone
  simplified_phrase: It has become the cornerstone.
  preserved_meaning: The rejected stone now holds the honored and decisive place in the building image.
  reasoning_layer_used: Lexical and theological decisions for γενόμενος and κεφαλὴν γωνίας
  rationale: A new sentence removes the dense relative-clause structure without weakening the result.
