translation:
  language: en
  text: Through the Holy Spirit, you spoke in the words of your servant David:[a] “Why did the nations rage? Why did the peoples make useless plots?[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some manuscripts say “our father David, your servant.”
    reason: textual_variant
  - marker: b
    text: The Greek can also mean “meditate on useless things,” but here it refers to hostile plotting.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: who, through the Holy Spirit, by the mouth of David your servant, said
  simplified_phrase: Through the Holy Spirit, you spoke in the words of your servant David
  preserved_meaning: God spoke by the Holy Spirit through David, his servant.
  reasoning_layer_used: POB lexical and theological decisions on prophetic agency and the citation formula
  rationale: Direct address and ordinary clause order make the twofold agency easier to follow.
- pob_phrase: the peoples devise vain things
  simplified_phrase: the peoples make useless plots
  preserved_meaning: The peoples form hostile plans that are empty and ineffective.
  reasoning_layer_used: POB lexical decisions for ἐμελέτησαν and κενά
  rationale: “Useless plots” expresses both hostile planning and futility in common English.
