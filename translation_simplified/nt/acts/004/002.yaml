  rationale: “These men” makes the change of subject easier to follow without naming the speakers.
- pob_phrase: proclaiming in Jesus the resurrection from the dead
  simplified_phrase: proclaiming the resurrection from the dead in connection with Jesus
  preserved_meaning: The proclaimed resurrection is centered in or manifested in Jesus without limiting it to one nuance.
