translation:
  language: en
  text: They brought them before the city officials[a] and said, “These men are causing serious trouble in our city—and they are Jews.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: These were the Roman civic officials who governed Philippi.
    reason: cultural_note
  - marker: b
    text: The Greek term can also mean “Judeans,” but here “Jews” best fits the ethnic and religious accusation.
    reason: lexical_alternative
