  preserved_meaning: The accusers charge the men with seriously agitating the city.
  reasoning_layer_used: Lexical decision for ἐκταράσσουσιν
  rationale: The clearer phrase preserves the verb’s strong force and present accusation.
- pob_phrase: being Jews
  simplified_phrase: —and they are Jews
  preserved_meaning: Their Jewish identity is presented as part of the hostile charge.
  reasoning_layer_used: Lexical and theological decisions for Ἰουδαῖοι and ὑπάρχοντες
