translation:
  language: en
  text: The jailer woke up and saw that the prison doors were open. Thinking the prisoners had escaped, he pulled out his sword[a] and was about to kill himself.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word can refer to a sword or a shorter bladed weapon such as a dagger.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: saw the prison doors standing open
  simplified_phrase: saw that the prison doors were open
  preserved_meaning: The doors remained in an opened state when the jailer saw them.
  reasoning_layer_used: POB lexical decision on ἀνεῳγμένας
  rationale: The simpler clause preserves the resulting open state without suggesting who opened the doors.
- pob_phrase: he drew his sword
  simplified_phrase: he pulled out his sword
  preserved_meaning: The jailer removed his weapon for immediate use.
  reasoning_layer_used: POB lexical decision on σπασάμενος τὴν μάχαιραν
  rationale: “Pulled out” is clearer common English, while the footnote preserves the weapon's lexical range.
- pob_phrase: supposing that the prisoners had escaped
  simplified_phrase: Thinking the prisoners had escaped
  preserved_meaning: His mistaken inference about a completed escape explains his intended action.
  reasoning_layer_used: POB lexical decisions on νομίζων and ἐκπεφευγέναι
  rationale: “Thinking” is more familiar than “supposing” and still avoids presenting the escape as fact.
