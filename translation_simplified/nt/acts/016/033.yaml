translation:
  language: en
  text: That same hour of the night, he took them and washed their wounds. At once, he and everyone in his household[a] were baptized.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “everyone in his family”; “household” can include all those in his domestic circle.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And taking them in that hour of the night
  simplified_phrase: That same hour of the night, he took them
  preserved_meaning: He acted late at night without delay and took them before washing their wounds.
  reasoning_layer_used: Lexical decision for παραλαβών and the temporal phrase
  rationale: A direct clause and “that same hour” make the sequence and immediacy easier to follow.
- pob_phrase: he washed their wounds
  simplified_phrase: he took them and washed their wounds
  preserved_meaning: He cared for the injuries Paul and Silas had suffered.
  reasoning_layer_used: Lexical decisions for ἔλουσεν and ἀπὸ τῶν πληγῶν
  rationale: The wording remains concrete and avoids the opaque literal phrase “washed them from the wounds.”
- pob_phrase: he was baptized at once, he and all his household
  simplified_phrase: At once, he and everyone in his household were baptized
  preserved_meaning: The jailer and all those in his domestic sphere received baptism immediately.
  reasoning_layer_used: Lexical and theological decisions for ἐβαπτίσθη, οἱ αὐτοῦ πάντες, and παραχρῆμα
  rationale: The reordered sentence is natural English while preserving immediacy and the full household scope.
translation_notes:
  risk_flags:
  - risk: “Household” may be read as settling questions about the members’ ages or the mode of baptism.
    mitigation: The text states only the verse’s scope and action, while the footnote explains the term without adding a doctrinal conclusion.
