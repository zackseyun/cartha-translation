  text: That night Paul had a vision. In it, a Macedonian man stood and urged him, “Come over into Macedonia and help us.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And a vision appeared to Paul in the night
  simplified_phrase: That night Paul had a vision.
  preserved_meaning: Paul experienced a vision at night without specifying whether it was a dream, inner impression, or apparition.
  reasoning_layer_used: POB lexical and theological decisions on ὅραμα, διὰ νυκτός, and ὤφθη
  rationale: The active wording is easier to read while preserving the revelatory event and its timing.
- pob_phrase: a certain Macedonian man was standing and urging him
  simplified_phrase: In it, a Macedonian man stood and urged him
  preserved_meaning: The vision showed an indefinite male Macedonian standing and making an earnest appeal.
  reasoning_layer_used: POB lexical decisions on ἀνὴρ Μακεδών τις, ἑστώς, and παρακαλῶν
  rationale: Two direct verbs replace the dense participial structure without weakening the man's posture or appeal.
- pob_phrase: saying, “Come over into Macedonia and help us.”
  simplified_phrase: “Come over into Macedonia and help us.”
  preserved_meaning: The man directly asked Paul to enter Macedonia and provide help.
  reasoning_layer_used: POB lexical decisions on λέγων, Διαβάς, εἰς Μακεδονίαν, and βοήθησον ἡμῖν
  rationale: Direct speech makes “saying” unnecessary, while “come over” retains the Greek idiom's movement.
