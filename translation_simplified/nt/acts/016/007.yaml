translation:
  language: en
  text: But when they came near Mysia[a], they tried to enter Bithynia. But the Spirit of Jesus did not allow them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may mean that they came to the border region of Mysia or traveled alongside it.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: when they came to Mysia
  simplified_phrase: when they came near Mysia
  preserved_meaning: They approached Mysia without necessarily entering the region.
  reasoning_layer_used: POB lexical decision and footnote on κατὰ τὴν Μυσίαν
  rationale: “Near Mysia” avoids implying full entry while the footnote preserves the geographical alternatives.
- pob_phrase: they were trying to go into Bithynia
  simplified_phrase: they tried to enter Bithynia
  preserved_meaning: They attempted to travel into Bithynia.
  reasoning_layer_used: POB lexical decisions for ἐπείραζον and εἰς τὴν Βιθυνίαν πορευθῆναι
  rationale: “Tried to enter” expresses the attempted movement in direct, common English.
- pob_phrase: and the Spirit of Jesus did not permit them
  simplified_phrase: But the Spirit of Jesus did not allow them
  preserved_meaning: Jesus’ Spirit prevented their intended journey without implying a stronger prohibition.
  reasoning_layer_used: POB narrative, lexical, and theological decisions
  rationale: A new contrastive sentence highlights the reversal while preserving the distinctive title and the verb’s force.
translation_notes:
  risk_flags:
