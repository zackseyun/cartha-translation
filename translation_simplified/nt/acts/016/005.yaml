  preserved_meaning: The churches were continually strengthened in the Christian faith they shared.
  reasoning_layer_used: Lexical decision for ἐστερεοῦντο and theological decision for τῇ πίστει
  rationale: “Were being made stronger” uses common wording while preserving the ongoing passive action.
- pob_phrase: were increasing in number day by day
  simplified_phrase: were growing in number every day
