translation:
  language: en
  text: After he saw the vision, we immediately tried to leave for Macedonia. We had concluded that God had called us to tell them the good news.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And when he had seen the vision
  simplified_phrase: After he saw the vision
  preserved_meaning: The vision came before the group responded.
  reasoning_layer_used: Lexical decision for εἶδεν and narrative sequence
  rationale: “After” makes the sequence clear without the heavier past perfect.
- pob_phrase: we immediately sought to go on into Macedonia
  simplified_phrase: we immediately tried to leave for Macedonia
  preserved_meaning: The group promptly endeavored to depart for Macedonia without implying that they succeeded yet.
  reasoning_layer_used: Lexical decisions for ἐζητήσαμεν and ἐξελθεῖν εἰς Μακεδονίαν
  rationale: “Tried to leave” preserves the broader sense of endeavoring rather than narrowing it to preparation.
- pob_phrase: to proclaim the good news to them
  simplified_phrase: to tell them the good news
  preserved_meaning: God called the group to communicate the good news to the people there.
  reasoning_layer_used: Lexical decision for εὐαγγελίσασθαι and theological decision on divine calling
  rationale: “Tell them the good news” states the missionary task in common English.
translation_notes:
  risk_flags:
  - risk: “Tried” may suggest a failed attempt in some contexts.
    mitigation: The following sentence explains their settled conclusion while leaving the outcome of departure unstated.
