translation:
  language: en
  text: They traveled through the region of Phrygia and Galatia.[b] The Holy Spirit forbade them to speak the message in Asia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “Asia” means the Roman province in western Asia Minor, not the modern continent.
    reason: cultural_note
  - marker: b
    text: The Greek may also mean “the Phrygian and Galatian region,” referring to one regional area.
