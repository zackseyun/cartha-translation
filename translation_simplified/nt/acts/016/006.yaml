simplification_decisions:
- pob_phrase: And they passed through
  simplified_phrase: They traveled through
  preserved_meaning: They moved through the region as the narrative continued.
  reasoning_layer_used: POB lexical decisions for Διῆλθον and δὲ
  rationale: “Traveled through” states the movement in ordinary modern English.
- pob_phrase: having been forbidden by the Holy Spirit
  simplified_phrase: The Holy Spirit forbade them
  preserved_meaning: The Holy Spirit personally prohibited their speaking without fixing whether this happened before or during the travel.
  reasoning_layer_used: POB lexical and theological decisions for κωλυθέντες and ὑπὸ τοῦ ἁγίου πνεύματος
  rationale: A direct sentence clarifies the Spirit’s agency while avoiding the draft’s overly definite pluperfect timing.
- pob_phrase: to speak the word
  simplified_phrase: to speak the message
  preserved_meaning: They were forbidden to communicate the Christian message.
  reasoning_layer_used: POB lexical decision for λαλῆσαι and τὸν λόγον
  rationale: “The message” makes the missionary sense clear without narrowing it to a more specific term.
interpretive_expansions:
