translation:
  language: en
  text: After she and her household were baptized, she urged us, “If you consider me faithful to the Lord,[a] come and stay in my home.” She kept insisting until we agreed.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a believer in the Lord.” The Greek word can mean faithful, trustworthy, or believing.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And when she and her household were baptized
  simplified_phrase: After she and her household were baptized
  preserved_meaning: Lydia and her household were baptized before she invited the travelers to stay.
  reasoning_layer_used: Lexical decision for ὡς δὲ and theological decision on household baptism
  rationale: “After” makes the sequence clear without adding claims about the household members.
- pob_phrase: If you have judged me to be faithful to the Lord
  simplified_phrase: If you consider me faithful to the Lord
  preserved_meaning: Lydia appeals to their settled assessment of her faithfulness to the Lord.
  reasoning_layer_used: Lexical decisions for κεκρίκατέ, πιστή, and τῷ κυρίῳ
  rationale: “Consider” expresses their assessment in natural English while “faithful” preserves the Greek ambiguity.
- pob_phrase: come into my house and stay
  simplified_phrase: come and stay in my home
  preserved_meaning: Lydia invites them to receive hospitality in her dwelling.
  reasoning_layer_used: Lexical decisions for εἰσελθόντες, οἶκος, and μένετε
  rationale: The recast command is ordinary English and still distinguishes her dwelling from her household.
interpretive_expansions:
- pob_phrase: she prevailed upon us
  rendering: She kept insisting until we agreed
  claim: Her persistent urging succeeded in persuading them to accept her invitation.
  evidence:
  - The lexical rationale says παραβιάζομαι conveys strong insistence and that Lydia prevailed upon them.
  - The immediate context supplies the invitation that they accepted.
  confidence: high
  alternatives_preserved:
