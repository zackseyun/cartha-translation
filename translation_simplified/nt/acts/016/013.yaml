translation:
  language: en
  text: On the Sabbath, we went outside the gate to the riverside, where we thought there was a place of prayer.[a] We sat down and spoke to the women who had gathered there.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also mean “where we thought there was prayer,” but the context favors a place set apart for prayer.
    reason: lexical_alternative
