translation:
  language: en
  text: A woman named Lydia was listening. She was from Thyatira, sold purple cloth, and worshiped God.[a] The Lord opened her heart so that she paid attention to what Paul was saying.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “was a worshiper of God”; this may identify Lydia as a Gentile devoted to Israel’s God.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And a certain woman named Lydia
  simplified_phrase: A woman named Lydia
  preserved_meaning: Lydia is introduced as an indefinite new person in the narrative.
  reasoning_layer_used: Lexical decision for καί τις γυνὴ
  rationale: The article “A” preserves indefiniteness without the stiff modern phrase “a certain woman.”
- pob_phrase: a seller of purple cloth from the city of Thyatira, who worshiped God, was listening
  simplified_phrase: was listening. She was from Thyatira, sold purple cloth, and worshiped God
  preserved_meaning: Lydia’s origin, trade, worship, and ongoing listening all remain distinct.
  reasoning_layer_used: Lexical decisions for πορφυρόπωλις, πόλεως Θυατείρων, σεβομένη τὸν θεόν, and ἤκουεν
  rationale: Two short sentences replace the dense chain of descriptions while keeping every detail.
- pob_phrase: to what was being spoken by Paul
  simplified_phrase: to what Paul was saying
  preserved_meaning: Lydia paid attention to Paul’s ongoing speech.
  reasoning_layer_used: Lexical decisions for τοῖς λαλουμένοις and ὑπὸ τοῦ Παύλου
  rationale: An active clause is more natural in English and retains the ongoing action.
translation_notes:
  risk_flags:
  - risk: Readers may understand “the Lord” specifically as either God or Jesus.
    mitigation: The main text keeps POB’s open wording and does not identify the referent more narrowly.
  - risk: “Opened her heart” may sound like a modern emotional idiom.
    mitigation: The image is retained because it expresses the Lord enabling Lydia’s inward receptivity.
