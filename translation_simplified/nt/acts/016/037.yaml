translation:
  language: en
  text: But Paul said, “They beat us in public without a trial and threw us into prison, even though we are Roman citizens. Now they want to send us out secretly? Absolutely not! They must come in person and lead us out.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: After beating us publicly without trial, though we are Roman citizens, they threw us into prison
  simplified_phrase: They beat us in public without a trial and threw us into prison, even though we are Roman citizens.
  preserved_meaning: The officials publicly beat uncondemned Roman citizens and then imprisoned them.
  reasoning_layer_used: POB lexical and theological decisions on ἀκατακρίτους and Roman citizenship
  rationale: Direct clauses clarify the sequence while keeping “without a trial” attached to the beating.
- pob_phrase: and now are they sending us out secretly?
  simplified_phrase: Now they want to send us out secretly?
  preserved_meaning: Paul challenges the officials’ attempt to remove them covertly.
  reasoning_layer_used: POB lexical decisions on λάθρᾳ and ἐκβάλλουσιν
  rationale: Ordinary question wording preserves both the secret action and Paul’s challenge.
- pob_phrase: No indeed! Rather, let them come themselves and lead us out.
  simplified_phrase: Absolutely not! They must come in person and lead us out.
  preserved_meaning: Paul emphatically demands that the officials personally lead them out.
  reasoning_layer_used: POB lexical decisions on οὐ γάρ, ἐλθόντες αὐτοὶ, and ἐξαγαγέτωσαν
  rationale: The direct demand clearly conveys the emphatic refusal and required personal action.
translation_notes:
