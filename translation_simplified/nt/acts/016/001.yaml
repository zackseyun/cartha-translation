translation:
  language: en
  text: He also came to Derbe and Lystra. A disciple named Timothy was there. His mother was a Jewish believer,[a] but his father was Greek.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a faithful Jewish woman.” The Greek word can mean either “believing” or “faithful,” but “believing” is more likely here in Acts.
    reason: lexical_alternative
