simplification_decisions:
- pob_phrase: And after bringing them outside, he said
  simplified_phrase: He brought them outside. Then he asked
  preserved_meaning: He first brought them outside and then spoke his question.
  reasoning_layer_used: The lexical decisions establish the sequence and treat the speech verb as a normal narrative introduction.
  rationale: Two short sentences make the sequence easier to follow, while “asked” naturally introduces the question.
- pob_phrase: so that I may be saved
  simplified_phrase: to be saved
  preserved_meaning: He asks what action is necessary for him to receive salvation.
  reasoning_layer_used: The lexical and theological decisions preserve the passive “be saved” and its broad spiritual sense.
  rationale: The shorter infinitive expresses the same purpose in natural modern English.
translation_notes:
  risk_flags:
  - risk: “To be saved” could be read as physical rescue alone.
    mitigation: The traditional wording preserves the intended spiritual sense while leaving the term’s broader range intact.
