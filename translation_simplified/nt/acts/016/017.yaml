simplification_decisions:
- pob_phrase: Paul and us
  simplified_phrase: Paul and the rest of us
  preserved_meaning: Paul is named within the group that includes the narrator.
  reasoning_layer_used: source syntax and immediate narrative context
  rationale: “The rest of us” makes the group relationship natural in modern English.
- pob_phrase: kept following Paul and us and crying out
  simplified_phrase: kept following Paul and the rest of us and kept calling out loudly
  preserved_meaning: Both her following and her loud speech continued or happened repeatedly.
  reasoning_layer_used: lexical decisions and imperfect aspect for κατακολουθοῦσα and ἔκραζεν
  rationale: Repeating “kept” clearly preserves the ongoing force of both actions.
- pob_phrase: are proclaiming to you a way of salvation
  simplified_phrase: are announcing to you a way to be saved
  preserved_meaning: They publicly declare to their hearers a means of receiving salvation.
  reasoning_layer_used: lexical and theological decisions for καταγγέλλουσιν and ὁδὸν σωτηρίας
  rationale: “A way to be saved” is easier to understand while retaining the chosen indefinite wording.
translation_notes:
  risk_flags:
