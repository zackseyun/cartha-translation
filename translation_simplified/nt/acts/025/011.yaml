  preserved_meaning: The governor cannot justly surrender Paul to please his accusers.
  reasoning_layer_used: Lexical decision for χαρίσασθαι and theological decision on judicial nuance
  rationale: “Has the right” makes the legal force clearer without changing Paul’s claim.
