translation:
  language: en
  text: If I am guilty of wrongdoing and have done something deserving death, I do not refuse to die. But if these men’s accusations have no basis, no one has the right to hand me over to them as a favor. I appeal to Caesar.
  philosophy: optimal-equivalence
