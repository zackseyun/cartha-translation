  reasoning_layer_used: Lexical decision for οὐδέν ἐστιν ὧν οὗτοι κατηγοροῦσίν μου
  rationale: “Have no basis” states the same legal sense in direct, natural English.
- pob_phrase: no one can hand me over to them as a favor
