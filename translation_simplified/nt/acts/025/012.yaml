translation:
  language: en
  text: Then Festus consulted with the council and answered, “You have appealed to Caesar, so you will go to Caesar.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “you will go before Caesar.” The phrase has the legal sense of going to the emperor’s court after making an appeal.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: after conferring with the council
  simplified_phrase: consulted with the council
  preserved_meaning: Festus discussed the case with the deliberative council before answering.
  reasoning_layer_used: Lexical decisions for συλλαλήσας and μετὰ τοῦ συμβουλίου
  rationale: The active verb and ordinary word “consulted” make the sequence easier to follow.
- pob_phrase: You have appealed to Caesar; to Caesar you will go.
  simplified_phrase: You have appealed to Caesar, so you will go to Caesar.
  preserved_meaning: Paul’s legal appeal means that his case will proceed to Caesar.
  reasoning_layer_used: Lexical decisions for ἐπικέκλησαι, ἐπὶ Καίσαρα, and πορεύσῃ
  rationale: Adding “so” states the clear connection while retaining the legal appeal and future movement.
translation_notes:
  risk_flags:
