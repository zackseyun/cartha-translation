translation:
  language: en
  text: Instead, they had disputes with him about their own religion[a] and about someone named Jesus. Jesus had died, but Paul claimed he was alive.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “their own superstition.” The Greek word can refer neutrally to religion or express an outsider’s negative view of it.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Rather
  simplified_phrase: Instead
  preserved_meaning: Festus contrasts the actual disputes with the criminal charges he had expected.
  reasoning_layer_used: POB lexical decision for δέ
  rationale: “Instead” states the corrective contrast in common English.
- pob_phrase: a certain Jesus
  simplified_phrase: someone named Jesus
  preserved_meaning: Festus refers to Jesus with distance and apparent unfamiliarity.
  reasoning_layer_used: POB lexical decision for τινος Ἰησοῦ
  rationale: The indefinite wording preserves Festus’s detached perspective without the formal phrase “a certain.”
- pob_phrase: who had died, whom Paul claimed to be alive
  simplified_phrase: Jesus had died, but Paul claimed he was alive
  preserved_meaning: Festus reports both Jesus’ death and Paul’s claim that Jesus was alive without endorsing the claim himself.
  reasoning_layer_used: POB lexical and theological decisions for τεθνηκότος and φάσκω
  rationale: A separate sentence makes the contrast easier to follow while retaining “claimed.”
translation_notes:
  risk_flags:
  - risk: “Someone named Jesus” may sound less formally distancing than “a certain Jesus.”
    mitigation: The indefinite “someone” still preserves Festus’s unfamiliar outsider perspective.
