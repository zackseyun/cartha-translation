translation:
  language: en
  text: I have nothing definite to write about him to my lord.[a] That is why I have brought him before all of you, especially before you, King Agrippa. After the hearing,[b] I may have something to write.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: That is, the emperor; the Greek title is literally “my lord.”
    reason: alternative_reading
  - marker: b
    text: The hearing is a formal inquiry into Paul’s case; the examiner is not identified.
    reason: lexical_alternative
