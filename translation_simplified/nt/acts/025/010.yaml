translation:
  language: en
  text: But Paul said, “I now stand before Caesar’s court. This is where my case should be tried. I have done nothing wrong to the Jews, as you yourself know very well.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: I am standing before Caesar’s tribunal, where I ought to be judged
  simplified_phrase: I now stand before Caesar’s court. This is where my case should be tried.
  preserved_meaning: Paul is presently under Caesar’s judicial authority and claims it is the proper court for his case.
  reasoning_layer_used: Lexical decisions for βῆμα, ἑστώς εἰμι, δεῖ, and κρίνεσθαι.
  rationale: Two plain sentences clarify the legal setting while preserving Paul’s present standing and claim about proper jurisdiction.
- pob_phrase: I have done no wrong to the Jews
  simplified_phrase: I have done nothing wrong to the Jews
  preserved_meaning: Paul denies committing any moral or legal offense against the Jews.
  reasoning_layer_used: Lexical decision for οὐδὲν ἠδίκησα.
  rationale: “Nothing wrong” is more conversationally direct without weakening the complete denial.
translation_notes:
  risk_flags:
  - risk: “Court” is broader than the official judicial seat conveyed by βῆμα.
    mitigation: The phrases “stand before” and “my case should be tried” keep the formal Roman legal sense clear.
