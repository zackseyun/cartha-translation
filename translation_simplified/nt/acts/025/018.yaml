translation:
  language: en
  text: When his accusers stood up, they did not charge him with any of the wrongdoing[a] I had expected.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “any of the crimes I had expected.” The Greek can refer broadly to evil acts or wrongdoing, not only formally defined crimes.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Concerning him, when the accusers stood up
  simplified_phrase: When his accusers stood up
  preserved_meaning: The accusers stood to present their case against Paul.
  reasoning_layer_used: Lexical decisions for περὶ οὗ, σταθέντες, and οἱ κατήγοροι
  rationale: Using “his accusers” removes the awkward opening while keeping Paul as the person accused.
- pob_phrase: they brought no charge of the evil things that I was suspecting
  simplified_phrase: they did not charge him with any of the wrongdoing I had expected
  preserved_meaning: Festus expected accusations of serious wrongdoing, but none were presented.
  reasoning_layer_used: Lexical decisions for οὐδεμίαν αἰτίαν ἔφερον, ἐγὼ ὑπενόουν, and πονηρῶν
  rationale: This recasts the legal idiom and wooden progressive into natural English without narrowing wrongdoing to defined crimes.
translation_notes:
  risk_flags:
  - risk: “Wrongdoing” may sound less severe than the Greek expression “evil things.”
    mitigation: The legal phrase “charge him” keeps the serious courtroom sense, while the footnote preserves the possible rendering “crimes.”
