translation:
  language: en
  text: When they had been there for many days, Festus brought Paul’s situation before the king. He said, “There is a man whom Felix left behind as a prisoner.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: as they stayed there many days
  simplified_phrase: When they had been there for many days
  preserved_meaning: Agrippa and Bernice had remained there for an extended time.
  reasoning_layer_used: POB lexical decision for πλείους ἡμέρας and διέτριβον
  rationale: The new wording expresses the same extended stay in more natural English.
- pob_phrase: laid before the king the matters concerning Paul
  simplified_phrase: brought Paul’s situation before the king
  preserved_meaning: Festus presented Paul’s circumstances to the king for consideration.
  reasoning_layer_used: POB lexical decisions for ἀνέθετο and τὰ κατὰ τὸν Παῦλον
  rationale: “Brought before” keeps the idea of presenting a matter rather than merely reporting it.
- pob_phrase: There is a certain man left behind by Felix as a prisoner
  simplified_phrase: There is a man whom Felix left behind as a prisoner
  preserved_meaning: Felix had left a specific man in the continuing status of a prisoner.
  reasoning_layer_used: POB lexical decisions for Ἀνήρ τίς, καταλελειμμένος, and δέσμιος
  rationale: The active clause is easier to follow while preserving both “left behind” and “prisoner.”
