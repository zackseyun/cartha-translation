translation:
  language: en
  text: While they were serving the Lord[a] and fasting, the Holy Spirit said, “Set Barnabas and Saul apart for me to do the work I have called them to do.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word describes service to the Lord with worshipful overtones; it can also be translated “worshiping the Lord.”
    reason: lexical_alternative
