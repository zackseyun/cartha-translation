translation:
  language: en
  text: But the Jews stirred up the prominent devout women[a] and the leading men of the city. They caused Paul and Barnabas to be persecuted and drove them out of the district.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “women who worshiped God”; they may have been Gentile worshipers associated with the synagogue.
    reason: lexical_alternative
  - marker: b
    text: Or “region” or “territory.”
    reason: lexical_alternative
