translation:
  language: en
  text: But Elymas the magician—whose name was understood to mean “magician”—kept opposing them. He was trying to turn the proconsul away from the faith.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “away from faith.” The Greek may refer specifically to the Christian faith or more generally to responding with belief.
    reason: alternative_reading
  - marker: b
    text: A proconsul was a Roman provincial governor. The exact origin and meaning of the name “Elymas” are uncertain.
    reason: cultural_note
