simplification_decisions:
- pob_phrase: And that he raised him from the dead, no longer about to return to decay
  simplified_phrase: God raised Jesus from the dead, and Jesus would never return to bodily decay
  preserved_meaning: God resurrected Jesus, who would not again be subject to physical decay.
  reasoning_layer_used: lexical decisions and immediate context
  rationale: A direct sentence replaces the difficult opening structure while keeping resurrection and decay distinct.
- pob_phrase: he has spoken in this way
  simplified_phrase: God said it this way
  preserved_meaning: God introduced the enduring scriptural promise that follows.
  reasoning_layer_used: lexical decision for οὕτως εἴρηκεν
  rationale: The shorter wording naturally introduces the quotation without changing its divine source.
- pob_phrase: the holy and sure blessings of David
  simplified_phrase: the holy and sure blessings of David
  preserved_meaning: The sacred and reliable covenant benefits associated with David remain promised.
  reasoning_layer_used: lexical and theological decisions on Isaiah 55:3
  rationale: This wording is retained because simpler substitutes could narrow the phrase’s documented covenantal range.
interpretive_expansions:
