simplification_decisions:
- pob_phrase: those who live in Jerusalem and their rulers
  simplified_phrase: the people who live in Jerusalem and their rulers
  preserved_meaning: Both Jerusalem’s residents and their governing leaders are included.
  reasoning_layer_used: POB lexical decisions for κατοικοῦντες and ἄρχοντες
  rationale: “The people” identifies the group plainly while “rulers” retains the judicial force.
- pob_phrase: because they did not recognize this one and by condemning him fulfilled
  simplified_phrase: because they did not recognize this one, fulfilled ... by condemning him
  preserved_meaning: Their failure to recognize Jesus relates causally to fulfillment, while condemning him is the means of fulfillment.
  reasoning_layer_used: POB theological decision and doctrine-realignment revision
  rationale: Reordering separates the causal and instrumental relationships without claiming that ignorance caused the condemnation.
- pob_phrase: the voices of the prophets that are read every Sabbath
  simplified_phrase: the message voiced by the prophets and read aloud every Sabbath
  preserved_meaning: The prophets’ audible witness is preserved while its content is expressed as a message.
  reasoning_layer_used: POB lexical decision for φωνάς and Sabbath reading
  rationale: Using “voiced” preserves the source image without the cumbersome phrase “voices that are read.”
interpretive_expansions:
