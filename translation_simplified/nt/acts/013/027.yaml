translation:
  language: en
  text: For the people who live in Jerusalem and their rulers, because they did not recognize this one,[a] fulfilled the message voiced by the prophets and read aloud every Sabbath by condemning him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
