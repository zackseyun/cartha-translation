translation:
  language: en
  text: The church in Antioch had prophets and teachers. They were Barnabas; Simeon, who was called Niger[a]; Lucius from Cyrene[b]; Manaen, a close companion of the regional ruler Herod[c]; and Saul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Niger” is a Latin name meaning “black.” It is kept here as a personal name.
    reason: lexical_alternative
  - marker: b
    text: Cyrene was a city in North Africa.
    reason: cultural_note
  - marker: c
    text: The Greek calls Herod a “tetrarch.” Manaen may have been his foster-brother or may have been brought up with him.
    reason: alternative_reading
