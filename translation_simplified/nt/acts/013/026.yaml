translation:
  language: en
  text: Brothers[a]—you sons of Abraham’s family and those among you who fear God[b]—the message of this salvation has been sent to us.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek address is masculine, though the gathered audience may have included women.
    reason: lexical_alternative
  - marker: b
    text: This may refer to Gentiles who worshiped Israel’s God and attended the synagogue.
    reason: cultural_note
