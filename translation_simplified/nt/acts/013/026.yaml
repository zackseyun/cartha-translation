  preserved_meaning: The wording retains both the male kinship term and descent from Abraham’s family line.
  reasoning_layer_used: POB lexical decision for υἱοὶ γένους Ἀβραὰμ
  rationale: The possessive form is more natural while preserving the chosen lineage language.
- pob_phrase: Brothers, sons ... and those ...
  simplified_phrase: Brothers—you sons ... and those ...—
  preserved_meaning: Both Jewish descendants of Abraham and others who fear God remain directly addressed.
  reasoning_layer_used: POB lexical and theological audience decisions
  rationale: The dashes and added “you” clarify the two audience groups without changing their relationship.
- pob_phrase: the message of this salvation
  simplified_phrase: the message of this salvation
  preserved_meaning: The demonstrative continues to identify the salvation rather than the message.
  reasoning_layer_used: POB lexical decision for τῆς σωτηρίας ταύτης and grounding review
  rationale: The audited wording is retained because moving “this” would change what it modifies.
