translation:
  language: en
  text: “Now look! The hand of the Lord[a] is upon you. You will be blind and unable to see the sun for a time.” At once, a mist and darkness came over him. He groped around, looking for people to lead him by the hand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “The hand of the Lord” means the Lord’s active power, here bringing judgment.
    reason: cultural_note
