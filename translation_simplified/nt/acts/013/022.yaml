translation:
  language: en
  text: 'After God removed Saul from being king, he raised up David as king for Israel. God gave this testimony about David: “I have found David son of Jesse, a man whose heart is in line with mine.[a] He will carry out all my purposes.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, more traditionally, “a man after my own heart.” The Greek more literally says “according to my heart.”
    reason: lexical_alternative
