  preserved_meaning: God ended Saul’s kingship before raising up David.
  reasoning_layer_used: lexical decision and immediate context
  rationale: Naming God, Saul, and the kingship makes the pronouns and action immediately clear.
- pob_phrase: to whom he also bore witness and said
  simplified_phrase: God gave this testimony about David
  preserved_meaning: God spoke as a witness concerning David.
  reasoning_layer_used: lexical decision
  rationale: The recast sentence preserves the testimonial force in natural English.
- pob_phrase: according to my heart ... all my will
  simplified_phrase: whose heart is in line with mine ... all my purposes
  preserved_meaning: David conforms to God’s heart and will carry out God’s various intentions.
  reasoning_layer_used: lexical and theological decisions
