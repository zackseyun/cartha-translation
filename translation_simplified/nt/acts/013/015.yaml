translation:
  language: en
  text: 'After the Law and the Prophets had been read aloud, the synagogue leaders sent them this message: “Brothers, if any of you has a message of encouragement for the people,[a] speak.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a message of exhortation.” The Greek expression can mean either encouragement or an appeal urging people to act.
    reason: lexical_alternative
