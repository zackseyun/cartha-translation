simplification_decisions:
- pob_phrase: For about four hundred and fifty years
  simplified_phrase: All this took about 450 years
  preserved_meaning: The approximate duration refers back to the events just described while remaining separate from the period of the judges.
  reasoning_layer_used: theological decision and source syntax
  rationale: A complete sentence makes the backward connection understandable without attaching the number to the judges.
- pob_phrase: And after these things
  simplified_phrase: After that
  preserved_meaning: The judges came after the preceding events.
  reasoning_layer_used: lexical decision
  rationale: The common phrase “after that” expresses the same narrative sequence.
- pob_phrase: until Samuel the prophet
  simplified_phrase: until the time of Samuel the prophet
  preserved_meaning: Samuel marks the endpoint of the period being described.
  reasoning_layer_used: lexical decision
  rationale: Adding “the time of” makes the temporal endpoint natural in English.
