translation:
  language: en
  text: All this took about 450 years.[a] After that, God gave Israel judges until the time of Samuel the prophet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek wording and punctuation are debated. Some translations instead say, “Then God gave Israel judges for about 450 years, until Samuel the prophet.”
