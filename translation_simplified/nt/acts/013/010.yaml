translation:
  language: en
  text: He said, “You are full of every kind of deceit and every kind of corrupt behavior! You are a son of the devil and an enemy of all righteousness.[a] Will you not stop twisting the Lord’s straight ways?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “an enemy of all justice.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: every kind of villainy
  simplified_phrase: every kind of corrupt behavior
  preserved_meaning: The accusation covers unscrupulous conduct broadly rather than evil in general.
  reasoning_layer_used: Lexical decision for ῥᾳδιουργία
  rationale: “Corrupt behavior” is familiar English and avoids narrowing the charge to planned schemes.
- pob_phrase: You who are full ... son of the devil, enemy of all righteousness
  simplified_phrase: You are full ... You are a son of the devil and an enemy of all righteousness.
  preserved_meaning: The emphatic address and all three accusations remain forceful.
  reasoning_layer_used: Lexical decisions for Ὦ, υἱὲ διαβόλου, and ἐχθρὲ πάσης δικαιοσύνης
  rationale: Two direct sentences make the rebuke easier to follow without weakening it.
- pob_phrase: will you not stop twisting the straight ways of the Lord?
  simplified_phrase: Will you not stop twisting the Lord’s straight ways?
  preserved_meaning: The rhetorical rebuke and the image of bending straight ways are retained.
  reasoning_layer_used: Lexical decisions for οὐ παύσῃ, διαστρέφων, and τὰς ὁδοὺς κυρίου τὰς εὐθείας
  rationale: Modern word order improves clarity while preserving the source image.
translation_notes:
  risk_flags:
  - risk: “Corrupt behavior” is broader and less vivid than “villainy.”
    mitigation: It retains the audited sense of unscrupulous conduct and remains distinct from deceit.
