translation:
  language: en
  text: Paul and Barnabas answered boldly, “We had to speak God’s word to you first. But you are rejecting it and judging yourselves unworthy of eternal life. So now we are turning to the Gentiles.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: That is, the non-Jewish peoples; the Greek can also be translated “the nations.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: spoke boldly and said
  simplified_phrase: answered boldly
  preserved_meaning: Paul and Barnabas responded with bold, frank speech.
  reasoning_layer_used: Lexical decision for παρρησιασάμενοί and narrative context
  rationale: “Answered boldly” removes the repetitive speech formula while retaining the manner of speaking.
- pob_phrase: It was necessary that the word of God be spoken first to you
  simplified_phrase: We had to speak God’s word to you first
  preserved_meaning: The Jewish audience had priority in receiving God’s message.
  reasoning_layer_used: Lexical decisions for ἀναγκαῖον, πρῶτον, and τὸν λόγον τοῦ θεοῦ
  rationale: The active sentence is easier to follow and keeps both necessity and sequence.
- pob_phrase: look, we are turning to the Gentiles
  simplified_phrase: So now we are turning to the Gentiles
  preserved_meaning: Their rejection leads to an immediate, decisive turn toward non-Jews.
  reasoning_layer_used: Lexical and theological decisions for ἰδοὺ, στρεφόμεθα, and τὰ ἔθνη
  rationale: “So now” naturally marks both the consequence and the announced shift.
interpretive_expansions:
- pob_phrase: the word of God be spoken
  rendering: We had to speak God’s word
  claim: Paul and Barnabas are the implied speakers of God’s word.
  evidence:
  - They are the named speakers and announce their own missionary turn.
  confidence: high
  alternatives_preserved:
