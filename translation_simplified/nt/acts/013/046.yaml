translation_notes:
  risk_flags:
  - risk: Changing the passive clause to active wording makes the human speakers explicit.
    mitigation: The immediate context identifies Paul and Barnabas as those speaking and turning to the Gentiles.
  - risk: “Gentiles” may be unfamiliar to new readers.
    mitigation: The footnote defines it as non-Jewish peoples and preserves the lexical alternative.
