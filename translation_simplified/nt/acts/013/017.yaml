translation:
  language: en
  text: The God of the people of Israel chose our fathers.[a] He made his people great while they lived as foreigners in Egypt.[b] Then, with his mighty arm raised, he led them out of Egypt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “our ancestors.” The Greek says “our fathers.”
    reason: lexical_alternative
  - marker: b
    text: “Made his people great” may include increasing their number or raising their status.
    reason: lexical_alternative
