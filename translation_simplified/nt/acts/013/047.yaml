translation:
  language: en
  text: 'For this is what the Lord has commanded us: “I have appointed you to be a light for the nations,[a] so that salvation may reach the farthest part of the earth.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a light for the Gentiles.”
    reason: lexical_alternative
  - marker: b
    text: Or “to the ends of the earth.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: For so the Lord has commanded us
  simplified_phrase: For this is what the Lord has commanded us
  preserved_meaning: The quotation gives the Lord’s authoritative and continuing command.
  reasoning_layer_used: Lexical decisions for οὕτως and ἐντέταλται
  rationale: The fuller wording makes the connection clear in natural English.
- pob_phrase: I have set you as a light for the nations
  simplified_phrase: I have appointed you to be a light for the nations
  preserved_meaning: God established the singular addressee in a mission pictured as light for other peoples.
  reasoning_layer_used: Lexical decisions for Τέθεικά and εἰς φῶς ἐθνῶν
  rationale: “Appointed you to be” clarifies the commissioning sense while preserving the light image.
- pob_phrase: so that you may be for salvation to the end of the earth
  simplified_phrase: so that salvation may reach the farthest part of the earth
  preserved_meaning: Salvation is the worldwide goal without defining whether the addressee is salvation or its means.
  reasoning_layer_used: Lexical decisions for εἰς σωτηρίαν and ἕως ἐσχάτου τῆς γῆς
  rationale: The recasting is clear English and retains the POB’s deliberate theological ambiguity.
interpretive_expansions:
- pob_phrase: for salvation to the end of the earth
  rendering: salvation may reach the farthest part of the earth
  claim: The intended saving result extends to the earth’s remotest place.
  evidence:
  - The lexical audit treats εἰς σωτηρίαν as result or goal.
  - The audited rendering of ἕως ἐσχάτου τῆς γῆς denotes the earth’s extremity.
  confidence: high
  alternatives_preserved:
  - whether the addressee is salvation itself
  - whether the addressee is the means of salvation
  - to the ends of the earth
translation_notes:
  risk_flags:
  - risk: Making salvation the grammatical subject could obscure the quotation’s direct description of the singular addressee.
    mitigation: The wording keeps “you” singular and preserves the appointment as light while leaving the precise relation to salvation unresolved.
  - risk: “Nations” may be read more broadly than the contextually plausible “Gentiles.”
    mitigation: Footnote [a] preserves “Gentiles” as the lexical alternative.
