translation:
  language: en
  text: As John was nearing the end of his work, he kept saying, “What do you think I am? I am not he.[a] But look! Someone is coming after me. I am not worthy to untie his sandals.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More explicitly, “I am not the Messiah.” The Greek leaves the identity unstated, though the context points to the Messiah.
    reason: alternative_reading
  - marker: b
    text: Some manuscripts and translations say “untie the strap of his sandals,” but the printed Greek text simply refers to untying his sandals.
    reason: textual_variant
