translation:
  language: en
  text: When the Gentiles heard this, they began to rejoice and honor the word of the Lord. All who had been appointed for eternal life believed.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “had been disposed toward eternal life.” The Greek can be understood in different ways, but “had been appointed” most naturally preserves its passive form here.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: they began rejoicing and glorifying
  simplified_phrase: they began to rejoice and honor
  preserved_meaning: The Gentiles responded with continuing joy and gave honor to the Lord’s word.
  reasoning_layer_used: Lexical decisions for ἔχαιρον and ἐδόξαζον
  rationale: Infinitives and “honor” make the coordinated actions easier to understand while preserving their force.
- pob_phrase: the word of the Lord
  simplified_phrase: the word of the Lord
  preserved_meaning: This is the proclaimed message from the Lord, expressed with the established biblical term “word.”
  reasoning_layer_used: Lexical decision for τὸν λόγον τοῦ κυρίου
  rationale: The phrase remains because it carries theological resonance and is understandable in context.
- pob_phrase: and all who had been appointed for eternal life believed
  simplified_phrase: All who had been appointed for eternal life believed.
  preserved_meaning: Everyone included in the stated appointment responded by believing.
  reasoning_layer_used: Lexical and theological decisions for ὅσοι τεταγμένοι εἰς ζωὴν αἰώνιον
  rationale: A separate sentence clarifies the result without weakening the passive appointment language.
translation_notes:
  risk_flags:
  - risk: “Appointed” is debated and may also be understood as “disposed.”
    mitigation: The main text keeps the POB’s passive reading, while the footnote preserves the important alternative.
  - risk: “Honor” is somewhat less traditional than “glorify.”
    mitigation: It communicates the same respectful exaltation in clearer common English without changing the object.
