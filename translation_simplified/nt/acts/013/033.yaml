translation:
  language: en
  text: 'God has fulfilled this promise for our descendants[a] by raising up Jesus[b]. As it is also written in Psalm 2: “You are my Son; today I have begotten you.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some manuscripts read “for our children,” while others support “for us, their children.”
    reason: textual_variant
  - marker: b
    text: This may mean raising Jesus from the dead or raising him up by bringing him forward and appointing him.
    reason: alternative_reading
  - marker: c
    text: “Begotten” is an older word meaning “brought forth as a son.” The quotation leaves the precise force of “today” unexplained.
    reason: simplification_note
simplification_decisions:
- pob_phrase: this
  simplified_phrase: this promise
  preserved_meaning: The pronoun points back to God’s promise in the preceding verse.
  reasoning_layer_used: POB lexical decision and immediate context
  rationale: Naming the referent prevents readers from having to infer it.
- pob_phrase: for our children
  simplified_phrase: for our descendants
  preserved_meaning: Paul speaks of the generation descended from the fathers.
  reasoning_layer_used: POB lexical decision and immediate context
  rationale: “Descendants” avoids suggesting only the hearers’ immediate children.
- pob_phrase: as it is also written in the second Psalm
  simplified_phrase: As it is also written in Psalm 2
  preserved_meaning: Paul introduces the same authoritative Scripture quotation.
  reasoning_layer_used: POB lexical decision
  rationale: The modern title is easier to recognize.
interpretive_expansions:
- pob_phrase: this
  rendering: this promise
  claim: “This” refers to the promise made to the fathers in the preceding verse.
  evidence:
  - Acts 13:32 explicitly mentions the promise made to the fathers.
  - The POB lexical rationale identifies the promise as the pronoun’s referent.
  confidence: high
  alternatives_preserved:
  - this
- pob_phrase: our children
  rendering: our descendants
  claim: The children are the generation descended from the fathers mentioned in the speech.
  evidence:
  - The immediate context contrasts the fathers with those who came after them.
  - The POB lexical rationale includes “descendants” as the contextual sense.
  confidence: high
  alternatives_preserved:
  - for our children
  - for us, their children
translation_notes:
  risk_flags:
  - risk: “Raising up Jesus” may be understood only as resurrection language.
    mitigation: The footnote preserves both resurrection and bringing-forward or appointing senses.
  - risk: “Begotten” may be unfamiliar or interpreted too narrowly.
    mitigation: The footnote explains the word while leaving the quotation’s precise force open.
