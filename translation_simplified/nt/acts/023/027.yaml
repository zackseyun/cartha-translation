translation:
  language: en
  text: The Jews[a] seized this man and were about to kill him. I came with the troops and rescued him after learning that he is a Roman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the Judeans.” Here the Greek term most likely refers to the Jewish crowd or opponents in Jerusalem.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: This man was seized by the Jews
  simplified_phrase: The Jews seized this man
  preserved_meaning: The Jewish group acted against the man by force, without implying a formal arrest.
  reasoning_layer_used: POB lexical decision for συλλημφθέντα and Ἰουδαίων
  rationale: The active wording is easier to read while preserving the hostile seizure and the footnoted ambiguity.
- pob_phrase: and I came with the troops and rescued him
  simplified_phrase: I came with the troops and rescued him
  preserved_meaning: The speaker arrived with a military force and saved the man from imminent death.
  reasoning_layer_used: POB lexical decisions for ἐπιστὰς, σὺν τῷ στρατεύματι, and ἐξειλάμην
  rationale: A new sentence makes the sequence clear without adding contrast absent from the Greek.
- pob_phrase: having learned that he is a Roman
  simplified_phrase: after learning that he is a Roman
  preserved_meaning: The letter presents the knowledge of the man's Roman status as preceding the rescue.
  reasoning_layer_used: POB lexical decision for μαθὼν and theological decision on historical-rhetorical presentation
  rationale: “After learning” replaces a formal participial construction without resolving the letter's tension with the fuller narrative.
translation_notes:
  risk_flags:
