  preserved_meaning: The Sadducees deny resurrection and the existence of angels and spirits.
  reasoning_layer_used: POB lexical decisions for μὴ εἶναι and μήτε ἄγγελον μήτε πνεῦμα
  rationale: The sentence states the shared idea of existence directly and uses natural English plurals for the two categories.
- pob_phrase: the Pharisees acknowledge both
  simplified_phrase: the Pharisees say that both angels and spirits do exist
  preserved_meaning: The Pharisees affirm the reality of the paired categories, angels and spirits.
  reasoning_layer_used: POB theological decision on the scope of τὰ ἀμφότερα
  rationale: Naming the two categories makes the controlling interpretation immediately understandable.
