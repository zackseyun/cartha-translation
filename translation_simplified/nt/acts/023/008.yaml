translation:
  language: en
  text: The Sadducees say there is no resurrection and that angels and spirits do not exist. But the Pharisees say that both angels and spirits do exist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or perhaps, “the Pharisees affirm all three”—resurrection, angels, and spirits. The Greek says “both,” which most naturally refers to angels and spirits, though some understand it more broadly.
    reason: alternative_reading
