translation:
  language: en
  text: So do not let them persuade you. More than forty men from their group are waiting in ambush for him. They have put themselves under a curse, vowing not to eat or drink until they have killed him. They are ready now, waiting for you to agree to their request.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “waiting for the promise from you”; here it means the commander’s agreement or authorization.
    reason: lexical_alternative
