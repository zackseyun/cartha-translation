translation:
  language: en
  text: Then Paul said to him, “God is about to strike you,[a] you whitewashed wall![b] Do you sit there judging me by the law, yet break the law by ordering that I be struck?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “God will strike you.” The Greek may emphasize that the action is imminent.
    reason: lexical_alternative
  - marker: b
    text: A “whitewashed wall” looks clean outside but is corrupt within.
    reason: simplification_note
simplification_decisions:
- pob_phrase: do you sit judging me according to the law
  simplified_phrase: Do you sit there judging me by the law
  preserved_meaning: Paul sharply challenges the man sitting in judgment under the law.
  reasoning_layer_used: Lexical decisions for κάθῃ and κρίνων με κατὰ τὸν νόμον
  rationale: The wording uses ordinary legal English while preserving the concrete image and rhetorical question.
- pob_phrase: in violation of the law command me to be struck
  simplified_phrase: break the law by ordering that I be struck
  preserved_meaning: The order to strike Paul violates the law being used to judge him.
  reasoning_layer_used: Lexical decisions for παρανομῶν and κελεύεις με τύπτεσθαι
  rationale: The clearer wording preserves both the legal contradiction and the passive harm to Paul.
- pob_phrase: you whitewashed wall
  simplified_phrase: you whitewashed wall
  preserved_meaning: Paul uses a vivid image of outward respectability hiding inward corruption.
  reasoning_layer_used: Lexical decision for τοῖχε κεκονιαμένε
  rationale: The metaphor remains in the text because replacing it would weaken the rebuke.
translation_notes:
  risk_flags:
  - risk: Modern readers may not understand the insult “whitewashed wall.”
    mitigation: A brief footnote explains its contrast between outward cleanliness and inward corruption.
  - risk: “About to strike” may imply greater immediacy than a simple future.
    mitigation: The footnote preserves the future alternative and notes the possible emphasis on imminence.
