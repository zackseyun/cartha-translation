translation:
  language: en
  text: 'Paul knew that the council had two groups: one group was Sadducees, and the other was Pharisees. So he called out in the council,[a] “Men and brothers, I am a Pharisee, a son of Pharisees.[b] I am on trial because of the hope and resurrection of the dead.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “in the Sanhedrin,” the Jewish ruling council.
    reason: lexical_alternative
  - marker: b
    text: This may mean “a son of Pharisee parents” or “a descendant of Pharisees.”
    reason: alternative_reading
  - marker: c
    text: Or “because of the hope of the resurrection of the dead.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: knowing that one part were Sadducees and the other Pharisees
  simplified_phrase: 'knew that the council had two groups: one group was Sadducees, and the other was Pharisees'
  preserved_meaning: Paul recognized the two groups represented within the council.
  reasoning_layer_used: Lexical decisions for Γνοὺς and τὸ ἓν μέρος ... τὸ δὲ ἕτερον.
  rationale: A direct sentence explains the council’s composition without implying that a dispute had already begun.
- pob_phrase: Men, brothers
  simplified_phrase: Men and brothers
  preserved_meaning: Paul addresses the male council members with both source vocatives intact.
  reasoning_layer_used: Lexical decision for Ἄνδρες ἀδελφοί.
  rationale: The conjunction reads naturally without adding the unsupported possessive “my.”
- pob_phrase: I am being judged
  simplified_phrase: I am on trial
  preserved_meaning: Paul is currently facing judicial proceedings.
  reasoning_layer_used: Lexical decision for κρίνομαι.
  rationale: “On trial” is clear, ordinary legal English for Paul’s present situation.
translation_notes:
  risk_flags:
  - risk: “A son of Pharisees” remains an unfamiliar and ambiguous family expression.
    mitigation: The main text preserves the source ambiguity, and footnote b gives the leading senses.
  - risk: Readers may understand “hope” and “resurrection” as entirely separate matters.
    mitigation: The coordinated wording follows POB, while footnote c preserves the possible unified sense.
