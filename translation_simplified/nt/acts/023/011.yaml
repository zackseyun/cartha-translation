simplification_decisions:
- pob_phrase: But on the following night
  simplified_phrase: The next night
  preserved_meaning: The Lord came to Paul during the night that followed.
  reasoning_layer_used: Lexical decision for Τῇ δὲ ἐπιούσῃ νυκτί
  rationale: This uses the clearest modern time expression while allowing the mild connector to remain implicit.
- pob_phrase: stood by him
  simplified_phrase: stood beside him
  preserved_meaning: The Lord stood near Paul in a personally supportive presence.
  reasoning_layer_used: Lexical decision for ἐπιστάς αὐτῷ
  rationale: “Beside” makes the Lord's nearness immediately clear without reducing the scene to an appearance.
- pob_phrase: for just as you have testified about me in Jerusalem, so you must also testify in Rome
  simplified_phrase: because just as you testified about me in Jerusalem, you must also testify in Rome
  preserved_meaning: Paul's testimony in Jerusalem grounds the assurance that he is also required to testify in Rome.
  reasoning_layer_used: Lexical decisions for διεμαρτύρω, οὕτω, σε δεῖ, and μαρτυρῆσαι
  rationale: The single sentence preserves both the reason for courage and the direct correspondence between the two cities.
translation_notes:
  risk_flags:
  - risk: Omitting a separate English equivalent for “so” could slightly soften the balanced Greek construction.
    mitigation: The paired wording “just as” and “also” clearly retains the correspondence between Jerusalem and Rome.
