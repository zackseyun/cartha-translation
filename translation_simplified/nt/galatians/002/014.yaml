translation:
  language: en
  text: But when I saw that they were not living in line with the truth of the gospel, I said to Cephas in front of everyone, “If you are a Jew but live like a Gentile rather than like a Jew, how do you force the Gentiles to live like Jews?”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: were not walking in step with the truth of the gospel
  simplified_phrase: were not living in line with the truth of the gospel
  preserved_meaning: Their conduct did not conform to the truth of the gospel.
  reasoning_layer_used: Lexical decisions for ὀρθοποδοῦσιν and πρὸς τὴν ἀλήθειαν τοῦ εὐαγγελίου
  rationale: This states the conduct clearly while preserving the alignment metaphor.
- pob_phrase: before them all
  simplified_phrase: in front of everyone
  preserved_meaning: Paul confronted Cephas publicly.
  reasoning_layer_used: Source text and POB translation
  rationale: This common wording makes the public setting immediately clear.
- pob_phrase: If you, though a Jew, live like a Gentile and not like a Jew, how do you compel the Gentiles to live like Jews?
  simplified_phrase: If you are a Jew but live like a Gentile rather than like a Jew, how do you force the Gentiles to live like Jews?
  preserved_meaning: Paul exposes the inconsistency between Cephas’s conduct and his coercion of Gentiles.
  reasoning_layer_used: Lexical and theological decisions for ἐθνικῶς, Ἰουδαϊκῶς, ἀναγκάζεις, and Ἰουδαΐζειν
  rationale: The conditional contrast remains intact, while common wording preserves the question’s force.
translation_notes:
