  text: Before some men came from James[a], he regularly ate with the Gentiles. But when they came, he began to pull away and separate himself because he was afraid of those of the circumcision.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “From James” may mean that they were associated with James; the Greek does not say that James formally sent them.
    reason: alternative_reading
  - marker: b
    text: “Those of the circumcision” may refer to a group or party identified with circumcision.
    reason: lexical_alternative
