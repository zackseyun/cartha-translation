translation:
  language: en
  text: Instead, they recognized that I had been entrusted with taking the gospel to the uncircumcised,[a] just as Peter had been entrusted with taking it to the circumcised.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “the uncircumcised” refers mainly to Gentiles, while “the circumcised” refers mainly to Jews; the wording preserves circumcision as the covenant marker Paul uses.
