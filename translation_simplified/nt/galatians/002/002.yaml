translation:
  language: en
  text: But I went up because a revelation prompted me.[a] I presented to them the gospel I preach among the Gentiles. But I presented it privately to those regarded as important.[b] I did this because I was concerned that I might be running in vain, or that I had already done so.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “I went up in response to a revelation.”
    reason: lexical_alternative
  - marker: b
    text: Or, “those who seemed influential.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: I went up in response to a revelation
  simplified_phrase: I went up because a revelation prompted me
  preserved_meaning: A revelation was the basis for and prompted Paul’s journey.
  reasoning_layer_used: Lexical decision for κατὰ ἀποκάλυψιν
  rationale: The active wording makes the connection clear while the footnote preserves the POB alternative.
- pob_phrase: I laid before them the gospel that I proclaim
  simplified_phrase: I presented to them the gospel I preach
  preserved_meaning: Paul set his gospel message before others for consideration without implying submission to their authority.
  reasoning_layer_used: Lexical and theological decisions for ἀνεθέμην
  rationale: “Presented” is common English and keeps the wording neutral about approval or authorization.
- pob_phrase: privately before those of repute
  simplified_phrase: privately to those regarded as important
  preserved_meaning: Paul addressed in private the people who were viewed as significant.
  reasoning_layer_used: Lexical decisions for κατ’ ἰδίαν and τοῖς δοκοῦσιν
  rationale: The revision replaces an uncommon expression while preserving the qualified sense of public reputation.
interpretive_expansions:
- pob_phrase: lest somehow I should be running, or had run, in vain
  rendering: I did this because I was concerned that I might be running in vain, or that I had already done so
  claim: The final clause states Paul’s concern about both his present effort and his past labor proving fruitless.
  evidence:
  - The POB lexical rationale identifies concern about fruitless labor and preserves the present-past contrast.
  - The immediate purpose clause connects this concern with Paul’s private presentation.
  confidence: high
  alternatives_preserved:
  - The running image remains rather than being reduced to a general statement about failure.
