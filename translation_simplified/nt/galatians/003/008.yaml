translation:
  language: en
  text: 'Scripture saw ahead of time that God declares the nations righteous through faith.[a] So it announced the good news to Abraham in advance: “In you all the nations will be blessed.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word can also mean “the Gentiles.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the Scripture, foreseeing that
  simplified_phrase: Scripture saw ahead of time that
  preserved_meaning: Scripture is personified as knowing beforehand what God does.
  reasoning_layer_used: Lexical decisions for προϊδοῦσα and ἡ γραφή
  rationale: The active clause is easier to read while preserving the personification and prior perception.
- pob_phrase: God justifies the nations by faith
  simplified_phrase: God declares the nations righteous through faith
  preserved_meaning: God grants the nations a righteous standing on the basis of faith.
  reasoning_layer_used: Lexical decisions for δικαιοῖ, ἐκ πίστεως, and ἔθνη
  rationale: This explains “justifies” while retaining the present tense, “nations,” and the role of faith.
- pob_phrase: proclaimed the good news beforehand to Abraham
  simplified_phrase: announced the good news to Abraham in advance
  preserved_meaning: The promise to Abraham was an advance announcement of the good news.
  reasoning_layer_used: Lexical decision for προευηγγελίσατο
  rationale: Ordinary word order improves clarity without losing the gospel sense or timing.
interpretive_expansions:
- pob_phrase: justifies
  rendering: declares ... righteous
  claim: Justification here means that God grants a righteous standing.
  evidence:
