simplification_decisions:
- pob_phrase: Is the law then against the promises of God?
  simplified_phrase: Does this mean that the law opposes God’s promises?
  preserved_meaning: Paul asks whether his argument makes law opposed to God’s promises.
  reasoning_layer_used: Lexical decisions for νόμος, κατά, and ἐπαγγελιῶν
  rationale: The recast question makes the logical connection clear while preserving law, opposition, and the plural promises.
- pob_phrase: May it never be!
  simplified_phrase: Certainly not!
  preserved_meaning: Paul forcefully rejects the idea.
  reasoning_layer_used: Lexical decision for μὴ γένοιτο
  rationale: The idiomatic wording is immediately clear and retains Paul’s emphatic denial.
- pob_phrase: was able to give life ... righteousness really would have been from the law
  simplified_phrase: could give life ... righteousness really would come from the law
  preserved_meaning: Only a life-giving law could make righteousness come from law.
  reasoning_layer_used: Lexical decisions for δυνάμενος, ζῳοποιῆσαι, ὄντως, ἐκ νόμου, and δικαιοσύνη
  rationale: The smoother conditional keeps the life-giving claim, emphasis, and source relationship intact.
translation_notes:
  risk_flags:
  - risk: “Certainly not!” does not preserve the form of Paul’s repudiation formula as closely as POB.
    mitigation: It is an approved lexical alternative and preserves the formula’s strong force.
  - risk: “Righteousness” may be unfamiliar or understood only as personal morality.
    mitigation: The term is retained because it protects the Pauline concept, with “justice” noted as an alternative.
