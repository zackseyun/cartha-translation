translation:
  language: en
  text: Does this mean that the law opposes God’s promises? Certainly not! If a law had been given that could give life, then righteousness[a] really would come from the law.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “justice.”
