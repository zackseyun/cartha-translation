  preserved_meaning: Their standing is characterized by the works required by the law without specifying reliance as the only interpretation.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: This clarifies the opaque phrase while preserving its documented interpretive tension.
- pob_phrase: does not remain in all the things written
  simplified_phrase: does not continue to do everything written
  preserved_meaning: The curse applies to anyone who fails to persist in complete obedience.
  reasoning_layer_used: POB lexical decisions for ἐμμένει and πᾶσιν
  rationale: This makes ongoing and comprehensive obedience clear in natural English.
- pob_phrase: to do them
  simplified_phrase: continue to do everything
  preserved_meaning: The law’s written requirements must be carried out in practice.
  reasoning_layer_used: POB lexical decision for ποιέω
  rationale: The purpose phrase is integrated into the quotation without weakening its demand.
interpretive_expansions:
