translation:
  language: en
  text: Are you so foolish? You began by the Spirit.[a] Are you now being brought to maturity by the flesh?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “in the Spirit.”
    reason: lexical_alternative
  - marker: b
    text: “The flesh” may refer to human effort or to the sinful nature. Paul’s wording does not limit it to either one.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Having begun by the Spirit
  simplified_phrase: You began by the Spirit.
  preserved_meaning: Their spiritual life began through the Holy Spirit before their present change of course.
  reasoning_layer_used: Lexical decision for ἐναρξάμενοι and theological decision identifying πνεύματι as the Holy Spirit.
  rationale: A direct sentence replaces the awkward participle while keeping the earlier action clear.
- pob_phrase: are you now being perfected
  simplified_phrase: Are you now being brought to maturity
  preserved_meaning: Paul asks whether they are now being brought toward spiritual completion through a different means.
  reasoning_layer_used: Lexical decision for ἐπιτελεῖσθε.
  rationale: “Brought to maturity” clearly expresses the process without suggesting sinless perfection.
- pob_phrase: by the flesh
  simplified_phrase: by the flesh
  preserved_meaning: Paul contrasts the Holy Spirit’s agency with fleshly means without restricting the term to one possible sense.
  reasoning_layer_used: Lexical and theological decisions for σαρκὶ.
  rationale: The term is retained because a single plain-language gloss would erase its documented ambiguity.
translation_notes:
  risk_flags:
  - risk: Modern readers may understand “flesh” as only the physical body.
    mitigation: The footnote gives the possible contextual senses without deciding between them.
