translation:
  language: en
  text: If receiving the inheritance depends on the law, it no longer depends on a promise. But God has graciously given the inheritance to Abraham through a promise.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: if the inheritance is from the law
  simplified_phrase: if receiving the inheritance depends on the law
  preserved_meaning: The inheritance would have the law as its basis rather than the promise.
  reasoning_layer_used: The lexical decisions for κληρονομία and ἐκ νόμου preserve the contrast between inheritance, law, and promise.
  rationale: The active wording makes the basis of receiving the inheritance easier to understand.
- pob_phrase: it is no longer from a promise
  simplified_phrase: it no longer depends on a promise
  preserved_meaning: Law and promise cannot both be the basis of the inheritance.
  reasoning_layer_used: The lexical rationale for οὐκέτι identifies Paul's exclusion between the two grounds.
  rationale: Repeating “depends on” makes Paul's contrast direct and easy to follow.
- pob_phrase: God has graciously given it to Abraham
  simplified_phrase: God has graciously given the inheritance to Abraham
  preserved_meaning: God freely granted Abraham the inheritance and the gift remains effective.
  reasoning_layer_used: The lexical and theological decisions require the grace-colored force and perfect tense of κεχάρισται.
  rationale: Repeating “the inheritance” removes an unclear pronoun without weakening the gracious gift.
translation_notes:
  risk_flags:
  - risk: “Depends on” is less spatially literal than POB's “from.”
    mitigation: It preserves the documented source-or-basis contrast between the law and a promise.
