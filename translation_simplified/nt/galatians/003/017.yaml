  reasoning_layer_used: POB lexical and theological decisions for διαθήκη and προκεκυρωμένην
  rationale: The active sentence is easier to follow while retaining “covenant” and its prior confirmation by God.
- pob_phrase: does not invalidate ... so as to abolish the promise
