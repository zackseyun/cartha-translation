  preserved_meaning: The law and faith operate on contrasting principles.
  reasoning_layer_used: lexical and theological decisions
  rationale: “Based on” is an approved lexical alternative that makes the contrast clearer without resolving its tension.
- pob_phrase: The one who does them
  simplified_phrase: The one who obeys its commands
  preserved_meaning: The quotation speaks of carrying out what the law commands.
  reasoning_layer_used: lexical decision for ὁ ποιήσας and αὐτά
  rationale: “Obeys its commands” identifies the action and object in natural English.
