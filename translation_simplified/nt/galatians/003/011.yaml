simplification_decisions:
- pob_phrase: It is evident that
  simplified_phrase: 'This is clear:'
  preserved_meaning: Paul presents the claim as plainly established.
  reasoning_layer_used: Lexical decision for δῆλον
  rationale: “Clear” is more familiar than “evident” and the colon introduces the claim naturally.
- pob_phrase: is justified before God
  simplified_phrase: is declared right in God’s sight
  preserved_meaning: The phrase describes a person’s standing under God’s judgment.
  reasoning_layer_used: Lexical decisions for δικαιοῦται and παρὰ τῷ θεῷ
  rationale: The wording explains the judicial sense of “justified” without losing God’s role as judge.
translation_notes:
  risk_flags:
