  preserved_meaning: Paul is drawing attention to the grammatical form of the quoted promise.
  reasoning_layer_used: source syntax and lexical rationale for τοῖς σπέρμασιν
  rationale: Naming “the wording” makes the grammatical argument easier to follow.
- pob_phrase: as referring to many, but as referring to one
  simplified_phrase: as though it meant many. It speaks of one
  preserved_meaning: The contrast between a plural reference and a singular reference remains explicit.
  reasoning_layer_used: lexical decisions for ὡς ἐπὶ πολλῶν and ἀλλ’ ὡς ἐφ’ ἑνός
  rationale: Two short sentences replace the dense contrast without weakening it.
- pob_phrase: who is Messiah
  simplified_phrase: That offspring is Messiah
  preserved_meaning: Paul identifies the singular promised offspring as Messiah.
  reasoning_layer_used: theological decision for Χριστός
  rationale: Repeating “offspring” removes an unclear pronoun while retaining the required title.
