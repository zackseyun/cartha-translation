translation:
  language: en
  text: 'The promises were spoken to Abraham and to his offspring.[a] The wording does not use the plural “offsprings,” as though it meant many. It speaks of one: “and to your offspring.” That offspring is Messiah.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word can also be translated “seed.” It is singular in form but can refer collectively to descendants.
    reason: lexical_alternative
