simplification_decisions:
- pob_phrase: the one who supplies the Spirit to you
  simplified_phrase: God give you the Spirit
  preserved_meaning: God is the one who continually provides the Spirit.
  reasoning_layer_used: lexical decision and immediate rhetorical context
  rationale: Naming God and using “give” makes the implied subject and action immediately clear.
- pob_phrase: by works of the law
  simplified_phrase: because you obey the law
  preserved_meaning: The Spirit and miracles do not result from doing what the Mosaic law requires.
  reasoning_layer_used: lexical rationale for ἐξ ἔργων νόμου
  rationale: The concrete wording explains the standard Pauline phrase without changing the contrast.
- pob_phrase: by hearing with faith
  simplified_phrase: because you hear the message and respond with faith
  preserved_meaning: The Galatians receive God's work through faith accompanying what they hear.
  reasoning_layer_used: lexical and theological decision for ἀκοῆς πίστεως
  rationale: The wording separates hearing and faith clearly while retaining their close connection.
