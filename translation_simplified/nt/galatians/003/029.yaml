  text: And if you belong to the Messiah, then you are Abraham’s seed.[a] You are heirs in keeping with the promise.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Seed” is singular here, but it refers collectively to Abraham’s descendants and echoes Paul’s wording earlier in this chapter.
    reason: simplification_note
