translation:
  language: en
  text: Once again, I solemnly declare that every person who submits to circumcision is obligated to obey the whole law.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek can also be translated “who is circumcised.” Here the context points to someone submitting to circumcision in this dispute.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: And I testify again
  simplified_phrase: Once again, I solemnly declare
  preserved_meaning: Paul repeats his statement with the force of a formal personal assertion.
  reasoning_layer_used: Lexical decision for μαρτύρομαι and πάλιν
  rationale: This uses a clear lexical alternative while retaining the statement’s solemn emphasis.
- pob_phrase: to every man who receives circumcision
  simplified_phrase: that every person who submits to circumcision
  preserved_meaning: The warning applies individually to anyone undergoing circumcision in the Galatian dispute.
  reasoning_layer_used: Lexical and theological decisions for παντὶ ἀνθρώπῳ and περιτεμνομένῳ
  rationale: “Every person” makes the generic sense clear, while “submits” preserves the contextual focus.
- pob_phrase: keep the whole law
  simplified_phrase: obey the whole law
  preserved_meaning: Accepting this obligation requires obedience to the law in its entirety.
  reasoning_layer_used: Lexical decisions for ὅλον τὸν νόμον and ποιῆσαι
  rationale: “Obey” is more immediately understandable than the biblical idiom “keep” without weakening total obligation.
