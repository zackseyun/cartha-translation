translation:
  language: en
  text: Those of you who seek to be declared right with God by obeying law[a] have been severed from the Messiah.[b] You have fallen away from grace.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More formally, “who are being justified by law.” Paul is addressing those who seek justification on the basis of obeying law.
    reason: lexical_alternative
