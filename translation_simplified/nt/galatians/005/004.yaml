  preserved_meaning: Paul directly identifies those seeking a righteous standing through law.
  reasoning_layer_used: Lexical decision for δικαιοῦσθε and its contextual rationale
  rationale: The wording explains “justified” while preserving the chosen sense of seeking it.
- pob_phrase: by law
  simplified_phrase: by obeying law
  preserved_meaning: Law observance is treated as the basis for justification.
  reasoning_layer_used: Lexical decision for ἐν νόμῳ
  rationale: The added verb makes the means of seeking justification clear to a new reader.
- pob_phrase: have been severed from the Messiah; you have fallen away from grace
  simplified_phrase: have been severed from the Messiah. You have fallen away from grace.
  preserved_meaning: Both severe relational images remain distinct and unresolved doctrinally.
  reasoning_layer_used: Lexical and theological decisions for κατηργήθητε and ἐξεπέσατε
  rationale: Splitting the clauses improves readability without weakening either warning.
interpretive_expansions:
- pob_phrase: justified by law
  rendering: declared right with God by obeying law
  claim: Justification concerns righteous standing before God sought on the basis of law observance.
