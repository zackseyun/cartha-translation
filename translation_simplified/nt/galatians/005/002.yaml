simplification_decisions:
- pob_phrase: 'Look:'
  simplified_phrase: Pay attention!
  preserved_meaning: Paul opens with an emphatic call for attention.
  reasoning_layer_used: Lexical decision for Ἴδε as an attention-getting particle.
  rationale: The command makes the warning’s force clear in natural English.
- pob_phrase: if you receive circumcision
  simplified_phrase: if you let yourselves be circumcised
  preserved_meaning: The readers would submit to and undergo circumcision.
  reasoning_layer_used: Documented lexical alternative for ἐὰν περιτέμνησθε.
  rationale: This wording is easier to understand while preserving the passive sense.
- pob_phrase: will benefit you nothing
  simplified_phrase: will not benefit you at all
  preserved_meaning: The Messiah would provide no benefit under these conditions.
  reasoning_layer_used: Lexical rationale for the total force of οὐδὲν ὠφελήσει.
  rationale: The natural negative construction preserves the statement’s total force.
translation_notes:
  risk_flags:
  - risk: The warning could be mistaken for a condemnation of circumcision in every setting.
    mitigation: The footnote limits its explanation to circumcision accepted as necessary for being made right with God.
