translation:
  language: en
  text: That is because what the flesh[a] wants is against the Spirit[b], and what the Spirit wants is against the flesh. They are in conflict with each other, so you do not do whatever you want.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “The flesh” is Paul’s term here for fallen human desires; it does not mean only the physical body. It may also be translated “the sinful nature.”
    reason: lexical_alternative
  - marker: b
    text: Or “the human spirit,” though the context favors the Holy Spirit.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: For the flesh desires what is against the Spirit
  simplified_phrase: That is because what the flesh wants is against the Spirit
  preserved_meaning: The flesh desires what conflicts with the Holy Spirit.
  reasoning_layer_used: Lexical decisions for σάρξ, ἐπιθυμεῖ, and πνεῦμα
  rationale: The clause is recast in ordinary English while retaining “flesh” and the likely reference to the Holy Spirit.
- pob_phrase: and the Spirit what is against the flesh
  simplified_phrase: and what the Spirit wants is against the flesh
  preserved_meaning: The Spirit’s desire is opposed to the flesh.
  reasoning_layer_used: POB ellipsis and adversative construction
  rationale: Repeating “what” and “wants” makes the implied verb clear without changing the mutual opposition.
- pob_phrase: for these oppose each other
  simplified_phrase: They are in conflict with each other
  preserved_meaning: The flesh and the Spirit actively oppose one another.
  reasoning_layer_used: Lexical decision for ἀλλήλοις ἀντίκειται
  rationale: “In conflict” expresses the same mutual hostility in familiar language.
translation_notes:
  risk_flags:
