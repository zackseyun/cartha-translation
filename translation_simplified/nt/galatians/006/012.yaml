translation:
  language: en
  text: Those who want to make a good impression through outward religious practices involving the body[a] are the very ones forcing you to be circumcised. They are doing this only to avoid being persecuted because of the cross of the Messiah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “make a good showing in the flesh”; here “flesh” points to outward bodily matters, especially circumcision.
    reason: simplification_note
  - marker: b
    text: 'Traditional: “the cross of Christ.”'
    reason: alternative_reading
