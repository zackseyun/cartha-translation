translation:
  language: en
  text: Let us not grow tired of doing good. At the right time, we will reap a harvest if we do not give up.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: let us not grow weary in doing good
  simplified_phrase: Let us not grow tired of doing good
  preserved_meaning: We are urged to keep doing what is good despite fatigue or discouragement.
  reasoning_layer_used: POB lexical decisions for μὴ ἐγκακῶμεν and τὸ καλὸν
  rationale: “Grow tired” expresses the ongoing pressure to lose heart in familiar English.
- pob_phrase: in due time
  simplified_phrase: At the right time
  preserved_meaning: The harvest will come at its fitting or appointed time.
  reasoning_layer_used: POB lexical decision for καιρῷ ἰδίῳ
  rationale: “At the right time” makes the timing clear without specifying when it will be.
- pob_phrase: we will reap
  simplified_phrase: we will reap a harvest
  preserved_meaning: Paul’s agricultural image promises a future result from persevering in good.
  reasoning_layer_used: POB lexical decision for θερίσομεν and surrounding agricultural context
  rationale: Adding “a harvest” helps readers immediately understand the verb while preserving the image.
translation_notes:
  risk_flags:
  - risk: “Grow tired” could be heard as only physical fatigue rather than discouragement.
    mitigation: The command to keep doing good and the closing phrase “do not give up” preserve the perseverance sense.
  - risk: Adding “a harvest” supplies an object that is implicit in “reap.”
    mitigation: The added noun clarifies rather than explains away the source’s agricultural metaphor.
