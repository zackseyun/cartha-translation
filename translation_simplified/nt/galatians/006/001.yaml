  reasoning_layer_used: POB lexical decision for ἔν τινι παραπτώματι
  rationale: “Wrongdoing” is clearer to readers unfamiliar with the biblical use of “trespass.”
- pob_phrase: restore such a one
  simplified_phrase: restore him
  preserved_meaning: The spiritual believers are to help the person return to a proper condition.
  reasoning_layer_used: POB lexical decisions for καταρτίζετε and τὸν τοιοῦτον
  rationale: The pronoun removes a formal expression while keeping the singular person in view.
- pob_phrase: watching yourself, lest you also be tempted
  simplified_phrase: But watch yourself carefully, so that you too are not tempted
  preserved_meaning: The person restoring another must remain alert to his own vulnerability to temptation.
  reasoning_layer_used: POB lexical decisions for σκοπῶν σεαυτόν and μὴ καὶ σὺ πειρασθῇς
  rationale: A separate sentence makes the warning and its purpose easier to follow.
