translation:
  language: en
  text: Brothers[a], even if a man[c] is caught in some wrongdoing,[b] those of you who are spiritual should restore him with a spirit of gentleness. But watch yourself carefully, so that you too are not tempted.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Brothers” can address a mixed group of fellow believers; compare “brothers and sisters.”
    reason: lexical_alternative
  - marker: b
    text: Or “is overtaken” or “is caught by surprise” in some wrongdoing.
    reason: alternative_reading
  - marker: c
    text: “A man” is a singular generic term here; alternatively, “someone” or “a person.”
    reason: lexical_alternative
