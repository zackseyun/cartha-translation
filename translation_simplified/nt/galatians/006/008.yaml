  language: en
  text: For whoever sows by living for their own flesh[a] will harvest ruin[b] from the flesh. But whoever sows by living for the Spirit[c] will harvest eternal life from the Spirit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “their own sinful nature.” Paul uses “flesh” here in an ethical contrast with the Spirit.
    reason: lexical_alternative
  - marker: b
