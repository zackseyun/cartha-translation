translation:
  language: en
  text: So then, whenever we have an opportunity, let us do good to everyone, especially to those who belong to the family of faith.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Faith” may also mean “the faith,” the Christian confession believers share.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: as we have opportunity
  simplified_phrase: whenever we have an opportunity
  preserved_meaning: The community should act at every fitting opportunity.
  reasoning_layer_used: Lexical decision for καιρός and the ongoing force of the exhortation
  rationale: “Whenever” makes the repeated call to use fitting occasions clear.
- pob_phrase: do what is good toward everyone
  simplified_phrase: do good to everyone
  preserved_meaning: Good is to be done for all people without exception.
  reasoning_layer_used: Lexical decisions for τὸ ἀγαθόν and πρὸς πάντας
  rationale: The shorter expression is natural English and keeps the universal scope.
- pob_phrase: those who are of the household of faith
  simplified_phrase: those who belong to the family of faith
  preserved_meaning: Fellow believers receive special priority within the command to help everyone.
  reasoning_layer_used: Lexical and theological decisions for οἰκείους τῆς πίστεως
  rationale: “Family” preserves the household image while “belong” clearly identifies its members.
translation_notes:
  risk_flags:
  - risk: “Family of faith” could be heard as a biological family.
    mitigation: “Those who belong to” and the footnote identify a community formed by shared faith.
