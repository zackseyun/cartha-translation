  preserved_meaning: Each individual is commanded to evaluate the quality of his own conduct.
  reasoning_layer_used: Lexical decisions for δοκιμαζέτω, ἕκαστος, and ἔργον
  rationale: “Examine” expresses deliberate testing in familiar English without implying a favorable result.
- pob_phrase: he will have his reason for boasting in himself alone and not in the other person
  simplified_phrase: he will have a reason for boasting about himself alone, not about someone else
  preserved_meaning: The basis or matter of boasting concerns oneself rather than another person.
  reasoning_layer_used: Lexical rationales for καύχημα, εἰς ἑαυτὸν μόνον, and τὸν ἕτερον
  rationale: “About” makes the personal contrast natural without claiming that his work causes the boasting.
