simplification_decisions:
- pob_phrase: let no one cause me trouble
  simplified_phrase: no one should cause me any more trouble
  preserved_meaning: Paul commands others to stop troubling him from this point onward.
  reasoning_layer_used: Lexical decision for κόπους παρέχειν and the temporal force of Τοῦ λοιποῦ.
  rationale: The wording turns the third-person command into direct modern English while keeping its force.
- pob_phrase: for I bear
  simplified_phrase: because I carry
  preserved_meaning: Paul gives the marks on his body as the reason others should not trouble him.
  reasoning_layer_used: Lexical decision for βαστάζω and the clause’s explanatory connection.
  rationale: “Because I carry” is clearer common English without weakening the solemn claim.
- pob_phrase: the marks of Jesus on my body
  simplified_phrase: the marks of Jesus on my body
  preserved_meaning: The marks are bodily and connected with Jesus, without defining their exact nature.
  reasoning_layer_used: Theological decision to preserve ambiguity around στίγματα and τοῦ Ἰησοῦ.
  rationale: The key wording remains because a more explicit paraphrase would resolve an intentional ambiguity.
translation_notes:
  risk_flags:
  - risk: Readers may assume the marks are only literal scars or only symbolic brands.
    mitigation: The neutral main text and lexical footnote preserve both physical and allegiance-related possibilities.
