translation:
  language: en
  text: May peace and mercy be upon all who keep in step with this standard, and upon the Israel of God.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “The Israel of God” may mean believing Jews, the whole church, or God’s people more broadly.
    reason: alternative_reading
  - marker: b
    text: The word “and” may add another group or restate the first group as “the Israel of God.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: as many as will walk by this rule
  simplified_phrase: all who keep in step with this standard
  preserved_meaning: Those who order their lives by the stated norm are in view, and the walking-in-line image remains.
  reasoning_layer_used: Lexical decisions for ὅσοι, κανόνι, and στοιχήσουσιν
  rationale: This uses common English while preserving the source verb’s picture of walking in line.
- pob_phrase: peace be upon them and mercy
  simplified_phrase: May peace and mercy be upon all who
  preserved_meaning: Paul pronounces a blessing of both peace and mercy on the identified people.
  reasoning_layer_used: Lexical decisions for εἰρήνη, ἔλεος, and ἐπί
  rationale: Reordering the blessing makes the sentence natural without weakening its solemn tone.
- pob_phrase: and upon the Israel of God
  simplified_phrase: and upon the Israel of God
  preserved_meaning: The debated identity of this group and the force of the final conjunction remain unresolved.
  reasoning_layer_used: Theological decisions on Ἰσραὴλ τοῦ θεοῦ and final καί
  rationale: The phrase stays literal because clearer substitutes would decide a disputed interpretation.
translation_notes:
  risk_flags:
