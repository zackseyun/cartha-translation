  reasoning_layer_used: Lexical decision for Ἔκβαλε
  rationale: “Throw out” is clearer modern English without softening the command.
- pob_phrase: the son of the slave woman
  simplified_phrase: her son
  preserved_meaning: The son remains clearly identified as the slave woman’s son.
  reasoning_layer_used: Immediate sentence context
  rationale: The pronoun avoids a heavy repetition while keeping the relationship clear.
- pob_phrase: will certainly not inherit with the son of the free woman
  simplified_phrase: will certainly not share the inheritance with the free woman’s son
  preserved_meaning: The emphatic exclusion from a shared inheritance remains intact.
  reasoning_layer_used: Lexical and theological decisions for οὐ μὴ κληρονομήσει and μετά
  rationale: “Share the inheritance” makes joint participation clearer to common readers.
