translation:
  language: en
  text: Because you are sons,[a] God sent the Spirit of his Son into our hearts.[b] The Spirit calls out, “Abba, Father.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Sons” includes all believers, not only males, and preserves Paul’s language about adoption and inheritance.
    reason: cultural_note
  - marker: b
    text: Some manuscripts read “your hearts” instead of “our hearts.”
    reason: textual_variant
  - marker: c
    text: Abba is an Aramaic way of addressing one’s father.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And because you are sons
  simplified_phrase: Because you are sons
  preserved_meaning: Their present status as sons is the reason God sent the Spirit.
  reasoning_layer_used: Lexical decision for ὅτι δέ and theological decision for υἱοί
  rationale: Dropping “And” makes the opening more natural without weakening the explanatory link.
- pob_phrase: God sent the Spirit of his Son into our hearts, crying
  simplified_phrase: God sent the Spirit of his Son into our hearts. The Spirit calls out
  preserved_meaning: God sent the Son’s Spirit, and the Spirit is the one who voices the cry.
  reasoning_layer_used: Lexical decisions for ἐξαπέστειλεν and κρᾶζον plus the theological decision on who is crying
  rationale: Two sentences remove the unclear participle and identify its subject directly.
- pob_phrase: Abba, Father
  simplified_phrase: Abba, Father
  preserved_meaning: The original Aramaic address and its meaning remain together.
  reasoning_layer_used: Lexical decisions for Αββα and ὁ πατήρ
  rationale: The phrase is retained because replacing Abba would erase Paul’s distinctive form of address.
translation_notes:
  risk_flags:
  - risk: Modern readers may take “sons” to exclude women.
    mitigation: The footnote explains that the inheritance status includes all believers.
  - risk: Separating the participle into a new sentence could seem to add a second action.
    mitigation: The wording keeps the Spirit’s call as the direct result of God sending the Spirit.
