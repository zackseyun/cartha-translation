translation:
  language: en
  text: My children, I am going through the pains of childbirth for you all over again, until Messiah[a] takes shape in you.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Christ.” “Messiah” translates the title Christ.
    reason: alternative_reading
  - marker: b
    text: Or “among you,” which may emphasize the whole community.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: for whom I am again suffering birth pains
  simplified_phrase: I am going through the pains of childbirth for you all over again
  preserved_meaning: Paul vividly compares his renewed suffering for them to labor pains.
  reasoning_layer_used: The lexical decisions preserve the childbirth image and the repeated action.
  rationale: Ordinary clause order makes the maternal metaphor easier to understand.
- pob_phrase: until Messiah is formed in you
  simplified_phrase: until Messiah takes shape in you
  preserved_meaning: Messiah’s character and life are developing within the believers.
  reasoning_layer_used: The lexical record lists “takes shape” while the theological decision avoids defining a doctrinal mechanism.
  rationale: “Takes shape” communicates gradual formation more naturally in modern English.
translation_notes:
  risk_flags:
