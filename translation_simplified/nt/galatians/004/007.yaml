translation:
  language: en
  text: So you are no longer a slave. You are now a son,[a] and since you are a son, you are also an heir through God.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “child.” The Greek says “son” to emphasize the legal status of an adopted heir, a status Paul applies to all believers.
    reason: lexical_alternative
  - marker: b
    text: Some manuscripts read “an heir of God through Christ” (or “through Messiah”).
    reason: textual_variant
simplification_decisions:
- pob_phrase: no longer a slave but a son
  simplified_phrase: no longer a slave. You are now a son
  preserved_meaning: The sharp change from bondage to full family status remains intact.
  reasoning_layer_used: The lexical and theological decisions retain “slave” and “son” as central to Paul’s argument.
  rationale: Two sentences make the contrast easier to grasp without weakening it.
- pob_phrase: and if a son, then also an heir
  simplified_phrase: and since you are a son, you are also an heir
  preserved_meaning: Sonship leads directly to receiving an inheritance.
  reasoning_layer_used: The immediate clause first declares the reader a son and then draws out its consequence.
  rationale: A complete causal sentence makes Paul’s compressed logic clear.
interpretive_expansions:
- pob_phrase: if a son
  rendering: since you are a son
  claim: The condition restates the sonship already affirmed rather than expressing uncertainty about it.
  evidence:
  - The preceding clause directly says, “You are now a son.”
  - The verse presents heirship as the consequence of that declared status.
  confidence: high
  alternatives_preserved:
  - if you are a son
translation_notes:
  risk_flags:
  - risk: Modern readers may take “son” as excluding women.
    mitigation: The footnote explains that this heir status applies to all believers.
  - risk: The final phrase has a notable manuscript variant.
    mitigation: The main text follows SBLGNT, while the alternate reading remains in a footnote.
