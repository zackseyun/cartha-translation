  text: But at that time, the son born in the ordinary human way[a] persecuted the son born according to the Spirit. The same thing is happening now.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “born according to the flesh.” Here this means birth by ordinary human means, not birth from a sinful nature.
    reason: lexical_alternative
