translation:
  language: en
  text: I was making more progress in Judaism[a] than many others my age among my people. I was far more zealous for the traditions handed down by my ancestors.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Judaism” can also mean “the Jewish religion” or, more broadly, “the Judean way of life.”
