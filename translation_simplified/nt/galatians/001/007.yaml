simplification_decisions:
- pob_phrase: which is not another gospel
  simplified_phrase: It is not another gospel at all.
  preserved_meaning: The message described in verse 6 is not a genuine second gospel.
  reasoning_layer_used: Immediate context and the lexical decision for ἄλλο
  rationale: A complete sentence removes the difficult opening relative clause while retaining its link to the preceding verse.
- pob_phrase: except that there are some who are troubling you
  simplified_phrase: What is happening is that some people are troubling you
  preserved_meaning: Paul explains that certain people are causing the Galatians distress and confusion.
  reasoning_layer_used: Lexical decisions for εἰ μή and ταράσσοντες
  rationale: The explanatory transition states the qualification in ordinary English.
- pob_phrase: wanting to distort the gospel of Messiah
  simplified_phrase: want to distort the gospel of the Messiah
  preserved_meaning: These people intend to corrupt the gospel belonging to or concerning Jesus in his messianic role.
  reasoning_layer_used: Lexical and theological decisions for θέλοντες, μεταστρέψαι, and Χριστοῦ
  rationale: A finite verb is easier to follow, while “distort,” “gospel,” and “Messiah” retain the audited choices.
translation_notes:
  risk_flags:
  - risk: “At all” slightly strengthens the English emphasis of the negation.
    mitigation: It clarifies Paul’s categorical denial without changing its substance.
