translation:
  language: en
  text: 'We said this before, and now I say it again: If anyone preaches to you a gospel that goes against the gospel you received, let that person be under a curse.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: As we have said before, so now I say again
  simplified_phrase: We said this before, and now I say it again
  preserved_meaning: Paul repeats a warning that was already given and stresses that he is saying it again now.
  reasoning_layer_used: POB lexical decisions for ὡς προειρήκαμεν and ἄρτι πάλιν λέγω
  rationale: The direct sentence is easier to follow while retaining both prior speech and present repetition.
- pob_phrase: contrary to what you received
  simplified_phrase: goes against the gospel you received
  preserved_meaning: The preached message deviates from the apostolic gospel the Galatians had received.
  reasoning_layer_used: POB lexical decisions for παρ’ ὃ and παρελάβετε
  rationale: “Goes against” expresses the adversarial force in common English.
- pob_phrase: let him be accursed
  simplified_phrase: let that person be under a curse
  preserved_meaning: The preacher is placed under a solemn curse without further doctrinal specification.
  reasoning_layer_used: POB lexical and theological decisions for ἀνάθεμα ἔστω
  rationale: This wording is clearer than “accursed” while preserving the warning’s severe judicial force.
interpretive_expansions:
- pob_phrase: what you received
  rendering: the gospel you received
  claim: What the Galatians received was the gospel message.
  evidence:
