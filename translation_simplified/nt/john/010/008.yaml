  source_alignment_notes: Maintains alignment with SBLGNT (πάντες ὅσοι ἦλθον πρὸ ἐμοῦ κλέπται εἰσὶν καὶ λῃσταί). The division between thieves (κλέπται) and robbers (λῃσταί) is preserved, as is the adversative 'but' (ἀλλ’) and the hearing metaphor (οὐκ ἤκουσαν).
  readability_notes:
  - The sentence flows naturally in modern English. It avoids archaic syntax while maintaining the solemn, authoritative tone of Christ's discourse.
  compression_notes:
  - No biblical text was compressed or omitted. The academic commentary in the original POB footnote was condensed and simplified to make it accessible to a general reader.
  risk_flags:
  - risk: There is a risk that readers might interpret 'All who came before me' as a condemnation of Moses and the Old Testament prophets. We mitigate this risk by keeping the footnote marker '[a]' and simplifying the footnote explanation to explicitly exclude God's true servants.
