translation:
  language: en
  text: Do you say of the one whom the Father set apart[a] and sent into the world, ‘You are blaspheming,’ because I said, ‘I am the Son of God’?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'consecrated' or 'sanctified'.
    reason: simplification_note
simplification_decisions:
- preserved_meaning: For modern readers, 'sanctified' often connotes a process of moral purification from sin, which is dogmatically misleading when applied to Jesus. 'Set apart' accurately renders the consecrating force of ἡγίασεν for his divine mission, avoiding both archaic liturgical terminology and theological confusion, while the footnote preserves 'sanctified' and 'consecrated' for reference.
  reasoning_layer_used: POB audit trail
  rationale: For modern readers, 'sanctified' often connotes a process of moral purification from sin, which is dogmatically misleading when applied to Jesus. 'Set apart' accurately renders the consecrating force of ἡγίασεν for his divine mission, avoiding both archaic liturgical terminology and theological confusion, while the footnote preserves 'sanctified' and 'consecrated' for reference.
