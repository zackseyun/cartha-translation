translation_notes:
  source_alignment_notes: The relative clause construction 'ὃν ὁ πατὴρ...' is rendered as 'the one whom the Father...', matching the POB lexical decision. The direct quote 'You are blaspheming' faithfully translates the present indicative 'Βλασφημεῖς', capturing the active nature of their accusation.
  readability_notes:
  - The sentence flow of the rhetorical question has been streamlined by resolving the potentially clunky 'sanctified' to 'set apart', which flows naturally with 'sent into the world' and allows modern readers to immediately grasp the logic of Jesus' argument without getting tripped up on archaic or heavily ecclesiastical jargon.
  compression_notes:
  - No clauses were deleted or compressed. The integrity of the original rhetorical structure (the comparison between the Father's consecration/sending and the opponents' charge of blasphemy based on Jesus' words) was fully preserved to maintain the intellectual force of the defense.
  risk_flags:
  - risk: There is a slight risk that 'set apart' lacks the explicit 'holiness' root present in ἡγίασεν. This risk is fully mitigated by adding 'sanctified' and 'consecrated' to the footnote, ensuring the theological link to holiness is accessible to interested readers.
    mitigation: Flag retained for reviewer attention.
