  text: I have other sheep that are not from this sheepfold. I must bring them also, and they will listen to my voice. Then there will be one flock[a], one shepherd.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek uses different words for “sheepfold,” an enclosure or pen, and “flock,” the gathered group of sheep. The final phrase is “one flock,” not “one sheepfold.”
    reason: simplification_note
