translation:
  language: en
  text: A hired hand is not the shepherd and does not own the sheep. When he sees a wolf coming, he leaves[a] the sheep and flees. Then the wolf snatches them and scatters them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'abandons the sheep.' The underlying Greek word can mean either 'leaves' or 'abandons' in a moment of danger.
    reason: simplification_note
