- pob_phrase: The hired hand, who is not a shepherd and whose sheep are not his own
  simplified_phrase: A hired hand is not the shepherd, and the sheep are not his own.
  preserved_meaning: The hired worker is neither the true shepherd nor personally bound to the sheep as his own.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: A direct sentence untangles the relative clauses while preserving both pastoral roles and personal belonging.
- pob_phrase: sees the wolf coming and leaves the sheep and flees
  simplified_phrase: When he sees a wolf coming, he leaves the sheep and flees.
  preserved_meaning: The approaching danger prompts him to desert the sheep and escape.
  reasoning_layer_used: POB lexical decisions
  rationale: The time clause presents the sequence naturally without weakening the vivid actions.
- pob_phrase: —and the wolf snatches them and scatters them
  simplified_phrase: Then the wolf snatches them and scatters them.
  preserved_meaning: The wolf violently takes the sheep and breaks them apart.
  reasoning_layer_used: POB lexical decisions
  rationale: A separate sentence replaces the heavy dash while retaining both predatory actions.
