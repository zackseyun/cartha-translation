translation:
  language: en
  text: A hired hand is not the shepherd, and the sheep are not his own. When he sees a wolf coming, he leaves[a] the sheep and flees. Then the wolf snatches them and scatters them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “abandons the sheep.” The word translated “leaves” can have the stronger sense of deserting them in danger.
    reason: lexical_alternative
