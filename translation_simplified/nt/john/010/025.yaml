translation_notes:
  source_alignment_notes: Maintains strict alignment with the SBLGNT text and POB constraints. The phrase 'in my Father's name' is kept in the main text to prevent flattening the theological depth of the 'name' concept into a simple modern synonym, while the alternative 'authority' reading is preserved in the footnote.
  readability_notes:
  - The awkward, interrupted structure of the POB's final clause ('these testify about me') is integrated into a clean, modern Subject-Verb-Object layout. Replacing 'and' with 'but' guides the modern reader's logic through the contrast in Jesus' statement.
  compression_notes:
  - Dropped the direct object 'them' from 'answered' and the resumptive pronoun 'these'. Neither of these minor omissions alters the lexical, theological, or narrative meaning.
