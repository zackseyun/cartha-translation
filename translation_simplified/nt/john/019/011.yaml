translation:
  language: en
  text: Jesus answered Pilate, “You would have no authority over me at all unless God had given it to you.[a] Therefore, the one who handed me over to you[b] has committed the greater sin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek says “from above,” which in John often points to God as the source; it may also be translated “from heaven.”
    reason: lexical_alternative
  - marker: b
    text: The one who handed Jesus over is not identified here; this may refer to Judas, Caiaphas, or the Jewish leadership more broadly.
    reason: alternative_reading
