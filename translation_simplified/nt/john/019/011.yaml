  rationale: Naming Pilate removes an unclear pronoun without adding a disputed identification.
- pob_phrase: unless it had been given to you from above
  simplified_phrase: unless God had given it to you
  preserved_meaning: Pilate’s authority came from a higher divine source.
  reasoning_layer_used: POB lexical and theological decisions for ἄνωθεν
  rationale: The clearer wording states the divine source established by the audit while the footnote preserves the Greek image.
- pob_phrase: has the greater sin
