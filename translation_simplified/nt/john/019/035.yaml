simplification_decisions:
- pob_phrase: the one who has seen
  simplified_phrase: the one who saw this
  preserved_meaning: Keeps the unidentified eyewitness and his completed act of seeing while supplying the clear contextual object.
  reasoning_layer_used: POB lexical decision and immediate context
  rationale: “Saw this” is natural English and refers to the event just described without identifying the witness.
- pob_phrase: that one knows
  simplified_phrase: he knows
  preserved_meaning: Keeps the witness in the third person without deciding whether he is the narrator or someone else.
  reasoning_layer_used: POB theological decision on the pronoun’s referent
  rationale: “He” removes awkward wording while preserving the intentionally unresolved identity.
- pob_phrase: and his testimony is true, and that one knows
  simplified_phrase: and his testimony is true. He knows
  preserved_meaning: Retains both the testimony’s truth and the witness’s knowledge of its truthfulness.
  reasoning_layer_used: POB translation and lexical decisions
  rationale: Dividing the long sentence makes the two claims easier to follow.
interpretive_expansions:
- pob_phrase: the one who has seen
  rendering: the one who saw this
  claim: The witness saw the event described immediately before this verse.
  evidence:
  - The objectless expression points back to the preceding account in its immediate context.
  - The grounding review approved “this” as a warranted contextual clarification.
  confidence: high
  alternatives_preserved:
  - the one who has seen
  - the eyewitness
translation_notes:
  risk_flags:
  - risk: “He” does not reproduce the full emphasis of the Greek demonstrative.
    mitigation: The third-person form still preserves the unidentified referent, while the natural wording serves common readers.
  - risk: “May believe” may be read only as beginning to believe.
    mitigation: The footnote preserves the possible ongoing sense, “may continue believing.”
