translation:
  language: en
  text: So the chief priests of the Jews[a] were saying to Pilate, “Do not write, ‘The King of the Jews.’ Instead, write, ‘That man said, “I am King of the Jews.”’”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Judeans.” The Greek term can mean Jews generally or Judeans more specifically, depending on the context.
    reason: alternative_reading
  - marker: b
    text: The final words may also be translated, “I am the King of the Jews.”
    reason: lexical_alternative
