translation:
  language: en
  text: After these things, Joseph from Arimathea, who was a disciple of Jesus but kept it hidden because he feared the Jews,[a] asked Pilate for permission to take away Jesus’s body. Pilate gave permission, so Joseph came and took away Jesus’s body.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In context, “the Jews” likely refers more specifically to the Judean or Jewish authorities opposed to Jesus, not to the Jewish people without distinction.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: being a disciple of Jesus but having kept it hidden because of fear of the Jews
  simplified_phrase: who was a disciple of Jesus but kept it hidden because he feared the Jews
  preserved_meaning: Joseph was Jesus’s disciple but concealed that fact out of fear.
  reasoning_layer_used: POB lexical decisions for ὢν μαθητὴς, κεκρυμμένος, and διὰ τὸν φόβον
  rationale: The relative clause and explicit subject replace dense participial wording with natural English.
- pob_phrase: asked Pilate that he might take away the body of Jesus
  simplified_phrase: asked Pilate for permission to take away Jesus’s body
  preserved_meaning: Joseph requested Pilate’s authorization to remove Jesus’s body.
  reasoning_layer_used: POB lexical decisions for ἠρώτησεν, ἵνα ἄρῃ, and ἐπέτρεψεν
  rationale: The request is expressed directly while retaining its purpose and Pilate’s authority.
- pob_phrase: So he came and took away his body
  simplified_phrase: so Joseph came and took away Jesus’s body
  preserved_meaning: After receiving permission, Joseph removed Jesus’s body.
  reasoning_layer_used: Greek referents and independent grounding review
  rationale: Repeating both names removes avoidable pronoun ambiguity.
translation_notes:
  risk_flags:
  - risk: “The Jews” may be misread as referring to all Jewish people.
    mitigation: The footnote preserves the wording while explaining its likely contextual reference.
