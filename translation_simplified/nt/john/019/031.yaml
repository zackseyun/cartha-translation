  text: Therefore the Jews[a] asked Pilate not to let the bodies remain on the cross during the Sabbath. It was the day of preparation before the Sabbath, and that Sabbath was especially important.[b] They also asked that the men's legs be broken and their bodies taken away.
  philosophy: optimal-equivalence
