translation:
  language: en
  text: Jesus’s mother, his mother’s sister, Mary the wife of Clopas,[a] and Mary Magdalene were standing by his cross.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek identifies her as “Mary of Clopas” but does not explicitly say how she was related to Clopas. The verse may name three women rather than four if Mary of Clopas was Jesus’s mother’s sister.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Standing by the cross of Jesus were his mother, and his mother's sister, Mary the wife of Clopas, and Mary Magdalene.
  simplified_phrase: Jesus’s mother, his mother’s sister, Mary the wife of Clopas, and Mary Magdalene were standing by his cross.
  preserved_meaning: The four women remain the grammatical subject, and “were standing” retains their continuing position near the cross.
  reasoning_layer_used: POB translation, lexical decisions, and theological decision
  rationale: Subject-first word order makes the list easier to follow without changing the durative action or preferred four-woman reading.
- pob_phrase: the cross of Jesus
  simplified_phrase: his cross
  preserved_meaning: The cross is still identified as the one on which Jesus was crucified.
  reasoning_layer_used: POB lexical decision for τοῦ Ἰησοῦ
  rationale: The pronoun avoids a stiff possessive phrase because Jesus is already named at the start.
