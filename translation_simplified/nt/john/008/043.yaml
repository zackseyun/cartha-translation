translation_notes:
  source_alignment_notes: The translation preserves the crucial lexical contrast between λαλιά (manner of speech) and λόγος (the message/word). It also strictly preserves the concept of inability (οὐ δύνασθε) through 'cannot' rather than softening it to moral unwillingness, adhering to the POB theological guardrails.
  readability_notes:
  - Smoothed the syntax by converting a clunky fragment into a complete sentence ('It is because...') and opting for 'the way I speak' to sound more natural to the modern ear without losing gravity.
  compression_notes:
  - Slightly compressed 'are not able to' into 'cannot' for idiomatic flow.
  risk_flags:
