translation:
  language: en
  text: Why do you not understand the way I speak? It is because you cannot hear my word[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Greek text makes a distinction here: ''the way I speak'' refers to Jesus''s manner of speaking, while ''my word'' refers to his message itself.'
    reason: simplification_note
simplification_decisions:
- simplified_phrase: the way I speak
  preserved_meaning: More natural in modern English while fully preserving the distinction from 'my word' (λαλιά vs. λόγος).
  reasoning_layer_used: POB audit trail
  rationale: More natural in modern English while fully preserving the distinction from 'my word' (λαλιά vs. λόγος).
- simplified_phrase: It is because you cannot hear my word
  preserved_meaning: Avoids starting a sentence with a fragmenting 'Because' in written English, and replaces the stiffer 'are not able to' with 'cannot' while retaining the strict sense of inability.
  reasoning_layer_used: POB audit trail
  rationale: Avoids starting a sentence with a fragmenting 'Because' in written English, and replaces the stiffer 'are not able to' with 'cannot' while retaining the strict sense of inability.
