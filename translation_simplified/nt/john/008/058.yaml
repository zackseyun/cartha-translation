  reasoning_layer_used: POB lexical decision for Ἀμὴν ἀμὴν and λέγω ὑμῖν
  rationale: The natural English formula conveys the force of the emphatic truth-introduction.
- pob_phrase: before Abraham came to be
  simplified_phrase: before Abraham came into existence
  preserved_meaning: Abraham began to exist, in contrast with Jesus’ absolute “I am.”
  reasoning_layer_used: POB lexical decision for γενέσθαι
  rationale: This wording is clearer while remaining broader than physical birth.
- pob_phrase: I am
