translation:
  language: en
  text: 'Jesus said to them, “I am telling you the truth: before Abraham came into existence,[a] I am.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “was born.” The Greek verb is broader than birth and can mean “came to be” or “came into existence.”
