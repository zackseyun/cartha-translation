  rationale: Parallel clauses are easier to understand than the formal neither-nor construction.
- pob_phrase: you would know my Father also
  simplified_phrase: you would know my Father too
  preserved_meaning: “Too” retains the added connection between knowing Jesus and knowing his Father.
