translation:
  language: en
  text: Jesus answered them, “Very truly I tell you, everyone who practices sin is a slave to sin.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'servant of sin.' The Greek word refers to a slave; 'slave' is used here to emphasize the idea of spiritual bondage.
    reason: simplification_note
simplification_decisions:
- preserved_meaning: Changed 'Truly, truly, I say to you' to 'Very truly I tell you' to modernize the solemn double-amen formula without losing its emphatic weight.
  reasoning_layer_used: POB audit trail
  rationale: Changed 'Truly, truly, I say to you' to 'Very truly I tell you' to modernize the solemn double-amen formula without losing its emphatic weight.
- preserved_meaning: Changed 'slave of sin' to 'slave to sin' to match modern English idiom for habitual bondage.
  reasoning_layer_used: POB audit trail
  rationale: Changed 'slave of sin' to 'slave to sin' to match modern English idiom for habitual bondage.
- preserved_meaning: Retained 'practices sin' to preserve the POB theological decision highlighting the continuous aspect of the Greek present participle (ποιῶν).
  reasoning_layer_used: POB audit trail
  rationale: Retained 'practices sin' to preserve the POB theological decision highlighting the continuous aspect of the Greek present participle (ποιῶν).
retained_terms:
- term: practices sin (retains the ongoing, characteristic nature of the Greek participle)
  reason: Retained to preserve POB's source-grounded terminology.
- term: slave (retains the strong theological metaphor of spiritual bondage, superior to 'servant' in this context)
  reason: Retained to preserve POB's source-grounded terminology.
translation_notes:
  source_alignment_notes: The Greek present participle 'ποιῶν' (doing/practicing) is rendered as 'practices' to reflect its durative aspect, aligning with POB's theological emphasis. 'δοῦλος' is translated as 'slave' to emphasize ownership and lack of freedom, which is central to the immediate context of household status in verses 35-36.
  readability_notes:
  - Replaced the archaic 'I say to you' with 'I tell you' and 'Truly, truly' with 'Very truly' which is a widely accepted, highly readable modern equivalent for the Johannine double-amen. Adjusted the preposition 'of' to 'to' in 'slave to sin' for natural English flow.
  compression_notes:
  - No significant theological content was compressed. The solemn formula was updated to modern idiom, but its full rhetorical and theological weight is preserved.
  risk_flags:
  - risk: None. The translation closely preserves all POB grammatical and theological decisions while slightly enhancing readability.
    mitigation: Flag retained for reviewer attention.
