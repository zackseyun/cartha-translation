translation:
  language: en
  text: Jesus answered them, “Very truly I tell you, everyone who practices sin is a slave to sin.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “servant of sin.” The Greek word can mean “slave” or “servant.” “Slave” is used here because Jesus’ point is that sin holds such people in bondage.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Truly, truly, I say to you
  simplified_phrase: Very truly I tell you
  preserved_meaning: The modern wording retains the solemn emphasis of Jesus’ doubled affirmation.
  reasoning_layer_used: POB lexical decisions for Ἀμὴν ἀμὴν and λέγω ὑμῖν
  rationale: This recasts the formal expression in natural modern English without weakening its certainty.
- pob_phrase: everyone who practices sin
  simplified_phrase: everyone who practices sin
  preserved_meaning: “Practices” describes ongoing or characteristic sin rather than one isolated act.
  reasoning_layer_used: POB lexical and theological decisions for πᾶς ὁ ποιῶν
  rationale: The phrase is retained because simpler alternatives could obscure the ongoing sense.
- pob_phrase: a slave of sin
  simplified_phrase: a slave to sin
  preserved_meaning: The slavery image still presents sin as a power that holds a person in bondage.
  reasoning_layer_used: POB lexical and theological decisions for δοῦλος and τῆς ἁμαρτίας
  rationale: The preposition “to” makes the metaphor sound natural in modern English while preserving its force.
translation_notes:
  risk_flags:
  - risk: “Practices sin” could be mistaken for technical language.
    mitigation: It is retained because it clearly protects the POB’s characteristic-action reading.
  - risk: “Slave to sin” shifts the POB’s preposition from “of” to “to.”
    mitigation: The idiomatic wording still conveys belonging under sin’s mastery, and the footnote preserves the alternative form.
