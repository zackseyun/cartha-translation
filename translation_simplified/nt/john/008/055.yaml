translation:
  language: en
  text: You do not know him[a], but I know him. If I were to say I do not know him, I would be a liar like you. But I do know him, and I keep[b] his word.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'You have not known him.' The original Greek verb is in a form that emphasizes a continuous state of not knowing God.
    reason: lexical_alternative
  - marker: b
    text: The Greek word for 'keep' means more than just outward obedience; it includes guarding, treasuring, and faithfully holding onto God's word.
    reason: lexical_alternative
