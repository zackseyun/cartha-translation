- pob_phrase: Yet you have not known him
  simplified_phrase: You do not know him
  preserved_meaning: Jesus directly states that his opponents lack true knowledge of God.
  reasoning_layer_used: POB lexical decision for ἐγνώκατε and discourse-particle analysis
  rationale: The simple present is clearer, while footnote a preserves the perfect-form nuance.
- pob_phrase: If I were to say that I do not know him
  simplified_phrase: If I were to say I do not know him
  preserved_meaning: Jesus presents the denial as a hypothetical statement.
  reasoning_layer_used: POB lexical decisions for κἂν εἴπω and ἔσομαι
  rationale: Dropping “that” makes the clause more natural without weakening its hypothetical force.
- pob_phrase: I keep his word
  simplified_phrase: I keep[b] his word
  preserved_meaning: Jesus faithfully keeps, obeys, and guards God's word.
  reasoning_layer_used: POB lexical decision for τηρῶ and Johannine diction
  rationale: The key term “keep” remains in the text, with its supported range clarified in a note.
