translation:
  language: en
  text: You do not know him[a], but I know him. If I were to say I do not know him, I would be a liar like you. But I do know him, and I keep[b] his word.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “You have not known him.” The Greek form can emphasize their present lack of true knowledge as the result of not having come to know him.
    reason: lexical_alternative
  - marker: b
    text: “Keep” can also mean “obey,” “observe,” or “guard.”
    reason: lexical_alternative
