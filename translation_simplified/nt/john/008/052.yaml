translation_notes:
  source_alignment_notes: The translation preserves the emphatic negation of the Greek 'ou mē ... eis ton aiōna' through the standard modern English intensifier 'never, ever' rather than the confusing 'never... forever'. It also maintains the critical distinction between 'keeping' (tēreō) and mere 'obedience'.
  readability_notes:
  - By splitting the sentence at 'prophets' and utilizing 'and so did...', the rhythmic flow is significantly improved for modern oral reading and comprehension without losing any semantic details.
  compression_notes:
  - Slightly compressed the syntax of the second clause ('and the prophets also' to 'and so did the prophets') and streamlined the final double negation. No theological concepts or historical details were lost.
  risk_flags:
  - risk: The phrase 'taste death' is highly idiomatic and could be confusing to readers entirely unfamiliar with Biblical phrasing, but replacing it would compromise the theological depth and the direct response of the opponents. A footnote has been added to mitigate this risk.
