translation:
  language: en
  text: So Jesus said, “When you lift up[a] the Son of Man, then you will know that I am he[b]. You will know that I do nothing on my own, but I say these things just as the Father taught me.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Lift up” can mean both being raised physically on a cross and being exalted.
    reason: lexical_alternative
  - marker: b
    text: Or “I am.” The Greek simply says “I am” (egō eimi), without a following word. This may echo God’s self-identification in the Old Testament.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: I do nothing from myself
  simplified_phrase: I do nothing on my own
  preserved_meaning: Jesus does not act independently of the Father.
  reasoning_layer_used: POB lexical decision for ἀπ’ ἐμαυτοῦ
  rationale: The modern idiom expresses independent initiative more naturally.
- pob_phrase: then you will know that I am he, and that I do nothing
  simplified_phrase: then you will know that I am he. You will know that I do nothing
  preserved_meaning: Both realizations follow the lifting up of the Son of Man.
  reasoning_layer_used: POB syntax and contextual relationship
  rationale: Repeating “you will know” permits a clearer sentence break without changing the connection.
- pob_phrase: but just as the Father taught me, I speak these things
  simplified_phrase: but I say these things just as the Father taught me
  preserved_meaning: Jesus’ present words correspond exactly to the Father’s teaching.
  reasoning_layer_used: POB lexical decisions for καθώς and ταῦτα λαλῶ
  rationale: Natural clause order keeps both the comparison and the reference to these words.
translation_notes:
  risk_flags:
  - risk: The sentence break could make the second realization seem less directly governed by “then.”
    mitigation: Repeating “You will know” preserves its link to the same future event.
  - risk: The cross and exaltation senses of “lift up” may not be apparent in the main text.
    mitigation: Footnote a preserves both meanings without resolving the deliberate ambiguity.
