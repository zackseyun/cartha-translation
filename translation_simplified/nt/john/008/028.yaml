translation:
  language: en
  text: So Jesus said, "When you lift up[a] the Son of Man, then you will know that I am he[b]. You will know that I do nothing on my own, but speak only what the Father taught me."
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The phrase ''lift up'' has a double meaning: it refers physically to Jesus being raised on the cross, and spiritually to his exaltation.'
    reason: simplification_note
  - marker: b
    text: Or 'I am.' The Greek text literally says 'I am' (egō eimi), without a following word, which echoes the divine name of God in the Old Testament.
    reason: simplification_note
simplification_decisions:
- preserved_meaning: Changed 'do nothing from myself' to 'do nothing on my own' to use a natural modern English idiom that retains the concept of acting without independent authority.
  reasoning_layer_used: POB audit trail
  rationale: Changed 'do nothing from myself' to 'do nothing on my own' to use a natural modern English idiom that retains the concept of acting without independent authority.
- preserved_meaning: Split the single long POB sentence into two shorter, more manageable sentences to improve flow and comprehension.
  reasoning_layer_used: POB audit trail
  rationale: Split the single long POB sentence into two shorter, more manageable sentences to improve flow and comprehension.
- preserved_meaning: Simplified the final clause from 'but just as the Father taught me, I speak these things' to 'but speak only what the Father taught me' to eliminate wordy and archaic phrasing while preserving the core meaning.
  reasoning_layer_used: POB audit trail
  rationale: Simplified the final clause from 'but just as the Father taught me, I speak these things' to 'but speak only what the Father taught me' to eliminate wordy and archaic phrasing while preserving the core meaning.
