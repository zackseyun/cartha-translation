translation:
  language: en
  text: You belong to your father, the devil, and you want to do what he desires. He was a murderer from the beginning, and he has not stood in the truth, because there is no truth in him. Whenever he lies, he speaks from his own nature[a], because he is a liar and the father of it[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, 'he speaks from his own'—meaning from his own inner character or resources.
    reason: lexical_alternative
  - marker: b
    text: Or 'its father.' 'It' refers back to the lie.
    reason: alternative_reading
