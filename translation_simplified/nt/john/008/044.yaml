translation_notes:
  source_alignment_notes: Maintained 'has not stood in the truth' to preserve the settled-state nuance of the Greek verb 'esteeken' without assuming a prior fall or departure from truth. Aligned 'the father of it' directly with 'to pseudos' (the lie).
  readability_notes:
  - Sentences are kept relatively short and direct. Redundant repetition of the word 'father' was reduced by utilizing pronouns, making the overall verse flow much better when read aloud.
  compression_notes:
  - The literal phrasing 'speaks the lie' was compressed into 'lies' to fit modern idiomatic expectations, though the reference to 'the lie' is still preserved conceptually through the pronoun 'it' in 'the father of it'.
  risk_flags:
  - risk: Simplifying 'speaks the lie' to 'lies' slightly reduces the cosmic, personified force of 'the lie' (to pseudos) in Johannine theology, though this is mitigated by the final clause 'the father of it'.
    mitigation: Flag retained for reviewer attention.
