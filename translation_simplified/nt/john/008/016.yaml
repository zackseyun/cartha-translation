translation:
  language: en
  text: But even if I do judge, my judgment is true, because I do not judge alone. The Father who sent me judges with me.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: because I am not alone
  simplified_phrase: because I do not judge alone
  preserved_meaning: Jesus does not exercise judgment independently of the Father.
  reasoning_layer_used: POB theological decision and immediate context
  rationale: Repeating “judge” clearly identifies the activity in which Jesus is not alone.
- pob_phrase: but I and the Father who sent me
  simplified_phrase: The Father who sent me judges with me
  preserved_meaning: Jesus and the Father are distinct and jointly involved in the judgment.
  reasoning_layer_used: POB lexical rationale and John 8:17–18
  rationale: A complete English clause preserves the paired presentation better than wording about mere presence.
interpretive_expansions:
- pob_phrase: I am not alone, but I and the Father who sent me
  rendering: I do not judge alone. The Father who sent me judges with me.
  claim: The Father is involved with Jesus in the judgment under discussion.
  evidence:
  - The preceding clause explicitly concerns Jesus’ judgment.
  - The POB rationale says Jesus’ judgment is not exercised independently of the Father.
  - John 8:17–18 develops the statement through the testimony of Jesus and the Father.
  confidence: high
  alternatives_preserved:
  - The immediate argument may be understood more narrowly as a legal-witness claim.
translation_notes:
  risk_flags:
  - risk: “Judges with me” makes the Father’s involvement more explicit than the Greek’s elliptical paired expression.
    mitigation: The wording is limited to the judgment in this verse and follows the POB theological rationale.
