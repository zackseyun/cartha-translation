translation_notes:
  source_alignment_notes: The Greek uses the dative 'αὐτῷ' (him) rather than 'εἰς αὐτόν' (in him). This translation preserves that distinction in the main text while providing the common alternative in a footnote, matching the POB audit trail.
  readability_notes:
  - Replacing 'was saying' with 'said' significantly improves the natural flow of the sentence for a modern reader without sacrificing the core meaning of the verse.
  compression_notes:
  - The aspect of the imperfect verb 'Ἔλεγεν' (was saying) was compressed to the simple past 'said' to fit modern English conventions.
  risk_flags:
  - risk: There is a slight risk that readers may overlook the nuance of believing 'him' vs 'in him,' but the footnote is included to clarify this translation choice.
    mitigation: Flag retained for reviewer attention.
