- pob_phrase: the son remains forever
  simplified_phrase: the son always belongs there
  preserved_meaning: The son has an enduring place and status in the household.
  reasoning_layer_used: POB lexical and theological decisions for μένει and υἱός
  rationale: This states the continuing household status naturally while keeping “son” lowercase and proverb-like.
- pob_phrase: The slave
  simplified_phrase: A slave
  preserved_meaning: The saying presents a general contrast between a slave and a son.
  reasoning_layer_used: POB footnote and theological decision
  rationale: The indefinite article makes the general saying natural in modern English.
