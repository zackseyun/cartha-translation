  language: en
  text: A servant[a] does not remain part of the household forever, but the son[b] always belongs there.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word can mean “slave” or “servant.” “Slave” emphasizes the difference in status within the household.
    reason: lexical_alternative
