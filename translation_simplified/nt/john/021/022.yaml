translation:
  language: en
  text: Jesus said to Peter, “If I want that disciple to remain until I come[a], what is that to you? You follow me.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Until I come” is intentionally open. It may refer to a later historical coming of Jesus or to his final coming.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Jesus said to him
  simplified_phrase: Jesus said to Peter
  preserved_meaning: Identifies the person Jesus addressed without changing the exchange.
  reasoning_layer_used: Immediate context, John 21:20–22
  rationale: The surrounding verses clearly identify Jesus’ listener as Peter.
- pob_phrase: If I want him to remain
  simplified_phrase: If I want that disciple to remain
  preserved_meaning: Identifies the other man while keeping both the condition and the open meaning of “remain.”
  reasoning_layer_used: Immediate context and POB lexical decisions
  rationale: Peter had just asked Jesus about that disciple.
- pob_phrase: until I come
  simplified_phrase: until I come[a]
  preserved_meaning: Leaves the nature of Jesus’ coming undefined.
  reasoning_layer_used: POB theological decision
  rationale: The footnote preserves the documented range without resolving it.
