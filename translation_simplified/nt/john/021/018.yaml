translation:
  language: en
  text: Truly, truly, I tell you, when you were younger, you used to dress yourself and walk where you wanted. But when you grow old, you will stretch out your hands[a], and someone else will dress you and take you where you do not want to go.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Stretch out your hands” is often understood as pointing to Peter’s death by crucifixion. The next verse says Jesus was indicating the kind of death Peter would die.
    reason: cross_reference
simplification_decisions:
- pob_phrase: I say to you
