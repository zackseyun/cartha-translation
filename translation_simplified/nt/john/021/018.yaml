  preserved_meaning: Jesus directly and solemnly addresses Peter.
  reasoning_layer_used: POB lexical decision for λέγω σοι
  rationale: “I tell you” is more natural in modern speech while preserving the direct address.
- pob_phrase: another will dress you and carry you
  simplified_phrase: someone else will dress you and take you
  preserved_meaning: Another person will control Peter’s movement and take him to an unwanted destination.
  reasoning_layer_used: POB lexical decisions for ἄλλος, ζώσει, and οἴσει
  rationale: “Someone else” and “take you” clearly express externally directed action without over-interpreting it.
- pob_phrase: you used to dress yourself and walk where you wanted
  simplified_phrase: you used to dress yourself and walk where you wanted
  preserved_meaning: Peter’s customary former independence contrasts with his later dependence.
  reasoning_layer_used: POB source aspect and grounding review
  rationale: Keeping “used to” preserves the habitual force of the two past-tense verbs.
