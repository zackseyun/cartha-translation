  text: He said to him the third time, “Simon, son of John, do you phileo-love me?” Peter was grieved because he said to him the third time, “Do you phileo-love me?” And he said to him, “Lord, you know all things; you know[a] that I phileo-love you.” Jesus said to him, “Feed my sheep.”
