translation:
  language: en
  text: After breakfast, Jesus said to Simon Peter, “Simon, son of John, do you love me more than these?[a]” Peter answered, “Yes, Lord. You know that I love you.” Jesus told him, “Feed my lambs.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “More than these” may mean “more than these men love me” or “more than you love these things.” The Greek does not state what is being compared.
    reason: alternative_reading
  - marker: b
    text: Jesus and Peter use different Greek verbs for “love.” The difference may be meaningful or may simply be a variation in wording.
    reason: lexical_alternative
