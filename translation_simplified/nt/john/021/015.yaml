    from: So when they had eaten breakfast[a], Jesus said to Simon Peter, “Simon, son of John, do you love me more than these?” He said to him, “Yes, Lord; you know that I love you.” He said to him[b], “Feed my lambs.”
    to: So when they had eaten breakfast, Jesus said to Simon Peter, “Simon, son of John, do you agape-love me more than these[a]?” He said to him, “Yes, Lord; you know that I phileo-love you.” He said to him, “Feed my lambs.”
    rationale: 'Maintainer-approved revision: preserve the distinct Greek love verbs directly in English. John 21:15–16 has Jesus ask with ἀγαπᾷς (ἀγαπάω) and Peter answer with φιλῶ (φιλέω); in 21:17 Jesus asks with φιλεῖς (φιλέω), and Peter again answers with φιλῶ. Use the hyphenated forms ‘agape-love’ and ‘phileo-love’ so readers can see the vocabulary and the third-question change in the text itself. This reflects POB’s commitment to the authority of Scripture and to preserving its wording rather than flattening two source words into one undifferentiated English word. Remove the former love-verb debate footnote; retain the Greek source and original draft provenance unchanged.'
    source_review: docs/JOHN_21_LOVE_WORDING_REVISION.md
translation:
  language: en
  text: After breakfast, Jesus said to Simon Peter, “Simon, son of John, do you agape-love me more than these?[a]” Peter answered, “Yes, Lord. You know that I phileo-love you.” Jesus told him, “Feed my lambs.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “More than these” may mean “more than these men love me” or “more than you love these things.” The Greek does not state what is being compared.
    reason: alternative_reading
