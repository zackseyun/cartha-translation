translation:
  language: en
  text: So the cohort of soldiers, the military commander, and the Jewish officers[a] seized Jesus and tied him up.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The phrase translated “Jewish officers” may also mean “officers of the Jewish leaders” or “Judean officers,” depending on the context; John does not mean the entire Jewish people.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: the cohort
  simplified_phrase: the cohort of soldiers
  preserved_meaning: This remains a specific military unit rather than a general crowd.
  reasoning_layer_used: POB lexical decision for σπεῖρα
  rationale: Adding “of soldiers” explains the unfamiliar military term without replacing it with a vaguer word.
- pob_phrase: the commander
  simplified_phrase: the military commander
  preserved_meaning: He is the officer commanding the cohort.
  reasoning_layer_used: POB lexical decisions for χιλίαρχος and σπεῖρα
  rationale: “Military” makes his role immediately clear from the source-grounded context.
- pob_phrase: the officers of the Jews seized Jesus and bound him
  simplified_phrase: the Jewish officers seized Jesus and tied him up
  preserved_meaning: Official Jewish attendants physically took Jesus and restrained him.
  reasoning_layer_used: POB lexical and theological decisions for ὑπηρέται, τῶν Ἰουδαίων, συνέλαβον, and ἔδησαν
  rationale: Natural English syntax and “tied him up” clarify the actions while the footnote preserves the disputed scope of “Jewish.”
interpretive_expansions:
- pob_phrase: the cohort, the commander
  rendering: the cohort of soldiers, the military commander
  claim: The cohort is a body of soldiers, and the commander is a military officer.
  evidence:
  - The POB lexical audit identifies σπεῖρα as a military cohort.
  - The POB lexical audit identifies χιλίαρχος as the officer over that cohort.
  confidence: high
  alternatives_preserved:
  - Roman cohort
  - detachment of soldiers
translation_notes:
  risk_flags:
  - risk: “Jewish officers” could be misunderstood as implicating Jewish people generally.
    mitigation: The footnote preserves the narrower contextual possibilities and explicitly excludes that collective reading.
