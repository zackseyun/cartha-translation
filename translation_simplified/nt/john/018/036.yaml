translation:
  language: en
  text: Jesus answered, “My kingdom does not come from this world. If my kingdom came from this world, my servants would be fighting so that I would not be handed over to the Jews.[a] But as it is, my kingdom is not from here.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the Judeans,” possibly referring more specifically here to the Judean authorities.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: My kingdom is not from this world
  simplified_phrase: My kingdom does not come from this world
  preserved_meaning: Jesus’ kingdom does not originate from the world’s present order.
  reasoning_layer_used: POB lexical and theological decisions on ἐκ τοῦ κόσμου τούτου
  rationale: “Does not come from” makes the source relationship immediately clear without denying the kingdom’s presence in the world.
- pob_phrase: If my kingdom were from this world
  simplified_phrase: If my kingdom came from this world
  preserved_meaning: The statement remains a contrary-to-fact condition about the kingdom’s origin.
  reasoning_layer_used: POB translation and lexical decision on source language
  rationale: The ordinary conditional wording is easier to read while retaining the hypothetical contrast.
- pob_phrase: so that I might not be handed over
  simplified_phrase: so that I would not be handed over
  preserved_meaning: The servants’ hypothetical fighting would have the purpose of preventing Jesus from being handed over.
  reasoning_layer_used: POB lexical decision on ἵνα μὴ παραδοθῶ and grounding review
  rationale: “So that” clearly preserves purpose, while “would” fits the hypothetical sentence.
translation_notes:
  risk_flags:
  - risk: “Does not come from” could be mistaken for describing only the kingdom’s arrival.
    mitigation: The repeated conditional and final “not from here” keep the emphasis on its source.
  - risk: “The Jews” may sound broader than the immediate narrative referent.
    mitigation: The footnote preserves “the Judeans” and the possible reference to Judean authorities.
