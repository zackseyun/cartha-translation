  preserved_meaning: The wording retains the connective and personal emphasis of the Greek expression.
  reasoning_layer_used: POB lexical decision for κἀγώ and grounding review
  rationale: Keeping “And I” corrects the draft’s omission without making the sentence difficult.
- pob_phrase: when I am lifted up from the earth
  simplified_phrase: when I am lifted up from the earth
  preserved_meaning: The wording presents Jesus’ death as impending while preserving the image of crucifixion and exaltation.
  reasoning_layer_used: POB lexical and theological decisions for ἐὰν and ὑψωθῶ
  rationale: The already-clear image is retained because a simpler paraphrase would erase John’s double meaning.
- pob_phrase: will draw all people to myself
  simplified_phrase: will draw all people to myself
  preserved_meaning: Jesus draws people broadly to himself without specifying the drawing’s mechanism or final result.
  reasoning_layer_used: POB lexical and theological decisions for πάντας and ἑλκύσω
  rationale: These common words preserve the verse’s breadth without resolving a theological debate.
translation_notes:
  risk_flags:
  - risk: Modern readers may understand “lifted up” only as physical elevation.
    mitigation: Footnote [b] preserves the linked sense of exaltation.
  - risk: “All people” may be read as settling the extent or outcome of salvation.
    mitigation: Footnote [c] preserves the broad wording without imposing that conclusion.
