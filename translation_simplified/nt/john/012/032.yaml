translation:
  language: en
  text: And I, when[a] I am lifted up[b] from the earth, will draw all people[c] to myself.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “if.” The Greek uses a conditional form, but here Jesus speaks of his coming death as certain.
    reason: alternative_reading
  - marker: b
    text: “Lifted up” refers to Jesus being raised on the cross and also carries the sense of being exalted.
    reason: lexical_alternative
  - marker: c
    text: Or simply “all.” This means people, but the verse does not settle later debates about the extent of salvation.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And I
