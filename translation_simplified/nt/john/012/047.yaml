translation:
  language: en
  text: If anyone hears my words and does not keep them, I do not judge that person, because I did not come to judge the world but to save the world.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: I do not judge him
  simplified_phrase: I do not judge that person
  preserved_meaning: Jesus speaks about any individual who hears but does not keep his words.
  reasoning_layer_used: POB theological decision on the generic masculine pronoun
  rationale: “That person” makes the generic reference clear in natural English without changing its singular force.
- pob_phrase: for I did not come
  simplified_phrase: because I did not come
  preserved_meaning: Jesus gives his saving mission as the reason for his statement about not judging the person.
  reasoning_layer_used: Source γάρ and independent grounding review
  rationale: “Because” clearly preserves the causal link in common English.
translation_notes:
  risk_flags:
  - risk: “Keep” may be understood only as retaining Jesus’ words rather than faithfully observing them.
    mitigation: It is retained because POB preserves both retention and obedience within the verb’s broader sense.
  - risk: The statement about not judging may seem to conflict with other Johannine judgment language.
    mitigation: The draft retains “judge” and does not add a temporal or doctrinal resolution.
