  - The immediate context describes people responding to Lazarus’s raising.
  confidence: high
translation_notes:
  risk_flags:
  - risk: “Leaving” does not state an explicit object and may sound like simple physical travel.
    mitigation: The wording preserves the source image and avoids over-interpreting it as formal apostasy.
  - risk: “The Jews” could be misread as referring to all Jewish people.
    mitigation: The footnote explains that the phrase describes a subset and preserves “Judeans” as an alternative.
