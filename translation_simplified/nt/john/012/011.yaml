translation:
  language: en
  text: because many of the Jews[a] were leaving because of Lazarus and were believing in Jesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Judeans.” Here the phrase refers to many people within the Jewish population, not to all Jews.
