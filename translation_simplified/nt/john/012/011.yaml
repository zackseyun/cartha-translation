simplification_decisions:
- pob_phrase: many of the Jews were going away
  simplified_phrase: many of the Jews were leaving
  preserved_meaning: People were continuing to move away from the position or influence of those opposing Jesus.
  reasoning_layer_used: POB lexical decision for ὑπῆγον
  rationale: “Were leaving” is natural English and keeps the ongoing movement without calling it formal apostasy.
- pob_phrase: were going away because of him and were believing
  simplified_phrase: were leaving because of Lazarus and were believing
  preserved_meaning: Lazarus was the reason for their departure, while leaving and believing remain distinct ongoing actions.
  reasoning_layer_used: POB lexical decisions and independent grounding review
  rationale: Repeating “were” preserves the separate force of both imperfect verbs.
interpretive_expansions:
- pob_phrase: because of him
  rendering: because of Lazarus
  claim: The pronoun refers to Lazarus.
  evidence:
