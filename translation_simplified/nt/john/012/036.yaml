translation:
  language: en
  text: “While you have the light, believe in the light, so that you may become sons of light[a].” After Jesus said these things, he went away and hid himself from them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Sons of light” means people whose lives are characterized by light; it includes both men and women.
    reason: simplification_note
simplification_decisions:
- pob_phrase: Jesus spoke these things
  simplified_phrase: After Jesus said these things
  preserved_meaning: Jesus finished speaking the preceding words before leaving.
  reasoning_layer_used: POB lexical decision and immediate narrative context
  rationale: “Said” is more natural than “spoke these things,” and “after” clearly marks the sequence.
- pob_phrase: he departed
  simplified_phrase: he went away
  preserved_meaning: Jesus left the people he had been addressing.
  reasoning_layer_used: POB lexical decision for ἀπελθὼν
  rationale: “Went away” expresses the same action in common English.
- pob_phrase: sons of light
  simplified_phrase: sons of light[a]
  preserved_meaning: The masculine source expression is retained while its representative idiomatic sense is explained.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The note prevents readers from mistaking the phrase for literal descent or a male-only group.
