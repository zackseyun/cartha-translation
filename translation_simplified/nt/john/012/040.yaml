translation:
  language: en
  text: He has blinded their eyes and hardened their heart, so that they may not see with their eyes, understand with their heart, or turn.[a] If they turned, I would heal them.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “be converted.”
    reason: lexical_alternative
  - marker: b
    text: The Greek form is future and may be translated “I will heal them,” but here it expresses what would happen if they turned.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: so that they may not see with their eyes and understand with their heart and turn
  simplified_phrase: so that they may not see with their eyes, understand with their heart, or turn
  preserved_meaning: The wording retains the purpose/result force and keeps seeing, understanding, and turning distinct.
  reasoning_layer_used: POB lexical decision for ἵνα μὴ and the source parallelism
  rationale: Using “or” makes the negative scope clear without weakening the judicial purpose/result.
- pob_phrase: and I would heal them
  simplified_phrase: If they turned, I would heal them
  preserved_meaning: God's healing remains the stated consequence of their turning.
  reasoning_layer_used: POB lexical rationale for ἰάσομαι and grounding review
  rationale: A separate conditional sentence prevents readers from mistaking healing for another action being prevented.
- pob_phrase: He has blinded their eyes and hardened their heart
  simplified_phrase: He has blinded their eyes and hardened their heart
  preserved_meaning: The explicit divine agency, completed-action force, and corporate singular “heart” remain intact.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: This difficult wording is retained because simplifying it would soften the source's theological tension.
interpretive_expansions:
- pob_phrase: and turn, and I would heal them
  rendering: or turn. If they turned, I would heal them.
  claim: The healing is presented as what would happen if they turned.
  evidence:
  - The POB audit describes “I would heal them” as contingent in the quoted judgment context.
  - The immediate clause links turning with the prospect of healing.
  confidence: high
  alternatives_preserved:
  - I will heal them
  - be healed by me
translation_notes:
  risk_flags:
  - risk: Splitting the quotation makes its conditional relation more explicit than the Greek syntax alone.
    mitigation: The expansion follows the POB's audited contingent reading and preserves the future-form alternative in a footnote.
  - risk: The singular “heart” may sound unusual with the plural pronoun “their.”
    mitigation: It is retained to preserve the Greek collective singular and the Isaiah citation's corporate sense.
