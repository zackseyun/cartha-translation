translation:
  language: en
  text: Then Jesus said to them, “The light is among you[a] for a little while longer. Walk while you have the light, so darkness will not overtake you. Whoever walks in the darkness does not know where he is going.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “in you” or “with you.” The Greek phrase can have any of these senses, but “among you” best fits Jesus’ presence with the crowd here.
    reason: alternative_reading
