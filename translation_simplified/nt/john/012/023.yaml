translation:
  language: en
  text: But Jesus replied to them, “The time has come for the Son of Man to be glorified.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “glorified” includes Jesus being exalted through his death, resurrection, and vindication.
    reason: simplification_note
simplification_decisions:
- pob_phrase: answered them, saying
  simplified_phrase: replied to them
  preserved_meaning: Jesus responds directly to those who addressed him.
  reasoning_layer_used: POB lexical decisions for ἀποκρίνεται, αὐτοῖς, and λέγων
  rationale: The compact wording removes a redundant speech formula while preserving the response.
- pob_phrase: The hour has come
  simplified_phrase: The time has come
  preserved_meaning: Jesus’ appointed decisive moment has now arrived.
  reasoning_layer_used: POB lexical and theological decisions for ὥρα and Ἐλήλυθεν
  rationale: “Time” makes John’s idiom immediately understandable while “has come” preserves its completed arrival.
- pob_phrase: the Son of Man to be glorified
  simplified_phrase: the Son of Man to be glorified
  preserved_meaning: The established title and the rich Johannine idea of glory remain intact.
  reasoning_layer_used: POB lexical and theological decisions for δοξασθῇ and ὁ υἱὸς τοῦ ἀνθρώπου
  rationale: These terms are retained because simpler substitutes would weaken their theological force.
interpretive_expansions:
- pob_phrase: to be glorified
  rendering: 'Footnote: “glorified” includes exaltation through death, resurrection, and vindication'
  claim: Jesus’ glory here involves his approaching death and the exaltation that follows it.
  evidence:
  - The POB lexical rationale explicitly identifies death, resurrection, and vindication.
  - John 12:24 connects the announced time with death.
  - John 12:32–33 identifies Jesus’ coming death.
  confidence: high
  alternatives_preserved:
  - The wording remains broad rather than reducing glory to only death or only resurrection.
translation_notes:
  risk_flags:
  - risk: “Time” does not preserve John’s repeated literal image of an “hour.”
    mitigation: The wording follows a documented POB alternative and preserves the appointed-moment sense.
  - risk: Readers may still understand “glorified” as mere public praise.
    mitigation: The footnote explains its broader Johannine force without overloading the main sentence.
