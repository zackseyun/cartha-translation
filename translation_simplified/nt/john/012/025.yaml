translation:
  language: en
  text: Whoever loves his life loses it. But whoever hates his life in this world will keep it for eternal life.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Hates his life” does not mean hating oneself. It means refusing to cling to life in this present world as the highest good.
    reason: simplification_note
simplification_decisions:
- pob_phrase: The one who loves his life
  simplified_phrase: Whoever loves his life
  preserved_meaning: The statement applies generally to any person who remains attached to his present life.
  reasoning_layer_used: POB lexical decision for ὁ φιλῶν
  rationale: “Whoever” expresses the generic force more naturally in common English.
- pob_phrase: and the one who hates
  simplified_phrase: But whoever hates
  preserved_meaning: The second response stands in deliberate contrast to loving one’s present life.
  reasoning_layer_used: POB lexical and theological decisions for ὁ μισῶν
  rationale: “But” makes the contrast clear while retaining the strong paradox “hates.”
- pob_phrase: The one who loves his life loses it, and the one who hates his life in this world will keep it
  simplified_phrase: Whoever loves his life loses it. But whoever hates his life in this world will keep it
  preserved_meaning: Loving present life leads to loss, while renouncing attachment to it leads to its preservation for eternal life.
  reasoning_layer_used: POB syntax and theological audit trail
  rationale: Two sentences make the opposing outcomes easier to follow without merging them.
