translation:
  language: en
  text: Then Mary took about twelve ounces of very expensive pure nard perfume,[a] anointed Jesus's feet, and wiped his feet with her hair. The house was filled with the perfume's fragrance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “genuine nard”; the word translated “pure” is debated.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: a litra
  simplified_phrase: about twelve ounces
  preserved_meaning: The amount remains approximately one Roman litra.
  reasoning_layer_used: POB cultural note for λίτραν
  rationale: The modern measurement makes the ancient quantity immediately understandable without overstating precision.
- pob_phrase: costly
  simplified_phrase: very expensive
  preserved_meaning: The perfume had exceptionally high monetary value.
  reasoning_layer_used: POB lexical decision for πολυτίμου
  rationale: “Very expensive” is more familiar modern English while retaining the emphasis on value.
- pob_phrase: And the house was filled with the fragrance of the perfume
  simplified_phrase: The house was filled with the perfume's fragrance
  preserved_meaning: The perfume's scent spread throughout the house.
  reasoning_layer_used: POB lexical decisions for ἐπληρώθη and ὀσμῆς
  rationale: The shorter possessive construction preserves the passive image in natural English.
translation_notes:
