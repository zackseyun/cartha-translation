  preserved_meaning: Their purpose was to avoid exclusion from the synagogue community.
  reasoning_layer_used: POB lexical decisions for ἵνα μή and ἀποσυνάγωγοι γένωνται
  rationale: “So that” clearly preserves purpose while simplifying the resultative wording.
