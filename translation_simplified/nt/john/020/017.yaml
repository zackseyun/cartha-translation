translation:
  language: en
  text: Jesus said to her, “Do not keep holding on to me[a], because I have not yet ascended to the Father. Instead, go to my brothers—my disciples[b]—and tell them, ‘I am ascending to my Father and your Father, and to my God and your God.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Do not touch me.” The Greek most likely refers to continuing to hold him, not merely touching him once.
    reason: lexical_alternative
  - marker: b
    text: The Greek word translated “brothers” is masculine; here it refers to Jesus’ disciples and may include a broader representative group.
    reason: cultural_note
simplification_decisions:
- pob_phrase: Do not cling to me
  simplified_phrase: Do not keep holding on to me
  preserved_meaning: Jesus tells Mary to stop or not continue holding him, rather than forbidding every touch.
  reasoning_layer_used: POB lexical and theological decisions on ἅπτου
  rationale: The added “keep” makes the ongoing-action sense immediately clear.
- pob_phrase: But go to my brothers
  simplified_phrase: Instead, go to my brothers—my disciples
  preserved_meaning: The relational title “brothers” remains while its intended referent is identified.
  reasoning_layer_used: Immediate context and POB lexical rationale for ἀδελφούς
  rationale: The apposition prevents readers from mistaking them for Jesus’ biological brothers.
- pob_phrase: I am ascending to my Father and your Father, and my God and your God
  simplified_phrase: I am ascending to my Father and your Father, and to my God and your God
  preserved_meaning: The distinct relationships and direct Christological wording remain unchanged.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: Repeating “to” makes the parallel destination phrase easier to follow.
interpretive_expansions:
- pob_phrase: my brothers
  rendering: my brothers—my disciples
  claim: The brothers Jesus sends Mary to are his disciples.
  evidence:
  - John 20:18–19 identifies the receiving group as the disciples.
  - The POB audit explicitly says “brothers” refers here to Jesus’ disciples.
  confidence: high
  alternatives_preserved:
  - The footnote allows that a broader representative group may be included.
translation_notes:
  risk_flags:
  - risk: “My disciples” could be read as exhaustively limiting the broader group implied by “brothers.”
    mitigation: The footnote preserves the possibility of a broader representative group.
