simplification_decisions:
- pob_phrase: Bring your finger here and see my hands
  simplified_phrase: Bring your finger here and look at my hands
  preserved_meaning: Jesus tells Thomas to move his finger near and inspect his hands.
  reasoning_layer_used: POB lexical decisions for Φέρε and ἴδε
  rationale: “Look at” makes the intended act of seeing clearer while “bring” preserves the distinct command.
- pob_phrase: and bring your hand and put it into my side
  simplified_phrase: Bring your hand and put it into my side.
  preserved_meaning: The command still distinguishes moving the hand from putting it into Jesus’s pierced side.
  reasoning_layer_used: POB lexical decisions for Φέρε and βάλε εἰς
  rationale: A new sentence makes the command easier to follow without merging its two actions.
- pob_phrase: do not become unbelieving, but believing
  simplified_phrase: Do not be unbelieving. Believe.
  preserved_meaning: Jesus contrasts unbelief with belief in his resurrection.
  reasoning_layer_used: POB theological decision on ἄπιστος / πιστός
  rationale: Two direct sentences express the belief contrast in natural modern English.
translation_notes:
  risk_flags:
  - risk: Changing “do not become” to “do not be” softens the Greek verb’s process nuance.
    mitigation: The natural command preserves the contextual contrast, while avoiding the stronger and less certain “stop being.”
