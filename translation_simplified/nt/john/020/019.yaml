translation:
  language: en
  text: On the evening of that same day[a], the first day of the week, the doors were locked where the disciples were because they feared the Jews. Jesus came and stood among them and said, “Peace to you.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The context identifies this as the same first day of the week mentioned earlier in the chapter.
    reason: simplification_note
  - marker: b
    text: Or 'Peace be with you.' The Greek literally says 'Peace to you.'
    reason: simplification_note
