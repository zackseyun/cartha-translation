translation:
  language: en
  text: So the other disciples kept telling him, “We have seen the Lord.” But he said to them, “Unless I see the nail mark in his hands, put my finger into the nail mark, and put my hand into his side, I will certainly not believe.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'I will never believe.' The Greek uses a strong, emphatic negation.
    reason: simplification_note
