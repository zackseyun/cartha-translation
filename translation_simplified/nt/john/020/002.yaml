translation:
  language: en
  text: So she runs to Simon Peter and the other disciple[a], the one Jesus loved, and says to them, “They have taken the Lord out of the tomb, and we[b] do not know where they have put him.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Greek says 'the other disciple, whom Jesus loved.' The verb can emphasize affection.
    reason: simplification_note
  - marker: b
    text: Mary says 'we do not know.' The text does not explain who else is included in 'we.'
    reason: simplification_note
