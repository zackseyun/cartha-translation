  rationale: '''Runs to'' is simpler than repeating ''runs and comes to'' while preserving the action.'
- pob_phrase: laid him
  simplified_phrase: put him
  preserved_meaning: Preserves Mary's report that Jesus' body has been moved and its location is unknown.
  reasoning_layer_used: POB audit trail
  rationale: '''Put'' is common modern English for the placement of the body in this context.'
retained_terms:
