translation:
  language: en
  text: Jesus says to her, “Woman, why are you crying? Who are you looking for?” Thinking he was the gardener, she says to him, “Sir[a], if you carried him away, tell me where you put him, and I will take him away.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word can also mean “Lord,” but here it likely means “Sir,” since Mary thinks she is speaking to the gardener.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: why are you weeping?
  simplified_phrase: why are you crying?
  preserved_meaning: Preserves Jesus’ question about Mary’s tears and the scene’s solemnity.
  reasoning_layer_used: POB lexical decision for τί κλαίεις
  rationale: “Crying” is more familiar to common readers than “weeping.”
- pob_phrase: Whom are you seeking?
  simplified_phrase: Who are you looking for?
  preserved_meaning: Preserves Jesus’ question about the person Mary seeks.
  reasoning_layer_used: POB lexical decision for τίνα ζητεῖς
  rationale: “Looking for” is clearer everyday English than “seeking.”
- pob_phrase: She, supposing that he was the gardener, says to him
  simplified_phrase: Thinking he was the gardener, she says to him
  preserved_meaning: Preserves Mary’s mistaken identification of Jesus.
  reasoning_layer_used: POB lexical decision for δοκοῦσα
  rationale: The shorter clause uses ordinary English while keeping the narrative action.
translation_notes:
