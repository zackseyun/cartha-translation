translation:
  language: en
  text: But these things have been written so that you may believe[a] that Jesus is the Messiah[b], the Son of God. They were also written so that, by believing, you may have life through Jesus—through who he is and his authority.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some manuscripts support “so that you may come to believe,” while others support “so that you may continue believing”; the main text keeps the broader wording “may believe.”
    reason: textual_variant
  - marker: b
    text: Or “the Christ”; the Greek title is translated “Messiah” to express its meaning as a title.
    reason: lexical_alternative
