  preserved_meaning: Life is found in relation to Jesus and is grounded in his revealed person and authority.
  reasoning_layer_used: POB lexical rationale for ἐν τῷ ὀνόματι αὐτοῦ
  rationale: The wording explains an opaque biblical idiom while retaining the force of the image of a person’s name.
