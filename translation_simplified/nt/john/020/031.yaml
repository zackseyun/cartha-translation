  rationale: Adding “things” gives the reference a natural English noun without narrowing it.
- pob_phrase: and so that by believing you may have life
  simplified_phrase: They were also written so that, by believing, you may have life
  preserved_meaning: Believing remains the means connected with the second purpose, receiving life.
  reasoning_layer_used: POB lexical decisions for καὶ ἵνα, πιστεύοντες, and ζωὴν
  rationale: A new sentence makes the second purpose easier to follow while keeping it distinct.
- pob_phrase: in his name
