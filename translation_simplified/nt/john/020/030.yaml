  preserved_meaning: All the many other signs just mentioned are described as unwritten in this book.
  reasoning_layer_used: Greek relative clause, POB rendering, and grounding review
  rationale: A separate sentence prevents readers from mistaking the clause as selecting only some of the signs.
- pob_phrase: signs
