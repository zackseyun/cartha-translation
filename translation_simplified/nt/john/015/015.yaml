translation:
  language: en
  text: I no longer call you servants[a], because a servant does not know what his master[b] is doing. But I have called you friends, because I have told you everything I heard from my Father.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “servants” or “bondservants.” “Slaves” highlights the contrast in status between slaves and friends.
    reason: lexical_alternative
  - marker: b
    text: The Greek word can mean “lord”; here “master” fits the household relationship being described.
    reason: lexical_alternative
