translation:
  language: en
  text: If I had not done among them the works that no one else had done, they would not be guilty of sin.[a] But now they have seen these works and have hated both me and my Father.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek more literally says “they would not have sin,” an expression of guilt in this context.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the works that no one else did
  simplified_phrase: the works that no one else had done
  preserved_meaning: Jesus did unique works in their presence.
  reasoning_layer_used: POB lexical decision for ἃ οὐδεὶς ἄλλος ἐποίησεν and the counterfactual context
  rationale: The past-perfect wording makes the sequence of the counterfactual condition more natural in English.
- pob_phrase: they would not have sin
  simplified_phrase: they would not be guilty of sin
  preserved_meaning: Their sin brings culpability because they rejected the revelation given through Jesus' works.
  reasoning_layer_used: POB footnote and theological decision on culpability
  rationale: The clearer alternative communicates the idiom's contextual meaning while the footnote preserves its literal form.
- pob_phrase: they have both seen and hated both me and my Father
  simplified_phrase: they have seen these works and have hated both me and my Father
  preserved_meaning: They witnessed Jesus' revealing works yet responded with hatred toward both Jesus and his Father.
  reasoning_layer_used: Immediate context, POB lexical decisions, and grounding review
  rationale: Supplying the nearby object makes the two distinct responses clear without weakening the emphatic pairing of Jesus and his Father.
interpretive_expansions:
- pob_phrase: they would not have sin
  rendering: they would not be guilty of sin
  claim: The idiom refers here to culpability for sin after receiving revelation.
  evidence:
  - The POB theological rationale says the verse teaches increased culpability.
  - The POB footnote gives “they would not be guilty of sin” as an alternative.
  confidence: high
  alternatives_preserved:
  - The footnote preserves the more literal expression “have sin.”
- pob_phrase: they have both seen
  rendering: they have seen these works
  claim: What they saw includes the unique works just mentioned.
  evidence:
  - The immediately preceding clause identifies Jesus' unique works done among them.
  - The grounding review judged “these works” a natural contextual object.
  confidence: moderate
  alternatives_preserved:
  - The less explicit rendering “they have seen” remains possible.
translation_notes:
  risk_flags:
  - risk: Rendering “have sin” as guilt may narrow the Johannine idiom.
    mitigation: The footnote retains the literal wording and identifies guilt as its contextual sense.
  - risk: Supplying “these works” makes an unstated object explicit.
    mitigation: The immediate context supports it, and the audit records the less explicit alternative.
