translation:
  language: en
  text: I am the vine; you are the branches. The person who remains in me[a], and I in that person, bears much fruit, because apart from me you cannot do anything.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Remains” can also be translated “abides”; it describes an ongoing relationship with Jesus.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: The one who remains in me, and I in him
  simplified_phrase: The person who remains in me, and I in that person
  preserved_meaning: The singular statement applies generally while retaining the reciprocal language of being “in” Jesus.
  reasoning_layer_used: POB theological decision and generic-masculine footnote
  rationale: Repeating “that person” makes the general reference clear without weakening the mutual-indwelling language.
- pob_phrase: you are not able to do anything
  simplified_phrase: you cannot do anything
  preserved_meaning: Apart from Jesus, the disciples are unable to do anything in the verse’s stated sense.
  reasoning_layer_used: POB lexical decision for οὐ δύνασθε
  rationale: “Cannot” states the same inability in more natural modern English.
translation_notes:
  risk_flags:
  - risk: Readers may take “remains” as merely physical rather than relational.
    mitigation: The footnote explains its ongoing relational sense and gives the traditional alternative “abides.”
