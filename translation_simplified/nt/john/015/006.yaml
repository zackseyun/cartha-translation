translation:
  language: en
  text: If anyone does not remain in me, that person is thrown out like a branch and dries up. Such branches are gathered, thrown into the fire, and burned.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The image warns of exclusion and burning, but this verse itself does not specify whether it describes someone losing genuine discipleship or someone whose attachment to Jesus was never genuine.
    reason: alternative_reading
