translation:
  language: en
  text: You did not choose me, but I chose you and appointed you to go and bear fruit—fruit that remains—so that the Father may give you whatever you ask him in my name.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Remains” can also be translated “abides.” The Greek says “the Father,” not “my Father.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: appointed you so that you should go and bear fruit
  simplified_phrase: appointed you to go and bear fruit
  preserved_meaning: Jesus commissioned the disciples to go and produce fruit.
  reasoning_layer_used: POB lexical and theological decisions on ἔθηκα and the first ἵνα clause
  rationale: The infinitive states the purpose of the appointment more naturally.
- pob_phrase: and that your fruit should remain
  simplified_phrase: fruit that remains
  preserved_meaning: The fruit the disciples bear is to continue or endure.
  reasoning_layer_used: POB lexical decision and footnote on μένῃ
  rationale: The shorter phrase keeps both the fruit image and its lasting quality.
- pob_phrase: whatever you ask the Father in my name, he may give you
  simplified_phrase: the Father may give you whatever you ask him in my name
  preserved_meaning: The disciples ask the Father in Jesus’ name, and the Father may grant their request.
  reasoning_layer_used: POB syntax and theological decision on the final ἵνα clause
  rationale: Adding “him” clearly identifies the Father as the one being asked.
translation_notes:
  risk_flags:
  - risk: Reordering the final clause could make “in my name” seem to describe the Father’s giving.
    mitigation: The pronoun “him” directly links asking in Jesus’ name to the Father.
