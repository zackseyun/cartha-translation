translation:
  language: en
  text: Jesus said, “I came into this world to bring judgment[a], so that those who do not see may see, and those who see may become blind.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “for a judgment.” The Greek word can refer to the judicial result of Jesus’ coming, not only to punishment or condemnation.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: For judgment I came into this world
  simplified_phrase: I came into this world to bring judgment
  preserved_meaning: Jesus’ coming produces judgment without reducing that judgment to condemnation.
  reasoning_layer_used: POB lexical and theological decisions on κρίμα
  rationale: The verbal phrasing makes the judicial effect clear in natural English while preserving the theological tension.
- pob_phrase: those who do not see may see, and those who see may become blind
  simplified_phrase: those who do not see may see, and those who see may become blind
  preserved_meaning: The wording keeps both physical and spiritual sight in view and preserves the stark reversal.
  reasoning_layer_used: POB lexical decisions on βλέπω and τυφλοί
  rationale: Keeping the parallel wording avoids flattening the deliberate ambiguity into a purely physical or spiritual claim.
interpretive_expansions:
- pob_phrase: For judgment
  rendering: to bring judgment
  claim: Jesus’ coming has judgment as its resulting effect.
  evidence:
  - The POB lexical rationale says κρίμα denotes the result or effect of judicial judgment.
  - The verse describes the resulting reversal between those who do not see and those who see.
  confidence: high
  alternatives_preserved:
  - for judgment
  - for a judgment
translation_notes:
  risk_flags:
  - risk: “To bring judgment” may sound more active than the compact Greek phrase.
    mitigation: The footnote preserves the closer alternative, and the POB rationale explicitly supports a judicial effect.
  - risk: The saying may appear to conflict with John 3:17.
    mitigation: The wording preserves the POB’s deliberate theological tension rather than harmonizing it.
