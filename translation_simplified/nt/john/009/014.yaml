  rationale: The reordered clause states the same temporal fact in more natural English.
- pob_phrase: opened his eyes
  simplified_phrase: opened the man’s eyes so he could see
  preserved_meaning: Jesus healed the blind man while the concrete image of opening his eyes remains.
