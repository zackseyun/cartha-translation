simplification_decisions:
- pob_phrase: They answered and said to him
  simplified_phrase: They answered him
  preserved_meaning: The reply is preserved while the redundant ancient double-verb formula is compressed.
  reasoning_layer_used: POB lexical decision for ἀπεκρίθησαν καὶ εἶπαν
  rationale: Modern English normally expresses this speech introduction with one verb.
- pob_phrase: You were born entirely in sins
  simplified_phrase: You were born completely in sins
  preserved_meaning: The wording keeps both the total force of the accusation and the plural “sins.”
  reasoning_layer_used: POB lexical and theological decisions for Ἐν ἁμαρτίαις and ἐγεννήθης ὅλος
  rationale: “Completely” is clearer here without resolving what kind of sin the accusers meant.
- pob_phrase: And they cast him out
  simplified_phrase: Then they threw him out
  preserved_meaning: The hostile expulsion remains forceful and does not specify whether formal synagogue exclusion occurred.
  reasoning_layer_used: POB lexical decision and alternative-reading footnote for ἐξέβαλον αὐτὸν ἔξω
  rationale: “Threw him out” is direct modern English, and “then” clearly marks the next action.
translation_notes:
  risk_flags:
  - risk: “Completely in sins” is intentionally unusual English because the source uses the plural accusation.
    mitigation: The wording preserves the insult without assigning the sin to the man, his parents, or inherited guilt.
  - risk: “Threw him out” could be read as formal exclusion from the synagogue community.
    mitigation: The main text states only the expulsion explicitly described by the source.
