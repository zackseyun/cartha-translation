simplification_decisions:
- preserved_meaning: The Greek idiom 'ἐκ τοῦ αἰῶνος' refers to the span of remembered human history. 'From of old' is archaic for modern readers. 'In all of history' clearly communicates this temporal scope without importing a highly metaphysical sense of eternity.
  reasoning_layer_used: POB audit trail
  rationale: The Greek idiom 'ἐκ τοῦ αἰῶνος' refers to the span of remembered human history. 'From of old' is archaic for modern readers. 'In all of history' clearly communicates this temporal scope without importing a highly metaphysical sense of eternity.
- preserved_meaning: Converted the passive 'it has never been heard' to the active 'no one has ever heard of' to avoid the clunky English structure and make the sentence flow more naturally for a modern reader.
  reasoning_layer_used: POB audit trail
