  text: Then the man said, “Lord[a], I believe,” and he worshiped[b] him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word can mean “Sir,” a respectful form of address. “Lord” is preferred here because the man responds to Jesus with belief and worship.
