translation:
  language: en
  text: But we don't know how he can see now, and we don't know who opened his eyes. Ask him; he is old enough. He will speak for himself.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, 'He can speak for himself.' The Greek verb is in the future tense, which can express his ability or responsibility to answer.
    reason: simplification_note
simplification_decisions:
- simplified_phrase: But we don't know how he can see now, and we don't know who opened his eyes.
  preserved_meaning: Untangled the inverted phrasing ('how he now sees... we do not know') into standard English order ('we don't know how...'). Replaced the formal 'do not' with the more natural contraction 'don't' to suit modern readers, while strictly retaining the dual repetition of 'we don't know' to preserve the legalistic, defensive style of the parents' testimony.
  reasoning_layer_used: POB audit trail
  rationale: Untangled the inverted phrasing ('how he now sees... we do not know') into standard English order ('we don't know how...'). Replaced the formal 'do not' with the more natural contraction 'don't' to suit modern readers, while strictly retaining the dual repetition of 'we don't know' to preserve the legalistic, defensive style of the parents' testimony.
- simplified_phrase: he is old enough
  preserved_meaning: The idiom 'of age' is somewhat formal/archaic. 'Old enough' conveys the exact same social and legal capacity to testify in modern, everyday English.
  reasoning_layer_used: POB audit trail
  rationale: The idiom 'of age' is somewhat formal/archaic. 'Old enough' conveys the exact same social and legal capacity to testify in modern, everyday English.
- simplified_phrase: He will speak for himself.[a]
