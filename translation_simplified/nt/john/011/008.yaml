  rationale: “Only recently” states the time relationship more naturally in modern English.
- pob_phrase: were seeking to stone you
  simplified_phrase: were trying to stone you
  preserved_meaning: They were making an ongoing attempt to stone Jesus.
  reasoning_layer_used: POB lexical decision for ἐζήτουν
  rationale: “Were trying” clearly conveys attempted action without adding that they succeeded.
- pob_phrase: and are you going there again?
