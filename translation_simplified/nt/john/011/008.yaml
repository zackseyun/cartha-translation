translation:
  language: en
  text: The disciples said to him, “Rabbi, only recently the Jews[a] were trying to stone you. Are you going there again?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the Judeans”; in this context, possibly “the Jewish leaders.” John often uses “the Jews” for Jesus’ opponents in Judea, not for the Jewish people as a whole.
