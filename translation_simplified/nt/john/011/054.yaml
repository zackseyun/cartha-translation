translation:
  language: en
  text: So Jesus no longer moved about openly among the Jews[a]. He left there for the region near the wilderness, to a city called Ephraim, and stayed there with the disciples.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “among the Judeans.” In John, “the Jews” can sometimes refer more specifically to people in Judea or to the Judean authorities, depending on context.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: walked openly
  simplified_phrase: moved about openly
  preserved_meaning: Jesus stopped appearing and traveling in public view.
  reasoning_layer_used: POB lexical decision for παρρησίᾳ and περιεπάτει
  rationale: This expresses the public-movement idiom clearly without losing the walking-about sense.
- pob_phrase: but departed from there
  simplified_phrase: He left there
  preserved_meaning: Jesus went away from his previous location as a consequence of the plot against him.
  reasoning_layer_used: POB lexical decisions for οὖν and ἀπῆλθεν ἐκεῖθεν
  rationale: A new sentence makes the movement easier to follow without adding an either-or contrast.
- pob_phrase: among the Jews
  simplified_phrase: among the Jews[a]
  preserved_meaning: Jesus no longer moved publicly among the group described by the context-sensitive term Ἰουδαῖοι.
  reasoning_layer_used: POB theological decision and alternative-reading footnote
  rationale: The footnote preserves the plausible regional meaning “Judeans” without settling the ambiguity.
translation_notes:
  risk_flags:
  - risk: “The Jews” may be misread as referring broadly to all Jewish people.
    mitigation: The footnote preserves the contextual alternative “the Judeans” and notes the term’s range in John.
