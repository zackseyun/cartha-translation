simplification_decisions:
- pob_phrase: After saying these things, he said to them
  simplified_phrase: After he said these things, he told them
  preserved_meaning: Jesus finished his earlier words and then addressed the disciples.
  reasoning_layer_used: POB lexical decisions for ταῦτα, εἶπεν, μετὰ τοῦτο, and λέγει
  rationale: A finite clause and “told them” make the narrative sequence easier to follow.
- pob_phrase: Lazarus our friend
  simplified_phrase: Our friend Lazarus
  preserved_meaning: Lazarus is identified as a friend shared by Jesus and the disciples.
  reasoning_layer_used: POB lexical decision for ὁ φίλος ἡμῶν
  rationale: Natural English places the shared relationship before the name.
- pob_phrase: I am going so that I may wake him up
  simplified_phrase: I am going so that I can wake him up
  preserved_meaning: Jesus states that waking Lazarus is the purpose of his going.
  reasoning_layer_used: POB lexical decisions for πορεύομαι, ἵνα, and ἐξυπνίσω
  rationale: “So that I can” is common English while keeping the explicit purpose relation.
translation_notes:
  risk_flags:
