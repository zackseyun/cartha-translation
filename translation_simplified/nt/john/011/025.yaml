translation:
  language: en
  text: Jesus said to her, “I am the resurrection and the life. Anyone who believes in me, even if they die, will live.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: The one who believes in me
  simplified_phrase: Anyone who believes in me
  preserved_meaning: The promise applies inclusively to every person characterized by believing in Jesus.
  reasoning_layer_used: POB lexical decision and representative-masculine theological decision
  rationale: “Anyone” clearly expresses the general and inclusive sense already recognized by the POB.
- pob_phrase: even if he dies, will live
  simplified_phrase: even if they die, will live
  preserved_meaning: Physical death does not cancel Jesus’ promise of life to the believer.
  reasoning_layer_used: POB footnote and lexical decisions for κἂν, ἀποθάνῃ, and ζήσεται
  rationale: Singular “they” removes needless gendered wording while keeping the concession before the promise.
translation_notes:
  risk_flags:
  - risk: Some readers may treat singular “they” as less formally aligned with the Greek masculine singular.
    mitigation: The POB footnote explicitly supports this inclusive English rendering of the representative masculine.
