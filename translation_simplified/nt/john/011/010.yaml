translation:
  language: en
  text: But if anyone walks at night, he stumbles because he has no light in him.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “because he has no light with him.” The Greek says “in him,” which may point beyond the absence of external light.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: walks in the night
  simplified_phrase: walks at night
  preserved_meaning: Keeps the night-walking image while using natural modern English.
  reasoning_layer_used: POB lexical decision for ἐν τῇ νυκτί
  rationale: The POB lists “at night” as a valid alternative that does not turn night into abstract darkness.
- pob_phrase: the light is not in him
  simplified_phrase: he has no light in him
  preserved_meaning: Retains the inward wording and its possible literal and theological senses.
  reasoning_layer_used: POB lexical and theological decisions for οὐκ ἔστιν ἐν αὐτῷ
  rationale: The possession construction is clearer in English without resolving the deliberate ambiguity.
translation_notes:
  risk_flags:
  - risk: “Light in him” may still be understood either situationally or spiritually.
    mitigation: The main text preserves that intended tension, and the footnote gives the situational alternative.
