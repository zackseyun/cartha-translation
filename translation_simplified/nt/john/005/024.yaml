translation:
  language: en
  text: 'I tell you the truth: whoever hears my word and believes the one who sent me has eternal life and will not face judgment,[a] but has passed from death into life.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “condemnation.” The Greek word can mean “judgment” generally and, in this context, may refer to adverse judgment.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Truly, truly, I say to you
  simplified_phrase: I tell you the truth
  preserved_meaning: Preserves Jesus’ emphatic assurance in natural modern English.
  reasoning_layer_used: POB lexical decision on Ἀμὴν ἀμὴν and λέγω ὑμῖν
  rationale: The direct formula conveys strong affirmation without adding “solemn” as lexical content.
- pob_phrase: believes him who sent me
  simplified_phrase: believes the one who sent me
  preserved_meaning: Keeps belief directed toward the person who sent Jesus.
  reasoning_layer_used: POB lexical decision on πιστεύων τῷ πέμψαντί με
  rationale: “The one who” removes dated masculine phrasing while retaining the same referent.
- pob_phrase: does not come into judgment
  simplified_phrase: will not face judgment
  preserved_meaning: Keeps the promise of exemption from judgment without replacing it with the narrower “condemnation.”
  reasoning_layer_used: POB lexical and theological decisions on κρίσις
  rationale: “Will not face judgment” is idiomatic while the footnote preserves the contextual alternative.
translation_notes:
  risk_flags:
  - risk: “Will not face” makes the future orientation more explicit than the Greek present form.
    mitigation: The rendering describes the person’s present exemption regarding judgment and does not alter the verse’s salvation claim.
