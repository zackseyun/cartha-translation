translation_notes:
  source_alignment_notes: 'The translation preserves the verbal aspect flow of the Greek: present tense participles for characteristic action (hearing, believing), present tense for immediate possession (has eternal life), future-directed present for exempt status (will not face judgment), and perfect tense for completed transition with ongoing effect (has passed from death into life).'
  readability_notes:
  - The complex sentence structure has been preserved but smoothed out by using natural modern transitions and idiomatic structures ('will not face judgment' and 'the one who' instead of 'does not come into' and 'him who').
  compression_notes:
