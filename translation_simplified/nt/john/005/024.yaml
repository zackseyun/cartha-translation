simplification_decisions:
- preserved_meaning: Retains the gravity and emphasis of the doubled 'Amen' (Ἀμὴν ἀμὴν) without the archaic or repetitive sound of 'Truly, truly' or 'Verily, verily' in modern English.
  reasoning_layer_used: POB audit trail
  rationale: Retains the gravity and emphasis of the doubled 'Amen' (Ἀμὴν ἀμὴν) without the archaic or repetitive sound of 'Truly, truly' or 'Verily, verily' in modern English.
- preserved_meaning: Replaces the slightly archaic 'him who' with the modern equivalent 'the one who' for smoother reading.
  reasoning_layer_used: POB audit trail
  rationale: Replaces the slightly archaic 'him who' with the modern equivalent 'the one who' for smoother reading.
- preserved_meaning: Conveys the future-looking, active sense of the Greek 'does not enter/come into judgment' in idiomatic, clear English.
  reasoning_layer_used: POB audit trail
  rationale: Conveys the future-looking, active sense of the Greek 'does not enter/come into judgment' in idiomatic, clear English.
