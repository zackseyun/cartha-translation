translation:
  language: en
  text: Later, Jesus found him in the temple and said to him, “See, you have become well. Do not sin anymore, so that something worse does not happen to you.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jesus’ warning does not specify whether the man’s previous illness was caused by a specific sin, nor whether the “worse” outcome refers to suffering in this life, final judgment, or both.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: After these things
  simplified_phrase: Later
  preserved_meaning: The story moves forward to a subsequent event.
  reasoning_layer_used: POB lexical decision for μετὰ ταῦτα
  rationale: “Later” is the POB-approved natural alternative and preserves the narrative sequence.
- pob_phrase: Sin no more
  simplified_phrase: Do not sin anymore
  preserved_meaning: Jesus commands the man not to sin from this point onward without asserting an ongoing pattern.
  reasoning_layer_used: POB lexical decision for μηκέτι ἁμάρτανε
  rationale: This modern wording preserves cessation while avoiding an overstated aspectual claim.
- pob_phrase: so that something worse may not happen to you
  simplified_phrase: so that something worse does not happen to you
  preserved_meaning: Jesus warns of a possible worse outcome connected with future sin.
  reasoning_layer_used: POB lexical and theological decisions for ἵνα μὴ and χεῖρόν
  rationale: Ordinary English states the warning clearly while leaving the outcome undefined.
