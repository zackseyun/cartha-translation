translation:
  language: en
  text: After this, there was a festival of the Jews[a], and Jesus went up to Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'a feast of the Jews.' In John's Gospel, 'the Jews' here refers generally to the Jewish people celebrating one of their religious holidays.
    reason: simplification_note
simplification_decisions:
- preserved_meaning: Changed 'After these things' to 'After this' to modernize the transitional phrase while preserving the narrative sequence.
  reasoning_layer_used: POB audit trail
  rationale: Changed 'After these things' to 'After this' to modernize the transitional phrase while preserving the narrative sequence.
- preserved_meaning: Updated 'feast' to 'festival' to more clearly communicate a religious holiday to modern readers, who might otherwise associate 'feast' solely with eating.
  reasoning_layer_used: POB audit trail
  rationale: Updated 'feast' to 'festival' to more clearly communicate a religious holiday to modern readers, who might otherwise associate 'feast' solely with eating.
retained_terms:
- term: The phrase 'went up' (ἀνέβη) is retained to preserve the traditional pilgrimage and geographical elevation aspect of traveling to Jerusalem.
  reason: Retained to preserve POB's source-grounded terminology.
- term: The phrase 'of the Jews' (τῶν Ἰουδαίων) is retained as a noun phrase to respect the theological and historical identity of the community, as outlined in the POB audit trail.
  reason: Retained to preserve POB's source-grounded terminology.
