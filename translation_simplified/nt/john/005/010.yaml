  text: So the Jews[a] said to the man who had been healed, “It is the Sabbath, and it is against the law for you to carry your mat.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'the Jewish leaders' or 'the Judeans.' In the Gospel of John, 'the Jews' often refers specifically to the religious authorities who opposed Jesus.
