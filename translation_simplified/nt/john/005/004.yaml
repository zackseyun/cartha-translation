translation:
  language: en
  text: From time to time, an angel would go down into the pool and stir up the water. The first person to step in after the water was stirred would be healed of whatever disease they had.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This verse is absent from the earliest Greek manuscripts, including Papyrus 66, Papyrus 75, Sinaiticus, and Vaticanus. Many scholars think copyists added it early to explain why the sick gathered at the pool.
    reason: textual_variant
