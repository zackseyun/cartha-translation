  preserved_meaning: The word belongs to God the Father named in the preceding context.
  reasoning_layer_used: Immediate context and POB lexical-theological audit
  rationale: Naming the Father removes an unclear pronoun without changing its referent.
- pob_phrase: the one whom he sent
  simplified_phrase: the one the Father sent
  preserved_meaning: Jesus is the one sent by the Father.
  reasoning_layer_used: POB lexical decisions and immediate context
  rationale: The shorter clause uses natural modern English and makes the sender clear.
- pob_phrase: abiding in you
  simplified_phrase: remaining in you
  preserved_meaning: God’s word lacks a continuing presence in the hearers.
  reasoning_layer_used: POB decision for ἐν ὑμῖν μένοντα
  rationale: “Remaining” preserves the continuing-presence image in more familiar language.
interpretive_expansions:
