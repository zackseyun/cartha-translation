translation:
  language: en
  text: I have come in my Father’s name[a], but you do not accept me. If someone else comes in his own name[b], you will accept him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “with my Father’s authority.” To come “in the name” of someone can mean acting as that person’s representative or with that person’s authority.
    reason: lexical_alternative
  - marker: b
    text: Or “on his own authority.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: you do not receive me
  simplified_phrase: you do not accept me
  preserved_meaning: The hearers reject Jesus rather than physically refusing to take him.
  reasoning_layer_used: POB lexical decision for λαμβάνετέ με
  rationale: “Accept” gives the intended sense more directly in common English.
- pob_phrase: If another comes
  simplified_phrase: If someone else comes
  preserved_meaning: The wording preserves the contrast between Jesus and a different person.
  reasoning_layer_used: POB lexical decision for ἄλλος
  rationale: “Someone else” is more natural for a person in modern English.
- pob_phrase: you will receive him
  simplified_phrase: you will accept him
  preserved_meaning: Repeating the verb maintains the sharp contrast in the hearers’ response.
  reasoning_layer_used: POB lexical decision for ἐκεῖνον λήμψεσθε
  rationale: Repeating “accept” preserves the source’s rhetorical parallel in clearer English.
