translation:
  language: en
  text: For the Father loves the Son and shows him everything he himself is doing. He will show him greater works than these, so that you may be amazed.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “so that you will be amazed.” The original phrase can express the Father’s purpose and may also describe the expected result.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: all that he himself is doing
  simplified_phrase: everything he himself is doing
  preserved_meaning: The Father shows the Son the full scope of his own ongoing activity.
  reasoning_layer_used: POB lexical decisions for πάντα and ἃ αὐτὸς ποιεῖ
  rationale: “Everything” is more natural while retaining “himself” and the ongoing sense of “is doing.”
- pob_phrase: and he will show him greater works than these
  simplified_phrase: He will show him greater works than these
  preserved_meaning: The Father will show the Son greater future works.
  reasoning_layer_used: POB lexical decision for μείζονα τούτων ... ἔργα and δείξει
  rationale: A new sentence makes the future statement easier to follow without adding emphasis.
- pob_phrase: so that you may marvel
  simplified_phrase: so that you may be amazed
  preserved_meaning: Jesus’ hearers will respond to the greater works with astonishment.
  reasoning_layer_used: POB lexical and theological decisions for ἵνα ὑμεῖς θαυμάζητε
  rationale: “Be amazed” communicates the same force in familiar modern English.
translation_notes:
  risk_flags:
  - risk: The purpose-result relationship could be read too narrowly in the main text.
    mitigation: The footnote preserves both purpose and possible resulting astonishment without treating them as exclusive.
