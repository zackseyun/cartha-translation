translation:
  language: en
  text: So Jesus said to them[a], “The right time for me has not come yet, but the right time for you is always here.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word translated “right time” can mean a fitting or appointed time, rather than simply time in general.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Jesus said to them
  simplified_phrase: Jesus said to them
  preserved_meaning: Jesus responds directly to the people addressed in context.
  reasoning_layer_used: POB lexical decision for λέγει and αὐτοῖς
  rationale: The clear speech verb “said” remains closest to the source and needs no replacement.
- pob_phrase: My time ... your time
  simplified_phrase: The right time for me ... the right time for you
  preserved_meaning: The parallel contrast concerns a fitting time for Jesus and for those he addresses.
  reasoning_layer_used: POB lexical decisions for καιρός and the possessive phrases
  rationale: “Right time for” expresses the contextual sense of καιρός in natural English while preserving the contrast.
- pob_phrase: your time is always ready
  simplified_phrase: the right time for you is always here
  preserved_meaning: A suitable opportunity is always available to them, unlike Jesus at this moment.
  reasoning_layer_used: POB lexical decisions for πάντοτέ and ἕτοιμος, supported by immediate context
  rationale: “Always here” makes the availability of an opportunity clear without losing the temporal image.
interpretive_expansions:
