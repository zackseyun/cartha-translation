- pob_phrase: is not able to hate you
  simplified_phrase: cannot hate you
  preserved_meaning: The world is unable to hate Jesus’ brothers.
  reasoning_layer_used: POB lexical decision for οὐ δύναται
  rationale: “Cannot” expresses the same inability in natural English.
- pob_phrase: I testify about it that its works are evil
  simplified_phrase: I testify that what it does is evil
  preserved_meaning: Jesus bears witness concerning the world by declaring its actions morally evil.
  reasoning_layer_used: POB lexical decisions for μαρτυρῶ, περὶ αὐτοῦ, τὰ ἔργα αὐτοῦ, and πονηρά
  rationale: The content of Jesus’ testimony is stated idiomatically while retaining “testify” and “evil.”
