translation:
  language: en
  text: So Jesus called out as he taught in the temple, saying, “You know me, and you know where I am from[a]. I have not come on my own[b], but the one who sent me is true[c], and you do not know him.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The statement 'You know me, and you know where I am from' can be heard as ironic or challenging in this context, though the Greek is written as a direct declarative statement.
    reason: simplification_note
  - marker: b
    text: Or 'from myself,' indicating that Jesus did not come on his own initiative or self-authorization.
    reason: simplification_note
  - marker: c
    text: Or 'genuine' or 'real' in John's usage.
    reason: simplification_note
