  text: So the Jews[a] said to one another, “Where is this man about to go that we won’t find him? He isn’t about to go to the Jews scattered among the Greeks[b] and teach the Greeks, is he?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the Judeans.” The Greek term can refer to the Jewish people generally or, in some contexts, specifically to people from Judea.
