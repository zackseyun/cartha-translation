translation:
  language: en
  text: So the Jews[a] said to one another, “Where is this man going that we won’t find him? Surely he isn’t going to go to the Jews scattered among the Greeks[b] and teach the Greeks, is he?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the Judeans.” The Greek term can refer to the Jewish people generally or, in some contexts, specifically to people from Judea.
    reason: simplification_note
  - marker: b
    text: 'Greek: “the dispersion among the Greeks,” which refers to Jewish people scattered outside their homeland among Greek-speaking populations.'
    reason: simplification_note
