  text: You worship what you do not know; we worship what we do know, because salvation is from the Jews.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the Jewish people.” Jesus is contrasting Samaritan and Jewish worship. He means that God’s saving work has its historical source in the Jewish people.
    reason: simplification_note
