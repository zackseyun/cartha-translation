  text: You worship what you do not know; we worship what we do know[a], because salvation is from the Jews.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'the Jewish people'. Here, Jesus is contrasting Samaritan and Jewish worship, showing that God's plan of salvation comes through the Jewish nation.
