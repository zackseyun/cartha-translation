translation_notes:
  source_alignment_notes: Retained the neuter 'what' (ὃ) to refer generally to the object of worship, avoiding the overly personalizing 'the one whom' in alignment with the POB lexical decision. Kept the prepositional copula 'is from' (ἐκ... ἐστίν) instead of the interpretive expansion 'comes from' to preserve the historical source-origin aspect.
  readability_notes:
  - The parallel structure of the Greek clauses is preserved and strengthened in English by matching 'do not know' with 'do know'. This aids modern oral comprehension.
  compression_notes:
  - No text was compressed out of the biblical verse itself, as it is already concise. The academic language in the original footnote (discussing 'salvation history' and 'covenant community') was simplified for a general reader.
  risk_flags:
