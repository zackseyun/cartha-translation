  preserved_meaning: The plural address extends beyond a grammatically singular reference to the official without identifying the wider group.
  reasoning_layer_used: POB theological decision on the number and scope of the addressee
  rationale: “All of you” makes the Greek plural visible in ordinary English while the footnote preserves uncertainty about its scope.
- pob_phrase: you will certainly not believe
  simplified_phrase: you will certainly not believe
  preserved_meaning: The wording retains the emphatic denial without suggesting an absolute timeless impossibility.
  reasoning_layer_used: POB lexical decision for οὐ μὴ πιστεύσητε
  rationale: The POB wording is already clear and accurately conveys the strong negation.
interpretive_expansions:
