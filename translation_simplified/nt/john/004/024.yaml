simplification_decisions:
- pob_phrase: God is spirit
  simplified_phrase: God’s very nature is spirit
  preserved_meaning: The statement describes what God is by nature, not one spirit-being among others.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: Adding “very nature” makes the qualitative meaning clear without changing the claim.
- pob_phrase: those who worship him must worship
  simplified_phrase: those who worship him must worship in a way that is
  preserved_meaning: Everyone who worships God is under the stated necessity.
  reasoning_layer_used: POB lexical decisions for προσκυνοῦντας, δεῖ, and προσκυνεῖν
  rationale: The recast clause introduces the required character of worship in ordinary English.
- pob_phrase: in spirit and truth
  simplified_phrase: spiritually real and true
  preserved_meaning: Worship must be characterized by spiritual reality and truth without limiting “spirit” to sincerity.
  reasoning_layer_used: POB lexical and theological decisions for ἐν πνεύματι καὶ ἀληθείᾳ
  rationale: The wording explains the broad sense while the footnote preserves the more specific alternative.
