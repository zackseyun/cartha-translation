translation:
  language: en
  text: So he asked them the hour when he got better. They replied[a], “Yesterday at the seventh hour, the fever left him.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'at one o’clock in the afternoon' (if counting from sunrise); some scholars understand John’s system of timekeeping differently.
