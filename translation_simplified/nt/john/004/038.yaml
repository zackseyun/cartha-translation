translation:
  language: en
  text: I sent you to harvest[a] what you did not work for. Others have worked hard, and you have joined in their work[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “to reap.”
    reason: lexical_alternative
  - marker: b
    text: The Greek more literally says, “you have entered into their labor.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: to reap
  simplified_phrase: to harvest
  preserved_meaning: The agricultural image remains intact.
  reasoning_layer_used: POB lexical decision for θερίζειν
  rationale: “Harvest” is more familiar to modern readers and is an approved POB alternative.
- pob_phrase: what you have not labored for; others have labored
  simplified_phrase: what you did not work for. Others have worked hard
  preserved_meaning: The disciples did not perform the earlier strenuous work.
  reasoning_layer_used: POB lexical decisions for κεκοπιάκατε and κεκοπιάκασιν
  rationale: Common wording preserves both the prior effort and the contrast between the disciples and others.
- pob_phrase: you have entered into their labor
  simplified_phrase: you have joined in their work
  preserved_meaning: The disciples now participate in work begun by others rather than merely benefiting from it.
  reasoning_layer_used: POB lexical decision and grounding review
  rationale: This approved POB alternative makes the idiom clear without reducing it to receiving results.
translation_notes:
  risk_flags:
  - risk: “Joined in” may sound less vivid than the Greek image of entering into labor.
