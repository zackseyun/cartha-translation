translation:
  language: en
  text: Then the Samaritan woman said to him, “How is it that you, a Jew, ask me, a Samaritan woman, for a drink?” (For Jews do not associate with Samaritans.[a])
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Jews do not have dealings with Samaritans.” It may more specifically mean that they did not use things in common, such as drinking vessels.
    reason: lexical_alternative
