translation:
  language: en
  text: So the father realized that his son had recovered at the same hour Jesus had said to him, “Your son lives.”[a] He himself believed,[b] and so did everyone in his household.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Your son is alive.”
    reason: lexical_alternative
  - marker: b
    text: “Believed” may mean that he believed Jesus’ specific promise or that he came to a fuller faith in Jesus; the Greek does not specify.
    reason: alternative_reading
