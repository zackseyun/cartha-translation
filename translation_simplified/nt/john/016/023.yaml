translation:
  language: en
  text: On that day you will ask me nothing[a]. Truly, truly, I tell you, whatever you ask the Father in my name[b], he will give it to you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Greek uses one verb for asking or questioning Jesus and another for requesting from the Father.
    reason: lexical_alternative
  - marker: b
    text: Or, “you will not ask me anything.”
    reason: alternative_reading
