  reasoning_layer_used: POB lexical decision for ἐν ἐκείνῃ τῇ ἡμέρᾳ
  rationale: “On that day” is the permitted alternative and sounds more natural in modern English.
- pob_phrase: Truly, truly, I say to you
  simplified_phrase: Truly, truly, I tell you
  preserved_meaning: Jesus introduces the statement with the same repeated emphasis.
  reasoning_layer_used: POB lexical decision for ἀμὴν ἀμὴν
  rationale: “I tell you” is clearer everyday English while the repetition preserves the solemn emphasis.
- pob_phrase: he will give to you
