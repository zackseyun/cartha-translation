translation:
  language: en
  text: Look! The time is coming—and has already come—when you will be scattered. Each of you will go to what is your own[a], and you will leave me alone. Yet I am not alone, because the Father is with me.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “What is your own” may include each person’s home, possessions, concerns, or personal sphere.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Behold
  simplified_phrase: Look!
  preserved_meaning: Jesus solemnly directs the disciples’ attention to what is about to happen.
  reasoning_layer_used: POB lexical decision for ἰδού
  rationale: “Look!” gives the discourse marker’s force in familiar English.
- pob_phrase: an hour is coming, and has come
  simplified_phrase: The time is coming—and has already come
  preserved_meaning: The decisive moment is both imminent and already present.
  reasoning_layer_used: POB lexical decision for ἔρχεται ὥρα καὶ ἐλήλυθεν
  rationale: “Time” avoids suggesting sixty minutes, while the dash clearly holds together the temporal tension.
- pob_phrase: you will be scattered, each to his own
  simplified_phrase: you will be scattered. Each of you will go to what is your own
  preserved_meaning: The disciples will be driven apart, with each returning to his own sphere without narrowing it to a place.
  reasoning_layer_used: POB lexical and theological decisions for σκορπισθῆτε and ἕκαστος εἰς τὰ ἴδια
  rationale: Two sentences clarify the distributive action while preserving the expression’s broad reference.
