  rationale: The clearer phrase retains the theological weight of “glorify.”
- pob_phrase: declare it to you
  simplified_phrase: make it known to you
  preserved_meaning: The Spirit will communicate to the disciples what belongs to Jesus.
  reasoning_layer_used: POB lexical decisions for ἀναγγελεῖ and ὑμῖν
  rationale: “Make it known” expresses the reporting sense in familiar English.
- pob_phrase: take from what is mine
  simplified_phrase: take[a] from what is mine
  preserved_meaning: The Spirit draws from what belongs to Jesus without specifying teaching, authority, or revelation.
  reasoning_layer_used: POB lexical and theological decisions for ἐκ τοῦ ἐμοῦ λήμψεται
  rationale: The broad wording and attached note preserve both the intended scope and lexical alternative.
