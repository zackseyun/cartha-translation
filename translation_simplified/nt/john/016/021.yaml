translation:
  language: en
  text: When a woman is giving birth, she feels sorrow because her hour—the time for her to give birth—has come. But after the child is born, she no longer remembers her distress because she is filled with joy that a human being has been born into the world.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word can mean “man” or, more generally, “human being”; here it does not refer specifically to a male child.
    reason: lexical_alternative
