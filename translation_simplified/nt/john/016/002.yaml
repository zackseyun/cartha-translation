translation:
  language: en
  text: They will put you out of the synagogues.[a] In fact, a time is coming when everyone who kills you will think he is offering service to God.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “exclude you from the synagogues.”
    reason: lexical_alternative
  - marker: b
    text: Or “offering worship to God” or “rendering religious service to God.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: They will make you outcasts from the synagogues
  simplified_phrase: They will put you out of the synagogues
  preserved_meaning: They will be expelled from their synagogue communities.
  reasoning_layer_used: POB lexical decision for ἀποσυναγώγους
  rationale: “Put you out” states the exclusion directly in familiar English.
- pob_phrase: indeed, an hour is coming
  simplified_phrase: In fact, a time is coming
  preserved_meaning: Jesus warns that a more severe period of persecution is approaching.
  reasoning_layer_used: POB lexical decisions for ἀλλά and ἔρχεται ὥρα
  rationale: “In fact” keeps the escalation, while “time” makes the temporal idiom immediately clear.
- pob_phrase: will think he is offering service to God
  simplified_phrase: will think he is offering service to God
  preserved_meaning: The killer will regard the killing itself as an act of religious service offered to God.
  reasoning_layer_used: POB lexical and theological decisions for λατρείαν προσφέρειν
  rationale: The wording is retained because shortening it to “serving God” would lose the act-specific cultic irony.
translation_notes:
  risk_flags:
  - risk: “Put you out” may sound less socially severe than “make you outcasts.”
    mitigation: The reference to the synagogues and footnote preserve formal communal exclusion.
  - risk: “Service” might be heard as ordinary assistance rather than religious devotion.
    mitigation: “Offering service to God” and footnote [b] retain the religious and cultic sense.
