translation_notes:
  source_alignment_notes: The literal structure of the Greek (neuter participle + preposition + noun) is cleanly represented by 'What is born of...'. The capitalization of the first 'Spirit' and lowercase of the second 'spirit' reflects the presence and absence of the Greek article, preserving the exact grammatical theology of the source text.
  readability_notes:
  - The parallel structure ('What is born of X is X') is highly memorable and retains its solemn, scriptural weight. The language is clean, readable, and avoids archaic verb endings.
  compression_notes:
  - No compression was applied to the verse text itself, as any reduction would destroy the parallel contrast essential to Jesus' statement. The footnotes were compressed and simplified by stripping out technical linguistic jargon while retaining the alternative translations.
  risk_flags:
  - risk: The word 'flesh' may initially be misread by modern readers as physical meat or skin, but this risk is mitigated by the direct contrast with 'Spirit' and the clarification provided in footnote [a].
    mitigation: Flag retained for reviewer attention.
