translation:
  language: en
  text: Moses lifted up the snake in the wilderness[a]. In the same way, the Son of Man must be lifted up[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: See Numbers 21:8–9, where Moses lifted up a bronze snake.
    reason: cross_reference
  - marker: b
    text: The Greek word translated “lifted up” can mean both physically raised up and exalted; John likely intends both meanings here.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: just as ... so
  simplified_phrase: In the same way
  preserved_meaning: The direct comparison between Moses’ action and what must happen to the Son of Man remains explicit.
  reasoning_layer_used: Lexical decisions for καθὼς and οὕτως
  rationale: Two short sentences make the comparison easier to follow.
- pob_phrase: the serpent
  simplified_phrase: the snake
  preserved_meaning: The same creature from the Numbers account is identified in ordinary English.
  reasoning_layer_used: Lexical decision for ὄφιν
  rationale: “Snake” is clearer to common readers without changing the referent.
- pob_phrase: must be lifted up
  simplified_phrase: must be lifted up
  preserved_meaning: Divine necessity and the physical-exaltation double meaning are both retained.
  reasoning_layer_used: Lexical and theological decisions for δεῖ and ὑψωθῆναι
  rationale: This wording remains because simpler alternatives would narrow John’s intended ambiguity.
translation_notes:
  risk_flags:
  - risk: Splitting the comparison into two sentences may make its parallel structure less visible.
    mitigation: “In the same way” explicitly connects the two actions.
  - risk: “Lifted up” may be understood only as physical elevation.
    mitigation: Footnote b preserves the additional sense of exaltation.
