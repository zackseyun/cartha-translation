  reason: Retained to preserve POB's source-grounded terminology.
translation_notes:
  source_alignment_notes: Kept the dual imagery of 'water and Spirit' intact to preserve the likely theological connection to the cleansing and spirit-giving themes in Ezekiel 36:25-27, rather than smoothing it into a single concept like 'spiritual washing.'
  readability_notes:
  - The flow was improved by replacing the stiff passive/formal structure 'he is not able to' with the direct active 'they cannot.' Changing 'Truly, truly, I say to you' to 'I tell you the solemn truth' maintains the divine authority of the speaker while avoiding archaic biblical English.
  compression_notes:
  - Combined and condensed the two original POB footnotes into a single, cohesive footnote. This helps the common reader see both the interpretive options (cleansing, birth, baptism) and the lexical option (lower-case 'spirit') in one place, avoiding excessive academic footnotes.
  risk_flags:
  - risk: The use of singular 'they' as a gender-neutral pronoun for 'someone' is standard in modern English but may be viewed critically by traditional readers who prefer 'he'. The simplification of 'is not able to' to 'cannot' is a minor loss of literalism but a massive gain for modern readability.
    mitigation: Flag retained for reviewer attention.
