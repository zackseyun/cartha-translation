translation:
  language: en
  text: 'Jesus answered, “I tell you the truth: unless a person is born of water and the Spirit[a], they cannot enter the kingdom of God.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The phrase "born of water and the Spirit" has been understood in several ways, including as spiritual cleansing and renewal, physical birth followed by spiritual birth, or Christian baptism. Additionally, the Greek word for "Spirit" can also be translated as a lower-case "spirit" (referring to a human spiritual renewal or wind/breath).
    reason: simplification_note
simplification_decisions:
- simplified_phrase: I tell you the solemn truth
  preserved_meaning: Preserves the serious, authoritative weight of the double 'amen' formula while utilizing natural, modern English structure rather than archaic phrasing.
  reasoning_layer_used: POB audit trail
  rationale: Preserves the serious, authoritative weight of the double 'amen' formula while utilizing natural, modern English structure rather than archaic phrasing.
- simplified_phrase: unless a person... they cannot
  preserved_meaning: Replaces the generic 'he' with singular 'they' to align with modern inclusive English while accurately translating the gender-neutral Greek pronoun 'tis' (someone). Converts the formal 'is not able to' to the more natural 'cannot' without losing the sense of inability.
  reasoning_layer_used: POB audit trail
  rationale: Replaces the generic 'he' with singular 'they' to align with modern inclusive English while accurately translating the gender-neutral Greek pronoun 'tis' (someone). Converts the formal 'is not able to' to the more natural 'cannot' without losing the sense of inability.
retained_terms:
- term: born of water and the Spirit
  reason: Retained to preserve POB's source-grounded terminology.
