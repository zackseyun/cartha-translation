translation:
  language: en
  text: 'Jesus answered, “I tell you the solemn truth: unless a person is born of water and the Spirit[a], they cannot enter the kingdom of God.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The phrase “born of water and the Spirit” has been understood in several ways, including as cleansing and spiritual renewal, physical birth followed by spiritual birth, or Christian baptism. The Greek word translated “Spirit” can also be read as lower-case “spirit,” though “Spirit” is likely here.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Truly, truly, I say to you
  simplified_phrase: I tell you the solemn truth
  preserved_meaning: Jesus introduces his statement with emphatic and solemn authority.
  reasoning_layer_used: POB lexical decision on Ἀμὴν ἀμὴν and λέγω σοι
  rationale: This natural English wording retains the force of the doubled formula.
- pob_phrase: unless someone
  simplified_phrase: unless a person
  preserved_meaning: The condition applies to any person without male specificity.
  reasoning_layer_used: POB lexical decision on ἐὰν μή τις
  rationale: “A person” clearly expresses the Greek generic singular.
- pob_phrase: he is not able to enter
  simplified_phrase: they cannot enter
  preserved_meaning: Without this birth, a person is unable to enter God's kingdom.
  reasoning_layer_used: POB lexical decisions on οὐ δύναται and εἰσελθεῖν
  rationale: Singular “they” and “cannot” express the same meaning in ordinary modern English.
translation_notes:
