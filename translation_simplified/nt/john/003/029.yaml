translation:
  language: en
  text: The bride belongs to the bridegroom. But the bridegroom’s friend[a], who stands and listens to him, rejoices greatly because of the bridegroom’s voice. That is why my joy is now complete[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Culturally, this friend of the bridegroom played a role similar to a modern 'best man' at a wedding.
    reason: simplification_note
  - marker: b
    text: Or 'has been fulfilled.'
    reason: simplification_note
