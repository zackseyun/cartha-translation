translation:
  language: en
  text: The one who has the bride is the bridegroom. But the bridegroom’s friend[a] stands and listens to him. He is filled with joy when he hears the bridegroom’s voice. That is why this joy of mine is complete[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This friend played a role similar to a modern “best man” at a wedding.
    reason: cultural_note
  - marker: b
    text: Or “has been fulfilled.”
    reason: lexical_alternative
