  text: The one who comes from above is above all.[a] The one from the earth is from the earth and speaks from the earth.[b] The one who comes from heaven is above all.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “from heaven.” The Greek says “from above,” and the later phrase “from heaven” clarifies its meaning.
    reason: lexical_alternative
  - marker: b
    text: Or “speaks of the earth.” The repeated phrase may refer to the source, sphere, or subject of the person’s speech.
    reason: lexical_alternative
