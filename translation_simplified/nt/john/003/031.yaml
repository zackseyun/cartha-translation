translation:
  language: en
  text: The one who comes from above is above all[a]. The one who is from the earth belongs to the earth and speaks from the earth[b]. The one who comes from heaven is above all.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'from heaven.' The Greek word means 'from above' and is clarified by the later phrase 'from heaven.'
    reason: simplification_note
  - marker: b
    text: Or 'speaks of earthly things.' The Greek literally repeats 'from the earth,' which can indicate origin, sphere of influence, or subject matter.
    reason: simplification_note
