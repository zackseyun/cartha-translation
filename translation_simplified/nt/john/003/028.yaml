translation_notes:
  source_alignment_notes: The emphatic Greek construction 'αὐτοὶ ὑμεῖς' is perfectly rendered as 'You yourselves.' The translation faithfully conveys the contrastive 'ἀλλ’ ὅτι' with 'but' and honors the perfect periphrastic 'Ἀπεσταλμένος εἰμὶ' via 'I have been sent.'
  readability_notes:
  - The phrase 'bear me witness' is replaced with 'are my witnesses,' which sounds natural to a modern reader without losing the gravity of the legal testimony. The overall sentence structure is kept direct and fluid.
  compression_notes:
  - No major theological concepts were compressed or omitted. The double 'that' implied by the repetitive 'ὅτι' in Greek and represented as 'that... but [that]' is naturally streamlined into 'that... but,' mirroring standard POB decisions.
  risk_flags:
  - risk: Slight risk that 'witnesses' could be interpreted colloquially as passive onlookers rather than active testifiers, though in this context ('are my witnesses that I said') the active testimony is grammatically and contextually clear.
    mitigation: Flag retained for reviewer attention.
