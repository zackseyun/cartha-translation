translation_notes:
  source_alignment_notes: 'Preserves the precise grammatical and aspectual relationships of the Greek: the aorist indicative ''told'' (εἶπον), the present indicative ''do not believe'' (πιστεύετε), the future indicative ''will you believe'' (πιστεύσετε), and the conditional aorist subjunctive ''if I tell'' (ἐὰν εἴπω). This maintains the logical progression of Jesus'' challenge to Nicodemus.'
  readability_notes:
  - Kept the formal negation 'do not believe' rather than the contraction 'don't' to preserve the solemnity and gravity of the discourse. The sentence flows cleanly as a single rhetorical question, which is easily understood by modern readers.
  compression_notes:
  - Omitted the two POB lexical footnotes (offering 'things on earth' and 'things in heaven' as alternatives) to provide an uncluttered reading experience, as 'earthly things' and 'heavenly things' are fully transparent to a common audience.
