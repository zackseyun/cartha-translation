translation:
  language: en
  text: They came to John and said to him, “Rabbi, the man who was with you on the far side of the Jordan River—the one you testified about[a]—look, this man is baptizing[b], and everyone is going to him!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the one to whom you bore witness.”
    reason: lexical_alternative
  - marker: b
    text: Or “he is baptizing.” The Greek says more literally “this one,” emphasizing the person being discussed.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: beyond the Jordan
  simplified_phrase: on the far side of the Jordan River
  preserved_meaning: The location remains across the Jordan without assigning the reader a specific viewpoint.
  reasoning_layer_used: POB lexical decision for πέραν τοῦ Ἰορδάνου
  rationale: This wording makes the geography clear without the unnecessary anchoring of “the other side.”
- pob_phrase: the one who was with you
  simplified_phrase: the man who was with you
  preserved_meaning: The phrase still identifies the same male person who had been with John.
  reasoning_layer_used: POB lexical decision for ὃς
  rationale: “The man” is natural spoken English and keeps the referent clear.
- pob_phrase: to whom you have borne witness
  simplified_phrase: the one you testified about
  preserved_meaning: John had previously given testimony about this man, and that testimony remains relevant.
  reasoning_layer_used: POB lexical and theological decisions for μαρτυρέω
  rationale: “Testified about” preserves John’s witness theme in clearer modern English while the footnote retains the alternate construction.
translation_notes:
