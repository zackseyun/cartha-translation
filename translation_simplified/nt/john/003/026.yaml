translation:
  language: en
  text: They came to John and said to him, “Rabbi, the man who was with you on the other side of the Jordan River—the one you testified about[a]—look, this man is baptizing[b], and everyone is going to him!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “whom you gave witness to.” The original Greek emphasizes the act of bearing witness, a major theological theme in the Gospel of John.
    reason: simplification_note
  - marker: b
    text: Or “he is baptizing.” The Greek demonstrative pronoun ('this one') has a pointed, slightly irritated tone as used by John's disciples.
    reason: simplification_note
simplification_decisions:
- preserved_meaning: While 'beyond the Jordan' is a standard biblical phrase, 'on the other side of the Jordan River' is much clearer for a modern reader, immediately establishing the geographic setting without archaic-sounding prepositions.
