translation:
  language: en
  text: This man came to Jesus at night[a] and said to him, “Rabbi, we know that you have come from God as a teacher, for no one can do these signs[b] that you do unless God is with him[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In John's Gospel, "night" often carries symbolic weight, representing spiritual darkness or secrecy.
    reason: simplification_note
  - marker: b
    text: The Greek word for "signs" refers to actions or miracles that point beyond themselves to reveal Jesus' true identity.
    reason: simplification_note
  - marker: c
    text: Nicodemus uses a formal style, shifting from direct address ("you") to the third person ("him") at the end of his statement.
    reason: simplification_note
simplification_decisions:
- preserved_meaning: Clarified the pronoun "him" to "Jesus" to help readers immediately identify the recipient of Nicodemus's visit, and updated "by night" to the more common modern English "at night" while preserving the literal and symbolic timing.
