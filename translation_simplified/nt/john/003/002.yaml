translation:
  language: en
  text: This man came to Jesus at night[a] and said to him, “Rabbi, we know that you have come from God as a teacher. No one can do these signs[b] that you do unless God is with him[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “by night.” In John’s Gospel, night can also carry symbolic force.
    reason: lexical_alternative
  - marker: b
    text: The Greek word for “signs” can refer to miraculous actions that point beyond themselves.
    reason: lexical_alternative
  - marker: c
    text: Nicodemus shifts from speaking directly to Jesus (“you”) to speaking of him in the third person (“him”); this may reflect a formal or indirect way of speaking.
    reason: simplification_note
