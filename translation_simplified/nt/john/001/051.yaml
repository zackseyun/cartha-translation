translation:
  language: en
  text: 'Then Jesus said to him, “Truly, truly I tell all of you: you[a] will see heaven opened and the angels of God ascending and descending on the Son of Man.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Both “all of you” and “you will see” address more than one person in Greek.
    reason: source_note
  - marker: b
    text: This scene echoes Jacob’s dream in Genesis 28:12, but here the angels move on the Son of Man.
    reason: cross_reference
simplification_decisions:
- pob_phrase: And he said to him
  simplified_phrase: Then Jesus said to him
  preserved_meaning: Jesus remains the speaker addressing Nathanael in the narrative.
  reasoning_layer_used: Immediate narrative context and grounding review
  rationale: Naming Jesus and using “then” makes the transition clear.
- pob_phrase: I say to you
  simplified_phrase: I tell all of you
  preserved_meaning: Jesus solemnly addresses a group, not Nathanael alone.
  reasoning_layer_used: POB lexical and theological decisions on plural ὑμῖν
  rationale: The explicit plural prevents modern English “you” from hiding the shift in audience.
interpretive_expansions:
