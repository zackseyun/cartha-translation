    reason: cross_reference
simplification_decisions:
- pob_phrase: In the beginning was the Word
  simplified_phrase: In the beginning, the Word already existed
  preserved_meaning: The Word was already present when creation began.
  reasoning_layer_used: POB lexical decision for ἦν and immediate context
  rationale: “Already existed” makes the verb’s continuing force clear in modern English.
- pob_phrase: and the Word was with God, and the Word was God
  simplified_phrase: The Word was with God, and the Word was God
  preserved_meaning: The Word is distinguished from God in relationship yet fully shares God’s nature.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: A new sentence eases reading while preserving both carefully balanced claims.
- pob_phrase: The Greek wording presents 'God' qualitatively in the final clause
  simplified_phrase: The Greek wording affirms that the Word is fully God
  preserved_meaning: The final clause affirms full deity without identifying the Word as the same referent as God in the preceding clause.
  reasoning_layer_used: POB footnote and theological rationale
  rationale: The note explains the grammatical force without technical terminology or later person-language.
interpretive_expansions:
- pob_phrase: was
  rendering: already existed
  claim: The Word existed when the beginning arrived rather than coming into being then.
  evidence:
  - The imperfect ἦν presents ongoing existence.
  - The POB lexical audit lists “existed” as an available rendering.
  - John 1:3 contrasts the Word’s existence with created things coming into being.
  confidence: high
  alternatives_preserved:
  - was
  - existed
translation_notes:
  risk_flags:
  - risk: “Already existed” makes the durative implication more explicit than POB’s “was.”
    mitigation: The imperfect verb, POB lexical audit, and creation context support the clarification.
  - risk: “The Word was God” may sound as though no distinction remains between the Word and God in the preceding clause.
    mitigation: Footnote a preserves both the Word’s full deity and the grammatical distinction.
