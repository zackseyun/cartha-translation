translation:
  language: en
  text: In the beginning[b], the Word already existed. The Word was with God, and the Word was God.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “the Word was divine” or “what God was, the Word was.” The Greek wording affirms that the Word is fully God while distinguishing the Word from God in the preceding clause.
