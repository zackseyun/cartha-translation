  rationale: Reordering the clauses preserves both Greek verb forms while making their relationship clear.
- pob_phrase: apart from him not even one thing came into being
  simplified_phrase: apart from him, not one thing did
  preserved_meaning: Nothing came into existence independently of him.
  reasoning_layer_used: POB lexical decisions
  rationale: The substitute “did” removes repetition without weakening the emphatic exclusion.
