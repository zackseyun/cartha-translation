translation:
  language: en
  text: They asked him, “Why, then, are you baptizing if you are not the Messiah,[a] Elijah, or the Prophet?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the Christ.” The Greek title Christos is rendered “the Messiah” to preserve the Jewish setting of the question.
    reason: alternative_reading
  - marker: b
    text: “The Prophet” likely refers to the expected prophet like Moses (see Deuteronomy 18:15).
    reason: cross_reference
simplification_decisions:
- pob_phrase: And they asked him and said to him
  simplified_phrase: They asked him
  preserved_meaning: They directed this question to John.
  reasoning_layer_used: POB lexical decision for ἠρώτησαν and narrative context
  rationale: The single natural speech introduction removes Greek-style repetition without losing the act of asking.
- pob_phrase: if you are not the Messiah, nor Elijah, nor the Prophet
  simplified_phrase: if you are not the Messiah, Elijah, or the Prophet
  preserved_meaning: The question names three distinct expected figures whom John has denied being.
  reasoning_layer_used: POB lexical and theological decisions for οὐδέ, Messiah, Elijah, and the Prophet
  rationale: English list form makes the alternatives easier to follow while keeping all three titles distinct.
- pob_phrase: are you baptizing
  simplified_phrase: are you baptizing
  preserved_meaning: John's current, ongoing practice of baptizing is being questioned.
  reasoning_layer_used: POB lexical decision for βαπτίζεις
  rationale: The progressive form remains because it clearly conveys the ongoing activity.
translation_notes:
  risk_flags:
  - risk: Modern list wording could make “the Prophet” sound like a general prophet.
    mitigation: Capitalization and the qualified cross-reference note preserve its force as a recognized title.
