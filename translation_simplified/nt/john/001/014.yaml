translation:
  language: en
  text: The Word became flesh and lived among us[a]. We saw his glory—glory as of the one and only Son from the Father[b], full of grace and truth.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “tabernacled among us”; the Greek verb echoes the image of God living with his people in the tabernacle.
    reason: lexical_alternative
  - marker: b
    text: Or “only begotten Son”; alternatively, “unique Son.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: dwelt among us
