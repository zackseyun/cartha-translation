  preserved_meaning: The Word truly made his home among human beings, while the footnote preserves the tabernacle image.
  reasoning_layer_used: POB lexical and theological decisions on ἐσκήνωσεν
  rationale: “Lived” is more familiar than “dwelt” for modern readers.
- pob_phrase: And the Word became flesh and dwelt among us, and we saw
  simplified_phrase: The Word became flesh and lived among us. We saw
  preserved_meaning: The incarnation, presence among humanity, and eyewitness testimony remain distinct and complete.
  reasoning_layer_used: POB translation and source clause structure
  rationale: Two sentences make the sequence easier to follow without dropping any claim.
- pob_phrase: glory as of the one and only Son from the Father
  simplified_phrase: glory—glory as of the one and only Son from the Father
  preserved_meaning: The wording retains the source’s comparative nuance and the Son’s unique relation to the Father.
  reasoning_layer_used: POB lexical decision on ὡς and grounding review
  rationale: The em dash clarifies the repeated phrase while preserving “as of.”
