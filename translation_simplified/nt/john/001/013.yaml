  text: who were born, not of bloodlines,[a] nor of physical desire, nor of a husband's will,[b] but of God.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek literally reads 'bloods' (plural), an ancient idiom referring to ancestral lineage or human descent.
    reason: simplification_note
  - marker: b
    text: Or 'a man's will.' The Greek word specifically denotes an adult male or husband, pointing to the male role in human procreation.
    reason: simplification_note
