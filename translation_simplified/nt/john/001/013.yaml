translation:
  language: en
  text: who were born—not from bloodlines,[a] nor from physical desire, nor from a man's will,[b] but from God.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek literally says “bloods,” an unusual plural referring to ancestral lineage or human descent.
    reason: simplification_note
  - marker: b
    text: Or “a husband’s will”; the Greek can mean an adult male or husband, but the broader wording fits here.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: not from bloods
  simplified_phrase: not from bloodlines
  preserved_meaning: This preserves the unusual expression’s reference to natural descent or human parentage.
  reasoning_layer_used: POB lexical decision and footnote
  rationale: “Bloodlines” communicates the idiom clearly while the note preserves its striking literal form.
- pob_phrase: nor from the will of the flesh
  simplified_phrase: nor from physical desire
  preserved_meaning: This retains the reference to natural human procreative impulse rather than sinful nature.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: “Physical desire” prevents modern readers from mistaking “flesh” for moral corruption here.
- pob_phrase: nor from the will of a man
  simplified_phrase: nor from a man's will
  preserved_meaning: This preserves the contrast with male human agency without restricting the man to a husband.
  reasoning_layer_used: POB lexical decision and grounding review
  rationale: The possessive form is natural English and keeps the POB’s broader chosen term.
