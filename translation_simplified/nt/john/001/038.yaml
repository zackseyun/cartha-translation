translation:
  language: en
  text: Jesus turned around and saw them following him. He asked, “What are you seeking?”[a] They said to him, “Rabbi”[b] (which means Teacher), “where are you staying?”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “What are you looking for?” The Greek can refer to ordinary searching, but “seeking” better preserves the possible deeper spiritual sense in John’s narrative.
    reason: simplification_note
  - marker: b
    text: “Rabbi” is a Hebrew/Aramaic title meaning “Teacher.”
    reason: simplification_note
  - marker: c
    text: Or “where are you remaining?” The Greek verb is the same one often rendered “remain” or “abide” elsewhere in John.
    reason: simplification_note
