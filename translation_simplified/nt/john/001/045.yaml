  preserved_meaning: Both Moses in the Law and the prophets wrote about the same person Philip says they have found.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: Two short sentences remove the awkward relative construction while preserving both scriptural witnesses.
- pob_phrase: Jesus son of Joseph, from Nazareth
  simplified_phrase: He is Jesus, son of Joseph, from Nazareth.
  preserved_meaning: Philip identifies Jesus by his ordinary social designation and his association with Nazareth.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: A direct identifying sentence clarifies the apposition without doctrinally modifying “son of Joseph.”
