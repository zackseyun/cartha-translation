translation_notes:
  source_alignment_notes: We retained the perfect tense of 'I have seen' (Τεθέαμαι) to convey a witnessed sight with ongoing relevance. We also kept the neuter pronoun 'it' to refer back to the Spirit, maintaining consistency with the POB revision pass that avoids projecting a masculine pronoun onto the neuter referent in Greek.
  readability_notes:
  - The sentence was simplified by removing the redundancy of 'saying' and shortening the prepositional weight from 'descending like a dove out of heaven' to 'coming down like a dove from heaven.' This flows much more naturally in modern English speech.
  compression_notes:
  - No theological or narrative details were compressed out. The only omission was the syntactical participle 'saying' (λέγων), which is redundant when introducing direct quotes in modern English punctuation.
