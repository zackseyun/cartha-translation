translation:
  language: en
  text: Six stone water jars were standing there, used for Jewish purification rites[a]. Each jar held two or three measures[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: These stone jars were used in Jewish ritual cleansing practices.
    reason: simplification_note
  - marker: b
    text: A “measure” (Greek metretēs) was an ancient liquid unit of about 8 to 9 gallons (35 to 40 liters), so each jar could hold about 20 to 30 gallons (70 to 120 liters).
    reason: cultural_note
