translation_notes:
  source_alignment_notes: The simplified text maintains the SBLGNT source details. 'Six' (ἓξ) and 'stone' (λίθιναι) are precisely aligned. The use of 'standing there' preserves both 'ἦσαν ἐκεῖ' and the state of 'κείμεναι'. The word 'measures' directly translates 'μετρητάς' in a literal yet understandable manner, matching POB's optimal-equivalence stance.
  readability_notes:
  - By splitting the sentence and replacing formal syntax ('in accordance with') with a direct functional description ('used for'), the text becomes much easier for a modern audience to digest. The flow is natural without losing the solemn tone of the narrative.
  compression_notes:
  - The connective 'Now' (δέ) was omitted at the start of the verse to allow a direct and strong narrative opening. This does not change the meaning since the context of the wedding at Cana is already established. The prepositional phrase 'in accordance with' was compressed to 'used for' to simplify the syntax.
  risk_flags:
  - risk: There is a minor risk that substituting 'used for' slightly narrows the Greek 'κατά' (which means 'according to' or 'in conformity with'), but because the jars were specifically there for that purpose, this is a highly accurate and safe rendering for the target audience.
    mitigation: Flag retained for reviewer attention.
