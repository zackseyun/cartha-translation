    text: In the ancient world, addressing someone as 'Woman' was a polite and respectful form of address, not rude as it might sound in English today.
    reason: cultural_note
  - marker: b
    text: This expression is an ancient idiom meaning 'Why are you involving me?' or 'This is not our concern.' It signals a difference of focus or responsibility rather than hostility.
    reason: lexical_alternative
