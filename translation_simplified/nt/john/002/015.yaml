translation_notes:
  source_alignment_notes: Preserved the direct translation of 'poured out' (ἐξέχεεν) instead of switching to a weaker synonym like 'scattered,' maintaining the vivid, fluid force of the Greek. Preserved 'them all' (πάντας) followed by the appositional animals to keep the exact level of syntactic ambiguity present in the Greek text regarding the targets of the whip.
  readability_notes:
  - By removing the initial coordinating 'And' (καί) and splitting the compound predicate, we transformed a 39-word sentence into two sentences of 21 and 13 words respectively. This dramatically lowers the cognitive load while preserving the solemnity of the event.
  compression_notes:
  - Dropped the POB footnote discussing the 'oxen' alternative. Modern readers easily understand 'cattle' as covering oxen, and adding livestock translation variants does not serve the target audience's needs. Simplified the phrasing of the remaining footnotes to be direct and accessible.
  risk_flags:
  - risk: None. The potential risk of over-specifying whether Jesus whipped human beings was successfully avoided by retaining the POB's exact syntactic structure and carrying over the interpretive footnote in a more readable format.
    mitigation: Flag retained for reviewer attention.
