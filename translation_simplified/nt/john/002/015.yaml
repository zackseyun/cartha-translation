translation:
  language: en
  text: He made a whip from cords and drove them all out of the temple courts[a], including both the sheep and the cattle[b]. He also poured out the coins of the money changers and overturned their tables.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word refers to the entire temple complex or outer courts, rather than the inner sanctuary.
    reason: simplification_note
  - marker: b
    text: The Greek text says 'them all,' then specifies 'both the sheep and the cattle.' It is not clear whether Jesus used the whip on the people or only on the animals.
    reason: simplification_note
simplification_decisions:
- simplified_phrase: He made a whip from cords
  preserved_meaning: Converted the leading historical present participle into a direct active past-tense verb to begin the sentence with clear narrative momentum, avoiding a clunky opening subordinate clause.
  reasoning_layer_used: POB audit trail
  rationale: Converted the leading historical present participle into a direct active past-tense verb to begin the sentence with clear narrative momentum, avoiding a clunky opening subordinate clause.
- simplified_phrase: drove them all out of the temple courts, including both the sheep and the cattle. He also poured out...
  preserved_meaning: Split the long sentence into two to help modern readers process the physical expulsion of the livestock and sellers separately from the financial disruption of the coin tables.
  reasoning_layer_used: POB audit trail
  rationale: Split the long sentence into two to help modern readers process the physical expulsion of the livestock and sellers separately from the financial disruption of the coin tables.
- simplified_phrase: the coins of the money changers and overturned their tables
  preserved_meaning: Added 'their' to make the relationship between the tables and the money changers immediately clear to a modern reader without changing the underlying meaning.
  reasoning_layer_used: POB audit trail
  rationale: Added 'their' to make the relationship between the tables and the money changers immediately clear to a modern reader without changing the underlying meaning.
