translation:
  language: en
  text: And he said to him, “Everyone serves the good wine first. Then, after the guests have become drunk[a], the inferior wine is served. But you have kept the good wine until now.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “have drunk freely.” The Greek verb refers to becoming intoxicated; this reports a social observation rather than endorsing drunkenness.
    reason: lexical_alternative
