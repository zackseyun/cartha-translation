translation:
  language: en
  text: The master of the banquet[a] tasted the water that had become wine. He did not know where it came from—though the servants who had drawn the water knew. Then he called[b] the bridegroom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “headwaiter.” This refers to the person in charge of managing the banquet.
    reason: simplification_note
  - marker: b
    text: The Greek text uses the vivid present tense “calls,” but it is rendered here as “called” for natural English narrative flow.
    reason: simplification_note
