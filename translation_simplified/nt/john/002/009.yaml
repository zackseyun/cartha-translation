- pob_phrase: master of the feast
  simplified_phrase: master of the banquet
  preserved_meaning: The person responsible for overseeing the wedding banquet.
  reasoning_layer_used: POB lexical decision for ἀρχιτρίκλινος
  rationale: “Banquet” makes the setting and role clearer to a modern reader.
- pob_phrase: When ... and did not know ... (though ... knew), the master of the feast calls
  simplified_phrase: Three shorter sentences ending with “Then he called”
  preserved_meaning: He tasted the transformed water, lacked knowledge of its source, and next called the bridegroom.
  reasoning_layer_used: Source syntax, POB translation, and grounding review
  rationale: Short sentences clarify the sequence without adding the causal force implied by “so.”
- pob_phrase: calls
  simplified_phrase: called
  preserved_meaning: The banquet master called the bridegroom at that point in the narrative.
  reasoning_layer_used: POB lexical note on the historical present
  rationale: The past tense gives natural English narration while the footnote preserves the Greek vivid present.
