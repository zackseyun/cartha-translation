simplification_decisions:
- pob_phrase: answered and said to him
  simplified_phrase: answered him
  preserved_meaning: They responded directly to Jesus.
  reasoning_layer_used: POB lexical decision for ἀπεκρίθησαν and εἶπαν αὐτῷ
  rationale: The shorter wording removes a repetitive speech formula without losing the response.
- pob_phrase: What sign do you show us
  simplified_phrase: What sign do you show us
  preserved_meaning: They demand an authenticating sign rather than asking whether Jesus is able to give one.
  reasoning_layer_used: POB lexical decision for σημεῖον and δεικνύεις; grounding review
  rationale: Keeping “do you show” avoids adding the unsupported ability nuance of “can you show.”
- pob_phrase: that you do these things
  simplified_phrase: since you are doing these things
  preserved_meaning: Jesus’ temple actions are the grounds for their demand.
  reasoning_layer_used: POB lexical decisions for ὅτι and ποιεῖς
  rationale: The causal connector and progressive verb make the relationship natural and clear in English.
