translation:
  language: en
  text: I am no longer in the world, but they are still in the world, and I am coming to you. Holy Father, keep them in your name[a], which you have given to me[b], so that they may be one, just as we are one.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “keep them by your name” or “protect them through your name.”
    reason: lexical_alternative
  - marker: b
    text: Some manuscripts are understood to read “keep them in your name those whom you have given me.” This translation follows the SBLGNT reading, in which “which” refers to “name.”
    reason: textual_variant
simplification_decisions:
- pob_phrase: but they are in the world
  simplified_phrase: but they are still in the world
  preserved_meaning: The disciples remain in the earthly human sphere from which Jesus is departing.
  reasoning_layer_used: POB lexical decision for κόσμος and immediate contrast
  rationale: “Still” makes the contrast with Jesus’ departure immediately clear.
- pob_phrase: just as we are
  simplified_phrase: just as we are one
  preserved_meaning: The disciples’ unity is compared with the unity of the Father and Son without defining its nature further.
  reasoning_layer_used: POB lexical and theological decisions for καθὼς ἡμεῖς
  rationale: Repeating “one” completes the comparison naturally in English.
interpretive_expansions:
- pob_phrase: but they are in the world
  rendering: but they are still in the world
  claim: The disciples continue to remain in the world as Jesus departs.
  evidence:
  - The contrast joins Jesus being no longer in the world with the disciples remaining there.
  confidence: high
  alternatives_preserved:
  - but they are in the world
translation_notes:
  risk_flags:
