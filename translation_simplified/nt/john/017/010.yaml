simplification_decisions:
- pob_phrase: all that is mine
  simplified_phrase: Everything that is mine
  preserved_meaning: Preserves the comprehensive scope of all that belongs to Jesus.
  reasoning_layer_used: POB lexical decision for τὰ ἐμὰ πάντα
  rationale: “Everything” makes the full scope immediately clear without suggesting only material things.
- pob_phrase: what is yours is mine
  simplified_phrase: everything that is yours is mine
  preserved_meaning: Preserves the direct statement of mutual possession between the Father and the Son.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The repeated “everything” clarifies the balanced claim without weakening it.
- pob_phrase: and I have been glorified in them
  simplified_phrase: I have been glorified in them
  preserved_meaning: Retains both the completed glory with continuing effect and the ambiguity of “in them.”
  reasoning_layer_used: POB lexical decisions for δεδόξασμαι and ἐν αὐτοῖς
  rationale: A new sentence makes the final claim easier to follow while preserving its wording and force.
translation_notes:
  risk_flags:
