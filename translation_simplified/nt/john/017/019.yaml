translation:
  language: en
  text: And for their sake, I set myself apart as holy,[a] so that they too may be set apart as holy in truth.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The same Greek verb is used in both parts of the verse and is traditionally translated “sanctify.” Here Jesus dedicates himself to his mission; he is not becoming morally purer.
    reason: simplification_note
  - marker: b
    text: Or “in the truth”; compare John 17:17.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: I sanctify myself
  simplified_phrase: I set myself apart as holy
  preserved_meaning: Jesus consecrates himself for his mission rather than becoming morally purer.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The plain wording directly expresses the audited consecratory meaning.
- pob_phrase: they also may be sanctified
  simplified_phrase: they too may be set apart as holy
  preserved_meaning: The disciples are intended to enter the resulting state of sanctification.
  reasoning_layer_used: POB lexical decision and Greek root repetition
  rationale: Repeating the same phrase preserves the deliberate link between Jesus and the disciples.
translation_notes:
  risk_flags:
  - risk: “Set apart as holy” may be heard only as separation rather than consecration.
    mitigation: The first footnote identifies the traditional term and explains Jesus’ self-dedication.
  - risk: “In truth” can also be understood more definitely as “in the truth.”
    mitigation: The second footnote preserves the live alternative without resolving it.
