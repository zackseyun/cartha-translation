translation:
  language: en
  text: May they all be one[a], just as you, Father, are in me and I am in you. May they also be in us[b], so that the world may believe that you sent me.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “may all be united.” The Greek more literally says “may all be one,” which does not limit their unity to one particular kind.
    reason: lexical_alternative
  - marker: b
    text: The repeated word “in” expresses mutual indwelling and participation, not merely association.
    reason: cross_reference
