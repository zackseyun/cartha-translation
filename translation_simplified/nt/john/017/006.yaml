translation:
  language: en
  text: I have made your name known[a] to the men you gave me out of the world. They belonged to you, and you gave them to me, and they have kept your word[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: God's “name” means his revealed identity and character, not only a spoken name.
    reason: cultural_note
