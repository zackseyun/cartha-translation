translation:
  language: en
  text: I made your name known to them[a], and I will make it known, so that the love you showed me may be in them[b], and I may be in them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: God’s “name” means his revealed identity and character; the phrase may also be translated “I revealed your name to them.”
    reason: cultural_note
  - marker: b
    text: Or “among them,” though “in them” better preserves John’s theme of indwelling.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: and I will make it known
  simplified_phrase: and I will make it known
  preserved_meaning: Jesus promises future disclosure without stating that the action will be continuous.
  reasoning_layer_used: POB lexical decision and grounding review
  rationale: Removing “keep” restores the simple future sense of the Greek verb.
- pob_phrase: the love with which you loved me
  simplified_phrase: the love you showed me
  preserved_meaning: The love in the disciples is the love the Father directed toward the Son.
  reasoning_layer_used: POB lexical decision for ἣν ἠγάπησάς με
  rationale: The simpler clause removes an awkward English construction while preserving who loved whom.
- pob_phrase: and I in them
  simplified_phrase: and I may be in them
  preserved_meaning: Christ’s indwelling remains coordinated with the Father’s love being in the disciples.
  reasoning_layer_used: POB lexical and theological decisions on the final clause
  rationale: Supplying the implied verb makes the elliptical clause immediately clear.
translation_notes:
  risk_flags:
  - risk: Modern readers may understand “name” as only a spoken designation.
    mitigation: Footnote a explains that it refers to God’s revealed identity and character.
  - risk: “In them” can also be understood as “among them.”
    mitigation: Footnote b preserves the alternative while retaining the Johannine indwelling language.
