translation:
  language: en
  text: So, when they had rowed about three or four miles (five or six kilometers), they saw Jesus walking on the sea[a] and coming near the boat. They were afraid.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “walking on the water.” The Greek literally says “walking on the sea.”
