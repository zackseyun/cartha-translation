  preserved_meaning: The wording keeps both the narrative connection and the rowing as prior action.
  reasoning_layer_used: POB lexical decisions for οὖν and ἐληλακότες
  rationale: Retaining “So, when” avoids overstating the sequence as “After” did.
- pob_phrase: about twenty-five or thirty stadia
  simplified_phrase: about three or four miles (five or six kilometers)
  preserved_meaning: The same approximate distance is expressed in units common readers understand.
  reasoning_layer_used: POB cultural note and grounding review
  rationale: The POB note provides the established modern conversion used in the main text.
- pob_phrase: and they were afraid
  simplified_phrase: They were afraid.
  preserved_meaning: The disciples’ fearful reaction remains distinct and unchanged.
  reasoning_layer_used: POB lexical decision for ἐφοβήθησαν
  rationale: A separate sentence makes the reaction easier to grasp without weakening it.
