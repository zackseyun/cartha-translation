  readability_notes:
  - The transition from 'work the works' to 'do the works' vastly improves modern readability, resolving an unnatural English phrase into clear, standard idiom while preserving the conceptual focus on 'works' (deeds).
  compression_notes:
  - Compressed the purposive clause 'so that we may work' into a direct infinitive of purpose 'to do'. This removes grammatical clutter (the auxiliary verb and pronoun) without altering the teleological relationship of the actions.
  risk_flags:
