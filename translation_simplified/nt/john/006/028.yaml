translation:
  language: en
  text: Then they asked him[a], "What must we do to do the works of God?"
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “What should we do so that we may work the works of God?” The Greek phrase “the works of God” can also mean “the works God requires.”
