simplification_decisions:
- pob_phrase: This is the bread that comes down from heaven
  simplified_phrase: This bread comes down from heaven
  preserved_meaning: Jesus directly identifies the bread as coming from the divine heavenly realm.
  reasoning_layer_used: POB lexical decisions for οὗτός, ἄρτος, and καταβαίνων
  rationale: Removing “is the bread that” makes the identification more direct while preserving the bread image and present movement.
- pob_phrase: anyone may eat from it
  simplified_phrase: anyone may eat it
  preserved_meaning: The invitation remains open to any person who eats the bread.
  reasoning_layer_used: POB lexical decisions for τις and ἐξ αὐτοῦ φάγῃ
  rationale: “Eat it” is more natural common English and retains the same object and action.
- pob_phrase: and not die
  simplified_phrase: and not die
  preserved_meaning: The kind of death remains deliberately unspecified.
  reasoning_layer_used: POB theological decision on μὴ ἀποθάνῃ
  rationale: The broad wording is retained because the verse does not define the death more narrowly.
