translation_notes:
  source_alignment_notes: The translation directly aligns with the SBLGNT text. 'Two hundred silver coins' translates the amount 'Διακοσίων δηναρίων' (with the coin name preserved in the footnote). 'Is not enough' preserves 'οὐκ ἀρκοῦσιν'. 'For each person to get even a little' translates the intent of 'ἵνα ἕκαστος βραχύ τι λάβῃ'.
  readability_notes:
  - Converting the literal but clunky 'so that each one may receive a little' into the idiomatic 'for each person to get even a little' significantly increases readability without compromising the solemnity of the passage.
  compression_notes:
  - We consolidated the redundant phrasing 'enough for them, so that each one' into 'enough for each person' to streamline the sentence structure without losing any meaning.
  risk_flags:
  - risk: Replacing 'denarii' with 'silver coins' slightly reduces immediate historical precision in the primary text, but this is fully resolved by the detailed footnote.
    mitigation: Flag retained for reviewer attention.
