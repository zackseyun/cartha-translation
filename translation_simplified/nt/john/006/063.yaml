  text: The Spirit is the one who gives life[a]; the flesh is of no help at all[b]. The words I have spoken to you are spirit and life[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'the spirit gives life.' The Greek word can mean 'Spirit' or 'spirit'; the context here points to the Holy Spirit.
