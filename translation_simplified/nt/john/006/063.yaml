translation:
  language: en
  text: The Spirit is the one who gives life[a]; what is merely human is of no help at all[b]. The words I have spoken to you are spiritual and give life[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the spirit gives life.” The Greek word can mean “Spirit” or “spirit”; the context here points to the Holy Spirit.
    reason: alternative_reading
  - marker: b
    text: Literally, “the flesh.” This refers broadly to what is merely human, not specifically to the physical body or to “sinful nature.”
    reason: lexical_alternative
  - marker: c
    text: Or “are spirit and life.” The compressed Greek wording describes Jesus’ words as characterized by spirit and life.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: It is the Spirit who gives life
  simplified_phrase: The Spirit is the one who gives life
  preserved_meaning: The Holy Spirit is the likely life-giving agent.
  reasoning_layer_used: POB lexical and theological decisions on πνεῦμα
  rationale: The direct word order is easier to read without changing the likely referent.
- pob_phrase: the flesh benefits nothing
  simplified_phrase: what is merely human is of no help at all
  preserved_meaning: Merely human capacity cannot provide the life in view.
  reasoning_layer_used: POB lexical rationale for σὰρξ and immediate context
  rationale: The broad clarification avoids suggesting only skin, body, or sinful nature.
- pob_phrase: are spirit and are life
  simplified_phrase: are spiritual and give life
  preserved_meaning: Jesus’ words are characterized by spirit and life-giving power.
  reasoning_layer_used: POB qualitative reading and footnote c
  rationale: The qualitative meaning is expressed in ordinary contemporary English.
interpretive_expansions:
- pob_phrase: the flesh
  rendering: what is merely human
  claim: The phrase broadly concerns human capacity apart from the Spirit’s life-giving work.
  evidence:
  - POB permits the broad sense “what is merely human.”
  - John 6:60–65 contrasts human inability with divine enabling.
  confidence: moderate
  alternatives_preserved:
  - the flesh
  - physical body
  - sinful nature
- pob_phrase: are spirit and are life
  rendering: are spiritual and give life
  claim: Jesus’ words have a spiritual quality and communicate life.
  evidence:
  - POB identifies the predicate as qualitative.
  - POB footnote c permits “spiritual and life-giving.”
  confidence: high
  alternatives_preserved:
  - are spirit and life
  - are Spirit and life
translation_notes:
  risk_flags:
  - risk: “What is merely human” may seem narrower than the broad image of “flesh.”
    mitigation: Footnote [b] retains the literal image and excludes two unwarranted narrow readings.
  - risk: “Spiritual” could be mistaken for identifying the words directly with the Holy Spirit.
    mitigation: Footnote [c] preserves the qualitative Greek wording and its alternatives.
