translation:
  language: en
  text: When the people saw the sign[a] Jesus had performed, they kept saying, “This truly is the Prophet[b] who is coming into the world.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “miracle.” John regularly uses “sign” to emphasize what Jesus’s works reveal, not only their miraculous character.
    reason: lexical_alternative
  - marker: b
    text: “The Prophet” likely refers to the expected prophet like Moses promised in Deuteronomy 18:15–18.
    reason: cross_reference
simplification_decisions:
- pob_phrase: the sign that he had done
  simplified_phrase: the sign Jesus had performed
  preserved_meaning: Jesus performed the revelatory miracle that the crowd saw.
  reasoning_layer_used: Immediate context and POB lexical decision
  rationale: Naming Jesus removes an unclear pronoun, while “performed” is natural English for carrying out a sign.
- pob_phrase: they were saying
  simplified_phrase: they kept saying
  preserved_meaning: The crowd’s declaration was ongoing or repeated.
  reasoning_layer_used: POB lexical decision on the imperfect ἔλεγον
  rationale: “Kept saying” expresses the imperfect aspect more clearly in modern English.
interpretive_expansions:
- pob_phrase: he
