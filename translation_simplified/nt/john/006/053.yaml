translation:
  language: en
  text: So Jesus said to them, “Truly, truly, I tell you, unless you eat the flesh[a] of the Son of Man and drink his blood, you have no life[b] in you.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word specifically means 'flesh' (rather than the word for 'body'), preserving the concrete and vivid nature of Jesus' statement.
    reason: simplification_note
  - marker: b
    text: The Greek text says simply 'life' rather than 'eternal life,' although in this Gospel, this life is closely linked to eternal life.
    reason: simplification_note
