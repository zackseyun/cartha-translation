translation:
  language: en
  text: So they asked him, “What sign will you do then, so we can see it and believe you?[a] What work will you perform?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “believe in you” or “trust you.” The Greek text literally says “believe you,” which means believing His words or claims, unlike the more common phrase “believe in” used elsewhere in John.
    reason: simplification_note
