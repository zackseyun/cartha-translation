  readability_notes:
  - The rhetorical flow was smoothed out by framing the crowd's demands in the immediate future ('will you do', 'will you perform'), which sounds more natural in modern English than a literal present-progressive tense ('are you doing', 'are you performing') when demanding a future proof.
