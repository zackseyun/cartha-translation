translation_notes:
  source_alignment_notes: Maintained the ambiguous genitive 'the work of God' (τοῦ θεοῦ) to prevent over-resolving the text's intentional theological tension. Preserved the plural aspect of 'that you believe'.
  readability_notes:
  - By bypassing the archaic double-verb introduction and removing the relative pronoun 'whom,' the sentence flows much more naturally for a modern reader.
  compression_notes:
  - Compressed the speech introduction and shifted the present perfect auxiliary 'has sent' to simple past 'sent' to better match modern English narrative flow.
  risk_flags:
  - risk: A major risk was over-simplifying 'the work of God' to something like 'what God wants,' which would eliminate the theological ambiguity of whether this work is human action or divine agency. This was avoided by retaining the phrase and keeping the clarifying footnote.
    mitigation: Flag retained for reviewer attention.
