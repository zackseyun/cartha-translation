translation:
  language: en
  text: Jesus said to them, “I am the bread of life. Whoever comes to me will never be hungry, and whoever believes in me will never be thirsty again.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “will by no means ever thirst.” The Greek strongly emphasizes “never” and includes the sense of “ever.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the one who comes to me ... the one who believes in me
  simplified_phrase: Whoever comes to me ... whoever believes in me
  preserved_meaning: The wording retains the generic invitation to any person who comes to Jesus and believes in him.
  reasoning_layer_used: POB lexical decisions for the substantival present participles
  rationale: “Whoever” expresses the same general scope in more natural modern English.
- pob_phrase: I am the bread of life;
  simplified_phrase: I am the bread of life.
  preserved_meaning: Jesus’ direct self-identification and the bread metaphor remain unchanged.
  reasoning_layer_used: POB lexical and theological decisions for Ἐγώ εἰμι and ὁ ἄρτος τῆς ζωῆς
  rationale: A sentence break makes the declaration easier to follow without weakening it.
- pob_phrase: will never hunger ... will never thirst again
  simplified_phrase: will never be hungry ... will never be thirsty again
  preserved_meaning: The natural English adjectives preserve both bodily images and the emphatic promises of lasting satisfaction.
  reasoning_layer_used: POB lexical decisions for οὐ μὴ πεινάσῃ and οὐ μὴ διψήσει πώποτε
  rationale: “Be hungry” avoids the food-deprivation nuance of “go hungry,” while “be thirsty” is clear modern English.
