translation:
  language: en
  text: 'For this is what my Father wants: everyone who sees[a] the Son and believes in him will have eternal life, and I myself[b] will raise each one up on the last day.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “beholds.” The Greek verb can suggest looking attentively, not merely seeing physically.
    reason: lexical_alternative
  - marker: b
    text: The Greek explicitly includes “I” for emphasis.
    reason: source_note
