translation:
  language: en
  text: Do not work for food that spoils, but for food that lasts for eternal life. This is the food the Son of Man will give you, because God the Father has placed his seal on him[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A seal was an official mark. Here it shows that God has authorized and authenticated him.
    reason: simplification_note
