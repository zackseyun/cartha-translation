  preserved_meaning: The enduring food is for eternal life and is given by the Son of Man.
  reasoning_layer_used: POB lexical decisions for μένουσαν, εἰς ζωὴν αἰώνιον, and ὑμῖν δώσει
  rationale: Two sentences make the relationship between the food and the giver easier to follow.
- pob_phrase: for God the Father has set his seal on him
  simplified_phrase: because God the Father has placed his seal on him
  preserved_meaning: God the Father has authorized and authenticated the Son of Man.
  reasoning_layer_used: POB theological decision for ἐσφράγισεν and ὁ πατὴρ … ὁ θεός
  rationale: The wording keeps the seal image while the footnote explains its contextual meaning.
