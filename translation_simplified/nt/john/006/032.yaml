  text: So Jesus said to them, “Very truly I tell you, it was not Moses who gave you the bread from heaven. My Father gives you the true bread from heaven.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “True” can also mean “real” or “genuine,” describing the ultimate bread from heaven in contrast to the earlier manna.
