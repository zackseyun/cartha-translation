translation:
  language: en
  text: Anyone who has my commandments and keeps them is the one who loves me. Anyone who loves me will be loved by my Father. I will love that person[a] and reveal myself to that person.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek uses masculine singular forms to represent any person.
    reason: source_note
  - marker: b
    text: “Reveal myself” can also be rendered “show myself”; the sense is personal self-disclosure.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: The one who has my commandments and keeps them
  simplified_phrase: Anyone who has my commandments and keeps them
  preserved_meaning: The statement applies to any representative individual who has and faithfully keeps Jesus’s commandments.
  reasoning_layer_used: POB lexical decision for ὁ ἔχων and footnote a
  rationale: “Anyone” makes the generic scope immediately clear without changing the singular representative force.
- pob_phrase: And the one who loves me will be loved by my Father, and I will love him
  simplified_phrase: Anyone who loves me will be loved by my Father. I will love that person
  preserved_meaning: Both the Father and Jesus love the person who loves Jesus, without implying that this love is earned.
  reasoning_layer_used: POB theological decision on love and obedience and lexical decisions for ἀγαπάω
  rationale: Two sentences clarify the sequence while preserving the repeated language of love.
- pob_phrase: him / to him
  simplified_phrase: that person / to that person
  preserved_meaning: The singular person remains the same throughout, while the source masculine is understood representatively.
  reasoning_layer_used: POB lexical alternative and footnote a
  rationale: “That person” is clearer for a generic modern audience and avoids suggesting that only men are meant.
translation_notes:
  risk_flags:
  - risk: “That person” does not reproduce the Greek masculine pronouns formally.
    mitigation: Footnote a records that the masculine singular forms have representative force.
  - risk: “Reveal myself” might be mistaken for only a visible appearance.
    mitigation: Footnote b preserves the broader sense of Jesus personally making himself known.
