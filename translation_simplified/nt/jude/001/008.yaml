  reasoning_layer_used: Lexical decision for Ὁμοίως μέντοι and immediate context
  rationale: “Follow the same pattern” expresses the comparison in natural English while retaining “yet.”
- pob_phrase: relying on dreams
  simplified_phrase: rely on dreams to justify what they do
  preserved_meaning: They appeal to dreams as warrant for their conduct.
  reasoning_layer_used: Lexical and theological decisions for ἐνυπνιαζόμενοι
  rationale: The added clause clearly states the documented relationship between their dreams and conduct.
- pob_phrase: defile the flesh
  simplified_phrase: make the flesh morally unclean
  preserved_meaning: Their conduct stains the flesh with moral impurity without reducing flesh to the body or sinful nature.
  reasoning_layer_used: Lexical decisions for σάρκα and μιαίνουσιν
  rationale: This explains “defile” while preserving the image of flesh becoming unclean.
