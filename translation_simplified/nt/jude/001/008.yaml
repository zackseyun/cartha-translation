translation:
  language: en
  text: 'Yet these people follow the same pattern. They rely on dreams to justify what they do: they make the flesh morally unclean, reject authority, and slander glorious ones.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “dreaming” or “being dreamers.” The wording may simply describe them this way, though it likely means that they appeal to dreams to support their behavior.
    reason: lexical_alternative
  - marker: b
    text: “Glorious ones” probably means exalted heavenly beings, possibly angels.
    reason: alternative_reading
