translation:
  language: en
  text: But you, beloved, as you build yourselves up in your most holy faith[a] and pray in the Holy Spirit[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “on your most holy faith”; the image may be of building on faith as a foundation.
    reason: lexical_alternative
