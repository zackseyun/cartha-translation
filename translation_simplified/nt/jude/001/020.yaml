simplification_decisions:
- pob_phrase: building yourselves up in your most holy faith
  simplified_phrase: as you build yourselves up in your most holy faith
  preserved_meaning: The community strengthens itself while retaining the building image and its most holy faith.
  reasoning_layer_used: Lexical decisions for ἐποικοδομοῦντες, ἑαυτούς, and πίστει
  rationale: “As you build” is easier to follow while keeping the action subordinate to the instruction in verse 21.
- pob_phrase: praying in the Holy Spirit
  simplified_phrase: and pray in the Holy Spirit
  preserved_meaning: The community prays within the Holy Spirit’s influence without excluding the Spirit’s enabling agency.
  reasoning_layer_used: Lexical and theological decision for ἐν πνεύματι ἁγίῳ
  rationale: The finite verb is clearer in English while “as” keeps both actions grammatically connected to what follows.
interpretive_expansions:
