translation:
  language: en
  text: To the one who can keep you from stumbling and present you blameless before his glory with rejoicing,[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “from falling.” The Greek image can refer to stumbling or falling into error.
    reason: lexical_alternative
  - marker: b
    text: Traditional English often says “before his glorious presence,” but the Greek more literally says “before his glory.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: the one who is able to keep you
  simplified_phrase: the one who can keep you
  preserved_meaning: God has the power to guard his people from stumbling.
  reasoning_layer_used: Lexical decisions for Τῷ ... δυναμένῳ and φυλάξαι
  rationale: “Can” expresses ability more directly in common English.
- pob_phrase: and to present you blameless
  simplified_phrase: and present you blameless
  preserved_meaning: He can cause his people to stand blameless before his glory.
  reasoning_layer_used: Lexical decisions for καὶ στῆσαι and ἀμώμους
  rationale: Removing the repeated “to” makes the coordinated actions flow naturally without weakening the presentation sense.
translation_notes:
  risk_flags:
