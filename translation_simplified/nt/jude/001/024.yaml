    mitigation: The wording preserves the source phrase’s participant and attachment ambiguity.
  - risk: “Before his glory” may be less immediately familiar than “before his glorious presence.”
    mitigation: The main text retains the source-driven theological term, while footnote b gives the familiar alternative.
