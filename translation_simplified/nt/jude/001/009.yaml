translation:
  language: en
  text: But when Michael the archangel was in a dispute with the devil, arguing over Moses’ body, Michael did not dare to pass a slanderous judgment on the devil.[a] Instead, he said, “May the Lord rebuke you.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, more traditionally, “did not dare to pronounce a reviling accusation against him.”
    reason: lexical_alternative
  - marker: b
    text: These words echo Zechariah 3:2, where the Lord rebukes Satan.
    reason: cross_reference
