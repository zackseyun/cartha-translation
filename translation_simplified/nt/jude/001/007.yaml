- pob_phrase: just as Sodom and Gomorrah and the cities around them
  simplified_phrase: The same is true of Sodom and Gomorrah and the cities around them.
  preserved_meaning: The cities are compared with the preceding examples without identifying one exact point of comparison.
  reasoning_layer_used: Theological decision on the debated referent of τούτοις.
  rationale: A separate sentence makes the comparison easy to follow while the note preserves its ambiguity.
- pob_phrase: having in like manner committed sexual immorality and gone after other flesh
  simplified_phrase: They committed sexual immorality and pursued other flesh.
  preserved_meaning: The cities practiced sexual immorality and went in pursuit of other flesh.
  reasoning_layer_used: Lexical decisions for ἐκπορνεύσασαι, ἀπελθοῦσαι ὀπίσω, and σαρκὸς ἑτέρας.
  rationale: Two direct verbs replace the heavy participial construction without narrowing “other flesh.”
- pob_phrase: are set forth as an example, undergoing the punishment of eternal fire
  simplified_phrase: They stand as a warning to others, suffering the punishment of eternal fire.
  preserved_meaning: Their punishment is publicly presented as an example, and the fire remains eternal.
  reasoning_layer_used: Lexical decisions for πρόκεινται, δεῖγμα, δίκην ὑπέχουσαι, and πυρὸς αἰωνίου.
  rationale: Common verbs replace formal wording while retaining the public warning and judicial punishment.
