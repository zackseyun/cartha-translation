translation:
  language: en
  text: The same is true of Sodom and Gomorrah and the cities around them.[a] They committed sexual immorality and pursued other flesh.[b] They stand as a warning to others, suffering the punishment of eternal fire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may compare these cities with the angels in the previous verse or more generally with the earlier examples of rebellion and judgment.
    reason: alternative_reading
  - marker: b
    text: Or “different flesh”; traditionally “strange flesh.” The exact nature of the transgression is not specified here.
    reason: lexical_alternative
