translation:
  language: en
  text: Woe to them! They have followed Cain’s path. For pay, they have rushed headlong into Balaam’s error.[a] They have perished in Korah’s rebellion.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek verb translated “rushed headlong” pictures people pouring themselves out in reckless self-abandonment.
    reason: source_note
simplification_decisions:
- pob_phrase: because they have walked in the way of Cain
  simplified_phrase: They have followed Cain’s path.
  preserved_meaning: Their conduct follows Cain’s evil course while retaining the path image.
  reasoning_layer_used: POB lexical decisions for ὁδός and ἐπορεύθησαν
  rationale: “Followed Cain’s path” makes the moral metaphor clear in ordinary English.
- pob_phrase: have poured themselves out for pay into Balaam’s error
  simplified_phrase: For pay, they have rushed headlong into Balaam’s error.
  preserved_meaning: They recklessly abandon themselves to Balaam’s corrupt course for compensation.
  reasoning_layer_used: POB lexical and theological decisions for the Balaam clause
  rationale: The authorized sense rendering avoids the misleading modern idiom “pour oneself into” while the note preserves the source image.
- pob_phrase: and have perished in Korah’s rebellion
  simplified_phrase: They have perished in Korah’s rebellion.
  preserved_meaning: Their participation in Korah-like rebellion ends in destruction.
  reasoning_layer_used: POB lexical decisions for ἀντιλογία and ἀπώλοντο
  rationale: A separate sentence makes the final judgment easy to follow without weakening it.
