translation:
  language: en
  text: Beloved, I was very eager to write to you about the salvation we share. But instead, I had to write to urge you to struggle earnestly for the faith—the Christian teaching handed down once for all to God’s holy people.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: although I was making every effort to write to you about our common salvation
  simplified_phrase: I was very eager to write to you about the salvation we share. But instead
  preserved_meaning: Jude’s strong eagerness to write on one subject contrasts with the necessity that redirected his letter.
  reasoning_layer_used: lexical decision and immediate context
  rationale: Two sentences clarify the contrast while “very eager” preserves its intensity.
- pob_phrase: I found it necessary to write, urging you to contend earnestly
  simplified_phrase: I had to write to urge you to struggle earnestly
  preserved_meaning: Jude needed to write, and his letter’s purpose was to press his readers to make an intense effort.
  reasoning_layer_used: lexical decisions for γράψαι, παρακαλῶν, and ἐπαγωνίζεσθαι
  rationale: The wording keeps writing and urging distinct while using familiar English.
- pob_phrase: once for all delivered to the saints
  simplified_phrase: handed down once for all to God’s holy people
  preserved_meaning: The faith was definitively transmitted to the community of believers.
  reasoning_layer_used: lexical and theological decisions
  rationale: This explains “delivered” and “saints” while preserving the finality of “once for all.”
interpretive_expansions:
- pob_phrase: the faith
  rendering: the faith—the Christian teaching
  claim: Here “the faith” means the body of Christian teaching, not merely personal trust.
  evidence:
  - Being “handed down once for all” points to teaching entrusted to a community.
  - The POB theological decision selects the objective content of the Christian faith.
  confidence: high
  alternatives_preserved:
