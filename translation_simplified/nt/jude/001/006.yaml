translation:
  language: en
  text: And the angels who did not keep to the place assigned to them[a], but abandoned the dwelling meant for them—he has kept them chained forever in deep gloom for judgment on the great day.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek can also mean “their own position” or “their own authority.”
