  preserved_meaning: They remain perpetually confined in profound darkness.
  reasoning_layer_used: POB lexical decisions on δεσμοῖς ἀϊδίοις and ζόφος
  rationale: The active wording is more natural while preserving both the chain image and the depth of the gloom.
