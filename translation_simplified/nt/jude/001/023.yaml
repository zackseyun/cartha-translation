translation:
  language: en
  text: Save others by snatching them from the fire.[a] Show mercy to others with fear,[b] while hating even the garment stained by the flesh.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The fire may picture coming judgment or severe spiritual danger.
    reason: alternative_reading
  - marker: b
    text: “With fear” may mean reverence before God or caution against being corrupted yourself.
    reason: lexical_alternative
  - marker: c
    text: Here “flesh” points to sinful human corruption; it may also be translated “sinful nature.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: save others by snatching them out of the fire
  simplified_phrase: Save others by snatching them from the fire.
  preserved_meaning: The command retains both salvation language and the urgent rescue image.
  reasoning_layer_used: Lexical decisions for σῴζετε and ἐκ πυρὸς ἁρπάζοντες
  rationale: A separate sentence makes the urgent command immediate without defining what the fire represents.
- pob_phrase: and have mercy on others with fear
  simplified_phrase: Show mercy to others with fear
  preserved_meaning: Mercy must be given in a manner marked by fear.
  reasoning_layer_used: Lexical decision for ἐν φόβῳ and applied revision
  rationale: “Show mercy” is natural English, while “with fear” keeps the documented ambiguity.
- pob_phrase: the tunic stained by the flesh
  simplified_phrase: the garment stained by the flesh
  preserved_meaning: The clothing image still portrays moral contamination associated with the flesh.
  reasoning_layer_used: Lexical and theological decisions for χιτῶνα, ἐσπιλωμένον, and σάρξ
  rationale: “Garment” removes an unfamiliar clothing term while retaining the stain and flesh imagery.
