  text: These people are hidden reefs at your shared meals of Christian love.[a] They feast with you without fear. They act like shepherds who care only for themselves.[b] They are clouds without water, carried along by winds. They are autumn trees with no fruit—twice dead and uprooted.
  philosophy: optimal-equivalence
  footnotes:
