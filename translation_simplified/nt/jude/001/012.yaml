    text: These shared meals were also called “love feasts.” “Hidden reefs” may instead mean “blemishes” or “stains.”
    reason: alternative_reading
  - marker: b
    text: This may also be translated “feeding themselves”; compare Ezekiel 34.
    reason: lexical_alternative
