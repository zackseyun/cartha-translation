  preserved_meaning: The service must not be merely for appearance under supervision.
  reasoning_layer_used: POB lexical decision and footnote a
  rationale: The rare metaphor is unpacked in the main text so its force is immediately clear.
- pob_phrase: as people-pleasers
  simplified_phrase: like those who seek human approval
  preserved_meaning: Such workers act to gain approval from other people.
  reasoning_layer_used: POB lexical decision for ἀνθρωπάρεσκοι
  rationale: The negative motive is stated directly instead of relying on a label.
- pob_phrase: doing the will of God from the soul
  simplified_phrase: doing what God wants with your whole being
  preserved_meaning: They are to carry out God's will with inward sincerity and full commitment.
  reasoning_layer_used: POB lexical decisions for θέλημα and ἐκ ψυχῆς
  rationale: Common wording clarifies both God's will and the intensity of service.
