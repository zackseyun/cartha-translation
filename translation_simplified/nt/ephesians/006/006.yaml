translation:
  language: en
  text: Do not serve only when people are watching, like those who seek human approval. Instead, serve as slaves of Messiah,[a] doing what God wants with your whole being.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Greek Christos, meaning “Messiah”; it is also commonly rendered “Christ.”
    reason: source_note
  - marker: b
    text: Literally “from the soul”; this means serving sincerely with your whole self.
    reason: lexical_alternative
