translation:
  language: en
  text: In every situation, take up faith as your shield. With this shield, you will be able to put out all the flaming arrows of the evil one.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also mean “evil” rather than “the evil one.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: In all circumstances, taking up the shield of faith
  simplified_phrase: In every situation, take up faith as your shield
  preserved_meaning: Believers are to rely on faith as their shield in every circumstance.
  reasoning_layer_used: Lexical decisions for ἐν πᾶσιν, ἀναλαβόντες, and τῆς πίστεως
  rationale: The direct command and recast metaphor make the armor instruction easier to follow.
- pob_phrase: with which
  simplified_phrase: With this shield
  preserved_meaning: The shield of faith is the means of defense.
  reasoning_layer_used: Lexical decision for ἐν ᾧ
  rationale: Naming the shield removes an unclear relative pronoun without changing its instrumental sense.
- pob_phrase: extinguish all the flaming arrows
  simplified_phrase: put out all the flaming arrows
  preserved_meaning: The shield stops every burning projectile aimed by the attacker.
  reasoning_layer_used: Lexical decisions for σβέσαι, πεπυρωμένα, and βέλη
  rationale: “Put out” is more common than “extinguish” while preserving the fire image.
translation_notes:
  risk_flags:
  - risk: “Faith as your shield” could sound less like the named “shield of faith.”
    mitigation: The wording keeps both faith and the shield metaphor while making their relationship explicit.
  - risk: The personal reading “the evil one” is contextually preferred but not certain.
    mitigation: The footnote preserves the possible abstract reading “evil.”
