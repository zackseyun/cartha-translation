translation:
  language: en
  text: Servants, obey your earthly masters with fear and trembling. Obey them sincerely, from your heart, as you would obey the Messiah.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: masters according to the flesh
  simplified_phrase: earthly masters
  preserved_meaning: These masters have authority only within the present human sphere.
  reasoning_layer_used: POB lexical decision for κατὰ σάρκα
  rationale: “Earthly” states the intended contrast without the opaque idiom “according to the flesh.”
- pob_phrase: in sincerity of your heart
  simplified_phrase: sincerely, from your heart
  preserved_meaning: Their obedience is to be genuine and wholehearted.
  reasoning_layer_used: POB lexical decision for ἐν ἁπλότητι τῆς καρδίας ὑμῶν
  rationale: The recast phrase makes the inward sincerity clear in ordinary English.
- pob_phrase: as to Messiah
  simplified_phrase: as you would obey the Messiah
  preserved_meaning: Their obedience is compared with obedience offered to the Messiah without identifying the masters with him.
  reasoning_layer_used: POB lexical and theological decisions for ὡς τῷ Χριστῷ
  rationale: Supplying the implied verb makes the comparison immediately understandable.
translation_notes:
