- pob_phrase: Stand, therefore, having fastened your waist with truth
  simplified_phrase: Therefore, stand with truth fastened around your waist like a belt
  preserved_meaning: They are to stand after securing truth around the waist as part of the armor image.
  reasoning_layer_used: Lexical decisions for στῆτε, περιζωσάμενοι, τὴν ὀσφὺν ὑμῶν, and ἐν ἀληθείᾳ
  rationale: The completed-action wording becomes a natural description of how they are equipped to stand.
- pob_phrase: having put on the breastplate of righteousness
  simplified_phrase: with righteousness worn as a breastplate
  preserved_meaning: Righteousness is pictured as protective chest armor already put on.
  reasoning_layer_used: Lexical and theological decisions for θώρακα and δικαιοσύνης
  rationale: The recast clause avoids a second stilted participle while retaining the armor and righteousness.
