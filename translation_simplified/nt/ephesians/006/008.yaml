translation:
  language: en
  text: You know that the Lord will repay each person for whatever good they do, whether they are a slave or free.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: knowing that
  simplified_phrase: You know that
  preserved_meaning: The readers' knowledge remains the basis of the surrounding exhortation.
  reasoning_layer_used: Lexical decision for εἰδότες and its adverbial function
  rationale: A direct clause is clearer in English than an opening participle.
- pob_phrase: each one, whatever good he does, this he will receive back from the Lord
  simplified_phrase: the Lord will repay each person for whatever good they do
  preserved_meaning: Each individual will receive from the Lord what corresponds to the good they have done.
  reasoning_layer_used: Lexical decisions for ἕκαστος, τοῦτο, κομίσεται, and παρὰ κυρίου
  rationale: The active wording removes the difficult clause order while keeping individual and reciprocal force.
- pob_phrase: whether slave or free
  simplified_phrase: whether they are a slave or free
  preserved_meaning: The promise applies regardless of bonded or free social status.
  reasoning_layer_used: Lexical and theological decisions for δοῦλος and ἐλεύθερος
  rationale: Adding a subject and verb makes the contrast immediately clear without softening “slave.”
translation_notes:
  risk_flags:
  - risk: “Repay” may sound narrowly commercial.
    mitigation: The POB lists this lexical alternative, and the context limits it to the Lord's corresponding return for good done.
