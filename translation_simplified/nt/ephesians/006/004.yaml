translation:
  language: en
  text: Fathers, do not stir up anger in your children. Instead, raise them with the discipline and instruction of the Lord.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Of the Lord” may mean that the discipline and instruction come from the Lord, belong to him, or are directed by him.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: do not provoke your children to anger
  simplified_phrase: do not stir up anger in your children
  preserved_meaning: Fathers must not cause anger or resentment in their children.
  reasoning_layer_used: Lexical decision for παροργίζετε
  rationale: The rewrite keeps the verb’s causative force in more immediate English.
- pob_phrase: bring them up
  simplified_phrase: raise them
  preserved_meaning: Fathers are to guide their children throughout their upbringing.
  reasoning_layer_used: Lexical decision for ἐκτρέφετε
  rationale: “Raise them” is the common modern expression for bringing up children.
- pob_phrase: the discipline and instruction of the Lord
  simplified_phrase: the discipline and instruction of the Lord
  preserved_meaning: Child-rearing includes both formative correction and verbal guidance connected with the Lord.
  reasoning_layer_used: Lexical and theological decisions for παιδείᾳ, νουθεσίᾳ, and κυρίου
  rationale: These terms remain because they preserve two distinct practices and the broad force of “of the Lord.”
translation_notes:
  risk_flags:
  - risk: “Of the Lord” may be unclear or seem to express only possession.
    mitigation: The footnote preserves the source, possession, character, and orientation possibilities.
  - risk: “Stir up anger” could be read as forbidding every occasion of a child’s anger.
    mitigation: The causative wording remains tied to provoking anger or resentment rather than to all parental correction.
