translation:
  language: en
  text: All of us once lived among them, following the desires of our flesh[a]. We did what our flesh and our minds wanted. By nature, we were children of wrath[b], just like the rest.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “flesh” refers to the human self as a source of sinful desires; it can also be translated “sinful nature.”
    reason: lexical_alternative
  - marker: b
    text: “Children of wrath” is an idiom that may describe people marked by wrath or under it; the Greek leaves the precise emphasis open.
    reason: simplification_note
simplification_decisions:
- pob_phrase: among whom we all also once lived in the desires of our flesh
  simplified_phrase: All of us once lived among them, following the desires of our flesh
  preserved_meaning: Everyone in Paul’s group formerly lived among the disobedient and followed fleshly desires.
  reasoning_layer_used: POB lexical decisions for ἐν οἷς, ἀνεστράφημέν, and σάρξ
  rationale: The clause is reordered into natural English while retaining the personal reference and Paul’s term “flesh.”
- pob_phrase: fulfilling the desires of the flesh and of the mind
  simplified_phrase: We did what our flesh and our minds wanted
  preserved_meaning: Their actions carried out the aims arising from both flesh and mind.
  reasoning_layer_used: POB applied revision for ποιοῦντες and θελήματα
  rationale: A direct sentence removes stiff repetition without merging the two sources of desire.
- pob_phrase: and we were by nature children of wrath, just as the rest were
  simplified_phrase: By nature, we were children of wrath, just like the rest
  preserved_meaning: Their natural condition was shared with the rest of humanity and described by the same unresolved idiom.
  reasoning_layer_used: POB theological decision for τέκνα φύσει ὀργῆς
  rationale: The shorter wording preserves both “by nature” and theologically significant “children of wrath.”
