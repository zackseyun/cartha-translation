  preserved_meaning: Keeps the completed-and-continuing salvation sense while using more natural English word order.
  reasoning_layer_used: POB lexical decisions
  rationale: The passive construction and the grace/faith relationship are preserved.
- pob_phrase: and this is not from yourselves; it is the gift of God
  simplified_phrase: This did not come from yourselves; it is God’s gift
  preserved_meaning: Clarifies source/origin language and preserves the gift emphasis.
  reasoning_layer_used: POB theological decision on τοῦτο
  rationale: Splitting the sentence improves readability and lets footnote [b] carry the important grammatical nuance.
retained_terms:
