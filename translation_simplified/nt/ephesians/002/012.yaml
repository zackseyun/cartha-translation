translation:
  language: en
  text: At that time, you were without the Messiah[a]. You were excluded from citizenship in Israel and were strangers to the covenants of the promise[b]. You had no hope and were without God[c] in the world.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “without Christ.” The Greek title can be rendered either way; here “Messiah” preserves the title’s meaning in its Jewish-covenantal context.
    reason: alternative_reading
  - marker: b
    text: Or “the covenants of promise.”
    reason: lexical_alternative
  - marker: c
    text: Or “godless.” The phrase may denote being without the true God rather than modern philosophical atheism.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: that at that time you were without Messiah ...
  simplified_phrase: At that time, you were without the Messiah.
  preserved_meaning: The readers’ former separation from Israel’s promised anointed deliverer remains explicit.
  reasoning_layer_used: POB theological decision on Χριστός and source syntax
  rationale: A complete opening sentence removes dependence on the previous verse while retaining the past setting.
- pob_phrase: alienated from the commonwealth of Israel
  simplified_phrase: excluded from citizenship in Israel
  preserved_meaning: The wording retains both exclusion and the civic identity associated with Israel.
  reasoning_layer_used: POB lexical decision for ἀπηλλοτριωμένοι and πολιτείας
  rationale: The source-supported term “citizenship” is clearer than “commonwealth” without reducing Israel to a general community.
- pob_phrase: having no hope and without God in the world
  simplified_phrase: You had no hope and were without God in the world.
  preserved_meaning: Their former lack of hope and relationship with God remains distinct and complete.
  reasoning_layer_used: POB lexical decisions for ἐλπίδα μὴ ἔχοντες and ἄθεοι
  rationale: Recasting the participle as a short sentence makes both conditions immediately clear.
translation_notes:
  risk_flags:
  - risk: “Citizenship” can sound like individual legal status rather than Israel’s corporate civic order.
    mitigation: The phrases “excluded from” and “strangers to” preserve the broader social and covenantal exclusion.
  - risk: “Without God” might be mistaken for philosophical atheism.
    mitigation: Footnote [c] preserves the contextual sense as qualified rather than certain.
