translation_notes:
  source_alignment_notes:
  - Preserved the inferential conjunction 'So then' (ἄρα οὖν) to maintain the logical flow from the preceding argument.
  - Kept the dual imagery of civic belonging ('fellow citizens') and domestic belonging ('household') which is central to Pauline theology here.
  readability_notes:
  - Breaking the verse after the negative statement and starting the positive statement with 'Instead...' creates a clear, modern contrast that is easy to follow.
  compression_notes:
  - Minimized the technical distinction between 'strangers' (temporary visitors) and 'resident foreigners' (settled non-citizens) into the simpler 'strangers and foreigners' to maintain poetic flow without losing the general concept of exclusion.
