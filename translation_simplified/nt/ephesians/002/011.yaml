translation:
  language: en
  text: Therefore, remember that formerly you, the Gentiles in the flesh, were called "uncircumcision" by what is called "circumcision"[a] (which is made by hands in the flesh).
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Circumcision” and “uncircumcision” were covenantal and ethnic labels used during this period, representing physical and external identity rather than a spiritual state.
    reason: simplification_note
simplification_decisions:
- preserved_meaning: POB uses multiple nested modifiers ('who are called... by what is called... made by hands...'). We resolved this into a cleaner narrative flow by converting the first into a direct verb phrase ('were called') and enclosing the final physical description in parenthetical explanation, reducing the syntactic complexity.
  reasoning_layer_used: POB audit trail
  rationale: POB uses multiple nested modifiers ('who are called... by what is called... made by hands...'). We resolved this into a cleaner narrative flow by converting the first into a direct verb phrase ('were called') and enclosing the final physical description in parenthetical explanation, reducing the syntactic complexity.
