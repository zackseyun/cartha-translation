translation:
  language: en
  text: He made known to us the mystery of his will—a mystery once hidden but now revealed. He did this in keeping with what pleased him, a purpose he had planned in him[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek says “in him.” It may refer to God himself or to Christ.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: having made known to us
  simplified_phrase: He made known to us
  preserved_meaning: God caused the mystery to become known to his people.
  reasoning_layer_used: POB lexical decision for γνωρίσας and immediate context
  rationale: A finite clause avoids an awkward participle while the context supplies God as the subject.
- pob_phrase: according to his good pleasure
  simplified_phrase: in keeping with what pleased him
  preserved_meaning: God acted according to his own gracious and willing choice.
  reasoning_layer_used: POB lexical decision for εὐδοκία
  rationale: The wording expresses the personal-volitional sense of “good pleasure” in common English.
- pob_phrase: which he purposed in him
  simplified_phrase: a purpose he had planned in him
  preserved_meaning: What pleased God was connected with a purpose he had deliberately formed, while the referent of “him” remains unresolved.
  reasoning_layer_used: POB lexical and theological decisions for προέθετο and ἐν αὐτῷ
  rationale: “Planned” clarifies “purposed,” and “in him” preserves the documented ambiguity.
interpretive_expansions:
- pob_phrase: the mystery of his will
  rendering: the mystery of his will—a mystery once hidden but now revealed
  claim: Here “mystery” means something formerly hidden that God has now disclosed.
  evidence:
  - The POB lexical rationale defines Pauline μυστήριον as a divine purpose once concealed and now disclosed.
  - The clause “made known to us” explicitly presents the mystery as revealed.
  confidence: high
  alternatives_preserved:
  - mystery
  - secret
translation_notes:
  risk_flags:
  - risk: Readers may assume that “in him” has an obvious referent.
    mitigation: The footnote gives both referents recognized in the POB audit without choosing between them.
