translation:
  language: en
  text: And he put all things under his feet[a], and gave him to the church[b] as head over all things,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The wording echoes Psalm 8:6, an Old Testament picture of all things being placed under a ruler's feet.
    reason: simplification_note
  - marker: b
    text: Or 'for the benefit of the church'; the original language can express either recipient or benefit.
    reason: simplification_note
simplification_decisions:
- preserved_meaning: Changing 'subjected' to 'put' removes a highly formal, academic term while fully preserving the physical metaphor of subjugation under the feet inherited from Psalm 8:6.
  reasoning_layer_used: POB audit trail
  rationale: Changing 'subjected' to 'put' removes a highly formal, academic term while fully preserving the physical metaphor of subjugation under the feet inherited from Psalm 8:6.
- preserved_meaning: Adjusted the English word order to bring the dative recipient ('to the church') closer to the governing verb ('gave'), avoiding a trailing modifier that is difficult to process in modern English.
  reasoning_layer_used: POB audit trail
  rationale: Adjusted the English word order to bring the dative recipient ('to the church') closer to the governing verb ('gave'), avoiding a trailing modifier that is difficult to process in modern English.
