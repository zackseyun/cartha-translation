translation:
  language: en
  text: I pray that the eyes of your heart may be filled with light, so that you may know the hope of his calling, and the rich glory[a] of his inheritance among his holy people[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'wealth of the glory' or 'riches of the glory.'
    reason: simplification_note
  - marker: b
    text: Or 'his inheritance in his holy people' or 'among the saints.'
    reason: simplification_note
simplification_decisions:
- simplified_phrase: I pray that the eyes of your heart may be filled with light
  preserved_meaning: The Greek perfect passive participle is part of a long prayer context spanning verses 15-23. Converting it to a finite clause starting with 'I pray that...' resolves the awkward dangling participle in English. 'Filled with light' is a modern, natural equivalent for 'enlightened' that preserves the passive sense of receiving divine illumination.
  reasoning_layer_used: POB audit trail
  rationale: The Greek perfect passive participle is part of a long prayer context spanning verses 15-23. Converting it to a finite clause starting with 'I pray that...' resolves the awkward dangling participle in English. 'Filled with light' is a modern, natural equivalent for 'enlightened' that preserves the passive sense of receiving divine illumination.
- simplified_phrase: the eyes of your heart
  preserved_meaning: Retained the metaphor exactly as required by POB's lexical decisions to preserve Paul's deep theological and rhetorical imagery, avoiding flattening it to 'mind' or 'understanding'.
  reasoning_layer_used: POB audit trail
  rationale: Retained the metaphor exactly as required by POB's lexical decisions to preserve Paul's deep theological and rhetorical imagery, avoiding flattening it to 'mind' or 'understanding'.
- simplified_phrase: the rich glory of his inheritance
  preserved_meaning: Simplified the heavy noun chain ('wealth of the glory') into 'rich glory' to make it read more naturally in modern English while fully retaining the dual concepts of abundance and divine splendor. The literal alternative is preserved in footnote [a].
  reasoning_layer_used: POB audit trail
  rationale: Simplified the heavy noun chain ('wealth of the glory') into 'rich glory' to make it read more naturally in modern English while fully retaining the dual concepts of abundance and divine splendor. The literal alternative is preserved in footnote [a].
- simplified_phrase: among his holy people
  preserved_meaning: Modern readers often misunderstand 'saints' as exclusively canonized historical figures. 'His holy people' accurately communicates the covenantal, set-apart identity of NT believers. The alternate readings ('in his holy people' and 'saints') are preserved in footnote [b].
