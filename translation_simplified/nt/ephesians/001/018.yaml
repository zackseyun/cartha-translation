translation_notes:
  source_alignment_notes: The text maintains the semantic boundaries of Ephesians 1:18. The purpose construction 'εἰς τὸ εἰδέναι ὑμᾶς' is represented by 'so that you may know'. The core Greek concepts of 'ἐλπὶς' (hope), 'κλήσεως' (calling), 'κληρονομίας' (inheritance), and 'ἐν τοῖς ἁγίοις' (among the saints/holy people) are all fully preserved in equivalent, natural English formulations.
  readability_notes:
  - Replacing the archaic and passive-dangling structure with 'I pray that... may be filled with light' greatly improves syntactic flow. Breaking down the double-genitive 'wealth of the glory' into 'rich glory' increases reading speed and comprehension for a general modern audience without diluting the verse's gravity.
  compression_notes:
  - No essential theological details or source nuances were lost. The compression of 'wealth of the glory' to 'rich glory' preserves both lexical roots, and the transition of 'saints' to 'holy people' clarifies the social referent of the Greek 'hagioi' for modern readers.
  risk_flags:
  - risk: The phrase 'I pray that...' is a contextual addition to frame the Greek participle, which is technically dependent on the main verb in verse 17. This is a common and low-risk translational choice in modern versions to ensure the verse can be read and understood as an independent unit.
    mitigation: Flag retained for reviewer attention.
