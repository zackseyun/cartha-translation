translation:
  language: en
  text: I pray that the eyes of your heart may be enlightened, so that you may know the hope of his calling and the glorious riches[a] of his inheritance among his holy people[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “the wealth of the glory”; or “the riches of the glory.”
    reason: lexical_alternative
  - marker: b
    text: Or “his inheritance in his holy people” or “among the saints.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: having the eyes of your heart enlightened
  simplified_phrase: I pray that the eyes of your heart may be enlightened
  preserved_meaning: The heart’s eyes receive illumination within Paul’s continuing prayer.
  reasoning_layer_used: Immediate context and POB lexical decision
  rationale: A finite prayer clause makes the dependent participle readable while retaining the passive illumination image.
- pob_phrase: the wealth of the glory of his inheritance
  simplified_phrase: the glorious riches of his inheritance
  preserved_meaning: God’s inheritance is associated with an abundance characterized by glory.
  reasoning_layer_used: POB lexical decision and grounding review
  rationale: “Glorious riches” preserves wealth as the main idea and glory as its defining quality.
- pob_phrase: among the saints
  simplified_phrase: among his holy people
  preserved_meaning: The inheritance is among God’s set-apart people without resolving whether the Greek may also mean “in” them.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: “Holy people” prevents the common misunderstanding that “saints” means only specially recognized historical figures.
interpretive_expansions:
- pob_phrase: having the eyes of your heart enlightened
  rendering: I pray that the eyes of your heart may be enlightened
  claim: Paul presents this enlightenment as part of his prayer for the believers.
  evidence:
  - The clause depends on Paul’s prayer in the immediate context of Ephesians 1:17–18.
  confidence: high
  alternatives_preserved:
  - May the eyes of your heart be enlightened
translation_notes:
  risk_flags:
  - risk: The finite wording does not fully display the Greek participle’s completed-result nuance.
    mitigation: The passive “be enlightened” retains received illumination, while the prayer context requires natural English framing.
  - risk: “His inheritance” can mean what belongs to God or what he gives his people.
    mitigation: The main text leaves the possessive open, and footnote b preserves the significant in/among ambiguity.
