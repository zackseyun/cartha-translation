translation:
  language: en
  text: In him, we also were made God's inheritance[a]. We were predestined according to God's purpose. He accomplishes everything according to the deliberate decision of his will.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “we also obtained an inheritance.” The Greek verb can mean either that we receive an inheritance from God or that we become God's own possession.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: having been predestined according to the purpose of the one
  simplified_phrase: We were predestined according to God's purpose.
  preserved_meaning: God's purpose governs the prior determination without specifying its precise goal.
  reasoning_layer_used: POB lexical decision for προορισθέντες and κατὰ πρόθεσιν
  rationale: A separate sentence removes the difficult participial chain without adding “for this.”
- pob_phrase: the one who works all things
  simplified_phrase: He accomplishes everything
  preserved_meaning: God actively effects all things without narrowing the statement's scope.
  reasoning_layer_used: POB lexical decisions for ἐνεργέω and τὰ πάντα
  rationale: “Accomplishes everything” is natural English and avoids the added nuance of “works out.”
- pob_phrase: according to the counsel of his will
  simplified_phrase: according to the deliberate decision of his will
  preserved_meaning: God's action accords with the considered resolve belonging to his will.
  reasoning_layer_used: POB lexical decisions for βουλή and θέλημα
  rationale: “Deliberate decision” makes the deliberative force of “counsel” understandable.
interpretive_expansions:
- pob_phrase: were made an inheritance
  rendering: were made God's inheritance
  claim: The inheritance belongs to God, so believers are described as his own allotted people.
  evidence:
  - The POB theological decision selects the sense that believers become God's inheritance or allotted people.
  - The POB rationale cites the Old Testament background of God's people as his inheritance.
  confidence: moderate
  alternatives_preserved:
  - Believers obtained an inheritance.
translation_notes:
  risk_flags:
  - risk: The Greek verb may describe believers receiving an inheritance rather than becoming God's inheritance.
    mitigation: The footnote preserves this genuine alternative reading.
