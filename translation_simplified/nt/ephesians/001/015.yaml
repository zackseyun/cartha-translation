simplification_decisions:
- pob_phrase: I also, having heard of
  simplified_phrase: I too, after hearing about
  preserved_meaning: Paul adds his own response and refers to hearing as prior to it.
  reasoning_layer_used: POB lexical decisions for κἀγώ and ἀκούσας
  rationale: “After hearing” makes the temporal participle clear without making it causal.
- pob_phrase: all the saints
  simplified_phrase: all God’s holy people
  preserved_meaning: The phrase refers to the whole community of believers as people set apart for God.
  reasoning_layer_used: POB lexical alternative and reviewer grounding evidence
  rationale: This avoids suggesting only officially recognized or exceptionally holy individuals.
