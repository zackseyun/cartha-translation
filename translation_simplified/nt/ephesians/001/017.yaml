  rationale: Rendered the prepositional phrase 'in the knowledge of him' as 'so that you may know him more fully' to naturally unpack the Greek preposition 'en' (which has a purpose/result color here) and the compound noun 'epignosis' (intensive, relational, or full knowledge).
