  text: And what is the extraordinary greatness of his power toward us who believe[a]. This power is in keeping with the working of his might and strength.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'in us who believe.' The Greek literally says 'toward us,' but some translations interpret this as God's power working within believers.
