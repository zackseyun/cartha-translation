simplification_decisions:
- pob_phrase: you may be strong enough to comprehend
  simplified_phrase: you may have enough strength ... to grasp
  preserved_meaning: They need sufficient strength to understand the spiritual reality in view.
  reasoning_layer_used: Lexical decisions for ἐξισχύσητε and καταλαβέσθαι
  rationale: Common wording preserves both sufficient strength and mental understanding.
- pob_phrase: together with all the saints
  simplified_phrase: together with all God’s holy people
  preserved_meaning: This understanding is shared with the whole community of believers.
  reasoning_layer_used: Lexical decision for σὺν πᾶσιν τοῖς ἁγίοις
  rationale: “God’s holy people” makes Paul’s meaning of “saints” clear to new readers.
- pob_phrase: what is the width and length and height and depth
  simplified_phrase: what the width, length, height, and depth are
  preserved_meaning: The interrogative force and all four dimensions remain without naming their referent.
  reasoning_layer_used: Lexical decision for τί and theological decision on the dimensions’ referent
  rationale: Natural English retains “what” and preserves the source text’s open construction.
translation_notes:
  risk_flags:
  - risk: Replacing “saints” may reduce continuity with established Pauline terminology.
    mitigation: “God’s holy people” preserves both holiness and the communal sense.
  - risk: Readers may not know what the four dimensions describe.
    mitigation: The footnote explains the ambiguity without deciding the referent.
