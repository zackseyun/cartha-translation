translation:
  language: en
  text: 'I, the very least of all God’s holy people, received this grace: to proclaim to the Gentiles[a] the Messiah’s[b] riches, which can never be fully explored.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
