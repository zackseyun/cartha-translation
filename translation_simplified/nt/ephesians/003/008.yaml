  rationale: This wording explains a biblical term that many modern readers may misunderstand.
- pob_phrase: this grace was given
  simplified_phrase: received this grace
  preserved_meaning: Paul’s commission was a gracious gift bestowed on him.
  reasoning_layer_used: POB lexical decision for χάρις
  rationale: The active wording is easier to follow while retaining the key theological term “grace.”
- pob_phrase: the unsearchable riches of Messiah
