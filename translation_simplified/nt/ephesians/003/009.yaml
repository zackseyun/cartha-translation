translation:
  language: en
  text: and to bring to light for everyone how the mystery is being carried out—a mystery that had remained hidden through the ages in God, who created all things.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “How the mystery is being carried out” may also be translated “the administration,” “the stewardship,” or “the plan of the mystery.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: what is the administration of the mystery
  simplified_phrase: how the mystery is being carried out
  preserved_meaning: God's mystery has an active arrangement or outworking, not merely hidden content.
  reasoning_layer_used: POB lexical and theological decisions on οἰκονομία
  rationale: The verbal wording makes the managerial sense clear without importing a later technical framework.
- pob_phrase: the mystery hidden from the ages in God
  simplified_phrase: a mystery that had remained hidden through the ages in God
  preserved_meaning: The mystery was concealed in God across the ages.
  reasoning_layer_used: POB lexical and theological decisions on ἀποκεκρυμμένου and ἀπὸ τῶν αἰώνων
  rationale: This wording states long-standing concealment naturally without changing it to the stronger claim “from eternity.”
interpretive_expansions:
