translation:
  language: en
  text: To the one who can do far more than anything we ask for or think of, in keeping with the power at work in us,
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the one who is able to do
  simplified_phrase: the one who can do
  preserved_meaning: The recipient of the doxology has the ability to act.
  reasoning_layer_used: Lexical decision for Τῷ ... δυναμένῳ and theological decision on the implied recipient
  rationale: The shorter wording is natural English while leaving the recipient unnamed as in POB.
- pob_phrase: far beyond all that we ask or think
  simplified_phrase: far more than anything we ask for or think of
  preserved_meaning: His ability surpasses every request and every thought we can form.
  reasoning_layer_used: Lexical decisions for ὑπὲρ πάντα, ὑπερεκπερισσοῦ, and ὧν αἰτούμεθα ἢ νοοῦμεν
  rationale: Common English idioms preserve both the intensive comparison and the two distinct mental acts.
- pob_phrase: according to the power at work in us
  simplified_phrase: in keeping with the power at work in us
  preserved_meaning: The power active within believers is the measure corresponding to what he does.
  reasoning_layer_used: Lexical and theological decisions for κατὰ τὴν δύναμιν τὴν ἐνεργουμένην ἐν ἡμῖν
  rationale: This avoids a stiff phrase without reducing the power to a mere instrument.
translation_notes:
