simplification_decisions:
- pob_phrase: Therefore I ask you
  simplified_phrase: So I ask you
  preserved_meaning: Paul draws an appeal from his preceding argument.
  reasoning_layer_used: Lexical decision for διὸ and αἰτοῦμαι.
  rationale: “So” states the logical connection in more common English.
- pob_phrase: not to lose heart because of my afflictions for your sake
  simplified_phrase: not to be discouraged because of my suffering for your sake
  preserved_meaning: They should not lose courage over Paul’s serious suffering endured on their behalf.
  reasoning_layer_used: Lexical decisions for μὴ ἐγκακεῖν, θλίψεσίν, and ὑπὲρ ὑμῶν.
  rationale: “Be discouraged” and “suffering” are immediately clear while preserving the hardship and its purpose.
- pob_phrase: which are your glory
  simplified_phrase: This suffering is your glory
  preserved_meaning: Paul’s afflictions, understood as one whole experience, constitute their glory.
  reasoning_layer_used: Theological decision on the referent of ἥτις and lexical decision for δόξα.
  rationale: A new sentence identifies the referent clearly without weakening “glory” to mere praise.
translation_notes:
  risk_flags:
  - risk: “Your glory” may remain unclear to readers unfamiliar with biblical language.
    mitigation: The footnote explains that Paul’s suffering gives them honor in God’s saving purpose.
