translation:
  language: en
  text: Do not grieve God’s Holy Spirit. In him, you were marked with a seal for the coming day when God will set you free.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “until the day when God will set you free.” The Greek says “for” but can point forward to that future day.
    reason: lexical_alternative
