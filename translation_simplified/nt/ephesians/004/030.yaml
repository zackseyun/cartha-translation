  preserved_meaning: The Holy Spirit remains personal, and the sealing image is retained.
  reasoning_layer_used: POB lexical and theological decisions for ἐν ᾧ and ἐσφραγίσθητε
  rationale: A new sentence and an explicit seal image make the metaphor easier to follow.
- pob_phrase: for the day of redemption
  simplified_phrase: for the coming day when God will set you free
  preserved_meaning: The seal is directed toward the future completion of God’s redeeming work.
  reasoning_layer_used: POB lexical and theological decisions for εἰς ἡμέραν ἀπολυτρώσεως
  rationale: The clause explains redemption in common language without changing “for” to “until.”
