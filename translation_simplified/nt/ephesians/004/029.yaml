translation:
  language: en
  text: Do not let any rotten talk come out of your mouth.[a] Instead, say only what is good for building people up in ways that meet their needs, so that your words may give grace to those who hear.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek literally says “rotten word” and refers to corrupt or harmful speech.
    reason: lexical_alternative
  - marker: b
    text: Here “give grace” may also be understood as “give benefit.”
    reason: lexical_alternative
