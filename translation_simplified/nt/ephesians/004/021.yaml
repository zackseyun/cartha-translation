  text: If indeed you heard him[a] and were taught in him[b], just as truth is found in Jesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “heard about him.” The Greek more directly says “heard him,” perhaps because hearing Christ proclaimed was like hearing Christ himself.
