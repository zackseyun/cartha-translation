  preserved_meaning: Truthful speech is joined with love and contrasted with the deception described earlier.
  reasoning_layer_used: POB lexical and theological decisions on ἀληθεύοντες and δὲ
  rationale: The participle becomes a natural English clause without excluding its broader ethical sense.
- pob_phrase: let us grow in every way into him
