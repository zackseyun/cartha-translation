  preserved_meaning: The Messiah remains identified as the head in Paul's body metaphor.
  reasoning_layer_used: POB lexical and theological decisions on κεφαλή and Χριστός
  rationale: A separate sentence makes the identification clear without defining the debated force of “head.”
