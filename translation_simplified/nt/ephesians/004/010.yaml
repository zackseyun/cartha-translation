translation:
  language: en
  text: The very one who came down is also the one who went up far above all the heavens,[a] so that he might fill all things.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “All the heavens” may emphasize his exaltation above every heavenly realm.
    reason: simplification_note
  - marker: b
    text: Or “fulfill all things,” though “fill” better fits the immediate context.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: The one who descended is himself also the one who ascended
  simplified_phrase: The very one who came down is also the one who went up
  preserved_meaning: The same person both descended and ascended, with his identity strongly emphasized.
  reasoning_layer_used: Lexical decisions for ὁ καταβὰς, αὐτός, and ὁ ἀναβὰς; theological decision on the referent
  rationale: Common motion verbs and “the very one” make the contrast and emphatic identity immediately clear.
- pob_phrase: far above all the heavens
  simplified_phrase: far above all the heavens
  preserved_meaning: His ascent places him beyond and above every heavenly realm.
  reasoning_layer_used: Lexical decisions for ὑπεράνω and πάντων τῶν οὐρανῶν
  rationale: The wording is retained because it is readable and preserves the plural cosmic image.
- pob_phrase: so that he might fill all things
  simplified_phrase: so that he might fill all things
  preserved_meaning: His ascent has the purpose of filling all things in the broad sense left open by the text.
  reasoning_layer_used: Lexical decisions for ἵνα, πληρώσῃ, and τὰ πάντα; theological decision on scope
  rationale: The clause remains clear and keeps both the purpose and comprehensive scope without narrowing them.
