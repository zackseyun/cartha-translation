translation:
  language: en
  text: until all of us reach unity in the faith[a] and in knowing the Son of God. Together we will become a mature man[b], reaching the measure of the Messiah’s stature in all its fullness.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “in faith”; this may refer either to the Christian faith believers share or to their trust in God.
    reason: alternative_reading
  - marker: b
    text: The Greek pictures the whole church together as one mature man; it may also be translated “reach mature manhood.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: attain to the unity of the faith and of the knowledge
  simplified_phrase: reach unity in the faith and in knowing
  preserved_meaning: The whole community is moving toward shared faith and knowledge of God’s Son.
  reasoning_layer_used: Lexical decisions and theological decision on τῆς πίστεως
  rationale: Common wording clarifies the goal without resolving the documented ambiguity in “faith.”
- pob_phrase: to a mature man
  simplified_phrase: Together we will become a mature man
  preserved_meaning: The singular masculine image describes the corporate maturity of the whole church.
  reasoning_layer_used: Lexical and theological decisions on εἰς ἄνδρα τέλειον
  rationale: A new sentence and “together” explain the corporate image while retaining it.
- pob_phrase: to the measure of the stature of the fullness of Messiah
  simplified_phrase: reaching the measure of the Messiah’s stature in all its fullness
  preserved_meaning: The church grows toward a maturity measured by the Messiah’s complete stature.
  reasoning_layer_used: Lexical decisions on μέτρον, ἡλικίας, πληρώματος, and Χριστοῦ
  rationale: The wording preserves measure, stature, and fullness while making their relationship readable.
