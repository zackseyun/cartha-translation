simplification_decisions:
- pob_phrase: making every effort to keep
  simplified_phrase: Make every effort to preserve
  preserved_meaning: Believers must diligently maintain an existing unity rather than create it.
  reasoning_layer_used: Lexical decisions for σπουδάζοντες and τηρεῖν, with the implied imperative flow from verses 1–2.
  rationale: The direct command is easier to follow while preserving earnest effort and ongoing maintenance.
- pob_phrase: in the bond of peace
  simplified_phrase: with peace binding you together
  preserved_meaning: Peace is pictured as the tie that holds believers together.
  reasoning_layer_used: Lexical decision for σύνδεσμος and rationale for τῆς εἰρήνης.
  rationale: The wording explains the bond image without removing it.
interpretive_expansions:
- pob_phrase: the unity of the Spirit
  rendering: the unity the Spirit has given you
  claim: The Holy Spirit is the source of an already existing unity that believers must preserve.
  evidence:
  - The POB theological decision identifies the Spirit as the Holy Spirit.
  - The verb τηρεῖν means maintaining something already given rather than creating it.
  - Nearby Ephesians 4:4 and 4:30 use “Spirit” for the Holy Spirit.
  confidence: high
  alternatives_preserved:
  - A shared spirit among believers
