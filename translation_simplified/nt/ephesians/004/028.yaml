translation:
  language: en
  text: Anyone who steals must stop stealing. Instead, they must work hard, doing good work with their own hands, so that they will have something to share with people in need.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: The one who steals must steal no longer
  simplified_phrase: Anyone who steals must stop stealing
  preserved_meaning: A person who has been stealing is commanded to end that practice.
  reasoning_layer_used: Lexical decisions for ὁ κλέπτων, μηκέτι, and κλεπτέτω
  rationale: “Must stop stealing” states the command in direct, natural English.
- pob_phrase: but rather must labor
  simplified_phrase: Instead, they must work hard
  preserved_meaning: Strenuous, honest work is the commanded alternative to theft.
  reasoning_layer_used: Lexical decisions for μᾶλλον δὲ and κοπιάτω
  rationale: “Instead” marks the correction, and “work hard” preserves the effort implied by labor.
- pob_phrase: so that he may have something to share with the one who has need
  simplified_phrase: so that they will have something to share with people in need
  preserved_meaning: The purpose of work is to gain resources that can be shared with needy people.
  reasoning_layer_used: Lexical decisions for ἵνα ἔχῃ, μεταδιδόναι, and τῷ χρείαν ἔχοντι; theological decision on the ethical purpose of labor
  rationale: “People in need” naturally expresses the generic recipient without implying giving to every needy individual.
