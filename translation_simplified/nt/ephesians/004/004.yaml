simplification_decisions:
- pob_phrase: just as you also were called in one hope of your calling
  simplified_phrase: In the same way, you were called in one shared hope—the hope that belongs to your calling
  preserved_meaning: The readers were called in a single hope connected with their calling.
  reasoning_layer_used: Lexical decisions for καθὼς καὶ, ἐκλήθητε, ἐν, and τῆς κλήσεως ὑμῶν
  rationale: The clause is recast in natural English while retaining “in” and the explicit link between hope and calling.
- pob_phrase: one body
  simplified_phrase: one body
  preserved_meaning: Believers form one corporate body.
  reasoning_layer_used: Lexical decision for σῶμα
  rationale: The source metaphor is retained because it carries the passage’s unity theme.
- pob_phrase: one Spirit
  simplified_phrase: one Spirit
