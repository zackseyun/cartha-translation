translation:
  language: en
  text: Everything brought into view is light.[a] That is why it says, “Wake up, you who are sleeping! Rise from the dead, and the Messiah[b] will shine on you.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Everything exposed is light.”
    reason: lexical_alternative
  - marker: b
    text: Greek “the Christ”; here it is translated as the title “the Messiah.”
    reason: alternative_reading
  - marker: c
    text: The source of these words is uncertain; they may echo Isaiah 60:1 or come from an early Christian hymn.
    reason: cross_reference
simplification_decisions:
- pob_phrase: everything that is made visible
  simplified_phrase: everything brought into view
  preserved_meaning: Something is caused to become visible without specifying who or what reveals it.
  reasoning_layer_used: POB lexical decision for φανερούμενον
  rationale: “Brought into view” expresses the passive idea in natural everyday English.
- pob_phrase: Therefore
  simplified_phrase: That is why
  preserved_meaning: The quotation follows as an inference from the statement about light.
  reasoning_layer_used: POB lexical decision for διὸ
  rationale: “That is why” makes the logical connection easier to follow.
- pob_phrase: sleeper
  simplified_phrase: you who are sleeping
  preserved_meaning: The command directly addresses a person pictured as asleep.
  reasoning_layer_used: POB lexical decision for ὁ καθεύδων
  rationale: The expanded address is clearer while preserving the metaphor.
translation_notes:
  risk_flags:
  - risk: “Brought into view” may sound narrower than the possible sense “exposed.”
    mitigation: Footnote a preserves the important lexical alternative.
  - risk: Readers may assume the quotation comes from a known biblical passage.
    mitigation: The impersonal “it says” and footnote c preserve uncertainty about its source.
