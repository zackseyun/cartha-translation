  rationale: The present participle avoids making the sequence strictly temporal.
- pob_phrase: by the washing of water with the word
  simplified_phrase: through washing with water that is connected with the word
  preserved_meaning: Water-washing remains the means of cleansing, while its relation to the word stays open.
  reasoning_layer_used: POB lexical and theological decisions for τῷ λουτρῷ τοῦ ὕδατος ἐν ῥήματι
