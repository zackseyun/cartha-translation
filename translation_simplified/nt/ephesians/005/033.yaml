simplification_decisions:
- pob_phrase: Nevertheless, you also—each one individually—
  simplified_phrase: Even so, each husband among you
  preserved_meaning: The practical summary applies the love command personally to every husband addressed.
  reasoning_layer_used: Lexical decisions for πλὴν, καὶ ὑμεῖς, and οἱ καθ’ ἕνα ἕκαστος, with the masculine marital context
  rationale: Naming husbands removes a misleading referent while preserving the transition and distributive emphasis.
- pob_phrase: as himself
  simplified_phrase: as he loves himself
  preserved_meaning: A husband’s love for himself remains the standard for loving his wife.
  reasoning_layer_used: Lexical decision for ὡς ἑαυτόν
  rationale: Repeating the implied verb makes the comparison clear.
- pob_phrase: the wife must fear her husband
  simplified_phrase: each wife must respect her husband
  preserved_meaning: Every wife is commanded to show her husband reverential regard rather than terror.
  reasoning_layer_used: Lexical and theological decisions for ἵνα φοβῆται
  rationale: “Respect” gives the chosen contextual sense while the footnote preserves the literal alternative.
interpretive_expansions:
