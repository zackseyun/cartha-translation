simplification_decisions:
- pob_phrase: must not even be named among you
  simplified_phrase: must not even be mentioned among you
  preserved_meaning: The strong prohibition applies within the whole Christian community.
  reasoning_layer_used: Lexical decisions for μηδὲ ὀνομαζέσθω and ἐν ὑμῖν
  rationale: “Mentioned” is an audited alternative that avoids the reputation-focused sense of “heard of.”
- pob_phrase: every impurity
  simplified_phrase: every kind of impurity
  preserved_meaning: The prohibition includes impurity in all its forms.
  reasoning_layer_used: Lexical decision for ἀκαθαρσία πᾶσα
  rationale: Adding “kind of” expresses the comprehensive force naturally.
- pob_phrase: as is proper for saints
  simplified_phrase: This is proper for God’s holy people
  preserved_meaning: Such conduct is fitting for all believers as people set apart to God.
  reasoning_layer_used: Lexical and theological decisions for ἁγίοις
  rationale: The separate sentence explains “saints” without suggesting a canonized class.
interpretive_expansions:
