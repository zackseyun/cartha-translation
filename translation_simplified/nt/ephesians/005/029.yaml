translation:
  language: en
  text: After all, no one has ever hated his own flesh.[a] Instead, he feeds it and cares for it tenderly. In the same way, the Messiah[b] feeds and tenderly cares for the church.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “flesh” means a person’s physical self, not a sinful nature; it can also be translated “body.”
    reason: lexical_alternative
  - marker: b
    text: Many English translations use “Christ” for the title translated here as “Messiah.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: For no one ever hated his own flesh
  simplified_phrase: After all, no one has ever hated his own flesh.
  preserved_meaning: The statement explains the preceding point and refers to a person’s physical self.
  reasoning_layer_used: Lexical decisions for γάρ and σάρξ, with the theological decision to retain “flesh.”
  rationale: “After all” makes the explanatory link natural while the footnote prevents misunderstanding of “flesh.”
- pob_phrase: but nourishes and cherishes it
  simplified_phrase: Instead, he feeds it and cares for it tenderly.
  preserved_meaning: A person provides nourishment and affectionate care for his physical self.
  reasoning_layer_used: Lexical alternatives documented for ἐκτρέφει and θάλπει.
  rationale: The wording uses common verbs while keeping feeding and tender care distinct.
- pob_phrase: just as the Messiah also does the church
  simplified_phrase: In the same way, the Messiah feeds and tenderly cares for the church.
  preserved_meaning: The Messiah’s treatment of the church is compared with a person’s care for his own flesh.
  reasoning_layer_used: The Greek comparison, the elided verbs, and the theological decision for “Messiah.”
  rationale: Repeating the actions resolves the awkward English ellipsis without changing the comparison.
