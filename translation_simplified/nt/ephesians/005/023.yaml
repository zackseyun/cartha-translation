translation:
  language: en
  text: For a husband is the head of his wife,[a] just as the Messiah is the head of the church. He himself is the Savior of the body.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Head” preserves the Greek picture; it may suggest authority, prominence, or source.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the husband is the head of the wife
  simplified_phrase: a husband is the head of his wife
  preserved_meaning: The verse speaks of the marital relationship, not men and women in general.
  reasoning_layer_used: Lexical decisions for ἀνήρ and γυνή
  rationale: Natural English uses “a husband” and “his wife” for this general statement.
- pob_phrase: as the Messiah also is the head of the church
  simplified_phrase: just as the Messiah is the head of the church
  preserved_meaning: The husband-wife relationship is compared with the Messiah-church relationship without equating them.
  reasoning_layer_used: Lexical decision for ὡς καὶ
  rationale: “Just as” makes the comparison clear while avoiding a rigid clause pattern.
- pob_phrase: himself the Savior of the body
  simplified_phrase: He himself is the Savior of the body.
  preserved_meaning: The emphatic pronoun identifies the Messiah personally as Savior while retaining Paul’s body image.
  reasoning_layer_used: Lexical decisions for αὐτός, σωτήρ, and σῶμα
  rationale: A complete sentence is easier to read than the compressed apposition.
translation_notes:
  risk_flags:
  - risk: Modern readers may assume that “head” settles the debated question of authority or source.
    mitigation: The footnote preserves the documented range without resolving the metaphor.
