  preserved_meaning: Christ's purpose is to present the church in a holy and blameless condition.
  reasoning_layer_used: Lexical decisions for ἀλλ’ ἵνα ᾖ, ἁγία, and ἄμωμος
  rationale: The shorter phrase remains governed by the opening purpose clause and preserves both qualities.
