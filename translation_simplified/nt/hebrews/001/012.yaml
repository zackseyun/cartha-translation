translation:
  language: en
  text: You will roll them up as a cloak is rolled up, and they will be changed like clothing. But you remain the same, and your years will never end.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: like a cloak you will roll them up
  simplified_phrase: You will roll them up as a cloak is rolled up
  preserved_meaning: The created heavens and earth are pictured as a cloak that the Son rolls up.
  reasoning_layer_used: Lexical decision for ἑλίξεις and περιβόλαιον
  rationale: The recast word order makes the comparison immediately clear while keeping the clothing image.
- pob_phrase: like a garment they will be changed
  simplified_phrase: they will be changed like clothing
  preserved_meaning: The created order will undergo change, unlike the Son.
  reasoning_layer_used: Lexical decisions for ὡς ἱμάτιον and ἀλλαγήσονται
  rationale: “Clothing” is more familiar than “garment” while preserving the passive change and parallel image.
- pob_phrase: But you are the same, and your years will not fail
  simplified_phrase: But you remain the same, and your years will never end
  preserved_meaning: The Son continues unchanged and exists without end.
  reasoning_layer_used: Theological decision on divine constancy and lexical decision for οὐκ ἐκλείψουσιν
  rationale: The approved alternatives clearly express continuing sameness and endless years without technical language.
translation_notes:
  risk_flags:
  - risk: “Clothing” changes the singular “garment” into a collective noun.
    mitigation: The collective wording preserves the same clothing comparison in natural English.
