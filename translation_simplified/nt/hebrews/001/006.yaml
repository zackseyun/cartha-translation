translation:
  language: en
  text: And when he brings the Firstborn into the world again,[a] he says, “All God’s angels must worship him.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “And again, when he brings the Firstborn into the world, he says, ‘All God’s angels must worship him.’” The Greek can connect “again” either with “brings” or with “says.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: when he again brings
  simplified_phrase: when he brings ... again
  preserved_meaning: The main reading still connects “again” with the act of bringing the Firstborn into the world.
  reasoning_layer_used: POB lexical and theological decisions on πάλιν
  rationale: Ordinary English places “again” after the action while the footnote preserves the genuine alternative.
- pob_phrase: let all God’s angels worship him
  simplified_phrase: All God’s angels must worship him
  preserved_meaning: Every angel is commanded to worship the Firstborn.
  reasoning_layer_used: POB lexical and theological decisions on προσκυνέω
  rationale: “Must worship” states the command naturally without weakening worship to mere homage.
translation_notes:
  risk_flags:
  - risk: “Must” may sound more explicit than the traditional jussive wording “let.”
    mitigation: The Greek form carries command force, so the obligation remains source-grounded.
  - risk: Readers may take “again” only as a reference to a second entrance into the world.
    mitigation: The alternative syntactical reading is retained in the footnote without resolving the ambiguity further.
