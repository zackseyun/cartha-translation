simplification_decisions:
- pob_phrase: God spoke to the fathers in many parts and in many ways by the prophets
  simplified_phrase: God spoke to the fathers through the prophets. What he said came in many parts and in many different ways.
  preserved_meaning: God was the speaker, the prophets were his agents, and earlier revelation came both in portions and by diverse means.
  reasoning_layer_used: POB lexical decisions for Πολυμερῶς, πολυτρόπως, and ἐν τοῖς προφήταις
  rationale: Two sentences clarify the relationships without merging the two Greek adverbs.
- pob_phrase: by the prophets
  simplified_phrase: through the prophets
  preserved_meaning: The prophets served as the agents through whom God spoke.
  reasoning_layer_used: POB lexical decision for ἐν τοῖς προφήταις
  rationale: “Through” makes the prophets’ agency immediately clear while retaining a documented alternative.
- pob_phrase: in many parts and in many ways
  simplified_phrase: in many parts and in many different ways
  preserved_meaning: Earlier revelation was given in multiple portions and by varied means.
  reasoning_layer_used: POB lexical decisions for Πολυμερῶς and πολυτρόπως
  rationale: Adding “different” makes the contrast between portions and manners easier to grasp.
