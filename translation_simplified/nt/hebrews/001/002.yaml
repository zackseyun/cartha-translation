translation:
  language: en
  text: In these last days, he has spoken to us in a Son.[a] He appointed this Son to inherit all things, and through him he also made the ages.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “by a Son.” The unusual Greek wording emphasizes that God’s climactic message came in one who is Son.
    reason: lexical_alternative
  - marker: b
    text: “The ages” may also be translated “the universe” or “the worlds.” The phrase can include both time and the created order.
    reason: alternative_reading
