  preserved_meaning: The Son is appointed as heir of everything.
  reasoning_layer_used: Lexical decision for κληρονόμον πάντων
  rationale: The active wording makes the role of heir immediately understandable.
- pob_phrase: through whom he also made
  simplified_phrase: through him he also made
  preserved_meaning: God made the ages through the Son.
  reasoning_layer_used: Lexical decision for δι’ οὗ
  rationale: The direct pronoun clarifies the new sentence while preserving the Son’s agency.
- pob_phrase: the ages
  simplified_phrase: the ages
  preserved_meaning: The temporal image and its possible cosmic scope remain open.
  reasoning_layer_used: Lexical and theological decisions for τοὺς αἰῶνας
  rationale: Keeping the phrase in the text avoids making its broader cosmic sense too definite.
