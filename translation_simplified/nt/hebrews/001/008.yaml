  text: But about the Son, he says, “Your throne, O God, lasts forever and ever.[a] Your royal scepter shows that you rule with uprightness.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, less likely, “God is your throne forever and ever.” The Greek wording can be understood either way, but the context favors direct address to the Son as God.
    reason: alternative_reading
  - marker: b
    text: Or “righteousness.” The Greek word refers to what is upright or right.
    reason: lexical_alternative
