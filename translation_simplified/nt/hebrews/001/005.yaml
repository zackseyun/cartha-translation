translation:
  language: en
  text: For did he ever say to any angel, “You are my Son; today I have begotten you”[a]? And again, “I will be his father, and he will be my son”[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This quotation echoes Psalm 2:7. “I have begotten you” has been understood in relation to royal enthronement, resurrection, or the Son’s eternal relation to the Father; the wording does not decide among these views.
    reason: cross_reference
  - marker: b
    text: This quotation comes from 2 Samuel 7:14.
    reason: cross_reference
