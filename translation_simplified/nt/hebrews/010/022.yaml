translation:
  language: en
  text: Let us draw near to God with true hearts, fully assured in faith.[a] Our hearts have been sprinkled clean from an evil conscience,[b] and our bodies have been washed with pure water.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “with sincere hearts.”
    reason: lexical_alternative
  - marker: b
    text: Or “a guilty conscience,” though “evil conscience” has a broader meaning.
    reason: lexical_alternative
  - marker: c
    text: This purification imagery may echo baptism, but the verse does not explicitly identify the washing.
    reason: cultural_note
simplification_decisions:
- pob_phrase: with a true heart in full assurance of faith
  simplified_phrase: with true hearts, fully assured in faith
  preserved_meaning: We are to approach with genuine hearts and the full assurance that accompanies faith.
  reasoning_layer_used: lexical decisions for ἀληθινῆς καρδίας and πληροφορίᾳ πίστεως
  rationale: The plural and adverbial wording are natural English and avoid making faith itself the object of confidence.
- pob_phrase: with our hearts sprinkled clean from an evil conscience
  simplified_phrase: Our hearts have been sprinkled clean from an evil conscience
  preserved_meaning: The worshipers are already in a cleansed state as they draw near.
  reasoning_layer_used: lexical decision for the perfect passive participle ῥεραντισμένοι
  rationale: A finite verb clearly expresses the completed cleansing state while preserving the sprinkling image.
- pob_phrase: and our bodies washed with pure water
  simplified_phrase: and our bodies have been washed with pure water
  preserved_meaning: Their bodies likewise stand washed with water in purification imagery.
  reasoning_layer_used: lexical decisions for λελουσμένοι and ὕδατι καθαρῷ
  rationale: Adding “have been” makes the parallel completed state clear in ordinary English.
interpretive_expansions:
- pob_phrase: let us draw near
  rendering: Let us draw near to God
  claim: God is the one whom believers are urged to approach.
  evidence:
  - The POB rationale places the exhortation in Hebrews’ access-to-God context.
  - The immediate sanctuary context describes entering God’s presence.
  confidence: high
  alternatives_preserved:
  - Let us draw near
  - Let us come near to God
translation_notes:
  risk_flags:
