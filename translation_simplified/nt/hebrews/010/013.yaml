translation:
  language: en
  text: From that time on, he waits until his enemies are made a footstool beneath his feet.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “waits expectantly.” The Greek describes waiting with expectation, not uncertainty.
    reason: lexical_alternative
  - marker: b
    text: 'This echoes Psalm 110:1: “Sit at my right hand until I make your enemies a footstool for your feet.”'
    reason: cross_reference
simplification_decisions:
- pob_phrase: from then on waiting
  simplified_phrase: From that time on, he waits
  preserved_meaning: Christ continues to wait after being seated at God’s right hand.
  reasoning_layer_used: Lexical decisions for τὸ λοιπὸν and ἐκδεχόμενος, with the preceding context
  rationale: The finite clause is easier to read than the compressed participial phrase.
- pob_phrase: a footstool for his feet
  simplified_phrase: a footstool beneath his feet
  preserved_meaning: His enemies will be subjected through the concrete royal footstool image.
  reasoning_layer_used: Lexical and theological decisions preserving the Psalm 110:1 echo
  rationale: “Beneath” makes the physical image immediately clear without reducing it to mere defeat.
