simplification_decisions:
- pob_phrase: which he inaugurated for us as
  simplified_phrase: He established this ... for us
  preserved_meaning: Jesus newly brought the way into use for our benefit.
  reasoning_layer_used: POB lexical decision for ἐνεκαίνισεν and ἡμῖν
  rationale: “Established” communicates inauguration in more familiar English without reducing the action to merely opening.
- pob_phrase: a new and living way
  simplified_phrase: this new and living way
  preserved_meaning: The way of access is newly established and living.
  reasoning_layer_used: POB lexical decisions for ὁδόν, πρόσφατον, and ζῶσαν
  rationale: “This” replaces the relative clause and keeps the connection to the way being described.
- pob_phrase: through the curtain—that is, his flesh
  simplified_phrase: through the curtain—that is, through his flesh
  preserved_meaning: The curtain image is identified with Jesus’s flesh as the means of access.
  reasoning_layer_used: POB theological decision on the curtain metaphor and σάρξ
  rationale: Repeating “through” makes the relationship clear while preserving both the image and the required term “flesh.”
translation_notes:
  risk_flags:
  - risk: “Established” may carry less ceremonial nuance than “inaugurated.”
    mitigation: The words “new” and “way” retain the sense of something newly brought into use.
  - risk: The curtain and flesh identification remains a difficult metaphor.
    mitigation: The explanatory wording preserves the author’s identification without resolving its tension.
