translation:
  language: en
  text: Then he said, “Here I am. I have come to do your will.” He removes the first in order to put the second in its place.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “The first” and “the second” likely mean the former sacrificial arrangement and God’s will fulfilled through the Messiah’s offering; they may also mean the two quoted statements or, more broadly, the old and new covenants.
    reason: simplification_note
simplification_decisions:
- pob_phrase: Behold, I have come
  simplified_phrase: Here I am. I have come
  preserved_meaning: The speaker calls attention to his arrival and continuing presence.
  reasoning_layer_used: Lexical decisions for Ἰδοὺ and ἥκω
  rationale: Two natural clauses preserve both the attention marker and the arrival image.
- pob_phrase: so that he may establish the second
  simplified_phrase: in order to put the second in its place
  preserved_meaning: The first is removed for the purpose of bringing the second into force.
  reasoning_layer_used: Lexical decision for στήσῃ and immediate argument
  rationale: “Put in its place” expresses the contrast in common English without resolving the referent.
