translation:
  language: en
  text: But the righteous person who is mine[c] will live by faith.[a] If he shrinks back under pressure, I myself will not be pleased with him.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “by faithfulness” or “by trust.”
    reason: lexical_alternative
  - marker: b
    text: The words “he” and “him” represent a person and do not refer only to males.
    reason: cultural_note
  - marker: c
    text: Some manuscripts say “the righteous person” rather than “the righteous person who is mine.”
    reason: textual_variant
simplification_decisions:
- pob_phrase: my righteous one
  simplified_phrase: the righteous person who is mine
  preserved_meaning: The person is righteous and is identified as God’s own.
  reasoning_layer_used: Lexical decisions for δίκαιός and μου
  rationale: The wording explains the compact title while retaining both righteousness and possession.
- pob_phrase: if he shrinks back
  simplified_phrase: if he shrinks back under pressure
  preserved_meaning: The same person retreats when facing pressure.
  reasoning_layer_used: Lexical and theological decisions for ὑποστείληται and its subject
  rationale: The clarifier makes the warning context explicit without turning retreat into complete abandonment.
- pob_phrase: my soul takes no pleasure in him
  simplified_phrase: I myself will not be pleased with him
  preserved_meaning: God personally expresses displeasure with the person who shrinks back.
  reasoning_layer_used: Lexical decisions for ἡ ψυχή μου and οὐκ εὐδοκεῖ
  rationale: The natural English wording preserves the expression’s personal force without adding intensity.
interpretive_expansions:
- pob_phrase: my righteous one
  rendering: the righteous person who is mine
  claim: The possessive identifies the righteous person as belonging to God.
  evidence:
  - The SBLGNT reading includes μου, meaning “my.”
  - POB retains the possessive in “my righteous one.”
  confidence: high
  alternatives_preserved:
  - Some manuscripts omit “my.”
- pob_phrase: shrinks back
  rendering: shrinks back under pressure
  claim: The retreat occurs in the face of pressure.
  evidence:
  - The lexical rationale describes retreating in the face of pressure.
  - Hebrews 10 places the statement in a call to endure.
  confidence: high
  alternatives_preserved:
  - shrinks back
  - draws back
translation_notes:
  risk_flags:
