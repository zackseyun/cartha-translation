translation:
  language: en
  text: Sometimes you were made a public spectacle as you endured insults and suffering. At other times, you joined with those who were treated that way.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or possibly, “those who lived that way.” The persecution context favors “were treated that way.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: being publicly exposed to insults and afflictions
  simplified_phrase: were made a public spectacle as you endured insults and suffering
  preserved_meaning: They suffered hostile words and other persecution in public view.
  reasoning_layer_used: POB lexical decisions for ὀνειδισμοῖς, θλίψεσιν, and θεατριζόμενοι
  rationale: Common wording preserves the vivid image of public shame.
- pob_phrase: becoming partners with
  simplified_phrase: joined with
  preserved_meaning: They entered into active solidarity with people suffering persecution.
  reasoning_layer_used: POB lexical decisions for κοινωνοὶ and γενηθέντες
  rationale: “Joined with” conveys participation and entry into solidarity rather than mere proximity.
- pob_phrase: sometimes ... and at other times
  simplified_phrase: Sometimes ... At other times
  preserved_meaning: The verse describes two aspects of their earlier endurance.
  reasoning_layer_used: POB lexical decision for τοῦτο μὲν ... τοῦτο δὲ
  rationale: Two sentences make the paired experiences easier to follow.
translation_notes:
  risk_flags:
  - risk: “Joined with” may not express the full depth of sharing in persecution.
    mitigation: The phrase “those who were treated that way” anchors the joining in persecuted solidarity.
  - risk: The Greek may refer to those who conducted themselves that way.
    mitigation: The main text follows the contextually favored POB reading, and the footnote preserves the alternative.
