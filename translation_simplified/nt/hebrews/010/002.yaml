translation:
  language: en
  text: Otherwise, would not the sacrifices have stopped being offered because those who worship, once cleansed,[a] would no longer carry a sense of guilt before God because of their sins?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Once” may mean “once for all,” emphasizing a cleansing that does not need to be repeated.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: would they not have stopped being offered
  simplified_phrase: would not the sacrifices have stopped being offered
  preserved_meaning: The repeated sacrifices are the offerings that would have ended.
  reasoning_layer_used: Lexical decision for προσφερόμεναι and the preceding context
  rationale: Naming the sacrifices makes the implied subject clear.
- pob_phrase: those who worship, having once been cleansed
  simplified_phrase: those who worship, once cleansed
  preserved_meaning: The worshipers receive completed cleansing with continuing results.
  reasoning_layer_used: Lexical decisions for τοὺς λατρεύοντας, ἅπαξ, and κεκαθαρισμένους
  rationale: The shorter clause removes an awkward participle while preserving completed cleansing.
- pob_phrase: would no longer have any consciousness of sins
  simplified_phrase: would no longer carry a sense of guilt before God because of their sins
  preserved_meaning: Effective cleansing ends continuing guilt-awareness without removing moral awareness of sin.
  reasoning_layer_used: POB lexical and theological decisions for συνείδησιν ἁμαρτιῶν
  rationale: This wording prevents readers from mistaking the phrase for loss of moral conscience.
interpretive_expansions:
- pob_phrase: consciousness of sins
  rendering: a sense of guilt before God because of their sins
  claim: The phrase refers to continuing guilt-awareness before God rather than mere knowledge that sin exists.
  evidence:
  - The POB lexical rationale identifies the phrase as guilt-consciousness before God.
  - The POB theological decision rejects the idea that moral conscience disappears.
  - The verse makes its removal the reason repeated sacrifices would stop.
  confidence: high
  alternatives_preserved:
  - conscience of sins
  - awareness of sins
translation_notes:
  risk_flags:
  - risk: “Once” may carry the stronger sense “once for all.”
    mitigation: The footnote preserves that possible definitive nuance.
