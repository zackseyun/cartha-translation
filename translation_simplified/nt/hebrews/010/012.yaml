translation:
  language: en
  text: But Christ offered one sacrifice for sins, effective for all time.[a] Then he sat down at the right hand of God.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Christ offered one sacrifice for sins forever.” The Greek phrase may be linked more closely to the act of offering.
    reason: alternative_reading
  - marker: b
    text: “At the right hand of God” echoes Psalm 110:1, which Hebrews uses to describe the Messiah’s exaltation.
    reason: cross_reference
simplification_decisions:
- pob_phrase: this one
  simplified_phrase: Christ
  preserved_meaning: The person contrasted with the priests who repeatedly offer sacrifices is Christ.
  reasoning_layer_used: lexical decision and immediate context
  rationale: Naming Christ removes an unclear reference while preserving the contrast.
- pob_phrase: after offering one sacrifice for sins for all time, sat down
  simplified_phrase: offered one sacrifice for sins, effective for all time. Then he sat down
  preserved_meaning: Christ’s single sacrifice has lasting effect, and his sitting follows the completed offering.
  reasoning_layer_used: theological decision and syntax
  rationale: Two sentences make the sequence clear without weakening the sacrifice’s permanence.
- pob_phrase: at the right hand of God
  simplified_phrase: at the right hand of God
  preserved_meaning: The royal-exaltation image and its connection to Psalm 110:1 remain intact.
  reasoning_layer_used: lexical decision and cross-reference
  rationale: The familiar biblical image is retained because replacing it would hide the allusion.
