translation:
  language: en
  text: How much worse a punishment do you think someone will deserve for having trampled the Son of God underfoot, treated the blood of the covenant by which that person was sanctified[a] as ordinary rather than holy,[b] and insulted the Spirit of grace?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek links “was sanctified” to the offender, though some interpreters understand the referent differently.
    reason: alternative_reading
  - marker: b
    text: The Greek word translated “ordinary rather than holy” can also mean “unclean” or “profane.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: will be deserved by the one who has
  simplified_phrase: someone will deserve for having
  preserved_meaning: The offender merits a future, more severe punishment because of these acts.
  reasoning_layer_used: Lexical decision for ἀξιωθήσεται and Greek participial structure
  rationale: The active wording removes an awkward passive construction while retaining the judicial force.
- pob_phrase: has trampled underfoot the Son of God
  simplified_phrase: having trampled the Son of God underfoot
  preserved_meaning: The vivid image portrays contemptuous treatment of the Son of God.
  reasoning_layer_used: Lexical decision for καταπατήσας
  rationale: The concrete trampling image is retained in more natural English clause order.
- pob_phrase: has regarded the blood of the covenant ... as common
  simplified_phrase: treated the blood of the covenant ... as ordinary rather than holy
  preserved_meaning: The offender regards consecrated covenant blood as merely common.
  reasoning_layer_used: Lexical decisions for κοινὸν and αἷμα τῆς διαθήκης
  rationale: The contrast with holiness makes the sacrilegious force of “common” immediately clear.
interpretive_expansions:
- pob_phrase: as common
  rendering: as ordinary rather than holy
  claim: “Common” contrasts ordinary status with what is holy or consecrated.
  evidence:
  - The POB lexical rationale explicitly identifies the contrast with holy or consecrated.
  - The covenant blood is the stated means of sanctification in the immediate clause.
  confidence: high
  alternatives_preserved:
  - unclean
  - profane
translation_notes:
  risk_flags:
  - risk: “That person was sanctified” may appear to settle the debated theological referent.
    mitigation: The main text follows POB’s chosen syntax, while footnote [a] preserves the documented ambiguity.
