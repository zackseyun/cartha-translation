- pob_phrase: hold fast the confession of our hope
  simplified_phrase: hold firmly to the hope we declare
  preserved_meaning: The community must remain committed to its declared hope.
  reasoning_layer_used: Lexical decisions for κατέχωμεν, ὁμολογίαν, and τῆς ἐλπίδος
  rationale: The noun “confession” becomes the clearer verb “declare” while retaining its sense of expressed belief.
- pob_phrase: for the one who promised is faithful
  simplified_phrase: because the one who promised is faithful
  preserved_meaning: Their steadfastness rests on the faithfulness of the one who made the promise.
  reasoning_layer_used: Lexical decision for πιστὸς and theological decision on the implicit subject
  rationale: “Because” makes the reason clear while leaving God implicit as the Greek and POB do.
