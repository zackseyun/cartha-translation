translation:
  language: en
  text: You shared in the suffering of the prisoners.[a] When your belongings were taken from you by force, you accepted the loss with joy because you knew that you yourselves have a better possession—one that will last.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “showed compassion to the prisoners.” The wording likely includes actively sharing in their suffering.
    reason: lexical_alternative
  - marker: b
    text: Some manuscripts read, “you have for yourselves a better possession in heaven, and one that lasts.”
    reason: textual_variant
simplification_decisions:
- pob_phrase: suffered together with the prisoners
  simplified_phrase: shared in the suffering of the prisoners
  preserved_meaning: They actively stood with imprisoned believers and bore suffering with them.
  reasoning_layer_used: lexical and theological decisions
  rationale: This natural wording preserves costly solidarity rather than mere inward sympathy.
- pob_phrase: the plundering of your possessions
  simplified_phrase: your belongings were taken from you by force
  preserved_meaning: Their material property was seized violently and unjustly.
  reasoning_layer_used: lexical decisions
  rationale: The rewrite explains the forceful image of plundering in common English.
- pob_phrase: you accepted with joy the plundering
  simplified_phrase: you accepted the loss with joy
  preserved_meaning: They willingly endured the loss without approving the injustice.
  reasoning_layer_used: lexical decision for προσεδέξασθε
  rationale: Naming the loss makes the object of their acceptance clear.
interpretive_expansions:
- pob_phrase: knowing that
  rendering: because you knew that
  claim: Their knowledge of a better, lasting possession explains why they accepted the loss with joy.
  evidence:
  - The POB lexical rationale recognizes a causal nuance in the participle.
  - The immediate sentence links their joyful acceptance with what they knew.
  confidence: high
  alternatives_preserved:
  - while knowing that
translation_notes:
