translation:
  language: en
  text: Every priest stands day after day, carrying out his priestly service. He offers the same sacrifices again and again, but they can never take away sins.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: stands day after day ministering
  simplified_phrase: stands day after day, carrying out his priestly service
  preserved_meaning: Each priest remains standing while repeatedly performing sacred duties.
  reasoning_layer_used: Lexical decisions for ἕστηκεν, καθ’ ἡμέραν, and λειτουργῶν
  rationale: This replaces the less familiar “ministering” while preserving both priestly service and the important standing posture.
- pob_phrase: and offering the same sacrifices again and again, which can never take away sins
  simplified_phrase: He offers the same sacrifices again and again, but they can never take away sins
  preserved_meaning: The repeatedly offered sacrifices are wholly unable to remove sins.
  reasoning_layer_used: Lexical and theological decisions on repeated sacrifice and absolute inability
  rationale: A new sentence and “but” make the contrast easier to follow without weakening the absolute claim.
translation_notes:
  risk_flags:
  - risk: Breaking the sentence could weaken the close link between priestly service and repeated offerings.
    mitigation: The second sentence begins with the same priest as subject and immediately describes his offerings.
  - risk: Replacing “ministering” could make the service sound generic.
    mitigation: The phrase “priestly service” explicitly preserves the sacred role.
