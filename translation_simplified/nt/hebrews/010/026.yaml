translation:
  language: en
  text: For if we deliberately keep on sinning after we have received knowledge of the truth[a], no sacrifice for sins remains any longer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “full knowledge of the truth.” The Greek word may refer to fuller or decisive knowledge.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: if we go on sinning deliberately
  simplified_phrase: if we deliberately keep on sinning
  preserved_meaning: The warning concerns intentional, continuing sin rather than one isolated act.
  reasoning_layer_used: Lexical decision for Ἑκουσίως and theological decision on the present participle
  rationale: The reordered phrase is natural while preserving deliberate and ongoing action.
- pob_phrase: after receiving the knowledge of the truth
  simplified_phrase: after we have received knowledge of the truth
  preserved_meaning: Knowledge of the truth was received before the continuing deliberate sin.
  reasoning_layer_used: Lexical decisions for μετὰ τὸ λαβεῖν and ἐπίγνωσιν
  rationale: A full clause clarifies the sequence without defining the depth of that knowledge.
- pob_phrase: there no longer remains a sacrifice for sins
  simplified_phrase: no sacrifice for sins remains any longer
  preserved_meaning: After the stated condition, no further sacrifice for sins is left.
  reasoning_layer_used: Lexical decisions for οὐκέτι, περὶ ἁμαρτιῶν, ἀπολείπεται, and θυσία
  rationale: The direct order is clearer, while “any longer” preserves the temporal force of οὐκέτι.
translation_notes:
  risk_flags:
  - risk: Readers may take the warning as applying to any single deliberate sin.
    mitigation: “Keep on sinning” preserves the source text’s ongoing aspect.
  - risk: Readers may assume “knowledge of the truth” settles the person’s spiritual status.
    mitigation: The main text stays neutral, and the footnote gives only the warranted lexical alternative.
