translation:
  language: en
  text: and a great priest who is in charge of God’s house.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a high priest.” Hebrews often presents Jesus as the high priest, but the Greek here literally says “a great priest.”
    reason: alternative_reading
  - marker: b
    text: “God’s house” can also mean God’s household—his people.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: over the house of God
  simplified_phrase: who is in charge of God’s house
  preserved_meaning: The priest has authority and oversight within what belongs to God.
  reasoning_layer_used: The lexical decision for ἐπί permits “in charge of,” while οἶκος retains the house metaphor.
  rationale: The relative clause makes the relationship clear in ordinary English without weakening the priest’s authority.
translation_notes:
  risk_flags:
  - risk: Modern readers may take “house” to mean only a building.
    mitigation: Footnote b preserves the important sense of God’s household or people.
  - risk: Readers may expect the familiar title “high priest.”
    mitigation: The main text keeps the source-driven wording “great priest,” with the alternative noted.
