translation:
  language: en
  text: The law is only a shadow of the good things that are coming, not the actual form of those realities.[a] So the same sacrifices, offered continually year after year, can never perfect the worshipers who approach God.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “not the image itself of those realities.”
    reason: lexical_alternative
  - marker: b
    text: Here “perfect” means bringing worshipers to their intended goal, not making them morally flawless.
    reason: simplification_note
simplification_decisions:
- pob_phrase: For since the law has only a shadow
  simplified_phrase: The law is only a shadow
  preserved_meaning: The law is an anticipatory outline rather than the full reality.
  reasoning_layer_used: Lexical and theological decisions on the shadow/reality contrast
  rationale: Removing the dense opening construction makes the central contrast immediate.
- pob_phrase: not the very form of the realities
  simplified_phrase: not the actual form of those realities
  preserved_meaning: The law is not the substantial form to which its shadow points.
  reasoning_layer_used: Lexical decision for εἰκών and πραγμάτων
  rationale: “Actual form” clearly preserves the shadow/form contrast without suggesting falsehood.
- pob_phrase: by the same sacrifices that they continually offer year after year
  simplified_phrase: the same sacrifices, offered continually year after year
  preserved_meaning: The repeated annual sacrifices remain unable to achieve the intended goal.
  reasoning_layer_used: Lexical decisions on annual repetition and ongoing offering
  rationale: The passive wording removes an unclear subject while retaining the repeated offerings.
interpretive_expansions:
- pob_phrase: those who draw near
  rendering: the worshipers who approach God
  claim: Drawing near refers to approaching God in worship.
  evidence:
  - The POB footnote explicitly identifies approaching God in worship.
  - The lexical rationale notes the expression’s cultic force in Hebrews.
  confidence: high
  alternatives_preserved:
  - those who draw near
  - those who come near
translation_notes:
  risk_flags:
  - risk: Modern readers may take “perfect” to mean morally flawless.
    mitigation: A footnote explains the broader sense of bringing worshipers to their intended goal.
  - risk: “Actual form” may still leave the image metaphor less visible.
    mitigation: The footnote preserves “the image itself” as a lexical alternative.
