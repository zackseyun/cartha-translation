translation:
  language: en
  text: Without faith,[a] it is impossible to please God. Anyone who comes to God must believe that he exists and that he proves to be the one who rewards those who earnestly seek him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “trust.” Here, faith means believing and trusting God.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: it is impossible to please him
  simplified_phrase: it is impossible to please God
  preserved_meaning: Faith is necessary for anyone to please God.
  reasoning_layer_used: POB lexical decision on ἀδύνατον εὐαρεστῆσαι
  rationale: Naming God removes an unclear pronoun without changing its referent.
- pob_phrase: the one who comes to God
  simplified_phrase: Anyone who comes to God
  preserved_meaning: The statement applies to every person who approaches God.
  reasoning_layer_used: POB lexical decision on τὸν προσερχόμενον τῷ θεῷ
  rationale: “Anyone” expresses the general statement in more natural English.
- pob_phrase: he is a rewarder of those who diligently seek him
  simplified_phrase: he proves to be the one who rewards those who earnestly seek him
  preserved_meaning: Those who persistently seek God find that he rewards them.
  reasoning_layer_used: POB lexical and theological decisions on μισθαποδότης γίνεται and ἐκζητέω
  rationale: The wording keeps the Greek verb’s found-to-be force while replacing the abstract noun “rewarder” with a clear action.
translation_notes:
  risk_flags:
  - risk: “Proves to be” could be misunderstood as suggesting uncertainty or change in God.
    mitigation: The phrase describes what seekers find God to be, not a change in his character.
