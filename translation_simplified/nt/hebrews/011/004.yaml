translation:
  language: en
  text: By faith, Abel offered God a better sacrifice than Cain did.[a] Through this sacrifice, he received testimony that he was righteous, as God testified about his offerings. And through it,[b] Abel still speaks, even though he died.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a greater sacrifice”; the comparison may concern quality or size.
    reason: lexical_alternative
  - marker: b
    text: “It” may refer to Abel’s faith or to his sacrifice; the Greek does not specify.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: By faith Abel offered to God a better sacrifice than Cain
  simplified_phrase: By faith, Abel offered God a better sacrifice than Cain did
  preserved_meaning: Faith was the means by which Abel offered his superior sacrifice to God.
  reasoning_layer_used: The lexical decision treats Πίστει as instrumental and retains “better” as the controlling comparison.
  rationale: The wording keeps the source’s instrumental force while making the comparison natural in English.
- pob_phrase: through which he was attested as righteous
  simplified_phrase: Through this sacrifice, he received testimony that he was righteous
  preserved_meaning: Abel’s sacrifice was the means through which testimony affirmed his righteousness.
  reasoning_layer_used: The lexical and theological decisions preserve the witness motif of μαρτυρέω.
  rationale: “Received testimony” is clearer than “was attested” while retaining witness language.
- pob_phrase: God testifying concerning his gifts
  simplified_phrase: as God testified about his offerings
  preserved_meaning: God bore witness concerning Abel’s sacrificial gifts.
  reasoning_layer_used: The lexical rationale permits “offerings” for δῶρα in this sacrificial setting.
  rationale: “Offerings” makes the sacrificial context immediately clear.
translation_notes:
  risk_flags:
  - risk: The final pronoun may appear to refer only to the sacrifice.
    mitigation: Footnote b preserves the Greek ambiguity between Abel’s faith and his sacrifice.
