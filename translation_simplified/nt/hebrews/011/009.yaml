  preserved_meaning: Abraham resided as an outsider in the land promised to him.
  reasoning_layer_used: Lexical decisions for παρῴκησεν, εἰς γῆν τῆς ἐπαγγελίας, and ὡς ἀλλοτρίαν.
  rationale: The contrast makes both the divine promise and Abraham’s foreign status easy to grasp.
- pob_phrase: dwelling in tents with Isaac and Jacob
  simplified_phrase: He lived in tents with Isaac and Jacob
  preserved_meaning: Abraham’s tent-dwelling was explicitly associated with Isaac and Jacob.
  reasoning_layer_used: Lexical decisions for ἐν σκηναῖς κατοικήσας and μετὰ Ἰσαὰκ καὶ Ἰακώβ.
  rationale: The direct sentence retains the concrete tent image and the source’s explicit “with.”
- pob_phrase: fellow heirs of the same promise
  simplified_phrase: They were heirs together with Abraham, sharing the same promise
  preserved_meaning: Isaac and Jacob shared Abraham’s heir relationship while remaining linked to the identical promise.
  reasoning_layer_used: Lexical decisions for συγκληρονόμων and τῆς ἐπαγγελίας τῆς αὐτῆς.
  rationale: The wording keeps the heir relationship and the same promise as distinct ideas.
