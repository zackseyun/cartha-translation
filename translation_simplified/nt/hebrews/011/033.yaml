simplification_decisions:
- pob_phrase: worked righteousness
  simplified_phrase: did what was right
  preserved_meaning: They actively lived and acted in a morally upright way.
  reasoning_layer_used: POB lexical and theological decisions on δικαιοσύνη
  rationale: The clearer wording expresses righteous action while the footnote preserves “righteousness” and “justice.”
- pob_phrase: obtained promises
  simplified_phrase: obtained what had been promised
  preserved_meaning: They attained promised outcomes without specifying whether every promise was fully realized.
  reasoning_layer_used: POB lexical decision on ἐπέτυχον ἐπαγγελιῶν
  rationale: Recasting the noun phrase makes the expression natural without resolving Hebrews’ broader tension about fulfillment.
translation_notes:
  risk_flags:
  - risk: “Did what was right” may sound narrower than the biblical concept of righteousness.
    mitigation: The footnote retains both “righteousness” and the possible nuance “justice.”
