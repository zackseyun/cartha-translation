translation:
  language: en
  text: Through faith, they conquered kingdoms, did what was right,[a] obtained what had been promised, and shut the mouths of lions.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “practiced righteousness” or “carried out justice.”
