translation:
  language: en
  text: By faith, Enoch was taken away so that he would not see death.[a] He could not be found because God had taken him away. For before he was taken away, he had been commended as one who pleased God.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: That is, experience death.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: so that he should not see death
  simplified_phrase: so that he would not see death
  preserved_meaning: God took Enoch away with the result that he did not experience death.
  reasoning_layer_used: POB lexical and theological decisions on τοῦ μὴ ἰδεῖν θάνατον
  rationale: The natural modal “would” preserves both the purpose-result sense and the image “see death.”
- pob_phrase: he was not found
  simplified_phrase: He could not be found
  preserved_meaning: Enoch was no longer available to be found after God took him away.
  reasoning_layer_used: POB lexical alternatives for οὐχ ηὑρίσκετο
  rationale: This approved alternative is clearer while leaving the searchers unnamed.
- pob_phrase: For before his being taken away, he had been commended as having pleased God
  simplified_phrase: For before he was taken away, he had been commended as one who pleased God
  preserved_meaning: Before being taken away, Enoch received testimony that he had pleased God.
  reasoning_layer_used: POB lexical decisions for μεμαρτύρηται and εὐαρεστηκέναι τῷ θεῷ
  rationale: Natural clauses replace dense constructions without turning the testimony’s content into its cause.
translation_notes:
  risk_flags:
  - risk: Modern readers may take “see death” literally rather than as an idiom.
    mitigation: The footnote explains the idiom while the text preserves its source image.
  - risk: “Taken away” does not specify where Enoch was taken.
    mitigation: The wording follows the verse’s restraint and does not add “to heaven.”
