translation:
  language: en
  text: Some women received their dead loved ones back to life through resurrection. But others were tortured. They refused an offer of release[a] so that they might receive a better resurrection.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This means release from torture or death, not necessarily redemption in the salvation sense.
    reason: lexical_alternative
  - marker: b
    text: This better resurrection is greater than being restored to ordinary mortal life, as in the first sentence.
    reason: cross_reference
simplification_decisions:
- pob_phrase: Women received back their dead by resurrection
  simplified_phrase: Some women received their dead loved ones back to life through resurrection
  preserved_meaning: The women received deceased people close to them alive again by resurrection.
  reasoning_layer_used: Lexical decisions for ἔλαβον, τοὺς νεκροὺς αὐτῶν, and ἐξ ἀναστάσεως
  rationale: The wording explains the relationship and result while retaining resurrection.
- pob_phrase: but others were tortured, not accepting release
  simplified_phrase: But others were tortured. They refused an offer of release
  preserved_meaning: The sufferers chose not to accept freedom from torture or death.
  reasoning_layer_used: Lexical and theological decisions for ἐτυμπανίσθησαν and ἀπολύτρωσιν
  rationale: Two sentences make the contrast and deliberate refusal easier to follow.
- pob_phrase: so that they might obtain a better resurrection
  simplified_phrase: so that they might receive a better resurrection
  preserved_meaning: They endured suffering in hope of a resurrection superior to temporary restoration.
  reasoning_layer_used: Theological decision on κρείττονος ἀναστάσεως
  rationale: Receive is common English, while better resurrection preserves the central contrast.
