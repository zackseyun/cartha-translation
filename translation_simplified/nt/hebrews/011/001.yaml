translation:
  language: en
  text: Faith means being sure of what we hope for.[a] It is proof of what we do not see.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the substance” or “the reality” of what we hope for.
    reason: lexical_alternative
  - marker: b
    text: Or “the evidence” or “the conviction” concerning what we do not see.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Faith is the assurance of things hoped for
  simplified_phrase: Faith means being sure of what we hope for
  preserved_meaning: Faith is confident assurance directed toward what believers hope for.
  reasoning_layer_used: POB lexical and theological decisions for πίστις and ὑπόστασις
  rationale: The verbal phrasing explains “assurance” clearly without choosing the metaphysical reading “substance.”
- pob_phrase: the proof of things not seen
  simplified_phrase: It is proof of what we do not see
  preserved_meaning: Faith has evidentiary force concerning realities beyond present sight.
  reasoning_layer_used: POB lexical decisions for ἔλεγχος and οὐ βλεπομένων
  rationale: The wording remains accessible without turning present non-sight into an inability to see.
translation_notes:
  risk_flags:
  - risk: “Being sure” may sound more subjective than the POB’s “assurance.”
    mitigation: The second sentence retains “proof,” and the footnotes preserve objective lexical alternatives.
  - risk: Modern readers may hear “proof” as strict scientific demonstration.
    mitigation: The footnote preserves “evidence” and “conviction” as bounded alternatives.
