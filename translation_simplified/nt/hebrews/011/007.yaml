translation:
  language: en
  text: By faith Noah, after God warned him about things not yet seen, built an ark in reverent fear to save his household. Through that ark,[a] he condemned the world and became an heir of the righteousness that comes through faith.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Through that ark” most naturally refers to the ark, though it may refer more broadly to Noah’s faith or obedient response.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: having been warned about things not yet seen
  simplified_phrase: after God warned him about things not yet seen
  preserved_meaning: Noah received a divine warning about events that were still unseen.
  reasoning_layer_used: lexical and theological decisions on χρηματισθεὶς
  rationale: The direct clause removes the difficult participle while naming the implied divine source.
- pob_phrase: in reverent fear constructed an ark for the salvation of his household
  simplified_phrase: built an ark in reverent fear to save his household
  preserved_meaning: Noah reverently built the ark as the means of rescuing his household.
  reasoning_layer_used: lexical decisions on εὐλαβηθεὶς, κατεσκεύασεν, and σωτηρία
  rationale: Common verbs replace abstract wording while preserving reverent fear and rescue.
- pob_phrase: became heir of the righteousness according to faith
  simplified_phrase: became an heir of the righteousness that comes through faith
  preserved_meaning: Noah received righteousness as an inheritance in relation to faith.
  reasoning_layer_used: contested-term decision on δικαιοσύνη and lexical decision on κατά
  rationale: The wording keeps “heir” and “righteousness” while expressing their faith relationship naturally.
interpretive_expansions:
- pob_phrase: having been warned
  rendering: God warned him
  claim: God was the source of Noah’s warning.
  evidence:
  - The passive verb commonly refers to receiving divine communication.
  - The flood narrative identifies God as the one who warned Noah.
  - The POB theological decision favors naming God as the source.
  confidence: high
  alternatives_preserved:
  - having been divinely instructed
  - having received a divine warning
- pob_phrase: the righteousness according to faith
  rendering: the righteousness that comes through faith
  claim: The inherited righteousness is received in relation to faith.
  evidence:
  - The POB rationale favors covenantal righteousness received in relation to faith.
  - The chapter repeatedly presents faith as the means of faithful response.
  confidence: moderate
  alternatives_preserved:
  - the righteousness according to faith
  - the righteousness by faith
translation_notes:
  risk_flags:
  - risk: “Through that ark” may suggest that the object alone condemned the world.
    mitigation: The footnote preserves the broader possibilities of Noah’s faith or obedient response.
  - risk: “Comes through faith” expresses the relationship more directly than the Greek preposition alone does.
    mitigation: The audit records the more formal alternatives and avoids defining a specific doctrinal mechanism.
