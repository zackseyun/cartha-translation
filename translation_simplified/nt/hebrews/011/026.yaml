translation:
  language: en
  text: He considered the disgrace of Messiah[a][b] worth more than Egypt’s treasures, because he kept looking ahead to the reward.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Christ.” The Greek word is a title, so “Messiah” is used here.
    reason: alternative_reading
  - marker: b
    text: “The disgrace of Messiah” may mean disgrace borne for Messiah, shared with God’s anointed one, or seen as fulfilled in Messiah.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the reproach of Messiah
  simplified_phrase: the disgrace of Messiah
  preserved_meaning: Public shame connected with Messiah remains central, while the exact relationship is left open.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: “Disgrace” is a listed lexical alternative and is clearer to many modern readers.
- pob_phrase: greater wealth than the treasures of Egypt
  simplified_phrase: worth more than Egypt’s treasures
  preserved_meaning: Moses valued Messiah’s disgrace above Egypt’s material riches.
  reasoning_layer_used: POB lexical decisions
  rationale: “Worth more” states the same comparison in ordinary English.
- pob_phrase: he was looking to the reward
  simplified_phrase: he kept looking ahead to the reward
  preserved_meaning: His attention remained fixed on the coming reward.
  reasoning_layer_used: POB lexical decision for ἀπέβλεπεν
  rationale: “Kept looking ahead” makes the verb’s ongoing orientation clear.
