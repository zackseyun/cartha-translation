translation:
  language: en
  text: By faith, Moses left Egypt.[a] He was not afraid of the king’s anger, because he remained steadfast as if he saw the One who is invisible.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may refer either to Moses fleeing Egypt or to his later departure with Israel; the wording does not identify which event is meant.
    reason: cross_reference
simplification_decisions:
- pob_phrase: By faith he left Egypt
  simplified_phrase: By faith, Moses left Egypt.
  preserved_meaning: Moses acted by faith when he departed from Egypt.
  reasoning_layer_used: Lexical decision and theological decision on the historical referent
  rationale: Naming Moses clarifies the pronoun without deciding which departure is meant.
- pob_phrase: not fearing the king’s anger
  simplified_phrase: He was not afraid of the king’s anger
  preserved_meaning: The king’s strong anger did not make Moses afraid.
  reasoning_layer_used: Lexical decisions for μὴ φοβηθεὶς and θυμός
  rationale: A direct clause replaces the less natural English participle.
- pob_phrase: for he endured as seeing the One who is invisible
  simplified_phrase: because he remained steadfast as if he saw the One who is invisible
  preserved_meaning: Moses persevered with a faith-based perception likened to seeing the invisible One.
  reasoning_layer_used: Lexical decisions for ἐκαρτέρησεν, ὡς ὁρῶν, and ἀόρατος
  rationale: The wording preserves both steadfast endurance and the paradoxical comparison with sight.
