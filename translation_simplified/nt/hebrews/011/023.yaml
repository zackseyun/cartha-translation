translation:
  language: en
  text: By faith, Moses’ parents hid him for three months after he was born because they saw that he was a beautiful[a] child and were not afraid of the king’s command.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “fine” or “exceptional,” echoing Exodus 2:2 and Acts 7:20.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Moses, when he was born, was hidden for three months by his parents
  simplified_phrase: Moses’ parents hid him for three months after he was born
  preserved_meaning: His parents concealed the newborn Moses for the same three-month period.
  reasoning_layer_used: Lexical decisions for γεννηθεὶς, ἐκρύβη, τρίμηνον, and ὑπὸ τῶν πατέρων αὐτοῦ
  rationale: The active sentence names the same agents and action more directly.
- pob_phrase: the king’s edict
  simplified_phrase: the king’s command
  preserved_meaning: The king had issued an official order that Moses’ parents refused to fear.
  reasoning_layer_used: Lexical decision for τὸ διάταγμα τοῦ βασιλέως
  rationale: “Command” is more familiar than “edict” while retaining its royal authority.
- pob_phrase: because they saw that the child was beautiful, and they were not afraid
  simplified_phrase: because they saw that he was a beautiful child and were not afraid
  preserved_meaning: Both their view of the child and their refusal to fear are given as reasons for hiding him under the theme of faith.
  reasoning_layer_used: Theological decision on the parents’ motivation and lexical decision for διότι
  rationale: Keeping “because” preserves the explicit causal link while the direct wording remains easy to follow.
translation_notes:
  risk_flags:
  - risk: Changing the passive construction to active shifts grammatical emphasis toward Moses’ parents.
    mitigation: The wording keeps Moses as the child hidden and retains “By faith” as the controlling theme.
