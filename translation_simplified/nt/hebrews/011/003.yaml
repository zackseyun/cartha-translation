translation:
  language: en
  text: By faith, we understand that God formed and ordered the ages—the whole created order through time—by his word.[a] As a result, what we see did not come into being from anything visible.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “The ages” may also be translated “the worlds” or “the universe.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the ages were framed by the word of God
  simplified_phrase: God formed and ordered the ages ... by his word
  preserved_meaning: God brought the ages into their ordered form through his spoken word.
  reasoning_layer_used: Lexical decisions for κατηρτίζω and ῥήματι θεοῦ
  rationale: The active wording and paired verbs make the ordered formation easier to understand without reducing it to material creation alone.
- pob_phrase: so that what is seen did not come into being from things that are visible
  simplified_phrase: As a result, what we see did not come into being from anything visible
  preserved_meaning: The visible order did not arise from visible things.
  reasoning_layer_used: Lexical decision for εἰς τὸ μὴ ... γεγονέναι and theological restraint on creation from non-visible realities
  rationale: The shorter sentence keeps the result relationship while avoiding an explicit claim of creation from nothing.
interpretive_expansions:
- pob_phrase: the ages
  rendering: the ages—the whole created order through time—
  claim: Here “the ages” refers broadly to creation as ordered across time.
  evidence:
