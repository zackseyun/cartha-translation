  text: By faith, Abraham offered Isaac as a sacrifice while he was being tested. He had received the promises and was offering up his one and only son.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also be translated “only son” or “unique son.” It emphasizes Isaac’s unique status as the promised heir, not that Abraham had no other biological son.
