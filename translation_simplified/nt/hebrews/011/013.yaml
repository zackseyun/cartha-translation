translation:
  language: en
  text: All these people continued in faith until they died. They did not receive the promises, but they saw them from far away and welcomed them.[a] They openly confessed that they were strangers and temporary residents on the earth.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “greeted them” or “embraced them.” The promises are pictured as something they could welcome from far away.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: All these died in faith
  simplified_phrase: All these people continued in faith until they died
  preserved_meaning: They remained in a posture of persevering faith at death.
  reasoning_layer_used: Lexical rationale for Κατὰ πίστιν and immediate context
  rationale: The rewrite explains the difficult phrase “died in faith” without changing faith into mere optimism.
- pob_phrase: not having received ... but having seen
  simplified_phrase: They did not receive ... but they saw
  preserved_meaning: They died before receiving the promises, though they perceived them from a distance.
  reasoning_layer_used: Greek participial sequence and POB lexical decisions
  rationale: Finite verbs turn the dense participial chain into direct modern sentences.
- pob_phrase: having confessed that they are strangers and exiles
  simplified_phrase: They openly confessed that they were strangers and temporary residents
  preserved_meaning: They publicly acknowledged that they lacked settled belonging on earth.
  reasoning_layer_used: POB lexical and theological decisions for ὁμολογήσαντες and παρεπίδημοί
  rationale: “Openly” preserves the public force of confession, while “temporary residents” restores the audited modern rendering.
