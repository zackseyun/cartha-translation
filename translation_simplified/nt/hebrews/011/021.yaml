translation:
  language: en
  text: Jacob acted in faith as he was dying. He blessed each of Joseph’s sons and worshiped God while leaning on the top of his staff.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew text of Genesis 47:31 says that he bowed in worship over the head of his bed, but the Greek text here says “staff.”
    reason: textual_variant
  - marker: b
    text: Or “worshiped toward the top of his staff.” The phrase probably describes Jacob’s posture, not what he worshiped.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: By faith Jacob, as he was dying
  simplified_phrase: Jacob acted in faith as he was dying
  preserved_meaning: Jacob’s actions were done through faith during his final moments.
  reasoning_layer_used: Lexical decision for πίστει and temporal reading of ἀποθνῄσκων.
  rationale: The opening modifier becomes a direct sentence while faith still governs the actions that follow.
- pob_phrase: blessed each of the sons of Joseph
  simplified_phrase: blessed each of Joseph’s sons
  preserved_meaning: Jacob gave an individual blessing to both sons.
  reasoning_layer_used: Lexical decision for the distributive phrase ἕκαστον τῶν υἱῶν Ἰωσήφ.
  rationale: The possessive form is more natural while “each” preserves the individual force.
- pob_phrase: and worshiped while leaning on the top of his staff
  simplified_phrase: and worshiped God while leaning on the top of his staff
  preserved_meaning: Jacob worshiped God in a leaning posture rather than worshiping the staff.
  reasoning_layer_used: Theological decision on the relation of worship to the staff.
  rationale: Naming God prevents the staff from being mistaken for the object of worship.
interpretive_expansions:
- pob_phrase: worshiped
  rendering: worshiped God
  claim: God was the object of Jacob’s worship.
  evidence:
  - The lexical rationale identifies the act as reverence toward God.
  - The theological decision explicitly distinguishes God from the staff as the object of worship.
  confidence: high
  alternatives_preserved:
  - The phrase may describe worship directed toward the top of the staff.
  - Genesis 47:31 in Hebrew reads “bed” rather than “staff.”
translation_notes:
  risk_flags:
  - risk: Splitting the verse could make faith seem detached from the blessing and worship.
    mitigation: The first sentence introduces both actions as what Jacob did in faith.
  - risk: The “staff” wording differs from the Hebrew text of Genesis 47:31.
    mitigation: Footnote a preserves the important textual difference.
