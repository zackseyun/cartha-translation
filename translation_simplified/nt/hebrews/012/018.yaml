translation:
  language: en
  text: For you have not come to something you can touch,[a] and to a blazing fire, darkness, gloom, and storm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “to a mountain you can touch.” The surrounding verses point to Mount Sinai, but the Greek does not use the word “mountain” here.
    reason: alternative_reading
