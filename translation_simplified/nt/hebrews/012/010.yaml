  preserved_meaning: God's discipline is purposeful and benefits his children.
  reasoning_layer_used: POB lexical and theological decisions for ὁ δὲ and ἐπὶ τὸ συμφέρον
  rationale: Naming God and repeating the verb makes the contrast clear when the verse stands alone.
