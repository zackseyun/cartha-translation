  preserved_meaning: The fathers acted according to their own limited judgment.
  reasoning_layer_used: POB lexical decision for κατὰ τὸ δοκοῦν αὐτοῖς
  rationale: The active wording expresses subjective judgment without declaring their judgment morally right.
- pob_phrase: but he does so for our benefit
