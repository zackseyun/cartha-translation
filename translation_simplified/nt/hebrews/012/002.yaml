translation:
  language: en
  text: Keep your attention fixed on Jesus.[a] He leads the way and brings faith to its intended completion. For the joy ahead of him, he endured the cross and refused to let its shame turn him aside. He has sat down at the right hand of God’s throne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also mean that Jesus leads and completes faithfulness, or that he begins and completes our faith.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: fixing our eyes on Jesus
  simplified_phrase: Keep your attention fixed on Jesus
  preserved_meaning: Believers must direct their sustained focus toward Jesus and away from distractions.
  reasoning_layer_used: Lexical decision for ἀφορῶντες
  rationale: The command-like wording makes the participle natural while retaining its focused force.
- pob_phrase: the pioneer and perfecter of faith
  simplified_phrase: He leads the way and brings faith to its intended completion
  preserved_meaning: Jesus both pioneers and brings faith to its intended goal without narrowing the compact phrase to his personal faith.
  reasoning_layer_used: Lexical and theological decisions for ἀρχηγός, τελειωτής, and πίστις
  rationale: The verbs explain the difficult titles while the wording and footnote preserve the documented ambiguity.
- pob_phrase: despising the shame
  simplified_phrase: refused to let its shame turn him aside
  preserved_meaning: Jesus treated the disgrace of crucifixion as unable to determine his course.
  reasoning_layer_used: Lexical rationale and footnote for αἰσχύνης καταφρονήσας
  rationale: The wording clarifies the phrase without suggesting that shame itself was good.
interpretive_expansions:
- pob_phrase: despising the shame
  rendering: refused to let its shame turn him aside
  claim: The shame of crucifixion did not control or deter Jesus.
  evidence:
  - The POB rationale says Jesus regarded the disgrace as not decisive.
  confidence: high
  alternatives_preserved:
  - disregarding the shame
translation_notes:
  risk_flags:
  - risk: “Leads the way” may suggest that Jesus is only an example rather than the pioneer.
    mitigation: Pairing it with bringing faith to completion preserves his decisive role from beginning to goal.
  - risk: The compact phrase about faith remains open to more than one interpretation.
    mitigation: The main text avoids selecting one sense, and the footnote preserves the leading alternatives.
