translation:
  language: en
  text: But you have come to Mount Zion, to the city of the living God—the heavenly Jerusalem—and to countless angels gathered in joyful celebration.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may instead list “countless angels” and “a joyful assembly” as separate parts of what you have come to.
