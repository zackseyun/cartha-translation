translation:
  language: en
  text: You have come to Jesus, the mediator of a new covenant. You have also come to the blood sprinkled in sacrifice,[b] which speaks better than Abel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “than Abel’s blood.” The Greek simply says “than Abel,” probably pointing to Abel’s blood crying out from the ground (Genesis 4:10).
    reason: alternative_reading
  - marker: b
    text: This is sacrificial blood applied by sprinkling, an image connected with establishing a covenant and cleansing.
    reason: cultural_note
