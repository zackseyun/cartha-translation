translation:
  language: en
  text: Keep making straight paths for your feet to follow.[a] Do this so that the lame will not be turned aside,[b] but will instead be healed.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This echoes Proverbs 4:26 and continues the picture of disciplined walking.
    reason: cross_reference
  - marker: b
    text: The Greek may also mean “put out of joint” or “dislocated,” continuing the bodily picture.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: and make straight paths for your feet
  simplified_phrase: Keep making straight paths for your feet to follow.
  preserved_meaning: Readers are commanded to keep preparing a properly directed course for their walk.
  reasoning_layer_used: Lexical decisions for ποιεῖτε, τροχιὰς, ὀρθὰς, and τοῖς ποσὶν ὑμῶν
  rationale: “Keep” conveys the ongoing command, while “to follow” makes the path image immediately clear.
- pob_phrase: so that the lame may not be turned aside, but rather be healed
  simplified_phrase: Do this so that the lame will not be turned aside, but will instead be healed.
  preserved_meaning: The command aims to prevent further harm and promote healing.
  reasoning_layer_used: Lexical decisions for τὸ χωλὸν, ἐκτραπῇ, ἰαθῇ, and μᾶλλον
  rationale: A new sentence clarifies the purpose and contrast without resolving who or what “the lame” represents.
translation_notes:
  risk_flags:
  - risk: Modern readers may take “the lame” as only a reference to physical disability.
    mitigation: The main text retains the source’s deliberate bodily ambiguity rather than narrowing it to physical or spiritual weakness.
  - risk: “Turned aside” may understate the verb’s possible medical sense.
    mitigation: The lexical footnote preserves the alternatives “put out of joint” and “dislocated.”
