translation:
  language: en
  text: and to the assembly of those who share the status of the firstborn[a] and are registered in the heavens[b]; to God, the judge of all; and to the spirits of righteous people who have been made perfect.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “the firstborn”; the plural describes God’s people as sharing firstborn status and inheritance.
    reason: simplification_note
  - marker: b
    text: Or “registered in heaven.” The Greek uses the plural “heavens.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the assembly of the firstborn
  simplified_phrase: the assembly of those who share the status of the firstborn
  preserved_meaning: The gathered people collectively possess firstborn standing and privilege.
  reasoning_layer_used: lexical and theological decisions
  rationale: This wording preserves the firstborn image while clarifying that the plural title describes the gathered people.
- pob_phrase: who are enrolled in the heavens
  simplified_phrase: and are registered in the heavens
  preserved_meaning: Their completed registration in the heavenly realm remains in effect.
  reasoning_layer_used: lexical decision
  rationale: “Registered” is common English and retains the image of an official record.
interpretive_expansions:
- pob_phrase: the firstborn
  rendering: those who share the status of the firstborn
  claim: The plural title collectively describes God’s people as sharing firstborn standing and inheritance.
  evidence:
  - The Greek term is plural and modifies “assembly.”
  - The POB theological decision links the collective designation with inheritance imagery.
  confidence: high
  alternatives_preserved:
  - the firstborn
  - firstborn ones
translation_notes:
  risk_flags:
  - risk: Explaining “the firstborn” as shared status may narrow the title’s resonance.
    mitigation: The footnote retains the literal expression and its inheritance association.
  - risk: The plural “heavens” sounds less idiomatic in modern English.
    mitigation: The text preserves the source-driven plural, while the footnote gives the natural singular alternative.
