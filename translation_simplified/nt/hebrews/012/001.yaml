translation:
  language: en
  text: Therefore, because such a vast cloud of witnesses surrounds us, let us throw off every burden that slows us down and the sin that so easily entangles us.[a] Let us run with endurance the race set before us.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the sin that clings so closely to us” or “the sin that easily traps us.” The Greek word may describe entangling, trapping, or close clinging.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: since we also have so great a cloud of witnesses surrounding us
  simplified_phrase: because such a vast cloud of witnesses surrounds us
  preserved_meaning: The faithful witnesses form a vast surrounding multitude that supports the exhortation.
  reasoning_layer_used: Lexical and theological decisions on νέφος μαρτύρων and περικείμενον ἡμῖν
  rationale: The active clause is easier to follow while retaining the cloud image and leaving the witnesses’ precise role open.
- pob_phrase: laying aside every weight
  simplified_phrase: let us throw off every burden that slows us down
  preserved_meaning: Runners must decisively remove anything that hinders their progress.
  reasoning_layer_used: Lexical decisions on ὄγκον πάντα and ἀποθέμενοι
  rationale: The wording makes the athletic force of the weight image immediately clear.
- pob_phrase: let us run with endurance the race set before us
  simplified_phrase: Let us run with endurance the race set before us.
  preserved_meaning: Believers are urged to persevere along their appointed course.
  reasoning_layer_used: Lexical decisions on ὑπομονή, τρέχωμεν, and ἀγών
  rationale: A separate sentence gives the main exhortation greater clarity without changing its terms.
translation_notes:
  risk_flags:
  - risk: Modern readers may assume the witnesses are only spectators watching the race.
    mitigation: The text retains “witnesses” without stating that they are actively watching.
