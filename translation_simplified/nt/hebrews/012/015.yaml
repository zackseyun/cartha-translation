translation:
  language: en
  text: Watch carefully so that no one falls short of God’s grace.[a] Do not let any root of bitterness spring up and cause trouble, defiling many people.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “fails to receive God’s grace”; the Greek can refer to not attaining what is offered as well as falling short of it.
    reason: lexical_alternative
  - marker: b
    text: “Root of bitterness” likely echoes Deuteronomy 29:18, where a poisonous root pictures covenant unfaithfulness spreading through the community.
    reason: cross_reference
simplification_decisions:
- pob_phrase: watching carefully lest anyone fall short of the grace of God
  simplified_phrase: Watch carefully so that no one falls short of God’s grace
  preserved_meaning: The community must remain vigilant that no one falls short of or fails to attain God’s grace.
  reasoning_layer_used: Lexical and theological decisions on ἐπισκοποῦντες and ὑστερέω
  rationale: The direct command and purpose clause are easier to follow while preserving the warning’s doctrinal neutrality.
- pob_phrase: lest any root of bitterness springing up cause trouble
  simplified_phrase: Do not let any root of bitterness spring up and cause trouble
  preserved_meaning: A harmful root may emerge and disrupt the community.
  reasoning_layer_used: Lexical decision and Deuteronomy 29:18 cross-reference
  rationale: The recast clause is natural English while retaining the root-and-growth image.
- pob_phrase: and through it many be defiled
  simplified_phrase: defiling many people
  preserved_meaning: The bitter root can spread serious moral or cultic defilement to many.
  reasoning_layer_used: Lexical and theological decisions on μιαίνω
  rationale: The active participial phrase clearly links the widespread defilement to the root without weakening its force.
translation_notes:
  risk_flags:
  - risk: Modern readers may take “root of bitterness” to mean only personal resentment.
    mitigation: The footnote preserves the likely Deuteronomy echo and its broader warning about communal unfaithfulness.
  - risk: “Falls short of God’s grace” may be read as settling debates about salvation or apostasy.
    mitigation: The wording remains neutral, and the footnote preserves the alternative sense “fails to receive.”
