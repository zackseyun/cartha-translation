simplification_decisions:
- pob_phrase: whose voice shook the earth then
  simplified_phrase: At that time, his voice shook the earth
  preserved_meaning: God’s voice shook the earth in the past event recalled by the context.
  reasoning_layer_used: lexical decisions and immediate context
  rationale: Reordering the clause makes the time contrast clear without weakening the shaking image.
- pob_phrase: but now he has promised, saying
  simplified_phrase: But now he has made this promise
  preserved_meaning: God’s promise remains valid and introduces the following quotation.
  reasoning_layer_used: lexical decision for ἐπήγγελται
  rationale: This removes an awkward quotation formula while retaining the force of a continuing promise.
- pob_phrase: Yet once more I will shake not only the earth but also the heaven
  simplified_phrase: Once more I will shake not only the earth but heaven as well
  preserved_meaning: God promises another shaking that will encompass both earth and heaven.
  reasoning_layer_used: lexical and theological decisions on cosmic scope
  rationale: Natural English preserves the emphatic repetition and the full cosmic contrast.
translation_notes:
  risk_flags:
