translation:
  language: en
  text: Make sure you do not refuse the one who is speaking. Those who refused the one who warned them on earth[a] did not escape. How much less will we escape if we turn away from the one who warns from heaven!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek can also mean “the one who gave them divine instruction.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: See to it that you do not refuse
  simplified_phrase: Make sure you do not refuse
  preserved_meaning: The opening remains a direct and urgent warning against refusal.
  reasoning_layer_used: Lexical decisions for Βλέπετε and μὴ παραιτήσησθε
  rationale: “Make sure” expresses the imperative naturally in common English.
- pob_phrase: For if those did not escape when they refused
  simplified_phrase: Those who refused ... did not escape
  preserved_meaning: The earlier hearers did not escape the consequences of refusing the warning.
  reasoning_layer_used: Lexical decisions for ἐξέφυγον and παραιτησάμενοι
  rationale: The direct statement removes a dense conditional clause without changing its point.
- pob_phrase: much less will we if we turn away
  simplified_phrase: How much less will we escape if we turn away
  preserved_meaning: The conclusion retains the explicit lesser-to-greater force of the earth-heaven comparison.
  reasoning_layer_used: Lexical decision for πολὺ μᾶλλον and theological decision on the implied apodosis
  rationale: The wording clearly states that rejecting the heavenly warning is the graver case.
translation_notes:
  risk_flags:
