translation:
  language: en
  text: The first covenant[a] also had rules for worship and a sanctuary here on earth.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the first arrangement”; the context most likely means the first covenant.
    reason: alternative_reading
  - marker: b
    text: The sanctuary belonged to this world, in contrast to the heavenly realities discussed later in the chapter.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Even the first covenant
  simplified_phrase: The first covenant also
  preserved_meaning: The first covenant remains the implied referent, with the mild emphatic connection preserved by “also.”
  reasoning_layer_used: Lexical and theological decisions on ἡ πρώτη and μὲν οὖν
  rationale: This uses ordinary English order while keeping the contextual identification and discourse force.
- pob_phrase: regulations for worship
  simplified_phrase: rules for worship
  preserved_meaning: The covenant included prescribed requirements governing worship.
  reasoning_layer_used: Lexical decision on δικαιώματα λατρείας
  rationale: “Rules” is more familiar than “regulations” without weakening the legal-cultic sense.
- pob_phrase: an earthly sanctuary
  simplified_phrase: a sanctuary here on earth
  preserved_meaning: The sacred place was earthly rather than heavenly, not morally corrupt.
  reasoning_layer_used: Lexical and theological decisions on τό τε ἅγιον κοσμικόν
  rationale: The phrase states the location contrast directly while retaining the key term “sanctuary.”
