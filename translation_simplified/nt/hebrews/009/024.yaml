translation:
  language: en
  text: For the Messiah[a] did not enter holy places built by human hands. Those places are copies[b] of the true heavenly realities. Instead, he entered heaven itself and now appears in God’s presence on our behalf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Christ.” The Greek title means “Messiah.”
    reason: alternative_reading
  - marker: b
    text: Or “representations” or “counterparts”; the earthly holy places correspond to the heavenly realities.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: holy places made by hands
  simplified_phrase: holy places built by human hands
  preserved_meaning: The holy places were humanly constructed, unlike heaven itself.
  reasoning_layer_used: Lexical decision for χειροποίητα
  rationale: “Built by human hands” keeps the source image while making its meaning immediate.
- pob_phrase: copies of the true things
  simplified_phrase: Those places are copies of the true heavenly realities
  preserved_meaning: The earthly holy places correspond to ultimate realities in heaven.
  reasoning_layer_used: Lexical decisions for ἀντίτυπα and τῶν ἀληθινῶν
  rationale: A separate sentence clarifies what the copies are and what they reflect.
- pob_phrase: but into heaven itself, now to appear in the presence of God on our behalf
  simplified_phrase: Instead, he entered heaven itself and now appears in God’s presence on our behalf
  preserved_meaning: The Messiah entered the heavenly reality and presently appears before God as our representative.
  reasoning_layer_used: Lexical and theological decisions for αὐτὸν τὸν οὐρανόν, νῦν, and ὑπὲρ ἡμῶν
  rationale: The coordinated clause uses ordinary English while retaining the contrast, present significance, and representative force.
interpretive_expansions:
- pob_phrase: the true things
  rendering: the true heavenly realities
  claim: The true realities contrasted with the earthly holy places are heavenly.
  evidence:
  - The immediate contrast is between human-made holy places and heaven itself.
  - The POB lexical rationale identifies these as ultimate heavenly realities.
  confidence: high
  alternatives_preserved:
  - the true things
  - the true realities
translation_notes:
  risk_flags:
  - risk: “Copies” may suggest exact duplicates rather than corresponding representations.
    mitigation: Footnote b preserves the broader senses “representations” and “counterparts.”
  - risk: Changing the purpose infinitive to a coordinated clause may make the purpose relationship less explicit.
    mitigation: The sequence still presents his appearance before God as the outcome of entering heaven.
