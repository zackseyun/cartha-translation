translation:
  language: en
  text: After Moses had told all the people every command of the law, he took the blood of calves[a], along with water, scarlet wool, and hyssop. Then he sprinkled both the scroll itself and all the people.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “young bulls.” The Greek word can refer to calves or young bulls in a sacrificial setting.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: when every commandment according to the law had been spoken by Moses to all the people
  simplified_phrase: After Moses had told all the people every command of the law
  preserved_meaning: Moses communicated every individual command of the law to the entire people before the ritual action.
  reasoning_layer_used: Lexical decisions for the temporal construction, every commandment, and all the people
  rationale: Active wording and ordinary clause order make the sequence easier to follow.
- pob_phrase: he took the blood of the calves with water and scarlet wool and hyssop
  simplified_phrase: he took the blood of calves, along with water, scarlet wool, and hyssop
  preserved_meaning: Moses took calf blood together with the other named ritual materials.
  reasoning_layer_used: Lexical decisions for μόσχων and μετά, with the theological decision not to expand the Exodus background
  rationale: “Along with” clearly groups the materials without adding ritual details.
- pob_phrase: and sprinkled both the scroll itself and all the people
  simplified_phrase: Then he sprinkled both the scroll itself and all the people.
  preserved_meaning: The scroll and the whole people were both objects of the sprinkling.
  reasoning_layer_used: Lexical decisions for βιβλίον, τε ... καί, πάντα τὸν λαόν, and ἐράντισεν
  rationale: A new sentence reduces clause load without specifying the means of sprinkling.
