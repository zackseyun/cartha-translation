- pob_phrase: which is a parable
  simplified_phrase: This is a symbol
  preserved_meaning: The preceding sanctuary arrangement is a figurative correspondence for the present time.
  reasoning_layer_used: Lexical and theological decisions for ἥτις and παραβολή.
  rationale: “Symbol” conveys the contextual sense without suggesting a short teaching story.
- pob_phrase: according to which
  simplified_phrase: Under this arrangement
  preserved_meaning: The gifts and sacrifices are offered within the sanctuary system just described.
  reasoning_layer_used: Lexical decision for καθ’ ἣν.
  rationale: The ordinary wording makes the governing relationship clear.
- pob_phrase: are not able to perfect the worshiper with respect to conscience
  simplified_phrase: cannot make the worshiper perfect before God in regard to conscience
  preserved_meaning: The offerings cannot bring the worshiper to the intended completion before God in the sphere of conscience.
  reasoning_layer_used: Lexical decisions for μὴ δυνάμεναι, τελειῶσαι, and κατὰ συνείδησιν.
  rationale: The revision states the inability naturally while keeping perfection and its conscience limitation distinct.
