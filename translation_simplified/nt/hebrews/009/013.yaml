translation:
  language: en
  text: For if the blood of goats and bulls and the ashes from a heifer[a], sprinkled on those who are ritually unclean, make them ritually holy for outward purification,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A heifer is a young female cow; this refers to the purification rite in Numbers 19.
    reason: cultural_note
simplification_decisions:
- pob_phrase: the ashes of a heifer that sprinkle those who have been defiled
  simplified_phrase: the ashes from a heifer, sprinkled on those who are ritually unclean
  preserved_meaning: The heifer’s ashes are applied by sprinkling to people made unclean under the ritual law.
  reasoning_layer_used: Lexical decisions for ῥαντίζουσα and τοὺς κεκοινωμένους
  rationale: The passive wording clarifies the action, while “ritually unclean” identifies the kind of defilement.
- pob_phrase: sanctify for the purification of the flesh
  simplified_phrase: make them ritually holy for outward purification
  preserved_meaning: The rites sanctify people in the outward, ceremonial sphere rather than transforming them inwardly.
  reasoning_layer_used: Theological decisions on ἁγιάζει and σάρξ
  rationale: This keeps sanctification related to outward purification instead of presenting them as separate results.
interpretive_expansions:
- pob_phrase: those who have been defiled
  rendering: those who are ritually unclean
  claim: The defilement is ritual rather than general moral defilement.
  evidence:
  - The lexical rationale identifies κοινόω here as ritual defilement.
  - Numbers 19 supplies the purification setting.
  confidence: high
  alternatives_preserved:
  - those who have been defiled
  - those who have become unclean
- pob_phrase: sanctify for the purification of the flesh
  rendering: make them ritually holy for outward purification
  claim: The sanctification concerns outward purity under the old covenant rites.
  evidence:
  - The theological decision contrasts this outward cleansing with cleansing of the conscience in verse 14.
  - The lexical rationale gives σάρξ an external bodily sense here.
  confidence: high
  alternatives_preserved:
  - sanctify for bodily cleansing
  - make them holy for outward purification
translation_notes:
  risk_flags:
  - risk: “Ritually holy” is less familiar than “sanctify.”
    mitigation: It preserves the holiness concept while limiting it to the ceremonial sphere.
  - risk: The passive “sprinkled on” recasts the Greek participle.
    mitigation: It preserves the ritual action and prevents confusion about who does the sprinkling.
