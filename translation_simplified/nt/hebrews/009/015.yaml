translation:
  language: en
  text: For this reason, he is the mediator of a new covenant.[a] He serves as mediator so that those who have been called may receive the promised eternal inheritance, since his death paid the cost to free people from the sins they committed under the first covenant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word can also mean “testament” or “will,” an overlap developed in verses 16–17; here “covenant” best fits the contrast with the first covenant.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: since a death has occurred for the redemption
  simplified_phrase: since his death paid the cost to free people
  preserved_meaning: His death secures deliverance at a cost and grounds the promised outcome.
  reasoning_layer_used: lexical decision for ἀπολύτρωσιν and immediate context
  rationale: This explains redemption while preserving both its cost and its subordinate role in the sentence.
- pob_phrase: the transgressions committed under the first covenant
  simplified_phrase: the sins they committed under the first covenant
  preserved_meaning: People violated God’s requirements within the first covenant.
  reasoning_layer_used: lexical decision for παραβάσεων
  rationale: “Sins they committed” expresses the violation in familiar language.
- pob_phrase: the promise of the eternal inheritance
  simplified_phrase: the promised eternal inheritance
  preserved_meaning: Those called receive the eternal inheritance that was promised.
  reasoning_layer_used: lexical decisions for ἐπαγγελίαν and κληρονομίας
  rationale: The recast removes a difficult noun chain without changing the promise.
