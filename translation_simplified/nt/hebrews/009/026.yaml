translation:
  language: en
  text: If that were so, he would have had to suffer many times since the world was founded. But instead, he has appeared once for all, when the ages reached their fulfillment,[a] to do away with sin by offering himself as the sacrifice.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “at the end of the ages.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Otherwise
  simplified_phrase: If that were so
  preserved_meaning: This introduces the hypothetical consequence of repeated offerings.
  reasoning_layer_used: Lexical decision for ἐπεὶ and immediate argument
  rationale: The conditional wording makes the logical connection easier to follow.
- pob_phrase: at the consummation of the ages
  simplified_phrase: when the ages reached their fulfillment
  preserved_meaning: Christ appeared at the climactic fulfillment of the ages.
  reasoning_layer_used: Lexical decision for συντέλεια and αἰῶνες
  rationale: This replaces an academic term while retaining culmination and the plural ages.
- pob_phrase: to put away sin through the sacrifice of himself
  simplified_phrase: to do away with sin by offering himself as the sacrifice
  preserved_meaning: Christ decisively dealt with sin through his self-offering.
  reasoning_layer_used: Lexical and theological decisions for ἀθέτησις, ἁμαρτίας, and θυσίας αὐτοῦ
  rationale: The active wording clearly identifies Christ himself as the offered sacrifice.
interpretive_expansions:
- pob_phrase: Otherwise
  rendering: If that were so
  claim: The clause describes what would follow if Christ needed to offer himself repeatedly.
  evidence:
  - The POB rationale identifies a conditional-like hypothetical necessity.
  - The contrast between “many times” and “once for all” supplies the condition.
  confidence: high
  alternatives_preserved:
  - Otherwise
  - For then
translation_notes:
  risk_flags:
  - risk: “Do away with sin” could be heard as claiming that sin no longer exists.
    mitigation: The sacrificial context frames the phrase as the decisive effect of Christ’s offering.
  - risk: “When the ages reached their fulfillment” may sound wholly past rather than eschatological.
    mitigation: The footnote preserves the recognized alternative “at the end of the ages.”
