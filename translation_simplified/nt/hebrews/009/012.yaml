translation:
  language: en
  text: He entered the holy places[a] once for all, not through the blood of goats and calves, but through his own blood, having secured redemption that lasts forever.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the sanctuary.” The Greek says “the holy places” and does not specifically say “the Most Holy Place.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: and not through the blood of goats and calves, but through his own blood, he entered once for all
  simplified_phrase: He entered the holy places once for all, not through the blood of goats and calves, but through his own blood
  preserved_meaning: Christ’s single, decisive entry was through his own blood rather than animal blood.
  reasoning_layer_used: Lexical decisions for διά and ἐφάπαξ; theological decision on Christ’s entry
  rationale: Reordering the clauses makes the main action clear while preserving the repeated “through” and the finality of “once for all.”
- pob_phrase: having obtained
  simplified_phrase: having secured
  preserved_meaning: Christ obtained redemption in connection with his decisive entry.
  reasoning_layer_used: Lexical decision for εὑράμενος
  rationale: “Secured” is clearer common English while retaining the participial relationship without adding an explicit causal claim.
- pob_phrase: eternal redemption
  simplified_phrase: redemption that lasts forever
  preserved_meaning: The redemption Christ secured has permanent effect.
  reasoning_layer_used: Lexical decision for αἰωνίαν λύτρωσιν
  rationale: The wording explains “eternal” directly without weakening redemption’s lasting force.
translation_notes:
  risk_flags:
  - risk: “Holy places” may sound like several unrelated locations.
    mitigation: The footnote gives “the sanctuary” while preserving the Greek plural and its ambiguity.
  - risk: “Through his own blood” could suggest that Christ literally carried blood.
    mitigation: The wording preserves POB’s instrumental contrast without specifying a heavenly mechanism.
