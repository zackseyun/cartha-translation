translation:
  language: en
  text: For a covenant is valid only when death is involved.[a] It never takes effect while the one who made it is still alive.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek phrase may refer either to dead persons or to death involved in making a covenant binding.
    reason: lexical_alternative
  - marker: b
    text: Or, “A will becomes valid only after death. It never takes effect while the person who made it is still alive.” The Greek word can mean either “covenant” or “will.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: is valid over dead ones
  simplified_phrase: is valid only when death is involved
  preserved_meaning: Death is necessary for binding force, without deciding whether this concerns dead persons or covenant-ratifying death.
  reasoning_layer_used: Lexical decision for ἐπὶ νεκροῖς and theological decision to preserve ambiguity
  rationale: This wording explains the compressed phrase without reducing it to a merely temporal event.
- pob_phrase: since it is never in force
  simplified_phrase: It never takes effect
  preserved_meaning: The covenant is not operative during the maker’s life.
  reasoning_layer_used: Lexical decisions for μήποτε and ἰσχύει
  rationale: “Takes effect” communicates operative force in common English.
interpretive_expansions:
- pob_phrase: over dead ones
  rendering: when death is involved
  claim: Death is required in some relevant relation before the covenant has binding force.
  evidence:
