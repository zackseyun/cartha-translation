translation:
  language: en
  text: where your ancestors put me to the test[a] and saw what I did.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek phrase is difficult and may also mean “tested me by testing” or “tested me in a trial.”
    reason: lexical_alternative
  - marker: b
    text: Some translations say “though they saw what I did,” but the Greek simply says “and saw.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: your fathers
  simplified_phrase: your ancestors
  preserved_meaning: The earlier generations of the hearers are still in view.
  reasoning_layer_used: POB lexical alternatives
  rationale: “Ancestors” communicates the historical relationship more clearly to modern readers.
- pob_phrase: tested me by trial
  simplified_phrase: put me to the test
  preserved_meaning: They provocatively tested God in the wilderness.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The idiomatic phrase keeps God as the understood object while the footnote preserves the difficult construction.
- pob_phrase: saw my works
  simplified_phrase: saw what I did
  preserved_meaning: They witnessed God’s acts in the wilderness.
  reasoning_layer_used: POB lexical alternatives
  rationale: “What I did” expresses the concrete sense of “works” in ordinary English.
translation_notes:
  risk_flags:
  - risk: “Put me to the test” compresses the repeated testing language of the Greek phrase.
    mitigation: Footnote a preserves its manner-or-means ambiguity.
  - risk: Readers may expect a concessive link between testing God and seeing his acts.
    mitigation: Footnote b preserves that alternative while retaining the Greek coordination.
