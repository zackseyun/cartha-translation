simplification_decisions:
- pob_phrase: Moses indeed
  simplified_phrase: Moses, for his part
  preserved_meaning: Moses begins one side of a contrast completed in the next verse.
  reasoning_layer_used: lexical decision for μὲν and immediate context
  rationale: “For his part” signals the coming contrast more naturally than “indeed.”
- pob_phrase: in all his house
  simplified_phrase: throughout God’s house
  preserved_meaning: Moses served faithfully in the whole sphere represented by God’s house.
  reasoning_layer_used: lexical and theological decisions on the house metaphor
  rationale: “Throughout” clarifies scope while the house image remains intact.
- pob_phrase: for a testimony of the things that would be spoken later
  simplified_phrase: His service testified to what God would say later
  preserved_meaning: Moses’ faithful service pointed forward as testimony to later divine speech.
  reasoning_layer_used: lexical decision for εἰς μαρτύριον and τῶν λαληθησομένων
  rationale: A direct second sentence replaces the dense abstract phrase without losing its forward-looking testimony.
interpretive_expansions:
- pob_phrase: his house
  rendering: God’s house
  claim: The house belongs to God, and Moses serves within it.
  evidence:
  - Hebrews 3 develops the house as the sphere of God’s people.
  - The POB theological decision identifies it as God’s household.
  confidence: high
  alternatives_preserved:
  - God’s whole household
- pob_phrase: the things that would be spoken later
  rendering: what God would say later
  claim: The later speech is divine revelation.
  evidence:
  - The POB rationale explicitly identifies later divine revelation.
  - The future passive form points forward to things yet to be spoken.
  confidence: high
  alternatives_preserved:
  - what would be spoken later
translation_notes:
