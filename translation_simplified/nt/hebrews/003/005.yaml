translation:
  language: en
  text: Moses, for his part, was faithful as a servant throughout God’s house.[a] His service testified to what God would say later.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “throughout God’s whole household.” Hebrews continues the image of a house in the following verses.
