    mitigation: “Deeply” preserves the strong force without choosing the more extreme alternative “loathed.”
  - risk: The plural “hearts” does not display the Greek collective singular.
    mitigation: The natural English plural retains the shared pattern of inward wandering without individualizing the judgment.
