simplification_decisions:
- pob_phrase: For forty years, therefore
  simplified_phrase: So ... for forty years
  preserved_meaning: God’s displeasure follows from the preceding rebellion and lasts forty years.
  reasoning_layer_used: Lexical decisions for τεσσεράκοντα ἔτη and διὸ
  rationale: The reordered phrase states the result and duration in more natural English.
- pob_phrase: I was provoked with this generation
  simplified_phrase: I was deeply displeased with this generation
  preserved_meaning: God responds to the generation’s persistent unbelief with strong covenantal displeasure.
  reasoning_layer_used: Lexical and theological decisions for προσώχθισα
  rationale: “Deeply displeased” is clearer than “provoked” without narrowing the response to anger or intensifying it to loathing.
- pob_phrase: and said
  simplified_phrase: I said
  preserved_meaning: God directly states his judgment of the generation.
  reasoning_layer_used: Lexical decision for καὶ εἶπον
  rationale: A new sentence with an explicit subject makes the quotation easier to follow.
translation_notes:
  risk_flags:
