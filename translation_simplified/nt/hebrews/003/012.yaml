translation:
  language: en
  text: Watch out, brothers.[a] Make sure that none of you develops an evil, unbelieving heart in turning away from the living God.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “brothers” can address both men and women who are fellow believers.
    reason: lexical_alternative
  - marker: b
    text: Or “an evil, faithless heart”; or “in falling away from” or “in departing from” the living God.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: lest there be in any of you
  simplified_phrase: Make sure that none of you develops
  preserved_meaning: The warning concerns this condition arising in any member of the community.
  reasoning_layer_used: Lexical rationale for μήποτε and ἔσται ἔν τινι ὑμῶν
  rationale: The direct wording replaces the formal construction while preserving the possible danger.
- pob_phrase: an evil heart of unbelief
  simplified_phrase: an evil, unbelieving heart
  preserved_meaning: The heart remains morally evil and characterized by failure to believe.
  reasoning_layer_used: Lexical and theological decision for ἀπιστίας
  rationale: The adjective form is easier to understand without changing the chosen sense of unbelief.
- pob_phrase: in turning away from the living God
  simplified_phrase: in turning away from the living God
  preserved_meaning: Turning away remains broadly linked to the evil, unbelieving heart without implying a sequence.
  reasoning_layer_used: Lexical and theological decisions for ἐν τῷ ἀποστῆναι
  rationale: Retaining “in” preserves the deliberately open circumstantial connection and avoids technical apostasy language.
translation_notes:
  risk_flags:
  - risk: “Develops” presents the condition as arising, though the Greek construction does not specify a process.
    mitigation: The wording follows the POB rationale that the condition may arise in any hearer without stating how it develops.
  - risk: “In turning away” remains less idiomatic than a coordinated English clause.
    mitigation: The phrasing preserves the source’s broad relationship rather than implying two sequential actions.
