translation:
  language: en
  text: He was faithful to the one who appointed him,[a] just as Moses was faithful in his whole house.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the one who made him.” Here the Greek most likely means that God appointed or commissioned him.
    reason: lexical_alternative
  - marker: b
    text: Some manuscripts omit “whole.” “His house” likely means God’s house, echoing Numbers 12:7, though the pronoun remains open.
    reason: textual_variant
simplification_decisions:
- pob_phrase: who was faithful
  simplified_phrase: He was faithful
  preserved_meaning: Jesus remained the faithful person described from the preceding verse.
  reasoning_layer_used: POB lexical decision and immediate context
  rationale: A direct sentence is easier to read than a dependent relative clause.
- pob_phrase: just as Moses also was
  simplified_phrase: just as Moses was faithful
  preserved_meaning: Jesus’ faithfulness is explicitly compared with Moses’ faithfulness.
  reasoning_layer_used: POB lexical decision for ὡς καὶ
  rationale: Repeating “faithful” makes the comparison clear in ordinary English.
- pob_phrase: in all his house
  simplified_phrase: in his whole house
  preserved_meaning: The full scope of the house is retained along with the biblical house image.
  reasoning_layer_used: POB lexical and theological decisions for ἐν τῷ οἴκῳ αὐτοῦ
  rationale: Natural word order improves readability without replacing the important house image.
