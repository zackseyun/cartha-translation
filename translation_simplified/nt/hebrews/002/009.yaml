translation:
  language: en
  text: But we see Jesus, who for a little while was made lower than the angels. Because he suffered and died, he is crowned with glory and honor, so that by God’s grace he might taste death for everyone.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some manuscripts read “apart from God” instead of “by God’s grace.”
    reason: textual_variant
simplification_decisions:
- pob_phrase: who was made lower than the angels for a little while
  simplified_phrase: who for a little while was made lower than the angels
  preserved_meaning: Jesus held a lower position than the angels only for a limited time.
  reasoning_layer_used: POB lexical decision for βραχύ τι and ἠλαττωμένον
  rationale: Moving the time phrase earlier makes its connection to Jesus’ temporary lowering immediately clear.
- pob_phrase: because of the suffering of death
  simplified_phrase: Because he suffered and died
  preserved_meaning: Jesus was crowned because he underwent the suffering that ended in death.
  reasoning_layer_used: POB lexical decision for διὰ τὸ πάθημα τοῦ θανάτου
  rationale: The verbal wording states the event in ordinary English while retaining both suffering and death.
- pob_phrase: might taste death for everyone
  simplified_phrase: might taste death for everyone
  preserved_meaning: Jesus experienced death on behalf of every person.
  reasoning_layer_used: POB lexical decisions for γεύσηται θανάτου and ὑπὲρ παντός
  rationale: The understandable source-language image is retained because it carries more force than a flat paraphrase.
