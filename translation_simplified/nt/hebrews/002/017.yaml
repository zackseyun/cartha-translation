translation:
  language: en
  text: Therefore, he had to become like his brothers in every way. He did this so that he could become a merciful and faithful high priest in matters relating to God and make atonement for the people’s sins.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word translated “brothers” can include brothers and sisters in the wider family of believers.
    reason: lexical_alternative
  - marker: b
    text: “Make atonement for” can also be expressed as “propitiate” or “expiate.”
    reason: alternative_reading
