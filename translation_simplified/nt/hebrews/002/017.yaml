  rationale: “In every way” expresses the same full scope in more common English.
- pob_phrase: so that he might become
  simplified_phrase: He did this so that he could become
  preserved_meaning: Becoming like his brothers was necessary for his priestly role.
  reasoning_layer_used: lexical decision for ἵνα and immediate context
  rationale: A new sentence makes the purpose relationship easier to follow.
- pob_phrase: in the things pertaining to God
  simplified_phrase: in matters relating to God
  preserved_meaning: His high-priestly role concerns matters before God.
  reasoning_layer_used: lexical rationale for τὰ πρὸς τὸν θεόν
  rationale: This wording is clearer while preserving the phrase’s broad priestly sphere.
