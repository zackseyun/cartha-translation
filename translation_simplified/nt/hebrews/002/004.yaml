translation:
  language: en
  text: At the same time, God also confirmed that their message was true. He did this with signs and wonders, many kinds of miracles, and different distributions of the Holy Spirit, as God willed.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek can also mean “apportionments” or “shares” of the Holy Spirit; it does not explicitly say “gifts.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: while God also bore witness
  simplified_phrase: At the same time, God also confirmed that their message was true
  preserved_meaning: God added his testimony while the earlier witnesses delivered the message.
  reasoning_layer_used: POB lexical decision and immediate context
  rationale: This explains the witness image while preserving its evidentiary force.
- pob_phrase: various miracles
  simplified_phrase: many kinds of miracles
  preserved_meaning: God's testimony included diverse miraculous displays of power.
  reasoning_layer_used: POB lexical decision for ποικίλαις δυνάμεσιν
  rationale: “Many kinds” expresses variety in common English without weakening “miracles.”
- pob_phrase: distributions of the Holy Spirit
  simplified_phrase: different distributions of the Holy Spirit
  preserved_meaning: God's testimony included plural apportionments connected with the Holy Spirit without specifying gifts or dividing the Spirit.
  reasoning_layer_used: POB lexical decision for μερισμοῖς and grounding review
  rationale: This retains the source-level wording and avoids presenting the Spirit as a substance divided into shares.
