translation:
  language: en
  text: “You put everything under his feet.” When he put everything under him,[a] he left nothing outside his authority. Yet for now, we do not see everything under him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The words “his” and “him” echo Psalm 8. They may refer to humanity in the psalm and to Jesus as Hebrews applies it.
    reason: cross_reference
simplification_decisions:
- pob_phrase: You subjected all things under his feet
  simplified_phrase: You put everything under his feet
  preserved_meaning: Everything is placed under his dominion, while the biblical image of being under his feet remains.
  reasoning_layer_used: Lexical decisions for πάντα, ὑπέταξας, and ὑποκάτω τῶν ποδῶν αὐτοῦ
  rationale: Common wording makes the comprehensive rule clear without removing the Psalm 8 image.
- pob_phrase: For in subjecting all things to him
  simplified_phrase: When he put everything under him
  preserved_meaning: The act of bringing everything under him introduces the conclusion that nothing is excluded.
  reasoning_layer_used: Lexical decision for ἐν τῷ ... ὑποτάξαι and POB footnote b
  rationale: The documented temporal rendering is more natural in common English.
- pob_phrase: But now we do not yet see
  simplified_phrase: Yet for now, we do not see
  preserved_meaning: Present experience does not yet display the complete fulfillment.
  reasoning_layer_used: Lexical decisions for νῦν δὲ and οὔπω ὁρῶμεν
  rationale: The reordered phrase states the present contrast in ordinary English.
interpretive_expansions:
- pob_phrase: nothing not subjected to him
  rendering: nothing outside his authority
  claim: Being subjected to him means being under his authority.
  evidence:
  - The lexical rationale identifies subordination as the governing meaning.
  - The phrase “under his feet” is an established image of dominion.
  confidence: high
  alternatives_preserved:
  - nothing not subjected to him
  - nothing outside his rule
translation_notes:
  risk_flags:
  - risk: The pronouns may be read as referring only to Jesus or only to humanity.
    mitigation: The footnote preserves the Psalm 8 and christological referents without resolving the tension.
  - risk: “Put” can sound weaker than “subjected” when read apart from the image.
    mitigation: “Under his feet” and “outside his authority” preserve the force of dominion.
