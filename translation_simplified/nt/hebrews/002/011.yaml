translation:
  language: en
  text: The one who makes people holy and those who are being made holy all come from one.[a] That is why he is not ashamed to call them his brothers.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “from one Father,” “from one source,” or “from one ancestor.” The Greek does not identify who or what “one” refers to.
    reason: alternative_reading
  - marker: b
    text: Here “brothers” may include the whole family of believers, both men and women.
    reason: lexical_alternative
