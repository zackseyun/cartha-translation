  rationale: The accepted alternative explains the theological term in common English.
- pob_phrase: those who are being sanctified
  simplified_phrase: those who are being made holy
  preserved_meaning: They are undergoing an ongoing work of being made holy.
  reasoning_layer_used: Lexical decision for οἱ ἁγιαζόμενοι
  rationale: The passive and ongoing force remain clear without using specialized vocabulary.
- pob_phrase: are all from one; for this reason
  simplified_phrase: all come from one. That is why
  preserved_meaning: Their shared origin is the reason he calls them brothers.
  reasoning_layer_used: Lexical decisions for ἐξ ἑνὸς and δι’ ἣν αἰτίαν
  rationale: Two shorter sentences clarify the connection while leaving “one” undefined.
