translation:
  language: en
  text: Therefore, since the children have flesh and blood, he himself also took on flesh and blood like theirs. He did this so that by his death he might make powerless the one who has the power of death—that is, the devil.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “destroy.” The word means to render powerless or ineffective, not necessarily to annihilate.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: the children share in flesh and blood
  simplified_phrase: the children have flesh and blood
  preserved_meaning: The children possess ordinary human bodily nature.
  reasoning_layer_used: POB lexical decision on αἵματος καὶ σαρκός
  rationale: “Have” expresses human participation more directly while retaining the concrete image.
- pob_phrase: he himself likewise partook of the same things
  simplified_phrase: he himself also took on flesh and blood like theirs
  preserved_meaning: Christ truly participated in humanity while remaining distinct from the children.
  reasoning_layer_used: POB theological decision on Christ’s participation in human nature
  rationale: The wording replaces “partook” with common English while preserving both real participation and likeness.
- pob_phrase: might nullify
  simplified_phrase: might make powerless
  preserved_meaning: Christ deprives the devil of effective power without implying annihilation.
  reasoning_layer_used: POB lexical and theological decisions on καταργήσῃ
  rationale: “Make powerless” states the intended sense more clearly than “nullify.”
interpretive_expansions:
- pob_phrase: through death
  rendering: by his death
  claim: The death used to defeat the devil is Christ’s own death.
  evidence:
