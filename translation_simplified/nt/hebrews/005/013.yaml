translation:
  language: en
  text: Everyone who feeds on milk is inexperienced in the message of righteousness,[a][b] because he is an infant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also mean “the message about righteousness.”
    reason: lexical_alternative
  - marker: b
    text: Or “justice” instead of “righteousness.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: partakes of milk
  simplified_phrase: feeds on milk
  preserved_meaning: The person is pictured as consuming milk, a metaphor for spiritual immaturity.
  reasoning_layer_used: POB lexical decision for ὁ μετέχων and γάλακτος
  rationale: “Feeds on” expresses the image in ordinary English without implying that milk is the person’s only food.
- pob_phrase: unskilled in the word of righteousness
  simplified_phrase: inexperienced in the message of righteousness
  preserved_meaning: The person lacks proficiency in teaching concerned with righteousness.
  reasoning_layer_used: POB lexical decisions for ἄπειρος and λόγου δικαιοσύνης
  rationale: “Inexperienced” and “message” are clearer while the footnote preserves the compact phrase’s ambiguity.
interpretive_expansions:
- pob_phrase: the word of righteousness
  rendering: the message of righteousness
  claim: “Word” refers here to a message or teaching rather than to a single spoken term.
  evidence:
  - The POB lexical rationale explicitly says that “word” can denote a message or teaching.
  - The immediate context contrasts elementary teaching with mature instruction.
  confidence: high
  alternatives_preserved:
  - the message about righteousness
translation_notes:
  risk_flags:
