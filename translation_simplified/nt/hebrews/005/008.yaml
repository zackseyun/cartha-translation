translation:
  language: en
  text: He was a Son,[a] yet he learned obedience through what he suffered.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “He was the Son.” Greek simply says “Son,” so either wording is possible in English.
    reason: alternative_reading
  - marker: b
    text: This means that he learned obedience by living through suffering, not that he had previously been disobedient.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Although he was a Son
  simplified_phrase: He was a Son, yet
  preserved_meaning: His status as Son stands in striking contrast with his learning obedience.
  reasoning_layer_used: Lexical decision for καίπερ and theological decision on Christ’s sonship
  rationale: A main clause followed by “yet” makes the contrast easier to follow without weakening it.
- pob_phrase: from what he suffered
  simplified_phrase: through what he suffered
  preserved_meaning: His actual suffering was the means of his experiential learning.
  reasoning_layer_used: Lexical decisions for ἀφ’ ὧν and ἔπαθεν
  rationale: “Through” expresses the connection in more natural modern English.
translation_notes:
  risk_flags:
  - risk: Readers may think “learned obedience” implies earlier disobedience.
    mitigation: Footnote b preserves the wording while clarifying its experiential sense.
  - risk: The English phrase “a Son” may sound less definite than the christological context intends.
    mitigation: Capitalization and footnote a preserve both Jesus’ specific identity and the Greek ambiguity.
