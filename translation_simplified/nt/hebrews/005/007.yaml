  preserved_meaning: Jesus’ embodied, mortal earthly life remains in view.
  reasoning_layer_used: lexical decision for ἐν ταῖς ἡμέραις τῆς σαρκὸς αὐτοῦ
  rationale: This replaces an unfamiliar idiom while retaining the concrete image of flesh.
- pob_phrase: having offered up both prayers and petitions
  simplified_phrase: he offered up prayers and earnest appeals
  preserved_meaning: Jesus brought two kinds of urgent requests to God, with possible priestly resonance.
  reasoning_layer_used: lexical decisions for δεήσεις, ἱκετηρίας, and προσενέγκας
  rationale: A finite verb and common wording make the action easier to follow without merging the two terms.
- pob_phrase: and having been heard because of his reverence
  simplified_phrase: He was heard because of his reverence
  preserved_meaning: God favorably heard Jesus because of his reverent posture.
