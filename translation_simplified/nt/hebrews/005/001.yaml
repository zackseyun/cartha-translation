translation:
  language: en
  text: For every high priest is chosen from among men and appointed to act for men in matters concerning God. His task is to offer both gifts and sacrifices for sins.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “From among men” and “for men” may also be translated “from among human beings” and “for people.” The Greek uses masculine representative language here.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: being taken from among men
  simplified_phrase: is chosen from among men
  preserved_meaning: The high priest comes from the men he represents and does not take the office on his own.
  reasoning_layer_used: Lexical decision for ἐξ ἀνθρώπων λαμβανόμενος
  rationale: The finite wording replaces an awkward passive participle while retaining selection from among men.
- pob_phrase: is appointed on behalf of men in the things pertaining to God
  simplified_phrase: appointed to act for men in matters concerning God
  preserved_meaning: The high priest is installed to serve as men's representative in matters directed toward God.
  reasoning_layer_used: Lexical decisions for ὑπὲρ ἀνθρώπων, καθίσταται, and τὰ πρὸς τὸν θεόν
  rationale: “Act for” and “matters concerning God” state the mediating role in ordinary English.
- pob_phrase: so that he may offer both gifts and sacrifices for sins
  simplified_phrase: His task is to offer both gifts and sacrifices for sins
  preserved_meaning: Offering gifts and sacrifices for sins is the purpose of his appointment.
  reasoning_layer_used: Lexical decisions for ἵνα προσφέρῃ and δῶρά τε καὶ θυσίας
  rationale: A new sentence makes the purpose easy to follow without combining the two kinds of offerings.
translation_notes:
  risk_flags:
  - risk: Modern readers may understand “men” as excluding the wider people represented by the priest.
    mitigation: The footnote preserves the inclusive lexical alternative while the main text follows POB's gendered rendering.
