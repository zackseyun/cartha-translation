simplification_decisions:
- pob_phrase: being able to deal gently
  simplified_phrase: He can deal gently
  preserved_meaning: The high priest has an ongoing capacity to respond with restraint rather than harshness.
  reasoning_layer_used: POB lexical decisions for μετριοπαθεῖν and δυνάμενος
  rationale: A direct finite clause is easier to read than the opening participial phrase.
- pob_phrase: those who are ignorant and going astray
  simplified_phrase: those who do not understand and who go astray
  preserved_meaning: The people lack knowledge and stray, without limiting the language to a technical sacrificial category.
  reasoning_layer_used: POB lexical and theological decisions for ἀγνοοῦσι and πλανωμένοις
  rationale: The wording clearly preserves both distinct conditions without turning ignorance into an action.
- pob_phrase: since he himself also is beset with weakness
  simplified_phrase: because he too is surrounded by weakness
  preserved_meaning: The priest shares the enveloping condition of broad human frailty.
  reasoning_layer_used: POB lexical and theological decisions for ἐπεὶ, καὶ αὐτός, and περίκειται ἀσθένειαν
  rationale: “Because” makes the reason plain, while “surrounded” preserves the source image.
translation_notes:
  risk_flags:
  - risk: “Go astray” may obscure the participle’s possible passive nuance.
    mitigation: The footnote preserves “are led astray” as an alternative.
  - risk: Readers may take “weakness” as only moral or only physical.
    mitigation: The broad term is retained so the full range of human frailty remains open.
