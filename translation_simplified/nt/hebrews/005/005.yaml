translation:
  language: en
  text: In the same way, the Messiah did not claim for himself the honor of becoming high priest. God gave him that honor, saying to him, “You are my Son; today I have begotten you.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This quotation is from Psalm 2:7.
    reason: cross_reference
simplification_decisions:
- pob_phrase: did not glorify himself to become high priest
  simplified_phrase: did not claim for himself the honor of becoming high priest
  preserved_meaning: The Messiah did not exalt himself or take the priestly office on his own authority.
  reasoning_layer_used: Lexical decision for δοξάζω and the contextual contrast with divine appointment
  rationale: “Claim for himself the honor” makes the reflexive action and office appointment clear in ordinary English.
- pob_phrase: but the one who spoke to him
  simplified_phrase: God gave him that honor, saying to him
  preserved_meaning: The honor came from the divine speaker rather than from the Messiah himself.
  reasoning_layer_used: POB rationale identifying the reverently implicit speaker as God from the quotation context
  rationale: Naming God and supplying the contrasted action resolves an English ellipsis without changing its point.
- pob_phrase: today I have begotten you
  simplified_phrase: today I have begotten you
  preserved_meaning: The wording of Psalm 2:7 remains open to its full christological and intertextual significance.
  reasoning_layer_used: Theological decision to retain the citation without resolving later doctrinal debates
  rationale: The less familiar word “begotten” is retained because simpler paraphrases would overinterpret the quotation.
interpretive_expansions:
- pob_phrase: the one who spoke to him
  rendering: God gave him that honor, saying to him
  claim: The unnamed speaker is God, and he is the one who grants the honor denied as self-assumed.
  evidence:
  - The quotation identifies the speaker as the one who calls the Messiah “my Son.”
  - The preceding argument concerns receiving priestly honor through divine appointment.
  - The POB rationale explicitly identifies the implicit subject as God.
  confidence: high
  alternatives_preserved:
  - the one who spoke to him
translation_notes:
  risk_flags:
  - risk: “Gave him that honor” supplies an action left elliptical in the Greek.
    mitigation: The wording follows the explicit contrast with self-glorification and does not define how Psalm 2:7 relates to the priestly appointment.
