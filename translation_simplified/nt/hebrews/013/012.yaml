simplification_decisions:
- pob_phrase: Therefore Jesus also suffered outside the gate
  simplified_phrase: So Jesus also suffered outside the gate.
  preserved_meaning: Jesus’ suffering corresponds to the sacrificial pattern described before this verse.
  reasoning_layer_used: Lexical decisions for διὸ and καὶ, with the preceding context.
  rationale: “So” gives the same logical connection in more natural common English.
- pob_phrase: so that he might sanctify
  simplified_phrase: He did this to sanctify
  preserved_meaning: Jesus suffered for the purpose of sanctifying the people.
  reasoning_layer_used: Lexical decision for ἵνα ἁγιάσῃ and the theological decision on ἁγιάζω.
  rationale: A new sentence and direct purpose clause make the relationship easier to follow.
- pob_phrase: through his own blood
  simplified_phrase: through his own blood
  preserved_meaning: Jesus’ own sacrificial blood is the means by which he sanctifies the people.
  reasoning_layer_used: Lexical decision for διὰ τοῦ ἰδίου αἵματος.
  rationale: The phrase remains unchanged because its emphasis and sacrificial image are central.
