simplification_decisions:
- pob_phrase: Remember those in prison, as though imprisoned with them
  simplified_phrase: Remember prisoners as if you were in prison with them
  preserved_meaning: Readers must identify with prisoners as though sharing their confinement.
  reasoning_layer_used: Lexical decision for ὡς συνδεδεμένοι
  rationale: The expanded clause uses ordinary English while preserving solidarity and the prison image.
- pob_phrase: those who are mistreated
  simplified_phrase: Remember those who are mistreated
  preserved_meaning: The command to remember also applies to people harmed by others.
  reasoning_layer_used: Lexical decision for τῶν κακουχουμένων
  rationale: Repeating “Remember” makes the second command clear without merging the two groups.
- pob_phrase: since you yourselves also are in the body
  simplified_phrase: because you too live in a body that can suffer
  preserved_meaning: Shared bodily vulnerability gives readers reason to empathize with the mistreated.
  reasoning_layer_used: Theological decision on ἐν σώματι
  rationale: The wording explains the preferred human-vulnerability sense while retaining the body image.
