translation:
  language: en
  text: Remember your leaders who spoke God’s word to you. Think carefully about how their lives turned out,[a] and follow their example of faith.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Turned out” may also mean the end of their lives, possibly the manner of their death.
    reason: lexical_alternative
  - marker: b
    text: Or “faithfulness”; the Greek word can mean either faith or faithfulness.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: who spoke the word of God to you
  simplified_phrase: who spoke God’s word to you
  preserved_meaning: The leaders communicated God’s word to the readers.
  reasoning_layer_used: POB lexical decision for οἵτινες ἐλάλησαν ὑμῖν τὸν λόγον τοῦ θεοῦ
  rationale: The shorter possessive form keeps the biblical concept while sounding more natural.
- pob_phrase: As you consider the outcome of their way of life
  simplified_phrase: Think carefully about how their lives turned out
  preserved_meaning: Readers must reflect attentively on the result or end of the leaders’ manner of life.
  reasoning_layer_used: POB lexical decisions for ἀναθεωροῦντες, ἔκβασις, and ἀναστροφή
  rationale: The recast clause expresses reflection and outcome in ordinary English without specifying death.
- pob_phrase: imitate their faith
  simplified_phrase: follow their example of faith
  preserved_meaning: Readers are commanded to model their faith on that of their leaders.
  reasoning_layer_used: POB lexical and theological decisions for μιμεῖσθε and πίστις
  rationale: The familiar expression clarifies what imitation means while retaining “faith.”
translation_notes:
  risk_flags:
  - risk: “How their lives turned out” could be heard as referring only to circumstances rather than the result of their conduct.
    mitigation: “Think carefully” preserves reflective attention, and the footnote retains the possible life-ending sense.
  - risk: “Faith” may refer instead to the leaders’ faithfulness.
    mitigation: The alternative remains explicit in footnote b.
