translation:
  language: en
  text: We have an altar. But those who serve at the tabernacle, the sacred tent, have no right to eat from this altar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The “altar” has been understood in various ways: as Christ himself, the cross, the heavenly altar, or the benefits of Christ’s sacrifice. The Greek states the image of an altar here without further specifying its referent.'
