  preserved_meaning: The author and his readers have an altar from which the following group may not eat.
  reasoning_layer_used: POB syntax and lexical decisions for ἔχομεν and ἐξ οὗ
  rationale: Two sentences make the contrast easier to follow while preserving the altar image.
- pob_phrase: those who serve at the tabernacle
  simplified_phrase: those who serve at the tabernacle, the sacred tent
  preserved_meaning: These people perform sanctuary service at the tabernacle rather than merely worship there.
  reasoning_layer_used: POB lexical decision for οἱ τῇ σκηνῇ λατρεύοντες
  rationale: The brief gloss explains “tabernacle” while retaining the established biblical term.
- pob_phrase: have no right to eat
  simplified_phrase: have no right to eat from this altar
  preserved_meaning: They lack the authorized privilege to partake from the altar.
  reasoning_layer_used: POB lexical decisions for φαγεῖν and οὐκ ἔχουσιν ἐξουσίαν
  rationale: Repeating “altar” makes the source of the eating clear across the sentence break.
