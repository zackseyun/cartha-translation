translation:
  language: en
  text: For when the high priest brings the blood of animals into the sacred sanctuary area for sin, their bodies are burned outside the camp.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek says “the holy places,” referring broadly to the sacred sanctuary area.
    reason: lexical_alternative
  - marker: b
    text: The verb may mean “completely burned up.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the bodies of those animals whose blood is brought into the holy places for sin by the high priest
  simplified_phrase: when the high priest brings the blood of animals into the sacred sanctuary area for sin, their bodies
  preserved_meaning: The high priest takes the animals’ blood into the sacred area, while their bodies remain outside.
  reasoning_layer_used: POB lexical decisions for εἰσφέρεται, εἰς τὰ ἅγια, διὰ τοῦ ἀρχιερέως, and τούτων τὰ σώματα
  rationale: Active voice and a when-clause make the ritual sequence easier to follow without changing the priestly agency.
- pob_phrase: the holy places
  simplified_phrase: the sacred sanctuary area
  preserved_meaning: The phrase refers broadly to the sanctuary realm without limiting it to the Most Holy Place.
  reasoning_layer_used: POB theological decision on εἰς τὰ ἅγια
  rationale: This wording explains the cultic phrase while preserving its intentionally broad scope.
- pob_phrase: the bodies of those animals
  simplified_phrase: their bodies
  preserved_meaning: The pronoun still refers clearly to the animals whose blood the high priest brings in.
  reasoning_layer_used: POB lexical decision on τούτων τὰ σώματα
  rationale: The reordered sentence gives the pronoun an immediate and unambiguous antecedent.
