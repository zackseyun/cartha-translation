translation:
  language: en
  text: Do not let the love of money shape the way you live. Be content with what you have, because he himself has said,[a] “I will never leave you, and I will never forsake you.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: These words echo covenant promises in Deuteronomy 31:6, 8 and Joshua 1:5.
    reason: cross_reference
simplification_decisions:
- pob_phrase: Let your way of life be free from the love of money
  simplified_phrase: Do not let the love of money shape the way you live
  preserved_meaning: Love of money must not characterize a believer’s conduct.
  reasoning_layer_used: Lexical decisions for ἀφιλάργυρος and ὁ τρόπος
  rationale: The direct command expresses the same way-of-life focus in more natural English.
- pob_phrase: being content with what you have
  simplified_phrase: Be content with what you have
  preserved_meaning: Contentment is the positive command paired with freedom from loving money.
  reasoning_layer_used: Lexical decisions for ἀρκούμενοι and τοῖς παροῦσιν
  rationale: A separate sentence makes the participial exhortation immediately clear.
- pob_phrase: nor will I ever forsake you
  simplified_phrase: and I will never forsake you
  preserved_meaning: The promise emphatically assures the hearers that they will not be abandoned.
  reasoning_layer_used: Lexical and theological decisions on the emphatic double negations
  rationale: Repeating “I will never” preserves the force while using ordinary sentence structure.
