translation:
  language: en
  text: But Melchizedek is not listed in their family line. Yet he has received a tenth from Abraham and has blessed Abraham, the man who had God’s promises.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Received a tenth” may also be translated “taken a tenth.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the one who is not traced by genealogy from them
  simplified_phrase: Melchizedek is not listed in their family line
  preserved_meaning: Melchizedek stands outside the genealogically registered Levitical line.
  reasoning_layer_used: lexical and theological decisions
  rationale: Naming Melchizedek and using “family line” makes the contrast clear without implying anything about his origin.
- pob_phrase: has taken a tenth from Abraham
  simplified_phrase: has received a tenth from Abraham
  preserved_meaning: Abraham gave Melchizedek one tenth, and that completed act remains important to the argument.
  reasoning_layer_used: lexical decision and POB footnote
  rationale: “Received” clearly identifies Abraham as the giver and is an approved lexical alternative.
- pob_phrase: the one who had the promises
  simplified_phrase: Abraham, the man who had God’s promises
  preserved_meaning: Abraham possessed the covenant promises given by God.
  reasoning_layer_used: lexical decision and immediate context
  rationale: Repeating Abraham avoids an opaque description while preserving the plural “promises.”
