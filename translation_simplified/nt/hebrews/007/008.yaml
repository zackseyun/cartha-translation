translation:
  language: en
  text: In the Levitical priesthood, priests who die receive tithes.[a] But in the Scripture account, Melchizedek is testified to be living.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tithe is one tenth, given for priestly service.
    reason: cultural_note
  - marker: b
    text: Or, “the Scripture account testifies about him that he lives.” The wording reports Scripture’s testimony and does not necessarily claim that Melchizedek is literally immortal.
    reason: alternative_reading
