translation:
  language: en
  text: If the Levitical priesthood could have brought people to perfection—and Israel received the law on the basis of that priesthood—why was another priest still needed, one who would arise in the priestly order of Melchizedek rather than be described as belonging to the order of Aaron?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “perfection” includes being made fully fit to approach God, not merely becoming morally flawless.
    reason: simplification_note
simplification_decisions:
- pob_phrase: If perfection had been through the Levitical priesthood
  simplified_phrase: If the Levitical priesthood could have brought people to perfection
  preserved_meaning: The priesthood is presented as the possible means of bringing people into the intended state before God.
  reasoning_layer_used: Lexical and theological decisions on τελείωσις and διά
  rationale: The active wording makes the hypothetical relationship easier to follow while retaining “perfection.”
- pob_phrase: for on its basis the people had received the law
  simplified_phrase: and Israel received the law on the basis of that priesthood
  preserved_meaning: Israel’s legal arrangement was founded on the Levitical priesthood.
  reasoning_layer_used: Lexical and theological decisions on ἐπ’ αὐτῆς and νενομοθέτηται
  rationale: Naming Israel and repeating “priesthood” removes unclear pronoun references.
- pob_phrase: another priest to arise according to the order of Melchizedek and not be spoken of according to the order of Aaron
  simplified_phrase: another priest still needed, one who would arise in the priestly order of Melchizedek rather than be described as belonging to the order of Aaron
  preserved_meaning: The needed priest belongs to Melchizedek’s category rather than Aaron’s.
  reasoning_layer_used: Lexical decisions on τάξις, ἀνίστασθαι, and λέγεσθαι
  rationale: The recast contrast explains the classification without removing the biblical term “order.”
