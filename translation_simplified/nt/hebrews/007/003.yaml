translation:
  language: en
  text: Scripture presents him as having no father, no mother, and no family line, with no beginning to his days or end to his life. He was made like the Son of God, and he remains a priest for all time.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Genesis does not record Melchizedek’s ancestry, birth, or death. Hebrews uses this portrayal to compare him with the Son of God; the wording does not identify him as the Son.
    reason: source_note
simplification_decisions:
- pob_phrase: without father, without mother, without genealogy
  simplified_phrase: Scripture presents him as having no father, no mother, and no family line
  preserved_meaning: The threefold description remains while being framed as the biblical record’s portrayal.
  reasoning_layer_used: POB footnote and theological decision
  rationale: This wording prevents readers from assuming that Melchizedek was literally parentless.
- pob_phrase: having neither beginning of days nor end of life
  simplified_phrase: with no beginning to his days or end to his life
  preserved_meaning: The paired image of an unrecorded beginning and ending is retained.
  reasoning_layer_used: lexical decision and theological decision
  rationale: The shorter clause keeps the elevated contrast without the difficult participial wording.
- pob_phrase: he remains a priest perpetually
  simplified_phrase: he remains a priest for all time
  preserved_meaning: His priesthood is presented as continuing without interruption.
  reasoning_layer_used: lexical decision for εἰς τὸ διηνεκές
  rationale: “For all time” is clearer than “perpetually” and is an approved POB alternative.
interpretive_expansions:
- pob_phrase: without father, without mother, without genealogy
  rendering: Scripture presents him as having no father, no mother, and no family line
  claim: The descriptions refer primarily to how Genesis portrays Melchizedek rather than denying that he had human parents.
  evidence:
