translation:
  language: en
  text: This is because the law appoints men who are subject to weakness as high priests. But the word spoken in the oath, which came after the law, appoints a Son[a] who has been perfected forever.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the Son.” “A Son” emphasizes the contrast with the men while still referring to Jesus.
    reason: alternative_reading
  - marker: b
    text: “Perfected” can also mean brought to completion or, in this priestly setting, consecrated.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: For the law appoints men as high priests who have weakness
  simplified_phrase: This is because the law appoints men who are subject to weakness as high priests.
  preserved_meaning: The law formally appoints frail human men to the high-priestly office.
  reasoning_layer_used: POB lexical decisions and clause logic
  rationale: The sentence states the causal link directly and replaces the awkward phrase “have weakness” with natural English.
- pob_phrase: the word of the oath
  simplified_phrase: the word spoken in the oath
  preserved_meaning: The appointment rests on the divine pronouncement contained in the oath.
  reasoning_layer_used: POB lexical rationale for λόγος and ὁρκωμοσίας
  rationale: This wording clarifies the relationship between the word and the oath while retaining both source ideas.
- pob_phrase: but ... appoints a Son who has been perfected forever
  simplified_phrase: But ... appoints a Son who has been perfected forever
  preserved_meaning: The oath-appointed Son stands in contrast to weak human high priests and remains fully fitted for his role forever.
  reasoning_layer_used: POB theological decisions and latest revision pass
  rationale: A new sentence makes the contrast easier to follow while preserving “a Son” and the perfect passive wording.
translation_notes:
  risk_flags:
  - risk: “A Son” may sound as though Jesus is merely one son among many.
    mitigation: Capitalization and the footnote preserve the qualitative Greek wording while identifying Jesus in context.
  - risk: “Perfected” may be mistaken to mean that the Son once had moral faults.
    mitigation: The footnote preserves the senses of completion and priestly consecration.
