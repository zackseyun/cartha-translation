translation:
  language: en
  text: For the law did not bring anything to perfection.[a] But a better hope is introduced, and through this hope we draw near to God.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek can also mean “bring anything to its intended completion.”
