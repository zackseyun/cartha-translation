translation:
  language: en
  text: He has become a priest, not on the basis of a law with a bodily requirement,[a] but on the basis of the power of an indestructible life.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here this bodily requirement concerns outward, physical qualification, including priestly ancestry; it does not mean sinful.
    reason: simplification_note
  - marker: b
    text: Traditionally, “an endless life.”
    reason: lexical_alternative
