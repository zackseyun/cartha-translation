  simplified_phrase: the priesthood changes
  preserved_meaning: The priestly institution moves from one arrangement to another.
  reasoning_layer_used: Lexical decision for μετατιθεμένης and immediate context
  rationale: The active English form states the same change more directly without naming an agent.
- pob_phrase: of necessity there is also a change of law
  simplified_phrase: the law must also change
  preserved_meaning: A change in priesthood logically requires a corresponding legal change.
  reasoning_layer_used: Lexical decisions for ἐξ ἀνάγκης, νόμου, μετάθεσις, and γίνεται
  rationale: Using “must” makes the logical necessity clear and removes the abstract construction.
