translation:
  language: en
  text: Unlike the other high priests, he does not need to offer sacrifices day after day. They first offer sacrifices for their own sins and then for the sins of the people. But he did this once for all when he offered up himself.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: who has no need, day after day, like the high priests, to offer sacrifices
  simplified_phrase: Unlike the other high priests, he does not need to offer sacrifices day after day.
  preserved_meaning: His priestly work does not require the repeated sacrifices made by the other high priests.
  reasoning_layer_used: POB lexical decisions for καθ’ ἡμέραν, ἀνάγκην, and θυσίας ἀναφέρειν
  rationale: The comparison is moved forward and the dense clause becomes a direct sentence.
- pob_phrase: first for his own sins and then for those of the people
  simplified_phrase: They first offer sacrifices for their own sins and then for the sins of the people.
  preserved_meaning: The other high priests sacrifice in sequence for their own sins and the people's sins.
  reasoning_layer_used: POB lexical decisions for πρότερον ... ἔπειτα and τῶν τοῦ λαοῦ
  rationale: The explicit plural subject prevents readers from attributing these sins to Christ.
- pob_phrase: for this he did once for all when he offered up himself
  simplified_phrase: But he did this once for all when he offered up himself.
  preserved_meaning: Christ performed the sacrificial act once definitively by offering himself.
  reasoning_layer_used: POB lexical decisions for τοῦτο, ἐφάπαξ, and ἑαυτὸν ἀνενέγκας, with the theological decision on the scope of “this”
  rationale: The wording retains the broad reference of “this” and the priestly image of self-offering.
interpretive_expansions:
- pob_phrase: like the high priests ... first for his own sins
  rendering: Unlike the other high priests ... They first offer sacrifices for their own sins
  claim: The sins belong to the other high priests rather than to Christ.
  evidence:
  - The Greek comparison names the high priests in the plural.
  - The POB theological decision excludes an offering by Christ for his own sins.
  confidence: high
