- pob_phrase: those from the sons of Levi
  simplified_phrase: those descendants of Levi
  preserved_meaning: Only members of Levi’s family line who receive the priesthood are in view.
  reasoning_layer_used: POB lexical decision on οἱ μὲν ἐκ τῶν υἱῶν Λευὶ
  rationale: “Descendants” states the family relationship naturally without referring to all Levites.
- pob_phrase: have a commandment according to the law to collect a tenth
  simplified_phrase: Under the law ... are commanded to collect a tenth
  preserved_meaning: The law authoritatively requires these priests to receive one tenth from the people.
  reasoning_layer_used: POB lexical decisions on ἐντολὴν ἔχουσιν, ἀποδεκατοῦν, and κατὰ τὸν νόμον
  rationale: The verbal construction is easier to follow while retaining the command’s legal force.
- pob_phrase: though they also have come from Abraham’s loins
  simplified_phrase: even though they too are physically descended from Abraham
  preserved_meaning: The priests and the people share bodily descent from Abraham despite their different roles.
  reasoning_layer_used: POB lexical and theological decisions on καίπερ and the bodily descent idiom
  rationale: The wording preserves the explicit concession and physical ancestry without the archaic term “loins.”
