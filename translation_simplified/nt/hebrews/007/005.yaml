translation:
  language: en
  text: Under the law, those descendants of Levi who receive the priesthood are commanded to collect a tenth from the people—that is, from their brothers[a]—even though they too are physically descended from Abraham.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: That is, their fellow Israelites; the Greek calls them “brothers.”
    reason: lexical_alternative
