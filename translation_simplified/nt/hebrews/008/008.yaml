  text: For God finds fault with them and says, “Look, the days are coming,” says the Lord, “when I will establish a new covenant with the people of Israel and the people of Judah.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: in finding fault with them he says
  simplified_phrase: God finds fault with them and says
  preserved_meaning: God’s finding fault with the people provides the context for his announcement of the new covenant.
  reasoning_layer_used: source syntax and immediate context
  rationale: The active wording avoids an awkward participle without imposing a merely temporal connection.
- pob_phrase: the house of Israel and ... the house of Judah
  simplified_phrase: the people of Israel and the people of Judah
  preserved_meaning: The promise addresses the two distinct covenant communities named Israel and Judah.
  reasoning_layer_used: source wording and readability rule for opaque idioms
  rationale: In this corporate expression, “house” refers to the people belonging to each community.
interpretive_expansions:
- pob_phrase: he says
  rendering: God ... says
  claim: The unnamed speaker who finds fault and speaks is God.
  evidence:
  - The quotation identifies the speaker as “the Lord.”
  - The immediate context presents God as the one who establishes the covenant.
  confidence: high
  alternatives_preserved:
  - The quotation retains the title “the Lord.”
