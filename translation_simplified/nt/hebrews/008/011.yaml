translation:
  language: en
  text: Not one of them will teach his fellow citizen[a] or his brother by saying, “Know the Lord,” because they will all know me, from the least of them to the greatest.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “neighbor.” The Greek text of Hebrews says “fellow citizen,” while the passage in Jeremiah is commonly translated “neighbor.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: they will certainly not teach, each one
  simplified_phrase: Not one of them will teach
  preserved_meaning: The emphatic denial still applies to every individual in the covenant community.
  reasoning_layer_used: Lexical decision for οὐ μή and distributive ἕκαστος
  rationale: The recast wording expresses both emphatic negation and individual scope in a simpler sentence opening.
- pob_phrase: each one his fellow citizen and each one his brother
  simplified_phrase: his fellow citizen or his brother
  preserved_meaning: Both the civic and familial relationships remain distinct objects of teaching.
  reasoning_layer_used: Lexical and theological decisions for πολίτην and ἀδελφόν
  rationale: Removing repeated words makes the pair natural in English without replacing the source-driven terms.
- pob_phrase: saying, ‘Know the Lord’
  simplified_phrase: by saying, “Know the Lord”
  preserved_meaning: The quoted command states what the teaching consists of.
  reasoning_layer_used: Lexical decision for Γνῶθι and κύριον
  rationale: Adding “by” clearly connects the quotation to the act of teaching.
translation_notes:
  risk_flags:
  - risk: Using “or” for the paired objects may look less literal than the repeated Greek conjunction.
    mitigation: In an English negative clause, “or” naturally preserves the prohibition across both relationships.
