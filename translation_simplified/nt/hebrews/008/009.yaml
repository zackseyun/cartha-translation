translation:
  language: en
  text: It will not be like the covenant I made with their fathers on the day I took them by the hand to lead them out of the land of Egypt, because they did not remain faithful to my covenant, and I disregarded them,[a] says the Lord.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrews follows the Greek wording, “I disregarded them.” The Hebrew text of Jeremiah 31:32 can mean “though I was their husband” or “though I was their master.”
    reason: alternative_reading
