translation:
  language: en
  text: These priests serve in a sanctuary that is a copy and shadow of the heavenly things, just as God instructed Moses when he was about to set up the tabernacle. God said, “Be sure to make everything according to the pattern shown to you on the mountain.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek can also emphasize that God warned or admonished Moses.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: who serve a copy and shadow of the heavenly things
  simplified_phrase: These priests serve in a sanctuary that is a copy and shadow of the heavenly things
  preserved_meaning: The earthly priestly service corresponds to but is inferior to the heavenly reality.
  reasoning_layer_used: Lexical and theological decisions on ὑποδείγματι, σκιᾷ, and λατρεύουσιν
  rationale: The recasting supplies the contextual priests and sanctuary while preserving both images.
- pob_phrase: Moses was divinely instructed
  simplified_phrase: God instructed Moses
  preserved_meaning: Moses received authoritative direction from God.
  reasoning_layer_used: Lexical and theological decision on κεχρημάτισται
  rationale: Active wording clearly identifies the divine source without narrowing the verb to warning.
- pob_phrase: erect the tabernacle; for he says, “See that you make everything”
  simplified_phrase: set up the tabernacle. God said, “Be sure to make everything”
  preserved_meaning: God commanded Moses to make the tabernacle according to the revealed design.
  reasoning_layer_used: Lexical decisions on ἐπιτελεῖν, Ὅρα, and ποιήσεις πάντα
  rationale: Common verbs and shorter sentences preserve the force of the command.
interpretive_expansions:
- pob_phrase: serve a copy and shadow
  rendering: serve in a sanctuary that is a copy and shadow
  claim: The copy and shadow describe the earthly sanctuary in which the priests serve.
  evidence:
  - The cultic context and POB reasoning identify the earthly sanctuary as the heavenly counterpart.
  confidence: high
  alternatives_preserved:
  - serve a copy and shadow
translation_notes:
  risk_flags:
  - risk: “Copy and shadow” could suggest that the earthly sanctuary was unreal.
    mitigation: Both images remain tied to heavenly things without calling the sanctuary imaginary.
  - risk: Naming God makes the implied source and speaker explicit.
    mitigation: The POB identifies the instruction as divine, and the quotation presents that divine direction.
