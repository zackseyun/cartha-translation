translation:
  language: en
  text: For it is impossible for those who once received spiritual light,[a] tasted the gift from heaven,[b] and came to share in the Holy Spirit—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The phrase does not specify whether this refers to conversion, baptism, or spiritual instruction more broadly.
    reason: alternative_reading
  - marker: b
    text: “Tasted” can mean truly experienced; it does not necessarily mean merely sampled.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: in the case of those who were once enlightened
  simplified_phrase: for those who once received spiritual light
  preserved_meaning: They previously received spiritual light, without defining the experience more narrowly.
  reasoning_layer_used: lexical and theological decisions on φωτισθέντας
  rationale: This keeps the light image while replacing an abstract passive expression.
- pob_phrase: tasted the heavenly gift
  simplified_phrase: tasted the gift from heaven
  preserved_meaning: They had a real but deliberately undefined experience of God’s heavenly gift.
  reasoning_layer_used: lexical and theological decisions on γευσαμένους and δωρεᾶς τῆς ἐπουρανίου
  rationale: The concrete taste image remains, while the gift’s heavenly source is stated naturally.
- pob_phrase: became partakers of the Holy Spirit
  simplified_phrase: came to share in the Holy Spirit
  preserved_meaning: They entered into participation in the Holy Spirit without defining its doctrinal extent.
  reasoning_layer_used: lexical and theological decisions on μετόχους γενηθέντας πνεύματος ἁγίου
  rationale: “Share in” communicates participation more clearly than the uncommon word “partakers.”
interpretive_expansions:
- pob_phrase: were once enlightened
  rendering: once received spiritual light
  claim: The enlightenment belongs to the spiritual domain rather than physical illumination.
  evidence:
  - The POB footnote describes the phrase as receiving spiritual light or instruction.
  - The theological decision identifies enlightenment as a spiritual-cognitive metaphor.
  confidence: high
  alternatives_preserved:
  - conversion
  - baptismal illumination
  - spiritual instruction more broadly
translation_notes:
  risk_flags:
  - risk: “Received spiritual light” could still be read as specifically meaning conversion.
    mitigation: Footnote a preserves the broader range allowed by the POB reasoning.
  - risk: Modern readers may take “tasted” to mean only a superficial sample.
    mitigation: Footnote b states that the verb may describe real experience without settling its extent.
