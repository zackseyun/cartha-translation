translation:
  language: en
  text: For land that drinks in the rain falling on it again and again, and grows plants useful to the people for whose benefit it is also farmed, receives blessing from God.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “useful to the people who farm it.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: the rain that often comes upon it
  simplified_phrase: the rain falling on it again and again
  preserved_meaning: The land repeatedly receives rain while the vivid image of drinking remains intact.
  reasoning_layer_used: Lexical decision for the rain phrase
  rationale: “Falling on it again and again” is more concrete and natural than “often comes upon it.”
- pob_phrase: produces vegetation useful
  simplified_phrase: grows plants useful
  preserved_meaning: The land brings forth broadly described plant growth that serves a practical purpose.
  reasoning_layer_used: Lexical decisions for τίκτουσα, βοτάνην, and εὔθετον
  rationale: “Grows plants” uses familiar agricultural language without narrowing the image to a specific crop.
- pob_phrase: to those for whose sake it is also cultivated
  simplified_phrase: to the people for whose benefit it is also farmed
  preserved_meaning: The land is worked for the benefit of certain people, while retaining the connective “also.”
  reasoning_layer_used: Lexical decision for διά with the accusative, καί, and γεωργεῖται
  rationale: The wording states the purpose clearly and preserves the agency alternative in a footnote.
translation_notes:
  risk_flags:
  - risk: The wording “for whose benefit” favors purpose over the possible agency reading.
    mitigation: The main text follows the POB decision, and footnote a preserves the agency reading.
