translation:
  language: en
  text: So through these two things—God’s promise and his oath—which cannot change, and because it is impossible for God to lie, we who have fled for safety[b] may have strong encouragement to seize[a] the hope set before us.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “hold firmly to.” The Greek verb can mean seize, grasp, or hold firmly.
    reason: lexical_alternative
  - marker: b
    text: “Fled for safety” may recall the Old Testament cities where people could seek refuge.
    reason: cross_reference
