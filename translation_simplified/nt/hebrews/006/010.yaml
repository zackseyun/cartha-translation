translation:
  language: en
  text: God is not unjust. He will not forget your work or the love you have shown for his name by serving his people[a] in the past and continuing to serve them now.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “the saints,” meaning God’s holy people or fellow believers.
    reason: cultural_note
simplification_decisions:
- pob_phrase: For God is not unjust so as to forget
  simplified_phrase: God is not unjust. He will not forget
  preserved_meaning: God’s justice means he does not overlook their faithful actions.
  reasoning_layer_used: Lexical decision for ἄδικος and ἐπιλαθέσθαι; theological decision on divine recognition
  rationale: Two direct sentences replace the difficult result construction without suggesting that their work earns salvation.
- pob_phrase: the saints
  simplified_phrase: his people
  preserved_meaning: The people served are fellow believers who belong to God.
  reasoning_layer_used: Lexical decision for τοῖς ἁγίοις and cultural footnote
  rationale: The main text avoids the later canonization sense while the footnote preserves the biblical term.
- pob_phrase: in having served the saints and in continuing to serve them
  simplified_phrase: by serving his people in the past and continuing to serve them now
  preserved_meaning: Their service began in the past and remains ongoing.
  reasoning_layer_used: Aspectual decisions for διακονήσαντες and διακονοῦντες
  rationale: Explicit time words make the contrast between past and continuing service immediately clear.
interpretive_expansions:
- pob_phrase: having served ... and continuing to serve
  rendering: serving ... in the past and continuing to serve them now
  claim: The verse distinguishes earlier acts of service from service still underway.
  evidence:
  - The POB lexical rationale identifies an aorist participle followed by a present participle.
  - The POB translation already makes the ongoing force explicit with “continuing.”
  confidence: high
  alternatives_preserved:
  - having served ... and continuing to serve
  - by having served ... and by continuing to serve
translation_notes:
  risk_flags:
  - risk: “His people” is more interpretive than the traditional term “saints.”
    mitigation: A footnote preserves the literal term and explains its meaning.
  - risk: “He will not forget” could be mistaken for a promise of merit-based reward.
    mitigation: The wording states divine remembrance only and does not say their service earns salvation.
