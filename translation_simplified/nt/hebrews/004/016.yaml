simplification_decisions:
- pob_phrase: let us approach the throne of grace with boldness
  simplified_phrase: let us come boldly before the throne of grace
  preserved_meaning: Believers are urged to approach God freely and boldly, without implying presumption.
  reasoning_layer_used: Lexical and theological decisions on προσερχώμεθα and παρρησία
  rationale: This uses ordinary English while preserving the throne image and the strong force of boldness.
- pob_phrase: for timely help
  simplified_phrase: for help at the right time
  preserved_meaning: The help supplied by grace comes when it is timely.
  reasoning_layer_used: Lexical decision on εἰς εὔκαιρον βοήθειαν
  rationale: This explains “timely” plainly without shifting the emphasis to the recipient’s need.
translation_notes:
  risk_flags:
