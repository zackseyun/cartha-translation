translation:
  language: en
  text: For anyone who has entered his rest[a] has also rested from their works[b], just as God rested from his own.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “God’s rest.” In the context of Hebrews 3–4, “his” most likely refers to God.
    reason: alternative_reading
  - marker: b
    text: Or “stopped doing their works.” The Greek repeats the passage’s language of rest.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the one who has entered
  simplified_phrase: anyone who has entered
  preserved_meaning: The wording still refers generically to any person who has completed the act of entering.
  reasoning_layer_used: Lexical decision for ὁ ... εἰσελθὼν
  rationale: “Anyone” makes the generic reference immediately clear.
- pob_phrase: has himself also rested
  simplified_phrase: has also rested
  preserved_meaning: The person who enters personally shares in the rest.
  reasoning_layer_used: Lexical decisions for καὶ αὐτὸς and κατέπαυσεν
  rationale: Natural English conveys the personal action without the awkward emphatic order.
- pob_phrase: from his works
  simplified_phrase: from their works
  preserved_meaning: The plural keeps the broad reference to that person’s deeds or activities.
  reasoning_layer_used: Lexical decision for ἀπὸ τῶν ἔργων αὐτοῦ and grounding review
  rationale: Singular “their” clarifies the human referent while retaining the source plural “works.”
translation_notes:
  risk_flags:
  - risk: Readers may initially understand “his rest” as the person’s own rest.
    mitigation: Footnote [a] preserves the ambiguity and identifies God as the likely referent.
  - risk: “Works” may be mistaken for specifically meritorious deeds.
    mitigation: The text leaves the term broad, as the POB lexical decision requires.
