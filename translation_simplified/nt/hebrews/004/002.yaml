translation:
  language: en
  text: The good news has been proclaimed to us too, just as it was to them. But the message they heard did them no good, because they were not joined by faith[a] with those who heard it.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or trust.
    reason: lexical_alternative
  - marker: b
    text: 'A textual variant supports: “because the message was not combined with faith in those who heard it.”'
    reason: textual_variant
simplification_decisions:
- pob_phrase: we also have had good news proclaimed to us, just as they did
  simplified_phrase: The good news has been proclaimed to us too, just as it was to them
  preserved_meaning: Both the present audience and the wilderness generation received the proclaimed good news.
  reasoning_layer_used: Lexical decisions for εὐηγγελισμένοι and καθάπερ κἀκεῖνοι
  rationale: The direct passive sentence is easier to read while retaining the proclamation’s continuing relevance.
- pob_phrase: did not benefit them
  simplified_phrase: did them no good
  preserved_meaning: The message failed to bring them any benefit.
  reasoning_layer_used: Lexical decision for ὠφέλησεν
  rationale: This common expression plainly conveys the same lack of benefit.
- pob_phrase: were not united by faith with those who heard
  simplified_phrase: were not joined by faith with those who heard it
  preserved_meaning: They were not joined by faith with the people who heard the message.
  reasoning_layer_used: Lexical and theological decisions for συγκεκερασμένους, πίστει, and τοῖς ἀκούσασιν
  rationale: “Joined” is plainer than “united,” and “heard it” avoids implying receptive listening.
