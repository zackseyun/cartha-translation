translation:
  language: en
  text: 'We who have believed enter God’s rest, just as God has said: “In my wrath I swore, ‘They shall never enter my rest.’” This is so even though he had already finished his works when he created the world.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: For we who have believed enter the rest
  simplified_phrase: We who have believed enter God’s rest
  preserved_meaning: Believers presently enter the specific divine rest under discussion.
  reasoning_layer_used: Lexical and theological decisions on εἰσερχόμεθα and κατάπαυσιν
  rationale: The wording keeps the present tense while clearly identifying the rest as God’s.
- pob_phrase: just as he has said
  simplified_phrase: just as God has said
  preserved_meaning: God’s enduring statement supports the claim about believers entering rest.
  reasoning_layer_used: Lexical decision on καθὼς εἴρηκεν and immediate context
  rationale: Naming God removes an unclear pronoun without changing the speaker.
- pob_phrase: although his works were finished from the foundation of the world
  simplified_phrase: This is so even though he had already finished his works when he created the world
  preserved_meaning: God’s works were already complete at the creation of the world despite the later warning about entering rest.
  reasoning_layer_used: Lexical decisions on καίτοι, τῶν ἔργων γενηθέντων, and ἀπὸ καταβολῆς κόσμου
  rationale: The sentence states the concessive link and the time of completion in familiar English.
