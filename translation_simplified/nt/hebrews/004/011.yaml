translation:
  language: en
  text: So let us do everything we can to enter that rest, so that none of us falls by repeating the same pattern of disobedience.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the same example of unbelief.” The word more directly means “disobedience,” but here it recalls the wilderness generation, who refused to trust God.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Therefore, let us make every effort
  simplified_phrase: So let us do everything we can
  preserved_meaning: The exhortation still calls for earnest and active effort based on the preceding argument.
  reasoning_layer_used: Lexical decisions for σπουδάσωμεν and οὖν
  rationale: Common wording replaces a formal transition and an abstract expression.
- pob_phrase: fall by the same pattern of disobedience
  simplified_phrase: falls by repeating the same pattern of disobedience
  preserved_meaning: The warning remains that readers may fall by following Israel’s precedent of disobedience.
  reasoning_layer_used: Lexical decision for ὑποδείγματι and immediate context
  rationale: “Repeating” makes the idea of following a prior pattern immediately clear.
translation_notes:
  risk_flags:
  - risk: “Do everything we can” could be heard as self-reliant effort that earns God’s rest.
    mitigation: The wording keeps the goal as entering God’s already promised rest rather than earning it.
