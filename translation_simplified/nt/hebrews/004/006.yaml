translation:
  language: en
  text: Therefore, God's rest is still open for some to enter. Those who were told the good news earlier did not enter because they disobeyed.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “because they refused to believe.” The Greek word describes unbelief expressed through disobedience.
    reason: lexical_alternative
