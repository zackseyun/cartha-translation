translation:
  language: en
  text: We do not have a high priest who cannot feel with us in our weaknesses. Instead, he has been tested[a] in every way in a way like ours,[b] yet without sin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “tempted.”
    reason: alternative_reading
  - marker: b
    text: Literally, “according to likeness”; the wording expresses similarity without saying that every circumstance was identical.
