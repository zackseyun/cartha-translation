- pob_phrase: For we do not have a high priest unable to sympathize with our weaknesses
  simplified_phrase: We do not have a high priest who cannot feel with us in our weaknesses.
  preserved_meaning: The high priest shares in human weakness rather than merely looking on with pity.
  reasoning_layer_used: POB lexical decision for μὴ δυνάμενον συμπαθῆσαι
  rationale: “Feel with us” explains shared suffering while retaining the negative form.
- pob_phrase: but one who has been tested
  simplified_phrase: Instead, he has been tested
  preserved_meaning: The same high priest truly experienced testing.
  reasoning_layer_used: POB lexical and theological decisions for πεπειρασμένον
  rationale: A new sentence makes the contrast easier to follow.
- pob_phrase: according to likeness
  simplified_phrase: in a way like ours
  preserved_meaning: His testing resembled ours without requiring identical circumstances.
  reasoning_layer_used: POB lexical and theological decisions for καθ’ ὁμοιότητα and immediate context
