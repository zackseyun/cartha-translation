  text: A farmer who works hard must be the first to get a share of the harvest.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or possibly, “The farmer must work before receiving a share of the harvest.” The main text understands “first” as giving the farmer priority in receiving a share.
