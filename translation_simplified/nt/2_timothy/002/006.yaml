  preserved_meaning: The farmer participates in the produce resulting from the labor.
  reasoning_layer_used: Lexical decisions for μεταλαμβάνειν and τῶν καρπῶν
  rationale: “Get” and “harvest” express the agricultural result in direct modern English.
- pob_phrase: must be the first
  simplified_phrase: must be the first
  preserved_meaning: The farmer has priority in sharing in the results of the labor.
  reasoning_layer_used: Theological decision on πρῶτον
  rationale: This wording retains the source-driven emphasis on priority rather than merely working before eating.
