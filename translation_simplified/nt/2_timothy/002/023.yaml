translation:
  language: en
  text: But do not get involved in foolish, ignorant controversies[a], because you know they lead to quarrels.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word can also mean “questions” or “debates,” but here it refers to disputes rather than sincere inquiry.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: refuse
  simplified_phrase: do not get involved in
  preserved_meaning: Timothy must decline participation in these disputes.
  reasoning_layer_used: The lexical decision for παραιτοῦ includes avoiding or having nothing to do with something.
  rationale: The expanded command is more natural and makes the intended refusal of involvement clear.
- pob_phrase: knowing that they produce quarrels
  simplified_phrase: because you know they lead to quarrels
  preserved_meaning: Timothy should avoid these controversies because they cause conflict.
  reasoning_layer_used: The lexical decisions treat εἰδὼς as giving the reason and γεννῶσι as metaphorical causation.
  rationale: An explicit reason clause and “lead to” communicate the causal relationship in ordinary English.
