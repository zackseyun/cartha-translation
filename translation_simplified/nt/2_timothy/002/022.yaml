translation:
  language: en
  text: Run from the desires that come with being young.[a] Instead, pursue righteousness,[b] faith,[c] love, and peace. Pursue these things together with those who call on the Lord from a pure heart.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “youthful passions.” This includes more than sexual desire alone.
    reason: lexical_alternative
  - marker: b
    text: Or “justice.”
    reason: alternative_reading
  - marker: c
    text: Or “faithfulness.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: flee youthful desires
  simplified_phrase: Run from the desires that come with being young
  preserved_meaning: The command remains forceful, and the desires are broadly associated with youth rather than limited to sexual lust.
  reasoning_layer_used: Lexical and theological decisions on νεωτερικὰς ἐπιθυμίας and φεῦγε
  rationale: The wording explains “youthful” without claiming these desires are statistically common.
- pob_phrase: and pursue righteousness, faith, love, and peace
  simplified_phrase: Instead, pursue righteousness, faith, love, and peace
  preserved_meaning: The active pursuit of all four virtues remains distinct from fleeing harmful desires.
  reasoning_layer_used: Lexical decisions on δίωκε and the four virtue terms
  rationale: A new sentence and “instead” make the contrast easy to follow.
- pob_phrase: together with those who call on the Lord from a pure heart
  simplified_phrase: Pursue these things together with those who call on the Lord from a pure heart
  preserved_meaning: These virtues are pursued in fellowship with sincere worshipers of the Lord.
  reasoning_layer_used: Lexical decisions on μετὰ τῶν ἐπικαλουμένων and ἐκ καθαρᾶς καρδίας
  rationale: Repeating “pursue” clearly links the fellowship phrase to the whole virtue list.
translation_notes:
  risk_flags:
  - risk: “Run from” is less formal than POB’s “flee.”
    mitigation: It preserves the urgent image of moving away from harmful desires.
  - risk: “Righteousness” may be unfamiliar to some readers.
    mitigation: It remains because it is the audited Pauline default, with “justice” given as an alternative.
