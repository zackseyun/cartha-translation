translation:
  language: en
  text: A soldier does not get tangled up in the everyday affairs of life[a]. His aim is to please the one who enlisted him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “civilian pursuits.” The Greek contrasts military service with ordinary life.
