simplification_decisions:
- pob_phrase: who have gone astray from the truth
  simplified_phrase: They have turned away from the truth.
  preserved_meaning: The false teachers have departed from correct teaching.
  reasoning_layer_used: POB lexical decision for ἠστόχησαν with περὶ τὴν ἀλήθειαν
  rationale: A direct sentence makes their doctrinal departure easier to grasp.
- pob_phrase: saying that
  simplified_phrase: They claim that
  preserved_meaning: This introduces the content of their false teaching without explaining its full system.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: “Claim” clearly marks the reported teaching as false in context.
- pob_phrase: are upsetting the faith of some
  simplified_phrase: are shaking the faith of some people
  preserved_meaning: Their teaching is continuing to destabilize some believers' faith without necessarily destroying it.
  reasoning_layer_used: POB lexical decision for ἀνατρέπουσιν and theological decision for πίστις
  rationale: “Shaking” communicates destabilization more clearly than the potentially emotional sense of “upsetting.”
translation_notes:
  risk_flags:
  - risk: “Shaking” is less literal than the verb's image of overturning.
    mitigation: It preserves the POB decision not to imply that their faith was completely destroyed.
