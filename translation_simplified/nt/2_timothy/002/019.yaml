translation:
  language: en
  text: Even so, God’s firm foundation stands. It bears this seal:[a] “The Lord knows those who belong to him,” and, “Everyone who professes allegiance to the Lord must turn away from unrighteousness.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The seal is an identifying mark and may refer to the words inscribed on it.
    reason: lexical_alternative
  - marker: b
    text: Or “everyone who calls on the name of the Lord.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Nevertheless, the firm foundation of God stands
  simplified_phrase: Even so, God’s firm foundation stands
  preserved_meaning: God’s foundation remains secure despite the false teaching just discussed.
  reasoning_layer_used: Lexical decisions for μέντοι, στερεὸς θεμέλιος, τοῦ θεοῦ, and ἕστηκεν
  rationale: “Even so” gives the contrast in common English while retaining the foundation’s settled stability.
- pob_phrase: those who are his
  simplified_phrase: those who belong to him
  preserved_meaning: The Lord knows the people who are his own.
  reasoning_layer_used: Lexical decision for τοὺς ὄντας αὐτοῦ
  rationale: “Belong to him” states the possessive relationship more directly.
- pob_phrase: Let everyone who names the name of the Lord depart from unrighteousness
  simplified_phrase: Everyone who professes allegiance to the Lord must turn away from unrighteousness
  preserved_meaning: All who identify with the Lord are commanded to separate decisively from wrongdoing.
  reasoning_layer_used: Lexical decisions for Ἀποστήτω, ἀπὸ ἀδικίας, and the naming idiom
  rationale: The wording explains the idiom and recasts the formal command in natural English.
interpretive_expansions:
- pob_phrase: names the name of the Lord
  rendering: professes allegiance to the Lord
  claim: Naming the Lord expresses open identification and allegiance, not merely speaking his name.
  evidence:
  - The POB lexical rationale identifies the phrase as an idiom for invoking or professing allegiance.
  - The command to turn from unrighteousness addresses those who identify themselves with the Lord.
  confidence: high
  alternatives_preserved:
  - everyone who calls on the name of the Lord
