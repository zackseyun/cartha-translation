translation:
  language: en
  text: From now on, the crown of righteousness[a] is kept for me. On that day, the Lord, the righteous judge, will award it to me. He will award it not only to me, but also to everyone who has loved his appearing.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the crown of justice.” The Greek word can mean “righteousness” or, in some contexts, “justice.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: From now on the crown of righteousness is laid up for me
  simplified_phrase: From now on, the crown of righteousness is kept for me
  preserved_meaning: The crown already stands reserved for Paul as what remains ahead.
  reasoning_layer_used: Lexical decisions for λοιπὸν and ἀπόκειταί
  rationale: “From now on” preserves the forward-looking sense, while “is kept” states the crown’s reserved status.
- pob_phrase: which the Lord, the righteous judge, will award to me on that day
  simplified_phrase: On that day, the Lord, the righteous judge, will award it to me
  preserved_meaning: The Lord will grant the crown to Paul on the future day of judgment.
  reasoning_layer_used: Lexical decisions for ἀποδώσει, κύριος, and ἐν ἐκείνῃ τῇ ἡμέρᾳ
  rationale: Reordering the clause avoids a difficult relative construction without changing its meaning.
- pob_phrase: and not only to me, but also to all who have loved his appearing
  simplified_phrase: He will award it not only to me, but also to everyone who has loved his appearing
  preserved_meaning: The same award extends to all who have a settled love for the Lord’s appearing.
  reasoning_layer_used: Lexical decisions for πᾶσιν τοῖς ἠγαπηκόσι and ἐπιφάνειαν
  rationale: Repeating the verb makes the contrast between recipients immediately clear.
translation_notes:
  risk_flags:
  - risk: “Crown of righteousness” can carry several related meanings.
    mitigation: The wording does not choose among reward for righteousness, resulting righteousness, or vindication.
  - risk: “Appearing” may be less familiar than “coming.”
    mitigation: It remains because it preserves the source term’s manifestation imagery.
