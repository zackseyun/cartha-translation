simplification_decisions:
- pob_phrase: Make every effort to come before winter.
  simplified_phrase: Do everything you can to come before winter.
  preserved_meaning: Timothy is urged to make an earnest and intentional effort to arrive before winter.
  reasoning_layer_used: The lexical decision for Σπούδασον emphasizes both urgency and intentionality.
  rationale: The new wording expresses the urgent command in more familiar English.
- pob_phrase: Eubulus sends greetings to you, and so do Pudens and Linus and Claudia and all the brothers.
  simplified_phrase: Eubulus sends you his greetings. Pudens, Linus, Claudia, and all the brothers send their greetings too.
  preserved_meaning: Each named person and all the brothers send greetings to Timothy.
  reasoning_layer_used: The lexical decisions preserve the epistolary sense of Ἀσπάζεταί σε and all personal names.
  rationale: Two short sentences make the long list easier to follow without merging its members.
translation_notes:
  risk_flags:
  - risk: “Do everything you can” may sound slightly more absolute than the Greek imperative.
    mitigation: It is bounded by the stated purpose of coming before winter and preserves the audited sense of earnest effort.
  - risk: “Brothers” may be understood as excluding women from the believing group.
    mitigation: The main text follows POB’s gender-accurate policy, while the footnote preserves the inclusive possibility.
