simplification_decisions:
- pob_phrase: The Lord be with your spirit
  simplified_phrase: May the Lord be with your spirit
  preserved_meaning: This remains a blessing asking that the Lord be with Timothy’s human spirit.
  reasoning_layer_used: Lexical decisions for μετὰ and πνεύματός
  rationale: “May” makes the implied blessing form clear in natural English.
- pob_phrase: Grace be with you all
  simplified_phrase: May grace be with all of you
  preserved_meaning: Paul’s grace wish extends to the wider group, not only to Timothy.
  reasoning_layer_used: Lexical and theological decisions for χάρις and plural ὑμῶν
  rationale: “All of you” clearly communicates the plural while keeping the weighty term “grace.”
translation_notes:
  risk_flags:
