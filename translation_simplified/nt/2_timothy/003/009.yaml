simplification_decisions:
- pob_phrase: will not advance any further
  simplified_phrase: will get no further
  preserved_meaning: Their progress will be halted without suggesting that their work is good.
  reasoning_layer_used: Lexical decisions for προκόψουσιν and ἐπὶ πλεῖον
  rationale: The common expression “get no further” clearly preserves the progress metaphor and its limit.
- pob_phrase: their foolishness will be plain to everyone
  simplified_phrase: their foolishness will become clear to everyone
  preserved_meaning: Everyone will recognize their lack of understanding.
  reasoning_layer_used: Lexical decisions for ἄνοια, ἔκδηλος, and πᾶσιν
  rationale: “Become clear” naturally expresses that their foolishness will be exposed.
- pob_phrase: as that of those men also became
  simplified_phrase: just as the foolishness of those men did
  preserved_meaning: Their exposure is compared with the earlier exposure of Jannes and Jambres.
  reasoning_layer_used: Elliptical-clause rationale and theological referent decision
  rationale: Repeating “foolishness” removes an awkward ellipsis while retaining the comparison.
