translation:
  language: en
  text: Every Scripture[a] is God-breathed and useful for teaching, showing what is wrong, setting things right, and training people to live rightly.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may also be translated, “All Scripture.”
    reason: alternative_reading
  - marker: b
    text: Another possible reading is, “Every God-breathed Scripture is also useful for teaching, showing what is wrong, setting things right, and training people to live rightly.”
