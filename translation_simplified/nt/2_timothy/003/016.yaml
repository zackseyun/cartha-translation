simplification_decisions:
- pob_phrase: profitable
  simplified_phrase: useful
  preserved_meaning: Scripture benefits people for the purposes that follow.
  reasoning_layer_used: Lexical decision for ὠφέλιμος
  rationale: “Useful” is the clearest common-English alternative already recognized by POB.
- pob_phrase: for reproof
  simplified_phrase: showing what is wrong
  preserved_meaning: Scripture exposes error and brings faults to light.
  reasoning_layer_used: Lexical decision for ἐλεγμός
  rationale: The expanded wording communicates the corrective sense without the uncommon term “reproof.”
- pob_phrase: for correction
  simplified_phrase: setting things right
  preserved_meaning: Scripture corrects what is wrong and restores it to an upright state.
  reasoning_layer_used: Lexical decision for ἐπανόρθωσις
