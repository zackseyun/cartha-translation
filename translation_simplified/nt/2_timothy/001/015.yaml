simplification_decisions:
- pob_phrase: 'You know this:'
  simplified_phrase: You know that
  preserved_meaning: Timothy already knows the fact Paul is about to state.
  reasoning_layer_used: Lexical decision for Οἶδας, τοῦτο, and ὅτι
  rationale: The content clause is clearer in ordinary English than the colon construction.
- pob_phrase: among whom are Phygelus and Hermogenes
  simplified_phrase: Phygelus and Hermogenes are among them
  preserved_meaning: The two named men belong to the larger group that turned away.
  reasoning_layer_used: Lexical decision for ὧν ἐστιν
  rationale: A separate sentence makes the relationship easier to follow.
translation_notes:
  risk_flags:
  - risk: “All those in Asia” could be mistaken for every person in the province without exception.
    mitigation: The wording preserves the source’s broad force without adding a qualifier that would settle its contextual scope.
