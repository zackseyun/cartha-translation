simplification_decisions:
- pob_phrase: a spirit of cowardice
  simplified_phrase: a cowardly spirit
  preserved_meaning: God does not give believers the shameful fearfulness expressed by the Greek term.
  reasoning_layer_used: lexical decision for δειλία and theological decision on πνεῦμα
  rationale: The adjective form is more natural while retaining both the strong moral force and the word “spirit.”
- pob_phrase: but of power and love and self-control
  simplified_phrase: He gave us a spirit of power, love, and self-control
  preserved_meaning: The positive qualities stand in direct contrast to cowardice and describe the spirit God gives.
  reasoning_layer_used: source syntax and lexical decisions for the three qualities
  rationale: A new sentence makes the contrast explicit without merging the three distinct qualities.
translation_notes:
  risk_flags:
  - risk: Readers may take “spirit” as a direct title for the Holy Spirit.
    mitigation: The indefinite lowercase phrase “a spirit” preserves POB’s disposition reading without denying the Spirit’s work.
