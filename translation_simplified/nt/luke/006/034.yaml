  preserved_meaning: The lender expects the borrower to return what was lent.
  reasoning_layer_used: Lexical decision for ἐλπίζετε λαβεῖν in the context of lending
  rationale: “Repay you” states the financial relationship in ordinary English.
- pob_phrase: so that they may receive back
  simplified_phrase: so they can get back
  preserved_meaning: Sinners lend with the aim of recovering what they lent.
  reasoning_layer_used: Lexical decision for ἵνα ἀπολάβωσιν
  rationale: “Get back” is clearer while retaining the purpose of the loan.
