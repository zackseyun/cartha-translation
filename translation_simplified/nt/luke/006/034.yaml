translation:
  language: en
  text: If you lend to people you expect will repay you, what credit is that to you?[a] Even sinners lend to other sinners so they can get back the same amount.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “what thanks is that to you?” The Greek word likely means credit or favorable regard here.
    reason: lexical_alternative
