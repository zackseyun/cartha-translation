translation:
  language: en
  text: Give, and it will be given to you. They will give you a good measure—pressed down, shaken so it settles, and overflowing[a]—into your lap.[b] The measure you use will be used to measure back to you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “running over.” The container is so full that its contents spill over.
    reason: lexical_alternative
  - marker: b
    text: “Lap” means the front fold of a robe, which people could use to hold measured goods.
    reason: cultural_note
simplification_decisions:
- pob_phrase: a good measure—pressed down, shaken together, overflowing—they will give into your lap
  simplified_phrase: They will give you a good measure—pressed down, shaken so it settles, and overflowing—into your lap.
  preserved_meaning: The image remains of goods packed, settled, and filled beyond the container’s capacity.
  reasoning_layer_used: Lexical decisions for the measure imagery, the unspecified plural agent, and the garment fold.
  rationale: The reordered sentence and brief explanation of shaking make the image easier to follow without specifying how the goods are transferred.
- pob_phrase: For with the measure by which you measure, it will be measured back to you.
  simplified_phrase: The measure you use will be used to measure back to you.
  preserved_meaning: The measuring image still expresses reciprocal treatment.
  reasoning_layer_used: Lexical decision for reciprocal measuring and the theological decision to keep the saying broad.
  rationale: The natural syntax preserves the principle without limiting it to money.
interpretive_expansions:
- pob_phrase: shaken together
  rendering: shaken so it settles
  claim: The shaking causes the measured goods to settle in the container.
  evidence:
  - The POB lexical rationale identifies goods settling through shaking.
  confidence: high
  alternatives_preserved:
  - shaken together
translation_notes:
  risk_flags:
  - risk: Modern readers may understand “lap” only as part of the body.
    mitigation: Footnote [b] explains the robe-fold image.
  - risk: The promise could be misread as a guarantee of financial prosperity.
    mitigation: The wording remains broad and adds no reference to money or wealth.
