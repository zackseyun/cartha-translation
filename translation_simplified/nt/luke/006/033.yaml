translation:
  language: en
  text: If you do good only to people who do good to you, why should you receive any credit for that?[a] Even sinners do the same.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word translated “credit” can also mean “grace,” “favor,” or “thanks”; here it means commendation for returning kindness.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And if you do good to those who do good to you
  simplified_phrase: If you do good only to people who do good to you
  preserved_meaning: The action remains reciprocal goodness rather than goodness extended beyond those who benefit you.
  reasoning_layer_used: POB lexical decisions and immediate context
  rationale: “People” is more natural than “those,” while “only” makes the reciprocal limit clear.
- pob_phrase: what credit is that to you?
  simplified_phrase: why should you receive any credit for that?
  preserved_meaning: The question asks what commendation is deserved for merely reciprocal kindness.
  reasoning_layer_used: POB lexical and theological decisions on χάρις
  rationale: The recast question explains the idiom without giving χάρις a saving-grace sense.
interpretive_expansions:
- pob_phrase: if you do good to those who do good to you
  rendering: If you do good only to people who do good to you
  claim: The saying concerns goodness restricted to people who first or likewise do good to the hearer.
  evidence:
  - The repeated forms of ἀγαθοποιέω create an explicitly reciprocal relationship.
  - The POB rationale identifies the action as reciprocal kindness.
  confidence: high
