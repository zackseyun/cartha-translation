translation:
  language: en
  text: If someone hits you on one cheek, offer the other cheek too. If someone takes away your outer garment, do not hold back your inner garment either.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: To the one who strikes you on the cheek
  simplified_phrase: If someone hits you on one cheek
  preserved_meaning: The command addresses anyone struck in the face.
  reasoning_layer_used: Lexical decision for τῷ τύπτοντί and ἐπὶ τὴν σιαγόνα
  rationale: The conditional form and common verb make the generic situation immediately clear.
- pob_phrase: offer the other also
  simplified_phrase: offer the other cheek too
  preserved_meaning: Jesus commands the hearer to present the other cheek rather than retaliate.
  reasoning_layer_used: Lexical and theological decision for πάρεχε
  rationale: Repeating “cheek” clarifies the reference while retaining Luke’s distinct verb “offer.”
- pob_phrase: cloak ... tunic
  simplified_phrase: outer garment ... inner garment
  preserved_meaning: The second item is the garment worn beneath the first.
  reasoning_layer_used: Lexical decisions for ἱμάτιον and χιτών
  rationale: Functional clothing terms preserve the contrast without requiring knowledge of ancient dress.
