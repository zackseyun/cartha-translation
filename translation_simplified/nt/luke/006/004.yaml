simplification_decisions:
- pob_phrase: entered into the house of God
  simplified_phrase: went into the house of God
  preserved_meaning: David entered the place identified in Scripture as God's house.
  reasoning_layer_used: POB lexical decision for εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ
  rationale: “Went into” expresses the same movement in more natural common English while retaining “house of God.”
- pob_phrase: took and ate the bread of the Presence
  simplified_phrase: took the Bread of the Presence, and ate it
  preserved_meaning: David took and ate the sacred bread set before God.
  reasoning_layer_used: POB lexical decisions for ἄρτους τῆς προθέσεως and λαβὼν ἔφαγεν
  rationale: The pronoun separates the actions clearly while preserving the sacred bread's established name.
- pob_phrase: which it is not lawful to eat except for the priests alone
  simplified_phrase: even though the law allowed only the priests to eat that bread
  preserved_meaning: Israel's worship law reserved this sacred bread exclusively for priests.
  reasoning_layer_used: POB theological decision on the cultic and legal restriction
  rationale: The active wording makes the legal restriction immediately understandable without reducing it to custom.
