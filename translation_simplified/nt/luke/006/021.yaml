simplification_decisions:
- pob_phrase: Blessed are you who are hungry now
  simplified_phrase: You who are hungry now are blessed
  preserved_meaning: Jesus directly declares his presently hungry hearers blessed.
  reasoning_layer_used: POB lexical and theological decisions on direct address
  rationale: Putting “you” first makes the direct address easier to follow while retaining “blessed.”
- pob_phrase: Blessed are you who weep now
  simplified_phrase: You who weep now are blessed
  preserved_meaning: Jesus directly declares his presently weeping hearers blessed.
  reasoning_layer_used: POB lexical decisions for οἱ κλαίοντες and κλαίω
  rationale: The reordered clause reads naturally while preserving the broad and vivid word “weep.”
- pob_phrase: you will be filled ... you will laugh
  simplified_phrase: you will be filled ... you will laugh
  preserved_meaning: The present suffering will be reversed in a concrete but otherwise undefined way.
  reasoning_layer_used: POB theological decision on the nature of the promised reversal
  rationale: The concrete promises remain unchanged so their timing and mode are not overexplained.
translation_notes:
  risk_flags:
  - risk: Readers may assume the promises describe only material or immediate relief.
    mitigation: The text keeps the concrete images without specifying when or how the reversal occurs.
