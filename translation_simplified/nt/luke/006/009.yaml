translation:
  language: en
  text: 'But Jesus said, “Here is my question for you: On the Sabbath, which does the law allow—doing good or doing harm? Saving a life[a] or destroying it?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word can also mean “soul,” but here it refers to a person’s life.
    reason: lexical_alternative
