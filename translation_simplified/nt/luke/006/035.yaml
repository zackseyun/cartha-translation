translation:
  language: en
  text: But love your enemies. Do good, and lend without expecting anything back.[a] Your reward will be great, and you will be sons of the Most High,[b] because he is kind to people who are ungrateful and evil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek phrase is difficult and may instead mean “never losing hope” or “despairing of no one.”
    reason: lexical_alternative
  - marker: b
    text: “Sons” translates the masculine plural Greek term and can represent all who belong to the Most High.
    reason: lexical_alternative
