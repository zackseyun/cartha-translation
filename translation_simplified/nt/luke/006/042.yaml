translation:
  language: en
  text: How can you say to your brother[a], “Brother, let me take the speck out of your eye”? You do not even see the large wooden beam in your own eye. You hypocrite! First take the beam out of your own eye. Then you will see clearly and can take the speck out of your brother’s eye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Brother” reflects the masculine singular wording of the Greek; the teaching may apply more broadly.
    reason: cultural_note
simplification_decisions:
- pob_phrase: while you yourself do not see the beam that is in your own eye
  simplified_phrase: You do not even see the large wooden beam in your own eye.
  preserved_meaning: The wording keeps the emphatic contrast between correcting another person and failing to see one’s own much greater fault.
  reasoning_layer_used: Lexical decisions for αὐτός, οὐ βλέπων, and δοκός
  rationale: A separate sentence clarifies the rebuke, while “even” preserves the emphasis on the person’s own blindness.
- pob_phrase: the beam
  simplified_phrase: the large wooden beam
  preserved_meaning: The object remains a substantial piece of timber contrasted with a tiny speck.
  reasoning_layer_used: Lexical and theological decisions for the κάρφος–δοκός contrast
  rationale: “Large wooden” makes the exaggerated image immediately understandable.
- pob_phrase: and then you will see clearly to take out the speck
  simplified_phrase: Then you will see clearly and can take the speck out
  preserved_meaning: After correcting himself, the person will see clearly and be able to help his brother.
  reasoning_layer_used: Lexical decisions for τότε and διαβλέψεις
  rationale: The recast preserves clear sight as the stated result and expresses the following action naturally.
translation_notes:
  risk_flags:
  - risk: “Even” is not a separate lexical item in the Greek.
    mitigation: It conveys the emphasis of αὐτός already represented by POB’s “you yourself.”
  - risk: “Can take” makes the practical result of clear sight explicit.
    mitigation: It preserves the source sequence without reducing “see clearly” to mere sufficiency.
