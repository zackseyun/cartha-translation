simplification_decisions:
- pob_phrase: lifting up his eyes toward his disciples
  simplified_phrase: looked up at his disciples
  preserved_meaning: He directed his raised gaze toward his disciples.
  reasoning_layer_used: Lexical decisions for ἐπάρας and εἰς
  rationale: The natural English expression keeps the concrete action and direction of his gaze.
- pob_phrase: was saying
  simplified_phrase: began to speak
  preserved_meaning: The imperfect introduces Jesus’ continuing speech.
  reasoning_layer_used: Lexical decision for ἔλεγεν
  rationale: This avoids an awkward progressive form while preserving the introductory aspect.
- pob_phrase: Blessed are the poor, because yours is the kingdom of God
  simplified_phrase: Blessed are you who are poor, because the kingdom of God is yours
  preserved_meaning: Jesus directly blesses the poor disciples because God’s kingdom belongs to them.
  reasoning_layer_used: Lexical and theological decisions on οἱ πτωχοί and ὑμετέρα
  rationale: The reordered wording makes the direct address clear without adding Matthew’s spiritual qualifier.
translation_notes:
