translation:
  language: en
  text: 'He looked up at his disciples and began to speak: “Blessed are you who are poor,[a] because the kingdom of God is yours.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Luke says simply “poor,” not “poor in spirit” (compare Matthew 5:3).
