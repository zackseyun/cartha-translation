- pob_phrase: Woe to you who are full now[a]
  simplified_phrase: Woe to you who are full now
  preserved_meaning: The warning addresses people who are presently full and will face future hunger.
  reasoning_layer_used: Lexical decisions for οὐαί, ἐμπεπλησμένοι, and νῦν
  rationale: Retaining “are full now” clearly preserves the present state and the coming reversal.
- pob_phrase: because you will be hungry
  simplified_phrase: because you will be hungry
  preserved_meaning: Future deprivation is the stated reason for the prophetic warning.
  reasoning_layer_used: Lexical decisions for ὅτι and πεινάσετε and the theological decision on coming reversal
  rationale: The explicit “because” keeps the causal force clear in ordinary English.
- pob_phrase: Woe to you who are laughing now[b], because you will mourn and weep
  simplified_phrase: Woe to you who are laughing now, because you will mourn and weep
  preserved_meaning: Present laughter will be reversed into both mourning and weeping.
  reasoning_layer_used: Lexical decisions for γελῶντες, πενθήσετε, and κλαύσετε
  rationale: The wording remains direct while preserving the two distinct expressions of grief.
