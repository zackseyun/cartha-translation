simplification_decisions:
- pob_phrase: and from the one who takes what is yours
  simplified_phrase: If someone takes what belongs to you
  preserved_meaning: The command applies when another person takes something that is yours.
  reasoning_layer_used: POB lexical decisions for ἀπὸ τοῦ αἴροντος and τὰ σὰ
  rationale: The conditional form removes the awkward clause order without narrowing the action to theft.
- pob_phrase: Give to everyone who asks you, and ... do not demand it back
  simplified_phrase: Give to everyone who asks you. If ... do not demand it back.
  preserved_meaning: Jesus gives two broad, direct commands without explaining away their ethical force.
  reasoning_layer_used: POB theological decision on scope and force
  rationale: Two sentences make the commands easier to follow while preserving their breadth and tension.
translation_notes:
  risk_flags:
  - risk: “If someone takes” could be understood only as theft.
    mitigation: The wording avoids “steals” and leaves the kind of taking unspecified, as POB requires.
  - risk: The universal command may invite readers to supply exceptions.
    mitigation: The main text keeps “everyone” and states both imperatives without qualification.
