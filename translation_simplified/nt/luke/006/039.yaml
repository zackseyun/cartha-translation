translation:
  language: en
  text: 'He also gave them this parable: “Can one blind man guide another?[a] Won’t they both fall into a pit?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “one blind person guide another.” The Greek uses masculine singular forms as a general example.
    reason: lexical_alternative
  - marker: b
    text: Or “ditch.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: told them a parable
  simplified_phrase: gave them this parable
  preserved_meaning: He added a figurative saying addressed to them.
  reasoning_layer_used: The lexical decisions retain both the additive force of “also” and the recognized genre “parable.”
  rationale: This wording introduces the saying more naturally without changing its role.
- pob_phrase: a blind man guide a blind man
  simplified_phrase: one blind man guide another
  preserved_meaning: The image remains one blind man attempting to direct another blind man.
  reasoning_layer_used: The lexical and theological decisions require the masculine singular image with representative force.
  rationale: “One ... another” removes repetition while preserving both people and the generic masculine wording.
- pob_phrase: Will not both fall into a pit?
  simplified_phrase: Won’t they both fall into a pit?
  preserved_meaning: The question expects agreement that both will fall.
  reasoning_layer_used: The lexical decisions identify οὐχί as marking a rhetorical question expecting a positive answer.
  rationale: The contraction and explicit pronoun make the question sound natural in modern English.
