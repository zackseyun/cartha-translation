translation:
  language: en
  text: I was afraid of you because you are a harsh man. You take what you did not put there, and you reap what you did not sow.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: for I was afraid of you
  simplified_phrase: I was afraid of you because
  preserved_meaning: The servant gives fear as the reason for his previous action.
  reasoning_layer_used: Lexical decision for γάρ and sentence-level readability
  rationale: Moving the explanatory link into “because” makes the sentence easier to follow.
- pob_phrase: a severe man
  simplified_phrase: a harsh man
  preserved_meaning: The servant accuses the master of being strict and exacting.
  reasoning_layer_used: Lexical decision for αὐστηρός and theological decision to retain the accusation
  rationale: “Harsh” is common English and keeps the servant’s negative force.
- pob_phrase: you take what you did not put down
  simplified_phrase: You take what you did not put there
  preserved_meaning: The master is accused of taking something he did not place or provide.
  reasoning_layer_used: Lexical decision for αἴρω and τίθημι
  rationale: “Put there” preserves the broad concrete image without implying a specific kind of deposit.
translation_notes:
  risk_flags:
  - risk: “Put there” remains deliberately broad and may not make the economic setting explicit.
    mitigation: The wording follows the POB decision not to import the narrower idea of a deposit.
