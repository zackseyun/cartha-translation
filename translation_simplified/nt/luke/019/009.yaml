simplification_decisions:
- pob_phrase: And Jesus said to him
  simplified_phrase: Jesus told him
  preserved_meaning: Jesus directly addressed the man.
  reasoning_layer_used: The lexical decision identifies the opening conjunction as a mild narrative connector and preserves the explicit pronoun.
  rationale: Removing “And” and using “told” makes the opening more natural without changing the speech event.
- pob_phrase: this house
  simplified_phrase: this house[a]
  preserved_meaning: Salvation has reached the house and may include its household.
  reasoning_layer_used: The lexical decision retains “house” while noting the broader social sense.
  rationale: The anchored footnote preserves the important household alternative in plain language.
- pob_phrase: a son of Abraham
  simplified_phrase: a son of Abraham
  preserved_meaning: The covenantal identity expression remains open to ethnic descent, faithful belonging, or both.
  reasoning_layer_used: The theological decision requires preserving the phrase without resolving its tension.
  rationale: Keeping the biblical expression avoids narrowing its meaning to only ancestry or faith.
