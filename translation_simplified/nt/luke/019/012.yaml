translation:
  language: en
  text: So he said, “A nobleman set out for a faraway country to receive a kingdom[a] for himself and return.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “kingdom” may also mean “kingship” or “royal power.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: A certain nobleman went
  simplified_phrase: A nobleman set out
  preserved_meaning: An indefinite man of high birth began the journey.
  reasoning_layer_used: Lexical decisions for Ἄνθρωπός τις, εὐγενής, and ἐπορεύθη.
  rationale: The indefinite article already introduces the character, while “set out” naturally begins his journey.
- pob_phrase: to a distant country
  simplified_phrase: for a faraway country
  preserved_meaning: He traveled to a remote land.
  reasoning_layer_used: Lexical decision for εἰς χώραν μακράν.
  rationale: “Faraway country” is immediate, common English for the same geographical distance.
translation_notes:
  risk_flags:
  - risk: “Kingdom” can suggest only a territory rather than royal authority.
    mitigation: The anchored footnote preserves the documented alternatives “kingship” and “royal power.”
