translation:
  language: en
  text: He called ten of his own servants[a] and gave them ten ancient units of money.[b] He said, “Do business with this money until I return.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word can also be translated “servants” or “bondservants,” but here it describes people who belonged to a master.
    reason: alternative_reading
