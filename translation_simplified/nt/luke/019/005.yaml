translation:
  language: en
  text: When Jesus reached that spot, he looked up and said, “Zacchaeus, hurry down, because I must stay at your house today.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Must” expresses a strong necessity that may be connected with Jesus’ mission or God’s purpose.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: came to the place
  simplified_phrase: reached that spot
  preserved_meaning: Jesus arrived at Zacchaeus’s location.
  reasoning_layer_used: The lexical decision identifies the phrase as a straightforward reference to the location.
  rationale: “Reached that spot” makes the scene easier to picture in natural English.
- pob_phrase: hurry and come down
  simplified_phrase: hurry down
  preserved_meaning: Jesus urgently commands Zacchaeus to descend.
  reasoning_layer_used: The lexical decision says the construction conveys urgency through a coordinated English command.
  rationale: “Hurry down” keeps both the urgency and movement without redundant wording.
- pob_phrase: because today I must stay at your house
  simplified_phrase: because I must stay at your house today
  preserved_meaning: Jesus gives his necessary visit that day as the reason Zacchaeus must hurry.
  reasoning_layer_used: The lexical and theological decisions preserve the causal force, the timing, and the strong necessity of δεῖ.
  rationale: Moving “today” to the end gives the same meaning in smoother English.
translation_notes:
  risk_flags:
  - risk: Readers may understand “must” as merely a practical need.
    mitigation: The footnote preserves its possible connection with Jesus’ mission or God’s purpose.
