- pob_phrase: The Lord has need of it
  simplified_phrase: The Lord needs it
  preserved_meaning: The Lord requires the colt for his purpose.
  reasoning_layer_used: The lexical decision lists “needs” as the clear equivalent while the theological decision requires “Lord.”
  rationale: The common verb “needs” removes an old-fashioned idiom without weakening the statement.
