simplification_decisions:
- pob_phrase: And they said
  simplified_phrase: They said
  preserved_meaning: The disciples continue the narrative by speaking their reply.
  reasoning_layer_used: The lexical decision identifies δέ as a mild narrative connective that need not be separately expressed in natural English.
  rationale: Omitting “And” makes the short sentence more direct without changing the sequence.
- pob_phrase: has need of it
  simplified_phrase: needs it
  preserved_meaning: The Lord requires the colt for his purpose.
  reasoning_layer_used: The lexical decision explicitly allows “needs” as an idiomatic rendering of χρείαν ἔχει.
  rationale: The ordinary verb “needs” communicates the same meaning more clearly.
