simplification_decisions:
- pob_phrase: as he drew near
  simplified_phrase: as he came near
  preserved_meaning: He was moving closer to Jerusalem.
  reasoning_layer_used: Lexical decision for ὡς ἤγγισεν
  rationale: “Came near” is more familiar than “drew near” without adding an object.
- pob_phrase: seeing the city, he wept over it
  simplified_phrase: and saw the city, he wept over it
  preserved_meaning: Seeing the city was directly connected to his weeping over it.
  reasoning_layer_used: Lexical decisions for ἰδὼν, ἔκλαυσεν, and ἐπ’ αὐτήν
  rationale: Finite verbs are easier to follow while “as” keeps the actions closely connected.
translation_notes:
  risk_flags:
  - risk: Using “and saw” may sound more sequential than the Greek participle.
    mitigation: The opening “as” keeps the approach, sight, and weeping closely connected.
  - risk: The alternative “her” may suggest definite personification.
    mitigation: The footnote presents personification only as a possibility grounded in the feminine wording.
