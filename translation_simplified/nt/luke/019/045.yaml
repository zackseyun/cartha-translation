- pob_phrase: And entering the temple
  simplified_phrase: When he entered the temple
  preserved_meaning: He entered the temple before beginning to drive out the sellers.
  reasoning_layer_used: The lexical decision for εἰσελθὼν identifies antecedent action and permits “when he entered.”
  rationale: A complete time clause is clearer than the opening participial phrase.
- pob_phrase: those who were selling
  simplified_phrase: the people who were selling
  preserved_meaning: The objects of Jesus’ action were people engaged in selling, without specifying what they sold.
  reasoning_layer_used: The lexical decision for πωλοῦντας preserves both the people and their ongoing activity.
  rationale: Adding “people” makes the referent immediately clear in common English.
