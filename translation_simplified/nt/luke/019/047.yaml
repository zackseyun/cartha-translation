translation:
  language: en
  text: Every day he taught in the temple. But the chief priests, the scribes, and the leading men of the people[a] kept looking for a way to destroy him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the leaders of the people.” The phrase refers to prominent and influential men among the people.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: he was teaching day by day
  simplified_phrase: Every day he taught
  preserved_meaning: Jesus repeatedly taught there from day to day.
  reasoning_layer_used: Lexical decision for ἦν διδάσκων and τὸ καθ’ ἡμέραν
  rationale: The simpler wording preserves both the repeated action and its daily frequency.
- pob_phrase: were seeking to destroy him
  simplified_phrase: kept looking for a way to destroy him
  preserved_meaning: The leaders were making an ongoing effort to bring about Jesus’ destruction.
  reasoning_layer_used: Lexical decisions for ἐζήτουν and ἀπολέσαι
  rationale: “Kept looking” makes the continuing attempt clear while retaining “destroy.”
- pob_phrase: the leading men of the people
  simplified_phrase: the leading men of the people[a]
  preserved_meaning: The group consisted of prominent male members of the populace.
  reasoning_layer_used: Lexical and theological decisions for οἱ πρῶτοι τοῦ λαοῦ
  rationale: The main text keeps the gendered historical reference, while the note explains the social-status sense.
