translation:
  language: en
  text: After he received the kingdom and returned, he called in the slaves[a] to whom he had given the money. He wanted to find out what they had earned by trading.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “servants.” The Greek word can mean either servants or slaves; “slaves” reflects their bonded status under the nobleman.
    reason: lexical_alternative
