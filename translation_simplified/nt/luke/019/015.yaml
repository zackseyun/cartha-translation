- pob_phrase: And it happened, when he returned after receiving the kingdom
  simplified_phrase: After he received the kingdom and returned
  preserved_meaning: He returned only after receiving royal rule.
  reasoning_layer_used: Lexical decisions for ἐγένετο, ἐπανελθεῖν, and λαβόντα τὴν βασιλείαν
  rationale: The narrative formula is omitted because natural English can state the sequence directly.
- pob_phrase: he ordered these slaves ... to be called to him
  simplified_phrase: he called in the slaves
  preserved_meaning: The ruler summoned the slaves under his authority.
  reasoning_layer_used: Lexical decision for φωνηθῆναι and theological decision for δούλους
  rationale: The active wording removes a dense passive construction while retaining the command and bonded status.
- pob_phrase: so that he might know what they had gained by trading
  simplified_phrase: He wanted to find out what they had earned by trading.
  preserved_meaning: His purpose was to learn the result of their commercial activity.
  reasoning_layer_used: Lexical decisions for ἵνα γνοῖ and διεπραγματεύσαντο
  rationale: A separate sentence and common verbs make the purpose and trading result immediately clear.
