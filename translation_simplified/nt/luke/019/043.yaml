translation:
  language: en
  text: For the days are coming when your enemies will build a siege rampart against you. They will surround you and close you in from every side.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: days will come upon you when
  simplified_phrase: the days are coming when
  preserved_meaning: A time of impending judgment is approaching Jerusalem.
  reasoning_layer_used: Lexical decisions for ἥξουσιν ἡμέραι and ἐπὶ σὲ
  rationale: The familiar prophetic expression becomes easier to follow without weakening its warning.
- pob_phrase: build an embankment against you
  simplified_phrase: build a siege rampart against you
  preserved_meaning: The enemies will construct raised military works against the city.
  reasoning_layer_used: Lexical decisions for παρεμβαλοῦσιν, χάρακα, and σοι
  rationale: “Siege rampart” clearly preserves the specific image of constructed siege works.
- pob_phrase: hem you in on every side
  simplified_phrase: close you in from every side
  preserved_meaning: The city will be completely encircled and confined.
  reasoning_layer_used: Lexical decisions for συνέξουσίν and πάντοθεν
  rationale: “Close you in” is immediately understandable and retains the pressure of total encirclement.
translation_notes:
  risk_flags:
  - risk: Some readers may not know the term “rampart.”
    mitigation: The word “siege” and the surrounding actions make its military function clear.
  - risk: Readers may understand singular “you” as one individual.
    mitigation: The singular remains because Jesus addresses Jerusalem as a personified city.
