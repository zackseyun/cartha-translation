translation:
  language: en
  text: They will level you to the ground, together with your children inside you. They will not leave one stone on another within you, because you did not recognize the time when you were visited.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the time when you were inspected.” The Greek can refer to a visitation or inspection, especially one from God that brings mercy or judgment.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: and they will level you to the ground, and your children within you
  simplified_phrase: They will level you to the ground, together with your children inside you.
  preserved_meaning: Jerusalem is addressed as a mother-city whose people share in her destruction.
  reasoning_layer_used: Lexical decisions for ἐδαφιοῦσίν, σε, and τὰ τέκνα σου ἐν σοί
  rationale: The rewrite clarifies who is included while preserving the force of destruction and the city-personification image.
- pob_phrase: they will not leave one stone upon another within you
  simplified_phrase: They will not leave one stone on another within you
  preserved_meaning: The attackers will bring total physical destruction within Jerusalem.
  reasoning_layer_used: Lexical decision for οὐκ ἀφήσουσιν λίθον ἐπὶ λίθον ἐν σοί
  rationale: “On” is more natural than “upon” while retaining the vivid stone-by-stone image.
- pob_phrase: the time of your visitation
  simplified_phrase: the time when you were visited
  preserved_meaning: Jerusalem failed to recognize a decisive visitation whose divine significance remains implicit.
  reasoning_layer_used: Lexical and theological decisions for καιρός and ἐπισκοπή
  rationale: The clause is easier to understand, while the passive wording and footnote preserve the term’s ambiguity.
translation_notes:
  risk_flags:
  - risk: Modern readers may take “children” to mean only young people.
    mitigation: The wording retains the audited mother-city image rather than flattening it to “inhabitants.”
  - risk: Changing the noun “visitation” to a passive clause may reduce its biblical-theological resonance.
    mitigation: The footnote preserves the visitation or inspection alternatives and their possible divine sense.
