  preserved_meaning: Zacchaeus was physically short rather than young.
  reasoning_layer_used: lexical decision and POB footnote for τῇ ἡλικίᾳ μικρὸς ἦν
  rationale: “Short” clearly expresses the contextually supported meaning without the formal phrase “small in stature.”
- pob_phrase: And he was trying to see who Jesus was ...
  simplified_phrase: He was trying to see who Jesus was. But ...
  preserved_meaning: Zacchaeus made an ongoing effort to see Jesus and learn who he was.
  reasoning_layer_used: lexical decisions for ἐζήτει, ἰδεῖν, and τίς ἐστιν
  rationale: Two sentences make the contrast easier to follow while retaining the ongoing effort and the wording’s ambiguity.
