simplification_decisions:
- pob_phrase: saying
  simplified_phrase: They said
  preserved_meaning: The crowd continued its spoken acclamation from the previous verse.
  reasoning_layer_used: Lexical decision for λέγοντες and immediate syntax
  rationale: A complete finite clause reads naturally when the verse stands alone.
- pob_phrase: Blessed is the King who comes
  simplified_phrase: The King who comes ... is blessed
  preserved_meaning: The explicit royal title and blessing remain central.
  reasoning_layer_used: Lexical and theological decisions for Εὐλογημένος and βασιλεὺς
  rationale: Ordinary English word order removes the formal inversion without weakening Luke’s royal emphasis.
- pob_phrase: Peace in heaven and glory in the highest
  simplified_phrase: There is peace in heaven and glory in the highest heaven
  preserved_meaning: Peace remains located in heaven, while glory belongs to the highest heavenly realm.
  reasoning_layer_used: Lexical decisions and the Luke 2:14 cross-check
  rationale: Supplying the implied verb and naming the realm makes the poetic clause immediately understandable.
