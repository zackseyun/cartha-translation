translation:
  language: en
  text: But Zacchaeus stood and said to the Lord, “Look, Lord! I give half of everything I own to the poor. And if I have extorted anything from anyone,[a] I repay four times as much.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “defrauded anyone of anything.” The Greek verb can include extortion, exploitation, or fraud, sometimes through false accusation.
    reason: lexical_alternative
  - marker: b
    text: 'The Greek present-tense verbs may also express immediate resolve: “I will give” and “I will repay.”'
    reason: alternative_reading
