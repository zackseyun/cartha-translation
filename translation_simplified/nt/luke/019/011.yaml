  simplified_phrase: While they were listening
  preserved_meaning: Their listening was still in progress when Jesus continued speaking.
  reasoning_layer_used: Lexical decision on the present participle
  rationale: “While they were listening” expresses simultaneous, ongoing action in natural English.
- pob_phrase: he went on and told a parable
  simplified_phrase: Jesus went on to tell them a parable
  preserved_meaning: Jesus continued his teaching by giving a parable.
  reasoning_layer_used: Lexical decision on προσθεὶς εἶπεν and narrative context
  rationale: Naming Jesus and adding “them” makes the participants clear without changing the action.
- pob_phrase: because he was near Jerusalem and because they supposed
  simplified_phrase: He did this because he was near Jerusalem, and they thought
  preserved_meaning: Both his location and their expectation explain why he told the parable.
  reasoning_layer_used: Syntactic and lexical decisions on the two causal phrases
  rationale: A new sentence and common verb make the two reasons easier to follow.
