translation:
  language: en
  text: While they were listening, Jesus went on to tell them a parable. He did this because he was near Jerusalem, and they thought the kingdom of God was going to appear immediately.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “was going to be revealed immediately.” The verb can mean becoming visible or clearly known.
    reason: lexical_alternative
