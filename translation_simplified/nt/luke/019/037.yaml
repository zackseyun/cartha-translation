translation:
  language: en
  text: He was now approaching the downward slope of the Mount of Olives. As he did, the whole crowd of disciples joyfully began to praise God in a loud voice for all the mighty works they had seen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “miracles” or “mighty deeds.” The Greek expression emphasizes acts of divine power.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: as he was already drawing near, at the descent
  simplified_phrase: He was now approaching the downward slope
  preserved_meaning: Jesus was nearing the place where the Mount of Olives slopes downward.
  reasoning_layer_used: lexical decision for ἐγγίζοντος and πρὸς τῇ καταβάσει
  rationale: The concrete phrase “downward slope” makes the location clear without fixing an exact point.
- pob_phrase: the whole multitude of the disciples
  simplified_phrase: the whole crowd of disciples
  preserved_meaning: The entire large group of disciples took part.
  reasoning_layer_used: lexical decision for ἅπαν τὸ πλῆθος τῶν μαθητῶν
  rationale: “Crowd” is more common than “multitude” while still identifying them as disciples.
- pob_phrase: began rejoicing and praising God
  simplified_phrase: joyfully began to praise God
  preserved_meaning: Their joy accompanied the beginning of their praise.
  reasoning_layer_used: lexical decision for χαίροντες and applied revision rationale
  rationale: The adverb naturally expresses the participle as the manner of their praise.
