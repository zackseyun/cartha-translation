translation:
  language: en
  text: But as for these enemies of mine—the ones who did not want me to rule over them as king—bring them here. Slaughter them in front of me.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: who did not want me to reign over them
  simplified_phrase: the ones who did not want me to rule over them as king
  preserved_meaning: They rejected the speaker's royal rule over them.
  reasoning_layer_used: Lexical decision for βασιλεύω and its documented alternative.
  rationale: “Rule over them as king” explains “reign” in common English while keeping its royal sense.
- pob_phrase: bring them here and slaughter them in front of me
  simplified_phrase: bring them here. Slaughter them in front of me.
  preserved_meaning: Both commands remain distinct, including the violent force and the speaker's visible presence.
  reasoning_layer_used: Lexical decisions for ἀγάγετε ὧδε, κατασφάξατε, and ἔμπροσθέν μου.
  rationale: Two sentences make the sequence easier to follow without softening the violence.
translation_notes:
  risk_flags:
  - risk: The direct command could be mistaken for a command by Jesus outside the parable.
    mitigation: The wording preserves the nobleman's direct speech without identifying him with Jesus or adding an interpretive hedge.
  - risk: Replacing “reign” could obscure the source verb's royal meaning.
    mitigation: “Rule over them as king” makes the royal sense explicit.
