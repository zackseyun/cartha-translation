translation:
  language: en
  text: Do you think I came to bring peace on earth? No, I tell you. I came to bring division instead.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: came to give peace on the earth
  simplified_phrase: came to bring peace on earth
  preserved_meaning: Jesus directly challenges the assumption that his coming would produce social peace.
  reasoning_layer_used: POB lexical decisions for δοῦναι and ἐν τῇ γῇ
  rationale: “Bring peace” is natural English and is a documented lexical alternative to the literal “give peace.”
- pob_phrase: No, I tell you, but rather division
  simplified_phrase: No, I tell you. I came to bring division instead.
  preserved_meaning: Jesus sharply contrasts peace with the division resulting from his coming.
  reasoning_layer_used: POB lexical and theological decisions for οὐχί, ἀλλ’ ἢ, and διαμερισμόν
  rationale: A new sentence makes the implied clause explicit while preserving the deliberate contrast.
translation_notes:
  risk_flags:
  - risk: “Bring division” may sound as though division is the whole purpose of Jesus’ mission.
    mitigation: The wording retains the source’s stark claim without adding that division is his only purpose.
