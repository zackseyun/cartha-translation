simplification_decisions:
- pob_phrase: But I say to you, my friends
  simplified_phrase: But I tell you, my friends
  preserved_meaning: Jesus directly addresses the hearers as his friends while shifting the discussion.
  reasoning_layer_used: Lexical decisions for Λέγω δὲ and ὑμῖν τοῖς φίλοις μου
  rationale: “I tell you” is more natural modern English than “I say to you.”
- pob_phrase: do not fear those who kill the body
  simplified_phrase: Do not be afraid of those who kill the body.
  preserved_meaning: Jesus forbids fear of people who can bring about bodily death.
  reasoning_layer_used: Lexical decisions for μὴ φοβηθῆτε, ἀπὸ τῶν ἀποκτεινόντων, and τὸ σῶμα
  rationale: “Do not be afraid of” states the prohibition in familiar English without weakening it.
- pob_phrase: and after that have nothing more they can do
  simplified_phrase: After that, they can do nothing more.
  preserved_meaning: Human killers have no further power beyond bodily death.
  reasoning_layer_used: Lexical decision for μὴ ἐχόντων περισσότερόν τι ποιῆσαι and the theological scope decision
  rationale: A separate sentence makes their limitation immediately clear.
