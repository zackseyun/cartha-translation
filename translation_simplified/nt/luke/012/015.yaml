  simplified_phrase: Be alert! Protect yourselves
  preserved_meaning: Jesus gives both an urgent warning and a command to guard oneself.
  reasoning_layer_used: POB lexical decisions for Ὁρᾶτε and φυλάσσεσθε
  rationale: Two short commands preserve the distinct warning and self-protection senses.
- pob_phrase: does not consist in the abundance of his possessions
  simplified_phrase: is not made up of how many possessions they have
  preserved_meaning: Life is not constituted or grounded in having abundant belongings.
  reasoning_layer_used: POB lexical decisions for οὐκ ἐν τῷ περισσεύειν τινὶ and ἐκ τῶν ὑπαρχόντων αὐτῷ
  rationale: Common wording replaces the abstract phrase while keeping abundance and possessions central.
- pob_phrase: a person’s life ... his possessions
  simplified_phrase: a person’s life ... possessions they have
  preserved_meaning: The saying applies generically to any person rather than specifically to men.
