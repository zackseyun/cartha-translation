translation:
  language: en
  text: You hypocrites! You can look at the earth and sky and tell what weather is coming. So why can’t you understand the meaning of this time?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “this season” or “this decisive time.”
    reason: lexical_alternative
