  preserved_meaning: Jesus indignantly rebukes their failure to discern the significance of their present moment.
  reasoning_layer_used: Lexical decision for καιρός and the theological decision not to over-specify its significance
  rationale: The shorter question is natural English while leaving the exact significance of “this time” open.
