translation:
  language: en
  text: For when you are going with your accuser to appear before a legal official, make every effort on the way to free yourself from his claim.[a] Otherwise, he may drag you before the judge. The judge will then hand you over to the officer, and the officer will throw you into prison.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “settle with him.” The Greek literally says “be released from him”; in this legal context, it likely refers to resolving the case before it reaches the judge.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: before a magistrate
  simplified_phrase: to appear before a legal official
  preserved_meaning: The dispute is being taken before a civic authority.
  reasoning_layer_used: Lexical decision for ἄρχοντα
  rationale: “Legal official” clarifies the magistrate’s role without confusing this official with the judge.
- pob_phrase: make an effort on the way
  simplified_phrase: make every effort on the way
  preserved_meaning: The person must act diligently before reaching court.
  reasoning_layer_used: Lexical decisions for δὸς ἐργασίαν and ἐν τῇ ὁδῷ
  rationale: The wording conveys vigorous action in clear English without implying exhaustive effort.
- pob_phrase: lest he drag you to the judge, and the judge hand you over
  simplified_phrase: Otherwise, he may drag you before the judge. The judge will then hand you over
  preserved_meaning: Failure to resolve the case leads through the same forceful judicial sequence.
  reasoning_layer_used: Lexical decisions for κατασύρῃ and παραδώσει
  rationale: The sentence break makes the consequences easier to follow while retaining their force.
interpretive_expansions:
- pob_phrase: to be released from him
  rendering: to free yourself from his claim
  claim: Release concerns escaping the accuser’s legal claim or control before judgment.
  evidence:
