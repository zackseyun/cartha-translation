translation:
  language: en
  text: Anyone who speaks against the Son of Man will be forgiven for it. But anyone who blasphemes against the Holy Spirit will not be forgiven.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: everyone who speaks a word against
  simplified_phrase: anyone who speaks against
  preserved_meaning: The statement still applies generally to every person who speaks in opposition.
  reasoning_layer_used: POB lexical decisions for πᾶς ὃς, ἐρεῖ λόγον, and εἰς
  rationale: The shorter wording expresses the Greek idiom naturally while preserving its universal and hostile sense.
- pob_phrase: it will be forgiven him
  simplified_phrase: will be forgiven for it
  preserved_meaning: The offense of speaking against the Son of Man is what will be forgiven.
  reasoning_layer_used: POB lexical decision and footnote for ἀφεθήσεται αὐτῷ
  rationale: This removes the awkward pronoun structure and makes the implied offense clear.
- pob_phrase: but the one who blasphemes
  simplified_phrase: But anyone who blasphemes
  preserved_meaning: The second clause contrasts such speech with blasphemy against the Holy Spirit.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: A new sentence clarifies the contrast without explaining the disputed theology.
translation_notes:
  risk_flags:
  - risk: Some readers may not know the theological term “blasphemes.”
    mitigation: The term is retained because replacing it could weaken the distinct and severe offense named in the POB.
  - risk: Readers may infer a specific explanation of why the two offenses differ.
    mitigation: The translation preserves the contrast without defining the mechanism of the unforgivable sin.
