simplification_decisions:
- pob_phrase: the one who denies me
  simplified_phrase: anyone who denies me
  preserved_meaning: The saying states a general principle about a person who denies Jesus.
  reasoning_layer_used: POB lexical decision for ἀρνησάμενός
  rationale: “Anyone” expresses the general sense more directly in modern English.
- pob_phrase: before men
  simplified_phrase: in front of people
  preserved_meaning: The denial takes place openly in the presence of human beings.
  reasoning_layer_used: POB lexical decisions for ἐνώπιον and τῶν ἀνθρώπων
  rationale: This wording is inclusive and immediately clear while retaining the human-heavenly contrast.
- pob_phrase: before the angels of God
  simplified_phrase: in front of God’s angels
  preserved_meaning: The answering denial occurs in the presence of the heavenly angels.
  reasoning_layer_used: POB lexical decision for τῶν ἀγγέλων τοῦ θεοῦ
  rationale: The possessive form is more natural without changing the heavenly setting.
translation_notes:
  risk_flags:
  - risk: Readers may wonder who performs the final denial.
    mitigation: The passive wording remains because the Greek does not explicitly name the agent.
  - risk: “Denied” may understate the possible force of the stronger Greek cognate.
    mitigation: The footnote preserves “disowned” as a lexical alternative.
