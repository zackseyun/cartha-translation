translation:
  language: en
  text: But anyone who denies me in front of people will be denied in front of God’s angels.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “will be disowned.” The Greek verb may be stronger than “denied.”
