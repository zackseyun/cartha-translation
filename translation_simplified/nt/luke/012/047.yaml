simplification_decisions:
- pob_phrase: who knew his master's will
  simplified_phrase: knew what his master wanted
  preserved_meaning: The slave had prior knowledge of his master's intention.
  reasoning_layer_used: Lexical decisions for γνοὺς, θέλημα, and κυρίου
  rationale: The wording replaces the abstract phrase “master's will” with ordinary English while keeping the household authority relationship.
- pob_phrase: did not prepare or act according to his will
  simplified_phrase: did not get ready or do what his master wanted
  preserved_meaning: The slave failed both to prepare and to carry out the master's intention.
  reasoning_layer_used: Lexical decisions for ἑτοιμάσας and ποιήσας πρὸς τὸ θέλημα αὐτοῦ
  rationale: The two distinct failures remain clear without the formal phrase “act according to his will.”
- pob_phrase: one long relative-clause sentence
  simplified_phrase: two direct sentences
  preserved_meaning: The knowledgeable slave's disobedience leads to repeated physical punishment.
  reasoning_layer_used: POB syntax and optimal-equivalence philosophy
  rationale: Splitting the sentence makes the warning easier to follow without changing its logic.
