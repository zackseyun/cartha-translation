simplification_decisions:
- pob_phrase: cast fire on the earth
  simplified_phrase: set fire on the earth
  preserved_meaning: Jesus describes his mission with the vivid image of bringing fire upon the earth without explaining what the fire represents.
  reasoning_layer_used: POB lexical and theological decisions on Πῦρ, βαλεῖν, and ἐπὶ τὴν γῆν
  rationale: This wording is easier to understand without saying that the earth itself is burning.
- pob_phrase: were already kindled
  simplified_phrase: were already burning
  preserved_meaning: Jesus strongly desires that the fire should already have begun.
  reasoning_layer_used: POB lexical decision on ἀνήφθη and theological decision on the difficult clause
  rationale: “Burning” is more familiar than “kindled” and preserves the fire image.
translation_notes:
