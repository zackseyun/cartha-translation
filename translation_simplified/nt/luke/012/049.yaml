translation:
  language: en
  text: I came to set fire on the earth, and how I wish it were already burning![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may be translated more literally, “What do I want if it has already been kindled?” The clause is difficult; the main text gives its probable sense as a strong desire.
