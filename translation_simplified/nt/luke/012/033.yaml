simplification_decisions:
- pob_phrase: Sell your possessions and give alms
  simplified_phrase: Sell what you own and give to the poor
  preserved_meaning: Jesus commands decisive generosity toward people in need.
  reasoning_layer_used: Lexical and theological decisions for τὰ ὑπάρχοντα ὑμῶν and ἐλεημοσύνην.
  rationale: Common wording replaces the formal term “alms” while keeping its specific social target.
- pob_phrase: Make for yourselves money bags that do not wear out
  simplified_phrase: Make for yourselves money bags that never wear out
  preserved_meaning: The command keeps the concrete image of lasting money pouches made for one’s own benefit.
  reasoning_layer_used: Lexical decisions for ποιήσατε ἑαυτοῖς, βαλλάντια, and μὴ παλαιούμενα.
  rationale: “Never” states the enduring contrast naturally while “make” preserves the direct command.
- pob_phrase: where no thief comes near and no moth destroys
  simplified_phrase: No thief comes near it, and no moth destroys it
  preserved_meaning: The heavenly treasure is untouched by theft and physical decay.
  reasoning_layer_used: Lexical decisions for ἐγγίζει and διαφθείρει.
  rationale: A new sentence with an explicit referent clarifies the relative clause without adding modal force.
translation_notes:
