  preserved_meaning: The Lord arrives and finds his slaves awake and watchful.
  reasoning_layer_used: POB lexical decision for γρηγοροῦντας
  rationale: The reordered clause is natural English and keeps their continued wakefulness.
- pob_phrase: he will dress himself for service
  simplified_phrase: he will dress himself to serve
  preserved_meaning: The Lord dresses for the work of serving at the meal.
  reasoning_layer_used: POB lexical decision for περιζώσεται and grounding review
  rationale: This keeps both the concrete action and its purpose without adding personal emphasis.
- pob_phrase: have them recline at the table
