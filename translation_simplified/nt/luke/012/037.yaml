translation:
  language: en
  text: Blessed are those servants[a] whom the Lord[b] finds still awake when he comes. Truly I tell you, he will dress himself to serve, seat them at the table, and come and serve them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “servants.” The Greek word describes people who belong to and serve a master.
    reason: lexical_alternative
  - marker: b
    text: Or “master” in the setting of this parable.
    reason: lexical_alternative
