translation:
  language: en
  text: All these things are what the peoples of this world[a] chase after. But your Father knows that you need them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the Gentiles of the world.” The Greek term can mean “peoples” or “Gentiles.”
