simplification_decisions:
- pob_phrase: For all these things the nations of the world seek
  simplified_phrase: All these things are what the peoples of this world chase after
  preserved_meaning: People of the world actively pursue the material necessities mentioned in context.
  reasoning_layer_used: POB lexical decisions for τὰ ἔθνη τοῦ κόσμου and ἐπιζητοῦσιν
  rationale: “Peoples” is clearer than “nations,” while “chase after” preserves the verb’s active force.
- pob_phrase: but your Father knows that you need these things
  simplified_phrase: But your Father knows that you need them
  preserved_meaning: God, addressed as the disciples’ Father, knows their needs.
  reasoning_layer_used: POB lexical and theological decisions for ὑμῶν ὁ πατήρ and χρῄζετε
  rationale: The pronoun avoids stiff repetition without adding “heavenly” or changing the Father-language.
- pob_phrase: single contrastive sentence
  simplified_phrase: two short sentences joined by “But”
  preserved_meaning: The contrast remains between worldly pursuit and the Father’s knowledge.
  reasoning_layer_used: POB theological decision on worldly pursuit and filial trust
  rationale: Splitting the sentence makes the contrast easier to follow.
