  rationale: “Period of the night” explains the historical sense of “watch” in ordinary English.
- pob_phrase: finds them so
  simplified_phrase: finds them ready
  preserved_meaning: The servants remain in the state of readiness described in the preceding verse.
  reasoning_layer_used: POB lexical rationale for εὕρῃ οὕτως
  rationale: Naming their readiness makes the backward reference immediately clear.
- pob_phrase: blessed are those servants
  simplified_phrase: those servants are blessed
  preserved_meaning: The servants found ready are in a favored state before God.
  reasoning_layer_used: POB lexical and theological decisions for μακάριοι and ἐκεῖνοι
  rationale: Ordinary English word order improves readability while retaining “blessed” and its contextual referent.
