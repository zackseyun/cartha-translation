translation:
  language: en
  text: Then I will say to my soul,[a] ‘Soul, you have plenty of good things stored away for many years. Rest, eat, drink, and celebrate.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “soul” means the man’s inner self; the Greek word can also mean “self” or “life.”
    reason: lexical_alternative
