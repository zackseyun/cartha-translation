simplification_decisions:
- pob_phrase: confesses me ... will confess
  simplified_phrase: openly acknowledges me ... will also acknowledge
  preserved_meaning: The same verb in both clauses conveys reciprocal public acknowledgment.
  reasoning_layer_used: POB lexical and theological decisions on ὁμολογέω with ἐν plus the dative
  rationale: “Acknowledges” communicates the public meaning more clearly than “confesses” for many modern readers.
- pob_phrase: before men ... before the angels of God
  simplified_phrase: in front of men ... in front of God’s angels
  preserved_meaning: Both acts take place openly in the presence of witnesses.
  reasoning_layer_used: POB lexical decisions for ἔμπροσθεν and ἀγγέλων τοῦ θεοῦ
  rationale: “In front of” and the possessive form are more natural in common English.
- pob_phrase: will confess [him]
  simplified_phrase: will also acknowledge that person
  preserved_meaning: The Son of Man will acknowledge the same person who acknowledges Jesus.
  reasoning_layer_used: POB lexical decision for ἐν αὐτῷ
  rationale: “That person” makes the reciprocal reference clear without an ambiguous pronoun.
