translation:
  language: en
  text: The Lord said, “Who, then, is the faithful and wise steward—the one his master will put in charge of the household staff to give them their portions of food[a] at the right time?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally “their measured ration of grain,” meaning the portion of food assigned to each servant.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: faithful and prudent steward
  simplified_phrase: faithful and wise steward
  preserved_meaning: The steward is reliable and uses sound practical judgment.
  reasoning_layer_used: POB lexical decision for φρόνιμος
  rationale: “Wise” is a documented alternative and is more familiar than “prudent.”
- pob_phrase: whom the master will appoint over his household staff
  simplified_phrase: the one his master will put in charge of the household staff
  preserved_meaning: The master entrusts the steward with authority over the servants.
  reasoning_layer_used: POB lexical decisions for καταστήσει and θεραπείας
  rationale: The recast phrase expresses appointed responsibility in ordinary English.
- pob_phrase: give them their food allowance at the proper time
  simplified_phrase: give them their portions of food at the right time
  preserved_meaning: Each servant receives the assigned food ration when it is due.
  reasoning_layer_used: POB lexical decisions for σιτομέτριον and ἐν καιρῷ
  rationale: “Portions of food” is clearer than “food allowance” while retaining the ration idea.
translation_notes:
  risk_flags:
  - risk: “Wise” may sound broader than the practical judgment conveyed by “prudent.”
    mitigation: The stewardship setting keeps the wisdom focused on responsible action.
  - risk: Modern readers may not know the household role of a steward.
    mitigation: The following phrase explains that he is put in charge of the household staff.
