translation:
  language: en
  text: Look closely at the lilies and see how they grow. They do not work or spin thread. Yet I tell you, not even Solomon in all his glory was dressed as beautifully as one of these lilies.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Consider the lilies, how they grow
  simplified_phrase: Look closely at the lilies and see how they grow
  preserved_meaning: Jesus commands attentive observation and reflection on the lilies' growth.
  reasoning_layer_used: Lexical decision for κατανοήσατε and πῶς αὐξάνει
  rationale: The two common verbs make deliberate observation clearer without reducing it to a casual glance.
- pob_phrase: they do not labor or spin
  simplified_phrase: They do not work or spin thread
  preserved_meaning: Lilies do neither the labor nor the spinning involved in producing clothing.
  reasoning_layer_used: Lexical decisions for κοπιᾷ and νήθει
  rationale: “Work” is more common than “labor,” while “thread” clarifies the older textile sense of “spin.”
- pob_phrase: was clothed like one of these
  simplified_phrase: was dressed as beautifully as one of these lilies
  preserved_meaning: Even Solomon's magnificent clothing did not equal the beauty of a lily.
  reasoning_layer_used: Lexical decisions for περιεβάλετο and ὡς ἓν τούτων
  rationale: The wording makes the visual comparison natural in English while retaining the clothing image.
interpretive_expansions:
- pob_phrase: was clothed like one of these
  rendering: was dressed as beautifully as one of these lilies
  claim: The comparison concerns how splendid the clothing and lilies appeared.
  evidence:
  - The immediate mention of Solomon's glory establishes a comparison of visible splendor.
  - The verb περιεβάλετο preserves the image of clothing.
  - “These” refers back to the lilies in the POB lexical rationale.
  confidence: high
  alternatives_preserved:
  - was clothed like one of these
  - was dressed like one of these lilies
translation_notes:
  risk_flags:
