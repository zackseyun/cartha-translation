translation:
  language: en
  text: But the person who did not know, yet did what deserved blows, will receive only a few blows. Much will be required from everyone who has been given much. They will ask even more of anyone they entrusted with much.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the one who did not know
  simplified_phrase: the person who did not know
  preserved_meaning: The person lacked knowledge without further defining the reason or degree of ignorance.
  reasoning_layer_used: POB lexical decision for ὁ ... μὴ γνοὺς
  rationale: “The person” is more immediately natural than the substantival phrase “the one.”
- pob_phrase: From everyone to whom much was given, much will be required
  simplified_phrase: Much will be required from everyone who has been given much.
  preserved_meaning: Greater gifts bring greater accountability.
  reasoning_layer_used: POB lexical decision for παντὶ ... ᾧ ἐδόθη πολύ
  rationale: Reordering the clause gives it ordinary English sentence structure.
- pob_phrase: from the one to whom they entrusted much, they will ask even more
  simplified_phrase: They will ask even more of anyone they entrusted with much.
  preserved_meaning: Greater entrusted responsibility brings a still greater expectation.
  reasoning_layer_used: POB lexical and theological decisions for παρέθεντο and the indefinite plural agency
  rationale: The active wording is easier to follow while retaining the unspecified “they.”
interpretive_expansions:
- pob_phrase: will receive few
  rendering: will receive only a few blows
  claim: The few things received are blows of punishment.
  evidence:
  - The Greek verb explicitly denotes being beaten, and πληγῶν supplies “blows” in the preceding clause.
  confidence: high
  alternatives_preserved:
  - will receive few
  - will be beaten with few blows
translation_notes:
  risk_flags:
  - risk: The unspecified “they” may sound vague to modern readers.
    mitigation: It remains unspecified because the Greek gives no explicit subject and POB forbids identifying it as God or people.
