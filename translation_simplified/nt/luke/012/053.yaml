translation:
  language: en
  text: They will be divided from one another. A father will be against his son, and a son against his father. A mother will be against her daughter, and a daughter against her mother. A mother-in-law will be against her daughter-in-law, and a daughter-in-law against her mother-in-law.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: 'They will be divided: father against son and son against father'
  simplified_phrase: They will be divided from one another. A father will be against his son, and a son against his father.
  preserved_meaning: The division occurs within the family and creates reciprocal opposition.
  reasoning_layer_used: POB lexical decision and lexical footnote for διαμερισθήσονται
  rationale: A separate opening sentence and natural possessives make the family division easier to follow.
- pob_phrase: mother against daughter and daughter against mother, mother-in-law against her daughter-in-law and daughter-in-law against her mother-in-law
  simplified_phrase: A mother will be against her daughter, and a daughter against her mother. A mother-in-law will be against her daughter-in-law, and a daughter-in-law against her mother-in-law.
  preserved_meaning: Each gendered family relationship and both directions of opposition remain distinct.
  reasoning_layer_used: POB kinship lexical decisions and applied revision
  rationale: Short parallel sentences clarify each reciprocal pair without weakening the repeated word “against.”
