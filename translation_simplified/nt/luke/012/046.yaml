translation:
  language: en
  text: That servant’s master will come on a day when the servant does not expect him, at an hour the servant does not know. The master will cut him in pieces[a] and assign him a place among the unfaithful.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “cut him in two”; some understand this as “punish him severely.”
    reason: lexical_alternative
  - marker: b
    text: Or, “the unbelievers.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: the master of that slave
  simplified_phrase: That slave’s master
  preserved_meaning: The parable’s explicit master-slave relationship remains intact.
  reasoning_layer_used: POB lexical decisions for κύριος and δοῦλος
  rationale: The possessive form is more natural while retaining the chosen social terms.
- pob_phrase: he does not expect him and at an hour he does not know
  simplified_phrase: the slave does not expect him, at an hour the slave does not know
  preserved_meaning: The slave neither expects the master nor knows when he will arrive.
  reasoning_layer_used: POB lexical decisions for προσδοκάω and γινώσκω
  rationale: Repeating “the slave” clarifies the pronouns without merging expectation and knowledge.
- pob_phrase: and will cut him in pieces and assign his place with the unfaithful
  simplified_phrase: The master will cut him in pieces and assign him a place among the unfaithful
  preserved_meaning: The severe judgment image and the slave’s assigned destiny with the unfaithful are retained.
  reasoning_layer_used: POB lexical and theological decisions for διχοτομήσει, μέρος, and ἀπίστων
  rationale: A new sentence and explicit subject make the judgment easier to follow without softening it.
translation_notes:
  risk_flags:
  - risk: “Cut him in pieces” may be read only as literal bodily violence.
    mitigation: Footnote a preserves both the literal alternative and the possible idiom of severe punishment.
  - risk: “Unfaithful” may obscure the Greek term’s possible sense of unbelief.
    mitigation: Footnote b preserves “the unbelievers” as an important alternative.
