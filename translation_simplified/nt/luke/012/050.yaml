simplification_decisions:
- pob_phrase: I have a baptism to undergo
  simplified_phrase: I must go through a baptism
  preserved_meaning: Jesus faces an impending, necessary ordeal while the baptism image remains explicit.
  reasoning_layer_used: Lexical decision for ἔχω βαπτισθῆναι and theological decision on the baptism metaphor.
  rationale: “Must go through” expresses the obligation in direct, common English.
- pob_phrase: how distressed I am
  simplified_phrase: I am deeply distressed
  preserved_meaning: Jesus feels intense inward pressure as he anticipates what lies ahead.
  reasoning_layer_used: Lexical decision for πῶς and συνέχομαι.
  rationale: “Deeply” carries the force of the exclamation in natural English.
- pob_phrase: until it is accomplished
  simplified_phrase: until it is completed
  preserved_meaning: His distress continues until the appointed event reaches its intended end.
  reasoning_layer_used: Lexical decision for τελεσθῇ.
  rationale: “Completed” is clearer while retaining the sense of being brought to its intended end.
