translation:
  language: en
  text: But I must go through a baptism[a], and I am deeply distressed until it is completed.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “baptism” is an image of the overwhelming suffering and death Jesus was about to face.
