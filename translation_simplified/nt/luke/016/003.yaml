- pob_phrase: said to himself
  simplified_phrase: thought
  preserved_meaning: The manager speaks inwardly as he considers what to do.
  reasoning_layer_used: Lexical decision for ἐν ἑαυτῷ
  rationale: “Thought” expresses internal speech in direct, natural English.
- pob_phrase: is taking the management away from me
  simplified_phrase: is taking my job as manager away from me
  preserved_meaning: His master is removing him from the office and responsibility of managing the estate.
  reasoning_layer_used: Lexical decisions for ἀφαιρεῖται and οἰκονομίαν
  rationale: “My job as manager” makes the lost role immediately understandable.
- pob_phrase: I am ashamed to beg
  simplified_phrase: I am too ashamed to beg
  preserved_meaning: His shame keeps him from considering begging as an acceptable option.
  reasoning_layer_used: Lexical decision for αἰσχύνομαι and immediate context
  rationale: “Too ashamed” clearly shows why begging does not solve his problem.
