translation:
  language: en
  text: The master praised the unrighteous manager for how shrewdly he had acted. For people who belong to this age are more shrewd in dealing with people of their own generation than people who belong to the light.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the Lord praised the unrighteous manager.” Here “master” most naturally refers to the master in the parable.
    reason: alternative_reading
  - marker: b
    text: Greek says “the sons of this age” and “the sons of light,” contrasting people shaped by the present age with those who belong to God’s light.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: because he had acted shrewdly
  simplified_phrase: for how shrewdly he had acted
  preserved_meaning: The master praises the manager’s practical cleverness, not his wrongdoing.
  reasoning_layer_used: Lexical and theological decisions on φρονίμως and moral evaluation
  rationale: Keeping “shrewdly” distinguishes tactical skill from moral approval.
- pob_phrase: the sons of this age ... the sons of light
  simplified_phrase: people who belong to this age ... people who belong to the light
  preserved_meaning: The verse contrasts people identified with the present age and people identified with God’s light.
  reasoning_layer_used: Lexical decisions on both sonship expressions
  rationale: The group identities are made plain while the source images remain in a footnote.
- pob_phrase: in dealing with their own generation
  simplified_phrase: in dealing with people of their own generation
  preserved_meaning: People of this age act shrewdly among their contemporaries.
  reasoning_layer_used: Lexical decision on εἰς τὴν γενεὰν τὴν ἑαυτῶν and grounding review
  rationale: Adding “people of” clarifies the relationship without narrowing “generation” to a social class.
