translation:
  language: en
  text: The time of the Law and the Prophets lasted until John the Baptist. Since then, the kingdom of God is being announced as good news, and everyone is pushing forcefully to enter it.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “everyone is pressing into it.” The Greek describes forceful movement toward entry.
    reason: lexical_alternative
  - marker: b
    text: Some understand this clause negatively, but here the Greek makes “everyone,” not “the kingdom,” the subject.
    reason: alternative_reading
