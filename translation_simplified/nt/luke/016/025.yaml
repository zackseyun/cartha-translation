translation:
  language: en
  text: 'But Abraham replied, “Child, remember: during your life you received[a] your good things, while Lazarus received bad things. But now he is comforted here, and you are in anguish.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “received in full.” The Greek may imply receiving all that was allotted.
    reason: lexical_alternative
  - marker: b
    text: Or “are tormented.” The Greek refers to intense pain or distress.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: But Abraham said
  simplified_phrase: But Abraham replied
  preserved_meaning: Abraham responds to the rich man.
  reasoning_layer_used: Immediate narrative context
  rationale: “Replied” makes the conversational setting clear without adding content.
- pob_phrase: and Lazarus likewise bad things
  simplified_phrase: while Lazarus received bad things
  preserved_meaning: Lazarus experienced adversity during his earthly life in contrast with the rich man.
  reasoning_layer_used: POB lexical decision for ὁμοίως and τὰ κακά
  rationale: The full clause replaces an awkward English ellipsis while preserving the parallel contrast.
- pob_phrase: but now he is comforted here, and you are in anguish
  simplified_phrase: But now he is comforted here, and you are in anguish
  preserved_meaning: Their situations are now reversed, with Lazarus receiving comfort and the rich man suffering.
  reasoning_layer_used: POB theological decision on postmortem suffering
  rationale: The wording stays direct and avoids strengthening “anguish” into a doctrinally loaded term.
translation_notes:
  risk_flags:
  - risk: Repeating “received” for Lazarus could sound as though his suffering was formally allotted.
    mitigation: “Bad things” remains broad, and the sentence uses the verb chiefly to complete the Greek parallel in natural English.
