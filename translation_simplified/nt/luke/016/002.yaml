translation:
  language: en
  text: So he called the manager in and said, “What is this I hear about you? Give me an account of your work as manager, because you can no longer serve as manager.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And after calling him, he said to him
  simplified_phrase: So he called the manager in and said
  preserved_meaning: The owner summons the man before addressing him.
  reasoning_layer_used: The lexical decision places the calling before the speech, and the context identifies the man as the manager.
  rationale: This uses natural English and makes the pronoun reference clear.
- pob_phrase: Give an account of your stewardship
  simplified_phrase: Give me an account of your work as manager
  preserved_meaning: The man must report on how he carried out his entrusted managerial role.
  reasoning_layer_used: The lexical decisions define the phrase as an accounting of his office or responsibility as manager.
  rationale: This explains “stewardship” without narrowing it to property alone.
- pob_phrase: for you are no longer able to manage
  simplified_phrase: because you can no longer serve as manager
  preserved_meaning: The man is no longer permitted to continue in his managerial office.
  reasoning_layer_used: The lexical decisions preserve cessation and the steward’s managerial function.
  rationale: This avoids suggesting that he has lost the physical ability to manage.
interpretive_expansions:
- pob_phrase: him
  rendering: the manager
  claim: The summoned man is the manager introduced in the parable.
  evidence:
  - The immediate context identifies him as the rich man’s manager.
  confidence: high
  alternatives_preserved:
  - him
  - the steward
translation_notes:
  risk_flags:
  - risk: “Serve as manager” expresses removal from office more directly than the literal wording about ability.
    mitigation: POB lists “can no longer serve as steward” as a lexical alternative and identifies the managerial function.
