translation:
  language: en
  text: He cried out, “Father Abraham, have mercy on me! Send Lazarus to dip his fingertip in water and cool my tongue, because I am in agony[a] in this flame.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “I am tormented in this flame.” The Greek verb can describe severe suffering or torment.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And he cried out and said
  simplified_phrase: He cried out
  preserved_meaning: He raised his voice in an urgent appeal and then spoke.
  reasoning_layer_used: Lexical decision for φωνήσας and ordinary English speech conventions
  rationale: The quotation already makes “said” unnecessary, while “cried out” preserves the urgency.
- pob_phrase: send Lazarus so that he may dip
  simplified_phrase: Send Lazarus to dip
  preserved_meaning: He asks Abraham to send Lazarus for the stated purpose.
  reasoning_layer_used: Lexical decision for πέμψον and English purpose-clause syntax
  rationale: An infinitive expresses the same purpose more directly in modern English.
- pob_phrase: the tip of his finger
  simplified_phrase: his fingertip
  preserved_meaning: Only the very end of Lazarus’s finger is to touch the water.
  reasoning_layer_used: Lexical decision for τὸ ἄκρον τοῦ δακτύλου αὐτοῦ
  rationale: “Fingertip” keeps the concrete image in a shorter, familiar form.
