translation:
  language: en
  text: But he replied, “If they do not listen to Moses and the Prophets,[a] they will not be convinced even if someone rises from the dead.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Moses and the Prophets” refers to the authoritative Scriptures already given to Israel, especially the Law and the Prophets.
    reason: cultural_note
simplification_decisions:
- pob_phrase: But he said to him
  simplified_phrase: But he replied
  preserved_meaning: He responds directly with a contrasting answer in the dialogue.
  reasoning_layer_used: Lexical decision for εἶπεν δὲ αὐτῷ and immediate dialogue context
  rationale: “Replied” expresses the same conversational response more naturally and avoids the unnecessary pronouns.
- pob_phrase: neither will they be persuaded if
  simplified_phrase: they will not be convinced even if
  preserved_meaning: Their refusal will continue despite the extraordinary event described.
  reasoning_layer_used: Lexical decisions for οὐδ’ ἐάν and πεισθήσονται
  rationale: This clause order is clearer in modern English while preserving the intensified negative condition.
- pob_phrase: Moses and the Prophets
  simplified_phrase: Moses and the Prophets
  preserved_meaning: The original Jewish expression for Israel’s authoritative scriptural witness remains intact.
  reasoning_layer_used: Theological decision on Moses and the Prophets
  rationale: The phrase is retained, with a footnote explaining it for readers unfamiliar with the expression.
