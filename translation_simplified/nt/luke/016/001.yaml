translation:
  language: en
  text: He was also telling the disciples, “A rich man had a manager. The rich man heard an accusation that his manager was wasting his property.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The manager was accused or adversely reported; the text does not say whether the charge was true.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: There was a certain rich man who had a manager
  simplified_phrase: A rich man had a manager
  preserved_meaning: The parable introduces an unspecified rich man and his estate manager.
  reasoning_layer_used: Lexical decisions for Ἄνθρωπός τις and οἰκονόμον
  rationale: The shorter form naturally introduces a parable character in modern English.
- pob_phrase: this man was accused to him
  simplified_phrase: The rich man heard an accusation that his manager
  preserved_meaning: An adverse charge about the manager was brought to the rich man.
  reasoning_layer_used: Lexical decision for διεβλήθη αὐτῷ
  rationale: The recast sentence removes awkward English while retaining the accusation and its recipient.
- pob_phrase: of squandering his possessions
  simplified_phrase: was wasting his property
  preserved_meaning: The manager was charged with misusing the rich man’s assets.
  reasoning_layer_used: Lexical decisions for ὡς διασκορπίζων and τὰ ὑπάρχοντα αὐτοῦ
  rationale: “Wasting his property” states the financial charge in common English.
