translation:
  language: en
  text: He longed to have enough to eat from what kept falling from the rich man’s table.[a] But even the dogs would come and lick his sores.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “from the scraps that fell from the rich man’s table.” The Greek says “from what was falling”; “scraps” is implied by the meal setting.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: and longing to be fed
  simplified_phrase: He longed to have enough to eat
  preserved_meaning: Lazarus continually desired to receive enough food.
  reasoning_layer_used: Lexical decisions for ἐπιθυμῶν and χορτασθῆναι
  rationale: The active English phrasing clearly expresses his sustained hunger without changing the sense.
- pob_phrase: from what was falling
  simplified_phrase: from what kept falling
  preserved_meaning: He desired food falling from the rich man’s table without specifying that it was scraps.
  reasoning_layer_used: Lexical decision and doctrine-realignment revision for ἀπὸ τῶν πιπτόντων
  rationale: “Kept falling” is natural English that retains the participle’s ongoing force.
- pob_phrase: the dogs came and were licking his sores
  simplified_phrase: the dogs would come and lick his sores
  preserved_meaning: The dogs repeatedly came and licked Lazarus’s ulcerous sores.
  reasoning_layer_used: Lexical decisions for ἐρχόμενοι, ἐπέλειχον, and τὰ ἕλκη αὐτοῦ
  rationale: “Would come and lick” naturally conveys repeated past action while keeping the disturbing image.
