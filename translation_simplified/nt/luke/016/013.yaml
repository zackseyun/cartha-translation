translation:
  language: en
  text: No servant in a household can serve two masters. He will either hate one and love the other, or be devoted to one and despise the other. You cannot serve both God and Mammon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mammon means wealth or money, pictured here as a rival master.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: No household servant
  simplified_phrase: No servant in a household
  preserved_meaning: The servant serves in a domestic setting under a master.
  reasoning_layer_used: Lexical decision for οἰκέτης
  rationale: The recast wording is easier to process while preserving the household setting.
- pob_phrase: for either he will hate the one and love the other, or he will be devoted to one and despise the other
  simplified_phrase: He will either hate one and love the other, or be devoted to one and despise the other.
  preserved_meaning: The two alternative descriptions of exclusive allegiance and all four strong responses remain intact.
  reasoning_layer_used: Source syntax and lexical decisions for μισήσει, ἀγαπήσει, ἀνθέξεται, and καταφρονήσει
  rationale: A new sentence improves readability while retaining the explicit either-or structure.
- pob_phrase: You cannot serve God and Mammon
  simplified_phrase: You cannot serve both God and Mammon
  preserved_meaning: God and personified wealth are rival masters who cannot both receive service.
  reasoning_layer_used: Theological decision for μαμωνᾷ
  rationale: “Both” clarifies the impossibility without weakening Mammon's personified force.
translation_notes:
