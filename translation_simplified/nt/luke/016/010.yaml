translation:
  language: en
  text: Anyone who is faithful in even the smallest matter is also faithful in much larger matters. Anyone who does wrong[a] in even the smallest matter also does wrong in much larger matters.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Does wrong” translates a broad term that can also mean “is unrighteous,” “is unjust,” or “is dishonest.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: The one who
  simplified_phrase: Anyone who
  preserved_meaning: The statement applies generally to any person.
  reasoning_layer_used: Greek grammar decision on the substantival adjective
  rationale: “Anyone who” expresses the generic singular naturally in modern English.
- pob_phrase: in very little ... in much
  simplified_phrase: in even the smallest matter ... in much larger matters
  preserved_meaning: Faithfulness or wrongdoing in small circumstances corresponds to conduct in large ones.
  reasoning_layer_used: Lexical decisions for ἐν ἐλαχίστῳ and πολλῷ
  rationale: The concrete contrast between the smallest and much larger matters is easier to grasp.
- pob_phrase: is unrighteous
  simplified_phrase: does wrong
  preserved_meaning: The person acts wrongly in a broad moral sense, not merely dishonestly with money.
  reasoning_layer_used: Lexical and theological decisions for ἄδικος
  rationale: “Does wrong” is common English while the footnote preserves the broader lexical range.
interpretive_expansions:
