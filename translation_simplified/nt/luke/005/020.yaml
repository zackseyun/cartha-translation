translation:
  language: en
  text: When Jesus saw their faith,[a] he said to the man, “Your sins are forgiven.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “trust.” The plural “their” does not specify whether this means the man and his companions together or only those who brought him.
    reason: lexical_alternative
  - marker: b
    text: Or “have been forgiven.” The Greek describes forgiveness as a present reality resulting from completed action.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And seeing their faith
  simplified_phrase: When Jesus saw their faith
  preserved_meaning: Jesus perceived the trust shown by the group, while “their” remains plural.
  reasoning_layer_used: Lexical decisions for ἰδών, πίστις, and αὐτῶν; theological decision on the scope of “their faith.”
  rationale: A direct time clause is clearer than the opening participle without narrowing whose faith is meant.
- pob_phrase: he said, “Man
  simplified_phrase: he said to the man, “
  preserved_meaning: Jesus directly addresses the male paralytic without adding warmth or social formality.
  reasoning_layer_used: Lexical decision for Ἄνθρωπε.
  rationale: Moving the awkward English vocative into the speech introduction preserves its force in natural English.
- pob_phrase: your sins are forgiven
  simplified_phrase: Your sins are forgiven
  preserved_meaning: The declaration presents forgiveness as a current reality without settling its precise timing.
  reasoning_layer_used: Lexical and theological decisions for ἀφέωνταί and the forgiveness statement.
  rationale: The idiomatic wording is retained because it clearly preserves the Greek perfect passive.
