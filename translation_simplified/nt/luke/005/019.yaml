translation:
  language: en
  text: But because of the crowd, they could not find a way to bring him inside. So they went up onto the roof and lowered him on his mat through the roof tiles, into the middle of the gathering, in front of Jesus.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And not finding a way to bring him in because of the crowd
  simplified_phrase: But because of the crowd, they could not find a way to bring him inside.
  preserved_meaning: The crowd prevented them from finding an access route for the man.
  reasoning_layer_used: Lexical decisions for ποίας, εἰσενέγκωσιν, and διὰ τὸν ὄχλον.
  rationale: The obstacle comes first, and the participle becomes a direct clause.
- pob_phrase: they went up on the roof and lowered him with his mat through the tiles
  simplified_phrase: So they went up onto the roof and lowered him on his mat through the roof tiles
  preserved_meaning: They went onto the roof and lowered the man together with his mat through its tiles.
  reasoning_layer_used: Lexical decisions for δῶμα, κεράμων, καθῆκαν, and κλινιδίῳ.
  rationale: The wording links the tiles to the roof and clearly pictures the action.
- pob_phrase: into the middle, in front of Jesus
  simplified_phrase: into the middle of the gathering, in front of Jesus
  preserved_meaning: They placed the man centrally among those present and before Jesus.
  reasoning_layer_used: Lexical decisions for εἰς τὸ μέσον and ἔμπροσθεν τοῦ Ἰησοῦ.
  rationale: The added noun clarifies what “the middle” means without intensifying his position before Jesus.
interpretive_expansions:
- pob_phrase: into the middle
  rendering: into the middle of the gathering
  claim: The middle is the central area among the assembled people.
  evidence:
