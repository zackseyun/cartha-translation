translation:
  language: en
  text: Jesus reached out his hand and touched the man. He said, “I am willing. Be made clean.” At once, the leprosy[a] left him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word may refer to various serious skin diseases, not only what is now called leprosy.
    reason: cultural_note
simplification_decisions:
- pob_phrase: And stretching out his hand, he touched him, saying
  simplified_phrase: Jesus reached out his hand and touched the man. He said
  preserved_meaning: Jesus deliberately made physical contact with the diseased man before speaking.
  reasoning_layer_used: Lexical decisions for ἐκτείνας, ἥψατο, and εἰπών
  rationale: Two direct sentences replace the participial structure while preserving each action.
- pob_phrase: be cleansed
  simplified_phrase: Be made clean
  preserved_meaning: Jesus commands a cleansing that includes healing and release from ritual impurity.
  reasoning_layer_used: Lexical and theological decision for καθαρίσθητι
  rationale: “Be made clean” uses common words without reducing cleansing to medical healing alone.
- pob_phrase: And immediately the leprosy left him
  simplified_phrase: At once, the leprosy left him
  preserved_meaning: The disease departed without delay.
  reasoning_layer_used: Lexical decisions for εὐθέως and ἀπῆλθεν ἀπ’ αὐτοῦ
  rationale: “At once” is shorter and more conversational while keeping the immediate timing.
translation_notes:
  risk_flags:
  - risk: Modern readers may take “leprosy” to mean only Hansen’s disease.
    mitigation: The footnote preserves the ancient term’s broader range of serious skin diseases.
  - risk: “Be made clean” could be heard as ordinary hygiene.
    mitigation: The disease leaving at once makes the healing sense clear while retaining the biblical cleanliness dimension.
