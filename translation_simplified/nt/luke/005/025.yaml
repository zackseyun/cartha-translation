simplification_decisions:
- pob_phrase: And immediately he stood up before them
  simplified_phrase: At once, the man stood up in front of them.
  preserved_meaning: The healed man stood without delay where the gathered people could see him.
  reasoning_layer_used: Lexical decisions for παραχρῆμα, ἀναστὰς, and ἐνώπιον αὐτῶν
  rationale: A separate sentence and common phrasing make the immediate, public action easy to follow.
- pob_phrase: picked up what he had been lying on
  simplified_phrase: He picked up what he had been lying on[a]
  preserved_meaning: He lifted and took the object that had supported him without naming it more specifically than the Greek does.
  reasoning_layer_used: Lexical and theological decisions for ἄρας and ἐφ’ ὃ κατέκειτο
  rationale: The main text keeps the source’s deliberate lack of a specific noun, while the footnote offers the likely concrete sense.
- pob_phrase: went away to his house, glorifying God
  simplified_phrase: went to his house, glorifying God
  preserved_meaning: He returned to his house while honoring and exalting God.
  reasoning_layer_used: Lexical decisions for ἀπῆλθεν, εἰς τὸν οἶκον αὐτοῦ, and δοξάζων τὸν θεόν
  rationale: Dropping the redundant English particle “away” smooths the sentence while retaining his movement home and God-directed honor.
