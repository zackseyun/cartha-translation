translation:
  language: en
  text: James and John, the sons of Zebedee, were amazed too. They were Simon’s fishing partners. Then Jesus said to Simon, “Do not be afraid. From now on, you will be catching people alive.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek means catching or taking people alive, not killing them; Luke’s wording differs from “fishers of men” in Matthew 4:19 and Mark 1:17.
    reason: lexical_alternative
