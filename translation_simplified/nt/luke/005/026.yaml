simplification_decisions:
- pob_phrase: amazement seized them all
  simplified_phrase: Everyone was overcome with amazement
  preserved_meaning: Overwhelming astonishment affected the whole crowd.
  reasoning_layer_used: Lexical decisions for ἔκστασις and ἔλαβεν ἅπαντας
  rationale: The recast sentence keeps the vivid force while using more familiar English.
- pob_phrase: they were glorifying God
