translation:
  language: en
  text: While Jesus was in one of the towns, there before him was a man covered with leprosy.[a] When the man saw Jesus, he fell facedown and begged him, “Lord, if you are willing, you can make me clean.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In biblical usage, “leprosy” can refer to various serious skin diseases; being made clean included physical healing and restoration from ritual and social uncleanness.
    reason: cultural_note
simplification_decisions:
- pob_phrase: And it happened that while he was in one of the towns, behold
  simplified_phrase: While Jesus was in one of the towns, there before him
  preserved_meaning: The scene begins during Jesus’ time in a town and presents the man vividly.
  reasoning_layer_used: Lexical decisions for ἐγένετο, the temporal construction, and ἰδοὺ
  rationale: This removes an awkward narrative formula while preserving the vivid introduction.
- pob_phrase: a man full of leprosy
  simplified_phrase: a man covered with leprosy
  preserved_meaning: The skin disease was severe and extensive.
  reasoning_layer_used: Lexical decision for πλήρης λέπρας and POB footnote a
  rationale: The documented alternative makes the severity easier to picture without weakening it.
- pob_phrase: he fell on his face ... cleanse me
  simplified_phrase: he fell facedown ... make me clean
  preserved_meaning: He adopted a humble posture and asked for cleansing with physical, ritual, and social dimensions.
  reasoning_layer_used: Lexical and theological decisions for πεσὼν ἐπὶ πρόσωπον and καθαρίσαι
  rationale: Common wording keeps both the physical image and the biblical concept of cleansing.
translation_notes:
  risk_flags:
  - risk: Modern readers may assume “leprosy” means only Hansen’s disease.
    mitigation: The footnote notes the broader range of skin diseases in biblical usage.
  - risk: “Make me clean” may sound merely hygienic.
    mitigation: The footnote preserves its physical, ritual, and social meaning.
