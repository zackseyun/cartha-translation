translation:
  language: en
  text: He ordered him, “Tell no one. Instead, go and show yourself to the priest. Then make the offering for your cleansing, as Moses commanded.[a] This will be evidence to them.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: See Leviticus 14 for the offering Moses commanded for cleansing from leprosy.
    reason: cross_reference
  - marker: b
    text: “Them” may refer to the priests or to others. The evidence may be favorable testimony or evidence against them.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: but go and show yourself to the priest
  simplified_phrase: Instead, go and show yourself to the priest.
  preserved_meaning: The prohibition is followed by a direct command to appear before the priest.
  reasoning_layer_used: Applied revision and lexical decision for ἀπελθὼν
  rationale: Separate sentences make the contrast and sequence clear.
- pob_phrase: offer for your cleansing as Moses commanded
  simplified_phrase: make the offering for your cleansing, as Moses commanded
  preserved_meaning: The man must offer what Mosaic law requires for cleansing.
  reasoning_layer_used: Lexical decisions for προσένεγκε, περὶ τοῦ καθαρισμοῦ σου, and καθὼς προσέταξεν Μωϋσῆς
  rationale: This supplies the understood offering without making Moses’ command its direct object.
- pob_phrase: for a testimony to them
  simplified_phrase: This will be evidence to them.
  preserved_meaning: The required act provides testimony without defining its audience or whether its force is favorable or adverse.
  reasoning_layer_used: Lexical and theological decisions for εἰς μαρτύριον αὐτοῖς
  rationale: “Evidence” expresses the function more plainly while the footnote preserves the ambiguity.
interpretive_expansions:
- pob_phrase: offer for your cleansing
  rendering: make the offering for your cleansing
  claim: The command concerns a cleansing offering required by Mosaic law.
  evidence:
  - The sacrificial context supports “offering” for προσένεγκε.
  - The POB cross-reference points to the cleansing procedure in Leviticus 14.
  confidence: high
  alternatives_preserved:
  - offer for your cleansing
  - bring the offering for your cleansing
translation_notes:
  risk_flags:
  - risk: “Evidence” could be read as necessarily adverse.
    mitigation: The footnote preserves both favorable testimony and evidence against the recipients.
  - risk: “The offering” makes an implicit object explicit.
    mitigation: The cultic context and Leviticus 14 cross-reference directly support a required cleansing offering.
