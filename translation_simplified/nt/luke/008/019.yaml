translation:
  language: en
  text: Then his mother and brothers[a] came to where he was, but the crowd kept them from reaching him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek says “brothers”; their exact family relationship is not specified here.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: came to him
  simplified_phrase: came to where he was
  preserved_meaning: Jesus’ family came near him without necessarily gaining direct access to him.
  reasoning_layer_used: Lexical decisions for Παρεγένετο and πρὸς αὐτόν, read with the following clause
  rationale: This avoids implying that they had already reached Jesus.
- pob_phrase: they were not able to reach him because of the crowd
  simplified_phrase: the crowd kept them from reaching him
  preserved_meaning: The crowd prevented Jesus’ family from getting to him.
  reasoning_layer_used: Lexical decisions for οὐκ ἠδύναντο, συντυχεῖν αὐτῷ, and διὰ τὸν ὄχλον
  rationale: The active wording states the same cause and inability more directly.
- pob_phrase: his brothers
  simplified_phrase: brothers[a]
  preserved_meaning: The text calls the male family members brothers without defining their precise relationship.
  reasoning_layer_used: Theological decision on the reference of ἀδελφοί
  rationale: The text retains “brothers,” while the note preserves the documented ambiguity.
translation_notes:
  risk_flags:
  - risk: Readers may assume “brothers” settles their exact biological relationship to Jesus.
    mitigation: The footnote states that the verse does not define that relationship.
