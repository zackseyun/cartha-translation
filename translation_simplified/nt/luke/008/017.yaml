translation:
  language: en
  text: For nothing is hidden that will not be revealed. No secret will remain unknown; it will come to light.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: will not become evident
  simplified_phrase: will not be revealed
  preserved_meaning: What is hidden will be brought into an open, apparent state.
  reasoning_layer_used: Lexical decisions for φανερός and γενήσεται
  rationale: “Be revealed” expresses the change from hidden to openly apparent in familiar English.
- pob_phrase: nor is anything secret that will not be known
  simplified_phrase: No secret will remain unknown
  preserved_meaning: The strong negative construction rules out any secret remaining unknown.
  reasoning_layer_used: Lexical decision for οὐ μὴ γνωσθῇ
  rationale: The positive English force is made clear without weakening the emphatic Greek construction.
- pob_phrase: and come to light
  simplified_phrase: it will come to light
  preserved_meaning: Secrets will be openly disclosed.
  reasoning_layer_used: Lexical decision for εἰς φανερὸν ἔλθῃ
  rationale: A separate clause preserves the source image while making the sentence easier to follow.
translation_notes:
  risk_flags:
  - risk: “Be revealed” may suggest an unnamed personal revealer more directly than “become evident.”
    mitigation: The wording remains passive and does not identify an agent or narrow the disclosure’s setting.
  - risk: Breaking the parallel saying into two sentences may reduce its formal symmetry.
    mitigation: The repeated ideas of hidden things, secrets, knowing, and coming to light are all retained.
