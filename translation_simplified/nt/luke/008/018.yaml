simplification_decisions:
- pob_phrase: Therefore, pay attention to how you listen.
  simplified_phrase: So pay close attention to how you listen.
  preserved_meaning: Jesus draws a warning from the preceding teaching and calls for careful, responsive listening.
  reasoning_layer_used: Lexical decisions for οὖν, βλέπετε, and πῶς ἀκούετε.
  rationale: “So” makes the connection natural, while “pay close attention” keeps the warning force.
- pob_phrase: For whoever has, more will be given to him
  simplified_phrase: Whoever has will receive more.
  preserved_meaning: The person who has will be given an increase.
  reasoning_layer_used: Lexical decisions for ὃς ἂν ἔχῃ and δοθήσεται αὐτῷ.
  rationale: The shorter active phrasing is easier to read without identifying the giver.
- pob_phrase: and whoever does not have
  simplified_phrase: But whoever does not have
  preserved_meaning: The second condition stands in sharp contrast to the first.
  reasoning_layer_used: Lexical decision for ὃς ἂν μὴ ἔχῃ and the source clause’s antithesis.
  rationale: “But” makes the contrast clear in a new sentence.
translation_notes:
  risk_flags:
  - risk: “Thinks he has” may sound more subjective than the possible sense “seems to have.”
    mitigation: The footnote preserves the documented lexical alternative.
  - risk: The unstated object of “has” could be understood materially.
    mitigation: The opening warning keeps the saying tied to listening without over-resolving it.
