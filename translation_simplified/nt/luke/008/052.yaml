simplification_decisions:
- pob_phrase: And they were all weeping and mourning for her.
  simplified_phrase: Everyone was crying and mourning for her.
  preserved_meaning: All the mourners were continuing to grieve for the girl.
  reasoning_layer_used: Lexical decisions for ἔκλαιον, πάντες, and ἐκόπτοντο αὐτήν
  rationale: “Everyone was crying” expresses the full scope and ongoing action in common English.
- pob_phrase: Do not weep
  simplified_phrase: Do not cry
  preserved_meaning: Jesus tells the mourners not to continue crying.
  reasoning_layer_used: Lexical decision for Μὴ κλαίετε
  rationale: “Do not cry” is the ordinary modern equivalent without forcing the stronger “stop crying.”
- pob_phrase: for she has not died, but is sleeping
  simplified_phrase: because she has not died but is sleeping
  preserved_meaning: Jesus gives the reason for his command and contrasts death with sleep without resolving the tension.
  reasoning_layer_used: Lexical decisions for οὐ γὰρ, ἀπέθανεν, and καθεύδει, with the theological decision on the sleep metaphor
  rationale: “Because” clearly preserves the source’s explanatory link while retaining the sleep image.
translation_notes:
  risk_flags:
  - risk: Modern readers may understand “sleeping” as a literal diagnosis.
    mitigation: The footnote identifies the metaphorical context without resolving its deliberate tension.
