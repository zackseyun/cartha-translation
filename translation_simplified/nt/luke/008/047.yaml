translation:
  language: en
  text: The woman realized that she had not gone unnoticed. Trembling, she came and fell down before him. In front of everyone, she told why she had touched him and how she was healed immediately.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: when the woman saw that she had not escaped notice
  simplified_phrase: The woman realized that she had not gone unnoticed
  preserved_meaning: She understood that her action had not remained hidden.
  reasoning_layer_used: Lexical decision for οὐκ ἔλαθεν
  rationale: “Realized” and “had not gone unnoticed” express the idiom in direct modern English.
- pob_phrase: she came trembling, and falling down before him
  simplified_phrase: Trembling, she came and fell down before him
  preserved_meaning: Her trembling and physical act of falling before him remain distinct.
  reasoning_layer_used: Lexical decisions for τρέμουσα and προσπεσοῦσα αὐτῷ
  rationale: The recast removes the awkward participle chain without adding that she fell at his feet.
- pob_phrase: declared before all the people
  simplified_phrase: In front of everyone, she told
  preserved_meaning: She publicly reported what had happened.
  reasoning_layer_used: Lexical decisions for ἀπήγγειλεν and ἐνώπιον παντὸς τοῦ λαοῦ
  rationale: “Told” and “in front of everyone” make the public report immediately understandable.
