simplification_decisions:
- pob_phrase: Return to your house
  simplified_phrase: Go back home
  preserved_meaning: The man is commanded to return to the place where he lives.
  reasoning_layer_used: POB lexical decisions for Ὑπόστρεφε and οἶκος
  rationale: “Go back home” is more natural modern English than “return to your house.”
- pob_phrase: tell what great things God has done for you
  simplified_phrase: tell about the great things God has done for you
  preserved_meaning: He must recount God’s powerful work on his behalf.
  reasoning_layer_used: POB lexical decision for διηγοῦ and ὅσα
  rationale: Adding “about” makes the command flow naturally without changing its object.
- pob_phrase: he went away, proclaiming throughout the whole city
  simplified_phrase: He left and announced all over the city
  preserved_meaning: He departed and publicly spread the news across the city.
  reasoning_layer_used: POB lexical decisions for ἀπῆλθεν, κηρύσσων, and καθ’ ὅλην τὴν πόλιν
  rationale: The coordinated verbs and common phrase “all over” make the action easier to follow.
