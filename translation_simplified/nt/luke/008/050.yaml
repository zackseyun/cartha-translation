translation:
  language: en
  text: But Jesus heard this and said to him, “Do not be afraid. Only believe,[a] and she will be saved.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “have faith” or “trust.”
    reason: lexical_alternative
  - marker: b
    text: Or “healed” or “made well.” The Greek word can refer to saving, rescuing, or healing. Here it refers to restoring her to life and wholeness.
    reason: lexical_alternative
