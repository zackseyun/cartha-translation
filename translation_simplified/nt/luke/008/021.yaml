translation:
  language: en
  text: But he replied, “My mother and my brothers[a] are the people who hear God’s word and put it into practice.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “siblings.” The Greek says “brothers,” echoing Jesus’ male relatives, but the statement may also apply to women.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: answered and said to them
  simplified_phrase: replied
  preserved_meaning: Jesus responds directly to those speaking to him.
  reasoning_layer_used: lexical decision for ἀποκριθεὶς εἶπεν
  rationale: “Replied” expresses the narrative response naturally without the redundant English pairing.
- pob_phrase: those who hear the word of God
  simplified_phrase: the people who hear God’s word
  preserved_meaning: Jesus identifies an ongoing group by their response to God’s message.
  reasoning_layer_used: lexical decisions for οἱ ἀκούοντες and τὸν λόγον τοῦ θεοῦ
  rationale: The possessive form and explicit “people” make the group easier to identify.
- pob_phrase: do it
  simplified_phrase: put it into practice
  preserved_meaning: They carry out the message they hear rather than merely listening.
  reasoning_layer_used: lexical decision for ποιοῦντες
  rationale: The fuller phrase makes the intended kind of doing immediately clear.
interpretive_expansions:
- pob_phrase: do it
  rendering: put it into practice
  claim: Doing God’s word means acting on what it says.
  evidence:
  - The lexical rationale says ποιέω means to carry out what is heard.
  - The POB lists “put it into practice” as an accepted alternative.
  confidence: high
  alternatives_preserved:
  - do it
  - obey it
translation_notes:
  risk_flags:
