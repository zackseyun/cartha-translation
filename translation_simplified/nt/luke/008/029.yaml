translation:
  language: en
  text: For he had commanded the unclean spirit to come out of the man. The spirit had seized the man many times.[a] He was kept under guard, bound with chains and shackles. He repeatedly broke the restraints, and the demon drove him into deserted places.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “had seized the man for a long time.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: For many times it had seized him
  simplified_phrase: The spirit had seized the man many times
  preserved_meaning: The unclean spirit violently overpowered the man on repeated occasions.
  reasoning_layer_used: Lexical decision for πολλοῖς χρόνοις and συνηρπάκει
  rationale: Naming the spirit and man removes unclear pronouns while retaining the preferred repeated-episode sense.
- pob_phrase: he was kept bound with chains and shackles, being guarded
  simplified_phrase: He was kept under guard, bound with chains and shackles
  preserved_meaning: Others repeatedly restrained and watched him using two kinds of restraints.
  reasoning_layer_used: Lexical decisions for ἐδεσμεύετο, ἁλύσεσιν καὶ πέδαις, and φυλασσόμενος
  rationale: Ordinary clause order makes the circumstances of his restraint immediately clear.
- pob_phrase: and breaking the bonds, he was driven by the demon into the desolate places
  simplified_phrase: He repeatedly broke the restraints, and the demon drove him into deserted places
  preserved_meaning: He broke free, but the demon forcefully compelled him toward uninhabited places.
  reasoning_layer_used: Lexical and theological decisions for διαρρήσσων, ἠλαύνετο, δαιμόνιον, and ἐρήμους
  rationale: Two direct clauses preserve the forceful actions, personal demonic agency, and plural destination.
