  text: Those on the rock are people who hear the word and receive it with joy. But they have no root. They believe for a while, but when testing comes,[a] they fall away.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “when temptation comes” or “when they face a trial.”
    reason: lexical_alternative
