translation:
  language: en
  text: He said, “You have been given the privilege of knowing the mysteries[a] of God’s kingdom. But for everyone else, these things are spoken in parables, so that though they see, they may not see, and though they hear, they may not understand.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mysteries” are truths about God’s kingdom that are hidden from some and disclosed to others.
    reason: lexical_alternative
  - marker: b
    text: This echoes Isaiah 6:9–10 and may express divine purpose, the result of judgment, or both.
    reason: cross_reference
simplification_decisions:
- pob_phrase: To you it has been given to know
  simplified_phrase: You have been given the privilege of knowing
  preserved_meaning: Knowing remains a granted state, with the giver unstated.
  reasoning_layer_used: Lexical decisions for δέδοται and γνῶναι
  rationale: The natural recast preserves the passive gift and the distinct idea of knowing.
- pob_phrase: but to the rest in parables
  simplified_phrase: But for everyone else, these things are spoken in parables
  preserved_meaning: The others receive Jesus’ message in the form of parables, not the same granted understanding.
  reasoning_layer_used: Lexical decision for τοῖς δὲ λοιποῖς and the documented Greek ellipsis
  rationale: Supplying “are spoken” completes the clause without claiming that disclosed truths are given to the others.
- pob_phrase: so that seeing they may not see, and hearing they may not understand
  simplified_phrase: so that though they see, they may not see, and though they hear, they may not understand
  preserved_meaning: The Isaiah echo, repeated seeing image, and purpose-result tension remain intact.
  reasoning_layer_used: Lexical and theological decisions for ἵνα and the Isaiah allusion
  rationale: The concessive wording reads naturally while preserving the deliberate paradox.
interpretive_expansions:
- pob_phrase: it has been given to know
  rendering: have been given the privilege of knowing
  claim: The gift includes granted access or privilege to know these truths.
  evidence:
  - The lexical rationale describes γνῶναι as a granted ability or privilege of knowing.
  confidence: high
  alternatives_preserved:
  - given the ability to know
  - allowed to know
- pob_phrase: but to the rest in parables
  rendering: But for everyone else, these things are spoken in parables
  claim: The elliptical clause identifies parables as the form in which the others hear the message.
  evidence:
  - The Greek phrase explicitly contrasts the others and names parables as the mode.
  - The following clause says they hear without understanding.
  confidence: moderate
  alternatives_preserved:
  - But for everyone else, it is in parables
  - But everyone else is taught through parables
translation_notes:
  risk_flags:
  - risk: “Privilege” may suggest social status rather than granted access.
    mitigation: “Have been given” and “knowing” define the intended sense.
  - risk: The Isaiah clause may be read as purpose alone.
    mitigation: Footnote b preserves divine purpose, judicial result, or both.
