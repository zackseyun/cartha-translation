translation:
  language: en
  text: When Jesus stepped onto the land, a man from the city met him. The man had demons.[a] For a long time he had worn no clothes. He did not stay in a house but stayed among the tombs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “was possessed by demons.” The Greek reads more literally, “had demons.”
    reason: lexical_alternative
