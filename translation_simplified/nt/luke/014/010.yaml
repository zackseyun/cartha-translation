translation:
  language: en
  text: But when you are invited, take the least honored place at the table.[a] When the person who invited you comes, he will say, “Friend, move up to a higher place.” Then you will be honored in front of all the other guests.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: At such meals, guests reclined at the table, and their places reflected their social honor.
    reason: cultural_note
