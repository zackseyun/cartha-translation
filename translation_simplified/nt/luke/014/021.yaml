translation:
  language: en
  text: When the servant returned, he told his lord[a] what had happened. The master of the house became angry and said to him, “Go out at once into the city’s wide streets and narrow lanes. Bring here the poor, people with disabilities, the blind, and those who cannot walk properly.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “lord” means the servant’s human master, not God.
    reason: source_note
simplification_decisions:
- pob_phrase: And when the servant came back, he reported these things to his lord.
  simplified_phrase: When the servant returned, he told his lord what had happened.
  preserved_meaning: The servant returns and reports the invited guests’ responses to his human superior.
  reasoning_layer_used: POB lexical decisions for παραγενόμενος, ἀπήγγειλεν, ταῦτα, and κύριος
  rationale: Natural wording identifies the prior events without adding the exhaustive sense of “everything.”
- pob_phrase: Then the master of the house, becoming angry, said to his servant
  simplified_phrase: The master of the house became angry and said to him
  preserved_meaning: The householder grows angry before giving the servant another command.
  reasoning_layer_used: POB lexical decisions for ὀργισθεὶς and οἰκοδεσπότης
  rationale: A direct sequence replaces the awkward participle while preserving the onset of anger.
- pob_phrase: the poor and disabled and blind and lame
  simplified_phrase: the poor, people with disabilities, the blind, and those who cannot walk properly
  preserved_meaning: The command distinctly includes all four groups named in the source.
  reasoning_layer_used: POB lexical decisions for πτωχούς, ἀναπείρους, τυφλούς, and χωλούς
  rationale: Modern descriptive wording clarifies the impairments while keeping the mobility-related group distinct.
