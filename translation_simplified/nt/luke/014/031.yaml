translation:
  language: en
  text: Or suppose a king is about to go to war against another king. Won’t he first sit down and decide whether his army of ten thousand can oppose[a] the king advancing against him with twenty thousand?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek verb can also be translated “meet”; here it means meeting an advancing army in battle.
    reason: lexical_alternative
