simplification_decisions:
- pob_phrase: one of those reclining at the table with him
  simplified_phrase: one of the other guests at the table
  preserved_meaning: An unnamed person sharing the meal with Jesus speaks.
  reasoning_layer_used: Lexical decision for τῶν συνανακειμένων and its stated alternative “fellow dinner guests.”
  rationale: The simpler wording keeps the meal setting without requiring readers to understand ancient dining posture.
- pob_phrase: when he heard these things, said to him
  simplified_phrase: heard this and said to him
  preserved_meaning: The guest responds after hearing Jesus’ preceding remarks.
  reasoning_layer_used: Lexical decisions for Ἀκούσας, ταῦτα, and εἶπεν αὐτῷ.
  rationale: A coordinated clause expresses the sequence more naturally while retaining “said to him.”
- pob_phrase: Blessed is whoever will eat bread
  simplified_phrase: Blessed is whoever will eat bread
  preserved_meaning: The saying declares divine favor for future participation in God’s kingdom meal.
  reasoning_layer_used: Lexical and theological decisions for Μακάριος, φάγεται, and ἄρτον.
  rationale: These words remain because they preserve the saying’s theological weight, future sense, and concrete bread image.
translation_notes:
  risk_flags:
  - risk: Replacing the reclining description may obscure the ancient dining posture.
    mitigation: “Guests at the table” preserves the contextually important fact that they were sharing a meal.
