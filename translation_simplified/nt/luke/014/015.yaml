translation:
  language: en
  text: But one of the other guests at the table heard this and said to him, “Blessed is whoever will eat bread[a] in the kingdom of God.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Eat bread” can mean sharing a meal; the wording keeps the original image.
