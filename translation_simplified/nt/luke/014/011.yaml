simplification_decisions:
- pob_phrase: exalts himself will be humbled
  simplified_phrase: lifts himself up will be brought low
  preserved_meaning: A person who promotes himself will undergo humbling.
  reasoning_layer_used: Lexical decisions for ὑψόω and ταπεινόω
  rationale: The plain vertical image preserves the moral contrast while avoiding the less familiar word “exalts.”
- pob_phrase: the one who humbles himself will be exalted
  simplified_phrase: everyone who humbles himself will be lifted up
  preserved_meaning: Anyone who willingly takes a humble position will later be elevated by another.
  reasoning_layer_used: Lexical decisions and implicit-agent theological decision
  rationale: “Lifted up” is common English and keeps both the parallel image and the unnamed agent.
translation_notes:
  risk_flags:
  - risk: “Lifts himself up” could be mistaken for healthy self-encouragement.
    mitigation: “Will be brought low” and the parallel with self-humbling establish the intended warning against self-promotion.
  - risk: Readers may assume that the text explicitly names God as the agent.
    mitigation: The passive wording preserves the source text’s implied but unnamed agent.
