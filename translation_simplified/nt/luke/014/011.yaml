translation:
  language: en
  text: For everyone who lifts himself up will be brought low, and everyone who humbles himself[a] will be lifted up.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek uses singular masculine wording as a general statement that applies to everyone.
