translation:
  language: en
  text: Then the master told the slave, “Go out along the roads and hedges. Compel[a] them to come in, so that my house will be full.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “strongly urge.” The word is forceful, but in this parable it does not necessarily mean using physical force.
    reason: lexical_alternative
