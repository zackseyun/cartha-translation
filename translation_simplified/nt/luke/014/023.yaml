  rationale: “Told” introduces the command naturally while retaining “master” and “slave.”
- pob_phrase: Go out into the roads and hedges
  simplified_phrase: Go out along the roads and hedges
  preserved_meaning: The slave must go outward to boundary places where people may be found.
  reasoning_layer_used: Lexical decisions for Ἔξελθε, ὁδοὺς, and φραγμοὺς
  rationale: “Along” makes the concrete roads-and-hedges image natural in modern English.
- pob_phrase: so that my house may be filled
