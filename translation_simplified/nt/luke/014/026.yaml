translation:
  language: en
  text: Anyone who comes to me cannot be my disciple unless he hates his own father and mother, his wife and children, his brothers and sisters, and even his own life.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “loves less.” The word literally means “hates,” but here it means that loyalty to Jesus must come before even the closest family ties; compare Matthew 10:37.
    reason: lexical_alternative
  - marker: b
    text: Or “his own soul.” Here “life” refers to the cost of being Jesus’ disciple.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: If anyone comes to me and does not hate ... he cannot be my disciple
  simplified_phrase: Anyone who comes to me cannot be my disciple unless he hates
  preserved_meaning: Coming to Jesus is incompatible with discipleship when loyalty to him does not take priority.
  reasoning_layer_used: POB syntax and theological decision on μισεῖ
  rationale: Recasting the condition with “unless” makes the sentence easier to follow while retaining “hates.”
- pob_phrase: father and mother and wife and children and brothers and sisters
  simplified_phrase: father and mother, his wife and children, his brothers and sisters
  preserved_meaning: The demand includes every close family relationship explicitly named in the source.
  reasoning_layer_used: POB lexical decisions for household terms
  rationale: Grouping the family members improves readability without combining or omitting them.
translation_notes:
  risk_flags:
