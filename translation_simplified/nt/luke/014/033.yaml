translation:
  language: en
  text: So then, none of you can be my disciple unless you give up your claim to everything you own.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: every one of you who does not ... cannot
  simplified_phrase: none of you can ... unless
  preserved_meaning: The requirement applies personally to every hearer and is necessary for discipleship.
  reasoning_layer_used: lexical decision for πᾶς ἐξ ὑμῶν and οὐ δύναται εἶναί μου μαθητής
  rationale: The recast negative condition is easier to follow while keeping the saying's full force.
- pob_phrase: renounce all his own possessions
  simplified_phrase: give up your claim to everything you own
  preserved_meaning: A disciple must decisively surrender any claim to possessions without making literal disposal explicit.
  reasoning_layer_used: lexical and theological decisions for ἀποτάσσεται and possessions
  rationale: Common wording explains the intended kind of renunciation without weakening the demand.
interpretive_expansions:
- pob_phrase: renounce
  rendering: give up your claim
  claim: The renunciation concerns one's claim to possessions, not necessarily physical disposal in every circumstance.
  evidence:
  - The POB lexical rationale says the verb conveys relinquishing claim or attachment.
  - The POB theological decision rejects making universal literal divestment explicit.
  confidence: high
  alternatives_preserved:
  - give up
  - say farewell to
translation_notes:
  risk_flags:
  - risk: Readers may still take the saying as requiring literal disposal of every possession.
    mitigation: The phrase “give up your claim” preserves the POB's chosen distinction while retaining the radical demand.
