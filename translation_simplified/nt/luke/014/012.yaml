translation:
  language: en
  text: He also said to the man who had invited him, “When you give an earlier meal or a dinner, do not invite your friends, your brothers, your relatives, or your rich neighbors. Otherwise, they may invite you back, and that will be your repayment.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And he was also saying to the one who had invited him
  simplified_phrase: He also said to the man who had invited him
  preserved_meaning: Jesus addressed the man who had invited him.
  reasoning_layer_used: POB lexical decisions for Ἔλεγεν δὲ καὶ and τῷ κεκληκότι αὐτόν
  rationale: Simple past makes the narrative natural while retaining the inviter and the sense of “also.”
- pob_phrase: a luncheon or a dinner
  simplified_phrase: an earlier meal or a dinner
  preserved_meaning: The first term refers to a meal earlier than the later main meal without fixing its exact time.
  reasoning_layer_used: POB lexical decisions and footnote for ἄριστον and δεῖπνον
  rationale: “Earlier meal” is clearer than “luncheon” and preserves the documented range that can include breakfast or a midday meal.
- pob_phrase: lest they also invite you in return and it become repayment to you
  simplified_phrase: Otherwise, they may invite you back, and that will be your repayment
  preserved_meaning: A returned invitation would serve as repayment for the original hospitality.
  reasoning_layer_used: POB lexical decisions for μήποτε, ἀντικαλέσωσίν σε, and γένηται ἀνταπόδομά σοι
  rationale: The warning, reciprocal invitation, and resulting repayment are expressed in direct modern English.
translation_notes:
  risk_flags:
  - risk: Simple past reduces the progressive aspect of “was saying.”
    mitigation: The narrative event and the connective sense of “also” remain clear.
  - risk: “Earlier meal” is less idiomatic than naming a specific meal.
    mitigation: It avoids falsely limiting the meal to midday and preserves its contrast with dinner.
