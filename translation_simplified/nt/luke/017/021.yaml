translation:
  language: en
  text: Nor will people say, “Look, it is here!” or “There it is!” That is because the kingdom of God is already here among you.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “is within you.” The Greek phrase can refer either to something within people or to something present among them.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: will they say
  simplified_phrase: will people say
  preserved_meaning: People will not identify the kingdom by pointing to a location.
  reasoning_layer_used: lexical decision and immediate context
  rationale: Naming the implied people makes the sentence clear without changing its reference.
- pob_phrase: For behold
  simplified_phrase: That is because
  preserved_meaning: The kingdom’s presence explains why people will not point to it elsewhere.
  reasoning_layer_used: lexical decision for γὰρ and revision history
  rationale: The causal link is clearer in common English while the following statement carries the emphasis.
- pob_phrase: is in your midst
  simplified_phrase: is already here among you
  preserved_meaning: God’s kingdom is presently among the plural audience.
  reasoning_layer_used: lexical and theological decisions for ἐντὸς ὑμῶν
  rationale: The wording makes the corporate presence understandable while retaining the disputed inward sense in a note.
interpretive_expansions:
- pob_phrase: is in your midst
  rendering: is already here among you
  claim: The kingdom is presently near among Jesus’ hearers rather than waiting at another visible location.
  evidence:
  - The Greek present tense states that the kingdom is present.
  - The plural audience supports the corporate sense.
  - The immediate context contrasts this presence with pointed-out locations.
  confidence: high
  alternatives_preserved:
  - is within you
translation_notes:
  risk_flags:
  - risk: “Already” makes the present-time force more explicit than POB.
    mitigation: The present tense and contrast with other locations support this bounded clarification.
  - risk: “Among you” may seem to eliminate the inward interpretation.
    mitigation: The viable alternative “within you” remains in the footnote.
