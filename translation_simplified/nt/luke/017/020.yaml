translation:
  language: en
  text: The Pharisees asked Jesus when the kingdom of God would come. He answered, “The kingdom of God does not come with outward signs that people can watch for,”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “in a way people can observe” or “through careful watching.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: When he was asked by the Pharisees
  simplified_phrase: The Pharisees asked Jesus
  preserved_meaning: The Pharisees asked the question, and Jesus received it.
  reasoning_layer_used: Lexical decision and immediate narrative context
  rationale: The active wording is easier to follow while preserving who asked whom.
- pob_phrase: when the kingdom of God was coming
  simplified_phrase: when the kingdom of God would come
  preserved_meaning: Their question concerns the expected arrival of God's kingdom.
  reasoning_layer_used: Lexical decision for πότε and ἔρχεται
  rationale: “Would come” fits a reported question naturally in modern English.
- pob_phrase: he answered them and said
  simplified_phrase: He answered
  preserved_meaning: Jesus directly replied to the Pharisees.
  reasoning_layer_used: Lexical rationale on Greek narrative redundancy
  rationale: English does not need both verbs to express the reply.
interpretive_expansions:
- pob_phrase: with observable signs
  rendering: with outward signs that people can watch for
  claim: Jesus denies that the kingdom arrives through outward signs people can monitor.
  evidence:
  - The lexical rationale describes signs detectable by observation or scrutiny.
  - The theological decision specifies outward signs that can be tracked.
  confidence: high
