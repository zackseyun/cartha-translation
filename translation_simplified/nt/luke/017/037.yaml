translation:
  language: en
  text: They asked him, “Where, Lord?” He answered, “Where the body is, the vultures[a] will gather.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “eagles.” The Greek word can refer to either, but “vultures” fits the picture of birds gathering around a body.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And answering, they say to him
  simplified_phrase: They asked him
  preserved_meaning: The disciples respond to Jesus by asking a question.
  reasoning_layer_used: Lexical decisions for ἀποκριθέντες and λέγουσιν
  rationale: A direct past-tense clause replaces the awkward participle and historical present.
- pob_phrase: And he said to them
  simplified_phrase: He answered
  preserved_meaning: Jesus responds directly to their question.
  reasoning_layer_used: Immediate discourse context
  rationale: “Answered” states the natural relationship between the question and Jesus’ reply.
- pob_phrase: there also the vultures will be gathered
  simplified_phrase: the vultures will gather
  preserved_meaning: Carrion birds will assemble where the body is.
  reasoning_layer_used: Lexical decisions for ἀετοὶ and ἐπισυναχθήσονται
  rationale: The active wording is clearer English while retaining the proverbial image and future sense.
translation_notes:
  risk_flags:
  - risk: Changing the passive “will be gathered” to active “will gather” reduces formal correspondence.
    mitigation: The natural English construction preserves the same event without identifying an agent.
  - risk: “Vultures” does not display the Greek word’s possible sense “eagles” in the main text.
    mitigation: The lexical alternative is retained in a footnote.
