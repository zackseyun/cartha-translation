simplification_decisions:
- pob_phrase: if he sins against you
  simplified_phrase: if someone sins against you
  preserved_meaning: A person repeatedly commits an offense against the hearer.
  reasoning_layer_used: POB lexical decision on ἁμαρτήσῃ εἰς σὲ and αὐτῷ
  rationale: “Someone” and “that person” make the generic reference natural without changing who must be forgiven.
- pob_phrase: seven times returns to you
  simplified_phrase: comes back to you seven times
  preserved_meaning: The offender repeatedly returns to the hearer and says, “I repent.”
  reasoning_layer_used: POB lexical decision on ἐπιστρέψῃ πρὸς σὲ
  rationale: “Comes back” is common English, while retaining the second “seven times” preserves the source’s explicit repetition.
- pob_phrase: you shall forgive him
  simplified_phrase: you must forgive that person
  preserved_meaning: Jesus directs the hearer to forgive the repentant offender.
  reasoning_layer_used: POB theological decision on imperative ἀφήσεις
  rationale: “Must” clearly communicates the command carried by the Greek future form.
