simplification_decisions:
- pob_phrase: in the days of Noah / in the days of the Son of Man
  simplified_phrase: in Noah’s time / in the time of the Son of Man
  preserved_meaning: Both expressions refer to periods associated with Noah and the Son of Man.
  reasoning_layer_used: Lexical decision for the temporal idiom ἐν ταῖς ἡμέραις
  rationale: “Time” communicates the temporal idiom more directly while preserving the parallel.
- pob_phrase: just as it happened ... so it will be also
  simplified_phrase: just as it was ... so it will be
  preserved_meaning: The character of the two periods is compared without claiming that every earlier event will recur.
  reasoning_layer_used: Lexical decisions for καθὼς, ἐγένετο, οὕτως, and ἔσται, with Luke 17:27–30
  rationale: The direct comparison remains open for the following verses to explain.
