translation:
  language: en
  text: He saw them and said, “Go and show yourselves to the priests for examination.”[a] On their way, they were cleansed.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The priests examined people who had recovered from a skin disease; see Leviticus 14.
