translation:
  language: en
  text: The Lord said, “If you had faith like a mustard seed, you would tell this mulberry tree, ‘Be pulled up by the roots and planted in the sea,’ and it would obey you.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: you would say to this mulberry tree
  simplified_phrase: you would tell this mulberry tree
  preserved_meaning: Faith addresses the tree with a command.
  reasoning_layer_used: The lexical decision for ἐλέγετε ἂν preserves the hypothetical force as “would.”
  rationale: “Tell” makes the command relationship immediately clear.
- pob_phrase: Be uprooted and be planted in the sea
  simplified_phrase: Be pulled up by the roots and planted in the sea
  preserved_meaning: The tree is commanded to leave its roots and be planted impossibly in the sea.
  reasoning_layer_used: The lexical decisions preserve both the root image and the paradoxical sea image.
  rationale: “Pulled up by the roots” explains “uprooted” in common English without weakening the image.
translation_notes:
  risk_flags:
  - risk: Readers may take the mustard-seed comparison as referring only to small size.
    mitigation: The wording retains POB’s open comparison, “like a mustard seed.”
  - risk: The conditional could be mistaken for a direct claim that the disciples have no faith.
    mitigation: The “if you had ... would” construction preserves POB’s hypothetical wording.
