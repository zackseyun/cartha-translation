  preserved_meaning: Jesus introduces a rhetorical example involving a slave owner.
  reasoning_layer_used: POB translation and theological decision on δοῦλος
  rationale: The new opening is easier to follow while retaining the unequal master-slave relationship.
- pob_phrase: plowing or shepherding
  simplified_phrase: plowing or tending a flock
  preserved_meaning: The slave is doing either agricultural or pastoral work.
  reasoning_layer_used: POB lexical decisions on ἀροτριῶντα and ποιμαίνοντα
  rationale: “Tending a flock” makes the activity clear without specifying the animals.
- pob_phrase: Come at once and recline at the table
  simplified_phrase: Come at once and sit down to eat
  preserved_meaning: The master invites the slave to take his place for the meal immediately.
