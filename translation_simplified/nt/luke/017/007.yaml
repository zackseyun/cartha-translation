translation:
  language: en
  text: Suppose one of you has a slave[a] who is plowing or tending a flock. When he comes in from the field, would you tell him, “Come at once and sit down to eat”[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “servant” or “bondservant”; the Greek word describes a bonded household worker, not a hired worker.
    reason: lexical_alternative
  - marker: b
    text: Literally, “recline at the table,” the customary posture for eating in that culture.
    reason: cultural_note
simplification_decisions:
