translation:
  language: en
  text: In the same way, when you have done everything you were commanded to do, say, “We are unworthy servants.[a] We have done only what was required of us.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Unworthy” means having no claim to special credit or reward, not being worthless.
    reason: simplification_note
simplification_decisions:
- pob_phrase: So also you
  simplified_phrase: In the same way
  preserved_meaning: Jesus applies the preceding illustration to his hearers.
  reasoning_layer_used: POB lexical decision for οὕτως καὶ ὑμεῖς
  rationale: The fuller transition is easier to understand while preserving the link to the illustration.
- pob_phrase: all that was commanded you
  simplified_phrase: everything you were commanded to do
  preserved_meaning: The hearers have completed all that was authoritatively commanded.
  reasoning_layer_used: POB lexical decision for πάντα τὰ διαταχθέντα ὑμῖν
  rationale: Ordinary English clause order makes the command and action immediately clear.
- pob_phrase: what we were obligated to do
  simplified_phrase: only what was required of us
  preserved_meaning: Their obedience fulfilled an obligation and did not earn extra credit.
  reasoning_layer_used: POB lexical and theological rationale for ὀφείλω and ἀχρεῖοι
  rationale: “Required of us” expresses duty in natural English, while “only” preserves the absence of surplus merit.
interpretive_expansions:
- pob_phrase: we have done what we were obligated to do
  rendering: We have done only what was required of us.
  claim: The obedience gives no claim to special credit beyond fulfilling duty.
  evidence:
  - The POB rationale states that obedience does not place God in one’s debt.
  - The preceding master-slave illustration frames the work as an assigned obligation.
  confidence: high
  alternatives_preserved:
  - We have done what was our duty to do.
translation_notes:
  risk_flags:
  - risk: Modern readers may hear “unworthy” as a claim that disciples are intrinsically worthless.
    mitigation: The footnote limits the meaning to having no claim to special credit or reward.
