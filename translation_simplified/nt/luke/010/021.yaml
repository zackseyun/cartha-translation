translation:
  language: en
  text: At that very time, he rejoiced in the Holy Spirit. He said, “I praise you,[a] Father, Lord of heaven and earth. You hid these things from those who are wise and understanding, but you revealed them to little children.[b] Yes, Father, because this pleased you.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “I thank you.” The Greek expression can convey both praise and thanks in prayer.
    reason: lexical_alternative
  - marker: b
    text: The image of little children points to people who are humble, dependent, or considered unimportant.
    reason: lexical_alternative
  - marker: c
    text: Or “because this was your gracious will.”
    reason: alternative_reading
