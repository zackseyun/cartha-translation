translation:
  language: en
  text: Look, I have given you authority to walk on snakes and scorpions,[a] and authority over all the enemy’s power. Nothing will ever harm you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The snakes and scorpions may also picture hostile spiritual forces, but the image itself is kept open.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Behold
  simplified_phrase: Look
  preserved_meaning: Jesus calls attention emphatically to what follows.
  reasoning_layer_used: POB lexical decision for ἰδού
  rationale: “Look” keeps the attention-getting force in common modern English.
- pob_phrase: authority to tread on snakes and scorpions
  simplified_phrase: authority to walk on snakes and scorpions
  preserved_meaning: The disciples receive delegated authority while the concrete image remains intact.
  reasoning_layer_used: POB lexical and theological decisions for ἐξουσία and πατεῖν
  rationale: “Walk on” is immediately clear without turning the image into a stronger act of trampling.
- pob_phrase: and over all the power of the enemy
  simplified_phrase: and authority over all the enemy’s power
  preserved_meaning: Their delegated authority extends over the full might of the unnamed enemy.
  reasoning_layer_used: POB lexical decisions distinguishing ἐξουσία from δύναμις
  rationale: Repeating “authority” makes the sentence easier to follow while preserving its contrast with “power.”
translation_notes:
  risk_flags:
  - risk: Readers may take snakes and scorpions as only literal or only symbolic.
    mitigation: The main text preserves the image, and the footnote keeps the contextual spiritual possibility open.
  - risk: The absolute promise about harm may be interpreted without regard to its narrative context.
    mitigation: The emphatic wording is retained because the Greek strongly states it, without adding an unsupported qualification.
