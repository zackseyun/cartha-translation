translation:
  language: en
  text: But only a few things are needed—or even one.[a] For Mary has chosen the good portion,[b] which will not be taken away from her.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may also mean “only one thing is necessary,” or, in the meal setting, “only a few dishes are needed—or even one.”
    reason: alternative_reading
  - marker: b
    text: “Good portion” may refer both to a serving of food and to a share in what is truly valuable.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: But few things are needed—or one
  simplified_phrase: But only a few things are needed—or even one
  preserved_meaning: Jesus contrasts a small number of needed things with one without deciding whether he means dishes or one essential thing.
  reasoning_layer_used: POB theological decision and lexical rationale for ὀλίγων and ἢ ἑνός
  rationale: “Only” and “even” make the contrast natural, while the footnote preserves its ambiguity.
- pob_phrase: For Mary has chosen
  simplified_phrase: For Mary has chosen
  preserved_meaning: Mary’s deliberate choice explains the preceding statement about what is needed.
  reasoning_layer_used: Source γάρ and POB lexical rationale for ἐξελέξατο
  rationale: Retaining “For” preserves the source’s explicit explanatory connection.
- pob_phrase: which will not be taken away from her
  simplified_phrase: which will not be taken away from her
  preserved_meaning: The good portion Mary chose cannot be removed from her.
  reasoning_layer_used: POB lexical rationale for ἥτις and οὐκ ἀφαιρεθήσεται αὐτῆς
  rationale: The relative clause directly identifies permanence as a quality of her chosen portion.
translation_notes:
  risk_flags:
  - risk: Readers may assume “one” means only one spiritual necessity or only one dish.
    mitigation: Footnote a preserves both readings without resolving the tension.
  - risk: “Good portion” may sound like food alone.
    mitigation: Footnote b explains its possible meal and figurative senses.
