translation:
  language: en
  text: But Martha was distracted by the many things she was doing to serve. She came up to Jesus and said, “Lord, does it not matter to you that my sister has left me alone to do the serving? So tell her to help me.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: distracted with much serving
  simplified_phrase: distracted by the many things she was doing to serve
  preserved_meaning: Martha was being drawn away by a large amount of practical service.
  reasoning_layer_used: Lexical decisions for περιεσπᾶτο and περὶ πολλὴν διακονίαν
  rationale: This expresses abundant practical service without implying that every task was hers or that she was obligated to do it.
- pob_phrase: has left me to serve alone
  simplified_phrase: has left me alone to do the serving
  preserved_meaning: Martha complains that she is serving without her sister’s help.
  reasoning_layer_used: Lexical decision for μόνην με κατέλειπεν διακονεῖν
  rationale: The revised order is more natural while preserving both serving and being left alone.
- pob_phrase: Tell her, then, to help me
  simplified_phrase: So tell her to help me
  preserved_meaning: Martha draws a conclusion from her complaint and directly asks for her sister’s help.
  reasoning_layer_used: Lexical decisions for εἰπὲ οὖν and συναντιλάβηται
  rationale: “So” conveys the inference in clear modern English.
interpretive_expansions:
- pob_phrase: she came up
  rendering: She came up to Jesus
  claim: Jesus is the person Martha approached and addressed.
  evidence:
  - The direct address “Lord” identifies Jesus as the hearer.
  - The immediate narrative context places Jesus in the home.
  confidence: high
translation_notes:
  risk_flags:
  - risk: “The many things she was doing to serve” represents the large amount of service as multiple activities.
    mitigation: It retains the broad category of practical service without narrowing it to preparations or adding necessity.
