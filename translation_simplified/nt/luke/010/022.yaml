translation:
  language: en
  text: My Father has handed everything over to me. No one knows who the Son is except the Father. No one knows who the Father is except the Son and anyone to whom the Son chooses to reveal the Father.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: All things have been handed over to me by my Father
  simplified_phrase: My Father has handed everything over to me
  preserved_meaning: The Father is the one who handed all things over to the Son, with continuing effect.
  reasoning_layer_used: Lexical decisions for πάντα, παρεδόθη, and ὑπὸ τοῦ πατρός μου
  rationale: Active word order and “everything” make the statement immediate without changing its scope or agency.
- pob_phrase: and no one knows who the Son is except the Father, and who the Father is except the Son
  simplified_phrase: No one knows who the Son is except the Father. No one knows who the Father is except the Son
  preserved_meaning: The Father and Son have unique reciprocal knowledge of one another.
  reasoning_layer_used: Theological decision on mutual exclusive knowledge
  rationale: Two parallel sentences clarify the relationship without adding “fully” or “truly.”
- pob_phrase: anyone to whom the Son chooses to reveal him
  simplified_phrase: anyone to whom the Son chooses to reveal the Father
  preserved_meaning: The Son decides to whom he makes the Father known.
  reasoning_layer_used: Lexical decisions for βούληται and ἀποκαλύψαι
  rationale: Naming the Father removes an unclear pronoun while preserving the Son’s decisive agency.
interpretive_expansions:
