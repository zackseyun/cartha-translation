  reasoning_layer_used: Lexical decisions for ὁμοίως and καί
  rationale: The opening phrase naturally carries both the comparative and additive force.
- pob_phrase: came to the place
  simplified_phrase: came to that place
  preserved_meaning: The Levite arrived at the location where the injured man lay.
  reasoning_layer_used: Lexical decision for κατὰ τὸν τόπον
  rationale: “That place” clearly points back to the known location without adding detail.
- pob_phrase: when he saw him, he passed by on the opposite side
  simplified_phrase: When he saw the man, he passed by on the other side
  preserved_meaning: He saw the injured man and deliberately avoided him by passing on the far side.
  reasoning_layer_used: Lexical decisions for ἰδὼν and ἀντιπαρῆλθεν
  rationale: “The man” clarifies the pronoun, while “the other side” preserves the avoidance image.
