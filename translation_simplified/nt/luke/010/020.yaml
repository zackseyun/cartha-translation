translation:
  language: en
  text: But do not rejoice because the spirits[a] submit to you. Rejoice instead because your names have been written in the heavens.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The context indicates hostile spiritual beings, though the Greek says simply “the spirits.”
