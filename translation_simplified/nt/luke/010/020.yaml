simplification_decisions:
- pob_phrase: Nevertheless, do not rejoice in this, that
  simplified_phrase: But do not rejoice because
  preserved_meaning: Jesus strongly redirects the reason for the disciples’ joy.
  reasoning_layer_used: Lexical decision for πλὴν and the rhetorical contrast in μὴ χαίρετε ... χαίρετε δὲ.
  rationale: The shorter wording expresses the corrective contrast in ordinary English.
- pob_phrase: but rejoice that
  simplified_phrase: Rejoice instead because
  preserved_meaning: The second command replaces the first basis for rejoicing with the proper one.
  reasoning_layer_used: Lexical decision preserving the repeated command χαίρετε.
  rationale: A new sentence makes the contrast immediate while repeating “rejoice.”
- pob_phrase: your names have been written in the heavens
  simplified_phrase: your names have been written in the heavens
  preserved_meaning: Their names were recorded in the heavenly realm and remain there.
  reasoning_layer_used: Lexical and theological decisions for the perfect ἐγγέγραπται and plural οὐρανοῖς.
  rationale: The wording is retained because the audit requires both the completed enduring action and the plural image.
translation_notes:
  risk_flags:
