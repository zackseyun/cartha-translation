translation:
  language: en
  text: He told them, “There is a large harvest, but only a few workers. So pray to the Lord of the harvest to send out workers into his harvest.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “send workers out forcefully”; the Greek verb is stronger than simply “send.”
