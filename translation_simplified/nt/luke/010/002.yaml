simplification_decisions:
- pob_phrase: And he said to them
  simplified_phrase: He told them
  preserved_meaning: Jesus addressed the group as the narrative continued.
  reasoning_layer_used: Lexical decisions for ἔλεγεν and δὲ
  rationale: The simpler opening preserves the act of speaking without requiring a connective.
- pob_phrase: The harvest is plentiful, but the workers are few
  simplified_phrase: There is a large harvest, but only a few workers
  preserved_meaning: An abundant harvest is contrasted with a small number of workers.
  reasoning_layer_used: Lexical decisions for θερισμός, πολύς, ἐργάται, and ὀλίγοι
  rationale: Common wording keeps both the agricultural image and the sharp contrast.
- pob_phrase: Therefore pray to the Lord of the harvest that he would send out workers
  simplified_phrase: So pray to the Lord of the harvest to send out workers
  preserved_meaning: The shortage leads to a command to ask the harvest’s Lord to commission workers.
  reasoning_layer_used: Lexical decisions for δεήθητε, οὖν, κύριος, ὅπως, and ἐκβάλῃ; theological decision on the title
  rationale: The direct request avoids turning the prayer into a prediction while retaining the title and outward movement.
