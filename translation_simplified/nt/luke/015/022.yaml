  rationale: “Told” makes the following commands flow naturally while “slaves” preserves their bonded status.
- pob_phrase: Quickly, bring out
  simplified_phrase: Hurry! Bring out
  preserved_meaning: The father orders immediate action.
  reasoning_layer_used: POB lexical decision on Ταχὺ
  rationale: A short exclamation expresses the urgency more directly in common English.
- pob_phrase: put it on him
  simplified_phrase: dress him in it
  preserved_meaning: The slaves are to clothe the son in the best robe.
  reasoning_layer_used: POB lexical decision on ἐνδύσατε αὐτόν
  rationale: “Dress him in it” clearly identifies the robe as the clothing being put on him.
