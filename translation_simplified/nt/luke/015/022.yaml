translation:
  language: en
  text: But the father told his servants,[a] “Hurry! Bring out the best robe and dress him in it. Put a ring on his hand and sandals on his feet.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “servants.” The Greek word refers to enslaved or bonded household workers.
    reason: alternative_reading
