translation:
  language: en
  text: Suppose a man among you has a hundred sheep and loses one. Would he not leave the other ninety-nine in the open country[a] and go looking for the lost sheep until he finds it?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “in the wilderness.” The Greek can also refer to open pastureland or a deserted place.
    reason: lexical_alternative
