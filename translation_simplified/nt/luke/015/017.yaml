translation:
  language: en
  text: Then he came to himself[a] and said, “How many of my father’s hired workers have more bread than they need, while I am here wasting away from hunger!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “came to his senses.” The Greek literally says “came to himself.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: But when he came to himself, he said
  simplified_phrase: Then he came to himself and said
  preserved_meaning: He regained clear self-awareness before speaking.
  reasoning_layer_used: POB lexical decision for εἰς ἑαυτὸν ... ἐλθὼν and narrative context
  rationale: The simpler transition preserves the Greek image and sequence of events.
- pob_phrase: have more than enough bread
  simplified_phrase: have more bread than they need
  preserved_meaning: The hired workers have a surplus of bread.
  reasoning_layer_used: POB lexical decisions for περισσεύονται ἄρτων
  rationale: Ordinary wording retains both the concrete bread image and the idea of abundance.
- pob_phrase: here I am perishing from hunger
  simplified_phrase: I am here wasting away from hunger
  preserved_meaning: His hunger is causing severe and continuing ruin.
  reasoning_layer_used: POB lexical decisions for ὧδε, λιμῷ, and ἀπόλλυμαι
  rationale: “Wasting away” naturally conveys an ongoing desperate condition without specifying immediate death.
translation_notes:
  risk_flags:
  - risk: “Wasting away” may sound slightly less severe than “perishing.”
    mitigation: The explicit cause, hunger, and contrast with surplus bread preserve the desperation.
