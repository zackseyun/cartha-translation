simplification_decisions:
- simplified_phrase: we had to celebrate and rejoice
  reasoning_layer_used: POB audit trail
- simplified_phrase: has come back to life
  reasoning_layer_used: POB audit trail
retained_terms:
- term: this brother of yours
  reason: Retained the specific phrasing 'this brother of yours' (matching 'ὁ ἀδελφός σου οὗτος') because it highlights the father's pointed reminder to the older son of their sibling relationship, which is a key narrative and theological point.
- term: was dead... was lost
  reason: These contrasting pairs are crucial to the climax of the parable of the prodigal son and are retained for their theological and narrative weight.
translation_notes:
  source_alignment_notes: The simplification maintains the exact semantic structure of the Greek, including the parallelisms of death/life and lost/found. The transition of the passive 'εὑρέθη' to 'has been found' is kept to emphasize the current state of restoration.
  readability_notes:
  - By changing 'it was necessary' to 'we had to', the sentence flows much better in speech, fitting the dramatic dialogue of the father. The phrasing 'come back to life' is highly readable and idiomatic.
  compression_notes:
  - No theological or narrative details were compressed or removed. The double expression of joy ('celebrate and rejoice') was preserved rather than collapsed, maintaining the intensity of the father's celebration.
  risk_flags:
  - risk: There is a slight risk that 'we had to' might be interpreted as external coercion rather than the inner moral necessity of the father's love, but the context of celebration makes the natural, willing sense of the obligation clear.
    mitigation: Flag retained for reviewer attention.
