translation:
  language: en
  text: But we had to celebrate and rejoice, because this brother of yours was dead and has come back to life[a]; he was lost and has been found.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Greek 'lived' or 'came to life'; this is a metaphor for being restored to the family.
