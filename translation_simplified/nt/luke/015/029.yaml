  rationale: “Replied to” is ordinary English and keeps the direct response.
- pob_phrase: for so many years I have been slaving for you
  simplified_phrase: I have worked like a slave for you all these years
  preserved_meaning: The older son bitterly describes his long service as slave-like labor.
