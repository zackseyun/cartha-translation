translation:
  language: en
  text: But he replied to his father, “Look, I have worked like a slave for you[a] all these years and have never disobeyed a single command from you. Yet you have never given me even a young goat so I could celebrate with my friends.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “served you.” The stronger wording reflects the older son’s bitter view of his service, not literal enslavement.
    reason: lexical_alternative
