translation_notes:
  source_alignment_notes: The translation aligns precisely with SBLGNT meaning and POB's lexical decisions. We preserved 'squandered' for διεσκόρπισεν, and 'recklessly' for ἀσώτως. The separation of the long compound sentence into two shorter sentences maintains the dramatic narrative arc without losing any theological weight.
  readability_notes:
  - By breaking the single, long, clause-heavy sentence into two sentences, we greatly improve readability for modern audiences. Replacing 'after not many days' with 'A few days later' removes awkward literalism, and using 'wealth' instead of 'property' clarifies the narrative meaning of liquid assets.
  compression_notes:
  - Syntactic compression was applied by splitting the sentence and using direct active verbs. No theological or lexical detail was lost. The meaning of the Greek participle ζῶν ('living') was preserved as an adverbial modifier.
  risk_flags:
  - risk: None. We resisted interpreting the reckless life specifically as debauchery or prostitution, which only comes up later in the older brother's accusation, thus remaining faithful to Luke's deliberate lexical choice here.
