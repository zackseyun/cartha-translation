translation:
  language: en
  text: In the same way, I tell you, there is joy in the presence of God's angels over one sinner who repents.
  philosophy: optimal-equivalence
simplification_decisions:
- simplified_phrase: in the presence of God's angels
  preserved_meaning: Using 'in the presence of' is standard, high-quality modern English that retains the precise spatial ambiguity of the Greek preposition ἐνώπιον (denoting that the rejoicing occurs in the heavenly court, possibly by God Himself, rather than definitely by the angels). 'God's angels' is a more natural genitive structure in modern English than 'the angels of God'.
  reasoning_layer_used: POB audit trail
  rationale: Using 'in the presence of' is standard, high-quality modern English that retains the precise spatial ambiguity of the Greek preposition ἐνώπιον (denoting that the rejoicing occurs in the heavenly court, possibly by God Himself, rather than definitely by the angels). 'God's angels' is a more natural genitive structure in modern English than 'the angels of God'.
- simplified_phrase: who repents
  preserved_meaning: Aligned with the POB theological decision to preserve the established biblical concept of repentance without reducing it to a modern clinical or psychological paraphrase like 'changes their mind'.
  reasoning_layer_used: POB audit trail
  rationale: Aligned with the POB theological decision to preserve the established biblical concept of repentance without reducing it to a modern clinical or psychological paraphrase like 'changes their mind'.
