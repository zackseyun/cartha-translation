simplification_decisions:
- pob_phrase: In the same way, I tell you
  simplified_phrase: The same is true, I tell you
  preserved_meaning: Jesus applies the preceding parable directly to his hearers.
  reasoning_layer_used: Lexical decision for οὕτως and its comparative force.
  rationale: The revised transition states the comparison in more natural English.
- pob_phrase: before the angels of God
  simplified_phrase: in the presence of God’s angels
  preserved_meaning: The joy occurs before the heavenly angels without naming them as its agents.
  reasoning_layer_used: Theological decision on the location and agent of the joy.
  rationale: The fuller phrase is clearer while preserving the documented ambiguity.
- pob_phrase: over one sinner who repents
  simplified_phrase: when one sinner repents
  preserved_meaning: A single sinner’s repentance is the occasion for joy.
  reasoning_layer_used: Lexical decisions for ἐπί and μετανοοῦντι.
  rationale: The time-and-occasion clause is easier to follow without defining repentance more narrowly.
translation_notes:
  risk_flags:
  - risk: Readers may still assume that the angels are the ones rejoicing.
