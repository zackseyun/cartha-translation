translation:
  language: en
  text: I tell you, in the same way[a] there will be more joy in heaven over one sinner who changes their mind than over ninety-nine righteous people[b] who have no need of such a change.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'thus' or 'so.' This connects the heavenly joy to the point of the story Jesus just told.
    reason: simplification_note
  - marker: b
    text: The Greek word for 'righteous' can be read literally or with irony in this context; the translation preserves the word without choosing an interpretation.
    reason: simplification_note
simplification_decisions:
- preserved_meaning: Added 'more' to 'joy' to make the comparative structure ('more joy... than over') grammatically complete and fluent in modern English.
  reasoning_layer_used: POB audit trail
  rationale: Added 'more' to 'joy' to make the comparative structure ('more joy... than over') grammatically complete and fluent in modern English.
- preserved_meaning: Simplified the phrase 'who has a change of mind' to 'who changes their mind' to make it active and direct.
  reasoning_layer_used: POB audit trail
  rationale: Simplified the phrase 'who has a change of mind' to 'who changes their mind' to make it active and direct.
- preserved_meaning: Rendered the final clause 'who have no need of such a change' to clearly link back to 'change of mind' without using the awkward literal POB phrasing 'no need of one'.
  reasoning_layer_used: POB audit trail
  rationale: Rendered the final clause 'who have no need of such a change' to clearly link back to 'change of mind' without using the awkward literal POB phrasing 'no need of one'.
retained_terms:
- term: righteous people (to preserve the potential irony of the Greek 'δίκαιος' without resolution)
  reason: Retained to preserve POB's source-grounded terminology.
- term: change of mind (to respect the POB's lexical preference for rendering 'μετανοοῦντι' and 'μετανοίας')
  reason: Retained to preserve POB's source-grounded terminology.
- term: in heaven (retaining the location of joy without specifying the agents, in line with POB's theological decisions)
  reason: Retained to preserve POB's source-grounded terminology.
translation_notes:
  source_alignment_notes: The comparative syntax (implied in Greek by using 'ἤ' with a positive noun) is smoothed out for modern readers. The connection between 'changes their mind' and 'no need of such a change' preserves the lexical repetition in the Greek text (μετανοοῦντι / μετανοίας).
  readability_notes:
  - By adding the word 'more' and shifting 'has a change of mind' to 'changes their mind,' we resolve the grammatical awkwardness of the literal POB rendering while keeping the exact semantic value and theological integrity of the passage.
  compression_notes:
  - No semantic information was removed. Clarifications were made only to improve syntactic flow and resolve grammatical tensions inherent in a wooden translation of the comparative Greek construct.
  risk_flags:
  - risk: None identified. The translation carefully avoids simplifying 'righteous' into a modern equivalent that would erase the contextual irony, and avoids standardizing 'change of mind' into 'repent' which was explicitly rejected in the POB audit trail.
    mitigation: Flag retained for reviewer attention.
