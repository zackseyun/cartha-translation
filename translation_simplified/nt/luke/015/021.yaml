translation:
  language: en
  text: But the son said to him, “Father, I have sinned against heaven[a] and in your sight. I do not deserve to be called your son anymore.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Against heaven” is a reverent way of saying “against God.”
    reason: lexical_alternative
  - marker: b
    text: Some manuscripts add, “Treat me as one of your hired servants.”
    reason: textual_variant
simplification_decisions:
- pob_phrase: and before you
  simplified_phrase: and in your sight
  preserved_meaning: The son confesses that his sin was committed in his father’s presence and personally concerns him.
  reasoning_layer_used: POB lexical decision for ἐνώπιόν σου
  rationale: “In your sight” makes the relational image clearer without reducing it to only “against you.”
- pob_phrase: I am no longer worthy
  simplified_phrase: I do not deserve ... anymore
  preserved_meaning: The son believes his guilt has made him unfit to bear his family status.
  reasoning_layer_used: POB lexical decisions for οὐκέτι and ἄξιος
  rationale: “Do not deserve” is common English for the moral sense of “not worthy.”
- pob_phrase: against heaven
  simplified_phrase: against heaven[a]
  preserved_meaning: The confession uses “heaven” as a reverent reference to God.
  reasoning_layer_used: POB theological decision on the meaning of heaven
  rationale: The source-language image remains in the text while a brief note explains the idiom.
translation_notes:
  risk_flags:
  - risk: Modern readers may initially take “heaven” as a place rather than a reverent reference to God.
    mitigation: Footnote a explains the idiom without replacing the source image.
  - risk: The shorter speech may surprise readers familiar with the wording from verse 19.
    mitigation: Footnote b records the longer manuscript reading without adding it to the main text.
