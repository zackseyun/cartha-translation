translation:
  language: en
  text: So he got up and went to his father. But while he was still far away[a], his father saw him and was moved with compassion. He ran to him, embraced him, and kissed him warmly[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “while he was still a long way off.”
    reason: simplification_note
  - marker: b
    text: The Greek verb can suggest an especially warm or repeated kiss.
    reason: simplification_note
simplification_decisions:
- pob_phrase: And he arose and came to his father
  simplified_phrase: So he got up and went to his father
  preserved_meaning: Keeps the decisive action while using natural story English.
  reasoning_layer_used: POB lexical decisions
  rationale: “Got up and went” is clearer than the more formal “arose and came.”
- pob_phrase: fell on his neck and kissed him fervently
  simplified_phrase: embraced him, and kissed him warmly
  preserved_meaning: Preserves the father’s physical affection and emotional intensity in language modern readers immediately understand.
  reasoning_layer_used: POB lexical decisions for the idiom and intensive verb
  rationale: The literal idiom “fell on his neck” can confuse common readers; “embraced him” expresses the action.
retained_terms:
- term: father
  reason: Central relational term in the parable.
- term: compassion
  reason: Retains the deep inward response of the Greek verb.
translation_notes:
  source_alignment_notes: 'Keeps the narrative sequence: son rises, returns, father sees him at a distance, feels compassion, runs, embraces, kisses.'
  readability_notes:
  - Splits the long POB sentence into three shorter sentences.
  - 'Replaces a literal idiom with its intended action: “embraced him.”'
  compression_notes:
  - No event is removed; participial sequence is recast as simple narrative actions.
  risk_flags:
  - risk: “Embraced him” is less literal than “fell on his neck.”
    mitigation: It preserves the idiom’s action for modern readers while the source alignment note records the underlying sequence.
