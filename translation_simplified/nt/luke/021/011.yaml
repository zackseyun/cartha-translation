translation:
  language: en
  text: There will be severe earthquakes. Famines and plagues will strike in different places. There will also be terrifying events and great signs from heaven.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “from the sky.” The Greek word can mean either heaven or the sky and may refer to visible events in the sky.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: great earthquakes
  simplified_phrase: severe earthquakes
  preserved_meaning: The earthquakes will be great in magnitude or severity.
  reasoning_layer_used: Lexical decision for μεγάλοι
  rationale: “Severe” makes the scale of the earthquakes immediately clear without weakening their force.
- pob_phrase: in various places famines and plagues
  simplified_phrase: Famines and plagues will strike in different places
  preserved_meaning: Famine and epidemic disease will occur across distinct locations.
  reasoning_layer_used: Lexical decisions for κατὰ τόπους, λιμοί, and λοιμοί
  rationale: A separate active sentence presents the geographic spread in natural English.
- pob_phrase: terrors
  simplified_phrase: terrifying events
  preserved_meaning: Occurrences will inspire intense fear.
  reasoning_layer_used: Lexical decision for φόβητρα
  rationale: “Terrifying events” clearly expresses what the rare noun describes.
translation_notes:
  risk_flags:
