translation:
  language: en
  text: How terrible it will be in those days for those who are pregnant and for those nursing babies! Great distress will come upon the land[a], and wrath will come against this people[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the earth.” The surrounding context points especially to Jerusalem and Judea.
    reason: lexical_alternative
  - marker: b
    text: Or “wrath for this people” or “wrath upon this people.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Woe to those who are pregnant and to those who are nursing infants in those days!
  simplified_phrase: How terrible it will be in those days for those who are pregnant and for those nursing babies!
  preserved_meaning: The exclamation directly announces grave hardship for both vulnerable groups.
  reasoning_layer_used: Lexical decision for οὐαί and the source’s paired clauses
  rationale: This explains “woe” in modern English while keeping both groups as its targets.
- pob_phrase: those who are nursing infants
  simplified_phrase: those nursing babies
  preserved_meaning: The phrase still refers to those breastfeeding young children.
  reasoning_layer_used: Lexical decision for ταῖς θηλαζούσαις
  rationale: “Nursing babies” is common English and retains the maternal sense.
- pob_phrase: there will be great distress upon the land, and wrath against this people
  simplified_phrase: Great distress will come upon the land, and wrath will come against this people
  preserved_meaning: Severe calamity will affect the land, and this people will be the object of wrath.
  reasoning_layer_used: Lexical and theological decisions for ἀνάγκη, γῆ, ὀργή, and τῷ λαῷ τούτῳ
  rationale: Repeating “will come” makes both clauses natural without naming the source of wrath.
translation_notes:
  risk_flags:
  - risk: Replacing “woe” may make the prophetic exclamation sound less traditional.
    mitigation: “How terrible it will be” preserves its strong lament and keeps the hardship directed toward the named groups.
  - risk: “Land” may sound narrowly local, while readers may assume the wrath is explicitly God's.
    mitigation: The footnote preserves “earth,” and the main text leaves the source of wrath unstated.
