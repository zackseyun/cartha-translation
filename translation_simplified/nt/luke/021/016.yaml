simplification_decisions:
- pob_phrase: you will be handed over even by parents and brothers and relatives and friends
  simplified_phrase: even your parents, brothers, relatives, and friends will hand you over
  preserved_meaning: Even close family and friends will turn Jesus’ followers over to hostile authorities or opponents.
  reasoning_layer_used: Lexical decisions for παραδοθήσεσθε and the ascensive καὶ
  rationale: The active sentence is easier to follow while preserving both the handing-over image and the shock of “even.”
- pob_phrase: and they will put some of you to death
  simplified_phrase: They will put some of you to death.
  preserved_meaning: Some of Jesus’ followers will be deliberately killed.
  reasoning_layer_used: Lexical decisions for θανατώσουσιν and ἐξ ὑμῶν
  rationale: A separate sentence makes the severe outcome direct without narrowing the kind of death.
