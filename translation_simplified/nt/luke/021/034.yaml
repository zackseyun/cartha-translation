translation:
  language: en
  text: But guard yourselves. Do not let your hearts be weighed down by drinking excesses,[a] drunkenness, and the worries of daily life. Otherwise, that day may come upon you suddenly.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek term can include both excessive drinking and its aftereffects.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: watch yourselves
  simplified_phrase: guard yourselves
  preserved_meaning: Jesus commands his hearers to remain vigilant about their own condition.
  reasoning_layer_used: POB lexical decision for Προσέχετε and ἑαυτοῖς
  rationale: “Guard yourselves” makes the warning force immediately clear.
- pob_phrase: lest your hearts be weighed down with dissipation
  simplified_phrase: Do not let your hearts be weighed down by drinking excesses
  preserved_meaning: Excess and the effects of overindulgence can burden the inner life and dull spiritual alertness.
  reasoning_layer_used: POB lexical decisions for μήποτε, βαρηθῶσιν, καρδίαι, and κραιπάλῃ
  rationale: The rewrite replaces “lest” and “dissipation” while preserving the heavy-heart image.
- pob_phrase: and that day come upon you suddenly
  simplified_phrase: Otherwise, that day may come upon you suddenly
  preserved_meaning: Failure to remain alert leaves a person exposed to the day's sudden arrival.
  reasoning_layer_used: POB lexical and theological decisions for ἐπιστῇ, αἰφνίδιος, and ἡ ἡμέρα ἐκείνη
  rationale: A separate sentence clarifies the consequence without defining what “that day” means.
translation_notes:
  risk_flags:
