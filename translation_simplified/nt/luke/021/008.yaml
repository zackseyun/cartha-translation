translation:
  language: en
  text: He said, “Be careful not to be led astray. Many will come claiming to speak for me. They will say, ‘I am he,’[a] and, ‘The time is near.’ Do not follow them.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “I am.” The person is falsely claiming to be the expected one, possibly the Messiah.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: See that you are not led astray
  simplified_phrase: Be careful not to be led astray
  preserved_meaning: Jesus commands vigilance against being drawn away from the truth.
  reasoning_layer_used: Lexical decisions for Βλέπετε and μὴ πλανηθῆτε
  rationale: “Be careful” is direct, while “led astray” preserves the image of being made to wander.
- pob_phrase: many will come in my name, saying
  simplified_phrase: Many will come claiming to speak for me. They will say
  preserved_meaning: The deceivers falsely appeal to Jesus’ authority while making their claims.
  reasoning_layer_used: Lexical decisions for ἐπὶ τῷ ὀνόματί μου and λέγοντες, confirmed by immediate context
  rationale: “Claiming to speak for me” clearly conveys asserted authority rather than merely mentioning Jesus’ name.
- pob_phrase: The time has drawn near. Do not go after them.
  simplified_phrase: The time is near. Do not follow them.
  preserved_meaning: They announce that the decisive time is imminent, and Jesus forbids joining them.
  reasoning_layer_used: Lexical decisions for Ὁ καιρὸς ἤγγικεν and μὴ πορευθῆτε ὀπίσω αὐτῶν
  rationale: These common expressions preserve present nearness and the command not to join the deceivers.
interpretive_expansions:
- pob_phrase: will come in my name
  rendering: will come claiming to speak for me
  claim: The impostors present themselves as acting with Jesus’ authority.
  evidence:
