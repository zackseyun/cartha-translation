translation:
  language: en
  text: Then they will see the Son of Man as he comes in a cloud, with power and great glory.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “on a cloud.” The Greek says “in a cloud,” using the singular, while the image echoes Daniel 7 and related passages about the Son of Man coming with the clouds.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And then they will see the Son of Man coming
  simplified_phrase: Then they will see the Son of Man as he comes
  preserved_meaning: They will visibly witness the Son of Man coming.
  reasoning_layer_used: The lexical decisions retain “they will see,” the title “Son of Man,” and the ongoing action of coming.
  rationale: The finite clause is easier to follow than the participial wording.
- pob_phrase: coming in a cloud with power and great glory
  simplified_phrase: as he comes in a cloud, with power and great glory
  preserved_meaning: His coming is accompanied by a cloud, power, and great glory.
  reasoning_layer_used: The lexical and theological decisions require Luke’s singular cloud image and the phrases “power” and “great glory.”
  rationale: The comma clarifies what accompanies his cloud-coming without weakening the image.
translation_notes:
  risk_flags:
  - risk: “As he comes” could sound less like a direct participial description than “coming.”
    mitigation: It still presents the coming as the action they will see.
  - risk: Modern readers may expect the traditional wording “on a cloud” or “with the clouds.”
    mitigation: The main text keeps Luke’s singular “in a cloud,” and the footnote preserves the alternative and Daniel 7 echo.
