  simplified_phrase: do not panic
  preserved_meaning: Jesus commands his hearers not to be overwhelmed by fear.
  reasoning_layer_used: POB lexical decision for μὴ πτοηθῆτε
  rationale: “Do not panic” naturally preserves the command’s strong emotional force.
- pob_phrase: for these things must happen first, but the end is not at once
  simplified_phrase: These things must happen first, but the end will not come right away
  preserved_meaning: The turmoil must precede the end but does not signal its immediate arrival.
  reasoning_layer_used: POB lexical and theological decisions on necessity and eschatological timing
  rationale: Two direct clauses make the sequence and delay easier to understand without imposing an end-times system.
