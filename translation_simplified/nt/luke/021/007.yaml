translation:
  language: en
  text: They asked him, “Teacher, so when will these things happen? What will be the sign that they are about to happen?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “going to happen.” The Greek may not imply that the events are immediately near.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And they asked him, saying
  simplified_phrase: They asked him
  preserved_meaning: They directly addressed Jesus with a question.
  reasoning_layer_used: Lexical decisions for Ἐπηρώτησαν, δὲ, and λέγοντες
  rationale: The quotation already makes “saying” clear, and the mild connective need not begin the sentence.
- pob_phrase: when then will these things be
  simplified_phrase: so when will these things happen
  preserved_meaning: They infer a question about when the predicted events will occur.
  reasoning_layer_used: Lexical decisions for πότε οὖν and ταῦτα ἔσται
  rationale: “So” naturally carries the inference, while “happen” expresses the idiomatic sense of “will be.”
- pob_phrase: what will be the sign when these things are about to happen
  simplified_phrase: What will be the sign that they are about to happen?
  preserved_meaning: They ask what indication will accompany the impending events.
  reasoning_layer_used: Lexical and theological decisions for σημεῖον and μέλλῃ
  rationale: The new clause is easier to follow while retaining both “sign” and the Greek nuance of impending occurrence.
translation_notes:
  risk_flags:
  - risk: “About to” may sound more immediate in English than the context requires.
    mitigation: The footnote preserves the broader lexical alternative without removing the POB’s chosen nuance.
