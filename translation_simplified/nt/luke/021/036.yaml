translation:
  language: en
  text: But stay awake and be alert at all times. Pray that you may have the strength[a] to escape everything that is about to happen and to stand before the Son of Man.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some manuscripts read “be counted worthy” instead of “have the strength.”
    reason: textual_variant
  - marker: b
    text: Standing before the Son of Man may imply being accepted or vindicated by him, but the Greek does not state this directly.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: stay awake at all times
  simplified_phrase: stay awake and be alert at all times
  preserved_meaning: The command calls for continual vigilance while retaining the image of wakefulness.
  reasoning_layer_used: POB lexical decision for ἀγρυπνεῖτε
  rationale: The added plain-language phrase explains the biblical image without replacing it.
- pob_phrase: praying that you may have strength
  simplified_phrase: Pray that you may have the strength
  preserved_meaning: The disciples are to ask God for strength to endure and escape.
  reasoning_layer_used: POB lexical and theological decisions for δεόμενοι and κατισχύσητε
  rationale: A separate sentence turns the participle into a direct, readable instruction while preserving its force.
- pob_phrase: all these things that are about to happen
  simplified_phrase: everything that is about to happen
  preserved_meaning: The prayer concerns the full set of coming events Jesus has described.
  reasoning_layer_used: POB lexical decision for ταῦτα πάντα τὰ μέλλοντα γίνεσθαι
  rationale: “Everything” expresses the same total scope in more natural English.
interpretive_expansions:
