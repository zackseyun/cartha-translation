translation:
  language: en
  text: For all these people gave gifts[a] from what they had left over. But she, though she was in need, put in everything she had to live on.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “offerings”; these were gifts donated at the temple.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: gave into the gifts out of their abundance
  simplified_phrase: gave gifts from what they had left over
  preserved_meaning: They donated from their surplus resources.
  reasoning_layer_used: Lexical decision for περισσεύοντος and the temple context for δῶρα
  rationale: The wording makes the surplus-to-need contrast clear while retaining “gifts.”
- pob_phrase: out of her lack
  simplified_phrase: though she was in need
  preserved_meaning: She gave while lacking adequate resources herself.
  reasoning_layer_used: Lexical decision for ὑστέρημα
  rationale: A direct clause communicates her need more naturally than the abstract phrase “out of her lack.”
- pob_phrase: all the livelihood she had
  simplified_phrase: everything she had to live on
  preserved_meaning: She gave all her material means of subsistence, not her life itself.
  reasoning_layer_used: Lexical and theological decisions for βίος
  rationale: The phrase explains “livelihood” in ordinary English without turning it into existential self-sacrifice.
translation_notes:
  risk_flags:
  - risk: “What they had left over” may sound like only money remaining after expenses.
    mitigation: The wording still expresses the audited contrast between their surplus and her need.
