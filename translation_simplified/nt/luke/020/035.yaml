translation:
  language: en
  text: But those who are considered worthy[a] to share in the coming age and in the resurrection from the dead will not marry or be given in marriage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: That is, those judged worthy; this does not say they earn resurrection life.
    reason: simplification_note
simplification_decisions:
- pob_phrase: to attain that age
  simplified_phrase: to share in the coming age
  preserved_meaning: They receive a place in the future age rather than reaching it by their own merit.
  reasoning_layer_used: Lexical and theological decisions for τυχεῖν and τοῦ αἰῶνος ἐκείνου
  rationale: “Share in” is clearer than “attain,” while “coming age” makes the contrast with the present age understandable.
- pob_phrase: neither marry nor are given in marriage
  simplified_phrase: will not marry or be given in marriage
  preserved_meaning: Both marrying and being given to another in marriage are excluded.
  reasoning_layer_used: Lexical decisions for γαμοῦσιν and γαμίζονται
  rationale: The simpler pairing remains natural while preserving the two distinct Greek expressions.
interpretive_expansions:
- pob_phrase: neither marry nor are given in marriage
  rendering: will not marry or be given in marriage
  claim: The statement describes life in the future age.
  evidence:
  - The phrase “that age” contrasts the coming age with the present one.
  - The immediate clause links this condition with resurrection from the dead.
  confidence: high
  alternatives_preserved:
  - do not marry or are given in marriage
translation_notes:
  risk_flags:
  - risk: “Coming age” is more explicit than the Greek’s literal “that age.”
    mitigation: The POB lexical rationale identifies the intended contrast with the age to come.
  - risk: “Share in” could sound less forceful than “attain.”
    mitigation: It preserves obtaining participation while avoiding an unintended suggestion of earning it.
