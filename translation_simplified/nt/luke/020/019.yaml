  rationale: “Seize” makes the idiom clear without specifying a formal arrest.
- pob_phrase: in that very hour
  simplified_phrase: right then
  preserved_meaning: They wanted to act immediately on that occasion.
  reasoning_layer_used: POB lexical rationale for temporal immediacy
  rationale: “Right then” expresses the same emphasis in ordinary English.
- pob_phrase: for they knew
  simplified_phrase: They knew
  preserved_meaning: Their recognition explains why the parable provoked them.
  reasoning_layer_used: POB lexical decision and immediate narrative context
  rationale: A new sentence makes the explanation easier to follow.
translation_notes:
