translation:
  language: en
  text: The scribes[a] and the chief priests wanted to seize him right then, but they were afraid of the people. They knew he had told this parable against them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Scribes were specialists in the Jewish law and its interpretation.
