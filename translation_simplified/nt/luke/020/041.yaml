  text: But he asked them, “How can people say that the Messiah[a] is David’s son[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the Christ.” “Messiah” emphasizes the expected deliverer from David’s royal line.
