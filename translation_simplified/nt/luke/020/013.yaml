simplification_decisions:
- pob_phrase: the owner of the vineyard
  simplified_phrase: the vineyard owner
  preserved_meaning: He owns the vineyard rather than bearing a divine title within the story.
  reasoning_layer_used: Lexical and theological decisions for κύριος and ἀμπελῶνος.
  rationale: The shorter phrase is natural English and preserves the parable’s story-level meaning.
- pob_phrase: What shall I do?
  simplified_phrase: What should I do?
  preserved_meaning: The owner asks himself what course of action to take.
  reasoning_layer_used: Lexical decision for the deliberative question Τί ποιήσω.
  rationale: “Should” is more common in modern English while retaining deliberation.
- pob_phrase: my beloved son; perhaps they will respect him
  simplified_phrase: my beloved son. Perhaps they will respect him.
  preserved_meaning: The son remains uniquely loved, and the owner hopes without certainty that the tenants will honor him.
  reasoning_layer_used: Lexical and theological decisions for ἀγαπητόν, ἴσως, and ἐντραπήσονται.
  rationale: Two sentences make the hope easier to follow without weakening the beloved-son resonance.
translation_notes:
  risk_flags:
  - risk: Modern readers may miss the broader sense of “respect.”
    mitigation: The footnote preserves the documented lexical alternatives without burdening the main text.
