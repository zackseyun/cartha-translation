translation:
  language: en
  text: Then the vineyard owner said, “What should I do? I will send my beloved son. Perhaps they will respect him.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Respect” can also mean “show deference to” or “be ashamed before.”
