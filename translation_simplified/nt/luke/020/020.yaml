  text: They watched him closely and sent spies who pretended to be righteous. They hoped to trap him by something he said so that they could hand him over to the governor’s authority and power.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And after watching him closely, they sent spies
  simplified_phrase: They watched him closely and sent spies
  preserved_meaning: Their close, hostile watch led to sending covert agents.
  reasoning_layer_used: POB lexical decisions for παρατηρήσαντες and ἐγκαθέτους
  rationale: The direct opening keeps both the surveillance and the spies’ covert role.
- pob_phrase: so that they might catch him in something he said
  simplified_phrase: They hoped to trap him by something he said
  preserved_meaning: They intended to use Jesus’ own speech to entrap him.
  reasoning_layer_used: POB lexical decision for ἵνα ἐπιλάβωνται αὐτοῦ λόγου
  rationale: “Trap him” states the hostile purpose in immediately understandable English.
- pob_phrase: hand him over to the rule and authority of the governor
  simplified_phrase: hand him over to the governor’s authority and power
  preserved_meaning: They wanted to place him under the governor’s official ruling power.
  reasoning_layer_used: POB lexical decisions for ἀρχή, ἐξουσία, and ἡγεμών
  rationale: The plain pair “authority and power” avoids technical language while retaining the emphasis on official control.
