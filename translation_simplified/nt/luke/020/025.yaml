- pob_phrase: the things that are Caesar’s, and to God the things that are God’s
  simplified_phrase: what belongs to Caesar, and give back to God what belongs to God
  preserved_meaning: Each is to receive what properly belongs to them, without limiting the saying to taxes or defining the boundaries of either claim.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: “What belongs to” is clearer than “the things that are,” while repeating the command makes the parallel easy to follow.
