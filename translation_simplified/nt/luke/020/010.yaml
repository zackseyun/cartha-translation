translation:
  language: en
  text: When the proper time came, he sent a slave[a] to the farmers who worked the vineyard to receive some of its produce. But they beat the slave and sent him away empty-handed.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “servant.” The Greek word can mean either, but “slave” better shows his bonded status here.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: at the proper time
  simplified_phrase: When the proper time came
  preserved_meaning: The owner acted at the fitting or appointed time without specifying harvest time.
  reasoning_layer_used: Lexical decision for καιρῷ
  rationale: The clause form is more natural while keeping the POB’s careful sense of timing.
- pob_phrase: the vine-growers
  simplified_phrase: the farmers who worked the vineyard
  preserved_meaning: They are identified as agricultural workers responsible for the vineyard without assuming they were tenants.
  reasoning_layer_used: Lexical decision for γεωργούς
  rationale: This explains the unfamiliar role in ordinary English without adding a legal status.
- pob_phrase: give him some of the fruit of the vineyard ... sent him away empty after beating him
  simplified_phrase: receive some of its produce ... beat the slave and sent him away empty-handed
  preserved_meaning: The slave was to receive a portion of the vineyard’s yield but was beaten and left with nothing.
  reasoning_layer_used: Lexical decisions for ἀπὸ τοῦ καρποῦ, δείραντες, and κενόν
  rationale: “Produce” and “empty-handed” make the agricultural yield and failed collection immediately clear.
translation_notes:
  risk_flags:
  - risk: “Farmers” might be read as implying ownership of the vineyard.
    mitigation: The phrase “who worked the vineyard” describes their role without stating ownership or tenancy.
