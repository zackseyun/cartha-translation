translation:
  language: en
  text: But when the vineyard workers saw him, they talked it over among themselves. “This is the heir,” they said. “Let us kill him so that the inheritance may become ours.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the vine-growers
  simplified_phrase: the vineyard workers
  preserved_meaning: They are agricultural workers specifically tending a vineyard.
  reasoning_layer_used: lexical decision and immediate parable context
  rationale: “Vineyard workers” is clear common English without importing the broader legal idea of tenants.
- pob_phrase: they reasoned with one another, saying
  simplified_phrase: they talked it over among themselves ... they said
  preserved_meaning: They deliberately discussed the matter with each other.
  reasoning_layer_used: lexical decisions for διελογίζοντο and πρὸς ἀλλήλους
  rationale: This expresses mutual deliberation without suggesting that they argued.
- pob_phrase: so that the inheritance may become ours
  simplified_phrase: so that the inheritance may become ours
  preserved_meaning: They intend the killing to result in their gaining the inheritance.
  reasoning_layer_used: lexical decision for the ἵνα purpose clause and γένηται
  rationale: Keeping “so that” and “may become” preserves their intended aim rather than presenting it as a certain prediction.
translation_notes:
  risk_flags:
  - risk: “Talked it over” may sound less calculating than the Greek deliberative verb.
    mitigation: Their explicit plan to kill the heir clearly conveys the sinister calculation.
