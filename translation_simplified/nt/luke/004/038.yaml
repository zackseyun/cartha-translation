translation:
  language: en
  text: Jesus left the synagogue and went into Simon’s house. Simon’s mother-in-law was suffering from a high fever, and they asked Jesus about her.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may mean that they appealed to Jesus to help her.
    reason: lexical_alternative
