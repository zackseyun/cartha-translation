translation:
  language: en
  text: The Spirit of the Lord is on me. He has anointed me to announce good news to the poor. He has sent me to announce freedom for captives[a] and recovery of sight for blind people, and to set oppressed people[b] free.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word can also mean “forgiveness,” but here the language about captives and oppressed people favors freedom.
    reason: lexical_alternative
  - marker: b
    text: Literally, “those who have been broken.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: The Spirit of the Lord is upon me
  simplified_phrase: The Spirit of the Lord is on me
  preserved_meaning: The Lord’s Spirit is upon Jesus for his mission.
  reasoning_layer_used: POB lexical decision for ἐπ’ ἐμέ
  rationale: “On me” keeps the image in more natural English.
- pob_phrase: proclaim release to the captives and recovery of sight to the blind
  simplified_phrase: announce freedom for captives and recovery of sight for blind people
  preserved_meaning: Jesus publicly announces both liberation for captives and restored sight for the blind.
  reasoning_layer_used: POB lexical and theological decisions for κηρύξαι, ἄφεσις, and ἀνάβλεψις
  rationale: The shared verb “announce” preserves one proclamation governing both promises.
- pob_phrase: to send out the oppressed in release
  simplified_phrase: to set oppressed people free
  preserved_meaning: Jesus is commissioned to liberate people broken by oppression.
  reasoning_layer_used: POB lexical and theological decisions for τεθραυσμένους and ἐν ἀφέσει
  rationale: “Set free” clearly expresses the controlling liberation sense.
translation_notes:
  risk_flags:
  - risk: “Set oppressed people free” does not retain the literal verb “send out.”
    mitigation: It preserves the contextual liberation sense, while footnote b retains the brokenness image.
  - risk: “Freedom” may obscure the possible sense “forgiveness.”
    mitigation: Footnote a preserves the documented ambiguity without overriding the immediate context.
