simplification_decisions:
- pob_phrase: coming out of many
  simplified_phrase: coming out of many people
  preserved_meaning: The demons were leaving many human beings.
  reasoning_layer_used: Lexical decision for ἀπὸ πολλῶν and immediate context
  rationale: Naming the implied people prevents an awkward or unclear English phrase.
- pob_phrase: crying out and saying
  simplified_phrase: shouting
  preserved_meaning: The demons loudly spoke the quoted words.
  reasoning_layer_used: Lexical decisions for κραυγάζοντα and λέγοντα
  rationale: The direct quotation already conveys speaking, so “shouting” preserves both ideas naturally.
- pob_phrase: But rebuking them, he would not allow them to speak
  simplified_phrase: But Jesus rebuked them and would not let them speak
  preserved_meaning: Jesus repeatedly refused to permit the demons to speak.
  reasoning_layer_used: Lexical decisions for ἐπιτιμῶν and οὐκ εἴα
  rationale: A direct clause removes the awkward participle while retaining Jesus’ sharp command and ongoing refusal.
