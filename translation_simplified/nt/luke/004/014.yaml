translation:
  language: en
  text: Jesus returned to Galilee with the Spirit’s power. News[a] about him spread throughout the whole surrounding region.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word can also mean “report,” “fame,” or “rumor”; it does not say whether the news was positive or negative.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: in the power of the Spirit
  simplified_phrase: with the Spirit’s power
  preserved_meaning: Jesus returned empowered by the Spirit, who is the Holy Spirit in this context.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The possessive form is easier to read without adding “Holy” to the verse.
- pob_phrase: a report about him went out through all the surrounding region
  simplified_phrase: News about him spread throughout the whole surrounding region
  preserved_meaning: A widely circulating report about Jesus reached the entire surrounding area.
  reasoning_layer_used: POB lexical decisions
  rationale: “Spread” makes the motion image natural in modern English while retaining its wide reach.
translation_notes:
  risk_flags:
  - risk: “News” may sound more positive or certain than the Greek requires.
    mitigation: The footnote preserves the term’s neutral range, including “report” and “rumor.”
