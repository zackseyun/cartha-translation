simplification_decisions:
- pob_phrase: But I tell you truly
  simplified_phrase: But I tell you the truth
  preserved_meaning: Jesus introduces the statement as true and certain while retaining the contrast marked by “But.”
  reasoning_layer_used: POB lexical decision for λέγω δὲ ὑμῖν ἀληθῶς
  rationale: The noun phrase is more natural in common English than the adverb “truly.”
- pob_phrase: there are some standing here
  simplified_phrase: some people here
  preserved_meaning: Jesus refers indefinitely to some of the people present with him.
  reasoning_layer_used: POB lexical decision for εἰσίν τινες τῶν αὐτοῦ ἑστηκότων
  rationale: This removes the formal existential construction and unnecessary posture detail while keeping the deictic force.
- pob_phrase: will certainly not taste death until they see
  simplified_phrase: certainly will not die before they see
  preserved_meaning: The emphatic promise says that some present will remain alive long enough to see the kingdom of God.
  reasoning_layer_used: POB lexical decisions for οὐ μὴ γεύσωνται θανάτου and ἕως ἂν ἴδωσιν
  rationale: The main text explains the idiom directly, while the footnote preserves its source-language image.
