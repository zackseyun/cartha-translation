translation:
  language: en
  text: Then John replied, “Master, we saw someone driving out demons in your name. We tried to stop him because he does not follow along with us.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “because he does not follow us.” The Greek says “with us,” suggesting that he was not part of the disciples’ group.
    reason: alternative_reading
