translation:
  language: en
  text: 'He told them, “Take nothing for the journey: no walking stick, travel bag, bread, or money. Do not take an extra tunic.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tunic was a basic garment worn next to the body.
