simplification_decisions:
- pob_phrase: And he said to them
  simplified_phrase: He told them
  preserved_meaning: Jesus directly gave these instructions to the disciples.
  reasoning_layer_used: POB translation and immediate context
  rationale: The shorter wording expresses the same speech action naturally.
- pob_phrase: neither a staff, nor a bag
  simplified_phrase: no walking stick, travel bag
  preserved_meaning: They were not to carry ordinary travel equipment or a provisions bag.
  reasoning_layer_used: POB lexical decisions for ῥάβδον and πήραν
  rationale: The permitted lexical alternatives make both historical travel items immediately clear.
- pob_phrase: do not have two tunics each
  simplified_phrase: Do not take an extra tunic
  preserved_meaning: Each disciple was forbidden to bring a second tunic.
  reasoning_layer_used: POB lexical decision for ἀνὰ δύο χιτῶνας ἔχειν
  rationale: “Extra” conveys the distributive sense without the awkward phrase “two each.”
translation_notes:
  risk_flags:
  - risk: “Take an extra tunic” recasts the Greek verb “have” in light of the journey command.
    mitigation: The travel context and POB’s listed alternative “do not take two tunics apiece” support this wording.
