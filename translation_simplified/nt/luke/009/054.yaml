translation:
  language: en
  text: When James and John, two of the disciples, saw that the Samaritan village had refused to welcome Jesus, they asked, “Lord, do you want us to tell fire to come down from heaven and consume them?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “call down fire from heaven and destroy them.” The Greek literally says to “say” for the fire to come down and consume them.
    reason: lexical_alternative
