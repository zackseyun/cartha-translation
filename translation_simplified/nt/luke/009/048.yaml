translation:
  language: en
  text: And he said to them, “Anyone who welcomes this child in my name[a] welcomes me. Anyone who welcomes me also welcomes the one who sent me. For the person who is least important among all of you—that person is great.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “In my name” means in connection with Jesus’ name and authority, not merely as an act of kindness.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Whoever receives this child ... receives me
  simplified_phrase: Anyone who welcomes this child ... welcomes me
  preserved_meaning: The repeated verb still links receiving the child with receiving Jesus and includes personal acceptance and hospitality.
  reasoning_layer_used: POB lexical decision for δέχομαι and footnote a
  rationale: “Welcomes” communicates the relational action more naturally in modern English.
- pob_phrase: whoever receives me receives the one who sent me
  simplified_phrase: Anyone who welcomes me also welcomes the one who sent me
  preserved_meaning: Welcoming Jesus remains inseparable from welcoming his unnamed sender.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: A separate sentence makes the repeated relationship easier to follow without naming the sender more explicitly.
- pob_phrase: the one who is least among all of you—this one is great
  simplified_phrase: the person who is least important among all of you—that person is great
  preserved_meaning: Jesus defines greatness through low social standing rather than age or physical size.
  reasoning_layer_used: POB lexical decision for μικρότερος and paradox-of-greatness decision
  rationale: “Least important” makes the intended social-status contrast immediately clear.
interpretive_expansions:
- pob_phrase: least among all of you
  rendering: least important among all of you
  claim: “Least” concerns perceived rank or importance within the group.
  evidence:
  - The POB lexical rationale identifies humble social status rather than physical size or age.
  - The POB theological decision defines greatness through lowliness within the community.
  confidence: high
  alternatives_preserved:
  - least among all of you
translation_notes:
  risk_flags:
  - risk: “Welcomes” may sound narrower than the Greek verb’s combined senses of receiving, accepting, and showing hospitality.
    mitigation: The repeated wording preserves the representative link, and the rendering follows the POB’s documented lexical alternative.
  - risk: “Least important” could be heard as endorsing the group’s judgment of a person’s worth.
    mitigation: The paradoxical ending reverses that judgment by declaring that person great.
