translation:
  language: en
  text: While he was still speaking, a cloud appeared and began to cover them with its shadow. They were afraid as they entered the cloud.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: While he was saying these things
  simplified_phrase: While he was still speaking
  preserved_meaning: His speech was still in progress when the cloud appeared.
  reasoning_layer_used: The lexical decision treats the present participle as ongoing and contemporaneous action.
  rationale: This removes a bulky phrase while keeping the timing clear.
- pob_phrase: began to overshadow them
  simplified_phrase: began to cover them with its shadow
  preserved_meaning: The cloud's shadow began to extend over them.
  reasoning_layer_used: The lexical and theological decisions require the developing action and cloud-shadow image to remain.
  rationale: The concrete wording makes “overshadow” immediately understandable without explaining the cloud's nature.
- pob_phrase: as they entered into the cloud
  simplified_phrase: as they entered the cloud
  preserved_meaning: They moved into the cloud itself.
  reasoning_layer_used: The lexical decision requires movement into, not merely beneath, the cloud.
  rationale: Ordinary English does not need “into” after “entered.”
translation_notes:
  risk_flags:
  - risk: Replacing “overshadow” may lessen its biblical intertextual resonance.
    mitigation: The rendering preserves the cloud's shadow image and does not identify it doctrinally.
