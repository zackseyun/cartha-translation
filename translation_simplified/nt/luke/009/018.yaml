simplification_decisions:
- pob_phrase: And it happened that while he was praying alone
  simplified_phrase: While he was praying alone
  preserved_meaning: The prayer was already taking place when the following action occurred.
  reasoning_layer_used: The lexical decision identifies “it happened” as a Lukan narrative formula and the temporal construction as contemporaneous.
  rationale: Beginning with “While” carries the timing naturally without the heavy narrative formula.
- pob_phrase: the disciples were with him
  simplified_phrase: his disciples were with him
  preserved_meaning: The disciples were present with Jesus even though his prayer is described as solitary.
  reasoning_layer_used: The lexical and theological decisions require both clauses to remain without harmonizing them.
  rationale: “His disciples” is clearer in English while preserving the stated narrative tension.
- pob_phrase: he asked them, saying
  simplified_phrase: He asked them
  preserved_meaning: Jesus directly introduced a question to the disciples.
  reasoning_layer_used: The lexical decision recognizes “saying” as a participial speech introducer.
  rationale: English does not need both “asked” and “saying” before a direct question.
translation_notes:
  risk_flags:
  - risk: “Alone” may seem to conflict with the disciples being present.
    mitigation: The main text preserves both statements, and the footnote retains “in private” as the documented alternative.
