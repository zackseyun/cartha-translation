translation:
  language: en
  text: If people refuse to receive you, shake the dust from your feet as you leave that town. This will serve as testimony against them.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: all who do not receive you
  simplified_phrase: If people refuse to receive you
  preserved_meaning: The wording covers any people who reject or refuse to accept the messengers.
  reasoning_layer_used: Lexical decision for ὅσοι ἂν μὴ δέχωνται
  rationale: “People” retains the general scope, while “receive” remains broader than hospitality alone.
- pob_phrase: as you leave that town, shake off the dust from your feet
  simplified_phrase: shake the dust from your feet as you leave that town
  preserved_meaning: The disciples must perform the same forceful symbolic action while departing.
  reasoning_layer_used: Lexical decisions for ἐξερχόμενοι and ἀποτινάσσετε
  rationale: Reordering the clauses gives the command a direct, natural English structure.
- pob_phrase: as a testimony against them
  simplified_phrase: This will serve as testimony against them
  preserved_meaning: The action remains a solemn witness against those who reject the messengers without declaring final condemnation.
  reasoning_layer_used: Theological decision on the symbolic dust-shaking act
  rationale: A separate sentence clearly identifies the action as the testimony and preserves its judicial force.
