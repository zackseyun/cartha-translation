  preserved_meaning: The Son of Man comes in glory associated with himself, the Father, and the holy angels.
  reasoning_layer_used: Lexical and theological decisions on the coordinated glory phrase
  rationale: The repeated noun and possessive form make the threefold coordination easier to follow.
