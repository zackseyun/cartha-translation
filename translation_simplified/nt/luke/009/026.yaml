- pob_phrase: For whoever is ashamed of me and of my words
  simplified_phrase: For anyone who is ashamed of me and my words
  preserved_meaning: The warning applies generally to every person who feels shame toward Jesus and his words.
  reasoning_layer_used: Lexical decisions for ὃς γὰρ ἂν and ἐπαισχυνθῇ
  rationale: “Anyone who” is more conversational while preserving the general force of “whoever.”
