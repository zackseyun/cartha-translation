- pob_phrase: Leave the dead to bury their own dead, but you, go and proclaim
  simplified_phrase: Leave the dead to bury their own dead. But as for you, go and proclaim
  preserved_meaning: The disciple must leave burial duties to others and personally go proclaim God’s kingdom.
  reasoning_layer_used: POB lexical decisions and applied revision
  rationale: Two sentences and “as for you” make the contrast clear while preserving both commands.
- pob_phrase: the dead ... their own dead
  simplified_phrase: the dead ... their own dead
  preserved_meaning: The wording retains the paradox between likely spiritual and physical senses of “dead.”
  reasoning_layer_used: POB theological decision and footnote
  rationale: Repeating “dead” avoids resolving an ambiguity that the Greek leaves implicit.
