translation:
  language: en
  text: But he said to him,[a] “Leave the dead to bury their own dead. But as for you, go and proclaim the kingdom of God.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The first “dead” likely means people who are spiritually unresponsive, while the second means those who have physically died. The same word is used both times to preserve Jesus’ striking saying.
    reason: alternative_reading
