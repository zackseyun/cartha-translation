translation:
  language: en
  text: After all, what good would it do a man to gain the whole world but lose or forfeit himself?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “his life” or “his soul.” The Greek says “himself.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: For what does a man profit
  simplified_phrase: After all, what good would it do a man
  preserved_meaning: The question asks what benefit the man would receive and connects this reason to the preceding saying.
  reasoning_layer_used: Lexical decisions for γὰρ, τί, and ὠφελεῖται
  rationale: The common expression “what good would it do” makes the rhetorical question immediately clear.
- pob_phrase: if he gains the whole world, but loses or forfeits himself
  simplified_phrase: to gain the whole world but lose or forfeit himself
  preserved_meaning: The man’s total worldly gain is contrasted with the loss of his very self.
  reasoning_layer_used: Lexical and theological decisions for κόσμος, ἑαυτόν, ἀπολέσας, and ζημιωθείς
  rationale: The infinitive structure is smoother English while preserving both kinds of loss and the whole-world contrast.
translation_notes:
  risk_flags:
  - risk: “A man” may be read as applying only to males.
    mitigation: It is retained because the POB treats the singular man as a generic representative of any person.
  - risk: “Himself” may be less immediately specific than “his soul” or “his life.”
    mitigation: The footnote gives those alternatives while preserving the Greek reflexive pronoun’s broader force.
