  preserved_meaning: The report concerned an unspecified prophet from former times.
  reasoning_layer_used: Lexical decisions for προφήτης τις and τῶν ἀρχαίων
  rationale: “From long ago” expresses the time reference without the opaque phrase “of the ancients.”
- pob_phrase: had risen
