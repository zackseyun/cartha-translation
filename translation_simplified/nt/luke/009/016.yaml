translation:
  language: en
  text: Then he took the five loaves and two fish. He looked up to heaven, blessed them[a], and broke them. He kept giving the food to the disciples so they could place it before the crowd.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “gave thanks for them.” The Greek verb means “blessed,” while some parallel accounts say “gave thanks.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: taking the five loaves and the two fish, and looking up to heaven
  simplified_phrase: he took the five loaves and two fish. He looked up to heaven
  preserved_meaning: He took the food before looking toward heaven.
  reasoning_layer_used: POB lexical decisions for λαβὼν and ἀναβλέψας
  rationale: Two direct sentences preserve the sequence while removing the dense participial structure.
- pob_phrase: he blessed them and broke them and kept giving them
  simplified_phrase: blessed them, and broke them. He kept giving the food
  preserved_meaning: He blessed and broke the loaves and fish, then repeatedly gave the food out.
  reasoning_layer_used: POB lexical and theological decisions for εὐλόγησεν, κατέκλασεν, and ἐδίδου
  rationale: The rewrite keeps “blessed” and the repeated action while making the object clear.
- pob_phrase: to the disciples to set before the crowd
  simplified_phrase: to the disciples so they could place it before the crowd
  preserved_meaning: Jesus gave the food to the disciples for them to put before the crowd.
  reasoning_layer_used: POB lexical decision for παραθεῖναι
  rationale: The purpose relationship is stated in ordinary modern English without reducing the action to “serve.”
