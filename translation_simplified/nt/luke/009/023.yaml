translation:
  language: en
  text: 'He was speaking to everyone: “Anyone who wants to come after me must deny himself, take up his cross each day, and follow me.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek uses masculine singular forms after “anyone.” It refers to every person who wants to come after Jesus.
    reason: simplification_note
simplification_decisions:
- pob_phrase: And he was saying to all
  simplified_phrase: He was speaking to everyone
  preserved_meaning: He addressed the whole group in an ongoing act of speaking.
  reasoning_layer_used: Lexical decisions for Ἔλεγεν and πρὸς πάντας
  rationale: This removes awkward wording while preserving the ongoing aspect and collective scope.
- pob_phrase: If anyone wants to come after me, let him deny himself
  simplified_phrase: Anyone who wants to come after me must deny himself
  preserved_meaning: Every would-be disciple receives a command to deny himself.
  reasoning_layer_used: Lexical and theological decisions for the generic singular and imperatives
  rationale: The direct construction is clearer while retaining the source’s singular form and command force.
- pob_phrase: take up his cross daily, and follow me
  simplified_phrase: take up his cross each day, and follow me
  preserved_meaning: The concrete cross image and continual practice of discipleship remain distinct.
  reasoning_layer_used: Lexical decisions for σταυρός and καθ’ ἡμέραν; theological decision on cross language
  rationale: “Each day” is plain English, while “cross” remains unflattened and all three commands share one subject.
translation_notes:
  risk_flags:
  - risk: “Must” is more direct than POB’s “let him.”
    mitigation: The Greek imperatives warrant explicit command force.
  - risk: The masculine singular could be mistaken as applying only to men.
    mitigation: The footnote plainly explains that it refers to every person.
