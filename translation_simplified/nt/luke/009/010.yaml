translation:
  language: en
  text: When the apostles returned, they told Jesus what they had done. Then Jesus took them with him and withdrew from the crowds to the town of Bethsaida.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: they reported to him
  simplified_phrase: they told Jesus
  preserved_meaning: The apostles gave Jesus an account of their mission.
  reasoning_layer_used: Lexical decision for διηγήσαντο and the identified referent of αὐτῷ
  rationale: “Told Jesus” is clearer and less formal while preserving the act of reporting.
- pob_phrase: And taking them with him, he withdrew privately
  simplified_phrase: Then Jesus took them with him and withdrew from the crowds
  preserved_meaning: Jesus went apart from public activity without leaving the apostles behind.
  reasoning_layer_used: Theological decision and footnote on κατ’ ἰδίαν
  rationale: The rewrite removes an awkward participle and makes clear that Jesus was not alone.
- pob_phrase: to a town called Bethsaida
  simplified_phrase: to the town of Bethsaida
  preserved_meaning: Their destination was the inhabited place named Bethsaida.
  reasoning_layer_used: Lexical decisions for πόλις and Βηθσαϊδά
  rationale: “The town of Bethsaida” is ordinary English and keeps the chosen place designation.
interpretive_expansions:
- pob_phrase: withdrew privately
  rendering: withdrew from the crowds
  claim: The withdrawal was away from the public rather than into complete solitude.
  evidence:
  - The POB footnote says the phrase indicates withdrawal from the crowds.
  - Jesus explicitly took the apostles with him.
  - The theological decision rejects an implication of absolute solitude.
  confidence: high
  alternatives_preserved:
  - privately
  - apart
translation_notes:
