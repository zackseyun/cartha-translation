simplification_decisions:
- pob_phrase: And behold, a man from the crowd cried out, saying
  simplified_phrase: Just then, a man from the crowd cried out
  preserved_meaning: The narrative directs attention to a man among the crowd who urgently calls out.
  reasoning_layer_used: Lexical decisions for ἰδοὺ, ἀπὸ τοῦ ὄχλου, and ἐβόησεν
  rationale: “Just then” naturally marks the attention shift, and “cried out” retains the urgency.
- pob_phrase: to look upon my son
  simplified_phrase: please give my son your attention
  preserved_meaning: The father asks for attentive concern, not merely a visual glance.
  reasoning_layer_used: Lexical decision for ἐπιβλέψαι ἐπὶ
  rationale: This states the intended attentive regard in ordinary English.
- pob_phrase: because he is my only child
  simplified_phrase: because he is my only child
  preserved_meaning: The boy is the man’s sole child, and this fact is given as the reason for his plea.
  reasoning_layer_used: Source conjunction ὅτι and lexical decisions for μονογενής and μοί ἐστιν
  rationale: Keeping “because” preserves the explicit causal link.
