simplification_decisions:
- pob_phrase: saying
  simplified_phrase: He said
  preserved_meaning: Jesus introduces the statement that follows.
  reasoning_layer_used: POB lexical decision for εἰπὼν
  rationale: A finite clause is clearer in English while preserving the link to the preceding narrative.
- pob_phrase: It is necessary for the Son of Man
  simplified_phrase: The Son of Man must
  preserved_meaning: The events are necessary within God’s redemptive plan.
  reasoning_layer_used: POB lexical and theological decisions for Δεῖ
  rationale: “Must” expresses the same necessity in direct, natural English without naming an unstated agent.
- pob_phrase: to suffer many things and to be rejected ... and to be killed ... and ... to be raised
  simplified_phrase: suffer many things. He must be rejected ... be killed ... and ... be raised
  preserved_meaning: The distinct sufferings, death, and resurrection remain parts of what the Son of Man must undergo.
  reasoning_layer_used: POB syntax and lexical decisions for the coordinated infinitives
  rationale: Two sentences make the long statement easier to follow while retaining “many things” and each distinct event.
translation_notes:
  risk_flags:
  - risk: Changing the impersonal “It is necessary” to “must” may make divine necessity less explicit.
    mitigation: The force of necessity remains clear without adding an agent not stated in the verse.
  - risk: Readers may not recognize the implied divine action in “be raised.”
    mitigation: The passive wording is retained to preserve the Greek form and theological nuance.
