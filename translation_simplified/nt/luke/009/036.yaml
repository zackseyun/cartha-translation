simplification_decisions:
- pob_phrase: And when the voice had come
  simplified_phrase: When the voice had spoken
  preserved_meaning: The heavenly voice sounded before Jesus was found alone.
  reasoning_layer_used: Lexical decision for ἐν τῷ γενέσθαι and contextual identification of φωνή as a heavenly utterance.
  rationale: This replaces an unnatural English expression with a clear description of the voice’s action.
- pob_phrase: And they kept silent and told no one in those days anything of what they had seen
  simplified_phrase: They kept silent and, during those days, told no one what they had seen
  preserved_meaning: They did not report the vision to anyone at that time.
  reasoning_layer_used: Lexical decisions for ἐσίγησαν, οὐδενὶ ἀπήγγειλαν, and οὐδὲν ὧν ἑώρακαν.
  rationale: The shorter clause removes redundant negative phrasing while preserving both their silence and their failure to report the vision.
