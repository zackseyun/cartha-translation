translation:
  language: en
  text: When the voice had spoken, Jesus was found alone.[a] They kept silent and, during those days, told no one what they had seen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Only Jesus remained” or “Only Jesus was seen.” The Greek literally says, “Jesus was found alone.”
