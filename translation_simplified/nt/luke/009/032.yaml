translation:
  language: en
  text: Sleep weighed heavily on Peter and the others with him. But when they became fully awake,[a] they saw his glory and the two men standing with him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “after waking up.” The rare Greek verb may mean that they became fully alert, not that they had stayed awake the whole time.
