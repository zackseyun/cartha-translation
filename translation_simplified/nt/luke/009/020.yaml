- pob_phrase: And he said to them, “But who do you say that I am?”
  simplified_phrase: “And what about you?” he asked. “Who do you say I am?”
  preserved_meaning: Jesus contrasts the disciples’ answer with what others have said and asks for their own judgment.
  reasoning_layer_used: The lexical decisions identify “you” as emphatic and “but” as marking contrast.
