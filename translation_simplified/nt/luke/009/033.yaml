  text: As Moses and Elijah were leaving Jesus, Peter said to him, “Master, it is good that we are here. Let us make three shelters[a]—one for you, one for Moses, and one for Elijah.” Peter did not know what he was saying.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “booths,” “tents,” or traditionally “tabernacles”; these temporary shelters may echo a biblical festival.
    reason: lexical_alternative
