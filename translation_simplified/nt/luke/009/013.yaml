translation:
  language: en
  text: But he told them, “You give them something to eat.” They answered, “The only food we have is five loaves of bread and two fish—unless we go and buy food for all these people.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: But he said to them
  simplified_phrase: But he told them
  preserved_meaning: He directly addressed them with a command.
  reasoning_layer_used: The theological decision preserves the exchange as a straightforward command without added rebuke.
  rationale: “Told them” naturally introduces a direct instruction in common English.
- pob_phrase: We have no more than five loaves and two fish
  simplified_phrase: The only food we have is five loaves of bread and two fish
  preserved_meaning: Their available food is limited to five individual loaves and two fish.
  reasoning_layer_used: The lexical decisions identify πλεῖον ἢ as limitation and ἄρτοι as individual bread loaves.
  rationale: The recast sentence states the practical shortage clearly, while “bread” explains what the loaves are.
translation_notes:
  risk_flags:
  - risk: The fronted “You” may sound more pointed than intended.
    mitigation: The wording retains the Greek emphasis but adds no rebuke or emotional coloring.
  - risk: “Unless” can be heard either as a proposal or as a practical protest.
    mitigation: The source-supported ambiguity is retained rather than resolved.
