translation:
  language: en
  text: Day after day, while I was with you in the temple, you did not arrest me.[a] But this is your hour, and darkness has authority.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek says, “stretch out your hands against me,” an expression for taking hostile action such as arresting someone.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: you did not lay hands on me
  simplified_phrase: you did not arrest me
  preserved_meaning: They had not taken hostile action to seize Jesus while he was publicly present.
  reasoning_layer_used: POB lexical decision and immediate arrest context
  rationale: The direct wording prevents readers from mistaking the phrase for merely touching Jesus.
- pob_phrase: this is your hour
  simplified_phrase: this is your hour
  preserved_meaning: Their solemn, appointed moment had now arrived.
  reasoning_layer_used: POB lexical rationale for ὥρα
  rationale: Keeping the compact image preserves its gravity without reducing it to clock-time.
- pob_phrase: the authority of darkness
  simplified_phrase: darkness has authority
  preserved_meaning: Darkness has operative authority at this moment without being explicitly identified as Satan.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The simple clause preserves the distinct assertion, the authority concept, and the darkness metaphor.
interpretive_expansions:
- pob_phrase: you did not lay hands on me
  rendering: you did not arrest me
  claim: The hostile action in this setting is taking Jesus into custody.
  evidence:
  - The POB lexical rationale identifies arrest as the immediate context.
  - The surrounding scene depicts Jesus being seized.
  confidence: high
  alternatives_preserved:
  - taking hostile action
  - seizing me
translation_notes:
  risk_flags:
  - risk: “Darkness has authority” turns the compact Greek noun phrase into a clause.
    mitigation: It keeps the opponents’ hour and darkness’s authority as coordinated, distinct assertions without naming Satan.
