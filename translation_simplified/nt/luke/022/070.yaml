translation:
  language: en
  text: Then the whole group asked, “So are you the Son of God?” He answered, “You say that I am.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This answer is affirmative and may also be translated, “You say so” or “It is as you say.” More literally, Jesus says, “You yourselves say that I am.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: they all said
  simplified_phrase: the whole group asked
  preserved_meaning: Everyone in the group joined in asking the question.
  reasoning_layer_used: Lexical decision for πάντες and the interrogative context
  rationale: This recasts the collective emphasis and question into natural English.
- pob_phrase: And he said to them
  simplified_phrase: He answered
  preserved_meaning: Jesus responds directly to the group’s question.
  reasoning_layer_used: Lexical alternatives for ἔφη and immediate discourse context
  rationale: “Answered” makes the exchange easier to follow without changing the response.
- pob_phrase: You say that I am
  simplified_phrase: You say that I am
  preserved_meaning: Jesus gives an affirmative reply while placing the wording back on his questioners.
  reasoning_layer_used: Theological decision to preserve tension in Jesus’ reply
  rationale: The unusual wording remains because making it fully explicit would erase its rhetorical tension.
