simplification_decisions:
- pob_phrase: And he will show you
  simplified_phrase: Then he will show you
  preserved_meaning: The man will next direct the disciples to the room.
  reasoning_layer_used: Lexical decision for κἀκεῖνος and narrative sequence
  rationale: “Then” expresses the continuing sequence more naturally than a sentence-opening “And.”
- pob_phrase: a large furnished upper room
  simplified_phrase: a large furnished room upstairs
  preserved_meaning: The room is large, on an upper story, and arranged with furnishings.
  reasoning_layer_used: Lexical decisions for ἀνάγαιον, μέγα, and ἐστρωμένον
  rationale: “Room upstairs” makes the location immediately clear while retaining the room’s size and furnished state.
- pob_phrase: prepare there
  simplified_phrase: Make the preparations there
  preserved_meaning: The disciples are commanded to carry out the needed preparations in that room.
  reasoning_layer_used: Lexical decision for ἑτοιμάσατε
  rationale: The fuller English phrase avoids the awkward objectless command while leaving the implied task unstated.
