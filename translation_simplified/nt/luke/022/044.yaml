translation:
  language: en
  text: In his agony, he kept praying with even greater intensity. His sweat became like drops of blood falling to the ground.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The wording compares his sweat to drops of blood; it does not necessarily say that his sweat was blood.
    reason: lexical_alternative
  - marker: b
    text: Some manuscripts omit Luke 22:43–44, while others include them; the SBL Greek text marks these verses as textually uncertain.
    reason: textual_variant
simplification_decisions:
- pob_phrase: And being in agony
  simplified_phrase: In his agony
  preserved_meaning: Jesus was experiencing intense anguish.
  reasoning_layer_used: Lexical decision for ἀγωνίᾳ and circumstantial sense of γενόμενος
  rationale: The shorter prepositional phrase states the same condition in natural English.
- pob_phrase: he was praying more intensely
  simplified_phrase: he kept praying with even greater intensity
  preserved_meaning: His prayer was ongoing and increased in intensity.
  reasoning_layer_used: Lexical decisions for προσηύχετο and ἐκτενέστερον
  rationale: “Kept praying” preserves ongoing action, while “even greater intensity” makes the comparison clear.
- pob_phrase: and his sweat became like drops of blood falling to the ground
  simplified_phrase: His sweat became like drops of blood falling to the ground
  preserved_meaning: His sweat is vividly compared to blood drops descending to the ground.
  reasoning_layer_used: Lexical and theological decisions for ὡσεὶ and θρόμβοι
  rationale: A new sentence improves readability while retaining the image and its comparative force.
translation_notes:
  risk_flags:
  - risk: Readers may take “like drops of blood” to mean the sweat was literally blood.
    mitigation: The comparison remains explicit, and footnote a explains its limits.
  - risk: Readers may not know that the verse has manuscript uncertainty.
    mitigation: Footnote b preserves the POB textual-variant notice.
