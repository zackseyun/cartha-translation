simplification_decisions:
- pob_phrase: And after covering him
  simplified_phrase: After they covered him
  preserved_meaning: They covered Jesus before questioning him.
  reasoning_layer_used: The lexical decision keeps the verb broad rather than specifying how he was covered.
  rationale: The participle is recast as a normal English clause.
- pob_phrase: Who is the one who struck you?
  simplified_phrase: Who struck you?
  preserved_meaning: They mockingly demand that Jesus identify his attacker.
  reasoning_layer_used: The lexical rationale identifies “the one who struck you” as the person who hit him.
  rationale: The shorter question expresses the same meaning in natural English.
