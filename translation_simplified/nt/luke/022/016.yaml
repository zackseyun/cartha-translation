  preserved_meaning: The object is the Passover just mentioned in the preceding verse.
  reasoning_layer_used: Theological decision on the referent of αὐτό
  rationale: Naming the contextual referent prevents an unclear pronoun for modern readers.
- pob_phrase: until it is fulfilled
