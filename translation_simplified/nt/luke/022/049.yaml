  rationale: This documented alternative is clear without limiting the group to named disciples.
- pob_phrase: shall we strike with the sword?
  simplified_phrase: should we strike with a sword?
  preserved_meaning: They ask Jesus whether they should strike using a bladed weapon.
  reasoning_layer_used: POB lexical decisions for εἰ, πατάξομεν, and ἐν μαχαίρῃ
  rationale: “Should we” states the deliberation naturally, while “strike” preserves the concrete action.
- pob_phrase: And when those around him saw what was about to happen, they said
  simplified_phrase: The people with Jesus saw what was about to happen. They said
