translation:
  language: en
  text: 'After all, who is more important: the person eating at the table[a] or the person serving the meal? Is it not the person eating at the table? Yet I am among you as one who serves.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In that culture, people usually reclined at the table during a meal while attendants served them.
    reason: cultural_note
simplification_decisions:
- pob_phrase: For who is greater
  simplified_phrase: After all, who is more important
  preserved_meaning: Jesus asks who normally has the higher social status.
  reasoning_layer_used: Lexical decision for γὰρ and μείζων
  rationale: “After all” keeps the explanatory link, while “more important” makes the status comparison clear.
- pob_phrase: the one reclining at the table or the one serving
  simplified_phrase: the person eating at the table or the person serving the meal
  preserved_meaning: The contrast remains between a diner and the attendant serving at a meal.
  reasoning_layer_used: Meal-context lexical decisions for ἀνακείμενος and διακονῶν
  rationale: The main text uses familiar meal language, while the footnote preserves the ancient reclining custom.
- pob_phrase: But I am among you as one who serves
  simplified_phrase: Yet I am among you as one who serves
  preserved_meaning: Jesus contrasts normal ideas of status with his own humble service.
  reasoning_layer_used: Theological decision on Jesus’ service language
  rationale: The wording keeps the verbal idea of serving without recasting Jesus as a bonded servant.
translation_notes:
  risk_flags:
  - risk: Replacing “reclining” with “eating” could hide the ancient banquet posture.
    mitigation: The cultural footnote explicitly preserves the reclining image.
  - risk: “More important” may sound broader than rank within this social setting.
    mitigation: The immediate contrast between diner and attendant anchors the phrase in social status.
