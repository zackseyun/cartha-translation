translation:
  language: en
  text: He sent Peter and John and told them, “Go and prepare the Passover[a] for us to eat.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This can also mean “the Passover meal.” The Greek term is broader, but preparing and eating it points especially to the meal here.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: saying
  simplified_phrase: and told them
  preserved_meaning: He directly gave Peter and John the command that follows.
  reasoning_layer_used: The lexical decision says the participle introduces the content of Jesus’ speech and permits idiomatic English.
  rationale: A finite verb is easier to follow than the participial wording.
- pob_phrase: so that we may eat it
  simplified_phrase: for us to eat
  preserved_meaning: The preparation has the purpose of enabling the group to eat the Passover.
  reasoning_layer_used: The lexical decision identifies the clause as expressing purpose and the Passover as the implied object.
  rationale: The shorter purpose phrase sounds natural while keeping the same relationship.
translation_notes:
  risk_flags:
  - risk: Readers may understand “the Passover” only as the meal, although the Greek term can be broader.
    mitigation: The main text retains “the Passover,” and the footnote explains the contextual meal sense without narrowing the term completely.
