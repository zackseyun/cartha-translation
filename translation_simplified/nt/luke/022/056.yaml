translation:
  language: en
  text: Then a servant girl saw him sitting in the light.[a] She looked closely at him and said, “This man was with him too.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “near the light.” The Greek can refer either to being near the light source or within the area it lit.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: a certain servant girl
  simplified_phrase: a servant girl
  preserved_meaning: An unspecified young female servant noticed him.
  reasoning_layer_used: The lexical decision identifies τις as indefinite and παιδίσκη as a young female servant.
  rationale: The English article already conveys that she was an unspecified servant girl.
- pob_phrase: seeing him seated by the light
  simplified_phrase: saw him sitting in the light
  preserved_meaning: She noticed him while he was sitting where the light made him visible.
  reasoning_layer_used: The lexical decisions support ordinary English for both the perception and Peter’s posture while preserving the location’s ambiguity.
  rationale: A finite verb and common wording make the action immediately clear.
- pob_phrase: looking intently at him
  simplified_phrase: She looked closely at him
  preserved_meaning: She examined him with focused attention before identifying him.
  reasoning_layer_used: The lexical decision says ἀτενίσασα describes focused, sustained looking.
  rationale: A new sentence avoids a crowded chain of participles without weakening her scrutiny.
translation_notes:
