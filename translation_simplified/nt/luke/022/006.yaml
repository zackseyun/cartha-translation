translation:
  language: en
  text: He agreed[a] and began looking for a chance to hand Jesus over to them when the crowd was not there.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “agreed to betray him.” The Greek expression translated “hand Jesus over” can also be understood as “betray Jesus” in this context.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: began seeking an opportunity
  simplified_phrase: began looking for a chance
  preserved_meaning: Judas started an ongoing search for a favorable occasion.
  reasoning_layer_used: Lexical decisions for ἐζήτει and εὐκαιρίαν
  rationale: Common wording preserves both the start of the search and the idea of a suitable occasion.
- pob_phrase: apart from the crowd
  simplified_phrase: when the crowd was not there
  preserved_meaning: Judas wanted to act in the crowd’s absence.
  reasoning_layer_used: Lexical decision for ἄτερ ὄχλου
  rationale: The time clause states the intended circumstance more naturally in modern English.
- pob_phrase: hand him over to them
  simplified_phrase: hand Jesus over to them
  preserved_meaning: Judas intended to deliver Jesus to the chief priests and officers.
  reasoning_layer_used: Immediate narrative context and lexical decisions for παραδίδωμι and αὐτοῖς
  rationale: Naming Jesus removes pronoun ambiguity while retaining the source-driven image of handing someone over.
interpretive_expansions:
