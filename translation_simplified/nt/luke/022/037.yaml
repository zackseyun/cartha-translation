translation:
  language: en
  text: 'I tell you this because what was written must be fulfilled in me: “And he was counted among the lawless.”[a] Indeed, what concerns me is reaching its end.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally, “And he was numbered with transgressors” (Isaiah 53:12).
    reason: alternative_reading
  - marker: b
    text: Or “what concerns me is coming to completion” or “has its fulfillment.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: For I tell you that this which is written
  simplified_phrase: I tell you this because what was written
  preserved_meaning: Jesus explains that the written words about him must be fulfilled.
  reasoning_layer_used: Lexical decision for λέγω γὰρ ὑμῖν and τοῦτο τὸ γεγραμμένον
  rationale: The recast removes the awkward relative clause while keeping the explanatory connection.
- pob_phrase: And he was counted with the lawless
  simplified_phrase: And he was counted among the lawless
  preserved_meaning: Jesus is reckoned as belonging with people who reject the law.
  reasoning_layer_used: Lexical and theological decision for Καὶ μετὰ ἀνόμων ἐλογίσθη
  rationale: “Among” is natural English for group association without replacing the source-driven term “lawless.”
- pob_phrase: For what concerns me has its fulfillment
  simplified_phrase: Indeed, what concerns me is reaching its end
  preserved_meaning: The course of events concerning Jesus is moving toward its culmination.
  reasoning_layer_used: Lexical and theological decision for τέλος ἔχει
  rationale: This wording is direct while preserving the phrase’s tension between ending and completion.
