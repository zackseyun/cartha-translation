  preserved_meaning: A person with higher standing must take on the low-status posture associated with the younger person.
  reasoning_layer_used: POB lexical and theological decisions on μείζων, γινέσθω, and νεώτερος
  rationale: The wording makes the social-rank reversal clear while retaining the command to become different.
- pob_phrase: the one who leads like the one who serves
