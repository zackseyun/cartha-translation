translation:
  language: en
  text: But you must not be like that. Instead, whoever is considered greater among you must become like someone of lower status, and whoever leads must become like one who serves.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “like the younger”; in that society, a younger person usually had lower status.
    reason: cultural_note
