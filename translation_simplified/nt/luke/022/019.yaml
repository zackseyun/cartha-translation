translation:
  language: en
  text: Then he took bread and gave thanks. He broke it and gave it to them. He said, “This is my body,[a] which is given for you.[b] Keep doing this in remembrance of me.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek says “is.” Some interpret this as “signifies,” but the translation does not decide between these understandings.
    reason: alternative_reading
  - marker: b
    text: Or “which is being given for you.”
    reason: lexical_alternative
  - marker: c
    text: Some manuscripts omit “which is given for you. Keep doing this in remembrance of me.”
    reason: textual_variant
