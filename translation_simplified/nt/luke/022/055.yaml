- pob_phrase: And after they had kindled a fire
  simplified_phrase: They lit a fire
  preserved_meaning: The group started the fire before settling down.
  reasoning_layer_used: The lexical decision identifies the participle as prior action and allows “lit” as an alternative.
  rationale: A direct past-tense verb makes the action easier to follow, while the sentence order preserves the sequence.
- pob_phrase: and sat down together, Peter was sitting among them
  simplified_phrase: and sat down together. Peter was sitting among them.
  preserved_meaning: The group sat together, with Peter positioned among them in the ongoing scene.
  reasoning_layer_used: The lexical decisions preserve both the communal force of “together” and the imperfect sense of “was sitting.”
  rationale: Dividing the long sentence clarifies Peter’s place in the scene without weakening either idea.
