  preserved_meaning: The money bag and travel bag remain parallel items that their owners are told to bring.
  reasoning_layer_used: Lexical decisions for the generic participle, travel bag, and the imperative “take.”
  rationale: Repeating “anyone who has” keeps the two instructions parallel and clear.
- pob_phrase: the one who does not have one
  simplified_phrase: Anyone without a sword
