translation:
  language: en
  text: But now, anyone who has a money bag should take it along, and anyone who has a travel bag should take that along too. Anyone without a sword[a] should sell their cloak and buy one.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word can also mean a shorter blade, such as a dagger or short sword.
    reason: lexical_alternative
