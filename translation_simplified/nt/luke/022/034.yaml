simplification_decisions:
- pob_phrase: But he said
  simplified_phrase: But he answered
  preserved_meaning: Jesus responds directly and contrastively to Peter.
  reasoning_layer_used: POB lexical decision for ὁ δὲ εἶπεν
  rationale: “Answered” makes the exchange clearer without weakening the contrast.
- pob_phrase: I tell you, Peter
  simplified_phrase: Peter, I tell you this
  preserved_meaning: Jesus directly and emphatically addresses Peter.
  reasoning_layer_used: POB lexical decisions for Λέγω σοι and Πέτρε
  rationale: The reordered address follows natural spoken English.
- pob_phrase: until you deny three times that you know me
  simplified_phrase: until you have denied knowing me three times
  preserved_meaning: Peter will deny acquaintance with Jesus three times before the rooster crows.
  reasoning_layer_used: POB lexical and theological decisions for ἕως, τρίς, and με ἀπαρνήσῃ εἰδέναι
  rationale: The recast clause clearly preserves both the number and the specific denial of knowing Jesus.
translation_notes:
