translation:
  language: en
  text: But Jesus said to the chief priests, the temple security officers, and the elders who had come to arrest him, “Have you come with swords and clubs as if you were arresting a robber[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word can also mean a bandit or an outlaw involved in rebellion.
    reason: lexical_alternative
