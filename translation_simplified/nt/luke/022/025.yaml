  simplified_phrase: he told them
  preserved_meaning: Jesus directly addresses the disciples.
  reasoning_layer_used: Source syntax and immediate context
  rationale: “Told them” is more natural here while preserving the speech introduction.
- pob_phrase: lord it over them
  simplified_phrase: dominate their subjects
  preserved_meaning: Gentile kings exercise mastery in a domineering way.
  reasoning_layer_used: Lexical decision for κυριεύουσιν
  rationale: “Dominate” clearly conveys the force of oppressive mastery.
- pob_phrase: those exercising authority over them
  simplified_phrase: those who wield authority over them
  preserved_meaning: The leaders actively use their authority over others.
  reasoning_layer_used: Lexical decision for ἐξουσιάζοντες
  rationale: The finite clause reads naturally while retaining the active use of authority.
interpretive_expansions:
