translation:
  language: en
  text: But I have prayed for you, so that your faith[a] may not give out. When you have turned back[b], strengthen your brothers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word may also mean “faithfulness” or “trust.”
    reason: alternative_reading
  - marker: b
    text: This may also be translated “returned” or “turned again.” It points to Peter’s restoration after his coming failure.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: that your faith may not fail
  simplified_phrase: so that your faith may not give out
  preserved_meaning: Peter’s faith will be severely tested but is not described as ending completely.
  reasoning_layer_used: Lexical decision for ἵνα μὴ ἐκλίπῃ
  rationale: “Give out” expresses failure in familiar English without implying total loss.
- pob_phrase: and you, when you have turned back
  simplified_phrase: When you have turned back
  preserved_meaning: Peter will return after his coming failure, while the directional metaphor remains intact.
  reasoning_layer_used: Lexical and theological decisions for ἐπιστρέψας
  rationale: Starting a new sentence makes the sequence clear while retaining “turned back.”
- pob_phrase: strengthen your brothers
  simplified_phrase: strengthen your brothers
  preserved_meaning: Peter is directly commanded to make the other male disciples firm after his restoration.
  reasoning_layer_used: Lexical decisions for στήρισον and ἀδελφούς
  rationale: The POB wording is already clear and preserves the full force of the command.
translation_notes:
  risk_flags:
  - risk: “Give out” may sound less formal than “fail.”
    mitigation: It is clear, dignified, and directly supported by the audited lexical alternative.
