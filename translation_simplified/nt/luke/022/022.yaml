simplification_decisions:
- pob_phrase: goes as it has been determined
  simplified_phrase: is following the course already determined for him
  preserved_meaning: Jesus is already moving along the path previously determined for him, without identifying who determined it.
  reasoning_layer_used: Lexical decisions for κατὰ τὸ ὡρισμένον and πορεύεται
  rationale: The present-progressive wording makes the course clear while showing that his movement is underway.
- pob_phrase: but woe to that man through whom he is betrayed
  simplified_phrase: But woe to the man who betrays him
  preserved_meaning: The betrayer remains personally responsible despite the determined plan.
  reasoning_layer_used: Lexical decisions for πλὴν, οὐαί, δι’ οὗ, and παραδίδοται; theological decision on human responsibility
  rationale: The active wording reads naturally and retains the strong warning against Judas.
interpretive_expansions:
- pob_phrase: goes as it has been determined
  rendering: is following the course already determined for him
  claim: What was determined is the course the Son of Man is already following.
  evidence:
