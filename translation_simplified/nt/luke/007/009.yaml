translation:
  language: en
  text: When Jesus heard this, he was amazed at the centurion. He turned to the crowd following him and said, “I tell you, I have not found such great faith even among the people of Israel.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Faith” can also be translated “trust”; here it means the centurion’s confidence in Jesus’ authority.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: heard these things
  simplified_phrase: heard this
  preserved_meaning: Jesus heard the centurion’s reported message.
  reasoning_layer_used: lexical decision for ταῦτα and immediate context
  rationale: The singular “this” naturally refers to the message just reported.
- pob_phrase: he marveled at him
  simplified_phrase: he was amazed at the centurion
  preserved_meaning: Jesus responded to the centurion with genuine wonder.
  reasoning_layer_used: lexical decisions for ἐθαύμασεν and αὐτόν
  rationale: “Was amazed” is clearer today, and naming the centurion removes an unclear pronoun.
- pob_phrase: not even in Israel have I found such faith
  simplified_phrase: I have not found such great faith even among the people of Israel
  preserved_meaning: Jesus had encountered no comparable degree of faith within Israel.
  reasoning_layer_used: lexical decisions for οὐδὲ ἐν τῷ Ἰσραήλ, τοσαύτην πίστιν, and εὗρον
  rationale: The reordered sentence is natural English while preserving the emphatic comparison.
interpretive_expansions:
- pob_phrase: in Israel
  rendering: among the people of Israel
  claim: Israel refers here to the people among whom Jesus had ministered, not merely a geographic area.
  evidence:
  - The POB lexical rationale identifies “within Israel/the people of Israel” as the understood sense.
  - Jesus compares the centurion’s faith with faith he had found in Israel.
  confidence: high
  alternatives_preserved:
  - in Israel
translation_notes:
  risk_flags:
  - risk: “Was amazed” could be misunderstood as suggesting that Jesus lacked knowledge.
    mitigation: The wording expresses genuine wonder, matching the POB lexical rationale without making a claim about ignorance.
  - risk: The original POB footnote markers appear attached to the wrong phrases.
    mitigation: The useful lexical note is placed after “faith,” where it belongs.
