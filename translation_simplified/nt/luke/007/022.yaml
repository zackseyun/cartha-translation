translation:
  language: en
  text: He answered them, “Go and tell John what you have seen and heard. Blind people receive sight.[a] Those unable to walk now walk. People with leprosy are cleansed. Deaf people hear. The dead are raised. The good news is proclaimed to the poor.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Blind people see again.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And answering, he said to them
  simplified_phrase: He answered them
  preserved_meaning: Jesus responds directly to John’s messengers.
  reasoning_layer_used: POB lexical decision for ἀποκριθείς
  rationale: The direct verb removes an awkward participle while keeping the responsive force.
- pob_phrase: the lame walk
  simplified_phrase: Those unable to walk now walk
  preserved_meaning: People whose disability prevented walking are restored to walking.
  reasoning_layer_used: POB lexical decision for χωλοὶ περιπατοῦσιν
  rationale: The wording avoids an unfamiliar label and makes the restoration immediately clear.
- pob_phrase: the poor have good news proclaimed to them
  simplified_phrase: The good news is proclaimed to the poor
  preserved_meaning: Poor people are recipients of a public announcement of good news.
  reasoning_layer_used: POB lexical and theological decisions for πτωχοὶ εὐαγγελίζονται
  rationale: The recast passive is more natural while preserving proclamation and leaving the agent unstated.
translation_notes:
  risk_flags:
  - risk: “Cleansed” may sound merely hygienic to some readers.
    mitigation: It is retained because the POB reasoning includes both healing and restoration to ritual cleanness.
