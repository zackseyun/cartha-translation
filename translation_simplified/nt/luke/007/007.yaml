simplification_decisions:
- pob_phrase: Therefore I did not even consider myself worthy
  simplified_phrase: That is why I did not even think I was worthy
  preserved_meaning: The speaker draws a conclusion and says he did not regard himself as fit to approach Jesus.
  reasoning_layer_used: Lexical decisions for διὸ, οὐδὲ, and ἐμαυτὸν ἠξίωσα
  rationale: Common phrasing preserves both the logical connection and the intensified humility.
- pob_phrase: But say the word
  simplified_phrase: But just say the word
  preserved_meaning: The centurion trusts Jesus’ authoritative speech to bring healing.
  reasoning_layer_used: Lexical decision for εἰπὲ λόγῳ
  rationale: “Just” naturally emphasizes that Jesus needs only to speak.
- pob_phrase: my servant
  simplified_phrase: my servant[a]
  preserved_meaning: The household relationship is presented as service while the Greek term’s wider range remains visible.
  reasoning_layer_used: Lexical and theological decisions for ὁ παῖς μου
  rationale: The main contextual choice is retained and its important alternatives are footnoted.
interpretive_expansions:
- pob_phrase: say the word
  rendering: just say the word
  claim: Jesus needs only to speak for the requested healing to occur.
  evidence:
