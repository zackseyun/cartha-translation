  preserved_meaning: Jesus connects his statement to the preceding parable and comparison.
  reasoning_layer_used: Lexical decision for οὗ χάριν
  rationale: The rewrite keeps the connective force in more conversational modern English.
- pob_phrase: the one who is forgiven little
  simplified_phrase: whoever is forgiven little
  preserved_meaning: The statement applies generally without specifying gender.
  reasoning_layer_used: Lexical decision for ᾧ δὲ
  rationale: “Whoever” makes the generic meaning concise and natural.
