translation:
  language: en
  text: That is why I tell you:[a] Her many sins have been forgiven, because she loved so much. But whoever is forgiven little loves little.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Therefore she loved so much.” Her love can be understood as evidence that she had been forgiven, not as the cause of her forgiveness.
    reason: alternative_reading
