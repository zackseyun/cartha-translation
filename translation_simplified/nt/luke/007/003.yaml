translation:
  language: en
  text: When he heard about Jesus, he sent some Jewish community leaders to ask Jesus to come and save his servant.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “servant.” The Greek word can refer to a servant or a slave; “slave” preserves his bonded status.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: elders of the Jews
  simplified_phrase: Jewish community leaders
  preserved_meaning: They were recognized leaders in the Jewish community, not merely older men.
  reasoning_layer_used: POB lexical decision for πρεσβυτέρους τῶν Ἰουδαίων
  rationale: The clearer phrase conveys their social role without adding a specific institution.
- pob_phrase: he sent to him elders of the Jews, asking him
  simplified_phrase: he sent some Jewish community leaders to ask Jesus
  preserved_meaning: The man sent the elders to Jesus with a request.
  reasoning_layer_used: POB lexical decisions for ἀπέστειλεν πρὸς αὐτὸν and ἐρωτῶν αὐτὸν
  rationale: Ordinary English combines the sending and its purpose while naming Jesus for clarity.
- pob_phrase: save his slave
  simplified_phrase: save his slave
  preserved_meaning: The request uses the broad sense of saving or rescuing while retaining the slave’s bonded status.
  reasoning_layer_used: POB lexical and theological decisions for διασώσῃ and δοῦλον
  rationale: These source-driven choices remain because replacing them could narrow the rescue or obscure the social status.
translation_notes:
  risk_flags:
  - risk: Modern readers may take “save” only in a spiritual sense.
    mitigation: The surrounding account identifies the slave as gravely ill, so the narrative supplies the physical sense.
