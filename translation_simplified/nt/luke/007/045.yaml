translation:
  language: en
  text: You did not give me a kiss.[a] But ever since I came in, she has not stopped kissing[b] my feet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may mean a customary kiss of greeting, an act of hospitality.
    reason: cultural_note
  - marker: b
    text: 'The verb can suggest repeated or affectionate kissing: “covering my feet with kisses.”'
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: You gave me no kiss
  simplified_phrase: You did not give me a kiss
  preserved_meaning: Simon gave Jesus no kiss.
  reasoning_layer_used: POB lexical decisions for φίλημά, μοι, and ἔδωκας
  rationale: The ordinary negative form is easier to read while keeping the same action.
- pob_phrase: but from the time I came in
  simplified_phrase: But ever since I came in
  preserved_meaning: The woman’s action continued from Jesus’ arrival until he spoke.
  reasoning_layer_used: POB lexical decisions for ἀφ’ ἧς, εἰσῆλθον, and οὐ διέλιπεν
  rationale: “Ever since” states the continuing time relationship in natural English.
- pob_phrase: one sentence contrasting the two actions
  simplified_phrase: two short sentences joined by “But”
  preserved_meaning: Simon’s omission remains sharply contrasted with the woman’s continuing action.
  reasoning_layer_used: POB syntax and theological decision on the hospitality contrast
  rationale: Dividing the sentence makes the contrast easier to follow without weakening it.
translation_notes:
  risk_flags:
