simplification_decisions:
- pob_phrase: his disciples reported all these things to John
  simplified_phrase: John’s disciples told him about all these things
  preserved_meaning: The disciples relayed a complete report of these events to John.
  reasoning_layer_used: The lexical decision allows “told,” while the context clearly identifies John as the recipient.
  rationale: The active wording is easier to follow and keeps the full scope of their report.
- pob_phrase: John, calling two certain ones of his disciples
  simplified_phrase: John called for two of his disciples
  preserved_meaning: John summoned two selected members of his disciple group.
  reasoning_layer_used: The lexical notes support “calling” or “summoning,” and treat the indefinite nuance as natural selection from the group.
  rationale: “Called for two” expresses the action naturally without the awkward phrase “two certain ones.”
