  preserved_meaning: Simon respectfully invites Jesus to continue with what he intends to say.
  reasoning_layer_used: POB lexical decisions for Διδάσκαλε and εἰπέ
  rationale: “Go ahead” clearly conveys the imperative in natural modern dialogue while retaining “Teacher.”
