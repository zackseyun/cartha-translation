  preserved_meaning: He started addressing the crowds concerning John.
  reasoning_layer_used: Lexical decisions for ἤρξατο λέγειν, πρὸς τοὺς ὄχλους, and περὶ Ἰωάννου
  rationale: The progressive form sounds natural while retaining the start of the discourse.
- pob_phrase: What did you go out into the wilderness to look at?
  simplified_phrase: What did you go into the wilderness to see?
  preserved_meaning: The question asks what object the people went into the wilderness to observe.
