translation:
  language: en
  text: When the Pharisee who had invited Jesus saw her doing this, he thought, “If this man were a prophet, he would know who the woman touching him is and what kind of woman she is, because she is a sinner.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “he would know that she is a sinner.” The Greek may state what he would know rather than why he would judge her this way.
    reason: lexical_alternative
