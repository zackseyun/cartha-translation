translation:
  language: en
  text: When all the people, including the tax collectors, heard this, they acknowledged that God was right, having received John’s baptism.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The phrase “having received John’s baptism” may also mean “because they had received John’s baptism.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: declared God to be righteous
  simplified_phrase: acknowledged that God was right
  preserved_meaning: The people recognized that God was righteous and in the right.
  reasoning_layer_used: Lexical and theological decisions on ἐδικαίωσαν τὸν θεόν.
  rationale: This avoids suggesting that the people made God righteous while preserving their affirmation of him.
- pob_phrase: having been baptized with John’s baptism
  simplified_phrase: having received John’s baptism
  preserved_meaning: John’s baptism remained a circumstance directly connected with their response.
  reasoning_layer_used: Lexical and theological decisions on βαπτισθέντες and τὸ βάπτισμα Ἰωάννου.
  rationale: “Received” is natural English for undergoing baptism, while the connected phrase preserves the neutral syntax.
translation_notes:
