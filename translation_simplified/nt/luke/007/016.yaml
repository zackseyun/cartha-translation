translation:
  language: en
  text: Fear took hold of everyone. They kept praising God and said, “A great prophet has arisen among us![a] God has come to care for his people!”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “has been raised up among us,” which may point to God as the one who raised up the prophet.
    reason: lexical_alternative
  - marker: b
    text: This expresses the biblical image of God “visiting” his people with attention and saving concern.
    reason: source_note
simplification_decisions:
- pob_phrase: fear seized them all
  simplified_phrase: Fear took hold of everyone
  preserved_meaning: Fear suddenly affected the whole crowd with strong force.
  reasoning_layer_used: Lexical decision for ἔλαβεν ... φόβος πάντας and theological decision to retain “fear.”
  rationale: The common idiom keeps both the force of seizure and the stronger response of fear.
- pob_phrase: they were glorifying God
  simplified_phrase: They kept praising God
  preserved_meaning: The crowd continued giving God glory.
  reasoning_layer_used: Lexical decision for the imperfect ἐδόξαζον and its approved alternative “praised.”
  rationale: “Kept” preserves the ongoing action while “praising” is immediately clear to common readers.
- pob_phrase: saying
  simplified_phrase: and said
  preserved_meaning: Their words explain how they praised God.
  reasoning_layer_used: Lexical decision for λέγοντες and the applied revision treating both declarations as one utterance.
  rationale: A finite verb and two short exclamations make the report easier to follow.
interpretive_expansions:
- pob_phrase: God has visited his people
  rendering: God has come to care for his people
  claim: God’s visit means that he has come to his people with active concern.
  evidence:
  - The POB cultural note defines the visit as coming with attention and saving concern.
  - The lexical rationale says ἐπισκέπτομαι often conveys care or intervention in biblical usage.
  - The preceding miracle shows God acting for his people.
  confidence: high
  alternatives_preserved:
  - God has visited his people
  - God has come to help his people
translation_notes:
  risk_flags:
  - risk: “Come to care for” makes the concern within divine visitation more explicit than the POB main text.
    mitigation: The footnote preserves the source image of God visiting his people.
  - risk: “Praising” weakens the direct lexical link between glorifying and glory.
    mitigation: It retains the crowd’s God-honoring response and is an approved POB lexical alternative.
