translation:
  language: en
  text: and that, in his name, repentance for the forgiveness of sins[a] should be announced to people of every nation,[b] starting from Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “repentance and forgiveness of sins.” The Greek may present these as two parts of the message.
    reason: alternative_reading
  - marker: b
    text: Or “to all nations.” The Greek word can also mean “Gentiles” in some contexts.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: should be proclaimed
  simplified_phrase: should be announced
  preserved_meaning: The message is to be made known publicly.
  reasoning_layer_used: Lexical decision for κηρυχθῆναι
  rationale: “Announced” expresses public proclamation in familiar English.
- pob_phrase: to all the nations
  simplified_phrase: to people of every nation
  preserved_meaning: The message is intended for peoples throughout the world.
  reasoning_layer_used: Lexical and theological decisions for ἔθνη
  rationale: This clarifies the worldwide human scope without limiting it to Gentiles.
- pob_phrase: beginning from Jerusalem
  simplified_phrase: starting from Jerusalem
  preserved_meaning: Jerusalem is the point of origin from which the proclamation proceeds.
  reasoning_layer_used: Lexical decision for ἀρξάμενοι ἀπὸ Ἰερουσαλήμ
  rationale: “Starting from” is natural English and preserves the directional force of ἀπό.
translation_notes:
  risk_flags:
  - risk: “Repentance for the forgiveness of sins” may be read as specifying a detailed order of salvation.
    mitigation: Footnote a preserves the coordinated alternative without weakening the POB reading.
  - risk: “People of every nation” is less formally close to the Greek phrase “all the nations.”
    mitigation: Footnote b retains the literal alternative and the possible sense “Gentiles.”
