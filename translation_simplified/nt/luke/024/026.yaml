simplification_decisions:
- pob_phrase: Was it not necessary for the Messiah
  simplified_phrase: Didn’t the Messiah have to
  preserved_meaning: The direct question expects agreement that the Messiah’s suffering was necessary in God’s plan.
  reasoning_layer_used: Lexical decision for οὐχί and theological decision for ἔδει
  rationale: The direct negative question and “had to” express the expected answer in natural English.
- pob_phrase: to suffer these things and to enter into his glory
  simplified_phrase: suffer these things and enter into his glory
  preserved_meaning: Suffering and entering into his own glory remain distinct, coordinated actions.
  reasoning_layer_used: Lexical decisions for παθεῖν, καί, and εἰσελθεῖν εἰς τὴν δόξαν αὐτοῦ
  rationale: Removing the repeated “to” smooths the sentence while “into” preserves movement into glory.
translation_notes:
