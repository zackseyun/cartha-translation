translation:
  language: en
  text: Look at my hands and feet—you can see that it is really me.[a] Touch me and see. A spirit[b] does not have flesh and bones, as you can see I do.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “that I am he.” The Greek strongly emphasizes that Jesus himself is the one before them.
    reason: lexical_alternative
  - marker: b
    text: Or, “a ghost.” The Greek word is “spirit.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Look at my hands and my feet, that it is I myself.
  simplified_phrase: Look at my hands and feet—you can see that it is really me.
  preserved_meaning: Jesus calls them to inspect his body and recognize his personal identity.
  reasoning_layer_used: Lexical decision for ὅτι ἐγώ εἰμι αὐτός and latest revision pass
  rationale: The dash and direct wording replace an awkward content clause while retaining its emphatic force.
- pob_phrase: Touch me and see
  simplified_phrase: Touch me and see.
  preserved_meaning: Jesus invites physical examination as evidence.
  reasoning_layer_used: Lexical decision for ψηλαφήσατέ
  rationale: The short sentence gives both commands their natural force.
- pob_phrase: as you see that I have
  simplified_phrase: as you can see I do
  preserved_meaning: The disciples can observe that Jesus has flesh and bones.
  reasoning_layer_used: Lexical decisions for θεωρεῖτε and ἔχοντα
  rationale: Using “do” avoids repeating “have flesh and bones” without losing the bodily claim.
translation_notes:
  risk_flags:
