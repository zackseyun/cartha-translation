  text: The women telling the apostles about these things were Mary Magdalene, Joanna, Mary the mother of James,[a] and the other women with them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Greek says “Mary of James.” This most likely means James’s mother, though it could mean his wife.
