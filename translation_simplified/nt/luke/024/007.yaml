simplification_decisions:
- pob_phrase: saying that
  simplified_phrase: He said, “...”
  preserved_meaning: This remains Jesus’ remembered statement from the preceding context.
  reasoning_layer_used: POB lexical decision for λέγων and immediate context
  rationale: A direct quotation is easier to follow than the participial construction.
- pob_phrase: must be delivered into the hands of sinful men
  simplified_phrase: must be handed over into the hands of sinful men
  preserved_meaning: Jesus had to be placed under the power of the sinful male agents.
  reasoning_layer_used: POB lexical and theological decisions for δεῖ, παραδοθῆναι, and ἀνθρώπων ἁμαρτωλῶν
  rationale: “Handed over” is clearer while retaining divine necessity and the hands image.
- pob_phrase: and be crucified and on the third day rise again
  simplified_phrase: He must be crucified, and on the third day he must rise again.
  preserved_meaning: Crucifixion and Jesus’ active return to life remain parts of the same necessary sequence.
  reasoning_layer_used: POB lexical decisions for σταυρωθῆναι and ἀναστῆναι
  rationale: A new sentence and repeated subject make the sequence easier to read.
translation_notes:
  risk_flags:
