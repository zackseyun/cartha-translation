translation:
  language: en
  text: Then he said to them, “How foolish you are! Your hearts[a] are so slow to believe everything the prophets have spoken!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “hearts” means their inner selves, including both understanding and trust.
    reason: cultural_note
simplification_decisions:
- pob_phrase: And he said to them
  simplified_phrase: Then he said to them
  preserved_meaning: Jesus now responds directly to the two disciples.
  reasoning_layer_used: Lexical decision for καὶ αὐτὸς εἶπεν πρὸς αὐτούς
  rationale: “Then” gives the narrative connection in natural modern English.
- pob_phrase: O foolish ones
  simplified_phrase: How foolish you are!
  preserved_meaning: Jesus directly rebukes their lack of understanding.
  reasoning_layer_used: Lexical decision for Ὦ and ἀνόητοι; theological decision on the rebuke
  rationale: The exclamation preserves the solemn force while avoiding an unnatural form of address.
- pob_phrase: slow of heart to believe all that
  simplified_phrase: Your hearts are so slow to believe everything
  preserved_meaning: Their whole inner selves are sluggish to understand and trust the complete prophetic witness.
  reasoning_layer_used: Lexical decisions for βραδεῖς τῇ καρδίᾳ, τοῦ πιστεύειν, and ἐπὶ πᾶσιν οἷς
  rationale: The recast sentence keeps the heart image and comprehensive scope in clearer English.
translation_notes:
  risk_flags:
  - risk: Modern readers may take “hearts” as referring only to emotions.
    mitigation: The footnote explains that the image includes understanding and trust.
  - risk: “Foolish” may sound like a purely moral insult.
    mitigation: The following clause identifies failure to understand and trust the prophets as the point of the rebuke.
