  preserved_meaning: Herod too was present in Jerusalem during that period.
  reasoning_layer_used: POB lexical decisions on ὄντα καὶ αὐτόν and ἐν ταύταις ταῖς ἡμέραις
  rationale: A separate sentence removes the dense relative clause while keeping the emphasis and time reference.
