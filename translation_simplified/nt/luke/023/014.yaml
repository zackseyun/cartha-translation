translation:
  language: en
  text: 'He said to them, “You brought this man to me, claiming that he was misleading the people.[a] But look: I examined him in front of you, and I found no basis for the charges you have made against him.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “turning the people away.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: as one who was misleading the people
  simplified_phrase: claiming that he was misleading the people
  preserved_meaning: They presented Jesus to Pilate on the accusation that he was leading the people astray.
  reasoning_layer_used: Lexical decision for ἀποστρέφω and the immediate legal context
  rationale: “Claiming that” makes the accusatory setting clear without strengthening the charge.
- pob_phrase: behold, after examining him before you
  simplified_phrase: 'But look: I examined him in front of you'
  preserved_meaning: Pilate draws attention to the public examination he conducted in their presence.
  reasoning_layer_used: Lexical decisions for ἰδού, ἀνακρίνω, and ἐνώπιον ὑμῶν
  rationale: A direct sentence replaces the dense participial clause while retaining its public and judicial force.
- pob_phrase: I found no basis in this man for the charges you bring against him
  simplified_phrase: I found no basis for the charges you have made against him
  preserved_meaning: Pilate found no valid grounds for their accusations against Jesus.
  reasoning_layer_used: Lexical decision for αἴτιον and theological decision on Pilate’s judicial finding
  rationale: The shorter wording keeps the verdict tied specifically to the charges.
interpretive_expansions:
- pob_phrase: as one who was misleading the people
  rendering: claiming that he was misleading the people
  claim: The description is the accusers’ allegation, not the narrator’s judgment.
  evidence:
  - The clause reports why they brought Jesus to Pilate.
  - The verse ends by naming what they accuse him of.
  confidence: high
  alternatives_preserved:
  - as one who was misleading the people
  - as one who was turning the people away
translation_notes:
  risk_flags:
  - risk: “No basis” could be read as a broader declaration of moral innocence.
    mitigation: The sentence limits Pilate’s finding to the specific charges made against Jesus.
