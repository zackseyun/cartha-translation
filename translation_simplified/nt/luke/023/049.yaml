simplification_decisions:
- pob_phrase: all those who knew him
  simplified_phrase: everyone who knew Jesus
  preserved_meaning: The group includes Jesus’ known associates without implying that all were close friends.
  reasoning_layer_used: POB lexical decision for πάντες οἱ γνωστοὶ αὐτῷ
  rationale: Naming Jesus makes the pronoun clear while preserving the broad sense of the group.
- pob_phrase: were standing at a distance
  simplified_phrase: remained standing at a distance
  preserved_meaning: They continued to stand away from the crucifixion scene.
  reasoning_layer_used: POB lexical decisions for εἱστήκεισαν and μακρόθεν
  rationale: “Remained standing” makes the continuing posture natural and explicit.
- pob_phrase: watching these things
  simplified_phrase: watching it all
  preserved_meaning: The women continued witnessing the events taking place.
  reasoning_layer_used: POB lexical decision for ὁρῶσαι ταῦτα
  rationale: “Watching it all” is ordinary English that retains the ongoing observation.
