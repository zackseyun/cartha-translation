translation:
  language: en
  text: But everyone who knew Jesus[a] remained standing at a distance. The women who had followed him from Galilee stood there too, watching it all.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “all his acquaintances.”
