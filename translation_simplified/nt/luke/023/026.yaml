  preserved_meaning: Simon is introduced as an otherwise unknown man associated with Cyrene.
  reasoning_layer_used: POB lexical decision for Σίμωνά τινα Κυρηναῖον
  rationale: The new wording expresses the same introduction in ordinary modern English.
- pob_phrase: and laid the cross on him to carry
  simplified_phrase: They put the cross on Simon for him to carry
  preserved_meaning: The cross was placed on Simon as an imposed burden.
  reasoning_layer_used: POB lexical decisions for ἐπέθηκαν, σταυρόν, and φέρειν
  rationale: “Put” is clearer than “laid” while retaining the physical action and the term “cross.”
- pob_phrase: one long coordinated sentence
  simplified_phrase: three short sentences
  preserved_meaning: The sequence remains leading Jesus away, seizing Simon, and making him carry the cross behind Jesus.
  reasoning_layer_used: POB syntax and narrative sequence
  rationale: Shorter sentences make the actions easier to follow without changing their order.
