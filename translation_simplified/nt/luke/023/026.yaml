translation:
  language: en
  text: As they led Jesus away, they seized a man named Simon from Cyrene. He was coming in from the countryside.[a] They put the cross[b] on Simon for him to carry behind Jesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “coming in from the field.” The Greek can mean a field or the countryside outside the city.
    reason: lexical_alternative
  - marker: b
    text: Some understand this as “the crossbeam,” but the Greek says “the cross.”
    reason: lexical_alternative
