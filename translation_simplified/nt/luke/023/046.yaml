translation:
  language: en
  text: Jesus cried out loudly, “Father, I entrust my spirit into your hands.”[a] After he said this, he breathed his last.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Jesus’ words echo Psalm 31:5: “Into your hands I commit my spirit.”'
    reason: cross_reference
simplification_decisions:
- pob_phrase: crying out with a loud voice
  simplified_phrase: cried out loudly
  preserved_meaning: Jesus spoke with audible force.
  reasoning_layer_used: The lexical decisions for φωνήσας and φωνῇ μεγάλῃ preserve both the cry and its loudness.
  rationale: The finite verb and adverb are clearer than the participial phrase.
- pob_phrase: into your hands I commit my spirit
  simplified_phrase: I entrust my spirit into your hands
  preserved_meaning: Jesus intentionally places his spirit in the Father’s care while retaining the biblical image of hands.
  reasoning_layer_used: The lexical and theological decisions identify παρατίθεμαι as personal entrustment and preserve πνεῦμα as “spirit.”
  rationale: Modern word order and “entrust” make the act of placing something in another’s care immediately clear.
- pob_phrase: Having said this
  simplified_phrase: After he said this
  preserved_meaning: Jesus’ death followed his final words.
  reasoning_layer_used: The lexical decision treats the aorist participle as action prior to the main verb.
  rationale: A full time clause is more natural for common readers.
translation_notes:
  risk_flags:
  - risk: Changing “commit” to “entrust” may lessen the traditional echo of Psalm 31:5.
    mitigation: The footnote gives the echoed wording, while the main text preserves intentional self-entrustment.
