translation:
  language: en
  text: Pilate said to them for the third time, “Why? What evil has this man done? I have found no reason to sentence him to death. So I will punish him[a] and then release him.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The exact punishment is not specified; it may have involved flogging.
    reason: lexical_alternative
