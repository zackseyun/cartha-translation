translation:
  language: en
  text: But Jesus kept saying, “Father, forgive them, because they do not know what they are doing.”[a] Then they divided his clothing by drawing lots.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Some manuscripts omit: “Father, forgive them, because they do not know what they are doing.”'
