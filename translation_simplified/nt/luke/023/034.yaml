simplification_decisions:
- pob_phrase: Jesus was saying
  simplified_phrase: Jesus kept saying
  preserved_meaning: Jesus’ words are presented as ongoing or repeated rather than as a single momentary statement.
  reasoning_layer_used: POB lexical decision for ἔλεγεν
  rationale: “Kept saying” expresses the imperfect tense in more natural common English.
- pob_phrase: for they do not know
  simplified_phrase: because they do not know
  preserved_meaning: Jesus gives their lack of knowledge as the reason for his request.
  reasoning_layer_used: POB lexical decision for οὐ γὰρ οἴδασιν
  rationale: “Because” makes the relationship between the clauses immediately clear.
- pob_phrase: And dividing his garments, they cast lots
  simplified_phrase: Then they divided his clothing by drawing lots
  preserved_meaning: They used lots while dividing Jesus’ articles of clothing.
  reasoning_layer_used: POB lexical decisions for διαμεριζόμενοι, ἱμάτια, and ἔβαλον κλήρους
  rationale: The recast sentence removes the awkward participle and uses familiar wording for clothing and the ancient practice.
interpretive_expansions:
- pob_phrase: dividing his garments, they cast lots
  rendering: divided his clothing by drawing lots
  claim: Drawing lots was the means used to divide Jesus’ clothing.
  evidence:
  - The participle “dividing” occurs with the main action “cast lots.”
  - The POB lexical rationale says the action concerns dividing up Jesus’ clothing.
  confidence: high
  alternatives_preserved:
  - They cast lots while dividing his clothing.
translation_notes:
  risk_flags:
