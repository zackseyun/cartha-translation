  preserved_meaning: The curtain within the temple remains the object that was torn.
  reasoning_layer_used: POB lexical decision on καταπέτασμα and ναός
  rationale: The attributive form is natural modern English and keeps POB's accessible term “curtain.”
- pob_phrase: was torn in the middle
