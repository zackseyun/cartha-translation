simplification_decisions:
- pob_phrase: the people stood watching
  simplified_phrase: The people stood by and watched
  preserved_meaning: The people remained there and continued watching.
  reasoning_layer_used: Lexical decisions for εἱστήκει and θεωρῶν
  rationale: The finite verbs make the scene easier to grasp without changing its ongoing sense.
- pob_phrase: the rulers were mocking him, saying
  simplified_phrase: the rulers sneered at him. They said
  preserved_meaning: The rulers spoke with hostile contempt toward Jesus.
  reasoning_layer_used: Lexical decision for ἐξεμυκτήριζον
  rationale: “Sneered” conveys the documented derision, while two sentences simplify the structure.
- pob_phrase: if this is God’s Messiah
  simplified_phrase: if this man is God’s Messiah
  preserved_meaning: Their words point contemptuously to Jesus while challenging his messianic identity.
  reasoning_layer_used: Lexical decision for εἰ οὗτός ἐστιν and theological decision for Χριστός
  rationale: “This man” is natural English that retains the demonstrative force and the title “Messiah.”
