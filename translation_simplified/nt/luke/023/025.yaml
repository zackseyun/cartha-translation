translation:
  language: en
  text: So Pilate released the man they were asking him to release. This man had been thrown into prison for rebellion and murder. But Pilate handed Jesus over to be dealt with as they wished.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the man who had been thrown into prison for insurrection and murder, whom they were asking for
  simplified_phrase: the man they were asking him to release. This man had been thrown into prison for rebellion and murder
  preserved_meaning: Pilate released the requested prisoner who was imprisoned for political revolt and murder.
  reasoning_layer_used: POB syntax, lexical decisions, and immediate context
  rationale: The long relative clause becomes two direct sentences without losing the prisoner's crimes or the crowd's request.
- pob_phrase: insurrection
  simplified_phrase: rebellion
  preserved_meaning: The crime was civil revolt rather than a mere disagreement.
  reasoning_layer_used: POB lexical alternatives for στάσις
  rationale: “Rebellion” is more familiar than “insurrection” while preserving the political-criminal sense.
- pob_phrase: to their will
  simplified_phrase: to be dealt with as they wished
  preserved_meaning: Pilate surrendered Jesus to the outcome the crowd desired.
  reasoning_layer_used: POB lexical decision for θέλημα and theological restraint
  rationale: The wording explains the difficult phrase while adding no theory of atonement or substitution.
