simplification_decisions:
- pob_phrase: But turning toward them, Jesus said
  simplified_phrase: But Jesus turned to them and said
  preserved_meaning: Jesus physically turned toward the women before speaking to them.
  reasoning_layer_used: Lexical decisions for στραφεὶς, δὲ, and πρὸς αὐτάς
  rationale: A direct sequence is easier to read than the opening participial phrase.
- pob_phrase: do not weep for me; instead, weep for yourselves and for your children
  simplified_phrase: do not weep for me. Weep instead for yourselves and your children.
  preserved_meaning: Jesus redirects their mourning from him to themselves and their children.
  reasoning_layer_used: Lexical decisions for μὴ κλαίετε, πλήν, and the parallel ἐπί phrases
  rationale: Two sentences make the corrective contrast immediate without weakening it.
- pob_phrase: Daughters of Jerusalem
  simplified_phrase: Daughters of Jerusalem
  preserved_meaning: The prophetic-style familial and corporate address remains intact.
  reasoning_layer_used: Theological decision on Θυγατέρες Ἰερουσαλήμ
  rationale: The phrase is retained because replacing it would erase its biblical resonance.
