translation:
  language: en
  text: For it is easier for a camel to go through the eye of a needle than for a rich man to enter the kingdom of God.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek says “camel,” not “rope,” and gives no support for the idea of a narrow gate called “the needle’s eye.”
