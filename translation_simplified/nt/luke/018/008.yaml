simplification_decisions:
- pob_phrase: he will bring about justice for them quickly
  simplified_phrase: he will quickly give them justice
  preserved_meaning: God will act swiftly to secure justice for those who appeal to him.
  reasoning_layer_used: POB lexical decisions for ποιήσει τὴν ἐκδίκησιν αὐτῶν and ἐν τάχει
  rationale: This uses ordinary English while preserving judicial redress and the sense of swift action.
- pob_phrase: Nevertheless
  simplified_phrase: But
  preserved_meaning: The strong contrast introduces Jesus’ searching question.
  reasoning_layer_used: POB lexical decision for πλὴν
  rationale: “But” expresses the contrast more naturally for common readers.
- pob_phrase: on the earth
  simplified_phrase: on earth
  preserved_meaning: The question has a worldwide scope.
  reasoning_layer_used: POB lexical decision for ἐπὶ τῆς γῆς
  rationale: The idiomatic phrase keeps the same global meaning.
