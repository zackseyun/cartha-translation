translation:
  language: en
  text: I tell you, he will quickly give them justice. But when the Son of Man comes, will he really find faith on earth?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The word translated “faith” can also mean “trust” or “faithfulness.”
