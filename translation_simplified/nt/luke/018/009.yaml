simplification_decisions:
- pob_phrase: some who trusted in themselves that they were righteous
  simplified_phrase: some people who trusted in themselves. They were convinced that they were righteous
  preserved_meaning: Their settled confidence rested in themselves and included the belief that they were righteous.
  reasoning_layer_used: Lexical decisions for πεποιθότας and δίκαιοι, plus the theological decision to retain “righteous.”
  rationale: Two sentences make the self-reliance and self-assessment easier to follow without weakening either idea.
- pob_phrase: treated the rest with contempt
  simplified_phrase: treated everyone else as worthless
  preserved_meaning: They actively treated other people as though they had no value.
  reasoning_layer_used: Lexical decisions for ἐξουθενοῦντας and τοὺς λοιπούς.
  rationale: The concrete wording expresses the force of contempt in common English.
interpretive_expansions:
- pob_phrase: treated the rest with contempt
  rendering: treated everyone else as worthless
  claim: Their contempt amounted to treating other people as having no worth.
  evidence:
  - The lexical rationale says ἐξουθενέω can mean “to regard as nothing.”
  - The POB chose active treatment rather than a merely emotional response.
  confidence: high
