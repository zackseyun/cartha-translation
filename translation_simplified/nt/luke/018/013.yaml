translation:
  language: en
  text: But the tax collector stood at a distance. He would not even raise his eyes toward heaven. Instead, he kept beating his chest and saying, “God, be merciful to me,[a] the sinner.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “be propitious to me”; the verb is related to the language of atonement and propitiation.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: standing far off
  simplified_phrase: stood at a distance
  preserved_meaning: He remained physically separated from the others, reflecting his humble posture.
  reasoning_layer_used: Lexical decision for μακρόθεν and ἑστὼς
  rationale: A finite verb and common spatial phrase make the scene easier to picture.
- pob_phrase: was not willing even to lift up his eyes to heaven
  simplified_phrase: He would not even raise his eyes toward heaven
  preserved_meaning: He deliberately refrained from looking heavenward in humility or shame.
  reasoning_layer_used: Lexical decision for οὐκ ἤθελεν οὐδὲ and ἐπᾶραι εἰς τὸν οὐρανόν
  rationale: “Would not even” expresses volition more naturally while retaining the bodily image.
- pob_phrase: but kept beating his chest, saying
  simplified_phrase: Instead, he kept beating his chest and saying
  preserved_meaning: His repeated gesture accompanied his prayer of grief and contrition.
  reasoning_layer_used: Lexical decision for ἔτυπτε and τὸ στῆθος αὐτοῦ
  rationale: A new sentence and explicit contrast clarify the action without weakening its repeated force.
translation_notes:
  risk_flags:
  - risk: “Be merciful” may not display the verb’s atonement-related nuance by itself.
