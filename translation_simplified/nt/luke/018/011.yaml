translation:
  language: en
  text: The Pharisee stood by himself[a] and prayed, “God, I thank you that I am not like everyone else. I do not extort people, do what is wrong, or commit adultery. I am not even like this tax collector.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “The Pharisee stood and prayed these things to himself.” The Greek may describe where he stood or suggest that his prayer was directed to himself.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: standing by himself, was praying these things
  simplified_phrase: stood by himself and prayed
  preserved_meaning: He stood separately while praying, with the possible self-directed sense kept in the footnote.
  reasoning_layer_used: Lexical and theological decisions on πρὸς ἑαυτόν
  rationale: Natural narrative wording preserves the preferred spatial reading without adding “from others.”
- pob_phrase: the rest of men
  simplified_phrase: everyone else
  preserved_meaning: The Pharisee broadly contrasts himself with other people.
  reasoning_layer_used: Lexical decision on ὥσπερ οἱ λοιποὶ τῶν ἀνθρώπων
  rationale: The generic reference becomes clear modern English.
- pob_phrase: extortioners, unrighteous, adulterers
  simplified_phrase: I do not extort people, do what is wrong, or commit adultery
  preserved_meaning: The three accusations remain distinct as actions he denies committing.
  reasoning_layer_used: Lexical decisions on ἅρπαγες, ἄδικοι, and μοιχοί
  rationale: Concrete verbal clauses make the vice list immediately understandable.
translation_notes:
  risk_flags:
  - risk: Changing labels into actions may slightly reduce the vice list’s force as categories of people.
    mitigation: Each vice remains separate and retains its full moral force.
  - risk: “By himself” favors the spatial sense of the ambiguous Greek phrase.
    mitigation: The viable self-directed sense is retained in footnote [a].
