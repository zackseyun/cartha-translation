translation:
  language: en
  text: People were even bringing infants to Jesus so that he would touch them.[a] But when the disciples saw this, they rebuked those who were bringing them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In the parallel accounts, Jesus’ touch is connected with blessing the children and laying his hands on them (Matthew 19:13; Mark 10:13, 16).
    reason: cross_reference
simplification_decisions:
- pob_phrase: They were even bringing infants to him
  simplified_phrase: People were even bringing infants to Jesus
  preserved_meaning: People repeatedly brought very young children to Jesus.
  reasoning_layer_used: Lexical decisions for Προσέφερον, καὶ, τὰ βρέφη, and αὐτῷ
  rationale: Naming the implied people and Jesus makes the scene immediately clear while retaining “even” and “infants.”
- pob_phrase: so that he might touch them
  simplified_phrase: so that he would touch them
  preserved_meaning: They brought the infants for the purpose of receiving Jesus’ touch.
  reasoning_layer_used: Lexical and theological decisions for ἵνα and ἅπτηται
  rationale: The wording expresses purpose naturally without changing “touch” to the interpretive “bless.”
- pob_phrase: when the disciples saw it
  simplified_phrase: when the disciples saw this
  preserved_meaning: The disciples reacted after seeing the infants being brought.
  reasoning_layer_used: Lexical decision for ἰδόντες
  rationale: “Saw this” points clearly to the preceding event in ordinary English.
interpretive_expansions:
- pob_phrase: they rebuked them
  rendering: they rebuked those who were bringing them
  claim: The disciples rebuked the people bringing the infants, not the infants.
  evidence:
  - The POB lexical decision identifies the adults bringing the infants as the pronoun’s natural antecedent.
  - POB footnote b makes this antecedent explicit.
  confidence: high
  alternatives_preserved:
  - the people who brought them
translation_notes:
  risk_flags:
  - risk: Modern readers may not understand why Jesus’ touch mattered.
    mitigation: The footnote gives the parallel accounts’ blessing context without importing “bless” into Luke’s main text.
