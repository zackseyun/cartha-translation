translation:
  language: en
  text: But Jesus called the children over to him. He said, “Let the children come to me. Do not stop them, because God’s kingdom belongs to people like these children.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: called them to him, saying
  simplified_phrase: called the children over to him. He said
  preserved_meaning: Jesus summoned the children to come near and then spoke.
  reasoning_layer_used: lexical decision for προσεκαλέσατο and the referent of αὐτά
  rationale: Naming the children and dividing the sentence makes the action immediately clear.
- pob_phrase: do not hinder them
  simplified_phrase: Do not stop them
  preserved_meaning: Jesus commands others not to prevent the children from approaching him.
  reasoning_layer_used: lexical decision for μὴ κωλύετε
  rationale: “Stop” is more familiar than “hinder” while retaining the command’s force.
- pob_phrase: the kingdom of God belongs to such as these
  simplified_phrase: God’s kingdom belongs to people like these children
  preserved_meaning: God’s kingdom belongs not only to these children but to the kind of people they represent.
  reasoning_layer_used: lexical and theological decisions for τῶν τοιούτων
  rationale: The wording clarifies the comparison without defining which qualities of children Jesus means.
interpretive_expansions:
- pob_phrase: such as these
  rendering: people like these children
  claim: The children represent a broader class of people to whom God’s kingdom belongs.
  evidence:
  - The plural expression τῶν τοιούτων naturally extends beyond the children present.
  - The POB theological decision explicitly preserves this representative scope.
  confidence: high
  alternatives_preserved:
  - The verse does not specify which childlike quality or status is in view.
  - The immediate children remain the basis of the comparison.
translation_notes:
  risk_flags:
  - risk: “People like these children” could be taken as identifying a particular childlike trait.
    mitigation: The text leaves the point of likeness undefined, as the POB reasoning requires.
