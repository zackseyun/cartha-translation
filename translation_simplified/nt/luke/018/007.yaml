translation:
  language: en
  text: Will God not give justice to his chosen people, who cry out to him day and night? Will he keep them waiting long?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “though he is patient with them” or “and is he patient with them?” The Greek can refer to patience rather than delay.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: bring justice for his chosen ones
  simplified_phrase: give justice to his chosen people
  preserved_meaning: God himself will grant his chosen people legal redress and vindication, not personal vengeance.
  reasoning_layer_used: Lexical decision for ἐκδίκησιν and ἐκλεκτῶν
  rationale: “Give justice” states God’s direct action plainly, while “chosen people” naturally identifies those he has chosen.
- pob_phrase: who cry out to him day and night
  simplified_phrase: who cry out to him day and night
  preserved_meaning: God’s chosen people are described as urgently and repeatedly appealing to him.
  reasoning_layer_used: Source syntax and lexical decisions for βοώντων and ἡμέρας καὶ νυκτός
  rationale: Keeping the descriptive clause avoids turning their appeal into a temporal condition.
- pob_phrase: Will he delay long over them?
  simplified_phrase: Will he keep them waiting long?
  preserved_meaning: The question asks whether God will postpone acting on their behalf.
  reasoning_layer_used: Lexical and theological decision for μακροθυμεῖ ἐπ’ αὐτοῖς
  rationale: The wording expresses the contextual delay sense naturally while the note retains the patience reading.
translation_notes:
  risk_flags:
  - risk: “Keep them waiting” emphasizes delay more directly than the ambiguous Greek phrase.
    mitigation: The footnote preserves both patience-oriented alternatives.
