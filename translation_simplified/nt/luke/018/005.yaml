translation:
  language: en
  text: But because this widow keeps troubling me, I will give her justice, so that she will not keep coming and wear me out.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek expression literally means “strike me under the eye,” but here it means “wear me out.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: yet because this widow keeps causing me trouble
  simplified_phrase: But because this widow keeps troubling me
  preserved_meaning: The widow’s repeated appeals are causing the judge trouble and motivate his decision.
  reasoning_layer_used: POB lexical decision for διά γε τὸ παρέχειν μοι κόπον
  rationale: The rewrite keeps the causal and ongoing force without predicting that she will never stop.
- pob_phrase: so that by continually coming she may not wear me out
  simplified_phrase: so that she will not keep coming and wear me out
  preserved_meaning: The judge acts to prevent her repeated visits from exhausting him.
  reasoning_layer_used: POB lexical decisions for εἰς τέλος, ἐρχομένη, and ὑπωπιάζῃ με
  rationale: The direct clause conveys repeated visits while avoiding an overly certain reading of εἰς τέλος as “endlessly.”
translation_notes:
  risk_flags:
  - risk: The main text does not separately render the possible force of εἰς τέλος as “endlessly” or “in the end.”
    mitigation: “Keep coming” preserves the clearly supported iterative sense without settling the phrase’s documented ambiguity.
