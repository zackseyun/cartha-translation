translation:
  language: en
  text: They did not understand any of these things. What Jesus was saying was hidden from them, and they did not know what he meant.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And they understood none of these things
  simplified_phrase: They did not understand any of these things.
  preserved_meaning: The disciples failed to grasp all of Jesus’s preceding statements.
  reasoning_layer_used: Lexical decision for συνῆκαν and οὐδὲν τούτων
  rationale: The negative form is more natural while keeping the complete lack of understanding.
- pob_phrase: this saying was hidden from them
  simplified_phrase: What Jesus was saying was hidden from them
  preserved_meaning: The content of Jesus’s statement remained concealed without naming who or what concealed it.
  reasoning_layer_used: Lexical and theological decisions for τὸ ῥῆμα τοῦτο and the unstated passive agent
  rationale: The smoother wording identifies the speaker but preserves the unexplained hiddenness.
- pob_phrase: they did not understand the things being said
  simplified_phrase: they did not know what he meant
  preserved_meaning: They did not recognize the meaning of Jesus’s words.
  reasoning_layer_used: Lexical decisions for ἐγίνωσκον and τὰ λεγόμενα
  rationale: Using “know” retains the distinction from the first verb while expressing the clause naturally.
interpretive_expansions:
- pob_phrase: this saying ... the things being said
  rendering: What Jesus was saying ... what he meant
  claim: Jesus is the speaker, and the disciples failed to recognize the meaning of his words.
  evidence:
  - The immediate context identifies Jesus as the one making the preceding predictions.
  - The lexical rationale says both clauses concern comprehension of Jesus’s statements.
  confidence: high
