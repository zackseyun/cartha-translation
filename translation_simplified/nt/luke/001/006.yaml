translation:
  language: en
  text: Both of them were righteous in God’s sight. They lived blamelessly,[a] obeying all the Lord’s commands and prescribed requirements.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “blamelessly” means living faithfully and without reproach, not being absolutely sinless.
    reason: simplification_note
simplification_decisions:
- pob_phrase: righteous before God
  simplified_phrase: righteous in God’s sight
  preserved_meaning: God, not merely other people, judged them to be righteous.
  reasoning_layer_used: POB lexical decision for ἐναντίον τοῦ θεοῦ
  rationale: The approved alternative makes the evaluative meaning immediately clear.
- pob_phrase: walking blamelessly
  simplified_phrase: lived blamelessly
  preserved_meaning: Their whole manner of life showed faithful and irreproachable conduct.
  reasoning_layer_used: POB lexical and theological decisions for πορευόμενοι and ἄμεμπτοι
  rationale: “Lived” communicates the ethical walking image in ordinary English without implying sinless perfection.
- pob_phrase: all the commandments and ordinances
  simplified_phrase: all the Lord’s commands and prescribed requirements
  preserved_meaning: They followed the full range of the Lord’s commands and enacted requirements.
  reasoning_layer_used: POB lexical decisions for ἐντολαῖς and δικαιώμασιν
  rationale: The wording replaces the opaque term “ordinances” while preserving the distinction between the two categories.
interpretive_expansions:
- pob_phrase: walking ... in all the commandments and ordinances of the Lord
  rendering: obeying all the Lord’s commands and prescribed requirements
  claim: Their manner of life consisted in obedience to the Lord’s instructions.
  evidence:
