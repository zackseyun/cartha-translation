translation:
  language: en
  text: The angel replied, “The Holy Spirit will come upon you, and the power of the Most High will overshadow you. For this reason, the child to be born will be holy and will be called the Son of God.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the angel answered and said to her
  simplified_phrase: The angel replied
  preserved_meaning: The angel responds directly to Mary.
  reasoning_layer_used: POB lexical decision for ἀποκριθεὶς
  rationale: “Replied” expresses the responsive force without the redundant English wording.
- pob_phrase: therefore also the holy one being born
  simplified_phrase: For this reason, the child to be born will be holy
  preserved_meaning: The divine action explains why the coming child is holy.
  reasoning_layer_used: POB lexical decisions for διὸ καὶ, τὸ γεννώμενον, and ἅγιον
  rationale: The revised clause makes the child and his holiness immediately clear while preserving the stated consequence.
- pob_phrase: will be called the Son of God
  simplified_phrase: will be called the Son of God
  preserved_meaning: The title identifies the child as the Son of God rather than merely one son among others.
  reasoning_layer_used: POB lexical and theological decisions for υἱὸς θεοῦ
  rationale: The established title remains unchanged because it carries essential christological meaning.
