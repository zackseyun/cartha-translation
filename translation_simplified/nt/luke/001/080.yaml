simplification_decisions:
- pob_phrase: kept growing and becoming strong in spirit
  simplified_phrase: continued to grow and become strong in spirit
  preserved_meaning: John’s growth and strengthening were ongoing, and the kind of strength remains spiritually defined but not narrowed to the Holy Spirit.
  reasoning_layer_used: lexical and theological decisions
  rationale: “Continued to” expresses the ongoing development in more natural English.
- pob_phrase: he was in the wilderness
  simplified_phrase: He lived in the wilderness regions
  preserved_meaning: John remained in desolate wilderness areas during this period.
  reasoning_layer_used: lexical decision and doctrine-realignment revision
  rationale: “Lived” makes the idiom clear, while “regions” preserves the Greek plural nuance.
- pob_phrase: until the day of his public appearance to Israel
  simplified_phrase: until the day he appeared publicly to Israel
  preserved_meaning: The period ended when John publicly emerged before Israel.
  reasoning_layer_used: lexical decisions
  rationale: The abstract noun phrase becomes a direct verbal clause without changing the event.
translation_notes:
