translation:
  language: en
  text: The child continued to grow and become strong in spirit.[a] He lived in the wilderness regions until the day he appeared publicly to Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “in the Spirit.” The wording may refer generally to inner spiritual strength or more specifically to strength through the Holy Spirit.
