translation:
  language: en
  text: Mary said, “Here I am, the Lord’s servant.[a] May what you have said happen to me.” And the angel left her.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the Lord’s slave.” The Greek term can mean a female slave or servant.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Behold, I am the Lord’s servant
  simplified_phrase: Here I am, the Lord’s servant
  preserved_meaning: Mary solemnly presents herself in humble submission to the Lord.
  reasoning_layer_used: Lexical and theological decisions for Ἰδοὺ and δούλη
  rationale: “Here I am” makes her marked self-presentation natural while retaining “servant” and its stronger alternative.
- pob_phrase: May it happen to me according to your word
  simplified_phrase: May what you have said happen to me
  preserved_meaning: Mary willingly accepts the angel’s spoken announcement.
  reasoning_layer_used: Lexical and theological decisions for γένοιτό μοι, κατὰ, and ῥῆμα
  rationale: The direct wording preserves the willing wish and identifies the “word” as the angel’s statement.
- pob_phrase: And the angel departed from her
  simplified_phrase: And the angel left her
  preserved_meaning: The angel went away after Mary’s response without adding temporal force to the connective.
  reasoning_layer_used: Lexical decisions for δὲ and ἀπῆλθεν ἀπ’ αὐτῆς
  rationale: “And” preserves the mild connective, while “left her” gives the same conclusion in ordinary English.
translation_notes:
  risk_flags:
  - risk: “Servant” may understate the bonded force of δούλη.
    mitigation: The footnote preserves “slave” as the stronger lexical alternative.
