simplification_decisions:
- pob_phrase: And the angel answered him
  simplified_phrase: The angel replied
  preserved_meaning: The angel responds directly to Zechariah.
  reasoning_layer_used: POB lexical decision for ἀποκριθεὶς
  rationale: “Replied” expresses the response naturally without an unnecessary pronoun.
- pob_phrase: I am Gabriel, who stands in the presence of God
  simplified_phrase: I am Gabriel. I stand in the presence of God.
  preserved_meaning: Gabriel identifies himself and states his continuing position before God.
  reasoning_layer_used: POB lexical decisions for Ἐγώ εἰμι Γαβριὴλ and ὁ παρεστηκὼς
  rationale: Two direct sentences make Gabriel’s identity and continuing status easier to grasp.
- pob_phrase: and I was sent to speak to you and to bring you this good news
  simplified_phrase: I was sent to speak to you and bring you this good news.
  preserved_meaning: Gabriel was commissioned to deliver a message that is good news.
