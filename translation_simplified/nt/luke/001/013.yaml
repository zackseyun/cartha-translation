translation:
  language: en
  text: But the angel said to him, “Do not be afraid, Zechariah, because your prayer has been heard. Your wife Elizabeth will give birth to a son for you, and you will name him John.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: will bear you a son
  simplified_phrase: will give birth to a son for you
  preserved_meaning: Elizabeth will bear a son, fulfilling a personal promise to Zechariah.
  reasoning_layer_used: POB lexical decision for γεννήσει and υἱόν σοι
  rationale: The clearer birth language retains both Elizabeth’s action and Zechariah’s relationship to the promised son.
- pob_phrase: you shall call his name John
  simplified_phrase: you will name him John
  preserved_meaning: Zechariah is directed to give the child the name John.
  reasoning_layer_used: POB lexical decision for καλέσεις τὸ ὄνομα αὐτοῦ Ἰωάννην
  rationale: The natural English naming expression preserves the command-like future without the opaque Greek idiom.
