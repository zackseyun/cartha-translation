  preserved_meaning: The child’s greatness, divine title, and God-given kingship remain distinct claims.
  reasoning_layer_used: POB translation and theological decisions
  rationale: Two sentences make the announcement easier to follow without weakening its titles or promises.
- pob_phrase: the throne of David his father
  simplified_phrase: the throne of his ancestor David
  preserved_meaning: Jesus receives David’s royal rule as a descendant in David’s line.
  reasoning_layer_used: POB lexical decision and cultural footnote
  rationale: “Ancestor” prevents readers from mistaking David for Jesus’ immediate father.
