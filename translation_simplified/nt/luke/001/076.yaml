translation:
  language: en
  text: And you too, child, will be called a prophet of the Most High, for you will go ahead of the Lord[a] to prepare his ways.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “go in the presence of the Lord.” The phrase can refer either to going ahead of someone or to serving in that person’s presence.
    reason: lexical_alternative
  - marker: b
    text: This echoes promises about preparing the Lord’s way (Isaiah 40:3; Malachi 3:1). Luke presents John’s ministry before Jesus as their fulfillment.
    reason: cross_reference
simplification_decisions:
- pob_phrase: And you also, child
  simplified_phrase: And you too, child
  preserved_meaning: The transition still emphasizes that the words now address the child directly.
  reasoning_layer_used: Lexical decision for καὶ σὺ δέ
  rationale: “You too” expresses the additive emphasis naturally in common English.
- pob_phrase: for you will go before the Lord
  simplified_phrase: for you will go ahead of the Lord
  preserved_meaning: John will serve as the Lord’s forerunner, and “for” retains the reason he will be called a prophet.
  reasoning_layer_used: Source γάρ, lexical decisions for προπορεύσῃ and ἐνώπιον κυρίου, and theological decision on κύριος
  rationale: “Go ahead” clarifies the forerunner role without narrowing who “the Lord” means.
translation_notes:
  risk_flags:
  - risk: “Go ahead of” may make the alternative sense of serving in the Lord’s presence less visible.
    mitigation: Footnote a preserves the documented lexical alternative.
  - risk: Readers may identify “the Lord” only with God or only with Jesus.
    mitigation: The title remains unresolved while footnote b supplies both the prophetic background and Luke’s fulfillment.
