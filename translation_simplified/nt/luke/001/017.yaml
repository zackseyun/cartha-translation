translation:
  language: en
  text: He will go ahead of him with the spirit and power of Elijah.[a] He will turn fathers’ hearts toward their children and turn disobedient people toward the wisdom of those who do what is right. He will make a people ready for the Lord.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This describes an Elijah-like prophetic ministry and empowerment. It does not itself say that Elijah will personally return.
    reason: cross_reference
simplification_decisions:
- pob_phrase: will go before him
  simplified_phrase: will go ahead of him
  preserved_meaning: He will precede the one whose coming he announces.
  reasoning_layer_used: Lexical decisions for προελεύσεται and ἐνώπιον αὐτοῦ
  rationale: “Go ahead of” states the mission naturally while leaving “him” unresolved as in the POB.
- pob_phrase: the hearts of fathers to children, and the disobedient to the wisdom of the righteous
  simplified_phrase: fathers’ hearts toward their children and turn disobedient people toward the wisdom of those who do what is right
  preserved_meaning: Fathers are turned toward their children, and disobedient people toward righteous moral understanding.
  reasoning_layer_used: Lexical decisions for καρδίας πατέρων ἐπὶ τέκνα and ἐν φρονήσει δικαίων
  rationale: The wording makes both directions of turning clear without merging them.
- pob_phrase: to prepare for the Lord a people made ready
  simplified_phrase: He will make a people ready for the Lord
  preserved_meaning: His mission prepares a people who are ready for the Lord.
  reasoning_layer_used: Lexical decisions for ἑτοιμάσαι and λαὸν κατεσκευασμένον
  rationale: A direct sentence preserves preparation and resulting readiness without implying a causal sequence.
interpretive_expansions:
- pob_phrase: in the spirit and power of Elijah
  rendering: This describes an Elijah-like prophetic ministry and empowerment. It does not itself say that Elijah will personally return.
  claim: The phrase describes prophetic likeness and empowerment associated with Elijah rather than identifying John as Elijah literally returned.
  evidence:
  - The Greek says he goes “in the spirit and power of Elijah.”
  - The POB reasoning identifies Elijah-like prophetic continuity and empowerment.
  - The wording echoes Malachi 4:6.
  confidence: high
  alternatives_preserved:
  - The phrase does not itself settle every question about Elijah’s personal return.
translation_notes:
