  text: His father and mother continued to be amazed at what was being said about him.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek says “his father,” referring to Joseph in the ordinary family and legal sense. Some translations say “Joseph and his mother” to avoid confusion with Luke’s earlier account of Jesus’ virgin conception.
