  simplified_phrase: when the festival days were over
  preserved_meaning: The required days of the festival had ended before the return journey began.
  reasoning_layer_used: lexical decision and immediate context
  rationale: This replaces an opaque Greek idiom with its clear contextual meaning.
- pob_phrase: as they were returning
  simplified_phrase: they started back
  preserved_meaning: Mary and Joseph were beginning their return journey when Jesus stayed behind.
  reasoning_layer_used: lexical decision
  rationale: This uses ordinary English while retaining the timing of the ongoing return.
- pob_phrase: Jesus the boy remained in Jerusalem, and his parents did not know it
  simplified_phrase: the boy Jesus stayed behind in Jerusalem, and his parents did not realize it
  preserved_meaning: Twelve-year-old Jesus remained behind without his parents becoming aware of it.
  reasoning_layer_used: lexical and theological decisions
  rationale: “Stayed behind” and “did not realize it” make the narrative situation immediately clear while preserving “his parents.”
