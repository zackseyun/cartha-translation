translation:
  language: en
  text: When the festival days were over, they started back. But the boy Jesus stayed behind in Jerusalem, and his parents did not realize it.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Luke calls Mary and Joseph “his parents” here, using ordinary family language; this does not deny the virgin conception described earlier in the Gospel.
    reason: cross_reference
