- pob_phrase: supposing him to be in the traveling group
  simplified_phrase: they assumed he was with the group they were traveling with
  preserved_meaning: Mary and Joseph believed, without knowing for certain, that Jesus was among their fellow travelers.
  reasoning_layer_used: Lexical decision for νομίσαντες and συνοδία
  rationale: The rewrite uses ordinary sentence structure while preserving both the assumption and the shared traveling company.
- pob_phrase: they went a day's journey
  simplified_phrase: After traveling for a whole day
  preserved_meaning: They traveled for the time or distance normally covered in one day.
  reasoning_layer_used: Lexical decision for ἦλθον ἡμέρας ὁδὸν
  rationale: This makes the time span immediately clear without changing the idiom's sense.
- pob_phrase: their relatives and acquaintances
  simplified_phrase: their relatives and other people they knew
  preserved_meaning: They searched among family members and known associates who were not necessarily close friends.
  reasoning_layer_used: Lexical decisions for συγγενεῦσιν and γνωστοῖς
  rationale: People they knew is more familiar than acquaintances while retaining its broad social meaning.
