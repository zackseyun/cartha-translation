translation:
  language: en
  text: When the angels had left them and gone into heaven, the shepherds said to one another, “Let’s go now to Bethlehem and see this event that has happened.[a] The Lord has made it known to us.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word translated “event” can also mean “word,” “matter,” or “thing.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And it happened that when the angels had gone away from them into heaven
  simplified_phrase: When the angels had left them and gone into heaven
  preserved_meaning: The angels’ departure into heaven happened before the shepherds spoke.
  reasoning_layer_used: POB lexical decisions for ἐγένετο, ὡς, and ἀπῆλθον
  rationale: The narrative formula is omitted because English can express the same sequence directly.
- pob_phrase: see this thing that has happened
  simplified_phrase: see this event that has happened
  preserved_meaning: The shepherds intend to witness the reported occurrence.
  reasoning_layer_used: POB lexical decision for τὸ ῥῆμα τοῦτο τὸ γεγονός
  rationale: “Event” is clearer than “thing” here while the footnote preserves the word’s broader range.
- pob_phrase: which the Lord has made known to us
  simplified_phrase: The Lord has made it known to us
  preserved_meaning: The Lord is the one who informed the shepherds about the event.
  reasoning_layer_used: POB lexical and theological decisions for ἐγνώρισεν and κύριος
  rationale: A separate sentence removes a difficult relative clause without narrowing who “the Lord” refers to.
