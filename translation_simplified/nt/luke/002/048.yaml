simplification_decisions:
- pob_phrase: And when they saw him, they were astonished, and his mother said to him
  simplified_phrase: They were astonished when they saw him. His mother asked him
  preserved_meaning: They react with strong surprise, and Mary then addresses Jesus.
  reasoning_layer_used: POB lexical decisions for ἰδόντες and ἐξεπλάγησαν
  rationale: Two shorter sentences clarify the sequence, and “asked” naturally introduces her question.
- pob_phrase: why have you done this to us?
  simplified_phrase: why have you treated us this way?
  preserved_meaning: Mary complains about how Jesus’ action affected her and Joseph.
  reasoning_layer_used: POB lexical decision for τί ἐποίησας ἡμῖν οὕτως
  rationale: The approved idiomatic alternative makes the relational complaint immediately clear.
- pob_phrase: your father and I have been anxiously looking for you
  simplified_phrase: your father and I have been anxiously searching for you
  preserved_meaning: Mary and Joseph had continued looking for Jesus with emotional distress.
  reasoning_layer_used: POB lexical decisions for ὁ πατήρ σου, ὀδυνώμενοι, and ἐζητοῦμέν σε; POB theological decision
  rationale: “Searching” is more precise in context while “anxiously” retains the distress and “your father” preserves the narrative tension.
translation_notes:
  risk_flags:
  - risk: “Asked” is more specific than the source verb “said.”
    mitigation: The direct speech is a question, so the wording clarifies the speech act without changing it.
  - risk: “Your father” could be read as resolving Jesus’ sonship only in human terms.
    mitigation: The unqualified wording is retained because the POB requires the next verse to preserve and clarify the tension.
