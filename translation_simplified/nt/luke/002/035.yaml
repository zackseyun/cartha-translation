translation:
  language: en
  text: A sword will also pass through your own soul,[a][b] so that the thoughts within many hearts may be revealed.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “will pierce.” The Greek more literally says “will pass through,” while the sword image implies piercing.
    reason: lexical_alternative
  - marker: b
    text: The sword is a picture of the deep anguish Mary would experience.
    reason: cultural_note
simplification_decisions:
- pob_phrase: and a sword will pass through your own soul also
  simplified_phrase: A sword will also pass through your own soul
  preserved_meaning: Mary herself will experience profound suffering pictured as a sword passing through her soul.
  reasoning_layer_used: Lexical decisions for σοῦ ... αὐτῆς, ψυχή, διελεύσεται, and ῥομφαία.
  rationale: Moving “also” earlier gives natural English while preserving the emphatic address and sword image.
- pob_phrase: the thoughts of many hearts
  simplified_phrase: the thoughts within many hearts
  preserved_meaning: People’s inward thoughts will be disclosed from their hearts.
  reasoning_layer_used: Lexical decisions for ἐκ πολλῶν καρδιῶν and διαλογισμοί.
  rationale: “Within” makes the heart’s role as the inner source of thought immediately clear.
interpretive_expansions:
- pob_phrase: the thoughts of many hearts
  rendering: the thoughts within many hearts
  claim: The thoughts are inward thoughts arising from people’s hearts.
