translation:
  language: en
  text: Just then, she came up. She began thanking God and kept telling everyone who was waiting for Jerusalem’s redemption about him.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Him” most naturally refers to the child Jesus, though it could refer to God in the Greek wording.
