translation:
  language: en
  text: He went into the temple in the Spirit.[a] When the parents[b] brought the child Jesus in, they did so to carry out for him what the law customarily required.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “by the Spirit.” The Greek can mean either; “in the Spirit” preserves Luke’s wording and emphasis on the Holy Spirit.
    reason: lexical_alternative
  - marker: b
    text: Greek “the parents.” Luke uses ordinary family language for Mary and Joseph as they care for Jesus.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: And he came in the Spirit into the temple
  simplified_phrase: He went into the temple in the Spirit
  preserved_meaning: He entered the temple in connection with the Holy Spirit’s activity.
  reasoning_layer_used: Lexical and theological decisions on ἐν τῷ πνεύματι and ἱερόν
  rationale: Natural word order makes the movement clear while retaining “in the Spirit.”
- pob_phrase: when the parents brought in the child Jesus
  simplified_phrase: When the parents brought the child Jesus in
  preserved_meaning: Mary and Joseph brought Jesus into the temple.
  reasoning_layer_used: Lexical decisions on γονεῖς, ἐν τῷ εἰσαγαγεῖν, and παιδίον Ἰησοῦν
  rationale: Ordinary English clause order preserves the time relationship and family language.
- pob_phrase: to do for him according to the custom of the law
  simplified_phrase: they did so to carry out for him what the law customarily required
  preserved_meaning: The parents brought Jesus in to fulfill the customary legal requirement concerning him.
  reasoning_layer_used: Lexical decisions on τοῦ ποιῆσαι αὐτούς, κατὰ τὸ εἰθισμένον τοῦ νόμου, and περὶ αὐτοῦ
  rationale: The explicit subject and verb make the legal purpose understandable on first reading.
translation_notes:
  risk_flags:
  - risk: “In the Spirit” may sound like Simeon’s personal mood.
    mitigation: Capitalization and footnote [a] preserve the contextual reference to the Holy Spirit.
  - risk: “The parents” could be mistaken for a claim about biological paternity.
    mitigation: Footnote [b] identifies Luke’s ordinary social description of Mary and Joseph.
