translation:
  language: en
  text: She remained a widow until she was eighty-four years old.[a] She was constantly at the temple grounds, worshiping night and day with fasting and prayer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “She had been a widow for eighty-four years.” The Greek can refer either to Anna’s age or to how long she had been a widow.
    reason: alternative_reading
