translation:
  language: en
  text: In those days, Caesar Augustus issued a decree requiring everyone throughout the inhabited world to be registered.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may also be translated “the whole Roman world” or “the whole empire.” Here “inhabited world” is viewed within the Roman imperial setting.
