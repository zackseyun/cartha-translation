simplification_decisions:
- pob_phrase: It happened in those days that
  simplified_phrase: In those days
  preserved_meaning: The sentence introduces an event occurring during that period.
  reasoning_layer_used: Lexical decision and applied discourse-marker revision
  rationale: The shorter time phrase keeps the narrative setting without the heavy introductory formula.
- pob_phrase: a decree went out from Caesar Augustus
  simplified_phrase: Caesar Augustus issued a decree
  preserved_meaning: The imperial order originated with Caesar Augustus and was publicly enacted.
  reasoning_layer_used: Lexical decisions for ἐξῆλθεν, δόγμα, and παρά
  rationale: An active English clause makes the official action immediately clear while preserving its source and authority.
- pob_phrase: should be registered
  simplified_phrase: requiring everyone ... to be registered
  preserved_meaning: The decree ordered universal official registration within the stated realm.
  reasoning_layer_used: Lexical decisions for ἀπογράφεσθαι and πᾶσαν
  rationale: “Requiring” states the force of the decree in natural modern English without specifying taxation or a census.
interpretive_expansions:
