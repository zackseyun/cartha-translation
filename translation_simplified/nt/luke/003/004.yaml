translation:
  language: en
  text: 'This is what is written in the book of Isaiah the prophet: “A voice cries out in the wilderness:[b] ‘Prepare the way for the Lord;[a] make straight paths for him.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “the LORD.” The quotation echoes Isaiah 40:3, where the Hebrew uses the divine name YHWH.
    reason: alternative_reading
  - marker: b
    text: 'This may also be read, “A voice cries out: ‘In the wilderness prepare the way for the Lord.’”'
    reason: alternative_reading
