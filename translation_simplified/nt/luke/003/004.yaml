  reasoning_layer_used: Lexical decisions for γέγραπται, βίβλῳ λόγων, and Ἠσαΐου τοῦ προφήτου
  rationale: The wording removes an unnatural phrase while retaining the written source and its prophetic author.
- pob_phrase: A voice of one crying in the wilderness
  simplified_phrase: A voice cries out in the wilderness
  preserved_meaning: An unidentified person is loudly calling in the wilderness.
  reasoning_layer_used: Lexical decisions for Φωνὴ βοῶντος and ἐν τῇ ἐρήμῳ
  rationale: The clause becomes ordinary English without changing the voice, action, or setting.
- pob_phrase: the way of the Lord; make his paths straight
