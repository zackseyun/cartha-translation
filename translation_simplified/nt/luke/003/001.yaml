  text: In the fifteenth year of Tiberius Caesar’s reign, Pontius Pilate was governing Judea. At that time, Herod was tetrarch of Galilee, Philip his brother was tetrarch of the region of Iturea and Trachonitis, and Lysanias was tetrarch of Abilene.[a]
