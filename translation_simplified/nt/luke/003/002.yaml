simplification_decisions:
- pob_phrase: the word of God came to John
  simplified_phrase: God’s message came to John
  preserved_meaning: God revealed a prophetic message to John.
  reasoning_layer_used: POB lexical decision for ἐγένετο ῥῆμα θεοῦ
  rationale: “God’s message” makes the prophetic idiom immediately understandable while retaining the image of its coming to John.
- pob_phrase: during the high priesthood of Annas and Caiaphas
  simplified_phrase: During the high priesthood of Annas and Caiaphas
  preserved_meaning: Luke places the event in the period associated with both men while referring to the office in the singular.
  reasoning_layer_used: POB theological decision on singular ἀρχιερέως
  rationale: This wording remains because simplifying it to two high priests would erase Luke’s deliberate tension.
