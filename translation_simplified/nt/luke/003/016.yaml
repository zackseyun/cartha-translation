translation:
  language: en
  text: John answered everyone, “I baptize you with water. But someone stronger than I am is coming. I am not worthy to untie his sandal strap. He will baptize you in the Holy Spirit and fire.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “with the Holy Spirit and fire.” The Greek wording may refer to means, sphere, or element.
    reason: lexical_alternative
  - marker: b
    text: “Fire” may refer to purification, judgment, or both; the verse does not settle the question.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: John answered them all, saying
  simplified_phrase: John answered everyone
  preserved_meaning: John responded to the whole crowd.
  reasoning_layer_used: POB lexical decision for ἀπεκρίνατο λέγων πᾶσιν
  rationale: The common English verb “answered” already introduces his spoken response.
- pob_phrase: I indeed baptize you with water, but one stronger than I is coming
  simplified_phrase: I baptize you with water. But someone stronger than I am is coming.
  preserved_meaning: John contrasts his water baptism with the work of the coming, stronger one.
  reasoning_layer_used: POB lexical decisions for μέν, ὕδατι, ἰσχυρότερος, and ἔρχεται
  rationale: Two sentences make the contrast clear without the formal word “indeed.”
- pob_phrase: whose sandal strap I am not worthy to untie
  simplified_phrase: I am not worthy to untie his sandal strap
  preserved_meaning: John expresses his unworthiness to perform even a lowly service for the coming one.
  reasoning_layer_used: POB lexical decisions for ἱκανός and the sandal-strap image
  rationale: A direct sentence removes the difficult relative clause while preserving the concrete image.
translation_notes:
  risk_flags:
  - risk: Readers may assume that “fire” has only one settled meaning.
    mitigation: Footnote b preserves the POB’s documented interpretive tension.
  - risk: The preposition “in” may sound more specific in English than the Greek warrants.
    mitigation: Footnote a preserves “with” and the broader range of possible nuances.
