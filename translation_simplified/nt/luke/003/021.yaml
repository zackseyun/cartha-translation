simplification_decisions:
- pob_phrase: It happened that when all the people were baptized
  simplified_phrase: When all the people were being baptized
  preserved_meaning: The people’s baptism sets the scene without requiring a strict sequence.
  reasoning_layer_used: Lexical decisions for Ἐγένετο and ἐν τῷ βαπτισθῆναι
  rationale: The narrative formula is omitted, and the ongoing wording avoids implying that every baptism had finished.
- pob_phrase: and Jesus also had been baptized and was praying
  simplified_phrase: Jesus was baptized too. While he was praying
  preserved_meaning: Jesus also received baptism, and heaven opened during his prayer.
  reasoning_layer_used: Lexical decisions for the two genitive participles
  rationale: Two short clauses clearly distinguish his completed baptism from his ongoing prayer.
- pob_phrase: heaven was opened
  simplified_phrase: heaven was opened
  preserved_meaning: The heavenly realm opened without adding the stronger image of tearing.
  reasoning_layer_used: Lexical and theological decisions for ἀνεῳχθῆναι and οὐρανός
  rationale: The source-driven wording preserves the scene’s revelatory force.
translation_notes:
  risk_flags:
  - risk: “Were being baptized” may suggest ongoing individual baptisms more explicitly than the Greek requires.
    mitigation: It preserves the broad temporal setting and avoids asserting that Jesus was baptized only after everyone else.
