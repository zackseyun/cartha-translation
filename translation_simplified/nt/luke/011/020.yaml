  preserved_meaning: God’s kingdom has decisively arrived among the hearers in Jesus’ ministry.
  reasoning_layer_used: POB lexical and theological decisions for ἔφθασεν ἐφ’ ὑμᾶς
  rationale: “Has reached you” preserves present arrival without the obscurity of “come upon you.”
