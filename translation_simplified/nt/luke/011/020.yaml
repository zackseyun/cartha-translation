simplification_decisions:
- pob_phrase: cast out the demons
  simplified_phrase: drive out demons
  preserved_meaning: Jesus expels demons.
  reasoning_layer_used: POB lexical decision for ἐκβάλλω and τὰ δαιμόνια
  rationale: “Drive out” is a documented alternative that is immediately clear to modern readers.
- pob_phrase: has come upon you
