translation:
  language: en
  text: from the shedding of Abel’s blood to the shedding of Zechariah’s blood.[a] Zechariah died between the altar and the temple building.[b] Yes, I tell you, this generation will be held accountable for all this bloodshed.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The identity of this Zechariah is debated. Possibilities include Zechariah son of Jehoiada (2 Chronicles 24:20–22) and Zechariah son of Berechiah.
    reason: cross_reference
  - marker: b
    text: Greek literally says “the house,” meaning the temple building in this context.
    reason: lexical_alternative
