translation:
  language: en
  text: Woe to you, experts in the Law![a] You took away the key to knowledge. You yourselves did not enter,[b] and you stood in the way of those who were entering.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: These were specialists in the Jewish law, not modern civil attorneys.
    reason: cultural_note
  - marker: b
    text: The verse does not specify whether they failed to enter God’s kingdom or failed to enter into true knowledge of God.
    reason: simplification_note
simplification_decisions:
- pob_phrase: lawyers
  simplified_phrase: experts in the Law
  preserved_meaning: They were specialists in the Jewish law rather than modern civil attorneys.
  reasoning_layer_used: POB lexical decision for νομικοῖς
  rationale: The lexical alternative prevents the usual modern misunderstanding of “lawyers.”
- pob_phrase: the key of knowledge
  simplified_phrase: the key to knowledge
  preserved_meaning: Knowledge remains pictured as accessible by means of a key.
  reasoning_layer_used: POB lexical decision for κλεῖδα τῆς γνώσεως
  rationale: The approved alternative preserves the metaphor in more natural English.
- pob_phrase: hindered those who were entering
  simplified_phrase: stood in the way of those who were entering
  preserved_meaning: They obstructed people who were in the process of entering without necessarily stopping them all.
  reasoning_layer_used: POB lexical decision for ἐκωλύσατε and τοὺς εἰσερχομένους
  rationale: The concrete idiom is clearer while retaining both obstruction and ongoing entry.
translation_notes:
  risk_flags:
  - risk: Readers may assume that the unstated destination is certainly God’s kingdom or certainly knowledge of God.
    mitigation: Footnote b preserves both documented possibilities without deciding between them.
