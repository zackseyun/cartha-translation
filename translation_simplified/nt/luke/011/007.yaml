simplification_decisions:
- pob_phrase: and he from inside answers and says
  simplified_phrase: Then he answers from inside
  preserved_meaning: He responds from within the house while the other person remains outside.
  reasoning_layer_used: POB lexical decisions for κἀκεῖνος, ἔσωθεν, and ἀποκριθεὶς εἴπῃ
  rationale: The natural narrative wording removes a redundant speech formula while preserving the reply and its location.
- pob_phrase: Do not trouble me
  simplified_phrase: Don’t bother me
  preserved_meaning: He tells the visitor to stop causing him inconvenience.
  reasoning_layer_used: POB lexical decision for Μή μοι κόπους πάρεχε
  rationale: The approved lexical alternative is clearer in everyday English without becoming casual.
- pob_phrase: my children are with me in bed. I am not able to get up
  simplified_phrase: my children and I are in bed. I can’t get up
  preserved_meaning: The whole household shares a sleeping place, making rising difficult.
  reasoning_layer_used: POB lexical decisions for κοίτη and οὐ δύναμαι ἀναστὰς
  rationale: Recasting the clauses avoids an unintended sexual sense and states the practical obstacle naturally.
translation_notes:
