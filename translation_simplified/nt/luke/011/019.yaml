translation:
  language: en
  text: But if I drive out the demons by Beelzebul, by whom[a] do your sons[b] drive them out? So they will be your judges.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “by what” or “by what power.”
    reason: lexical_alternative
  - marker: b
    text: “Your sons” may refer to your followers, disciples, or fellow Jews; the Greek wording does not settle this.
    reason: lexical_alternative
