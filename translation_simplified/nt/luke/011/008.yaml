  preserved_meaning: Their friendship alone may not move the man to act.
  reasoning_layer_used: POB lexical decision for διὰ τὸ εἶναι φίλον αὐτοῦ
  rationale: The plural wording removes confusing pronouns while keeping the personal relationship.
- pob_phrase: yet because of
  simplified_phrase: he will still get up because of
  preserved_meaning: The friend’s persistence succeeds where friendship alone does not.
  reasoning_layer_used: POB lexical decision for διά γε
  rationale: “Still” makes the emphatic contrast natural in modern English.
