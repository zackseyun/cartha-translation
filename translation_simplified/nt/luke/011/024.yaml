translation:
  language: en
  text: When the unclean spirit has left the man, it travels through places where there is no water, looking for rest. When it finds none, it says, “I will return to my house, which I came out of.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: has gone out from the man
  simplified_phrase: has left the man
  preserved_meaning: The spirit departs from the representative man before deciding to return.
  reasoning_layer_used: Lexical decision for ἐξέλθῃ and theological decision on ἀνθρώπου
  rationale: “Has left” states the departure naturally while retaining POB’s masculine singular reference.
- pob_phrase: passes through waterless places seeking rest
  simplified_phrase: travels through places where there is no water, looking for rest
  preserved_meaning: The spirit moves through waterless places in search of rest.
  reasoning_layer_used: Lexical decisions for διέρχεται, δι’ ἀνύδρων τόπων, and ζητοῦν ἀνάπαυσιν
  rationale: The concrete waterless image is unpacked in ordinary English rather than flattened to “dry.”
- pob_phrase: and not finding any, it says
  simplified_phrase: When it finds none, it says
  preserved_meaning: After failing to find rest, the spirit announces its resolve to return.
  reasoning_layer_used: Lexical decisions for καὶ μὴ εὑρίσκον and λέγει
  rationale: A new sentence clarifies the sequence while preserving the vivid present tense.
translation_notes:
  risk_flags:
  - risk: “The man” may sound like a previously identified individual rather than a representative case.
    mitigation: It is retained because POB’s decision preserves the grammatically masculine singular wording.
