translation:
  language: en
  text: But Jesus replied,[a] “Rather, those who hear God’s word and live by it are blessed.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also mean “Yes, rather,” affirming the woman’s words while redirecting their emphasis.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: But he said
  simplified_phrase: But Jesus replied
  preserved_meaning: Jesus responds to the woman with a mild contrast.
  reasoning_layer_used: Lexical decision for αὐτὸς δὲ εἶπεν and immediate context
  rationale: Naming Jesus and saying “replied” makes the exchange clear without strengthening the contrast.
- pob_phrase: Rather, blessed are those
  simplified_phrase: Rather, those … are blessed
  preserved_meaning: Jesus redirects attention to the deeper basis of blessedness without denying the previous blessing.
  reasoning_layer_used: Lexical and theological decisions for Μενοῦν
  rationale: Keeping “Rather” in the main text preserves the response’s corrective yet non-rejecting force.
- pob_phrase: keep it
  simplified_phrase: live by it
  preserved_meaning: They continually put God’s word into obedient practice.
  reasoning_layer_used: Lexical decision for φυλάσσοντες
  rationale: “Live by it” states the practical sense more clearly than the potentially vague “keep it.”
interpretive_expansions:
- pob_phrase: keep it
  rendering: live by it
  claim: Keeping God’s word includes putting it into practice as a way of life.
  evidence:
  - The lexical rationale says φυλάσσω here refers to preserving and practicing God’s word.
  - The present participles portray hearing and keeping as characteristic responses.
  confidence: high
  alternatives_preserved:
  - keep it
  - obey it
  - observe it
translation_notes:
  risk_flags:
  - risk: “Rather” could be heard as flatly rejecting the woman’s statement.
    mitigation: The footnote preserves the particle’s possible affirming force.
