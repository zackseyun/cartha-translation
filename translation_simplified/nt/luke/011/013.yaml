translation:
  language: en
  text: Even though you are evil, you know how to give good gifts to your children. How much more, then, will the Father from heaven[a] give the Holy Spirit[b] to those who ask him?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some English versions say “your heavenly Father,” following the similar wording in Matthew 7:11, but Luke’s Greek says “the Father from heaven.”
    reason: alternative_reading
  - marker: b
    text: Matthew 7:11 says “good things,” but Luke specifically says “the Holy Spirit.”
    reason: cross_reference
simplification_decisions:
- pob_phrase: If you, then, being evil, know how to give good gifts to your children
  simplified_phrase: Even though you are evil, you know how to give good gifts to your children.
  preserved_meaning: Jesus describes evil people as still knowing how to give their children good gifts.
  reasoning_layer_used: Lexical decision for πονηροὶ ὑπάρχοντες
  rationale: “Even though” makes the concessive force clear and replaces the awkward participial structure.
- pob_phrase: how much more will the Father from heaven give
  simplified_phrase: How much more, then, will the Father from heaven give
  preserved_meaning: The Father’s willingness to give is far greater than that of human parents.
  reasoning_layer_used: Lexical decisions for πόσῳ μᾶλλον and ὁ πατὴρ ὁ ἐξ οὐρανοῦ
  rationale: A new sentence clarifies the lesser-to-greater comparison while preserving Luke’s distinct title.
translation_notes:
  risk_flags:
  - risk: “The Father from heaven” may sound less familiar than “your heavenly Father.”
    mitigation: The wording preserves Luke’s Greek, and footnote [a] explains the familiar alternative.
  - risk: Readers may expect “good things” from Matthew’s parallel.
    mitigation: Footnote [b] highlights Luke’s specific emphasis on the Holy Spirit.
