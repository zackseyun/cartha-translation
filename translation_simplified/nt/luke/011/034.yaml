translation:
  language: en
  text: Your eye is like a lamp for your body.[a] When your eye is healthy, light fills your whole body. But when your eye is bad,[b] your body is dark.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Healthy” can also mean clear, sound, or undivided; traditionally, “single.”
    reason: lexical_alternative
  - marker: b
    text: Or “evil.” The word may point both to faulty sight and to morally distorted perception.
    reason: lexical_alternative
