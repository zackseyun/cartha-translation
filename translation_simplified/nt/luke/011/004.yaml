translation:
  language: en
  text: And forgive us our sins, because we too forgive everyone who owes us.[a] Do not bring us into temptation.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek uses debt language here, while the first request says “sins.”
    reason: source_note
  - marker: b
    text: Or “testing” or “trial.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: for we ourselves also forgive
  simplified_phrase: because we too forgive
  preserved_meaning: Our own forgiving of others is given as the ground for this request, with emphasis that we also forgive.
  reasoning_layer_used: Lexical decisions for καὶ γὰρ and αὐτοὶ
  rationale: “Because we too” expresses the connection and emphasis in more natural English.
- pob_phrase: everyone indebted to us
  simplified_phrase: everyone who owes us
  preserved_meaning: The clause keeps the Greek image of a person owing a debt.
  reasoning_layer_used: Lexical decision for παντὶ ὀφείλοντι ἡμῖν
  rationale: The verbal phrase is easier to understand than the abstract adjective “indebted.”
- pob_phrase: And do not bring us into temptation
  simplified_phrase: Do not bring us into temptation
  preserved_meaning: The petition retains both the wording and unresolved theological tension of the POB.
  reasoning_layer_used: Theological decision on πειρασμός
  rationale: Removing the opening conjunction makes the short petition flow naturally without changing its force.
translation_notes:
  risk_flags:
  - risk: “Who owes us” may sound purely financial.
    mitigation: The footnote identifies the deliberate debt language while the parallel request about sins guides its interpersonal sense.
  - risk: “Temptation” does not display the full range of πειρασμός.
    mitigation: The footnote preserves “testing” and “trial” without resolving the petition’s theological tension.
