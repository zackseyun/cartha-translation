translation:
  language: en
  text: So if your whole body is full of light, with no part of it dark, then it will all be full of light, just as when a lamp shines brightly on you.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: If, then, your whole body is full of light, having no dark part
  simplified_phrase: So if your whole body is full of light, with no part of it dark
  preserved_meaning: The condition still includes the whole body and excludes every dark part.
  reasoning_layer_used: POB lexical decisions for ὅλον and μὴ ἔχον μέρος τι σκοτεινόν
  rationale: The participial phrase becomes a direct prepositional phrase in natural English.
- pob_phrase: it will be wholly full of light
  simplified_phrase: then it will all be full of light
  preserved_meaning: The repeated emphasis on complete illumination remains.
  reasoning_layer_used: POB lexical decision for the repeated ὅλον and φωτεινόν
  rationale: The wording avoids the awkward combination “wholly full” while retaining totality.
- pob_phrase: as when a lamp lights you with its brightness
  simplified_phrase: just as when a lamp shines brightly on you
  preserved_meaning: A lamp personally illuminates the hearer by its shining.
  reasoning_layer_used: POB lexical decisions for λύχνος, τῇ ἀστραπῇ, and φωτίζῃ σε
  rationale: The clause is recast in ordinary English without suggesting literal lightning.
translation_notes:
  risk_flags:
  - risk: Modern readers may try to identify the body and light with a specific doctrine.
    mitigation: The draft retains Jesus’ concrete imagery without explaining it as the soul or moral state.
  - risk: “Shines brightly” may understate the possible flash sense of ἀστραπή.
    mitigation: The wording follows the POB judgment that the lamp’s brightness, not literal lightning, is intended here.
