simplification_decisions:
- pob_phrase: Fools!
  simplified_phrase: You fools!
  preserved_meaning: Jesus directly and sharply rebukes his hearers.
  reasoning_layer_used: Lexical decision for ἄφρονες as a plural direct address.
  rationale: Adding “you” makes the direct address immediately natural in modern English.
- pob_phrase: Did not the one who made the outside also make the inside?
  simplified_phrase: Didn’t the one who made the outside make the inside too?
  preserved_meaning: The rhetorical question expects agreement that the maker made both aspects.
  reasoning_layer_used: Lexical decisions for οὐχ, ποιήσας, ἔξωθεν, ἔσωθεν, and καί.
  rationale: The contraction and final “too” express the same argument in ordinary spoken English.
translation_notes:
  risk_flags:
  - risk: Readers may take “outside” and “inside” only as parts of a physical object.
    mitigation: The footnote preserves the wider reference to outward and inward human life.
  - risk: Readers may assume “the one who made” explicitly names God or only a vessel-maker.
    mitigation: The general wording preserves both the immediate image and the implied Creator reference.
