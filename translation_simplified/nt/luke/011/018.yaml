simplification_decisions:
- pob_phrase: Satan also is divided against himself
  simplified_phrase: Satan is working against himself
  preserved_meaning: Satan is pictured as acting in internal opposition to his own cause.
  reasoning_layer_used: Lexical decision for ἐφ’ ἑαυτὸν with διεμερίσθη
  rationale: The wording states the self-opposition in ordinary English without changing the argument.
- pob_phrase: how will his kingdom stand?
  simplified_phrase: how can his kingdom remain standing?
  preserved_meaning: A divided kingdom cannot continue or endure.
  reasoning_layer_used: Lexical decisions for πῶς σταθήσεται and βασιλεία
  rationale: “Remain standing” makes the metaphor’s sense of continued survival clear.
- pob_phrase: For you say that I cast out the demons by Beelzebul
  simplified_phrase: After all, you claim that I drive out demons by Beelzebul
  preserved_meaning: Jesus grounds his argument in his opponents’ accusation of demonic agency.
  reasoning_layer_used: Lexical and theological decisions for ὅτι, ἐκβάλλειν, and ἐν Βεελζεβοὺλ
  rationale: The revision uses natural speech while leaving the accusation unexplained and unresolved.
translation_notes:
  risk_flags:
  - risk: “Working against himself” is less visibly tied to the image of division.
    mitigation: The phrase still expresses internal opposition, and the divided-kingdom image remains in the second clause.
