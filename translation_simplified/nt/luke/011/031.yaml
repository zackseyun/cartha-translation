translation:
  language: en
  text: At the judgment, the queen of the South[a] will rise alongside the men of this generation and condemn them, because she came from the farthest reaches of the earth to hear Solomon’s wisdom. And see—something greater than Solomon is here.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This queen is commonly identified as the Queen of Sheba (see 1 Kings 10:1–13; 2 Chronicles 9:1–12).
    reason: cross_reference
  - marker: b
    text: Or “one greater than Solomon.” The Greek literally says “something greater,” which may point to more than a direct comparison between two people.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: in the judgment with the men
  simplified_phrase: At the judgment ... alongside the men
  preserved_meaning: The queen appears together with these men at the definite future judgment.
  reasoning_layer_used: Lexical decisions for ἐν τῇ κρίσει and μετὰ τῶν ἀνδρῶν
  rationale: Ordinary word order clarifies the judicial scene while retaining the specifically masculine noun.
- pob_phrase: from the ends of the earth
  simplified_phrase: from the farthest reaches of the earth
  preserved_meaning: She came from an extremely distant place.
  reasoning_layer_used: Lexical decision for ἐκ τῶν περάτων τῆς γῆς
  rationale: The wording clarifies the distance idiom while preserving its global image.
- pob_phrase: and behold, something greater than Solomon is here
  simplified_phrase: And see—something greater than Solomon is here
  preserved_meaning: Jesus calls attention to a present reality greater than Solomon without limiting it to a personal comparison.
  reasoning_layer_used: Lexical and theological decisions for ἰδού and πλεῖον Σολομῶνος
  rationale: “See” is natural, while “something” preserves the Greek neuter and its theological tension.
translation_notes:
  risk_flags:
  - risk: Modern readers may understand “will rise” as an explicit reference to resurrection.
    mitigation: “Will rise alongside” retains the judicial and eschatological resonance without choosing only one sense.
  - risk: “Something greater” may sound less directly personal than expected.
    mitigation: The main text preserves the Greek neuter, and footnote b gives the personal alternative.
