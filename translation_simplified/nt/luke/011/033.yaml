translation:
  language: en
  text: No one lights a lamp and then hides it or covers it with a basket.[a] Instead, they put it on a lampstand so that people coming in may see the light.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The basket was a container used for measuring dry goods, traditionally called a “bushel” or “bushel basket.”
    reason: cultural_note
simplification_decisions:
- pob_phrase: after lighting a lamp, puts it in a hidden place
  simplified_phrase: lights a lamp and then hides it
  preserved_meaning: The lamp is lit first and then deliberately concealed.
  reasoning_layer_used: Lexical decisions for ἅψας and εἰς κρύπτην
  rationale: The active sequence is easier to follow while retaining the emphasis on concealment.
- pob_phrase: or under a basket
  simplified_phrase: or covers it with a basket
  preserved_meaning: A measuring container blocks the lamp’s light.
  reasoning_layer_used: Lexical and theological decision for μόδιος
  rationale: The wording makes the covering action clear without using the unfamiliar term “bushel.”
- pob_phrase: but on a lampstand, so that those who enter may see the light
  simplified_phrase: Instead, they put it on a lampstand so that people coming in may see the light
  preserved_meaning: The lamp is placed where entrants can see its light.
  reasoning_layer_used: Lexical decisions for λυχνία, εἰσπορευόμενοι, and ἵνα
  rationale: A new sentence and familiar phrasing clarify the contrast and purpose.
translation_notes:
  risk_flags:
  - risk: “Hides it” compresses the concrete phrase “puts it in a hidden place.”
    mitigation: It preserves the audited emphasis on concealment without specifying a cellar or storeroom.
