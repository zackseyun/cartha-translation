translation:
  language: en
  text: After he left that place, the scribes and Pharisees began to put intense pressure on him and to draw him into speaking[a] about many things.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The rare Greek verb may also mean “to question him closely” or “to make him answer without preparation.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: after he left there
  simplified_phrase: after he left that place
  preserved_meaning: He departed from the location before their hostile actions began.
  reasoning_layer_used: POB lexical decisions for Κἀκεῖθεν and ἐξελθόντος αὐτοῦ
  rationale: “That place” makes the spatial reference clearer in modern English.
- pob_phrase: to press him hard
  simplified_phrase: to put intense pressure on him
  preserved_meaning: The scribes and Pharisees acted toward him with aggressive insistence.
  reasoning_layer_used: POB lexical decisions for δεινῶς and ἐνέχειν
  rationale: The expanded phrase makes their hostile pressure immediately understandable.
- pob_phrase: to provoke him to speak about many things
  simplified_phrase: to draw him into speaking about many things
  preserved_meaning: They aggressively elicited statements from him on a wide range of subjects.
  reasoning_layer_used: POB lexical decisions for ἀποστοματίζειν and περὶ πλειόνων
  rationale: “Draw him into speaking” conveys hostile elicitation without claiming a precise method.
