- pob_phrase: And he said to them
  simplified_phrase: He said to them
  preserved_meaning: Jesus gives his disciples instructions for prayer.
  reasoning_layer_used: source syntax and POB narrative wording
  rationale: Dropping the opening “And” makes the sentence natural without changing its connection to the context.
- pob_phrase: hallowed be your name
  simplified_phrase: may your name be kept holy
  preserved_meaning: This asks that God’s name be regarded and treated as holy.
  reasoning_layer_used: POB lexical and theological decisions for ἁγιασθήτω
  rationale: “Kept holy” replaces the archaic “hallowed” while preserving the passive petition.
- pob_phrase: Your kingdom come
