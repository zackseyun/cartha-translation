simplification_decisions:
- pob_phrase: For this reason also
  simplified_phrase: That is why ... also
  preserved_meaning: The statement explains and adds to the preceding indictment.
  reasoning_layer_used: Lexical decisions for διὰ τοῦτο and καὶ
  rationale: This wording expresses the same causal and additive force in ordinary English.
- pob_phrase: I will send to them prophets and apostles
  simplified_phrase: I will send them prophets and apostles
  preserved_meaning: God will send prophets and apostles to the people in view.
  reasoning_layer_used: Lexical decisions for Ἀποστελῶ, εἰς αὐτούς, προφήτας, and ἀποστόλους
  rationale: Dropping the unnecessary preposition makes the sentence natural while retaining “apostles” as a recognized title.
- pob_phrase: some of them they will kill and persecute
  simplified_phrase: they will kill and persecute some of them
  preserved_meaning: Both hostile actions are directed toward members of the group God sends, without distinguishing separate subsets.
  reasoning_layer_used: Source syntax and lexical decisions for ἐξ αὐτῶν, ἀποκτενοῦσιν, and διώξουσιν
  rationale: Placing the single partitive phrase after both verbs gives clear English without creating separate groups.
