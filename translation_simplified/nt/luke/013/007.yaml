translation:
  language: en
  text: Then he said to the worker who cared for the vineyard, “Look, for three years I have been coming to look for fruit on this fig tree, but I have not found any. Cut it down. Why should it keep using up the soil?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Why should it also make the soil useless?” The Greek can mean that the tree is making the soil unproductive, not merely taking up space.
    reason: lexical_alternative
