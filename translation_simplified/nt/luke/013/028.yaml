simplification_decisions:
- pob_phrase: There will be weeping and gnashing of teeth there
  simplified_phrase: In that place, you will weep and grind your teeth
  preserved_meaning: The hearers will express anguish in the place of exclusion.
  reasoning_layer_used: Lexical decisions for ἐκεῖ, κλαυθμός, and βρυγμὸς τῶν ὀδόντων
  rationale: The active wording is clearer while preserving the concrete images of weeping and grinding teeth.
- pob_phrase: Abraham and Isaac and Jacob and all the prophets
  simplified_phrase: Abraham, Isaac, Jacob, and all the prophets
  preserved_meaning: The three patriarchs and the whole company of prophets remain named and distinct.
  reasoning_layer_used: Lexical decision for πάντας τοὺς προφήτας
  rationale: A natural English list removes repeated conjunctions without weakening “all.”
- pob_phrase: but you yourselves thrown out
  simplified_phrase: but you yourselves will be thrown outside
  preserved_meaning: The hearers are sharply contrasted with those inside and are forcibly excluded.
  reasoning_layer_used: Lexical decisions for ὑμᾶς δέ, ἐκβαλλομένους, and ἔξω
  rationale: The complete clause retains the contrast, emphatic pronoun, forceful expulsion, and location outside.
translation_notes:
