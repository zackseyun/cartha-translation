simplification_decisions:
- pob_phrase: Then you will begin to say, ‘We ate and drank in your presence, and you taught in our streets.’
  simplified_phrase: Then you will begin to say, “We ate and drank in your presence, and you taught in our streets.”
  preserved_meaning: The speakers appeal to prior proximity and public exposure to Jesus without implying that he accepted them.
