translation:
  language: en
  text: It is like leaven[a] that a woman hid in a large amount of flour[b] until the whole batch was leavened.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Leaven is a fermenting agent, like yeast, that makes dough rise.
    reason: simplification_note
  - marker: b
    text: Greek “three sata,” an ancient measure indicating a large quantity of flour.
    reason: cultural_note
simplification_decisions:
- pob_phrase: three measures of flour
  simplified_phrase: a large amount of flour
  preserved_meaning: The woman used a notably large quantity of flour.
  reasoning_layer_used: POB cultural note and lexical rationale
  rationale: The unfamiliar ancient measure is expressed by its practical sense for modern readers.
- pob_phrase: it was all leavened
  simplified_phrase: the whole batch was leavened
  preserved_meaning: The leaven affected the entire flour mixture.
  reasoning_layer_used: POB lexical rationale for ἐζυμώθη ὅλον
  rationale: Naming the whole batch makes the pronoun’s meaning immediately clear.
- pob_phrase: which a woman took and hid
  simplified_phrase: that a woman hid
  preserved_meaning: The woman placed the leaven within the flour so that it was concealed there.
  reasoning_layer_used: POB lexical decisions for λαβοῦσα and ἔκρυψεν
  rationale: The routine act of taking is compressed while the source-language image of hiding is retained.
translation_notes:
  risk_flags:
  - risk: Replacing “three measures” in the main text removes the exact ancient quantity.
    mitigation: The footnote retains “three sata” and explains that it was a large quantity.
  - risk: Some readers may not know the term “leaven.”
    mitigation: The footnote defines it without replacing the biblical image with modern commercial yeast.
