translation:
  language: en
  text: Or consider the eighteen people who were killed when the tower in Siloam fell on them. Do you think they became more indebted to God than all the people living in Jerusalem?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek literally says “debtors,” using a debt image for moral guilt; it may also be understood as “sinners” or “worse offenders.”
    reason: lexical_alternative
