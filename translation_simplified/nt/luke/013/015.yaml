- pob_phrase: answered him and said
  simplified_phrase: replied to him
  preserved_meaning: The Lord directly responds to the man.
  reasoning_layer_used: source syntax and POB narrative wording
  rationale: The shorter speech formula is natural English and keeps the response explicit.
- pob_phrase: each of you
  simplified_phrase: you each
  preserved_meaning: Jesus appeals to what every individual hearer does.
  reasoning_layer_used: POB lexical decision for ἕκαστος ὑμῶν
  rationale: The recast preserves the distributive force in a more conversational sentence.
- pob_phrase: lead it away to water it
  simplified_phrase: lead it away to give it water
  preserved_meaning: The animal is taken from the trough so it can drink.
  reasoning_layer_used: POB lexical decision for ποτίζει
  rationale: “Give it water” is immediately clear to readers unfamiliar with “water” as a verb.
