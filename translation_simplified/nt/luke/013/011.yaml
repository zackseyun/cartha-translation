translation:
  language: en
  text: Look! A woman was there who had a spirit of weakness[a] for eighteen years. She was bent over and could not straighten up fully.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a disabling spirit” or “a spirit of infirmity.” The wording mentions a spirit but does not specify the exact nature of its role in her condition.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And behold, there was a woman
  simplified_phrase: Look! A woman was there
  preserved_meaning: The narrator vividly draws attention to a woman in the scene.
  reasoning_layer_used: The lexical decision for ἰδοὺ favors the modern attention-getter “look.”
  rationale: A brief exclamation replaces the archaic “behold” and opens the scene naturally.
- pob_phrase: and she was bent over and unable to straighten up completely
  simplified_phrase: She was bent over and could not straighten up fully.
  preserved_meaning: Her condition kept her bent over and prevented a fully upright posture.
  reasoning_layer_used: The lexical decisions for συγκύπτουσα, ἀνακύψαι, and εἰς τὸ παντελές preserve posture, inability, and completeness.
  rationale: Splitting the long sentence makes her physical condition easier to grasp.
translation_notes:
