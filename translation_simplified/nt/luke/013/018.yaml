simplification_decisions:
- pob_phrase: he was saying
  simplified_phrase: he continued
  preserved_meaning: His words continue the preceding discourse rather than begin an unrelated statement.
  reasoning_layer_used: The lexical decisions for Ἔλεγεν and οὖν preserve ongoing speech and discourse continuation.
  rationale: “He continued” conveys the narrative flow naturally in common English.
- pob_phrase: to what shall I compare it?
  simplified_phrase: What should I compare it to?
  preserved_meaning: Jesus asks what comparison he should use, not whether he is able to compare it.
  reasoning_layer_used: The lexical decision for τίνι ὁμοιώσω αὐτήν identifies its deliberative rhetorical force.
  rationale: “Should I” preserves the deliberative sense without the dated “shall I.”
- pob_phrase: What is the kingdom of God like, and to what shall I compare it?
  simplified_phrase: What is the kingdom of God like? What should I compare it to?
  preserved_meaning: Both parallel questions about comparison remain distinct.
  reasoning_layer_used: The source syntax and lexical decisions treat the clauses as two coordinated questions.
  rationale: Two sentences make the parallel questions easier to follow.
translation_notes:
  risk_flags:
  - risk: “He continued” compresses the imperfect verb and connective into one expression.
