translation:
  language: en
  text: 'Look—your house[a] is being abandoned and left to you.[b] And I tell you this: you certainly will not see me until the time comes when you say,[c] “Blessed is the one who comes in the name of the Lord.”[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Your house” likely means Jerusalem, especially its temple, but the Greek says simply “your house.”
    reason: alternative_reading
  - marker: b
    text: The wording may also be translated “is forsaken” and can suggest being given over to judgment.
    reason: lexical_alternative
  - marker: c
    text: This may point to Jesus’ triumphal entry or to a future acknowledgment of him; the Greek does not settle the timing.
    reason: alternative_reading
  - marker: d
    text: This blessing echoes Psalm 118:26.
    reason: cross_reference
simplification_decisions:
- pob_phrase: Look, your house is left to you.
  simplified_phrase: Look—your house is being abandoned and left to you.
  preserved_meaning: Jesus solemnly announces that their house is being left to them with the force of abandonment.
  reasoning_layer_used: Lexical decision and footnote for ἰδοὺ and ἀφίεται
  rationale: “Abandoned” prevents “left to you” from sounding like ordinary possession while preserving the original image.
- pob_phrase: And I tell you
  simplified_phrase: 'And I tell you this:'
  preserved_meaning: Jesus directly introduces the consequence of his announcement.
  reasoning_layer_used: Lexical decision for λέγω δὲ ὑμῖν
  rationale: “This” and the colon make the transition easier to follow.
- pob_phrase: you will certainly not see me until the time comes when you say
  simplified_phrase: you certainly will not see me until the time comes when you say
  preserved_meaning: The emphatic future exclusion continues until the stated acknowledgment.
  reasoning_layer_used: Lexical decisions for οὐ μὴ ἴδητέ με and ἕως ἥξει ὅτε
  rationale: The natural word order retains the strong negation without settling the event’s timing.
interpretive_expansions:
- pob_phrase: your house is left to you
  rendering: your house is being abandoned and left to you
  claim: The act of leaving carries the contextual force of abandonment rather than simple possession.
  evidence:
  - The POB lists “is abandoned” as a lexical alternative for ἀφίεται.
  - The POB notes that the passive can carry a judicial sense of being given over.
  - Jesus’ lament over Jerusalem supplies a judgment context.
  confidence: high
  alternatives_preserved:
  - is forsaken
  - is left to you
