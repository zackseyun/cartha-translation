- pob_phrase: the synagogue ruler answered, indignant because Jesus had healed on the Sabbath, and said to the crowd
  simplified_phrase: the leader of the synagogue was indignant because Jesus had healed on the Sabbath. He said to the crowd
  preserved_meaning: The synagogue official responds with strong moral displeasure at Jesus’ Sabbath healing.
  reasoning_layer_used: POB lexical decisions for ἀρχισυνάγωγος, ἀγανακτῶν, and δέ
  rationale: Two sentences replace the dense participial structure while preserving the contrast, role, and indignation.
- pob_phrase: There are six days in which it is necessary to work
  simplified_phrase: There are six days when work should be done
  preserved_meaning: The ruler claims that work properly belongs on the other six days.
  reasoning_layer_used: POB footnote and theological decision on the ruler’s rule-bound objection
  rationale: The approved idiomatic alternative expresses obligation clearly without endorsing the ruler’s claim.
- pob_phrase: so come on those days and be healed, and not on the day of the Sabbath
  simplified_phrase: Come on those days to be healed, not on the Sabbath
  preserved_meaning: He directs people to seek healing on the other days rather than on the Sabbath.
  reasoning_layer_used: POB lexical decisions for ἐρχόμενοι, θεραπεύεσθε, and the final Sabbath contrast
  rationale: The shorter command keeps both the call to come for healing and the pointed prohibition.
