translation:
  language: en
  text: Once the master of the house gets up and shuts the door, you will begin to stand outside and knock on the door, saying, “Lord,[a] open the door for us!” But he will answer, “I do not know you or where you are from.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “Lord” may also mean “Master” or “Sir.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: has risen and shut the door
  simplified_phrase: gets up and shuts the door
  preserved_meaning: The master rises from his place and decisively closes the door.
  reasoning_layer_used: Lexical decisions for ἐγερθῇ and ἀποκλείσῃ
  rationale: Common verbs clarify the sequence without suggesting resurrection.
- pob_phrase: you begin to stand outside and knock on the door
  simplified_phrase: you will begin to stand outside and knock on the door
  preserved_meaning: The hearers begin both actions outside the closed door.
  reasoning_layer_used: Lexical decisions for ἄρξησθε, ἔξω ἑστάναι, and κρούειν τὴν θύραν
  rationale: The future wording reads naturally while preserving the paired actions.
- pob_phrase: I do not know you, where you are from
  simplified_phrase: I do not know you or where you are from
  preserved_meaning: The reply retains both the denial of knowing them and the clause about their origin.
  reasoning_layer_used: Theological decision on οὐκ οἶδα ὑμᾶς πόθεν ἐστέ
  rationale: The conjunction gives both Greek elements a natural English relationship without resolving the underlying idiom.
