translation:
  language: en
  text: Make every effort to enter through the narrow door[a], because many, I tell you, will seek to enter and will not be able to.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “narrow gate.” The Greek word in Luke means “door,” while Matthew’s parallel uses “gate.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Strive to enter
  simplified_phrase: Make every effort to enter
  preserved_meaning: The command still calls for earnest exertion rather than a casual attempt.
  reasoning_layer_used: The lexical decision lists “Make every effort” as a dynamic alternative for Ἀγωνίζεσθε.
  rationale: This common phrase clearly preserves the command’s seriousness.
- pob_phrase: because many, I tell you, will seek to enter and will not be able
  simplified_phrase: because many, I tell you, will seek to enter and will not be able to
  preserved_meaning: The failed seeking remains the stated reason for the command.
  reasoning_layer_used: The lexical decisions identify ὅτι as causal and preserve “seek” as distinct from earnest effort.
  rationale: Keeping “because” preserves the verse’s explicit cause-and-reason connection.
translation_notes:
  risk_flags:
  - risk: “Make every effort” could be read as teaching that salvation is earned.
    mitigation: No explanation about merit is added, so the verse’s theological tension remains.
  - risk: Readers may treat “seek” as identical to making every effort.
    mitigation: Distinct wording preserves the source’s contrast between earnest effort and seeking.
