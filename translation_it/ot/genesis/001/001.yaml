  yaml_path: translation/ot/genesis/001/001.yaml
  text: In the beginning, when God created the heavens and the earth[a]—
translation:
  language: it
  text: Quando Dio creò i cieli e la terra[a]—
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 'Tradizionalmente reso come frase compiuta: «In principio Dio creò i cieli e la terra». L’ebraico (בְּרֵאשִׁית senza articolo + il verbo finito בָּרָא) si legge più naturalmente come una proposizione temporale dipendente, in parallelo con Genesi 2:4b. La proposizione principale giunge al versetto 3: «Dio disse: “Sia la luce”».'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּרֵאשִׁית
  choice: In principio, quando … creò
  rationale: La forma senza articolo בְּרֵאשִׁית, seguita dal verbo finito בָּרָא, si presta naturalmente a una proposizione temporale dipendente. La formulazione conserva inoltre la forza lessicale e tradizionale di רֵאשִׁית.
- source_word: בָּרָא
  choice: creò
  rationale: «Creare» è l'equivalente italiano diretto e consolidato del verbo usato per l'azione creatrice divina, senza precisarne indebitamente il procedimento.
- source_word: אֱלֹהִים
  choice: Dio
  rationale: Benché la forma sia morfologicamente plurale, qui regge il verbo al singolare בָּרָא e indica Dio come referente singolare.
- source_word: אֵת
  choice: '[non tradotto; marca dell''oggetto diretto]'
  rationale: La particella ebraica segnala gli oggetti diretti determinati e non possiede un equivalente lessicale in italiano.
- source_word: הַשָּׁמַיִם
  choice: i cieli
  rationale: Il plurale italiano rispecchia la forma ebraica e, nell'espressione «i cieli e la terra», contribuisce a indicare la totalità dell'ordine creato.
- source_word: הָאָרֶץ
  choice: la terra
  rationale: Nel merismo cosmico formato con «i cieli», אָרֶץ indica la terra, non una regione o un paese.
theological_decisions:
- issue: Sintassi della proposizione iniziale
  choice: 'Proposizione temporale dipendente: «In principio, quando Dio creò i cieli e la terra—»'
  alternative: 'Proposizione principale indipendente: «In principio Dio creò i cieli e la terra.»'
  rationale: L'assenza dell'articolo in בְּרֵאשִׁית, il verbo finito immediatamente successivo e i paralleli di Genesi 2:4b e Osea 1:2 favoriscono la lettura temporale dipendente. La variante tradizionale resta segnalata in nota, senza far dipendere una dottrina teologica dalla sola soluzione sintattica.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. «In principio» mantiene la solennità e il riconoscibile richiamo al titolo ebraico; il trattino lungo segnala che la costruzione prosegue oltre il versetto.
