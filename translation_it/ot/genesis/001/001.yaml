review_pass:
  verdict: revise
  source_fidelity: 'Il versetto rende con precisione gli elementi lessicali del WLC: בְּרֵאשִׁית («In principio»), בָּרָא («creò»), אֱלֹהִים («Dio»), הַשָּׁמַיִם («i cieli») e הָאָרֶץ («la terra»). La resa come protasi temporale è possibile e ben segnalata come lettura discussa; tuttavia, «In principio, quando...» introduce una doppia marcatura temporale che in italiano risulta ridondante e attenua la nettezza sintattica della costruzione dipendente.'
  naturalness: «Quando Dio creò i cieli e la terra—» è una protasi italiana naturale e completa nella sua funzione sospensiva, senza la ridondanza di «In principio, quando». Conserva inoltre il registro biblico sobrio e moderno. La nota va corretta in «Sia la luce», formulazione italiana idiomatica.
  terminology: «Dio», «creò», «i cieli» e «la terra» sono appropriati. Il plurale «i cieli» riflette bene שָׁמַיִם. Il trattino lungo è funzionale alla continuazione della frase. L'ancora resta adeguatamente collocata dopo «terra».
  issues:
  - severity: medium
    issue: Ridondanza temporale nella protasi
    rationale: La combinazione «In principio, quando Dio creò...» è un calco dell'inglese ma in italiano moderno somma due introduttori temporali. Se si adotta la lettura dipendente, «Quando Dio creò...» esprime con maggiore naturalezza la protasi ebraica senza presentare «in principio» come un sintagma autonomo.
  - severity: low
    issue: Citazione di Genesi 1:3 nella nota
    rationale: «Sia luce» è possibile in stile ellittico, ma «Sia la luce» è la formulazione standard e più naturale in italiano contemporaneo.
  revised_text: Quando Dio creò i cieli e la terra[a]—
  revised_footnotes: *id001
  revision_rationale: Per una resa italiana idiomatica della lettura temporale dipendente, si elimina la doppia introduzione temporale «In principio, quando» e si mantiene «Quando Dio creò...». La lettura tradizionale indipendente, che conserva esplicitamente «In principio», resta documentata nella nota. Si migliora inoltre la citazione esplicativa di Genesi 1:3.
