  text: הֲבֵ֤ל הֲבָלִים֙ אָמַ֣ר קֹהֶ֔לֶת הֲבֵ֥ל הֲבָלִ֖ים הַ/כֹּ֥ל הָֽבֶל׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/002.yaml
  text: Breath of breaths[a], says Qoheleth[b]; breath of breaths, all is mere breath.
translation:
  language: it
  text: '«Soffio dei soffi[a]», dice Qoèlet[b], «soffio dei soffi: tutto è soltanto un soffio».'
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: L'ebraico הֶבֶל (hèvel) significa letteralmente «soffio» o «vapore». Nel libro ricorre 38 volte e può evocare contemporaneamente ciò che è fugace, come un respiro già svanito; inafferrabile, perché non si può trattenere; e una dissonanza ironica, perché ciò che accade non corrisponde a ciò che ci si aspettava. Nessuna singola parola italiana comprende pienamente questi aspetti. Qui si conserva l'immagine concreta. La formula «soffio dei soffi» è un superlativo ebraico, come «Cantico dei cantici» o «Santo dei santi». La resa tradizionale «vanità delle vanità» oggi può suggerire soprattutto orgoglio o compiacimento; «insensatezza» importerebbe invece un nichilismo che l'argomentazione di Qoèlet non afferma.
    reason: Migliora l'idiomaticità e il parallelismo della spiegazione semantica, senza modificare l'ancoraggio lessicale o le alternative indicate.
lexical_decisions:
- source_word: הֶבֶל / הֲבֵל
  choice: soffio
  rationale: Il termine indica concretamente un soffio o un vapore e, come metafora dominante del libro, può evocare insieme ciò che è fugace, inafferrabile e sconcertante. «Soffio» conserva l'immagine concreta senza restringerla a «futilità», «insensatezza» o «vanità».
- source_word: הֲבֵל הֲבָלִים
  choice: soffio dei soffi
  rationale: La costruzione con il nome seguito dal suo plurale esprime un superlativo assoluto, sul modello di «Cantico dei cantici». La resa mantiene sia la forma ebraica sia l'immagine concreta.
- source_word: אָמַר
  choice: dice
  rationale: Benché la forma ebraica sia un perfetto, nella cornice letteraria la formula introduce una dichiarazione autorevole e in italiano corrente risulta naturale al presente.
- source_word: קֹהֶלֶת
  choice: Qoèlet
  rationale: La traslitterazione italiana tradizionale conserva il titolo o nome ebraico senza limitarne il senso a «maestro», «predicatore» o «assembleante».
- source_word: הַכֹּל
  choice: tutto
  rationale: Rende in modo idiomatico e comprensivo la portata totalizzante dell'espressione ebraica.
- source_word: הָבֶל
  choice: soltanto un soffio
  rationale: Nel predicato finale, «soltanto» comunica il valore riduttivo e disilluso percepibile nel contesto, evitando che «tutto è soffio» suoni come una mera definizione della sostanza delle cose. L'articolo rende naturale la frase italiana.
theological_decisions:
- issue: Resa del motivo dominante הֶבֶל
  choice: Conservare l'immagine concreta con «soffio dei soffi» e «soltanto un soffio».
  alternative: «Vanità delle vanità», «assoluta futilità», «tutto è insensato» o «assurdità».
  rationale: Le rese astratte selezionano una sola dimensione del termine e rischiano di imporre una conclusione nichilista o esclusivamente morale. L'immagine del soffio lascia emergere dal contesto la compresenza di fugacità, inafferrabilità e scarto ironico tra aspettative ed esiti.
- issue: Identità e funzione di קֹהֶלֶת
  choice: Traslitterare «Qoèlet».
  alternative: «Il Maestro», «il Predicatore» o «l'Assembleante».
  rationale: Il valore preciso della designazione ebraica resta discusso; la traslitterazione preserva l'apertura del testo invece di scegliere una funzione specifica.
translation_notes:
  register: Italiano standard moderno, solenne ma accessibile. La ripetizione e la struttura «X dei X» sono mantenute per riprodurre la forza poetica e superlativa dell'ebraico. Le virgolette mettono in evidenza l'enunciato attribuito a Qoèlet senza alterarne il contenuto.
