  text: Ἀρὰμ δὲ ἐγέννησεν τὸν Ἀμιναδάβ, Ἀμιναδὰβ δὲ ἐγέννησεν τὸν Ναασσών, Ναασσὼν δὲ ἐγέννησεν τὸν Σαλμών,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/004.yaml
  text: Aram fathered Amminadab[a], and Amminadab fathered Nahshon, and Nahshon fathered Salmon.
translation:
  language: it
  text: Aram generò Aminadab[a]; Aminadab generò Naasson; Naasson generò Salmon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «Ram». Il testo greco ha «Aram» (Ἀράμ), mentre nell’Antico Testamento ebraico questo antenato è chiamato «Ram».
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀρὰμ
  choice: Aram
  rationale: Traslittera direttamente la forma greca del nome; la forma veterotestamentaria «Ram» è segnalata in nota.
- source_word: δὲ
  choice: punto e virgola, senza resa lessicale esplicita
  rationale: Nella sequenza genealogica δέ ha funzione connettiva e progressiva, non avversativa; in italiano la ripetizione è resa con una punteggiatura naturale.
- source_word: ἐγέννησεν
  choice: generò
  rationale: Nel contesto genealogico indica la generazione o discendenza paterna. «Generò» è conciso, dignitoso e tradizionale, senza essere oscuro nell'italiano moderno.
- source_word: Ἀμιναδάβ
  choice: Amminadab
  rationale: Forma italiana biblica riconoscibile e vicina alla traslitterazione greca.
- source_word: Ναασσών
  choice: Naasson
  rationale: Segue direttamente la forma greca e la convenzione italiana più diffusa per questo nome nel Nuovo Testamento.
- source_word: Σαλμών
  choice: Salmon
  rationale: Traslitterazione italiana convenzionale e riconoscibile della forma greca.
