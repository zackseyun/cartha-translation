id: MAT.1.18
reference: Matthew 1:18
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Τοῦ δὲ ⸀Ἰησοῦ χριστοῦ ἡ ⸀γένεσις οὕτως ἦν. ⸀μνηστευθείσης τῆς μητρὸς αὐτοῦ Μαρίας τῷ Ἰωσήφ, πρὶν ἢ συνελθεῖν αὐτοὺς εὑρέθη ἐν γαστρὶ ἔχουσα ἐκ πνεύματος ἁγίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/018.yaml
  text: 'The birth of Jesus the Messiah happened in this way: when his mother Mary had been betrothed to Joseph[a], before they came together[c][b], she was found to be pregnant from the Holy Spirit.'
translation:
  language: it
  text: 'La nascita[a] di Gesù, il Messia[b], avvenne così: sua madre Maria era stata promessa in sposa a Giuseppe[c] e, prima che si unissero[d], fu trovata incinta per opera dello Spirito Santo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il termine greco può anche essere reso «origine».
    reason: lexical_alternative
  - marker: b
    text: O «Gesù Cristo»; qui «Messia» traduce il significato del titolo greco Χριστός.
    reason: alternative_reading
  - marker: c
    text: La promessa di matrimonio era un impegno formale e giuridicamente riconosciuto, più vincolante del fidanzamento moderno.
    reason: cultural_note
  - marker: d
    text: L'espressione può alludere anche al fatto che non avevano ancora consumato il matrimonio.
    reason: lexical_alternative
lexical_decisions:
- source_word: γένεσις
  choice: nascita
  rationale: Nel contesto introduce il racconto della venuta al mondo di Gesù. «Nascita» è naturale in italiano, pur lasciando in nota la possibile sfumatura più ampia di «origine».
- source_word: Ἰησοῦ χριστοῦ
  choice: Gesù, il Messia
  rationale: Χριστός qui ha valore di titolo; «il Messia» ne comunica il significato, mentre le virgole rendono naturale l'apposizione italiana.
- source_word: οὕτως ἦν
  choice: avvenne così
  rationale: L'espressione introduce il modo in cui si svolse l'evento; questa resa è corrente e dignitosa.
- source_word: μνηστευθείσης
  choice: era stata promessa in sposa
  rationale: Indica un fidanzamento matrimoniale formalmente vincolante; la forma italiana evita il significato più debole del moderno «fidanzata».
- source_word: πρὶν ἢ συνελθεῖν αὐτούς
  choice: prima che si unissero
  rationale: Conserva il discreto e non del tutto esplicito idioma greco, che nel contesto può riferirsi anche alla consumazione del matrimonio.
- source_word: εὑρέθη
  choice: fu trovata
  rationale: Mantiene la forma passiva del greco senza specificare chi constatò la gravidanza.
- source_word: ἐν γαστρὶ ἔχουσα
  choice: incinta
  rationale: È l'equivalente italiano moderno e naturale dell'idioma greco «avere nel grembo».
- source_word: ἐκ πνεύματος ἁγίου
  choice: per opera dello Spirito Santo
  rationale: Esprime in italiano naturale l'origine divina della gravidanza indicata da ἐκ; il referente è lo Spirito Santo.
theological_decisions:
- issue: Valore di Χριστός
  choice: il Messia
  alternative: Cristo
  rationale: Nel contesto introduttivo il termine funziona chiaramente come titolo. Tradurne il significato evita che sia percepito soltanto come parte del nome.
- issue: Referente di πνεύματος ἁγίου
  choice: lo Spirito Santo
  alternative: spirito santo
  rationale: Nel racconto matteano la locuzione designa lo Spirito Santo divino; l'assenza dell'articolo greco non impone una lettura indefinita.
- issue: Portata di συνελθεῖν
  choice: si unissero
  alternative: avessero rapporti coniugali
  rationale: La resa conserva l'ambiguità e la discrezione dell'idioma greco, senza escludere l'implicazione della consumazione matrimoniale.
translation_notes:
  register: Italiano standard moderno, chiaro e dignitoso. La sintassi segue da vicino la progressione del greco, ma evita formulazioni innaturali; le note preservano le principali alternative lessicali e culturali.
