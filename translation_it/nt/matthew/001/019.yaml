source:
  edition: SBLGNT
  text: Ἰωσὴφ δὲ ὁ ἀνὴρ αὐτῆς, δίκαιος ὢν καὶ μὴ θέλων αὐτὴν ⸀δειγματίσαι, ἐβουλήθη λάθρᾳ ἀπολῦσαι αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/019.yaml
  text: And Joseph[a], her husband, being a righteous man and not wanting to expose her to public disgrace[c][b], intended to divorce her quietly.
translation:
  language: it
  text: Giuseppe, suo marito[a], poiché era giusto e non voleva esporla al disonore pubblico[b], decise di ripudiarla in segreto[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «suo promesso sposo». Il greco dice letteralmente «suo uomo/marito» e riflette il valore giuridicamente vincolante del fidanzamento ebraico.
    reason: lexical_alternative
  - marker: b
    text: O «farne un esempio» o «esporla pubblicamente alla vergogna».
    reason: lexical_alternative
  - marker: c
    text: O «mandarla via in privato». Nel contesto si tratta dello scioglimento formale del fidanzamento.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ αὐτῆς
  choice: suo marito
  rationale: Nel contesto ἀνήρ indica il marito; benché Maria e Giuseppe fossero ancora nella fase del fidanzamento, il vincolo aveva valore giuridico e richiedeva un ripudio formale per essere sciolto.
- source_word: δίκαιος
  choice: giusto
  rationale: «Giusto» conserva la risonanza morale e teologica di δίκαιος senza precisare se qui prevalgano l'osservanza della Legge, la misericordia o entrambe.
- source_word: δειγματίσαι
  choice: esporla al disonore pubblico
  rationale: Il verbo esprime l'idea di esporre qualcuno e, nel contesto, di sottoporlo pubblicamente alla vergogna; la resa esplicita entrambe le componenti.
- source_word: ἐβουλήθη
  choice: decise
  rationale: Il verbo indica una volontà ponderata o una decisione maturata, non un impulso momentaneo.
- source_word: λάθρᾳ
  choice: in segreto
  rationale: L'avverbio indica che l'azione sarebbe stata compiuta senza pubblicità; «in segreto» ne conserva direttamente il senso.
- source_word: ἀπολῦσαι
  choice: ripudiarla
  rationale: Nel contesto del fidanzamento ebraico legalmente vincolante, ἀπολύω indica lo scioglimento formale del rapporto. «Ripudiare» comunica la dimensione giuridico-matrimoniale, pur mantenendo il colore biblico.
- source_word: δὲ
  choice: omesso come connettivo esplicito
  rationale: Il δέ è un lieve connettivo narrativo; in italiano il passaggio risulta naturale senza introdurre necessariamente «ma» o «ora».
- source_word: ὢν καὶ μὴ θέλων
  choice: poiché era ... e non voleva
  rationale: La proposizione causale rende in italiano naturale il valore circostanziale dei participi, lasciando unite la giustizia di Giuseppe e la sua riluttanza a esporre Maria.
theological_decisions:
- issue: Caratterizzazione di Giuseppe come δίκαιος
  choice: «giusto», senza definire ulteriormente in che cosa consista qui la sua giustizia
  alternative: «retto», oppure una parafrasi che attribuisca esplicitamente la decisione alla misericordia o alla stretta osservanza della Legge
  rationale: Il greco accosta la giustizia di Giuseppe alla sua volontà di non esporre Maria al disonore. La traduzione conserva la tensione fra rettitudine legale e compassione senza scegliere una sola interpretazione.
- issue: Status giuridico di Giuseppe e Maria
  choice: «marito» e «ripudiarla» nel testo principale
  alternative: «promesso sposo» e «sciogliere il fidanzamento», oppure le rese più letterali «suo uomo» e «mandarla via»
  rationale: La terminologia greca e il contesto giudaico indicano un fidanzamento giuridicamente vincolante, per il cui scioglimento occorreva un atto formale. La resa scelta comunica tale forza legale senza negare che la convivenza matrimoniale non fosse ancora iniziata.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. «Ripudiare» è meno colloquiale di «divorziare», ma nel contesto biblico rende con precisione lo scioglimento formale di un'unione legalmente vincolante. I richiami di nota sono collocati immediatamente dopo le espressioni cui si riferiscono.
