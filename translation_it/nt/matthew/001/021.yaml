id: MAT.1.21
reference: Matthew 1:21
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: τέξεται δὲ υἱὸν καὶ καλέσεις τὸ ὄνομα αὐτοῦ Ἰησοῦν, αὐτὸς γὰρ σώσει τὸν λαὸν αὐτοῦ ἀπὸ τῶν ἁμαρτιῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/021.yaml
  text: She will bear a son[a], and you shall call his name Jesus, for he will save his people from their sins.
translation:
  language: it
  text: Partorirà un figlio e tu gli darai il nome Gesù[a], perché egli salverà il suo popolo dai suoi peccati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Gesù» è la forma italiana del greco Iēsous, corrispondente all'ebraico/aramaico Yeshua (Giosuè) e associato all'idea «il Signore salva»; la spiegazione «perché egli salverà» richiama questo gioco di parole.
    reason: lexical_alternative
lexical_decisions:
- source_word: τέξεται
  choice: Partorirà
  rationale: Il futuro di τίκτω, nel contesto del parto, è reso direttamente e naturalmente con «partorirà», mantenendo il valore predittivo.
- source_word: δὲ
  choice: —
  rationale: δέ è un connettivo lieve; in italiano può restare implicito senza interrompere il fluire naturale del discorso.
- source_word: υἱὸν
  choice: un figlio
  rationale: L'accusativo anartro nel contesto di una nascita si rende idiomaticamente con «un figlio».
- source_word: καλέσεις τὸ ὄνομα αὐτοῦ
  choice: tu gli darai il nome
  rationale: La formula greca di imposizione del nome è resa in italiano moderno con un'espressione naturale che conserva sia l'azione del destinatario sia l'importanza del nome.
- source_word: Ἰησοῦν
  choice: Gesù
  rationale: È la forma italiana tradizionale e corrente del nome neotestamentario; la nota segnala il legame etimologico richiamato dalla spiegazione di Matteo.
- source_word: αὐτὸς
  choice: egli
  rationale: Il pronome soggetto espresso conserva una lieve enfasi sull'identità del bambino come agente della salvezza, senza l'aggiunta più marcata di «egli stesso».
- source_word: γὰρ
  choice: perché
  rationale: Introduce la ragione esplicativa dell'imposizione del nome; «perché» è chiaro e naturale in italiano.
- source_word: σώσει
  choice: salverà
  rationale: σῴζω indica qui la liberazione dai peccati; «salverà» è la resa più diretta e mantiene la valenza soteriologica del testo.
- source_word: τὸν λαὸν αὐτοῦ
  choice: il suo popolo
  rationale: Mantiene il senso collettivo e le possibili risonanze covenantali di λαός senza restringerne o ampliarne esplicitamente la portata.
- source_word: ἀπὸ τῶν ἁμαρτιῶν αὐτῶν
  choice: dai suoi peccati
  rationale: ἀπό indica separazione o liberazione; il plurale «peccati» conserva la forma del greco. Il possessivo italiano concorda grammaticalmente con il singolare collettivo «popolo».
theological_decisions:
- issue: Enfasi di αὐτός nell'opera salvifica di Gesù
  choice: Resa con il soggetto espresso «egli salverà»
  alternative: «egli stesso salverà» oppure il semplice «salverà»
  rationale: Il soggetto espresso segnala in modo sobrio che proprio il bambino sarà l'agente della salvezza, evitando però di accentuare il pronome oltre quanto richiede necessariamente il greco.
- issue: Portata dell'espressione «il suo popolo»
  choice: Lasciata non specificata
  alternative: «il suo popolo Israele» oppure «tutti coloro che gli appartengono»
  rationale: Il contesto ha risonanze ebraiche e covenantali, ma il versetto non definisce ulteriormente la portata dell'espressione; la traduzione conserva questa apertura interpretativa.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. «Tu gli darai il nome» evita il calco poco naturale «chiamerai il suo nome», mentre «egli» conserva sobriamente il soggetto esplicito. Il marcatore di nota è collocato subito dopo «Gesù», il referente della nota.
