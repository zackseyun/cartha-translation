  text: τοῦτο δὲ ὅλον γέγονεν ἵνα πληρωθῇ τὸ ῥηθὲν ⸀ὑπὸ κυρίου διὰ τοῦ προφήτου λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/022.yaml
  text: All this happened so that what was spoken by the Lord through the prophet might be fulfilled[a], saying,
translation:
  language: it
  text: 'Tutto questo[a] è avvenuto affinché si adempisse ciò che era stato detto dal Signore per mezzo del profeta, che dice:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «Ora, questa intera vicenda è avvenuta». L’espressione greca sottolinea la totalità degli eventi appena descritti.'
    reason: Alternativa lessicale che rende più esplicitamente l’enfasi di τοῦτο δὲ ὅλον e la funzione connettiva di δέ.
lexical_decisions:
- source_word: τοῦτο δὲ ὅλον
  choice: Tutto questo
  rationale: Il dimostrativo neutro singolare rinvia nel loro insieme agli eventi appena narrati, mentre ὅλον ne sottolinea la totalità. In italiano «Tutto questo» è naturale e conserva l’enfasi; la lieve funzione connettiva di δέ non richiede necessariamente una parola autonoma.
- source_word: γέγονεν
  choice: avvenne
  rationale: Il perfetto di γίνομαι indica il verificarsi dell’intero evento; il passato remoto si adatta alla narrazione italiana e rende la frase con dignità e chiarezza.
- source_word: ἵνα πληρωθῇ
  choice: affinché si adempisse
  rationale: Conserva sia la costruzione finale o consecutiva di ἵνα con il congiuntivo sia il passivo del verbo, senza decidere oltre il testo tra scopo divino e risultato narrativo.
- source_word: τὸ ῥηθὲν
  choice: ciò che era stato detto
  rationale: Rende in modo naturale il participio aoristo passivo sostantivato e mantiene la forma passiva.
- source_word: ὑπὸ κυρίου
  choice: dal Signore
  rationale: Ὑπό con il genitivo presenta il Signore come colui dal quale proviene la parola, senza aggiungere «Dio», assente dal greco.
- source_word: διὰ τοῦ προφήτου
  choice: per mezzo del profeta
  rationale: Διά con il genitivo esprime la mediazione del profeta e distingue con precisione la sua funzione da quella del Signore, indicato come fonte della parola.
- source_word: λέγοντος
  choice: che disse
  rationale: Il participio introduce la citazione seguente ed è riferito grammaticalmente al profeta. «Che disse» evita un gerundio italiano dal referente potenzialmente ambiguo.
theological_decisions:
- issue: Agenzia nella parola profetica
  choice: «detto dal Signore per mezzo del profeta»
  alternative: «detto dal profeta da parte del Signore»
  rationale: 'La resa conserva la distinta agenzia espressa da ὑπό e διά: il Signore è la fonte ultima della parola e il profeta ne è il mediatore, senza sviluppare una dottrina oltre ciò che il testo afferma.'
- issue: Formula di adempimento
  choice: «affinché si adempisse»
  alternative: «così si adempì»
  rationale: La costruzione scelta mantiene aperta la tensione semantica di ἵνα + congiuntivo tra scopo e risultato e preserva il tema matteano dell’adempimento.
translation_notes:
  register: Italiano standard contemporaneo, dignitoso e leggibile. «Affinché» mantiene il tono solenne della formula di adempimento senza risultare arcaico; «che disse» prepara chiaramente la citazione del versetto seguente.
