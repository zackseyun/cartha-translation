  text: ⸀ἐγερθεὶς δὲ ὁ Ἰωσὴφ ἀπὸ τοῦ ὕπνου ἐποίησεν ὡς προσέταξεν αὐτῷ ὁ ἄγγελος κυρίου καὶ παρέλαβεν τὴν γυναῖκα αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/024.yaml
  text: Then Joseph[a], having awakened from sleep, did as the angel of the Lord commanded him and took his wife.
translation:
  language: it
  text: Giuseppe, destatosi dal sonno, fece come gli aveva comandato l’angelo del Signore e prese con sé[a] sua moglie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oppure «accolse sua moglie». Il verbo greco può indicare il prendere o accogliere qualcuno con sé, anche nella propria casa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθεὶς δὲ ὁ Ἰωσὴφ ἀπὸ τοῦ ὕπνου
  choice: Giuseppe, destatosi dal sonno
  rationale: Il participio aoristo passivo, usato qui in senso intransitivo, indica il risveglio e precede l’azione principale. «Destatosi dal sonno» conserva la sequenza participiale in un italiano dignitoso e naturale; δέ svolge una funzione narrativa che non richiede necessariamente un connettivo espresso.
- source_word: ἐποίησεν ὡς
  choice: fece come
  rationale: Rende direttamente la conformità dell’azione di Giuseppe al comando ricevuto.
- source_word: προσέταξεν αὐτῷ
  choice: gli aveva comandato
  rationale: Il trapassato italiano chiarisce naturalmente che il comando dell’angelo precede l’esecuzione di Giuseppe; «comandato» conserva la forza autorevole di προστάσσω.
- source_word: ὁ ἄγγελος κυρίου
  choice: l’angelo del Signore
  rationale: Riproduce l’espressione biblica tradizionale e trasparente, rendendo κύριος con «Signore».
- source_word: παρέλαβεν
  choice: prese con sé
  rationale: παραλαμβάνω può significare prendere o accogliere presso di sé. «Prese con sé» mantiene l’azione relazionale e domestica senza specificare oltre ciò che il testo afferma.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: sua moglie
  rationale: Nel contesto giuridico e matrimoniale del racconto, γυνή ha naturalmente il senso di «moglie», senza implicare di per sé la consumazione del matrimonio.
theological_decisions:
- issue: Resa di γυνή prima della consumazione del matrimonio
  choice: sua moglie
  alternative: la sua donna
  rationale: Matteo presenta Maria entro un vincolo matrimoniale riconosciuto, pur precisando nel versetto seguente l’assenza di rapporti coniugali. «Moglie» riflette tale quadro senza aggiungere l’idea di consumazione.
- issue: Resa di κύριος nell’espressione ἄγγελος κυρίου
  choice: l’angelo del Signore
  alternative: l’angelo di Yahweh
  rationale: «Signore» corrisponde direttamente al greco κύριος e conserva l’idioma biblico italiano senza retrotradurre nel testo un nome divino non presente nella forma greca.
- issue: Portata di παρέλαβεν nel contesto matrimoniale
  choice: prese con sé
  alternative: accolse in casa sua
  rationale: La formulazione scelta conserva la possibile idea di accogliere Maria presso di sé, ma evita di trasformare un’implicazione contestuale in un’esplicitazione obbligatoria.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. La costruzione participiale «destatosi» conserva la forma e la successione del greco senza risultare arcaica; «prese con sé» lascia percepire l’accoglienza nella sfera domestica. Il richiamo della nota [a] è collocato subito dopo l’espressione interessata.
