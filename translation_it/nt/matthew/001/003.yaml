id: MAT.1.3
reference: Matthew 1:3
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Ἰούδας δὲ ἐγέννησεν τὸν Φαρὲς καὶ τὸν Ζάρα ἐκ τῆς Θαμάρ, Φαρὲς δὲ ἐγέννησεν τὸν Ἑσρώμ, Ἑσρὼμ δὲ ἐγέννησεν τὸν Ἀράμ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/003.yaml
  text: Judah fathered Perez and Zerah by Tamar[a], Perez fathered Hezron, and Hezron fathered Aram.
translation:
  language: it
  text: Giuda generò Perez e Zerach da Tamar; Perez generò Chezron e Chezron generò Aram.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alcune traduzioni hanno «Ram»; il testo greco qui legge «Aram».
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰούδας
  choice: Giuda
  rationale: Nel contesto della genealogia indica il patriarca e capostipite tribale; «Giuda» è la forma italiana biblica consueta e lo distingue dai personaggi neotestamentari chiamati comunemente «Giuda» solo sulla base del contesto.
- source_word: δὲ
  choice: punteggiatura ed «e»
  rationale: Qui δέ è un connettivo lieve nella successione genealogica, non avversativo; il punto e virgola e l’ultima congiunzione rendono naturale la sequenza italiana.
- source_word: ἐγέννησεν
  choice: generò
  rationale: In una genealogia esprime la procreazione o discendenza in linea paterna. «Generò» è conciso, dignitoso e tradizionale senza risultare oscuro nell’italiano moderno.
- source_word: Φαρὲς
  choice: Perez
  rationale: Corrisponde all’ebraico פֶּרֶץ; «Perez» mantiene la continuità con la forma normalmente usata nell’Antico Testamento italiano.
- source_word: Ζάρα
  choice: Zerach
  rationale: Rappresenta il nome ebraico זֶרַח e mantiene la continuità con la forma veterotestamentaria, anziché riprodurre semplicemente la grafia greca «Zara».
- source_word: ἐκ τῆς Θαμάρ
  choice: da Tamar
  rationale: ἐκ con il nome della madre indica origine materna. «Da Tamar» è naturale in italiano e conserva esplicitamente la menzione della madre.
- source_word: Ἑσρώμ
  choice: Chesron
  rationale: Corrisponde all’ebraico חֶצְרוֹן; «Chesron» mantiene la continuità dei nomi tra Antico e Nuovo Testamento.
- source_word: Ἀράμ
  choice: Aram
  rationale: La fonte greca fornita legge esplicitamente Ἀράμ; la traduzione ne segue la forma senza armonizzarla tacitamente con «Ram».
theological_decisions:
- issue: Se armonizzare l’ultimo nome con la genealogia veterotestamentaria comunemente resa «Ram»
  choice: Aram
  alternative: Ram
  rationale: La priorità spetta al testo greco fornito, che legge Ἀράμ. La variante tradizionale «Ram» viene segnalata in nota per trasparenza, senza sostituirla al testo di partenza.
translation_notes:
  register: Italiano standard moderno, sobrio e dignitoso. La ripetizione di «generò» conserva il ritmo genealogico del greco; la punteggiatura evita un accumulo innaturale di connettivi. I nomi sono resi, ove opportuno, nelle forme che favoriscono la continuità con l’Antico Testamento italiano.
