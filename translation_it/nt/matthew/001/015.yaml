  text: Ἐλιοὺδ δὲ ἐγέννησεν τὸν Ἐλεάζαρ, Ἐλεάζαρ δὲ ἐγέννησεν τὸν Ματθάν, Ματθὰν δὲ ἐγέννησεν τὸν Ἰακώβ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/015.yaml
  text: Eliud fathered Eleazar, and Eleazar fathered Matthan, and Matthan fathered Jacob.
translation:
  language: it
  text: Eliud generò Eleazar; Eleazar generò Mattan; Mattan generò Giacobbe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλιοὺδ
  choice: Eliud
  rationale: Nome proprio traslitterato secondo l'uso biblico italiano corrente.
- source_word: δὲ
  choice: punto e virgola (nessuna resa lessicale separata)
  rationale: Nella sequenza genealogica δέ è un connettivo lieve; in italiano la successione è resa naturalmente dalla punteggiatura, senza appesantire il periodo con ripetuti «e».
- source_word: ἐγέννησεν
  choice: generò
  rationale: Nel contesto genealogico indica la procreazione o discendenza paterna. «Generò» è conciso, dignitoso e tradizionale, pur restando comprensibile nell'italiano moderno.
- source_word: τὸν
  choice: non reso separatamente
  rationale: L'articolo greco introduce il complemento oggetto costituito da un nome proprio; l'italiano non richiede qui l'articolo.
- source_word: Ἐλεάζαρ
  choice: Eleazar
  rationale: Forma del nome consolidata nella tradizione biblica italiana.
- source_word: Ματθάν
  choice: Mattan
  rationale: Traslitterazione italiana che conserva la consonante doppia del nome greco.
- source_word: Ἰακώβ
  choice: Giacobbe
  rationale: Forma tradizionale e universalmente riconoscibile del nome nell'italiano biblico.
theological_decisions:
- issue: Portata genealogica di ἐγέννησεν
  choice: generò
  alternative: fu padre di / fu antenato di
  rationale: Si mantiene la normale formulazione genealogica senza specificare oltre il testo se ciascun rapporto debba essere inteso come paternità immediata o come discendenza genealogica.
translation_notes:
  register: Italiano moderno, lineare e dignitoso. La ripetizione verbale conserva il ritmo genealogico del greco; i punti e virgola rendono i lievi passaggi segnati da δέ.
