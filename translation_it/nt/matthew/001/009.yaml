id: MAT.1.9
reference: Matthew 1:9
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Ὀζίας δὲ ἐγέννησεν τὸν Ἰωαθάμ, Ἰωαθὰμ δὲ ἐγέννησεν τὸν Ἀχάζ, Ἀχὰζ δὲ ἐγέννησεν τὸν Ἑζεκίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/009.yaml
  text: Uzziah fathered Jotham[a], and Jotham fathered Ahaz, and Ahaz fathered Hezekiah,
translation:
  language: it
  text: Ozia generò[a] Iotam, Iotam generò Acaz e Acaz generò Ezechia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il greco ἐγέννησεν può anche essere reso «fu padre di»; qui «generò» conserva in modo conciso la formula ripetuta della genealogia.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀζίας
  choice: Ozia
  rationale: Forma italiana biblica corrente del nome del re di Giuda, preferita alla traslitterazione più grecizzante «Ozias».
- source_word: δὲ
  choice: coordinazione mediante virgola ed «e»
  rationale: Nella sequenza genealogica δέ è un connettivo lieve. In italiano la ripetizione di «e» dopo ogni nome risulterebbe pesante; la virgola e l’«e» conclusiva conservano il fluire coordinato della frase.
- source_word: ἐγέννησεν
  choice: generò
  rationale: Nella formula genealogica indica la discendenza paterna. «Generò» è conciso, dignitoso e tradizionale, e mantiene la struttura ripetitiva del greco senza ricorrere alla parafrasi «fu padre di».
- source_word: Ἰωαθάμ
  choice: Iotam
  rationale: Forma italiana biblica corrente corrispondente al re di Giuda noto dall’Antico Testamento.
- source_word: Ἀχάζ
  choice: Acaz
  rationale: Forma italiana biblica corrente, preferita a una traslitterazione grecizzante.
- source_word: Ἑζεκίαν
  choice: Ezechia
  rationale: Forma italiana biblica corrente corrispondente al re di Giuda noto dall’Antico Testamento.
theological_decisions:
- issue: Valore genealogico di γεννάω
  choice: Reso come successione genealogica paterna diretta con «generò».
  alternative: «fu padre di»; «divenne padre di»; «fu antenato di»
  rationale: La genealogia di Matteo impiega una formula stilizzata e ripetuta. «Generò» ne conserva la forza lessicale e il ritmo. Benché le genealogie bibliche possano omettere alcune generazioni, il versetto presenta semplicemente la successione paterna; il testo principale non viene quindi ampliato con l’interpretativo «fu antenato di».
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. I nomi seguono le forme bibliche italiane d’uso comune. La coordinazione è resa secondo la sintassi naturale italiana, mantenendo la cadenza della genealogia.
