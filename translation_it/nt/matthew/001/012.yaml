id: MAT.1.12
reference: Matthew 1:12
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Μετὰ δὲ τὴν μετοικεσίαν Βαβυλῶνος Ἰεχονίας ἐγέννησεν τὸν Σαλαθιήλ, Σαλαθιὴλ δὲ ἐγέννησεν τὸν Ζοροβαβέλ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/012.yaml
  text: After the deportation to Babylon[a], Jeconiah fathered Shealtiel, and Shealtiel fathered Zerubbabel.
translation:
  language: it
  text: Dopo la deportazione in Babilonia[a], Ieconia generò Sealtiel, e Sealtiel generò Zorobabele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «l’esilio in Babilonia». Il termine greco indica il trasferimento forzato del popolo nell’esilio babilonese.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ
  choice: Dopo
  rationale: μετά con l’accusativo indica successione temporale; il lieve valore connettivo di δέ è assorbito naturalmente nella formulazione italiana.
- source_word: τὴν μετοικεσίαν Βαβυλῶνος
  choice: la deportazione a Babilonia
  rationale: μετοικεσία indica il trasferimento in esilio; «deportazione» rende chiaramente il carattere imposto dell’evento, mentre «a Babilonia» esprime la destinazione.
- source_word: Ἰεχονίας
  choice: Ieconia
  rationale: Forma italiana biblica tradizionale e riconoscibile del nome proprio.
- source_word: ἐγέννησεν
  choice: generò
  rationale: Nel contesto genealogico indica la discendenza per linea paterna. «Generò» è conciso e dignitoso, e non impone una successione biologica immediata più rigorosa di quella richiesta dal genere genealogico.
- source_word: Σαλαθιήλ
  choice: Sealtiel
  rationale: Forma italiana biblica riconoscibile, coerente con il nome dell’Antico Testamento.
- source_word: δὲ
  choice: e
  rationale: Qui δέ collega due anelli successivi della genealogia senza valore avversativo.
- source_word: Ζοροβαβέλ
  choice: Zorobabele
  rationale: Forma italiana biblica corrente e riconoscibile.
theological_decisions:
- issue: Valore di γεννάω nella genealogia
  choice: Rendere con «generò» come formula di successione genealogica paterna.
  alternative: «fu padre di»
  rationale: La formula conserva il rapporto di discendenza presentato da Matteo senza affermare necessariamente un’immediatezza biologica maggiore di quella implicata dalle convenzioni genealogiche.
translation_notes:
  register: Italiano standard moderno, sobrio e dignitoso. La ripetizione di «generò» conserva il ritmo formulare della genealogia; i nomi seguono forme italiane bibliche riconoscibili.
source_grounding:
  english_pob_role: consult_only
