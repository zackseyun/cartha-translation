  text: Βίβλος γενέσεως Ἰησοῦ χριστοῦ υἱοῦ Δαυὶδ υἱοῦ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/001.yaml
  text: The book of the genealogy of Jesus the Messiah[a], the son of David[b], the son of Abraham.
translation:
  language: it
  text: Libro della genealogia[a] di Gesù, il Messia[b], figlio di Davide, figlio di Abraamo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oppure «dell'origine» o «della nascita». Il greco può avere un senso più ampio di «genesi» o «origine», anche se «genealogia» si adatta meglio alla discendenza che segue.
    reason: alternative_reading
  - marker: b
    text: Oppure «Cristo». Il greco Χριστός significa «l'Unto» e qui è usato come titolo.
    reason: alternative_reading
lexical_decisions:
- source_word: Βίβλος
  choice: Libro
  rationale: In apertura, la forma senza articolo funziona naturalmente come titolo. «Libro» conserva il registro scritturale e il carattere di intestazione.
- source_word: γενέσεως
  choice: della genealogia
  rationale: Il termine può indicare origine, nascita o genealogia; poiché introduce immediatamente una linea genealogica, «genealogia» è la resa contestualmente più chiara, senza escludere le risonanze più ampie segnalate in nota.
- source_word: Ἰησοῦ
  choice: di Gesù
  rationale: Si adotta la forma italiana tradizionale e corrente del nome proprio.
- source_word: χριστοῦ
  choice: il Messia
  rationale: Qui Χριστός presenta Gesù mediante il titolo dell'Unto atteso, non come un cognome. «Il Messia» rende esplicito in italiano il valore titolare.
- source_word: υἱοῦ Δαυὶδ
  choice: figlio di Davide
  rationale: La resa letterale conserva sia l'idioma genealogico, nel quale «figlio» può significare discendente, sia la forza del titolo regale e messianico.
- source_word: υἱοῦ Ἀβραάμ
  choice: figlio di Abraamo
  rationale: La resa letterale conserva il parallelismo con «figlio di Davide» e il legame genealogico e pattizio con Abraamo; nel contesto indica discendenza.
theological_decisions:
- issue: Resa di Χριστός
  choice: il Messia
  alternative: Cristo
  rationale: In questa intestazione il termine ha valore titolare e identifica Gesù come l'Unto atteso. «Cristo» è la resa italiana tradizionale, ma può essere percepito come parte del nome; l'alternativa è quindi conservata in nota.
- issue: Senso di γενέσεως nell'intestazione
  choice: genealogia
  alternative: origine; nascita
  rationale: La genealogia che segue favorisce questa accezione, ma il greco conserva una gamma semantica più ampia, forse intenzionalmente evocativa della genesi o dell'origine; la nota mantiene tale ambiguità.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. L'apertura nominale «Libro della genealogia» mantiene la concisione solenne dell'intestazione greca. È stato conservato «figlio» anziché esplicitare «discendente», così da non attenuare i richiami messianici e genealogici. La possibile resa di γενέσεως come «origine» o «nascita» è integrata nella nota associata all'intestazione lessicale.
