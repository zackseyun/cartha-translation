id: MAT.1.25
reference: Matthew 1:25
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: καὶ οὐκ ἐγίνωσκεν αὐτὴν ἕως οὗ ἔτεκεν ⸀υἱόν· καὶ ἐκάλεσεν τὸ ὄνομα αὐτοῦ Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/025.yaml
  text: And he did not know her until she gave birth to a son[c][b][a], and he called his name Jesus.
translation:
  language: it
  text: E non la conobbe[a] finché[b] non partorì un figlio; e gli mise nome Gesù.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, più esplicitamente, «non ebbe rapporti coniugali con lei». Il greco dice «non la conosceva», usando «conoscere» come eufemismo.
    reason: lexical_alternative
  - marker: b
    text: «Finché» indica ciò che valeva fino alla nascita di Gesù; di per sé non stabilisce che cosa accadde dopo.
    reason: alternative_reading
  - marker: c
    text: 'O, più semplicemente, «lo chiamò Gesù». Il greco dice letteralmente: «chiamò il suo nome Gesù».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγίνωσκεν
  choice: la conobbe
  rationale: Il verbo γινώσκω è qui un eufemismo per i rapporti sessuali. «La conobbe» conserva l’immagine del greco ed è comprensibile nel registro biblico italiano; la nota esplicita il senso.
- source_word: ἕως οὗ
  choice: finché non
  rationale: È la resa temporale italiana più naturale in questa costruzione. Indica ciò che vale fino al parto, senza determinare da sola quanto accadde in seguito.
- source_word: ἔτεκεν
  choice: partorì
  rationale: Resa moderna, diretta e naturale di τίκτω nel contesto.
- source_word: υἱόν
  choice: un figlio
  rationale: L’accusativo senza articolo è reso naturalmente con l’indeterminativo, senza introdurre un’enfasi assente dal greco.
- source_word: ἐκάλεσεν τὸ ὄνομα αὐτοῦ Ἰησοῦν
  choice: gli mise nome Gesù
  rationale: Rende in italiano dignitoso e comprensibile la formula semitizzante del greco, mantenendo più della sua struttura rispetto al semplice «lo chiamò Gesù».
- source_word: Ἰησοῦν
  choice: Gesù
  rationale: È la forma italiana convenzionale del nome neotestamentario.
theological_decisions:
- issue: Possibile implicazione di «finché» riguardo alla successiva vita coniugale di Maria
  choice: Rendere ἕως οὗ con «finché non» senza affermare che dopo il parto vi furono rapporti coniugali.
  alternative: Alcuni deducono che i rapporti coniugali cominciarono in seguito; altri ritengono che la frase non implichi alcun cambiamento successivo.
  rationale: L’espressione greca delimita esplicitamente il periodo precedente alla nascita, ma da sola non risolve che cosa avvenne dopo. La nota conserva questa tensione senza imporre una conclusione confessionale.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. «La conobbe» conserva deliberatamente l’eufemismo biblico, chiarito in nota; «gli mise nome» evita sia un calco innaturale sia una parafrasi eccessiva.
