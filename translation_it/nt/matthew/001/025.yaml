  source_fidelity: 'La resa conserva tutti gli elementi del testo SBLGNT: la negazione, l''eufemismo di γινώσκω con oggetto personale, il limite temporale ἕως οὗ, la nascita di «un figlio» (υἱόν anartro) e l''imposizione del nome Gesù. «Non la conobbe» è una forma biblico-letteraria italiana consolidata; pur usando il passato remoto dove il greco ha l''imperfetto, nel contesto narrativo rende adeguatamente lo stato negativo protratto fino alla nascita. «Finché non» non decide nulla sul periodo successivo.'
