id: MAT.1.10
reference: Matthew 1:10
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Ἑζεκίας δὲ ἐγέννησεν τὸν Μανασσῆ, Μανασσῆς δὲ ἐγέννησεν τὸν ⸂Ἀμώς, Ἀμὼς⸃ δὲ ἐγέννησεν τὸν Ἰωσίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/010.yaml
  text: Hezekiah fathered Manasseh[a], Manasseh fathered Amos, and Amos fathered Josiah.
translation:
  language: it
  text: Ezechia generò Manasse, Manasse generò Amos[a] e Amos generò Giosia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alcune traduzioni leggono «Amon», armonizzando il nome con quello del re di Giuda in 2 Re 21; il testo greco di Matteo legge «Amos».
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγέννησεν
  choice: generò
  rationale: Nel contesto genealogico indica la generazione o discendenza da parte del padre. «Generò» è conciso, dignitoso e tradizionalmente comprensibile in italiano, senza l'arcaismo più marcato di «ingenerò» né l'espansione di «divenne padre di».
- source_word: Ἑζεκίας
  choice: Ezechia
  rationale: Forma italiana biblica standard del nome del re di Giuda.
- source_word: Μανασσῆς
  choice: Manasse
  rationale: Forma italiana biblica standard del nome proprio.
- source_word: Ἀμώς
  choice: Amos
  rationale: Traslittera fedelmente la lezione Ἀμώς del testo greco SBLGNT; non viene armonizzata tacitamente con il nome Amon presente nei libri dei Re e delle Cronache.
- source_word: Ἰωσίας
  choice: Giosia
  rationale: Forma italiana biblica standard del nome proprio.
- source_word: δέ
  choice: punteggiatura ed «e»
  rationale: Nella sequenza genealogica δέ collega e fa avanzare l'elenco. In italiano la ripetizione viene resa naturalmente mediante virgole e con «e» prima dell'ultimo membro.
theological_decisions:
- issue: Differenza tra il nome nel testo greco di Matteo e quello del re nell'Antico Testamento
  choice: Amos nel testo principale
  alternative: Amon, per armonizzare la genealogia con 2 Re 21 e 2 Cronache 33
  rationale: Il testo greco fornito legge Ἀμώς. La traduzione segue questa evidenza senza correggerla in base al parallelo storico; la possibile armonizzazione è segnalata in nota, preservando la tensione testuale.
translation_notes:
  register: Italiano moderno standard, sobrio e dignitoso. La struttura ripetitiva propria della genealogia è mantenuta, mentre i connettivi sono resi con una coordinazione naturale. Tutti i nomi seguono le forme bibliche italiane correnti, salvo «Amos», che riproduce intenzionalmente la lezione greca del passo.
