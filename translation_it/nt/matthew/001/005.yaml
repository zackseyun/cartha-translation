id: MAT.1.5
reference: Matthew 1:5
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Σαλμὼν δὲ ἐγέννησεν τὸν ⸂Βόες ἐκ τῆς Ῥαχάβ, Βόες⸃ δὲ ἐγέννησεν τὸν ⸂Ἰωβὴδ ἐκ τῆς Ῥούθ, Ἰωβὴδ⸃ δὲ ἐγέννησεν τὸν Ἰεσσαί,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/005.yaml
  text: Salmon fathered Boaz by Rahab[a], and Boaz fathered Obed by Ruth, and Obed fathered Jesse,
translation:
  language: it
  text: Salmon generò Boaz da Raab[a]; Boaz generò Obed da Rut; Obed generò Iesse,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il greco ripete ἐκ («da») davanti ai nomi di Raab e di Rut.
    reason: La nota segnala la ripetizione di ἐκ con ciascun nome materno e rende trasparente la costruzione della lingua fonte.
lexical_decisions:
- source_word: ἐγέννησεν
  choice: generò
  rationale: Nel contesto genealogico indica la generazione o discendenza lungo la linea paterna. «Generò» è conciso, dignitoso e tradizionale senza risultare oscuro nell’italiano moderno.
- source_word: ἐκ
  choice: da
  rationale: Con il nome della madre esprime provenienza o parentela materna. «Da Raab» e «da Rut» conservano la formulazione greca e rendono esplicito il ruolo materno.
- source_word: δὲ
  choice: punteggiatura coordinante
  rationale: Qui δέ è un connettivo lieve e non avversativo. In italiano la successione naturale delle proposizioni, scandita dal punto e virgola, ne comunica il valore senza ripetere «e».
- source_word: Σαλμὼν
  choice: Salmon
  rationale: Forma italiana biblica riconoscibile del nome proprio.
- source_word: Βόες
  choice: Boaz
  rationale: La forma italiana consueta collega chiaramente il personaggio a quello dell’Antico Testamento.
- source_word: Ῥαχάβ
  choice: Raab
  rationale: Forma tradizionale e riconoscibile nelle Bibbie italiane per il personaggio veterotestamentario.
- source_word: Ἰωβὴδ
  choice: Obed
  rationale: Forma italiana biblica corrente, coerente con il nome dell’Antico Testamento.
- source_word: Ῥούθ
  choice: Rut
  rationale: Forma italiana standard del nome e del relativo libro biblico.
- source_word: Ἰεσσαί
  choice: Iesse
  rationale: Forma italiana biblica tradizionale e tuttora riconoscibile.
theological_decisions:
- issue: Formula genealogica e menzione delle madri
  choice: Mantenere esplicitamente «da Raab» e «da Rut» entro la genealogia paterna espressa da «generò».
  alternative: Rendere «fu padre di» oppure parafrasare «ebbe Boaz da Raab».
  rationale: Il greco nomina insolitamente entrambe le madri mediante ἐκ + genitivo. La resa conserva sia la struttura della linea paterna sia il rilievo dato alla parentela materna, senza aggiungere un’interpretazione teologica.
translation_notes:
  register: Italiano moderno, sobrio e dignitoso. La ripetizione di «generò» conserva il ritmo genealogico; i punti e virgola evitano una coordinazione pesante. Il marcatore [a] è collocato subito dopo la prima occorrenza della costruzione annotata.
