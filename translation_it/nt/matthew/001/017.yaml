revisions:
- from: Dunque, tutte le generazioni da Abraamo a Davide furono quattordici generazioni; da Davide fino alla deportazione a Babilonia, quattordici generazioni; e dalla deportazione a Babilonia fino al Messia[a], quattordici generazioni.
  to: Dunque, da Abraamo a Davide ci furono in tutto quattordici generazioni; da Davide alla deportazione in Babilonia, quattordici generazioni; e dalla deportazione in Babilonia al Messia[a], quattordici generazioni.
  rationale: La revisione migliora l'idiomaticità italiana e la precisione della locuzione storica, mantenendo il sommario «Dunque», il conteggio in tre gruppi e il parallelismo ellittico del greco. Non introduce alcuna armonizzazione del conteggio genealogico né un'interpretazione confessionale.
