id: MAT.1.17
reference: Matthew 1:17
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Πᾶσαι οὖν αἱ γενεαὶ ἀπὸ Ἀβραὰμ ἕως Δαυὶδ γενεαὶ δεκατέσσαρες, καὶ ἀπὸ Δαυὶδ ἕως τῆς μετοικεσίας Βαβυλῶνος γενεαὶ δεκατέσσαρες, καὶ ἀπὸ τῆς μετοικεσίας Βαβυλῶνος ἕως τοῦ χριστοῦ γενεαὶ δεκατέσσαρες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/017.yaml
  text: So all the generations from Abraham to David were fourteen generations[a], and from David to the exile to Babylon fourteen generations[b], and from the exile to Babylon to the Messiah fourteen generations.
translation:
  language: it
  text: Dunque, da Abraamo a Davide ci furono in tutto quattordici generazioni; da Davide alla deportazione in Babilonia, quattordici generazioni; e dalla deportazione in Babilonia al Messia[a], quattordici generazioni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «Cristo». Il greco χριστός è qui un titolo e significa «Messia».
    reason: alternative_reading
lexical_decisions:
- source_word: Πᾶσαι οὖν αἱ γενεαὶ
  choice: Dunque, tutte le generazioni
  rationale: «Dunque» conserva la funzione riepilogativa e inferenziale di οὖν; «tutte le generazioni» rende esplicitamente Πᾶσαι αἱ γενεαί.
- source_word: ἀπὸ ... ἕως
  choice: da ... fino a
  rationale: Riproduce con naturalezza l'estensione fra i due termini della genealogia.
- source_word: γενεαὶ δεκατέσσαρες
  choice: quattordici generazioni
  rationale: Mantiene la formula nominale ripetuta e la struttura retorica tripartita del greco.
- source_word: μετοικεσίας Βαβυλῶνος
  choice: deportazione a Babilonia
  rationale: μετοικεσία indica propriamente il trasferimento forzato o la deportazione; questa resa è precisa e mantiene il riferimento storico.
- source_word: τοῦ χριστοῦ
  choice: al Messia
  rationale: L'articolo e il culmine della genealogia mostrano che χριστός funziona qui come titolo; «Messia» ne comunica il senso anziché limitarsi alla forma tradizionale «Cristo».
- source_word: Ἀβραὰμ / Δαυὶδ / Βαβυλῶνος
  choice: Abraamo / Davide / Babilonia
  rationale: Si adottano le forme italiane bibliche correnti dei nomi propri.
theological_decisions:
- issue: Resa di Χριστός
  choice: Messia
  alternative: Cristo
  rationale: Nel contesto χριστός è un titolo e costituisce il culmine messianico della genealogia. La nota conserva la resa tradizionale alternativa senza attenuare la funzione titolare.
- issue: Conteggio schematico delle generazioni
  choice: Mantenere l'affermazione del testo senza armonizzarla o spiegarla
  alternative: Aggiungere una spiegazione del metodo di conteggio
  rationale: Il versetto presenta direttamente tre gruppi di quattordici; la traduzione non deve risolvere nel testo le questioni genealogiche sottostanti.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. La punteggiatura con punti e virgola rende chiaramente i tre segmenti paralleli, mentre l'ellissi del verbo nel secondo e nel terzo conserva la forma compatta del greco.
