id: MAT.1.20
reference: Matthew 1:20
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ταῦτα δὲ αὐτοῦ ἐνθυμηθέντος ἰδοὺ ἄγγελος κυρίου κατ’ ὄναρ ἐφάνη αὐτῷ λέγων· Ἰωσὴφ υἱὸς Δαυίδ, μὴ φοβηθῇς παραλαβεῖν ⸀Μαρίαν τὴν γυναῖκά σου, τὸ γὰρ ἐν αὐτῇ γεννηθὲν ἐκ πνεύματός ἐστιν ἁγίου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/020.yaml
  text: But as he was considering these things, behold, an angel of the Lord appeared to him in a dream, saying, “Joseph, son of David, do not be afraid to take Mary as your wife, for what has been conceived in her is from the Holy Spirit.”
translation:
  language: it
  text: 'Mentre rifletteva su queste cose, ecco, un angelo del Signore gli apparve in sogno e gli disse: «Giuseppe, figlio di Davide, non temere di prendere con te Maria, tua moglie,[a] perché ciò che è stato generato in lei viene dallo Spirito Santo».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «di accogliere Maria, tua moglie». L''espressione greca indica il prenderla con sé nella propria casa nell''ambito del matrimonio.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνθυμηθέντος
  choice: mentre rifletteva
  rationale: Rende la deliberazione interiore ancora in corso senza trasformarla in una decisione già presa.
- source_word: ἰδοὺ
  choice: ecco
  rationale: Conserva il marcatore discorsivo che introduce con vividezza l'intervento inatteso dell'angelo.
- source_word: ἄγγελος κυρίου
  choice: un angelo del Signore
  rationale: L'assenza dell'articolo davanti ad ἄγγελος favorisce l'indefinito; «del Signore» è la formulazione italiana naturale senza imporre una specifica identificazione teofanica.
- source_word: κατ’ ὄναρ
  choice: in sogno
  rationale: È la resa idiomatica e corrente dell'espressione greca.
- source_word: ἐφάνη
  choice: apparve
  rationale: Resa narrativa consueta per un'apparizione rivelatrice.
- source_word: υἱὸς Δαυίδ
  choice: figlio di Davide
  rationale: Mantiene sia il riferimento genealogico sia la risonanza davidica dell'appellativo.
- source_word: μὴ φοβηθῇς
  choice: non temere
  rationale: Formula italiana naturale e dignitosa che conserva il valore proibitivo.
- source_word: παραλαβεῖν Μαρίαν τὴν γυναῖκά σου
  choice: prendere con te Maria, tua moglie
  rationale: «Prendere con te» esprime l'accoglienza di Maria nella casa coniugale, mentre l'apposizione «tua moglie» conserva il rapporto già espresso dal greco senza suggerire necessariamente un nuovo atto matrimoniale.
- source_word: τὸ ἐν αὐτῇ γεννηθὲν
  choice: ciò che è stato generato in lei
  rationale: Conserva il neutro sostantivato e il valore di γεννάω senza specificare più del testo il processo biologico; in italiano resta comprensibile nel contesto prenatale.
- source_word: ἐκ πνεύματός ἐστιν ἁγίου
  choice: viene dallo Spirito Santo
  rationale: Rende chiaramente ἐκ come origine o provenienza in un italiano naturale.
theological_decisions:
- issue: Resa di κυρίου in ἄγγελος κυρίου
  choice: del Signore
  alternative: di YHWH / l'angelo del Signore
  rationale: «Del Signore» traduce κύριος e mantiene l'indeterminatezza di ἄγγελος, senza imporre al versetto una precisa identificazione veterotestamentaria.
- issue: Referente di πνεύματός ... ἁγίου
  choice: dallo Spirito Santo
  alternative: da uno spirito santo / dalla potenza dello Spirito Santo
  rationale: Nel racconto matteano l'espressione designa lo Spirito Santo come origine divina; non si aggiunge «potenza», assente dal testo.
- issue: Stato coniugale implicato da τὴν γυναῖκά σου
  choice: Maria, tua moglie
  alternative: Maria come tua moglie
  rationale: L'apposizione segue più direttamente il greco e non presenta l'azione come se producesse uno stato coniugale nuovo; la nota chiarisce il valore contestuale di παραλαμβάνω.
translation_notes:
  register: Italiano moderno standard, dignitoso ma accessibile. «Ecco» conserva la vividezza narrativa; «non temere» mantiene un tono biblico ancora naturale. La punteggiatura dell'apposizione «Maria, tua moglie» rende leggibile la costruzione greca senza scioglierne indebitamente la tensione matrimoniale.
