  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Ἰωσίας δὲ ἐγέννησεν τὸν Ἰεχονίαν καὶ τοὺς ἀδελφοὺς αὐτοῦ ἐπὶ τῆς μετοικεσίας Βαβυλῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/011.yaml
  text: Josiah fathered Jeconiah and his brothers at the time of the deportation to Babylon[a].
translation:
  language: it
  text: Giosia generò Ieconia e i suoi fratelli al tempo della deportazione a Babilonia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «durante l’esilio a Babilonia». Il termine greco può indicare un trasferimento forzato o l’esilio; «deportazione» mette in risalto il carattere coercitivo dell’evento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγέννησεν
  choice: generò
  rationale: Nella genealogia γεννάω esprime la discendenza per linea paterna. «Generò» conserva con concisione la formula genealogica greca ed è dignitoso e comprensibile nell’italiano biblico moderno.
- source_word: Ἰεχονίαν
  choice: Ieconia
  rationale: «Ieconia» è la forma italiana tradizionale e riconoscibile del nome greco Ἰεχονίας.
- source_word: ἀδελφοὺς αὐτοῦ
  choice: i suoi fratelli
  rationale: Il greco usa il plurale maschile e, nel contesto genealogico, indica parenti maschi; «fratelli» lo rende direttamente senza neutralizzarne il genere.
- source_word: ἐπὶ τῆς μετοικεσίας Βαβυλῶνος
  choice: al tempo della deportazione a Babilonia
  rationale: μετοικεσία indica il trasferimento forzato, cioè la deportazione o l’esilio. «Al tempo della» rende il valore temporale di ἐπί con il genitivo, mentre «a Babilonia» esplicita naturalmente la destinazione espressa dall’idioma greco.
- source_word: δὲ
  choice: '[non reso separatamente]'
  rationale: δέ è qui un debole connettivo nella sequenza genealogica; non tradurlo separatamente produce un italiano più naturale senza perdita di significato.
theological_decisions:
- issue: Compressione genealogica nella discendenza riportata da Matteo
  choice: Tradurre direttamente la formula genealogica «generò» senza tentare di risolvere nel testo le questioni storiche.
  alternative: Intendere γεννάω in senso più ampio, come indicazione di discendenza ancestrale anziché di paternità biologica immediata in ogni anello.
  rationale: La genealogia di Matteo può omettere generazioni, ma la traduzione deve rispecchiare la formulazione greca e conservare la tensione storica, senza introdurre armonizzazioni interpretative.
translation_notes:
  register: Italiano standard moderno, conciso e dignitoso. La formula «generò» mantiene il ritmo genealogico; «deportazione» comunica chiaramente la natura forzata dell’evento.
