id: MAT.1.8
reference: Matthew 1:8
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Ἀσὰφ⸃ δὲ ἐγέννησεν τὸν Ἰωσαφάτ, Ἰωσαφὰτ δὲ ἐγέννησεν τὸν Ἰωράμ, Ἰωρὰμ δὲ ἐγέννησεν τὸν Ὀζίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/008.yaml
  text: Asaph fathered Jehoshaphat[a], Jehoshaphat fathered Joram, and Joram fathered Uzziah.
translation:
  language: it
  text: Asaf[a] generò Giosafat; Giosafat generò Ioram; Ioram generò Ozia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alcuni manoscritti leggono «Asa» invece di «Asaf»; «Asa» corrisponde anche al re di Giuda menzionato nella genealogia dell’Antico Testamento.
    reason: textual_variant
lexical_decisions:
- source_word: Ἀσὰφ
  choice: Asaf
  rationale: Riproduce la forma del nome attestata nel testo greco SBLGNT, senza armonizzarla tacitamente con Asa, il re di Giuda della genealogia veterotestamentaria.
- source_word: δὲ
  choice: punteggiatura con punto e virgola
  rationale: Qui δέ è un connettivo lieve e ripetitivo, non avversativo. In italiano la successione delle proposizioni è resa in modo naturale mediante punti e virgola, senza aggiungere un contrasto assente dal greco.
- source_word: ἐγέννησεν
  choice: generò
  rationale: È la formulazione italiana concisa e tradizionalmente comprensibile per indicare il rapporto genealogico espresso da γεννάω; mantiene inoltre la ripetizione strutturale del testo.
- source_word: Ἰωσαφάτ
  choice: Giosafat
  rationale: È la forma italiana corrente e riconoscibile del nome del re di Giuda.
- source_word: Ἰωράμ
  choice: Ioram
  rationale: Segue da vicino la forma greca ed è una forma italiana biblica corrente; evita di sostituirla con la forma ebraica più estesa Ioram/Gioram secondo tradizioni onomastiche diverse.
- source_word: Ὀζίαν
  choice: Ozia
  rationale: È la forma italiana comunemente usata per il re di Giuda e corrisponde in modo riconoscibile al nome greco Ὀζίας.
theological_decisions:
- issue: Se armonizzare Ἀσὰφ con il nome storico Asa
  choice: Mantenere «Asaf» nel testo e segnalare «Asa» in nota.
  alternative: Usare «Asa» nel testo principale in accordo con la genealogia dell'Antico Testamento.
  rationale: La priorità data al testo greco richiede di tradurre la forma effettivamente attestata senza correggerla tacitamente. La nota rende trasparente sia la variante manoscritta sia l'identificazione genealogica.
- issue: Resa della sequenza ripetuta δὲ ἐγέννησεν
  choice: Conservare tutte e tre le relazioni genealogiche, separandole con punti e virgola.
  alternative: Ripetere una congiunzione («e») in ogni proposizione oppure variare la formula.
  rationale: La soluzione mantiene integralmente struttura e successione, ma evita in italiano una ripetizione artificiosa dei connettivi; non introduce alcuna interpretazione dottrinale.
translation_notes:
  register: Italiano moderno, sobrio e dignitoso. La ripetizione di «generò» conserva il ritmo genealogico; i punti e virgola rendono naturalmente i lievi connettivi greci. I nomi seguono le forme italiane bibliche correnti, mentre «Asaf» resta aderente al testo greco adottato.
