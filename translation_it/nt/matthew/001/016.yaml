id: MAT.1.16
reference: Matthew 1:16
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Ἰακὼβ δὲ ἐγέννησεν τὸν Ἰωσὴφ τὸν ἄνδρα Μαρίας, ἐξ ἧς ἐγεννήθη Ἰησοῦς ὁ λεγόμενος χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/016.yaml
  text: And Jacob fathered Joseph[a], the husband of Mary, from whom Jesus was born[b], who is called the Messiah.
translation:
  language: it
  text: Giacobbe generò Giuseppe, il marito di Maria, dalla quale nacque Gesù, che è chiamato il Messia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: «il Cristo».'
    reason: alternative_rendering
lexical_decisions:
- source_word: δὲ
  choice: '[non espresso autonomamente]'
  rationale: Qui δέ fa avanzare con leggerezza la genealogia. In italiano la semplice successione delle proposizioni svolge naturalmente questa funzione; «poi» appesantirebbe inutilmente il ritmo.
- source_word: ἐγέννησεν
  choice: generò
  rationale: Nel contesto genealogico indica la procreazione o discendenza paterna. «Generò» è conciso, dignitoso e conserva la formula ripetuta della genealogia.
- source_word: τὸν ἄνδρα Μαρίας
  choice: il marito di Maria
  rationale: Con il genitivo «di Maria», ἀνήρ ha chiaramente senso coniugale; «marito» esplicita correttamente il rapporto.
- source_word: ἐξ ἧς
  choice: dalla quale
  rationale: Il relativo femminile singolare rimanda specificamente a Maria e interrompe intenzionalmente la consueta formula patrilineare. «Dalla quale» conserva sia il riferimento femminile sia la forza di ἐκ.
- source_word: ἐγεννήθη
  choice: nacque
  rationale: Il passivo di γεννάω segna il passaggio dall'atto del generare attribuito agli uomini alla nascita di Gesù da Maria. L'italiano idiomatico «nacque» mantiene questa distinzione senza suggerire che Giuseppe abbia generato Gesù.
- source_word: ὁ λεγόμενος
  choice: che è chiamato
  rationale: Rende esplicitamente la costruzione participiale identificativa e conserva il valore verbale di λέγω.
- source_word: χριστός
  choice: il Messia
  rationale: In questa formula χριστός funziona chiaramente come titolo, non come elemento ormai assimilato a un nome proprio. «Il Messia» ne comunica il valore in italiano corrente.
theological_decisions:
- issue: Resa di Χριστός nella formula identificativa
  choice: il Messia
  alternative: il Cristo
  rationale: La costruzione «Gesù, che è chiamato...» presenta χριστός come titolo. La traduzione «Messia» ne rende trasparente la funzione, mentre una nota conserva l'alternativa tradizionale «Cristo».
- issue: Passaggio dalla generazione di Giuseppe alla nascita di Gesù
  choice: «Giacobbe generò Giuseppe» ma «dalla quale nacque Gesù»
  alternative: una formulazione uniforme con «generò» in entrambe le proposizioni
  rationale: Il greco passa dall'attivo ἐγέννησεν al passivo ἐγεννήθη e usa il relativo femminile ἐξ ἧς riferito a Maria. La traduzione conserva il cambiamento senza aggiungere una spiegazione dottrinale.
translation_notes:
  register: Italiano standard moderno, sobrio e dignitoso. La formulazione conserva il ritmo genealogico, evita arcaismi come «begat» equivalenti e mantiene chiaramente il riferimento femminile a Maria.
