id: MAT.1.6
reference: Matthew 1:6
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Ἰεσσαὶ δὲ ἐγέννησεν τὸν Δαυὶδ τὸν βασιλέα. Δαυὶδ ⸀δὲ ἐγέννησεν τὸν Σολομῶνα ἐκ τῆς τοῦ Οὐρίου,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/006.yaml
  text: Jesse fathered David the king[a]. David fathered Solomon by the wife of Uriah,
translation:
  language: it
  text: Iesse generò Davide, il re. Davide generò Salomone dalla moglie di Uria[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il greco dice letteralmente «dalla [donna] di Uria», espressione ellittica che significa «dalla moglie di Uria». Qui Matteo non nomina Betsabea.
    reason: alternativa lessicale
lexical_decisions:
- source_word: ἐγέννησεν
  choice: generò
  rationale: Nel contesto genealogico γεννάω indica la procreazione o discendenza per linea paterna. «Generò» è conciso, dignitoso e mantiene la struttura ripetitiva della genealogia.
- source_word: τὸν Δαυὶδ τὸν βασιλέα
  choice: Davide, il re
  rationale: L'apposizione con articolo identifica Davide specificamente come «il re», mettendone in risalto la dignità regale.
- source_word: ἐκ τῆς τοῦ Οὐρίου
  choice: dalla moglie di Uria
  rationale: 'L''espressione greca è ellittica: il sostantivo «donna» o «moglie» è sottinteso. La resa italiana esplicita quanto è necessario per la comprensione, ma conserva il riferimento indiretto a Betsabea attraverso Uria.'
- source_word: Ἰεσσαί / Δαυίδ / Σολομών / Οὐρίας
  choice: Iesse / Davide / Salomone / Uria
  rationale: Sono le forme tradizionali e correnti dei nomi biblici in italiano.
- source_word: δέ
  choice: non espresso
  rationale: Qui δέ funge da connettivo lieve tra gli anelli della genealogia. In italiano la successione delle due frasi è già chiara e non richiede una congiunzione esplicita.
theological_decisions:
- issue: Riferimento indiretto di Matteo a Betsabea
  choice: «dalla moglie di Uria»
  alternative: «da Betsabea» oppure «da colei che era stata moglie di Uria»
  rationale: Il testo greco non nomina Betsabea, ma la identifica in rapporto a Uria. Conservare questa formulazione mantiene il richiamo narrativo e morale alla vicenda di 2 Samuele senza attenuarlo né aggiungere un nome assente dal testo.
translation_notes:
  register: Italiano moderno, chiaro e dignitoso. «Generò» conserva il ritmo genealogico e il rapporto paterno espresso dal greco; la virgola finale segnala che la genealogia prosegue nel versetto successivo.
