id: MAT.1.14
reference: Matthew 1:14
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Ἀζὼρ δὲ ἐγέννησεν τὸν Σαδώκ, Σαδὼκ δὲ ἐγέννησεν τὸν Ἀχίμ, Ἀχὶμ δὲ ἐγέννησεν τὸν Ἐλιούδ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/014.yaml
  text: Azor fathered Zadok, Zadok fathered Achim, and Achim fathered Eliud.
translation:
  language: it
  text: Azor generò Sadoc, Sadoc generò Achim e Achim generò Eliud.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀζώρ
  choice: Azor
  rationale: Nome proprio reso secondo la forma tradizionale e corrente nelle Bibbie italiane.
- source_word: δέ
  choice: e / non espresso separatamente
  rationale: Nella genealogia funge da semplice connettivo. La coordinazione è resa esplicitamente prima dell'ultima proposizione; negli altri casi è comunicata naturalmente dalla successione delle clausole.
- source_word: ἐγέννησεν
  choice: generò
  rationale: Nel contesto genealogico indica la generazione o discendenza per linea paterna. «Generò» è conciso, dignitoso e tradizionale, senza il tono arcaico di «begat» in inglese; conserva inoltre l'eventuale ampiezza genealogica della formula.
- source_word: τὸν
  choice: non tradotto separatamente
  rationale: L'articolo accusativo introduce in greco il nome proprio come complemento oggetto, ma in italiano non è richiesto in questa costruzione.
- source_word: Σαδώκ
  choice: Sadoc
  rationale: Forma italiana biblica tradizionale del nome proprio.
- source_word: Ἀχίμ
  choice: Achim
  rationale: Traslitterazione conforme all'uso biblico italiano corrente.
- source_word: Ἐλιούδ
  choice: Eliud
  rationale: Traslitterazione conforme all'uso biblico italiano corrente.
theological_decisions:
- issue: Portata genealogica di ἐγέννησεν
  choice: generò
  alternative: fu padre di
  rationale: «Generò» riproduce la formula genealogica senza stabilire se ogni rapporto indicato sia necessariamente tra padre e figlio immediati; evita quindi di risolvere un'eventuale genealogia abbreviata.
translation_notes:
  register: Italiano moderno standard, sobrio e dignitoso. La ripetizione di «generò» conserva il ritmo genealogico del greco; i nomi seguono le forme comunemente attestate nella tradizione biblica italiana.
