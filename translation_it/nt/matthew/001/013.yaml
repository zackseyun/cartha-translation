id: MAT.1.13
reference: Matthew 1:13
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Ζοροβαβὲλ δὲ ἐγέννησεν τὸν Ἀβιούδ, Ἀβιοὺδ δὲ ἐγέννησεν τὸν Ἐλιακίμ, Ἐλιακὶμ δὲ ἐγέννησεν τὸν Ἀζώρ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/013.yaml
  text: Zerubbabel fathered Abiud[a], Abiud fathered Eliakim, and Eliakim fathered Azor.
translation:
  language: it
  text: Zorobabele generò Abiud[a]; Abiud generò Eliacim; ed Eliacim generò Azor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «fu padre di»; nelle genealogie bibliche, il verbo ripetuto può presentare la discendenza in forma abbreviata.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ζοροβαβέλ
  choice: Zorobabele
  rationale: Forma italiana tradizionale e corrente del nome biblico, coerente con l'uso italiano e con la figura storica sottostante.
- source_word: δέ
  choice: — / ed
  rationale: Nel contesto della genealogia è un connettivo lieve che fa avanzare l'elenco, non un'avversativa. In italiano non occorre ripeterlo in ogni proposizione; «ed» nell'ultima conserva il ritmo cumulativo.
- source_word: ἐγέννησεν
  choice: generò
  rationale: Nella formula genealogica indica la generazione o discendenza per linea paterna. «Generò» è conciso, dignitoso e consolidato nell'italiano biblico senza essere arcaico quanto altre formule.
- source_word: Ἀβιούδ
  choice: Abiud
  rationale: Traslitterazione italiana convenzionale del nome proprio greco.
- source_word: Ἐλιακίμ
  choice: Eliacim
  rationale: Forma italiana convenzionale del nome proprio, adeguata alla forma greca.
- source_word: Ἀζώρ
  choice: Azor
  rationale: Traslitterazione italiana leggibile e convenzionale, senza segni diacritici.
theological_decisions:
- issue: Resa di γεννάω in una genealogia che può omettere alcune generazioni
  choice: generò
  alternative: fu padre di / fu antenato di
  rationale: «Generò» conserva la formula genealogica diretta del greco senza stabilire se ogni passaggio indichi necessariamente una paternità immediata. «Fu antenato di» espliciterebbe troppo la possibile compressione genealogica, mentre «fu padre di» potrebbe suggerire più nettamente un rapporto immediato.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. I nomi seguono le forme bibliche italiane convenzionali; i punti e virgola rendono chiara la struttura ripetitiva della genealogia.
