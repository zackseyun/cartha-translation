source:
  edition: SBLGNT
  text: Σολομὼν δὲ ἐγέννησεν τὸν Ῥοβοάμ, Ῥοβοὰμ δὲ ἐγέννησεν τὸν Ἀβιά, Ἀβιὰ δὲ ἐγέννησεν τὸν ⸂Ἀσάφ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/007.yaml
  text: Solomon fathered Rehoboam[a], Rehoboam fathered Abijah, and Abijah fathered Asaph.
translation:
  language: it
  text: Salomone generò Roboamo; Roboamo generò Abia; e Abia generò Asaf.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alcuni manoscritti leggono «Asa», come il re di Giuda menzionato in 1 Re 15 e 2 Cronache 14–16; il testo greco qui seguito legge «Asaf».
    reason: textual_variant
lexical_decisions:
- source_word: ἐγέννησεν
  choice: generò
  rationale: Nel contesto genealogico indica la procreazione e la discendenza in linea paterna. «Generò» è conciso, dignitoso e tradizionale, ma ancora comprensibile nell’italiano moderno.
- source_word: δὲ
  choice: ; / e
  rationale: Qui δέ è un connettivo lieve che porta avanti la sequenza genealogica, non un’avversativa. La punteggiatura e l’«e» finale rendono naturale la progressione in italiano senza sovraccaricarla.
- source_word: Σολομών
  choice: Salomone
  rationale: Forma italiana standard del nome biblico.
- source_word: Ῥοβοάμ
  choice: Roboamo
  rationale: Forma italiana standard del nome biblico, riconoscibile nel collegamento con l’Antico Testamento.
- source_word: Ἀβιά
  choice: Abia
  rationale: Forma italiana biblica corrente, corrispondente al nome del re di Giuda.
- source_word: Ἀσάφ
  choice: Asaf
  rationale: Riproduce la lezione del testo greco SBLGNT fornito, senza armonizzarla tacitamente con il nome del re Asa nell’Antico Testamento.
theological_decisions:
- issue: Se armonizzare la genealogia di Matteo con l’elenco dei re dell’Antico Testamento traducendo Ἀσάφ come «Asa»
  choice: Mantenere «Asaf» nel testo principale
  alternative: Asa
  rationale: Il testo greco fornito legge Ἀσάφ. La priorità della fonte originale richiede di conservarne la lezione, mentre la variante «Asa», coerente con 1 Re 15 e 2 Cronache 14–16, viene segnalata in nota.
translation_notes:
  register: Italiano moderno standard, naturale e dignitoso. La struttura ripetitiva propria della genealogia è conservata; i punti e virgola rendono leggibile la catena senza eliminare il lieve collegamento espresso da δέ.
