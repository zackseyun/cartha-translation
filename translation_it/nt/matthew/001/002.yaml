id: MAT.1.2
reference: Matthew 1:2
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Ἀβραὰμ ἐγέννησεν τὸν Ἰσαάκ, Ἰσαὰκ δὲ ἐγέννησεν τὸν Ἰακώβ, Ἰακὼβ δὲ ἐγέννησεν τὸν Ἰούδαν καὶ τοὺς ἀδελφοὺς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/002.yaml
  text: Abraham fathered Isaac[a], and Isaac fathered Jacob, and Jacob fathered Judah and his brothers,
translation:
  language: it
  text: Abraamo generò Isacco[a]; Isacco generò Giacobbe; Giacobbe generò Giuda e i suoi fratelli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «fu padre di».
    reason: Alternativa lessicale che esplicita in italiano il valore genealogico di ἐγέννησεν.
lexical_decisions:
- source_word: ἐγέννησεν
  choice: generò
  rationale: Nel contesto genealogico, γεννάω indica la generazione o paternità nella linea di discendenza. «Generò» è la resa italiana tradizionale ma ancora comprensibile, concisa e adatta al registro dignitoso; non impone che ogni rapporto genealogico debba necessariamente essere inteso come privo di eventuali omissioni.
- source_word: δὲ
  choice: punteggiatura coordinante (punto e virgola)
  rationale: Qui δέ è un connettivo debole che scandisce la successione genealogica, non un'avversativa. In italiano la giustapposizione mediante punto e virgola rende con naturalezza la progressione senza introdurre un contrasto inesistente.
- source_word: Ἰούδαν
  choice: Giuda
  rationale: È la forma italiana standard del nome del patriarca, figlio di Giacobbe, e lo distingue nel contesto attraverso il riferimento genealogico.
- source_word: ἀδελφοὺς αὐτοῦ
  choice: i suoi fratelli
  rationale: Il sostantivo è maschile e nel contesto designa gli altri figli maschi di Giacobbe; «fratelli» è preciso e naturale.
- source_word: Ἀβραὰμ / Ἰσαάκ / Ἰακώβ
  choice: Abraamo / Isacco / Giacobbe
  rationale: Si adottano le forme italiane bibliche standard e immediatamente riconoscibili dei nomi propri.
theological_decisions:
- issue: Resa del verbo genealogico
  choice: Usare «generò» nella genealogia
  alternative: «fu padre di» oppure «divenne padre di»
  rationale: «Generò» conserva la forza genealogica e paterna del greco in forma concisa, senza aggiungere affermazioni teologiche sulla natura immediata o eventualmente telescopica della discendenza.
translation_notes:
  register: Italiano moderno standard, dignitoso e scorrevole. La ripetizione di «generò» conserva deliberatamente il ritmo della genealogia; i punti e virgola rappresentano la funzione coordinante debole di δέ senza appesantire la frase con ripetuti «e».
