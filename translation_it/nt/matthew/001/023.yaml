id: MAT.1.23
reference: Matthew 1:23
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Ἰδοὺ ἡ παρθένος ἐν γαστρὶ ἕξει καὶ τέξεται υἱόν, καὶ καλέσουσιν τὸ ὄνομα αὐτοῦ Ἐμμανουήλ· ὅ ἐστιν μεθερμηνευόμενον Μεθ’ ἡμῶν ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/023.yaml
  text: Behold[a], the virgin will conceive and bear a son, and they will call his name Immanuel—which is translated[d][c][b], 'God with us.'
translation:
  language: it
  text: '«Ecco, la vergine concepirà e partorirà un figlio, e lo chiameranno Emmanuele[a]», che, tradotto, significa: «Dio con noi».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il nome può essere traslitterato anche «Emmanuel».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Ecco
  rationale: Conserva la funzione deittica e solenne del richiamo profetico, risultando al tempo stesso naturale nell’italiano biblico moderno.
- source_word: ἡ παρθένος
  choice: la vergine
  rationale: Nel greco di Matteo παρθένος indica normalmente una vergine; inoltre il racconto immediato presenta esplicitamente il concepimento come avvenuto prima dell’unione coniugale.
- source_word: ἐν γαστρὶ ἕξει
  choice: concepirà
  rationale: Rende in italiano corrente l’espressione idiomatica greca, letteralmente «avrà nel grembo», mantenendone il valore futuro.
- source_word: τέξεται υἱόν
  choice: partorirà un figlio
  rationale: Resa diretta, naturale e dignitosa del verbo di parto e del suo complemento.
- source_word: καλέσουσιν τὸ ὄνομα αὐτοῦ
  choice: lo chiameranno
  rationale: Mantiene il futuro attivo e il soggetto plurale indefinito del greco, evitando di trasformarlo in un passivo; in italiano esprime naturalmente l’imposizione o l’uso del nome.
- source_word: Ἐμμανουήλ
  choice: Emmanuele
  rationale: È la forma tradizionale e ampiamente riconoscibile in italiano del nome semitico traslitterato nel testo greco.
- source_word: ὅ ἐστιν μεθερμηνευόμενον
  choice: che tradotto significa
  rationale: Rende con chiarezza e naturalezza la formula esplicativa del participio greco senza appesantirla.
- source_word: Μεθ’ ἡμῶν ὁ θεός
  choice: Dio con noi
  rationale: È la resa italiana concisa e tradizionale del significato del nome, senza aggiunte interpretative.
theological_decisions:
- issue: Valore di παρθένος nel contesto del concepimento di Gesù
  choice: vergine
  alternative: giovane donna
  rationale: Benché la discussione sul testo ebraico di Isaia 7:14 includa l’alternativa «giovane donna», Matteo cita la forma greca παρθένος nel contesto esplicito del concepimento verginale. La resa principale deve quindi seguire il greco e il contesto matteano.
- issue: Portata dell’interpretazione «Dio con noi»
  choice: Conservare la spiegazione nominale senza ampliarla
  alternative: Esplicitare nel versetto una spiegazione dell’incarnazione
  rationale: Matteo stesso traduce il nome. La versione ne preserva il peso teologico, ma non introduce formulazioni dottrinali ulteriori non espresse in questa frase.
- issue: Soggetto di καλέσουσιν
  choice: lo chiameranno
  alternative: sarà chiamato
  rationale: Il plurale indefinito lascia non specificati coloro che useranno il nome. Mantenerlo evita di risolvere l’indeterminatezza autentica del testo.
translation_notes:
  register: Italiano standard moderno, dignitoso e leggibile. «Ecco» conserva il tono profetico; «concepirà» e «partorirà» sono correnti e precisi. Le virgolette distinguono la citazione profetica e la spiegazione del nome.
