id: MAT.15.2
reference: Matthew 15:2
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Διὰ τί οἱ μαθηταί σου παραβαίνουσιν τὴν παράδοσιν τῶν πρεσβυτέρων; οὐ γὰρ νίπτονται τὰς χεῖρας ⸀αὐτῶν ὅταν ἄρτον ἐσθίωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/002.yaml
  text: Why do your disciples break the tradition of the elders? For they do not wash their hands when they eat bread[a][b].
translation:
  language: it
  text: «Perché i tuoi discepoli trasgrediscono la tradizione degli antichi? Infatti non si lavano le mani quando mangiano il pane[a][b]».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Si tratta del lavaggio delle mani previsto dalla tradizione degli antichi, non semplicemente di una questione di normale igiene.
    reason: cultural_note
  - marker: b
    text: 'Oppure: «quando consumano un pasto»; in greco «pane» può talvolta indicare il cibo o un pasto in senso più generale.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τί
  choice: Perché
  rationale: È la resa interrogativa più naturale in italiano moderno per una domanda sulla ragione di un comportamento.
- source_word: παραβαίνουσιν
  choice: trasgrediscono
  rationale: Esprime la violazione di una norma autorevole o di una tradizione; conserva la forza del verbo greco senza ridurlo al semplice mancato rispetto di un'usanza.
- source_word: τὴν παράδοσιν
  choice: la tradizione
  rationale: Indica ciò che è stato tramandato e ricevuto con valore autorevole; «tradizione» è preciso e corrente.
- source_word: τῶν πρεσβυτέρων
  choice: degli anziani
  rationale: Nel contesto designa autorevoli predecessori e maestri della tradizione giudaica, non semplicemente persone avanti negli anni.
- source_word: οὐ γὰρ νίπτονται τὰς χεῖρας αὐτῶν
  choice: Infatti non si lavano le mani
  rationale: La costruzione riflessiva italiana rende naturalmente il lavarsi le proprie mani; «infatti» conserva il valore esplicativo di γάρ.
- source_word: ὅταν
  choice: quando
  rationale: Con il congiuntivo presente greco introduce una circostanza abituale; «quando» è naturale e il contesto comunica la ripetitività.
- source_word: ἄρτον
  choice: il pane
  rationale: Mantiene il significato letterale del termine greco, lasciando in nota la possibile estensione metonimica a un pasto.
- source_word: ἐσθίωσιν
  choice: mangiano
  rationale: Il presente italiano rende bene l'azione abituale espressa dalla proposizione temporale greca.
theological_decisions:
- issue: Natura del lavaggio delle mani
  choice: Il testo principale presenta la questione come violazione della tradizione degli anziani, senza qualificare esplicitamente il lavaggio come rituale o igienico.
  alternative: Esplicitare nel testo «lavaggio rituale» oppure interpretarlo come normale igiene.
  rationale: Il versetto collega direttamente la pratica alla tradizione degli anziani ma non ne definisce ulteriormente la natura; la nota fornisce il contesto senza eliminare l'ambiguità del testo.
translation_notes:
  register: Italiano moderno, chiaro e dignitoso. «Trasgrediscono» conserva l'autorevolezza attribuita alla tradizione senza risultare arcaico; «mangiano il pane» mantiene la formulazione concreta del greco, chiarita da una nota.
