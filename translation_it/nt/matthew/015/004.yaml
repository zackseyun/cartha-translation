id: MAT.15.4
reference: Matthew 15:4
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ὁ γὰρ θεὸς ⸀εἶπεν· Τίμα τὸν πατέρα καὶ τὴν μητέρα, καί· Ὁ κακολογῶν πατέρα ἢ μητέρα θανάτῳ τελευτάτω·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/004.yaml
  text: For God said[a], ‘Honor your father and your mother,’ and, ‘Whoever speaks evil of father or mother must surely die.’
translation:
  language: it
  text: 'Dio infatti ha detto: «Onora tuo padre e tua madre», e: «Chi maledice il padre o la madre deve morire[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «sia messo a morte».'
    reason: La formula greca esprime solennemente la pena di morte, ma non indica in modo esplicito chi debba eseguirla.
lexical_decisions:
- source_word: ὁ γὰρ θεὸς
  choice: Dio infatti
  rationale: «Infatti» conserva il valore esplicativo di γάρ e collega naturalmente la citazione all’argomentazione precedente.
- source_word: εἶπεν
  choice: ha detto
  rationale: Rende il senso ordinario di λέγω nell’introdurre una citazione scritturale, senza rafforzarlo interpretativamente in «ha comandato».
- source_word: Τίμα
  choice: Onora
  rationale: «Onora» esprime il riconoscimento dovuto ai genitori e mantiene il peso etico tradizionale del comandamento.
- source_word: τὸν πατέρα καὶ τὴν μητέρα
  choice: tuo padre e tua madre
  rationale: Il possessivo, naturale in italiano nella formulazione del comandamento, è implicito nel testo citato e non ne modifica il senso.
- source_word: Ὁ κακολογῶν
  choice: Chi maledice
  rationale: κακολογέω può indicare il maledire, l’oltraggiare o il parlare ingiuriosamente contro qualcuno. «Chi maledice» è conciso, comprensibile e adatto alla gravità della norma citata.
- source_word: πατέρα ἢ μητέρα
  choice: il padre o la madre
  rationale: Gli oggetti sono formulati genericamente; gli articoli italiani rendono la relazione familiare senza introdurre un soggetto maschile mediante «suo».
- source_word: θανάτῳ τελευτάτω
  choice: deve morire
  rationale: Rende in italiano naturale la solenne formula di pena capitale, conservandone la gravità senza specificare un agente dell’esecuzione che il greco non esprime direttamente.
theological_decisions:
- issue: Resa della formula legale θανάτῳ τελευτάτω
  choice: deve morire
  alternative: sia messo a morte
  rationale: La formulazione principale mantiene la severità della pena prevista dalla legge citata, ma evita di rendere esplicita l’azione di esecutori umani. La nota conserva l’altra lettura idiomatica possibile.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. La struttura parallela delle due citazioni è mantenuta; «Dio infatti ha detto» conserva il nesso argomentativo, mentre la nota segnala senza risolverla indebitamente l’ambiguità relativa all’agenzia nella formula penale.
