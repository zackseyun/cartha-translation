  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ὑμεῖς δὲ λέγετε· Ὃς ἂν εἴπῃ τῷ πατρὶ ἢ τῇ μητρί· Δῶρον ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/005.yaml
  text: But you say[a], ‘Whoever says to his father or his mother, “Whatever you would have benefited from me is a gift,”’
translation:
  language: it
  text: 'Voi invece dite: «Chiunque dica al padre o alla madre: “Ciò che avresti potuto ricevere da me come aiuto è un dono[a]”»,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «un’offerta». Il senso è che ciò che avrebbe potuto essere usato per sostenere i propri genitori viene dichiarato consacrato a Dio; si confronti Marco 7:11, dove compare il termine «korbàn».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς δὲ λέγετε
  choice: Voi invece dite
  rationale: Il pronome espresso conserva l’enfasi di ὑμεῖς, mentre «invece» rende il contrasto introdotto da δέ con il comandamento citato in precedenza.
- source_word: Ὃς ἂν εἴπῃ
  choice: Chiunque dica
  rationale: Il relativo con ἄν e il congiuntivo aoristo esprime un caso generale indefinito; «chiunque dica» ne conserva naturalmente il valore.
- source_word: τῷ πατρὶ ἢ τῇ μητρί
  choice: al padre o alla madre
  rationale: Il dativo indica il destinatario. In italiano il possessivo non è necessario e il riferimento familiare resta chiaro.
- source_word: Δῶρον
  choice: un dono
  rationale: «Dono» è il significato diretto di δῶρον e non introduce nel testo di Matteo il termine tecnico «korbàn», presente nel parallelo di Marco.
- source_word: ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς
  choice: ciò con cui avresti potuto ricevere aiuto da me
  rationale: La formulazione conserva il valore passivo di ὠφεληθῇς, la provenienza espressa da ἐξ ἐμοῦ e l’idea dell’aiuto che il genitore avrebbe potuto ricevere.
theological_decisions:
- issue: Se inserire nel testo di Matteo il termine tecnico «korbàn»
  choice: Mantenere «un dono» nel testo e spiegare in nota la dedicazione a Dio
  alternative: «un’offerta» oppure «korbàn»
  rationale: Matteo usa δῶρον, non κορβᾶν. La resa segue il testo greco senza importare la terminologia del parallelo di Marco, pur chiarendo in nota l’implicazione cultuale.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. La costruzione mantiene la forma di citazione incompleta del versetto, che prosegue nel contesto, e conserva senza appianarla la formulazione giuridico-religiosa del detto.
