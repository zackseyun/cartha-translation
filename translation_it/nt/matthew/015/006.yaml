  text: ⸀οὐ μὴ ⸀τιμήσει τὸν πατέρα ⸀αὐτοῦ· καὶ ἠκυρώσατε ⸂τὸν λόγον⸃ τοῦ θεοῦ διὰ τὴν παράδοσιν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/006.yaml
  text: he certainly need not honor his father[b][a]. And you have nullified the word of God for the sake of your tradition.
translation:
  language: it
  text: non dovrà certo onorare suo padre[b]. E avete annullato la parola di Dio[a] a causa della vostra tradizione.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alcuni manoscritti hanno «il comandamento di Dio» invece di «la parola di Dio».
    reason: textual_variant
  - marker: b
    text: Qui «onorare» probabilmente comprende il dovere concreto di provvedere ai propri genitori, non soltanto quello di mostrare loro rispetto.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μὴ
  choice: non dovrà certo
  rationale: La doppia negazione enfatica rafforza l'esenzione dall'obbligo espressa, nel contesto, dalla norma tradizionale; la formulazione conserva anche il futuro di τιμήσει.
- source_word: τιμήσει
  choice: onorare
  rationale: «Onorare» mantiene il richiamo lessicale al comandamento, senza restringere il verbo al solo sostegno materiale, che il contesto comunque implica.
- source_word: πατέρα αὐτοῦ
  choice: suo padre
  rationale: Riproduce il singolare esplicito del testo greco senza armonizzarlo con il contesto più ampio, che menziona anche la madre.
- source_word: ἠκυρώσατε
  choice: avete annullato
  rationale: Esprime con chiarezza la forte idea di rendere invalida o priva di efficacia la parola divina.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: la parola di Dio
  rationale: Segue direttamente la lezione λόγον del SBLGNT; la variante «comandamento» è segnalata in nota.
- source_word: διὰ τὴν παράδοσιν ὑμῶν
  choice: a causa della vostra tradizione
  rationale: 'διά con l''accusativo indica qui la causa: la loro tradizione è ciò per cui la parola di Dio viene annullata.'
- source_word: καί
  choice: E così
  rationale: Mantiene il collegamento coordinante e rende naturale in italiano la conseguenza argomentativa del comportamento appena descritto.
theological_decisions:
- issue: Se esplicitare che «onorare» comprende il sostegno materiale ai genitori
  choice: Mantenere «onorare» nel testo e chiarirne la probabile portata pratica in nota.
  alternative: Tradurre «provvedere a» o «sostenere».
  rationale: Il verbo greco è τιμάω e richiama il comandamento; una resa più specifica eliminerebbe parte della sua ampiezza semantica.
- issue: Se armonizzare il versetto con il contesto o con varianti testuali
  choice: Tradurre «suo padre» e «la parola di Dio» secondo il testo SBLGNT.
  alternative: Ampliare in «suo padre o sua madre» oppure adottare «il comandamento di Dio».
  rationale: La traduzione segue la forma greca fornita e conserva l'alternativa testuale significativa in nota anziché inserirla nel testo.
translation_notes:
  register: Italiano moderno standard, naturale e dignitoso. «Non dovrà certo» conserva l'enfasi della negazione greca senza risultare arcaico; «a causa della vostra tradizione» esprime chiaramente il rapporto causale.
