  text: Τότε προσέρχονται τῷ ⸀Ἰησοῦ ἀπὸ Ἱεροσολύμων ⸂Φαρισαῖοι καὶ γραμματεῖς⸃ λέγοντες
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/001.yaml
  text: Then Pharisees and scribes from Jerusalem come to Jesus[a], saying[b],
translation:
  language: it
  text: 'Allora si avvicinano a Gesù[a] farisei e scribi[b] venuti da Gerusalemme e gli dicono:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «si presentano a Gesù».
    reason: lexical_alternative
  - marker: b
    text: In questo contesto, «scribi» può indicare esperti o maestri della Legge.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Allora
  rationale: Segnale temporale-discorsivo naturale in italiano, che introduce il nuovo episodio mantenendo la continuità narrativa.
- source_word: προσέρχονται
  choice: si avvicinano
  rationale: Rende direttamente il movimento verso Gesù e conserva il presente storico del greco.
- source_word: τῷ Ἰησοῦ
  choice: a Gesù
  rationale: Il dativo indica la persona alla quale ci si avvicina.
- source_word: ἀπὸ Ἱεροσολύμων
  choice: venuti da Gerusalemme
  rationale: Esprime con naturalezza la provenienza; il participio italiano chiarisce senza attribuire loro un incarico ufficiale non esplicitato.
- source_word: Φαρισαῖοι
  choice: farisei
  rationale: Designazione storica e religiosa corrente nell'italiano biblico moderno.
- source_word: γραμματεῖς
  choice: scribi
  rationale: Conserva il termine storico tradizionale; nel contesto può indicare esperti o maestri della Legge, precisazione affidata alla nota.
- source_word: καὶ
  choice: e
  rationale: Coordina semplicemente i due gruppi.
- source_word: λέγοντες
  choice: e gli dicono
  rationale: Trasforma idiomaticamente il participio greco in un verbo coordinato, mantenendo il presente narrativo e introducendo il discorso diretto del versetto seguente.
theological_decisions:
- issue: Presente storico narrativo
  choice: Conservare il presente («si avvicinano», «dicono»)
  alternative: Usare il passato remoto («si avvicinarono», «dissero»)
  rationale: Il greco impiega il presente storico per dare immediatezza alla scena; anche in italiano il presente narrativo risulta comprensibile e naturale.
- issue: Identità e funzione dei γραμματεῖς
  choice: «scribi» nel testo, con spiegazione in nota
  alternative: «esperti della Legge» o «maestri della Legge» nel testo
  rationale: «Scribi» preserva la designazione storica senza restringere eccessivamente la funzione del gruppo; la nota rende accessibile il valore contestuale.
translation_notes:
  register: Italiano moderno, dignitoso e narrativamente scorrevole. L'aggiunta di «alcuni» rende naturale il soggetto plurale senza suggerire che fossero presenti tutti i farisei e tutti gli scribi; «venuti da Gerusalemme» mantiene la provenienza senza implicare un mandato ufficiale. I marcatori di nota sono collocati nel testo principale.
