id: MAT.15.3
reference: Matthew 15:3
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Διὰ τί καὶ ὑμεῖς παραβαίνετε τὴν ἐντολὴν τοῦ θεοῦ διὰ τὴν παράδοσιν ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/003.yaml
  text: But he answered and said to them[a], “Why do you also transgress the commandment of God for the sake of your tradition?”
translation:
  language: it
  text: 'Ma egli rispose loro: «E voi, perché trasgredite il comandamento di Dio per la vostra tradizione?»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oppure «a causa della vostra tradizione».
    reason: Alternativa lessicale per διὰ con l'accusativo; «per» può esprimere sia il motivo sia ciò in favore di cui avviene l'azione.
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς
  choice: Ma egli rispose loro
  rationale: La costruzione participio + verbo finito è una formula narrativa di influsso semitico. In italiano «rispose loro» ne comunica naturalmente il senso senza la ridondanza poco idiomatica di «rispondendo disse loro»; δέ introduce qui una replica in contrasto con l'accusa precedente.
- source_word: Διὰ τί
  choice: perché
  rationale: È l'equivalente interrogativo corrente e diretto per una domanda sulla ragione.
- source_word: καὶ ὑμεῖς
  choice: E voi
  rationale: 'La collocazione iniziale mette in rilievo il contrappunto: dopo l''accusa rivolta ai discepoli, Gesù la ribalta sugli interlocutori. «E voi» rende in modo naturale il valore di καί senza sovraccaricarlo.'
- source_word: παραβαίνετε
  choice: trasgredite
  rationale: Il verbo indica il superamento o la violazione di un limite normativo. «Trasgredite» mantiene il registro morale e giuridico del contesto ed è più preciso di «non osservate».
- source_word: τὴν ἐντολὴν τοῦ θεοῦ
  choice: il comandamento di Dio
  rationale: «Comandamento» conserva il registro biblico e il contrasto formale fra l'autorità divina e la tradizione degli interlocutori.
- source_word: διὰ τὴν παράδοσιν ὑμῶν
  choice: a causa della vostra tradizione
  rationale: διά con l'accusativo esprime qui la ragione o il motivo della trasgressione. «A causa di» è chiaro e naturale; «vostra tradizione» mantiene specifica la critica, senza trasformarla in una condanna generale di ogni tradizione.
theological_decisions:
- issue: Contrasto fra il comandamento divino e la tradizione umana
  choice: «il comandamento di Dio» contrapposto a «la vostra tradizione»
  alternative: «il comando di Dio» contrapposto a «la vostra usanza» o «il vostro insegnamento»
  rationale: La formulazione conserva il contrasto esplicito del testo fra ciò che Dio comanda e ciò che gli interlocutori hanno ricevuto e tramandato, senza attribuire al versetto una condanna indiscriminata di ogni tradizione.
- issue: Valore di διά con l'accusativo
  choice: «a causa della vostra tradizione»
  alternative: «per la vostra tradizione» o «per amore della vostra tradizione»
  rationale: Il valore causale è il più immediato nel contesto; la nota segnala però che la preposizione può essere resa in modo da suggerire anche che la tradizione venga favorita o salvaguardata a spese del comandamento.
translation_notes:
  register: Italiano standard moderno, diretto ma dignitoso. «Ma egli rispose loro» evita una riproduzione legnosa della formula greca, mentre «trasgredite» e «comandamento» conservano il tono solenne e accusatorio. La domanda con «E voi» rende con naturale enfasi il ribaltamento polemico.
