  source_fidelity: Il testo rende fedelmente la domanda polemica di Gesù, il rilievo di καὶ ὑμεῖς («E voi») e il contrasto fra il comandamento di Dio e la tradizione degli interlocutori. Per διὰ con l'accusativo, tuttavia, «per la vostra tradizione» riproduce meglio e senza restringerla l'oscillazione contestuale fra motivo e interesse/fine; «a causa di» privilegia il solo valore causale.
  naturalness: La formulazione è italiana standard, chiara e di registro appropriato. «Ma egli rispose loro» è naturale; non è necessario calcare «rispondendo disse». «Trasgredite il comandamento di Dio» conserva un tono biblico sobrio e corrente.
  terminology: «Comandamento di Dio», «trasgredite» e «tradizione» sono scelte terminologicamente precise. La resa rivista di διὰ evita che la tradizione appaia soltanto come una causa involontaria, lasciando emergere l'accusa di anteporla al comandamento.
