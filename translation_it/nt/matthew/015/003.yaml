- from: 'Ma egli rispose loro: «E voi, perché trasgredite il comandamento di Dio a causa della vostra tradizione?[a]»'
  to: 'Ma egli rispose loro: «E voi, perché trasgredite il comandamento di Dio per la vostra tradizione?»[a]'
  rationale: Si sostituisce «a causa della vostra tradizione» con «per la vostra tradizione» per mantenere l'ampiezza semantica di διὰ con l'accusativo nel contesto, e si riduce la nota a un'alternativa traduttiva non interpretativa. Il marcatore di nota viene collocato dopo la chiusura della citazione e della domanda, così che si riferisca all'intera resa della locuzione finale.
