  verdict: revise
  source_fidelity: Il greco presenta un participio aoristo medio, προσκαλεσάμενος, con Gesù come soggetto che convoca la folla presso di sé, seguito da εἶπεν. «Avendo chiamato a sé la folla» conserva in italiano moderno sia l'anteriorità implicata sia il rapporto participiale, senza introdurre un'esplicita scansione temporale più forte del testo fonte. «Ascoltate e comprendete» rende fedelmente i due imperativi presenti plurali Ἀκούετε καὶ συνίετε.
  naturalness: 'La formulazione proposta nel testo riveduto è naturale, sobria e di registro adatto. La lezione del progetto, «chiamata a sé la folla», è ambigua e poco naturale nell''italiano moderno: formalmente può far apparire «la folla» come soggetto paziente del participio anziché oggetto dell''azione compiuta da Gesù.'
  terminology: «Folla», «disse loro», «ascoltate» e «comprendete» sono appropriati. La nota conserva correttamente «Udite» quale alternativa più letterale per il valore uditivo di ἀκούετε, senza suggerire una differenza teologica.
