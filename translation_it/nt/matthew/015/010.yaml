    rationale: In italiano moderno il participio «chiamata», concordato al femminile con «folla», non rende chiaramente che il soggetto sottinteso (Gesù) ha chiamato la folla a sé. «Avendo chiamato a sé la folla» esplicita correttamente l'azione attiva del participio greco senza alterare il significato.
  - severity: low
