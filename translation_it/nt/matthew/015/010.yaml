  text: And calling the crowd to him[a], he said to them, “Listen and understand.”
translation:
  language: it
  text: 'E, avendo chiamato a sé la folla, disse loro: «Ascoltate[a] e comprendete».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «Udite».'
    reason: Alternativa lessicale che riflette più letteralmente il valore uditivo di Ἀκούετε, pur risultando meno corrente nell'italiano contemporaneo.
lexical_decisions:
- source_word: Καὶ
  choice: E
  rationale: Mantiene il semplice collegamento narrativo del greco senza aggiungere una sfumatura temporale.
- source_word: προσκαλεσάμενος
  choice: chiamata a sé
  rationale: Il participio aoristo medio indica che Gesù convoca la folla presso di sé; la costruzione italiana conserva in modo naturale la subordinazione al verbo principale.
- source_word: τὸν ὄχλον
  choice: la folla
  rationale: Resa corrente e precisa per un insieme di persone radunate.
- source_word: εἶπεν αὐτοῖς
  choice: disse loro
  rationale: Riproduce direttamente il verbo del dire e il destinatario espresso dal pronome.
- source_word: Ἀκούετε
  choice: Ascoltate
  rationale: L'imperativo presente plurale esorta a prestare attenzione; «ascoltate» è più naturale dell'italiano «udite» nel registro moderno.
- source_word: συνίετε
  choice: comprendete
  rationale: Esprime l'atto di afferrare il significato, distinto dal semplice ascoltare.
theological_decisions: []
translation_notes:
  register: Italiano moderno, dignitoso e scorrevole. La struttura participiale è conservata senza introdurre esplicitamente «dopo», e la coppia imperativa mantiene la distinzione tra ascolto e comprensione.
