  source_fidelity: La resa conserva accuratamente il contrasto di δέ («Ma»), l’enfasi iniziale di μάτην («invano»), il senso cultuale di σέβονταί με («mi rendono culto») e il participio modale «insegnando». «Comandamenti umani» riproduce bene ἐντάλματα ἀνθρώπων, mantenendo il contrasto tra origine umana e divina senza introdurre un riferimento esclusivamente maschile. «Come dottrine» rende in modo chiaro e fedele la costruzione concentrata διδασκαλίας ἐντάλματα ἀνθρώπων.
  naturalness: «Ma invano mi rendono culto, insegnando come dottrine comandamenti umani» è italiano moderno standard, scorrevole e di registro appropriato a una citazione profetica. L’anteposizione di «invano» è naturale e conserva l’enfasi del greco.
