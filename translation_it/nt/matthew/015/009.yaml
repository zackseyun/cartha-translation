  text: But they worship me in vain[b][a], teaching as doctrines the commandments of men.
translation:
  language: it
  text: Ma invano mi rendono culto, insegnando come dottrine comandamenti umani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «insegnando dottrine che sono comandamenti umani».'
