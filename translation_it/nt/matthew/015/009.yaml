lexical_decisions:
- source_word: μάτην
  choice: invano
  rationale: Esprime l’idea di un culto privo di valore o risultato ed è l’equivalente italiano più naturale e consolidato.
- source_word: δὲ
  choice: Ma
  rationale: Segnala un lieve contrasto e si accorda con il tono di rimprovero del contesto.
- source_word: σέβονταί με
  choice: mi rendono culto
  rationale: σέβομαι, con Dio come oggetto, indica venerazione o adorazione; «rendere culto» è naturale, dignitoso e adeguato al contesto.
- source_word: διδάσκοντες
  choice: insegnando
  rationale: Mantiene il legame participiale con la proposizione principale senza precisarne eccessivamente il valore temporale o causale.
- source_word: διδασκαλίας
  choice: come dottrine
  rationale: 'Rende esplicito in italiano il rapporto sintattico compresso: i comandamenti di origine umana vengono impartiti con autorità dottrinale.'
- source_word: ἐντάλματα ἀνθρώπων
  choice: comandamenti umani
  rationale: «Comandamenti» conserva il carattere prescrittivo e religioso; «umani» esprime naturalmente il genitivo generico e il contrasto con ciò che viene da Dio.
theological_decisions:
- issue: Rapporto sintattico tra διδασκαλίας e ἐντάλματα ἀνθρώπων
  choice: insegnando come dottrine comandamenti umani
  alternative: insegnando dottrine che sono comandamenti umani
  rationale: Il greco, ripreso dalla citazione profetica, è conciso e ammette più formulazioni. La resa scelta comunica che prescrizioni di origine umana vengono insegnate come dottrine, senza specificare ulteriormente la natura della loro autorità.
- issue: Valore generico di ἀνθρώπων
  choice: umani
  alternative: degli uomini
  rationale: Il termine non è riferito specificamente ai maschi, ma contrappone l’origine umana a quella divina. «Umani» conserva con chiarezza questo contrasto nel moderno italiano standard.
translation_notes:
  register: Italiano moderno standard, conciso e dignitoso. «Mi rendono culto» evita sia un’espressione eccessivamente colloquiale sia una sfumatura limitata al solo rispetto; «comandamenti umani» rende in modo inclusivo e naturale il contrasto tra origine umana e divina.
