  text: ὑποκριταί, καλῶς ἐπροφήτευσεν περὶ ὑμῶν Ἠσαΐας λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/007.yaml
  text: 'Hypocrites[a], Isaiah rightly prophesied about you, saying:'
translation:
  language: it
  text: 'Ipocriti, Isaia profetizzò giustamente riguardo a voi, dicendo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑποκριταί
  choice: Ipocriti
  rationale: Vocativo plurale diretto e incisivo; «Ipocriti» conserva senza attenuarla la forza della denuncia di Gesù.
- source_word: καλῶς
  choice: giustamente
  rationale: L’avverbio qualifica il profetizzare di Isaia come appropriato e vero in rapporto agli interlocutori; «giustamente» è naturale nell’italiano moderno.
- source_word: ἐπροφήτευσεν
  choice: profetizzò
  rationale: Resa diretta dell’aoristo di προφητεύω, mantenendo il registro profetico e il riferimento a Isaia.
- source_word: περὶ ὑμῶν
  choice: riguardo a voi
  rationale: Rende περί con il genitivo in modo preciso e idiomatico, senza suggerire necessariamente che gli interlocutori fossero gli unici referenti storici originari.
- source_word: Ἠσαΐας
  choice: Isaia
  rationale: Forma italiana tradizionale e standard del nome del profeta.
- source_word: λέγων
  choice: 'dicendo:'
  rationale: Il participio presente introduce direttamente la citazione successiva; i due punti ne chiariscono la funzione.
theological_decisions:
- issue: Forza dell’appellativo rivolto da Gesù agli scribi e ai farisei
  choice: «Ipocriti» come vocativo di condanna diretto
  alternative: Una formulazione attenuata come «Simulatori» o «Falsi»
  rationale: Il greco ὑποκριταί esprime qui una forte accusa morale e religiosa; attenuarlo indebolirebbe sia il giudizio di Gesù sia il nesso con la citazione di Isaia.
- issue: Portata di καλῶς in relazione alla profezia
  choice: «profetizzò giustamente riguardo a voi»
  alternative: «profetizzò bene riguardo a voi»
  rationale: «Giustamente» comunica che la profezia si applica in modo appropriato e veritiero agli interlocutori, evitando l’ambiguità stilistica che «bene» potrebbe avere in italiano.
translation_notes:
  register: Italiano moderno standard, dignitoso e diretto. La frase conserva la concisione e l’asprezza del vocativo greco, nonché la struttura che introduce la citazione seguente.
