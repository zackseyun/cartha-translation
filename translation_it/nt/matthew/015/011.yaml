id: MAT.15.11
reference: Matthew 15:11
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: οὐ τὸ εἰσερχόμενον εἰς τὸ στόμα κοινοῖ τὸν ἄνθρωπον, ἀλλὰ τὸ ἐκπορευόμενον ἐκ τοῦ στόματος τοῦτο κοινοῖ τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/011.yaml
  text: It is not what enters into the mouth that defiles the man[b][a], but what comes out of the mouth—this defiles the man.
translation:
  language: it
  text: 'Non è ciò che entra nella bocca a rendere impuro l’uomo[a], ma ciò che esce dalla bocca: questo rende impuro l’uomo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Qui «l’uomo» indica genericamente l’essere umano, cioè ogni persona.
    reason: cultural_note
lexical_decisions:
- source_word: κοινοῖ
  choice: rende impuro
  rationale: Nel contesto delle norme di purità, κοινόω indica il rendere qualcuno impuro o contaminato. «Rende impuro» conserva con chiarezza il valore cultuale e morale senza suggerire semplice sporcizia fisica.
- source_word: τὸ εἰσερχόμενον εἰς τὸ στόμα
  choice: ciò che entra nella bocca
  rationale: Il participio articolato ha valore sostantivato; «ciò che entra» è naturale in italiano e mantiene l’immagine concreta espressa da εἰς τὸ στόμα.
- source_word: τὸ ἐκπορευόμενον ἐκ τοῦ στόματος
  choice: ciò che esce dalla bocca
  rationale: La resa idiomatica del participio sostantivato conserva sia il movimento verso l’esterno sia la ripetizione di «bocca» presente nel greco.
- source_word: ἄνθρωπον
  choice: l’uomo
  rationale: Ἄνθρωπος al singolare indica qui l’essere umano in senso rappresentativo. «L’uomo» conserva la forma singolare del testo, mentre una nota ne esplicita il valore generico.
- source_word: τοῦτο
  choice: questo
  rationale: Il dimostrativo è mantenuto esplicitamente per preservare l’enfasi greca sulla seconda realtà contrapposta.
- source_word: οὐ ... ἀλλὰ
  choice: Non è ... ma ...
  rationale: Questa costruzione italiana rende in modo naturale e netto l’antitesi formulata nel testo greco.
theological_decisions:
- issue: Valore di purità di κοινόω
  choice: «rendere impuro»
  alternative: «contaminare»
  rationale: «Rendere impuro» richiama direttamente il contesto della purità senza limitare la frase alla sola impurità rituale; lascia quindi intatta la tensione tra dimensione cultuale e morale.
- issue: Valore generico di ἄνθρωπον
  choice: «l’uomo» con nota esplicativa
  alternative: «la persona»
  rationale: La forma singolare del greco viene conservata, ma la nota impedisce che sia intesa come riferita esclusivamente al sesso maschile.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. La struttura antitetica e la ripetizione finale sono conservate; i due punti rendono l’enfasi di τοῦτο senza aggiungere contenuto.
