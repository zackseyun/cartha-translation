  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ⸂Ὁ λαὸς οὗτος⸃ τοῖς χείλεσίν με τιμᾷ, ἡ δὲ καρδία αὐτῶν πόρρω ἀπέχει ἀπ’ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/008.yaml
  text: This people honors me with their lips[a], but their heart is far from me.
translation:
  language: it
  text: Questo popolo mi onora con le labbra, ma il suo cuore è lontano da me.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «ma i loro cuori sono lontani da me». Il greco ha «cuore» al singolare, probabilmente in senso collettivo, riferito al popolo nel suo insieme.'
    reason: alternativa lessicale e chiarimento del singolare collettivo
lexical_decisions:
- source_word: Ὁ λαὸς οὗτος
  choice: Questo popolo
  rationale: «Popolo» conserva il valore collettivo di λαός, mentre «questo» rende la forza dimostrativa di οὗτος e mantiene l'eco della citazione profetica.
- source_word: τοῖς χείλεσίν
  choice: con le labbra
  rationale: Il dativo ha valore strumentale. La resa conserva l'immagine corporea concreta senza sostituirla con «parole» o «discorsi».
- source_word: με τιμᾷ
  choice: mi onora
  rationale: τιμάω indica qui il rendere onore; «mi onora» è una resa diretta, naturale e non enfatica.
- source_word: ἡ δὲ καρδία αὐτῶν
  choice: ma il suo cuore
  rationale: Il singolare «cuore» rispecchia καρδία e presenta il popolo collettivamente; il possessivo singolare «suo» concorda naturalmente in italiano con «questo popolo». δέ è avversativo e viene reso con «ma».
- source_word: πόρρω ἀπέχει ἀπ’ ἐμοῦ
  choice: è lontano da me
  rationale: La formulazione esprime in italiano corrente la distanza indicata da πόρρω e ἀπέχει ἀπό, conservandone anche la valenza relazionale.
theological_decisions:
- issue: Singolare collettivo «cuore» o plurale distributivo
  choice: 'Mantenere il singolare: «il suo cuore»'
  alternative: «i loro cuori»
  rationale: Il greco usa il singolare καρδία e raffigura il popolo come un corpo collettivo con una disposizione interiore comune. Il singolare conserva la tensione retorica della citazione senza distribuirla interpretativamente fra i singoli.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. La struttura resta vicina al greco, ma il possessivo è adattato alla naturale concordanza italiana con il nome collettivo «popolo».
