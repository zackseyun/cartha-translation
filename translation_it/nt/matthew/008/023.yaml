  text: Καὶ ἐμβάντι αὐτῷ ⸀εἰς πλοῖον ἠκολούθησαν αὐτῷ οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/023.yaml
  text: And when he got into the boat[b][a], his disciples followed him.
translation:
  language: it
  text: Quando salì su una barca[a], i suoi discepoli lo seguirono.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oppure «sulla barca». Il greco dice semplicemente «in/su una barca», senza articolo; nel contesto narrativo italiano può anche rendersi con l'articolo determinativo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβάντι
  choice: mentre saliva
  rationale: Il participio aoristo, concordato con αὐτῷ, esprime una circostanza temporale rispetto al verbo principale. «Mentre saliva» è naturale in italiano e conserva una possibile contemporaneità narrativa, senza irrigidire il rapporto in un esplicito «dopo che».
- source_word: πλοῖον
  choice: sulla barca
  rationale: Nel contesto del lago di Galilea, «barca» è più naturale di «nave». Benché il greco non abbia qui l'articolo, l'italiano narrativo può usare l'articolo determinativo per un'imbarcazione identificabile dal contesto; la costruzione idiomatica italiana è «salire sulla barca».
- source_word: ἠκολούθησαν
  choice: seguirono
  rationale: «Seguire» rende il movimento fisico e conserva al tempo stesso la risonanza del discepolato propria del verbo in Matteo, senza esplicitarla oltre il testo.
- source_word: μαθηταὶ
  choice: discepoli
  rationale: È il termine italiano consueto per i μαθηταί di Gesù e ne conserva la relazione personale e formativa.
- source_word: αὐτῷ ... αὐτῷ ... αὐτοῦ
  choice: saliva ... lo ... suoi
  rationale: I pronomi rimandano tutti a Gesù. In italiano il primo referente è naturalmente incorporato nel soggetto sottinteso di «saliva», mentre gli altri sono resi con «lo» e «suoi».
theological_decisions:
- issue: Possibile risonanza del discepolato in ἀκολουθέω
  choice: «lo seguirono»
  alternative: «andarono con lui» oppure «lo accompagnarono»
  rationale: Il contesto descrive uno spostamento concreto, ma «seguirono» mantiene anche la risonanza discepolare del lessico matteano senza trasformare la frase in una parafrasi teologica esplicita.
translation_notes:
  register: Italiano standard moderno, scorrevole e dignitoso. «Poi» rende il valore continuativo di Καί all'inizio della nuova scena. La formulazione evita un tono arcaico e mantiene l'ambiguità temporale del participio greco.
