id: MAT.8.11
reference: Matthew 8:11
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι πολλοὶ ἀπὸ ἀνατολῶν καὶ δυσμῶν ἥξουσιν καὶ ἀνακλιθήσονται μετὰ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ ἐν τῇ βασιλείᾳ τῶν οὐρανῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/011.yaml
  text: But I tell you that many will come from east and west and will recline at table with Abraham and Isaac and Jacob in the kingdom of heaven[a][b].
translation:
  language: it
  text: Ma io vi dico che molti verranno da oriente e da occidente e si metteranno a tavola[a] con Abraamo, Isacco e Giacobbe nel regno dei cieli.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Più letteralmente, «si adageranno»: nell''antichità si prendeva posto reclinati durante i banchetti.'
    reason: cultural_note
  - marker: b
    text: L'espressione «da oriente e da occidente» indica persone provenienti da regioni lontane e, nel contesto, può includere persone esterne a Israele.
    reason: cross_reference
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Ma io vi dico
  rationale: δέ introduce qui un lieve contrasto o sviluppo rispetto a quanto precede; «Ma io vi dico» è naturale e conserva il rilievo enfatico del pronome implicito nel verbo.
- source_word: πολλοὶ
  choice: molti
  rationale: L'aggettivo è usato in senso sostantivato; «molti» è conciso e non specifica oltre il testo chi siano.
- source_word: ἀπὸ ἀνατολῶν καὶ δυσμῶν
  choice: da oriente e da occidente
  rationale: I plurali greci indicano idiomaticamente direzioni o regioni; la resa italiana mantiene l'ampiezza geografica senza esplicitare nel testo principale un riferimento ai non ebrei.
- source_word: ἥξουσιν
  choice: verranno
  rationale: ἥκω esprime il venire o giungere; «verranno» è la forma più naturale nel contesto.
- source_word: ἀνακλιθήσονται
  choice: si metteranno a tavola
  rationale: Il verbo indica il prendere posto reclinandosi per un pasto. La resa comunica chiaramente al lettore moderno l'immagine del banchetto, mentre la nota conserva il particolare culturale della postura.
- source_word: μετὰ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ
  choice: con Abraamo, Isacco e Giacobbe
  rationale: μετά con il genitivo esprime compagnia e, nel contesto, comunione di mensa. I nomi seguono forme italiane bibliche riconoscibili.
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: nel regno dei cieli
  rationale: La resa conserva la caratteristica espressione matteana e il plurale formale di οὐρανῶν, risultando al contempo idiomatica in italiano.
theological_decisions:
- issue: Immagine del banchetto e comunione escatologica
  choice: Conservare esplicitamente l'immagine del pasto con «si metteranno a tavola».
  alternative: «siederanno con Abraamo, Isacco e Giacobbe» oppure il più letterale «si adageranno».
  rationale: Il verbo evoca la partecipazione a un banchetto, non la semplice presenza nello stesso luogo. La formulazione mantiene questa forza senza aggiungere dettagli dottrinali.
- issue: Identità dei «molti» provenienti da oriente e occidente
  choice: Mantenere l'indicazione geografica senza identificare esplicitamente i molti come non ebrei.
  alternative: «molti non ebrei verranno da oriente e da occidente».
  rationale: Il contesto può suggerire l'inclusione di persone esterne a Israele, ma il greco dice soltanto «molti». La traduzione conserva l'implicazione e l'ambiguità del testo.
- issue: Resa di «regno dei cieli»
  choice: Usare «regno dei cieli».
  alternative: «regno del cielo».
  rationale: Il plurale rispecchia l'espressione greca propria di Matteo ed è una locuzione italiana comprensibile; non viene interpretato come riferimento a più cieli distinti.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. «Si metteranno a tavola» privilegia la comprensibilità mantenendo l'immagine conviviale; «Abraamo» conserva una forma biblica italiana tradizionale ma tuttora chiara. I marcatori di nota sono collocati immediatamente dopo le espressioni pertinenti.
