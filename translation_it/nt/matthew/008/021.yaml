id: MAT.8.21
reference: Matthew 8:21
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ἕτερος δὲ τῶν ⸀μαθητῶν εἶπεν αὐτῷ· Κύριε, ἐπίτρεψόν μοι πρῶτον ἀπελθεῖν καὶ θάψαι τὸν πατέρα μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/021.yaml
  text: Then another of the disciples said to him[a], “Lord[b], permit me first to go away and bury my father.”
translation:
  language: it
  text: 'Un altro dei discepoli gli disse: «Signore, permettimi prima di andare a seppellire mio padre».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La richiesta può riferirsi sia a una sepoltura imminente, sia, più in generale, all'adempimento dei doveri filiali fino alla morte del padre; il greco non lo specifica.
    reason: cultural_note
lexical_decisions:
- source_word: ἕτερος δὲ
  choice: Un altro
  rationale: ἕτερος introduce un altro individuo distinto dal precedente; δέ è un connettivo narrativo lieve, che in italiano non richiede necessariamente una resa esplicita.
- source_word: τῶν μαθητῶν
  choice: dei discepoli
  rationale: Il genitivo identifica chi parla come appartenente al gruppo dei discepoli; la formulazione italiana è diretta e naturale.
- source_word: Κύριε
  choice: Signore
  rationale: Mantiene sia il tono rispettoso dell'appellativo rivolto a Gesù sia il suo possibile peso teologico.
- source_word: ἐπίτρεψόν μοι
  choice: permettimi
  rationale: Esprime con naturalezza una richiesta rispettosa di permesso, senza l'eccessiva formalità di «concedimi».
- source_word: πρῶτον
  choice: prima
  rationale: Conserva l'idea di priorità temporale espressa dal greco.
- source_word: ἀπελθεῖν
  choice: andare
  rationale: Nel contesto italiano «andare» esprime in modo idiomatico l'allontanamento richiesto; «andarmene» introdurrebbe una sfumatura emotiva non necessaria.
- source_word: θάψαι τὸν πατέρα μου
  choice: seppellire mio padre
  rationale: Resa semplice e diretta dell'infinito e del suo oggetto.
theological_decisions:
- issue: Portata della richiesta di seppellire il padre
  choice: La frase è resa direttamente, senza precisare se il padre sia appena morto.
  alternative: Intenderla più ampiamente come richiesta di restare a casa fino alla futura morte del padre per adempiere i doveri filiali.
  rationale: Il greco non determina la tempistica. La traduzione conserva quindi l'ambiguità, mentre la nota segnala le due principali possibilità.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. Il discorso diretto usa una formulazione rispettosa ma non arcaica; l'ambiguità temporale della richiesta è preservata.
