id: MAT.8.24
reference: Matthew 8:24
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ σεισμὸς μέγας ἐγένετο ἐν τῇ θαλάσσῃ, ὥστε τὸ πλοῖον καλύπτεσθαι ὑπὸ τῶν κυμάτων, αὐτὸς δὲ ἐκάθευδεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/024.yaml
  text: And behold[a], a great storm arose on the sea, so that the boat was being swamped by the waves[b]; but he was sleeping.
translation:
  language: it
  text: Ed ecco, sul mare si scatenò una grande tempesta[a], tanto che la barca veniva coperta dalle onde[b]; ma egli dormiva.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il greco σεισμός indica spesso un «terremoto» o uno «scuotimento»; qui, nel contesto, si riferisce a una violenta tempesta sul mare.
    reason: lexical_alternative
  - marker: b
    text: 'O: «veniva sommersa».'
    reason: translation_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: ecco
  rationale: Conserva la vivace funzione del segnale discorsivo, richiamando l’attenzione sull’improvviso pericolo senza ricorrere a una forma antiquata.
- source_word: σεισμὸς μέγας
  choice: una grande tempesta
  rationale: Benché σεισμός indichi spesso un terremoto o uno scuotimento, il contesto marittimo — mare, barca e onde — richiede qui il senso di un violento sconvolgimento del mare.
- source_word: ἐγένετο
  choice: si scatenò
  rationale: In riferimento a una tempesta esprime in italiano corrente e vivido il suo improvviso insorgere.
- source_word: ἐν τῇ θαλάσσῃ
  choice: sul mare
  rationale: Rende in modo idiomatico il luogo dell’evento e conserva il termine greco θάλασσα, «mare», senza sostituirlo con «lago».
- source_word: ὥστε
  choice: tanto che
  rationale: Introduce chiaramente il risultato prodotto dalla violenza della tempesta.
- source_word: τὸ πλοῖον
  choice: la barca
  rationale: Nel contesto della navigazione sul mare di Galilea, «barca» è più naturale di «nave».
- source_word: καλύπτεσθαι
  choice: veniva coperta
  rationale: 'Mantiene sia il valore passivo sia l’aspetto durativo dell’infinito presente: le onde continuavano a coprire la barca.'
- source_word: ὑπὸ τῶν κυμάτων
  choice: dalle onde
  rationale: Rende l’agente o mezzo indicato da ὑπό con il genitivo nella costruzione passiva.
- source_word: αὐτὸς δὲ
  choice: ma egli
  rationale: Esprime il netto contrasto tra il tumulto circostante e l’azione di Gesù, senza accentuare eccessivamente il pronome.
- source_word: ἐκάθευδεν
  choice: dormiva
  rationale: L’imperfetto italiano rispecchia naturalmente l’azione continuata espressa dall’imperfetto greco.
theological_decisions:
- issue: Natura dell’evento indicato da σεισμός
  choice: Reso contestualmente con «tempesta»
  alternative: «terremoto» oppure «grande scuotimento»
  rationale: È una decisione lessicale e contestuale, non dottrinale. Le onde che coprono la barca mostrano che si tratta di un violento sconvolgimento del mare; «terremoto» suggerirebbe in italiano soprattutto un fenomeno terrestre e potrebbe fuorviare.
translation_notes:
  register: Italiano moderno, dignitoso e narrativamente vivido. «Ed ecco» conserva l’apertura enfatica del greco; l’imperfetto «dormiva» crea il contrasto con l’improvviso scatenarsi della tempesta. La formulazione evita sia arcaismi non necessari sia un’esplicitazione teologica assente dal versetto.
