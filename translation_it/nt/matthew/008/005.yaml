lexical_decisions:
- source_word: Εἰσελθόντος δὲ αὐτοῦ
  choice: Quando Gesù entrò
  rationale: Il genitivo assoluto con participio aoristo è reso con una proposizione temporale naturale. Il nome «Gesù», ricavabile senza ambiguità dal contesto, chiarisce il referente del pronome italiano.
- source_word: εἰς Καφαρναοὺμ
  choice: a Cafarnao
  rationale: Si adotta la forma italiana tradizionale e corrente del toponimo; con «entrare», la costruzione «a Cafarnao» è idiomatica in italiano.
- source_word: προσῆλθεν αὐτῷ
  choice: gli si avvicinò
  rationale: Rende direttamente il movimento verso Gesù espresso da προσέρχομαι e risulta naturale nel contesto narrativo.
- source_word: ἑκατόνταρχος
  choice: un centurione
  rationale: «Centurione» è il termine italiano preciso e comunemente compreso per questo grado militare romano.
- source_word: παρακαλῶν αὐτὸν
  choice: e lo supplicò
  rationale: Nel contesto introduce una richiesta pressante; la coordinazione rende scorrevole in italiano il participio greco senza attenuarne la forza.
