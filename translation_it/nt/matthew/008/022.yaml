id: MAT.8.22
reference: Matthew 8:22
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸀λέγει αὐτῷ· Ἀκολούθει μοι, καὶ ἄφες τοὺς νεκροὺς θάψαι τοὺς ἑαυτῶν νεκρούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/022.yaml
  text: But Jesus says to him[a], “Follow me, and leave the dead to bury their own dead.”
translation:
  language: it
  text: 'Ma Gesù gli dice: «Seguimi, e lascia che i morti seppelliscano i propri morti».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La prima espressione «i morti» è spesso intesa in senso metaforico: quanti sono spiritualmente insensibili possono seppellire coloro che sono morti fisicamente.'
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: Segnala il lieve contrasto tra la richiesta precedente e la risposta correttiva di Gesù, senza appesantire il nesso.
- source_word: λέγει
  choice: dice
  rationale: Mantiene il presente storico greco e la vivacità narrativa.
- source_word: Ἀκολούθει μοι
  choice: Seguimi
  rationale: Imperativo diretto e naturale in italiano, capace di esprimere sia il seguire concreto sia la chiamata al discepolato.
- source_word: ἄφες
  choice: lascia che
  rationale: In questa costruzione rende in italiano corrente l'idea di lasciare ad altri il compito, senza trasformare il comando in una semplice concessione.
- source_word: νεκρούς ... νεκρούς
  choice: i morti ... i propri morti
  rationale: Conserva la ripetizione intenzionale dello stesso termine e non esplicita nel testo principale il probabile valore metaforico della prima occorrenza.
- source_word: θάψαι
  choice: seppelliscano
  rationale: Dopo «lascia che», il congiuntivo è la costruzione italiana naturale e rende con chiarezza l'infinito greco.
- source_word: τοὺς ἑαυτῶν νεκρούς
  choice: i propri morti
  rationale: «Propri» conserva il valore riflessivo ed enfatico di ἑαυτῶν.
theological_decisions:
- issue: Interpretazione della prima occorrenza di «morti»
  choice: Il testo principale mantiene «i morti ... i propri morti» senza aggiungere «spiritualmente».
  alternative: Intendere la prima occorrenza come riferimento metaforico a quanti sono spiritualmente insensibili e la seconda come riferimento ai morti fisici.
  rationale: Il detto presenta un voluto gioco di parole e una tensione teologica. Poiché il greco usa lo stesso termine entrambe le volte, esplicitare «spiritualmente» nel testo principale risolverebbe un'ambiguità che l'originale conserva.
translation_notes:
  register: Italiano standard moderno, diretto e dignitoso. Il presente storico «dice» conserva la vivacità dell'originale; la formulazione mantiene la concisione e la forza provocatoria del detto.
