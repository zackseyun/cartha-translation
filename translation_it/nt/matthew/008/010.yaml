id: MAT.8.10
reference: Matthew 8:10
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὁ Ἰησοῦς ἐθαύμασεν καὶ εἶπεν τοῖς ἀκολουθοῦσιν· Ἀμὴν λέγω ὑμῖν, ⸂παρ’ οὐδενὶ τοσαύτην πίστιν ἐν τῷ Ἰσραὴλ⸃ εὗρον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/010.yaml
  text: When Jesus heard this[a], he marveled and said to those following him, “Truly I tell you[b], with no one in Israel have I found such faith.”
translation:
  language: it
  text: 'Udito ciò, Gesù si meravigliò e disse a quelli che lo seguivano: «In verità vi dico: non ho trovato, in Israele, una fede così grande in nessuno».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσας
  choice: Udito ciò
  rationale: Il participio aoristo introduce la circostanza antecedente; «ciò» esplicita naturalmente in italiano il riferimento alle parole appena pronunciate dal centurione.
- source_word: ἐθαύμασεν
  choice: si meravigliò
  rationale: Rende direttamente lo stupore narrativo espresso dal verbo, con un registro dignitoso e corrente.
- source_word: τοῖς ἀκολουθοῦσιν
  choice: a quelli che lo seguivano
  rationale: Indica le persone che accompagnavano Gesù in quel momento, senza trasformare il participio in una designazione istituzionale.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: In verità vi dico
  rationale: Formula solenne e idiomatica che conserva la forza asseverativa di ἀμήν.
- source_word: παρ’ οὐδενὶ
  choice: in nessuno
  rationale: παρά con il dativo indica qui l'ambito personale, cioè «nel caso di nessuno»; la resa italiana è concisa e naturale.
- source_word: τοσαύτην πίστιν
  choice: una fede così grande
  rationale: τοσαύτην esprime chiaramente il grado o la grandezza; la formulazione italiana rende esplicita tale intensità.
- source_word: ἐν τῷ Ἰσραήλ
  choice: in Israele
  rationale: Conserva il riferimento locativo e corporativo al popolo d'Israele.
- source_word: εὗρον
  choice: ho trovato
  rationale: Il passato prossimo è naturale in italiano per un'esperienza constatata fino al momento in cui Gesù parla.
theological_decisions:
- issue: Resa di πίστις
  choice: fede
  alternative: fiducia
  rationale: Nel contesto indica la fiduciosa adesione del centurione all'autorità di Gesù; «fede» conserva il termine teologico ampio senza restringerlo a una sola sfumatura.
translation_notes:
  register: Italiano moderno standard, narrativo e dignitoso. La collocazione incidentale di «in Israele» conserva sia il riferimento al popolo sia il rapporto di «in nessuno» con la fede riscontrata nelle persone.
