  yaml_path: translation/nt/matthew/008/001.yaml
  text: When he came down from the mountain[a], large crowds followed him.
translation:
  language: it
  text: Quando egli scese dal monte, grandi folle lo seguirono.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καταβάντος δὲ αὐτοῦ
  choice: Quando egli scese
  rationale: Il genitivo assoluto con participio aoristo esprime qui una circostanza temporale anteriore all'azione principale. La resa con «quando» è naturale in italiano; δέ ha valore connettivo lieve e non richiede necessariamente una traduzione distinta.
- source_word: ἀπὸ τοῦ ὄρους
  choice: dal monte
  rationale: ὄρος può indicare un monte o un'altura; «il monte» riprende naturalmente il luogo del discorso precedente ed è la formulazione tradizionale ma ancora corrente in italiano.
- source_word: ἠκολούθησαν
  choice: seguirono
  rationale: L'aoristo indica l'evento narrativo successivo; «seguirono» rende in modo diretto il senso ordinario di ἀκολουθέω nel contesto.
- source_word: αὐτῷ
  choice: lo
  rationale: Il dativo retto da ἀκολουθέω si esprime idiomaticamente in italiano con il complemento oggetto pronominale «lo».
- source_word: ὄχλοι πολλοί
  choice: grandi folle
  rationale: La locuzione indica folle numerose. «Grandi folle» è naturale in italiano, conserva il plurale di ὄχλοι e comunica l'ampiezza numerica senza ridurre l'espressione al generico «molta gente».
theological_decisions: []
translation_notes:
  register: 'Italiano moderno standard, narrativo e dignitoso. «Egli» esplicita il soggetto del genitivo assoluto e mantiene un registro biblico accessibile senza risultare arcaico. Non è necessaria una nota: «grandi folle» rende adeguatamente e naturalmente ὄχλοι πολλοί.'
