id: MAT.8.26
reference: Matthew 8:26
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Τί δειλοί ἐστε, ὀλιγόπιστοι; τότε ἐγερθεὶς ἐπετίμησεν τοῖς ἀνέμοις καὶ τῇ θαλάσσῃ, καὶ ἐγένετο γαλήνη μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/026.yaml
  text: And he said to them, “Why are you fearful, you of little faith?” Then, having risen, he rebuked the winds and the sea, and there was a great calm.
translation:
  language: it
  text: 'E disse loro: «Perché avete paura, uomini di poca fede?» Allora si alzò, rimproverò i venti e il mare, e ci fu una grande calma.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δειλοί
  choice: avete paura
  rationale: Nel contesto indica chi è impaurito o timoroso; la formulazione italiana è naturale e mantiene la forza della domanda.
- source_word: ὀλιγόπιστοι
  choice: uomini di poca fede
  rationale: Rende direttamente l’appellativo greco e conserva il legame tra la paura dei discepoli e la loro fede insufficiente.
- source_word: ἐγερθεὶς
  choice: si alzò
  rationale: Traduce il participio aoristo in forma idiomatica italiana, mantenendo la successione narrativa.
- source_word: ἐπετίμησεν
  choice: rimproverò
  rationale: Conserva il linguaggio autorevole rivolto ai venti e al mare, senza attenuarlo in un semplice comando.
- source_word: γαλήνη μεγάλη
  choice: una grande calma
  rationale: Riproduce l’intensificazione dell’aggettivo μεγάλη e il contrasto netto con la tempesta.
theological_decisions:
- issue: Rapporto tra paura e poca fede
  choice: Mantenere entrambe le espressioni senza esplicitare un nesso causale
  alternative: «Perché avete paura? Quanto è piccola la vostra fede!»
  rationale: Il greco accosta la domanda e l’appellativo, ma non formula esplicitamente una spiegazione causale né trasforma l’appellativo in un’esclamazione autonoma.
- issue: Autorità di Gesù sulla creazione
  choice: Conservare «rimproverò» riferito sia ai venti sia al mare
  alternative: «ordinò ai venti e al mare di calmarsi»
  rationale: La resa letterale preserva la personificazione retorica e la forza dell’azione, senza aggiungere le parole precise di un comando assenti nel testo.
translation_notes:
  register: Italiano moderno, chiaro e dignitoso. La sintassi segue da vicino il greco ma evita il calco poco naturale «essendo sorto». «Uomini di poca fede» conserva il tono diretto dell’appellativo; «grande calma» mantiene l’enfasi dell’originale.
