id: MAT.8.2
reference: Matthew 8:2
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ λεπρὸς ⸀προσελθὼν προσεκύνει αὐτῷ λέγων· Κύριε, ἐὰν θέλῃς δύνασαί με καθαρίσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/002.yaml
  text: And behold[a], a leper came and bowed down before him, saying, “Lord, if you are willing, you are able to cleanse me.”
translation:
  language: it
  text: 'Ed ecco, un uomo affetto da lebbra si avvicinò e si prostrò davanti a lui[a], dicendo: «Signore, se vuoi, puoi purificarmi».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «lo adorò»; il verbo greco può indicare il prostrarsi con riverenza, il rendere omaggio o l’adorare, secondo il contesto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: ecco
  rationale: Conserva la funzione del segnale discorsivo che richiama l’attenzione e rende vivace la narrazione, risultando al tempo stesso naturale in italiano.
- source_word: λεπρὸς
  choice: un uomo affetto da lebbra
  rationale: Rende l’aggettivo sostantivato come riferimento a una persona colpita dalla malattia tradizionalmente chiamata lebbra, senza identificarla esclusivamente con la sua condizione.
- source_word: προσελθὼν
  choice: si avvicinò
  rationale: Esprime con precisione il movimento verso Gesù implicito nel participio greco.
- source_word: προσεκύνει
  choice: si prostrò davanti a lui
  rationale: Descrive l’atto corporeo di profonda riverenza senza decidere in modo univoco se si tratti propriamente di adorazione.
- source_word: Κύριε
  choice: Signore
  rationale: Mantiene sia il valore di appellativo rispettoso e autorevole sia la possibile risonanza cristologica.
- source_word: ἐὰν θέλῃς
  choice: se vuoi
  rationale: È la formulazione italiana contemporanea più naturale e conserva il riferimento alla volontà di Gesù.
- source_word: δύνασαί
  choice: puoi
  rationale: Esprime chiaramente la capacità o il potere attribuito a Gesù, con naturalezza in italiano.
- source_word: καθαρίσαι
  choice: purificarmi
  rationale: Conserva la dimensione sia fisica sia rituale del verbo nel contesto della lebbra, che il semplice «guarirmi» attenuerebbe.
theological_decisions:
- issue: Valore di προσκυνέω rivolto a Gesù
  choice: si prostrò davanti a lui
  alternative: lo adorò
  rationale: Il verbo può indicare prostrazione, omaggio reverenziale o adorazione. La resa scelta conserva l’azione e la riverenza senza risolvere anticipatamente l’ambiguità teologica.
- issue: Portata dell’appellativo Κύριε
  choice: Signore
  alternative: padrone / signore in senso cortese
  rationale: «Signore» preserva la rispettosa invocazione rivolta a Gesù e l’eventuale peso cristologico senza ridurla a una formula puramente cortese.
translation_notes:
  register: Italiano moderno, dignitoso e narrativamente scorrevole. «Ed ecco» conserva il rilievo del segnale discorsivo; «purificarmi» mantiene la risonanza fisica e rituale del testo greco.
