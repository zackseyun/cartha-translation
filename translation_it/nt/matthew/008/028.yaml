id: MAT.8.28
reference: Matthew 8:28
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Καὶ ⸂ἐλθόντος αὐτοῦ⸃ εἰς τὸ πέραν εἰς τὴν χώραν τῶν ⸀Γαδαρηνῶν ὑπήντησαν αὐτῷ δύο δαιμονιζόμενοι ἐκ τῶν μνημείων ἐξερχόμενοι, χαλεποὶ λίαν ὥστε μὴ ἰσχύειν τινὰ παρελθεῖν διὰ τῆς ὁδοῦ ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/028.yaml
  text: And when he came to the other side[a], into the region of the Gadarenes, two demon-possessed men met him, coming out of the tombs[c][b], so extremely fierce that no one was able to pass along that road.
translation:
  language: it
  text: Quando giunse all’altra riva, nella regione dei Gadareni[a], gli vennero incontro due uomini posseduti da dèmoni, che uscivano dai sepolcri. Erano tanto pericolosi che nessuno poteva passare per quella strada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alcuni manoscritti hanno «Gergaseni» o «Geraseni» invece di «Gadareni».
    reason: textual_variant
lexical_decisions:
- source_word: ἐλθόντος αὐτοῦ
  choice: Quando giunse
  rationale: Il genitivo assoluto ha valore temporale; una subordinata con «quando» è naturale in italiano e conserva la successione narrativa.
- source_word: τὸ πέραν
  choice: all’altra riva
  rationale: Nel contesto indica la sponda opposta del lago; «riva» rende esplicito in modo naturale il riferimento geografico implicito.
- source_word: χώραν τῶν Γαδαρηνῶν
  choice: regione dei Gadareni
  rationale: χώρα indica una regione o un territorio; il testo SBLGNT legge Γαδαρηνῶν, traslitterato secondo l’uso italiano.
- source_word: ὑπήντησαν αὐτῷ
  choice: gli vennero incontro
  rationale: Rende il movimento implicito nell’incontro ed è idiomatico nel contesto narrativo.
- source_word: δύο δαιμονιζόμενοι
  choice: due uomini posseduti da demòni
  rationale: Il participio sostantivato maschile plurale designa due uomini sotto il dominio di demòni; questa formulazione è chiara e corrente senza introdurre un tecnicismo.
- source_word: ἐκ τῶν μνημείων ἐξερχόμενοι
  choice: che uscivano dai sepolcri
  rationale: μνημεῖα indica qui luoghi di sepoltura; la relativa evita un accumulo poco naturale di participi.
- source_word: χαλεποὶ λίαν
  choice: tanto pericolosi
  rationale: χαλεπός può indicare ferocia, durezza o pericolosità; il risultato espresso dalla frase seguente mette in primo piano il pericolo che rappresentavano. «Tanto... che» integra naturalmente l’intensificatore λίαν con ὥστε.
- source_word: ὥστε μὴ ἰσχύειν τινὰ παρελθεῖν
  choice: che nessuno poteva passare
  rationale: ὥστε introduce il risultato e ἰσχύω esprime qui la possibilità concreta, non semplicemente la forza fisica.
- source_word: διὰ τῆς ὁδοῦ ἐκείνης
  choice: per quella strada
  rationale: διά con il genitivo indica il percorso attraversato; «passare per quella strada» è l’espressione italiana più naturale.
theological_decisions:
- issue: Resa della condizione demoniaca
  choice: posseduti da demòni
  alternative: sotto il potere di demòni
  rationale: La resa scelta comunica chiaramente l’azione personale e dominante dei demòni attestata da δαιμονιζόμενοι, senza specificare oltre quanto afferma il greco la natura o il grado di tale dominio.
- issue: Variante testuale del toponimo
  choice: Gadareni nel testo principale
  alternative: Gergaseni o Geraseni
  rationale: Il testo SBLGNT adottato legge Γαδαρηνῶν; le altre forme manoscritte sono segnalate in nota senza alterare il testo base.
- issue: Portata semantica di χαλεποὶ λίαν
  choice: tanto pericolosi
  alternative: molto feroci
  rationale: «Pericolosi» conserva il senso contestuale senza limitare il termine alla violenza fisica; «feroci» resta una possibile resa lessicale.
translation_notes:
  register: Italiano moderno standard, narrativo e dignitoso. Periodo diviso in due frasi per leggibilità, senza perdere il nesso consecutivo del greco. Accento in «demòni» usato per distinguere chiaramente il termine da «demoni» letto con possibile diversa accentazione.
