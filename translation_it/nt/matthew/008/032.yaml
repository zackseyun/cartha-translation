  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Ὑπάγετε. οἱ δὲ ἐξελθόντες ἀπῆλθον εἰς ⸂τοὺς χοίρους⸃· καὶ ἰδοὺ ὥρμησεν πᾶσα ἡ ⸀ἀγέλη κατὰ τοῦ κρημνοῦ εἰς τὴν θάλασσαν, καὶ ἀπέθανον ἐν τοῖς ὕδασιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/032.yaml
  text: And he said to them[a], “Go.” Then they came out and went into the pigs; and behold[c][b], the whole herd rushed down the steep bank into the sea and died in the waters.
translation:
  language: it
  text: 'Ed egli disse loro: «Andate». Essi allora, usciti, entrarono nei porci; ed ecco, tutto il branco si precipitò giù per il ripido pendio[a] nel mare e morì nelle acque[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «giù per la scarpata» oppure «giù per il dirupo». Il termine greco può indicare un pendio scosceso, una scarpata o un precipizio.
    reason: lexical_alternative
  - marker: b
    text: O «annegò nelle acque». Il greco dice più letteralmente «morì nelle acque».
    reason: alternative_reading
lexical_decisions:
- source_word: Ὑπάγετε
  choice: Andate
  rationale: L’imperativo breve e diretto conserva la concisione del comando di Gesù in un italiano naturale.
- source_word: ἐξελθόντες
  choice: usciti
  rationale: Il participio indica che i demòni uscirono prima di entrare nei porci; la forma italiana mantiene la sequenza senza appesantirla.
- source_word: ἀπῆλθον εἰς τοὺς χοίρους
  choice: entrarono nei porci
  rationale: Nel contesto, il movimento dei demòni verso i porci implica il loro ingresso negli animali; questa resa è chiara e idiomatica.
- source_word: χοίρους
  choice: porci
  rationale: «Porci» è un equivalente corrente e preciso, adatto al registro biblico moderno; «maiali» sarebbe possibile ma leggermente più colloquiale.
- source_word: ἰδοὺ
  choice: ed ecco
  rationale: Conserva il segnale discorsivo che richiama vividamente l’attenzione sull’evento seguente.
- source_word: πᾶσα ἡ ἀγέλη
  choice: tutto il branco
  rationale: «Branco» è naturale per un gruppo di porci, mentre «tutto» rende esplicitamente πᾶσα.
- source_word: ὥρμησεν
  choice: si precipitò
  rationale: Esprime il movimento improvviso e impetuoso della mandria collettivamente descritta dal singolare greco.
- source_word: κατὰ τοῦ κρημνοῦ
  choice: giù per il ripido pendio
  rationale: κρημνός può indicare un pendio molto scosceso, una scarpata o un dirupo; la resa principale evita di imporre l’idea di una parete necessariamente verticale.
- source_word: θάλασσαν
  choice: mare
  rationale: Riproduce direttamente θάλασσα senza sostituirlo con la precisazione geografica interpretativa «lago».
- source_word: ἀπέθανον ἐν τοῖς ὕδασιν
  choice: morì nelle acque
  rationale: Segue da vicino il greco, che afferma che il branco morì nelle acque senza usare esplicitamente un verbo corrispondente ad «annegare».
theological_decisions:
- issue: Grado di specificità nella descrizione della morte del branco
  choice: morì nelle acque
  alternative: annegò nelle acque
  rationale: L’annegamento è fortemente implicato dal racconto, ma il testo greco dice letteralmente che il branco «morì nelle acque». La formulazione scelta non aggiunge una modalità della morte non espressa dal verbo.
translation_notes:
  register: Italiano moderno, dignitoso e narrativamente scorrevole. «Ed egli» mantiene esplicito il soggetto del greco senza identificare nuovamente Gesù; «ed ecco» conserva la vividezza narrativa. L’accordo al singolare in «si precipitò» e «morì» segue il sostantivo collettivo «branco» e il testo greco.
