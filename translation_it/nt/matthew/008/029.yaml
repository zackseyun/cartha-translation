id: MAT.8.29
reference: Matthew 8:29
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἔκραξαν λέγοντες· Τί ἡμῖν καὶ ⸀σοί, υἱὲ τοῦ θεοῦ; ἦλθες ὧδε πρὸ καιροῦ βασανίσαι ἡμᾶς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/029.yaml
  text: And behold[a], they cried out, saying, “What have we to do with you[b], Son of God? Have you come here before the appointed time to torment us?”
translation:
  language: it
  text: 'Ed ecco, gridarono: «Che c’è fra noi e te[a], Figlio di Dio? Sei venuto qui prima del tempo stabilito[b] per tormentarci?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Espressione idiomatica che può significare: «Che vuoi da noi?» oppure, più letteralmente, «Che cosa abbiamo in comune, noi e te?»'
    reason: lexical_alternative
  - marker: b
    text: O «prima del tempo». Il greco può riferirsi a un tempo fissato o destinato.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἰδοὺ
  choice: Ed ecco
  rationale: Conserva il marcatore discorsivo e la sua vivida funzione di richiamare l’attenzione, in una forma italiana dignitosa e comprensibile.
- source_word: ἔκραξαν λέγοντες
  choice: gridarono
  rationale: “Gridarono” esprime la forza di κράζω; in italiano non è necessario riprodurre λέγοντες con il ridondante “dicendo” prima del discorso diretto.
- source_word: Τί ἡμῖν καὶ σοί
  choice: Che c’è fra noi e te
  rationale: Rende abbastanza da vicino l’idioma semitico-greco di dissociazione o protesta, lasciandone percepire la formulazione insolita senza renderla incomprensibile.
- source_word: υἱὲ τοῦ θεοῦ
  choice: Figlio di Dio
  rationale: Traduce direttamente il titolo cristologico con la maiuscola d’uso riferita a Gesù.
- source_word: ἦλθες ὧδε
  choice: Sei venuto qui
  rationale: Il passato prossimo esprime naturalmente in italiano l’arrivo con conseguenze presenti; “qui” rende il valore locativo di ὧδε.
- source_word: πρὸ καιροῦ
  choice: prima del tempo stabilito
  rationale: καιρός può indicare un momento fissato o opportuno; “stabilito” conserva la possibile sfumatura di un tempo destinato al giudizio senza specificarne esplicitamente l’agente.
- source_word: βασανίσαι ἡμᾶς
  choice: per tormentarci
  rationale: L’infinito esprime lo scopo percepito della venuta; “tormentare” è naturale e adeguato al contesto di giudizio severo.
theological_decisions:
- issue: Il riconoscimento dell’identità di Gesù da parte dei demòni
  choice: Figlio di Dio
  alternative: figlio di Dio
  rationale: Il testo presenta un titolo diretto rivolto a Gesù; la traduzione ne conserva pienamente la forza senza ampliarlo né attenuarlo.
- issue: La sfumatura escatologica di καιρός
  choice: prima del tempo stabilito
  alternative: prima del tempo
  rationale: La formulazione suggerisce un momento determinato per il tormento o giudizio, ma non esplicita chi lo abbia stabilito né offre uno schema escatologico più dettagliato.
- issue: L’idioma Τί ἡμῖν καὶ σοί
  choice: Che c’è fra noi e te
  alternative: Che vuoi da noi?
  rationale: La scelta conserva la tensione e la relativa ambiguità dell’idioma di dissociazione, mentre l’alternativa ne espliciterebbe maggiormente il senso pragmatico.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. Si mantiene “Ed ecco” per la vivacità narrativa; si evita il calco ridondante “gridarono dicendo”. I marcatori [a] e [b] compaiono nel testo nei punti pertinenti.
