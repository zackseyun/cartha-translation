id: MAT.8.9
reference: Matthew 8:9
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: καὶ γὰρ ἐγὼ ἄνθρωπός εἰμι ὑπὸ ⸀ἐξουσίαν, ἔχων ὑπ’ ἐμαυτὸν στρατιώτας, καὶ λέγω τούτῳ· Πορεύθητι, καὶ πορεύεται, καὶ ἄλλῳ· Ἔρχου, καὶ ἔρχεται, καὶ τῷ δούλῳ μου· Ποίησον τοῦτο, καὶ ποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/009.yaml
  text: For I also am a man under authority[a], having soldiers under me. And I say to this one, ‘Go,’ and he goes; and to another, ‘Come,’ and he comes; and to my servant, ‘Do this,’ and he does it.
translation:
  language: it
  text: 'Infatti anch’io sono un uomo sottoposto ad autorità e ho dei soldati ai miei ordini. Dico a uno: «Va’», ed egli va; a un altro: «Vieni», ed egli viene; e al mio servo[a]: «Fa’ questo», ed egli lo fa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O «schiavo» (greco: doûlos).'
    reason: 'Alternativa lessicale: δοῦλος può designare un servo o, più specificamente, una persona in condizione di schiavitù.'
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Infatti
  rationale: Introduce in modo naturale la spiegazione addotta dal centurione, conservando il valore esplicativo di γάρ senza tradurre meccanicamente entrambe le particelle.
- source_word: ἐγὼ ἄνθρωπός εἰμι
  choice: anch’io sono un uomo
  rationale: 'L’esplicito ἐγώ e καί esprimono l’analogia: anche il centurione vive entro una struttura di autorità. La formulazione italiana è naturale e mantiene l’enfasi pertinente.'
- source_word: ὑπὸ ἐξουσίαν
  choice: sottoposto ad autorità
  rationale: Rende chiaramente la posizione del centurione entro una catena di comando, senza specificare un’autorità personale non espressa nel greco.
- source_word: ἔχων ὑπ’ ἐμαυτὸν στρατιώτας
  choice: e ho dei soldati ai miei ordini
  rationale: Esprime in italiano corrente il rapporto gerarchico indicato da ὑπό con ἐμαυτόν; la coordinazione rende scorrevole il participio senza perderne la funzione esplicativa.
- source_word: λέγω τούτῳ
  choice: Dico a uno
  rationale: Nel parallelismo distributivo italiano, «a uno ... a un altro» comunica con naturalezza il contrasto fra τούτῳ e ἄλλῳ, evitando il poco idiomatico «a questo» senza referente visibile.
- source_word: Πορεύθητι / Ἔρχου
  choice: «Va’» / «Vieni»
  rationale: Imperativi diretti e semplici, corrispondenti ai comandi greci e adatti al contesto militare.
- source_word: δοῦλος
  choice: servo
  rationale: Nel contesto domestico e gerarchico «servo» conserva la subordinazione personale senza attenuarla fino a «domestico»; «schiavo» resta una possibile resa lessicale ed è segnalata in nota.
- source_word: ποιεῖ
  choice: lo fa
  rationale: Il pronome riprende naturalmente «questo» in italiano e mantiene la sequenza immediata comando-esecuzione.
theological_decisions:
- issue: Rapporto fra l’autorità del centurione e quella di Gesù
  choice: Conservare l’analogia mediante «anch’io» senza esplicitarne ulteriormente il significato
  alternative: Parafrasare che anche Gesù opera entro o sopra una catena di autorità
  rationale: Il versetto presenta l’analogia ma non ne definisce esplicitamente tutti i termini. Una spiegazione aggiunta risolverebbe indebitamente la tensione cristologica e il rapporto tra autorità ricevuta ed esercitata.
- issue: Resa di δοῦλος
  choice: servo
  alternative: schiavo
  rationale: Il punto immediato è l’efficacia dell’ordine entro una relazione gerarchica. «Servo» è dignitoso e comprensibile, mentre la nota conserva la più marcata alternativa socio-giuridica «schiavo».
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. Il ritmo parallelo dei tre ordini è mantenuto; «ai miei ordini» comunica idiomaticamente la gerarchia militare, mentre «ed egli» conserva una lieve solennità narrativa e rende esplicita l’obbedienza immediata.
