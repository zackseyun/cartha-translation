id: MAT.8.8
reference: Matthew 8:8
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ⸂καὶ ἀποκριθεὶς⸃ ὁ ἑκατόνταρχος ἔφη· Κύριε, οὐκ εἰμὶ ἱκανὸς ἵνα μου ὑπὸ τὴν στέγην εἰσέλθῃς· ἀλλὰ μόνον εἰπὲ λόγῳ, καὶ ἰαθήσεται ὁ παῖς μου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/008.yaml
  text: And the centurion answered[a], “Lord, I am not worthy that you should come under my roof. But only speak a word[b], and my servant will be healed.”
translation:
  language: it
  text: 'Il centurione rispose: «Signore, non sono degno che tu entri sotto il mio tetto; ma di'' soltanto una parola[a] e il mio servo[b] sarà guarito».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «di'' soltanto la parola». Il greco dice letteralmente «di'' una parola».'
    reason: lexical_alternative
  - marker: b
    text: 'Oppure: «ragazzo» o «bambino». Il termine greco può indicare un bambino, un ragazzo o un servo, a seconda del contesto.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς … ἔφη
  choice: rispose
  rationale: La combinazione del participio con il verbo del dire introduce idiomaticamente una risposta; un solo verbo evita l’artificioso «rispondendo disse».
- source_word: ἑκατόνταρχος
  choice: centurione
  rationale: Termine italiano preciso e consolidato per l’ufficiale romano posto a capo di circa cento soldati.
- source_word: Κύριε
  choice: Signore
  rationale: Conserva sia il valore di appellativo rispettoso sia la possibile risonanza cristologica, senza determinarne oltre misura il senso.
- source_word: ἱκανός
  choice: degno
  rationale: Nel contesto esprime l’indegnità dichiarata dal centurione, non una semplice incapacità pratica.
- source_word: ὑπὸ τὴν στέγην εἰσέλθῃς
  choice: entri sotto il mio tetto
  rationale: Mantiene la vivida espressione greca ed è naturale e comprensibile in italiano.
- source_word: μόνον εἰπὲ λόγῳ
  choice: di’ soltanto una parola
  rationale: Rende la forza restrittiva di μόνον e il riferimento esplicito a λόγος; la nota segnala l’alternativa idiomatica italiana.
- source_word: ἰαθήσεται
  choice: sarà guarito
  rationale: Rende direttamente il futuro passivo di ἰάομαι nel contesto di una guarigione.
- source_word: παῖς
  choice: servo
  rationale: Il contesto del centurione favorisce il senso di domestico o subordinato, mentre la nota conserva l’effettiva ampiezza semantica del termine.
theological_decisions:
- issue: Valore di κύριος rivolto a Gesù
  choice: Signore
  alternative: signore / padrone
  rationale: «Signore» preserva tanto il rispetto espresso nell’appellativo quanto un’eventuale risonanza cristologica, senza imporre una lettura esclusivamente confessionale.
- issue: Identità indicata da παῖς
  choice: servo
  alternative: ragazzo / figlio
  rationale: «Servo» è favorito dal contesto sociale e dal racconto parallelo, ma il greco rimane lessicalmente ambiguo; tale ambiguità è quindi esplicitata in nota.
translation_notes:
  register: Italiano moderno, dignitoso e scorrevole. «Sotto il mio tetto» conserva l’immagine dell’originale; «di’» usa correttamente l’imperativo apostrofato. Tutti i marcatori di nota compaiono nel testo.
