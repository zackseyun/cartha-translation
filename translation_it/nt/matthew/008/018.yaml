  text: Ἰδὼν δὲ ὁ Ἰησοῦς ⸂πολλοὺς ὄχλους⸃ περὶ αὐτὸν ἐκέλευσεν ἀπελθεῖν εἰς τὸ πέραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/018.yaml
  text: When Jesus saw many crowds around him, he gave orders to go to the other side.
translation:
  language: it
  text: Vedendo molte folle intorno a sé, Gesù ordinò di andare all'altra riva.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλοὺς ὄχλους
  choice: molta folla
  rationale: Il plurale greco indica una grande affluenza di persone; in italiano moderno «molta folla» è naturale e conserva l’idea quantitativa senza l’innaturale «molte folle».
- source_word: ἐκέλευσεν
  choice: ordinò
  rationale: Esprime un comando autorevole, in modo più diretto e idiomatico di «diede ordine».
- source_word: ἀπελθεῖν εἰς τὸ πέραν
  choice: di passare all’altra riva
  rationale: Nel contesto della traversata del lago, τὸ πέραν designa l’altra sponda; «passare» rende naturalmente il movimento richiesto senza specificare nel versetto chi debba eseguirlo.
theological_decisions:
- issue: Soggetto sottinteso dell’infinito ἀπελθεῖν
  choice: Mantenere impliciti gli esecutori dell’ordine
  alternative: «ordinò ai discepoli di passare» oppure «ordinò che partissero»
  rationale: Il testo greco non nomina qui i discepoli né esplicita grammaticalmente il gruppo incaricato; la formulazione italiana evita di aggiungere un referente non espresso.
translation_notes:
  register: Italiano moderno, scorrevole e dignitoso. La costruzione participiale è resa con un gerundio temporale; non si aggiunge un avverbio come «allora», poiché δέ qui svolge soprattutto una funzione discorsiva.
