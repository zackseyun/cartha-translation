id: MAT.8.16
reference: Matthew 8:16
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Ὀψίας δὲ γενομένης προσήνεγκαν αὐτῷ δαιμονιζομένους πολλούς· καὶ ἐξέβαλεν τὰ πνεύματα λόγῳ, καὶ πάντας τοὺς κακῶς ἔχοντας ἐθεράπευσεν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/016.yaml
  text: When evening came[a], they brought to him many who were demon-possessed; and he cast out the spirits with a word, and healed all who were sick.
translation:
  language: it
  text: Venuta la sera, gli portarono molti indemoniati[a]; egli scacciò gli spiriti con una parola e guarì tutti i malati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «molti che erano sotto l’influsso dei demoni». Il participio greco indica persone soggette all’azione demoniaca; «indemoniati» è la resa convenzionale e concisa.
    reason: Alternativa lessicale che rende esplicita l’ampiezza semantica del participio greco.
lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: Venuta la sera
  rationale: Il genitivo assoluto indica il momento dell’azione. «Venuta la sera» è naturale, conciso e conserva il valore temporale del greco.
- source_word: προσήνεγκαν αὐτῷ
  choice: gli portarono
  rationale: In questo contesto προσφέρω indica il condurre delle persone da Gesù; la resa italiana è idiomatica e fedele.
- source_word: δαιμονιζομένους πολλούς
  choice: molti indemoniati
  rationale: Il participio designa persone soggette all’azione dei demòni. «Indemoniati» è la resa italiana tradizionale e concisa; una nota segnala un’alternativa meno tecnica.
- source_word: ἐξέβαλεν τὰ πνεύματα
  choice: scacciò gli spiriti
  rationale: ἐκβάλλω indica qui l’espulsione degli spiriti. «Gli spiriti» riproduce direttamente l’oggetto greco senza aggiungere «maligni», pur implicato dal contesto.
- source_word: λόγῳ
  choice: con una parola
  rationale: Il dativo ha valore strumentale. La resa sottolinea l’autorità immediata del comando di Gesù senza aggiungere il possessivo «sua», assente nel greco.
- source_word: πάντας τοὺς κακῶς ἔχοντας
  choice: tutti i malati
  rationale: L’espressione idiomatica κακῶς ἔχειν significa essere malati. «Tutti i malati» è chiaro e naturale nel contesto delle guarigioni.
- source_word: ἐθεράπευσεν
  choice: guarì
  rationale: θεραπεύω nei racconti evangelici di guarigione indica il risanare; «guarì» conserva sia il significato concreto sia il tono narrativo.
theological_decisions:
- issue: Natura di δαιμονιζομένους e τὰ πνεύματα
  choice: Conservare le categorie narrative del testo con «indemoniati» e «gli spiriti»
  alternative: Interpretare la condizione come malattia mentale oppure rendere «persone tormentate dai demòni»
  rationale: Il versetto distingue lo scacciare gli spiriti dal guarire i malati. La traduzione mantiene tale distinzione senza psicologizzarla né precisare oltre ciò che afferma il testo.
- issue: Valore di λόγῳ
  choice: 'Resa strumentale: «con una parola»'
  alternative: «con la sua parola» oppure «parlando»
  rationale: La formulazione conserva l’enfasi sull’autorità del comando di Gesù senza introdurre elementi non espressi nel greco.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. La sintassi è scorrevole ma segue da vicino la progressione del greco; il punto e virgola conserva il rapporto tra l’arrivo degli indemoniati e le successive azioni di Gesù.
