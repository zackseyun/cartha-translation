id: MAT.8.20
reference: Matthew 8:20
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Αἱ ἀλώπεκες φωλεοὺς ἔχουσιν καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατασκηνώσεις, ὁ δὲ υἱὸς τοῦ ἀνθρώπου οὐκ ἔχει ποῦ τὴν κεφαλὴν κλίνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/020.yaml
  text: And Jesus says to him[a], “Foxes have dens, and the birds of the sky have nests[d][c][b], but the Son of Man has nowhere to lay his head.”
translation:
  language: it
  text: 'E Gesù gli dice: «Le volpi hanno tane e gli uccelli del cielo hanno nidi, ma il Figlio dell’uomo[a] non ha dove posare il capo».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Il Figlio dell’uomo» è l’espressione con cui Gesù designa sé stesso; si potrebbe anche rendere «l’Essere umano».
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει
  choice: dice
  rationale: Conserva il presente storico greco, naturale anche nella narrazione italiana e più aderente alla forma della fonte.
- source_word: ἀλώπεκες
  choice: volpi
  rationale: Equivalente italiano diretto e corrente del sostantivo plurale.
- source_word: φωλεούς
  choice: tane
  rationale: Indica in modo naturale i rifugi degli animali; «buchi» sarebbe possibile ma meno preciso e dignitoso nel contesto.
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: gli uccelli del cielo
  rationale: Riproduce l’immagine della fonte in italiano moderno; «uccelli dell’aria» è tradizionale ma meno direttamente legato a οὐρανός.
- source_word: κατασκηνώσεις
  choice: nidi
  rationale: Nel contesto degli uccelli è la resa italiana più naturale, pur avendo il termine greco il senso più ampio di dimore o luoghi di riposo.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: il Figlio dell’uomo
  rationale: Mantiene l’autodesignazione di Gesù e le sue risonanze bibliche, senza ridurla a una parafrasi interpretativa.
- source_word: οὐκ ἔχει ποῦ
  choice: non ha dove
  rationale: Resa idiomatica italiana che segue da vicino la costruzione greca senza risultare artificiosa.
- source_word: κλίνῃ
  choice: posare
  rationale: «Posare il capo» è un’espressione italiana naturale che conserva l’immagine concreta dell’atto di reclinare o adagiare la testa.
theological_decisions:
- issue: Resa dell’autodesignazione ὁ υἱὸς τοῦ ἀνθρώπου
  choice: il Figlio dell’uomo
  alternative: l’Essere umano
  rationale: La formulazione tradizionale conserva sia il tenore letterale sia le possibili risonanze di Daniele 7 e l’ambiguità del titolo; «l’Essere umano» ne privilegerebbe il senso antropologico.
translation_notes:
  register: Italiano moderno, scorrevole e dignitoso. Si conserva il presente storico «dice» e il titolo «Figlio dell’uomo». La nota è collocata dopo l’intero versetto per non interrompere la frase, ma chiarisce specificamente il titolo.
