id: MAT.8.4
reference: Matthew 8:4
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Ὅρα μηδενὶ εἴπῃς, ἀλλὰ ὕπαγε σεαυτὸν δεῖξον τῷ ἱερεῖ, καὶ προσένεγκον τὸ δῶρον ὃ προσέταξεν Μωϋσῆς εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/004.yaml
  text: And Jesus said to him[a], “See that you tell no one, but go, show yourself to the priest, and offer the gift that Moses commanded[b], as a testimony to them.”
translation:
  language: it
  text: 'E Gesù gli disse: «Bada di non dirlo a nessuno; ma va’, mostrati al sacerdote e presenta l’offerta prescritta da Mosè[a], come testimonianza a loro[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Questa istruzione richiama la procedura prescritta dalla legge di Mosè per una persona purificata dalla lebbra; vedi Levitico 14.
    reason: cross_reference
  - marker: b
    text: Il greco dice letteralmente «come testimonianza a loro». Il pronome può riferirsi ai sacerdoti o ad altri, e la testimonianza può essere intesa come prova presentata a loro oppure, secondo alcuni, come testimonianza contro chi non avrebbe creduto.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅρα μηδενὶ εἴπῃς
  choice: Bada di non dirlo a nessuno
  rationale: L’imperativo Ὅρα introduce idiomaticamente un avvertimento o un ordine; «Bada di» ne conserva la forza in italiano naturale. «Non dirlo a nessuno» rende il divieto senza dover esplicitare ciò che non va detto.
- source_word: ὕπαγε
  choice: va’
  rationale: Imperativo semplice di movimento, reso con l’equivalente italiano più diretto e naturale.
- source_word: σεαυτὸν δεῖξον τῷ ἱερεῖ
  choice: mostrati al sacerdote
  rationale: Riproduce la costruzione riflessiva e conserva il richiamo all’ispezione sacerdotale prevista per chi era stato purificato.
- source_word: ἱερεῖ
  choice: al sacerdote
  rationale: L’articolo greco indica verosimilmente il sacerdote competente per la procedura prescritta, senza rendere necessario specificarne ulteriormente l’identità.
- source_word: προσένεγκον τὸ δῶρον
  choice: presenta l’offerta
  rationale: Nel contesto cultuale προσφέρω indica la presentazione di un’offerta. «Offerta» comunica qui più chiaramente di «dono» la funzione rituale di δῶρον.
- source_word: ὃ προσέταξεν Μωϋσῆς
  choice: prescritta da Mosè
  rationale: La formulazione italiana esprime in modo scorrevole l’autorità normativa di προστάσσω e chiarisce che si tratta dell’offerta stabilita nella legge mosaica.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: come testimonianza per loro
  rationale: «Come testimonianza» conserva il valore di scopo o risultato della locuzione, mentre «per loro» lascia volutamente non specificato il referente del pronome.
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: Gesù gli disse
  rationale: Il presente storico greco è reso con il passato remoto, tempo narrativo naturale in italiano e coerente con il contesto.
theological_decisions:
- issue: Referente e valore di εἰς μαρτύριον αὐτοῖς
  choice: «come testimonianza per loro», senza identificare il referente né precisare se la testimonianza sia favorevole o accusatoria
  alternative: «come prova per i sacerdoti» oppure «come testimonianza contro di loro»
  rationale: Il pronome αὐτοῖς non identifica esplicitamente i destinatari, e μαρτύριον può indicare testimonianza o prova senza stabilirne da solo il carattere favorevole o giudiziario. La formulazione mantiene l’ambiguità del greco.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. «Bada di» mantiene il tono fermo dell’ordine senza risultare arcaico; «presenta l’offerta» rende naturalmente il contesto rituale. L’apostrofo tipografico in «va’» distingue l’imperativo dall’indicativo.
