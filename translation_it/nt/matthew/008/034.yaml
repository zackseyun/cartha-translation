id: MAT.8.34
reference: Matthew 8:34
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ πᾶσα ἡ πόλις ἐξῆλθεν εἰς ⸀ὑπάντησιν τῷ Ἰησοῦ, καὶ ἰδόντες αὐτὸν παρεκάλεσαν ὅπως μεταβῇ ἀπὸ τῶν ὁρίων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/034.yaml
  text: And behold[a], the whole city went out to meet Jesus, and when they saw him, they begged him to depart from their region.
translation:
  language: it
  text: Ed ecco, tutta la città uscì incontro a Gesù e, quando lo videro, lo supplicarono di allontanarsi dal loro territorio.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «dalla loro regione»; più letteralmente, «dai loro confini».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: ecco
  rationale: Conserva la funzione di richiamo dell'attenzione e la vivacità narrativa con una forma naturale nell'italiano moderno.
- source_word: πᾶσα ἡ πόλις
  choice: tutta la città
  rationale: Riproduce l'espressione collettiva greca, riferita alla popolazione della città nel suo insieme, senza dover precisare che si trattasse necessariamente di ogni singolo abitante.
- source_word: ἐξῆλθεν
  choice: uscì
  rationale: Rende direttamente l'aoristo di ἐξέρχομαι e il movimento dalla città verso Gesù.
- source_word: εἰς ὑπάντησιν τῷ Ἰησοῦ
  choice: incontro a Gesù
  rationale: È la resa italiana idiomatica del costrutto che indica l'uscire allo scopo di incontrare qualcuno.
- source_word: ἰδόντες αὐτόν
  choice: quando lo videro
  rationale: Rende il participio aoristo in senso temporale, mantenendo con naturalezza la sequenza narrativa.
- source_word: παρεκάλεσαν
  choice: lo supplicarono
  rationale: Esprime una richiesta insistente e accorata, più forte di un semplice 'chiesero', senza aggiungerne il motivo.
- source_word: ὅπως μεταβῇ
  choice: di allontanarsi
  rationale: Rende il contenuto della supplica e il senso di passare altrove o lasciare il luogo, in italiano corrente e dignitoso.
- source_word: ἀπὸ τῶν ὁρίων αὐτῶν
  choice: dal loro territorio
  rationale: Nel contesto, il plurale ὅρια designa l'area delimitata dai confini, non soltanto le linee di frontiera; 'territorio' comunica con precisione questo valore.
theological_decisions:
- issue: Motivo della richiesta degli abitanti
  choice: Il testo riferisce soltanto che supplicarono Gesù di allontanarsi.
  alternative: Precisare che agirono per paura della potenza di Gesù, per la perdita dei maiali o per un allarme generale.
  rationale: Il greco non dichiara il motivo della richiesta; la traduzione conserva quindi l'ambiguità narrativa e teologica senza introdurre un'interpretazione.
translation_notes:
  register: Italiano moderno standard, narrativo e dignitoso. «Ed ecco» mantiene il richiamo discorsivo del greco; «supplicarono» conserva l'intensità della richiesta. Il pronome plurale sottinteso in «videro» e «supplicarono» riprende naturalmente il collettivo «tutta la città».
