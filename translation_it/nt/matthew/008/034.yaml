  source_fidelity: 'La resa conserva tutti gli elementi del greco: il marcatore narrativo «ecco», il collettivo «tutta la città», l''uscire per incontrare Gesù, la sequenza temporale «quando lo videro» e la supplica affinché lasciasse il loro territorio. Non introduce alcun motivo per la richiesta, che il testo greco non esplicita.'
  naturalness: «Ed ecco» e «uscì incontro a Gesù» sono formulazioni narrative naturali e dignitose nell'italiano moderno standard. «Lo supplicarono di allontanarsi» è scorrevole e conserva l'intensità di παρεκάλεσαν.
  terminology: «Territorio» rende appropriatamente ὅρια nel suo valore contestuale di area o distretto; la nota segnala in modo utile sia «regione» sia il senso più letterale di «confini». I nomi e i termini narrativi sono coerenti con il registro richiesto.
