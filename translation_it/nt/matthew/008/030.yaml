  yaml_path: translation/nt/matthew/008/030.yaml
  text: A large herd of pigs was feeding some distance away from them[a].
translation:
  language: it
  text: A una certa distanza da loro c’era un grande branco di porci che pascolava.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «lontano da loro».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ
  choice: c’era
  rationale: L’imperfetto ἦν introduce la presenza del branco nella scena; «c’era» è naturale in italiano. La lieve funzione connettiva di δέ resta affidata al flusso narrativo, senza aggiungere un «ora» temporale non espresso.
- source_word: μακρὰν ἀπ’ αὐτῶν
  choice: a una certa distanza da loro
  rationale: Esprime chiaramente la distanza spaziale mantenendo una naturale ambiguità sulla sua entità; la nota segnala la resa più forte possibile.
- source_word: ἀγέλη
  choice: branco
  rationale: «Branco» è un termine italiano corrente per un insieme di animali e si adatta bene ai porci; «mandria» è possibile ma meno naturale in questo contesto.
- source_word: χοίρων
  choice: di porci
  rationale: «Porci» è preciso, dignitoso e tradizionalmente naturale nel registro biblico moderno, senza risultare arcaico.
- source_word: πολλῶν
  choice: grande
  rationale: Con il nome collettivo «branco», l’aggettivo «grande» rende idiomaticamente l’idea di molti animali.
- source_word: βοσκομένη
  choice: che pascolava
  rationale: Il participio medio presente descrive gli animali intenti a nutrirsi; «pascolava» conserva l’attività del branco senza introdurre custodi non menzionati.
