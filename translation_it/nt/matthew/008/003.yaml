review_pass:
  verdict: revise
  source_fidelity: La resa comunica correttamente i gesti, la risposta volitiva di Gesù, l’imperativo di purificazione e l’immediatezza dell’esito. Tuttavia, nell’ultima proposizione il greco ha «la sua lebbra» come soggetto; l’italiano idiomatico può mantenere la persona come soggetto, ma «sua» rende esplicito il possessivo di αὐτοῦ. La nota deve inoltre evitare di qualificare necessariamente come «gravi» le malattie della pelle comprese da λέπρα.
  naturalness: «Stesa la mano» è comprensibile ma meno scorrevole della coordinazione verbale italiana «Stese la mano e lo toccò». «Fu purificato dalla sua lebbra» è naturale in registro biblico-dignitoso e conserva il lessico della purificazione.
  terminology: «Purificato» riproduce coerentemente καθαρίζω senza ridurre il senso a sola guarigione. «Lebbra» è il termine tradizionale adeguato nel testo principale, con una nota che ne precisa prudentemente l’estensione storica.
  issues:
  - severity: low
    issue: Costruzione iniziale lievemente rigida
    rationale: «E, stesa la mano, lo toccò» è possibile, ma «Stese la mano e lo toccò» è più naturale nell’italiano moderno e conserva l’azione antecedente implicata dal participio greco.
  - severity: low
    issue: Possessivo non espresso nell’ultima frase
    rationale: «Fu purificato dalla lebbra» rende il senso, ma «dalla sua lebbra» riflette più pienamente αὐτοῦ senza appesantire il testo.
  - severity: medium
    issue: Nota troppo restrittiva sull’estensione di λέπρα
    rationale: La λέπρα biblica poteva designare varie affezioni cutanee e non va definita necessariamente «grave»; tale qualificazione aggiunge un elemento non richiesto dal greco.
