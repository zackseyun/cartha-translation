  text: καὶ ἐκτείνας τὴν χεῖρα ἥψατο ⸀αὐτοῦ λέγων· Θέλω, καθαρίσθητι· καὶ εὐθέως ἐκαθαρίσθη αὐτοῦ ἡ λέπρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/003.yaml
  text: And stretching out his hand[a], he touched him, saying, “I am willing[c][b]; be cleansed.” And immediately his leprosy was cleansed.
translation:
  language: it
  text: 'E stese la mano e lo toccò, dicendo: «Lo voglio; sii purificato». E subito fu purificato dalla sua lebbra.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Letteralmente: «la sua lebbra fu purificata». Il termine greco tradotto «lebbra» poteva indicare varie malattie della pelle, non soltanto quella oggi chiamata malattia di Hansen.'
    reason: Chiarisce la sintassi dell’originale e l’estensione storica del termine greco λέπρα.
lexical_decisions:
- source_word: ἐκτείνας τὴν χεῖρα
  choice: stesa la mano
  rationale: Il participio aoristo esprime un gesto che accompagna e precede immediatamente il contatto; «stesa la mano» è concreto, naturale e fedele all’immagine greca.
- source_word: ἥψατο αὐτοῦ
  choice: lo toccò
  rationale: Il medio ἅπτομαι con il genitivo significa normalmente «toccare»; la resa conserva in modo diretto il gesto significativo di Gesù.
- source_word: Θέλω
  choice: Lo voglio
  rationale: Risponde direttamente alla dichiarazione dell’uomo circa la volontà di Gesù. In italiano «Lo voglio» esprime chiaramente il consenso volitivo senza introdurre un valore futuro.
- source_word: καθαρίσθητι
  choice: sii purificato
  rationale: L’imperativo passivo conserva sia la guarigione fisica sia la dimensione di purezza implicata da καθαρίζω; «guarisci» appiattirebbe questa pluralità di senso.
- source_word: εὐθέως
  choice: subito
  rationale: «Subito» rende con naturalezza l’immediatezza del risultato sottolineata dal testo.
- source_word: ἐκαθαρίσθη
  choice: fu purificato
  rationale: La ripresa di «purificato» mantiene il legame lessicale con il comando καθαρίσθητι. Per un italiano naturale, la persona diventa il soggetto grammaticale, mentre la nota documenta la costruzione greca.
- source_word: ἡ λέπρα
  choice: dalla lebbra
  rationale: «Lebbra» mantiene il termine biblico tradizionale e riconoscibile; la nota chiarisce che λέπρα aveva un’estensione semantica più ampia della moderna malattia di Hansen.
theological_decisions:
- issue: Dimensione fisica e cultuale di καθαρίζω
  choice: Usare «purificare» sia nel comando sia nel risultato
  alternative: Usare «guarire»
  rationale: Il lessico greco non descrive soltanto una guarigione, ma richiama anche il passaggio dall’impurità alla purezza. «Purificare» conserva entrambe le dimensioni senza specificarne indebitamente il rapporto.
- issue: Valore di Θέλω nella risposta di Gesù
  choice: «Lo voglio»
  alternative: «Sono disposto» oppure «Voglio»
  rationale: «Lo voglio» risponde in modo idiomatico e diretto alla questione della volontà posta nel versetto precedente. Non trasforma la forma verbale in una promessa futura né aggiunge una motivazione teologica.
- issue: Soggetto dell’ultima proposizione
  choice: 'Resa idiomatica con la persona come soggetto: «fu purificato dalla lebbra»'
  alternative: 'Resa formale: «la sua lebbra fu purificata»'
  rationale: Nel greco «la sua lebbra» è grammaticalmente il soggetto, ma una traduzione letterale risulta semanticamente innaturale in italiano. La resa scelta conserva l’evento e il lessico della purificazione; la nota segnala la forma dell’originale.
translation_notes:
  register: Italiano moderno, dignitoso e leggibile. La frase breve «Lo voglio» mantiene la forza immediata della risposta; «sii purificato» conserva il linguaggio biblico della purezza senza risultare arcaico. La coordinazione iniziale con «E» rispecchia il flusso narrativo del testo greco.
