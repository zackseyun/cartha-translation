id: MAT.8.31
reference: Matthew 8:31
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: οἱ δὲ δαίμονες παρεκάλουν αὐτὸν λέγοντες· Εἰ ἐκβάλλεις ἡμᾶς, ⸂ἀπόστειλον ἡμᾶς⸃ εἰς τὴν ἀγέλην τῶν χοίρων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/031.yaml
  text: And the demons kept begging him[a], saying, “If you cast us out[b], send us into the herd of pigs.”
translation:
  language: it
  text: 'E i demoni continuavano a supplicarlo[a], dicendo: «Se ci scacci, mandaci nella mandria di porci[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «lo supplicavano»; l’imperfetto greco può indicare un’azione continuata o ripetuta.
    reason: lexical_alternative
  - marker: b
    text: O «maiali».
    reason: lexical_alternative
lexical_decisions:
- source_word: δαίμονες
  choice: demòni
  rationale: Resa italiana standard che conserva il riferimento a esseri spirituali malvagi personali, senza parafrasi o attenuazioni.
- source_word: παρεκάλουν
  choice: continuavano a supplicarlo
  rationale: L'imperfetto esprime un'azione protratta o ripetuta; questa formulazione ne rende chiaramente l'aspetto durativo.
- source_word: λέγοντες
  choice: dicendo
  rationale: Mantiene in modo naturale il participio greco che introduce il discorso diretto.
- source_word: Εἰ
  choice: Se
  rationale: Conserva la forma condizionale senza trasformarla interpretativamente in una dichiarazione causale.
- source_word: ἐκβάλλεις
  choice: ci scacci
  rationale: Nel contesto di esorcismo, «scacciare» è preciso, idiomatico e tradizionalmente comprensibile.
- source_word: ἀπόστειλον ἡμᾶς
  choice: mandaci
  rationale: Rende direttamente l'imperativo aoristo e il pronome oggetto, con naturalezza in italiano.
- source_word: ἀγέλην
  choice: mandria
  rationale: Termine italiano appropriato per un gruppo di animali, inclusi i suini.
- source_word: χοίρων
  choice: porci
  rationale: Resa precisa e dignitosa del termine greco; «maiali» è l'alternativa più colloquiale.
- source_word: οἱ δὲ
  choice: E i
  rationale: Segnala la prosecuzione narrativa senza accentuare indebitamente un contrasto.
theological_decisions:
- issue: Identità degli esseri che parlano
  choice: demòni
  alternative: spiriti demoniaci
  rationale: Il testo presenta esseri malvagi personali che si rivolgono a Gesù; «demòni» conserva tale affermazione senza aggiunte dottrinali.
- issue: Forza della proposizione condizionale
  choice: Se ci scacci
  alternative: Poiché ci scacci
  rationale: La traduzione mantiene l'ambiguità pragmatica del greco Εἰ e non converte la condizione in un'affermazione esplicita di certezza.
translation_notes:
  register: Italiano moderno, naturale e dignitoso. «Continuavano a supplicarlo» esplicita il valore durativo dell'imperfetto; «porci» mantiene un registro biblico sobrio senza risultare arcaico. Tutti i richiami di nota compaiono nel testo.
