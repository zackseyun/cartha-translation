  text: οἱ δὲ ἄνθρωποι ἐθαύμασαν λέγοντες· Ποταπός ἐστιν οὗτος ὅτι καὶ οἱ ἄνεμοι καὶ ἡ θάλασσα ⸂αὐτῷ ὑπακούουσιν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/027.yaml
  text: And the men marveled[a], saying, “What sort of man is this, that even the winds and the sea obey him?”
translation:
  language: it
  text: 'Gli uomini si meravigliarono e dissero: «Che tipo d’uomo è questo, che perfino i venti e il mare gli ubbidiscono?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ ἄνθρωποι
  choice: Gli uomini
  rationale: Nel contesto indica gli uomini presenti sulla barca, verosimilmente i discepoli; «gli uomini» mantiene il riferimento concreto senza generalizzarlo a tutta la gente.
- source_word: ἐθαύμασαν λέγοντες
  choice: stupiti, dicevano
  rationale: La costruzione italiana rende in modo naturale la reazione di meraviglia e il participio collegato, conservando la simultaneità tra stupore e parole.
- source_word: Ποταπός ἐστιν οὗτος
  choice: Che tipo d’uomo è costui
  rationale: ποταπός domanda quale sorta o qualità di persona sia; «che tipo d’uomo» è chiaro e moderno, mentre «costui» conserva la forza deittica di οὗτος con registro narrativo dignitoso.
- source_word: ὅτι
  choice: se
  rationale: In questa domanda esclamativa «se» introduce in italiano il fatto sorprendente che motiva l’interrogativo, senza ridurlo a una semplice causa.
- source_word: καὶ οἱ ἄνεμοι καὶ ἡ θάλασσα
  choice: perfino i venti e il mare
  rationale: «Perfino» esprime naturalmente il valore enfatico di καί e mette in risalto l’estensione dell’autorità alle forze naturali.
- source_word: αὐτῷ ὑπακούουσιν
  choice: gli ubbidiscono
  rationale: ὑπακούω denota l’ubbidire o il dare ascolto; il pronome indiretto italiano riproduce αὐτῷ e comunica l’autorità personale esercitata.
theological_decisions:
- issue: Forza cristologica della domanda dei discepoli
  choice: Mantenere la domanda aperta e stupita, lasciando implicita la portata dell’autorità di Gesù sulla creazione.
  alternative: Esplicitare una conclusione sull’identità di Gesù oppure presentare la scena soltanto come stupore davanti a un prodigio.
  rationale: Il testo suscita una domanda sull’identità di Gesù attraverso l’ubbidienza dei venti e del mare, ma non formula qui una risposta dottrinale esplicita. La traduzione conserva tale tensione.
translation_notes:
  register: Italiano standard moderno, naturale e dignitoso. «Stupiti» è più corrente di «meravigliati» in questa costruzione; «ubbidiscono» conserva una sfumatura personale e autorevole. Non sono necessarie note testuali o lessicali per questa resa.
