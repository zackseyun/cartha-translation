id: MAT.8.17
reference: Matthew 8:17
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ὅπως πληρωθῇ τὸ ῥηθὲν διὰ Ἠσαΐου τοῦ προφήτου λέγοντος· Αὐτὸς τὰς ἀσθενείας ἡμῶν ἔλαβεν καὶ τὰς νόσους ἐβάστασεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/017.yaml
  text: 'so that what was spoken through Isaiah the prophet might be fulfilled[b][a], saying: “He himself took our sicknesses and carried our diseases.”'
translation:
  language: it
  text: 'affinché si compisse ciò che era stato detto per mezzo del profeta Isaia, il quale diceva: «Egli stesso ha preso le nostre infermità[a] e ha portato[b] le nostre malattie».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «debolezze». Il termine greco può indicare debolezze, infermità o malattie.
    reason: lexical_alternative
  - marker: b
    text: O «ha sostenuto» o «si è fatto carico di». «Ha portato» rende direttamente il verbo greco e conserva la risonanza della citazione di Isaia 53:4.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπως πληρωθῇ
  choice: affinché si compisse
  rationale: Rende la costruzione finale/consecutiva con il congiuntivo e conserva il motivo matteano del compimento.
- source_word: τὸ ῥηθὲν
  choice: ciò che era stato detto
  rationale: Resa italiana naturale del participio sostantivato, con il trapassato che colloca la parola profetica prima del suo compimento.
- source_word: διὰ Ἠσαΐου τοῦ προφήτου
  choice: per mezzo del profeta Isaia
  rationale: 'Conserva il valore strumentale di διά con il genitivo: la parola è comunicata mediante il profeta.'
- source_word: λέγοντος
  choice: ':'
  rationale: In italiano i due punti introducono direttamente e con naturalezza le parole attribuite al profeta, assorbendo la funzione del participio senza appesantire la frase con «che dice».
- source_word: Αὐτὸς
  choice: Egli stesso
  rationale: Mantiene l'enfasi espressa dal pronome greco.
- source_word: ἀσθενείας
  choice: infermità
  rationale: Termine sufficientemente ampio da indicare debolezze o affezioni fisiche e adatto al contesto delle guarigioni, distinto da «malattie» nel membro successivo.
- source_word: ἔλαβεν
  choice: ha preso
  rationale: Rende direttamente λαμβάνω senza aggiungere interpretativamente «su di sé» o «via».
- source_word: νόσους
  choice: malattie
  rationale: Resa precisa e corrente del termine che indica malattie o patologie.
- source_word: ἐβάστασεν
  choice: ha portato
  rationale: Conserva il senso concreto di portare o sostenere e lascia aperta la risonanza teologica della citazione di Isaia.
theological_decisions:
- issue: Portata della citazione di Isaia 53:4 nel contesto delle guarigioni
  choice: infermità e malattie
  alternative: debolezze e malattie; oppure sofferenze e dolori
  rationale: Il contesto immediato applica la citazione alle guarigioni fisiche operate da Gesù. La traduzione evita però di restringere il testo a una specifica formulazione dottrinale e conserva, tramite «portato», la tensione con il più ampio contesto di Isaia 53.
- issue: Senso di ἔλαβεν ed ἐβάστασεν
  choice: ha preso ... ha portato
  alternative: si è fatto carico ... ha sostenuto
  rationale: La resa scelta mantiene distinti i due verbi greci e non esplicita oltre il testo né la rimozione delle malattie né una particolare teoria della sostituzione.
translation_notes:
  register: Italiano standard moderno, dignitoso e leggibile. La formulazione mantiene il carattere di citazione profetica senza ricorrere a lessico confessionale specialistico.
