id: MAT.8.12
reference: Matthew 8:12
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: οἱ δὲ υἱοὶ τῆς βασιλείας ἐκβληθήσονται εἰς τὸ σκότος τὸ ἐξώτερον· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/012.yaml
  text: But the sons of the kingdom will be cast out into the outer darkness[c][b][a]. There will be weeping and gnashing of teeth there.
translation:
  language: it
  text: Ma i figli del regno[a] saranno gettati fuori, nelle tenebre più esterne. Là ci saranno pianto e stridore di denti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cioè coloro che erano considerati gli eredi naturali o coloro che avevano diritto di appartenere al regno. Il greco dice letteralmente «figli del regno».
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ υἱοὶ τῆς βασιλείας
  choice: Ma i figli del regno
  rationale: '«Ma» rende il contrasto segnato da δέ con il versetto precedente. «Figli del regno» conserva l''idioma greco e la sua ironia: coloro che erano considerati appartenenti di diritto al regno ne vengono esclusi.'
- source_word: ἐκβληθήσονται
  choice: saranno gettati fuori
  rationale: Il futuro passivo di ἐκβάλλω esprime un'espulsione energica; «gettati fuori» è chiaro, vigoroso e naturale nell'italiano moderno.
- source_word: εἰς τὸ σκότος τὸ ἐξώτερον
  choice: nelle tenebre più profonde
  rationale: ἐξώτερον è il comparativo di «esterno» e, nell'espressione matteana, indica le tenebre estreme, al di fuori. «Più profonde» produce in italiano un'immagine naturale senza sostituirla con un'interpretazione dottrinale.
- source_word: ἐκεῖ
  choice: Là
  rationale: La collocazione iniziale conserva l'enfasi locale dell'avverbio greco.
- source_word: ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων
  choice: pianto e stridore di denti
  rationale: È la resa italiana tradizionale e ancora comprensibile della formula, e mantiene le due immagini concrete di dolore e tensione.
theological_decisions:
- issue: Immagini del giudizio e dell'esclusione
  choice: Conservare le immagini concrete dell'espulsione, delle tenebre, del pianto e dello stridore di denti.
  alternative: Esplicitare con termini sistematici come «inferno» o «punizione eterna».
  rationale: Il testo raffigura un grave giudizio escatologico, ma non adopera qui un termine equivalente a «inferno»; la traduzione non deve sviluppare l'immagine oltre ciò che il greco afferma.
- issue: Valore idiomatico di υἱοὶ τῆς βασιλείας
  choice: figli del regno
  alternative: eredi del regno; appartenenti al regno
  rationale: La resa formale conserva sia la formulazione maschile del greco sia l'idioma di appartenenza o condizione presunta, senza ridurlo alla sola idea giuridica di eredità.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. La sintassi mantiene il forte contrasto iniziale e l'enfasi di «Là», evitando sia arcaismi non necessari sia parafrasi dottrinali.
