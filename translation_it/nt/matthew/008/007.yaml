  text: ⸀καὶ λέγει ⸀αὐτῷ· Ἐγὼ ἐλθὼν θεραπεύσω αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/007.yaml
  text: And he says to him[a], “I will come and heal him.”
translation:
  language: it
  text: 'E gli dice[a]: «Verrò e lo guarirò».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «Dovrei venire e guarirlo?». Alcuni interpreti intendono le parole di Gesù come una domanda in base al contesto, ma la formulazione greca si legge naturalmente come un''affermazione.'
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Conserva il semplice collegamento narrativo senza aggiungere un valore temporale o consequenziale non esplicito.
- source_word: λέγει
  choice: dice
  rationale: Riproduce il presente storico greco, naturale anche nella narrazione italiana e capace di mantenerne la vivacità.
- source_word: αὐτῷ
  choice: gli
  rationale: Rende in modo idiomatico il dativo di termine retto da λέγει.
- source_word: Ἐγὼ
  choice: (soggetto implicito in «Verrò»)
  rationale: In italiano la prima persona è già espressa dalla forma verbale; inserire «io» produrrebbe un'enfasi maggiore di quanto il contesto richieda.
- source_word: ἐλθὼν
  choice: Verrò e
  rationale: Il participio aoristo unito al futuro esprime qui un'azione concomitante o precedente; la coordinazione italiana restituisce con naturalezza la sequenza.
- source_word: θεραπεύσω
  choice: guarirò
  rationale: Nel contesto di una malattia, «guarire» è l'equivalente italiano più diretto e naturale.
- source_word: αὐτόν
  choice: lo
  rationale: Pronome oggetto riferito al servo malato, reso idiomaticamente in italiano.
theological_decisions:
- issue: Se rendere le parole di Gesù come affermazione o domanda
  choice: 'Affermazione: «Verrò e lo guarirò».'
  alternative: 'Domanda: «Devo venire a guarirlo?» oppure «Verrò io a guarirlo?»'
  rationale: Il greco non presenta una particella interrogativa e si legge naturalmente come dichiarazione. Il contesto consente che alcuni interpreti vi riconoscano una domanda, perciò l'alternativa viene segnalata in nota senza sostituirla al senso sintatticamente più immediato.
translation_notes:
  register: Italiano moderno, semplice e dignitoso. Il presente storico «dice» conserva la vivacità narrativa dell'originale; la costruzione «Verrò e lo guarirò» evita un calco rigido del participio greco.
