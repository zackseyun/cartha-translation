id: MAT.8.33
reference: Matthew 8:33
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: οἱ δὲ βόσκοντες ἔφυγον, καὶ ἀπελθόντες εἰς τὴν πόλιν ἀπήγγειλαν πάντα καὶ τὰ τῶν δαιμονιζομένων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/033.yaml
  text: Then the herdsmen fled[a], and going away into the city, they reported everything, including what had happened to the demon-possessed men.
translation:
  language: it
  text: Ma i guardiani dei porci fuggirono e, andati in città, riferirono ogni cosa, compreso quanto era accaduto agli indemoniati.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Più letteralmente: «e le cose riguardanti gli indemoniati».'
    reason: Alternativa lessicale e conservazione dell'ellissi greca.
lexical_decisions:
- source_word: οἱ δὲ βόσκοντες
  choice: Ma i mandriani
  rationale: Il participio sostantivato indica coloro che custodivano e pascolavano la mandria di porci. «Mandriani» è conciso e naturale; δέ è reso con «Ma», mantenendo il passaggio narrativo e il lieve contrasto.
- source_word: ἔφυγον
  choice: fuggirono
  rationale: L'aoristo di φεύγω indica una fuga; «fuggirono» ne conserva direttamente la forza narrativa.
- source_word: ἀπελθόντες εἰς τὴν πόλιν
  choice: andati in città
  rationale: Il participio aoristo esprime un'azione precedente al riferire. La costruzione italiana è naturale e conserva il movimento verso la città senza appesantire la frase.
- source_word: ἀπήγγειλαν πάντα
  choice: riferirono ogni cosa
  rationale: ἀπαγγέλλω significa riferire o comunicare una notizia; «riferirono» si adatta al contesto. «Ogni cosa» conserva il valore comprensivo di πάντα.
- source_word: καὶ τὰ τῶν δαιμονιζομένων
  choice: compreso quanto era accaduto agli indemoniati
  rationale: La locuzione ellittica significa letteralmente «e le cose riguardanti gli indemoniati». La resa esplicita il senso contestuale in italiano corrente, mentre la nota conserva la formulazione più letterale.
- source_word: δαιμονιζομένων
  choice: indemoniati
  rationale: Il termine descrive persone sottoposte al potere dei demoni. «Indemoniati» è la resa italiana tradizionale, chiara e concisa, senza precisare ulteriormente la natura dell'afflizione.
theological_decisions:
- issue: Resa di δαιμονιζομένων senza introdurre una tassonomia dottrinale estranea al testo
  choice: indemoniati
  alternative: uomini tormentati dai demoni
  rationale: «Indemoniati» riconosce la reale afflizione demoniaca narrata dal testo, ma non introduce distinzioni speculative tra possessione, oppressione o altre categorie.
- issue: Esplicitazione dell'ellissi τὰ τῶν δαιμονιζομένων
  choice: quanto era accaduto agli indemoniati
  alternative: le cose riguardanti gli indemoniati
  rationale: Nel contesto la frase riguarda gli avvenimenti relativi ai due uomini; l'esplicitazione rende il senso naturale, mentre la nota documenta l'ambiguità e la forma più letterale.
translation_notes:
  register: Italiano moderno, dignitoso e narrativamente scorrevole. «Mandriani» evita una perifrasi pesante; «indemoniati» è comprensibile nel registro biblico comune. La nota segnala l'ellissi dell'originale senza appesantire il testo principale.
