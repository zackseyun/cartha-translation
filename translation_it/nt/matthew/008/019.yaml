id: MAT.8.19
reference: Matthew 8:19
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: καὶ προσελθὼν εἷς γραμματεὺς εἶπεν αὐτῷ· Διδάσκαλε, ἀκολουθήσω σοι ὅπου ἐὰν ἀπέρχῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/019.yaml
  text: And one scribe came up and said to him[a], “Teacher, I will follow you wherever you go.”
translation:
  language: it
  text: 'E uno scriba si avvicinò e gli disse: «Maestro, ti seguirò dovunque tu vada[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oppure «dovunque tu te ne vada». Il verbo greco può indicare più specificamente l'andarsene, ma qui può essere reso naturalmente con «andare».
    reason: Alternativa lessicale per ἀπέρχῃ.
lexical_decisions:
- source_word: προσελθὼν
  choice: si avvicinò
  rationale: Il participio aoristo indica che lo scriba si accostò a Gesù prima di parlargli; «si avvicinò» è naturale e conserva chiaramente il movimento verso di lui.
- source_word: εἷς
  choice: uno
  rationale: Il numerale introduce un singolo individuo e viene conservato, anziché essere omesso o reso con l'interpretativo «un certo».
- source_word: γραμματεὺς
  choice: scriba
  rationale: «Scriba» è il termine tradizionale e preciso per lo specialista della Legge nel contesto evangelico, senza ampliare il testo con una spiegazione interpretativa.
- source_word: Διδάσκαλε
  choice: Maestro
  rationale: In italiano «Maestro» è l'appellativo naturale per chi insegna e rende il titolo senza ricorrere alla traslitterazione «Rabbi» né attribuirgli un peso ulteriore.
- source_word: ἀκολουθήσω
  choice: ti seguirò
  rationale: Il futuro indicativo esprime direttamente l'intenzione dichiarata dall'uomo e mantiene sia il senso concreto sia la possibile risonanza discepolare del verbo.
- source_word: ὅπου ἐὰν
  choice: dovunque
  rationale: La costruzione esprime un luogo indefinito e aperto; «dovunque» la rende in modo conciso e idiomatico.
- source_word: ἀπέρχῃ
  choice: tu vada
  rationale: Nel contesto il verbo indica l'andare verso qualunque destinazione; «vada» è l'espressione italiana più naturale, mentre la sfumatura più specifica di allontanamento è segnalata in nota.
theological_decisions:
- issue: Resa di διδάσκαλος come appellativo rivolto a Gesù
  choice: Maestro
  alternative: Rabbi; Signore
  rationale: «Maestro» corrisponde al valore lessicale e al rispettoso appellativo del testo, senza trasformarlo in un titolo cristologico più forte né sostituirlo con un titolo ebraico non presente.
translation_notes:
  register: Italiano moderno, dignitoso e scorrevole. «Scriba» conserva il termine storico; «Maestro» è naturale nel discorso diretto. La costruzione «E uno scriba» mantiene il καί narrativo e il numerale εἷς senza appesantire la frase.
