source:
  edition: SBLGNT
  text: Καὶ ἐλθὼν ὁ Ἰησοῦς εἰς τὴν οἰκίαν Πέτρου εἶδεν τὴν πενθερὰν αὐτοῦ βεβλημένην καὶ πυρέσσουσαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/014.yaml
  text: And when Jesus came into Peter’s house[b][a], he saw his mother-in-law lying down and having a fever.
translation:
  language: it
  text: Gesù entrò nella casa di Pietro e vide la suocera di Pietro coricata[a] e con la febbre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «a letto». Il greco indica letteralmente che era stata posta o giaceva coricata; il letto è implicito nel contesto, ma non viene menzionato espressamente.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: entrò
  rationale: Il participio aoristo indica un’azione che precede o accompagna quella principale. La coordinazione italiana «entrò… e vide» rende con naturalezza la sequenza narrativa.
- source_word: οἰκίαν Πέτρου
  choice: nella casa di Pietro
  rationale: Rende direttamente il genitivo possessivo e conserva il senso ordinario di οἰκία.
- source_word: πενθερὰν αὐτοῦ
  choice: la suocera di Pietro
  rationale: πενθερά significa specificamente «suocera». Ripetere «di Pietro» evita che in italiano il possessivo «sua» venga riferito per errore a Gesù.
- source_word: βεβλημένην
  choice: coricata
  rationale: Il participio perfetto passivo descrive lo stato in cui la donna si trovava. «Coricata» è naturale e non aggiunge esplicitamente il letto, che il contesto può soltanto implicare.
- source_word: πυρέσσουσαν
  choice: con la febbre
  rationale: Rende in italiano corrente la condizione continuativa espressa dal participio presente, senza intensificarla con espressioni come «ardente di febbre».
theological_decisions:
- issue: Referente di αὐτοῦ in πενθερὰν αὐτοῦ
  choice: La donna è identificata esplicitamente come la suocera di Pietro.
  alternative: «Sua suocera», formulazione che in italiano potrebbe essere fraintesa come riferita a Gesù.
  rationale: La sintassi e il contesto collegano il pronome a Pietro. La ripetizione del nome rende inequivocabile il referente senza trarre ulteriori conclusioni dottrinali.
translation_notes:
  register: Italiano moderno, piano e dignitoso. La coordinazione narrativa è più naturale della costruzione participiale «essendo entrato»; «coricata» conserva la sobrietà del testo greco.
source_grounding:
  english_pob_role: consult_only
