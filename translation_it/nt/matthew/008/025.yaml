  text: καὶ ⸀προσελθόντες ἤγειραν αὐτὸν λέγοντες· Κύριε, ⸀σῶσον, ἀπολλύμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/025.yaml
  text: And they came and woke him[a], saying, “Lord, save us! We are perishing!”
translation:
  language: it
  text: 'E gli si avvicinarono e lo svegliarono, dicendo: «Signore, salvaci! Stiamo perendo!»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «Siamo perduti!» Il verbo greco può riferirsi alla rovina o alla morte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθόντες
  choice: avvicinatisi
  rationale: Il participio aoristo di προσέρχομαι indica che i discepoli si avvicinarono a Gesù prima di svegliarlo. «Avvicinatisi» conserva il rapporto temporale e il movimento verso di lui senza aggiungere elementi.
- source_word: ἤγειραν
  choice: lo svegliarono
  rationale: In questo contesto ἐγείρω indica concretamente lo svegliare una persona addormentata, non il risuscitare o il far alzare.
- source_word: λέγοντες
  choice: dicendo
  rationale: Il participio presente introduce direttamente le parole dei discepoli; «dicendo» non aggiunge un'intensità emotiva assente dal verbo.
- source_word: Κύριε
  choice: Signore
  rationale: Il vocativo di κύριος è reso con il titolo italiano consueto «Signore», preservandone sia il valore di appellativo rispettoso sia la possibile risonanza cristologica.
- source_word: σῶσον
  choice: salvaci
  rationale: L'imperativo aoristo di σῴζω esprime qui una richiesta urgente di liberazione dal pericolo. Il pronome «ci», implicito nel contesto e chiarito dal successivo verbo alla prima persona plurale, è necessario nell'italiano idiomatico.
- source_word: ἀπολλύμεθα
  choice: stiamo per morire
  rationale: Nel contesto della tempesta, il presente medio-passivo di ἀπόλλυμι esprime il pericolo imminente di rovina o morte. «Stiamo per morire» comunica in italiano corrente l'imminenza e l'urgenza senza suggerire che siano già nel processo fisico del morire.
theological_decisions:
- issue: Valore del titolo κύριος rivolto a Gesù
  choice: Signore
  alternative: Maestro
  rationale: «Signore» mantiene aperta l'ampiezza del titolo, che può essere un appellativo rispettoso e al tempo stesso avere una portata cristologica; «Maestro» ne restringerebbe il valore.
- issue: Oggetto sottinteso dell'imperativo σῶσον
  choice: salvaci
  alternative: salva
  rationale: Il greco non esprime un oggetto separato, ma la prima persona plurale di ἀπολλύμεθα e il contesto rendono evidente che la richiesta riguarda i discepoli. L'italiano richiede naturalmente «ci».
- issue: Portata di ἀπολλύμεθα
  choice: stiamo per morire
  alternative: stiamo perendo
  rationale: La resa scelta esplicita la morte imminente implicata dalla situazione senza attribuire al verbo un significato teologico ulteriore; «stiamo perendo» sarebbe più formale ma meno naturale nell'italiano moderno.
translation_notes:
  register: Italiano moderno, dignitoso e immediatamente comprensibile. La costruzione participiale «avvicinatisi» conserva la sequenza del greco; il discorso diretto usa una formulazione urgente e naturale. Il marcatore [a] è collocato dopo la frase cui si riferisce.
