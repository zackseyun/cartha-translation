  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: καὶ λέγων· Κύριε, ὁ παῖς μου βέβληται ἐν τῇ οἰκίᾳ παραλυτικός, δεινῶς βασανιζόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/006.yaml
  text: and saying[a], “Lord, my servant is lying paralyzed at home[b], suffering terribly.”
translation:
  language: it
  text: 'e dicendo: «Signore, il mio servo[a] giace in casa, paralizzato, soffrendo terribilmente[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «il mio ragazzo» oppure «mio figlio»; il termine greco può indicare un servo o un giovane/figlio, anche se «servo» si adatta meglio al contesto del centurione.
    reason: lexical_alternative
  - marker: b
    text: 'Oppure: «è gravemente tormentato».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ λέγων
  choice: e dicendo
  rationale: Mantiene il collegamento participiale del greco con il contesto precedente; in italiano la forma è naturale all'interno della frase narrativa più ampia.
- source_word: Κύριε
  choice: Signore
  rationale: Conserva sia il possibile valore di appellativo rispettoso sia una portata cristologica più alta, senza decidere tra i due.
- source_word: ὁ παῖς μου
  choice: il mio servo
  rationale: παῖς può indicare un servo, un ragazzo o un figlio; nel contesto del centurione «servo» è la scelta più probabile, mentre l'ambiguità è segnalata in nota.
- source_word: βέβληται ἐν τῇ οἰκίᾳ
  choice: è a letto in casa
  rationale: Il perfetto passivo esprime qui lo stato risultante della persona costretta a giacere; «è a letto in casa» è idiomatico e non suggerisce letteralmente che qualcuno l'abbia gettata.
- source_word: παραλυτικός
  choice: paralizzato
  rationale: Rende l'aggettivo in modo predicativo, chiaro e corrente.
- source_word: δεινῶς βασανιζόμενος
  choice: soffre terribilmente
  rationale: Comunica la grave afflizione fisica in italiano naturale; la resa più letterale e intensa «è tormentato duramente» è conservata in nota.
theological_decisions:
- issue: Valore di κύριε rivolto a Gesù
  choice: Signore
  alternative: Signore nel solo senso cortese; oppure «signore»/«signor mio»
  rationale: «Signore» lascia aperta la tensione tra un rispettoso appellativo sociale e un riconoscimento più profondo dell'identità e dell'autorità di Gesù.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. La costruzione participiale conserva il legame sintattico con il versetto precedente. «È a letto» rende idiomaticamente lo stato risultante espresso da βέβληται; le note preservano le principali ambiguità lessicali.
