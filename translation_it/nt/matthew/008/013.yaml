  variant: modern standard Italian
source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ Ἰησοῦς τῷ ἑκατοντάρχῃ· Ὕπαγε, ⸀ὡς ἐπίστευσας γενηθήτω σοι· καὶ ἰάθη ὁ ⸀παῖς ἐν τῇ ὥρᾳ ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/013.yaml
  text: And Jesus said to the centurion[a], “Go; as you have believed, let it be done for you.” And the servant was healed in that hour.
translation:
  language: it
  text: 'Gesù disse al centurione: «Va’, e ti sia fatto come hai creduto». E in quell’ora il servo[a] fu guarito.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oppure «ragazzo» o «bambino»; il greco παῖς può indicare un servo oppure una persona giovane. In questo contesto «servo» sembra accordarsi meglio con una persona al servizio del centurione.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκατοντάρχῃ
  choice: centurione
  rationale: Termine italiano preciso e consueto per l’ufficiale romano posto al comando di circa cento soldati.
- source_word: Ὕπαγε
  choice: Va’
  rationale: Imperativo di movimento espresso in modo diretto, naturale e aderente al greco.
- source_word: ὡς ἐπίστευσας
  choice: come hai creduto
  rationale: Mantiene il valore verbale e personale dell’aoristo ἐπίστευσας, senza trasformarlo nella formulazione nominale più interpretativa «secondo la tua fede».
- source_word: γενηθήτω σοι
  choice: ti sia fatto
  rationale: Conserva il valore iussivo dell’imperativo passivo aoristo e rende in italiano dignitoso e naturale il dativo σοι.
- source_word: παῖς
  choice: servo
  rationale: Nel contesto indica verosimilmente il subordinato del centurione; il campo semantico del termine comprende però anche «ragazzo» e «fanciullo», possibilità segnalate in nota.
- source_word: ἰάθη
  choice: fu guarito
  rationale: Rende direttamente il passivo aoristo di ἰάομαι e comunica il ristabilimento del malato.
- source_word: ἐν τῇ ὥρᾳ ἐκείνῃ
  choice: in quell’ora
  rationale: Riproduce l’espressione temporale greca senza specificare più del testo se si tratti dell’istante preciso o di quel medesimo periodo di tempo.
theological_decisions:
- issue: Resa di πιστεύω
  choice: hai creduto
  alternative: hai avuto fede; ti sei fidato
  rationale: «Hai creduto» mantiene la forma verbale del greco e preserva il rapporto espresso da ὡς fra il credere del centurione e ciò che gli viene concesso, senza ridefinire qui la fede come semplice fiducia né sostituire il verbo con un sostantivo.
translation_notes:
  register: Italiano moderno, sobrio e dignitoso. «Va’» e «ti sia fatto» mantengono la concisione e la forza dell’enunciato greco; «in quell’ora» conserva volutamente l’espressione temporale senza convertirla nell’interpretazione più precisa «in quello stesso istante».
