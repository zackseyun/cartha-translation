id: MAT.8.15
reference: Matthew 8:15
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: καὶ ἥψατο τῆς χειρὸς αὐτῆς, καὶ ἀφῆκεν αὐτὴν ὁ πυρετός, καὶ ἠγέρθη καὶ διηκόνει αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/015.yaml
  text: And he touched her hand, and the fever left her, and she got up and began serving him.
translation:
  language: it
  text: Egli le toccò la mano, e la febbre la lasciò; ella si alzò e si mise a servirlo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «lo serviva». L’imperfetto greco può descrivere un’azione in corso, ma può anche indicare che ella cominciò a servirlo.
    reason: Alternativa aspettuale e lessicale per διηκόνει.
lexical_decisions:
- source_word: ἥψατο
  choice: toccò
  rationale: Il medio di ἅπτω con il genitivo indica qui il contatto fisico; «toccò» è la resa italiana più semplice e naturale, senza suggerire che le afferrò la mano.
- source_word: τῆς χειρὸς αὐτῆς
  choice: le... la mano
  rationale: χείρ indica normalmente la mano. La costruzione italiana con pronome indiretto e articolo determinativo («le toccò la mano») rende in modo idiomatico il genitivo greco.
- source_word: ἀφῆκεν αὐτὴν ὁ πυρετός
  choice: la febbre la lasciò
  rationale: ἀφίημι significa qui «lasciare, abbandonare». La formulazione conserva la vivace personificazione presente nel greco.
- source_word: πυρετός
  choice: febbre
  rationale: Il sostantivo designa direttamente la febbre; non occorre ampliarlo in «malattia febbrile».
- source_word: ἠγέρθη
  choice: si alzò
  rationale: In questo contesto il passivo di ἐγείρω ha valore intransitivo e descrive la donna che si alza dopo la guarigione. «Si alzò» è naturale e non introduce indebite connotazioni di risurrezione.
- source_word: διηκόνει αὐτῷ
  choice: si mise a servirlo
  rationale: διακονέω indica il prestare servizio. L'imperfetto può essere inteso in senso ingressivo, come inizio dell'azione; la nota conserva anche la possibile lettura durativa semplice.
theological_decisions:
- issue: Possibile sovrainterpretazione teologica di ἠγέρθη
  choice: si alzò, nel normale senso narrativo
  alternative: fu rialzata
  rationale: Benché ἐγείρω possa assumere altrove associazioni con la risurrezione, qui il contesto immediato descrive semplicemente la donna che si alza una volta guarita.
- issue: Valore aspettuale dell'imperfetto διηκόνει
  choice: si mise a servirlo
  alternative: lo serviva
  rationale: La resa principale esprime una plausibile sfumatura ingressiva dell'imperfetto, senza farne una certezza; la nota segnala la lettura durativa, mantenendo l'ambiguità del greco.
translation_notes:
  register: Italiano moderno, dignitoso e narrativamente scorrevole. «Egli» evita l'ambiguità iniziale del semplice «lui»; il punto e virgola rende chiaramente la successione fra guarigione e risposta della donna. La costruzione pronominale «le toccò la mano» è idiomatica nell'italiano standard.
