lexical_decisions:
- source_word: Ὑμεῖς
  choice: Voi
  rationale: Il pronome è espresso ed enfatico; «Voi» ne conserva il rilievo, anche in contrasto con chi non comprende.
- source_word: οὖν
  choice: dunque
  rationale: Segnala il passaggio consequenziale dal discorso precedente e in italiano suona naturale e dignitoso.
- source_word: ἀκούσατε
  choice: ascoltate
  rationale: Imperativo aoristo attivo di seconda persona plurale. «Ascoltate» conserva l'esortazione senza introdurre esplicitamente il senso più interpretativo di «comprendete».
- source_word: παραβολὴν
  choice: parabola
  rationale: È il termine italiano standard e preciso nel contesto dell'insegnamento sinottico.
- source_word: τοῦ σπείραντος
  choice: del seminatore
  rationale: L'articolo con il participio aoristo sostantivato significa letteralmente «di colui che seminò»; «del seminatore» ne rende in modo naturale la funzione sostantivata senza alterare il referente.
theological_decisions: []
