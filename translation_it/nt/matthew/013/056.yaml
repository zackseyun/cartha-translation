  text: καὶ αἱ ἀδελφαὶ αὐτοῦ οὐχὶ πᾶσαι πρὸς ἡμᾶς εἰσιν; πόθεν οὖν τούτῳ ταῦτα πάντα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/056.yaml
  text: And are not all his sisters with us? Where then did this man get all these things?[a]
translation:
  language: it
  text: E le sue sorelle non sono tutte qui fra noi? Da dove vengono dunque a costui tutte queste cose?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il termine greco significa normalmente «sorelle»; alcuni, alla luce di successive discussioni teologiche, lo intendono in senso più ampio come «parenti di sesso femminile».
    reason: alternative_reading
lexical_decisions:
- source_word: ἀδελφαὶ
  choice: sorelle
  rationale: È il significato familiare ordinario del termine e si adatta al riferimento alla famiglia di Gesù nel contesto.
- source_word: οὐχὶ πᾶσαι
  choice: non sono tutte
  rationale: Conserva la domanda retorica, che presuppone una risposta affermativa, e l'enfasi sulla totalità delle sorelle.
- source_word: πρὸς ἡμᾶς
  choice: qui fra noi
  rationale: Esprime in italiano naturale la presenza e l'appartenenza alla comunità locale; «qui» rende esplicita senza forzarla la componente contestuale della presenza.
- source_word: πόθεν
  choice: Da dove
  rationale: Mantiene la domanda relativa all'origine o alla fonte di ciò che Gesù manifesta.
- source_word: οὖν
  choice: dunque
  rationale: Segnala il passaggio inferenziale nel ragionamento degli abitanti del luogo, con registro naturale ma dignitoso.
- source_word: τούτῳ
  choice: gli
  rationale: Il pronome dativo italiano rende naturalmente il riferimento deittico a Gesù; una resa come «a costui» conserverebbe meglio la sfumatura sprezzante, ma risulterebbe più marcata e meno corrente.
- source_word: ταῦτα πάντα
  choice: tutte queste cose
  rationale: Riproduce direttamente il plurale e rinvia in modo ampio alla sapienza e alle opere potenti menzionate nel contesto.
theological_decisions:
- issue: Natura del riferimento alle sorelle di Gesù
  choice: Tradurre ἀδελφαὶ nel suo senso lessicale ordinario con «sorelle».
  alternative: «parenti di sesso femminile» o «cugine»
  rationale: Il contesto familiare favorisce il senso diretto; la traduzione non deve risolvere nel testo principale dibattiti teologici successivi ampliando il significato del termine greco.
translation_notes:
  register: Italiano standard moderno, naturale e dignitoso. La formulazione conserva il carattere retorico delle due domande e rende esplicito in nota, senza adottarlo nel testo, il senso parentale più ampio proposto da alcuni interpreti.
