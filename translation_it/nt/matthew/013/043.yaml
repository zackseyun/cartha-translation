source:
  edition: SBLGNT
  text: Τότε οἱ δίκαιοι ἐκλάμψουσιν ὡς ὁ ἥλιος ἐν τῇ βασιλείᾳ τοῦ πατρὸς αὐτῶν. ὁ ἔχων ⸀ὦτα ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/043.yaml
  text: Then the righteous will shine like the sun in the kingdom of their Father. The one who has ears, let him hear.
translation:
  language: it
  text: Allora i giusti risplenderanno[a] come il sole nel regno del loro Padre. Chi ha orecchi, ascolti.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «splenderanno».
    reason: lexical_alternative
  - marker: b
    text: 'In greco l’esortazione è al singolare e ha valore rappresentativo: «Chi ha orecchi, ascolti».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Allora
  rationale: Segnala con naturalezza la successione temporale ed escatologica rispetto alla spiegazione precedente.
- source_word: οἱ δίκαιοι
  choice: i giusti
  rationale: Rende l’aggettivo sostantivato senza restringerne il senso alla sola rettitudine morale o a una specifica formulazione dottrinale.
- source_word: ἐκλάμψουσιν
  choice: risplenderanno
  rationale: Esprime il brillare intenso e manifesto indicato da ἐκλάμπω, mantenendo naturale il paragone con il sole.
- source_word: ὡς ὁ ἥλιος
  choice: come il sole
  rationale: Rende direttamente e idiomaticamente il paragone introdotto da ὡς.
- source_word: ἐν τῇ βασιλείᾳ
  choice: nel regno
  rationale: Il contesto e la costruzione locativa favoriscono «regno», pur senza escludere la dimensione del regnare.
- source_word: τοῦ πατρὸς αὐτῶν
  choice: del loro Padre
  rationale: Segue il testo greco senza aggiungere «celeste» e usa un ordine naturale nell’italiano contemporaneo.
- source_word: ὁ ἔχων ὦτα
  choice: Chi ha orecchi
  rationale: La relativa indefinita italiana conserva il valore singolare e rappresentativo dell’espressione greca in forma naturale e inclusiva senza alterarne il numero grammaticale.
- source_word: ἀκουέτω
  choice: ascolti
  rationale: Il congiuntivo esortativo italiano rende efficacemente l’imperativo greco di terza persona e comunica l’invito a prestare vera attenzione.
theological_decisions:
- issue: Valore di βασιλεία nel contesto
  choice: regno
  alternative: regalità; dominio
  rationale: La frase descrive l’ambito escatologico nel quale i giusti risplenderanno; «regno» conserva questa dimensione senza negare l’idea dell’esercizio sovrano.
- issue: Forma singolare e rappresentativa dell’esortazione conclusiva
  choice: Chi ha orecchi, ascolti
  alternative: Chi ha orecchi per udire, oda; Quelli che hanno orecchi ascoltino
  rationale: La scelta conserva il singolare rappresentativo del greco, evita di aggiungere parole assenti dal testo e rimane naturale nell’italiano moderno.
translation_notes:
  register: Italiano moderno, chiaro e dignitoso. «Risplenderanno» conserva la forza dell’immagine senza risultare arcaico; «orecchi» è idiomatico quando si allude alla facoltà di udire. La punteggiatura sobria mantiene il tono solenne dell’esortazione.
