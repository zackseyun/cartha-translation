id: MAT.13.55
reference: Matthew 13:55
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: οὐχ οὗτός ἐστιν ὁ τοῦ τέκτονος υἱός; ⸀οὐχ ἡ μήτηρ αὐτοῦ λέγεται Μαριὰμ καὶ οἱ ἀδελφοὶ αὐτοῦ Ἰάκωβος καὶ ⸀Ἰωσὴφ καὶ Σίμων καὶ Ἰούδας;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/055.yaml
  text: Is this not the carpenter’s son? Is not his mother called Mary[b][a], and his brothers James and Joseph and Simon and Judas?
translation:
  language: it
  text: Non è costui il figlio del falegname? Sua madre non si chiama Maria? E i suoi fratelli[a] non sono Giacomo, Giuseppe[b], Simone e Giuda?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oppure «parenti» o «congiunti»; il termine greco significa ordinariamente «fratelli», ma alcuni lo intendono qui in senso familiare più ampio.
    reason: lexical_alternative
  - marker: b
    text: Alcuni manoscritti hanno «Ioses» invece di «Giuseppe».
    reason: textual_variant
lexical_decisions:
- source_word: τέκτονος
  choice: falegname
  rationale: τέκτων indica un artigiano che lavora il legno o nell'edilizia; «falegname» è la resa italiana tradizionale e naturale in questo contesto, pur non esaurendo l'intera gamma semantica.
- source_word: υἱός
  choice: figlio
  rationale: Il contesto familiare richiede il senso filiale diretto.
- source_word: λέγεται
  choice: si chiama
  rationale: Il passivo greco ha qui il valore idiomatico di «essere chiamato»; in italiano «si chiama» è naturale e mantiene il senso.
- source_word: Μαριὰμ
  choice: Maria
  rationale: È la forma italiana standard del nome.
- source_word: ἀδελφοὶ
  choice: fratelli
  rationale: È il senso ordinario del termine greco. La resa non risolve la discussione sull'esatto rapporto familiare; l'eventuale senso più ampio è segnalato in nota.
- source_word: Ἰάκωβος
  choice: Giacomo
  rationale: È la forma italiana neotestamentaria convenzionale del nome Ἰάκωβος.
- source_word: Ἰωσὴφ
  choice: Giuseppe
  rationale: Rende la lezione del SBLGNT; la variante testuale «Ioses» è conservata in nota.
- source_word: Σίμων
  choice: Simone
  rationale: È la forma italiana standard del nome.
- source_word: Ἰούδας
  choice: Giuda
  rationale: È la forma italiana standard del nome greco in questo contesto.
- source_word: οὐχ ... ;
  choice: Non è ...? ... non si chiama ...? ... non sono ...?
  rationale: Le domande retoriche attendono risposta affermativa. La formulazione italiana conserva il loro carattere e distribuisce naturalmente la seconda domanda greca.
theological_decisions:
- issue: Significato di ἀδελφοὶ αὐτοῦ in rapporto alla famiglia di Gesù
  choice: «i suoi fratelli» nel testo principale
  alternative: «i suoi parenti» o «i suoi congiunti» in senso familiare più ampio
  rationale: Il significato ordinario del greco è «fratelli». La traduzione conserva il dato lessicale senza decidere la discussione dottrinale sul loro preciso rapporto biologico con Gesù; la possibilità più ampia è indicata in nota.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. La ripetizione delle domande negative conserva il tono retorico dell'originale; la seconda domanda greca è articolata in italiano per evitare una coordinazione rigida e poco naturale. I marcatori seguono immediatamente i termini interessati.
