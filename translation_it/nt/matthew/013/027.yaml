id: MAT.13.27
reference: Matthew 13:27
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: προσελθόντες δὲ οἱ δοῦλοι τοῦ οἰκοδεσπότου εἶπον αὐτῷ· Κύριε, οὐχὶ καλὸν σπέρμα ⸀ἔσπειρας ἐν τῷ σῷ ἀγρῷ; πόθεν οὖν ἔχει ζιζάνια;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/027.yaml
  text: So the slaves of the master of the house came to him and said[a], ‘Lord, did you not sow good seed in your field? Where then do the weeds come from?’
translation:
  language: it
  text: 'Allora gli schiavi del padrone di casa gli si avvicinarono e gli dissero: «Signore, non hai seminato del buon seme nel tuo campo? Da dove viene dunque la zizzania[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «le erbacce»; il termine greco indica probabilmente il loglio, una pianta infestante che nelle prime fasi della crescita assomiglia al grano.
    reason: Precisa il probabile referente botanico di ζιζάνια e conserva un’alternativa lessicale più generica.
lexical_decisions:
- source_word: προσελθόντες
  choice: gli si avvicinarono
  rationale: Il participio aoristo esprime un’azione precedente e collegata al verbo principale; la resa italiana comunica con naturalezza il movimento verso il padrone.
- source_word: δοῦλοι
  choice: schiavi
  rationale: Conserva esplicitamente la condizione sociale indicata da δοῦλοι e il rapporto di subordinazione al padrone di casa, senza attenuarlo in «servi».
- source_word: οἰκοδεσπότου
  choice: padrone di casa
  rationale: Rende sia l’autorità domestica sia il rapporto con gli schiavi; è più trasparente in italiano moderno di termini come «capofamiglia» in questo contesto agricolo.
- source_word: Κύριε
  choice: Signore
  rationale: È la resa italiana consueta del vocativo κύριε e qui funziona come appellativo rispettoso rivolto al padrone.
- source_word: οὐχὶ καλὸν σπέρμα ἔσπειρας
  choice: non hai seminato del buon seme
  rationale: Mantiene la domanda che presuppone una risposta affermativa e conserva il lessico agricolo specifico di σπείρω.
- source_word: ἐν τῷ σῷ ἀγρῷ
  choice: nel tuo campo
  rationale: Esprime in modo diretto e naturale la localizzazione e il possesso indicati dal greco.
- source_word: πόθεν οὖν ἔχει ζιζάνια
  choice: Da dove viene dunque la zizzania
  rationale: Rende πόθεν come domanda sull’origine e οὖν con «dunque». Il singolare collettivo italiano «la zizzania» è idiomatico, mentre una riproduzione letterale di ἔχει risulterebbe innaturale.
theological_decisions:
- issue: Resa di δοῦλοι nel contesto domestico della parabola
  choice: schiavi
  alternative: servi
  rationale: Il testo descrive una precisa relazione sociale di appartenenza e subordinazione. «Schiavi» preserva tale dato senza trasformarlo in un’affermazione dottrinale né attenuarne la forza storica.
- issue: Resa dell’appellativo κύριε
  choice: Signore
  alternative: padrone
  rationale: «Signore» mantiene la resa ordinaria di κύριος e il rispettoso appellativo del dialogo. In questo punto non impone di per sé un significato cristologico, poiché il referente immediato è il padrone della parabola.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. «Gli si avvicinarono e gli dissero» riproduce con fluidità la sequenza greca; «zizzania» conserva il termine tradizionale ancora comprensibile, chiarito dalla nota.
