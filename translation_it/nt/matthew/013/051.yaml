  yaml_path: translation/nt/matthew/013/051.yaml
  text: Have you understood all these things? They said to him[a], “Yes.”
translation:
  language: it
  text: '«Avete compreso tutte queste cose?» Gli dissero: «Sì».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Συνήκατε
  choice: Avete compreso
  rationale: L’aoristo indicativo, in forma interrogativa, guarda alla comprensione raggiunta fino a questo punto. «Avete compreso» ne conserva bene la forza aspettuale ed è naturale in italiano.
- source_word: ταῦτα πάντα
  choice: tutte queste cose
  rationale: Rende esplicitamente il dimostrativo neutro plurale con πᾶς e rimanda agli insegnamenti e alle parabole precedenti.
- source_word: λέγουσιν αὐτῷ
  choice: Gli dissero
  rationale: Il presente storico greco è reso con il passato remoto, naturale nella narrazione italiana; «gli» conserva il complemento αὐτῷ.
- source_word: Ναί
  choice: Sì
  rationale: Il testo greco contiene soltanto la particella affermativa, senza alcun titolo aggiunto.
theological_decisions:
- issue: Se ampliare la risposta dei discepoli con un titolo reverenziale
  choice: Mantenere la semplice risposta «Sì».
  alternative: «Sì, Signore».
  rationale: SBLGNT presenta soltanto ναί. Aggiungere «Signore» introdurrebbe un elemento devozionale non attestato nel testo di partenza.
translation_notes:
  register: Italiano moderno, chiaro e dignitoso. Il passato remoto «dissero» si adatta al registro narrativo biblico senza risultare arcaico; la formulazione conserva la concisione dell’originale.
