base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/007.yaml
  text: Other seeds fell among the thorns[a], and the thorns came up and choked them.
translation:
  language: it
  text: Altri semi caddero fra le spine[a], e le spine crebbero e li soffocarono.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il greco dice letteralmente «sulle spine»; qui «fra le spine» esprime in modo naturale il senso nel contesto agricolo.
    reason: alternativa lessicale
lexical_decisions:
- source_word: ἄλλα
  choice: Altri semi
  rationale: L’aggettivo neutro plurale è usato sostantivamente e, nel contesto della parabola, rimanda implicitamente ai semi; esplicitare «semi» rende chiaro il referente in italiano senza aggiungere un elemento estraneo.
- source_word: δὲ
  choice: e
  rationale: Qui δέ è un connettivo lieve che fa avanzare il racconto, non un’avversativa forte.
- source_word: ἔπεσεν
  choice: caddero
  rationale: Il verbo πίπτω significa direttamente «cadere»; il plurale italiano concorda con «altri semi», mentre il greco può usare il singolare con un soggetto neutro plurale.
- source_word: ἐπὶ τὰς ἀκάνθας
  choice: fra le spine
  rationale: Benché ἐπί con l’accusativo significhi letteralmente «sopra/sulle», nel contesto agricolo «fra le spine» esprime naturalmente che i semi caddero nel terreno occupato da piante spinose.
- source_word: ἀκάνθας / ἄκανθαι
  choice: spine
  rationale: «Spine» è una resa corrente e tradizionalmente riconoscibile, capace di indicare per metonimia anche le piante spinose.
- source_word: ἀνέβησαν
  choice: crebbero
  rationale: Il verbo descrive il movimento verso l’alto delle piante; «crebbero» è naturale in italiano nel contesto vegetale e conserva l’idea del loro sviluppo.
- source_word: ἔπνιξαν
  choice: soffocarono
  rationale: πνίγω significa «soffocare» o «strangolare»; «soffocarono» mantiene la vivida metafora agricola.
- source_word: αὐτά
  choice: li
  rationale: Il pronome neutro plurale rimanda agli altri semi; in italiano «li» riprende naturalmente il maschile plurale «semi».
