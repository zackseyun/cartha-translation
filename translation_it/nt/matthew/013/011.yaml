id: MAT.13.11
reference: Matthew 13:11
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν ⸀αὐτοῖς· Ὅτι ὑμῖν δέδοται γνῶναι τὰ μυστήρια τῆς βασιλείας τῶν οὐρανῶν, ἐκείνοις δὲ οὐ δέδοται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/011.yaml
  text: He answered them[a], “To you it has been given to know the mysteries of the kingdom of heaven[b], but to them it has not been given.”
translation:
  language: it
  text: 'Egli rispose loro: «Che a voi è stato dato[b] di conoscere i misteri[a] del regno dei cieli, ma a loro non è stato dato».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «i segreti».
    reason: lexical_alternative
  - marker: b
    text: Il passivo «è stato dato» lascia implicito chi dona; nel contesto è comunemente inteso Dio.
    reason: theological_clarification
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: rispose
  rationale: La combinazione participio + verbo finito è un comune modo greco, influenzato dall’uso semitico, per esprimere semplicemente la risposta; «rispose» evita una ridondanza innaturale.
- source_word: αὐτοῖς
  choice: loro
  rationale: Il dativo indica i destinatari della risposta ed è reso naturalmente con «rispose loro».
- source_word: Ὅτι
  choice: Perché
  rationale: Nel contesto introduce la ragione data da Gesù in risposta alla domanda dei discepoli; «Perché» conserva il nesso esplicativo.
- source_word: ὑμῖν
  choice: a voi
  rationale: Il dativo indica coloro ai quali è stato concesso di conoscere e pone in risalto il contrasto con «a loro».
- source_word: δέδοται
  choice: è stato dato
  rationale: Il perfetto passivo esprime una concessione compiuta i cui effetti permangono; la forma passiva lascia implicito chi dona.
- source_word: γνῶναι
  choice: conoscere
  rationale: Rende direttamente il significato fondamentale dell’infinito di γινώσκω senza sostituirlo con il più interpretativo «comprendere».
- source_word: τὰ μυστήρια
  choice: i misteri
  rationale: Il termine indica realtà divine prima nascoste e ora rivelate; «misteri» conserva questa sfumatura biblica meglio di una parafrasi esplicativa.
- source_word: τῆς βασιλείας τῶν οὐρανῶν
  choice: del regno dei cieli
  rationale: È una resa italiana consolidata dell’espressione matteana e conserva il plurale οὐρανῶν in forma naturale.
- source_word: ἐκείνοις
  choice: a loro
  rationale: Nel contesto il pronome contrappone il gruppo esterno ai discepoli; «a loro» è naturale in italiano e il contrasto è già chiaro grazie a «a voi».
- source_word: οὐ δέδοται
  choice: non è stato dato
  rationale: Riproduce simmetricamente il perfetto passivo negato della seconda proposizione.
theological_decisions:
- issue: Agente divino implicito nel passivo «è stato dato»
  choice: Mantenere il passivo senza nominare esplicitamente Dio
  alternative: «Dio vi ha dato» oppure «vi è stato concesso da Dio»
  rationale: Il greco lascia inespresso l’agente. Benché il riferimento a Dio sia verosimile, esplicitarlo risolverebbe ciò che il testo mantiene implicito.
- issue: Significato di μυστήρια nel contesto del regno
  choice: «misteri»
  alternative: «segreti» oppure «verità nascoste»
  rationale: «Misteri» conserva la categoria biblica delle realtà divine nascoste e poi rivelate, senza ridurla a un semplice segreto o imporre una spiegazione teologica ulteriore.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. La struttura «a voi… ma a loro» conserva l’enfasi e il contrasto del greco. I marcatori delle note sono collocati presso i termini che illustrano.
