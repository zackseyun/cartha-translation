id: MAT.13.16
reference: Matthew 13:16
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ὑμῶν δὲ μακάριοι οἱ ὀφθαλμοὶ ὅτι βλέπουσιν, καὶ τὰ ὦτα ὑμῶν ὅτι ⸀ἀκούουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/016.yaml
  text: But blessed are your eyes[a], because they see, and your ears, because they hear.
translation:
  language: it
  text: Ma beati i vostri occhi, perché vedono, e i vostri orecchi, perché odono.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «beati i vostri occhi, che vedono, e i vostri orecchi, che odono». La congiunzione greca può essere intesa in entrambi i modi.'
    reason: Alternativa lessicale e sintattica per ὅτι.
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: Esprime il contrasto con coloro che, nei versetti precedenti, vedono e odono senza comprendere.
- source_word: μακάριοι
  choice: beati
  rationale: È la resa italiana tradizionale e tuttora naturale nelle dichiarazioni di beatitudine; comunica una condizione di favore, non una semplice emozione di felicità.
- source_word: οἱ ὀφθαλμοὶ ὑμῶν
  choice: i vostri occhi
  rationale: Riproduce naturalmente in italiano il sintagma possessivo e mantiene l'enfasi sugli occhi dei discepoli.
- source_word: ὅτι βλέπουσιν
  choice: perché vedono
  rationale: Interpreta ὅτι in senso causale, indicando il motivo per cui gli occhi sono detti beati, senza escludere del tutto la possibile sfumatura dichiarativa.
- source_word: τὰ ὦτα ὑμῶν
  choice: i vostri orecchi
  rationale: Resa naturale e dignitosa, parallela a «i vostri occhi».
- source_word: ὅτι ἀκούουσιν
  choice: perché odono
  rationale: Mantiene il valore causale di ὅτι e il parallelismo della frase.
- source_word: βλέπουσιν / ἀκούουσιν
  choice: vedono / odono
  rationale: Conserva il linguaggio sensoriale semplice del greco, lasciando che sia il contesto a suggerirne la portata spirituale.
theological_decisions:
- issue: Se rendere esplicito che il vedere e l'udire sono spirituali
  choice: Mantenere i verbi sensoriali «vedono» e «odono» senza aggiungere «comprendono».
  alternative: «percepiscono» / «comprendono»
  rationale: Il contesto associa il vedere e l'udire alla comprensione, ma il versetto conserva intenzionalmente il linguaggio letterale. Esplicitarlo eliminerebbe una tensione presente nel testo.
- issue: Valore di ὅτι nelle due proposizioni parallele
  choice: 'Resa causale: «perché».'
  alternative: 'Resa dichiarativa: «che vedono ... che odono».'
  rationale: 'Il valore causale è il più naturale nel contesto: gli occhi e gli orecchi sono beati in quanto vedono e odono. Poiché la congiunzione greca consente anche l''altra lettura, questa è segnalata in nota.'
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. «Beati» conserva il registro biblico senza risultare antiquato; «odono» mantiene il parallelismo solenne e distingue l'atto dell'udire da quello intenzionale dell'ascoltare.
