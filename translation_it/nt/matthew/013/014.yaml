id: MAT.13.14
reference: Matthew 13:14
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: καὶ ἀναπληροῦται αὐτοῖς ἡ προφητεία Ἠσαΐου ἡ λέγουσα· Ἀκοῇ ἀκούσετε καὶ οὐ μὴ συνῆτε, καὶ βλέποντες βλέψετε καὶ οὐ μὴ ἴδητε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/014.yaml
  text: 'And in them the prophecy of Isaiah is fulfilled[a], which says: ‘You will indeed hear, but never understand, and seeing you will see, but never perceive.’'
translation:
  language: it
  text: 'E si compie in loro la profezia di Isaia, che dice: «Udrete, sì, ma non comprenderete affatto; guarderete, sì, ma non vedrete affatto.[a]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alla lettera: «Con l''udito udrete… e, guardando, guarderete»: espressioni enfatiche di stile ebraico trasmesse nel testo greco.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναπληροῦται
  choice: si compie
  rationale: Il presente passivo è reso con il naturale presente italiano; «si compie» conserva il linguaggio dell'adempimento senza accentuare indebitamente né la progressività né l'idea di completo esaurimento della profezia.
- source_word: αὐτοῖς
  choice: in loro
  rationale: Il dativo indica che la profezia trova compimento nel caso delle persone appena menzionate; «in loro» riproduce bene questa relazione.
- source_word: προφητεία Ἠσαΐου
  choice: la profezia di Isaia
  rationale: Resa diretta e idiomatica del genitivo greco.
- source_word: ἡ λέγουσα
  choice: che dice
  rationale: Rende naturalmente il participio attributivo che introduce la citazione.
- source_word: Ἀκοῇ ἀκούσετε
  choice: Udrete, sì
  rationale: La duplicazione di nome e verbo, di matrice semitica, esprime enfasi. La particella «sì» la comunica in italiano corrente senza produrre un calco innaturale.
- source_word: οὐ μὴ συνῆτε
  choice: ma non comprenderete affatto
  rationale: «Non… affatto» conserva la forte negazione οὐ μή; «ma» rende esplicito il contrasto implicito, mentre «comprendere» corrisponde al valore intellettivo di συνίημι.
- source_word: βλέποντες βλέψετε
  choice: guarderete, sì
  rationale: Conserva il parallelismo enfatico con la prima clausola e rende βλέπω come atto del guardare.
- source_word: οὐ μὴ ἴδητε
  choice: ma non vedrete affatto
  rationale: Mantiene il verbo ordinario «vedere», lasciando emergere dal contrasto con «guardare» la differenza tra osservazione e autentica percezione; «affatto» rende l'enfasi di οὐ μή.
theological_decisions:
- issue: Natura del compimento profetico
  choice: La profezia «si compie in loro».
  alternative: La profezia è soltanto esemplificata da loro, oppure si completa definitivamente ed esaustivamente in loro.
  rationale: La formulazione conserva l'affermazione di compimento del testo greco senza introdurre una spiegazione deterministica dell'indurimento né ridurla a una semplice analogia.
- issue: Rapporto tra percezione sensoriale e comprensione spirituale
  choice: «guarderete… ma non vedrete»
  alternative: «vedrete… ma non percepirete»
  rationale: La resa mantiene due verbi distinti e la tensione del testo, senza aggiungere esplicitamente «spiritualmente» o un'altra interpretazione teologica.
translation_notes:
  register: Italiano moderno, dignitoso e leggibile. Il parallelismo della citazione è mantenuto mediante «sì… ma non… affatto», mentre la nota documenta la forma più letterale dell'enfasi semitica.
