id: MAT.13.39
reference: Matthew 13:39
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ὁ δὲ ἐχθρὸς ὁ σπείρας αὐτά ἐστιν ὁ διάβολος· ὁ δὲ θερισμὸς συντέλεια ⸀αἰῶνός ἐστιν, οἱ δὲ θερισταὶ ἄγγελοί εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/039.yaml
  text: And the enemy who sowed them is the devil; the harvest is the end of the age[a], and the harvesters are angels.
translation:
  language: it
  text: Il nemico che le ha seminate è il diavolo; la mietitura è la fine dell’età[a], e i mietitori sono gli angeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oppure «il compimento dell’età»; tradizionalmente, «la fine del mondo».
    reason: 'Alternativa lessicale: συντέλεια può indicare il compimento o la conclusione, mentre αἰών designa qui un’età più che il mondo materiale.'
lexical_decisions:
- source_word: ἐχθρὸς
  choice: nemico
  rationale: È l’equivalente italiano normale e conserva il carattere personale dell’opposizione nella spiegazione della parabola.
- source_word: ὁ σπείρας
  choice: che le ha seminate
  rationale: Il participio aoristo identifica il nemico mediante l’azione compiuta; «seminate» mantiene l’immagine agricola.
- source_word: αὐτά
  choice: le
  rationale: Il pronome rinvia alle erbacce della parabola; il femminile italiano concorda con il referente sottinteso.
- source_word: διάβολος
  choice: il diavolo
  rationale: Qui il termine è una designazione personale riconoscibile; una resa etimologica come «calunniatore» oscurerebbe il referente.
- source_word: θερισμός
  choice: mietitura
  rationale: Termine naturale e preciso per la raccolta dei cereali, coerente con l’immagine della parabola.
- source_word: συντέλεια αἰῶνος
  choice: la fine dell’epoca presente
  rationale: «Epoca» conserva il senso temporale di αἰών ed evita il possibile senso cosmico-materiale di «mondo»; «presente» rende esplicito in italiano il periodo sottinteso senza identificare la frase con la distruzione del creato.
- source_word: θερισταί
  choice: mietitori
  rationale: Mantiene il legame lessicale e figurativo con «mietitura» ed è comprensibile nell’italiano corrente.
- source_word: ἄγγελοι
  choice: angeli
  rationale: Il contesto escatologico indica esseri celesti, non semplicemente messaggeri umani.
- source_word: δέ
  choice: coordinazione e punteggiatura
  rationale: Le ripetizioni di δέ fanno avanzare la spiegazione; in italiano la loro funzione è resa naturalmente mediante la struttura coordinata e la punteggiatura.
theological_decisions:
- issue: Resa di αἰών nella formula escatologica συντέλεια αἰῶνος
  choice: la fine dell’epoca presente
  alternative: la fine del mondo; il compimento dell’epoca
  rationale: La scelta preserva il riferimento temporale di αἰών e non introduce l’idea più specifica della distruzione materiale del cosmo. La nota conserva sia la sfumatura di compimento insita in συντέλεια sia la formulazione tradizionale.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. La ripetizione agricola «mietitura/mietitori» conserva la coesione dell’immagine greca. Il punto e virgola distingue le tre identificazioni parallele senza appesantire la frase.
