  naturalness: La resa è nel complesso chiara e di registro adeguato. «Dalla fondazione» è più lineare di «fin dalla fondazione» e conserva l'ellissi dell'oggetto presente nel testo adottato. «Proferirò» mantiene meglio il tono poetico e l'energia di ἐρεύξομαι rispetto al generico «dirò», pur restando italiano comprensibile.
  terminology: «Si adempisse», «per mezzo del profeta», «parabole» e «cose nascoste» sono appropriati. La nota testuale è correttamente ancorata e segnala senza imporre la lezione più ampia.
