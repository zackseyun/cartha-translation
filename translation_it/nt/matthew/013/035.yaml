  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ὅπως πληρωθῇ τὸ ῥηθὲν διὰ τοῦ προφήτου λέγοντος· Ἀνοίξω ἐν παραβολαῖς τὸ στόμα μου, ἐρεύξομαι κεκρυμμένα ἀπὸ ⸀καταβολῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/035.yaml
  text: 'so that what was spoken through the prophet might be fulfilled[a], saying: “I will open my mouth in parables; I will utter things hidden from the foundation of the world.”'
translation:
  language: it
  text: 'affinché si adempisse ciò che era stato detto per mezzo del profeta, che dice: «Aprirò la mia bocca in parabole; proferirò cose nascoste dalla fondazione[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alcuni manoscritti aggiungono «del mondo».
    reason: textual_variant
lexical_decisions:
- source_word: ὅπως πληρωθῇ
  choice: affinché si adempisse
  rationale: Rende in italiano naturale la costruzione finale/consecutiva con il congiuntivo aoristo passivo e conserva la formula matteana dell'adempimento.
- source_word: τὸ ῥηθὲν
  choice: ciò che era stato detto
  rationale: Resa idiomatica del participio sostantivato; il trapassato chiarisce che la parola profetica precede il suo adempimento senza aggiungere contenuto.
- source_word: διὰ τοῦ προφήτου
  choice: per mezzo del profeta
  rationale: Conserva il valore di mediazione o agenzia di διά con il genitivo.
- source_word: λέγοντος
  choice: quando disse
  rationale: Introduce con naturalezza italiana la citazione, mantenendo esplicito il valore del participio.
- source_word: Ἀνοίξω ἐν παραβολαῖς τὸ στόμα μου
  choice: Aprirò la mia bocca in parabole
  rationale: Mantiene sia l'immagine poetica sia il termine matteano «parabole», con una struttura comprensibile in italiano.
- source_word: ἐρεύξομαι
  choice: dirò
  rationale: Il verbo indica il far uscire o proferire parole; «dirò» comunica il senso chiaramente senza introdurre l'idea più specifica di proclamazione né una metafora innaturale.
- source_word: κεκρυμμένα
  choice: cose nascoste
  rationale: Rende il participio perfetto passivo usato come sostantivo e ne conserva il senso risultativo senza interpretarlo come «segreti».
- source_word: ἀπὸ καταβολῆς
  choice: fin dalla fondazione
  rationale: Segue il testo SBLGNT, che in questo punto non esprime l'oggetto «del mondo»; «fin dalla» comunica l'estensione temporale dell'espressione.
theological_decisions:
- issue: Identificazione del profeta
  choice: per mezzo del profeta
  alternative: per mezzo di Asaf, il profeta
  rationale: Il testo greco fornito dice soltanto «il profeta». La traduzione non aggiunge un'identificazione assente né armonizza la formula di citazione.
- issue: Estensione dell'espressione ἀπὸ καταβολῆς
  choice: fin dalla fondazione
  alternative: fin dalla fondazione del mondo
  rationale: Il testo principale del SBLGNT qui non contiene κόσμου («del mondo»). La formulazione più estesa, presente nella tradizione manoscritta, è segnalata in nota senza inserirla tacitamente nel testo.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. La formulazione della citazione conserva il parallelismo poetico; «fondazione» resta volutamente non specificato nel testo principale per rispecchiare la forma greca adottata.
