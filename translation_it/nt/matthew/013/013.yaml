id: MAT.13.13
reference: Matthew 13:13
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἐν παραβολαῖς αὐτοῖς λαλῶ, ὅτι βλέποντες οὐ βλέπουσιν καὶ ἀκούοντες οὐκ ἀκούουσιν οὐδὲ συνίουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/013.yaml
  text: For this reason I speak to them in parables[a], because seeing they do not see, and hearing they do not hear, nor do they understand.
translation:
  language: it
  text: Per questo parlo loro in parabole, perché vedendo non vedono e udendo non odono né comprendono.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Per questo
  rationale: Conserva il valore causale dell’espressione greca e introduce in modo naturale la spiegazione data da Gesù.
- source_word: ἐν παραβολαῖς
  choice: in parabole
  rationale: Resa diretta e idiomatica del modo in cui Gesù parla.
- source_word: αὐτοῖς λαλῶ
  choice: parlo loro
  rationale: Rende con naturalezza il presente λαλῶ e il dativo αὐτοῖς, mantenendo un registro dignitoso e corrente.
- source_word: ὅτι
  choice: perché
  rationale: In questo contesto introduce la ragione per cui Gesù parla loro in parabole.
- source_word: βλέποντες οὐ βλέπουσιν
  choice: pur vedendo, non vedono
  rationale: Il gerundio preceduto da «pur» esprime naturalmente in italiano il contrasto paradossale tra il vedere e il non vedere, senza specificare oltre la natura della mancata percezione.
- source_word: ἀκούοντες οὐκ ἀκούουσιν
  choice: pur udendo, non odono
  rationale: Mantiene il parallelismo del greco e distingue la semplice ricezione uditiva dal mancato ascolto effettivo, senza parafrasare.
- source_word: οὐδὲ συνίουσιν
  choice: né comprendono
  rationale: Prosegue la serie negativa e rende συνίημι con il comune «comprendere», adatto all’idea di afferrare il significato.
theological_decisions:
- issue: Valore dei participi βλέποντες e ἀκούοντες
  choice: Resi concessivamente con «pur vedendo» e «pur udendo»
  alternative: «vedendo, non vedono» e «udendo, non odono»
  rationale: Il greco consente una resa formalmente non marcata, ma nel contesto il rapporto paradossale è naturalmente concessivo. «Pur» lo comunica senza trasformarlo in una spiegazione dottrinale della cecità o sordità descritte.
- issue: Significato di συνίουσιν
  choice: «comprendono»
  alternative: «capiscono» o «intendono»
  rationale: «Comprendono» conserva il riferimento all’afferrare il significato e mantiene un registro dignitoso, senza precisare se l’incapacità sia intellettuale, spirituale o morale.
translation_notes:
  register: Italiano standard moderno, chiaro e dignitoso. Il parallelismo retorico è conservato; «udire/non odono» mantiene più da vicino la ripetizione lessicale del greco rispetto a una parafrasi con «ascoltare».
