base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/046.yaml
  text: and having found one pearl of great value[a], he went away, sold all that he had, and bought it.
translation:
  language: it
  text: e, dopo aver trovato una perla di grande valore[a], se ne andò, vendette tutto ciò che aveva e la comprò.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «una perla preziosa».
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρὼν δὲ
  choice: e, trovata
  rationale: Il participio aoristo esprime un'azione anteriore rispetto ai verbi principali; δέ ha qui valore connettivo leggero. La costruzione italiana conserva il legame con il contesto e rende naturale la sequenza.
- source_word: ἕνα
  choice: una
  rationale: Il numerale greco è esplicito. In italiano «una perla» può esprimere sia il numerale sia l'articolo indeterminativo; il contesto mette comunque in rilievo l'unico oggetto di valore eccezionale.
- source_word: πολύτιμον
  choice: di grande valore
  rationale: Rende con chiarezza il valore eccezionale della perla in italiano moderno; «preziosa» resta una valida alternativa lessicale.
- source_word: μαργαρίτην
  choice: perla
  rationale: È l'equivalente italiano diretto e normale nel contesto.
- source_word: ἀπελθὼν
  choice: se ne andò
  rationale: Il participio è reso con un verbo finito per una narrazione italiana scorrevole, conservando la successione delle azioni.
- source_word: πέπρακεν
  choice: vendette
  rationale: Il perfetto greco presenta la vendita come compiuta; il passato remoto è idiomatico nella narrazione italiana e mantiene tale compiutezza.
- source_word: πάντα ὅσα εἶχεν
  choice: tutto ciò che aveva
  rationale: Conserva la totalità espressa da πάντα e la relativa ὅσα εἶχεν in una forma naturale e dignitosa.
- source_word: ἠγόρασεν
  choice: comprò
  rationale: È l'equivalente italiano semplice e naturale, adatto al registro narrativo.
- source_word: αὐτόν
  choice: la
  rationale: Il pronome riprende μαργαρίτην; in italiano concorda correttamente con il femminile «perla».
