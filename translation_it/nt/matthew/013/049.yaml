id: MAT.13.49
reference: Matthew 13:49
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: οὕτως ἔσται ἐν τῇ συντελείᾳ τοῦ αἰῶνος· ἐξελεύσονται οἱ ἄγγελοι καὶ ἀφοριοῦσιν τοὺς πονηροὺς ἐκ μέσου τῶν δικαίων
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/049.yaml
  text: 'So it will be at the end of the age: the angels will go out and separate the wicked from among the righteous,[a]'
translation:
  language: it
  text: 'Così avverrà alla fine dell’epoca: gli angeli usciranno e separeranno i malvagi dai giusti.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O «al compimento dell’epoca». La traduzione tradizionale «alla fine del mondo» può risultare fuorviante: il greco ha «epoca» (αἰών), non «mondo».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως ἔσται
  choice: Così avverrà
  rationale: Rende in modo naturale sia il valore esplicativo di οὕτως sia il futuro ἔσται, collegando il versetto all’immagine precedente.
- source_word: ἐν τῇ συντελείᾳ τοῦ αἰῶνος
  choice: alla fine dell’epoca
  rationale: «Fine» comunica chiaramente il compimento indicato da συντέλεια; «epoca» rende αἰών senza confonderlo con il mondo fisico.
- source_word: ἐξελεύσονται οἱ ἄγγελοι
  choice: gli angeli usciranno
  rationale: Traduzione diretta e corrente; nel contesto del giudizio finale ἄγγελοι indica esseri angelici.
- source_word: ἀφοριοῦσιν
  choice: separeranno
  rationale: Esprime l’atto di distinguere e togliere un gruppo da un altro senza aggiungere sfumature estranee.
- source_word: τοὺς πονηροὺς
  choice: i malvagi
  rationale: Il plurale sostantivato indica persone moralmente malvagie; «i malvagi» è dignitoso e comprensibile.
- source_word: ἐκ μέσου τῶν δικαίων
  choice: dai giusti
  rationale: In italiano la forma concisa esprime naturalmente la separazione dei malvagi dal gruppo in mezzo al quale si trovano.
theological_decisions:
- issue: Significato escatologico di αἰών
  choice: epoca
  alternative: mondo
  rationale: Il greco parla del compimento di un αἰών, cioè di un’epoca o ordine temporale, e non designa direttamente il cosmo fisico.
- issue: Identità degli ἄγγελοι
  choice: angeli
  alternative: messaggeri
  rationale: Nel quadro escatologico della spiegazione della parabola, il referente contestuale è costituito dagli angeli celesti.
translation_notes:
  register: Italiano standard moderno, chiaro e dignitoso. «Così avverrà» è idiomatico senza essere colloquiale; «epoca» conserva la distinzione lessicale rispetto a «mondo».
