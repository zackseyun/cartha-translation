  source_fidelity: 'Il testo rende accuratamente la struttura e i termini principali del greco: «Così avverrà» corrisponde a οὕτως ἔσται; «alla fine dell’epoca» conserva αἰών come realtà temporale, non come κόσμος; «gli angeli usciranno» riproduce ἐξελεύσονται; e «separeranno i malvagi dai giusti» rende in italiano corrente l’azione di ἀφορίζειν e la separazione espressa da ἐκ μέσου τῶν δικαίων. La concisione di «dai giusti» è un’equivalenza idiomatica adeguata per «da in mezzo ai giusti».'
  naturalness: L’italiano è moderno, sobrio e adatto al registro scritturale. «Epoca» è comprensibile e appropriato in questo contesto; «i malvagi» e «i giusti» mantengono un registro dignitoso senza risultare artificiosi.
  terminology: La resa di αἰών con «epoca» è lessicalmente difendibile e la nota chiarisce bene l’alternativa «compimento». «Angeli» è contestualmente corretto. I termini morali «malvagi» e «giusti» corrispondono bene agli aggettivi sostantivati πονηρούς e δικαίων.
