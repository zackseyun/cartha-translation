  text: ἐν δὲ τῷ καθεύδειν τοὺς ἀνθρώπους ἦλθεν αὐτοῦ ὁ ἐχθρὸς καὶ ⸀ἐπέσπειρεν ζιζάνια ἀνὰ μέσον τοῦ σίτου καὶ ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/025.yaml
  text: But while the men were sleeping, his enemy came and sowed weeds among the wheat and went away.
translation:
  language: it
  text: Ma, mentre gli uomini dormivano, venne il suo nemico, seminò della zizzania in mezzo al grano e se ne andò.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοὺς ἀνθρώπους
  choice: gli uomini
  rationale: Nel contesto indica gli uomini incaricati del campo; mantiene il referente umano plurale senza attenuarlo in un generico «la gente».
- source_word: ζιζάνια
  choice: zizzania
  rationale: Il termine indica un'erba infestante simile al grano, tradizionalmente identificata con il loglio; «zizzania» è preciso nel contesto agricolo e naturale nell'uso biblico italiano.
- source_word: ἀνὰ μέσον τοῦ σίτου
  choice: in mezzo al grano
  rationale: Riproduce con naturalezza l'idea che la zizzania venga seminata fra le piante di grano.
- source_word: ἀπῆλθεν
  choice: se ne andò
  rationale: Resa italiana idiomatica del semplice allontanarsi dopo l'azione.
