  text: Ταῦτα πάντα ἐλάλησεν ὁ Ἰησοῦς ἐν παραβολαῖς τοῖς ὄχλοις, καὶ χωρὶς παραβολῆς ⸀οὐδὲν ἐλάλει αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/034.yaml
  text: Jesus spoke all these things to the crowds in parables[a], and apart from a parable he said nothing to them.
translation:
  language: it
  text: Tutte queste cose Gesù le disse alle folle in parabole e, senza una parabola, non diceva loro nulla.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ταῦτα πάντα
  choice: Tutte queste cose
  rationale: Conserva sia la forza dimostrativa sia l'idea di totalità, in un italiano naturale.
- source_word: ἐλάλησεν
  choice: le disse
  rationale: L'aoristo riassume quanto Gesù comunicò; la ripresa pronominale «le» rende idiomatica in italiano la dislocazione dell'oggetto.
- source_word: ἐν παραβολαῖς
  choice: in parabole
  rationale: Rende il valore modale o strumentale di ἐν con il dativo e mantiene il plurale greco.
- source_word: τοῖς ὄχλοις
  choice: alle folle
  rationale: Mantiene il plurale del testo greco con una formulazione italiana corrente.
- source_word: χωρὶς παραβολῆς
  choice: senza una parabola
  rationale: Esprime il senso privativo di χωρίς e conserva il singolare παραβολῆς.
- source_word: οὐδὲν ἐλάλει
  choice: non diceva loro nulla
  rationale: L'imperfetto italiano rispecchia naturalmente il valore durativo o abituale dell'imperfetto greco, senza appesantire la frase.
- source_word: αὐτοῖς
  choice: loro
  rationale: Rimanda direttamente alle folle senza ripetere il sostantivo.
theological_decisions:
- issue: Valore narrativo dell'imperfetto ἐλάλει
  choice: non diceva loro nulla
  alternative: non disse loro nulla
  rationale: L'imperfetto italiano conserva la possibile sfumatura abituale o continuativa del greco, indicando il modo caratteristico in cui Gesù si rivolgeva alle folle in questo contesto, senza trasformarlo in un'affermazione più ampia.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. La costruzione «Tutte queste cose Gesù le disse» è idiomatica e mantiene in rilievo l'oggetto iniziale del greco; «senza una parabola» conserva il singolare e la tensione aspettuale è resa dall'imperfetto «diceva».
