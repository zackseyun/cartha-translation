id: MAT.13.47
reference: Matthew 13:47
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Πάλιν ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν σαγήνῃ βληθείσῃ εἰς τὴν θάλασσαν καὶ ἐκ παντὸς γένους συναγαγούσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/047.yaml
  text: Again[b][a], the kingdom of heaven is like a dragnet cast into the sea and gathering from every kind.
translation:
  language: it
  text: Ancora, il regno dei cieli è simile a una rete a strascico[a] gettata in mare, che raccoglie pesci di ogni specie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «una rete»; il termine greco indica più precisamente una grande rete trascinata nell’acqua.
    reason: lexical_alternative
  - marker: b
    text: 'Alla lettera: «che raccoglie da ogni genere»; i pesci sono sottintesi nell’immagine della pesca.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάλιν
  choice: Ancora
  rationale: Introduce naturalmente un’altra parabola della stessa serie e rende l’avverbio greco in modo conciso.
- source_word: ὁμοία ἐστὶν
  choice: è simile a
  rationale: Conserva la formula comparativa tipica delle parabole del regno in un italiano naturale e dignitoso.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: il regno dei cieli
  rationale: Mantiene l’espressione caratteristica di Matteo senza sostituirla con una parafrasi teologica.
- source_word: σαγήνῃ
  choice: una rete a strascico
  rationale: Il termine indica una grande rete trascinata nell’acqua; questa resa è più precisa del generico «rete».
- source_word: βληθείσῃ εἰς τὴν θάλασσαν
  choice: gettata in mare
  rationale: Rende con naturalezza il participio passivo e conserva il riferimento letterale al mare.
- source_word: ἐκ παντὸς γένους συναγαγούσῃ
  choice: che raccoglie pesci di ogni specie
  rationale: «Pesci» è implicito nell’immagine della pesca e viene esplicitato per ottenere una frase italiana chiara; «di ogni specie» esprime il senso distributivo della locuzione greca.
theological_decisions:
- issue: Significato di «regno dei cieli»
  choice: Conservare la formulazione matteana «regno dei cieli».
  alternative: «regno di Dio» oppure «signoria dei cieli»
  rationale: La formulazione propria di Matteo va preservata; sostituirla scioglierebbe inutilmente una distinzione presente nel testo.
translation_notes:
  register: Italiano moderno standard, chiaro e dignitoso. La sintassi conserva la similitudine e l’immagine concreta della pesca, esplicitando soltanto l’oggetto implicito necessario alla naturalezza italiana.
