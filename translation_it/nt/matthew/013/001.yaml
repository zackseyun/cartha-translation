- from: Quel giorno Gesù uscì di casa e si sedette vicino al mare[a][b].
  to: Quel giorno Gesù uscì dalla casa e si sedette vicino al mare[a][b].
  rationale: La revisione limita l'intervento a «dalla casa», per rendere esplicita la determinazione di τῆς οἰκίας, e affina l'alternativa della seconda nota per non restringere indebitamente il valore di παρά. La struttura, il registro e la resa narrativa del resto del versetto sono mantenuti.
