  text: ⸀Ἐν τῇ ἡμέρᾳ ἐκείνῃ ἐξελθὼν ὁ Ἰησοῦς ⸀τῆς οἰκίας ἐκάθητο παρὰ τὴν θάλασσαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/001.yaml
  text: On that day Jesus went out of the house and sat beside the sea[a][b].
translation:
  language: it
  text: Quel giorno Gesù uscì dalla casa e si sedette vicino al mare[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «Quello stesso giorno», se l’espressione viene intesa come un richiamo alla continuità con quanto precede, anziché come una semplice indicazione temporale.'
    reason: alternative_reading
  - marker: b
    text: 'Oppure: «presso il mare». L’espressione greca indica una posizione presso il mare senza precisare l’esatta distanza dalla riva.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: Quel giorno
  rationale: È la resa temporale più naturale in italiano moderno. Mantiene il riferimento al giorno indicato senza aggiungere esplicitamente l'idea di «stesso», che dipende dal contesto.
- source_word: ἐξελθὼν ... τῆς οἰκίας
  choice: uscì di casa
  rationale: Il participio aoristo, insieme al genitivo del luogo lasciato, è reso con una forma verbale finita e idiomatica; l'azione precede naturalmente il sedersi.
- source_word: ὁ Ἰησοῦς
  choice: Gesù
  rationale: Forma italiana tradizionale e corrente del nome proprio.
- source_word: ἐκάθητο
  choice: si sedette
  rationale: L'imperfetto greco può presentare Gesù seduto nella scena, ma dopo «uscì» l'italiano narrativo richiede naturalmente «si sedette»; la resa non aggiunge un significato teologico.
- source_word: παρὰ τὴν θάλασσαν
  choice: vicino al mare
  rationale: παρά con l'accusativo indica una posizione presso il mare senza precisare l'esatta distanza dalla riva. «Vicino al mare» conserva questa indeterminatezza.
theological_decisions: []
translation_notes:
  register: Italiano standard moderno, narrativo e dignitoso. «Di casa» è più naturale di «dalla casa» senza perdere il riferimento all'abitazione del contesto. I richiami di nota [a] e [b] sono collocati dopo la frase cui si riferiscono.
