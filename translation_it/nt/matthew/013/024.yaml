source:
  edition: SBLGNT
  text: Ἄλλην παραβολὴν παρέθηκεν αὐτοῖς λέγων· Ὡμοιώθη ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ ⸀σπείραντι καλὸν σπέρμα ἐν τῷ ἀγρῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/024.yaml
  text: He set another parable before them[a], saying, “The kingdom of heaven is like a man who sowed good seed in his field.”
translation:
  language: it
  text: 'Propose loro un’altra parabola, dicendo: «Il regno dei cieli è simile[a] a un uomo che seminò del buon seme nel suo campo».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Più letteralmente: «fu reso simile» o «fu paragonato». Qui il verbo greco introduce il paragone della parabola.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄλλην παραβολὴν παρέθηκεν αὐτοῖς
  choice: Propose loro un’altra parabola
  rationale: παρατίθημι significa qui presentare o porre davanti agli ascoltatori. «Propose loro» è una resa italiana naturale e dignitosa che conserva l’idea di sottoporre un insegnamento; ἄλλην introduce un’ulteriore parabola nella sequenza.
- source_word: λέγων
  choice: dicendo
  rationale: Il participio collega direttamente l’introduzione narrativa alle parole citate ed è reso senza trasformarlo in un nuovo verbo principale.
- source_word: Ὡμοιώθη
  choice: è simile
  rationale: Benché la forma greca sia un aoristo passivo, nella formula introduttiva delle parabole esprime idiomaticamente un paragone. «È simile» evita l’innaturale «è diventato simile» e non suggerisce un mutamento temporale del regno.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: il regno dei cieli
  rationale: È la formulazione italiana tradizionale e tuttora naturale dell’espressione caratteristica di Matteo; il plurale «cieli» rispecchia οὐρανῶν.
- source_word: ἀνθρώπῳ σπείραντι
  choice: a un uomo che seminò
  rationale: ἀνθρώπῳ indica il personaggio maschile della parabola; il participio aoristo σπείραντι è reso con una relativa al passato remoto, naturale nella narrazione italiana e indicativa dell’azione compiuta.
- source_word: καλὸν σπέρμα
  choice: del buon seme
  rationale: καλός qualifica la buona qualità del seme e prepara il contrasto con le erbacce nei versetti successivi. L’articolo partitivo rende naturale l’espressione italiana.
- source_word: ἐν τῷ ἀγρῷ αὐτοῦ
  choice: nel suo campo
  rationale: Resa diretta e idiomatica; il possessivo si riferisce naturalmente all’uomo della parabola.
theological_decisions:
- issue: Formula matteana del regno
  choice: il regno dei cieli
  alternative: il regno del cielo
  rationale: Il plurale italiano conserva la forma caratteristica di Matteo senza introdurre una distinzione dottrinale rispetto al regno di Dio.
- issue: Valore di Ὡμοιώθη nell’introduzione della parabola
  choice: è simile
  alternative: fu paragonato / divenne simile
  rationale: Il passivo aoristo introduce il paragone parabolico e non richiede l’idea teologica che il regno abbia subito un cambiamento. La nota segnala la forma più letterale senza imporla al testo principale.
translation_notes:
  register: Italiano standard moderno, chiaro e dignitoso. Il passato remoto «seminò» si accorda al registro narrativo biblico senza risultare arcaico; «propose loro» conserva concisione e naturalezza.
