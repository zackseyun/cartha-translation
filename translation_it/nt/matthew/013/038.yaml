id: MAT.13.38
reference: Matthew 13:38
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ὁ δὲ ἀγρός ἐστιν ὁ κόσμος· τὸ δὲ καλὸν σπέρμα, οὗτοί εἰσιν οἱ υἱοὶ τῆς βασιλείας· τὰ δὲ ζιζάνιά εἰσιν οἱ υἱοὶ τοῦ πονηροῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/038.yaml
  text: The field is the world[a], and the good seed—these are the sons of the kingdom. And the weeds are the sons of the evil one[c][b],
translation:
  language: it
  text: Il campo è il mondo; il buon seme sono i figli del regno, mentre le erbacce[a] sono i figli del Maligno[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Più precisamente, «loglio»; tradizionalmente, «zizzania».
    reason: lexical_alternative
  - marker: b
    text: «Figli» è qui un'espressione relazionale e indica coloro che appartengono rispettivamente al regno o al Maligno.
    reason: cultural_note
lexical_decisions:
- source_word: ἀγρός
  choice: campo
  rationale: È il termine italiano naturale nel contesto agricolo della parabola e ne conserva l'immagine.
- source_word: κόσμος
  choice: mondo
  rationale: Indica in senso ampio il mondo quale ambito in cui avviene la semina; è la resa italiana più diretta e convenzionale.
- source_word: καλὸν σπέρμα
  choice: buon seme
  rationale: Conserva la metafora agricola e il contrasto qualitativo con le erbacce.
- source_word: οὗτοί εἰσιν
  choice: sono
  rationale: In italiano il predicato plurale rende naturalmente il passaggio dal singolare collettivo «seme» alle persone rappresentate.
- source_word: υἱοὶ τῆς βασιλείας
  choice: figli del regno
  rationale: «Figli» conserva l'espressione relazionale del greco e, in italiano, può designare rappresentativamente quanti appartengono al regno.
- source_word: ζιζάνια
  choice: erbacce
  rationale: È una resa moderna e comprensibile; la nota conserva l'identificazione botanica più specifica con il loglio.
- source_word: τοῦ πονηροῦ
  choice: del Maligno
  rationale: L'articolo e il genitivo maschile singolare favoriscono un referente personale; «il Maligno» è idiomatico e non specifica il nome oltre quanto dice il greco.
theological_decisions:
- issue: Se τοῦ πονηροῦ indichi il male impersonale o un agente personale
  choice: del Maligno
  alternative: del male
  rationale: La forma articolata maschile singolare, nell'espressione «figli di», sostiene la lettura personale, pur senza identificare esplicitamente il referente con un nome proprio.
- issue: Valore rappresentativo di υἱοὶ
  choice: figli
  alternative: quelli che appartengono
  rationale: La resa conserva la metafora familiare e relazionale del testo; «figli» in questo costrutto comprende le persone caratterizzate dall'appartenenza indicata.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. Il punto e virgola e «mentre» rendono con chiarezza le tre spiegazioni parallele introdotte da δέ, evitando una sequenza italiana pesante. La virgola finale del testo fornito non è riprodotta perché il versetto è presentato come unità autonoma.
