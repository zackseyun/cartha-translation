id: MAT.13.21
reference: Matthew 13:21
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: οὐκ ἔχει δὲ ῥίζαν ἐν ἑαυτῷ ἀλλὰ πρόσκαιρός ἐστιν, γενομένης δὲ θλίψεως ἢ διωγμοῦ διὰ τὸν λόγον εὐθὺς σκανδαλίζεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/021.yaml
  text: Yet he has no root in himself[a], but is temporary. When affliction or persecution arises because of the word[b], he immediately falls away.
translation:
  language: it
  text: Ma non ha radice in sé, ma dura solo per un tempo; quando sopraggiunge tribolazione o persecuzione a causa della parola, subito viene meno.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «inciampa» o «si scandalizza»; il verbo greco può indicare l’essere indotti a cadere o il trovare motivo di scandalo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίζαν
  choice: radice
  rationale: Conserva la metafora agricola della parabola ed è naturale in italiano.
- source_word: ἐν ἑαυτῷ
  choice: in sé
  rationale: Rende direttamente il valore riflessivo e la dimensione interiore senza aggiungere interpretazioni.
- source_word: πρόσκαιρός
  choice: dura solo per un tempo
  rationale: Esprime con chiarezza che la persona resiste soltanto temporaneamente, evitando l’italiano poco naturale «è temporanea» riferito a una persona.
- source_word: γενομένης ... θλίψεως ἢ διωγμοῦ
  choice: quando poi sopraggiungono tribolazione o persecuzione
  rationale: Rende temporalmente il genitivo assoluto; «sopraggiungono» comunica il verificarsi improvviso delle avversità.
- source_word: θλίψεως
  choice: tribolazione
  rationale: Mantiene il senso grave di pressione e afflizione ed è comprensibile nel registro biblico italiano contemporaneo.
- source_word: διωγμοῦ
  choice: persecuzione
  rationale: È l’equivalente italiano preciso e corrente per l’ostilità subita a causa del messaggio.
- source_word: διὰ τὸν λόγον
  choice: a causa della parola
  rationale: Conserva il legame lessicale con λόγος e rimanda naturalmente al messaggio proclamato nella parabola.
- source_word: εὐθὺς
  choice: subito
  rationale: Riproduce l’enfasi sull’immediatezza con un termine italiano naturale.
- source_word: σκανδαλίζεται
  choice: viene meno
  rationale: Nel contesto indica il cedimento davanti alla pressione senza definire più del necessario la condizione teologica della persona; la nota conserva le sfumature più letterali.
theological_decisions:
- issue: Resa di σκανδαλίζεται nel contesto del discepolato
  choice: viene meno
  alternative: inciampa; si scandalizza; abbandona
  rationale: «Viene meno» comunica il cedimento descritto dal contesto senza imporre una conclusione dottrinale completa sull’apostasia. La nota segnala l’ampiezza semantica del verbo greco.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. La struttura in un unico periodo segue il nesso sintattico del greco senza risultare pesante; «dura solo per un tempo» è preferito a una predicazione aggettivale innaturale riferita alla persona.
