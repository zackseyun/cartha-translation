base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/010.yaml
  text: Then the disciples came up and said to him[a], “Why do you speak to them in parables?”
translation:
  language: it
  text: 'Allora i discepoli gli si avvicinarono e gli dissero: «Perché parli loro in parabole?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Allora
  rationale: Nel contesto καί fa avanzare la narrazione; «Allora» esprime con naturalezza la successione degli eventi senza introdurre un nesso causale.
- source_word: προσελθόντες
  choice: gli si avvicinarono
  rationale: Il participio aoristo di προσέρχομαι indica che i discepoli si avvicinano a Gesù prima di parlargli. La costruzione italiana rende esplicito il referente già espresso subito dopo da αὐτῷ, evitando una formulazione rigida.
- source_word: οἱ μαθηταὶ
  choice: i discepoli
  rationale: L'articolo identifica il gruppo già noto; «suoi» non viene aggiunto perché non è espresso nel greco.
- source_word: εἶπαν αὐτῷ
  choice: gli dissero
  rationale: Mantiene il valore ordinario di λέγω e introduce naturalmente la domanda diretta, senza sostituirlo interpretativamente con «gli chiesero».
- source_word: Διὰ τί
  choice: Perché
  rationale: È l'equivalente interrogativo italiano diretto e corrente dell'espressione greca.
- source_word: ἐν παραβολαῖς
  choice: in parabole
  rationale: La preposizione ἐν indica qui il modo o mezzo del parlare; «in parabole» è la resa italiana tradizionale, chiara e precisa.
- source_word: λαλεῖς
  choice: parli
  rationale: Il presente indicativo alla seconda persona singolare è reso direttamente con il presente italiano.
- source_word: αὐτοῖς
  choice: loro
  rationale: Il pronome dativo indica i destinatari del parlare; «parlare loro» è naturale e fedele in italiano.
theological_decisions: []
translation_notes:
  register: Italiano standard moderno, semplice e dignitoso. La sequenza «gli si avvicinarono e gli dissero» conserva sia il movimento verso Gesù sia il successivo atto del parlare; non è necessaria una nota lessicale, poiché il significato di προσελθόντες è espresso chiaramente nel testo.
