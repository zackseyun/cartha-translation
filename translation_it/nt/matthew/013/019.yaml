  source_fidelity: 'La resa segue fedelmente la struttura del greco: l''enunciato generale («Quando qualcuno ascolta»), «la parola del regno», la mancata comprensione, l''agente personale reso da ὁ πονηρός, l''azione energica di ἁρπάζει, il perfetto passivo «ciò che è stato seminato» e la formulazione metonimica finale sono tutti mantenuti. «Lungo la strada», però, può suggerire una semina estesa sulla strada; παρά con accusativo indica più precisamente la collocazione accanto/al margine della strada.'
  naturalness: Il testo è scorrevole, dignitoso e comprensibile nell'italiano standard moderno. «Questi è colui che» conserva un tono biblico sobrio senza risultare oscuro. La minuscola in «il maligno» evita di trasformare l'espressione in un nome proprio, pur lasciandone intatto il riferimento personale contestualmente probabile.
  terminology: «Parola del regno», «cuore» e «maligno» sono termini appropriati e non introducono interpretazioni confessionali. «Strappa via» comunica bene la forza di ἁρπάζει. La nota a conserva correttamente l'alternativa lessicale; la nota b spiega la metonimia e l'alternativa topografica.
