  to: Quando qualcuno ascolta la parola del regno e non la comprende, viene il maligno[a] e strappa via ciò che è stato seminato nel suo cuore. Questi è colui che è stato seminato accanto alla strada[b].
  rationale: 'Le sole modifiche sono prudenti e puntuali: «accanto alla strada» rende più direttamente παρά τὴν ὁδόν, mentre «il maligno» senza maiuscola evita una nominazione non espressa dalla forma greca. Il resto della traduzione e delle note è mantenuto.'
