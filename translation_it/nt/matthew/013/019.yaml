id: MAT.13.19
reference: Matthew 13:19
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: παντὸς ἀκούοντος τὸν λόγον τῆς βασιλείας καὶ μὴ συνιέντος, ἔρχεται ὁ πονηρὸς καὶ ἁρπάζει τὸ ἐσπαρμένον ἐν τῇ καρδίᾳ αὐτοῦ· οὗτός ἐστιν ὁ παρὰ τὴν ὁδὸν σπαρείς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/019.yaml
  text: When anyone hears the word of the kingdom and does not understand it[a], the evil one comes and snatches away what has been sown in his heart[b]. This is the one sown beside the road.
translation:
  language: it
  text: Quando qualcuno ascolta la parola del regno e non la comprende, viene il maligno[a] e strappa via ciò che è stato seminato nel suo cuore. Questi è colui che è stato seminato accanto alla strada[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: «il malvagio».'
    reason: Alternativa lessicale per ὁ πονηρός, che può essere reso con un aggettivo sostantivato personale.
  - marker: b
    text: 'La formulazione identifica la persona con ciò che viene seminato; si potrebbe anche rendere: «quello seminato accanto al sentiero».'
    reason: Segnala sia la metonimia conservata dal greco sia l'alternativa lessicale per ὁδός e παρά.
lexical_decisions:
- source_word: παντὸς ἀκούοντος
  choice: Quando qualcuno ascolta
  rationale: La costruzione participiale al genitivo esprime una circostanza generale; questa resa comunica in italiano corrente il valore riferito a chiunque si trovi nella situazione descritta.
- source_word: τὸν λόγον τῆς βασιλείας
  choice: la parola del regno
  rationale: «Parola» conserva sia la forma greca sia il legame figurativo tra la parola e il seme, senza escludere il senso di messaggio.
- source_word: μὴ συνιέντος
  choice: non la comprende
  rationale: Il verbo indica il comprendere o cogliere il senso; il pronome italiano rimanda naturalmente alla parola del regno.
- source_word: ὁ πονηρὸς
  choice: il Maligno
  rationale: L'aggettivo sostantivato con articolo indica qui con ogni probabilità un agente personale ostile; «il Maligno» è una resa italiana chiara e tradizionalmente intelligibile, senza identificarlo più precisamente di quanto faccia il testo.
- source_word: ἁρπάζει
  choice: strappa via
  rationale: La scelta conserva l'idea di una sottrazione improvvisa e violenta espressa dal verbo greco.
- source_word: τὸ ἐσπαρμένον
  choice: ciò che è stato seminato
  rationale: Rende il participio perfetto passivo neutro sostantivato e mantiene in primo piano l'immagine della semina.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: nel suo cuore
  rationale: Conserva il termine antropologico biblico «cuore» e il riferimento singolare del greco.
- source_word: ὁ παρὰ τὴν ὁδὸν σπαρείς
  choice: colui che è stato seminato lungo la strada
  rationale: Mantiene la formulazione volutamente metonimica con cui Gesù identifica l'ascoltatore con quanto viene seminato, invece di appianarla trasformandola esplicitamente nel terreno.
theological_decisions:
- issue: Identità di ὁ πονηρός
  choice: 'un agente personale: «il Maligno»'
  alternative: il male come realtà astratta, oppure «il malvagio»
  rationale: Il soggetto viene e sottrae quanto è stato seminato, azioni che nel contesto favoriscono una lettura personale; la resa non aggiunge però un'identificazione nominale assente dal versetto.
- issue: Rapporto fra ascoltatore, seme e terreno nell'ultima frase
  choice: conservare «colui che è stato seminato»
  alternative: esplicitare «questo è il seme seminato» oppure «questo è il terreno lungo la strada»
  rationale: Il greco usa un participio maschile riferibile alla persona e conserva una tensione metaforica fra ascoltatore, seme e luogo della semina; esplicitarne uno solo restringerebbe il testo.
- issue: Genere e numero di αὐτοῦ
  choice: «nel suo cuore»
  alternative: «nel loro cuore» oppure «nel cuore»
  rationale: Il singolare italiano segue la grammatica della fonte e si accorda con «qualcuno», mantenendo al tempo stesso il valore generale dell'enunciato.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. «Parola del regno» mantiene il lessico e l'immagine biblici; «strappa via» dà vividezza senza diventare colloquiale. La frase finale conserva deliberatamente la tensione metaforica dell'originale.
