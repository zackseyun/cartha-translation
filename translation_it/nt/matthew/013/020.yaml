  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ὁ δὲ ἐπὶ τὰ πετρώδη σπαρείς, οὗτός ἐστιν ὁ τὸν λόγον ἀκούων καὶ εὐθὺς μετὰ χαρᾶς λαμβάνων αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/020.yaml
  text: As for the one sown on the rocky ground[a], this is the one who hears the word and immediately receives it with joy,
translation:
  language: it
  text: Quanto a quello seminato sul terreno roccioso[a], è colui che ascolta la parola e subito la accoglie con gioia,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Più letteralmente: «sui luoghi rocciosi».'
    reason: Alternativa lessicale che rispecchia più formalmente il plurale sostantivato τὰ πετρώδη.
lexical_decisions:
- source_word: ὁ δὲ ἐπὶ τὰ πετρώδη σπαρείς
  choice: Quanto a quello seminato sul terreno roccioso
  rationale: «Quanto a» rende δέ come lieve passaggio al caso successivo; la formulazione conserva l'immagine compressa di chi è «seminato», senza sostituirla con una spiegazione interpretativa.
- source_word: πετρώδη
  choice: terreno roccioso
  rationale: Rende in italiano corrente il terreno caratterizzato dalla roccia e mantiene chiaramente l'immagine agricola della parabola.
- source_word: σπαρείς
  choice: seminato
  rationale: Il participio aoristo passivo di σπείρω è reso in modo conciso, conservando la voce passiva e la metafora della semina.
- source_word: οὗτός ἐστιν
  choice: è colui
  rationale: Esprime naturalmente in italiano l'identificazione introdotta dal greco, senza esplicitarla come «rappresenta».
- source_word: ὁ τὸν λόγον ἀκούων
  choice: colui che ascolta la parola
  rationale: Il participio presente sostantivato è reso con una relativa idiomatica; «la parola» conserva il lessico e la risonanza tematica del passo.
- source_word: εὐθὺς
  choice: subito
  rationale: Equivalente italiano moderno, chiaro e diretto, che mantiene l'enfasi sulla rapidità della risposta.
- source_word: μετὰ χαρᾶς
  choice: con gioia
  rationale: Mantiene il sostantivo χαρά e riproduce naturalmente la locuzione preposizionale.
- source_word: λαμβάνων αὐτόν
  choice: la accoglie
  rationale: Nel contesto dell'ascolto della parola, «accogliere» comunica ricezione e accettazione senza eccedere in parafrasi; il pronome femminile riprende naturalmente «la parola».
theological_decisions:
- issue: Referente di colui che viene seminato nella spiegazione della parabola
  choice: 'Conservare la metafora compressa: «quello seminato sul terreno roccioso», seguita dall''identificazione «è colui che…».'
  alternative: 'Esplicitare: «Il seme seminato sul terreno roccioso rappresenta la persona che…».'
  rationale: Il greco parla del «seminato» e subito lo identifica con chi ascolta. La resa scelta preserva questa tensione tra seme e persona invece di risolverla mediante una parafrasi.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. La sintassi resta vicina al greco, ma «Quanto a» ed «è colui che» assicurano naturalezza. La virgola finale è mantenuta perché il versetto prosegue nel periodo successivo.
