  text: Τότε ἀφεὶς τοὺς ὄχλους ἦλθεν εἰς τὴν ⸀οἰκίαν. καὶ προσῆλθον αὐτῷ οἱ μαθηταὶ αὐτοῦ λέγοντες· ⸀Διασάφησον ἡμῖν τὴν παραβολὴν τῶν ζιζανίων τοῦ ἀγροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/036.yaml
  text: Then[a], after leaving the crowds, he went into the house. And his disciples came to him, saying, “Explain to us the parable of the weeds of the field.”
translation:
  language: it
  text: 'Allora, dopo aver lasciato le folle, entrò nella casa. I suoi discepoli si avvicinarono a lui e gli dissero: «Spiegaci la parabola delle erbacce[a] del campo».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «della zizzania del campo»; il termine greco può indicare più precisamente il loglio, un'erba infestante simile al grano.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Allora
  rationale: Segna in modo naturale la successione temporale degli eventi nel racconto.
- source_word: ἀφεὶς τοὺς ὄχλους
  choice: lasciate le folle
  rationale: Il participio aoristo indica un'azione anteriore all'ingresso nella casa; la costruzione italiana resta concisa e dignitosa.
- source_word: ἦλθεν εἰς τὴν οἰκίαν
  choice: entrò nella casa
  rationale: Esprime con naturalezza il movimento verso l'interno e conserva l'articolo determinativo del greco.
- source_word: προσῆλθον αὐτῷ οἱ μαθηταὶ αὐτοῦ
  choice: I suoi discepoli gli si avvicinarono
  rationale: Rende direttamente l'avvicinarsi dei discepoli a Gesù e il rapporto possessivo.
- source_word: λέγοντες
  choice: e gli dissero
  rationale: La coordinazione con verbo finito è più idiomatica in italiano narrativo pur conservando il rapporto con l'azione principale.
- source_word: Διασάφησον ἡμῖν
  choice: Spiegaci
  rationale: L'imperativo chiede di rendere chiaro il significato; il pronome enclitico rende naturalmente il dativo ἡμῖν.
- source_word: τὴν παραβολὴν
  choice: la parabola
  rationale: Termine consolidato, comprensibile e appropriato al genere dell'insegnamento evangelico.
- source_word: τῶν ζιζανίων τοῦ ἀγροῦ
  choice: delle erbacce nel campo
  rationale: «Erbacce» è accessibile nell'italiano moderno; «nel campo» esprime naturalmente il rapporto semantico dei due genitivi senza forzare l'italiano.
theological_decisions: []
translation_notes:
  register: Italiano moderno standard, chiaro e dignitoso. La sintassi narrativa è resa in forma idiomatica, mentre la nota conserva sia la formulazione tradizionale «zizzania» sia la possibile identificazione botanica più precisa.
