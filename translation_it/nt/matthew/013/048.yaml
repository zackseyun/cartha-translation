id: MAT.13.48
reference: Matthew 13:48
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ἣν ὅτε ἐπληρώθη ἀναβιβάσαντες ἐπὶ τὸν αἰγιαλὸν καὶ καθίσαντες συνέλεξαν τὰ καλὰ εἰς ⸀ἄγγη, τὰ δὲ σαπρὰ ἔξω ἔβαλον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/048.yaml
  text: When it was filled[a], they pulled it up onto the shore, sat down, and gathered the good fish into containers[b], but threw the rotten ones out.
translation:
  language: it
  text: Quando fu piena, la tirarono a riva; poi si sedettero e raccolsero i pesci buoni in recipienti[a], ma gettarono via quelli marci[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «in contenitori». Il termine greco indica genericamente dei recipienti, non necessariamente delle ceste.
    reason: lexical_alternative
  - marker: b
    text: O «quelli cattivi» o «quelli guasti». Il termine greco può significare «marcio», «guasto» o, più in generale, «senza valore».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἣν
  choice: la
  rationale: Il pronome relativo riprende la rete menzionata nel versetto precedente; in italiano la ripresa pronominale femminile rende naturale il passaggio alla frase temporale.
- source_word: ἐπληρώθη
  choice: fu piena
  rationale: Il passivo aoristo indica che la rete si riempì; «fu piena» è naturale nel contesto e conserva il valore risultativo senza appesantire la frase.
- source_word: ἀναβιβάσαντες
  choice: la tirarono a riva
  rationale: Il participio descrive il recupero della rete dall’acqua verso terra. «Tirarono» esprime chiaramente l’azione senza aggiungere dettagli non presenti nel greco.
- source_word: ἐπὶ τὸν αἰγιαλόν
  choice: a riva
  rationale: αἰγιαλός indica la riva o la spiaggia; «a riva» è idiomatico nel contesto della pesca e non presuppone una spiaggia sabbiosa.
- source_word: καθίσαντες
  choice: poi si sedettero
  rationale: Il participio aoristo presenta l’azione successiva. «Poi» rende in italiano la progressione narrativa implicita.
- source_word: συνέλεξαν
  choice: raccolsero
  rationale: Il verbo significa radunare o raccogliere insieme ed è adatto all’azione di separare il pescato.
- source_word: τὰ καλά
  choice: i pesci buoni
  rationale: Il greco ha letteralmente «le cose buone» o «quelli buoni»; «pesci» è ricavato dal contesto immediato e chiarisce il referente senza interpretare l’immagine.
- source_word: εἰς ἄγγη
  choice: in recipienti
  rationale: ἄγγος è un termine generico per un contenitore. «Recipienti» mantiene questa ampiezza semantica, mentre «ceste» sarebbe troppo specifico.
- source_word: τὰ δὲ σαπρά
  choice: ma ... quelli marci
  rationale: σαπρός può indicare ciò che è marcio, guasto o, più in generale, inutilizzabile. «Marci» conserva la concretezza e la forza valutativa dell’immagine.
- source_word: ἔξω ἔβαλον
  choice: gettarono via
  rationale: La combinazione esprime l’eliminazione di ciò che è stato scartato; «gettarono via» è corrente e conserva la forza del rifiuto.
theological_decisions:
- issue: Interpretazione della separazione nella parabola
  choice: Rendere il versetto come una concreta scena di pesca, senza anticipare nella traduzione la spiegazione allegorica dei versetti successivi.
  alternative: Usare termini interpretativi che richiamino già il giudizio finale.
  rationale: Questo versetto presenta ancora l’immagine narrativa; la sua applicazione teologica segue nei versetti successivi. Mantenere il linguaggio concreto preserva la progressione del testo e non impone prematuramente l’interpretazione.
translation_notes:
  register: Italiano moderno, piano e dignitoso. La coordinazione con «poi» rende fluida la successione dei participi greci; «recipienti» evita una specificazione indebita e «marci» conserva la concretezza della scena.
