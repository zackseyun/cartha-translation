id: MAT.13.31
reference: Matthew 13:31
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Ἄλλην παραβολὴν παρέθηκεν αὐτοῖς λέγων· Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν κόκκῳ σινάπεως, ὃν λαβὼν ἄνθρωπος ἔσπειρεν ἐν τῷ ἀγρῷ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/031.yaml
  text: He set another parable before them, saying, “The kingdom of heaven is like a mustard seed, which a man took and sowed in his field.”
translation:
  language: it
  text: 'Propose loro un’altra parabola, dicendo: «Il regno dei cieli è simile a un granello di senape che un uomo prese e seminò nel suo campo».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρέθηκεν
  choice: propose
  rationale: Nel contesto dell’insegnamento, παρατίθημι significa presentare o porre davanti agli ascoltatori. «Propose loro» conserva l’idea di esporre la parabola ed è naturale in italiano.
- source_word: παραβολὴν
  choice: parabola
  rationale: È il termine italiano tradizionale e preciso per il genere didattico indicato da παραβολή nei Vangeli sinottici.
- source_word: Ὁμοία ἐστὶν
  choice: è simile a
  rationale: Riproduce fedelmente la formula comparativa greca in un italiano chiaro e dignitoso.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: il regno dei cieli
  rationale: Mantiene la caratteristica espressione matteana e lascia aperte le sue sfumature di sovranità e ambito, senza ridurla al solo concetto astratto di governo.
- source_word: κόκκῳ σινάπεως
  choice: un granello di senape
  rationale: «Granello di senape» rende in modo naturale κόκκος e conserva l’immagine concreta di un seme molto piccolo.
- source_word: ὃν λαβὼν ἄνθρωπος
  choice: che un uomo prese
  rationale: La relativa resta riferita al granello; il participio λαβών è reso con un verbo finito coordinato secondo l’uso naturale italiano, mentre ἄνθρωπος è mantenuto come «un uomo».
- source_word: ἔσπειρεν
  choice: seminò
  rationale: È l’equivalente specifico di σπείρω e risulta più preciso di «piantò» riferito a un seme.
- source_word: ἐν τῷ ἀγρῷ αὐτοῦ
  choice: nel suo campo
  rationale: Rende direttamente sia l’ambientazione agricola di ἀγρός sia il possessivo αὐτοῦ.
theological_decisions:
- issue: Resa dell’espressione matteana βασιλεία τῶν οὐρανῶν
  choice: il regno dei cieli
  alternative: il regno del cielo; la sovranità dei cieli
  rationale: «Il regno dei cieli» conserva la formulazione caratteristica di Matteo e non limita il senso né a un luogo né al solo esercizio astratto del governo divino.
translation_notes:
  register: Italiano moderno standard, chiaro e dignitoso. La sintassi resta vicina al testo greco senza risultare artificiosa; non sono necessarie note a piè di pagina.
