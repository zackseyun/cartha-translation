source:
  edition: SBLGNT
  text: καὶ βαλοῦσιν αὐτοὺς εἰς τὴν κάμινον τοῦ πυρός· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/050.yaml
  text: and they will throw them into the furnace of fire[a]. In that place there will be weeping and gnashing of teeth.
translation:
  language: it
  text: E li getteranno nella fornace di fuoco[a]. Là ci saranno pianto e stridore di denti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Più idiomaticamente, «fornace ardente». Il greco dice letteralmente «fornace di fuoco».
    reason: lexical_alternative
lexical_decisions:
- source_word: βαλοῦσιν
  choice: getteranno
  rationale: Il futuro attivo di βάλλω esprime l’atto energico di gettare; «getteranno» è naturale nell’italiano moderno e conserva la forza dell’immagine senza tono arcaico.
- source_word: αὐτοὺς
  choice: li
  rationale: Pronome accusativo maschile plurale riferito ai malvagi menzionati nel contesto precedente; il pronome oggetto italiano rende il riferimento in modo chiaro e conciso.
- source_word: κάμινον τοῦ πυρός
  choice: fornace di fuoco
  rationale: Riproduce da vicino la costruzione greca con il genitivo e conserva intatta l’immagine concreta; l’alternativa più idiomatica è segnalata in nota.
- source_word: ἐκεῖ
  choice: Là
  rationale: Rende direttamente l’avverbio locativo enfatico, collegando il pianto e lo stridore al luogo appena indicato.
- source_word: ἔσται
  choice: ci saranno
  rationale: La costruzione esistenziale italiana concordata con due sostantivi coordinati rende in modo naturale il futuro di εἰμί.
- source_word: ὁ κλαυθμὸς
  choice: pianto
  rationale: κλαυθμός indica il piangere in segno di dolore o lamento; «pianto» è chiaro, sobrio e adatto alla formula matteana.
- source_word: ὁ βρυγμὸς τῶν ὀδόντων
  choice: stridore di denti
  rationale: È la resa italiana consolidata e comprensibile della formula, capace di conservare le connotazioni di angoscia e giudizio senza aggiungere una spiegazione interpretativa.
theological_decisions:
- issue: Resa delle immagini di giudizio nel contesto escatologico
  choice: Conservare le immagini concrete «fornace di fuoco», «pianto» e «stridore di denti» senza attenuarle né ampliarle.
  alternative: Usare «fornace ardente» oppure parafrasare la frase finale esplicitando l’angoscia delle persone.
  rationale: Il testo presenta immagini severe di giudizio nella spiegazione della parabola. Mantenerne la formulazione concreta preserva la forza e la tensione teologica del greco senza definire oltre la natura delle immagini.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. La formulazione mantiene la concisione e la solennità della sentenza matteana; «Là» evita l’espansione interpretativa di «in quel luogo», mentre la nota chiarisce l’alternativa idiomatica per la costruzione semitizzante «fornace di fuoco».
