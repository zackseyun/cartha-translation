  text: The one who has ears[a], let him hear.
translation:
  language: it
  text: Chi ha orecchi, ascolti.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἔχων
  choice: Chi ha
  rationale: L’articolo con il participio presente ha valore sostantivato e indica in modo generico qualunque persona che possieda orecchi. «Chi ha» conserva il singolare e risulta naturale nell’italiano contemporaneo.
- source_word: ὦτα
  choice: orecchi
  rationale: Il greco usa il plurale di οὖς. «Orecchi» ne riproduce direttamente il numero ed è idiomatico in questa formula di esortazione.
- source_word: ἀκουέτω
  choice: ascolti
  rationale: L’imperativo presente attivo di terza persona singolare esprime un’esortazione. «Ascolti» mantiene il singolare e rende il senso contestuale di udire con attenzione e recepire, non soltanto di percepire un suono.
theological_decisions:
- issue: Valore generico dell’espressione al maschile singolare greco
  choice: Chi ha orecchi, ascolti.
  alternative: Colui che ha orecchi, oda.
  rationale: Il greco è grammaticalmente maschile singolare ma ha riferimento generico. L’italiano «chi» include naturalmente ogni persona senza modificare il numero né introdurre un riferimento esclusivamente maschile; «ascolti» conserva inoltre la forza esortativa dell’imperativo.
translation_notes:
  register: Italiano moderno, conciso e dignitoso. La formulazione conserva la struttura proverbiale della sentenza; «ascolti» comunica più naturalmente di «oda» l’idea di un ascolto attento implicata dal contesto.
