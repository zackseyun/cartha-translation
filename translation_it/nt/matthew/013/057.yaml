source:
  edition: SBLGNT
  text: καὶ ἐσκανδαλίζοντο ἐν αὐτῷ. ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Οὐκ ἔστιν προφήτης ἄτιμος εἰ μὴ ἐν τῇ ⸀πατρίδι καὶ ἐν τῇ οἰκίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/057.yaml
  text: And they took offense at him[a]. But Jesus said to them[c][b], “A prophet is not without honor except in his hometown and in his own household.”
translation:
  language: it
  text: 'E si scandalizzavano di lui[a]. Ma Gesù disse loro: «Un profeta non è privo d’onore se non nella propria terra[b] e in casa propria[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «si offendevano per lui»; letteralmente, «inciampavano in lui».
    reason: lexical_alternative
  - marker: b
    text: O «nel proprio luogo d’origine» o «nella propria patria».
    reason: lexical_alternative
  - marker: c
    text: O «nella propria famiglia». Il termine greco può indicare tanto la casa quanto le persone che ne fanno parte.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσκανδαλίζοντο ἐν αὐτῷ
  choice: si scandalizzavano a causa sua
  rationale: Rende l’ostilità suscitata da Gesù nel contesto e conserva l’immagine implicita dello scandalo o inciampo, senza trasformarla in un inciampo materiale.
- source_word: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Ma Gesù disse loro
  rationale: Il «ma» esprime il lieve contrasto introdotto da δέ tra la loro reazione e la risposta di Gesù.
- source_word: προφήτης
  choice: profeta
  rationale: È l’equivalente italiano diretto e tradizionale, adatto alla forma proverbiale della frase.
- source_word: ἄτιμος
  choice: privo d’onore
  rationale: Conserva in modo trasparente la costruzione negativa e la dimensione di onore e disonore del termine greco.
- source_word: εἰ μὴ
  choice: se non
  rationale: È la forma italiana naturale per introdurre l’eccezione nella costruzione proverbiale.
- source_word: πατρίδι
  choice: propria terra
  rationale: Nel contesto indica il luogo d’origine di una persona; «terra» mantiene una certa ampiezza semantica senza restringere necessariamente il riferimento alla sola città.
- source_word: οἰκίᾳ αὐτοῦ
  choice: in casa propria
  rationale: L’espressione italiana può riferirsi sia alla casa sia alla cerchia domestica e familiare, conservando l’ampiezza di οἰκία.
theological_decisions:
- issue: Portata del proverbio di Gesù sul rifiuto del profeta
  choice: Presentare la frase come un proverbio generale sulla mancanza d’onore nel proprio ambiente d’origine e domestico.
  alternative: Esplicitare che il detto riguarda specificamente l’incredulità dei familiari di Gesù.
  rationale: Il greco enuncia un proverbio applicato alla situazione narrativa, ma non sviluppa qui un’affermazione dottrinale più ampia né limita esplicitamente il riferimento ai soli familiari.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. La formulazione mantiene il carattere proverbiale del detto, l’immagine dello scandalo e l’ambiguità di «casa» tra luogo fisico e cerchia familiare.
