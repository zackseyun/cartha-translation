id: MAT.13.40
reference: Matthew 13:40
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ὥσπερ οὖν συλλέγεται τὰ ζιζάνια καὶ πυρὶ ⸀καίεται, οὕτως ἔσται ἐν τῇ συντελείᾳ τοῦ ⸀αἰῶνος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/040.yaml
  text: Therefore[a], just as the weeds are gathered and burned with fire[b], so it will be at the end of the age.
translation:
  language: it
  text: Come dunque si raccolgono le erbacce[a] e si bruciano nel fuoco, così avverrà alla fine dell’età[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oppure, tradizionalmente, «le zizzanie». Il termine greco indica erbe infestanti nocive, probabilmente il loglio.
    reason: lexical_alternative
  - marker: b
    text: Oppure «alla fine del mondo»; il greco dice «alla fine dell’età».
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ οὖν
  choice: Come dunque
  rationale: «Come» introduce il paragone e «dunque» conserva il valore inferenziale o continuativo di οὖν, collegando il versetto alla spiegazione precedente.
- source_word: συλλέγεται
  choice: si raccolgono
  rationale: Il singolare greco concorda grammaticalmente con il soggetto neutro plurale; in italiano è naturale usare il plurale. La forma impersonale-passiva conserva l’azione senza specificare qui gli agenti.
- source_word: τὰ ζιζάνια
  choice: le erbacce
  rationale: Il termine indica piante infestanti nocive, probabilmente loglio; «erbacce» è moderno, comprensibile e adeguato al contesto agricolo.
- source_word: πυρὶ καίεται
  choice: si bruciano nel fuoco
  rationale: Rende esplicitamente sia il verbo καίω sia πῦρ. «Nel fuoco» è idiomatico in italiano e lascia aperta la precisa sfumatura del dativo greco.
- source_word: οὕτως ἔσται
  choice: così avverrà
  rationale: Esprime in modo naturale il parallelismo e il riferimento futuro, senza aggiungere un soggetto non espresso.
- source_word: ἐν τῇ συντελείᾳ
  choice: alla fine
  rationale: «Alla fine» è la resa italiana più chiara e idiomatica della culminazione indicata da συντέλεια.
- source_word: τοῦ αἰῶνος
  choice: dell’epoca
  rationale: «Epoca» conserva il senso temporale di αἰών e evita di identificarlo direttamente con il mondo fisico.
theological_decisions:
- issue: Espressione escatologica τοῦ αἰῶνος
  choice: dell’epoca
  alternative: del mondo
  rationale: Il greco indica primariamente un periodo o un’epoca. Questa resa mantiene la sfumatura temporale ed escatologica senza imporre uno schema specifico né trasformare il referente nel cosmo fisico.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. La struttura comparativa del greco è mantenuta; «erbacce» evita l’arcaismo «zizzania», mentre la nota conserva la probabile identificazione botanica. «Epoca» rende esplicito il valore temporale di αἰών.
