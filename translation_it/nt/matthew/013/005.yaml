  text: ἄλλα δὲ ἔπεσεν ἐπὶ τὰ πετρώδη ὅπου οὐκ εἶχεν γῆν πολλήν, καὶ εὐθέως ἐξανέτειλεν διὰ τὸ μὴ ἔχειν βάθος γῆς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/005.yaml
  text: Other seed fell on rocky ground[a], where it did not have much soil, and it sprang up at once because it had no depth of soil,
translation:
  language: it
  text: Altri semi caddero sul terreno roccioso[a], dove non c’era molta terra, e germogliarono subito perché il terreno non era profondo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alla lettera, «sui luoghi rocciosi»; l’espressione indica uno strato poco profondo di terra sopra la roccia.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα δὲ
  choice: Altri semi
  rationale: Il neutro plurale sottintende ciò che fu seminato nel versetto precedente. In italiano si esplicita «semi» per chiarezza, mantenendo il contrasto distributivo.
- source_word: ἔπεσεν
  choice: caddero
  rationale: Rende direttamente il verbo «cadere», senza sostituirlo con l’interpretativo «furono seminati». Il singolare greco può concordare ad sensum con il collettivo sottinteso, mentre l’italiano richiede qui il plurale con «semi».
- source_word: ἐπὶ τὰ πετρώδη
  choice: sul terreno roccioso
  rationale: Espressione naturale nell’italiano moderno che indica luoghi pietrosi, nel contesto uno strato sottile di terra sopra la roccia.
- source_word: ὅπου οὐκ εἶχεν γῆν πολλήν
  choice: dove non c’era molta terra
  rationale: La costruzione impersonale italiana è fluida e conserva il riferimento alla scarsa quantità di suolo disponibile.
- source_word: καὶ εὐθέως ἐξανέτειλεν
  choice: e germogliarono subito
  rationale: «Germogliare» esprime con precisione l’emergere della pianta; «subito» conserva la forza temporale di εὐθέως.
- source_word: διὰ τὸ μὴ ἔχειν βάθος γῆς
  choice: perché la terra non era profonda
  rationale: Rende chiaramente la causa espressa da διά con l’infinito articolato e conserva l’immagine dello scarso spessore del terreno.
theological_decisions: []
translation_notes:
  register: Italiano moderno, naturale e dignitoso. Il plurale «Altri semi… germogliarono» evita un referente ambiguo e risulta idiomatico, mentre la nota conserva la forma più letterale del sintagma greco.
