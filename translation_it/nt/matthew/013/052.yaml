id: MAT.13.52
reference: Matthew 13:52
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Διὰ τοῦτο πᾶς γραμματεὺς μαθητευθεὶς ⸂τῇ βασιλείᾳ⸃ τῶν οὐρανῶν ὅμοιός ἐστιν ἀνθρώπῳ οἰκοδεσπότῃ ὅστις ἐκβάλλει ἐκ τοῦ θησαυροῦ αὐτοῦ καινὰ καὶ παλαιά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/052.yaml
  text: Then he said to them[c][b][a], “Therefore every scribe who has been trained for the kingdom of heaven is like a master of a house who brings out of his treasure new things and old.”
translation:
  language: it
  text: 'Ma egli disse loro: «Perciò ogni scriba istruito per il regno dei cieli[a] è simile a un padrone di casa[b] che trae fuori dal suo tesoro[c] cose nuove e cose antiche».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «divenuto discepolo del regno dei cieli». Il participio greco può indicare sia l'essere fatto discepolo sia l'essere istruito o formato.
    reason: alternative_reading
  - marker: b
    text: O «capofamiglia» o «responsabile della casa».
    reason: lexical_alternative
  - marker: c
    text: «Tesoro» può indicare anche il deposito o la stanza in cui vengono custoditi beni di valore.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Perciò
  rationale: Esprime in modo naturale il nesso inferenziale con quanto precede, senza appesantire la frase.
- source_word: πᾶς γραμματεὺς
  choice: ogni scriba
  rationale: Mantiene il termine diretto del greco e il suo legame con la figura dello studioso e maestro delle Scritture, senza restringerlo mediante una parafrasi.
- source_word: μαθητευθεὶς
  choice: istruito
  rationale: Rende in italiano corrente il valore passivo di una persona formata, lasciando in nota l'esplicita sfumatura del diventare discepolo.
- source_word: τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: per il regno dei cieli
  rationale: Il dativo è insolito e può indicare orientamento o relazione; «per» conserva in forma concisa questa apertura interpretativa.
- source_word: ὅμοιός ἐστιν
  choice: è simile a
  rationale: È la formulazione italiana naturale e tradizionale per introdurre il paragone.
- source_word: ἀνθρώπῳ οἰκοδεσπότῃ
  choice: un padrone di casa
  rationale: Comunica il ruolo di autorità e responsabilità domestica espresso da οἰκοδεσπότης, con linguaggio moderno e comprensibile.
- source_word: ἐκβάλλει
  choice: trae fuori
  rationale: Nel contesto di beni conservati, il verbo indica il far uscire o portare fuori, non un'espulsione violenta.
- source_word: ἐκ τοῦ θησαυροῦ αὐτοῦ
  choice: dal suo tesoro
  rationale: Conserva sia l'idea di valore sia quella di una riserva custodita; una nota segnala il possibile senso concreto di deposito.
- source_word: καινὰ καὶ παλαιά
  choice: cose nuove e cose antiche
  rationale: Esplicita i neutri plurali sostantivati e mantiene l'ordine e il contrasto dell'originale.
theological_decisions:
- issue: Il senso di μαθητευθεὶς in rapporto allo scriba e al regno
  choice: uno scriba istruito per il regno dei cieli
  alternative: uno scriba divenuto discepolo del regno dei cieli
  rationale: La formulazione principale comunica la formazione ricevuta senza ridurre il participio alla sola istruzione accademica o alla sola conversione; la nota conserva l'esplicita possibilità del discepolato.
- issue: Il ruolo espresso da οἰκοδεσπότης
  choice: padrone di casa
  alternative: capofamiglia; responsabile della casa
  rationale: La scelta mantiene la funzione di chi governa e amministra la casa nella similitudine, senza ricavarne affermazioni sociali o dottrinali ulteriori.
- issue: Il rapporto tra cose nuove e antiche
  choice: mantenere entrambe senza identificarle allegoricamente
  alternative: specificarle come insegnamenti del nuovo e dell'antico patto
  rationale: Il testo non esplicita il referente delle due categorie; la traduzione conserva quindi la tensione e l'apertura dell'immagine.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. La sintassi resta vicina alla struttura greca senza risultare artificiosa; i termini «scriba», «regno dei cieli» e «tesoro» preservano il lessico e l'immaginario matteani. Le note rendono visibili le principali alternative lessicali e la genuina ambiguità del participio μαθητευθείς.
