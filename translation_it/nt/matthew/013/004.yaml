  variant: modern standard Italian
source:
  edition: SBLGNT
  text: καὶ ἐν τῷ σπείρειν αὐτὸν ἃ μὲν ἔπεσεν παρὰ τὴν ὁδόν, καὶ ⸂ἐλθόντα τὰ πετεινὰ⸃ κατέφαγεν αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/004.yaml
  text: And as he was sowing[a], some seeds fell beside the path, and the birds came and devoured them.
translation:
  language: it
  text: Mentre seminava, alcuni semi[a] caddero accanto al sentiero; gli uccelli vennero e li divorarono.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il greco dice letteralmente «alcune cose caddero accanto al sentiero»; «semi» è esplicitato in base al contesto del seminatore.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ σπείρειν αὐτὸν
  choice: Mentre seminava
  rationale: La costruzione ἐν con infinito articolato esprime contemporaneità; «mentre seminava» è naturale in italiano e mantiene il valore temporale.
- source_word: ἃ μὲν
  choice: alcuni semi
  rationale: Il pronome relativo neutro plurale significa letteralmente «alcune cose» e rinvia, nel contesto, a ciò che il seminatore sparge; «semi» rende esplicito il referente sottinteso.
- source_word: ἔπεσεν
  choice: caddero
  rationale: L'aoristo narrativo si rende naturalmente con il passato remoto; il plurale segue il referente esplicitato «alcuni semi».
- source_word: παρὰ τὴν ὁδόν
  choice: lungo il sentiero
  rationale: παρά con l'accusativo indica qui la zona adiacente alla via; «lungo il sentiero» è idiomatico nel contesto agricolo e non suggerisce necessariamente una strada vera e propria.
- source_word: ἐλθόντα τὰ πετεινὰ
  choice: vennero gli uccelli
  rationale: Il participio aoristo è reso come verbo finito in successione narrativa; πετεινά indica gli uccelli, senza l'aggiunta «del cielo», assente dal testo.
- source_word: κατέφαγεν
  choice: divorarono
  rationale: κατεσθίω esprime un mangiare completo o vorace; «divorarono» ne conserva la forza.
- source_word: αὐτά
  choice: li
  rationale: Il pronome rinvia ai semi; il clitico maschile plurale concorda con «semi» in italiano.
theological_decisions: []
