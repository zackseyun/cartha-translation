  to: 'Giunto nel suo paese natale, insegnava loro nella loro sinagoga, così che rimasero stupiti e dissero: «Da dove vengono a quest’uomo questa sapienza e queste opere di potenza[a]?».'
  rationale: La revisione migliora la resa del nesso risultativo ὥστε e l'idiomaticità italiana, mantenendo l'aspetto imperfettivo di «insegnava», il valore locale di πατρίς e l'ambiguità lessicale di δυνάμεις. La nota conserva «miracoli» come alternativa senza farne la resa principale.
