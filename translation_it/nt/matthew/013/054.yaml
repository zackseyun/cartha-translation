source:
  edition: SBLGNT
  text: καὶ ἐλθὼν εἰς τὴν πατρίδα αὐτοῦ ἐδίδασκεν αὐτοὺς ἐν τῇ συναγωγῇ αὐτῶν, ὥστε ἐκπλήσσεσθαι αὐτοὺς καὶ λέγειν· Πόθεν τούτῳ ἡ σοφία αὕτη καὶ αἱ δυνάμεις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/054.yaml
  text: And coming to his hometown[a], he was teaching them in their synagogue, so that they were astonished and said, “Where did this man get this wisdom and these powers?”
translation:
  language: it
  text: 'Giunto nel suo paese natale, insegnava loro nella loro sinagoga, così che rimasero stupiti e dissero: «Da dove vengono a quest’uomo questa sapienza e queste opere di potenza[a]?».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «miracoli»; il termine greco può indicare opere o manifestazioni di potenza.
    reason: lexical_alternative
lexical_decisions:
- source_word: πατρίδα
  choice: terra d’origine
  rationale: Nel contesto indica il luogo di provenienza in cui Gesù era conosciuto, non uno Stato nazionale. «Terra d’origine» conserva il legame con la propria patria senza restringere esplicitamente il referente alla sola città.
- source_word: ἐδίδασκεν
  choice: insegnava
  rationale: L’imperfetto italiano rende naturalmente l’azione continuata espressa dall’imperfetto greco.
- source_word: συναγωγῇ
  choice: sinagoga
  rationale: Nel contesto giudaico indica chiaramente la sinagoga come luogo e istituzione comunitaria.
- source_word: ὥστε ἐκπλήσσεσθαι αὐτοὺς καὶ λέγειν
  choice: perciò essi restavano sbalorditi e dicevano
  rationale: «Perciò» esprime il risultato introdotto da ὥστε; «restavano sbalorditi» comunica la forte sorpresa di ἐκπλήσσομαι e mantiene, con l’imperfetto, lo svolgimento narrativo.
- source_word: Πόθεν
  choice: Da dove vengono
  rationale: La domanda verte sull’origine o fonte della sapienza e delle opere; questa formulazione è idiomatica in italiano e rispetta la costruzione greca priva di verbo espresso.
- source_word: τούτῳ
  choice: a quest’uomo
  rationale: Rende il dimostrativo dativo in modo naturale, conservando una possibile sfumatura di distanza da parte degli interlocutori.
- source_word: σοφία
  choice: sapienza
  rationale: È la resa italiana tradizionale e corrente del termine, qui riferito alla straordinaria qualità dell’insegnamento di Gesù.
- source_word: δυνάμεις
  choice: opere potenti
  rationale: Il plurale può designare atti nei quali si manifesta una potenza straordinaria. «Opere potenti» è comprensibile in italiano, conserva il nesso lessicale con la potenza e risulta meno interpretativo di «miracoli».
theological_decisions:
- issue: Resa di δυνάμεις per l’attività straordinaria di Gesù
  choice: opere potenti
  alternative: miracoli
  rationale: La resa scelta conserva il riferimento ad azioni che manifestano potenza senza trasformare il termine in una categoria tecnica più precisa di quanto dica il greco. La nota registra l’alternativa idiomatica comune.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. «Terra d’origine» evita il possibile senso politico moderno di «patria»; «quest’uomo» conserva la lieve distanza del dimostrativo senza ricorrere al più marcato e meno neutro «costui».
