  - severity: low
    issue: «Terra d’origine» è poco naturale nel contesto narrativo
    rationale: Per πατρίς nel senso del luogo locale d'origine/conoscenza, «paese natale» è più scorrevole e non introduce un senso politico o nazionale.
  - severity: low
    issue: «Opere potenti» è una collocazione italiana debole
    rationale: «Opere di potenza» è più naturale nel registro biblico moderno e riflette più direttamente il valore di δυνάμεις.
