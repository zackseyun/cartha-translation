  text: ἡλίου δὲ ἀνατείλαντος ἐκαυματίσθη καὶ διὰ τὸ μὴ ἔχειν ῥίζαν ἐξηράνθη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/006.yaml
  text: But when the sun rose[a], it was scorched, and because it had no root, it withered away.
translation:
  language: it
  text: Ma, quando sorse il sole, fu arso e, poiché non aveva radice, si seccò.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡλίου δὲ ἀνατείλαντος
  choice: Ma, quando si levò il sole
  rationale: Il genitivo assoluto esprime una circostanza temporale; «quando si levò il sole» è naturale in italiano e «ma» rende il lieve contrasto introdotto da δέ.
- source_word: ἐκαυματίσθη
  choice: fu bruciata
  rationale: Il passivo di καυματίζω indica l'effetto del calore ardente sulla pianta; «fu bruciata» conserva la forma passiva ed è chiaro nel contesto.
- source_word: διὰ τὸ μὴ ἔχειν
  choice: non avendo
  rationale: La costruzione διά con infinito articolato esprime la causa; il gerundio italiano mantiene in modo conciso il rapporto causale.
- source_word: ῥίζαν
  choice: radice
  rationale: Conserva il singolare del greco ed è idiomatico nell'immagine della pianta priva di radice.
- source_word: ἐξηράνθη
  choice: si seccò
  rationale: Nel contesto vegetale ξηραίνω indica che la pianta si disseccò; «si seccò» è corrente, preciso e mantiene distinto questo esito dal precedente effetto del calore.
theological_decisions: []
translation_notes:
  register: Italiano moderno standard, dignitoso e accessibile. La coordinazione e la sequenza causale dell'originale sono conservate senza appesantire la frase.
