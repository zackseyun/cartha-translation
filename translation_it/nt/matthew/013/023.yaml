  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ὁ δὲ ἐπὶ τὴν ⸂καλὴν γῆν⸃ σπαρείς, οὗτός ἐστιν ὁ τὸν λόγον ἀκούων καὶ ⸀συνιείς, ὃς δὴ καρποφορεῖ καὶ ποιεῖ ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/023.yaml
  text: But the one sown on the good soil—this is the one who hears the word and understands it[a], who indeed bears fruit and produces, in one case a hundred, in another sixty[b], and in another thirty.
translation:
  language: it
  text: Quanto a quello seminato nel buon terreno[a], questo è colui che ascolta la parola e la comprende; egli davvero porta frutto e produce, in un caso cento, in un altro sessanta e in un altro trenta[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «sulla terra buona».
    reason: lexical_alternative
  - marker: b
    text: 'Alla lettera: «uno cento, un altro sessanta e un altro trenta»; si intendono rese diverse del raccolto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τὴν καλὴν γῆν
  choice: sul terreno buono
  rationale: Nel contesto agricolo, «terreno» indica con naturalezza il suolo che riceve il seme; «buono» esprime qui la sua idoneità e fertilità, senza aggiungere una qualificazione morale.
- source_word: σπαρείς
  choice: seminato
  rationale: Il participio aoristo passivo conserva la metafora del seme e la formulazione greca, nella quale ciò che è seminato rappresenta la persona che ode.
- source_word: ὁ τὸν λόγον ἀκούων
  choice: colui che ascolta la parola
  rationale: La resa mantiene «la parola», espressione comprensibile e ricca di risonanze evangeliche, e presenta l'ascolto come tratto caratteristico.
- source_word: συνιείς
  choice: la comprende
  rationale: Il verbo indica la comprensione di ciò che viene udito; il pronome oggetto riprende naturalmente «la parola».
- source_word: δὴ
  choice: davvero
  rationale: «Davvero» rende con discrezione il valore enfatico della particella, senza appesantire la frase.
- source_word: καρποφορεῖ
  choice: porta frutto
  rationale: È la formulazione italiana idiomatica che conserva l'immagine agricola e la sua applicazione al discepolato.
- source_word: ποιεῖ
  choice: produce
  rationale: Il verbo è mantenuto distinto da «porta frutto» e, nel contesto, esprime la produzione di una resa agricola.
- source_word: ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα
  choice: ora cento, ora sessanta, ora trenta volte tanto
  rationale: La costruzione distributiva indica rese differenti. «Ora... ora...» conserva tale distribuzione; «volte tanto» esplicita in italiano l'ellissi agricola implicita nel contesto.
theological_decisions:
- issue: Natura della risposta alla parola nella parabola
  choice: La persona raffigurata dal terreno buono ascolta, comprende e porta frutto in misura variabile.
  alternative: Esplicitare perseveranza, vera conversione o rigenerazione.
  rationale: Il testo greco afferma ascolto, comprensione e frutto, ma non formula qui categorie dottrinali successive; la traduzione conserva le categorie proprie del versetto senza introdurre conclusioni confessionali.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. La costruzione «quello seminato... colui che» conserva il passaggio metaforico del greco dal seme alla persona. La punteggiatura chiarisce la progressione senza risolvere oltre il testo la relazione tra comprensione e frutto.
