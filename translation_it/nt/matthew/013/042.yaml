id: MAT.13.42
reference: Matthew 13:42
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: καὶ βαλοῦσιν αὐτοὺς εἰς τὴν κάμινον τοῦ πυρός· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/042.yaml
  text: and they will throw them into the furnace of fire[b][a]. There will be weeping and gnashing of teeth there.
translation:
  language: it
  text: e li getteranno nella fornace ardente. Là ci sarà pianto e stridore di denti.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βαλοῦσιν
  choice: getteranno
  rationale: Il futuro di βάλλω indica l’atto energico di gettare; «getteranno» è naturale e conserva la forza dell’immagine.
- source_word: αὐτούς
  choice: li
  rationale: Il pronome accusativo plurale rinvia senza ambiguità al gruppo menzionato nel contesto precedente.
- source_word: κάμινον τοῦ πυρός
  choice: fornace ardente
  rationale: La costruzione genitivale esprime una fornace caratterizzata dal fuoco. «Fornace ardente» rende l’immagine in italiano corrente e dignitoso senza aggiungere terminologia dottrinale.
- source_word: ἐκεῖ
  choice: Là
  rationale: Mantiene il valore locativo e richiama direttamente il luogo appena menzionato.
- source_word: κλαυθμός
  choice: pianto
  rationale: «Pianto» è una resa precisa e tradizionalmente comprensibile, senza accentuare oltre misura il senso come potrebbe fare «lamento» o «grida».
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: stridore di denti
  rationale: È la resa italiana consolidata dell’espressione e ne conserva l’intensità senza stabilire se indichi soprattutto dolore, disperazione o rabbia.
- source_word: καὶ
  choice: e
  rationale: Il semplice connettivo iniziale conserva la continuità con il versetto precedente.
theological_decisions:
- issue: Natura dell’immagine della fornace
  choice: Conservare la metafora concreta del giudizio mediante «fornace ardente».
  alternative: Esplicitare interpretativamente con «fuoco dell’inferno».
  rationale: Il testo presenta un’immagine vivida senza usare qui un termine tecnico per l’inferno; la traduzione non deve né attenuarla né definirla oltre quanto dice il greco.
- issue: Portata di «pianto e stridore di denti»
  choice: Mantenere intatta la formula matteana.
  alternative: Interpretarla esclusivamente come dolore oppure esclusivamente come rabbia.
  rationale: L’espressione comunica angoscia nel contesto del giudizio, ma il testo non ne restringe la componente emotiva a un solo significato.
translation_notes:
  register: Italiano moderno standard, sobrio e dignitoso. La sintassi breve conserva il vigore dell’originale; «Là» riproduce con naturalezza l’enfasi locativa di ἐκεῖ.
