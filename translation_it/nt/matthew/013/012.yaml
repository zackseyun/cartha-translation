id: MAT.13.12
reference: Matthew 13:12
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ὅστις γὰρ ἔχει, δοθήσεται αὐτῷ καὶ περισσευθήσεται· ὅστις δὲ οὐκ ἔχει, καὶ ὃ ἔχει ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/012.yaml
  text: For whoever has[a], more will be given to him, and he will have an abundance; but whoever does not have[b], even what he has will be taken from him.
translation:
  language: it
  text: Perché a chi ha[a] sarà dato e sarà nell'abbondanza[b]; ma a chi non ha sarà tolto anche ciò che ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il testo greco non specifica che cosa la persona «ha» né che cosa le sarà dato.
    reason: ambiguity_note
  - marker: b
    text: 'Più letteralmente: «e abbonderà».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις
  choice: chi
  rationale: Il pronome relativo indefinito introduce una massima generale. In italiano «chi» è naturale, distributivo e applicabile genericamente senza alterare il singolare della costruzione greca.
- source_word: γὰρ
  choice: Perché
  rationale: Introduce la spiegazione di quanto precede; «Perché» conserva il nesso argomentativo ed è corrente in italiano.
- source_word: ἔχει
  choice: ha
  rationale: Rende direttamente il presente di possesso e, come il greco, lascia sottinteso l'oggetto.
- source_word: δοθήσεται αὐτῷ
  choice: a chi ha sarà dato
  rationale: Il futuro passivo con il dativo indica che qualcosa sarà dato alla persona descritta. La costruzione italiana conserva l'oggetto non espresso senza aggiungere «di più» al testo.
- source_word: περισσευθήσεται
  choice: avrà in abbondanza
  rationale: Esprime in italiano naturale lo stato risultante di abbondanza. La formulazione evita il meno idiomatico «abbonderà», segnalato tuttavia in nota come resa più letterale.
- source_word: δὲ
  choice: ma
  rationale: Marca nettamente il contrasto fra i due membri della massima.
- source_word: καὶ
  choice: anche
  rationale: 'Ha valore intensivo o ascensivo: sottolinea il paradosso che perfino ciò che la persona ha le sarà tolto.'
- source_word: ὃ ἔχει
  choice: ciò che ha
  rationale: Riproduce naturalmente il relativo neutro greco e mantiene indeterminato ciò che è posseduto.
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: sarà tolto
  rationale: Il futuro passivo di αἴρω con ἀπό esprime sottrazione. In italiano il referente personale è già indicato da «a chi non ha», perciò non occorre ripeterlo.
theological_decisions:
- issue: Oggetto implicito di «ha» e di «sarà dato»
  choice: L'oggetto resta inespresso nel testo principale.
  alternative: Specificarlo come comprensione, ricettività, conoscenza o rivelazione dei misteri del regno.
  rationale: Il contesto riguarda l'accoglienza dell'insegnamento di Gesù e i misteri del regno, ma il greco non nomina l'oggetto. Mantenerlo implicito preserva la portata e la tensione della massima.
- issue: Maschile singolare generico
  choice: Resa con il pronome italiano invariabile «chi».
  alternative: Esplicitare «colui» e riprendere con pronomi maschili singolari.
  rationale: Le forme greche sono maschili singolari con valore rappresentativo e generico. «Chi» conserva naturalmente in italiano il singolare e il valore universale, senza introdurre un plurale né restringere il riferimento agli uomini.
- issue: Presenza o meno di «di più»
  choice: Non è stato aggiunto «di più» dopo «sarà dato».
  alternative: «Gli sarà dato di più».
  rationale: Il confronto e il verbo successivo implicano un accrescimento, ma il testo greco non esprime un comparativo. La resa scelta evita di rendere esplicito ciò che nell'originale rimane implicito.
translation_notes:
  register: Italiano standard moderno, sobrio e proverbiale. La ripetizione di «ha» è mantenuta perché struttura il contrasto dell'originale; «avrà in abbondanza» privilegia chiarezza e naturalezza senza specificare l'oggetto.
