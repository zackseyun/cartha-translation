base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/037.yaml
  text: He answered[a], “The one who sows the good seed is the Son of Man.”
translation:
  language: it
  text: 'Egli rispose: «Colui che semina il buon seme è il Figlio dell’uomo[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «l’Essere umano». Il titolo greco «il Figlio dell’uomo» richiama Daniele 7 ed è qui mantenuto per la sua risonanza consolidata nei Vangeli e nella teologia biblica.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: Egli rispose
  rationale: Il participio aoristo ἀποκριθείς e il verbo finito εἶπεν formano una formula idiomatica di introduzione alla risposta. «Egli rispose» la rende in italiano naturale, evitando il ridondante «rispondendo disse».
- source_word: ὁ σπείρων
  choice: Colui che semina
  rationale: Il participio presente sostantivato identifica la persona mediante la sua azione e conserva il valore descrittivo della formulazione greca.
- source_word: τὸ καλὸν σπέρμα
  choice: il buon seme
  rationale: In questo contesto καλός indica ciò che è buono e valido, mentre σπέρμα è un singolare collettivo; «il buon seme» è chiaro e mantiene la metafora.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: il Figlio dell’uomo
  rationale: È la designazione di Gesù consolidata nei Vangeli e richiama Daniele 7. La resa tradizionale italiana ne conserva il carattere titolare e la risonanza intertestuale.
theological_decisions:
- issue: Resa del titolo cristologico ὁ υἱὸς τοῦ ἀνθρώπου
  choice: il Figlio dell’uomo
  alternative: l’Essere umano
  rationale: La formulazione è una designazione caratteristica di Gesù, con risonanze apocalittiche e messianiche, e non va appiattita in un semplice riferimento generico a un essere umano. La nota segnala comunque l’alternativa lessicale possibile.
translation_notes:
  register: Italiano standard moderno, naturale e dignitoso. La formula introduttiva greca è resa idiomaticamente; il titolo tradizionale è conservato senza aggiunte interpretative.
