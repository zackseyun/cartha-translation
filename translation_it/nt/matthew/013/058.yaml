- from: E lì non fece molte opere potenti, a causa della loro incredulità.[a]
  to: E lì non compì molte opere di potenza, a causa della loro incredulità.[a]
  rationale: La revisione sostituisce soltanto «opere potenti» con «opere di potenza», una locuzione italiana più naturale che mantiene il valore lessicale di δύναμις. «Compì» è un verbo italiano idiomatico con «opere» e rende qui il semplice «fece» del greco senza suggerire incapacità. La struttura causale e l'ambiguità teologica del testo restano invariate.
