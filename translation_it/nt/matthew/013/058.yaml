  terminology: «Incredulità» è un'eccellente resa di ἀπιστία nel contesto. «Opere di potenza» conserva deliberatamente l'ampiezza di δυνάμεις; la nota può offrire «miracoli» come esplicitazione contestuale senza farne l'unica resa del testo.
