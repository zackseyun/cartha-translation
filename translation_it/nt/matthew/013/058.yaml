  text: καὶ οὐκ ἐποίησεν ἐκεῖ δυνάμεις πολλὰς διὰ τὴν ἀπιστίαν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/058.yaml
  text: And he did not do many mighty works there because of their unbelief[a].
translation:
  language: it
  text: E lì non compì molte opere di potenza, a causa della loro incredulità.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oppure «molti miracoli» o «molte opere potenti». Il termine greco indica opere di potenza e, in questo contesto, si riferisce ad opere miracolose.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ οὐκ ἐποίησεν
  choice: E lì non fece
  rationale: καί prosegue il racconto senza introdurre necessariamente una conseguenza; l’aoristo negato οὐκ ἐποίησεν indica che Gesù non compì tali opere, non che fosse incapace di compierle.
- source_word: ἐκεῖ
  choice: lì
  rationale: Avverbio di luogo riferito alla sua patria; «lì» è naturale nel contesto narrativo italiano.
- source_word: δυνάμεις πολλὰς
  choice: molte opere potenti
  rationale: Nel contesto evangelico δύναμις designa manifestazioni o opere di potenza, spesso miracolose. «Opere potenti» conserva il legame lessicale con la potenza senza ridurre il termine al solo concetto interpretativo di miracolo.
- source_word: διὰ τὴν ἀπιστίαν αὐτῶν
  choice: a causa della loro incredulità
  rationale: διά con l’accusativo esprime qui la causa. ἀπιστία indica incredulità o mancanza di fede; «incredulità» conserva bene la forza negativa del sostantivo nel contesto del rifiuto.
theological_decisions:
- issue: Se il versetto affermi incapacità oppure mancato compimento in risposta all’incredulità
  choice: «non fece molte opere potenti»
  alternative: «non poté fare molti miracoli»
  rationale: Il greco presenta οὐκ ἐποίησεν, «non fece», e non un’espressione di incapacità. La formulazione conserva la tensione teologica senza attribuire al testo un’affermazione più forte.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. «Opere potenti» mantiene il valore lessicale di δύναμις; la nota offre alternative più esplicite. La collocazione di «lì» rende fluida la frase senza alterarne il contenuto.
