id: MAT.13.17
reference: Matthew 13:17
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ἀμὴν γὰρ λέγω ὑμῖν ὅτι πολλοὶ προφῆται καὶ δίκαιοι ἐπεθύμησαν ἰδεῖν ἃ βλέπετε καὶ οὐκ εἶδαν, καὶ ἀκοῦσαι ἃ ἀκούετε καὶ οὐκ ἤκουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/017.yaml
  text: For truly I say to you that many prophets and righteous people longed to see what you see and did not see it[a], and to hear what you hear and did not hear it.
translation:
  language: it
  text: 'Infatti, in verità vi dico: molti profeti e giusti[a] desiderarono vedere ciò che voi vedete e non lo videro, e udire ciò che voi udite e non lo udirono.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «persone giuste». In greco «giusti» è un aggettivo usato come sostantivo per indicare persone giuste.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: in verità
  rationale: Nella formula sinottica ἀμὴν λέγω ὑμῖν, «in verità» esprime in italiano corrente e dignitoso la solenne affermazione di certezza, senza ricorrere alla traslitterazione «amen».
- source_word: γὰρ
  choice: infatti
  rationale: La congiunzione introduce la spiegazione e il sostegno di quanto precede; «infatti» ne rende naturalmente la funzione.
- source_word: λέγω ὑμῖν
  choice: vi dico
  rationale: Mantiene la forma diretta e solenne dell'espressione greca ed è idiomatico in italiano.
- source_word: πολλοὶ προφῆται καὶ δίκαιοι
  choice: molti profeti e giusti
  rationale: «Giusti» è usato come aggettivo sostantivato, come nel greco, e designa una categoria di persone distinta ma affiancata ai profeti.
- source_word: ἐπεθύμησαν
  choice: desiderarono
  rationale: Esprime il forte desiderio indicato dal verbo nel contesto; il passato remoto presenta il fatto storico riferito alle generazioni precedenti.
- source_word: ἰδεῖν ἃ βλέπετε καὶ οὐκ εἶδαν
  choice: vedere ciò che voi vedete e non lo videro
  rationale: Conserva il parallelismo, il contrasto aspettuale tra il presente dei destinatari e il mancato vedere nel passato, e il pronome «lo» riprende naturalmente l'intera realtà indicata da «ciò che».
- source_word: ἀκοῦσαι ἃ ἀκούετε καὶ οὐκ ἤκουσαν
  choice: udire ciò che voi udite e non lo udirono
  rationale: Riproduce la struttura parallela del greco e mantiene implicito l'oggetto concreto dell'ascolto.
theological_decisions:
- issue: Portata di δίκαιοι
  choice: «giusti» come categoria sostantivata accanto ai profeti
  alternative: «persone giuste»
  rationale: Il plurale sostantivato indica persone rette delle generazioni precedenti, senza limitarle ai soli profeti. La resa non aggiunge una definizione confessionale della loro giustizia.
- issue: Natura di ciò che fu visto e udito
  choice: Mantenere «ciò che voi vedete» e «ciò che voi udite» senza esplicitare l'oggetto
  alternative: Specificare «il Messia», «Gesù» o «i misteri del regno»
  rationale: Il contesto illumina il riferimento, ma il versetto lo lascia espresso mediante proposizioni relative. La traduzione conserva questa apertura e non risolve interpretativamente la tensione.
- issue: Rapporto tra desiderio e mancato compimento
  choice: 'Conservare le due negazioni coordinate: «e non lo videro... e non lo udirono»'
  alternative: Parafrasare con «senza poterlo vedere né udire»
  rationale: Il testo afferma il mancato vedere e udire, ma non ne esplicita qui la causa o l'impossibilità; la resa evita di aggiungerla.
translation_notes:
  register: Italiano standard moderno, solenne ma comprensibile. «In verità vi dico» conserva la formula tradizionale senza risultare arcaica; «infatti» rende esplicito il nesso con il contesto precedente. Il parallelismo vedere/udire e presente/passato è mantenuto con fedeltà.
