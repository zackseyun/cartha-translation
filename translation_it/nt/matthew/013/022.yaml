  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ὁ δὲ εἰς τὰς ἀκάνθας σπαρείς, οὗτός ἐστιν ὁ τὸν λόγον ἀκούων, καὶ ἡ μέριμνα τοῦ αἰῶνος ⸀τούτου καὶ ἡ ἀπάτη τοῦ πλούτου συμπνίγει τὸν λόγον, καὶ ἄκαρπος γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/022.yaml
  text: And the one sown among the thorns—this is the one who hears the word[a], but the चिंता of this age and the deceitfulness of wealth choke the word[b], and he becomes unfruitful.
translation:
  language: it
  text: Quello seminato tra le spine è colui che ascolta la parola; ma le preoccupazioni di quest'epoca[a] e l'inganno della ricchezza[b] soffocano la parola, ed egli non porta frutto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «le preoccupazioni di questo mondo». Più letteralmente, il greco dice «la preoccupazione di quest'epoca».
    reason: alternative_reading
  - marker: b
    text: O «l'inganno delle ricchezze».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἰς τὰς ἀκάνθας σπαρείς
  choice: Quello seminato tra le spine
  rationale: Conserva il participio passivo maschile singolare e il referente personale dell'interpretazione; «tra le spine» è idiomatico e fedele all'immagine.
- source_word: ὁ τὸν λόγον ἀκούων
  choice: colui che ascolta la parola
  rationale: La proposizione relativa rende naturalmente il participio presente e mantiene λόγος come «parola», cioè il messaggio proclamato.
- source_word: ἡ μέριμνα τοῦ αἰῶνος τούτου
  choice: le preoccupazioni di questa età
  rationale: Il plurale italiano esprime con naturalezza il valore collettivo di μέριμνα; «questa età» conserva il senso temporale e morale di αἰών.
- source_word: ἡ ἀπάτη τοῦ πλούτου
  choice: l'inganno della ricchezza
  rationale: Rende la capacità ingannevole attribuita alla ricchezza senza attenuare la costruzione genitivale greca.
- source_word: συμπνίγει
  choice: soffocano
  rationale: Mantiene la vivida metafora agricola; il plurale concorda in italiano con i due soggetti coordinati, «le preoccupazioni» e «l'inganno».
- source_word: ἄκαρπος γίνεται
  choice: egli diventa infruttuoso
  rationale: Esplicita il referente personale già identificato come chi ascolta, evitando di suggerire che sia la parola in sé a diventare infruttuosa.
theological_decisions:
- issue: Resa di αἰών
  choice: questa età
  alternative: questo mondo
  rationale: αἰών indica primariamente un'epoca o età. La resa scelta conserva la tensione temporale ed etica neotestamentaria; l'alternativa idiomatica è segnalata in nota.
- issue: Referente personale o impersonale della clausola finale
  choice: egli diventa infruttuoso
  alternative: essa diventa infruttuosa / la parola diventa infruttuosa
  rationale: La spiegazione identifica ciò che è seminato con «colui che ascolta»; la resa personale segue tale identificazione e non attribuisce sterilità intrinseca alla parola.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. La struttura conserva l'immagine della semina e il passaggio al referente personale; «infruttuoso» mantiene il legame lessicale con il frutto della parabola.
