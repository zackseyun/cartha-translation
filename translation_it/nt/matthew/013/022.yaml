  terminology: '«Spine», «parola», «preoccupazioni», «inganno della ricchezza» e «soffocano» sono appropriati al registro e alla metafora. La nota b va resa più aderente a ἀπάτη: «seduzione» restringe il significato verso l''attrattiva, mentre «inganno» conserva il senso di deception/deceit.'
