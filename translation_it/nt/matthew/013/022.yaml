  source_fidelity: 'La resa conserva correttamente la struttura interpretativa della parabola: il participio maschile identifica il caso/persona seminata fra le spine; λόγος è «parola»; μέριμνα e ἀπάτη sono entrambi soggetti di «soffocano»; la clausola finale si riferisce al destinatario personale. «Quest''epoca» rende αἰών senza ridurlo al mondo fisico.'
