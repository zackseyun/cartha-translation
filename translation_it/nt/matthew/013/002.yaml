source:
  edition: SBLGNT
  text: καὶ συνήχθησαν πρὸς αὐτὸν ὄχλοι πολλοί, ὥστε αὐτὸν ⸀εἰς πλοῖον ἐμβάντα καθῆσθαι, καὶ πᾶς ὁ ὄχλος ἐπὶ τὸν αἰγιαλὸν εἱστήκει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/002.yaml
  text: And large crowds gathered to him[a], so that he got into a boat and sat down[b], and the whole crowd stood on the shore.
translation:
  language: it
  text: E si radunarono presso di lui folle numerose, tanto che egli salì su una barca e si mise a sedere, e tutta la folla stava in piedi sulla riva[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «sulla spiaggia».
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήχθησαν πρὸς αὐτὸν
  choice: si radunarono presso di lui
  rationale: Il passivo aoristo ha qui valore naturale di evento collettivo; «si radunarono» è idiomatico in italiano. «Presso di lui» conserva l’orientamento espresso da πρός senza aggiungere esplicitamente l’idea di circondarlo.
- source_word: ὄχλοι πολλοί
  choice: folle numerose
  rationale: Mantiene il plurale greco e rende πολλοί in un italiano naturale, senza trasformarlo necessariamente in un riferimento alla grandezza di un’unica folla.
- source_word: ὥστε
  choice: tanto che
  rationale: Esprime chiaramente il risultato prodotto dal radunarsi delle folle.
- source_word: εἰς πλοῖον ἐμβάντα
  choice: salì su una barca
  rationale: Nel contesto, ἐμβαίνω indica l’atto di salire a bordo; questa formulazione è corrente e narrativa.
- source_word: καθῆσθαι
  choice: si mise a sedere
  rationale: Rende il passaggio alla posizione seduta e mantiene la naturale successione delle azioni.
- source_word: πᾶς ὁ ὄχλος
  choice: tutta la folla
  rationale: Conserva il passaggio dal plurale «folle» al singolare collettivo del greco.
- source_word: ἐπὶ τὸν αἰγιαλόν
  choice: sulla riva
  rationale: «Riva» è il termine italiano più neutro per αἰγιαλός in questo contesto; il vocabolo può indicare più concretamente la spiaggia.
- source_word: εἱστήκει
  choice: stava in piedi
  rationale: Rende lo stato continuativo descritto dal piuccheperfetto greco meglio del semplice «rimase», che introdurrebbe una sfumatura diversa.
theological_decisions: []
translation_notes:
  register: Italiano moderno, dignitoso e narrativamente scorrevole. Il plurale «folle numerose» e il successivo singolare collettivo «tutta la folla» riproducono la variazione del testo greco. «Mentre» chiarisce il contrasto scenico senza attribuirgli un peso teologico.
