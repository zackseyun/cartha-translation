  source_fidelity: 'Il testo rende accuratamente i principali rapporti del greco: il comparativo («più piccolo di tutti i semi»), il contrasto μέν...δέ, la crescita compiuta, il confronto con le piante coltivate, l''esito «diventa un albero» e la consecutiva ὥστε. «Gli uccelli del cielo» e «tra i suoi rami» conservano bene l''immagine e la sua apertura interpretativa.'
