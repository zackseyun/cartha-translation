  terminology: '«Piante dell’orto», «albero», «uccelli del cielo» e «fare il nido» sono scelte appropriate. La nota va lievemente precisata: le immagini richiamate sono quelle di un grande albero associato a un regno, non necessariamente di un «albero regale» in senso stretto.'
