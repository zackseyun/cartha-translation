id: MAT.13.32
reference: Matthew 13:32
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ὃ μικρότερον μέν ἐστιν πάντων τῶν σπερμάτων, ὅταν δὲ αὐξηθῇ μεῖζον τῶν λαχάνων ἐστὶν καὶ γίνεται δένδρον, ὥστε ἐλθεῖν τὰ πετεινὰ τοῦ οὐρανοῦ καὶ κατασκηνοῦν ἐν τοῖς κλάδοις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/032.yaml
  text: It is indeed smaller than all the seeds[a], but when it has grown, it is larger than the garden plants and becomes a tree[b], so that the birds of the sky come and nest in its branches.
translation:
  language: it
  text: È più piccolo di tutti i semi, ma, quando è cresciuto, è più grande delle piante dell’orto e diventa un albero, tanto che gli uccelli del cielo vengono a fare il nido tra i suoi rami.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’immagine degli uccelli che dimorano tra i rami può richiamare le raffigurazioni veterotestamentarie di un grande albero associato a un regno (per esempio Ezechiele 17:23; Daniele 4:12), ma il versetto non ne dichiara esplicitamente il significato simbolico.
    reason: cross_reference
lexical_decisions:
- source_word: μικρότερον ... πάντων τῶν σπερμάτων
  choice: più piccolo di tutti i semi
  rationale: Conserva la forma comparativa del greco con il genitivo di paragone, senza trasformarla esplicitamente in un superlativo.
- source_word: μέν ... δέ
  choice: sì ... ma
  rationale: Rende in italiano corrente e dignitoso il contrasto tra la piccolezza iniziale e la crescita successiva.
- source_word: ὅταν ... αὐξηθῇ
  choice: quando è cresciuto
  rationale: Esprime l’evento della crescita considerato nel suo compimento prima del risultato descritto.
- source_word: μεῖζον τῶν λαχάνων
  choice: più grande delle piante dell’orto
  rationale: λάχανα indica in senso ampio piante coltivate nell’orto; questa resa evita di restringere il significato alle sole verdure o erbe.
- source_word: γίνεται δένδρον
  choice: diventa un albero
  rationale: Mantiene senza attenuazioni la vivida formulazione del testo greco.
- source_word: ὥστε ἐλθεῖν
  choice: tanto che ... vengono
  rationale: Rende il valore consecutivo di ὥστε con l’infinito in una costruzione italiana naturale.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: gli uccelli del cielo
  rationale: Riproduce direttamente l’immagine greca; «del cielo» è naturale in italiano e conserva οὐρανοῦ.
- source_word: κατασκηνοῦν
  choice: fare il nido
  rationale: Nel contesto degli uccelli tra i rami comunica naturalmente l’idea di stabilirsi o dimorare, senza il registro insolito di «accamparsi».
- source_word: ἐν τοῖς κλάδοις αὐτοῦ
  choice: tra i suoi rami
  rationale: «Tra» è idiomatico per uccelli che nidificano nella ramificazione dell’albero e conserva il senso locativo.
theological_decisions:
- issue: Possibile richiamo all’immagine veterotestamentaria degli uccelli che dimorano su un grande albero
  choice: Conservare letteralmente l’immagine senza interpretarne i simboli nel testo principale.
  alternative: Identificare esplicitamente gli uccelli con nazioni o popoli che trovano rifugio nel regno di Dio.
  rationale: Il linguaggio può richiamare Ezechiele 17:23 e Daniele 4:12, ma il versetto non esplicita tale identificazione; la traduzione lascia quindi aperta la risonanza teologica.
translation_notes:
  register: Italiano standard moderno, naturale e dignitoso. Il pronome iniziale «Esso» mantiene il collegamento grammaticale con il seme menzionato nel versetto precedente. «Piante dell’orto» conserva l’ampiezza semantica di λάχανα; «fare il nido» privilegia la naturalezza contestuale.
