base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/029.yaml
  text: But he said[a], ‘No, lest while gathering the weeds you uproot the wheat along with them.’
translation:
  language: it
  text: 'Ma egli disse: «No, perché, raccogliendo le erbacce[a], non sradichiate insieme con esse anche il grano.»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradizionalmente «zizzania»; più precisamente, forse loglio, un’erba infestante che nelle prime fasi può assomigliare al grano.
    reason: lexical_alternative
lexical_decisions:
- source_word: φησιν
  choice: disse
  rationale: Il presente storico greco è reso con il passato remoto, naturale nella narrazione italiana e fedele alla funzione narrativa.
- source_word: Οὔ
  choice: 'No'
  rationale: Riproduce in modo diretto e naturale la risposta negativa.
- source_word: μήποτε
  choice: perché ... non
  rationale: In questo contesto introduce il possibile esito indesiderato che motiva il divieto; la costruzione italiana conserva tale valore preventivo.
- source_word: συλλέγοντες
  choice: raccogliendo
  rationale: Il gerundio esprime la contemporaneità del raccogliere con il possibile sradicamento.
- source_word: ζιζάνια
  choice: erbacce
  rationale: Termine moderno e comprensibile per piante infestanti; evita l'arcaicità di «zizzania» come nome botanico, mentre la precisazione tradizionale e botanica è conservata in nota.
- source_word: ἐκριζώσητε
  choice: sradichiate
  rationale: Esprime precisamente l'azione di estirpare dalla radice.
- source_word: ἅμα αὐτοῖς
  choice: insieme con esse
  rationale: Conserva l'idea che il grano verrebbe rimosso unitamente alle erbacce; il pronome femminile si accorda naturalmente con «erbacce».
- source_word: τὸν σῖτον
  choice: anche il grano
  rationale: Nel contesto agricolo σῖτος indica il cereale coltivato contrapposto alle infestanti; «grano» è la resa italiana naturale. «Anche» rende esplicita in modo idiomatico l'inclusione implicata da ἅμα αὐτοῖς.
theological_decisions:
- issue: Resa di ζιζάνια nella parabola tradizionalmente detta della zizzania
  choice: erbacce
  alternative: zizzania; loglio
  rationale: «Erbacce» comunica chiaramente la funzione delle piante nel racconto senza imporre un'identificazione botanica certa. La forma tradizionale «zizzania» e la possibile identificazione con il loglio sono preservate in nota, senza alterare il significato teologico della parabola.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. Il passato remoto si adatta al registro narrativo biblico senza risultare antiquato. La frase mantiene il rapporto tra il divieto e il rischio che lo motiva.
