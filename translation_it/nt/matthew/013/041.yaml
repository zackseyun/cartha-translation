  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ἀποστελεῖ ὁ υἱὸς τοῦ ἀνθρώπου τοὺς ἀγγέλους αὐτοῦ, καὶ συλλέξουσιν ἐκ τῆς βασιλείας αὐτοῦ πάντα τὰ σκάνδαλα καὶ τοὺς ποιοῦντας τὴν ἀνομίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/041.yaml
  text: The Son of Man will send out his angels[a], and they will gather out of his kingdom all causes of stumbling and those who practice lawlessness[b],
translation:
  language: it
  text: Il Figlio dell’uomo manderà i suoi angeli, ed essi raccoglieranno dal suo regno tutte le cause di caduta[a] e quanti praticano l’iniquità[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «tutti gli ostacoli». Il greco σκάνδαλα indica ciò che fa inciampare, cadere nel peccato o allontanarsi.
    reason: lexical_alternative
  - marker: b
    text: Più letteralmente, «quanti commettono l’iniquità». La forma verbale descrive una condotta abituale, contraria alla legge.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστελεῖ
  choice: manderà
  rationale: Il futuro attivo di ἀποστέλλω indica l’invio di agenti incaricati di un compito. «Manderà» è naturale in italiano e, con il complemento «i suoi angeli», comunica adeguatamente l’incarico senza appesantire la frase.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Il Figlio dell’uomo
  rationale: È la resa italiana consolidata del titolo e conserva il richiamo intertestuale, in particolare alla figura di Daniele 7, senza trasformarlo in una parafrasi interpretativa.
- source_word: τοὺς ἀγγέλους αὐτοῦ
  choice: i suoi angeli
  rationale: Nel contesto escatologico del giudizio, ἄγγελοι designa esseri celesti, non messaggeri umani.
- source_word: συλλέξουσιν
  choice: raccoglieranno
  rationale: Il verbo mantiene l’immagine della raccolta propria della spiegazione della parabola e suona naturale in italiano.
- source_word: ἐκ τῆς βασιλείας αὐτοῦ
  choice: dal suo regno
  rationale: In italiano «raccogliere dal suo regno» esprime la rimozione dalla sfera del regno indicata da ἐκ, evitando la formulazione meno idiomatica «fuori dal suo regno» dopo «raccoglieranno».
- source_word: πάντα τὰ σκάνδαλα
  choice: tutto ciò che è causa di caduta
  rationale: La resa conserva l’ampiezza del neutro plurale σκάνδαλα, che può comprendere persone, realtà o influssi che fanno peccare o allontanano. «Caduta» mantiene la metafora senza ridurla alla semplice offesa emotiva.
- source_word: τοὺς ποιοῦντας τὴν ἀνομίαν
  choice: quanti praticano l’iniquità
  rationale: Il participio presente esprime una condotta caratteristica e continuata, ben resa da «praticano». «Iniquità» conserva la portata morale e teologica di ἀνομία meglio di «illegalità», che in italiano moderno suggerirebbe soprattutto la violazione di leggi civili.
theological_decisions:
- issue: Resa del titolo ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Il Figlio dell’uomo
  alternative: l’Essere umano
  rationale: La forma tradizionale conserva il valore titolare e l’eco apocalittica dell’espressione, senza scioglierne anticipatamente l’identità o il significato.
- issue: Estensione semantica di σκάνδαλα nel contesto del giudizio
  choice: tutto ciò che è causa di caduta
  alternative: tutti gli ostacoli; tutto ciò che induce al peccato
  rationale: La formulazione lascia aperto se il riferimento includa persone, influssi o cose e mantiene l’idea di ciò che provoca una caduta spirituale. L’alternativa «induce al peccato» è più esplicita ma restringe interpretativamente la metafora.
- issue: Valore morale e teologico di ἀνομία
  choice: iniquità
  alternative: illegalità; violazione della legge
  rationale: «Iniquità» evita di limitare il termine al diritto civile e conserva l’idea di ribellione morale. La nota segnala il rapporto etimologico e concettuale con il disprezzo della legge senza specificare oltre il testo quale legge sia in primo piano.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. La struttura coordinata segue da vicino il greco; «ed essi» rende esplicito il cambio di soggetto già presente nella forma verbale greca e mantiene solenne la scena. I marcatori delle note sono collocati sui termini cui le note effettivamente si riferiscono.
