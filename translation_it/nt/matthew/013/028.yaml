id: MAT.13.28
reference: Matthew 13:28
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ὁ δὲ ἔφη αὐτοῖς· Ἐχθρὸς ἄνθρωπος τοῦτο ἐποίησεν. οἱ δὲ ⸂δοῦλοι αὐτῷ λέγουσιν⸃· Θέλεις οὖν ἀπελθόντες ⸀συλλέξωμεν αὐτά;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/028.yaml
  text: He said to them[a], “An enemy did this.” Then the slaves said to him, “Do you want us to go and gather them up?”
translation:
  language: it
  text: 'Egli disse loro: «Questo l’ha fatto un nemico». Allora gli schiavi[a] gli dissero: «Vuoi dunque che andiamo a raccoglierla?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «servi». Il greco δοῦλοι può indicare «schiavi» o «servi», secondo il contesto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη
  choice: disse
  rationale: Verbo dichiarativo comune, reso naturalmente con il passato remoto nella narrazione italiana.
- source_word: Ἐχθρὸς ἄνθρωπος
  choice: un nemico
  rationale: La resa idiomatica italiana esprime l’individuazione dell’avversario senza il calco innaturale «un uomo nemico».
- source_word: τοῦτο ἐποίησεν
  choice: Questo l’ha fatto
  rationale: La costruzione italiana mette in rilievo τοῦτο e usa il passato prossimo nel discorso diretto per un’azione compiuta i cui effetti sono presenti.
- source_word: δοῦλοι
  choice: schiavi
  rationale: Conserva esplicitamente la condizione sociale subordinata indicata da δοῦλοι; «servi» resta una possibile resa contestuale ed è segnalata in nota.
- source_word: Θέλεις
  choice: Vuoi
  rationale: Resa contemporanea, diretta e naturale del valore volitivo di θέλω.
- source_word: οὖν
  choice: dunque
  rationale: 'Mantiene il nesso inferenziale: riconosciuta l’opera del nemico, gli schiavi propongono la conseguente azione.'
- source_word: ἀπελθόντες
  choice: che andiamo
  rationale: Il participio aoristo indica l’azione preliminare rispetto a συλλέξωμεν; in italiano la coordinazione verbale la rende in modo naturale.
- source_word: συλλέξωμεν
  choice: a raccoglierla
  rationale: Nel contesto agricolo indica il radunare la zizzania per rimuoverla; il congiuntivo dipendente da «Vuoi che» riproduce naturalmente la proposta deliberativa.
- source_word: αὐτά
  choice: la
  rationale: Il neutro plurale greco riprende collettivamente gli elementi di zizzania; in italiano il referente «zizzania» è femminile singolare.
theological_decisions:
- issue: Resa di δοῦλοι nel contesto della parabola
  choice: schiavi
  alternative: servi
  rationale: «Schiavi» rende trasparente il rapporto sociale di dipendenza dal padrone senza attenuarlo. Poiché δοῦλος può essere reso contestualmente anche con «servo» e questa forma è tradizionale in italiano, l’alternativa è conservata in nota.
translation_notes:
  register: Italiano moderno, dignitoso e scorrevole. Il passato remoto sostiene la voce narrativa, mentre il passato prossimo nel discorso diretto presenta l’azione del nemico come compiuta e ancora evidente. È stato mantenuto «dunque» per non perdere la sfumatura inferenziale di οὖν.
