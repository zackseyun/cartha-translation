source:
  edition: SBLGNT
  text: Πάλιν ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν ⸀ἀνθρώπῳ ἐμπόρῳ ζητοῦντι καλοὺς μαργαρίτας·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/045.yaml
  text: Again[a], the kingdom of heaven is like a merchant seeking fine pearls.
translation:
  language: it
  text: Di nuovo, il regno dei cieli è simile a un mercante in cerca di perle pregiate.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πάλιν
  choice: Di nuovo
  rationale: Introduce un’ulteriore similitudine nella serie delle parabole sul regno e conserva con naturalezza la continuità del discorso.
- source_word: ὁμοία ἐστὶν
  choice: è simile a
  rationale: Resa italiana consueta e chiara della formula comparativa parabolica.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: il regno dei cieli
  rationale: Espressione caratteristica di Matteo, tradizionale ma tuttora comprensibile e fedele al plurale greco.
- source_word: ἀνθρώπῳ ἐμπόρῳ
  choice: a un mercante
  rationale: ἔμπορος identifica già la persona; rendere anche ἀνθρώπῳ con «uomo» produrrebbe in italiano una ripetizione non necessaria. La nota non è indispensabile perché non cambia il referente né il senso della similitudine.
- source_word: ζητοῦντι
  choice: in cerca di
  rationale: Esprime in modo idiomatico l’attività continuativa indicata dal participio presente.
- source_word: καλοὺς μαργαρίτας
  choice: perle pregiate
  rationale: Nel contesto commerciale καλός indica soprattutto qualità ed eccellenza; «pregiate» comunica questo valore meglio di «belle» senza anticipare esplicitamente il prezzo.
theological_decisions:
- issue: Ambito del paragone nella formula parabolica
  choice: Il regno è presentato immediatamente come simile a un mercante.
  alternative: Il regno è simile all’intera situazione di un mercante che cerca perle pregiate.
  rationale: La costruzione greca collega direttamente ὁμοία a ἀνθρώπῳ ἐμπόρῳ. La traduzione mantiene questo punto grammaticale senza restringere il significato teologico della scena complessiva, che prosegue nel versetto successivo.
translation_notes:
  register: Italiano moderno standard, dignitoso e accessibile. La formulazione è concisa e conserva la struttura della similitudine senza introdurre spiegazioni interpretative.
