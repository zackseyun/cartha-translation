revisions:
- from: Poiché il cuore di questo popolo si è fatto insensibile[a]; hanno udito a fatica con gli orecchi e hanno chiuso gli occhi, perché non vedano con gli occhi, non odano con gli orecchi, non comprendano con il cuore, non si volgano[b] e io li guarisca.[c]
  to: Poiché il cuore di questo popolo si è fatto insensibile[a]; con gli orecchi hanno udito a fatica e hanno chiuso gli occhi, affinché non vedano con gli occhi, non odano con gli orecchi, non comprendano con il cuore, non ritornino[b] e io li guarisca.[c]
  rationale: La revisione chiarisce in italiano la portata di μήποτε mediante «affinché non», senza attenuare né risolvere la tensione della citazione isaiana. «Ritornino» sostituisce un'espressione meno corrente, conservando il valore non tecnicizzato di ἐπιστρέφω. Le note restano ancorate ai punti lessicali e grammaticali pertinenti.
