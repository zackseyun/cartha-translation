id: MAT.13.15
reference: Matthew 13:15
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ἐπαχύνθη γὰρ ἡ καρδία τοῦ λαοῦ τούτου, καὶ τοῖς ὠσὶν βαρέως ἤκουσαν, καὶ τοὺς ὀφθαλμοὺς αὐτῶν ἐκάμμυσαν· μήποτε ἴδωσιν τοῖς ὀφθαλμοῖς καὶ τοῖς ὠσὶν ἀκούσωσιν καὶ τῇ καρδίᾳ συνῶσιν καὶ ἐπιστρέψωσιν, καὶ ἰάσομαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/015.yaml
  text: For this people's heart has grown dull[a], and with their ears they hear heavily, and they have closed their eyes, lest they should see with their eyes and hear with their ears and understand with their heart and turn back[c][b], and I will heal them.
translation:
  language: it
  text: Poiché il cuore di questo popolo si è fatto insensibile[a]; con gli orecchi hanno udito a fatica e hanno chiuso gli occhi, affinché non vedano con gli occhi, non odano con gli orecchi, non comprendano con il cuore, non ritornino[b] e io li guarisca.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alla lettera: «si è ispessito»; cioè è diventato ottuso o insensibile.'
    reason: lexical_alternative
  - marker: b
    text: Oppure «si volgano»; anche «si convertano».
    reason: lexical_alternative
  - marker: c
    text: 'Citazione di Isaia 6:9–10. Il greco può anche essere reso: «e io li guarirò».'
    reason: cross_reference_and_grammatical_alternative
lexical_decisions:
- source_word: ἐπαχύνθη
  choice: si è fatto insensibile
  rationale: Il verbo significa letteralmente «si è ispessito/ingrassato»; riferito al cuore indica ottusità o insensibilità. La resa italiana comunica l'idioma senza introdurre un'immagine innaturale.
- source_word: καρδία
  choice: cuore
  rationale: Mantiene il termine biblico per la dimensione interiore, qui esplicitamente collegata alla comprensione.
- source_word: λαοῦ τούτου
  choice: di questo popolo
  rationale: Conserva il dimostrativo e segue una costruzione italiana naturale.
- source_word: βαρέως ἤκουσαν
  choice: hanno udito a fatica
  rationale: Riproduce il senso letterale di un udire «pesantemente», cioè con difficoltà, mantenendo il tempo aoristo della citazione.
- source_word: ἐκάμμυσαν
  choice: hanno chiuso
  rationale: Conserva la forma attiva e quindi la responsabilità del popolo nell'azione.
- source_word: μήποτε
  choice: perché non
  rationale: Introduce in italiano corrente la clausola negativa di scopo o esito, senza eliminarne la tensione interpretativa.
- source_word: συνῶσιν
  choice: comprendano
  rationale: Esprime chiaramente la comprensione profonda indicata da συνίημι.
- source_word: ἐπιστρέψωσιν
  choice: si volgano
  rationale: Mantiene l'idea del volgersi o tornare senza ricorrere al più dottrinalmente marcato «si convertano».
- source_word: ἰάσομαι
  choice: io li guarisca
  rationale: Nella coordinazione dipendente da μήποτε, il congiuntivo italiano rende naturalmente l'esito temuto; la nota conserva la resa formale del futuro greco.
theological_decisions:
- issue: Tensione fra giudizio divino e responsabilità umana nella clausola introdotta da μήποτε
  choice: perché non vedano ... non si volgano e io li guarisca
  alternative: altrimenti vedrebbero ... si volgerebbero e io li guarirei
  rationale: La formulazione conserva il valore superficiale di scopo/esito negativo di μήποτε e l'azione volontaria del popolo nel chiudere gli occhi, senza risolvere il rapporto teologico tra indurimento, responsabilità e guarigione.
- issue: Valore di ἐπιστρέφω nel contesto del ravvedimento
  choice: si volgano
  alternative: tornino / si convertano
  rationale: «Si volgano» preserva il movimento figurato verso Dio senza imporre il linguaggio ecclesiastico più tecnico di «conversione».
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. La sintassi mantiene il parallelismo solenne della citazione profetica; «orecchi» è scelto come forma biblica ancora corrente, mentre le alternative lessicali e grammaticali significative sono segnalate in nota.
