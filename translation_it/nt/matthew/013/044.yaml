review_pass:
  verdict: revise
  source_fidelity: La resa segue bene la struttura comparativa, il tesoro nascosto, la vendita totale e l'acquisto di «quel campo». Tuttavia «di nuovo» aggiunge esplicitamente una reiterazione non espressa dal greco ἔκρυψεν; benché inferibile dal racconto, non va incorporata nel testo tradotto. «Per la sua gioia» rende inoltre più precisamente αὐτοῦ.
  naturalness: L'italiano è moderno, scorrevole e di registro appropriato. «Un uomo lo trova e lo nasconde» conserva efficacemente il presente narrativo greco. La punteggiatura con due punti è possibile, ma un punto e virgola riproduce con maggiore naturalezza la continuità della frase senza presentare la seconda scena come una spiegazione.
  terminology: '«Il regno dei cieli», «un tesoro», «un campo», «vende tutto ciò che ha» e «compra quel campo» sono scelte naturali e fedeli. Non occorre una nota lessicale sull''articolo: in italiano l''alternativa proposta non produce una variante reale e idiomatica rispetto al testo principale.'
  issues:
  - severity: medium
    issue: Aggiunta di «di nuovo»
    rationale: Il greco dice soltanto «lo nascose» (ἔκρυψεν). Il fatto che il tesoro fosse già nascosto rende la reiterazione narrativamente plausibile, ma non autorizza ad aggiungerla come informazione esplicita.
  - severity: low
    issue: Nota a priva di un'alternativa italiana sostanziale
    rationale: «Simile a tesoro nascosto» non è una formulazione italiana naturale dopo «simile a» e non offre una distinta opzione lessicale utile rispetto a «simile a un tesoro nascosto». L'àncora e la nota vanno quindi eliminate.
  revised_text: Il regno dei cieli è simile a un tesoro nascosto in un campo; un uomo lo trova e lo nasconde e, per la sua gioia, va, vende tutto ciò che ha e compra quel campo.
