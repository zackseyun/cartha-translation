revisions:
- from: 'Il regno dei cieli è simile a un tesoro nascosto in un campo[a]: un uomo lo trova e lo nasconde di nuovo; poi, per la gioia, va, vende tutto ciò che ha e compra quel campo.'
  to: Il regno dei cieli è simile a un tesoro nascosto in un campo; un uomo lo trova e lo nasconde e, per la sua gioia, va, vende tutto ciò che ha e compra quel campo.
  rationale: Eliminata l'esplicitazione interpretativa «di nuovo», resa esplicita la gioia dell'uomo mediante «sua» e rimossa la nota che non rappresentava una variante italiana valida. La sequenza dei presenti narrativi e il dimostrativo «quel» sono mantenuti.
