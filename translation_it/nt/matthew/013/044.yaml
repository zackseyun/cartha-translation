  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ⸀Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν θησαυρῷ κεκρυμμένῳ ἐν τῷ ἀγρῷ, ὃν εὑρὼν ἄνθρωπος ἔκρυψεν, καὶ ἀπὸ τῆς χαρᾶς αὐτοῦ ὑπάγει καὶ ⸂πωλεῖ πάντα ὅσα ἔχει⸃ καὶ ἀγοράζει τὸν ἀγρὸν ἐκεῖνον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/044.yaml
  text: The kingdom of heaven is like a treasure hidden in a field[a], which a man found and hid[b]; and in his joy he goes and sells all that he has and buys that field.
translation:
  language: it
  text: Il regno dei cieli è simile a un tesoro nascosto in un campo; un uomo lo trova e lo nasconde e, per la sua gioia, va, vende tutto ciò che ha e compra quel campo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν
  choice: Il regno dei cieli è simile a
  rationale: Riproduce la formula comparativa delle parabole in un italiano naturale e dignitoso; «regno dei cieli» conserva la caratteristica espressione matteana e lascia aperti i sensi di regno e regalità.
- source_word: θησαυρῷ κεκρυμμένῳ ἐν τῷ ἀγρῷ
  choice: un tesoro nascosto in un campo
  rationale: Il participio perfetto passivo indica lo stato del tesoro, già nascosto. L'indefinito italiano introduce naturalmente il campo nella scena senza imporre una determinatezza non necessaria.
- source_word: ὃν εὑρὼν ἄνθρωπος ἔκρυψεν
  choice: un uomo lo trova e lo nasconde di nuovo
  rationale: La ristrutturazione rende chiara in italiano la sequenza narrativa e il referente del pronome. «Di nuovo» esplicita il senso contestuale di nascondere nuovamente il tesoro appena trovato, implicito nella successione greca.
- source_word: ἀπὸ τῆς χαρᾶς αὐτοῦ
  choice: per la gioia
  rationale: La preposizione ἀπό può qui esprimere la causa motivante; la formulazione italiana conserva tale forza senza specificare oltre l'oggetto della gioia.
- source_word: ὑπάγει καὶ πωλεῖ πάντα ὅσα ἔχει
  choice: va, vende tutto ciò che ha
  rationale: Mantiene i presenti narrativi e la totalità espressa da πάντα ὅσα, con una sequenza scorrevole in italiano.
- source_word: ἀγοράζει τὸν ἀγρὸν ἐκεῖνον
  choice: compra quel campo
  rationale: «Quel» riflette il dimostrativo ἐκεῖνον e richiama lo specifico campo che contiene il tesoro.
theological_decisions:
- issue: Resa di βασιλεία
  choice: regno
  alternative: regalità / dominio
  rationale: «Regno» è la resa italiana tradizionale e comprensibile, ma non esclude il senso dinamico dell'esercizio della sovranità divina.
- issue: Genere di ἄνθρωπος
  choice: un uomo
  alternative: una persona
  rationale: Il sostantivo è maschile singolare e nella scena designa un personaggio maschile rappresentativo; la resa non trasforma il dettaglio narrativo in un'affermazione esclusiva sul genere.
- issue: Forza causale di ἀπὸ τῆς χαρᾶς αὐτοῦ
  choice: per la gioia
  alternative: pieno di gioia / a causa della sua gioia
  rationale: La scelta conserva la gioia come motivo dell'azione senza decidere se l'accento cada soprattutto sullo stato emotivo o sulla causalità.
translation_notes:
  register: Italiano standard moderno, semplice ma dignitoso. La punteggiatura rende leggibile la lunga sequenza greca senza spezzarne il movimento. Il linguaggio commerciale resta quotidiano («vende», «compra»).
