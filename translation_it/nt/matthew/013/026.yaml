id: MAT.13.26
reference: Matthew 13:26
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ὅτε δὲ ἐβλάστησεν ὁ χόρτος καὶ καρπὸν ἐποίησεν, τότε ἐφάνη καὶ τὰ ζιζάνια.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/026.yaml
  text: But when the plants had sprouted and produced grain[a], then the weeds also appeared.
translation:
  language: it
  text: Ma quando le piante germogliarono e portarono frutto, allora comparvero anche le erbacce[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oppure «zizzania»; forse una specifica pianta infestante, come il loglio.
    reason: Alternativa lessicale e possibile identificazione botanica di ζιζάνια.
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Ma quando
  rationale: ὅτε introduce la proposizione temporale, mentre δέ segnala una lieve progressione con sfumatura di contrasto rispetto alla semina narrata prima.
- source_word: ἐβλάστησεν
  choice: germogliarono
  rationale: Il verbo βλαστάνω indica lo spuntare o il germogliare; il passato remoto si adatta alla sequenza narrativa italiana.
- source_word: ὁ χόρτος
  choice: le piante
  rationale: χόρτος può indicare erba o vegetazione; nel contesto agricolo designa collettivamente le piante coltivate. Il plurale italiano rende naturale il valore collettivo del singolare greco senza identificarle prematuramente in modo più specifico.
- source_word: καρπὸν ἐποίησεν
  choice: produssero i chicchi
  rationale: L'espressione letterale «fece frutto» indica qui il prodotto della coltura. «I chicchi» comunica in modo concreto il senso cerealicolo del contesto, senza usare il generico «frutto».
- source_word: τότε
  choice: allora
  rationale: τότε marca il momento successivo della sequenza e trova una corrispondenza diretta e naturale in «allora».
- source_word: ἐφάνη
  choice: comparvero
  rationale: Il verbo indica che qualcosa divenne visibile o riconoscibile; «comparvero» è conciso e idiomatico.
- source_word: καὶ τὰ ζιζάνια
  choice: anche le erbacce[a]
  rationale: καί ha valore additivo («anche»). ζιζάνια indica piante infestanti e può riferirsi più precisamente alla zizzania o al loglio; il termine comune «erbacce» mantiene accessibile il testo, mentre la possibile identificazione botanica è segnalata in nota.
theological_decisions:
- issue: Identificazione specifica di ζιζάνια
  choice: Termine generico «erbacce» nel testo principale
  alternative: «zizzania» oppure, più specificamente, «loglio»
  rationale: Il testo non esige un'identificazione botanica certa. La resa generica evita di trasformare una possibilità lessicale in un'affermazione precisa, mentre la nota conserva sia il termine tradizionale sia la possibile specie.
translation_notes:
  register: Italiano moderno, chiaro e dignitoso. La formulazione conserva la scansione temporale del greco e usa lessico agricolo comprensibile senza appesantire il testo con tecnicismi botanici.
