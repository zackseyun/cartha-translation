review_pass:
  verdict: revise
  source_fidelity: 'La resa segue bene il greco: «un’altra parabola», «il regno dei cieli», «lievito», «nascose» e la clausola finale sono fedeli. Tuttavia «circa quaranta litri» nella nota è impreciso: tre sata/seah corrispondono normalmente a circa 22 litri complessivi (con variazioni secondo le ricostruzioni), non quaranta. Inoltre la costruzione italiana richiede una virgola prima della relativa esplicativa «che una donna prese».'
  naturalness: Il registro è moderno e dignitoso. «Tre sea di farina» è comprensibile grazie alla nota; «finché tutta la massa fu lievitata» è naturale e conserva il riferimento collettivo di ὅλον. L’aggiunta della virgola migliora la leggibilità.
  terminology: «Regno dei cieli» conserva la formulazione matteana; «lievito» è una scelta neutra e adeguata. «Sea» come invariabile è accettabile in una traduzione con nota culturale.
  issues:
  - severity: medium
    issue: Conversione quantitativa errata nella nota c
    rationale: Tre sea non equivalgono a circa quaranta litri. Una stima comunemente adottata è circa 22 litri in totale; poiché le equivalenze antiche sono variabili, è preferibile indicare una quantità considerevole e, se si offre una cifra, qualificarla come approssimativa.
  - severity: low
    issue: Punteggiatura della relativa
    rationale: 'In italiano la relativa riferita a «lievito» è opportunamente separata da virgola: «il lievito, che una donna prese...».'
