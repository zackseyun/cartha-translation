source:
  edition: SBLGNT
  text: Ἄλλην παραβολὴν ἐλάλησεν αὐτοῖς· Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν ζύμῃ, ἣν λαβοῦσα γυνὴ ⸀ἐνέκρυψεν εἰς ἀλεύρου σάτα τρία ἕως οὗ ἐζυμώθη ὅλον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/033.yaml
  text: 'He told them another parable: “The kingdom of heaven is like leaven[c][b][a], which a woman took and hid in three measures of flour until it was all leavened.”'
translation:
  language: it
  text: 'Raccontò loro un’altra parabola: «Il regno dei cieli è simile al lievito[a], che una donna prese e nascose[b] in tre sea[c] di farina, finché tutta la massa fu lievitata».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il termine greco indica un agente lievitante, spesso una porzione di pasta già fermentata.
    reason: lexical_alternative
  - marker: b
    text: Il greco dice letteralmente «nascose»; nel contesto si può intendere «mescolò» o «incorporò».
    reason: lexical_alternative
  - marker: c
    text: Il sea era un’antica misura di capacità. Tre sea rappresentavano una quantità considerevole di farina, approssimativamente 22 litri secondo una stima comune.
    reason: cultural_note
lexical_decisions:
- source_word: Ἄλλην παραβολὴν ἐλάλησεν αὐτοῖς
  choice: Raccontò loro un’altra parabola
  rationale: Rende in italiano naturale l’introduzione narrativa, conservando il senso aggiuntivo di ἄλλην.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: il regno dei cieli
  rationale: Formula italiana consueta che conserva l’espressione caratteristica di Matteo e il plurale οὐρανῶν.
- source_word: ζύμῃ
  choice: lievito
  rationale: Indica in modo corrente l’agente lievitante e mantiene neutra la valenza dell’immagine parabolica.
- source_word: ἐνέκρυψεν εἰς
  choice: nascose in
  rationale: Conserva la forza letterale di ἐγκρύπτω; la nota segnala le rese contestuali più idiomatiche legate all’impasto.
- source_word: ἀλεύρου σάτα τρία
  choice: tre sea di farina
  rationale: Mantiene l’unità di misura antica, evitando una conversione moderna incerta; la nota ne chiarisce l’entità.
- source_word: ἕως οὗ ἐζυμώθη ὅλον
  choice: finché tutta la massa fu lievitata
  rationale: Esplicita con il naturale collettivo italiano «massa» il referente neutro di ὅλον senza limitarlo alla sola farina non ancora impastata.
theological_decisions:
- issue: Valenza simbolica di ζύμη nella parabola del regno
  choice: Rendere in modo neutro con «lievito»
  alternative: Attribuire al lievito una connotazione esclusivamente positiva o negativa nella formulazione
  rationale: Il testo mette in primo piano l’azione nascosta e pervasiva del lievito, ma non esplicita qui una valutazione teologica; la traduzione non deve risolvere il dibattito interpretativo.
- issue: Referente preciso del paragone introdotto da ὁμοία ἐστίν
  choice: Conservare la formula «Il regno dei cieli è simile al lievito»
  alternative: Riformulare come paragone dell’intera scena o dell’azione della donna
  rationale: La sintassi greca associa formalmente il regno al lievito, mentre il significato parabolico può coinvolgere l’intera scena; la resa mantiene questa tensione.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. «Sea» conserva la precisione culturale dell’unità antica, chiarita in nota; «massa» rende fluido il riferimento complessivo espresso dal neutro greco ὅλον.
