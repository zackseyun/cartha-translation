id: MAT.13.30
reference: Matthew 13:30
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ἄφετε συναυξάνεσθαι ἀμφότερα ⸀μέχρι τοῦ θερισμοῦ· καὶ ἐν καιρῷ τοῦ θερισμοῦ ἐρῶ τοῖς θερισταῖς· Συλλέξατε πρῶτον τὰ ζιζάνια καὶ δήσατε αὐτὰ εἰς δέσμας πρὸς τὸ κατακαῦσαι αὐτά, τὸν δὲ σῖτον ⸀συναγάγετε εἰς τὴν ἀποθήκην μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/030.yaml
  text: Let both grow together until the harvest[a], and at the time of harvest I will tell the reapers, ‘First collect the weeds and tie them into bundles to burn them, but gather the wheat into my storehouse.’
translation:
  language: it
  text: 'Lasciate che entrambi crescano insieme fino alla mietitura; al tempo della mietitura dirò ai mietitori: «Raccogliete prima le erbacce[a] e legatele in fasci per bruciarle; il grano, invece, raccoglietelo nel mio granaio».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «il loglio»; tradizionalmente «la zizzania».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφετε
  choice: Lasciate che
  rationale: L’imperativo ha qui valore permissivo; «lasciate che» è naturale in italiano e mantiene la forma di comando.
- source_word: συναυξάνεσθαι ἀμφότερα
  choice: crescano insieme entrambi
  rationale: Conserva sia l’idea espressa dal prefisso συν- sia il riferimento esplicito alle due piante.
- source_word: μέχρι τοῦ θερισμοῦ
  choice: fino alla mietitura
  rationale: Rende la mietitura come evento determinato all’interno della parabola.
- source_word: ἐν καιρῷ τοῦ θερισμοῦ
  choice: al tempo della mietitura
  rationale: Riproduce il riferimento al momento appropriato o stabilito della mietitura senza appesantire la frase.
- source_word: θερισταῖς
  choice: mietitori
  rationale: Termine agricolo italiano preciso, corrente e coerente con «mietitura».
- source_word: Συλλέξατε πρῶτον
  choice: Raccogliete prima
  rationale: Mantiene chiaramente la sequenza delle operazioni indicata da πρῶτον.
- source_word: τὰ ζιζάνια
  choice: le erbacce
  rationale: Termine accessibile che comunica la natura nociva delle piante; l’identificazione più specifica è indicata in nota.
- source_word: δήσατε αὐτὰ εἰς δέσμας
  choice: legatele in fasci
  rationale: Rende concretamente l’azione e il risultato, in italiano agricolo naturale.
- source_word: πρὸς τὸ κατακαῦσαι αὐτά
  choice: per bruciarle
  rationale: Esprime lo scopo della legatura; evita di accentuare oltre il necessario il valore consumativo del verbo.
- source_word: τὸν δὲ σῖτον συναγάγετε
  choice: il grano, invece, raccoglietelo
  rationale: «Invece» segnala il contrasto di δέ; la dislocazione con pronome ripreso è naturale nel discorso diretto italiano e distingue il grano dalle erbacce.
- source_word: ἀποθήκην
  choice: granaio
  rationale: Nel contesto della mietitura indica naturalmente il luogo in cui viene custodito il grano.
theological_decisions:
- issue: Immagine parabolica della separazione finale
  choice: Conservare esclusivamente l’immagine agricola nel testo del versetto.
  alternative: Esplicitare il giudizio finale o rendere «bruciarle» con un’espressione interpretativa come «distruggerle completamente».
  rationale: L’interpretazione escatologica viene fornita più avanti nel capitolo; qui la traduzione non deve anticiparla né sciogliere la tensione della parabola.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. La formulazione conserva il ritmo del discorso diretto e la concretezza agricola dell’originale; «erbacce» privilegia la comprensibilità, mentre la nota preserva l’identificazione tradizionale e botanica.
