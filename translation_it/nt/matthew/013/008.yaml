  yaml_path: translation/nt/matthew/013/008.yaml
  text: But other seed fell on the good soil and was producing fruit—one a hundredfold, another sixty, and another thirty.
translation:
  language: it
  text: 'Un''altra parte invece cadde sul terreno buono e dava frutto: una parte il cento, un''altra il sessanta e un''altra il trenta per uno.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «e produceva frutto: chi il cento, chi il sessanta e chi il trenta per uno». La costruzione distributiva greca indica rese diverse e può essere resa con formulazioni correlativa diverse.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα
  choice: Un’altra parte
  rationale: Il neutro plurale sostantivato rinvia a ciò che è stato seminato; in italiano «un’altra parte» tratta il seme come realtà collettiva e concorda naturalmente con il verbo greco al singolare.
- source_word: δὲ
  choice: invece
  rationale: Esprime con naturalezza il contrasto con gli esiti negativi descritti nei versetti precedenti, senza appesantire l’avvio della frase.
- source_word: ἔπεσεν
  choice: cadde
  rationale: Conserva il significato concreto del verbo greco e l’immagine del seme che cade durante la semina.
- source_word: ἐπὶ τὴν γῆν τὴν καλὴν
  choice: sul terreno buono
  rationale: Nel contesto agricolo «terreno» è una resa italiana precisa e corrente di γῆ; «buono» indica qui un suolo adatto e fertile.
- source_word: ἐδίδου καρπόν
  choice: dava frutto
  rationale: L’imperfetto italiano rispecchia l’aspetto durativo o progressivo di ἐδίδου, mentre «dare frutto» conserva l’immagine agricola in forma idiomatica.
- source_word: ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα
  choice: dove il cento, dove il sessanta e dove il trenta per uno
  rationale: «Dove… dove… dove» rende la distribuzione dei diversi raccolti; «per uno» esplicita una sola volta, con naturalezza italiana, il rapporto di resa sottinteso nei tre numeri.
theological_decisions: []
translation_notes:
  register: Italiano moderno, chiaro e dignitoso. «Un’altra parte» evita l’innaturale «altri semi cadde» e conserva il valore collettivo del seme; «dava frutto» mantiene l’imperfetto del testo greco.
