  text: καὶ ἐγένετο ὅτε ἐτέλεσεν ὁ Ἰησοῦς τὰς παραβολὰς ταύτας, μετῆρεν ἐκεῖθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/053.yaml
  text: And when Jesus had finished these parables[a], he departed from there.
translation:
  language: it
  text: Quando Gesù ebbe finito queste parabole, partì di là.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ἐγένετο ὅτε
  choice: Quando
  rationale: La formula introduce una transizione narrativa e una proposizione temporale. In italiano moderno «Quando» ne esprime naturalmente la funzione senza riprodurre il semitismo con un rigido «E avvenne che».
- source_word: ἐτέλεσεν
  choice: ebbe finito
  rationale: Il verbo indica il portare a compimento. Il trapassato remoto, in correlazione con il passato remoto «partì», segnala con chiarezza che Gesù concluse le parabole prima di lasciare il luogo.
- source_word: ὁ Ἰησοῦς
  choice: Gesù
  rationale: Il nome proprio è reso nella sua forma italiana consueta; l'articolo greco non va riprodotto in questo contesto.
- source_word: τὰς παραβολὰς ταύτας
  choice: queste parabole
  rationale: «Parabole» conserva il genere didattico caratteristico del contesto sinottico, mentre «queste» rimanda alla serie appena pronunciata.
- source_word: μετῆρεν
  choice: partì
  rationale: Nel contesto il verbo significa lasciare un luogo per recarsi altrove. «Partì» è dignitoso, corrente e meno rigido di «si allontanò».
- source_word: ἐκεῖθεν
  choice: di là
  rationale: L'avverbio indica provenienza da quel luogo. «Di là» è una resa italiana concisa e idiomatica.
theological_decisions: []
translation_notes:
  register: Italiano moderno standard, narrativo e dignitoso. La costruzione conserva la sequenza temporale del greco senza calcare la formula narrativa καὶ ἐγένετο. Nessuna nota è necessaria, poiché la variante più letterale non aggiunge un'ambiguità sostanziale in italiano.
