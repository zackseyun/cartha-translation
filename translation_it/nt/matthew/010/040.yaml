id: MAT.10.40
reference: Matthew 10:40
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Ὁ δεχόμενος ὑμᾶς ἐμὲ δέχεται, καὶ ὁ ἐμὲ δεχόμενος δέχεται τὸν ἀποστείλαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/040.yaml
  text: The one who receives you receives me[a], and the one who receives me receives the one who sent me.
translation:
  language: it
  text: Chi accoglie voi accoglie me[a], e chi accoglie me accoglie colui che mi ha mandato.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «riceve» o «accetta»; il verbo greco può indicare l'accoglienza o l'accettazione di una persona, specialmente come messaggero.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ δεχόμενος
  choice: Chi accoglie
  rationale: Il participio presente articolato ha valore sostantivato e generico. «Chi accoglie» è naturale in italiano moderno e conserva tale valore senza introdurre un genere grammaticale riferito alla persona.
- source_word: δέχομαι / δέχεται
  choice: accoglie
  rationale: Nel contesto dell'invio dei discepoli, il verbo indica l'accoglienza e l'accettazione di persone quali messaggeri. La ripetizione di «accoglie» conserva la deliberata catena di identificazione del greco.
- source_word: ὑμᾶς
  choice: voi
  rationale: Il pronome oggetto è di seconda persona plurale e si riferisce ai discepoli; «voi» rende esplicito il plurale italiano.
- source_word: ἐμέ
  choice: me
  rationale: Pronome oggetto di prima persona singolare riferito a Gesù; resa diretta e naturale.
- source_word: τὸν ἀποστείλαντά με
  choice: colui che mi ha mandato
  rationale: Il participio aoristo attivo articolato è sostantivato. «Colui che mi ha mandato» mantiene il riferimento personale e non esplicita oltre quanto afferma il greco.
theological_decisions:
- issue: Identità di colui che ha mandato Gesù
  choice: colui che mi ha mandato
  alternative: il Padre che mi ha mandato
  rationale: Il contesto e la teologia matteana indicano il Padre, ma il testo greco non lo nomina qui. La traduzione conserva la formulazione del testo senza rendere esplicita un'identificazione solo implicita.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. La triplice ripetizione di «accoglie» rispecchia la struttura retorica e il legame rappresentativo tra i discepoli, Gesù e colui che lo ha mandato.
