  text: ἀσθενοῦντας θεραπεύετε, ⸂νεκροὺς ἐγείρετε⸃, λεπροὺς καθαρίζετε, δαιμόνια ἐκβάλλετε· δωρεὰν ἐλάβετε, δωρεὰν δότε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/008.yaml
  text: Heal the sick[a], raise the dead, cleanse lepers, cast out demons. Freely you received; freely give.
translation:
  language: it
  text: Guarite i malati, risuscitate i morti, purificate i lebbrosi[a], scacciate i demòni. Gratuitamente avete ricevuto, gratuitamente date.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il termine tradizionalmente reso «lebbrosi» può indicare, nell'uso biblico, persone affette da varie malattie della pelle, non soltanto dalla moderna malattia di Hansen.
    reason: cultural_note
lexical_decisions:
- source_word: ἀσθενοῦντας
  choice: i malati
  rationale: Il participio indica coloro che sono malati; «i malati» è naturale e conciso in italiano.
- source_word: θεραπεύετε
  choice: Guarite
  rationale: Nel contesto dell'attività miracolosa, il verbo significa guarire ed è reso naturalmente con l'imperativo «guarite».
- source_word: νεκροὺς ἐγείρετε
  choice: risuscitate i morti
  rationale: ἐγείρω qui indica il far tornare in vita; «risuscitate» esprime chiaramente il senso nel contesto.
- source_word: λεπροὺς
  choice: i lebbrosi
  rationale: La resa tradizionale è concisa e riconoscibile, mentre una nota chiarisce che il termine biblico può comprendere affezioni cutanee più ampie della moderna malattia di Hansen.
- source_word: καθαρίζετε
  choice: purificate
  rationale: «Purificate» conserva sia la dimensione fisica sia quella rituale del verbo, che «guarite» renderebbe solo in parte.
- source_word: δαιμόνια ἐκβάλλετε
  choice: scacciate i demòni
  rationale: È una resa diretta e idiomatica dell'espulsione di demòni nel contesto esorcistico.
- source_word: δωρεὰν
  choice: gratuitamente
  rationale: L'avverbio significa senza pagamento, gratis; la ripetizione conserva il parallelismo e l'enfasi del greco.
- source_word: ἐλάβετε
  choice: avete ricevuto
  rationale: Il passato prossimo è naturale nell'italiano corrente per ciò che i discepoli hanno ricevuto e che determina il loro agire presente.
- source_word: δότε
  choice: date
  rationale: L'imperativo traduce direttamente il greco; l'avverbio precedente ne specifica il modo.
theological_decisions:
- issue: Portata dei comandi miracolosi
  choice: Rendere gli imperativi come comandi diretti ai Dodici nel discorso missionario
  alternative: Interpretare alcune azioni metaforicamente o limitarle esplicitamente a pratiche ecclesiali successive
  rationale: Il greco presenta imperativi plurali diretti e una serie concreta di azioni. La traduzione ne conserva la forza senza definirne oltre il testo l'applicazione successiva.
- issue: Valore di καθαρίζετε
  choice: «purificate»
  alternative: «guarite»
  rationale: La scelta mantiene insieme la guarigione fisica e la dimensione di purità associata alle malattie cutanee nel contesto biblico, senza ridurre il termine a una sola valenza.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. La sequenza di imperativi e la ripetizione di «gratuitamente» conservano il ritmo e il parallelismo del testo greco; l'accento in «demòni» evita ambiguità di pronuncia.
