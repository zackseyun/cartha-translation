id: MAT.10.42
reference: Matthew 10:42
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: καὶ ὃς ⸀ἂν ποτίσῃ ἕνα τῶν μικρῶν τούτων ποτήριον ψυχροῦ μόνον εἰς ὄνομα μαθητοῦ, ἀμὴν λέγω ὑμῖν, οὐ μὴ ἀπολέσῃ τὸν μισθὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/042.yaml
  text: And whoever gives one of these little ones even a cup of cold water in the name of a disciple[a], truly I say to you[b], he will certainly not lose his reward.
translation:
  language: it
  text: 'E chiunque darà anche solo un bicchiere d’acqua fresca a uno di questi piccoli perché è un discepolo[a], in verità vi dico: non perderà affatto la sua ricompensa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Più letteralmente: «nel nome di un discepolo». La frase greca indica che il gesto è compiuto a motivo dell’identità del destinatario come discepolo.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὃς ἂν
  choice: chiunque
  rationale: Il relativo con ἄν esprime una condizione generale e indefinita; «chiunque» la rende in modo naturale.
- source_word: ποτίσῃ
  choice: darà da bere
  rationale: Rende esplicitamente il senso causativo del verbo e si combina in italiano con l’oggetto «un bicchiere d’acqua fresca».
- source_word: ἕνα τῶν μικρῶν τούτων
  choice: uno di questi piccoli
  rationale: Conserva l’espressione volutamente ampia, senza limitarla ai bambini né identificarla esclusivamente con una particolare categoria di credenti.
- source_word: ποτήριον ψυχροῦ
  choice: un bicchiere d’acqua fresca
  rationale: Il sostantivo «acqua» è sottinteso nel greco. In italiano «acqua fresca» è più idiomatico di «acqua fredda» e comunica il ristoro offerto.
- source_word: μόνον
  choice: anche solo
  rationale: Evidenzia l’esiguità del dono senza suggerire che l’acqua debba essere esclusivamente fresca.
- source_word: εἰς ὄνομα μαθητοῦ
  choice: perché è un discepolo
  rationale: Esprime in italiano corrente che il gesto è compiuto a motivo dell’identità del destinatario come discepolo, conservando in nota la formulazione più letterale.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: in verità vi dico
  rationale: Formula italiana dignitosa e comprensibile che mantiene la solennità e l’autorità dell’affermazione.
- source_word: οὐ μὴ ἀπολέσῃ
  choice: non perderà affatto
  rationale: La doppia negazione greca è enfatica; «affatto» conserva la forte assicurazione.
- source_word: τὸν μισθὸν αὐτοῦ
  choice: la sua ricompensa
  rationale: Nel contesto del discepolato, «ricompensa» rende meglio di «salario» il valore di μισθός.
theological_decisions:
- issue: Referente di «questi piccoli»
  choice: Mantenere «questi piccoli» senza restringerne il referente.
  alternative: Interpretare esplicitamente l’espressione come «bambini», «credenti deboli» o «discepoli di scarsa importanza».
  rationale: Il contesto orienta verso persone umili o di poco conto associate a Gesù, ma la traduzione non deve eliminare l’ampiezza dell’espressione.
- issue: Valore di εἰς ὄνομα μαθητοῦ
  choice: Rendere il motivo dell’azione con «perché è un discepolo».
  alternative: «Nel nome di un discepolo» oppure «in quanto discepolo».
  rationale: La frase indica che il dono è fatto a motivo dell’identità del destinatario come discepolo; la resa scelta evita connotazioni formulaiche non necessarie, mentre la nota conserva la forma più letterale.
- issue: Natura della ricompensa
  choice: Lasciare «ricompensa» senza definirne natura, tempo o modalità.
  alternative: Specificare una ricompensa celeste, escatologica o meritata.
  rationale: Il versetto afferma con forza che la ricompensa non andrà perduta, ma non la descrive ulteriormente.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. «Darà da bere» conserva il valore concreto del verbo; «anche solo» mette in risalto la modestia del gesto. La punteggiatura separa con chiarezza la formula solenne dalla promessa conclusiva.
