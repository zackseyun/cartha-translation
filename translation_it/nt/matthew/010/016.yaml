  source_fidelity: «Ecco, io vi mando come pecore in mezzo ai lupi» rende fedelmente Ἰδοὺ ἐγὼ ἀποστέλλω ὑμᾶς ὡς πρόβατα ἐν μέσῳ λύκων. «Prudenti» è un buon equivalente di φρόνιμοι nel senso di avveduti e saggi. «Integri», pur semanticamente vicino in alcuni contesti, non esprime con sufficiente precisione ἀκέραιοι qui, che indica innocenza, semplicità senza malizia o non mescolanza al male.
  naturalness: Il testo è scorrevole, conciso e di registro biblico moderno. «Innocenti come le colombe» è più idiomatico e stabilisce più naturalmente il contrasto con la prudenza dei serpenti.
  terminology: Si conserva la metafora tradizionale di pecore, lupi, serpenti e colombe. «Innocenti» corrisponde inoltre all'audit trail inglese («innocent») senza introdurre interpretazioni confessionali.
