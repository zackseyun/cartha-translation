  text: Ἰδοὺ ἐγὼ ἀποστέλλω ὑμᾶς ὡς πρόβατα ἐν μέσῳ λύκων· γίνεσθε οὖν φρόνιμοι ὡς οἱ ὄφεις καὶ ἀκέραιοι ὡς αἱ περιστεραί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/016.yaml
  text: Look, I am sending you out as sheep in the midst of wolves; therefore be wise as the snakes and innocent as the doves.
translation:
  language: it
  text: Ecco, io vi mando come pecore in mezzo ai lupi; siate dunque prudenti come i serpenti e innocenti come le colombe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Ecco
  rationale: Conserva il richiamo enfatico all'attenzione in una forma italiana naturale e dignitosa.
- source_word: ἀποστέλλω
  choice: mando
  rationale: Rende direttamente l'atto di inviare; nel contesto il mandato è già chiaro senza dover esplicitare ulteriormente.
- source_word: φρόνιμοι
  choice: prudenti
  rationale: Esprime discernimento pratico e accortezza, senza suggerire astuzia disonesta.
- source_word: οἱ ὄφεις
  choice: i serpenti
  rationale: È il normale equivalente italiano dell'immagine proverbiale greca e mantiene il registro biblico senza risultare antiquato.
- source_word: ἀκέραιοι
  choice: integri
  rationale: Conserva l'idea di essere non contaminati, puri nelle intenzioni e senza commistione con il male; evita di restringere il senso alla sola ingenuità.
theological_decisions:
- issue: Rapporto tra prudenza e integrità
  choice: Mantenere i due imperativi coordinati senza spiegazioni aggiunte
  alternative: Parafrasare come «astuti ma innocui» o precisare una strategia missionaria
  rationale: Il testo tiene insieme discernimento e integrità in tensione feconda; una parafrasi più esplicita rischierebbe di risolvere indebitamente tale tensione.
translation_notes:
  register: Italiano standard moderno, conciso e solenne senza arcaismi. La metafora animale e il parallelismo del greco sono conservati.
