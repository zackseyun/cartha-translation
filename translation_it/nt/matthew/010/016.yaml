    issue: «Integri» per ἀκέραιοι
    rationale: «Integri» richiama soprattutto rettitudine o completezza morale; il greco nel parallelismo con le colombe enfatizza l'innocenza e l'assenza di malizia. «Innocenti» è più diretto, naturale e fedele.
