id: MAT.10.25
reference: Matthew 10:25
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ἀρκετὸν τῷ μαθητῇ ἵνα γένηται ὡς ὁ διδάσκαλος αὐτοῦ, καὶ ὁ δοῦλος ὡς ὁ κύριος αὐτοῦ. εἰ τὸν οἰκοδεσπότην Βεελζεβοὺλ ⸀ἐπεκάλεσαν, πόσῳ μᾶλλον τοὺς οἰκιακοὺς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/025.yaml
  text: It is enough for the disciple that he become like his teacher[a], and the slave like his master. If they called the master of the house Beelzebul, how much more those of his household.
translation:
  language: it
  text: È sufficiente che il discepolo diventi come il suo maestro e lo schiavo come il suo padrone. Se hanno chiamato il padrone di casa Beelzebul[a], quanto più i membri della sua casa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «Beelzebù», forma tradizionale italiana del nome.
    reason: Segnala la forma italiana più familiare, mentre il testo principale segue la forma Βεελζεβούλ del testo greco.
lexical_decisions:
- source_word: ἀρκετὸν
  choice: È sufficiente
  rationale: Rende direttamente l’aggettivo predicativo e introduce in modo naturale la proposizione con «che».
- source_word: μαθητῇ
  choice: il discepolo
  rationale: Conserva il rapporto personale di apprendimento e sequela proprio del contesto evangelico.
- source_word: ἵνα γένηται
  choice: che … diventi
  rationale: Riproduce la costruzione dipendente da ἀρκετόν senza irrigidire l’italiano.
- source_word: διδάσκαλος
  choice: maestro
  rationale: È l’equivalente naturale nel rapporto discepolo-maestro e resta distinto da κύριος.
- source_word: δοῦλος
  choice: schiavo
  rationale: Nel contrasto esplicito con il padrone, il termine indica una condizione di subordinazione più forte di quella espressa da «servo».
- source_word: κύριος
  choice: padrone
  rationale: Qui designa il padrone dello schiavo nell’analogia domestica, non costituisce in primo piano un titolo cristologico.
- source_word: οἰκοδεσπότην
  choice: il padrone di casa
  rationale: Mantiene sia l’immagine della casa sia l’autorità di chi la governa.
- source_word: Βεελζεβοὺλ
  choice: Beelzebul
  rationale: Traslittera la forma attestata nel testo greco SBLGNT; la forma italiana tradizionale è segnalata in nota.
- source_word: ἐπεκάλεσαν
  choice: hanno chiamato
  rationale: Nel contesto significa attribuire a qualcuno un nome o una designazione.
- source_word: πόσῳ μᾶλλον
  choice: quanto più
  rationale: Riproduce la consueta argomentazione a fortiori e conserva l’ellissi incisiva del greco.
- source_word: οἰκιακοὺς
  choice: quelli di casa sua
  rationale: Indica in modo ampio gli appartenenti alla casa, senza limitarli ai parenti o ai servi.
theological_decisions:
- issue: Valore di κύριος nell’analogia domestica
  choice: padrone
  alternative: Signore
  rationale: Il parallelismo immediato con δοῦλος presenta un rapporto sociale domestico. «Padrone» conserva tale senso senza escludere l’applicazione implicita a Gesù, ma senza trasformare il vocabolo in un titolo esplicito.
- issue: Resa di δοῦλος
  choice: schiavo
  alternative: servo
  rationale: L’opposizione con κύριος mette in risalto lo status subordinato e vincolato; «schiavo» conserva questa forza storica e retorica.
- issue: Ellissi finale
  choice: quanto più quelli di casa sua!
  alternative: quanto più chiameranno così quelli di casa sua!
  rationale: Il greco omette il verbo nella conclusione a fortiori. L’italiano consente la stessa ellissi, che mantiene concisione e intensità senza specificare soggetto o tempo verbale non espressi.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. Il parallelismo è mantenuto con formulazione concisa; l’esclamazione finale rende naturale e incisiva l’ellissi del greco.
source_grounding:
  english_pob_role: consult_only
