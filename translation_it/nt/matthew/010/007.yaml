id: MAT.10.7
reference: Matthew 10:7
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: πορευόμενοι δὲ κηρύσσετε λέγοντες ὅτι Ἤγγικεν ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/007.yaml
  text: And as you go[a], proclaim, saying[c][b], ‘The kingdom of heaven has drawn near.’
translation:
  language: it
  text: 'E, mentre andate, proclamate: «Il regno dei cieli si è avvicinato».[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «è vicino» o «si è fatto vicino». Il perfetto greco indica una vicinanza sopraggiunta i cui effetti perdurano.'
    reason: lexical_alternative
  - marker: b
    text: Matteo usa regolarmente l’espressione «il regno dei cieli», dove gli altri Vangeli spesso hanno «il regno di Dio».
    reason: cross_reference
lexical_decisions:
- source_word: πορευόμενοι
  choice: mentre andate
  rationale: Il participio presente esprime l’azione che accompagna il comando principale; la resa temporale è naturale in italiano e conserva l’idea del procedere.
- source_word: δὲ
  choice: E
  rationale: Congiunzione di collegamento lieve con le istruzioni precedenti, senza un marcato valore avversativo.
- source_word: κηρύσσετε
  choice: proclamate
  rationale: L’imperativo indica un annuncio pubblico e autorevole; «proclamate» evita di restringere il senso alla predicazione ecclesiastica.
- source_word: λέγοντες
  choice: introduzione del contenuto mediante i due punti
  rationale: Il participio specifica ciò che deve essere proclamato. In italiano moderno, i due punti introducono naturalmente le parole annunciate senza la ridondanza di «proclamate dicendo».
- source_word: ὅτι
  choice: discorso diretto
  rationale: La congiunzione introduce il contenuto dell’annuncio; le virgolette rendono chiaramente la citazione diretta senza aggiungere «che».
- source_word: ἤγγικεν
  choice: si è avvicinato
  rationale: Il perfetto presenta una vicinanza ormai sopraggiunta e ancora rilevante; questa resa ne conserva meglio l’aspetto rispetto al solo «è vicino».
- source_word: ἡ βασιλεία
  choice: il regno
  rationale: «Regno» è la resa italiana tradizionale e ampia, capace di includere tanto l’esercizio della sovranità quanto la sfera del governo regale.
- source_word: τῶν οὐρανῶν
  choice: dei cieli
  rationale: Conserva la formulazione caratteristica di Matteo e riflette il plurale del greco in una locuzione italiana consolidata.
theological_decisions:
- issue: Significato di «il regno dei cieli»
  choice: Conservata la formula «il regno dei cieli»
  alternative: il regno di Dio; il dominio dei cieli
  rationale: La formulazione propria di Matteo non va armonizzata con i passi paralleli né ridotta a una sola sfumatura di βασιλεία.
- issue: Valore aspettuale di ἤγγικεν
  choice: si è avvicinato
  alternative: è vicino; è giunto vicino
  rationale: La resa comunica che la vicinanza è sopraggiunta e rimane pertinente, senza definire oltre quanto il versetto affermi la natura o le fasi del regno.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. La struttura conserva il collegamento con il contesto, mentre i due punti evitano la formulazione poco idiomatica «proclamate dicendo».
