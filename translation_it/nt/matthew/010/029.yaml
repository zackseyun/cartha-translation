  source_fidelity: «Passeri» rende adeguatamente στρουθία nel contesto; «due ... per un asse» conserva il rapporto commerciale espresso da δύο στρουθία ἀσσαρίου πωλεῖται. «Cadrà a terra» riproduce naturalmente πεσεῖται ἐπὶ τὴν γῆν. «Senza il Padre vostro» segue ἄνευ τοῦ πατρὸς ὑμῶν senza trasformarne l'implicazione provvidenziale in una specifica affermazione di conoscenza, volontà o permesso.
