id: MAT.10.29
reference: Matthew 10:29
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: οὐχὶ δύο στρουθία ἀσσαρίου πωλεῖται; καὶ ἓν ἐξ αὐτῶν οὐ πεσεῖται ἐπὶ τὴν γῆν ἄνευ τοῦ πατρὸς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/029.yaml
  text: Are not two sparrows sold for an assarion? Yet not one of them will fall to the ground apart from your Father[a][b].
translation:
  language: it
  text: Non si vendono forse due passeri per un asse? Eppure nemmeno uno di loro cadrà a terra senza il Padre vostro.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L'espressione «senza il Padre vostro» può implicare che ciò non avvenga senza la sua conoscenza, la sua cura o la sua volontà; il greco non precisa quale di questi aspetti sia in primo piano.
    reason: alternative_reading
  - marker: b
    text: L'asse era una piccola moneta romana di rame, di valore molto basso.
    reason: cultural_note
lexical_decisions:
- source_word: στρουθία
  choice: passeri
  rationale: Nel contesto il termine indica naturalmente i passeri, pur potendo avere più in generale il senso di piccoli uccelli.
- source_word: ἀσσαρίου
  choice: un asse
  rationale: L'assarion era una specifica moneta romana di rame di scarsissimo valore; «asse» è il nome italiano storico della moneta, chiarito in nota.
- source_word: πωλεῖται
  choice: si vendono
  rationale: Rende in italiano corrente il presente passivo greco nel contesto commerciale.
- source_word: ἓν ἐξ αὐτῶν
  choice: uno di loro
  rationale: Resa italiana naturale dell'espressione partitiva greca.
- source_word: πεσεῖται ἐπὶ τὴν γῆν
  choice: cadrà a terra
  rationale: Rende in modo naturale il futuro greco e il moto verso terra.
- source_word: ἄνευ τοῦ πατρὸς ὑμῶν
  choice: senza il Padre vostro
  rationale: Segue da vicino il greco e conserva l'ambiguità sul tipo di rapporto implicato — conoscenza, cura o volontà — senza aggiungere una specificazione interpretativa.
- source_word: οὐχὶ ... ;
  choice: Non si vendono forse...?
  rationale: La formulazione italiana rende la domanda retorica che attende risposta affermativa.
- source_word: καὶ
  choice: Eppure nemmeno
  rationale: 'Nel contesto mette in rilievo il contrasto: benché valgano pochissimo, neppure uno cade senza il Padre.'
theological_decisions:
- issue: Senso di «senza il Padre vostro» in rapporto alla provvidenza divina
  choice: Si conserva la formulazione ampia «senza il Padre vostro».
  alternative: «senza che il Padre vostro lo sappia» oppure «senza la volontà del Padre vostro»
  rationale: Il versetto afferma il coinvolgimento provvidenziale del Padre, ma il greco non precisa se si tratti specificamente di conoscenza, cura, consenso o volontà; la traduzione evita quindi di restringere il senso.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. «Padre vostro» conserva il rilievo della costruzione greca ed evita l'ambiguità momentanea che «vostro Padre» potrebbe creare dopo «senza». Le note sono collocate entrambe alla fine perché spiegano rispettivamente la clausola conclusiva e il riferimento monetario presente nella frase.
