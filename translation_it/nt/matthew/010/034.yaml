id: MAT.10.34
reference: Matthew 10:34
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Μὴ νομίσητε ὅτι ἦλθον βαλεῖν εἰρήνην ἐπὶ τὴν γῆν· οὐκ ἦλθον βαλεῖν εἰρήνην ἀλλὰ μάχαιραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/034.yaml
  text: Do not think that I came to bring peace on the earth[a]; I did not come to bring peace[b], but a sword.
translation:
  language: it
  text: Non pensate che io sia venuto[a] a portare pace sulla terra; non sono venuto a portare pace, ma una spada.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il greco usa l’aoristo, che qui può essere reso anche con una forma equivalente a «venni»; la costruzione italiana richiede naturalmente «sia venuto» dopo «non pensate che».
    reason: lexical_alternative
  - marker: b
    text: Il greco dice letteralmente «una spada»; nel contesto l’immagine riguarda la divisione, non un elogio della violenza.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ νομίσητε
  choice: Non pensate
  rationale: Il congiuntivo aoristo con μή esprime qui una proibizione. «Non pensate» è diretto, naturale e conserva la forza dell’espressione greca.
- source_word: ἦλθον
  choice: io sia venuto / sono venuto
  rationale: Dopo «non pensate che» l’italiano richiede naturalmente il congiuntivo («sia venuto»); nella proposizione indipendente ricorre l’indicativo («sono venuto»). Entrambe le forme rendono lo stesso aoristo greco in modo idiomatico.
- source_word: βαλεῖν
  choice: a portare
  rationale: Sebbene βάλλω significhi letteralmente «gettare», con «pace» e «spada» l’italiano «portare» comunica con chiarezza lo scopo o l’effetto della venuta, senza produrre un’espressione innaturale.
- source_word: εἰρήνην
  choice: pace
  rationale: È l’equivalente italiano ordinario e preciso di εἰρήνη in questo contesto.
- source_word: ἐπὶ τὴν γῆν
  choice: sulla terra
  rationale: Rende il senso esteso di ἐπί con l’accusativo e il significato ampio di γῆ; «sulla terra» è naturale e leggermente più aderente alla forma greca di «in terra».
- source_word: ἀλλὰ
  choice: ma
  rationale: Esprime in modo semplice e netto il forte contrasto della congiunzione greca.
- source_word: μάχαιραν
  choice: una spada
  rationale: Conserva l’immagine concreta del testo greco. «Spada» è la resa italiana consueta di μάχαιρα e non anticipa interpretativamente il riferimento alla divisione sviluppato nel contesto seguente.
theological_decisions:
- issue: Se attenuare «una spada» sostituendolo con una parafrasi come «divisione»
  choice: Conservare «una spada» nel testo principale
  alternative: divisione
  rationale: Il greco usa esplicitamente μάχαιραν, «una spada». Il contesto successivo ne mostra l’effetto divisivo, ma sostituire l’immagine con la sua interpretazione eliminerebbe la tensione intenzionale del detto.
translation_notes:
  register: Italiano moderno standard, chiaro e dignitoso. La ripetizione di «portare pace» è mantenuta per rispecchiare l’enfasi e il parallelismo del greco; l’immagine della spada resta volutamente concreta.
