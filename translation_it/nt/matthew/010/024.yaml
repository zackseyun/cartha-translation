id: MAT.10.24
reference: Matthew 10:24
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Οὐκ ἔστιν μαθητὴς ὑπὲρ τὸν διδάσκαλον οὐδὲ δοῦλος ὑπὲρ τὸν κύριον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/024.yaml
  text: A disciple is not above the teacher[b][a], nor a slave above his master.
translation:
  language: it
  text: Un discepolo non è al di sopra del maestro, né uno schiavo[a] al di sopra del suo padrone[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «servo»; il termine greco δοῦλος può indicare uno schiavo o un servo, secondo il contesto.
    reason: alternative_reading
  - marker: b
    text: O «signore»; qui κύριος indica il padrone umano nell’analogia.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθητής
  choice: discepolo
  rationale: «Discepolo» conserva il senso relazionale di chi apprende seguendo un maestro, particolarmente adatto al contesto del Vangelo.
- source_word: ὑπέρ
  choice: al di sopra di
  rationale: Con l’accusativo indica qui superiorità di posizione o rango; «al di sopra di» rende naturalmente il paragone senza specificarne oltre la natura.
- source_word: διδάσκαλος
  choice: maestro
  rationale: È il significato ordinario del termine e mantiene distinta questa figura dal «padrone» della seconda coppia.
- source_word: δοῦλος
  choice: schiavo
  rationale: Nel parallelismo con κύριος è in primo piano la subordinazione sociale e giuridica; «schiavo» ne conserva la forza meglio di «servo».
- source_word: κύριος
  choice: padrone
  rationale: In questa analogia sociale indica il padrone dello schiavo, non costituisce un titolo divino; «padrone» esprime chiaramente il rapporto evocato.
- source_word: αὐτοῦ
  choice: suo
  rationale: Il possessivo rinvia allo schiavo e indica il padrone che gli è proprio.
- source_word: οὐδέ
  choice: né
  rationale: Collega in modo conciso e naturale la seconda proposizione negativa alla prima.
theological_decisions:
- issue: Resa di δοῦλος nell’analogia sociale
  choice: schiavo
  alternative: servo
  rationale: La coppia δοῦλος/κύριος richiama un rapporto di subordinazione e appartenenza; la nota conserva l’alternativa lessicale senza attenuare il testo principale.
- issue: Resa di κύριος in un contesto umano
  choice: padrone
  alternative: signore
  rationale: Qui il referente è il superiore umano dello schiavo nell’analogia. «Padrone» evita di introdurre impropriamente un titolo divino, mentre la nota segnala l’ampiezza semantica del greco.
translation_notes:
  register: Italiano standard moderno, piano e dignitoso. La struttura parallela del greco è mantenuta; l’articolo davanti a «maestro» e il possessivo davanti a «padrone» rendono naturale la formulazione italiana.
