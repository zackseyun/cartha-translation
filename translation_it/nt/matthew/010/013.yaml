id: MAT.10.13
reference: Matthew 10:13
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: καὶ ἐὰν μὲν ᾖ ἡ οἰκία ἀξία, ἐλθάτω ἡ εἰρήνη ὑμῶν ἐπ’ αὐτήν· ἐὰν δὲ μὴ ᾖ ἀξία, ἡ εἰρήνη ὑμῶν ⸀πρὸς ὑμᾶς ἐπιστραφήτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/013.yaml
  text: And if the house is worthy[a], let your peace come upon it; but if it is not worthy[c][b], let your peace return to you.
translation:
  language: it
  text: E se la casa è degna[a], la vostra pace venga su di essa; ma se non è degna[b], la vostra pace ritorni a voi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Casa» può indicare anche la famiglia o le persone che vi abitano.
    reason: lexical_alternative
  - marker: b
    text: Qui «degna» significa idonea ad accogliere i messaggeri e la loro pace, non moralmente senza peccato.
    reason: cultural_note
  - marker: c
    text: O «torni indietro a voi».
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκία
  choice: casa
  rationale: È l’equivalente più diretto e naturale; nel contesto può comprendere anche la famiglia che vi abita, senza restringere il referente al solo edificio.
- source_word: ἀξία
  choice: degna
  rationale: Conserva il valore valutativo di ἀξία e il parallelismo della frase, senza interpretarlo più strettamente come «ricettiva».
- source_word: ἐλθάτω
  choice: venga
  rationale: Rende in modo naturale l’imperativo aoristo e mantiene l’immagine della pace che giunge sulla casa.
- source_word: εἰρήνη
  choice: pace
  rationale: È l’equivalente normale e conserva il senso più ampio di benessere e benedizione evocato nel contesto missionario.
- source_word: ἐπ’ αὐτήν
  choice: su di essa
  rationale: Riflette il movimento espresso da ἐπί con l’accusativo e riprende esplicitamente la casa.
- source_word: πρὸς ὑμᾶς
  choice: a voi
  rationale: Mantiene il valore direzionale della preposizione; l’idea del ritorno è già espressa dal verbo.
- source_word: ἐπιστραφήτω
  choice: ritorni
  rationale: Rende idiomaticamente l’imperativo e preserva l’immagine della pace che, non rimanendo sulla casa, torna ai discepoli.
- source_word: μὲν ... δὲ
  choice: se ...; ma se ...
  rationale: Riproduce con naturalezza in italiano la struttura contrastiva greca.
theological_decisions:
- issue: Natura della «vostra pace»
  choice: Si conserva «la vostra pace» come benedizione di pace pronunciata dai discepoli, capace figurativamente di venire sulla casa o di tornare a loro.
  alternative: «Il vostro saluto di pace» oppure «la pace che pronunciate».
  rationale: Il testo presenta la pace in modo concreto, senza chiarire se si tratti soltanto di un saluto o di una realtà impartita; la formulazione mantiene questa tensione senza sistematizzarla.
- issue: Senso di «degna»
  choice: Il termine resta valutativo e viene chiarito in nota come idoneità ad accogliere i messaggeri e la loro pace.
  alternative: Tradurre direttamente «disposta ad accogliervi» o «ricettiva».
  rationale: Le alternative renderebbero esplicita un’interpretazione contestuale più ristretta del termine greco.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. La sintassi conserva il parallelismo e l’immagine concreta della pace. «Su di essa» è leggermente formale, ma chiaro e aderente al movimento del greco.
