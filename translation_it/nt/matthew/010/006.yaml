  text: πορεύεσθε δὲ μᾶλλον πρὸς τὰ πρόβατα τὰ ἀπολωλότα οἴκου Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/006.yaml
  text: but go instead to the lost sheep of the house of Israel[a].
translation:
  language: it
  text: Ma andate piuttosto alle pecore perdute della casa d’Israele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πορεύεσθε
  choice: andate
  rationale: Imperativo presente plurale; «andate» è il comando più naturale in italiano e si accorda con il contesto dell’invio.
- source_word: δὲ μᾶλλον
  choice: ma ... piuttosto
  rationale: La combinazione esprime contrasto e reindirizzamento rispetto ai divieti precedenti; «ma ... piuttosto» conserva entrambe le sfumature con naturalezza.
- source_word: πρὸς
  choice: alle
  rationale: Con un verbo di moto indica la direzione verso i destinatari; in italiano «andare alle pecore» rende naturalmente la costruzione.
- source_word: τὰ πρόβατα
  choice: le pecore
  rationale: Conserva l’immagine pastorale esplicita del greco senza sostituirla con una parafrasi.
- source_word: τὰ ἀπολωλότα
  choice: perdute
  rationale: Il participio perfetto di ἀπόλλυμι, usato attributivamente nella metafora pastorale, indica pecore che si trovano in una condizione di smarrimento; «perdute» è dignitoso e tradizionalmente intelligibile.
- source_word: οἴκου Ἰσραήλ
  choice: della casa d’Israele
  rationale: Mantiene la costruzione corporativa e la risonanza biblica dell’espressione, senza ridurla alla parafrasi «popolo d’Israele».
theological_decisions:
- issue: Descrizione metaforica d’Israele
  choice: Conservare «le pecore perdute della casa d’Israele»
  alternative: gli Israeliti che si sono smarriti
  rationale: La metafora è esplicita nel greco e richiama l’immaginario pastorale delle Scritture; mantenerla evita di trasformare l’immagine in interpretazione.
- issue: Ambiguità del rapporto genitivale
  choice: 'Testo principale: le pecore perdute appartenenti alla casa d’Israele'
  alternative: le pecore che sono andate perdute dalla casa d’Israele
  rationale: Il greco può essere inteso come appartenenza alla casa d’Israele oppure, meno direttamente, come separazione da essa. Il testo principale segue la lettura sintatticamente più immediata, mentre la nota conserva l’alternativa genuina.
translation_notes:
  register: Italiano moderno standard, naturale e dignitoso. La formulazione conserva il contrasto del contesto, la metafora pastorale e l’espressione biblica «casa d’Israele». Il marker [a] è presente nel testo principale.
