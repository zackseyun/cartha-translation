  text: ὑμῶν δὲ καὶ αἱ τρίχες τῆς κεφαλῆς πᾶσαι ἠριθμημέναι εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/030.yaml
  text: But even the hairs of your head are all numbered[a].
translation:
  language: it
  text: Ma perfino i capelli del vostro capo sono tutti contati[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oppure «sono stati contati». Il perfetto passivo greco può sottolineare un'azione compiuta i cui effetti perdurano.
    reason: Alternativa aspettuale e lessicale per ἠριθμημέναι εἰσίν.
lexical_decisions:
- source_word: ὑμῶν
  choice: vostro
  rationale: Il genitivo plurale di seconda persona esprime possesso; «vostro» lo rende in italiano corrente e concorda con «capo».
- source_word: δὲ
  choice: Ma
  rationale: Segnala una lieve svolta contrastiva rispetto al contesto precedente, senza introdurre un'opposizione forte.
- source_word: καὶ
  choice: perfino
  rationale: 'Qui ha valore enfatico: estende l''affermazione persino ai singoli capelli.'
- source_word: αἱ τρίχες τῆς κεφαλῆς
  choice: i capelli del vostro capo
  rationale: Rende l'immagine concreta e la relazione genitivale in modo dignitoso e comprensibile; «capo» conserva il registro biblico senza risultare oscuro.
- source_word: πᾶσαι
  choice: tutti
  rationale: Conserva l'enfasi sulla totalità dei capelli, concordando naturalmente con il sostantivo italiano.
- source_word: ἠριθμημέναι εἰσίν
  choice: sono tutti contati
  rationale: La perifrasi perfetta passiva descrive uno stato presente risultante da un'azione compiuta; «sono contati» è naturale e mantiene il valore stativo, mentre la posizione di «tutti» rende chiaramente πᾶσαι.
theological_decisions:
- issue: Portata della conoscenza e della cura divina implicita nell'affermazione
  choice: Conservare l'immagine concreta dei capelli tutti contati, senza aggiungere una spiegazione dottrinale.
  alternative: Esplicitare nella traduzione la cura, la provvidenza o il controllo di Dio.
  rationale: Il testo afferma la completa numerazione dei capelli; la conoscenza e la cura divine emergono dal contesto e non devono essere inserite mediante parafrasi.
translation_notes:
  register: Italiano moderno, naturale e dignitoso. «Perfino» comunica con chiarezza l'enfasi di καὶ; «capo» mantiene una lieve solennità appropriata senza compromettere la comprensione.
