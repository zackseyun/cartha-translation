  text: εἰσερχόμενοι δὲ εἰς τὴν οἰκίαν ἀσπάσασθε αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/012.yaml
  text: As you enter the house[a], greet it.
translation:
  language: it
  text: Quando entrate nella casa[a], salutatela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «salutate gli abitanti». Il greco dice letteralmente «salutatela», riferendosi alla casa, probabilmente in modo metonimico a chi vi abita.'
    reason: alternativa lessicale e chiarimento della metonimia
lexical_decisions:
- source_word: εἰσερχόμενοι
  choice: Quando entrate
  rationale: Il participio presente nominativo plurale ha valore avverbiale e accompagna l’imperativo; una proposizione temporale rende in italiano corrente il rapporto tra l’ingresso e il saluto.
- source_word: δὲ
  choice: non reso separatamente
  rationale: δέ è un connettivo debole; qui il collegamento con il contesto è già espresso naturalmente dalla proposizione temporale, senza bisogno di introdurre un contrasto.
- source_word: οἰκίαν
  choice: nella casa
  rationale: οἰκία può indicare sia l’edificio sia le persone che vi abitano. Il riferimento all’entrare favorisce il senso concreto «casa», lasciando possibile l’uso metonimico.
- source_word: ἀσπάσασθε
  choice: salutatela
  rationale: L’imperativo aoristo medio, seconda persona plurale, impartisce un’istruzione diretta. «Salutare» è l’equivalente italiano moderno più chiaro e naturale.
- source_word: αὐτήν
  choice: -la
  rationale: Il pronome femminile singolare concorda con οἰκίαν. Il pronome enclitico in «salutatela» conserva il riferimento grammaticale alla casa senza esplicitare nel testo principale gli abitanti.
theological_decisions:
- issue: Riferimento metonimico alla casa oppure esplicito ai suoi abitanti
  choice: Conservare nel testo principale «salutatela», riferito alla casa
  alternative: «salutate la famiglia» oppure «salutate quelli che vi abitano»
  rationale: Il greco usa esplicitamente un pronome femminile singolare riferito a οἰκίαν. Mantenere questa formulazione tutela l’immagine e la lieve ambiguità dell’originale; la probabile allusione agli abitanti viene chiarita in nota senza trasformarla in interpretazione obbligatoria.
translation_notes:
  register: Italiano standard moderno, semplice e dignitoso. La costruzione «Quando entrate» è più naturale di un participio iniziale e mantiene il valore temporale; «salutatela» conserva deliberatamente il singolare femminile del greco.
