id: MAT.10.38
reference: Matthew 10:38
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: καὶ ὃς οὐ λαμβάνει τὸν σταυρὸν αὐτοῦ καὶ ἀκολουθεῖ ὀπίσω μου, οὐκ ἔστιν μου ἄξιος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/038.yaml
  text: And whoever does not take up his cross and follow after me is not worthy of me[a][b].
translation:
  language: it
  text: E chi non prende la propria croce e non viene dietro a me non è degno di me.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «non mi segue». Il greco dice più esplicitamente «non viene dietro a me».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: chi
  rationale: In italiano moderno «chi» rende naturalmente il relativo indefinito e generico, mantenendo il valore generale della dichiarazione.
- source_word: λαμβάνει
  choice: prende
  rationale: Con «la propria croce», «prende» esprime in modo diretto l’assunzione della croce; l’italiano non richiede necessariamente un’espansione come «prende su di sé».
- source_word: τὸν σταυρὸν αὐτοῦ
  choice: la propria croce
  rationale: «La propria» conserva il riferimento distributivo a ciascuna persona e suona più naturale del generico maschile «la sua» senza cambiare il numero singolare della costruzione greca.
- source_word: ἀκολουθεῖ ὀπίσω μου
  choice: viene dietro a me
  rationale: La formulazione conserva esplicitamente ὀπίσω, cioè la posizione del discepolo dietro a Gesù, ed è idiomatica nel contesto della sequela.
- source_word: οὐκ ἔστιν μου ἄξιος
  choice: non è degno di me
  rationale: Resa formale e naturale del costrutto con ἄξιος e genitivo, che preserva il tono solenne e relazionale.
theological_decisions:
- issue: L’immagine della croce nella sequela
  choice: Conservare l’immagine concreta «prende la propria croce»
  alternative: Parafrasare come «accetta la sofferenza» o «rinuncia a sé stesso»
  rationale: Il testo richiama concretamente lo strumento romano di esecuzione e, mediante tale immagine, il costo, la vergogna e il pericolo della sequela. Una parafrasi astratta ne ridurrebbe la forza e ne delimiterebbe indebitamente il senso.
- issue: Il rapporto tra ἀκολουθεῖ e ὀπίσω μου
  choice: Rendere «viene dietro a me»
  alternative: Rendere semplicemente «mi segue»
  rationale: La scelta mantiene il valore esplicito di ὀπίσω e l’immagine del discepolo che cammina dietro al maestro, senza trasformarla in una spiegazione dottrinale.
translation_notes:
  register: Italiano standard moderno, conciso e solenne. La coordinazione negativa è resa con «e non» davanti a entrambi i verbi per rendere inequivocabile che la negazione greca investe sia il prendere la croce sia il seguire Gesù. «La propria croce» comunica in italiano il valore generico e distributivo del maschile singolare greco senza una nota separata.
