  source_fidelity: 'La resa conserva accuratamente i rapporti sintattici e semantici del greco: futuro passivo («sarete condotti»), comparizione davanti ad autorità («davanti a governatori e re»), causa personale («a causa mia») e funzione testimoniale («come testimonianza»). «Per loro» mantiene prudentemente il dativo αὐτοῖς senza imporre il valore avversativo, mentre «le genti» conserva l''ampiezza di τοῖς ἔθνεσιν, chiarita dalla nota.'
