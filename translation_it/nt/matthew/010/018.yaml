id: MAT.10.18
reference: Matthew 10:18
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: καὶ ἐπὶ ἡγεμόνας δὲ καὶ βασιλεῖς ἀχθήσεσθε ἕνεκεν ἐμοῦ εἰς μαρτύριον αὐτοῖς καὶ τοῖς ἔθνεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/018.yaml
  text: And you will be brought before governors and kings because of me[b][a], as a testimony to them and to the Gentiles.
translation:
  language: it
  text: E sarete condotti davanti a governatori e re a causa mia, come testimonianza per loro[b] e per le genti[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «per le nazioni»; nel contesto può riferirsi ai non ebrei.
    reason: lexical_alternative
  - marker: b
    text: Nel contesto, «per loro» può anche essere inteso come «contro di loro», ma il dativo greco non lo specifica.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπὶ ἡγεμόνας ... καὶ βασιλεῖς
  choice: davanti a governatori e re
  rationale: Con ἐπί e l'accusativo dopo un verbo di conduzione, l'espressione indica la comparizione davanti alle autorità. «Governatori» e «re» sono equivalenti naturali e precisi.
- source_word: ἀχθήσεσθε
  choice: sarete condotti
  rationale: Il futuro passivo di ἄγω esprime l'essere portati o condotti. «Sarete condotti» si adatta al contesto giudiziario senza introdurre una violenza non esplicita.
- source_word: ἕνεκεν ἐμοῦ
  choice: a causa mia
  rationale: ἕνεκεν con il genitivo indica causa o motivo. La resa è chiara, moderna e conserva il riferimento personale a Gesù.
- source_word: εἰς μαρτύριον
  choice: come testimonianza
  rationale: La frase indica che la comparizione dei discepoli avrà funzione di testimonianza, preservando la forma nominale del greco.
- source_word: αὐτοῖς
  choice: per loro
  rationale: Il pronome dativo rimanda con maggiore naturalezza ai governatori e ai re. «Per loro» mantiene un senso neutro senza trasformare esplicitamente la testimonianza in accusa.
- source_word: τοῖς ἔθνεσιν
  choice: per le genti
  rationale: Nel contesto matteano ἔθνη può designare i non ebrei, ma conserva anche il valore letterale di popoli o nazioni. «Le genti» mantiene entrambe le risonanze, con una nota esplicativa.
theological_decisions:
- issue: Valore di μαρτύριον αὐτοῖς
  choice: «testimonianza per loro», in senso neutro
  alternative: «testimonianza contro di loro»
  rationale: 'Il dativo αὐτοῖς non esprime da solo un valore avversativo. La resa neutra conserva la tensione: la testimonianza può essere ricevuta oppure diventare, nel contesto, testimonianza contro chi la rifiuta.'
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. La costruzione conserva il parallelismo del greco e non accentua oltre il testo né la coercizione del condurre né il carattere accusatorio della testimonianza.
