id: MAT.10.11
reference: Matthew 10:11
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: εἰς ἣν δ’ ἂν πόλιν ἢ κώμην εἰσέλθητε, ἐξετάσατε τίς ἐν αὐτῇ ἄξιός ἐστιν· κἀκεῖ μείνατε ἕως ἂν ἐξέλθητε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/011.yaml
  text: Into whatever city or village you enter[a], find out who in it is worthy[b], and stay there until you leave.
translation:
  language: it
  text: In qualunque città o villaggio entriate, informatevi[a] su chi, in quel luogo, sia degno[b], e rimanete lì finché non ve ne andiate.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «cercate con cura» oppure «indagate».
    reason: lexical_alternative
  - marker: b
    text: Qui «degno» indica probabilmente una persona adatta o disposta ad accogliere i messaggeri, non qualcuno che abbia meritato il favore di Dio.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν δ’ ἂν πόλιν ἢ κώμην
  choice: In qualunque città o villaggio
  rationale: «In qualunque» rende in italiano naturale la costruzione relativa indefinita con εἰς e ἄν; «città o villaggio» conserva la distinzione fra πόλις e κώμη.
- source_word: εἰσέλθητε
  choice: entriate
  rationale: Il congiuntivo presente italiano si adatta alla relativa indefinita e rende con naturalezza l’aoristo congiuntivo greco in questa istruzione generale.
- source_word: ἐξετάσατε
  choice: informatevi
  rationale: Il verbo indica un’indagine intenzionale e accurata. «Informatevi» è corrente e chiaro, senza suggerire necessariamente un’inchiesta formale.
- source_word: τίς ἐν αὐτῇ ἄξιός ἐστιν
  choice: chi, in quel luogo, sia degno
  rationale: La formulazione mantiene sia il riferimento alla località sia il valore valutativo, volutamente non del tutto specificato, di ἄξιος.
- source_word: κἀκεῖ μείνατε
  choice: e rimanete lì
  rationale: «Lì» conserva il valore avverbiale di κἀκεῖ senza trasformarlo esplicitamente in «presso di lui» o «in casa sua», precisazioni suggerite dal contesto ma non espresse nel greco.
- source_word: ἕως ἂν ἐξέλθητε
  choice: finché non ve ne andiate
  rationale: La locuzione italiana rende il limite temporale futuro espresso da ἕως ἄν con il congiuntivo e comunica naturalmente l’idea di lasciare il luogo.
theological_decisions:
- issue: Senso di «degno» nelle istruzioni missionarie
  choice: Conservare «degno» nel testo, chiarendone in nota il probabile senso contestuale di persona adatta o disposta ad accogliere i messaggeri.
  alternative: Tradurre direttamente «adatto» o «disposto ad accogliervi».
  rationale: ἄξιος mantiene una sfumatura valutativa che una parafrasi eliminerebbe. Il contesto riguarda l’accoglienza dei discepoli, ma il testo non esplicita il criterio in modo sufficiente da giustificare una risoluzione completa dell’ambiguità.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. La sintassi resta vicina al greco senza risultare artificiosa; «degno» conserva la tensione semantica dell’originale, mentre la nota evita una lettura meritocratica non richiesta dal contesto.
