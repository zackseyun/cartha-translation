source:
  edition: SBLGNT
  text: ὅταν δὲ ⸀παραδῶσιν ὑμᾶς, μὴ μεριμνήσητε πῶς ἢ τί λαλήσητε· δοθήσεται γὰρ ὑμῖν ἐν ἐκείνῃ τῇ ὥρᾳ τί ⸀λαλήσητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/019.yaml
  text: But when they hand you over[a], do not worry about how or what you should speak[b], for what you should speak will be given to you in that hour.
translation:
  language: it
  text: Ma quando vi consegneranno[a], non preoccupatevi di come parlare o di che cosa dire; infatti, in quel momento vi sarà dato che cosa dire.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «vi daranno in mano».
    reason: lexical_alternative
  - marker: b
    text: Il passivo «vi sarà dato» lascia qui implicito chi dà; il versetto seguente identifica lo Spirito come colui che parla attraverso di voi.
    reason: cross_reference
lexical_decisions:
- source_word: ὅταν δὲ
  choice: Ma, quando
  rationale: ὅταν introduce una circostanza futura eventuale, mentre δέ segna una lieve transizione avversativa rispetto all'avvertimento precedente.
- source_word: παραδῶσιν
  choice: vi consegneranno
  rationale: Il verbo indica l'atto di consegnare qualcuno alle autorità o in potere altrui. «Consegnare» mantiene il senso giudiziario ostile senza specificare impropriamente un tradimento.
- source_word: μὴ μεριμνήσητε
  choice: non preoccupatevi
  rationale: Nel contesto, μεριμνάω indica l'affanno anticipato per la testimonianza da rendere; la formulazione italiana è naturale e corrente.
- source_word: πῶς ἢ τί λαλήσητε
  choice: di come parlare o di che cosa dire
  rationale: La resa distingue il modo dal contenuto del discorso e conserva il valore disgiuntivo di ἤ. L'alternanza italiana «parlare/dire» evita una costruzione innaturale senza alterare il senso.
- source_word: δοθήσεται
  choice: vi sarà dato
  rationale: Il futuro passivo viene mantenuto, lasciando implicito chi dà, come nel greco.
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: in quel momento
  rationale: Esprime in italiano moderno l'immediatezza temporale dell'idioma greco, senza l'effetto più marcato e biblicizzante di «in quell'ora».
- source_word: τί λαλήσητε
  choice: ciò che dovrete dire
  rationale: Rende in modo idiomatico il contenuto del discorso che sarà fornito nel momento necessario; «dovrete» esprime la situazione futura prevista, non un obbligo aggiunto.
theological_decisions:
- issue: Passivo divino implicito in δοθήσεται
  choice: Conservare «vi sarà dato» senza nominare chi dà.
  alternative: «Dio vi darà» oppure «lo Spirito vi darà».
  rationale: Il versetto lascia l'agente inespresso; il versetto seguente identifica lo Spirito come colui che parla attraverso i discepoli. Esplicitarlo qui anticiperebbe tale chiarimento.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. La sintassi segue da vicino il movimento del greco, mentre «di come parlare o di che cosa dire» e «in quel momento» assicurano naturalezza idiomatica.
