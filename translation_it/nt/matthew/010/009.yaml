id: MAT.10.9
reference: Matthew 10:9
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: μὴ κτήσησθε χρυσὸν μηδὲ ἄργυρον μηδὲ χαλκὸν εἰς τὰς ζώνας ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/009.yaml
  text: Do not acquire gold or silver or copper for your belts[b][a],
translation:
  language: it
  text: Non procuratevi né oro, né argento, né rame[a] da mettere nelle vostre cinture[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «bronzo».
    reason: lexical_alternative
  - marker: b
    text: Le cinture potevano servire per portare denaro, oppure avere una borsa fissata alla vita.
    reason: cultural_note
lexical_decisions:
- source_word: μὴ κτήσησθε
  choice: Non procuratevi
  rationale: κτάομαι indica propriamente il procurarsi o acquisire qualcosa. Il medio e il contesto missionario favoriscono «procuratevi» rispetto al semplice «portate», senza escludere che il denaro potesse già essere in possesso dei discepoli.
- source_word: χρυσὸν
  choice: oro
  rationale: Resa diretta del materiale, qui usato nel contesto del denaro.
- source_word: ἄργυρον
  choice: argento
  rationale: Resa diretta del materiale, qui riferito al denaro d'argento.
- source_word: χαλκὸν
  choice: rame
  rationale: χαλκός può significare rame o bronzo; «rame» è naturale in una sequenza di metalli usati come denaro e richiama le monete di minor valore.
- source_word: εἰς τὰς ζώνας ὑμῶν
  choice: da mettere nelle vostre cinture
  rationale: 'La costruzione εἰς con ζώνη indica la destinazione del denaro: le cinture servivano anche per custodirlo. La formulazione italiana esplicita il rapporto senza trasformare «cinture» in «borse» nel testo principale.'
theological_decisions: []
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. La triplice correlazione negativa del greco è resa con «né... né... né». «Non procuratevi» conserva l'idea di acquisizione, evitando la resa più interpretativa «non portate».
