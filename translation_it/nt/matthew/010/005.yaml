id: MAT.10.5
reference: Matthew 10:5
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Τούτους τοὺς δώδεκα ἀπέστειλεν ὁ Ἰησοῦς παραγγείλας αὐτοῖς λέγων· Εἰς ὁδὸν ἐθνῶν μὴ ἀπέλθητε καὶ εἰς πόλιν Σαμαριτῶν μὴ εἰσέλθητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/005.yaml
  text: Jesus sent out these twelve, instructing them, saying, “Do not go on the road to the Gentiles, and do not enter a town of the Samaritans.”
translation:
  language: it
  text: 'Gesù mandò questi dodici, dando loro queste istruzioni: «Non incamminatevi verso i non Giudei[a] e non entrate in una città dei Samaritani[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Più letteralmente: «non andate su una via dei non Giudei». L''espressione greca usa il linguaggio della strada o del cammino e probabilmente indica il dirigersi verso il loro territorio.'
    reason: lexical_alternative
  - marker: b
    text: 'Oppure: «in una città samaritana».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τούτους τοὺς δώδεκα
  choice: questi dodici
  rationale: Riproduce il dimostrativo e il numerale senza aggiungere «discepoli», termine implicito nel contesto ma assente nel greco.
- source_word: ἀπέστειλεν
  choice: mandò
  rationale: Esprime in italiano corrente l'invio per una missione; il contesto rende chiaro lo scopo senza dover esplicitare «incaricò».
- source_word: παραγγείλας αὐτοῖς λέγων
  choice: dando loro queste istruzioni
  rationale: Rende in modo naturale i due participi greci e conserva il carattere autorevole e direttivo delle parole che seguono, evitando la ridondanza poco idiomatica «ordinando loro, dicendo».
- source_word: Εἰς ὁδὸν ἐθνῶν μὴ ἀπέλθητε
  choice: Non incamminatevi verso i non Giudei
  rationale: «Incamminatevi» conserva l'immagine della via, mentre «verso i non Giudei» comunica il probabile senso direzionale dell'espressione. «Non Giudei» chiarisce il referente contestuale di ἔθνη senza la possibile connotazione spregiativa moderna di «pagani».
- source_word: εἰς πόλιν Σαμαριτῶν μὴ εἰσέλθητε
  choice: non entrate in una città dei Samaritani
  rationale: Segue da vicino la costruzione greca. «Città» è il normale equivalente italiano di πόλις e non specifica indebitamente le dimensioni dell'abitato.
theological_decisions:
- issue: Portata e durata del divieto riguardante i non Giudei e i Samaritani
  choice: Presentare le parole come istruzioni rivolte ai dodici in questa specifica missione, senza aggiungere qualificazioni temporali.
  alternative: Formulare il divieto come esclusione assoluta o permanente dei non Giudei e dei Samaritani.
  rationale: Il versetto esprime un divieto netto nel contesto narrativo di questo invio, ma non ne definisce qui la durata o la portata oltre tale circostanza. La traduzione conserva quindi la forza dell'ordine senza risolvere la questione mediante aggiunte interpretative.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. La sintassi è resa scorrevole senza aggiungere «discepoli» né attenuare i due divieti. Le virgolette caporali seguono l'uso editoriale italiano.
