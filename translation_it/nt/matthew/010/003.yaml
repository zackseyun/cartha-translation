lexical_decisions:
- source_word: Φίλιππος
  choice: Filippo
  rationale: Forma italiana tradizionale e corrente del nome personale greco.
- source_word: Βαρθολομαῖος
  choice: Bartolomeo
  rationale: Forma italiana convenzionale del nome personale.
- source_word: Θωμᾶς
  choice: Tommaso
  rationale: Forma italiana convenzionale del nome personale.
- source_word: Μαθθαῖος
  choice: Matteo
  rationale: Forma italiana convenzionale del nome personale.
- source_word: ὁ τελώνης
  choice: l’esattore delle imposte
  rationale: Rende in italiano moderno il mestiere di chi riscuoteva imposte o tributi; è più preciso e dignitoso del tradizionale ma oggi opaco «pubblicano».
- source_word: Ἰάκωβος
  choice: Giacomo
  rationale: Forma italiana convenzionale del nome nel Nuovo Testamento, riconoscibile negli elenchi apostolici.
- source_word: ὁ τοῦ Ἁλφαίου
  choice: figlio di Alfeo
  rationale: Il genitivo identifica Giacomo mediante la paternità; esplicitarla è naturale e chiaro in italiano.
- source_word: Ἁλφαίου
  choice: Alfeo
  rationale: Forma italiana tradizionale del nome personale greco.
- source_word: Θαδδαῖος
  choice: Taddeo
  rationale: Traduce direttamente la lezione del testo SBLGNT con la forma italiana convenzionale.
- source_word: καὶ
  choice: e
  rationale: Mantiene la coordinazione semplice e ripetuta dell’elenco greco.
theological_decisions:
- issue: Identificazione dell’ultimo apostolo nell’elenco
  choice: Taddeo
  alternative: Lebbeo; Giuda, figlio di Giacomo
  rationale: Il testo greco fornito legge Θαδδαῖος. Le varianti manoscritte e la diversa designazione negli elenchi di Luca sono segnalate in nota senza armonizzare il testo principale.
translation_notes:
  register: Italiano moderno, chiaro e dignitoso. Si conservano la struttura paratattica dell’elenco e i nomi nella loro forma italiana convenzionale. Le virgole attorno alle apposizioni migliorano la leggibilità senza alterare il senso.
