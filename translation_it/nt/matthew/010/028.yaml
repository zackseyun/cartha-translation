id: MAT.10.28
reference: Matthew 10:28
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: καὶ μὴ ⸀φοβεῖσθε ἀπὸ τῶν ἀποκτεννόντων τὸ σῶμα τὴν δὲ ψυχὴν μὴ δυναμένων ἀποκτεῖναι· ⸁φοβεῖσθε δὲ μᾶλλον τὸν δυνάμενον ⸀καὶ ψυχὴν ⸁καὶ σῶμα ἀπολέσαι ἐν γεέννῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/028.yaml
  text: And do not fear those who kill the body but are not able to kill the soul. Rather[a], fear the one who is able to destroy both soul and body in Gehenna.
translation:
  language: it
  text: E non abbiate paura di quelli che uccidono il corpo, ma non possono uccidere l'anima; temete piuttosto colui che può distruggere sia l'anima sia il corpo nella Geenna.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: «nell''inferno». Il termine greco «Geenna» deriva dalla valle di Innom ed è usato per indicare il luogo del giudizio finale.'
    reason: Alternativa lessicale e chiarimento storico-culturale.
lexical_decisions:
- source_word: φοβεῖσθε
  choice: non abbiate paura / temete
  rationale: 'La ripetizione antitetica del verbo greco è resa con due espressioni italiane della stessa area semantica: «avere paura» è naturale nella proibizione, mentre «temere» conserva la forza solenne dell''esortazione.'
- source_word: ἀπὸ τῶν ἀποκτεννόντων
  choice: di quelli che uccidono
  rationale: Il participio presente sostantivato indica in modo generale coloro che uccidono; questa formulazione è naturale nell'italiano moderno.
- source_word: σῶμα
  choice: corpo
  rationale: È l'equivalente italiano diretto e ordinario, mantenuto in entrambe le occorrenze.
- source_word: ψυχήν
  choice: anima
  rationale: Nel contrasto esplicito con il corpo, «anima» conserva la distinzione formulata nel testo; «vita», possibile altrove, qui la attenuerebbe.
- source_word: μὴ δυναμένων ἀποκτεῖναι
  choice: non possono uccidere
  rationale: Rende chiaramente e naturalmente l'incapacità espressa dalla costruzione greca.
- source_word: μᾶλλον
  choice: piuttosto
  rationale: Segnala la correzione contrastiva — non temere gli uni, ma piuttosto l'altro — conservando il valore comparativo contestuale.
- source_word: τὸν δυνάμενον
  choice: colui che può
  rationale: Rende il participio sostantivato senza identificare esplicitamente il referente, che il greco lascia innominato.
- source_word: ἀπολέσαι
  choice: distruggere
  rationale: Conserva la gravità del giudizio espresso da ἀπόλλυμι senza precisarne oltre il testo la natura metafisica.
- source_word: ἐν γεέννῃ
  choice: nella Geenna
  rationale: La traslitterazione preserva lo specifico termine greco e il suo sfondo giudaico; l'equivalente tradizionale è spiegato in nota.
theological_decisions:
- issue: Identità di «colui che può distruggere sia l'anima sia il corpo nella Geenna»
  choice: Il referente resta espresso come «colui», senza identificarlo nel testo principale.
  alternative: Dio; Satana
  rationale: Il contesto porta più naturalmente a intendere Dio, che esercita l'autorità del giudizio finale, ma l'espressione greca non nomina il referente. La traduzione conserva questa apertura formale.
- issue: Resa di γέεννα
  choice: Geenna
  alternative: inferno
  rationale: «Geenna» mantiene il termine specifico del testo greco e il suo retroterra storico-religioso; «inferno» è fornito in nota come equivalente tradizionale.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. La simmetria «uccidono il corpo / uccidere l'anima» e «anima e corpo» è preservata; il referente di «colui» non viene esplicitato oltre il greco.
