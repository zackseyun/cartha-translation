  source_fidelity: La resa conserva accuratamente l’antitesi di φοβεῖσθε, il contrasto corpo/anima, l’incapacità umana di uccidere l’anima e la capacità attribuita a «colui» di distruggere anima e corpo. «Colui che può» mantiene correttamente non identificato il referente del participio sostantivato τὸν δυνάμενον. «Nella Geenna» riproduce ἐν γεέννῃ senza sostituirlo con un termine interpretativo.
  naturalness: L’italiano è moderno, chiaro e di registro dignitoso. «Non abbiate paura di quelli che…; temete piuttosto colui che…» è una costruzione scorrevole e conserva adeguatamente il contrasto esortativo, pur variando in modo naturale l’espressione italiana del verbo ripetuto.
  terminology: «Corpo», «anima», «distruggere» e «Geenna» sono scelte appropriate. La nota offre correttamente «inferno» come alternativa tradizionale senza imporla nel testo e fornisce un chiarimento storico-culturale sobrio. L’ancora è collocata correttamente sul sintagma «nella Geenna».
