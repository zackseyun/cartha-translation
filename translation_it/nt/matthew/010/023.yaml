review_pass:
  verdict: revise
  source_fidelity: La resa riproduce bene persecuzione, fuga verso un'altra città, la negazione enfatica, «le città d'Israele» e il titolo «Figlio dell'uomo». Tuttavia ἕως ἂν significa propriamente «finché/fino a quando», non «prima che»; benché la formulazione negativa italiana possa avvicinarsi al senso, una resa con «finché non verrà» conserva più direttamente il limite temporale del greco senza scioglierne l'ambiguità escatologica.
  naturalness: Il testo è complessivamente naturale e di registro moderno dignitoso. «Non avrete affatto finito di percorrere» è comprensibile, ma «non avrete certo terminato di percorrere» suona più scorrevole in italiano contemporaneo e mantiene l'enfasi di οὐ μή.
  terminology: «In verità vi dico», «città d'Israele» e «Figlio dell'uomo» sono terminologicamente appropriati. Le note conservano correttamente l'alternativa lessicale di ἑτέραν e l'apertura interpretativa della venuta del Figlio dell'uomo.
  issues:
  - severity: medium
    issue: «prima che venga» per ἕως ἂν ἔλθῃ
    rationale: Il greco esprime il termine temporale «finché/fino a quando verrà». «Prima che» può funzionare pragmaticamente dopo una negazione, ma non è la resa più fedele della costruzione e attenua la corrispondenza formale con «until» dell'audit trail.
  - severity: low
    issue: «affatto finito» è poco idiomatico in questo contesto
    rationale: «Certamente terminato» rende in modo più naturale l'enfasi della doppia negazione οὐ μή, senza ridurre la forza dell'enunciato.
