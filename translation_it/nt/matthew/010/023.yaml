  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ὅταν δὲ διώκωσιν ὑμᾶς ἐν τῇ πόλει ταύτῃ, φεύγετε εἰς τὴν ⸀ἑτέραν· ἀμὴν γὰρ λέγω ὑμῖν, οὐ μὴ τελέσητε τὰς πόλεις ⸀τοῦ Ἰσραὴλ ἕως ⸀ἂν ἔλθῃ ὁ υἱὸς τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/023.yaml
  text: But whenever they persecute you in this city[a], flee to the next one. For truly I say to you[c][b], you will certainly not finish going through the cities of Israel until the Son of Man comes.
translation:
  language: it
  text: 'Ma quando vi perseguiteranno in questa città, fuggite in un''altra.[a] In verità vi dico: non avrete certo terminato di percorrere le città d''Israele[b] finché non verrà il Figlio dell''uomo.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «fuggite nell''altra». Il greco dice letteralmente «nell''altra», sottintendendo «città» dalla frase precedente.'
    reason: lexical_alternative
  - marker: b
    text: 'Più letteralmente: «non avrete certo terminato le città d''Israele». «Di percorrere» esplicita l''attività missionaria itinerante implicita nel contesto.'
    reason: lexical_alternative
  - marker: c
    text: L'espressione «finché non verrà il Figlio dell'uomo» è lasciata intenzionalmente aperta. Si discute se alluda alla glorificazione di Gesù, a una sua venuta in giudizio o al suo ritorno finale.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅταν
  choice: quando
  rationale: In italiano, con il futuro «vi perseguiteranno», esprime naturalmente una circostanza futura eventuale o ricorrente; «ogni volta che» sarebbe possibile ma più marcato.
- source_word: διώκωσιν
  choice: vi perseguiteranno
  rationale: Nel discorso missionario indica un'azione ostile e persecutoria, non un semplice inseguimento.
- source_word: πόλει ταύτῃ
  choice: in questa città
  rationale: Conserva il dimostrativo prossimale e la concretezza dell'istruzione.
- source_word: φεύγετε
  choice: fuggite
  rationale: L'imperativo comunica l'urgenza di allontanarsi davanti alla persecuzione.
- source_word: εἰς τὴν ἑτέραν
  choice: in un'altra
  rationale: «Città» è sottinteso dal sintagma precedente; ἑτέραν indica qui un'altra città, senza dover imporre l'idea della città immediatamente successiva.
- source_word: ἀμὴν
  choice: In verità
  rationale: Rende in italiano corrente e dignitoso la formula solenne con cui Gesù introduce un'affermazione autorevole.
- source_word: οὐ μὴ τελέσητε
  choice: non avrete affatto finito di percorrere
  rationale: «Affatto» conserva la negazione enfatica οὐ μή; «di percorrere» esplicita con misura l'attività itinerante implicita dall'oggetto «le città» e dal contesto missionario.
- source_word: τὰς πόλεις τοῦ Ἰσραήλ
  choice: le città d'Israele
  rationale: Resa diretta e idiomatica del genitivo, riferita alle città appartenenti al territorio o al popolo d'Israele.
- source_word: ἕως ἂν ἔλθῃ
  choice: prima che venga
  rationale: Nel contesto della proposizione negativa, «non... prima che» rende naturalmente il limite temporale futuro espresso da ἕως ἄν con il congiuntivo.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: il Figlio dell'uomo
  rationale: È la resa italiana consolidata dell'autodesignazione e ne conserva le risonanze bibliche e teologiche.
theological_decisions:
- issue: Il referente della venuta del Figlio dell'uomo
  choice: Conservare la formulazione aperta «prima che venga il Figlio dell'uomo»
  alternative: Specificare la risurrezione/vendicazione di Gesù, un suo intervento in giudizio oppure il ritorno finale
  rationale: Il greco non identifica esplicitamente quale venuta sia intesa; la traduzione non impone quindi uno schema escatologico particolare.
translation_notes:
  register: Italiano moderno standard, dignitoso e accessibile. Il periodo conserva la solennità dell'affermazione senza arcaismi; la punteggiatura distingue chiaramente l'istruzione dalla dichiarazione introdotta da «In verità vi dico».
