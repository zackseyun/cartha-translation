  text: μὴ οὖν ⸀φοβεῖσθε· πολλῶν στρουθίων διαφέρετε ὑμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/031.yaml
  text: Therefore[a], do not be afraid; you are worth more than many sparrows.
translation:
  language: it
  text: 'Non abbiate dunque paura: voi valete più di molti passeri.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: «voi siete più preziosi di molti passeri».'
    reason: Alternativa lessicale per διαφέρετε, che in questo contesto esprime superiorità di valore o importanza.
lexical_decisions:
- source_word: μὴ οὖν φοβεῖσθε
  choice: Non abbiate dunque paura
  rationale: La negazione μή con l’imperativo presente esprime il divieto, mentre οὖν collega la conclusione al ragionamento precedente sulla cura del Padre. «Non abbiate dunque paura» è naturale in italiano e conserva il nesso logico.
- source_word: πολλῶν στρουθίων
  choice: di molti passeri
  rationale: Nel contesto immediato στρουθίον indica il passero; il genitivo dipende dal confronto espresso da διαφέρετε.
- source_word: διαφέρετε
  choice: valete più
  rationale: Qui διαφέρω indica superiorità di valore o importanza, non una semplice differenza. «Valete più» rende in modo diretto e corrente il confronto.
- source_word: ὑμεῖς
  choice: voi
  rationale: Il pronome espresso è mantenuto per conservare l’enfasi sui discepoli in contrasto con i passeri.
theological_decisions:
- issue: Valore relativo delle persone e dei passeri nell’insegnamento di Gesù
  choice: voi valete più di molti passeri
  alternative: voi siete più preziosi di molti passeri
  rationale: La formulazione conserva il confronto stabilito da Gesù e, nel contesto, afferma la particolare cura di Dio per i discepoli senza negare la sua cura per gli animali.
translation_notes:
  register: Italiano moderno, semplice e dignitoso. «Abbiate paura» è idiomatico; «dunque» mantiene l’inferenza dal contesto precedente. Il pronome «voi» conserva l’enfasi dell’originale.
