id: MAT.10.39
reference: Matthew 10:39
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ὁ εὑρὼν τὴν ψυχὴν αὐτοῦ ἀπολέσει αὐτήν, καὶ ὁ ἀπολέσας τὴν ψυχὴν αὐτοῦ ἕνεκεν ἐμοῦ εὑρήσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/039.yaml
  text: The one who finds his life will lose it[a], and the one who loses his life for my sake will find it.
translation:
  language: it
  text: Chi trova la propria vita la perderà[a], e chi perde la propria vita per causa mia la troverà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oppure «anima», in entrambe le proposizioni. Il greco ψυχή può significare «vita» o «anima»; qui «vita» si accorda meglio con il contesto del perdere e trovare la propria vita nel discepolato.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ εὑρὼν
  choice: Chi trova
  rationale: L'articolo con il participio aoristo ha valore sostantivato e generico. «Chi trova» è naturale in italiano moderno e conserva la forza proverbiale della frase.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: la propria vita
  rationale: In questo contesto ψυχή indica anzitutto la vita della persona, non specificamente l'anima distinta dal corpo. «Propria» rende con naturalezza il riferimento riflessivo di αὐτοῦ al soggetto generico.
- source_word: ἀπολέσει
  choice: la perderà
  rationale: Qui ἀπόλλυμι esprime la perdita della vita; «perderà» mantiene il contrasto intenzionale con «trova/troverà» senza introdurre l'idea più forte di annientamento.
- source_word: ὁ ἀπολέσας
  choice: chi perde
  rationale: Benché il participio sia aoristo, nella massima ha valore generico. Il presente italiano rende in modo idiomatico l'azione caratteristica coordinata al futuro «troverà».
- source_word: ἕνεκεν ἐμοῦ
  choice: per causa mia
  rationale: L'espressione indica la causa legata alla persona di Gesù. «Per causa mia» è chiaro e dignitoso e conserva più direttamente il valore causale, senza restringerlo al solo beneficio reso a Gesù.
- source_word: εὑρήσει αὐτήν
  choice: la troverà
  rationale: «Troverà» conserva la corrispondenza retorica con «trova»; il pronome femminile riprende naturalmente «vita».
theological_decisions:
- issue: Resa di ψυχή nel paradosso del discepolato
  choice: vita
  alternative: anima
  rationale: Il contesto riguarda il tentativo di conservare la propria vita e la disponibilità a perderla a motivo di Gesù. «Vita» mantiene il paradosso concreto senza imporre una dicotomia antropologica; «anima» resta una possibilità lessicale autentica e viene segnalata in nota.
- issue: Valore di ἕνεκεν ἐμοῦ
  choice: per causa mia
  alternative: per amor mio / a motivo mio
  rationale: Il greco esprime causa o motivo e lega la perdita della vita alla persona di Gesù. La formulazione scelta preserva tale relazione senza precisare oltre se si tratti di motivo, fedeltà o beneficio.
translation_notes:
  register: Italiano standard moderno, conciso e dignitoso. La struttura parallela «trova/perderà ... perde/troverà» conserva il paradosso e la simmetria dell'originale. Il generico «chi» evita sia l'arcaismo sia l'introduzione di marcature di genere assenti dalla funzione rappresentativa della costruzione greca.
