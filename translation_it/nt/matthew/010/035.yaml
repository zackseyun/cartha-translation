id: MAT.10.35
reference: Matthew 10:35
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ἦλθον γὰρ διχάσαι ἄνθρωπον κατὰ τοῦ πατρὸς αὐτοῦ καὶ θυγατέρα κατὰ τῆς μητρὸς αὐτῆς καὶ νύμφην κατὰ τῆς πενθερᾶς αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/035.yaml
  text: For I came to set a man against his father[a], and a daughter against her mother, and a daughter-in-law against her mother-in-law[b],
translation:
  language: it
  text: Sono venuto infatti a mettere un uomo contro suo padre[a], una figlia contro sua madre e una nuora contro sua suocera[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «a dividere»; il verbo greco può essere reso più letteralmente così, ma le successive espressioni con «contro» precisano che si tratta di opposizione nei rapporti personali.
    reason: lexical_alternative
  - marker: b
    text: Il greco νύμφη può significare «sposa» in altri contesti; qui indica la «nuora», perché è posta in relazione con la «suocera».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον
  choice: Sono venuto
  rationale: L’aoristo di ἔρχομαι si riferisce qui alla venuta e alla missione di Gesù; in italiano il passato prossimo è la resa più naturale nel discorso diretto.
- source_word: γὰρ
  choice: infatti
  rationale: Introduce la spiegazione dell’affermazione precedente e, in questa posizione, mantiene il collegamento argomentativo con naturalezza.
- source_word: διχάσαι
  choice: mettere ... contro
  rationale: Il verbo significa dividere o provocare divisione; le successive costruzioni κατά con il genitivo rendono esplicita l’opposizione tra persone, ben espressa in italiano da «mettere ... contro».
- source_word: ἄνθρωπον
  choice: un uomo
  rationale: Benché ἄνθρωπος possa essere generico, qui apre una serie familiare accanto a figure femminili specifiche; «un uomo» conserva il valore maschile contestuale.
- source_word: κατὰ τοῦ πατρὸς αὐτοῦ
  choice: contro suo padre
  rationale: κατά con il genitivo esprime opposizione; la formulazione è diretta e idiomatica in italiano.
- source_word: θυγατέρα
  choice: una figlia
  rationale: Resa diretta e naturale del sostantivo accusativo singolare.
- source_word: κατὰ τῆς μητρὸς αὐτῆς
  choice: contro sua madre
  rationale: Riproduce con chiarezza la medesima costruzione avversativa.
- source_word: νύμφην
  choice: una nuora
  rationale: νύμφη può significare anche «sposa», ma l’abbinamento con πενθερά richiede qui il rapporto di parentela «nuora».
- source_word: κατὰ τῆς πενθερᾶς αὐτῆς
  choice: contro sua suocera
  rationale: Conserva lo schema ripetuto di opposizione familiare con la terminologia italiana naturale.
theological_decisions:
- issue: Natura della missione dichiarata da Gesù nel contesto
  choice: Descrivere in modo netto la divisione familiare con «mettere ... contro», senza aggiungere una spiegazione teologica nel testo.
  alternative: Rendere più letteralmente «dividere» oppure parafrasare il conflitto come conseguenza dell’adesione a Gesù.
  rationale: Il greco presenta la venuta di Gesù come causa di divisione e opposizione tra familiari. La traduzione conserva la durezza e la tensione dell’affermazione senza suggerire che l’ostilità sia un bene ultimo né risolvere nel testo il rapporto tra scopo ed effetto.
translation_notes:
  register: Italiano moderno standard, dignitoso e accessibile. La collocazione di «infatti» dopo il verbo evita un avvio rigido; la ripetizione di «contro» conserva il parallelismo e la forza dell’originale. Gli articoli possessivi sono omessi secondo l’uso italiano ordinario con i nomi di parentela al singolare.
