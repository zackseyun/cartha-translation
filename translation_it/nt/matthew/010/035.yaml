  source_fidelity: 'La resa conserva accuratamente la struttura dell’originale: ἦλθον γάρ è espresso da «Sono venuto infatti»; διχάσαι e le tre costruzioni ripetute con κατά + genitivo sono rese con il chiaro e incisivo «mettere ... contro». «Un uomo», «una figlia» e «una nuora» corrispondono ai tre membri della serie, e i rispettivi rapporti familiari sono mantenuti senza aggiunte interpretative.'
  naturalness: Il testo è italiano moderno, scorrevole e di registro appropriato. «Sono venuto infatti» è naturale nel discorso diretto; l’omissione dell’articolo davanti ai possessivi con i nomi di parentela singolari («suo padre», «sua madre», «sua suocera») è idiomatica. La ripetizione di «contro» riproduce efficacemente il parallelismo greco.
