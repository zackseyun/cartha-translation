id: MAT.10.37
reference: Matthew 10:37
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ὁ φιλῶν πατέρα ἢ μητέρα ὑπὲρ ἐμὲ οὐκ ἔστιν μου ἄξιος· καὶ ὁ φιλῶν υἱὸν ἢ θυγατέρα ὑπὲρ ἐμὲ οὐκ ἔστιν μου ἄξιος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/037.yaml
  text: The one who loves father or mother more than me is not worthy of me[a], and the one who loves son or daughter more than me is not worthy of me.
translation:
  language: it
  text: Chi ama il padre o la madre più di me non è degno di me[a]; e chi ama il figlio o la figlia più di me non è degno di me.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «al di sopra di me». L’espressione greca ὑπὲρ ἐμέ indica amare qualcuno preferendolo a Gesù.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ φιλῶν
  choice: chi ama
  rationale: L’articolo con il participio presente ha valore sostantivato e indica genericamente chi è caratterizzato da tale amore. «Chi ama» è naturale e conserva la portata generale della formulazione greca.
- source_word: πατέρα ἢ μητέρα
  choice: il padre o la madre
  rationale: In italiano i nomi di parentela richiedono qui naturalmente l’articolo determinativo; non si aggiunge un possessivo, assente dal greco.
- source_word: ὑπὲρ ἐμέ
  choice: più di me
  rationale: Nel contesto comparativo, ὑπέρ esprime una preferenza o un amore maggiore. «Più di me» è l’equivalente italiano più chiaro e idiomatico.
- source_word: οὐκ ἔστιν μου ἄξιος
  choice: non è degno di me
  rationale: La formulazione conserva direttamente il genitivo μου retto da ἄξιος e la severità del giudizio, senza introdurre spiegazioni quali «non è degno di appartenermi».
- source_word: καὶ
  choice: e
  rationale: La congiunzione semplice riproduce la struttura parallela delle due proposizioni.
- source_word: υἱὸν ἢ θυγατέρα
  choice: il figlio o la figlia
  rationale: La resa con l’articolo determinativo è naturale in italiano e non aggiunge il possessivo implicito ma non espresso nel greco.
theological_decisions:
- issue: Il rapporto tra la lealtà verso Gesù e l’amore per la famiglia
  choice: La traduzione richiede che l’amore per Gesù abbia priorità perfino sui legami familiari più stretti, senza negare il valore dell’amore familiare.
  alternative: Attenuare con «non ama me altrettanto» oppure amplificare facendo dire al testo che occorre odiare la propria famiglia.
  rationale: Il greco presenta un confronto mediante ὑπὲρ ἐμέ e pronuncia un giudizio di indegnità. La resa mantiene la tensione e la radicalità della richiesta senza indebolirla né importare formulazioni più forti da altri passi.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. La costruzione parallela dell’originale è conservata; «chi ama» evita sia l’arcaismo sia specificazioni di genere non necessarie.
