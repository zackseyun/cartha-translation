  naturalness: Il testo è naturale e scorrevole in italiano standard moderno. L’uso dell’articolo in «il padre o la madre» e «il figlio o la figlia» è idiomatico; la ripetizione rispetta efficacemente il parallelismo solenne dell’originale.
  terminology: «Degno di me» è una formulazione italiana chiara e semanticamente diretta. La nota rende correttamente l’alternativa lessicale «al di sopra di me» e spiega senza sovraccaricare il testo che il confronto implica preferenza rispetto a Gesù.
