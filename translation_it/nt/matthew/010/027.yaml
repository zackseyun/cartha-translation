id: MAT.10.27
reference: Matthew 10:27
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ὃ λέγω ὑμῖν ἐν τῇ σκοτίᾳ, εἴπατε ἐν τῷ φωτί· καὶ ὃ εἰς τὸ οὖς ἀκούετε, κηρύξατε ἐπὶ τῶν δωμάτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/027.yaml
  text: What I tell you in the darkness[a], say in the light; and what you hear in the ear[b], proclaim on the housetops.
translation:
  language: it
  text: Quello che vi dico nelle tenebre[a], ditelo nella luce; e quello che udite all’orecchio[b], proclamatelo sui tetti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oppure «in segreto … apertamente»; il greco conserva l’immagine «nelle tenebre … nella luce».
    reason: lexical_alternative
  - marker: b
    text: Cioè, ciò che viene udito in privato deve essere annunciato pubblicamente. I tetti piani delle case antiche erano luoghi elevati e visibili, adatti a un annuncio pubblico.
    reason: cultural_note
lexical_decisions:
- source_word: ὃ λέγω ὑμῖν
  choice: Quello che vi dico
  rationale: Resa naturale del relativo sostantivato con il verbo e il complemento indiretto; conserva il carattere diretto dell’insegnamento.
- source_word: ἐν τῇ σκοτίᾳ
  choice: nelle tenebre
  rationale: Mantiene l’immagine greca e il contrasto con «nella luce», senza ridurli alla sola idea interpretativa di segretezza e pubblicità.
- source_word: εἴπατε
  choice: ditelo
  rationale: L’imperativo aoristo richiede l’enunciazione di ciò che è stato detto; il pronome «lo» riprende naturalmente «quello» in italiano.
- source_word: ἐν τῷ φωτί
  choice: nella luce
  rationale: Conserva il parallelismo antitetico e l’immagine del testo greco.
- source_word: εἰς τὸ οὖς
  choice: all’orecchio
  rationale: Riproduce in italiano dignitoso l’immagine idiomatica della comunicazione privata, mantenendo il singolare del greco.
- source_word: ἀκούετε
  choice: udite
  rationale: Il presente indicativo è reso con un presente italiano; «udite» si accorda bene con il registro solenne ma comprensibile del versetto.
- source_word: κηρύξατε
  choice: proclamatelo
  rationale: Esprime l’annuncio pubblico e autorevole di κηρύσσω senza restringerlo alla predicazione formale.
- source_word: ἐπὶ τῶν δωμάτων
  choice: sui tetti
  rationale: Rende direttamente l’immagine dei tetti piani delle case antiche come luoghi elevati e visibili per un annuncio pubblico.
theological_decisions:
- issue: Se rendere le immagini tenebre/luce e orecchio/tetti letteralmente oppure esplicitarle come segretezza/pubblicità
  choice: 'Conservare nel testo principale le immagini: «nelle tenebre ... nella luce ... all’orecchio ... sui tetti».'
  alternative: «in segreto ... apertamente ... ciò che vi viene sussurrato ... annunciatelo pubblicamente»
  rationale: Le immagini antitetiche sono parte della retorica di Gesù e comunicano il passaggio dall’istruzione privata alla proclamazione pubblica. Esplicitarne soltanto il senso appiattirebbe la formulazione e risolverebbe un’immagine che il greco lascia viva.
translation_notes:
  register: Italiano moderno, naturale e dignitoso. Il parallelismo è conservato; «ditelo» e «proclamatelo» rendono esplicita in modo idiomatico la ripresa dell’oggetto senza aggiungere contenuto. Le note spiegano il valore figurato e il contesto culturale senza sostituire le immagini del testo.
