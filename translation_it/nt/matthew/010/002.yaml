id: MAT.10.2
reference: Matthew 10:2
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: τῶν δὲ δώδεκα ἀποστόλων τὰ ὀνόματά ἐστιν ταῦτα· πρῶτος Σίμων ὁ λεγόμενος Πέτρος καὶ Ἀνδρέας ὁ ἀδελφὸς ⸀αὐτοῦ, Ἰάκωβος ὁ τοῦ Ζεβεδαίου καὶ Ἰωάννης ὁ ἀδελφὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/002.yaml
  text: 'These are the names of the twelve apostles: first[a], Simon who is called Peter, and Andrew his brother; James the son of Zebedee, and John his brother,'
translation:
  language: it
  text: 'I nomi dei dodici apostoli sono questi: primo[a], Simone, chiamato Pietro, e Andrea, suo fratello; Giacomo, figlio di Zebedeo, e Giovanni, suo fratello.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oppure «primo» potrebbe indicare una posizione di preminenza fra i Dodici, non soltanto il primo posto nell’elenco.
    reason: L'ampiezza semantica di πρῶτος consente, oltre al valore enumerativo, una possibile sfumatura di preminenza.
lexical_decisions:
- source_word: δὲ
  choice: nessun connettivo esplicito
  rationale: δέ introduce qui una lieve transizione. In italiano il passaggio risulta naturale senza aggiungere «ora» o «e», che potrebbero suggerire rispettivamente un valore temporale o coordinativo più marcato.
- source_word: δώδεκα ἀποστόλων
  choice: dei dodici apostoli
  rationale: «Apostoli» è il termine italiano tradizionale, preciso e immediatamente riconoscibile per il gruppo incaricato da Gesù.
- source_word: τὰ ὀνόματά ἐστιν ταῦτα
  choice: I nomi ... sono questi
  rationale: Riproduce la struttura dimostrativa greca in un italiano naturale e dignitoso.
- source_word: πρῶτος
  choice: primo
  rationale: Conserva il valore lessicale e la posizione enfatica del termine senza decidere nel testo se indichi soltanto l'ordine dell'elenco o anche una preminenza.
- source_word: Σίμων ὁ λεγόμενος Πέτρος
  choice: Simone, chiamato Pietro
  rationale: La forma participiale italiana identifica in modo naturale Simone con il nome Pietro, mantenendo il senso di ὁ λεγόμενος.
- source_word: ὁ ἀδελφὸς αὐτοῦ
  choice: suo fratello
  rationale: In entrambe le occorrenze ἀδελφός indica il fratello in senso familiare; il possessivo italiano rende chiaramente il rapporto.
- source_word: Ἰάκωβος ὁ τοῦ Ζεβεδαίου
  choice: Giacomo, figlio di Zebedeo
  rationale: La costruzione genitivale greca identifica Giacomo mediante la filiazione, resa esplicita secondo l'uso naturale italiano.
theological_decisions:
- issue: Valore di πρῶτος riferito a Simone/Pietro
  choice: «primo» nel testo, senza esplicitare una dottrina di autorità o primato
  alternative: «primo» anche nel senso di preminente fra i Dodici
  rationale: Nel contesto πρῶτος introduce un elenco, ma può recare anche una sfumatura di preminenza. Il testo mantiene l'ambiguità lessicale e la nota segnala l'alternativa senza imporre una conclusione confessionale.
translation_notes:
  register: Italiano moderno standard, chiaro e dignitoso. La punteggiatura scandisce le coppie di fratelli; «chiamato Pietro» evita una relativa più pesante, mentre «figlio di Zebedeo» esplicita in modo idiomatico la filiazione implicita nel greco.
