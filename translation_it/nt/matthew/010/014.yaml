  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: καὶ ὃς ⸀ἂν μὴ δέξηται ὑμᾶς μηδὲ ἀκούσῃ τοὺς λόγους ὑμῶν, ἐξερχόμενοι ⸀ἔξω τῆς οἰκίας ἢ τῆς πόλεως ἐκείνης ἐκτινάξατε τὸν κονιορτὸν τῶν ποδῶν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/014.yaml
  text: And whoever does not receive you or listen to your words[a], as you go out of that house or that town[c][b], shake off the dust from your feet.
translation:
  language: it
  text: E se qualcuno non vi accoglie e non ascolta le vostre parole, uscendo da quella casa o da quella città, scuotete via la polvere dai vostri piedi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Scuotere via la polvere dai piedi era un gesto simbolico di dissociazione e di giudizio nei confronti di chi aveva respinto il messaggio.
    reason: cultural_note
lexical_decisions:
- source_word: ὃς ἂν μὴ
  choice: se qualcuno non
  rationale: La costruzione relativa indefinita con ἄν ha valore generale e condizionale; «se qualcuno non» è naturale in italiano e mantiene il rapporto con l'imperativo seguente.
- source_word: δέξηται ὑμᾶς
  choice: vi accoglie
  rationale: δέχομαι indica qui l'accoglienza dei messaggeri, con una sfumatura sia ospitale sia favorevole; «accoglie» esprime entrambe senza restringere il senso.
- source_word: μηδὲ ἀκούσῃ τοὺς λόγους ὑμῶν
  choice: e non ascolta le vostre parole
  rationale: Dopo la negazione iniziale, μηδέ coordina una seconda eventualità negativa. «Ascolta» rende il senso contestuale di ἀκούω senza esplicitare ulteriormente l'idea di obbedienza.
- source_word: ἐξερχόμενοι ἔξω
  choice: uscendo da
  rationale: Il participio con ἔξω descrive l'azione concomitante all'imperativo; «uscendo da» conserva in modo conciso sia la forma participiale sia il movimento verso l'esterno.
- source_word: τῆς οἰκίας ἢ τῆς πόλεως ἐκείνης
  choice: quella casa o quella città
  rationale: La ripetizione dell'articolo e il dimostrativo indicano i due luoghi specifici. «Città» è l'equivalente ordinario di πόλις e può designare anche un centro abitato non grande.
- source_word: ἐκτινάξατε τὸν κονιορτὸν τῶν ποδῶν ὑμῶν
  choice: scuotete via la polvere dai vostri piedi
  rationale: «Scuotete via» esprime la rimozione energica indicata dal verbo; «polvere» rende precisamente κονιορτός e «dai vostri piedi» il rapporto espresso dal genitivo.
theological_decisions:
- issue: Valore simbolico del gesto verso chi respinge i discepoli e il loro messaggio
  choice: Mantenere nel testo il comando concreto «scuotete via la polvere dai vostri piedi»
  alternative: Esplicitare nel testo «come testimonianza contro di loro» oppure parafrasare il gesto come dichiarazione di giudizio
  rationale: Il versetto ordina il gesto senza spiegarne direttamente il significato. Non si importa nel testo una formulazione tratta dai passi paralleli; il valore di dissociazione e giudizio viene segnalato soltanto in nota.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. La coordinazione negativa è resa idiomaticamente; l'immagine concreta e la tensione giudiziaria restano intatte senza aggiunte interpretative nel testo principale.
