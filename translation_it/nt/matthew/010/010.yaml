id: MAT.10.10
reference: Matthew 10:10
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: μὴ πήραν εἰς ὁδὸν μηδὲ δύο χιτῶνας μηδὲ ὑποδήματα μηδὲ ⸀ῥάβδον· ἄξιος γὰρ ὁ ἐργάτης τῆς τροφῆς ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/010.yaml
  text: do not take a traveler's bag for the road[a], or two tunics, or sandals, or a staff; for the worker is worthy of his food.
translation:
  language: it
  text: Non prendete per il viaggio né una sacca né due tuniche né sandali né un bastone[a], perché il lavoratore merita il suo cibo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alcuni intendono «né un bastone» come il divieto di portare un bastone in più, soprattutto alla luce di Marco 6:8, dove è permesso portare un bastone.
    reason: Lettura alternativa proposta per spiegare la differenza rispetto al racconto parallelo, senza armonizzare il testo principale.
lexical_decisions:
- source_word: πήραν
  choice: una sacca
  rationale: πήρα indica una sacca portata in viaggio, in particolare per le provviste. «Sacca» è concreto, naturale e adeguato al contesto; «per il viaggio» ne chiarisce la funzione.
- source_word: εἰς ὁδὸν
  choice: per il viaggio
  rationale: L’espressione indica ciò che viene portato con sé durante un viaggio. «Per il viaggio» è idiomatico in italiano e conserva il valore della frase greca.
- source_word: δύο χιτῶνας
  choice: due tuniche
  rationale: χιτών designa la tunica, indumento di base dell’epoca. «Tuniche» mantiene la precisione storica senza ricorrere al più moderno e fuorviante «camicie».
- source_word: ὑποδήματα
  choice: sandali
  rationale: Nel contesto del I secolo, ὑποδήματα si riferisce naturalmente a calzature legate sotto i piedi; «sandali» è la resa italiana più chiara e storicamente appropriata.
- source_word: ῥάβδον
  choice: un bastone
  rationale: ῥάβδος indica qui il bastone del viandante. La resa letterale conserva la formulazione di Matteo e non la armonizza con Marco 6:8.
- source_word: ἄξιος
  choice: merita
  rationale: ἄξιος esprime l’idea di essere degno o meritevole di qualcosa. «Merita» comunica in italiano corrente il diritto appropriato del lavoratore al proprio sostentamento.
- source_word: ὁ ἐργάτης
  choice: il lavoratore
  rationale: ἐργάτης indica chi lavora. «Il lavoratore» è chiaro, moderno e non introduce un titolo ecclesiastico tecnico.
- source_word: τῆς τροφῆς αὐτοῦ
  choice: il suo cibo
  rationale: τροφή significa anzitutto cibo o nutrimento. «Il suo cibo» conserva il senso concreto del greco, evitando di ampliare interpretativamente in «sostegno» o «mantenimento».
theological_decisions:
- issue: Possibile armonizzazione con i racconti paralleli riguardo all’equipaggiamento consentito durante il viaggio
  choice: Mantenere nel testo principale il divieto «né un bastone».
  alternative: Intendere il divieto come riferito soltanto a un bastone di riserva, oppure rendere il testo più liberamente per armonizzarlo con Marco 6:8.
  rationale: Il testo greco di Matteo include chiaramente ῥάβδον tra gli oggetti vietati. La traduzione conserva la tensione con Marco 6:8 senza risolverla nel testo; l’interpretazione alternativa viene segnalata in nota.
translation_notes:
  register: Italiano standard moderno, chiaro e dignitoso. La coordinazione ripetuta «né… né…» segue l’enfasi dell’elenco greco. Il verbo «prendete», sottinteso nel frammento greco perché dipende dal contesto precedente, è espresso per ottenere una frase italiana completa e naturale.
