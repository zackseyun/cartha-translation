id: MAT.10.41
reference: Matthew 10:41
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ὁ δεχόμενος προφήτην εἰς ὄνομα προφήτου μισθὸν προφήτου λήμψεται, καὶ ὁ δεχόμενος δίκαιον εἰς ὄνομα δικαίου μισθὸν δικαίου λήμψεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/041.yaml
  text: The one who receives a prophet in the name of a prophet will receive a prophet’s reward[b][a], and the one who receives a righteous man in the name of a righteous man will receive a righteous man’s reward.
translation:
  language: it
  text: Chi accoglie un profeta nel nome di un profeta[a] riceverà la ricompensa di un profeta; e chi accoglie un giusto nel nome di un giusto[b] riceverà la ricompensa di un giusto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oppure «perché è un profeta» o «in quanto profeta». Il greco dice letteralmente «nel nome di un profeta».
    reason: lexical_alternative
  - marker: b
    text: Oppure «perché è un giusto» o «in quanto giusto». Il greco dice letteralmente «nel nome di un giusto».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δεχόμενος
  choice: chi accoglie
  rationale: Il participio presente articolato ha valore sostantivato e generale. «Chi accoglie» è naturale in italiano e rende l’idea di ricevere qualcuno con disponibilità, senza appesantire la frase con «colui che».
- source_word: προφήτην
  choice: un profeta
  rationale: Resa diretta dell’oggetto accusativo, mantenendo il ruolo riconoscibile espresso dal greco.
- source_word: εἰς ὄνομα προφήτου
  choice: nel nome di un profeta
  rationale: 'Conserva la formulazione greca e la sua densità, mentre una nota chiarisce i possibili valori idiomatici: «perché è un profeta» oppure «in quanto profeta».'
- source_word: μισθὸν προφήτου
  choice: la ricompensa di un profeta
  rationale: 'La costruzione con «di» mantiene aperta la relazione del genitivo: può indicare la ricompensa ricevuta da un profeta o quella associata alla sua condizione, senza scegliere indebitamente fra le due sfumature.'
- source_word: λήμψεται
  choice: riceverà
  rationale: Il futuro medio è reso naturalmente con il futuro semplice italiano; la ripetizione di «ricevere/accogliere» non è necessaria, poiché per una persona «accogliere» è più idiomatico, mentre per la ricompensa «ricevere» è preciso.
- source_word: δίκαιον
  choice: un giusto
  rationale: L’aggettivo maschile singolare è usato sostantivamente. «Un giusto» conserva sia il significato morale e teologico sia la forma maschile rappresentativa del greco.
- source_word: εἰς ὄνομα δικαίου
  choice: nel nome di un giusto
  rationale: Riproduce il parallelismo con la prima proposizione e conserva l’idioma greco, chiarito in nota.
- source_word: μισθὸν δικαίου
  choice: la ricompensa di un giusto
  rationale: Mantiene il parallelismo con «la ricompensa di un profeta» e non precisa oltre il testo il rapporto espresso dal genitivo.
theological_decisions:
- issue: Significato di εἰς ὄνομα seguito dal genitivo
  choice: Mantenere «nel nome di» nel testo e spiegare in nota il senso «perché è» o «in quanto».
  alternative: Tradurre direttamente «perché è un profeta/un giusto» oppure «in quanto profeta/giusto».
  rationale: L’espressione indica che l’accoglienza avviene in considerazione dell’identità o della qualità riconosciuta della persona. La resa formale conserva però il parallelismo e la possibile risonanza dell’espressione «nel nome di», senza nasconderne l’idiomaticità.
- issue: Valore del genitivo in μισθὸν προφήτου / μισθὸν δικαίου
  choice: Usare «la ricompensa di un profeta/un giusto».
  alternative: «Una ricompensa da profeta/da giusto» oppure «la stessa ricompensa del profeta/del giusto».
  rationale: Il greco non determina esplicitamente se si tratti della ricompensa ricevuta dal profeta o dal giusto, oppure della ricompensa appropriata a chi li accoglie. La costruzione italiana con «di» preserva meglio questa tensione.
- issue: Maschile sostantivato δίκαιον / δικαίου
  choice: Rendere con «un giusto / di un giusto».
  alternative: «Una persona giusta / di una persona giusta».
  rationale: Il testo greco usa il maschile singolare sostantivato. «Un giusto» è corrente nel registro biblico italiano, resta comprensibile e non introduce un’esplicitazione assente dall’originale.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. «Chi accoglie» evita il più solenne «colui che riceve» senza perdere il valore generale del participio. Il punto e virgola mette in evidenza il parallelismo delle due proposizioni; «un giusto» conserva una sobria tonalità biblica ancora naturale nell’italiano contemporaneo.
