id: MAT.10.15
reference: Matthew 10:15
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ἀνεκτότερον ἔσται γῇ Σοδόμων καὶ Γομόρρων ἐν ἡμέρᾳ κρίσεως ἢ τῇ πόλει ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/015.yaml
  text: Truly I say to you[c][b][a], it will be more bearable for the land of Sodom and Gomorrah on the day of judgment than for that town.
translation:
  language: it
  text: 'In verità vi dico: nel giorno del giudizio sarà più sopportabile per la terra di Sodoma e Gomorra[a] che per quella città[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «per Sodoma e Gomorra». Il greco dice letteralmente «per la terra di Sodoma e Gomorra».'
    reason: lexical_alternative
  - marker: b
    text: 'Oppure: «quel centro abitato».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: In verità
  rationale: Nella formula solenne ἀμὴν λέγω ὑμῖν, «In verità» comunica con chiarezza la forza asseverativa ed è naturale nell’italiano biblico moderno.
- source_word: λέγω ὑμῖν
  choice: vi dico
  rationale: Resa diretta, concisa e idiomatica della formula greca.
- source_word: ἀνεκτότερον
  choice: più sopportabile
  rationale: Esprime ciò che sarà relativamente più tollerabile o più facile da sopportare, conservando il comparativo senza attenuarlo.
- source_word: γῇ
  choice: per la terra
  rationale: Il dativo indica il termine per il quale la situazione sarà più sopportabile; «terra» conserva il riferimento geografico esplicito del greco.
- source_word: Σοδόμων καὶ Γομόρρων
  choice: di Sodoma e Gomorra
  rationale: Le forme italiane tradizionali e correnti dei toponimi dipendono da «terra».
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: nel giorno del giudizio
  rationale: Resa naturale che mantiene il riferimento al giorno futuro del giudizio senza precisarne ulteriormente lo schema teologico.
- source_word: πόλει
  choice: città
  rationale: «Città» è l’equivalente italiano più diretto di πόλις; nel contesto può indicare anche un centro abitato di dimensioni minori.
- source_word: ἐκείνῃ
  choice: quella
  rationale: Il dimostrativo rinvia alla città che non accoglie i messaggeri, senza aggiungere enfasi assente dal testo.
theological_decisions:
- issue: Natura del «giorno del giudizio»
  choice: Mantenere l’espressione come riferimento a un futuro giorno di giudizio divino.
  alternative: Intenderla in senso più generale come un tempo di giudizio.
  rationale: La formulazione greca suggerisce naturalmente il giudizio escatologico, ma la traduzione non introduce dettagli dottrinali ulteriori.
- issue: Comparazione del grado di giudizio
  choice: Conservare l’affermazione comparativa «più sopportabile».
  alternative: Parafrasare esplicitamente in termini di pena minore o maggiore.
  rationale: Il testo afferma una differenza comparativa senza spiegare la natura o la misura della conseguenza; esplicitarla risolverebbe indebitamente la tensione.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. La formula «In verità vi dico» conserva la solennità dell’originale; «più sopportabile» resta chiaro senza ricorrere a un registro eccessivamente arcaico. Tutti i richiami di nota sono collocati nel testo.
