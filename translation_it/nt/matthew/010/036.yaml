  text: καὶ ἐχθροὶ τοῦ ἀνθρώπου οἱ οἰκιακοὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/036.yaml
  text: And a man's enemies will be those of his own household[a].
translation:
  language: it
  text: E i nemici dell’uomo saranno quelli di casa sua.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «i nemici di una persona saranno i membri della sua stessa casa». Il greco usa «uomo» al maschile singolare in senso rappresentativo.'
    reason: Alternativa lessicale e chiarimento del linguaggio rappresentativo.
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Mantiene il semplice valore coordinante della congiunzione e collega la frase al contesto precedente senza aggiungere una sfumatura causale.
- source_word: ἐχθροὶ
  choice: i nemici
  rationale: Rende in modo diretto il sostantivo plurale che indica persone ostili.
- source_word: τοῦ ἀνθρώπου
  choice: dell’uomo
  rationale: Riproduce il genitivo possessivo e il maschile singolare rappresentativo del greco; in questo detto «uomo» si riferisce alla persona umana in senso generale.
- source_word: οἱ οἰκιακοὶ αὐτοῦ
  choice: quelli di casa sua
  rationale: Espressione italiana naturale che designa le persone appartenenti alla casa o al nucleo domestico, senza restringere necessariamente il riferimento alla sola famiglia biologica.
theological_decisions:
- issue: Linguaggio rappresentativo di ἀνθρώπου
  choice: dell’uomo
  alternative: di una persona
  rationale: Il testo greco usa il maschile singolare in senso rappresentativo. La traduzione principale ne conserva la forma, mentre la nota chiarisce che il riferimento è generale.
- issue: Ambito di οἰκιακοί
  choice: quelli di casa sua
  alternative: i membri della sua famiglia
  rationale: Il termine greco comprende gli appartenenti alla casa e può avere un’estensione più ampia della sola parentela; la resa scelta preserva tale ampiezza.
translation_notes:
  register: Italiano moderno, dignitoso e facilmente comprensibile. «Quelli di casa sua» conserva il carattere concreto e proverbiale dell’espressione greca; il futuro «saranno» è richiesto dal contesto immediato e produce una frase italiana completa.
