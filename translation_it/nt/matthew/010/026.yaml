id: MAT.10.26
reference: Matthew 10:26
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Μὴ οὖν φοβηθῆτε αὐτούς· οὐδὲν γάρ ἐστιν κεκαλυμμένον ὃ οὐκ ἀποκαλυφθήσεται, καὶ κρυπτὸν ὃ οὐ γνωσθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/026.yaml
  text: Therefore, do not fear them, for nothing is covered that will not be revealed, and hidden that will not be made known.
translation:
  language: it
  text: Non abbiate dunque paura di loro, perché non c’è nulla di coperto che non sarà rivelato, né nulla di nascosto che non sarà conosciuto.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ οὖν φοβηθῆτε αὐτούς
  choice: Non abbiate dunque paura di loro
  rationale: Rende l’imperativo aoristo passivo con una proibizione naturale in italiano; «dunque» conserva il nesso inferenziale di οὖν e «di loro» il referente pronominale.
- source_word: κεκαλυμμένον
  choice: coperto
  rationale: Mantiene l’immagine concreta del participio perfetto passivo, distinta da «nascosto» nella clausola parallela.
- source_word: ἀποκαλυφθήσεται
  choice: sarà rivelato
  rationale: Conserva il futuro passivo e il contrasto lessicale con ciò che è «coperto».
- source_word: κρυπτὸν
  choice: nulla di nascosto
  rationale: La ripresa di «nulla» esplicita in italiano l’ellissi greca senza modificarne il senso e preserva il parallelismo.
- source_word: γνωσθήσεται
  choice: sarà conosciuto
  rationale: Riproduce il futuro passivo di γινώσκω senza specificare chi verrà a conoscenza di ciò che è nascosto.
theological_decisions:
- issue: Agente dei passivi futuri
  choice: Lasciato implicito
  alternative: «Dio lo rivelerà / lo farà conoscere» oppure «verrà alla luce»
  rationale: Il greco non nomina l’agente; mantenerlo implicito preserva l’ambiguità e non impone un’interpretazione teologica.
- issue: Portata temporale della rivelazione
  choice: 'Futuro semplice: «sarà rivelato… sarà conosciuto»'
  alternative: Formulazione gnomica o presente
  rationale: Il futuro italiano rispecchia i futuri greci senza stabilire se il riferimento sia alla proclamazione imminente, al giudizio finale o a entrambi.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. Il parallelismo antitetico «coperto/rivelato» e «nascosto/conosciuto» segue da vicino la struttura greca; non sono necessarie note a piè di pagina.
