id: MAT.10.20
reference: Matthew 10:20
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: οὐ γὰρ ὑμεῖς ἐστε οἱ λαλοῦντες ἀλλὰ τὸ πνεῦμα τοῦ πατρὸς ὑμῶν τὸ λαλοῦν ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/020.yaml
  text: For it is not you who are speaking[b][a], but the Spirit of your Father speaking in you.
translation:
  language: it
  text: Infatti non siete voi a parlare, ma è lo Spirito del Padre vostro che parla in voi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «per mezzo di voi». Il greco dice letteralmente «in voi», espressione che in questo contesto può anche implicare che lo Spirito parli attraverso i discepoli.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Infatti non
  rationale: γάρ introduce la spiegazione dell'assicurazione precedente; «infatti» conserva in italiano il nesso esplicativo in modo naturale.
- source_word: ὑμεῖς ἐστε οἱ λαλοῦντες
  choice: siete voi a parlare
  rationale: La costruzione italiana mette in rilievo il pronome esplicito ὑμεῖς e conserva l'enfasi sull'identità di chi parla.
- source_word: ἀλλὰ
  choice: ma
  rationale: Esprime direttamente il forte contrasto con la proposizione negativa precedente.
- source_word: τὸ πνεῦμα τοῦ πατρὸς ὑμῶν
  choice: lo Spirito del Padre vostro
  rationale: Riproduce la relazione genitivale senza aggiungere «celeste», assente dal versetto; la maiuscola segnala il referente divino chiarito dal contesto.
- source_word: τὸ λαλοῦν
  choice: che parla
  rationale: La relativa rende con chiarezza il participio presente articolato, concordato con πνεῦμα, e ne conserva l'azione in corso.
- source_word: ἐν ὑμῖν
  choice: in voi
  rationale: È la resa più diretta di ἐν e mantiene aperta la possibile sfumatura di un parlare che si esprime attraverso i discepoli.
theological_decisions:
- issue: Se ἐν ὑμῖν indichi presenza interiore oppure agenzia strumentale
  choice: in voi
  alternative: per mezzo di voi
  rationale: Il senso più immediato di ἐν è «in». Il contesto può suggerire che lo Spirito parli per mezzo dei discepoli, ma tradurre così nel testo principale risolverebbe una tensione che il greco lascia aperta.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. «Siete voi a parlare» conserva l'enfasi del pronome greco; «Padre vostro» mantiene un tono biblico naturale senza risultare arcaico.
