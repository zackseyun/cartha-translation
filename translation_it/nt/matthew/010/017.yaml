id: MAT.10.17
reference: Matthew 10:17
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: προσέχετε δὲ ἀπὸ τῶν ἀνθρώπων· παραδώσουσιν γὰρ ὑμᾶς εἰς συνέδρια, καὶ ἐν ταῖς συναγωγαῖς αὐτῶν μαστιγώσουσιν ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/017.yaml
  text: But beware of people[a], for they will hand you over to councils, and in their synagogues they will flog you.
translation:
  language: it
  text: Ma guardatevi dalla gente[a], perché vi consegneranno ai tribunali e vi flagelleranno nelle loro sinagoghe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «dagli uomini»; il termine greco è maschile plurale, ma qui indica genericamente le persone.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέχετε
  choice: guardatevi
  rationale: L’imperativo plurale esprime un avvertimento contro un pericolo; «guardatevi» è naturale, conciso e regge bene «da».
- source_word: δὲ
  choice: Ma
  rationale: Segnala il passaggio, con lieve contrasto, dall’istruzione precedente all’avvertimento.
- source_word: ἀπὸ τῶν ἀνθρώπων
  choice: dalla gente
  rationale: Con προσέχω, ἀπό indica la fonte del pericolo. Qui ἄνθρωποι è generico e non designa soltanto individui di sesso maschile.
- source_word: παραδώσουσιν
  choice: vi consegneranno
  rationale: Indica la consegna alle autorità; evita di specificare il tradimento, che il verbo non richiede in questa frase.
- source_word: συνέδρια
  choice: tribunali
  rationale: Il plurale si riferisce a organi locali con funzioni giudiziarie, non necessariamente al Sinedrio di Gerusalemme; «tribunali» rende chiaramente la funzione nel contesto.
- source_word: συναγωγαῖς
  choice: sinagoghe
  rationale: È la denominazione italiana corrente dei luoghi e delle comunità ebraiche qui menzionati.
- source_word: αὐτῶν
  choice: loro
  rationale: Il pronome indica l’associazione o appartenenza delle sinagoghe alle persone ostili appena menzionate.
- source_word: μαστιγώσουσιν
  choice: vi flagelleranno
  rationale: Rende una punizione corporale mediante frusta; il termine è dignitoso, preciso e adatto al contesto giudiziario.
theological_decisions:
- issue: Resa inclusiva di ἀνθρώπων
  choice: gente
  alternative: uomini
  rationale: Il maschile plurale greco ha qui valore generico e indica esseri umani ostili, non specificamente persone di sesso maschile. La nota conserva l’alternativa formale.
translation_notes:
  register: Italiano moderno, dignitoso e diretto. «Guardatevi» conserva la forza ammonitrice; «tribunali» esplicita naturalmente la funzione giudiziaria dei συνέδρια locali senza identificarli con il Sinedrio centrale.
