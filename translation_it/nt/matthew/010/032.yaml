id: MAT.10.32
reference: Matthew 10:32
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Πᾶς οὖν ὅστις ὁμολογήσει ἐν ἐμοὶ ἔμπροσθεν τῶν ἀνθρώπων, ὁμολογήσω κἀγὼ ἐν αὐτῷ ἔμπροσθεν τοῦ πατρός μου τοῦ ⸀ἐν οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/032.yaml
  text: Therefore everyone who confesses me before men[b][a], I also will confess before my Father who is in heaven.
translation:
  language: it
  text: Perciò, chiunque mi riconoscerà[a] davanti agli uomini[b], anch’io lo riconoscerò[a] davanti al Padre mio che è nei cieli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il greco dice più letteralmente «confesserà in me» e «confesserò in lui». La costruzione può esprimere il riconoscimento aperto di una persona o il dichiararsi dalla sua parte.
    reason: lexical_alternative
  - marker: b
    text: Oppure «davanti alle persone». Il termine greco è un plurale maschile usato qui con riferimento generico agli esseri umani.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς οὖν ὅστις
  choice: Perciò, chiunque
  rationale: «Chiunque» rende in modo naturale l’espressione generalizzante e inclusiva πᾶς ὅστις; «perciò» conserva il nesso inferenziale espresso da οὖν.
- source_word: ὁμολογήσει / ὁμολογήσω
  choice: riconoscerà / riconoscerò
  rationale: Nel contesto ὁμολογέω indica il riconoscimento aperto e pubblico di una persona. La ripetizione dello stesso verbo italiano conserva la reciprocità intenzionale della formulazione greca.
- source_word: ἐν ἐμοὶ / ἐν αὐτῷ
  choice: mi / lo
  rationale: Con ὁμολογέω, le espressioni greche con ἐν sono rese idiomaticamente in italiano mediante i pronomi oggetto. Una nota conserva la forma più letterale e la sua possibile sfumatura di adesione o presa di posizione.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: davanti agli uomini
  rationale: «Davanti» rende la presenza pubblica espressa da ἔμπροσθεν. Il plurale ἀνθρώπων è formalmente maschile ma ha qui riferimento umano generico; la nota segnala l’alternativa italiana inclusiva.
- source_word: κἀγώ
  choice: anch’io
  rationale: «Anch’io» conserva l’enfasi e la reciprocità di καὶ ἐγώ racchiuse nella crasi κἀγώ.
- source_word: τοῦ πατρός μου τοῦ ἐν οὐρανοῖς
  choice: del Padre mio che è nei cieli
  rationale: La formulazione conserva il possessivo, la relativa locativa e il plurale οὐρανοῖς, naturale anche nel registro biblico italiano.
theological_decisions:
- issue: Riconoscimento pubblico di Gesù e corrispondente riconoscimento da parte sua
  choice: Presentare direttamente la promessa reciproca, senza precisare oltre il momento o il meccanismo del riconoscimento davanti al Padre.
  alternative: Interpretare esplicitamente la seconda azione come una dichiarazione forense nel giudizio finale oppure limitare il versetto alla testimonianza presente dei discepoli.
  rationale: Il testo afferma una reciprocità solenne davanti al Padre, ma non esplicita qui una costruzione sistematica sul giudizio o sui meccanismi della salvezza.
- issue: Valore delle espressioni ἐν ἐμοὶ e ἐν αὐτῷ
  choice: Renderle idiomaticamente come oggetti personali di «riconoscere», segnalando in nota la costruzione greca.
  alternative: Tradurre formalmente «confesserà in me / confesserò in lui» oppure interpretare «si dichiarerà per me / mi dichiarerò per lui».
  rationale: La resa principale è comprensibile e mantiene il parallelismo, mentre la nota evita di cancellare l’insolita preposizione greca e la possibile sfumatura di adesione.
translation_notes:
  register: Italiano moderno, chiaro e dignitoso. «Riconoscere» evita un uso poco naturale di «confessare» riferito direttamente a una persona, pur mantenendo il carattere pubblico dell’atto tramite «davanti agli uomini». «Padre mio» e «nei cieli» conservano una sobria cadenza biblica senza risultare arcaici.
