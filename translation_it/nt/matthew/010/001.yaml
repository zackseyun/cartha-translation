id: MAT.10.1
reference: Matthew 10:1
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Καὶ προσκαλεσάμενος τοὺς δώδεκα μαθητὰς αὐτοῦ ἔδωκεν αὐτοῖς ἐξουσίαν πνευμάτων ἀκαθάρτων ὥστε ἐκβάλλειν αὐτὰ καὶ θεραπεύειν πᾶσαν νόσον καὶ πᾶσαν μαλακίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/001.yaml
  text: And calling his twelve disciples to himself[a], he gave them authority over unclean spirits[c][b], to cast them out and to heal every disease and every sickness.
translation:
  language: it
  text: Dopo aver chiamato a sé i suoi dodici discepoli, diede loro autorità sugli spiriti impuri[a], per scacciarli e guarire ogni malattia e ogni infermità[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «spiriti immondi».
    reason: lexical_alternative
  - marker: b
    text: 'I due termini greci sono correlati: possono essere resi «malattia» e «infermità», oppure «malattia» e «debolezza».'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: chiamati a sé
  rationale: Il participio aoristo medio indica che Gesù convocò i discepoli presso di sé; la costruzione italiana conserva sia l'anteriorità implicita sia la sfumatura riflessiva.
- source_word: τοὺς δώδεκα μαθητὰς αὐτοῦ
  choice: i suoi dodici discepoli
  rationale: «Discepoli» è il termine naturale e consolidato nel contesto evangelico; il possessivo rende αὐτοῦ senza rigidità.
- source_word: ἔδωκεν
  choice: diede
  rationale: Riproduce direttamente il senso semplice di δίδωμι, senza introdurre la sfumatura più interpretativa di «concesse».
- source_word: ἐξουσίαν
  choice: autorità
  rationale: Esprime il diritto o l'autorità conferita per agire, più precisamente della sola idea di forza insita in «potere».
- source_word: πνευμάτων ἀκαθάρτων
  choice: sugli spiriti impuri
  rationale: Il genitivo dipendente da ἐξουσίαν è reso naturalmente con «su»; «impuri» comunica in italiano corrente la categoria religiosa e spirituale di ἀκάθαρτος.
- source_word: ὥστε ἐκβάλλειν αὐτά
  choice: per scacciarli
  rationale: «Per» mantiene aperta la sfumatura tra scopo e risultato della costruzione ὥστε con infinito; il pronome rinvia agli spiriti.
- source_word: θεραπεύειν
  choice: guarire
  rationale: Nel contesto indica il risanamento dei malati ed è reso naturalmente con «guarire» usato transitivamente.
- source_word: πᾶσαν νόσον
  choice: ogni malattia
  rationale: «Malattia» è una resa ampia e corrente di νόσος.
- source_word: πᾶσαν μαλακίαν
  choice: ogni infermità
  rationale: «Infermità» conserva la distinzione dal precedente νόσος e riflette la gamma semantica di debolezza o affezione debilitante.
theological_decisions:
- issue: Natura dell'incarico conferito ai dodici
  choice: Gesù diede loro autorità sugli spiriti impuri
  alternative: Gesù diede loro potere sugli spiriti impuri
  rationale: «Autorità» rende ἐξουσία come facoltà conferita da Gesù, senza ridurla a mera forza né aggiungere formulazioni dottrinali estranee al versetto.
- issue: Rapporto espresso da ὥστε con gli infiniti
  choice: per scacciarli e guarire
  alternative: così da scacciarli e guarire
  rationale: La preposizione «per» è naturale in italiano e non forza una netta separazione tra finalità ed esito, che la costruzione greca può lasciare sfumata.
translation_notes:
  register: Italiano standard moderno, dignitoso e scorrevole. L'apertura con «Poi» collega il versetto alla narrazione precedente; la forma «chiamati a sé» evita una subordinata pesante e conserva il valore del participio greco. La coppia «malattia e infermità» mantiene la distinzione lessicale dell'originale.
