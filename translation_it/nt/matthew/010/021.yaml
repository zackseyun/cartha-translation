  text: παραδώσει δὲ ἀδελφὸς ἀδελφὸν εἰς θάνατον καὶ πατὴρ τέκνον, καὶ ἐπαναστήσονται τέκνα ἐπὶ γονεῖς καὶ θανατώσουσιν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/021.yaml
  text: And brother will hand over brother to death[a], and a father his child, and children will rise up against parents and put them to death.
translation:
  language: it
  text: Un fratello consegnerà suo fratello a morte[a], e un padre consegnerà suo figlio; i figli insorgeranno contro i genitori e li metteranno a morte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «darà in consegna»; in un contesto di slealtà il verbo può anche avere il senso di «tradire».
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδώσει
  choice: consegnerà
  rationale: Il futuro di παραδίδωμι indica qui il consegnare una persona a poteri ostili, con esito mortale. «Consegnare» conserva il valore concreto senza specificare necessariamente il tradimento.
- source_word: ἀδελφὸς ... ἀδελφὸν
  choice: il fratello ... il fratello
  rationale: La ripetizione mantiene la formulazione rappresentativa e il riferimento maschile del greco, evitando di ampliare il senso a «fratelli e sorelle».
- source_word: εἰς θάνατον
  choice: alla morte
  rationale: 'La locuzione esprime l''esito o il fine della consegna: la persona viene consegnata perché sia uccisa.'
- source_word: πατὴρ τέκνον
  choice: il padre ... il proprio figlio
  rationale: τέκνον designa un figlio senza specificarne il sesso; in italiano «figlio» può funzionare come termine relazionale non marcato in questo costrutto. «Farà lo stesso» integra idiomaticamente il verbo sottinteso nel greco.
- source_word: ἐπαναστήσονται
  choice: insorgeranno contro
  rationale: Rende la viva immagine dell'ostile levarsi contro qualcuno senza restringerla a una ribellione politica.
- source_word: τέκνα
  choice: i figli
  rationale: Il plurale τέκνα comprende la prole senza limitarla ai maschi; «figli» è il normale plurale inclusivo italiano nel rapporto con i genitori.
- source_word: ἐπὶ γονεῖς
  choice: contro i genitori
  rationale: Con un verbo di ostilità, ἐπί con l'accusativo significa «contro»; γονεῖς indica i genitori.
- source_word: θανατώσουσιν
  choice: li metteranno a morte
  rationale: θανατόω indica il causare deliberatamente la morte e può evocare anche un'esecuzione; «mettere a morte» ne conserva la gravità.
- source_word: αὐτούς
  choice: li
  rationale: Il pronome riprende naturalmente «i genitori», mantenendo il flusso del testo greco.
theological_decisions:
- issue: Termini familiari distinti per genere e termini inclusivi
  choice: Conservare «fratello» per ἀδελφός e usare «figli/genitori» per i termini di portata più ampia
  alternative: Rendere ἀδελφός con il generico «persona della stessa famiglia» o «fratello o sorella»
  rationale: Il versetto contrappone relazioni familiari precise. ἀδελφός è maschile, mentre τέκνα e γονεῖς hanno portata inclusiva; la resa italiana conserva questa differenza senza introdurre specificazioni assenti.
translation_notes:
  register: Italiano standard moderno, dignitoso e comprensibile. La coordinazione iniziale conserva la solennità del detto; «farà lo stesso» evita un'ellissi poco naturale in italiano, senza aggiungere un'azione diversa da quella sottintesa nel greco.
