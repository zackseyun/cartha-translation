revisions:
- from: Il fratello consegnerà il fratello alla morte[a], e il padre farà lo stesso con il proprio figlio; i figli insorgeranno contro i genitori e li metteranno a morte.
  to: Un fratello consegnerà suo fratello a morte[a], e un padre consegnerà suo figlio; i figli insorgeranno contro i genitori e li metteranno a morte.
  rationale: La revisione ripristina il verbo sottinteso nella seconda coppia, conservando il parallelismo di παραδώσει ... πατήρ τέκνον, elimina l'enfasi non richiesta di «proprio» e adotta la formulazione italiana più idiomatica del singolare rappresentativo. La nota resta ancorata a «a morte» e presenta una vera alternativa lessicale senza alterare il valore risultativo della locuzione greca.
