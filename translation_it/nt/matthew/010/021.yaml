review_pass:
  verdict: revise
  source_fidelity: 'La struttura e il senso generale sono fedeli: παραδώσει è reso bene con «consegnerà», εἰς θάνατον con «a morte», ἐπαναστήσονται con «insorgeranno contro», e θανατώσουσιν con «metteranno a morte». Tuttavia «farà lo stesso con il proprio figlio» sostituisce l''ellissi greca con una perifrasi che indebolisce la ripetizione intenzionale di «consegnare» e «proprio» aggiunge un''enfasi possessiva non espressa dal testo. La ripetizione del verbo è più chiara e più vicina alla fonte.'
  naturalness: «Il fratello consegnerà il fratello» suona innaturalmente definito in italiano per un singolare rappresentativo. «Un fratello consegnerà suo fratello» e «un padre consegnerà suo figlio» sono formulazioni moderne, idiomatiche e conservano i rapporti familiari del greco. «A morte» è inoltre più usuale con «consegnare» di «alla morte».
  terminology: «Fratello» conserva il maschile di ἀδελφός; «figlio» e «figli» sono appropriati per τέκνον/τέκνα nell'italiano corrente, e «genitori» rende bene γονεῖς. «Mettere a morte» mantiene il carattere deliberato e potenzialmente formale di θανατόω senza imporre che si tratti necessariamente di un'esecuzione giudiziaria.
  issues:
  - severity: medium
    issue: Perifrasi «farà lo stesso con il proprio figlio»
    rationale: Il greco sottintende παραδώσει dopo πατήρ, non una generica azione equivalente. Ripetere «consegnerà» preserva il parallelismo e chiarisce l'azione; «proprio» è un'intensificazione non necessaria.
  - severity: low
    issue: Articoli determinativi nella prima coppia familiare
    rationale: «Il fratello ... il fratello» può suggerire persone determinate, mentre il singolare greco ha qui valore rappresentativo. Gli indeterminativi con possessivo rendono la frase più naturale senza cambiarne il significato.
  - severity: low
    issue: Formulazione della nota lessicale
    rationale: «Consegnerà perché sia messo a morte» esplicita il risultato, ma non è un'alternativa lessicale diretta. «Darà in consegna» è un'alternativa italiana più propriamente lessicale; la possibilità di «tradire» va mantenuta come valore contestuale.
  revised_text: Un fratello consegnerà suo fratello a morte[a], e un padre consegnerà suo figlio; i figli insorgeranno contro i genitori e li metteranno a morte.
  revised_footnotes:
  - marker: a
    text: O «darà in consegna»; in un contesto di slealtà il verbo può anche avere il senso di «tradire».
    reason: lexical_alternative
