  text: Σίμων ὁ ⸀Καναναῖος καὶ Ἰούδας ⸀ὁ Ἰσκαριώτης ὁ καὶ παραδοὺς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/004.yaml
  text: Simon the Cananaean[a], and Judas Iscariot[b], who also betrayed him.
translation:
  language: it
  text: Simone il Cananeo[a] e Giuda Iscariota, che pure lo tradì[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oppure «Simone lo Zelota». Il greco ha «Cananeo», probabilmente da una designazione aramaica o ebraica tradizionalmente intesa nel senso di «Zelota».
    reason: lexical_alternative
  - marker: b
    text: O «che lo consegnò». Il verbo greco può significare «consegnare»; nel caso di Giuda, il contesto gli conferisce il senso di «tradire».
    reason: alternative_reading
lexical_decisions:
- source_word: Καναναῖος
  choice: Cananeo
  rationale: Traslittera/adatta in italiano la designazione greca di origine aramaica o ebraica, invece di sostituirla nel testo con l'interpretazione «Zelota»; l'alternativa è indicata in nota.
- source_word: Ἰσκαριώτης
  choice: Iscariota
  rationale: Forma italiana tradizionale e corrente della designazione personale, corrispondente alla traslitterazione del greco.
- source_word: παραδοὺς
  choice: tradì
  rationale: Nel contesto narrativo di Giuda, «tradì» esprime naturalmente la consegna sleale di Gesù, pur lasciando in nota il senso più generale del verbo, «consegnò».
- source_word: ὁ καὶ παραδοὺς αὐτόν
  choice: che poi lo tradì
  rationale: La relativa rende in italiano naturale l'articolo con participio attributivo. «Poi» esprime qui il valore contestuale di καί come nota ulteriore e anticipatrice sull'azione successiva di Giuda.
theological_decisions:
- issue: Se rendere παραδοὺς con il più neutro «consegnò» o con il contestualmente connotato «tradì»
  choice: tradì
  alternative: consegnò
  rationale: Nel catalogo apostolico Giuda viene identificato mediante l'atto per cui sarà noto nel racconto; «tradì» ne comunica la forza relazionale e morale senza aggiungere una tesi dottrinale. La nota conserva la maggiore ampiezza semantica del verbo greco.
translation_notes:
  register: Italiano standard moderno, dignitoso e scorrevole. Si conservano le forme tradizionali dei nomi «Simone» e «Giuda Iscariota»; «Cananeo» mantiene l'ambiguità lessicale del testo greco, chiarita senza risolverla nel corpo del versetto.
