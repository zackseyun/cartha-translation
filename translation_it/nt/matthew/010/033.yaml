id: MAT.10.33
reference: Matthew 10:33
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ὅστις ⸂δ’ ἂν⸃ ἀρνήσηταί με ἔμπροσθεν τῶν ἀνθρώπων, ἀρνήσομαι ⸂κἀγὼ αὐτὸν⸃ ἔμπροσθεν τοῦ πατρός μου τοῦ ⸀ἐν οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/033.yaml
  text: But whoever denies me before men[b][a], I also will deny him before my Father who is in heaven.
translation:
  language: it
  text: Ma chiunque mi rinnegherà davanti agli uomini, anch’io lo rinnegherò davanti al Padre mio che è nei cieli.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅστις δ’ ἂν
  choice: Ma chiunque
  rationale: ὅστις con ἄν e il congiuntivo introduce una condizione generale; «chiunque» ne conserva la portata. δέ segna il contrasto con il versetto precedente ed è reso con «Ma».
- source_word: ἀρνήσηταί με
  choice: mi rinnegherà
  rationale: «Rinnegare» esprime qui il rifiuto pubblico del rapporto con Gesù. Il futuro italiano è naturale in una proposizione generale proiettata verso l’esito futuro e si accorda con il successivo ἀρνήσομαι.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: davanti agli uomini
  rationale: «Davanti» rende la presenza pubblica indicata da ἔμπροσθεν; «gli uomini» conserva il plurale maschile greco, qui usato con valore generico.
- source_word: ἀρνήσομαι κἀγὼ αὐτὸν
  choice: anch’io lo rinnegherò
  rationale: La ripetizione di «rinnegare» mantiene la netta reciprocità retorica; «anch’io» rende l’enfasi corrispondente di κἀγώ.
- source_word: ἔμπροσθεν τοῦ πατρός μου
  choice: davanti al Padre mio
  rationale: Resa diretta che conserva sia il rapporto filiale espresso da «mio» sia il parallelismo con «davanti agli uomini».
- source_word: τοῦ ἐν οὐρανοῖς
  choice: che è nei cieli
  rationale: Il plurale «nei cieli» segue il greco οὐρανοῖς ed è comprensibile e dignitoso nell’italiano biblico moderno.
theological_decisions:
- issue: Reciprocità del rinnegamento
  choice: mi rinnegherà … anch’io lo rinnegherò
  alternative: mi negherà … anch’io lo negherò
  rationale: Usare lo stesso verbo in entrambe le proposizioni conserva la simmetria solenne del testo. «Rinnegare» comunica più naturalmente in italiano il ripudio pubblico di una relazione personale senza aggiungere una specifica interpretazione dottrinale.
- issue: Valore generico di ἀνθρώπων e riferimento di αὐτόν
  choice: davanti agli uomini … lo rinnegherò
  alternative: davanti alla gente … rinnegherò quella persona
  rationale: Il greco impiega forme maschili con valore generale. La resa italiana mantiene questa forma grammaticale, che nel contesto comprende chiunque, senza restringere il riferimento ai soli maschi.
translation_notes:
  register: Italiano moderno, chiaro e dignitoso. La formulazione conserva il parallelismo pubblico e giudiziario del versetto, evita parafrasi interpretative e mantiene il plurale greco «nei cieli».
