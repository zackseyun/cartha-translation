id: MAT.10.22
reference: Matthew 10:22
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: καὶ ἔσεσθε μισούμενοι ὑπὸ πάντων διὰ τὸ ὄνομά μου· ὁ δὲ ὑπομείνας εἰς τέλος οὗτος σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/022.yaml
  text: And you will be hated by all because of my name[d][c][b][a]. But the one who endures to the end will be saved.
translation:
  language: it
  text: E sarete odiati da tutti a causa del mio nome. Ma chi avrà perseverato sino alla fine sarà salvato.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Sarà salvato» può anche essere inteso come «sarà liberato» o «sarà tratto in salvo», a seconda di come si comprende il contesto.
    reason: alternative_reading
lexical_decisions:
- source_word: μισούμενοι ὑπὸ πάντων
  choice: odiati da tutti
  rationale: La costruzione perifrastica futura indica una condizione futura; «odiati da tutti» è naturale in italiano e conserva la portata generale di πάντων.
- source_word: διὰ τὸ ὄνομά μου
  choice: a causa del mio nome
  rationale: διά con l’accusativo esprime qui la causa. «Il mio nome» conserva il riferimento alla persona, all’autorità e all’appartenenza a Gesù senza esplicitarlo oltre il testo.
- source_word: ὁ δὲ ὑπομείνας εἰς τέλος
  choice: Ma chi avrà perseverato sino alla fine
  rationale: Il participio aoristo sostantivato presenta chi porta la perseveranza fino al termine; il futuro anteriore italiano rende bene l’anteriorità implicita rispetto a «sarà salvato». «Perseverato» esprime la fermezza sotto la persecuzione.
- source_word: οὗτος
  choice: chi … sarà
  rationale: Il pronome greco è ripreso naturalmente in italiano dalla costruzione «chi… sarà»; tradurlo con «costui» conserverebbe più visibilmente l’enfasi, ma produrrebbe qui una formulazione più marcata e meno scorrevole.
- source_word: σωθήσεται
  choice: sarà salvato
  rationale: La forma passiva mantiene l’ampiezza semantica di σῴζω e non restringe il senso alla sola liberazione fisica né definisce esplicitamente l’agente.
theological_decisions:
- issue: Rapporto fra perseveranza sino alla fine e salvezza
  choice: Mantenere il nesso espresso dal testo senza precisarne un sistema dottrinale
  alternative: Interpretare la frase esclusivamente come liberazione fisica, esclusivamente come salvezza escatologica, oppure come formulazione completa di una specifica dottrina della perseveranza
  rationale: Il versetto collega la perseveranza durante l’ostilità alla salvezza, ma non risolve da solo natura, modalità e quadro dottrinale di tale rapporto.
- issue: Portata di σωθήσεται
  choice: sarà salvato
  alternative: sarà liberato / sarà tratto in salvo
  rationale: «Sarà salvato» preserva sia la possibile dimensione escatologica sia il più ampio valore di liberazione, evitando di restringere il testo.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. «Sino alla fine» conserva il tono biblico senza risultare arcaico; «a causa del mio nome» è chiaro e fedele alla relazione causale del greco. La congiunzione iniziale «E» mantiene καί e il legame con il contesto precedente.
