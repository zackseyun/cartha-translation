  source_fidelity: 'La resa segue con precisione il greco: «sarete odiati» riproduce la perifrasi futura ἔσεσθε μισούμενοι; «da tutti» conserva l’agente personale e la portata generale di ὑπὸ πάντων; «a causa del mio nome» rende correttamente διά con l’accusativo. «Chi avrà perseverato sino alla fine sarà salvato» esprime in italiano in modo naturale il participio aoristo sostantivato con valore compiuto rispetto al futuro σωθήσεται. L’enfasi resumptiva di οὗτος è assorbita senza perdita significativa nella costruzione italiana.'
  naturalness: Il testo è scorrevole, dignitoso e conforme all’italiano moderno standard. Il futuro anteriore «avrà perseverato» è appropriato nel registro biblico e chiarisce bene la relazione con «sarà salvato». «Sino alla fine» è naturale; non richiede normalizzazione.
  terminology: «Salvato» mantiene opportunamente l’ampiezza di σωθήσεται senza imporre una lettura esclusivamente fisica o esclusivamente escatologica. «Perseverato» è adatto al contesto di ostilità e non introduce una formulazione dottrinale estranea. Il richiamo a «mio nome» conserva il linguaggio del testo.
