  source_fidelity: 'Il testo rende con precisione la sequenza del greco: τότε («Allora»), il presente storico λέγει («dice»), l''imperativo Ἔκτεινόν («Stendi»), la ripresa narrativa ἐξέτεινεν («la stese») e il passivo ἀπεκατεστάθη («fu ristabilita»). «Sana come l’altra» conserva sia ὑγιής sia il confronto implicito con l''altra mano.'
  naturalness: L'italiano è moderno, scorrevole e di registro narrativo dignitoso. L'omissione del possessivo in «Stendi la mano» è idiomatica; il femminile di «ristabilita» e «sana» chiarisce adeguatamente che il soggetto sottinteso è la mano.
