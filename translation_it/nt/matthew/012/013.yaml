id: MAT.12.13
reference: Matthew 12:13
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: τότε λέγει τῷ ἀνθρώπῳ· Ἔκτεινόν ⸂σου τὴν χεῖρα⸃· καὶ ἐξέτεινεν, καὶ ἀπεκατεστάθη ὑγιὴς ὡς ἡ ἄλλη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/013.yaml
  text: Then he says to the man[a], “Stretch out your hand.” And he stretched it out, and it was restored[b], healthy like the other one.
translation:
  language: it
  text: 'Allora dice all’uomo: «Stendi la mano». Egli la stese, e fu ristabilita[a], sana come l’altra[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oppure «fu guarita»; il verbo greco sottolinea il ripristino della mano nella sua condizione appropriata.
    reason: lexical_alternative
  - marker: b
    text: Letteralmente «sana come l’altra»; «l’altra» si riferisce all’altra mano dell’uomo.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Allora
  rationale: Segna la successione narrativa in modo naturale e immediato.
- source_word: λέγει
  choice: dice
  rationale: Conserva il presente storico greco e la vivacità narrativa di Matteo.
- source_word: τῷ ἀνθρώπῳ
  choice: all’uomo
  rationale: Nel contesto indica uno specifico individuo di sesso maschile.
- source_word: Ἔκτεινόν
  choice: Stendi
  rationale: Rende direttamente l’imperativo aoristo di ἐκτείνω con un’espressione italiana corrente.
- source_word: σου τὴν χεῖρα
  choice: la mano
  rationale: In italiano il possessivo è normalmente omesso con le parti del corpo quando il riferimento è chiaro; χείρ indica qui la mano.
- source_word: ἐξέτεινεν
  choice: la stese
  rationale: Riprende il verbo del comando e aggiunge il pronome oggetto richiesto dalla naturalezza dell’italiano.
- source_word: ἀπεκατεστάθη
  choice: fu ristabilita
  rationale: Il passivo di ἀποκαθίστημι sottolinea il ritorno della mano alla condizione appropriata, più precisamente del generico «fu guarita».
- source_word: ὑγιὴς
  choice: sana
  rationale: Esprime chiaramente la condizione di salute e integrità fisica della mano.
- source_word: ὡς ἡ ἄλλη
  choice: come l’altra
  rationale: Il femminile greco rimanda implicitamente all’altra mano; anche in italiano il referente resta chiaro senza ripeterlo.
theological_decisions:
- issue: Natura della descrizione della guarigione
  choice: La mano viene descritta come ristabilita e sana.
  alternative: La mano fu guarita o resa integra.
  rationale: La formulazione conserva l’accento lessicale sul ripristino senza aggiungere interpretazioni dottrinali alla narrazione del miracolo.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. Il presente storico «dice» conserva la vivacità del greco; la formulazione mantiene distinti il ripristino e la condizione sana espressi nel testo fonte.
