lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Mantiene il semplice collegamento narrativo del greco senza aggiungere una sfumatura temporale o causale.
- source_word: ἐπετίμησεν
  choice: ordinò loro severamente
  rationale: Nel contesto il verbo introduce una direttiva energica. Questa resa comunica sia l'autorità del comando sia la sua intensità, evitando di suggerire necessariamente una colpa morale nei destinatari.
- source_word: αὐτοῖς
  choice: loro
  rationale: Rende direttamente il pronome al dativo plurale riferito alle persone menzionate nel contesto precedente.
- source_word: ἵνα μὴ
  choice: di non
  rationale: Dopo un verbo di comando, rende in italiano naturale il contenuto negativo espresso da ἵνα con μή e il congiuntivo.
- source_word: φανερὸν αὐτὸν ποιήσωσιν
  choice: farlo conoscere
  rationale: Rende l'espressione idiomatica nel senso di rendere qualcuno noto o divulgarne pubblicamente l'identità, conservando αὐτόν come oggetto personale.
theological_decisions:
- issue: Natura della direttiva di Gesù riguardo alla pubblicità
  choice: Un ordine energico di non renderlo noto
  alternative: Un rimprovero rivolto ai destinatari oppure un semplice avvertimento
  rationale: Il verbo greco può esprimere rimprovero, severo ammonimento o comando. La proposizione seguente mostra chiaramente una direttiva contro la divulgazione, ma il versetto non ne esplicita la ragione teologica; la traduzione non la aggiunge.
translation_notes:
  register: Italiano moderno, dignitoso e lineare. «Ordinò loro severamente» conserva la forza di ἐπετίμησεν; la nota segnala l'alternativa lessicale senza appesantire il testo.
