id: MAT.12.45
reference: Matthew 12:45
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: τότε πορεύεται καὶ παραλαμβάνει μεθ’ ἑαυτοῦ ἑπτὰ ἕτερα πνεύματα πονηρότερα ἑαυτοῦ, καὶ εἰσελθόντα κατοικεῖ ἐκεῖ· καὶ γίνεται τὰ ἔσχατα τοῦ ἀνθρώπου ἐκείνου χείρονα τῶν πρώτων. οὕτως ἔσται καὶ τῇ γενεᾷ ταύτῃ τῇ πονηρᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/045.yaml
  text: Then it goes and brings with itself seven other spirits more evil than itself[a], and they enter and live there; and the last state of that man becomes worse than the first[b]. So it will be also with this evil generation.
translation:
  language: it
  text: Allora va e prende con sé altri sette spiriti più malvagi di lui[a]; essi entrano e si stabiliscono lì. E la condizione finale di quell’uomo diventa peggiore di quella iniziale[b]. Lo stesso accadrà anche a questa generazione malvagia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «sette spiriti diversi, più malvagi di lui».'
    reason: lexical_alternative
  - marker: b
    text: 'Il greco dice letteralmente: «le ultime cose di quell’uomo diventano peggiori delle prime», espressione che indica che la sua condizione finale è peggiore di quella precedente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Allora
  rationale: Segna il passaggio alla fase successiva del racconto con un avverbio temporale naturale nell’italiano corrente.
- source_word: πορεύεται καὶ παραλαμβάνει μεθ’ ἑαυτοῦ
  choice: va e prende con sé
  rationale: Conserva la sequenza vivace dei presenti greci e rende chiaramente l’idea dell’accompagnamento.
- source_word: ἑπτὰ ἕτερα πνεύματα
  choice: altri sette spiriti
  rationale: ἕτερα indica anzitutto spiriti aggiuntivi rispetto al primo; «altri sette» è naturale e non insiste indebitamente su una diversità di natura.
- source_word: πονηρότερα ἑαυτοῦ
  choice: più malvagi di lui
  rationale: Rende il comparativo morale; il pronome maschile è richiesto in italiano dal sostantivo «spirito».
- source_word: εἰσελθόντα κατοικεῖ ἐκεῖ
  choice: essi entrano e si stabiliscono lì
  rationale: Il participio neutro plurale si riferisce agli spiriti; il verbo greco al singolare può concordare con un soggetto neutro plurale. La resa italiana usa il plurale e comunica l’idea di prendere dimora.
- source_word: τὰ ἔσχατα τοῦ ἀνθρώπου ἐκείνου
  choice: la condizione finale di quell’uomo
  rationale: Rende in italiano comprensibile l’espressione idiomatica greca senza perdere il contrasto tra lo stato finale e quello iniziale.
- source_word: χείρονα τῶν πρώτων
  choice: peggiore di quella iniziale
  rationale: Esplicita il termine di paragone implicito e conserva il contrasto temporale dell’originale.
- source_word: οὕτως ἔσται καὶ
  choice: Lo stesso accadrà anche
  rationale: Esprime con naturalezza l’applicazione analogica dell’esempio alla generazione presente.
- source_word: τῇ γενεᾷ ταύτῃ τῇ πονηρᾷ
  choice: a questa generazione malvagia
  rationale: Segue direttamente il riferimento e la qualificazione morale del testo greco.
theological_decisions:
- issue: Resa di πνεύματα nel contesto demoniaco
  choice: spiriti
  alternative: demòni
  rationale: Il greco usa «spiriti» e il contesto precedente ne ha già precisato il carattere impuro; mantenere il termine non introduce una specificazione lessicale assente dalla frase.
- issue: Resa di ἀνθρώπου
  choice: quell’uomo
  alternative: quella persona
  rationale: L’esempio greco è singolare e presenta ἄνθρωπος al maschile; «quell’uomo» conserva questa forma rappresentativa senza neutralizzarla.
- issue: Concordanza di κατοικεῖ con il neutro plurale εἰσελθόντα
  choice: essi entrano e si stabiliscono
  alternative: entrati, vi si stabilisce
  rationale: In greco un soggetto neutro plurale può reggere un verbo al singolare; la resa plurale italiana collega correttamente entrambe le azioni ai sette spiriti senza postulare un cambio di soggetto.
translation_notes:
  register: Italiano standard moderno, chiaro e dignitoso. I presenti narrativi mantengono la vivacità dell’immagine; «si stabiliscono» comunica il senso durativo di κατοικέω meglio del semplice «abitano» in questo contesto. Le note conservano le principali alternative lessicali e spiegano l’idioma greco.
