source:
  edition: SBLGNT
  text: ⸂ἐξελθόντες δὲ οἱ Φαρισαῖοι συμβούλιον ἔλαβον κατ’ αὐτοῦ⸃ ὅπως αὐτὸν ἀπολέσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/014.yaml
  text: But the Pharisees went out and conspired against him, how they might destroy him.
translation:
  language: it
  text: Ma i farisei, usciti, tennero consiglio contro di lui su come eliminarlo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il greco dice letteralmente «distruggerlo»; nel contesto può significare «ucciderlo» o «metterlo a morte».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντες
  choice: usciti
  rationale: Il participio aoristo esprime un'azione anteriore o concomitante rispetto al consultarsi; la forma italiana conserva l'atto dell'uscire con naturalezza.
- source_word: δὲ
  choice: Ma
  rationale: Segnala il contrasto narrativo tra l'azione di Gesù e la reazione ostile dei farisei.
- source_word: οἱ Φαρισαῖοι
  choice: i farisei
  rationale: Denominazione italiana corrente del gruppo giudaico.
- source_word: συμβούλιον ἔλαβον
  choice: tennero consiglio
  rationale: Riproduce abbastanza da vicino l'espressione idiomatica greca senza anticipare nella formulazione il contenuto ostile, che è chiarito da κατ’ αὐτοῦ e dalla proposizione seguente.
- source_word: κατ’ αὐτοῦ
  choice: contro di lui
  rationale: κατά con il genitivo ha qui valore avversativo.
- source_word: ὅπως αὐτὸν ἀπολέσωσιν
  choice: su come farlo morire
  rationale: ὅπως introduce ciò su cui verte la deliberazione; nel contesto ἀπόλλυμι indica l'eliminazione fisica di Gesù. La resa italiana è naturale e rende chiaro l'intento letale, mentre la nota conserva l'alternativa lessicalmente più ampia.
theological_decisions:
- issue: Grado di specificità nella resa di ἀπολέσωσιν
  choice: farlo morire
  alternative: distruggerlo; ucciderlo; metterlo a morte
  rationale: Benché ἀπόλλυμι abbia un campo semantico più ampio, riferito a una persona quale oggetto di un piano ostile indica qui un intento letale. «Farlo morire» conserva la sfumatura deliberativa e causativa senza specificare il mezzo; la nota segnala la forma più letterale.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. «Tennero consiglio» mantiene una moderata formalità biblica ma resta comprensibile; la sintassi segue da vicino la progressione del greco.
