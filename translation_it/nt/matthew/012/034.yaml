  source_fidelity: Il testo rende accuratamente la metafora insultante di γεννήματα ἐχιδνῶν, la domanda retorica πῶς δύνασθε, il giudizio morale di πονηροί e il nesso fra cuore e parola. Tuttavia, «parla da ciò che trabocca dal cuore» calca in modo poco idiomatico ἐκ ... τῆς καρδίας; una resa con «dall’abbondanza del cuore» conserva direttamente sia l’origine figurata sia il valore di περίσσευμα.
  naturalness: '«Progenie di vipere» e «come potete dire cose buone, voi che siete malvagi?» sono naturali, incisivi e di registro appropriato. La clausola finale necessita di una lieve revisione: in italiano moderno «parlare da ciò che...» suona innaturale in questo contesto.'
  terminology: «Progenie», «vipere», «malvagi», «cuore» e «bocca» sono scelte adeguate. «Abb­ondanza» è un equivalente italiano diretto e naturale per περίσσευμα; l’alternativa con «ciò che trabocca» può essere mantenuta in nota.
