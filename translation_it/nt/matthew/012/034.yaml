  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: γεννήματα ἐχιδνῶν, πῶς δύνασθε ἀγαθὰ λαλεῖν πονηροὶ ὄντες; ἐκ γὰρ τοῦ περισσεύματος τῆς καρδίας τὸ στόμα λαλεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/034.yaml
  text: Offspring of vipers[b][a], how can you speak good things when you are evil? For out of the overflow of the heart the mouth speaks.
translation:
  language: it
  text: Progenie di vipere[a], come potete dire cose buone, voi che siete malvagi? Infatti, la bocca parla dall’abbondanza del cuore.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: «Razza di vipere».'
    reason: lexical_alternative
  - marker: b
    text: 'O: «Infatti, la bocca parla da ciò che trabocca dal cuore».'
    reason: lexical_alternative
lexical_decisions:
- source_word: γεννήματα ἐχιδνῶν
  choice: Progenie di vipere
  rationale: «Progenie» conserva l’idea di ciò che è generato e, con «di vipere», mantiene la forte metafora di discendenza e carattere. «Razza di vipere» è un’alternativa italiana più tradizionale, riportata in nota.
- source_word: πῶς δύνασθε
  choice: come potete
  rationale: Rende in italiano corrente la domanda retorica che esprime incapacità o impossibilità morale.
- source_word: ἀγαθὰ λαλεῖν
  choice: dire cose buone
  rationale: Il neutro plurale ἀγαθά è usato come sostantivo; «dire cose buone» ne conserva il senso con naturalezza.
- source_word: πονηροὶ ὄντες
  choice: voi che siete malvagi
  rationale: La relativa mantiene la circostanza espressa dal participio senza decidere rigidamente tra valore causale e concessivo; «malvagi» conserva il peso morale di πονηροί.
- source_word: ἐκ γὰρ τοῦ περισσεύματος τῆς καρδίας
  choice: infatti… da ciò che trabocca dal cuore
  rationale: «Trabocca» rende dinamicamente l’immagine di περίσσευμα come sovrabbondanza o eccedenza che si riversa all’esterno. La nota conserva la resa più formale «dall’abbondanza del cuore».
- source_word: τῆς καρδίας
  choice: dal cuore
  rationale: «Cuore» mantiene il termine biblico per il centro interiore della persona, senza restringerlo alle sole emozioni.
- source_word: τὸ στόμα λαλεῖ
  choice: la bocca… parla
  rationale: Riproduce direttamente l’immagine greca che collega le parole pronunciate alla condizione interiore.
theological_decisions:
- issue: Forza metaforica di καρδία
  choice: Conservare «cuore» come designazione del centro interiore della persona.
  alternative: «interiorità» oppure «mente»
  rationale: La formulazione greca comprende pensiero, volontà e disposizione morale; una parafrasi più specifica ne restringerebbe indebitamente il significato.
- issue: Caratterizzazione morale in πονηροὶ ὄντες
  choice: «voi che siete malvagi»
  alternative: «voi che siete cattivi» oppure «essendo malvagi»
  rationale: «Malvagi» preserva il giudizio etico del rimprovero senza attenuarlo; la costruzione relativa è naturale e lascia aperto il preciso rapporto logico del participio con la domanda.
translation_notes:
  register: Italiano standard moderno, dignitoso e diretto. La formulazione conserva la durezza del rimprovero, la metafora della discendenza e l’immagine del cuore che trabocca nella parola, evitando sia arcaismi sia attenuazioni moralistiche.
