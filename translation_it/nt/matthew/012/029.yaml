id: MAT.12.29
reference: Matthew 12:29
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ἢ πῶς δύναταί τις εἰσελθεῖν εἰς τὴν οἰκίαν τοῦ ἰσχυροῦ καὶ τὰ σκεύη αὐτοῦ ⸀ἁρπάσαι, ἐὰν μὴ πρῶτον δήσῃ τὸν ἰσχυρόν; καὶ τότε τὴν οἰκίαν αὐτοῦ ⸀διαρπάσει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/029.yaml
  text: Or how can someone enter the strong man's house and seize his goods[b][a], unless he first binds the strong man? And then he will plunder his house.
translation:
  language: it
  text: Oppure, come può qualcuno entrare nella casa dell’uomo forte e impadronirsi dei suoi beni[a], se prima non lega[b] l’uomo forte? Allora saccheggerà la sua casa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «le sue cose»; il termine greco può indicare letteralmente oggetti, recipienti o utensili e, più in generale, i beni posseduti.
    reason: lexical_alternative
  - marker: b
    text: O «immobilizza legandolo».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Oppure
  rationale: Introduce un’ulteriore immagine esplicativa collegata all’argomentazione precedente, conservando il valore disgiuntivo del greco.
- source_word: πῶς δύναταί τις
  choice: come può qualcuno
  rationale: Mantiene la forma della domanda retorica e rende in italiano corrente il soggetto indefinito τις.
- source_word: εἰσελθεῖν εἰς τὴν οἰκίαν
  choice: entrare nella casa
  rationale: Resa diretta e naturale della costruzione infinitiva e dell’immagine concreta.
- source_word: τοῦ ἰσχυροῦ / τὸν ἰσχυρόν
  choice: dell’uomo forte / l’uomo forte
  rationale: L’aggettivo sostantivato indica qui una figura maschile nella similitudine; «uomo forte» conserva l’immagine concreta senza interpretarla allegoricamente.
- source_word: τὰ σκεύη αὐτοῦ
  choice: i suoi beni
  rationale: Nel contesto di una casa depredata, σκεύη si estende dagli oggetti o utensili ai beni posseduti; «beni» è naturale e sufficientemente ampio.
- source_word: ἁρπάσαι
  choice: impadronirsi
  rationale: Esprime l’appropriazione forzata senza anticipare del tutto il più intenso διαρπάσει della frase conclusiva.
- source_word: ἐὰν μὴ πρῶτον δήσῃ
  choice: se prima non lega
  rationale: Riproduce la condizione negativa e la priorità temporale; «lega» conserva il senso fondamentale di δέω.
- source_word: καὶ τότε
  choice: Allora
  rationale: Segna con chiarezza la successione risultante; in italiano non è necessario conservare meccanicamente la congiunzione iniziale.
- source_word: διαρπάσει
  choice: saccheggerà
  rationale: Rende la forza del composto, che indica il depredare ampiamente la casa dopo averne immobilizzato il proprietario.
- source_word: τὴν οἰκίαν αὐτοῦ
  choice: la sua casa
  rationale: Conserva il referente concreto e la coerenza interna della similitudine.
theological_decisions:
- issue: Linguaggio maschile rappresentativo nella similitudine
  choice: l’uomo forte / qualcuno
  alternative: il forte / uno
  rationale: Il testo greco presenta una figura concretamente maschile mediante ἰσχυρός sostantivato, mentre τις è indefinito. La resa conserva il personaggio maschile della similitudine senza restringere il soggetto generico.
- issue: Portata metaforica di «casa» e «beni»
  choice: Conservare la concreta immagine di un’irruzione e di un saccheggio
  alternative: Esplicitare interpretativamente «dominio» e «possedimenti»
  rationale: Il contesto riguarda l’autorità di Gesù sulle potenze demoniache, ma il versetto formula tale realtà mediante una similitudine. La traduzione non inserisce nel testo l’interpretazione teologica implicita.
- issue: Differenza tra ἁρπάζω e διαρπάζω
  choice: impadronirsi / saccheggerà
  alternative: portare via / depredare; prendere / svaligiare
  rationale: La distinzione lessicale italiana conserva la progressione dall’atto di prendere i beni al depredare la casa, senza appiattire i due verbi greci.
translation_notes:
  register: Italiano standard moderno, chiaro e dignitoso. La sintassi conserva la domanda retorica e la vividezza della similitudine; il lessico distingue l’appropriazione dei beni dal successivo saccheggio dell’intera casa.
