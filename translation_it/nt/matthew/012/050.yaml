id: MAT.12.50
reference: Matthew 12:50
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ὅστις γὰρ ἂν ποιήσῃ τὸ θέλημα τοῦ πατρός μου τοῦ ἐν οὐρανοῖς, αὐτός μου ἀδελφὸς καὶ ἀδελφὴ καὶ μήτηρ ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/050.yaml
  text: For whoever does the will of my Father in heaven[a], he is my brother and sister and mother.
translation:
  language: it
  text: Infatti, chiunque[a] fa la volontà di mio Padre che è nei cieli è mio fratello, mia sorella e mia madre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il greco impiega forme maschili singolari in senso generale; «chiunque» rende il valore generale della costruzione.
    reason: Chiarisce la portata generale delle forme greche senza attribuire a «chiunque» italiano una forma grammaticale maschile.
lexical_decisions:
- source_word: ὅστις ... ἂν
  choice: chiunque
  rationale: La relativa indefinita con ἄν esprime una condizione generale e aperta; «chiunque» la rende in modo naturale e inclusivo in italiano.
- source_word: γὰρ
  choice: infatti
  rationale: Mantiene il nesso esplicativo con il contesto precedente ed è più idiomatico di un «poiché» isolato.
- source_word: ποιήσῃ
  choice: fa
  rationale: «Fare la volontà» è l'equivalente diretto e naturale della costruzione ποιέω con θέλημα; «ubbidisce» restringerebbe interpretativamente il senso.
- source_word: τὸ θέλημα
  choice: la volontà
  rationale: Conserva il contenuto teologico e relazionale dell'espressione senza parafrasarlo con «ciò che vuole».
- source_word: τοῦ πατρός μου τοῦ ἐν οὐρανοῖς
  choice: del Padre mio che è nei cieli
  rationale: Riproduce sia la relazione espressa da «mio» sia la proposizione attributiva; «nei cieli» conserva il plurale greco ed è una formulazione italiana biblica ma ancora comprensibile.
- source_word: αὐτός
  choice: è mio fratello, mia sorella e mia madre
  rationale: In italiano il soggetto «chiunque» resta naturalmente sottinteso davanti alla copula. Evitare un pronome come «egli» rende la frase moderna senza cambiare il referente; l'identificazione enfatica emerge dalla sequenza predicativa.
- source_word: ἀδελφὸς καὶ ἀδελφὴ καὶ μήτηρ
  choice: mio fratello, mia sorella e mia madre
  rationale: Mantiene distintamente i tre ruoli familiari e rende il genitivo μου in modo distributivo, come richiede l'italiano naturale.
- source_word: ἐστίν
  choice: è
  rationale: Conserva la copula al presente.
theological_decisions:
- issue: Maschile singolare rappresentativo in un'affermazione generale
  choice: chiunque ... è mio fratello, mia sorella e mia madre
  alternative: chiunque ... egli è mio fratello, mia sorella e mia madre
  rationale: Le forme greche ὅστις, αὐτός e ἀδελφός sono maschili singolari ma hanno qui portata generale. «Chiunque» comunica chiaramente tale portata senza escludere nessuno, mentre l'elenco «fratello, sorella e madre» conserva integralmente le immagini sessuate del testo. «Egli» sarebbe più marcato e meno naturale nell'italiano corrente.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. «Padre mio che è nei cieli» conserva la solennità e la struttura della fonte; la ripetizione di «mio/mia» rende naturale in italiano il singolo μου riferito ai tre nomi.
