id: MAT.12.27
reference: Matthew 12:27
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: καὶ εἰ ἐγὼ ἐν Βεελζεβοὺλ ἐκβάλλω τὰ δαιμόνια, οἱ υἱοὶ ὑμῶν ἐν τίνι ἐκβάλλουσιν; διὰ τοῦτο αὐτοὶ ⸂κριταὶ ἔσονται ὑμῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/027.yaml
  text: And if I cast out demons by Beelzebul[a], by whom do your sons cast them out? Therefore they will be your judges.
translation:
  language: it
  text: E se io scaccio i demòni per mezzo di Beelzebùl[a], per mezzo di chi li scacciano i vostri figli? Perciò saranno loro i vostri giudici.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Greco: «Beelzebùl»; la forma tradizionale italiana è «Belzebù».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν Βεελζεβοὺλ
  choice: per mezzo di Beelzebul
  rationale: Qui ἐν ha valore strumentale e indica il potere o l'agente mediante cui avverrebbe l'espulsione. «Per mezzo di» lo esprime chiaramente in italiano; il nome segue la forma greca Βεελζεβούλ.
- source_word: ἐκβάλλω τὰ δαιμόνια
  choice: scaccio i demòni
  rationale: Nel contesto degli esorcismi, ἐκβάλλω indica l'espulsione; «scacciare i demòni» è naturale, corrente e conserva la forza del verbo greco.
- source_word: οἱ υἱοὶ ὑμῶν
  choice: i vostri figli
  rationale: Mantiene il termine di parentela υἱοί e la tensione retorica dell'originale, senza specificare se si tratti in senso esteso di discepoli, seguaci o membri del loro gruppo.
- source_word: ἐν τίνι
  choice: per mezzo di chi
  rationale: Riprende il valore strumentale del precedente ἐν e, dato il riferimento personale implicito, «chi» è più appropriato di «che cosa».
- source_word: διὰ τοῦτο
  choice: Perciò
  rationale: Introduce in modo conciso e naturale la conclusione dell'argomento.
- source_word: κριταὶ ἔσονται ὑμῶν
  choice: saranno loro i vostri giudici
  rationale: Conserva il costrutto nominale e il futuro; l'enfasi su «loro» rende in italiano il valore retorico di αὐτοί.
theological_decisions:
- issue: Identità e grafia di Βεελζεβούλ
  choice: Beelzebul
  alternative: Belzebù
  rationale: Si traslittera la forma presente nel testo greco fornito, senza armonizzarla con la forma tradizionale italiana più nota.
- issue: Referente di οἱ υἱοὶ ὑμῶν
  choice: i vostri figli
  alternative: i vostri discepoli / quelli del vostro gruppo
  rationale: L'espressione può indicare persone appartenenti alla cerchia degli interlocutori, ma il testo usa il termine di parentela «figli»; mantenerlo evita di risolvere un riferimento non esplicitato.
- issue: Funzione giudicante dei figli
  choice: saranno loro i vostri giudici
  alternative: saranno loro a giudicarvi
  rationale: La resa conserva il predicato nominale κριταί e presenta il loro operato come confutazione o giudizio sugli interlocutori, senza precisarne ulteriormente la natura.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. «Scacciare i demòni» conserva il linguaggio biblico senza risultare antiquato. «Per mezzo di» chiarisce il valore strumentale di ἐν; la ripetizione è mantenuta per rispecchiare il parallelismo retorico del greco.
