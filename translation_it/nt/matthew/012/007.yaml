id: MAT.12.7
reference: Matthew 12:7
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: εἰ δὲ ἐγνώκειτε τί ἐστιν· Ἔλεος θέλω καὶ οὐ θυσίαν, οὐκ ἂν κατεδικάσατε τοὺς ἀναιτίους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/007.yaml
  text: But if you had known what this means[b][a], ‘I desire mercy and not sacrifice,’ you would not have condemned the guiltless.
translation:
  language: it
  text: 'Ma se aveste compreso che cosa significa: «Misericordia voglio e non sacrificio», non avreste condannato gli innocenti.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gesù cita Osea 6:6.
    reason: cross_reference
lexical_decisions:
- source_word: ἐγνώκειτε
  choice: aveste compreso
  rationale: Nel periodo ipotetico dell'irrealtà, il congiuntivo trapassato italiano esprime una comprensione che avrebbe dovuto precedere il giudizio; «compreso» è naturale nel contesto dell'interpretazione della Scrittura.
- source_word: τί ἐστιν
  choice: che cosa significa
  rationale: Introduce idiomaticamente il senso della citazione, anziché la semplice identificazione delle parole.
- source_word: Ἔλεος
  choice: misericordia
  rationale: Termine italiano consolidato e semanticamente adeguato per ἔλεος, capace di esprimere compassione e benevolenza senza ampliare indebitamente il testo.
- source_word: θέλω
  choice: voglio
  rationale: Rende direttamente θέλω e conserva la formulazione incisiva ed elevata della citazione profetica.
- source_word: θυσίαν
  choice: sacrificio
  rationale: Riproduce il singolare e mantiene senza espansioni il contrasto profetico.
- source_word: κατεδικάσατε
  choice: non avreste condannato
  rationale: Il condizionale passato rende l'apodosi irreale con ἄν; «condannato» conserva la forza giudiziaria del verbo.
- source_word: τοὺς ἀναιτίους
  choice: degli innocenti
  rationale: L'aggettivo sostantivato indica persone non colpevoli; dopo la negazione, «degli innocenti» è italiano naturale e mantiene il valore forense.
theological_decisions:
- issue: Il contrasto della citazione di Osea 6:6 tra misericordia e sacrificio
  choice: «Misericordia voglio e non sacrificio»
  alternative: «Voglio misericordia, non sacrificio»
  rationale: La formulazione conserva il contrasto netto del greco e la priorità profetica della misericordia, senza trasformarla esplicitamente in un'affermazione generale contro ogni sacrificio.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. L'ordine «Misericordia voglio» conserva l'enfasi iniziale della citazione; la costruzione ipotetica italiana comunica chiaramente il rimprovero controfattuale.
