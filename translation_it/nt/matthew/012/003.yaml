  text: ὁ δὲ εἶπεν αὐτοῖς· Οὐκ ἀνέγνωτε τί ἐποίησεν Δαυὶδ ὅτε ⸀ἐπείνασεν καὶ οἱ μετ’ αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/003.yaml
  text: But he said to them[a], “Have you not read what David did when he was hungry, and those with him were hungry?”
translation:
  language: it
  text: 'Ma egli disse loro: «Non avete letto che cosa fece Davide quando ebbe fame, lui e quelli che erano con lui?[a]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «quando lui e quelli che erano con lui ebbero fame». In greco il verbo «ebbe fame» è al singolare e si riferisce esplicitamente a Davide; la frase può tuttavia essere intesa nel senso che anche quelli con lui avessero fame.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Ma egli
  rationale: δέ introduce la risposta di Gesù in lieve contrasto con l'accusa precedente; «Ma egli» conserva il collegamento ed è dignitoso e naturale.
- source_word: εἶπεν αὐτοῖς
  choice: disse loro
  rationale: Resa diretta e idiomatica di λέγω con il dativo αὐτοῖς.
- source_word: Οὐκ ἀνέγνωτε
  choice: Non avete letto
  rationale: Il passato prossimo italiano esprime naturalmente la domanda retorica che richiama una conoscenza delle Scritture ancora pertinente.
- source_word: τί ἐποίησεν
  choice: che cosa fece
  rationale: ποιέω indica qui semplicemente ciò che Davide fece nell'episodio narrato.
- source_word: Δαυὶδ
  choice: Davide
  rationale: Forma italiana standard del nome biblico.
- source_word: ὅτε ἐπείνασεν
  choice: quando ebbe fame
  rationale: Resa naturale dell'aoristo singolare di πεινάω, riferito esplicitamente a Davide.
- source_word: καὶ οἱ μετ’ αὐτοῦ
  choice: lui e quelli che erano con lui
  rationale: La costruzione italiana collega con naturalezza anche i compagni alla fame, pur lasciando segnalato in nota che il verbo greco è al singolare.
theological_decisions: []
translation_notes:
  register: Italiano moderno standard, chiaro e dignitoso. La formulazione principale rende esplicita in modo naturale l'applicazione della fame sia a Davide sia ai suoi compagni, mentre la nota conserva l'ambiguità sintattica del greco.
