id: MAT.12.22
reference: Matthew 12:22
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Τότε ⸂προσηνέχθη αὐτῷ δαιμονιζόμενος τυφλὸς καὶ κωφός⸃· καὶ ἐθεράπευσεν αὐτόν, ὥστε τὸν ⸀κωφὸν λαλεῖν καὶ βλέπειν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/022.yaml
  text: Then a demon-possessed man[a], blind and mute, was brought to him; and he healed him, so that the mute man spoke and saw.
translation:
  language: it
  text: Allora gli fu portato un uomo indemoniato, cieco e muto[a]; ed egli lo guarì, tanto che il muto parlava e vedeva.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «sordo». Il termine greco può riferirsi a chi è sordo o a chi non può parlare; qui il contesto favorisce «muto», perché dopo la guarigione l’uomo parlava e vedeva.'
    reason: Alternativa lessicale genuina di κωφός.
lexical_decisions:
- source_word: Τότε
  choice: Allora
  rationale: Introduce con naturalezza l’evento successivo nella sequenza narrativa.
- source_word: προσηνέχθη αὐτῷ
  choice: gli fu portato
  rationale: Mantiene la forma passiva e lascia non specificato chi condusse l’uomo da Gesù.
- source_word: δαιμονιζόμενος
  choice: indemoniato
  rationale: Rende esplicitamente l’attribuzione della condizione all’azione demoniaca, senza sostituirla con una categoria clinica moderna.
- source_word: τυφλὸς
  choice: cieco
  rationale: Equivalente italiano diretto e naturale.
- source_word: κωφός
  choice: muto
  rationale: Il termine può indicare sordità o incapacità di parlare; qui la proposizione risultativa menziona il recupero della parola, perciò il contesto favorisce «muto».
- source_word: ἐθεράπευσεν αὐτόν
  choice: lo guarì
  rationale: È la resa consueta e trasparente del verbo nei racconti evangelici di guarigione.
- source_word: ὥστε
  choice: tanto che
  rationale: Esprime in modo naturale il risultato effettivo della guarigione.
- source_word: τὸν κωφὸν λαλεῖν καὶ βλέπειν
  choice: il muto parlava e vedeva
  rationale: Conserva il parallelismo dei due infinitivi greci e presenta direttamente il risultato della guarigione.
theological_decisions:
- issue: Natura dell’afflizione demoniaca
  choice: Conservare il riferimento esplicito mediante «indemoniato»
  alternative: «afflitto» oppure una diagnosi clinica moderna
  rationale: Il greco attribuisce esplicitamente la condizione dell’uomo a un’influenza demoniaca; attenuarla o reinterpretarla risolverebbe il testo invece di tradurlo.
- issue: Valore contestuale di κωφός
  choice: «muto»
  alternative: «sordo»
  rationale: Benché il vocabolo ammetta entrambi i sensi, il risultato dichiarato è che l’uomo parla e vede, non che ode; «muto» segue quindi l’indizio contestuale senza aggiungere una disabilità ulteriore.
translation_notes:
  register: Italiano moderno, dignitoso e narrativamente scorrevole. «Uomo indemoniato» evita di ridurre la persona alla sua condizione, pur mantenendo il linguaggio demoniaco esplicito dell’originale; «muto» conserva concisione e solennità senza risultare arcaico.
