  variant: modern standard Italian
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ⸀ἄνθρωπος χεῖρα ἔχων ξηράν. καὶ ἐπηρώτησαν αὐτὸν λέγοντες· Εἰ ἔξεστι τοῖς σάββασιν ⸀θεραπεύειν; ἵνα κατηγορήσωσιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/010.yaml
  text: And behold[a], there was a man with a withered hand. And they asked him, saying, “Is it lawful to heal on the Sabbaths?” so that they might accuse him.
translation:
  language: it
  text: 'Ed ecco, c’era un uomo con una mano inaridita. E gli domandarono: «È lecito guarire di sabato[a]?», per accusarlo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il greco ha «nei sabati»; il plurale è un modo comune di riferirsi ai giorni di sabato.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: ecco
  rationale: Mantiene la funzione narrativa del termine, che richiama l’attenzione sulla scena, in un italiano moderno e dignitoso.
- source_word: ἄνθρωπος
  choice: un uomo
  rationale: Qui il sostantivo indica un singolo individuo di sesso maschile, non l’umanità in senso generico.
- source_word: χεῖρα ἔχων ξηράν
  choice: con una mano inaridita
  rationale: Rende in modo naturale la costruzione participiale; «inaridita» conserva l’immagine di una mano disseccata o atrofizzata senza precisare indebitamente la diagnosi.
- source_word: ἐπηρώτησαν αὐτόν
  choice: gli domandarono
  rationale: Resa italiana diretta e naturale; l’intento ostile non viene anticipato nel verbo, ma emerge esplicitamente alla fine del versetto.
- source_word: ἔξεστι
  choice: è lecito
  rationale: Esprime la questione della conformità alla legge religiosa, non una semplice concessione o possibilità pratica.
- source_word: τοῖς σάββασιν
  choice: di sabato
  rationale: È l’espressione italiana idiomatica per indicare ciò che avviene nei giorni di sabato; il plurale formale del greco è segnalato in nota.
- source_word: θεραπεύειν
  choice: guarire
  rationale: È la resa più naturale nel contesto delle guarigioni evangeliche e non restringe il significato a una particolare procedura medica.
- source_word: ἵνα κατηγορήσωσιν αὐτοῦ
  choice: per poterlo accusare
  rationale: Conserva il valore finale di ἵνα e il senso accusatorio, anche giuridico, di κατηγορέω, in una formulazione italiana scorrevole.
theological_decisions:
- issue: Resa dell’espressione relativa al sabato in una controversia sulla Legge
  choice: di sabato
  alternative: nei sabati / nei giorni di sabato
  rationale: Il greco usa il dativo plurale τοῖς σάββασιν, un modo comune di riferirsi ai giorni di sabato. Il testo principale adotta l’italiano idiomatico senza trasformare la domanda in un riferimento esclusivo a un unico sabato; la forma greca è documentata in nota.
translation_notes:
  register: Italiano standard moderno, narrativo e dignitoso. «Ed ecco» conserva la vivacità del racconto; «mano inaridita» mantiene l’immagine del testo senza introdurre una diagnosi non esplicitata. La punteggiatura integra naturalmente la proposizione finale dopo la domanda diretta.
