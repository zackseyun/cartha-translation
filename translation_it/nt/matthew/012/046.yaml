base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/046.yaml
  text: While he was still speaking to the crowds[a], behold, his mother and his brothers were standing outside, seeking to speak to him.
translation:
  language: it
  text: Mentre egli parlava ancora alle folle, ecco, sua madre e i suoi fratelli[a] erano in piedi fuori e cercavano di parlargli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oppure «i suoi congiunti», se ἀδελφοί è inteso in senso più ampio come parenti stretti; il termine greco è qui al maschile plurale e nel testo è reso «fratelli».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτι δὲ αὐτοῦ λαλοῦντος
  choice: Mentre egli parlava ancora
  rationale: La costruzione con genitivo assoluto indica un'azione contemporanea; «ancora» rende ἔτι, mentre il lieve passaggio narrativo di δέ è espresso naturalmente dalla progressione della frase italiana.
- source_word: τοῖς ὄχλοις
  choice: alle folle
  rationale: Conserva il plurale greco di ὄχλοις ed è naturale nell'italiano biblico moderno.
- source_word: ἰδοὺ
  choice: ecco
  rationale: Mantiene la funzione deittica e narrativa del termine, richiamando l'attenzione sul nuovo sviluppo.
- source_word: ἡ μήτηρ καὶ οἱ ἀδελφοὶ αὐτοῦ
  choice: sua madre e i suoi fratelli
  rationale: In italiano il possessivo viene espresso naturalmente con entrambi i nomi. «Fratelli» riproduce la forma maschile plurale ἀδελφοί senza decidere la natura precisa della parentela.
- source_word: εἱστήκεισαν ἔξω
  choice: stavano fuori
  rationale: Rende il valore risultativo-stativo del piuccheperfetto di ἵστημι senza aggiungere un luogo, come «la casa», non esplicitato nel versetto.
- source_word: ζητοῦντες αὐτῷ λαλῆσαι
  choice: cercavano di parlargli
  rationale: «Cercavano di» esprime lo sforzo intenzionale di ζητοῦντες; «parlargli» rende in modo idiomatico il dativo αὐτῷ con l'infinito λαλῆσαι.
theological_decisions:
- issue: Senso di ἀδελφοί in riferimento alla famiglia di Gesù
  choice: i suoi fratelli
  alternative: i suoi fratelli e sorelle; i suoi congiunti
  rationale: La forma greca è maschile plurale e la resa principale ne conserva il valore lessicale immediato. La nota segnala l'eventuale uso più ampio del termine senza risolvere le successive controversie sulla precisa parentela.
translation_notes:
  register: Italiano moderno, dignitoso e scorrevole. «Ecco» conserva la vivacità narrativa; «alle folle» mantiene il plurale dell'originale. La formulazione evita sia arcaismi non necessari sia aggiunte contestuali.
