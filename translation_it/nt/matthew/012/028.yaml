id: MAT.12.28
reference: Matthew 12:28
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: εἰ δὲ ἐν πνεύματι θεοῦ ἐγὼ ἐκβάλλω τὰ δαιμόνια, ἄρα ἔφθασεν ἐφ’ ὑμᾶς ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/028.yaml
  text: But if I cast out the demons by the Spirit of God[b][a], then the kingdom of God has come upon you.
translation:
  language: it
  text: Ma se io scaccio i demòni mediante lo Spirito di Dio[a], allora il regno di Dio è giunto fino a voi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «nello Spirito di Dio». La costruzione greca può indicare qui l'ambito oppure, come nel testo, il mezzo o l'agente.
    reason: lexical_alternative
  - marker: b
    text: O «è arrivato su di voi» oppure «vi ha raggiunti». Il verbo greco sottolinea che il regno di Dio è ormai arrivato fino a loro nelle opere di Gesù.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Ma se
  rationale: Conserva sia la condizione sia il lieve contrasto introdotto da δέ, in una forma italiana naturale.
- source_word: ἐν πνεύματι θεοῦ
  choice: mediante lo Spirito di Dio
  rationale: Rende ἐν con il dativo come mezzo o agente dell'azione; la nota conserva l'alternativa più letterale «nello Spirito di Dio».
- source_word: ἐγὼ
  choice: io
  rationale: Il pronome espresso mantiene l'enfasi del greco, benché in italiano il soggetto possa normalmente essere sottinteso.
- source_word: ἐκβάλλω
  choice: scaccio
  rationale: È un verbo moderno, vigoroso e idiomatico per l'espulsione dei demòni.
- source_word: τὰ δαιμόνια
  choice: i demòni
  rationale: Designa chiaramente gli esseri demoniaci oggetto dell'azione di Gesù e conserva l'articolo.
- source_word: ἄρα
  choice: allora
  rationale: Segnala in modo naturale la conclusione logica derivante dalla condizione.
- source_word: ἔφθασεν
  choice: è giunto
  rationale: Esprime l'arrivo effettivo o il raggiungimento indicato dall'aoristo di φθάνω, senza ridurlo a un semplice avvicinamento.
- source_word: ἐφ’ ὑμᾶς
  choice: fino a voi
  rationale: Comunica che il regno ha raggiunto gli interlocutori, mantenendo la direzione e la forza di ἐπί con l'accusativo senza l'italiano poco naturale «sopra di voi».
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: il regno di Dio
  rationale: È la resa italiana consolidata e conserva sia l'idea del dominio regale sia quella del regno.
theological_decisions:
- issue: Il rapporto tra il regno di Dio e gli esorcismi di Gesù
  choice: Gli esorcismi compiuti mediante lo Spirito attestano che il regno di Dio ha realmente raggiunto gli ascoltatori nel presente.
  alternative: Il regno si sarebbe soltanto avvicinato, oppure il riferimento riguarderebbe esclusivamente il compimento futuro.
  rationale: ἔφθασεν indica l'arrivo o il raggiungimento, e l'argomento collega tale realtà alle opere presenti di Gesù; la formulazione non nega comunque un compimento futuro.
- issue: Il referente di πνεύματι θεοῦ
  choice: «Spirito di Dio» è trattato come riferimento allo Spirito quale agente divino.
  alternative: Una generica forza o potenza divina impersonale.
  rationale: Il contesto presenta lo Spirito di Dio come colui mediante il quale Gesù scaccia i demòni; la maiuscola segue l'uso italiano per questo referente senza aggiungere una definizione ulteriore.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. «Mediante» evita l'ambiguità di «con»; «è giunto fino a voi» conserva l'idea dinamica del raggiungimento. L'accento in «demòni» chiarisce la pronuncia secondo l'uso editoriale italiano.
