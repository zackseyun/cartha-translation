  source_fidelity: Il testo rende fedelmente la struttura condizionale e inferenziale di εἰ δὲ ... ἄρα, conserva l'enfasi del pronome ἐγώ con «io», e traduce in modo appropriato ἐν πνεύματι θεοῦ come mezzo/agenzia. «Scaccio i demòni» rende bene ἐκβάλλω τὰ δαιμόνια. «Il regno di Dio è giunto fino a voi» comunica l'arrivo effettivo espresso da ἔφθασεν ἐφ’ ὑμᾶς senza introdurre interpretazioni estranee.
  naturalness: L'italiano è moderno, chiaro e di registro biblico sobrio. «Mediante lo Spirito di Dio» è leggermente formale ma naturale e preciso; «allora» segnala con chiarezza la conclusione dell'argomento. L'accentazione editoriale «demòni» è ammissibile e non ostacola la leggibilità.
  terminology: «Spirito di Dio», «demòni» e «regno di Dio» sono scelte consolidate, comprensibili e terminologicamente coerenti. La maiuscola in «Spirito» è una convenzione italiana appropriata al referente contestuale, senza modificare il contenuto del versetto.
