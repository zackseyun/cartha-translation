id: MAT.12.6
reference: Matthew 12:6
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι τοῦ ἱεροῦ μεῖζόν ἐστιν ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/006.yaml
  text: But I tell you that something greater than the temple is here[a][b].
translation:
  language: it
  text: Ma io vi dico che qui c’è qualcosa di più grande del tempio[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «qui c’è qualcuno più grande del tempio» o «qui c’è uno più grande del tempio». Il greco usa una forma neutra («più grande»), lasciando formalmente inespresso il referente.'
    reason: alternative_reading
  - marker: b
    text: 'Oppure: «in questo luogo».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Ma io vi dico
  rationale: La formula rende in modo naturale l’indirizzo diretto; «ma» esprime il lieve contrasto introdotto da δέ con l’argomento precedente.
- source_word: ὅτι
  choice: che
  rationale: Introduce esplicitamente il contenuto della dichiarazione di Gesù, secondo la normale sintassi italiana.
- source_word: τοῦ ἱεροῦ
  choice: del tempio
  rationale: ἱερόν indica normalmente il complesso del tempio, non specificamente il santuario interno; «tempio» è la resa italiana più naturale e appropriata al contesto.
- source_word: μεῖζόν
  choice: qualcosa di più grande
  rationale: Il comparativo neutro singolare è usato in modo sostantivato e lascia formalmente inespresso il referente. «Qualcosa di più grande» conserva il genere neutro senza identificarlo esplicitamente.
- source_word: ἐστιν
  choice: c’è
  rationale: In unione con l’avverbio locativo ὧδε, la costruzione esistenziale italiana «qui c’è» rende con naturalezza il presente di εἰμί.
- source_word: ὧδε
  choice: qui
  rationale: L’avverbio locativo significa «qui» o «in questo luogo»; «qui» è chiaro, conciso e idiomatico.
theological_decisions:
- issue: Identità del referente non espresso nel comparativo neutro μεῖζόν
  choice: Nel testo principale, «qualcosa di più grande», senza nominare direttamente Gesù né trasformare il neutro in un riferimento personale esplicito.
  alternative: «qualcuno più grande del tempio è qui» oppure «uno più grande del tempio è qui».
  rationale: Il greco presenta il neutro singolare μεῖζόν, non una forma maschile. Benché il contesto rimandi con forza a Gesù e alla sua autorità messianica, la traduzione conserva l’indeterminatezza formale e la tensione teologica dell’originale.
translation_notes:
  register: Italiano standard moderno, naturale e dignitoso. La costruzione «qui c’è» è accessibile al lettore comune; le note conservano sia l’alternativa personale sia la sfumatura locativa più estesa.
