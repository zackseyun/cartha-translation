  yaml_path: translation/nt/matthew/012/037.yaml
  text: For by your words you will be justified[a], and by your words you will be condemned.
translation:
  language: it
  text: Poiché in base alle tue parole sarai dichiarato giusto[a], e in base alle tue parole sarai condannato.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «sarai riconosciuto giusto» oppure «sarai assolto». Il verbo greco può avere il senso giudiziario di essere dichiarato nel giusto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ
  choice: in base a
  rationale: Con il genitivo indica qui il fondamento o l'elemento probatorio del giudizio. «In base a» è naturale in italiano e rende più chiaramente il valore forense rispetto al più letterale «dalle».
- source_word: γάρ
  choice: Poiché
  rationale: Introduce la motivazione dell'avvertimento precedente sul parlare; «Poiché» conserva il nesso esplicativo in un registro dignitoso e corrente.
- source_word: λόγων
  choice: parole
  rationale: Il plurale si riferisce alle espressioni pronunciate. «Parole» è diretto e conserva la ripetizione parallela del greco.
- source_word: σου
  choice: tue
  rationale: Il pronome al genitivo ha valore possessivo e determina «parole» in entrambe le proposizioni.
- source_word: δικαιωθήσῃ
  choice: sarai dichiarato giusto
  rationale: Il futuro passivo di δικαιόω ha qui valore giudiziario, chiarito dall'antitesi con «sarai condannato». «Dichiarato giusto» rende comprensibile tale valore senza ridurlo necessariamente alla sola assoluzione.
- source_word: καταδικασθήσῃ
  choice: sarai condannato
  rationale: Il futuro passivo è giudiziario e forma un'antitesi deliberata con δικαιωθήσῃ. «Condannato» è l'equivalente italiano più diretto.
theological_decisions:
- issue: Valore forense di δικαιόω nel rapporto tra parole e giudizio
  choice: «sarai dichiarato giusto», in senso giudiziario, sulla base delle parole considerate come elemento probatorio
  alternative: «sarai riconosciuto giusto» oppure «sarai assolto»
  rationale: Il parallelismo antitetico con «sarai condannato» stabilisce un contesto forense. La formulazione conserva la tensione del versetto, senza svilupparla in una dottrina della giustificazione estranea al testo immediato.
translation_notes:
  register: Italiano standard moderno, chiaro e dignitoso. La ripetizione «in base alle tue parole» conserva il parallelismo enfatico dell'originale; la nota segnala le principali alternative forensi senza eliminare l'ambiguità lessicale.
