id: MAT.12.18
reference: Matthew 12:18
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Ἰδοὺ ὁ παῖς μου ὃν ᾑρέτισα, ὁ ἀγαπητός μου ⸂εἰς ὃν⸃ εὐδόκησεν ἡ ψυχή μου· θήσω τὸ πνεῦμά μου ἐπ’ αὐτόν, καὶ κρίσιν τοῖς ἔθνεσιν ἀπαγγελεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/018.yaml
  text: Behold[a], my servant whom I have chosen, my beloved in whom my soul has delighted. I will put my Spirit upon him[c][b], and he will proclaim justice to the nations.
translation:
  language: it
  text: 'Ecco il mio servo, che ho scelto,

    il mio amato, nel quale l’anima mia si è compiaciuta.[a]

    Porrò su di lui il mio Spirito,

    ed egli annuncerà la giustizia[b] alle nazioni.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «nel quale la mia anima ha trovato piacere»; in forma più idiomatica: «del quale mi sono compiaciuto».'
    reason: lexical_alternative
  - marker: b
    text: 'Oppure: «il giudizio».'
    reason: lexical_alternative
  - marker: c
    text: 'Oppure: «ai non Giudei».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Ecco
  rationale: Conserva la funzione profetica di richiamo all’attenzione in una forma italiana corrente ma dignitosa.
- source_word: παῖς
  choice: servo
  rationale: Nel contesto della citazione isaiana indica il servo di Dio; evita di introdurre qui il senso filiale, che questa parola non impone nel contesto.
- source_word: ᾑρέτισα
  choice: ho scelto
  rationale: Il passato prossimo rende naturalmente in italiano l’azione compiuta della scelta divina.
- source_word: ὁ ἀγαπητός μου
  choice: il mio amato
  rationale: Mantiene sia l’affetto espresso da ἀγαπητός sia il tono solenne della dichiarazione divina.
- source_word: εἰς ὃν εὐδόκησεν ἡ ψυχή μου
  choice: nel quale l’anima mia si è compiaciuta
  rationale: Riproduce esplicitamente «l’anima mia» e rende l’idioma di εὐδοκέω senza ridurlo semplicemente a «mi sono compiaciuto».
- source_word: θήσω τὸ πνεῦμά μου ἐπ’ αὐτόν
  choice: Porrò su di lui il mio Spirito
  rationale: Segue da vicino l’immagine della designazione e dell’investitura profetica; la maiuscola segnala che si tratta dello Spirito di Dio.
- source_word: κρίσιν
  choice: giustizia
  rationale: Nel contesto della missione del servo verso le nazioni esprime bene l’ordine giusto di Dio; «giudizio» resta una possibile resa ed è indicata in nota.
- source_word: τοῖς ἔθνεσιν
  choice: alle nazioni
  rationale: Rende il senso ampio di ἔθνη e la portata universale dell’oracolo, conservando in nota l’alternativa «ai non Giudei».
- source_word: ἀπαγγελεῖ
  choice: annuncerà
  rationale: Esprime una comunicazione pubblica e autorevole in un italiano naturale, senza aggiungere sfumature non necessarie.
theological_decisions:
- issue: Identità del servo messianico in παῖς
  choice: «servo», in continuità con il passo isaiano citato
  alternative: «figlio» o «fanciullo»
  rationale: Il contesto intertestuale presenta Gesù nel ruolo del servo di Dio. «Servo» conserva questo collegamento senza negare né ricavare da questo singolo termine altre affermazioni cristologiche.
- issue: Senso di κρίσις nella missione alle nazioni
  choice: «giustizia» nel testo principale
  alternative: «giudizio»
  rationale: Qui il termine riguarda ciò che il servo annuncia alle nazioni e può designare la giusta norma o il giusto ordine di Dio. Poiché può anche significare «giudizio», tale alternativa è conservata in nota.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. La disposizione in versi riflette il carattere poetico della citazione profetica. Si conserva l’espressione semitizzante «l’anima mia» per non appiattire l’enfasi affettiva del testo, mentre le alternative più idiomatiche sono riportate in nota.
