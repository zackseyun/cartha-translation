id: MAT.12.42
reference: Matthew 12:42
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: βασίλισσα νότου ἐγερθήσεται ἐν τῇ κρίσει μετὰ τῆς γενεᾶς ταύτης καὶ κατακρινεῖ αὐτήν· ὅτι ἦλθεν ἐκ τῶν περάτων τῆς γῆς ἀκοῦσαι τὴν σοφίαν Σολομῶνος, καὶ ἰδοὺ πλεῖον Σολομῶνος ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/042.yaml
  text: The queen of the South will rise up in the judgment with this generation and will condemn it[a], because she came from the ends of the earth to hear the wisdom of Solomon, and behold[b], something greater than Solomon is here.
translation:
  language: it
  text: La regina del Sud[a] si alzerà nel giudizio insieme a questa generazione e la condannerà, perché venne dai confini della terra per ascoltare la sapienza di Salomone, ed ecco, qui c’è qualcosa di più grande di Salomone[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La «regina del Sud» allude alla regina di Saba (1 Re 10:1–13; 2 Cronache 9:1–12), anche se il testo greco non la nomina esplicitamente.
    reason: cross_reference
  - marker: b
    text: 'Oppure: «qui c’è uno più grande di Salomone». Il greco usa una forma neutra («qualcosa di più grande»), che può mettere in risalto la grandezza superiore presente in Gesù e nella sua opera.'
    reason: alternative_reading
lexical_decisions:
- source_word: βασίλισσα νότου
  choice: la regina del Sud
  rationale: Rende direttamente la costruzione genitivale senza introdurre nel testo principale l’identificazione interpretativa con la regina di Saba.
- source_word: ἐγερθήσεται
  choice: si alzerà
  rationale: Conserva sia l’immagine del presentarsi in giudizio sia la possibile sfumatura della risurrezione, senza specificare oltre il greco.
- source_word: ἐν τῇ κρίσει
  choice: nel giudizio
  rationale: Mantiene l’espressione definita e il suo riferimento al giudizio escatologico.
- source_word: μετὰ τῆς γενεᾶς ταύτης
  choice: insieme a questa generazione
  rationale: Μετά con il genitivo significa normalmente «con»; «insieme a» evita di attribuire alla preposizione il senso di «contro», già espresso dal verbo seguente.
- source_word: κατακρινεῖ αὐτήν
  choice: la condannerà
  rationale: Κατακρίνω significa «condannare» e il pronome femminile riprende naturalmente «questa generazione» anche in italiano.
- source_word: ἐκ τῶν περάτων τῆς γῆς
  choice: dalle estremità della terra
  rationale: Riproduce l’idioma che indica una distanza remotissima, in una forma italiana chiara e dignitosa.
- source_word: ἀκοῦσαι τὴν σοφίαν Σολομῶνος
  choice: per ascoltare la sapienza di Salomone
  rationale: L’infinito esprime lo scopo della venuta; «ascoltare» comunica un’attenzione intenzionale meglio del semplice «udire».
- source_word: ἰδοὺ
  choice: Ed ecco
  rationale: Conserva il richiamo enfatico all’attenzione con una formula ancora comprensibile e solenne nell’italiano moderno.
- source_word: πλεῖον Σολομῶνος
  choice: qualcosa di più grande di Salomone
  rationale: Il neutro πλεῖον è reso con «qualcosa», preservando l’ampiezza grammaticale dell’affermazione senza trasformarlo esplicitamente in un referente personale maschile.
- source_word: ὧδε
  choice: qui c’è
  rationale: Esprime in modo naturale la presenza indicata dall’avverbio «qui», integrando la copula sottintesa in greco.
theological_decisions:
- issue: Resa del comparativo neutro πλεῖον in rapporto a Gesù
  choice: qualcosa di più grande di Salomone
  alternative: uno più grande di Salomone
  rationale: «Qualcosa di più grande» rispetta il neutro greco e può comprendere Gesù e la realtà della sua presenza e missione. «Uno più grande» rende esplicito il referente personale, ma restringe una formulazione che il testo greco lascia più ampia.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. La sintassi segue da vicino il greco senza risultare artificiosa; «si alzerà» e «qualcosa di più grande» mantengono le principali ambiguità del testo di partenza.
