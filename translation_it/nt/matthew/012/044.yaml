id: MAT.12.44
reference: Matthew 12:44
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: τότε λέγει· ⸂Εἰς τὸν οἶκόν μου ἐπιστρέψω⸃ ὅθεν ἐξῆλθον· καὶ ἐλθὸν ⸀εὑρίσκει ⸀σχολάζοντα σεσαρωμένον καὶ κεκοσμημένον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/044.yaml
  text: Then it says[a], ‘I will return to my house from which I came out,’ and when it comes, it finds it unoccupied, swept[b], and put in order.
translation:
  language: it
  text: 'Allora dice: «Tornerò nella mia casa, dalla quale sono uscito». E, quando vi arriva, la trova disabitata[a], spazzata e messa in ordine[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «vuota».
    reason: lexical_alternative
  - marker: b
    text: O «ornata» o «adornata».
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Allora
  rationale: Introduce in modo naturale e conciso l’azione successiva della narrazione.
- source_word: λέγει
  choice: dice
  rationale: Mantiene il presente storico del greco; il soggetto implicito è lo spirito impuro menzionato nel contesto precedente.
- source_word: Εἰς τὸν οἶκόν μου ἐπιστρέψω
  choice: Tornerò nella mia casa
  rationale: Rende il movimento di ritorno espresso da ἐπιστρέφω e conserva la rivendicazione possessiva «mia casa».
- source_word: ὅθεν ἐξῆλθον
  choice: dalla quale sono uscito
  rationale: Conserva l’immagine concreta dell’uscire dalla casa ed è idiomatico in italiano.
- source_word: ἐλθὸν
  choice: quando vi arriva
  rationale: Rende il participio aoristo con una subordinata temporale naturale, indicando l’arrivo alla casa prima del ritrovamento.
- source_word: εὑρίσκει
  choice: la trova
  rationale: Mantiene il presente storico e rende esplicito mediante il pronome il riferimento alla casa.
- source_word: σχολάζοντα
  choice: disabitata
  rationale: Nel quadro metaforico della casa, esprime che essa è vuota e priva di occupante, senza ridurla alla sola assenza di oggetti.
- source_word: σεσαρωμένον
  choice: spazzata
  rationale: 'Rende concisamente lo stato risultante indicato dal participio perfetto passivo: la casa è stata spazzata.'
- source_word: κεκοσμημένον
  choice: messa in ordine
  rationale: κοσμέω può indicare ordinare, sistemare o adornare; qui «messa in ordine» comunica lo stato ordinato senza imporre l’idea più specifica di decorazione.
theological_decisions:
- issue: Valore metaforico di «casa» nel detto sul ritorno dello spirito impuro
  choice: Conservare «casa» nel testo senza esplicitare la metafora come «persona» o «vita».
  alternative: Tornerò dalla persona dalla quale sono uscito.
  rationale: Il contesto chiarisce la metafora, ma il versetto impiega concretamente l’immagine della casa; conservarla evita una parafrasi interpretativa.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. Il presente storico conserva la vivacità narrativa del greco. La punteggiatura distingue chiaramente il discorso diretto dalla ripresa della narrazione.
