  source_fidelity: Il testo rende fedelmente la sequenza narrativa e i presenti vividi λέγει/εὑρίσκει con «dice» e «trova». «Tornerò nella mia casa, dalla quale sono uscito» conserva sia il ritorno sia il possessivo dello spirito. «Quando vi arriva» rende in modo idiomatico il participio aoristo ἐλθόν e mantiene la precedenza dell’arrivo rispetto al ritrovamento. «Disabitata, spazzata e messa in ordine» riflette adeguatamente σχολάζοντα, σεσαρωμένον e κεκοσμημένον, senza esplicitare indebitamente la metafora della casa.
