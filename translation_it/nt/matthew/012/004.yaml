lexical_decisions:
- source_word: πῶς
  choice: come
  rationale: Introduce in modo naturale il contenuto dell’episodio richiamato da Gesù.
- source_word: εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ
  choice: entrò nella casa di Dio
  rationale: Resa italiana diretta e idiomatica, senza sostituire al testo il referente contestuale del santuario.
- source_word: τοὺς ἄρτους τῆς προθέσεως
  choice: i pani della Presenza
  rationale: Mantiene il plurale di ἄρτους e rende l’espressione cultuale come i pani consacrati posti davanti a Dio.
- source_word: ἔφαγον
  choice: mangiarono
  rationale: Segue la lezione plurale stampata nel SBLGNT; la variante singolare è segnalata in nota.
- source_word: ὃ οὐκ ἐξὸν ἦν αὐτῷ φαγεῖν
  choice: che non era lecito mangiare ... a lui
  rationale: «Non era lecito» conserva la forza normativa e cultuale dell’espressione impersonale; la costruzione è stata coordinata con il membro seguente.
- source_word: οὐδὲ τοῖς μετ’ αὐτοῦ
  choice: né ... a quelli che erano con lui
  rationale: Resa chiara e vicina al greco, senza specificare più di quanto dica il testo.
- source_word: εἰ μὴ τοῖς ἱερεῦσιν μόνοις
  choice: ma soltanto ai sacerdoti
  rationale: Esprime in italiano corrente sia l’eccezione sia l’esclusività di μόνοις.
theological_decisions:
- issue: Forza cultuale e normativa di ἐξὸν
  choice: non era lecito
  alternative: non era permesso
  rationale: La formulazione scelta conserva il riferimento a una restrizione riconosciuta dalla Legge senza aggiungere interpretazioni confessionali.
- issue: Soggetto testuale di ἔφαγον
  choice: mangiarono
  alternative: mangiò
  rationale: Il testo SBLGNT fornito presenta il verbo al plurale, anche se il relativo successivo è singolare perché concorda con il pane; la variante singolare viene conservata in nota.
translation_notes:
  register: Italiano moderno, dignitoso e leggibile. «Pani della Presenza» conserva il linguaggio cultuale senza ricorrere a un termine italiano arcaico; la lieve variazione sintattica tra il singolare «che» e il plurale «mangiarono» rispecchia il testo greco.
