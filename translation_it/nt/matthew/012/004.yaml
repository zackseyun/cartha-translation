  text: how he entered into the house of God and ate the bread of the Presence[a], which it was not lawful for him to eat, nor for those with him[b], but only for the priests?
translation:
  language: it
  text: come entrò nella casa di Dio e loro mangiarono i pani della Presenza[a], che non era lecito mangiare né a lui né a quelli che erano con lui, ma soltanto ai sacerdoti?
