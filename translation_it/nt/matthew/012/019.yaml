review_pass:
  verdict: revise
  source_fidelity: Il senso della triplice negazione greca è conservato. «Litigherà» rende più precisamente e idiomaticamente ἐρίσει come comportamento non litigioso; «griderà», «nessuno udrà la sua voce» e «per le strade» restano fedeli rispettivamente a κραυγάσει, ἀκούσει τις τὴν φωνὴν αὐτοῦ ed ἐν ταῖς πλατείαις.
  naturalness: «Contenderà» senza complemento è oggi meno naturale e può evocare il contendersi qualcosa, anziché il litigare o l'entrare in disputa. «Non litigherà» è moderno, chiaro e conserva il registro sobrio del contesto. «Udrà» è leggermente elevato ma ancora normale in registro biblico moderno.
  terminology: Non emergono problemi teologici o relativi a nomi propri. La nota è aggiornata perché non presenti come alternativa la nuova resa principale.
  issues:
