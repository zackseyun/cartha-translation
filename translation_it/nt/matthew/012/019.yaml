    issue: «Contenderà» è meno idiomatico e semanticamente meno immediato di «litigherà».
    rationale: ἐρίζω qui denota contendere verbalmente, litigare o entrare in conflitto. In italiano moderno «contendere» è spesso transitivo o richiede «con», mentre «litigare» comunica direttamente il senso senza attenuazioni o interpretazioni dottrinali.
