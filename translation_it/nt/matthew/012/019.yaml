id: MAT.12.19
reference: Matthew 12:19
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: οὐκ ἐρίσει οὐδὲ κραυγάσει, οὐδὲ ἀκούσει τις ἐν ταῖς πλατείαις τὴν φωνὴν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/019.yaml
  text: He will not quarrel or cry out[a], and no one will hear his voice in the streets.
translation:
  language: it
  text: Non litigherà né griderà[a], e nessuno udrà la sua voce per le strade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «Non contenderà né alzerà grida, e nessuno udrà la sua voce nelle piazze».'
    reason: Alternativa lessicale per ἐρίσει, κραυγάσει ed ἐν ταῖς πλατείαις.
lexical_decisions:
- source_word: ἐρίσει
  choice: contenderà
  rationale: Il futuro di ἐρίζω indica l'entrare in contesa o il litigare. «Contenderà» conserva il senso di conflitto verbale ed è dignitoso e comprensibile, senza suggerire che il servo non possa mai discutere o insegnare.
- source_word: κραυγάσει
  choice: griderà
  rationale: κραυγάζω indica il gridare ad alta voce. «Griderà» rende con naturalezza l'intensità pubblica del verbo e mantiene il parallelismo con «contenderà».
- source_word: ἀκούσει τις
  choice: nessuno udrà
  rationale: La costruzione negativa con τις equivale idiomaticamente a «nessuno udrà». «Udrà» si accorda al registro dignitoso del versetto senza risultare arcaico.
- source_word: ἐν ταῖς πλατείαις
  choice: per le strade
  rationale: πλατεῖαι indica strade larghe o vie pubbliche. «Per le strade» esprime in italiano naturale l'ambiente pubblico, mentre «nelle piazze» resta una possibile resa contestuale.
- source_word: τὴν φωνὴν αὐτοῦ
  choice: la sua voce
  rationale: φωνή in questo contesto significa normalmente «voce»; la resa è diretta e preserva il riferimento alla proclamazione pubblica.
- source_word: οὐκ…οὐδὲ…οὐδὲ
  choice: non…né…e nessuno…
  rationale: La sequenza conserva la triplice negazione cumulativa in una sintassi italiana scorrevole.
theological_decisions:
- issue: Rapporto con la citazione del servo di Isaia e rappresentazione dell'atteggiamento del Messia
  choice: Il versetto presenta il Messia come non litigioso e privo di ostentazione pubblica.
  alternative: Una resa più formale potrebbe usare «non disputerà né alzerà grida» per riecheggiare il linguaggio tradizionale della citazione.
  rationale: Il greco caratterizza Gesù nel compimento di Isaia 42:2. La traduzione conserva il suo atteggiamento mite e non combattivo senza trasformare il testo in un'affermazione di silenzio o passività assoluti.
translation_notes:
  register: Italiano standard moderno, naturale e dignitoso. La coordinazione segue il ritmo cumulativo del greco; «per le strade» privilegia l'uso idiomatico, mentre la nota conserva le alternative più formali e topograficamente specifiche.
