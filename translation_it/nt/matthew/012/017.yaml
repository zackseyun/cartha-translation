  text: ⸀ἵνα πληρωθῇ τὸ ῥηθὲν διὰ Ἠσαΐου τοῦ προφήτου λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/017.yaml
  text: 'so that what was spoken through Isaiah the prophet might be fulfilled[a], saying:'
translation:
  language: it
  text: 'perché si adempisse ciò che era stato detto per mezzo del profeta Isaia, che dice:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: perché
  rationale: Introduce una proposizione di finalità o risultato senza sciogliere oltre il necessario questa sfumatura.
- source_word: πληρωθῇ
  choice: si adempisse
  rationale: Il congiuntivo imperfetto italiano, retto da «perché», rende naturalmente l’aoristo passivo congiuntivo e conserva la formula matteana dell'adempimento.
- source_word: τὸ ῥηθὲν
  choice: ciò che era stato detto
  rationale: Rende in modo idiomatico il participio sostantivato e ne mantiene il valore passivo e l'anteriorità rispetto all'adempimento.
- source_word: διὰ
  choice: per mezzo del
  rationale: Con il genitivo indica l'intermediazione del profeta, lasciando implicito Dio quale fonte ultima delle parole.
- source_word: Ἠσαΐου
  choice: Isaia
  rationale: Forma italiana tradizionale e corrente del nome del profeta.
- source_word: τοῦ προφήτου
  choice: del profeta
  rationale: Conserva l'identificazione appositiva presente nel greco, disponendola secondo l'ordine più naturale in italiano.
- source_word: λέγοντος
  choice: che dice
  rationale: Introduce con chiarezza la citazione seguente; il presente italiano mantiene viva la formulazione scritturale senza l'innaturale «dicendo» riferito a Isaia.
theological_decisions:
- issue: Mediazione profetica nella formula di citazione
  choice: per mezzo del profeta Isaia
  alternative: dal profeta Isaia
  rationale: «Per mezzo di» rispecchia διά con il genitivo e preserva la distinzione tra la fonte divina implicita e il profeta come mediatore umano.
translation_notes:
  register: Italiano moderno, dignitoso e scorrevole. La costruzione «perché si adempisse» conserva la formula solenne tipica di Matteo; «che dice» crea un naturale collegamento in avanti con la citazione del versetto seguente.
