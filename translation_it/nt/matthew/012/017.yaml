  source_fidelity: 'Il testo rende fedelmente la costruzione greca: «perché» conserva l''ampia relazione di scopo/risultato di ἵνα; «si adempisse» riproduce bene il passivo congiuntivo di πληρωθῇ; «ciò che era stato detto» rende il participio sostantivato passivo τὸ ῥηθέν. «Per mezzo del profeta Isaia» esprime appropriatamente διά con il genitivo come mediazione profetica. «Che dice» introduce in modo chiaro e fedele la citazione seguente.'
