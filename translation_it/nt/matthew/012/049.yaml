source:
  edition: SBLGNT
  text: καὶ ἐκτείνας τὴν χεῖρα αὐτοῦ ἐπὶ τοὺς μαθητὰς αὐτοῦ εἶπεν· Ἰδοὺ ἡ μήτηρ μου καὶ οἱ ἀδελφοί μου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/049.yaml
  text: And stretching out his hand toward his disciples[a], he said, “Behold[b], my mother and my brothers.”
translation:
  language: it
  text: 'E, stesa la mano verso i suoi discepoli, disse: «Ecco mia madre e i miei fratelli[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In greco «fratelli»; qui si conserva il plurale maschile anziché ampliarlo in «fratelli e sorelle».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκτείνας
  choice: stesa
  rationale: Il participio aoristo indica un gesto che accompagna e precede immediatamente il dire; «stesa» è naturale in italiano nella locuzione «stesa la mano» e conserva l’azione concreta.
- source_word: χεῖρα
  choice: mano
  rationale: È il significato ordinario del termine e descrive precisamente il gesto compiuto da Gesù.
- source_word: ἐπὶ
  choice: verso
  rationale: Con l’accusativo, nel contesto del gesto, esprime direzione verso i discepoli.
- source_word: μαθητὰς
  choice: discepoli
  rationale: Mantiene il rapporto tra maestro e discepolo espresso dal greco ed è il termine consueto nei Vangeli.
- source_word: Ἰδοὺ
  choice: Ecco
  rationale: «Ecco» richiama l’attenzione con enfasi ed è al tempo stesso dignitoso e naturale nell’italiano moderno.
- source_word: μήτηρ
  choice: madre
  rationale: Resa diretta e ordinaria del termine di parentela.
- source_word: ἀδελφοί
  choice: fratelli
  rationale: Il greco presenta un plurale maschile; «fratelli» conserva la forma concreta del testo senza ampliarla interpretativamente.
theological_decisions:
- issue: Linguaggio familiare nella ridefinizione della parentela operata da Gesù
  choice: Conservare i termini concreti «madre» e «fratelli»
  alternative: Rendere in modo inclusivo o generale con «fratelli e sorelle», «familiari» o «famiglia»
  rationale: Il detto identifica i discepoli con la vera famiglia di Gesù mediante termini di parentela specifici. Una parafrasi più ampia attenuerebbe la forza retorica e aggiungerebbe un’esplicitazione non presente in questo versetto.
translation_notes:
  register: Italiano moderno, chiaro e dignitoso. La costruzione «stesa la mano» rende con naturalezza il participio greco, mentre «Ecco» conserva la funzione enfatica di richiamo all’attenzione.
