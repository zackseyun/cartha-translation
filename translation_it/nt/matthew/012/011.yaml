id: MAT.12.11
reference: Matthew 12:11
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Τίς ⸀ἔσται ἐξ ὑμῶν ἄνθρωπος ὃς ἕξει πρόβατον ἕν, καὶ ἐὰν ἐμπέσῃ τοῦτο τοῖς σάββασιν εἰς βόθυνον, οὐχὶ κρατήσει αὐτὸ καὶ ἐγερεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/011.yaml
  text: But he said to them[a], “Which man among you, if he has one sheep and it falls into a pit on the Sabbath[b], will not take hold of it and lift it out?”
translation:
  language: it
  text: 'Ma egli disse loro: «Chi di voi, se ha una sola pecora e questa cade in una fossa in giorno di sabato[a], non l’afferrerà e non la tirerà fuori[b]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In greco «nei sabati», plurale idiomatico con il senso di «in giorno di sabato».
    reason: lexical_alternative
  - marker: b
    text: O «la solleverà».
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίς ἔσται ἐξ ὑμῶν ἄνθρωπος
  choice: Chi di voi
  rationale: Rende in italiano corrente la domanda retorica greca, che presenta un caso umano rappresentativo e presuppone una risposta affermativa. Esplicitare «uomo» produrrebbe qui una formulazione meno naturale senza aggiungere un referente distinto.
- source_word: ἕξει
  choice: ha
  rationale: Benché il verbo greco sia formalmente al futuro, all’interno dell’ipotesi retorica l’italiano idiomatico usa il presente.
- source_word: πρόβατον ἕν
  choice: una sola pecora
  rationale: Conserva l’enfasi del numerale ἕν con una formulazione italiana naturale.
- source_word: ἐὰν ἐμπέσῃ τοῦτο
  choice: e questa cade
  rationale: Il dimostrativo τοῦτο riprende la pecora; «questa» ne mantiene l’esplicitazione, mentre il presente italiano esprime naturalmente la condizione eventuale.
- source_word: τοῖς σάββασιν
  choice: in giorno di sabato
  rationale: Il plurale greco è un uso idiomatico riferito al giorno di sabato; la forma singolare italiana comunica chiaramente il contesto della controversia sabbatica.
- source_word: εἰς βόθυνον
  choice: in una fossa
  rationale: βόθυνος indica una cavità o fossa; «fossa» è ampio e non precisa indebitamente se si tratti di un fosso o di una cisterna.
- source_word: οὐχὶ
  choice: non …?
  rationale: La particella introduce una domanda che attende risposta positiva; la domanda negativa italiana conserva questa forza retorica.
- source_word: κρατήσει
  choice: l’afferrerà
  rationale: Esprime l’atto di prendere saldamente la pecora senza il tono aggressivo che potrebbe avere «la ghermirà».
- source_word: ἐγερεῖ
  choice: la tirerà fuori
  rationale: Nel contesto significa sollevare la pecora dalla fossa; «fuori» rende esplicita in modo naturale la direzione già implicata dalla scena.
theological_decisions:
- issue: Linguaggio maschile rappresentativo
  choice: Chi di voi
  alternative: Quale uomo fra voi
  rationale: Il greco usa ἄνθρωπος al maschile singolare in un esempio rappresentativo. In italiano «chi di voi» resta personale e non altera l’estensione del riferimento, evitando al contempo una costruzione artificiosa.
- issue: Interpretazione del plurale σάββασιν
  choice: in giorno di sabato
  alternative: nei sabati
  rationale: Il plurale greco è idiomatico e si riferisce al sabato come giorno; non implica necessariamente più sabati. Il singolare italiano preserva il contesto della norma sabbatica.
- issue: Esplicitazione del moto fuori dalla fossa
  choice: la tirerà fuori
  alternative: la solleverà
  rationale: «Fuori» è ricavato dal contesto della fossa e rende naturale l’azione, senza aggiungere un’interpretazione teologica. La nota conserva la resa più formale del verbo.
translation_notes:
  register: Italiano moderno, chiaro e dignitoso. La sintassi mantiene la forma della domanda retorica e il futuro della conclusione, mentre usa il presente nella protasi ipotetica secondo l’uso naturale italiano. Le virgolette caporali seguono la convenzione editoriale italiana.
