id: MAT.12.12
reference: Matthew 12:12
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: πόσῳ οὖν διαφέρει ἄνθρωπος προβάτου. ὥστε ἔξεστιν τοῖς σάββασιν καλῶς ποιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/012.yaml
  text: How much more valuable[a], then, is a man than a sheep! So it is lawful to do good on the Sabbaths.
translation:
  language: it
  text: Quanto più vale dunque una persona di una pecora! Perciò è lecito fare del bene di sabato.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Letteralmente «nei sabati»; in greco il plurale è un modo comune per riferirsi al sabato e alla sua osservanza.
    reason: Trasparenza sull’idioma plurale dell’originale e sulla resa italiana al singolare.
lexical_decisions:
- source_word: πόσῳ
  choice: Quanto più
  rationale: Con διαφέρει introduce un confronto dal minore al maggiore; «quanto più» ne conserva la forza retorica.
- source_word: οὖν
  choice: dunque
  rationale: Segnala l’inferenza tratta dall’esempio precedente della pecora soccorsa di sabato.
- source_word: διαφέρει
  choice: vale ... di più
  rationale: Nel contesto esprime superiorità di valore, non una semplice differenza. La costruzione italiana «quanto più vale ... di» rende naturalmente il confronto.
- source_word: ἄνθρωπος
  choice: una persona
  rationale: Qui il singolare è rappresentativo dell’essere umano in confronto con una pecora; «una persona» comunica il referente generico senza suggerire che l’affermazione riguardi soltanto i maschi.
- source_word: προβάτου
  choice: di una pecora
  rationale: Il genitivo dipendente da διαφέρει esprime il secondo termine di paragone.
- source_word: ὥστε
  choice: Perciò
  rationale: Introduce la conclusione pratica derivata dal confronto precedente.
- source_word: ἔξεστιν
  choice: è lecito
  rationale: Conserva la sfumatura giuridico-etica della controversia sull’osservanza del sabato.
- source_word: τοῖς σάββασιν
  choice: di sabato
  rationale: Il plurale greco è un idioma comune riferito all’osservanza del sabato; il singolare idiomatico è la resa naturale in italiano, mentre la forma greca è segnalata in nota.
- source_word: καλῶς ποιεῖν
  choice: fare del bene
  rationale: Rende l’azione benefica espressa dall’idioma greco ed è naturale nell’italiano corrente.
theological_decisions:
- issue: Resa generica di ἄνθρωπος
  choice: una persona
  alternative: un uomo; un essere umano
  rationale: Il contrasto riguarda il valore di qualsiasi essere umano rispetto a una pecora. «Una persona» mantiene il singolare rappresentativo e risulta naturale nell’italiano moderno.
- issue: Resa del plurale σάββασιν
  choice: di sabato
  alternative: nei sabati; nei giorni di sabato
  rationale: Il plurale greco può funzionare idiomaticamente per l’osservanza del sabato. La resa italiana idiomatica evita una formulazione artificiale senza occultare la forma originale, indicata in nota.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. Il punto esclamativo rende la forza dell’argomentazione retorica; «è lecito» conserva il tono della controversia sulla Legge.
