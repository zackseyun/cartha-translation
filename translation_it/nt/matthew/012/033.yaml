id: MAT.12.33
reference: Matthew 12:33
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Ἢ ποιήσατε τὸ δένδρον καλὸν καὶ τὸν καρπὸν αὐτοῦ καλόν, ἢ ποιήσατε τὸ δένδρον σαπρὸν καὶ τὸν καρπὸν αὐτοῦ σαπρόν· ἐκ γὰρ τοῦ καρποῦ τὸ δένδρον γινώσκεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/033.yaml
  text: Either make the tree good and its fruit good[a], or make the tree rotten and its fruit rotten[b]; for the tree is known by its fruit.
translation:
  language: it
  text: O fate[a] buono l’albero e buono il suo frutto, o fate marcio[b] l’albero e marcio il suo frutto; infatti l’albero si riconosce dal suo frutto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Il verbo greco tradotto «fate» può avere qui valore retorico: «considerate» oppure «mostrate che è»; la forma greca, tuttavia, è imperativa.'
    reason: alternative_reading
  - marker: b
    text: Oppure «cattivo»; il greco σαπρός può indicare ciò che è guasto, corrotto o privo di valore.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσατε
  choice: fate
  rationale: Conserva la forma imperativa aorista e il parallelismo incisivo del greco. Nel contesto può avere valore retorico, come «considerate» o «mostrate che è», possibilità segnalata in nota senza sostituirla al testo.
- source_word: τὸ δένδρον
  choice: l’albero
  rationale: Equivalente italiano diretto e naturale, indispensabile per conservare integralmente l’immagine metaforica.
- source_word: καλόν
  choice: buono
  rationale: Mantiene sia il valore qualitativo sia la risonanza morale di καλός. «Sano» restringerebbe il senso alla condizione fisica.
- source_word: τὸν καρπόν
  choice: il frutto
  rationale: Riproduce direttamente la metafora e costituisce l’espressione più naturale e tradizionalmente intelligibile in italiano.
- source_word: σαπρόν
  choice: marcio
  rationale: Rende vividamente l’idea di ciò che è guasto, corrotto o privo di valore e può riferirsi in modo comprensibile sia all’albero sia al frutto.
- source_word: ἐκ γὰρ τοῦ καρποῦ
  choice: infatti ... dal frutto
  rationale: «Infatti» esprime il rapporto esplicativo introdotto da γάρ, mentre «dal frutto» rende idiomaticamente ἐκ nella costruzione passiva.
- source_word: γινώσκεται
  choice: si riconosce
  rationale: Rende il presente passivo con una formulazione italiana naturale e conserva l’idea che la qualità dell’albero venga identificata sulla base del frutto.
theological_decisions:
- issue: Forza degli imperativi nella metafora di Gesù
  choice: 'Conservare gli imperativi diretti: «fate ... fate».'
  alternative: «Considerate l’albero...» oppure una formulazione dichiarativa o ipotetica.
  rationale: Il greco presenta due imperativi aoristi coordinati. Benché il loro valore possa essere retorico, mantenerli evita di sciogliere interpretativamente la tensione e conserva l’incisività dell’argomento.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. Il parallelismo volutamente serrato e la ripetizione di «buono», «marcio» e «fate» rispecchiano la struttura retorica del testo greco; «si riconosce» è più idiomatico di «è conosciuto» senza alterare il valore passivo.
