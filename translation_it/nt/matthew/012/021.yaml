  text: καὶ τῷ ὀνόματι αὐτοῦ ἔθνη ἐλπιοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/021.yaml
  text: and in his name the nations will hope[a].
translation:
  language: it
  text: e nel suo nome spereranno le nazioni[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «e nel suo nome spereranno i non ebrei».'
    reason: L’espressione greca ἔθνη può indicare sia «le nazioni» sia, in rapporto a Israele, «i non ebrei».
lexical_decisions:
- source_word: καὶ
  choice: e
  rationale: Mantiene il normale valore coordinante e il legame con la citazione precedente.
- source_word: τῷ ὀνόματι αὐτοῦ
  choice: nel suo nome
  rationale: Rende naturalmente il dativo retto da ἐλπίζω e conserva la portata biblica di «nome», che può richiamare la persona, l’autorità e la reputazione rappresentate dal nome.
- source_word: ἔθνη
  choice: le nazioni
  rationale: Conserva l’orizzonte universale della citazione isaiana e lascia percepire il riferimento ai popoli non ebrei senza ridurre il termine a una sola sfumatura.
- source_word: ἐλπιοῦσιν
  choice: spereranno
  rationale: Riproduce direttamente il futuro indicativo e il senso proprio di ἐλπίζω, mantenendo il tono promissorio ed escatologico.
theological_decisions:
- issue: Resa di ἔθνη nella citazione messianica
  choice: le nazioni
  alternative: i non ebrei
  rationale: «Le nazioni» preserva il più ampio orizzonte dei popoli evocato da Isaia, mentre «i non ebrei» esplicita una sfumatura contestualmente possibile. L’alternativa è segnalata in nota senza risolvere indebitamente l’ambiguità.
translation_notes:
  register: Italiano moderno, dignitoso e lineare. L’ordine delle parole segue da vicino il greco, mettendo in rilievo «nel suo nome», ma rimane naturale in italiano.
source_grounding:
  english_pob_role: consult_only
