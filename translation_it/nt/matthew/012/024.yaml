id: MAT.12.24
reference: Matthew 12:24
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: οἱ δὲ Φαρισαῖοι ἀκούσαντες εἶπον· Οὗτος οὐκ ἐκβάλλει τὰ δαιμόνια εἰ μὴ ἐν τῷ Βεελζεβοὺλ ἄρχοντι τῶν δαιμονίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/024.yaml
  text: But when the Pharisees heard it[a], they said, “This man does not cast out demons except by Beelzebul, the ruler of the demons.”
translation:
  language: it
  text: 'Ma i farisei, udito ciò, dissero: «Costui non scaccia i demòni se non per mezzo di Beelzebul[a], il capo dei demòni».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Beelzebul: forma tradizionale «Beelzebù».'
    reason: Segnala la forma italiana tradizionale del nome, mentre il testo principale riproduce più da vicino il greco Βεελζεβούλ.
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: Segnala il contrasto tra la reazione positiva della folla nel contesto precedente e l'accusa dei farisei.
- source_word: ἀκούσαντες
  choice: udito ciò
  rationale: Rende naturalmente il participio aoristo con valore temporale; «ciò» esplicita il referente implicito, cioè quanto era accaduto ed era stato detto.
- source_word: Οὗτος
  choice: Costui
  rationale: Conserva il tono distaccato e sprezzante del dimostrativo nel contesto ostile, senza aggiungere un'interpretazione.
- source_word: ἐκβάλλει τὰ δαιμόνια
  choice: scaccia i demòni
  rationale: È una resa diretta, chiara e idiomatica nel contesto degli esorcismi.
- source_word: εἰ μὴ
  choice: se non
  rationale: Nella costruzione negativa indica l'unico mezzo che i farisei attribuiscono a Gesù e mantiene da vicino la forma dell'originale.
- source_word: ἐν τῷ Βεελζεβοὺλ
  choice: per mezzo di Beelzebul
  rationale: Qui ἐν esprime mezzo o agentività; la formulazione italiana rende esplicita la relazione senza specificare ulteriormente «la potenza», assente dal greco.
- source_word: Βεελζεβοὺλ
  choice: Beelzebul
  rationale: Traslittera la forma attestata nel testo greco SBLGNT; la forma italiana tradizionale è segnalata in nota.
- source_word: ἄρχοντι τῶν δαιμονίων
  choice: il capo dei demòni
  rationale: Ἄρχων indica chi esercita autorità o comando; «capo» è naturale nell'italiano moderno e conserva il rapporto gerarchico espresso dal greco.
theological_decisions:
- issue: Tono del dimostrativo Οὗτος riferito a Gesù
  choice: Costui
  alternative: Quest'uomo; lui
  rationale: «Costui» mantiene la sfumatura ostile e sprezzante probabile nel contesto, senza introdurre un giudizio teologico estraneo al testo.
- issue: Forma del nome Βεελζεβούλ
  choice: Beelzebul
  alternative: Belzebù
  rationale: Il testo principale segue la forma del nome presente nella fonte greca; la forma tradizionale italiana viene conservata in nota per riconoscibilità.
- issue: Valore strumentale di ἐν nell'accusa
  choice: per mezzo di Beelzebul
  alternative: con Beelzebul; per la potenza di Beelzebul
  rationale: La resa conserva l'accusa di agentività demoniaca senza aggiungere «potenza», termine non espresso nell'originale, né definire ulteriormente la natura di tale rapporto.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. «Udito ciò» mantiene una concisione narrativa leggermente elevata; «Costui» riproduce l'ostilità del discorso. La ripetizione di «demòni» riflette quella del greco e rende chiara l'accusa.
