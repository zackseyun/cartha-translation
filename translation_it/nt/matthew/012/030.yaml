  text: ὁ μὴ ὢν μετ’ ἐμοῦ κατ’ ἐμοῦ ἐστιν, καὶ ὁ μὴ συνάγων μετ’ ἐμοῦ σκορπίζει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/030.yaml
  text: The one who is not with me is against me[a], and the one who does not gather with me scatters.
translation:
  language: it
  text: Chi non è con me è contro di me, e chi non raccoglie con me disperde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ μὴ ὢν
  choice: chi non è
  rationale: L’articolo con il participio ha valore sostantivato e indica in modo generale la persona che non è con Gesù. «Chi non è» rende naturalmente in italiano il singolare generico.
- source_word: μετ’ ἐμοῦ
  choice: con me
  rationale: μετά con il genitivo esprime qui associazione o schieramento; «con me» è diretto e conserva la formulazione relazionale del greco.
- source_word: κατ’ ἐμοῦ
  choice: contro di me
  rationale: κατά con il genitivo esprime opposizione. «Contro di me» è la resa italiana chiara e idiomatica.
- source_word: συνάγων
  choice: raccoglie
  rationale: Il verbo indica il radunare o raccogliere. «Raccoglie» mantiene concisione e lascia aperta la possibile immagine pastorale o agricola senza precisarla indebitamente.
- source_word: σκορπίζει
  choice: disperde
  rationale: σκορπίζω indica lo spargere o disperdere. «Disperde» forma un’antitesi naturale con «raccoglie» e conserva la forma transitiva implicita del detto.
- source_word: καὶ
  choice: e
  rationale: La congiunzione coordina due affermazioni parallele; «e» ne conserva il valore additivo senza introdurre un contrasto estraneo.
theological_decisions:
- issue: Forza dell’antitesi assoluta pronunciata da Gesù
  choice: 'La frase è resa come una dichiarazione netta: non essere con Gesù equivale a essere contro di lui, e non raccogliere con lui equivale a disperdere.'
  alternative: Una parafrasi più attenuata, come «chi non è dalla mia parte finisce per opporsi a me».
  rationale: Il greco presenta due proposizioni parallele e categoriche, prive di qualificazioni. La traduzione conserva questa tensione e non aggiunge conclusioni dottrinali.
translation_notes:
  register: Italiano moderno standard, naturale e dignitoso. Il parallelismo conciso dell’originale è conservato; la ripetizione di «con me» riflette quella greca. Non sono necessarie note, poiché «chi» esprime già in modo idiomatico il valore generico di ὁ con participio.
