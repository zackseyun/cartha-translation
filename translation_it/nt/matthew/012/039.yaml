  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Γενεὰ πονηρὰ καὶ μοιχαλὶς σημεῖον ἐπιζητεῖ, καὶ σημεῖον οὐ δοθήσεται αὐτῇ εἰ μὴ τὸ σημεῖον Ἰωνᾶ τοῦ προφήτου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/039.yaml
  text: But he answered and said to them[a], “An evil and adulterous generation seeks a sign[b], and no sign will be given to it except the sign of Jonah the prophet.”
translation:
  language: it
  text: 'Ma egli rispose loro: «Una generazione malvagia e adultera[a] cerca un segno, e non le sarà dato alcun segno, se non il segno di Giona, il profeta[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Adultera» probabilmente richiama l’infedeltà all’alleanza, oltre all’adulterio in senso letterale; si confronti l’uso profetico dell’adulterio come immagine dell’infedeltà spirituale.
    reason: cross_reference
  - marker: b
    text: 'Oppure: «il segno del profeta Giona».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν αὐτοῖς
  choice: rispose loro
  rationale: La costruzione participio + verbo finito è una formula narrativa di influsso semitico. In italiano moderno «rispose loro» ne comunica pienamente il senso senza la ridondanza poco naturale di «rispondendo disse loro».
- source_word: Γενεὰ
  choice: generazione
  rationale: Mantiene il valore collettivo del singolare e indica il gruppo contemporaneo caratterizzato dal giudizio morale espresso dagli aggettivi.
- source_word: πονηρὰ
  choice: malvagia
  rationale: Esprime con chiarezza e adeguata forza la condanna morale del greco, in un registro biblico dignitoso ma corrente.
- source_word: μοιχαλὶς
  choice: adultera
  rationale: Conserva sia il senso letterale sia la risonanza profetica dell'infedeltà al patto, senza ridurre il termine alla sola parafrasi interpretativa «infedele».
- source_word: σημεῖον
  choice: segno
  rationale: È l'equivalente diretto e sufficientemente ampio; non aggiunge «miracoloso», elemento che il greco non esplicita.
- source_word: ἐπιζητεῖ
  choice: cerca
  rationale: Rende naturalmente l'azione richiesta dal contesto senza accentuarla in modo interpretativo con «esige» o «pretende».
- source_word: δοθήσεται
  choice: sarà dato
  rationale: Riproduce in modo naturale il futuro passivo greco.
- source_word: αὐτῇ
  choice: le
  rationale: Il pronome riprende il sostantivo femminile singolare «generazione»; l'italiano conserva naturalmente genere e numero.
- source_word: εἰ μὴ
  choice: se non
  rationale: Nella costruzione negativa introduce con precisione l'unica eccezione.
- source_word: τὸ σημεῖον Ἰωνᾶ τοῦ προφήτου
  choice: il segno di Giona il profeta
  rationale: Segue da vicino l'ordine greco, resta comprensibile e non anticipa quale sia la natura del segno, spiegata dal contesto successivo.
theological_decisions:
- issue: Significato di «adultera» nell'accusa di Gesù
  choice: Mantenere nel testo il termine metaforico-profetico «adultera».
  alternative: infedele
  rationale: Il vocabolo può evocare l'infedeltà al patto, oltre all'immoralità sessuale. La resa letterale conserva questa tensione teologica e intertestuale senza risolverla in una sola interpretazione.
- issue: Natura del «segno di Giona»
  choice: Lasciare la locuzione nel suo senso lessicale, senza spiegarla nel testo principale.
  alternative: un segno simile all'esperienza di Giona; il segno costituito da Giona stesso
  rationale: Il versetto introduce una locuzione il cui significato viene sviluppato nel contesto immediatamente successivo; esplicitarne qui la natura anticiperebbe un'interpretazione.
translation_notes:
  register: Italiano moderno standard, dignitoso e accessibile. La formula narrativa greca è resa senza calco ridondante; «malvagia e adultera» conserva la forza dell'accusa, mentre «segno» resta volutamente non specificato.
