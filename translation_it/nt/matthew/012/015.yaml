id: MAT.12.15
reference: Matthew 12:15
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς γνοὺς ἀνεχώρησεν ἐκεῖθεν. καὶ ἠκολούθησαν ⸀αὐτῷ πολλοί, καὶ ἐθεράπευσεν αὐτοὺς πάντας,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/015.yaml
  text: But Jesus[a], knowing this, withdrew from there. And many followed him, and he healed them all,
translation:
  language: it
  text: Ma Gesù, saputo questo[a], si ritirò di là. Molti lo seguirono ed egli li guarì tutti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Il greco lascia implicito l’oggetto di «saputo»; «questo» rinvia a quanto narrato nel versetto precedente. Si può anche tradurre: «venuto a conoscenza di ciò».'
    reason: lexical_alternative
lexical_decisions:
- source_word: γνοὺς
  choice: saputolo
  rationale: Il participio aoristo indica una conoscenza acquisita prima dell'azione principale; il pronome enclitico rinvia in modo conciso a quanto narrato nel versetto precedente, senza precisare ulteriormente l'oggetto implicito nel greco.
- source_word: ἀνεχώρησεν
  choice: si ritirò
  rationale: In questo contesto ἀναχωρέω esprime un allontanamento intenzionale di fronte all'opposizione, più specifico del semplice «se ne andò».
- source_word: ἐκεῖθεν
  choice: di là
  rationale: Resa italiana naturale e concisa del moto da luogo espresso dall'avverbio.
- source_word: ἠκολούθησαν αὐτῷ πολλοί
  choice: Molti lo seguirono
  rationale: Conserva il semplice πολλοί senza trasformarlo esplicitamente in «folle» e adotta un ordine naturale in italiano.
- source_word: ἐθεράπευσεν
  choice: guarì
  rationale: Nel contesto evangelico delle guarigioni, «guarire» è l'equivalente italiano più chiaro e consueto.
- source_word: αὐτοὺς πάντας
  choice: li guarì tutti
  rationale: Mantiene la portata inclusiva di πάντας in una costruzione italiana idiomatica.
theological_decisions:
- issue: Oggetto implicito di γνοὺς
  choice: «saputolo», con rinvio contestuale segnato da nota
  alternative: «venutone a conoscenza»; «sapendo questo»
  rationale: Il greco non esprime l'oggetto del conoscere. «Saputolo» collega l'azione al complotto del versetto precedente senza esplicitarne più di quanto faccia il testo.
- issue: Sfumatura dell'allontanamento di Gesù
  choice: «si ritirò»
  alternative: «se ne andò»; «partì»
  rationale: La resa conserva l'idea narrativa di un ritiro intenzionale in risposta all'opposizione, senza attribuire paura o codardia.
translation_notes:
  register: Italiano moderno, dignitoso e scorrevole. «Saputolo» è leggermente sostenuto ma ancora trasparente e permette di rispettare la concisione e l'ambiguità controllata del greco; la nota chiarisce il rinvio contestuale. La virgola prima di «ed egli» distingue con naturalezza i soggetti delle due proposizioni.
