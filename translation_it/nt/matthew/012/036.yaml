source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι πᾶν ῥῆμα ἀργὸν ὃ ⸀λαλήσουσιν οἱ ἄνθρωποι, ἀποδώσουσιν περὶ αὐτοῦ λόγον ἐν ἡμέρᾳ κρίσεως·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/036.yaml
  text: But I tell you that for every careless word that people speak[b][a], they will give an account on the day of judgment.
translation:
  language: it
  text: Ma io vi dico che le persone renderanno conto, nel giorno del giudizio, di ogni parola vana[a] che diranno.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «parola oziosa» o «priva di frutto». L’aggettivo greco può indicare ciò che è inattivo, improduttivo o detto con irresponsabile leggerezza.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Ma io vi dico
  rationale: Il presente λέγω con il pronome esplicito si rende naturalmente con «io vi dico»; δέ introduce qui un contrasto moderato con quanto precede, ben espresso da «Ma».
- source_word: πᾶν ῥῆμα
  choice: ogni parola
  rationale: πᾶν al singolare ha valore distributivo; ῥῆμα indica qui una parola o espressione pronunciata. «Ogni parola» è naturale e conserva la formulazione ampia del testo.
- source_word: ἀργὸν
  choice: vana
  rationale: L'aggettivo indica ciò che è inattivo, improduttivo o privo di frutto e, nel contesto del giudizio sul parlare, può implicare leggerezza o irresponsabilità. «Vana» conserva l'ampiezza semantica senza limitarla alle sole parole apertamente maligne; una nota segnala le alternative.
- source_word: ὃ λαλήσουσιν οἱ ἄνθρωποι
  choice: che le persone diranno
  rationale: Il futuro λαλήσουσιν è mantenuto con «diranno». οἱ ἄνθρωποι designa genericamente gli esseri umani, non soltanto i maschi; «le persone» è inclusivo e corrente.
- source_word: ἀποδώσουσιν περὶ αὐτοῦ λόγον
  choice: di ogni parola ... renderanno conto
  rationale: ἀποδίδωμι con λόγον forma l'espressione «rendere conto»; περὶ αὐτοῦ indica ciò di cui si deve rispondere. L'ordine italiano con «di ogni parola» conserva il referente senza una ripresa pronominale ridondante.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: nel giorno del giudizio
  rationale: L'espressione temporale indica il momento del giudizio giudiziario; «nel giorno del giudizio» è preciso, dignitoso e ben comprensibile.
theological_decisions:
- issue: Forza morale di ἀργόν
  choice: «parola vana», con nota esplicativa
  alternative: «parola detta con leggerezza», «parola oziosa» o «parola inutile»
  rationale: Il contesto attribuisce responsabilità morale al parlare, ma l'aggettivo non specifica che la parola sia necessariamente maliziosa. La resa scelta mantiene la tensione tra inutilità, sterilità e irresponsabilità senza restringere indebitamente il senso.
- issue: Valore generico di οἱ ἄνθρωποι
  choice: «le persone»
  alternative: «gli uomini» o «gli esseri umani»
  rationale: Il plurale greco si riferisce genericamente all'umanità. «Le persone» comunica tale inclusività in italiano moderno senza suggerire un riferimento esclusivo ai maschi.
translation_notes:
  register: Italiano moderno, naturale e dignitoso. La struttura mette in rilievo «ogni parola» come nel greco, pur mantenendo una sintassi italiana scorrevole. Il futuro del testo sorgente è conservato.
