id: MAT.12.8
reference: Matthew 12:8
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: κύριος γάρ ἐστιν τοῦ σαββάτου ὁ υἱὸς τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/008.yaml
  text: For the Son of Man is Lord of the Sabbath[a][b].
translation:
  language: it
  text: Il Figlio dell’uomo, infatti, è Signore del sabato.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «il Figlio dell’uomo è padrone del sabato».'
    reason: lexical_alternative
  - marker: b
    text: «Figlio dell’uomo» è l’autodesignazione caratteristica di Gesù nei Vangeli; la locuzione può anche essere intesa più genericamente in riferimento all’essere umano, ma questa resa attenuerebbe la sua probabile valenza titolare.
    reason: alternative_reading
lexical_decisions:
- source_word: γάρ
  choice: infatti
  rationale: Conserva il valore esplicativo della congiunzione e collega naturalmente l’affermazione all’argomentazione precedente.
- source_word: κύριος
  choice: Signore
  rationale: Esprime piena autorità e conserva il peso cristologico del titolo; «padrone» sarebbe possibile, ma in questo contesto risulterebbe meno solenne e teologicamente meno pregnante.
- source_word: τοῦ σαββάτου
  choice: del sabato
  rationale: Riproduce in modo naturale il genitivo dipendente da κύριος. In italiano «sabato» si scrive normalmente con l’iniziale minuscola anche quando indica il giorno sacro ebraico.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: il Figlio dell’uomo
  rationale: Mantiene l’autodesignazione caratteristica di Gesù nei Vangeli e la sua possibile risonanza intertestuale, senza ridurla a una generica espressione antropologica.
- source_word: ἐστιν
  choice: è
  rationale: Rende direttamente la copula al presente, senza espansioni interpretative.
theological_decisions:
- issue: Forza cristologica di κύριος ... τοῦ σαββάτου
  choice: «il Figlio dell’uomo ... è Signore del sabato»
  alternative: «il Figlio dell’uomo è padrone del sabato»
  rationale: «Signore» preserva l’affermazione forte di autorità sul sabato e il suo peso cristologico, senza specificare oltre ciò che il testo afferma.
- issue: Valore di ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Trattarlo come il titolo «il Figlio dell’uomo»
  alternative: «l’essere umano» / «l’uomo»
  rationale: Nel contesto evangelico la locuzione è l’autodesignazione caratteristica di Gesù e può evocare Daniele 7; la resa tradizionale conserva tale tensione, mentre una formulazione generica la attenuerebbe.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. La collocazione di «infatti» dopo il soggetto è idiomatica e conserva il nesso esplicativo. La maiuscola in «Figlio» e «Signore» segnala l’uso titolare; «sabato» resta minuscolo secondo l’uso ortografico italiano.
