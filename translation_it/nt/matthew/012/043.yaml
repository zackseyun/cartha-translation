  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Ὅταν δὲ τὸ ἀκάθαρτον πνεῦμα ἐξέλθῃ ἀπὸ τοῦ ἀνθρώπου, διέρχεται δι’ ἀνύδρων τόπων ζητοῦν ἀνάπαυσιν, καὶ οὐχ εὑρίσκει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/043.yaml
  text: When the unclean spirit goes out from the man[a], it passes through waterless places seeking rest, and does not find it.
translation:
  language: it
  text: Quando lo spirito impuro esce da un uomo, passa per luoghi senz’acqua[a] in cerca di riposo, e non lo trova.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «luoghi aridi». Il greco significa letteralmente «luoghi senz’acqua».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν δὲ
  choice: Quando
  rationale: Ὅταν introduce una circostanza temporale di carattere generale. Il lieve valore connettivo di δέ non richiede necessariamente una parola autonoma in italiano e viene lasciato al contesto, evitando un artificioso «ora».
- source_word: τὸ ἀκάθαρτον πνεῦμα
  choice: lo spirito impuro
  rationale: Resa diretta e corrente che conserva il linguaggio della purezza presente in ἀκάθαρτον senza sostituire «spirito» con l’interpretativo «demone».
- source_word: ἐξέλθῃ ἀπὸ τοῦ ἀνθρώπου
  choice: esce da una persona
  rationale: Il presente italiano esprime naturalmente la condizione generale introdotta da ὅταν. Nel detto illustrativo ὁ ἄνθρωπος ha valore rappresentativo; «una persona» comunica tale genericità senza suggerire un individuo già identificato.
- source_word: διέρχεται δι’ ἀνύδρων τόπων
  choice: passa per luoghi senz’acqua
  rationale: «Passa per» rende il movimento attraverso una regione; «senz’acqua» conserva l’immagine concreta e il significato letterale di ἄνυδρος.
- source_word: ζητοῦν ἀνάπαυσιν
  choice: in cerca di riposo
  rationale: La locuzione italiana rende in modo naturale l’azione contemporanea del participio ζητοῦν e mantiene «riposo» senza trasformarlo in uno specifico luogo di sosta.
- source_word: καὶ οὐχ εὑρίσκει
  choice: e non lo trova
  rationale: Il pronome «lo», richiesto dall’italiano naturale, riprende «riposo»; la congiunzione «e» conserva il semplice collegamento del greco.
theological_decisions:
- issue: Resa di πνεῦμα nel contesto di uno spirito maligno
  choice: spirito
  alternative: demone
  rationale: Benché il referente sia uno spirito maligno personale, il testo usa πνεῦμα e non δαιμόνιον; «spirito impuro» conserva la formulazione e la tensione lessicale dell’originale.
translation_notes:
  register: Italiano moderno, chiaro e dignitoso. «Spirito impuro» è più corrente di «spirito immondo» e mantiene il richiamo alla categoria dell’impurità. La struttura resta vicina al greco senza risultare rigida.
