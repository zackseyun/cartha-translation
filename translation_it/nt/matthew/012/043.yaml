  naturalness: Il periodo è scorrevole e di registro moderno dignitoso. «Luoghi senz’acqua», «in cerca di riposo» e «non lo trova» sono naturali. «Un uomo» è ugualmente idiomatico nel contesto e migliora l’aderenza lessicale.
