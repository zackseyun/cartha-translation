id: MAT.12.38
reference: Matthew 12:38
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Τότε ἀπεκρίθησαν ⸀αὐτῷ τινες τῶν γραμματέων καὶ Φαρισαίων λέγοντες· Διδάσκαλε, θέλομεν ἀπὸ σοῦ σημεῖον ἰδεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/038.yaml
  text: Then some of the scribes and Pharisees answered him[a], saying, “Teacher, we want to see a sign from you.”
translation:
  language: it
  text: 'Allora alcuni degli scribi e dei farisei gli risposero: «Maestro, vogliamo vedere da te un segno[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oppure «un segno miracoloso». Il termine greco può indicare un segno con valenza miracolosa, ma nel testo si conserva il termine più ampio «segno».
    reason: Alternativa lessicale che esplicita la probabile valenza miracolosa del termine nel contesto.
lexical_decisions:
- source_word: Τότε
  choice: Allora
  rationale: Introduce in modo naturale la successione narrativa, conservando il valore temporale del greco.
- source_word: ἀπεκρίθησαν αὐτῷ
  choice: gli risposero
  rationale: Mantiene l’idioma narrativo di ἀποκρίνομαι e incorpora naturalmente in italiano il destinatario espresso dal dativo αὐτῷ.
- source_word: τινες τῶν γραμματέων καὶ Φαρισαίων
  choice: alcuni degli scribi e dei farisei
  rationale: Esprime che si tratta di alcuni appartenenti ai gruppi menzionati, senza estendere l’affermazione a tutti gli scribi e i farisei.
- source_word: λέγοντες
  choice: ':'
  rationale: In italiano i due punti introducono il discorso diretto in modo più naturale rispetto al calco «dicendo», senza perdere alcuna informazione sostanziale.
- source_word: Διδάσκαλε
  choice: Maestro
  rationale: È il normale titolo italiano per chi insegna e non aggiunge sfumature di autorità estranee al termine greco.
- source_word: θέλομεν
  choice: vogliamo
  rationale: Resa diretta e corrente della volontà espressa dal verbo greco.
- source_word: ἀπὸ σοῦ
  choice: da te
  rationale: 'Conserva il valore di provenienza o origine: il segno richiesto deve venire da Gesù.'
- source_word: σημεῖον
  choice: un segno
  rationale: Mantiene il significato ampio del sostantivo greco, lasciando al contesto la sua possibile portata miracolosa.
- source_word: ἰδεῖν
  choice: vedere
  rationale: Equivalente italiano diretto dell’infinito di ὁράω, senza l’espansione interpretativa «assistere a».
theological_decisions:
- issue: Natura del σημεῖον richiesto
  choice: un segno
  alternative: un segno miracoloso
  rationale: Nel contesto il segno richiesto ha verosimilmente carattere miracoloso e valore di conferma, ma σημεῖον significa propriamente «segno». La traduzione principale conserva quindi l’ampiezza del termine senza specificare più di quanto dica il testo.
translation_notes:
  register: Italiano moderno, chiaro e dignitoso. La formulazione conserva il tradizionale e comprensibile «scribi», evita il calco poco naturale del participio «dicendo» e mantiene l’ordine «vedere da te un segno» per rendere trasparente la provenienza richiesta.
