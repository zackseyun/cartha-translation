id: MAT.12.2
reference: Matthew 12:2
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: οἱ δὲ Φαρισαῖοι ἰδόντες εἶπαν αὐτῷ· Ἰδοὺ οἱ μαθηταί σου ποιοῦσιν ὃ οὐκ ἔξεστιν ποιεῖν ἐν σαββάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/002.yaml
  text: But when the Pharisees saw it[a], they said to him, “Look, your disciples are doing what is not lawful to do on the Sabbath.”
translation:
  language: it
  text: 'Ma i farisei, vedendo ciò, gli dissero: «Ecco, i tuoi discepoli fanno ciò che non è lecito fare di sabato».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «fanno ciò che non è permesso fare di sabato».'
    reason: Alternativa lessicale per οὐκ ἔξεστιν.
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: Segnala il contrasto con lo sviluppo narrativo precedente in modo naturale e diretto.
- source_word: ἰδόντες
  choice: vedendo ciò
  rationale: Rende il participio aoristo con valore temporale-circostanziale; «ciò» esplicita sobriamente l'azione dei discepoli implicita nel contesto.
- source_word: εἶπαν αὐτῷ
  choice: gli dissero
  rationale: Formula italiana corrente e fedele per l'atto di rivolgersi a Gesù.
- source_word: Ἰδοὺ
  choice: Ecco
  rationale: Conserva la forza deittica dell'interiezione con un registro moderno ma dignitoso.
- source_word: μαθηταί
  choice: discepoli
  rationale: Termine consolidato che mantiene il rapporto tra maestro e discepolo proprio del contesto evangelico.
- source_word: ποιοῦσιν ... ποιεῖν
  choice: fanno ... fare
  rationale: Mantiene la ripetizione di ποιέω presente nel greco senza appesantire l'italiano.
- source_word: ὃ οὐκ ἔξεστιν
  choice: ciò che non è lecito
  rationale: Esprime il senso giuridico-permissivo dell'accusa senza determinare se la norma invocata sia la legge biblica o una sua interpretazione tradizionale.
- source_word: ἐν σαββάτῳ
  choice: di sabato
  rationale: È la resa temporale idiomatica in italiano e indica l'osservanza del sabato nel contesto.
theological_decisions:
- issue: Natura dell'obiezione dei farisei
  choice: «non è lecito»
  alternative: «non è permesso» / «è contro la Legge»
  rationale: La formulazione conserva il carattere legale-permissivo di ἔξεστιν senza identificare la fonte precisa del divieto né giudicare anticipatamente la correttezza dell'accusa.
translation_notes:
  register: Italiano standard moderno, leggibile e dignitoso. «Ecco» conserva la vivacità dell'accusa; «di sabato» è più naturale di «nel sabato». Il dimostrativo «ciò» mantiene il riferimento contestuale senza aggiungere dettagli assenti dal testo greco.
source_grounding:
  english_pob_role: consult_only
