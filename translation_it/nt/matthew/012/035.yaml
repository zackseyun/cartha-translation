id: MAT.12.35
reference: Matthew 12:35
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ὁ ἀγαθὸς ἄνθρωπος ἐκ τοῦ ἀγαθοῦ θησαυροῦ ἐκβάλλει ἀγαθά, καὶ ὁ πονηρὸς ἄνθρωπος ἐκ τοῦ πονηροῦ θησαυροῦ ἐκβάλλει πονηρά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/035.yaml
  text: The good man brings out good things from his good treasure[b][a], and the evil man brings out evil things from his evil treasure.
translation:
  language: it
  text: L’uomo buono trae dal buon tesoro cose buone[a][b], e l’uomo malvagio trae dal tesoro malvagio cose malvagie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Qui «uomo» indica la persona in senso rappresentativo; il greco usa ἄνθρωπος al maschile singolare.
    reason: lexical_alternative
  - marker: b
    text: Il contesto immediato riguarda il parlare; perciò le «cose buone» e le «cose malvagie» possono riferirsi in modo particolare alle parole.
    reason: cross_reference
lexical_decisions:
- source_word: ἀγαθὸς / ἀγαθά
  choice: buono / cose buone
  rationale: Mantiene la ripetizione lessicale e il contrasto morale del greco; il neutro plurale sostantivato ἀγαθά è reso naturalmente con «cose buone».
- source_word: ἄνθρωπος
  choice: uomo
  rationale: Il sostantivo greco è al maschile singolare e, nella formulazione proverbiale, rappresenta una persona in generale. «Uomo» conserva questa forma senza limitarne il riferimento ai soli maschi.
- source_word: θησαυροῦ
  choice: tesoro
  rationale: Conserva la metafora di una riserva accumulata dalla quale proviene ciò che la persona manifesta; «deposito» risulterebbe più concreto e meno evocativo.
- source_word: ἐκβάλλει
  choice: trae
  rationale: Esprime in italiano corrente il far venire fuori qualcosa da una riserva, senza la forza eccessiva che avrebbe «scaglia fuori».
- source_word: πονηρὸς / πονηρά
  choice: malvagio / cose malvagie
  rationale: Rende il valore morale forte di πονηρός e preserva la simmetria tra la persona e ciò che ne proviene; «cattivo» sarebbe possibile ma meno netto.
- source_word: ἐκ
  choice: da
  rationale: «Dal buon tesoro» e «dal tesoro malvagio» rendono in modo idiomatico l’origine indicata da ἐκ.
theological_decisions:
- issue: Contrasto morale e portata delle «cose» prodotte
  choice: 'La formulazione resta ampia: ciò che è buono o malvagio proviene dalla riserva morale della persona.'
  alternative: Specificare che si tratta esclusivamente di parole.
  rationale: Il contesto immediato riguarda il parlare, ma il greco usa aggettivi sostantivati neutri plurali senza nominare esplicitamente le parole. Il testo principale conserva quindi l’ampiezza dell’espressione, mentre una nota segnala il rilievo del contesto.
translation_notes:
  register: Italiano moderno, dignitoso e proverbiale. Il parallelismo e le ripetizioni del testo greco sono conservati, evitando di aggiungere «cuore» o un possessivo non espresso nel testo.
