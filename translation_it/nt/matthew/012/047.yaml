  text: ⸂εἶπεν δέ τις αὐτῷ· Ἰδοὺ ἡ μήτηρ σου καὶ οἱ ἀδελφοί σου ἔξω ἑστήκασιν, ζητοῦντές σοι λαλῆσαι.⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/047.yaml
  text: Then someone said to him[a], “Look, your mother and your brothers are standing outside, seeking to speak to you.”
translation:
  language: it
  text: 'Allora qualcuno gli disse[a]: «Ecco, tua madre e i tuoi fratelli sono fuori e cercano di parlarti».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alcuni manoscritti omettono questo versetto.
    reason: textual_variant
lexical_decisions:
- source_word: εἶπεν δέ τις αὐτῷ
  choice: Allora qualcuno gli disse
  rationale: δέ collega con leggerezza la frase al contesto narrativo; «allora» rende in modo naturale la progressione senza introdurre un forte contrasto. τις resta indefinito con «qualcuno».
- source_word: Ἰδοὺ
  choice: Ecco
  rationale: «Ecco» è un richiamo d'attenzione corrente e dignitoso che conserva la forza deittica di ἰδού.
- source_word: ἡ μήτηρ σου
  choice: tua madre
  rationale: Resa diretta e idiomatica del sostantivo con possessivo.
- source_word: οἱ ἀδελφοί σου
  choice: i tuoi fratelli
  rationale: Il maschile plurale nel contesto designa i fratelli maschi di Gesù; «fratelli» conserva il riferimento senza ampliarlo a «fratelli e sorelle».
- source_word: ἔξω ἑστήκασιν
  choice: sono fuori
  rationale: Il perfetto esprime lo stato presente di chi si è fermato fuori. In italiano «sono fuori» comunica naturalmente tale stato; «stanno fuori» potrebbe suggerire permanenza o scelta abituale.
- source_word: ζητοῦντές σοι λαλῆσαι
  choice: cercano di parlarti
  rationale: Conserva il valore del participio di ζητέω e rende in italiano corrente il dativo σοι con l'infinito λαλῆσαι.
theological_decisions:
- issue: Stato testuale di Matteo 12:47
  choice: Includere il versetto nel testo principale, con una nota sulla sua omissione in alcuni manoscritti.
  alternative: Omettere il versetto perché assente in alcuni testimoni.
  rationale: Il testo SBLGNT fornito presenta il versetto tra segni che ne indicano l'incertezza testuale. Tradurlo e segnalare la variante in nota mantiene trasparenti sia il testo di partenza sia l'evidenza manoscritta, senza risolvere tacitamente la questione.
translation_notes:
  register: Italiano standard moderno, naturale e dignitoso. «Ecco» mantiene il richiamo diretto dell'originale; «cercano di parlarti» evita una formulazione legnosa pur restando vicina alla costruzione greca.
