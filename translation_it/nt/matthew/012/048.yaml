source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν τῷ ⸀λέγοντι αὐτῷ· Τίς ἐστιν ἡ μήτηρ μου, καὶ τίνες εἰσὶν οἱ ἀδελφοί μου;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/048.yaml
  text: But he answered the one speaking to him[a], “Who is my mother, and who are my brothers?”
translation:
  language: it
  text: 'Ma egli rispose a colui che gli parlava[a]: «Chi è mia madre e chi sono i miei fratelli?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Più formalmente: «Ma egli, rispondendo, disse a colui che gli parlava».'
    reason: Alternativa lessicale che riproduce più da vicino la formula greca ἀποκριθεὶς εἶπεν.
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν
  choice: Ma egli rispose
  rationale: La costruzione participiale con εἶπεν è una formula greca di influsso semitico che significa «rispose e disse». In italiano naturale «rispose» ne comunica pienamente il senso; «Ma» rende δέ e segnala il passaggio alla replica di Gesù.
- source_word: τῷ λέγοντι αὐτῷ
  choice: a colui che gli parlava
  rationale: Il participio presente sostantivato indica la persona che si stava rivolgendo a Gesù. L'imperfetto italiano conserva l'azione in corso senza trasformarla nel più interpretativo «a colui che glielo aveva detto».
- source_word: Τίς ἐστιν ἡ μήτηρ μου
  choice: Chi è mia madre
  rationale: Resa diretta e idiomatica dell'interrogativo d'identità e del termine di parentela.
- source_word: καὶ τίνες εἰσὶν οἱ ἀδελφοί μου
  choice: e chi sono i miei fratelli
  rationale: «Chi» è invariabile in italiano e, con il verbo plurale, riproduce naturalmente l'interrogativo plurale τίνες. «Fratelli» conserva il sostantivo maschile plurale del testo e il referente familiare immediato.
theological_decisions:
- issue: Possibile attenuazione interpretativa della domanda retorica di Gesù sull'identità della famiglia
  choice: Conservare le domande letterali senza ampliamento esplicativo
  alternative: «Chi può essere considerato mia madre e chi possono essere considerati miei fratelli?»
  rationale: Il contesto successivo chiarirà la ridefinizione dei legami familiari operata da Gesù; anticiparla qui risolverebbe una tensione narrativa e teologica che il versetto lascia intenzionalmente aperta.
- issue: Resa di ἀδελφοί
  choice: fratelli
  alternative: «fratelli e sorelle» oppure «familiari»
  rationale: Il referente immediato è il gruppo dei parenti di Gesù menzionato nella scena, e il testo usa il termine di parentela maschile plurale. Una formulazione inclusiva amplierebbe qui il significato espresso.
translation_notes:
  register: Italiano standard moderno, naturale e dignitoso. «Egli» mantiene chiaro il cambio di soggetto e conferisce un tono narrativo sobrio; la formula greca ridondante è resa idiomaticamente nel testo e documentata in nota.
