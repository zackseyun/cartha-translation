  naturalness: Il registro è moderno e naturale. «Scaccia» è appropriato nel contesto; «restare in piedi» conserva in modo comprensibile la metafora di σταθήσεται. «Si è diviso contro se stesso» è più scorrevole e preciso di «è diviso contro sé stesso» in questo ragionamento ipotetico.
  terminology: «Satana» e «regno» sono forme standard e adeguate. Si adotta l'ortografia corrente «se stesso».
