id: MAT.12.26
reference: Matthew 12:26
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: καὶ εἰ ὁ Σατανᾶς τὸν Σατανᾶν ἐκβάλλει, ἐφ’ ἑαυτὸν ἐμερίσθη· πῶς οὖν σταθήσεται ἡ βασιλεία αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/026.yaml
  text: And if Satan casts out Satan[a], he is divided against himself[c][b]. How then will his kingdom stand?
translation:
  language: it
  text: E se Satana scaccia Satana, si è diviso contro se stesso.[a] Come potrà dunque restare in piedi il suo regno?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «è diviso contro se stesso».'
    reason: lexical_alternative
  - marker: b
    text: 'Oppure: «Come dunque resterà in piedi il suo regno?»'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ εἰ
  choice: E se
  rationale: Conserva sia il collegamento argomentativo espresso da καί sia la condizione introdotta da εἰ.
- source_word: ὁ Σατανᾶς / τὸν Σατανᾶν
  choice: Satana
  rationale: Usa la forma italiana tradizionale e corrente del nome o titolo personale Σατανᾶς.
- source_word: ἐκβάλλει
  choice: scaccia
  rationale: Nel contesto degli esorcismi rende naturalmente l'idea di cacciare via o espellere, senza tecnicismi.
- source_word: ἐφ’ ἑαυτὸν
  choice: contro sé stesso
  rationale: Riproduce l'idea di opposizione interna espressa da ἐπί con il pronome riflessivo.
- source_word: ἐμερίσθη
  choice: è diviso
  rationale: Esprime in italiano lo stato risultante implicato dall'aoristo passivo nella formulazione ipotetica; la nota conserva la possibilità di rendere più esplicitamente l'aspetto risultativo.
- source_word: πῶς οὖν
  choice: Come ... dunque
  rationale: Mantiene sia l'interrogativo πῶς sia il valore inferenziale di οὖν in un ordine naturale in italiano.
- source_word: σταθήσεται
  choice: potrà ... restare in piedi
  rationale: Rende il futuro passivo nel senso di continuare a sussistere, conservando al tempo stesso la metafora dello stare in piedi.
- source_word: ἡ βασιλεία αὐτοῦ
  choice: il suo regno
  rationale: Nel contesto indica il dominio di Satana concepito come regno; questa resa conserva l'immagine senza trasformarla in una spiegazione.
theological_decisions:
- issue: Forza dell'argomento sulla divisione di Satana
  choice: 'La frase è resa come una reductio: se Satana scaccia Satana, si trova diviso contro sé stesso e il suo regno non può sussistere.'
  alternative: Esplicitare l'immagine più ampia della casa divisa, presente nel contesto precedente.
  rationale: Il versetto parla direttamente della divisione interna e della stabilità del regno di Satana; non è necessario importare nella frase l'immagine contestuale della casa.
translation_notes:
  register: Italiano moderno, chiaro e dignitoso. «Scaccia» è corrente nel contesto degli esorcismi; «restare in piedi» conserva la metafora greca pur risultando comprensibile. Tutti i richiami di nota compaiono nel testo.
