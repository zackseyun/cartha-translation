  source_fidelity: 'La resa segue fedelmente il greco: «canna incrinata» conserva l’idea di una canna già danneggiata senza anticiparne la rottura; «stoppino che fuma» rende appropriatamente λίνον τυφόμενον; «non spegnerà» corrisponde a σβέσει. «Finché non porti la giustizia alla vittoria» riproduce bene il valore prospettico di ἕως ἂν, il senso dinamico di ἐκβάλῃ e l’esito espresso da εἰς νῖκος. «Giustizia» è una scelta contestualmente fondata per κρίσις, con «giudizio» correttamente conservato come alternativa.'
  naturalness: L’italiano è moderno, piano e dignitoso. «Canna incrinata» e «stoppino che fuma» sono comprensibili e mantengono l’immagine senza ricorrere a formulazioni arcaiche. La costruzione «finché non porti» è naturale dopo il futuro e non forza indebite implicazioni circa ciò che seguirebbe il conseguimento della vittoria.
  terminology: La terminologia è coerente con l’allusione isaiana e con un registro biblico moderno. «Stoppino» chiarisce il referente materiale di λίνον, mentre la nota documenta correttamente il riferimento letterale al lino. L’ancora [a] segue il sintagma pertinente e [b] è collocata sulla proposizione che contiene la scelta interpretativa «giustizia».
