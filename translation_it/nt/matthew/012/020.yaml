id: MAT.12.20
reference: Matthew 12:20
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: κάλαμον συντετριμμένον οὐ κατεάξει καὶ λίνον τυφόμενον οὐ σβέσει, ἕως ἂν ἐκβάλῃ εἰς νῖκος τὴν κρίσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/020.yaml
  text: He will not break a bruised reed[a], and he will not extinguish a smoldering wick[b], until he brings justice to victory.
translation:
  language: it
  text: Non spezzerà una canna incrinata e non spegnerà uno stoppino che fuma[a], finché non porti la giustizia alla vittoria[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il greco parla letteralmente di «lino che fuma», cioè del lino usato come stoppino di una lampada.
    reason: alternativa_lessicale
  - marker: b
    text: 'Oppure: «finché non porti il giudizio alla vittoria».'
    reason: resa_alternativa
lexical_decisions:
- source_word: κάλαμον
  choice: canna
  rationale: Il termine indica comunemente una canna o il suo fusto; «canna» conserva con naturalezza l’immagine profetica di Isaia.
- source_word: συντετριμμένον
  choice: incrinata
  rationale: Il participio descrive qualcosa di schiacciato o danneggiato. «Incrinata» presenta una canna compromessa ma non ancora spezzata del tutto, in coerenza con il verbo seguente.
- source_word: κατεάξει
  choice: non spezzerà
  rationale: Il verbo significa spezzare o rompere; «spezzare» è preciso e idiomatico riferito a una canna.
- source_word: λίνον
  choice: stoppino
  rationale: Letteralmente il termine indica lino, ma nell’immagine designa il lino impiegato come stoppino di una lampada. «Stoppino» comunica subito il referente al lettore moderno.
- source_word: τυφόμενον
  choice: che fuma
  rationale: Il participio indica uno stoppino che produce fumo, ormai prossimo a spegnersi. «Che fuma» è italiano corrente e non aggiunge l’idea non esplicita di una fiamma ancora visibile.
- source_word: σβέσει
  choice: non spegnerà
  rationale: «Spegnere» è l’equivalente italiano naturale del verbo nel contesto di uno stoppino.
- source_word: ἕως ἂν
  choice: finché non
  rationale: La costruzione introduce il punto futuro verso cui tende l’azione; «finché non» è la resa italiana naturale.
- source_word: ἐκβάλῃ
  choice: porti
  rationale: Nel contesto il verbo esprime il condurre o far giungere la giustizia a un esito decisivo. «Porti» conserva il movimento verso il risultato senza la rigidità di una resa come «getti fuori».
- source_word: εἰς νῖκος
  choice: alla vittoria
  rationale: La locuzione esprime l’esito vittorioso; «alla vittoria» conserva chiaramente il valore finale.
- source_word: τὴν κρίσιν
  choice: la giustizia
  rationale: κρίσις può significare giudizio o giustizia. Nel contesto del Servo di Isaia, «giustizia» esprime bene l’instaurazione dell’ordine giusto, mentre l’alternativa «giudizio» è segnalata in nota.
theological_decisions:
- issue: Resa di κρίσις nella citazione del Servo isaiano
  choice: giustizia
  alternative: giudizio
  rationale: La missione del Servo non consiste soltanto nel pronunciare una sentenza, ma nel condurre a compimento l’ordine giusto di Dio. «Giustizia» conserva questa ampiezza profetica senza escludere la dimensione giudiziaria.
- issue: Grado di letteralità nell’immagine della lampada
  choice: stoppino ... spegnerà
  alternative: lino fumante ... estinguerà
  rationale: Il greco nomina letteralmente il lino impiegato come stoppino. La resa funzionale nel testo principale rende immediatamente comprensibile l’immagine, mentre la nota conserva trasparenza rispetto alla formulazione della fonte.
- issue: Portata temporale di ἕως ἂν
  choice: finché non porti
  alternative: fino a quando avrà portato
  rationale: La resa con il congiuntivo conserva l’orientamento verso un compimento futuro senza suggerire che, una volta raggiunta la vittoria, il Servo comincerà necessariamente a spezzare o spegnere ciò che è fragile.
translation_notes:
  register: Italiano moderno, piano e dignitoso. «Canna incrinata» evita di presentare la canna come già completamente spezzata; «stoppino che fuma» rende accessibile l’immagine domestica senza ricorrere a forme letterarie oggi meno comuni come «lucignolo fumigante».
