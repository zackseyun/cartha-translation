  terminology: «Giudizio», «condanneranno», «si pentirono» e «predicazione» sono termini precisi e idiomatici. Il nome «Giona» è la forma italiana standard. La nota rende correttamente l’alternativa personale senza presentarla come l’unica interpretazione possibile.
