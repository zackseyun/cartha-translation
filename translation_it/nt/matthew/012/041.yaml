id: MAT.12.41
reference: Matthew 12:41
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ἄνδρες Νινευῖται ἀναστήσονται ἐν τῇ κρίσει μετὰ τῆς γενεᾶς ταύτης καὶ κατακρινοῦσιν αὐτήν· ὅτι μετενόησαν εἰς τὸ κήρυγμα Ἰωνᾶ, καὶ ἰδοὺ πλεῖον Ἰωνᾶ ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/041.yaml
  text: The men of Nineveh will rise up in the judgment with this generation and will condemn it[a], because they repented at the preaching of Jonah, and behold[b], something greater than Jonah is here.
translation:
  language: it
  text: Gli uomini di Ninive si alzeranno nel giudizio insieme a questa generazione e la condanneranno, perché si pentirono in risposta alla predicazione di Giona; ed ecco, qui c’è qualcosa di più grande di Giona.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «qui c’è uno più grande di Giona». Il greco usa un’espressione neutra, letteralmente «qualcosa di più grande di Giona».
    reason: alternative_reading
lexical_decisions:
- source_word: ἄνδρες Νινευῖται
  choice: Gli uomini di Ninive
  rationale: Mantiene il riferimento esplicito agli uomini e rende l’etnico in un italiano naturale.
- source_word: ἀναστήσονται
  choice: si alzeranno
  rationale: Conserva l’immagine del sorgere e la possibile risonanza della risurrezione, senza specificarla oltre il testo.
- source_word: ἐν τῇ κρίσει
  choice: nel giudizio
  rationale: Riproduce direttamente l’espressione greca e il suo contesto giudiziario escatologico.
- source_word: μετὰ τῆς γενεᾶς ταύτης
  choice: insieme a questa generazione
  rationale: Rende μετά con il genitivo nel suo senso ordinario di compagnia; l’opposizione emerge dal verbo seguente.
- source_word: κατακρινοῦσιν αὐτήν
  choice: la condanneranno
  rationale: Il pronome femminile rinvia chiaramente a «questa generazione» e κατακρίνω indica una sentenza di condanna.
- source_word: μετενόησαν
  choice: si pentirono
  rationale: È il termine italiano corrente e teologicamente appropriato per il ravvedimento suscitato dall’annuncio profetico.
- source_word: εἰς τὸ κήρυγμα Ἰωνᾶ
  choice: in risposta alla predicazione di Giona
  rationale: Esplicita in italiano naturale il rapporto di risposta espresso da εἰς dopo μετανοέω, mentre «predicazione» rende κήρυγμα.
- source_word: ἰδοὺ
  choice: ed ecco
  rationale: Mantiene la solenne funzione enfatica del segnale discorsivo greco.
- source_word: πλεῖον Ἰωνᾶ ὧδε
  choice: qui c’è qualcosa di più grande di Giona
  rationale: Il neutro «qualcosa» conserva la forma e l’apertura semantica del comparativo neutro πλεῖον, senza ridurlo alla sola comparazione tra persone.
theological_decisions:
- issue: Il riferimento a Gesù nel comparativo neutro πλεῖον Ἰωνᾶ
  choice: qualcosa di più grande di Giona
  alternative: uno più grande di Giona
  rationale: Il greco usa un comparativo neutro, che può indicare la realtà più grande presente in Gesù e nella sua opera; la traduzione non lo normalizza silenziosamente in un riferimento personale maschile.
- issue: Il valore di ἀναστήσονται nella scena del giudizio
  choice: si alzeranno
  alternative: risorgeranno
  rationale: «Si alzeranno» preserva sia l’immagine giudiziaria sia una possibile risonanza di risurrezione, evitando di rendere esplicito ciò che il verbo lascia contestualmente aperto.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. La sintassi resta vicina al testo greco, ma «in risposta alla predicazione» evita l’italiano poco naturale «alla predicazione». «Ed ecco» conserva l’enfasi retorica senza assumere un tono colloquiale.
