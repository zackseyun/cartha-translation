  source_fidelity: 'Il testo rende fedelmente tutti gli elementi principali del greco: «Gli uomini di Ninive» conserva ἄνδρες Νινευῖται; «si alzeranno nel giudizio» rispecchia ἀναστήσονται ἐν τῇ κρίσει senza imporre «risorgeranno»; «insieme a questa generazione» mantiene il valore ordinario di μετά con il genitivo; e «la condanneranno» riproduce correttamente κατακρινοῦσιν αὐτήν. «Si pentirono in risposta alla predicazione di Giona» comunica in modo chiaro il rapporto espresso da μετενόησαν εἰς τὸ κήρυγμα Ἰωνᾶ. Il neutro di πλεῖον è opportunamente conservato in «qualcosa di più grande di Giona».'
