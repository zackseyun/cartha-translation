  text: καὶ ἐξίσταντο πάντες οἱ ὄχλοι καὶ ἔλεγον· Μήτι οὗτός ἐστιν ὁ υἱὸς Δαυίδ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/023.yaml
  text: And all the crowds were astonished and said[b][a], “Can this be the Son of David?”
translation:
  language: it
  text: 'Tutte le folle erano sbalordite e dicevano: «Che sia costui il Figlio di Davide[a]?»[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Il Figlio di Davide» è un titolo messianico e indica il liberatore regale promesso, discendente di Davide.
    reason: cross_reference
  - marker: b
    text: 'Oppure, rendendo più esplicitamente la sfumatura della domanda: «Non sarà mica costui il Figlio di Davide?»'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξίσταντο
  choice: erano sbalordite
  rationale: L’imperfetto descrive lo stupore persistente delle folle. «Erano sbalordite» esprime con naturalezza la forza del verbo senza ricorrere a formulazioni potenzialmente fuorvianti come «erano fuori di sé».
- source_word: πάντες οἱ ὄχλοι
  choice: tutte le folle
  rationale: Conserva sia l’idea di totalità espressa da πάντες sia il plurale esplicito di ὄχλοι.
- source_word: ἔλεγον
  choice: dicevano
  rationale: L’imperfetto italiano rende naturalmente il carattere continuato o collettivo del loro parlare.
- source_word: Μήτι
  choice: Che sia costui…?
  rationale: La domanda italiana esprime meraviglia ed esitazione senza trasformare la particella in un diniego categorico; la sfumatura di domanda orientata verso una risposta negativa è conservata in nota.
- source_word: ὁ υἱὸς Δαυίδ
  choice: il Figlio di Davide
  rationale: Mantiene la forma letterale e il valore titolare dell’espressione, senza sostituirla con una parafrasi interpretativa come «il Messia».
theological_decisions:
- issue: Valore messianico di «il Figlio di Davide»
  choice: Mantenere nel testo il titolo «il Figlio di Davide».
  alternative: il Messia; l’erede promesso di Davide
  rationale: Il greco presenta il titolo stesso. Mantenerlo conserva il suo radicamento storico e la sua risonanza teologica senza sciogliere nel testo l’implicazione messianica.
- issue: Forza interrogativa di Μήτι
  choice: 'Rendere la domanda come espressione esitante di meraviglia: «Che sia costui…?»'
  alternative: «Non sarà mica costui…?» oppure «Costui non può essere… vero?»
  rationale: Μήτι tende a orientare verso una risposta negativa, ma nel contesto la folla si interroga con stupore. La resa principale conserva l’apertura e la tensione della domanda; la formulazione più esplicitamente negativa è segnalata in nota.
translation_notes:
  register: Italiano moderno, naturale e dignitoso. «Costui» conserva il valore deittico di οὗτος ed è appropriato al registro biblico senza risultare arcaico; «Che sia…?» comunica una domanda meravigliata ed esitante. Le virgolette caporali seguono l’uso editoriale italiano.
