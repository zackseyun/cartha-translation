id: MAT.12.40
reference: Matthew 12:40
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἦν Ἰωνᾶς ἐν τῇ κοιλίᾳ τοῦ κήτους τρεῖς ἡμέρας καὶ τρεῖς νύκτας, οὕτως ἔσται ὁ υἱὸς τοῦ ἀνθρώπου ἐν τῇ καρδίᾳ τῆς γῆς τρεῖς ἡμέρας καὶ τρεῖς νύκτας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/040.yaml
  text: For just as Jonah was in the belly of the sea creature three days and three nights[c][b][a], so the Son of Man will be in the heart of the earth three days and three nights.
translation:
  language: it
  text: Infatti, come Giona rimase nel ventre della creatura marina[a] per tre giorni e tre notti[b], così il Figlio dell’uomo sarà nel cuore della terra[c] per tre giorni e tre notti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oppure «del grande pesce». Il termine greco indica un grande essere marino ed è più ampio di una precisa denominazione zoologica.
    reason: lexical_alternative
  - marker: b
    text: «Tre giorni e tre notti» è talvolta inteso idiomaticamente come comprensivo di parti di tre giorni, mentre altri lo intendono in senso strettamente letterale.
    reason: alternative_reading
  - marker: c
    text: «Nel cuore della terra» può riferirsi alla sepoltura, alla tomba, alle profondità della terra o al regno dei morti; nel testo principale la metafora greca è conservata.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Infatti, come
  rationale: Rende insieme il valore esplicativo di γάρ e quello comparativo di ὥσπερ in un italiano naturale; la correlazione è completata da «così».
- source_word: Ἰωνᾶς
  choice: Giona
  rationale: Forma italiana tradizionale e corrente del nome biblico.
- source_word: ἐν τῇ κοιλίᾳ
  choice: nel ventre
  rationale: «Ventre» rende direttamente κοιλία ed è dignitoso e idiomatico nel richiamo narrativo.
- source_word: τοῦ κήτους
  choice: della creatura marina
  rationale: κῆτος indica un grande essere marino senza imporre una classificazione zoologica specifica; «creatura marina» conserva tale ampiezza.
- source_word: τρεῖς ἡμέρας καὶ τρεῖς νύκτας
  choice: per tre giorni e tre notti
  rationale: Riproduce integralmente l’espressione temporale; «per» esplicita in italiano la durata implicita nella costruzione greca.
- source_word: οὕτως
  choice: così
  rationale: Introduce in modo conciso e naturale il secondo membro del paragone.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: il Figlio dell’uomo
  rationale: Resa biblica consolidata che conserva il valore titolare e le risonanze scritturistiche dell’espressione.
- source_word: ἔσται
  choice: sarà
  rationale: Rende direttamente il futuro di εἰμί, senza aggiungere l’idea di permanenza.
- source_word: ἐν τῇ καρδίᾳ τῆς γῆς
  choice: nel cuore della terra
  rationale: Conserva la metafora di καρδία e non decide se l’espressione indichi la sepoltura, la tomba, le profondità o il regno dei morti.
theological_decisions:
- issue: Significato di «nel cuore della terra»
  choice: Conservare letteralmente la metafora «nel cuore della terra».
  alternative: «nella tomba», «nelle profondità della terra» oppure «nel regno dei morti»
  rationale: Il greco non impone una sola esplicitazione interpretativa; la formulazione metaforica preserva l’ambiguità e la tensione teologica del testo.
- issue: Valore di «tre giorni e tre notti»
  choice: Mantenere integralmente l’espressione temporale.
  alternative: Intenderla come idioma inclusivo che comprende parti di tre giorni, oppure come periodo rigoroso di settantadue ore.
  rationale: La traduzione non deve risolvere nel testo principale il dibattito cronologico che va oltre la formulazione greca.
translation_notes:
  register: Italiano moderno standard, naturale e dignitoso. «Rimase» rende idiomaticamente l’essere di Giona nel ventre nel contesto narrativo, mentre «sarà» conserva la forma semplice del futuro greco. Le note sono accorpate in due marcatori e ogni marcatore compare nel testo principale.
