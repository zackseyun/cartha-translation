  text: Allontanatosi di là, andò nella loro sinagoga.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Asindeto in italiano
  rationale: Il semplice καί collega questo episodio al precedente; in italiano moderno il nesso resta naturale anche senza un «e» iniziale, evitando un andamento artificioso.
- source_word: μεταβὰς ἐκεῖθεν
  choice: Allontanatosi di là
  rationale: Rende il participio aoristo e l'avverbio locale come azione anteriore rispetto al verbo principale, conservando il passaggio dal luogo precedente senza precisarne la natura.
- source_word: ἦλθεν
  choice: andò
  rationale: Nel movimento narrativo verso un nuovo luogo, «andò» è l'equivalente italiano naturale di ἔρχομαι in questo contesto.
- source_word: εἰς τὴν συναγωγὴν
  choice: nella sinagoga
  rationale: «Nella» esprime in modo idiomatico sia la direzione sia l'ingresso indicati da εἰς con l'accusativo.
- source_word: αὐτῶν
  choice: loro
  rationale: Mantiene il possessivo plurale senza specificarne ulteriormente il referente.
theological_decisions:
- issue: Referente di «loro» in «loro sinagoga»
  choice: Conservare «loro sinagoga» senza identificare il gruppo
  alternative: Esplicitare «la sinagoga di quella gente» o attribuirle una sfumatura polemica
  rationale: Il greco presenta soltanto αὐτῶν e non precisa ulteriormente il referente né impone un tono ostile o settario.
translation_notes:
  register: Italiano moderno, sobrio e dignitoso. La costruzione participiale «Allontanatosi» conserva la compattezza narrativa dell'originale; «di là» riprende naturalmente il luogo della scena precedente.
