id: MAT.12.5
reference: Matthew 12:5
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ἢ οὐκ ἀνέγνωτε ἐν τῷ νόμῳ ὅτι τοῖς σάββασιν οἱ ἱερεῖς ἐν τῷ ἱερῷ τὸ σάββατον βεβηλοῦσιν καὶ ἀναίτιοί εἰσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/005.yaml
  text: Or have you not read in the Law that on the Sabbaths the priests in the temple profane the Sabbath and are guiltless?[a][b][c]
translation:
  language: it
  text: O non avete letto nella Legge[a] che, di sabato[b], i sacerdoti nel tempio profanano il sabato[c] e sono senza colpa?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La «Legge» indica qui la Legge mosaica contenuta nelle Scritture, probabilmente con riferimento alle prescrizioni sul servizio sacerdotale di sabato (cfr. Numeri 28:9-10).
    reason: cross_reference
  - marker: b
    text: Il greco dice letteralmente «nei sabati», con probabile riferimento a occasioni sabbatiche ripetute.
    reason: lexical_alternative
  - marker: c
    text: O «violano il sabato» o «infrangono il sabato». Il verbo greco indica propriamente il trattare qualcosa come comune o profano.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: O
  rationale: Introduce un ulteriore argomento scritturale nella replica di Gesù e conserva con naturalezza il collegamento retorico.
- source_word: οὐκ ἀνέγνωτε
  choice: non avete letto
  rationale: Rende in italiano corrente la formula retorica matteana, che richiama la conoscenza delle Scritture da parte degli interlocutori.
- source_word: ἐν τῷ νόμῳ
  choice: nella Legge
  rationale: La maiuscola segnala il riferimento alla Legge mosaica come corpus scritturale, non alla legge in senso astratto.
- source_word: τοῖς σάββασιν
  choice: nei giorni di sabato
  rationale: Conserva il valore plurale e iterativo del greco in una forma italiana più naturale del letterale «nei sabati».
- source_word: οἱ ἱερεῖς
  choice: i sacerdoti
  rationale: Designa direttamente i sacerdoti addetti al servizio del tempio.
- source_word: ἐν τῷ ἱερῷ
  choice: nel tempio
  rationale: Ἱερόν indica il complesso templare; «tempio» è la resa italiana naturale e adeguata al contesto.
- source_word: τὸ σάββατον
  choice: il sabato
  rationale: Mantiene il singolare, qui riferito al giorno o all'istituzione sabbatica.
- source_word: βεβηλοῦσιν
  choice: profanano
  rationale: Conserva il senso forte di trattare come comune o profano e mantiene la tensione retorica con «sono senza colpa».
- source_word: ἀναίτιοί εἰσιν
  choice: sono senza colpa
  rationale: Esprime chiaramente l'assenza di colpevolezza senza attenuare il contrasto con «profanano».
theological_decisions:
- issue: Se attenuare l'affermazione che i sacerdoti profanano il sabato
  choice: Mantenere «profanano il sabato» insieme a «sono senza colpa»
  alternative: «infrangono/violano il sabato e sono innocenti» oppure una parafrasi che spieghi subito che il servizio sacerdotale è lecito
  rationale: 'Il greco presenta deliberatamente una tensione: l''attività sacerdotale può essere descritta con il verbo forte βεβηλόω, eppure i sacerdoti non sono colpevoli. La traduzione non deve risolvere o smorzare tale tensione.'
- issue: Identificazione del riferimento scritturale nella Legge
  choice: Lasciare il riferimento generale nel testo e segnalarne in nota il probabile contesto
  alternative: Inserire esplicitamente Numeri 28:9-10 nel testo
  rationale: Il versetto non cita direttamente un passo specifico; la nota può orientare il lettore senza rendere più determinato ciò che il greco lascia implicito.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. «Nei giorni di sabato» rende con naturalezza il plurale greco, indicando occasioni ripetute. Il forte contrasto fra «profanano» e «sono senza colpa» è intenzionalmente preservato.
