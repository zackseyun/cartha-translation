id: MAT.12.31
reference: Matthew 12:31
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: διὰ τοῦτο λέγω ὑμῖν, πᾶσα ἁμαρτία καὶ βλασφημία ἀφεθήσεται τοῖς ἀνθρώποις, ἡ δὲ τοῦ πνεύματος βλασφημία οὐκ ⸀ἀφεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/031.yaml
  text: Therefore I tell you[a], every sin and blasphemy will be forgiven people[b], but blasphemy against the Spirit will not be forgiven.
translation:
  language: it
  text: 'Perciò vi dico: ogni peccato e ogni bestemmia saranno perdonati agli esseri umani, ma la bestemmia contro lo Spirito[a] non sarà perdonata.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «contro lo Spirito Santo». Dal contesto il referente è lo Spirito Santo, benché questo versetto dica semplicemente «lo Spirito».
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Perciò
  rationale: Introduce con naturalezza l’inferenza tratta dal contesto precedente e conserva il nesso logico dell’espressione greca.
- source_word: λέγω ὑμῖν
  choice: vi dico
  rationale: Formula discorsiva diretta e solenne, idiomatica nell’italiano contemporaneo.
- source_word: πᾶσα ἁμαρτία καὶ βλασφημία
  choice: ogni peccato e ogni bestemmia
  rationale: La ripetizione italiana di «ogni» rende chiara la portata distributiva di πᾶσα su entrambi i sostantivi senza alterarne il senso.
- source_word: ἀφεθήσεται
  choice: saranno perdonati / non sarà perdonata
  rationale: Nel contesto ἀφίημι indica il perdono. L’accordo al plurale nella prima proposizione è richiesto dai due soggetti coordinati in italiano; il singolare nella seconda segue «bestemmia».
- source_word: τοῖς ἀνθρώποις
  choice: agli esseri umani
  rationale: Il dativo indica coloro ai quali viene concesso il perdono. «Esseri umani» conserva il riferimento generico e inclusivo di ἄνθρωποι senza limitarlo ai maschi.
- source_word: ἡ δὲ τοῦ πνεύματος βλασφημία
  choice: ma la bestemmia contro lo Spirito
  rationale: Il genitivo indica qui l’oggetto della bestemmia. «Contro» evita l’ambiguo possessivo «dello Spirito», mentre «ma» conserva il contrasto introdotto da δέ.
theological_decisions:
- issue: Se rendere πνεύματος con «Spirito» oppure «Spirito Santo» nel testo principale
  choice: Spirito
  alternative: Spirito Santo
  rationale: Il testo greco del versetto ha semplicemente τοῦ πνεύματος, senza ἁγίου. Il contesto identifica chiaramente il referente con lo Spirito Santo, ma il testo principale conserva la formulazione del versetto e segnala l’esplicitazione interpretativa in nota.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. La struttura passiva è mantenuta per conservare il parallelismo e l’enfasi del greco; «agli esseri umani» è preciso e inclusivo, pur con un registro leggermente più formale del parlato comune.
