id: MAT.12.1
reference: Matthew 12:1
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Ἐν ἐκείνῳ τῷ καιρῷ ἐπορεύθη ὁ Ἰησοῦς τοῖς σάββασιν διὰ τῶν σπορίμων· οἱ δὲ μαθηταὶ αὐτοῦ ἐπείνασαν καὶ ἤρξαντο τίλλειν στάχυας καὶ ἐσθίειν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/001.yaml
  text: At that time Jesus went through the grainfields on the Sabbath[a], and his disciples became hungry and began to pluck heads of grain and eat.
translation:
  language: it
  text: In quel tempo Gesù passò di sabato[a] attraverso i campi di grano. I suoi discepoli ebbero fame e cominciarono a cogliere delle spighe e a mangiarle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'In greco, letteralmente «nei sabati»: è un plurale idiomatico che significa «di sabato».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐκείνῳ τῷ καιρῷ
  choice: In quel tempo
  rationale: Rende naturalmente il riferimento a un'occasione o periodo narrativo, senza attribuirgli una precisione cronologica assente nel greco.
- source_word: ἐπορεύθη
  choice: passò
  rationale: Nel contesto del moto attraverso i campi, «passò» è italiano naturale e comunica l'attraversamento senza enfatizzare indebitamente l'aspetto verbale.
- source_word: τοῖς σάββασιν
  choice: di sabato
  rationale: Il plurale greco è idiomatico e qui indica il giorno di sabato; «di sabato» è una formulazione moderna e naturale.
- source_word: διὰ τῶν σπορίμων
  choice: attraverso i campi di grano
  rationale: σπόριμος designa terreni seminati, in particolare campi di cereali; questa resa è chiara per il lettore comune.
- source_word: οἱ δὲ μαθηταὶ αὐτοῦ
  choice: I suoi discepoli
  rationale: δέ ha qui funzione narrativa debolmente connettiva; l'inizio di una nuova frase italiana ne rende il valore senza introdurre un contrasto marcato.
- source_word: ἐπείνασαν
  choice: ebbero fame
  rationale: Rende l'insorgere della fame suggerito dall'aoristo ed è più naturale in italiano di «divennero affamati».
- source_word: ἤρξαντο
  choice: cominciarono
  rationale: Esprime direttamente l'inizio delle azioni indicate dagli infinitivi seguenti.
- source_word: τίλλειν
  choice: a cogliere
  rationale: τίλλω indica lo staccare a mano; «cogliere» è preciso, corrente e dignitoso nel contesto delle spighe.
- source_word: στάχυας
  choice: delle spighe
  rationale: στάχυς indica una spiga di cereale; in italiano «spighe» è chiaro senza dover aggiungere «di grano» dopo la menzione dei campi.
- source_word: καὶ ἐσθίειν
  choice: e a mangiarle
  rationale: Ripetere la preposizione rende fluida la coordinazione italiana; il pronome esplicita naturalmente che mangiavano le spighe raccolte senza aggiungere un nuovo referente.
theological_decisions:
- issue: Resa del plurale σάββασιν
  choice: di sabato
  alternative: nei sabati
  rationale: Il plurale greco è una forma idiomatica per il giorno di sabato e non implica necessariamente più sabati. La resa singolare evita una falsa pluralità ed è una decisione grammaticale e contestuale, non dottrinale.
translation_notes:
  register: Italiano standard moderno, narrativo e dignitoso. La divisione in due frasi alleggerisce il periodo senza alterarne la sequenza. «Di sabato» mantiene il riferimento religioso comprensibile e idiomatico; la nota documenta il plurale formale del greco.
