id: MAT.12.32
reference: Matthew 12:32
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: καὶ ὃς ἐὰν εἴπῃ λόγον κατὰ τοῦ υἱοῦ τοῦ ἀνθρώπου, ἀφεθήσεται αὐτῷ· ὃς δ’ ἂν εἴπῃ κατὰ τοῦ πνεύματος τοῦ ἁγίου, οὐκ ἀφεθήσεται αὐτῷ οὔτε ἐν ⸂τούτῳ τῷ⸃ αἰῶνι οὔτε ἐν τῷ μέλλοντι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/032.yaml
  text: And whoever speaks a word against the Son of Man[a], it will be forgiven him; but whoever speaks against the Holy Spirit, it will not be forgiven him[c][b], neither in this age nor in the coming one.
translation:
  language: it
  text: E a chiunque dica una parola contro il Figlio dell’uomo, gli sarà perdonato; ma a chiunque parli contro lo Spirito Santo, non gli sarà perdonato, né in questa epoca né in quella futura.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alla lettera, la seconda espressione dice «né in quella che viene», con «epoca» sottinteso. Tradizionalmente αἰών è stato talvolta reso «mondo», ma qui il contrasto è temporale: questa epoca e quella futura.'
    reason: Chiarimento lessicale e dell’ellissi greca.
lexical_decisions:
- source_word: ὃς ἐὰν / ὃς δ’ ἂν
  choice: a chiunque ... ma a chiunque
  rationale: La costruzione relativa indefinita esprime una condizione generale e aperta. «A chiunque» si accorda naturalmente con il dativo αὐτῷ nelle due proposizioni sul perdono.
- source_word: εἴπῃ λόγον
  choice: dica una parola
  rationale: Mantiene sia il verbo del dire sia λόγον senza appesantire l’italiano; nel contesto indica una parola pronunciata contro qualcuno.
- source_word: κατὰ
  choice: contro
  rationale: Con il genitivo, qui introduce un parlare ostile diretto contro una persona; «contro» è preciso e idiomatico.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: il Figlio dell’uomo
  rationale: Conserva la designazione titolare e le sue risonanze bibliche senza parafrasi interpretative.
- source_word: ἀφεθήσεται αὐτῷ / οὐκ ἀφεθήσεται αὐτῷ
  choice: sarà perdonato / non sarà perdonato
  rationale: Riproduce il passivo futuro e il riferimento personale espresso dal precedente «a chiunque», mantenendo il parallelismo netto fra le due clausole.
- source_word: τοῦ πνεύματος τοῦ ἁγίου
  choice: lo Spirito Santo
  rationale: È la resa standard, moderna e dignitosa del titolo.
- source_word: οὔτε ἐν τούτῳ τῷ αἰῶνι οὔτε ἐν τῷ μέλλοντι
  choice: né in questa epoca né in quella futura
  rationale: αἰών indica qui un periodo o ordine temporale, non primariamente il mondo come realtà spaziale. «Quella futura» conserva l’ellissi greca, nella quale «epoca» è sottinteso nella seconda espressione.
theological_decisions:
- issue: Contrasto temporale tra αἰών e ὁ μέλλων
  choice: né in questa epoca né in quella futura
  alternative: né in questo mondo né nel mondo futuro; né in questa epoca né nell’epoca futura
  rationale: La formulazione conserva il contrasto escatologico fra l’epoca presente e quella futura senza trasformarlo in un contrasto spaziale né legarlo a uno schema dottrinale particolare.
- issue: Natura dell’offesa che non sarà perdonata
  choice: Lasciare intatta l’espressione «parli contro lo Spirito Santo»
  alternative: Esplicitare l’espressione come una specifica definizione dottrinale della bestemmia contro lo Spirito Santo
  rationale: Il versetto formula l’avvertimento, ma non definisce ulteriormente qui la natura o i confini dell’offesa. La traduzione non introduce precisazioni teologiche posteriori.
translation_notes:
  register: Italiano standard moderno, solenne ma accessibile. Il parallelismo delle due proposizioni è preservato; «epoca» evita l’ambiguità spaziale di «mondo», mentre «quella futura» resta naturale in italiano e rispecchia l’ellissi dell’originale.
