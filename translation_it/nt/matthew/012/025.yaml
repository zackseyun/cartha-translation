  text: εἰδὼς ⸀δὲ τὰς ἐνθυμήσεις αὐτῶν εἶπεν αὐτοῖς· Πᾶσα βασιλεία μερισθεῖσα καθ’ ἑαυτῆς ἐρημοῦται, καὶ πᾶσα πόλις ἢ οἰκία μερισθεῖσα καθ’ ἑαυτῆς οὐ σταθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/025.yaml
  text: But knowing their thoughts[a], he said to them, “Every kingdom divided against itself is laid waste[c][b], and every city or house divided against itself will not stand.”
translation:
  language: it
  text: 'Ma Gesù, conoscendo i loro pensieri[a], disse loro: «Ogni regno diviso contro se stesso va in rovina[b], e ogni città o casa[c] divisa contro se stessa non resterà in piedi».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «ragionamenti» o «intenzioni».
    reason: lexical_alternative
  - marker: b
    text: O «diventa desolato» o «viene devastato».
    reason: lexical_alternative
  - marker: c
    text: «Casa» può anche avere qui il senso di «famiglia» o «nucleo domestico».
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: conoscendo
  rationale: Il participio aoristo di ὁράω è usato in senso mentale. «Conoscendo» esprime il dato della conoscenza senza precisarne il modo e mantiene il legame participiale con «disse».
- source_word: δὲ
  choice: Ma
  rationale: δέ introduce qui una lieve transizione con valore contrastivo rispetto all'accusa precedente; «Ma» è naturale nel contesto argomentativo.
- source_word: ἐνθυμήσεις
  choice: pensieri
  rationale: Il sostantivo può indicare pensieri, ragionamenti o intenzioni interiori. «Pensieri» è chiaro e ampio, mentre una nota conserva le principali alternative.
- source_word: Πᾶσα βασιλεία
  choice: Ogni regno
  rationale: πᾶσα con il sostantivo singolare formula un principio universale; «Ogni regno» ne conserva bene la forma proverbiale.
- source_word: μερισθεῖσα καθ’ ἑαυτῆς
  choice: diviso contro sé stesso
  rationale: La formula esprime una divisione interna che pone le parti in opposizione reciproca. «Contro sé stesso» conserva la forza avversativa di κατά.
- source_word: ἐρημοῦται
  choice: va in rovina
  rationale: Il verbo indica l'essere reso desolato o ridotto in rovina. «Va in rovina» comunica in italiano corrente il risultato grave senza introdurre un agente non espresso.
- source_word: πόλις ἢ οἰκία
  choice: città o casa
  rationale: πόλις è «città»; οἰκία può indicare tanto la casa quanto la famiglia o il nucleo domestico. «Casa» mantiene l'immagine concreta e la nota segnala l'estensione semantica.
- source_word: οὐ σταθήσεται
  choice: non resterà in piedi
  rationale: Il futuro passivo di ἵστημι ha qui il senso idiomatico di rimanere saldo o sussistere. «Non resterà in piedi» è naturale e conserva la metafora.
theological_decisions:
- issue: Natura della conoscenza che Gesù ha dei pensieri altrui
  choice: Affermare semplicemente che Gesù conosceva i loro pensieri, senza spiegare come.
  alternative: Specificare che li conosceva per onniscienza soprannaturale, per discernimento profetico oppure per deduzione.
  rationale: Il testo afferma la conoscenza di Gesù ma non ne indica il meccanismo; la traduzione conserva questa indeterminatezza teologica.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. La sintassi conserva il movimento del greco, ma evita formulazioni artificiose; le ripetizioni strutturali del detto sono mantenute. I marcatori delle note sono collocati immediatamente dopo i termini pertinenti.
