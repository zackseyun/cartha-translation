  text: πᾶν δένδρον μὴ ποιοῦν καρπὸν καλὸν ἐκκόπτεται καὶ εἰς πῦρ βάλλεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/019.yaml
  text: Every tree not producing good fruit is cut down and thrown into the fire[a][b].
translation:
  language: it
  text: Ogni albero che non produce frutto buono viene abbattuto e gettato nel fuoco[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «che non porta frutto buono».'
    reason: lexical_alternative
  - marker: b
    text: Il «fuoco» è un'immagine di giudizio; il versetto non precisa se l'accento cada su un giudizio nel tempo, su quello escatologico o su entrambi.
    reason: cross_reference
lexical_decisions:
- source_word: πᾶν δένδρον
  choice: Ogni albero
  rationale: πᾶν con il sostantivo singolare ha valore distributivo; «Ogni albero» è naturale in italiano e conserva la forza proverbiale dell'enunciato.
- source_word: μὴ ποιοῦν
  choice: che non produce
  rationale: Il participio presente descrive l'azione caratteristica dell'albero. «Produce» riflette direttamente ποιέω ed è naturale con «frutto»; «porta» resta un'alternativa idiomatica.
- source_word: καρπὸν καλὸν
  choice: frutto buono
  rationale: καλός esprime qui una qualità positiva, sana o appropriata. Il singolare «frutto buono» segue il greco e mantiene il valore morale dell'immagine.
- source_word: ἐκκόπτεται
  choice: viene tagliato
  rationale: Il presente passivo indica ciò che accade a un tale albero. Nel contesto, «viene tagliato» è chiaro e naturale; l'idea dell'abbattimento è implicita senza richiedere l'aggiunta di «giù».
- source_word: εἰς πῦρ βάλλεται
  choice: gettato nel fuoco
  rationale: La forma passiva βάλλεται indica che l'albero è gettato, mentre εἰς esprime il movimento verso l'interno. «Nel fuoco» è l'espressione italiana naturale e conserva l'immagine senza precisarne oltre il referente.
theological_decisions:
- issue: Immagine del giudizio rappresentata dal fuoco
  choice: Conservare l'immagine dell'albero tagliato e gettato nel fuoco senza identificare più precisamente il fuoco.
  alternative: Esplicitare un giudizio temporale, il giudizio escatologico oppure l'inferno.
  rationale: Il versetto comunica chiaramente un giudizio mediante un'immagine agricola, ma non ne definisce da solo né il momento né l'esatto referente. La formulazione mantiene intatta l'ammonizione e la tensione teologica.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. La sintassi resta vicina al greco, ma evita calchi innaturali. I due presenti passivi sono resi con una sola costruzione coordinata («viene tagliato e gettato») per maggiore fluidità, senza mutare il significato.
