id: MAT.7.23
reference: Matthew 7:23
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: καὶ τότε ὁμολογήσω αὐτοῖς ὅτι Οὐδέποτε ἔγνων ὑμᾶς· ἀποχωρεῖτε ἀπ’ ἐμοῦ οἱ ἐργαζόμενοι τὴν ἀνομίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/023.yaml
  text: And then I will declare to them[a], ‘I never knew you; depart from me[b], you who practice lawlessness.’
translation:
  language: it
  text: 'E allora dichiarerò loro: «Non vi ho mai conosciuti[a]; allontanatevi da me, voi che praticate l’iniquità[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «riconosciuti». Il verbo greco può indicare una conoscenza o un riconoscimento di carattere relazionale, non soltanto la consapevolezza intellettuale dell’esistenza di qualcuno.
    reason: lexical_alternative
  - marker: b
    text: O «voi che agite contro la legge»; anche «voi che commettete il male». Il termine greco indica l’iniquità intesa come disprezzo o violazione della legge.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ τότε
  choice: E allora
  rationale: Conserva sia il collegamento con il contesto precedente sia la progressione temporale, in un italiano naturale.
- source_word: ὁμολογήσω
  choice: dichiarerò
  rationale: Nel contesto solenne e giudiziario indica un’affermazione aperta e formale, non la confessione di una colpa.
- source_word: Οὐδέποτε
  choice: mai
  rationale: Insieme alla negazione «non» esprime in modo netto e idiomatico l’assoluto «in nessun momento».
- source_word: ἔγνων
  choice: ho conosciuti
  rationale: Mantiene l’idioma del testo greco e la sua possibile valenza relazionale, senza ridurlo alla semplice conoscenza intellettuale né parafrasarlo come approvazione.
- source_word: ἀποχωρεῖτε
  choice: allontanatevi
  rationale: Rende l’imperativo di congedo con tono solenne ma comprensibile nell’italiano moderno.
- source_word: ἐργαζόμενοι
  choice: voi che praticate
  rationale: Esprime un’attività continuativa o caratteristica in modo più naturale di una resa letterale come «operate».
- source_word: ἀνομίαν
  choice: l’iniquità
  rationale: Conserva la forza morale e giuridica del termine, cioè l’agire contrario alla legge e all’ordine di Dio, evitando il senso prevalentemente civile che «illegalità» può avere nell’italiano corrente.
theological_decisions:
- issue: Significato di «Non vi ho mai conosciuti»
  choice: Si conserva la formulazione relazionale «Non vi ho mai conosciuti».
  alternative: «Non vi ho mai riconosciuti» oppure «Non vi ho mai approvati».
  rationale: Il greco parla direttamente di conoscenza, con una possibile sfumatura di riconoscimento relazionale. Esplicitare «approvati» o una particolare dottrina sul rapporto con Cristo risolverebbe una tensione che il versetto lascia implicita.
- issue: Forza di ἀνομία
  choice: «l’iniquità»
  alternative: «il male», «la malvagità» oppure «l’illegalità»
  rationale: La scelta mantiene la dimensione morale-legale del vocabolo senza restringerla a una specifica costruzione confessionale. La nota chiarisce il senso per il lettore moderno.
translation_notes:
  register: Italiano standard moderno, solenne ma accessibile. «Dichiarerò» e «allontanatevi» conservano il tono giudiziario; «iniquità», chiarito in nota, preserva il valore morale-legale del greco senza ricorrere all’espressione più arcaica «operatori d’iniquità».
