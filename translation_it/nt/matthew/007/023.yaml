review_pass:
  verdict: approve
  source_fidelity: Il testo rende con fedeltà la sequenza καὶ τότε («E allora»), il futuro solenne di ὁμολογήσω («dichiarerò»), la negazione assoluta Οὐδέποτε ἔγνων («Non vi ho mai conosciuti») e l’imperativo di congedo ἀποχωρεῖτε («allontanatevi da me»). «Voi che praticate l’iniquità» comunica adeguatamente il participio caratterizzante ἐργαζόμενοι e la portata morale-legale di ἀνομίαν, senza risolvere indebitamente l’espressione in categorie dottrinali.
  naturalness: L’italiano è standard moderno, scorrevole e mantiene un registro appropriato al discorso giudiziario del versetto. «Dichiarerò» e «allontanatevi» sono solenni ma non arcaici. «Praticate l’iniquità» è comprensibile nel registro biblico-letterario e la nota ne chiarisce il valore.
  terminology: «Conosciuti» conserva prudentemente l’ambiguità relazionale di ἔγνων; la nota offre «riconosciuti» senza trasformare il testo in «approvati». «Iniquità» è una resa tradizionale e ancora leggibile di ἀνομία; la nota ne esplicita correttamente il riferimento all’agire contro la legge, evitando l’eccessiva ristrettezza civile di «illegalità».
