id: MAT.7.5
reference: Matthew 7:5
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ὑποκριτά, ἔκβαλε πρῶτον ⸂ἐκ τοῦ ὀφθαλμοῦ σοῦ τὴν δοκόν⸃, καὶ τότε διαβλέψεις ἐκβαλεῖν τὸ κάρφος ἐκ τοῦ ὀφθαλμοῦ τοῦ ἀδελφοῦ σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/005.yaml
  text: Hypocrite[a], first remove the beam from your eye[b], and then you will see clearly to remove the speck from your brother’s eye.
translation:
  language: it
  text: Ipocrita, togli prima la trave[a] dal tuo occhio, e allora ci vedrai bene per togliere la pagliuzza[b] dall’occhio di tuo fratello.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La «trave» (δοκός) è un grosso elemento di legno da costruzione; l’immagine è volutamente iperbolica.
    reason: lexical_clarification
  - marker: b
    text: O «scheggia» o «filo di paglia» per «pagliuzza» (κάρφος).
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποκριτά
  choice: Ipocrita
  rationale: Il vocativo singolare è reso come rimprovero diretto, con la stessa forza convenzionale del greco.
- source_word: ἔκβαλε / ἐκβαλεῖν
  choice: togli / per togliere
  rationale: «Togliere» è naturale in italiano per l’estrazione di un corpo estraneo dall’occhio e mantiene il parallelismo tra imperativo e infinito.
- source_word: πρῶτον
  choice: prima
  rationale: Esprime direttamente la priorità nella sequenza richiesta.
- source_word: δοκόν
  choice: trave
  rationale: δοκός indica una grossa trave di legno; «trave» conserva l’iperbole e il netto contrasto con κάρφος.
- source_word: διαβλέψεις
  choice: ci vedrai bene
  rationale: Rende il valore intensivo di διαβλέπω, cioè vedere distintamente o chiaramente, in italiano moderno e idiomatico.
- source_word: κάρφος
  choice: pagliuzza
  rationale: Il termine può indicare un piccolo frammento secco, una scheggia o un filo di paglia; «pagliuzza» conserva l’immagine tradizionale e il contrasto di dimensioni.
- source_word: ἀδελφοῦ σου
  choice: tuo fratello
  rationale: Mantiene il sostantivo maschile singolare e il rapporto comunitario espresso dal greco, senza neutralizzarlo.
theological_decisions:
- issue: Termine relazionale maschile ἀδελφοῦ
  choice: tuo fratello
  alternative: un’altra persona / il tuo prossimo
  rationale: Il greco presenta un maschile singolare e «fratello» conserva sia la forma sia la dimensione relazionale della comunità, senza introdurre una generalizzazione interpretativa.
- issue: Rapporto tra chiarezza visiva e rimozione della pagliuzza
  choice: ci vedrai bene per togliere
  alternative: allora vedrai chiaramente come togliere
  rationale: L’infinito ἐκβαλεῖν può esprimere scopo o risultato; la formulazione scelta mantiene tale rapporto senza aggiungere esplicitamente «come», assente dal greco.
translation_notes:
  register: Italiano standard moderno, dignitoso e immediato. «Ci vedrai bene» è più idiomatico di «vedrai chiaramente» nel contesto concreto dell’occhio. I marcatori di nota sono collocati accanto ai termini cui si riferiscono.
