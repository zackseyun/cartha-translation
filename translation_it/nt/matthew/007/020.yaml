  text: ἄρα γε ἀπὸ τῶν καρπῶν αὐτῶν ἐπιγνώσεσθε αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/020.yaml
  text: So then[a], you will recognize them by their fruits.
translation:
  language: it
  text: Dunque[a], li riconoscerete dai loro frutti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: «Pertanto, proprio dai loro frutti li riconoscerete».'
    reason: Alternativa lessicale che rende più esplicitamente l'enfasi inferenziale di ἄρα γε e conserva una struttura più vicina all'ordine greco.
lexical_decisions:
- source_word: ἄρα γε
  choice: Dunque
  rationale: La combinazione introduce una conclusione inferenziale con una lieve enfasi. «Dunque» la esprime in italiano moderno, naturale e dignitoso.
- source_word: ἀπὸ
  choice: dai
  rationale: Con ἐπιγνώσεσθε, la preposizione indica la base sulla quale avviene il riconoscimento; «dai loro frutti» è la resa italiana più idiomatica e conserva la forma dell'immagine.
- source_word: καρπῶν
  choice: frutti
  rationale: Il plurale è esplicito nel greco e la metafora va conservata, senza ridurla interpretativamente ad «azioni» o «risultati».
- source_word: αὐτῶν
  choice: loro
  rationale: Il pronome al genitivo determina «frutti» ed è reso naturalmente con il possessivo italiano «loro».
- source_word: ἐπιγνώσεσθε
  choice: riconoscerete
  rationale: Il futuro di ἐπιγινώσκω indica qui l'identificazione delle persone sulla base di ciò che è osservabile; «riconoscerete» è più preciso del generico «conoscerete».
- source_word: αὐτούς
  choice: li
  rationale: Il pronome accusativo rinvia alle persone di cui si parla; il clitico maschile plurale «li» è naturale in italiano.
theological_decisions:
- issue: Uso metaforico dei «frutti» nella valutazione delle persone
  choice: Conservare la metafora «frutti»
  alternative: Esplicitare con «azioni» o «risultati»
  rationale: Il contesto riguarda elementi osservabili che permettono il discernimento, ma il testo mantiene l'immagine del frutto. Conservarla tutela il legame con il contesto immediato ed evita di restringerne la portata.
translation_notes:
  register: Italiano standard contemporaneo, chiaro e dignitoso. La formulazione conserva la metafora e usa una sintassi naturale; la nota documenta una possibile resa più formale ed enfatica.
