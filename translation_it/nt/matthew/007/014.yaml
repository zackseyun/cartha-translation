review_pass:
  verdict: revise
  source_fidelity: «Perché stretta è la porta» rende bene ὅτι στενὴ ἡ πύλη. Per τεθλιμμένη, però, «difficile» esplicita solo l’effetto figurato (“ardua”) e attenua l’immagine primaria di una via stretta/compressa. «Angusta» conserva meglio la metafora spaziale distinta, ma parallela, a «stretta». «Che conduce alla vita» e «pochi sono quelli che la trovano» sono fedeli alla sintassi e ai referenti greci.
  naturalness: La formulazione è scorrevole e dignitosa in italiano moderno. «Angusta» è di registro leggermente elevato ma corrente in questa immagine e più naturale di una resa letterale quale «compressa». L’ordine enfatico «stretta è la porta» è appropriato al registro del passo.
  terminology: «Porta», «via» e «vita» sono termini appropriati e non aggiungono interpretazioni teologiche. La revisione evita di definire la natura dell’angustia come mera difficoltà morale o esperienziale.
  issues:
  - severity: medium
    issue: «difficile» per τεθλιμμένη
    rationale: Il participio perfetto passivo di θλίβω descrive letteralmente una via pressata, angusta o costretta. «Difficile», pur possibile come interpretazione contestuale e seguito dall’audit inglese “hard”, perde l’immagine concreta del greco e la sua relazione con la porta stretta. «Angusta» mantiene l’ambiguità tra limitazione spaziale e conseguente arduità.
  revised_text: Perché stretta è la porta e angusta la via che conduce alla vita, e pochi sono quelli che la trovano.
  revised_footnotes: []
  revision_rationale: Si sostituisce soltanto «difficile» con «angusta» per preservare l’immagine lessicale di τεθλιμμένη senza imporre una lettura dottrinale o una specifica causa della ristrettezza. Non sono necessarie note, poiché l’italiano comunica adeguatamente la metafora.
