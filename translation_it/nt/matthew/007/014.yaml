- from: Perché stretta è la porta e difficile la via che conduce alla vita, e pochi sono quelli che la trovano.
  to: Perché stretta è la porta e angusta la via che conduce alla vita, e pochi sono quelli che la trovano.
  rationale: Si sostituisce soltanto «difficile» con «angusta» per preservare l’immagine lessicale di τεθλιμμένη senza imporre una lettura dottrinale o una specifica causa della ristrettezza. Non sono necessarie note, poiché l’italiano comunica adeguatamente la metafora.
