source:
  edition: SBLGNT
  text: ⸀ὅτι στενὴ ἡ πύλη καὶ τεθλιμμένη ἡ ὁδὸς ἡ ἀπάγουσα εἰς τὴν ζωήν, καὶ ὀλίγοι εἰσὶν οἱ εὑρίσκοντες αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/014.yaml
  text: For the gate is narrow and the way that leads to life is hard, and few are those who find it.
translation:
  language: it
  text: Perché stretta è la porta e angusta la via che conduce alla vita, e pochi sono quelli che la trovano.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στενή
  choice: stretta
  rationale: Resa diretta e naturale dell’aggettivo riferito alla porta, mantenendo l’immagine spaziale del testo greco.
- source_word: τεθλιμμένη
  choice: difficile
  rationale: Il participio perfetto passivo di θλίβω evoca una via compressa o angusta e, per estensione, ardua e segnata da difficoltà. «Difficile» comunica in italiano corrente la forza contestuale senza introdurre un’immagine artificiosa.
- source_word: ἀπάγουσα
  choice: che conduce
  rationale: Esprime in modo naturale il movimento verso la destinazione indicata dal greco.
- source_word: ζωήν
  choice: vita
  rationale: Mantiene il termine teologicamente denso e non ne restringe il significato con qualificazioni assenti nell’originale.
- source_word: εὑρίσκοντες
  choice: che la trovano
  rationale: Conserva la metafora della scoperta della via e il riferimento pronominale femminile a «via».
theological_decisions:
- issue: Natura della via verso la vita
  choice: difficile
  alternative: angusta / compressa
  rationale: La formulazione conserva l’idea di una via ardua senza precisare se la difficoltà sia persecuzione, disciplina morale o altra forma di afflizione, lasciando intatta la tensione teologica del testo.
- issue: Significato di «vita»
  choice: vita
  alternative: vita eterna
  rationale: Non si aggiunge «eterna», poiché il testo dice semplicemente ζωήν; il contesto può orientarne il senso, ma la traduzione non deve esplicitarlo oltre il greco.
translation_notes:
  register: Italiano moderno, chiaro e dignitoso. La struttura lievemente solenne «stretta è la porta» conserva il parallelismo e l’enfasi dell’originale senza risultare antiquata.
