id: MAT.7.3
reference: Matthew 7:3
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: τί δὲ βλέπεις τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ τοῦ ἀδελφοῦ σου, τὴν δὲ ἐν τῷ σῷ ὀφθαλμῷ δοκὸν οὐ κατανοεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/003.yaml
  text: But why do you see the speck in your brother’s eye[c][b][a], yet do not notice the beam in your own eye?
translation:
  language: it
  text: Ma perché guardi la pagliuzza[a] che è nell’occhio di tuo fratello[b], mentre non ti accorgi della trave[c] che è nel tuo occhio?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «scheggia», «festuca» o «frammento di paglia» per κάρφος.
    reason: lexical_alternative
  - marker: b
    text: Il greco dice «fratello» al maschile singolare.
    reason: lexical_alternative
  - marker: c
    text: O «grossa trave di legno» per δοκός.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί
  choice: perché
  rationale: 'In questa domanda retorica τί, con βλέπεις, ha valore idiomatico causale: «perché» rende naturalmente la forza dell’interrogativo.'
- source_word: δὲ
  choice: Ma
  rationale: Segnala un lieve contrasto con l’insegnamento precedente; «Ma» conserva bene il valore avversativo.
- source_word: βλέπεις
  choice: guardi
  rationale: «Guardare» mantiene l’immagine concreta e permette di distinguerlo da κατανοεῖς, reso con «ti accorgi».
- source_word: κάρφος
  choice: pagliuzza
  rationale: Indica un piccolo frammento secco, come una pagliuzza, scheggia o festuca; «pagliuzza» è naturale nell’immagine dell’occhio e crea un netto contrasto con «trave».
- source_word: ἀδελφοῦ
  choice: fratello
  rationale: Il greco usa un sostantivo maschile singolare; «fratello» ne conserva la forma senza restringere l’applicazione generale del detto.
- source_word: σῷ
  choice: tuo
  rationale: Il possessivo contrappone esplicitamente l’occhio dell’interlocutore a quello del fratello; in italiano l’enfasi emerge già dalla struttura parallela.
- source_word: δοκόν
  choice: trave
  rationale: δοκός designa una grossa trave di legno; «trave» conserva sia il senso architettonico sia l’iperbole rispetto alla pagliuzza.
- source_word: οὐ κατανοεῖς
  choice: non ti accorgi
  rationale: κατανοέω esprime il notare o considerare attentamente; «non ti accorgi» rende l’ironia e mantiene la distinzione rispetto a «guardi».
- source_word: ὀφθαλμῷ
  choice: occhio
  rationale: È l’equivalente italiano diretto e naturale nell’immagine concreta usata dal detto.
theological_decisions:
- issue: Termine di parentela maschile ἀδελφοῦ
  choice: fratello
  alternative: fratello o sorella; prossimo
  rationale: Si conserva il maschile singolare della fonte. Il detto ha applicazione generale, ma non è necessario neutralizzare o ampliare nel testo il termine greco.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. La formulazione conserva il parallelismo retorico, l’iperbole e la distinzione lessicale tra βλέπεις e κατανοεῖς.
