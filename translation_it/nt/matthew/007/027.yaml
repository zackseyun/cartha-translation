  text: καὶ κατέβη ἡ βροχὴ καὶ ἦλθον οἱ ποταμοὶ καὶ ἔπνευσαν οἱ ἄνεμοι καὶ προσέκοψαν τῇ οἰκίᾳ ἐκείνῃ, καὶ ἔπεσεν, καὶ ἦν ἡ πτῶσις αὐτῆς μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/027.yaml
  text: And the rain came down[a], and the rivers came, and the winds blew and beat against that house, and it fell—and its fall was great.
translation:
  language: it
  text: E scese la pioggia, vennero i fiumi[a], soffiarono i venti e si abbatterono contro quella casa; essa cadde, e la sua caduta fu grande.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «sopraggiunsero le acque impetuose». Il sostantivo greco significa più letteralmente «fiumi», ma nel contesto può evocare corsi d’acqua in piena.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη ἡ βροχή
  choice: scese la pioggia
  rationale: Mantiene il movimento discendente espresso da καταβαίνω in una formulazione italiana naturale e solenne.
- source_word: ἦλθον οἱ ποταμοί
  choice: vennero i fiumi
  rationale: Rende direttamente ποταμοί come «fiumi», senza sostituirlo nel testo con l'interpretazione contestuale «inondazioni».
- source_word: ἔπνευσαν οἱ ἄνεμοι
  choice: soffiarono i venti
  rationale: Corrispondenza diretta e idiomatica del verbo πνέω con il soggetto ἄνεμοι.
- source_word: προσέκοψαν τῇ οἰκίᾳ ἐκείνῃ
  choice: si abbatterono contro quella casa
  rationale: Nel contesto della tempesta esprime l'urto violento contro la casa; il plurale concorda naturalmente con «i venti», pur lasciando che l'intera scena contribuisca all'impatto.
- source_word: ἔπεσεν
  choice: essa cadde
  rationale: Conserva il verbo semplice πίπτω e chiarisce in italiano che il soggetto è la casa, senza interpretarlo più specificamente come «crollò».
- source_word: ἡ πτῶσις αὐτῆς μεγάλη
  choice: grande fu la sua rovina
  rationale: «Rovina» rende in italiano corrente l'esito distruttivo di πτῶσις riferito a una casa; l'ordine marcato conserva l'enfasi su μεγάλη.
theological_decisions:
- issue: Intensità dell'immagine conclusiva di giudizio
  choice: grande fu la sua rovina
  alternative: la sua caduta fu grande
  rationale: La resa mantiene la forza dell'immagine della distruzione senza esplicitarla come giudizio escatologico né aggiungere qualificazioni come «catastrofica».
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. La coordinazione ripetuta riproduce la cadenza incalzante del greco; il punto e virgola evita un periodo eccessivamente frammentato senza attenuarne la progressione.
