  source_fidelity: 'Il testo rende con precisione la struttura condizionale-concessiva, l''argomento a fortiori, il plurale «nei cieli» e la distinzione fra «buoni doni» (δόματα ἀγαθά) e «cose buone» (ἀγαθά). Tuttavia «gliele chiedono» introduce un oggetto pronominale («le», cioè le cose buone) che il greco non esplicita: τοῖς αἰτοῦσιν αὐτόν significa letteralmente «a quelli che chiedono lui / gli chiedono [qualcosa]».'
