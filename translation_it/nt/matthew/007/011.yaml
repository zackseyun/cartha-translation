id: MAT.7.11
reference: Matthew 7:11
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: εἰ οὖν ὑμεῖς πονηροὶ ὄντες οἴδατε δόματα ἀγαθὰ διδόναι τοῖς τέκνοις ὑμῶν, πόσῳ μᾶλλον ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς δώσει ἀγαθὰ τοῖς αἰτοῦσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/011.yaml
  text: If you[a], then, being evil, know how to give good gifts to your children[b], how much more will your Father in the heavens give good things to those who ask him.
translation:
  language: it
  text: Se dunque voi, pur essendo malvagi, sapete dare buoni doni ai vostri figli, quanto più il Padre vostro che è nei cieli[a] darà cose buone[b] a quelli che gli chiedono!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure, secondo la formulazione più tradizionale: «che è in cielo». Il greco usa il plurale: «nei cieli».'
    reason: lexical_alternative
  - marker: b
    text: Alcune traduzioni hanno «darà buoni doni», ma qui il greco dice semplicemente «darà cose buone».
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ οὖν ὑμεῖς πονηροὶ ὄντες
  choice: Se dunque voi, pur essendo malvagi
  rationale: «Se dunque» conserva la struttura argomentativa; «pur essendo malvagi» rende naturalmente il valore concessivo del participio senza attenuare né ampliare il giudizio espresso dal greco.
- source_word: οἴδατε δόματα ἀγαθὰ διδόναι
  choice: sapete dare buoni doni
  rationale: Con l’infinito, οἴδατε indica il saper fare; «buoni doni» distingue correttamente δόματα ἀγαθά dalla forma ellittica ἀγαθά della seconda proposizione.
- source_word: τοῖς τέκνοις ὑμῶν
  choice: ai vostri figli
  rationale: «Figli» è qui inclusivo e naturale in italiano, senza limitare τέκνα ai soli maschi.
- source_word: πόσῳ μᾶλλον
  choice: quanto più
  rationale: È la formulazione italiana consueta dell’argomento a fortiori espresso dal greco.
- source_word: ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς
  choice: il Padre vostro che è nei cieli
  rationale: Conserva sia la qualificazione relativa sia il plurale di οὐρανοῖς, evitando di trasformare la locuzione nel titolo aggettivale «Padre celeste».
- source_word: δώσει ἀγαθὰ
  choice: darà cose buone
  rationale: ἀγαθά è sostantivato e δόματα non viene ripetuto; «cose buone» evita di armonizzare la seconda proposizione con «doni» della prima.
- source_word: τοῖς αἰτοῦσιν αὐτόν
  choice: a quelli che gliele chiedono
  rationale: Rende in italiano corrente la classe generale indicata dal participio sostantivato; «gliele» riprende le cose buone richieste a lui, implicite nella costruzione greca.
theological_decisions:
- issue: Forza antropologica di πονηροὶ ὄντες
  choice: pur essendo malvagi
  alternative: pur essendo peccatori; pur avendo dei difetti
  rationale: Mantiene il giudizio diretto di Gesù e il contrasto con la bontà superiore del Padre, senza introdurre una formulazione dottrinale più ampia né ridurre il male a semplice imperfezione.
- issue: Resa di ὁ ἐν τοῖς οὐρανοῖς
  choice: che è nei cieli
  alternative: che è in cielo; celeste
  rationale: Conserva il plurale e la forma locativa del testo greco; la variante tradizionale al singolare è segnalata in nota.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. La sintassi conserva chiaramente il ragionamento dal minore al maggiore. I richiami delle note sono collocati accanto alle espressioni cui si riferiscono, correggendo il disallineamento presente nel livello inglese di consultazione.
