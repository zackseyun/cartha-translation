id: MAT.7.4
reference: Matthew 7:4
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ἢ πῶς ἐρεῖς τῷ ἀδελφῷ σου· Ἄφες ἐκβάλω τὸ κάρφος ⸀ἐκ τοῦ ὀφθαλμοῦ σου, καὶ ἰδοὺ ἡ δοκὸς ἐν τῷ ὀφθαλμῷ σοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/004.yaml
  text: Or how will you say to your brother[a], ‘Let me take the speck out of your eye,’ and behold[c][b], the beam is in your own eye?
translation:
  language: it
  text: 'O come dirai a tuo fratello[c]: «Lascia che tolga la pagliuzza[a] dal tuo occhio», ed ecco, la trave[b] è nel tuo occhio?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure «scheggia»: il greco κάρφος indica un piccolo frammento di materiale secco.'
    reason: lexical_alternative
  - marker: b
    text: Il greco δοκός indica una grossa trave di legno; l’immagine crea un contrasto volutamente esagerato con la pagliuzza.
    reason: lexical_alternative
  - marker: c
    text: Il greco ha «fratello» al maschile singolare; nel contesto il termine può indicare in senso rappresentativo un altro discepolo.
    reason: cultural_note
lexical_decisions:
- source_word: ἢ
  choice: O
  rationale: Introduce la seconda domanda retorica come alternativa collegata all’argomentazione precedente.
- source_word: πῶς ἐρεῖς
  choice: come dirai
  rationale: Mantiene sia il valore interrogativo di πῶς sia il futuro indicativo di ἐρεῖς, con una formulazione italiana naturale.
- source_word: τῷ ἀδελφῷ σου
  choice: a tuo fratello
  rationale: Riproduce il maschile singolare del greco e la relazione personale espressa dal possessivo.
- source_word: Ἄφες ἐκβάλω
  choice: Lascia che tolga
  rationale: L’imperativo Ἄφες introduce idiomaticamente una richiesta di permesso; «tolga» esprime in modo naturale l’estrazione dall’occhio.
- source_word: τὸ κάρφος
  choice: la pagliuzza
  rationale: Indica un piccolo frammento secco e conserva la tradizionale ed efficace contrapposizione iperbolica con la trave.
- source_word: ἐκ τοῦ ὀφθαλμοῦ σου
  choice: dal tuo occhio
  rationale: Rende naturalmente il moto di estrazione espresso da ἐκ.
- source_word: καὶ ἰδοὺ
  choice: ed ecco
  rationale: Conserva il richiamo enfatico all’attenzione senza ricorrere a un’espressione arcaica.
- source_word: ἡ δοκός
  choice: la trave
  rationale: È il termine italiano preciso per un grosso elemento ligneo strutturale e mantiene il forte contrasto con la pagliuzza.
- source_word: ἐν τῷ ὀφθαλμῷ σοῦ
  choice: è nel tuo occhio
  rationale: Riproduce direttamente la collocazione espressa dal greco; il contesto rende già evidente il contrasto con l’occhio del fratello.
theological_decisions:
- issue: Portata di ἀδελφῷ al maschile singolare
  choice: fratello
  alternative: fratello o sorella; altra persona della comunità
  rationale: Il testo presenta al maschile singolare l’interlocutore ipotetico. La traduzione conserva la forma della fonte, mentre una nota segnala il possibile valore rappresentativo senza imporlo nel testo.
- issue: Contrasto iperbolico κάρφος / δοκός
  choice: pagliuzza / trave
  alternative: scheggia / trave; bruscolo / tronco
  rationale: La coppia scelta preserva la sproporzione intenzionale dell’immagine e non attenua la denuncia dell’incoerenza.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. «Ed ecco» mantiene il rilievo discorsivo di ἰδού; «Lascia che tolga» è idiomatico senza indebolire l’immagine concreta.
