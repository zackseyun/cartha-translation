  source_fidelity: 'Il testo rende fedelmente la domanda retorica greca: «O» conserva ἤ; «come dirai» riproduce πῶς ἐρεῖς al futuro; «Lascia che tolga» esprime bene la richiesta di permesso implicita in Ἄφες ἐκβάλω. La coppia «pagliuzza / trave» mantiene il contrasto iperbolico di κάρφος e δοκός, mentre «ed ecco» conserva la funzione richiamante di καὶ ἰδού. «È nel tuo occhio» aderisce al greco senza introdurre enfasi non esplicita.'
  naturalness: L’italiano è moderno, scorrevole e di registro appropriato al discorso evangelico. La costruzione «O come dirai a tuo fratello» e il discorso diretto sono naturali; «ed ecco» è corrente in questo registro e non appare arcaico.
  terminology: «Fratello» rispecchia correttamente il maschile singolare ἀδελφῷ; «pagliuzza» e «trave» sono termini idiomatici e semanticamente ben calibrati. Le note lessicali e quella sul possibile uso rappresentativo di «fratello» sono caute, pertinenti e non impongono letture dottrinali.
