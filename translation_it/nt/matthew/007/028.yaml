source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὅτε ⸀ἐτέλεσεν ὁ Ἰησοῦς τοὺς λόγους τούτους, ἐξεπλήσσοντο οἱ ὄχλοι ἐπὶ τῇ διδαχῇ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/028.yaml
  text: And it happened that when Jesus had finished these words[b][a], the crowds were astonished at his teaching.
translation:
  language: it
  text: E avvenne che, quando Gesù ebbe terminato queste parole[a], le folle erano stupite del suo insegnamento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: «questi discorsi»; oppure: «questi detti».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: E avvenne
  rationale: Conserva la formula narrativa greca di transizione e continuità in un italiano dignitoso e comprensibile, senza ricorrere all’arcaico «e avvenne a passare» né ridurla al solo «quando».
- source_word: ὅτε
  choice: che, quando
  rationale: Dopo «avvenne», introduce la proposizione temporale mantenendo la struttura articolata del greco.
- source_word: ἐτέλεσεν
  choice: ebbe terminato
  rationale: Esprime il compimento del discorso e, nel contesto passato, rende naturalmente l’anteriorità dell’azione.
- source_word: τοὺς λόγους τούτους
  choice: queste parole
  rationale: Mantiene il plurale e il dimostrativo del greco e rimanda senza espansioni interpretative a quanto Gesù ha appena pronunciato.
- source_word: ἐξεπλήσσοντο
  choice: erano stupite
  rationale: L’imperfetto descrive la reazione collettiva in corso; «stupite» conserva la forza del verbo in un registro naturale e dignitoso.
- source_word: οἱ ὄχλοι
  choice: le folle
  rationale: Riproduce il plurale greco; «moltitudini» risulterebbe meno corrente nell’italiano moderno.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: del suo insegnamento
  rationale: Con il verbo di stupore, ἐπί con il dativo indica ciò che provoca o suscita la reazione; «stupite del» è idiomatico in italiano.
theological_decisions:
- issue: Riferimento alle parole di Gesù
  choice: «queste parole» indica l’insegnamento immediatamente precedente senza attribuirgli un’etichetta teologica.
  alternative: «questi discorsi» oppure «questo sermone»
  rationale: Il greco λόγους consente più sfumature, ma non contiene un termine equivalente a «sermone»; la resa scelta evita di aggiungere una classificazione interpretativa.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. La formula iniziale conserva deliberatamente il movimento narrativo del greco, mentre il resto della frase segue una sintassi italiana naturale.
