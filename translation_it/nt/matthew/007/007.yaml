  naturalness: «Chiedete e vi sarà dato; cercate e troverete; bussate e vi sarà aperto» è italiano moderno, conciso e idiomatico, con un registro dignitoso adeguato al discorso. L'ultima formulazione è una consolidata ellissi italiana nel contesto della porta ed evita di aggiungere esplicitamente «la porta», assente dal greco.
