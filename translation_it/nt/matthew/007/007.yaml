id: MAT.7.7
reference: Matthew 7:7
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Αἰτεῖτε, καὶ δοθήσεται ὑμῖν· ζητεῖτε, καὶ εὑρήσετε· κρούετε, καὶ ἀνοιγήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/007.yaml
  text: Ask[a], and it will be given to you; seek, and you will find; knock, and it will be opened to you.
translation:
  language: it
  text: Chiedete[a] e vi sarà dato; cercate e troverete; bussate e vi sarà aperto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Gli imperativi presenti greci possono anche avere valore continuativo: «Continuate a chiedere… a cercare… a bussare».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Αἰτεῖτε
  choice: Chiedete
  rationale: Imperativo presente attivo, seconda persona plurale. «Chiedete» è naturale in italiano e conserva la forza del comando senza rendere obbligatoriamente esplicito il possibile valore continuativo dell'aspetto presente.
- source_word: δοθήσεται ὑμῖν
  choice: vi sarà dato
  rationale: Il futuro passivo «sarà dato» conserva la diatesi del greco e lascia sottinteso chi dà; il clitico «vi» rende naturalmente il dativo ὑμῖν.
- source_word: ζητεῖτε
  choice: cercate
  rationale: Imperativo presente attivo. «Cercate» mantiene sia il senso concreto sia quello figurato ed è appropriato al registro del passo.
- source_word: εὑρήσετε
  choice: troverete
  rationale: Futuro attivo indicativo, reso direttamente con il futuro italiano.
- source_word: κρούετε
  choice: bussate
  rationale: Imperativo presente attivo. Nel contesto di una porta, «bussate» è l'equivalente italiano idiomatico di κρούετε.
- source_word: ἀνοιγήσεται ὑμῖν
  choice: vi sarà aperto
  rationale: Il futuro passivo conserva la forma greca e il soggetto sottinteso, naturalmente inteso dal contesto come ciò a cui si bussa; «vi» rende ὑμῖν.
- source_word: καὶ
  choice: e
  rationale: La congiunzione coordinante ripetuta conserva il parallelismo ritmico senza aggiungere un valore consequenziale non espresso.
theological_decisions:
- issue: Aspetto dei tre imperativi presenti
  choice: 'Imperativi semplici: «Chiedete», «cercate», «bussate»'
  alternative: «Continuate a chiedere… a cercare… a bussare»
  rationale: L'aspetto imperfettivo può suggerire un'azione continuata o ripetuta, ma non impone di esplicitarla nella traduzione principale. La formulazione semplice resta naturale e non elimina la sfumatura, che viene segnalata in nota.
- issue: Agente dei futuri passivi
  choice: 'Mantenere l''agente sottinteso: «vi sarà dato… vi sarà aperto»'
  alternative: Esplicitare Dio come agente
  rationale: Il greco usa forme passive senza nominare l'agente. Benché il contesto possa suggerire Dio, esplicitarlo risolverebbe ciò che il testo lascia implicito.
translation_notes:
  register: Italiano moderno, chiaro e dignitoso. Il parallelismo conciso dell'originale è conservato; «vi sarà aperto» mantiene intenzionalmente il passivo e l'ellissi dell'oggetto.
