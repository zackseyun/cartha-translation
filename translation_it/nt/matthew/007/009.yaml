source:
  edition: SBLGNT
  text: ἢ τίς ⸀ἐστιν ἐξ ὑμῶν ἄνθρωπος, ὃν ⸀αἰτήσει ὁ υἱὸς αὐτοῦ ἄρτον— μὴ λίθον ἐπιδώσει αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/009.yaml
  text: Or what man is there among you whose son asks him for bread[a], and he will give him a stone?
translation:
  language: it
  text: O quale uomo tra voi, se suo figlio gli chiederà del pane, gli darà una pietra?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἢ
  choice: O
  rationale: Introduce la nuova domanda retorica collegandola naturalmente al ragionamento precedente.
- source_word: τίς ἐστιν ἐξ ὑμῶν ἄνθρωπος
  choice: c’è forse tra voi un uomo
  rationale: Rende in italiano corrente l’espressione partitiva e conserva il sostantivo maschile rappresentativo ἄνθρωπος; «forse» segnala con naturalezza il carattere retorico della domanda.
- source_word: ὃν αἰτήσει ὁ υἱὸς αὐτοῦ ἄρτον
  choice: al quale suo figlio chiederà del pane
  rationale: Mantiene il futuro αἰτήσει e ristruttura il relativo accusativo ὃν secondo l’uso idiomatico italiano, senza trasformarlo esplicitamente in una proposizione condizionale.
- source_word: ἄρτον
  choice: del pane
  rationale: «Pane» è l’equivalente diretto; l’articolo partitivo è naturale dopo «chiedere» e non specifica indebitamente una pagnotta.
- source_word: μὴ λίθον ἐπιδώσει αὐτῷ
  choice: Gli darà forse una pietra?
  rationale: La domanda italiana con «forse» comunica l’attesa di una risposta negativa espressa dal greco μή; «dare» rende sobriamente ἐπιδίδωμι nel contesto.
theological_decisions:
- issue: Linguaggio maschile rappresentativo
  choice: un uomo
  alternative: una persona / qualcuno
  rationale: Il greco presenta esplicitamente ἄνθρωπος al maschile singolare in senso rappresentativo. La traduzione lo conserva senza restringere l’applicazione del detto ai soli uomini.
- issue: Forza della domanda introdotta da μή
  choice: Gli darà forse una pietra?
  alternative: non gli darà certo una pietra, vero?
  rationale: La formulazione scelta conserva la domanda retorica e la risposta negativa attesa, evitando di convertirla in un’affermazione categorica.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. La frase greca è articolata in due domande per evitare un periodo relativo pesante o ambiguo; il rapporto logico e la forza retorica restano invariati.
