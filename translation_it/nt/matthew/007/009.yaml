- from: O c’è forse tra voi un uomo[a] al quale suo figlio chiederà del pane? Gli darà forse una pietra?
  to: O quale uomo tra voi, se suo figlio gli chiederà del pane, gli darà una pietra?
  rationale: La revisione elimina sfumature aggiunte e rende la domanda come un'unica interrogativa retorica, conservando «uomo» per ἄνθρωπος, il futuro di αἰτήσει e ἐπιδώσει e il contrasto concreto fra pane e pietra. La nota è conservata, ma il marcatore va collocato dopo «uomo» nel testo impaginato.
