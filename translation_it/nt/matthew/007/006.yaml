id: MAT.7.6
reference: Matthew 7:6
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Μὴ δῶτε τὸ ἅγιον τοῖς κυσίν, μηδὲ βάλητε τοὺς μαργαρίτας ὑμῶν ἔμπροσθεν τῶν χοίρων, μήποτε ⸀καταπατήσουσιν αὐτοὺς ἐν τοῖς ποσὶν αὐτῶν καὶ στραφέντες ῥήξωσιν ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/006.yaml
  text: Do not give what is holy to dogs[a], and do not throw your pearls before pigs[d][c][b], lest they trample them under their feet and turn and tear you to pieces.
translation:
  language: it
  text: Non date ai cani ciò che è santo[a] e non gettate le vostre perle davanti ai porci, perché non le calpestino con le zampe e poi si voltino e vi facciano a pezzi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «ciò che è sacro». L’espressione greca è ampia e non specifica che cosa sia la realtà santa o consacrata.
    reason: lexical_alternative
  - marker: b
    text: O «vi sbranino».
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ἅγιον
  choice: ciò che è santo
  rationale: L’aggettivo neutro singolare sostantivato ha un referente volutamente ampio. «Ciò che è santo» è naturale in italiano e non precisa indebitamente se si tratti di un insegnamento, di una cosa consacrata o di altro.
- source_word: τοῖς κυσίν
  choice: ai cani
  rationale: Resa diretta del dativo plurale; conserva senza attenuarla la forza offensiva della metafora nel suo contesto culturale.
- source_word: βάλητε
  choice: gettate
  rationale: «Gettare» è corrente e riproduce adeguatamente l’azione espressa da βάλλω.
- source_word: τοὺς μαργαρίτας ὑμῶν
  choice: le vostre perle
  rationale: Resa lessicale standard, con mantenimento del plurale e del possessivo.
- source_word: ἔμπροσθεν τῶν χοίρων
  choice: davanti ai porci
  rationale: «Davanti a» rende naturalmente ἔμπροσθεν; «porci» conserva l’immagine animale ed è dignitoso senza risultare arcaico.
- source_word: μήποτε
  choice: perché non
  rationale: Introduce l’esito negativo temuto. La costruzione italiana con il congiuntivo comunica in modo naturale l’avvertimento senza imporre una distinzione rigida tra scopo ed eventuale risultato.
- source_word: καταπατήσουσιν αὐτοὺς
  choice: non le calpestino
  rationale: Il pronome greco riprende «perle», maschile in greco ma femminile in italiano; perciò viene reso con «le». «Calpestare» esprime il senso del verbo senza duplicare l’idea contenuta nella frase successiva.
- source_word: ἐν τοῖς ποσὶν αὐτῶν
  choice: con le zampe
  rationale: Per animali, «zampe» è più idiomatico di «piedi»; la preposizione «con» indica naturalmente il mezzo con cui avviene il calpestamento.
- source_word: στραφέντες
  choice: poi si voltino
  rationale: Il participio aoristo indica l’azione successiva dei porci. «Poi» rende esplicita la sequenza già implicita nella forma participiale senza cambiarne i protagonisti.
- source_word: ῥήξωσιν ὑμᾶς
  choice: vi facciano a pezzi
  rationale: La locuzione conserva la violenza concreta di ῥήγνυμι ed evita di indebolirlo nel più generico «vi assalgano».
theological_decisions:
- issue: Identificazione di «ciò che è santo», dei «cani», delle «perle» e dei «porci»
  choice: Conservare le metafore senza spiegarne i referenti.
  alternative: Identificare esplicitamente ciò che è santo o le perle con l’insegnamento sacro o il messaggio del regno, e cani e porci con persone malvagie o ostili.
  rationale: Il versetto non definisce con precisione i singoli elementi figurati. Mantenerli intatti preserva l’ampiezza e la tensione interpretativa del testo senza introdurre una lettura confessionale.
- issue: Rapporto sintattico tra il calpestare, il voltarsi e il fare a pezzi
  choice: Presentare le azioni come una sequenza compiuta dai porci.
  alternative: Separare maggiormente i due esiti o lasciare «voltatisi» in forma participiale.
  rationale: La forma di χοίρων e la sequenza καταπατήσουσιν… στραφέντες ῥήξωσιν indicano naturalmente i porci come soggetto delle azioni temute. La coordinazione italiana conserva la sequenza senza aggiungere un soggetto diverso.
translation_notes:
  register: Italiano moderno, chiaro e dignitoso. «Porci» mantiene il tono proverbiale e biblico senza essere antiquato; «con le zampe» è idiomatico per gli animali. La struttura parallela e la sequenza «e poi» rendono scorrevole l’avvertimento conservandone la forza.
