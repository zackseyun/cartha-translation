  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: πολλοὶ ἐροῦσίν μοι ἐν ἐκείνῃ τῇ ἡμέρᾳ· Κύριε κύριε, οὐ τῷ σῷ ὀνόματι ἐπροφητεύσαμεν, καὶ τῷ σῷ ὀνόματι δαιμόνια ἐξεβάλομεν, καὶ τῷ σῷ ὀνόματι δυνάμεις πολλὰς ἐποιήσαμεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/022.yaml
  text: Many will say to me on that day[a], ‘Lord, Lord, did we not prophesy in your name, and cast out demons in your name, and do many mighty works in your name?’
translation:
  language: it
  text: 'Molti mi diranno in quel giorno: «Signore, Signore, non abbiamo forse profetizzato nel tuo nome, scacciato demòni nel tuo nome e compiuto molti prodigi[a] nel tuo nome?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oppure «molti miracoli» o «molte opere potenti». Il greco parla letteralmente di molte «potenze», espressione usata nei Vangeli per indicare opere miracolose.
    reason: Alternativa lessicale per δυνάμεις πολλὰς, il cui senso unisce l’idea di potenza a quella di opera miracolosa.
lexical_decisions:
- source_word: πολλοὶ
  choice: Molti
  rationale: L’aggettivo maschile plurale senza articolo è usato come sostantivo. «Molti» è naturale in italiano e non aggiunge un sostantivo assente dal greco.
- source_word: ἐροῦσίν μοι
  choice: mi diranno
  rationale: Il futuro di λέγω con il pronome al dativo è reso direttamente e idiomaticamente con «mi diranno».
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: in quel giorno
  rationale: La locuzione temporale italiana conserva l’espressione biblica e la sua portata escatologica senza esplicitarla come «giorno del giudizio».
- source_word: Κύριε κύριε
  choice: Signore, Signore
  rationale: La ripetizione del vocativo esprime insistenza e appello; «Signore» conserva sia il senso ordinario del titolo sia il suo peso cristologico.
- source_word: οὐ ... ἐπροφητεύσαμεν
  choice: non abbiamo forse profetizzato
  rationale: La domanda con οὐ presuppone una risposta affermativa. «Non abbiamo forse…?» ne riproduce naturalmente la forza, mentre «profetizzato» è l’equivalente corrente di προφητεύω.
- source_word: τῷ σῷ ὀνόματι
  choice: nel tuo nome
  rationale: L’espressione indica un’azione compiuta invocando il nome o sotto la sua autorità. La triplice ripetizione è mantenuta per conservarne l’enfasi retorica.
- source_word: δαιμόνια ἐξεβάλομεν
  choice: scacciato demòni
  rationale: ἐκβάλλω con δαιμόνια indica l’espulsione di demòni; «scacciare demòni» è chiaro, naturale e tradizionalmente riconoscibile.
- source_word: δυνάμεις πολλὰς ἐποιήσαμεν
  choice: compiuto molti prodigi
  rationale: Nel linguaggio dei Vangeli δύναμις può designare una manifestazione miracolosa di potenza. «Prodigi» è italiano corrente e dignitoso; una nota conserva le alternative più aderenti alla metafora della potenza.
theological_decisions:
- issue: Resa di κύριος nell’appello rivolto a Gesù
  choice: Signore
  alternative: Maestro / Padrone
  rationale: «Signore» conserva l’ampiezza semantica del titolo e il suo possibile peso cristologico senza imporre un’interpretazione ulteriore.
- issue: Portata escatologica di «quel giorno»
  choice: in quel giorno
  alternative: nel giorno del giudizio
  rationale: Il contesto rimanda al giudizio finale, ma il greco dice soltanto «quel giorno». La formulazione non rende esplicito ciò che resta implicito.
- issue: Natura delle δυνάμεις
  choice: prodigi
  alternative: miracoli / opere potenti / opere di potenza
  rationale: Il termine può riferirsi a opere miracolose considerate manifestazioni di potenza. «Prodigi» comunica il referente senza cancellare nella nota il valore letterale di «potenze».
translation_notes:
  register: Italiano moderno standard, dignitoso e accessibile. La struttura interrogativa, la ripetizione di «Signore» e quella di «nel tuo nome» conservano l’insistenza retorica dell’originale. L’accento in «demòni» evita ambiguità di pronuncia.
