id: MAT.7.21
reference: Matthew 7:21
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Οὐ πᾶς ὁ λέγων μοι· Κύριε κύριε εἰσελεύσεται εἰς τὴν βασιλείαν τῶν οὐρανῶν, ἀλλ’ ὁ ποιῶν τὸ θέλημα τοῦ πατρός μου τοῦ ἐν ⸀τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/021.yaml
  text: Not everyone who says to me[a], ‘Lord, Lord,’ will enter into the kingdom of heaven[b], but the one who does the will of my Father who is in heaven will enter.
translation:
  language: it
  text: 'Non chiunque mi dice: «Signore, Signore», entrerà nel regno dei cieli[a], ma vi entrerà chi fa la volontà del Padre mio che è in cielo[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Matteo usa spesso l’espressione «regno dei cieli» dove altri contesti parlano del «regno di Dio».
    reason: lexical_alternative
  - marker: b
    text: In greco, letteralmente, «nei cieli»; qui reso in modo idiomatico con «in cielo».
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ πᾶς ὁ λέγων μοι
  choice: Non chiunque mi dice
  rationale: 'Οὐ con πᾶς esprime una negazione parziale: non ogni persona che si rivolge così a Gesù. La relativa italiana rende in modo naturale il participio presente λέγων e il suo valore generale.'
- source_word: Κύριε κύριε
  choice: Signore, Signore
  rationale: «Signore» è l’equivalente italiano naturale di κύριος in questo contesto; la ripetizione del vocativo, che dà enfasi all’appello, viene conservata.
- source_word: εἰσελεύσεται
  choice: entrerà
  rationale: Il futuro di εἰσέρχομαι indica l’ingresso futuro nel regno ed è reso direttamente con «entrerà».
- source_word: εἰς τὴν βασιλείαν τῶν οὐρανῶν
  choice: nel regno dei cieli
  rationale: «Regno dei cieli» è una formulazione italiana corrente e conserva il plurale caratteristico dell’espressione matteana.
- source_word: ἀλλ’ ὁ ποιῶν
  choice: ma vi entrerà chi fa
  rationale: L’articolo con il participio presente indica la persona caratterizzata dal fare. La ripresa esplicita «vi entrerà» rende chiaro e naturale in italiano il predicato sottinteso nella seconda parte, senza aggiungere un nuovo contenuto.
- source_word: τὸ θέλημα
  choice: la volontà
  rationale: «Volontà» conserva sia il senso dell’intento sia quello di ciò che il Padre richiede, senza ridurlo a un semplice desiderio.
- source_word: τοῦ πατρός μου
  choice: del Padre mio
  rationale: La resa mantiene il possessivo e il linguaggio filiale di Gesù; l’ordine «Padre mio» sostiene un registro dignitoso e naturale.
- source_word: τοῦ ἐν τοῖς οὐρανοῖς
  choice: che è in cielo
  rationale: La locuzione attributiva modifica «Padre mio». Il singolare collettivo «in cielo» è idiomatico in italiano, mentre la nota segnala il plurale formale del greco.
theological_decisions:
- issue: Ingresso nel regno in rapporto alla confessione verbale e all’ubbidienza
  choice: Il versetto contrappone il semplice rivolgersi a Gesù come «Signore» al fare concretamente la volontà del Padre.
  alternative: Leggere il versetto come una formulazione completa della salvezza per opere, oppure come se la sola confessione verbale fosse sufficiente.
  rationale: Il greco stabilisce chiaramente il contrasto tra dire e fare, ma in questo versetto non espone da solo una dottrina complessiva della giustificazione. La traduzione conserva quindi l’ammonimento e la tensione teologica senza risolverli in senso confessionale.
translation_notes:
  register: Italiano standard moderno, chiaro e dignitoso. Le virgolette caporali seguono l’uso editoriale italiano. «Non chiunque» conserva la negazione parziale e il singolare generalizzante del greco; «vi entrerà» esplicita con naturalezza il verbo sottinteso nella clausola avversativa.
