  text: καὶ κατέβη ἡ βροχὴ καὶ ἦλθον οἱ ποταμοὶ καὶ ἔπνευσαν οἱ ἄνεμοι καὶ προσέπεσαν τῇ οἰκίᾳ ἐκείνῃ, καὶ οὐκ ἔπεσεν, τεθεμελίωτο γὰρ ἐπὶ τὴν πέτραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/025.yaml
  text: And the rain came down[a], and the rivers came, and the winds blew and beat against that house, and it did not fall[b], for it had been founded on the rock.
translation:
  language: it
  text: Cadde la pioggia, vennero i fiumi[a], soffiarono i venti e si abbatterono contro quella casa[b], e non cadde, perché era stata fondata sulla roccia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oppure «giunsero le piene» o «i torrenti»; il greco ποταμοί significa più letteralmente «fiumi».
    reason: lexical_alternative
  - marker: b
    text: Oppure «piombarono su» o «investirono quella casa».
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη ἡ βροχή
  choice: cadde la pioggia
  rationale: Con la pioggia come soggetto, «cadde» è l’espressione italiana naturale e comunica il movimento verso il basso indicato da καταβαίνω.
- source_word: οἱ ποταμοί
  choice: i fiumi
  rationale: ποταμοί significa propriamente «fiumi». La resa mantiene il valore lessicale del greco, mentre la nota segnala le alternative contestuali legate alla piena.
- source_word: ἔπνευσαν οἱ ἄνεμοι
  choice: soffiarono i venti
  rationale: Resa diretta e idiomatica della proposizione greca.
- source_word: προσέπεσαν τῇ οἰκίᾳ ἐκείνῃ
  choice: si abbatterono contro quella casa
  rationale: Nel contesto della tempesta, «si abbatterono contro» esprime in italiano corrente l’urto violento indicato da προσπίπτω senza specificare più del testo la dinamica precisa.
- source_word: οὐκ ἔπεσεν
  choice: non cadde
  rationale: Resa diretta di πίπτω, che conserva il legame verbale con l’immagine della casa senza intensificarlo in «non crollò».
- source_word: τεθεμελίωτο
  choice: era stata fondata
  rationale: Il trapassato passivo greco indica uno stato risultante da un’azione precedente; la resa conserva sia il rapporto temporale sia l’immagine delle fondamenta.
- source_word: ἐπὶ τὴν πέτραν
  choice: sulla roccia
  rationale: «Roccia» rende πέτρα senza restringerne il senso a «roccia di fondo» e senza aggiungere un’identificazione teologica non esplicitata nel versetto.
theological_decisions:
- issue: Immagine parabolica del fondamento
  choice: sulla roccia
  alternative: sulla roccia di fondo
  rationale: Il versetto presenta l’immagine della roccia senza identificarla esplicitamente. La formulazione scelta conserva l’immagine e la sua apertura teologica, evitando di introdurre una spiegazione nel testo.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. La coordinazione ripetuta riproduce il ritmo cumulativo del greco; il punto e virgola prima del contrasto rende leggibile il lungo periodo senza attenuarne la forza.
