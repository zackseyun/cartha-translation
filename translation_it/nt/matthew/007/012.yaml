id: MAT.7.12
reference: Matthew 7:12
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Πάντα οὖν ὅσα ⸀ἐὰν θέλητε ἵνα ποιῶσιν ὑμῖν οἱ ἄνθρωποι, οὕτως καὶ ὑμεῖς ποιεῖτε αὐτοῖς· οὗτος γάρ ἐστιν ὁ νόμος καὶ οἱ προφῆται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/012.yaml
  text: Therefore[a], in everything, whatever you want people to do for you, do the same for them; for this is the Law and the Prophets.
translation:
  language: it
  text: Dunque, tutto ciò che volete che gli altri facciano a voi, fatelo anche voi a loro; questo infatti è la Legge e i Profeti.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πάντα … ὅσα
  choice: Tutto quanto
  rationale: La combinazione dell’accusativo neutro plurale con il relativo esprime una totalità comprensiva. «Tutto quanto» ne conserva l’ampiezza ed è naturale in italiano.
- source_word: οὖν
  choice: dunque
  rationale: Segnala una conseguenza tratta dall’insegnamento precedente; la posizione dopo «Tutto quanto» mantiene il nesso logico senza appesantire la frase.
- source_word: ὅσα ἐὰν θέλητε
  choice: quanto … volete
  rationale: La costruzione relativa con ἐὰν generalizza senza limitare i casi contemplati. «Quanto … volete» rende in modo corrente tale valore indefinito.
- source_word: οἱ ἄνθρωποι
  choice: gli altri
  rationale: Nel contesto ἄνθρωποι indica genericamente le persone con cui i discepoli entrano in relazione, non soltanto gli uomini di sesso maschile. «Gli altri» esprime con naturalezza italiana questa reciprocità universale.
- source_word: ἵνα ποιῶσιν ὑμῖν
  choice: che … facciano per voi
  rationale: Dopo θέλητε, ἵνα con il congiuntivo esprime l’azione desiderata. «Per voi» rende idiomaticamente il dativo ὑμῖν nel contesto, senza specificare il contenuto dell’azione.
- source_word: οὕτως καὶ ὑμεῖς ποιεῖτε αὐτοῖς
  choice: fatelo anche voi per loro
  rationale: L’imperativo presente esorta a una condotta abituale. Il pronome «lo» riprende l’intero «tutto quanto», mentre «anche voi» conserva l’enfasi esplicita di καὶ ὑμεῖς.
- source_word: οὗτος γάρ ἐστιν
  choice: questa infatti è
  rationale: Mantiene la concisa proposizione equativa e il valore esplicativo di γάρ. Il femminile «questa» sottintende naturalmente la condotta appena formulata.
- source_word: ὁ νόμος καὶ οἱ προφῆται
  choice: la Legge e i Profeti
  rationale: Conserva la formula giudaica e matteana che designa le grandi sezioni delle Scritture, senza ridurla a una parafrasi etica.
theological_decisions:
- issue: Valore generico di οἱ ἄνθρωποι
  choice: gli altri
  alternative: gli uomini; le persone
  rationale: Il principio riguarda universalmente i rapporti umani e non contiene una restrizione al sesso maschile. «Gli altri» evita tale possibile equivoco e rende esplicita la relazione reciproca implicita nel contesto.
- issue: Portata di «la Legge e i Profeti»
  choice: Conservazione della formula scritturale
  alternative: l’intero insegnamento etico delle Scritture; il senso della Legge e dei Profeti
  rationale: Il greco usa una formula tradizionale che in Matteo richiama le Scritture d’Israele. Mantenerla preserva la risonanza intertestuale senza precisare indebitamente in che senso la regola ne sia il compendio.
- issue: Forza di οὗτος … ἐστιν
  choice: questa infatti è
  alternative: in questo consistono; questo riassume
  rationale: La formulazione equativa conserva la forza e la tensione dell’affermazione greca, senza attenuarla né interpretarla come un semplice riassunto.
translation_notes:
  register: Italiano moderno, chiaro e dignitoso. La struttura resta vicina al greco, ma usa «gli altri» e «per voi/per loro» per una formulazione naturale e universalmente comprensibile. Le maiuscole in «Legge» e «Profeti» segnalano la formula convenzionale riferita alle Scritture.
