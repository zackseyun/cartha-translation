revisions:
- from: Tutto quanto, dunque, volete che gli altri facciano per voi, fatelo anche voi per loro; questa infatti è la Legge e i Profeti.
  to: Dunque, tutto ciò che volete che gli altri facciano a voi, fatelo anche voi a loro; questo infatti è la Legge e i Profeti.
  rationale: 'La revisione migliora la fluidità dell''italiano e rende più chiaramente il dimostrativo riferito all''intero enunciato, senza modificare il significato, la portata universale dell''esortazione o la formula «la Legge e i Profeti». Non è necessaria una nota: «gli altri» non crea in italiano l''ambiguità di genere che motivava la nota inglese.'
