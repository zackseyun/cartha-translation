review_pass:
  verdict: revise
  source_fidelity: La resa conserva correttamente la portata universale di Πάντα … ὅσα, il nesso inferenziale di οὖν, l'esortazione imperativa di ποιεῖτε e la formula scritturale «la Legge e i Profeti». Tuttavia, «questa» non è la ripresa più fedele e chiara di οὗτος, che rinvia all'intero principio appena enunciato; «questo» è preferibile. Inoltre, «Tutto quanto, dunque» è meno lineare dell'ordine italiano «Dunque, tutto ciò che».
  naturalness: «Dunque, tutto ciò che volete che gli altri facciano a voi» è italiano moderno e scorrevole. «Fatelo anche voi a loro» riproduce la formulazione italiana consolidata della reciprocità senza restringere il senso a un'azione meramente benefica.
  terminology: «Gli altri» rende naturalmente il valore umano generico di οἱ ἄνθρωποι nel contesto. «La Legge e i Profeti» va mantenuto con le maiuscole, poiché conserva la formula convenzionale senza trasformarla in una parafrasi interpretativa.
  issues:
  - severity: low
    issue: Ripresa dimostrativa «questa»
    rationale: Il greco οὗτος è maschile e si riferisce al principio enunciato nel suo complesso. In italiano «questo» è la ripresa più naturale e non introduce il sottinteso femminile di «regola» o «condotta».
  - severity: low
    issue: Ordine iniziale poco fluido
    rationale: «Tutto quanto, dunque, volete» è comprensibile, ma la collocazione di «dunque» interrompe la relativa in modo meno naturale. «Dunque, tutto ciò che volete» conserva ugualmente il nesso logico.
  revised_text: Dunque, tutto ciò che volete che gli altri facciano a voi, fatelo anche voi a loro; questo infatti è la Legge e i Profeti.
