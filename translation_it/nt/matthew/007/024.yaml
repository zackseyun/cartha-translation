  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Πᾶς οὖν ὅστις ἀκούει μου τοὺς λόγους τούτους καὶ ποιεῖ αὐτούς, ⸀ὁμοιωθήσεται ἀνδρὶ φρονίμῳ, ὅστις ᾠκοδόμησεν ⸂αὐτοῦ τὴν οἰκίαν⸃ ἐπὶ τὴν πέτραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/024.yaml
  text: Therefore everyone who hears these words of mine and does them will be like a wise man who built his house on the rock[a][b].
translation:
  language: it
  text: Perciò, chiunque ascolta queste mie parole e le mette in pratica sarà simile[a] a un uomo saggio[b] che ha costruito la sua casa sulla roccia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «sarà paragonato» o «sarà reso simile».
    reason: lexical_alternative
  - marker: b
    text: Il greco dice «un uomo saggio»; la figura del paragone è grammaticalmente maschile nel testo originale.
    reason: cultural_note
lexical_decisions:
- source_word: Πᾶς οὖν ὅστις
  choice: Perciò, chiunque
  rationale: Πᾶς con ὅστις esprime un riferimento distributivo e generale; «chiunque» lo rende naturalmente in italiano. «Perciò» conserva il valore inferenziale di οὖν e il legame con l'insegnamento precedente.
- source_word: ἀκούει μου τοὺς λόγους τούτους
  choice: ascolta queste mie parole
  rationale: «Ascolta» esprime qui non soltanto la percezione uditiva, ma l'ascolto dell'insegnamento; «queste mie parole» conserva sia λόγους sia il genitivo μου.
- source_word: καὶ ποιεῖ αὐτούς
  choice: e le mette in pratica
  rationale: Il riferimento è all'agire in conformità alle parole ascoltate. La resa idiomatica «le mette in pratica» comunica chiaramente il senso di ποιεῖ senza l'innaturale «le fa».
- source_word: ὁμοιωθήσεται
  choice: sarà simile
  rationale: Il futuro passivo introduce un paragone. «Sarà simile» è naturale e mantiene il valore comparativo, mentre la nota segnala la resa più formale del passivo.
- source_word: ἀνδρὶ φρονίμῳ
  choice: a un uomo saggio
  rationale: ἀνήρ indica qui un uomo di sesso maschile all'interno dell'immagine; φρόνιμος descrive saggezza pratica e assennatezza. «Uomo saggio» è chiaro, tradizionale e fedele.
- source_word: ᾠκοδόμησεν αὐτοῦ τὴν οἰκίαν
  choice: che ha costruito la sua casa
  rationale: «Ha costruito» rende naturalmente l'aoristo nella relativa italiana; «la sua casa» conserva il possessivo e la concreta metafora edilizia.
- source_word: ἐπὶ τὴν πέτραν
  choice: sulla roccia
  rationale: La resa diretta conserva l'immagine di una base rocciosa solida senza specificare oltre ciò che dice il testo.
theological_decisions:
- issue: Linguaggio maschile nella figura rappresentativa
  choice: un uomo saggio
  alternative: una persona saggia
  rationale: Il testo greco usa ἀνήρ, che designa specificamente un uomo, mentre l'applicazione universale è già espressa da «chiunque». La formulazione non neutralizza il sesso del personaggio della parabola.
- issue: Rapporto tra ascolto e obbedienza
  choice: ascolta queste mie parole e le mette in pratica
  alternative: ode queste mie parole e le fa
  rationale: La traduzione mantiene distinti e coordinati l'ascolto e l'agire, senza trasformare il versetto in un'affermazione teologica più ampia o risolverne la tensione.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. «Perciò» conserva il nesso logico; «mette in pratica» evita un calco poco naturale; «sulla roccia» mantiene intatta la concretezza dell'immagine.
