id: MAT.7.17
reference: Matthew 7:17
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: οὕτως πᾶν δένδρον ἀγαθὸν καρποὺς καλοὺς ποιεῖ, τὸ δὲ σαπρὸν δένδρον καρποὺς πονηροὺς ποιεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/017.yaml
  text: So[a], every good tree produces good fruit[c][b], but the rotten tree produces bad fruit.
translation:
  language: it
  text: Così, ogni albero buono produce frutti buoni, ma l’albero marcio produce frutti cattivi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: Così
  rationale: Introduce naturalmente la conclusione o il confronto con l’immagine precedente, conservando la forza inferenziale del greco.
- source_word: πᾶν δένδρον
  choice: ogni albero
  rationale: πᾶν con il sostantivo singolare ha valore distributivo e proverbiale.
- source_word: ἀγαθὸν
  choice: buono
  rationale: Mantiene il senso ampio di qualità positiva dell’albero e il parallelismo semplice con i frutti buoni.
- source_word: καρποὺς καλοὺς
  choice: frutti buoni
  rationale: Nel contesto della valutazione dei risultati, καλός è reso in modo naturale con «buoni»; il plurale riproduce il greco.
- source_word: ποιεῖ
  choice: produce
  rationale: Con alberi e frutti, «produce» è idiomatico in italiano e conserva chiaramente la forza verbale di ποιέω.
- source_word: τὸ δὲ
  choice: ma l’albero
  rationale: δέ segnala qui il netto contrasto fra i due tipi di albero.
- source_word: σαπρὸν
  choice: marcio
  rationale: σαπρός indica ciò che è guasto, deteriorato o privo di valore; «marcio» è concreto e vivido nell’immagine dell’albero.
- source_word: καρποὺς πονηροὺς
  choice: frutti cattivi
  rationale: «Cattivi» è naturale nella metafora agricola e lascia al contesto la più ampia implicazione morale di πονηρός senza esplicitarla eccessivamente.
theological_decisions:
- issue: Forza morale o meramente agricola dell’immagine
  choice: Conservare la concreta metafora dell’albero e dei frutti senza esplicitarne l’applicazione morale.
  alternative: Rendere in modo più interpretativo, per esempio «un albero sano dà frutti salutari» o «un albero corrotto produce frutti malvagi».
  rationale: Il contesto riguarda i falsi profeti, ma il versetto presenta l’immagine anziché spiegarla. La formulazione conserva la tensione e lascia emergere dal contesto la portata morale.
translation_notes:
  register: Italiano standard moderno, naturale e dignitoso. La ripetizione di «buono/buoni» e «produce» rispecchia la struttura proverbiale e parallela del greco; «marcio» mantiene la concretezza di σαπρός.
