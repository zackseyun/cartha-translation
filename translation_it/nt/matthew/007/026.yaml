id: MAT.7.26
reference: Matthew 7:26
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: καὶ πᾶς ὁ ἀκούων μου τοὺς λόγους τούτους καὶ μὴ ποιῶν αὐτοὺς ὁμοιωθήσεται ἀνδρὶ μωρῷ, ὅστις ᾠκοδόμησεν ⸂αὐτοῦ τὴν οἰκίαν⸃ ἐπὶ τὴν ἄμμον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/026.yaml
  text: And everyone who hears these words of mine and does not do them will be like a foolish man[a], who built his house on the sand.
translation:
  language: it
  text: E chiunque ascolta queste mie parole e non le mette in pratica sarà simile a un uomo stolto[a], che costruì la sua casa sulla sabbia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oppure «una persona stolta». Il greco dice «un uomo stolto», usando nella comparazione un'espressione maschile con valore rappresentativo.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ ἀκούων
  choice: chiunque ascolta
  rationale: Il participio presente sostantivato ha valore generico; «chiunque ascolta» è naturale in italiano e conserva l'estensione universale.
- source_word: μου τοὺς λόγους τούτους
  choice: queste mie parole
  rationale: Conserva sia l'enfasi del dimostrativo sia la relazione possessiva, in una formulazione italiana dignitosa e corrente.
- source_word: μὴ ποιῶν αὐτούς
  choice: non le mette in pratica
  rationale: Nel contesto ποιέω indica l'attuazione di ciò che si ascolta. La resa idiomatica evita l'innaturale «non le fa» e mantiene il contrasto tra ascoltare e agire.
- source_word: ὁμοιωθήσεται
  choice: sarà simile
  rationale: Rende in modo naturale il futuro passivo della comparazione senza introdurre un soggetto agente non espresso.
- source_word: ἀνδρὶ μωρῷ
  choice: a un uomo stolto
  rationale: ἀνήρ designa specificamente un uomo, qui con funzione rappresentativa; «stolto» rende μωρός con il registro morale e sapienziale appropriato.
- source_word: ὅστις
  choice: che
  rationale: Introduce naturalmente in italiano la relativa esplicativa riferita all'uomo della comparazione.
- source_word: ᾠκοδόμησεν
  choice: costruì
  rationale: Rende direttamente l'aoristo del verbo «costruire» e mantiene il semplice quadro narrativo.
- source_word: αὐτοῦ τὴν οἰκίαν
  choice: la sua casa
  rationale: «Casa» conserva l'immagine concreta dell'edificio; il possessivo è collocato secondo l'ordine italiano naturale.
- source_word: ἐπὶ τὴν ἄμμον
  choice: sulla sabbia
  rationale: Esprime chiaramente la base o il terreno su cui viene costruita la casa.
theological_decisions:
- issue: Linguaggio maschile rappresentativo nella comparazione
  choice: un uomo stolto
  alternative: una persona stolta
  rationale: Il greco presenta ἀνήρ, sostantivo maschile riferito a un uomo, pur usando la figura in senso rappresentativo e applicabile a chiunque. Il testo mantiene il dato lessicale senza restringere la portata universale già espressa da «chiunque».
translation_notes:
  register: Italiano moderno standard, chiaro e dignitoso. «Mette in pratica» privilegia la naturalezza senza attenuare l'esigenza concreta di attuare le parole ascoltate; «uomo stolto» conserva il lessico maschile del testo greco, chiarito dalla nota.
