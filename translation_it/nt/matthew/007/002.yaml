  rationale: La sola revisione necessaria sostituisce l'innaturale «sarà misurato a voi» con «vi sarà misurato». La forma riveduta mantiene il futuro passivo greco, il dativo «a voi» espresso dal pronome clitico «vi» e l'ambiguità sull'agente dell'azione. La nota rimane correttamente ancorata alla seconda clausola e segnala senza incorporarla la sfumatura reciproca.
