id: MAT.7.2
reference: Matthew 7:2
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ἐν ᾧ γὰρ κρίματι κρίνετε κριθήσεσθε, καὶ ἐν ᾧ μέτρῳ μετρεῖτε μετρηθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/002.yaml
  text: For with the judgment by which you judge[a], you will be judged, and with the measure by which you measure, it will be measured to you.
translation:
  language: it
  text: Infatti, con il giudizio con cui giudicate sarete giudicati, e con la misura con cui misurate vi sarà misurato.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «vi sarà misurato in cambio». Il greco non esprime esplicitamente «in cambio», benché il senso reciproco sia implicito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίματι
  choice: giudizio
  rationale: «Giudizio» esprime la valutazione giudiziale e conserva il legame lessicale con «giudicate» e «sarete giudicati».
- source_word: κρίνετε
  choice: giudicate
  rationale: Il verbo greco ha un significato più ampio di «condannare»; «giudicate» mantiene tale ampiezza e la ripetizione della stessa radice.
- source_word: κριθήσεσθε
  choice: sarete giudicati
  rationale: Il futuro passivo rispecchia il precedente verbo attivo senza restringere il senso a una condanna né specificare chi giudicherà.
- source_word: μέτρῳ
  choice: misura
  rationale: Il sostantivo indica metaforicamente il criterio applicato agli altri e permette di conservare il gioco di parole con il verbo «misurare».
- source_word: μετρεῖτε
  choice: misurate
  rationale: La resa diretta conserva il parallelismo proverbiale tra il sostantivo e il verbo greci.
- source_word: μετρηθήσεται ὑμῖν
  choice: sarà misurato a voi
  rationale: La formulazione mantiene il passivo e rende esplicitamente il dativo ὑμῖν, senza aggiungere l'idea di «in cambio», implicita nella reciprocità ma non espressa nel testo greco.
- source_word: ἐν ᾧ ... ἐν ᾧ
  choice: con ... con cui
  rationale: La costruzione esprime mezzo o criterio; la resa italiana conserva il parallelismo delle due proposizioni.
- source_word: γὰρ
  choice: Infatti
  rationale: «Infatti» collega naturalmente il versetto alla proibizione precedente e ne introduce la motivazione.
theological_decisions:
- issue: Natura e agente del giudizio reciproco
  choice: Il testo afferma un principio di giudizio corrispondente lasciando non espresso chi giudicherà.
  alternative: Specificare che sarà Dio a giudicare, oppure che saranno gli altri a farlo.
  rationale: I passivi greci non indicano esplicitamente l'agente; la traduzione conserva questa apertura interpretativa e la relativa tensione teologica.
translation_notes:
  register: Italiano moderno, dignitoso e vicino alla struttura proverbiale dell'originale. La ripetizione «giudizio/giudicate/giudicati» e «misura/misurate/misurato» è intenzionale e riproduce i richiami lessicali greci.
