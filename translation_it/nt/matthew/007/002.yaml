  naturalness: «Sarà misurato a voi» è una costruzione passiva poco naturale nell'italiano moderno. «Vi sarà misurato» rende in modo idiomatico il dativo ὑμῖν e conserva sia il passivo sia l'impersonalità dell'agente.
