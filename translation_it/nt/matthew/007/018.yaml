id: MAT.7.18
reference: Matthew 7:18
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: οὐ δύναται δένδρον ἀγαθὸν καρποὺς πονηροὺς ⸀ποιεῖν, οὐδὲ δένδρον σαπρὸν καρποὺς καλοὺς ποιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/018.yaml
  text: A good tree cannot produce bad fruit[c][b][a], nor can a rotten tree produce good fruit.
translation:
  language: it
  text: Un albero buono[a] non può produrre frutti cattivi[b], né un albero marcio[c] può produrre frutti buoni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «un albero sano».'
    reason: lexical_alternative
  - marker: b
    text: 'Oppure: «frutti malvagi».'
    reason: lexical_alternative
  - marker: c
    text: 'Oppure: «un albero deteriorato».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δένδρον ἀγαθόν
  choice: un albero buono
  rationale: «Buono» conserva sia l’immagine concreta sia il valore positivo di ἀγαθός, senza restringerne il senso alla sola salute dell’albero.
- source_word: οὐ δύναται ... ποιεῖν
  choice: non può produrre
  rationale: δύναται esprime capacità o possibilità; con καρπούς, ποιεῖν si rende naturalmente in italiano con «produrre». La formulazione mantiene l’impossibilità categorica del greco.
- source_word: καρποὺς πονηρούς
  choice: frutti cattivi
  rationale: πονηρός può indicare ciò che è cattivo, malvagio o nocivo. «Cattivi» è naturale nell’immagine dei frutti e mantiene abbastanza ampio il valore morale e qualitativo.
- source_word: οὐδέ
  choice: né
  rationale: «Né» riproduce con naturalezza la seconda negazione coordinata e conserva il parallelismo delle due proposizioni.
- source_word: δένδρον σαπρόν
  choice: un albero marcio
  rationale: σαπρός indica ciò che è marcio, deteriorato o corrotto. «Marcio» è concreto e vivido e si adatta direttamente all’immagine dell’albero.
- source_word: καρποὺς καλούς
  choice: frutti buoni
  rationale: καλός riferito ai frutti indica buona qualità. «Buoni» rende chiaramente il contrasto con «cattivi», pur senza riprodurre con lo stesso aggettivo la distinzione greca tra ἀγαθός e καλός.
theological_decisions:
- issue: Natura dell’impossibilità espressa dalla metafora
  choice: 'Rendere l’affermazione come impossibilità categorica: «non può».'
  alternative: «Di solito non produce» oppure «non dovrebbe produrre».
  rationale: Il greco οὐ δύναται esprime incapacità, non semplice improbabilità o dovere morale. La traduzione conserva la forza dell’affermazione senza dedurne ulteriori conclusioni dottrinali.
translation_notes:
  register: Italiano standard moderno, semplice e dignitoso. La struttura parallela del greco è mantenuta; «produrre frutti» è idiomatico in italiano. Le note preservano le principali alternative lessicali senza appesantire il testo.
