  text: ⸀ἢ καὶ ⸂ἰχθὺν αἰτήσει⸃— μὴ ὄφιν ἐπιδώσει αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/010.yaml
  text: Or if he asks for a fish—he will not give him a snake[b][a], will he?
translation:
  language: it
  text: Oppure, se gli chiede un pesce, gli darà forse un serpente?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «una serpe».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ καὶ
  choice: Oppure, se
  rationale: Introduce il secondo esempio della coppia retorica. «Oppure, se» rende in modo naturale la continuazione disgiuntiva senza tradurre καί in maniera ridondante.
- source_word: ἰχθὺν
  choice: un pesce
  rationale: È l'oggetto diretto all'accusativo singolare; il significato ordinario si adatta al contesto del cibo domestico.
- source_word: αἰτήσει
  choice: chiede
  rationale: Il futuro indicativo greco compare in un esempio di valore condizionale e generale; il presente italiano è qui idiomatico e conserva il senso.
- source_word: μὴ
  choice: forse
  rationale: Nella domanda diretta μή fa prevedere una risposta negativa. La formulazione italiana «gli darà forse...?», nel contesto, comunica con naturalezza tale aspettativa.
- source_word: ὄφιν
  choice: un serpente
  rationale: «Serpente» è il normale equivalente italiano di ὄφις in questo contesto ed è dignitoso senza risultare oscuro; «serpe» è possibile ma meno comune nell'uso corrente.
- source_word: ἐπιδώσει
  choice: darà
  rationale: Nel contesto il verbo significa dare o porgere; «darà» è l'equivalente più chiaro e naturale.
- source_word: αὐτῷ
  choice: gli
  rationale: Il pronome dativo indica il destinatario ed è reso idiomaticamente con il pronome indiretto italiano «gli».
theological_decisions:
- issue: Forza della domanda retorica
  choice: «gli darà forse un serpente?»
  alternative: «non gli darà un serpente, vero?» oppure «certamente non gli darà un serpente»
  rationale: La particella μή segnala una domanda che prevede risposta negativa. «Forse» mantiene la forma interrogativa e la forza retorica senza trasformarla in una semplice affermazione.
translation_notes:
  register: Italiano standard moderno, naturale e dignitoso. La virgola dopo «Oppure» e la domanda con «forse» rendono scorrevole il secondo esempio retorico; non si riproduce meccanicamente il trattino editoriale greco, poiché la sintassi italiana non lo richiede.
