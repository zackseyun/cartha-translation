review_pass:
  verdict: revise
  source_fidelity: Il testo rende bene l'imperativo durativo di avvertimento, «falsi profeti», il contrasto fra apparenza e realtà e l'immagine dei «lupi rapaci». Tuttavia, «vengono da voi» in italiano indica normalmente provenienza («from you»), mentre πρὸς ὑμᾶς significa che essi si avvicinano ai destinatari («a voi»).
  naturalness: «Guardatevi da» è moderno, naturale e adeguato al registro. «Vengono a voi» elimina l'ambiguità direzionale. «In vesti di pecora» è più idiomatico e semanticamente trasparente di «in vesti da pecore», che può suggerire abiti destinati alle pecore.
  terminology: «Falsi profeti» è la resa standard di ψευδοπροφῆται; «lupi rapaci» comunica appropriatamente il valore predatorio di ἅρπαγες senza introdurre interpretazioni confessionali.
  issues:
  - severity: medium
    issue: «Vengono da voi» traduce una provenienza, non un moto verso i destinatari.
    rationale: La locuzione greca πρὸς ὑμᾶς significa «a voi/verso di voi». In italiano «da voi» equivale normalmente a «from you».
  - severity: low
    issue: «Vesti da pecore» è meno preciso e meno naturale.
    rationale: «Da pecore» può essere inteso come «destinate alle pecore»; «di pecora» conserva meglio il genitivo προβάτων nell'immagine metaforica.
  revised_text: Guardatevi dai falsi profeti, i quali vengono a voi in vesti di pecora, ma dentro sono lupi rapaci.
