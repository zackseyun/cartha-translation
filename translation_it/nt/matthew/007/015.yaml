source:
  edition: SBLGNT
  text: ⸀Προσέχετε ἀπὸ τῶν ψευδοπροφητῶν, οἵτινες ἔρχονται πρὸς ὑμᾶς ἐν ἐνδύμασι προβάτων ἔσωθεν δέ εἰσιν λύκοι ἅρπαγες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/015.yaml
  text: Beware of false prophets[a], who come to you in sheep’s clothing[c][b], but inwardly are ravenous wolves.
translation:
  language: it
  text: Guardatevi dai falsi profeti, i quali vengono a voi in vesti di pecora, ma dentro sono lupi rapaci.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Προσέχετε ἀπὸ
  choice: Guardatevi da
  rationale: L’imperativo presente plurale esprime una vigilanza continua; la costruzione italiana «guardarsi da» rende naturalmente sia la forza dell’avvertimento sia ἀπό.
- source_word: ψευδοπροφητῶν
  choice: falsi profeti
  rationale: È la resa italiana standard e precisa per chi pretende falsamente autorità profetica o profetizza il falso.
- source_word: οἵτινες ἔρχονται πρὸς ὑμᾶς
  choice: i quali vengono da voi
  rationale: Conserva il valore descrittivo della relativa e rende πρὸς ὑμᾶς in modo naturale, indicando che si presentano ai destinatari.
- source_word: ἐν ἐνδύμασι προβάτων
  choice: in vesti da pecore
  rationale: Mantiene viva l’immagine concreta degli abiti che fanno apparire questi individui simili a pecore, senza appiattirla in una spiegazione.
- source_word: ἔσωθεν δέ
  choice: ma dentro
  rationale: Esprime con chiarezza il contrasto tra apparenza esteriore e realtà interiore; «dentro» è corrente e incisivo.
- source_word: λύκοι ἅρπαγες
  choice: lupi rapaci
  rationale: «Rapaci» conserva il senso di predatori pronti ad afferrare e depredare, oltre alla forza della metafora.
theological_decisions:
- issue: Natura dell’avvertimento contro guide religiose ingannevoli
  choice: Rendere direttamente l’immagine come avvertimento morale e spirituale contro i falsi profeti.
  alternative: Specificare che si tratta di eretici o di una particolare categoria ecclesiastica posteriore.
  rationale: Il greco denuncia il contrasto tra apparenza innocua e realtà predatoria, ma non introduce categorie confessionali o istituzionali successive.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. «Guardatevi» conserva il tono ammonitore; «vesti da pecore» e «lupi rapaci» mantengono la vividezza e il parallelismo dell’immagine.
