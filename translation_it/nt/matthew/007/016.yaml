id: MAT.7.16
reference: Matthew 7:16
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ἀπὸ τῶν καρπῶν αὐτῶν ἐπιγνώσεσθε αὐτούς. μήτι συλλέγουσιν ἀπὸ ἀκανθῶν ⸀σταφυλὰς ἢ ἀπὸ τριβόλων σῦκα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/016.yaml
  text: You will recognize them by their fruits[a]. Do people gather grapes from thorns[b], or figs from thistles?
translation:
  language: it
  text: Li riconoscerete dai loro frutti[a]. Si raccoglie forse uva dai rovi, o fichi dai cardi[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «Li conoscerete dai loro frutti».
    reason: lexical_alternative
  - marker: b
    text: 'La domanda presuppone una risposta negativa: non si raccoglie uva dai rovi né fichi dai cardi.'
    reason: rhetorical_clarification
lexical_decisions:
- source_word: καρπῶν
  choice: frutti
  rationale: Mantiene il plurale greco e la concreta metafora agricola, senza ridurla interpretativamente ad «azioni» o «risultati».
- source_word: ἐπιγνώσεσθε
  choice: riconoscerete
  rationale: Nel contesto indica che si giungerà a discernere queste persone osservandone i frutti; «riconoscerete» è naturale e non sovraccarica il verbo con l'idea di una conoscenza completa.
- source_word: μήτι
  choice: forse
  rationale: Inserito nella domanda retorica, «forse» segnala con naturalezza che ci si attende una risposta negativa.
- source_word: συλλέγουσιν
  choice: si raccoglie
  rationale: La costruzione impersonale italiana esprime in modo idiomatico l'azione generale indicata dal plurale greco.
- source_word: ἀκανθῶν
  choice: rovi
  rationale: Rende il riferimento a piante spinose con un termine concreto e corrente, adatto al contrasto agricolo.
- source_word: σταφυλάς
  choice: uva
  rationale: In italiano «uva» è il normale nome collettivo del frutto e rende naturalmente il plurale greco in questo contesto.
- source_word: τριβόλων
  choice: cardi
  rationale: Designa piante infestanti spinose; «cardi» è chiaro in italiano moderno e conserva la distinzione dai «rovi» del primo membro.
- source_word: σῦκα
  choice: fichi
  rationale: Equivalente diretto del plurale greco, parallelo a «uva» nell'immagine agricola.
- source_word: αὐτῶν / αὐτούς
  choice: loro / li
  rationale: I pronomi rimandano alle persone menzionate nel contesto; la resa italiana conserva sia il riferimento personale sia il rapporto tra loro e i loro frutti.
theological_decisions:
- issue: Valore metaforico dei «frutti» nel discernimento delle persone
  choice: Conservare la metafora «frutti».
  alternative: Esplicitare con «azioni», «condotta» o «risultati».
  rationale: La formulazione agricola è parte essenziale del detto e lascia aperta la portata dei «frutti», senza restringerla a una sola applicazione interpretativa.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. La prima frase conserva l'ordine naturale dell'italiano; la domanda impersonale mantiene il carattere proverbiale e retorico dell'originale.
