  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Εἰσέλθατε διὰ τῆς στενῆς πύλης· ὅτι πλατεῖα ⸂ἡ πύλη⸃ καὶ εὐρύχωρος ἡ ὁδὸς ἡ ἀπάγουσα εἰς τὴν ἀπώλειαν, καὶ πολλοί εἰσιν οἱ εἰσερχόμενοι δι’ αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/013.yaml
  text: Enter through the narrow gate[a]. For wide is the gate and broad is the road that leads to destruction[c][b], and many are those who enter through it.
translation:
  language: it
  text: Entrate per la porta stretta; perché larga è la porta e spaziosa la via che conduce alla perdizione,[a] e molti sono quelli che entrano per essa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «alla rovina» o «alla distruzione». Il termine greco può indicare perdita, rovina, distruzione o perdizione.
    reason: lexical_alternative
  - marker: b
    text: Il pronome femminile «essa» può riferirsi alla porta oppure alla via, anche se nel contesto è probabilmente la porta.
    reason: referential_ambiguity
lexical_decisions:
- source_word: Εἰσέλθατε
  choice: Entrate
  rationale: L’aoristo imperativo attivo, seconda persona plurale, esprime un comando diretto; «Entrate» è naturale e conserva pienamente tale forza.
- source_word: διὰ τῆς στενῆς πύλης
  choice: per la porta stretta
  rationale: διά con il genitivo indica il passaggio attraverso un’apertura. In italiano «entrare per la porta» è più idiomatico di «entrare attraverso la porta», mentre «stretta» rende il normale senso spaziale di στενή.
- source_word: ὅτι
  choice: perché
  rationale: Introduce la motivazione esplicativa del comando ed è scorrevole nell’italiano contemporaneo.
- source_word: πλατεῖα ἡ πύλη
  choice: larga è la porta
  rationale: «Larga» esprime il contrasto spaziale con la porta stretta; l’ordine con il predicato anticipato conserva l’enfasi del greco senza risultare innaturale.
- source_word: εὐρύχωρος ἡ ὁδός
  choice: spaziosa la via
  rationale: εὐρύχωρος indica ciò che offre molto spazio. «Spaziosa» mantiene una sfumatura distinta da πλατεῖα, mentre «via» conserva sia l’immagine concreta del percorso sia il suo valore metaforico.
- source_word: ἡ ἀπάγουσα
  choice: che conduce
  rationale: Il participio presente qualifica la via secondo la sua direzione e il suo esito; «che conduce» è preciso e idiomatico.
- source_word: εἰς τὴν ἀπώλειαν
  choice: alla perdizione
  rationale: ἀπώλεια indica perdita, rovina o distruzione. «Perdizione» conserva qui la gravità dell’esito nel contesto escatologico senza definirne ulteriormente la natura.
- source_word: πολλοί εἰσιν οἱ εἰσερχόμενοι δι’ αὐτῆς
  choice: molti sono quelli che vi entrano
  rationale: La formulazione conserva l’enfasi su «molti». Il clitico «vi» rende in modo naturale δι’ αὐτῆς e non elimina l’ambiguità grammaticale del pronome femminile, che può richiamare la porta o la via.
theological_decisions:
- issue: Portata di ἀπώλεια nell’avvertimento di Gesù
  choice: perdizione
  alternative: rovina; distruzione
  rationale: Il termine indica un esito disastroso, ma il versetto non ne esplicita ogni aspetto teologico. «Perdizione» mantiene la solennità e la forza escatologica del monito, mentre la nota segnala la più ampia gamma lessicale.
- issue: Referente di αὐτῆς nell’ultima proposizione
  choice: vi
  alternative: per quella porta; per quella via
  rationale: Sia πύλη («porta») sia ὁδός («via») sono femminili e possono fungere grammaticalmente da antecedente. Il contesto favorisce probabilmente la porta, dato il verbo «entrare per», ma esplicitarla nel testo risolverebbe un’ambiguità presente nel greco.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. La costruzione «larga è la porta e spaziosa la via» mantiene il parallelismo e l’enfasi del greco con una lieve solennità adatta all’insegnamento di Gesù. Le note preservano l’ampiezza semantica di ἀπώλεια e l’ambiguità referenziale di αὐτῆς.
