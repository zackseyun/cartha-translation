  text: for he was teaching them as one having authority[a], and not as their scribes.
translation:
  language: it
  text: perché insegnava loro come uno che ha autorità[a], e non come i loro scribi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, più idiomaticamente: «con autorità».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν γὰρ διδάσκων
  choice: perché insegnava
  rationale: La costruzione perifrastica all’imperfetto esprime un’azione continuata nel passato. «Perché» rende γάρ come spiegazione dello stupore delle folle nel versetto precedente.
- source_word: αὐτούς
  choice: loro
  rationale: Pronome oggetto riferito alle folle o agli ascoltatori; in italiano «insegnava loro» è naturale e dignitoso.
- source_word: ὡς ἐξουσίαν ἔχων
  choice: come uno che ha autorità
  rationale: Riproduce esplicitamente il paragone e presenta l’autorità come una qualità reale di Gesù, senza precisarne oltre il fondamento teologico. Il presente «ha» è naturale in italiano e conserva l’immediatezza descrittiva del participio greco.
- source_word: καὶ οὐχ ὡς
  choice: e non come
  rationale: Mantiene il contrasto comparativo espresso nel greco.
- source_word: οἱ γραμματεῖς αὐτῶν
  choice: i loro scribi
  rationale: «Scribi» è l’equivalente storico e lessicale più diretto per gli esperti riconosciuti della Legge; «loro» conserva αὐτῶν.
theological_decisions:
- issue: Natura dell’autorità di Gesù nell’insegnamento
  choice: Descrivere Gesù «come uno che ha autorità».
  alternative: Esplicitare che si tratta di autorità divina, oppure ridurla a semplice sicurezza o efficacia retorica.
  rationale: Il versetto presenta l’autorità di Gesù come reale e la contrappone al modo d’insegnare degli scribi, ma non ne specifica qui il pieno fondamento teologico.
translation_notes:
  register: Italiano standard moderno, chiaro e dignitoso. La formulazione resta vicina alla struttura greca, mentre la nota offre l’alternativa italiana più idiomatica.
