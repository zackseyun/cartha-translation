  text: Μὴ κρίνετε, ἵνα μὴ κριθῆτε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/001.yaml
  text: Do not judge[a], so that you may not be judged.
translation:
  language: it
  text: Non giudicate[a], affinché non siate giudicati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «Non condannate, affinché non siate condannati». Il verbo greco può, in alcuni contesti, avere il senso di condannare; «giudicare», però, è più ampio e conserva la ripetizione lessicale del versetto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ
  choice: Non
  rationale: Con l’imperativo presente κρίνετε, μή introduce una proibizione; in italiano «Non giudicate» ne esprime naturalmente la forza.
- source_word: κρίνετε
  choice: giudicate
  rationale: κρίνω ha un campo semantico ampio, che può comprendere giudicare, valutare e condannare. «Giudicate» conserva sia questa ampiezza sia il legame lessicale con κριθῆτε.
- source_word: ἵνα
  choice: affinché
  rationale: ἵνα con il congiuntivo esprime qui scopo o risultato. «Affinché» rende chiaramente il nesso ed è dignitoso senza essere arcaico.
- source_word: μὴ
  choice: non
  rationale: Il secondo μή nega il congiuntivo passivo che segue ed è reso direttamente con «non».
- source_word: κριθῆτε
  choice: siate giudicati
  rationale: Il congiuntivo aoristo passivo di κρίνω è reso con la stessa radice italiana usata nella prima proposizione, preservando la ripetizione e l’equilibrio retorico.
theological_decisions:
- issue: Portata di κρίνω nella proibizione di Gesù
  choice: Mantenere il termine più ampio «giudicare», senza restringerlo interpretativamente a «condannare».
  alternative: Non condannate, affinché non siate condannati.
  rationale: Il contesto immediato (Matteo 7:2-5) chiarisce il tipo di giudizio censurato, ma il singolo versetto non delimita da solo ogni forma di valutazione morale. «Giudicare» conserva la tensione del testo e lascia che sia il contesto a precisarne la portata.
translation_notes:
  register: Italiano standard moderno, conciso e dignitoso. La costruzione parallela conserva la forza aforistica dell’originale; «affinché» rende con chiarezza il rapporto di scopo o risultato.
