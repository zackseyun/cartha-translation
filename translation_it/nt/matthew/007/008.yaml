  variant: modern standard Italian
source:
  edition: SBLGNT
  text: πᾶς γὰρ ὁ αἰτῶν λαμβάνει καὶ ὁ ζητῶν εὑρίσκει καὶ τῷ κρούοντι ⸀ἀνοιγήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/008.yaml
  text: For everyone who asks receives[a], and the one who seeks finds, and to the one who knocks it will be opened.
translation:
  language: it
  text: Infatti chiunque chiede riceve, chi cerca trova e a chi bussa sarà aperto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Il greco non specifica che cosa venga aperto; dall’immagine si sottintende una porta. Si può anche rendere: «e per chi bussa si aprirà».'
    reason: Ambiguità grammaticale e integrazione implicita dell’immagine.
lexical_decisions:
- source_word: πᾶς
  choice: chiunque
  rationale: Con il participio sostantivato esprime una classe generale; «chiunque» è naturale in italiano moderno e conserva la portata universale.
- source_word: γὰρ
  choice: Infatti
  rationale: Mantiene il valore esplicativo che collega il detto all’esortazione precedente.
- source_word: ὁ αἰτῶν
  choice: chi chiede
  rationale: Rende naturalmente il participio presente sostantivato, conservandone il senso generale e abituale.
- source_word: λαμβάνει
  choice: riceve
  rationale: È l’equivalente ordinario e mantiene il parallelismo sobrio dell’originale.
- source_word: ὁ ζητῶν
  choice: chi cerca
  rationale: Conserva la struttura parallela e il carattere memorabile della formulazione greca.
- source_word: εὑρίσκει
  choice: trova
  rationale: Rende direttamente il significato comune del verbo nel contesto.
- source_word: τῷ κρούοντι
  choice: a chi bussa
  rationale: Riproduce il dativo greco e si collega naturalmente al passivo «sarà aperto».
- source_word: ἀνοιγήσεται
  choice: sarà aperto
  rationale: Conserva il futuro passivo e non introduce esplicitamente «la porta», assente nel testo greco.
theological_decisions:
- issue: Portata e forza della promessa
  choice: Una rassicurazione generale formulata in termini universali, senza aggiungere limiti o condizioni nel testo.
  alternative: Intenderla come garanzia assoluta che ogni singola richiesta sarà esaudita esattamente come formulata, oppure restringerla esplicitamente a determinate richieste spirituali.
  rationale: Il greco usa un linguaggio universale e va reso senza attenuarlo; al tempo stesso, la traduzione non deve imporre una soluzione teologica slegata dal contesto più ampio.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. La triplice struttura parallela è mantenuta in forma concisa; «Infatti» rende il nesso esplicativo senza appesantire il versetto.
