id: MAT.6.4
reference: Matthew 6:4
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ὅπως ᾖ σου ἡ ἐλεημοσύνη ἐν τῷ κρυπτῷ· καὶ ὁ πατήρ σου ὁ βλέπων ἐν τῷ ⸀κρυπτῷ ἀποδώσει ⸀σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/004.yaml
  text: so that your giving to the poor may be in secret[b][a]; and your Father who sees in secret will reward you.
translation:
  language: it
  text: affinché il tuo dono ai poveri[a] sia fatto in segreto; e il Padre tuo, che vede nel segreto, ti ricompenserà[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «elemosina». Il termine greco indica specificamente ciò che si dà ai poveri.
    reason: lexical_alternative
  - marker: b
    text: O «ti ripagherà».
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπως
  choice: affinché
  rationale: Introduce naturalmente lo scopo e mantiene il legame logico con l’istruzione precedente.
- source_word: ᾖ
  choice: rimanga
  rationale: Rende in italiano corrente il congiuntivo presente retto da ὅπως e comunica la permanenza dell’atto fuori dalla vista pubblica.
- source_word: ἐλεημοσύνη
  choice: dono ai poveri
  rationale: Esplicita il riferimento concreto all’aiuto materiale dato ai poveri senza allargarlo alla beneficenza in generale; «elemosina» resta indicata in nota come alternativa più formale e tradizionale.
- source_word: ἐν τῷ κρυπτῷ
  choice: segreto / nel segreto
  rationale: Nella prima proposizione «rimanga segreto» è italiano naturale; nella seconda «nel segreto» conserva l’idea di ciò che è sottratto allo sguardo pubblico.
- source_word: ὁ πατήρ σου
  choice: il Padre tuo
  rationale: Traduce il testo senza aggiungere «celeste», assente in questo versetto, e mantiene il rilievo dato a «Padre».
- source_word: ὁ βλέπων
  choice: che vede
  rationale: Rende il participio sostantivato con una relativa semplice e naturale, conservandone il senso percettivo.
- source_word: ἀποδώσει
  choice: ti ricompenserà
  rationale: Nel contesto esprime la risposta favorevole di Dio senza precisare forma, tempo o natura della ricompensa.
- source_word: σοι
  choice: ti
  rationale: Integra naturalmente il dativo personale nella costruzione verbale italiana.
theological_decisions:
- issue: Natura della retribuzione divina espressa da ἀποδώσει
  choice: ti ricompenserà
  alternative: ti ripagherà
  rationale: «Ricompenserà» comunica una risposta divina favorevole, ma non stabilisce se essa sia temporale o eterna, materiale o spirituale. «Ripagherà» conserva più direttamente l’idea di restituzione ed è segnalato in nota.
translation_notes:
  register: Italiano standard moderno, chiaro e dignitoso. La formulazione evita sia un tecnicismo religioso non necessario sia l’aggiunta di «celeste», non presente nel greco. La ripetizione concettuale del nascondimento è mantenuta, con una lieve variazione sintattica richiesta dalla naturalezza dell’italiano.
