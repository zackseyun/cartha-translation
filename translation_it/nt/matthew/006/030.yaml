id: MAT.6.30
reference: Matthew 6:30
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: εἰ δὲ τὸν χόρτον τοῦ ἀγροῦ σήμερον ὄντα καὶ αὔριον εἰς κλίβανον βαλλόμενον ὁ θεὸς οὕτως ἀμφιέννυσιν, οὐ πολλῷ μᾶλλον ὑμᾶς, ὀλιγόπιστοι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/030.yaml
  text: But if God so clothes the grass of the field[a], which is here today and tomorrow is thrown into an oven, will he not much more clothe you[b], you of little faith?
translation:
  language: it
  text: Ma se Dio veste così l’erba del campo, che oggi c’è e domani viene gettata nel forno[a], non vestirà molto di più voi, voi che avete poca fede[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il «forno» è un forno per il pane; erba secca e altre piante dei campi potevano essere usate come combustibile.
    reason: cultural_note
  - marker: b
    text: 'Oppure: «gente di poca fede». Il greco usa un vocativo diretto che rimprovera una fiducia insufficiente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χόρτον τοῦ ἀγροῦ
  choice: l’erba dei campi
  rationale: χόρτος indica erba o vegetazione erbacea; «dei campi» rende in italiano naturale il genitivo τοῦ ἀγροῦ senza restringere il riferimento ai soli fiori.
- source_word: σήμερον ὄντα
  choice: che oggi c’è
  rationale: Rende idiomaticamente il participio ὄντα («essendo») e sottolinea la presenza effimera della vegetazione senza aggiungere l’idea esplicita di essere viva.
- source_word: αὔριον εἰς κλίβανον βαλλόμενον
  choice: domani viene gettata nel forno
  rationale: κλίβανος è un forno, verosimilmente da pane, mentre il presente passivo βαλλόμενον è reso con una forma passiva italiana naturale.
- source_word: οὕτως ἀμφιέννυσιν
  choice: veste così
  rationale: ἀμφιέννυμι significa «vestire»; la scelta conserva l’immagine che collega la vegetazione all’abbigliamento nel contesto.
- source_word: οὐ πολλῷ μᾶλλον
  choice: non vestirà molto di più
  rationale: Conserva la domanda retorica e l’argomento dal minore al maggiore; il verbo sottinteso viene ripetuto per chiarezza in italiano.
- source_word: ὑμᾶς
  choice: voi
  rationale: Pronome plurale oggetto del verbo «vestire» sottinteso nel greco; la forma esplicita mantiene l’enfasi contrastiva sulle persone interpellate.
- source_word: ὀλιγόπιστοι
  choice: gente di poca fede
  rationale: Rende il vocativo plurale come rimprovero diretto e comprensibile nell’italiano moderno, evitando sia l’arcaico «o uomini di poca fede» sia una formulazione che lo trasformi in semplice descrizione.
- source_word: εἰ δὲ
  choice: Ma se
  rationale: δέ introduce qui uno sviluppo lievemente contrastivo rispetto all’immagine precedente; «Ma se» ne conserva la funzione argomentativa.
theological_decisions:
- issue: Argomento della provvidenza divina dal minore al maggiore
  choice: 'La frase resta una domanda retorica: Dio, che veste la vegetazione effimera, vestirà a maggior ragione i discepoli.'
  alternative: Trasformare la domanda in un’affermazione esplicita.
  rationale: La sintassi greca con οὐ e il vocativo finale sostengono una domanda retorica che esorta alla fiducia senza aggiungere precisazioni dottrinali estranee al testo.
- issue: Forza di ὀλιγόπιστοι
  choice: 'Rimprovero diretto per una fede o fiducia insufficiente: «gente di poca fede».'
  alternative: «Voi che avete poca fede» oppure «increduli».
  rationale: Il composto indica poca fede, non necessariamente totale incredulità; la resa conserva la tensione tra l’appartenenza dei destinatari a Gesù e l’inadeguatezza della loro fiducia.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. «L’erba dei campi» conserva l’immagine tradizionale senza sovraspecificare; «che oggi c’è» comunica con naturalezza la brevità della sua esistenza. I richiami delle note sono collocati sui termini pertinenti, correggendo l’apparente inversione dei marcatori nel livello inglese fornito.
