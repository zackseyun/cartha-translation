  text: σὺ δὲ νηστεύων ἄλειψαί σου τὴν κεφαλὴν καὶ τὸ πρόσωπόν σου νίψαι,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/017.yaml
  text: But you[a], when you fast, anoint your head and wash your face[b],
translation:
  language: it
  text: Tu invece, quando digiuni, ungiti il capo[a] e lavati il viso[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «mettiti dell’olio sul capo». Il verbo greco può indicare l’applicazione di olio come parte della normale cura personale.'
    reason: lexical_alternative
  - marker: b
    text: Cioè, mantieni il tuo aspetto abituale invece di rendere evidente agli altri che stai digiunando.
    reason: cultural_note
lexical_decisions:
- source_word: σὺ δὲ
  choice: Tu invece
  rationale: Il pronome espresso è enfatico e, con δέ, contrappone direttamente il discepolo agli ipocriti menzionati nel contesto precedente.
- source_word: νηστεύων
  choice: quando digiuni
  rationale: Il participio presente ha valore temporale; una proposizione con «quando» è naturale in italiano e conserva il carattere dell’istruzione.
- source_word: ἄλειψαί
  choice: ungiti
  rationale: Il verbo indica l’applicazione di olio, qui verosimilmente come normale cura personale. «Ungiti» conserva la concretezza culturale del greco; la nota offre una formulazione più esplicita.
- source_word: τὴν κεφαλήν
  choice: il capo
  rationale: Resa diretta di κεφαλή, appropriata al registro dignitoso del passo senza restringere il riferimento ai soli capelli.
- source_word: καὶ
  choice: e
  rationale: Mantiene la semplice coordinazione dei due imperativi.
- source_word: τὸ πρόσωπόν σου
  choice: il viso
  rationale: πρόσωπον indica qui la parte visibile del volto; «viso» è chiaro e naturale nell’italiano moderno.
- source_word: νίψαι
  choice: lavati
  rationale: νίπτω indica comunemente il lavaggio di una parte del corpo. La forma riflessiva italiana rende in modo idiomatico l’azione compiuta su di sé.
theological_decisions:
- issue: Natura dell’istruzione sull’aspetto durante il digiuno
  choice: L’istruzione descrive la normale cura della persona durante il digiuno, in contrasto con l’ostentazione menzionata nel contesto.
  alternative: Potrebbe essere intesa come un’unzione rituale oppure come un divieto del digiuno pubblico in quanto tale.
  rationale: Il contesto immediato contrappone lo sfigurarsi il volto al mantenere un aspetto normale. La traduzione conserva le azioni concrete del testo senza trasformarle in un rito né affermare che ogni digiuno visibile sia proibito.
translation_notes:
  register: Italiano moderno, naturale e dignitoso. «Tu invece» conserva l’enfasi contrastiva; «ungiti il capo» mantiene il colore culturale dell’originale, mentre le forme riflessive rendono idiomatici gli imperativi.
