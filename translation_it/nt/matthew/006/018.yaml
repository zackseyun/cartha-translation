  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ὅπως μὴ φανῇς τοῖς ἀνθρώποις νηστεύων ἀλλὰ τῷ πατρί σου τῷ ἐν τῷ ⸀κρυφαίῳ· καὶ ὁ πατήρ σου ὁ βλέπων ἐν τῷ ⸁κρυφαίῳ ἀποδώσει σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/018.yaml
  text: so that you may not appear to men to be fasting[a], but to your Father who is in secret[b]; and your Father who sees in secret will reward you.
translation:
  language: it
  text: affinché tu non appaia agli altri come uno che digiuna[a], ma al Padre tuo che è nel segreto[b]; e il Padre tuo, che vede nel segreto, ti ricompenserà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Letteralmente: «agli uomini»; qui il termine greco indica in generale gli osservatori umani.'
    reason: lexical_alternative
  - marker: b
    text: 'O: «nel luogo segreto». L''espressione greca può indicare ciò che è nascosto oppure un luogo appartato.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως
  choice: affinché
  rationale: Introduce lo scopo e conserva il valore finale della congiunzione greca in un italiano dignitoso e naturale.
- source_word: μὴ φανῇς ... νηστεύων
  choice: tu non sia visto digiunare
  rationale: Rende il congiuntivo aoristo passivo e il participio senza trasformare l'azione in un'esibizione intenzionale; il contesto riguarda la visibilità del digiuno.
- source_word: τοῖς ἀνθρώποις
  choice: dagli altri
  rationale: Nel contesto indica gli osservatori umani in generale, non soltanto persone di sesso maschile. «Dagli altri» è idiomatico e mantiene il contrasto con il Padre.
- source_word: τῷ πατρί σου
  choice: dal Padre tuo
  rationale: Mantiene il parallelismo con il primo dativo nella costruzione italiana passiva e conserva l'appellativo relazionale.
- source_word: ἐν τῷ κρυφαίῳ
  choice: nel segreto
  rationale: Conserva l'indeterminatezza dell'espressione greca, che può evocare sia ciò che è nascosto sia un luogo appartato, e permette di ripetere la stessa formula.
- source_word: ἀποδώσει σοι
  choice: ti ricompenserà
  rationale: Nel contesto della risposta divina a una pratica religiosa, esprime chiaramente il senso di retribuire o dare la dovuta ricompensa.
theological_decisions:
- issue: Referente generico di ἀνθρώποις
  choice: «dagli altri», con riferimento generale agli osservatori umani
  alternative: «dagli uomini»
  rationale: Il plurale greco è generico nel contesto; la resa scelta evita una lettura esclusivamente maschile senza restringere il referente.
- issue: Senso di ἐν τῷ κρυφαίῳ nelle due occorrenze
  choice: «nel segreto» in entrambe le occorrenze
  alternative: «nel luogo segreto» oppure «in segreto»
  rationale: La ripetizione collega la presenza nascosta del Padre al suo vedere, senza decidere se l'espressione indichi propriamente un luogo o la sfera del nascosto.
- issue: Rapporto tra il Padre e il digiuno non visto dagli altri
  choice: 'Conservato il contrasto: non essere visto dagli altri, ma dal Padre'
  alternative: «non mostrare agli altri che digiuni»
  rationale: La forma passiva evita di aggiungere esplicitamente l'idea di ostentazione intenzionale e mantiene la tensione della formulazione greca.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. La costruzione passiva conserva da vicino la forma greca; «Padre tuo» mantiene un tono biblico naturale, mentre la ripetizione di «nel segreto» preserva il legame retorico tra le due proposizioni.
