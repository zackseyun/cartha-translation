id: MAT.6.23
reference: Matthew 6:23
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ἐὰν δὲ ὁ ὀφθαλμός σου πονηρὸς ᾖ, ὅλον τὸ σῶμά σου σκοτεινὸν ἔσται. εἰ οὖν τὸ φῶς τὸ ἐν σοὶ σκότος ἐστίν, τὸ σκότος πόσον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/023.yaml
  text: But if your eye is bad[a], your whole body will be dark. If then the light in you is darkness, how great is the darkness!
translation:
  language: it
  text: Ma se il tuo occhio è cattivo[a], tutto il tuo corpo sarà oscuro. Se dunque la luce che è in te è oscurità, quanto grande è l'oscurità!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «malvagio», «malato»; forse anche «avaro» o «non generoso», alla luce dell'idioma dell'«occhio» e del contesto circostante.
    reason: Alternativa lessicale che preserva i possibili valori di πονηρός e l'ambiguità della metafora.
lexical_decisions:
- source_word: πονηρός
  choice: cattivo
  rationale: Mantiene l'ampiezza semantica del termine greco e lascia aperti i possibili sensi di malvagio, difettoso o non generoso, senza sciogliere la metafora.
- source_word: σκοτεινός
  choice: nelle tenebre
  rationale: Esprime in italiano naturale la condizione di oscurità dell'intero corpo, conservando il contrasto con la luce.
- source_word: φῶς
  choice: luce
  rationale: Resa diretta che conserva intatta la metafora, senza interpretarla esplicitamente come illuminazione interiore o discernimento spirituale.
- source_word: σκότος
  choice: tenebra
  rationale: Conserva il contrasto lessicale con «luce» e la ripresa enfatica nella clausola finale.
- source_word: πόσον
  choice: quanto grande
  rationale: Rende il valore esclamativo di grado dell'espressione ellittica greca; l'aggiunta di «sarà» produce una frase italiana compiuta e coerente con il futuro precedente.
- source_word: ὀφθαλμός
  choice: occhio
  rationale: Mantiene il referente corporeo su cui si fonda la metafora della percezione e dell'orientamento morale.
- source_word: ὅλον τὸ σῶμά σου
  choice: tutto il tuo corpo
  rationale: Resa lineare e naturale che preserva l'enfasi totalizzante di ὅλον.
- source_word: τὸ φῶς τὸ ἐν σοὶ
  choice: la luce che è in te
  rationale: Segue da vicino la costruzione greca ed evita l'interpretazione più marcata «la tua luce interiore».
theological_decisions:
- issue: Significato della metafora dell'«occhio cattivo»
  choice: Mantenere nel testo la formulazione ampia «occhio cattivo».
  alternative: «occhio malvagio», «occhio malato» oppure, in senso idiomatico, «occhio avaro/non generoso»
  rationale: 'Il contesto di Matteo 6:19-24 consente sfumature sovrapposte: corruzione morale, percezione difettosa e forse l''idioma semitico relativo all''avarizia. La resa scelta conserva questa tensione interpretativa.'
- issue: Tempo verbale nella clausola esclamativa finale
  choice: «quanto grande sarà la tenebra!»
  alternative: «quanto grande è la tenebra!» oppure la forma ellittica «quanto grande la tenebra!»
  rationale: Il greco omette il verbo nella clausola finale. Il futuro italiano riprende naturalmente ἔσται della frase precedente, ma non pretende che nel testo greco sia espresso un nuovo verbo.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. «Nelle tenebre» è più idiomatico di «tenebroso» riferito al corpo; il singolare «tenebra» nella seconda metà conserva la ripetizione del greco e dà forza solenne alla conclusione.
