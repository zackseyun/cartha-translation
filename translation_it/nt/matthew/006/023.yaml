  to: Ma se il tuo occhio è cattivo[a], tutto il tuo corpo sarà oscuro. Se dunque la luce che è in te è oscurità, quanto grande è l'oscurità!
  rationale: La revisione sostituisce la parafrasi locativa «nelle tenebre» con il predicato più diretto «oscuro» e non prolunga nella clausola finale il futuro della proposizione precedente. Restano invariati il registro, la metafora e l'ambiguità interpretativa di «occhio cattivo».
