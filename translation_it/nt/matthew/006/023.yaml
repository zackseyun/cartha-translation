review_pass:
  verdict: revise
  source_fidelity: 'La resa conserva bene le immagini e i contrasti del greco: «occhio», «corpo», «luce» e «oscurità». Tuttavia, nella clausola conclusiva πόσον il greco è ellittico e non esprime un nuovo futuro; «sarà» restringe inutilmente l''ellissi, benché possa essere inteso per ripresa.'
  naturalness: «Tutto il tuo corpo sarà oscuro» è più diretto e più vicino al predicato σκοτεινόν di «sarà nelle tenebre». «Quanto grande è l'oscurità!» è italiano standard naturale e rende l'esclamazione ellittica senza introdurre un futuro non espresso.
  terminology: «Occhio cattivo» mantiene appropriatamente l'ampiezza di πονηρός. La nota conserva, senza imporre, le sfumature morale, fisica e idiomatica legata alla generosità. L'uso coerente di «oscuro/oscurità» riflette la distinzione tra σκοτεινός e σκότος.
  issues:
  - severity: medium
    issue: Il futuro «sarà» nella clausola finale aggiunge un verbo e un tempo non espressi nel greco.
    rationale: τὸ σκότος πόσον è una clausola esclamativa ellittica. Il futuro può essere inferito dalla frase precedente, ma non è richiesto dal testo e riduce l'ambiguità sintattica; una formulazione italiana al presente è meno interpretativa.
  - severity: low
    issue: «Sarà nelle tenebre» è leggermente meno aderente al predicato aggettivale σκοτεινόν.
    rationale: σκοτεινόν qualifica il corpo come «oscuro/dark», non lo colloca esplicitamente «nelle tenebre». «Sarà oscuro» è sia naturale sia più vicino alla costruzione greca.
  revised_text: Ma se il tuo occhio è cattivo[a], tutto il tuo corpo sarà oscuro. Se dunque la luce che è in te è oscurità, quanto grande è l'oscurità!
