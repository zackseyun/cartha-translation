  text: τὸν ἄρτον ἡμῶν τὸν ἐπιούσιον δὸς ἡμῖν σήμερον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/011.yaml
  text: Give us today our daily bread[a].
translation:
  language: it
  text: Dacci oggi il nostro pane quotidiano[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oppure «il pane per oggi», «il pane per il giorno che viene» o «il pane di cui abbiamo bisogno». L’aggettivo greco ἐπιούσιον è raro e il suo significato preciso è discusso.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρτον
  choice: pane
  rationale: Ἄρτος indica letteralmente il «pane» e qui è l’oggetto diretto di δὸς. Può rappresentare più ampiamente il nutrimento o il sostentamento, ma nel testo principale va conservata l’immagine concreta.
- source_word: ἡμῶν
  choice: nostro
  rationale: Genitivo possessivo che determina «pane»; la resa italiana diretta è «nostro».
- source_word: ἐπιούσιον
  choice: quotidiano
  rationale: L’aggettivo è raro e di significato discusso. «Quotidiano» è la resa italiana più consolidata e, insieme a «oggi», esprime con naturalezza la richiesta del sostentamento giorno per giorno senza eliminare in nota le principali alternative.
- source_word: δὸς
  choice: Dacci
  rationale: Imperativo aoristo di δίδωμι con il dativo ἡμῖν. In italiano «Dacci» rende in modo diretto e naturale sia il comando-richiesta sia il destinatario.
- source_word: ἡμῖν
  choice: -ci
  rationale: Il pronome dativo è incorporato nell’imperativo italiano «Dacci» e significa «a noi».
- source_word: σήμερον
  choice: oggi
  rationale: Σήμερον significa «oggi»; questa è la resa più diretta e naturale nell’italiano moderno.
theological_decisions:
- issue: Significato di ἐπιούσιον nella preghiera del Signore
  choice: quotidiano
  alternative: per oggi; per il giorno che viene; necessario al sostentamento
  rationale: Il termine può riferirsi al pane del giorno presente, del giorno seguente oppure al pane necessario. «Quotidiano» mantiene la formulazione tradizionale e comprensibile della dipendenza giornaliera da Dio, mentre la nota conserva l’autentica incertezza lessicale senza imporre una sola ricostruzione.
translation_notes:
  register: Italiano moderno standard, naturale e dignitoso. «Dacci» è più idiomatico di «Da’ a noi» e conserva la semplicità diretta della preghiera. La nota esplicita l’ambiguità genuina di ἐπιούσιον.
