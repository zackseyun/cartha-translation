  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Μὴ θησαυρίζετε ὑμῖν θησαυροὺς ἐπὶ τῆς γῆς, ὅπου σὴς καὶ βρῶσις ἀφανίζει, καὶ ὅπου κλέπται διορύσσουσιν καὶ κλέπτουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/019.yaml
  text: Do not store up for yourselves treasures on earth[a], where moth and decay destroy[b], and where thieves break in and steal.
translation:
  language: it
  text: Non accumulate tesori per voi stessi sulla terra, dove la tarma e il deterioramento[a] li distruggono, e dove i ladri aprono un varco[b] e rubano.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oppure «ruggine»; il termine greco può indicare più in generale ciò che consuma, corrode o deteriora, non soltanto l’ossidazione dei metalli.
    reason: lexical_alternative
  - marker: b
    text: Letteralmente «scavano attraverso», probabilmente con riferimento a ladri che aprivano un varco nei muri di mattoni crudi.
    reason: cultural_note
lexical_decisions:
- source_word: Μὴ θησαυρίζετε
  choice: Non accumulate
  rationale: Il presente imperativo con μή esprime una proibizione; «accumulate» rende in italiano moderno l’idea di ammassare e conservare ricchezze.
- source_word: ὑμῖν
  choice: per voi stessi
  rationale: Il dativo ha qui valore riflessivo e indica che l’accumulo è destinato al proprio possesso o vantaggio.
- source_word: θησαυροὺς
  choice: tesori
  rationale: Equivalente diretto che conserva il legame lessicale con il verbo e comprende ogni forma di ricchezza terrena considerata preziosa.
- source_word: ἐπὶ τῆς γῆς
  choice: sulla terra
  rationale: Resa locativa naturale, che mantiene il contrasto con il cielo nel versetto seguente.
- source_word: σὴς
  choice: la tarma
  rationale: Indica la tarma che rovina vesti e altri beni conservati; il singolare con articolo funziona naturalmente in senso collettivo in italiano.
- source_word: βρῶσις
  choice: il deterioramento
  rationale: Il sostantivo indica ciò che consuma o corrode; «deterioramento» ne conserva la portata più ampia senza limitarla all’ossidazione dei metalli.
- source_word: ἀφανίζει
  choice: li distruggono
  rationale: Il verbo esprime la rovina o la scomparsa dei beni. Il pronome «li» esplicita in italiano l’oggetto sottinteso, cioè i tesori.
- source_word: κλέπται
  choice: i ladri
  rationale: Equivalente italiano diretto.
- source_word: διορύσσουσιν
  choice: sfondano
  rationale: Rende in forma concisa l’azione di aprirsi un varco per entrare; il significato letterale e lo sfondo edilizio sono precisati in nota.
- source_word: κλέπτουσιν
  choice: rubano
  rationale: Equivalente italiano diretto del verbo che indica il furto.
theological_decisions:
- issue: Portata di γῆ nel contrasto con il cielo
  choice: sulla terra
  alternative: in terra
  rationale: «Sulla terra» conserva il riferimento concreto all’ambito terreno e il contrasto immediato con il cielo, senza aggiungere una distinzione teologica estranea al testo.
- issue: Resa di βρῶσις
  choice: deterioramento
  alternative: ruggine
  rationale: «Ruggine» è una resa tradizionale possibile, ma il termine greco ha un senso più ampio di consumo o deterioramento; la nota conserva l’alternativa senza restringere il testo principale.
translation_notes:
  register: Italiano moderno, chiaro e dignitoso. La formulazione conserva il parallelismo delle due proposizioni introdotte da «dove» e rende esplicito con «li» l’oggetto implicito di «distruggono». I marcatori di nota sono collocati sui termini cui le note si riferiscono.
