source:
  edition: SBLGNT
  text: σὺ δὲ ὅταν προσεύχῃ, εἴσελθε εἰς τὸ ταμεῖόν σου καὶ κλείσας τὴν θύραν σου πρόσευξαι τῷ πατρί σου τῷ ἐν τῷ κρυπτῷ· καὶ ὁ πατήρ σου ὁ βλέπων ἐν τῷ κρυπτῷ ἀποδώσει ⸀σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/006.yaml
  text: But when you pray[a], go into your inner room, and after shutting your door, pray to your Father who is in secret; and your Father, who sees in secret[b], will reward you.
translation:
  language: it
  text: Ma tu, quando preghi, entra nella tua stanza appartata[a] e, chiusa la tua porta, prega il Padre tuo che è nel segreto; e il Padre tuo, che vede nel segreto, ti ricompenserà[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «stanza interna», «stanza privata» o «ripostiglio». Il termine greco indica una stanza interna usata per custodire beni o per appartarsi.
    reason: lexical_alternative
  - marker: b
    text: O «ti ripagherà» o «ti renderà ciò che ti è dovuto». Il verbo greco può significare «restituire», «ripagare» o «ricompensare», secondo il contesto.
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ δὲ
  choice: Ma tu
  rationale: Il pronome espresso è enfatico e, insieme a δέ, contrappone il discepolo agli ipocriti del versetto precedente. «Ma tu» conserva in modo naturale tale contrasto.
- source_word: ὅταν προσεύχῃ
  choice: quando preghi
  rationale: ὅταν con il congiuntivo esprime una circostanza generale o ricorrente. «Quando preghi» è corrente in italiano e non fa pensare a un unico episodio.
- source_word: εἴσελθε εἰς
  choice: entra nella
  rationale: L’imperativo aoristo richiede l’azione di entrare; «entra nella» è diretto e idiomatico.
- source_word: τὸ ταμεῖόν σου
  choice: la tua stanza appartata
  rationale: ταμεῖον indica una stanza interna, spesso adibita a deposito e adatta alla riservatezza. «Stanza appartata» mette in risalto la separazione dallo sguardo pubblico senza limitarne la funzione a ripostiglio.
- source_word: κλείσας τὴν θύραν σου
  choice: chiusa la porta
  rationale: 'Il participio aoristo indica un’azione anteriore all’imperativo principale. La costruzione assoluta italiana conserva con concisione la sequenza: prima chiudere, poi pregare.'
- source_word: πρόσευξαι τῷ πατρί σου
  choice: prega il Padre tuo
  rationale: Il semplice imperativo «prega» rende direttamente προσεύχομαι. In italiano «pregare qualcuno» è costruzione naturale; «Padre tuo» conserva la designazione relazionale senza aggiungere «celeste», assente nel testo.
- source_word: τῷ ἐν τῷ κρυπτῷ
  choice: che è nel segreto
  rationale: La formula attribuisce al Padre una presenza caratterizzata dal nascondimento. «Nel segreto» resta volutamente aperto tra sfumatura locale e condizione non visibile e permette di mantenere la ripetizione greca.
- source_word: ὁ βλέπων ἐν τῷ κρυπτῷ
  choice: che vede nel segreto
  rationale: La resa conserva sia il participio che la ripetizione di ἐν τῷ κρυπτῷ, senza esplicitare l’oggetto del vedere, che il greco lascia implicito.
- source_word: ἀποδώσει σοι
  choice: ti ricompenserà
  rationale: Nel contesto, ἀποδίδωμι indica la risposta favorevole del Padre. «Ti ricompenserà» comunica questo senso, mentre la nota conserva l’alternativa più letterale «ti renderà» o «ti ripagherà».
theological_decisions:
- issue: Senso della formula ripetuta ἐν τῷ κρυπτῷ
  choice: «nel segreto» in entrambe le occorrenze
  alternative: «in segreto»; «nel luogo segreto»; «ciò che avviene in segreto»
  rationale: La ripetizione collega la presenza nascosta del Padre al suo vedere. La stessa formula italiana conserva il contrasto con l’ostentazione pubblica e non scioglie l’ambiguità tra luogo nascosto, invisibilità e sfera del segreto.
- issue: Designazione di Dio come πατήρ
  choice: «Padre»
  alternative: «Padre celeste»
  rationale: Il testo dice semplicemente «Padre tuo». Non si introduce l’aggettivo «celeste» da passi vicini, preservando la forma relazionale propria del versetto.
- issue: Natura della risposta espressa da ἀποδώσει
  choice: «ti ricompenserà»
  alternative: «ti ripagherà»; «ti renderà»
  rationale: Il verbo può indicare restituzione, retribuzione o ricompensa. Il contesto favorisce una risposta positiva di Dio, ma il testo non precisa né la forma né il momento della ricompensa; la traduzione evita dunque di specificarli.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. «Ma tu» mantiene l’enfasi contrastiva; «stanza appartata» evita le associazioni moderne potenzialmente fuorvianti di «gabinetto» o «stanzino». La formula lievemente marcata «nel segreto» è mantenuta intenzionalmente nelle due occorrenze per riprodurre la tensione e la ripetizione del greco.
