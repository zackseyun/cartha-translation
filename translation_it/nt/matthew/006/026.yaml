id: MAT.6.26
reference: Matthew 6:26
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ἐμβλέψατε εἰς τὰ πετεινὰ τοῦ οὐρανοῦ ὅτι οὐ σπείρουσιν οὐδὲ θερίζουσιν οὐδὲ συνάγουσιν εἰς ἀποθήκας, καὶ ὁ πατὴρ ὑμῶν ὁ οὐράνιος τρέφει αὐτά· οὐχ ὑμεῖς μᾶλλον διαφέρετε αὐτῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/026.yaml
  text: Look at the birds of the sky[a], that they do not sow or reap or gather into barns, and your heavenly Father feeds them[b]. Are you not of much more value than they are?
translation:
  language: it
  text: 'Guardate gli uccelli del cielo[a]: non seminano né mietono né raccolgono nei granai, e il Padre vostro celeste li nutre. Non valete voi molto più di loro?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «gli uccelli dell’aria».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβλέψατε
  choice: Guardate
  rationale: L’imperativo aoristo richiama l’attenzione in modo diretto. «Guardate» è naturale e conserva la forza dell’esortazione senza aggiungere l’idea esplicita di riflessione propria di «considerate».
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: gli uccelli del cielo
  rationale: Rende direttamente l’espressione greca e in italiano indica naturalmente gli uccelli che volano nel cielo; evita di attribuire qui a οὐρανός un senso necessariamente trascendente.
- source_word: ὅτι
  choice: ':'
  rationale: Nel contesto introduce ciò che i discepoli devono osservare riguardo agli uccelli. I due punti rendono in italiano corrente questa funzione esplicativa senza irrigidire l’ambiguo ὅτι in «perché» o «che».
- source_word: οὐ σπείρουσιν οὐδὲ θερίζουσιν οὐδὲ συνάγουσιν
  choice: non seminano, non mietono e non raccolgono
  rationale: Conserva la successione delle tre attività agricole e il parallelismo del greco in forma italiana scorrevole.
- source_word: εἰς ἀποθήκας
  choice: nei granai
  rationale: Nel contesto agricolo ἀποθήκαι indica depositi destinati al raccolto; «granai» è preciso, corrente e coerente con seminare e mietere.
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: il Padre vostro celeste
  rationale: Mantiene sia la relazione espressa da «Padre vostro» sia la qualificazione οὐράνιος, con una formulazione italiana dignitosa e concisa.
- source_word: τρέφει
  choice: nutre
  rationale: Esprime il provvedere al sostentamento degli uccelli. «Nutre» è naturale in italiano e mantiene una portata leggermente più ampia del solo dare da mangiare.
- source_word: καί
  choice: eppure
  rationale: In questo contesto la congiunzione introduce il contrasto tra l’assenza delle attività agricole degli uccelli e il fatto che il Padre li nutra. «Eppure» rende esplicita una relazione già chiaramente implicata dall’argomento.
- source_word: οὐχ ὑμεῖς μᾶλλον διαφέρετε αὐτῶν;
  choice: Non valete voi molto più di loro?
  rationale: La domanda retorica attende risposta affermativa. «Valete ... molto più» comunica il confronto di valore o importanza espresso da διαφέρω e la forza comparativa di μᾶλλον, mantenendo l’enfasi sul pronome «voi».
theological_decisions:
- issue: Il maggior valore degli esseri umani rispetto agli uccelli nell’argomento di Gesù
  choice: La domanda afferma che gli ascoltatori valgono molto più degli uccelli, senza specificarne il fondamento dottrinale.
  alternative: Esplicitare che tale valore deriva dall’immagine di Dio oppure esclusivamente dal rapporto di alleanza.
  rationale: Il versetto stabilisce il confronto e lo usa per sostenere la fiducia nella cura del Padre, ma non ne dichiara il fondamento teologico. La traduzione non aggiunge una spiegazione assente dal testo.
translation_notes:
  register: Italiano standard moderno, chiaro e dignitoso. La formulazione conserva l’immagine agricola, la progressione argomentativa e la domanda retorica. Il solo richiamo di nota nel testo, [a], corrisponde alla nota fornita.
