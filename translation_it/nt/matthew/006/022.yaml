id: MAT.6.22
reference: Matthew 6:22
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Ὁ λύχνος τοῦ σώματός ἐστιν ὁ ὀφθαλμός. ἐὰν οὖν ⸂ᾖ ὁ ὀφθαλμός σου ἁπλοῦς⸃, ὅλον τὸ σῶμά σου φωτεινὸν ἔσται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/022.yaml
  text: The eye is the lamp of the body. Therefore[a], if your eye is healthy, your whole body will be full of light.
translation:
  language: it
  text: L'occhio è la lampada del corpo. Se dunque il tuo occhio è sano[a], tutto il tuo corpo sarà pieno di luce.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «semplice», «limpido» o «integro»; il termine greco può anche esprimere l'idea di essere indiviso e, in alcuni contesti, di essere generoso.
    reason: 'Alternativa lessicale: ἁπλοῦς ha una gamma semantica più ampia di quella espressa da «sano».'
lexical_decisions:
- source_word: λύχνος
  choice: lampada
  rationale: Indica normalmente una lampada concreta, non la luce in astratto; la resa conserva la metafora.
- source_word: σῶμα
  choice: corpo
  rationale: Equivalente italiano diretto e naturale nell'immagine corporea del versetto.
- source_word: ὀφθαλμός
  choice: occhio
  rationale: La resa letterale funziona sia per l'immagine fisica sia per la sua portata morale.
- source_word: ἐὰν οὖν
  choice: Se dunque
  rationale: Conserva sia la condizione introdotta da ἐάν sia il nesso inferenziale espresso da οὖν, in un ordine naturale in italiano.
- source_word: ἁπλοῦς
  choice: sano
  rationale: Nel contrasto immediato con l'occhio cattivo del versetto seguente, descrive naturalmente un occhio che funziona bene; le altre sfumature genuine sono segnalate in nota.
- source_word: ὅλον
  choice: tutto
  rationale: Rende il valore comprensivo dell'aggettivo riferito al corpo.
- source_word: φωτεινόν
  choice: pieno di luce
  rationale: Espressione italiana idiomatica che mantiene l'immagine dell'illuminazione dell'intero corpo.
- source_word: ἔσται
  choice: sarà
  rationale: Mantiene esplicitamente il futuro del testo greco.
theological_decisions:
- issue: Senso di ἁπλοῦς nella metafora dell'occhio
  choice: sano nel testo principale
  alternative: semplice, limpido, integro; in altri contesti anche generoso
  rationale: Il contesto immediato dell'occhio-lampada e il contrasto con l'occhio cattivo favoriscono una resa legata al buon funzionamento della vista. La nota conserva però la polisemia, senza imporre nel testo principale una lettura esclusivamente morale, interiore o economica.
translation_notes:
  register: Italiano standard moderno, naturale e dignitoso. «L'occhio è la lampada del corpo» conserva la formulazione concreta e memorabile dell'originale; «Se dunque» mantiene il collegamento logico senza appesantire la frase.
