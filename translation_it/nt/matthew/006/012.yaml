  text: καὶ ἄφες ἡμῖν τὰ ὀφειλήματα ἡμῶν, ὡς καὶ ἡμεῖς ⸀ἀφήκαμεν τοῖς ὀφειλέταις ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/012.yaml
  text: And forgive us our debts[b][a], as we also have forgiven our debtors.
translation:
  language: it
  text: E perdonaci i nostri debiti[a], come anche noi abbiamo perdonato[b] ai nostri debitori.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cioè le nostre colpe o offese; più letteralmente, «debiti». Il greco conserva la metafora di ciò che è dovuto.
    reason: lexical_alternative
  - marker: b
    text: Il verbo greco presenta l’azione come compiuta; si potrebbe rendere anche con un passato semplice, «perdonammo».
    reason: tense_nuance
lexical_decisions:
- source_word: ἄφες
  choice: perdonaci
  rationale: L’imperativo aoristo di ἀφίημι, in una preghiera e in unione con «debiti», esprime qui la richiesta di perdono. «Perdonaci» è italiano moderno e naturale; il pronome enclitico rende ἡμῖν senza appesantire la frase.
- source_word: τὰ ὀφειλήματα ἡμῶν
  choice: i nostri debiti
  rationale: ὀφειλήματα indica letteralmente ciò che è dovuto. «Debiti» conserva la metafora del testo greco e il legame lessicale con «debitori», senza sostituirla interpretativamente con «peccati» o «offese».
- source_word: ὡς
  choice: come
  rationale: «Come» mantiene in modo conciso la forza comparativa di ὡς, senza precisare se il rapporto debba essere inteso come modello, misura o condizione.
- source_word: καὶ ἡμεῖς
  choice: anche noi
  rationale: L’espressione rende il secondo καί e il pronome esplicito ed enfatico ἡμεῖς, evidenziando la corrispondenza tra il perdono chiesto e quello accordato.
- source_word: ἀφήκαμεν
  choice: abbiamo perdonato
  rationale: Il passato prossimo rende naturalmente in italiano un’azione compiuta con rilevanza per la situazione presente. Conserva inoltre il senso relazionale di ἀφίημι in questo contesto morale.
- source_word: τοῖς ὀφειλέταις ἡμῶν
  choice: ai nostri debitori
  rationale: «Debitori» conserva il sostantivo affine a «debiti» e quindi la coerenza della metafora greca. Il complemento con «a» è idiomatico con «perdonare» in questa costruzione.
theological_decisions:
- issue: Metafora morale dei debiti
  choice: Mantenere «debiti» e «debitori» nel testo principale.
  alternative: «Colpe» e «quelli che ci hanno offeso».
  rationale: Il greco presenta il peccato o l’offesa mediante il linguaggio di ciò che è dovuto. Conservare questa metafora rispetta il testo e non sostituisce l’immagine con la sua interpretazione, pur chiarendone in nota il probabile riferimento morale.
- issue: Rapporto espresso da ὡς
  choice: Tradurre semplicemente «come».
  alternative: «Nella misura in cui» oppure «poiché».
  rationale: «Come» conserva la tensione teologica del paragone senza stabilire se il perdono umano sia condizione, prova, modello o misura del perdono divino.
- issue: Valore temporale di ἀφήκαμεν
  choice: «Abbiamo perdonato».
  alternative: «Perdonammo» o, secondo una diversa forma testuale/tradizionale, «perdoniamo».
  rationale: Il testo SBLGNT ha un aoristo indicativo, quindi presenta il perdono accordato come azione compiuta. Il passato prossimo è la resa moderna più naturale, ma non impone una teoria specifica sull’aspetto dell’aoristo.
translation_notes:
  register: Italiano moderno, dignitoso e adatto alla recitazione comunitaria. «Perdonaci» evita l’uso meno corrente di «rimetti», mentre «debiti» e «debitori» mantengono integralmente la metafora e il richiamo lessicale dell’originale. La sintassi conserva l’enfasi di «anche noi».
