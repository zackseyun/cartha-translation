id: MAT.6.14
reference: Matthew 6:14
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ἐὰν γὰρ ἀφῆτε τοῖς ἀνθρώποις τὰ παραπτώματα αὐτῶν, ἀφήσει καὶ ὑμῖν ὁ πατὴρ ὑμῶν ὁ οὐράνιος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/014.yaml
  text: For if you forgive people their trespasses[b][a], your heavenly Father will also forgive you.
translation:
  language: it
  text: Infatti, se perdonate agli altri le loro colpe[a], anche il Padre vostro celeste vi perdonerà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «mancanze», «trasgressioni» o «offese». Il termine greco indica passi falsi o colpe morali.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν γὰρ
  choice: Infatti, se
  rationale: γάρ collega il versetto alla preghiera precedente con valore esplicativo, mentre ἐάν con il congiuntivo aoristo introduce una condizione reale, resa naturalmente con «se».
- source_word: ἀφῆτε … ἀφήσει
  choice: perdonate … perdonerà
  rationale: Nel contesto delle colpe morali ἀφίημι significa «perdonare». La stessa scelta nei due casi conserva il parallelismo verbale del greco.
- source_word: τοῖς ἀνθρώποις
  choice: agli altri
  rationale: Il termine indica le persone in genere, non soltanto gli uomini di sesso maschile. In italiano «agli altri» esprime con naturalezza il riferimento alle altre persone nel rapporto interpersonale.
- source_word: τὰ παραπτώματα αὐτῶν
  choice: le loro colpe
  rationale: παράπτωμα indica un passo falso, una mancanza o una trasgressione morale. «Colpe» è corrente, dignitoso e adatto al contesto relazionale; una nota conserva le principali sfumature lessicali.
- source_word: καὶ ὑμῖν
  choice: anche … vi
  rationale: καί segnala la corrispondenza tra il perdono accordato agli altri e quello del Padre; «anche» la rende esplicitamente, mentre il dativo ὑμῖν è espresso dall'oggetto pronominale «vi».
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: il Padre vostro celeste
  rationale: Resa naturale della costruzione attributiva greca, che mantiene sia il rapporto espresso da «vostro» sia la qualificazione «celeste».
theological_decisions:
- issue: Rapporto condizionale tra il perdono umano e quello divino
  choice: La frase è resa come una condizione effettiva, senza ulteriori spiegazioni dottrinali.
  alternative: Interpretarla esplicitamente come merito che procura il perdono divino, oppure soltanto come prova esteriore di un perdono divino già ricevuto.
  rationale: Il greco formula direttamente una condizione. La traduzione ne conserva la tensione teologica senza risolverla secondo una particolare tradizione confessionale.
translation_notes:
  register: Italiano standard moderno, chiaro e dignitoso. «Agli altri» evita il maschile generico potenzialmente ambiguo di «agli uomini» ed è più idiomatico di «alle persone» in questo contesto. La collocazione di «anche» conserva il parallelismo senza appesantire la frase.
