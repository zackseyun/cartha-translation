  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Καὶ ὅταν ⸂προσεύχησθε, οὐκ ἔσεσθε ὡς⸃ οἱ ὑποκριταί· ὅτι φιλοῦσιν ἐν ταῖς συναγωγαῖς καὶ ἐν ταῖς γωνίαις τῶν πλατειῶν ἑστῶτες προσεύχεσθαι, ⸀ὅπως φανῶσιν τοῖς ἀνθρώποις· ἀμὴν λέγω ⸀ὑμῖν, ἀπέχουσι τὸν μισθὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/005.yaml
  text: And whenever you pray[a], you shall not be like the hypocrites, because they love to stand and pray in the synagogues and on the corners of the broad streets, so that they may be seen by people. Truly I say to you[c][b], they have received their reward.
translation:
  language: it
  text: 'E quando pregate, non siate come gli ipocriti, perché amano pregare stando in piedi nelle sinagoghe e agli angoli delle strade larghe[a], per essere visti dalla gente[b]. In verità vi dico: hanno già ricevuto la loro ricompensa[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: «agli angoli delle strade». Il greco dice più letteralmente «agli angoli delle strade larghe».'
    reason: lexical_alternative
  - marker: b
    text: 'O: «dagli uomini». Qui il termine greco indica genericamente le persone.'
    reason: lexical_alternative
  - marker: c
    text: 'Il verbo greco può avere il senso commerciale di aver ricevuto per intero quanto spettava; quindi anche: «hanno ricevuto per intero la loro ricompensa».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν προσεύχησθε
  choice: quando pregate
  rationale: In italiano il presente introdotto da «quando» esprime naturalmente una circostanza generale e ricorrente; «ogni volta che pregate» sarebbe possibile, ma qui risulterebbe più pesante.
- source_word: οὐκ ἔσεσθε ὡς
  choice: non siate come
  rationale: Il futuro indicativo greco ha valore prescrittivo. L’imperativo italiano comunica chiaramente tale forza senza assumere il tono di una semplice previsione.
- source_word: ὑποκριταί
  choice: ipocriti
  rationale: È il termine italiano corrente e preciso per chi ostenta una devozione non corrispondente alle proprie intenzioni.
- source_word: φιλοῦσιν
  choice: amano
  rationale: 'Conserva la forza del verbo greco: costoro provano gusto e inclinazione per l’esibizione pubblica della preghiera.'
- source_word: ἐν ταῖς συναγωγαῖς
  choice: nelle sinagoghe
  rationale: Mantiene il riferimento storico concreto ai luoghi di riunione e culto ebraici.
- source_word: ἐν ταῖς γωνίαις τῶν πλατειῶν
  choice: agli angoli delle strade larghe
  rationale: Riproduce il senso concreto delle vie ampie e pubbliche; una nota segnala la resa italiana più idiomatica «agli angoli delle strade».
- source_word: ἑστῶτες προσεύχεσθαι
  choice: pregare stando in piedi
  rationale: Il participio descrive la postura durante la preghiera. Questa costruzione italiana conserva il rapporto sintattico senza suggerire che il semplice stare in piedi sia l’oggetto della condanna.
- source_word: ὅπως φανῶσιν τοῖς ἀνθρώποις
  choice: per essere visti dalla gente
  rationale: Esprime lo scopo dell’azione e rende ἀνθρώποις in senso genericamente umano, senza restringerlo ai maschi.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: In verità vi dico
  rationale: Formula italiana solenne, consolidata e comprensibile, che rende il valore asseverativo dell’espressione semitica.
- source_word: ἀπέχουσι τὸν μισθὸν αὐτῶν
  choice: hanno già ricevuto la loro ricompensa
  rationale: «Già ricevuto» rende nel contesto la sfumatura di pagamento ottenuto; la possibile idea di ricezione completa è conservata in nota senza imporla nel testo.
theological_decisions:
- issue: Valore prescrittivo del futuro οὐκ ἔσεσθε
  choice: non siate come
  alternative: non sarete come
  rationale: Il contesto è un insegnamento esortativo. L’imperativo italiano ne comunica la funzione, mentre il futuro potrebbe essere frainteso come mera previsione.
- issue: Referente generico di ἀνθρώποις
  choice: dalla gente
  alternative: dagli uomini
  rationale: Nel contesto il sostantivo indica gli osservatori umani in generale; «gente» ne conserva l’estensione senza introdurre un riferimento esclusivamente maschile.
- issue: Forza di ἀπέχουσι nella dichiarazione sulla ricompensa
  choice: hanno già ricevuto la loro ricompensa
  alternative: hanno ricevuto per intero la loro ricompensa
  rationale: Il verbo può avere sfumatura commerciale di saldo completo. Il testo principale mantiene una formulazione naturale e non sovraesplicita, mentre la nota conserva la lettura più marcata.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. La frase conserva il tono solenne dell’insegnamento di Gesù, evitando arcaismi. Le note documentano le principali alternative lessicali e mantengono aperta la sfumatura commerciale di ἀπέχουσι.
