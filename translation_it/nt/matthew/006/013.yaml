  text: καὶ μὴ εἰσενέγκῃς ἡμᾶς εἰς πειρασμόν, ἀλλὰ ῥῦσαι ἡμᾶς ἀπὸ τοῦ ⸀πονηροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/013.yaml
  text: And do not lead us into temptation[b][a], but deliver us from evil.
translation:
  language: it
  text: E non condurci nella tentazione[a], ma liberaci dal maligno[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «nella prova». Il termine greco può indicare sia la tentazione sia una prova o una situazione in cui si è messi alla prova.
    reason: lexical_alternative
  - marker: b
    text: O «dal male». La locuzione greca può essere intesa in senso personale («il maligno») oppure impersonale («il male»).
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ εἰσενέγκῃς
  choice: non condurci
  rationale: Rende direttamente la richiesta di preghiera espressa dal congiuntivo aoristo con μή, senza introdurre la parafrasi interpretativa «non permettere che».
- source_word: πειρασμόν
  choice: tentazione
  rationale: È la resa italiana naturale e tradizionale nel contesto; una nota conserva il possibile senso di «prova» insito nel termine greco.
- source_word: ῥῦσαι
  choice: liberaci
  rationale: Esprime un intervento divino attivo di liberazione ed è idiomatico, dignitoso e appropriato alla cadenza della preghiera.
- source_word: τοῦ πονηροῦ
  choice: dal maligno
  rationale: L'articolo e la forma greca consentono il riferimento personale al maligno; la reale possibilità del senso impersonale «dal male» è mantenuta in nota.
theological_decisions:
- issue: Referente di τοῦ πονηροῦ
  choice: dal maligno
  alternative: dal male
  rationale: Il greco può essere inteso come maschile personale («il maligno») oppure come neutro impersonale («il male»). Il testo principale adotta il senso personale, plausibile nel contesto della tentazione, mentre la nota preserva l'ambiguità senza risolverla in modo assoluto.
translation_notes:
  register: Italiano standard moderno, naturale e dignitoso. La formulazione conserva la concisione e la cadenza della preghiera tradizionale, evitando al tempo stesso aggiunte interpretative non presenti nel greco.
