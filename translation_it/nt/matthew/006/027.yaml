id: MAT.6.27
reference: Matthew 6:27
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: τίς δὲ ἐξ ὑμῶν μεριμνῶν δύναται προσθεῖναι ἐπὶ τὴν ἡλικίαν αὐτοῦ πῆχυν ἕνα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/027.yaml
  text: And which of you[a], by being anxious, can add one cubit to his stature?
translation:
  language: it
  text: E chi di voi, preoccupandosi, può aggiungere un solo cubito alla durata della propria vita?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «alla propria statura». Il termine greco può indicare sia l’età o la durata della vita sia la statura.'
    reason: Lettura alternativa dovuta all’ambiguità lessicale di ἡλικία.
lexical_decisions:
- source_word: τίς δὲ ἐξ ὑμῶν
  choice: E chi di voi
  rationale: La costruzione significa idiomaticamente «chi fra voi». δέ ha qui un valore connettivo leggero, reso naturalmente con «E».
- source_word: μεριμνῶν
  choice: con il suo preoccuparsi
  rationale: Il participio indica l'essere in ansia o il preoccuparsi; questa formulazione conserva il probabile valore di mezzo senza risultare artificiosa in italiano.
- source_word: δύναται προσθεῖναι
  choice: può aggiungere
  rationale: Rende direttamente l'idea di capacità espressa da δύναται e l'immagine concreta di aggiunta espressa da προσθεῖναι.
- source_word: ἐπὶ τὴν ἡλικίαν αὐτοῦ
  choice: alla durata della propria vita
  rationale: ἡλικία può riferirsi all'età o alla durata della vita, oltre che alla statura. Nel contesto dell'ansia per la vita, «durata della propria vita» esprime bene una delle letture principali; l'altra è conservata in nota.
- source_word: πῆχυν ἕνα
  choice: un solo cubito
  rationale: Il cubito è la misura letterale impiegata nel testo. Mantenerla conserva la metafora concreta di una lunghezza aggiunta, senza convertirla in un'unità moderna.
- source_word: αὐτοῦ
  choice: propria
  rationale: Il possessivo riflessivo italiano si riferisce naturalmente al soggetto generico «chi» e comunica che si tratta della vita della persona stessa, senza introdurre un genere non richiesto dall'italiano.
theological_decisions:
- issue: Senso di ἡλικία nel detto
  choice: durata della propria vita
  alternative: propria statura
  rationale: Il contesto dell'ansia e della cura di Dio per la vita favorisce il senso di durata della vita; tuttavia «statura» è lessicalmente possibile e si accorda in modo più immediato con la misura del cubito. La nota preserva questa reale ambiguità senza risolverla tacitamente.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. La domanda retorica resta lineare; «un solo cubito» conserva l'immagine antica, mentre la nota rende trasparente l'ambiguità del testo greco.
