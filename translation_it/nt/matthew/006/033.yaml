id: MAT.6.33
reference: Matthew 6:33
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ζητεῖτε δὲ πρῶτον τὴν ⸀βασιλείαν καὶ τὴν δικαιοσύνην αὐτοῦ, καὶ ταῦτα πάντα προστεθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/033.yaml
  text: But seek first his kingdom and his righteousness[a], and all these things will be added to you.
translation:
  language: it
  text: Ma cercate prima il suo regno e la sua giustizia[a], e tutte queste cose vi saranno aggiunte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «rettitudine». Il termine greco può indicare ciò che è giusto davanti a Dio, la condotta conforme alla sua volontà e anche la giustizia.
    reason: Alternativa lessicale che conserva l’ampiezza semantica di δικαιοσύνη.
lexical_decisions:
- source_word: ζητεῖτε
  choice: cercate
  rationale: L’imperativo presente plurale esprime una ricerca attiva e continuativa; in italiano «cercate» è conciso e naturale, senza dover esplicitare l’aspetto durativo.
- source_word: δὲ
  choice: ma
  rationale: Segna il contrasto con l’affanno e con la ricerca dei bisogni materiali menzionati nel contesto precedente.
- source_word: πρῶτον
  choice: prima
  rationale: Conserva sia il valore lessicale sia l’idea di priorità, senza ampliare il testo con una parafrasi.
- source_word: βασιλείαν
  choice: regno
  rationale: «Regno» è la resa italiana consolidata e può comprendere sia il dominio regale di Dio sia la realtà sottoposta al suo governo.
- source_word: δικαιοσύνην
  choice: giustizia
  rationale: In italiano «giustizia» è la resa tradizionale e ampia di δικαιοσύνη e può indicare sia ciò che è giusto davanti a Dio sia la condotta conforme alla sua volontà; una nota conserva l’alternativa «rettitudine».
- source_word: αὐτοῦ
  choice: suo
  rationale: Mantiene il pronome greco senza sostituirlo interpretativamente con «di Dio»; il referente è Dio, il Padre, nel contesto.
- source_word: ταῦτα πάντα
  choice: tutte queste cose
  rationale: Il dimostrativo rinvia ai beni necessari appena menzionati, cioè cibo, bevanda e vestiario.
- source_word: προστεθήσεται
  choice: vi saranno aggiunte
  rationale: La forma futura passiva e il senso di aggiunta sono conservati direttamente, senza trasformare il verbo nel più interpretativo «saranno provvedute».
- source_word: ὑμῖν
  choice: vi
  rationale: Il pronome dativo italiano rende in modo naturale il destinatario dell’aggiunta.
theological_decisions:
- issue: Resa di δικαιοσύνη
  choice: giustizia
  alternative: rettitudine
  rationale: «Giustizia» mantiene la terminologia biblica italiana e la possibile ampiezza del termine, che comprende il giusto rapporto con Dio e una condotta conforme alla sua volontà, senza limitarlo alla sola giustizia giudiziaria o sociale. «Rettitudine» è indicata in nota come alternativa lessicale.
- issue: Referente di αὐτοῦ
  choice: suo
  alternative: di Dio
  rationale: Il pronome viene mantenuto come nel greco, evitando un’esplicitazione non necessaria; dal contesto il referente è Dio, il Padre.
translation_notes:
  register: Italiano moderno, chiaro e dignitoso. La formulazione conserva la struttura compatta del greco e il contrasto con i versetti precedenti; «vi saranno aggiunte» mantiene deliberatamente l’immagine dell’aggiunta.
