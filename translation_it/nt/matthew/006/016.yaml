source:
  edition: SBLGNT
  text: Ὅταν δὲ νηστεύητε, μὴ γίνεσθε ⸀ὡς οἱ ὑποκριταὶ σκυθρωποί, ἀφανίζουσιν γὰρ τὰ πρόσωπα αὐτῶν ὅπως φανῶσιν τοῖς ἀνθρώποις νηστεύοντες· ἀμὴν λέγω ⸀ὑμῖν, ἀπέχουσιν τὸν μισθὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/016.yaml
  text: And whenever you fast[a], do not become gloomy like the hypocrites, for they disfigure their faces so that they may appear to people to be fasting. Truly I say to you, they have received their reward in full.
translation:
  language: it
  text: 'E quando digiunate, non assumete un’aria cupa come gli ipocriti, perché si sfigurano il volto per mostrarsi alla gente mentre digiunano. In verità vi dico: hanno ricevuto per intero la loro ricompensa.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὅταν δὲ νηστεύητε
  choice: E quando digiunate
  rationale: Ὅταν con il congiuntivo presenta una circostanza ricorrente o generale; in italiano «quando» è naturale e conserva tale valore. δέ collega questa istruzione alle precedenti senza esprimere un forte contrasto.
- source_word: μὴ γίνεσθε ... σκυθρωποί
  choice: non assumete un’aria cupa
  rationale: La resa idiomatica conserva la sfumatura ingressiva di γίνεσθε e riferisce σκυθρωποί all’aspetto visibilmente triste o tetro adottato intenzionalmente.
- source_word: ὡς οἱ ὑποκριταί
  choice: come gli ipocriti
  rationale: Rende in modo diretto e corrente il paragone introdotto da ὡς.
- source_word: ἀφανίζουσιν γὰρ τὰ πρόσωπα αὐτῶν
  choice: perché sfigurano il loro volto
  rationale: ἀφανίζω indica qui l’alterazione o il deliberato imbruttimento dell’aspetto; «sfigurano» conserva l’immagine concreta di πρόσωπα senza specificare il metodo.
- source_word: ὅπως φανῶσιν τοῖς ἀνθρώποις νηστεύοντες
  choice: per far vedere alla gente che digiunano
  rationale: Esprime lo scopo introdotto da ὅπως e il valore di φανῶσιν. «Alla gente» rende naturalmente il senso generale di τοῖς ἀνθρώποις, senza limitarlo agli uomini maschi.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: In verità vi dico
  rationale: Formula italiana dignitosa e consolidata che mantiene la solennità e l’autorità dell’espressione semitica trasmessa dal greco.
- source_word: ἀπέχουσιν τὸν μισθὸν αὐτῶν
  choice: hanno già ricevuto per intero la loro ricompensa
  rationale: ἀπέχω ha qui valore commerciale di quietanza o pagamento completo. «Già» esplicita la compiutezza implicita nell’idioma, mentre «per intero» segnala che non resta altro da ricevere.
theological_decisions:
- issue: Senso generale di τοῖς ἀνθρώποις
  choice: alla gente
  alternative: agli uomini
  rationale: Nel contesto ἄνθρωποι indica le persone in generale. «Alla gente» comunica questo referente collettivo nel moderno italiano senza introdurre una restrizione di genere assente dall’intenzione del testo.
- issue: Portata di ἀπέχουσιν τὸν μισθὸν αὐτῶν
  choice: hanno già ricevuto per intero la loro ricompensa
  alternative: hanno la loro ricompensa
  rationale: 'La resa mantiene l’idioma del pagamento completo e la tensione del passo: il riconoscimento umano cercato costituisce tutta la ricompensa ricevuta, senza aggiungere una formulazione dottrinale ulteriore.'
- issue: Natura dell’alterazione del volto
  choice: sfigurano il loro volto
  alternative: trascurano il loro aspetto
  rationale: Il testo non specifica come venga alterato l’aspetto. La scelta conserva l’immagine forte ma lascia aperto se si tratti di trascuratezza, espressione afflitta o altra modificazione visibile.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. «Assumete un’aria cupa» evita la rigidità di «diventate cupi» e comunica una posa esteriore deliberata; «alla gente» è inclusivo nel senso lessicale ordinario, non ideologico. Nessuna nota è necessaria, quindi il testo non contiene marcatori.
