revisions:
- from: 'E quando digiunate, non assumete un’aria cupa come gli ipocriti, perché sfigurano il loro volto per far vedere alla gente che digiunano. In verità vi dico: hanno già ricevuto per intero la loro ricompensa.'
  to: 'E quando digiunate, non assumete un’aria cupa come gli ipocriti, perché si sfigurano il volto per mostrarsi alla gente mentre digiunano. In verità vi dico: hanno ricevuto per intero la loro ricompensa.'
  rationale: 'La revisione limita l’intervento a due punti: rende più fedelmente il valore di «apparire agli altri» nella proposizione di scopo e migliora l’idiomaticità italiana della descrizione del volto alterato. Omette «già», poiché «hanno ricevuto per intero» esprime già in modo sufficiente l’idioma di pagamento completo senza aggiunta esplicativa.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:43:30Z'
review_pass:
  verdict: revise
  source_fidelity: La resa riproduce bene la struttura dell’esortazione, il paragone con gli ipocriti e l’idioma conclusivo di ἀπέχουσιν τὸν μισθὸν αὐτῶν. Tuttavia, «per far vedere alla gente che digiunano» attribuisce loro più direttamente l’azione di mostrare qualcosa, mentre φανῶσιν esprime lo scopo di apparire/essere riconosciuti dagli altri come persone che digiunano. Una formulazione riflessiva conserva meglio tale prospettiva.
  naturalness: Il registro è italiano standard moderno, chiaro e dignitoso. «Si sfigurano il volto» è più idiomatico di «sfigurano il loro volto» nel descrivere un’alterazione deliberata del proprio aspetto.
  terminology: «Ipocriti», «digiunate», «In verità vi dico» e «ricompensa» sono appropriati. «Gente» rende senza difficoltà il valore generico di τοῖς ἀνθρώποις. Non sono necessarie note.
  issues:
  - severity: medium
    issue: La proposizione finale «per far vedere alla gente che digiunano»
    rationale: Il greco ὅπως φανῶσιν τοῖς ἀνθρώποις νηστεύοντες mira al loro apparire agli altri come digiunanti. «Per mostrarsi alla gente mentre digiunano» conserva sia lo scopo sia questa focalizzazione sul soggetto che appare.
  - severity: low
    issue: «sfigurano il loro volto»
    rationale: Benché comprensibile, la costruzione con possessivo è meno naturale in italiano per una parte del corpo appartenente al soggetto. La forma riflessiva conserva il senso senza precisare il modo dell’alterazione.
  revised_text: 'E quando digiunate, non assumete un’aria cupa come gli ipocriti, perché si sfigurano il volto per mostrarsi alla gente mentre digiunano. In verità vi dico: hanno ricevuto per intero la loro ricompensa.'
