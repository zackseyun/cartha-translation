id: MAT.6.25
reference: Matthew 6:25
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Διὰ τοῦτο λέγω ὑμῖν· μὴ μεριμνᾶτε τῇ ψυχῇ ὑμῶν τί ⸀φάγητε, μηδὲ τῷ σώματι ὑμῶν τί ἐνδύσησθε· οὐχὶ ἡ ψυχὴ πλεῖόν ἐστι τῆς τροφῆς καὶ τὸ σῶμα τοῦ ἐνδύματος;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/025.yaml
  text: Therefore I tell you[a], do not worry about your life, what you will eat, or about your body, what you will wear. Is not life more than food, and the body than clothing?
translation:
  language: it
  text: 'Perciò vi dico: non preoccupatevi per la vostra vita[a] di ciò che mangerete, né per il vostro corpo di ciò che indosserete. La vita non vale forse più del cibo e il corpo più del vestito?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oppure «anima»; qui, però, il contesto del mangiare e del vestirsi favorisce «vita» per ψυχή.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Perciò
  rationale: Introduce in modo naturale l'inferenza tratta dall'insegnamento precedente e conserva il nesso logico.
- source_word: μεριμνᾶτε
  choice: non preoccupatevi
  rationale: Esprime l'idea di un'affannosa preoccupazione in italiano moderno e accessibile, senza condannare ogni forma di premura responsabile.
- source_word: ψυχῇ / ψυχὴ
  choice: vita
  rationale: Nel contesto del mangiare e delle necessità materiali, ψυχή indica la vita della persona, non specificamente l'anima immateriale.
- source_word: τί φάγητε
  choice: di ciò che mangerete
  rationale: Rende naturalmente l'interrogativa indiretta con orientamento futuro dopo il verbo della preoccupazione.
- source_word: σώματι / σῶμα
  choice: corpo
  rationale: Designa il corpo fisico in relazione al vestirsi e al vestito.
- source_word: τί ἐνδύσησθε
  choice: di ciò che indosserete
  rationale: È una resa italiana corrente del vestirsi, più naturale del letterale «metterete addosso».
- source_word: οὐχὶ
  choice: non ... forse
  rationale: Segnala una domanda retorica che si attende una risposta affermativa, secondo un costrutto italiano idiomatico.
- source_word: πλεῖόν
  choice: vale ... più
  rationale: Nel paragone retorico esprime una superiorità di valore o importanza; «vale più» rende chiaramente il senso senza ridurlo alla sola quantità.
- source_word: τροφῆς
  choice: cibo
  rationale: Indica ciò che nutre e sostiene la vita; «cibo» è diretto e comune.
- source_word: ἐνδύματος
  choice: vestito
  rationale: Termine collettivo e naturale per ciò che copre il corpo; mantiene il parallelismo con «cibo».
theological_decisions:
- issue: Senso di ψυχή nell'insegnamento di Gesù
  choice: «vita»
  alternative: «anima»
  rationale: Il contesto immediato riguarda il mangiare, il corpo e il vestirsi; «vita» conserva il riferimento concreto alla persona vivente ed evita di imporre una distinzione antropologica che il versetto non specifica.
- issue: Portata del divieto espresso da μεριμνάω
  choice: «non preoccupatevi» come divieto dell'ansiosa preoccupazione
  alternative: «non abbiate alcuna cura»
  rationale: Il verbo qui riguarda l'affanno per le necessità della vita; la resa scelta non trasforma il detto in un rifiuto assoluto della previdenza o della responsabilità.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. La formulazione conserva la struttura parallela del greco e la forza della domanda retorica, evitando sia arcaismi sia un registro colloquiale.
