review_pass:
  verdict: approve
  source_fidelity: La resa conserva l’imperativo presente esortativo («Accumulate»), il contrasto di δέ («invece»), il dativo di vantaggio («per voi»), il plurale «tesori» e la metafora non interpretata «in cielo». «Tignola», «deterioramento» e «distruggono» riflettono adeguatamente σής, βρῶσις e ἀφανίζει. «Fanno breccia» rende in modo idiomatico διορύσσουσιν senza cancellare l’immagine concreta, chiarita dalla nota.
  naturalness: L’italiano è standard, scorrevole e di registro appropriato. «Il deterioramento» è una scelta astratta ma comprensibile e funzionale a mantenere l’ampiezza semantica discussa di βρῶσις; il parallelismo della frase resta chiaro.
  terminology: «Tesori in cielo» conserva il linguaggio tradizionale e la sua apertura metaforica, senza introdurre interpretazioni dottrinali. La nota su «ruggine» segnala correttamente un’alternativa lessicale, e la nota su «fanno breccia» spiega in modo sobrio il riferimento storico-culturale.
