id: MAT.6.20
reference: Matthew 6:20
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: θησαυρίζετε δὲ ὑμῖν θησαυροὺς ἐν οὐρανῷ, ὅπου οὔτε σὴς οὔτε βρῶσις ἀφανίζει, καὶ ὅπου κλέπται οὐ διορύσσουσιν οὐδὲ κλέπτουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/020.yaml
  text: But store up for yourselves treasures in heaven[a], where neither moth nor decay destroys[b], and where thieves do not break in and steal.
translation:
  language: it
  text: Accumulate invece per voi tesori in cielo, dove né la tignola né il deterioramento[a] distruggono e dove i ladri non fanno breccia[b] né rubano.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oppure «ruggine». Il termine greco può indicare più in generale ciò che consuma o corrode.
    reason: lexical_alternative
  - marker: b
    text: Alla lettera «scavano attraverso», probabilmente con riferimento ai ladri che aprivano un varco nelle pareti di una casa.
    reason: cultural_note
lexical_decisions:
- source_word: θησαυρίζετε
  choice: Accumulate
  rationale: L’imperativo presente esorta a un’azione continuativa. «Accumulate» è moderno e conserva l’immagine del mettere insieme tesori.
- source_word: δὲ
  choice: invece
  rationale: Esprime il contrasto con il divieto del versetto precedente in modo naturale in italiano.
- source_word: ὑμῖν
  choice: per voi
  rationale: Rende il dativo di vantaggio senza appesantire la frase; nel contesto ha valore riflessivo, cioè «per voi stessi».
- source_word: θησαυροὺς
  choice: tesori
  rationale: Conserva il plurale greco e la metafora centrale del contesto.
- source_word: ἐν οὐρανῷ
  choice: in cielo
  rationale: È la resa italiana naturale del locativo singolare e non interpreta ulteriormente la metafora.
- source_word: σὴς
  choice: tignola
  rationale: Indica l’insetto che rovina indumenti e altri beni conservati.
- source_word: βρῶσις
  choice: deterioramento
  rationale: Il termine può indicare il consumo o ciò che consuma. «Deterioramento» mantiene un senso più ampio della sola ossidazione.
- source_word: ἀφανίζει
  choice: distruggono
  rationale: Rende chiaramente l’idea di far perire o scomparire. Il plurale è richiesto dal naturale accordo italiano con i due soggetti coordinati.
- source_word: κλέπται
  choice: ladri
  rationale: Equivalente italiano diretto del sostantivo plurale.
- source_word: διορύσσουσιν
  choice: fanno breccia
  rationale: Comunica il forzare un accesso e conserva in parte l’immagine concreta dell’aprire un varco, senza risultare innaturale.
- source_word: κλέπτουσιν
  choice: rubano
  rationale: Resa semplice e diretta del verbo.
theological_decisions:
- issue: Natura dei «tesori in cielo»
  choice: La metafora «tesori in cielo» è conservata senza spiegazione interpretativa.
  alternative: ricompense celesti; ricchezze spirituali
  rationale: Il testo non definisce qui la natura dei tesori; esplicitarla introdurrebbe una particolare dottrina della ricompensa o del merito.
- issue: Portata di βρῶσις nel contrasto con il tesoro celeste
  choice: deterioramento
  alternative: ruggine; corrosione; consumo
  rationale: La resa ampia evita di limitare il riferimento ai metalli e conserva il contrasto generale fra beni terreni deperibili e tesori celesti.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. La sintassi mantiene il parallelismo del greco; «invece» esplicita il contrasto contestuale senza appesantire l’inizio del versetto. I marcatori delle note sono collocati accanto alle espressioni cui si riferiscono.
