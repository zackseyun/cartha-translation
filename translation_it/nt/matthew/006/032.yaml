  variant: modern standard Italian
source:
  edition: SBLGNT
  text: πάντα γὰρ ταῦτα τὰ ἔθνη ⸀ἐπιζητοῦσιν· οἶδεν γὰρ ὁ πατὴρ ὑμῶν ὁ οὐράνιος ὅτι χρῄζετε τούτων ἁπάντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/032.yaml
  text: For the Gentiles eagerly seek all these things; for your heavenly Father knows that you need all these things.
translation:
  language: it
  text: Infatti, le genti[a] cercano con insistenza[b] tutte queste cose; infatti il vostro Padre celeste sa che avete bisogno di tutte queste cose.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «i pagani», «le nazioni» oppure «i non ebrei». Il termine greco può indicare in generale le nazioni, ma qui probabilmente designa quanti non appartengono al popolo dell’alleanza.
    reason: alternative_reading
  - marker: b
    text: O «cercano» oppure «ricercano». Il verbo può suggerire una ricerca intensa o persistente.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἔθνη
  choice: le genti
  rationale: Conserva il riferimento storico ai popoli non ebrei e la possibile sfumatura religiosa senza introdurre nel testo principale il tono potenzialmente spregiativo di «pagani». La nota esplicita le alternative.
- source_word: ἐπιζητοῦσιν
  choice: cercano con insistenza
  rationale: Rende in italiano naturale la ricerca intensa o persistente espressa da ἐπιζητέω, senza spingersi fino a «si affannano», che importerebbe più direttamente il linguaggio del contesto precedente.
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: il Padre vostro celeste
  rationale: Riproduce in modo naturale sia il possessivo sia la qualificazione celeste della costruzione greca.
- source_word: οἶδεν
  choice: sa
  rationale: οἶδα ha forma di perfetto ma valore presente; «sa» è la resa italiana diretta e idiomatica.
- source_word: χρῄζετε
  choice: avete bisogno
  rationale: È una resa moderna e chiara del bisogno indicato dal verbo greco.
- source_word: πάντα ... ταῦτα / τούτων ἁπάντων
  choice: tutte queste cose ... tutte queste cose
  rationale: Mantiene la ripetizione enfatica presente nel greco, anziché sostituire la seconda occorrenza con un pronome.
- source_word: γὰρ ... γὰρ
  choice: infatti ... infatti
  rationale: Conserva entrambi i connettivi esplicativi del testo greco e il loro rapporto argomentativo con il contesto.
theological_decisions:
- issue: Referente di τὰ ἔθνη nell'insegnamento di Gesù
  choice: le genti
  alternative: i pagani; le nazioni; i non ebrei
  rationale: «Le genti» mantiene il contrasto storico tra i discepoli e i popoli esterni a Israele, ma non trasforma tale contrasto in un giudizio morale assoluto. La formulazione lascia visibile l'ampiezza semantica del greco.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. La dislocazione iniziale di «Tutte queste cose» conserva l'enfasi e l'ordine informativo del greco; la ripetizione di «infatti» riflette il doppio γάρ, pur producendo una cadenza volutamente più formale.
