id: MAT.6.24
reference: Matthew 6:24
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Οὐδεὶς δύναται δυσὶ κυρίοις δουλεύειν· ἢ γὰρ τὸν ἕνα μισήσει καὶ τὸν ἕτερον ἀγαπήσει, ἢ ἑνὸς ἀνθέξεται καὶ τοῦ ἑτέρου καταφρονήσει. οὐ δύνασθε θεῷ δουλεύειν καὶ μαμωνᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/024.yaml
  text: No one is able to serve two masters[a], for either he will hate the one and love the other, or he will be devoted to one and despise the other. You are not able to serve God and mammon.
translation:
  language: it
  text: 'Nessuno può servire due padroni: infatti, o odierà l’uno e amerà l’altro, oppure si attaccherà all’uno e disprezzerà l’altro. Non potete servire Dio e mammona.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oppure «la ricchezza» o «il denaro». Il greco conserva il prestito «mammona», che può personificare le ricchezze come un padrone rivale.
    reason: Alternativa lessicale e chiarimento della personificazione implicita nel prestito.
lexical_decisions:
- source_word: Οὐδεὶς
  choice: Nessuno
  rationale: Rende direttamente il pronome negativo universale con una forma naturale e dignitosa nell’italiano moderno.
- source_word: δύναται / δύνασθε
  choice: può / non potete
  rationale: Il verbo esprime capacità o possibilità; la normale costruzione italiana con «potere» conserva chiaramente l’impossibilità affermata nel versetto.
- source_word: δυσὶ κυρίοις
  choice: due padroni
  rationale: Nel contesto del verbo δουλεύειν, κύριοι indica coloro ai quali un servo è soggetto. «Padroni» comunica questo rapporto e non suggerisce qui il titolo divino «Signore».
- source_word: δουλεύειν
  choice: servire
  rationale: «Servire due padroni» è idiomatico in italiano e, insieme a «padroni», mantiene l’immagine del servizio vincolante propria del verbo greco.
- source_word: μισήσει
  choice: odierà
  rationale: Conserva senza attenuarla l’antitesi netta del testo con «amerà»; una resa come «amerà meno» risolverebbe un possibile sfondo comparativo non esplicitato dal greco.
- source_word: ἀγαπήσει
  choice: amerà
  rationale: Resa diretta che mantiene il contrasto centrale con «odierà».
- source_word: ἑνὸς ἀνθέξεται
  choice: si attaccherà all’uno
  rationale: ἀντέχομαι esprime il tenersi saldamente a qualcuno o l’aderirvi. «Si attaccherà» conserva l’immagine relazionale senza ridurla alla sola lealtà astratta.
- source_word: καταφρονήσει
  choice: disprezzerà
  rationale: Riproduce la forza del verbo, che indica trattare qualcuno con disprezzo, e forma un’antitesi efficace con «si attaccherà».
- source_word: θεῷ
  choice: Dio
  rationale: È la resa italiana ordinaria del referente divino, oggetto del verbo «servire».
- source_word: μαμωνᾷ
  choice: mammona
  rationale: Si conserva il prestito semitico trasmesso dal greco, così da mantenere la forza quasi personificata di un padrone rivale; il significato lessicale viene chiarito in nota.
theological_decisions:
- issue: Resa di κύριος in un contesto sociale non divino
  choice: padroni
  alternative: signori
  rationale: Il plurale, unito all’immagine del servizio servile, indica padroni umani o possessori. «Padroni» rende il senso contestuale e distingue questi referenti da Dio nella frase conclusiva.
- issue: Resa di μαμωνᾶς
  choice: mammona
  alternative: ricchezza / denaro
  rationale: Il detto contrappone Dio e μαμωνᾶς come oggetti rivali di servizio. Conservare il prestito mantiene questa personificazione e non riduce l’affermazione a un riferimento puramente materiale; la nota offre le equivalenze esplicative.
- issue: Forza dell’antitesi μισήσει / ἀγαπήσει
  choice: odierà / amerà
  alternative: amerà meno / amerà
  rationale: La formulazione greca presenta un’antitesi forte, ulteriormente parallela a «si attaccherà / disprezzerà». La traduzione non attenua «odiare» sulla base di un possibile valore comparativo semitico.
translation_notes:
  register: Italiano standard moderno, conciso e solenne senza arcaismi. La struttura antitetica e il parallelismo dell’originale sono conservati. Il marcatore [a] è collocato dopo «mammona», il termine cui si riferisce la nota.
