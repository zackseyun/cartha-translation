  text: καὶ περὶ ἐνδύματος τί μεριμνᾶτε; καταμάθετε τὰ κρίνα τοῦ ἀγροῦ πῶς ⸂αὐξάνουσιν· οὐ κοπιῶσιν οὐδὲ νήθουσιν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/028.yaml
  text: 'And why are you anxious about clothing? Consider the lilies of the field[a], how they grow: they do not labor[c][b], nor do they spin.'
translation:
  language: it
  text: 'E perché vi preoccupate per il vestito? Osservate attentamente i gigli dei campi[a], come crescono: non faticano né filano.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «i fiori selvatici dei campi».'
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ ἐνδύματος
  choice: del vestito
  rationale: Il singolare indica qui il vestiario come categoria generale; «del vestito» è naturale in italiano e conserva il singolare greco senza riferirsi a un capo specifico.
- source_word: τί μεριμνᾶτε
  choice: perché vi preoccupate
  rationale: In questa domanda τί ha valore causale («perché»), mentre μεριμνάω esprime una preoccupazione ansiosa per le necessità materiali.
- source_word: καταμάθετε
  choice: osservate attentamente
  rationale: L'imperativo invita a un'osservazione attenta dalla quale trarre comprensione; questa resa comunica meglio tale forza rispetto al semplice «considerate».
- source_word: τὰ κρίνα τοῦ ἀγροῦ
  choice: i gigli dei campi
  rationale: κρίνα designa primariamente i gigli, pur potendo forse riferirsi più in generale ai fiori spontanei; «dei campi» è un'espressione italiana naturale per τοῦ ἀγροῦ.
- source_word: πῶς αὐξάνουσιν
  choice: come crescono
  rationale: αὐξάνω descrive qui la crescita naturale delle piante.
- source_word: οὐ κοπιῶσιν
  choice: non faticano
  rationale: κοπιάω indica il lavorare con fatica; «faticano» mantiene la concisione e distingue questa attività dal filare menzionato subito dopo.
- source_word: οὐδὲ νήθουσιν
  choice: e non filano
  rationale: νήθω significa filare fibre o filo. «E non» rende naturalmente in italiano la progressione negativa espressa da οὐδέ.
theological_decisions:
- issue: Valore di μεριμνάω nell'insegnamento di Gesù sulla provvidenza
  choice: vi preoccupate
  alternative: siete in ansia
  rationale: «Vi preoccupate» è corrente e comprende la cura ansiosa contestata nel contesto, senza suggerire che qualsiasi attenzione pratica al vestiario sia condannata.
- issue: Identificazione di τὰ κρίνα
  choice: i gigli
  alternative: i fiori selvatici
  rationale: Il significato lessicale primario è «gigli»; la possibile estensione ad altri fiori spontanei viene conservata in nota senza risolvere oltre l'evidenza l'identificazione botanica.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. La domanda conserva il collegamento con il contesto tramite «E»; il parallelismo finale è breve e naturale.
