id: MAT.6.8
reference: Matthew 6:8
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: μὴ οὖν ὁμοιωθῆτε αὐτοῖς, οἶδεν γὰρ ⸀ὁ πατὴρ ὑμῶν ὧν χρείαν ἔχετε πρὸ τοῦ ὑμᾶς αἰτῆσαι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/008.yaml
  text: Therefore[a], do not become like them, for your Father knows what you need before you ask him.
translation:
  language: it
  text: Non diventate dunque[a] come loro, perché il Padre vostro sa di che cosa avete bisogno prima che glielo chiediate.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «Non siate dunque come loro»; più letteralmente: «Non siate resi simili a loro».'
    reason: Alternativa lessicale che riflette la forma passiva di ὁμοιωθῆτε e la possibile sfumatura statica del verbo.
lexical_decisions:
- source_word: μὴ οὖν
  choice: Non ... dunque
  rationale: La costruzione mantiene sia il divieto espresso da μή sia il valore inferenziale di οὖν, collegando il versetto all’avvertimento precedente.
- source_word: ὁμοιωθῆτε
  choice: diventate ... come
  rationale: L’aoristo congiuntivo passivo compare in un divieto. «Non diventate come» esprime in italiano corrente l’idea di conformarsi al loro modello, mentre la nota conserva le alternative più statiche o formali.
- source_word: αὐτοῖς
  choice: loro
  rationale: Il pronome rinvia alle persone menzionate nel contesto immediatamente precedente; non è necessario esplicitare il referente.
- source_word: οἶδεν
  choice: sa
  rationale: Benché οἶδα abbia forma di perfetto, qui ha normale valore presente.
- source_word: ὁ πατὴρ ὑμῶν
  choice: il Padre vostro
  rationale: Riproduce il testo greco senza aggiungere «celeste», assente in questo versetto.
- source_word: ὧν χρείαν ἔχετε
  choice: di che cosa avete bisogno
  rationale: È una resa naturale e precisa della costruzione greca che indica ciò di cui i discepoli hanno necessità.
- source_word: πρὸ τοῦ ὑμᾶς αἰτῆσαι αὐτόν
  choice: prima che glielo chiediate
  rationale: πρὸ τοῦ con l’infinito indica anteriorità temporale. «Glielo chiediate» rende in modo idiomatico il riferimento al Padre e a ciò di cui si ha bisogno.
theological_decisions:
- issue: La conoscenza divina precedente alla preghiera
  choice: Affermare direttamente che il Padre conosce i bisogni prima che gli siano presentati.
  alternative: Aggiungere una spiegazione secondo cui la preghiera sarebbe relazionale e non informativa, oppure formulare il testo con terminologia dottrinale sulla prescienza divina.
  rationale: Il versetto afferma la conoscenza previa del Padre, ma non spiega perché si debba comunque pregare. La traduzione conserva questa tensione senza risolverla mediante aggiunte interpretative.
translation_notes:
  register: Italiano standard moderno, naturale e dignitoso. L’ordine «il Padre vostro» mantiene un tono biblico comprensibile senza risultare arcaico; «glielo chiediate» evita una costruzione rigida e rende esplicito in modo idiomatico il rapporto tra il bisogno e la richiesta.
