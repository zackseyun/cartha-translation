id: MAT.6.10
reference: Matthew 6:10
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ἐλθέτω ἡ βασιλεία σου, γενηθήτω τὸ θέλημά σου, ὡς ἐν οὐρανῷ καὶ ⸀ἐπὶ γῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/010.yaml
  text: May your kingdom come; may your will be done[a], as in heaven, so also on earth.
translation:
  language: it
  text: Venga il tuo regno; sia fatta la tua volontà[a], come in cielo, così anche sulla terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure, forse: «Venga il tuo regno; sia fatta la tua volontà, come in cielo, così anche sulla terra», intendendo «come in cielo, così anche sulla terra» in riferimento a entrambe le suppliche.'
    reason: L’espressione comparativa greca può essere collegata soltanto alla supplica più vicina oppure essere intesa come riferita a entrambe.
lexical_decisions:
- source_word: ἐλθέτω
  choice: Venga
  rationale: L’imperativo aoristo attivo di terza persona esprime una supplica rivolta a Dio; «Venga» è naturale nel registro della preghiera italiana e ne conserva la forza volitiva.
- source_word: βασιλεία
  choice: regno
  rationale: Il termine può indicare sia il regno sia l’atto di regnare. «Regno» è la resa italiana consolidata e adatta al contesto matteano, senza escludere il senso dinamico della sovranità di Dio.
- source_word: γενηθήτω
  choice: sia fatta
  rationale: L’imperativo aoristo passivo di γίνομαι, unito a θέλημα, indica che la volontà di Dio sia attuata o si realizzi. «Sia fatta» è idiomatico, fedele e dignitoso.
- source_word: θέλημα
  choice: volontà
  rationale: Rende ciò che Dio vuole, desidera o si propone, mantenendo l’ampiezza semantica e il rilievo teologico del greco.
- source_word: ὡς
  choice: come
  rationale: Introduce il paragone in modo conciso e naturale, senza precisarne più del testo greco la portata sintattica.
- source_word: ἐν οὐρανῷ
  choice: in cielo
  rationale: Il singolare con ἐν è reso naturalmente con «in cielo», in contrasto con «sulla terra».
- source_word: καὶ
  choice: così anche
  rationale: Nella correlazione ὡς ... καί, «come ... così anche» esplicita in italiano il parallelismo comparativo senza aggiungere un contenuto estraneo.
- source_word: ἐπὶ γῆς
  choice: sulla terra
  rationale: ἐπί con il genitivo esprime qui la collocazione «sopra/sulla»; «sulla terra» è la formulazione italiana naturale nel contrasto cielo-terra.
theological_decisions:
- issue: Portata della frase comparativa ὡς ἐν οὐρανῷ καὶ ἐπὶ γῆς
  choice: Nel testo principale la frase è collegata alla supplica più vicina, «sia fatta la tua volontà».
  alternative: 'La frase «come in cielo, così anche sulla terra» può essere intesa come riferita a entrambe le suppliche: «venga il tuo regno» e «sia fatta la tua volontà».'
  rationale: La punteggiatura delle edizioni greche moderne è editoriale. Il collegamento immediato con la seconda supplica è grammaticalmente naturale, ma la sintassi permette una portata più ampia; la nota conserva questa autentica ambiguità senza risolverla in modo dogmatico.
translation_notes:
  register: Italiano moderno standard, naturale e dignitoso, con la forma tradizionale ma ancora corrente della preghiera. Il punto e virgola distingue le due suppliche senza separarle eccessivamente.
