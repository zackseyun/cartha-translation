id: MAT.6.21
reference: Matthew 6:21
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ὅπου γάρ ἐστιν ὁ θησαυρός ⸀σου, ἐκεῖ ἔσται καὶ ἡ καρδία ⸁σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/021.yaml
  text: For where your treasure is[a], there your heart will be also.
translation:
  language: it
  text: Perché dov’è il tuo tesoro, là sarà anche il tuo cuore.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alcune traduzioni rendono la frase al presente: «Perché dov’è il tuo tesoro, là è anche il tuo cuore». Il verbo greco, però, è al futuro: «sarà».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπου
  choice: dove
  rationale: Introduce una proposizione relativa di luogo; «dove» è naturale e conserva la correlazione con «là».
- source_word: γάρ
  choice: perché
  rationale: Mantiene il nesso esplicativo con l’insegnamento precedente sull’accumulare tesori.
- source_word: θησαυρός
  choice: tesoro
  rationale: È l’equivalente italiano usuale e conserva sia il senso concreto sia quello metaforico.
- source_word: σου
  choice: tuo
  rationale: Rende direttamente il genitivo possessivo, riferito sia a «tesoro» sia a «cuore».
- source_word: ἐκεῖ
  choice: là
  rationale: Conserva in forma compatta la correlazione locativa «dove… là».
- source_word: ἔσται
  choice: sarà
  rationale: Riproduce esplicitamente il futuro greco, senza trasformarlo in un presente proverbiale.
- source_word: καρδία
  choice: cuore
  rationale: È la resa tradizionale e semanticamente ampia, capace di includere desideri, lealtà e orientamento interiore.
- source_word: καὶ
  choice: anche
  rationale: Conserva il valore additivo che collega la collocazione del cuore a quella del tesoro.
theological_decisions:
- issue: Valore temporale di ἔσται in una sentenza di carattere sapienziale
  choice: 'Mantenere il futuro esplicito: «sarà»'
  alternative: Usare il presente «è» per formulare un principio generale senza marcatura temporale
  rationale: Il testo greco presenta un futuro. Mantenerlo preserva la possibile dimensione dinamica dell’affermazione — il cuore si troverà là dove si colloca il tesoro — senza escluderne il valore generale.
translation_notes:
  register: Italiano standard moderno, naturale e dignitoso. La struttura parallela «dov’è… là sarà» conserva la concisione e l’enfasi locativa del greco; il futuro evita di appiattire la tensione temporale del testo.
