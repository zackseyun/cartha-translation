id: MAT.6.15
reference: Matthew 6:15
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ἐὰν δὲ μὴ ἀφῆτε τοῖς ⸀ἀνθρώποις, οὐδὲ ὁ πατὴρ ὑμῶν ἀφήσει τὰ παραπτώματα ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/015.yaml
  text: But if you do not forgive people[a], neither will your Father forgive your trespasses.
translation:
  language: it
  text: Ma se non perdonate agli altri, neppure il Padre vostro perdonerà le vostre colpe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oppure «trasgressioni» o «offese».
    reason: Alternativa lessicale per παραπτώματα.
lexical_decisions:
- source_word: ἐὰν δὲ μὴ
  choice: Ma se non
  rationale: ἐάν introduce la condizione, δέ segnala il contrasto con il versetto precedente e μή la nega; «Ma se non» riproduce con naturalezza questa struttura.
- source_word: ἀφῆτε
  choice: perdonate
  rationale: In questo contesto ἀφίημι indica il perdono delle offese interpersonali. «Perdonate» è chiaro e mantiene lo stesso campo semantico del successivo ἀφήσει.
- source_word: τοῖς ἀνθρώποις
  choice: agli altri
  rationale: ἄνθρωποι si riferisce genericamente alle persone, non ai soli maschi. Nel contesto, «agli altri» è l'espressione italiana più naturale e inclusiva, senza cambiare il referente umano.
- source_word: οὐδὲ
  choice: neppure
  rationale: οὐδέ collega in modo negativo ed enfatico la conseguenza alla condizione; «neppure» conserva il parallelismo fra il perdono umano e quello del Padre.
- source_word: ὁ πατὴρ ὑμῶν
  choice: il Padre vostro
  rationale: Il greco dice semplicemente «il Padre vostro»; non si aggiunge «celeste», assente in questo versetto.
- source_word: ἀφήσει
  choice: perdonerà
  rationale: La ripetizione di ἀφίημι è conservata traducendo anche il futuro con lo stesso verbo italiano, così da mantenere la reciprocità formale dell'enunciato.
- source_word: τὰ παραπτώματα ὑμῶν
  choice: le vostre colpe
  rationale: παραπτώματα indica passi falsi, offese o trasgressioni. «Colpe» è naturale nell'italiano moderno, conserva il peso morale del termine e si adatta al contesto del perdono.
theological_decisions:
- issue: Rapporto condizionale fra il perdono umano e il perdono divino
  choice: Mantenere senza attenuazioni la formulazione condizionale diretta.
  alternative: Interpretare il perdono umano soltanto come prova del perdono ricevuto, oppure riferire la conseguenza alla sola comunione con Dio.
  rationale: Il greco presenta una condizione e la relativa conseguenza in termini diretti. La traduzione conserva questa tensione teologica senza risolverla mediante una parafrasi dottrinale.
translation_notes:
  register: Italiano standard moderno, chiaro e dignitoso. «Agli altri» evita che il generico ἀνθρώποις venga inteso come riferito ai soli uomini; «colpe» è più corrente di «falli» e meno tradizionalmente marcato di «debiti».
