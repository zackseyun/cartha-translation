id: MAT.6.7
reference: Matthew 6:7
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Προσευχόμενοι δὲ μὴ βατταλογήσητε ὥσπερ οἱ ἐθνικοί, δοκοῦσιν γὰρ ὅτι ἐν τῇ πολυλογίᾳ αὐτῶν εἰσακουσθήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/007.yaml
  text: And when you pray[a], do not heap up empty words like the Gentiles[b], for they think that they will be heard because of their many words.
translation:
  language: it
  text: E quando pregate, non accumulate parole vuote come i non ebrei[a], perché pensano di essere ascoltati per le loro molte parole.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «i pagani». Il greco indica letteralmente le persone appartenenti alle nazioni, cioè chi è al di fuori del popolo d'Israele.
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσευχόμενοι δὲ
  choice: E quando pregate
  rationale: Il participio ha valore circostanziale e introduce naturalmente l'istruzione; δέ prosegue il discorso senza esprimere un forte contrasto.
- source_word: μὴ βατταλογήσητε
  choice: non accumulate parole vuote
  rationale: Il raro verbo βατταλογέω sembra indicare un parlare vuoto, meccanico o prolisso. La resa conserva sia l'idea dell'eccesso sia quella dell'inconsistenza, senza condannare ogni ripetizione nella preghiera.
- source_word: ὥσπερ οἱ ἐθνικοί
  choice: come i non ebrei
  rationale: Nel contesto giudaico ἐθνικοί indica le persone appartenenti alle nazioni estranee al popolo d'Israele. «Non ebrei» è chiaro nell'italiano corrente e non introduce automaticamente la sfumatura religiosa più interpretativa di «pagani».
- source_word: δοκοῦσιν
  choice: pensano
  rationale: Esprime in modo naturale la loro convinzione o supposizione.
- source_word: ἐν τῇ πολυλογίᾳ αὐτῶν
  choice: per le loro molte parole
  rationale: La preposizione ἐν può qui esprimere il mezzo o il fondamento ritenuto efficace; «per» conserva una certa apertura fra causa e mezzo, mentre πολυλογία indica il parlare molto o la prolissità.
- source_word: εἰσακουσθήσονται
  choice: di essere ascoltati
  rationale: Il passivo indica l'ottenere ascolto favorevole. «Essere ascoltati» evita di esplicitare oltre il testo l'idea di una risposta concessa.
theological_decisions:
- issue: Se Gesù vieti ogni ripetizione nella preghiera oppure il parlare vuoto e prolisso
  choice: «non accumulate parole vuote»
  alternative: «non usate ripetizioni senza senso»; «non farfugliate»
  rationale: La formulazione mantiene la forza del verbo raro e concentra il divieto sulla verbosità vuota usata per ottenere ascolto, senza far dire al testo che ogni preghiera ripetuta sia illecita.
- issue: Identità degli ἐθνικοί
  choice: «i non ebrei» con nota
  alternative: «i pagani»; «le genti»
  rationale: La scelta conserva in primo piano la distinzione fra Israele e le nazioni, mentre la nota segnala l'alternativa religiosa corrente senza imporla nel testo.
translation_notes:
  register: Italiano moderno, chiaro e dignitoso. «Accumulate parole vuote» è volutamente concreto e comprensibile; evita sia l'arcaismo sia una formulazione che potrebbe essere letta come condanna indiscriminata di ogni ripetizione nella preghiera.
