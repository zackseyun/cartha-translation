id: MAT.6.34
reference: Matthew 6:34
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: μὴ οὖν μεριμνήσητε εἰς τὴν αὔριον, ἡ γὰρ αὔριον μεριμνήσει ⸀αὑτῆς· ἀρκετὸν τῇ ἡμέρᾳ ἡ κακία αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/034.yaml
  text: Therefore do not worry about tomorrow[a], for tomorrow will worry about itself. Each day has enough trouble of its own.
translation:
  language: it
  text: Non preoccupatevi dunque del domani, perché il domani si preoccuperà di sé stesso. Ogni giorno ha già abbastanza guai[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «A ogni giorno basta il proprio male». Il termine greco può significare «male», ma qui probabilmente indica i guai, le difficoltà o le avversità della giornata.'
    reason: Alternativa lessicale per κακία e resa più formale della frase conclusiva.
lexical_decisions:
- source_word: μεριμνήσητε
  choice: preoccupatevi
  rationale: Nel contesto di Matteo 6:25-34 il verbo indica una preoccupazione ansiosa. «Preoccuparsi» è naturale nell’italiano moderno e mantiene il legame con il tema ricorrente del brano.
- source_word: εἰς τὴν αὔριον
  choice: del domani
  rationale: Con μεριμνάω la preposizione indica ciò verso cui è rivolta la preoccupazione. «Preoccuparsi del domani» è idiomatico e conserva il riferimento al futuro.
- source_word: ἡ αὔριον
  choice: il domani
  rationale: L’espressione sostantivata presenta il domani come soggetto personificato; l’articolo italiano rende naturalmente tale personificazione.
- source_word: μεριμνήσει αὑτῆς
  choice: si preoccuperà di sé stesso
  rationale: La resa ripete lo stesso verbo della prima proposizione e conserva sia la personificazione sia la forma riflessiva del greco.
- source_word: ἀρκετὸν τῇ ἡμέρᾳ
  choice: Ogni giorno ha già abbastanza
  rationale: La formulazione distributiva rende chiaramente il dativo riferito a ciascun giorno; «ha già abbastanza» esprime in italiano corrente l’idea di sufficienza e sottolinea che non occorre anticipare i pesi futuri.
- source_word: κακία αὐτῆς
  choice: guai
  rationale: In questo detto κακία indica verosimilmente le difficoltà o avversità proprie del giorno. «Guai» comunica con naturalezza questo senso contestuale, mentre la nota conserva l’alternativa più letterale «male».
theological_decisions:
- issue: Senso di κακία nel detto conclusivo sulla preoccupazione
  choice: guai
  alternative: male
  rationale: Il contesto riguarda l’ansia per le difficoltà future, non una definizione morale di ogni giorno. «Guai» rende la forza pratica del detto; la nota segnala però il significato lessicale più ampio e mantiene visibile l’ambiguità del greco.
translation_notes:
  register: Italiano moderno, chiaro e dignitoso. La ripetizione di «preoccuparsi» conserva il parallelismo e l’ironia della personificazione del domani. La frase finale privilegia una costruzione corrente senza eliminare, grazie alla nota, la possibile resa «male».
