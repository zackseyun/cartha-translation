id: MAT.6.2
reference: Matthew 6:2
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Ὅταν οὖν ποιῇς ἐλεημοσύνην, μὴ σαλπίσῃς ἔμπροσθέν σου, ὥσπερ οἱ ὑποκριταὶ ποιοῦσιν ἐν ταῖς συναγωγαῖς καὶ ἐν ταῖς ῥύμαις, ὅπως δοξασθῶσιν ὑπὸ τῶν ἀνθρώπων· ἀμὴν λέγω ὑμῖν, ἀπέχουσιν τὸν μισθὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/002.yaml
  text: Therefore[a], whenever you give alms, do not sound a trumpet before you, as the hypocrites do in the synagogues and in the streets, so that they may be glorified by people. Truly I say to you[e][d][c][b], they have received their reward in full.
translation:
  language: it
  text: 'Perciò, quando fai l’elemosina[a], non suonare la tromba davanti a te[b], come fanno gli ipocriti nelle sinagoghe e nelle strade, per essere glorificati dalla gente[c]. In verità vi dico: hanno già ricevuto per intero la loro ricompensa[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «fai beneficenza» o «doni ai bisognosi». L’espressione greca indica un atto di misericordia compiuto mediante un dono caritatevole.'
    reason: lexical_alternative
  - marker: b
    text: 'Oppure: «non annunciarlo a suon di tromba». Il greco dice letteralmente «non suonare la tromba davanti a te»; l’immagine può essere iperbolica o metaforica.'
    reason: lexical_alternative
  - marker: c
    text: 'Oppure: «per essere lodati» o «onorati dalla gente». Il verbo greco significa letteralmente «essere glorificati».'
    reason: lexical_alternative
  - marker: d
    text: 'L’espressione riflette un uso commerciale: hanno già riscosso integralmente la ricompensa e non resta altro da ricevere.'
    reason: cultural_note
lexical_decisions:
- source_word: Ὅταν οὖν
  choice: Perciò, quando
  rationale: «Quando» introduce in italiano naturale una circostanza generale o ricorrente; «perciò» conserva il collegamento inferenziale o continuativo di οὖν con quanto precede.
- source_word: ποιῇς ἐλεημοσύνην
  choice: fai l’elemosina
  rationale: L’espressione greca indica il fare beneficenza, in particolare donare ai bisognosi. «Fare l’elemosina» è conciso, tradizionale e tuttora comprensibile.
- source_word: μὴ σαλπίσῃς ἔμπροσθέν σου
  choice: non suonare la tromba davanti a te
  rationale: Conserva la vivida immagine letterale del testo senza decidere se sia iperbole, metafora o riferimento a una pratica concreta.
- source_word: οἱ ὑποκριταὶ
  choice: gli ipocriti
  rationale: È l’equivalente italiano corrente e appropriato per chi ostenta la propria devozione allo scopo di farsi notare.
- source_word: ἐν ταῖς συναγωγαῖς καὶ ἐν ταῖς ῥύμαις
  choice: nelle sinagoghe e nelle strade
  rationale: Rende direttamente i luoghi pubblici indicati dal greco; «strade» è più naturale e inclusivo delle possibili sfumature di vie o vicoli.
- source_word: ὅπως δοξασθῶσιν ὑπὸ τῶν ἀνθρώπων
  choice: per essere glorificati dalla gente
  rationale: «Per» esprime lo scopo; «glorificati» mantiene la forza di δοξάζω, mentre «gente» rende ἀνθρώπων in senso genericamente umano.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: In verità vi dico
  rationale: Formula italiana dignitosa e consolidata che mantiene la solennità e l’autorità dell’affermazione.
- source_word: ἀπέχουσιν τὸν μισθὸν αὐτῶν
  choice: hanno già ricevuto per intero la loro ricompensa
  rationale: 'Esplicita il valore commerciale di ἀπέχω: la somma è stata riscossa integralmente e non resta altro da ricevere.'
theological_decisions:
- issue: Forza di δοξασθῶσιν
  choice: essere glorificati dalla gente
  alternative: essere lodati dalla gente
  rationale: La resa più forte conserva la tensione retorica del verbo greco e il contrasto implicito tra approvazione umana e ricompensa divina, senza attenuarlo a semplice elogio.
- issue: Senso generico di ἀνθρώπων
  choice: dalla gente
  alternative: dagli uomini
  rationale: Nel contesto il termine comprende gli osservatori umani in generale, non soltanto i maschi; «gente» ne comunica naturalmente l’estensione.
- issue: Portata idiomatica di ἀπέχουσιν
  choice: hanno già ricevuto per intero
  alternative: hanno la loro ricompensa
  rationale: 'La formulazione conserva l’immagine di una ricevuta o di un pagamento saldato: l’approvazione pubblica costituisce tutta la ricompensa ottenuta, senza introdurre ulteriori specificazioni dottrinali.'
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. La sintassi resta vicina alla struttura greca, ma evita calchi innaturali. L’immagine della tromba e il verbo forte «glorificati» sono mantenuti nel testo; le alternative interpretative sono segnalate nelle note.
