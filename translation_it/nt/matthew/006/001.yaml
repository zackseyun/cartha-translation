id: MAT.6.1
reference: Matthew 6:1
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Προσέχετε ⸀δὲ τὴν ⸀δικαιοσύνην ὑμῶν μὴ ποιεῖν ἔμπροσθεν τῶν ἀνθρώπων πρὸς τὸ θεαθῆναι αὐτοῖς· εἰ δὲ μή γε, μισθὸν οὐκ ἔχετε παρὰ τῷ πατρὶ ὑμῶν τῷ ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/001.yaml
  text: But be careful not to practice your righteousness before people in order to be seen by them[a]; otherwise[b], you have no reward from your Father in the heavens.
translation:
  language: it
  text: Guardatevi dal praticare la vostra giustizia[a] davanti agli altri per essere visti da loro; altrimenti non avete alcuna ricompensa presso il Padre vostro, che è nei cieli[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «le vostre opere giuste». Una variante testuale legge «la vostra elemosina».
    reason: textual_variant
  - marker: b
    text: Il greco ha il plurale «nei cieli»; in italiano si usa spesso il singolare «in cielo».
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσέχετε
  choice: Badate
  rationale: L’imperativo presente plurale esorta a una vigilanza continua; «Badate» mantiene la forza dell’avvertimento in un italiano corrente e dignitoso.
- source_word: δὲ
  choice: però
  rationale: Segnala il passaggio con sfumatura avversativa rispetto all’insegnamento precedente, senza appesantire l’apertura del versetto.
- source_word: δικαιοσύνην
  choice: giustizia
  rationale: Riproduce il termine ampio del testo SBLGNT senza restringerlo all’elemosina; nel contesto indica la giustizia messa in pratica.
- source_word: μὴ ποιεῖν
  choice: di non praticare
  rationale: Esprime ciò che i discepoli devono evitare e rende naturale l’idea di una condotta religiosa concretamente esercitata.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: davanti agli altri
  rationale: Indica la presenza di osservatori umani in generale; «gli altri» è idiomatico e non limita il riferimento ai maschi.
- source_word: πρὸς τὸ θεαθῆναι αὐτοῖς
  choice: per essere visti da loro
  rationale: Conserva sia il valore finale della costruzione sia la forma passiva, mettendo in risalto l’intenzione di ottenere visibilità.
- source_word: εἰ δὲ μή γε
  choice: altrimenti
  rationale: Rende in modo conciso e naturale la conseguenza condizionale dell’avvertimento.
- source_word: μισθὸν
  choice: ricompensa
  rationale: Nel contesto della retribuzione divina, «ricompensa» è più adatto di «salario» e non introduce un rapporto strettamente contrattuale.
- source_word: παρὰ τῷ πατρὶ ὑμῶν
  choice: presso il Padre vostro
  rationale: Il dativo con παρά può indicare prossimità o sfera personale; «presso» conserva questa sfumatura senza escludere che il Padre sia la fonte della ricompensa.
- source_word: τῷ ἐν τοῖς οὐρανοῖς
  choice: che è nei cieli
  rationale: Mantiene il plurale greco caratteristico dell’espressione matteana ed è comprensibile in italiano.
theological_decisions:
- issue: Ampiezza semantica di δικαιοσύνην
  choice: «giustizia», intesa ampiamente come giustizia praticata
  alternative: «opere giuste» oppure «elemosina»
  rationale: Il testo SBLGNT legge δικαιοσύνην, termine più ampio dell’elemosina. Il testo principale non restringe quindi il comando, mentre la nota conserva sia la possibile esplicitazione concreta sia la variante testuale.
- issue: Referente di ἀνθρώπων
  choice: «gli altri» come riferimento generico alle persone che osservano
  alternative: «gli uomini» oppure «la gente»
  rationale: Il riferimento riguarda gli osservatori umani in generale, non esclusivamente persone di sesso maschile.
- issue: Valore di παρὰ con il dativo
  choice: «presso il Padre vostro»
  alternative: «dal Padre vostro»
  rationale: «Presso» conserva la possibile idea di ricompensa riconosciuta al cospetto del Padre, mentre «dal» metterebbe in primo piano la fonte. Il testo greco consente questa tensione e il contesto rende comunque chiaro che la ricompensa dipende dal Padre.
- issue: Plurale τοῖς οὐρανοῖς
  choice: «nei cieli»
  alternative: «in cielo»
  rationale: Il plurale rispecchia la formulazione greca e lo stile di Matteo senza attribuirgli ulteriori implicazioni cosmologiche.
translation_notes:
  register: Italiano standard moderno, sobrio e dignitoso. La formulazione conserva l’avvertimento diretto, evita un linguaggio esclusivamente maschile e mantiene sia l’ampiezza di «giustizia» sia il plurale matteano «nei cieli».
