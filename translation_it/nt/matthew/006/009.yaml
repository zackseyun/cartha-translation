id: MAT.6.9
reference: Matthew 6:9
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Οὕτως οὖν προσεύχεσθε ὑμεῖς· Πάτερ ἡμῶν ὁ ἐν τοῖς οὐρανοῖς· ἁγιασθήτω τὸ ὄνομά σου,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/009.yaml
  text: 'Therefore[a], you should pray like this: Our Father in the heavens, may your name be treated as holy[b],'
translation:
  language: it
  text: 'Voi dunque pregate così: «Padre nostro che sei nei cieli[a], sia santificato il tuo nome[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Più tradizionalmente: «in cielo». Il greco ha il plurale, «nei cieli».'
    reason: lexical_alternative
  - marker: b
    text: 'Cioè: il tuo nome sia riconosciuto e onorato come santo.'
    reason: clarification
lexical_decisions:
- source_word: Οὕτως
  choice: così
  rationale: Introduce il modo o modello della preghiera; «così» è naturale in italiano moderno e conserva la forza istruttiva.
- source_word: οὖν
  choice: dunque
  rationale: Segnala la conseguenza dell’insegnamento precedente senza appesantire la frase.
- source_word: προσεύχεσθε ὑμεῖς
  choice: voi ... pregate
  rationale: L’imperativo presente plurale è reso direttamente; il pronome esplicito «voi» conserva l’enfasi di ὑμεῖς.
- source_word: Πάτερ ἡμῶν
  choice: Padre nostro
  rationale: Forma italiana naturale dell’invocazione, che conserva sia l’appellativo diretto sia il pronome comunitario.
- source_word: ὁ ἐν τοῖς οὐρανοῖς
  choice: che sei nei cieli
  rationale: La relativa esplicita in modo idiomatico il valore di ὁ; «nei cieli» conserva il plurale greco.
- source_word: ἁγιασθήτω
  choice: sia santificato
  rationale: Conserva la forma passiva e la forza di petizione dell’imperativo aoristo; il verbo è dignitoso, comprensibile e teologicamente non riduttivo.
- source_word: τὸ ὄνομά σου
  choice: il tuo nome
  rationale: Resa diretta che mantiene il linguaggio biblico del «nome» senza sostituirlo con una spiegazione interpretativa.
theological_decisions:
- issue: L’indicazione della trascendenza divina nell’invocazione iniziale
  choice: Padre nostro che sei nei cieli
  alternative: Padre nostro che sei in cielo
  rationale: Il plurale «cieli» rispecchia τοῖς οὐρανοῖς e mantiene insieme la vicinanza espressa da «Padre» e la trascendenza divina, senza trasformare la frase in «Padre celeste».
- issue: Il significato della petizione ἁγιασθήτω τὸ ὄνομά σου
  choice: sia santificato il tuo nome
  alternative: il tuo nome sia riconosciuto come santo
  rationale: La formulazione scelta conserva il passivo e non specifica oltre il testo chi debba santificare il nome o in quale modo. La nota rende trasparente il senso per il lettore moderno.
translation_notes:
  register: Italiano standard moderno, naturale e dignitoso. La struttura nota della preghiera è mantenuta dove resta chiara, mentre «nei cieli» segue deliberatamente il plurale del testo greco. La virgola finale segnala che il versetto prosegue nella frase successiva.
