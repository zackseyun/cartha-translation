  source_fidelity: 'La resa segue fedelmente il greco: «dunque» rende οὖν, «voi ... pregate» conserva l’imperativo plurale con l’enfasi di ὑμεῖς, «così» rende Οὕτως, e «nei cieli» mantiene correttamente il plurale τοῖς οὐρανοῖς. «Sia santificato il tuo nome» è una resa italiana consolidata e grammaticalmente adatta dell’imperativo passivo ἁγιασθήτω, senza assegnare un agente non espresso.'
  naturalness: L’italiano è standard, scorrevole e di registro dignitoso. L’ordine «Voi dunque pregate così» è leggermente marcato, ma legittimamente riflette l’enfasi del pronome greco esplicito. La virgola finale rappresenta correttamente la continuità sintattica con il versetto seguente.
  terminology: «Padre nostro», «nei cieli», «nome» e «santificato» sono termini appropriati, naturali e non confessionali nella loro formulazione. La nota b chiarisce prudentemente che la santificazione del nome riguarda il suo riconoscimento e onore come santo, senza sostituire il testo con un’interpretazione.
