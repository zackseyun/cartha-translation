  text: σοῦ δὲ ποιοῦντος ἐλεημοσύνην μὴ γνώτω ἡ ἀριστερά σου τί ποιεῖ ἡ δεξιά σου,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/003.yaml
  text: But when you give to the needy[a], do not let your left hand know what your right hand is doing,
translation:
  language: it
  text: Ma quando fai l’elemosina[a], la tua mano sinistra non sappia ciò che fa la destra,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «quando fai un’opera di carità»; il termine greco indica in particolare l’aiuto dato ai poveri.'
    reason: Alternativa lessicale che chiarisce il significato di ἐλεημοσύνην.
lexical_decisions:
- source_word: σοῦ δὲ ποιοῦντος
  choice: Ma quando fai
  rationale: Il genitivo assoluto con δέ introduce un contrasto con quanto precede. «Ma quando fai» lo rende in un italiano naturale, conservando la seconda persona singolare.
- source_word: ἐλεημοσύνην
  choice: l’elemosina
  rationale: Il termine indica l’aiuto caritatevole, in particolare il dono destinato ai poveri. «Fare l’elemosina» è una resa italiana diretta e comprensibile; la nota chiarisce l’ampiezza del senso.
- source_word: μὴ γνώτω
  choice: non sappia
  rationale: L’imperativo aoristo negativo è reso con una proibizione alla terza persona, mantenendo la vivace personificazione delle mani.
- source_word: ἡ ἀριστερά σου
  choice: la tua mano sinistra
  rationale: La resa letterale conserva l’immagine e il parallelismo memorabile dell’affermazione.
- source_word: τί ποιεῖ ἡ δεξιά σου
  choice: ciò che fa la destra
  rationale: La formulazione è idiomatica in italiano e conserva il presente greco. L’omissione di «tua mano» nella seconda metà evita una ripetizione pesante senza perdere il referente.
theological_decisions:
- issue: Interpretazione dell’immagine della mano sinistra e della mano destra
  choice: Conservare la metafora come forte esortazione a dare senza ostentazione né compiacimento di sé.
  alternative: Esplicitarla come divieto assoluto di qualsiasi beneficenza compiuta in pubblico.
  rationale: Il testo impiega personificazione e iperbole. Mantenere intatta l’immagine evita sia di attenuarne la forza sia di trasformarla in una norma più specifica di quanto il versetto affermi.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. La formulazione conserva il noto parallelismo delle due mani senza ricorrere a un linguaggio eccessivamente arcaico.
