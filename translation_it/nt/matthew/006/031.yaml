  text: μὴ οὖν μεριμνήσητε λέγοντες· Τί φάγωμεν; ἤ· Τί πίωμεν; ἤ· Τί περιβαλώμεθα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/031.yaml
  text: Therefore do not worry[a], saying, ‘What will we eat?’ or ‘What will we drink?’ or ‘What will we wear?’
translation:
  language: it
  text: 'Perciò non preoccupatevi[a], dicendo: «Che cosa mangeremo? O che cosa berremo? O che cosa indosseremo?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: «non siate in ansia».'
    reason: Alternativa lessicale che esplicita la sfumatura ansiosa di μεριμνάω.
lexical_decisions:
- source_word: μὴ οὖν μεριμνήσητε
  choice: Perciò non preoccupatevi
  rationale: «Preoccuparsi» esprime in italiano moderno l'affanno per i bisogni materiali indicato qui da μεριμνάω, senza trasformare il divieto in una condanna della prudente previdenza. «Perciò» rende il valore inferenziale di οὖν.
- source_word: λέγοντες
  choice: dicendo
  rationale: Riproduce direttamente il participio e introduce le parole nelle quali si manifesta la preoccupazione.
- source_word: Τί
  choice: Che cosa
  rationale: È una resa italiana naturale del pronome interrogativo nelle tre domande dirette.
- source_word: φάγωμεν
  choice: mangeremo
  rationale: Il futuro italiano rende naturalmente la domanda deliberativa relativa al sostentamento futuro.
- source_word: πίωμεν
  choice: berremo
  rationale: Mantiene il parallelismo con φάγωμεν e comunica in modo naturale la preoccupazione per ciò che si berrà.
- source_word: περιβαλώμεθα
  choice: indosseremo
  rationale: Nel contesto dell'abbigliamento, «indossare» è l'equivalente idiomatico del verbo medio περιβάλλομαι, più naturale di una resa letterale come «ci metteremo addosso».
- source_word: ἤ ... ἤ ... ἤ
  choice: oppure ... oppure
  rationale: La ripetizione di «oppure» conserva la struttura disgiuntiva che separa le tre domande; il primo elemento della serie non richiede una congiunzione iniziale in italiano.
theological_decisions:
- issue: Natura del divieto di Gesù riguardo ai bisogni materiali
  choice: Rendere μεριμνήσητε come divieto della preoccupazione ansiosa, non come divieto assoluto di pianificare responsabilmente.
  alternative: «Non siate in ansia» oppure «non occupatevi affatto» dei bisogni materiali.
  rationale: Il contesto immediato riguarda l'affanno per il sostentamento. «Non preoccupatevi» mantiene la forza dell'esortazione senza aggiungere un rifiuto della previdenza che il testo non formula.
translation_notes:
  register: Italiano standard moderno, naturale e dignitoso. Le tre domande sono mantenute in forma diretta e parallela; «oppure» evita un tono artificiosamente letterale pur conservando la ripetizione del greco.
