  text: λέγω δὲ ὑμῖν ὅτι οὐδὲ Σολομὼν ἐν πάσῃ τῇ δόξῃ αὐτοῦ περιεβάλετο ὡς ἓν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/029.yaml
  text: But I tell you that not even Solomon in all his glory was clothed like one of these[a].
translation:
  language: it
  text: Ma io vi dico che neppure Salomone, in tutto il suo splendore, si vestì come uno di questi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Ma io vi dico
  rationale: λέγω con il dativo ὑμῖν si rende naturalmente «io vi dico»; δέ introduce qui un lieve contrasto con quanto precede, espresso in italiano con «Ma».
- source_word: οὐδὲ
  choice: neppure
  rationale: 'Rende l''intensificazione negativa: nemmeno Salomone raggiunge il termine di paragone.'
- source_word: Σολομὼν
  choice: Salomone
  rationale: Forma italiana tradizionale e corrente del nome proprio.
- source_word: ἐν πάσῃ τῇ δόξῃ αὐτοῦ
  choice: in tutto il suo splendore
  rationale: Nel contesto δόξα indica la magnificenza regale e visibile di Salomone; «splendore» comunica questo senso in italiano moderno senza suggerire necessariamente la gloria divina.
- source_word: περιεβάλετο
  choice: era vestito
  rationale: Il medio aoristo di περιβάλλω descrive qui l'abbigliamento di Salomone. «Era vestito» è naturale e conserva il confronto con il modo in cui i fiori appaiono adornati.
- source_word: ὡς ἓν τούτων
  choice: come uno di questi
  rationale: Mantiene il riferimento dimostrativo al contesto immediato e il confronto con un singolo fiore espresso da ἓν.
theological_decisions:
- issue: Senso di δόξα riferito a Salomone
  choice: splendore
  alternative: gloria
  rationale: Il contesto riguarda la magnificenza esteriore e regale di Salomone, posta a confronto con i fiori. «Splendore» rende direttamente tale senso senza introdurre connotazioni specifiche di gloria divina.
- issue: Valore di περιεβάλετο
  choice: era vestito
  alternative: si vestì / si era vestito
  rationale: La forma media può essere resa più letteralmente con valore riflessivo, ma nel confronto l'attenzione cade sul risultato visibile dell'abbigliamento, non sull'atto di vestirsi; l'imperfetto italiano formula in modo naturale lo stato descritto.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. La formulazione conserva l'enfasi di «neppure» e il riferimento contestuale «questi», senza esplicitare «fiori» nel versetto.
