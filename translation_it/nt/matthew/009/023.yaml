id: MAT.9.23
reference: Matthew 9:23
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν ὁ Ἰησοῦς εἰς τὴν οἰκίαν τοῦ ἄρχοντος καὶ ἰδὼν τοὺς αὐλητὰς καὶ τὸν ὄχλον θορυβούμενον
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/023.yaml
  text: And when Jesus came into the ruler's house and saw the flute players and the crowd making a commotion[c][b][a],
translation:
  language: it
  text: Quando Gesù entrò nella casa del capo[a] e vide i suonatori di flauto[b] e la folla che faceva gran chiasso[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «del dignitario»; confrontando i racconti paralleli, «del capo della sinagoga». Qui Matteo dice semplicemente «del capo».
    reason: alternative_reading
  - marker: b
    text: Si tratta di musicisti che partecipavano al lutto funebre secondo l'uso dell'epoca; erano già presenti insieme alla folla.
    reason: cultural_note
  - marker: c
    text: O «in tumulto».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: Quando Gesù entrò
  rationale: Il participio aoristo esprime qui una circostanza temporale anteriore alla principale; la resa con «quando» è naturale in italiano. «Entrò» esplicita correttamente il movimento verso l'interno indicato da εἰς.
- source_word: οἰκίαν
  choice: casa
  rationale: È la resa diretta e corrente del termine nel contesto narrativo.
- source_word: ἄρχοντος
  choice: capo
  rationale: Conserva il carattere generale di ἄρχων senza specificare, sulla base dei racconti paralleli, che si trattasse del capo della sinagoga.
- source_word: ἰδὼν
  choice: vide
  rationale: Resa narrativa semplice e diretta del participio aoristo.
- source_word: αὐλητὰς
  choice: suonatori di flauto
  rationale: Indica musicisti che suonavano uno strumento a fiato del tipo flauto o piffero; la formulazione scelta è chiara per il lettore moderno.
- source_word: ὄχλον
  choice: folla
  rationale: Equivalente italiano normale di ὄχλος in questo contesto.
- source_word: θορυβούμενον
  choice: che faceva gran chiasso
  rationale: Rende il participio presente, che descrive la folla rumorosamente agitata, senza precisare oltre il testo la natura emotiva del tumulto.
theological_decisions:
- issue: Identificazione del padrone di casa
  choice: il capo
  alternative: il dignitario; il capo della sinagoga
  rationale: Matteo usa il termine generale ἄρχων. Il testo principale non importa dai racconti paralleli l'identificazione più specifica con il capo della sinagoga.
translation_notes:
  register: Italiano moderno, naturale e dignitoso. La frase conserva la struttura aperta del versetto, che prosegue in quello successivo. I marcatori di nota sono collocati subito dopo le espressioni cui si riferiscono.
