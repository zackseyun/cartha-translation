  source_fidelity: 'Il testo rende fedelmente la sequenza narrativa e gli elementi del greco: Gesù entra nella casa dell’ἄρχων, vede gli αὐληταί e la folla descritta come θορυβούμενον. «Capo» mantiene opportunamente la genericità di ἄρχων senza armonizzare il passo con i paralleli. La frase resta, correttamente, sospesa dalla virgola, poiché il periodo prosegue nel versetto seguente.'
  naturalness: L’italiano è moderno, scorrevole e di registro narrativo dignitoso. «Suonatori di flauto» e «la folla che faceva gran chiasso» sono formulazioni chiare e idiomatiche. La costruzione con «Quando Gesù entrò ... e vide» rende in modo naturale i participi aoristi in italiano.
