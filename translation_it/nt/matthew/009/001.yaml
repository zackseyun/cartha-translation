source:
  edition: SBLGNT
  text: Καὶ ⸀ἐμβὰς ⸀εἰς πλοῖον διεπέρασεν καὶ ἦλθεν εἰς τὴν ἰδίαν πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/001.yaml
  text: And after getting into a boat[a], he crossed over and came to his own city.
translation:
  language: it
  text: Poi, salito su una barca, passò all’altra riva e giunse nella sua città[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’espressione greca significa letteralmente «la propria città» e qui probabilmente indica Cafarnao, la città a cui Gesù era legato in questa fase del racconto, non necessariamente la sua città natale.
    reason: Chiarisce l’ambito semantico di ἰδίαν πόλιν e conserva l’incertezza sull’identificazione della città.
lexical_decisions:
- source_word: Καὶ
  choice: Poi
  rationale: Introduce con naturalezza la nuova tappa della narrazione, mantenendo il valore connettivo e sequenziale di καί senza appesantire l’italiano con un «E» iniziale.
- source_word: ἐμβὰς εἰς πλοῖον
  choice: salito su una barca
  rationale: Il participio aoristo indica un’azione anteriore ai verbi principali. La costruzione italiana conserva la sequenza ed esprime πλοῖον con il termine comune e proporzionato al contesto.
- source_word: διεπέρασεν
  choice: passò all’altra riva
  rationale: Rende il movimento da una sponda all’altra implicito in διαπεράω, in un italiano naturale, senza specificare quale specchio d’acqua.
- source_word: ἦλθεν
  choice: giunse
  rationale: Nel contesto di uno spostamento concluso, «giunse» esprime in modo naturale l’arrivo indicato da ἔρχομαι.
- source_word: εἰς τὴν ἰδίαν πόλιν
  choice: nella sua città
  rationale: Conserva il senso di appartenenza o associazione espresso da ἴδιος, senza trasformarlo necessariamente in «città natale» né identificare la località nel testo.
theological_decisions:
- issue: Identità della «sua città»
  choice: La località non viene identificata nel testo principale.
  alternative: Specificare Cafarnao oppure tradurre «la sua città natale».
  rationale: Il greco non nomina la città e ἰδίαν indica appartenenza o associazione, non necessariamente il luogo di nascita. Il contesto può suggerire Cafarnao, ma tale identificazione resta in nota.
translation_notes:
  register: Italiano moderno, scorrevole e dignitoso. La successione narrativa resta concisa; il participio iniziale conserva il rapporto temporale del greco. La nota è collocata dopo «città», il sintagma a cui si riferisce.
