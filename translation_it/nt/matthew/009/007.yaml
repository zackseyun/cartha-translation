  text: And he got up and went away to his house[a].
translation:
  language: it
  text: Ed egli si alzò e se ne andò a casa sua.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «partì per la sua casa».
    reason: Alternativa lessicale che rende ἀπῆλθεν in modo più formale, esplicitando la partenza.
lexical_decisions:
- source_word: καὶ
  choice: Ed
  rationale: Mantiene la semplice coordinazione narrativa del greco; davanti a «egli» la forma «Ed» rende il periodo scorrevole senza aggiungere una sfumatura temporale.
- source_word: ἐγερθεὶς
  choice: egli si alzò
  rationale: Il participio aoristo passivo è usato qui con valore intransitivo. La forma finita italiana è naturale e comunica chiaramente l'azione compiuta.
- source_word: ἀπῆλθεν
  choice: se ne andò
  rationale: Esprime sia il movimento sia l'allontanamento dal luogo in cui si trovava, conservando la forza di ἀπέρχομαι in italiano corrente.
- source_word: εἰς τὸν οἶκον αὐτοῦ
  choice: a casa sua
  rationale: Rende in modo idiomatico il moto verso la propria abitazione; «casa» conserva il riferimento concreto di οἶκος, mentre il possessivo mantiene αὐτοῦ.
theological_decisions: []
translation_notes:
  register: Italiano moderno, dignitoso e narrativamente scorrevole. Il pronome «egli» conserva il soggetto espresso nella resa senza risultare colloquiale; «se ne andò a casa sua» è idiomatico e fedele al movimento indicato dal greco.
