id: MAT.9.13
reference: Matthew 9:13
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: πορευθέντες δὲ μάθετε τί ἐστιν· Ἔλεος θέλω καὶ οὐ θυσίαν· οὐ γὰρ ἦλθον καλέσαι δικαίους ἀλλὰ ⸀ἁμαρτωλούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/013.yaml
  text: 'But go and learn what this means: ‘I desire mercy and not sacrifice.’ For I did not come to call the righteous[c][b][a], but sinners.'
translation:
  language: it
  text: 'Ma andate e imparate che cosa significa: «Misericordia voglio e non sacrificio».[a] Infatti non sono venuto a chiamare i giusti, ma i peccatori.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Citazione da Osea 6:6.
    reason: cross_reference
  - marker: b
    text: Il greco dice semplicemente «i giusti»; nel contesto potrebbe anche riferirsi a coloro che si ritengono giusti.
    reason: alternative_reading
lexical_decisions:
- source_word: πορευθέντες δὲ μάθετε
  choice: Ma andate e imparate
  rationale: Il participio aoristo πορευθέντες, unito all'imperativo μάθετε, forma un'esortazione idiomatica; «andate e imparate» ne conserva sia il movimento sia il tono di rimprovero. δέ è reso con «Ma» per segnare il contrasto con quanto precede.
- source_word: τί ἐστιν
  choice: che cosa significa
  rationale: Nel contesto introduce il significato della citazione; questa formulazione è naturale in italiano e rende la funzione interpretativa dell'espressione greca. Il più letterale «che cosa sia» è possibile, ma meno immediato.
- source_word: Ἔλεος
  choice: Misericordia
  rationale: Resa tradizionale e semanticamente ampia, capace di conservare tanto la compassione concreta quanto la risonanza dell'uso profetico.
- source_word: θέλω
  choice: voglio
  rationale: Rende direttamente la volontà espressa dal verbo greco e mantiene la formulazione incisiva della citazione scritturale.
- source_word: θυσίαν
  choice: sacrificio
  rationale: Corrispondenza diretta che conserva il singolare e il contrasto profetico con la misericordia.
- source_word: οὐ γὰρ ἦλθον
  choice: Infatti non sono venuto
  rationale: γάρ introduce la motivazione della citazione applicata alla condotta di Gesù; il passato prossimo è la forma italiana naturale per una venuta passata rilevante per la missione presente.
- source_word: καλέσαι
  choice: a chiamare
  rationale: «Chiamare» conserva l'ampiezza del verbo, che può indicare convocazione o invito senza restringerne il significato.
- source_word: δικαίους
  choice: i giusti
  rationale: L'aggettivo sostantivato è tradotto senza aggiungere che si tratti di persone realmente giuste o di persone che si ritengono tali, preservando l'ambiguità del greco.
- source_word: ἁμαρτωλούς
  choice: i peccatori
  rationale: Resa sostantivata corrente che mantiene il contrasto netto con «i giusti».
theological_decisions:
- issue: Forza della citazione di Osea 6:6
  choice: «Misericordia voglio e non sacrificio»
  alternative: Una parafrasi che dica che Dio rifiuta ogni sacrificio, oppure che attenui il contrasto a una semplice preferenza occasionale
  rationale: La formulazione conserva il contrasto profetico usato da Gesù come rimprovero, senza trasformarlo né in un'abolizione generale del sacrificio né in una preferenza debole.
- issue: Referente di «i giusti»
  choice: Mantenere «i giusti» nel testo
  alternative: «quelli che si credono giusti» o «i presuntuosi»
  rationale: Il contesto può suggerire ironia o autopercezione, ma il greco dice semplicemente δικαίους. La traduzione non esplicita un'interpretazione che il testo lascia aperta.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. La citazione mantiene una cadenza scritturale concisa; la sintassi circostante resta naturale. Tutti i marcatori di nota compaiono nel testo principale.
