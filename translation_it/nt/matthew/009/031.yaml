  edition: SBLGNT
  text: οἱ δὲ ἐξελθόντες διεφήμισαν αὐτὸν ἐν ὅλῃ τῇ γῇ ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/031.yaml
  text: But after they went out[a], they spread the news about him throughout that whole region.
translation:
  language: it
  text: Ma quelli, dopo essere usciti, diffusero la notizia su di lui in tutta quella regione.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «in tutta quella terra». Il termine greco γῆ può significare «terra», «regione» o «territorio».
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: Segnala il lieve contrasto con il comando di Gesù nel versetto precedente e introduce con naturalezza la svolta narrativa.
- source_word: ἐξελθόντες
  choice: usciti
  rationale: 'Il participio aoristo esprime un''azione anteriore al verbo principale; il participio passato italiano conserva in modo conciso la sequenza: prima uscirono, poi diffusero la notizia.'
- source_word: διεφήμισαν
  choice: diffusero la notizia
  rationale: Rende l'idea di divulgare ampiamente o rendere noto, in un italiano moderno e naturale.
- source_word: αὐτὸν
  choice: di lui
  rationale: Con «diffusero la notizia», il pronome oggetto greco viene reso idiomaticamente indicando che la notizia riguardava Gesù.
- source_word: ἐν ὅλῃ τῇ γῇ ἐκείνῃ
  choice: in tutta quella regione
  rationale: Nel contesto locale γῆ indica verosimilmente una regione o un territorio; «in tutta» conserva l'estensione distributiva dell'espressione greca senza amplificarne la portata.
theological_decisions:
- issue: Estensione geografica di γῆ
  choice: regione
  alternative: terra / territorio
  rationale: Il racconto riguarda la diffusione locale della notizia su Gesù. «Regione» esprime bene tale ambito senza suggerire necessariamente l'intera terra o una specifica entità nazionale; la nota conserva l'alternativa lessicale.
translation_notes:
  register: Italiano standard moderno, dignitoso e scorrevole. «La notizia di lui» mantiene il riferimento personale del greco senza ricorrere al più interpretativo «la sua fama».
