reference: Matthew 9:29
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: τότε ἥψατο τῶν ὀφθαλμῶν αὐτῶν λέγων· Κατὰ τὴν πίστιν ὑμῶν γενηθήτω ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/029.yaml
  text: Then he touched their eyes[a], saying, “According to your faith, let it be done for you.”
translation:
  language: it
  text: 'Allora toccò loro gli occhi e disse: «Avvenga per voi secondo la vostra fede».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «Vi accada secondo la vostra fiducia». Il termine greco πίστις può anche essere tradotto «fiducia» o, in alcuni contesti, «fedeltà».'
    reason: Alternativa lessicale per πίστις e resa possibile di γενηθήτω.
lexical_decisions:
- source_word: τότε
  choice: Allora
  rationale: Segna in modo naturale la successione narrativa, senza appesantire con «in quel momento».
- source_word: ἥψατο τῶν ὀφθαλμῶν αὐτῶν
  choice: toccò loro gli occhi
  rationale: Rende il contatto fisico espresso da ἅπτομαι e trasforma idiomaticamente in italiano il genitivo della cosa toccata.
- source_word: λέγων
  choice: e disse
  rationale: Il participio presente è reso con una coordinata, più naturale nella narrazione italiana e ancora chiaramente contemporanea all'azione del toccare.
- source_word: Κατὰ τὴν πίστιν ὑμῶν
  choice: secondo la vostra fede
  rationale: Conserva il rapporto di corrispondenza o misura espresso da κατά senza introdurre una causalità più forte; «fede» è il termine italiano consueto, mentre qui include concretamente la fiducia in Gesù.
- source_word: γενηθήτω ὑμῖν
  choice: vi sia fatto
  rationale: Mantiene la forza dell'imperativo aoristo e la formulazione passiva del pronunciamento, con il dativo reso dal pronome «vi».
theological_decisions:
- issue: Resa di πίστις in una dichiarazione di guarigione
  choice: fede
  alternative: fiducia
  rationale: «Fede» conserva il termine teologico e lessicale tradizionale senza determinare oltre il greco; nel contesto indica anche la fiducia dei ciechi nella capacità di Gesù di guarirli. L'alternativa è segnalata in nota.
- issue: Rapporto espresso da κατά
  choice: secondo
  alternative: in base a
  rationale: «Secondo» preserva la possibile idea di corrispondenza o misura; «in base a» potrebbe suggerire più nettamente una causa o un merito.
translation_notes:
  register: Italiano standard moderno, dignitoso e scorrevole. La costruzione «toccò loro gli occhi» evita una formulazione possessiva pesante; «vi sia fatto» conserva deliberatamente il tono performativo e la forma passiva del greco.
