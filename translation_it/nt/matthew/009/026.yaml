  variant: modern standard Italian
source:
  edition: SBLGNT
  text: καὶ ἐξῆλθεν ἡ φήμη αὕτη εἰς ὅλην τὴν γῆν ἐκείνην.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/026.yaml
  text: And this report went out into all that region[a].
translation:
  language: it
  text: E questa notizia si diffuse in tutta quella regione[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «per tutto quel territorio» o «in tutta quella zona». Il greco γῆ può indicare terra, territorio o regione; qui si riferisce con ogni probabilità all'area circostante, non all'intera terra.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Rende il normale collegamento narrativo di καί senza aggiungere una sfumatura causale o temporale.
- source_word: ἐξῆλθεν
  choice: si diffuse
  rationale: Benché significhi letteralmente «uscì», riferito a una notizia l'italiano naturale usa «si diffuse»; conserva l'idea del propagarsi dalla scena dell'accaduto senza risultare artificioso.
- source_word: ἡ φήμη αὕτη
  choice: questa notizia
  rationale: φήμη indica una notizia o un resoconto che circola; «notizia» evita la connotazione moderna di scarsa attendibilità propria di «voce» o «diceria». αὕτη è reso direttamente con «questa».
- source_word: εἰς ὅλην τὴν γῆν ἐκείνην
  choice: in tutta quella regione
  rationale: Nel contesto γῆ designa verosimilmente il territorio circostante, non l'intera terra. «In tutta quella regione» rende con naturalezza sia l'estensione espressa da ὅλην sia il riferimento deittico di ἐκείνην.
theological_decisions: []
translation_notes:
  register: Italiano moderno, dignitoso e narrativamente scorrevole. «Si diffuse» privilegia l'idiomaticità italiana rispetto al calco «uscì», mentre la nota conserva l'ampiezza semantica di γῆ.
