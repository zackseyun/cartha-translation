  text: οὐδεὶς δὲ ἐπιβάλλει ἐπίβλημα ῥάκους ἀγνάφου ἐπὶ ἱματίῳ παλαιῷ· αἴρει γὰρ τὸ πλήρωμα αὐτοῦ ἀπὸ τοῦ ἱματίου, καὶ χεῖρον σχίσμα γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/016.yaml
  text: But no one puts a patch of unshrunk cloth on an old garment, for the patch pulls away from the garment, and a worse tear results.
translation:
  language: it
  text: Ma nessuno mette una toppa di stoffa non ancora ristretta[a] su un vecchio indumento, perché la toppa ne strappa una parte e lo strappo diventa peggiore.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oppure «di stoffa non follata»; il greco indica un tessuto non ancora sottoposto alla follatura e quindi non ancora ristretto, che farà trazione sul vecchio indumento.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς
  choice: nessuno
  rationale: Rende direttamente il soggetto negativo universale in italiano moderno, senza introdurre specificazioni di genere.
- source_word: δὲ
  choice: Ma
  rationale: Segnala il lieve contrasto o passaggio rispetto al contesto precedente.
- source_word: ἐπιβάλλει
  choice: mette ... su
  rationale: Conserva il senso generale di applicare o porre sopra; «cuce» renderebbe esplicita un'azione soltanto implicata dal contesto.
- source_word: ἐπίβλημα
  choice: toppa
  rationale: È il termine italiano corrente e preciso per un pezzo applicato a un indumento per ripararlo.
- source_word: ῥάκους ἀγνάφου
  choice: di stoffa non follata
  rationale: Rende il tessuto non ancora sottoposto alla follatura. La nota chiarisce l'effetto pratico, cioè che non è ancora ristretto e farà trazione sul vecchio vestito.
- source_word: ἐπὶ ἱματίῳ παλαιῷ
  choice: su un vestito vecchio
  rationale: «Vestito» è naturale e sufficientemente ampio per ἱμάτιον; «vecchio» rende direttamente παλαιῷ.
- source_word: αἴρει
  choice: si stacca
  rationale: Nel contesto esprime la separazione della toppa dal vestito senza specificare oltre il testo il meccanismo; è più naturale del letterale «porta via».
- source_word: τὸ πλήρωμα αὐτοῦ
  choice: la toppa
  rationale: Letteralmente indica ciò che riempie o completa; nel contesto il referente è il pezzo usato come toppa, ripreso in modo chiaro e idiomatico.
- source_word: ἀπὸ τοῦ ἱματίου
  choice: dal vestito
  rationale: Esprime semplicemente la separazione indicata da ἀπό.
- source_word: χεῖρον σχίσμα γίνεται
  choice: lo strappo diventa peggiore
  rationale: Conserva sia il comparativo χεῖρον sia il valore risultativo di γίνεται, in una formulazione italiana chiara.
