  variant: modern standard Italian
source:
  edition: SBLGNT
  text: οἱ δὲ Φαρισαῖοι ἔλεγον· Ἐν τῷ ἄρχοντι τῶν δαιμονίων ἐκβάλλει τὰ δαιμόνια.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/034.yaml
  text: But the Pharisees were saying[a], “By the ruler of the demons he casts out the demons.”
translation:
  language: it
  text: 'Ma i farisei dicevano: «È per mezzo del capo[a] dei demòni che scaccia i demòni».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: «È per mezzo del principe dei demòni che scaccia i demòni».'
    reason: 'Alternativa lessicale per ἄρχων: «principe» è tradizionale, mentre «capo» è più corrente e mette in risalto l''autorità.'
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: Segnala il contrasto tra la reazione positiva della folla nel contesto precedente e l'interpretazione ostile dei farisei.
- source_word: Φαρισαῖοι
  choice: i farisei
  rationale: È la forma italiana standard del nome del gruppo giudaico; l'articolo greco è conservato.
- source_word: ἔλεγον
  choice: dicevano
  rationale: L'imperfetto italiano conserva naturalmente l'aspetto durativo o iterativo dell'imperfetto greco.
- source_word: Ἐν τῷ ἄρχοντι
  choice: per mezzo del capo
  rationale: ἐν con il dativo ha qui valore strumentale; «per mezzo di» rende esplicita e naturale l'accusa relativa alla fonte del potere.
- source_word: ἄρχοντι
  choice: capo
  rationale: Esprime in italiano corrente l'autorità esercitata sui demòni senza le possibili connotazioni dinastiche di «principe».
- source_word: τῶν δαιμονίων
  choice: dei demòni
  rationale: Conserva il genitivo articolato e identifica colui che esercita autorità sui demòni.
- source_word: ἐκβάλλει
  choice: scaccia
  rationale: È il verbo italiano naturale e consolidato nei racconti di esorcismo, e comunica l'espulsione forzata.
- source_word: τὰ δαιμόνια
  choice: i demòni
  rationale: Traduce precisamente δαιμόνια e conserva l'articolo del greco.
theological_decisions:
- issue: Resa di δαιμόνια nel contesto di un esorcismo
  choice: demòni
  alternative: spiriti maligni
  rationale: Il testo usa specificamente δαιμόνια, non πνεύματα; «demòni» mantiene la precisione lessicale e non attenua l'affermazione soprannaturale.
- issue: Fonte del potere attribuita a Gesù
  choice: per mezzo del capo dei demòni
  alternative: nel capo dei demòni
  rationale: Il valore strumentale di ἐν indica il mezzo o l'agente al quale i farisei attribuiscono gli esorcismi, senza approvare la loro accusa.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. La collocazione «È per mezzo di… che» riproduce l'enfasi iniziale del greco sul mezzo attribuito all'azione. L'accento in «demòni» chiarisce la pronuncia.
