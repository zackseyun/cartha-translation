id: MAT.9.15
reference: Matthew 9:15
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Μὴ δύνανται οἱ υἱοὶ τοῦ νυμφῶνος πενθεῖν ἐφ’ ὅσον μετ’ αὐτῶν ἐστιν ὁ νυμφίος; ἐλεύσονται δὲ ἡμέραι ὅταν ἀπαρθῇ ἀπ’ αὐτῶν ὁ νυμφίος, καὶ τότε νηστεύσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/015.yaml
  text: And Jesus said to them[a], “The wedding attendants cannot mourn as long as the bridegroom is with them, can they? But days will come when the bridegroom is taken away from them[b], and then they will fast.”
translation:
  language: it
  text: 'E Gesù disse loro: «Gli invitati alle nozze[a] non possono essere in lutto finché lo sposo è con loro, non è vero? Ma verranno giorni in cui lo sposo sarà loro tolto[b]; allora digiuneranno».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Letteralmente «i figli della sala nuziale», espressione idiomatica per gli amici dello sposo o gli invitati che partecipano alla festa di nozze.
    reason: lexical_alternative
  - marker: b
    text: O «sarà portato via da loro». La forma passiva suggerisce più di una normale partenza.
    reason: lexical_alternative
lexical_decisions:
- source_word: υἱοὶ τοῦ νυμφῶνος
  choice: gli invitati alle nozze
  rationale: L’espressione, letteralmente «i figli della sala nuziale», è un semitismo che indica quanti partecipano alla celebrazione, in particolare gli amici e accompagnatori dello sposo. «Gli invitati alle nozze» comunica con naturalezza il referente collettivo senza conservare un’immagine oscura in italiano.
- source_word: πενθεῖν
  choice: essere in lutto
  rationale: Il verbo indica il fare cordoglio o l’essere afflitti per una perdita. «Essere in lutto» rende chiaramente il contrasto con la presenza festosa dello sposo e con il successivo digiuno.
- source_word: ἐφ’ ὅσον
  choice: finché
  rationale: 'Rende in italiano corrente il valore temporale e durativo: per tutto il tempo in cui lo sposo rimane con loro.'
- source_word: νυμφίος
  choice: sposo
  rationale: È il termine italiano normale e dignitoso per la figura centrale dell’immagine nuziale, e ne conserva la possibile risonanza teologica senza esplicitarla.
- source_word: ἀπαρθῇ
  choice: sarà loro tolto
  rationale: Il passivo suggerisce una sottrazione, non una semplice partenza. La formulazione mantiene tale sfumatura e la possibile anticipazione della morte di Gesù senza svilupparla interpretativamente.
- source_word: νηστεύσουσιν
  choice: digiuneranno
  rationale: Rende direttamente e naturalmente il futuro del verbo «digiunare».
- source_word: Μὴ δύνανται ... ;
  choice: non possono ... non è vero?
  rationale: La domanda introdotta da μή attende una risposta negativa; la domanda di conferma italiana ne conserva la forza retorica.
- source_word: ἐλεύσονται δὲ ἡμέραι
  choice: Ma verranno giorni
  rationale: Riproduce in modo naturale l’espressione temporale futura e il lieve contrasto introdotto da δέ.
theological_decisions:
- issue: Possibile significato cristologico dell’immagine dello sposo
  choice: Conservare «lo sposo» come metafora senza identificare esplicitamente Gesù come sposo messianico.
  alternative: Ampliare interpretativamente il testo identificando Gesù come lo sposo messianico.
  rationale: Il contesto permette al lettore di riconoscere il riferimento a Gesù, ma il versetto non esplicita tutte le implicazioni teologiche dell’immagine; la traduzione lascia quindi intatta questa tensione.
- issue: Sfumatura della rimozione dello sposo
  choice: Tradurre il passivo ἀπαρθῇ con «sarà loro tolto».
  alternative: Rendere con una partenza neutra, come «se ne andrà».
  rationale: La forma greca suggerisce che lo sposo venga sottratto agli altri e può anticipare la morte violenta di Gesù; una resa neutra attenuerebbe indebitamente tale sfumatura.
translation_notes:
  register: 'Italiano moderno, chiaro e dignitoso. La sintassi mantiene il movimento retorico dell’originale: domanda di conferma, contrasto futuro e conclusione enfatica. Le note chiariscono il semitismo nuziale e la sfumatura del passivo senza inserire nel testo interpretazioni confessionali.'
