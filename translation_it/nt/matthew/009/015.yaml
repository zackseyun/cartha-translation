review_pass:
  verdict: approve
  source_fidelity: La resa conserva il valore della domanda retorica negativa (μή), l'opposizione temporale fra la presenza dello sposo e la sua futura sottrazione, e il futuro di «digiuneranno». «Sarà loro tolto» rende bene il passivo ἀπαρθῇ, senza ridurlo a una partenza volontaria. «Gli invitati alle nozze» è una resa idiomatica adeguata di υἱοὶ τοῦ νυμφῶνος; la nota segnala correttamente il letteralismo e la possibile specificazione degli amici dello sposo.
  naturalness: L'italiano è moderno, scorrevole e di registro biblico dignitoso. «Essere in lutto», «finché», «verranno giorni» e «allora digiuneranno» sono naturali. La domanda con «non è vero?» riproduce in modo comprensibile la sollecitazione retorica del greco.
  terminology: «Sposo» è il termine appropriato per νυμφίος e mantiene l'immagine senza esplicitazioni teologiche estranee al versetto. «Digiuneranno» è diretto e preciso. Le note sono ancorate ai punti lessicali pertinenti e non forzano un'interpretazione confessionale.
