id: MAT.9.8
reference: Matthew 9:8
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ ὄχλοι ⸀ἐφοβήθησαν καὶ ἐδόξασαν τὸν θεὸν τὸν δόντα ἐξουσίαν τοιαύτην τοῖς ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/008.yaml
  text: But when the crowds saw it[a], they were afraid and glorified God[b], who had given such authority to men.
translation:
  language: it
  text: Ma le folle, vedendo ciò, ebbero paura[a] e glorificarono Dio, che aveva dato agli uomini[b] una tale autorità.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oppure «furono presi da timore reverenziale». Il verbo greco significa più letteralmente «ebbero paura», ma qui la paura può comprendere anche reverente meraviglia.
    reason: lexical_alternative
  - marker: b
    text: Oppure «agli esseri umani» o «alle persone». Il greco dice «agli uomini», espressione che può indicare in modo rappresentativo gli esseri umani in generale.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: vedendo ciò
  rationale: Il participio aoristo è reso con un gerundio temporale naturale in italiano; «ciò» esplicita sobriamente l'evento appena narrato.
- source_word: δὲ
  choice: Ma
  rationale: Segnala il passaggio, con lieve contrasto, dalla parola di Gesù alla reazione delle folle.
- source_word: οἱ ὄχλοι
  choice: le folle
  rationale: Conserva il plurale del testo greco in un italiano corrente.
- source_word: ἐφοβήθησαν
  choice: ebbero paura
  rationale: Mantiene il significato diretto di φοβέομαι senza ridurlo interpretativamente alla sola meraviglia reverenziale.
- source_word: ἐδόξασαν
  choice: glorificarono
  rationale: Conserva il peso teologico e la corrispondenza lessicale del verbo δοξάζω.
- source_word: τὸν θεὸν
  choice: Dio
  rationale: Resa italiana ordinaria dell'oggetto diretto.
- source_word: τὸν δόντα
  choice: che aveva dato
  rationale: Il participio aoristo attributivo riferito a Dio è reso con una relativa; il trapassato indica che il dono precede la reazione delle folle.
- source_word: ἐξουσίαν
  choice: autorità
  rationale: Esprime autorità o facoltà legittima, non semplicemente forza o potenza.
- source_word: τοιαύτην
  choice: una tale
  rationale: Riproduce il valore qualitativo e dimostrativo di τοιαύτην.
- source_word: τοῖς ἀνθρώποις
  choice: agli uomini
  rationale: Conserva la forma plurale del greco e la tensione narrativa suscitata dall'autorità esercitata da Gesù, pur potendo avere valore rappresentativo dell'umanità.
theological_decisions:
- issue: Se attenuare la reazione delle folle da paura a timore reverenziale
  choice: ebbero paura
  alternative: furono presi da timore reverenziale
  rationale: Il verbo greco denota propriamente paura; il contesto può includere stupore reverenziale, ma la traduzione non risolve questa sfumatura.
- issue: Resa di τοῖς ἀνθρώποις
  choice: agli uomini
  alternative: agli esseri umani / alle persone
  rationale: La forma greca è maschile plurale e può essere rappresentativa degli esseri umani in generale. La formulazione principale conserva la forma e la tensione del testo, mentre la nota chiarisce la possibile portata inclusiva.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. La sintassi resta vicina al greco senza risultare artificiosa; sono preservate sia l'ambiguità emotiva di ἐφοβήθησαν sia la possibile portata rappresentativa di τοῖς ἀνθρώποις.
