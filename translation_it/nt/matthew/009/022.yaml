  text: ὁ δὲ Ἰησοῦς ⸀στραφεὶς καὶ ἰδὼν αὐτὴν εἶπεν· Θάρσει, θύγατερ· ἡ πίστις σου σέσωκέν σε. καὶ ἐσώθη ἡ γυνὴ ἀπὸ τῆς ὥρας ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/022.yaml
  text: But Jesus[a], turning and seeing her, said, “Take courage, daughter[d][c][b]; your faith has saved you.” And the woman was healed from that hour.
translation:
  language: it
  text: 'Ma Gesù si voltò, la vide e disse: «Coraggio, figlia[a]: la tua fede[b] ti ha salvata[c]». E da quell’ora la donna fu guarita.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’esortazione può anche essere resa: «Fatti coraggio, figlia».'
    reason: lexical_alternative
  - marker: b
    text: Il termine greco può anche essere reso «fiducia» in questo contesto.
    reason: alternative_reading
  - marker: c
    text: 'Oppure: «ti ha guarita» o «ti ha risanata». Il verbo greco può riferirsi sia alla salvezza sia alla guarigione; nella frase conclusiva lo stesso verbo è reso «fu guarita» per esplicitare l’esito fisico.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς
  choice: voltatosi
  rationale: Il participio aoristo è usato qui in senso intransitivo; «voltatosi» esprime con naturalezza l’azione senza specificarne indebitamente la direzione.
- source_word: ἰδὼν
  choice: avendola vista
  rationale: Il participio aoristo indica un’azione strettamente connessa e verosimilmente anteriore al dire; la costruzione italiana mantiene il flusso participiale e identifica con chiarezza la donna come oggetto dello sguardo.
- source_word: Θάρσει
  choice: Coraggio
  rationale: L’imperativo esorta alla fiducia e al coraggio. L’interiezione «Coraggio» è diretta, naturale e dignitosa nell’italiano contemporaneo.
- source_word: θύγατερ
  choice: figlia
  rationale: Conserva l’appellativo familiare e affettuoso senza aggiungere qualificazioni non presenti nel greco.
- source_word: πίστις
  choice: fede
  rationale: «Fede» mantiene il termine teologico più ampio e tradizionale; nel contesto include la fiducia riposta in Gesù.
- source_word: σέσωκέν σε
  choice: ti ha salvata
  rationale: Il perfetto di σῴζω può indicare salvezza, guarigione o ristabilimento. «Ti ha salvata» conserva l’ampiezza semantica e la possibile risonanza teologica; l’accordo al femminile è naturale con il pronome oggetto riferito alla donna.
- source_word: ἐσώθη
  choice: fu guarita
  rationale: Qui il risultato narrativo concreto è la guarigione fisica. La resa esplicita tale esito senza cancellare il senso più ampio dello stesso verbo nelle parole di Gesù.
- source_word: ἀπὸ τῆς ὥρας ἐκείνης
  choice: da quell’ora
  rationale: Riproduce fedelmente l’espressione temporale greca e conserva il tono solenne, restando comprensibile in italiano moderno.
theological_decisions:
- issue: Resa di πίστις
  choice: fede
  alternative: fiducia
  rationale: «Fede» conserva la portata religiosa del termine, mentre «fiducia» ne esplicita una sfumatura contestualmente possibile; l’alternativa è segnalata in nota.
- issue: Resa delle due occorrenze di σῴζω
  choice: «ti ha salvata» nel discorso diretto e «fu guarita» nella conclusione narrativa
  alternative: «ti ha guarita» e «fu guarita» in entrambe le occorrenze
  rationale: Il verbo greco può esprimere sia salvezza sia guarigione. Distinguere le rese conserva nelle parole di Gesù la portata più ampia e chiarisce nel racconto l’esito fisico immediato, senza risolvere artificialmente la tensione semantica.
translation_notes:
  register: Italiano standard moderno, naturale e dignitoso. «Coraggio» evita un giro enfatico; «da quell’ora» mantiene la solennità dell’espressione greca. La differenza tra «salvata» e «guarita» è intenzionale e preserva l’ampiezza semantica di σῴζω.
