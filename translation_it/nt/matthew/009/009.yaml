source:
  edition: SBLGNT
  text: Καὶ παράγων ὁ Ἰησοῦς ἐκεῖθεν εἶδεν ἄνθρωπον καθήμενον ἐπὶ τὸ τελώνιον, Μαθθαῖον λεγόμενον, καὶ λέγει αὐτῷ· Ἀκολούθει μοι· καὶ ἀναστὰς ἠκολούθησεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/009.yaml
  text: And as Jesus was passing on from there[a], he saw a man called Matthew sitting at the tax booth, and he says to him[c][b], “Follow me.” And he rose and followed him.
translation:
  language: it
  text: Mentre Gesù proseguiva da lì, vide un uomo, chiamato Matteo,[a] seduto al banco delle imposte, e gli disse:[b] «Seguimi». Egli si alzò[c] e lo seguì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «di nome Matteo».
    reason: lexical_alternative
  - marker: b
    text: 'Il greco usa il presente storico: «gli dice».'
    reason: lexical_alternative
  - marker: c
    text: O «si levò».
    reason: lexical_alternative
lexical_decisions:
- source_word: παράγων ... ἐκεῖθεν
  choice: mentre Gesù si allontanava di là
  rationale: Il participio presente esprime un’azione in corso, mentre ἐκεῖθεν indica il luogo di partenza. «Si allontanava di là» rende in italiano naturale il movimento dal luogo precedente.
- source_word: ἄνθρωπον
  choice: un uomo
  rationale: Nel contesto il sostantivo designa uno specifico individuo di sesso maschile.
- source_word: καθήμενον ἐπὶ τὸ τελώνιον
  choice: seduto al banco delle imposte
  rationale: τελώνιον indica il posto in cui si riscuotevano imposte o dazi. «Banco delle imposte» è comprensibile e non suggerisce necessariamente un moderno ufficio amministrativo.
- source_word: Μαθθαῖον λεγόμενον
  choice: chiamato Matteo
  rationale: Il participio introduce il nome con cui l’uomo era conosciuto; «chiamato» conserva da vicino la formulazione greca.
- source_word: λέγει αὐτῷ
  choice: gli disse
  rationale: Benché il greco usi il presente storico, il passato remoto è il tempo narrativo più naturale nell’italiano moderno; la nota segnala la forma greca.
- source_word: Ἀκολούθει μοι
  choice: Seguimi
  rationale: L’imperativo rende direttamente l’invito di Gesù senza esplicitarlo con una parafrasi tecnica sul discepolato.
- source_word: ἀναστὰς
  choice: si alzò
  rationale: Il participio aoristo presenta l’atto immediatamente precedente al seguire; la forma italiana è naturale e mantiene la sequenza.
- source_word: ἠκολούθησεν αὐτῷ
  choice: lo seguì
  rationale: La resa conserva sia l’azione concreta sia la possibile implicazione di discepolato, senza aggiungere una spiegazione.
theological_decisions:
- issue: Natura della chiamata rivolta da Gesù a Matteo
  choice: «Seguimi»
  alternative: «Diventa mio discepolo» / «Unisciti a me»
  rationale: Il contesto implica una chiamata al discepolato, ma la traduzione mantiene il semplice imperativo greco senza trasformarne l’implicazione teologica in spiegazione esplicita.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. Il passato remoto sostiene la narrazione biblica senza risultare arcaico; il presente storico greco è documentato in nota. Le virgolette caporali seguono l’uso editoriale italiano.
