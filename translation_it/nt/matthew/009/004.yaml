  variant: modern standard Italian
source:
  edition: SBLGNT
  text: καὶ ⸀εἰδὼς ὁ Ἰησοῦς τὰς ἐνθυμήσεις αὐτῶν εἶπεν· ⸀Ἱνατί ἐνθυμεῖσθε πονηρὰ ἐν ταῖς καρδίαις ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/004.yaml
  text: And Jesus[a], knowing their thoughts, said, “Why are you thinking evil in your hearts?”
translation:
  language: it
  text: 'E Gesù, conoscendo[a] i loro pensieri, disse: «Perché pensate cose malvagie nei vostri cuori?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: «percependo i loro pensieri».'
    reason: Alternativa lessicale per εἰδώς, che nel contesto può sottolineare sia la conoscenza sia la percezione dei pensieri interiori.
lexical_decisions:
- source_word: εἰδὼς
  choice: conoscendo
  rationale: Il participio esprime la consapevolezza di Gesù riguardo ai ragionamenti interiori altrui. «Conoscendo» mantiene in modo conciso il valore cognitivo del greco, mentre la nota segnala la possibile sfumatura percettiva.
- source_word: ἐνθυμήσεις
  choice: pensieri
  rationale: Il sostantivo indica pensieri o ragionamenti interiori; «pensieri» è naturale nell’italiano moderno e adeguato al contesto.
- source_word: Ἱνατί
  choice: Perché
  rationale: L’interrogativo chiede la ragione o il motivo; «Perché» è l’equivalente italiano diretto e idiomatico.
- source_word: ἐνθυμεῖσθε
  choice: pensate
  rationale: Il presente indica l’attività interiore in corso. «Pensate» è chiaro e naturale e conserva il legame semantico con «pensieri» nella proposizione precedente.
- source_word: πονηρὰ
  choice: cose malvagie
  rationale: L’aggettivo neutro plurale è usato in modo sostantivato. «Cose malvagie» ne rende esplicita la funzione senza precisare indebitamente se si tratti di pensieri, intenzioni o giudizi.
- source_word: καρδίαις
  choice: cuori
  rationale: «Cuori» conserva la metafora biblica della sede interiore del pensiero e dell’intenzione, senza ridurla alla sola mente.
theological_decisions:
- issue: La conoscenza da parte di Gesù di pensieri non espressi
  choice: Gesù, conoscendo i loro pensieri
  alternative: Gesù, percependo i loro pensieri
  rationale: Il testo presenta Gesù come consapevole dei ragionamenti interiori degli interlocutori. La formulazione conserva tale affermazione senza ampliarla in una spiegazione dottrinale; la nota mantiene disponibile la sfumatura percettiva.
translation_notes:
  register: Italiano standard moderno, chiaro e dignitoso. È conservata la metafora biblica dei «cuori» e la coordinazione iniziale del greco. Le virgolette caporali seguono l’uso editoriale italiano.
