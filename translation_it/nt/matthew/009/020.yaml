id: MAT.9.20
reference: Matthew 9:20
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ γυνὴ αἱμορροοῦσα δώδεκα ἔτη προσελθοῦσα ὄπισθεν ἥψατο τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/020.yaml
  text: And behold[b][a], a woman who had been suffering from bleeding for twelve years came up behind him and touched the fringe of his garment.
translation:
  language: it
  text: Ed ecco, una donna che da dodici anni aveva perdite di sangue gli si avvicinò da dietro e toccò la frangia[a][b] della sua veste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «nappa», «orlo» o «lembo»; il termine greco può indicare la frangia o il bordo di una veste, forse comprendendo la nappa associata all’abbigliamento giudaico.
    reason: lexical_alternative
  - marker: b
    text: Per il retroterra delle frange o nappe prescritte per le vesti d’Israele, vedere Numeri 15:38 e Deuteronomio 22:12.
    reason: cross_reference
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: Ed ecco
  rationale: Mantiene il segnale discorsivo e la vivacità di ἰδού senza ometterne la funzione di richiamare l’attenzione.
- source_word: γυνὴ αἱμορροοῦσα δώδεκα ἔτη
  choice: una donna che da dodici anni aveva perdite di sangue
  rationale: Rende in italiano naturale la condizione emorragica continuativa espressa dal participio e la durata indicata dall’accusativo temporale, senza suggerire un’emorragia acuta.
- source_word: προσελθοῦσα ὄπισθεν
  choice: gli si avvicinò da dietro
  rationale: Trasforma il participio aoristo in un verbo coordinato naturale in italiano e conserva sia il movimento verso Gesù sia la provenienza da dietro.
- source_word: ἥψατο
  choice: toccò
  rationale: Nel contesto ἅπτομαι indica il contatto; «toccò» evita di intensificarlo indebitamente come se la donna avesse afferrato la veste.
- source_word: τοῦ κρασπέδου
  choice: la frangia
  rationale: κράσπεδον può indicare il bordo, l’orlo o una frangia/nappa della veste. «Frangia» conserva la probabile associazione con l’abbigliamento giudaico senza imporre nel testo una ricostruzione troppo specifica.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: della sua veste
  rationale: «Veste» è sufficientemente ampio per ἱμάτιον e non precisa il tipo di indumento più di quanto faccia il greco.
theological_decisions:
- issue: Possibile significato giudaico di κράσπεδον come frangia o nappa prescritta per le vesti
  choice: Usare «frangia» nel testo principale
  alternative: Usare «nappa» per rendere esplicito il possibile richiamo alle prescrizioni della Torah, oppure «orlo» o «lembo» per indicare più genericamente il bordo della veste
  rationale: Il termine può evocare le frange delle vesti israelite, ma il versetto non esplicita né sviluppa tale significato. «Frangia» mantiene aperta questa possibilità, mentre la nota segnala sia le alternative lessicali sia il retroterra biblico.
translation_notes:
  register: Italiano moderno, chiaro e dignitoso. «Ed ecco» conserva il tono narrativo marcato dell’originale; la costruzione con due verbi coordinati rende scorrevole in italiano il participio greco senza alterare la sequenza delle azioni.
