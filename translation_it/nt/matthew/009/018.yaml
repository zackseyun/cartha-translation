source:
  edition: SBLGNT
  text: Ταῦτα αὐτοῦ λαλοῦντος αὐτοῖς ἰδοὺ ἄρχων εἷς ⸀ἐλθὼν προσεκύνει αὐτῷ λέγων ὅτι Ἡ θυγάτηρ μου ἄρτι ἐτελεύτησεν· ἀλλὰ ἐλθὼν ἐπίθες τὴν χεῖρά σου ἐπ’ αὐτήν, καὶ ζήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/018.yaml
  text: While he was saying these things to them, look, a ruler came and bowed down before him, saying, “My daughter has just died. But come and lay your hand on her, and she will live.”
translation:
  language: it
  text: 'Mentre diceva loro queste cose, ecco, venne un capo e si prostrò davanti a lui, dicendo: «Mia figlia è appena morta; ma vieni, posa la tua mano su di lei e vivrà».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: ecco
  rationale: Mantiene il richiamo narrativo all’attenzione in una forma italiana corrente e dignitosa.
- source_word: ἄρχων
  choice: un capo
  rationale: Il termine indica genericamente una persona investita di autorità; il versetto non precisa qui la carica.
- source_word: προσεκύνει
  choice: gli si prostrò davanti
  rationale: Rende il gesto concreto di omaggio o venerazione senza decidere oltre il contesto se si tratti esplicitamente di culto divino.
- source_word: ἄρτι ἐτελεύτησεν
  choice: è appena morta
  rationale: Riproduce il valore temporale immediato di ἄρτι e il senso eufemistico di ἐτελεύτησεν.
- source_word: ἐπίθες τὴν χεῖρά σου ἐπ’ αὐτήν
  choice: posa la tua mano su di lei
  rationale: Resa naturale e fedele della richiesta di imporre o posare la mano.
- source_word: ζήσεται
  choice: vivrà
  rationale: Conserva l’affermazione fiduciosa al futuro senza aggiunte interpretative.
theological_decisions:
- issue: Valore di προσεκύνει
  choice: gli si prostrò davanti
  alternative: lo adorò
  rationale: Il verbo può esprimere omaggio, venerazione o adorazione; la resa scelta conserva il gesto e non risolve indebitamente l’ambiguità teologica.
- issue: Identità e funzione dell’ἄρχων
  choice: un capo
  alternative: un capo della sinagoga
  rationale: Matteo in questo versetto non specifica che fosse capo della sinagoga; tale precisazione deriverebbe dai paralleli e non dal testo immediato.
translation_notes:
  register: Italiano moderno standard, narrativo e dignitoso. «Ecco» conserva il segnale discorsivo greco; «capo» resta volutamente generico. La sintassi è scorrevole senza attenuare la brusca dichiarazione della morte né la certezza espressa da «vivrà».
