source:
  edition: SBLGNT
  text: Καὶ ἐγένετο αὐτοῦ ἀνακειμένου ἐν τῇ οἰκίᾳ, ⸀καὶ ἰδοὺ πολλοὶ τελῶναι καὶ ἁμαρτωλοὶ ἐλθόντες συνανέκειντο τῷ Ἰησοῦ καὶ τοῖς μαθηταῖς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/010.yaml
  text: And as he was reclining at table in the house[a], behold[b], many tax collectors and sinners came and were reclining at table with Jesus and his disciples.
translation:
  language: it
  text: Mentre egli era adagiato a tavola[a] nella casa[b], ecco, molti esattori delle imposte e peccatori vennero ed erano adagiati a tavola con Gesù e i suoi discepoli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Più idiomaticamente: «mentre mangiava nella casa». Il greco dice più precisamente che era adagiato a tavola, secondo l''uso antico durante i pasti.'
    reason: lexical_alternative
  - marker: b
    text: Il testo dice semplicemente «nella casa» e in questo versetto non precisa esplicitamente a chi appartenesse.
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ ἐγένετο αὐτοῦ ἀνακειμένου
  choice: Mentre egli era adagiato a tavola
  rationale: La costruzione καὶ ἐγένετο introduce la scena e, insieme al genitivo assoluto, ha valore soprattutto narrativo-temporale. «Mentre» la rende in un italiano scorrevole; «adagiato a tavola» conserva la postura propria dei pasti antichi espressa da ἀνάκειμαι.
- source_word: ἐν τῇ οἰκίᾳ
  choice: nella casa
  rationale: Mantiene l'articolo determinativo e il riferimento concreto del greco senza precisare a chi appartenesse la casa.
- source_word: ἰδοὺ
  choice: ecco
  rationale: Conserva la funzione del segnale discorsivo, che richiama l'attenzione sull'arrivo inatteso o rilevante delle persone menzionate.
- source_word: τελῶναι
  choice: esattori delle imposte
  rationale: È una resa moderna e immediatamente comprensibile della funzione svolta dai τελῶναι, senza dipendere dal termine tradizionale ma oggi meno trasparente «pubblicani».
- source_word: ἁμαρτωλοὶ
  choice: peccatori
  rationale: L'aggettivo sostantivato designa qui una categoria di persone; «peccatori» ne conserva sia il senso morale-religioso sia la connotazione sociale del contesto.
- source_word: ἐλθόντες
  choice: vennero
  rationale: Il participio aoristo indica l'azione che precede o accompagna il prendere posto; una forma verbale coordinata è naturale nella narrazione italiana.
- source_word: συνανέκειντο
  choice: si adagiarono a tavola con
  rationale: La resa mantiene sia la postura conviviale sia l'idea della condivisione della mensa implicita nel composto συν-.
- source_word: τῷ Ἰησοῦ καὶ τοῖς μαθηταῖς αὐτοῦ
  choice: con Gesù e i suoi discepoli
  rationale: Rende naturalmente il dativo di associazione e conserva il termine evangelico consolidato «discepoli» per μαθηταί.
theological_decisions:
- issue: Postura durante il pasto e comunione di mensa
  choice: Conservare «adagiato/adagiarono a tavola»
  alternative: «mangiava/mangiarono» oppure «era/erano a tavola»
  rationale: Il riferimento esplicito alla postura rende visibile la scena di mensa condivisa, significativa nel contesto, senza aggiungere interpretazioni dottrinali.
- issue: Identità del proprietario della casa
  choice: Non specificarla nel testo principale
  alternative: «a casa sua» oppure «a casa di Matteo»
  rationale: Il greco dice soltanto «nella casa»; l'identificazione può essere dedotta dal contesto, ma non è espressa in questo versetto.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. Si evita il tradizionale ma meno trasparente «pubblicani» a favore di «esattori delle imposte»; la formulazione conserva tuttavia la concretezza storica della postura conviviale.
