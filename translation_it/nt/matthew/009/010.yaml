    issue: Aspetto verbale di συνανέκειντο
    rationale: Il greco συνανέκειντο è imperfetto («erano adagiati/reclinavano a tavola con»), mentre «si adagiarono» presenta l'azione come puntuale e compiuta. La resa va corretta senza modificare il senso della scena.
