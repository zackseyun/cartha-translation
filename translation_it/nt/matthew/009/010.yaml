  to: Mentre egli era adagiato a tavola[a] nella casa[b], ecco, molti esattori delle imposte e peccatori vennero ed erano adagiati a tavola con Gesù e i suoi discepoli.
  rationale: Si sostituisce «si adagiarono» con «erano adagiati a tavola» per rendere l'imperfetto συνανέκειντο e la situazione di mensa condivisa in corso. Il resto del testo e le note possono restare invariati.
