source:
  edition: SBLGNT
  text: ἵνα δὲ εἰδῆτε ὅτι ἐξουσίαν ἔχει ὁ υἱὸς τοῦ ἀνθρώπου ἐπὶ τῆς γῆς ἀφιέναι ἁμαρτίας— τότε λέγει τῷ παραλυτικῷ· ⸀Ἐγερθεὶς ἆρόν σου τὴν κλίνην καὶ ὕπαγε εἰς τὸν οἶκόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/006.yaml
  text: But so that you may know that the Son of Man has authority on earth to forgive sins”—then he says to the paralytic[a], “Get up, pick up your bed[b], and go to your house.”
translation:
  language: it
  text: 'Ma perché sappiate che il Figlio dell’uomo[a] ha autorità sulla terra di perdonare i peccati» — allora dice al paralitico: «Àlzati, prendi il tuo giaciglio[b] e va’ a casa tua».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oppure «l’Essere umano» o «l’Uomo». Si mantiene la resa tradizionale perché conserva il titolo usato da Gesù e la sua probabile risonanza con Daniele 7.
    reason: lexical_alternative
  - marker: b
    text: Oppure «letto», «branda» o «pagliericcio». Il greco κλίνη può indicare un letto, un divano o un semplice giaciglio.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δὲ εἰδῆτε
  choice: Ma, perché sappiate
  rationale: δέ introduce un lieve contrasto o passaggio, mentre ἵνα esprime lo scopo; la resa conserva entrambi in un italiano naturale.
- source_word: ἐξουσίαν ἔχει
  choice: ha autorità
  rationale: ἐξουσία indica qui l’autorità o il diritto legittimo di perdonare, non soltanto la capacità di farlo.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: il Figlio dell’uomo
  rationale: Conserva l’autodesignazione tradizionale di Gesù e la sua probabile risonanza con Daniele 7, senza scioglierne l’ambiguità.
- source_word: ἐπὶ τῆς γῆς
  choice: sulla terra
  rationale: Con ἐπί e genitivo, l’espressione indica naturalmente la sfera terrestre.
- source_word: ἀφιέναι ἁμαρτίας
  choice: di perdonare i peccati
  rationale: Nel contesto ἀφίημι significa perdonare o rimettere; «perdonare i peccati» è chiaro e corrente.
- source_word: τότε λέγει
  choice: allora dice
  rationale: Mantiene il presente storico greco e la vivacità narrativa.
- source_word: τῷ παραλυτικῷ
  choice: al paralitico
  rationale: L’aggettivo è usato come sostantivo; la resa è concisa e naturale in italiano.
- source_word: Ἐγερθεὶς
  choice: Àlzati
  rationale: Il participio aoristo assume nella sequenza valore imperativale; «Àlzati» ne comunica direttamente la forza.
- source_word: ἆρόν
  choice: prendi
  rationale: αἴρω significa qui sollevare e portare con sé; «prendi» è naturale nel comando italiano.
- source_word: κλίνην
  choice: giaciglio
  rationale: κλίνη può indicare un letto, una branda o un pagliericcio; «giaciglio» conserva l’ampiezza semantica senza suggerire necessariamente un letto moderno.
- source_word: ὕπαγε
  choice: va’
  rationale: Rende in modo diretto e idiomatico il comando di andare.
- source_word: εἰς τὸν οἶκόν σου
  choice: a casa tua
  rationale: οἶκος può indicare sia la casa come edificio sia la dimora; «a casa tua» è la formulazione italiana più naturale.
theological_decisions:
- issue: Titolo cristologico ὁ υἱὸς τοῦ ἀνθρώπου
  choice: il Figlio dell’uomo
  alternative: l’Essere umano / l’Uomo
  rationale: La resa tradizionale preserva il carattere di titolo, l’autodesignazione di Gesù e la possibile allusione a Daniele 7, senza trasformarla in una parafrasi interpretativa.
- issue: Natura di ἐξουσία nel perdono dei peccati
  choice: autorità
  alternative: potere / diritto
  rationale: Il contesto sottolinea la legittima autorità di perdonare i peccati, non semplicemente la capacità di compiere un miracolo.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. Il presente storico «dice» conserva la vivacità del greco; «va’ a casa tua» evita il più rigido «va’ alla tua casa». La battuta iniziata nel contesto precedente viene chiusa dopo «peccati», quindi segue un inciso narrativo segnato dal trattino.
