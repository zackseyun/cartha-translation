  variant: modern standard Italian
source:
  edition: SBLGNT
  text: καὶ ἰδού τινες τῶν γραμματέων εἶπαν ἐν ἑαυτοῖς· Οὗτος βλασφημεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/003.yaml
  text: And behold[a], some of the scribes said among themselves, “This man is blaspheming.”
translation:
  language: it
  text: 'Ed ecco, alcuni degli scribi dissero fra sé[a]: «Costui bestemmia».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «dissero dentro di sé». L’espressione greca può indicare parole scambiate in privato oppure una riflessione interiore.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Ed
  rationale: Mantiene la semplice connessione narrativa; davanti a «ecco», l’elisione produce un italiano naturale.
- source_word: ἰδού
  choice: ecco
  rationale: Conserva la funzione deittica e richiamante l’attenzione del marcatore greco in una forma italiana corrente e dignitosa.
- source_word: τινες τῶν γραμματέων
  choice: alcuni degli scribi
  rationale: Rende esplicitamente il partitivo e mantiene il termine tradizionale e trasparente per gli esperti della Scrittura e della legge.
- source_word: εἶπαν ἐν ἑαυτοῖς
  choice: dissero fra sé
  rationale: Riproduce il verbo del dire senza ridurlo senz’altro a «pensarono» e conserva l’ambiguità fra deliberazione interiore e comunicazione privata nel gruppo.
- source_word: Οὗτος
  choice: Costui
  rationale: Rende in modo conciso il dimostrativo riferito a una persona e, nel contesto ostile, ne lascia percepire la sfumatura distaccata senza accentuarla eccessivamente.
- source_word: βλασφημεῖ
  choice: bestemmia
  rationale: Il presente italiano esprime naturalmente l’accusa formulata sul momento e mantiene il senso diretto del verbo greco.
theological_decisions:
- issue: L’accusa degli scribi contro Gesù
  choice: «Costui bestemmia»
  alternative: «Costui sta bestemmiando» / «Costui pronuncia una bestemmia»
  rationale: La resa conserva intatta l’accusa e la tensione narrativa, senza anticiparne la valutazione teologica o attenuarne la forza.
translation_notes:
  register: Italiano moderno, sobrio e dignitoso. «Ed ecco» conserva la vivacità narrativa; «scribi» mantiene il referente storico tradizionale. La nota segnala l’autentica ambiguità di ἐν ἑαυτοῖς.
