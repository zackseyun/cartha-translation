id: MAT.9.2
reference: Matthew 9:2
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ προσέφερον αὐτῷ παραλυτικὸν ἐπὶ κλίνης βεβλημένον. καὶ ἰδὼν ὁ Ἰησοῦς τὴν πίστιν αὐτῶν εἶπεν τῷ παραλυτικῷ· Θάρσει, τέκνον· ⸀ἀφίενταί ⸂σου αἱ ἁμαρτίαι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/002.yaml
  text: And behold[a], they brought to him a paralytic lying on a bed. And when Jesus saw their faith, he said to the paralytic, “Take courage, child[c][b]; your sins are forgiven.”
translation:
  language: it
  text: 'Ed ecco, gli stavano portando un paralitico disteso su un letto. Gesù, vedendo la loro fede[a], disse al paralitico: «Coraggio, figlio: i tuoi peccati sono perdonati[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il plurale «loro» può riferirsi a quelli che portarono il paralitico, oppure comprendere anche il paralitico stesso.
    reason: alternative_reading
  - marker: b
    text: 'Oppure: «ti sono perdonati».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: ecco
  rationale: Conserva la funzione vivace di richiamo e di introduzione narrativa, risultando al tempo stesso naturale nell’italiano biblico moderno.
- source_word: προσέφερον
  choice: gli portarono
  rationale: Nel contesto narrativo l’imperfetto greco presenta l’azione della scena; il passato remoto italiano rende con naturalezza l’avanzamento del racconto. «Portarono» esprime il senso contestuale senza restringerlo a «trasportarono».
- source_word: παραλυτικὸν
  choice: un paralitico
  rationale: Rende in modo conciso l’aggettivo sostantivato ed è corrente e comprensibile in italiano.
- source_word: ἐπὶ κλίνης βεβλημένον
  choice: disteso su un letto
  rationale: Descrive chiaramente la posizione dell’uomo; «letto» è una resa sicura di κλίνη, mentre «barella» o «stuoia» sarebbero più specifici del testo.
- source_word: πίστιν
  choice: fede
  rationale: È la resa italiana standard di πίστις e qui indica una fiducia resa visibile dall’azione.
- source_word: Θάρσει
  choice: Coraggio
  rationale: Formula idiomatica e diretta di rassicurazione, che conserva la forza dell’imperativo senza risultare artificiosa.
- source_word: τέκνον
  choice: figlio
  rationale: Come appellativo affettuoso rivolto a una persona, «figlio» è naturale in italiano e conserva il tono tenero di τέκνον; non implica qui una relazione biologica.
- source_word: ἀφίενταί σου αἱ ἁμαρτίαι
  choice: i tuoi peccati sono perdonati
  rationale: Il presente passivo italiano rende con chiarezza la dichiarazione greca e lascia non espresso l’agente del perdono.
- source_word: ἁμαρτίαι
  choice: peccati
  rationale: Resa standard che conserva il plurale concreto del greco.
theological_decisions:
- issue: Referente di τὴν πίστιν αὐτῶν
  choice: Mantenere «la loro fede» nel testo principale.
  alternative: Specificare che si tratta soltanto della fede di coloro che portavano il paralitico, oppure includere esplicitamente anche il paralitico.
  rationale: Il plurale greco riguarda il gruppo associato al paralitico, almeno quanti lo portarono, ma non stabilisce inequivocabilmente se comprenda anche lui. La traduzione conserva questa ambiguità.
- issue: Forza della dichiarazione di perdono
  choice: «I tuoi peccati sono perdonati», con costruzione passiva.
  alternative: «I tuoi peccati ti sono stati perdonati» oppure una formulazione attiva che nomini Dio come agente.
  rationale: Il passivo greco annuncia il perdono senza nominarne l’agente. La resa scelta preserva sia la dichiarazione presente sia la tensione narrativa riguardo all’autorità di Gesù.
translation_notes:
  register: Italiano standard moderno, dignitoso e scorrevole. «Ed ecco» conserva il tratto narrativo matteano; «Coraggio, figlio» mantiene il tono rassicurante e affettuoso. I marcatori [a] e [b] compaiono entrambi nel testo principale.
