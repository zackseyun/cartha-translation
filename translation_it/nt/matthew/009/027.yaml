id: MAT.9.27
reference: Matthew 9:27
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Καὶ παράγοντι ἐκεῖθεν τῷ Ἰησοῦ ἠκολούθησαν ⸀αὐτῷ δύο τυφλοὶ κράζοντες καὶ λέγοντες· Ἐλέησον ἡμᾶς, ⸀υἱὲ Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/027.yaml
  text: And as Jesus was passing on from there[a], two blind men followed him, crying out and saying, “Have mercy on us, Son of David.”
translation:
  language: it
  text: 'Mentre Gesù si allontanava di là, due ciechi lo seguirono, gridando: «Abbi pietà di noi, Figlio di Davide[a]!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Figlio di Davide» è un titolo regale e messianico che identifica Gesù come l’erede promesso della dinastia di Davide.
    reason: cross_reference
lexical_decisions:
- source_word: παράγοντι ἐκεῖθεν
  choice: si allontanava di là
  rationale: 'Il participio presente indica un’azione contemporanea: Gesù stava proseguendo il cammino da quel luogo. «Si allontanava di là» è naturale in italiano e conserva il movimento della narrazione.'
- source_word: ἠκολούθησαν αὐτῷ
  choice: lo seguirono
  rationale: Rende direttamente il normale significato narrativo di ἀκολουθέω, qui riferito al seguire fisicamente Gesù.
- source_word: δύο τυφλοὶ
  choice: due ciechi
  rationale: In italiano l’aggettivo sostantivato è idiomatico e il maschile plurale corrisponde alla forma greca, senza dover aggiungere «uomini».
- source_word: κράζοντες καὶ λέγοντες
  choice: 'gridando:'
  rationale: I due participi introducono un appello pronunciato ad alta voce. I due verbi greci hanno funzioni parzialmente sovrapposte; in italiano «gridando:» comunica sia la forte intensità della voce sia l’introduzione delle parole, evitando il poco naturale «gridando e dicendo».
- source_word: Ἐλέησον ἡμᾶς
  choice: Abbi pietà di noi
  rationale: Formula italiana corrente, dignitosa e precisa per la richiesta diretta di un intervento misericordioso espressa dall’imperativo aoristo.
- source_word: υἱὲ Δαυίδ
  choice: Figlio di Davide
  rationale: Conserva il titolo tradizionale e la sua risonanza regale e messianica, anziché ridurlo alla sola idea genealogica di «discendente di Davide».
theological_decisions:
- issue: Valore messianico di «Figlio di Davide»
  choice: Mantenere nel testo il titolo «Figlio di Davide»
  alternative: Esplicitare «Figlio messianico di Davide» oppure rendere «discendente di Davide»
  rationale: Il greco presenta il titolo senza spiegarlo. La resa letterale conserva tanto il suo valore regale-messianico nel Vangelo di Matteo quanto la forma concreta dell’appello dei due ciechi, senza aggiungere interpretazioni nel testo.
translation_notes:
  register: Italiano moderno, scorrevole e dignitoso. Il discorso diretto conserva l’urgenza dell’appello; il titolo cristologico resta tradizionale e non viene parafrasato. Il pleonasmo greco κράζοντες καὶ λέγοντες è reso idiomaticamente con «gridando:».
