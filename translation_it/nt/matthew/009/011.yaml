id: MAT.9.11
reference: Matthew 9:11
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: καὶ ἰδόντες οἱ Φαρισαῖοι ⸀ἔλεγον τοῖς μαθηταῖς αὐτοῦ· Διὰ τί μετὰ τῶν τελωνῶν καὶ ἁμαρτωλῶν ἐσθίει ὁ διδάσκαλος ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/011.yaml
  text: And when the Pharisees saw it[a], they were saying to his disciples, “Why does your teacher eat with tax collectors and sinners?”
translation:
  language: it
  text: 'Vedendo ciò[a], i farisei dicevano ai suoi discepoli: «Perché il vostro maestro mangia con gli esattori delle tasse e i peccatori?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Più formalmente: «E i farisei, vedendo, dicevano ai suoi discepoli…». Il participio greco non esprime l’oggetto di «vedendo»; nel contesto rimanda alla scena del pasto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: Vedendo ciò
  rationale: Il participio aoristo di ὁράω introduce la reazione dei farisei alla scena del pasto. «Ciò» rende naturale la frase italiana, pur segnalando in nota che l’oggetto resta implicito nel greco.
- source_word: ἔλεγον
  choice: dicevano
  rationale: L’imperfetto italiano conserva l’aspetto imperfettivo di ἔλεγον senza imporre l’idea più marcata di una domanda ripetuta.
- source_word: μαθηταῖς
  choice: discepoli
  rationale: È il termine italiano consueto e appropriato nel racconto evangelico per il rapporto tra maestro e discepoli.
- source_word: Διὰ τί
  choice: Perché
  rationale: Rende in modo diretto e idiomatico la domanda causale.
- source_word: τελωνῶν
  choice: esattori delle tasse
  rationale: Espressione moderna e trasparente per chi riscuoteva tributi, senza ricorrere al meno accessibile «pubblicani».
- source_word: ἁμαρτωλῶν
  choice: peccatori
  rationale: Resa diretta del termine, che conserva sia il giudizio morale sia la connotazione sociale presente nel contesto.
- source_word: ἐσθίει
  choice: mangia
  rationale: Il presente italiano corrisponde al presente greco della domanda e mantiene il senso concreto e non ricercato del verbo.
- source_word: διδάσκαλος
  choice: maestro
  rationale: «Maestro» esprime naturalmente in italiano il ruolo di insegnante e guida indicato da διδάσκαλος nel rapporto con i discepoli.
theological_decisions:
- issue: Esplicitazione dell’oggetto di «vedendo»
  choice: Aggiungere «ciò» nel testo e spiegare l’implicito in nota
  alternative: «I farisei, vedendo, dicevano...» oppure una riformulazione temporale come «Quando videro...»
  rationale: Il greco non esprime l’oggetto del participio, ma il contesto rimanda alla scena del pasto. L’italiano richiede qui una formulazione più naturale; «ciò» chiarisce il riferimento senza aggiungere un’interpretazione teologica.
translation_notes:
  register: Italiano standard moderno, chiaro e dignitoso. «Esattori delle tasse» è preferito al tradizionale «pubblicani» per immediata comprensibilità; «maestro» conserva il linguaggio proprio del rapporto maestro-discepolo.
