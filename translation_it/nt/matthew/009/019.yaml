  text: καὶ ἐγερθεὶς ὁ Ἰησοῦς ⸀ἠκολούθει αὐτῷ καὶ οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/019.yaml
  text: And Jesus rose and followed him, and his disciples did too.
translation:
  language: it
  text: Gesù si alzò e lo seguì; anche i suoi discepoli lo seguirono.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγερθεὶς
  choice: si alzò
  rationale: Il participio aoristo passivo, qui con valore intransitivo, introduce l'azione successiva. «Si alzò» è naturale nell'italiano narrativo moderno e indica chiaramente il passaggio alla partenza.
- source_word: ἠκολούθει
  choice: seguì
  rationale: L'imperfetto può presentare l'azione nel suo svolgimento, ma in questa sequenza narrativa il passato remoto italiano rende in modo naturale l'avvio e il procedere al seguito dell'uomo, senza appesantire la frase con «stava seguendo».
- source_word: αὐτῷ
  choice: lo
  rationale: Il dativo retto da ἀκολουθέω si rende idiomaticamente con il complemento oggetto italiano «lo»; il referente è il capo menzionato nel versetto precedente.
- source_word: μαθηταὶ
  choice: discepoli
  rationale: «Discepoli» è il termine corrente e preciso nel contesto evangelico per il rapporto tra maestro e discepoli; «studenti» sarebbe troppo scolastico e «seguaci» meno specifico.
- source_word: καὶ οἱ μαθηταὶ αὐτοῦ
  choice: anche i suoi discepoli lo seguirono
  rationale: Il greco coordina i discepoli senza ripetere il verbo. In italiano la ripetizione esplicita evita un'ellissi poco elegante e chiarisce che essi seguirono Gesù mentre Gesù seguiva l'uomo; «suoi» si riferisce a Gesù.
theological_decisions: []
translation_notes:
  register: Italiano standard moderno, dignitoso e scorrevole. Il punto e virgola distingue le due proposizioni coordinate e riduce la possibile ambiguità dei pronomi senza aggiungere contenuto.
