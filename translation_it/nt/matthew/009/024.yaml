  text: ⸀ἔλεγεν· Ἀναχωρεῖτε, οὐ γὰρ ἀπέθανεν τὸ κοράσιον ἀλλὰ καθεύδει· καὶ κατεγέλων αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/024.yaml
  text: He was saying[a], “Go away, for the girl has not died, but is sleeping.” And they were laughing at him.
translation:
  language: it
  text: 'Diceva: «Andate via, perché la ragazza non è morta, ma dorme». E ridevano di lui.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «lo deridevano». Il verbo greco indica un riso di scherno.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: Diceva
  rationale: L’imperfetto esprime un’azione in corso o ripetuta nella scena; «diceva» ne conserva naturalmente l’aspetto.
- source_word: Ἀναχωρεῖτε
  choice: Andate via
  rationale: L’imperativo plurale ordina ai presenti di allontanarsi; la resa è moderna, naturale e mantiene la forza del comando.
- source_word: οὐ γὰρ
  choice: perché ... non
  rationale: γάρ introduce la ragione del comando; «perché» è idiomatico nell’italiano corrente.
- source_word: ἀπέθανεν
  choice: non è morta
  rationale: L’aoristo presenta la morte come evento; in italiano «non è morta» esprime con naturalezza il risultato presente e prepara il contrasto con «dorme».
- source_word: τὸ κοράσιον
  choice: la ragazza
  rationale: κοράσιον indica una ragazza, spesso giovane; «la ragazza» è naturale e non aggiunge un’enfasi diminutiva non esplicita nel versetto.
- source_word: ἀλλὰ καθεύδει
  choice: ma dorme
  rationale: Il presente indica l’azione o condizione attuale; «dorme» conserva direttamente l’immagine e il contrasto provocatorio.
- source_word: κατεγέλων αὐτοῦ
  choice: ridevano di lui
  rationale: Il verbo significa ridere di qualcuno con scherno; l’imperfetto italiano conserva l’aspetto durativo, mentre la nota esplicita la sfumatura derisoria.
theological_decisions:
- issue: L’affermazione di Gesù che la ragazza non è morta, ma dorme
  choice: Conservare letteralmente «dorme» senza spiegazione interpretativa nel testo principale.
  alternative: Rendere «sta soltanto dormendo» oppure spiegare nel testo che il sonno è una metafora della morte.
  rationale: Il greco lascia intenzionalmente in tensione morte e sonno. La resa letterale conserva la forza narrativa e teologica senza decidere se si tratti di linguaggio metaforico, fenomenologico o anticipatorio.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. «Andate via» è diretto ma non colloquiale; «ridevano di lui» conserva l’immagine lessicale, con la sfumatura di scherno precisata in nota.
