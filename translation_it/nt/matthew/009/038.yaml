  source_fidelity: 'Il testo rende fedelmente tutti gli elementi del greco: δεήθητε («Pregate con insistenza»), l''inferenziale οὖν («dunque»), il titolo non specificato «il Signore della messe», e la richiesta introdotta da ὅπως («perché mandi»). «Nella sua messe» conserva adeguatamente εἰς e il possessivo αὐτοῦ, senza aggiungere «campo».'
