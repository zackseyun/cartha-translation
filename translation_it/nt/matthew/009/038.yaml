id: MAT.9.38
reference: Matthew 9:38
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: δεήθητε οὖν τοῦ κυρίου τοῦ θερισμοῦ ὅπως ἐκβάλῃ ἐργάτας εἰς τὸν θερισμὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/038.yaml
  text: Therefore pray earnestly to the Lord of the harvest that he would send out workers into his harvest[a].
translation:
  language: it
  text: Pregate dunque con insistenza il Signore della messe, perché mandi operai nella sua messe[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «spinga fuori gli operai»; il verbo greco è più energico del semplice «mandare», ma qui indica l’invio degli operai nella messe.
    reason: Alternativa lessicale che conserva la forza di ἐκβάλῃ senza imporre nel testo principale un’espressione poco naturale in italiano.
lexical_decisions:
- source_word: δεήθητε
  choice: Pregate con insistenza
  rationale: L’imperativo di δέομαι esprime una richiesta pressante rivolta in preghiera. «Pregate con insistenza» conserva sia il contesto della preghiera sia l’urgenza, in un italiano naturale.
- source_word: οὖν
  choice: dunque
  rationale: Segnala la conseguenza di quanto precede, cioè che la messe è abbondante ma gli operai sono pochi.
- source_word: κυρίου
  choice: Signore
  rationale: Rende κύριος nel suo senso di autorità e mantiene il consueto titolo biblico senza precisare oltre l’identità del referente.
- source_word: θερισμοῦ
  choice: messe
  rationale: «Messe» è il termine italiano tradizionale ma tuttora comprensibile per il raccolto maturo; conserva inoltre in modo conciso la metafora biblica.
- source_word: ὅπως
  choice: perché
  rationale: Introduce in modo idiomatico in italiano il contenuto e lo scopo della preghiera.
- source_word: ἐκβάλῃ
  choice: mandi
  rationale: Nel contesto indica l’invio degli operai al lavoro. «Mandi» è naturale in italiano, mentre la sfumatura più energica del verbo greco viene segnalata in nota.
- source_word: ἐργάτας
  choice: operai
  rationale: Indica persone impegnate nel lavoro della mietitura. «Operai» si accorda naturalmente con la metafora agricola e resta chiaro al lettore moderno.
- source_word: εἰς τὸν θερισμὸν αὐτοῦ
  choice: nella sua messe
  rationale: Esprime l’ingresso nella sfera e nel compito della mietitura, conserva il possessivo e non aggiunge un riferimento esplicito al campo, assente nel greco.
theological_decisions:
- issue: Identità del «Signore della messe»
  choice: Mantenere il titolo «il Signore della messe» senza identificarne esplicitamente il referente.
  alternative: Specificare il Padre, oppure Gesù.
  rationale: Il versetto non identifica espressamente il referente oltre al titolo. La formulazione conserva quindi l’ambiguità e la tensione teologica del testo.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. «Messe» conserva la metafora biblica con concisione; «con insistenza» comunica l’urgenza della richiesta senza ricorrere a un registro arcaico.
