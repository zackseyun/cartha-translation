  variant: modern standard Italian
source:
  edition: SBLGNT
  text: τότε λέγει τοῖς μαθηταῖς αὐτοῦ· Ὁ μὲν θερισμὸς πολύς, οἱ δὲ ἐργάται ὀλίγοι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/037.yaml
  text: Then he says to his disciples[a], “The harvest indeed is plentiful[b], but the workers are few.”
translation:
  language: it
  text: 'Allora dice ai suoi discepoli: «Il raccolto è abbondante, ma gli operai sono pochi».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «La messe è molta, ma i lavoratori sono pochi».'
    reason: Alternativa lessicale che riflette più letteralmente πολύς e offre «messe» e «lavoratori» come equivalenti possibili di θερισμός ed ἐργάται.
lexical_decisions:
- source_word: τότε
  choice: Allora
  rationale: Segnala in modo conciso e naturale la successione narrativa.
- source_word: λέγει
  choice: dice
  rationale: Mantiene il presente storico greco, che risulta naturale anche nella narrazione italiana e conferisce vivacità alla scena.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: ai suoi discepoli
  rationale: Conserva sia il termine consueto per μαθηταί sia il possessivo αὐτοῦ, esplicitamente presente nel testo.
- source_word: Ὁ μὲν ... οἱ δὲ
  choice: … ma …
  rationale: La costruzione μέν…δέ introduce un contrasto; in italiano il semplice «ma» ne rende con naturalezza la funzione senza appesantire la frase.
- source_word: θερισμός
  choice: raccolto
  rationale: È un equivalente moderno e comprensibile che conserva intatta l’immagine agricola; «messe» resta una valida alternativa di registro più tradizionale.
- source_word: πολύς
  choice: abbondante
  rationale: Riferito a «raccolto», esprime chiaramente la grande quantità indicata dall’aggettivo greco.
- source_word: ἐργάται
  choice: operai
  rationale: Indica le persone impegnate nel lavoro del raccolto e conserva il tradizionale contrasto metaforico senza introdurre una spiegazione.
- source_word: ὀλίγοι
  choice: pochi
  rationale: Rende direttamente l’aggettivo predicativo greco e il suo contrasto con l’abbondanza del raccolto.
theological_decisions:
- issue: Forza metaforica dell’immagine del raccolto
  choice: Conservare l’immagine agricola senza esplicitarne il referente missionario.
  alternative: Parafrasare il raccolto come le persone pronte ad accogliere il ministero di Gesù.
  rationale: Il versetto presenta la metafora senza spiegarla direttamente; esplicitarne il referente nel testo tradotto introdurrebbe un’interpretazione che appartiene al contesto.
translation_notes:
  register: Italiano moderno, chiaro e dignitoso. «Raccolto» è preferito a «messe» perché più corrente, pur mantenendo la metafora. Il presente storico «dice» segue il greco ed è idiomatico in italiano. La nota è collocata alla fine della citazione perché riguarda più scelte lessicali dell’intera proposizione.
