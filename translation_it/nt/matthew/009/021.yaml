  text: ἔλεγεν γὰρ ἐν ἑαυτῇ· Ἐὰν μόνον ἅψωμαι τοῦ ἱματίου αὐτοῦ σωθήσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/021.yaml
  text: For she was saying to herself[a], “If only I touch his garment, I will be saved.”
translation:
  language: it
  text: 'Diceva infatti fra sé: «Se anche solo toccherò il suo mantello, sarò salvata[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «sarò guarita» o «starò bene». Il greco dice «sarò salvata», usando un verbo che, in questo contesto, può anche riferirsi alla guarigione.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: Diceva
  rationale: L’imperfetto esprime un pensiero che la donna andava ripetendo o formulando interiormente; «diceva» ne conserva l’aspetto senza appesantire la frase.
- source_word: γὰρ
  choice: infatti
  rationale: Introduce la spiegazione del comportamento narrato nel contesto; «infatti» rende con naturalezza il valore esplicativo.
- source_word: ἐν ἑαυτῇ
  choice: fra sé
  rationale: Espressione italiana idiomatica per il parlare o pensare interiormente, corrispondente al riflessivo greco.
- source_word: Ἐὰν μόνον
  choice: Se solo
  rationale: Conserva sia la condizione sia l’enfasi sul fatto che basti il semplice contatto.
- source_word: ἅψωμαι
  choice: toccherò
  rationale: Il congiuntivo aoristo con ἐάν presenta una condizione futura; in italiano il futuro è naturale e mantiene il riferimento prospettico.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: il suo mantello
  rationale: Ἱμάτιον indica tipicamente una veste esterna; «mantello» è chiaro e concreto senza introdurre dettagli estranei.
- source_word: σωθήσομαι
  choice: sarò salvata
  rationale: Mantiene il valore ampio di σῴζω e la forma passiva, pur lasciando che il contesto indichi la guarigione fisica; una nota esplicita le alternative contestuali.
theological_decisions:
- issue: Resa di σωθήσομαι in un contesto di guarigione
  choice: sarò salvata
  alternative: sarò guarita; starò bene
  rationale: Il contesto immediato riguarda la guarigione corporea, ma il verbo greco σῴζω ha un campo semantico più ampio. La resa principale conserva tale ampiezza e la possibile risonanza teologica senza imporne una lettura; la nota chiarisce il senso contestuale.
translation_notes:
  register: Italiano moderno, naturale e dignitoso. «Fra sé» rende il pensiero interiore in modo idiomatico; «mantello» è accessibile e storicamente appropriato. La formulazione conserva l’ambiguità significativa di σῴζω.
