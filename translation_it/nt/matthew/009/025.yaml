  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ὅτε δὲ ἐξεβλήθη ὁ ὄχλος, εἰσελθὼν ἐκράτησεν τῆς χειρὸς αὐτῆς, καὶ ἠγέρθη τὸ κοράσιον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/025.yaml
  text: But when the crowd had been put outside[a], he went in and took her by the hand, and the girl rose.
translation:
  language: it
  text: Ma quando la folla fu fatta uscire, egli entrò, la prese per mano e la ragazza si alzò.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «la ragazza fu rialzata». Il verbo greco è formalmente passivo e può anche essere reso in questo modo.'
    reason: Preserva l'alternativa di resa del passivo ἠγέρθη senza rendere esplicita un'interpretazione teologica ulteriore.
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Ma, quando
  rationale: ὅτε introduce la proposizione temporale, mentre δέ segna una lieve transizione narrativa; «Ma, quando» conserva entrambi gli elementi in un italiano naturale.
- source_word: ἐξεβλήθη ὁ ὄχλος
  choice: la folla fu fatta uscire
  rationale: La forma passiva di ἐκβάλλω indica che la folla venne allontanata. «Fu fatta uscire» mantiene il passivo senza suggerire necessariamente un'espulsione violenta.
- source_word: εἰσελθὼν
  choice: egli entrò
  rationale: Il participio aoristo descrive un'azione precedente o strettamente connessa a quella principale; una forma verbale coordinata risulta chiara e idiomatica in italiano.
- source_word: ἐκράτησεν τῆς χειρὸς αὐτῆς
  choice: la prese per mano
  rationale: κρατέω con il genitivo significa prendere o tenere saldamente; «prendere per mano» è l'espressione italiana naturale per il gesto descritto.
- source_word: ἠγέρθη
  choice: si alzò
  rationale: Benché la forma greca sia passiva, ἐγείρω può essere usato con valore intransitivo e indicare che qualcuno si alza. «Si alzò» esprime naturalmente l'esito senza specificare oltre l'agente; la possibile resa passiva è segnalata in nota.
- source_word: τὸ κοράσιον
  choice: la ragazza
  rationale: κοράσιον indica una bambina o giovane ragazza; «la ragazza» è chiaro, sobrio e adeguato al contesto.
theological_decisions:
- issue: Resa di ἠγέρθη nel contesto del ritorno in vita della ragazza
  choice: si alzò
  alternative: fu rialzata; fu risuscitata
  rationale: Il passivo greco può essere reso idiomaticamente come un intransitivo, ma può anche mettere in rilievo l'azione esercitata sulla ragazza. Il testo principale evita di precisare l'agente oltre quanto faccia la clausola, mentre la nota conserva l'alternativa passiva e la sua possibile risonanza di risurrezione.
translation_notes:
  register: Italiano moderno, dignitoso e narrativamente scorrevole. Si conserva il passivo nell'allontanamento della folla e si evita un lessico che suggerisca una violenza non richiesta dal contesto. Il pronome «egli» rende esplicito il soggetto sottinteso del participio greco senza introdurne uno nuovo.
