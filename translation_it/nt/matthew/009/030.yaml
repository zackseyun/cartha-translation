  text: καὶ ἠνεῴχθησαν αὐτῶν οἱ ὀφθαλμοί. καὶ ⸀ἐνεβριμήθη αὐτοῖς ὁ Ἰησοῦς λέγων· Ὁρᾶτε μηδεὶς γινωσκέτω·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/030.yaml
  text: And their eyes were opened[a]. And Jesus sternly warned them, saying[b], “See that no one knows.”
translation:
  language: it
  text: 'E i loro occhi si aprirono. Gesù li ammonì severamente[a], dicendo: «Badate che nessuno lo sappia[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «ingiunse loro con fermezza» o «li avvertì severamente». Il verbo greco esprime forte emozione e particolare energia nell’ammonimento.'
    reason: lexical_alternative
  - marker: b
    text: 'Alla lettera: «che nessuno sappia». Il pronome «lo», riferito implicitamente alla guarigione, non è espresso nel greco.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠνεῴχθησαν
  choice: si aprirono
  rationale: L’aoristo passivo di ἀνοίγω è reso con il passivo pronominale italiano, che conserva l’idea dell’apertura degli occhi senza esplicitare l’agente.
- source_word: οἱ ὀφθαλμοί
  choice: i loro occhi
  rationale: Riproduce in italiano corrente il possessivo espresso dal greco αὐτῶν.
- source_word: ἐνεβριμήθη
  choice: ammonì severamente
  rationale: Il verbo esprime forte partecipazione emotiva e un’ingiunzione energica; questa resa comunica entrambe senza suggerire necessariamente un rimprovero per una colpa.
- source_word: Ὁρᾶτε
  choice: Badate che
  rationale: L’imperativo introduce idiomaticamente un comando di vigilanza; «Badate che» ne conserva la forza in italiano naturale.
- source_word: μηδεὶς γινωσκέτω
  choice: nessuno lo sappia
  rationale: Il presente imperativo con μηδείς esprime una proibizione. Il pronome «lo», richiesto dall’italiano corrente, rinvia implicitamente alla guarigione, mentre nel greco l’oggetto non è espresso.
- source_word: λέγων
  choice: dicendo
  rationale: Conserva il legame participiale tra il severo ammonimento di Gesù e le parole che ne costituiscono il contenuto.
theological_decisions:
- issue: Forza del comando di Gesù dopo la guarigione
  choice: Gesù impartisce una proibizione energica, resa con «li ammonì severamente».
  alternative: Gesù li rimproverò; Gesù ordinò loro severamente.
  rationale: Il testo mostra la forza del comando ma non ne spiega il motivo. La resa evita sia di attenuarlo sia di attribuire ai guariti una colpa non dichiarata.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. La coordinazione iniziale conserva il ritmo narrativo greco; «Badate che» mantiene la solennità e la forza dell’ingiunzione senza risultare arcaico.
