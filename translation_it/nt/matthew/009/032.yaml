  text: Αὐτῶν δὲ ἐξερχομένων ἰδοὺ προσήνεγκαν αὐτῷ ⸀ἄνθρωπον κωφὸν δαιμονιζόμενον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/032.yaml
  text: As they were going out[a], behold, they brought to him a mute[c][b], demon-possessed man.
translation:
  language: it
  text: Mentre uscivano, ecco, gli portarono un uomo muto[a], indemoniato[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il termine greco tradotto «muto» può significare anche «sordo», secondo il contesto. Qui il versetto seguente, dicendo che l’uomo parlò, favorisce «muto».
    reason: lexical_alternative
  - marker: b
    text: Oppure «posseduto da un demonio».
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτῶν δὲ ἐξερχομένων
  choice: Mentre uscivano
  rationale: Rende in modo naturale il genitivo assoluto con valore temporale; δέ segnala il passaggio nella narrazione e non richiede necessariamente una congiunzione esplicita in italiano.
- source_word: ἰδοὺ
  choice: ecco
  rationale: Conserva la vivacità narrativa e la funzione di richiamo dell’attenzione.
- source_word: προσήνεγκαν αὐτῷ
  choice: gli portarono
  rationale: Rende idiomaticamente il senso di condurre o portare qualcuno da Gesù e incorpora il valore di αὐτῷ.
- source_word: ἄνθρωπον
  choice: un uomo
  rationale: Nel racconto indica un individuo adulto di sesso maschile.
- source_word: κωφὸν
  choice: muto
  rationale: κωφός può indicare sordità o mutismo; il versetto seguente, nel quale l’uomo parla, favorisce qui il senso «muto».
- source_word: δαιμονιζόμενον
  choice: indemoniato
  rationale: È la resa italiana corrente e concisa della condizione descritta, senza precisarne oltre il testo la modalità.
theological_decisions:
- issue: Descrizione dell’afflizione demoniaca
  choice: indemoniato
  alternative: sotto il potere di un demonio
  rationale: Mantiene l’affermazione narrativa di una reale afflizione demoniaca senza introdurre una teoria specifica sulla natura o sul grado di tale condizione.
translation_notes:
  register: Italiano standard moderno, dignitoso e scorrevole. «Ecco» conserva il rilievo narrativo dell’originale; «indemoniato» è comprensibile e tradizionale senza risultare inutilmente tecnico.
