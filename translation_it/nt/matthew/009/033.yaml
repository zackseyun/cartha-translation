id: MAT.9.33
reference: Matthew 9:33
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: καὶ ἐκβληθέντος τοῦ δαιμονίου ἐλάλησεν ὁ κωφός. καὶ ἐθαύμασαν οἱ ὄχλοι λέγοντες· Οὐδέποτε ἐφάνη οὕτως ἐν τῷ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/033.yaml
  text: And when the demon had been cast out[a], the mute man spoke. And the crowds were amazed, saying, “Never has anything like this appeared in Israel.”
translation:
  language: it
  text: 'E, dopo che il demonio fu scacciato, il muto[a] parlò. E le folle rimasero stupite e dissero: «Non si è mai vista una cosa simile in Israele!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «il sordo». Il termine greco può indicare una persona sorda o muta; qui il contesto favorisce «muto», perché si sottolinea che parlò.'
    reason: alternativa_lessicale
lexical_decisions:
- source_word: ἐκβληθέντος
  choice: dopo che ... fu scacciato
  rationale: Il participio aoristo passivo in genitivo assoluto esprime un'azione anteriore rispetto a «parlò»; questa formulazione ne rende con naturalezza il valore temporale.
- source_word: τοῦ δαιμονίου
  choice: il demonio
  rationale: Nel contesto evangelico di esorcismo, δαιμόνιον indica precisamente un demonio; la forma determinata italiana rispecchia l'articolo greco.
- source_word: ἐλάλησεν
  choice: parlò
  rationale: L'aoristo semplice di λαλέω non richiede l'aggiunta di un valore ingressivo come «cominciò a parlare».
- source_word: ὁ κωφός
  choice: il muto
  rationale: κωφός può indicare una persona sorda oppure muta, ma qui il risultato immediato, «parlò», mette in primo piano l'incapacità di parlare.
- source_word: ἐθαύμασαν
  choice: rimasero stupite
  rationale: Rende in italiano corrente e dignitoso la forte meraviglia espressa dal verbo, concordando naturalmente con «le folle».
- source_word: οἱ ὄχλοι
  choice: le folle
  rationale: Conserva il plurale del greco con la normale espressione italiana.
- source_word: Οὐδέποτε
  choice: Non ... mai
  rationale: La negazione italiana discontinua rende idiomaticamente l'avverbio assoluto «mai».
- source_word: ἐφάνη οὕτως
  choice: si è mai vista una cosa simile
  rationale: Il passivo ἐφάνη può significare «apparve» o, idiomaticamente, «fu vista». In questa esclamazione l'impersonale italiano con «una cosa simile» esprime con naturalezza il carattere senza precedenti dell'accaduto.
- source_word: ἐν τῷ Ἰσραήλ
  choice: in Israele
  rationale: È la resa italiana diretta e naturale, lasciando aperto se il riferimento sia soprattutto al paese o al popolo.
theological_decisions:
- issue: Ampiezza semantica di κωφός nel racconto di guarigione ed esorcismo
  choice: il muto
  alternative: il sordo
  rationale: Benché il termine possa designare sia sordità sia mutismo, l'affermazione immediatamente seguente, «parlò», favorisce qui il senso di «muto», senza aggiungere una seconda menomazione non esplicitata dal contesto.
- issue: Soggetto implicito di ἐφάνη
  choice: una cosa simile
  alternative: così non si è mai visto in Israele
  rationale: Il greco non esprime un soggetto nominale. La formulazione italiana fornisce il minimo necessario per una frase naturale, senza identificare più precisamente l'evento né spiegarne il significato teologico.
translation_notes:
  register: Italiano moderno standard, chiaro e dignitoso. «Demonio» mantiene la precisione del lessico evangelico; «rimasero stupite» evita sia un tono arcaico sia uno colloquiale. La coordinazione iniziale conserva il ritmo narrativo del greco.
