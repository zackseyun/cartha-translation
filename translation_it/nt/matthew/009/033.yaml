  to: 'E, dopo che il demonio fu scacciato, il muto[a] parlò. E le folle rimasero stupite e dissero: «Non si è mai vista una cosa simile in Israele!»'
  rationale: La revisione aggiunge la necessaria nota sull'ambiguità di κωφός e sostituisce «dicevano» con «dissero» per una costruzione italiana più naturale davanti alla citazione, senza modificare il significato del passo. Ripristina inoltre la seconda coordinazione narrativa presente nel greco.
