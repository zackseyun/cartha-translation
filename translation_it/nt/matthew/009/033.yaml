  source_fidelity: La resa conserva correttamente la successione dell'espulsione del demonio e della parola del κωφός, il plurale di οἱ ὄχλοι e l'affermazione di eccezionalità in Israele. «Muto» è la scelta contestualmente preferibile, ma κωφός resta lessicalmente ambiguo e richiede una nota. Il participio λέγοντες è reso più idiomaticamente con «e dissero» rispetto all'imperfetto «dicevano» del testo proposto.
  naturalness: «Dopo che ... fu scacciato» e «rimasero stupite» sono italiano moderno standard e di registro appropriato. «E dissero» evita l'accostamento poco armonico di passato remoto («rimasero») e imperfetto («dicevano») davanti a una citazione puntuale.
  terminology: «Demonio» rende appropriatamente δαιμόνιον nel contesto di esorcismo. «Il muto» rispecchia il referente sottinteso e il risultato «parlò», senza affermare che la persona fosse anche sorda; la nota conserva l'alternativa lessicale.
