source:
  edition: SBLGNT
  text: ἐλθόντι δὲ εἰς τὴν οἰκίαν προσῆλθον αὐτῷ οἱ τυφλοί, καὶ λέγει αὐτοῖς ὁ Ἰησοῦς· Πιστεύετε ὅτι δύναμαι τοῦτο ποιῆσαι; λέγουσιν αὐτῷ· Ναί, κύριε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/028.yaml
  text: When he entered the house[a], the blind men approached him, and Jesus said to them, “Do you believe that I am able to do this?” They said to him, “Yes[b], Lord.”
translation:
  language: it
  text: 'Quando entrò nella casa, i ciechi gli si avvicinarono e Gesù disse loro: «Credete che io sia in grado di fare questo?» Gli risposero: «Sì, Signore[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Il greco può anche essere inteso come un appellativo rispettoso: «Sì, signore». «Signore» conserva inoltre la possibile allusione all''autorità di Gesù.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλθόντι δὲ εἰς τὴν οἰκίαν
  choice: Quando entrò in casa
  rationale: Il participio aoristo introduce temporalmente l'evento successivo. «Entrò in casa» esprime in italiano corrente e conciso il movimento verso l'interno indicato da εἰς, senza appesantire la frase.
- source_word: προσῆλθον αὐτῷ οἱ τυφλοί
  choice: i ciechi gli si avvicinarono
  rationale: προσέρχομαι indica l'avvicinarsi a qualcuno. Il sostantivato οἱ τυφλοί è reso naturalmente con «i ciechi»; il contesto precedente chiarisce che si tratta di due uomini.
- source_word: λέγει αὐτοῖς ὁ Ἰησοῦς
  choice: Gesù disse loro
  rationale: Benché il greco usi il presente storico, il passato remoto è il tempo narrativo più naturale nel contesto italiano e conserva senza ambiguità la successione degli eventi.
- source_word: Πιστεύετε ὅτι δύναμαι τοῦτο ποιῆσαι
  choice: Credete che io sia in grado di fare questo?
  rationale: «Essere in grado» rende esplicitamente la capacità espressa da δύναμαι, mentre «fare questo» mantiene il riferimento contestuale alla guarigione senza aggiungerla nel testo.
- source_word: λέγουσιν αὐτῷ
  choice: Gli risposero
  rationale: Nel contesto dialogico λέγουσιν introduce la risposta dei ciechi. «Gli risposero» è idiomatico in italiano; il passato remoto armonizza il periodo narrativo.
- source_word: Ναί, κύριε
  choice: Sì, Signore
  rationale: Ναί è una semplice affermazione. «Signore» conserva sia il valore di appellativo rispettoso sia la possibile, più profonda, attribuzione di autorità a Gesù.
theological_decisions:
- issue: Valore di κύριε rivolto a Gesù
  choice: Signore
  alternative: signore / padrone, come appellativo rispettoso
  rationale: Il termine può essere una forma rispettosa di allocuzione, ma può anche esprimere il riconoscimento dell'autorità di Gesù. «Signore» nel testo preserva questa tensione senza trasformare necessariamente la risposta in una confessione cristologica pienamente sviluppata.
- issue: Domanda sulla capacità di Gesù
  choice: che io sia in grado di fare questo
  alternative: che io possa fare questo
  rationale: La formulazione scelta mette in rilievo la capacità indicata da δύναμαι e non sposta la domanda verso il semplice permesso o la mera possibilità.
translation_notes:
  register: Italiano moderno, scorrevole e dignitoso. Il passato remoto sostiene la narrazione evangelica senza risultare arcaico; il discorso diretto resta semplice e immediato. La nota conserva l'ambiguità semantica di κύριε.
