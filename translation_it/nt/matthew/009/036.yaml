id: MAT.9.36
reference: Matthew 9:36
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Ἰδὼν δὲ τοὺς ὄχλους ἐσπλαγχνίσθη περὶ αὐτῶν ὅτι ἦσαν ἐσκυλμένοι καὶ ἐρριμμένοι ⸀ὡσεὶ πρόβατα μὴ ἔχοντα ποιμένα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/036.yaml
  text: And when he saw the crowds[a], he had compassion on them, because they were harassed and cast down, like sheep without a shepherd.
translation:
  language: it
  text: Quando vide le folle, ne ebbe compassione, perché erano maltrattate e abbattute[a], come pecore senza pastore.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «stremate e indifese». I termini greci possono descrivere le folle come vessate e prostrate, oppure, in modo più interpretativo, come logorate e incapaci di provvedere a sé stesse.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδὼν δὲ
  choice: Quando vide
  rationale: Il participio aoristo è reso con una subordinata temporale naturale in italiano; δέ svolge qui una lieve funzione di raccordo narrativo che non richiede una congiunzione esplicita.
- source_word: τοὺς ὄχλους
  choice: le folle
  rationale: Resa corrente e precisa per gruppi numerosi di persone, senza il tono antiquato di «moltitudini».
- source_word: ἐσπλαγχνίσθη περὶ αὐτῶν
  choice: ne ebbe compassione
  rationale: Esprime la profonda partecipazione misericordiosa indicata dal verbo greco in una forma italiana naturale e dignitosa.
- source_word: ὅτι
  choice: perché
  rationale: Introduce chiaramente la causa della compassione di Gesù.
- source_word: ἐσκυλμένοι
  choice: maltrattate
  rationale: Il participio può indicare persone tormentate, vessate o logorate; «maltrattate» conserva l'idea di un'azione subita senza specificarne indebitamente la natura.
- source_word: καὶ ἐρριμμένοι
  choice: e abbattute
  rationale: Conserva sia l'immagine di chi è stato gettato a terra sia il valore figurato di prostrazione, evitando la resa più interpretativa «indifese».
- source_word: ὡσεὶ πρόβατα
  choice: come pecore
  rationale: Riproduce con naturalezza il paragone introdotto da ὡσεί.
- source_word: μὴ ἔχοντα ποιμένα
  choice: senza pastore
  rationale: Resa idiomatica e concisa che mantiene intatta l'immagine pastorale della vulnerabilità e della mancanza di guida.
theological_decisions:
- issue: Linguaggio della compassione di Gesù
  choice: ne ebbe compassione
  alternative: fu mosso a compassione per loro
  rationale: La formulazione scelta comunica la profondità della misericordia di Gesù senza ricorrere a un calco più tradizionale e meno naturale.
- issue: Condizione delle folle
  choice: maltrattate e abbattute
  alternative: stremate e indifese
  rationale: La scelta resta vicina alle immagini dei due participi passivi greci, che presentano le folle come vessate e gettate a terra, senza ridurre il secondo termine alla sola incapacità di difendersi.
translation_notes:
  register: Italiano standard moderno, chiaro e dignitoso. La sintassi è scorrevole, mentre «maltrattate e abbattute» conserva la concretezza e la tensione delle immagini greche. Il richiamo di nota è collocato dopo i termini a cui si riferisce.
