id: MAT.9.35
reference: Matthew 9:35
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Καὶ περιῆγεν ὁ Ἰησοῦς τὰς πόλεις πάσας καὶ τὰς κώμας, διδάσκων ἐν ταῖς συναγωγαῖς αὐτῶν καὶ κηρύσσων τὸ εὐαγγέλιον τῆς βασιλείας καὶ θεραπεύων πᾶσαν νόσον καὶ πᾶσαν ⸀μαλακίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/035.yaml
  text: And Jesus went throughout all the cities and villages[b][a], teaching in their synagogues and proclaiming the good news of the kingdom and healing every disease and every sickness.
translation:
  language: it
  text: Gesù percorreva tutte le città e tutti i villaggi, insegnando nelle loro sinagoghe, proclamando la buona notizia del regno[a] e guarendo ogni malattia e ogni infermità[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «il vangelo del regno».
    reason: lexical_alternative
  - marker: b
    text: O «ogni malattia e ogni debolezza».
    reason: lexical_alternative
lexical_decisions:
- source_word: περιῆγεν
  choice: percorreva
  rationale: L’imperfetto esprime un’attività itinerante continuata o abituale; «percorreva» la rende in modo naturale e conciso.
- source_word: πόλεις πάσας καὶ τὰς κώμας
  choice: tutte le città e i villaggi
  rationale: Conserva la distinzione tra centri urbani e insediamenti minori, applicando naturalmente «tutte» all’insieme coordinato.
- source_word: διδάσκων
  choice: insegnando
  rationale: Rende direttamente il participio presente e l’azione concomitante.
- source_word: ἐν ταῖς συναγωγαῖς αὐτῶν
  choice: nelle loro sinagoghe
  rationale: Mantiene sia il termine storico-religioso sia il pronome αὐτῶν, riferito alle comunità dei luoghi attraversati.
- source_word: κηρύσσων
  choice: proclamando
  rationale: Conserva la forza pubblica e araldica di κηρύσσω senza restringerla al senso ecclesiastico moderno di «predicare».
- source_word: τὸ εὐαγγέλιον τῆς βασιλείας
  choice: la buona notizia del regno
  rationale: «Buona notizia» comunica in modo trasparente il senso di εὐαγγέλιον; il genitivo «del regno» resta volutamente non esplicitato.
- source_word: θεραπεύων
  choice: guarendo
  rationale: È la resa italiana più naturale nel contesto delle guarigioni operate da Gesù.
- source_word: πᾶσαν νόσον
  choice: ogni malattia
  rationale: Rende il comune significato patologico di νόσος e conserva il valore distributivo di πᾶσαν.
- source_word: πᾶσαν μαλακίαν
  choice: ogni infermità
  rationale: «Infermità» conserva l’idea di debolezza o condizione debilitante e mantiene una distinzione lessicale rispetto a νόσος.
theological_decisions:
- issue: Resa di εὐαγγέλιον
  choice: buona notizia
  alternative: vangelo
  rationale: La resa trasparente comunica il significato lessicale nel moderno italiano senza eliminare l’alternativa tradizionale, riportata in nota.
- issue: Rapporto espresso da τῆς βασιλείας
  choice: del regno
  alternative: riguardo al regno
  rationale: Il genitivo greco può essere compreso in più modi; la costruzione italiana conserva la concisione e l’ambiguità del testo senza specificarne indebitamente il rapporto.
- issue: Portata di πᾶσαν νόσον καὶ πᾶσαν μαλακίαν
  choice: ogni malattia e ogni infermità
  alternative: ogni malattia e ogni debolezza
  rationale: La ripetizione di «ogni» conserva l’enfasi comprensiva del greco, mentre due termini distinti evitano di appiattire la coppia lessicale.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. La struttura con verbo finito all’imperfetto e tre gerundi conserva il carattere continuativo delle attività. «Regno» resta minuscolo secondo l’uso italiano comune e senza aggiunte interpretative.
