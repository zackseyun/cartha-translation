  source_fidelity: Il testo rende correttamente l’imperfetto itinerante di περιῆγεν, i tre participi presenti e la coppia distinta νόσος/μαλακία. Tuttavia, in italiano «tutte le città e i villaggi» fa concordare esplicitamente «tutte» solo con «città»; ripetere «tutti» rende senza possibile attenuazione il valore inclusivo di πάσας applicato alla coordinazione.
