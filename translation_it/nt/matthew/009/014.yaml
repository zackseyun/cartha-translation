  text: Τότε προσέρχονται αὐτῷ οἱ μαθηταὶ Ἰωάννου λέγοντες· Διὰ τί ἡμεῖς καὶ οἱ Φαρισαῖοι νηστεύομεν ⸀πολλά, οἱ δὲ μαθηταί σου οὐ νηστεύουσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/014.yaml
  text: Then John's disciples came to him[a], saying, “Why do we and the Pharisees fast often, but your disciples do not fast?”
translation:
  language: it
  text: 'Allora si avvicinarono a lui i discepoli di Giovanni e gli dissero: «Perché noi e i farisei digiuniamo spesso[a], mentre i tuoi discepoli non digiunano?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «digiuniamo molto» oppure «digiuniamo molte volte»; il greco πολλά, unito a «digiuniamo», esprime una pratica frequente.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Allora
  rationale: Segna in modo naturale la successione temporale e narrativa.
- source_word: προσέρχονται αὐτῷ
  choice: si avvicinarono a lui
  rationale: Rende il movimento verso Gesù; il presente storico greco è tradotto con il passato remoto, naturale nella narrazione italiana.
- source_word: οἱ μαθηταὶ Ἰωάννου
  choice: i discepoli di Giovanni
  rationale: È la forma italiana corrente e mantiene il rapporto espresso dal genitivo.
- source_word: λέγοντες
  choice: e gli dissero
  rationale: Scioglie il participio contemporaneo in una coordinata idiomatica senza modificarne il contenuto.
- source_word: Διὰ τί
  choice: Perché
  rationale: Equivalente interrogativo diretto e naturale.
- source_word: ἡμεῖς καὶ οἱ Φαρισαῖοι
  choice: noi e i farisei
  rationale: Conserva il pronome enfatico e l'accostamento esplicito dei due gruppi.
- source_word: νηστεύομεν
  choice: digiuniamo
  rationale: È il termine religioso standard per l'astensione dal cibo.
- source_word: πολλά
  choice: spesso
  rationale: Usato avverbialmente con νηστεύομεν, indica verosimilmente frequenza; la nota conserva le alternative più letterali.
- source_word: οἱ δὲ μαθηταί σου
  choice: mentre i tuoi discepoli
  rationale: «Mentre» esprime con naturalezza il contrasto introdotto da δέ, senza accentuarlo oltre il testo.
- source_word: οὐ νηστεύουσιν
  choice: non digiunano
  rationale: Il presente esprime qui una pratica abituale in contrasto con quella degli altri gruppi.
theological_decisions:
- issue: Natura della domanda sul digiuno
  choice: Presentare la domanda come confronto tra pratiche abituali di digiuno.
  alternative: Intenderla come accusa esplicita di trascurare un obbligo, oppure come riferimento a un unico digiuno in corso.
  rationale: I presenti verbali e πολλά indicano una prassi ricorrente; la resa non aggiunge né un giudizio dottrinale né una specifica occasione non dichiarata.
translation_notes:
  register: Italiano moderno standard, dignitoso e accessibile. Il passato remoto sostiene il registro narrativo biblico senza risultare arcaico; «farisei» è scritto in minuscolo secondo l'uso italiano corrente.
