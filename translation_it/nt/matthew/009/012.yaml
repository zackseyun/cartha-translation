  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ὁ ⸀δὲ ἀκούσας ⸀εἶπεν· Οὐ χρείαν ἔχουσιν οἱ ἰσχύοντες ἰατροῦ ἀλλὰ οἱ κακῶς ἔχοντες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/012.yaml
  text: But when he heard it[a], he said, “Those who are well have no need of a physician, but those who are sick do.”
translation:
  language: it
  text: 'Ma egli, udito ciò, disse: «Non sono i sani ad aver bisogno del medico, ma i malati.»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσας
  choice: udito ciò
  rationale: Il participio aoristo ha valore temporale e rimanda implicitamente alle parole appena pronunciate; «ciò» rende esplicito in modo naturale l’oggetto sottinteso.
- source_word: δὲ
  choice: Ma
  rationale: Segna qui un lieve contrasto, introducendo la risposta di Gesù all’obiezione precedente.
- source_word: εἶπεν
  choice: disse
  rationale: Rende senza sovrainterpretazione il comune verbo di dire; il greco non specifica formalmente «rispose».
- source_word: Οὐ χρείαν ἔχουσιν
  choice: Non sono ... ad aver bisogno
  rationale: Costruzione italiana naturale che conserva il concetto nominale di bisogno e mette in rilievo il contrasto tra i due gruppi.
- source_word: οἱ ἰσχύοντες
  choice: i sani
  rationale: Benché il verbo indichi fondamentalmente forza, nel contrasto medico con οἱ κακῶς ἔχοντες designa idiomaticamente chi sta bene o è sano.
- source_word: ἰατροῦ
  choice: del medico
  rationale: «Medico» è il termine moderno, dignitoso e ordinario; l’articolo determinativo è naturale nell’espressione proverbiale italiana.
- source_word: οἱ κακῶς ἔχοντες
  choice: i malati
  rationale: L’espressione idiomatica significa coloro che stanno male, qui chiaramente in senso fisico nell’immagine medica.
theological_decisions:
- issue: Senso metaforico rispetto al senso fisico del proverbio
  choice: Formulare il detto in termini medici, lasciando che il contesto ne mostri l’applicazione spirituale.
  alternative: Esplicitare nella traduzione il bisogno spirituale dei peccatori.
  rationale: Il versetto presenta letteralmente un proverbio medico. Esplicitarne l’applicazione spirituale nel testo risolverebbe una tensione che il greco lascia al contesto.
translation_notes:
  register: Italiano moderno standard, naturale e dignitoso. La formulazione proverbiale è concisa; «i sani» e «i malati» rende chiaramente il contrasto idiomatico senza appesantirlo. Nessuna nota è necessaria, poiché l’alternativa «quelli che stanno bene/quelli che stanno male» non introduce una differenza sostanziale.
