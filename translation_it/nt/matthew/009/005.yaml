source:
  edition: SBLGNT
  text: τί γάρ ἐστιν εὐκοπώτερον, εἰπεῖν· ⸀Ἀφίενταί σου αἱ ἁμαρτίαι, ἢ εἰπεῖν· ⸀Ἔγειρε καὶ περιπάτει;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/005.yaml
  text: 'For which is easier: to say[a], ‘Your sins are forgiven,’ or to say, ‘Get up and walk’?”'
translation:
  language: it
  text: 'Che cosa, infatti, è più facile: dire: «I tuoi peccati sono perdonati[a]», oppure dire: «Àlzati e cammina»?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «I tuoi peccati ti sono stati perdonati». Il presente passivo greco può indicare uno stato risultante.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γάρ ἐστιν εὐκοπώτερον
  choice: Che cosa, infatti, è più facile
  rationale: τί con il comparativo εὐκοπώτερον introduce una scelta fra due possibilità. «Che cosa... è più facile» è naturale in italiano; «infatti» conserva il valore esplicativo di γάρ e il legame con il versetto precedente.
- source_word: εἰπεῖν
  choice: dire
  rationale: L’infinito indica il semplice atto del parlare; «dire» è la resa diretta e viene mantenuta in entrambe le proposizioni.
- source_word: Ἀφίενταί σου αἱ ἁμαρτίαι
  choice: I tuoi peccati sono perdonati
  rationale: ἀφίενταί è un presente indicativo passivo con «i peccati» come soggetto. La formulazione italiana rende naturalmente il valore passivo e può esprimere lo stato risultante senza precisare più del greco il momento del perdono.
- source_word: ἁμαρτίαι
  choice: peccati
  rationale: È l’equivalente italiano standard e adeguato al contesto, senza espansioni metaforiche.
- source_word: Ἔγειρε
  choice: Àlzati
  rationale: L’imperativo aoristo di ἐγείρω, in un contesto di guarigione, comanda alla persona di levarsi. «Àlzati» è moderno, diretto e naturale.
- source_word: καὶ περιπάτει
  choice: e cammina
  rationale: L’imperativo presente di περιπατέω indica il camminare successivo all’alzarsi; in italiano «e cammina» ne esprime con naturalezza la forza.
- source_word: σου
  choice: tuoi
  rationale: Il genitivo di seconda persona singolare è reso con il possessivo italiano al plurale, concordato con «peccati», mantenendo l’indirizzo individuale.
theological_decisions:
- issue: Resa della dichiarazione di perdono pronunciata da Gesù
  choice: I tuoi peccati sono perdonati
  alternative: I tuoi peccati ti sono stati perdonati
  rationale: Il presente passivo greco non impone di specificare ulteriormente la collocazione temporale dell’atto. La resa scelta conserva la dichiarazione e la sua tensione contestuale riguardo all’autorità di Gesù, senza introdurre una precisazione teologica estranea.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. La struttura interrogativa conserva il parallelismo fra i due «dire»; «infatti» mantiene il nesso esplicativo. L’accento grafico in «Àlzati» evita ambiguità di lettura nell’imperativo.
