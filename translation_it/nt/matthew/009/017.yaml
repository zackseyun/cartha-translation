revisions:
- from: E non si mette vino nuovo in otri vecchi; altrimenti gli otri si spaccano, il vino si versa e gli otri vanno perduti. Il vino nuovo, invece, si mette in otri nuovi[a], e così si conservano entrambi.
  to: Né si mette vino nuovo in otri vecchi; altrimenti gli otri si spaccano, il vino si spande e gli otri vanno perduti. Il vino nuovo, invece, si mette in otri nuovi[a], e così si conservano entrambi.
  rationale: 'Le revisioni sono stilistiche e lessicali minime: rendono più esplicito il valore di οὐδέ e più naturale la descrizione del vino che fuoriesce, mantenendo intatto il senso del passo. La nota conserva la distinzione tra νέος e καινός senza sovraccaricarla di implicazioni interpretative.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:44:15Z'
review_pass:
  verdict: revise
  source_fidelity: 'La resa segue fedelmente la sequenza e il contrasto del greco: divieto, conseguenza («altrimenti») e pratica alternativa. «Otri» riproduce adeguatamente ἀσκοί e «si conservano entrambi» mantiene il riferimento congiunto a vino e otri.'
  naturalness: Il testo è generalmente naturale e di registro appropriato. «Né» rende meglio di «E non» la forza additiva-negativa di οὐδέ. Per il vino che fuoriesce da otri rotti, «si spande» è più idiomatico e meno ambiguo di «si versa».
  terminology: «Vino nuovo», «otri vecchi» e «otri nuovi» sono scelte corrette e correnti. Poiché l’italiano non distingue in modo naturale νέος e καινός in questa collocazione, la nota è utile; va però formulata senza suggerire che καινός significhi propriamente «rinnovato».
  issues:
  - severity: low
    issue: Resa di οὐδέ
    rationale: «E non si mette» è possibile, ma «Né si mette» conserva più precisamente il valore di «neppure/nor» con cui il detto aggiunge un ulteriore esempio negativo.
  - severity: low
    issue: Resa di ἐκχεῖται
    rationale: «Il vino si versa» può evocare anche un versamento intenzionale; «il vino si spande» descrive più direttamente la fuoriuscita conseguente alla rottura degli otri.
  - severity: low
    issue: Definizione di καινός nella nota
    rationale: «Nuovi o rinnovati» rischia di introdurre «rinnovati» come significato lessicale principale. È più prudente parlare di otri nuovi/freschi, cioè idonei per la loro condizione.
  revised_text: Né si mette vino nuovo in otri vecchi; altrimenti gli otri si spaccano, il vino si spande e gli otri vanno perduti. Il vino nuovo, invece, si mette in otri nuovi[a], e così si conservano entrambi.
