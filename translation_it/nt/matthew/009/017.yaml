id: MAT.9.17
reference: Matthew 9:17
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: οὐδὲ βάλλουσιν οἶνον νέον εἰς ἀσκοὺς παλαιούς· εἰ δὲ μή γε, ῥήγνυνται οἱ ἀσκοί, καὶ ὁ οἶνος ἐκχεῖται καὶ οἱ ἀσκοὶ ⸀ἀπόλλυνται· ἀλλὰ βάλλουσιν οἶνον νέον εἰς ἀσκοὺς καινούς, καὶ ἀμφότεροι συντηροῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/017.yaml
  text: Nor do they put new wine into old wineskins. Otherwise[a], the wineskins burst, and the wine is spilled, and the wineskins are ruined. Rather, they put new wine into fresh wineskins, and both are preserved.
translation:
  language: it
  text: Né si mette vino nuovo in otri vecchi; altrimenti gli otri si spaccano, il vino si spande e gli otri vanno perduti. Il vino nuovo, invece, si mette in otri nuovi[a], e così si conservano entrambi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Il greco usa due aggettivi diversi: il vino è «nuovo» (νέος, recente), mentre gli otri sono «nuovi» (καινός, nuovi o freschi nella loro condizione).'
    reason: Distinzione lessicale non riproducibile naturalmente in italiano con due aggettivi diversi.
lexical_decisions:
- source_word: οὐδὲ βάλλουσιν
  choice: E non si mette
  rationale: Il costrutto impersonale italiano rende in modo naturale il plurale generico greco e conserva il collegamento con l’esempio precedente mediante «E».
- source_word: οἶνον νέον
  choice: vino nuovo
  rationale: Resa diretta e corrente per il vino appena prodotto.
- source_word: ἀσκοὺς παλαιούς
  choice: otri vecchi
  rationale: «Otri» indica con precisione i recipienti di pelle dell’epoca; «vecchi» conserva il contrasto relativo all’età e alla condizione.
- source_word: εἰ δὲ μή γε
  choice: altrimenti
  rationale: Esprime in italiano corrente la conseguenza negativa implicita nella formula condizionale greca.
- source_word: ῥήγνυνται
  choice: si spaccano
  rationale: Descrive con chiarezza gli otri che cedono sotto la pressione, senza suggerire necessariamente un’esplosione.
- source_word: ἐκχεῖται
  choice: si versa
  rationale: Rende l’effusione involontaria e la conseguente perdita del vino dopo la rottura degli otri.
- source_word: ἀπόλλυνται
  choice: vanno perduti
  rationale: Indica che gli otri sono rovinati e non più utilizzabili, mantenendo il parallelismo con la perdita del vino.
- source_word: ἀλλὰ
  choice: invece
  rationale: Segnala naturalmente la pratica corretta in contrasto con quella appena descritta.
- source_word: ἀσκοὺς καινούς
  choice: otri nuovi
  rationale: È l’espressione italiana più naturale; una nota documenta la distinzione tra καινός e νέος, che «freschi» non renderebbe idiomaticamente riferito agli otri.
- source_word: ἀμφότεροι συντηροῦνται
  choice: si conservano entrambi
  rationale: Mantiene il riferimento congiunto al vino e agli otri e il valore passivo del verbo.
theological_decisions:
- issue: Distinzione tra νέος e καινός nello stesso versetto
  choice: Rendere entrambi con «nuovo», segnalando in nota la diversa sfumatura del greco
  alternative: Rendere καινός con «fresco» o «in buone condizioni»
  rationale: In italiano «otri freschi» risulta poco naturale, mentre «in buone condizioni» esplicita più di quanto dica il testo. La nota conserva la distinzione lessicale senza imporre un’interpretazione teologica.
translation_notes:
  register: Italiano moderno, chiaro e dignitoso. La costruzione impersonale evita un soggetto generico artificiale; «otri» mantiene il concreto sfondo storico. La punteggiatura rende trasparente il rapporto tra pratica errata, conseguenze e alternativa corretta.
