id: MAT.3.16
reference: Matthew 3:16
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ⸂βαπτισθεὶς δὲ⸃ ὁ Ἰησοῦς ⸂εὐθὺς ἀνέβη⸃ ἀπὸ τοῦ ὕδατος· καὶ ἰδοὺ ⸀ἠνεῴχθησαν οἱ οὐρανοί, καὶ εἶδεν ⸀πνεῦμα θεοῦ καταβαῖνον ὡσεὶ ⸀περιστερὰν ἐρχόμενον ἐπ’ αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/016.yaml
  text: And when Jesus was baptized[a], he immediately came up from the water. And behold, the heavens were opened[c][b], and he saw the Spirit of God descending like a dove and coming upon him.
translation:
  language: it
  text: Dopo essere stato battezzato, Gesù risalì subito dall’acqua. Ed ecco, i cieli furono aperti, ed egli vide lo Spirito di Dio scendere come una colomba e venire su di lui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: «Venire su di lui» traduce alla lettera il verbo greco; si può anche rendere «posarsi su di lui».
    reason: Segnala una comune alternativa lessicale, più idiomatica ma leggermente interpretativa, senza inserirla nel testo principale.
lexical_decisions:
- source_word: βαπτισθεὶς δὲ ὁ Ἰησοῦς
  choice: Dopo essere stato battezzato, Gesù
  rationale: Il participio aoristo passivo indica normalmente un’azione anteriore al verbo principale; la resa mantiene sia la sequenza temporale sia il valore passivo, con sintassi italiana naturale.
- source_word: εὐθὺς ἀνέβη ἀπὸ τοῦ ὕδατος
  choice: risalì subito dall’acqua
  rationale: «Subito» conserva il valore di εὐθύς; «risalì dall’acqua» rende in modo conciso ἀναβαίνω con ἀπό senza precisare oltre il testo greco la modalità del battesimo.
- source_word: καὶ ἰδοὺ
  choice: Ed ecco
  rationale: Mantiene il connettivo narrativo e la forza deittica, vivace ma dignitosa, dell’espressione greca.
- source_word: ἠνεῴχθησαν οἱ οὐρανοί
  choice: i cieli si aprirono
  rationale: Il plurale «i cieli» conserva il numero e la risonanza biblica dell’originale; il passivo greco è reso con il naturale si passivante italiano.
- source_word: εἶδεν πνεῦμα θεοῦ
  choice: egli vide lo Spirito di Dio
  rationale: «Egli» rende esplicito il soggetto grammaticale potenzialmente ambiguo; «lo Spirito di Dio» conserva il genitivo e la formulazione del testo senza sostituirla con «Spirito Santo».
- source_word: καταβαῖνον ὡσεὶ περιστερὰν
  choice: scendere come una colomba
  rationale: «Come» mantiene il valore comparativo di ὡσεὶ senza identificare letteralmente lo Spirito con una colomba.
- source_word: ἐρχόμενον ἐπ’ αὐτόν
  choice: venire su di lui
  rationale: Riproduce il senso ordinario di ἔρχομαι e il movimento espresso da ἐπί, evitando la specificazione interpretativa «posarsi».
theological_decisions:
- issue: Identità di πνεῦμα θεοῦ
  choice: lo Spirito di Dio
  alternative: uno spirito di Dio / lo Spirito Santo
  rationale: Il contesto favorisce il referente definito, ma la traduzione conserva l’esatta espressione greca senza renderla né generica né più esplicita dell’originale.
- issue: Natura del paragone con la colomba
  choice: scendere come una colomba
  alternative: scendere in forma di colomba
  rationale: ὡσεὶ esprime somiglianza; «in forma di» determinerebbe più precisamente la natura visibile del fenomeno rispetto a quanto afferma il greco.
- issue: Soggetto di εἶδεν
  choice: egli vide, con nota sull’ambiguità del referente
  alternative: Gesù vide
  rationale: La forma verbale indica un soggetto maschile singolare sottinteso, naturalmente riferibile a Gesù, ma il testo non ripete il nome; la nota conserva la lieve ambiguità grammaticale.
translation_notes:
  register: Italiano standard moderno, narrativo e dignitoso. «Ed ecco» e «i cieli» preservano il tono biblico senza risultare arcaici; il resto della frase impiega costruzioni correnti e trasparenti.
