  text: καὶ ἐβαπτίζοντο ἐν τῷ Ἰορδάνῃ ⸀ποταμῷ ὑπ’ αὐτοῦ ἐξομολογούμενοι τὰς ἁμαρτίας αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/006.yaml
  text: and they were being baptized by him in the Jordan River[a], confessing their sins.
translation:
  language: it
  text: e venivano battezzati da lui nel fiume Giordano[a], confessando i loro peccati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oppure «furono battezzati»; l’imperfetto greco può sottolineare un’azione in corso o ripetuta.
    reason: alternativa aspettuale e sintattica
lexical_decisions:
- source_word: ἐβαπτίζοντο
  choice: si facevano battezzare
  rationale: L’imperfetto esprime un’azione in corso o ripetuta nel racconto; la costruzione italiana «si facevano battezzare» rende con naturalezza il valore passivo senza specificare la modalità del battesimo.
- source_word: ἐν τῷ Ἰορδάνῃ ποταμῷ
  choice: nel fiume Giordano
  rationale: La preposizione ἐν ha valore locativo e ποταμῷ identifica esplicitamente il Giordano come fiume; questa formulazione è naturale nell’italiano moderno.
- source_word: ὑπ’ αὐτοῦ
  choice: da lui
  rationale: Ὑπό con il genitivo indica l’agente personale. Il pronome rimanda naturalmente a Giovanni, ma viene conservato senza esplicitarne il nome.
- source_word: ἐξομολογούμενοι
  choice: confessando
  rationale: Il participio descrive un’azione contemporanea al battesimo e indica il riconoscimento espresso delle proprie colpe; «confessando» è diretto e idiomatico nel contesto del ravvedimento.
- source_word: τὰς ἁμαρτίας αὐτῶν
  choice: i loro peccati
  rationale: Resa diretta dell’oggetto plurale con il possessivo, mantenendo il riferimento ai peccati confessati.
- source_word: καὶ
  choice: e
  rationale: Conserva il semplice collegamento narrativo con il versetto precedente.
theological_decisions:
- issue: Terminologia e modalità del battesimo
  choice: battezzare
  alternative: immergere; lavare
  rationale: Il testo riferisce che le persone venivano battezzate nel Giordano da Giovanni, ma non definisce esplicitamente in questo versetto la modalità del rito. «Battezzare» mantiene la terminologia rituale e non introduce conclusioni confessionali.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. «Si facevano battezzare» rende naturalmente il passivo greco e il coinvolgimento volontario dei partecipanti senza trasformare il verbo in riflessivo né precisare la modalità del rito.
