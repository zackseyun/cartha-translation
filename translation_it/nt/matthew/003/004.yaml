source:
  edition: SBLGNT
  text: αὐτὸς δὲ ὁ Ἰωάννης εἶχεν τὸ ἔνδυμα αὐτοῦ ἀπὸ τριχῶν καμήλου καὶ ζώνην δερματίνην περὶ τὴν ὀσφὺν αὐτοῦ, ἡ δὲ τροφὴ ⸂ἦν αὐτοῦ⸃ ἀκρίδες καὶ μέλι ἄγριον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/004.yaml
  text: John himself wore clothing made of camel’s hair and a leather belt around his waist[c][b][a], and his food was locusts and wild honey.
translation:
  language: it
  text: Giovanni stesso portava un vestito di peli di cammello[b] e una cintura di cuoio attorno alla vita[a]; il suo cibo erano cavallette e miele selvatico.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L'abbigliamento di Giovanni richiama l'aspetto del profeta Elia in 2 Re 1:8, uno sfondo importante per il modo in cui Matteo presenta Giovanni.
    reason: cross_reference
  - marker: b
    text: O «una veste fatta di peli di cammello».
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς δὲ ὁ Ἰωάννης
  choice: Giovanni stesso
  rationale: αὐτός ha valore enfatico, reso con «stesso»; δέ introduce lievemente la descrizione e non richiede necessariamente un connettivo esplicito in italiano.
- source_word: εἶχεν τὸ ἔνδυμα αὐτοῦ
  choice: portava un abito
  rationale: Benché εἶχεν significhi letteralmente «aveva», nel contesto descrive ciò che Giovanni indossava abitualmente; «portava» è naturale e non suggerisce che avesse fatto confezionare l'abito.
- source_word: ἀπὸ τριχῶν καμήλου
  choice: di peli di cammello
  rationale: ἀπό esprime qui il materiale. «Peli di cammello» conserva il plurale τρίχων e indica chiaramente la composizione del tessuto.
- source_word: ζώνην δερματίνην
  choice: una cintura di cuoio
  rationale: ζώνη indica una cintura o fascia; δερματίνην ne specifica il materiale. «Cuoio» è idiomatico per una cintura lavorata in pelle.
- source_word: περὶ τὴν ὀσφὺν αὐτοῦ
  choice: attorno alla vita
  rationale: ὀσφύς indica la zona dei fianchi o della vita; «vita» è moderno e naturale, senza l'arcaismo di «lombi».
- source_word: ἡ δὲ τροφὴ ἦν αὐτοῦ
  choice: il suo cibo erano
  rationale: La costruzione italiana pone in rilievo gli alimenti elencati; il plurale «erano» concorda a senso con «cavallette e miele selvatico» ed evita una formulazione pesante.
- source_word: ἀκρίδες
  choice: cavallette
  rationale: 'È il normale significato lessicale del termine: insetti commestibili. Non vi sono ragioni testuali per adottare interpretazioni botaniche.'
- source_word: μέλι ἄγριον
  choice: miele selvatico
  rationale: Resa diretta dell'espressione, riferita a miele reperito allo stato selvatico.
theological_decisions:
- issue: Richiamo all'aspetto del profeta Elia
  choice: Mantenere nel testo una descrizione concreta e sobria, segnalando il richiamo intertestuale in nota.
  alternative: Esplicitare nel testo che Giovanni era vestito come Elia.
  rationale: Matteo descrive abbigliamento e dieta senza nominare Elia. Il possibile richiamo a 2 Re 1:8 è importante, ma renderlo esplicito nel testo trasformerebbe un'allusione in interpretazione.
translation_notes:
  register: Italiano standard moderno, narrativo e dignitoso. «Abito» è usato al singolare come nel greco ἔνδυμα; «cintura di cuoio» e «attorno alla vita» sono formulazioni comuni e non arcaiche. Il punto e virgola distingue con chiarezza l'abbigliamento dalla dieta. Tutti i richiami di nota compaiono nel testo.
