id: MAT.3.17
reference: Matthew 3:17
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ φωνὴ ἐκ τῶν οὐρανῶν λέγουσα· Οὗτός ἐστιν ὁ υἱός μου ὁ ἀγαπητός, ἐν ᾧ εὐδόκησα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/017.yaml
  text: And behold[a], a voice from the heavens said, “This is my beloved Son[b], with whom I am well pleased.”
translation:
  language: it
  text: 'Ed ecco, una voce dai cieli[a] disse: «Questo è il Figlio mio, l’amato, nel quale mi sono compiaciuto[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure «dal cielo». Il greco ha il plurale: «dai cieli».'
    reason: lexical_alternative
  - marker: b
    text: Oppure «nel quale mi compiaccio».
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἰδοὺ
  choice: Ed ecco
  rationale: «Ecco» conserva la funzione di richiamo solenne di ἰδού ed è tuttora chiaro e naturale in italiano; «ed» collega la scena a quanto precede.
- source_word: φωνὴ
  choice: una voce
  rationale: Il contesto di discorso diretto mostra che φωνή indica una voce articolata, non un semplice suono.
- source_word: ἐκ τῶν οὐρανῶν
  choice: dai cieli
  rationale: Mantiene il plurale del greco e riproduce con naturalezza l’idea di provenienza espressa da ἐκ.
- source_word: λέγουσα
  choice: disse
  rationale: Il participio introduce le parole della voce; la forma finita «disse» è idiomatica in italiano e conserva il valore narrativo.
- source_word: Οὗτός ἐστιν
  choice: Questo è
  rationale: Resa italiana diretta e naturale dell’identificazione espressa dal dimostrativo e dalla copula.
- source_word: ὁ υἱός μου
  choice: il Figlio mio
  rationale: Conserva l’articolo e la relazione filiale esplicita. La maiuscola segnala l’uso cristologico riferito a Gesù senza aggiungere contenuto al testo.
- source_word: ὁ ἀγαπητός
  choice: l’amato
  rationale: La costruzione appositiva rispecchia il secondo articolo greco e preserva il senso di colui che è amato, senza ridurlo a un semplice aggettivo ornamentale.
- source_word: ἐν ᾧ
  choice: nel quale
  rationale: Conserva la preposizione ἐν e il legame relativo con il Figlio, lasciando intatta la formulazione teologicamente densa del greco.
- source_word: εὐδόκησα
  choice: ho trovato compiacimento
  rationale: Rende il valore positivo di approvazione e diletto di εὐδοκέω e mantiene una forma passata compatibile con l’aoristo, pur restando comprensibile in italiano.
theological_decisions:
- issue: La dichiarazione divina della figliolanza di Gesù
  choice: il Figlio mio, l’amato
  alternative: il mio Figlio amato
  rationale: La resa scelta conserva sia la figliolanza esplicita sia la struttura articolata e appositiva di ὁ υἱός μου ὁ ἀγαπητός, senza specificare oltre la natura di tale figliolanza.
- issue: Il plurale οὐρανῶν
  choice: dai cieli
  alternative: dal cielo
  rationale: Il plurale è attestato nel testo greco e può essere mantenuto chiaramente in italiano; il singolare idiomatico è segnalato in nota.
- issue: Valore di ἐν ᾧ εὐδόκησα
  choice: nel quale ho trovato compiacimento
  alternative: del quale mi compiaccio
  rationale: La formulazione scelta conserva ἐν e il riferimento passato dell’aoristo, evitando però di escludere la perdurante approvazione divina; l’alternativa più idiomatica è riportata in nota.
translation_notes:
  register: Italiano moderno, dignitoso e leggibile, con una lieve solennità adeguata alla voce celeste. «L’amato» e «nel quale ho trovato compiacimento» mantengono più da vicino la struttura e le sfumature del greco senza risultare oscuri. I richiami di nota sono collocati esattamente accanto alle espressioni cui si riferiscono.
