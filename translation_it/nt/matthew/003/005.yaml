id: MAT.3.5
reference: Matthew 3:5
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: τότε ἐξεπορεύετο πρὸς αὐτὸν Ἱεροσόλυμα καὶ πᾶσα ἡ Ἰουδαία καὶ πᾶσα ἡ περίχωρος τοῦ Ἰορδάνου,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/005.yaml
  text: Then Jerusalem[a], all Judea, and all the region around the Jordan were going out to him[c][b],
translation:
  language: it
  text: Allora Gerusalemme, tutta la Giudea e tutta la regione intorno al Giordano andavano da lui[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’imperfetto greco può indicare un’azione continuata o ripetuta: «continuavano ad andare da lui».'
    reason: lexical_alternative
  - marker: b
    text: «Tutta la Giudea» e «tutta la regione intorno al Giordano» sono ampie espressioni geografiche che descrivono una risposta molto diffusa, senza implicare necessariamente ogni singolo abitante.
    reason: cultural_note
lexical_decisions:
- source_word: τότε
  choice: Allora
  rationale: Segnale temporale e discorsivo naturale in italiano, che collega la vasta risposta popolare al ministero di Giovanni descritto nel contesto precedente.
- source_word: ἐξεπορεύετο
  choice: andavano
  rationale: L’imperfetto esprime un movimento continuato o ripetuto nel passato. «Andavano» conserva questo aspetto con una formulazione italiana naturale; l’idea dell’uscire è già suggerita dal movimento dalle regioni nominate verso Giovanni.
- source_word: πρὸς αὐτόν
  choice: da lui
  rationale: Con un verbo di movimento, πρός con l’accusativo indica la direzione verso una persona. In questo contesto «andavano da lui» è l’espressione italiana più idiomatica.
- source_word: Ἱεροσόλυμα
  choice: Gerusalemme
  rationale: Forma italiana standard del toponimo; il nome della città è usato metonimicamente per la sua popolazione, come nel greco.
- source_word: πᾶσα ἡ Ἰουδαία
  choice: tutta la Giudea
  rationale: Mantiene l’ampia espressione geografica del testo senza sostituirla esplicitamente con «gli abitanti della Giudea».
- source_word: πᾶσα ἡ περίχωρος τοῦ Ἰορδάνου
  choice: tutta la regione intorno al Giordano
  rationale: Rende περίχωρος con una locuzione geografica corrente e conserva il riferimento al territorio circostante il fiume.
- source_word: καὶ ... καὶ
  choice: ', ... e'
  rationale: La coordinazione cumulativa dei tre riferimenti geografici è resa secondo la sintassi italiana naturale, con virgola tra i primi due elementi ed «e» prima dell’ultimo.
theological_decisions:
- issue: Portata delle espressioni geografiche totali
  choice: Conservare «tutta» nelle due espressioni regionali, intendendole secondo il normale uso ampio e rappresentativo
  alternative: Esplicitare «gente da Gerusalemme, da ogni parte della Giudea e dalla regione del Giordano»
  rationale: Il testo descrive retoricamente la vasta risposta al ministero di Giovanni. La formulazione geografica va mantenuta senza farle affermare necessariamente che ogni singolo abitante si recò da lui.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. La metonimia dei luoghi per i loro abitanti è conservata, così come l’imperfetto narrativo; il verbo al plurale segue la normale concordanza italiana con i tre soggetti coordinati.
