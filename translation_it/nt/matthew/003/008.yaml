  text: ποιήσατε οὖν καρπὸν ἄξιον τῆς μετανοίας
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/008.yaml
  text: Therefore[a], produce fruit worthy of repentance.
translation:
  language: it
  text: Producete dunque un frutto degno di pentimento.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «un frutto conforme al pentimento».'
    reason: Alternativa lessicale che esplicita il valore di corrispondenza di ἄξιον con il genitivo.
lexical_decisions:
- source_word: ποιήσατε
  choice: Producete
  rationale: L’aoristo imperativo attivo di seconda persona plurale esprime un comando netto. «Producete» rende direttamente ποιέω e si combina in modo naturale con l’immagine del frutto.
- source_word: οὖν
  choice: dunque
  rationale: Segnala la conseguenza tratta dall’esortazione e dall’avvertimento precedenti; la posizione dopo il verbo è naturale in italiano.
- source_word: καρπὸν
  choice: un frutto
  rationale: Mantiene il singolare collettivo e la metafora del risultato visibile nella condotta.
- source_word: ἄξιον
  choice: degno di
  rationale: Rende formalmente ἄξιος con il genitivo, conservando l’idea di corrispondenza o adeguatezza senza trasformarla in merito causale.
- source_word: μετανοίας
  choice: ravvedimento
  rationale: Nel contesto della predicazione di Giovanni indica un autentico cambiamento interiore e un volgersi da una condotta precedente. «Ravvedimento» è dignitoso e comprensibile, e conserva il valore religioso del termine meglio di una semplice «cambio di idea».
theological_decisions:
- issue: Senso di καρπὸν ἄξιον τῆς μετανοίας
  choice: Una condotta visibile che corrisponde a un autentico ravvedimento
  alternative: Un frutto che merita o procura il ravvedimento
  rationale: La costruzione con ἄξιος e il genitivo esprime adeguatezza o corrispondenza, non l’acquisizione meritoria del ravvedimento. La resa mantiene comunque intatta la forza dell’imperativo morale.
translation_notes:
  register: Italiano moderno, dignitoso e diretto. L’imperativo plurale conserva la forza dell’appello rivolto agli interlocutori; «frutto» resta al singolare collettivo. Il marcatore di nota è collocato dopo l’intera frase cui si riferisce.
