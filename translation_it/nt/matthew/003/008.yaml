- from: Producete dunque un frutto degno del ravvedimento.[a]
  to: Producete dunque un frutto degno di pentimento.[a]
  rationale: La revisione sostituisce soltanto «ravvedimento» con «pentimento» per un italiano moderno più naturale e meno marcato sul piano confessionale. Restano invariati l'imperativo, il nesso inferenziale, il singolare collettivo e il senso non meritorio della locuzione greca. Il marcatore di nota resta ancorato all'intera espressione finale.
