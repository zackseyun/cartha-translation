id: MAT.3.11
reference: Matthew 3:11
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Ἐγὼ μὲν ⸂ὑμᾶς βαπτίζω⸃ ἐν ὕδατι εἰς μετάνοιαν· ὁ δὲ ὀπίσω μου ἐρχόμενος ἰσχυρότερός μού ἐστιν, οὗ οὐκ εἰμὶ ἱκανὸς τὰ ὑποδήματα βαστάσαι· αὐτὸς ὑμᾶς βαπτίσει ἐν πνεύματι ἁγίῳ ⸂καὶ πυρί⸃·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/011.yaml
  text: I indeed baptize you in water for repentance[a], but the one coming after me is stronger than I, whose sandals I am not worthy to carry[c][b]. He himself will baptize you in the Holy Spirit and fire.
translation:
  language: it
  text: Io vi battezzo in acqua, in vista del ravvedimento[a]; ma colui che viene dopo di me è più forte di me, e io non sono degno di portargli i sandali. Egli stesso vi battezzerà nello Spirito Santo e nel fuoco[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La frase greca può essere resa anche «per il ravvedimento» o «verso il ravvedimento»; indica orientamento o finalità senza precisare da sola il rapporto tra il ravvedimento e il battesimo. La preposizione resa «in» può inoltre significare «con», sia qui sia nelle espressioni seguenti: «con acqua» e «con lo Spirito Santo e fuoco».'
    reason: lexical_alternative
  - marker: b
    text: «Fuoco» può evocare purificazione o giudizio; qui il greco lascia aperta l'immagine, che va compresa alla luce del contesto.
    reason: alternative_reading
lexical_decisions:
- source_word: βαπτίζω / βαπτίσει
  choice: battezzo / battezzerà
  rationale: Mantiene il verbo italiano tradizionale e corrente senza precisare una modalità, come invece farebbe «immergere».
- source_word: ἐν ὕδατι
  choice: in acqua
  rationale: Riproduce da vicino la costruzione greca con ἐν e conserva il parallelismo con «nello Spirito Santo e nel fuoco»; «con acqua» resta possibile.
- source_word: εἰς μετάνοιαν
  choice: in vista del ravvedimento
  rationale: Rende il valore direzionale o finalistico di εἰς senza stabilire in modo rigido il rapporto cronologico o sacramentale tra battesimo e ravvedimento.
- source_word: ὁ δὲ ὀπίσω μου ἐρχόμενος
  choice: ma colui che viene dopo di me
  rationale: Resa naturale del participio sostantivato, mantenendo il contrasto e il senso di successione.
- source_word: ἰσχυρότερός μού ἐστιν
  choice: è più forte di me
  rationale: Traduzione diretta, moderna e non arcaica del comparativo.
- source_word: οὗ οὐκ εἰμὶ ἱκανὸς
  choice: e io non sono degno
  rationale: Nel contesto della dichiarazione di umiltà, «degno» comunica bene il valore idiomatico di ἱκανός, pur potendo il termine significare anche «capace» o «adatto».
- source_word: τὰ ὑποδήματα βαστάσαι
  choice: di portargli i sandali
  rationale: βαστάσαι significa «portare» o «reggere», non «togliere»; «sandali» è culturalmente e lessicalmente preciso.
- source_word: αὐτός
  choice: Egli
  rationale: Il pronome espresso conserva l'enfasi e il contrasto con l'azione di Giovanni; in italiano «egli» dà risalto senza l'appesantimento di «egli stesso».
- source_word: ἐν πνεύματι ἁγίῳ
  choice: nello Spirito Santo
  rationale: Rende il referente personale secondo l'uso neotestamentario e mantiene il parallelismo della preposizione ἐν.
- source_word: καὶ πυρί
  choice: e nel fuoco
  rationale: Conserva letteralmente l'immagine e l'ambiguità tra purificazione e giudizio, senza scioglierla nel testo.
theological_decisions:
- issue: Senso di «Spirito Santo e fuoco»
  choice: Conservare la formula «nello Spirito Santo e nel fuoco» senza espansione interpretativa.
  alternative: «nello Spirito Santo e nel fuoco purificatore» oppure «nello Spirito Santo e nel fuoco del giudizio»
  rationale: Il greco non specifica qui se il fuoco indichi purificazione, giudizio o entrambi; il contesto circostante deve orientare l'interpretazione.
- issue: Referente di πνεύματι ἁγίῳ
  choice: «lo Spirito Santo»
  alternative: «spirito santo» oppure «una potenza santa»
  rationale: Nel contesto matteano la designazione personale «Spirito Santo» è la lettura più naturale, senza necessità di aggiungere spiegazioni dottrinali.
- issue: Rapporto tra battesimo e ravvedimento in εἰς μετάνοιαν
  choice: Usare «in vista del ravvedimento» senza definire ulteriormente il rapporto.
  alternative: «come segno del ravvedimento» oppure «per produrre ravvedimento»
  rationale: La preposizione εἰς ha forza direzionale o finalistica, ma la sola espressione non determina in modo univoco se il ravvedimento preceda il battesimo, ne sia espresso o ne costituisca lo scopo.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. «Ravvedimento» è preferito a «penitenza» perché esprime il cambiamento interiore e di orientamento implicato da μετάνοια senza introdurre connotazioni sacramentali non espresse. Il parallelismo «in acqua ... nello Spirito Santo e nel fuoco» conserva la forma della fonte greca.
