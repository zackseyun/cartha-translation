id: MAT.3.7
reference: Matthew 3:7
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Ἰδὼν δὲ πολλοὺς τῶν Φαρισαίων καὶ Σαδδουκαίων ἐρχομένους ἐπὶ τὸ βάπτισμα ⸀αὐτοῦ εἶπεν αὐτοῖς· Γεννήματα ἐχιδνῶν, τίς ὑπέδειξεν ὑμῖν φυγεῖν ἀπὸ τῆς μελλούσης ὀργῆς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/007.yaml
  text: But when he saw many of the Pharisees and Sadducees coming for his baptism[a], he said to them, “Offspring of vipers[b], who warned you to flee from the coming wrath?”
translation:
  language: it
  text: 'Vedendo però molti dei farisei e dei sadducei che venivano al suo battesimo, disse loro: «Progenie di vipere[a], chi vi ha avvertiti di fuggire dall’ira imminente[b]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «Razza di vipere».
    reason: lexical_alternative
  - marker: b
    text: O «ira che deve venire».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδὼν δὲ
  choice: Vedendo però
  rationale: Mantiene la costruzione participiale greca in un italiano naturale e conserva con «però» il lieve valore di contrasto o avanzamento narrativo di δέ.
- source_word: πολλοὺς τῶν Φαρισαίων καὶ Σαδδουκαίων
  choice: molti dei farisei e dei sadducei
  rationale: 'Rende la costruzione partitiva: si parla di molti appartenenti ai due gruppi, non necessariamente di tutti i loro membri.'
- source_word: ἐρχομένους ἐπὶ τὸ βάπτισμα αὐτοῦ
  choice: che venivano al suo battesimo
  rationale: Esprime il movimento verso il battesimo amministrato da Giovanni senza aggiungere che queste persone siano state effettivamente battezzate.
- source_word: Γεννήματα ἐχιδνῶν
  choice: Progenie di vipere
  rationale: «Progenie» riflette il senso di ciò che è generato o prodotto e mantiene la forza dell’invettiva profetica; la resa idiomatica «Razza di vipere» è indicata in nota.
- source_word: τίς ὑπέδειξεν ὑμῖν
  choice: chi vi ha avvertiti
  rationale: Nel contesto della fuga dall’ira, ὑποδείκνυμι assume naturalmente il senso di avvertire, pur potendo più letteralmente significare mostrare o indicare.
- source_word: φυγεῖν ἀπὸ
  choice: di fuggire da
  rationale: Conserva l’immagine concreta e urgente della fuga espressa dal verbo φυγεῖν.
- source_word: τῆς μελλούσης ὀργῆς
  choice: dall’ira imminente
  rationale: «Ira» conserva il peso teologico di ὀργή, mentre «imminente» comunica che essa sta per venire senza precisarne ulteriormente la natura o il momento.
theological_decisions:
- issue: Estensione del rimprovero ai gruppi religiosi
  choice: Il rimprovero è rivolto ai molti farisei e sadducei presenti
  alternative: Il rimprovero caratterizza indistintamente tutti i farisei e i sadducei
  rationale: La costruzione partitiva «molti dei» limita grammaticalmente il riferimento alle persone che stanno venendo al battesimo, evitando una generalizzazione non richiesta dal testo.
- issue: Forza escatologica di ὀργή
  choice: ira
  alternative: giudizio; castigo
  rationale: «Ira» rende direttamente ὀργή e ne conserva la gravità teologica e la probabile proiezione escatologica, senza attenuarla o identificarla in modo esclusivo con una sua conseguenza.
- issue: Intenzione di chi viene al battesimo
  choice: venivano al suo battesimo
  alternative: venivano per farsi battezzare da lui
  rationale: Il greco descrive il loro avvicinarsi al battesimo di Giovanni, ma in questo versetto non afferma esplicitamente che intendessero riceverlo o che lo abbiano ricevuto.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. «Progenie» conserva il tono profetico solenne senza risultare arcaico; «ira imminente» è conciso e naturale. I nomi dei gruppi religiosi sono in minuscolo secondo l’uso corrente italiano.
