  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν ⸂πρὸς αὐτόν⸃· Ἄφες ἄρτι, οὕτως γὰρ πρέπον ἐστὶν ἡμῖν πληρῶσαι πᾶσαν δικαιοσύνην. τότε ἀφίησιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/015.yaml
  text: But Jesus answered him[a], “Permit it for now, for in this way it is fitting for us to fulfill all righteousness.” Then he permitted him.
translation:
  language: it
  text: 'Ma Gesù gli rispose: «Lascia fare, per ora, perché così conviene che adempiamo ogni giustizia[a]». Allora lo lasciò fare.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Qui «giustizia» indica in senso ampio ciò che è conforme alla giusta volontà di Dio; il termine greco può comprendere anche l’idea di rettitudine.
    reason: Chiarimento del campo semantico di δικαιοσύνη senza restringerlo al solo ambito legale o giudiziario.
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν πρὸς αὐτόν
  choice: Ma Gesù gli rispose
  rationale: La formula greca «rispondendo, disse» è resa con l’italiano naturale «rispose»; δέ introduce il contrasto con l’obiezione di Giovanni nel versetto precedente.
- source_word: Ἄφες ἄρτι
  choice: Lascia fare, per ora
  rationale: Qui ἀφίημι significa permettere o non opporsi, non perdonare né abbandonare. «Per ora» conserva la sfumatura immediata e temporanea di ἄρτι.
- source_word: οὕτως γὰρ πρέπον ἐστὶν ἡμῖν
  choice: perché così conviene che
  rationale: «Così» mantiene il riferimento al modo appena indicato, cioè al battesimo di Gesù da parte di Giovanni; «conviene» esprime ciò che è appropriato e conforme alla situazione, senza ridurlo a semplice convenienza pratica.
- source_word: πληρῶσαι πᾶσαν δικαιοσύνην
  choice: adempiamo ogni giustizia
  rationale: «Adempiere» conserva la risonanza matteana di πληρόω, mentre «ogni giustizia» mantiene l’ampiezza dell’espressione greca senza trasformarla in una parafrasi sul solo adempimento legale.
- source_word: τότε ἀφίησιν αὐτόν
  choice: Allora lo lasciò fare
  rationale: Il presente storico greco è reso al passato, naturale nella narrazione italiana. L’espressione riprende il verbo precedente e comunica che Giovanni acconsentì a battezzare Gesù; il soggetto resta implicito come nel greco.
theological_decisions:
- issue: Significato di «ogni giustizia»
  choice: Riferimento ampio a ciò che è conforme alla giusta volontà di Dio in questa circostanza, concretamente nel fatto che Gesù riceva il battesimo da Giovanni.
  alternative: Riferimento ristretto all’adempimento di ogni requisito legale, oppure enfasi esclusiva sulla giustizia in senso giudiziario o sociale.
  rationale: Il testo non limita l’espressione alla legge né espone qui un sistema dottrinale completo. La formulazione letterale conserva la tensione e l’ampiezza teologica dell’espressione matteana.
translation_notes:
  register: Italiano moderno, dignitoso e scorrevole. «Lascia fare» è idiomatico ma non colloquiale; «adempiamo ogni giustizia» conserva deliberatamente la formulazione densa e teologicamente aperta del greco.
