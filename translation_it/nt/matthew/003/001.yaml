  text: Ἐν δὲ ταῖς ἡμέραις ἐκείναις παραγίνεται Ἰωάννης ὁ βαπτιστὴς κηρύσσων ἐν τῇ ἐρήμῳ τῆς Ἰουδαίας
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/001.yaml
  text: In those days John the Baptist came[a], preaching in the wilderness of Judea[b],
translation:
  language: it
  text: In quei giorni Giovanni il Battista[a] si presentò[b], predicando nel deserto della Giudea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «Giovanni il Battezzatore».
    reason: lexical_alternative
  - marker: b
    text: O «comparve». Il greco usa qui un presente storico.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ ταῖς ἡμέραις ἐκείναις
  choice: In quei giorni
  rationale: La locuzione ἐν con il dativo esprime il tempo. Il lieve valore connettivo di δέ non richiede qui una congiunzione esplicita in italiano.
- source_word: παραγίνεται
  choice: si presentò
  rationale: Il presente storico introduce Giovanni sulla scena. Il passato remoto è naturale nella narrazione italiana, mentre «si presentò» rende l'idea del suo comparire senza suggerire necessariamente un'apparizione miracolosa.
- source_word: Ἰωάννης
  choice: Giovanni
  rationale: Forma italiana tradizionale e corrente del nome proprio.
- source_word: ὁ βαπτιστὴς
  choice: il Battista
  rationale: È l'appellativo italiano consolidato e naturale; conserva la funzione identificativa del greco.
- source_word: κηρύσσων
  choice: predicando
  rationale: Il participio presente indica un'azione contemporanea al verbo principale; il gerundio italiano ne conserva in modo conciso il rapporto.
- source_word: ἐν τῇ ἐρήμῳ
  choice: nel deserto
  rationale: Qui ἔρημος indica una regione disabitata e incolta. «Deserto» è l'espressione italiana biblica e geografica corrente, senza implicare necessariamente dune sabbiose.
- source_word: τῆς Ἰουδαίας
  choice: della Giudea
  rationale: Indica la regione della Giudea, non la tribù o il territorio antico di Giuda.
theological_decisions:
- issue: Resa dell'appellativo βαπτιστής
  choice: il Battista
  alternative: colui che battezzava
  rationale: La scelta è lessicale, non confessionale. «Il Battista» è l'appellativo italiano riconosciuto; la nota rende trasparente il suo valore agentivo.
translation_notes:
  register: Italiano standard moderno, dignitoso e scorrevole. Il passato remoto si accorda con la narrazione letteraria; «predicando» mantiene il legame sintattico del participio greco. I marcatori delle note sono collocati immediatamente dopo le espressioni pertinenti.
