  variant: modern standard Italian
source:
  edition: SBLGNT
  text: καὶ μὴ δόξητε λέγειν ἐν ἑαυτοῖς· Πατέρα ἔχομεν τὸν Ἀβραάμ, λέγω γὰρ ὑμῖν ὅτι δύναται ὁ θεὸς ἐκ τῶν λίθων τούτων ἐγεῖραι τέκνα τῷ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/009.yaml
  text: And do not presume to say among yourselves[a], ‘We have Abraham as our father,’ for I tell you that God is able to raise up children for Abraham from these stones.
translation:
  language: it
  text: 'E non crediate di poter dire fra voi[a]: «Abbiamo Abramo per padre», poiché vi dico che Dio può far sorgere da queste pietre figli ad Abramo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oppure «dire dentro di voi» o «dire tra voi stessi». L'espressione greca può riferirsi sia a ciò che dite interiormente sia a ciò che vi dite all'interno del gruppo.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ δόξητε
  choice: non pensate di poter
  rationale: La costruzione proibitiva mette in guardia dall'adottare una sicurezza infondata. «Non pensate di poter» rende in italiano naturale sia l'aspetto mentale sia la presunzione implicita nel contesto.
- source_word: λέγειν ἐν ἑαυτοῖς
  choice: dire fra voi
  rationale: Il plurale riflessivo può indicare sia il parlare all'interno del gruppo sia il dire interiormente a sé stessi; il testo principale conserva bene la dimensione comunitaria, mentre la nota registra l'altra possibilità.
- source_word: Πατέρα ἔχομεν τὸν Ἀβραάμ
  choice: Abbiamo Abramo per padre
  rationale: Riproduce con naturalezza l'affermazione enfatica di discendenza e il valore di privilegio ancestrale, senza aggiungere interpretazioni.
- source_word: λέγω γὰρ ὑμῖν
  choice: Perché io vi dico
  rationale: Rende la formula discorsiva e conserva il valore esplicativo di γάρ.
- source_word: δύναται
  choice: può
  rationale: In italiano moderno «può» esprime chiaramente la capacità e la potenza di Dio senza appesantire la frase.
- source_word: ἐκ τῶν λίθων τούτων
  choice: da queste pietre
  rationale: Rende direttamente ἐκ e conserva intatta l'immagine concreta del testo.
- source_word: ἐγεῖραι
  choice: far sorgere
  rationale: Esprime il causativo implicito e conserva l'idea di suscitare o far venire all'esistenza dei discendenti, senza restringere il verbo alla risurrezione.
- source_word: τέκνα
  choice: figli
  rationale: Nel contesto indica discendenti senza limitazione di genere; «figli» è il termine italiano naturale e inclusivo in questa relazione genealogica.
- source_word: τῷ Ἀβραάμ
  choice: per Abramo
  rationale: 'Il dativo indica la relazione con Abramo: Dio può suscitare figli che siano per lui discendenti. «Per Abramo» conserva la formulazione senza esplicitarla oltre il testo.'
theological_decisions:
- issue: Valore della discendenza da Abramo nell'ammonimento di Giovanni
  choice: Il versetto respinge la fiducia nella discendenza fisica da Abramo come garanzia sufficiente davanti a Dio, senza negare la paternità storica di Abramo rispetto a Israele.
  alternative: Intendere l'affermazione come semplice iperbole priva di critica al privilegio genealogico, oppure come dichiarazione della sostituzione di Israele etnico.
  rationale: La formulazione contesta direttamente la sicurezza fondata sull'ascendenza, ma non enuncia una dottrina di sostituzione. La traduzione lascia intatta questa tensione senza importare sistemi teologici successivi.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. La sintassi segue da vicino il greco, ma evita rigidità innaturali; «far sorgere» mantiene la risonanza biblica di ἐγεῖραι senza suggerire necessariamente la risurrezione.
