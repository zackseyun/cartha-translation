  naturalness: Il registro è già moderno e dignitoso. «Non crediate di poter dire fra voi» è più naturale e incisivo di «non pensate di poter dire fra voi». «Poiché vi dico» collega fluidamente la motivazione introdotta da γάρ alla frase precedente.
