id: MAT.3.14
reference: Matthew 3:14
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀Ἰωάννης διεκώλυεν αὐτὸν λέγων· Ἐγὼ χρείαν ἔχω ὑπὸ σοῦ βαπτισθῆναι, καὶ σὺ ἔρχῃ πρός με;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/014.yaml
  text: But John kept trying to prevent him[a], saying, “I need to be baptized by you, and do you come to me?”
translation:
  language: it
  text: 'Ma Giovanni cercava di impedirglielo[a], dicendo: «Io ho bisogno di essere battezzato da te, e tu vieni da me?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «tentava di impedirglielo». L’imperfetto greco può indicare un’azione ripetuta o protratta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διεκώλυεν
  choice: cercava di impedirglielo
  rationale: L’imperfetto esprime un’azione in corso o reiterata; «cercava di impedirglielo» rende in italiano naturale sia il tentativo sia il suo carattere protratto. Il pronome combinato chiarisce che Giovanni cercava di impedire a Gesù di farsi battezzare da lui.
- source_word: λέγων
  choice: dicendo
  rationale: Il participio collega direttamente le parole di Giovanni al suo tentativo di impedire l’azione, senza trasformarlo in una nuova azione indipendente.
- source_word: χρείαν ἔχω
  choice: ho bisogno
  rationale: È la resa idiomatica e corrente dell’espressione greca «avere bisogno», senza rigidità arcaica.
- source_word: ὑπὸ σοῦ
  choice: da te
  rationale: Con l’infinito passivo «essere battezzato», ὑπό con il genitivo indica normalmente l’agente personale.
- source_word: βαπτισθῆναι
  choice: essere battezzato
  rationale: Mantiene la forma passiva e il termine tradizionale appropriato, senza specificare oltre il testo la modalità del battesimo.
- source_word: καὶ σὺ ἔρχῃ πρός με;
  choice: e tu vieni da me?
  rationale: Conserva la domanda retorica e l’esplicito contrasto tra «io» e «tu», senza aggiungere un avverbio interpretativo come «invece» o «addirittura».
- source_word: δὲ
  choice: Ma
  rationale: Segnala il contrasto tra l’arrivo di Gesù per essere battezzato e la resistenza di Giovanni.
theological_decisions:
- issue: L’obiezione di Giovanni al battesimo di Gesù
  choice: La dichiarazione è resa come riconoscimento, da parte di Giovanni, del proprio bisogno di ricevere il battesimo da Gesù e della superiorità di Gesù.
  alternative: Spiegare esplicitamente l’obiezione in termini di impeccabilità morale di Gesù oppure soltanto di rango e autorità.
  rationale: Il versetto afferma il bisogno di Giovanni e rovescia i ruoli attesi, ma non ne espone qui l’intero fondamento teologico; la traduzione conserva questa tensione senza risolverla.
translation_notes:
  register: Italiano standard moderno, naturale e dignitoso. I pronomi espliciti «Io» e «tu» preservano il contrasto marcato nel greco; la domanda resta diretta e retorica.
