review_pass:
  verdict: revise
  source_fidelity: '«Cambiate modo di pensare» captures one component of μετανοεῖτε but is too narrowly cognitive for its imperative use in John’s proclamation, which calls for repentance/conversion, encompassing a reorientation of life toward God. «Convertitevi» is the established and semantically fuller modern Italian rendering without reducing the term to remorse alone. «Si è avvicinato» accurately renders ἤγγικεν (perfect: has drawn near/has come near); «si è fatto vicino» is possible but less idiomatic here.'
  naturalness: The revised wording is concise, natural modern Italian with an appropriately elevated biblical register. «Il regno dei cieli» is the standard idiomatic Matthean expression.
  terminology: «Convertitevi» preserves the broad force of μετανοεῖτε; the note guards against an exclusively emotional understanding. «Regno dei cieli» correctly retains Matthew’s plural genitive expression in its conventional Italian form.
  issues:
  - severity: medium
    issue: The main rendering «Cambiate modo di pensare» narrows μετανοεῖτε to a mental/intellectual change.
    rationale: The verb includes changed mind and orientation, but in this proclamation it denotes repentance/conversion rather than cognition in isolation. The English audit trail’s lexical explanation is likewise overly restrictive and should not control the Italian rendering.
  - severity: low
    issue: «Si è fatto vicino» is less idiomatic than «si è avvicinato».
    rationale: «Si è avvicinato» directly and naturally conveys the perfect of ἐγγίζω while preserving the sense that the kingdom has come near.
