  text: and saying[a], “Repent[b], for the kingdom of heaven has drawn near.”
translation:
  language: it
  text: 'e diceva: «Convertitevi[a], perché il regno dei cieli si è avvicinato[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «Pentitevi»; tradizionalmente anche: «Ravvedetevi». Il verbo greco indica un cambiamento di mente e di orientamento, non soltanto il provare rimorso.'
    reason: lexical_alternative
