    text: 'Oppure: «il regno dei cieli è vicino»; più letteralmente, «il regno dei cieli si è avvicinato».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ λέγων
  choice: e diceva
  rationale: Rende in italiano naturale la coordinazione e il participio presente collegati alla narrazione del versetto precedente, senza attribuire a λέγω il senso più specifico di “proclamare”.
- source_word: Μετανοεῖτε
  choice: Cambiate modo di pensare
  rationale: L’imperativo plurale di μετανοέω richiede un profondo mutamento di mente e orientamento. La formulazione evita di restringere il senso al solo rimorso emotivo, pur lasciando al contesto le conseguenze morali e pratiche.
- source_word: γὰρ
  choice: perché
  rationale: Introduce il motivo dell’esortazione ed è più naturale del formale “poiché” nel discorso diretto moderno.
- source_word: ἤγγικεν
  choice: si è fatto vicino
  rationale: Rende il perfetto di ἐγγίζω come un avvicinamento avvenuto i cui effetti permangono; la locuzione è dignitosa e idiomatica nel registro biblico italiano.
- source_word: ἡ βασιλεία
  choice: il regno
  rationale: Conserva l’ampiezza di βασιλεία, che può richiamare sia l’esercizio della regalità sia il suo ambito, senza ridurla interpretativamente al solo “governo”.
- source_word: τῶν οὐρανῶν
  choice: dei cieli
  rationale: Mantiene il plurale caratteristico dell’espressione matteana e risulta naturale nella consolidata locuzione italiana “regno dei cieli”.
theological_decisions:
- issue: Senso dell’appello Μετανοεῖτε
  choice: Cambiate modo di pensare
  alternative: Convertitevi; pentitevi; ravvedetevi
  rationale: La scelta mette in primo piano il riorientamento della mente implicato dal verbo, senza ridurlo al sentimento di colpa né specificare in anticipo una particolare formulazione dottrinale della conversione.
- issue: Significato di “regno dei cieli”
  choice: Conservare la formulazione matteana “regno dei cieli”
  alternative: Il regno di Dio; il governo dei cieli
  rationale: La resa preserva la dizione e la tensione teologica proprie di Matteo, senza trasformare l’espressione in una spiegazione interpretativa.
translation_notes:
  register: Italiano moderno, chiaro e dignitoso. Il discorso diretto conserva il tono conciso della proclamazione; “si è fatto vicino” mantiene il valore risultativo del perfetto greco senza risultare meccanico.
