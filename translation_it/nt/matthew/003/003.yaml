id: MAT.3.3
reference: Matthew 3:3
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: οὗτος γάρ ἐστιν ὁ ῥηθεὶς ⸀διὰ Ἠσαΐου τοῦ προφήτου λέγοντος· Φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Ἑτοιμάσατε τὴν ὁδὸν κυρίου, εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/003.yaml
  text: 'For this is the one spoken of through Isaiah the prophet[a], saying: “A voice of one crying in the wilderness: ‘Prepare the way of the Lord[b]; make his paths straight.’”'
translation:
  language: it
  text: 'Questi infatti è colui del quale fu detto per mezzo del profeta Isaia, quando disse:


    «Voce di uno che grida nel deserto[a]:


    “Preparate la via del Signore[b],


    raddrizzate i suoi sentieri”».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure, con una diversa punteggiatura: «Voce di uno che grida: “Nel deserto preparate la via del Signore…”».'
    reason: La punteggiatura è editoriale; ἐν τῇ ἐρήμῳ può essere collegato a «grida» oppure all’imperativo «preparate».
  - marker: b
    text: Nel testo ebraico di Isaia 40:3, qui citato, compare il nome divino YHWH, tradizionalmente reso «il SIGNORE».
    reason: La nota conserva il richiamo al nome divino presente nel testo ebraico di Isaia, mentre il testo principale traduce il greco κυρίου.
lexical_decisions:
- source_word: οὗτος γάρ ἐστιν
  choice: Egli infatti è
  rationale: Il dimostrativo rinvia a Giovanni Battista nel contesto immediato; «egli» è naturale in italiano, mentre «infatti» conserva la funzione esplicativa di γάρ.
- source_word: ὁ ῥηθεὶς διὰ Ἠσαΐου τοῦ προφήτου
  choice: colui del quale fu detto per mezzo del profeta Isaia
  rationale: La forma passiva sostantivata è resa esplicitando il riferimento a Giovanni; «per mezzo di» conserva il valore di mediazione di διά con il genitivo.
- source_word: Φωνὴ βοῶντος
  choice: Voce di uno che grida
  rationale: Conserva la costruzione nominale e il participio al genitivo senza appiattirli in una parafrasi.
- source_word: ἐν τῇ ἐρήμῳ
  choice: nel deserto
  rationale: «Deserto» è la resa italiana corrente e dignitosa per la regione incolta evocata dal ministero di Giovanni e dalla citazione di Isaia.
- source_word: Ἑτοιμάσατε τὴν ὁδὸν κυρίου
  choice: Preparate la via del Signore
  rationale: L’imperativo mantiene la forza dell’esortazione profetica; «via» preserva la metafora e l’eco intertestuale, mentre «Signore» traduce il greco κυρίου.
- source_word: εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ
  choice: raddrizzate i suoi sentieri
  rationale: «Raddrizzate» esprime in italiano naturale l’azione di rendere diritti; «sentieri» mantiene il parallelismo poetico con «via» e conserva il pronome personale.
theological_decisions:
- issue: Resa di κυρίου nella citazione di Isaia 40:3, il cui testo ebraico contiene il nome divino YHWH
  choice: Signore
  alternative: SIGNORE
  rationale: Il testo greco di Matteo ha κυρίου, reso direttamente con «Signore». Una nota segnala che nel passo ebraico richiamato compare YHWH, senza sostituire nel testo principale una forma tipografica non presente nel greco.
- issue: Legame sintattico di ἐν τῇ ἐρήμῳ
  choice: collegato a «grida»
  alternative: collegato a «preparate»
  rationale: La lettura principale segue la scansione tradizionale e il contesto del ministero di Giovanni, ma la punteggiatura non appartiene ai manoscritti più antichi e la frase può essere scandita diversamente, in accordo con la sintassi del testo ebraico di Isaia 40:3.
translation_notes:
  register: Italiano standard moderno, solenne ma accessibile. La formula introduttiva conserva la mediazione profetica; la citazione è disposta poeticamente per rendere visibile il parallelismo. Le virgolette annidate distinguono la citazione profetica dal comando pronunciato dalla voce.
