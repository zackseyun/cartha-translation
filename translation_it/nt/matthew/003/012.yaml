id: MAT.3.12
reference: Matthew 3:12
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: οὗ τὸ πτύον ἐν τῇ χειρὶ αὐτοῦ, καὶ διακαθαριεῖ τὴν ἅλωνα αὐτοῦ καὶ συνάξει τὸν σῖτον αὐτοῦ εἰς τὴν ⸀ἀποθήκην, τὸ δὲ ἄχυρον κατακαύσει πυρὶ ἀσβέστῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/012.yaml
  text: His winnowing fork is in his hand[a], and he will thoroughly clear his threshing floor and gather his wheat into the storehouse[b], but the chaff he will burn up with unquenchable fire.
translation:
  language: it
  text: 'Egli ha in mano la pala per vagliare[a] e ripulirà completamente la sua aia: raccoglierà il suo grano nel granaio, ma brucerà del tutto la pula con un fuoco inestinguibile.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Anche «ventilabro»; si tratta dell’attrezzo usato per lanciare in aria il prodotto trebbiato e separare il grano dalla pula.
    reason: lexical_alternative
lexical_decisions:
- source_word: πτύον
  choice: pala per vagliare
  rationale: Indica l’attrezzo agricolo con cui si lanciava in aria il prodotto trebbiato per separare il grano dalla pula. La formulazione è chiara per il lettore moderno e non suggerisce erroneamente un ventaglio comune.
- source_word: διακαθαριεῖ
  choice: ripulirà completamente
  rationale: Il verbo composto esprime una pulizia radicale e completa dell’aia; l’avverbio conserva in italiano la forza intensiva.
- source_word: ἅλωνα
  choice: aia
  rationale: È il termine italiano preciso per lo spazio in cui si trebbiava e si vagliava il grano, e mantiene intatta l’immagine agricola.
- source_word: σῖτον
  choice: grano
  rationale: Nel contesto della vagliatura e del contrasto con la pula, «grano» è naturale e conserva la possibile ampiezza del termine greco meglio di una specificazione obbligatoria come «frumento».
- source_word: ἀποθήκην
  choice: granaio
  rationale: Nel contesto agricolo indica naturalmente il luogo in cui viene raccolto e custodito il grano, pur essendo il termine greco più generale.
- source_word: ἄχυρον
  choice: pula
  rationale: Nell’immagine della vagliatura designa ciò che viene separato dal grano e poi bruciato; «pula» è il termine italiano contestualmente preciso.
- source_word: κατακαύσει
  choice: brucerà completamente
  rationale: La formulazione rende il valore intensivo del verbo composto, che presenta la pula come interamente consumata dal fuoco.
- source_word: πυρὶ ἀσβέστῳ
  choice: con un fuoco inestinguibile
  rationale: Il dativo è reso in senso strumentale, mentre «inestinguibile» conserva l’idea di un fuoco che non può essere spento.
- source_word: οὗ
  choice: Egli ha
  rationale: Il pronome relativo genitivo si riferisce a colui che viene, menzionato nel versetto precedente. La ristrutturazione italiana evita un innaturale «il cui» a inizio versetto e conserva il riferimento personale.
theological_decisions:
- issue: Immagine giudiziaria della separazione tra grano e pula
  choice: Conservare la metafora agricola concreta e il futuro linguaggio di giudizio senza esplicitarne i referenti.
  alternative: Sostituire o ampliare grano e pula con identificazioni esplicite dei giusti e dei malvagi.
  rationale: Il versetto presenta direttamente la metafora e il suo esito severo, ma non identifica nel testo i due gruppi. La traduzione ne preserva quindi il peso teologico senza trasformare l’interpretazione in testo.
translation_notes:
  register: Italiano moderno, dignitoso e leggibile. «Pala per vagliare» privilegia la comprensibilità rispetto al tradizionale ma oggi meno trasparente «ventilabro»; «aia», «grano», «granaio» e «pula» mantengono coerente e concreta l’immagine agricola.
