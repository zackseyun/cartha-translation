id: MAT.3.10
reference: Matthew 3:10
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ἤδη ⸀δὲ ἡ ἀξίνη πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται· πᾶν οὖν δένδρον μὴ ποιοῦν καρπὸν καλὸν ἐκκόπτεται καὶ εἰς πῦρ βάλλεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/010.yaml
  text: And already the axe is laid at the root of the trees[a]. Therefore every tree not producing good fruit is cut down and thrown into the fire.
translation:
  language: it
  text: E già la scure è posta alla radice degli alberi[a]. Perciò ogni albero che non produce frutto buono viene abbattuto e gettato nel fuoco.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «giace alla radice degli alberi».'
    reason: Alternativa lessicale per κεῖται, che può descrivere qualcosa che giace o che è stato collocato in una posizione.
lexical_decisions:
- source_word: ἤδη δὲ
  choice: Già
  rationale: ἤδη esprime l’immediatezza del giudizio; δέ è debolmente connettivo e in italiano non richiede necessariamente una resa esplicita.
- source_word: ἡ ἀξίνη
  choice: la scure
  rationale: «Scure» è il termine italiano naturale e dignitoso per l’attrezzo usato nell’immagine dell’abbattimento.
- source_word: πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται
  choice: è posta alla radice degli alberi
  rationale: Conserva sia l’idea della scure già collocata e pronta all’uso sia la relazione spaziale espressa da πρός; «giace» resta una possibile resa più letterale.
- source_word: πᾶν οὖν δένδρον
  choice: Perciò ogni albero
  rationale: οὖν introduce la conseguenza tratta dall’immagine precedente; «perciò» rende chiaramente il nesso inferenziale.
- source_word: μὴ ποιοῦν καρπὸν καλὸν
  choice: che non produce frutto buono
  rationale: Rende il participio attributivo senza aggiungere interpretazioni; «produce» mantiene il valore di ποιέω, mentre «frutto buono» conserva la metafora.
- source_word: ἐκκόπτεται
  choice: viene tagliato
  rationale: Nel contesto dell’albero indica il taglio che ne determina l’abbattimento; la forma passiva conserva quella del greco.
- source_word: εἰς πῦρ βάλλεται
  choice: gettato nel fuoco
  rationale: Resa moderna e diretta che mantiene l’immagine indefinita del giudizio senza precisarne ulteriormente la natura.
theological_decisions:
- issue: Natura dell’immagine del fuoco
  choice: Mantenere «nel fuoco» senza spiegazione interpretativa
  alternative: Specificare giudizio escatologico, giudizio temporale o inferno
  rationale: Il testo presenta chiaramente un’immagine di giudizio, ma non identifica qui in modo più preciso il referente del fuoco; esplicitarlo restringerebbe indebitamente l’ambiguità del testo.
translation_notes:
  register: Italiano standard moderno, chiaro e dignitoso. La formulazione conserva la forza concreta della metafora e il passivo del testo greco senza introdurre specificazioni confessionali.
