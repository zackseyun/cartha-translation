  naturalness: «E già la scure è posta alla radice degli alberi» è italiano standard, naturale e mantiene il tono solenne ma non arcaizzante del passo. «Viene abbattuto e gettato nel fuoco» è più idiomatico e più preciso dell'attuale «viene tagliato».
