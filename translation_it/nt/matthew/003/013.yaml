id: MAT.3.13
reference: Matthew 3:13
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Τότε παραγίνεται ὁ Ἰησοῦς ἀπὸ τῆς Γαλιλαίας ἐπὶ τὸν Ἰορδάνην πρὸς τὸν Ἰωάννην τοῦ βαπτισθῆναι ὑπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/013.yaml
  text: Then Jesus comes from Galilee to the Jordan[a], to John[c][b], to be baptized by him.
translation:
  language: it
  text: Allora Gesù viene[a] dalla Galilea al Giordano, da Giovanni, per essere battezzato da lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «giunge». Il verbo greco è al presente storico, usato per rendere più vivace la narrazione.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Allora
  rationale: Introduce l’avvenimento successivo nella sequenza narrativa in modo naturale e conciso.
- source_word: παραγίνεται
  choice: viene
  rationale: Conserva il presente storico greco e la vivacità della narrazione; «giunge» sarebbe ugualmente possibile, ma metterebbe maggiormente in risalto l’arrivo.
- source_word: ἀπὸ τῆς Γαλιλαίας
  choice: dalla Galilea
  rationale: ἀπό indica il luogo di provenienza; questa è la resa italiana corrente e precisa.
- source_word: ἐπὶ τὸν Ἰορδάνην
  choice: al Giordano
  rationale: ἐπί con l’accusativo, in un contesto di movimento, indica la destinazione. Il nome «Giordano» è sufficiente nel contesto.
- source_word: πρὸς τὸν Ἰωάννην
  choice: da Giovanni
  rationale: In italiano, con un verbo di movimento, «andare/venire da una persona» esprime naturalmente il dirigersi verso di lei. Evita inoltre di suggerire che il Giordano e Giovanni siano due destinazioni indipendenti.
- source_word: τοῦ βαπτισθῆναι
  choice: per essere battezzato
  rationale: L’infinito articolato esprime lo scopo; la formulazione italiana conserva chiaramente la costruzione passiva.
- source_word: ὑπ’ αὐτοῦ
  choice: da lui
  rationale: ὑπό con il genitivo indica l’agente personale. Il pronome riproduce il testo senza ripetere esplicitamente il nome di Giovanni.
theological_decisions:
- issue: Presente storico in παραγίνεται
  choice: Mantenere il presente narrativo con «viene»
  alternative: Usare il passato remoto «venne»
  rationale: Il presente conserva l’immediatezza intenzionale della narrazione greca senza introdurre alcuna interpretazione dottrinale.
- issue: Identificazione di Giovanni
  choice: Usare soltanto «Giovanni»
  alternative: Aggiungere «il Battista»
  rationale: In questo versetto il testo greco riporta soltanto il nome; il contesto è sufficiente a identificarlo.
- issue: Finalità del battesimo
  choice: «per essere battezzato da lui»
  alternative: «per farsi battezzare da lui»
  rationale: La forma scelta conserva più direttamente il passivo greco e l’agente espresso, senza sviluppare ulteriormente il rapporto tra volontà di Gesù e azione di Giovanni.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. Il presente storico è naturale nella narrazione italiana; «da Giovanni» rende idiomaticamente il movimento verso una persona, mentre «per essere battezzato da lui» mantiene la precisione della costruzione greca.
