id: MAT.4.11
reference: Matthew 4:11
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: τότε ἀφίησιν αὐτὸν ὁ διάβολος, καὶ ἰδοὺ ἄγγελοι προσῆλθον καὶ διηκόνουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/011.yaml
  text: Then the devil left him[a], and behold, angels came and were ministering to him.
translation:
  language: it
  text: Allora il diavolo lo lasciò, ed ecco, degli angeli si avvicinarono e lo servivano.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «si prendevano cura di lui». L’imperfetto greco presenta il servizio come un’azione in corso.
    reason: Alternativa lessicale e valore aspettuale del verbo.
lexical_decisions:
- source_word: τότε
  choice: Allora
  rationale: Segna la successione temporale ed è il naturale connettivo narrativo italiano.
- source_word: ἀφίησιν
  choice: lasciò
  rationale: Il presente storico greco è reso con il passato remoto, naturale nella narrazione italiana; qui il verbo indica che il diavolo si allontana da Gesù.
- source_word: αὐτὸν
  choice: lo
  rationale: Pronome oggetto riferito a Gesù.
- source_word: ὁ διάβολος
  choice: il diavolo
  rationale: Nel racconto della tentazione il termine designa personalmente Satana; la resa tradizionale mantiene chiarezza referenziale.
- source_word: καὶ ἰδοὺ
  choice: ed ecco
  rationale: Conserva sia il collegamento sia il richiamo improvviso all'attenzione espresso da ἰδού.
- source_word: ἄγγελοι
  choice: degli angeli
  rationale: Il contesto indica esseri celesti; l'articolo partitivo rende naturalmente in italiano il plurale greco anartro.
- source_word: προσῆλθον
  choice: si avvicinarono
  rationale: Rende il movimento verso Gesù espresso dal verbo più precisamente del semplice «vennero».
- source_word: διηκόνουν
  choice: lo servivano
  rationale: L'imperfetto italiano conserva l'azione durativa del verbo greco; «servivano» è moderno e comprende l'idea di assistenza concreta senza specificarne la forma.
- source_word: αὐτῷ
  choice: lo
  rationale: Il dativo indica il destinatario del servizio; con «servire» il pronome oggetto diretto è idiomatico nell'italiano moderno.
theological_decisions:
- issue: Resa di διάβολος nel racconto della tentazione
  choice: il diavolo
  alternative: il calunniatore
  rationale: Benché il valore lessicale possa essere «calunniatore», qui il vocabolo funge da designazione personale; «il diavolo» identifica chiaramente il referente senza aggiungere contenuto dottrinale.
- issue: Natura del servizio angelico
  choice: lo servivano
  alternative: si prendevano cura di lui
  rationale: La formulazione conserva l'ampiezza semantica di διακονέω e non precisa se si trattasse di cibo, cura o altra assistenza.
translation_notes:
  register: Italiano moderno, dignitoso e narrativamente scorrevole. «Ed ecco» conserva la vividezza solenne del richiamo greco senza risultare incomprensibile; il passato remoto si accorda con il registro narrativo biblico corrente.
