id: MAT.4.6
reference: Matthew 4:6
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Εἰ υἱὸς εἶ τοῦ θεοῦ, βάλε σεαυτὸν κάτω· γέγραπται γὰρ ὅτι Τοῖς ἀγγέλοις αὐτοῦ ἐντελεῖται περὶ σοῦ καὶ ἐπὶ χειρῶν ἀροῦσίν σε, μήποτε προσκόψῃς πρὸς λίθον τὸν πόδα σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/006.yaml
  text: 'And he said to him[a], “If you are the Son of God, throw yourself down, for it is written: ‘He will command his angels concerning you,’ and ‘On their hands they will lift you up[b], lest you strike your foot against a stone.’”'
translation:
  language: it
  text: 'E gli disse: «Se sei il Figlio di Dio, gettati giù[a], perché sta scritto:


    “Egli darà ordini ai suoi angeli riguardo a te”,


    e:


    “Essi ti solleveranno sulle loro mani[b],

    perché il tuo piede non urti contro una pietra”».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «lanciati giù».'
    reason: lexical_alternative
  - marker: b
    text: 'Oppure: «ti sosterranno sulle loro mani».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: disse
  rationale: Il presente greco è un presente storico; il passato remoto rende in modo naturale la narrazione italiana senza alterarne il senso.
- source_word: Εἰ
  choice: Se
  rationale: Conserva la forma condizionale e la forza provocatoria della sfida, senza trasformarla in un'affermazione concessiva.
- source_word: υἱὸς ... τοῦ θεοῦ
  choice: il Figlio di Dio
  rationale: Nel contesto di Matteo l'espressione ha valore titolare e cristologico; l'articolo italiano è necessario per esprimerlo idiomaticamente.
- source_word: βάλε σεαυτὸν κάτω
  choice: gettati giù
  rationale: Resa italiana moderna e diretta dell'imperativo con pronome riflessivo e avverbio di luogo.
- source_word: γέγραπται
  choice: sta scritto
  rationale: Formula italiana corrente per introdurre una citazione scritturistica; conserva l'idea risultativa del perfetto greco, cioè di quanto rimane scritto.
- source_word: ἐντελεῖται
  choice: darà ordini
  rationale: Esprime chiaramente l'incarico autorevole indicato dal futuro di ἐντέλλομαι.
- source_word: περὶ σοῦ
  choice: riguardo a te
  rationale: Riproduce direttamente il valore di περί con il genitivo, senza restringerlo al solo vantaggio del destinatario.
- source_word: ἐπὶ χειρῶν
  choice: sulle loro mani
  rationale: Mantiene l'immagine concreta del sostegno angelico espressa da ἐπί con il genitivo.
- source_word: ἀροῦσίν σε
  choice: ti solleveranno
  rationale: αἴρω qui indica il sollevare o sostenere qualcuno; la resa è chiara e naturale in italiano contemporaneo.
- source_word: μήποτε προσκόψῃς
  choice: perché ... non urti
  rationale: Rende la finalità preventiva di μήποτε con il congiuntivo e il senso concreto di προσκόπτω nel contesto.
- source_word: πρὸς λίθον
  choice: contro una pietra
  rationale: La preposizione indica l'urto contro qualcosa e il sostantivo anartro ha qui senso indefinito.
- source_word: τὸν πόδα σου
  choice: il tuo piede
  rationale: Conserva il singolare del testo greco.
theological_decisions:
- issue: Valore cristologico di «Figlio di Dio» nella sfida del tentatore
  choice: il Figlio di Dio
  alternative: un figlio di Dio
  rationale: Nel racconto di Matteo l'espressione funziona come titolo riconoscibile. La resa conserva questa forza senza aggiungere spiegazioni dottrinali al testo.
- issue: Citazione del Salmo 91 da parte del diavolo
  choice: La citazione è riportata senza correzioni o qualificazioni interpretative nel testo principale.
  alternative: Inserire nel testo una precisazione che segnali l'uso improprio della Scrittura.
  rationale: Il versetto presenta il tentatore mentre cita la Scrittura; la traduzione deve preservare questa tensione narrativa senza anticiparne l'interpretazione.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. È mantenuto il parallelismo della citazione poetica; «sta scritto» conserva il registro scritturistico senza risultare arcaico.
