source:
  edition: SBLGNT
  text: τότε λέγει αὐτῷ ὁ Ἰησοῦς· ⸀Ὕπαγε, Σατανᾶ· γέγραπται γάρ· Κύριον τὸν θεόν σου προσκυνήσεις καὶ αὐτῷ μόνῳ λατρεύσεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/010.yaml
  text: 'Then Jesus says to him, “Go away, Satan! For it is written: ‘You shall worship the Lord your God, and serve him only.’”'
translation:
  language: it
  text: 'Allora Gesù gli dice: «Vattene, Satana! Sta scritto infatti: “Adorerai il Signore, il tuo Dio,[a] e servirai lui solo”.[b]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «Ti prostrerai davanti al Signore, il tuo Dio». Il verbo greco può indicare più letteralmente il prostrarsi o l''inchinarsi in segno di riverenza.'
    reason: lexical_alternative
  - marker: b
    text: Il verbo tradotto «servirai» può riferirsi in modo specifico al servizio sacro o religioso reso a Dio.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Allora
  rationale: Segna in modo naturale la successione narrativa.
- source_word: λέγει αὐτῷ
  choice: gli dice
  rationale: Conserva il presente storico greco e rende in modo idiomatico il dativo αὐτῷ.
- source_word: Ὕπαγε
  choice: Vattene
  rationale: Imperativo energico di allontanamento, corrente e non arcaico.
- source_word: Σατανᾶ
  choice: Satana
  rationale: Traslitterazione italiana tradizionale del nome o titolo, qui al vocativo.
- source_word: γέγραπται γάρ
  choice: Sta scritto infatti
  rationale: Rende il perfetto passivo formulare e conserva il valore esplicativo di γάρ.
- source_word: Κύριον τὸν θεόν σου
  choice: il Signore, tuo Dio
  rationale: Rende l'apposizione riferita al Dio d'Israele con una formulazione italiana chiara e dignitosa.
- source_word: προσκυνήσεις
  choice: adorerai
  rationale: Nel contesto indica l'atto di culto rivolto a Dio, pur potendo denotare più concretamente il prostrarsi.
- source_word: αὐτῷ μόνῳ
  choice: lui solo
  rationale: Mantiene l'enfasi sull'esclusività dell'oggetto del servizio.
- source_word: λατρεύσεις
  choice: servirai
  rationale: Conserva la distinzione da προσκυνήσεις; il verbo può indicare specificamente il servizio cultuale reso a Dio.
theological_decisions:
- issue: Distinzione tra προσκυνέω e λατρεύω
  choice: «adorerai» e «servirai»
  alternative: Rendere entrambi con termini di adorazione, oppure tradurre προσκυνήσεις con «ti prostrerai davanti a»
  rationale: I due verbi sono affini ma distinti. La resa scelta conserva sia l'adorazione sia il servizio esclusivamente dovuti a Dio senza appiattire la formulazione.
- issue: Portata di μόνος
  choice: «servirai lui solo»
  alternative: «solo lui servirai»
  rationale: La costruzione italiana conserva in modo naturale l'esclusività espressa dal greco αὐτῷ μόνῳ.
translation_notes:
  register: Italiano moderno standard, dignitoso e accessibile. Il presente storico «dice» conserva la vivacità narrativa; «Vattene» esprime con chiarezza la forza del comando. Le note documentano le sfumature concrete e cultuali dei due verbi senza inserirle forzatamente nel testo principale.
