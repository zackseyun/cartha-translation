id: MAT.4.19
reference: Matthew 4:19
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Δεῦτε ὀπίσω μου, καὶ ποιήσω ὑμᾶς ἁλιεῖς ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/019.yaml
  text: And he says to them[a], “Come after me, and I will make you fishers of men.”
translation:
  language: it
  text: 'E dice loro: «Venite dietro a me e vi farò pescatori di uomini[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oppure «pescatori di persone». Il greco ἀνθρώπων indica qui gli esseri umani in generale.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: dice
  rationale: Mantiene il presente storico greco, che in italiano risulta naturale nella narrazione e rende il passaggio più vivido.
- source_word: Δεῦτε
  choice: Venite
  rationale: Rende direttamente l’esortazione imperativa a venire, senza assorbire in essa il senso della locuzione successiva.
- source_word: ὀπίσω μου
  choice: dietro a me
  rationale: Conserva l’immagine concreta del porsi dietro a Gesù come discepoli; «seguitemi» sarebbe più idiomatico, ma fonderebbe Δεῦτε e ὀπίσω μου in un’unica espressione.
- source_word: ποιήσω ὑμᾶς
  choice: vi farò
  rationale: Esprime in modo conciso e naturale l’azione futura e trasformante promessa da Gesù.
- source_word: ἁλιεῖς
  choice: pescatori
  rationale: È l’equivalente italiano corrente del sostantivo greco e mantiene la metafora della pesca.
- source_word: ἀνθρώπων
  choice: di uomini
  rationale: Conserva la formulazione tradizionale e aderente alla forma dell’espressione greca, mentre una nota chiarisce che ἄνθρωπος indica qui gli esseri umani in generale.
theological_decisions:
- issue: Portata generica di ἁλιεῖς ἀνθρώπων
  choice: pescatori di uomini
  alternative: pescatori di persone
  rationale: La formulazione principale conserva l’immagine tradizionale e la struttura dell’originale senza limitare il referente ai soli maschi; la nota esplicita il valore genericamente umano di ἀνθρώπων, evitando sia l’esclusione sia una risoluzione silenziosa della tensione lessicale.
translation_notes:
  register: Italiano moderno, lineare e dignitoso. Il presente storico «dice» è stato mantenuto; «Venite dietro a me» conserva distintamente i due elementi dell’invito greco, pur risultando leggermente più marcato del semplice «Seguitemi».
