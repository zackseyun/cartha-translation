  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Γέγραπται· Οὐκ ἐπ’ ἄρτῳ μόνῳ ζήσεται ⸀ὁ ἄνθρωπος, ἀλλ’ ⸀ἐπὶ παντὶ ῥήματι ἐκπορευομένῳ διὰ στόματος θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/004.yaml
  text: 'But he answered[a], “It is written: ‘Man will not live by bread alone[b], but by every word proceeding through the mouth of God.’”'
translation:
  language: it
  text: 'Ma egli rispose: «Sta scritto: “Non di solo pane vivrà l’essere umano[a], ma di ogni parola che esce per bocca di Dio[b]”».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Il greco usa un sostantivo maschile singolare con valore rappresentativo: il detto riguarda ogni essere umano. Si potrebbe anche tradurre «l’uomo».'
    reason: lexical_alternative
  - marker: b
    text: Letteralmente, «attraverso la bocca di Dio»; «per bocca di Dio» conserva l’immagine della parola pronunciata da Dio. Si potrebbe anche rendere «dalla bocca di Dio».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: rispose
  rationale: Rende in italiano naturale la formula narrativa di matrice semitica, senza conservarne la ridondanza letterale «rispondendo disse».
- source_word: Γέγραπται
  choice: Sta scritto
  rationale: Formula italiana consueta per introdurre una citazione della Scrittura; il presente stativo comunica anche il valore perdurante del perfetto greco.
- source_word: ἄρτῳ μόνῳ
  choice: di solo pane
  rationale: Conserva il senso concreto di «pane» e la formulazione tradizionale della citazione, senza ampliare interpretativamente in «cibo».
- source_word: ζήσεται
  choice: vivrà
  rationale: Rende direttamente il futuro greco con il futuro semplice italiano.
- source_word: ὁ ἄνθρωπος
  choice: l’essere umano
  rationale: Il singolare ha valore rappresentativo e indica l’umanità in generale; «l’essere umano» ne comunica chiaramente la portata inclusiva senza trasformarlo nell’astratto «umanità».
- source_word: παντὶ ῥήματι
  choice: ogni parola
  rationale: Qui ῥῆμα indica ciò che Dio pronuncia; «parola» è naturale, precisa e mantiene il nesso con l’immagine della bocca.
- source_word: ἐκπορευομένῳ
  choice: che esce
  rationale: La relativa italiana rende con naturalezza il participio presente e conserva l’immagine dinamica della parola che esce.
- source_word: διὰ στόματος θεοῦ
  choice: per bocca di Dio
  rationale: «Per bocca di» è un’espressione italiana naturale che conserva il valore di διά con il genitivo, cioè il passaggio o mezzo della pronuncia divina.
theological_decisions:
- issue: Valore generico del maschile singolare ὁ ἄνθρωπος
  choice: l’essere umano
  alternative: l’uomo
  rationale: La massima riguarda ogni persona, non uno specifico individuo maschio. La resa scelta esplicita la portata universale senza sostituire al singolare concreto il collettivo astratto «umanità».
- issue: Forza della formula Γέγραπται
  choice: Sta scritto
  alternative: È scritto
  rationale: Entrambe le rese sono possibili; «sta scritto» è idiomatica e lascia percepire lo stato risultante e perdurante espresso dal perfetto, senza aggiungere una tesi teologica.
- issue: Rapporto espresso da διὰ στόματος θεοῦ
  choice: per bocca di Dio
  alternative: dalla bocca di Dio
  rationale: La resa scelta conserva più direttamente διά con il genitivo e l’immagine della parola pronunciata mediante la bocca di Dio, pur riconoscendo che in italiano «dalla bocca» esprimerebbe più esplicitamente l’origine.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. La sintassi «Non di solo pane vivrà...» mantiene il rilievo iniziale del greco e l’eco scritturale senza risultare arcaica. Le virgolette caporali racchiudono il discorso diretto e le virgolette alte la citazione interna.
