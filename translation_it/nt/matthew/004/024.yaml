source:
  edition: SBLGNT
  text: καὶ ἀπῆλθεν ἡ ἀκοὴ αὐτοῦ εἰς ὅλην τὴν Συρίαν· καὶ προσήνεγκαν αὐτῷ πάντας τοὺς κακῶς ἔχοντας ποικίλαις νόσοις καὶ βασάνοις ⸀συνεχομένους, δαιμονιζομένους καὶ σεληνιαζομένους καὶ παραλυτικούς, καὶ ἐθεράπευσεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/024.yaml
  text: And the report about him went out into all Syria[a], and they brought to him all who were sick, afflicted with various diseases and torments, those oppressed by demons, those having seizures, and paralytics[c][b], and he healed them.
translation:
  language: it
  text: 'La notizia su di lui si diffuse in tutta la Siria; gli portarono tutti quelli che stavano male, afflitti da varie malattie e tormenti: quelli oppressi dai demoni[a], quelli soggetti a crisi convulsive[b] e i paralitici. Ed egli li guarì.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oppure «gli indemoniati» o «i posseduti dai demoni».
    reason: lexical_alternative
  - marker: b
    text: Il termine greco, tradizionalmente reso «epilettici», indica più letteralmente persone ritenute colpite dall’influsso della luna.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκοὴ αὐτοῦ
  choice: la notizia su di lui
  rationale: Qui ἀκοή indica ciò che si sente dire di Gesù. «La notizia su di lui» è chiaro e non introduce la sfumatura positiva che «fama» può avere in italiano.
- source_word: ἀπῆλθεν ... εἰς ὅλην τὴν Συρίαν
  choice: si diffuse in tutta la Siria
  rationale: Rende in italiano naturale il movimento figurato della notizia che giunge nell'intera regione.
- source_word: κακῶς ἔχοντας
  choice: quelli che stavano male
  rationale: L'espressione idiomatica greca designa persone malate o in cattive condizioni; la resa conserva il carattere generale prima dell'elenco specifico.
- source_word: ποικίλαις νόσοις καὶ βασάνοις συνεχομένους
  choice: afflitti da varie malattie e tormenti
  rationale: «Afflitti» esprime la forza di συνεχομένους; «tormenti» conserva l'intensità di βάσανοι senza ridurla ai soli dolori fisici.
- source_word: δαιμονιζομένους
  choice: quelli tormentati dai demoni
  rationale: La resa mantiene esplicito il referente demoniaco senza imporre la categoria tecnica più ristretta suggerita da «posseduti».
- source_word: σεληνιαζομένους
  choice: quelli soggetti a crisi convulsive
  rationale: Comunica al lettore moderno la manifestazione verosimilmente indicata nel contesto senza avallare un nesso causale con la luna; la sfumatura letterale è documentata in nota.
- source_word: παραλυτικούς
  choice: i paralitici
  rationale: Termine italiano diretto e corrente per le persone affette da paralisi.
- source_word: ἐθεράπευσεν αὐτούς
  choice: li guarì
  rationale: Resa concisa e consueta del verbo θεραπεύω in un racconto di guarigione.
theological_decisions:
- issue: Portata di δαιμονιζομένους
  choice: quelli tormentati dai demoni
  alternative: gli indemoniati; i posseduti dai demoni
  rationale: Il testo afferma una reale afflizione demoniaca, ma il participio greco non definisce con precisione un'unica categoria tecnica moderna. La formulazione scelta conserva sia il referente soprannaturale sia l'ampiezza del termine.
- issue: Rapporto tra σεληνιαζομένους, crisi convulsive e luna
  choice: quelli soggetti a crisi convulsive
  alternative: gli epilettici; i lunatici; quelli colpiti dalla luna
  rationale: La parola è etimologicamente collegata alla luna, ma nel contesto indica persone con manifestazioni assimilabili a crisi convulsive. La traduzione rende il probabile referente senza trasformare l'etimologia in una dichiarazione eziologica; la tensione è conservata nella nota.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. Il punto e virgola separa la diffusione della notizia dall'arrivo dei malati; i due punti chiariscono che le categorie successive specificano «tutti quelli che stavano male». La ripetizione di «quelli» rende trasparente l'elenco senza appesantirlo eccessivamente.
