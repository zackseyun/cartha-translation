  text: ἵνα πληρωθῇ τὸ ῥηθὲν διὰ Ἠσαΐου τοῦ προφήτου λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/014.yaml
  text: 'so that what was spoken through Isaiah the prophet might be fulfilled, saying:'
translation:
  language: it
  text: 'affinché si adempisse quanto era stato detto per mezzo del profeta Isaia:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: perché
  rationale: Introduce la finalità o il risultato dell'azione precedente; «perché» è naturale in italiano e mantiene il valore della proposizione con il congiuntivo.
- source_word: πληρωθῇ
  choice: si adempisse
  rationale: L'aoristo passivo congiuntivo di πληρόω è reso con una forma passiva pronominale al congiuntivo imperfetto, idiomatica dopo un verbo storico sottinteso dal contesto e fedele al motivo matteano dell'adempimento della Scrittura.
- source_word: τὸ ῥηθὲν
  choice: ciò che era stato detto
  rationale: L'articolo neutro con il participio passivo ha valore sostantivato. Il trapassato segnala naturalmente in italiano che la parola profetica precede gli eventi narrati.
- source_word: διὰ
  choice: per mezzo di
  rationale: Con il genitivo indica qui mediazione o agenzia; «per mezzo di» conserva esplicitamente Isaia come tramite della parola pronunciata.
- source_word: Ἠσαΐου
  choice: Isaia
  rationale: È la forma italiana tradizionale e corrente del nome del profeta.
- source_word: τοῦ προφήτου
  choice: del profeta
  rationale: Mantiene l'apposizione che identifica il ruolo autorevole di Isaia.
- source_word: λέγοντος
  choice: 'che dice:'
  rationale: Il participio presente introduce la citazione seguente. «Che dice» conserva il presente del greco ed è più naturale dell'italiano letterale «dicendo» dopo «per mezzo del profeta Isaia».
theological_decisions:
- issue: Formula matteana dell'adempimento
  choice: «si adempisse»
  alternative: «si avverasse» / «diventasse realtà»
  rationale: «Adempiersi» conserva il lessico scritturale e il motivo teologico dell'adempimento senza spiegare ulteriormente il rapporto tra profezia ed evento.
- issue: Mediazione profetica
  choice: «per mezzo del profeta Isaia»
  alternative: «dal profeta Isaia»
  rationale: La formulazione scelta preserva il valore mediato di διά e lascia intatta la tensione implicita fra la fonte della parola e il profeta che la trasmette, senza aggiungere esplicitamente un agente divino non nominato nel versetto.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. La formulazione mantiene la solennità della formula di citazione matteana senza risultare arcaica; i due punti preparano la citazione del versetto successivo.
