id: MAT.4.8
reference: Matthew 4:8
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Πάλιν παραλαμβάνει αὐτὸν ὁ διάβολος εἰς ὄρος ὑψηλὸν λίαν, καὶ δείκνυσιν αὐτῷ πάσας τὰς βασιλείας τοῦ κόσμου καὶ τὴν δόξαν αὐτῶν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/008.yaml
  text: Again[a], the devil takes him to a very high mountain and shows him all the kingdoms of the world and their glory.
translation:
  language: it
  text: Di nuovo il diavolo lo porta su un monte molto alto e gli mostra tutti i regni del mondo e la loro gloria.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «il loro splendore».
    reason: Alternativa lessicale per δόξα, che qui può indicare la magnificenza visibile dei regni.
lexical_decisions:
- source_word: Πάλιν
  choice: Di nuovo
  rationale: Segnala con naturalezza la ripetizione nella sequenza delle tentazioni.
- source_word: παραλαμβάνει
  choice: lo porta
  rationale: Rende il presente storico e il movimento verso il monte in un italiano corrente, senza precisare più del testo il modo dell’accompagnamento.
- source_word: ὁ διάβολος
  choice: il diavolo
  rationale: È il titolo tradizionale e immediatamente comprensibile richiesto dal contesto.
- source_word: εἰς ὄρος ὑψηλὸν λίαν
  choice: su un monte molto alto
  rationale: «Su» esprime idiomaticamente il moto verso l’altura; «molto» conserva l’intensificazione di λίαν.
- source_word: δείκνυσιν
  choice: gli mostra
  rationale: Rende direttamente il verbo senza introdurre un’intensità assente nel greco.
- source_word: πάσας τὰς βασιλείας τοῦ κόσμου
  choice: tutti i regni del mondo
  rationale: Conserva sia la totalità sia il senso politico-regale di βασιλεία; κόσμος è reso nel suo senso generale di «mondo».
- source_word: τὴν δόξαν αὐτῶν
  choice: la loro gloria
  rationale: Mantiene il valore lessicale e il possibile richiamo biblico di δόξα, mentre il contesto consente anche il senso concreto di splendore.
theological_decisions:
- issue: Natura della scena sul monte nel racconto della tentazione
  choice: Presentare la scena così come viene narrata, senza spiegarne il meccanismo.
  alternative: Precisare che si tratti di una visione soprannaturale oppure di una veduta geografica letterale.
  rationale: Il greco afferma soltanto che il diavolo porta Gesù su un monte molto alto e gli mostra tutti i regni; la traduzione non deve risolvere ciò che il testo lascia indeterminato.
translation_notes:
  register: Italiano moderno, chiaro e dignitoso. Il presente narrativo conserva la vivacità del greco; la formulazione evita interpretazioni aggiunte sulla natura della visione.
