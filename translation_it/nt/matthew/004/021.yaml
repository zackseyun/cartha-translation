  - severity: low
    issue: Forma possessiva con «padre»
    rationale: «Zebedeo, loro padre» è comprensibile, ma «Zebedeo, il loro padre» è più idiomatico nello standard italiano e mantiene senza cambiamenti il plurale αὐτῶν.
