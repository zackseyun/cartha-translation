  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Καὶ προβὰς ἐκεῖθεν εἶδεν ἄλλους δύο ἀδελφούς, Ἰάκωβον τὸν τοῦ Ζεβεδαίου καὶ Ἰωάννην τὸν ἀδελφὸν αὐτοῦ, ἐν τῷ πλοίῳ μετὰ Ζεβεδαίου τοῦ πατρὸς αὐτῶν καταρτίζοντας τὰ δίκτυα αὐτῶν, καὶ ἐκάλεσεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/021.yaml
  text: And going on from there, he saw two other brothers, James the son of Zebedee and John his brother, in the boat with Zebedee their father, mending their nets, and he called them.
translation:
  language: it
  text: Proseguendo da lì, vide altri due fratelli, Giacomo, figlio di Zebedeo, e Giovanni, suo fratello, che erano nella barca con Zebedeo, il loro padre, e riparavano le loro reti, e li chiamò.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προβὰς ἐκεῖθεν
  choice: Proseguendo da lì
  rationale: Il participio aoristo di προβαίνω esprime il procedere oltre dal luogo precedente; «proseguendo» rende il movimento continuato in un italiano naturale, mentre «da lì» traduce direttamente ἐκεῖθεν.
- source_word: εἶδεν
  choice: vide
  rationale: Semplice aoristo narrativo di ὁράω; «vide» ne conserva il senso piano senza intensificarlo in «notò».
- source_word: ἄλλους δύο ἀδελφούς
  choice: altri due fratelli
  rationale: ἄλλους presenta questa coppia come ulteriore rispetto ai fratelli menzionati in precedenza; la resa mantiene sia il numero sia il rapporto con il contesto.
- source_word: Ἰάκωβον τὸν τοῦ Ζεβεδαίου
  choice: Giacomo, figlio di Zebedeo
  rationale: «Giacomo» è la forma italiana tradizionale del nome Ἰάκωβος; l'espressione genitivale identifica qui la discendenza ed è resa esplicitamente con «figlio di».
- source_word: Ἰωάννην τὸν ἀδελφὸν αὐτοῦ
  choice: Giovanni, suo fratello
  rationale: La frase identifica Giovanni come fratello di Giacomo; la formulazione italiana è concisa e non altera il referente di αὐτοῦ.
- source_word: ἐν τῷ πλοίῳ
  choice: nella barca
  rationale: Nel contesto della pesca, πλοῖον indica una barca e non una grande nave.
- source_word: μετὰ Ζεβεδαίου τοῦ πατρὸς αὐτῶν
  choice: con Zebedeo, loro padre
  rationale: μετά con il genitivo esprime compagnia; «loro padre» conserva il riferimento di αὐτῶν a entrambi i fratelli.
- source_word: καταρτίζοντας τὰ δίκτυα αὐτῶν
  choice: riparavano le loro reti
  rationale: Nel contesto, καταρτίζω indica il rimettere le reti in buone condizioni. «Riparavano» è chiaro e idiomatico; la relativa esplicita che a compiere l'azione erano i due fratelli.
- source_word: ἐκάλεσεν αὐτούς
  choice: li chiamò
  rationale: La resa conserva il verbo semplice καλέω e il suo legame con il tema evangelico della chiamata, senza aggiungere uno scopo non espresso nel versetto.
theological_decisions:
- issue: Implicazione discepolare di ἐκάλεσεν
  choice: li chiamò
  alternative: li chiamò a seguirlo
  rationale: Il contesto immediato chiarisce che si tratta di una chiamata al discepolato, ma il versetto dice soltanto che Gesù li chiamò. La traduzione lascia che sia il contesto a esplicitare lo scopo.
translation_notes:
  register: Italiano moderno, piano e dignitoso. La struttura è stata lievemente esplicitata con «che erano» per evitare un accumulo ambiguo di apposizioni e complementi, mantenendo però un unico periodo narrativo e tutti gli elementi del greco.
