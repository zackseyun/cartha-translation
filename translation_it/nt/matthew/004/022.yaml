  text: οἱ δὲ εὐθέως ἀφέντες τὸ πλοῖον καὶ τὸν πατέρα αὐτῶν ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/022.yaml
  text: And they immediately left the boat and their father and followed him[a].
translation:
  language: it
  text: Ed essi lasciarono subito[a] la barca e il loro padre e lo seguirono.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: «immediatamente».'
    reason: Alternativa lessicale per εὐθέως, che sottolinea la prontezza dell’azione.
lexical_decisions:
- source_word: οἱ δὲ
  choice: Ed essi
  rationale: L’articolo sostantivato riprende i due fratelli menzionati nel contesto; δέ è un connettivo narrativo lieve, reso naturalmente con «Ed» senza introdurre un contrasto marcato.
- source_word: εὐθέως
  choice: subito
  rationale: «Subito» esprime con chiarezza la prontezza della risposta ed è naturale nell’italiano moderno, mantenendo l’enfasi narrativa di Matteo.
- source_word: ἀφέντες
  choice: lasciarono
  rationale: Il participio aoristo indica un’azione logicamente anteriore al verbo principale. La coordinazione italiana «lasciarono… e… seguirono» conserva bene la successione senza ricorrere a una costruzione rigida o arcaica.
- source_word: τὸ πλοῖον
  choice: la barca
  rationale: Nel contesto della pesca sul lago, «barca» è più preciso e naturale di «nave».
- source_word: τὸν πατέρα αὐτῶν
  choice: il loro padre
  rationale: La resa diretta mantiene in evidenza il legame familiare e il costo concreto della risposta, senza aggiungere interpretazioni.
- source_word: ἠκολούθησαν αὐτῷ
  choice: lo seguirono
  rationale: «Seguire» conserva sia il movimento concreto sia la sfumatura di discepolato propria del contesto evangelico; il pronome italiano «lo» rende il dativo greco riferito a Gesù.
theological_decisions:
- issue: Risposta dei discepoli e separazione dalla famiglia
  choice: 'Il testo presenta una risposta immediata e decisiva: i fratelli lasciano la barca e il padre per seguire Gesù.'
  alternative: Interpretare il gesto come abbandono permanente del padre, oppure come semplice allontanamento momentaneo.
  rationale: ἀφέντες significa qui adeguatamente «lasciarono», ma il versetto non precisa la durata o tutte le conseguenze della separazione. La formulazione conserva quindi la forza narrativa senza trasformarla in un’affermazione più assoluta di quanto dica il greco.
translation_notes:
  register: Italiano moderno, semplice e dignitoso. La doppia coordinazione riproduce il ritmo rapido del racconto e rende esplicita, in forma idiomatica, la successione tra il lasciare e il seguire.
