  yaml_path: translation/nt/matthew/004/020.yaml
  text: And they immediately left the nets and followed him.
translation:
  language: it
  text: Ed essi lasciarono subito le reti e lo seguirono.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Ed
  rationale: Congiunzione narrativa lieve che fa avanzare il racconto senza introdurre un contrasto marcato; davanti a «essi», «Ed» è naturale in italiano.
- source_word: εὐθέως
  choice: subito
  rationale: Esprime con chiarezza la prontezza immediata della risposta, in un italiano corrente e dignitoso.
- source_word: ἀφέντες
  choice: lasciate
  rationale: Il participio aoristo indica un'azione logicamente antecedente al verbo principale. La costruzione italiana «lasciate... lo seguirono» conserva in modo conciso tale rapporto senza intensificarlo in «abbandonate».
- source_word: τὰ δίκτυα
  choice: le reti
  rationale: Riproduce l'articolo greco e, nel contesto della pesca, è sufficientemente chiaro senza aggiungere «loro» o «da pesca».
- source_word: ἠκολούθησαν αὐτῷ
  choice: lo seguirono
  rationale: Rende naturalmente il verbo con il dativo e mantiene sia il senso concreto del mettersi dietro a Gesù sia la sfumatura nascente del discepolato.
theological_decisions:
- issue: Sfumatura di discepolato in ἠκολούθησαν αὐτῷ
  choice: lo seguirono
  alternative: andarono dietro a lui
  rationale: «Lo seguirono» conserva insieme il movimento concreto e l'adesione propria del discepolato nel contesto evangelico, senza esplicitare più di quanto dica il testo.
translation_notes:
  register: Italiano moderno standard, conciso e narrativo. L'inversione implicita nella costruzione participiale «lasciate subito le reti» conserva la sequenza del greco con un tono dignitoso ma comprensibile.
