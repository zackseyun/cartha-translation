  source_fidelity: «Allora» rende bene Τότε; «fu condotto» conserva il passivo di ἀνήχθη, e «nel deserto» è una resa italiana naturale di εἰς τὴν ἔρημον. «Dallo Spirito» e «dal diavolo» riproducono correttamente i due complementi d'agente. «Per essere tentato» esprime adeguatamente il valore finale dell'infinito passivo πειρασθῆναι; la nota conserva senza forzature il possibile significato di prova/test.
  naturalness: Il testo è scorrevole, moderno e di registro biblico sobrio. «Fu condotto dallo Spirito nel deserto» è idiomatico in italiano standard; non occorre introdurre un calco come «fu condotto su».
  terminology: La capitalizzazione di «Spirito» è contestualmente giustificata dal racconto precedente senza aggiungere «Santo» al testo. «Deserto», «diavolo» e «tentato» sono terminologia tradizionale e corrente. La nota lessicale è chiara e non impone una lettura dottrinale.
