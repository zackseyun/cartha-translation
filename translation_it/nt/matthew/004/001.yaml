id: MAT.4.1
reference: Matthew 4:1
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Τότε ὁ Ἰησοῦς ἀνήχθη εἰς τὴν ἔρημον ὑπὸ τοῦ πνεύματος, πειρασθῆναι ὑπὸ τοῦ διαβόλου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/001.yaml
  text: Then Jesus was led up into the wilderness by the Spirit to be tempted by the devil[a].
translation:
  language: it
  text: Allora Gesù fu condotto dallo Spirito nel deserto, per essere tentato dal diavolo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oppure «per essere messo alla prova»; il verbo greco può significare sia «tentare» sia «mettere alla prova», anche se qui il contesto immediato favorisce «essere tentato».
    reason: Alternativa lessicale che conserva l'ambivalenza semantica di πειράζω.
lexical_decisions:
- source_word: Τότε
  choice: Allora
  rationale: Connettivo temporale naturale che presenta l'evento successivo nella sequenza narrativa.
- source_word: ἀνήχθη
  choice: fu condotto
  rationale: Mantiene il passivo e rende in italiano corrente l'azione dello Spirito; la sfumatura direzionale di ἀνάγω è già espressa dal moto verso il deserto e non richiede l'innaturale «fu condotto su».
- source_word: εἰς τὴν ἔρημον
  choice: nel deserto
  rationale: «Deserto» è la resa italiana tradizionale e naturale per una regione disabitata, senza precisarne indebitamente il tipo di terreno.
- source_word: ὑπὸ τοῦ πνεύματος
  choice: dallo Spirito
  rationale: Il contesto immediatamente precedente identifica il referente con lo Spirito di Dio; la maiuscola lo segnala senza aggiungere «Santo», assente dal greco.
- source_word: πειρασθῆναι
  choice: per essere tentato
  rationale: L'infinito aoristo passivo esprime lo scopo; poiché l'agente è il diavolo e il seguito narra sollecitazioni al male, «tentato» è la resa contestualmente più adatta, pur conservando in nota il possibile senso di «messo alla prova».
- source_word: ὑπὸ τοῦ διαβόλου
  choice: dal diavolo
  rationale: Nel contesto διάβολος funziona come designazione personale dell'avversario; «diavolo» è la resa italiana chiara e corrente.
theological_decisions:
- issue: Identificazione di τοῦ πνεύματος
  choice: «lo Spirito», riferito allo Spirito Santo
  alternative: «uno spirito» oppure «lo spirito umano»
  rationale: Il racconto del battesimo immediatamente precedente presenta lo Spirito che scende su Gesù; la maiuscola preserva tale riferimento contestuale senza ampliare il testo greco.
- issue: Resa di πειρασθῆναι
  choice: «per essere tentato»
  alternative: «per essere messo alla prova»
  rationale: L'agente e gli episodi successivi favoriscono il senso di tentazione, mentre la nota conserva l'ampiezza semantica del verbo greco e la tensione tra tentazione e prova.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. Sintassi lineare; «fu condotto» evita un calco direzionale poco naturale, mentre «nel deserto» mantiene il consueto linguaggio biblico senza risultare arcaico.
