base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/009.yaml
  text: And he said to him[a], “I will give you all these things, if you fall down and worship me.”
translation:
  language: it
  text: 'E gli disse: «Ti darò tutte queste cose, se ti prostri e mi adori[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oppure «ti inchini davanti a me» o «mi rendi omaggio». Il verbo greco può indicare il prostrarsi o il rendere omaggio, ma qui il contesto favorisce «adorare».
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Conserva il semplice collegamento narrativo senza introdurre una sfumatura temporale non esplicita.
- source_word: εἶπεν αὐτῷ
  choice: gli disse
  rationale: Riproduce i pronomi del greco senza inserire nomi assenti dalla proposizione ed è naturale in italiano.
- source_word: Ταῦτά σοι πάντα δώσω
  choice: Ti darò tutte queste cose
  rationale: Mantiene il futuro dell'offerta, il dativo del destinatario e il valore complessivo di πάντα, mentre il dimostrativo plurale rimanda ai regni e alla loro gloria mostrati nel versetto precedente.
- source_word: ἐὰν
  choice: se
  rationale: Rende direttamente la condizione introdotta dalla congiunzione greca.
- source_word: πεσὼν
  choice: ti prostri
  rationale: Esprime in italiano corrente e dignitoso l'atto corporeo di abbassarsi fino a terra che precede e accompagna l'azione seguente, evitando l'innaturale formulazione letterale «cadendo».
- source_word: προσκυνήσῃς μοι
  choice: mi adori
  rationale: Nel contesto della tentazione e della risposta del versetto seguente, il verbo ha forza religiosa; la nota conserva comunque le possibilità lessicali più ampie.
theological_decisions:
- issue: Resa di προσκυνέω nella richiesta di Satana a Gesù
  choice: mi adori
  alternative: ti inchini davanti a me / mi renda omaggio
  rationale: La risposta immediatamente successiva richiama il culto dovuto esclusivamente a Dio, perciò «adorare» comunica adeguatamente la gravità religiosa della richiesta. La nota evita però di cancellare la più ampia gamma semantica del verbo greco.
translation_notes:
  register: Italiano moderno standard, naturale e dignitoso. «Ti prostri» conserva il gesto fisico distinto da «mi adori»; l'inversione «gli disse» segue fluidamente lo stile narrativo biblico senza risultare arcaica.
