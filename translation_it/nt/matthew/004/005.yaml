id: MAT.4.5
reference: Matthew 4:5
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Τότε παραλαμβάνει αὐτὸν ὁ διάβολος εἰς τὴν ἁγίαν πόλιν, καὶ ⸀ἔστησεν αὐτὸν ἐπὶ τὸ πτερύγιον τοῦ ἱεροῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/005.yaml
  text: Then the devil takes him into the holy city and sets him on the pinnacle of the temple[b][a],
translation:
  language: it
  text: Allora il diavolo lo conduce nella città santa[a] e lo pone sul pinnacolo del tempio[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cioè Gerusalemme.
    reason: cross_reference
  - marker: b
    text: Oppure «sull'ala del tempio»; il greco può indicare un'estremità sporgente o un punto elevato del complesso del tempio.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Allora
  rationale: Rende in modo naturale l'avverbio temporale-sequenziale che introduce l'episodio successivo.
- source_word: παραλαμβάνει
  choice: conduce
  rationale: Il presente storico è conservato per mantenere la vivacità narrativa; «conduce» esprime naturalmente il prendere con sé e portare in un luogo.
- source_word: ὁ διάβολος
  choice: il diavolo
  rationale: Nel contesto è il titolo personale tradizionale e semanticamente appropriato.
- source_word: εἰς τὴν ἁγίαν πόλιν
  choice: nella città santa
  rationale: Conserva la designazione greca e rende il moto a luogo espresso da εἰς senza sostituire nel testo il nome Gerusalemme.
- source_word: ἔστησεν
  choice: lo pone
  rationale: 'Rende il valore causativo e transitivo dell''aoristo: il diavolo fa stare Gesù in quel luogo. Il presente italiano si coordina al presente storico «conduce».'
- source_word: ἐπὶ τὸ πτερύγιον
  choice: sul pinnacolo
  rationale: «Pinnacolo» è la resa tradizionale e plausibile di un'estremità o sporgenza elevata; l'incertezza architettonica è segnalata in nota.
- source_word: τοῦ ἱεροῦ
  choice: del tempio
  rationale: È la forma italiana corrente; qui ἱερόν può indicare più ampiamente il complesso del tempio, precisazione inclusa nella nota.
theological_decisions:
- issue: Identificazione della «città santa»
  choice: Mantenere «città santa» nel testo.
  alternative: Gerusalemme
  rationale: Il greco impiega una designazione onorifica, non il nome proprio; la nota identifica il luogo senza appiattire la formulazione originale.
- issue: Referente architettonico di πτερύγιον τοῦ ἱεροῦ
  choice: «pinnacolo del tempio»
  alternative: «ala del tempio» oppure «punto più alto del complesso del tempio»
  rationale: Il referente preciso non è certo. La resa tradizionale resta plausibile, mentre la nota conserva apertamente l'ambiguità lessicale e architettonica.
translation_notes:
  register: Italiano moderno, chiaro e dignitoso. I presenti storici «conduce» e «pone» mantengono la vivacità del racconto greco. Le note seguono l'ordine dei richiami nel testo e distinguono l'identificazione geografica dall'incertezza architettonica.
