id: MAT.4.15
reference: Matthew 4:15
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Γῆ Ζαβουλὼν καὶ γῆ Νεφθαλίμ, ὁδὸν θαλάσσης, πέραν τοῦ Ἰορδάνου, Γαλιλαία τῶν ἐθνῶν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/015.yaml
  text: Land of Zebulun and land of Naphtali[a], the way of the sea, beyond the Jordan, Galilee of the Gentiles—
translation:
  language: it
  text: «Terra di Zabulon e terra di Neftali, via del mare, al di là del Giordano, Galilea delle genti[a]—»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «Galilea delle nazioni».
    reason: Alternativa lessicale per τῶν ἐθνῶν.
lexical_decisions:
- source_word: Γῆ / γῆ
  choice: Terra / terra
  rationale: Mantiene la ripetizione e il parallelismo geografico del greco; qui indica un territorio, non il suolo o il pianeta.
- source_word: Ζαβουλὼν
  choice: Zabulon
  rationale: Forma tradizionale e riconoscibile del nome biblico nell’italiano corrente.
- source_word: Νεφθαλίμ
  choice: Neftali
  rationale: Forma italiana convenzionale del nome biblico.
- source_word: ὁδὸν θαλάσσης
  choice: via del mare
  rationale: Resa formale e naturale che conserva la concisione e l’ambiguità dell’espressione profetica, senza precisare se si tratti di una strada o di una regione.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: al di là del Giordano
  rationale: Riproduce l’idioma geografico senza specificare indebitamente il punto di osservazione.
- source_word: Γαλιλαία
  choice: Galilea
  rationale: Forma italiana standard del nome della regione.
- source_word: τῶν ἐθνῶν
  choice: delle genti
  rationale: Nel contesto della citazione profetica indica i popoli non ebrei; «genti» conserva sia il valore etnoreligioso sia l’eco biblica, mentre «nazioni» resta una possibile resa letterale.
theological_decisions:
- issue: Resa di ἐθνῶν nella citazione di Isaia
  choice: delle genti
  alternative: delle nazioni
  rationale: «Genti» esprime in modo conciso l’associazione della Galilea con popolazioni non ebree senza restringere il termine a moderne entità politiche; la variante letterale «nazioni» è indicata in nota.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile, con una lieve solennità adatta alla citazione profetica. È preservata la struttura nominale frammentaria del greco e il trattino finale segnala che la citazione continua nel versetto seguente.
