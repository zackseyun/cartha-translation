  text: καὶ νηστεύσας ἡμέρας τεσσεράκοντα καὶ νύκτας τεσσεράκοντα ὕστερον ἐπείνασεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/002.yaml
  text: And after fasting forty days and forty nights[a], he was hungry.
translation:
  language: it
  text: E, dopo aver digiunato quaranta giorni e quaranta notti, ebbe poi fame.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Conserva il semplice collegamento narrativo del greco senza introdurre una sfumatura temporale più forte.
- source_word: νηστεύσας
  choice: dopo aver digiunato
  rationale: Il participio aoristo esprime un'azione anteriore rispetto al verbo principale; questa resa è naturale in italiano e ne preserva il valore temporale.
- source_word: ἡμέρας τεσσεράκοντα καὶ νύκτας τεσσεράκοντα
  choice: quaranta giorni e quaranta notti
  rationale: L'accusativo indica estensione temporale; l'italiano esprime qui naturalmente la durata senza una preposizione.
- source_word: ὕστερον
  choice: alla fine
  rationale: Segnala che la fame sopraggiunse successivamente al periodo di digiuno. «Alla fine» evita la ripetizione poco elegante di «dopo» mantenendo esplicita la successione temporale.
- source_word: ἐπείνασεν
  choice: ebbe fame
  rationale: È la resa italiana corrente e dignitosa del verbo, e comunica chiaramente la reale fame di Gesù senza formulazioni arcaiche o eccessivamente interpretative.
theological_decisions:
- issue: La reale necessità umana di Gesù dopo il digiuno
  choice: ebbe fame
  alternative: cominciò ad avere fame
  rationale: «Ebbe fame» afferma con chiarezza la fame reale di Gesù restando entro il senso lessicale del testo; l'alternativa mette maggiormente in rilievo l'insorgere dello stato, ma risulta più esplicativa.
translation_notes:
  register: Italiano standard moderno, semplice e dignitoso. La sintassi conserva la progressione del greco, ma evita una duplicazione rigida di «dopo» mediante «alla fine».
