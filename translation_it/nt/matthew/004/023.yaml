id: MAT.4.23
reference: Matthew 4:23
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Καὶ περιῆγεν ⸂ἐν ὅλῃ τῇ Γαλιλαίᾳ⸃, διδάσκων ἐν ταῖς συναγωγαῖς αὐτῶν καὶ κηρύσσων τὸ εὐαγγέλιον τῆς βασιλείας καὶ θεραπεύων πᾶσαν νόσον καὶ πᾶσαν μαλακίαν ἐν τῷ λαῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/023.yaml
  text: And he went throughout all Galilee[a], teaching in their synagogues and proclaiming the good news of the kingdom and healing every disease and every sickness among the people.
translation:
  language: it
  text: E percorreva tutta la Galilea, insegnando nelle loro sinagoghe, proclamando la buona notizia del regno[a] e guarendo ogni malattia e ogni infermità fra il popolo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: «il vangelo del regno».'
    reason: Alternativa lessicale tradizionale per εὐαγγέλιον.
lexical_decisions:
- source_word: περιῆγεν
  choice: percorreva
  rationale: L’imperfetto esprime un’attività itinerante continuativa; «percorreva» comunica in modo naturale sia il movimento sia l’estensione del ministero.
- source_word: ἐν ὅλῃ τῇ Γαλιλαίᾳ
  choice: tutta la Galilea
  rationale: Con un verbo di movimento, la frase indica un’attività estesa all’intera regione; in italiano «percorreva tutta la Galilea» è naturale e fedele.
- source_word: διδάσκων
  choice: insegnando
  rationale: Il participio presente descrive un’azione contemporanea al verbo principale ed è reso direttamente con il gerundio italiano.
- source_word: συναγωγαῖς αὐτῶν
  choice: nelle loro sinagoghe
  rationale: «Sinagoghe» indica qui i luoghi o le assemblee ebraiche; il possessivo αὐτῶν viene conservato.
- source_word: κηρύσσων
  choice: proclamando
  rationale: Il verbo denota l’annuncio pubblico da parte di un araldo; «proclamando» ne mantiene il carattere pubblico e autorevole.
- source_word: τὸ εὐαγγέλιον
  choice: la buona notizia
  rationale: Rende direttamente il valore lessicale del termine greco in un italiano moderno e comprensibile, senza perdere il suo contenuto teologico.
- source_word: τῆς βασιλείας
  choice: del regno
  rationale: 'Conserva la costruzione genitivale e la sua possibile ampiezza: la buona notizia appartenente al regno, caratterizzata da esso o che lo riguarda.'
- source_word: θεραπεύων
  choice: guarendo
  rationale: Nel contesto il verbo indica l’effettiva guarigione delle persone.
- source_word: πᾶσαν νόσον
  choice: ogni malattia
  rationale: «Malattia» è una resa comune di νόσος e consente di mantenere distinta la successiva μαλακία.
- source_word: πᾶσαν μαλακίαν
  choice: ogni infermità
  rationale: «Infermità» conserva il senso di debolezza o condizione debilitante e mantiene la coppia enfatica senza ridurla a una ripetizione identica.
- source_word: ἐν τῷ λαῷ
  choice: fra il popolo
  rationale: La preposizione indica l’ambito umano nel quale avvenivano le guarigioni; «fra il popolo» è idiomatico e conserva λαός.
theological_decisions:
- issue: Resa di εὐαγγέλιον
  choice: la buona notizia
  alternative: il vangelo
  rationale: «Buona notizia» rende trasparentemente il significato lessicale, mentre la forma tradizionale è segnalata in nota senza introdurre una differenza dottrinale.
- issue: Relazione espressa da τῆς βασιλείας
  choice: del regno
  alternative: riguardo al regno
  rationale: Il genitivo greco resta semanticamente ampio; «del regno» evita di restringerlo alla sola idea di argomento.
- issue: Portata di πᾶσαν νόσον καὶ πᾶσαν μαλακίαν
  choice: ogni malattia e ogni infermità
  alternative: ogni sorta di malattia e di infermità
  rationale: La ripetizione di πᾶσαν viene mantenuta, preservando l’enfasi comprensiva del testo senza aggiungere una qualificazione non esplicita.
translation_notes:
  register: Italiano moderno standard, dignitoso e accessibile. La coordinazione e i gerundi conservano il ritmo dell’originale; «infermità» è leggermente più formale ma utile per distinguere νόσος da μαλακία.
