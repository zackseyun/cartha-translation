  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Ἀπὸ τότε ἤρξατο ὁ Ἰησοῦς κηρύσσειν καὶ λέγειν· Μετανοεῖτε, ἤγγικεν γὰρ ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/017.yaml
  text: From that time Jesus began to proclaim[a], saying, “Repent[c][b], for the kingdom of heaven has drawn near.”
translation:
  language: it
  text: 'Da allora Gesù cominciò a proclamare, dicendo[a]: «Convertitevi[b], perché il regno dei cieli[c] si è avvicinato[d]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Più letteralmente: «cominciò a proclamare e a dire».'
    reason: previous_rendering
  - marker: b
    text: Il verbo greco indica un cambiamento profondo di mente e di vita; si può anche rendere «ravvedetevi».
    reason: lexical_alternative
  - marker: c
    text: 'In greco: «il regno dei cieli», espressione caratteristica di Matteo, dove «cieli» è al plurale.'
    reason: lexical_alternative
  - marker: d
    text: 'Oppure: «si è fatto vicino» o «è vicino». Il perfetto greco sottolinea una vicinanza ormai sopraggiunta e tuttora effettiva.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ τότε
  choice: Da allora
  rationale: Segnala con naturalezza una svolta nel racconto e l'inizio di una nuova fase dell'attività di Gesù.
- source_word: ἤρξατο
  choice: cominciò
  rationale: Rende direttamente l'inizio di un'azione continuativa ed è adatto al registro narrativo.
- source_word: κηρύσσειν
  choice: a proclamare
  rationale: Esprime l'annuncio pubblico proprio di κηρύσσω senza restringerlo al senso ecclesiastico moderno di «predicare».
- source_word: καὶ λέγειν
  choice: dicendo
  rationale: In italiano introduce in modo scorrevole il contenuto della proclamazione; una nota conserva la coordinazione più letterale dei due infiniti greci.
- source_word: Μετανοεῖτε
  choice: Convertitevi
  rationale: Comunica in italiano biblico moderno un cambiamento radicale di orientamento, pensiero e condotta, non una semplice revisione intellettuale.
- source_word: ἤγγικεν
  choice: si è fatto vicino
  rationale: 'L''espressione italiana conserva il valore risultativo del perfetto: la vicinanza è sopraggiunta e permane.'
- source_word: βασιλεία
  choice: regno
  rationale: È l'equivalente italiano più riconoscibile e lascia aperti sia il senso del dominio regale sia quello della sfera in cui esso si manifesta.
- source_word: τῶν οὐρανῶν
  choice: dei cieli
  rationale: Conserva il plurale caratteristico dell'espressione matteana ed è naturale nell'italiano biblico.
theological_decisions:
- issue: Portata di Μετανοεῖτε
  choice: Convertitevi
  alternative: Ravvedetevi; cambiate mente e vita
  rationale: «Convertitevi» esprime una svolta integrale verso Dio senza ridurla al solo rimorso o a un cambiamento puramente mentale; la nota segnala l'ampiezza semantica senza imporre una lettura confessionale.
- issue: Senso di βασιλεία τῶν οὐρανῶν
  choice: il regno dei cieli
  alternative: la regalità dei cieli; il regno del cielo
  rationale: Mantiene la formula distintiva di Matteo e la sua tensione tra governo regale e regno, senza sostituirla esplicitamente con «regno di Dio».
- issue: Valore aspettuale di ἤγγικεν
  choice: si è fatto vicino
  alternative: è vicino; si è avvicinato
  rationale: Conserva l'idea che la vicinanza del regno sia ormai sopraggiunta e resti effettiva, evitando di precisarne in modo indebito la modalità teologica.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. «Da allora» e «dicendo» assicurano fluidità narrativa; «proclamare», «convertitevi» e «regno dei cieli» mantengono il tono biblico senza risultare inutilmente arcaici.
