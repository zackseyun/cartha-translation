  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Περιπατῶν δὲ παρὰ τὴν θάλασσαν τῆς Γαλιλαίας εἶδεν δύο ἀδελφούς, Σίμωνα τὸν λεγόμενον Πέτρον καὶ Ἀνδρέαν τὸν ἀδελφὸν αὐτοῦ, βάλλοντας ἀμφίβληστρον εἰς τὴν θάλασσαν, ἦσαν γὰρ ἁλιεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/018.yaml
  text: As he was walking beside the Sea of Galilee[a], he saw two brothers, Simon who is called Peter and Andrew his brother, casting a net into the sea, for they were fishermen.
translation:
  language: it
  text: 'Mentre camminava lungo il mare di Galilea, vide due fratelli: Simone, chiamato Pietro, e Andrea, suo fratello. Stavano gettando una rete[a] in mare, perché erano pescatori.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Più precisamente, una «rete da lancio», cioè una rete che veniva gettata in acqua per pescare.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περιπατῶν δὲ
  choice: Mentre camminava
  rationale: Il participio presente indica un’azione in corso contemporanea al verbo principale; la subordinata temporale è naturale in italiano. δέ svolge qui una funzione narrativa di transizione e non richiede necessariamente una resa esplicita.
- source_word: παρὰ τὴν θάλασσαν τῆς Γαλιλαίας
  choice: lungo il mare di Galilea
  rationale: παρά con l’accusativo indica un movimento lungo o accanto alla riva. «Mare di Galilea» conserva la denominazione geografica tradizionale e il termine θάλασσα.
- source_word: εἶδεν δύο ἀδελφούς
  choice: vide due fratelli
  rationale: Resa diretta dell’aoristo narrativo e del riferimento a due fratelli maschi reali.
- source_word: Σίμωνα τὸν λεγόμενον Πέτρον
  choice: Simone, chiamato Pietro
  rationale: Il participio passivo λεγόμενον identifica Simone mediante il nome con cui era chiamato; la costruzione italiana è concisa e naturale.
- source_word: Ἀνδρέαν τὸν ἀδελφὸν αὐτοῦ
  choice: Andrea, suo fratello
  rationale: L’apposizione esplicita la relazione di Andrea con Simone senza appesantire la frase.
- source_word: βάλλοντας ἀμφίβληστρον εἰς τὴν θάλασσαν
  choice: Stavano gettando una rete[a] in mare
  rationale: Il participio presente descrive l’azione in corso quando Gesù li vide. ἀμφίβληστρον è una rete da pesca lanciata in acqua; nel testo si usa il termine comune, precisato in nota.
- source_word: ἦσαν γὰρ ἁλιεῖς
  choice: perché erano pescatori
  rationale: γάρ introduce la ragione esplicativa dell’azione; «perché» rende chiaramente tale rapporto in italiano moderno. ἁλιεῖς designa qui uomini che esercitavano la pesca.
theological_decisions: []
translation_notes:
  register: Italiano moderno, dignitoso e narrativamente scorrevole. La lunga frase greca è articolata in due periodi per chiarezza, senza alterare il rapporto temporale o causale tra le azioni.
