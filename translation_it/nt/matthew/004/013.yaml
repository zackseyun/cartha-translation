id: MAT.4.13
reference: Matthew 4:13
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: καὶ καταλιπὼν τὴν Ναζαρὰ ἐλθὼν κατῴκησεν εἰς Καφαρναοὺμ τὴν παραθαλασσίαν ἐν ὁρίοις Ζαβουλὼν καὶ Νεφθαλίμ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/013.yaml
  text: And leaving Nazara[a], he came and settled in Capernaum by the sea, in the region of Zebulun and Naphtali.
translation:
  language: it
  text: E, lasciata Nazara[a], venne ad abitare a Cafarnao, sul mare, nel territorio di Zabulon e Neftali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Greco: «Nazara»; molte traduzioni hanno «Nazaret».'
    reason: alternative_reading
lexical_decisions:
- source_word: καταλιπὼν
  choice: lasciata
  rationale: Il participio aoristo esprime un’azione anteriore a quella principale; la costruzione italiana «lasciata Nazara» conserva con naturalezza la sequenza.
- source_word: Ναζαρὰ
  choice: Nazara
  rationale: Riproduce la forma greca specifica Ναζαρά attestata nel versetto; la forma italiana tradizionale «Nazaret» è segnalata in nota.
- source_word: ἐλθὼν
  choice: venne
  rationale: Il participio aoristo è reso con un verbo finito coordinato, soluzione idiomatica che mantiene la successione delle azioni.
- source_word: κατῴκησεν
  choice: ad abitare
  rationale: Nel costrutto «venne ad abitare» indica che Gesù prese dimora nel luogo, evitando sia l’arcaismo «dimorò» sia una parafrasi eccessiva.
- source_word: Καφαρναοὺμ
  choice: Cafarnao
  rationale: Forma italiana standard del toponimo.
- source_word: τὴν παραθαλασσίαν
  choice: sul mare
  rationale: Rende in modo conciso e naturale l’aggettivo che qualifica Cafarnao come località situata presso il mare; «mare» conserva la designazione del testo senza specificare qui il lago.
- source_word: ἐν ὁρίοις
  choice: nel territorio
  rationale: Il plurale ὅρια può indicare confini, distretto o territorio; nel contesto geografico «territorio» è naturale e non impone confini amministrativi troppo precisi.
- source_word: Ζαβουλὼν
  choice: Zabulon
  rationale: Forma italiana biblica corrente del nome tribale e geografico.
- source_word: Νεφθαλίμ
  choice: Neftali
  rationale: Forma italiana biblica corrente del nome tribale e geografico.
theological_decisions: []
