  source_fidelity: «E grandi folle lo seguirono» rende con fedeltà καὶ ἠκολούθησαν αὐτῷ ὄχλοι πολλοί, mantenendo il carattere narrativo di «seguirono» senza attribuire alle folle un discepolato pienamente impegnato. L'elenco delle provenienze conserva tutte le cinque aree e il valore di provenienza di ἀπό; «da oltre il Giordano» riproduce in modo adeguato πέραν τοῦ Ἰορδάνου senza precisare indebitamente una sponda o un territorio.
