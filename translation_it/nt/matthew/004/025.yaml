  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: καὶ ἠκολούθησαν αὐτῷ ὄχλοι πολλοὶ ἀπὸ τῆς Γαλιλαίας καὶ Δεκαπόλεως καὶ Ἱεροσολύμων καὶ Ἰουδαίας καὶ πέραν τοῦ Ἰορδάνου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/025.yaml
  text: And large crowds followed him from Galilee and the Decapolis and Jerusalem and Judea and beyond the Jordan[a].
translation:
  language: it
  text: E grandi folle lo seguirono dalla Galilea, dalla Decapoli, da Gerusalemme, dalla Giudea e da oltre il Giordano.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «dall’altra parte del Giordano».'
    reason: Alternativa lessicale che esplicita il valore spaziale di πέραν τοῦ Ἰορδάνου.
lexical_decisions:
- source_word: ἠκολούθησαν
  choice: seguirono
  rationale: L’aoristo indicativo di ἀκολουθέω indica l’atto narrativo del seguire; «seguirono» è naturale e mantiene sia il movimento fisico sia la possibile sfumatura di interesse discepolare, senza implicare un impegno pieno.
- source_word: ὄχλοι πολλοὶ
  choice: grandi folle
  rationale: La combinazione esprime folle numerose o vaste; «grandi folle» è idiomatico, chiaro e dignitoso in italiano moderno.
- source_word: ἀπὸ
  choice: da / dalla
  rationale: Segnala la provenienza delle folle. In italiano la preposizione viene ripetuta davanti ai diversi toponimi per chiarezza e naturalezza.
- source_word: Γαλιλαίας
  choice: Galilea
  rationale: Forma italiana standard del nome della regione.
- source_word: Δεκαπόλεως
  choice: Decapoli
  rationale: Forma italiana tradizionale e corrente del nome della regione delle dieci città.
- source_word: Ἱεροσολύμων
  choice: Gerusalemme
  rationale: Forma italiana standard del toponimo, resa al singolare secondo l’uso italiano.
- source_word: Ἰουδαίας
  choice: Giudea
  rationale: Forma italiana standard del nome della regione.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: da oltre il Giordano
  rationale: Conserva il senso spaziale di una provenienza dalla regione situata al di là del fiume, senza identificare più precisamente il territorio.
- source_word: καὶ ... καὶ ... καὶ
  choice: e ... da ... da ... e da
  rationale: La struttura cumulativa dell’elenco è mantenuta, mentre la ripetizione italiana delle preposizioni rende chiara la provenienza da ciascuna località.
theological_decisions: []
translation_notes:
  register: Italiano moderno standard, narrativo e dignitoso. La ripetizione di «da» davanti ai toponimi evita ambiguità sintattiche; «oltre il Giordano» mantiene la prospettiva geografica del greco senza precisare quale sponda sia intesa.
