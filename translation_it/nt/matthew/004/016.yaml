  source_fidelity: 'Il testo rende con precisione i principali elementi greci: λαός come «popolo», i participi di κάθημαι mediante «sedeva/sedevano», σκοτία come «tenebre», il perfetto parallelismo delle due occorrenze di φῶς, χώρα come «regione», σκιὰ θανάτου come «ombra della morte» e ἀνατέλλω con «sorse». «Su quelli» comunica idiomaticamente la direzione/beneficio implicita nel dativo αὐτοῖς senza aggiungere interpretazioni.'
