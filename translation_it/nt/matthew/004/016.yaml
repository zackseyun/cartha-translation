id: MAT.4.16
reference: Matthew 4:16
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ὁ λαὸς ὁ καθήμενος ἐν ⸀σκοτίᾳ ⸂φῶς εἶδεν⸃ μέγα, καὶ τοῖς καθημένοις ἐν χώρᾳ καὶ σκιᾷ θανάτου φῶς ἀνέτειλεν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/016.yaml
  text: The people sitting in darkness saw a great light[a], and on those sitting in the region and shadow of death, a light dawned.
translation:
  language: it
  text: Il popolo che sedeva nelle tenebre[a] vide una grande luce, e su quelli che sedevano nella regione e nell’ombra della morte sorse una luce.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oppure «nell’oscurità profonda». L’espressione «ombra della morte» è mantenuta perché il greco menziona esplicitamente la morte e richiama una nota immagine biblica.
    reason: Alternativa lessicale e conservazione dell’eco biblica.
lexical_decisions:
- source_word: λαὸς
  choice: il popolo
  rationale: Rende naturalmente il collettivo umano senza introdurre il senso politico moderno di «nazione».
- source_word: καθήμενος / καθημένοις
  choice: che sedeva / che sedevano
  rationale: Conserva il valore letterale dei participi e il parallelismo evocativo della citazione di Isaia; «abitava» sarebbe possibile ma attenuerebbe l’immagine.
- source_word: σκοτίᾳ
  choice: tenebre
  rationale: Mantiene sia la forza concreta sia quella metaforica del termine senza precisare indebitamente la natura dell’oscurità.
- source_word: φῶς εἶδεν μέγα
  choice: vide una grande luce
  rationale: Il passato remoto rende bene l’aoristo nella citazione narrativa, mentre l’articolo indeterminativo è necessario nell’italiano naturale.
- source_word: χώρᾳ
  choice: regione
  rationale: Esprime l’area o il territorio indicato dal greco senza suggerire uno Stato moderno.
- source_word: σκιᾷ θανάτου
  choice: ombra della morte
  rationale: Conserva esplicitamente θανάτου e la nota immagine biblica, senza ridurla alla sola «oscurità profonda».
- source_word: ἀνέτειλεν
  choice: sorse
  rationale: Riproduce l’immagine del sorgere di una luce ed è naturale con il soggetto «una luce».
- source_word: αὐτοῖς
  choice: su quelli
  rationale: La costruzione italiana «sorgere su» esprime in modo idiomatico il dativo dei destinatari, già identificati da τοῖς καθημένοις.
theological_decisions:
- issue: Natura delle immagini delle tenebre e della luce
  choice: Conservare le immagini senza definirne in modo esclusivo il significato spirituale, morale, politico o esistenziale.
  alternative: Esplicitare le tenebre come peccato o ignoranza e la luce come rivelazione salvifica del Messia.
  rationale: La citazione profetica possiede una ricca portata teologica, ma questa proposizione greca non restringe esplicitamente il significato delle immagini; la traduzione ne preserva quindi l’apertura e la tensione.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. La ripetizione di «sedeva/sedevano» e di «luce» è intenzionale, perché conserva il parallelismo e l’immagine del testo greco.
