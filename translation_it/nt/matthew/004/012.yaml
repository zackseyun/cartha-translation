  text: Ἀκούσας ⸀δὲ ὅτι Ἰωάννης παρεδόθη ἀνεχώρησεν εἰς τὴν Γαλιλαίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/012.yaml
  text: When he heard that John had been handed over[a], he withdrew into Galilee.
translation:
  language: it
  text: Quando udì che Giovanni era stato consegnato[a], si ritirò in Galilea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure, più specificamente in questo contesto: «era stato arrestato».'
    reason: Alternativa lessicale contestuale per παρεδόθη.
lexical_decisions:
- source_word: Ἀκούσας
  choice: Quando udì
  rationale: Il participio aoristo ha valore temporale rispetto al verbo principale; «Quando udì» è naturale in italiano e lascia implicito il soggetto, come il greco nel contesto.
- source_word: δὲ
  choice: non espresso separatamente
  rationale: Qui δέ è un lieve connettivo narrativo. In italiano il passaggio risulta naturale senza aggiungere «ora» o «ma», che potrebbero attribuirgli un peso eccessivo.
- source_word: Ἰωάννης
  choice: Giovanni
  rationale: Forma italiana tradizionale e corrente del nome biblico.
- source_word: παρεδόθη
  choice: era stato consegnato
  rationale: Il passivo di παραδίδωμι ha un significato più ampio di «arrestare». La resa conserva l'idea di essere dato in potere altrui e le possibili risonanze interne a Matteo; il senso contestuale più specifico è indicato in nota.
- source_word: ἀνεχώρησεν
  choice: si ritirò
  rationale: In Matteo ἀναχωρέω indica spesso l'allontanarsi o il ritirarsi in risposta a una circostanza; «si ritirò» conserva questa sfumatura senza suggerire necessariamente una fuga.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: in Galilea
  rationale: Con un verbo di moto, l'italiano idiomatico «in Galilea» esprime adeguatamente la direzione indicata da εἰς.
theological_decisions:
- issue: Resa di παραδίδωμι riferito a Giovanni
  choice: era stato consegnato
  alternative: era stato arrestato
  rationale: «Consegnato» mantiene l'ampiezza semantica del verbo greco e le sue possibili risonanze nel Vangelo senza limitare il testo all'atto tecnico dell'arresto. La nota offre il senso contestuale più specifico.
translation_notes:
  register: Italiano standard moderno, sobrio e dignitoso. La sintassi è scorrevole ma vicina alla struttura greca; non viene introdotto un marcatore discorsivo autonomo per δέ.
