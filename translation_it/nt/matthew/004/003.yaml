id: MAT.4.3
reference: Matthew 4:3
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: καὶ προσελθὼν ⸂ὁ πειράζων εἶπεν αὐτῷ⸃· Εἰ υἱὸς εἶ τοῦ θεοῦ, εἰπὲ ἵνα οἱ λίθοι οὗτοι ἄρτοι γένωνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/003.yaml
  text: And the tempter came and said to him[a], “If you are the Son of God[b], tell these stones to become bread.”
translation:
  language: it
  text: 'E il tentatore, avvicinatosi, gli disse: «Se sei il Figlio di Dio[a], di’ che queste pietre diventino pani[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «Poiché sei il Figlio di Dio». In greco la condizione può avere il valore di una sfida, senza esprimere necessariamente un dubbio.'
    reason: alternative_reading
  - marker: b
    text: 'Il greco usa il plurale: «pani», cioè pagnotte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: avvicinatosi
  rationale: Il participio aoristo di προσέρχομαι indica il movimento verso Gesù prima dell’azione principale; «avvicinatosi» lo conserva in modo naturale e dignitoso.
- source_word: ὁ πειράζων
  choice: il tentatore
  rationale: Il participio presente sostantivato designa colui che mette Gesù alla prova; nel contesto «il tentatore» è chiaro e tradizionale senza attenuare la valenza negativa della scena.
- source_word: εἶπεν αὐτῷ
  choice: gli disse
  rationale: Resa italiana diretta e idiomatica di λέγω con oggetto indiretto.
- source_word: Εἰ
  choice: Se
  rationale: Mantiene la forma condizionale greca e lascia aperto se si tratti di dubbio, sfida o presupposto retorico.
- source_word: υἱὸς ... τοῦ θεοῦ
  choice: il Figlio di Dio
  rationale: Il sostantivo predicativo senza articolo identifica qui il titolo cristologico noto; l’italiano richiede naturalmente l’articolo determinativo.
- source_word: εἰπὲ ἵνα
  choice: di’ che
  rationale: La costruzione con imperativo e ἵνα introduce ciò che le parole devono produrre; «di’ che» conserva il riferimento al parlare senza rafforzarlo arbitrariamente in «ordina».
- source_word: οἱ λίθοι οὗτοι
  choice: queste pietre
  rationale: Resa diretta del sostantivo e del dimostrativo, adatta al contesto del deserto.
- source_word: ἄρτοι
  choice: pani
  rationale: Il greco ha il plurale concreto, riferibile a pagnotte o pani; l’italiano «pani» conserva il numero senza risultare innaturale.
- source_word: γένωνται
  choice: diventino
  rationale: Il congiuntivo di γίνομαι è reso direttamente con «diventino», mantenendo neutra la descrizione del mutamento.
theological_decisions:
- issue: Valore della condizione Εἰ υἱὸς εἶ τοῦ θεοῦ
  choice: «Se sei il Figlio di Dio»
  alternative: «Poiché sei il Figlio di Dio» / «Se davvero sei il Figlio di Dio»
  rationale: «Se» preserva la forma greca e la tensione retorica, senza decidere se il tentatore esprima dubbio, concessione o sfida.
- issue: Titolo cristologico υἱὸς τοῦ θεοῦ
  choice: «il Figlio di Dio»
  alternative: «un figlio di Dio»
  rationale: La costruzione predicativa e il contesto matteano indicano il titolo identificativo di Gesù, non l’appartenenza indefinita a una categoria.
translation_notes:
  register: Italiano standard moderno, scorrevole ma dignitoso. L’ordine della frase conserva il participio introduttivo del greco; «di’» mantiene la forza performativa della parola senza introdurre l’idea più esplicita di un comando.
