  source_fidelity: «Gesù gli disse» rende fedelmente ἔφη αὐτῷ ὁ Ἰησοῦς. «Sta anche scritto» esprime in italiano in modo idiomatico Πάλιν γέγραπται come introduzione di una controcitazione scritturale. «Non metterai alla prova» conserva la forma proibitiva futura di Οὐκ ἐκπειράσεις e il senso di sottoporre Dio a una prova provocatoria. «Il Signore, il tuo Dio» riproduce correttamente l'apposizione κύριον τὸν θεόν σου.
