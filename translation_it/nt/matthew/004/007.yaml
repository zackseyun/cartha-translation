  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ἔφη αὐτῷ ὁ Ἰησοῦς· Πάλιν γέγραπται· Οὐκ ἐκπειράσεις κύριον τὸν θεόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/007.yaml
  text: 'Jesus said to him[b][a], “Again it is written: ‘You shall not put the Lord your God to the test.’”'
translation:
  language: it
  text: 'Gesù gli disse: «Sta anche scritto: “Non metterai alla prova il Signore, il tuo Dio”».[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «Non tenterai il Signore, il tuo Dio». Il verbo greco può significare «mettere alla prova» o «tentare».'
    reason: lexical_alternative
  - marker: b
    text: Citazione di Deuteronomio 6:16. Nel testo greco «il Signore» riflette la resa della Settanta del nome divino.
    reason: cross_reference
lexical_decisions:
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: Gesù gli disse
  rationale: Rende in italiano naturale l’introduzione narrativa al discorso; il dativo αὐτῷ è espresso dal pronome indiretto «gli».
- source_word: Πάλιν
  choice: anche
  rationale: 'Nel contesto introduce una controcitazione scritturale: «Sta anche scritto» comunica che esiste un ulteriore testo pertinente senza suggerire che la medesima frase sia scritta due volte.'
- source_word: γέγραπται
  choice: Sta scritto
  rationale: Formula italiana tradizionale e tuttora comprensibile per una citazione autorevole; conserva il valore risultativo del perfetto greco.
- source_word: Οὐκ ἐκπειράσεις
  choice: Non metterai alla prova
  rationale: Il futuro italiano conserva la forma proibitiva della citazione e «mettere alla prova» rende il verbo intensivo ἐκπειράζω in modo naturale.
- source_word: κύριον τὸν θεόν σου
  choice: il Signore, il tuo Dio
  rationale: «Signore» traduce κύριος nel testo greco; la virgola chiarisce che «il tuo Dio» è in apposizione.
theological_decisions:
- issue: Resa di κύριος nella citazione riferita al Dio d’Israele
  choice: il Signore
  alternative: il SIGNORE
  rationale: Il testo immediato greco reca κύριος e segue la formulazione della Settanta. «Il Signore» traduce direttamente il greco, mentre una nota segnala il retroterra del nome divino senza sostituirlo nel testo principale.
- issue: Forza del verbo ἐκπειράζω
  choice: mettere alla prova
  alternative: tentare / provare
  rationale: La resa scelta conserva l’idea di sottoporre Dio a una verifica provocatoria senza restringere il senso alla sola tentazione morale.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. «Sta anche scritto» è idiomatico nel registro biblico senza risultare arcaico; il futuro proibitivo mantiene la forma solenne della citazione. I marcatori seguono la proposizione a cui si riferiscono.
