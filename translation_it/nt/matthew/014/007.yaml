  text: Therefore he promised with an oath to give her whatever she might ask[a].
translation:
  language: it
  text: Perciò le promise con giuramento di darle qualunque cosa lei gli chiedesse[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «qualsiasi cosa lei gli chiedesse». Il greco usa una proposizione relativa indefinita (ὃ ἐὰν αἰτήσηται), riferita a una richiesta futura non ancora determinata.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν
  choice: Perciò
  rationale: Introduce la conseguenza di quanto precede e conserva in italiano naturale il valore inferenziale e risultativo del connettivo.
- source_word: μετὰ ὅρκου
  choice: con giuramento
  rationale: Rende direttamente l'idea che la promessa fu accompagnata e vincolata da un giuramento, in un registro dignitoso e corrente.
- source_word: ὡμολόγησεν αὐτῇ
  choice: le promise
  rationale: Nel contesto ὁμολογέω indica un impegno formale; il pronome dativo italiano «le» identifica naturalmente la destinataria.
- source_word: δοῦναι
  choice: di darle
  rationale: L'infinito esprime il contenuto della promessa; la ripresa pronominale è idiomatica in italiano e chiarisce che il dono sarebbe stato fatto alla ragazza.
- source_word: ὃ ἐὰν αἰτήσηται
  choice: qualunque cosa avesse chiesto
  rationale: La relativa indefinita con ἐάν e congiuntivo indica una richiesta futura non ancora determinata; il congiuntivo trapassato è naturale nella subordinazione al passato e ne preserva il carattere aperto.
