translation_notes:
  register: Italiano standard moderno, narrativo e dignitoso. «Perciò» mantiene il nesso con il contesto precedente; «con giuramento» evita formulazioni arcaiche. La costruzione «qualunque cosa avesse chiesto» conserva l'apertura della richiesta senza appesantire la frase.
