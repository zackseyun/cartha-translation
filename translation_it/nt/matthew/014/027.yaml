source:
  edition: SBLGNT
  text: ⸀εὐθὺς δὲ ἐλάλησεν ⸂αὐτοῖς ὁ Ἰησοῦς⸃ λέγων· Θαρσεῖτε, ἐγώ εἰμι· μὴ φοβεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/027.yaml
  text: But immediately Jesus spoke to them[a], saying, “Take courage; it is I. Do not be afraid.”
translation:
  language: it
  text: 'Ma subito Gesù parlò loro[a], dicendo: «Coraggio! Sono io. Non abbiate paura».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Più letteralmente: «Io sono». Qui il greco può servire come semplice autoidentificazione, anche se alcuni vi colgono una possibile eco della designazione divina.'
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθύς
  choice: subito
  rationale: Esprime con naturalezza e precisione il valore temporale dell’avverbio nel racconto.
- source_word: δὲ
  choice: Ma
  rationale: Segnala il lieve contrasto con la paura dei discepoli descritta nel versetto precedente.
- source_word: ἐλάλησεν αὐτοῖς ὁ Ἰησοῦς
  choice: Gesù parlò loro
  rationale: Resa fedele e scorrevole del verbo con il complemento dativo, mantenendo esplicito il soggetto.
- source_word: λέγων
  choice: dicendo
  rationale: Conserva la struttura participiale greca senza risultare innaturale in italiano.
- source_word: Θαρσεῖτε
  choice: Coraggio!
  rationale: Imperativo plurale reso con un’esortazione idiomatica, diretta e comprensibile nell’italiano moderno.
- source_word: ἐγώ εἰμι
  choice: Sono io
  rationale: Nel contesto immediato comunica la naturale autoidentificazione di Gesù; la nota conserva la formulazione più letterale e la sua possibile risonanza teologica.
- source_word: μὴ φοβεῖσθε
  choice: Non abbiate paura
  rationale: Resa italiana corrente dell’imperativo negativo, senza specificarne eccessivamente l’aspetto.
theological_decisions:
- issue: Se ἐγώ εἰμι sia semplice autoidentificazione oppure possibile richiamo alla formula divina «Io sono»
  choice: 'Nel testo principale: «Sono io»'
  alternative: «Io sono»
  rationale: Il contesto immediato presenta Gesù che rassicura i discepoli impauriti identificandosi. La nota preserva la forma più letterale e la possibile risonanza della designazione divina, senza imporla come unica interpretazione.
translation_notes:
  register: Italiano moderno standard, dignitoso e accessibile. La punteggiatura rende distintamente le tre brevi frasi rassicuranti di Gesù; «Coraggio!» evita una formulazione rigida pur conservando la forza dell’imperativo plurale.
