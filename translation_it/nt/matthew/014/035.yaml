  text: καὶ ἐπιγνόντες αὐτὸν οἱ ἄνδρες τοῦ τόπου ἐκείνου ἀπέστειλαν εἰς ὅλην τὴν περίχωρον ἐκείνην, καὶ προσήνεγκαν αὐτῷ πάντας τοὺς κακῶς ἔχοντας,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/035.yaml
  text: And when the men of that place recognized him[a], they sent into that whole surrounding region and brought to him all who were sick[b],
translation:
  language: it
  text: Quando gli uomini di quel luogo lo riconobbero, mandarono in tutta quella regione circostante[a] e gli portarono tutti quelli che stavano male[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Il greco dice letteralmente «mandarono in tutta quella regione circostante», lasciando sottinteso l''oggetto: poteva trattarsi di messaggeri o di un avviso.'
    reason: lexical_alternative
  - marker: b
    text: Letteralmente «tutti quelli che stavano male», espressione idiomatica riferita ai malati o agli infermi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνόντες
  choice: lo riconobbero
  rationale: Il participio aoristo indica che gli uomini identificarono Gesù; in italiano la coordinazione con un verbo finito è più naturale e mantiene la successione narrativa.
- source_word: οἱ ἄνδρες τοῦ τόπου ἐκείνου
  choice: gli uomini di quel luogo
  rationale: Conserva il riferimento specifico agli uomini espresso da ἄνδρες e rende τόπος con il naturale «luogo».
- source_word: ἀπέστειλαν εἰς ὅλην τὴν περίχωρον ἐκείνην
  choice: mandarono messaggeri in tutta la regione circostante
  rationale: ἀποστέλλω significa «mandare»; poiché in greco l'oggetto resta sottinteso, «messaggeri» esplicita in modo idiomatico una possibilità contestuale senza nascondere l'ellissi, segnalata in nota. περίχωρος indica il territorio circostante.
- source_word: προσήνεγκαν αὐτῷ
  choice: gli portarono
  rationale: Nel contesto προσφέρω descrive il condurre persone da Gesù, non un'offerta cultuale.
- source_word: πάντας τοὺς κακῶς ἔχοντας
  choice: tutti quelli che stavano male
  rationale: Riproduce con un'espressione italiana corrente l'idioma κακῶς ἔχειν, che qui si riferisce a persone malate o inferme, conservandone però la formulazione ampia.
theological_decisions: []
translation_notes:
  register: Italiano moderno, chiaro e dignitoso. La frase coordina le azioni per fluidità narrativa; «poi» distingue l'invio dei messaggeri dal successivo arrivo dei malati senza introdurre un forte intervallo temporale.
