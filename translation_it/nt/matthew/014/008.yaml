  text: ἡ δὲ προβιβασθεῖσα ὑπὸ τῆς μητρὸς αὐτῆς· Δός μοι, φησίν, ὧδε ἐπὶ πίνακι τὴν κεφαλὴν Ἰωάννου τοῦ βαπτιστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/008.yaml
  text: And she, having been prompted by her mother, says, “Give me here on a platter the head of John the Baptizer.”
translation:
  language: it
  text: 'E lei, spinta da sua madre, dice: «Dammi qui, su un vassoio, la testa di Giovanni Battista[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Letteralmente, «Giovanni il Battezzatore».
    reason: lexical_alternative
lexical_decisions:
- source_word: προβιβασθεῖσα
  choice: spinta
  rationale: Il participio aoristo passivo esprime l’influenza esercitata in precedenza dalla madre sulla ragazza. «Spinta» conserva il valore passivo e causativo senza precisare indebitamente se si trattasse di un’istruzione formale o di un’esortazione.
- source_word: ὑπὸ τῆς μητρὸς αὐτῆς
  choice: dalla madre
  rationale: Ὑπό con il genitivo indica l’agente personale della forma passiva; «dalla madre» è la resa italiana diretta e naturale.
- source_word: Δός μοι
  choice: Dammi
  rationale: L’imperativo aoristo di δίδωμι è una richiesta formulata come comando diretto; «Dammi» è conciso e idiomatico.
- source_word: φησίν
  choice: dice
  rationale: Si conserva il presente storico greco, che conferisce vivacità alla narrazione.
- source_word: ὧδε
  choice: qui
  rationale: L’avverbio deittico indica «qui» e può suggerire anche l’immediatezza della richiesta, senza che sia necessario esplicitarla con «subito».
- source_word: ἐπὶ πίνακι
  choice: su un vassoio
  rationale: Nel contesto del banchetto πίναξ designa un piatto largo o vassoio da portata; «vassoio» è naturale e visivamente preciso in italiano.
- source_word: τὴν κεφαλὴν
  choice: la testa
  rationale: La resa letterale conserva la crudezza intenzionale e la concretezza della richiesta.
- source_word: Ἰωάννου τοῦ βαπτιστοῦ
  choice: Giovanni il Battezzatore
  rationale: Βαπτιστής è un nome d’agente che descrive l’attività di Giovanni. «Battezzatore» ne rende trasparente il valore, mentre la forma tradizionale è segnalata in nota.
theological_decisions:
- issue: Resa del titolo βαπτιστής attribuito a Giovanni
  choice: Giovanni il Battezzatore
  alternative: Giovanni Battista
  rationale: La scelta traduce il valore descrittivo del nome d’agente greco anziché trattarlo come parte fissa del nome. La forma italiana tradizionale, più familiare, è conservata in nota senza introdurre differenze dottrinali.
translation_notes:
  register: Italiano moderno, dignitoso e narrativamente vivido. «Lei» evita l’ormai letterario «ella»; il presente «dice» riproduce il presente storico del greco. La punteggiatura mantiene chiaro il passaggio dalla narrazione alla richiesta diretta.
