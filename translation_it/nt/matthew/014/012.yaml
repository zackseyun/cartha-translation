id: MAT.14.12
reference: Matthew 14:12
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: καὶ προσελθόντες οἱ μαθηταὶ αὐτοῦ ἦραν τὸ ⸀πτῶμα καὶ ἔθαψαν ⸀αὐτόν, καὶ ἐλθόντες ἀπήγγειλαν τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/012.yaml
  text: And his disciples came[a], took the body, and buried him; then they went and reported it to Jesus.
translation:
  language: it
  text: I suoi discepoli si avvicinarono, presero il corpo[a] e lo seppellirono; poi andarono a riferire l’accaduto a Gesù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «cadavere». Il termine greco indica un corpo morto.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθόντες
  choice: si avvicinarono
  rationale: Il participio aoristo di προσέρχομαι introduce l’azione dei discepoli e indica che si accostarono al luogo o al corpo; la forma finita rende naturale la sequenza narrativa in italiano.
- source_word: μαθηταὶ αὐτοῦ
  choice: i suoi discepoli
  rationale: Conserva il termine tradizionale e la sfumatura relazionale di μαθηταί. Nel contesto il possessivo rimanda naturalmente a Giovanni il Battista.
- source_word: ἦραν
  choice: presero
  rationale: αἴρω può significare sollevare o prendere. «Presero» è conciso e adatto al contesto della sepoltura, senza aggiungere dettagli sul trasporto.
- source_word: πτῶμα
  choice: corpo
  rationale: Il vocabolo designa un corpo morto. «Corpo» è dignitoso e naturale nella narrazione italiana; la nota conserva il valore più esplicito «cadavere».
- source_word: ἔθαψαν αὐτόν
  choice: lo seppellirono
  rationale: Resa diretta di θάπτω e del pronome maschile riferito a Giovanni; non introduce il particolare di una tomba, assente dal versetto.
- source_word: ἐλθόντες
  choice: poi andarono
  rationale: Il participio segnala il movimento e l’azione successiva. La forma finita con «poi» rende scorrevole la progressione narrativa.
- source_word: ἀπήγγειλαν
  choice: a riferire l’accaduto
  rationale: ἀπαγγέλλω significa riferire o comunicare. Poiché l’oggetto resta implicito in greco, «l’accaduto» lo esplicita sobriamente in italiano senza limitarlo arbitrariamente alla sola morte o alla sola sepoltura.
- source_word: τῷ Ἰησοῦ
  choice: a Gesù
  rationale: Segue la forma italiana standard del nome Ἰησοῦς.
theological_decisions:
- issue: Identità dei «suoi discepoli»
  choice: Il possessivo è lasciato nel testo, con Giovanni il Battista come referente contestuale.
  alternative: Interpretare l’espressione come riferita ai discepoli di Gesù.
  rationale: Il contesto immediato narra la morte di Giovanni, perciò αὐτοῦ rimanda naturalmente a lui. Mantenere «suoi» conserva la formulazione greca senza inserire nel testo una precisazione esplicativa.
translation_notes:
  register: Italiano moderno, narrativo e dignitoso. La sintassi participiale greca è resa con verbi finiti per naturalezza, mantenendo l’ordine delle azioni. Il punto e virgola distingue la sepoltura dal successivo resoconto a Gesù.
