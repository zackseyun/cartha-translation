  text: ⸂οἱ δὲ μαθηταὶ ἰδόντες αὐτὸν⸃ ἐπὶ ⸂τῆς θαλάσσης⸃ περιπατοῦντα ἐταράχθησαν λέγοντες ὅτι Φάντασμά ἐστιν, καὶ ἀπὸ τοῦ φόβου ἔκραξαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/026.yaml
  text: But when the disciples saw him walking on the sea[a], they were terrified, saying, “It is a ghost!” And they cried out from fear.
translation:
  language: it
  text: 'Ma quando i discepoli lo videro camminare sul mare, si turbarono e dissero: «È un fantasma!» E per la paura gridarono.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: Segnala un lieve contrasto narrativo fra l'avvicinarsi di Gesù e la reazione impaurita dei discepoli.
- source_word: οἱ μαθηταὶ ἰδόντες αὐτόν
  choice: i discepoli, vedendolo
  rationale: Il participio aoristo esprime una circostanza temporale; il gerundio italiano è naturale e conserva il rapporto con il verbo principale.
- source_word: ἐπὶ τῆς θαλάσσης περιπατοῦντα
  choice: camminare sul mare
  rationale: Rende direttamente ἐπί con il genitivo e θάλασσα, indicando che Gesù camminava sulla superficie del mare.
- source_word: ἐταράχθησαν
  choice: furono sconvolti
  rationale: Esprime il forte turbamento e l'agitazione causati da ciò che videro, senza ridurre il verbo alla sola paura, poi esplicitata nel seguito.
- source_word: λέγοντες
  choice: e dissero
  rationale: In italiano narrativo coordina in modo naturale l'esclamazione dei discepoli alla loro reazione.
- source_word: Φάντασμά ἐστιν
  choice: È un fantasma!
  rationale: «Fantasma» è l'equivalente italiano corrente e immediatamente comprensibile di φάντασμα nel contesto di una visione interpretata con paura.
- source_word: ἀπὸ τοῦ φόβου
  choice: per la paura
  rationale: Rende il valore causale di ἀπό in italiano idiomatico.
- source_word: ἔκραξαν
  choice: gridarono
  rationale: Comunica un grido forte senza specificarne oltre il tono.
theological_decisions:
- issue: Natura di φάντασμα nell'esclamazione dei discepoli
  choice: «fantasma» nel testo principale
  alternative: «apparizione» oppure «spettro»
  rationale: Il racconto riferisce la conclusione impaurita e sbagliata dei discepoli, non formula un'affermazione dottrinale sulla natura degli spiriti. «Fantasma» conserva questo punto di vista narrativo.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. La sintassi resta vicina al greco ma evita formulazioni rigide; l'intensità di ἐταράχθησαν è distinta dalla causa esplicita ἀπὸ τοῦ φόβου.
