- from: 'Ma i discepoli, vedendolo camminare sul mare, furono sconvolti e dissero: «È un fantasma!» E per la paura gridarono.'
  to: 'Ma quando i discepoli lo videro camminare sul mare, si turbarono e dissero: «È un fantasma!» E per la paura gridarono.'
  rationale: La revisione limita l'intervento a una resa più precisa di ἐταράχθησαν e a una costruzione temporale italiana più naturale. Mantiene il contrasto narrativo di δέ, il mare quale luogo/superficie su cui Gesù cammina, e la percezione erronea dei discepoli espressa da φάντασμα.
