review_pass:
  verdict: revise
  source_fidelity: 'Il senso è sostanzialmente fedele: i discepoli vedono Gesù camminare sul mare, reagiscono con turbamento, lo scambiano per un fantasma e gridano per paura. Tuttavia «furono sconvolti» tende in italiano a indicare uno sconvolgimento più profondo e durevole di ἐταράχθησαν; «si turbarono» conserva meglio l''agitazione o lo spavento immediato senza anticipare o duplicare eccessivamente «per la paura».'
  naturalness: La frase è scorrevole, ma la subordinata temporale esplicita «Quando lo videro» è più idiomatica e nitida del gerundio «vedendolo» in questo contesto narrativo. La coordinazione «e dissero» resta naturale.
  terminology: «Sul mare», «fantasma», «paura» e «gridarono» sono scelte standard, accessibili e fedeli. «Fantasma» rende bene φάντασμα come interpretazione impaurita dei discepoli; non richiede una nota, poiché non vi è ambiguità testuale da segnalare né un termine italiano fuorviante.
  issues:
  - severity: low
    issue: Intensità di «furono sconvolti»
    rationale: ἐταράχθησαν esprime qui turbamento e agitazione causati dalla paura. «Sconvolti» è possibile, ma in italiano moderno può risultare più forte e psicologicamente marcato del necessario. «Si turbarono» è più vicino al valore del greco e lascia a «per la paura» l'esplicitazione della causa.
  - severity: low
    issue: Gerundio «vedendolo»
    rationale: Non è scorretto, ma «Quando lo videro» rende in modo più trasparente il participio aoristo con valore temporale e migliora la naturalezza della narrazione italiana.
  revised_text: 'Ma quando i discepoli lo videro camminare sul mare, si turbarono e dissero: «È un fantasma!» E per la paura gridarono.'
