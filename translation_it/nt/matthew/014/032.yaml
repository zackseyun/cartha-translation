  text: καὶ ⸀ἀναβάντων αὐτῶν εἰς τὸ πλοῖον ἐκόπασεν ὁ ἄνεμος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/032.yaml
  text: And when they got into the boat[a], the wind ceased.
translation:
  language: it
  text: E quando salirono sulla barca[a], il vento cessò.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, più letteralmente: «dopo che furono saliti sulla barca».'
    reason: Alternativa sintattica che rende più esplicitamente l'anteriorità del genitivo assoluto; «salire sulla barca» è la formulazione idiomatica italiana nel contesto.
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Mantiene il collegamento narrativo espresso da καί senza introdurre una sfumatura temporale più marcata.
- source_word: ἀναβάντων αὐτῶν
  choice: quando furono saliti
  rationale: Il genitivo assoluto è reso con una proposizione temporale naturale in italiano. «Salire sulla barca» conserva il valore di ἀναβαίνω ed è idiomatico nel contesto.
- source_word: εἰς τὸ πλοῖον
  choice: sulla barca
  rationale: Nel contesto del lago e dell'imbarcazione dei discepoli, «barca» è più naturale di «nave»; con «salire», l'italiano corrente richiede normalmente «sulla».
- source_word: ἐκόπασεν
  choice: cessò
  rationale: Rende in modo conciso l'arrestarsi del vento, senza aggiungere un processo graduale non esplicitato dall'aoristo.
- source_word: ὁ ἄνεμος
  choice: il vento
  rationale: Corrispondenza diretta e naturale del soggetto greco articolato.
theological_decisions:
- issue: Implicazione narrativa dell'autorità di Gesù sulla natura
  choice: Riferire semplicemente che il vento cessò quando entrarono nella barca.
  alternative: Esplicitare nel testo che il vento cessò miracolosamente per l'autorità di Gesù.
  rationale: Il significato teologico emerge dal contesto, ma il greco del versetto non contiene un'esplicitazione causale o interpretativa; la traduzione non deve aggiungerla.
translation_notes:
  register: Italiano moderno standard, dignitoso e scorrevole. La formulazione conserva l'attacco coordinante del greco e rende il genitivo assoluto con una temporale comprensibile; la nota documenta una resa più formale.
