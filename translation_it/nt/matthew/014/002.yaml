source:
  edition: SBLGNT
  text: καὶ εἶπεν τοῖς παισὶν αὐτοῦ· Οὗτός ἐστιν Ἰωάννης ὁ βαπτιστής· αὐτὸς ἠγέρθη ἀπὸ τῶν νεκρῶν, καὶ διὰ τοῦτο αἱ δυνάμεις ἐνεργοῦσιν ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/002.yaml
  text: And he said to his servants[a], “This is John the Baptist. He has been raised from the dead, and for this reason these powers are at work in him.”
translation:
  language: it
  text: 'E disse ai suoi servitori: «Costui è Giovanni il Battista. È stato risuscitato dai morti, e per questo i poteri[a] agiscono in lui».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «i poteri miracolosi»; in modo più interpretativo, «i miracoli». Il greco dice «i poteri» (αἱ δυνάμεις), riferendosi a potenza soprannaturale manifestata in opere prodigiose.
    reason: alternativa lessicale
lexical_decisions:
- source_word: παισὶν
  choice: servitori
  rationale: Nel contesto indica persone al servizio di Erode, appartenenti alla sua casa o corte. «Servitori» conserva il rapporto sociale senza precisarne indebitamente il rango.
- source_word: ὁ βαπτιστής
  choice: il Battista
  rationale: È l'appellativo italiano tradizionale e naturale di Giovanni e rende adeguatamente il greco senza alterarne il senso.
- source_word: ἠγέρθη
  choice: è stato risuscitato
  rationale: La forma passiva del greco è mantenuta esplicitamente, senza suggerire che Giovanni sia risorto per virtù propria.
- source_word: ἀπὸ τῶν νεκρῶν
  choice: dai morti
  rationale: È la resa italiana idiomatica della formula greca, riferita al ritorno dalla condizione dei morti.
- source_word: διὰ τοῦτο
  choice: per questo
  rationale: Esprime in modo naturale il nesso causale formulato da Erode.
- source_word: αἱ δυνάμεις
  choice: le potenze
  rationale: Conserva il sostantivo greco e la sua apertura semantica verso poteri soprannaturali manifestati in opere potenti, senza ridurlo direttamente a «miracoli».
- source_word: ἐνεργοῦσιν
  choice: operano
  rationale: Rende l'attività efficace e presente indicata dal verbo greco con un'espressione italiana dignitosa e comprensibile.
- source_word: ἐν αὐτῷ
  choice: in lui
  rationale: Mantiene il valore più diretto di ἐν, presentando Giovanni come l'ambito o il soggetto nel quale tali potenze sono attive; «per mezzo di lui» sarebbe più interpretativo.
theological_decisions:
- issue: Natura del ritorno di Giovanni
  choice: È stato risuscitato dai morti
  alternative: È risorto dai morti
  rationale: Il passivo greco ἠγέρθη viene preservato senza trarre conclusioni ulteriori né formulare una più ampia affermazione dottrinale oltre alle parole attribuite a Erode.
- issue: Significato di δυνάμεις nel contesto
  choice: le potenze operano in lui
  alternative: i poteri miracolosi operano in lui; i miracoli si compiono per mezzo di lui
  rationale: Il termine allude verosimilmente a potenza soprannaturale manifestata in opere prodigiose, ma la formulazione principale conserva il termine «potenze» e la costruzione «in lui», evitando di trasformare l'effetto nelle opere stesse.
translation_notes:
  register: Italiano moderno standard, dignitoso e accessibile. La formulazione conserva il passivo di ἠγέρθη e l'espressione volutamente non esplicitata αἱ δυνάμεις. Il dimostrativo inglese «these» non è stato importato, poiché nel testo greco compare l'articolo αἱ, non un dimostrativo.
