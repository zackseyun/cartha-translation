  variant: modern standard Italian
source:
  edition: SBLGNT
  text: καὶ ἀπολύσας τοὺς ὄχλους ἀνέβη εἰς τὸ ὄρος κατ’ ἰδίαν προσεύξασθαι. ὀψίας δὲ γενομένης μόνος ἦν ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/023.yaml
  text: And after dismissing the crowds[a], he went up on the mountain by himself to pray. When evening came, he was there alone.
translation:
  language: it
  text: Dopo aver congedato le folle, salì sul monte, in disparte[a], a pregare. Venuta la sera, era là solo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «da solo».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολύσας
  choice: Dopo aver congedato
  rationale: Il participio aoristo indica un’azione anteriore al verbo principale; la costruzione temporale italiana è naturale e «congedato» esprime l’atto di mandare via senza sfumature aggiunte.
- source_word: τοὺς ὄχλους
  choice: le folle
  rationale: Mantiene il plurale greco e designa naturalmente i gruppi di persone radunati.
- source_word: ἀνέβη εἰς τὸ ὄρος
  choice: salì sul monte
  rationale: Rende in italiano corrente sia il movimento verso l’alto sia l’arrivo nell’area del monte.
- source_word: κατ’ ἰδίαν
  choice: in disparte
  rationale: Conserva il valore di separazione e riservatezza della locuzione senza identificarlo del tutto con μόνος, che compare poi esplicitamente.
- source_word: προσεύξασθαι
  choice: a pregare
  rationale: L’infinito esprime lo scopo della salita; la costruzione italiana è diretta e naturale.
- source_word: ὀψίας δὲ γενομένης
  choice: Venuta la sera
  rationale: Rende con una costruzione temporale dignitosa e concisa il genitivo assoluto greco.
- source_word: μόνος ἦν ἐκεῖ
  choice: era là solo
  rationale: Mantiene sia l’indicazione del luogo sia l’enfasi conclusiva sulla solitudine di Gesù.
theological_decisions: []
translation_notes:
  register: Italiano standard moderno, scorrevole e dignitoso. «In disparte» evita la ripetizione di «solo» e preserva la possibile sfumatura di riservatezza di κατ’ ἰδίαν; la nota segnala l’alternativa più esplicitamente personale.
