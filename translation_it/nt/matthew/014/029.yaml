source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ἐλθέ. καὶ καταβὰς ἀπὸ τοῦ ⸀πλοίου Πέτρος περιεπάτησεν ἐπὶ τὰ ὕδατα ⸂καὶ ἦλθεν⸃ πρὸς τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/029.yaml
  text: And he said[a], “Come.” So Peter got down from the boat, walked on the water, and came toward Jesus.
translation:
  language: it
  text: 'Ed egli disse: «Vieni». Pietro, sceso dalla barca, camminò sull’acqua e venne verso Gesù.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλθέ
  choice: Vieni
  rationale: L’imperativo aoristo di ἔρχομαι esprime un invito-comando diretto; «Vieni» è la resa italiana più naturale e concisa.
- source_word: καταβὰς ἀπὸ τοῦ πλοίου
  choice: scese dalla barca
  rationale: Il participio aoristo indica un’azione precedente alle azioni principali. La coordinazione italiana conserva con naturalezza la sequenza narrativa.
- source_word: πλοίου
  choice: barca
  rationale: Nel contesto del lago di Galilea, «barca» è il termine moderno più appropriato per πλοῖον.
- source_word: περιεπάτησεν
  choice: camminò
  rationale: Qui περιπατέω descrive semplicemente l’atto di camminare, senza richiedere l’aggiunta «cominciò a».
- source_word: ἐπὶ τὰ ὕδατα
  choice: sull’acqua
  rationale: La preposizione con l’accusativo presenta il movimento sulla superficie; l’italiano idiomatico usa normalmente il singolare collettivo «acqua».
- source_word: καὶ ἦλθεν πρὸς τὸν Ἰησοῦν
  choice: e andò verso Gesù
  rationale: πρός esprime direzione. «Andò verso Gesù» mantiene il punto di vista narrativo e non afferma necessariamente che Pietro lo abbia raggiunto.
- source_word: δὲ
  choice: Ed
  rationale: δέ è qui un connettivo narrativo lieve; «Ed» garantisce continuità senza introdurre un contrasto non espresso.
theological_decisions:
- issue: Esito del movimento di Pietro verso Gesù
  choice: andò verso Gesù
  alternative: giunse da Gesù
  rationale: Il greco πρός indica movimento in direzione di Gesù, ma non rende esplicito in questa proposizione il raggiungimento della meta. La resa scelta conserva tale tensione narrativa.
translation_notes:
  register: Italiano moderno, chiaro e dignitoso. La struttura è stata resa in forma narrativa naturale, mantenendo la concisione dell’originale e la distinzione tra direzione e arrivo compiuto.
