id: MAT.14.22
reference: Matthew 14:22
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Καὶ εὐθέως ⸀ἠνάγκασεν τοὺς μαθητὰς ἐμβῆναι ⸀εἰς πλοῖον καὶ προάγειν αὐτὸν εἰς τὸ πέραν, ἕως οὗ ἀπολύσῃ τοὺς ὄχλους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/022.yaml
  text: And immediately he compelled the disciples to get into the boat and go on ahead of him to the other side[a], until he should dismiss the crowds.
translation:
  language: it
  text: E subito costrinse i discepoli a salire sulla barca e a precederlo sull’altra riva, fino a quando non avesse congedato le folle.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐθέως
  choice: subito
  rationale: Esprime con naturalezza l’immediatezza e il rapido passaggio narrativo.
- source_word: ἠνάγκασεν
  choice: costrinse
  rationale: Conserva la forte insistenza o necessità espressa da ἀναγκάζω, senza specificare una coercizione fisica.
- source_word: τοὺς μαθητάς
  choice: i discepoli
  rationale: Riproduce l’articolo greco e identifica il gruppo già noto, senza aggiungere il possessivo «suoi».
- source_word: ἐμβῆναι εἰς πλοῖον
  choice: a salire sulla barca
  rationale: È la formulazione italiana corrente per l’atto di imbarcarsi; il determinativo è naturale perché la barca è identificabile dal contesto.
- source_word: προάγειν αὐτόν
  choice: a precederlo
  rationale: Rende in modo conciso il senso di andare avanti prima di Gesù.
- source_word: εἰς τὸ πέραν
  choice: sull’altra riva
  rationale: Nel contesto del lago indica la sponda opposta ed è più idiomatico in italiano di una resa letterale con «lato».
- source_word: ἕως οὗ ἀπολύσῃ
  choice: mentre egli congedava
  rationale: In questo contesto ἕως οὗ può delineare l’azione che Gesù avrebbe compiuto durante la loro partenza; la resa italiana evita l’artificioso «finché non avesse congedato», pur esplicitando il soggetto per chiarezza.
- source_word: ἀπολύσῃ τοὺς ὄχλους
  choice: congedava le folle
  rationale: «Congedare» conserva l’idea di sciogliere e mandare via il gruppo; «folle» mantiene il plurale greco.
theological_decisions: []
translation_notes:
  register: Italiano moderno, dignitoso e narrativamente scorrevole. Si conserva la forza di «costrinse» e il plurale «le folle»; non sono necessarie note testuali o teologiche.
