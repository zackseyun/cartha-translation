  text: τετάρτῃ δὲ φυλακῇ τῆς νυκτὸς ⸀ἦλθεν πρὸς ⸀αὐτοὺς περιπατῶν ἐπὶ ⸂τὴν θάλασσαν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/025.yaml
  text: And in the fourth watch of the night he came to them[b][a], walking on the sea.
translation:
  language: it
  text: Nella quarta vigilia della notte[a], Gesù venne da loro, camminando sul mare.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La «quarta vigilia della notte» era l'ultima parte della notte e corrispondeva all'incirca alle ore tra le tre e le sei del mattino, secondo il sistema romano.
    reason: cultural_note
lexical_decisions:
- source_word: τετάρτῃ ... φυλακῇ τῆς νυκτός
  choice: Alla quarta vigilia della notte
  rationale: Il dativo ha valore temporale. «Quarta vigilia» conserva il sistema antico di suddivisione della notte, mentre la nota ne chiarisce l'orario approssimativo.
- source_word: δὲ
  choice: non reso esplicitamente
  rationale: Qui δέ è un lieve connettivo narrativo; in italiano moderno l'avanzamento del racconto risulta naturale anche senza un «e» o «ma» esplicito.
- source_word: ἦλθεν πρὸς αὐτούς
  choice: Gesù venne verso di loro
  rationale: ἦλθεν indica l'avvicinarsi del soggetto ai discepoli e πρός con l'accusativo esprime moto verso persone. Il nome «Gesù», ricavabile senza ambiguità dal contesto immediato, evita in italiano un pronome soggetto poco naturale e potenzialmente meno chiaro.
- source_word: περιπατῶν
  choice: camminando
  rationale: Il participio presente descrive un'azione contemporanea al verbo principale.
- source_word: ἐπὶ τὴν θάλασσαν
  choice: sul mare
  rationale: Nel contesto, ἐπί con l'accusativo indica il movimento sulla superficie dell'acqua. «Mare» conserva il valore lessicale di θάλασσα e la denominazione tradizionale del lago di Galilea.
theological_decisions:
- issue: Descrizione miracolosa del movimento di Gesù sull'acqua
  choice: camminando sul mare
  alternative: camminando lungo la riva del mare
  rationale: La costruzione greca e il contesto indicano che Gesù cammina sulla superficie dell'acqua. La resa conserva il senso diretto e la forza miracolosa del testo senza aggiunte interpretative.
translation_notes:
  register: Italiano moderno, naturale e dignitoso. La formulazione mantiene il termine storico «vigilia», spiegandolo in nota; «sul mare» rende direttamente la scena senza attenuarne il carattere miracoloso.
