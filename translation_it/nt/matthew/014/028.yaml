  text: Ἀποκριθεὶς δὲ ⸂αὐτῷ ὁ Πέτρος εἶπεν⸃· Κύριε, εἰ σὺ εἶ, κέλευσόν με ⸂ἐλθεῖν πρὸς σὲ⸃ ἐπὶ τὰ ὕδατα·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/028.yaml
  text: And Peter answered him[a], “Lord, if it is you, command me to come to you on the waters.”
translation:
  language: it
  text: 'Pietro gli rispose: «Signore, se sei tu, comandami di venire da te sulle acque[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «sull’acqua». Il greco ha il plurale: «sulle acque».'
    reason: alternativa lessicale e precisazione della forma greca
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ αὐτῷ ὁ Πέτρος εἶπεν
  choice: Pietro gli rispose
  rationale: La formula narrativa greca è resa in italiano corrente senza appesantirla con una duplicazione come «rispondendo, disse». Il pronome «gli» conserva il riferimento a Gesù; δέ segnala il raccordo narrativo e non richiede necessariamente una congiunzione esplicita.
- source_word: Κύριε
  choice: Signore
  rationale: È la resa italiana tradizionale e attuale di κύριος in un appellativo rivolto a Gesù; mantiene sia il valore rispettoso sia la possibile portata cristologica.
- source_word: εἰ σὺ εἶ
  choice: se sei tu
  rationale: Formula naturale in italiano per verificare l'identità della persona, senza aggiungere «davvero» o altre precisazioni assenti dal greco.
- source_word: κέλευσόν με
  choice: comandami
  rationale: L'imperativo di κελεύω esprime un ordine autorevole; «comandami» ne conserva la forza in modo chiaro e conciso.
- source_word: ἐλθεῖν πρὸς σὲ
  choice: di venire da te
  rationale: «Venire da te» riflette il movimento verso Gesù ed è l'espressione idiomatica più naturale in italiano.
- source_word: ἐπὶ τὰ ὕδατα
  choice: sulle acque
  rationale: Conserva il plurale del greco τὰ ὕδατα e il tono vivido della scena; la forma più idiomatica al singolare è indicata in nota.
theological_decisions:
- issue: Valore dell'appellativo κύριε rivolto a Gesù
  choice: Signore
  alternative: Maestro; signore
  rationale: «Signore» non riduce l'appellativo a una semplice formula di cortesia e mantiene aperta la sua possibile valenza cristologica, senza imporre al versetto una definizione teologica ulteriore.
translation_notes:
  register: Italiano standard moderno, sobrio e dignitoso. La sintassi diretta evita il calco ridondante «rispondendo, disse»; il plurale «acque» conserva un tratto formale del testo greco, con l'alternativa idiomatica segnalata in nota.
