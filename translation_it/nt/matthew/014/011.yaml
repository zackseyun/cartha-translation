source:
  edition: SBLGNT
  text: καὶ ἠνέχθη ἡ κεφαλὴ αὐτοῦ ἐπὶ πίνακι καὶ ἐδόθη τῷ κορασίῳ, καὶ ἤνεγκεν τῇ μητρὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/011.yaml
  text: And his head was brought on a platter and given to the girl[a], and she brought it to her mother.
translation:
  language: it
  text: La sua testa fu portata su un vassoio[a] e data alla ragazza, che la portò a sua madre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «su un piatto da portata». Il greco πίναξ indica un vassoio o un piatto usato per servire.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠνέχθη
  choice: fu portata
  rationale: L’aoristo passivo di φέρω è reso con un passato remoto passivo, naturale nella narrazione italiana e fedele alla diatesi greca.
- source_word: ἡ κεφαλὴ αὐτοῦ
  choice: la sua testa
  rationale: Resa diretta dell’espressione greca, senza attenuarne il carattere crudo.
- source_word: ἐπὶ πίνακι
  choice: su un vassoio
  rationale: πίναξ indica qui un vassoio o piatto da portata; «vassoio» è chiaro e naturale nel contesto.
- source_word: ἐδόθη
  choice: data
  rationale: Il participio sottintende l’ausiliare già espresso in «fu portata» e conserva la sequenza passiva dell’originale.
- source_word: τῷ κορασίῳ
  choice: alla ragazza
  rationale: κοράσιον designa una ragazza; questa resa è moderna e non introduce sfumature arcaiche.
- source_word: ἤνεγκεν
  choice: la portò
  rationale: L’aoristo attivo di φέρω è reso con «portò»; il pronome «la» riprende chiaramente «la testa» e rispetta il genere grammaticale italiano.
- source_word: τῇ μητρὶ αὐτῆς
  choice: a sua madre
  rationale: Resa naturale del dativo; il possessivo si riferisce alla madre della ragazza.
theological_decisions: []
translation_notes:
  register: Italiano standard moderno, sobrio e dignitoso. Il relativo «che» evita una ripetizione pesante senza alterare la successione degli eventi. Il richiamo della nota è collocato dopo «vassoio», il termine cui la nota si riferisce.
