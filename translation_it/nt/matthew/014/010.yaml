  text: καὶ πέμψας ἀπεκεφάλισεν ⸀τὸν Ἰωάννην ἐν τῇ φυλακῇ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/010.yaml
  text: And he sent and beheaded John in the prison[a].
translation:
  language: it
  text: E mandò a decapitare Giovanni nella prigione.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Più formalmente: «E, dopo aver mandato [qualcuno], decapitò Giovanni nella prigione». Il greco usa un participio aoristo seguito dal verbo principale.'
    reason: alternativa formale e chiarimento sintattico
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Mantiene la semplice coordinazione narrativa del greco senza introdurre una sfumatura temporale o causale non esplicita.
- source_word: πέμψας
  choice: mandò
  rationale: Il participio aoristo di πέμπω indica l'invio di qualcuno prima dell'azione principale. La costruzione italiana «mandò a decapitare» esprime in modo naturale che Erode agì tramite un incaricato, senza suggerire che eseguì personalmente la decapitazione.
- source_word: ἀπεκεφάλισεν
  choice: a decapitare
  rationale: ἀποκεφαλίζω significa specificamente «decapitare». L'infinito dipendente da «mandò» è una resa idiomatica italiana della sequenza greca e conserva l'attribuzione dell'atto al soggetto mediante un agente inviato.
- source_word: τὸν Ἰωάννην
  choice: Giovanni
  rationale: Traduce il nome proprio senza aggiungere «il Battista», specificazione già ricavabile dal contesto ma assente nel versetto.
- source_word: ἐν τῇ φυλακῇ
  choice: nella prigione
  rationale: φυλακή indica qui il luogo concreto di detenzione; «nella prigione» rispecchia anche la presenza dell'articolo greco.
theological_decisions:
- issue: Responsabilità di Erode e intervento di un esecutore
  choice: mandò a decapitare
  alternative: decapitò personalmente
  rationale: Il participio πέμψας segnala che fu inviato un agente, mentre il verbo principale attribuisce comunque l'azione a Erode. La resa scelta mantiene sia la mediazione sia la responsabilità del soggetto.
translation_notes:
  register: Italiano moderno, sobrio e narrativo. «Mandò a decapitare» è naturale e dignitoso; la nota conserva più visibilmente la struttura sintattica greca e la sua attribuzione dell'azione al soggetto.
