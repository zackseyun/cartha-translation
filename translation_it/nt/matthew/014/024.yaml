id: MAT.14.24
reference: Matthew 14:24
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: τὸ δὲ πλοῖον ἤδη ⸂σταδίους πολλοὺς ἀπὸ τῆς γῆς ἀπεῖχεν⸃, βασανιζόμενον ὑπὸ τῶν κυμάτων, ἦν γὰρ ἐναντίος ὁ ἄνεμος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/024.yaml
  text: But the boat was already many stadia from the land[a], being battered by the waves[c][b], for the wind was against it.
translation:
  language: it
  text: Ma la barca era già a molti stadi da terra[a] ed era sbattuta dalle onde[c], perché il vento era contrario.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «dalla riva». Il greco dice letteralmente «dalla terra». Uno stadio era un’antica unità di distanza pari a circa 185 metri.
    reason: lexical_alternative_and_cultural_note
  - marker: c
    text: O «sballottata dalle onde».
    reason: lexical_alternative
lexical_decisions:
- source_word: πλοῖον
  choice: barca
  rationale: Nel contesto della traversata del lago di Galilea, «barca» è il termine italiano moderno più naturale e non suggerisce un'imbarcazione di dimensioni eccessive.
- source_word: ἤδη
  choice: già
  rationale: 'Mantiene direttamente il valore temporale: a quel punto della narrazione la situazione si era già prodotta.'
- source_word: σταδίους πολλοὺς
  choice: a molti stadi
  rationale: Conserva l'antica unità di misura presente nel greco; una nota ne chiarisce il valore approssimativo.
- source_word: ἀπὸ τῆς γῆς
  choice: da terra
  rationale: Rende letteralmente e idiomaticamente il contrasto tra la terra e il lago; «dalla riva» resta una valida alternativa contestuale.
- source_word: ἀπεῖχεν
  choice: era ... a ... da
  rationale: La costruzione italiana esprime in modo naturale la distanza spaziale indicata dal verbo.
- source_word: βασανιζόμενον
  choice: era sbattuta
  rationale: Nel contesto marittimo descrive efficacemente l'azione violenta delle onde sulla barca, senza trasferire in italiano il senso psicologico di «tormentare».
- source_word: ὑπὸ τῶν κυμάτων
  choice: dalle onde
  rationale: Rende in modo diretto l'agente o la causa dell'azione espressa dal participio passivo.
- source_word: ἐναντίος
  choice: contrario
  rationale: «Il vento era contrario» è una formulazione italiana corrente che conserva l'idea di opposizione; l'oggetto resta implicito come nel greco.
- source_word: δὲ
  choice: Ma
  rationale: Segnala il passaggio con lieve contrasto dalla situazione di Gesù a quella della barca.
- source_word: γάρ
  choice: perché
  rationale: Introduce chiaramente la causa per cui la barca era sbattuta dalle onde.
theological_decisions: []
translation_notes:
  register: Italiano moderno standard, naturale e dignitoso. Si mantiene «stadi» per trasparenza rispetto al testo greco, spiegandolo in nota. I marcatori seguono quelli pertinenti del materiale di consultazione inglese; la nota sulla misura è stata accorpata alla nota [a] per evitare un marcatore fuori ordine e distinguere chiaramente distanza dalla terra e azione delle onde.
