base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/016.yaml
  text: But Jesus said to them[a], “They have no need to go away; you yourselves give them something to eat.”
translation:
  language: it
  text: 'Ma Gesù disse loro: «Non hanno bisogno di andarsene; voi stessi date loro da mangiare».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: Segnala il lieve contrasto tra la proposta dei discepoli e la risposta di Gesù.
- source_word: εἶπεν αὐτοῖς
  choice: disse loro
  rationale: Resa narrativa semplice e diretta del verbo λέγω con il complemento di termine.
- source_word: Οὐ χρείαν ἔχουσιν
  choice: Non hanno bisogno
  rationale: Riproduce naturalmente in italiano l'espressione idiomatica ἔχω χρείαν senza aggiungere un soggetto non espresso.
- source_word: ἀπελθεῖν
  choice: di andarsene
  rationale: Nel contesto indica che la folla dovrebbe lasciare quel luogo; «andarsene» è naturale e conserva il movimento di allontanamento.
- source_word: δότε αὐτοῖς
  choice: date loro
  rationale: Mantiene l'imperativo aoristo plurale in forma diretta e il pronome dativo riferito alla folla.
- source_word: ὑμεῖς
  choice: voi stessi
  rationale: Il pronome personale espresso è enfatico e mette in rilievo i discepoli come coloro che devono agire.
- source_word: φαγεῖν
  choice: da mangiare
  rationale: Dopo «dare», l'infinito greco si rende idiomaticamente in italiano con «dare da mangiare», senza dover introdurre esplicitamente «qualcosa».
theological_decisions:
- issue: Enfasi sul ruolo dei discepoli nel comando di Gesù
  choice: «date loro voi stessi da mangiare»
  alternative: «date loro voi da mangiare» oppure «date loro da mangiare»
  rationale: «Voi stessi» conserva l'enfasi dell'esplicito ὑμεῖς, senza spiegare ulteriormente il significato teologico del comando.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. La formulazione «date loro voi stessi da mangiare» mantiene l'enfasi del greco pur risultando comprensibile; nessuna nota è necessaria, perché le alternative lessicali non introducono una differenza sostanziale di significato.
