  source_fidelity: 'Il testo rende fedelmente la sequenza narrativa e i principali elementi del greco: l''ordine alle folle, la collocazione sull''erba, i cinque pani e i due pesci, lo sguardo al cielo, la benedizione dall''oggetto non espresso, lo spezzare e la distribuzione tramite i discepoli. «Mettersi a sedere» è una resa italiana naturale e contestualmente adeguata di ἀνακλιθῆναι, pur senza riprodurre in modo tecnico la sfumatura del reclinare a tavola.'
  naturalness: L'italiano è moderno, scorrevole e di registro narrativo dignitoso. L'esplicitazione finale «i discepoli li diedero alle folle» è necessaria e naturale in italiano, dove l'ellissi verbale greca risulterebbe troppo brusca.
  terminology: «Folle», «pani», «pesci», «cielo», «discepoli» e «benedisse» sono appropriati. La scelta di non attribuire un oggetto esplicito a «benedisse» preserva correttamente l'ambiguità di εὐλόγησεν senza imporre una lettura teologica.
