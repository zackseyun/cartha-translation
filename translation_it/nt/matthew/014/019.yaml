id: MAT.14.19
reference: Matthew 14:19
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: καὶ κελεύσας τοὺς ὄχλους ἀνακλιθῆναι ἐπὶ ⸂τοῦ χόρτου⸃, λαβὼν τοὺς πέντε ἄρτους καὶ τοὺς δύο ἰχθύας, ἀναβλέψας εἰς τὸν οὐρανὸν εὐλόγησεν καὶ κλάσας ἔδωκεν τοῖς μαθηταῖς τοὺς ἄρτους οἱ δὲ μαθηταὶ τοῖς ὄχλοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/019.yaml
  text: And after ordering the crowds to recline on the grass[a], he took the five loaves and the two fish, looked up to heaven, blessed, and after breaking the loaves he gave them to the disciples, and the disciples to the crowds.
translation:
  language: it
  text: Dopo aver ordinato alle folle di mettersi a sedere sull’erba, prese i cinque pani e i due pesci, alzò gli occhi al cielo, benedisse[a], spezzò i pani e li diede ai discepoli, e i discepoli li diedero alle folle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il greco dice semplicemente «benedisse», senza indicare esplicitamente l’oggetto. Si può anche intendere «benedisse Dio» o «pronunciò una benedizione».
    reason: L’oggetto di εὐλόγησεν è sottinteso e la formulazione può riferirsi alla benedizione rivolta a Dio oppure, nel contesto, essere collegata ai pani e ai pesci.
lexical_decisions:
- source_word: κελεύσας
  choice: Dopo aver ordinato
  rationale: Rende la forza direttiva del verbo e la sequenza anteriore espressa dal participio aoristo, in un italiano narrativo naturale.
- source_word: τοὺς ὄχλους
  choice: alle folle
  rationale: Mantiene il plurale greco e indica i gruppi di persone radunati.
- source_word: ἀνακλιθῆναι
  choice: di mettersi a sedere
  rationale: Nel contesto indica la posizione assunta per mangiare; questa formulazione è naturale in italiano moderno senza suggerire impropriamente che dovessero sdraiarsi del tutto.
- source_word: ἐπὶ τοῦ χόρτου
  choice: sull’erba
  rationale: Resa diretta dell’indicazione di luogo, senza aggiungere l’aggettivo «verde» presente in un altro racconto evangelico.
- source_word: λαβὼν
  choice: prese
  rationale: Il participio è reso con un verbo finito per dare scorrevolezza alla narrazione italiana.
- source_word: τοὺς πέντε ἄρτους καὶ τοὺς δύο ἰχθύας
  choice: i cinque pani e i due pesci
  rationale: «Pani» è la normale resa italiana dei singoli pani dell’epoca; «pesci» conserva il plurale concreto.
- source_word: ἀναβλέψας εἰς τὸν οὐρανὸν
  choice: alzò gli occhi al cielo
  rationale: Espressione italiana idiomatica e fedele al gesto descritto dal greco.
- source_word: εὐλόγησεν
  choice: benedisse[a]
  rationale: Mantiene il verbo greco senza introdurre nel testo un oggetto che l’originale non esplicita.
- source_word: κλάσας
  choice: spezzò i pani
  rationale: Rende l’azione anteriore al dare e rende esplicito il suo oggetto, chiaramente recuperabile dal contesto.
- source_word: ἔδωκεν τοῖς μαθηταῖς τοὺς ἄρτους
  choice: li diede ai discepoli
  rationale: Il pronome riprende naturalmente «i pani» ed evita una ripetizione pesante.
- source_word: οἱ δὲ μαθηταὶ τοῖς ὄχλοις
  choice: e i discepoli li diedero alle folle
  rationale: Esplicita in italiano il verbo sottinteso nel greco, conservando il passaggio del cibo dai discepoli alle folle.
theological_decisions:
- issue: Oggetto implicito di εὐλόγησεν
  choice: Lasciare «benedisse» senza oggetto esplicito nel testo principale.
  alternative: «Benedisse Dio» oppure «pronunciò una benedizione»; è anche possibile intendere una benedizione sui pani e sui pesci.
  rationale: Il greco non esprime l’oggetto. La formulazione principale conserva questa indeterminatezza, mentre la nota segnala le principali possibilità senza imporne una.
translation_notes:
  register: Italiano moderno, chiaro e dignitoso. La sintassi narrativa evita calchi rigidi dei participi greci, ma ne conserva la successione. «Mettersi a sedere» è comprensibile al lettore comune e mantiene il contesto del pasto meglio del più generico «sedersi», evitando però l’innaturale «sdraiarsi».
