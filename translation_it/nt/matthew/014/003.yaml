review_pass:
  verdict: revise
  source_fidelity: La costruzione italiana causativa («aveva fatto arrestare ... fatto legare e mettere») attenua e modifica inutilmente i tre verbi attivi riferiti a Erode (κρατήσας, ἔδησεν, ἀπέθετο). Il greco presenta Erode come soggetto delle azioni, senza però specificare i mezzi materiali della legatura o della custodia. Una resa attiva italiana conserva il testo senza implicare che le abbia compiute materialmente con le proprie mani.
  naturalness: Il trapassato prossimo è naturale nel contesto narrativo. «Aveva arrestato ... lo aveva legato e lo aveva messo in prigione» è scorrevole, chiaro e di registro appropriato. «Moglie di suo fratello Filippo» identifica senza ambiguità la relazione richiesta.
  terminology: «Infatti» rende bene γάρ; «arrestato», «legato» e «messo in prigione» rendono il lessico custodiale senza sovraspecificarlo. «A causa di Erodiade» preserva il valore causale di διά con accusativo, e «moglie» è appropriato per γυνή in questa costruzione.
  issues:
  - severity: medium
    issue: Le forme causative «aveva fatto arrestare», «aveva fatto legare e mettere» non corrispondono direttamente ai verbi attivi greci.
    rationale: Benché possano essere storicamente plausibili per un sovrano, aggiungono una mediazione agentiva che il testo non esprime. La resa attiva italiana è sia fedele sia idiomatica.
  - severity: low
    issue: La nota propone «afferrato» per κρατήσας.
    rationale: «Afferrato» suggerisce soprattutto una presa fisica momentanea; nel contesto detentivo «preso» conserva meglio l'alternativa letterale senza restringerne il senso.
  revised_text: Erode, infatti, aveva arrestato Giovanni[a], lo aveva legato e lo aveva messo in prigione a causa di Erodiade, moglie di suo fratello Filippo.
