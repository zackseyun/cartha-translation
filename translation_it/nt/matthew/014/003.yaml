source:
  edition: SBLGNT
  text: Ὁ γὰρ Ἡρῴδης κρατήσας τὸν Ἰωάννην ἔδησεν ⸀αὐτὸν καὶ ⸂ἐν φυλακῇ ἀπέθετο⸃ διὰ Ἡρῳδιάδα τὴν γυναῖκα Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/003.yaml
  text: For Herod had arrested John[a], bound him, and put him in prison because of Herodias, the wife of Philip his brother,
translation:
  language: it
  text: Erode, infatti, aveva arrestato Giovanni[a], lo aveva legato e lo aveva messo in prigione a causa di Erodiade, moglie di suo fratello Filippo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «dopo aver preso Giovanni ... lo aveva posto in prigione».'
    reason: Alternativa più letterale per il participio κρατήσας e per l'espressione ἐν φυλακῇ ἀπέθετο.
lexical_decisions:
- source_word: γὰρ
  choice: infatti
  rationale: Conserva il valore esplicativo e il collegamento causale con il contesto precedente in un italiano naturale.
- source_word: κρατήσας
  choice: aveva fatto arrestare
  rationale: Rende l'azione anteriore del participio aoristo e, nel contesto dell'autorità esercitata da Erode, esprime chiaramente la cattura ufficiale senza suggerire necessariamente che l'abbia eseguita di persona.
- source_word: ἔδησεν
  choice: lo aveva fatto legare
  rationale: Mantiene il senso concreto di δέω e la sequenza delle azioni, senza precisare indebitamente se fossero state usate corde o catene.
- source_word: ἐν φυλακῇ ἀπέθετο
  choice: mettere in prigione
  rationale: Rende in italiano corrente l'espressione idiomatica che indica la detenzione.
- source_word: διὰ Ἡρῳδιάδα
  choice: a causa di Erodiade
  rationale: διά con l'accusativo esprime qui la causa o il motivo; la formulazione conserva questa relazione senza esplicitarla ulteriormente.
- source_word: γυναῖκα
  choice: moglie
  rationale: Nel rapporto espresso dal genitivo, γυνή indica qui la moglie, non genericamente una donna.
- source_word: Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ
  choice: di suo fratello Filippo
  rationale: Chiarisce naturalmente in italiano che Filippo era fratello di Erode, conservando la relazione appositiva del greco.
theological_decisions:
- issue: Inquadramento storico-morale del rapporto di Erodiade con Filippo
  choice: «Erodiade, moglie di suo fratello Filippo»
  alternative: «Erodiade, la moglie di Filippo, suo fratello»
  rationale: Il versetto identifica Erodiade mediante il suo rapporto con Filippo senza formulare ancora esplicitamente il giudizio sull'illegittimità dell'unione, che compare nel versetto seguente; la traduzione non anticipa tale giudizio.
translation_notes:
  register: Italiano moderno, chiaro e dignitoso. Il trapassato prossimo segnala l'anteriorità narrativa; la costruzione causativa evita di implicare che Erode abbia personalmente compiuto ogni azione. Il segno di nota [a] è presente nel testo.
