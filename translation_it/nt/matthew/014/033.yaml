  text: οἱ δὲ ἐν τῷ ⸀πλοίῳ προσεκύνησαν αὐτῷ λέγοντες· Ἀληθῶς θεοῦ υἱὸς εἶ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/033.yaml
  text: Then those in the boat worshiped him[a], saying[b], “Truly you are the Son of God.”
translation:
  language: it
  text: 'Allora quelli che erano nella barca si prostrarono davanti a lui[a], dicendo: «Tu sei veramente il Figlio di Dio[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «lo adorarono» oppure «gli resero omaggio». Il verbo greco può indicare la riverenza espressa inginocchiandosi o prostrandosi; in questo contesto l'atto assume valore di adorazione.
    reason: lexical_alternative
  - marker: b
    text: La frase greca può essere resa anche «Tu sei veramente Figlio di Dio». Benché «Dio» sia privo dell'articolo in greco, nel contesto l'espressione funziona come titolo e non significa semplicemente «un figlio di Dio».
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ
  choice: Allora quelli
  rationale: δέ è un connettivo lieve; «Allora» esprime con naturalezza la progressione narrativa, mentre οἱ è sostantivato e indica le persone nella barca.
- source_word: ἐν τῷ πλοίῳ
  choice: che erano nella barca
  rationale: La relativa esplicita in italiano corrente la costruzione greca e identifica con chiarezza il gruppo; πλοῖον indica qui una barca.
- source_word: προσεκύνησαν αὐτῷ
  choice: si prostrarono davanti a lui
  rationale: προσκυνέω designa un atto di prostrazione, omaggio o adorazione. La resa conserva il gesto concreto e, tramite la nota, la sua possibile e contestualmente forte valenza cultuale.
- source_word: λέγοντες
  choice: dicendo
  rationale: Il gerundio riproduce in modo naturale il participio greco e lega la confessione all'atto precedente.
- source_word: Ἀληθῶς
  choice: veramente
  rationale: Esprime un'affermazione solenne e risulta naturale nella posizione italiana dopo il verbo.
- source_word: θεοῦ υἱὸς
  choice: il Figlio di Dio
  rationale: Pur senza articolo davanti a θεοῦ, nel contesto la locuzione ha valore qualitativo-definito e funziona come titolo, non come «un figlio di Dio» in senso meramente indefinito.
- source_word: εἶ
  choice: Tu sei
  rationale: Il pronome espresso rende l'enfasi della confessione in un italiano naturale e solenne.
theological_decisions:
- issue: Valore di προσκυνέω rivolto a Gesù
  choice: «si prostrarono davanti a lui», con «lo adorarono» in nota
  alternative: «lo adorarono» / «gli resero omaggio»
  rationale: Il verbo indica anzitutto un gesto di prostrazione o omaggio, ma il dominio sul mare e la confessione seguente sostengono una valenza di adorazione. Il testo principale conserva l'immagine concreta senza attenuare la lettura cultuale, segnalata in nota.
- issue: Definitezza di θεοῦ υἱὸς
  choice: «il Figlio di Dio»
  alternative: «Figlio di Dio» / «un figlio di Dio»
  rationale: L'assenza dell'articolo greco non impone un senso indefinito. In questa confessione matteana l'espressione ha forza qualitativa-definita e titolare; «un figlio di Dio» ne indebolirebbe impropriamente il valore.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. La sintassi segue da vicino il greco senza risultare artificiosa; «si prostrarono» preserva l'aspetto fisico e l'ambiguità lessicale di προσκυνέω, mentre le note chiariscono la forte valenza teologica del contesto.
