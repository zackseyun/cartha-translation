revisions:
- from: Udito ciò, Gesù si ritirò di là in barca, verso un luogo deserto[a], in disparte. Ma le folle, quando lo seppero, lo seguirono a piedi dai centri abitati[b].
  to: Udito ciò, Gesù si ritirò di là in barca, in un luogo deserto[a], in disparte. Ma le folle, quando ne ebbero notizia, lo seguirono a piedi dalle città[b].
  rationale: La revisione rafforza la meta espressa da εἰς, elimina un'ambiguità pronominale non richiesta dal greco e sostituisce un'espressione burocratica con una resa narrativa più diretta di πόλεων. Non introduce alcun motivo per il ritiro di Gesù né precisa il contenuto non espresso di ἀκούσαντες.
