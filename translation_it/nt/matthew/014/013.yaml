review_pass:
  verdict: revise
  source_fidelity: La resa conserva bene la sequenza narrativa, il valore di ἀναχωρέω («si ritirò»), il viaggio ἐν πλοίῳ, il carattere isolato del luogo e il plurale di «folle». Tuttavia «verso un luogo» attenua la destinazione espressa da εἰς; «in un luogo» la rende più direttamente. «Quando lo seppero» richiede inoltre un antecedente non espresso e può essere letto come riferito a Gesù, mentre il participio ἀκούσαντες resta ellittico sull'oggetto udito.
  naturalness: Il registro è moderno e appropriato. «Dai centri abitati» è comprensibile ma burocratico nel racconto; «dalle città» è più naturale, diretto e vicino a πόλεων, mentre la nota conserva l'alternativa «paesi». «Ne ebbero notizia» risolve l'ellissi in italiano senza identificare indebitamente il contenuto della notizia.
  terminology: «Gesù», «si ritirò», «luogo deserto», «in disparte», «folle» e «a piedi» sono adeguati. Le note lessicali restano pertinenti e gli ancoraggi sono mantenuti presso i termini commentati.
  issues:
  - severity: medium
    issue: «verso un luogo deserto» per εἰς ἔρημον τόπον
    rationale: «Verso» può indicare soltanto direzione, mentre εἰς presenta il luogo come meta. «In un luogo deserto» conserva più precisamente il movimento a destinazione.
  - severity: medium
    issue: «quando lo seppero» per ἀκούσαντες
    rationale: Il pronome «lo» non ha un antecedente testuale chiaro e può essere ambiguamente riferito a Gesù. «Ne ebbero notizia» è idiomatico e mantiene non specificato ciò che le folle udirono.
  - severity: low
    issue: «dai centri abitati» per ἀπὸ τῶν πόλεων
    rationale: La formulazione è più amministrativa che narrativa. «Dalle città» è la resa primaria più diretta; la nota può segnalare che il termine comprende anche località minori.
