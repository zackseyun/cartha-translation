  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ⸂Ἀκούσας δὲ⸃ ὁ Ἰησοῦς ἀνεχώρησεν ἐκεῖθεν ἐν πλοίῳ εἰς ἔρημον τόπον κατ’ ἰδίαν· καὶ ἀκούσαντες οἱ ὄχλοι ἠκολούθησαν αὐτῷ πεζῇ ἀπὸ τῶν πόλεων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/013.yaml
  text: When Jesus heard this[a], he withdrew from there by boat to a desolate place by himself. But when the crowds heard[b], they followed him on foot from the towns.
translation:
  language: it
  text: Udito ciò, Gesù si ritirò di là in barca, in un luogo deserto[a], in disparte. Ma le folle, quando ne ebbero notizia, lo seguirono a piedi dalle città[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oppure «un luogo isolato» o «un luogo disabitato». Il greco non indica necessariamente un deserto sabbioso.
    reason: lexical_alternative
  - marker: b
    text: Oppure «dai paesi». Il termine greco può indicare città o località di dimensioni minori, secondo il contesto.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσας δὲ
  choice: Udito ciò
  rationale: Il participio aoristo ha valore temporale; «ciò» rende esplicito in italiano l’oggetto sottinteso, cioè la notizia appena narrata. δέ segnala qui soprattutto la progressione narrativa e non richiede un forte avversativo.
- source_word: ἀνεχώρησεν
  choice: si ritirò
  rationale: Conserva la sfumatura di allontanamento intenzionale propria di ἀναχωρέω senza precisarne il motivo.
- source_word: ἐν πλοίῳ
  choice: in barca
  rationale: Resa naturale in italiano del mezzo di spostamento.
- source_word: εἰς ἔρημον τόπον
  choice: verso un luogo deserto
  rationale: ἔρημος indica qui un luogo isolato o disabitato, non necessariamente un deserto sabbioso.
- source_word: κατ’ ἰδίαν
  choice: in disparte
  rationale: Esprime l’idea di appartarsi o stare lontano dagli altri senza irrigidire il senso in «completamente solo».
- source_word: ἀκούσαντες οἱ ὄχλοι
  choice: le folle, quando lo seppero
  rationale: Rende temporalmente il participio e conserva il plurale οἱ ὄχλοι; il pronome rinvia naturalmente alla partenza di Gesù.
- source_word: ἠκολούθησαν αὐτῷ πεζῇ
  choice: lo seguirono a piedi
  rationale: Resa diretta e idiomatica dell’azione concreta di seguire Gesù viaggiando per terra.
- source_word: ἀπὸ τῶν πόλεων
  choice: dai centri abitati
  rationale: πόλις può indicare città o località di dimensioni minori; «centri abitati» evita di determinarne indebitamente la grandezza.
theological_decisions:
- issue: Motivo del ritiro di Gesù
  choice: Il testo dice soltanto che Gesù «si ritirò», senza indicarne il motivo.
  alternative: Precisare che si ritirò per sicurezza, per lutto, per pregare o semplicemente per viaggiare.
  rationale: Il rapporto temporale con la notizia precedente è esplicito, ma il motivo del ritiro non lo è; la traduzione non risolve questa apertura narrativa.
- issue: Portata di κατ’ ἰδίαν
  choice: «in disparte»
  alternative: «da solo»
  rationale: «In disparte» conserva l’idea di isolamento o riservatezza senza affermare più rigidamente che nessun altro fosse con Gesù nella barca.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. La costruzione «Udito ciò» mantiene concisione narrativa; «in disparte» evita una sovrainterpretazione di κατ’ ἰδίαν. I marcatori di nota sono collocati accanto ai termini effettivamente commentati.
