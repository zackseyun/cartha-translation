  variant: modern standard Italian
source:
  edition: SBLGNT
  text: καὶ θέλων αὐτὸν ἀποκτεῖναι ἐφοβήθη τὸν ὄχλον, ὅτι ὡς προφήτην αὐτὸν εἶχον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/005.yaml
  text: And wanting to kill him[a], he feared the crowd[b], because they regarded him as a prophet.
translation:
  language: it
  text: E, pur volendo ucciderlo[a], ebbe paura della folla, perché lo considerava un profeta[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Più letteralmente: «volendo ucciderlo»; nel contesto il participio ha valore concessivo: «benché volesse ucciderlo».'
    reason: lexical_alternative
  - marker: b
    text: 'O: «lo riteneva un profeta».'
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλων
  choice: pur volendo
  rationale: Il participio esprime il desiderio del soggetto e, nel contesto, assume naturalmente valore concessivo rispetto a «ebbe paura»; «pur volendo» conserva sia la forma participiale sia la tensione logica.
- source_word: ἀποκτεῖναι
  choice: ucciderlo
  rationale: Resa diretta di ἀποκτείνω, senza introdurre la sfumatura giuridica di «mettere a morte» né quella morale più specifica di «assassinare».
- source_word: ἐφοβήθη
  choice: ebbe paura
  rationale: L’aoristo di φοβέομαι indica qui che il soggetto temette la folla; «ebbe paura» è naturale nell’italiano narrativo moderno.
- source_word: τὸν ὄχλον
  choice: della folla
  rationale: ὄχλος designa una folla o moltitudine; «folla» è la resa italiana corrente e adatta alla scena.
- source_word: ὅτι
  choice: perché
  rationale: Introduce la causa del timore del soggetto.
- source_word: ὡς προφήτην
  choice: un profeta
  rationale: Con εἶχον, la locuzione indica la qualità nella quale Giovanni era considerato; in italiano «considerare qualcuno un profeta» rende idiomaticamente la costruzione.
- source_word: αὐτὸν εἶχον
  choice: lo considerava
  rationale: ἔχω con complemento predicativo può significare «considerare, ritenere». Il soggetto collettivo singolare «la folla» richiede naturalmente il singolare italiano.
theological_decisions:
- issue: Identità del soggetto e dell’oggetto implicita nel contesto narrativo
  choice: Conservare i pronomi «lo» e il soggetto sottinteso senza inserire i nomi di Erode e Giovanni
  alternative: «Erode, pur volendo uccidere Giovanni, ebbe paura della folla...»
  rationale: Il greco usa pronomi e affida al contesto l’identificazione dei referenti. Non aggiungere i nomi preserva la forma e l’implicitezza del testo sorgente.
- issue: Valore del participio θέλων
  choice: «pur volendo», con valore concessivo contestuale
  alternative: «volendo», senza esplicitare la concessione
  rationale: La concessione non è codificata da una congiunzione specifica, ma emerge dal rapporto tra il desiderio di ucciderlo e il timore che lo trattiene. «Pur volendo» rende tale rapporto senza eliminarne la forma participiale.
translation_notes:
  register: Italiano standard moderno, dignitoso e narrativamente scorrevole. Si mantengono i pronomi del greco e si evita di esplicitare i nomi forniti dal contesto. Il collettivo «folla» è trattato al singolare secondo l’uso italiano.
