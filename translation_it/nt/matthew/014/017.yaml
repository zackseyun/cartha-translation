  text: But they said to him[a], “We have nothing here except five loaves and two fish.”
translation:
  language: it
  text: 'Ma gli dicono: «Non abbiamo qui altro che cinque pani e due pesci».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ
  choice: Ma essi
  rationale: L’articolo sostantivato riprende come soggetto i discepoli; δέ segnala un lieve contrasto con l’ordine appena dato da Gesù.
- source_word: λέγουσιν αὐτῷ
  choice: gli dicono
  rationale: Si conserva il presente storico greco, naturale anche nella narrazione italiana e capace di rendere vivace il dialogo.
- source_word: Οὐκ ἔχομεν ὧδε εἰ μὴ
  choice: Qui non abbiamo che
  rationale: La costruzione negativa con εἰ μή ha valore eccettuativo; «non… che» è una resa italiana naturale e fedele.
- source_word: πέντε ἄρτους
  choice: cinque pani
  rationale: Ἄρτος indica pane o una pagnotta; con il numerale, «cinque pani» è la formulazione italiana consueta nel racconto.
- source_word: δύο ἰχθύας
  choice: due pesci
  rationale: Resa diretta del plurale di ἰχθύς, senza specificare dimensioni o preparazione non espresse nel testo.
