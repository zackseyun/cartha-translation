  variant: modern standard Italian
source:
  edition: SBLGNT
  text: οἱ δὲ ἐσθίοντες ἦσαν ἄνδρες ὡσεὶ πεντακισχίλιοι χωρὶς γυναικῶν καὶ παιδίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/021.yaml
  text: Those who ate were about five thousand men[a], besides women and children.
translation:
  language: it
  text: Quelli che avevano mangiato erano circa cinquemila uomini, senza contare le donne e i bambini.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ ἐσθίοντες
  choice: Quelli che avevano mangiato
  rationale: Il participio presente articolato è sostantivato e indica coloro che presero parte al pasto. In italiano, il trapassato prossimo colloca naturalmente il pasto rispetto al conteggio narrato senza insistere indebitamente sull'aspetto progressivo; δέ resta implicito nel fluire della narrazione.
- source_word: ἦσαν
  choice: erano
  rationale: L'imperfetto di εἰμί esprime qui una semplice indicazione numerica; «erano» è l'equivalente italiano naturale.
- source_word: ἄνδρες
  choice: uomini
  rationale: ἀνήρ indica persone di sesso maschile, verosimilmente adulte, non persone in generale; la distinzione è confermata dalla menzione separata di donne e bambini.
- source_word: ὡσεὶ
  choice: circa
  rationale: ὡσεί segnala approssimazione; «circa» è chiaro e idiomatico davanti a un numero.
- source_word: πεντακισχίλιοι
  choice: cinquemila
  rationale: Resa diretta del numerale cardinale.
- source_word: χωρὶς
  choice: senza contare
  rationale: χωρίς con il genitivo indica che donne e bambini non sono inclusi nel numero dichiarato. «Senza contare» rende esplicito e naturale in italiano il valore esclusivo della locuzione.
- source_word: γυναικῶν
  choice: le donne
  rationale: In questa formula di conteggio γυνή significa «donna», non «moglie», poiché non è in vista alcuna relazione coniugale.
- source_word: παιδίων
  choice: i bambini
  rationale: παιδίον indica un bambino; il plurale italiano è naturale e non restringe inutilmente l'età.
theological_decisions:
- issue: Termine di conteggio specifico per sesso in una folla mista
  choice: Rendere ἄνδρες con «uomini» e mantenere distinta la frase che esclude dal conteggio donne e bambini.
  alternative: Rendere ἄνδρες con «persone» o «gente».
  rationale: Il greco conta specificamente gli uomini e menziona poi separatamente donne e bambini. Una resa generica cancellerebbe una distinzione lessicale e storico-sociale presente nel testo.
translation_notes:
  register: 'Italiano moderno standard, sobrio e dignitoso. La frase segue un ordine naturale e conserva la distinzione del testo greco. Non è necessaria una nota: «senza contare» esprime direttamente il valore contestuale di χωρίς.'
