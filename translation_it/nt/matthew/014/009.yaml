  text: καὶ ⸂λυπηθεὶς ὁ βασιλεὺς διὰ⸃ τοὺς ὅρκους καὶ τοὺς συνανακειμένους ἐκέλευσεν δοθῆναι,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/009.yaml
  text: And the king[a], though grieved, because of his oaths and those dining with him[b], commanded it to be given.
translation:
  language: it
  text: Il re, benché rattristato, a motivo dei giuramenti e dei commensali[a], ordinò che le fosse dato[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alla lettera, «quelli adagiati a tavola con lui», secondo l'usanza del tempo.
    reason: cultural_note
  - marker: b
    text: Il greco non specifica che cosa dovesse esserle dato; il riferimento si ricava dalla richiesta formulata nel contesto precedente.
    reason: lexical_alternative
lexical_decisions:
- source_word: λυπηθεὶς
  choice: ne fu rattristato, ma
  rationale: Il participio aoristo passivo indica che il re provò tristezza; «ma» rende in modo naturale il valore concessivo implicito nel contesto, senza attenuare il contrasto con l'ordine successivo.
- source_word: ὁ βασιλεὺς
  choice: il re
  rationale: Resa diretta e usuale di βασιλεύς, mantenendo il titolo impiegato dal narratore.
- source_word: διὰ τοὺς ὅρκους
  choice: a motivo dei giuramenti
  rationale: διά con l'accusativo esprime la causa. «Giuramenti» conserva il riferimento a dichiarazioni vincolate da giuramento; l'articolo è mantenuto senza aggiungere il possessivo non espresso.
- source_word: τοὺς συνανακειμένους
  choice: i commensali
  rationale: Il participio sostantivato indica coloro che erano adagiati a tavola con lui. «Commensali» esprime naturalmente in italiano la partecipazione allo stesso banchetto; una nota conserva il particolare culturale della postura.
- source_word: ἐκέλευσεν
  choice: ordinò
  rationale: κελεύω indica un ordine autorevole; «ordinò» è corrente, conciso e adeguato al registro narrativo.
- source_word: δοθῆναι
  choice: che le fosse dato
  rationale: L'infinito aoristo passivo significa «essere dato». Il pronome femminile indica la destinataria richiesta dal contesto, mentre ciò che viene dato resta implicito come nel greco.
