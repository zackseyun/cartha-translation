  text: καὶ παρεκάλουν αὐτὸν ἵνα μόνον ἅψωνται τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ· καὶ ὅσοι ἥψαντο διεσώθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/036.yaml
  text: And they begged him that they might only touch the fringe of his garment[b][a], and as many as touched it were healed.
translation:
  language: it
  text: e lo supplicavano di poter toccare anche solo il lembo della sua veste[a]; e quanti lo toccarono furono guariti[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «l’orlo» o «la frangia»; il termine greco può indicare il bordo o la frangia di una veste, forse anche la nappa.
    reason: lexical_alternative
  - marker: b
    text: O «furono risanati»; il verbo greco può significare «guarire», «salvare» o «trarre in salvo», ma qui il contesto riguarda la guarigione fisica.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεκάλουν
  choice: lo supplicavano
  rationale: L’imperfetto esprime una richiesta insistente o continuata; «supplicavano» ne conserva l’urgenza senza appesantire la frase.
- source_word: ἵνα μόνον ἅψωνται
  choice: di poter toccare anche solo
  rationale: Rende in italiano naturale il contenuto della richiesta espresso da ἵνα con il congiuntivo; «anche solo» mette in risalto che ritenevano sufficiente il semplice contatto.
- source_word: τοῦ κρασπέδου
  choice: il lembo
  rationale: κράσπεδον può indicare il bordo, l’orlo o la frangia di una veste. «Lembo» è naturale e abbastanza ampio da non precisare indebitamente se si tratti di una nappa.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: della sua veste
  rationale: ἱμάτιον indica qui un indumento, verosimilmente esterno; «veste» conserva la genericità del termine greco.
- source_word: ὅσοι
  choice: quanti
  rationale: Riproduce in modo conciso il valore quantitativo e relativo di ὅσοι.
- source_word: ἥψαντο
  choice: lo toccarono
  rationale: Il pronome riprende naturalmente «il lembo» e rende esplicito in italiano l’oggetto sottinteso dal contesto.
- source_word: διεσώθησαν
  choice: furono guariti
  rationale: Nel contesto immediato delle guarigioni fisiche, il verbo indica che furono risanati; la nota conserva la sua gamma semantica più ampia.
theological_decisions:
- issue: Valore di διεσώθησαν nel contesto del miracolo
  choice: guarigione fisica («furono guariti»)
  alternative: «furono salvati», «furono risanati» o «furono messi in salvo»
  rationale: Il contesto riguarda malati portati a Gesù e il loro contatto con la sua veste, perciò il riferimento primario è alla guarigione corporea. La nota segnala tuttavia che il verbo greco può esprimere anche salvezza o liberazione, senza cancellarne l’ampiezza semantica.
translation_notes:
  register: Italiano moderno, dignitoso e scorrevole. La struttura coordinata del greco è mantenuta; «di poter toccare anche solo» evita una costruzione rigida, mentre «quanti» conserva il valore distributivo dell’originale.
