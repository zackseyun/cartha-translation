  text: Καὶ διαπεράσαντες ἦλθον ⸂ἐπὶ τὴν γῆν εἰς⸃ Γεννησαρέτ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/034.yaml
  text: And after crossing over[a], they came to the land of Gennesaret.
translation:
  language: it
  text: Dopo la traversata, giunsero a terra nella regione di Gennesaret.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαπεράσαντες
  choice: Dopo aver attraversato il lago
  rationale: Il participio aoristo esprime un’azione anteriore rispetto al verbo principale. Il contesto immediato è una traversata in barca; «il lago» rende naturale in italiano l’oggetto sottinteso senza specificare il mezzo.
- source_word: ἦλθον
  choice: giunsero
  rationale: L’aoristo di ἔρχομαι indica qui l’arrivo alla destinazione; «giunsero» è più idiomatico di «vennero» con l’espressione locativa seguente.
- source_word: ἐπὶ τὴν γῆν
  choice: a terra
  rationale: L’espressione significa letteralmente «sulla terra» e, nel contesto nautico, indica lo sbarco o l’arrivo sulla terraferma. «A terra» conserva il riferimento alla terra senza sostituirlo esplicitamente con «riva».
- source_word: εἰς Γεννησαρέτ
  choice: nella regione di Gennesaret
  rationale: La preposizione εἰς esprime la meta; accostata a ἐπὶ τὴν γῆν, identifica Gennesaret come l’area in cui approdarono. «Nella regione di» rende chiaramente il rapporto geografico in italiano.
- source_word: Γεννησαρέτ
  choice: Gennesaret
  rationale: Il toponimo è traslitterato nella forma italiana tradizionale e riconoscibile.
