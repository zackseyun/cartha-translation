id: MAT.14.31
reference: Matthew 14:31
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: εὐθέως δὲ ὁ Ἰησοῦς ἐκτείνας τὴν χεῖρα ἐπελάβετο αὐτοῦ καὶ λέγει αὐτῷ· Ὀλιγόπιστε, εἰς τί ἐδίστασας;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/031.yaml
  text: Immediately Jesus stretched out his hand[a], took hold of him, and said to him, “You of little faith, why did you doubt?”
translation:
  language: it
  text: 'Subito Gesù tese la mano, lo afferrò e gli disse: «Tu che hai poca fede, perché hai dubitato?[a]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «perché hai esitato?» Il verbo greco può indicare esitazione o tentennamento, oltre che dubbio.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: Subito
  rationale: Esprime con naturalezza l’immediatezza dell’azione e conserva l’urgenza narrativa.
- source_word: δὲ
  choice: —
  rationale: La particella ha qui una funzione di raccordo lievemente avversativa; in italiano il passaggio risulta naturale senza renderla esplicitamente.
- source_word: ἐκτείνας τὴν χεῖρα
  choice: tese la mano
  rationale: Mantiene l’immagine concreta e rende in modo idiomatico il participio, indicando un’azione che precede immediatamente quella principale.
- source_word: ἐπελάβετο αὐτοῦ
  choice: lo afferrò
  rationale: Rende il gesto deciso del prendere saldamente qualcuno, senza aggiungere dettagli non espressi dal greco.
- source_word: λέγει αὐτῷ
  choice: gli disse
  rationale: Il presente storico greco è reso con il passato remoto, più naturale nella narrazione italiana e coerente con i verbi circostanti.
- source_word: Ὀλιγόπιστε
  choice: Tu che hai poca fede
  rationale: Riproduce il vocativo rivolto direttamente a Pietro e presenta la fede come insufficiente, non del tutto assente.
- source_word: εἰς τί
  choice: perché
  rationale: È l’equivalente interrogativo più naturale in questo contesto.
- source_word: ἐδίστασας
  choice: hai dubitato
  rationale: Rende chiaramente il senso principale del verbo, lasciando in nota la sfumatura possibile di esitazione o tentennamento.
theological_decisions:
- issue: Resa di Ὀλιγόπιστε in rapporto a πίστις
  choice: Tu che hai poca fede
  alternative: Uomo di poca fede
  rationale: Conserva il riferimento esplicito alla fede e il carattere personale del rimprovero, senza suggerire una totale assenza di fede; evita inoltre di introdurre nel vocativo il sostantivo «uomo», assente nel greco.
- issue: Sfumatura di ἐδίστασας
  choice: hai dubitato
  alternative: hai esitato
  rationale: «Dubitato» mantiene il consueto nesso con la fede nel contesto, mentre la nota preserva la reale ampiezza semantica del verbo, che può indicare esitazione o tentennamento.
translation_notes:
  register: Italiano moderno, dignitoso e narrativamente scorrevole. Il passato remoto è adatto al racconto; il discorso diretto conserva la forza personale del rimprovero senza irrigidirlo in una formula arcaica.
