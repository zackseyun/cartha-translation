lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: È un connettivo lieve; «Ma» esprime naturalmente il contrasto con l'obiezione dei discepoli nel versetto precedente.
- source_word: εἶπεν
  choice: disse
  rationale: Rende direttamente l'aoristo di λέγω senza aggiungere al verbo una sfumatura di comando.
- source_word: Φέρετέ
  choice: Portate
  rationale: L'imperativo presente plurale di φέρω ordina ai discepoli di condurre gli alimenti verso Gesù; «portate» è naturale e preciso.
- source_word: μοι
  choice: -meli
  rationale: Il pronome dativo è reso dal clitico italiano «mi», unito all'imperativo insieme al pronome oggetto.
- source_word: ὧδε
  choice: qui
  rationale: Conserva il valore locale dell'avverbio, indicando il luogo presso Gesù.
- source_word: αὐτούς
  choice: -li
  rationale: Il pronome maschile plurale riprende contestualmente i pani e i pesci; il clitico «li» mantiene il riferimento senza ripeterli nel testo.
theological_decisions: []
translation_notes:
  register: Italiano moderno, dignitoso e conciso. «Egli» mantiene esplicito il soggetto enfatico ὁ δέ; «Portatemeli qui» riproduce in forma idiomatica l'imperativo, il dativo personale, il pronome oggetto e l'avverbio di luogo.
