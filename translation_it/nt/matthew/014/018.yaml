  text: But he said[a], “Bring them here to me.”
translation:
  language: it
  text: 'Ma egli disse: «Portatemeli[a] qui».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cioè i pani e i pesci menzionati nel versetto precedente.
