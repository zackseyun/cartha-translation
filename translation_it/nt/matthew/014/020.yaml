  text: καὶ ἔφαγον πάντες καὶ ἐχορτάσθησαν, καὶ ἦραν τὸ περισσεῦον τῶν κλασμάτων δώδεκα κοφίνους πλήρεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/020.yaml
  text: And they all ate and were satisfied[a], and they picked up twelve full baskets of the leftover pieces.
translation:
  language: it
  text: Tutti mangiarono e furono sazi; poi raccolsero dodici ceste piene dei pezzi avanzati.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφαγον
  choice: mangiarono
  rationale: L’aoristo indicativo di ἐσθίω esprime il semplice evento narrativo e si rende naturalmente con il passato remoto.
- source_word: πάντες
  choice: tutti
  rationale: Il nominativo plurale comprende l’intera folla; in italiano il soggetto sottinteso del verbo consente una formulazione naturale senza aggiungere un pronome.
- source_word: ἐχορτάσθησαν
  choice: furono saziati
  rationale: Il passivo di χορτάζω indica che mangiarono fino a essere pienamente sazi; la forma passiva conserva più da vicino la struttura e la sfumatura del greco.
- source_word: ἦραν
  choice: raccolsero
  rationale: In questo contesto αἴρω descrive il raccogliere ciò che era rimasto, e «raccolsero» è corrente e preciso.
- source_word: τὸ περισσεῦον τῶν κλασμάτων
  choice: dei pezzi avanzati
  rationale: La formulazione rende insieme ciò che rimaneva e i κλάσματα, cioè pezzi spezzati, verosimilmente di pane, senza introdurre un referente non espresso in modo esplicito.
- source_word: δώδεκα κοφίνους πλήρεις
  choice: dodici ceste piene
  rationale: Riproduce con chiarezza il numero, il recipiente e la sua condizione; «ceste» è un equivalente italiano naturale di κοφίνους.
theological_decisions:
- issue: La sazietà prodotta dalla moltiplicazione
  choice: furono saziati
  alternative: si saziarono; mangiarono a sazietà
  rationale: La resa conserva il passivo greco e riferisce la piena sazietà senza aggiungere una spiegazione teologica o attenuare il carattere straordinario dell’evento.
translation_notes:
  register: Italiano moderno, dignitoso e narrativamente scorrevole. Il punto e virgola distingue il risultato del pasto dalla successiva raccolta senza spezzare l’unità del versetto.
