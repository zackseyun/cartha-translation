reference: Matthew 14:14
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: καὶ ⸀ἐξελθὼν εἶδεν πολὺν ὄχλον, καὶ ἐσπλαγχνίσθη ἐπ’ αὐτοῖς καὶ ἐθεράπευσεν τοὺς ἀρρώστους αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/014.yaml
  text: And when he went ashore[a], he saw a large crowd[b], and he had compassion on them and healed their sick.
translation:
  language: it
  text: Sceso dalla barca,[a] vide una grande folla, ne ebbe compassione e guarì i loro malati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Più letteralmente: «Uscito» o «Venuto fuori». Nel contesto, si tratta probabilmente dello scendere dalla barca.'
    reason: Alternativa lessicale e chiarimento contestuale.
lexical_decisions:
- source_word: ἐξελθὼν
  choice: Sceso dalla barca
  rationale: Il participio significa letteralmente «uscito» o «venuto fuori»; nel contesto immediato dell’arrivo in barca, «sceso dalla barca» esprime in italiano naturale l’azione implicita senza appesantire la frase.
- source_word: εἶδεν
  choice: vide
  rationale: Resa diretta e ordinaria dell’aoristo di ὁράω.
- source_word: πολὺν ὄχλον
  choice: una grande folla
  rationale: Conserva il valore quantitativo di πολύς e rende ὄχλος in italiano moderno e naturale.
- source_word: ἐσπλαγχνίσθη ἐπ’ αὐτοῖς
  choice: ne ebbe compassione
  rationale: Esprime la compassione profonda indicata dal verbo e mantiene chiaramente come referente la folla, con una formulazione dignitosa e corrente.
- source_word: ἐθεράπευσεν
  choice: guarì
  rationale: Nel contesto il verbo indica la guarigione fisica; «guarì» è la resa italiana più diretta.
- source_word: τοὺς ἀρρώστους αὐτῶν
  choice: i loro malati
  rationale: Riproduce in modo conciso l’aggettivo sostantivato «i malati» insieme al genitivo «loro», senza ampliare il testo.
theological_decisions:
- issue: La reazione emotiva di Gesù
  choice: ne ebbe compassione
  alternative: fu mosso a compassione per loro
  rationale: La formulazione conserva la compassione di Gesù come motivo della guarigione, senza intensificare o parafrasare oltre quanto espresso dal greco.
translation_notes:
  register: Italiano standard moderno, scorrevole e dignitoso. La sintassi compatta conserva la sequenza narrativa del greco; «ne ebbe compassione» evita una formulazione arcaica pur mantenendo la forza emotiva del verbo.
