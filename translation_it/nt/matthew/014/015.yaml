  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ὀψίας δὲ γενομένης προσῆλθον αὐτῷ οἱ ⸀μαθηταὶ λέγοντες· Ἔρημός ἐστιν ὁ τόπος καὶ ἡ ὥρα ἤδη παρῆλθεν· ἀπόλυσον τοὺς ὄχλους, ἵνα ἀπελθόντες εἰς τὰς κώμας ἀγοράσωσιν ἑαυτοῖς βρώματα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/015.yaml
  text: When evening came[a], the disciples came to him and said, “The place is deserted, and the hour is already late. Send the crowds away[b], so that they may go into the villages and buy food for themselves.”
translation:
  language: it
  text: 'Venuta la sera, i discepoli gli si avvicinarono e dissero: «Il luogo è deserto e si è già fatto tardi[a]. Congeda le folle, perché vadano nei villaggi a comprarsi da mangiare».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Letteralmente, «l’ora è già passata».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀψίας δὲ γενομένης
  choice: Venuta la sera
  rationale: Il genitivo assoluto introduce una transizione temporale. La resa è idiomatica e dignitosa; il valore connettivo di δέ non richiede qui un avverbio italiano esplicito.
- source_word: προσῆλθον αὐτῷ
  choice: gli si avvicinarono
  rationale: προσέρχομαι indica l’avvicinarsi o il recarsi presso qualcuno; questa formulazione è naturale nel contesto narrativo.
- source_word: οἱ μαθηταί
  choice: i discepoli
  rationale: L’articolo identifica il gruppo già noto senza rendere necessario aggiungere il possessivo «suoi», non espresso nel greco.
- source_word: Ἔρημός ἐστιν ὁ τόπος
  choice: Il luogo è deserto
  rationale: ἔρημος descrive qui un luogo non abitato o lontano dai centri abitati; «deserto» conserva la concisione dell’originale senza trasformarlo necessariamente in un deserto geografico.
- source_word: ἡ ὥρα ἤδη παρῆλθεν
  choice: si è già fatto tardi[a]
  rationale: L’espressione letterale «l’ora è già passata» indica idiomaticamente che il giorno è ormai avanzato. La nota conserva la forma dell’originale.
- source_word: ἀπόλυσον τοὺς ὄχλους
  choice: Congeda le folle
  rationale: ἀπολύω significa qui mandare via o congedare; l’imperativo singolare è rivolto a Gesù. Il plurale «le folle» rispecchia τοὺς ὄχλους.
- source_word: ἵνα ἀπελθόντες εἰς τὰς κώμας
  choice: perché vadano nei villaggi
  rationale: La proposizione finale e il participio sono resi con una costruzione italiana naturale che mantiene lo scopo dell’azione richiesta.
- source_word: ἀγοράσωσιν ἑαυτοῖς βρώματα
  choice: a comprarsi da mangiare
  rationale: La resa conserva sia l’idea dell’acquisto sia il valore riflessivo di ἑαυτοῖς, usando un’espressione corrente per βρώματα.
theological_decisions: []
translation_notes:
  register: Italiano moderno standard, narrativo e dignitoso. Si mantiene il plurale «le folle» dell’originale. I richiami delle note della versione inglese risultano disallineati rispetto al loro contenuto; la nota sulla formulazione letterale di ἡ ὥρα ἤδη παρῆλθεν è stata quindi collocata dopo «tardi».
