  text: ⸂γενεσίοις δὲ γενομένοις⸃ τοῦ Ἡρῴδου ὠρχήσατο ἡ θυγάτηρ τῆς Ἡρῳδιάδος ἐν τῷ μέσῳ καὶ ἤρεσεν τῷ Ἡρῴδῃ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/006.yaml
  text: But when Herod’s birthday came[a], the daughter of Herodias danced in the midst and pleased Herod[b],
translation:
  language: it
  text: Ma, quando si celebrò il compleanno di Erode[a], la figlia di Erodiade danzò in mezzo[b] e piacque a Erode.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: «quando giunse il compleanno di Erode» oppure «durante la festa per il compleanno di Erode». Il greco si riferisce all''occasione in cui si celebrava il compleanno.'
    reason: lexical_alternative
  - marker: b
    text: 'O: «nel mezzo» o «al centro». L''espressione può riferirsi al centro della riunione.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γενεσίοις δὲ γενομένοις τοῦ Ἡρῴδου
  choice: Ma, quando si celebrò il compleanno di Erode
  rationale: La costruzione temporale indica il verificarsi o la celebrazione del compleanno. «Quando si celebrò» rende esplicita in italiano naturale l'occasione festiva senza limitarla alla semplice data; «ma» conserva la lieve transizione avversativa di δέ.
- source_word: ὠρχήσατο
  choice: danzò
  rationale: Il verbo significa direttamente «danzare»; la resa semplice evita di precisare indebitamente il genere di esibizione.
- source_word: ἡ θυγάτηρ τῆς Ἡρῳδιάδος
  choice: la figlia di Erodiade
  rationale: Riproduce il rapporto genitivale senza introdurre il nome tradizionale della figlia, assente nel testo.
- source_word: ἐν τῷ μέσῳ
  choice: in mezzo agli invitati
  rationale: «In mezzo» conserva il valore spaziale della locuzione; «agli invitati» esplicita con naturalezza il gruppo sottinteso dal contesto della festa, segnalando in nota la resa più letterale.
- source_word: ἤρεσεν τῷ Ἡρῴδῃ
  choice: piacque a Erode
  rationale: Rende direttamente ἀρέσκω con il dativo e mantiene distinta la reazione personale di Erode senza aggiungere motivazioni.
