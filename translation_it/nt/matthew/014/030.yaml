  text: βλέπων δὲ τὸν ἄνεμον ⸀ἰσχυρὸν ἐφοβήθη, καὶ ἀρξάμενος καταποντίζεσθαι ἔκραξεν λέγων· Κύριε, σῶσόν με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/030.yaml
  text: But seeing the strong wind[a], he became afraid, and beginning to sink, he cried out, saying, “Lord[b], save me.”
translation:
  language: it
  text: 'Ma, vedendo che il vento era forte[a], ebbe paura e, cominciando ad affondare, gridò: «Signore, salvami[b]!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: «il vento impetuoso».'
    reason: lexical_alternative
  - marker: b
    text: 'O: «mettimi in salvo». Il verbo greco può indicare sia la liberazione da un pericolo immediato sia, più in generale, la salvezza.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπων δὲ
  choice: Ma, vedendo
  rationale: Il participio presente esprime una percezione contemporanea, mentre δὲ introduce la svolta contrastiva rispetto al precedente cammino di Pietro sull'acqua.
- source_word: τὸν ἄνεμον ἰσχυρόν
  choice: che il vento era forte
  rationale: La costruzione italiana rende in modo naturale ἰσχυρός riferito al vento; evita l'espressione poco idiomatica «vedendo il vento forte» senza intensificare indebitamente il testo.
- source_word: ἐφοβήθη
  choice: ebbe paura
  rationale: Esprime con naturalezza l'insorgere della paura nel momento narrato.
- source_word: ἀρξάμενος καταποντίζεσθαι
  choice: cominciando ad affondare
  rationale: Conserva l'aspetto iniziale indicato da ἀρξάμενος e rende καταποντίζεσθαι senza anticipare l'esito più forte di «annegare».
- source_word: ἔκραξεν λέγων
  choice: gridò
  rationale: «Gridò» comunica l'intensità e l'urgenza di ἔκραξεν; i due punti introducono direttamente le parole pronunciate, rendendo superfluo in italiano il participio λέγων.
- source_word: Κύριε
  choice: Signore
  rationale: È la resa italiana normale e dignitosa del vocativo κύριε rivolto a Gesù e ne conserva il possibile peso cristologico.
- source_word: σῶσόν με
  choice: salvami
  rationale: L'imperativo esprime una richiesta urgente di liberazione dal pericolo; «salvami» è idiomatico nel contesto e mantiene anche l'ampiezza semantica di σῴζω.
theological_decisions:
- issue: Resa di κύριος nell'appello rivolto a Gesù
  choice: Signore
  alternative: Maestro
  rationale: «Signore» è la corrispondenza più diretta e conserva il rilievo cristologico dell'appellativo senza precisarlo oltre ciò che il testo afferma.
- issue: Resa di σῴζω in una situazione di pericolo fisico immediato
  choice: salvami
  alternative: mettimi in salvo
  rationale: «Salvami» si adatta al pericolo concreto e preserva al tempo stesso la più ampia risonanza del verbo greco, anziché restringerlo alla sola liberazione fisica.
translation_notes:
  register: Italiano moderno standard, naturale e dignitoso. La sintassi conserva la svolta narrativa e la progressione degli eventi, evitando calchi poco idiomatici; l'esclamazione finale comunica l'urgenza dell'appello.
