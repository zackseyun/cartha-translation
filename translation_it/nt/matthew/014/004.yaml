  text: ἔλεγεν γὰρ ⸂αὐτῷ ὁ Ἰωάννης⸃· Οὐκ ἔξεστίν σοι ἔχειν αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/004.yaml
  text: For John had been saying to him[a], “It is not lawful for you to have her.”
translation:
  language: it
  text: 'Giovanni, infatti, gli diceva: «Non ti è lecito averla».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: «Non ti è permesso averla».'
    reason: Alternativa lessicale per ἔξεστιν, che può esprimere ciò che è permesso oltre che ciò che è lecito.
lexical_decisions:
- source_word: ἔλεγεν
  choice: diceva
  rationale: L’imperfetto esprime un’azione passata continuata o ripetuta; l’imperfetto italiano «diceva» ne conserva naturalmente l’aspetto senza appesantire la frase.
- source_word: γὰρ
  choice: infatti
  rationale: Introduce la spiegazione di quanto precede; «infatti» rende in modo naturale il valore esplicativo della congiunzione.
- source_word: αὐτῷ
  choice: gli
  rationale: Il pronome dativo indica il destinatario delle parole ed è reso idiomaticamente con il pronome indiretto italiano.
- source_word: ὁ Ἰωάννης
  choice: Giovanni
  rationale: Il testo greco nomina semplicemente Giovanni; il contesto lo identifica già come Giovanni il Battista.
- source_word: Οὐκ ἔξεστίν σοι
  choice: Non ti è lecito
  rationale: La formulazione conserva il valore di liceità o permesso, qui con netta portata morale e legale, ed è idiomatica in italiano.
- source_word: ἔχειν αὐτήν
  choice: tenerla con te
  rationale: Il verbo significa letteralmente «avere», ma nel contesto indica il tenere Erodiade nella propria unione. «Tenerla con te» resta vicino alla formulazione greca e suona più naturale del semplice «averla», senza esplicitare oltre il testo «come moglie».
theological_decisions:
- issue: Natura del rimprovero di Giovanni
  choice: «Non ti è lecito tenerla con te»
  alternative: «Non ti è permesso tenerla con te» oppure «Non è giusto che tu la tenga con te»
  rationale: ἔξεστιν riguarda ciò che è consentito o lecito. «Lecito» conserva la forza morale-legale del rimprovero senza ridurlo a una generica valutazione di opportunità.
- issue: Senso della relazione espressa da ἔχειν αὐτήν
  choice: Lasciare implicita la precisa qualifica coniugale
  alternative: «Averla come moglie»
  rationale: Il contesto chiarisce che si tratta di Erodiade e dell’unione con lei, ma il versetto usa soltanto il pronome e il verbo «avere». La traduzione evita di aggiungere una specificazione non esplicita, pur rendendo naturale il senso contestuale.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. «Diceva» mantiene il valore durativo dell’imperfetto; «gli» evita una ripetizione pesante. La resa «tenerla con te» comunica naturalmente il senso relazionale senza introdurre esplicitamente «come moglie». Il marcatore [a] compare nel testo principale.
