  naturalness: «Non ti è lecito averla» è italiano standard, chiaro e di registro adeguatamente solenne ma moderno. «Tenerla con te» è comprensibile, ma introduce l'idea di convivenza/presenza («con te») che il testo greco non esprime e attenua la formulazione idiomatica del contesto matrimoniale.
  terminology: «Lecito» riproduce appropriatamente la portata di permesso/liceità di ἔξεστιν, senza imporre una formulazione confessionale. Il nome «Giovanni» è conforme al testo, che non aggiunge qui «il Battista».
