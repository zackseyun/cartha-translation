lexical_decisions:
- source_word: Ἐν ἐκείνῳ τῷ καιρῷ
  choice: In quel tempo
  rationale: È la resa idiomatica e tradizionalmente comprensibile del complemento temporale greco, naturale anche nell’italiano moderno.
- source_word: ἤκουσεν
  choice: udì parlare
  rationale: Nel contesto, con τὴν ἀκοὴν Ἰησοῦ, esprime il fatto che Erode ricevette notizie riguardo a Gesù; la formulazione italiana evita la poco naturale ripetizione «udì la notizia».
- source_word: Ἡρῴδης
  choice: Erode
  rationale: Forma italiana standard del nome proprio.
- source_word: ὁ τετραάρχης
  choice: il tetrarca
  rationale: Conserva il titolo politico storicamente preciso senza sostituirlo con una parafrasi interpretativa.
- source_word: τὴν ἀκοὴν Ἰησοῦ
  choice: parlare di Gesù
  rationale: Qui ἀκοή indica ciò che viene udito, cioè la fama, notizia o voce riguardante Gesù. La resa è naturale in italiano e mantiene Gesù come argomento di ciò che Erode udì.
