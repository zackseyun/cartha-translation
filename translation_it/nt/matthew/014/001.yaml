base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/001.yaml
  text: At that time Herod the tetrarch heard the report about Jesus,[a]
translation:
  language: it
  text: In quel tempo Erode il tetrarca sentì la notizia riguardo a Gesù.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «sentì parlare di Gesù».'
