id: MAT.11.25
reference: Matthew 11:25
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Ἐν ἐκείνῳ τῷ καιρῷ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν· Ἐξομολογοῦμαί σοι, πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς, ὅτι ⸀ἔκρυψας ταῦτα ἀπὸ σοφῶν καὶ συνετῶν, καὶ ἀπεκάλυψας αὐτὰ νηπίοις·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/025.yaml
  text: At that time Jesus answered and said[a], “I praise you, Father, Lord of heaven and earth, because you hid these things from the wise and understanding[b], and revealed them to little children.”
translation:
  language: it
  text: 'In quel tempo Gesù prese la parola e disse: «Ti lodo[a], Padre, Signore del cielo e della terra, perché hai nascosto queste cose ai sapienti e agli intelligenti e le hai rivelate ai bambini[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «Ti ringrazio». Il verbo greco può esprimere il ringraziamento, la lode o un riconoscimento aperto.
    reason: lexical_alternative
  - marker: b
    text: O «agli infanti». Qui il termine indica probabilmente, in senso figurato, persone umili o pronte ad accogliere come bambini.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐκείνῳ τῷ καιρῷ
  choice: In quel tempo
  rationale: Espressione temporale idiomatica che conserva l’ambientazione narrativa senza suggerire un’immediatezza maggiore di quella espressa dal greco.
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: prese la parola e disse
  rationale: Rende in italiano naturale la formula narrativa di influsso semitico. Poiché non precede una domanda esplicita, evita di crearne una con «rispose», pur conservando l’idea che Gesù intervenga in risposta alla situazione.
- source_word: Ἐξομολογοῦμαί σοι
  choice: Ti lodo
  rationale: Nel rivolgersi al Padre, il verbo indica un riconoscimento aperto che assume il tono della lode e può includere il ringraziamento. «Ti lodo» conserva il tono dossologico senza evocare impropriamente la confessione di un peccato.
- source_word: πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς
  choice: Padre, Signore del cielo e della terra
  rationale: Conserva la successione dei vocativi e attribuisce al Padre la sovranità sul creato.
- source_word: ὅτι
  choice: perché
  rationale: Esprime naturalmente il motivo della lode; resta possibile intendere la congiunzione anche come introduzione al contenuto dell’affermazione.
- source_word: ἔκρυψας
  choice: hai nascosto
  rationale: Riproduce direttamente il verbo attivo e mantiene il Padre come soggetto agente.
- source_word: ταῦτα ... αὐτά
  choice: queste cose ... le
  rationale: Mantiene aperto il referente del dimostrativo senza precisare interpretativamente quali verità o realtà siano indicate.
- source_word: ἀπὸ σοφῶν καὶ συνετῶν
  choice: ai sapienti e agli intelligenti
  rationale: Conserva i due aggettivi sostantivati e il contrasto tra quanti sono ritenuti sapienti e dotati d’intelligenza e i bambini.
- source_word: ἀπεκάλυψας
  choice: le hai rivelate
  rationale: «Rivelare» è la resa diretta e teologicamente appropriata dell’atto divino di rendere noto ciò che era nascosto.
- source_word: νηπίοις
  choice: ai bambini
  rationale: Conserva l’immagine concreta del termine greco e permette al lettore di coglierne il valore metaforico, senza sostituirla con una categoria interpretativa come «gli umili».
theological_decisions:
- issue: Azione divina nel nascondere e nel rivelare
  choice: «hai nascosto ... hai rivelate»
  alternative: «hai permesso che restassero nascoste ... hai fatto conoscere»
  rationale: I verbi greci sono attivi e hanno il Padre come soggetto. La traduzione conserva questa attribuzione diretta senza attenuarla né svilupparla in una spiegazione dottrinale sulla predestinazione o sull’indurimento.
- issue: Valore metaforico di νηπίοις
  choice: «ai bambini»
  alternative: «agli infanti» oppure l’esplicativo «agli umili»
  rationale: «Bambini» mantiene la metafora e il contrasto con i sapienti e gli intelligenti. Non riduce il termine a un’età biologica precisa e non trasforma implicitamente l’immagine in un’interpretazione astratta.
translation_notes:
  register: Italiano standard moderno, dignitoso e adatto alla lettura pubblica. «Prese la parola e disse» evita l’innaturale impressione di una domanda precedente; «Ti lodo» mantiene il tono solenne senza arcaismi; «bambini» conserva l’immagine accessibile e concreta del greco.
