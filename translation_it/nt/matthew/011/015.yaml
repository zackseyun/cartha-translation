  yaml_path: translation/nt/matthew/011/015.yaml
  text: The one who has ears[a], let him hear.
translation:
  language: it
  text: Chi ha orecchi[a] ascolti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
