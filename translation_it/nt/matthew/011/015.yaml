lexical_decisions:
- source_word: ὁ ἔχων
  choice: Chi ha
  rationale: L’articolo con il participio presente ha valore sostantivato e generico. «Chi ha» rende in italiano corrente qualunque persona che possieda la caratteristica indicata, senza introdurre un pronome di genere non necessario.
- source_word: ὦτα
  choice: orecchi
  rationale: Il greco presenta il plurale accusativo «orecchi». La forma italiana conserva il plurale e l’espressione idiomatica che invita a una comprensione attenta.
- source_word: ἀκουέτω
  choice: ascolti
  rationale: Il presente imperativo attivo di terza persona è reso naturalmente con il congiuntivo esortativo italiano «ascolti». Rispetto a «oda», «ascolti» comunica con chiarezza non soltanto la percezione uditiva, ma anche l’attenzione richiesta, senza esplicitare oltre il greco l’idea di obbedire.
theological_decisions:
- issue: Espressione generica al maschile singolare
  choice: Chi ha orecchi ascolti.
  alternative: Colui che ha orecchi, oda.
  rationale: Benché il greco impieghi una costruzione grammaticalmente maschile singolare, il suo riferimento è generico. In italiano «chi» conserva il singolare e la portata universale senza rendere l’espressione artificiale o limitarla ai maschi.
- issue: Portata dell’imperativo ἀκουέτω
  choice: ascolti
  alternative: oda
  rationale: Il verbo può indicare tanto l’udire quanto l’ascoltare con attenzione. «Ascolti» mantiene l’esortazione alla ricezione attenta, lasciando implicata — e non imponendo — l’ulteriore sfumatura del prestare ascolto o obbedire.
translation_notes:
  register: Italiano moderno, conciso e dignitoso. La formulazione mantiene il carattere proverbiale e solenne del detto, evitando l’arcaico «oda». La nota segnala la variante manoscritta pertinente al punto in cui compare il marcatore.
