  rationale: La revisione evita di rendere come esplicita l'intensificazione possibile ma discussa di ἐπιγινώσκω, mantenendola in nota. Corregge inoltre l'alternativa della nota affinché renda correttamente la relazione «a chi» di ᾧ ἐὰν e conserva la volizione del Figlio con una formulazione italiana contemporanea. «Consegnato» è più aderente al valore di trasferimento di παρεδόθη.
