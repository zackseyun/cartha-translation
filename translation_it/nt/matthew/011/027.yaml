  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Πάντα μοι παρεδόθη ὑπὸ τοῦ πατρός μου, καὶ οὐδεὶς ἐπιγινώσκει τὸν υἱὸν εἰ μὴ ὁ πατήρ, οὐδὲ τὸν πατέρα τις ἐπιγινώσκει εἰ μὴ ὁ υἱὸς καὶ ᾧ ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/027.yaml
  text: All things have been handed over to me by my Father[a], and no one knows the Son except the Father[b], nor does anyone know the Father except the Son and anyone to whom the Son chooses to reveal him.
translation:
  language: it
  text: Tutto mi è stato consegnato dal Padre mio, e nessuno conosce il Figlio se non il Padre; né alcuno conosce il Padre se non il Figlio e colui al quale il Figlio vuole rivelarlo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «conosce pienamente» nelle due occorrenze; il verbo greco può avere una sfumatura intensiva. L''ultima frase si può anche rendere: «e a chi il Figlio sceglie di rivelarlo».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντα
  choice: Tutto
  rationale: Il neutro plurale greco ha portata complessiva; «tutto» è naturale in italiano e non precisa indebitamente l'ambito.
- source_word: παρεδόθη
  choice: mi è stato affidato
  rationale: L'aoristo passivo indica un trasferimento compiuto dal Padre. «Affidato» esprime qui in italiano dignitoso l'atto di consegnare autorità e realtà al Figlio, evitando le connotazioni negative che «consegnato» può assumere nel linguaggio evangelico.
- source_word: ὑπὸ τοῦ πατρός μου
  choice: dal Padre mio
  rationale: Conserva il rapporto personale espresso dal possessivo e il valore titolare di «Padre».
- source_word: ἐπιγινώσκει
  choice: conosce veramente
  rationale: Mantiene una possibile sfumatura intensiva o relazionale del composto senza imporre l'idea filosoficamente più forte di conoscenza esaustiva. La stessa resa è usata nelle due clausole parallele.
- source_word: εἰ μὴ
  choice: se non
  rationale: Equivalente italiano naturale nelle proposizioni esclusive successive a una negazione.
- source_word: ᾧ ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι
  choice: colui al quale il Figlio voglia rivelarlo
  rationale: «Voglia» conserva direttamente la volizione del Figlio e la costruzione relativa indefinita; il pronome «lo» rinvia al Padre.
- source_word: ἀποκαλύψαι
  choice: rivelarlo
  rationale: «Rivelare» conserva il senso di disvelamento o comunicazione divina proprio del verbo.
theological_decisions:
- issue: Forza di ἐπιγινώσκω nella conoscenza reciproca del Padre e del Figlio
  choice: «conosce veramente» in entrambe le clausole
  alternative: «conosce» oppure «conosce pienamente»
  rationale: La formulazione segnala la possibile forza intensiva del composto e l'unicità della conoscenza reciproca, ma evita di trasformare una sfumatura lessicale discussa in un'affermazione esplicita di esaustività.
- issue: Volizione espressa da βούληται
  choice: «voglia»
  alternative: «scelga di»
  rationale: La resa mantiene l'iniziativa volontaria del Figlio senza attenuarla a semplice desiderio né specificarne oltre il testo il modo dell'elezione.
- issue: Referente dell'oggetto sottinteso di ἀποκαλύψαι
  choice: Esplicitato con «lo», riferito al Padre
  alternative: Lasciare l'oggetto implicito
  rationale: Il referente immediato è il Padre; esplicitarlo è necessario per un italiano naturale e non altera il contenuto.
translation_notes:
  register: Italiano moderno, dignitoso e scorrevole. Il parallelismo tra Padre e Figlio è conservato; il punto e virgola rende leggibile il lungo periodo senza spezzarne l'unità.
