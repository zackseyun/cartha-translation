review_pass:
  verdict: revise
  source_fidelity: Il senso del periodo controfattuale è conservato, così come il valore di αἱ δυνάμεις e l'immagine penitenziale. Tuttavia, la doppia resa «fossero state compiute ... compiute» attribuisce in modo un po' rigido a entrambe le occorrenze di γίνομαι il medesimo verbo e produce una formulazione italiana poco scorrevole. «In sacco e cenere» riproduce inoltre più direttamente ἐν σάκκῳ καὶ σποδῷ senza esplicitazioni non richieste.
  naturalness: «Le opere potenti compiute fra voi» è chiaro, ma la ripetizione immediata di «compiute» risulta pesante. «Si sarebbero pentite» è l'equivalente moderno più corrente e preciso nel contesto per μετενόησαν; il femminile plurale conserva la personificazione di Tiro e Sidone.
  terminology: «Guai a te», «Corazin», «Betsaida», «opere potenti» e «pentirsi» sono appropriati al registro profetico e all'italiano biblico moderno. La nota lessicale su δυνάμεις resta utile e correttamente ancorata.
