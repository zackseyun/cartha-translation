  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Οὐαί σοι, Χοραζίν· οὐαί σοι, Βηθσαϊδά· ὅτι εἰ ἐν Τύρῳ καὶ Σιδῶνι ἐγένοντο αἱ δυνάμεις αἱ γενόμεναι ἐν ὑμῖν, πάλαι ἂν ἐν σάκκῳ καὶ σποδῷ μετενόησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/021.yaml
  text: Woe to you[a], Chorazin! Woe to you, Bethsaida! For if the mighty works done among you had taken place in Tyre and Sidon, they would have repented long ago in sackcloth and ashes.
translation:
  language: it
  text: «Guai a te, Corazin! Guai a te, Betsaida! Perché, se a Tiro e Sidone fossero avvenute le opere potenti[a] compiute fra voi, già da molto tempo si sarebbero pentite in sacco e cenere.»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «miracoli»; il greco indica letteralmente «opere potenti» o «opere di potenza».
    reason: Segnala una valida alternativa lessicale per αἱ δυνάμεις e chiarisce il richiamo alla potenza insito nell'espressione greca.
lexical_decisions:
- source_word: Οὐαί σοι
  choice: Guai a te
  rationale: Conserva sia la denuncia profetica sia la sfumatura di lamento e di giudizio imminente, in una formula italiana naturale e tradizionalmente comprensibile.
- source_word: Χοραζίν
  choice: Corazin
  rationale: Adotta la forma italiana corrente del toponimo biblico.
- source_word: Βηθσαϊδά
  choice: Betsaida
  rationale: Adotta la forma italiana corrente del toponimo biblico.
- source_word: ὅτι
  choice: Perché
  rationale: Introduce la ragione della dichiarazione di sventura e rende in modo diretto il nesso esplicativo.
- source_word: εἰ ... ἂν ... μετενόησαν
  choice: se ... fossero state compiute ... si sarebbero ravvedute
  rationale: Riproduce il periodo ipotetico dell'irrealtà riferito al passato senza attenuare il valore controfattuale.
- source_word: αἱ δυνάμεις
  choice: le opere potenti
  rationale: Mantiene il riferimento alla potenza manifestata nelle azioni senza restringere necessariamente il significato alla sola categoria moderna dei miracoli.
- source_word: ἐγένοντο ... αἱ γενόμεναι
  choice: fossero state compiute ... compiute
  rationale: La ripetizione rende visibile il legame lessicale delle due forme di γίνομαι; in italiano «compiute» si accorda naturalmente con opere.
- source_word: ἐν ὑμῖν
  choice: fra voi
  rationale: Con il pronome plurale indica che le opere erano avvenute in mezzo agli abitanti delle città, non dentro di loro.
- source_word: πάλαι
  choice: già da tempo
  rationale: Esprime che il ravvedimento sarebbe avvenuto molto prima del momento presente.
- source_word: μετενόησαν
  choice: si sarebbero ravvedute
  rationale: «Ravvedersi» comunica in modo naturale il cambiamento interiore e concreto implicato dal verbo nel contesto profetico.
- source_word: ἐν σάκκῳ καὶ σποδῷ
  choice: vestite di sacco e cosparse di cenere
  rationale: Rende esplicita e comprensibile l'immagine culturale del lutto e del ravvedimento, conservandone entrambi gli elementi concreti.
theological_decisions:
- issue: Natura del confronto di Gesù con Tiro e Sidone
  choice: Una reale affermazione di maggiore colpevolezza per le città che hanno visto le opere potenti e non si sono ravvedute
  alternative: Una semplice iperbole retorica priva di un vero giudizio comparativo
  rationale: Il periodo controfattuale intensifica il giudizio su Corazin e Betsaida. La resa conserva il confronto morale senza aggiungere conclusioni dottrinali non espresse dal testo.
- issue: Personificazione delle città
  choice: Mantenere il femminile plurale «si sarebbero ravvedute» riferito a Tiro e Sidone
  alternative: Esplicitare «i loro abitanti si sarebbero ravveduti»
  rationale: Il greco continua a rivolgersi alle città come realtà collettive; la personificazione è intelligibile in italiano e non richiede l'aggiunta di un soggetto assente dal testo.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. La formulazione conserva il tono profetico, il periodo ipotetico controfattuale e l'immagine concreta del sacco e della cenere. Il marcatore della nota è collocato dopo l'espressione cui la nota si riferisce.
