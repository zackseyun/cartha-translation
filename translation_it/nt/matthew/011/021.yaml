    issue: Ripetizione immediata di «compiute»
    rationale: La duplicazione in «se ... fossero state compiute le opere potenti compiute fra voi» è grammaticalmente possibile, ma innaturale. Il greco ripete γίνομαι, ma una variazione italiana non ne altera il significato.
  - severity: low
    issue: Esplicitazione interpretativa dell'immagine di sacco e cenere
    rationale: «Vestite di sacco e cosparse di cenere» è compatibile con il contesto, ma il greco dice più sobriamente «in sacco e cenere». La formula italiana tradizionale conserva meglio la forma concisa e concreta del testo.
