  text: εἶπεν αὐτῷ· Σὺ εἶ ὁ ἐρχόμενος ἢ ἕτερον προσδοκῶμεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/003.yaml
  text: and said to him, “Are you the Coming One, or should we expect another?”
translation:
  language: it
  text: 'e gli disse: «Sei tu colui che deve venire[a], o dobbiamo aspettarne un altro?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «colui che viene» o «colui che verrà». L’espressione greca può avere valore di titolo messianico.
    reason: Alternativa lessicale e chiarimento della possibile forza titolare dell’espressione greca.
lexical_decisions:
- source_word: εἶπεν αὐτῷ
  choice: e gli disse
  rationale: «Disse» rende direttamente l’aoristo εἶπεν e «gli» esprime il pronome dativo αὐτῷ. La congiunzione «e» collega naturalmente la frase al contesto narrativo precedente, pur non essendo rappresentata da una parola distinta nel testo greco citato.
- source_word: Σὺ εἶ
  choice: Sei tu
  rationale: L’ordine italiano «Sei tu» forma una domanda naturale e conserva l’enfasi del pronome esplicito σύ.
- source_word: ὁ ἐρχόμενος
  choice: colui che deve venire
  rationale: Il participio presente articolato è sostantivato e, nel contesto, richiama la figura attesa. «Colui che deve venire» suona naturale e dignitoso in italiano e conserva la possibile forza titolare senza sostituirla esplicitamente con «Messia».
- source_word: ἢ
  choice: o
  rationale: Rende la congiunzione disgiuntiva che introduce l’alternativa.
- source_word: ἕτερον
  choice: un altro
  rationale: Esprime il senso di un’altra persona o di una persona diversa senza aggiungere ulteriori specificazioni.
- source_word: προσδοκῶμεν
  choice: dobbiamo aspettarne
  rationale: Nella domanda deliberativa, «dobbiamo» rende idiomaticamente il valore contestuale dell’indicativo presente; «aspettarne» unisce il verbo al riferimento personale «un altro» in modo naturale.
theological_decisions:
- issue: Forza messianica o titolare di ὁ ἐρχόμενος
  choice: colui che deve venire
  alternative: colui che viene; colui che verrà; l’Atteso
  rationale: L’articolo, il participio sostantivato e il contesto sostengono il riferimento alla figura messianica attesa. La formulazione scelta preserva tale richiamo senza esplicitare «Messia», che sarebbe più interpretativo, e la nota segnala la possibile resa più letterale.
translation_notes:
  register: Italiano moderno standard, naturale e dignitoso. La formulazione mantiene la concisione della domanda e l’enfasi su «tu», evitando sia un tecnicismo sia un’esplicitazione confessionale del titolo.
