  source_fidelity: La resa conserva accuratamente il genitivo assoluto («Mentre quelli se ne andavano»), l’inizio del discorso di Gesù, i destinatari plurali («alle folle») e il tema («di Giovanni»). Le due interrogative riproducono il valore retorico del greco. «Osservare» rende in modo lecito θεάσασθαι, con la sfumatura di andare a guardare; «una canna agitata dal vento» corrisponde bene a κάλαμον ὑπὸ ἀνέμου σαλευόμενον.
  naturalness: L’italiano è moderno, scorrevole e di registro appropriato al testo narrativo-discorsivo. «Mentre quelli se ne andavano» è naturale e lascia al contesto il referente, come il dimostrativo greco. La punteggiatura e la formulazione delle domande funzionano bene.
  terminology: «Gesù», «Giovanni», «folle», «deserto» e «canna» sono appropriati. La nota culturale presenta l’instabilità come un suggerimento dell’immagine, senza trasformarla in un’interpretazione dogmatica o in un’aggiunta al testo.
