  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Τούτων δὲ πορευομένων ἤρξατο ὁ Ἰησοῦς λέγειν τοῖς ὄχλοις περὶ Ἰωάννου· Τί ἐξήλθατε εἰς τὴν ἔρημον θεάσασθαι; κάλαμον ὑπὸ ἀνέμου σαλευόμενον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/007.yaml
  text: 'As these men were going away[b][a], Jesus began to speak to the crowds about John: “What did you go out into the wilderness to look at? A reed being shaken by the wind?”'
translation:
  language: it
  text: 'Mentre quelli se ne andavano, Gesù cominciò a parlare alle folle di Giovanni: «Che cosa siete andati a osservare nel deserto?[a] Una canna agitata dal vento?[b]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «Che cosa siete andati a vedere nel deserto?»'
    reason: lexical_alternative
  - marker: b
    text: L’immagine di una canna agitata dal vento suggerisce instabilità o incostanza; la domanda di Gesù presuppone una risposta negativa riguardo a Giovanni.
    reason: cultural_note
lexical_decisions:
- source_word: Τούτων δὲ πορευομένων
  choice: Mentre quelli se ne andavano
  rationale: Il genitivo assoluto esprime un’azione contemporanea. «Quelli» conserva il dimostrativo e rimanda, nel contesto immediato, ai discepoli di Giovanni; «se ne andavano» rende l’aspetto durativo del participio.
- source_word: ἤρξατο ... λέγειν
  choice: cominciò a parlare
  rationale: La costruzione ἄρχομαι con infinito indica l’inizio dell’azione; «parlare» è naturale nel contesto di un discorso rivolto alle folle.
- source_word: τοῖς ὄχλοις
  choice: alle folle
  rationale: Mantiene il plurale del greco con una formulazione corrente in italiano.
- source_word: περὶ Ἰωάννου
  choice: di Giovanni
  rationale: περί con il genitivo introduce qui l’argomento del discorso; «parlare di Giovanni» è idiomatico e preciso.
- source_word: Τί ἐξήλθατε εἰς τὴν ἔρημον θεάσασθαι;
  choice: Che cosa siete andati a osservare nel deserto?
  rationale: τί è reso come domanda sull’oggetto («che cosa»), non sul motivo. «Osservare» conserva la sfumatura di guardare con attenzione propria di θεάομαι; «deserto» è la resa naturale di ἔρημος in questo contesto.
- source_word: κάλαμον
  choice: una canna
  rationale: È il significato ordinario del termine e conserva il singolare dell’immagine retorica.
- source_word: ὑπὸ ἀνέμου σαλευόμενον
  choice: agitata dal vento
  rationale: Rende il participio passivo che modifica «canna» e mantiene l’immagine del movimento instabile causato dal vento.
theological_decisions:
- issue: Referente di Τούτων («quelli/costoro»)
  choice: «quelli», con referente lasciato al contesto immediato
  alternative: «quegli uomini» oppure «i discepoli di Giovanni»
  rationale: Il contesto identifica i discepoli di Giovanni, ma il greco usa soltanto un dimostrativo. La resa scelta evita di aggiungere un’identificazione esplicita nel testo pur restando chiara nel flusso narrativo.
- issue: Valore retorico della canna agitata dal vento
  choice: Conservare la domanda e spiegare in nota la probabile allusione all’instabilità
  alternative: Esplicitare nel testo che Giovanni non era incostante
  rationale: Il testo presenta un’immagine retorica senza formularne direttamente l’interpretazione. La traduzione ne preserva la tensione e affida alla nota il chiarimento, senza trasformare l’allusione in un’affermazione esplicita.
translation_notes:
  register: Italiano moderno, naturale e dignitoso. La sintassi segue da vicino il movimento del greco senza risultare artificiosa; le domande mantengono la forza retorica dell’originale.
