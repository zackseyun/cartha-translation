id: MAT.11.22
reference: Matthew 11:22
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: πλὴν λέγω ὑμῖν, Τύρῳ καὶ Σιδῶνι ἀνεκτότερον ἔσται ἐν ἡμέρᾳ κρίσεως ἢ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/022.yaml
  text: But I tell you[a], it will be more tolerable for Tyre and Sidon on the day of judgment than for you.
translation:
  language: it
  text: 'Ma io vi dico: nel giorno del giudizio sarà più sopportabile[a] per Tiro e Sidone che per voi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «più tollerabile».
    reason: Alternativa lessicale per ἀνεκτότερον; «tollerabile» è più formale, mentre «sopportabile» comunica più direttamente l'idea di ciò che si può patire.
lexical_decisions:
- source_word: πλὴν
  choice: Ma
  rationale: Introduce con naturalezza il netto contrasto con la denuncia precedente, conservando il valore avversativo del greco.
- source_word: λέγω ὑμῖν
  choice: io vi dico
  rationale: Mantiene la formula diretta e solenne di Gesù, compreso il pronome plurale ὑμῖν.
- source_word: Τύρῳ καὶ Σιδῶνι
  choice: per Tiro e Sidone
  rationale: Il dativo dipendente dal comparativo indica coloro per i quali il giudizio sarà più sopportabile; in italiano «per» rende chiaramente questa relazione.
- source_word: ἀνεκτότερον
  choice: più sopportabile
  rationale: Rende il comparativo con il senso di ciò che può essere sostenuto o patito, senza trasformarlo esplicitamente in «meno severo».
- source_word: ἔσται
  choice: sarà
  rationale: Conserva il futuro copulativo del greco in una costruzione impersonale naturale in italiano.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: nel giorno del giudizio
  rationale: Indica il momento del giudizio futuro con una formulazione italiana chiara e tradizionalmente comprensibile.
- source_word: κρίσεως
  choice: giudizio
  rationale: Mantiene il senso ampio dell'atto giudiziario, evitando di restringerlo al solo esito della condanna.
- source_word: ἢ ὑμῖν
  choice: che per voi
  rationale: Completa direttamente il paragone e conserva il plurale dell'appello ai destinatari.
theological_decisions:
- issue: Natura del giudizio futuro
  choice: nel giorno del giudizio
  alternative: in un giorno di giudizio
  rationale: Benché l'espressione greca sia priva di articolo, nel contesto matteano richiama il noto giudizio escatologico. L'articolo determinativo è idiomatico in italiano e non aggiunge dettagli dottrinali estranei al testo.
- issue: Forma e grado della pena nel giudizio
  choice: sarà più sopportabile per Tiro e Sidone
  alternative: Tiro e Sidone saranno trattate meno severamente
  rationale: La formulazione scelta preserva l'espressione comparativa e relativamente aperta del greco, senza specificare il meccanismo o la natura della differenza di giudizio.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. La sintassi conserva la struttura impersonale del greco e la sua tensione giudiziaria senza introdurre spiegazioni dottrinali.
