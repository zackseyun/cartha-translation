id: MAT.11.20
reference: Matthew 11:20
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Τότε ⸀ἤρξατο ὀνειδίζειν τὰς πόλεις ἐν αἷς ἐγένοντο αἱ πλεῖσται δυνάμεις αὐτοῦ, ὅτι οὐ μετενόησαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/020.yaml
  text: Then he began to reproach the cities in which most of his mighty works had been done[a], because they did not repent.
translation:
  language: it
  text: Allora cominciò a rimproverare le città nelle quali si era compiuta la maggior parte delle sue opere di potenza[a], perché non si pentirono.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O «miracoli» oppure «opere potenti» (greco: dynameis).'
    reason: Alternativa lessicale per δυνάμεις.
lexical_decisions:
- source_word: Τότε
  choice: Allora
  rationale: Segna in modo naturale e preciso il passaggio alla fase successiva del racconto.
- source_word: ἤρξατο ὀνειδίζειν
  choice: cominciò a rimproverare
  rationale: Conserva il valore ingressivo di ἤρξατο e rende ὀνειδίζειν senza accentuarlo fino a una condanna formale.
- source_word: τὰς πόλεις ἐν αἷς
  choice: le città nelle quali
  rationale: Resa trasparente della struttura greca, in un italiano dignitoso e comprensibile.
- source_word: ἐγένοντο αἱ πλεῖσται δυνάμεις αὐτοῦ
  choice: era avvenuta la maggior parte delle sue opere potenti
  rationale: Il singolare concorda con «la maggior parte»; «era avvenuta» presenta le opere come eventi già verificatisi, mentre «opere potenti» mantiene il nesso lessicale di δυνάμεις con la potenza.
- source_word: ὅτι οὐ μετενόησαν
  choice: perché non si erano ravvedute
  rationale: ὅτι introduce la causa del rimprovero; «ravvedersi» esprime qui la risposta morale e spirituale richiesta, e il trapassato segnala l'anteriorità rispetto al rimprovero.
theological_decisions:
- issue: Resa di δυνάμεις nel contesto delle azioni miracolose di Gesù
  choice: opere potenti
  alternative: miracoli; opere di potenza
  rationale: «Opere potenti» conserva l'accento del termine greco sulla potenza manifestata senza restringerlo alla sola categoria moderna di «miracoli».
- issue: Resa di μετενόησαν
  choice: non si erano ravvedute
  alternative: non si erano pentite; non avevano cambiato atteggiamento
  rationale: «Ravvedersi» conserva il peso morale e spirituale del verbo nel contesto, senza specificare oltre il testo la natura o i frutti del ravvedimento.
translation_notes:
  register: Italiano standard moderno, naturale e dignitoso. La costruzione mantiene la progressione narrativa e la relazione causale dell'originale; il referente delle forme femminili plurali è «le città», intese metonimicamente come i loro abitanti.
