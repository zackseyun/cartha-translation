base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/016.yaml
  text: But to what shall I compare this generation? It is like children sitting in the marketplaces[a], calling out to the others[b],
translation:
  language: it
  text: Ma a che cosa paragonerò questa generazione? È simile a bambini seduti nelle piazze del mercato[a], che si rivolgono agli altri[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «nei luoghi di mercato». Il greco ἀγοραῖς indica gli spazi pubblici in cui si teneva il mercato e la gente si radunava.'
    reason: lexical_alternative
  - marker: b
    text: 'Oppure: «rivolgendosi agli altri bambini». Il greco dice semplicemente «agli altri»; che si tratti di bambini è suggerito dal contesto della similitudine.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίνι
  choice: a chi
  rationale: Il dativo interrogativo indica il termine personale o figurato del paragone; in italiano «a chi» è naturale e conserva la formulazione diretta della domanda.
- source_word: δὲ
  choice: Ma
  rationale: Segna una lieve transizione con sfumatura contrastiva; «Ma» rende bene la svolta retorica senza accentuarla eccessivamente.
- source_word: ὁμοιώσω
  choice: paragonerò
  rationale: Il futuro indicativo è mantenuto e, nella domanda retorica, «paragonerò» suona dignitoso e naturale.
- source_word: γενεὰν ταύτην
  choice: questa generazione
  rationale: Riproduce l'espressione greca e mantiene aperto il riferimento alla generazione contemporanea intesa collettivamente.
- source_word: ὁμοία ἐστὶν
  choice: È simile a
  rationale: Resa diretta e corrente del predicato di somiglianza, senza appiattirlo sulla ripetizione del verbo «paragonare».
- source_word: παιδίοις
  choice: bambini
  rationale: Indica bambini senza richiedere in questo contesto un diminutivo italiano marcato.
- source_word: καθημένοις
  choice: seduti
  rationale: Rende con naturalezza il participio che descrive la postura dei bambini.
- source_word: ἐν ταῖς ἀγοραῖς
  choice: nelle piazze del mercato
  rationale: ἀγορά designa l'area pubblica adibita al mercato e alla vita comunitaria; la resa evita che «mercati» faccia pensare soprattutto a esercizi commerciali moderni.
- source_word: ἃ
  choice: che
  rationale: Il pronome relativo italiano concorda naturalmente per senso con «bambini» senza dover riprodurre il genere neutro greco.
- source_word: προσφωνοῦντα
  choice: chiamano
  rationale: Esprime l'atto di rivolgersi ad alta voce agli altri; il presente italiano conserva la vivacità della scena.
- source_word: τοῖς ἑτέροις
  choice: gli altri
  rationale: Mantiene l'indeterminatezza del greco, nel quale l'identità degli «altri» è ricavata dal contesto della similitudine.
