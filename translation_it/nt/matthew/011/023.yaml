id: MAT.11.23
reference: Matthew 11:23
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: καὶ σύ, Καφαρναούμ, ⸂μὴ ἕως οὐρανοῦ ὑψωθήσῃ⸃; ἕως ᾅδου ⸀καταβήσῃ· ὅτι εἰ ἐν Σοδόμοις ⸀ἐγενήθησαν αἱ δυνάμεις αἱ γενόμεναι ἐν σοί, ⸀ἔμεινεν ἂν μέχρι τῆς σήμερον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/023.yaml
  text: And you[a], Capernaum, will you be exalted to heaven? You will go down to Hades. For if the mighty works done in you had happened in Sodom, it would have remained until today.
translation:
  language: it
  text: E tu, Cafarnao, sarai forse innalzata fino al cielo? Fino all’Ades scenderai![a] Infatti, se a Sodoma fossero state compiute le opere potenti compiute in te, sarebbe rimasta fino a oggi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oppure «nel regno dei morti». In greco Ades, non Geenna.
    reason: Alternativa lessicale e distinzione terminologica teologicamente rilevante.
lexical_decisions:
- source_word: Καφαρναούμ
  choice: Cafarnao
  rationale: Si adotta la forma italiana tradizionale e tuttora corrente del toponimo biblico.
- source_word: μὴ ἕως οὐρανοῦ ὑψωθήσῃ;
  choice: sarai forse innalzata fino al cielo?
  rationale: μή con il futuro passivo è reso come domanda retorica che attende risposta negativa. «Innalzata» conserva sia l’immagine verticale sia la possibile sfumatura di esaltazione; il femminile concorda con la città personificata.
- source_word: ἕως ᾅδου καταβήσῃ
  choice: Fino all’Ades scenderai
  rationale: «Scenderai» rende direttamente καταβήσῃ, mentre «Ades» traslittera ᾅδης e non lo confonde con la Geenna.
- source_word: δυνάμεις
  choice: opere potenti
  rationale: L’espressione conserva tanto l’idea di azioni concrete quanto quella della potenza che in esse si manifesta, senza restringere il termine al moderno concetto di miracolo.
- source_word: γενόμεναι ἐν σοί
  choice: compiute in te
  rationale: La formulazione rende il participio riferito alle opere potenti e mantiene l’indirizzo personale alla città.
- source_word: ἐγενήθησαν
  choice: fossero state compiute
  rationale: Il congiuntivo trapassato italiano esprime adeguatamente la protasi irreale del passato; il passivo si accorda naturalmente con «opere potenti».
- source_word: ἔμεινεν ἂν
  choice: sarebbe rimasta
  rationale: Il condizionale passato rende l’apodosi irreale; il singolare femminile ha come referente Sodoma, intesa come città.
- source_word: μέχρι τῆς σήμερον
  choice: fino a oggi
  rationale: È una resa diretta, chiara e idiomatica dell’espressione temporale greca.
theological_decisions:
- issue: Resa di ᾅδης
  choice: Ades
  alternative: regno dei morti; inferno
  rationale: «Ades» preserva il termine greco e la sua distinzione dalla Geenna, evitando di introdurre nella traduzione principale associazioni dottrinali più specifiche implicate da «inferno». La nota offre l’equivalente esplicativo.
- issue: Forza di μή nella prima proposizione
  choice: 'domanda retorica: «sarai forse innalzata…?»'
  alternative: 'affermazione negativa: «non sarai innalzata…»'
  rationale: La costruzione con μή è ben intesa come domanda che attende risposta negativa. La resa interrogativa conserva la forma e la tensione retorica del testo senza trasformarla in un’affermazione esplicita.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. La struttura antitetica «fino al cielo / fino all’Ades» è mantenuta; la ripetizione di «compiute» rispecchia deliberatamente il legame tra le due forme di γίνομαι nel testo greco.
