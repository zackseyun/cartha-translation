id: MAT.11.29
reference: Matthew 11:29
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ἄρατε τὸν ζυγόν μου ἐφ’ ὑμᾶς καὶ μάθετε ἀπ’ ἐμοῦ, ὅτι πραΰς εἰμι καὶ ταπεινὸς τῇ καρδίᾳ, καὶ εὑρήσετε ἀνάπαυσιν ταῖς ψυχαῖς ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/029.yaml
  text: Take my yoke upon you and learn from me[a], because I am gentle and humble in heart, and you will find rest for your souls.
translation:
  language: it
  text: Prendete su di voi il mio giogo e imparate da me, perché sono mite e umile di cuore, e troverete riposo per le vostre anime.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄρατε
  choice: Prendete
  rationale: L’aoristo imperativo plurale di αἴρω, nell’espressione con «giogo», invita ad assumere volontariamente il giogo; «prendete su di voi» è naturale in italiano e conserva l’immagine concreta.
- source_word: τὸν ζυγόν μου ἐφ’ ὑμᾶς
  choice: su di voi il mio giogo
  rationale: «Giogo» mantiene la metafora centrale della sottomissione a un insegnamento o a un’autorità; «su di voi» rende ἐπί con l’accusativo senza appiattire l’immagine.
- source_word: μάθετε ἀπ’ ἐμοῦ
  choice: imparate da me
  rationale: Resa diretta e corrente dell’imperativo con ἀπό, capace di esprimere sia l’apprendimento sia il rapporto del discepolo con il maestro.
- source_word: ὅτι
  choice: perché
  rationale: Qui introduce la ragione per cui Gesù può essere seguito come maestro; «perché» esprime chiaramente il valore esplicativo.
- source_word: πραΰς
  choice: mite
  rationale: «Mite» comunica dolcezza e assenza di durezza senza implicare debolezza ed è una resa italiana dignitosa e consolidata.
- source_word: ταπεινὸς τῇ καρδίᾳ
  choice: umile di cuore
  rationale: Conserva l’aggettivo ταπεινός e presenta il cuore come sede della disposizione interiore; la formula è naturale e ben comprensibile in italiano.
- source_word: εὑρήσετε
  choice: troverete
  rationale: Il futuro indicativo è reso direttamente, mantenendo la forma della promessa.
- source_word: ἀνάπαυσιν
  choice: riposo
  rationale: È la resa più diretta e conserva la risonanza biblica del riposo, senza restringere il senso a semplice sollievo momentaneo.
- source_word: ταῖς ψυχαῖς ὑμῶν
  choice: per le vostre anime
  rationale: Il dativo è reso idiomaticamente con «per»; «anime» conserva il linguaggio biblico e il riferimento alla vita interiore o alla persona nella sua profondità.
theological_decisions:
- issue: Autodescrizione di Gesù in πραΰς ... καὶ ταπεινὸς τῇ καρδίᾳ
  choice: sono mite e umile di cuore
  alternative: sono mansueto e basso di cuore
  rationale: La formulazione conserva l’autodescrizione personale di Gesù e la tensione tra la sua autorità e la sua mitezza. «Mite» e «umile di cuore» risultano attuali e dignitosi; «basso di cuore» sarebbe troppo letterale e poco naturale nell’italiano moderno.
translation_notes:
  register: Italiano standard moderno, chiaro e dignitoso. La metafora del giogo e il termine «anime» sono mantenuti per il loro peso biblico; la sintassi segue da vicino il greco senza risultare artificiosa.
