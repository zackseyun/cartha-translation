id: MAT.11.8
reference: Matthew 11:8
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ἀλλὰ τί ἐξήλθατε ἰδεῖν; ἄνθρωπον ἐν ⸀μαλακοῖς ἠμφιεσμένον; ἰδοὺ οἱ τὰ μαλακὰ φοροῦντες ἐν τοῖς οἴκοις τῶν ⸀βασιλέων ⸀εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/008.yaml
  text: But what did you go out to see? A man dressed in soft clothes? Look[b][a], those who wear soft clothes are in the houses of kings.
translation:
  language: it
  text: Ma che cosa siete andati a vedere? Un uomo vestito di abiti raffinati?[a] Ecco, quelli che indossano abiti raffinati stanno nei palazzi dei re.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Letteralmente «vestito di cose morbide», cioè con abiti delicati o lussuosi.
    reason: lexical_alternative
  - marker: b
    text: Letteralmente «nelle case dei re».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ma
  rationale: Introduce con naturalezza il nuovo contrasto nella serie di domande retoriche di Gesù.
- source_word: τί ἐξήλθατε ἰδεῖν
  choice: che cosa siete andati a vedere
  rationale: Rende direttamente τί e conserva l'espressione di scopo formata da ἐξήλθατε con l'infinito ἰδεῖν.
- source_word: ἄνθρωπον
  choice: un uomo
  rationale: Mantiene il singolare maschile e il riferimento immediato a Giovanni.
- source_word: ἐν μαλακοῖς ἠμφιεσμένον
  choice: vestito di abiti raffinati
  rationale: Il greco dice letteralmente «vestito di cose morbide»; in italiano «abiti raffinati» comunica in modo naturale il senso contestuale di vesti delicate e lussuose, mentre la nota conserva l'immagine letterale.
- source_word: ἰδοὺ
  choice: Ecco
  rationale: È un richiamo enfatico corrente e dignitoso, adatto alla forza retorica della particella.
- source_word: οἱ τὰ μαλακὰ φοροῦντες
  choice: quelli che indossano abiti raffinati
  rationale: φοροῦντες indica l'uso abituale; la ripetizione di «abiti raffinati» mantiene la coesione lessicale con la domanda precedente.
- source_word: ἐν τοῖς οἴκοις τῶν βασιλέων εἰσίν
  choice: stanno nei palazzi dei re
  rationale: «Palazzi dei re» esprime in italiano naturale il referente di «case dei re» senza eliminare il plurale βασιλέων; la resa più letterale è documentata in nota.
theological_decisions: []
