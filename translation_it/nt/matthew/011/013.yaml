  variant: modern standard Italian
source:
  edition: SBLGNT
  text: πάντες γὰρ οἱ προφῆται καὶ ὁ νόμος ἕως Ἰωάννου ἐπροφήτευσαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/013.yaml
  text: For all the prophets and the Law prophesied until John[a].
translation:
  language: it
  text: Infatti tutti i profeti e la Legge hanno profetizzato fino a Giovanni[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «sino a Giovanni» oppure «fino al tempo di Giovanni». L’espressione può presentare Giovanni come il culmine della testimonianza profetica o come il confine che ne segna la transizione.
    reason: L’espressione greca conserva un’ambiguità reale circa il rapporto di Giovanni con il limite temporale indicato.
lexical_decisions:
- source_word: πάντες
  choice: tutti
  rationale: Con οἱ προφῆται indica collettivamente l’intero gruppo dei profeti; «tutti» è la resa italiana più naturale.
- source_word: γὰρ
  choice: infatti
  rationale: Introduce la spiegazione di quanto precede. «Infatti» conserva il valore esplicativo in un italiano naturale.
- source_word: οἱ προφῆται
  choice: i profeti
  rationale: È la resa corrente per coloro che parlano profeticamente da parte di Dio.
- source_word: ὁ νόμος
  choice: la Legge
  rationale: La maiuscola segnala il riferimento alla Torah, intesa come corpus riconosciuto delle Scritture d’Israele, e non a una legge generica.
- source_word: ἕως Ἰωάννου
  choice: fino a Giovanni
  rationale: ἕως con il genitivo indica un limite temporale. La formulazione concisa conserva l’ambiguità circa l’inclusione di Giovanni come culmine della testimonianza profetica o come confine di una transizione.
- source_word: ἐπροφήτευσαν
  choice: hanno profetizzato
  rationale: Resa diretta dell’aoristo attivo. Riferito sia ai profeti sia alla Legge, mantiene la personificazione per cui anche la Legge rende testimonianza profetica.
theological_decisions:
- issue: Se ὁ νόμος debba essere inteso genericamente o come titolo scritturale
  choice: la Legge
  alternative: la legge
  rationale: Il contesto richiama la testimonianza riconosciuta delle Scritture d’Israele, «i profeti e la Legge», non un principio giuridico generico. La maiuscola chiarisce il referente senza aggiungere contenuto.
- issue: Se ἕως Ἰωάννου includa Giovanni nell’epoca profetica oppure ne indichi soltanto il limite
  choice: fino a Giovanni
  alternative: fino al tempo di Giovanni
  rationale: Il greco non risolve completamente la questione. La traduzione conserva il linguaggio del limite temporale senza imporre un’interpretazione teologica.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. «Infatti» rende in modo naturale il nesso esplicativo; «hanno profetizzato» conserva la formulazione forte e personificante dell’originale.
