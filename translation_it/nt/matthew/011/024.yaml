  variant: modern standard Italian
source:
  edition: SBLGNT
  text: πλὴν λέγω ὑμῖν ὅτι γῇ Σοδόμων ἀνεκτότερον ἔσται ἐν ἡμέρᾳ κρίσεως ἢ σοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/024.yaml
  text: But I tell you that it will be more tolerable for the land of Sodom on the day of judgment than for you[a].
translation:
  language: it
  text: Ma vi dico che, nel giorno del giudizio, sarà più tollerabile per la terra di Sodoma che per te[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «più sopportabile».
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Ma
  rationale: Introduce con naturalezza il forte contrasto con quanto precede, senza appesantire la frase.
- source_word: λέγω ὑμῖν
  choice: io ti dico
  rationale: Nel contesto ὑμῖν si riferisce agli interlocutori, ma il discorso converge sulla città apostrofata al singolare in σοί; l'italiano rende coerentemente l'indirizzo diretto alla città personificata.
- source_word: γῇ Σοδόμων
  choice: della terra di Sodoma
  rationale: Conserva il riferimento esplicito alla γῆ, cioè alla terra o regione associata a Sodoma.
- source_word: ἀνεκτότερον
  choice: più tollerabile
  rationale: Rende direttamente il comparativo di ἀνεκτός nel contesto del giudizio; «più sopportabile» resta una valida alternativa.
- source_word: ἔσται
  choice: sarà
  rationale: Rende in modo naturale il futuro della copula.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: nel giorno del giudizio
  rationale: Riproduce la locuzione temporale ed escatologica senza trasformarla in una formula più libera.
- source_word: ἢ σοί
  choice: della tua
  rationale: La costruzione «la sorte... sarà più tollerabile della tua» rende idiomaticamente il confronto e mantiene il singolare riferito alla città personificata.
theological_decisions:
- issue: Referente del singolare σοί
  choice: Mantenere il riferimento singolare alla città personificata mediante «della tua».
  alternative: Esplicitare «che per voi» o «che per la vostra città».
  rationale: Il greco usa il singolare e prosegue l'apostrofe profetica alla città; non si amplia il referente né si attenua la forza retorica.
- issue: Natura comparativa del giudizio
  choice: Conservare l'affermazione comparativa senza spiegare gradi, modalità o durata della pena.
  alternative: Parafrasare il versetto come insegnamento esplicito su differenti gradi di castigo.
  rationale: Il testo afferma soltanto che la condizione di Sodoma sarà relativamente più tollerabile; ulteriori precisazioni sarebbero interpretative.
translation_notes:
  register: Italiano standard moderno, dignitoso e leggibile. L'espressione «la sorte... sarà più tollerabile» evita l'italiano poco naturale «sarà più tollerabile per la terra» e rende esplicito solo il minimo elemento implicito necessario al confronto. Il singolare conserva l'apostrofe alla città nel contesto.
