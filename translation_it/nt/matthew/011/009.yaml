  text: ἀλλὰ τί ἐξήλθατε⸂; προφήτην ἰδεῖν⸃; ναί, λέγω ὑμῖν, καὶ περισσότερον προφήτου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/009.yaml
  text: But what did you go out to see? A prophet? Yes[a], I tell you, and more than a prophet.
translation:
  language: it
  text: Ma che cosa siete andati a vedere? Un profeta? Sì, vi dico, e più che un profeta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: «uno superiore a un profeta». Il greco dice più letteralmente: «più che un profeta».'
    reason: Alternativa lessicale che esplicita il referente sottinteso del comparativo greco.
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ma
  rationale: Introduce il contrasto con la precedente domanda retorica in modo naturale e fedele.
- source_word: τί ἐξήλθατε
  choice: che cosa siete andati
  rationale: τί è accusativo e indica ciò che essi erano andati a vedere, non semplicemente il motivo per cui erano usciti.
- source_word: ἰδεῖν
  choice: a vedere
  rationale: L’infinito esprime lo scopo dell’andare ed è reso con la normale costruzione italiana.
- source_word: προφήτην
  choice: un profeta
  rationale: Il sostantivo singolare senza articolo ha qui valore naturalmente indefinito.
- source_word: ναί
  choice: Sì
  rationale: Risposta affermativa diretta alla domanda retorica, semplice e idiomatica.
- source_word: λέγω ὑμῖν
  choice: vi dico
  rationale: Rende in modo corrente e dignitoso la formula discorsiva greca.
- source_word: καὶ περισσότερον προφήτου
  choice: e più che un profeta
  rationale: Conserva da vicino il comparativo con il genitivo senza aggiungere un soggetto esplicito o precisare in che senso Giovanni sia di più.
theological_decisions:
- issue: Identità e posizione di Giovanni il Battista nel detto di Gesù
  choice: più che un profeta
  alternative: uno superiore a un profeta
  rationale: La formulazione innalza Giovanni oltre la categoria di profeta, ma non specifica qui in quale senso; la resa scelta conserva tale tensione senza introdurre una spiegazione dottrinale.
translation_notes:
  register: Italiano standard moderno, chiaro e dignitoso. La sequenza di domande retoriche è mantenuta; l’ellissi finale conserva la concisione e l’ambiguità controllata dell’originale.
