  text: καὶ μακάριός ἐστιν ὃς ⸀ἐὰν μὴ σκανδαλισθῇ ἐν ἐμοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/006.yaml
  text: And blessed is the one who is not offended by me[a].
translation:
  language: it
  text: E beato chi non trova in me motivo d’inciampo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «non si scandalizza di me»; oppure «non inciampa a causa mia».
    reason: Alternative lessicali che rendono rispettivamente il possibile senso di prendere motivo di scandalo e l’immagine verbale dell’inciampare.
lexical_decisions:
- source_word: καί
  choice: E
  rationale: Mantiene il collegamento diretto con le parole precedenti.
- source_word: μακάριος
  choice: beato
  rationale: È la resa italiana tradizionale e naturale delle dichiarazioni di beatitudine e conserva il valore religioso del termine.
- source_word: ὃς ἐὰν μὴ
  choice: chi non
  rationale: Esprime in italiano corrente la persona indefinita e la condizione generale contenute nella costruzione greca, senza appesantire la frase.
- source_word: σκανδαλισθῇ
  choice: non trova … motivo d’inciampo
  rationale: Conserva l’immagine concreta dell’ostacolo che può far vacillare o cadere, evitando di ridurre il verbo alla sola reazione emotiva dell’offendersi.
- source_word: ἐν ἐμοί
  choice: in me
  rationale: Presenta Gesù come la persona in rapporto alla quale può sorgere l’inciampo, mantenendo da vicino la formulazione greca.
theological_decisions:
- issue: Forza metaforica di σκανδαλισθῇ in rapporto a Gesù
  choice: non trova in me motivo d’inciampo
  alternative: non si scandalizza di me
  rationale: La formulazione principale conserva la tensione tra fede e caduta davanti a Gesù, senza limitare il senso allo shock o all’offesa. La resa più letteralmente affine al verbo italiano «scandalizzarsi» è segnalata in nota.
translation_notes:
  register: Italiano moderno, sobrio e dignitoso. «Beato» mantiene il tono delle beatitudini; «motivo d’inciampo» è comprensibile e preserva l’immagine teologica senza introdurre una specifica lettura confessionale.
