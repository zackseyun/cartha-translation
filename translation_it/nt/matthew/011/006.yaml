  verdict: approve
  source_fidelity: «E beato chi non trova in me motivo d’inciampo» rende con accuratezza la beatitudine (μακάριος), il referente indefinito (ὃς ἐὰν μὴ) e il valore relazionale di ἐν ἐμοί. «Motivo d’inciampo» esprime in modo contestualmente appropriato lo σκανδαλισθῇ passivo, cioè l’essere indotti a vacillare o a cadere a motivo di Gesù, senza ridurlo al solo sentirsi offesi.
  naturalness: La frase è sobria, scorrevole e adatta al registro biblico italiano contemporaneo. «Beato» e «motivo d’inciampo» sono formulazioni comprensibili e dignitose, con una tonalità tradizionale non arcaizzante.
  terminology: La scelta di «beato» è appropriata per μακάριος. «Inciampo» conserva l’immagine metaforica del greco; la nota registra utilmente «scandalizzarsi», termine italiano biblico pertinente ma oggi potenzialmente più ristretto al senso di offesa.
