  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ⸀οὗτός ἐστιν περὶ οὗ γέγραπται· Ἰδοὺ ἐγὼ ἀποστέλλω τὸν ἄγγελόν μου πρὸ προσώπου σου, ὃς κατασκευάσει τὴν ὁδόν σου ἔμπροσθέν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/010.yaml
  text: 'This is he about whom it is written: ‘Behold[a], I am sending my messenger before your face, who will prepare your way before you.’'
translation:
  language: it
  text: 'È di lui che sta scritto: «Ecco, io mando il mio messaggero davanti al tuo volto[a]; egli preparerà la tua via davanti a te».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Più idiomaticamente: «davanti a te». Il greco conserva nella citazione l’espressione concreta «davanti al tuo volto».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός
  choice: Egli è colui
  rationale: Rende l’identificazione enfatica del dimostrativo greco in un italiano dignitoso e comprensibile, senza aggiungere l’esplicito «quest’uomo».
- source_word: περὶ οὗ
  choice: del quale
  rationale: Nel costrutto italiano «colui del quale sta scritto» esprime naturalmente il valore di περί con il genitivo, cioè «riguardo al quale».
- source_word: γέγραπται
  choice: sta scritto
  rationale: Formula italiana consolidata per una citazione autorevole della Scrittura; conserva il valore risultativo del perfetto greco.
- source_word: Ἰδοὺ
  choice: Ecco
  rationale: Mantiene la forza presentativa e il tono profetico della citazione, risultando più naturale in italiano moderno di «Guarda».
- source_word: ἀποστέλλω
  choice: mando
  rationale: Il presente italiano conserva il presente vivido della citazione e può assumere naturalmente valore imminente o futuro.
- source_word: ἄγγελόν
  choice: messaggero
  rationale: Il referente contestuale è Giovanni il Battista, un inviato umano; «messaggero» conserva il senso appropriato di ἄγγελος senza suggerire necessariamente un essere celeste.
- source_word: πρὸ προσώπου σου
  choice: davanti al tuo volto
  rationale: Conserva l’immagine concreta dell’espressione greca e la forma marcata della citazione scritturale; una nota segnala l’equivalente italiano più idiomatico.
- source_word: κατασκευάσει
  choice: preparerà
  rationale: Rende direttamente il futuro e il senso di predisporre o rendere pronta la via.
- source_word: τὴν ὁδόν σου
  choice: la tua via
  rationale: «Via» mantiene sia l’immagine concreta del cammino sia la sua risonanza metaforica e profetica.
- source_word: ἔμπροσθέν σου
  choice: davanti a te
  rationale: È l’equivalente italiano naturale della locuzione e mantiene la seconda espressione spaziale distinta dalla prima.
theological_decisions:
- issue: Ripetizione delle due espressioni spaziali nella citazione scritturale
  choice: 'Mantenute entrambe: «davanti al tuo volto» e «davanti a te»'
  alternative: Uniformare o condensare in una sola espressione, per esempio «davanti a te» o «innanzi a te»
  rationale: Il greco presenta sia πρὸ προσώπου σου sia ἔμπροσθέν σου. Mantenerle entrambe conserva il parallelismo enfatico e la tessitura formale della citazione senza appianarla.
translation_notes:
  register: Italiano moderno, dignitoso e di tono scritturale. «Sta scritto» ed «Ecco» mantengono il registro solenne senza risultare arcaici; «davanti al tuo volto» è volutamente più concreto e marcato, con chiarimento in nota.
