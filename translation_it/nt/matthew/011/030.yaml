  text: ὁ γὰρ ζυγός μου χρηστὸς καὶ τὸ φορτίον μου ἐλαφρόν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/030.yaml
  text: For my yoke is kind, and my burden is light.
translation:
  language: it
  text: Il mio giogo, infatti, è buono[a] e il mio carico è leggero.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «benevolo», «dolce», «agevole» o «adatto»; il termine greco descrive qualcosa di benigno e non aspro o gravoso.'
    reason: χρηστός ha una gamma semantica più ampia di qualsiasi singolo equivalente italiano; la nota conserva l'ambiguità genuina.
lexical_decisions:
- source_word: γὰρ
  choice: infatti
  rationale: Mantiene il nesso esplicativo con l'invito e la promessa del versetto precedente.
- source_word: ζυγός
  choice: giogo
  rationale: È l'equivalente italiano tradizionale e concreto, e conserva la metafora di ciò che si porta sotto l'autorità di qualcuno.
- source_word: χρηστός
  choice: benevolo
  rationale: Il termine può significare buono, benigno, gentile, adatto o agevole. «Benevolo» conserva qui la qualità positiva attribuita al giogo senza ridurla alla sola facilità, e riflette l'inglese POB «kind».
- source_word: φορτίον
  choice: carico
  rationale: Rende naturalmente ciò che viene portato e mantiene il parallelismo con «giogo».
- source_word: ἐλαφρόν
  choice: leggero
  rationale: Equivalente diretto che conserva il contrasto implicito con un peso gravoso.
theological_decisions:
- issue: Natura del giogo di Gesù
  choice: «benevolo»
  alternative: «facile» / «dolce»
  rationale: «Facile» potrebbe risolvere χρηστός esclusivamente in termini di assenza di difficoltà; «dolce» è possibile e tradizionale, ma nell'italiano corrente può risultare meno trasparente. «Benevolo» preserva l'idea della bontà del giogo senza implicare che il discepolato sia privo di esigenze.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. La struttura mantiene il parallelismo dell'originale; «infatti» è collocato dopo il primo sintagma per una sintassi italiana naturale.
