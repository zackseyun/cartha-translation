source:
  edition: SBLGNT
  text: ἦλθεν ὁ υἱὸς τοῦ ἀνθρώπου ἐσθίων καὶ πίνων, καὶ λέγουσιν· Ἰδοὺ ἄνθρωπος φάγος καὶ οἰνοπότης, τελωνῶν φίλος καὶ ἁμαρτωλῶν. καὶ ἐδικαιώθη ἡ σοφία ἀπὸ τῶν ⸀ἔργων αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/019.yaml
  text: The Son of Man came eating and drinking[a], and they say, ‘Look, a glutton and a drunkard[b], a friend of tax collectors and sinners!’ And wisdom was justified by her works.
translation:
  language: it
  text: 'Il Figlio dell’uomo è venuto mangiando e bevendo, e dicono: «Ecco un mangione e un beone, amico degli esattori delle tasse e dei peccatori!». E la sapienza è stata riconosciuta giusta[a] dalle sue opere[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: «è stata giustificata» oppure «è stata rivendicata».'
    reason: 'Alternativa lessicale per ἐδικαιώθη: la resa principale esprime il senso contestuale di essere dimostrata nel giusto; le alternative conservano rispettivamente una formulazione più letterale e una resa idiomatica di «vindicata».'
  - marker: b
    text: 'Alcuni manoscritti hanno «figli» invece di «opere»: «la sapienza è stata riconosciuta giusta dai suoi figli».'
    reason: Variante testuale di rilievo, attestata anche nella formulazione parallela di Luca 7:35.
lexical_decisions:
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: il Figlio dell’uomo
  rationale: Mantiene il titolo tradizionale e il suo retroterra semitico, senza scioglierne la portata cristologica con una parafrasi.
- source_word: ἐσθίων καὶ πίνων
  choice: mangiando e bevendo
  rationale: Riproduce direttamente i participi e conserva il contrasto contestuale con la condotta ascetica di Giovanni, senza accentuarli come banchettare.
- source_word: Ἰδοὺ
  choice: Ecco
  rationale: Equivalente italiano moderno e naturale che conserva la forza esclamativa dell’accusa.
- source_word: φάγος
  choice: un mangione
  rationale: Rende in modo idiomatico e chiaramente spregiativo l’accusa di mangiare smodatamente.
- source_word: οἰνοπότης
  choice: un beone
  rationale: Conserva il valore ingiurioso del termine, che implica abuso del vino e non il semplice fatto di berlo.
- source_word: τελωνῶν φίλος καὶ ἁμαρτωλῶν
  choice: amico degli esattori delle tasse e dei peccatori
  rationale: Rende esplicita per il lettore moderno la funzione dei τελῶναι e conserva l’etichetta socio-religiosa «peccatori».
- source_word: ἐδικαιώθη
  choice: è stata riconosciuta giusta
  rationale: Nel contesto significa che la sapienza è dimostrata o riconosciuta nel giusto; la formulazione è naturale in italiano e conserva il nesso con la giustizia meglio del solo «rivendicata».
- source_word: ἡ σοφία
  choice: la sapienza
  rationale: Mantiene senza espansioni interpretative la personificazione femminile presente nel greco.
- source_word: ἀπὸ τῶν ἔργων αὐτῆς
  choice: in base alle sue opere
  rationale: Esprime naturalmente il valore probatorio di ἀπό con il genitivo e segue la lezione ἔργων del testo fonte.
theological_decisions:
- issue: Identità della «sapienza» nella clausola conclusiva
  choice: Conservare la personificazione «la sapienza» senza identificarla esplicitamente.
  alternative: Identificarla con Gesù oppure con la sapienza e il piano salvifico di Dio.
  rationale: Il detto non precisa l’identità della sapienza; mantenerne la formulazione preserva l’ambiguità e la tensione teologica del testo.
- issue: Forma testuale della clausola finale
  choice: Seguire nel testo principale la lezione ἔργων, «opere».
  alternative: La variante τέκνων, «figli».
  rationale: Il testo SBLGNT fornito legge ἔργων; la variante nota viene segnalata in nota senza sostituire il testo fonte.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. «Esattori delle tasse» è preferito al più tradizionale ma oggi meno trasparente «pubblicani». «Mangione e beone» conserva il tono tagliente dell’accusa senza ricorrere a vocaboli arcaici. La coordinazione iniziale e finale con «e» rispecchia i καί greci senza introdurre un contrasto non espresso.
