  text: ⸀λέγουσιν· Ηὐλήσαμεν ὑμῖν καὶ οὐκ ὠρχήσασθε· ⸀ἐθρηνήσαμεν καὶ οὐκ ἐκόψασθε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/017.yaml
  text: They say[a], ‘We played the flute for you, and you did not dance; we sang a lament[c][b], and you did not mourn.’
translation:
  language: it
  text: 'Dicono: «Abbiamo suonato il flauto per voi, e non avete danzato; abbiamo intonato un canto funebre[a], e non vi siete battuti il petto[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «abbiamo fatto lamento»; il verbo greco indica un lamento, in particolare di carattere funebre.
    reason: lexical_alternative
  - marker: b
    text: Batersi il petto era un gesto consueto di dolore e di lutto.
    reason: cultural_note
lexical_decisions:
- source_word: λέγουσιν
  choice: Dicono
  rationale: Il presente greco introduce vividamente le parole dei bambini; il presente italiano ne conserva la forza narrativa.
- source_word: Ηὐλήσαμεν
  choice: Abbiamo suonato il flauto
  rationale: Il verbo αὐλέω indica specificamente il suonare un flauto o uno strumento a canna; questa resa è chiara e precisa nell’italiano moderno.
- source_word: ὑμῖν
  choice: per voi
  rationale: Esprime in modo idiomatico che l’esecuzione musicale era rivolta agli altri bambini.
- source_word: ὠρχήσασθε
  choice: avete danzato
  rationale: La forma media è resa naturalmente con il verbo italiano semplice, senza introdurre una sfumatura riflessiva non necessaria.
- source_word: ἐθρηνήσαμεν
  choice: abbiamo intonato un canto funebre
  rationale: Il verbo designa il lamento, spesso in forma di canto funebre; «intonato» mantiene il parallelismo performativo con il suono del flauto.
- source_word: ἐκόψασθε
  choice: non vi siete battuti il petto
  rationale: Nel contesto del lutto, il verbo medio richiama il gesto concreto di percuotersi in segno di dolore. La resa conserva l’immagine greca senza ridurla al generico «fare cordoglio».
theological_decisions: []
translation_notes:
  register: Italiano moderno, naturale e dignitoso. Il parallelismo tra una musica festosa e un canto funebre è mantenuto, così come il gesto concreto del lutto espresso dal greco.
