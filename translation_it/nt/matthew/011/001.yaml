id: MAT.11.1
reference: Matthew 11:1
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὅτε ἐτέλεσεν ὁ Ἰησοῦς διατάσσων τοῖς δώδεκα μαθηταῖς αὐτοῦ, μετέβη ἐκεῖθεν τοῦ διδάσκειν καὶ κηρύσσειν ἐν ταῖς πόλεσιν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/001.yaml
  text: And when Jesus had finished instructing his twelve disciples[b][a], he went on from there to teach and preach in their cities.
translation:
  language: it
  text: E quando Gesù ebbe finito di impartire istruzioni ai suoi dodici discepoli[a], partì di là per insegnare e predicare nelle loro città[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «di dare ordini ai suoi dodici discepoli».
    reason: lexical_alternative
  - marker: b
    text: 'In greco l''espressione «nelle loro città» è ambigua: può riferirsi alle città dei discepoli oppure, più in generale, ai centri abitati della popolazione circostante.'
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε
  choice: Quando
  rationale: La formula narrativa semitizzante introduce qui la circostanza temporale. «Quando» ne comunica con naturalezza la funzione di raccordo senza l'italiano più pesante «E avvenne che, quando».
- source_word: ἐτέλεσεν
  choice: ebbe finito
  rationale: Il trapassato remoto esprime in modo idiomatico il compimento dell'azione prima della successiva partenza di Gesù.
- source_word: διατάσσων
  choice: di impartire istruzioni
  rationale: Il participio indica direttive autorevoli date ai Dodici. «Impartire istruzioni» si adatta al contesto del mandato e conserva l'autorevolezza senza restringere il senso a ordini di carattere militare; «dare ordini» resta un'alternativa lessicale esplicitata in nota.
- source_word: τοῖς δώδεκα μαθηταῖς αὐτοῦ
  choice: ai suoi dodici discepoli
  rationale: Resa italiana corrente e precisa; «discepoli» è il termine consolidato per μαθηταί nel contesto evangelico.
- source_word: μετέβη ἐκεῖθεν
  choice: partì di là
  rationale: Esprime con naturalezza il trasferimento di Gesù dal luogo precedente e mantiene il riferimento spaziale di ἐκεῖθεν.
- source_word: τοῦ διδάσκειν καὶ κηρύσσειν
  choice: per insegnare e predicare
  rationale: L'infinito articolato esprime lo scopo. La formulazione conserva la distinzione fra l'insegnamento e la proclamazione pubblica.
- source_word: ἐν ταῖς πόλεσιν αὐτῶν
  choice: nelle loro città
  rationale: La resa mantiene il pronome possessivo senza identificarne l'antecedente, come nel greco. «Città» è l'equivalente diretto di πόλεις, pur potendo il termine indicare anche centri abitati più piccoli.
theological_decisions:
- issue: Referente di αὐτῶν in «ἐν ταῖς πόλεσιν αὐτῶν»
  choice: Mantenere l'ambiguo «nelle loro città».
  alternative: Specificare «nelle città dei discepoli», «nelle città dei Giudei» oppure «nelle città di quella regione».
  rationale: Il pronome greco non identifica esplicitamente il proprio referente. La traduzione non risolve ciò che il testo lascia aperto.
translation_notes:
  register: Italiano moderno, naturale e dignitoso. Il trapassato remoto «ebbe finito» si accorda al registro narrativo biblico senza risultare antiquato. La formulazione conserva sia l'autorevolezza di διατάσσων sia l'ambiguità del possessivo αὐτῶν.
