reference: Matthew 11:26
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ναί, ὁ πατήρ, ὅτι οὕτως ⸂εὐδοκία ἐγένετο⸃ ἔμπροσθέν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/026.yaml
  text: Yes[a], Father, because this was pleasing in your sight.
translation:
  language: it
  text: Sì[a], Padre, perché così ti è piaciuto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «Sì, Padre, poiché questo è stato gradito ai tuoi occhi»; oppure: «Sì, Padre, poiché tale è stato il tuo beneplacito».'
    reason: Alternative lessicali e sintattiche per οὕτως e per εὐδοκία ἐγένετο ἔμπροσθέν σου.
lexical_decisions:
- source_word: ναί
  choice: Sì
  rationale: Esprime assenso o conferma; «Sì» è diretto e naturale nel contesto della preghiera.
- source_word: ὁ πατήρ
  choice: Padre
  rationale: Il nominativo con articolo ha funzione allocutiva; «Padre» conserva l'invocazione senza ricorrere all'arcaico «o Padre».
- source_word: ὅτι
  choice: perché
  rationale: Introduce qui la ragione dell'assenso espresso da ναί; «perché» rende chiaramente il valore causale.
- source_word: οὕτως
  choice: così
  rationale: Rimanda al modo di agire del Padre descritto nel versetto precedente, senza esplicitarlo oltre il testo.
- source_word: εὐδοκία ἐγένετο
  choice: è stato gradito
  rationale: Rende in italiano naturale l'espressione idiomatica, mantenendo l'idea di ciò che incontra il favore o il compiacimento del Padre senza trasformarla esplicitamente in decreto o proposito.
- source_word: ἔμπροσθέν σου
  choice: ai tuoi occhi
  rationale: Equivale a «davanti a te» o «al tuo cospetto»; «ai tuoi occhi» è corrente, dignitoso e comunica il giudizio favorevole del Padre.
theological_decisions:
- issue: Se εὐδοκία debba implicare un decreto o proposito divino oppure il favore e compiacimento del Padre
  choice: «è stato gradito ai tuoi occhi», che esprime il favore del Padre
  alternative: «così è piaciuto a te»; «tale è stato il tuo beneplacito»
  rationale: Il greco presenta il modo di agire appena descritto come conforme al compiacimento del Padre, ma non impone qui di precisarlo come decreto. La resa conserva questa apertura semantica.
translation_notes:
  register: Italiano moderno standard, sobrio e dignitoso. «Ai tuoi occhi» evita sia il più letterale ma meno idiomatico «davanti a te» sia il più solenne «al tuo cospetto»; la nota conserva l'alternativa tradizionale «beneplacito».
