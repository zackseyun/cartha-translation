  source_fidelity: 'Il senso è sostanzialmente fedele: ναί è reso con «Sì», l''appello «Padre» è appropriato, e «perché» esprime bene il valore causale di ὅτι. Tuttavia, «così è stato gradito ai tuoi occhi» è una costruzione italiana meno naturale e rende meno direttamente l''idioma εὐδοκία ἐγένετο ἔμπροσθέν σου. «Così ti è piaciuto» conserva sia il rinvio di οὕτως al modo di agire appena menzionato sia il compiacimento espresso da εὐδοκία, senza introdurre l''idea di un decreto.'
  naturalness: «Sì, Padre, perché così ti è piaciuto» è sobrio, moderno e idiomatico. Mantiene un registro adatto a una preghiera senza ricorrere a formule arcaiche come «al tuo cospetto» o a termini teologicamente più marcati come «beneplacito» nel testo principale.
  terminology: «Ti è piaciuto» rende il favore/compiacimento di εὐδοκία senza restringerlo a «proposito», «decisione» o decreto. «Padre» è la forma allocutiva naturale. La nota conserva «beneplacito» soltanto come possibile formulazione più tradizionale.
