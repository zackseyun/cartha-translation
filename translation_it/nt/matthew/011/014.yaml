  terminology: «Elia» è la forma italiana standard del nome. La nota b identifica correttamente il referente come Giovanni Battista senza trasformare il testo in una parafrasi dottrinale. Il rinvio a Malachia 3:23 è corretto nella numerazione italiana corrente e la nota ne spiega implicitamente l'equivalenza con Malachia 4:5 dell'audit trail inglese.
