  source_fidelity: 'La resa riproduce fedelmente tutti gli elementi del greco: καὶ («E»), la condizione con θέλετε + infinito («se siete disposti ad accettarlo»), il riferimento a Giovanni tramite αὐτός («egli»), l''identificazione diretta ἐστιν Ἠλίας («è Elia») e l''attesa espressa da ὁ μέλλων ἔρχεσθαι («colui che deve venire»). Il pronome «lo» rende in modo idiomatico l''oggetto implicito dell''accettazione senza restringerlo indebitamente.'
