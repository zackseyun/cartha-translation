id: MAT.11.14
reference: Matthew 11:14
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: καὶ εἰ θέλετε δέξασθαι, αὐτός ἐστιν Ἠλίας ὁ μέλλων ἔρχεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/014.yaml
  text: And if you are willing to accept it[b][a], he is Elijah who is to come.
translation:
  language: it
  text: E, se siete disposti ad accettarlo[a], egli è Elia, colui che deve venire.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «se siete disposti ad accogliere questa parola».
    reason: Segnala sia l’alternativa lessicale per δέξασθαι sia l’oggetto implicito dell’accoglienza.
  - marker: b
    text: Il riferimento è a Giovanni Battista, identificato con l’Elia atteso; confronta Malachia 3:23 e Matteo 17:10–13.
    reason: Chiarisce il referente e fornisce i richiami biblici pertinenti senza sciogliere l’identificazione in una parafrasi interpretativa.
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Conserva in modo naturale il collegamento con il contesto precedente senza specificarne ulteriormente il valore logico.
- source_word: εἰ θέλετε δέξασθαι
  choice: se siete disposti ad accettarlo
  rationale: θέλετε seguito dall’infinito indica disponibilità o volontà; «accettarlo» rende in italiano corrente l’idea di accogliere come vero quanto Gesù afferma, esplicitando con il pronome l’oggetto sottinteso.
- source_word: αὐτός
  choice: egli
  rationale: Rimanda a Giovanni Battista. «Egli» mantiene un tono dignitoso e una lieve enfasi, senza introdurre l’enfasi più forte di «egli stesso».
- source_word: ἐστιν Ἠλίας
  choice: è Elia
  rationale: Riproduce direttamente l’identificazione formulata dal greco; «Elia» è la forma italiana tradizionale e corrente del nome.
- source_word: ὁ μέλλων ἔρχεσθαι
  choice: colui che deve venire
  rationale: Rende la costruzione sostantivata e conserva l’attesa futura e profetica. «Deve venire» esprime qui ciò che è atteso o stabilito, non un semplice obbligo morale.
theological_decisions:
- issue: Identificazione di Giovanni Battista con Elia
  choice: «egli è Elia», mantenendo la condizione «se siete disposti ad accettarlo»
  alternative: «egli svolge il ruolo di Elia» oppure «egli è simile a Elia»
  rationale: Il greco formula direttamente l’identificazione, ma la introduce con un appello condizionale all’accoglienza degli ascoltatori. La resa conserva entrambe le componenti e non risolve la tensione interpretativa sostituendo l’identità con una semplice somiglianza.
translation_notes:
  register: Italiano moderno, naturale e dignitoso. La formulazione mantiene la concisione dell’originale e la tensione teologica dell’identificazione. Il riferimento di Malachia segue la numerazione italiana comune (3:23), corrispondente a Malachia 4:5 in altre tradizioni di numerazione.
