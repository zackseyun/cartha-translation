id: MAT.11.11
reference: Matthew 11:11
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, οὐκ ἐγήγερται ἐν γεννητοῖς γυναικῶν μείζων Ἰωάννου τοῦ βαπτιστοῦ· ὁ δὲ μικρότερος ἐν τῇ βασιλείᾳ τῶν οὐρανῶν μείζων αὐτοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/011.yaml
  text: Truly I say to you[a], among those born of women no one greater than John the Baptist has arisen[c][b]; yet the least in the kingdom of heaven is greater than he.
translation:
  language: it
  text: '«In verità vi dico: fra i nati di donna[a] non è sorto[b] nessuno più grande di Giovanni il Battista; eppure il più piccolo[c] nel regno dei cieli è più grande di lui.»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Fra i nati di donna» è un'espressione semitica che significa «fra gli esseri umani».
    reason: cultural_note
  - marker: b
    text: 'Oppure: «non è stato suscitato». Il verbo greco può significare «sorgere» o «essere suscitato»; qui indica probabilmente il comparire sulla scena della storia, non la risurrezione.'
    reason: lexical_alternative
  - marker: c
    text: 'Oppure: «chi è più piccolo» o «il minore». Il greco usa letteralmente una forma comparativa, che qui può riferirsi a chi ha il rango o la posizione più bassa nel regno dei cieli.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: In verità
  rationale: Rende in italiano moderno e solenne la formula autorevole che introduce il detto, senza ricorrere alla traslitterazione «Amen», meno naturale in questo contesto discorsivo.
- source_word: λέγω ὑμῖν
  choice: vi dico
  rationale: È la resa diretta e idiomatica della formula, conservandone il tono solenne e personale.
- source_word: ἐν γεννητοῖς γυναικῶν
  choice: fra i nati di donna
  rationale: Conserva l'espressione semitica e la sua tessitura biblica, mentre la nota ne chiarisce il riferimento all'umanità.
- source_word: οὐκ ἐγήγερται
  choice: non è sorto
  rationale: Il perfetto indica che fino al momento considerato non è comparso qualcuno di tale grandezza. «È sorto» mantiene l'immagine del greco senza suggerire necessariamente la risurrezione.
- source_word: μείζων Ἰωάννου τοῦ βαπτιστοῦ
  choice: nessuno più grande di Giovanni il Battista
  rationale: Esplicita naturalmente in italiano il soggetto sottinteso della costruzione comparativa negativa.
- source_word: τοῦ βαπτιστοῦ
  choice: il Battista
  rationale: È il titolo tradizionale, chiaro e lessicalmente appropriato di Giovanni in italiano.
- source_word: ὁ δὲ μικρότερος
  choice: eppure il più piccolo
  rationale: La forma greca è comparativa, ma nel contesto può indicare chi occupa il grado o la posizione minima. «Eppure» rende bene il netto contrasto paradossale.
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: nel regno dei cieli
  rationale: È la resa italiana consueta e naturale della caratteristica espressione matteana, mantenendo il plurale «cieli».
- source_word: μείζων αὐτοῦ ἐστιν
  choice: è più grande di lui
  rationale: Riproduce senza spiegazioni aggiunte il confronto espresso nel greco.
theological_decisions:
- issue: La grandezza di Giovanni rispetto a chi è nel regno
  choice: Mantenere direttamente l'affermazione paradossale senza spiegare in che senso il più piccolo nel regno sia più grande di Giovanni.
  alternative: Spiegare il confronto in termini di epoche della storia della salvezza, privilegi del nuovo patto, santità personale o rango dei discepoli.
  rationale: Il versetto non esplicita il fondamento del confronto; la traduzione deve conservarne la tensione teologica anziché risolverla.
translation_notes:
  register: Italiano standard moderno, dignitoso e leggibile. La formulazione conserva la solennità del detto, l'espressione semitica «nati di donna» e il paradosso finale, affidando alle note le principali alternative lessicali senza introdurre interpretazioni confessionali.
