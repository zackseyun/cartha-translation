  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτοῖς· Πορευθέντες ἀπαγγείλατε Ἰωάννῃ ἃ ἀκούετε καὶ βλέπετε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/004.yaml
  text: And Jesus answered them[a], “Go and report to John what you hear and see:”
translation:
  language: it
  text: 'Gesù rispose loro[a]: «Andate e riferite a Giovanni ciò che udite e vedete:»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Più letteralmente: «E Gesù rispose e disse loro».'
    reason: Alternativa lessicale e sintattica per la formula narrativa greca ἀποκριθεὶς ... εἶπεν.
lexical_decisions:
- source_word: καὶ
  choice: '[non espresso separatamente]'
  rationale: Il semplice collegamento narrativo è reso in modo naturale dalla continuità del racconto; introdurre «E» non è necessario in italiano moderno.
- source_word: ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Gesù rispose loro
  rationale: La formula narrativa greca «avendo risposto, Gesù disse loro» è idiomaticamente condensata senza perdere né l'atto di risposta né i destinatari.
- source_word: Πορευθέντες
  choice: Andate
  rationale: Il participio aoristo, coordinato funzionalmente con l'imperativo seguente, assume qui valore imperativale e indica l'azione preliminare.
- source_word: ἀπαγγείλατε
  choice: riferite
  rationale: Il verbo indica il comunicare o riportare una notizia; «riferite» si adatta ai messaggeri che devono tornare da Giovanni.
- source_word: Ἰωάννῃ
  choice: a Giovanni
  rationale: Il dativo esprime il destinatario della comunicazione.
- source_word: ἃ ἀκούετε καὶ βλέπετε
  choice: ciò che udite e vedete
  rationale: La relativa neutra plurale è resa naturalmente con «ciò che»; i presenti mantengono l'esperienza diretta e attuale dei discepoli.
theological_decisions:
- issue: Resa della formula narrativa ἀποκριθεὶς ... εἶπεν
  choice: Gesù rispose loro
  alternative: Gesù, rispondendo, disse loro
  rationale: 'La scelta è stilistica, non dottrinale: l''italiano naturale può condensare la formula semitizzante/greca senza perdita di contenuto. La nota conserva la forma più letterale.'
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. «Udite» conserva un tono biblico sobrio ma resta comune e comprensibile; «riferite» rende con precisione l'incarico affidato ai messaggeri.
