source:
  edition: SBLGNT
  text: τυφλοὶ ἀναβλέπουσιν καὶ χωλοὶ περιπατοῦσιν, λεπροὶ καθαρίζονται καὶ κωφοὶ ἀκούουσιν, ⸀καὶ νεκροὶ ἐγείρονται καὶ πτωχοὶ εὐαγγελίζονται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/005.yaml
  text: The blind receive sight and the lame walk[a], lepers are cleansed and the deaf hear[b], and the dead are raised and the poor have good news proclaimed to them.
translation:
  language: it
  text: I ciechi riacquistano la vista e gli zoppi camminano; le persone affette da lebbra sono purificate e i sordi odono; i morti vengono risuscitati e ai poveri è annunciata la buona notizia.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «ai poveri è predicato il vangelo». Il verbo greco è passivo: i poveri sono destinatari dell’annuncio della buona notizia.'
    reason: lexical_alternative
  - marker: b
    text: Questo elenco riecheggia Isaia 35:5–6 e 61:1 e richiama i segni associati all’opera del Messia.
    reason: cross_reference
lexical_decisions:
- source_word: τυφλοὶ
  choice: i ciechi
  rationale: L’aggettivo sostantivato indica le persone cieche come gruppo; la resa è concisa e naturale nel registro biblico italiano.
- source_word: ἀναβλέπουσιν
  choice: riacquistano la vista
  rationale: Nel contesto delle guarigioni il verbo indica il recupero della vista, non il semplice guardare in alto.
- source_word: χωλοὶ
  choice: gli zoppi
  rationale: Rende in modo conciso l’aggettivo sostantivato riferito a persone che non camminano normalmente, mantenendo il parallelismo della lista.
- source_word: περιπατοῦσιν
  choice: camminano
  rationale: Il presente semplice riproduce il presente greco e lo stile stringato dell’elenco.
- source_word: λεπροὶ
  choice: le persone affette da lebbra
  rationale: Evita di ridurre le persone alla loro condizione e mantiene il riferimento alla categoria antica tradizionalmente resa con «lebbra», senza identificarla necessariamente con la moderna diagnosi clinica.
- source_word: καθαρίζονται
  choice: sono purificate
  rationale: Conserva sia la dimensione fisica sia quella di purità rituale implicita nel verbo, che «sono guarite» restringerebbe.
- source_word: κωφοὶ
  choice: i sordi
  rationale: Benché κωφός possa indicare sordità o mutismo, l’abbinamento con «odono» determina qui il senso di persone sorde.
- source_word: ἀκούουσιν
  choice: odono
  rationale: Il presente semplice segue la forma greca e mantiene un registro dignitoso e conciso.
- source_word: νεκροὶ
  choice: i morti
  rationale: Resa diretta dell’aggettivo sostantivato, con la forza solenne dell’originale.
- source_word: ἐγείρονται
  choice: sono risuscitati
  rationale: La costruzione passiva conserva la forma greca e presenta i morti come destinatari dell’azione che restituisce loro la vita.
- source_word: πτωχοὶ
  choice: i poveri
  rationale: Mantiene il riferimento socioeconomico e l’eco isaiana senza introdurre una specificazione interpretativa.
- source_word: εὐαγγελίζονται
  choice: ai poveri è annunciata la buona notizia
  rationale: 'La formulazione conserva il valore passivo: i poveri ricevono l’annuncio. «Buona notizia» mantiene il significato verbale senza trasformarlo automaticamente in terminologia ecclesiastica tecnica.'
theological_decisions:
- issue: Resa di εὐαγγελίζονται e rapporto con il termine «vangelo»
  choice: ai poveri è annunciata la buona notizia
  alternative: ai poveri è predicato il vangelo
  rationale: La scelta mantiene la forma passiva e il legame lessicale con una notizia buona, lasciando intatta la risonanza messianica senza restringere l’espressione al successivo uso tecnico ecclesiale.
- issue: L’elenco dei prodigi come prova dell’opera messianica
  choice: Conservare le affermazioni dirette senza aggiungere nel testo una formula esplicita di adempimento
  alternative: Aggiungere che questi segni adempiono le profezie di Isaia
  rationale: L’allusione a Isaia è forte, ma il testo greco elenca le opere senza inserire esplicitamente una formula di adempimento; tale connessione è quindi segnalata in nota.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. Il ritmo parallelo dell’elenco greco è conservato mediante tre membri separati da punti e virgola. «Le persone affette da lebbra» usa una formulazione rispettosa senza cancellare la categoria storica del testo; «odono» e «sono risuscitati» mantengono un tono biblico comprensibile.
