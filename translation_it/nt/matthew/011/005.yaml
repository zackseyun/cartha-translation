review_pass:
  verdict: revise
  source_fidelity: La resa segue fedelmente la sequenza, il parallelismo e le voci passive del greco. «Riacquistano la vista», «sono purificate» e «ai poveri è annunciata la buona notizia» rendono bene i rispettivi verbi e non aggiungono interpretazioni. Per ἐγείρονται, tuttavia, «sono risuscitati» può essere letto in italiano come un perfetto o come uno stato risultante, mentre il greco è un presente passivo.
  naturalness: Il testo è scorrevole, dignitoso e naturale nel registro biblico italiano. «Odono» è leggermente elevato ma pienamente comprensibile e appropriato alla formulazione ritmica dell’elenco. «Vengono risuscitati» chiarisce senza appesantire il valore presente-passivo.
  terminology: «Persone affette da lebbra» è una formulazione rispettosa, pur conservando la categoria tradizionale; «purificate» mantiene la possibile risonanza sia fisica sia cultuale di καθαρίζονται. «Buona notizia» conserva il valore non tecnicizzato di εὐαγγελίζονται; l’alternativa «vangelo» è correttamente relegata in nota. La nota isaiana è sobria e non impone una lettura dottrinale.
