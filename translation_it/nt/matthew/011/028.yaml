id: MAT.11.28
reference: Matthew 11:28
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Δεῦτε πρός με πάντες οἱ κοπιῶντες καὶ πεφορτισμένοι, κἀγὼ ἀναπαύσω ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/028.yaml
  text: Come to me[a], all who labor and are burdened[b], and I will give you rest.
translation:
  language: it
  text: Venite a me, voi tutti che faticate e siete oppressi[a], e io vi darò riposo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «siete carichi di pesi». Il participio perfetto passivo greco descrive persone sulle quali è stato posto un peso e che continuano a trovarsi in tale condizione.
    reason: lexical_alternative
  - marker: b
    text: O «vi ristorerò». Il verbo greco può significare far riposare qualcuno oppure ristorarlo.
    reason: lexical_alternative
lexical_decisions:
- source_word: Δεῦτε
  choice: Venite
  rationale: Imperativo idiomatico di invito, diretto e naturale in italiano; il plurale concorda con πάντες.
- source_word: πρός με
  choice: a me
  rationale: Con il verbo di movimento, πρός seguito dall’accusativo indica naturalmente il movimento verso una persona.
- source_word: πάντες
  choice: voi tutti
  rationale: Rende espliciti sia il plurale sia la portata universale dell’invito, senza aggiungere limitazioni.
- source_word: οἱ κοπιῶντες
  choice: che faticate
  rationale: 'Conserva il valore attivo e durativo del participio presente: persone che lavorano duramente o si affaticano.'
- source_word: πεφορτισμένοι
  choice: siete oppressi
  rationale: Esprime in italiano corrente lo stato presente di chi è stato caricato di un peso e ne rimane gravato; una nota conserva l’immagine più letterale del carico.
- source_word: κἀγὼ
  choice: e io
  rationale: Mantiene il soggetto espresso e la lieve enfasi o contrapposizione del greco, senza accentuarla indebitamente.
- source_word: ἀναπαύσω
  choice: vi darò riposo
  rationale: 'Rende in modo naturale il causativo del verbo: far riposare o procurare riposo, lasciando aperta anche la sfumatura di ristoro.'
- source_word: ὑμᾶς
  choice: vi
  rationale: Pronome oggetto plurale idiomatico; la pluralità è inoltre esplicitata da «voi tutti».
theological_decisions:
- issue: Natura del riposo promesso in ἀναπαύσω
  choice: vi darò riposo
  alternative: vi ristorerò
  rationale: La formulazione ampia non specifica se il riposo sia spirituale, escatologico, emotivo o fisico, e preserva così la ricchezza e la tensione teologica del testo.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. «Che faticate» conserva l’azione del primo participio, mentre «siete oppressi» distingue lo stato risultante espresso dal perfetto passivo. I marcatori di nota sono collocati sulle espressioni cui si riferiscono, correggendo l’apparente inversione presente nel testo inglese fornito.
