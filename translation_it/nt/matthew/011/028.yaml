  source_fidelity: «Venite a me, voi tutti che faticate e siete oppressi» riproduce adeguatamente l'invito plurale Δεῦτε πρός με πάντες e distingue il participio presente attivo κοπιῶντες («che faticate») dallo stato risultante del perfetto passivo πεφορτισμένοι («siete oppressi»). «E io vi darò riposo» rende in modo ampio e fedele κἀγὼ ἀναπαύσω ὑμᾶς, senza precisare indebitamente la natura del riposo.
  naturalness: Il testo è naturale, dignitoso e pienamente comprensibile in italiano standard contemporaneo. «Voi tutti» conserva bene la portata inclusiva di πάντες; «e io» mantiene l'esplicitazione del soggetto greco senza risultare artificioso.
