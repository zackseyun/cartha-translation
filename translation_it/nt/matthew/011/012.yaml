  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ἀπὸ δὲ τῶν ἡμερῶν Ἰωάννου τοῦ βαπτιστοῦ ἕως ἄρτι ἡ βασιλεία τῶν οὐρανῶν βιάζεται, καὶ βιασταὶ ἁρπάζουσιν αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/012.yaml
  text: But from the days of John the Baptist until now[a], the kingdom of heaven suffers violence, and violent men seize it.
translation:
  language: it
  text: Ma dai giorni di Giovanni il Battista fino ad ora[a], il regno dei cieli subisce violenza e uomini violenti se ne impadroniscono con la forza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «il regno dei cieli avanza con forza e uomini che usano la forza se ne impadroniscono». Il verbo greco tradotto «subisce violenza» può essere inteso anche in senso medio.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπὸ δὲ
  choice: Ma dai
  rationale: ἀπό indica il punto di partenza temporale, mentre δέ introduce un lieve passaggio o contrasto nel discorso. «Ma dai» conserva entrambi gli elementi senza accentuare eccessivamente l’opposizione.
- source_word: τῶν ἡμερῶν Ἰωάννου τοῦ βαπτιστοῦ
  choice: giorni di Giovanni il Battista
  rationale: Mantiene l’immagine temporale concreta e la costruzione relativamente formale del greco, restando naturale in italiano.
- source_word: ἕως ἄρτι
  choice: fino a ora
  rationale: Rende in modo diretto la continuità dal tempo di Giovanni fino al momento in cui Gesù parla.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: il regno dei cieli
  rationale: È la resa italiana consolidata dell’espressione caratteristica di Matteo e conserva il plurale οὐρανῶν.
- source_word: βιάζεται
  choice: subisce violenza
  rationale: Il verbo medio-passivo è ambiguo. La resa passiva si accorda naturalmente con il riferimento successivo agli uomini violenti, senza negare la possibile lettura media, riportata in nota.
- source_word: βιασταὶ
  choice: gli uomini violenti
  rationale: Il sostantivo indica persone violente o che fanno uso della forza; «uomini» rispecchia il plurale maschile del greco.
- source_word: ἁρπάζουσιν αὐτήν
  choice: se ne impadroniscono
  rationale: Esprime un’appropriazione energica o violenta e risulta più naturale in italiano di una resa rigidamente letterale del pronome femminile greco.
theological_decisions:
- issue: Senso di βιάζεται in rapporto al regno
  choice: 'Lettura passiva nel testo principale: «il regno dei cieli subisce violenza»'
  alternative: 'Lettura media o intransitiva: «il regno dei cieli avanza con forza»'
  rationale: La forma greca ammette entrambe le interpretazioni ed è storicamente discussa. La lettura passiva si collega bene agli «uomini violenti» della proposizione seguente; la nota conserva però l’alternativa plausibile, evitando di eliminare l’autentica tensione del testo.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. La formulazione conserva l’idioma matteano «regno dei cieli» e la ripetizione semantica tra «violenza» e «violenti», mentre la nota segnala l’ambiguità grammaticale e interpretativa del verbo greco.
