review_pass:
  verdict: revise
  source_fidelity: Il testo principale conserva correttamente la scansione temporale, «regno dei cieli» e la lettura passiva plausibile di βιάζεται. «Se ne impadroniscono» rende in generale ἁρπάζουσιν, ma da solo attenua la sfumatura di presa violenta; l'aggiunta «con la forza» la esplicita senza oltrepassare il greco.
  naturalness: La formulazione è moderna e scorrevole. «Fino ad ora» è leggermente più eufonico e usuale in questa posizione rispetto a «fino a ora».
  terminology: «Giovanni il Battista» e «regno dei cieli» sono appropriati. Nella nota, «uomini risoluti» è troppo debole per βιασταί nell'alternativa interpretativa; «uomini che usano la forza» conserva meglio il valore lessicale senza imporre una lettura teologica.
  issues:
  - severity: low
    issue: La nota attenua βιασταί con «uomini risoluti».
    rationale: βιασταί denota persone caratterizzate dalla forza o violenza; «risoluti» può indicare soltanto fermezza di proposito. Una resa che menzioni l'uso della forza mantiene meglio l'alternativa greca.
  - severity: low
    issue: La resa di ἁρπάζουσιν può rendere più esplicita la forza dell'atto.
    rationale: «Impadronirsi» è possibile, ma non implica necessariamente lo strappare o prendere con forza espresso da ἁρπάζω. «Con la forza» conserva tale tratto nel contesto di «uomini violenti».
  revised_text: Ma dai giorni di Giovanni il Battista fino ad ora[a], il regno dei cieli subisce violenza e uomini violenti se ne impadroniscono con la forza.
