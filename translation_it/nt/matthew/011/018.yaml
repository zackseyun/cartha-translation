  text: ἦλθεν γὰρ Ἰωάννης μήτε ἐσθίων μήτε πίνων, καὶ λέγουσιν· Δαιμόνιον ἔχει·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/018.yaml
  text: For John came neither eating nor drinking[a], and they say, ‘He has a demon.’
translation:
  language: it
  text: 'Giovanni infatti è venuto e non mangia né beve, e dicono: «Ha un demonio».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «È posseduto da un demonio». Il greco dice letteralmente: «Ha un demonio».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν
  choice: è venuto
  rationale: L’aoristo di ἔρχομαι indica l’arrivo o la comparsa di Giovanni; il passato prossimo è naturale nell’italiano moderno e mantiene il senso ordinario del verbo.
- source_word: γὰρ
  choice: infatti
  rationale: Introduce la spiegazione dell’affermazione precedente; «infatti» conserva bene il valore esplicativo in italiano.
- source_word: Ἰωάννης
  choice: Giovanni
  rationale: Forma italiana tradizionale e corrente del nome, riferito nel contesto a Giovanni il Battista.
- source_word: μήτε ἐσθίων μήτε πίνων
  choice: senza mangiare né bere
  rationale: Rende in modo naturale la coppia μήτε…μήτε e descrive la condotta ascetica di Giovanni senza aggiungere pane o vino, non esplicitati in questo versetto.
- source_word: καὶ λέγουσιν
  choice: e dicono
  rationale: Mantiene il presente vivido e il soggetto indeterminato del greco, senza specificare oltre chi formuli l’accusa.
- source_word: Δαιμόνιον ἔχει
  choice: Ha un demonio
  rationale: Riproduce direttamente l’espressione greca «ha un demonio» e distingue δαιμόνιον da διάβολος; in italiano biblico moderno resta chiara e dignitosa.
theological_decisions:
- issue: Resa dell’accusa espressa con δαιμόνιον ἔχει
  choice: Ha un demonio
  alternative: È posseduto da un demonio
  rationale: Il testo riferisce l’accusa rivolta a Giovanni, non un’affermazione del narratore. La resa più letterale conserva la formulazione e l’ambiguità dell’idioma senza accentuarne l’interpretazione.
translation_notes:
  register: Italiano standard moderno, scorrevole e dignitoso. «Senza mangiare né bere» evita una rigidità poco naturale pur conservando l’espressione assoluta e volutamente concisa del greco; la nota segnala l’alternativa idiomatica.
