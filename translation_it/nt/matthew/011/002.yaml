id: MAT.11.2
reference: Matthew 11:2
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰωάννης ἀκούσας ἐν τῷ δεσμωτηρίῳ τὰ ἔργα τοῦ χριστοῦ πέμψας ⸀διὰ τῶν μαθητῶν αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/002.yaml
  text: When John heard in prison about the works of the Messiah[a], he sent word through his disciples
translation:
  language: it
  text: 'Quando Giovanni, in prigione, venne a sapere delle opere del Messia[a], mandò a dire per mezzo dei suoi discepoli:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «del Cristo».'
    reason: Conserva la resa tradizionale alternativa del titolo greco Χριστός.
lexical_decisions:
- source_word: δὲ
  choice: nessuna resa esplicita
  rationale: La particella segnala il passaggio narrativo; in italiano il collegamento risulta naturale senza aggiungere un avverbio temporale non espresso nel greco.
- source_word: ἀκούσας
  choice: quando ... venne a sapere
  rationale: Il participio aoristo indica un'azione anteriore; una subordinata temporale è naturale in italiano. «Venne a sapere» rende qui il senso di ricevere notizia delle opere.
- source_word: ἐν τῷ δεσμωτηρίῳ
  choice: in prigione
  rationale: Resa italiana corrente e precisa della condizione e del luogo in cui si trovava Giovanni.
- source_word: τὰ ἔργα
  choice: le opere
  rationale: Conserva l'ampiezza semantica del termine, che comprende le azioni e i prodigi attribuiti a Gesù.
- source_word: τοῦ χριστοῦ
  choice: del Messia
  rationale: Χριστός funziona qui come titolo; «Messia» ne comunica il significato nel contesto giudaico. La forma tradizionale «Cristo» è indicata in nota.
- source_word: πέμψας
  choice: mandò a dire
  rationale: La formulazione italiana introduce naturalmente la domanda del versetto seguente senza specificarne anticipatamente il contenuto.
- source_word: διὰ τῶν μαθητῶν αὐτοῦ
  choice: per mezzo dei suoi discepoli
  rationale: διά con il genitivo esprime il tramite o l'intermediazione dei discepoli.
theological_decisions:
- issue: Resa di Χριστός
  choice: Messia
  alternative: Cristo
  rationale: Il termine è adoperato come titolo e «Messia» ne rende il valore di unto atteso, senza eliminare la tradizionale alternativa «Cristo», conservata in nota.
translation_notes:
  register: Italiano moderno, dignitoso e scorrevole. La frase mantiene il legame sintattico con la domanda del versetto successivo; i due punti segnalano che il messaggio segue immediatamente.
