id: MAT.5.30
reference: Matthew 5:30
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: καὶ εἰ ἡ δεξιά σου χεὶρ σκανδαλίζει σε, ἔκκοψον αὐτὴν καὶ βάλε ἀπὸ σοῦ, συμφέρει γάρ σοι ἵνα ἀπόληται ἓν τῶν μελῶν σου καὶ μὴ ὅλον τὸ σῶμά σου ⸂εἰς γέενναν ἀπέλθῃ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/030.yaml
  text: And if your right hand causes you to stumble[a], cut it off and throw it away[c][b]. For it is better for you that one of your members should perish than that your whole body should go into Gehenna.
translation:
  language: it
  text: E se la tua mano destra ti fa inciampare,[a] tagliala e gettala via. Infatti è meglio per te che perisca uno dei tuoi membri, piuttosto che tutto il tuo corpo vada nella Geenna.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «ti induce a peccare». Il verbo greco significa letteralmente «fa inciampare».
    reason: lexical_alternative
  - marker: b
    text: O «inferno». Il termine greco «Geenna» deriva dal nome della valle di Innom ed è usato in riferimento al giudizio escatologico.
    reason: alternative_reading
lexical_decisions:
- source_word: δεξιά ... χείρ
  choice: la tua mano destra
  rationale: È la resa italiana normale e precisa dell’espressione greca e conserva la specificità corporea e il parallelismo con il versetto precedente.
- source_word: σκανδαλίζει
  choice: ti fa inciampare
  rationale: Conserva la metafora greca dell’inciampo, che nel contesto indica l’induzione al peccato, senza sostituirla direttamente con una spiegazione interpretativa.
- source_word: ἔκκοψον
  choice: tagliala
  rationale: Rende in modo diretto e deciso l’imperativo aoristo riferito alla mano; in italiano il pronome incorporato evita una ripetizione innaturale.
- source_word: βάλε ἀπὸ σοῦ
  choice: gettala via da te
  rationale: Conserva sia la forza di βάλε sia l’idea esplicita di allontanamento espressa da ἀπὸ σοῦ.
- source_word: συμφέρει γάρ σοι
  choice: È infatti meglio per te
  rationale: Esprime in italiano corrente il vantaggio comparativo indicato dal greco e mantiene il valore esplicativo di γάρ.
- source_word: ἵνα ἀπόληται
  choice: che vada perduta
  rationale: Rende la perdita della parte del corpo senza imporre il senso più specifico di morte; conserva inoltre il tono grave del contrasto.
- source_word: ἓν τῶν μελῶν σου
  choice: una delle tue membra
  rationale: «Membra» conserva l’immagine corporea e l’ampiezza semantica di μέλος meglio di «arti», che sarebbe troppo ristretto.
- source_word: ὅλον τὸ σῶμά σου
  choice: tutto il tuo corpo
  rationale: Resa italiana naturale che mantiene il contrasto tra un solo membro e il corpo nella sua totalità.
- source_word: εἰς γέενναν ἀπέλθῃ
  choice: vada nella Geenna
  rationale: Riproduce il verbo di movimento e conserva il termine storico-religioso greco senza sostituirlo direttamente con una formulazione dottrinalmente più determinata.
theological_decisions:
- issue: Resa di γέεννα
  choice: Geenna
  alternative: inferno
  rationale: «Geenna» conserva il termine del testo greco, derivato dalla valle di Innom e associato al giudizio escatologico. «Inferno» è una possibile glossa contestuale, ma può richiamare elaborazioni dottrinali posteriori non esplicitate dal vocabolo stesso.
- issue: Valore contestuale di σκανδαλίζει
  choice: ti fa inciampare
  alternative: ti induce a peccare
  rationale: La resa scelta mantiene la metafora dell’inciampo presente nel greco, mentre la nota chiarisce il suo valore morale nel contesto senza eliminare la tensione figurativa dal testo principale.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. La sintassi mantiene la solennità e il netto contrasto retorico del greco; «membra» è leggermente elevato ma ancora comune nel registro biblico e comprensibile. «Gettala via da te» conserva deliberatamente l’allontanamento espresso dalla preposizione greca.
