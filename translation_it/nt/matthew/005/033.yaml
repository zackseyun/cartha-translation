id: MAT.5.33
reference: Matthew 5:33
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Πάλιν ἠκούσατε ὅτι ἐρρέθη τοῖς ἀρχαίοις· Οὐκ ἐπιορκήσεις, ἀποδώσεις δὲ τῷ κυρίῳ τοὺς ὅρκους σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/033.yaml
  text: Again[a], you have heard that it was said to those of old, ‘You shall not swear falsely[b], but you shall fulfill your oaths to the Lord.’
translation:
  language: it
  text: '«Avete anche udito che fu detto agli antichi: “Non giurerai il falso[a], ma adempirai i giuramenti che hai fatto al Signore[b]”.»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «Non violerai un giuramento»; il verbo può indicare sia il giurare il falso sia il venir meno a un giuramento.'
    reason: lexical_alternative
  - marker: b
    text: 'Oppure: «al SIGNORE», in riferimento al nome divino dell’alleanza nello sfondo veterotestamentario.'
    reason: alternative_reading
lexical_decisions:
- source_word: Πάλιν
  choice: anche
  rationale: Introduce un ulteriore esempio nella serie; «anche» rende con naturalezza italiana la progressione del discorso, senza suggerire necessariamente una ripetizione identica.
- source_word: ἠκούσατε
  choice: avete udito
  rationale: Il passato prossimo conserva la pertinenza attuale della formula e richiama il precedente «avete udito» della sezione.
- source_word: ἐρρέθη
  choice: fu detto
  rationale: Mantiene la forma passiva impersonale senza precisare chi abbia parlato.
- source_word: τοῖς ἀρχαίοις
  choice: agli antichi
  rationale: Indica le generazioni del passato; in questo contesto «gli antichi» è conciso e non significa semplicemente persone anziane.
- source_word: Οὐκ ἐπιορκήσεις
  choice: Non giurerai il falso
  rationale: Rende il senso di prestare un giuramento falso, lasciando in nota l'accezione connessa alla violazione di un giuramento.
- source_word: ἀποδώσεις
  choice: adempirai
  rationale: Nel contesto dei giuramenti indica l'esecuzione fedele dell'obbligo assunto, non un pagamento materiale.
- source_word: τῷ κυρίῳ
  choice: al Signore
  rationale: Il referente è Dio; «Signore» traduce direttamente κύριος e conserva il normale titolo divino italiano.
- source_word: τοὺς ὅρκους σου
  choice: i tuoi giuramenti
  rationale: Resa diretta e corrente di ὅρκος al plurale, distinta dal più ampio concetto di voto.
theological_decisions:
- issue: Resa di κύριος nell'allusione alle Scritture d'Israele
  choice: Signore
  alternative: SIGNORE
  rationale: Il testo greco presenta κύριος, non il nome divino ebraico; la nota segnala tuttavia lo sfondo veterotestamentario nel quale può essere sottinteso il nome dell'alleanza.
- issue: Ampiezza semantica di ἐπιορκέω
  choice: giurare il falso
  alternative: violare un giuramento
  rationale: Il verbo può riferirsi sia al giurare falsamente sia al mancato rispetto di quanto giurato. Il testo principale adotta la resa più diretta, mentre la nota conserva l'altra sfumatura senza restringerla al solo reato moderno di falsa testimonianza.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. La costruzione conserva il parallelismo giuridico e la solennità della formulazione, evitando il tecnicismo più ristretto «commettere spergiuro».
