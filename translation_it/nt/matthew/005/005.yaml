id: MAT.5.5
reference: Matthew 5:5
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: μακάριοι οἱ πραεῖς, ὅτι αὐτοὶ κληρονομήσουσι τὴν γῆν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/005.yaml
  text: Blessed are the meek[b][a], because they will inherit the earth.
translation:
  language: it
  text: Beati i miti[a], perché erediteranno la terra[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «i mansueti»; qui la mitezza indica umile gentilezza, non debolezza.
    reason: lexical_alternative
  - marker: b
    text: O «il paese»; l'espressione probabilmente richiama Salmo 37:11, dove la promessa può riferirsi sia al paese dell'alleanza sia, in senso più ampio, alla terra.
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριοι
  choice: Beati
  rationale: Formula naturale e consolidata delle beatitudini in italiano; esprime favore divino e pienezza di vita, non una semplice emozione soggettiva.
- source_word: οἱ πραεῖς
  choice: i miti
  rationale: Il sostantivato indica persone caratterizzate da mitezza e umile gentilezza, non da debolezza. «I miti» è dignitoso, comprensibile e conserva la risonanza biblica tradizionale.
- source_word: ὅτι
  choice: perché
  rationale: Introduce la ragione della dichiarazione ed è la resa più chiara e naturale nell'italiano moderno.
- source_word: αὐτοὶ
  choice: sottinteso nel verbo «erediteranno»
  rationale: Il pronome greco è enfatico; in italiano il soggetto sottinteso mantiene una formulazione fluida. L'enfasi resta percepibile nel contrasto tra «i miti» e ciò che proprio loro riceveranno.
- source_word: κληρονομήσουσι
  choice: erediteranno
  rationale: Rende direttamente il futuro di κληρονομέω e conserva il linguaggio dell'eredità e della promessa.
- source_word: τὴν γῆν
  choice: la terra
  rationale: «Terra» conserva in italiano l'ambiguità del greco γῆ, che può indicare sia la terra in senso ampio sia il paese promesso, e permette di udire l'eco del Salmo 37:11.
theological_decisions:
- issue: Portata di τὴν γῆν
  choice: la terra
  alternative: il paese
  rationale: Il greco può avere portata universale oppure richiamare il paese della promessa. «La terra» è naturale in italiano e conserva meglio entrambe le possibilità senza risolvere la tensione teologica.
- issue: Senso di πραεῖς
  choice: i miti
  alternative: i mansueti; le persone gentili
  rationale: «Miti» comunica una disposizione di umile gentilezza e autocontrollo, non passività o debolezza, evitando di restringere il termine a una sola sfumatura.
translation_notes:
  register: Italiano moderno standard, conciso e dignitoso. La formulazione conserva la cadenza tradizionale della beatitudine senza risultare arcaica; le note esplicitano le alternative lessicali genuine.
