id: MAT.5.37
reference: Matthew 5:37
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ἔστω δὲ ὁ λόγος ὑμῶν ναὶ ναί, οὒ οὔ· τὸ δὲ περισσὸν τούτων ἐκ τοῦ πονηροῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/037.yaml
  text: But let your word be[a], ‘Yes, yes,’ or ‘No, no.’ Anything beyond these is from the evil one.
translation:
  language: it
  text: 'Ma il vostro parlare sia: «Sì, sì»; «No, no»; il di più viene dal Maligno.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: «dal male». Il greco può riferirsi sia personalmente al Maligno sia impersonalmente al male.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔστω
  choice: sia
  rationale: Il presente imperativo di terza persona di εἰμί è reso naturalmente in italiano con il congiuntivo esortativo «sia».
- source_word: ὁ λόγος ὑμῶν
  choice: il vostro parlare
  rationale: Nel contesto λόγος indica ciò che si dice nella comunicazione ordinaria; «parlare» è naturale in italiano e mantiene il riferimento generale alle parole pronunciate.
- source_word: ναὶ ναί, οὒ οὔ
  choice: “Sì, sì”, “No, no”
  rationale: La duplicazione delle particelle è conservata per riprodurre l'enfasi e il ritmo del greco, senza ridurla a un semplice «sì o no».
- source_word: τὸ δὲ περισσὸν τούτων
  choice: Ciò che va oltre
  rationale: L'aggettivo sostantivato indica ciò che eccede le semplici affermazioni appena richieste; questa resa è idiomatica e conserva il valore comparativo.
- source_word: ἐκ
  choice: viene da
  rationale: La preposizione esprime origine o provenienza; in italiano la formulazione verbale «viene da» rende chiaramente tale rapporto.
- source_word: τοῦ πονηροῦ
  choice: dal Maligno
  rationale: La forma articolata può indicare personalmente «il Maligno» oppure impersonalmente «il male». L'uso matteano favorisce qui la lettura personale, mentre l'alternativa resta segnalata in nota.
theological_decisions:
- issue: Valore personale o impersonale di τοῦ πονηροῦ
  choice: dal Maligno
  alternative: dal male
  rationale: La costruzione greca è ambigua, ma in Matteo ὁ πονηρός ricorre spesso con riferimento personale. Il testo principale adotta quindi la lettura probabilmente intesa, senza eliminare l'altra possibilità, riportata in nota.
translation_notes:
  register: Italiano moderno, sobrio e dignitoso. La struttura breve e sentenziosa conserva la forza proverbiale dell'originale; la maiuscola in «Maligno» segnala la lettura personale adottata.
