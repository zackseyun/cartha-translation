id: MAT.5.12
reference: Matthew 5:12
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: χαίρετε καὶ ἀγαλλιᾶσθε, ὅτι ὁ μισθὸς ὑμῶν πολὺς ἐν τοῖς οὐρανοῖς· οὕτως γὰρ ἐδίωξαν τοὺς προφήτας τοὺς πρὸ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/012.yaml
  text: Rejoice and be very glad[a], because your reward is great in the heavens; for in this way they persecuted the prophets who were before you.
translation:
  language: it
  text: Rallegratevi ed esultate, perché grande è la vostra ricompensa nei cieli; infatti così hanno perseguitato i profeti che vi hanno preceduto.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χαίρετε
  choice: Rallegratevi
  rationale: Imperativo presente plurale che invita a una gioia attiva; è naturale, dignitoso e si abbina bene al verbo più intenso che segue.
- source_word: ἀγαλλιᾶσθε
  choice: esultate
  rationale: Esprime una gioia intensa ed esuberante. «Esultate» conserva la forza distinta rispetto a «rallegratevi» senza risultare oscuro.
- source_word: μισθὸς
  choice: ricompensa
  rationale: Nel contesto indica ciò che Dio accorda in risposta alla persecuzione sopportata; «ricompensa» evita la connotazione strettamente commerciale di «salario».
- source_word: πολὺς
  choice: grande
  rationale: Qualifica l'entità della ricompensa; la costruzione «grande è» conserva l'enfasi del predicato greco ed è idiomatica in italiano.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: nei cieli
  rationale: Riproduce il plurale matteano in un'espressione italiana comprensibile e tradizionalmente naturale, senza appiattirlo nel singolare.
- source_word: οὕτως
  choice: così
  rationale: Indica il modo corrispondente in cui furono perseguitati i profeti; «così» è conciso e naturale.
- source_word: ἐδίωξαν
  choice: hanno perseguitato
  rationale: Il contesto richiede il senso ostile di διώκω. Il passato prossimo è naturale nell'italiano moderno per un fatto passato posto in rapporto con il presente.
- source_word: τοὺς προφήτας
  choice: i profeti
  rationale: Resa standard per i profeti d'Israele.
- source_word: τοὺς πρὸ ὑμῶν
  choice: che furono prima di voi
  rationale: Rende esplicita la funzione attributiva dell'espressione e la precedenza storica dei profeti rispetto ai discepoli.
theological_decisions:
- issue: Senso di «nei cieli»
  choice: Conservare il plurale «nei cieli» come riferimento alla sfera celeste presso Dio.
  alternative: «In cielo», secondo l'uso italiano più comune.
  rationale: Il plurale è presente nel greco di Matteo e può essere mantenuto naturalmente in italiano; la scelta non specifica ulteriormente la natura o il momento della ricompensa.
- issue: Rapporto tra persecuzione dei discepoli e dei profeti
  choice: Rendere οὕτως con «così», lasciando che indichi una corrispondenza nel modo della persecuzione.
  alternative: «Allo stesso modo», che esplicita maggiormente il paragone.
  rationale: «Così» conserva la concisione e una lieve apertura semantica dell'originale senza indebolire il nesso causale introdotto da γάρ.
translation_notes:
  register: Italiano standard moderno, solenne ma accessibile. La coppia «rallegratevi ed esultate» conserva la progressione dei due imperativi greci. La sintassi «grande è la vostra ricompensa» mantiene l'enfasi senza risultare arcaica.
