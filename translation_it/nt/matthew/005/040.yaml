id: MAT.5.40
reference: Matthew 5:40
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: καὶ τῷ θέλοντί σοι κριθῆναι καὶ τὸν χιτῶνά σου λαβεῖν, ἄφες αὐτῷ καὶ τὸ ἱμάτιον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/040.yaml
  text: And to the one who wants to sue you and take your tunic[b][a], let him have your cloak also.
translation:
  language: it
  text: E a chi vuole portarti in tribunale per prenderti la tunica[a], lasciagli anche il mantello.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La «tunica» era la veste interna, mentre il «mantello» era la veste esterna.
    reason: cultural_note
lexical_decisions:
- source_word: τῷ θέλοντί
  choice: a chi vuole
  rationale: Il participio presente articolato indica genericamente chiunque abbia questa intenzione; «a chi vuole» è naturale e conserva il valore volitivo.
- source_word: σοι κριθῆναι
  choice: portarti in tribunale
  rationale: L’infinito passivo di κρίνω richiama letteralmente l’essere giudicati e, nel contesto, un’azione legale contro l’interlocutore. Questa formulazione conserva più chiaramente l’immagine giudiziaria rispetto al più tecnico «farti causa».
- source_word: χιτῶνά
  choice: tunica
  rationale: χитών designa la veste interna; «tunica» mantiene il riferimento storico e il contrasto con il mantello.
- source_word: λαβεῖν
  choice: prenderti
  rationale: Esprime l’acquisizione della tunica come obiettivo dell’azione legale; la costruzione italiana «per prenderti» rende esplicito e naturale il rapporto sintattico.
- source_word: ἄφες αὐτῷ
  choice: lascia
  rationale: L’imperativo di ἀφίημι esorta a cedere anche l’altro indumento. Con il complemento già implicito nel contesto, «lascia anche il mantello» è conciso e incisivo.
- source_word: ἱμάτιον
  choice: mantello
  rationale: ἱμάτιον indica la veste esterna, distinta dalla tunica; «mantello» rende chiaramente tale contrasto.
- source_word: καὶ ... καὶ
  choice: E ... anche
  rationale: Il primo καί collega il detto al contesto precedente; il secondo aggiunge enfaticamente la veste esterna.
theological_decisions:
- issue: Forza etica dell’istruzione di Gesù in una controversia legale
  choice: Conservare un imperativo diretto di generosità radicale e non ritorsiva
  alternative: Ridurre il detto a un principio generale e astratto di rinuncia ai propri diritti
  rationale: L’imperativo ἄφες e l’immagine concreta dei due indumenti richiedono di mantenere la forza provocatoria dell’esortazione, senza limitarla mediante una particolare costruzione dottrinale.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. «Portarti in tribunale» conserva la concreta ambientazione legale; «tunica» e «mantello» mantengono il contrasto culturale dell’originale, chiarito in nota.
