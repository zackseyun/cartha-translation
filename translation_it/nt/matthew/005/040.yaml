  source_fidelity: La resa conserva correttamente il contesto di azione legale di σοι κριθῆναι, lo scopo di ottenere la tunica (λαβεῖν τὸν χιτῶνά σου) e l'aggiunta enfatica del mantello (καὶ τὸ ἱμάτιον).
  naturalness: «Portarti in tribunale» è italiano moderno e comprensibile nel contesto. L'imperativo «lascia anche il mantello», tuttavia, non esplicita in modo naturale il destinatario αὐτῷ e può suonare ellittico; «lasciagli anche il mantello» restituisce chiaramente il senso di cederlo a quella persona.
  terminology: «Tunica» e «mantello» mantengono bene la distinzione storica tra χιτών, indumento interno, e ἱμάτιον, veste esterna. La nota è appropriata e ancorata a «tunica».
