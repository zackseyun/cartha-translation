  text: μήτε ἐν τῇ κεφαλῇ σου ὀμόσῃς, ὅτι οὐ δύνασαι μίαν τρίχα λευκὴν ⸂ποιῆσαι ἢ μέλαιναν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/036.yaml
  text: Nor shall you swear by your head[a], because you are not able to make one hair white or black.
translation:
  language: it
  text: E non giurare neppure per la tua testa, perché non puoi rendere bianco o nero un solo capello.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μήτε
  choice: E non... neppure
  rationale: Prosegue in modo naturale la serie coordinata di proibizioni del contesto, conservando il valore negativo aggiuntivo.
- source_word: ἐν τῇ κεφαλῇ σου
  choice: per la tua testa
  rationale: Con ὀμόσῃς, la preposizione introduce ciò che viene invocato nel giuramento; in italiano l'espressione idiomatica è «giurare per».
- source_word: ὀμόσῃς
  choice: giurare
  rationale: L'aoristo congiuntivo retto da μήτε esprime una proibizione; l'infinito dipendente da «non» è naturale e diretto in italiano.
- source_word: ὅτι
  choice: perché
  rationale: Introduce esplicitamente la ragione della proibizione.
- source_word: οὐ δύνασαι
  choice: non puoi
  rationale: Rende con chiarezza e naturalezza l'incapacità espressa da δύναμαι.
- source_word: μίαν τρίχα
  choice: un solo capello
  rationale: «Solo» conserva l'enfasi sul numero uno e «capello» è il termine naturale nel contesto della testa umana.
- source_word: λευκὴν ... ἢ μέλαιναν
  choice: bianco o nero
  rationale: Mantiene i due termini cromatici fondamentali e il loro contrasto netto.
- source_word: ποιῆσαι
  choice: rendere
  rationale: Nel costrutto con aggettivo predicativo, «rendere bianco o nero» esprime naturalmente il senso causativo di ποιέω.
theological_decisions:
- issue: Portata della proibizione del giuramento
  choice: Formulare una proibizione diretta del giurare per la propria testa, senza estenderla esplicitamente a ogni possibile giuramento.
  alternative: Interpretare il detto come divieto assoluto di ogni giuramento, oppure limitarlo ai soli giuramenti evasivi o manipolatori.
  rationale: Il versetto nomina specificamente il giurare per la propria testa e ne motiva il divieto con il limite del potere umano. La resa conserva questa formulazione senza risolvere un dibattito teologico più ampio.
translation_notes:
  register: Italiano moderno standard, dignitoso e accessibile. La costruzione «E non... neppure» mantiene il legame con le proibizioni precedenti; «per la tua testa» conserva l'immagine concreta e l'idioma del giuramento.
