  text: Ἰδὼν δὲ τοὺς ὄχλους ἀνέβη εἰς τὸ ὄρος· καὶ καθίσαντος αὐτοῦ προσῆλθαν αὐτῷ οἱ μαθηταὶ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/001.yaml
  text: Seeing the crowds[a], he went up the mountain; and when he sat down[c][b], his disciples came to him.
translation:
  language: it
  text: Vedendo[a] le folle, salì sul monte; e, dopo essersi seduto[b], i suoi discepoli gli si avvicinarono.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «Quando vide le folle».'
    reason: Resa alternativa del participio aoristo Ἰδών.
  - marker: b
    text: 'Oppure: «quando si sedette». Il greco usa una costruzione di genitivo assoluto.'
    reason: Resa alternativa di καθίσαντος αὐτοῦ che segnala la circostanza temporale dell’azione seguente.
lexical_decisions:
- source_word: Ἰδὼν
  choice: Vedendo
  rationale: Il participio aoristo di ὁράω introduce la circostanza dell’azione principale. «Vedendo» conserva il legame participiale senza imporre una successione temporale più precisa.
- source_word: δὲ
  choice: —
  rationale: Qui δέ è una particella di transizione leggera; ometterla produce un italiano naturale senza aggiungere un contrasto assente dal contesto.
- source_word: τοὺς ὄχλους
  choice: le folle
  rationale: Mantiene il plurale greco ed è l’espressione corrente e dignitosa in italiano.
- source_word: ἀνέβη εἰς τὸ ὄρος
  choice: salì sul monte
  rationale: Rende in modo idiomatico il movimento verso l’alto e la meta espressa da εἰς, conservando l’articolo determinativo.
- source_word: καὶ καθίσαντος αὐτοῦ
  choice: e, quando si fu seduto
  rationale: Il genitivo assoluto esprime una circostanza temporale anteriore all’avvicinarsi dei discepoli. La resa italiana è naturale e non attribuisce al gesto un significato cerimoniale.
- source_word: προσῆλθαν αὐτῷ
  choice: gli si avvicinarono
  rationale: προσέρχομαι indica l’accostarsi a qualcuno; «gli si avvicinarono» esprime chiaramente il movimento verso Gesù.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: i suoi discepoli
  rationale: È la resa standard e accurata del rapporto tra maestro e seguaci indicato da μαθηταί.
theological_decisions:
- issue: Articolo determinativo in τὸ ὄρος
  choice: sul monte
  alternative: su un monte; sul pendio
  rationale: Il greco presenta l’articolo determinativo. «Il monte» lo conserva senza richiedere l’identificazione di un monte specifico.
- issue: Relazione temporale del genitivo assoluto καθίσαντος αὐτοῦ
  choice: quando si fu seduto
  alternative: dopo che si fu seduto; mentre si sedeva
  rationale: La costruzione colloca il sedersi come circostanza temporale rispetto all’avvicinarsi dei discepoli, senza conferire alla postura un significato dottrinale non espresso.
translation_notes:
  register: Italiano standard moderno, narrativo e dignitoso. La sintassi resta vicina al greco, ma evita calchi innaturali; «monte» conserva il lessico tradizionale senza risultare arcaico.
