id: MAT.5.47
reference: Matthew 5:47
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: καὶ ἐὰν ἀσπάσησθε τοὺς ⸀ἀδελφοὺς ὑμῶν μόνον, τί περισσὸν ποιεῖτε; οὐχὶ καὶ οἱ ⸀ἐθνικοὶ ⸂τὸ αὐτὸ⸃ ποιοῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/047.yaml
  text: And if you greet only your brothers[c][b][a], what are you doing that is extraordinary? Do not even the Gentiles do the same?
translation:
  language: it
  text: E se salutate soltanto i vostri fratelli[a], che cosa fate di straordinario[b]? Non fanno lo stesso anche i non ebrei[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il greco dice «fratelli», ma il termine può riferirsi più ampiamente ai membri del proprio gruppo, comprese le donne.
    reason: lexical_alternative
  - marker: b
    text: 'Oppure: «che cosa fate più degli altri?»'
    reason: lexical_alternative
  - marker: c
    text: 'Oppure: «i pagani» o «le genti».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσησθε
  choice: salutate
  rationale: Il verbo indica il rivolgere un saluto; «salutate» è naturale in italiano e non aggiunge l'idea più specifica di accoglienza o ospitalità.
- source_word: ἀδελφοὺς
  choice: fratelli
  rationale: Mantiene la forma maschile plurale del greco, pur lasciando in nota la possibilità che il termine comprenda più ampiamente i membri del proprio gruppo.
- source_word: μόνον
  choice: soltanto
  rationale: Esprime chiaramente la limitazione del saluto al proprio gruppo.
- source_word: τί περισσὸν ποιεῖτε
  choice: che cosa fate di straordinario?
  rationale: περισσόν indica ciò che eccede l'ordinario; questa formulazione conserva la forza della domanda retorica in un italiano naturale.
- source_word: ἐθνικοὶ
  choice: i non ebrei
  rationale: Nel contesto giudaico il termine designa primariamente coloro che appartengono agli altri popoli. «I non ebrei» comunica direttamente il contrasto etnico e comunitario senza accentuare indebitamente una valutazione religiosa negativa.
- source_word: τὸ αὐτὸ
  choice: lo stesso
  rationale: Resa italiana idiomatica dell'espressione greca «la stessa cosa».
theological_decisions:
- issue: Ampiezza referenziale di ἀδελφοὺς nell'insegnamento etico
  choice: «fratelli» nel testo principale
  alternative: «fratelli e sorelle» oppure «quelli del vostro gruppo»
  rationale: La resa conserva la forma maschile plurale del greco senza escludere che, nel contesto, il referente possa comprendere l'intera cerchia di appartenenza; la nota preserva questa apertura.
- issue: Valore di ἐθνικοὶ
  choice: «i non ebrei»
  alternative: «i pagani» oppure «le genti»
  rationale: Il termine stabilisce qui soprattutto un contrasto tra la comunità ebraica e gli altri popoli. «Pagani» può introdurre una sfumatura religiosa e polemica più marcata, mentre «le genti» risulta meno immediato nell'italiano corrente.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. La struttura conserva le due domande retoriche e il contrasto del testo greco, evitando sia un linguaggio confessionale marcato sia una resa eccessivamente letterale.
