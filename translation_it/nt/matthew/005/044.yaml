  text: ἐγὼ δὲ λέγω ὑμῖν, ἀγαπᾶτε τοὺς ἐχθροὺς ⸀ὑμῶν καὶ προσεύχεσθε ὑπὲρ ⸀τῶν διωκόντων ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/044.yaml
  text: But I say to you[a], love your enemies and pray for those who persecute you.
translation:
  language: it
  text: 'Ma io vi dico: amate i vostri nemici e pregate per quelli che vi perseguitano.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «pregate a favore di quelli che vi perseguitano».'
    reason: Alternativa lessicale che esplicita il valore di ὑπέρ, pur risultando meno naturale nel testo principale.
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: Ma io vi dico
  rationale: Conserva il contrasto introdotto da δέ e l’enfasi del pronome ἐγώ, mantenendo al tempo stesso una formulazione naturale e dignitosa in italiano.
- source_word: ἀγαπᾶτε
  choice: amate
  rationale: Rende direttamente l’imperativo presente di ἀγαπάω. L’imperativo italiano esprime adeguatamente il comando senza aggiungere un’esplicita sfumatura aspettuale.
- source_word: τοὺς ἐχθροὺς ὑμῶν
  choice: i vostri nemici
  rationale: Traduzione diretta e idiomatica che conserva senza attenuarla la relazione di ostilità espressa da ἐχθρός.
- source_word: προσεύχεσθε
  choice: pregate
  rationale: È la resa italiana normale dell’imperativo di προσεύχομαι e ne conserva pienamente la forza esortativa.
- source_word: ὑπὲρ
  choice: per
  rationale: Con il genitivo, nel contesto della preghiera, indica naturalmente il pregare per qualcuno o a suo favore. «Per» è preciso e più idiomatico nel testo principale.
- source_word: τῶν διωκόντων ὑμᾶς
  choice: quelli che vi perseguitano
  rationale: Rende il participio presente sostantivato conservandone il carattere verbale e la possibile continuità dell’azione, senza irrigidirlo nel sostantivo «persecutori».
theological_decisions:
- issue: Portata del comando riguardo ai nemici
  choice: Rendere direttamente entrambi gli imperativi, senza precisare in che modo debba esprimersi l’amore né quale debba essere il contenuto della preghiera.
  alternative: Esplicitare l’amore come azione benevola oppure specificare che si deve pregare per la benedizione, il ravvedimento o la conversione dei persecutori.
  rationale: Il testo comanda di amare i nemici e di pregare per chi perseguita, ma non definisce qui tutte le implicazioni pratiche né il contenuto specifico della preghiera. La traduzione conserva la forza etica e la tensione teologica senza aggiunte interpretative.
translation_notes:
  register: Italiano standard moderno, chiaro e dignitoso. La struttura breve e parallela dell’originale è conservata; i due imperativi restano netti, senza parafrasi o espansioni confessionali.
