id: MAT.5.48
reference: Matthew 5:48
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Ἔσεσθε οὖν ὑμεῖς τέλειοι ⸀ὡς ὁ πατὴρ ὑμῶν ὁ ⸀οὐράνιος τέλειός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/048.yaml
  text: You[a], therefore, shall be perfect, as your heavenly Father is perfect.
translation:
  language: it
  text: Voi dunque sarete perfetti[a], come è perfetto il Padre vostro celeste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «completi», «integri» o «maturi». Il greco τέλειος può indicare completezza, integrità o maturità, oltre che perfezione.
    reason: Alternativa lessicale che conserva l'ampiezza semantica di τέλειος nel contesto dell'amore senza parzialità.
lexical_decisions:
- source_word: Ἔσεσθε
  choice: sarete
  rationale: Il futuro indicativo di εἰμί ha qui valore esortativo. «Sarete» conserva la forma futura e la sua solennità, senza eliminare l'eventuale sfumatura di promessa; in italiano il contesto rende percepibile la forza normativa.
- source_word: οὖν
  choice: dunque
  rationale: Esprime l'inferenza tratta dall'insegnamento precedente, in particolare dall'amore esteso anche ai nemici.
- source_word: ὑμεῖς
  choice: voi
  rationale: Il pronome espresso nel greco è enfatico; mantenerlo in italiano riproduce tale rilievo senza ricorrere a una parafrasi.
- source_word: τέλειοι / τέλειός
  choice: perfetti / perfetto
  rationale: «Perfetto» è l'equivalente diretto e tradizionale e conserva sia la forza dell'esortazione sia la ripetizione retorica del greco. La nota segnala le sfumature di completezza, integrità e maturità.
- source_word: ὡς
  choice: come
  rationale: Introduce in modo naturale il confronto con il Padre.
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: il Padre vostro celeste
  rationale: Riproduce il possessivo e l'aggettivo attributivo con un ordine italiano dignitoso e naturale.
theological_decisions:
- issue: Senso di τέλειος nell'esortazione etica
  choice: perfetti
  alternative: completi, integri o maturi
  rationale: Il contesto immediato riguarda un amore non parziale, esteso anche ai nemici. «Perfetti» mantiene l'intensità e la tensione del testo, mentre la nota evita di restringere τέλειος al solo concetto moderno di impeccabilità assoluta.
- issue: Forza del futuro Ἔσεσθε
  choice: sarete
  alternative: siate; dovete essere
  rationale: Il futuro greco può svolgere una funzione imperativale o esortativa. Il futuro italiano preserva più direttamente la forma e lascia avvertire sia il comando solenne sia una possibile sfumatura prospettica, invece di risolvere l'ambiguità in modo univoco.
translation_notes:
  register: Italiano moderno, chiaro e dignitoso. Il futuro «sarete» conserva la solennità della formulazione greca; la ripetizione «perfetti/perfetto» mantiene il parallelismo del versetto.
