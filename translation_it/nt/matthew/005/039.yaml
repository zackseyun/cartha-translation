source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν μὴ ἀντιστῆναι τῷ πονηρῷ· ἀλλ’ ὅστις σε ⸀ῥαπίζει ⸀εἰς τὴν δεξιὰν ⸀σιαγόνα, στρέψον αὐτῷ καὶ τὴν ἄλλην·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/039.yaml
  text: But I say to you[a], do not resist the evil person. Instead, if anyone slaps you on the right cheek[b], turn the other to him as well.
translation:
  language: it
  text: 'Ma io vi dico: non opponetevi al malvagio.[a] Anzi, se qualcuno ti schiaffeggia sulla guancia destra, porgigli anche l’altra.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «non opponetevi al male»; in alternativa: «non opponetevi al Maligno».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: Ma io vi dico
  rationale: Mantiene il contrasto espresso da δέ e la solennità della formula, con l’enfasi esplicita di ἐγώ.
- source_word: μὴ ἀντιστῆναι
  choice: non opponetevi
  rationale: ἀνθίστημι indica il porsi contro o resistere. «Non opponetevi» conserva un senso ampio senza restringerlo alla sola vendetta, pur lasciando che l’esempio immediato chiarisca la non ritorsione.
- source_word: τῷ πονηρῷ
  choice: a chi fa il male
  rationale: La costruzione può essere neutra («al male») o personale («al malvagio»; talvolta «al Maligno»). Il riferimento personale generico è favorito dall’esempio seguente, mentre questa formulazione evita di definire l’aggressore nella sua essenza.
- source_word: ὅστις
  choice: se qualcuno
  rationale: Rende in italiano corrente il valore indefinito e quasi condizionale della costruzione.
- source_word: ῥαπίζει
  choice: schiaffeggia
  rationale: Il verbo indica tipicamente un colpo dato con la mano; nel contesto della guancia, «schiaffeggia» è preciso e conserva la sfumatura di affronto.
- source_word: εἰς τὴν δεξιὰν σιαγόνα
  choice: sulla guancia destra
  rationale: σιαγών può indicare la mascella o la guancia; qui «guancia» è l’espressione italiana naturale, mentre εἰς dopo un verbo di percussione si rende bene con «sulla».
- source_word: στρέψον αὐτῷ καὶ τὴν ἄλλην
  choice: porgigli anche l’altra
  rationale: Letteralmente il verbo significa «volgi»; «porgigli» è però l’espressione italiana naturale per il gesto descritto e non aggiunge l’idea di contrattacco. «L’altra» sottintende chiaramente «guancia».
theological_decisions:
- issue: Significato di τῷ πονηρῷ
  choice: 'riferimento personale generico: «a chi fa il male»'
  alternative: 'riferimento astratto: «al male»; riferimento personale specifico: «al Maligno»'
  rationale: La forma greca è realmente ambigua. L’esempio immediatamente successivo favorisce un agente umano, ma le altre possibilità non vanno cancellate e sono quindi conservate in nota.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. Il passaggio dal plurale «vi/opponetevi» al singolare «ti» riproduce il passaggio greco da ὑμῖν al singolare σε. La resa idiomatica «porgigli anche l’altra» evita un ordine artificioso pur mantenendo il gesto concreto del testo.
