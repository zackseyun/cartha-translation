  text: μακάριοι οἱ ἐλεήμονες, ὅτι αὐτοὶ ἐλεηθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/007.yaml
  text: Blessed are the merciful[a], for they will be shown mercy.
translation:
  language: it
  text: Beati i misericordiosi, perché riceveranno misericordia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alla lettera: «saranno trattati con misericordia». Il verbo greco è al futuro passivo.'
    reason: Segnala la forma grammaticale dell’originale e offre un’alternativa più letterale, mantenendo non espresso l’agente.
lexical_decisions:
- source_word: μακάριοι
  choice: Beati
  rationale: È la formulazione italiana tradizionale e tuttora naturale delle beatitudini; esprime una condizione di favore e benessere che va oltre la semplice felicità soggettiva.
- source_word: οἱ ἐλεήμονες
  choice: i misericordiosi
  rationale: L’articolo con l’aggettivo ha valore sostantivato. «I misericordiosi» conserva la forma concisa e proverbiale e mantiene il legame lessicale con «misericordia» nella promessa.
- source_word: ὅτι
  choice: perché
  rationale: Introduce la ragione della beatitudine ed è chiaro e naturale nell’italiano contemporaneo.
- source_word: αὐτοὶ
  choice: essi, reso implicitamente dal soggetto verbale
  rationale: 'Il pronome greco è enfatico e sottolinea la corrispondenza: proprio i misericordiosi riceveranno misericordia. In italiano il soggetto sottinteso evita una formulazione pesante; la struttura parallela conserva sufficientemente l’enfasi.'
- source_word: ἐλεηθήσονται
  choice: riceveranno misericordia
  rationale: Il futuro passivo di ἐλεάω è reso con una locuzione italiana naturale che conserva la ripetizione della radice semantica di misericordia. La nota segnala la forma passiva più letterale.
theological_decisions:
- issue: Identità di chi concede la misericordia promessa
  choice: 'Non specificare l’agente: «riceveranno misericordia»'
  alternative: «Dio avrà misericordia di loro» oppure «sarà usata loro misericordia»
  rationale: Il passivo greco non nomina l’agente. Il contesto suggerisce fortemente Dio, ma esplicitarlo risolverebbe ciò che il testo lascia implicito. La resa scelta mantiene aperta la formulazione senza sacrificare la naturalezza italiana.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. La struttura breve «Beati… perché…» conserva il ritmo tradizionale della beatitudine; la ripetizione «misericordiosi/misericordia» riproduce intenzionalmente l’eco lessicale greca.
