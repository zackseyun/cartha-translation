id: MAT.5.3
reference: Matthew 5:3
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Μακάριοι οἱ πτωχοὶ τῷ πνεύματι, ὅτι αὐτῶν ἐστιν ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/003.yaml
  text: Blessed are the poor in spirit[c][b][a], because the kingdom of heaven is theirs.
translation:
  language: it
  text: Beati i poveri in spirito[a], perché di loro è il regno dei cieli.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Poveri in spirito» può anche essere inteso come «poveri spiritualmente» o «coloro che riconoscono il proprio bisogno spirituale». La traduzione conserva l'espressione greca senza limitarne il senso.
    reason: alternative_reading
  - marker: b
    text: In greco, «regno dei cieli», espressione caratteristica del Vangelo secondo Matteo.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μακάριοι
  choice: Beati
  rationale: «Beati» è la resa italiana tradizionale e tuttora naturale nelle beatitudini; esprime una condizione favorevole davanti a Dio, non un semplice sentimento di felicità.
- source_word: οἱ πτωχοὶ
  choice: i poveri
  rationale: Conserva il valore sostantivato dell'aggettivo greco e il suo senso di povertà o indigenza, senza restringerlo a «mendicanti».
- source_word: τῷ πνεύματι
  choice: in spirito
  rationale: La resa compatta conserva l'apertura interpretativa del dativo greco. «Nello Spirito» potrebbe suggerire specificamente lo Spirito Santo, mentre «spiritualmente» sarebbe più interpretativo.
- source_word: ὅτι
  choice: perché
  rationale: Introduce con chiarezza la ragione della dichiarazione di beatitudine ed è idiomatico nell'italiano moderno.
- source_word: αὐτῶν ἐστιν
  choice: di loro è
  rationale: Riproduce il presente greco e pone in rilievo il gruppo cui appartiene il regno, mantenendo anche la formulazione solenne e familiare delle beatitudini.
- source_word: ἡ βασιλεία
  choice: il regno
  rationale: «Regno» è la resa più comprensibile e consolidata, capace di evocare sia il dominio regale sia la sfera in cui esso si esercita.
- source_word: τῶν οὐρανῶν
  choice: dei cieli
  rationale: Mantiene il plurale della caratteristica espressione matteana ed è una formulazione naturale e consolidata nell'italiano biblico.
theological_decisions:
- issue: Significato di «poveri in spirito»
  choice: Conservare l'espressione «poveri in spirito» senza esplicitarla nel testo principale.
  alternative: «poveri spiritualmente», «umili», oppure «coloro che riconoscono il proprio bisogno spirituale»
  rationale: Il greco è conciso e teologicamente aperto. Una parafrasi sceglierebbe una sola interpretazione e attenuerebbe una tensione genuina del testo.
- issue: Possesso presente del regno
  choice: 'Rendere ἐστιν al presente: «di loro è».'
  alternative: «sarà di loro»
  rationale: Il testo greco usa il presente e presenta il regno come già appartenente a queste persone, non soltanto come ricompensa futura.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile, con una formulazione biblica consolidata. «Beati» e «regno dei cieli» conservano il tono solenne senza risultare arcaici. I marcatori delle note sono collocati immediatamente dopo le espressioni cui si riferiscono.
