id: MAT.5.10
reference: Matthew 5:10
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: μακάριοι οἱ δεδιωγμένοι ἕνεκεν δικαιοσύνης, ὅτι αὐτῶν ἐστιν ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/010.yaml
  text: Blessed are those who have been persecuted because of righteousness[a], for theirs is the kingdom of heaven.
translation:
  language: it
  text: Beati quelli che sono stati perseguitati a causa della giustizia[a], perché di loro è il regno dei cieli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «rettitudine». Il termine greco può riferirsi sia alla condotta conforme alla volontà di Dio sia a ciò che è giusto nei rapporti con gli altri.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: Beati
  rationale: È la formulazione italiana consueta delle beatitudini e conserva il valore dichiarativo, non semplicemente emotivo, del termine greco.
- source_word: οἱ δεδιωγμένοι
  choice: quelli che sono stati perseguitati
  rationale: L’articolo con il participio perfetto passivo indica un gruppo di persone; il passato prossimo rende in modo naturale sia l’azione subita sia la condizione che ne risulta.
- source_word: ἕνεκεν
  choice: a causa della
  rationale: Esprime chiaramente il motivo della persecuzione in italiano moderno.
- source_word: δικαιοσύνης
  choice: giustizia
  rationale: «Giustizia» è la resa italiana biblica più ampia e naturale; può comprendere sia la rettitudine conforme alla volontà di Dio sia la dimensione del giusto agire, senza restringere indebitamente il senso.
- source_word: ὅτι
  choice: perché
  rationale: Introduce in modo chiaro la ragione della dichiarazione di beatitudine.
- source_word: αὐτῶν ἐστιν
  choice: di loro è
  rationale: Mantiene l’enfasi del pronome greco e la struttura solenne della beatitudine, restando comprensibile in italiano.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: il regno dei cieli
  rationale: Riproduce l’espressione caratteristica di Matteo e conserva il plurale del testo greco, idiomatico nella tradizione biblica italiana.
theological_decisions:
- issue: Portata semantica di δικαιοσύνη
  choice: giustizia
  alternative: rettitudine
  rationale: Il termine greco può indicare la condotta conforme alla volontà di Dio e può includere una dimensione relazionale e sociale. «Giustizia» mantiene questa ampiezza; la nota segnala «rettitudine» come possibile formulazione quando si vuole evidenziare maggiormente il carattere morale.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. La formulazione conserva il ritmo tradizionale della beatitudine senza ricorrere a lessico arcaico; «di loro è» mantiene l’enfasi dell’originale.
