review_pass:
  verdict: approve
  source_fidelity: «Beati» rende adeguatamente μακάριοι nel registro delle beatitudini. «Quelli che sono stati perseguitati» riproduce il participio perfetto passivo δεδιωγμένοι, inclusa l’idea di persecuzione subita con condizione risultante. «A causa della giustizia» rende ἕνεκεν δικαιοσύνης senza ridurre indebitamente il termine a una sola sfera. «Perché di loro è il regno dei cieli» conserva la proposizione esplicativa, il possessivo enfatico e il plurale di τῶν οὐρανῶν.
  naturalness: Il testo è moderno, chiaro e dignitoso. «Di loro è» ha un tono biblico-letterario appropriato ma rimane pienamente comprensibile; «quelli che sono stati perseguitati» è naturale e rispecchia bene l’aspetto del greco.
  terminology: «Giustizia» è una scelta italiana ampia e idiomatica per δικαιοσύνη in questo contesto; la nota «rettitudine» segnala opportunamente la componente di condotta conforme alla volontà di Dio. «Regno dei cieli» rispetta l’espressione caratteristica matteana.
