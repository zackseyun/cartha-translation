  text: ἐγὼ δὲ λέγω ὑμῖν μὴ ὀμόσαι ὅλως· μήτε ἐν τῷ οὐρανῷ, ὅτι θρόνος ἐστὶν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/034.yaml
  text: 'But I say to you, do not swear at all: neither by heaven, because it is the throne of God;'
translation:
  language: it
  text: 'Ma io vi dico: non giurate affatto, né per il cielo, perché è il trono di Dio;'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: Ma io vi dico
  rationale: Mantiene il contrasto espresso da δέ e l’enfasi del pronome ἐγώ, con una formulazione italiana naturale e solenne.
- source_word: μὴ ὀμόσαι ὅλως
  choice: non giurate affatto
  rationale: Rende direttamente il divieto e conserva la forza complessiva di ὅλως, senza limitarla a una particolare categoria di giuramenti.
- source_word: μήτε ἐν τῷ οὐρανῷ
  choice: né per il cielo
  rationale: In italiano «giurare per» esprime in modo idiomatico il mezzo o l’oggetto invocato nel giuramento; μήτε introduce il primo esempio del divieto.
- source_word: ὅτι
  choice: perché
  rationale: Conserva il valore causale più immediato della congiunzione nel contesto.
- source_word: θρόνος ἐστὶν τοῦ θεοῦ
  choice: è il trono di Dio
  rationale: Riproduce fedelmente la metafora e il genitivo di appartenenza, senza parafrasi interpretative.
theological_decisions:
- issue: Portata del divieto di giurare
  choice: «non giurate affatto» conserva l’assolutezza formale dell’enunciato
  alternative: «non fate falsi giuramenti» oppure «non giurate con leggerezza»
  rationale: Il testo greco non contiene qualificazioni che restringano esplicitamente il divieto; eventuali armonizzazioni teologiche non vanno introdotte nella traduzione.
- issue: Ragione relativa al cielo
  choice: «perché è il trono di Dio»
  alternative: «poiché è il trono di Dio»
  rationale: Entrambe le rese sono causali; «perché» è moderna e chiara e conserva il nesso argomentativo senza attenuarlo.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. Si mantiene la struttura incisiva dell’antitesi («Ma io vi dico») e il punto e virgola finale, poiché il pensiero prosegue nel versetto successivo.
