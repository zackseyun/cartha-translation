id: MAT.5.11
reference: Matthew 5:11
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: μακάριοί ἐστε ὅταν ὀνειδίσωσιν ὑμᾶς καὶ διώξωσιν καὶ εἴπωσιν πᾶν ⸀πονηρὸν καθ’ ὑμῶν ψευδόμενοι ἕνεκεν ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/011.yaml
  text: Blessed are you when they insult you and persecute you and falsely say every kind of evil against you because of me[a][b][c].
translation:
  language: it
  text: Beati voi quando vi insultano[a], vi perseguitano e, mentendo, dicono contro di voi ogni sorta di male[b] a causa mia[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «vi oltraggiano».'
    reason: lexical_alternative
  - marker: b
    text: 'Oppure: «dicono ogni male contro di voi».'
    reason: lexical_alternative
  - marker: c
    text: 'Oppure: «per causa mia».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοί ἐστε
  choice: Beati voi
  rationale: Conserva la formula delle beatitudini e il suo peso teologico, in una forma italiana tradizionale ma ancora naturale e comprensibile.
- source_word: ὅταν
  choice: quando
  rationale: Introduce in modo naturale una circostanza generale o eventuale; il presente italiano rende bene il valore non limitato a un singolo episodio.
- source_word: ὀνειδίσωσιν ὑμᾶς
  choice: vi insultano
  rationale: Esprime chiaramente l'ostilità verbale in italiano moderno, senza il tono eccessivamente letterario di «oltraggiano».
- source_word: διώξωσιν
  choice: vi perseguitano
  rationale: Mantiene l'ampiezza del verbo nel contesto dell'ostilità subita a motivo dell'adesione a Gesù, senza restringerla alla violenza fisica.
- source_word: εἴπωσιν πᾶν πονηρὸν καθ’ ὑμῶν
  choice: dicono contro di voi ogni sorta di male
  rationale: Rende l'espressione greca in modo idiomatico ma ampio, conservando il riferimento a discorsi malevoli rivolti contro i discepoli.
- source_word: ψευδόμενοι
  choice: mentendo
  rationale: Il participio conserva esplicitamente l'azione del mentire e chiarisce che le accuse o affermazioni ostili sono false.
- source_word: ἕνεκεν ἐμοῦ
  choice: a causa mia
  rationale: 'Esprime direttamente il nesso causale: l''ostilità è subita a motivo di Gesù, senza aggiungere una particolare interpretazione del tipo di fedeltà coinvolta.'
theological_decisions:
- issue: Natura dell'opposizione descritta
  choice: Il versetto comprende insulti, persecuzione e affermazioni malevole false subite a motivo di Gesù.
  alternative: Limitare la persecuzione alla violenza fisica oppure ridurre l'intera opposizione alla sola calunnia.
  rationale: I tre verbi coordinati descrivono forme distinte ma connesse di ostilità; la traduzione ne preserva l'ampiezza senza ricondurle a un'unica forma.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. «Beati voi» mantiene la riconoscibile cadenza delle beatitudini; il resto della frase usa lessico corrente. La coordinazione e il participio «mentendo» seguono da vicino la struttura greca senza risultare rigidi.
