  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ὅπως γένησθε υἱοὶ τοῦ πατρὸς ὑμῶν τοῦ ⸀ἐν οὐρανοῖς, ὅτι τὸν ἥλιον αὐτοῦ ἀνατέλλει ἐπὶ πονηροὺς καὶ ἀγαθοὺς καὶ βρέχει ἐπὶ δικαίους καὶ ἀδίκους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/045.yaml
  text: so that you may become sons of your Father in heaven[a], because he makes his sun rise on evil and good[c][b], and sends rain on righteous and unrighteous.
translation:
  language: it
  text: affinché diventiate figli del Padre vostro che è nei cieli[a], perché egli fa sorgere il suo sole sui malvagi e sui buoni e fa piovere sui giusti e sugli ingiusti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Greco: «nei cieli»; l''espressione matteana indica la dimora celeste del Padre.'
    reason: lexical_clarification
lexical_decisions:
- source_word: ὅπως
  choice: affinché
  rationale: Introduce con naturalezza in italiano la finalità, senza escludere la sfumatura di risultato presente nel contesto.
- source_word: γένησθε
  choice: diventiate
  rationale: Conserva il valore dinamico dell'aoristo congiuntivo di γίνομαι, evitando di appiattirlo nel semplice «siate».
- source_word: υἱοὶ
  choice: figli
  rationale: In italiano «figli» è il normale plurale riferito alla relazione filiale e può comprendere l'insieme dei discepoli; conserva tale immagine meglio di «figli e figlie» o «persone».
- source_word: τοῦ πατρὸς ὑμῶν
  choice: del Padre vostro
  rationale: Riproduce direttamente il genitivo e mantiene il rilievo relazionale di «Padre».
- source_word: τοῦ ἐν οὐρανοῖς
  choice: che è nei cieli
  rationale: Mantiene il plurale οὐρανοῖς e la formulazione tipicamente matteana, che in italiano biblico rimane naturale e dignitosa.
- source_word: ὅτι
  choice: perché
  rationale: Esprime chiaramente il fondamento esplicativo della proposizione precedente.
- source_word: τὸν ἥλιον αὐτοῦ
  choice: il suo sole
  rationale: Conserva il possessivo esplicito αὐτοῦ, sottolineando senza amplificazioni che il sole appartiene a Dio.
- source_word: ἀνατέλλει
  choice: fa sorgere
  rationale: Con il sole come oggetto, la costruzione causativa italiana rende in modo naturale l'azione attribuita a Dio.
- source_word: ἐπὶ πονηροὺς καὶ ἀγαθοὺς
  choice: sui malvagi e sui buoni
  rationale: Rende gli aggettivi sostantivati con una coppia morale chiara e parallela, senza aggiungere «uomini» o «persone» assenti dal greco.
- source_word: βρέχει
  choice: fa piovere
  rationale: È un'espressione italiana naturale che mantiene Dio come soggetto agente e resta più vicina al verbo greco rispetto a «manda la pioggia».
- source_word: ἐπὶ δικαίους καὶ ἀδίκους
  choice: sui giusti e sugli ingiusti
  rationale: Conserva la tradizionale e comprensibile coppia morale δίκαιοι/ἄδικοι e il parallelismo della frase.
theological_decisions:
- issue: Linguaggio filiale e genere grammaticale
  choice: figli del Padre vostro
  alternative: figli e figlie del Padre vostro; persone appartenenti al Padre vostro
  rationale: Il greco usa υἱοί e sviluppa esplicitamente l'immagine della filiazione. «Figli» è in italiano il plurale non marcato consueto in questo contesto e non limita l'applicazione ai soli maschi; una parafrasi espansiva attenuerebbe il legame lessicale con il Padre.
- issue: Forza di γένησθε rispetto alla filiazione divina
  choice: diventiate
  alternative: siate; vi dimostriate
  rationale: «Diventiate» conserva la forza verbale del greco e la tensione del testo. La traduzione non specifica se si tratti di acquisire, manifestare o vivere coerentemente la condizione filiale, evitando di imporre al versetto un meccanismo soteriologico non espresso.
- issue: Provvidenza divina verso persone moralmente opposte
  choice: fa sorgere il suo sole sui malvagi e sui buoni e fa piovere sui giusti e sugli ingiusti
  alternative: concede sole e pioggia a tutti
  rationale: La formulazione concreta conserva i due parallelismi e l'affermazione della benevolenza provvidenziale di Dio senza trasformarla in una generalizzazione astratta.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. Il periodo conserva il parallelismo solenne del greco; «nei cieli» mantiene l'idioma matteano, mentre «fa sorgere» e «fa piovere» risultano naturali nell'uso contemporaneo.
