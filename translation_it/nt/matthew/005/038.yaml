base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/038.yaml
  text: You have heard that it was said[a], ‘An eye for an eye and a tooth for a tooth.’
translation:
  language: it
  text: 'Avete udito che fu detto: «Occhio per occhio e dente per dente»[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Più letteralmente: «Un occhio al posto di un occhio e un dente al posto di un dente».'
    reason: Alternativa lessicale che esplicita il valore sostitutivo di ἀντί.
lexical_decisions:
- source_word: Ἠκούσατε
  choice: Avete udito
  rationale: L’aoristo, nella formula introduttiva matteana, indica ciò che gli ascoltatori hanno ricevuto dalla tradizione; il passato prossimo italiano lo esprime naturalmente, mentre «udito» mantiene un registro dignitoso e riconoscibile.
- source_word: ὅτι
  choice: che
  rationale: Introduce il contenuto di ciò che è stato udito, secondo il normale uso dichiarativo.
- source_word: ἐρρέθη
  choice: fu detto
  rationale: Conserva la forma passiva impersonale del greco senza specificare chi abbia pronunciato la norma.
- source_word: Ὀφθαλμὸν ἀντὶ ὀφθαλμοῦ
  choice: Occhio per occhio
  rationale: La formula italiana tradizionale e idiomatica rende correttamente ἀντί come rapporto di corrispondenza o sostituzione, senza precisare oltre la portata giuridica del principio.
- source_word: καὶ
  choice: e
  rationale: Congiunzione coordinante semplice che unisce i due membri paralleli.
- source_word: ὀδόντα ἀντὶ ὀδόντος
  choice: dente per dente
  rationale: Mantiene il parallelismo e la concisione della formula legale greca.
theological_decisions:
- issue: Resa della formula giuridica citata da Gesù
  choice: «Occhio per occhio e dente per dente»
  alternative: «Un occhio al posto di un occhio e un dente al posto di un dente»
  rationale: La forma tradizionale italiana è fedele al principio talionico citato e resta immediatamente riconoscibile. Non stabilisce se la norma richieda una ritorsione letterale o limiti la pena secondo proporzione, preservando così la tensione interpretativa del testo.
translation_notes:
  register: Italiano standard moderno, conciso e dignitoso. «Avete udito» conserva il tono solenne della formula senza risultare arcaico; la citazione mantiene la sua forma proverbiale tradizionale.
