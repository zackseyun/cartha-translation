  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Ἠκούσατε ὅτι ἐρρέθη τοῖς ἀρχαίοις· Οὐ φονεύσεις· ὃς δ’ ἂν φονεύσῃ, ἔνοχος ἔσται τῇ κρίσει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/021.yaml
  text: You have heard that it was said to the ancients[a], ‘You shall not murder[c][b]; and whoever murders will be liable to judgment.’
translation:
  language: it
  text: 'Avete udito che fu detto agli antichi[a]: «Non commettere omicidio[b]; e chiunque commette omicidio sarà passibile di giudizio».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «a quelli di un tempo».'
    reason: Alternativa lessicale per τοῖς ἀρχαίοις che esplicita il riferimento a persone del passato.
  - marker: b
    text: 'Tradizionalmente: «Non uccidere»; il verbo greco indica più specificamente il commettere omicidio.'
    reason: Chiarisce che φονεύω è più specifico del generico «uccidere».
lexical_decisions:
- source_word: Ἠκούσατε
  choice: Avete udito
  rationale: Il passato prossimo rende naturalmente in italiano una tradizione ricevuta nel passato e ancora nota agli ascoltatori.
- source_word: ἐρρέθη
  choice: fu detto
  rationale: Conserva la forma passiva e non identifica oltre il testo colui che pronunciò le parole.
- source_word: τοῖς ἀρχαίοις
  choice: a quelli dei tempi antichi
  rationale: Mantiene il dativo come destinatario e indica persone vissute in epoche passate, senza identificarle più precisamente.
- source_word: Οὐ φονεύσεις
  choice: Non commettere omicidio
  rationale: φονεύω indica l'uccisione omicida, non ogni atto di uccidere; questa formulazione italiana evita l'eccessiva ampiezza del tradizionale «Non uccidere».
- source_word: ὃς δ’ ἂν φονεύσῃ
  choice: e chiunque commette omicidio
  rationale: La relativa indefinita con ἄν e congiuntivo esprime una condizione generale, resa idiomaticamente con «chiunque» e l'indicativo presente.
- source_word: ἔνοχος ἔσται
  choice: sarà sottoposto
  rationale: Esprime la responsabilità e l'esposizione a una conseguenza giudiziaria senza ridurre il senso alla sola dichiarazione di colpevolezza.
- source_word: τῇ κρίσει
  choice: al giudizio
  rationale: Conserva il senso giudiziario di κρίσις senza specificare se si tratti di un tribunale particolare o della condanna.
theological_decisions:
- issue: Resa della citazione del sesto comandamento
  choice: Non commettere omicidio
  alternative: Non uccidere
  rationale: Il verbo greco φονεύω è più ristretto del generico «uccidere» e designa l'omicidio; la resa scelta non estende il divieto a ogni forma di uccisione.
- issue: Identità del giudizio
  choice: al giudizio
  alternative: davanti al tribunale
  rationale: Il contesto è giudiziario, ma il versetto non identifica esplicitamente una specifica istituzione; la formulazione conserva questa apertura.
- issue: Estensione della citazione ricevuta
  choice: Un'unica citazione comprendente il comandamento e la conseguenza giudiziaria
  alternative: Due citazioni coordinate
  rationale: La punteggiatura antica non determina in modo definitivo i confini della citazione; il testo principale presenta l'intera unità come insegnamento ricevuto, mentre la nota conserva l'altra lettura possibile.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. «Avete udito» mantiene il tono solenne senza risultare arcaico; «a quelli dei tempi antichi» è trasparente, mentre «sarà sottoposto al giudizio» conserva il registro giudiziario e l'indeterminatezza del referente.
