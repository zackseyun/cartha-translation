base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/014.yaml
  text: You are the light of the world[a]. A city set on a hill cannot be hidden.
translation:
  language: it
  text: Voi siete la luce del mondo. Una città posta su un monte non può essere nascosta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, più letteralmente: «Una città che giace su un monte non può essere nascosta».'
    reason: κείμενη descrive letteralmente una città «giacente» o «situata»; «posta» è la resa italiana più naturale nel testo principale.
lexical_decisions:
- source_word: Ὑμεῖς
  choice: Voi
  rationale: Il pronome plurale è espresso ed enfatico in greco. In italiano «voi» rende chiaramente l’indirizzo diretto e mantiene l’enfasi senza aggiungere «proprio voi».
- source_word: τὸ φῶς
  choice: la luce
  rationale: L’articolo greco è conservato naturalmente in italiano; la metafora identifica direttamente gli ascoltatori come «la luce».
- source_word: τοῦ κόσμου
  choice: del mondo
  rationale: Rende formalmente e naturalmente il genitivo, senza introdurre l’interpretazione finalistica «per il mondo».
- source_word: οὐ δύναται
  choice: Non può
  rationale: È la resa italiana idiomatica della negazione unita al verbo di capacità e conserva il senso di impossibilità.
- source_word: πόλις
  choice: una città
  rationale: «Città» è il significato ordinario di πόλις e mantiene l’immagine proverbiale.
- source_word: κρυβῆναι
  choice: rimanere nascosta
  rationale: La forma passiva significa «essere nascosta». Con una città visibile per la sua posizione, «rimanere nascosta» è naturale in italiano e non implica necessariamente un agente che la nasconda.
- source_word: ἐπάνω ὄρους
  choice: sopra un monte
  rationale: Rende direttamente la collocazione elevata. ὄρος può indicare monte o altura; «monte» conserva il valore lessicale senza ridurlo necessariamente a «collina».
- source_word: κειμένη
  choice: situata
  rationale: Il participio descrive la città come posta o collocata in quel luogo; «situata» è corrente, preciso e dignitoso.
theological_decisions:
- issue: Identificazione metaforica dei discepoli con la luce
  choice: «Voi siete la luce del mondo»
  alternative: «Voi siete luce per il mondo»
  rationale: La formulazione conserva la metafora identificativa e il genitivo del testo greco, senza trasformarla in un’affermazione esplicitamente finalistica.
translation_notes:
  register: Italiano standard contemporaneo, naturale e dignitoso. «Voi» conserva l’enfasi del pronome greco espresso; «situata sopra un monte» mantiene l’immagine topografica senza ricorrere alla formulazione tradizionale ma meno letterale «sopra un colle».
