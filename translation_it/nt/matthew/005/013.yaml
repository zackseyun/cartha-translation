id: MAT.5.13
reference: Matthew 5:13
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Ὑμεῖς ἐστε τὸ ἅλας τῆς γῆς· ἐὰν δὲ τὸ ἅλας μωρανθῇ, ἐν τίνι ἁλισθήσεται; εἰς οὐδὲν ἰσχύει ἔτι εἰ μὴ ⸂βληθὲν ἔξω⸃ καταπατεῖσθαι ὑπὸ τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/013.yaml
  text: You are the salt of the earth. But if the salt becomes tasteless[a], with what will it be made salty? It is no longer good for anything except to be thrown out and trampled underfoot by men.
translation:
  language: it
  text: Voi siete il sale della terra. Ma se il sale perde il suo sapore, con che cosa sarà reso salato? Non serve più a nulla, se non a essere gettato fuori e calpestato dagli uomini.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oppure «dalle persone»; il greco si riferisce agli esseri umani in generale.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς
  choice: Voi
  rationale: Il pronome espresso è enfatico; «Voi» conserva naturalmente l’enfasi in italiano.
- source_word: τὸ ἅλας τῆς γῆς
  choice: il sale della terra
  rationale: γῆ può indicare terra, paese o suolo; qui «terra» esprime in modo naturale la portata generale della metafora.
- source_word: μωρανθῇ
  choice: perde il suo sapore
  rationale: Riferito al sale, il verbo indica che diventa insipido; questa formulazione italiana comunica chiaramente la perdita della sua qualità distintiva senza introdurre il senso letterale non pertinente di «diventare stolto».
- source_word: ἐν τίνι ἁλισθήσεται;
  choice: con che cosa sarà reso salato?
  rationale: Mantiene sia la domanda sul mezzo sia la forma passiva del greco, senza trasformarla esplicitamente in una domanda sul ripristino della salinità.
- source_word: εἰς οὐδὲν ἰσχύει ἔτι
  choice: Non serve più a nulla
  rationale: Nel contesto ἰσχύω esprime utilità o efficacia; «non serve più a nulla» è corrente e fedele al senso pratico.
- source_word: εἰ μὴ βληθὲν ἔξω
  choice: se non a essere gettato fuori
  rationale: Conserva l’eccezione e il valore spaziale di ἔξω in un italiano naturale.
- source_word: καταπατεῖσθαι
  choice: calpestato
  rationale: Rende direttamente l’immagine del venir pestato sotto i piedi.
- source_word: ὑπὸ τῶν ἀνθρώπων
  choice: dagli uomini
  rationale: ἀνθρώπων designa qui gli esseri umani in generale. «Uomini» conserva la forma rappresentativa tradizionale, mentre la nota chiarisce che non si parla esclusivamente dei maschi.
theological_decisions:
- issue: Valore generale di ὑπὸ τῶν ἀνθρώπων
  choice: dagli uomini
  alternative: dalle persone
  rationale: Il referente è l’umanità in senso generale, non soltanto gli individui di sesso maschile. Il testo mantiene il plurale rappresentativo e la nota esplicita l’estensione semantica, senza attribuire al passo una distinzione teologica di genere.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. La sintassi resta vicina alla domanda passiva greca, mentre «perde il suo sapore» e «non serve più a nulla» assicurano naturalezza e chiarezza.
