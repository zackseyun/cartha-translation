id: MAT.5.46
reference: Matthew 5:46
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ἐὰν γὰρ ἀγαπήσητε τοὺς ἀγαπῶντας ὑμᾶς, τίνα μισθὸν ἔχετε; οὐχὶ καὶ οἱ τελῶναι ⸂τὸ αὐτὸ⸃ ποιοῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/046.yaml
  text: For if you love those who love you[a], what reward do you have? Do not even the tax collectors do the same?
translation:
  language: it
  text: Infatti, se amate quelli che vi amano, quale ricompensa[a] ne avete? Non fanno lo stesso anche gli esattori delle tasse?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: «quale paga ne avete?». Il termine greco può indicare una paga, un salario o una ricompensa; qui si riferisce alla retribuzione nel contesto dell’insegnamento di Gesù.'
    reason: Alternativa lessicale per μισθός.
lexical_decisions:
- source_word: ἐὰν γὰρ
  choice: Infatti, se
  rationale: «Infatti» mantiene il nesso argomentativo espresso da γάρ con quanto precede, mentre «se» rende la condizione introdotta da ἐάν.
- source_word: ἀγαπήσητε
  choice: amate
  rationale: L’aoristo congiuntivo dopo ἐάν esprime qui una condizione generale; il presente italiano è la resa più naturale senza attribuire all’aspetto verbale un valore eccessivo.
- source_word: τοὺς ἀγαπῶντας ὑμᾶς
  choice: quelli che vi amano
  rationale: Il participio sostantivato indica le persone caratterizzate dal loro amore verso gli ascoltatori; la formulazione conserva anche la ripetizione della stessa radice verbale.
- source_word: τίνα μισθὸν ἔχετε
  choice: quale ricompensa ne avete
  rationale: μισθός può significare paga, salario o ricompensa. Nel contesto etico del discorso, «ricompensa» comunica bene il senso senza suggerire una dottrina meccanica del merito; «ne» rende idiomatica la frase italiana.
- source_word: οὐχὶ καὶ
  choice: Non ... anche
  rationale: οὐχί introduce una domanda retorica che presuppone una risposta affermativa, mentre καί mette in risalto il gruppo preso a confronto.
- source_word: οἱ τελῶναι
  choice: gli esattori delle tasse
  rationale: Il termine designa chi riscuoteva imposte o pedaggi. La resa è chiara per il lettore moderno ed evita l’opacità del tradizionale «pubblicani».
- source_word: τὸ αὐτὸ ποιοῦσιν
  choice: fanno lo stesso
  rationale: La formulazione italiana è naturale e riproduce direttamente l’idea di compiere la medesima azione.
theological_decisions:
- issue: Senso di μισθός nell’insegnamento etico di Gesù
  choice: ricompensa
  alternative: paga; salario; retribuzione
  rationale: Il contesto contrappone l’amore puramente reciproco alla condotta distintiva richiesta da Gesù. «Ricompensa» conserva la dimensione morale e teologica del termine senza definire il preciso meccanismo della retribuzione divina.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. «Esattori delle tasse» è preferito al tradizionale ma oggi meno trasparente «pubblicani». La domanda retorica mantiene il tono incisivo dell’originale.
