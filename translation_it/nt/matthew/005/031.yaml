base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/031.yaml
  text: But it was said[a], ‘Whoever divorces his wife, let him give her a certificate of divorce.’
translation:
  language: it
  text: 'Ma fu detto: «Chiunque divorzia dalla propria moglie, le dia un certificato di divorzio».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «Chiunque manda via sua moglie, le dia un atto di ripudio». Il verbo greco può significare «mandare via», ma in questo contesto giuridico matrimoniale si riferisce al divorzio.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐρρέθη
  choice: fu detto
  rationale: L’aoristo passivo di λέγω introduce qui, con una formula impersonale, una citazione tradizionale; «fu detto» è naturale e mantiene il legame con le formule circostanti.
- source_word: δέ
  choice: Ma
  rationale: Segnala il passaggio alla nuova formulazione e, nel contesto delle antitesi, conserva una sfumatura di contrasto.
- source_word: Ὃς ἂν
  choice: Chiunque
  rationale: Il relativo con ἄν esprime una condizione generale indefinita; «chiunque» è conciso e idiomatico.
- source_word: ἀπολύσῃ
  choice: ripudia
  rationale: Nel contesto matrimoniale e giuridico, insieme ad ἀποστάσιον, il verbo indica il congedo della moglie mediante divorzio. «Ripudia» conserva sia il senso legale sia l’eco concreta di «mandare via».
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: sua moglie
  rationale: γυνή significa qui «moglie», come richiedono il possessivo e il contesto del divorzio.
- source_word: δότω
  choice: le dia
  rationale: Il congiuntivo esortativo italiano rende in modo naturale l’imperativo di terza persona δότω e mantiene la forma prescrittiva della citazione.
- source_word: αὐτῇ
  choice: le
  rationale: Il pronome indiretto italiano esprime naturalmente il dativo «a lei».
- source_word: ἀποστάσιον
  choice: un certificato di divorzio
  rationale: Il sostantivo designa un documento scritto che attesta il divorzio; questa resa è chiara, moderna e conserva il valore giuridico.
theological_decisions:
- issue: Rapporto tra le parole citate e la disposizione mosaica sul divorzio
  choice: Presentare la frase come citazione di una formulazione legale, senza introdurre in questo versetto approvazione o disapprovazione.
  alternative: Renderla interpretativamente come un comando che approva il divorzio, oppure come semplice descrizione di un insegnamento diffuso.
  rationale: Il versetto introduce la formulazione che Gesù commenterà nel versetto successivo; la traduzione deve conservarne la forma legale senza anticipare la valutazione teologica.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. «Ripudia» è un termine tradizionale ma ancora comprensibile nel contesto giuridico-biblico; la nota chiarisce il senso concreto del verbo greco. Il marker [a] è collocato dopo l’intera citazione, cui si riferisce.
