  naturalness: Il testo è scorrevole, moderno e dignitoso. «Avere fame e sete della giustizia» è una formulazione italiana consolidata e naturale nel contesto biblico; «saranno saziati» conserva bene l'immagine concreta di fame e sete.
  terminology: «Giustizia» è una resa legittima e ampia di δικαιοσύνη in questo contesto. La nota segnala opportunamente le dimensioni di «rettitudine» e di ciò che è giusto davanti a Dio, senza imporre una lettura dottrinale. L'ancora [a] è collocata correttamente sul termine interessato.
