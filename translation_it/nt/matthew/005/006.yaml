id: MAT.5.6
reference: Matthew 5:6
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: μακάριοι οἱ πεινῶντες καὶ διψῶντες τὴν δικαιοσύνην, ὅτι αὐτοὶ χορτασθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/006.yaml
  text: Blessed are those who hunger and thirst for righteousness[a], because they will be filled.
translation:
  language: it
  text: Beati quelli che hanno fame e sete della giustizia[a], perché saranno saziati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il termine greco può indicare la giustizia, la rettitudine o ciò che è giusto davanti a Dio.
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριοι
  choice: Beati
  rationale: È la resa italiana consueta delle beatitudini e conserva il valore dichiarativo e religioso del greco, senza ridurlo al sentimento soggettivo di essere felici.
- source_word: οἱ πεινῶντες καὶ διψῶντες
  choice: quelli che hanno fame e sete
  rationale: Rende in italiano naturale i participi presenti, mantenendo l’immagine di un desiderio intenso e continuo.
- source_word: τὴν δικαιοσύνην
  choice: della giustizia
  rationale: Dopo «avere fame e sete», l’italiano richiede normalmente «di». «Giustizia» conserva l’ampiezza di δικαιοσύνη, che può comprendere rettitudine, giustizia e ciò che è conforme alla volontà di Dio; la nota esplicita questa gamma semantica.
- source_word: ὅτι
  choice: perché
  rationale: Introduce con chiarezza la ragione della dichiarazione di beatitudine.
- source_word: αὐτοὶ
  choice: '[soggetto implicito di «saranno»]'
  rationale: Il pronome greco è enfatico, ma in italiano l’esplicitazione «proprio loro» appesantirebbe la frase. Il soggetto implicito è naturale e inequivocabile.
- source_word: χορτασθήσονται
  choice: saranno saziati
  rationale: Conserva il futuro passivo e porta a compimento l’immagine della fame e della sete. Il passivo lascia implicito Dio come colui che sazia, come nel testo greco.
theological_decisions:
- issue: Ampiezza semantica di δικαιοσύνη
  choice: giustizia
  alternative: rettitudine; ciò che è giusto davanti a Dio
  rationale: Il termine greco non separa necessariamente la condotta retta dalla giustizia nei rapporti umani e dall’ordine conforme alla volontà di Dio. «Giustizia» è la resa principale più ampia e tradizionale in italiano, mentre la nota evita di restringerne il significato.
- issue: Passivo teologico in χορτασθήσονται
  choice: saranno saziati
  alternative: Dio li sazierà
  rationale: La forma passiva preserva la formulazione del greco e la sua discrezione nel lasciare implicito l’agente divino, senza introdurre nel testo ciò che l’originale non esplicita grammaticalmente.
translation_notes:
  register: Italiano moderno, chiaro e dignitoso. La formulazione conserva il ritmo conciso della beatitudine e l’immagine concreta della fame, della sete e dell’essere saziati.
