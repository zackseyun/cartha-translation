  variant: modern standard Italian
source:
  edition: SBLGNT
  text: τῷ αἰτοῦντί σε ⸀δός, καὶ τὸν θέλοντα ἀπὸ σοῦ δανίσασθαι μὴ ἀποστραφῇς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/042.yaml
  text: Give to the one who asks you[a], and do not turn away from the one who wants to borrow from you.
translation:
  language: it
  text: Da' a chi ti chiede e non voltare le spalle a chi vuole prendere in prestito da te.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «non rifiutare chi vuole prendere in prestito da te».'
    reason: Alternativa lessicale che esplicita il valore contestuale di μὴ ἀποστραφῇς, mentre il testo principale conserva l'immagine verbale.
lexical_decisions:
- source_word: αἰτοῦντί
  choice: a chi ti chiede
  rationale: Il participio presente sostantivato indica in modo generico chi rivolge una richiesta; questa resa è naturale in italiano e conserva la portata generale dell'espressione.
- source_word: δός
  choice: Da'
  rationale: L'imperativo aoristo di δίδωμι esprime un comando diretto; il semplice imperativo italiano ne mantiene la forza senza aggiunte modali.
- source_word: θέλοντα
  choice: a chi vuole
  rationale: Il participio presente sostantivato di θέλω esprime la volontà della persona; «chi vuole» è corrente e fedele.
- source_word: ἀπὸ σοῦ
  choice: da te
  rationale: La locuzione preposizionale indica la fonte da cui si prende in prestito.
- source_word: δανίσασθαι
  choice: prendere in prestito
  rationale: L'infinito medio aoristo indica il prendere a prestito; non si specifica «denaro», poiché l'oggetto non è espresso nel greco.
- source_word: μὴ ἀποστραφῇς
  choice: non voltare le spalle
  rationale: La proibizione viene resa conservando l'immagine dell'allontanarsi da qualcuno; in italiano «voltare le spalle» è naturale, benché possa implicare il senso contestuale di rifiutare.
theological_decisions:
- issue: Portata e forza del comando etico di Gesù
  choice: Rendere entrambi i membri come comandi diretti e generali, senza attenuarli né limitarli.
  alternative: Introdurre restrizioni relative al merito del richiedente, oppure esplicitare il secondo comando come «non rifiutare».
  rationale: Il testo formula ingiunzioni concise nel Discorso sul monte e non esprime qualificazioni. La traduzione ne conserva la tensione e la portata senza importare limitazioni interpretative.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. «Da'» segue la grafia tradizionale dell'imperativo di dare; «prendere in prestito» evita di specificare il denaro, assente nel testo greco.
