id: MAT.5.24
reference: Matthew 5:24
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ἄφες ἐκεῖ τὸ δῶρόν σου ἔμπροσθεν τοῦ θυσιαστηρίου καὶ ὕπαγε πρῶτον διαλλάγηθι τῷ ἀδελφῷ σου, καὶ τότε ἐλθὼν πρόσφερε τὸ δῶρόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/024.yaml
  text: leave your gift there before the altar[a], and go; first be reconciled to your brother[b], and then come and offer your gift.
translation:
  language: it
  text: lascia lì il tuo dono davanti all’altare e va’; prima riconcìliati con tuo fratello[a], poi vieni e offri il tuo dono.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il greco ha il termine maschile singolare «fratello»; in questo contesto il principio della riconciliazione può avere una portata più ampia.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφες
  choice: lascia
  rationale: L’imperativo indica di lasciare il dono nel luogo in cui si trova; «lascia» è concreto e naturale nel contesto.
- source_word: ἐκεῖ
  choice: lì
  rationale: Conserva l’indicazione spaziale espressa dal greco.
- source_word: τὸ δῶρόν σου
  choice: il tuo dono
  rationale: «Dono» rende direttamente δῶρον; il riferimento all’altare chiarisce che si tratta di un dono offerto a Dio.
- source_word: ἔμπροσθεν τοῦ θυσιαστηρίου
  choice: davanti all’altare
  rationale: Resa italiana corrente e fedele della relazione spaziale.
- source_word: ὕπαγε
  choice: va’
  rationale: Imperativo conciso di movimento, distinto dal successivo ritorno presso l’altare.
- source_word: πρῶτον
  choice: prima
  rationale: Mantiene la priorità assegnata alla riconciliazione.
- source_word: διαλλάγηθι τῷ ἀδελφῷ σου
  choice: riconcìliati con tuo fratello
  rationale: Il passivo imperativo greco invita a entrare in una condizione di riconciliazione; in italiano la costruzione idiomatica è «riconciliarsi con».
- source_word: καὶ τότε ἐλθὼν
  choice: poi vieni
  rationale: Rende in forma naturale la successione temporale e il participio subordinato, senza esplicitare più del necessario l’idea di ritorno.
- source_word: πρόσφερε τὸ δῶρόν σου
  choice: offri il tuo dono
  rationale: «Offri» esprime il senso cultuale del verbo e riprende coerentemente «dono».
theological_decisions:
- issue: Portata di ἀδελφός nell’esortazione alla riconciliazione
  choice: tuo fratello
  alternative: tuo fratello o tua sorella; il tuo prossimo
  rationale: Il testo greco usa il sostantivo maschile singolare ἀδελφός. La traduzione ne conserva la forma senza restringere in nota la portata del principio etico ai soli fratelli maschi.
translation_notes:
  register: Italiano moderno, chiaro e dignitoso. La sequenza degli imperativi resta incisiva; «riconcìliati con» è idiomatico in italiano e conserva la forza relazionale del greco.
