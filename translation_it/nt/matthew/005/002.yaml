  yaml_path: translation/nt/matthew/005/002.yaml
  text: 'And he opened his mouth and taught them[a], saying:'
translation:
  language: it
  text: 'E, aperta la bocca, insegnava loro dicendo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Conserva il semplice collegamento narrativo del greco senza aggiungere una sfumatura temporale più marcata.
- source_word: ἀνοίξας
  choice: aperta
  rationale: Il participio aoristo indica un'azione antecedente; la costruzione italiana «aperta la bocca» ne conserva sia il rapporto temporale sia il tono solenne.
- source_word: τὸ στόμα αὐτοῦ
  choice: la bocca
  rationale: Nella costruzione assoluta italiana il possessore è chiaramente il soggetto; il possessivo sarebbe possibile ma meno scorrevole. L'immagine concreta dell'originale resta intatta.
- source_word: ἐδίδασκεν
  choice: insegnava
  rationale: L'imperfetto italiano rende naturalmente l'aspetto imperfettivo del verbo greco, presentando l'insegnamento come azione in corso.
- source_word: αὐτοὺς
  choice: loro
  rationale: Mantiene il referente pronominale senza identificarlo più precisamente di quanto faccia questo versetto.
- source_word: λέγων
  choice: dicendo
  rationale: Riproduce il participio presente che introduce direttamente il contenuto dell'insegnamento.
theological_decisions: []
translation_notes:
  register: Italiano moderno, dignitoso e aderente alla struttura greca. La formula «aperta la bocca» conserva il carattere solenne dell'introduzione al discorso, mentre «insegnava» preserva l'aspetto dell'imperfetto.
