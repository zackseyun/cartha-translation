id: MAT.5.19
reference: Matthew 5:19
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ὃς ἐὰν οὖν λύσῃ μίαν τῶν ἐντολῶν τούτων τῶν ἐλαχίστων καὶ διδάξῃ οὕτως τοὺς ἀνθρώπους, ἐλάχιστος κληθήσεται ἐν τῇ βασιλείᾳ τῶν οὐρανῶν· ὃς δ’ ἂν ποιήσῃ καὶ διδάξῃ, οὗτος μέγας κληθήσεται ἐν τῇ βασιλείᾳ τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/019.yaml
  text: Therefore[a], whoever relaxes one of the least of these commandments and teaches others to do so will be called least in the kingdom of heaven; but whoever does them and teaches them[b], this one will be called great in the kingdom of heaven.
translation:
  language: it
  text: Perciò, chiunque attenui uno dei più piccoli di questi comandamenti e insegni agli altri a fare lo stesso sarà chiamato il più piccolo nel regno dei cieli; ma chi li metta in pratica e li insegni, costui sarà chiamato grande nel regno dei cieli.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Perciò
  rationale: Rende il nesso inferenziale con quanto precede in modo naturale e dignitoso.
- source_word: λύσῃ
  choice: avrà attenuato
  rationale: Nel contesto dei comandamenti, λύω indica l'allentamento della loro forza vincolante; «attenuare» conserva questa sfumatura meglio del più generico «trasgredire».
- source_word: μίαν τῶν ἐντολῶν τούτων τῶν ἐλαχίστων
  choice: anche uno solo di questi comandamenti, fra i più piccoli
  rationale: Conserva sia l'enfasi su un singolo comandamento sia la classificazione espressa da ἐλαχίστων, evitando una costruzione italiana ambigua.
- source_word: διδάξῃ οὕτως τοὺς ἀνθρώπους
  choice: avrà insegnato agli altri a fare altrettanto
  rationale: «Agli altri» rende naturalmente il valore generico di τοὺς ἀνθρώπους; «fare altrettanto» esplicita il riferimento di οὕτως all'attenuazione del comandamento.
- source_word: ἐλάχιστος κληθήσεται
  choice: sarà chiamato piccolo
  rationale: Riproduce direttamente il futuro passivo di καλέω e conserva il contrasto comparativo senza trasformarlo in esclusione dal regno.
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: nel regno dei cieli
  rationale: È la resa italiana tradizionale e tuttora comprensibile dell'espressione caratteristica di Matteo, mantenendo il plurale greco.
- source_word: ποιήσῃ καὶ διδάξῃ
  choice: li avrà messi in pratica e insegnati
  rationale: Con i comandamenti come oggetto sottinteso, «mettere in pratica» comunica idiomaticamente ποιέω senza introdurre l'idea più specifica di osservanza perfetta.
- source_word: οὗτος
  choice: costui
  rationale: Mantiene l'enfasi del dimostrativo e il netto contrasto con la persona descritta nella prima proposizione.
- source_word: μέγας
  choice: grande
  rationale: È l'equivalente diretto e conserva il parallelismo antitetico con «piccolo».
theological_decisions:
- issue: Condizione di «piccolo/grande» nel regno
  choice: Conservare una distinzione di condizione all'interno del regno senza spiegarne ulteriormente la natura.
  alternative: Interpretare «piccolo» come esclusione dal regno oppure «grande» come grado tecnico di ricompensa.
  rationale: Il testo dice «nel regno dei cieli» e non definisce se si tratti di reputazione, rango o ricompensa; la traduzione mantiene questa tensione.
- issue: Referente generico di τοὺς ἀνθρώπους
  choice: «agli altri»
  alternative: «agli uomini»
  rationale: Il plurale greco ha qui valore genericamente umano. In italiano moderno «agli altri» rende il referente inclusivo senza alterare il senso o appesantire il testo.
- issue: Rapporto fra fare e insegnare
  choice: Mantenere entrambi gli elementi coordinati, senza affermare merito salvifico.
  alternative: Parafrasare come osservanza meritoria che determina l'ingresso o il rango nel regno.
  rationale: Il versetto collega pratica e insegnamento all'essere chiamato grande, ma non esplicita una dottrina della salvezza o del merito.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. Il futuro anteriore rende con naturalezza la protasi eventuale greca seguita dal futuro. La ripetizione di «nel regno dei cieli» conserva il parallelismo retorico dell'originale.
