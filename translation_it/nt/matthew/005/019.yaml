revisions:
- from: Perciò, chi avrà attenuato anche uno solo di questi comandamenti, fra i più piccoli, e avrà insegnato agli altri a fare altrettanto, sarà chiamato piccolo nel regno dei cieli; chi invece li avrà messi in pratica e insegnati, costui sarà chiamato grande nel regno dei cieli.
  to: Perciò, chiunque attenui uno dei più piccoli di questi comandamenti e insegni agli altri a fare lo stesso sarà chiamato il più piccolo nel regno dei cieli; ma chi li metta in pratica e li insegni, costui sarà chiamato grande nel regno dei cieli.
  rationale: 'La revisione conserva l''ambiguità e il tenore del testo greco: «attenui» mantiene il senso contestuale di λύω senza ridurlo alla sola trasgressione; «uno dei più piccoli» rende il genitivo partitivo con il superlativo; i congiuntivi evitano l''anteriorità introdotta dal futuro anteriore. Il dimostrativo enfatico οὗτος è mantenuto con «costui».'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:43:20Z'
review_pass:
  verdict: revise
  source_fidelity: 'La resa di λύσῃ come «attenuare» coglie bene l''idea di allentare la forza vincolante di un comandamento. Tuttavia, il futuro anteriore («avrà attenuato / avrà insegnato / avrà messo») introduce una precedenza temporale non espressa dal greco; la costruzione con ἐὰν e congiuntivi aoristi è resa meglio in italiano da congiuntivi in una relativa indefinita. Inoltre ἐλάχιστος è un superlativo: «il più piccolo» è più fedele di «piccolo».'
  naturalness: «Uno dei più piccoli di questi comandamenti» è più chiaro e aderente di «uno solo di questi comandamenti, fra i più piccoli». La sequenza «chiunque attenui ... e insegni ...; ma chi ... metta in pratica e insegni» è naturale in registro biblico italiano moderno e conserva il parallelismo.
  terminology: «Regno dei cieli», «mettere in pratica» e «costui» sono appropriati. «Agli altri» comunica senza difficoltà il riferimento umano generico di τοὺς ἀνθρώπους. Non sono necessarie note; in particolare, non va riprodotta la nota inglese b, poiché è ancorata a un punto diverso e descrive un termine assente dalla resa italiana.
  issues:
  - severity: medium
    issue: Uso del futuro anteriore nella protasi
    rationale: «Avrà attenuato» e forme parallele possono suggerire che l'azione sia già compiuta prima della designazione futura. Il greco esprime invece una condizione eventuale, senza tale anteriorità.
  - severity: medium
    issue: «Piccolo» non riproduce il superlativo ἐλάχιστος
    rationale: Il contrasto greco è tra «il più piccolo/minimo» e «grande», non semplicemente tra «piccolo» e «grande».
  - severity: low
    issue: Costruzione del sintagma «uno ... fra i più piccoli»
    rationale: La formulazione proposta rende più trasparente che il comandamento è uno appartenente al gruppo dei più piccoli.
  revised_text: Perciò, chiunque attenui uno dei più piccoli di questi comandamenti e insegni agli altri a fare lo stesso sarà chiamato il più piccolo nel regno dei cieli; ma chi li metta in pratica e li insegni, costui sarà chiamato grande nel regno dei cieli.
  revised_footnotes: []
  revision_rationale: 'La revisione conserva l''ambiguità e il tenore del testo greco: «attenui» mantiene il senso contestuale di λύω senza ridurlo alla sola trasgressione; «uno dei più piccoli» rende il genitivo partitivo con il superlativo; i congiuntivi evitano l''anteriorità introdotta dal futuro anteriore. Il dimostrativo enfatico οὗτος è mantenuto con «costui».'
