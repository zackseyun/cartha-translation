  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν ὅτι πᾶς ὁ ὀργιζόμενος τῷ ἀδελφῷ ⸀αὐτοῦ ἔνοχος ἔσται τῇ κρίσει· ὃς δ’ ἂν εἴπῃ τῷ ἀδελφῷ αὐτοῦ· Ῥακά, ἔνοχος ἔσται τῷ συνεδρίῳ· ὃς δ’ ἂν εἴπῃ· Μωρέ, ἔνοχος ἔσται εἰς τὴν γέενναν τοῦ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/022.yaml
  text: But I say to you that everyone who is angry with his brother will be liable to the judgment[a]; and whoever says to his brother, ‘Raca,’ will be liable to the council; and whoever says[e][d][c][b], ‘Fool,’ will be liable to the Gehenna of fire.
translation:
  language: it
  text: 'Ma io vi dico che chiunque si adira contro suo fratello[a] sarà passibile di giudizio; e chi dice a suo fratello: «Racà»[b] sarà chiamato a rispondere davanti al consiglio[c]; e chi dice: «Stolto» sarà passibile della Geenna di fuoco[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alcuni manoscritti aggiungono «senza motivo» dopo «si adira contro suo fratello». La lezione più antica e meglio attestata omette queste parole. Il termine «fratello», al maschile singolare nel greco, può avere qui valore rappresentativo e non riguarda necessariamente soltanto i fratelli maschi.
    reason: textual_variant_and_lexical_note
  - marker: b
    text: «Racà» è un insulto aramaico, equivalente all'incirca a «testa vuota» o «buono a nulla».
    reason: cultural_note
  - marker: c
    text: O «davanti al Sinedrio», il supremo consiglio giudaico; il termine greco può però indicare più genericamente un consiglio o tribunale.
    reason: alternative_reading
  - marker: d
    text: O «dell'inferno di fuoco». «Geenna» conserva il termine specifico usato da Gesù, derivato dalla valle di Innom e legato all'immagine del giudizio.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: Ma io vi dico
  rationale: Conserva il contrasto introdotto da δέ e l'enfasi del pronome espresso ἐγώ, in un italiano naturale e solenne.
- source_word: πᾶς ὁ ὀργιζόμενος
  choice: chiunque si adira
  rationale: Rende il participio presente sostantivato come affermazione generale, senza specificare indebitamente né l'insorgere né la durata dell'ira.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: contro suo fratello
  rationale: Il dativo retto da ὀργίζομαι indica la persona verso cui è diretta l'ira; «contro» è idiomatico e mantiene il maschile singolare rappresentativo del greco.
- source_word: ἔνοχος ἔσται
  choice: sarà passibile
  rationale: Esprime la responsabilità e l'esposizione a una conseguenza giudiziaria, mantenendo il parallelismo giuridico delle tre clausole.
- source_word: τῇ κρίσει
  choice: di giudizio
  rationale: Mantiene aperta l'ambiguità fra giudizio in senso generale e tribunale locale, senza imporre un referente più specifico del testo.
- source_word: Ῥακά
  choice: Racà
  rationale: Traslittera l'insulto aramaico conservato nel testo greco e ne segnala con l'accento finale la pronuncia italiana; il significato è spiegato in nota.
- source_word: τῷ συνεδρίῳ
  choice: davanti al consiglio
  rationale: Rende συνέδριον nel suo senso istituzionale senza identificarlo necessariamente con il Sinedrio; «davanti a» esprime naturalmente in italiano la comparizione o responsabilità dinanzi a un organo giudicante.
- source_word: Μωρέ
  choice: Stolto
  rationale: Rende il vocativo offensivo con un termine italiano dignitoso che conserva la portata morale dell'insulto, senza il senso clinico o colloquiale di «idiota».
- source_word: εἰς τὴν γέενναν τοῦ πυρός
  choice: della Geenna di fuoco
  rationale: Conserva il termine storico e teologicamente connotato γέεννα e mantiene l'immagine del fuoco espressa dal genitivo.
theological_decisions:
- issue: Resa di γέεννα
  choice: Geenna
  alternative: inferno
  rationale: «Geenna» conserva lo sfondo della valle di Innom e il linguaggio giudaico del giudizio senza riversare automaticamente nel passo tutte le associazioni sviluppatesi intorno al termine italiano «inferno».
- issue: Portata di ἀδελφός
  choice: fratello
  alternative: fratello o sorella; prossimo
  rationale: Il testo ha un maschile singolare, qui mantenuto; la sua possibile funzione rappresentativa più ampia viene chiarita in nota senza sostituire al termine una specificazione interpretativa.
- issue: Identificazione di συνέδριον
  choice: consiglio
  alternative: Sinedrio
  rationale: Il sostantivo può indicare un consiglio o tribunale e, in certi contesti, il Sinedrio. La resa scelta evita di risolvere un'identificazione non certa.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. La struttura tripartita e il crescente linguaggio giudiziario dell'originale sono conservati. «Passibile» mantiene il registro forense senza risultare arcaico; «Racà» e «Geenna» preservano il colore storico del testo e sono chiariti in nota.
