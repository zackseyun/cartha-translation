source:
  edition: SBLGNT
  text: ἀμὴν γὰρ λέγω ὑμῖν, ἕως ἂν παρέλθῃ ὁ οὐρανὸς καὶ ἡ γῆ, ἰῶτα ἓν ἢ μία κεραία οὐ μὴ παρέλθῃ ἀπὸ τοῦ νόμου, ἕως ἂν πάντα γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/018.yaml
  text: For truly I say to you[a], until heaven and earth pass away[c][b], not one iota or one stroke will ever pass away from the law until all things happen.
translation:
  language: it
  text: 'Infatti, in verità vi dico: finché non passino il cielo e la terra, neppure uno iota[a] o un solo tratto[b] passerà mai dalla Legge, finché tutto non sia avvenuto.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «una sola lettera»; il greco nomina lo iota, la più piccola lettera dell''alfabeto greco.'
    reason: lexical_alternative
  - marker: b
    text: 'Oppure: «un solo apice»; si tratta di un minuscolo segno grafico capace di distinguere una lettera da un''altra.'
    reason: lexical_alternative
  - marker: c
    text: 'Oppure: «finché tutto non sia compiuto» o «finché ogni cosa non si realizzi».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: in verità
  rationale: Nelle parole di Gesù introduce una solenne affermazione autorevole. «In verità» è naturale nel registro biblico italiano contemporaneo senza lasciare il prestito semitico non tradotto.
- source_word: γὰρ
  choice: perché
  rationale: Mantiene il valore esplicativo rispetto a quanto precede e collega il versetto all'affermazione di Matteo 5:17.
- source_word: λέγω ὑμῖν
  choice: vi dico
  rationale: Resa diretta e idiomatica che conserva il tono autorevole dell'enunciato.
- source_word: ἕως ἂν παρέλθῃ
  choice: finché non passino
  rationale: Esprime la contingenza futura e conserva il senso di venir meno o passare proprio di παρέρχομαι, in forma italiana naturale con «finché non».
- source_word: ὁ οὐρανὸς καὶ ἡ γῆ
  choice: il cielo e la terra
  rationale: Riproduce direttamente la coppia cosmica e conserva gli articoli richiesti dall'italiano.
- source_word: ἰῶτα ἓν
  choice: un solo iota
  rationale: Mantiene il nome specifico della lettera greca e rende esplicito con «solo» il valore enfatico del numerale.
- source_word: μία κεραία
  choice: un solo tratto
  rationale: Indica in modo comprensibile un minuscolo segno grafico che distingue le lettere, evitando l'arcaico «apice» come unica resa possibile.
- source_word: οὐ μὴ παρέλθῃ
  choice: passerà mai
  rationale: Con «neppure» anteposto e «mai» si riproduce in italiano la forte negazione οὐ μή senza appesantire la frase.
- source_word: ἀπὸ τοῦ νόμου
  choice: dalla legge
  rationale: Conserva la formulazione greca senza restringere esplicitamente νόμος al solo Pentateuco né estenderlo all'intera Scrittura.
- source_word: ἕως ἂν πάντα γένηται
  choice: finché tutto non sia avvenuto
  rationale: Rende γίνομαι nel suo ampio senso di accadere o giungere a realizzazione, senza decidere se l'accento cada esclusivamente sull'adempimento profetico.
theological_decisions:
- issue: Portata di νόμος
  choice: «la legge», intesa nel contesto come la legge scritturale di Dio
  alternative: «la Legge» come designazione tecnica della Torah, oppure per estensione l'intero Antico Testamento
  rationale: Il contesto immediato parla della «Legge e dei Profeti», ma il solo sostantivo νόμος non obbliga la traduzione a definire qui con precisione l'estensione del referente. La minuscola conserva questa apertura.
- issue: Senso di πάντα γένηται
  choice: «finché tutto non sia avvenuto»
  alternative: «finché tutto non sia compiuto» oppure «finché ogni cosa non si realizzi»
  rationale: La formulazione principale conserva il senso ampio del venire all'esistenza o accadere; la nota segnala la possibile sfumatura di compimento senza imporre uno specifico schema teologico.
translation_notes:
  register: Italiano standard moderno, dignitoso ma accessibile. La struttura solenne e la ripetizione di «finché» seguono da vicino il greco; «passerà mai dalla legge» conserva deliberatamente l'immagine e il verbo ripetuto della fonte, pur mantenendo una sintassi italiana comprensibile.
