  naturalness: Il testo è scorrevole e di registro moderno e dignitoso. «La rende adultera» è italiano naturale e più aderente al costrutto, senza richiedere una costruzione artificiosa.
  terminology: «Ripudia», «moglie», «immoralità sessuale» e «commette adulterio» sono scelte appropriate. «Immoralità sessuale» mantiene deliberatamente l'ampiezza di porneia. Le note devono distinguere con precisione l'alternativa attiva dalla forma passiva del greco.
