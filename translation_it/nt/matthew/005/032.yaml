source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν ὅτι ⸂πᾶς ὁ ἀπολύων⸃ τὴν γυναῖκα αὐτοῦ παρεκτὸς λόγου πορνείας ποιεῖ αὐτὴν ⸀μοιχευθῆναι, καὶ ὃς ἐὰν ἀπολελυμένην γαμήσῃ μοιχᾶται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/032.yaml
  text: But I say to you that everyone who divorces his wife[a], except on the ground of sexual immorality, makes her commit adultery[b]; and whoever marries a divorced woman commits adultery.
translation:
  language: it
  text: Ma io vi dico che chiunque ripudia sua moglie, salvo in caso di immoralità sessuale[a], la rende adultera[b]; e chiunque sposa una donna ripudiata commette adulterio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il greco porneia è un termine ampio per indicare comportamenti sessuali illeciti; può anche essere reso «fornicazione» o «impudicizia».
    reason: lexical_alternative
  - marker: b
    text: Più letteralmente, «la fa diventare adultera»; l'infinito greco è di forma passiva. La resa «la induce a commettere adulterio» esplicita una possibile interpretazione idiomatica, ma non è richiesta dalla forma greca.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολύων / ἀπολελυμένην
  choice: ripudia / donna ripudiata
  rationale: Nel contesto matrimoniale ἀπολύω indica il ripudio, cioè lo scioglimento del rapporto coniugale. «Ripudiare» conserva il contesto storico-giuridico senza ridurre il gesto al semplice mandare via e permette di rendere coerentemente entrambi i participi.
- source_word: γυναῖκα
  choice: moglie
  rationale: Benché γυνή possa significare «donna» o «moglie», il possessivo αὐτοῦ e il contesto del ripudio richiedono qui «moglie».
- source_word: παρεκτὸς λόγου πορνείας
  choice: salvo in caso di immoralità sessuale
  rationale: παρεκτός introduce una vera eccezione; λόγου indica qui un caso o motivo. «Immoralità sessuale» mantiene l'ampiezza di πορνεία senza limitarla al solo adulterio o a uno specifico atto illecito.
- source_word: ποιεῖ αὐτὴν μοιχευθῆναι
  choice: la induce a commettere adulterio
  rationale: La costruzione causativa ποιέω con infinito esprime che il ripudio porta la moglie all'adulterio. Questa resa è idiomatica in italiano; una nota conserva la forma passiva e la possibile sfumatura risultativa dell'infinito greco.
- source_word: ὃς ἐὰν ... γαμήσῃ
  choice: chiunque sposa
  rationale: La relativa con ἐάν esprime una condizione generale indefinita, resa naturalmente con «chiunque».
- source_word: μοιχᾶται
  choice: commette adulterio
  rationale: È la resa italiana corrente e precisa del verbo nel presente greco, qui usato come affermazione generale.
- source_word: πᾶς ὁ ἀπολύων
  choice: chiunque ripudia
  rationale: La costruzione participiale maschile singolare ha valore generale. «Chiunque» ne comunica la portata, mentre «sua moglie» mantiene visibile la situazione maschile specificamente descritta.
theological_decisions:
- issue: Portata della clausola d'eccezione παρεκτὸς λόγου πορνείας
  choice: 'Renderla come eccezione reale: «salvo in caso di immoralità sessuale».'
  alternative: «eccetto che per un'unione illegittima» oppure una formulazione che non riconosca una vera eccezione
  rationale: La sintassi presenta chiaramente un'eccezione, ma πορνεία non ne definisce qui in modo esaustivo l'esatta estensione. La traduzione conserva quindi l'ampiezza del termine senza imporre una particolare interpretazione ecclesiale.
- issue: Valore di μοιχευθῆναι dopo ποιεῖ
  choice: Usare nel testo «la induce a commettere adulterio», segnalando in nota la sfumatura passiva o risultativa.
  alternative: «la fa diventare adultera» oppure «fa sì che si commetta adulterio contro di lei»
  rationale: L'infinito è passivo nella forma, ma la costruzione può essere intesa in senso causativo e idiomaticamente attivo. La nota evita di cancellare l'ambiguità grammaticale e la tensione interpretativa.
translation_notes:
  register: Italiano moderno, chiaro e dignitoso. «Ripudiare» è preferito a «divorziare» perché conserva il contesto storico e il valore matrimoniale del verbo greco; «immoralità sessuale» è accessibile senza restringere indebitamente πορνεία. I marcatori di nota sono collocati accanto alle espressioni cui si riferiscono.
