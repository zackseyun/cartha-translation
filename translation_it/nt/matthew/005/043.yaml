  text: Ἠκούσατε ὅτι ἐρρέθη· Ἀγαπήσεις τὸν πλησίον σου καὶ μισήσεις τὸν ἐχθρόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/043.yaml
  text: You have heard that it was said[a], ‘You shall love your neighbor and hate your enemy.’
translation:
  language: it
  text: 'Avete udito che fu detto[a]: «Amerai il tuo prossimo e odierai il tuo nemico».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La prima parte richiama Levitico 19:18; la seconda («e odierai il tuo nemico») non è una citazione diretta dell’Antico Testamento, ma riflette un insegnamento tramandato che Gesù sta correggendo.
    reason: cross_reference
lexical_decisions:
- source_word: Ἠκούσατε
  choice: Avete udito
  rationale: L'aoristo, in questa formula introduttiva ricorrente, indica un insegnamento ricevuto in precedenza; il passato prossimo italiano è naturale e conserva tale riferimento.
- source_word: ἐρρέθη
  choice: fu detto
  rationale: Il passivo impersonale di λέγω viene mantenuto senza precisare chi abbia parlato.
- source_word: Ἀγαπήσεις
  choice: Amerai
  rationale: Il futuro indicativo riproduce la forma ingiuntiva della citazione di Levitico 19:18 ed è idiomatico nel registro biblico italiano senza risultare oscuro.
- source_word: τὸν πλησίον σου
  choice: il tuo prossimo
  rationale: «Prossimo» è l'equivalente italiano consolidato e preciso nel contesto etico e nell'eco di Levitico 19:18.
- source_word: μισήσεις
  choice: odierai
  rationale: Il futuro parallelo ad Ἀγαπήσεις conserva la struttura e la forza ingiuntiva del detto riportato, senza attenuarne la tensione.
- source_word: τὸν ἐχθρόν σου
  choice: il tuo nemico
  rationale: «Nemico» è l'equivalente diretto e naturale nel contrasto con «prossimo».
theological_decisions:
- issue: Status della frase «e odierai il tuo nemico»
  choice: Renderla come parte del detto che Gesù riferisce di aver fatto udire ai suoi ascoltatori, senza presentarla come citazione diretta dell'Antico Testamento.
  alternative: Trattare l'intera frase come citazione scritturistica diretta oppure identificare nel testo principale la seconda parte come tradizione interpretativa.
  rationale: Il greco presenta un unico detto riferito dopo «avete udito che fu detto». La seconda parte non è però un comando testuale dell'Antico Testamento; la nota chiarisce questa distinzione senza alterare il modo in cui Gesù formula il detto.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. La formulazione conserva il parallelismo dei due futuri e il passivo impersonale dell'originale; «avete udito» rispecchia la formula didattica matteana.
