id: MAT.5.8
reference: Matthew 5:8
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: μακάριοι οἱ καθαροὶ τῇ καρδίᾳ, ὅτι αὐτοὶ τὸν θεὸν ὄψονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/008.yaml
  text: Blessed are the pure in heart[b][a], because they will see God.
translation:
  language: it
  text: Beati i puri di cuore[a], perché vedranno Dio.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «quelli che hanno il cuore puro».
    reason: Variante italiana che rende più esplicito l'ambito espresso dal dativo greco, senza cambiare il senso.
  - marker: b
    text: La promessa «vedranno Dio» può riferirsi all'accesso diretto alla presenza di Dio, incluso il suo compimento futuro; la traduzione conserva la formulazione senza restringerne il significato.
    reason: Preserva l'ampiezza teologica ed escatologica dell'espressione greca.
lexical_decisions:
- source_word: μακάριοι
  choice: Beati
  rationale: Formula naturale e consolidata delle beatitudini in italiano; esprime il favore divino e la condizione privilegiata senza ridurla a un sentimento soggettivo di felicità.
- source_word: καθαροὶ
  choice: puri
  rationale: Nel contesto indica purezza interiore e morale. «Limpidi» sarebbe più interpretativo, mentre «puliti» in italiano suggerirebbe soprattutto una condizione fisica o esteriore.
- source_word: τῇ καρδίᾳ
  choice: di cuore
  rationale: 'Resa idiomatica italiana del dativo di relazione o ambito: la purezza riguarda il cuore, inteso come centro della persona interiore, non soltanto come sede delle emozioni.'
- source_word: ὅτι
  choice: perché
  rationale: Introduce in modo chiaro e moderno il fondamento della beatitudine.
- source_word: αὐτοὶ
  choice: '[soggetto implicito di «vedranno»]'
  rationale: Il pronome greco è enfatico e identifica proprio queste persone come destinatarie della promessa. In italiano l'identità referenziale è espressa naturalmente dal soggetto sottinteso; «essi stessi» risulterebbe marcato e pesante.
- source_word: τὸν θεὸν
  choice: Dio
  rationale: Complemento oggetto diretto di ὄψονται; la resa italiana non richiede l'articolo.
- source_word: ὄψονται
  choice: vedranno
  rationale: Futuro semplice e diretto di ὁράω, reso senza ampliare o restringere la natura della visione promessa.
theological_decisions:
- issue: Significato di «vedranno Dio»
  choice: Mantenere la formulazione diretta «vedranno Dio»
  alternative: «sperimenteranno la presenza di Dio» oppure «contempleranno Dio nel compimento futuro»
  rationale: La frase può evocare l'accesso diretto alla presenza di Dio e il suo compimento futuro, ma il greco resta conciso. La traduzione conserva quindi l'ampiezza e la tensione teologica dell'espressione senza determinarne il modo o il momento.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. «Beati» conserva la forma riconoscibile della beatitudine; «puri di cuore» è naturale e mantiene l'accento sulla persona interiore. La punteggiatura separa con chiarezza la dichiarazione dalla sua motivazione.
