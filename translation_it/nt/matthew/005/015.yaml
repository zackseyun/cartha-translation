id: MAT.5.15
reference: Matthew 5:15
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: οὐδὲ καίουσιν λύχνον καὶ τιθέασιν αὐτὸν ὑπὸ τὸν μόδιον ἀλλ’ ἐπὶ τὴν λυχνίαν, καὶ λάμπει πᾶσιν τοῖς ἐν τῇ οἰκίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/015.yaml
  text: Nor do people light a lamp and put it under a basket[a], but on a lampstand[b], and it gives light to everyone in the house.
translation:
  language: it
  text: Né si accende una lampada e la si mette sotto un recipiente per misurare[a], ma sul lampadaio, e fa luce a tutti quelli che sono in casa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alla lettera, «sotto il modio». Il modio era una misura per prodotti secchi e, per estensione, il recipiente usato per misurarli; tradizionalmente, «sotto il moggio».
    reason: lexical_alternative
  - marker: b
    text: O «e risplende per tutti quelli che sono in casa».
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: Né si accende
  rationale: «Né» collega questo ulteriore esempio negativo al detto precedente; la costruzione impersonale con «si» rende naturalmente in italiano il plurale greco generico privo di soggetto espresso.
- source_word: καίουσιν λύχνον
  choice: si accende una lampada
  rationale: Con λύχνον, καίω indica idiomaticamente l'accendere una lampada. «Lampada» conserva l'immagine concreta di una lampada a olio.
- source_word: καὶ τιθέασιν αὐτὸν ὑπὸ τὸν μόδιον
  choice: per metterla sotto un recipiente per misurare
  rationale: La coordinazione greca descrive un'azione assurda conseguente all'accensione; l'infinito finale è naturale in italiano. μόδιος designa una misura per aridi e, per estensione, il relativo recipiente.
- source_word: ἀλλ’ ἐπὶ τὴν λυχνίαν
  choice: ma sul sostegno per la lampada
  rationale: λυχνία è il supporto su cui si colloca una lampada. Questa resa evita «candelabro», che può suggerire impropriamente un sostegno per candele, e «portalampada», oggi associato soprattutto a un apparecchio elettrico.
- source_word: λάμπει
  choice: fa luce
  rationale: La resa esprime in modo corrente la funzione della lampada a beneficio delle persone presenti, mantenendo il valore di λάμπω nel contesto.
- source_word: πᾶσιν τοῖς ἐν τῇ οἰκίᾳ
  choice: a tutti quelli che sono in casa
  rationale: Conserva la portata universale di πᾶσιν e il senso spaziale di οἰκίᾳ.
theological_decisions:
- issue: Soggetto plurale generico non espresso nel greco
  choice: 'costruzione impersonale: «Né si accende una lampada»'
  alternative: «Né le persone accendono una lampada»
  rationale: Il greco usa verbi alla terza persona plurale con valore generico. La forma italiana con «si» comunica la stessa generalità senza introdurre un soggetto specifico.
- issue: Rapporto tra l'accensione e il collocamento della lampada
  choice: «per metterla»
  alternative: «e la si mette»
  rationale: Il greco coordina i due verbi, ma nel proverbio il secondo descrive lo scopo assurdo dell'accensione. La resa con «per» è idiomatica in italiano e non modifica il punto teologico dell'immagine.
translation_notes:
  register: Italiano moderno, chiaro e dignitoso. La costruzione impersonale mantiene il carattere proverbiale; «recipiente per misurare» privilegia la comprensibilità, mentre la nota conserva il termine storico «modio/moggio».
