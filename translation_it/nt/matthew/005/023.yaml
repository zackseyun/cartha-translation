source:
  edition: SBLGNT
  text: ἐὰν οὖν προσφέρῃς τὸ δῶρόν σου ἐπὶ τὸ θυσιαστήριον κἀκεῖ μνησθῇς ὅτι ὁ ἀδελφός σου ἔχει τι κατὰ σοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/023.yaml
  text: Therefore, if you are offering your gift on the altar, and there remember that your brother has something against you,
translation:
  language: it
  text: Perciò, se presenti la tua offerta all'altare e lì ti ricordi che tuo fratello[a] ha qualcosa contro di te,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oppure, in senso rappresentativo, «tuo fratello o tua sorella»; il greco dice «fratello», un termine maschile singolare che in questo contesto può avere valore rappresentativo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: Perciò, se
  rationale: «Se» conserva il valore condizionale di ἐάν, mentre «perciò» rende l’inferenza espressa da οὖν e collega il versetto all’insegnamento precedente.
- source_word: προσφέρῃς
  choice: presenti
  rationale: Nel contesto cultuale προσφέρω indica il presentare o portare un’offerta. Il presente italiano rende con naturalezza la situazione generale e vivida introdotta dalla condizione.
- source_word: τὸ δῶρόν σου
  choice: la tua offerta
  rationale: δῶρον significa letteralmente «dono», ma qui designa chiaramente un dono cultuale; «offerta» comunica il referente con precisione e naturalezza senza aggiungere il tipo di sacrificio.
- source_word: ἐπὶ τὸ θυσιαστήριον
  choice: sull’altare
  rationale: ἐπί con l’accusativo, insieme all’atto di presentare l’offerta, indica il movimento o la collocazione verso/sopra l’altare; «sull’altare» conserva questa concretezza.
- source_word: κἀκεῖ
  choice: e lì
  rationale: La forma contratta κἀκεῖ significa «e lì» e mantiene il rilievo spaziale del ricordo presso l’altare.
- source_word: μνησθῇς
  choice: ti ricordi
  rationale: Il verbo medio-passivo deponente μιμνῄσκομαι è reso naturalmente con il riflessivo italiano «ricordarsi», senza specificare se il ricordo sorga spontaneamente o sia suscitato.
- source_word: ὁ ἀδελφός σου
  choice: tuo fratello
  rationale: La resa conserva il sostantivo maschile singolare del greco. Una nota segnala che nel contesto il termine può avere valore rappresentativo.
- source_word: ἔχει τι κατὰ σοῦ
  choice: ha qualcosa contro di te
  rationale: Questa locuzione rende in italiano corrente l’idea di avere un motivo di lamentela contro qualcuno, conservando l’indeterminatezza di τι, «qualcosa».
theological_decisions:
- issue: Valore del termine di parentela ἀδελφός
  choice: tuo fratello
  alternative: un tuo fratello o una tua sorella; un altro credente
  rationale: Il testo greco usa il maschile singolare «fratello». La traduzione principale ne conserva la forma, mentre la nota riconosce il possibile valore rappresentativo senza restringere o ampliare indebitamente l’applicazione etica.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. «Presenti la tua offerta» mantiene il contesto cultuale con una formulazione naturale; «sull’altare» conserva l’immagine concreta del greco. La frase resta sospesa con la virgola perché la proposizione condizionale prosegue nel versetto successivo.
