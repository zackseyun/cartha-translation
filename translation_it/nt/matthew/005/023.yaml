- from: Perciò, se presenti la tua offerta sull’altare e lì ti ricordi che tuo fratello ha qualcosa contro di te,[a]
  to: Perciò, se presenti la tua offerta all'altare e lì ti ricordi che tuo fratello[a] ha qualcosa contro di te,
  rationale: La revisione migliora la resa idiomatica di ἐπὶ τὸ θυσιαστήριον, corregge l'ancoraggio della nota e ne rende naturale la formulazione. Conserva il maschile singolare del greco nel testo principale e non trasforma l'alternativa inclusiva in una lettura obbligatoria.
