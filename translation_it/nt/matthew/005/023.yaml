review_pass:
  verdict: revise
  source_fidelity: «Perciò, se» rende bene l'inferenza di οὖν e la condizione di ἐάν; «presenti la tua offerta» riproduce adeguatamente il contesto cultuale. Per ἐπὶ τὸ θυσιαστήριον, «all'altare» è più idiomatico in italiano e conserva il valore di direzione/destinazione dell'accusativo senza implicare necessariamente che l'offerta sia già deposta sulla superficie dell'altare. «Ha qualcosa contro di te» mantiene opportunamente l'indeterminatezza di τι.
  naturalness: La frase è scorrevole in italiano standard moderno. «All'altare» è più naturale di «sull'altare» con «presentare un'offerta». La virgola finale resta necessaria, poiché il periodo condizionale prosegue nel versetto seguente.
  terminology: «Offerta», «altare» e «fratello» sono appropriati al registro e al lessico del passo. La nota inclusiva va ancorata a «fratello», non alla fine della frase, e la formulazione alternativa non deve introdurre l'innaturale «un tuo fratello».
  issues:
  - severity: low
    issue: Resa di ἐπὶ τὸ θυσιαστήριον
    rationale: «Sull'altare» è possibile, ma con «presentare» suggerisce più specificamente la collocazione fisica sulla superficie. «All'altare» è la formulazione italiana più naturale e lascia aperta la sfumatura direzionale del greco.
  - severity: medium
    issue: Posizione dell'ancora della nota
    rationale: La nota riguarda ἀδελφός («fratello»), ma l'ancora è collocata dopo «te». Va spostata subito dopo il termine cui si riferisce.
  - severity: low
    issue: Formulazione della variante nella nota
    rationale: «Un tuo fratello o una tua sorella» non è naturale né corrisponde alla costruzione del testo principale. «Tuo fratello o tua sorella» esprime chiaramente l'espansione interpretativa segnalata.
  revised_text: Perciò, se presenti la tua offerta all'altare e lì ti ricordi che tuo fratello[a] ha qualcosa contro di te,
  revised_footnotes:
  - marker: a
    text: Oppure, in senso rappresentativo, «tuo fratello o tua sorella»; il greco dice «fratello», un termine maschile singolare che in questo contesto può avere valore rappresentativo.
    reason: lexical_alternative
  revision_rationale: La revisione migliora la resa idiomatica di ἐπὶ τὸ θυσιαστήριον, corregge l'ancoraggio della nota e ne rende naturale la formulazione. Conserva il maschile singolare del greco nel testo principale e non trasforma l'alternativa inclusiva in una lettura obbligatoria.
