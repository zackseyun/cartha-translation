id: MAT.5.16
reference: Matthew 5:16
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: οὕτως λαμψάτω τὸ φῶς ὑμῶν ἔμπροσθεν τῶν ἀνθρώπων, ὅπως ἴδωσιν ὑμῶν τὰ καλὰ ἔργα καὶ δοξάσωσιν τὸν πατέρα ὑμῶν τὸν ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/016.yaml
  text: In the same way[a], let your light shine before men[b], so that they may see your good works and glorify your Father who is in the heavens.
translation:
  language: it
  text: Così risplenda la vostra luce davanti agli uomini[a], perché vedano le vostre buone opere e glorifichino il Padre vostro che è nei cieli[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Qui «uomini» indica gli esseri umani in generale, non soltanto i maschi.
    reason: lexical_alternative
  - marker: b
    text: 'Oppure «che è in cielo». Il greco usa il plurale: «nei cieli».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: Così
  rationale: Rende in modo naturale il collegamento con l’immagine precedente della lampada e indica il modo in cui la luce deve risplendere.
- source_word: λαμψάτω
  choice: risplenda
  rationale: Il congiuntivo esortativo italiano comunica con naturalezza la forza dell’imperativo greco di terza persona.
- source_word: τὸ φῶς ὑμῶν
  choice: la vostra luce
  rationale: Mantiene il singolare collettivo e rende naturalmente il genitivo possessivo.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: davanti agli uomini
  rationale: Segue da vicino il greco, nel quale ἄνθρωποι designa qui gli esseri umani in generale; una nota chiarisce il valore inclusivo.
- source_word: ὅπως
  choice: perché
  rationale: Introduce in italiano corrente la finalità espressa dalla congiunzione greca con i congiuntivi seguenti.
- source_word: ἴδωσιν
  choice: vedano
  rationale: Il congiuntivo presente italiano è la resa naturale del congiuntivo greco retto da ὅπως, senza implicare incertezza.
- source_word: τὰ καλὰ ἔργα
  choice: le vostre opere buone
  rationale: Conserva il senso di opere moralmente buone, nobili e degne; la collocazione dell’aggettivo dopo il nome mette in rilievo la loro qualità visibile.
- source_word: δοξάσωσιν
  choice: glorifichino
  rationale: Mantiene il valore teologico e il legame lessicale consueto di δοξάζω riferito a Dio.
- source_word: τὸν πατέρα ὑμῶν
  choice: il Padre vostro
  rationale: Rende naturalmente il rapporto possessivo e conserva il linguaggio relazionale centrale nel Vangelo secondo Matteo.
- source_word: τὸν ἐν τοῖς οὐρανοῖς
  choice: che è nei cieli
  rationale: Conserva il plurale del testo greco senza appiattirlo nel tradizionale singolare italiano.
theological_decisions:
- issue: Valore generico di ἀνθρώπων
  choice: davanti agli uomini
  alternative: davanti alle persone; davanti a tutti
  rationale: La formulazione conserva da vicino il sostantivo greco e la cadenza biblica italiana, mentre la nota impedisce di interpretarlo come limitato ai soli maschi.
- issue: Plurale οὐρανοῖς
  choice: che è nei cieli
  alternative: che è in cielo
  rationale: Il plurale è esplicito nel greco e può essere mantenuto in un italiano naturale e comprensibile, senza attribuirgli ulteriori distinzioni cosmologiche.
- issue: Rapporto tra opere dei discepoli e gloria di Dio
  choice: vedano le vostre opere buone e glorifichino il Padre vostro
  alternative: vedano le vostre opere buone e rendano gloria al Padre vostro
  rationale: 'La traduzione mantiene la tensione del testo: le opere sono visibili come opere dei discepoli, ma la gloria viene rivolta al Padre, senza aggiungere una spiegazione dottrinale.'
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. «Così risplenda» conserva il tono esortativo e il richiamo all’immagine precedente; «nei cieli» mantiene deliberatamente il plurale greco. Tutti i richiami di nota sono collocati accanto all’espressione pertinente.
