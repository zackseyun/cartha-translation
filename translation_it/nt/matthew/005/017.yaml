id: MAT.5.17
reference: Matthew 5:17
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Μὴ νομίσητε ὅτι ἦλθον καταλῦσαι τὸν νόμον ἢ τοὺς προφήτας· οὐκ ἦλθον καταλῦσαι ἀλλὰ πληρῶσαι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/017.yaml
  text: Do not think that I came to abolish the Law or the Prophets[b][a]; I did not come to abolish them but to fulfill them.
translation:
  language: it
  text: Non pensate che io sia venuto ad abolire la Legge o i Profeti. Non sono venuto ad abolire, ma a portare a compimento.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il verbo tradotto «portare a compimento» può anche essere reso «adempiere» o «dare piena espressione».
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ νομίσητε
  choice: Non pensate
  rationale: L’aoristo congiuntivo con μή esprime qui una proibizione. «Non pensate» è diretto, naturale e conserva la forza dell’espressione greca.
- source_word: ἦλθον
  choice: io sia venuto / sono venuto
  rationale: In italiano, dopo «che», il congiuntivo passato «sia venuto» è la resa naturale; nella seconda proposizione indipendente, «sono venuto» esprime idiomaticamente l’arrivo con rilevanza presente. La variazione è richiesta dalla sintassi italiana, non da una differenza nel greco.
- source_word: καταλῦσαι
  choice: ad abolire
  rationale: Con «la Legge o i Profeti», il verbo indica mettere da parte, annullare o privare di validità, non una distruzione materiale. «Abolire» rende chiaramente questo valore.
- source_word: τὸν νόμον ἢ τοὺς προφήτας
  choice: la Legge o i Profeti
  rationale: Le maiuscole segnalano la formula che designa le Scritture d’Israele, anziché la legge in senso generico o singoli profeti.
- source_word: ἀλλὰ πληρῶσαι
  choice: ma a portare a compimento
  rationale: '«Portare a compimento» conserva l’ampiezza di πληρόω: condurre alla pienezza, realizzare e dare piena espressione, senza imporre una sola spiegazione teologica. L’oggetto resta sottinteso come nel greco.'
theological_decisions:
- issue: Il rapporto di Gesù con «la Legge o i Profeti» espresso da πληρῶσαι
  choice: portare a compimento
  alternative: adempiere; dare piena espressione; condurre alla pienezza; confermare
  rationale: La formulazione mantiene aperte le dimensioni di realizzazione, pienezza ed espressione completa proprie del verbo nel contesto, senza ridurlo a un’unica lettura confessionale.
translation_notes:
  register: Italiano standard moderno, chiaro e dignitoso. La costruzione «la Legge o i Profeti» conserva la formula scritturistica; il punto dopo «Profeti» riproduce con naturalezza italiana il contrasto della seconda frase. L’oggetto di «portare a compimento» non viene aggiunto, rispettando l’ellissi del testo greco.
