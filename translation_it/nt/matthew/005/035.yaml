source:
  edition: SBLGNT
  text: μήτε ἐν τῇ γῇ, ὅτι ὑποπόδιόν ἐστιν τῶν ποδῶν αὐτοῦ· μήτε εἰς Ἱεροσόλυμα, ὅτι πόλις ἐστὶν τοῦ μεγάλου βασιλέως·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/035.yaml
  text: nor by the earth[a], because it is the footstool of his feet; nor by Jerusalem, because it is the city of the great King[d][c][b];
translation:
  language: it
  text: né per la terra, perché è lo sgabello dei suoi piedi[a]; né per Gerusalemme[b], perché è la città del grande Re[c];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Richiamo a Isaia 66:1: «La terra è lo sgabello dei miei piedi».'
    reason: cross_reference
  - marker: b
    text: Il greco usa εἰς, una preposizione direzionale («a/verso Gerusalemme»), che qui può avere valore idiomatico nella formula di giuramento.
    reason: lexical_alternative
  - marker: c
    text: Richiamo al Salmo 48:2, dove Gerusalemme è chiamata «la città del grande Re».
    reason: cross_reference
lexical_decisions:
- source_word: μήτε
  choice: né
  rationale: Prosegue in modo naturale la serie coordinata di divieti iniziata nel versetto precedente.
- source_word: ἐν τῇ γῇ
  choice: per la terra
  rationale: Nel contesto del giuramento, ἐν introduce ciò per cui si giura; in italiano «giurare per» è la formulazione idiomatica naturale.
- source_word: γῇ
  choice: terra
  rationale: Il contrasto con il cielo e con Gerusalemme indica la terra nel suo insieme, non un territorio particolare.
- source_word: ὅτι
  choice: perché
  rationale: Introduce esplicitamente la ragione del divieto in italiano moderno.
- source_word: ὑποπόδιόν
  choice: sgabello
  rationale: È l'equivalente italiano consueto e conserva il richiamo al linguaggio scritturale sulla sovranità di Dio.
- source_word: τῶν ποδῶν αὐτοῦ
  choice: dei suoi piedi
  rationale: Riproduce la costruzione genitivale greca e lascia implicito, come nel testo fonte, il referente divino del pronome.
- source_word: εἰς Ἱεροσόλυμα
  choice: per Gerusalemme
  rationale: In questa formula di giuramento εἰς ha valore idiomatico; «per Gerusalemme» comunica chiaramente il senso in italiano, mentre la particolare preposizione greca è segnalata in nota.
- source_word: πόλις
  choice: città
  rationale: È l'equivalente diretto e naturale nel contesto.
- source_word: τοῦ μεγάλου βασιλέως
  choice: del grande Re
  rationale: Conserva il genitivo e il registro elevato della probabile allusione al Salmo 48:2; la maiuscola segnala l'uso titolare riferito a Dio.
theological_decisions:
- issue: Referente di αὐτοῦ in «dei suoi piedi»
  choice: Pronome possessivo minuscolo, con referente lasciato implicito
  alternative: «dei Suoi piedi», esplicitando tipograficamente il riferimento a Dio
  rationale: Il greco non dispone di una distinzione tra maiuscola reverenziale e minuscola; il contesto e l'allusione a Isaia rendono riconoscibile il riferimento senza aggiungerlo al testo.
- issue: Identità del «grande Re»
  choice: «Re» con maiuscola in quanto titolo divino nell'allusione salmica
  alternative: «grande re» interamente minuscolo
  rationale: Il contesto identifica Dio come il sovrano cui appartiene Gerusalemme, e l'espressione riprende il linguaggio del Salmo 48:2; la maiuscola italiana conserva il valore titolare senza inserire il nome «Dio».
translation_notes:
  register: Italiano moderno, chiaro e dignitoso. La struttura parallela e il ritmo semitico sono conservati; il punto e virgola finale mantiene la continuità sintattica con il versetto seguente.
