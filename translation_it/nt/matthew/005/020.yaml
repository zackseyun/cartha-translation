id: MAT.5.20
reference: Matthew 5:20
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν ὅτι ἐὰν μὴ περισσεύσῃ ⸂ὑμῶν ἡ δικαιοσύνη⸃ πλεῖον τῶν γραμματέων καὶ Φαρισαίων, οὐ μὴ εἰσέλθητε εἰς τὴν βασιλείαν τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/020.yaml
  text: For I tell you that unless your righteousness exceeds that of the scribes and Pharisees[a], you will certainly not enter the kingdom of heaven.
translation:
  language: it
  text: Infatti vi dico che, se la vostra giustizia[a] non supererà quella degli scribi e dei farisei, non entrerete affatto nel regno dei cieli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «rettitudine». Il termine greco può indicare sia la giustizia sia il vivere retto secondo la volontà di Dio; qui «giustizia» conserva meglio l’ampiezza del termine nel contesto di Matteo 5.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: Infatti vi dico
  rationale: «Infatti» rende il valore esplicativo di γάρ, mentre «vi dico» conserva l’indirizzo diretto ed è naturale nell’italiano moderno.
- source_word: ἐὰν μὴ
  choice: se ... non
  rationale: Introduce con chiarezza la condizione negativa necessaria; in questa frase italiana risulta più scorrevole di «a meno che».
- source_word: περισσεύσῃ ... πλεῖον
  choice: supererà
  rationale: Il verbo con il comparativo esprime una misura maggiore. «Supererà» rende concisamente il confronto senza l’artificioso «abbonderà più».
- source_word: ὑμῶν ἡ δικαιοσύνη
  choice: la vostra giustizia
  rationale: «Giustizia» è la resa italiana tradizionale e semanticamente ampia di δικαιοσύνη; nel contesto indica il vivere conforme alla volontà di Dio, senza ridursi alla sola equità sociale o a una mera qualità interiore.
- source_word: τῶν γραμματέων καὶ Φαρισαίων
  choice: quella degli scribi e dei farisei
  rationale: «Quella» esplicita che il confronto riguarda la loro giustizia. «Scribi» e «farisei» sono le denominazioni italiane consolidate dei due gruppi.
- source_word: οὐ μὴ εἰσέλθητε
  choice: non entrerete affatto
  rationale: «Affatto» conserva la forte negazione espressa da οὐ μή con il congiuntivo aoristo, in un italiano chiaro e non arcaico.
- source_word: τὴν βασιλείαν τῶν οὐρανῶν
  choice: nel regno dei cieli
  rationale: È la formulazione italiana consolidata dell’espressione caratteristica di Matteo e conserva il plurale formale di οὐρανῶν.
theological_decisions:
- issue: Resa di δικαιοσύνη nel contesto non paolino di Matteo 5
  choice: giustizia
  alternative: rettitudine
  rationale: «Giustizia» mantiene l’ampiezza teologica del termine greco, che qui riguarda una vita retta e fedele alla volontà di Dio. «Rettitudine» chiarirebbe l’aspetto morale, ma potrebbe restringere il campo semantico e attenuare il legame con il tema matteano della giustizia.
- issue: Forza della negazione οὐ μή
  choice: non entrerete affatto
  alternative: non entrerete
  rationale: La formulazione scelta conserva l’enfasi dell’originale senza interpretare ulteriormente la natura dell’ingresso nel regno.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. La struttura condizionale resta vicina al greco, mentre «quella» rende esplicito e naturale il termine di paragone. L’enfasi della negazione è preservata con «affatto».
