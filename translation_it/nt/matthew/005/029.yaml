id: MAT.5.29
reference: Matthew 5:29
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: εἰ δὲ ὁ ὀφθαλμός σου ὁ δεξιὸς σκανδαλίζει σε, ἔξελε αὐτὸν καὶ βάλε ἀπὸ σοῦ, συμφέρει γάρ σοι ἵνα ἀπόληται ἓν τῶν μελῶν σου καὶ μὴ ὅλον τὸ σῶμά σου βληθῇ εἰς γέενναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/029.yaml
  text: But if your right eye causes you to stumble[a], tear it out and throw it away from you[b]. For it is better for you that one of your members should perish than that your whole body should be thrown into Gehenna.
translation:
  language: it
  text: Ma se il tuo occhio destro ti fa inciampare[a], strappalo e gettalo via da te. Infatti, è meglio per te che perisca uno dei tuoi membri, piuttosto che tutto il tuo corpo sia gettato nella Geenna[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: «ti fa peccare».'
    reason: lexical_alternative
  - marker: b
    text: La Geenna è la forma greca di un nome associato alla valle di Innom; tradizionalmente il termine è reso «inferno».
    reason: alternative_reading
lexical_decisions:
- source_word: σκανδαλίζει
  choice: ti fa inciampare
  rationale: Conserva la metafora del greco σκανδαλίζω, che nel contesto indica l'indurre al peccato, senza sostituirla nel testo principale con una spiegazione più restrittiva.
- source_word: ἔξελε
  choice: strappalo
  rationale: Rende con forza l'imperativo aoristo di ἐξαιρέω e mantiene l'immagine urgente e drastica del testo.
- source_word: βάλε ἀπὸ σοῦ
  choice: gettalo via da te
  rationale: «Gettalo» conserva la forza di βάλε, mentre «via da te» esprime chiaramente la separazione indicata da ἀπὸ σοῦ.
- source_word: συμφέρει
  choice: è meglio per te
  rationale: È una resa italiana naturale del vantaggio espresso da συμφέρει e si adatta alla costruzione comparativa della frase.
- source_word: ἀπόληται
  choice: perisca
  rationale: Mantiene la gravità di ἀπόλλυμι e il parallelismo con la sorte dell'intero corpo, senza precisare oltre quanto dica il greco.
- source_word: μελῶν
  choice: membri
  rationale: «Membri» designa le parti del corpo e conserva il contrasto lessicale con «tutto il tuo corpo»; «arti» sarebbe improprio per un occhio.
- source_word: βληθῇ
  choice: sia gettato
  rationale: Rende direttamente il passivo aoristo di βάλλω e conserva la forza dell'immagine.
- source_word: γέενναν
  choice: Geenna
  rationale: Traslittera il termine specifico γέεννα invece di appiattirlo sul più generale «inferno»; la nota ne chiarisce l'origine e la resa tradizionale.
- source_word: ὁ δεξιὸς
  choice: destro
  rationale: Conserva il dettaglio esplicito del testo greco.
- source_word: δὲ
  choice: Ma
  rationale: Esprime la lieve sfumatura avversativa di δέ nel rapporto con quanto precede.
theological_decisions:
- issue: Resa di γέεννα
  choice: Geenna
  alternative: inferno
  rationale: La conservazione del termine specifico evita di sovrapporre automaticamente al testo tutte le associazioni teologiche posteriori di «inferno», mentre una nota registra la resa tradizionale.
- issue: Forza metaforica di σκανδαλίζω
  choice: ti fa inciampare
  alternative: ti fa peccare
  rationale: Il testo principale mantiene l'immagine greca dell'inciampo; poiché il contesto riguarda il peccato, la nota offre la resa interpretativa senza eliminare l'ambiguità metaforica.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. La sintassi conserva il forte contrasto tra la perdita di un solo membro e la sorte dell'intero corpo; le immagini concrete e drastiche dell'originale non vengono attenuate.
