id: MAT.5.28
reference: Matthew 5:28
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν ὅτι πᾶς ὁ βλέπων γυναῖκα πρὸς τὸ ἐπιθυμῆσαι αὐτὴν ἤδη ἐμοίχευσεν αὐτὴν ἐν τῇ καρδίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/028.yaml
  text: But I say to you that everyone who looks at a woman in order to desire her has already committed adultery with her in his heart[a][b][c].
translation:
  language: it
  text: Ma io vi dico che chiunque guarda una donna[b] per desiderarla[a] ha già commesso adulterio con lei nel proprio cuore.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «per bramarla» o «per concupirla».'
    reason: Alternativa lessicale che esplicita maggiormente il carattere sessuale e illecito del desiderio nel contesto.
  - marker: b
    text: Il greco γυνή può significare «donna» oppure «moglie», secondo il contesto.
    reason: L’alternativa lessicale è rilevante perché il versetto parla di adulterio, pur senza specificare esplicitamente lo stato civile.
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: Ma io vi dico
  rationale: «Ma» conserva il contrasto di δέ; il pronome espresso «io» rende l’enfasi di ἐγώ, mentre «vi dico» è naturale e fedele a λέγω ὑμῖν.
- source_word: πᾶς ὁ βλέπων
  choice: chiunque guarda
  rationale: Rende la portata generale della costruzione senza introdurre in italiano un soggetto esplicitamente maschile non richiesto dal valore generico dell’espressione greca.
- source_word: γυναῖκα
  choice: una donna
  rationale: γυνή può significare «donna» o «moglie». In questa formulazione generale e senza articolo, «una donna» evita di precisare uno stato civile che il greco non esplicita.
- source_word: πρὸς τὸ ἐπιθυμῆσαι αὐτὴν
  choice: per desiderarla
  rationale: «Per» con l’infinito esprime in italiano lo scopo o l’intenzione indicati da πρὸς τό con l’infinito. «Desiderarla» conserva l’ampiezza lessicale di ἐπιθυμέω, mentre il contesto dell’adulterio ne chiarisce qui il carattere sessuale e illecito.
- source_word: ἤδη ἐμοίχευσεν αὐτὴν
  choice: ha già commesso adulterio con lei
  rationale: «Già» rende ἤδη; la locuzione italiana «commettere adulterio con» comunica in modo naturale il verbo μοιχεύω con il suo oggetto.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: nel proprio cuore
  rationale: Conserva l’immagine biblica del cuore come sede della vita interiore. «Proprio» chiarisce che il cuore appartiene a chi guarda, evitando l’ambiguità referenziale dell’italiano «suo».
theological_decisions:
- issue: Se γυνή debba essere reso «donna» o «moglie» nel contesto dell’adulterio
  choice: donna
  alternative: moglie
  rationale: Il contesto rende grave il desiderio descritto, ma il sostantivo greco, da solo, non specifica lo stato civile. La traduzione principale mantiene quindi il termine più ampio e segnala l’altra possibilità in nota.
- issue: Se ἐπιθυμέω debba essere reso con il più ampio «desiderare» o con un termine esplicitamente connotato come «concupire»
  choice: desiderare
  alternative: concupire; bramare
  rationale: Il verbo greco ha una gamma semantica più ampia, anche se qui il contesto indica chiaramente un desiderio sessuale illecito. «Desiderare» conserva la trasparenza lessicale senza attenuare il contesto; la nota registra una resa più esplicita.
- issue: Se πρὸς τὸ ἐπιθυμῆσαι descriva intenzione oppure soltanto una reazione interiore
  choice: per desiderarla
  alternative: guardandola con desiderio
  rationale: La costruzione πρὸς τό con l’infinito presenta normalmente finalità o direzione intenzionale. La resa mantiene questo elemento senza affermare più di quanto consenta la sintassi.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. La formulazione conserva il contrasto enfatico iniziale, il valore intenzionale della costruzione greca e l’immagine del cuore, evitando sia arcaismi nel testo principale sia precisazioni confessionali non presenti nella fonte.
