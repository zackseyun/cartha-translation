  text: ἀμὴν λέγω σοι, οὐ μὴ ἐξέλθῃς ἐκεῖθεν ἕως ἂν ἀποδῷς τὸν ἔσχατον κοδράντην.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/026.yaml
  text: Truly I tell you[b][a], you will certainly not get out of there until you have paid the last quadrans.
translation:
  language: it
  text: 'In verità ti dico: non uscirai affatto di là finché non avrai pagato l’ultimo quadrante.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il quadrante era una piccola moneta romana.
    reason: cultural_note
lexical_decisions:
- source_word: ἀμὴν
  choice: In verità
  rationale: Nella formula sinottica introduce con solennità un’affermazione autorevole; «In verità» ne comunica naturalmente la funzione in italiano moderno.
- source_word: λέγω σοι
  choice: ti dico
  rationale: Resa diretta e idiomatica della formula di allocuzione, mantenendone il tono autorevole.
- source_word: οὐ μὴ ἐξέλθῃς
  choice: non uscirai affatto
  rationale: La doppia negazione con il congiuntivo aoristo esprime una negazione enfatica; «affatto» conserva la forza senza ricorrere a una formulazione arcaica.
- source_word: ἐκεῖθεν
  choice: di là
  rationale: Indica movimento a partire da quel luogo; con «uscire», «di là» è naturale e preciso.
- source_word: ἕως ἂν ἀποδῷς
  choice: finché non avrai pagato
  rationale: Esprime il limite futuro della detenzione e il compimento del pagamento; il futuro anteriore rende chiaramente tale compimento in italiano.
- source_word: τὸν ἔσχατον κοδράντην
  choice: fino all’ultimo quadrante
  rationale: Conserva il nome della specifica moneta romana e comunica idiomaticamente l’idea del pagamento integrale, fino alla più piccola somma dovuta.
theological_decisions:
- issue: Se esplicitare nella traduzione un riferimento al giudizio finale, alla purificazione o soltanto a una situazione giudiziaria di debito e detenzione
  choice: Conservare l’immagine concreta della detenzione fino al pagamento completo
  alternative: Esplicitare un’interpretazione escatologica o purgativa
  rationale: Il greco non identifica espressamente il referente teologico della scena. La formulazione lascia intatta la tensione tra il contesto immediato della riconciliazione e le possibili implicazioni di giudizio, senza imporre una lettura confessionale.
translation_notes:
  register: Italiano moderno standard, dignitoso e accessibile. La formula «In verità ti dico» mantiene la solennità tradizionale senza risultare oscura; «quadrante» conserva la precisione storica ed è chiarito in nota.
