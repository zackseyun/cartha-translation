  text: μακάριοι οἱ εἰρηνοποιοί, ὅτι αὐτοὶ υἱοὶ θεοῦ κληθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/009.yaml
  text: Blessed are the peacemakers[a], because they will be called sons of God.
translation:
  language: it
  text: Beati quelli che si adoperano per la pace[a], perché saranno chiamati figli di Dio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alla lettera, «coloro che fanno pace»: persone che operano attivamente per stabilire la pace, non semplicemente persone pacifiche.'
    reason: Chiarisce la forza agentiva del sostantivo composto greco εἰρηνοποιοί con italiano moderno e naturale.
lexical_decisions:
- source_word: μακάριοι
  choice: Beati
  rationale: Formula italiana tradizionale e tuttora naturale per le beatitudini; esprime il favore divino e la condizione degna di essere desiderata, non una semplice emozione di felicità.
- source_word: εἰρηνοποιοί
  choice: quelli che si adoperano per la pace
  rationale: 'Rende in modo naturale la forza agentiva del composto greco: non indica soltanto persone pacifiche, ma persone che operano attivamente per produrre pace.'
- source_word: ὅτι
  choice: perché
  rationale: Introduce chiaramente in italiano la ragione della beatitudine, conservando il valore causale del greco.
- source_word: αὐτοὶ
  choice: '[soggetto sottinteso di «saranno»]'
  rationale: L'italiano esprime normalmente il pronome mediante la desinenza verbale. Inserire «proprio loro» darebbe un'enfasi più marcata e meno naturale di quella richiesta nel contesto.
- source_word: υἱοὶ θεοῦ
  choice: figli di Dio
  rationale: In italiano «figli» è il normale plurale maschile con valore rappresentativo e inclusivo, e conserva al tempo stesso il lessico filiale del greco.
- source_word: κληθήσονται
  choice: saranno chiamati
  rationale: Resa diretta del futuro passivo, senza ridurlo alla sola idea di riconoscimento sociale.
theological_decisions:
- issue: Linguaggio filiale maschile in υἱοὶ θεοῦ
  choice: figli di Dio
  alternative: figli e figlie di Dio / persone appartenenti a Dio
  rationale: «Figli» corrisponde formalmente al plurale maschile greco e, nell'uso italiano, può includere uomini e donne. Mantiene inoltre la possibile portata teologica dello status filiale senza aggiungere «figlie» al testo né attenuarlo con una parafrasi.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. La struttura conserva il ritmo della beatitudine; «si adoperano per la pace» è idiomatico e rende l'azione implicita nel composto greco.
