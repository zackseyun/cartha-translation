id: MAT.5.4
reference: Matthew 5:4
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: μακάριοι οἱ πενθοῦντες, ὅτι αὐτοὶ παρακληθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/004.yaml
  text: Blessed are those who mourn[a], because they will be comforted.
translation:
  language: it
  text: Beati quelli che piangono[a], perché saranno consolati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «quelli che fanno cordoglio». Il greco ha un significato ampio e non specifica la causa del dolore.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: Beati
  rationale: Conserva la formula tradizionale delle beatitudini e il suo valore dichiarativo e valutativo, senza ridurla al sentimento soggettivo espresso da «felici».
- source_word: οἱ πενθοῦντες
  choice: quelli che sono afflitti
  rationale: Rende in italiano naturale il participio presente sostantivato. «Afflitti» mantiene ampio il motivo del dolore, che il greco non specifica, e può includere lutto, sofferenza, peccato o altre cause di cordoglio.
- source_word: ὅτι
  choice: perché
  rationale: Esprime chiaramente il valore causale della congiunzione in italiano moderno.
- source_word: αὐτοὶ
  choice: sottinteso nel soggetto di «saranno»
  rationale: Il pronome greco ha una certa enfasi, ma in italiano «proprio loro» risulterebbe troppo marcato; la struttura della beatitudine ne comunica già adeguatamente la forza.
- source_word: παρακληθήσονται
  choice: saranno consolati
  rationale: Riproduce naturalmente il futuro passivo e il senso di ricevere consolazione.
theological_decisions:
- issue: Ampiezza del cordoglio nella beatitudine
  choice: Mantenere un riferimento ampio con «quelli che sono afflitti», senza precisare la causa.
  alternative: «quelli che piangono i propri peccati»; «quelli che sono in lutto»; «quelli che lamentano la condizione d’Israele»
  rationale: Il testo greco non indica l’oggetto o la causa del cordoglio. La formulazione ampia conserva l’apertura teologica e pastorale dell’enunciato senza imporre una lettura particolare.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. La formulazione conserva la cadenza riconoscibile della beatitudine; «sono afflitti» evita di restringere il senso al solo pianto visibile o al lutto per una morte.
