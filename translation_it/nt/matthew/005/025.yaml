id: MAT.5.25
reference: Matthew 5:25
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ἴσθι εὐνοῶν τῷ ἀντιδίκῳ σου ταχὺ ἕως ὅτου εἶ ⸂μετ’ αὐτοῦ ἐν τῇ ὁδῷ⸃, μήποτέ σε παραδῷ ὁ ἀντίδικος τῷ κριτῇ, καὶ ὁ ⸀κριτὴς τῷ ὑπηρέτῃ, καὶ εἰς φυλακὴν βληθήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/025.yaml
  text: Be well-disposed toward your accuser quickly[a], while you are with him on the way, lest your accuser hand you over to the judge, and the judge to the officer, and you be thrown into prison.
translation:
  language: it
  text: Sii subito ben disposto verso il tuo avversario[a], mentre sei in cammino con lui, perché non accada che il tuo avversario ti consegni al giudice, il giudice ti consegni alla guardia e tu venga gettato in prigione.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure, più idiomaticamente nel contesto legale: «Mettiti subito d’accordo con il tuo avversario».'
    reason: Alternativa lessicale che esplicita l’implicazione legale di ἴσθι εὐνοῶν.
lexical_decisions:
- source_word: ἴσθι εὐνοῶν
  choice: Sii ben disposto
  rationale: Conserva il senso lessicale della costruzione perifrastica, che esorta a mantenere un atteggiamento favorevole, senza trasformarla direttamente nell’idea più specifica di concludere un accordo.
- source_word: ἀντιδίκῳ / ἀντίδικος
  choice: avversario
  rationale: Nel contesto giudiziario indica la controparte legale. «Avversario» è naturale in italiano e non restringe indebitamente il ruolo a quello di accusatore formale.
- source_word: ταχὺ
  choice: subito
  rationale: Esprime in italiano corrente l’urgenza dell’esortazione.
- source_word: ἕως ὅτου εἶ μετ’ αὐτοῦ ἐν τῇ ὁδῷ
  choice: mentre sei in cammino con lui
  rationale: Mantiene l’immagine concreta del trovarsi insieme lungo il cammino senza esplicitare che la destinazione sia il tribunale.
- source_word: μήποτέ
  choice: perché ... non
  rationale: Rende in modo naturale la finalità preventiva e il tono di avvertimento della particella greca.
- source_word: παραδῷ
  choice: consegni
  rationale: Comunica chiaramente il trasferimento della persona sotto l’autorità giudiziaria.
- source_word: κριτῇ / κριτὴς
  choice: giudice
  rationale: È l’equivalente italiano diretto e appropriato nel contesto legale.
- source_word: ὑπηρέτῃ
  choice: guardia
  rationale: Nel susseguirsi di giudice, custodia e prigione designa con chiarezza il subordinato incaricato di eseguire l’ordine, evitando il significato tecnico moderno di «ufficiale giudiziario».
- source_word: εἰς φυλακὴν
  choice: in prigione
  rationale: È la resa italiana standard e conserva la gravità dell’avvertimento.
- source_word: βληθήσῃ
  choice: venga gettato
  rationale: Mantiene la forza vivida del verbo βάλλω e la forma passiva del greco.
theological_decisions:
- issue: Se rendere il comando iniziale come disposizione favorevole o come accordo legale
  choice: Sii subito ben disposto verso il tuo avversario
  alternative: Mettiti subito d’accordo con il tuo avversario
  rationale: Il contesto giudiziario rende plausibile l’idea di raggiungere un accordo, ma il verbo εὐνοέω esprime anzitutto una disposizione favorevole. Il testo principale conserva tale sfumatura, mentre la resa legale più idiomatica è segnalata in nota.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. La sintassi conserva la progressione giudiziaria del greco; «in cammino» mantiene l’immagine concreta senza aggiungere la destinazione implicita.
