  text: καὶ ὅστις σε ἀγγαρεύσει μίλιον ἕν, ὕπαγε μετ’ αὐτοῦ δύο.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/041.yaml
  text: And whoever forces you to go one mile[c][b][a], go with him two miles.
translation:
  language: it
  text: E se qualcuno ti costringe a percorrere un miglio, va' con lui per due miglia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Il verbo tradotto «costringe» può indicare l''imposizione di un servizio da parte di un''autorità, come nel contesto romano. Letteralmente, la seconda parte dice: «va'' con lui due», sottintendendo «miglia».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις
  choice: se qualcuno
  rationale: Il pronome relativo indefinito introduce un caso generale; «se qualcuno» è naturale in italiano e ne conserva la portata.
- source_word: ἀγγαρεύσει
  choice: ti costringe a fare
  rationale: Il verbo indica l'imposizione di un servizio, spesso da parte di un'autorità. La resa mantiene chiaramente la coercizione senza specificare nel testo chi la eserciti.
- source_word: μίλιον ἕν
  choice: un miglio
  rationale: Indica un miglio romano; «un miglio» rende naturalmente il sostantivo con il numerale.
- source_word: ὕπαγε
  choice: fanne
  rationale: Nel contesto, l'imperativo «va'» regge ellitticamente la distanza. «Fanne» produce un italiano corrente e collega chiaramente l'azione ai due miglia.
- source_word: μετ’ αὐτοῦ
  choice: con lui
  rationale: μετά con il genitivo esprime accompagnamento; «con lui» è la resa diretta.
- source_word: δύο
  choice: due
  rationale: Il greco sottintende «miglia», già espresso nella prima parte. In italiano «fanne ... due» conserva con naturalezza questa ellissi.
theological_decisions:
- issue: Portata storico-sociale del servizio imposto
  choice: Rendere la coercizione senza menzionare esplicitamente soldati o autorità romane nel testo principale.
  alternative: Esplicitare l'arruolamento forzato al servizio di un soldato romano.
  rationale: Il verbo e il riferimento al miglio evocano verosimilmente il servizio coatto nell'ambiente romano, ma il testo greco non nomina né soldati né Roma.
translation_notes:
  register: Italiano moderno, piano e dignitoso. «Fare un miglio» e «fanne con lui due» sono idiomatici e conservano il contrasto numerico e l'accompagnamento espressi dal greco.
