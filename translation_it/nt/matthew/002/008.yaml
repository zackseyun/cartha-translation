id: MAT.2.8
reference: Matthew 2:8
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: καὶ πέμψας αὐτοὺς εἰς Βηθλέεμ εἶπεν· Πορευθέντες ⸂ἐξετάσατε ἀκριβῶς⸃ περὶ τοῦ παιδίου· ἐπὰν δὲ εὕρητε, ἀπαγγείλατέ μοι, ὅπως κἀγὼ ἐλθὼν προσκυνήσω αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/008.yaml
  text: And after sending them to Bethlehem[a], he said, “Go and search carefully for the child, and when you find him, report to me, so that I too may come and worship him.”
translation:
  language: it
  text: 'E, dopo averli mandati a Betlemme, disse: «Andate e cercate con cura il bambino; quando lo avrete trovato, fatemelo sapere, perché anch’io venga ad adorarlo[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «a rendergli omaggio» oppure «a prostrarmi davanti a lui». Il verbo greco può indicare sia l’adorazione sia un atto di riverenza davanti a una figura regale.
    reason: lexical_alternative
lexical_decisions:
- source_word: πέμψας
  choice: dopo averli mandati
  rationale: Il participio aoristo esprime un’azione anteriore rispetto a εἶπεν; questa resa conserva la sequenza in un italiano naturale.
- source_word: Πορευθέντες
  choice: Andate
  rationale: Il participio, collegato all’imperativo ἐξετάσατε, assume valore imperativale; «Andate e cercate» è idiomatico e fedele alla costruzione.
- source_word: ἐξετάσατε ἀκριβῶς
  choice: cercate con cura
  rationale: La combinazione indica una ricerca o indagine accurata. «Cercate con cura» è chiaro nel contesto della localizzazione del bambino.
- source_word: περὶ τοῦ παιδίου
  choice: il bambino
  rationale: Con il verbo di ricerca, περί introduce ciò che si deve cercare o su cui si devono ottenere informazioni; in italiano l’oggetto diretto è la formulazione più naturale.
- source_word: παιδίου
  choice: bambino
  rationale: παιδίον designa un bambino senza richiedere qui l’aggiunta di «piccolo».
- source_word: ἐπὰν δὲ εὕρητε
  choice: quando lo avrete trovato
  rationale: La congiunzione con il congiuntivo esprime una contingenza futura attesa. Il futuro anteriore italiano rende naturalmente il compimento della ricerca prima del resoconto, senza trasformarla in certezza assoluta.
- source_word: ἀπαγγείλατέ μοι
  choice: fatemelo sapere
  rationale: Il verbo indica il comunicare o riferire una notizia. La resa italiana è naturale e mantiene l’idea di far pervenire a Erode l’informazione ottenuta.
- source_word: ὅπως
  choice: perché
  rationale: Introduce lo scopo dichiarato da Erode; «perché» seguito dal congiuntivo ne conserva il valore finale.
- source_word: κἀγὼ
  choice: anch’io
  rationale: La crasi di καὶ ἐγώ sottolinea la pretesa partecipazione di Erode alla stessa azione dei magi.
- source_word: ἐλθὼν προσκυνήσω αὐτῷ
  choice: venga ad adorarlo
  rationale: Il participio esprime un’azione connessa al verbo al congiuntivo. «Adorarlo» conserva il possibile valore cultuale di προσκυνέω, mentre la nota segnala l’altrettanto genuino senso di omaggio o prostrazione.
theological_decisions:
- issue: Valore di προσκυνήσω riferito al bambino Gesù
  choice: adorarlo
  alternative: rendergli omaggio; prostrarmi davanti a lui
  rationale: προσκυνέω può indicare sia adorazione sia un gesto di riverenza verso un sovrano. «Adorarlo» lascia emergere la risonanza teologica possibile nel racconto matteano, ma la nota conserva l’ambiguità lessicale senza attribuire sincerità alla dichiarazione ingannevole di Erode.
translation_notes:
  register: Italiano moderno, dignitoso e scorrevole. L’ordine delle azioni è esplicitato senza irrigidire i participi greci; la formulazione diretta conserva il tono dell’ordine di Erode e la nota tutela l’ambiguità di προσκυνέω.
