id: MAT.2.9
reference: Matthew 2:9
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: οἱ δὲ ἀκούσαντες τοῦ βασιλέως ἐπορεύθησαν, καὶ ἰδοὺ ὁ ἀστὴρ ὃν εἶδον ἐν τῇ ἀνατολῇ προῆγεν αὐτούς, ἕως ἐλθὼν ⸀ἐστάθη ἐπάνω οὗ ἦν τὸ παιδίον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/009.yaml
  text: After hearing the king[a], they went on their way, and behold, the star that they had seen in the east went before them until it came and stood over where the child was.
translation:
  language: it
  text: Dopo aver ascoltato il re, si misero in cammino. Ed ecco, la stella che avevano visto a oriente[a] li precedeva, finché giunse e si fermò sopra il luogo dove si trovava il bambino.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oppure «al suo sorgere». L'espressione greca può riferirsi sia all'oriente come regione o direzione, sia al sorgere di una stella.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσαντες τοῦ βασιλέως
  choice: Dopo aver ascoltato il re
  rationale: Rende il participio aoristo con una subordinata temporale naturale e conserva «il re» senza aggiungere il nome di Erode; il genitivo indica la persona ascoltata.
- source_word: ἐπορεύθησαν
  choice: si misero in cammino
  rationale: Esprime in italiano corrente l'avvio del viaggio dopo l'udienza, senza introdurre una destinazione non esplicitata.
- source_word: ἰδοὺ
  choice: Ed ecco
  rationale: Conserva il segnale discorsivo che richiama l'attenzione e conferisce vivacità alla narrazione.
- source_word: ἀστήρ
  choice: stella
  rationale: È l'equivalente lessicale diretto e appropriato al contesto.
- source_word: ὃν εἶδον
  choice: che avevano visto
  rationale: Il trapassato prossimo chiarisce naturalmente che l'avvistamento precede l'azione narrata.
- source_word: ἐν τῇ ἀνατολῇ
  choice: a oriente
  rationale: Mantiene nel testo la lettura geografica tradizionale e naturale, mentre la possibile accezione astronomica è segnalata in nota.
- source_word: προῆγεν αὐτούς
  choice: li precedeva
  rationale: Riproduce l'immagine della stella che va davanti a loro senza specificare il meccanismo della guida.
- source_word: ἕως ἐλθὼν ἐστάθη
  choice: finché giunse e si fermò
  rationale: 'Rende la sequenza del participio e del verbo principale: arrivo seguito dall''arrestarsi.'
- source_word: ἐπάνω οὗ ἦν
  choice: sopra il luogo dove si trovava
  rationale: Esplicita in modo idiomatico il riferimento spaziale implicito nel relativo greco, evitando l'italiano poco naturale «sopra dove».
- source_word: τὸ παιδίον
  choice: il bambino
  rationale: È una resa diretta e comune di παιδίον, senza aggiungere un'enfasi sull'età assente dal testo.
theological_decisions:
- issue: Significato di ἐν τῇ ἀνατολῇ nel racconto della stella
  choice: a oriente
  alternative: al suo sorgere
  rationale: L'espressione greca può indicare tanto l'oriente come regione o direzione quanto il sorgere di un astro. Il testo principale adotta la lettura geografica più familiare, ma la nota conserva l'alternativa astronomica senza risolvere indebitamente l'ambiguità.
translation_notes:
  register: Italiano moderno, dignitoso e narrativamente scorrevole. «Ed ecco» conserva la vivacità del testo; «si misero in cammino» e «si trovava» evitano costruzioni rigide senza ampliare il contenuto.
