id: MAT.2.23
reference: Matthew 2:23
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν κατῴκησεν εἰς πόλιν λεγομένην Ναζαρέτ, ὅπως πληρωθῇ τὸ ῥηθὲν διὰ τῶν προφητῶν ὅτι Ναζωραῖος κληθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/023.yaml
  text: 'And he came and lived in a city called Nazareth[a], so that what was spoken through the prophets might be fulfilled: “He will be called a Nazarene.”'
translation:
  language: it
  text: 'E, giunto, si stabilì in una città chiamata Nazaret[a], affinché si adempisse ciò che era stato detto per mezzo dei profeti: «Sarà chiamato Nazareno».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «Nazoreo». Non è chiaro a quale preciso passo profetico si riferisca «Sarà chiamato Nazareno»; Matteo potrebbe riassumere temi presenti nei profeti anziché citare un singolo testo.
    reason: Alternativa lessicale e chiarimento del discusso retroterra profetico.
lexical_decisions:
- source_word: ἐλθὼν
  choice: giunto là
  rationale: Il participio aoristo indica un'azione precedente a quella principale; «giunto là» esprime con naturalezza la sequenza nel contesto del ritorno in Galilea.
- source_word: κατῴκησεν
  choice: si stabilì
  rationale: κατοικέω indica il prendere dimora o risiedere; «si stabilì» rende qui il trasferimento di residenza senza ricorrere all'arcaico «dimorò».
- source_word: εἰς πόλιν λεγομένην Ναζαρέτ
  choice: in una città chiamata Nazaret
  rationale: Con un verbo di residenza, εἰς si rende idiomaticamente con «in»; «città» corrisponde direttamente a πόλις.
- source_word: ὅπως πληρωθῇ
  choice: affinché si adempisse
  rationale: La costruzione finale con congiuntivo mantiene la sfumatura di scopo/risultato propria della formula matteana di adempimento.
- source_word: τὸ ῥηθὲν
  choice: ciò che era stato detto
  rationale: Rende in italiano naturale il participio sostantivato e segnala che la parola profetica precede gli eventi narrati.
- source_word: διὰ τῶν προφητῶν
  choice: per mezzo dei profeti
  rationale: διά con il genitivo esprime mediazione o strumentalità; questa resa conserva l'idea della parola comunicata tramite i profeti.
- source_word: Ναζωραῖος
  choice: Nazareno
  rationale: È la designazione italiana corrente legata a Nazaret; la variante più formale «Nazoreo» viene conservata in nota.
- source_word: κληθήσεται
  choice: sarà chiamato
  rationale: Riproduce direttamente il futuro passivo di καλέω e lo stile della dichiarazione profetica.
theological_decisions:
- issue: Natura del richiamo profetico, privo di una citazione veterotestamentaria esatta
  choice: Mantenere nel testo il plurale «profeti» senza identificare una fonte specifica
  alternative: Intenderlo come allusione a Isaia 11:1 o come sintesi del tema profetico dell'umiliazione del Messia
  rationale: Il greco presenta esplicitamente «i profeti» al plurale. La traduzione deve conservare questa formulazione composita o tematica senza imporre un'identificazione discussa.
- issue: Interpretazione di Ναζωραῖος
  choice: Nazareno
  alternative: Nazoreo; nazireo
  rationale: Nel contesto il termine designa l'associazione con Nazaret. «Nazireo» richiamerebbe impropriamente il distinto voto nazireatico; «Nazoreo» resta una valida alternativa formale segnalata in nota.
translation_notes:
  register: Italiano moderno, dignitoso e scorrevole. «Si stabilì» comunica il cambio di residenza; la formula «affinché si adempisse» conserva il tono teologico e letterario caratteristico di Matteo.
