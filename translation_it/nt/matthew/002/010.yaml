  text: And when they saw the star[a], they rejoiced with exceedingly great joy.
translation:
  language: it
  text: Quando videro la stella[a], provarono una gioia grandissima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Il greco dice letteralmente: «gioirono di una gioia molto grande», espressione fortemente enfatica.'
