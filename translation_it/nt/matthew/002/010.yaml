lexical_decisions:
- source_word: ἰδόντες
  choice: Quando videro
  rationale: Il participio aoristo di ὁράω ha qui valore temporale; «Quando videro» rende in italiano corrente il rapporto con il verbo principale.
- source_word: δὲ
  choice: nessuna resa esplicita
  rationale: δέ è un connettivo narrativo lieve. In italiano la successione è già naturale senza «e»; ometterlo evita un attacco poco scorrevole senza perdere contrasto o contenuto.
- source_word: τὸν ἀστέρα
  choice: la stella
  rationale: L'articolo rimanda alla specifica stella già menzionata nel contesto.
- source_word: ἐχάρησαν
  choice: provarono una gioia
  rationale: Il verbo χαίρω esprime il gioire; insieme all'accusativo affine χαράν, questa formulazione italiana conserva l'idea verbale e l'intensificazione senza risultare artificiosa.
- source_word: χαρὰν μεγάλην σφόδρα
  choice: una gioia grandissima
  rationale: L'accusativo affine χαράν con μεγάλην e l'avverbio σφόδρα forma un'espressione fortemente enfatica. «Grandissima» concentra in un italiano naturale sia la grandezza sia l'intensificazione.
