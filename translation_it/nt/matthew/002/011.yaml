id: MAT.2.11
reference: Matthew 2:11
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: καὶ ἐλθόντες εἰς τὴν οἰκίαν εἶδον τὸ παιδίον μετὰ Μαρίας τῆς μητρὸς αὐτοῦ, καὶ πεσόντες προσεκύνησαν αὐτῷ, καὶ ἀνοίξαντες τοὺς θησαυροὺς αὐτῶν προσήνεγκαν αὐτῷ δῶρα, χρυσὸν καὶ λίβανον καὶ σμύρναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/011.yaml
  text: 'And when they came into the house[a], they saw the child with Mary his mother, and falling down they paid homage to him, and opening their treasures they offered him gifts: gold and frankincense and myrrh.'
translation:
  language: it
  text: 'Entrati nella casa, videro il bambino con Maria, sua madre; e, prostratisi, gli resero omaggio[a]. Poi aprirono i loro tesori e gli offrirono doni: oro, incenso e mirra.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «lo adorarono». Il verbo greco può indicare l''adorazione oppure un atto di omaggio reverente, a seconda del contesto.'
    reason: Lettura alternativa necessaria per conservare l'ampiezza semantica e la tensione teologica di προσκυνέω.
lexical_decisions:
- source_word: οἰκίαν
  choice: casa
  rationale: «Casa» è il corrispondente italiano diretto e naturale e mantiene concreto il luogo senza aggiungere sfumature non espresse.
- source_word: παιδίον
  choice: bambino
  rationale: Il termine indica un bambino piccolo; «bambino» è preciso, corrente e non specifica più di quanto faccia il greco.
- source_word: μετὰ Μαρίας τῆς μητρὸς αὐτοῦ
  choice: con Maria, sua madre
  rationale: Rende direttamente μετά con il genitivo e conserva l'apposizione che identifica Maria come madre del bambino.
- source_word: πεσόντες
  choice: prostratisi
  rationale: Esprime in italiano naturale l'atto corporeo di gettarsi a terra davanti a qualcuno, senza ridurlo a un semplice inchino.
- source_word: προσεκύνησαν
  choice: resero omaggio
  rationale: Il verbo può indicare sia venerazione o omaggio reverente sia adorazione. La resa principale conserva l'ambiguità contestuale, mentre la nota segnala l'alternativa teologicamente più forte.
- source_word: θησαυροὺς
  choice: tesori
  rationale: Mantiene il senso ampio del plurale greco, che può riferirsi alle riserve preziose o ai loro contenitori, senza introdurre lo specifico «scrigni».
- source_word: προσήνεγκαν
  choice: offrirono
  rationale: Il verbo indica il presentare o offrire qualcosa; «offrirono» si adatta al gesto solenne del dono.
- source_word: δῶρα
  choice: doni
  rationale: «Doni» è una resa precisa, dignitosa e non impone la sfumatura cultuale di «offerte».
- source_word: λίβανον
  choice: incenso
  rationale: Nel contesto biblico italiano «incenso» è la denominazione corrente della resina aromatica specifica indicata dal greco; «olibano» sarebbe più tecnico ma molto meno accessibile.
- source_word: σμύρναν
  choice: mirra
  rationale: È il corrispondente italiano preciso e tradizionale del termine greco.
theological_decisions:
- issue: Valore di προσκυνέω riferito al bambino Gesù
  choice: gli resero omaggio
  alternative: lo adorarono
  rationale: Nel racconto il gesto può essere letto come omaggio reverente a un bambino regale oppure, in senso teologico più forte, come adorazione. Il testo principale non restringe questa tensione lessicale; la nota conserva esplicitamente l'altra possibilità.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. La sintassi segue la progressione narrativa greca senza riprodurne meccanicamente tutti i participi. «Prostratisi» mantiene la vividezza del gesto; «tesori» conserva deliberatamente l'indeterminatezza del referente greco.
