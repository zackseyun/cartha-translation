id: MAT.2.19
reference: Matthew 2:19
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Τελευτήσαντος δὲ τοῦ Ἡρῴδου ἰδοὺ ἄγγελος κυρίου ⸂φαίνεται κατ’ ὄναρ⸃ τῷ Ἰωσὴφ ἐν Αἰγύπτῳ
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/019.yaml
  text: But after Herod died[a], behold, an angel of the Lord appears in a dream to Joseph in Egypt.
translation:
  language: it
  text: Ma, morto Erode, ecco, un angelo del Signore[a] appare in sogno a Giuseppe in Egitto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: «l’angelo del Signore». In greco «angelo» è privo dell’articolo.'
    reason: alternative_reading
lexical_decisions:
- source_word: Τελευτήσαντος ... τοῦ Ἡρῴδου
  choice: morto Erode
  rationale: Il participio aoristo nel genitivo assoluto ha valore temporale e indica che l'apparizione avviene dopo la morte di Erode; la resa è concisa, naturale e aderente alla costruzione narrativa greca.
- source_word: δὲ
  choice: Ma
  rationale: Segna una transizione narrativa con lieve valore di contrasto rispetto alla situazione precedente.
- source_word: ἰδοὺ
  choice: ecco
  rationale: Conserva il richiamo vivido e solenne all'attenzione tipico della narrazione matteana.
- source_word: ἄγγελος κυρίου
  choice: un angelo del Signore
  rationale: L'assenza dell'articolo davanti ad ἄγγελος favorisce la forma indefinita; «del Signore» è l'equivalente italiano idiomatico del genitivo κυρίου.
- source_word: φαίνεται
  choice: appare
  rationale: Mantiene il presente storico greco e la vivacità della narrazione.
- source_word: κατ’ ὄναρ
  choice: in sogno
  rationale: È la resa italiana naturale dell'espressione usata da Matteo per un'apparizione ricevuta durante un sogno.
- source_word: τῷ Ἰωσὴφ
  choice: a Giuseppe
  rationale: Rende il dativo della persona alla quale l'angelo appare, usando la forma italiana tradizionale del nome.
- source_word: ἐν Αἰγύπτῳ
  choice: in Egitto
  rationale: Rende direttamente l'indicazione locativa della posizione di Giuseppe.
theological_decisions:
- issue: Resa di κύριος in ἄγγελος κυρίου
  choice: del Signore
  alternative: del padrone
  rationale: Nel contesto religioso e narrativo κύριος designa il Signore; «del Signore» è la resa italiana normale e non introduce specificazioni assenti dal testo.
- issue: Articolo davanti a ἄγγελος
  choice: un angelo del Signore
  alternative: l'angelo del Signore
  rationale: Il greco non presenta l'articolo davanti a ἄγγελος, perciò il testo principale adotta la forma indefinita. La forma definita resta possibile in italiano per ragioni narrative o intertestuali, ma non è imposta dal greco.
translation_notes:
  register: Italiano standard moderno, dignitoso e accessibile. «Ecco» conserva il tono letterario del richiamo narrativo, mentre il presente «appare» riproduce il presente storico dell'originale.
