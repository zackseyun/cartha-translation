  text: 'Allora si adempì ciò che era stato detto per mezzo del profeta Geremia, che dice:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Allora
  rationale: Segna con naturalezza la successione temporale nel racconto di Matteo.
- source_word: ἐπληρώθη
  choice: si adempì
  rationale: Conserva la formula matteana dell'adempimento in una forma italiana corrente e dignitosa.
- source_word: τὸ ῥηθὲν
  choice: ciò che era stato detto
  rationale: Rende il participio sostantivato e il suo valore anteriore rispetto all'adempimento.
- source_word: διὰ Ἰερεμίου τοῦ προφήτου
  choice: per mezzo del profeta Geremia
  rationale: Mantiene il valore di mediazione espresso da διά con il genitivo e identifica Geremia come profeta.
- source_word: λέγοντος
  choice: ':'
  rationale: In italiano i due punti introducono naturalmente la citazione seguente; la nota registra la resa più esplicita del participio.
theological_decisions:
- issue: Formula matteana dell'adempimento
  choice: si adempì
  alternative: avvenne affinché si adempisse
  rationale: Il testo afferma direttamente l'adempimento della parola profetica; non contiene una proposizione finale e non va ampliato.
- issue: Referente grammaticale di λέγοντος
  choice: introduzione della citazione mediante i due punti
  alternative: che diceva
  rationale: Il participio genitivo concorda grammaticalmente con Geremia, ma la sua funzione è introdurre il contenuto profetico. I due punti producono un italiano naturale senza attribuire erroneamente il parlare all'adempimento.
translation_notes:
  register: Italiano moderno standard, sobrio e dignitoso. «Si adempì» conserva il lessico biblico ormai consolidato senza risultare arcaico; «per mezzo di» mantiene la mediazione profetica espressa dal greco.
