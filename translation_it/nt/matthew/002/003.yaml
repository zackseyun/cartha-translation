id: MAT.2.3
reference: Matthew 2:3
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ⸂ὁ βασιλεὺς Ἡρῴδης⸃ ἐταράχθη καὶ πᾶσα Ἱεροσόλυμα μετ’ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/003.yaml
  text: When King Herod heard this[a], he was troubled[b], and all Jerusalem with him.
translation:
  language: it
  text: Quando il re Erode udì queste parole, ne fu turbato, e con lui tutta Gerusalemme.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Tutta Gerusalemme» indica qui, per metonimia, gli abitanti della città; l'espressione può essere generale o iperbolica.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας
  choice: Quando ... udì queste parole
  rationale: Il participio aoristo ha valore temporale. La resa esplicita in forma di subordinata è naturale in italiano; «queste parole» riprende dal contesto immediato quanto riferito dai magi senza alterarne il senso.
- source_word: δὲ
  choice: Quando
  rationale: δέ è un connettivo lieve e di transizione; insieme al participio temporale può essere assorbito naturalmente dalla costruzione italiana senza una congiunzione separata.
- source_word: ὁ βασιλεὺς Ἡρῴδης
  choice: il re Erode
  rationale: Ordine idiomatico dell'italiano moderno che conserva sia il titolo sia il nome proprio.
- source_word: ἐταράχθη
  choice: ne fu turbato
  rationale: Il verbo indica turbamento, agitazione o allarme interiore. «Fu turbato» conserva l'ampiezza semantica senza precisarne indebitamente la causa o l'intensità; «ne» collega in modo naturale il turbamento a ciò che Erode ha udito.
- source_word: πᾶσα Ἱεροσόλυμα
  choice: tutta Gerusalemme
  rationale: La resa conserva la metonimia greca, nella quale il nome della città rappresenta i suoi abitanti, senza restringere il riferimento a un gruppo particolare.
- source_word: μετ’ αὐτοῦ
  choice: con lui
  rationale: Resa diretta e naturale che mantiene l'associazione tra il turbamento di Erode e quello di Gerusalemme.
theological_decisions:
- issue: Estensione di πᾶσα Ἱεροσόλυμα
  choice: Riferimento collettivo e metonimico alla città e ai suoi abitanti
  alternative: Espressione iperbolica per molti abitanti, oppure riferimento soprattutto ai circoli dirigenti di Gerusalemme
  rationale: Il greco nomina la città nel suo insieme. Mantenere «tutta Gerusalemme» preserva l'ampiezza e la tensione narrativa del testo senza identificare arbitrariamente un gruppo sociale specifico.
translation_notes:
  register: 'Italiano standard moderno, dignitoso e scorrevole. La costruzione «ne fu turbato» evita la possibile ambiguità di coordinazione di «fu turbato, e tutta Gerusalemme» e sottintende naturalmente il medesimo predicato per la città. È stata mantenuta la metonimia dell''originale. Il materiale inglese presenta uno slittamento dei richiami di nota: la nota sul valore lessicale di ἐταράχθη non richiede una nota italiana separata, mentre la nota necessaria sulla portata di «tutta Gerusalemme» è contrassegnata [a] nel testo.'
