id: MAT.2.13
reference: Matthew 2:13
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Ἀναχωρησάντων δὲ αὐτῶν ἰδοὺ ἄγγελος κυρίου ⸂φαίνεται κατ’ ὄναρ⸃ τῷ Ἰωσὴφ λέγων· Ἐγερθεὶς παράλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ καὶ φεῦγε εἰς Αἴγυπτον, καὶ ἴσθι ἐκεῖ ἕως ἂν εἴπω σοι· μέλλει γὰρ Ἡρῴδης ζητεῖν τὸ παιδίον τοῦ ἀπολέσαι αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/013.yaml
  text: After they had departed[a], behold, an angel of the Lord appeared to Joseph in a dream, saying, “Get up, take the child and his mother, and flee to Egypt, and stay there until I tell you[c][b]; for Herod is about to seek the child in order to destroy him.”
translation:
  language: it
  text: 'Dopo che se ne furono andati, ecco, un angelo del Signore[a] apparve in sogno a Giuseppe e gli disse: «Àlzati, prendi con te il bambino e sua madre, fuggi in Egitto e rimani là finché non te lo dirò; Erode, infatti, sta per[b] cercare il bambino per farlo morire[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «l''angelo del Signore». Il greco non ha l''articolo, ma l''espressione può essere intesa come la nota formula biblica.'
    reason: alternative_reading
  - marker: b
    text: 'Il greco esprime un''intenzione o un''azione imminente: «sta per cercare».'
    reason: lexical_alternative
  - marker: c
    text: 'Letteralmente: «per distruggerlo»; nel contesto significa causarne la morte, quindi anche «per ucciderlo».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναχωρησάντων δὲ αὐτῶν
  choice: Dopo che se ne furono andati
  rationale: Il genitivo assoluto indica un'azione anteriore. La resa conserva la sequenza temporale ed è naturale in italiano; il pronome rimanda ai visitatori menzionati nel contesto.
- source_word: ἰδοὺ
  choice: ecco
  rationale: Conserva il segnale narrativo vivido di Matteo e sottolinea l'improvviso intervento divino.
- source_word: ἄγγελος κυρίου
  choice: un angelo del Signore
  rationale: La costruzione greca è priva di articolo; l'indeterminativo italiano ne rende bene il valore senza identificare necessariamente l'angelo con una figura unica e già nota.
- source_word: φαίνεται κατ’ ὄναρ τῷ Ἰωσὴφ
  choice: apparve in sogno a Giuseppe
  rationale: κατ’ ὄναρ è un'espressione idiomatica per «in sogno». Il presente storico greco è reso con il passato remoto, naturale nella narrazione italiana.
- source_word: λέγων
  choice: e gli disse
  rationale: Il participio introduce il discorso diretto; una coordinazione verbale è più scorrevole nell'italiano moderno e mantiene invariato il senso.
- source_word: Ἐγερθεὶς
  choice: Àlzati
  rationale: Benché formalmente participio, nella sequenza di comandi ha forza imperativale. «Àlzati» è moderno e diretto.
- source_word: παράλαβε
  choice: prendi con te
  rationale: Esplicita il senso contestuale di prendere qualcuno con sé, non semplicemente riceverlo.
- source_word: τὸ παιδίον
  choice: il bambino
  rationale: παιδίον indica un bambino piccolo; «il bambino» è naturale e preciso nel contesto.
- source_word: τὴν μητέρα αὐτοῦ
  choice: sua madre
  rationale: Il possessivo si riferisce naturalmente al bambino; la formulazione italiana è concisa e chiara.
- source_word: φεῦγε εἰς Αἴγυπτον
  choice: fuggi in Egitto
  rationale: «Fuggi» conserva l'urgenza e il pericolo espressi da φεύγω.
- source_word: ἴσθι ἐκεῖ
  choice: rimani là
  rationale: Letteralmente «sii là», ma nel contesto il comando richiede una permanenza continuata; «rimani là» ne rende il valore idiomatico.
- source_word: ἕως ἂν εἴπω σοι
  choice: finché non te lo dirò
  rationale: La costruzione indica un limite futuro non ancora determinato. Il pronome «lo» riprende naturalmente l'istruzione implicita che l'angelo darà a Giuseppe.
- source_word: μέλλει ... ζητεῖν
  choice: sta per cercare
  rationale: μέλλω con l'infinito esprime qui un'intenzione o un'azione imminente; «sta per» ne conserva la prossimità.
- source_word: τοῦ ἀπολέσαι αὐτό
  choice: per farlo morire
  rationale: L'infinito articolato esprime lo scopo. ἀπόλλυμι significa «distruggere, far perire» e qui, riferito al progetto di Erode contro il bambino, indica causarne la morte senza sostituire il verbo greco con il più specifico «uccidere» nel testo principale.
theological_decisions:
- issue: Resa di κύριος in ἄγγελος κυρίου
  choice: Signore
  alternative: padrone
  rationale: «Signore» è la resa biblica e lessicale appropriata in questa formula e non impone un'identificazione più specifica dell'angelo oltre quanto afferma il testo.
- issue: Valore definito o indefinito di ἄγγελος κυρίου
  choice: un angelo del Signore
  alternative: l'angelo del Signore
  rationale: L'assenza dell'articolo favorisce la resa indefinita, pur riconoscendo che la formula può richiamare ai lettori la nota espressione biblica.
- issue: Forza di ἀπολέσαι nel progetto di Erode
  choice: farlo morire
  alternative: distruggerlo; ucciderlo
  rationale: Il contesto indica chiaramente la morte, mentre la formulazione scelta conserva qualcosa dell'ampiezza causativa di ἀπόλλυμι e non attenua la violenza dell'intento.
translation_notes:
  register: Italiano standard moderno, dignitoso e narrativamente scorrevole. «Ecco» mantiene la vivacità matteana; i comandi sono diretti e correnti. L'accento grafico in «Àlzati» evita una possibile esitazione di lettura. La punteggiatura conserva la concatenazione urgente delle istruzioni senza risultare pesante.
