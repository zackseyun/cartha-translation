  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: καὶ συναγαγὼν πάντας τοὺς ἀρχιερεῖς καὶ γραμματεῖς τοῦ λαοῦ ἐπυνθάνετο παρ’ αὐτῶν ποῦ ὁ χριστὸς γεννᾶται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/004.yaml
  text: And gathering together all the chief priests and scribes of the people[a], he was inquiring of them where the Messiah was to be born.
translation:
  language: it
  text: Dopo aver radunato tutti i capi dei sacerdoti e gli scribi del popolo, chiedeva loro dove dovesse nascere il Messia[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «il Cristo».'
    reason: Segnala una forma tradizionale alternativa del titolo greco Χριστός.
lexical_decisions:
- source_word: συναγαγὼν
  choice: Radunati
  rationale: Il participio aoristo indica un’azione connessa e normalmente anteriore alla domanda; la costruzione italiana con participio passato è concisa e naturale.
- source_word: πάντας
  choice: tutti
  rationale: Conserva senza attenuazioni il valore comprensivo dell’aggettivo greco.
- source_word: ἀρχιερεῖς
  choice: capi dei sacerdoti
  rationale: Indica i membri dell’alta dirigenza sacerdotale, non una pluralità di sommi sacerdoti contemporaneamente in carica.
- source_word: γραμματεῖς
  choice: scribi
  rationale: È la resa diretta e tradizionalmente comprensibile del termine per gli esperti delle Scritture e della legge.
- source_word: τοῦ λαοῦ
  choice: del popolo
  rationale: Mantiene il genitivo del testo senza aggiungere nel corpo del versetto una specificazione etnica esplicativa.
- source_word: ἐπυνθάνετο παρ’ αὐτῶν
  choice: chiedeva loro
  rationale: L’imperfetto «chiedeva» conserva l’aspetto durativo dell’indagine; il pronome indiretto rende idiomaticamente la costruzione greca con παρά.
- source_word: ποῦ
  choice: dove
  rationale: Resa diretta dell’avverbio interrogativo.
- source_word: ὁ χριστὸς
  choice: il Messia
  rationale: Qui Χριστός è il titolo del sovrano consacrato atteso nelle profezie ebraiche; «Messia» rende chiaramente tale contesto.
- source_word: γεννᾶται
  choice: dovesse nascere
  rationale: Nella domanda indiretta dipendente da un verbo al passato, il congiuntivo imperfetto italiano esprime naturalmente la nascita attesa, senza trattare il presente greco come un semplice presente cronologico.
theological_decisions:
- issue: Resa di Χριστός come titolo
  choice: il Messia
  alternative: il Cristo
  rationale: Nel contesto della domanda di Erode il termine designa l’unto atteso d’Israele. «Messia» rende il titolo e il suo contesto ebraico; la variante più letterale è conservata in nota.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. La sintassi resta vicina al greco senza risultare artificiosa; l’imperfetto «chiedeva» conserva l’aspetto dell’interrogazione e «dovesse nascere» è naturale nella domanda indiretta al passato.
