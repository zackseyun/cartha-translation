id: MAT.2.18
reference: Matthew 2:18
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Φωνὴ ἐν Ῥαμὰ ⸀ἠκούσθη, κλαυθμὸς καὶ ὀδυρμὸς πολύς· Ῥαχὴλ κλαίουσα τὰ τέκνα αὐτῆς, καὶ οὐκ ἤθελεν παρακληθῆναι ὅτι οὐκ εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/018.yaml
  text: 'A voice was heard in Ramah[a], weeping and great mourning: Rachel weeping for her children, and she was not willing to be comforted[c][b], because they are no more.'
translation:
  language: it
  text: '«Una voce fu udita a Rama: pianto e grande lamento; Rachele piange i suoi figli e non voleva essere consolata[a], perché non sono più[b]».


    [a] O «rifiutava di lasciarsi consolare».

    [b] Letteralmente «perché non sono».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «rifiutava di lasciarsi consolare».
    reason: lexical_alternative
  - marker: b
    text: Letteralmente «perché non sono».
    reason: lexical_alternative
lexical_decisions:
- source_word: Φωνὴ
  choice: Una voce
  rationale: «Voce» conserva il tono personale e profetico della citazione ed è naturale in rapporto al pianto di Rachele.
- source_word: ἐν Ῥαμὰ
  choice: a Rama
  rationale: In italiano la preposizione «a» è idiomatica con un nome di città; il toponimo è reso nella sua forma italiana tradizionale.
- source_word: ἠκούσθη
  choice: fu udita
  rationale: Rende direttamente l’aoristo passivo e mantiene il registro solenne della citazione.
- source_word: κλαυθμὸς καὶ ὀδυρμὸς πολύς
  choice: pianto e grande lamento
  rationale: 'Distingue i due termini affini: κλαυθμός indica il pianto udibile, mentre ὀδυρμός indica il lamento; «grande» rende l’intensificazione di πολύς.'
- source_word: Ῥαχὴλ κλαίουσα τὰ τέκνα αὐτῆς
  choice: Rachele piange i suoi figli
  rationale: La forma verbale italiana rende con naturalezza l’azione in corso del participio; «figli» è inclusivo nel contesto e non restringe τέκνα ai soli maschi.
- source_word: οὐκ ἤθελεν παρακληθῆναι
  choice: non voleva essere consolata
  rationale: Conserva il valore volitivo di θέλω e la forma passiva di παρακαλέω senza rafforzarli automaticamente in «rifiutava».
- source_word: ὅτι οὐκ εἰσίν
  choice: perché non sono più
  rationale: Rende in italiano corrente l’espressione ellittica della perdita senza aggiungere esplicitamente «sono morti»; una nota conserva la forma letterale.
theological_decisions:
- issue: La figura di Rachele nella citazione profetica
  choice: Mantenere Rachele come figura materna della citazione senza spiegarne il valore simbolico nel testo.
  alternative: Esplicitare Rachele come simbolo delle madri d’Israele.
  rationale: Il greco presenta semplicemente Rachele che piange; esplicitare il simbolismo risolverebbe nel testo una dimensione tipologica che Matteo lascia implicita.
translation_notes:
  register: Italiano moderno, chiaro e dignitoso, con una sintassi lievemente solenne adatta alla citazione profetica. Le virgolette segnalano la citazione. La ripetizione «pianto/piange» conserva il legame lessicale e retorico del greco.
