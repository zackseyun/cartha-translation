id: MAT.2.22
reference: Matthew 2:22
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὅτι Ἀρχέλαος ⸀βασιλεύει τῆς Ἰουδαίας ἀντὶ ⸂τοῦ πατρὸς αὐτοῦ Ἡρῴδου⸃ ἐφοβήθη ἐκεῖ ἀπελθεῖν· χρηματισθεὶς δὲ κατ’ ὄναρ ἀνεχώρησεν εἰς τὰ μέρη τῆς Γαλιλαίας,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/022.yaml
  text: But when he heard that Archelaus was reigning over Judea in place of his father Herod[a], he was afraid to go there. And after being warned in a dream, he withdrew to the regions of Galilee,
translation:
  language: it
  text: Ma, quando venne a sapere che Archelao regnava sulla Giudea al posto di suo padre Erode, ebbe paura di andarvi. Avvertito poi in sogno[a], si ritirò nelle regioni della Galilea,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il verbo può anche significare «istruito»; in questo contesto implica normalmente un avvertimento o un'istruzione di origine divina.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: quando venne a sapere
  rationale: Il participio aoristo introduce la circostanza anteriore all'azione principale; questa resa è naturale in italiano e, nel contesto, esprime bene l'acquisizione della notizia.
- source_word: δὲ
  choice: Ma
  rationale: Segnala il contrasto tra l'intenzione precedente di Giuseppe e il nuovo ostacolo.
- source_word: βασιλεύει τῆς Ἰουδαίας
  choice: regnava sulla Giudea
  rationale: Con il genitivo territoriale, «regnare su» è idiomatico e conserva la sfumatura regale del verbo.
- source_word: ἀντὶ τοῦ πατρὸς αὐτοῦ Ἡρῴδου
  choice: al posto di suo padre Erode
  rationale: ἀντί indica qui sostituzione o successione; la resa resta vicina al greco senza esplicitare più del testo.
- source_word: ἐφοβήθη ἐκεῖ ἀπελθεῖν
  choice: ebbe paura di andarvi
  rationale: Rende in italiano corrente sia la paura sia il moto verso il luogo già menzionato.
- source_word: χρηματισθεὶς
  choice: Avvertito
  rationale: Il participio passivo indica un avvertimento o un'istruzione, spesso di origine divina nel contesto matteano, ma lascia inespresso l'agente.
- source_word: κατ’ ὄναρ
  choice: in sogno
  rationale: È la resa italiana naturale della formula matteana relativa a una comunicazione ricevuta durante il sonno.
- source_word: ἀνεχώρησεν
  choice: si ritirò
  rationale: Conserva la sfumatura di una partenza intenzionale motivata dal pericolo, più specifica del semplice «andò».
- source_word: εἰς τὰ μέρη τῆς Γαλιλαίας
  choice: nelle regioni della Galilea
  rationale: Il plurale μέρη designa le zone o il territorio della Galilea; «regioni» ne conserva formalmente il numero.
theological_decisions:
- issue: Se esplicitare l'origine divina dell'avvertimento in χρηματισθείς
  choice: Mantenere il passivo «Avvertito» senza aggiungere «da Dio».
  alternative: «Avvertito da Dio» oppure «ricevuta un'istruzione divina».
  rationale: Nel Vangelo di Matteo il verbo implica normalmente una comunicazione divina, ma in questo versetto l'agente non è espresso. La traduzione conserva tale implicitezza, mentre la nota segnala la sfumatura.
translation_notes:
  register: Italiano standard moderno, dignitoso e narrativamente scorrevole. «Venne a sapere» evita una formulazione rigida; «andarvi» limita la ripetizione. La virgola finale è mantenuta perché il versetto prosegue sintatticamente nel successivo.
