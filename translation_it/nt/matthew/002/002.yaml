id: MAT.2.2
reference: Matthew 2:2
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: λέγοντες· Ποῦ ἐστιν ὁ τεχθεὶς βασιλεὺς τῶν Ἰουδαίων; εἴδομεν γὰρ αὐτοῦ τὸν ἀστέρα ἐν τῇ ἀνατολῇ καὶ ἤλθομεν προσκυνῆσαι αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/002.yaml
  text: saying[b][a], “Where is the one who has been born king of the Jews? For we saw his star in the east and have come to pay him homage.”
translation:
  language: it
  text: 'dicevano: «Dov’è colui che è nato re dei Giudei? Abbiamo infatti visto la sua stella in oriente[a] e siamo venuti a rendergli omaggio[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «al suo sorgere». L’espressione greca può significare «in oriente» oppure riferirsi al sorgere della stella.
    reason: alternative_reading
  - marker: b
    text: O «ad adorarlo». Il verbo greco può indicare sia l’omaggio reso a un re sia l’adorazione, a seconda del contesto.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: dicevano
  rationale: Il participio presente introduce le parole dei magi e dipende dalla frase precedente. «Dicevano» è naturale in italiano narrativo e non trasforma esplicitamente l’enunciato in una domanda reiterata.
- source_word: Ποῦ ἐστιν
  choice: Dov’è
  rationale: Resa diretta e idiomatica della domanda locativa.
- source_word: ὁ τεχθεὶς
  choice: colui che è nato
  rationale: Conserva il valore sostantivato del participio passivo e il riferimento alla nascita, senza aggiungere l’idea più specifica di «neonato».
- source_word: βασιλεὺς τῶν Ἰουδαίων
  choice: re dei Giudei
  rationale: È la resa italiana corrente del titolo regale e ne mantiene la portata politica e messianica.
- source_word: εἴδομεν γὰρ
  choice: Abbiamo infatti visto
  rationale: «Infatti» esprime la funzione esplicativa di γάρ; il passato prossimo è naturale nel discorso diretto perché l’avvistamento precedente motiva la loro presenza attuale.
- source_word: αὐτοῦ τὸν ἀστέρα
  choice: la sua stella
  rationale: Rende naturalmente il genitivo possessivo senza precisare la natura del segno celeste.
- source_word: ἐν τῇ ἀνατολῇ
  choice: in oriente
  rationale: La locuzione può indicare l’oriente geografico oppure il sorgere della stella. «In oriente» è una lettura tradizionale e plausibile; l’altra possibilità è conservata in nota.
- source_word: ἤλθομεν
  choice: siamo venuti
  rationale: Il passato prossimo esprime in modo idiomatico un arrivo compiuto i cui effetti perdurano nel momento in cui i magi parlano.
- source_word: προσκυνῆσαι αὐτῷ
  choice: a rendergli omaggio
  rationale: Il verbo può indicare sia l’omaggio reso a un sovrano sia l’adorazione. Nel contesto immediato del «re dei Giudei», questa resa conserva il quadro regale senza eliminare la possibile portata cultuale, segnalata in nota.
theological_decisions:
- issue: Valore di προσκυνῆσαι riferito a Gesù bambino
  choice: rendergli omaggio
  alternative: adorarlo
  rationale: Il contesto immediato presenta Gesù come re, ma il verbo può anche designare l’adorazione. La traduzione principale mantiene il senso di riverenza regale senza anticipare una risoluzione cristologica completa; la nota conserva esplicitamente l’altra lettura.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. La formulazione conserva la struttura della domanda e le ambiguità autentiche riguardanti il luogo o momento dell’avvistamento della stella e la natura dell’atto di riverenza.
