id: MAT.2.16
reference: Matthew 2:16
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Τότε Ἡρῴδης ἰδὼν ὅτι ἐνεπαίχθη ὑπὸ τῶν μάγων ἐθυμώθη λίαν, καὶ ἀποστείλας ἀνεῖλεν πάντας τοὺς παῖδας τοὺς ἐν Βηθλέεμ καὶ ἐν πᾶσι τοῖς ὁρίοις αὐτῆς ἀπὸ διετοῦς καὶ κατωτέρω, κατὰ τὸν χρόνον ὃν ἠκρίβωσεν παρὰ τῶν μάγων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/016.yaml
  text: Then Herod[a], seeing that he had been tricked by the magi, became very angry, and sending men, he killed all the boys in Bethlehem and in all its surrounding districts, from two years old and under[b], according to the time that he had determined from the magi.
translation:
  language: it
  text: Allora Erode, vedendo che i magi[a] si erano presi gioco di lui[b], fu preso da una grande ira e mandò i suoi uomini a uccidere tutti i bambini maschi che si trovavano a Betlemme e in tutto il territorio circostante, dai due anni in giù, in base al tempo che aveva accertato dai magi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oppure: «sapienti». Il termine greco μάγοι designa sapienti-astrologi orientali.'
    reason: cultural_note
  - marker: b
    text: 'Oppure: «lo avevano ingannato»; più alla lettera, «si erano fatti beffe di lui».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Allora
  rationale: Introduce con naturalezza l’evento successivo nella sequenza narrativa.
- source_word: ἰδὼν ὅτι
  choice: vedendo che
  rationale: Mantiene il valore percettivo-causale del participio con la proposizione introdotta da ὅτι.
- source_word: ἐνεπαίχθη
  choice: si erano presi gioco di lui
  rationale: L’espressione italiana conserva sia l’idea di essere stato trattato da stolto sia, nel contesto, quella di essere stato eluso; l’alternativa più esplicita «ingannato» è segnalata in nota.
- source_word: μάγων
  choice: magi
  rationale: Traslittera il termine storico-culturale senza sostituirlo con la tradizionale ma meno precisa espressione «sapienti».
- source_word: ἐθυμώθη λίαν
  choice: fu preso da una grande ira
  rationale: Esprime tanto l’insorgere dell’ira quanto l’intensificazione data da λίαν, in un registro dignitoso e comprensibile.
- source_word: ἀποστείλας ἀνεῖλεν
  choice: mandò i suoi uomini a uccidere
  rationale: Rende esplicita in italiano l’azione compiuta tramite emissari, implicita nel participio ἀποστείλας, e conserva la forza diretta di ἀνεῖλεν.
- source_word: πάντας τοὺς παῖδας
  choice: tutti i bambini maschi
  rationale: Nel contesto παῖδας indica i bambini di sesso maschile ricercati da Erode; «bambini maschi» evita l’ambiguità del maschile generico italiano.
- source_word: ἐν Βηθλέεμ καὶ ἐν πᾶσι τοῖς ὁρίοις αὐτῆς
  choice: a Betlemme e in tutto il territorio circostante
  rationale: ὅρια designa qui la zona o il territorio intorno alla città, non soltanto i confini in senso lineare.
- source_word: ἀπὸ διετοῦς καὶ κατωτέρω
  choice: dai due anni in giù
  rationale: È la formulazione italiana naturale per un limite massimo d’età inclusivo.
- source_word: κατὰ τὸν χρόνον ὃν ἠκρίβωσεν παρὰ τῶν μάγων
  choice: in base al tempo che aveva accertato dai magi
  rationale: Conserva l’idea che Erode avesse stabilito con precisione il riferimento temporale ricavandolo dalle informazioni dei magi.
theological_decisions:
- issue: Identità dei μάγοι
  choice: magi
  alternative: sapienti
  rationale: «Magi» rispecchia meglio la designazione greca di questi sapienti-astrologi orientali senza introdurre immagini tradizionali posteriori.
- issue: Senso di ἐνεπαίχθη
  choice: si erano presi gioco di lui
  alternative: lo avevano ingannato
  rationale: La resa scelta conserva la tensione tra il senso lessicale di schernire o trattare da stolto e il valore contestuale di eludere o ingannare Erode.
- issue: Agenzia nell’uccisione
  choice: mandò i suoi uomini a uccidere
  alternative: mandò e uccise
  rationale: Il participio ἀποστείλας indica che Erode agì mediante emissari; la formulazione attribuisce comunque chiaramente a lui la responsabilità dell’ordine e dell’azione.
translation_notes:
  register: Italiano standard moderno, narrativo e dignitoso. La sintassi resta vicina alla progressione greca, ma scioglie il participio ἀποστείλας in una costruzione italiana naturale. Le note sono collocate immediatamente dopo i termini cui si riferiscono.
