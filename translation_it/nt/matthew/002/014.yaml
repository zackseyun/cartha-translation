source:
  edition: SBLGNT
  text: ὁ δὲ ἐγερθεὶς παρέλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ νυκτὸς καὶ ἀνεχώρησεν εἰς Αἴγυπτον,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/014.yaml
  text: So he got up[a], took the child and his mother during the night, and departed for Egypt.
translation:
  language: it
  text: Allora egli si alzò, prese con sé il bambino e sua madre durante la notte e partì per l’Egitto.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Allora
  rationale: Congiunzione narrativa lieve che fa avanzare il racconto collegando l’azione di Giuseppe al comando appena ricevuto; «Allora» è naturale in italiano senza caricare il nesso di un valore causale troppo forte.
- source_word: ἐγερθεὶς
  choice: si alzò
  rationale: Il participio aoristo indica l’azione che precede e accompagna la sequenza principale. La resa coordinata è scorrevole in italiano e conserva l’immediatezza narrativa.
- source_word: παρέλαβε
  choice: prese con sé
  rationale: Nel contesto παραλαμβάνω significa prendere qualcuno con sé; questa resa è più precisa del semplice «prese» e non suggerisce che Giuseppe li abbia ricevuti passivamente.
- source_word: τὸ παιδίον
  choice: il bambino
  rationale: Resa piana e corrente di παιδίον, senza introdurre un’enfasi sull’età che il contesto non richiede.
- source_word: τὴν μητέρα αὐτοῦ
  choice: sua madre
  rationale: Il pronome si riferisce naturalmente al bambino. La formulazione italiana conserva la struttura sobria del greco.
- source_word: νυκτὸς
  choice: durante la notte
  rationale: Il genitivo temporale indica che l’azione ebbe luogo di notte; «durante la notte» è chiaro e naturale nell’italiano moderno.
- source_word: ἀνεχώρησεν
  choice: partì
  rationale: ἀναχωρέω qui descrive l’allontanamento verso una destinazione. «Partì» comunica il movimento intenzionale senza esplicitare più del testo.
- source_word: εἰς Αἴγυπτον
  choice: per l’Egitto
  rationale: εἰς esprime moto verso una destinazione; con «partì», la costruzione italiana idiomatica è «per l’Egitto».
theological_decisions: []
translation_notes:
  register: 'Italiano moderno, dignitoso e narrativamente scorrevole. La coordinazione rende naturale il participio greco senza alterare l’ordine degli eventi. Non si recepisce la nota inglese associata a «got up», poiché appare disallineata: l’alternativa «to Egypt» riguarda εἰς Αἴγυπτον e non richiede una nota nella resa italiana.'
