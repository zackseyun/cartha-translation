  source_fidelity: '«Ed essi gli dissero» rende correttamente οἱ δὲ εἶπαν αὐτῷ, mantenendo il lieve collegamento di δέ. «A Betlemme di Giudea» riproduce con precisione l’indicazione geografica. «Perché così sta scritto per mezzo del profeta» rende adeguatamente οὕτως γὰρ γέγραπται διὰ τοῦ προφήτου: «così» conserva il rinvio alla citazione seguente, e «per mezzo» esprime bene la mediazione di διά con il genitivo.'
