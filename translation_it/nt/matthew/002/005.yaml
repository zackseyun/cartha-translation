  text: οἱ δὲ εἶπαν αὐτῷ· Ἐν Βηθλέεμ τῆς Ἰουδαίας· οὕτως γὰρ γέγραπται διὰ τοῦ προφήτου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/005.yaml
  text: And they said to him[a], “In Bethlehem of Judea[b], for thus it has been written through the prophet:”
translation:
  language: it
  text: 'Ed essi gli dissero: «A Betlemme di Giudea, perché così sta scritto[a] per mezzo del profeta:»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «è stato scritto». Il greco usa il perfetto passivo, una formula abituale per citare la Scrittura.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Ed essi
  rationale: L’articolo sostantivato riprende i capi dei sacerdoti e gli scribi del versetto precedente; δέ è reso con un collegamento discorsivo lieve, senza introdurre un contrasto marcato.
- source_word: εἶπαν αὐτῷ
  choice: gli dissero
  rationale: Resa diretta e naturale di λέγω con il pronome al dativo αὐτῷ.
- source_word: Ἐν Βηθλέεμ τῆς Ἰουδαίας
  choice: A Betlemme di Giudea
  rationale: In italiano «a» è la preposizione idiomatica con il nome di città; il genitivo «di Giudea» identifica quale Betlemme sia intesa.
- source_word: οὕτως γὰρ
  choice: perché così
  rationale: γάρ introduce il fondamento scritturale della risposta, mentre οὕτως anticipa la citazione che segue.
- source_word: γέγραπται
  choice: sta scritto
  rationale: 'È la formula italiana corrente e dignitosa per una citazione della Scrittura e conserva il valore risultativo del perfetto passivo: ciò che fu scritto rimane autorevole e vigente.'
- source_word: διὰ τοῦ προφήτου
  choice: per mezzo del profeta
  rationale: διά con il genitivo indica mediazione; questa resa mantiene il profeta come tramite senza specificare oltre chi sia l’agente ultimo.
theological_decisions:
- issue: Formula di mediazione profetica
  choice: per mezzo del profeta
  alternative: dal profeta
  rationale: La formulazione conserva il valore mediativo di διά con il genitivo e non appiattisce il rapporto tra la fonte del messaggio e il profeta che lo trasmette.
- issue: Valore del perfetto passivo nella formula di citazione
  choice: sta scritto
  alternative: è stato scritto
  rationale: «Sta scritto» è una formula biblica italiana naturale che esprime lo stato presente risultante dallo scrivere; la nota segnala la resa più formalmente trasparente del perfetto.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. Il discorso diretto resta aperto con i due punti finali, poiché la citazione profetica prosegue nel versetto seguente.
