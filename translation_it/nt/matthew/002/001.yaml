id: MAT.2.1
reference: Matthew 2:1
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Τοῦ δὲ Ἰησοῦ γεννηθέντος ἐν Βηθλέεμ τῆς Ἰουδαίας ἐν ἡμέραις Ἡρῴδου τοῦ βασιλέως, ἰδοὺ μάγοι ἀπὸ ἀνατολῶν παρεγένοντο εἰς Ἱεροσόλυμα
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/001.yaml
  text: After Jesus was born in Bethlehem of Judea in the days of Herod the king[a], behold, wise men from the east arrived in Jerusalem,
translation:
  language: it
  text: Dopo la nascita di Gesù a Betlemme di Giudea, al tempo del re Erode, ecco, dei magi[a] giunsero dall'oriente a Gerusalemme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il termine greco indica dotti provenienti dall’Oriente, probabilmente legati all’astrologia o alla sapienza di corte; non dice che fossero re né quanti fossero.
    reason: Chiarimento lessicale e prevenzione dell’importazione di elementi della tradizione successiva.
lexical_decisions:
- source_word: Τοῦ δὲ Ἰησοῦ γεννηθέντος
  choice: Dopo che Gesù era nato
  rationale: Il genitivo assoluto presenta come circostanza antecedente la nascita di Gesù. Il trapassato italiano esprime con naturalezza l’anteriorità rispetto all’arrivo dei magi; δέ ha qui una lieve funzione di transizione narrativa e non richiede una parola autonoma.
- source_word: Βηθλέεμ τῆς Ἰουδαίας
  choice: Betlemme di Giudea
  rationale: La forma tradizionale italiana del toponimo è chiara; il genitivo specifica la regione e distingue questa Betlemme da altre località omonime.
- source_word: ἐν ἡμέραις Ἡρῴδου τοῦ βασιλέως
  choice: al tempo del re Erode
  rationale: Rende in italiano corrente l’espressione storica greca senza perdere il titolo regale né appesantire la frase.
- source_word: ἰδοὺ
  choice: ecco
  rationale: Conserva la funzione del segnale discorsivo, che richiama l’attenzione sull’arrivo inatteso dei personaggi.
- source_word: μάγοι
  choice: magi
  rationale: È il termine italiano più preciso e non introduce le tradizioni posteriori secondo cui questi uomini sarebbero stati re o sarebbero stati necessariamente tre.
- source_word: ἀπὸ ἀνατολῶν
  choice: da oriente
  rationale: Rende idiomaticamente il plurale greco, che indica regioni orientali senza specificarne il luogo.
- source_word: παρεγένοντο εἰς Ἱεροσόλυμα
  choice: giunsero … a Gerusalemme
  rationale: Il verbo esprime l’arrivo sulla scena; la costruzione italiana con «giungere a» conserva chiaramente la direzione indicata da εἰς.
theological_decisions:
- issue: Resa di μάγοι senza importare tradizioni successive
  choice: magi
  alternative: sapienti
  rationale: «Magi» conserva la specificità storica del termine greco, riferito a dotti orientali verosimilmente legati all’astrologia o alla sapienza di corte, senza definirli re, stabilirne il numero o attribuire loro caratteristiche non presenti nel testo.
translation_notes:
  register: Italiano moderno, dignitoso e narrativamente scorrevole. «Ecco» mantiene il rilievo del segnale discorsivo greco; «magi» privilegia la precisione storica, mentre la nota ne chiarisce il significato per il lettore comune.
