id: MAT.2.12
reference: Matthew 2:12
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: καὶ χρηματισθέντες κατ’ ὄναρ μὴ ἀνακάμψαι πρὸς Ἡρῴδην δι’ ἄλλης ὁδοῦ ἀνεχώρησαν εἰς τὴν χώραν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/012.yaml
  text: And having been warned in a dream not to return to Herod[b][a], they departed for their own country by another route.
translation:
  language: it
  text: Avvertiti[a] in sogno di non tornare da Erode, partirono per il loro paese seguendo un’altra strada[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oppure «avvertiti da Dio». Il passivo greco implica un avvertimento di origine divina, anche se in questo versetto Dio non è nominato esplicitamente.
    reason: lexical_alternative
  - marker: b
    text: Oppure «per un altro itinerario».
    reason: lexical_alternative
lexical_decisions:
- source_word: χρηματισθέντες
  choice: avvertiti
  rationale: Il participio passivo indica che ricevettero un avvertimento, verosimilmente di origine divina nel contesto, senza però nominare esplicitamente Dio.
- source_word: κατ’ ὄναρ
  choice: in sogno
  rationale: È la resa idiomatica e naturale dell’espressione greca che indica una comunicazione ricevuta durante un sogno.
- source_word: μὴ ἀνακάμψαι
  choice: di non tornare
  rationale: μή con l’infinito esprime il contenuto negativo dell’avvertimento; «tornare» si adatta al contesto del viaggio.
- source_word: πρὸς Ἡρῴδην
  choice: da Erode
  rationale: In italiano, con un verbo di ritorno e una persona come meta, «tornare da Erode» è più naturale di una resa letterale con «verso».
- source_word: δι’ ἄλλης ὁδοῦ
  choice: seguendo un’altra strada
  rationale: ὁδός ha qui senso concreto; questa formulazione esprime chiaramente che scelsero un percorso diverso.
- source_word: ἀνεχώρησαν
  choice: partirono
  rationale: Nel contesto narrativo il verbo indica l’allontanarsi o il partire; «partirono» è chiaro e naturale senza accentuare indebitamente l’idea di fuga.
- source_word: εἰς τὴν χώραν αὐτῶν
  choice: per il loro paese
  rationale: χώρα indica qui la terra o il paese di provenienza dei magi; «il loro paese» rende naturalmente destinazione e possesso.
theological_decisions:
- issue: Origine divina implicita dell’avvertimento
  choice: Il testo principale usa il passivo «avvertiti» senza aggiungere «da Dio».
  alternative: «Avvertiti da Dio» oppure «avvertiti divinamente».
  rationale: Il passivo di χρηματίζω nel contesto implica verosimilmente l’azione divina, ma il versetto non nomina Dio; la resa conserva questa implicazione senza esplicitarla indebitamente.
translation_notes:
  register: Italiano moderno, chiaro e dignitoso. La sintassi conserva la sequenza logica del greco, mentre «tornare da Erode» e «seguendo un’altra strada» risultano idiomatici nell’uso contemporaneo.
