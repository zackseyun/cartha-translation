id: MAT.2.21
reference: Matthew 2:21
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: ὁ δὲ ἐγερθεὶς παρέλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ καὶ ⸀εἰσῆλθεν εἰς γῆν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/021.yaml
  text: So he rose, took the child and his mother, and entered the land of Israel.
translation:
  language: it
  text: Allora Giuseppe si alzò, prese con sé il bambino e sua madre ed entrò nella terra d’Israele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Allora
  rationale: Qui δέ fa progredire la narrazione senza esprimere un forte contrasto; «Allora» è naturale in italiano e conserva il valore connettivo.
- source_word: ἐγερθεὶς
  choice: si alzò
  rationale: Il participio aoristo passivo ha qui valore intransitivo e indica l’azione precedente; coordinandolo con «si alzò» si ottiene una sequenza italiana naturale.
- source_word: παρέλαβε
  choice: prese con sé
  rationale: παραλαμβάνω indica il prendere qualcuno con sé; la resa esplicita questo valore meglio del solo «prese».
- source_word: τὸ παιδίον
  choice: il bambino
  rationale: παιδίον designa qui il bambino già noto nel racconto, senza richiedere un’ulteriore specificazione dell’età.
- source_word: τὴν μητέρα αὐτοῦ
  choice: sua madre
  rationale: Il pronome αὐτοῦ si riferisce naturalmente al bambino; «sua madre» riproduce in modo conciso la relazione.
- source_word: εἰσῆλθεν
  choice: entrò
  rationale: εἰσέρχομαι significa entrare o andare dentro; «entrò» conserva la direzione espressa dalla frase seguente ed è dignitoso ma corrente.
- source_word: εἰς γῆν Ἰσραήλ
  choice: nella terra d’Israele
  rationale: La costruzione indica il territorio d’Israele; «terra d’Israele» ne conserva il carattere geografico-nazionale.
theological_decisions:
- issue: Soggetto sottinteso del versetto
  choice: Giuseppe
  alternative: egli
  rationale: Il greco presenta un soggetto sottinteso, recuperabile senza ambiguità dal contesto immediato (Mt 2,20). Esplicitare «Giuseppe» evita in italiano che «si alzò» possa essere momentaneamente riferito al bambino, senza introdurre un’identificazione estranea al contesto.
translation_notes:
  register: Italiano standard moderno, narrativo e dignitoso. La coordinazione dei verbi sostituisce naturalmente il participio greco; «prese con sé» mantiene il valore specifico di παραλαμβάνω. Nessuna nota testuale è necessaria per la variante segnalata nell’edizione, che non modifica sostanzialmente la resa.
