id: MAT.2.6
reference: Matthew 2:6
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Καὶ σύ, Βηθλέεμ γῆ Ἰούδα, οὐδαμῶς ἐλαχίστη εἶ ἐν τοῖς ἡγεμόσιν Ἰούδα· ἐκ σοῦ γὰρ ἐξελεύσεται ἡγούμενος, ὅστις ποιμανεῖ τὸν λαόν μου τὸν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/006.yaml
  text: And you[a], Bethlehem, land of Judah, are by no means least among the rulers of Judah[b]; for from you will come a ruler who will shepherd my people Israel.
translation:
  language: it
  text: «E tu, Betlemme, terra di Giuda, non sei affatto la meno importante fra i capi di Giuda; da te infatti uscirà[a] un capo che pascerà[b] il mio popolo, Israele».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «verrà fuori».
    reason: lexical_alternative
  - marker: b
    text: «Pascere» può avere anche il senso di «governare», unendo l’immagine della cura pastorale a quella dell’autorità regale.
    reason: lexical_alternative
lexical_decisions:
- source_word: γῆ
  choice: terra
  rationale: In apposizione a «Betlemme» e con il genitivo «di Giuda», indica il territorio associato a Giuda; «terra» conserva in modo naturale il valore geografico.
- source_word: οὐδαμῶς
  choice: non ... affatto
  rationale: Rende la negazione enfatica dell’avverbio greco, più forte di un semplice «non».
- source_word: ἐλαχίστη
  choice: la meno importante
  rationale: Nel contesto il superlativo riguarda soprattutto rango e rilevanza, non soltanto dimensioni fisiche; la formulazione mantiene il contrasto senza ridurre il senso a «più piccola».
- source_word: ἡγεμόσιν
  choice: capi
  rationale: Il termine designa autorità o guide di Giuda. «Capi» conserva l’idea di governo senza imporre l’ufficio politico più specifico evocato da «governatori».
- source_word: ἐξελεύσεται
  choice: uscirà
  rationale: Rende direttamente il futuro di ἐξέρχομαι e conserva l’immagine di qualcuno che proviene da Betlemme.
- source_word: ἡγούμενος
  choice: un capo
  rationale: Il participio sostantivato indica colui che guida o governa; «un capo» mantiene anche il legame lessicale e concettuale con i «capi di Giuda».
- source_word: ποιμανεῖ
  choice: pascerà
  rationale: Conserva la metafora pastorale di ποιμαίνω, che nel contesto include anche l’esercizio dell’autorità.
- source_word: λαόν μου τὸν Ἰσραήλ
  choice: il mio popolo, Israele
  rationale: La virgola rende esplicita in italiano l’apposizione, preservando senza ampliamenti l’espressione di appartenenza al popolo di Dio.
theological_decisions:
- issue: Dimensione regale e pastorale della figura annunciata
  choice: Rendere ἡγούμενος con «un capo» e ποιμανεῖ con «pascerà».
  alternative: Uniformare entrambe le espressioni in senso politico («un governante che governerà») oppure esclusivamente pastorale.
  rationale: Il testo accosta autorità e cura pastorale. Mantenere entrambe le immagini evita di sciogliere la tensione messianica a favore di una sola dimensione.
- issue: Natura dei «capi di Giuda»
  choice: Conservare il riferimento personale e governativo con «capi».
  alternative: Interpretare il termine come «capoluoghi», «clan» o «principati».
  rationale: Il greco di Matteo usa ἡγεμόσιν, termine che indica propriamente capi o governanti. Una resa territoriale armonizzerebbe il testo con il retroterra di Michea, ma renderebbe meno direttamente la forma matteana.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. La struttura solenne della citazione è conservata senza arcaismi marcati; «pascerà» è un termine biblico ancora comprensibile e necessario per mantenere la metafora pastorale.
