  text: saying[a], “Get up, take the child and his mother, and go to the land of Israel, for those seeking the child’s life are dead.”
translation:
  language: it
  text: 'dicendo: «Alzati, prendi con te il bambino e sua madre e va’ nella terra d’Israele, perché quelli che cercano di togliere la vita al bambino sono morti[a]».'
  philosophy: optimal-equivalence
  footnotes:
