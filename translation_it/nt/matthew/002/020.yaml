    text: 'Più letteralmente: «quelli che cercano la vita del bambino sono morti».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: dicendo
  rationale: Il participio presente introduce le parole dell’angelo e mantiene il collegamento sintattico con il versetto precedente.
- source_word: Ἐγερθείς
  choice: Àlzati
  rationale: Il participio aoristo, unito all’imperativo seguente, ha qui valore idiomatico di comando; «Àlzati» è naturale e diretto in italiano.
- source_word: παράλαβε
  choice: prendi con te
  rationale: Nel contesto παραλαμβάνω indica il prendere qualcuno con sé, non il semplice ricevere.
- source_word: τὸ παιδίον
  choice: il bambino
  rationale: Rende παιδίον in modo preciso e corrente, senza aggiungere una specificazione d’età non richiesta dal greco.
- source_word: τὴν μητέρα αὐτοῦ
  choice: sua madre
  rationale: Riproduce naturalmente in italiano il rapporto espresso dal pronome possessivo greco.
- source_word: πορεύου
  choice: va’
  rationale: L’imperativo medio di πορεύομαι esprime qui il semplice comando di andare.
- source_word: εἰς γῆν Ἰσραήλ
  choice: nella terra d’Israele
  rationale: Conserva il riferimento territoriale di γῆ Ἰσραήλ; «nella» rende naturalmente il movimento verso l’interno del territorio.
- source_word: τεθνήκασιν
  choice: sono morti
  rationale: Il perfetto indica una morte avvenuta i cui effetti permangono; in italiano «sono morti» esprime naturalmente sia l’evento sia lo stato risultante.
- source_word: οἱ ζητοῦντες
  choice: quelli che cercavano
  rationale: La forma relativa è più naturale in italiano del participio sostantivato e l’imperfetto colloca la ricerca nel periodo precedente alla loro morte.
- source_word: τὴν ψυχὴν τοῦ παιδίου
  choice: di togliere la vita al bambino
  rationale: In questa espressione ψυχή significa la vita minacciata; la formulazione italiana esplicita in modo idiomatico l’intento omicida senza introdurre il concetto di «anima».
theological_decisions:
- issue: Resa di ψυχή in un contesto di minaccia mortale
  choice: vita
  alternative: anima
  rationale: L’espressione «cercare la ψυχή» indica qui il tentativo di uccidere il bambino. «Anima» introdurrebbe un significato antropologico o teologico estraneo al contesto immediato.
translation_notes:
  register: Italiano moderno, dignitoso e accessibile. «Prendi con te» rende esplicito il valore accompagnativo di παραλαμβάνω; «va’» conserva il tono diretto del comando. La nota segnala la forma più letterale dell’idioma greco relativo alla vita del bambino.
