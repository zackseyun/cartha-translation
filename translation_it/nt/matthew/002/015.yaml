id: MAT.2.15
reference: Matthew 2:15
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: καὶ ἦν ἐκεῖ ἕως τῆς τελευτῆς Ἡρῴδου· ἵνα πληρωθῇ τὸ ῥηθὲν ⸀ὑπὸ κυρίου διὰ τοῦ προφήτου λέγοντος· Ἐξ Αἰγύπτου ἐκάλεσα τὸν υἱόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/015.yaml
  text: and was there until the death of Herod[a], so that what was spoken by the Lord through the prophet might be fulfilled, saying[c][b], “Out of Egypt I called my son.”
translation:
  language: it
  text: 'e rimase là fino alla morte di Erode, affinché si adempisse ciò che era stato detto dal Signore per mezzo del profeta: «Dall’Egitto ho chiamato mio figlio».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Matteo cita Osea 11:1, che nel suo contesto originario si riferisce a Israele come figlio di Dio; qui presenta Gesù come colui nel quale questa Scrittura trova adempimento.
    reason: cross_reference
lexical_decisions:
- source_word: ἦν ἐκεῖ
  choice: rimase là
  rationale: Benché alla lettera significhi «era là», nel contesto l’imperfetto esprime la permanenza in Egitto; «rimase là» è naturale in italiano e non aggiunge un’idea estranea.
- source_word: ἕως τῆς τελευτῆς Ἡρῴδου
  choice: fino alla morte di Erode
  rationale: τελευτή indica qui la morte, ossia la fine della vita; la costruzione nominale italiana rispecchia bene quella greca.
- source_word: ἵνα πληρωθῇ
  choice: affinché si adempisse
  rationale: Conserva la formula matteana di adempimento e la possibile sfumatura di scopo o risultato, senza ridurla a un semplice infinito.
- source_word: τὸ ῥηθὲν ὑπὸ κυρίου διὰ τοῦ προφήτου
  choice: ciò che era stato detto dal Signore per mezzo del profeta
  rationale: Mantiene la forma passiva e distingue il Signore, fonte della parola, dal profeta, suo tramite umano. Il trapassato è idiomatico in italiano per una parola pronunciata in precedenza.
- source_word: λέγοντος
  choice: ':'
  rationale: In italiano i due punti introducono la citazione in modo più naturale di un calco come «dicendo», conservandone pienamente la funzione narrativa.
- source_word: Ἐξ Αἰγύπτου
  choice: Dall’Egitto
  rationale: La preposizione italiana «da» esprime naturalmente sia l’origine sia il moto da luogo indicato da ἐξ, senza bisogno dell’innaturale «fuori dall’Egitto».
- source_word: ἐκάλεσα
  choice: ho chiamato
  rationale: καλέω indica il chiamare, qui con la sfumatura contestuale del chiamare fuori; «ho chiamato» mantiene anche il riconoscibile legame con Osea 11:1.
- source_word: τὸν υἱόν μου
  choice: mio figlio
  rationale: υἱός significa specificamente «figlio»; questa formulazione conserva il linguaggio filiale essenziale sia nella citazione di Osea sia nell’applicazione matteana.
theological_decisions:
- issue: Formula di adempimento e citazione di Osea 11:1
  choice: Conservare l’affermazione che l’esperienza di Gesù adempie la parola profetica
  alternative: Specificare nel testo una predizione diretta oppure una ricapitolazione tipologica di Israele
  rationale: Matteo afferma esplicitamente l’adempimento, ma non ne definisce qui il meccanismo. La formulazione scelta preserva la tensione tra il riferimento originario a Israele e l’applicazione a Gesù senza imporre una teoria interpretativa.
- issue: κύριος nella formula di adempimento
  choice: Signore
  alternative: SIGNORE
  rationale: Il testo greco ha κύριος; «Signore» lo rende direttamente, senza introdurre nel testo italiano una forma tipografica del nome divino che il greco non distingue.
translation_notes:
  register: Italiano standard moderno, dignitoso e leggibile. «Rimase là» rende esplicita in modo naturale la permanenza implicata dal contesto; «affinché si adempisse» conserva il tono solenne della formula matteana. La citazione usa le virgolette caporali secondo l’uso editoriale italiano.
