id: MAT.2.7
reference: Matthew 2:7
language:
  code: it
  name: Italian
  native_name: Italiano
  variant: modern standard Italian
source:
  edition: SBLGNT
  text: Τότε Ἡρῴδης λάθρᾳ καλέσας τοὺς μάγους ἠκρίβωσεν παρ’ αὐτῶν τὸν χρόνον τοῦ φαινομένου ἀστέρος,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/007.yaml
  text: Then Herod secretly summoned the magi and determined from them the time when the star had appeared,[a]
translation:
  language: it
  text: Allora Erode convocò di nascosto i magi[a] e si fece precisare da loro il tempo in cui la stella era apparsa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O «sapienti». Il greco μάγοι indica più precisamente dei magi, studiosi orientali esperti anche di astrologia.
    reason: Alternativa lessicale e chiarimento storico-semantico, evitando di identificare i personaggi con i re della tradizione successiva.
lexical_decisions:
- source_word: Τότε
  choice: Allora
  rationale: Segna il passaggio all'evento successivo e mantiene con naturalezza il flusso narrativo.
- source_word: Ἡρῴδης
  choice: Erode
  rationale: Forma italiana tradizionale e standard del nome proprio.
- source_word: λάθρᾳ
  choice: di nascosto
  rationale: Esprime chiaramente il carattere segreto e dissimulato dell'azione con un italiano corrente.
- source_word: καλέσας
  choice: convocò
  rationale: Il participio aoristo indica un'azione anteriore o strettamente connessa alla principale; la coordinazione implicita resa con il verbo finito è naturale in italiano, mentre «convocò» conserva il carattere deliberato della chiamata.
- source_word: τοὺς μάγους
  choice: i magi
  rationale: È la resa più diretta di μάγοι e non introduce elementi della successiva tradizione narrativa; una spiegazione lessicale è fornita in nota.
- source_word: ἠκρίβωσεν
  choice: si fece precisare
  rationale: Il verbo comunica l'atto di accertare con esattezza qualcosa interrogando altri; questa formulazione conserva sia la precisione sia la fonte dell'informazione.
- source_word: παρ’ αὐτῶν
  choice: da loro
  rationale: παρά con il genitivo indica la fonte da cui Erode ottenne l'informazione.
- source_word: τὸν χρόνον
  choice: il tempo
  rationale: Mantiene il senso non ulteriormente specificato di χρόνος; l'idea di esattezza è già espressa da «si fece precisare».
- source_word: τοῦ φαινομένου ἀστέρος
  choice: in cui la stella era apparsa
  rationale: Rende il genitivo con participio presente mediante una naturale proposizione temporale italiana. Il trapassato colloca l'apparizione prima dell'indagine di Erode senza definire oltre la natura o la durata del fenomeno.
theological_decisions: []
translation_notes:
  register: Italiano moderno, dignitoso e narrativamente scorrevole. «Di nascosto» è più naturale di «segretamente»; «si fece precisare» comunica l'accertamento accurato senza appesantire il periodo. Il marcatore [a] compare nel testo principale.
