  text: Ἐν ἀρχῇ ἦν ὁ λόγος, καὶ ὁ λόγος ἦν πρὸς τὸν θεόν, καὶ θεὸς ἦν ὁ λόγος.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/001.yaml
  text: In the beginning was the Word[a], and the Word was with God[b], and the Word was God.
translation:
  language: it
  text: In principio[a] era la Parola, e la Parola era con Dio, e la Parola era Dio.[b]
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: L'espressione richiama Genesi 1:1 e collega la Parola con il principio della creazione.
    reason: cross_reference
  - marker: b
    text: 'Oppure: «la Parola era divina» o «ciò che Dio era, la Parola lo era». In greco, nell''ultima proposizione «Dio» ha valore qualitativo: descrive ciò che la Parola era, pur distinguendola da «Dio» nella proposizione precedente.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐν ἀρχῇ
  choice: In principio
  rationale: Riprende in modo naturale e riconoscibile Genesi 1:1, conservando il richiamo letterario e teologico all'inizio della creazione.
- source_word: ἦν
  choice: era
  rationale: L'imperfetto di εἰμί è reso naturalmente con «era»; la ripetizione conserva la cadenza del testo greco senza introdurre l'esplicitazione «esisteva».
- source_word: ὁ λόγος
  choice: la Parola
  rationale: «Parola» comunica in italiano moderno sia l'idea di espressione e rivelazione sia la funzione personale del titolo nel contesto giovanneo. È più trasparente per il lettore comune di «Logos» e meno filosoficamente connotato; rispetto a «Verbo», rende più direttamente il valore ordinario di λόγος.
- source_word: πρὸς τὸν θεόν
  choice: con Dio
  rationale: Nel contesto, πρός con l'accusativo esprime relazione e orientamento personale. «Con Dio» è italiano naturale e mantiene la distinzione tra la Parola e Dio; «verso Dio» risulterebbe troppo letterale, mentre «presso Dio» avrebbe un registro più tradizionale e meno corrente.
- source_word: τὸν θεόν
  choice: Dio
  rationale: L'espressione articolata indica Dio in modo personale e definito; in italiano il nome divino non richiede l'articolo in questa costruzione.
- source_word: θεὸς ἦν ὁ λόγος
  choice: la Parola era Dio
  rationale: L'ordine italiano naturale rende il predicato θεός senza trasformarlo in indefinito. La formulazione afferma ciò che la Parola era quanto alla sua natura, mentre la proposizione precedente mantiene la distinzione personale.
theological_decisions:
- issue: Resa del predicato θεός privo di articolo nell'ultima proposizione
  choice: la Parola era Dio
  alternative: la Parola era divina; ciò che Dio era, la Parola lo era
  rationale: 'Il predicato anteposto ha qui valore qualitativo: attribuisce alla Parola la natura di Dio senza identificarla personalmente con il Dio presso il quale era nella proposizione precedente. La resa principale è concisa, fedele e tradizionale; la nota conserva la sfumatura e le alternative senza risolvere indebitamente la tensione del greco.'
translation_notes:
  register: Italiano moderno, chiaro e dignitoso. «La Parola» è preferito a «il Verbo» per trasparenza semantica, senza perdere il carattere titolare e personale dell'espressione. La coordinazione ripetuta con «e» conserva il ritmo solenne del greco.
