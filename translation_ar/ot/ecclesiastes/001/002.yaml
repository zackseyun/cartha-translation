  text: הֲבֵ֤ל הֲבָלִים֙ אָמַ֣ר קֹהֶ֔לֶת הֲבֵ֥ל הֲבָלִ֖ים הַ/כֹּ֥ל הָֽבֶל׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/002.yaml
  text: Breath of breaths[a], says Qoheleth[b]; breath of breaths, all is mere breath.
translation:
  language: ar
  text: نَفَسُ الأنفاس[a]، يقول قوهلت[b]؛ نَفَسُ الأنفاس، كلُّ شيءٍ ما هو إلا نَفَس.
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 'العبرية הֶבֶל تعني حرفيًا «نَفَسًا» أو «بخارًا». وترد الكلمة ثمانٍ وثلاثين مرة في السفر، بوصفها صورة تحمل معاني مترابطة: ما يزول سريعًا، وما لا يمكن الإمساك به، وما يكشف مفارقةً بين المتوقع والواقع. لا تؤدي كلمة عربية واحدة هذه المعاني كلها؛ لذلك أبقينا الصورة الحسية. وتركيب «نَفَس الأنفاس» ينقل بناءً عبريًا يفيد غاية الدرجة، مثل «نشيد الأنشاد» و«قدس الأقداس».'
    reason: تصحيح التهجئة وتدقيق الوصف اللغوي لبناء التفضيل، مع الحفاظ على القرار المعجمي.
lexical_decisions:
- source_word: הֶבֶל
  choice: نَفَس
  rationale: تدل الكلمة العبرية في أصلها على النَّفَس أو البخار، وتستعمل في السفر صورةً تجمع قِصَر البقاء وتعذّر الإمساك والمفارقة بين المتوقع والواقع. يحفظ «نَفَس» الصورة الحسية ولا يحصرها في معنى تجريدي واحد مثل العبث أو البطلان أو انعدام المعنى.
- source_word: הֲבֵל הֲבָלִים
  choice: نَفَسُ الأنفاس
  rationale: تركيب الإضافة إلى الجمع يفيد غاية الدرجة في العبرية، على مثال «نشيد الأنشاد» و«قدس الأقداس». وتحافظ الصياغة العربية على بنية الأصل وصورته معًا.
- source_word: אָמַר
  choice: يقول
  rationale: مع أن الفعل العبري تامّ الصيغة، فإنه يَرِد هنا في إطار قول أدبي ذي قوة حاضرة؛ لذلك ينقل المضارع العربي العبارة نقلاً طبيعيًا حيًا.
- source_word: קֹהֶלֶת
  choice: قوهلت
  rationale: نُقل اللقب/الاسم العبري صوتيًا بدل تفسيره بـ«المعلّم» أو «الواعظ»، لأن كلا التفسيرين يضيّق دلالته المحتملة.
- source_word: הַכֹּל
  choice: كلُّ شيء
  rationale: تعبير عربي طبيعي يحفظ الشمول الذي تؤديه العبارة العبرية.
- source_word: הָבֶל
  choice: ما هو إلا نَفَس
  rationale: تجعل صيغة الحصر العربية العبارة حكمًا تقويميًا لا تعريفًا لمادة الأشياء، وتؤدي معنى التقليل الكامن في السياق من غير التخلي عن صورة النَّفَس.
theological_decisions:
- issue: كيفية نقل הֶבֶל، الصورة المحورية في سفر الجامعة
  choice: الإبقاء على الصورة الحسية «نَفَس» في المواضع الثلاثة، مع صيغة الحصر في الجملة الأخيرة.
  alternative: باطل؛ عبث؛ عدم معنى؛ زائل؛ بخار
  rationale: الألفاظ التجريدية تحسم الدلالة في اتجاه واحد، وقد توحي «عدم معنى» بعدمية لا يصرّح بها النص. أما «نَفَس» فيُبقي معًا إيحاءات الزوال والاستعصاء على الإمساك والمفارقة، ويترك للسياق أن يطوّرها.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة أدبية رصينة. ضُبطت كلمة «نَفَس» لتجنب التباسها بـ«نَفْس». وحُفظ التوازي والتكرار المكثفان في الأصل، مع استعمال «ما هو إلا» في الخبر الأخير لإيصال نبرة التقليل والتقويض التي يحملها السياق.
