base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/001.yaml
  text: In the beginning, when God created the heavens and the earth[a]—
translation:
  language: ar
  text: في البدء، حين خلق الله السماوات والأرض[a]—
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 'تُترجم العبارة تقليديًا بوصفها جملة مكتملة: «في البدء خلق الله السماوات والأرض». لكن العبرية—حيث تأتي בְּרֵאשִׁית من غير أداة تعريف ويتلوها الفعل التام בָּרָא—تُقرأ على نحو طبيعي أكثر بوصفها جملة زمنية تابعة، على غرار تكوين 2:4ب. وعندئذ تكون الجملة الرئيسية في الآية 3: «وقال الله: ليكن نور».'
    reason: حذف البقايا التحريرية العرضية «فراغ.» من ختام الحاشية من دون تغيير مضمونها.
lexical_decisions:
- source_word: בְּרֵאשִׁית
  choice: في البدء، حين خلق
  rationale: لفظة רֵאשִׁית هنا غير معرَّفة، وتليها صيغة الفعل التام בָּרָא؛ لذلك تُفهم العبارة على نحو طبيعي بوصفها جملة زمنية تابعة. وتحافظ «في البدء» على الدلالة المعجمية للفظة، بينما يبيّن «حين» ارتباطها بما يلي.
- source_word: בָּרָא
  choice: خلق
  rationale: هذا هو المقابل العربي المباشر والمألوف للفعل العبري الدال هنا على عمل الله الخالق، من غير تحديد لكيفية الخلق.
- source_word: אֱלֹהִים
  choice: الله
  rationale: مع أن صيغة الاسم العبرية جمع من حيث البنية، فإن الفعل المسند إليه هنا مفرد، مما يدل على أن المقصود هو الله بصيغة المفرد.
- source_word: אֵת
  choice: '[لا تُترجم؛ أداة لتحديد المفعول به المباشر]'
  rationale: تؤدي אֵת وظيفة نحوية في العبرية ولا يقابلها لفظ مستقل لازم في العربية، وتظهر وظيفتها من تركيب الجملة.
- source_word: הַשָּׁמַיִם
  choice: السماوات
  rationale: تحافظ صيغة الجمع العربية على صورة اللفظ العبري، كما أن اقتران «السماوات» بـ«الأرض» يدل على مجموع النظام المخلوق.
- source_word: הָאָרֶץ
  choice: الأرض
  rationale: قد تعني אָרֶץ «الأرض» أو «البلاد»، لكن اقترانها بالسماوات في هذا السياق الكوني يرجّح «الأرض».
theological_decisions:
- issue: البنية النحوية لعبارة الاستهلال
  choice: 'جملة زمنية تابعة: «في البدء، حين خلق الله السماوات والأرض—»'
  alternative: 'جملة رئيسية مكتملة: «في البدء خلق الله السماوات والأرض.»'
  rationale: ترجّح الصيغة غير المعرَّفة בְּרֵאשִׁית، مع مجيء الفعل التام בָּרָא بعدها، قراءة العبارة بوصفها تمهيدًا زمنيًا تتجه فيه البنية إلى الجملة الرئيسية في الآية 3. وتوجد تراكيب افتتاحية مشابهة في تكوين 2:4ب وهوشع 1:2. ومع ذلك، فالقراءة التقليدية بوصفها جملة مستقلة ممكنة وراسخة، ولذلك حُفظت في الحاشية بدل حسم موضع الخلاف لاهوتيًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «السماوات» للمحافظة على صيغة الجمع العبرية، ووُضعت الشرطة الطويلة في الختام للدلالة على أن الجملة متصلة بما يلي وليست مكتملة في هذه الآية وحدها.
