  text: You are my friends if you do what I command you[a].
translation:
  language: ar
  text: أنتم أصدقائي إن فعلتم ما أنا آمركم به.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'وبصياغة أكثر حرفية: «أنتم أصدقائي إن فعلتم الأمور التي أنا آمركم بها».'
    reason: بديل معجمي يحافظ بصورة أوضح على صيغة الجمع في ἃ، مع أن «ما» أكثر طبيعية في العربية.
lexical_decisions:
- source_word: ὑμεῖς
  choice: أنتم
  rationale: ضمير جمع المخاطبين مذكور صراحةً في أول الجملة للتوكيد، وإبرازه في العربية يحفظ هذا التوكيد بصورة طبيعية.
- source_word: φίλοι μού
  choice: أصدقائي
  rationale: تدل العبارة على علاقة الصداقة والقرب، وصيغة «أصدقائي» هي المقابل العربي الطبيعي الموجز.
- source_word: ἐστε
  choice: '[مفهوم من الجملة الاسمية]'
  rationale: فعل الكينونة في المضارع لا يُعبَّر عنه عادةً بفعل ظاهر في الجملة الاسمية العربية.
- source_word: ἐὰν
  choice: إن
  rationale: تقدّم شرطًا حقيقيًا مع صيغة الاحتمال في اليونانية، و«إن» تحفظ طابعه الشرطي بوضوح من غير تحويله إلى معنى زمني.
- source_word: ποιῆτε
  choice: فعلتم
  rationale: ينقل معنى القيام بما أُمر به. صيغة الماضي بعد «إن» أسلوب عربي فصيح للدلالة على الشرط المستقبل أو العام، ولا تعني هنا زمنًا ماضيًا.
- source_word: ἃ
  choice: ما
  rationale: اسم موصول عام يشير إلى مضمون وصايا يسوع، و«ما» أفصح وأوجز من «الأشياء التي» في هذا السياق.
- source_word: ἐγὼ
  choice: '[مستتر في «آمركم»]'
  rationale: تدل صيغة المتكلم في الفعل العربي على الضمير صراحةً من جهة التصريف؛ وإضافة «أنا» قد تثقل العبارة، مع بقاء التوكيد مفهومًا من السياق.
- source_word: ἐντέλλομαι ὑμῖν
  choice: آمركم به
  rationale: «آمر» يحفظ سلطة التكليف في الفعل اليوناني، و«به» تستأنف الموصول «ما» بأسلوب عربي طبيعي واضح.
theological_decisions:
- issue: طبيعة العلاقة الشرطية بين صداقة يسوع والطاعة
  choice: «أنتم أصدقائي إن فعلتم ما آمركم به»
  alternative: «أنتم أصدقائي حين تفعلون ما آمركم به»
  rationale: تركيب ἐὰν مع صيغة الاحتمال يفيد الشرط على نحو أرجح من مجرد التوقيت. تحافظ الصياغة على الصلة التي يقررها النص بين الصداقة والطاعة، من غير أن تحسم أسئلة لاهوتية أوسع عن الاستحقاق أو الثبات.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. استُخدمت جملة اسمية طبيعية، وحُفظ الشرط صريحًا، ووُضع مؤشر الحاشية [a] في المتن.
