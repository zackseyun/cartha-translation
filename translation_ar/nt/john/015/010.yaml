  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἐὰν τὰς ἐντολάς μου τηρήσητε, μενεῖτε ἐν τῇ ἀγάπῃ μου, καθὼς ἐγὼ ⸂τὰς ἐντολὰς τοῦ πατρός μου⸃ τετήρηκα καὶ μένω αὐτοῦ ἐν τῇ ἀγάπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/010.yaml
  text: If you keep my commandments, you will remain in my love, just as I have kept my Father's commandments and remain in his love.
translation:
  language: ar
  text: إِنْ حَفِظْتُمْ وَصَايَايَ، تَثْبُتُونَ فِي مَحَبَّتِي، كَمَا أَنِّي حَفِظْتُ وَصَايَا أَبِي وَأَثْبُتُ فِي مَحَبَّتِهِ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν
  choice: إِنْ
  rationale: تقدّم شرطًا حقيقيًا مع صيغة الاحتمال، من غير إضافة معنى التكرار.
- source_word: ἐντολάς
  choice: وَصَايَا
  rationale: تنقل معنى الأوامر الملزمة، وهي صياغة عربية راسخة وطبيعية في هذا السياق.
- source_word: τηρήσητε / τετήρηκα
  choice: حَفِظْتُمْ / حَفِظْتُ
  rationale: يحافظ «حفظ» على معنى المراعاة الأمينة للوصايا وعلى التكرار اللفظي في اليونانية؛ وصيغة الماضي العربية طبيعية بعد «إن» وفي إفادة الفعل التام.
- source_word: μενεῖτε / μένω
  choice: تَثْبُتُونَ / أَثْبُتُ
  rationale: «ثبت في» تعبير عربي واضح ينقل الاستمرار العلاقي ويحافظ على تكرار اللفظ المحوري في يوحنا.
- source_word: ἐν τῇ ἀγάπῃ μου / αὐτοῦ ἐν τῇ ἀγάπῃ
  choice: فِي مَحَبَّتِي / فِي مَحَبَّتِهِ
  rationale: يحفظ صورة الوجود ضمن نطاق المحبة والتوازي بين محبة الابن ومحبة الآب.
- source_word: καθὼς
  choice: كَمَا أَنِّي
  rationale: تدل بوضوح على المقارنة والاقتداء بين حفظ التلاميذ وحفظ يسوع.
- source_word: τοῦ πατρός μου
  choice: أَبِي
  rationale: صياغة عربية طبيعية ومباشرة للملكية، مع وضوح الإشارة إلى الآب في السياق.
theological_decisions:
- issue: العلاقة بين حفظ الوصايا والثبات في محبة يسوع
  choice: 'إبقاء العبارة شرطية مباشرة: «إن حفظتم... تثبتون».'
  alternative: تفسير الطاعة بأنها استحقاق للمحبة، أو بأنها مجرد دليل لا يحمل الشرط أي قوة حقيقية.
  rationale: النص اليوناني يقرر علاقة شرطية فعلية ويقارنها بطاعة يسوع، لكنه لا يحسم هنا مسائل الاستحقاق أو الخلاص أو المثابرة؛ لذلك لا تضيف الترجمة تفسيرًا عقائديًا.
- issue: دلالة ἀγάπη
  choice: مَحَبَّة
  alternative: إحسان
  rationale: «محبة» هي المقابل العربي الواضح والطبيعي، وتحفظ الرابط اللفظي في شطري الآية.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُخدم «تثبتون» بدل تعبيرات أقدم مثل «تمكثون» لبيان الاستمرار العلاقي بصورة طبيعية، مع الحفاظ على التوازي والتكرار المقصودين في الأصل.
