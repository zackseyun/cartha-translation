  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: μείνατε ἐν ἐμοί, κἀγὼ ἐν ὑμῖν. καθὼς τὸ κλῆμα οὐ δύναται καρπὸν φέρειν ἀφ’ ἑαυτοῦ ἐὰν μὴ ⸀μένῃ ἐν τῇ ἀμπέλῳ, οὕτως οὐδὲ ὑμεῖς ἐὰν μὴ ἐν ἐμοὶ ⸀μένητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/004.yaml
  text: Remain in me[a], and I in you. Just as the branch is not able to bear fruit by itself unless it remains in the vine, so neither can you unless you remain in me.
translation:
  language: ar
  text: اثبتوا فيَّ[a]، وأنا فيكم. وكما أن الغصن لا يقدر أن يحمل ثمرًا من ذاته إن لم يثبت في الكرمة، كذلك أنتم أيضًا لا تقدرون أن تحملوا ثمرًا إن لم تثبتوا فيَّ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «امكثوا فيَّ». يدل الفعل اليوناني μένω على البقاء والاستمرار والمكث.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μείνατε / μένῃ / μένητε
  choice: اثبتوا / يثبت / تثبتوا
  rationale: الفعل «ثبت» عربي فصيح وطبيعي في هذا السياق، ويحفظ معنى الاستمرار والمكث في علاقة حية، كما يتيح تكرار اللفظ اليوناني المحوري بصيغة متسقة.
- source_word: ἐν ἐμοί / ἐν ἐμοὶ
  choice: فيَّ
  rationale: تحفظ «في» صورة الاتحاد والمشاركة التي تفيدها ἐν، بدل اختزالها إلى مجرد المصاحبة.
- source_word: κἀγὼ ἐν ὑμῖν
  choice: وأنا فيكم
  rationale: يحفظ التركيب الإيجازي في اليونانية، حيث لا يرد فعل صريح، ولا يضيف زمنًا أو صيغة وعد غير مصرّح بها.
- source_word: τὸ κλῆμα
  choice: الغصن
  rationale: المقابل العربي المألوف والدقيق للفرع الخارج من الكرمة ضمن الصورة الزراعية.
- source_word: οὐ δύναται καρπὸν φέρειν
  choice: لا يقدر أن يحمل ثمرًا
  rationale: يحفظ دلالة القدرة في δύναμαι والتعبير المجازي الزراعي «يحمل ثمرًا».
- source_word: ἀφ’ ἑαυτοῦ
  choice: من ذاته
  rationale: ينقل معنى المصدر أو الاستقلال الكامن في العبارة، أي إن الغصن لا ينتج الثمر انطلاقًا من ذاته.
- source_word: ἐν τῇ ἀμπέλῳ
  choice: في الكرمة
  rationale: ترجمة مباشرة تحفظ صورة الغصن كائنًا في الكرمة، من غير إضافة تفسير مثل «متصلًا بالكرمة».
- source_word: οὕτως οὐδὲ ὑμεῖς
  choice: كذلك أنتم أيضًا لا تقدرون
  rationale: يستعيد فعل القدرة المفهوم من الجملة السابقة ويجعل العبارة العربية مكتملة وطبيعية، مع بقاء محمول «حمل الثمر» مفهومًا من المقارنة.
theological_decisions:
- issue: دلالة μένω في سياق علاقة التلاميذ بالمسيح
  choice: اثبتوا فيَّ
  alternative: امكثوا فيَّ
  rationale: «اثبتوا» تجمع الاستمرار وعدم الانفصال وتحافظ على الثقل العلاقي للصورة، من غير حصر المعنى في إقامة مكانية أو إدخال تصور مذهبي خاص.
- issue: الجملة المتبادلة الموجزة κἀγὼ ἐν ὑμῖν
  choice: وأنا فيكم
  alternative: وأثبت أنا فيكم
  rationale: ترك الفعل مقدرًا كما في اليونانية يحفظ الإيجاز والغموض النحوي المشروع، ولا يحوّل العبارة صراحةً إلى أمر أو وعد مستقبلي.
- issue: المحمول المحذوف بعد οὕτως οὐδὲ ὑμεῖς
  choice: كذلك أنتم أيضًا لا تقدرون
  alternative: كذلك أنتم أيضًا لا تحملون ثمرًا
  rationale: إظهار معنى القدرة المستفاد من οὐ δύναται يحفظ منطق المقارنة، بينما يظل «أن تحملوا ثمرًا» مفهومًا من الجملة السابقة دون تكرار ثقيل.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «اثبتوا» بوصفه تعبيرًا طبيعيًا في خطاب العلاقة والاستمرار، مع الحفاظ على تكرار الفعل المحوري وصورة الكرمة والغصن والإيجاز في «وأنا فيكم».
