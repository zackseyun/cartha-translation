  text: If the world hates you[a], know that it has hated me before you.
translation:
  language: ar
  text: «إن كان العالم يبغضكم، فاعلموا أنه قد أبغضني قبلكم[a].»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «قد أبغضني أولًا، قبلكم». تُستعمل «أولًا» هنا مع ضمير في حالة الإضافة للدلالة على الأولوية الزمنية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κόσμος
  choice: العالم
  rationale: يحافظ على اللفظ اليوحناوي الواسع، الذي قد يدل هنا على البشر في معارضتهم لله، من غير إدخال تفسير أضيق في صلب النص.
- source_word: μισεῖ
  choice: يبغض
  rationale: المضارع اليوناني يفيد الحالة العامة أو المستمرة، ويؤديها المضارع العربي بوضوح وطبيعية.
- source_word: γινώσκετε
  choice: فاعلموا
  rationale: الصيغة اليونانية تحتمل من جهة الشكل الخبر أو الأمر، لكن السياق يرجّح الأمر أو الحث؛ والفاء تربط الجواب بالشرط ربطًا عربيًا طبيعيًا.
- source_word: μεμίσηκεν
  choice: قد أبغضني
  rationale: تؤدي «قد» مع الماضي معنى الفعل السابق ذي الصلة بالحاضر، بما يلائم قوة التام اليوناني من غير تكلف.
- source_word: πρῶτον ὑμῶν
  choice: قبلكم
  rationale: ينقل الأولوية الزمنية المقصودة بعبارة عربية موجزة وطبيعية، مع إبقاء احتمال التعبير الحرفي «أولًا، قبل أن يبغضكم» في الحاشية.
theological_decisions:
- issue: دلالة κόσμος في لاهوت يوحنا
  choice: إبقاء «العالم» في المتن
  alternative: البشر المعارضون لله / نظام العالم
  rationale: للكلمة في السياق لون سلبي واضح، لكن توسيعها إلى تفسير لاهوتي صريح يضيّق عمدًا ما أبقاه النص أوسع.
- issue: خبرية γινώσκετε أو أمريتها
  choice: 'صيغة الأمر: «فاعلموا»'
  alternative: «فأنتم تعلمون»
  rationale: مع أن الشكل الصرفي يحتمل الوجهين، فإن تسلسل الخطاب بعد جملة الشرط يجعل الحث أقرب، مع بقاء الاحتمال النحوي الآخر حقيقيًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. اختير «يبغض» بدل «يكره» لاتساق النبرة الكتابية من غير غموض، وحُفظت مقابلة العالم للتلاميذ ويسوع دون شرح زائد.
