  text: ὁ ἐμὲ μισῶν καὶ τὸν πατέρα μου μισεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/023.yaml
  text: The one who hates me also hates my Father.
translation:
  language: ar
  text: مَنْ يُبْغِضُني يُبْغِضُ أَبي أيضًا.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ... μισῶν
  choice: مَنْ يُبْغِضُ
  rationale: أداة «مَنْ» مع الفعل المضارع صياغة عربية طبيعية تؤدي معنى اسم الفاعل المعرَّف المستعمل استعمالًا اسميًا، وتحافظ على الدلالة العامة على كل شخص يتصف بهذا الموقف.
- source_word: ἐμὲ
  choice: ني
  rationale: ضمير مفعول به للمتكلم، ويؤديه في العربية ضمير النصب المتصل بالفعل بوضوح وإيجاز.
- source_word: μισῶν / μισεῖ
  choice: يُبْغِضُ / يُبْغِضُ
  rationale: تكرار الفعل نفسه يحافظ على التكرار المعجمي في اليونانية، والمضارع العربي مناسب للحقيقة العامة المستمرة المقصودة هنا.
- source_word: καὶ
  choice: أيضًا
  rationale: تفيد «أيضًا» أن بغض الآب ملازم لبغض يسوع، وهي تؤدي قوة الربط الإضافية في καί بصورة طبيعية في العربية.
- source_word: τὸν πατέρα μου
  choice: أَبي
  rationale: الإضافة إلى ضمير المتكلم هي المقابل العربي الطبيعي للتركيب اليوناني، والسياق اليوحناوي يبين أن المقصود هو الله الآب.
theological_decisions:
- issue: دلالة «أبي» على الله الآب
  choice: أَبي
  alternative: والدي
  rationale: «أبي» تحافظ على اللقب العلائقي الذي يستعمله يسوع لله في إنجيل يوحنا، بينما «والدي» قد توحي بعلاقة بشرية بيولوجية وتضيّق الدلالة. ولا تحتاج العربية إلى تمييز هذا اللقب بحرف كبير.
translation_notes:
  register: صياغة فصحى واضحة وموجزة ذات نبرة كريمة. استُخدم التشكيل الجزئي لرفع احتمال التباس «يبغضني» و«أبي»، مع المحافظة على التوازي والتكرار في الأصل.
