  text: آمركم بهذه الأمور لكي تحبّوا بعضكم بعضًا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، من حيث المعنى: «هذه وصيتي لكم: أن تحبّوا بعضكم بعضًا». يمكن أن تُفهم الجملة التي تبدأ بـ«لكي» في اليونانية على أنها تعبّر عن الغاية أو النتيجة المقصودة، أو على أنها تقترب من بيان مضمون الأمر.'
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα
  choice: هذه الأمور
  rationale: اسم إشارة محايد في صيغة الجمع، ويُرجَّح أنه يعود إلى الوصايا أو التعاليم السابقة، مع إبقاء صيغة الجمع ظاهرة في العربية.
- source_word: ἐντέλλομαι
  choice: أُوصِي
  rationale: فعل مضارع يفيد إصدار وصية أو أمر. «أُوصِيكم» تعبير عربي طبيعي ومهيب يحفظ قوة التكليف من غير صياغة متكلّفة.
- source_word: ὑμῖν
  choice: كم في «أُوصِيكم»
  rationale: ضمير مخاطب جمع في حالة المفعول غير المباشر، وأُدمج طبيعيًا في الفعل العربي.
- source_word: ἵνα
  choice: لكي
  rationale: تحفظ دلالة الغاية أو النتيجة المقصودة، مع بقاء احتمال اقتراب الجملة من بيان مضمون الوصية مذكورًا في الحاشية.
- source_word: ἀγαπᾶτε
  choice: تحبّوا
  rationale: فعل مضارع منصوب بعد «لكي»، ينقل صيغة المضارع الالتزامي في اليونانية من غير إضافة معنى الاستمرار غير المصرّح به.
- source_word: ἀλλήλους
  choice: بعضكم بعضًا
  rationale: تعبير عربي فصيح وطبيعي يدل على المحبة المتبادلة بين أفراد الجماعة.
theological_decisions:
- issue: العلاقة بين الوصية وجملة ἵνα
  choice: 'صيغت الجملة على أنها غاية: «لكي تحبّوا بعضكم بعضًا»'
  alternative: '«أُوصِيكم بهذه الأمور: أن تحبّوا بعضكم بعضًا» أو «أُوصِيكم بهذا: أحبّوا بعضكم بعضًا»'
  rationale: تفيد ἵνα في أصلها الغاية أو النتيجة المقصودة، لكنها قد تقترب في أسلوب يوحنا من شرح مضمون الوصية؛ لذلك حُفظ المعنى الأرجح في المتن وسُجّل الاحتمال الآخر في الحاشية من غير حسم زائد.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. اختيرت «أُوصِيكم» بدل تركيب حرفي ثقيل، مع إبقاء «هذه الأمور» جمعًا موافقًا للنص اليوناني. وُضعت علامة الحاشية بعد الجملة التي تتناولها.
