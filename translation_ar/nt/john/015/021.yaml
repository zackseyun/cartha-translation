source:
  edition: SBLGNT
  text: ἀλλὰ ταῦτα πάντα ποιήσουσιν ⸂εἰς ὑμᾶς⸃ διὰ τὸ ὄνομά μου, ὅτι οὐκ οἴδασιν τὸν πέμψαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/021.yaml
  text: But they will do all these things to you because of my name[a], because they do not know the one who sent me.
translation:
  language: ar
  text: لكنهم سيفعلون بكم كل هذه الأمور بسبب اسمي، لأنهم لا يعرفون الذي أرسلني.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ
  choice: لكنهم
  rationale: تفيد ἀλλά استدراكًا قويًّا على الكلام السابق، و«لكن» هي الصياغة العربية الطبيعية؛ وأُلحِق بها الضمير اللازم للفعل.
- source_word: ταῦτα πάντα
  choice: هذه الأمور كلها
  rationale: تحفظ اسم الإشارة ودلالة الشمول في تركيب عربي واضح وطبيعي.
- source_word: ποιήσουσιν
  choice: سيفعلون
  rationale: تنقل صيغة المستقبل الخبرية مباشرة، من غير تضييق معنى الفعل إلى نوع محدد من المعاملة.
- source_word: εἰς ὑμᾶς
  choice: بكم
  rationale: تعبير عربي طبيعي عن أفعال موجَّهة إلى التلاميذ وواقعة بهم في سياق عدائي، من غير تشديد المعنى إلى «ضدكم».
- source_word: διὰ τὸ ὄνομά μου
  choice: بسبب اسمي
  rationale: تنقل διά مع النصب بوصفها سببية، وتُبقي «الاسم» بما يحمله من دلالة على شخص يسوع وهويته وسلطانه.
- source_word: ὅτι
  choice: لأنهم
  rationale: تُدخل العلة المفسرة للاضطهاد بوضوح في العربية المعاصرة.
- source_word: οὐκ οἴδασιν
  choice: لا يعرفون
  rationale: تحفظ بساطة العبارة وإمكان دلالتها اليوحناوية على المعرفة العلائقية، لا مجرد العلم بالمعلومات.
- source_word: τὸν πέμψαντά με
  choice: الذي أرسلني
  rationale: ينقل اسم الفاعل المعرَّف بعبارة موصولة طبيعية، من غير إضافة لقب «الآب» غير المذكور صراحة في اليونانية.
theological_decisions:
- issue: مرجع «الذي أرسلني»
  choice: الإبقاء على المرجع ضمنيًّا بعبارة «الذي أرسلني»
  alternative: «الآب الذي أرسلني»
  rationale: السياق اليوحناوي يدل على الآب، لكن النص اليوناني لا يذكر لقب «الآب» هنا؛ لذلك تُحفظ صياغة الأصل من غير إضافة تفسيرية.
- issue: دلالة «اسمي»
  choice: الإبقاء على «اسمي» حرفيًّا
  alternative: «بسببي» أو «بسبب انتمائكم إليّ»
  rationale: لفظ «الاسم» يحمل في السياق الكتابي دلالة تمثيلية ولا ينبغي اختزاله إلى السمعة أو استبداله بتفسير يحسم مدى معناه.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختير «سيفعلون بكم» لأنه طبيعي في العربية وينقل توجّه الأفعال نحو المخاطَبين في السياق العدائي، مع تجنب إضافة حاشية لا يحتاج إليها النص العربي ما دام هذا التركيب يحفظ سعة الدلالة.
