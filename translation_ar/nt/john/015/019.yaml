id: JHN.15.19
reference: John 15:19
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: εἰ ἐκ τοῦ κόσμου ἦτε, ὁ κόσμος ἂν τὸ ἴδιον ἐφίλει· ὅτι δὲ ἐκ τοῦ κόσμου οὐκ ἐστέ, ἀλλ’ ἐγὼ ἐξελεξάμην ὑμᾶς ἐκ τοῦ κόσμου, διὰ τοῦτο μισεῖ ὑμᾶς ὁ κόσμος.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/019.yaml
  text: If you were from the world[a], the world would love its own. But because you are not from the world, but I chose you out of the world, for this reason the world hates you.
translation:
  language: ar
  text: لو كنتم من العالم[a]، لأحبَّ العالمُ خاصته. ولكن لأنكم لستم من العالم، بل أنا اخترتكم من العالم، لذلك يبغضكم العالم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «لو كنتم تابعين للعالم». فحرف الجر اليوناني (ἐκ) قد يدل على المصدر أو الانتماء، وقد أبقى المتن عبارة «من العالم» المكررة في الآية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τοῦ κόσμου
  choice: من العالم
  rationale: تعكس «من» معنى المصدر أو الانتماء الذي تؤديه ἐκ، وتتيح إبقاء العبارة اليونانية المكررة ظاهرة بالعربية من غير تضييق دلالتها.
- source_word: κόσμος
  choice: العالم
  rationale: هو المقابل العربي المألوف ويحفظ اتساع المصطلح اليوحناوي، من غير تفسيره داخل النص بأنه نظام بشري معادٍ لله.
- source_word: ἂν ... ἐφίλει
  choice: لأحبَّ
  rationale: تركيب «لو... لَـ» ينقل بصورة طبيعية الشرط المخالف للواقع ونتيجته.
- source_word: τὸ ἴδιον
  choice: خاصته
  rationale: تؤدي التعبير الاصطلاحي الدال على ما يخص العالم أو المنتمين إليه، مع إبقاء عدم التحديد الموجود في اليونانية وعدم إضافة «أهله» أو «ناسه» صراحة.
- source_word: φιλέω
  choice: أحبَّ
  rationale: يحفظ التقابل المباشر والحاد مع μισέω، وهو أوضح تعبير عربي في هذا السياق.
- source_word: ὅτι δὲ
  choice: ولكن لأن
  rationale: تحفظ «لكن» قوة المقابلة في δέ، وتنقل «لأن» العلاقة السببية في ὅτι.
- source_word: ἐξελεξάμην
  choice: اخترتكم
  rationale: ترجمة مباشرة للفعل من غير تحميل صيغة الوسط معنى «لنفسي» الذي قد يبالغ في التصريح بما يتركه اليوناني ضمنيًا.
- source_word: ἐκ τοῦ κόσμου
  choice: من العالم
  rationale: يحافظ تكرار الصياغة نفسها على التوازي اللفظي في الأصل؛ وسياق الاختيار يفيد الإخراج أو الفصل من غير الحاجة إلى إضافة تفسير.
- source_word: διὰ τοῦτο
  choice: لذلك
  rationale: أداة سببية عربية واضحة وطبيعية تربط بغض العالم بسبب عدم انتماء التلاميذ إليه واختيار يسوع لهم منه.
- source_word: μισεῖ
  choice: يبغضكم
  rationale: ينقل المضارع المستمر في السياق ويحفظ شدة التقابل مع المحبة؛ و«يبغض» فصيحة واضحة في العربية المعاصرة.
theological_decisions:
- issue: دلالة «العالم» في السياق اليوحناوي
  choice: إبقاء «العالم» في المتن بلا توسع تفسيري.
  alternative: «نظام العالم» أو «المجتمع البشري المعادي لله».
  rationale: يمثل العالم هنا مجالًا أخلاقيًا وروحيًا معارضًا ليسوع، لكن اللفظ نفسه أوسع من أي شرح واحد؛ لذا يحفظ النص التوتر الدلالي ولا يضيقه.
- issue: المغزى اللاهوتي لاختيار يسوع في ἐξελεξάμην
  choice: «أنا اخترتكم من العالم» بصياغة مباشرة.
  alternative: صياغة تحمل العبارة مسبقًا على مذهب محدد في الاختيار أو التعيين السابق.
  rationale: تثبت الآية اختيار يسوع للتلاميذ، لكنها لا تحسم بمفردها المناقشات المذهبية اللاحقة، ولذلك لا تُضاف إليها حمولة عقائدية غير مصرّح بها.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة. استُخدم تركيب الشرط «لو... لأحبَّ» لنقل خلاف الواقع، وحُفظ تكرار «من العالم» و«العالم» لإبراز البناء البلاغي في الأصل. «خاصته» موجزة وتحفظ قدرًا من عدم التحديد في τὸ ἴδιον.
