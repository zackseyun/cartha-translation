  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καθὼς ἠγάπησέν με ὁ πατήρ, κἀγὼ ⸂ὑμᾶς ἠγάπησα⸃, μείνατε ἐν τῇ ἀγάπῃ τῇ ἐμῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/009.yaml
  text: Just as the Father has loved me[a], I also have loved you; remain in my love.
translation:
  language: ar
  text: كما أحبّني الآب، أحببتكم أنا أيضًا؛ اثبتوا في محبّتي.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς
  choice: كما
  rationale: تؤدي معنى المقارنة بين محبة الآب ليسوع ومحبة يسوع لتلاميذه بعبارة عربية طبيعية موجزة.
- source_word: ἠγάπησέν
  choice: أحبّني
  rationale: صيغ الماضي العربية تقابل الفعل اليوناني في الماضي وتحافظ على بساطة التعبير، من غير أن تنفي استمرار أثر المحبة في السياق.
- source_word: ὁ πατήρ
  choice: الآب
  rationale: اللفظ العربي المألوف في هذا السياق اليوحناوي للإشارة إلى الله بوصفه أبا يسوع.
- source_word: κἀγὼ
  choice: أنا أيضًا
  rationale: ينقل أداة الربط ومعنى المقابلة، ويُظهر توكيد الضمير الموجود في اليونانية.
- source_word: ὑμᾶς
  choice: كم
  rationale: ضمير مفعول به لجمع المخاطبين، وهو واضح صرفيًا في العربية.
- source_word: ἠγάπησα
  choice: أحببتكم
  rationale: يحافظ على التوازي الزمني واللفظي مع «أحبّني» وعلى دلالة الماضي في الأصل.
- source_word: μείνατε
  choice: اثبتوا
  rationale: ينقل أمر μένω في الاستعمال اليوحناوي بمعنى الاستمرار وعدم مفارقة الحالة أو العلاقة، وهو طبيعي ورصين في العربية.
- source_word: ἐν τῇ ἀγάπῃ τῇ ἐμῇ
  choice: في محبّتي
  rationale: ترجمة مباشرة وطبيعية تحافظ على حرف الجر وضمير الملكية من دون توسيع تفسيري.
theological_decisions:
- issue: دلالة ἀγάπη
  choice: محبّة
  alternative: حبّ
  rationale: «محبّة» لفظ عربي واضح ورصين وملائم للسياق العلاقي، من غير استيراد معنى مذهبي خاص.
- issue: القوة الزمنية للفعلين الماضيين ἠγάπησέν وἠγάπησα
  choice: 'الماضي العربي: «أحبّني / أحببتكم»'
  alternative: 'صياغة تُبرز الاستمرار، مثل: «قد أحبّني / قد أحببتكم»'
  rationale: الماضي هو المقابل المباشر لصيغة الماضي اليونانية، بينما يدل السياق والأمر اللاحق على بقاء أثر المحبة؛ فلا حاجة إلى حسم دلالة زمنية إضافية ليست مصرّحًا بها.
- issue: معنى الثبات في «محبّتي»
  choice: الإبقاء على العبارة من دون تحديد هل المقصود محبة المسيح لهم أم محبتهم له ضمن نطاق محبته
  alternative: تفسيرها صراحةً بأنها الاستمرار في تلقي محبته أو في محبتهم له
  rationale: تركيب «في محبتي» يحتمل ظلالًا علائقية مترابطة، والترجمة لا ينبغي أن تحسم ما تركه النص موجزًا.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة، مع الحفاظ على التوازي بين شطري المقارنة وعلى صيغة الجمع في خطاب التلاميذ. لا توجد حاشية لأن الماضي العربي ينقل الصيغة اليونانية طبيعيًا، ولا تستلزم الآية بيان بديل ضروريًا.
