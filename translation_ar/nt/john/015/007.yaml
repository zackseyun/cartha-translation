  to: إن بقيتم فيَّ وبقيت كلماتي فيكم[a]، فمهما شئتم فاطلبوه[b]، فيكون لكم.
  rationale: 'تستبدل المراجعة «ثبت» بـ«بقي» لتقريب الدلالة الأساسية لـμένω ولإبقاء التكرار في شطري الشرط. كما تعيد ترتيب جملة الطلب على نحو عربي طبيعي يظل وفيًا للتركيب: المطلوب غير المحدد هو نفسه ما «يكون لهم»، من دون تسمية فاعل إلهي أو تحويل الوعد إلى اصطلاح «الاستجابة».'
