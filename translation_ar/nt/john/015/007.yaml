  terminology: «فيَّ» و«كلماتي» و«اطلبوه» مناسبة ودقيقة. يُستحسن استعمال «بقيتم/بقيت» للمصطلح اليوحناوي μένω، مع إبقاء «ثبتُّم/ثبتت» بديلًا معجميًا في الحاشية.
