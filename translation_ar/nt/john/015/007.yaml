  verdict: revise
  source_fidelity: تُبقي المسودة بنية الشرط، ولغة «فيَّ»، وتكرار الفعل، وشمول «ما شئتم» بأمانة جيدة. لكن «ثبت» يضيّق دلالة μένω قليلًا نحو الرسوخ/الثبات، بينما المعنى المحوري في الموضعين هو البقاء أو الاستمرار. كذلك فإن «فسيكون لكم» مفهومة في السياق، لكنها تترك في العربية الحديثة مرجع النتيجة غير مصرح به على نحو أقل سلاسة من تركيب يربطها مباشرة بما طُلب.
