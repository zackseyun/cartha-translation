  text: ἐὰν μείνητε ἐν ἐμοὶ καὶ τὰ ῥήματά μου ἐν ὑμῖν μείνῃ, ὃ ἐὰν θέλητε ⸀αἰτήσασθε καὶ γενήσεται ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/john/015/007.yaml
  text: If you remain in me and my words remain in you[a], ask whatever you want[b], and it will be done for you.
translation:
  language: ar
  text: إن بقيتم فيَّ وبقيت كلماتي فيكم[a]، فمهما شئتم فاطلبوه[b]، فيكون لكم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إن ثبتُّم فيَّ وثبتت كلماتي فيكم».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «كل ما تريدونه».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μείνητε / μείνῃ (μένω)
  choice: ثبتم / ثبتت
  rationale: يحافظ «ثبت» على معنى الاستمرار والدوام في العلاقة، ويتيح تكرار الجذر نفسه في الموضعين كما في اليونانية. وجاء الفعل الثاني مؤنثًا مفردًا وفق المطابقة العربية مع جمع غير العاقل «كلماتي».
- source_word: ἐν ἐμοὶ
  choice: فيَّ
  rationale: تُحفظ دلالة حرف الجر المباشرة ولغة الاتحاد والعلاقة، من غير إضعافها إلى «معي» أو شرحها بتفسير زائد.
- source_word: τὰ ῥήματά μου
  choice: كلماتي
  rationale: ترجمة مباشرة وطبيعية تشير إلى أقوال يسوع، من غير توسيعها إلى عبارة تفسيرية مثل «ما قلته لكم».
- source_word: ὃ ἐὰν θέλητε
  choice: ما شئتم
  rationale: تعبير عربي فصيح ومألوف ينقل شمول التركيب اليوناني وعدم تعيين المطلوب، من غير إضافة قيد غير مذكور في الآية.
- source_word: αἰτήσασθε
  choice: فاطلبوا
  rationale: ينقل صيغة الأمر ومعنى تقديم الطلب بوضوح، وتفيد الفاء ارتباط الطلب بالشرط السابق في العربية.
- source_word: γενήσεται ὑμῖν
  choice: فسيكون لكم
  rationale: يحافظ على المعنى الواسع للفعل γίνομαι، أي أن المطلوب سيصير واقعًا لهم، من غير إدخال فاعل ضمني أو تحويل العبارة صراحةً إلى «يُستجاب لكم».
theological_decisions:
- issue: بنية الشرط والوعد في القول عن الطلب
  choice: 'الإبقاء على الوعد داخل الشرط الصريح: الثبات في يسوع وثبات كلماته في التلاميذ'
  alternative: صياغة حرة تجعل وعد الطلب غير مشروط
  rationale: تفتتح الجملة اليونانية بأداة الشرط ἐὰν، ولذلك تُبقي الترجمة العلاقة النحوية واللاهوتية بين الثبات والطلب، ولا تعمم الوعد خارج الشرط المذكور.
- issue: الفاعل الضمني في تحقق المطلوب
  choice: «فسيكون لكم» من غير تسمية الفاعل
  alternative: «فيفعله الله لكم» أو «يُستجاب لكم»
  rationale: النص اليوناني لا يسمّي فاعلًا، وصيغة γίνομαι لا تصرّح بفعل الله أو بمصطلح الاستجابة؛ لذا تحفظ الصياغة قدر النص من الإضمار.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «ثبت» بدل اللفظ الأقدم «مكث» لإبراز الاستمرار العلائقي بعبارة مفهومة، مع تكرار الجذر في طرفي الشرط. وأُبقيت «فيَّ» حفاظًا على صورة النص، كما رُبطت جملتا الأمر والنتيجة بالفاء لتكون البنية العربية طبيعية وواضحة.
