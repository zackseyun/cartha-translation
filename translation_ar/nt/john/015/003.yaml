  text: Already you are clean because of the word that I have spoken to you[a].
translation:
  language: ar
  text: أنتم بالفعل أنقياء بسبب الكلام الذي كلمتكم به[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بواسطة الكلام الذي كلمتكم به».'
    reason: تحفظ الحاشية إمكان فهم διά مع النصب هنا على دلالة الوسيلة، إلى جانب الدلالة السببية المختارة في المتن.
lexical_decisions:
- source_word: ἤδη
  choice: الآن
  rationale: تفيد أن حالة النقاء قائمة بالفعل في الحاضر؛ و«الآن» عربية طبيعية موجزة تؤدي معنى ἤδη في هذا السياق.
- source_word: ὑμεῖς
  choice: أنتم
  rationale: إثبات الضمير المنفصل يحفظ توكيد الضمير الصريح في اليونانية.
- source_word: καθαροί
  choice: أنقياء
  rationale: تحفظ صورة التطهير والصلة اللفظية بالفعل καθαίρει في سياق الكرمة، من غير حصرها في اصطلاح عقائدي تقني.
- source_word: διὰ τὸν λόγον
  choice: بسبب الكلام
  rationale: διά مع النصب تفيد هنا، على الأرجح، السبب؛ ومع ذلك يمكن فهمها على معنى الوسيلة، ولذلك أُثبت البديل في الحاشية.
- source_word: λόγον
  choice: الكلام
  rationale: يناسب هنا كلام يسوع الذي خاطب به التلاميذ، ويحافظ على الدلالة المباشرة من غير توسيعها تفسيريا إلى «التعليم» أو «الرسالة».
- source_word: ὃν λελάληκα
  choice: الذي كلمتكم به
  rationale: صياغة عربية طبيعية تنقل فعل الكلام مع أثره القائم، وتربط الاسم بالفعل كما في الأصل.
- source_word: ὑμῖν
  choice: كم
  rationale: ضمير المخاطبين الجمع في «كلمتكم» ينقل المفعول غير المباشر بوضوح واقتصاد.
theological_decisions:
- issue: طبيعة نقاء التلاميذ
  choice: إبقاء العبارة وصفا لحالة نقاء حاضرة مرتبطة بكلام يسوع، من غير إدخال تصنيف عقائدي تقني.
  alternative: تفسيرها حصرا على أنها تطهير أسراري أو إعلان قضائي بالتبرير.
  rationale: سياق الكرمة يستعمل صورة التنقية، والنص نفسه يعزو نقاء التلاميذ إلى كلام يسوع؛ لذا ينبغي حفظ سعة الصورة وتوترها اللاهوتي.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعملت «أنقياء» للمحافظة على صورة التنقية في السياق، و«الكلام» لصياغة طبيعية مفهومة. أُثبتت علامة الحاشية [a] في المتن.
