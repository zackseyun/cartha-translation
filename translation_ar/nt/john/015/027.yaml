  source_fidelity: 'النص العربي يترجم عناصر اليونانية بأمانة: «وأنتم أيضًا» تؤدي καὶ ὑμεῖς δέ مع إبراز المخاطَبين، و«تشهدون» تؤدي μαρτυρεῖτε، و«لأنكم» تعكس الاستعمال التعليلي المرجح لـὅτι، و«معي منذ البداية» تنقل μετ’ ἐμοῦ ἐστε ἀπ’ ἀρχῆς. الصياغة الاسمية العربية تعبّر بصورة سليمة عن الحالة المستمرة من البداية إلى زمن الخطاب دون زيادة تفسيرية.'
  naturalness: العبارة فصيحة واضحة وطبيعية في العربية المعيارية الحديثة. ترتيبها وعلامة الوقف مناسبان، و«منذ البداية» مألوفة وتحافظ على عمومية العبارة الأصلية.
  terminology: «تشهدون» اختيار راسخ وطبيعي لمجال μαρτυρέω، ويحفظ معنى الشهادة دون تقييده بمصطلح قضائي تقني. ولا توجد مصطلحات لاهوتية أو أسماء تحتاج إلى توحيد خاص في هذه الآية.
