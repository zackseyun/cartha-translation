  text: καὶ ὑμεῖς δὲ μαρτυρεῖτε, ὅτι ἀπ’ ἀρχῆς μετ’ ἐμοῦ ἐστε.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/027.yaml
  text: And you also testify[b][a], because you have been with me from the beginning.
translation:
  language: ar
  text: وَأَنْتُمْ أَيْضًا تَشْهَدُونَ، لِأَنَّكُمْ مَعِي مُنْذُ الْبِدَايَةِ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ὑμεῖς δὲ
  choice: وَأَنْتُمْ أَيْضًا
  rationale: يحفظ عطف الكلام على الآية السابقة، مع إبراز ضمير المخاطبين ودورهم في الشهادة إلى جانب الروح المذكور هناك.
- source_word: μαρτυρεῖτε
  choice: تَشْهَدُونَ
  rationale: مضارع خبري يدل على قيام التلاميذ بالشهادة، ويحفظ الدلالة القضائية والتاريخية للفعل اليوناني بصياغة عربية طبيعية.
- source_word: ὅτι
  choice: لِأَنَّكُمْ
  rationale: 'تُفهم الأداة هنا على الأرجح تعليلية: سبب شهادتهم هو صحبتهم ليسوع منذ البداية.'
- source_word: ἀπ’ ἀρχῆς
  choice: مُنْذُ الْبِدَايَةِ
  rationale: مقابل عربي مباشر وطبيعي يبقي المقصود بالبداية مفتوحًا للسياق ولا يضيف إليه تحديدًا تفسيريًا.
- source_word: μετ’ ἐμοῦ ἐστε
  choice: مَعِي
  rationale: الجملة الاسمية العربية بعد «منذ البداية» تعبّر طبيعيًا عن حالة بدأت في الماضي واستمرت إلى زمن الكلام، من غير حاجة إلى إدخال فعل زائد.
theological_decisions:
- issue: نطاق عبارة «منذ البداية»
  choice: إبقاء العبارة عامة كما في الأصل، مع كون السياق يشير إلى صحبة التلاميذ ليسوع منذ بداية خدمته أو تلمذتهم له.
  alternative: فهم «البداية» بمعنى مطلق أو ميتافيزيقي أوسع.
  rationale: أهلية التلاميذ للشهادة في السياق قائمة على صحبتهم التاريخية ليسوع؛ لكن النص العربي لا يصرّح بتحديد غير مصرّح به في اليونانية.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدمت «تشهدون» لأنها مألوفة وتحفظ معنى الإدلاء بالشهادة. ولا تلزم حاشية صرفية لـ ἐστε، لأن «أنكم معي منذ البداية» تؤدي في العربية معنى الاستمرار من الماضي إلى الحاضر بصورة طبيعية.
