  yaml_path: translation/nt/john/015/022.yaml
  text: If I had not come and spoken to them[a], they would not have sin[c][b]; but now they have no excuse for their sin.
translation:
  language: ar
  text: «لو لم آتِ وأكلّمهم، لما كانت لهم خطيئة[a]؛ أمّا الآن، فلا عذر[b] لهم في خطيئتهم[c].»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لما كانوا مذنبين بخطيئة»، أو: «لما كان عليهم ذنب». واليونانية تقول بحرفية أكبر: «لما كانت لهم خطيئة».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «ذريعة».'
    reason: lexical_alternative
  - marker: c
    text: 'وبحرفية أكبر: «بشأن خطيئتهم».'
    reason: source_form
lexical_decisions:
- source_word: εἰ μὴ ἦλθον καὶ ἐλάλησα αὐτοῖς
  choice: لو لم آتِ وأكلّمهم
  rationale: ينقل تركيب الشرط الممتنع في الماضي بصورة عربية طبيعية، مع إبقاء الفعلين المتعاطفين وإظهار أن الكلام موجَّه إليهم.
- source_word: ἁμαρτίαν οὐκ εἴχοσαν
  choice: لما كانت لهم خطيئة
  rationale: يحافظ على التعبير اليوناني «تكون لهم خطيئة» بدل تفسيره صراحةً بمعنى الذنب أو المسؤولية، ويصوغ جواب الشرط على نحو عربي سليم.
- source_word: νῦν δὲ
  choice: أمّا الآن
  rationale: يبرز المقابلة الحادة بين الحالة المفترضة والواقع الحاضر.
- source_word: πρόφασιν οὐκ ἔχουσιν
  choice: فلا عذر لهم
  rationale: «عذر» هو المقابل العربي الواضح والطبيعي في السياق، مع بقاء معنى «الذريعة» احتمالًا معجميًا.
- source_word: περὶ τῆς ἁμαρτίας αὐτῶν
  choice: في خطيئتهم
  rationale: صياغة عربية طبيعية مع «عذر»، تؤدي علاقة περί بموضوع العذر من غير إطالة؛ وتُذكر الصياغة الأقرب حرفيًا في الحاشية.
theological_decisions:
- issue: هل تعني عبارة ἁμαρτίαν οὐκ εἴχοσαν انعدام الخطيئة مطلقًا أم انعدام المسؤولية عن رفض إعلان يسوع؟
  choice: لما كانت لهم خطيئة
  alternative: لما كانوا مذنبين بخطيئة / لما كانت عليهم مسؤولية هذه الخطيئة
  rationale: السياق يتناول مسؤولية من سمعوا يسوع ورفضوه، لكن النص يقول حرفيًا إن الخطيئة لم تكن لتكون لهم. لذلك تُحفظ صياغة يوحنا وتوترها الدلالي دون حسمها بتفسير عقائدي داخل المتن.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «لو... لما» لإظهار الشرط الممتنع، وحُفظ التعبير اللاهوتي «كانت لهم خطيئة» بدل شرحه داخل المتن.
