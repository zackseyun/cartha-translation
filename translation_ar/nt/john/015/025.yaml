id: JHN.15.25
reference: John 15:25
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἀλλ’ ἵνα πληρωθῇ ὁ λόγος ὁ ⸂ἐν τῷ νόμῳ αὐτῶν γεγραμμένος⸃ ὅτι Ἐμίσησάν με δωρεάν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/025.yaml
  text: 'But this happened so that the word written in their Law might be fulfilled: ‘They hated me without cause.’[a][b][c]'
translation:
  language: ar
  text: 'بَلْ حَدَثَ هٰذَا لِكَيْ تَتِمَّ الْكَلِمَةُ الْمَكْتُوبَةُ فِي شَرِيعَتِهِمْ: «أَبْغَضُونِي بِلَا سَبَبٍ».[a][b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو بصياغة أكثر حرفية: «بل لكي تتم الكلمة المكتوبة في شريعتهم». فالجملة اليونانية موجزة، وقد أُضيفت عبارة «حدث هذا» اعتمادًا على السياق.'
    reason: lexical_alternative
  - marker: b
    text: تأتي «الشريعة» هنا بالمعنى اليهودي الأوسع للكتب المقدسة، لأن الاقتباس من المزامير (قارن مزمور 35:19؛ 69:4).
    reason: cross_reference
  - marker: c
    text: 'أو: «مِنْ غَيْرِ سَبَبٍ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: بَلْ
  rationale: أداة استدراك تربط الكلام بما قبله وتحافظ على قوة المقابلة في السياق.
- source_word: ἵνα πληρωθῇ
  choice: لِكَيْ تَتِمَّ
  rationale: تنقل معنى الغاية أو النتيجة في ἵνα مع صيغة المبني للمجهول، وتحافظ على صيغة إتمام المكتوب الشائعة في يوحنا.
- source_word: ὁ λόγος
  choice: الْكَلِمَةُ
  rationale: تشير هنا إلى قول كتابي محدد، لا إلى لقب «الكلمة» الوارد في مطلع الإنجيل.
- source_word: ἐν τῷ νόμῳ αὐτῶν γεγραμμένος
  choice: الْمَكْتُوبَةُ فِي شَرِيعَتِهِمْ
  rationale: تعكس اسم المفعول التام بمعنى ما هو ثابت في الكتابة، وتُبقي ضمير «هم» كما في اليونانية.
- source_word: νόμῳ
  choice: شَرِيعَتِهِمْ
  rationale: تحافظ «الشريعة» على اللفظ اليوناني νόμος، مع بيان في الحاشية أنه يُستعمل هنا بالمعنى الواسع للكتب المقدسة اليهودية.
- source_word: ὅτι
  choice: ':'
  rationale: تؤدي النقطتان وظيفة إدخال مضمون القول الكتابي في العربية بسلاسة.
- source_word: Ἐμίσησάν με
  choice: أَبْغَضُونِي
  rationale: تنقل الفعل الماضي المباشر في الاقتباس بصياغة عربية موجزة وطبيعية.
- source_word: δωρεάν
  choice: بِلَا سَبَبٍ
  rationale: تنقل معنى البغض الذي لا علة له ولا مسوغ، بلغة عربية واضحة ومعاصرة.
theological_decisions:
- issue: معنى «شريعتهم» مع أن الاقتباس من المزامير
  choice: الإبقاء على «شريعتهم» في المتن، وفهم «الشريعة» هنا بمعناها اليهودي الواسع الذي يشمل الكتب المقدسة.
  alternative: استبدالها بـ«كتبهم المقدسة» لبيان المقصود صراحة.
  rationale: النص اليوناني يستعمل νόμος صراحة، لذلك يحافظ المتن على صورته، بينما تمنع الحاشية قصر المعنى على أسفار موسى وحدها.
- issue: الجملة المحذوف ركنها الرئيس بعد ἀλλ’
  choice: إضافة «حدث هذا» لتستقيم العبارة في العربية المعاصرة.
  alternative: 'صياغة حرفية: «بل لكي تتم الكلمة...» من غير إكمال الجملة.'
  rationale: اليونانية موجزة وتعتمد على السياق السابق؛ والإضافة موضوعة في حاشية بوصفها إكمالًا سياقيًا لا تقريرًا لسبب لاهوتي يتجاوز النص.
- issue: دلالة ἵνα على الغاية أو النتيجة
  choice: «لكي تتم» مع إبقاء العلاقة مفتوحة ضمن ما تسمح به الصيغة اليونانية.
  alternative: «فتمت بذلك» بما يرجح النتيجة، أو «بغرض أن تتم» بما يشدد الغاية.
  rationale: الصياغة المختارة تحفظ توتر الغاية والنتيجة ولا تفرض قراءة حتمية أكثر مما يقتضيه التركيب.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعملت «شريعتهم» للمحافظة على νόμος، و«بلا سبب» للوضوح المعاصر. أُكملت الجملة بعبارة «حدث هذا» مع توثيق الإضافة في الحاشية.
