base_translation:
  language: en
  yaml_path: translation/nt/john/015/024.yaml
  text: If I had not done among them the works that no one else did[a], they would not have sin[b]; but now they have both seen and hated both me and my Father.
translation:
  language: ar
  text: 'لو لم أعمل بينهم الأعمال التي لم يعملها أحدٌ غيري، لما كانت لهم خطيئة[a]. أمّا الآن فقد رأوا وأبغضوا كِلينا: أنا وأبي.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي يمكن أن تُفهم: «لما كانوا مذنبين بخطيئة». واليونانية تقول حرفيًا: «لما كانت لهم خطيئة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἔργα
  choice: الأعمال
  rationale: تحافظ «الأعمال» على الاستعمال اليوحنّاوي الذي يشير إلى أفعال يسوع الدالّة على هويته ورسالته، من غير حصرها في المعجزات وحدها.
- source_word: ἐποίησα ἐν αὐτοῖς
  choice: أعمل بينهم
  rationale: تفيد ἐν αὐτοῖς هنا وقوع أعمال يسوع في وسطهم وأمامهم، ولذلك فـ«بينهم» أوضح من الترجمة الحرفية «فيهم».
- source_word: ἃ οὐδεὶς ἄλλος ἐποίησεν
  choice: التي لم يعملها أحدٌ غيري
  rationale: تنقل العبارة تفرّد أعمال يسوع. و«غيري» تعبّر طبيعيًا في العربية عن المقارنة الضمنية بيسوع في οὐδεὶς ἄλλος، من غير إضافة معنى جديد.
- source_word: ἁμαρτίαν οὐκ εἴχοσαν
  choice: لما كانت لهم خطيئة
  rationale: تحافظ الصياغة على التعبير اليوحنّاوي الحرفي نسبيًا «لهم خطيئة»، بدل تضييق معناه إلى صيغة تفسيرية مثل «لما كانوا مذنبين».
- source_word: νῦν δὲ
  choice: أمّا الآن
  rationale: تبيّن المقابلة بين الفرض المخالف للواقع والحال القائمة بأسلوب عربي واضح.
- source_word: καὶ ἑωράκασιν καὶ μεμισήκασιν
  choice: فقد رأوا وأبغضوا
  rationale: تنقل الفعلان التامّان بوصفهما حدثين وقعا وما زال أثرهما قائمًا، وتؤدي «قد» هذه الدلالة بصورة طبيعية في العربية.
- source_word: καὶ ἐμὲ καὶ τὸν πατέρα μου
  choice: 'كِلينا: أنا وأبي'
  rationale: تحافظ على التأكيد بأن الرؤية والبغض موجهان إلى يسوع وإلى أبيه معًا، مع تجنّب تركيب عربي متكلّف.
theological_decisions:
- issue: معنى «لما كانت لهم خطيئة» وصلته بالمسؤولية عن الخطية
  choice: الإبقاء على التعبير «لهم خطيئة»
  alternative: لما كانوا مذنبين بخطيئة
  rationale: السياق يدل على مسؤولية أشد بعد مشاهدة أعمال يسوع الفريدة، لكن الأصل يقول حرفيًا إنهم لم يكونوا «يملكون خطية». والإبقاء على هذا التعبير يصون التوتر اللاهوتي ولا يحصره في تفسير قانوني واحد.
- issue: علاقة بغض يسوع ببغض الآب
  choice: 'رأوا وأبغضوا كِلينا: أنا وأبي'
  alternative: رأوني وأبغضوني أنا وأبي
  rationale: تُظهر الصياغة أن كلا الفعلين يتناول يسوع والآب معًا، كما تفيد تراكيب καί المتكررة، من غير شرح عقائدي زائد.
translation_notes:
  register: 'صياغة عربية فصحى معاصرة، واضحة ومهيبة. حوفظ على تكرار «الأعمال/يعملها» لقربه من الأصل وعلى التعبير اليوحنّاوي «لهم خطيئة»، مع استخدام «كِلينا: أنا وأبي» لإبراز اقتران المفعولين بصورة طبيعية.'
