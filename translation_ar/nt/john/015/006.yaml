  text: ἐὰν μή τις ⸀μένῃ ἐν ἐμοί, ἐβλήθη ἔξω ὡς τὸ κλῆμα καὶ ἐξηράνθη, καὶ συνάγουσιν αὐτὰ καὶ εἰς τὸ πῦρ βάλλουσιν καὶ καίεται.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/006.yaml
  text: If anyone does not remain in me[a], he is thrown out like the branch and dries up; and they gather them and throw them into the fire[b], and they are burned.
translation:
  language: ar
  text: إن لم يثبت أحد فيَّ[a]، يُطرَح خارجًا كالغصن فييبس؛ ويجمعونها ويطرحونها في النار[b] فتحترق.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «لا يبقى فيَّ». يدل الفعل اليوناني على البقاء والاستمرار، و«يثبت» تعبير تقليدي ملائم لهذا المصطلح المحوري في إنجيل يوحنا.'
    reason: lexical_alternative
  - marker: b
    text: تحذّر الصورة من الطرح والاحتراق، لكن الآية نفسها لا تحدد هل تصف فقدان تلمذة حقيقية أم انكشاف ارتباط ظاهري.
    reason: alternative_reading
lexical_decisions:
- source_word: μένῃ
  choice: يثبت
  rationale: ينقل الاستمرار والثبات العلاقي المقصود بالفعل المحوري μένω في يوحنا، وهو تعبير عربي طبيعي ومألوف في سياق الكرمة والأغصان.
- source_word: ἐν ἐμοί
  choice: فيَّ
  rationale: يحافظ على حرف الجر وصيغته العلاقية واللاهوتية من غير تحويله إلى «معي» أو تفسيره بعبارة أوسع.
- source_word: ἐβλήθη ἔξω
  choice: يُطرَح خارجًا
  rationale: يحفظ المبني للمجهول والصورة الحسية، ويُصاغ بالمضارع العربي بما يلائم الشرط العام، مع أن اليونانية تستعمل الماضي البسيط تصويرًا للنتيجة.
- source_word: ὡς τὸ κλῆμα
  choice: كالغصن
  rationale: κλῆμα هو غصن الكرمة في السياق، و«الغصن» يحافظ على الصورة المفردة المتصلة بالمثل السابق.
- source_word: ἐξηράνθη
  choice: فييبس
  rationale: يعبر مباشرة عن صيرورة الغصن يابسًا، ويحافظ على تتابع النتيجة في الصورة.
- source_word: συνάγουσιν
  choice: يجمعونها
  rationale: يحافظ على صيغة الغائب الجمع ذات الفاعل غير المعيّن في اليونانية، من غير تحديد هوية الجامعين.
- source_word: αὐτὰ
  choice: ها
  rationale: ضمير جمع غير العاقل في اليونانية يعود إلى أمثال هذه الأغصان؛ وفي العربية الفصحى يعود جمع غير العاقل بضمير المؤنث المفرد، ولذلك جاءت «يجمعونها».
- source_word: εἰς τὸ πῦρ βάλλουσιν
  choice: يطرحونها في النار
  rationale: ترجمة مباشرة وطبيعية تحفظ فعل الطرح واتجاهه إلى النار.
- source_word: καίεται
  choice: فتحترق
  rationale: يحافظ على مفرد الفعل اليوناني، وهو مبني للمجهول صرفيًا ويمكن أن يؤدي معنى لازمًا؛ والفاعل المفهوم في العربية هو الأغصان بوصفها جمعًا لغير العاقل، فيعامل معاملة المؤنث المفرد.
- source_word: τις
  choice: أحد
  rationale: «إن كان أحد» صياغة عربية عامة وطبيعية تحفظ القوة الشرطية والنكرة المفردة.
theological_decisions:
- issue: هل يُصاغ التحذير بما يحسم الجدل حول الارتداد أو ثبات المؤمن أو التلمذة الظاهرية؟
  choice: إبقاء التحذير المجازي مباشرًا من غير توسع تفسيري
  alternative: تحديد الشخص صراحة بأنه مؤمن حقيقي فقد الخلاص، أو بأنه تابع اسمي لم يتحد بالمسيح قط
  rationale: النص يقدّم صورة الغصن والطرح والاحتراق، لكنه لا يحسم وحده الوضع العقائدي السابق للشخص؛ لذلك تحفظ الترجمة قوة التحذير والتوتر اللاهوتي من غير إدخال نتيجة مذهبية.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. اختير «يثبت فيَّ» للمحافظة على المصطلح اليوحناوي وصيغته العلاقية، واستُعملت أفعال حية مباشرة تحفظ تتابع الصورة. عومل جمع غير العاقل وفق النحو العربي في «يجمعونها... فتحترق»، من غير تغيير جمع المرجع الدلالي.
