reference: John 15:20
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: μνημονεύετε τοῦ λόγου οὗ ἐγὼ εἶπον ὑμῖν· Οὐκ ἔστιν δοῦλος μείζων τοῦ κυρίου αὐτοῦ· εἰ ἐμὲ ἐδίωξαν, καὶ ὑμᾶς διώξουσιν· εἰ τὸν λόγον μου ἐτήρησαν, καὶ τὸν ὑμέτερον τηρήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/020.yaml
  text: 'Remember the word that I said to you: ‘A servant is not greater than his master.’ If they persecuted me[a], they will also persecute you; if they kept my word[b], they will also keep yours.'
translation:
  language: ar
  text: 'تذكَّروا القول الذي قلته لكم: «ليس عبد[a] أعظم من سيّده». إن كانوا قد اضطهدوني، فسيضطهدونكم أنتم أيضًا؛ وإن كانوا قد حفظوا كلامي[b]، فسيحفظون كلامكم أيضًا.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «خادم». يمكن أن تعني الكلمة اليونانية عبدًا أو خادمًا؛ وقد استُعمل «عبد» هنا لأن المقابلة مع «سيّده» تؤكد خضوعه وتدنّي منزلته عنه.
    reason: lexical_alternative
  - marker: b
    text: أو «أطاعوا كلامي». يمكن أن يشمل «حفظ الكلام» في إنجيل يوحنا قبول رسالة يسوع والعمل بها طاعةً لها.
    reason: lexical_alternative
lexical_decisions:
- source_word: μνημονεύετε
  choice: تذكَّروا
  rationale: فعل أمر مضارع يفيد إبقاء قول يسوع حاضرًا في الذاكرة، و«تذكَّروا» صياغة عربية واضحة تحفظ قوة الأمر.
- source_word: τοῦ λόγου οὗ ἐγὼ εἶπον ὑμῖν
  choice: القول الذي قلته لكم
  rationale: يشير λόγος هنا إلى قول محدد سبق أن قاله يسوع؛ و«القول» أفصح وأطبع في هذه الإحالة من الترجمة الحرفية «الكلمة».
- source_word: δοῦλος
  choice: عبد
  rationale: المقابلة المباشرة مع κύριος تبرز علاقة الخضوع وتفاوت المنزلة، ولذلك ينقل «عبد» قوة اللفظ اليوناني، مع ذكر «خادم» بديلًا في الحاشية.
- source_word: μείζων
  choice: أعظم
  rationale: يحفظ المقارنة العامة في المنزلة من غير حصرها في الأهمية أو السلطة وحدهما.
- source_word: κυρίου
  choice: سيّده
  rationale: السياق هو علاقة العبد بمن له السيادة عليه، لذا فـ«سيّد» أنسب من استعمال لقب ديني مثل «الرب».
- source_word: ἐδίωξαν / διώξουσιν
  choice: اضطهدوني / فسيضطهدونكم
  rationale: يدل διώκω في سياق عداوة العالم ليسوع وتلاميذه على الاضطهاد، لا مجرد الملاحقة المحايدة.
- source_word: ἐτήρησαν / τηρήσουσιν
  choice: حفظوا / فسيحفظون
  rationale: يحفظ «حفظ» اتساع τηρέω وإيقاع التوازي، ويمكن أن يشمل قبول الكلام والعمل به، من غير اختزاله في الطاعة وحدها.
- source_word: τὸν λόγον μου ... τὸν ὑμέτερον
  choice: كلامي ... كلامكم
  rationale: ينقل التوازي بين رسالة يسوع وكلام تلاميذه بصياغة عربية طبيعية، والاسم المحذوف في اليونانية بعد «الذي لكم» مستفاد من λόγον.
theological_decisions:
- issue: دلالة δοῦλος في مثل تفاوت المنزلة
  choice: عبد
  alternative: خادم
  rationale: تعتمد العبارة على عدم مساواة منزلة δοῦλος بمنزلة κύριος. «عبد» يحفظ حدة علاقة الخضوع، مع إبقاء «خادم» احتمالًا معجميًا في الحاشية.
- issue: دلالة κύριος في علاقته بـ δοῦλος
  choice: سيّد
  alternative: ربّ
  rationale: ليس اللفظ هنا لقبًا مسيانيًا مباشرًا، بل الطرف الأعلى في علاقة العبد بسيّده؛ لذلك تتجنب «سيّد» إدخال دلالة لاهوتية زائدة.
- issue: مدى دلالة τηρέω مع كلام يسوع والتلاميذ
  choice: حفظوا كلامي / فسيحفظون كلامكم
  alternative: أطاعوا كلامي / فسيطيعون كلامكم
  rationale: «حفظ» يبقي التوتر الدلالي بين قبول الرسالة والالتزام بها، بينما تحصر «أطاعوا» المعنى في الامتثال.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة وقورة. استُخدم «القول» في الإحالة إلى العبارة المحددة، و«الكلام» في التوازي بين رسالة يسوع ورسالة تلاميذه. وُضع كل رمز حاشية عند اللفظ الذي تشرحه الحاشية.
