  text: οὐκέτι ⸂λέγω ὑμᾶς⸃ δούλους, ὅτι ὁ δοῦλος οὐκ οἶδεν τί ποιεῖ αὐτοῦ ὁ κύριος· ὑμᾶς δὲ εἴρηκα φίλους, ὅτι πάντα ἃ ἤκουσα παρὰ τοῦ πατρός μου ἐγνώρισα ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/015.yaml
  text: I no longer call you servants[a], because the servant does not know what his master is doing. But I have called you friends[b], because I have made known to you everything that I heard from my Father.
translation:
  language: ar
  text: لم أعد أسمّيكم عبيدًا[a]، لأن العبد لا يعرف ما يفعله سيّده[b]. لكنني قد سمّيتكم أصدقاء، لأني أعلمتكم بكل ما سمعته من أبي.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أن تعني الكلمة اليونانية «عبيدًا» أو «خدمًا». وجاءت هنا «عبيدًا» لأن المقابلة مع الأصدقاء تبرز التبعية وتفاوت المكانة.
    reason: lexical_alternative
  - marker: b
    text: الكلمة اليونانية تعني «السيد» أو «الرب»؛ والمقصود هنا السيد في علاقة السيد بالعبد، لا لقبًا إلهيًا أو مسيانيًا.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκέτι
  choice: لا أعود
  rationale: 'تعبير عربي طبيعي يدل على انقطاع حال سابقة ويحفظ معنى النفي الزمني: «لم أعد» أو «لا أعود».'
- source_word: λέγω ὑμᾶς
  choice: أسمّيكم
  rationale: الفعل هنا يفيد التسمية أو إطلاق الصفة، لا مجرد القول؛ و«أسمّيكم» واضحة وطبيعية في العربية.
- source_word: δούλους / δοῦλος
  choice: عبيدًا / العبد
  rationale: يحفظ «عبد» تفاوت المكانة والتبعية اللذين تقوم عليهما المقابلة مع الأصدقاء، بخلاف «خادم» الذي قد يضعف هذه الدلالة.
- source_word: οἶδεν τί ποιεῖ
  choice: لا يعرف ما يفعله
  rationale: يحفظ معنى المعرفة وصيغة المضارع في العبارة اليونانية من غير تحويلها إلى معنى الفهم.
- source_word: αὐτοῦ ὁ κύριος
  choice: سيده
  rationale: «السيد» هو المقابل السياقي الأنسب في علاقة السيد بالعبد، من غير أن يوحي هنا بلقب إلهي أو مسياني.
- source_word: εἴρηκα
  choice: قد سمّيتكم
  rationale: «قد» مع الماضي تعبّر عن فعل تمّ وبقيت نتيجته قائمة، فتحفظ بقدر طبيعي قوة صيغة التمام اليونانية.
- source_word: φίλους
  choice: أصدقاء
  rationale: المعنى المباشر والسياقي، ويحفظ المقابلة بين العبودية والصداقة القائمة على إطلاعهم على ما سمعه يسوع.
- source_word: πάντα ἃ
  choice: بكل ما
  rationale: صياغة عربية جامعة وطبيعية للمركب اليوناني الذي يعني «كل ما» أو «جميع ما».
- source_word: ἤκουσα παρὰ τοῦ πατρός μου
  choice: سمعته من أبي
  rationale: يحفظ المعنى المباشر لفعل السماع، وتدل «من» بوضوح على المصدر.
- source_word: ἐγνώρισα ὑμῖν
  choice: عرّفتكم
  rationale: ينقل معنى الإطلاع وجعل الشيء معلومًا، وتكتمل دلالته عربيًا بالباء في «عرّفتكم بكل ما».
theological_decisions:
- issue: دلالة δοῦλος في المقابلة بين التبعية والصداقة
  choice: عبيدًا / العبد
  alternative: خدمًا / الخادم
  rationale: السياق يبرز تفاوت المكانة وغياب إطلاع العبد على مقاصد سيده؛ لذلك يحفظ «عبد» حدة المقابلة الاجتماعية، مع بيان البديل في الحاشية.
- issue: دلالة κύριος داخل مثال اجتماعي غير لقبي
  choice: سيده
  alternative: ربه
  rationale: المقصود صاحب السلطة على العبد في المثال، لا استعمال «الرب» بوصفه لقبًا إلهيًا أو مسيانيًا.
- issue: قوة صيغة التمام في εἴρηκα وصلتها بالحاضر
  choice: قد سمّيتكم
  alternative: سمّيتكم / أسمّيكم
  rationale: تحفظ الصياغة وقوع التسمية مع استمرار أثرها، من غير إثقال العبارة العربية أو حسم أكثر مما تسمح به الصيغة.
- issue: شمول إعلان ما سمعه الابن من الآب
  choice: بكل ما سمعته من أبي
  alternative: بكل ما تلقيته من أبي
  rationale: أُبقي فعل «سمع» كما في الأصل بدل توسيعه إلى «تلقّى»، مع الحفاظ على الشمول الذي تدل عليه πάντα ἃ.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. استُعمل «أسمّيكم» لتجنب احتمال فهم «أدعوكم» بمعنى أوجّه إليكم دعوة، واستُعمل «قد سمّيتكم» لإبراز النتيجة القائمة لصيغة التمام. وُضعت علامتا الحاشيتين مباشرة بعد اللفظين اللذين تشرحانهما.
