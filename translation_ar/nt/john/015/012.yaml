  yaml_path: translation/nt/john/015/012.yaml
  text: 'This is my command: that you love one another just as I have loved you[a].'
translation:
  language: ar
  text: 'هذه هي وصيتي: أن تحبوا بعضكم بعضًا كما أحببتكم.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «هذه هي وصيتي: أن تحبوا بعضكم بعضًا مثلما أحببتكم».'
    reason: بديل أسلوبي لترجمة καθὼς مع الحفاظ على المقارنة نفسها.
lexical_decisions:
- source_word: Αὕτη ἐστὶν ἡ ἐντολὴ ἡ ἐμὴ
  choice: هذه هي وصيتي
  rationale: صياغة عربية طبيعية تحفظ الإشارة والتعريف والتوكيد على أن الوصية صادرة عن يسوع؛ و«وصية» مناسبة لسياق خطابه من غير إيحاء بأنها مجرد نصيحة.
- source_word: ἵνα
  choice: أن
  rationale: تُدخل هنا مضمون الوصية، و«أن» هي الأداة العربية الطبيعية لذلك.
- source_word: ἀγαπᾶτε
  choice: تحبوا
  rationale: تحفظ المعنى المباشر للفعل ἀγαπάω، وصيغة المضارع بعد «أن» تلائم مضمون الأمر المستمر من غير تحميل الجانب الفعلي أكثر مما يحتمل.
- source_word: ἀλλήλους
  choice: بعضكم بعضًا
  rationale: المقابل العربي المعياري للضمير التبادلي، ويبين أن المحبة متبادلة داخل جماعة المخاطَبين.
- source_word: καθὼς
  choice: كما
  rationale: تحفظ علاقة المقارنة التي تجعل محبة يسوع نموذجًا لمحبتهم بعضهم لبعض.
- source_word: ἠγάπησα ὑμᾶς
  choice: أحببتكم
  rationale: ينقل الفعل اليوناني الماضي نقلًا مباشرًا وموجزًا، مع بقاء أثر محبة يسوع السابقة حاضرًا في السياق.
theological_decisions:
- issue: دلالة محبة التلاميذ بعضهم لبعض
  choice: أن تحبوا بعضكم بعضًا
  alternative: أن يواصل بعضكم محبة بعض
  rationale: يحفظ النص الأمر بالمحبة من غير إدخال تفسير زائد لصيغة المضارع، مع بقاء معنى الاستمرار مفهومًا من طبيعة الوصية والسياق.
- issue: قوة المقارنة في καθὼς
  choice: كما أحببتكم
  alternative: مثلما أحببتكم
  rationale: تحفظ «كما» كون محبة يسوع معيارًا ونموذجًا، من غير حسم ما إذا كانت المقارنة تتعلق بالكيفية أو المقدار على نحو حصري.
- issue: ترجمة ἐντολή
  choice: وصية
  alternative: أمر
  rationale: «وصية» مألوفة وطبيعية في هذا السياق الكتابي وتحفظ السلطة الإلزامية، بينما «أمر» بديل معجمي صحيح لكنه أشد جفافًا في العربية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة، بصياغة موجزة تلائم خطاب يسوع. وُضعت علامة الحاشية [a] في المتن كما هو مطلوب.
