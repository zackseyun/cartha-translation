base_translation:
  language: en
  yaml_path: translation/nt/john/015/011.yaml
  text: I have spoken these things to you so that my joy may be in you[b][a], and your joy may be made full.
translation:
  language: ar
  text: قلت لكم هذه الأمور لكي يكون فرحي فيكم[b]، ويكتمل فرحكم[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ويمتلئ فرحكم».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «يكون فرحي بينكم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: بهذه الأمور
  rationale: يحافظ الجمع الصريح على تعدد ما أشار إليه يسوع في كلامه السابق، مع صياغة عربية طبيعية.
- source_word: λελάληκα
  choice: كلمتكم
  rationale: ينقل فعل الكلام بصيغة عربية موجزة وطبيعية؛ ويفهم من السياق أن هذا الكلام قد قيل وما زال مقصوده قائمًا.
- source_word: ὑμῖν
  choice: ـكم
  rationale: ضمير جمع المخاطبين مدمج في الفعل «كلمتكم»، وهو المقابل العربي الطبيعي للداتيف اليوناني.
- source_word: ἵνα
  choice: لكي
  rationale: يبين الغاية المقصودة من كلام يسوع، ويمكن أن يتضمن كذلك النتيجة المنشودة.
- source_word: ἡ χαρὰ ἡ ἐμὴ
  choice: فرحي
  rationale: يحافظ على الإضافة البسيطة في اليونانية من غير تفسيرها بأنها الفرح الذي يمنحه يسوع أو الفرح المتعلق به.
- source_word: ἐν ὑμῖν
  choice: فيكم
  rationale: يحفظ المعنى المكاني أو الباطني الأقرب للفظ، مع إثبات احتمال «بينكم» في الحاشية لأن ἐν يحتمله.
- source_word: ᾖ
  choice: يكون
  rationale: مضارع منصوب بعد أداة الغاية، وينقل صيغة الاحتمال المقصود أو الغاية دون زيادة تفسيرية.
- source_word: καὶ
  choice: و
  rationale: يربط غايتي الكلام ربطًا بسيطًا كما في الأصل.
- source_word: ἡ χαρὰ ὑμῶν
  choice: فرحكم
  rationale: صياغة عربية مباشرة تحفظ المقابلة بين «فرحي» و«فرحكم».
- source_word: πληρωθῇ
  choice: يكتمل
  rationale: تعبير عربي طبيعي عن بلوغ الفرح تمامه؛ ويحفظ معنى الكمال، بينما تذكر الحاشية صورة الامتلاء الكامنة في الفعل.
theological_decisions:
- issue: طبيعة «فرحي» في السياق اليوحناوي
  choice: فرحي
  alternative: الفرح الذي أمنحكم إياه؛ الفرح بي
  rationale: النص اليوناني لا يحدد هل المقصود فرح يسوع نفسه الذي يشترك فيه تلاميذه أم الفرح الآتي من اتحادهم به؛ لذلك تُحفظ العبارة من غير توسيع تفسيري.
- issue: دلالة ἐν ὑμῖν
  choice: فيكم
  alternative: بينكم
  rationale: «فيكم» تحفظ احتمال الحضور الباطني، لكن حرف الجر اليوناني يحتمل أيضًا المعنى الجماعي «بينكم»، ولذلك لم يُلغ هذا الاحتمال بل أُثبت في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعمل «كلمتكم» بدل تركيب أثقل مثل «تكلمت إليكم»، وحُفظ جمع ταῦτα في «هذه الأمور». وُضعت علامتا الحاشيتين في المتن عند اللفظين المعنيين.
