id: JHN.15.16
reference: John 15:16
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: οὐχ ὑμεῖς με ἐξελέξασθε, ἀλλ’ ἐγὼ ἐξελεξάμην ὑμᾶς, καὶ ἔθηκα ὑμᾶς ἵνα ὑμεῖς ὑπάγητε καὶ καρπὸν φέρητε καὶ ὁ καρπὸς ὑμῶν μένῃ, ἵνα ὅ τι ἂν αἰτήσητε τὸν πατέρα ἐν τῷ ὀνόματί μου δῷ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/016.yaml
  text: You did not choose me[a], but I chose you and appointed you so that you should go and bear fruit, and that your fruit should remain, so that whatever you ask the Father in my name[c][b], he may give you.
translation:
  language: ar
  text: لستم أنتم الذين اخترتموني، بل أنا اخترتكم وعيّنتكم لكي تذهبوا وتثمروا، ويبقى ثمركم[a]، ولكي يعطيكم الآب[b] كلَّ ما تطلبونه باسمي.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «ويدوم ثمركم». والفعل اليوناني كثير الورود في يوحنا بمعنى البقاء أو الثبات والاستمرار؛ واختير هنا «يبقى» لوضوحه.'
    reason: lexical_alternative
  - marker: b
    text: النص اليوناني يقول «الآب»، لا «أبي».
    reason: textual_precision
lexical_decisions:
- source_word: ἐξελέξασθε / ἐξελεξάμην
  choice: اخترتموني / اخترتكم
  rationale: «اختار» هو المقابل العربي الطبيعي للفعل، ويحفظ التقابل المباشر والمبادرة المنسوبة إلى يسوع من غير إدخال مصطلح لاهوتي تقني مثل «انتخب».
- source_word: ἔθηκα
  choice: عيّنتكم
  rationale: المعنى الحرفي هو «وضعت»، لكن السياق يدل على تخصيص التلاميذ لمهمة وغاية؛ لذا تنقل «عيّنتكم» معنى التكليف المقصود من غير حصره في سيامة كنسية.
- source_word: ἵνα
  choice: لكي
  rationale: توضح «لكي» غرض التعيين في الموضعين، وتحافظ على ترابط الجملة وحركتها نحو الغاية.
- source_word: ὑπάγητε
  choice: تذهبوا
  rationale: تحفظ دلالة الفعل الواسعة على الذهاب، من غير إضافة «إلى العالم» أو تفسير المهمة تفسيرًا أضيق مما يقوله النص.
- source_word: καρπὸν φέρητε
  choice: تثمروا
  rationale: فعل «أثمر» عربي طبيعي يحفظ استعارة الثمر اليوحناوية بإيجاز ووضوح.
- source_word: μένῃ
  choice: يبقى
  rationale: «يبقى» مقابل واضح وشائع للفعل μένω، ويعبّر هنا عن دوام الثمر من غير قصر المعنى على وجه تفسيري محدد.
- source_word: ὅ τι ἂν αἰτήσητε
  choice: كلَّ ما تطلبونه
  rationale: ينقل التعبير النسبي مع ἄν معنى العموم غير المحدد؛ و«تطلبون» ملائم لسياق الطلب من الآب.
- source_word: ἐν τῷ ὀνόματί μου
  choice: باسمي
  rationale: صياغة عربية مألوفة تحفظ العبارة اللاهوتية والعلاقية من غير توسيع تفسيري مثل «استنادًا إلى اسمي».
- source_word: δῷ
  choice: يعطيكم
  rationale: الفعل المضارع العربي داخل جملة الغرض التي تبدأ بـ«لكي» ينقل صيغة الالتزام اليونانية وغرضها من غير تحويلها إلى وعد مستقل بصيغة مستقبلية صريحة.
- source_word: τὸν πατέρα
  choice: الآب
  rationale: يحفظ النص اليوناني الذي يقول «الآب» لا «أبي».
theological_decisions:
- issue: احتمال تحميل ἐξελεξάμην مفهومًا اصطلاحيًا لاحقًا عن الاختيار
  choice: «أنا اخترتكم» في سياق التلمذة والتكليف بالإثمار
  alternative: «أنا انتخبتكم» لإبراز مفهوم لاهوتي تقني
  rationale: يثبت النص مبادرة يسوع بوضوح، لكن الفعل نفسه يعني الاختيار ولا يقتضي إدخال مصطلح مذهبي تقني في المتن.
- issue: دلالة ἔθηκα ὑμᾶς
  choice: فُهمت على أنها تعيين أو تكليف لغاية الذهاب والإثمار
  alternative: «وضعتكم» حرفيًا، أو تفسيرها بأنها سيامة لمنصب كنسي
  rationale: السياق يربط التعيين بالذهاب والإثمار والصلاة باسم يسوع، ولا يحصره في منصب كنسي محدد.
- issue: قوة جملة ἵνα الأخيرة
  choice: 'حُفظت بوصفها جملة غرض مرتبطة بما قبلها: «ولكي يعطيكم...»'
  alternative: 'صياغتها وعدًا مستقبليًا مستقلًا: «فسيعطيكم»'
  rationale: الصياغة المختارة تحافظ على ارتباط الطلب بالتعيين والإثمار، وعلى قوة الغرض أو النتيجة في التركيب اليوناني، من غير جعله معادلة غير مشروطة منفصلة عن السياق.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «لستم أنتم الذين...» لإبراز التقابل في اليونانية، و«تثمروا» لصياغة الاستعارة بصورة طبيعية. وُضع الهامشان في المتن عند اللفظ المعني، مع تجنب المصطلحات المذهبية والعبارات القديمة غير الضرورية.
