  text: ἐγώ εἰμι ἡ ἄμπελος, ὑμεῖς τὰ κλήματα. ὁ μένων ἐν ἐμοὶ κἀγὼ ἐν αὐτῷ οὗτος φέρει καρπὸν πολύν, ὅτι χωρὶς ἐμοῦ οὐ δύνασθε ποιεῖν οὐδέν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/005.yaml
  text: I am the vine[a]; you are the branches. The one who remains in me, and I in him, bears much fruit[b], because apart from me you are not able to do anything.
translation:
  language: ar
  text: أنا الكرمة، وأنتم الأغصان. مَن يثبت[a] فيَّ، وأنا فيه[b]، فهو يُثمر ثمرًا كثيرًا، لأنكم بدوني لا تقدرون أن تفعلوا شيئًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «يمكث». يدل الفعل اليوناني على البقاء والاستمرار في هذه العلاقة.'
    reason: lexical_alternative
  - marker: b
    text: جاءت «فيه» في اليونانية بصيغة المذكر المفرد، لكنها ذات دلالة تمثيلية عامة؛ فالقول ينطبق على كل تلميذ يثبت في يسوع.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄμπελος
  choice: الكرمة
  rationale: «الكرمة» هي المقابل العربي المألوف لشجرة العنب، وتحافظ على الصورة المجازية بوضوح ومن دون زيادة تفسيرية.
- source_word: κλήματα
  choice: الأغصان
  rationale: تشير الكلمة في سياق زراعة الكرمة إلى أغصانها أو فروعها؛ و«الأغصان» تعبير عربي طبيعي يحفظ الصورة الزراعية.
- source_word: ὁ μένων
  choice: من يمكث
  rationale: ينقل «يمكث» معنى الاستمرار والبقاء الذي يحمله الفعل في استعمال يوحنا، مع صياغة عامة تنطبق على كل تلميذ.
- source_word: ἐν ἐμοὶ ... ἐν αὐτῷ
  choice: فيَّ ... فيه
  rationale: أُبقي حرف الجر «في» حفاظًا على لغة السكن المتبادل والاتحاد العلائقي القوية في اليونانية، بدل إضعافها إلى «مع».
- source_word: κἀγὼ
  choice: وأنا
  rationale: 'تنقل البنية المتبادلة مباشرة: يمكث الشخص في يسوع، ويسوع فيه.'
- source_word: φέρει καρπὸν πολύν
  choice: يُثمر ثمرًا كثيرًا
  rationale: هذه صياغة عربية طبيعية في إطار صورة الكرمة، وتحافظ على الفعل الزراعي وعلى مقدار الثمر من غير تفسير زائد.
- source_word: χωρὶς ἐμοῦ
  choice: بدوني
  rationale: تفيد الانفصال عن يسوع، وهي صياغة عربية واضحة ومباشرة لمعنى «من دوني/بمعزل عني».
- source_word: οὐ δύνασθε ποιεῖν οὐδέν
  choice: لا تقدرون أن تفعلوا شيئًا
  rationale: تنقل العبارة عدم القدرة، لا النهي، وتؤدي تركيب النفي اليوناني بصياغة عربية سليمة وواضحة.
theological_decisions:
- issue: لغة السكن المتبادل في يوحنا
  choice: «يمكث فيَّ، وأنا فيه»
  alternative: «يبقى معي، وأنا معه»
  rationale: يحفظ حرف الجر «في» عمق التعبير اليوناني وتوتره اللاهوتي بشأن العلاقة المتبادلة، من غير اختزاله إلى مجرد المصاحبة.
- issue: المذكر المفرد ذو الدلالة التمثيلية في αὐτῷ
  choice: «فيه»
  alternative: «في ذلك الشخص»
  rationale: يحافظ النص على صيغة المذكر المفرد في الأصل، بينما توضّح الحاشية أن القول عام وينطبق على كل من يمكث في يسوع.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقّرة. استُعملت «الكرمة» و«الأغصان» و«يُثمر» للمحافظة على وحدة الصورة الزراعية، و«يمكث» لإبراز الاستمرار العلائقي من غير اللجوء إلى تعبير غامض أو طائفي.
