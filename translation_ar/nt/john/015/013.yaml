source:
  edition: SBLGNT
  text: μείζονα ταύτης ἀγάπην οὐδεὶς ἔχει, ἵνα τις τὴν ψυχὴν αὐτοῦ θῇ ὑπὲρ τῶν φίλων αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/013.yaml
  text: 'No one has greater love than this: that someone lay down his life for his friends[a][b][c][d].'
translation:
  language: ar
  text: 'ليس لأحدٍ محبةٌ أعظم من هذه: أن يبذل المرء حياته[a] لأجل أصدقائه[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: الكلمة اليونانية المترجمة «حياته» يمكن أن تعني أيضًا «نفسه»؛ والمقصود هنا حياته التي يبذلها حتى الموت.
    reason: lexical_alternative
  - marker: b
    text: يمكن أيضًا ترجمة «لأجل» بـ«من أجل» أو «نيابةً عن».
    reason: lexical_alternative
lexical_decisions:
- source_word: μείζονα ταύτης ἀγάπην
  choice: محبة أعظم من هذه
  rationale: يحافظ على المقارنة وعلى إحالة اسم الإشارة إلى العبارة اللاحقة التي تبيّن ماهية هذه المحبة.
- source_word: οὐδεὶς ἔχει
  choice: ليس لأحدٍ
  rationale: صياغة عربية طبيعية تؤدي معنى النفي العام والامتلاك في العبارة اليونانية.
- source_word: ἵνα τις
  choice: أن يبذل المرء
  rationale: تؤدي «أن» وظيفة العبارة الشارحة التي تحدد مضمون «هذه»، ويعبّر «المرء» عن الفاعل المفرد غير المحدد بلا تخصيص جنسي مقصود.
- source_word: τὴν ψυχὴν αὐτοῦ θῇ
  choice: يبذل المرء حياته
  rationale: الفعل مع ψυχή اصطلاح يوحناوي يدل هنا على تقديم الحياة حتى الموت؛ و«يبذل حياته» تعبير عربي واضح وطبيعي.
- source_word: ὑπὲρ τῶν φίλων αὐτοῦ
  choice: لأجل أصدقائه
  rationale: «لأجل» تنقل المعنى النفعي أو النيابي العام لـὑπέρ من غير حصره في معنى الاستبدال، و«أصدقائه» هي المقابلة المباشرة لـφίλων αὐτοῦ.
theological_decisions:
- issue: دلالة ψυχή في قول عن التضحية بالنفس
  choice: حياته
  alternative: نفسه
  rationale: السياق يتحدث عن بذل الحياة بالموت، لا عن تمييز لاهوتي بين الجسد والنفس؛ لذلك تُظهر «حياته» المعنى المقصود بوضوح.
- issue: دلالة ὑπέρ في علاقة المحبة الباذلة بالأصدقاء
  choice: لأجل
  alternative: نيابةً عن / من أجل
  rationale: تحفظ «لأجل» معنى العمل لمصلحة الآخرين، من غير أن تفرض على حرف الجر وحده دلالة استبدالية أضيق مما يقتضيه النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كريمة. اختير «المرء» للمفرد العام، وتجنبت الصياغة إقحام تحديد مذهبي لمعنى ὑπέρ.
