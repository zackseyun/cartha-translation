- source_word: ὁ πατήρ μου
  choice: أبي
  rationale: ترجمة مباشرة وطبيعية لعلاقة الآب بيسوع في العبارة اليونانية، من غير إضافة تفسيرية.
- source_word: ὁ γεωργός
