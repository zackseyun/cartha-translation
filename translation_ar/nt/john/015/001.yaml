theological_decisions:
- issue: التعريف المجازي في قول يسوع «أنا»
  choice: 'الإبقاء على المجاز مباشرة: «أنا الكرمة الحقيقية»'
  alternative: أنا الكرمة الأصيلة / أنا الكرمة الحقّة
  rationale: يحفظ النص صورة الكرمة والتوتر الدلالي في ἀληθινή من غير توسيع رمزي أو تفسير لاهوتي داخل الترجمة.
- issue: وصف الآب بلفظ γεωργός ضمن صورة الكرمة
  choice: زارع الكرم
  alternative: الكرّام / الفلاح / مزارع الكروم
  rationale: يربط العمل بالكرمة بوضوح مع إبقاء دلالة الفلاحة والعناية الزراعية، ولا يستورد معنى عقائديًا غير مصرح به.
