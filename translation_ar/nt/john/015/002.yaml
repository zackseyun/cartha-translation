  text: πᾶν κλῆμα ἐν ἐμοὶ μὴ φέρον καρπὸν αἴρει αὐτό, καὶ πᾶν τὸ καρπὸν φέρον καθαίρει αὐτὸ ἵνα ⸂καρπὸν πλείονα⸃ φέρῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/002.yaml
  text: Every branch in me that does not bear fruit[a], he removes; and every branch that bears fruit[b], he prunes so that it may bear more fruit.
translation:
  language: ar
  text: كُلُّ غُصْنٍ فِيَّ لا يُثْمِرُ يَنْزِعُهُ[a]، وكُلُّ غُصْنٍ يُثْمِرُ يُقَلِّمُهُ[b] لِيُثْمِرَ أَكْثَرَ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «يأخذه». ويفهم بعضهم الفعل اليوناني هنا بمعنى «يرفعه».
    reason: alternative_reading
  - marker: b
    text: يمكن أيضًا أن يعني الفعل المترجم «يُقَلِّمُهُ» أنه «يُطَهِّرُهُ»؛ فالتقليم يلائم صورة الكرمة، ودلالة التطهير تمهّد لوصف التلاميذ بأنهم «أنقياء» في الآية التالية.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν κλῆμα
  choice: كُلُّ غُصْنٍ
  rationale: تفيد πᾶν مع الاسم المفرد معنى توزيعيًا، و«كل غصن» تعبير عربي طبيعي يحفظ هذا المعنى.
- source_word: ἐν ἐμοὶ
  choice: فِيَّ
  rationale: ترجمة مباشرة تحفظ لغة يوحنا عن العلاقة بالمسيح من غير إضافة تفسيرية مثل «متصل بي».
- source_word: μὴ φέρον καρπὸν
  choice: لا يُثْمِرُ
  rationale: صياغة فعلية عربية موجزة وطبيعية تنقل معنى عدم حمل الثمر في الصورة الزراعية.
- source_word: αἴρει
  choice: يَنْزِعُهُ
  rationale: يمكن أن يدل الفعل على الأخذ أو الإزالة، وقد يدل في سياقات أخرى على الرفع. «ينزعه» يلائم مقابلة الغصن غير المثمر بالغصن الذي يُقلَّم، مع إثبات البديل في الحاشية.
- source_word: καρπός
  choice: الثمر / يُثمر
  rationale: نُقل الاسم بصيغة الفعل العربي الطبيعية في هذا السياق، مع الحفاظ على صورة الكرمة والإثمار.
- source_word: καθαίρει
  choice: يُقَلِّمُهُ
  rationale: هذا هو الفعل الزراعي الواضح لتهذيب أغصان الكرمة، مع الإشارة في الحاشية إلى دلالة التطهير والصلة اللفظية بالآية التالية.
- source_word: ἵνα καρπὸν πλείονα φέρῃ
  choice: لِيُثْمِرَ أَكْثَرَ
  rationale: اللام تنقل غرض ἵνα، و«يثمر أكثر» تعبير عربي طبيعي يحفظ صيغة المقارنة.
- source_word: αὐτό / αὐτὸ
  choice: ـه
  rationale: الضمير المتصل يعود إلى «الغصن» ويأتي طبيعيًا مع الفعلين «ينزعه» و«يقلمه».
- source_word: καὶ πᾶν τὸ καρπὸν φέρον
  choice: وكُلُّ غُصْنٍ يُثْمِرُ
  rationale: أُعيد ذكر «غصن» لأن اليونانية تحيل إليه بأداة التعريف واسم الفاعل، وإظهاره بالعربية يحفظ وضوح التوازي.
theological_decisions:
- issue: دلالة αἴρει في العبارة الأولى
  choice: يَنْزِعُهُ
  alternative: يأخذه / يرفعه
  rationale: «ينزعه» يحفظ التضاد المباشر بين معاملة الغصن غير المثمر وتقليم الغصن المثمر، من غير حسم مسائل لاهوتية تتعلق بالارتداد أو الثبات. وأُثبت معنى «يرفعه» في الحاشية لأنه احتمال تفسيري معروف.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدمت أفعال موجزة مألوفة في الزراعة، وحُفظت عبارة «فِيَّ» بصيغتها المباشرة لما لها من أهمية في لغة يوحنا. وُضعت علامات الحواشي [a] و[b] في المتن.
