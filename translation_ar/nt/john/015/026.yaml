base_translation:
  language: en
  yaml_path: translation/nt/john/015/026.yaml
  text: When the Advocate comes[a], whom I will send to you from the Father—the Spirit of truth[c][b], who proceeds from the Father—he will testify about me.
translation:
  language: ar
  text: «عندما يأتي المُعين[a]، الذي سأرسله إليكم من عند الآب، روحُ الحق[c] الذي ينبثق من عند الآب[b]، فهو سيشهد عني.»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «النصير»، أو «المدافع»، أو «المعزّي»؛ ويمكن نقل اللفظ اليوناني παράκλητος صوتيًا: «البارقليط».'
    reason: lexical_alternative
  - marker: b
    text: 'يقول النص اليوناني: «ينبثق من عند الآب»، وهي صياغة صارت لاحقًا ذات أهمية في النقاشات اللاهوتية عن الثالوث.'
    reason: cross_reference
  - marker: c
    text: 'أو: «سيُدلي بشهادة عني».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν ἔλθῃ
  choice: ومتى جاء
  rationale: تفيد العبارة حدثًا مستقبليًا متوقَّعًا؛ ويعبّر الماضي العربي بعد «متى» تعبيرًا طبيعيًا عن اكتمال الحدث حين يقع.
- source_word: ὁ παράκλητος
  choice: المُعين
  rationale: اللفظ اليوناني واسع الدلالة، ويشير إلى من يكون إلى جانب شخص لمساعدته أو مناصرته وتمثيله. «المُعين» واضح للقارئ المعاصر ولا يحصر المعنى في التعزية وحدها، مع ذكر البدائل في الحاشية.
- source_word: ὃν ἐγὼ πέμψω ὑμῖν
  choice: الذي سأرسله إليكم
  rationale: نقل مباشر لصيغة المستقبل وللمفعول غير المباشر، مع إبقاء ضمير المتكلم ظاهرًا في الفعل العربي.
- source_word: παρὰ τοῦ πατρός
  choice: من عند الآب
  rationale: «من عند» تنقل معنى المصدر مع إيحاء الحضور أو الجهة الذي قد تحمله παρά مع المضاف إليه، وهي عربية طبيعية.
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  choice: روح الحق
  rationale: يحافظ التعبير على تركيب الإضافة وعلى الصيغة اليوحناوية الموجزة من غير تفسير زائد.
- source_word: ὃ παρὰ τοῦ πατρὸς ἐκπορεύεται
  choice: الذي ينبثق من عند الآب
  rationale: «ينبثق» يحافظ على خصوصية ἐκπορεύεται ولا يختزله إلى مجرد «يأتي»، مع إبقاء صياغة المصدر كما في اليونانية.
- source_word: ἐκεῖνος
  choice: فهو
  rationale: الفاء تصل جواب الجملة الزمنية، والضمير المنفصل يحفظ شيئًا من توكيد اسم الإشارة اليوناني ومن العرض الشخصي للروح.
- source_word: μαρτυρήσει
  choice: سيشهد
  rationale: لفظ مفهوم ومعاصر يحفظ المجال الدلالي للشهادة، وصيغة المستقبل صريحة كما في الأصل.
- source_word: περὶ ἐμοῦ
  choice: عني
  rationale: تنقل معنى «بشأني/عنّي» بإيجاز طبيعي، من غير تحويله إلى معنى «لصالحي» وحده.
theological_decisions:
- issue: ترجمة παράκλητος في سياق الحديث عن الروح
  choice: المُعين
  alternative: النصير، أو المدافع، أو المعزّي، أو البارقليط
  rationale: لا يقابل اللفظ اليوناني لفظ عربي واحد من جميع الوجوه. اختير «المُعين» لاتساعه ووضوحه، وأُبقيت الوجوه الأخرى في الحاشية حتى لا يُحسم الثراء الدلالي قسرًا.
- issue: الإشارة الشخصية إلى الروح
  choice: الذي ... فهو سيشهد
  alternative: الذي ... فذلك سيشهد، أو صياغة غير شخصية
  rationale: مع أن πνεῦμα محايد نحويًا في اليونانية، يستأنف النص الكلام عنه باسم إشارة مذكر ἐκεῖνος مرتبطًا بـ«المعين». الصياغة العربية الشخصية تحفظ طريقة عرض النص من غير بناء استنتاج مذهبي زائد.
- issue: ترجمة ἐκπορεύεται
  choice: ينبثق من عند الآب
  alternative: يخرج من عند الآب، أو يأتي من عند الآب
  rationale: تحفظ «ينبثق» خصوصية الفعل وصياغة النص التي اكتسبت لاحقًا أهمية في المناقشات الثالوثية، من غير إضافة تحديد يتجاوز قول الآية نفسها.
translation_notes:
  register: لغة عربية فصحى واضحة ومهيبة من غير تقادم. استُخدمت «الآب» بوصفها الصيغة الاصطلاحية المألوفة في هذا السياق، و«روح الحق» للمحافظة على الإضافة الموجزة. حافظت الصياغة على التمييز بين إرسال الابن للروح وانبثاق الروح من عند الآب، من غير تفسير العلاقة بين العبارتين.
