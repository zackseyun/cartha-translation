  text: ἐν τούτῳ ἐδοξάσθη ὁ πατήρ μου ἵνα καρπὸν πολὺν φέρητε καὶ ⸀γένησθε ἐμοὶ μαθηταί.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/008.yaml
  text: 'In this my Father is glorified: that you bear much fruit and become my disciples.'
translation:
  language: ar
  text: 'بهذا يتمجّد أبي: أن تُثمروا ثمرًا كثيرًا وتصيروا لي تلاميذ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: بهذا
  rationale: يحافظ على الإحالة الإشارية الموجزة في اليونانية، مع إبقاء احتمال تعلقها بما سبق أو بما يأتي مفتوحًا نسبيًا.
- source_word: ἐδοξάσθη
  choice: يتمجّد
  rationale: المضارع العربي الطبيعي يؤدي معنى تمجيد الآب المتحقق في إثمار التلاميذ، من غير صياغة مبنية للمجهول ثقيلة.
- source_word: καρπὸν πολὺν φέρητε
  choice: تُثمروا ثمرًا كثيرًا
  rationale: ينقل صورة حمل الثمر بصياغة عربية مألوفة ويحفظ تكرار مفهوم الثمر.
- source_word: γένησθε ἐμοὶ μαθηταί
  choice: تصيروا لي تلاميذ
  rationale: يحفظ معنى γένησθε الدال على الصيرورة، كما يحفظ ἐμοί علاقة التلاميذ بيسوع صراحة.
theological_decisions:
- issue: العلاقة بين حمل الثمر والصيرورة تلاميذ
  choice: وتصيروا لي تلاميذ
  alternative: فتكونوا تلاميذي
  rationale: اختيرت الصياغة التي لا تحسم ما إذا كان الإثمار برهان التلمذة أو طريقًا إلى تحققها، وتحافظ على التوتر الذي تنقله صيغة γένησθε.
- issue: دلالة ἵνα
  choice: أن تُثمروا... وتصيروا
  alternative: لكي تُثمروا... وتصيروا
  rationale: السياق بعد النقطتين يسمح بفهم ἵνα بوصفها شارحة لمضمون «بهذا»، من غير استبعاد الظل الغائي تمامًا.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدمت النقطتان لإظهار أن الجملة التالية تشرح «بهذا»، مع تجنب زيادة تفسيرية غير موجودة في النص.
