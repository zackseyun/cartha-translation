source:
  edition: SBLGNT
  text: εἶπαν οὖν πρὸς ἀλλήλους· Μὴ σχίσωμεν αὐτόν, ἀλλὰ λάχωμεν περὶ αὐτοῦ τίνος ἔσται· ἵνα ἡ γραφὴ πληρωθῇ ⸂ἡ λέγουσα⸃· Διεμερίσαντο τὰ ἱμάτιά μου ἑαυτοῖς καὶ ἐπὶ τὸν ἱματισμόν μου ἔβαλον κλῆρον. Οἱ μὲν οὖν στρατιῶται ταῦτα ἐποίησαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/024.yaml
  text: So they said to one another[a], “Let us not tear it, but cast lots for it to decide whose it will be,” so that the Scripture might be fulfilled that says, “They divided my garments among themselves[b], and for my clothing they cast a lot.” So the soldiers did these things.
translation:
  language: ar
  text: 'فقالوا بعضهم لبعض: «لا نَشُقَّه، بل نُلْقِ قرعةً عليه[a] لنعرف لِمَن يكون». وكان ذلك لكي يتمّ الكتاب القائل: «اقتسموا ثيابي بينهم، وعلى لباسي ألقوا قرعةً»[b]. وهذا ما فعله الجنود.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «نقترع عليه».'
    reason: lexical_alternative
  - marker: b
    text: اقتباس من مزمور 22:18.
    reason: cross_reference
lexical_decisions:
- source_word: σχίσωμεν
  choice: نَشُقَّه
  rationale: الفعل يدل على شقّ الثوب أو تمزيقه. واختيار «نشقّه» موجز وطبيعي في سياق القميص المذكور قبل هذه الآية.
- source_word: αὐτόν
  choice: ـه في «نشقّه»
  rationale: الضمير مذكّر في اليونانية ويعود في السياق إلى القميص؛ لذلك يحافظ الضمير العربي المذكّر على مرجعه الطبيعي.
- source_word: λάχωμεν
  choice: نُلْقِ قرعةً عليه
  rationale: يدل الفعل هنا على تعيين المالك بالقرعة. وهذه العبارة واضحة وتحافظ على صورة إلقاء القرعة التي تتكرر في الاقتباس.
- source_word: περὶ αὐτοῦ τίνος ἔσται
  choice: عليه لنعرف لِمَن يكون
  rationale: تبيّن الصياغة غرض القرعة، أي معرفة من سيؤول إليه القميص، من غير إضافة معنى خارج العبارة اليونانية.
- source_word: ἵνα ἡ γραφὴ πληρωθῇ
  choice: وكان ذلك لكي يتمّ الكتاب
  rationale: تحافظ العبارة على صيغة يوحنا الخاصة بإتمام الكتاب، وعلى دلالة ἵνα الغائية، دون شرح آلية العلاقة بين فعل الجنود وإتمام الكتاب.
- source_word: ἡ λέγουσα
  choice: القائل
  rationale: النعت «القائل» يقدّم نص الاقتباس بعبارة عربية فصيحة ومباشرة.
- source_word: Διεμερίσαντο
  choice: اقتسموا
  rationale: يفيد الفعل توزيع الثياب فيما بينهم، و«اقتسموا» يؤدي هذا المعنى بإيجاز وطبيعية.
- source_word: ἱμάτιά
  choice: ثيابي
  rationale: جمع عام للملابس، وهو المقابل الطبيعي في سياق الاقتباس الشعري.
- source_word: ἑαυτοῖς
  choice: بينهم
  rationale: ينقل المعنى التوزيعي للضمير الانعكاسي، أي إنهم قسّموا الثياب فيما بينهم.
- source_word: ἱματισμόν
  choice: لباسي
  rationale: اختيرت كلمة تختلف عن «ثيابي» للمحافظة قدر الإمكان على التمييز اللفظي بين ἱμάτια وἱματισμός.
- source_word: ἔβαλον κλῆρον
  choice: ألقوا قرعةً
  rationale: ينقل الفعل والاسم بصيغة مفردة كما في اليونانية، ويحافظ على صورة إلقاء القرعة.
- source_word: Οἱ μὲν οὖν στρατιῶται ταῦτα ἐποίησαν
  choice: وهذا ما فعله الجنود
  rationale: صياغة عربية طبيعية تلخّص فعل الجنود وتحافظ على النبرة الاستنتاجية في ختام الآية.
theological_decisions:
- issue: العلاقة بين فعل الجنود وإتمام الكتاب في ἵνα ἡ γραφὴ πληρωθῇ
  choice: «وكان ذلك لكي يتمّ الكتاب» بوصفها عبارة إتمام مباشرة
  alternative: «فتمّ بذلك الكتاب» على اعتبار ἵνα دالة أساسًا على النتيجة
  rationale: تحافظ الصياغة على رابطة الغاية التي تحملها ἵνα وعلى تأكيد يوحنا إتمام الكتاب، من غير أن تحسم فلسفيًا كيفية اجتماع القصد الإلهي مع فعل البشر.
translation_notes:
  register: لغة عربية فصحى حديثة واضحة ذات وقار مناسب للنص الكتابي. استُخدم «الكتاب» للدلالة على النص المقدس، وحوفظ في الاقتباس على التوازي بين «ثيابي» و«لباسي». وُضع هامش البديل المعجمي عند عبارة القرعة نفسها، ووُضع هامش الإحالة بعد الاقتباس.
