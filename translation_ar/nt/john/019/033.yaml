  yaml_path: translation/nt/john/019/033.yaml
  text: But when they came to Jesus[a], seeing that he was already dead[b], they did not break his legs.
translation:
  language: ar
  text: لكن عندما وصلوا إلى يسوع[a]، رأوه ميتًا بالفعل[b]، فلم يكسروا ساقيه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يربط يوحنا هذا الفعل لاحقًا بما جاء في الكتاب: «لن يُكسر عظم منه» (يوحنا 19:36؛ وقارن خروج 12:46؛ عدد 9:12؛ مزمور 34:20).'
    reason: cross_reference
  - marker: b
    text: 'أو: «عندما رأوا أنه كان قد مات بالفعل».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ δὲ τὸν Ἰησοῦν ἐλθόντες
  choice: أَمَّا حين وصلوا إلى يسوع
  rationale: صيغت العبارة الظرفية بجملة زمنية عربية طبيعية، مع «أمّا» لإبراز الانتقال والمقابلة اللطيفة مع ما فعله الجنود بالآخرين.
- source_word: ὡς εἶδον
  choice: فرأوا أنه
  rationale: تنقل «فرأوا» الإدراك والظرف الذي بُني عليه امتناعهم عن كسر ساقيه، من غير المبالغة في إظهار السببية.
- source_word: ἤδη
  choice: بالفعل
  rationale: تفيد أن الموت كان قد وقع قبل وصول الجنود، وهي عبارة عربية واضحة وطبيعية في هذا السياق.
- source_word: τεθνηκότα
  choice: قد مات
  rationale: 'تعكس الصيغة اليونانية التامة: حدث الموت وبقيت نتيجته قائمة. وتوضح الحاشية البديل الذي يبرز الحالة الناتجة: «كان قد صار ميتًا».'
- source_word: οὐ κατέαξαν
  choice: فلم يكسروا
  rationale: الفعل يدل هنا على كسر الأطراف أو عظامها، و«يكسروا» هو المقابل العربي المباشر الملائم للسياق.
- source_word: τὰ σκέλη
  choice: ساقيه
  rationale: المعنى المباشر هو الساقان، والتثنية العربية أدق وأوجز من «رجليه» أو التوسع إلى «عظام ساقيه» الذي لا يصرح به هذا الموضع.
theological_decisions:
- issue: الإشارة المحتملة إلى إتمام الكتاب بعدم كسر عظام يسوع
  choice: 'الإبقاء على السرد المباشر: «فلم يكسروا ساقيه»'
  alternative: استعمال «عظام ساقيه» تمهيدًا ليوحنا 19:36
  rationale: الآية 19:36 هي التي تصرّح بارتباط الحدث بالكتاب. لذلك لا تُستبق دلالة النص بإدخال «العظام» في متن هذه الآية، مع حفظ الصلة في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. استُعملت «ساقيه» للتعبير الطبيعي الدقيق عن المثنى، وحُفظت علامتا الحاشيتين [a] و[b] في المتن.
