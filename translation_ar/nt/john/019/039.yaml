base_translation:
  language: en
  yaml_path: translation/nt/john/019/039.yaml
  text: Nicodemus also came—the one who had first come to him at night—bringing a mixture of myrrh and aloes[b][a], about a hundred litras.
translation:
  language: ar
  text: وجاء نيقوديموس أيضًا، وهو الذي كان قد جاء إلى يسوع ليلًا من قبل، حاملًا مزيجًا من المُرّ والعود[a]، نحو مئة ليترا[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: المراد بـ«العود» هنا خشب عطري يُستعمل في الطيب وتجهيز الموتى، لا نبات الألوة المعروف حديثًا.
    reason: lexical_note
  - marker: b
    text: الليترا رطل روماني يساوي نحو 327 غرامًا؛ فمئة ليترا تعادل تقريبًا 32–33 كيلوغرامًا.
    reason: cultural_note
lexical_decisions:
- source_word: ἦλθεν δὲ καὶ
  choice: وجاء ... أيضًا
  rationale: تنقل الواو الصلة السردية الخفيفة التي تؤديها δέ، وتحفظ «أيضًا» القوة الإضافية لـ καί، إذ ينضم نيقوديموس إلى المشاركين في الدفن.
- source_word: Νικόδημος
  choice: نيقوديموس
  rationale: نقل صوتي للاسم وفق الاستعمال العربي الكتابي الشائع.
- source_word: ὁ ἐλθὼν πρὸς αὐτὸν νυκτὸς τὸ πρῶτον
  choice: وهو الذي جاء إلى يسوع أول مرة ليلًا
  rationale: 'التركيب الوصفي يعرّف نيقوديموس بالإحالة إلى زيارته في يوحنا 3: 1–2. صُرّح باسم يسوع بدل الضمير منعًا لالتباس الضمير في العربية، مع إبقاء معنى τὸ πρῶτον الطبيعي: «أول مرة»؛ ويمكن فهمه أيضًا بمعنى «من قبل».'
- source_word: φέρων
  choice: حاملًا
  rationale: اسم الحال يعبّر طبيعيًا عن الظرف المصاحب لمجيئه، ويحفظ صورة حمل مواد تجهيز الدفن.
- source_word: μίγμα σμύρνης καὶ ἀλόης
  choice: مزيجًا من المُرّ والعود
  rationale: «مزيج» يقابل μίγμα مباشرة. و«المُرّ» هو الراتنج العطري المعروف، أما ἀλόη هنا فهو العود العطري المستخدم في الطيب وتجهيز الموتى، لا نبات الألوة المنزلي الحديث.
- source_word: ὡς
  choice: نحو
  rationale: تدل ὡς مع المقدار على التقريب، و«نحو» عربية فصيحة وواضحة.
- source_word: λίτρας ἑκατόν
  choice: مئة ليترا
  rationale: الإبقاء على الوحدة الرومانية القديمة يمنع الخلط بينها وبين الرطل الحديث، وتوضح الحاشية مكافئها التقريبي.
theological_decisions:
- issue: مرجع αὐτόν في العبارة التعريفية
  choice: يسوع
  alternative: إليه
  rationale: 'السياق اليوحناوي يحيل بوضوح إلى مجيء نيقوديموس إلى يسوع في يوحنا 3: 1–2. التصريح بالاسم يزيل التباسًا عربيًا محتملًا من غير تغيير المرجع.'
- issue: دلالة τὸ πρῶτον
  choice: أول مرة
  alternative: من قبل
  rationale: «أول مرة» تحفظ اللفظ وتبرز أن الزيارة الليلية كانت اللقاء الأول المذكور، مع التنبيه في الحاشية إلى إمكان التعبير عنها زمنيًا بـ«من قبل».
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «المُرّ والعود» بوصفهما الاسمين العربيين الطبيعيين للمادتين العطريتين، وأُبقيت «ليترا» وحدةً تاريخية مع شرحها في الحاشية. جميع علامات الحواشي مثبتة في المتن.
