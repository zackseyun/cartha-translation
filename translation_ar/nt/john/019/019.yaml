    reason: alternative_reading
lexical_decisions:
- source_word: τίτλον
  choice: لافتةً
  rationale: تشير الكلمة في سياق الصلب إلى لافتة مكتوبة تُثبَّت على صليب المحكوم عليه. و«لافتة» عربية واضحة وطبيعية، بخلاف «عنوان» التي قد توهم معنى آخر.
- source_word: ἔθηκεν ἐπὶ τοῦ σταυροῦ
  choice: وضعها على الصليب
  rationale: ينقل حرف الجر اليوناني ἐπί هنا مباشرة بمعنى «على»، من غير إضافة استنتاج مكاني مثل «فوق الصليب».
- source_word: ἦν ... γεγραμμένον
  choice: وكان مكتوبًا فيها
  rationale: يحفظ المعنى الحالي الناتج للتركيب اليوناني، مع إضافة «فيها» لإيضاح المرجع في العربية من غير تغيير للمضمون.
- source_word: Ναζωραῖος
  choice: الناصري
  rationale: المقابل العربي المألوف للنسبة إلى الناصرة، ويحافظ على صيغة اللقب التعريفي في الأصل.
- source_word: βασιλεὺς τῶν Ἰουδαίων
  choice: ملك اليهود
  rationale: يناسب صيغة التهمة الملكية العلنية في سياق الآلام، وهو المعنى الأرجح والمألوف هنا، مع إثبات الاحتمال الجغرافي البديل في الحاشية.
- source_word: δὲ καὶ
  choice: أيضًا
  rationale: ينقل القوة الإضافية للتركيب بسلاسة في العربية، بينما يُفهم الاستمرار من سياق السرد.
- source_word: Ἰησοῦς
  choice: يسوع
  rationale: الصيغة العربية القياسية للاسم في نصوص العهد الجديد.
- source_word: Πιλᾶτος
  choice: بيلاطس
  rationale: الصيغة العربية الشائعة للاسم اليوناني.
- source_word: σταυροῦ
  choice: الصليب
  rationale: المقابل العربي القياسي والملائم سياقيًا في رواية الصلب.
theological_decisions:
- issue: دلالة Ἰουδαίων في نص اللافتة
  choice: اليهود
  alternative: اليهوديين، أي سكان اليهودية
  rationale: العبارة هنا لقب ملكي علني وصيغة اتهام في رواية الآلام، و«اليهود» هي الدلالة الأرجح والأوسع تداولًا في هذا السياق. لكن اللفظ اليوناني قد يدل بحسب السياق على سكان اليهودية، لذلك حُفظ هذا الاحتمال في الحاشية بدل إسقاطه.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «لافتة» بدل «عنوان» لتوضيح طبيعة النص المثبَّت على الصليب، وحُفظ الإيقاع السردي البسيط وتكرار فكرة الكتابة كما في الأصل.
