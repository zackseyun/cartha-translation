  yaml_path: translation/nt/john/019/025.yaml
  text: Standing by the cross of Jesus were his mother[a], and his mother's sister, Mary the wife of Clopas[b], and Mary Magdalene.
translation:
  language: ar
  text: 'وكانت واقفات إلى جانب صليب يسوع: أمّه، وأخت أمّه[b]، ومريم زوجة كلوبا[a]، ومريم المجدلية.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مريم المنسوبة إلى كلوبا». لا يصرّح النص اليوناني بطبيعة العلاقة، وإن كان فهمها على أنها زوجته شائعًا.'
    reason: lexical_alternative
  - marker: b
    text: يمكن أيضًا فهم النص على أنه يذكر ثلاث نساء لا أربعًا، إذا كانت «أخت أمّه» هي نفسها «مريم المنسوبة إلى كلوبا».
    reason: alternative_reading
lexical_decisions:
- source_word: Εἱστήκεισαν
  choice: كانت واقفات
  rationale: صيغة الماضي الأبعد تُستعمل هنا للدلالة على حالة مستمرة؛ ويؤدي تركيب «كانت واقفات» هذا المعنى بوضوح وطبيعية.
- source_word: δὲ
  choice: —
  rationale: تفيد انتقالًا سرديًا خفيفًا لا تضادًا قويًا، ولا يلزم تمثيلها بأداة مستقلة في العربية لأن سياق الجملة يؤدي وظيفتها.
- source_word: παρὰ τῷ σταυρῷ
  choice: إلى جانب صليب
  rationale: تفيد παρά مع المجرور المكاني القرب والمحاذاة؛ و«إلى جانب» تعبير عربي واضح وطبيعي.
- source_word: τοῦ Ἰησοῦ
  choice: يسوع
  rationale: نُقل المضاف إليه مباشرة في تركيب «صليب يسوع» من غير توسع تفسيري.
- source_word: ἡ μήτηρ αὐτοῦ
  choice: أمّه
  rationale: ترجمة مباشرة وموجزة للعبارة الاسمية.
- source_word: ἡ ἀδελφὴ τῆς μητρὸς αὐτοῦ
  choice: أخت أمّه
  rationale: صياغة عربية طبيعية تحفظ علاقة القرابة كما وردت.
- source_word: Μαρία ἡ τοῦ Κλωπᾶ
  choice: مريم زوجة كلوبا
  rationale: يفيد تركيب أداة التعريف مع المضاف إليه تعريف مريم بعلاقتها بكلوبا، ويشيع فهم العلاقة على أنها زوجية؛ ولأن اليونانية لا تصرّح بكلمة «زوجة»، حُفظ البديل في حاشية.
- source_word: Μαρία ἡ Μαγδαληνή
  choice: مريم المجدلية
  rationale: الصيغة العربية المألوفة للنسبة التي تعرّف مريم بأنها من مجدل.
theological_decisions:
- issue: تحديد عدد النساء الواقفات عند الصليب
  choice: 'تُقرأ الآية على أنها تذكر أربع نساء: أم يسوع، وأخت أمه، ومريم زوجة كلوبا، ومريم المجدلية.'
  alternative: يمكن أن تُقرأ على أنها تذكر ثلاث نساء، إذا كانت «أخت أمه» وصفًا لمريم التي لكلوبا.
  rationale: ترتيب العبارات الاسمية المنسقة يرجّح تعداد أربع نساء، لكن إيجاز التركيب اليوناني يسمح بفهم العبارتين الوسطيتين على أنهما لشخص واحد؛ لذلك أُثبتت القراءة الأساسية مع حفظ الاحتمال الآخر في حاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ معنى الوقوف المستمر، وتُركت δὲ بلا مقابل لفظي مستقل لأن الانتقال السردي مفهوم من السياق. وُضعت الحاشيتان عند العبارتين اللتين تتصل بهما كل ملاحظة مباشرة.
