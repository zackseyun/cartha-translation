revisions:
- from: حَيْثُ صَلَبُوهُ، وَصَلَبُوا مَعَهُ اثْنَيْنِ آخَرَيْنِ، وَاحِدًا مِنْ هُنَا وَوَاحِدًا مِنْ هُنَاكَ، وَيَسُوعَ فِي الْوَسَطِ.[a]
  to: حَيْثُ صَلَبُوهُ، وَصَلَبُوا مَعَهُ اثْنَيْنِ آخَرَيْنِ، أَحَدَهُمَا مِنْ جَانِبٍ وَالْآخَرَ مِنَ الْجَانِبِ الْآخَرِ، وَيَسُوعَ فِي الْوَسَطِ.[a]
  rationale: يستبدل التعديل الإشارة العامة «من هنا/من هناك» بتعبير عربي طبيعي يبيّن أن الآخرين كانا على جانبين متقابلين، مع إبقاء يسوع «في الوسط» كما في الأصل بدل تحويل المتن إلى «بينهما». وصُححت صياغة البديل المكاني في الحاشية.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:25:57Z'
review_pass:
  verdict: revise
  source_fidelity: المعنى الأساسي منقول بأمانة، بما فيه صلب يسوع مع اثنين آخرين وترتيبهم المكاني. لكن «واحدًا من هنا وواحدًا من هناك» توحي بمكانين عامّين («هنا/هناك») أكثر من إفادة الجانبين المتقابلين التي يؤديها التعبير اليوناني المزدوج ἐντεῦθεν καὶ ἐντεῦθεν.
  naturalness: التركيب الحالي مفهوم وفصيح في الجملة الأولى، لكن التعبير المكاني المقترح أقل سلاسة ودقة في العربية المعاصرة. الصياغة «أحدهما من جانب والآخر من الجانب الآخر» طبيعية وتحفظ التوزيع بين الجانبين دون إضافة جهة محددة كيمين أو يسار.
  terminology: «صلبوه»، «يسوع»، و«في الوسط» مصطلحات سليمة ومناسبة للسجل العربي الفصيح الحديث. لا حاجة إلى إدخال تفاصيل عن أداة الصلب أو هوية الآخرين.
  issues:
  - severity: medium
    issue: «واحدًا من هنا وواحدًا من هناك» لا يحدد بوضوح الجانبين المتقابلين.
    rationale: التعبير اليوناني في هذا السياق يرسم موضع شخص على كل جانب من يسوع، لا مجرد موضعين يشار إليهما بـ«هنا» و«هناك». التعديل يحافظ على الصورة المكانية وعلى عدم التصريح بـ«بينهما» في المتن.
  - severity: low
    issue: البديل في الحاشية يقول «عن كل جانب».
    rationale: «على كل جانب» هو التعبير العربي الأوضح لوصف التوزيع المكاني المقصود.
