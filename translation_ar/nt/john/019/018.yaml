  yaml_path: translation/nt/john/019/018.yaml
  text: where they crucified him[a], and with him two others, one on each side, and Jesus in the middle.
translation:
  language: ar
  text: حَيْثُ صَلَبُوهُ، وَصَلَبُوا مَعَهُ اثْنَيْنِ آخَرَيْنِ، أَحَدَهُمَا مِنْ جَانِبٍ وَالْآخَرَ مِنَ الْجَانِبِ الْآخَرِ، وَيَسُوعَ فِي الْوَسَطِ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو بإيجاز أكثر: «واحدًا على كل جانب، ويسوع بينهما».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου
  choice: حيث
  rationale: ظرف مكان موصول مباشر، وهو المقابل العربي الطبيعي والدقيق.
- source_word: ἐσταύρωσαν
  choice: صلبوه
  rationale: الفعل في سياق آلام يسوع يدل على الصلب، من غير حاجة إلى إضافة تفاصيل عن وسيلته أو كيفيته.
- source_word: μετ’ αὐτοῦ
  choice: معه
  rationale: تنقل معنى المصاحبة الذي تؤديه μετά مع المضاف إليه.
- source_word: ἄλλους δύο
  choice: اثنين آخرين
  rationale: يحافظ على التعبير اليوناني من غير إضافة اسم «رجلين» غير مصرّح به في النص.
- source_word: ἐντεῦθεν καὶ ἐντεῦθεν
  choice: واحدًا من هنا وواحدًا من هناك
  rationale: يحفظ التوزيع المكاني التصويري في العبارة اليونانية، أي وجود الآخرين على جهتين متقابلتين.
- source_word: μέσον
  choice: في الوسط
  rationale: تعبير عربي طبيعي يحافظ على الصورة المكانية، من غير تحويلها صراحةً إلى «بينهما».
- source_word: δὲ
  choice: الواو
  rationale: أداة ربط خفيفة هنا؛ والواو تلائم السياق العربي ولا توحي بتعارض قوي.
- source_word: τὸν Ἰησοῦν
  choice: يسوعَ
  rationale: حُفظ التركيب المقتضب الذي يجعل يسوع هو الواقع في الموضع الأوسط.
theological_decisions:
- issue: هل يُصرَّح بأن يسوع كان بين الآخرين؟
  choice: «واحدًا من هنا وواحدًا من هناك، ويسوعَ في الوسط»
  alternative: «واحدًا عن كل جانب، ويسوع بينهما»
  rationale: النص يصف الجهتين ثم يضع يسوع في الوسط. الصياغة المختارة تحفظ ترتيب الصورة وألفاظها من غير استبدال «في الوسط» بالتفسير السياقي «بينهما».
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. أُعيد فعل «صلبوا» قبل «معه» لتستقيم العربية ويتضح تعلق الآخرين بالفعل، مع الحفاظ على إيجاز الأصل وصورته المكانية.
