source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀αὐτῷ Ἰησοῦς· Οὐκ εἶχες ἐξουσίαν ⸂κατ’ ἐμοῦ οὐδεμίαν⸃ εἰ μὴ ἦν ⸂δεδομένον σοι⸃ ἄνωθεν· διὰ τοῦτο ὁ ⸀παραδούς μέ σοι μείζονα ἁμαρτίαν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/011.yaml
  text: Jesus answered him[a], “You would have no authority over me at all unless it had been given to you from above[b]. Therefore the one who handed me over to you has the greater sin.”
translation:
  language: ar
  text: 'أجابه يسوع: «لم يكن لك عليَّ أيُّ سلطان لو لم يكن قد أُعطي لك من فوق[a]. لذلك فالذي سلَّمني إليك عليه خطيئة أعظم[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: من السماء. يقول اليوناني «من فوق»، وهي عبارة تشير عند يوحنا مرارًا إلى مصدر إلهي.'
    reason: lexical_alternative
  - marker: b
    text: لا يحدّد النص هنا صراحةً مَن الذي سلّم يسوع إلى بيلاطس؛ وقد يُفهم أنه يهوذا، أو قيافا، أو القيادة اليهودية على نطاق أوسع.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξουσίαν
  choice: سلطان
  rationale: «سلطان» يلائم الصلاحية القضائية والحكومية المفوَّضة لبيلاطس، ولا يحصر المعنى في مجرد القدرة أو القوة.
- source_word: κατ’ ἐμοῦ οὐδεμίαν
  choice: لم يكن لك عليَّ أيُّ سلطان
  rationale: يحافظ هذا التعبير على علاقة السلطان بيسوع وعلى توكيد النفي في οὐδεμίαν بصياغة عربية طبيعية.
- source_word: δεδομένον σοι
  choice: قد أُعطي لك
  rationale: المبني للمجهول يحفظ عدم التصريح باسم المُعطي، و«قد» تشير إلى أن الإعطاء سابق لممارسة بيلاطس سلطانه الحاضر.
- source_word: ἄνωθεν
  choice: من فوق
  rationale: هذه المقابلة المباشرة تحفظ تعبير يوحنا وإشارته إلى مصدر علوي إلهي من غير استبداله في المتن بالتفسير الأصرح «من السماء».
- source_word: διὰ τοῦτο
  choice: لذلك
  rationale: تنقل الصلة السببية والاستنتاجية بإيجاز ووضوح.
- source_word: ὁ παραδούς μέ σοι
  choice: الذي سلَّمني إليك
  rationale: تحفظ الفاعل غير المسمّى ولا تحسم هل المقصود يهوذا أم قيافا أم جهة قيادية أوسع.
- source_word: μείζονα ἁμαρτίαν ἔχει
  choice: عليه خطيئة أعظم
  rationale: ينقل تفاوت المسؤولية الأخلاقية مع تجنب صياغة قد توحي بأن الخطيئة شيء مملوك حرفيًا؛ و«أعظم» تبقي المقارنة التي يقتضيها السياق.
theological_decisions:
- issue: مصدر سلطان بيلاطس الذي يدل عليه ἄνωθεν
  choice: «من فوق»، بما يشير إلى مصدر إلهي من غير تفصيل نظرية عامة في شرعية الحكم
  alternative: «من السماء» أو فهم علوي عام
  rationale: السياق اليوحناوي يرجّح المصدر الإلهي، لكن إبقاء العبارة «من فوق» يحفظ صياغة النص ولا يزيد عليها تقريرًا لاهوتيًا أوسع.
- issue: هوية ὁ παραδούς μέ σοι
  choice: 'إبقاء المرجع غير مسمّى: «الذي سلَّمني إليك»'
  alternative: يهوذا، أو قيافا، أو القيادة اليهودية على نطاق أوسع
  rationale: النص اليوناني لا يعيّن الشخص أو الجهة صراحة، ولذلك لا ينبغي حسم الخلاف في المتن.
- issue: المقارنة في «خطيئة أعظم»
  choice: الإقرار بتفاوت المسؤولية بين بيلاطس ومن سلّم يسوع إليه، من غير نفي خطيئة بيلاطس
  alternative: اعتبار العبارة إعفاءً كاملًا لبيلاطس
  rationale: صيغة المقارنة μείζονα تفترض مسؤولية متفاوتة، لا انعدام المسؤولية عن الطرف الآخر.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُخدم «سلطان» للمجال القضائي المفوَّض، و«سلَّمني» لصياغة طبيعية تحافظ على غموض هوية الفاعل. وُضعت علامتا الحاشيتين عند عبارتي «من فوق» و«الذي سلَّمني إليك» بما يطابق محتوى كل حاشية.
