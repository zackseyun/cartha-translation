base_translation:
  language: en
  yaml_path: translation/nt/john/019/026.yaml
  text: So when Jesus saw his mother and the disciple whom he loved standing there[a], he says to his mother, “Woman, behold, your son.”
translation:
  language: ar
  text: 'فَلَمَّا رَأَى يَسُوعُ أُمَّهُ، وَالتِّلْمِيذَ الَّذِي كَانَ يُحِبُّهُ وَاقِفًا هُنَاكَ، قَالَ لِأُمِّهِ: «يَا امْرَأَةُ[a]، هُوَذَا ابْنُكِ.»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'عبارة «يا امرأة» خطاب محترم في اليونانية هنا، وليست فظّة أو مهينة. ويمكن نقل معناها بحسب المقام: «يا سيدتي».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: فَلَمَّا
  rationale: أُدمجت قوة أداة الربط في صياغة «فلما» التي تصل الحدث بما قبله وتعرضه بوصفه تقدّمًا في المشهد، من غير إثقال السرد بـ«لذلك».
- source_word: ἰδὼν
  choice: رَأَى
  rationale: 'صيغ اسم الفاعل الأوريستي في تركيب زمني عربي طبيعي: «فلما رأى»، محافظًا على تعاقب الحدثين.'
- source_word: τὴν μητέρα
  choice: أُمَّهُ
  rationale: المرجع هو أم يسوع، والعربية الطبيعية تستعمل ضمير الملكية هنا كما يقتضيه السياق، مع أن اليونانية تستعمل أداة التعريف.
- source_word: τὸν μαθητὴν
  choice: التِّلْمِيذَ
  rationale: حُفظ التعريف لأنه تلميذ معيّن معروف في سياق إنجيل يوحنا.
- source_word: παρεστῶτα
  choice: وَاقِفًا بِجَانِبِهَا
  rationale: 'ينقل هيئة الوقوف والحضور القريب في المشهد. أُعيد الضمير على الأم بوصفه الفهم السياقي الطبيعي لموضع التلميذ، مع بقاء المعنى الأساسي: أنه كان واقفًا هناك بقربها.'
- source_word: ὃν ἠγάπα
  choice: الَّذِي كَانَ يُحِبُّهُ
  rationale: يحفظ وصف التلميذ بعلاقة محبة يسوع له. و«كان يحبّه» عربية سردية واضحة، وفاعل المحبة مفهوم من يسوع المذكور أولًا.
- source_word: λέγει
  choice: قَالَ
  rationale: مع أن اليونانية تستعمل المضارع التاريخي، فالماضي هو الأسلوب السردي العربي الطبيعي؛ نقل الحدث بوضوح من غير افتعال مضارع تاريخي غير مألوف.
- source_word: Γύναι
  choice: يَا امْرَأَةُ
  rationale: ترجمة مباشرة للنداء، مع حاشية توضّح أنه خطاب محترم في سياقه اليوناني وليس إهانة، لأن العبارة العربية قد تُفهم اليوم على أنها جافة.
- source_word: ἴδε
  choice: هُوَذَا
  rationale: 'ينقل قوة الإشارة والتنبيه المهيبة في الأمر اليوناني بصياغة عربية فصيحة مألوفة في الإعلان: «هوذا».'
- source_word: ὁ υἱός σου
  choice: ابْنُكِ
  rationale: يحفظ تعريف التلميذ في علاقة بنوية جديدة إلى أم يسوع، من غير إضافة تفسير لماهية هذه العلاقة.
theological_decisions:
- issue: نبرة خطاب يسوع لأمه في Γύναι
  choice: إبقاء «يا امرأة» في المتن مع توضيح النبرة في الحاشية
  alternative: «يا سيدتي» أو «يا عزيزتي»
  rationale: اللفظ اليوناني محترم في هذا السياق لكنه لا يتضمن بذاته معنى «عزيزتي». الترجمة المباشرة تحفظ صياغة المصدر، والحاشية تمنع حمل العبارة العربية على الجفاء أو الإهانة.
- issue: طبيعة إعلان «هوذا ابنك»
  choice: ترك العبارة موجزة كما في اليونانية
  alternative: تفسيرها في المتن بأنها إسناد رعاية أو إنشاء قرابة روحية
  rationale: النص يعلن علاقة بنوية من غير أن يشرح هنا جميع أبعادها؛ لذلك تُحفظ كثافته ولا يُستورد تفسير لاهوتي أو كنسي بعينه.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة، مع ضبط كامل للنص القصير. استُعمل الماضي في السرد لسلامة الأسلوب العربي، وحُفظت مباشرة «يا امرأة» ووقع «هوذا» مع حاشية تمنع سوء الفهم المعاصر.
