  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἦν δὲ ἐν τῷ τόπῳ ὅπου ἐσταυρώθη κῆπος, καὶ ἐν τῷ κήπῳ μνημεῖον καινόν, ἐν ᾧ οὐδέπω οὐδεὶς ⸂ἦν τεθειμένος⸃·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/041.yaml
  text: In the place where he was crucified there was a garden, and in the garden a new tomb, in which no one had yet been laid.
translation:
  language: ar
  text: وكان في المكان الذي صُلِب فيه بستان، وفي البستان قبر جديد، لم يكن قد وُضع فيه أحد بعد.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: وَ
  rationale: تفيد انتقالًا سرديًّا خفيفًا، وتحافظ الواو على الصلة بالسياق من غير أن تضيف معنى زمنيًّا مثل «الآن».
- source_word: τόπῳ
  choice: المكان
  rationale: المقابل العربي المباشر والطبيعي في هذا السياق المكاني.
- source_word: ὅπου ἐσταυρώθη
  choice: الذي صُلِب فيه
  rationale: يحافظ على المبني للمجهول في اليونانية، ويُفهم مرجع الضمير من السياق.
- source_word: κῆπος
  choice: بستان
  rationale: «بستان» لفظ عربي واضح يلائم موضعًا مزروعًا، من غير تخصيصه بأنه حديقة للزينة أو بستان أشجار مثمرة.
- source_word: μνημεῖον
  choice: قبر
  rationale: يدل هنا على موضع الدفن الذي يوضع فيه الجسد، وهو التعبير العربي الطبيعي في سياق دفن يسوع.
- source_word: καινόν
  choice: جديد
  rationale: ينقل معنى الصفة مباشرة، فيما توضّح الجملة التالية أن القبر لم يُستعمل بعد.
- source_word: ἐν ᾧ
  choice: فيه
  rationale: ضمير موصول طبيعي في العربية يعود بوضوح إلى القبر.
- source_word: οὐδέπω οὐδεὶς
  choice: لم ... أحد بعد
  rationale: هذه الصياغة العربية تجمع النفي مع الدلالة الزمنية وتحفظ معنى «لا أحد حتى ذلك الوقت».
- source_word: ἦν τεθειμένος
  choice: لم يكن قد وُضع
  rationale: يحفظ البناء الدال على حالة ناتجة عن فعل سابق، كما يحافظ على المبني للمجهول؛ ويفهم من السياق أن الوضع هو للدفن.
theological_decisions:
- issue: صياغة ألفاظ الدفن في μνημεῖον وτεθειμένος
  choice: قبر ... لم يكن قد وُضع فيه أحد بعد
  alternative: ضريح ... لم يكن أحد قد دُفن فيه بعد
  rationale: تحافظ الصياغة المختارة على صورة النص، أي وضع الشخص في القبر، من غير استبدال الفعل بتفسيره «دُفن» أو تحميل الموضع وصفًا معماريًّا زائدًا مثل «ضريح».
- issue: صيغة المبني للمجهول في ἐσταυρώθη
  choice: صُلِب
  alternative: صلبوه
  rationale: المبني للمجهول يطابق صيغة المصدر ولا يضيف فاعلًا بشريًّا صريحًا غير مذكور في هذه الجملة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حافظت الصياغة على التوازي بين «في المكان» و«في البستان»، وعلى المبني للمجهول في الصلب والوضع. لا توجد حاجة إلى حواشٍ نصية أو تفسيرية في هذه الآية.
