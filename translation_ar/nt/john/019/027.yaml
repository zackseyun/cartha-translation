source:
  edition: SBLGNT
  text: εἶτα λέγει τῷ μαθητῇ· ⸀Ἴδε ἡ μήτηρ σου. καὶ ἀπ’ ἐκείνης τῆς ὥρας ἔλαβεν ὁ μαθητὴς αὐτὴν εἰς τὰ ἴδια.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/027.yaml
  text: Then he said to the disciple, “Look, your mother.” And from that hour the disciple took her into his own home.
translation:
  language: ar
  text: 'ثم قال للتلميذ: «ها هي أمك». ومنذ تلك الساعة أخذها التلميذ إلى بيته.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἴδε
  choice: ها هي
  rationale: صيغة تنبيه وإشارة طبيعية في العربية، تحافظ على قوة الالتفات من غير ترجمة حرفية متكلفة مثل «انظر».
- source_word: εἰς τὰ ἴδια
  choice: إلى بيته
  rationale: العبارة اليونانية تعني حرفيًا «إلى ما هو خاص به»، وهي هنا تعبير سياقي عن البيت أو المحيط المنزلي؛ و«إلى بيته» أوضح مقابل عربي من غير إضافة معنى الرعاية صراحة.
- source_word: ἀπ’ ἐκείνης τῆς ὥρας
  choice: ومنذ تلك الساعة
  rationale: ينقل الدلالة الزمنية التي تبدأ عند تلك اللحظة وتستمر بعدها، ويحافظ على لفظ «الساعة» المميز في سياق يوحنا.
theological_decisions:
- issue: طبيعة علاقة التلميذ بأم يسوع بعد هذا القول
  choice: أخذها التلميذ إلى بيته
  alternative: اعتنى بها التلميذ كأم له
  rationale: النص يصرح بأخذها إلى ما يخص التلميذ، لكنه لا يشرح جميع الآثار اللاهوتية أو الأسرية لهذا الفعل؛ لذلك لم تُضف صياغة تفسيرية تتجاوز العبارة اليونانية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم «ها هي أمك» بوصفه تنبيهًا عربيًا طبيعيًا، و«إلى بيته» لتوضيح التعبير اليوناني الاصطلاحي من دون تحميله تفاصيل غير مذكورة.
