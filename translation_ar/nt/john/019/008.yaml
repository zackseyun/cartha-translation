lexical_decisions:
- source_word: Ὅτε οὖν
  choice: فَلَمَّا
  rationale: تفيد «لمّا» الظرفية الزمنية، وتنقل الفاء بخفة الصلة السياقية التي تؤديها οὖν، بصياغة عربية طبيعية.
- source_word: ἤκουσεν
  choice: سَمِعَ
  rationale: الفعل هنا يدل على تلقّي الكلام أو المعلومة، و«سمع» هو المقابل العربي المباشر الملائم للسرد.
- source_word: ὁ Πιλᾶτος
  choice: بِيلاطُسُ
  rationale: نقل الاسم العلم بصيغته العربية الشائعة، من غير أداة تعريف كما تقتضي العربية مع أسماء الأعلام.
- source_word: τοῦτον τὸν λόγον
  choice: هٰذَا الْقَوْلَ
  rationale: يشير λόγος إلى مضمون الكلام السابق، أي الادعاء المذكور في الآية السابقة. و«القول» يحافظ على الإحالة إلى كلام قيل من غير تضييقه إلى «كلمة» مفردة أو تفسيره تفسيرًا زائدًا.
- source_word: μᾶλλον ἐφοβήθη
  choice: ازْدَادَ خَوْفًا
  rationale: تنقل العبارة ازدياد خوف بيلاطس مقارنةً بما كان عليه، وتؤدي بصورة عربية موجزة وطبيعية دلالة μᾶλλον مع الصيغة الحدثية للفعل.
theological_decisions:
- issue: طبيعة خوف بيلاطس
  choice: إبقاء الخوف غير محدد السبب
  alternative: تحديده بأنه خوف سياسي، أو خوف من دلالة إلهية محتملة
  rationale: النص اليوناني لا يحدد منشأ الخوف، بل يذكر فقط أنه ازداد بعد سماع القول؛ لذلك تحافظ الترجمة على التوتر السردي واللاهوتي من غير حسم.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة، مع صياغة سردية طبيعية. لم تُضف حاشية لعدم وجود غموض نصي أو دلالي يحتاج إلى تنبيه في هذه الآية.
