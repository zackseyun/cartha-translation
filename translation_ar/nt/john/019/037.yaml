  source_fidelity: 'الترجمة تنقل عناصر النص اليوناني كلها بأمانة: «أيضًا» لـ πάλιν، و«نصٌّ آخر من الكتاب» لـ ἑτέρα γραφή، وصيغة الاستشهاد بالمضارع «يقول»، ثم المستقبل «سينظرون»، واتجاه النظر في «إلى»، وفعل الطعن في «طعنوه». ولا تضيف تحديدًا لمرجع الضمير أو ألفاظًا من صياغة زكريا خارج نص يوحنا.'
  naturalness: الصياغة فصيحة حديثة وواضحة، وترتيب «ويقول أيضًا نصٌّ آخر من الكتاب» سليم في أسلوب الاقتباس الكتابي. وعبارة الاقتباس «سينظرون إلى الذي طعنوه» طبيعية وموقرة.
  terminology: «الكتاب» و«نصٌّ آخر» يؤديان المقصود من γραφή بوضوح في العربية المعاصرة دون تحميل مذهبي. و«طعنوه» ترجمة مناسبة لـ ἐξεκέντησαν في سياق الصلب. الحاشية تحفظ الإمكان الاتجاهي في εἰς وتذكر صدى زكريا 12:10 دون فرض صياغة ذلك النص على يوحنا.
