  text: καὶ πάλιν ἑτέρα γραφὴ λέγει· Ὄψονται εἰς ὃν ἐξεκέντησαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/037.yaml
  text: And again another Scripture says[a], “They will look on the one whom they pierced.”
translation:
  language: ar
  text: 'ويقول أيضًا نصٌّ آخر من الكتاب[a]: «سينظرون إلى الذي طعنوه».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمتها: «سينظرون نحو من طعنوه». يسمح التركيب اليوناني بفهم النظر على أنه موجَّه «إلى» الشخص أو «نحوه»، والعبارة تردد صدى زكريا 12:10.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: أيضًا
  rationale: تربط هذه الكلمة الاقتباس باقتباس كتابي سابق وتدل على إضافة شاهد آخر؛ و«أيضًا» هي الصياغة العربية الطبيعية هنا.
- source_word: ἑτέρα γραφή
  choice: نصٌّ آخر من الكتاب
  rationale: تشير γραφή هنا إلى نص من الكتاب المقدس، وἑτέρα تقدمه بوصفه شاهدًا كتابيًا إضافيًا. هذه الصياغة أوضح للقارئ العربي من «كتابة أخرى».
- source_word: λέγει
  choice: يقول
  rationale: يحافظ المضارع على حيوية صيغة الاستشهاد الكتابي في اليونانية، و«يقول» تعبير عربي مألوف في هذا السياق.
- source_word: Ὄψονται
  choice: سينظرون
  rationale: الفعل في صيغة المستقبل ويدل هنا، مع حرف الجر التالي، على توجيه النظر لا على مجرد الرؤية.
- source_word: εἰς ὃν
  choice: إلى الذي
  rationale: يفيد εἰς اتجاه النظر نحو شخص. و«إلى الذي» تنقل التركيب بوضوح مع إبقاء الشخص المشار إليه غير مسمى كما في النص اليوناني.
- source_word: ἐξεκέντησαν
  choice: طعنوه
  rationale: يدل الفعل على الثقب أو الطعن بأداة حادة؛ و«طعنوه» واضحة وملائمة لسياق الصلب ولصدى زكريا 12:10.
theological_decisions:
- issue: نقل الإشارة إلى زكريا 12:10 مع الحفاظ على دلالة يوحنا المسيحانية دون إدخال ألفاظ غير موجودة في نص يوحنا
  choice: سينظرون إلى الذي طعنوه
  alternative: سينظرون نحو من طعنوه
  rationale: تجعل الصياغة المشار إليه شخصًا بوضوح، وهو يسوع في السياق، لكنها لا تستورد صيغة المتكلم الإلهي من نص زكريا العبري إلى صياغة يوحنا اليونانية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «نص من الكتاب» لتوضيح أن γραφή تعني شاهدًا من الكتاب المقدس، مع تجنب صياغة مذهبية أو إدخال تفاصيل من نص زكريا ليست في العبارة اليونانية هنا.
