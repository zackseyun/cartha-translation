  text: οἱ οὖν στρατιῶται ὅτε ἐσταύρωσαν τὸν Ἰησοῦν ἔλαβον τὰ ἱμάτια αὐτοῦ καὶ ἐποίησαν τέσσαρα μέρη, ἑκάστῳ στρατιώτῃ μέρος, καὶ τὸν χιτῶνα. ἦν δὲ ὁ χιτὼν ἄραφος, ἐκ τῶν ἄνωθεν ὑφαντὸς δι’ ὅλου·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/023.yaml
  text: So when the soldiers had crucified Jesus[a], they took his outer garments and made four parts, a part for each soldier, and also the tunic. Now the tunic was seamless[c][b], woven from the top throughout.
translation:
  language: ar
  text: فَلَمَّا صَلَبَ الْجُنُودُ يَسُوعَ، أَخَذُوا ثِيَابَهُ الْخَارِجِيَّةَ[a] وَقَسَّمُوهَا إِلَى أَرْبَعَةِ أَقْسَامٍ، قِسْمًا لِكُلِّ جُنْدِيٍّ، وَأَخَذُوا الْقَمِيصَ أَيْضًا. وَكَانَ الْقَمِيصُ بِلَا دَرْزٍ، مَنْسُوجًا مِنْ أَعْلَاهُ عَلَى امْتِدَادِهِ كُلِّهِ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «ثيابه». قد تدل الكلمة اليونانية على الملابس عمومًا، لكن المقصود هنا على الأرجح الثياب الخارجية، في مقابل القميص المذكور على حدة.
    reason: lexical_alternative
  - marker: b
    text: أو «من أعلى». يُفهم التعبير في هذا السياق على الأرجح بأن النسج بدأ من أعلى الثوب واستمر على امتداده كله.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ οὖν στρατιῶται ὅτε ἐσταύρωσαν τὸν Ἰησοῦν
  choice: فَلَمَّا صَلَبَ الْجُنُودُ يَسُوعَ
  rationale: تؤدي «فلمّا» وظيفة οὖν مع ὅτε في وصل السرد وبيان أن الصلب سبق أخذ الثياب، بصياغة عربية طبيعية.
- source_word: ἔλαβον τὰ ἱμάτια αὐτοῦ
  choice: أَخَذُوا ثِيَابَهُ الْخَارِجِيَّةَ
  rationale: يحتمل ἱμάτια معنى الثياب عمومًا، لكن تخصيصه بالثياب الخارجية يوضح مقابلته بالقميص المذكور على حدة.
- source_word: ἐποίησαν τέσσαρα μέρη, ἑκάστῳ στρατιώτῃ μέρος
  choice: وَقَسَمُوهَا أَرْبَعَةَ أَقْسَامٍ، لِكُلِّ جُنْدِيٍّ قِسْمٌ
  rationale: ينقل المعنى الفعلي لعبارة «صنعوا أربعة أجزاء» إلى تعبير عربي واضح، ويحفظ تكرار مفهوم القسم.
- source_word: καὶ τὸν χιτῶνα
  choice: وَأَخَذُوا الْقَمِيصَ أَيْضًا
  rationale: القميص هنا هو الثوب الملاصق للجسد؛ وإعادة الفعل المضمر في اليونانية تجعل العبارة العربية سليمة وتوضح أن الجنود أخذوه أيضًا.
- source_word: ἄραφος
  choice: بِلَا خِيَاطَةٍ
  rationale: ينقل معنى «غير مخيط/بلا درز» بلغة عربية مألوفة من غير أن يضيف دلالة رمزية.
- source_word: ἐκ τῶν ἄνωθεν ὑφαντὸς δι’ ὅλου
  choice: مَنْسُوجًا كُلَّهُ مِنْ أَعْلَى
  rationale: تحفظ العبارة كون القميص منسوجًا في جميعه، وتبقي ἄνωθεν في معناها السياقي «من أعلى» دون زيادة غير منصوص عليها.
theological_decisions:
- issue: احتمال تحميل القميص غير المخيط رمزية كهنوتية أو كنسية
  choice: وصف هيئة القميص فقط من غير تفسير رمزي
  alternative: صياغة توحي بثوب كهنوتي أو بوحدة الكنيسة
  rationale: النص يذكر صنع القميص وأفعال الجنود، ولا يصرح هنا بأي مدلول رمزي؛ لذلك لا تُدرج قراءة مذهبية في الترجمة.
translation_notes:
  register: 'عربية فصحى حديثة واضحة ووقورة. استُخدم «القميص» بمعناه التاريخي: الثوب الداخلي أو الملاصق للجسد، لا القميص الحديث حصرًا. لم تُضف أي دلالة رمزية إلى وصف الثوب.'
