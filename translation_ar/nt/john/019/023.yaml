review_pass:
  verdict: revise
  source_fidelity: المعنى العام محفوظ، لكن «وقسموها أربعة أقسام» تفتقر إلى حرف الجر «إلى» في العربية. كما أن «منسوجًا كلَّه من أعلى» لا يعبّر بوضوح عن δι’ ὅλου («على امتداده كله»).
  naturalness: الصياغة فصيحة في الجملة، وتصبح أوضح وأفصح بتصحيح تركيب التقسيم واستعمال «بلا درز» بدل «بلا خياطة» لوصف الثوب الذي لا وصلة فيه.
  terminology: «الثياب الخارجية» و«القميص» يحفظان التمييز بين ἱμάτια وχιτών. و«بلا درز» أدق من «بلا خياطة» لـἄραφος، من غير تحميل الوصف معنى رمزيًا.
  issues:
  - severity: medium
    issue: تركيب «وقسموها أربعة أقسام» غير سليم على الوجه الأفصح.
    rationale: 'الفعل «قسّم» يتعدى هنا بـ«إلى»: «قسّموها إلى أربعة أقسام».'
  - severity: medium
    issue: «منسوجًا كلَّه من أعلى» لا يوضح امتداد النسج في كامل الثوب.
    rationale: δι’ ὅλου تفيد الامتداد خلال الثوب كله، لا مجرد وصف الفعل بأنه كامل؛ لذا «على امتداده كله» أوضح.
  - severity: low
    issue: «بلا خياطة» أقل دقة في وصف ἄραφος.
    rationale: «بلا درز» تعبر مباشرة عن عدم وجود وصلة أو درز في الثوب، وهو المقصود الوصفي في السياق.
  revised_text: فَلَمَّا صَلَبَ الْجُنُودُ يَسُوعَ، أَخَذُوا ثِيَابَهُ الْخَارِجِيَّةَ[a] وَقَسَّمُوهَا إِلَى أَرْبَعَةِ أَقْسَامٍ، قِسْمًا لِكُلِّ جُنْدِيٍّ، وَأَخَذُوا الْقَمِيصَ أَيْضًا. وَكَانَ الْقَمِيصُ بِلَا دَرْزٍ، مَنْسُوجًا مِنْ أَعْلَاهُ عَلَى امْتِدَادِهِ كُلِّهِ[b].
