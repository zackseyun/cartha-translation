revisions:
- from: فَلَمَّا صَلَبَ الْجُنُودُ يَسُوعَ، أَخَذُوا ثِيَابَهُ الْخَارِجِيَّةَ[a] وَقَسَمُوهَا أَرْبَعَةَ أَقْسَامٍ، لِكُلِّ جُنْدِيٍّ قِسْمٌ، وَأَخَذُوا الْقَمِيصَ أَيْضًا. وَكَانَ الْقَمِيصُ بِلَا خِيَاطَةٍ، مَنْسُوجًا كُلَّهُ مِنْ أَعْلَى[b].
  to: فَلَمَّا صَلَبَ الْجُنُودُ يَسُوعَ، أَخَذُوا ثِيَابَهُ الْخَارِجِيَّةَ[a] وَقَسَّمُوهَا إِلَى أَرْبَعَةِ أَقْسَامٍ، قِسْمًا لِكُلِّ جُنْدِيٍّ، وَأَخَذُوا الْقَمِيصَ أَيْضًا. وَكَانَ الْقَمِيصُ بِلَا دَرْزٍ، مَنْسُوجًا مِنْ أَعْلَاهُ عَلَى امْتِدَادِهِ كُلِّهِ[b].
  rationale: صُحح تركيب التقسيم، واستُبدل الوصف الأقل دقة «بلا خياطة» بـ«بلا درز»، وأعيدت صياغة العبارة الأخيرة لتعكس بوضوح أن القميص كان منسوجًا من أعلاه على امتداده كله. لا تضيف الترجمة أي تفسير رمزي أو مذهبي.
