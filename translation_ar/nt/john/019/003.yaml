  text: καὶ ⸂ἤρχοντο πρὸς αὐτὸν καὶ⸃ ἔλεγον· Χαῖρε, ὁ βασιλεὺς τῶν Ἰουδαίων· καὶ ἐδίδοσαν αὐτῷ ῥαπίσματα.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/003.yaml
  text: And they came up to him and said[a], “Hail[b], King of the Jews!” And they were slapping him.
translation:
  language: ar
  text: 'وكانوا يتقدَّمون إليه ويقولون[a]: «السلام عليك، يا ملك اليهود!» وكانوا يلطمونه[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وكانوا يواصلون التقدُّم إليه والقول»، إذ يمكن أن تدل صيغتا الفعل في اليونانية على التكرار أو الاستمرار.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «وكانوا يعطونه لطمات»، أي كانوا يضربونه بأيديهم.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρχοντο πρὸς αὐτὸν
  choice: كانوا يتقدَّمون إليه
  rationale: صيغة الماضي الناقص تفيد المشهد المستمر أو المتكرر، و«يتقدَّمون إليه» تحفظ معنى الحركة نحوه بلغة عربية طبيعية.
- source_word: ἔλεγον
  choice: ويقولون
  rationale: جاء الفعل في الماضي الناقص، فاقترنت صياغته بـ«كانوا» للدلالة على استمرار القول أو تكراره ضمن الاستهزاء.
- source_word: Χαῖρε
  choice: السلام عليك
  rationale: تحية مألوفة ورسمية في العربية، وتصلح هنا لتحية ملكية ساخرة بحسب السياق، من غير ترجمة حرفية غير اصطلاحية مثل «افرح».
- source_word: ὁ βασιλεὺς τῶν Ἰουδαίων
  choice: يا ملك اليهود
  rationale: نقل مباشر للقب، مع أداة النداء التي يقتضيها الخطاب العربي الطبيعي.
- source_word: ἐδίδοσαν αὐτῷ ῥαπίσματα
  choice: وكانوا يلطمونه
  rationale: ῥαπίσματα تدل على لطمات أو ضربات باليد، والماضي الناقص يفيد التكرار أو الاستمرار؛ و«يلطمونه» موجزة وطبيعية ودقيقة.
theological_decisions:
- issue: نبرة تحية الجنود ليسوع
  choice: الإبقاء على صيغة التحية الملكية التي يظهر تهكمها من السياق
  alternative: إضافة وصف صريح مثل «قالوا ساخرين»
  rationale: السياق يبين الاستهزاء، أما إضافة «ساخرين» فستصرّح بما يفهم ضمنًا وليست جزءًا من ألفاظ النص اليوناني.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. استُخدم «السلام عليك» بوصفه المقابل الاصطلاحي للتحية، وحُفظت دلالة الأفعال الناقصة اليونانية بصيغة «كانوا...»، من دون إضافة تفسير صريح للسخرية.
