  text: ἐκεῖ οὖν διὰ τὴν παρασκευὴν τῶν Ἰουδαίων, ὅτι ἐγγὺς ἦν τὸ μνημεῖον, ἔθηκαν τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/042.yaml
  text: So there[a], because of the Jews’ day of preparation, since the tomb was nearby, they laid Jesus there.
translation:
  language: ar
  text: فوضعوا يسوع هناك، بسبب يوم استعداد اليهود[a]، إذ كان القبر قريبًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بسبب يوم الاستعداد اليهودي»، أو: «لأن هذا كان يوم استعداد اليهود».'
    reason: بدائل لفظية تحفظ إمكان فهم العبارة اليونانية كتعبير وصفي أو كتسمية تقويمية.
lexical_decisions:
- source_word: ἐκεῖ
  choice: هناك
  rationale: ظرف مكان يشير إلى موضع الدفن المذكور في السياق، و«هناك» هي الصياغة العربية الطبيعية المباشرة.
- source_word: οὖν
  choice: فـ
  rationale: الفاء تربط النتيجة بالسياق السابق وتحفظ قوة الاستنتاج أو الاستمرار السردي بإيجاز طبيعي.
- source_word: διὰ τὴν παρασκευὴν
  choice: بسبب يوم الاستعداد
  rationale: تفيد διά مع النصب السبب، ويمكن أن تكون παρασκευή تسمية لليوم الذي يسبق السبت أو العيد؛ وإضافة «يوم» توضح المعنى للقارئ المعاصر.
- source_word: τῶν Ἰουδαίων
  choice: اليهود
  rationale: تُحفظ علاقة الإضافة اليونانية في «يوم استعداد اليهود» من غير تحويلها إلى حكم عرقي أو ديني أوسع.
- source_word: ὅτι
  choice: إذ
  rationale: تقدّم سبب اختيار هذا القبر، و«إذ» تؤدي المعنى التعليلي بسلاسة في هذا السياق.
- source_word: ἐγγὺς
  choice: قريبًا
  rationale: تصف قرب موضع القبر، وهي الصياغة العربية المألوفة مع الفعل «كان».
- source_word: μνημεῖον
  choice: القبر
  rationale: المقصود موضع دفن، و«القبر» أوضح لفظ عربي معتاد في سياق دفن يسوع.
- source_word: ἔθηκαν
  choice: وضعوا
  rationale: يفيد الفعل وضع يسوع في القبر؛ و«وضعوا» يحفظ الدلالة المباشرة من غير إضافة لفظ «الجسد» غير الموجود في النص.
- source_word: τὸν Ἰησοῦν
  choice: يسوع
  rationale: نقل الاسم الشخصي بالصيغة العربية المعيارية في نص العهد الجديد.
theological_decisions:
- issue: دلالة παρασκευή في سياق الآلام
  choice: يوم الاستعداد
  alternative: الاستعداد
  rationale: قد يُستعمل اللفظ اليوناني تسميةً تقويمية ثابتة، لكن «يوم الاستعداد» يوضح المقصود للقارئ الحديث من غير تعيين مناسبة تقويمية أدق مما يقوله النص.
- issue: دلالة τῶν Ἰουδαίων في السرد اليوحناوي
  choice: يوم استعداد اليهود
  alternative: يوم الاستعداد اليهودي
  rationale: تحفظ صيغة الإضافة القريبة من اليونانية، وتشير في هذا الموضع إلى يوم الاستعداد بحسب سياقهم، لا إلى حكم لاهوتي على الشعب اليهودي.
translation_notes:
  register: 'عربية فصحى حديثة واضحة ووقورة. قُدّم الفعل ومتعلقه المكاني لتكوين جملة عربية طبيعية، مع إبقاء السببين: يوم الاستعداد وقرب القبر. وُضعت علامة الحاشية مباشرة بعد العبارة التي تشرحها.'
