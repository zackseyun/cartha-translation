  terminology: «تلميذ»، و«بيلاطس»، و«الرامة»، و«جسد يسوع» ألفاظ مناسبة. يُبقى «اليهود» في المتن وفاءً لـτῶν Ἰουδαίων، مع حاشية لا تحسم المرجع على نحو تفسيري.
