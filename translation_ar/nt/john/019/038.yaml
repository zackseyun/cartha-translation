  verdict: revise
  source_fidelity: 'المعنى العام وترتيب الأحداث مطابقان للنص اليوناني: طلب يوسف الإذن من بيلاطس، فأذن له، ثم جاء وأخذ جسد يسوع. وتُحفظ دلالة ἀπὸ في «الذي من الرامة»، كما يُمثَّل ضمير αὐτοῦ في «جسده». غير أن «أخفى ذلك» قد تُفهم فعلًا منجزًا واحدًا، بينما κεκρυμμένος تصف حالة مستمرة ناتجة من إخفاء تلمذته؛ لذا فـ«كان يخفي ذلك» أدق في العربية.'
