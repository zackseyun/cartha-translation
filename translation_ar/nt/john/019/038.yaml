source:
  edition: SBLGNT
  text: Μετὰ ⸀δὲ ταῦτα ἠρώτησεν τὸν Πιλᾶτον Ἰωσὴφ ⸀ἀπὸ Ἁριμαθαίας, ὢν μαθητὴς τοῦ Ἰησοῦ κεκρυμμένος δὲ διὰ τὸν φόβον τῶν Ἰουδαίων, ἵνα ἄρῃ τὸ σῶμα τοῦ Ἰησοῦ· καὶ ἐπέτρεψεν ὁ Πιλᾶτος. ἦλθεν οὖν καὶ ἦρεν τὸ σῶμα ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/038.yaml
  text: After these things[a], Joseph from Arimathea, being a disciple of Jesus but having kept it hidden because of fear of the Jews, asked Pilate that he might take away the body of Jesus. And Pilate gave permission. So he came and took away his body.
translation:
  language: ar
  text: وبعد هذه الأمور، طلب يوسف الذي من الرامة، وكان تلميذًا ليسوع لكنه كان يخفي ذلك خوفًا من اليهود[a]، من بيلاطس أن يأخذ جسد يسوع. فأذن له بيلاطس. فجاء وأخذ جسده.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، على نحو أخص بحسب السياق: «السلطات في اليهودية» أو «السلطات اليهودية». فكثيرًا ما يستعمل يوحنا عبارة «اليهود» مشيرًا إلى المعارضين ليسوع، لا إلى الشعب اليهودي كله بلا تمييز.'
    reason: بيان البديل الدلالي ومنع التعميم العرقي مع إبقاء لفظ الأصل في المتن.
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: وبعد هذه الأمور
  rationale: يحافظ على الانتقال الزمني وعلى جمع ταῦτα، بصياغة عربية واضحة وطبيعية.
- source_word: ἠρώτησεν
  choice: طلب ... من بيلاطس
  rationale: الفعل هنا يدل سياقيًا على تقديم طلب، والتركيب العربي «طلب من» أوضح من «سأل» في مقام استئذان الحاكم.
- source_word: ἀπὸ Ἁριμαθαίας
  choice: الذي من الرامة
  rationale: ينقل دلالة المنشأ في ἀπό، مع استعمال الاسم العربي الكتابي الشائع للموضع.
- source_word: ὢν μαθητὴς τοῦ Ἰησοῦ
  choice: وكان تلميذًا ليسوع
  rationale: ينقل معنى التركيب الحالي بعبارة عربية سلسة ويحافظ على المصطلح المألوف μαθητής «تلميذ».
- source_word: κεκρυμμένος
  choice: لكنه أخفى ذلك
  rationale: يجعل المتعلَّق المفهوم، أي كونه تلميذًا، ظاهرًا للقارئ، ويحافظ قدر الإمكان على أثر الحالة المستمرة الناتجة من الإخفاء.
- source_word: διὰ τὸν φόβον τῶν Ἰουδαίων
  choice: خوفًا من اليهود
  rationale: صياغة عربية موجزة وطبيعية تعبّر عن السببية وتحافظ على اللفظ الصريح Ἰουδαίων في المتن.
- source_word: ἵνα ἄρῃ τὸ σῶμα τοῦ Ἰησοῦ
  choice: أن يأخذ جسد يسوع
  rationale: ينقل غرض الطلب؛ و«يأخذ» مناسب هنا لرفع الجسد ونقله، كما يسمح بالاتساق مع ورود الفعل نفسه لاحقًا.
- source_word: ἐπέτρεψεν
  choice: فأذن له
  rationale: تعبير عربي مباشر وطبيعي لمعنى منح الإذن، والضمير يوضح المستفيد المفهوم من السياق.
- source_word: ἦλθεν οὖν καὶ ἦρεν τὸ σῶμα αὐτοῦ
  choice: فجاء وأخذ جسده
  rationale: الفاء تنقل التعاقب الناتج من الإذن، و«أخذ» يحافظ على الصلة بالفعل السابق، و«جسده» يمثّل αὐτοῦ.
theological_decisions:
- issue: مرجع τῶν Ἰουδαίων في إنجيل يوحنا
  choice: «اليهود» في المتن مع حاشية توضيحية
  alternative: «رؤساء اليهود» أو «سلطات اليهودية»
  rationale: النص اليوناني يذكر اللفظ العام «اليهود»، ولذلك يُحفظ في المتن دون تضييق تفسيري؛ لكن السياق اليوحناوي قد يقصد به خصوصًا السلطات اليهودية/اليهوداوية المعارضة ليسوع، فتوضح الحاشية ذلك منعًا لفهمه تعميمًا على الشعب اليهودي كله.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. اختيرت تراكيب طبيعية مثل «طلب ... من» و«فأذن له»، مع الحفاظ على ترتيب الحدث والتكرار الدلالي للفعل αἴρω. وُضعت علامة الحاشية مباشرة بعد «اليهود» لتحديد موضع الإشكال المعجمي.
