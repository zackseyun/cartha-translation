translation:
  language: ar
  text: فحينئذ أخذ بيلاطس يسوع وجلده[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بتصريح أوضح بأن التنفيذ كان بأمره: «فحينئذ أخذ بيلاطس يسوع وأمر بجلده».'
    reason: alternative_reading
lexical_decisions:
- source_word: Τότε οὖν
  choice: فحينئذ
  rationale: يجمع بين الدلالة الزمنية لـ Τότε وحركة الاستنتاج أو التقدّم السردي في οὖν بعبارة عربية طبيعية موجزة.
- source_word: ἔλαβεν
  choice: أخذ
  rationale: المعنى المباشر للفعل، ويحافظ على بنية النص من غير افتراض القبض بعنف أو إسناد الفعل صراحة إلى وكلاء.
- source_word: ὁ Πιλᾶτος
  choice: بيلاطس
  rationale: الصيغة العربية المألوفة للاسم، والسياق سبق أن عرّف بالشخص.
- source_word: τὸν Ἰησοῦν
  choice: يسوع
  rationale: الصيغة العربية المألوفة للاسم، وهو مفعول به للفعل أخذ.
- source_word: ἐμαστίγωσεν
  choice: جلده
  rationale: يعبّر «جلد» بوضوح في العربية المعاصرة عن الضرب بالسوط، ويحفظ شدة الفعل اليوناني.
theological_decisions:
- issue: هل جلد بيلاطس يسوع بنفسه أم أمر بجلده؟
  choice: 'إبقاء بيلاطس فاعلًا نحويًا للفعلين: «أخذ... وجلده».'
  alternative: «أخذ بيلاطس يسوع وأمر بجلده» أو «أخذ بيلاطس يسوع وجعله يُجلد».
  rationale: النص اليوناني يجعل بيلاطس فاعل الفعلين، لكنه لا يحسم هل نفّذ الجلد شخصيًا أم تم بأمره؛ لذا يحافظ المتن على هذا الإبهام الحقيقي، وتوضح الحاشية احتمال الوكالة.
translation_notes:
  register: لغة عربية فصحى واضحة وموجزة ذات نبرة سردية كريمة. استُعملت «فحينئذ» لنقل الترابط مع السياق والتتابع الزمني معًا، و«جلده» بدل تعبير أقدم أو أقل مباشرة.
