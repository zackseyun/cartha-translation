  text: ἦν δὲ παρασκευὴ τοῦ πάσχα, ὥρα ⸂ἦν ὡς⸃ ἕκτη. καὶ λέγει τοῖς Ἰουδαίοις· Ἴδε ὁ βασιλεὺς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/014.yaml
  text: It was the day of preparation of the Passover[a]; it was about the sixth hour. And he says to the Jews, “Behold[b], your king!”
translation:
  language: ar
  text: 'وكان يومُ الاستعداد للفصح، وكانت الساعة نحو السادسة[a]. ويقول لليهود[b]: «ها هو ملككم!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: قد تعادل، بالتوقيت الحديث، نحو الظهر، بحسب الطريقة التي تُحسب بها الساعات.
    reason: cultural_note
  - marker: b
    text: قد يُقصد بلفظ «اليهود» هنا، بحسب السياق، السلطات في اليهودية أو زعماء اليهود على وجه أخص.
    reason: alternative_reading
lexical_decisions:
- source_word: παρασκευὴ τοῦ πάσχα
  choice: يومُ الاستعداد للفصح
  rationale: ينقل الاستعمال الزمني لكلمة παρασκευή بوصفه يوم الاستعداد، ويعبّر عن المضاف إليه τοῦ πάσχα بعلاقة طبيعية في العربية من غير حسمٍ زائد لطبيعة هذا الاستعداد.
- source_word: ὥρα ἦν ὡς ἕκτη
  choice: كانت الساعة نحو السادسة
  rationale: يحافظ على طريقة عدّ الساعات في ثقافة النص وعلى دلالة التقريب في ὡς، بدل تحويلها في المتن إلى توقيت حديث قد يتوقف على طريقة الحساب.
- source_word: λέγει
  choice: ويقول
  rationale: يحافظ على المضارع التاريخي الذي يستعمله يوحنا لإضفاء الحيوية على السرد.
- source_word: τοῖς Ἰουδαίοις
  choice: لليهود
  rationale: ترجمة مباشرة للفظ اليوناني، مع إبقاء احتمال أن يكون المقصود في السياق فئة أضيق في الحاشية.
- source_word: Ἴδε
  choice: ها هو
  rationale: صيغة عربية طبيعية ذات قوة إشارية وعلنية، وتناسب تقديم بيلاطس ليسوع أمام الحاضرين.
- source_word: ὁ βασιλεὺς ὑμῶν
  choice: ملككم
  rationale: تحافظ على ضمير المخاطبين وعلى النبرة السياسية والتهكمية المحتملة في العبارة.
theological_decisions:
- issue: مدلول «اليهود» في إنجيل يوحنا
  choice: إبقاء «اليهود» في المتن
  alternative: زعماء اليهود أو السلطات اليهودية في اليهودية
  rationale: النص اليوناني لا يضيّق المرجع صراحة في هذه الآية؛ لذلك تُحفظ العبارة العامة في المتن، ويُذكر الاحتمال السياقي الأضيق في الحاشية.
- issue: تحديد «الساعة السادسة» بالتوقيت الحديث
  choice: إبقاء تعبير الساعات القديم في المتن
  alternative: نحو الظهر
  rationale: يحفظ ذلك صيغة النص ودلالة التقريب، ولا يحسم الخلاف المتعلق بطريقة عدّ الساعات؛ ويُعرض المقابل الحديث المحتمل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدم «يوم الاستعداد» لتوضيح الدلالة الزمنية، وحُفظ المضارع التاريخي في «ويقول». وُضعت علامتا الحاشيتين عند العبارتين اللتين تشرحانهما مباشرة.
