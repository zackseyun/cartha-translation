lexical_decisions:
- source_word: ἀπεκρίθη
  choice: أجاب
  rationale: فعل ماضٍ من ἀποκρίνομαι، ومعناه المعتاد في سياق الحوار «أجاب»؛ وهو تعبير عربي طبيعي وواضح.
- source_word: ὁ Πιλᾶτος
  choice: بيلاطس
  rationale: اسم علم مسبوق بأداة التعريف وفق الأسلوب السردي اليوناني؛ لا تُنقل الأداة إلى العربية هنا.
- source_word: Ὃ
  choice: ما
  rationale: اسم موصول محايد مفرد مستعمل استعمالًا اسميًا؛ تقابله «ما» الموصولة في العربية بصورة طبيعية وموجزة.
- source_word: γέγραφα
  choice: قد كتبتُ
  rationale: فعل تام يدل على كتابة أُنجزت وبقي أثرها قائمًا. تساعد «قد» مع الماضي على إبراز تحقق الفعل، وتكرار العبارة يحفظ توكيد الأصل وحسمه.
theological_decisions:
- issue: دلالة تكرار صيغة التام γέγραφα γέγραφα
  choice: «ما قد كتبتُ، فقد كتبتُ»
  alternative: «ما كتبتُه قد كتبتُه» أو «ما كتبتُ، كتبتُ»
  rationale: تحفظ الصياغة تكرار الفعل وتوحي بأن الكتابة أمر منجز ثابت، بما يلائم رفض بيلاطس تغيير العبارة، من غير إضافة تفسير عقائدي إلى النص.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة ومهيبة. استُخدمت «قد» للمساعدة على نقل دلالة الصيغة اليونانية التامة، مع إبقاء التكرار البلاغي. وُضعت علامة الحاشية بعد الاقتباس لأنها تشرح العبارة كلها.
