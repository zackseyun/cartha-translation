base_translation:
  language: en
  yaml_path: translation/nt/john/019/028.yaml
  text: After this[a], Jesus, knowing that all things had already been completed, in order that the Scripture might be fulfilled, said, “I thirst.”
translation:
  language: ar
  text: 'بعد هذا، قال يسوع، وهو يعلم أن كل شيء قد تم بالفعل، لكي يتم الكتاب المقدس: «أنا عطشان».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ τοῦτο
  choice: بعد هذا
  rationale: تعبير زمني طبيعي يحفظ اسم الإشارة المفرد في اليونانية ويناسب السرد اليوحناوي.
- source_word: εἰδὼς
  choice: كان يسوع يعلم
  rationale: ينقل اسم الفاعل الظرفي بصياغة عربية طبيعية، مع إبقاء العلم معاصرًا لسياق الفعل.
- source_word: ἤδη πάντα τετέλεσται
  choice: أن كل شيء قد تمَّ
  rationale: «كل شيء» تنقل πάντα بوضوح، و«قد تمَّ» تعكس حالة الاكتمال التي تدل عليها صيغة التام؛ ولم تُذكر «بالفعل» لأن «قد» والسياق يؤديان المعنى دون إثقال.
- source_word: ἵνα τελειωθῇ
  choice: لكي يتمَّ
  rationale: يحفظ غرض/نتيجة ἵνα، كما يبقي الصلة اللفظية بين τετέλεσται وτελειωθῇ أوضح من استعمال لفظ مختلف مثل «يتحقق».
- source_word: ἡ γραφή
  choice: الكتاب
  rationale: استعمال عربي كتابي مألوف للدلالة على النص المقدس، وهو المقصود بـ γραφή في هذا السياق.
- source_word: λέγει
  choice: فقال
  rationale: صيغ المضارع التاريخي اليوناني بالماضي العربي الطبيعي في السرد، والفاء تربط القول بما سبقه.
- source_word: Διψῶ
  choice: أنا عطشان
  rationale: عبارة عربية معاصرة مباشرة تنقل المضارع وحالة العطش بوضوح؛ ويُذكر البديل التقليدي الأكثر إيجازًا في الحاشية.
theological_decisions:
- issue: العلاقة بين علم يسوع، وتمام كل شيء، وإتمام الكتاب
  choice: يقرر النص أن يسوع كان يعلم أن كل شيء قد تم، ثم قال ما قال لكي يتم الكتاب.
  alternative: يمكن فهم ἵνα على أنه يصف النتيجة، أي إن قوله أفضى إلى إتمام الكتاب، من غير تقرير منظومة لاهوتية أوسع.
  rationale: تحفظ الصياغة ترتيب الجملة اليونانية وتوترها اللاهوتي، ولا تضيف تفسيرًا عن سبق العلم أو التعيين، كما تُبقي الصلة بين فعلي التمام.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «أنا عطشان» بوصفه تعبيرًا طبيعيًا مفهومًا، مع حفظ الصياغة التقليدية في الحاشية. وُضع مؤشر الحاشية بعد الاقتباس الذي تتعلق به.
