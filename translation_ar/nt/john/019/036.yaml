  yaml_path: translation/nt/john/019/036.yaml
  text: 'For these things happened so that the Scripture might be fulfilled: “Not one of his bones will be broken.”[a]'
translation:
  language: ar
  text: 'لأن هذه الأمور حدثت لكي يتمّ ما جاء في الكتاب المقدس: «لن يُكسَر له عظمٌ».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγένετο
  choice: حدثت
  rationale: ينقل الفعل الحدثي بصياغة عربية معاصرة وطبيعية، ويوافق الفاعل الجمع غير العاقل بالتأنيث المفرد.
- source_word: γὰρ
  choice: لأن
  rationale: يحفظ الوظيفة التفسيرية التي تربط الآية بما سبقها.
- source_word: ταῦτα
  choice: هذه الأمور
  rationale: يحيل بوضوح إلى الوقائع السابقة مع المحافظة على جمع اسم الإشارة اليوناني.
- source_word: ἵνα
  choice: لكي
  rationale: يحفظ دلالة الغاية، مع بقاء إمكان تداخل الغاية والنتيجة في سياق الإتمام.
- source_word: ἡ γραφή
  choice: ما جاء في الكتاب
  rationale: صياغة عربية طبيعية تشير إلى النص المقدس المقصود دون أن تجعل لفظ «الكتابة» غامضًا.
- source_word: πληρωθῇ
  choice: يتمّ
  rationale: يحفظ معنى بلوغ النص الكتابي تمامه وتحققه في الحدث، وهو تعبير عربي مألوف في سياق النبوءة والكتاب.
- source_word: Ὀστοῦν
  choice: عظمٌ
  rationale: يحافظ في متن الاقتباس على المفرد اليوناني ونكرته، مع استكمال المعنى العربي بعبارة «من عظامه».
- source_word: οὐ συντριβήσεται
  choice: لن يُكسَر
  rationale: ينقل المستقبل المنفي والمبني للمجهول، و«يُكسَر» هو الأنسب سياقيًا للعظم من «يُسحَق» أو «يُهشَّم».
- source_word: αὐτοῦ
  choice: من عظامه
  rationale: يعبّر عن ضمير الملكية بصياغة عربية اصطلاحية توضح القوة التوزيعية للمفرد في الاقتباس.
theological_decisions:
- issue: صياغة الاقتباس الكتابي المفرد مع الحفاظ على إحالاته المحتملة إلى الخروج 12:46 والعدد 9:12 والمزمور 34:20
  choice: لن يُكسَر عظمٌ من عظامه
  alternative: لن يُكسَر له عظمٌ
  rationale: 'الصياغة المختارة عربية طبيعية، وتحافظ على لفظ «عظم» مفردًا وعلى المعنى التوزيعي: لا عظم واحدًا من عظامه يُكسَر. وهي لا تحسم أي إحالة كتابية بعينها ولا تضيف تفسيرًا عقائديًا.'
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «ما جاء في الكتاب» لتجنب غرابة «الكتابة» مع إبقاء المرجع إلى النص المقدس، وحُفظت بنية التعليل والغاية دون لغة مذهبية.
