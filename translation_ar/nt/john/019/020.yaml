base_translation:
  language: en
  yaml_path: translation/nt/john/019/020.yaml
  text: Therefore many of the Jews read this inscription[a], because the place where Jesus was crucified was near the city; and it was written in Hebrew, in Latin, and in Greek.
translation:
  language: ar
  text: فقرأ كثيرون من اليهود هذه اللافتة، لأن المكان الذي صُلب فيه يسوع كان قريبًا من المدينة؛ وكانت مكتوبة بالعبرية[a] واللاتينية واليونانية.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو ربما: «بالآرامية»؛ إذ يستعمل يوحنا لفظ «العبرية» للدلالة على اللغة السامية المحلية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίτλον
  choice: اللافتة
  rationale: في سياق الصلب تدل الكلمة على نصٍّ مكتوب عُلِّق للتعريف بالتهمة؛ و«اللافتة» تعبير عربي طبيعي ودقيق.
- source_word: πολλοὶ ... τῶν Ἰουδαίων
  choice: كثيرون من اليهود
  rationale: يحفظ هذا التعبير معنى التبعيض في التركيب اليوناني، فلا يعمّم الحكم على جميع اليهود.
- source_word: ἀνέγνωσαν
  choice: قرأ
  rationale: ينقل فعل القراءة ببساطة، من غير إضافة معنى الجهر الذي لا يصرّح به النص.
- source_word: οὖν
  choice: فـ
  rationale: الفاء تربط النتيجة أو استمرار السرد بما سبق ربطًا طبيعيًا في العربية، من غير تثقيل الأسلوب بـ«لذلك».
- source_word: ἐγγὺς ἦν ὁ τόπος τῆς πόλεως
  choice: كان المكان ... قريبًا من المدينة
  rationale: ينقل المعنى المباشر من غير إضافة ذكر بوابة أو تفصيل مكاني غير موجود في اليونانية.
- source_word: ὅπου ἐσταυρώθη ὁ Ἰησοῦς
  choice: الذي صُلب فيه يسوع
  rationale: يحافظ على المبني للمجهول في الأصل من غير تعيين الفاعلين.
- source_word: ἦν γεγραμμένον
  choice: كانت مكتوبة
  rationale: 'ينقل التركيب الدال على الحالة الناتجة: كانت اللافتة قائمة في صورة مكتوبة.'
- source_word: Ἑβραϊστί
  choice: بالعبرية
  rationale: يحافظ المتن على اللفظ اليوناني، مع بيان احتمال الإشارة إلى الآرامية في الحاشية.
- source_word: Ῥωμαϊστί
  choice: باللاتينية
  rationale: هذا هو المقصود الاصطلاحي من «بالرومانية» في سياق أسماء اللغات.
- source_word: Ἑλληνιστί
  choice: باليونانية
  rationale: ترجمة مباشرة وواضحة لاسم اللغة.
theological_decisions:
- issue: دلالة Ἑβραϊστί في الاستعمال اليوحناوي
  choice: بالعبرية في المتن
  alternative: بالآرامية
  rationale: النص اليوناني يقول حرفيًا «بالعبرية»، لذلك يُحفظ هذا في المتن؛ لكن اللفظ قد يُستعمل للغة السامية المحلية، أي الآرامية، فيُذكر الاحتمال في الحاشية من غير حسم صامت.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُعملت «اللافتة» بدل «العنوان» لأن المقصود إعلان مكتوب معلّق، وحُفظ ترتيب اللغات الوارد في النص اليوناني.
