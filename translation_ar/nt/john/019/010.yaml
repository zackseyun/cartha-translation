source:
  edition: SBLGNT
  text: λέγει οὖν αὐτῷ ὁ Πιλᾶτος· Ἐμοὶ οὐ λαλεῖς; οὐκ οἶδας ὅτι ἐξουσίαν ἔχω ⸂ἀπολῦσαί σε καὶ ἐξουσίαν ἔχω σταυρῶσαί⸃ σε;
base_translation:
  language: en
  yaml_path: translation/nt/john/019/010.yaml
  text: So Pilate said to him[a], “Will you not speak to me? Do you not know that I have authority to release you and authority to crucify you?”
translation:
  language: ar
  text: 'فقال له بيلاطس: «ألا تكلّمني؟ أما تعلم أن لي سلطانًا[a] أن أطلقك، ولي سلطان أن أصلبك؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «صلاحية» أو «قدرة»؛ فاللفظة اليونانية قد تدل على السلطان أو الحق أو القدرة. ولفظ «سلطان» أنسب هنا لأن بيلاطس يتحدث في سياق الحكم والقضاء.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει οὖν αὐτῷ ὁ Πιλᾶτος
  choice: فقال له بيلاطس
  rationale: تؤدي الفاء وظيفة οὖν في دفع السرد إلى الأمام مع الإبقاء على ضمير المفعول غير المباشر.
- source_word: Ἐμοὶ οὐ λαλεῖς
  choice: ألا تكلّمني؟
  rationale: صياغة عربية طبيعية تحفظ الاستفهام الإنكاري ونبرة استنكار بيلاطس، ويبرز ضمير المتكلم المتصل أن اعتراضه منصبّ على امتناع يسوع عن مخاطبته هو.
- source_word: οὐκ οἶδας ὅτι
  choice: أما تعلم أن
  rationale: ينقل معنى العلم وصيغة السؤال التوبيخي بعبارة عربية واضحة وفصيحة.
- source_word: ἐξουσίαν ἔχω
  choice: لي سلطان
  rationale: السلطان يلائم معنى الصلاحية أو السلطة الحاكمة في السياق القضائي، ولا يقتصر على القدرة المادية.
- source_word: ἀπολῦσαί σε
  choice: أن أطلقك
  rationale: الفعل «أطلق» طبيعي في سياق إطلاق سراح محتجز، من غير أن يضيف معنى التبرئة القضائية.
- source_word: καὶ ἐξουσίαν ἔχω σταυρῶσαί σε
  choice: ولي سلطان أن أصلبك
  rationale: حُفظ تكرار العبارة اليونانية للتوكيد والمقابلة بين الإطلاق والصلب، ونُقل فعل الصلب بصورته المباشرة.
theological_decisions:
- issue: طبيعة السلطان الذي يدّعيه بيلاطس
  choice: نقل ἐξουσία بلفظ «سلطان» من غير إقرار بشرعية ادعائه أو استقلال هذا السلطان.
  alternative: قدرة؛ صلاحية
  rationale: الآية تورد قول بيلاطس، ولا تصادق عليه لاهوتيًا؛ ويحفظ هذا الاختيار التوتر الذي يجيب عنه يسوع في الآية التالية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كريمة. استُخدمت «ألا» و«أما» لنقل الاستفهامين الإنكاريين طبيعيًا، وحُفظ التكرار البلاغي في ادعاء بيلاطس.
