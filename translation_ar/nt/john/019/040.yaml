  yaml_path: translation/nt/john/019/040.yaml
  text: So they took Jesus’s body and wrapped it in linen cloths with the spices[a], as is the burial custom of the Jews.
translation:
  language: ar
  text: فأخذوا جسد يسوع ولفّوه بلفائف من الكتّان مع الأطياب، كما جرت عادة اليهود[a] في الدفن.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمتها: «أهل اليهودية»، إذا فُهم اللفظ جغرافيًّا لا دينيًّا أو قوميًّا؛ لكن السياق هنا يرجّح الإشارة إلى عادة الدفن عند اليهود عمومًا.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλαβον
  choice: أخذوا
  rationale: يفيد الفعل هنا أخذ الجسد فعليًّا لتجهيزه للدفن، وهو التعبير العربي الطبيعي المباشر.
- source_word: οὖν
  choice: فـ
  rationale: تربط الفاء الحدث بما قبله وتؤدي وظيفة الاستنتاج أو التعاقب السردي بإيجاز طبيعي.
- source_word: σῶμα
  choice: جسد
  rationale: ينقل معنى الجسد دون استعمال لفظ أشد مثل «الجثة»، وهو أنسب لسياق الرواية الموقر.
- source_word: ἔδησαν
  choice: لفّوه
  rationale: المعنى الحرفي هو ربطوه أو شدّوه، لكن مع لفائف الكتان وفي سياق تجهيز الميت يكون «لفّوه» عربيًّا طبيعيًّا ويعبّر عن هيئة الربط دون مبالغة.
- source_word: ὀθονίοις
  choice: بلفائف من الكتّان
  rationale: يشير اللفظ إلى قطع أو لفائف كتانية استُعملت في الدفن؛ والصياغة تحافظ على المادة وتوضح تعدد القطع.
- source_word: ἀρώματα
  choice: الأطياب
  rationale: يدل اللفظ على مواد عطرية استُعملت في تجهيز الموتى، و«الأطياب» أوضح وأدق سياقيًّا من «التوابل».
- source_word: καθὼς
  choice: كما
  rationale: تفيد مطابقة الفعل للعادة المعروفة بصياغة عربية سلسة.
- source_word: ἔθος ἐστὶν
  choice: جرت عادة
  rationale: تعبير عربي فصيح وطبيعي يدل على العرف المستقر.
- source_word: τοῖς Ἰουδαίοις
  choice: اليهود
  rationale: السياق يتحدث عن ممارسة دفن دينية وثقافية عامة، لا عن سكان اليهودية جغرافيًّا على وجه الخصوص.
- source_word: ἐνταφιάζειν
  choice: في تجهيز موتاهم للدفن
  rationale: الفعل قد يشمل إعداد الميت للدفن لا مجرد مواراته؛ وهذه الصياغة تلائم الأفعال الموصوفة في الآية وتحافظ على هذا الاتساع الدلالي.
theological_decisions:
- issue: دلالة τοῖς Ἰουδαίοις
  choice: اليهود
  alternative: أهل اليهودية
  rationale: المقصود هنا عادة الدفن لدى الجماعة اليهودية عمومًا، ولذلك ترجَّح الدلالة الدينية والثقافية على الدلالة الجغرافية.
- issue: مدى دلالة ἐνταφιάζειν
  choice: تجهيز موتاهم للدفن
  alternative: دفن موتاهم
  rationale: السياق المباشر يصف لف الجسد بالأطياب قبل الإيداع في القبر، فيناسبه معنى التجهيز الجنائزي، مع بقاء الغاية وهي الدفن ظاهرة.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. استُخدمت «لفائف من الكتّان» لتجنب الغموض، و«الأطياب» للمواد العطرية الجنائزية، مع صياغة طبيعية تحفظ معنى الإعداد للدفن.
