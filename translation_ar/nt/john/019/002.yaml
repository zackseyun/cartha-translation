  text: And the soldiers, after weaving a crown out of thorns, put it on his head and clothed him in a purple robe,
translation:
  language: ar
  text: والجنود، بعدما ضفروا إكليلًا من الشوك، وضعوه على رأسه، وألبسوه ثوبًا أرجوانيًّا،
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στρατιῶται
  choice: الجنود
  rationale: المقابل العربي المعياري والطبيعي لأفراد القوة العسكرية الرومانية في هذا السياق.
- source_word: πλέξαντες
  choice: بعدما ضفروا
  rationale: ينقل فعل التضفير أو الجدل، ويُظهر أن صنع الإكليل سبق وضعه على الرأس، كما تفيد صيغة اسم الفاعل الماضي في اليونانية.
- source_word: στέφανον
  choice: إكليلًا
  rationale: يناسب غرض الإكليل وصورته الملكية الساخرة في السياق، من غير إضافة تفسيرية.
- source_word: ἐξ ἀκανθῶν
  choice: من الشوك
  rationale: تعبير عربي طبيعي يبين المادة التي صُنع منها الإكليل ويحافظ على الصورة الحسية.
- source_word: ἐπέθηκαν αὐτοῦ τῇ κεφαλῇ
  choice: وضعوه على رأسه
  rationale: صياغة عربية واضحة وأمينة للبنية اليونانية، مع إظهار ضمير المفعول الذي يعود إلى الإكليل.
- source_word: ἱμάτιον
  choice: ثوبًا
  rationale: يحافظ على المعنى العام للكساء أو اللباس من غير تضييقه إلى نوع محدد كالرداء أو العباءة.
- source_word: πορφυροῦν
  choice: أرجوانيًّا
  rationale: المقابل العربي المباشر للون الأرجواني وما يحمله في السياق من إيحاء ملكي من غير شرح زائد.
- source_word: περιέβαλον αὐτόν
  choice: ألبسوه
  rationale: تعبير عربي طبيعي لفعل إحاطة الشخص بالثوب أو إلباسه إياه، ويحفظ الفعل السردي دون خشونة حرفية.
theological_decisions:
- issue: الصورة الملكية الساخرة في تصرف الجنود
  choice: نقل ألفاظ الإكليل والثوب الأرجواني كما وردت، من غير التصريح بأن الجنود كانوا يسخرون منه.
  alternative: 'إضافة عبارة تفسيرية مثل: «سخريةً من مُلكه».'
  rationale: السخرية ظاهرة من السياق والأفعال نفسها، لكنها ليست مصرحًا بها لفظًا في هذه الآية؛ لذلك لا تُضاف إلى المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ تتابع الأفعال في الأصل، واستُعمل «ثوب» لعدم الإفراط في تخصيص معنى ἱμάτιον.
