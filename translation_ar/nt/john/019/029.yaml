base_translation:
  language: en
  yaml_path: translation/nt/john/019/029.yaml
  text: A container full of sour wine was lying there[b][a]; so they put a sponge full of the sour wine on hyssop and brought it to his mouth.
translation:
  language: ar
  text: وكان هناك إناءٌ مملوءٌ بالخمر الحامضة[a]؛ فوضعوا إسفنجةً مملوءةً بالخمر الحامضة على زوفا[b]، وقرّبوها إلى فمه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الخل». قد تدل الكلمة اليونانية على الخمر الحامضة أو الخل؛ ويُرجَّح هنا أنها تشير إلى شراب حامض كان متاحًا للجنود.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «على غصن زوفا»، أو «بزوفا». يقول اليوناني ببساطة «على/بزوفا»، والصورة الدقيقة موضع خلاف.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σκεῦος
  choice: إناء
  rationale: لفظ عربي عام وطبيعي يدل على الوعاء من غير تحديد نوعه بما لا يصرّح به اليوناني.
- source_word: ἔκειτο
  choice: كان هناك
  rationale: ينقل الوظيفة الوصفية للفعل في تمهيد المشهد، ويتجنب التعبير العربي غير الطبيعي «كان ملقى» للإناء.
- source_word: ὄξους
  choice: الخمر الحامضة
  rationale: يناسب الشراب الرخيص الحامض المعروف في هذا السياق، مع إثبات احتمال معنى الخل في الحاشية.
- source_word: μεστόν / μεστὸν
  choice: مملوء / ملأوا إسفنجة
  rationale: يحافظ على معنى الامتلاء، مع صياغة عربية سلسة عند ذكر الإسفنجة.
- source_word: σπόγγον
  choice: إسفنجة
  rationale: المقابل العربي المباشر والواضح.
- source_word: οὖν
  choice: فـ
  rationale: الفاء تؤدي في السرد معنى التعقيب أو النتيجة بإيجاز وطبيعية.
- source_word: ὑσσώπῳ
  choice: على زوفا
  rationale: يبقي الداتيف اليوناني على غموضه بين معنى التثبيت على الزوفا والاستعانة بها، ولا يضيف «غصنًا» غير مذكور صراحة.
- source_word: περιθέντες
  choice: ووضعوها
  rationale: ينقل الفعل السابق للفعل الرئيس بصياغة سردية عربية طبيعية، والضمير يعود إلى الإسفنجة.
- source_word: προσήνεγκαν
  choice: وقرّبوها
  rationale: يعبّر بوضوح عن حمل الإسفنجة نحو الفم، من غير إضافة معنى السقي أو التقديم الطقسي.
- source_word: αὐτοῦ τῷ στόματι
  choice: إلى فمه
  rationale: صياغة عربية مباشرة للبنية الدالة على اتجاه الشيء إلى فمه.
theological_decisions:
- issue: الإيحاء التاريخي والطقسي للفظ ὑσσώπῳ
  choice: إبقاء «زوفا» في المتن من غير شرح رمزي
  alternative: ترجمتها تفسيرياً «غصن زوفا» أو استبدالها بما يفيد ساقاً أو قصبة
  rationale: قد تستدعي الزوفا دلالات الفصح والتطهير، لكن الآية لا تصرّح بهذه الدلالة. إبقاء اللفظ يحفظ الصدى المحتمل ولا يفرض تفسيراً لاهوتياً.
- issue: الصورة الدقيقة لاستعمال الزوفا
  choice: «على زوفا» مع بيان البدائل في الحاشية
  alternative: «على غصن زوفا» أو «بزوفا»
  rationale: الداتيف اليوناني يحتمل معنى الأداة أو ما ثُبّتت عليه الإسفنجة، لذلك تُحفظ المسألة بلا حسم زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدم «إناء» بدل ألفاظ أكثر تخصيصاً، و«الخمر الحامضة» مع حاشية «الخل». وُضع كل مؤشر حاشية في المتن، مع ترتيب المؤشرين بحسب موضع اللفظين في النص العربي.
