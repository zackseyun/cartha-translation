  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «الموضع» اتساقًا مع τόπος، ووُضعت أسماء المكان بين علامتي تنصيص لتمييزها. جاءت علامة الحاشية بعد الجملة المتعلقة بتحديد اللغة.
