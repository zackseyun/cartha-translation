lexical_decisions:
- source_word: βαστάζων
  choice: حمل
  rationale: يفيد الفعل حمل شيء مادي، وصيغة الماضي مع العطف طبيعية في العربية لسرد الحدث الذي تعبّر عنه الجملة اليونانية بالمشاركة الظرفية.
- source_word: αὑτῷ τὸν σταυρόν
  choice: الصليب بنفسه
  rationale: يحافظ هذا التعبير على قوة ضمير الانعكاس في القراءة المعتمدة، أي إنه تولّى حمل الصليب بنفسه، من غير تحويل العبارة إلى ملكية صريحة مثل «صليبه».
- source_word: σταυρός
  choice: الصليب
  rationale: المقابل العربي المألوف والدقيق في سياق الآلام؛ أما «عارضة الصليب» فأضيق مما يقتضيه اللفظ اليوناني هنا.
- source_word: ἐξῆλθεν
  choice: خرج
  rationale: ترجمة مباشرة وطبيعية للفعل الدال على الخروج.
- source_word: τὸν λεγόμενον Κρανίου Τόπον
  choice: الموضع المسمّى «موضع الجمجمة»
  rationale: يحفظ صيغة التسمية ومعنى كلمتي «موضع» و«جمجمة»، مع تركيب عربي واضح يصلح اسمًا للمكان.
- source_word: Ἑβραϊστί
  choice: بالعبرية
  rationale: ينقل الدلالة الصريحة للفظ اليوناني، مع إبقاء احتمال الإشارة إلى الآرامية في الحاشية.
- source_word: Γολγοθα
  choice: جلجثة
  rationale: نقل صوتي عربي راسخ لاسم المكان السامي.
theological_decisions:
- issue: تحديد اللغة المشار إليها بلفظ Ἑβραϊστί
  choice: بالعبرية
  alternative: بالآرامية
  rationale: النص اليوناني يصرّح بـ«العبرية»، فلا يُستبدل بها تفسير تاريخي محتمل؛ لكن استعمال يوحنا قد يشمل اللغة السامية المحلية في اليهودية، ولذلك يُذكر احتمال الآرامية في الحاشية.
- issue: قوة ضمير الانعكاس في αὑτῷ τὸν σταυρόν
  choice: الصليب بنفسه
  alternative: صليبه
  rationale: الصياغة المختارة تُبرز أن يسوع حمل الصليب بنفسه، وتحجم عن جعل الضمير دالًا على الملكية وحدها، محافظةً على بنية القراءة اليونانية المعتمدة.
