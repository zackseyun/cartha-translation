base_translation:
  language: en
  yaml_path: translation/nt/john/019/005.yaml
  text: So Jesus came out[a], wearing the crown of thorns and the purple robe. And he says to them, “Behold, the man.”
translation:
  language: ar
  text: 'فخرج يسوع إلى الخارج، لابسًا إكليل الشوك والثوب الأرجواني. ويقول لهم: «ها هو الرجل»[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «انظروا، هذا هو الرجل». اللفظة اليونانية Ἰδοὺ أداة للتنبيه والإشارة، ويمكن ترجمتها أيضًا بـ«انظروا» أو «ها هو».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν … ἔξω
  choice: خرج … إلى الخارج
  rationale: ينقل الفعل وحال المكان المؤكِّدة في اليونانية، مع إبقاء حركة يسوع إلى خارج مقرّ الولاية واضحة.
- source_word: οὖν
  choice: إذًا
  rationale: تربط خروج يسوع بما سبقه بوصفه نتيجة واستمرارًا للسرد، من غير مبالغة في الدلالة السببية.
- source_word: φορῶν
  choice: لابسًا
  rationale: تعبير عربي طبيعي ودقيق عن ارتداء الإكليل والثوب في أثناء خروجه.
- source_word: ἀκάνθινον στέφανον
  choice: إكليل الشوك
  rationale: يدل على إكليل مصنوع من الشوك، ويحافظ على التعبير العربي المألوف والدقيق.
- source_word: πορφυροῦν ἱμάτιον
  choice: الثوب الأرجواني
  rationale: كلمة «الثوب» لا تحدد هيئة اللباس الخارجي بأكثر مما يسمح به النص، و«الأرجواني» ينقل اللون والسياق الملكي التهكمي.
- source_word: λέγει
  choice: ويقول
  rationale: يحافظ المضارع على المضارع التاريخي في السرد اليوحناوي وعلى حيوية المشهد.
- source_word: Ἰδοὺ
  choice: ها هو
  rationale: أداة تنبيه وإشارة طبيعية في العربية، وتناسب عرض بيلاطس ليسوع أمام الحاضرين.
- source_word: ὁ ἄνθρωπος
  choice: الإنسان
  rationale: ينقل الاسم المفرد المعرّف مباشرة، فيشير إلى يسوع المعروض أمام الجمع مع إبقاء ما قد تحمله العبارة من صدى إنساني أوسع دون فرض تفسيره.
theological_decisions:
- issue: دلالة ὁ ἄνθρωπος في إعلان بيلاطس
  choice: الإنسان
  alternative: الرجل
  rationale: «الإنسان» يصح أن يدل هنا على الشخص المحدد، يسوع، ويحافظ في الوقت نفسه على التوتر الممكن بين الإشارة المباشرة إليه وأي صدى تمثيلي أوسع؛ أما «الرجل» فيحصر العبارة في الإشارة الفردية بدرجة أكبر.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم المضارع «ويقول» للمحافظة على حيوية المضارع التاريخي، وأُبقي التكرار الدلالي في «خرج … إلى الخارج» لأنه ظاهر في الأصل اليوناني.
