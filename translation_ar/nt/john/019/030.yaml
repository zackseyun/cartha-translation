source:
  edition: SBLGNT
  text: ὅτε οὖν ἔλαβεν τὸ ὄξος ὁ Ἰησοῦς εἶπεν· Τετέλεσται, καὶ κλίνας τὴν κεφαλὴν παρέδωκεν τὸ πνεῦμα.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/030.yaml
  text: So when Jesus had received the sour wine[a], he said, “It is finished,” and bowing his head[c][b], he gave up his spirit.
translation:
  language: ar
  text: 'فلمّا تناول يسوع الخمر الحامضة[a]، قال: «قد تمّ[b]». ثم أحنى رأسه وأسلم روحه[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الخلّ» أو «خلّ الخمر». تشير الكلمة اليونانية إلى خمر حامضة.
    reason: lexical_alternative
  - marker: b
    text: أو «قد أُنجز» أو «قد اكتمل».
    reason: lexical_alternative
  - marker: c
    text: 'أو «لفظ أنفاسه الأخيرة». واليونانية تقول حرفيًا على نحو أقرب: «أسلم الروح».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτε οὖν
  choice: فلمّا
  rationale: تجمع «فـ» بين استئناف مسار السرد وإفادة النتيجة في οὖν، وتؤدي «لمّا» معنى ὅτε الزمني بعبارة عربية طبيعية.
- source_word: ἔλαβεν
  choice: تناول
  rationale: الفعل λαμβάνω يحتمل الأخذ أو التلقي؛ و«تناول» ملائم سياقيًا لما قُدّم إلى يسوع على الإسفنجة، من غير أن يحدد مقدار ما شربه.
- source_word: τὸ ὄξος
  choice: الخمر الحامضة
  rationale: يدل ὄξος على خمر حامضة أو خلّ خمر؛ وهذه الصياغة واضحة للقارئ المعاصر وتحافظ على طبيعة الشراب.
- source_word: Τετέλεσται
  choice: قد تمّ
  rationale: تنقل «قد» مع الماضي معنى اكتمال الفعل وقيام نتيجته في صيغة التام اليونانية، وتبقي المسند إليه غير مصرّح به كما في الأصل.
- source_word: κλίνας τὴν κεφαλήν
  choice: أحنى رأسه
  rationale: صياغة عربية طبيعية تنقل حركة إمالة الرأس السابقة للفعل الرئيس، مع الحفاظ على ترتيب الحدثين.
- source_word: παρέδωκεν τὸ πνεῦμα
  choice: أسلم روحه
  rationale: تحافظ العبارة على صورة تسليم الروح في اليونانية وعلى ما فيها من قصد ووقار، بدل اختزالها إلى مجرد «مات».
theological_decisions:
- issue: هل تُفهم عبارة παρέδωκεν τὸ πνεῦμα مجرد تعبير اصطلاحي عن الموت أم تُحفظ صورتها الشخصية والروحية؟
  choice: أسلم روحه
  alternative: لفظ أنفاسه الأخيرة / مات
  rationale: يحفظ الاختيار خصوصية العبارة اليونانية وإيحاء الفعل الإرادي في سياق يوحنا، من غير إضافة تفسير عقائدي يتجاوز النص.
- issue: تحديد الشيء الذي تمّ في Τετέλεσται
  choice: قد تمّ
  alternative: قد أُنجز كل شيء
  rationale: الأصل لا يصرّح بفاعل معنوي أو مفعول لما تمّ؛ لذلك تُحفظ الصياغة الموجزة وما فيها من اتساع دلالي بدل تعيين مرجعها تفسيرًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «فلمّا» لسلاسة الربط السردي، وحُفظ إيجاز قول يسوع وغموض مرجعه، كما حُفظت صورة «تسليم الروح» بدل تسويتها إلى تصريح عام بالموت.
