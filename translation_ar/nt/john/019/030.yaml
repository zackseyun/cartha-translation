  source_fidelity: 'النص العربي ينقل عناصر اليونانية الأساسية بأمانة: الربط السردي في «فلمّا»، وتلقّي الشراب، وὄξος بوصفه «الخمر الحامضة»، وإيجاز «قد تمّ» مع إبقاء مرجعه غير مصرّح به، ثم حركة إحناء الرأس وعبارة «أسلم روحه» التي تحافظ على صورة παρέδωκεν τὸ πνεῦμα دون اختزالها إلى «مات».'
