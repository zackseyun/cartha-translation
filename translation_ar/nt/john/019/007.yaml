  source_fidelity: 'النص العربي ينقل عناصر اليونانية بدقة: جواب اليهود لبيلاطس، امتلاكهم شريعة، الاحتكام إلى الشريعة المذكورة، وجوب موته بحسب دعواهم، وسبب ذلك أنه جعل نفسه «ابن الله». و«هذه الشريعة» تؤدي الإحالة الاسترجاعية في κατὰ τὸν νόμον بوضوح مناسب.'
