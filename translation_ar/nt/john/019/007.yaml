  text: ἀπεκρίθησαν αὐτῷ οἱ Ἰουδαῖοι· Ἡμεῖς νόμον ἔχομεν, καὶ κατὰ τὸν ⸀νόμον ὀφείλει ἀποθανεῖν, ὅτι ⸂υἱὸν θεοῦ ἑαυτὸν⸃ ἐποίησεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/007.yaml
  text: The Jews answered him[a], “We have a law, and according to that law he ought to die[b], because he made himself the Son of God.”
translation:
  language: ar
  text: 'فأجابه اليهود: «لنا شريعة، وبحسب هذه الشريعة يجب أن يموت، لأنه جعل نفسه ابن الله».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθησαν αὐτῷ
  choice: فأجابه
  rationale: صياغة سردية عربية طبيعية تنقل فعل الإجابة وضمير المفعول المفرد العائد إلى بيلاطس.
- source_word: οἱ Ἰουδαῖοι
  choice: اليهود
  rationale: المقابل المباشر لتسمية الجماعة في اليونانية؛ ولا يضيّق مدلولها إلى القادة وحدهم من غير تصريح في الآية نفسها.
- source_word: νόμον ἔχομεν
  choice: لنا شريعة
  rationale: تحافظ «شريعة» على السياق الديني والقانوني، وتفيد الصياغة العربية غير المعرّفة وجود شريعة يحتكمون إليها.
- source_word: κατὰ τὸν νόμον
  choice: وبحسب هذه الشريعة
  rationale: اسم الإشارة يعيد بوضوح إلى الشريعة المذكورة أولًا، كما تفعل أداة التعريف في الورود الثاني للكلمة اليونانية.
- source_word: ὀφείλει ἀποθανεῖν
  choice: يجب أن يموت
  rationale: ينقل معنى الإلزام القانوني بصياغة عربية واضحة، من غير تحويله إلى تقرير لضرورة إلهية مطلقة.
- source_word: υἱὸν θεοῦ
  choice: ابن الله
  rationale: إضافة «ابن» إلى «الله» هي الصياغة العربية الطبيعية للقب، وتحفظ قوة الاتهام بشأن البنوة الإلهية الفريدة دون إدخال أداة تنكير.
- source_word: ἑαυτὸν ἐποίησεν
  choice: جعل نفسه
  rationale: ترجمة قريبة من التعبير اليوناني، تحفظ صياغة المتهمين بدل تفسيرها بعبارة مثل «ادّعى أنه».
theological_decisions:
- issue: دلالة υἱὸν θεοῦ في اتهام موجّه إلى يسوع
  choice: ابن الله
  alternative: ابنًا لله
  rationale: «ابن الله» تحافظ على القوة اللقبية واليوحناوية للعبارة وعلى ادعاء البنوة الفريدة الذي فهمه المتهمون، مع بقائها نقلًا لقولهم لا تعليقًا عقائديًا من المترجم.
translation_notes:
  register: لغة عربية فصحى معاصرة واضحة ووقورة. استُعملت «شريعة» بدل «قانون» لملاءمة الإحالة إلى الشريعة الدينية، مع تكرار اللفظة كما في اليونانية. لا تستلزم الآية حاشية تفسيرية أو نصية.
