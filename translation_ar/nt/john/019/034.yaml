  text: ἀλλ’ εἷς τῶν στρατιωτῶν λόγχῃ αὐτοῦ τὴν πλευρὰν ἔνυξεν, καὶ ⸂ἐξῆλθεν εὐθὺς⸃ αἷμα καὶ ὕδωρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/034.yaml
  text: But one of the soldiers pierced his side with a spear[b][a], and immediately blood and water came out.
translation:
  language: ar
  text: لكن واحدًا من الجنود طعن جنبه بحربة[a]، فخرج في الحال دم وماء[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «برمح».'
    reason: lexical_alternative
  - marker: b
    text: يفهم بعض المفسرين «الدم والماء» فهمًا رمزيًا أو أسراريًا، ويراهما آخرون وصفًا جسديًا. والنص اليوناني نفسه لا يشرح دلالتهما هنا.
    reason: interpretive_ambiguity
lexical_decisions:
- source_word: ἀλλ’
  choice: لكن
  rationale: تفيد الاستدراك في مقابل عدم كسر ساقي يسوع في السياق السابق، وهي طبيعية وواضحة في العربية.
- source_word: εἷς τῶν στρατιωτῶν
  choice: واحدًا من الجنود
  rationale: تحافظ على تركيب التبعيض الصريح في اليونانية بدل اختزاله إلى «جندي».
- source_word: λόγχῃ
  choice: بحربة
  rationale: تدل على سلاح ذي نصل مدبب يستعمله الجندي، و«حربة» لفظ عربي واضح ودقيق؛ ويمكن أيضًا ترجمتها «برمح».
- source_word: αὐτοῦ τὴν πλευρὰν
  choice: جنبه
  rationale: الضمير يعود بحسب السياق إلى يسوع، و«الجنب» يقابل πλευρά من غير تحديد تشريحي زائد.
- source_word: ἔνυξεν
  choice: طعن
  rationale: ينقل فعل إحداث جرح بآلة مدببة بصياغة عربية طبيعية ورصينة.
- source_word: καὶ ⸂ἐξῆλθεν εὐθὺς⸃
  choice: فخرج في الحال
  rationale: الفاء تلائم التعاقب المباشر في العربية، و«في الحال» تحفظ الدلالة الزمنية لـ εὐθύς.
- source_word: αἷμα καὶ ὕδωρ
  choice: دم وماء
  rationale: ترجمة مباشرة تحفظ العبارة غير المعتادة بلا تفسير مضاف.
theological_decisions:
- issue: هل تُفسَّر عبارة «دم وماء» تفسيرًا رمزيًا أو أسراريًا أو جسديًا في المتن؟
  choice: إبقاء العبارة الحرفية «دم وماء» من غير تفسير في المتن.
  alternative: فهمها إشارة رمزية أو أسرارية، أو وصفًا جسديًا لأثر الطعنة.
  rationale: النص اليوناني يذكر خروج الدم والماء لكنه لا يشرح دلالتهما هنا؛ لذلك ينبغي حفظ الانفتاح والتوتر التفسيري وعدم إدخال قراءة لاهوتية بعينها في الترجمة.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. حُفظ تركيب التبعيض والضمير، وتُركت عبارة «دم وماء» بلا توسع تفسيري. وُضعت علامة البديل المعجمي بعد «بحربة»، وعلامة الملاحظة التفسيرية بعد العبارة التي تتناولها.
