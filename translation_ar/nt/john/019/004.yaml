base_translation:
  language: en
  yaml_path: translation/nt/john/019/004.yaml
  text: Then Pilate went outside again and said to them[a], “Look, I am bringing him out to you so that you may know that I find no case against him.”
translation:
  language: ar
  text: 'ثم خرج بيلاطس إليهم مرة أخرى وقال لهم: «ها أنا أُخرجه إليكم لتعلموا أني لا أجد عليه أيَّ تهمة».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لا أجد فيه علة». يمكن ترجمة التعبير اليوناني بهذه الصياغة التقليدية، لكنه يحمل هنا على الأرجح معنى قضائيًا: لا يجد بيلاطس أساسًا لأي اتهام ضد يسوع.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν ... ἔξω
  choice: خرج ... إلى الخارج
  rationale: يحفظ معنى الحركة من الداخل إلى الخارج، مع إبقاء التوكيد المكاني الموجود في اليونانية بصياغة عربية واضحة.
- source_word: πάλιν
  choice: مرة أخرى
  rationale: ينقل دلالة التكرار بعبارة عربية طبيعية في السياق السردي.
- source_word: λέγει
  choice: قال
  rationale: صيغ المضارع التاريخي اليوناني بالماضي، وهو الأنسب للسرد العربي المتصل.
- source_word: Ἴδε
  choice: ها أنا
  rationale: أداة تنبيه وعرض تتصل هنا بالفعل المتكلم، و«ها أنا» طبيعية في العربية وتلفت النظر إلى ما سيفعله بيلاطس.
- source_word: ἄγω ὑμῖν αὐτὸν ἔξω
  choice: أُخرجه إليكم
  rationale: ينقل فعل الإحضار أو الاقتياد إلى الخارج بإيجاز عربي طبيعي، ويحفظ جهة الحركة نحو المخاطَبين.
- source_word: ἵνα γνῶτε
  choice: لتعلموا
  rationale: يحفظ دلالة الغرض التي تؤديها ἵνα بصياغة عربية مباشرة.
- source_word: οὐδεμίαν αἰτίαν
  choice: أيَّ تهمة
  rationale: لـ αἰτία هنا معنى قضائي، و«تهمة» توصل هذا المعنى بوضوح أكبر من «عيب» أو «ذنب».
- source_word: εὑρίσκω ἐν αὐτῷ
  choice: لا أجد عليه
  rationale: «أجد عليه تهمة» تعبير عربي قضائي طبيعي يقابل الدلالة الاصطلاحية للتركيب اليوناني.
theological_decisions:
- issue: الصياغة القضائية لإعلان بيلاطس براءة يسوع
  choice: لا أجد عليه أيَّ تهمة
  alternative: لا أجد فيه علة
  rationale: السياق سياق محاكمة وتقييم قانوني، ولذلك تحافظ «تهمة» على القوة القضائية للفظ اليوناني من غير تحويل قول بيلاطس إلى تقرير لاهوتي أوسع من منطوق الآية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُعملت صياغة قضائية مفهومة، مع إثبات البديل التقليدي في الحاشية. وُضع مؤشر الحاشية بعد الاقتباس لأنه يشرح عبارة الحكم القضائي داخله.
