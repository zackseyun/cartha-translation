  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἐκ τούτου ⸂ὁ Πιλᾶτος ἐζήτει⸃ ἀπολῦσαι αὐτόν· οἱ δὲ Ἰουδαῖοι ⸀ἐκραύγασαν λέγοντες· Ἐὰν τοῦτον ἀπολύσῃς, οὐκ εἶ φίλος τοῦ Καίσαρος· πᾶς ὁ βασιλέα ἑαυτὸν ποιῶν ἀντιλέγει τῷ Καίσαρι.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/012.yaml
  text: From then on Pilate was seeking to release him. But the Jews shouted, saying, “If you release this man, you are not Caesar’s friend. Everyone who makes himself a king speaks against Caesar.”
translation:
  language: ar
  text: 'ومنذ ذلك الحين كان بيلاطس يسعى إلى إطلاق سراحه.[a] لكن اليهود[b] صرخوا قائلين: «إن أطلقت سراح هذا، فلست صديقًا لقيصر. كل من يجعل نفسه ملكًا يعارض قيصر».[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وبسبب هذا ظل بيلاطس يحاول إطلاق سراحه». يمكن أن تُفهم العبارة اليونانية ἐκ τούτου زمنيًا («منذ ذلك الحين») أو سببيًا («بسبب هذا»).'
    reason: lexical_alternative
  - marker: b
    text: كثيرًا ما تشير عبارة «اليهود» في إنجيل يوحنا، بحسب السياق، إلى السلطات في اليهودية أو إلى خصوم يهود معيّنين في الرواية، لا إلى الشعب اليهودي كله.
    reason: cultural_note
  - marker: c
    text: 'أو: «يتكلم ضد قيصر» أو «يقف ضد قيصر».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τούτου
  choice: ومنذ ذلك الحين
  rationale: تؤدي العبارة هنا معنى زمنيًا طبيعيًا في سياق السرد، مع إبقاء المعنى السببي الممكن في الحاشية.
- source_word: ἐζήτει
  choice: كان ... يسعى
  rationale: يحفظ هذا التعبير دلالة الماضي الناقص على المحاولة المستمرة أو المتكررة.
- source_word: ἀπολῦσαι / ἀπολύσῃς
  choice: إطلاق سراحه / أطلقت سراح
  rationale: تعبير دقيق وطبيعي في سياق قضائي يتعلق بإخلاء سبيل شخص محتجز.
- source_word: οἱ δὲ Ἰουδαῖοι
  choice: لكن اليهود
  rationale: يحافظ على لفظ المصدر من غير تضييق المرجع في المتن إلى القادة أو السلطات، مع إيضاح الاستعمال السياقي في الحاشية.
- source_word: ἐκραύγασαν λέγοντες
  choice: صرخوا قائلين
  rationale: ينقل شدة النداء العلني ويحافظ على تركيب فعل القول.
- source_word: τοῦτον
  choice: هذا
  rationale: يحفظ قوة اسم الإشارة ونبرته الجافة في خطاب الخصوم، وهو عربي طبيعي في هذا السياق.
- source_word: φίλος τοῦ Καίσαρος
  choice: صديقًا لقيصر
  rationale: صياغة عربية واضحة تحفظ مضمون تهمة عدم الولاء السياسي، من غير الجزم بأن العبارة لقب رسمي.
- source_word: πᾶς ὁ βασιλέα ἑαυτὸν ποιῶν
  choice: كل من يجعل نفسه ملكًا
  rationale: قريب من بنية اليونانية ويحفظ الفعل المتعمد بدل تحويله إلى مجرد ادعاء لفظي.
- source_word: ἀντιλέγει τῷ Καίσαρι
  choice: يعارض قيصر
  rationale: في هذا السياق السياسي تحمل ἀντιλέγω معنى الوقوف ضد قيصر أو منازعته، و«يعارض» أوضح في العربية من النقل الحرفي «يتكلم ضد».
theological_decisions:
- issue: مرجع عبارة «اليهود» في إنجيل يوحنا
  choice: إبقاء «اليهود» في المتن مع حاشية سياقية
  alternative: القادة اليهود / اليهوديّون من أهل اليهودية
  rationale: النص اليوناني لا يصرح بالتضييق، ولذلك ينبغي عدم إدخال تفسير محدد في المتن؛ والحاشية تمنع فهم العبارة على أنها تعميم على جميع اليهود.
- issue: قوة العبارة السياسية ἀντιλέγει τῷ Καίσαρι
  choice: يعارض قيصر
  alternative: يتكلم ضد قيصر / يقاوم قيصر
  rationale: يحفظ معنى الخصومة السياسية والقانونية من غير زيادة توحي بالتمرد المسلح.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. استُخدم «إطلاق سراح» للملاءمة القضائية، وحُفظت العبارة المصدرية «اليهود» مع حاشية تمنع التعميم، كما أُبقي غموض ἐκ τούτου في الحاشية.
