base_translation:
  language: en
  yaml_path: translation/nt/john/019/013.yaml
  text: So when Pilate heard these words[a], he brought Jesus outside and sat down on the judgment seat at a place called the Stone Pavement, and in Hebrew[b], Gabbatha.
translation:
  language: ar
  text: فَلَمَّا سَمِعَ بِيلاطُسُ هذِهِ الْأَقْوَالَ[a]، أَخْرَجَ يَسُوعَ إِلَى الْخَارِجِ، وَجَلَسَ عَلَى كُرْسِيِّ الْقَضَاءِ فِي مَكَانٍ يُدْعَى «الْبِلَاطُ الْحَجَرِيُّ»، وَبِالْعِبْرِيَّةِ[b] «جَبَّاثَا».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وأجلسه على كرسي القضاء». يمكن فهم الفعل اليوناني على أنه متعدٍّ، لكن الأرجح هنا أن بيلاطس نفسه هو الذي جلس على كرسي القضاء.'
    reason: alternative_reading
  - marker: b
    text: يُرجَّح أن عبارة «بالعبرية» تشير إلى اللغة السامية المحلية، وهي على الأرجح الآرامية، كما في مواضع أخرى من إنجيل يوحنا.
    reason: cultural_note
lexical_decisions:
- source_word: οὖν
  choice: فَلَمَّا
  rationale: يربط الحدث بما سبقه مع إدماج العلاقة الزمنية التي تفيدها صيغة ἀκούσας، وهو أسلوب عربي طبيعي من غير إغفال للتتابع السردي.
- source_word: ἀκούσας τῶν λόγων τούτων
  choice: سَمِعَ بِيلاطُ هذِهِ الْأَقْوَالَ
  rationale: تُنقل صيغة اسم الفاعل الماضي بجملة زمنية عربية، و«الأقوال» تشير بوضوح إلى الكلام السابق.
- source_word: ἤγαγεν ἔξω τὸν Ἰησοῦν
  choice: أَخْرَجَ يَسُوعَ
  rationale: يؤدي معنى اقتياد يسوع إلى الخارج بإيجاز عربي طبيعي، من غير إضافة كيفية للحركة لا يحددها النص.
- source_word: ἐκάθισεν ἐπὶ βήματος
  choice: جَلَسَ عَلَى كُرْسِيِّ الْقَضَاءِ
  rationale: القراءة الأرجح تجعل بيلاط هو الفاعل، وβῆμα هنا موضع الجلوس الرسمي لإجراء القضاء. أُبقي الاحتمال المتعدي في الحاشية.
- source_word: εἰς τόπον λεγόμενον Λιθόστρωτον
  choice: فِي مَكَانٍ يُدْعَى «الْبَلَاطَ الْحَجَرِيَّ»
  rationale: تُترجم تسمية Λιθόστρωτον بحسب معناها اليوناني الشفاف، وتؤدي «في» موضع الجلوس الناتج بعد الحركة.
- source_word: Ἑβραϊστὶ δὲ Γαββαθα
  choice: وَبِالْعِبْرِيَّةِ «جَبَّاثَا»
  rationale: يحافظ المتن على تعبير النص «بالعبرية»، مع كتابة اسم المكان السامي بحروف عربية، وتوضح الحاشية الاستعمال اللغوي المحتمل.
theological_decisions:
- issue: فاعل ἐκάθισεν وما إذا كان الفعل لازمًا أم متعديًا
  choice: بيلاط جلس على كرسي القضاء
  alternative: بيلاط أجلس يسوع على كرسي القضاء
  rationale: الصيغة اليونانية تحتمل الاستعمال اللازم والمتعدي، لكن السياق القضائي والتركيب الأشيع يرجحان أن بيلاط اتخذ مجلسه للقضاء. حُفظ الاحتمال الآخر في الحاشية لما له من دلالة تفسيرية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «كرسي القضاء» لإظهار الوظيفة القضائية لـβῆμα، و«البلاط الحجري» ترجمةً لاسم الموضع اليوناني. وُضعت علامتا الحاشيتين في المتن كما يلزم.
