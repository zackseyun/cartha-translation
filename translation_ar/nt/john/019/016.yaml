translation:
  language: ar
  text: فحينئذٍ سلَّمه إليهم ليُصلَب.[a] فأخذوا يسوع.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «لكي يُصلَب». تفيد العبارة اليونانية الغاية، وقد صيغت هنا بإيجاز عربي طبيعي.'
    reason: lexical_alternative
  - marker: b
    text: لا تعيّن هذه الآية صراحةً مَن يعود إليهم الضمير في «إليهم» ولا مَن هم فاعل «أخذوا»؛ ويُفهم ذلك من السياق.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε οὖν
  choice: فحينئذٍ
  rationale: يجمع على نحو عربي طبيعي بين التتابع الزمني الذي تدل عليه τότε والصلة الاستنتاجية أو التتابعية التي تؤديها οὖν، من غير إثقال العبارة بأداتين متجاورتين.
- source_word: παρέδωκεν
  choice: سلَّمه
  rationale: يفيد نقل يسوع إلى سلطة آخرين، ويحافظ على دلالة التسليم القضائي من غير إضافة تفسير.
- source_word: αὐτὸν αὐτοῖς
  choice: ـه إليهم
  rationale: يحافظ على الضميرين كما في اليونانية، ولا يسمّي الجهة التي لم يسمّها النص في هذه الآية.
- source_word: ἵνα σταυρωθῇ
  choice: ليُصلَب
  rationale: اللام مع المضارع المبني للمجهول تعبّر بإيجاز طبيعي عن الغاية وتحافظ على المبني للمجهول.
- source_word: Παρέλαβον
  choice: تسلَّموا
  rationale: يلائم أخذ الشخص الذي جرى تسليمه إليهم، ويُظهر الصلة اللفظية المنطقية بين فعل التسليم وفعل التسلّم دون توسيع المعنى إلى «أخذوه معهم».
- source_word: Ἰησοῦν
  choice: يسوع
  rationale: الصيغة العربية المعيارية للاسم في التراث الكتابي والاستعمال الحديث.
theological_decisions:
- issue: مرجع «إليهم» والفاعل المستتر في «تسلَّموا»
  choice: الإبقاء على الضمائر من غير تعيين الجماعة
  alternative: تحديدهم برؤساء الكهنة وخدامهم، أو بالجنود الرومان
  rationale: لا تسمّي اليونانية الجهة في هذه الآية، وإن كان السياق المباشر يساعد القارئ؛ لذا لا ينبغي للترجمة أن تحسم ما أبقاه النص ضمنيًا.
- issue: قوة جملة الغاية ἵνα σταυρωθῇ
  choice: ليُصلَب
  alternative: لكي يُصلَب
  rationale: كلتا الصيغتين تحفظان الغاية، لكن «ليُصلَب» أفصح وأوجز في السرد ولا تحوّل العبارة إلى مجرد نتيجة.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة سردية وقورة. استُعمل «فحينئذٍ» لتمثيل τότε οὖν طبيعيًا، وحُفظ الغموض المرجعي للضمائر. جميع علامات الحواشي الواردة مثبتة في المتن.
