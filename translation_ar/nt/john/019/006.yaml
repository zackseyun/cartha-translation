  text: ὅτε οὖν εἶδον αὐτὸν οἱ ἀρχιερεῖς καὶ οἱ ὑπηρέται ἐκραύγασαν λέγοντες· Σταύρωσον ⸀σταύρωσον. λέγει αὐτοῖς ὁ Πιλᾶτος· Λάβετε αὐτὸν ὑμεῖς καὶ σταυρώσατε, ἐγὼ γὰρ οὐχ εὑρίσκω ἐν αὐτῷ αἰτίαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/006.yaml
  text: So when the chief priests and the officers saw him[a], they cried out, saying, “Crucify him! Crucify him!” Pilate said to them, “You take him and crucify him[b], for I find no charge against him.”
translation:
  language: ar
  text: 'فلمّا رآه رؤساء الكهنة والحرس، صرخوا قائلين: «اصلبه! اصلبه!» فقال لهم بيلاطس: «خذوه أنتم[a] واصلبوه، لأنّي لا أجد عليه تهمة[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «خذوه بأنفسكم واصلبوه». يَرِد ضمير «أنتم» صريحًا في اليونانية للتوكيد.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا: «لا أجد فيه علّة». قد تدل الكلمة اليونانية على تهمة قانونية أو أساس للاتهام، والمعنى القضائي هو الأبرز هنا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε οὖν
  choice: فلمّا
  rationale: تؤدي «لمّا» المعنى الزمني، وتربط الفاء الحدث بما سبقه وتحفظ استمرارية السرد والنتيجة السياقية التي تفيدها οὖν.
- source_word: ἀρχιερεῖς
  choice: رؤساء الكهنة
  rationale: تعبير عربي مألوف ودقيق يدل على جماعة القيادات الكهنوتية في أورشليم، لا على رئيس كهنة واحد.
- source_word: ὑπηρέται
  choice: الحرس
  rationale: يدل اللفظ في هذا السياق اليوحنّاوي على رجال تابعين للسلطات الدينية يقومون بمهام تنفيذية؛ و«الحرس» واضحة وطبيعية من غير إضافة «الهيكل» التي لا يصرّح بها النص هنا.
- source_word: ἐκραύγασαν λέγοντες
  choice: صرخوا قائلين
  rationale: يحفظ شدة النداء العلني، مع إبقاء اسم الفاعل الذي يقدّم مضمون الصراخ.
- source_word: Σταύρωσον σταύρωσον
  choice: اصلبه! اصلبه!
  rationale: أُثبت المفعول المفهوم من السياق لسلامة العربية، وحُفظ التكرار بما فيه من إلحاح وقوة خطابية.
- source_word: Λάβετε αὐτὸν ὑμεῖς
  choice: خذوه أنتم
  rationale: إظهار الضمير «أنتم» يحفظ التوكيد والمقابلة الصريحة في اليونانية بين المخاطَبين وبيلاطس.
- source_word: σταυρώσατε
  choice: اصلبوه
  rationale: مقابل مباشر ودقيق لفعل الأمر اليوناني، مع ضمير يعود إلى يسوع.
- source_word: αἰτίαν
  choice: تهمة
  rationale: السياق قضائي، و«تهمة» تنقل معنى الاتهام أو الأساس القانوني للمحاكمة بصورة أوضح من «عيب» أو «ذنب».
theological_decisions:
- issue: إعلان بيلاطس براءة يسوع
  choice: لا أجد عليه تهمة
  alternative: لا أجد فيه علة
  rationale: الصياغة المختارة تحافظ على الطابع القضائي لكلام بيلاطس ولا تحوّله إلى تقرير لاهوتي أوسع، مع بقاء دلالة البراءة في سياق المحاكمة.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ومهيبة، تحافظ على سرعة المشهد وتكرار الصرخة وعلى التوكيد في «أنتم». وُضعت علامتا الحاشية عند العبارتين اللتين تشرحهما الحاشيتان، لا عند موضعين غير متوافقين مع مضمونهما.
