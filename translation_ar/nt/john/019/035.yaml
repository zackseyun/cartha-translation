    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἑωρακὼς
  choice: الذي رأى
  rationale: يحافظ على صيغة اسم الفاعل المعرَّف وعلى قوة شهادة المعاينة، من غير أن يضيف إلى النص تسمية «شاهد العيان». ودلالة التمام في صيغة اليونانية تُفهم طبيعيًا من السياق العربي.
- source_word: μεμαρτύρηκεν
  choice: قد شهد
  rationale: تنقل «قد» الفعل المكتمل ذي الصلة المستمرة، و«شهد» تعبير عربي واضح ومباشر.
- source_word: ἀληθινὴ ... ἡ μαρτυρία
  choice: شهادته صادقة
  rationale: «صادقة» تلائم وصف الشهادة من جهة موثوقيتها ومطابقتها للحق، وهي أفصح عربيًا من «شهادته حقّة» في هذا السياق.
- source_word: ἐκεῖνος
  choice: هو
  rationale: الضمير المنفصل يحفظ قدرًا من التوكيد الذي في اسم الإشارة اليوناني، من دون غرابة «ذلك» التي قد توحي في العربية بمرجع مختلف.
- source_word: οἶδεν
  choice: يعلم
  rationale: مع أن الصيغة اليونانية تامة من حيث الشكل، فإنها تؤدي معنى حاليًا ثابتًا؛ لذلك «يعلم» هي المقابلة العربية الطبيعية.
- source_word: ἀληθῆ λέγει
  choice: يقول الحق
  rationale: ينقل التعبير اليوناني الاصطلاحي بعبارة عربية طبيعية، مع إبقاء الصلة اللفظية بمفهوم الحق.
- source_word: ἵνα καὶ ὑμεῖς πιστεύητε
  choice: لكي تؤمنوا أنتم أيضًا
  rationale: «لكي» تبين الغاية، وإظهار «أنتم» مع «أيضًا» يحفظ توكيد الضمير وإدماج المخاطبين.
theological_decisions:
- issue: مرجع العبارات التوكيدية في الآية
  choice: 'إبقاء الشاهد غير مسمّى بصيغة الغائب: «الذي رأى... وهو يعلم»'
  alternative: تعيينه على أنه التلميذ المحبوب/الراوي، أو اعتباره شاهدًا آخر متميزًا عنه
  rationale: لا يصرح اليوناني بهوية الشاهد. وتحفظ الصياغة العربية إمكان الإشارة الذاتية بصيغة الغائب وإمكان الإشارة إلى شاهد آخر، من غير حسم زائد.
- issue: دلالة πιστεύητε
  choice: تؤمنوا
  alternative: تستمروا في الإيمان
  rationale: قد تحمل صيغة المضارع الاحتمالية معنى الاستمرار، لكنها لا تفرضه هنا؛ لذلك أُبقي الفعل غير المقيّد في المتن، وذُكر الاحتمال الاستمراري في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «قد شهد» لإبراز تمام الشهادة، و«شهادته صادقة» لطبيعية الأسلوب، مع إبقاء هوية الشاهد ودلالة الإيمان المستمر دون حسم تفسيري.
