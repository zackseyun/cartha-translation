  text: And the one who has seen has testified[a], and his testimony is true, and that one knows that he is telling the truth, so that you also may believe.
translation:
  language: ar
  text: والذي رأى قد شهد، وشهادته صادقة، وذلك يعلم أنه يقول الحق، لكي تؤمنوا أنتم أيضًا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
