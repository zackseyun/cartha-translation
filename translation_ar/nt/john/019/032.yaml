  text: ἦλθον οὖν οἱ στρατιῶται, καὶ τοῦ μὲν πρώτου κατέαξαν τὰ σκέλη καὶ τοῦ ἄλλου τοῦ συσταυρωθέντος αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/032.yaml
  text: So the soldiers came and broke the legs of the first man[b][a], and of the other who had been crucified with him.
translation:
  language: ar
  text: فجاء الجنود وكسروا ساقَي الأول وساقَي الآخر الذي صُلب معه.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: فـ
  rationale: تفيد استمرار السرد ونتيجته في ضوء الأمر الوارد في الآية السابقة، والفاء طبيعية موجزة في العربية.
- source_word: οἱ στρατιῶται
  choice: الجنود
  rationale: المقابل العربي المألوف والواضح للعسكريين الرومانيين في هذا السياق.
- source_word: τοῦ μὲν πρώτου
  choice: الأول
  rationale: يحيل إلى أول الرجلين المصلوبين مع يسوع، ولا تحتاج العربية إلى إضافة «الرجل» ليتضح المرجع في السياق.
- source_word: κατέαξαν τὰ σκέλη
  choice: كسروا ساقَي
  rationale: ينقل الفعل بمعناه المباشر في سياق تنفيذ الإعدام، وتدل صيغة المثنى العربية بوضوح على ساقي كل واحد.
- source_word: τοῦ ἄλλου
  choice: الآخر
  rationale: يحيل بوضوح إلى ثاني الرجلين ويحافظ على إيجاز اليونانية.
- source_word: συσταυρωθέντος αὐτῷ
  choice: الذي صُلب معه
  rationale: صياغة عربية طبيعية تنقل اسم المفعول الدال على أنه صُلب مع يسوع؛ ويُفهم سبق الصلب من السياق دون حاجة إلى تركيب زمني أثقل.
theological_decisions:
- issue: مرجع الضمير في αὐτῷ
  choice: «معه» أي مع يسوع
  alternative: مع الرجل الأول
  rationale: يسوع هو المرجع المحوري في مشهد الصلب، والرجلان موصوفان في السياق بعلاقتهما به؛ لذلك يعود الضمير إليه على الأرجح.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل المثنى «ساقَي» لتجنب اللبس، وأُبقي الإيجاز التركيبي من غير حشو أو تفسير زائد.
