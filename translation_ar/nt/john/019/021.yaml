  text: ἔλεγον οὖν τῷ Πιλάτῳ οἱ ἀρχιερεῖς τῶν Ἰουδαίων· Μὴ γράφε· Ὁ βασιλεὺς τῶν Ἰουδαίων, ἀλλ’ ὅτι ἐκεῖνος εἶπεν Βασιλεὺς ⸂τῶν Ἰουδαίων εἰμί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/021.yaml
  text: So the chief priests of the Jews were saying to Pilate[a], “Do not write, ‘The King of the Jews,’ but that he said[b], ‘I am King of the Jews.’”
translation:
  language: ar
  text: 'فكان رؤساء كهنة اليهود يقولون لبيلاطس: «لا تكتب: «ملك اليهود»، بل اكتب: «ذاك قال: أنا ملك اليهود»».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أيضًا ترجمة «اليهود» هنا بـ«أهل اليهودية»، وترجمة اللقب بـ«ملك أهل اليهودية»؛ فاللفظة اليونانية قد تشير إلى اليهود عامة أو إلى أهل اليهودية خاصة، بحسب السياق.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλεγον
  choice: فقال
  rationale: المضارع الناقص اليوناني قد يدل على قول مستمر أو متكرر، لكن العربية السردية الفصيحة تعبّر عنه طبيعيًا بالفعل الماضي في هذا السياق، من غير حاجة إلى صياغة ثقيلة مثل «كانوا يقولون».
- source_word: οὖν
  choice: فـ
  rationale: الفاء تصل الكلام بما قبله وتحفظ قوة الاستمرار أو النتيجة السردية بإيجاز طبيعي.
- source_word: οἱ ἀρχιερεῖς
  choice: رؤساء كهنة
  rationale: يدل الجمع على كبار السلطات الكهنوتية، لا على وجود عدة أشخاص يشغلون منصب رئيس الكهنة المفرد في وقت واحد.
- source_word: τῶν Ἰουδαίων
  choice: اليهود
  rationale: هو المقابل الواضح والمألوف في لقب «ملك اليهود» ضمن رواية الآلام، مع التنبيه في الحاشية إلى إمكان الدلالة على أهل اليهودية بحسب السياق.
- source_word: Μὴ γράφε
  choice: لا تكتب
  rationale: نهي مباشر يحفظ بساطة العبارة اليونانية وطبيعتها.
- source_word: ἀλλ’ ὅτι
  choice: بل اكتب أن
  rationale: يوضح التصحيح المطلوب في عربية طبيعية؛ وفعل «اكتب» مفهوم من الأمر السابق ومقدّر في اليونانية بعد «بل».
- source_word: ἐκεῖνος
  choice: ذاك
  rationale: يحفظ الإشارة البعيدة، وما قد يصاحبها هنا من نبرة تنصّل أو ازدراء، دون تضخيمها بإضافة تفسير.
- source_word: Βασιλεὺς τῶν Ἰουδαίων εἰμί
  choice: أنا ملك اليهود
  rationale: يحافظ على الجملة الاسمية العربية وعلى غياب أداة التعريف عن «ملك» في الخبر اليوناني، مع بقاء المعنى اللقبي واضحًا.
theological_decisions:
- issue: دلالة Ἰουδαίων في سياق آلام يوحنا
  choice: اليهود
  alternative: أهل اليهودية / اليهوديين
  rationale: السياق يتناول العبارة السياسية الدينية المعروفة «ملك اليهود». ومع ذلك، قد تدل اللفظة اليونانية في بعض السياقات على أهل اليهودية تحديدًا، ولذلك حُفظ هذا الاحتمال في الحاشية دون حسم زائد.
- issue: تعريف لقب الملك في قول يسوع المنسوب إليه
  choice: أنا ملك اليهود
  alternative: أنا ملكُ اليهود المعيّن / أنا الملك على اليهود
  rationale: لا توجد أداة تعريف قبل βασιλεύς في هذه الجملة، والعربية الطبيعية لا تحتاج إليها هنا؛ كما لا ينبغي تحميل العبارة تحديدًا لاهوتيًا زائدًا غير مصرح به في النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدم «فقال» للسرد الطبيعي، و«بل اكتب أن» لإظهار التصحيح المقصود دون غموض نحوي. وُضع مؤشر الحاشية في نهاية الآية لأنه يشرح تكرارات لفظ «اليهود» كلها.
