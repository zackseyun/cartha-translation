  text: καὶ εἰσῆλθεν εἰς τὸ πραιτώριον πάλιν καὶ λέγει τῷ Ἰησοῦ· Πόθεν εἶ σύ; ὁ δὲ Ἰησοῦς ἀπόκρισιν οὐκ ἔδωκεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/009.yaml
  text: And he entered the governor’s headquarters again and said to Jesus[a], “Where are you from?” But Jesus gave him no answer.
translation:
  language: ar
  text: 'ودخل مرةً أخرى إلى مقرّ الوالي[a]، وقال ليسوع: «من أين أنت؟» أمّا يسوع فلم يعطه جوابًا.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «البريتوريوم»، وهو المقرّ الرسمي للحاكم الروماني أو دار إقامته.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: دخل
  rationale: ينقل فعل الحركة إلى داخل المكان بوضوح وإيجاز، ويلائم السرد العربي الفصيح.
- source_word: πραιτώριον
  choice: مقرّ الوالي
  rationale: يدل اللفظ هنا على المقر الرسمي للحاكم الروماني، وربما كان دار إقامته أيضًا؛ و«مقرّ الوالي» واضح للقارئ العربي من غير الاعتماد على اللفظ الدخيل.
- source_word: πάλιν
  choice: مرةً أخرى
  rationale: يعبّر بوضوح عن تكرار الدخول.
- source_word: λέγει
  choice: قال
  rationale: صيغ الماضي أنسب للسرد العربي، مع أن اليونانية تستعمل المضارع التاريخي.
- source_word: Πόθεν εἶ σύ
  choice: من أين أنت؟
  rationale: صياغة عربية طبيعية تحفظ سؤال الأصل أو المنشأ من غير تحديد المقصود أكثر مما يحدده النص.
- source_word: ἀπόκρισιν οὐκ ἔδωκεν αὐτῷ
  choice: لم يعطه جوابًا
  rationale: يحافظ على صورة التعبير اليوناني، «لم يعطه جوابًا»، مع فصاحة العبارة بالعربية.
- source_word: ὁ δὲ Ἰησοῦς
  choice: أمّا يسوع
  rationale: تُبرز «أمّا» المقابلة بين سؤال الوالي وصمت يسوع على نحو طبيعي في العربية.
theological_decisions:
- issue: مرجع الفاعل المستتر في εἰσῆλθεν وλέγει
  choice: إبقاء الفاعل مستترًا في الفعلين «دخل» و«قال»، على أن يعيّن السياق أنه بيلاطس.
  alternative: التصريح باسم «بيلاطس» في المتن.
  rationale: الأصل اليوناني لا يصرّح بالفاعل في هذه الجملة، والسياق السابق يوضحه؛ لذلك يحافظ الإضمار على بنية المصدر من دون إحداث غموض جوهري.
- issue: مدى سؤال «من أين أنت؟»
  choice: إبقاء السؤال مفتوحًا على معنى الأصل أو المصدر.
  alternative: تفسيره صراحةً بأنه سؤال عن الموطن أو عن الأصل السماوي.
  rationale: السؤال اليوناني يحتمل توترًا سرديًا ولا يحدد بنفسه نوع الأصل المقصود، فلا ينبغي حسمه في الترجمة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. وُضع مؤشر الحاشية بعد «مقرّ الوالي» لأنه يشرح πραιτώριον مباشرةً، مع تجنّب التفسير العقائدي لسؤال بيلاطس أو لصمت يسوع.
