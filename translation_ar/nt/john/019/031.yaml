source:
  edition: SBLGNT
  text: Οἱ οὖν Ἰουδαῖοι, ⸂ἐπεὶ παρασκευὴ ἦν, ἵνα μὴ μείνῃ ἐπὶ τοῦ σταυροῦ τὰ σώματα ἐν τῷ σαββάτῳ⸃, ἦν γὰρ μεγάλη ἡ ἡμέρα ἐκείνου τοῦ σαββάτου, ἠρώτησαν τὸν Πιλᾶτον ἵνα κατεαγῶσιν αὐτῶν τὰ σκέλη καὶ ἀρθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/031.yaml
  text: Therefore the Jews[a], because it was the day of preparation[d][c][b], asked Pilate that the bodies might not remain on the cross on the Sabbath—for that Sabbath day was a great one—and that their legs might be broken and they might be taken away.
translation:
  language: ar
  text: فإن اليهود[a]، إذ كان يوم الاستعداد[b]، طلبوا من بيلاطس ألّا تبقى الأجساد على الصليب يوم السبت، لأن يوم ذلك السبت كان عظيمًا[c]، وأن تُكسَر سيقانهم وأن تُزال الأجساد[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: قد يشير «اليهود» هنا، بحسب استعمال الكلمة في بعض مواضع إنجيل يوحنا، إلى قادة اليهود أو السلطات اليهودية، أو إلى أهل اليهودية.
    reason: alternative_reading
  - marker: b
    text: 'أي اليوم الذي يُستعد فيه للسبت؛ ويجوز: «يوم التهيئة».'
    reason: lexical_alternative
  - marker: c
    text: 'أي كان ذلك السبت ذا أهمية خاصة؛ ويجوز: «كان يومًا رفيع الشأن».'
    reason: lexical_clarification
  - marker: d
    text: 'يجوز أيضًا: «تُرفَع الأجساد» أو «تُنَزَّل».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ οὖν Ἰουδαῖοι
  choice: فطلب اليهود
  rationale: تؤدي الفاء معنى οὖν الاستنتاجي/التتابعي في العربية بسلاسة. وأُبقي «اليهود» في المتن لأنه المقابل الأقل تفسيرًا، مع بيان احتمال التخصيص السياقي في الحاشية.
- source_word: ἐπεὶ παρασκευὴ ἦν
  choice: لأن ذلك كان يوم الاستعداد
  rationale: يوضح أن παρασκευή اسم اليوم الذي يسبق السبت ويُستعد فيه له، من غير الاكتفاء بتعبير قد يلتبس على القارئ المعاصر.
- source_word: ἵνα μὴ μείνῃ ἐπὶ τοῦ σταυροῦ τὰ σώματα ἐν τῷ σαββάτῳ
  choice: ألّا تبقى الأجساد على الصليب في السبت
  rationale: تحفظ «ألّا» دلالة الغرض في ἵνα مع صياغة عربية طبيعية، وتترجم العبارات المكانية والزمانية مباشرة.
- source_word: ἦν γὰρ μεγάλη ἡ ἡμέρα ἐκείνου τοῦ σαββάτου
  choice: إذ كان يوم ذلك السبت عظيمًا
  rationale: تحفظ الصياغة اليونانية التي تصف يوم ذلك السبت بأنه «عظيم»، من غير استبدالها بتفسير يحدد نوع عظمته.
- source_word: ἠρώτησαν τὸν Πιλᾶτον
  choice: طلب ... من بيلاطس
  rationale: الفعل هنا طلبٌ موجَّه إلى صاحب السلطة، وهذه صياغة عربية واضحة من غير إضافة «الإذن» غير المذكورة صراحة.
- source_word: ἵνα κατεαγῶσιν αὐτῶν τὰ σκέλη
  choice: أن تُكسَر سيقانهم
  rationale: تحفظ المبني للمجهول وصيغة الغرض، وتحدد أعضاء المصلوبين كما في الأصل.
- source_word: καὶ ἀρθῶσιν
  choice: ثم تُرفَع الأجساد
  rationale: αἴρω يحتمل الرفع أو الإزالة؛ اختير «تُرفَع» لقربه اللفظي مع توضيح الفاعل النحوي المقصود، بينما تُذكر البدائل السياقية في الحاشية.
theological_decisions:
- issue: دلالة μεγάλη في وصف السبت
  choice: عظيمًا
  alternative: مهمًّا على نحو خاص؛ أو يومًا رفيع الشأن
  rationale: يحفظ الوصف الصريح في الأصل والتوتر المتعلق بسبب عظمة ذلك السبت، من غير إدخال اصطلاح كنسي لاحق أو تفسير غير مصرح به.
- issue: مرجع Ἰουδαῖοι في سياق يوحنا
  choice: اليهود
  alternative: أهل اليهودية؛ أو قادة اليهود
  rationale: لا يضيّق النص اليوناني المرجع صراحة إلى القادة، لذلك أُبقي المقابل المباشر في المتن، مع التنبيه في الحاشية إلى أن الاستعمال اليوحناوي قد يكون أخص بحسب السياق.
- issue: دلالة ἀρθῶσιν
  choice: تُرفَع الأجساد
  alternative: تُزال؛ أو تُنزَل
  rationale: يحافظ الاختيار على المجال الدلالي للفعل بدل حصره في الإنزال عن الصليب، مع إتاحة الاحتمالات السياقية في الحاشية.
translation_notes:
  register: 'عربية فصحى معاصرة واضحة ووقورة. رُتبت الجملة بحيث يتقدم الطلب الرئيس، وتؤدى العلة والغاية بوضوح. استُخدم «الأجساد» بدل ضمير مبهم عند الفعل الأخير، لأن الفعلين المبنيين للمجهول لهما مرجعان نحويان مختلفان في اليونانية: السيقان تُكسَر، والأجساد تُرفَع.'
