- from: فطلب اليهود[a] من بيلاطس، لأن ذلك كان يوم الاستعداد[b]، ألّا تبقى الأجساد على الصليب في السبت، إذ كان يوم ذلك السبت عظيمًا[c]، وأن تُكسَر سيقانهم ثم تُرفَع الأجساد[d].
  to: فإن اليهود[a]، إذ كان يوم الاستعداد[b]، طلبوا من بيلاطس ألّا تبقى الأجساد على الصليب يوم السبت، لأن يوم ذلك السبت كان عظيمًا[c]، وأن تُكسَر سيقانهم وأن تُزال الأجساد[d].
  rationale: أزيلت دلالة الترتيب الزمني غير المذكورة، واستبدلت «تُرفَع الأجساد» بـ«تُزال الأجساد» لتؤدي المعنى السياقي لـἀρθῶσιν من غير حصره في كيفية بعينها. كما عُدلت العبارة الزمنية إلى «يوم السبت» لتحسين السلاسة، مع الحفاظ على المعنى والبنية الغرضية للنص اليوناني.
