source:
  edition: SBLGNT
  text: ⸂ἐκραύγασαν οὖν ἐκεῖνοι⸃· Ἆρον ἆρον, σταύρωσον αὐτόν. λέγει αὐτοῖς ὁ Πιλᾶτος· Τὸν βασιλέα ὑμῶν σταυρώσω; ἀπεκρίθησαν οἱ ἀρχιερεῖς· Οὐκ ἔχομεν βασιλέα εἰ μὴ Καίσαρα.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/015.yaml
  text: So they cried out[a], “Away, away! Crucify him!” Pilate said to them, “Shall I crucify your king?” The chief priests answered, “We have no king except Caesar.”
translation:
  language: ar
  text: 'فصرخ أولئك: «أبعده! أبعده! اصلبه!» فقال لهم بيلاطس: «أأصلب ملككم؟» أجاب رؤساء الكهنة: «ليس لنا ملك إلا قيصر[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ليس لنا ملك سوى قيصر».'
    reason: بديل لغوي عربي يؤدي معنى الاستثناء والحصر نفسه في εἰ μὴ.
lexical_decisions:
- source_word: ἐκραύγασαν οὖν ἐκεῖνοι
  choice: فصرخ أولئك
  rationale: «صرخ» ينقل شدة النداء، والفاء تؤدي معنى التعقيب أو النتيجة في οὖν، و«أولئك» تحفظ توكيد اسم الإشارة ἐκεῖνοι من غير إثقال.
- source_word: Ἆρον ἆρον
  choice: أبعده! أبعده!
  rationale: الفعل في هذا السياق صيحة تطالب بإزالة يسوع من المشهد وتسليمه للصلب. أُضيف ضمير المفعول الذي يفهمه السياق ليأتي النداء عربيًا طبيعيًا، مع الحفاظ على التكرار والقوة.
- source_word: σταύρωσον αὐτόν
  choice: اصلبه!
  rationale: «صلب» هو المقابل التاريخي والدلالي المباشر لفعل σταυρόω في سياق الإعدام الروماني.
- source_word: λέγει αὐτοῖς ὁ Πιλᾶτος
  choice: فقال لهم بيلاطس
  rationale: المضارع التاريخي اليوناني صيغ بالماضي العربي المألوف في السرد، مع الفاء لاستمرار تتابع الحوار.
- source_word: Τὸν βασιλέα ὑμῶν σταυρώσω
  choice: أأصلب ملككم؟
  rationale: همزة الاستفهام مع المضارع تنقل السؤال التداولي الحاد الذي يؤديه صيغة الاحتمال التداولي في اليونانية، وتحفظ وصفه بأنه «ملككم».
- source_word: οἱ ἀρχιερεῖς
  choice: رؤساء الكهنة
  rationale: تعبير عربي واضح ومستقر للسلطات الكهنوتية القيادية التي يشير إليها الجمع اليوناني.
- source_word: Οὐκ ἔχομεν βασιλέα εἰ μὴ Καίσαρα
  choice: ليس لنا ملك إلا قيصر
  rationale: «إلا» تنقل بنية الاستثناء والحصر في εἰ μὴ بوضوح، وتحفظ حدة إعلان الولاء السياسي كما يورده النص.
theological_decisions:
- issue: إعلان رؤساء الكهنة حصر الملك في قيصر
  choice: ليس لنا ملك إلا قيصر
  alternative: ليس لنا ملك سوى قيصر
  rationale: تحفظ الصياغة الحصر الصريح والتوتر السردي واللاهوتي في تصريحهم، من غير إضافة حكم أو تفسير يتجاوز كلام النص.
translation_notes:
  register: العربية فصحى معاصرة، واضحة ومهيبة، مع حوار مباشر قوي. استُخدم «أبعده» بدل ترجمة حرفية جامدة للأمر اليوناني، وحُفظ التكرار لإبراز إلحاح الصياح.
