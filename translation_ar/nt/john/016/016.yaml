  text: A little while[a], and you no longer see me; and again a little while, and you will see me.
translation:
  language: ar
  text: بعد قليلٍ لا تعودون ترونني، وبعد قليلٍ سترونني من جديد.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يستعمل النص اليوناني فعلين مختلفين للرؤية هنا: θεωρέω في العبارة الأولى وὁράω في الثانية. وقد يوحي اختلافهما بفارق دقيق، لكنهما تُرجما كلاهما بـ«ترون» لأن المقابلة الأساسية في الآية زمنية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μικρὸν
  choice: بعد قليلٍ
  rationale: الصفة المحايدة المفردة مستعملة استعمالًا ظرفيًا للدلالة على مدة قصيرة، و«بعد قليل» تعبير عربي طبيعي يحفظ الإيجاز الزمني.
- source_word: οὐκέτι
  choice: لا تعودون
  rationale: تفيد انقطاع الرؤية بعد مدة وجيزة، و«لا تعودون» تؤدي معنى «ليس بعد/لم تعودوا» بسلاسة في السياق المستقبلي الذي يرسمه القول.
- source_word: θεωρεῖτέ
  choice: ترونني
  rationale: مع أن الفعل قد يحمل معنى النظر أو المعاينة، فإن «ترونني» تنقل معناه الأساسي طبيعيًا من غير افتعال فرق حاد عن الفعل اللاحق.
- source_word: πάλιν
  choice: أيضًا
  rationale: في تركيب «وبعد قليل أيضًا» تدل الكلمة على تجدّد الرؤية بعد انقطاعها، مع الحفاظ على توازن العبارتين.
- source_word: ὄψεσθέ
  choice: سترونني
  rationale: صيغة المستقبل من ὁράω تدل هنا على الرؤية الآتية؛ واستعمال «ترون» في الموضعين يحفظ التوازي ولا يفرض تمييزًا دلاليًا غير محسوم.
- source_word: με
  choice: ـني
  rationale: ضمير مفعول به يعود إلى يسوع، وقد أُلحق بالفعل على النحو العربي الطبيعي.
- source_word: καὶ
  choice: و
  rationale: تربط الواو أجزاء القول المتوازنة وتحفظ إيقاع البنية اليونانية من غير زيادة تفسيرية.
theological_decisions:
- issue: هل يُفرَّق بين θεωρέω وὁράω بفعلين عربيين مختلفين بما يوحي بنمطين مختلفين من الرؤية؟
  choice: ترجمة الفعلين بـ«ترون» في المتن
  alternative: «لا تعودون تعاينونني... سترونني» أو «لا تعودون ترونني... ستعاينونني»
  rationale: يتداخل معنى الفعلين بدرجة كبيرة في الاستعمال اليوحناوي، ولا يقتضي النص فرقًا لاهوتيًا حادًا بينهما. توحيد الترجمة يصون الغموض المشروع ويُبرز المقابلة الزمنية من غير تحميل الألفاظ ما لا يلزم.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقّرة. حُفظ التوازي والإيجاز، وجاءت العلامة [a] في المتن بعد الجملة التي تتناولها الحاشية.
