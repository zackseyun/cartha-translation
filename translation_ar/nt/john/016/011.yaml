  text: and concerning judgment[c][b][a], because the ruler of this world has been judged.
translation:
  language: ar
  text: وَأَمَّا الدَّيْنُونَةُ، فَلِأَنَّ حَاكِمَ هَذَا الْعَالَمِ[a][b] قَدْ دِينَ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «رئيس هذا العالم».'
    reason: lexical_alternative
  - marker: b
    text: يُرجَّح أن المقصود هو الشيطان؛ قارن يوحنا 12:31 و14:30.
    reason: cross_reference
  - marker: c
    text: 'أو: «صار تحت الدينونة». يدل زمن الفعل اليوناني التام على دينونة وقعت وبقي أثرها قائمًا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ κρίσεως
  choice: وَأَمَّا الدَّيْنُونَةُ
  rationale: 'تُقدِّم περί مع المضاف إليه موضوع الكلام، وتربط δέ هذا العنصر بما سبقه في السلسلة. وصيغة «وأما» طبيعية في العربية وتلائم التعداد السابق: الخطية والبر والدينونة.'
- source_word: ὅτι
  choice: فَلِأَنَّ
  rationale: تفيد ὅτι هنا التعليل؛ لذلك تُظهر «فلأن» بوضوح سبب التبكيت من جهة الدينونة.
- source_word: ὁ ἄρχων
  choice: حَاكِمَ
  rationale: يدل ἄρχων على صاحب سلطة أو حكم. و«حاكم» واضحة ومعاصرة، مع إثبات البديل التقليدي «رئيس» في الحاشية.
- source_word: τοῦ κόσμου τούτου
  choice: هَذَا الْعَالَمِ
  rationale: «هذا العالم» هي المقابلة المباشرة والطبيعية للعبارة، وتحافظ على الاستعمال اليوحناوي دون استبدال κόσμος بـ«الدهر».
- source_word: κέκριται
  choice: قَدْ دِينَ
  rationale: الفعل ماضٍ تام مبني للمجهول؛ و«قد دين» يحفظ المبني للمجهول ووقوع الدينونة، من غير تضييق المعنى إلى «أُدين» بمعنى حُكم عليه بالإدانة وحدها. وتوضح الحاشية استمرار أثر الحكم الذي يوحي به التام اليوناني.
theological_decisions:
- issue: هوية «حاكم هذا العالم»
  choice: الإبقاء على اللقب دون تسمية الشيطان صراحة في المتن
  alternative: «الشيطان، حاكم هذا العالم»
  rationale: يُفهَم اللقب على الأرجح أنه يشير إلى الشيطان في ضوء يوحنا 12:31 و14:30، لكن الآية نفسها تستعمل اللقب لا الاسم؛ لذلك تُحفظ صياغة النص ويُذكر الترجيح في الحاشية.
- issue: دلالة κέκριται
  choice: «قد دين»
  alternative: «قد حُكم عليه» أو «قد أُدين»
  rationale: يحفظ هذا الاختيار المجال الدلالي للفعل κρίνω ولا يحسم في المتن أن المقصود هو الإدانة وحدها، مع إبراز وقوع الدينونة واستمرار نتيجتها في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُعملت «وأما» لربط العبارة بالتعداد في السياق، ووُضعت علامات الحواشي مباشرة بعد الألفاظ التي تشرحها.
