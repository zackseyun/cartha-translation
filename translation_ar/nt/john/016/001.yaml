  text: Ταῦτα λελάληκα ὑμῖν ἵνα μὴ σκανδαλισθῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/001.yaml
  text: I have spoken these things to you so that you may not fall away.
translation:
  language: ar
  text: «قلتُ لكم هذه الأمور لكي لا تتعثّروا[a].»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «تسقطوا» أو «تأخذكم العثرة». وقد يدل الفعل اليوناني هنا على أن يُدفَع المرء إلى التعثر في إيمانه، حتى ينصرف عنه.'
    reason: بدائل معجمية وبيان قوة اللفظ في سياق الاضطهاد من غير حصر معناه في الارتداد.
lexical_decisions:
- source_word: Ταῦτα
  choice: هذه الأمور
  rationale: يحفظ صيغة الجمع المحايد وإحالتها إلى كلام يسوع السابق، وهو تعبير عربي طبيعي وواضح.
- source_word: λελάληκα
  choice: قلتُ
  rationale: الفعل اليوناني في صيغة التام يدل على كلام سبق قوله وما زال ذا صلة بالحاضر. «قلتُ» أفصح وأطبع في العربية من النقل الحرفي «تكلّمتُ بهذه الأمور»، مع بقاء الأثر السياقي.
- source_word: ὑμῖν
  choice: لكم
  rationale: ينقل ضمير المخاطبين في الجمع بوضوح.
- source_word: ἵνα μὴ
  choice: لكي لا
  rationale: يحفظ دلالة الغاية مع النفي بصياغة عربية فصيحة وطبيعية.
- source_word: σκανδαλισθῆτε
  choice: تتعثّروا
  rationale: يحفظ الصورة المعجمية للفعل σκανδαλίζω وشيئًا من بنائه غير الفاعلي، من غير حصر معناه في الارتداد النهائي؛ ويبيّن الهامش أن التعثر قد يبلغ الانصراف عن الإيمان.
theological_decisions:
- issue: مدى دلالة σκανδαλισθῆτε في سياق الاضطهاد
  choice: تتعثّروا
  alternative: ترتدّوا؛ تسقطوا؛ تأخذكم العثرة
  rationale: السياق اللاحق يجعل انهيار الإيمان احتمالًا جديًا، لكن اللفظ نفسه يحتفظ بصورة التعثر ويمكن أن يشمل نطاقًا أوسع من الارتداد الصريح. لذلك يحفظ المتن الغموض الأصيل، ويشرح الهامش قوته السياقية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «قلتُ لكم هذه الأمور» بدل تركيب أكثر حرفية وثقلًا، وحُفظت صورة التعثر في المتن مع توضيح مداها في الهامش.
