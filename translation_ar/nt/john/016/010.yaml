  text: and concerning righteousness[a], because I am going to the Father and you no longer see me.
translation:
  language: ar
  text: وأمّا عن البرّ[a]، فلأنّي ذاهب إلى الآب، ولا تعودون ترونني.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «العدل». يمكن للكلمة اليونانية أن تدل على البرّ والعدل؛ واختير «البرّ» في المتن لأن السياق يربطه بذهاب يسوع إلى الآب.
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ
  choice: عن
  rationale: تحافظ «عن» على تكرار البنية في سلسلة العبارات في الأعداد 9–11، وهي موجزة وطبيعية في العربية.
- source_word: δικαιοσύνης
  choice: البرّ
  rationale: «البرّ» هو المقابل العربي الأنسب هنا للدلالة على الاستقامة وثبوت الحق، مع إبقاء معنى «العدل» الممكن في الحاشية دون حصر اللفظ في تفسير واحد.
- source_word: δέ
  choice: و
  rationale: تفيد الأداة هنا الانتقال الإضافي إلى العنصر التالي في التعداد، لا مقابلة قوية؛ لذلك تناسبها واو العطف.
- source_word: ὅτι
  choice: فلأنّي
  rationale: تنقل الفاء اتصال التعليل بما قبلها، وتنقل «لأنّ» القوة السببية للأداة ὅτι في هذا السياق.
- source_word: πρὸς τὸν πατέρα
  choice: إلى الآب
  rationale: تفيد πρός مع فعل الحركة الوجهة، والنص اليوناني يقول «الآب» من غير إضافة ضمير الملكية.
- source_word: ὑπάγω
  choice: ذاهب
  rationale: تنقل صيغة المضارع ذات الدلالة المستقبلية القريبة، وتحافظ على فورية رحيل يسوع من غير تحميل الفعل معنى تفسيريًا زائدًا.
- source_word: οὐκέτι
  choice: لا تعودون
  rationale: تعبير عربي طبيعي يدل على انقطاع الرؤية من ذلك الحين فصاعدًا.
- source_word: θεωρεῖτέ
  choice: ترونني
  rationale: السياق يدل على رؤية يسوع ومعاينته؛ و«ترونني» واضحة وحديثة ولا تضيف إلى الفعل معنى التأمل أو الفحص.
theological_decisions:
- issue: دلالة δικαιοσύνη في سياق ذي وزن لاهوتي
  choice: البرّ
  alternative: العدل
  rationale: يلائم «البرّ» سياق ذهاب يسوع إلى الآب وما ينطوي عليه من إظهار استقامته وثبوت حقه، بينما تحفظ الحاشية إمكان دلالة اللفظ اليوناني على «العدل» من غير أن تجعل تفسير التبرئة صريحًا في المتن.
translation_notes:
  register: صياغة عربية فصحى واضحة وموجزة، تحافظ على كون العبارة جزءًا من تعداد متصل في الأعداد 9–11. استُعمل «الآب» بوصفه اللقب العلائقي المألوف، وتُركت الصلة الدقيقة بين البرّ وذهاب يسوع إلى الآب دون توسع تفسيري داخل المتن.
