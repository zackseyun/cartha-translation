  yaml_path: translation/nt/john/016/008.yaml
  text: And when that one comes[c][b][a], he will convict the world concerning sin and concerning righteousness and concerning judgment.
translation:
  language: ar
  text: وعندما يأتي ذاك[a][c]، سيُبكِّت العالم بشأن الخطيئة، وبشأن البر[b]، وبشأن الحُكم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «هو»؛ في اليونانية اسم إشارة مؤكد، ومعناه الحرفي «ذاك»، وهو عائد إلى المعزّي الآتي.
    reason: lexical_alternative
  - marker: b
