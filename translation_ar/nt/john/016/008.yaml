lexical_decisions:
- source_word: ἐλθὼν
  choice: عندما يأتي
  rationale: اسم الفاعل الأَوْرَسْتي يؤدي هنا معنى زمنيًا؛ وصيغة «عندما يأتي» تنقل هذا المعنى بوضوح وطبيعية من غير تكلّف حرفي.
- source_word: ἐκεῖνος
  choice: ذاك
  rationale: اسم الإشارة اليوناني مؤكد ويعود في السياق إلى المعزّي الآتي. أبقت «ذاك» هذا التوكيد بدل اختزاله إلى ضمير مجرد.
- source_word: ἐλέγξει
  choice: سيُبكِّت
  rationale: الفعل يدل على كشف الخطأ وإظهار الذنب وإقامة الحجة؛ و«يُبكِّت» يحافظ على قوته الأخلاقية والقضائية من غير أن يحصره في الإدانة النهائية.
- source_word: τὸν κόσμον
  choice: العالم
  rationale: تحافظ «العالم» على سعة اللفظ في الاستعمال اليوحناوي، من غير حصره تفسيريًا في نظام العالم أو في فئة محددة من الناس.
- source_word: περὶ
  choice: بشأن
  rationale: كُررت في العربية ثلاث مرات للمحافظة على التوازي البلاغي والبنية التفسيرية في اليونانية.
- source_word: ἁμαρτίας
  choice: الخطيئة
  rationale: نُقل الاسم مفردًا كما في اليونانية، مع ترك الآية التالية تحدد وجه المقصود.
- source_word: δικαιοσύνης
  choice: البر
  rationale: «البر» هو المقابل الأوسع والأرسخ في هذا السياق، ويلائم التفسير المسيحاني في الآية التالية، مع إثبات «العدل» بديلًا ممكنًا في الحاشية.
- source_word: κρίσεως
  choice: الحُكم
  rationale: يحفظ «الحُكم» المجال القضائي للفظ κρίσις ولا يضيّقه مسبقًا إلى نتيجة الإدانة وحدها.
theological_decisions:
- issue: مرجع ἐκεῖνος وقوته التوكيدية
  choice: اسم الإشارة «ذاك» العائد إلى المعزّي/الروح في السياق
  alternative: الضمير «هو» مع إبقاء التوكيد ضمنيًا
  rationale: السياق السابق يحدد مرجع الشخصية الآتية، واسم الإشارة يحفظ التوكيد اليوناني من غير إضافة دعوى عقائدية إلى النص.
- issue: دلالة δικαιοσύνη
  choice: البر
  alternative: العدل
  rationale: «البر» يحفظ المجال الأخلاقي والعلاقي الأوسع للمصطلح ويلائم تفسير الآية 10، بينما يبقى «العدل» احتمالًا معجميًا مشروعًا.
- issue: مدى κρίσις
  choice: الحُكم
  alternative: الدينونة
  rationale: اختير اللفظ الأوسع حتى لا يُحسم سلفًا هل المقصود فعل القضاء أم نتيجته بالإدانة.
translation_notes:
  register: لغة عربية فصحى حديثة واضحة وذات نبرة كتابية رصينة. حُفظ تكرار «بشأن» لإبراز الثلاثية اليونانية، واستُعمل «ذاك» مع ما فيه من توكيد مقصود، مع توضيح البديل الأسلس في الحاشية.
