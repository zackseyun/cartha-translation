base_translation:
  language: en
  yaml_path: translation/nt/john/016/022.yaml
  text: So you also now have sorrow; but I will see you again[a], and your heart will rejoice, and no one will take your joy from you.
translation:
  language: ar
  text: فأنتم أيضًا تحزنون الآن، لكنني سأراكم من جديد[a]، وستفرح قلوبكم، ولا أحد ينزع فرحكم منكم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «سترونني من جديد». لكن النص اليوناني يقرأ حرفيًا: «سأراكم من جديد»، وقد يشدد ذلك على مبادرة يسوع بالعودة إلى تلاميذه.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: فـ
  rationale: تفيد النتيجة والربط بتشبيه الولادة السابق، وتؤديها الفاء طبيعيًا في العربية.
- source_word: νῦν μὲν λύπην ἔχετε
  choice: تحزنون الآن
  rationale: صياغة عربية طبيعية تنقل حالة الحزن الحاضرة، بينما يظهر التقابل الذي تدل عليه μέν في «لكن» اللاحقة.
- source_word: πάλιν δὲ
  choice: لكن... من جديد
  rationale: تنقل «لكن» المقابلة بين الحزن الحاضر واللقاء الآتي، وتنقل «من جديد» معنى تجدد اللقاء.
- source_word: ὄψομαι ὑμᾶς
  choice: سأراكم
  rationale: 'تحافظ على الصيغة اليونانية الصريحة: يسوع هو الفاعل والمخاطبون هم المفعول به، من غير مواءمتها مع الصياغة المتوقعة «سترونني».'
- source_word: χαρήσεται ὑμῶν ἡ καρδία
  choice: فتفرح قلوبكم
  rationale: تعبير عربي واضح يحافظ على صورة القلب وعلى القوة الفعلية للفعل؛ وجاء الجمع لموافقة المخاطبين المتعددين واستعمال العربية الطبيعي.
- source_word: τὴν χαρὰν ὑμῶν
  choice: فرحكم
  rationale: ينقل الإضافة مباشرة ويحافظ على الصلة الاشتقاقية بين «تفرح» و«فرحكم».
- source_word: οὐδεὶς αἴρει ἀφ’ ὑμῶν
  choice: ولا أحد يسلبكم
  rationale: الفعل «يسلب» طبيعي مع الفرح ويفيد انتزاعه من أصحابه. وحُفظ المضارع اليوناني بوصفه تقريرًا مؤكدًا ذا دلالة عامة في سياق المستقبل.
theological_decisions:
- issue: فاعل اللقاء المستقبلي ووجه التأكيد فيه
  choice: سأراكم من جديد
  alternative: سترونني من جديد
  rationale: النص اليوناني يجعل المتكلم فاعلًا والمخاطبين مفعولًا بهم بوضوح. إبقاء ذلك يصون مبادرة يسوع في اللقاء ولا ينسّق العبارة قسرًا مع يوحنا 16:16.
- issue: زمن سلب الفرح
  choice: ولا أحد يسلبكم فرحكم
  alternative: ولن يسلبكم أحد فرحكم
  rationale: الفعل اليوناني αἴρει مضارع، ويمكن فهمه تقريرًا عامًا مؤكدًا ضمن سياق ذي توجه مستقبلي. أبقت الترجمة هذا التوتر الزمني بدل تحويله صراحة إلى المستقبل.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعملت «تحزنون» بدل تركيب اسمي أثقل، مع الحفاظ على تقابل الحزن والفرح. وأُبقيت القراءة الحرفية «سأراكم» في المتن، مع بيان الصياغة البديلة الشائعة في الحاشية.
