  source_fidelity: 'المتن يحافظ بدقة على ترتيب المعنى الأساسي في اليونانية: الحزن الحاضر، ثم رؤية يسوع لتلاميذه من جديد، ثم فرح القلب، ثم عدم انتزاع الفرح. و«سأراكم» ترجمة صحيحة ومهمة لـ ὄψομαι ὑμᾶς، إذ إن يسوع هو الفاعل صراحةً. يُستحسن إظهار دلالة المستقبل في χαρήσεται بوضوح أكبر، وترجمة ἀφ’ ὑμῶν («منكم») في العبارة الأخيرة بدل الاكتفاء بها ضمنًا.'
  naturalness: الأسلوب فصيح ومفهوم. لكن «ولا أحد يسلبكم فرحكم» أقل سلاسة قليلًا، وقد تُفهم بوصفها تركيبًا ذا مفعولين. و«ولا أحد ينزع فرحكم منكم» أوضح وأقرب إلى صورة النص. كما أن «وستفرح قلوبكم» أوضح زمنيًا من «فتفرح قلوبكم».
  terminology: «الحزن» و«الفرح» و«قلوبكم» ألفاظ مناسبة وواضحة. ويُحافظ «ينزع ... من» على معنى αἴρει ἀφ’، أي الانتزاع من أصحابه، من غير تحميل العبارة تفسيرًا مذهبيًا.
