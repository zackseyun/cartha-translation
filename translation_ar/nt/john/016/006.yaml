  text: ἀλλ’ ὅτι ταῦτα λελάληκα ὑμῖν ἡ λύπη πεπλήρωκεν ὑμῶν τὴν καρδίαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/006.yaml
  text: But because I have spoken these things to you[a], sorrow has filled your heart.
translation:
  language: ar
  text: لكِنْ لأَنِّي قُلْتُ لَكُمْ هذِهِ الأُمُورَ، مَلَأَ الحُزْنُ قَلْبَكُمْ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «قُلُوبَكُمْ». في اليونانية جاء «القلب» مفردًا مع ضمير مخاطبين جمع، وقد تعبّر هذه الصياغة عن الحزن الباطني المشترك بين الجماعة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: لكِنْ
  rationale: أداة استدراك تُظهر المقابلة مع الكلام السابق، و«لكن» هي الصياغة العربية الطبيعية هنا.
- source_word: ὅτι
  choice: لأَنِّي
  rationale: تؤدي ὅτι هنا معنى السببية؛ وضمير المتكلم مستفاد من الفعل اليوناني التالي، فتأتي «لأني قلت» عربية واضحة.
- source_word: ταῦτα
  choice: هذِهِ الأُمُورَ
  rationale: تحفظ جمع اسم الإشارة وإحالته إلى الأمور التي سبق أن تكلم بها يسوع.
- source_word: λελάληκα
  choice: قُلْتُ
  rationale: الفعل تامّ الصيغة في اليونانية ويشير إلى كلام صدر وبقي أثره. «قلت» أنسب في العربية الطبيعية مع مفعول هو «هذه الأمور»، من غير إثقال الصياغة بمحاولة نقل الصيغة صرفيًا.
- source_word: ὑμῖν
  choice: لَكُمْ
  rationale: ينقل بوضوح ضمير المخاطبين الجمع ووظيفة المجرور الدالة على المتلقي.
- source_word: ἡ λύπη
  choice: الحُزْنُ
  rationale: لفظ عربي واضح ورصين يدل على الألم النفسي العميق، ويلائم صورة امتلاء القلب.
- source_word: πεπλήρωκεν
  choice: مَلَأَ
  rationale: يحفظ المعنى التصويري المباشر للفعل πληρόω. يفيد السياق أن الامتلاء الناتج عن الكلام قائم في الحاضر، وإن صيغ الفعل عربيًا بالماضي الطبيعي.
- source_word: ὑμῶν τὴν καρδίαν
  choice: قَلْبَكُمْ
  rationale: يحفظ المفرد «قلب» مع ضمير المخاطبين الجمع كما في اليونانية، ويعبّر طبيعيًا عن الحالة الباطنة المشتركة للجماعة.
theological_decisions:
- issue: المفرد الجماعي «قلبكم» أم الجمع التوزيعي «قلوبكم»
  choice: قَلْبَكُمْ
  alternative: قُلُوبَكُمْ
  rationale: النص اليوناني يجمع بين ضمير ملكية للجمع واسم مفرد، وقد يصور التلاميذ جماعةً تشترك في حالة باطنية واحدة. إبقاء المفرد يحفظ هذا التوتر الدلالي من غير أن ينفي حزن كل فرد.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُعملت صياغة طبيعية غير متكلفة، مع الحفاظ على صورة امتلاء القلب وعلى المفرد الجماعي في الأصل، وإيضاح البديل في الحاشية.
