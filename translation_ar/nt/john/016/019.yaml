  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ⸀ἔγνω Ἰησοῦς ὅτι ἤθελον αὐτὸν ἐρωτᾶν, καὶ εἶπεν αὐτοῖς· Περὶ τούτου ζητεῖτε μετ’ ἀλλήλων ὅτι εἶπον· Μικρὸν καὶ οὐ θεωρεῖτέ με, καὶ πάλιν μικρὸν καὶ ὄψεσθέ με;
base_translation:
  language: en
  yaml_path: translation/nt/john/016/019.yaml
  text: Jesus knew that they wanted to ask him[a], and he said to them, “Are you discussing this with one another, that I said, ‘A little while, and you no longer see me, and again a little while[c][b], and you will see me’?”
translation:
  language: ar
  text: 'وعرف يسوع أنهم يريدون أن يسألوه، فقال لهم: «هل تتساءلون فيما بينكم عن هذا، لأنني قلت: ‹بعد قليل لا ترونني، ثم بعد قليل ترونني›؟»[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «هل تتساءلون فيما بينكم عن هذا، أني قلت...؟» فالكلمة اليونانية قد تفيد السبب، أو تقدم مضمون ما كانوا يتساءلون عنه.'
    reason: alternative_reading
  - marker: b
    text: 'يستعمل الأصل اليوناني فعلين مختلفين للرؤية: الأول قد يفيد المشاهدة أو المعاينة (θεωρέω)، والثاني هو الفعل العام «يرى» (ὁράω). تُرجم كلاهما هنا بـ«ترونني» حفاظًا على التوازي الطبيعي.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγνω
  choice: عرف
  rationale: يفيد الفعل هنا إدراك يسوع لنية التلاميذ، و«عرف» تعبير عربي مباشر وطبيعي.
- source_word: ἤθελον αὐτὸν ἐρωτᾶν
  choice: يريدون أن يسألوه
  rationale: ينقل معنى الإرادة المستمرة والسؤال الشخصي بوضوح من غير إيحاء بالاستجواب.
- source_word: Περὶ τούτου ζητεῖτε μετ’ ἀλλήλων
  choice: أعن هذا تتساءلون فيما بينكم
  rationale: ζητέω مع العبارة التبادلية يدل سياقيًا على تداولهم السؤال ومحاولتهم فهم القول؛ و«تتساءلون» تحافظ كذلك على صلة المعنى بما أرادوا أن يسألوا يسوع عنه.
- source_word: ὅτι εἶπον
  choice: لأني قلت
  rationale: يجوز أن تكون ὅτι سببية هنا، وهو تركيب عربي طبيعي بعد السؤال عن موضوع تداولهم؛ أما احتمال كونها شارحة لمضمون التساؤل فموثق في الحاشية.
- source_word: Μικρὸν
  choice: بعد قليل
  rationale: الصفة المحايدة مستعملة ظرفيًا للدلالة على مدة قصيرة، و«بعد قليل» تلائم تسلسل القول في العربية.
- source_word: οὐ θεωρεῖτέ με
  choice: لا ترونني
  rationale: يحافظ على المضارع المنفي في اليونانية من غير إضافة «بعد الآن» غير المصرح بها لفظًا.
- source_word: πάλιν μικρὸν
  choice: ثم بعد قليل
  rationale: «ثم» تنقل الانتقال إلى المرحلة التالية، مع بقاء معنى المدة القصيرة.
- source_word: ὄψεσθέ με
  choice: ترونني
  rationale: المضارع العربي بعد الظرف المستقبلي يؤدي معنى المستقبل بطبيعية، ويحافظ على توازي العبارتين.
theological_decisions:
- issue: الفرق بين θεωρέω وὁράω في عبارتي الرؤية
  choice: ترجمة الفعلين بـ«ترونني» في المتن
  alternative: تمييز الأول مثل «تشاهدونني» والثاني «ترونني»
  rationale: السياق يركز على غياب الرؤية ثم عودتها، ولا يثبت هنا فرقًا لاهوتيًا حادًا بين نوعين من الرؤية؛ وتوضح الحاشية الفرق المعجمي.
- issue: دلالة ὅτι بعد سؤال يسوع
  choice: «لأني قلت» على المعنى السببي
  alternative: «أني قلت» على أنه بيان لمضمون التساؤل
  rationale: التركيب اليوناني يحتمل السببية وبيان المضمون، فاختيرت صياغة عربية طبيعية مع إبقاء الاحتمال الآخر صريحًا في الحاشية.
- issue: قوة سؤال يسوع
  choice: 'صياغته سؤالًا مباشرًا: «أعن هذا تتساءلون...؟»'
  alternative: 'صياغته تقريرًا: «إنكم تتساءلون...»'
  rationale: تحافظ الصياغة الاستفهامية على نبرة يسوع الكاشفة لتداولهم فيما بينهم من غير زيادة تفسيرية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعمل «تتساءلون فيما بينكم» بدل تعبير حرفي من قبيل «تطلبون» لأن السياق يدل على تداول التلاميذ معنى القول. وُضعت علامتا الحاشية بعد الاقتباس لارتباطهما بصياغة القول كله، مع ظهور كلتا العلامتين في المتن.
