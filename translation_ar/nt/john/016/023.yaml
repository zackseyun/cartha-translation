  text: And in that day you will ask me nothing[a]. Truly, truly, I say to you, whatever you ask the Father in my name[b], he will give to you.
translation:
  language: ar
  text: 'وفي ذلك اليوم لن تسألوني عن شيء[a]. الحق الحق أقول لكم: كل ما تطلبونه من الآب باسمي، يعطيكم إياه.'
  philosophy: optimal-equivalence
  footnotes:
