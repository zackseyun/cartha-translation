    text: 'يستعمل اليوناني فعلين مختلفين: الأول (ἐρωτάω) هنا للسؤال أو الاستفهام، والثاني (αἰτέω) في الجملة التالية للطلب أو الالتماس.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: في ذلك اليوم
  rationale: تعبير زمني عربي طبيعي يحافظ على الإشارة اليوحناوية وما قد تحمله من أفق مستقبلي.
- source_word: ἐμὲ οὐκ ἐρωτήσετε οὐδέν
  choice: لن تسألوني عن شيء
  rationale: يبقي المفعول «ني» صريحًا ويحفظ النفي الشامل، مع استعمال «عن» الملائم للسؤال الاستفهامي في العربية.
- source_word: ἀμὴν ἀμὴν
  choice: الحق الحق
  rationale: صياغة عربية مفهومة وموقرة تحفظ التكرار التوكيدي المميز في إنجيل يوحنا.
- source_word: ἄν τι αἰτήσητε
  choice: كل ما تطلبونه
  rationale: ينقل الطلب غير المحدد بصياغة عربية طبيعية، ويميز بالفعل «تطلبون» بين الالتماس هنا والسؤال في أول الآية.
- source_word: τὸν πατέρα
  choice: من الآب
  rationale: الفعل العربي «طلب» في معنى الالتماس يتعدى طبيعيًا بـ«من»، مع عدم إضافة ضمير ملكية غير موجود في اليونانية.
- source_word: ἐν τῷ ὀνόματί μου
  choice: باسمي
  rationale: التعبير العربي المألوف المقابل لـ«في اسمي»، ويحفظ القوة التمثيلية واللاهوتية دون شرح زائد.
- source_word: δώσει ὑμῖν
  choice: يعطيكم إياه
  rationale: يستدعي ضميرًا يعود إلى المطلوب لتستقيم العبارة العربية، من غير توسيع المعنى إلى تفسير إضافي.
theological_decisions:
- issue: التمييز بين ἐρωτάω الموجه إلى يسوع وαἰτέω الموجه إلى الآب
  choice: ترجمة الأول «تسألوني عن» والثاني «تطلبونه من»، مع توثيق الفرق في الحاشية.
  alternative: ترجمة الفعلين كليهما بـ«تسألون» أو تفسير الأول بـ«تستفهمون مني».
  rationale: العربية تتيح إظهار الفرق الدلالي طبيعيًا من غير حسم كامل لمدى التباين بين الفعلين.
- issue: نطاق الوعد المتعلق بالطلب باسم يسوع
  choice: إبقاء الوعد مباشرًا كما في النص من دون إضافة شروط تفسيرية.
  alternative: إضافة قيد مثل «إن كان موافقًا لمشيئتي».
  rationale: السياق الأوسع قد يوجه التفسير، لكن القيد غير مصرح به في هذه الآية، فينبغي ألا تضيفه الترجمة.
- issue: موضع عبارة «باسمي» واحتمال تعلقها
  choice: 'وصلها في النص العربي بالطلب: «كل ما تطلبونه من الآب باسمي».'
  alternative: 'وصلها بالعطاء وفق ترتيب بعض الشواهد: «يعطيكم إياه باسمي».'
  rationale: القراءة المختارة مفهومة ومشهورة، لكن جهاز SBLGNT يشير إلى تغاير في ترتيب العبارة قد يسمح بتعلقها بالعطاء، ولذلك وُثّق الاحتمال في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعمل «الآب» للمصطلح اليوحناوي، وحُفظ التوكيد «الحق الحق». أُظهر الفرق بين السؤال الاستفهامي والطلب الالتماسي في صلب النص، مع حاشيتين تحمل علامتاهما في المتن.
