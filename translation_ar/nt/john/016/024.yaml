  text: ἕως ἄρτι οὐκ ᾐτήσατε οὐδὲν ἐν τῷ ὀνόματί μου· αἰτεῖτε καὶ λήμψεσθε, ἵνα ἡ χαρὰ ὑμῶν ᾖ πεπληρωμένη.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/024.yaml
  text: Until now you have asked for nothing in my name[a]. Ask, and you will receive[c][b], so that your joy may be full.
translation:
  language: ar
  text: إلى الآن لم تطلبوا شيئًا باسمي[a]. اطلبوا فتنالوا[b]، لكي يكون فرحكم كاملًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: تفيد عبارة «باسمي» طلبًا مرتبطًا بشخص يسوع وسلطانه ورسالته؛ وقد أُبقيت العبارة كما هي دون حصرها في معنى واحد.
    reason: lexical_alternative
  - marker: b
    text: 'أو: «داوموا على الطلب فتنالوا». قد تدل صيغة الأمر المضارع في السياق على فعل مستمر أو متكرر.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕως ἄρτι
  choice: إلى الآن
  rationale: 'تعبير عربي طبيعي يحفظ الدلالة الزمنية: حتى اللحظة الحاضرة.'
- source_word: οὐκ ᾐτήσατε οὐδὲν
  choice: لم تطلبوا شيئًا
  rationale: ينقل تركيب النفي اليوناني بمعناه العربي الطبيعي «لم تطلبوا أي شيء»، مع استعمال «شيئًا» الأكثر إيجازًا وفصاحة.
- source_word: ἐν τῷ ὀνόματί μου
  choice: باسمي
  rationale: يحفظ العبارة اليوحناوية الموجزة وما تتسع له من صلة بشخص يسوع وسلطانه ورسالته، من غير حصرها في تفسير واحد.
- source_word: αἰτεῖτε
  choice: اطلبوا
  rationale: صيغة أمر واضحة وطبيعية، ولا تفرض على النص معنى الاستمرار أو التكرار مع بقاء هذا الاحتمال ملحوظًا في الحاشية.
- source_word: λήμψεσθε
  choice: تنالوا
  rationale: فعل عربي فصيح وطبيعي في سياق الطلب والاستجابة، ويعبر عن التلقي دون النبرة العامية التي قد تحملها بدائل أخرى.
- source_word: ἵνα
  choice: لكي
  rationale: تحفظ دلالة الغاية أو النتيجة المحتملة في السياق بصياغة عربية واضحة.
- source_word: ἡ χαρὰ ὑμῶν
  choice: فرحكم
  rationale: مقابل مباشر وطبيعي للتركيب الإضافي اليوناني.
- source_word: ᾖ πεπληρωμένη
  choice: يكون ... كاملًا
  rationale: ينقل حالة الاكتمال الناتجة التي يدل عليها التركيب اليوناني، بصياغة عربية طبيعية؛ ويمكن أيضًا تصويرها بلفظ الامتلاء.
theological_decisions:
- issue: معنى الطلب «باسمي»
  choice: الإبقاء على العبارة الحرفية «باسمي» بلا توسع تفسيري
  alternative: بسلطاني؛ نيابةً عني؛ في اتحاد معي
  rationale: العبارة غنية الدلالة ولا يحيط بها تفسير واحد؛ إبقاؤها يصون سعتها والتوتر اللاهوتي فيها.
- issue: مدى الوعد «اطلبوا تنالوا»
  choice: نقل الوعد كما يرد في سياقه من غير إضافة شروط تفسيرية إلى المتن
  alternative: إضافة عبارات مثل «بحسب مشيئتي» أو «إن كان الطلب صحيحًا»
  rationale: هذه القيود ليست مذكورة في هذه الآية، وإقحامها يحسم ضمن المتن ما ينبغي فهمه في ضوء السياق الأوسع.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. استُعمل «باسمي» بدل «في اسمي» لأنه التعبير العربي الطبيعي مع الحفاظ على مضمون العبارة اليونانية. وُضع كل مؤشر حاشية في المتن، ورتبت الحواشي بحسب مواضعها.
