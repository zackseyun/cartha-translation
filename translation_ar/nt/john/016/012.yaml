base_translation:
  language: en
  yaml_path: translation/nt/john/016/012.yaml
  text: I still have many things to say to you[a], but you are not able to bear them now.
translation:
  language: ar
  text: لا يزال لديَّ أمور كثيرة أقولها لكم، لكنكم لا تستطيعون احتمالها الآن.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لا تستطيعون حملها الآن» أو «لا تطيقونها الآن». يمكن أن يدل الفعل اليوناني على الحمل أو الاحتمال أو التحمّل.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτι
  choice: لا يزال
  rationale: ينقل معنى الاستمرار وبقاء كلام إضافي لدى يسوع، بصياغة عربية معاصرة طبيعية.
- source_word: πολλὰ
  choice: أمور كثيرة
  rationale: الصفة المحايدة في صيغة الجمع مستعملة استعمال الاسم؛ وإظهار الموصوف بلفظ «أمور» واضح وطبيعي في العربية.
- source_word: ἔχω ὑμῖν λέγειν
  choice: لديَّ ... أقولها لكم
  rationale: يحافظ على معنى وجود كلام باقٍ يريد يسوع قوله لهم، مع ترتيب عربي سلس.
- source_word: ἀλλ’ οὐ δύνασθε
  choice: لكنكم لا تستطيعون
  rationale: ينقل أداة الاستدراك ومعنى القدرة الصريح في الفعل اليوناني.
- source_word: βαστάζειν
  choice: احتمالها
  rationale: يحفظ معنى تحمّل ثقل الكلام أو الصبر عليه، من غير اختزاله في الفهم العقلي وحده.
- source_word: ἄρτι
  choice: الآن
  rationale: يعبّر بإيجاز عن عجزهم في الوقت الحاضر، في مقابل ما سيأتي لاحقًا في السياق.
theological_decisions:
- issue: دلالة βαστάζειν في وصف عجز التلاميذ الحاضر
  choice: هم عاجزون الآن عن احتمال ثقل الأمور الإضافية التي سيقولها يسوع.
  alternative: هم عاجزون الآن عن فهمها تمامًا، أو عن تحمّل سماعها.
  rationale: قد يدل الفعل على الحمل أو الاحتمال، ويمكن أن يشمل الاستعداد الفكري والروحي معًا؛ لذلك لا تُحصر العبارة في الفهم وحده ولا في الألم النفسي وحده.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُعملت «لديَّ» بدل تراكيب أثقل، وحُفظت استعارة الاحتمال مع بيان بدائلها في الحاشية.
