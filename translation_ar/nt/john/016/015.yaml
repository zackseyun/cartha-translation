id: JHN.16.15
reference: John 16:15
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: πάντα ὅσα ἔχει ὁ πατὴρ ἐμά ἐστιν· διὰ τοῦτο εἶπον ὅτι ἐκ τοῦ ἐμοῦ λαμβάνει καὶ ἀναγγελεῖ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/015.yaml
  text: Everything that the Father has is mine[a]. That is why I said that he takes from what is mine and will declare it to you.
translation:
  language: ar
  text: كلُّ ما للآب هو لي. لذلك قلتُ إنّه يأخذ[a] ممّا هو لي، وسيعلنه لكم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يتلقّى».'
    reason: بديل معجمي يحفظ إمكان فهم λαμβάνει بمعنى التلقّي لا الأخذ.
lexical_decisions:
- source_word: πάντα ὅσα
  choice: كلُّ ما
  rationale: تعبير عربي طبيعي يحفظ الشمول والتوكيد في العبارة اليونانية.
- source_word: ἔχει ὁ πατήρ
  choice: للآب
  rationale: يفيد ما لدى الآب وما يخصّه دون إثقال العبارة بالفعل «يملك»، ويتلاءم مع جملة الملكية التالية.
- source_word: ἐμά ἐστιν
  choice: هو لي
  rationale: ينقل دلالة الملكية القوية مباشرةً ويحافظ على إيجاز الأصل.
- source_word: διὰ τοῦτο
  choice: لذلك
  rationale: أداة ربط استنتاجية واضحة وطبيعية في العربية المعاصرة.
- source_word: εἶπον
  choice: قلتُ
  rationale: يحفظ دلالة الماضي البسيط في الفعل اليوناني.
- source_word: ἐκ τοῦ ἐμοῦ
  choice: ممّا هو لي
  rationale: يفكّ الإضمار اليوناني بعبارة عربية واضحة مع إبقاء المعنى متعلقًا بما يخصّ الابن.
- source_word: λαμβάνει
  choice: يأخذ
  rationale: يحفظ المعنى المباشر الممكن للفعل، مع إثبات البديل «يتلقّى» في الحاشية لصون الاحتمال المعجمي.
- source_word: ἀναγγελεῖ
  choice: سيعلنه
  rationale: يحفظ زمن المستقبل ودلالة الإبلاغ والإعلان ذات الطابع الكاشف في السياق.
- source_word: ὑμῖν
  choice: لكم
  rationale: مقابل عربي مباشر للمفعول غير المباشر الموجّه إلى التلاميذ.
theological_decisions:
- issue: علاقة ما للآب بالابن
  choice: كلُّ ما للآب هو لي
  alternative: كلُّ ما يملكه الآب يخصّني
  rationale: تحفظ الصياغة قوة قول الابن إن كل ما للآب هو له، من غير إدخال مصطلحات عقائدية لاحقة أو توسيع يتجاوز النص.
- issue: تلقي الروح ممّا للابن
  choice: يأخذ ممّا هو لي
  alternative: يتلقّى ممّا هو لي
  rationale: يحتمل λαμβάνει معنى الأخذ أو التلقّي؛ أُبقي «يأخذ» في المتن وأُثبت «يتلقّى» في الحاشية حتى لا تُحسم الدلالة اللاهوتية الدقيقة ضمنًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة، بجمل موجزة قريبة من بنية الأصل من غير جمود. وُضع رمز الحاشية بعد الفعل الذي تتعلّق به مباشرةً.
