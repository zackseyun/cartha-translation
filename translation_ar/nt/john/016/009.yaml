translation:
  language: ar
  text: أمّا عن الخطيئة، فلأنهم لا يؤمنون بي؛[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أمّا عن الخطيئة، فهي أنهم لا يؤمنون بي». يمكن أن تفيد الأداة اليونانية التعليل أو التفسير، لكن «لأنهم» تُبرز معنى التعليل في السياق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ
  choice: عن
  rationale: تُدخل موضوع التبكيت، وهي صياغة عربية طبيعية تحافظ على البنية المتوازية في الآيات 9–11.
- source_word: ἁμαρτίας
  choice: الخطيئة
  rationale: يحافظ المفرد المعرّف على المعنى المجرّد والفئة العامة دون تحويله إلى خطايا فردية أو إلى مفهوم أوسع مثل الطبيعة الخاطئة.
- source_word: μέν
  choice: أمّا
  rationale: تُظهر أن هذا هو البند الأول في سلسلة تتواصل في الآيتين التاليتين، من غير إثقال العبارة.
- source_word: ὅτι
  choice: لأنهم
  rationale: تفيد اللام هنا التعليل، فتربط الخطيئة المذكورة بعدم إيمانهم بالمسيح، مع توثيق احتمال أن تكون تفسيرية في الحاشية.
- source_word: οὐ πιστεύουσιν
  choice: لا يؤمنون
  rationale: ينقل المضارع الواقع المستمر بصياغة عربية واضحة ومألوفة.
- source_word: εἰς ἐμέ
  choice: بي
  rationale: الفعل «آمن بـ» هو التعبير العربي الطبيعي للإيمان الموجّه إلى شخص، ويحفظ البعد الشخصي دون حرفية «إلى» غير المألوفة هنا.
theological_decisions:
- issue: طبيعة الخطيئة المحددة في العدد
  choice: تربط الصياغة الخطيئة في هذا السياق بعدم الإيمان بيسوع بوصفه سبب التبكيت أو تفسيره.
  alternative: قد تُفهم الخطيئة بمعناها البشري العام، ويكون عدم الإيمان بيسوع مثالًا عليها.
  rationale: تربط ὅτι العبارة «عن الخطيئة» مباشرة بقول يسوع «لا يؤمنون بي»، من غير إضافة تعميم عقائدي لا يصرّح به النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «أمّا» لإبراز أول عناصر السلسلة، و«الخطيئة» للمفرد المجرّد، مع الحفاظ على الاحتمال الدلالي في ὅτι بالحاشية.
