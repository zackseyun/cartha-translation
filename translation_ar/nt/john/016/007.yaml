source:
  edition: SBLGNT
  text: ἀλλ’ ἐγὼ τὴν ἀλήθειαν λέγω ὑμῖν, συμφέρει ὑμῖν ἵνα ἐγὼ ἀπέλθω. ἐὰν ⸀γὰρ μὴ ἀπέλθω, ὁ παράκλητος ⸂οὐ μὴ ἔλθῃ⸃ πρὸς ὑμᾶς· ἐὰν δὲ πορευθῶ, πέμψω αὐτὸν πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/007.yaml
  text: 'But I am telling you the truth: it is better for you that I go away. For if I do not go away[a], the Advocate will certainly not come to you; but if I go, I will send him to you.'
translation:
  language: ar
  text: 'لكني أقول لكم الحق: من الأفضل لكم أن أرحل؛ لأنه إن لم أرحل، فلن يأتي إليكم المعين[a]؛ أما إن ذهبت، فسأرسله إليكم.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «المناصر» أو «المعزّي»؛ واللفظة اليونانية هي «البارقليط».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: لكني
  rationale: تفيد الاستدراك في مقابل حزن التلاميذ في السياق السابق، وهي صياغة عربية واضحة وموجزة.
- source_word: τὴν ἀλήθειαν λέγω ὑμῖν
  choice: أقول لكم الحق
  rationale: تنقل تعبير التأكيد الصادق بصياغة عربية طبيعية وتحافظ على ترتيب عناصره الأساسي.
- source_word: συμφέρει ὑμῖν
  choice: من الأفضل لكم
  rationale: تعبر بوضوح عن المنفعة أو المصلحة المقصودة في السياق، من غير غموض في العربية المعاصرة.
- source_word: ἵνα ἐγὼ ἀπέλθω
  choice: أن أرحل
  rationale: تبين مضمون ما هو أفضل لهم، وتؤدي معنى المغادرة بلفظ عربي طبيعي.
- source_word: ἐὰν γὰρ μὴ ἀπέλθω
  choice: لأنه إن لم أرحل
  rationale: تحافظ على البنية الشرطية وعلى تكرار فعل الرحيل، وتنقل γάρ بوظيفته التفسيرية.
- source_word: ὁ παράκλητος
  choice: المؤيد
  rationale: يدل على شخص يأتي لمساندة التلاميذ والقيام بدور نصير لهم. ولأن اللفظة اليونانية أوسع من مقابل عربي واحد، أُثبتت البدائل المهمة في الحاشية.
- source_word: οὐ μὴ ἔλθῃ
  choice: فلن يأتي
  rationale: «لن» نفي قوي للاستقبال في العربية، وتنقل في هذا السياق قوة النفي المؤكد οὐ μή دون إثقال الأسلوب.
- source_word: πρὸς ὑμᾶς
  choice: إليكم
  rationale: تنقل اتجاه المجيء نحو المخاطبين بدقة وإيجاز.
- source_word: ἐὰν δὲ πορευθῶ
  choice: أما إن ذهبت
  rationale: «أما» تبرز المقابلة مع الشرط السابق، و«ذهبت» تميز طبيعيًا بين πορεύομαι وبين تكرار ἀπέρχομαι المترجم «أرحل».
- source_word: πέμψω αὐτὸν πρὸς ὑμᾶς
  choice: فسأرسله إليكم
  rationale: تنقل فعل الإرسال والضمير الشخصي المذكر ووجهته بعبارة عربية مباشرة.
theological_decisions:
- issue: ترجمة παράκλητος في خطاب يوحنا
  choice: المؤيد
  alternative: 'المعين، المحامي، المعزي؛ وباليونانية: البارقليط'
  rationale: اللفظة لقب لشخص يأتي نيابة عن يسوع لمساندة تلاميذه، ولها مجال دلالي يشمل النصرة والمعونة والدفاع والتعزية. «المؤيد» مقروء وواسع نسبيًا، مع حفظ البدائل في الحاشية بدل حصر المعنى في جانب واحد.
- issue: الإشارة الشخصية إلى παράκλητος
  choice: سأرسله
  alternative: سأرسل ذلك
  rationale: الضمير اليوناني αὐτόν مذكر ويعود إلى παράκλητος، كما يعرض السياق هذا الآتي بصفته شخصًا مُرسَلًا؛ لذلك حُفظت الإشارة الشخصية من غير تحويله إلى قوة غير شخصية.
translation_notes:
  register: فصحى معاصرة واضحة ذات نبرة كريمة. استُخدمت جمل مباشرة وروابط مألوفة، مع الحفاظ على الشرطين المتقابلين والتكرار المقصود، وتجنب ألفاظ طائفية خاصة.
