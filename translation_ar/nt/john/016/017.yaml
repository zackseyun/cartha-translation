  text: εἶπαν οὖν ἐκ τῶν μαθητῶν αὐτοῦ πρὸς ἀλλήλους· Τί ἐστιν τοῦτο ὃ λέγει ἡμῖν· Μικρὸν καὶ οὐ θεωρεῖτέ με, καὶ πάλιν μικρὸν καὶ ὄψεσθέ με; καί· ⸀Ὅτι ὑπάγω πρὸς τὸν πατέρα;
base_translation:
  language: en
  yaml_path: translation/nt/john/016/017.yaml
  text: 'So some of his disciples said to one another[a], “What is this that he is saying to us: ‘A little while, and you will not see me, and again a little while, and you will see me’? And, ‘Because I am going to the Father’?”'
translation:
  language: ar
  text: 'فقال بعض تلاميذه بعضهم لبعض: «ما هذا الذي يقوله لنا: ’بعد قليل لا ترونني، ثم بعد قليل ترونني من جديد‘؟ و’لأني ذاهب إلى الآب‘[a]؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إني ذاهب إلى الآب». يمكن أن تُفهم أداة الربط اليونانية على أنها تُدخل مضمون القول، أو بمعنى سببي: «لأني».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: فـ
  rationale: تربط كلام التلاميذ بما سبق ربطًا استنتاجيًا وسرديًا طبيعيًا، من غير إثقال العبارة بـ«لذلك».
- source_word: ἐκ τῶν μαθητῶν αὐτοῦ
  choice: بعض تلاميذه
  rationale: تحفظ دلالة التبعيض في ἐκ، إذ المتكلمون فريق من التلاميذ لا جماعتهم بالضرورة.
- source_word: πρὸς ἀλλήλους
  choice: بعضهم لبعض
  rationale: تعبير عربي فصيح وواضح ينقل معنى التبادل في الحديث.
- source_word: Τί ἐστιν τοῦτο ὃ λέγει ἡμῖν
  choice: ما هذا الذي يقوله لنا
  rationale: صياغة قريبة من بنية اليونانية وتحفظ نبرة الحيرة من غير أن تفسر المقصود.
- source_word: Μικρὸν
  choice: بعد قليل
  rationale: السياق زمني، وهذه العبارة العربية الطبيعية تنقل معنى «وقت قصير».
- source_word: θεωρεῖτέ
  choice: ترونني
  rationale: تنقل المعنى البصري أو الإدراكي العام بلفظ عربي طبيعي، مع إبقاء الفرق المعجمي عن ὄψεσθέ غير ظاهر كما في كثير من اللغات المستهدفة.
- source_word: πάλιν
  choice: ثم
  rationale: في هذا السياق تؤدي «ثم» معنى الانتقال إلى الفترة القصيرة التالية بصورة طبيعية؛ ومفهوم التكرار يظهر من تكرار «بعد قليل» وعودة فعل الرؤية.
- source_word: ὄψεσθέ
  choice: ترونني
  rationale: تحفظ التوازي البلاغي الواضح في العربية بين عدم الرؤية والرؤية، من دون تحميل الفعل معنى تفسيريًا زائدًا.
- source_word: Ὅτι ὑπάγω πρὸς τὸν πατέρα
  choice: لأني ذاهب إلى الآب
  rationale: تحفظ القراءة السببية الممكنة لـὅτι، مع إثبات القراءة المضمونية البديلة في الحاشية بسبب الغموض النحوي الحقيقي.
- source_word: πατέρα
  choice: الآب
  rationale: ينقل اللقب الأبوي المعرّف كما في اليونانية، من غير إضافة «أبي» غير الموجودة في النص.
theological_decisions:
- issue: مرجع ذهاب يسوع وعودته في القول المقتبس
  choice: إبقاء المرجع غير محدد في الترجمة
  alternative: تفسيره بالموت والقيامة، أو الصعود والحضور الروحي، أو ظهورات ما بعد القيامة
  rationale: الآية تعرض حيرة التلاميذ ولا تحسم بنفسها مدلول الذهاب والعودة؛ لذلك لا ينبغي إدخال تفسير لاهوتي في المتن.
- issue: دلالة ὅτι في العبارة الأخيرة
  choice: 'السببية: «لأني ذاهب إلى الآب»'
  alternative: 'المضمونية: «أني ذاهب إلى الآب»'
  rationale: كلتا القراءتين ممكنة نحويًا وسياقيًا؛ اختيرت السببية في المتن وأُبقي البديل في الحاشية حفاظًا على الغموض الأصيل.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُخدم «الآب» بوصفه التعبير الكتابي المألوف في هذا السياق. وُضع موضع الحاشية بعد الجملة التي تتعلق بها، مع الحفاظ على حيرة التلاميذ والغموض التفسيري في النص.
