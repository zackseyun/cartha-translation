base_translation:
  language: en
  yaml_path: translation/nt/john/016/002.yaml
  text: They will make you outcasts from the synagogues[a]; indeed[b], an hour is coming when everyone who kills you will think he is offering service to God.
translation:
  language: ar
  text: سيطردونكم من المجامع[a]؛ بل تأتي ساعة يظن فيها كل من يقتلكم أنه يقدّم عبادةً لله[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «سيُخرجونكم من المجمع»، أو: «سيستبعدونكم من المجامع».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «يؤدي لله خدمةً دينية»، أو: «يقدّم لله عبادةً».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποσυναγώγους ποιήσουσιν ὑμᾶς
  choice: سيطردونكم من المجامع
  rationale: ينقل معنى جعل المخاطَبين مُبعَدين عن جماعة المجمع، بصياغة عربية طبيعية، ويحافظ على صيغة الجمع في «المجامع».
- source_word: ἀλλ’
  choice: بل
  rationale: تفيد الانتقال إلى اضطهاد أشد، لا مجرد التعارض البسيط.
- source_word: ἔρχεται ὥρα
  choice: تأتي ساعة
  rationale: يحافظ على التعبير اليوحناوي وصورة «الساعة» من غير تحويلها تفسيريًا إلى «وقت».
- source_word: ἵνα
  choice: فيها
  rationale: تربط مضمون الساعة بها في عربية سليمة، بما يلائم الدلالة الزمنية السياقية.
- source_word: πᾶς ὁ ἀποκτείνας ὑμᾶς
  choice: كل من يقتلكم
  rationale: صياغة عربية عامة وطبيعية تحفظ شمول πᾶς ودلالة العبارة الوصفية.
- source_word: δόξῃ
  choice: يظن
  rationale: يعبر عن اعتقاد القاتل الذاتي، من غير الإيحاء بصحة ذلك الاعتقاد.
- source_word: λατρείαν προσφέρειν τῷ θεῷ
  choice: يقدّم عبادةً لله
  rationale: يحفظ اللغة الدينية الشعائرية في λατρείαν مع دلالة التقديم في προσφέρειν، ويجعل المفارقة المقصودة واضحة.
theological_decisions:
- issue: تصوير فهم المضطهِدين لفعلهم بلغة دينية شعائرية
  choice: يقدّم عبادةً لله
  alternative: يؤدي خدمةً دينية لله
  rationale: 'يحفظ صدمة المفارقة: القاتل يظن فعله قربان طاعة أو عبادة لله، من غير أن تصادق الترجمة على ظنه. وتوضح الحاشية اتساع مدلول اللفظ بين العبادة والخدمة الدينية.'
- issue: الدلالة العامة في πᾶς ὁ ἀποκτείνας
  choice: كل من يقتلكم
  alternative: كل واحد يقتلكم
  rationale: «كل من» تعبير عربي فصيح ذو دلالة عامة ولا يضيف تحديدًا جنسيًا لا تحتاج إليه العربية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم «سيطردونكم» لبيان الإقصاء الفعلي والاجتماعي، و«بل» لتصعيد المعنى، مع إبقاء صورة «الساعة» اليوحناوية. وُضعت علامتا الحاشيتين في المتن.
