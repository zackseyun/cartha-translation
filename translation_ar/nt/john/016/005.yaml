  text: νῦν δὲ ὑπάγω πρὸς τὸν πέμψαντά με καὶ οὐδεὶς ἐξ ὑμῶν ἐρωτᾷ με· Ποῦ ὑπάγεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/016/005.yaml
  text: But now I am going to the one who sent me, and none of you asks me, ‘Where are you going?’
translation:
  language: ar
  text: 'أَمَّا الآنَ فَإِنِّي ذاهِبٌ إِلى الَّذي أَرْسَلَني، ولا أَحَدَ مِنْكُم يَسْأَلُني: «إِلى أَيْنَ تَذْهَبُ؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν δὲ
  choice: أَمَّا الآنَ فَـ
  rationale: تنقل أداة الاستدراك والانتقال δέ بعبارة عربية طبيعية، مع إبراز التحول إلى الوضع الحاضر.
- source_word: ὑπάγω
  choice: إِنِّي ذاهِبٌ / تَذْهَبُ
  rationale: يحفظ معنى الحركة والاتجاه في السياق اليوحناوي، ويعبّر طبيعيًا عن الحاضر ذي الدلالة القريبة أو المستمرة، من غير تضييقه إلى مجرد «أغادر».
- source_word: πρὸς τὸν πέμψαντά με
  choice: إِلى الَّذي أَرْسَلَني
  rationale: ينقل اسم الفاعل المعرّف بصياغة عربية واضحة وشخصية، من غير إضافة «الآب» التي لا ترد صراحة في هذه العبارة.
- source_word: πέμψαντά
  choice: أَرْسَلَ
  rationale: هو المقابل المباشر والمألوف للفعل πέμπω، ويحفظ لغة الإرسال البارزة في إنجيل يوحنا بلا توسع تفسيري مثل «كلّفني».
- source_word: οὐδεὶς ἐξ ὑμῶν
  choice: ولا أَحَدَ مِنْكُم
  rationale: صياغة عربية مباشرة تحفظ النفي والتعبير التبعيضي.
- source_word: ἐρωτᾷ με
  choice: يَسْأَلُني
  rationale: يفيد هنا طرح سؤال، و«يسألني» أوضح تعبير عربي معاصر.
- source_word: Ποῦ ὑπάγεις;
  choice: إِلى أَيْنَ تَذْهَبُ؟
  rationale: صياغة عربية طبيعية للسؤال عن الوجهة، وتحفظ دلالة الحركة في ὑπάγω.
theological_decisions:
- issue: هوية «الذي أرسلني»
  choice: إبقاء العبارة «الذي أرسلني» من غير تسمية صريحة
  alternative: «الآب الذي أرسلني»
  rationale: النص اليوناني يستعمل اسم فاعل معرّفًا ولا يذكر «الآب» صراحة هنا. ومع أن المرجع واضح في سياق يوحنا، تحافظ الترجمة على صياغة المصدر ولا تضيف تحديدًا لاهوتيًا غير ملفوظ في الجملة.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُعملت «أمّا الآن فإنّي» لإظهار الانتقال الاستدراكي بسلاسة، وحُفظ السؤال المباشر وعلامات الاقتباس من دون حواشٍ لعدم وجود غموض نصي يستلزمها.
