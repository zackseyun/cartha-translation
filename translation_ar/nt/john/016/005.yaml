  source_fidelity: 'النص العربي ينقل عناصر اليونانية بدقة: «أمّا الآن» يحفظ التحول الاستدراكي في νῦν δέ، و«ذاهب إلى الذي أرسلني» ينقل اتجاه ὑπάγω ومرجع πρὸς τὸν πέμψαντά με دون إضافة «الآب». كما أن «ولا أحد منكم يسألني» و«إلى أين تذهب؟» يقابلان النفي والسؤال المباشر في الأصل.'
