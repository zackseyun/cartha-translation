source:
  edition: SBLGNT
  text: νῦν οἴδαμεν ὅτι οἶδας πάντα καὶ οὐ χρείαν ἔχεις ἵνα τίς σε ἐρωτᾷ· ἐν τούτῳ πιστεύομεν ὅτι ἀπὸ θεοῦ ἐξῆλθες.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/030.yaml
  text: Now we know that you know all things and have no need that anyone should question you[a]. By this we believe that you came from God.
translation:
  language: ar
  text: الآن نعلم أنك تعرف كل شيء، ولا تحتاج إلى أن يسألك أحد[a]. وبهذا نؤمن أنك أتيت من عند الله.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يستفهم منك أحد». يمكن أن يعني الفعل اليوناني «يسأل» أو «يستفهم»، والسياق يتعلق بمعرفة يسوع لما أراد التلاميذ أن يسألوه عنه.'
    reason: بديل معجمي يحفظ مدى دلالة الفعل ἐρωτάω وصلته بالسياق.
lexical_decisions:
- source_word: νῦν
  choice: الآن
  rationale: ظرف زمان يشير إلى إدراك التلاميذ في هذه اللحظة، و«الآن» هي الصياغة العربية الطبيعية المباشرة.
- source_word: οἴδαμεν
  choice: نعلم
  rationale: الفعل οἶδα، مع أنه في صيغة تامة من حيث الأصل، يؤدي هنا معنى حاضرًا؛ لذلك تنقله «نعلم» بوضوح.
- source_word: οἶδας πάντα
  choice: تعرف كل شيء
  rationale: تنقل شمول πάντα بلغة عربية طبيعية، من غير إضافة تفسير عقائدي إلى قول التلاميذ.
- source_word: οὐ χρείαν ἔχεις
  choice: لا تحتاج
  rationale: صياغة عربية جارية وواضحة تؤدي معنى انعدام الحاجة في التعبير اليوناني.
- source_word: ἵνα τίς σε ἐρωτᾷ
  choice: إلى أن يسألك أحد
  rationale: الفعل ἐρωτάω قد يدل على السؤال أو الاستفهام؛ و«يسألك» تحفظ سعته الدلالية وتلائم السياق الذي أظهر فيه يسوع معرفته بما أراد التلاميذ أن يسألوه عنه.
- source_word: ἐν τούτῳ
  choice: وبهذا
  rationale: تشير إلى الأساس أو الدليل الذي بنى عليه التلاميذ إيمانهم، مع وصل طبيعي بما قبلها.
- source_word: πιστεύομεν
  choice: نؤمن
  rationale: اللفظ المعتاد والدقيق في هذا السياق الإقراري، ويحفظ الدلالة الدينية للفعل πιστεύω.
- source_word: ἀπὸ θεοῦ
  choice: من عند الله
  rationale: يحافظ على ذكر «الله» كما في النص، ولا يستبدله بـ«الآب» اعتمادًا على السياق القريب.
- source_word: ἐξῆλθες
  choice: خرجت
  rationale: 'ينقل المعنى الأساسي للفعل ἐξέρχομαι ويحفظ قوة التعبير اليوحناوي عن أصل يسوع وإرساليته، مع عبارة عربية مفهومة: «خرجت من عند الله».'
theological_decisions:
- issue: القوة المسيحولوجية لعبارة «تعرف كل شيء»
  choice: إبقاء إقرار التلاميذ بصيغته المباشرة من غير توسيعه إلى تصريح تفسيري عن المعرفة الكلية
  alternative: إضافة لفظ يصرح بأن المقصود هو المعرفة الكلية الإلهية
  rationale: للعبارة وزن مسيحولوجي واضح، لكن الترجمة ينبغي أن تحفظ ما يقوله النص نفسه من غير زيادة عقائدية تفسيرية.
- issue: دلالة ἀπὸ θεοῦ ἐξῆλθες
  choice: خرجت من عند الله
  alternative: أتيت من عند الآب
  rationale: الصياغة المختارة تحفظ دلالة الأصل أو الإرسالية الإلهية، وتلتزم بلفظ «الله» الوارد في هذه الآية بدل تخصيصه بـ«الآب» من السياق.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت «تعرف» مع المخاطب لأنها أجري في العربية مع معرفة الأشياء، و«نعلم» في إقرار المتكلمين لصياغة فصيحة طبيعية. وحُفظت العبارة اليوحناوية «خرجت من عند الله» من غير شرح زائد.
