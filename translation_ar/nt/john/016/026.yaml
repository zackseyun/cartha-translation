  yaml_path: translation/nt/john/016/026.yaml
  text: On that day you will ask in my name[a], and I do not say to you that I will ask the Father concerning you[c][b];
translation:
  language: ar
  text: فِي ذَلِكَ الْيَوْمِ سَتَطْلُبُونَ بِاسْمِي، وَلَا أَقُولُ لَكُمْ إِنِّي سَأَسْأَلُ الْآبَ بِشَأْنِكُمْ[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «من أجلكم» أو «نيابةً عنكم».'
    reason: lexical_alternative
  - marker: b
    text: 'يستعمل النص اليوناني فعلين مختلفين: «αἰτέω» لطلب التلاميذ، و«ἐρωτάω» لسؤال يسوع الآب.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: في ذلك اليوم
  rationale: تعبير زمني عربي طبيعي يحافظ على دلالة اسم الإشارة وتشديده.
- source_word: ἐν τῷ ὀνόματί μου
  choice: باسمي
  rationale: هو التعبير العربي المألوف الذي يحفظ الصلة بشخص يسوع وسلطانه من غير توسيع تفسيري.
- source_word: αἰτήσεσθε
  choice: ستطلبون
  rationale: فعل مستقبل للمخاطبين جمعًا؛ و«تطلبون» ملائم لسياق الطلب والصلاة.
- source_word: οὐ λέγω ὑμῖν
  choice: ولا أقول لكم
  rationale: يحافظ على زمن المضارع وصيغة النفي المباشرة بأسلوب عربي فصيح.
- source_word: ὅτι
  choice: إني
  rationale: تُدخل مضمون القول المنفي، ولا تُفهم هنا على معنى السببية.
- source_word: ἐρωτήσω
  choice: سأسأل
  rationale: يميز في العربية تمييزًا طبيعيًا بين طلب التلاميذ وسؤال يسوع للآب، مع بيان الفرق اليوناني في الحاشية.
- source_word: τὸν πατέρα
  choice: الآب
  rationale: ينقل الاسم معرفًا كما في اليونانية من دون إضافة ضمير ملكية غير موجود.
- source_word: περὶ ὑμῶν
  choice: من أجلكم
  rationale: ينقل المعنى السياقي المرجح، أي السؤال بشأنهم أو لمصلحتهم، مع إبقاء البديل الأقرب لفظًا في الحاشية.
theological_decisions:
- issue: هل ينفي يسوع أي دور شفاعي له في المستقبل، أم يرفض هنا فقط تصوير وصول التلاميذ إلى الآب على أنه متوقف على سؤاله؟
  choice: الإبقاء على صيغة «ولا أقول لكم إني سأسأل الآب» دون شرح داخل النص.
  alternative: صياغة تفسيرية تنفي كل شفاعة مستقبلية، أو صياغة تؤكد صراحة الاستغناء عن كل وساطة.
  rationale: السياق يؤكد طلب التلاميذ باسم يسوع، لكن العبارة لا تستلزم بذاتها نفي كل شفاعة؛ لذلك تُحفظ الموازنة والتوتر اللاهوتي من غير حسم تفسيري.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُعمل «الآب» وفق الاصطلاح الكتابي، وحُفظ تركيب الجملة المباشر من دون إدخال تفسير مذهبي.
