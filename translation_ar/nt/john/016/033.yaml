  text: ταῦτα λελάληκα ὑμῖν ἵνα ἐν ἐμοὶ εἰρήνην ἔχητε· ἐν τῷ κόσμῳ θλῖψιν ἔχετε, ἀλλὰ θαρσεῖτε, ἐγὼ νενίκηκα τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/033.yaml
  text: I have spoken these things to you so that in me you may have peace[a]. In the world you have tribulation, but take courage[b]; I have overcome the world.
translation:
  language: ar
  text: قلتُ لكم هذه الأمور لكي يكون لكم فيَّ سلام. في العالم لكم ضيق[a]، لكن تشجَّعوا[b]؛ لقد غلبتُ العالم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «شدّة» أو «كرب».
    reason: lexical_alternative
  - marker: b
    text: أو «كونوا شجعانًا» أو «ثبّتوا قلوبكم».
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: هذه الأمور
  rationale: يحافظ على صيغة الجمع وإحالته إلى كلام يسوع السابق، بدل اختزاله في ملخّص مفرد.
- source_word: λελάληκα
  choice: قلتُ
  rationale: صياغة عربية طبيعية للفعل في سياق خطاب مكتمل، مع بقاء أثر التمام في السياق؛ وتجنّب ثقل «تكلّمت بهذه الأمور».
- source_word: ἵνα
  choice: لكي
  rationale: تنقل دلالة الغاية بوضوح في العربية المعاصرة.
- source_word: ἐν ἐμοὶ
  choice: فيَّ
  rationale: تحافظ على العبارة اليوحناوية الموجزة والمهمة لاهوتيًا من غير توسيع تفسيري مثل «باتحادكم بي».
- source_word: εἰρήνην ἔχητε
  choice: يكون لكم فيَّ سلام
  rationale: ينقل امتلاك السلام المقصود بوصفه غاية مستمرة، بتركيب عربي واضح.
- source_word: ἐν τῷ κόσμῳ
  choice: في العالم
  rationale: يحافظ على لفظ «العالم» واتساع دلالته في يوحنا، من غير إضافة «هذا» أو تفسيره بأنه نظام العالم الساقط.
- source_word: θλῖψιν ἔχετε
  choice: لكم ضيق
  rationale: يحافظ على زمن المضارع الخبري وعلى ثقل θλῖψις، ولا يحوّله إلى مستقبل «سيكون لكم» غير مصرّح به في النص.
- source_word: θαρσεῖτε
  choice: تشجَّعوا
  rationale: أمر واضح طبيعي يدعو إلى الثبات والشجاعة في مواجهة الضيق.
- source_word: νενίκηκα
  choice: لقد غلبتُ
  rationale: «لقد» مع الماضي تعبّر طبيعيًا عن فعل منجز ذي نتيجة قائمة، وتحافظ «غلبت» على صورة الانتصار من غير تضييقها إلى معنى عسكري محض.
- source_word: τὸν κόσμον
  choice: العالم
  rationale: يكرر اللفظ نفسه كما في اليونانية، فيحفظ التقابل بين الضيق في العالم وغلبة يسوع للعالم.
theological_decisions:
- issue: دلالة κόσμος في السياق اليوحناوي
  choice: العالم
  alternative: نظام العالم / هذا العالم الساقط
  rationale: لفظ «العالم» يبقي مدى الكلمة واحتمالاتها في يوحنا، ولا يفرض تفسيرًا لاهوتيًا أضيق من النص.
- issue: قوة صيغتي التمام λελάληκα وνενίκηκα
  choice: صياغة عربية تدل على الإنجاز ذي الأثر القائم، ولا سيما «لقد غلبتُ»
  alternative: الماضي المجرد أو صياغة مستقبلية للغلبة
  rationale: الصيغة اليونانية تعرض القول والغلبة بوصفهما منجزين مع استمرار أهميتهما؛ وهذا لافت خصوصًا لأن إعلان الغلبة يسبق الصليب في زمن السرد.
- issue: زمن θλῖψιν ἔχετε
  choice: في العالم لكم ضيق
  alternative: في العالم سيكون لكم ضيق
  rationale: يحافظ الاختيار على المضارع في الأصل وعلى واقع الضيق الحاضر أو المستمر، بدل تحويله إلى وعد مستقبلي فقط.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. حُفظ التركيب اليوحناوي «فيَّ» والتكرار المقصود لكلمة «العالم». وُضعت علامتا الحاشية عند اللفظين اللذين تشرحهما الحاشيتان فعلًا، لأن موضعيهما في طبقة الاستشارة الإنجليزية لا يطابقان محتواهما.
