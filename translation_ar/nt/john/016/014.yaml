  text: ἐκεῖνος ἐμὲ δοξάσει, ὅτι ἐκ τοῦ ἐμοῦ λήμψεται καὶ ἀναγγελεῖ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/014.yaml
  text: He will glorify me[a], because he will take from what is mine and declare it to you.
translation:
  language: ar
  text: هُوَ سَيُمَجِّدُنِي، لِأَنَّهُ سَيَأْخُذُ مِمَّا لِي[a] وَيُعْلِنُهُ لَكُمْ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «سيتلقّى مما لي».'
    reason: بديل معجمي للفعل λήμψεται الذي يحتمل معنى الأخذ أو التلقّي.
lexical_decisions:
- source_word: ἐκεῖνος
  choice: هُوَ
  rationale: يشير إلى الروح المذكور في السياق السابق. وإبراز الضمير المنفصل يحافظ بقدر طبيعي على قوة اسم الإشارة اليوناني من غير ترجمة حرفية ثقيلة مثل «ذاك».
- source_word: ἐμὲ
  choice: ـنِي
  rationale: ضمير المتكلم في محل مفعول به للفعل «يُمجِّد».
- source_word: δοξάσει
  choice: يُمَجِّدُنِي
  rationale: يحفظ «يمجّد» الثقل اللاهوتي والاستعمال اليوحناوي للفعل δοξάζω، ولا يقصر المعنى على مجرد الإكرام البشري.
- source_word: ὅτι
  choice: لِأَنَّهُ
  rationale: تقدّم ὅτι هنا سبب تمجيد الروح ليسوع، ولذلك تؤدي «لأنه» المعنى السببي بوضوح.
- source_word: ἐκ τοῦ ἐμοῦ
  choice: مِمَّا لِي
  rationale: تعبير عربي موجز وطبيعي يحفظ عموم التركيب اليوناني، فلا يحدد هل المقصود تعليم يسوع أم سلطانه أم ما يخصه على وجه أوسع.
- source_word: λήμψεται
  choice: سَيَأْخُذُ
  rationale: يمكن أن يعني λαμβάνω «يأخذ» أو «يتلقى». واختيار «يأخذ» يلائم حرف الجر «مما لي»، مع إثبات البديل المعجمي في الحاشية.
- source_word: ἀναγγελεῖ
  choice: وَيُعْلِنُهُ
  rationale: ينقل معنى الإخبار أو الإظهار بلفظ عربي واضح ووقور؛ والضمير «ـه» يصرّح بالمفعول المفهوم من العبارة السابقة.
- source_word: ὑμῖν
  choice: لَكُمْ
  rationale: ينقل ضمير المخاطبين بصيغة الجمع الظاهرة في العربية.
theological_decisions:
- issue: علاقة الروح بيسوع في عبارة ἐκ τοῦ ἐμοῦ λήμψεται
  choice: سَيَأْخُذُ مِمَّا لِي
  alternative: سيتلقّى مما لي؛ سيأخذ مني
  rationale: 'تحافظ الصياغة المختارة على سعة العبارة اليوحناوية: الروح يعلن ما هو للمسيح، من غير تحويلها إلى تقرير اصطلاحي أضيق أو حسم كيفية هذه العلاقة بما يتجاوز النص.'
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم الضمير المنفصل «هو» لإبراز المرجع الشخصي، وصيغة الجمع «لكم» بحسب اليونانية. وُضع رمز الحاشية بعد العبارة التي تتعلق بها مباشرة.
