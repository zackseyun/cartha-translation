base_translation:
  language: en
  yaml_path: translation/nt/john/016/032.yaml
  text: Behold[a], an hour is coming, and has come, when you will be scattered, each to his own, and will leave me alone. Yet I am not alone, because the Father is with me.
translation:
  language: ar
  text: ها إنّ ساعةً آتية، وقد أتت، تتشتّتون فيها، كلّ واحد إلى ما يخصّه[a]، وتتركونني وحدي. لكنني لست وحدي، لأنّ الآب معي.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كلّ واحد إلى بيته/مكانه/ممتلكاته». العبارة اليونانية أوسع من مكان محدد، وقد تشير عمومًا إلى ما يخصّ كلّ واحد.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: ها إنّ
  rationale: تنقل أداة لفت الانتباه والنبرة المهيبة في إعلان يسوع، بصياغة عربية فصيحة غير متكلّفة.
- source_word: ἔρχεται ὥρα καὶ ἐλήλυθεν
  choice: ساعة آتية، وقد أتت
  rationale: تحفظ التوتر بين الحاضر الدال على الاقتراب وصيغة التمام الدالة على أن اللحظة قد حلّت بالفعل، كما تبقي «ساعة» نكرة بحسب اليونانية.
- source_word: ἵνα
  choice: فيها
  rationale: تربط مضمون الساعة بزمن وقوع التشتت ربطًا عربيًا طبيعيًا، من غير فرض معنى الغاية حيث يغلب هنا معنى المحتوى أو النتيجة.
- source_word: σκορπισθῆτε
  choice: تتشتّتون
  rationale: تعبر طبيعيًا عن تفرّق التلاميذ وتبعثرهم، مع إبراز أن الحدث واقع متوقع لا مجرد احتمال.
- source_word: ἕκαστος εἰς τὰ ἴδια
  choice: كلّ واحد إلى ما يخصّه
  rationale: تحفظ الدلالة التوزيعية واتساع العبارة اليونانية، التي قد تشير إلى البيت أو المكان أو الممتلكات أو الشؤون الخاصة، من غير حصرها في أحد هذه المعاني.
- source_word: κἀμὲ μόνον ἀφῆτε
  choice: وتتركونني وحدي
  rationale: تنقل معنى الترك وراءهم بوضوح وقوة عاطفية مناسبة، من غير تشديده إلى «تهجرونني» أو «تتخلّون عني».
- source_word: καὶ οὐκ εἰμὶ μόνος
  choice: لكنني لست وحدي
  rationale: تظهر قوة المقابلة السياقية بين ترك التلاميذ ليسوع وحضور الآب معه.
- source_word: ὅτι ὁ πατὴρ μετ’ ἐμοῦ ἐστιν
  choice: لأنّ الآب معي
  rationale: تبين سبب عدم كون يسوع وحده، وتحفظ اللقب العلائقي المحدد «الآب» والصياغة المباشرة للحضور معه.
theological_decisions:
- issue: دلالة «كلّ واحد إلى ما يخصّه»
  choice: الإبقاء على العبارة واسعة الدلالة مع شرحها في الحاشية
  alternative: كلّ واحد إلى بيته
  rationale: لا تحصر اليونانية τὰ ἴδια المعنى في البيت وحده؛ لذا يحفظ النص إمكان الإشارة إلى كل ما يخص الشخص من بيت أو مكان أو أهل أو شؤون.
- issue: العلاقة بين ترك التلاميذ ليسوع وحضور الآب معه
  choice: لكنني لست وحدي، لأنّ الآب معي
  alternative: وأنا لست وحدي، فالآب معي
  rationale: 'تحفظ الصياغة التوتر القائم في الآية: سيتركه التلاميذ فعلًا، لكنه لا يكون وحده لأن الآب معه، من غير استيراد استنتاجات عقائدية تتجاوز كلام الآية.'
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُعملت «ها إنّ» للفت الانتباه بوقار، وحُفظ التوتر الزمني في «آتية، وقد أتت»، مع تجنب الألفاظ الكنسية الاصطلاحية أو التفسير المذهبي.
