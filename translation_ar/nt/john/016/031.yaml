    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: أجاب
  rationale: فعل سردي ماضٍ من ἀποκρίνομαι، و«أجاب» هو المقابل العربي الطبيعي والمألوف في سياق الحوار.
- source_word: αὐτοῖς
  choice: هم في «أجابهم»
  rationale: ضمير جمع في حالة الداتيف يدل على متلقي الجواب، ويُدمج طبيعيًا في العربية ضميرًا متصلًا بالفعل.
- source_word: Ἰησοῦς
  choice: يسوع
  rationale: الصيغة العربية المعيارية الشائعة للاسم في ترجمات العهد الجديد.
- source_word: Ἄρτι
  choice: الآن
  rationale: تنقل الدلالة الزمنية المباشرة للكلمة، أي في هذه اللحظة، بإيجاز ووضوح.
- source_word: πιστεύετε
  choice: تؤمنون
  rationale: فعل مضارع مخاطب لجمع من πιστεύω؛ و«تؤمنون» يحفظ المعنى اليوحناوي المعتاد وصيغة الجمع من غير إضافة تفسيرية.
theological_decisions:
- issue: 'قوة العبارة Ἄρτι πιστεύετε;: استفهام أم تقرير'
  choice: «أَتؤمنون الآن؟» بوصفها سؤالًا بلاغيًا
  alternative: «الآن تؤمنون.»
  rationale: النص اليوناني في ذاته يحتمل الاستفهام أو التقرير بحسب التنغيم والترقيم التحريري، لكن سياق الآية التالية، حيث ينبئ يسوع بتشتت التلاميذ، يرجّح السؤال البلاغي ويحفظ التوتر وربما المفارقة من غير مبالغة في تفسيرها.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. استُعملت همزة الاستفهام في «أَتؤمنون» لصياغة سؤال عربي طبيعي، مع إبقاء القراءة الخبرية الممكنة في الحاشية.
