review_pass:
  verdict: revise
  source_fidelity: 'يحافظ المتن على البنية الأساسية للنص اليوناني: الكلام السابق لغرض التذكّر عند مجيء «ساعتهم»، وعدم قول ذلك منذ البدء بسبب الحضور مع التلاميذ. لكن «أني قلتها لكم» يعيّن ضميرًا مؤنثًا عائدًا إلى «الأمور» حيث يبقي اليوناني مرجع αὐτῶν الثاني غير مبيّن صراحة، والحاشية الحالية لا تمثل التركيب اليوناني تمثيلًا سليمًا.'
  naturalness: «لكي، متى جاءت ساعتهم» مثقلة بعلامة وقف غير مناسبة وبترتيب أقل سلاسة. الصياغة «لكي تتذكروا، حين تأتي ساعتهم، أني قلت لكم ذلك» فصيحة وواضحة. كما أن «تتذكروهم» في الحاشية غير طبيعي هنا ولا يوضح أن الفعل اليوناني يتعدى بالجر.
  terminology: «كلمتكم»، و«هذه الأمور»، و«البدء»، و«كنت معكم» مناسبة للفصحى الحديثة وللسياق اليوحناوي. وتبقي «ساعتهم» الإبهام المقصود في المرجع من غير تفسير مذهبي أو تاريخي زائد.
