    rationale: في اليونانية αὐτῶν الثانية ضمير جمع في صيغة الجر يتعلق بـ μνημονεύητε («تتذكروا/تذكروا أمر...»). أما «تتذكروهم» فلا يؤدي هذا التركيب العربي على نحو سليم، و«قلتها» يحدد المرجع نحويًا إلى مؤنث جمع رغم أن اليونانية لا تفعل ذلك.
  - severity: low
