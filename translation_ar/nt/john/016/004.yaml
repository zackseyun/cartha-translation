  rationale: عُدّل ترتيب العبارة لتكون عربية طبيعية، واستُبدلت «قلتها» بـ«ذلك» لتجنب تعيين جنس ومرجع لا يعيّنهما النص اليوناني. كما صُححت الحاشية لتبيّن أن الضمير الثاني في اليونانية متعلق بفعل التذكر، مع الحفاظ على إبهام مرجعه وعدم فرض تفسير له.
