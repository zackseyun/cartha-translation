  yaml_path: translation/nt/john/016/004.yaml
  text: But I have spoken these things to you so that when their hour comes[a], you may remember that I told you. But I did not tell you these things from the beginning, because I was with you.
translation:
  language: ar
  text: لكني كلمتكم بهذه الأمور لكي تتذكروا، حين تأتي ساعتهم، أني قلت لكم ذلك. ولم أقل لكم هذه الأمور منذ البدء، لأني كنت معكم.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λελάληκα
  choice: كلمتكم
  rationale: ينقل الفعل التام اليوناني كلامًا صدر وبقيت أهميته قائمة، وصيغة «كلمتكم» طبيعية وفصيحة في السياق.
- source_word: ταῦτα
  choice: هذه الأمور
  rationale: يحيل اسم الإشارة الجمع إلى التحذيرات السابقة، و«هذه الأمور» واضحة من غير تضييقها إلى ألفاظ بعينها.
- source_word: ἵνα
  choice: لكي
  rationale: يحفظ دلالة الغرض بعبارة عربية موجزة وطبيعية.
- source_word: ὅταν ἔλθῃ ἡ ὥρα αὐτῶν
  choice: متى جاءت ساعتهم
  rationale: يحفظ معنى الاحتمال المستقبلي وصورة «الساعة» اليوحناوية، مع إبقاء مرجع ضمير الجمع غير محسوم.
- source_word: μνημονεύητε
  choice: تتذكروا
  rationale: مقابل عربي مباشر وواضح لفعل التذكر في صيغة الغرض.
- source_word: ὅτι ἐγὼ εἶπον ὑμῖν
  choice: أني قلتها لكم
  rationale: يجعل جملة ὅτι مضمون التذكر، وتعود هاء المفعول على الأمور المذكورة؛ وهو تركيب عربي طبيعي مع إبراز الضمير ἐγώ بواسطة «أني» في السياق.
- source_word: ἐξ ἀρχῆς
  choice: منذ البدء
  rationale: ينقل الامتداد الزمني من البداية ويحافظ على اللفظ اليوحناوي المألوف.
- source_word: μεθ’ ὑμῶν ἤμην
  choice: كنت معكم
  rationale: ترجمة مباشرة وطبيعية للعلاقة الحضورية.
theological_decisions:
- issue: مرجع αὐτῶν في «ساعتهم» ووروده ثانية بعد μνημονεύητε
  choice: 'أُثبت الضمير الأول في «ساعتهم»، ومُثّل الثاني في الحاشية بقراءة حرفية محتملة، بينما صيغ المتن عربيًا على نحو سلس: «تتذكروا أني قلتها لكم».'
  alternative: «متى جاءت ساعتهم، تتذكروهم، أني قلت لكم» أو إسقاط تمثيل الضمير الثاني في العربية تمامًا.
  rationale: نص SBLGNT يتضمن موضعين للضمير، لكن جمعهما حرفيًا في العربية يورث غموضًا وثقلًا شديدين. يحفظ المتن المعنى الاتصالي، وتوثق الحاشية البنية اليونانية ولبس مرجعها دون حسم تفسيري.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «البدء» للمحافظة على النبرة اليوحناوية، وأُبقيت «ساعتهم» بدل تفسيرها بـ«وقت تلك الأحداث» أو تحديد أصحابها.
