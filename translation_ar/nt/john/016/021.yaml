  text: ἡ γυνὴ ὅταν τίκτῃ λύπην ἔχει, ὅτι ἦλθεν ἡ ὥρα αὐτῆς· ὅταν δὲ γεννήσῃ τὸ παιδίον, οὐκέτι μνημονεύει τῆς θλίψεως διὰ τὴν χαρὰν ὅτι ἐγεννήθη ἄνθρωπος εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/021.yaml
  text: When a woman is giving birth[a], she has sorrow because her hour has come; but when she has given birth to the child, she no longer remembers the distress because of the joy that a child has been born into the world.
translation:
  language: ar
  text: المرأة حين تلد يعتريها الحزن، لأن ساعتها قد جاءت؛ ولكنها متى ولدت الطفل، لا تعود تذكر الضيق بسبب فرحها لأن إنسانًا[a] قد وُلد إلى العالم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن ترجمة اللفظ أيضًا: «رجل». واللفظ اليوناني ἄνθρωπος قد يعني «رجلًا» أو «إنسانًا» بوجه عام؛ وهو هنا عام ولا يدل على مولود ذكر تحديدًا.'
    reason: بيان البديل المعجمي والدلالة العامة للفظ اليوناني ἄνθρωπος.
lexical_decisions:
- source_word: ἡ γυνή
  choice: المرأة
  rationale: السياق يقدم مثالًا عامًا عن الولادة، لذلك «المرأة» أدق من «الزوجة».
- source_word: ὅταν τίκτῃ
  choice: حين تلد
  rationale: صياغة عربية طبيعية تصف حالة الولادة العامة، مع إبقاء الفعل نفسه بدل تفسيره بعبارة «تكون في المخاض».
- source_word: λύπην ἔχει
  choice: يعتريها الحزن
  rationale: تحفظ البعد النفسي في λύπη وتنسجم مع مقابلة الحزن بالفرح في السياق، من غير قصر المعنى على الألم الجسدي.
- source_word: ἡ ὥρα αὐτῆς
  choice: ساعتها
  rationale: يحافظ على صورة «الساعة» وعلى صداها الموضوعي في إنجيل يوحنا، مع وضوح الإشارة هنا إلى وقت الولادة.
- source_word: ὅταν δὲ γεννήσῃ τὸ παιδίον
  choice: ولكنها متى ولدت الطفل
  rationale: ينقل اكتمال حدث الولادة، ويترجم παιδίον ترجمة مباشرة إلى «الطفل».
- source_word: οὐκέτι μνημονεύει τῆς θλίψεως
  choice: لا تعود تذكر الشدة
  rationale: «لا تعود تذكر» مقابل طبيعي مباشر، و«الشدة» تنقل ضيق التجربة من غير إدخال معنى اصطلاحي أخروي.
- source_word: διὰ τὴν χαράν
  choice: من شدة فرحها
  rationale: صياغة عربية مألوفة تفيد السببية بوضوح، أي إن الفرح هو سبب عدم تذكر الشدة.
- source_word: ὅτι ἐγεννήθη ἄνθρωπος
  choice: بأن إنسانًا قد وُلد
  rationale: يحافظ «إنسان» على الدلالة العامة لـἄνθρωπος من غير الإيحاء بأن المولود ذكر، كما تحفظ «قد وُلد» اكتمال الحدث.
- source_word: εἰς τὸν κόσμον
  choice: في العالم
  rationale: العربية الفصيحة تقول طبيعيًا إن إنسانًا وُلد «في العالم»؛ وهي تؤدي معنى دخوله إلى العالم من غير تكلّف.
theological_decisions:
- issue: الدلالة العامة لكلمة ἄνθρωπος
  choice: إنسانًا
  alternative: طفلًا؛ أو رجلًا
  rationale: الكلمة تدل هنا على كائن بشري بوجه عام، لا على مولود ذكر تحديدًا. «إنسانًا» أقرب إلى اللفظ اليوناني وتحفظ عموم الدلالة، مع بقاء «الطفل» في الجملة السابقة مقابل παιδίον.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. حُفظت «ساعتها» لما لها من دلالة مباشرة وصدى يوحناوي، واستُخدمت تراكيب طبيعية مثل «يعتريها الحزن» و«لا تعود تذكر». وُضعت علامة الحاشية بعد العبارة التي تشرحها.
