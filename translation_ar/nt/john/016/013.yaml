source:
  edition: SBLGNT
  text: ὅταν δὲ ἔλθῃ ἐκεῖνος, τὸ πνεῦμα τῆς ἀληθείας, ὁδηγήσει ὑμᾶς ⸂ἐν τῇ ἀληθείᾳ πάσῃ⸃, οὐ γὰρ λαλήσει ἀφ’ ἑαυτοῦ, ἀλλ’ ὅσα ⸀ἀκούσει λαλήσει, καὶ τὰ ἐρχόμενα ἀναγγελεῖ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/013.yaml
  text: But when he[a], the Spirit of truth, comes, he will guide you into all the truth. For he will not speak from himself, but whatever he hears he will speak[d][c][b], and he will declare to you the things that are coming.
translation:
  language: ar
  text: ولكن حين يأتي ذاك، روح الحق، فسيرشدكم في الحق كله[a]؛ لأنه لن يتكلم من نفسه[b]، بل سيتكلم بكل ما يسمعه، وسيخبركم بالأمور الآتية[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إلى الحق كله». واليونانية حرفيًا: «في الحق كله».'
    reason: بديل ترجمي يحفظ احتمال الدلالة الاتجاهية مع فعل الإرشاد.
  - marker: b
    text: 'أو: «من تلقاء نفسه». وحرفيًا: «من نفسه».'
    reason: بديل معجمي عربي أوضح لاحتمال معنى عدم الاستقلال في الكلام.
  - marker: c
    text: 'أو: «بما هو آتٍ» أو «بما سيأتي».'
    reason: بدائل طبيعية للتركيب الاسمي اليوناني τὰ ἐρχόμενα دون تحديد طبيعة الآتيات.
lexical_decisions:
- source_word: ὅταν δὲ
  choice: أَمَّا مَتَى
  rationale: تنقل «متى» دلالة الجملة الزمنية المستقبلية، وتؤدي «أمّا» وظيفة δέ الانتقالية ذات المقابلة الخفيفة في السياق.
- source_word: ἔλθῃ ἐκεῖνος
  choice: جَاءَ ذَاكَ
  rationale: الماضي العربي بعد «متى» طبيعي في الدلالة على المستقبل، و«ذاك» يحفظ بروز اسم الإشارة المذكر ἐκεῖνος والإحالة الشخصية.
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  choice: رُوحُ الْحَقِّ
  rationale: حُفظ تركيب الإضافة كما في اليونانية، وهو لقب يوحناوي معروف في السياق.
- source_word: ὁδηγήσει ὑμᾶς
  choice: فَسَيَرْشُدُكُمْ
  rationale: «يرشد» تعبير عربي طبيعي عن الهداية والتوجيه المجازيين، والفاء تربط جواب الجملة الزمنية.
- source_word: ἐν τῇ ἀληθείᾳ πάσῃ
  choice: فِي الْحَقِّ كُلِّهِ
  rationale: يحفظ حرف الجر ἐν وصيغة التعريف، ويجعل «كله» وصفًا لمجموع الحق لا لكل حقيقة على حدة.
- source_word: οὐ γὰρ λαλήσει ἀφ’ ἑαυτοῦ
  choice: لِأَنَّهُ لَنْ يَتَكَلَّمَ مِنْ نَفْسِهِ
  rationale: «لأنه» تؤدي معنى γάρ التعليلي، و«من نفسه» تقابل ἀφ’ ἑαυτοῦ رسميًا من غير إضافة معنى «السلطان» إلى النص.
- source_word: ἀλλ’ ὅσα ἀκούσει λαλήσει
  choice: بَلْ سَيَتَكَلَّمُ بِكُلِّ مَا يَسْمَعُ
  rationale: يحفظ التقابل ويعبّر عربيًا بوضوح عن شمول ما يسمعه الروح ثم يتكلم به.
- source_word: τὰ ἐρχόμενα
  choice: الْأُمُورِ الْآتِيَةِ
  rationale: ينقل اسم الفاعل المعرّف الدال على ما هو آتٍ، مع إبقاء المرجع عامًا دون حصره في النبوءات أو الأحداث وحدها.
- source_word: ἀναγγελεῖ ὑμῖν
  choice: سَيُخْبِرُكُمْ
  rationale: «يخبركم» طبيعي وواضح لمعنى الإبلاغ والإعلان في ἀναγγέλλω، ويحفظ المخاطبين مفعولًا مباشرًا في العربية.
theological_decisions:
- issue: الإحالة الشخصية إلى الروح
  choice: استعمال «ذاك» وضمائر المذكر العاقل
  alternative: تكرار «روح الحق» أو تجنب الضمير
  rationale: النص اليوناني نفسه يستعمل ἐκεῖνος المذكر مع πνεῦμα المحايد نحويًا، ولذلك يحفظ النص العربي الإحالة الشخصية من غير زيادة تقرير عقائدي.
- issue: دلالة ἐν τῇ ἀληθείᾳ πάσῃ
  choice: «في الحق كله» في المتن
  alternative: «إلى الحق كله»
  rationale: «في» تحفظ الدلالة الرسمية لحرف الجر ἐν، وهي سليمة مع «يرشد» في العربية؛ أما «إلى» فتبرز الوجهة المحتملة، ولذلك أُثبتت في الحاشية حفظًا للتوتر الدلالي.
- issue: معنى التكلم «من نفسه»
  choice: الإبقاء على العبارة الرسمية «من نفسه»
  alternative: «من تلقاء نفسه» أو «بسلطان نفسه»
  rationale: الصياغة المختارة تحفظ علاقة المصدر أو الاعتماد التي في النص من غير أن تحسمها بمعنى الاستقلال أو السلطان.
translation_notes:
  register: 'عربية فصحى حديثة واضحة ذات نبرة موقرة. استُعمل التشكيل الجزئي/الكامل لتحسين القراءة، وحُفظ ترتيب الجملة اليونانية بقدر لا يوقع في الغموض: اسم الإشارة «ذاك» يتلوه بدلٌ أو عطف بيان «روح الحق». جميع علامات الحواشي الواردة مثبتة في المتن.'
