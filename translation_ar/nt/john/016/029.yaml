base_translation:
  language: en
  yaml_path: translation/nt/john/016/029.yaml
  text: His disciples said[a], “Look[b], now you are speaking openly and are not speaking in any figure of speech.”
translation:
  language: ar
  text: 'قال تلاميذه: «ها أنت الآن تتكلم بوضوح[a]، ولا تقول أيَّ قولٍ مجازي[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «بصراحة». يمكن أن يدل التعبير اليوناني على الكلام علنًا أو بوضوح أو بصراحة.
    reason: lexical_alternative
  - marker: b
    text: أو «مثلًا» أو «قولًا مواربًا». يشير اللفظ هنا إلى كلام مجازي أو غير مباشر.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγουσιν
  choice: قال
  rationale: صيغ المضارع التاريخي بصيغة الماضي العربية الطبيعية في السرد، مع الحفاظ على وظيفته في تقديم كلام التلاميذ.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: تلاميذه
  rationale: تعبير عربي موجز وطبيعي يحفظ علاقة التلاميذ بيسوع، وأضيفت «له» مع فعل القول لبيان المخاطَب وفق السياق.
- source_word: Ἴδε
  choice: ها أنت
  rationale: أداة تنبيه عربية طبيعية تناسب خطابهم المباشر ليسوع، وتؤدي معنى لفت الانتباه من غير نبرة قديمة.
- source_word: νῦν
  choice: الآن
  rationale: يحفظ الظرف الزمني الذي يشير إلى ما لاحظه التلاميذ في طريقة كلام يسوع في تلك اللحظة.
- source_word: ἐν παρρησίᾳ
  choice: بوضوح
  rationale: يلائم التقابل السياقي مع القول المجازي أو غير المباشر، مع إبقاء دلالات الانفتاح والصراحة في الحاشية.
- source_word: λαλεῖς
  choice: تتكلم
  rationale: المضارع العربي مناسب لتعليق التلاميذ على طريقة كلام يسوع الجارية في اللحظة نفسها.
- source_word: παροιμίαν
  choice: قولٍ مجازي
  rationale: في هذا السياق اليوحناوي يدل اللفظ على الكلام التصويري أو غير المباشر أكثر من دلالته الضيقة على المثل السائر.
- source_word: οὐδεμίαν
  choice: أيَّ
  rationale: مع النفي تؤدي معنى انعدام أي قول من هذا النوع، بصياغة عربية طبيعية.
- source_word: λέγεις
  choice: تقول
  rationale: ترجمة مباشرة وطبيعية للفعل اليوناني، وتحافظ على التوازي اللفظي مع «تتكلم».
theological_decisions:
- issue: دلالة ἐν παρρησίᾳ في مقابل παροιμίαν
  choice: وصف كلام يسوع بأنه واضح ومباشر بدلًا من كونه مجازيًا أو غير مباشر
  alternative: وصفه بأنه يتكلم بصراحة أو بجرأة
  rationale: التقابل الصريح داخل الآية يرجح وضوح طريقة التعبير، لا معنى الجرأة وحده. وتحفظ الحاشية إمكان معنى الصراحة من غير فرض تفسير عقائدي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت «ها أنت» للتنبيه الطبيعي في الخطاب، و«قول مجازي» للمحافظة على التقابل بين الكلام الواضح والكلام غير المباشر. وُضعت علامتا الحاشيتين عند اللفظين اللذين تشرحانهما مباشرة.
