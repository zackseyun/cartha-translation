source:
  edition: SBLGNT
  text: Ταῦτα ἐν παροιμίαις λελάληκα ὑμῖν· ⸀ἔρχεται ὥρα ὅτε οὐκέτι ἐν παροιμίαις λαλήσω ὑμῖν ἀλλὰ παρρησίᾳ περὶ τοῦ πατρὸς ⸀ἀπαγγελῶ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/025.yaml
  text: I have spoken these things to you in figures of speech[a]. An hour is coming when I will no longer speak to you in figures of speech[c][b], but will tell you plainly about the Father.
translation:
  language: ar
  text: «قد كلَّمتكم بهذه الأمور بلغة مجازية[a]. تأتي ساعة[b] لا أعود فيها أكلِّمكم بلغة مجازية، بل أخبركم عن الآب بصراحة[c].»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «بأمثال» أو «بأقوال مواربة»؛ فاللفظ اليوناني هنا يشير إلى كلام مجازي أو غير مباشر.
    reason: lexical_alternative
  - marker: b
    text: أو «يأتي وقت». كثيرًا ما يستعمل يوحنا لفظ «الساعة» بدلالة لاهوتية.
    reason: lexical_alternative
  - marker: c
    text: أو «بوضوح» أو «بمكاشفة»؛ والمقصود هنا كلام مباشر غير مجازي.
    reason: lexical_alternative
lexical_decisions:
- source_word: παροιμίαις
  choice: بلغة مجازية
  rationale: يدل اللفظ في هذا السياق اليوحناوي على الكلام التصويري أو غير المباشر، لا بالضرورة على «المثل» بالمعنى الاصطلاحي المعروف في الأناجيل الإزائية. ويحافظ تكرار العبارة العربية على التكرار اليوناني.
- source_word: λελάληκα
  choice: قد كلَّمتكم
  rationale: تنقل «قد» دلالة الفعل التام على كلام وقع وبقي ذا صلة بالحاضر، ويُبقي فعل «كلَّم» الصلة اللفظية بالفعل اللاحق λαλήσω.
- source_word: ἔρχεται ὥρα
  choice: تأتي ساعة
  rationale: يحافظ لفظ «ساعة» على تعبير يوحنا وما قد يحمله من دلالة لاهوتية، من غير تحويله إلى «الساعة» مع أن الاسم في اليونانية غير معرّف.
- source_word: οὐκέτι
  choice: لا أعود
  rationale: تعبير عربي طبيعي ودقيق يفيد أن طريقة الكلام المذكورة لن تستمر.
- source_word: λαλήσω
  choice: أكلِّمكم
  rationale: يحافظ على الاتساق المعجمي مع λελάληκα وعلى توجيه الكلام إلى التلاميذ.
- source_word: παρρησίᾳ
  choice: بصراحة
  rationale: المقصود هنا، في مقابل اللغة المجازية، كلام مباشر واضح؛ و«بصراحة» تنقل هذا المعنى من غير حصر اللفظ في الجرأة العلنية.
- source_word: ἀπαγγελῶ
  choice: أخبركم
  rationale: يلائم فعل الإبلاغ في السياق، ويأتي طبيعيًا مع شبه الجملة «عن الآب».
- source_word: περὶ τοῦ πατρὸς
  choice: عن الآب
  rationale: صياغة عربية واضحة تحفظ موضوع الإخبار ودلالة لقب «الآب» في إنجيل يوحنا.
theological_decisions:
- issue: دلالة ὥρα في السياق اليوحناوي
  choice: تأتي ساعة
  alternative: يأتي وقت؛ تأتي الساعة
  rationale: يحفظ النص لفظ «ساعة» وما له من صدى لاهوتي في يوحنا، مع عدم إدخال التعريف الذي لا يفرضه التركيب اليوناني هنا.
- issue: معنى παρρησίᾳ في مقابل ἐν παροιμίαις
  choice: بصراحة
  alternative: بوضوح؛ علانية؛ بمكاشفة
  rationale: يركّز التقابل في الآية على الانتقال من الكلام المجازي أو غير المباشر إلى الإفصاح المباشر، لا على الجرأة وحدها أو العلنية وحدها.
translation_notes:
  register: فصحى معاصرة واضحة ورصينة. استُخدمت «بلغة مجازية» بدل المصطلح الأضيق «بأمثال»، وحُفظ تكرار فعل الكلام والتقابل بين الأسلوب المجازي والإخبار الصريح.
