lexical_decisions:
- source_word: ἔλεγον
  choice: فكانوا يقولون
  rationale: صيغة الماضي الناقص تدل على قول مستمر أو متكرر، و«كانوا يقولون» تنقل هذا الجانب بصورة طبيعية.
- source_word: οὖν
  choice: فـ
  rationale: الفاء تربط كلامهم بما سبق وتؤدي معنى الاستمرار أو النتيجة دون تكلف.
- source_word: Τί ἐστιν τοῦτο
  choice: ما معنى هذا
  rationale: الصياغة العربية الطبيعية للسؤال عن مدلول العبارة، مع بقاء حيرتهم واضحة؛ أما «ما هذا» فقد توهم السؤال عن شيء محسوس.
- source_word: ὃ λέγει μικρόν
  choice: 'الذي يقوله: ‹بعد قليل›'
  rationale: يحافظ على فعل القول ويبرز العبارة التي أثارت تساؤلهم بصفتها اقتباسًا مباشرًا.
- source_word: μικρόν
  choice: بعد قليل
  rationale: اللفظة مستعملة هنا استعمالًا زمنيًا مختصرًا، و«بعد قليل» عبارة عربية موجزة وطبيعية في السياق.
- source_word: οὐκ οἴδαμεν
  choice: لسنا نعرف
  rationale: تنقل النفي والحالة الحاضرة للفعل οἶδα بلغة عربية فصيحة واضحة.
- source_word: τί λαλεῖ
  choice: ما الذي يتحدث عنه
  rationale: تنقل المقصود من كلام يسوع بلغة طبيعية، وتتفادى تكرار «يقول» مع بقاء البديل الحرفي ممكنًا في الحاشية.
