  text: So they were saying[a], “What is this that he says, ‘A little while’? We do not know what he is saying.”
translation:
  language: ar
  text: 'فكانوا يقولون: «ما هذا الذي يقوله: ‹بعد قليل›؟ لسنا نعرف ما الذي يتحدث عنه[a].»'
  philosophy: optimal-equivalence
