  text: ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι κλαύσετε καὶ θρηνήσετε ὑμεῖς, ὁ δὲ κόσμος χαρήσεται· ⸀ὑμεῖς λυπηθήσεσθε, ἀλλ’ ἡ λύπη ὑμῶν εἰς χαρὰν γενήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/020.yaml
  text: Truly[a], truly, I say to you, you will weep and mourn, but the world will rejoice; you will be grieved, but your grief will become joy.
translation:
  language: ar
  text: 'الحقَّ الحقَّ أقول لكم: إنكم ستبكون وتنوحون، أمّا العالم فسيفرح. ستحزنون، لكن حزنكم سيصير فرحًا.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «سيتحوّل حزنكم إلى فرح».'
    reason: بديل لفظي طبيعي لعبارة εἰς χαρὰν γενήσεται.
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: الحقَّ الحقَّ
  rationale: يحفظ التكرار التوكيدي المهيب في صيغة عربية واضحة وشائعة في سياق أقوال يسوع، من غير الاكتفاء بتوكيد واحد.
- source_word: λέγω ὑμῖν
  choice: أقول لكم
  rationale: ترجمة مباشرة للصيغة اليونانية وتحافظ على أسلوب الخطاب اليوحناوي المتكرر.
- source_word: κλαύσετε καὶ θρηνήσετε
  choice: ستبكون وتنوحون
  rationale: يميّز بين البكاء والتعبير العلني الشديد عن الحزن، ويحفظ اقتران الفعلين في الأصل.
- source_word: ὁ δὲ κόσμος
  choice: أمّا العالم
  rationale: يحفظ لفظ «العالم» واتجاه المقابلة من غير إضافة تفسيرية مثل «العالم غير المؤمن».
- source_word: χαρήσεται
  choice: فسيفرح
  rationale: ينقل الفرح في مقابلة واضحة مع حزن التلاميذ، ويرتبط دلاليًا بلفظ «فرحًا» في ختام الآية.
- source_word: λυπηθήσεσθε
  choice: ستحزنون
  rationale: صياغة عربية طبيعية تؤدي معنى الوقوع في الحزن، من غير تكلّف في محاكاة المبني للمجهول اليوناني.
- source_word: ἡ λύπη ὑμῶν
  choice: حزنكم
  rationale: يحافظ على الصلة اللفظية والدلالية بالفعل السابق «ستحزنون».
- source_word: εἰς χαρὰν γενήσεται
  choice: سيصير فرحًا
  rationale: ينقل بصورة مباشرة حركة التحول التي تعبّر عنها εἰς مع γενήσεται، مع إبقاء إمكان صياغتها «سيتحوّل إلى فرح» في الحاشية.
theological_decisions:
- issue: الدلالة اليوحناوية للفظ κόσμος
  choice: العالم
  alternative: العالم غير المؤمن؛ نظام العالم
  rationale: قد يحمل اللفظ في يوحنا دلالة سلبية، لكن الآية لا تشرحها صراحة. لذلك تُحفظ العبارة الأوسع بلا توسع تفسيري أو حسم زائد.
- issue: طبيعة انتقال الحزن إلى الفرح
  choice: حزنكم سيصير فرحًا
  alternative: سيتحوّل حزنكم إلى فرح
  rationale: تحافظ الصياغة على صورة التحول في النص من غير شرح هل المقصود زوال الحزن أو تحوله من خلال الحدث نفسه.
translation_notes:
  register: عربية فصحى معاصرة واضحة وذات نبرة مهيبة. استُخدم «تنوحون» للتمييز عن «تبكون»، و«أمّا العالم» لإبراز المقابلة الطبيعية، مع تجنب الإضافات التفسيرية.
