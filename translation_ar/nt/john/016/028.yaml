base_translation:
  language: en
  yaml_path: translation/nt/john/016/028.yaml
  text: I came from the Father and have come into the world. Again[a], I am leaving the world and going to the Father.
translation:
  language: ar
  text: خرجتُ من عند الآب[a]، وقد أتيتُ إلى العالم. ومرةً أخرى أترك العالم وأمضي إلى الآب.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «خرجتُ من الآب».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον ἐκ τοῦ πατρὸς
  choice: خرجتُ من عند الآب
  rationale: ينقل فعل الحركة ومصدرها بصياغة عربية طبيعية، مع إبقاء دلالة مجيء يسوع من الآب من غير توسيع عقائدي.
- source_word: ἐλήλυθα εἰς τὸν κόσμον
  choice: وقد أتيتُ إلى العالم
  rationale: تحافظ «قد» على كون المجيء فعلًا تمّ وله صلة بالحاضر، وتؤدي «إلى العالم» معنى الحركة إلى نطاق العالم بلغة عربية واضحة.
- source_word: πάλιν
  choice: وأعود الآن
  rationale: تربط الحركة الثانية بالأولى وتبرز الانتقال المقابل من المجيء إلى العالم إلى مغادرته؛ أضيفت «الآن» لإيضاح دلالة الفعل الحاضر الوشيك في السياق.
- source_word: ἀφίημι τὸν κόσμον
  choice: فأترك العالم
  rationale: ترجمة مباشرة وطبيعية للفعل المضارع الذي يدل هنا على المغادرة الوشيكة.
- source_word: πορεύομαι πρὸς τὸν πατέρα
  choice: وأمضي إلى الآب
  rationale: «أمضي» فعل عربي فصيح واضح للحركة والمغادرة، و«إلى الآب» تحافظ على اتجاه الحركة من غير إضافة تفسيرية.
theological_decisions:
- issue: علاقة يسوع بالآب في عبارة ἐξῆλθον ἐκ τοῦ πατρὸς
  choice: خرجتُ من عند الآب
  alternative: خرجتُ من الآب
  rationale: تحفظ الصياغة دعوى الأصل والمجيء من الآب، لكنها تتجنب أن توحي العربية، من غير ضرورة نصية، بخروج مادي من داخل الآب. ولا تضيف شرحًا عقائديًا يتجاوز العبارة اليونانية.
- issue: التقابل بين المجيء إلى العالم والذهاب إلى الآب
  choice: إبقاء الحركتين متقابلتين في جملتين واضحتين
  alternative: تفسيرهما صراحةً بالتجسد والصعود
  rationale: النص يقرر المجيء من الآب ومغادرة العالم والذهاب إلى الآب، أما تسمية الحدثين عقائديًا فتزيد على ألفاظ الآية.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ومهيبة. استُعمل «الآب» بحسب الاصطلاح اليوحناوي، وحُفظ تسلسل الحركة من الآب إلى العالم ثم من العالم إلى الآب.
