  text: αὐτὸς γὰρ ὁ πατὴρ φιλεῖ ὑμᾶς, ὅτι ὑμεῖς ἐμὲ πεφιλήκατε καὶ πεπιστεύκατε ὅτι ἐγὼ παρὰ τοῦ ⸀θεοῦ ἐξῆλθον.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/027.yaml
  text: For the Father himself loves you[a], because you have loved me and have believed that I came from God.
translation:
  language: ar
  text: لِأَنَّ الآبَ نَفْسَهُ يُحِبُّكُمْ، لِأَنَّكُمْ أَحْبَبْتُمُونِي وَآمَنْتُمْ أَنِّي خَرَجْتُ مِنْ عِنْدِ اللهِ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «خرجت من الله»؛ وقد توحي العبارة اليونانية أيضًا بالخروج من حضرة الله.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς
  choice: نَفْسَهُ
  rationale: تؤدي معنى التوكيد مع «الآب»، فتبيّن أن الآب ذاته يحب التلاميذ.
- source_word: γὰρ
  choice: لِأَنَّ
  rationale: تربط الآية بما قبلها بوصفها تعليلًا أو تفسيرًا.
- source_word: ὁ πατὴρ
  choice: الآب
  rationale: لقب إلهي مألوف في إنجيل يوحنا، ويُحافظ على العلاقة المقصودة بين الآب والابن.
- source_word: φιλεῖ
  choice: يُحِبُّكُمْ
  rationale: ينقل معنى المحبة والمودة الشخصية بصياغة عربية طبيعية، من غير تهوينها إلى مجرد الاستلطاف.
- source_word: ὅτι
  choice: لِأَنَّكُمْ
  rationale: الأداة الأولى سببية، وتذكر سبب محبة الآب لهم.
- source_word: πεφιλήκατε
  choice: أَحْبَبْتُمُونِي
  rationale: الماضي العربي هو الأنسب سياقيًا لفعل المحبة الثابت ذي الأثر الحاضر، ويحافظ على الصلة المعجمية بالفعل السابق.
- source_word: πεπιστεύκατε
  choice: آمَنْتُمْ
  rationale: ينقل الإيمان بمضمون القضية التالية بعبارة عربية واضحة وطبيعية.
- source_word: παρὰ τοῦ θεοῦ
  choice: مِنْ عِنْدِ اللهِ
  rationale: يحافظ على دلالة المصدر، مع الإيحاء المحتمل بالخروج من حضرة الله، دون فرض شرح عقائدي زائد.
- source_word: ἐξῆλθον
  choice: خَرَجْتُ
  rationale: ترجمة مباشرة لفعل الخروج، وتُبقي مجال الدلالة بين الأصل والإرسال والمجيء من الحضرة.
theological_decisions:
- issue: الدلالة المسيحولوجية لعبارة «خرجت من عند الله»
  choice: خرجت من عند الله
  alternative: أتيت من الله
  rationale: تحافظ الصياغة على لغة الأصل والمهمة في النص اليوناني، وتترك أبعاد العبارة اللاهوتية للسياق بدل توسيعها إلى صيغة عقائدية تفسيرية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «الآب نفسه» لحفظ التوكيد، و«من عند الله» لصياغة طبيعية تحافظ على الاحتمال المكاني/الحضوري في παρά دون حسم زائد.
