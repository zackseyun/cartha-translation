  rationale: يحفظ صورة الصعود إلى أورشليم، من حيث موقعها المرتفع والاستعمال التقليدي المتصل بالسفر إليها.
- source_word: Ἱεροσόλυμα
  choice: أورشليم
  rationale: الصيغة العربية الكتابية الشائعة لاسم المدينة.
- source_word: Καὶ ... καὶ
  choice: و... فـ
  rationale: تربط الواو الأولى بالسياق السابق، وتعرض الفاء الحدث التالي بسلاسة مع الحفاظ على تتابع الجملتين.
