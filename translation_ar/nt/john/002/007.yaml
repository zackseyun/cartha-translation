  text: 'قال لهم يسوع: «املأوا جرار الماء بالماء». فملأوها حتى أعلاها.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: قال
  rationale: المضارع التاريخي في اليونانية يُنقل طبيعيًا بالماضي في السرد العربي، من غير تغيير في المعنى.
- source_word: αὐτοῖς
  choice: لهم
  rationale: ضمير جمع في حالة المجرور يدل على المخاطَبين الذين وجّه إليهم يسوع كلامه.
- source_word: Γεμίσατε
  choice: املأوا
  rationale: فعل أمر للجمع، وصيغة «املأوا» واضحة ومباشرة وتحافظ على قوة الأمر.
- source_word: τὰς ὑδρίας
  choice: جرار الماء
  rationale: تدل ὑδρία على جرة أو وعاء للماء؛ و«جرار الماء» تعبير عربي واضح ومتسق مع سياق الآية السابقة، من دون تكرار وصفها بأنها حجرية وهو غير وارد هنا.
- source_word: ὕδατος
  choice: ماءً
  rationale: المضاف إليه بعد فعل الملء يبيّن المحتوى؛ والنصب على التمييز في «املأوا جرار الماء ماءً» صياغة عربية موجزة وفصيحة.
- source_word: ἐγέμισαν αὐτὰς
  choice: فملأوها
  rationale: الفعل الماضي يدل على تنفيذ الأمر، والضمير يعود بوضوح إلى الجرار؛ والفاء تصل الاستجابة بالأمر اتصالًا طبيعيًا.
- source_word: ἕως ἄνω
  choice: إلى أعلاها
  rationale: العبارة تعني بلوغ الحد الأعلى، أي ملء الجرار كاملًا. «إلى أعلاها» قريبة من صورة الأصل ولا تفترض شكلًا مخصوصًا لفوهة الجرار.
