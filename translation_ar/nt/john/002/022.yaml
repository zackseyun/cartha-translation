id: JHN.2.22
reference: John 2:22
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὅτε οὖν ἠγέρθη ἐκ νεκρῶν, ἐμνήσθησαν οἱ μαθηταὶ αὐτοῦ ὅτι τοῦτο ἔλεγεν, καὶ ἐπίστευσαν τῇ γραφῇ καὶ τῷ λόγῳ ⸀ὃν εἶπεν ὁ Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/022.yaml
  text: So when he was raised from the dead, his disciples remembered that he had been saying this, and they believed the Scripture and the word that Jesus had spoken.
translation:
  language: ar
  text: فلما أُقيم من بين الأموات[a]، تذكّر تلاميذه أنه كان يقول هذا[b]، فآمنوا بالكتاب وبالكلمة التي قالها يسوع[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «قام من بين الأموات». الفعل اليوناني مبني للمجهول، ولذلك أُبقيت هذه الصيغة في المتن.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «أنه قال هذا». قد يدل الفعل بصيغة الماضي الناقص على قول سابق منظور إليه في امتداده، لكنه لا يقتضي بالضرورة التكرار.'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «بالقول الذي قاله يسوع». يمكن أن تعني اللفظة اليونانية كلمة أو قولًا أو رسالة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε οὖν
  choice: فلما
  rationale: تجمع «الفاء» قوة οὖν في الاستمرار والاستنتاج السردي، وتؤدي «لما» معنى الظرف الزمني ὅτε بصياغة عربية طبيعية.
- source_word: ἠγέρθη
  choice: أُقيم
  rationale: يحفظ المبني للمجهول في اليونانية، وهو في سياق القيامة يدل على الإقامة من الموت، من غير تحويله إلى صيغة «قام» اللازمة.
- source_word: ἐκ νεκρῶν
  choice: من بين الأموات
  rationale: ينقل حرف الجر وصيغة الجمع، ويعبّر بوضوح عن الإقامة من وسط الأموات.
- source_word: ἐμνήσθησαν
  choice: تذكّر
  rationale: المقابل العربي الطبيعي للدخول في حالة التذكّر، مع مطابقة الفاعل الجمع في «تلاميذه» بحسب الاستعمال العربي.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: تلاميذه
  rationale: صياغة عربية موجزة وطبيعية للتركيب الإضافي الدال على الملكية.
- source_word: ὅτι τοῦτο ἔλεγεν
  choice: أنه كان يقول هذا
  rationale: تحفظ «كان يقول» قيمة الماضي الناقص ἔλεγεν بوصفه كلامًا سابقًا منظورًا إليه في امتداده، من غير الجزم بأنه تكرر.
- source_word: ἐπίστευσαν
  choice: آمنوا
  rationale: المقابل المعتاد لـ πιστεύω، ويلائم تعديته بالباء إلى مضمون الكتاب والكلمة من غير إضافة تفسيرية.
- source_word: τῇ γραφῇ
  choice: بالكتاب
  rationale: يحفظ المفرد ويشير في السياق إلى الكتاب المقدس بوصفه نصًا ذا سلطان، مع استعمال عربي كتابي واضح.
- source_word: τῷ λόγῳ
  choice: بالكلمة
  rationale: يحفظ لفظ λόγος وصلته بقول يسوع، مع إمكان فهمه هنا بمعنى القول أو الكلام.
- source_word: ὃν εἶπεν ὁ Ἰησοῦς
  choice: التي قالها يسوع
  rationale: صلة موصول طبيعية تعود إلى «الكلمة» وتبيّن أنها قول يسوع السابق.
theological_decisions:
- issue: صيغة فعل القيامة المبنية للمجهول
  choice: أُقيم من بين الأموات
  alternative: قام من بين الأموات
  rationale: يحفظ الاختيار صيغة الفعل اليوناني المبنية للمجهول ولا يحسم ضمنًا ما لا تعبّر عنه الصيغة النحوية هنا، مع بقاء البديل العربي الشائع مذكورًا في الحاشية.
- issue: الإيمان بالكتاب وبكلمة يسوع
  choice: آمنوا بالكتاب وبالكلمة
  alternative: صدّقوا الكتاب والكلمة
  rationale: «آمنوا بـ» تنقل πιστεύω مع المفعولين في حالة الداتيف بصورة طبيعية وتحافظ على البعد الإيماني للنص، من غير توسيعه إلى «وثقوا» أو قصره على التصديق الذهني وحده.
- issue: دلالة الماضي الناقص في قول يسوع
  choice: كان يقول هذا
  alternative: قال هذا
  rationale: تحفظ الصياغة الجانب غير المحدد أو الممتد للماضي الناقص، من غير فرض أن يسوع كرر العبارة مرات متعددة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «فلما» لوصل السرد طبيعيًا، و«أُقيم» لحفظ المبني للمجهول، و«كان يقول» لصون قيمة الماضي الناقص. وُضعت جميع علامات الحواشي في المتن عند المواضع المعنية.
