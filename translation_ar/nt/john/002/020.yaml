  text: εἶπαν οὖν οἱ Ἰουδαῖοι· Τεσσεράκοντα καὶ ἓξ ἔτεσιν οἰκοδομήθη ὁ ναὸς οὗτος, καὶ σὺ ἐν τρισὶν ἡμέραις ἐγερεῖς αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/john/002/020.yaml
  text: So the Jews said[a], “This temple was built in forty-six years[b], and will you raise it up in three days?”
translation:
  language: ar
  text: 'فقال اليهود[a]: «بُني هذا الهيكل في ستٍّ وأربعين سنة، أفأنت تقيمه[b] في ثلاثة أيام؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أهل اليهودية». يقول اليوناني «اليهود»، ويستعمل يوحنا هذا التعبير بدلالات مختلفة بحسب السياق.'
    reason: alternative_reading
  - marker: b
    text: 'يمكن أن يُفهم كلامهم بمعنى: «تعيد بناءه». لكن «تقيمه» تحافظ على اللفظ الذي يربطه يوحنا لاحقًا بقيامة يسوع.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: فقال
  rationale: تؤدي الفاء معنى الانتقال الناتج عما قاله يسوع قبل ذلك، وتجيء طبيعية في السرد العربي دون إثقال العبارة بـ«إذًا».
- source_word: οἱ Ἰουδαῖοι
  choice: اليهود
  rationale: هذا هو المقابل المباشر للعبارة اليونانية، من غير تضييق مرجعها إلى «القادة» بما لا يصرّح به النص. وتوضح الحاشية إمكان الدلالة على أهل اليهودية بحسب السياق.
- source_word: Τεσσεράκοντα καὶ ἓξ ἔτεσιν
  choice: في ستٍّ وأربعين سنة
  rationale: تفيد مدة البناء التي استغرقتها العملية، وتحافظ على صياغة الزمن الواردة في اليونانية.
- source_word: οἰκοδομήθη
  choice: بُني
  rationale: مبني للمجهول يلائم صيغة الفعل اليوناني ويعرض عملية البناء إجمالًا دون إضافة تفسير تاريخي.
- source_word: ὁ ναὸς οὗτος
  choice: هذا الهيكل
  rationale: «الهيكل» هو التعبير العربي الواضح والمألوف للمقدس المقصود، وهو أدق في هذا السياق من لفظ يدل على مجمل ساحات المعبد.
- source_word: καὶ σὺ
  choice: أفأنت
  rationale: تُبرز الفاء والهمزة الاستفهام الإنكاري، ويؤكد الضمير المنفصل «أنت» النبرة الاستبعادية في السؤال.
- source_word: ἐν τρισὶν ἡμέραις
  choice: في ثلاثة أيام
  rationale: تعبير زمني عربي طبيعي يحافظ على الصياغة التي يمهد بها السياق للإشارة إلى القيامة.
- source_word: ἐγερεῖς
  choice: تقيمه
  rationale: 'يحافظ فعل «تقيم» على التوتر الدلالي: يمكن أن يفهمه المتكلمون في شأن إقامة الهيكل، ويرتبط في الوقت نفسه بلغة إقامة يسوع من الموت في تفسير يوحنا اللاحق.'
- source_word: αὐτόν
  choice: ـه
  rationale: ضمير المفعول المتصل يعود طبيعيًا في العربية على «الهيكل».
theological_decisions:
- issue: احتمال إساءة فهم οἱ Ἰουδαῖοι بوصفها تعميمًا على جميع اليهود
  choice: إبقاء «اليهود» في المتن مع حاشية توضيحية
  alternative: أهل اليهودية؛ قادة اليهود
  rationale: يحافظ المتن على اللفظ اليوناني من غير تحميله تحديدًا غير مصرح به، بينما تنبه الحاشية إلى أن استعمال يوحنا يتغير باختلاف السياق ولا يلزم أن يكون تعميمًا على جميع اليهود.
- issue: صلة ἐγερεῖς بصورة القيامة
  choice: «تقيمه»
  alternative: تعيد بناءه
  rationale: لا تحسم الترجمة سوء فهم السامعين مقدمًا، بل تصون المفارقة التي يوضحها يوحنا لاحقًا حين يربط قول يسوع بجسده وقيامته.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدم «ستٍّ وأربعين» وفق حكم العدد مع «سنة»، وصيغ السؤال بـ«أفأنت» لإظهار الاستنكار والتوكيد. وُضعت علامة الحاشية الثانية بعد تمام الاقتباس لأنها تشرح الفعل المحوري في السؤال كله.
