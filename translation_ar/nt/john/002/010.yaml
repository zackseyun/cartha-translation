  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Πᾶς ἄνθρωπος πρῶτον τὸν καλὸν οἶνον τίθησιν, καὶ ὅταν ⸀μεθυσθῶσιν τὸν ἐλάσσω· σὺ τετήρηκας τὸν καλὸν οἶνον ἕως ἄρτι.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/010.yaml
  text: And he said to him[a], “Everyone sets out the good wine first, and when they have become drunk, then the inferior[b]. But you have kept the good wine until now.”
translation:
  language: ar
  text: 'وقال له: «كل إنسان[a] يقدِّم الخمر الجيدة أولًا، ومتى سكروا[b] يقدِّم الخمر الأقل جودة؛ أما أنت فقد أبقيت الخمر الجيدة إلى الآن».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: التعبير اليوناني في صيغة المفرد، ومعناه الناس عمومًا، لا الذكور وحدهم.
    reason: cultural_note
  - marker: b
    text: 'يمكن أيضًا: «حين يكونون قد سكروا». الفعل اليوناني يعني عادةً بلوغ السكر؛ وقد تُلطِّف بعض الترجمات العبارة فتقول: «حين يشربون كثيرًا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτῷ
  choice: وقال له
  rationale: الفعل المضارع اليوناني هنا مضارع تاريخي في سياق سردي، وصيغة الماضي العربية هي الأنسب طبيعيًا مع الحفاظ على قوة القول المباشر.
- source_word: Πᾶς ἄνθρωπος
  choice: كل إنسان
  rationale: يحافظ التعبير على صيغة المفرد الدالة على العموم، ولا يحصر المقصود في الذكور.
- source_word: πρῶτον
  choice: أولًا
  rationale: ينقل الترتيب الزمني الذي يدل عليه الظرف اليوناني نقلًا مباشرًا وطبيعيًا.
- source_word: τὸν καλὸν οἶνον
  choice: الخمر الجيدة
  rationale: تدل καλός هنا على الجودة، وهذا التعبير يحفظ المقابلة مع الخمر الأقل جودة من غير مبالغة في المعنى.
- source_word: τίθησιν
  choice: يقدِّم
  rationale: المعنى الحرفي هو يضع، لكن سياق الوليمة يجعل «يقدِّم» أوضح تعبير عربي عن عرض الخمر للضيوف.
- source_word: ὅταν μεθυσθῶσιν
  choice: متى سكروا
  rationale: يحفظ المعنى المعتاد للفعل μεθύω، أي بلوغ السكر، ولا يلطّفه إلى مجرد الشرب بكثرة. وتناسب «متى» التعميم المتكرر في العبارة.
- source_word: τὸν ἐλάσσω
  choice: الخمر الأقل جودة
  rationale: الصفة المقارنة تعني الأدنى أو الأقل، والخمر محذوفة في اليونانية اعتمادًا على السياق؛ وذِكرها في العربية يوضح المقابلة، مع بيان أن النقص في الجودة.
- source_word: τετήρηκας
  choice: فقد أبقيت
  rationale: 'ينقل الفعل التام عملًا سابقًا له نتيجة حاضرة: ظلت الخمر الجيدة محفوظة حتى هذه اللحظة.'
- source_word: ἕως ἄρτι
  choice: إلى الآن
  rationale: تعبير عربي طبيعي ودقيق عن بلوغ الزمن الحاضر في سياق الرواية.
theological_decisions:
- issue: معنى μεθυσθῶσιν في سياق معجزة تتعلق بالخمر
  choice: متى سكروا
  alternative: متى شربوا كثيرًا / متى ارتووا من الشرب
  rationale: المعنى الصريح المعتاد للفعل هو السكر. تنقل الترجمة ملاحظة المتكلم الاجتماعية كما هي من غير أن تجعلها إقرارًا أخلاقيًا، ومن غير أن تخفف توتر النص لأسباب مذهبية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «يقدِّم» بدل النقل الحرفي «يضع» لملاءمة سياق الوليمة، وحُفظت دلالة السكر الصريحة، مع تجنب أي صياغة مذهبية أو أخلاقية مضافة.
