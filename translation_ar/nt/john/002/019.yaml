base_translation:
  language: en
  yaml_path: translation/nt/john/002/019.yaml
  text: Jesus answered and said to them[a], “Destroy this temple, and in three days I will raise it up.”
translation:
  language: ar
  text: 'أجاب يسوع وقال لهم: «اهدموا هذا الهيكل، وفي ثلاثة أيام سأقيمه».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «انقضوا هذا الهيكل ... فسأعيد بناءه». ويمكن أن يحمل الفعل اليوناني المترجم «سأقيمه» صدى القيامة؛ ويوضح يوحنا لاحقًا أن يسوع كان يتكلم عن هيكل جسده (2:21).'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη ... καὶ εἶπεν
  choice: فأجابهم يسوع وقال
  rationale: يحافظ على البنية السردية اليونانية ذات الصياغة السامية، مع تعبير عربي فصيح وطبيعي.
- source_word: Λύσατε
  choice: اهدموا
  rationale: الفعل هنا أمر بالهدم أو النقض، لا بمجرد الحلّ؛ و«اهدموا» واضح ومناسب لسياق الهيكل.
- source_word: τὸν ναὸν τοῦτον
  choice: هذا الهيكل
  rationale: «الهيكل» هو المقابل العربي المألوف لـναός في هذا السياق، مع إبقاء اسم الإشارة والغموض المقصود في هوية المشار إليه.
- source_word: ἐν τρισὶν ἡμέραις
  choice: في ثلاثة أيام
  rationale: ترجمة مباشرة وطبيعية تحفظ الدلالة الزمنية من غير تضييقها إلى تفسير أدق مما يقتضيه النص.
- source_word: ἐγερῶ αὐτόν
  choice: سأقيمه
  rationale: «أقام» يلائم إقامة ما هُدم، ويحفظ في الاستعمال الكتابي صدى القيامة الذي يحمله ἐγείρω، بخلاف «سأعيد بناءه» التي تحصر المعنى في البناء.
theological_decisions:
- issue: هل يُصرَّح في الآية بأن الهيكل هو جسد يسوع؟
  choice: الإبقاء على «هذا الهيكل» بلا تفسير داخل المتن
  alternative: اهدموا هذا الهيكل، أي جسدي
  rationale: يقدّم يوحنا تفسير القول في 2:21؛ والتصريح به هنا يزيل الغموض السردي والتوتر اللاهوتي المقصودين.
- issue: هل يُترجم ἐγερῶ بلغة البناء أم بلفظ يحتمل صدى القيامة؟
  choice: سأقيمه
  alternative: سأعيد بناءه
  rationale: «سأقيمه» مفهوم في صورة الهيكل، وفي الوقت نفسه يحفظ إيحاء إقامة الجسد من الموت، من غير حسم المعنى في اتجاه معماري فقط.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعمل «الهيكل» للمصطلح المألوف في السياق اليوحناوي، و«سأقيمه» للمحافظة على التداخل المقصود بين إعادة إقامة الهيكل والقيامة.
