base_translation:
  language: en
  yaml_path: translation/nt/john/002/006.yaml
  text: There were six stone water jars standing there[a], in accordance with the Jewish rites of purification[b], each holding two or three measures.
translation:
  language: ar
  text: وكانت هناك ست جرار ماء حجرية موضوعة بحسب عادة التطهير عند اليهود، يسع كلٌّ منها مكيالين أو ثلاثة.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «المكيال» هنا هو المِترِيتِس اليوناني، وهو مكيال قديم للسوائل يعادل تقريبًا 35–40 لترًا؛ فكانت سعة كل جرة نحو 70–120 لترًا.
    reason: cultural_note
lexical_decisions:
- source_word: λίθιναι ὑδρίαι
  choice: أجران من حجر
  rationale: «أجران» تعبير عربي طبيعي لأوعية الماء الكبيرة، و«من حجر» يحفظ مادة صنعها المذكورة صراحة في اليونانية.
- source_word: ἦσαν δὲ ἐκεῖ
  choice: وكانت هناك
  rationale: الواو تنقل الربط السردي الخفيف في δέ من غير إضافة ظرف زمان غير موجود، و«هناك» تقابل ἐκεῖ.
- source_word: κατὰ τὸν καθαρισμὸν τῶν Ἰουδαίων
  choice: للتطهير عند اليهود
  rationale: ينقل العبارة بإيجاز مع إبقاء الصلة بين الأجران وممارسة التطهير الطقسية المعروفة عند اليهود، من غير حصر κατά قسرًا في معنى واحد دقيق.
- source_word: κείμεναι
  choice: موضوعة
  rationale: ينقل معنى كون الأجران موضوعة أو قائمة في المكان، وهو أدق من ترجمة حرفية قد توحي بأنها ملقاة.
- source_word: χωροῦσαι ἀνὰ μετρητὰς δύο ἢ τρεῖς
  choice: يسع كلٌّ منها مكيالين أو ثلاثة
  rationale: «يسع» يعبّر عن السعة، و«كلٌّ منها» ينقل الدلالة التوزيعية لـἀνά، مع إبقاء وحدة القياس القديمة في النص وشرحها في الحاشية.
theological_decisions:
- issue: دلالة τῶν Ἰουδαίων في السياق اليوحناوي
  choice: عند اليهود
  alternative: عند أهل اليهودية
  rationale: السياق يتحدث عن ممارسة تطهير دينية وثقافية، لا عن الهوية الإقليمية تحديدًا؛ لذلك «اليهود» أوضح هنا ولا تضيف نبرة جدلية.
- issue: دلالة κατά في صلة الأجران بالتطهير
  choice: للتطهير
  alternative: بحسب عادة التطهير
  rationale: قد تدل العبارة على تخصيص الأجران للتطهير أو ارتباطها بعادته؛ اختيرت صياغة عربية طبيعية، مع تجنب تفصيل طقوس غير مذكور في النص.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم «أجران» بدل «جرار ماء» لأن السياق يدل على أوعية حجرية كبيرة، مع الحفاظ على وحدة القياس القديمة في المتن وشرحها في الحاشية.
