revisions:
- from: وكانت هناك ستة أجران من حجر موضوعة للتطهير عند اليهود، يسع كلٌّ منها مكيالين أو ثلاثة.[a]
  to: وكانت هناك ست جرار ماء حجرية موضوعة بحسب عادة التطهير عند اليهود، يسع كلٌّ منها مكيالين أو ثلاثة.[a]
  rationale: استُبدلت «أجران» بـ«جرار ماء» لتأدية نوع الوعاء المذكور في الأصل بدقة وبعربية فصحى طبيعية. وعُدلت عبارة التطهير لتشير إلى العادة الطقسية التي يحيل إليها النص، مع الحفاظ على عدم حسم الدلالة الدقيقة لحرف κατά بأكثر مما يحتمله السياق. كما أوضحت الحاشية أن تقدير السعة هو لكل جرة.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:36:23Z'
review_pass:
  verdict: revise
  source_fidelity: المعنى العام محفوظ، بما في ذلك العدد والمادة والسعة التوزيعية. لكن «أجران» تُستعمل في العربية غالبًا للحوض أو الحفرة/المِهراس، ولا تؤدي بدقة معنى ὑδρίαι، أي جرار الماء. كما أن «للتطهير عند اليهود» تختزل علاقة العبارة بالعُرف الطقسي؛ و«بحسب عادة التطهير عند اليهود» أوضح وأقرب من غير تحميلٍ تفصيلي زائد.
  naturalness: النص سليم التركيب إجمالًا، لكن «ستة أجران من حجر» أقل طبيعية ودقة من «ست جرار ماء حجرية». والصياغة المقترحة تحافظ على فصحى حديثة واضحة.
  terminology: «جرار ماء حجرية» تحافظ على كونها أوعية للماء ومصنوعة من الحجر. و«عادة التطهير عند اليهود» تنقل καθαρισμός في سياقه الطقسي وτῶν Ἰουδαίων دون تحويل الهوية إلى دلالة إقليمية. أبقيت «مكيال» للمِترِيتِس مع بيان تقريبي في الحاشية.
  issues:
  - severity: medium
    issue: اختيار «أجران» مقابل ὑδρίαι
    rationale: «الجرن» في الاستعمال العربي المعياري ليس جرة ماء على نحو مباشر، وقد يوحي بحوض أو وعاء ثابت/مِهراس. المصدر يصف جرارًا للماء؛ لذلك يلزم اختيار «جرار ماء».
  - severity: low
    issue: صياغة علاقة الجرار بالتطهير
    rationale: «للتطهير عند اليهود» مفهومة، لكنها لا تُظهر بوضوح أن المرجع هو عادة/نظام التطهير المذكور في العبارة اليونانية. «بحسب عادة التطهير عند اليهود» أدق وأيسر عربيًا مع إبقاء سعة κατά المحتملة.
  revised_text: وكانت هناك ست جرار ماء حجرية موضوعة بحسب عادة التطهير عند اليهود، يسع كلٌّ منها مكيالين أو ثلاثة.[a]
