  yaml_path: translation/nt/john/002/012.yaml
  text: After this he went down to Capernaum[a], he and his mother and his brothers and his disciples, and they stayed there not many days.
translation:
  language: ar
  text: بعد ذلك نزل إلى كفرناحوم، هو وأمّه وإخوته[a] وتلاميذه، ولم يقيموا هناك أيامًا كثيرة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أقاربه» أو «ذوو قرابته»؛ فاللفظة اليونانية قد تعني الإخوة بالمعنى المحدد، وقد تشير في بعض السياقات إلى صلة قرابة أوسع.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ τοῦτο
  choice: بعد ذلك
  rationale: تعبير زمني عربي طبيعي يحفظ الإشارة المفردة في الأصل.
- source_word: κατέβη
  choice: نزل
  rationale: يحفظ معنى الحركة إلى موضع أخفض، وهو ملائم للانتقال الجغرافي إلى كفرناحوم.
- source_word: εἰς Καφαρναοὺμ
  choice: إلى كفرناحوم
  rationale: حرف الغاية «إلى» هو الأنسب عربيًا مع اسم المدينة، والاسم منقول بصيغته العربية الشائعة.
- source_word: αὐτὸς
  choice: هو
  rationale: إثبات الضمير يعكس وروده الصريح في اليونانية ويمهّد لذكر المصاحبين من غير تشديد زائد.
- source_word: ἡ μήτηρ αὐτοῦ
  choice: أمّه
  rationale: ينقل النص كما هو من غير إضافة اسم مريم، إذ لا يرد في الآية.
- source_word: οἱ ἀδελφοὶ
  choice: إخوته
  rationale: المعنى المباشر للجمع المذكر هو الإخوة؛ وتُذكر دلالة القرابة الأوسع الممكنة في الحاشية حفاظًا على الاحتمال المعجمي.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: تلاميذه
  rationale: «التلاميذ» مصطلح إنجيلي راسخ يجمع دلالتي التعلّم والاتباع.
- source_word: ἐκεῖ ἔμειναν
  choice: أقاموا هناك
  rationale: صياغة عربية واضحة وطبيعية، والجمع يحفظ اشتراك الجماعة في الإقامة.
- source_word: οὐ πολλὰς ἡμέρας
  choice: أيامًا غير كثيرة
  rationale: يحفظ صيغة النفي في اليونانية بدل تحويلها إلى العبارة التفسيرية «بضعة أيام فقط».
theological_decisions:
- issue: دلالة οἱ ἀδελφοὶ وصلتهم العائلية بيسوع
  choice: إخوته
  alternative: أقاربه أو ذوو قرابته
  rationale: يدل اللفظ اليوناني مباشرةً على الإخوة، لكنه قد يُستعمل في بعض السياقات لقرابة أوسع. لذلك يُحفظ المعنى المباشر في المتن والاحتمال الأوسع في الحاشية من غير حسم خلاف لاهوتي لاحق.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ ترتيب أفراد الجماعة وإيقاع الجملة قدر الإمكان، مع استعمال «أقاموا» بوصفها صياغة عربية طبيعية، وإبقاء التعبير المنفي «أيامًا غير كثيرة» قريبًا من بنية الأصل.
