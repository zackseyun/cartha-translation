  text: ⸀ἐμνήσθησαν οἱ μαθηταὶ αὐτοῦ ὅτι γεγραμμένον ἐστίν· Ὁ ζῆλος τοῦ οἴκου σου καταφάγεταί με.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/017.yaml
  text: His disciples remembered that it is written[a], “Zeal for your house will consume me.”
translation:
  language: ar
  text: 'فتذكَّر تلاميذه أنَّ المكتوب يقول: «الغيرة على بيتك ستلتهمني».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو بحسب صيغة المزمور 69:9 في بعض التقاليد النصية: «قد التهمتني»؛ أمّا اليونانية في يوحنا هنا فتقول: «ستلتهمني».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμνήσθησαν
  choice: تذكَّر
  rationale: الفعل اليوناني بصيغة الماضي يدل هنا بصورة طبيعية على أن التلاميذ تذكّروا قولًا كتابيًا؛ وصيغة «تذكَّر» عربية واضحة ومباشرة.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: تلاميذه
  rationale: «التلاميذ» المقابل العربي المألوف والدقيق لـ μαθηταί، والضمير المتصل ينقل αὐτοῦ بإيجاز طبيعي.
- source_word: γεγραμμένον ἐστίν
  choice: المكتوب يقول
  rationale: تعبير عربي طبيعي لتقديم اقتباس من الكتاب، يحفظ معنى الصيغة الدالة على بقاء ما كُتب نافذًا دون التزام بترجمة حرفية ثقيلة مثل «قد كُتب».
- source_word: ζῆλος
  choice: الغيرة
  rationale: تنقل شدة الحماسة والتفاني في السياق الكتابي، وهي أرسخ عربيًا هنا من «الحماس» وأقرب إلى دلالة اللفظ في اقتباس المزمور.
- source_word: τοῦ οἴκου σου
  choice: على بيتك
  rationale: حُفظ لفظ «البيت» كما في الاقتباس، بدل تفسيره مباشرةً بـ«الهيكل»، للمحافظة على الصلة بالمزمور؛ وحرف «على» يعبّر طبيعيًا عن التعلّق الغيور بالبيت.
- source_word: καταφάγεταί
  choice: ستلتهمني
  rationale: الفعل مستقبل وذو صورة قوية تعني الأكل التام أو الالتهام؛ «ستلتهمني» تحفظ زمنه وقوته المجازية.
- source_word: με
  choice: ني
  rationale: ضمير مفعول به متصل ينقل «إياي/أنا» في العبارة العربية بصورة طبيعية.
theological_decisions:
- issue: زمن الفعل في اقتباس المزمور وتطبيقه على يسوع
  choice: 'الإبقاء على المستقبل: «ستلتهمني»'
  alternative: «التهمتني» أو «قد التهمتني»
  rationale: نص يوحنا اليوناني في SBLGNT يقرأ καταφάγεταί، وهو مستقبل. لذلك تُحفظ صياغة يوحنا ولا تُسوّى بصيغة الماضي الواردة في بعض تقاليد نص المزمور.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «المكتوب يقول» بوصفه تعبيرًا طبيعيًا لتقديم نص كتابي، وحُفظت الصورة القوية في «ستلتهمني» مع وضع علامة الحاشية بعد الاقتباس.
