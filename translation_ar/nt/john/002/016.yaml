  text: And he said to those selling the doves[a], “Take these things away from here; do not make my Father’s house a house of trade.”
translation:
  language: ar
  text: 'وقال لبائعي الحمام: «أخرجوا هذه من هنا، ولا تجعلوا بيت أبي بيتَ تجارةٍ[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «سوقًا». واليونانية حرفيًا أقرب إلى «بيت تجارة»، وبذلك يتكرر لفظ «بيت» في الجملة.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιστερὰς
  choice: الحمام
  rationale: يدل اللفظ على الطيور التي كانت تُباع للذبائح، و«الحمام» هو المقابل العربي الطبيعي الشامل في هذا السياق.
- source_word: πωλοῦσιν
  choice: لبائعي
  rationale: ينقل اسم الفاعل اليوناني الذي يعرّف المخاطَبين بحسب نشاطهم الجاري، بصياغة عربية موجزة وطبيعية.
- source_word: Ἄρατε
  choice: ارفعوا
  rationale: فعل أمر حاسم، و«ارفعوا ... من هنا» يحافظ على معنى أخذ الأشياء وإزالتها من الموضع دون زيادة تفسيرية.
- source_word: ταῦτα
  choice: هذه
  rationale: اسم إشارة محايد جمع في اليونانية، ويرجح أنه يشير إلى الحمام أو ما يتصل ببيعه. أبقت العربية المرجع عامًا بدل تخصيصه بما لا يصرح به النص.
- source_word: ἐντεῦθεν
  choice: من هنا
  rationale: ينقل دلالة الإبعاد عن المكان الحاضر بوضوح، وتكتمل دلالة الإزالة مع فعل «ارفعوا».
- source_word: μὴ ποιεῖτε
  choice: لا تجعلوا
  rationale: ينقل النهي المباشر مع الحفاظ على الصلة المعجمية بفعل «يجعل»، من غير حسم ما إذا كان التركيز على وقف فعل جارٍ أو منعه.
- source_word: οἶκον τοῦ πατρός μου
  choice: بيت أبي
  rationale: يحافظ على الإضافة وعلى ضمير المتكلم المفرد في قول يسوع، بصياغة عربية طبيعية ودقيقة.
- source_word: οἶκον ἐμπορίου
  choice: بيتَ تجارةٍ
  rationale: يحافظ على تكرار «بيت» في الأصل وعلى المقابلة البلاغية بين بيت الآب وبيت التجارة، مع بيان البديل الاصطلاحي في الحاشية.
theological_decisions:
- issue: تسمية يسوع للهيكل «بيت أبي»
  choice: الإبقاء على العبارة الصريحة «بيت أبي»
  alternative: بيت أبينا؛ بيت الله
  rationale: النص اليوناني يستعمل ضمير المتكلم المفرد μου مع «أبي»، ولذلك ينبغي حفظ دعوى البنوة وسلطة يسوع في السياق من غير تخفيفها أو توسيعها.
- issue: طبيعة الاعتراض على النشاط التجاري في الهيكل
  choice: «بيت تجارة»
  alternative: سوقًا
  rationale: الصياغة المختارة تحفظ التكرار البلاغي لكلمة «بيت» ولا تضيف حكمًا أوسع من اعتراض النص على تحويل بيت الآب إلى موضع للتجارة.
