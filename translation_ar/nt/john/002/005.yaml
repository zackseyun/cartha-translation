  text: λέγει ἡ μήτηρ αὐτοῦ τοῖς διακόνοις· ⸂Ὅ τι⸃ ἂν λέγῃ ὑμῖν ποιήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/005.yaml
  text: His mother said to the servants[a], “Whatever he tells you, do it.”
translation:
  language: ar
  text: 'قالت أمّه للخدم: «مهما قال لكم، فافعلوه».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μήτηρ αὐτοῦ
  choice: أمّه
  rationale: صياغة عربية طبيعية تحفظ الإضافة والتعريف العائلي في السرد.
- source_word: διακόνοις
  choice: للخدم
  rationale: السياق هو خدمة الحاضرين في العرس، لا رتبة كنسية؛ و«الخدم» واضحة وطبيعية هنا.
- source_word: Ὅ τι ἂν
  choice: مهما
  rationale: تنقل أداة الوصل غير المحددة مع ἄν، الدالة على العموم والاحتمال المفتوح.
- source_word: λέγῃ ὑμῖν
  choice: قال لكم
  rationale: المضارع الالتزامي بعد ἄν يفيد قولًا مستقبليًا غير محدد؛ ويؤدي الماضي العربي بعد «مهما» هذا المعنى بصورة فصيحة وطبيعية.
- source_word: ποιήσατε
  choice: فافعلوه
  rationale: أمر للجمع، والضمير يعيد على مضمون ما سيقوله، فيجعل العبارة طبيعية من غير زيادة تفسيرية.
theological_decisions:
- issue: مرجع الفاعل المستتر في λέγῃ
  choice: إبقاء الفاعل مستترًا في «قال»، وهو عائد إلى يسوع بحسب السياق
  alternative: مهما قال لكم يسوع، فافعلوه
  rationale: اليونانية لا تصرّح بالاسم، والسياق يوضح المرجع؛ لذا تحفظ العربية إيجاز الأصل ولا تضيف تفسيرًا غير لازم.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «مهما قال لكم، فافعلوه» للموازنة بين دقة البنية اليونانية وطبيعية التعبير العربي، من غير إدخال دلالة كنسية على διακόνοις.
