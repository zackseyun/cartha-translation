base_translation:
  language: en
  yaml_path: translation/nt/john/002/018.yaml
  text: So the Jews answered and said to him[a], “What sign do you show us, that you do these things?”
translation:
  language: ar
  text: 'فأجاب اليهود وقالوا له[a]: «أيَّ آيةٍ تُرينا لتُثبت أن لك أن تفعل هذه الأمور؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «القادة اليهود»، أو: «اليهوديون». قد تدل عبارة «اليهود» في إنجيل يوحنا، بحسب السياق، على جماعة أضيق تمثّلهم، ولا سيما السلطات اليهودية في اليهودية.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθησαν οὖν
  choice: فأجاب
  rationale: تنقل «فـ» استمرارية السياق ونتيجته، و«أجاب» هو التعبير السردي العربي الطبيعي للاستجابة الكلامية، ولا حاجة إلى تكرار «أجابوا وقالوا» في العربية.
- source_word: οἱ Ἰουδαῖοι
  choice: اليهود
  rationale: ترجمة مباشرة تحفظ عموم العبارة اليونانية من غير أن تقيّد مرجعها في المتن بالقادة أو باليهوديين؛ ويبيّن الهامش احتمال التضييق السياقي.
- source_word: εἶπαν αὐτῷ
  choice: وقالوا له
  rationale: نقل مباشر لمقدمة الكلام، مع إبقائها بعد «أجاب» حفاظًا على البنية التوكيدية في الأصل.
- source_word: Τί σημεῖον
  choice: أيَّ آيةٍ
  rationale: «آية» مصطلح عربي كتابي طبيعي لعلامة ذات دلالة وإثبات، ويحفظ وظيفة σημεῖον في يوحنا أفضل من «معجزة».
- source_word: δεικνύεις ἡμῖν
  choice: تُرينا
  rationale: فعل متعدٍّ طبيعي يجمع معنى «تُظهر لنا» بإيجاز، ويحفظ طلب الدليل المرئي.
- source_word: ὅτι ταῦτα ποιεῖς
  choice: حتى تفعل هذه الأمور
  rationale: 'يفهم ὅτι هنا على أنه يربط العلامة بالسلطان أو المسوّغ لفعل هذه الأمور: أي ما الآية التي يريهم إياها لكي يكون له أن يفعلها. الصياغة العربية طبيعية وتحفظ نبرة التحدي، مع بقاء العلاقة الدلالية قابلة للفهم سببيةً أو تبريريةً.'
theological_decisions:
- issue: مرجع عبارة «اليهود» في إنجيل يوحنا
  choice: إبقاء «اليهود» في المتن
  alternative: القادة اليهود؛ اليهوديون
  rationale: الأصل لا يصرّح هنا بأن المقصود جميع اليهود ولا يعيّن القادة صراحة. لذلك تُحفظ العبارة في المتن، ويُنبه الهامش إلى إمكان أن تشير سياقيًا إلى جماعة ممثلة، ولا سيما السلطات اليهودية في اليهودية.
- issue: دلالة طلب الآية
  choice: «أيَّ آيةٍ تُرينا»
  alternative: «أيَّ معجزة تصنع»؛ «أيَّ برهان تقدم»
  rationale: يحافظ «آية» على المصطلح اليوحناوي وعلى التوتر بين العلامة بوصفها فعلًا منظورًا ودلالتها على سلطان يسوع، من غير اختزالها في مجرد معجزة أو حجة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُعملت «آية» للمصطلح اليوحناوي، وأُبقيت «اليهود» في المتن مع هامش يقيّد احتمال التعميم السياقي. وُضع مؤشر الهامش بعد الضمير المتصل بالقول ليرتبط بالفاعل المذكور قبله.
