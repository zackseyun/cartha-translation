lexical_decisions:
- source_word: λέγει
  choice: وقال
  rationale: المضارع اليوناني هنا مضارع تاريخي في سياق سردي، والماضي هو الأسلوب العربي الطبيعي.
- source_word: Ἀντλήσατε
  choice: اغرفوا
  rationale: الفعل يدل على استخراج سائل أو غرفه، والمفعول مفهوم من السياق ولا يلزم التصريح به في العربية.
- source_word: νῦν
  choice: الآن
  rationale: ينقل الدلالة الزمنية المباشرة للأمر.
- source_word: φέρετε
  choice: قدِّموا
  rationale: في هذا المقام يدل على حمل ما غُرف وإيصاله إلى المسؤول عن الوليمة؛ و«قدِّموا» عربية طبيعية ملائمة للسياق.
- source_word: ἀρχιτρικλίνῳ
  choice: المشرف على الوليمة
  rationale: يدل المصطلح على الشخص المسؤول عن تدبير المأدبة، وهذه العبارة واضحة ودقيقة من غير إقحام منصب حديث بعينه.
- source_word: οἱ δὲ ἤνεγκαν
  choice: فقدَّموا إليه
  rationale: δέ رابط سردي خفيف، والفعل يدل على حمل الشيء أو إيصاله. أُضيف «إليه» لتوضيح الجهة المفهومة من السياق من غير تعيين الشيء قبل أن يصرح السرد بطبيعته.
