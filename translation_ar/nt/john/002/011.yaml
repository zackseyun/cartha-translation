base_translation:
  language: en
  yaml_path: translation/nt/john/002/011.yaml
  text: Jesus did this[a], the beginning of his signs, in Cana of Galilee, and revealed his glory, and his disciples believed in him.
translation:
  language: ar
  text: صنع يسوع هذا، بدايةَ آياته، في قانا الجليل، وأظهر مجده، وآمن به تلاميذه.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أولى آياته».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταύτην ἐποίησεν
  choice: صنع يسوع هذا
  rationale: يحافظ على اسم الإشارة والفعل العام في اليونانية من غير أن يضيف «معجزة» أو «آية» إلى موضع لا يرد فيه إلا اسم الإشارة.
- source_word: ἀρχὴν τῶν σημείων
  choice: بدايةَ آياته
  rationale: ينقل ἀρχή بمعنى «بداية»، ويُفهم ضمير الملكية من السياق؛ والنصب يبيّن أن العبارة بدل أو بيان لـ«هذا».
- source_word: σημείων
  choice: آياته
  rationale: «آيات» تحفظ دلالة σημεῖον اليوحناوية بوصف الأعمال علامات كاشفة، بخلاف «معجزات» التي تبرز خرق المألوف وحده.
- source_word: ἐν Κανὰ τῆς Γαλιλαίας
  choice: في قانا الجليل
  rationale: صياغة عربية جغرافية واضحة وقريبة من تركيب اسم المكان مع المضاف إليه.
- source_word: ἐφανέρωσεν
  choice: أظهر
  rationale: ينقل معنى جعل الشيء ظاهرًا أو معلومًا، وهو طبيعي مع «مجده».
- source_word: τὴν δόξαν αὐτοῦ
  choice: مجده
  rationale: «المجد» هو المقابل العربي المألوف والدقيق لمصطلح δόξα المحوري في يوحنا.
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: آمن به
  rationale: تعبير عربي طبيعي ينقل الإيمان والثقة الموجَّهين إلى يسوع.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: تلاميذه
  rationale: صياغة عربية موجزة وطبيعية تحافظ على علاقة التلاميذ بيسوع.
theological_decisions:
- issue: مصطلح σημεῖον في يوحنا
  choice: آيات
  alternative: معجزات
  rationale: «آيات» تحافظ على كون هذه الأعمال تكشف هوية يسوع ومجده، ولا تختزلها في أعمال خارقة.
- issue: دلالة ἀρχὴν τῶν σημείων
  choice: بداية آياته
  alternative: أولى آياته
  rationale: يحافظ الاختيار على لفظ «البداية» في الأصل وعلى فكرة افتتاح سلسلة الآيات، مع إثبات البديل الطبيعي في الحاشية.
- issue: العلاقة بين ظهور المجد وإيمان التلاميذ
  choice: الإبقاء على التتابع النصي دون شرح سببي صريح
  alternative: فآمن به تلاميذه بسبب إظهاره مجده
  rationale: النص يقرن الحدثين بحرف العطف، ولا يصرّح بأداة سببية؛ لذلك لا تُضاف علة تفسيرية.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعمل «صنع» للمحافظة على عمومية ποιέω، و«آيات» للمصطلح اليوحناوي. وُضعت علامة الحاشية في ختام الآية مع تضمين البديل الكامل لتفادي غموض موضع الاستبدال.
