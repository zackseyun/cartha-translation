  yaml_path: translation/nt/john/002/015.yaml
  text: And after making a whip out of cords[a], he drove them all out of the temple courts, including both the sheep and the cattle[c][b]; and he poured out the coins of the money changers and overturned the tables.
translation:
  language: ar
  text: وبعد أن صنع سوطًا من حبال، أخرجهم جميعًا من ساحات الهيكل[a]، بما في ذلك الغنم والبقر[b]؛ وسكب قطع نقود الصيارفة، وقلب الموائد.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: تشير الكلمة اليونانية ἱερόν إلى مجمّع الهيكل وساحاته، لا إلى المقدس الداخلي وحده.
    reason: cultural_note
  - marker: b
    text: يقول النص اليوناني «أخرجهم جميعًا»، ثم يذكر «الغنم والبقر»؛ ولا يصرّح بأن السوط استُعمل على الناس.
    reason: alternative_reading
lexical_decisions:
- source_word: ποιήσας
  choice: بعد أن صنع
  rationale: اسم الفاعل الأوريستي يسبق الفعل الرئيس ويفيد هنا فعلًا تمهيديًا سابقًا؛ وهذه الصياغة توضح التتابع طبيعيًا.
- source_word: φραγέλλιον ἐκ σχοινίων
  choice: سوطًا من حبال
  rationale: تنقل معنى أداة شبيهة بالسوط مصنوعة من حبال أو جدائل، بعبارة عربية واضحة.
- source_word: πάντας ἐξέβαλεν
  choice: أخرجهم جميعًا
  rationale: تحفظ شمول πάντας وقوة الإخراج من غير أن تحصر مرجعه صراحة في الناس أو الحيوانات.
- source_word: τοῦ ἱεροῦ
  choice: من ساحات الهيكل
  rationale: ἱερόν يدل على مجمّع الهيكل وأروقته وساحاته، لا على المقدس الداخلي وحده؛ و«ساحات الهيكل» توضح المقصود للقارئ المعاصر.
- source_word: τά τε πρόβατα καὶ τοὺς βόας
  choice: الغنم والبقر أيضًا
  rationale: تحفظ العبارة التوضيحية التابعة لـ«جميعًا»، وتستعمل «البقر» بوصفها المقابل العربي الطبيعي العام لـ βοῦς في هذا السياق.
- source_word: κολλυβιστῶν
  choice: الصيارفة
  rationale: لفظ عربي مألوف ودقيق لمن يبدّلون العملات.
- source_word: ἐξέχεεν τὰ κέρματα
  choice: سكب نقود
  rationale: «سكب» يحفظ الصورة الحرفية للفعل ἐκχέω، و«نقود» تؤدي معنى القطع النقدية من غير تقييد غير لازم بصغرها.
- source_word: τὰς τραπέζας ἀνέστρεψεν
  choice: قلب الموائد
  rationale: ينقل بوضوح معنى إطاحة الموائد أو قلبها في هذا السياق.
theological_decisions:
- issue: نطاق فعل يسوع واستعمال السوط
  choice: الإبقاء على «أخرجهم جميعًا» ثم ذكر الغنم والبقر، من غير التصريح بأنه ضرب الناس بالسوط
  alternative: التصريح بأنه أخرج الناس والحيوانات جميعًا بالسوط، أو حصر الإخراج في الحيوانات وحدها
  rationale: تركيب اليونانية يورد πάντας ثم يذكر الغنم والبقر، لكنه لا يقول صراحة إن السوط استُعمل على البشر؛ لذلك تحافظ الصياغة على سعة المرجع والتوتر القائم من غير حسم زائد.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة موقرة. استُعملت «ساحات الهيكل» للتمييز بين مجمّع الهيكل والمقدس الداخلي، وحُفظ ترتيب الجملة بما يصون غموض مرجع «جميعًا» من غير تكلف.
