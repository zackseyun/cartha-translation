  text: When the master of the feast tasted the water that had become wine[a], and did not know where it came from (though the servants who had drawn the water knew)[c][b], the master of the feast calls the bridegroom
translation:
  language: ar
  text: ولمّا ذاق رئيسُ المأدبة الماءَ الذي صار خمرًا[a]، ولم يكن يعرف من أين جاء، مع أن الخدم الذين استقوا الماء كانوا يعلمون، يدعو رئيسُ المأدبة العريسَ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: الماء الذي أصبح خمرًا؛ واليونانية تفيد تغيّرًا تمّ وبقيت نتيجته قائمة.'
    reason: lexical_alternative
  - marker: b
    text: 'جاء الفعل في اليونانية بالمضارع التاريخي: «يدعو»، مع أن السياق سردٌ للماضي.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχιτρίκλινος
  choice: رئيس المأدبة
  rationale: يدل اللفظ على المسؤول عن الإشراف على الوليمة؛ و«رئيس المأدبة» تعبير عربي واضح يحفظ طبيعة الدور من غير حصره في وظيفة نادل.
- source_word: ἐγεύσατο
  choice: ذاق
  rationale: نقل مباشر وطبيعي لفعل التذوق في هذا السياق.
- source_word: τὸ ὕδωρ οἶνον γεγενημένον
  choice: الماء الذي صار خمرًا
  rationale: يحفظ التحول المكتمل الذي يدل عليه اسم الفاعل التام، من غير زيادة تفسيرية.
- source_word: οὐκ ᾔδει πόθεν ἐστίν
  choice: لم يكن يعلم من أين هو
  rationale: يحفظ صياغة السؤال عن المصدر، ومرجع الضمير مفهوم من السياق بوصفه ما ذاقه.
- source_word: διάκονοι
  choice: الخدم
  rationale: السياق سياق وليمة وخدمة، فلا يدل اللفظ هنا على منصب كنسي.
- source_word: ἠντληκότες
  choice: استقوا
  rationale: فعل عربي فصيح وطبيعي لدلالة سحب الماء أو أخذه.
- source_word: φωνεῖ
  choice: يدعو
  rationale: يحفظ المضارع التاريخي في السرد اليوناني، مع بيان ذلك في الحاشية.
- source_word: νυμφίον
  choice: العريس
  rationale: المقابل العربي الطبيعي الواضح في سياق العرس.
- source_word: ὡς δὲ
  choice: ولمّا
  rationale: ينقل الانتقال الزمني السردي من غير إدخال معنى «الآن»، ولا يبالغ في دلالة الاستدراك.
theological_decisions:
- issue: وصف المعجزة في السرد
  choice: الماء الذي صار خمرًا
  alternative: الماء الذي تحوّل إلى خمر
  rationale: النص اليوناني يقرر تغيرًا حقيقيًا في الحال؛ فحُفظ هذا المعنى من غير تضعيفه إلى مجرد مظهر أو إدراك، ومن غير إضافة تفصيل عقائدي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «رئيس المأدبة» للدور الاجتماعي، و«الخدم» للسياق المنزلي، وحُفظ المضارع التاريخي في «يدعو». وُضعت الحواشي بعد العبارة التي تشرحها، وجميع علاماتها ظاهرة في المتن.
