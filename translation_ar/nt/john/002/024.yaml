  yaml_path: translation/nt/john/002/024.yaml
  text: But Jesus himself was not entrusting himself to them[a], because he knew all people,
translation:
  language: ar
  text: أَمَّا يَسُوعُ نَفْسُهُ فَلَمْ يَكُنْ يَأْتَمِنُهُمْ عَلَى نَفْسِهِ[a]، لِأَنَّهُ كَانَ يَعْرِفُ النَّاسَ جَمِيعًا،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يستعمل النص اليوناني الفعل نفسه الوارد في الآية السابقة: آمن كثيرون بيسوع، أمّا يسوع فلم «يأتمنهم على نفسه».'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς δὲ Ἰησοῦς
  choice: أَمَّا يَسُوعُ نَفْسُهُ
  rationale: تُبرز «نفسه» توكيد αὐτός، وتفيد «أمّا» الانتقال التقابلي مع الذين آمنوا به في الآية السابقة.
- source_word: οὐκ ἐπίστευεν
  choice: فَلَمْ يَكُنْ يَأْتَمِنُهُمْ
  rationale: الفعل πιστεύω مع المفعول العائد على يسوع والضمير الدال على الأشخاص يفيد هنا الائتمان لا الإيمان. وصيغة «لم يكن» تعكس دلالة الماضي الناقص المستمرة أو الوصفية.
- source_word: αὑτὸν αὐτοῖς
  choice: عَلَى نَفْسِهِ
  rationale: التعبير العربي «يأتمنهم على نفسه» ينقل معنى أن يسوع لم يسلّم نفسه إليهم أو يضع ثقته فيهم، مع إبقاء الإحالة الانعكاسية واضحة.
- source_word: διὰ τὸ
  choice: لِأَنَّهُ
  rationale: تنقل السببية التي تفيدها διά مع المصدر المعرّف بصياغة عربية طبيعية.
- source_word: αὐτὸν γινώσκειν
  choice: كَانَ يَعْرِفُ
  rationale: صيغ التركيب المصدري في اليونانية جملة فعلية عربية، واختير «يعرف» للدلالة على المعرفة بالأشخاص.
- source_word: πάντας
  choice: النَّاسَ جَمِيعًا
  rationale: المذكر الجمع هنا عام في البشر؛ والتصريح بـ«الناس» واضح وطبيعي ويمهّد لذكر الإنسان في الآية التالية.
theological_decisions:
- issue: المحافظة على الصلة بين πιστεύω في الآيتين 23 و24
  choice: ترجمة الفعل هنا بـ«يأتمنهم على نفسه»، مع بيان الصلة اللفظية في الحاشية
  alternative: استعمال «يؤمن» في الموضعين، أو ترجمة هذا الموضع بـ«يثق»
  rationale: 'تكرار الفعل اليوناني يصنع مقابلة مقصودة: آمن كثيرون بيسوع، لكنه لم يأتمنهم على نفسه. لا يمكن الحفاظ طبيعيًا في العربية على المعنى الاصطلاحي والتكرار اللفظي معًا، لذلك نُقل المعنى في المتن ووُثقت الصلة في الحاشية.'
- issue: نطاق πάντας
  choice: النَّاسَ جَمِيعًا
  alternative: الجميع
  rationale: يحافظ هذا على شمول العبارة في سياقها من غير قصرها على جماعة بعينها أو تحميلها صياغة عقدية تتجاوز نص الآية.
translation_notes:
  register: عربية فصحى واضحة ذات نبرة كتابية رصينة. استُعمل «يأتمنهم على نفسه» لأنه أفصح وأطبع من النقل الحرفي «يؤمن نفسه لهم»، مع الحفاظ على الاستمرار الذي تفيده صيغة الماضي الناقص اليونانية.
