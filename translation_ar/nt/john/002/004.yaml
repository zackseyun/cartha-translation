base_translation:
  language: en
  yaml_path: translation/nt/john/002/004.yaml
  text: And Jesus said to her[a], “What does that have to do with me and with you[b], woman? My hour has not yet come.”
translation:
  language: ar
  text: 'فقال لها يسوع: «ما لي ولكِ في هذا[a]، يا امرأة[b]؟ لم تأتِ ساعتي بعد».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بحرفية أشد: «ما لي ولكِ؟». وهو تعبير يفيد المباعدة في الشأن أو الاهتمام، ولا يدل بالضرورة على العداء.'
    reason: lexical_alternative
  - marker: b
    text: كان النداء «يا امرأة» صيغة مخاطبة عادية يمكن أن تكون محترمة في ذلك السياق، وإن بدا حادًّا في بعض الاستعمالات العربية الحديثة.
    reason: cultural_note
lexical_decisions:
- source_word: λέγει
  choice: فقال
  rationale: استُخدم الماضي في السرد العربي الطبيعي بدل المضارع التاريخي اليوناني، مع الحفاظ على الوظيفة السردية، ووصلت الفاء الكلام بما قبله على نحو فصيح.
- source_word: Τί ἐμοὶ καὶ σοί
  choice: ما لي ولكِ في هذا
  rationale: هذا تعبير اصطلاحي يفيد المباعدة في الشأن أو الموقف، لا العداء بالضرورة. وإضافة «في هذا» توضح المرجع الضمني في العربية من غير أن تحسم مقدار العتاب.
- source_word: γύναι
  choice: يا امرأة
  rationale: هذه أقرب مقابلة للنداء اليوناني، وتحافظ على صراحته من غير إضافة عاطفة غير مذكورة مثل «يا عزيزتي»، مع توضيح دلالته الاجتماعية في الحاشية.
- source_word: οὔπω
  choice: لم ... بعد
  rationale: تركيب عربي طبيعي ودقيق يدل على أن الوقت المعني لم يأتِ إلى الآن.
- source_word: ἥκει
  choice: تأتِ
  rationale: الفعل يدل على المجيء أو الحضور، و«تأتِ» يلائم «الساعة» ويحافظ على الصورة الأصلية.
- source_word: ἡ ὥρα μου
  choice: ساعتي
  rationale: تحافظ «ساعتي» على لفظ «الساعة» وعلى صداه الموضوعي في إنجيل يوحنا، بدل تعميمه إلى «وقتي».
theological_decisions:
- issue: نبرة جواب يسوع لأمه وقوته
  choice: جواب فيه مباعدة في الشأن من غير أن يكون إهانة بالضرورة
  alternative: توبيخ قاسٍ، أو خطاب حميم دافئ
  rationale: يفيد التعبير «Τί ἐμοὶ καὶ σοί» مسافة في الموقف أو اختلافًا في الشأن، بينما كان «γύναι» نداءً مألوفًا يمكن أن يكون محترمًا. لذلك يحافظ النص على التوتر من غير تشديد القسوة أو إضافة الحميمية.
- issue: معنى «ساعتي» في لاهوت يوحنا
  choice: الإبقاء على العبارة الحرفية ذات الصدى الأوسع المتصل بموعد رسالة يسوع المعين
  alternative: قصرها على لحظة صنع الآية هنا، أو فهمها بوصفها إشارة عامة إلى التوقيت بلا دلالة يوحناوية أوسع
  rationale: تتكرر «الساعة» في يوحنا بوصفها لفظًا ذا دلالة موضوعية تتصل برسالة يسوع وتمجيده. يحفظ النص هذا اللفظ من غير أن يفرض في المتن تفسيرًا تفصيليًا له.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. روعي إبقاء العبارة الاصطلاحية وصورة «الساعة»، مع شرح ما قد يُساء فهمه ثقافيًا في الحاشيتين.
