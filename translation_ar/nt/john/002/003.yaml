  text: And when the wine ran out[a], the mother of Jesus says to him[b], “They have no wine.”
translation:
  language: ar
  text: 'ولمّا نفد الخمر[a]، تقول له أمّ يسوع[b]: «ليس عندهم خمر».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بعبارة أقرب إلى اللفظ: «عندما كان الخمر غير كافٍ».'
    reason: lexical_alternative
  - marker: b
    text: 'يستعمل اليوناني المضارع التاريخي: «تقول». ويمكن أن يُترجم في السرد: «قالت».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑστερήσαντος οἴνου
  choice: ولمّا نفد الخمر
  rationale: التركيب اليوناني، وهو مضاف مطلق مع اسم فاعل ماضٍ، يقدّم ظرفًا سابقًا للفعل الرئيس ويفيد حصول نقص في الخمر. و«نفد الخمر» تعبير عربي طبيعي ينقل المعنى في هذا السياق، مع إثبات البديل الأقرب إلى اللفظ في الحاشية.
- source_word: λέγει
  choice: تقول
  rationale: الفعل في المضارع التاريخي، فحُفظ المضارع لإبقاء حيوية السرد اليوحنّاوي؛ وهذا الاستعمال مفهوم في العربية السردية.
- source_word: ἡ μήτηρ τοῦ Ἰησοῦ
  choice: أمّ يسوع
  rationale: ينقل العبارة اليونانية مباشرة ويحافظ على طريقة يوحنا في الإشارة إليها في هذا السياق.
- source_word: πρὸς αὐτόν
  choice: له
  rationale: مع فعل القول تؤدّي «له» معنى توجيه الكلام إليه بصورة عربية طبيعية وموجزة.
- source_word: Οἶνον οὐκ ἔχουσιν
  choice: ليس عندهم خمر
  rationale: يحافظ على الفاعل الجمعي غير المصرّح بمرجعه في اليونانية، فلا يحدده بأنه أصحاب العرس أو أهل العرس، وينقل الكلام المباشر بوضوح.
- source_word: οἶνος
  choice: خمر
  rationale: هذا هو المعنى المعتاد للكلمة اليونانية في السياق، ولا يوجد ما يبرر تلطيفها أو استبدالها بتعبير أعم.
theological_decisions:
- issue: المضارع التاريخي في السرد اليوحنّاوي
  choice: 'إبقاء المضارع: «تقول»'
  alternative: 'تحويله إلى الماضي: «قالت»'
  rationale: إبقاء المضارع يحفظ نسيج الخطاب اليوناني وحيوية السرد، من غير أن يضيف دلالة لاهوتية غير موجودة.
- issue: مرجع الفاعل الجمعي المستتر في «ليس عندهم خمر»
  choice: إبقاء المرجع غير محدد باستعمال «عندهم»
  alternative: تحديده بعبارة مثل «ليس عند أصحاب العرس خمر» أو «ليس عند أهل العرس خمر»
  rationale: النص اليوناني لا يصرّح بمرجع الجمع؛ لذلك يحفظ هذا الاختيار الغموض الحقيقي ولا يستورد تفصيلًا من السياق.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. استُعمل «نفد الخمر» للتعبير الطبيعي عن انقطاعه، وحُفظ المضارع التاريخي في «تقول». وُضعت علامتا الحاشيتين في المتن عند العبارتين اللتين تشرحهما الحاشيتان.
