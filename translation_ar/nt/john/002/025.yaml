  text: and because he had no need that anyone should testify about man[a], for he himself knew what was in man.
translation:
  language: ar
  text: ولأنه لم تكن له حاجة إلى أن يشهد أحد عن الإنسان[a]، لأنه هو نفسه كان يعلم ما في الإنسان.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «عن شخص». فالمفرد اليوناني «الإنسان» مستعمل استعمالًا عامًّا، وقد يدل على شخص بشري أو على البشر عامة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χρείαν εἶχεν
  choice: لم يكن محتاجًا
  rationale: ينقل التعبير الاصطلاحي بمعنى «لم تكن له حاجة»، بصياغة عربية طبيعية واضحة.
- source_word: ἵνα τις μαρτυρήσῃ
  choice: إلى أن يشهد له أحد
  rationale: تحافظ «يشهد» على دلالة μαρτυρέω، ويبيّن الضمير «له» أن الشهادة مقدمة ليسوع بحسب السياق.
- source_word: περὶ τοῦ ἀνθρώπου
  choice: عن الإنسان
  rationale: «الإنسان» مفرد جنسي طبيعي في العربية، ويمكن أن يشير إلى الإنسان بوصفه فردًا وإلى البشر عامة، مع إبقاء الصدى اللفظي في ختام الآية.
- source_word: αὐτὸς γὰρ
  choice: إذ كان هو نفسه
  rationale: تحفظ «هو نفسه» توكيد αὐτός، وتؤدي «إذ» وظيفة γάρ التفسيرية في سياق الجملة العربية.
- source_word: ἐγίνωσκεν
  choice: كان ... يعلم
  rationale: تركيب «كان يعلم» يلائم الفعل الناقص ويدل على معرفة مستمرة أو ثابتة، من غير شرح زائد.
- source_word: τί ἦν ἐν τῷ ἀνθρώπῳ
  choice: ما في الإنسان
  rationale: صياغة عربية موجزة تحفظ اتساع العبارة الداخلية وصداها مع «عن الإنسان»، من غير حصرها في طبيعة بشرية عامة أو في كل فرد على حدة.
theological_decisions:
- issue: نطاق معرفة يسوع بما في الإنسان
  choice: 'إبقاء العبارة عامة: «يعلم ما في الإنسان»'
  alternative: «يعلم ما في كل إنسان» أو «يعلم الطبيعة البشرية»
  rationale: المفرد اليوناني ذو دلالة جنسية قد يشمل الفرد والبشر عامة. لا يصرح النص بكلمة «كل»، ولا يحصر المعرفة في مفهوم «الطبيعة البشرية»، لذلك تحافظ الصياغة المختارة على هذا الاتساع والتوتر.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «الإنسان» بوصفه مفردًا جنسيًّا طبيعيًّا في العربية، وحُفظ تكراره في شطري الآية. وُضع مؤشر الحاشية [a] في المتن.
