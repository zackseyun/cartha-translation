  text: ووجد في الهيكل[a] بائعي البقر والغنم والحمام، والصيارفة جالسين.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: الكلمة اليونانية المترجمة «الهيكل» هي ἱερόν، وتشير هنا إلى مجمّع الهيكل أو ساحاته، لا إلى المقدس الداخلي تحديدًا.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὗρεν
  choice: وجد
  rationale: الماضي «وجد» ينقل المعنى المباشر للفعل، ويصف ما صادفه يسوع في الهيكل دون اختزاله في مجرد الرؤية.
- source_word: ἱερῷ
  choice: الهيكل
  rationale: تشير الكلمة هنا إلى مجمّع الهيكل وساحاته، لا إلى المقدس الداخلي تحديدًا. و«الهيكل» هو المقابل العربي المألوف، مع توضيح النطاق المكاني في الحاشية.
- source_word: πωλοῦντας
  choice: بائعي
  rationale: اسم الفاعل المضاف ينقل بصورة موجزة وطبيعية دلالة اسم الفاعل اليوناني المستعمل استعمال الاسم، مع إبراز نشاط البيع الجاري.
- source_word: βόας
  choice: البقر
  rationale: اللفظ اليوناني يدل على البقر عمومًا؛ و«البقر» عربي واضح ولا يقيّد المعنى بالذكور كما قد تفعل «الثيران».
- source_word: πρόβατα
  choice: الغنم
  rationale: «الغنم» مقابل عربي طبيعي في سياق حيوانات الذبائح، ويحافظ على الدلالة من غير توسع غير لازم.
- source_word: περιστερὰς
  choice: الحمام
  rationale: يمكن أن يدل اللفظ على الحمام أو اليمام؛ و«الحمام» هو التعبير العربي الأوضح والأشيع للفئة المقصودة في سياق الذبائح.
- source_word: κερματιστὰς
  choice: الصيارفة
  rationale: «الصيارفة» تعبير عربي راسخ لمن يبدّلون النقود أو العملات، وهو دقيق وموجز.
- source_word: καθημένους
  choice: جالسين
  rationale: يحافظ على وصف هيئة الصيارفة واستقرارهم في المكان من غير إضافة «هناك»، وهي غير مصرّح بها لفظًا في اليونانية.
theological_decisions:
- issue: نطاق ἱερόν بالنسبة إلى هيكل أورشليم
  choice: الهيكل في المتن، على أن المقصود مجمّع الهيكل أو ساحاته
  alternative: ساحات الهيكل؛ حرم الهيكل؛ المقدس
  rationale: وجود باعة الحيوانات والصيارفة يدل على المساحة الأوسع من مجمّع الهيكل، لا على المقدس الداخلي. يحافظ «الهيكل» على السلاسة والمألوفية، وتمنع الحاشية فهمه على أنه قدس المبنى الداخلي تحديدًا.
