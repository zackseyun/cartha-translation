  text: ودُعي يسوع أيضًا وتلاميذه إلى العرس.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκλήθη
  choice: دُعي
  rationale: الفعل المبني للمجهول من καλέω يعني في سياق مناسبة اجتماعية أنه تلقّى دعوة إلى الحضور؛ وصيغة «دُعي» عربية طبيعية وتحافظ على المبني للمجهول.
- source_word: δὲ καὶ
  choice: أيضًا
  rationale: يجتمع الرابط الخفيف δέ مع καί لإضافة يسوع إلى المدعوين المذكورين في السياق؛ وتنقل «أيضًا» هذه الإضافة بوضوح من غير إثقال العبارة.
- source_word: ὁ Ἰησοῦς
  choice: يسوع
  rationale: الصيغة العربية المألوفة للاسم في نصوص العهد الجديد.
- source_word: καὶ οἱ μαθηταὶ αὐτοῦ
  choice: وتلاميذه
  rationale: تحافظ الواو على عطف التلاميذ على يسوع، و«تلاميذه» تنقل علاقة التعلّم والانتساب التي يدل عليها μαθηταί مع الضمير αὐτοῦ.
- source_word: εἰς τὸν γάμον
  choice: إلى العرس
  rationale: يدل γάμος هنا على مناسبة الزواج واحتفالها؛ و«العرس» تعبير عربي واضح وموجز لا يضيف ذكر وليمة غير مصرح بها في الآية.
