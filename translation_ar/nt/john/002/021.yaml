lexical_decisions:
- source_word: ἐκεῖνος
  choice: هُوَ
  rationale: يشير اسم الإشارة هنا إلى يسوع، ويؤدّي الضمير المنفصل المعنى طبيعيًّا في العربية مع إبقاء قدر من التوكيد.
- source_word: δὲ
  choice: أَمَّا ... فَـ
  rationale: تُظهر هذه الصيغة المقابلة الخفيفة بين فهم السامعين في الآية السابقة وبين التفسير الذي يقدمه يوحنا هنا.
- source_word: ἔλεγεν
  choice: كَانَ يَتَكَلَّمُ
  rationale: يحفظ التركيب دلالة الماضي الناقص الوصفية أو الاستمرارية، من غير تحويل الفعل إلى تفسير مثل «كان يقصد».
- source_word: περὶ
  choice: عَنْ
  rationale: مقابل عربي واضح وطبيعي لحرف الجر مع المضاف إليه، بمعنى «بشأن» أو «عن».
- source_word: ναοῦ
  choice: هَيْكَلِ
  rationale: «الهيكل» هو المقابل الكتابي العربي الطبيعي، مع بيان الدلالة الأخص للكلمة اليونانية في الحاشية.
- source_word: σώματος
  choice: جَسَدِ
  rationale: ينقل الاسم مباشرة ويحافظ على الصورة الاستعارية وعلى تركيب الإضافة.
- source_word: αὐτοῦ
  choice: ـهِ
  rationale: ضمير الملكية يبيّن أن المقصود جسد يسوع نفسه.
theological_decisions:
- issue: التعريف الاستعاري لجسد يسوع بالهيكل
  choice: هَيْكَلِ جَسَدِهِ
  alternative: جَسَدِهِ بَوْصْفِهِ هَيْكَلًا
  rationale: يحافظ تركيب الإضافة على صياغة النص واستعارته مباشرة، من غير شرح عقائدي زائد أو حسم لطبيعة العلاقة بما يتجاوز الأصل.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «أمّا هو فـ» لإبراز المقابلة الخفيفة، و«كان يتكلم» لحفظ الجانب الوصفي للفعل، مع إبقاء استعارة «هيكل جسده» من دون توسع تفسيري.
