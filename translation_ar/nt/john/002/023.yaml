  text: Ὡς δὲ ἦν ἐν τοῖς Ἱεροσολύμοις ἐν τῷ πάσχα ἐν τῇ ἑορτῇ, πολλοὶ ἐπίστευσαν εἰς τὸ ὄνομα αὐτοῦ, θεωροῦντες αὐτοῦ τὰ σημεῖα ἃ ἐποίει·
base_translation:
  language: en
  yaml_path: translation/nt/john/002/023.yaml
  text: When he was in Jerusalem at the Passover[a], during the feast[b], many believed in his name as they were seeing the signs that he was doing.
translation:
  language: ar
  text: ولمّا كان في أورشليم وقت الفصح، في أثناء العيد، آمن كثيرون باسمه[a]، إذ كانوا يرون الآيات[b] التي كان يصنعها.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «آمنوا به». وحرفيًا: «آمنوا باسمه»، وهي عبارة يوحناوية تشدد على الثقة به بحسب هويته المعلنة.'
    reason: lexical_alternative
  - marker: b
    text: '«الآيات» هو تعبير مميز في إنجيل يوحنا عن أعمال تشير إلى ما وراء ذاتها، إلى هوية يسوع؛ ويمكن ترجمتها: «الآيات المعجزية».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  choice: ولمّا
  rationale: تؤدي المعنى الزمني مع صلة سردية خفيفة بالسياق، من غير إضافة ظرف بمعنى «الآن» لا وجود له في الأصل.
- source_word: ἦν ἐν τοῖς Ἱεροσολύμοις
  choice: كان في أورشليم
  rationale: صياغة مكانية عربية طبيعية، مع استعمال الاسم الكتابي الشائع للمدينة.
- source_word: ἐν τῷ πάσχα
  choice: وقت الفصح
  rationale: يشير التعبير هنا إلى زمن عيد الفصح، وهذه الصياغة موجزة وواضحة.
- source_word: ἐν τῇ ἑορτῇ
  choice: في أثناء العيد
  rationale: تحفظ التحديد التفسيري المتصل بالفصح وتبرز الامتداد الزمني للاحتفال.
- source_word: ἐπίστευσαν εἰς τὸ ὄνομα αὐτοῦ
  choice: آمن كثيرون باسمه
  rationale: تحفظ العبارة اليوحناوية الحرفية نسبيًا، فلا تختزل «اسمه» إلى مجرد ضمير، وتبقي الثقة متجهة إلى هويته المعلنة.
- source_word: θεωροῦντες
  choice: إذ كانوا يرون
  rationale: تنقل المشاهدة المتزامنة والمستمرة التي يدل عليها اسم الفاعل المضارع في السياق الماضي.
- source_word: τὰ σημεῖα
  choice: الآيات
  rationale: «الآيات» مصطلح عربي كتابي واضح لأعمال تشير إلى ما وراء ذاتها، ولا يضيف وصف «المعجزية» غير المذكور صراحة.
- source_word: ἃ ἐποίει
  choice: التي كان يصنعها
  rationale: تحفظ الاستمرار الذي يوحي به الفعل الناقص، و«يصنع» ملائم للأعمال والآيات في العربية الفصيحة.
theological_decisions:
- issue: طبيعة الإيمان المذكور في ἐπίστευσαν εἰς τὸ ὄνομα αὐτοῦ
  choice: آمن كثيرون باسمه
  alternative: آمن كثيرون به؛ أو أظهر كثيرون إيمانًا سطحيًا به
  rationale: يصرّح النص بأنهم آمنوا باسمه، فلا ينبغي للترجمة أن تضعف هذا الإيمان مسبقًا. ويُترك للعدد التالي أن يضيف توتره السردي بشأن موقف يسوع منهم.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظت العبارة اليوحناوية «آمنوا باسمه» والتوتر اللاهوتي الذي يوضحه السياق اللاحق، مع تجنب التفسير المذهبي المسبق.
