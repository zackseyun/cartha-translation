source:
  edition: SBLGNT
  text: Καὶ τῇ ⸂ἡμέρᾳ τῇ τρίτῃ⸃ γάμος ἐγένετο ἐν Κανὰ τῆς Γαλιλαίας, καὶ ἦν ἡ μήτηρ τοῦ Ἰησοῦ ἐκεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/john/002/001.yaml
  text: And on the third day there was a wedding in Cana of Galilee[b][a], and the mother of Jesus was there.
translation:
  language: ar
  text: وفي اليوم الثالث، كان عرسٌ[a] في قانا الجليل، وكانت أم يسوع هناك.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «حفل عرس». فاللفظ اليوناني قد يشير إلى الزواج أو إلى الاحتفال المصاحب له.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: و
  rationale: أداة ربط بسيطة تحفظ تتابع السرد في يوحنا من غير إضافة دلالة تفسيرية.
- source_word: τῇ ἡμέρᾳ τῇ τρίτῃ
  choice: في اليوم الثالث
  rationale: صياغة عربية طبيعية تحافظ على الإشارة الزمنية المحددة في النص اليوناني من غير إدخال معنى رمزي في الترجمة.
- source_word: γάμος
  choice: عرس
  rationale: لفظ عربي واضح وواسع يمكن أن يدل على مناسبة الزواج واحتفالها، وهو ملائم للسياق.
- source_word: ἐγένετο
  choice: كان
  rationale: ينقل تقديم الحدث ببساطة ويحافظ على أسلوب السرد المقتضب؛ أما «أُقيم» فتضيف فاعلية تنظيمية غير مصرَّح بها.
- source_word: ἐν Κανὰ τῆς Γαλιλαίας
  choice: في قانا الجليل
  rationale: صياغة عربية مألوفة للاسم الجغرافي والنسبة الإقليمية، مع نقل Κανὰ إلى «قانا».
- source_word: ἦν
  choice: كانت
  rationale: يحفظ الفعل الناقص الذي يقدم معلومة خلفية من غير توسيع إلى «كانت حاضرة».
- source_word: ἡ μήτηρ τοῦ Ἰησοῦ
  choice: أم يسوع
  rationale: ترجمة مباشرة وطبيعية للتركيب الإضافي اليوناني، مع إبقاء طريقة يوحنا في الإشارة إليها دون ذكر اسمها.
- source_word: ἐκεῖ
  choice: هناك
  rationale: مقابل مكاني مباشر يحفظ بساطة العبارة.
theological_decisions:
- issue: الدلالة المحتملة لعبارة «اليوم الثالث»
  choice: إبقاؤها إشارة زمنية كما وردت من غير تفسير مضاف
  alternative: صياغتها بما يلمّح صراحةً إلى قيامة يسوع
  rationale: قد يرى القارئ صدى رمزيًا في سياق إنجيل يوحنا، لكن العبارة تؤدي هنا وظيفة زمنية ظاهرة؛ لذلك تُحفَظ كما هي من غير حسم دلالتها اللاهوتية داخل المتن.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة سردية كريمة ومقتضبة. استُعمل «عرس» بدل تعبير أطول، مع توضيح سعته الدلالية في الحاشية، وحُفظ التركيب «أم يسوع» القريب من الأصل.
