  source_fidelity: 'النص العربي ينقل عناصر اليونانية كلها بأمانة: أداة الربط، والتحديد الزمني «في اليوم الثالث»، ووقوع العرس، وموضعه في قانا الجليل، ووجود أم يسوع هناك. ولا يضيف تفسيرًا رمزيًا لعبارة «اليوم الثالث» أو يحدد هوية الأم باسم غير وارد في النص.'
  naturalness: الصياغة فصحى معاصرة واضحة ومقتضبة. «كان عرسٌ» سليمة ومناسبة للأسلوب السردي، و«قانا الجليل» و«أم يسوع» تعبيران عربيان مألوفان في هذا السياق.
