source:
  edition: SBLGNT
  text: ⸀εἶπον αὐτῷ οἱ Ἰουδαῖοι· Νῦν ἐγνώκαμεν ὅτι δαιμόνιον ἔχεις. Ἀβραὰμ ἀπέθανεν καὶ οἱ προφῆται, καὶ σὺ λέγεις· Ἐάν τις τὸν λόγον μου τηρήσῃ, οὐ μὴ γεύσηται θανάτου εἰς τὸν αἰῶνα·
base_translation:
  language: en
  yaml_path: translation/nt/john/008/052.yaml
  text: The Jews said to him[a], “Now we know that you have a demon. Abraham died, and the prophets also, yet you say, ‘If anyone keeps my word[c][b], he will certainly never taste death forever.’”
translation:
  language: ar
  text: 'فقال له اليهود: «الآن عرفنا أن بك شيطانًا[a]. مات إبراهيم، وكذلك الأنبياء، وأنت تقول: ‹إن حفظ أحد كلامي، فلن يذوق الموت أبدًا[b]›».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «أن لك شيطانًا»؛ ويمكن أن يُفهم المعنى: «أن شيطانًا قد استولى عليك».'
    reason: lexical_alternative
  - marker: b
    text: 'في اليونانية نفي مؤكد مع تعبير يفيد الاستمرار إلى الأبد؛ والمعنى: «لن يذوق الموت مطلقًا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ Ἰουδαῖοι
  choice: اليهود
  rationale: نقل مباشر للتعبير اليوناني في هذا السياق؛ أما «قادة اليهود» فتفسير أضيق، و«اليهوديون» قد يوحي بدلالة جغرافية لا يصرح بها النص.
- source_word: Νῦν ἐγνώκαμεν
  choice: الآن عرفنا
  rationale: ينقل حالة اليقين الحاضرة الناتجة من إدراك سابق، وهو تعبير عربي طبيعي في سياق قول المتكلمين.
- source_word: δαιμόνιον ἔχεις
  choice: بك شيطان
  rationale: صياغة عربية طبيعية وقريبة من العبارة الحرفية «لك شيطان»، من غير حسمها في مصطلح تقني مثل «ممسوس».
- source_word: Ἀβραὰμ ἀπέθανεν καὶ οἱ προφῆται
  choice: مات إبراهيم، وكذلك الأنبياء
  rationale: يحافظ على بساطة الفعل وعلى شمول الأنبياء في الحكم نفسه الذي ذُكر عن إبراهيم.
- source_word: καὶ σὺ λέγεις
  choice: وأنت تقول
  rationale: الواو مع بنية الجملة تحمل التباين السياقي طبيعيًا من غير الحاجة إلى إضافة أداة استدراك غير صريحة.
- source_word: Ἐάν τις
  choice: إن حفظ أحد
  rationale: «أحد» تنقل العموم غير المحدد، و«إن» تلائم الشرط الممكن في العربية الفصحى.
- source_word: τὸν λόγον μου τηρήσῃ
  choice: حفظ كلامي
  rationale: «حفظ» يصون مجال τηρέω من حيث الحراسة والمراعاة والعمل، و«كلامي» تعبير عربي طبيعي لـλόγος هنا من غير اختزاله إلى مجرد وصية.
- source_word: οὐ μὴ γεύσηται θανάτου
  choice: فلن يذوق الموت
  rationale: يحافظ على استعارة «الذوق»، وتؤدي «لن» مع «أبدًا» النفي اليوناني المؤكد.
- source_word: εἰς τὸν αἰῶνα
  choice: أبدًا
  rationale: ينقل معنى الامتناع في كل زمان بصورة عربية سليمة، ويتجنب الإيهام بأن «الموت» نفسه يدوم إلى الأبد.
theological_decisions:
- issue: المقصود بوعد عدم ذوق الموت
  choice: الإبقاء على عبارة «يذوق الموت» بلا تفسير إضافي
  alternative: تحديده بالموت الجسدي أو الروحي أو الأبدي/النهائي
  rationale: تسمح العبارة الأصلية بالتوتر بين فهم المعارضين الظاهري والدلالة الأعمق المحتملة في سياق يوحنا؛ لذلك لا ينبغي حسمها مذهبيًا في متن الترجمة.
translation_notes:
  register: العربية فصحى حديثة، واضحة ووقورة. اختيرت «بك شيطان» بدل الحرفية المتكلفة «لك شيطان»، مع توثيق الحرفية في الحاشية. وُضع كل مؤشر حاشية في المتن، وحُفظت استعارة ذوق الموت وغموضها اللاهوتي.
