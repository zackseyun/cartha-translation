    rationale: μή مع السؤال هنا تؤطره بوصفه سؤالًا إنكاريًا يتوقع جوابًا بالنفي. أما «ألعلك» فتقترح احتمالًا أو ترجيحًا، وقد تخفف التحدي المباشر.
  - severity: low
    issue: «فمن تجعل نفسك؟» غير سلسة في العربية المعاصرة.
    rationale: هي قريبة من الصورة الحرفية لكنها ليست التعبير العربي الاصطلاحي الواضح للادعاء بالهوية أو المكانة. «فمن تدّعي أنك؟» تنقل المقصود الاتهامي بلا زيادة تفسيرية.
  - severity: low
    issue: نص الحاشية الحالي «من تدّعي أنك هو؟» غير سليم أسلوبيًا.
    rationale: الضمير «هو» زائد ومربك في العربية. يمكن أن تبيّن الحاشية الحرفية والمعنى الاصطلاحي بصياغة سليمة.
