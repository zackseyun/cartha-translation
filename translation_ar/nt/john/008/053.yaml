  text: μὴ σὺ μείζων εἶ τοῦ πατρὸς ἡμῶν Ἀβραάμ, ὅστις ἀπέθανεν; καὶ οἱ προφῆται ἀπέθανον· τίνα ⸀σεαυτὸν ποιεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/053.yaml
  text: Surely you are not greater than our father Abraham[a], who died? The prophets also died[b]. Who do you make yourself out to be?
translation:
  language: ar
  text: أَلَسْتَ أَنْتَ أَعْظَمَ مِنْ أَبِينَا إِبْرَاهِيمَ، الَّذِي مَاتَ؟ وَالْأَنْبِيَاءُ مَاتُوا أَيْضًا. فَمَنْ تَدَّعِي أَنَّكَ؟[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «فمَن تجعل نفسك؟» والمعنى: «مَن تدّعي أنك؟» أو «مَن تزعم أنك تكون؟»'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ σὺ
  choice: أَلَعَلَّكَ
  rationale: تنقل همزة الاستفهام مع «لعل» سؤالًا إنكاريًا يتوقع جوابًا بالنفي، مع إبقاء نبرة التحدي واضحة في العربية.
- source_word: μείζων
  choice: أَعْظَمُ
  rationale: تحافظ على معنى المقارنة الواسع في المقام والمنزلة، من غير حصره في الأهمية أو السلطة.
- source_word: τοῦ πατρὸς ἡμῶν Ἀβραάμ
  choice: مِنْ أَبِينَا إِبْرَاهِيمَ
  rationale: تؤدي تركيب المقارنة اليوناني بـ«من»، وتحفظ وصف إبراهيم بأنه الأب بمعناه النسبي والتكريمي.
- source_word: ὅστις ἀπέθανεν
  choice: الَّذِي مَاتَ
  rationale: صياغة مباشرة تشير إلى واقعة موت إبراهيم التاريخية.
- source_word: καὶ οἱ προφῆται ἀπέθανον
  choice: وَمَاتَ الأَنْبِيَاءُ أَيْضًا
  rationale: تحفظ المثال الموازي المضاف إلى موت إبراهيم وتأتي بترتيب عربي طبيعي.
- source_word: τίνα σεαυτὸν ποιεῖς
  choice: فَمَنْ تَجْعَلُ نَفْسَكَ؟
  rationale: 'تحافظ على صورة التعبير اليوناني وعلى نبرته الاتهامية. ويمكن فهمه اصطلاحيًا بمعنى: من تدّعي أنك هو؟'
theological_decisions:
- issue: التحدي البلاغي لمكانة يسوع قياسًا إلى إبراهيم والأنبياء
  choice: صياغة السؤال بصيغة إنكارية تتوقع النفي، من غير بيان الجواب العقائدي داخل الآية
  alternative: هل أنت أعظم من أبينا إبراهيم؟
  rationale: الأداة اليونانية μή تدل على أن المتكلمين يتوقعون جوابًا بالنفي؛ وتحافظ الصياغة على التوتر المتعلق بهوية يسوع من غير أن تحسمه بإضافة تفسير لاهوتي.
translation_notes:
  register: عربية فصحى معاصرة واضحة وذات نبرة كريمة. استُخدم الضبط الجزئي لتوضيح الاستفهام الإنكاري، مع تجنب الألفاظ المذهبية أو التفسيرية الزائدة.
