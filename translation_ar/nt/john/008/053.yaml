revisions:
- from: أَلَعَلَّكَ أَعْظَمُ مِنْ أَبِينَا إِبْرَاهِيمَ، الَّذِي مَاتَ؟ وَمَاتَ الأَنْبِيَاءُ أَيْضًا. فَمَنْ تَجْعَلُ نَفْسَكَ؟[a]
  to: أَلَسْتَ أَنْتَ أَعْظَمَ مِنْ أَبِينَا إِبْرَاهِيمَ، الَّذِي مَاتَ؟ وَالْأَنْبِيَاءُ مَاتُوا أَيْضًا. فَمَنْ تَدَّعِي أَنَّكَ؟[a]
  rationale: استُبدلت «ألعلك» بـ«ألستَ أنت» لإبراز الاستفهام الإنكاري المتوقع جوابه بالنفي في اليونانية، مع الحفاظ على التشديد الذي يفيده الضمير «أنت». واستُخدم تعبير عربي اصطلاحي طبيعي للسؤال الأخير، مع إبقاء الصورة الحرفية في الحاشية. لا يضيف النص أي حسم عقائدي لهوية يسوع.
