  text: He spoke these words in the treasury while teaching in the temple[a], and no one seized him[b], because his hour had not yet come.
translation:
  language: ar
  text: تكلّم بهذه الكلمات في بيت الخزانة، وهو يعلّم في الهيكل[a]، ولم يقبض عليه أحد، لأن ساعته لم تكن قد جاءت بعد.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: في مجمّع الهيكل؛ فاللفظ اليوناني يشير إلى نطاق الهيكل كله، لا إلى المقدس الداخلي وحده.'
    reason: lexical_alternative
  - marker: b
    text: 'تشير «ساعته» في إنجيل يوحنا إلى الموعد المعيَّن لآلام يسوع الحاسمة وتمجيده؛ ويمكن ترجمتها: «وقته المعيَّن».'
    reason: cross_reference
lexical_decisions:
- source_word: ταῦτα τὰ ῥήματα
  choice: هذه الكلمات
  rationale: تنقل الإشارة إلى الكلام السابق بوضوح، وتحافظ على الدلالة اللفظية لـῥήματα دون تفسير زائد.
- source_word: ἐλάλησεν
  choice: قال
  rationale: صياغة عربية طبيعية مع «هذه الكلمات»، وتؤدي معنى التلفظ بالكلام في السياق السردي.
- source_word: ἐν τῷ γαζοφυλακίῳ
  choice: في بيت الخزانة
  rationale: يشير γαζοφυλάκιον هنا إلى موضع خزانة الهيكل، لا بالضرورة إلى صندوق واحد؛ و«بيت الخزانة» تعبير موجز وواضح.
- source_word: διδάσκων
  choice: وهو يعلِّم
  rationale: يبيّن أن التعليم كان متزامنًا مع قوله هذه الكلمات، وفق دلالة اسم الفاعل المضارع.
- source_word: ἐν τῷ ἱερῷ
  choice: في الهيكل
  rationale: يحافظ على التعبير المألوف، مع إيضاح في الحاشية أن ἱερόν يدل على مجمّع الهيكل لا المقدس الداخلي وحده.
- source_word: οὐδεὶς ἐπίασεν αὐτόν
  choice: لم يقبض عليه أحد
  rationale: «قبض عليه» ينقل معنى الإمساك العدائي المقصود في السياق دون أن يحصره في إجراء قانوني رسمي.
- source_word: ὅτι
  choice: لأن
  rationale: تقدّم السبب الذي لأجله لم يقبض عليه أحد بوضوح في العربية الحديثة.
- source_word: οὔπω ἐληλύθει
  choice: لم تكن قد جاءت بعد
  rationale: 'تحافظ على دلالة الماضي التام: لم تكن الساعة قد أتت حتى تلك اللحظة.'
- source_word: ἡ ὥρα αὐτοῦ
  choice: ساعته
  rationale: تحفظ العبارة اليوحناوية ذات الدلالة الموضوعية واللاهوتية، بدل تسطيحها إلى «وقته».
theological_decisions:
- issue: دلالة «ساعته» في إنجيل يوحنا
  choice: إبقاء التعبير الحرفي «ساعته» في المتن
  alternative: وقته المعيَّن
  rationale: يحمل التعبير توترًا مقصودًا في يوحنا، إذ يشير إلى الموعد المعيَّن لآلام يسوع وتمجيده؛ وإبقاؤه يحفظ هذا الخيط الموضوعي دون حسمه داخل المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدم «بيت الخزانة» للدلالة المكانية الأوسع، واحتُفظ بـ«ساعته» لصون العبارة اليوحناوية المحورية. وُضعت علامة الحاشية [a] بعد «الهيكل» وعلامة [b] بعد الجملة التي تتضمن «ساعته».
