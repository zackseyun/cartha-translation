  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἀπεκρίθησαν ⸂πρὸς αὐτόν⸃· Σπέρμα Ἀβραάμ ἐσμεν καὶ οὐδενὶ δεδουλεύκαμεν πώποτε· πῶς σὺ λέγεις ὅτι Ἐλεύθεροι γενήσεσθε;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/033.yaml
  text: They answered him[a], “We are Abraham’s offspring and have never been enslaved to anyone. How can you say[c][b], ‘You will become free’?”
translation:
  language: ar
  text: 'أجابوه: «نحن نسل إبراهيم[a]، ولم نكن عبيدًا لأحد قط[b]. فكيف تقول أنت: ستصيرون أحرارًا[c]؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ذرية إبراهيم». استُعملت في اليونانية كلمة مفردة ذات معنى جمعي للدلالة على النسب الجسدي.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «لم نخدم أحدًا قط». قد يعني الفعل اليوناني الخدمة، لكن معنى العبودية هو الأبرز هنا بسبب المقابلة مع الحرية.'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «ستكونون أحرارًا». والنص اليوناني، بحرفية أكبر، يقول: «ستصيرون أحرارًا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν πρὸς αὐτόν
  choice: أجابوه
  rationale: صياغة عربية طبيعية موجزة تدل على أنهم وجّهوا جوابهم إليه مباشرة.
- source_word: Σπέρμα Ἀβραάμ
  choice: نسل إبراهيم
  rationale: «نسل» اسم جمعي مفرد يحفظ دلالة التعبير اليوناني على الانحدار الجسدي من إبراهيم، وهو أفصح وأطبع من النقل الحرفي «زرع إبراهيم» في هذا السياق.
- source_word: οὐδενὶ δεδουλεύκαμεν πώποτε
  choice: لم نكن عبيدًا لأحد قط
  rationale: تنقل العبارة بوضوح معنى الخضوع في العبودية، وهو المعنى الأبرز بسبب المقابلة المباشرة مع الحرية، مع التعبير الطبيعي عن النفي المطلق في العربية.
- source_word: πῶς σὺ λέγεις
  choice: فكيف تقول أنت
  rationale: تحفظ نبرة الاستنكار، ويُظهر الضمير المنفصل «أنت» توكيد الضمير اليوناني الصريح σὺ.
- source_word: Ἐλεύθεροι γενήσεσθε
  choice: ستصيرون أحرارًا
  rationale: تحفظ دلالة التحول في الفعل γίνομαι، لا مجرد وصف حالة مستقبلية.
theological_decisions:
- issue: دلالة δουλεύω في سياق العبودية والحرية
  choice: لم نكن عبيدًا
  alternative: لم نخدم أحدًا
  rationale: يدور السياق القريب حول العبودية والحرية، لذلك تحافظ «عبيدًا» على قوة المقابلة الاجتماعية واللاهوتية، بينما قد توحي «نخدم» بخدمة عادية طوعية.
- issue: دلالة Σπέρμα Ἀβραάμ
  choice: نسل إبراهيم
  alternative: ذرية إبراهيم
  rationale: يفيد التعبير ادعاء الانتساب الجسدي إلى إبراهيم من غير إدخال دلالات لاهوتية من مواضع أخرى. و«نسل» يحافظ على الطبيعة الجمعية للمفرد اليوناني.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت «قط» لتقوية النفي، وحُفظ توكيد «أنت» ودلالة التحول في «ستصيرون» من غير إثقال العبارة بحرفية غير طبيعية.
