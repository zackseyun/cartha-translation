  yaml_path: translation/nt/john/008/011.yaml
  text: She[a] said, "No one, Lord." And Jesus said, "Neither do I condemn you; go, and sin no more."
translation:
  language: ar
  text: 'فقالت: «لا أحد، يا رب». فقال يسوع: «ولا أنا أدينك. اذهبي، ولا تخطئي بعد الآن».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: هذه خاتمة قصة المرأة التي أُمسكت وهي تزني (يوحنا 7:‏53–8:‏11). انظر الحاشية على يوحنا 7:‏53.
    reason: textual_critical
lexical_decisions:
- source_word: κύριε
  choice: يا رب
  rationale: صيغة نداء يمكن أن تعني خطابًا مهذبًا مثل «يا سيدي»، لكن «يا رب» تحافظ هنا على الاعتراف بسلطان يسوع من غير أن تحسم وحدها مدى فهم المرأة لهويته.
- source_word: κατακρίνω
  choice: أدينك
  rationale: ينقل الفعل معنى إصدار حكم بالإدانة، وهو مناسب للسياق القضائي المتعلق باتهام المرأة والمطالبة بمعاقبتها.
- source_word: μηκέτι ἁμάρτανε
  choice: ولا تعودي إلى الخطيئة
  rationale: تعبير عربي طبيعي ينقل النهي المستمر عن مواصلة الخطيئة من الآن فصاعدًا، من غير أن يخصص النص نوع الخطيئة صراحة.
- source_word: πορεύου
  choice: اذهبي
  rationale: أمر مباشر طبيعي في العربية يطابق صيغة المخاطبة المؤنثة وسياق انصراف المرأة.
theological_decisions:
- issue: دلالة κύριε في خطاب المرأة ليسوع
  choice: يا رب
  alternative: يا سيدي
  rationale: اللفظ اليوناني يحتمل النداء المهذب والاعتراف بالسلطان؛ اختير التعبير التقليدي «يا رب» مع إبقاء هذا الاحتمال الدلالي دون إضافة تفسير عقائدي إلى المتن.
- issue: مدى النهي في μηκέτι ἁμάρτανε
  choice: ولا تعودي إلى الخطيئة
  alternative: ولا تخطئي بعد الآن
  rationale: الاختيار يحفظ دعوة يسوع إلى ترك الخطيئة من هذه اللحظة، ولا يقصرها صراحة على الزنى ولا يحولها إلى تقرير عن إمكان العصمة.
translation_notes:
  register: لغة عربية فصحى حديثة واضحة وموقرة. استُخدم «لا تعودي إلى الخطيئة» بدل صياغة حرفية أثقل، مع الحفاظ على القوة الأخلاقية للنهي. وُضعت علامة الحاشية بعد الآية كاملة لأنها تتعلق بالفقرة النصية التي تختتم هنا.
