  to: 'فقالت: «لا أحد، يا رب». فقال يسوع: «ولا أنا أدينك. اذهبي، ولا تخطئي بعد الآن».[a]'
  rationale: استُبدلت عبارة «ولا تعودي إلى الخطيئة» بـ«ولا تخطئي بعد الآن» لمطابقة μηκέτι ἁμάρτανε بدقة أكبر، مع حفظ عمومية النهي وعدم تقييده بنوع خطيئة محدد. وحُذف الضمير غير المذكور صراحة في «فقال لها يسوع» للاقتصار على ما يورده النص، دون أثر في المعنى. الحاشية وعلامتها سليمتان وتحافظان على التنبيه النقدي النصي المتعلق بالفقرة.
