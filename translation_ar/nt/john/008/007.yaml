  text: But when[a] they continued questioning him, he straightened up and said to them, "Let the one among you who is without sin be the first to throw a stone at her."
translation:
  language: ar
  text: 'ولكن لما ألحّوا في سؤاله، رفع رأسه وقال لهم: «مَن كان منكم بلا خطيئة، فليرمِها أولًا بحجر».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: هذه الآية جزء من قصة المرأة التي أُمسكت في الزنى (يوحنا 7:53–8:11)، وهي غير موجودة في أقدم المخطوطات اليونانية. انظر الحاشية على يوحنا 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: ἐπέμενον ἐρωτῶντες
  choice: واصلوا سؤاله
  rationale: ينقل اقتران الفعل الناقص باسم الفاعل الحاضر معنى الاستمرار والإلحاح في السؤال، بصياغة عربية طبيعية.
- source_word: ἀνακύψας
  choice: اعتدل
  rationale: يصف رفع الجسد من وضع الانحناء المذكور في السياق السابق، من غير إضافة فعل الوقوف الذي لا يصرّح به اليوناني.
- source_word: ἀναμάρτητος
  choice: بلا خطيئة
  rationale: يحفظ الدلالة الأخلاقية المباشرة للصفة النادرة، ولا يضيّقها إلى مجرد انتفاء الجرم القانوني في هذه القضية.
- source_word: πρῶτος ἐπ' αὐτὴν τὸν λίθον βαλέτω
  choice: فليكن أولَ مَن يرميها بحجر
  rationale: صياغة عربية واضحة تحفظ معنى الأمر بأن يبدأ الشخص المستوفي للشرط بالرجم، مع إبقاء «بحجر» نكرة كما في النص.
theological_decisions:
- issue: نطاق عبارة ἀναμάρτητος
  choice: بلا خطيئة
  alternative: بريئًا من هذه الخطيئة
  rationale: النص اليوناني يقول على نحو عام «بلا خطيئة» ولا يقيّد العبارة صراحة بخطيئة الزنى أو بهذه القضية؛ لذلك تُحفظ سعة العبارة وتوترها الأخلاقي والقانوني.
translation_notes:
  register: العربية فصحى معاصرة، واضحة ووقورة. استُعمل «اعتدل» لإيجاز الحركة الجسدية طبيعيًا، و«بلا خطيئة» للحفاظ على عموم التعبير اليوناني. وُضع مؤشر الحاشية بعد الجملة كاملة.
