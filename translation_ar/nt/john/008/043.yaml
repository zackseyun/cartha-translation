  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: διὰ τί τὴν λαλιὰν τὴν ἐμὴν οὐ γινώσκετε; ὅτι οὐ δύνασθε ἀκούειν τὸν λόγον τὸν ἐμόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/043.yaml
  text: Why do you not understand my way of speaking? Because you are not able to hear my word[a][b].
translation:
  language: ar
  text: لماذا لا تفهمون أسلوب كلامي؟ لأنكم لا تقدرون أن تسمعوا كلمتي.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كلامي» أو «لغتي». تشير الكلمة اليونانية إلى طريقة يسوع في الكلام، وهي متميزة هنا من «كلمتي» في الجملة التالية.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «لأنكم لا تستطيعون سماع كلمتي».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλιὰν
  choice: أسلوب كلامي
  rationale: تشير الكلمة هنا إلى طريقة يسوع في الكلام أو نمطه، لا إلى مضمون قوله فحسب؛ وتحافظ «أسلوب كلامي» على تمييزها من λόγος في الجملة التالية.
- source_word: γινώσκετε
  choice: تفهمون
  rationale: السياق يتناول إدراك كلام يسوع وفهمه، لا مجرد معرفته أو التعرف إليه.
- source_word: ἀκούειν
  choice: أن تسمعوا
  rationale: يحافظ هذا على المعنى الأساسي للفعل اليوناني، من غير أن يحسم ضمنًا ما إذا كان المقصود القبول أو الإصغاء المطيع.
- source_word: λόγον
  choice: كلمتي
  rationale: تعبّر عن قول يسوع أو رسالته، وتحافظ قدر الإمكان على التمييز بينها وبين λαλιά، مع بقاء الصياغة طبيعية ورنانة بالعربية.
- source_word: οὐ δύνασθε
  choice: لا تقدرون
  rationale: تفيد العجز وعدم القدرة، لا مجرد عدم الرغبة، وهي صياغة عربية واضحة ومباشرة.
- source_word: ὅτι
  choice: لأن
  rationale: تقدّم سبب عدم فهمهم المذكور في السؤال السابق بوضوح.
- source_word: τὴν ἐμὴν / τὸν ἐμόν
  choice: ـي (كلامي/كلمتي)
  rationale: تُنقل صفتا الملكية بصيغة الإضافة الضميرية الطبيعية في العربية، مع إبراز التوازي بين العبارتين.
theological_decisions:
- issue: طبيعة العجز في قول يسوع «لا تقدرون أن تسمعوا كلمتي»
  choice: إثبات عدم القدرة كما يورده النص من غير تفسير سببها العقائدي
  alternative: اعتباره عدم رغبة أخلاقية، أو تقسية قضائية، أو عجزًا روحيًا محددًا
  rationale: تصرّح الآية بالعجز، لكنها لا تحدد في ذاتها آليته اللاهوتية كاملة؛ لذلك تُحفظ دلالة النص وتوتره من غير حسم يتجاوز عبارته.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدمت «أسلوب كلامي» لإظهار الفرق المعجمي بين λαλιά وλόγος، و«لا تقدرون» لصون معنى العجز بلا إضافة تفسير مذهبي.
