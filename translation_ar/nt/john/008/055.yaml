  text: καὶ οὐκ ἐγνώκατε αὐτόν, ἐγὼ δὲ οἶδα αὐτόν· κἂν εἴπω ὅτι οὐκ οἶδα αὐτόν, ἔσομαι ὅμοιος ⸀ὑμῖν ψεύστης· ἀλλὰ οἶδα αὐτὸν καὶ τὸν λόγον αὐτοῦ τηρῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/055.yaml
  text: Yet you have not known him[a], but I know him. If I were to say that I do not know him, I would be a liar like you. But I do know him[c][b], and I keep his word.
translation:
  language: ar
  text: ومع ذلك لم تعرفوه[a]، أما أنا فأعرفه. ولو قلت[b] إني لا أعرفه، لكنت كاذبًا مثلكم. لكني أعرفه وأحفظ كلمته[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لا تعرفونه». الفعل اليوناني في صيغة التام، وقد تُترجم الصيغة بما يبرز أنهم لم يعرفوه إلى الآن.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «وإن قلت». العبارة اليونانية شرطية، و«لو قلت» تُبرز هنا أن القول مفترض لا واقع.'
    reason: lexical_alternative
  - marker: c
    text: يمكن أيضًا ترجمة «أحفظ» بـ«أطيع» أو «أراعي»؛ فالفعل اليوناني قد يفيد حفظ كلمة الله بأمانة والعمل بها.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώκατε
  choice: لم تعرفوه
  rationale: يحافظ الماضي المنفي بـ«لم» على الصيغة التامة في اليونانية، مع إمكان دلالتها على حالة مستمرة من عدم المعرفة، وهو ما توضحه الحاشية.
- source_word: οἶδα
  choice: أعرفه
  rationale: الفعل، مع أنه تام من حيث الصيغة، يؤدي معنى فعليًا حاليًا يفيد المعرفة، ولذلك يناسبه المضارع العربي.
- source_word: κἂν εἴπω ... ἔσομαι
  choice: ولو قلت ... لكنت
  rationale: هذه صياغة عربية طبيعية للفرض غير الواقع في السياق، وتحفظ العلاقة الشرطية بين القول المفترض ونتيجته.
- source_word: ὅμοιος ὑμῖν ψεύστης
  choice: كاذبًا مثلكم
  rationale: ينقل المقارنة المباشرة والاتهام الصريح من غير تلطيف أو توسع.
- source_word: τὸν λόγον αὐτοῦ
  choice: كلمته
  rationale: تحفظ اللفظة صياغة يوحنا المميزة، وتبقي معنى القول والرسالة المعلنة حاضرًا.
- source_word: τηρῶ
  choice: أحفظ
  rationale: «أحفظ» تشمل مراعاة الكلمة والوفاء بها، ولا تحصر المعنى في تنفيذ الأوامر وحده.
- source_word: καὶ ... δὲ ... ἀλλὰ
  choice: ومع ذلك ... أما ... لكني
  rationale: تنقل أدوات الربط حركة التقابل الحادة بين عدم معرفتهم ومعرفة يسوع، ثم بين القول الافتراضي والواقع.
theological_decisions:
- issue: ادعاء يسوع معرفة الله في مقابل مخاطبيه
  choice: إثبات معرفته بالله وحفظه كلمته بصياغة مباشرة
  alternative: إضافة تفسير يصرح بطبيعة بنوته الفريدة، أو تخفيف «المعرفة» إلى مجرد معرفة سطحية
  rationale: النص نفسه يقيم تقابلًا حادًا بين يسوع ومخاطبيه من جهة معرفة الله وحفظ كلمته؛ لذا تُحفظ قوة الادعاء من غير إدخال شرح عقائدي زائد أو تخفيف دلالته.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة وموقرة. استُخدم «أما أنا» لإبراز المقابلة، و«ولو قلت ... لكنت» لصياغة الشرط الافتراضي بطلاقة، مع إبقاء «كلمته» و«أحفظ» حفاظًا على النبرة اليوحناوية واتساعها الدلالي.
