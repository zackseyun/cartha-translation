  text: You judge according to the flesh[a]; I judge no one.
translation:
  language: ar
  text: أَنْتُمْ تَدِينُونَ حَسَبَ الْجَسَدِ[a]، أَمَّا أَنَا فَلَا أَدِينُ أَحَدًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بِمَقَايِيسَ بَشَرِيَّةٍ»، أو: «حَسَبَ الظَّاهِرِ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: أَنْتُمْ
  rationale: الضمير اليوناني مذكور صراحةً وفيه توكيد ومقابلة مع ἐγώ؛ وإظهار «أنتم» في العربية يحفظ هذه المقابلة طبيعيًّا.
- source_word: κατὰ τὴν σάρκα
  choice: حَسَبَ الْجَسَدِ
  rationale: ترجمة قريبة من اللفظ تحفظ التعبير اليوحناوي وما فيه من سعة دلالية، من غير حصره في «الطبيعة الخاطئة» أو في معيار تفسيري واحد.
- source_word: κρίνετε
  choice: تَدِينُونَ
  rationale: الفعل κρίνω هنا يدل على إصدار الحكم؛ و«تدينون» تعبير عربي موجز وطبيعي يحفظ قوة الفعل في السياق.
- source_word: ἐγὼ
  choice: أَمَّا أَنَا
  rationale: إدخال «أما» مع الضمير الصريح يبرز التضاد بين «أنتم» و«أنا» الذي تؤكده البنية اليونانية.
- source_word: οὐ κρίνω οὐδένα
  choice: فَلَا أَدِينُ أَحَدًا
  rationale: صياغة عربية طبيعية ومباشرة تنقل النفي الشامل في οὐδένα وتحافظ على إيجاز الأصل.
theological_decisions:
- issue: دلالة σάρξ في عبارة κατὰ τὴν σάρκα
  choice: حَسَبَ الْجَسَدِ
  alternative: بِمَقَايِيسَ بَشَرِيَّةٍ؛ أو حَسَبَ الظَّاهِرِ
  rationale: إبقاء «الجسد» في المتن يحفظ اللفظ والتوتر الدلالي في الأصل، ويمكن أن يشير في السياق إلى حكم بشري أو دنيوي أو سطحي من غير اختزاله في عقيدة تقنية عن «الطبيعة الخاطئة». وتوضح الحاشية المعنيين السياقيين المحتملين.
- issue: قول يسوع «لا أدين أحدًا» وعلاقته بأقوال الدينونة الأخرى
  choice: نقل النفي المطلق كما ورد من غير إضافة قيد تفسيري
  alternative: 'تقييده صراحةً بمعنى: لا أدين أحدًا بحسب الجسد'
  rationale: النص اليوناني لا يكرر القيد في الجملة الثانية؛ لذلك تُحفظ صياغته المطلقة والتوتر السياقي بدل إدخال تفسير غير مصرّح به.
translation_notes:
  register: عربية فصحى واضحة ومهيبة. استُعملت «تدينون» بمعنى إصدار الحكم، وحُفظت المقابلة الصريحة بين «أنتم» و«أنا». يظهر مؤشر الحاشية [a] في المتن كما هو مطلوب.
