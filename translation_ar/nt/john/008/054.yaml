  text: ἀπεκρίθη Ἰησοῦς· Ἐὰν ἐγὼ ⸀δοξάσω ἐμαυτόν, ἡ δόξα μου οὐδέν ἐστιν· ἔστιν ὁ πατήρ μου ὁ δοξάζων με, ὃν ὑμεῖς λέγετε ὅτι θεὸς ⸀ἡμῶν ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/john/008/054.yaml
  text: Jesus answered[a], “If I glorify myself, my glory is nothing. My Father is the one who glorifies me, he whom you say is our God,”
translation:
  language: ar
  text: 'أجاب يسوع: «إن كنتُ أمجِّد نفسي، فمجدي لا شيء. أبي هو الذي يمجِّدني، وهو الذي تقولون إنه إلهنا[a].»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ بعض المخطوطات: «إلهكم» بدلًا من «إلهنا».'
    reason: textual_variant
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: أجاب
  rationale: صيغة سردية عربية طبيعية ومباشرة لنقل فعل الإجابة في الحوار.
- source_word: δοξάσω / δοξάζων
  choice: أمجِّد / يمجِّد
  rationale: يحفظ لفظ «المجد» ومحوره اللاهوتي البارز في إنجيل يوحنا، بدل اختزاله إلى مجرد الإكرام.
- source_word: ἡ δόξα μου οὐδέν ἐστιν
  choice: فمجدي لا شيء
  rationale: نقل قريب ومفهوم للتركيب اليوناني، مع إبقاء العبارة المطلقة كما هي من غير تفسيرها بعبارة مثل «لا قيمة له».
- source_word: ὁ πατήρ μου
  choice: أبي
  rationale: تعبير عربي طبيعي ودقيق عن علاقة المتكلم بالآب في السياق.
- source_word: ὁ δοξάζων με
  choice: هو الذي يمجِّدني
  rationale: يحفظ قوة اسم الفاعل المعرّف بوصفه تحديدًا مستمرًا للفاعل، بصياغة عربية واضحة.
- source_word: ὃν ὑμεῖς λέγετε ὅτι θεὸς ἡμῶν ἐστιν
  choice: وهو الذي تقولون إنه إلهنا
  rationale: يحفظ عائد الموصول والإسناد المباشر في القراءة الأساس، مع صياغة عربية سليمة لا تضيف اقتباسًا داخليًا غير لازم.
- source_word: θεὸς
  choice: إله
  rationale: المرجع هو إله إسرائيل، والإضافة في «إلهنا» تعرّفه بوضوح في العربية.
- source_word: ἡμῶν
  choice: نا في «إلهنا»
  rationale: يتبع نص SBLGNT الذي يقرأ «إلهنا»، مع إثبات القراءة البديلة «إلهكم» في الحاشية.
theological_decisions:
- issue: الضمير في θεὸς ἡμῶν/ὑμῶν ἐστιν
  choice: إلهنا
  alternative: إلهكم
  rationale: اعتمد المتن قراءة SBLGNT «إلهنا». ولأن «إلهكم» قراءة مخطوطية ذات أثر في سياق الجدال، ذُكرت في الحاشية دون ترجيح تفسيري إضافي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «مجَّد» للمحافظة على تكرار جذر المجد في الآية، وأُبقيت عبارة «مجدي لا شيء» موجزة وقريبة من الأصل. وُضع مؤشر الحاشية بعد اسم يسوع وفق موضعه في طبقة الاستشارة الإنجليزية، مع أن الحاشية تتعلق بقراءة «إلهنا» في آخر الآية.
