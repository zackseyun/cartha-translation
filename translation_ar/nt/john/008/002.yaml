  yaml_path: translation/nt/john/008/002.yaml
  text: At dawn he came again to the temple, and all the people were coming to him; and he sat down and began to teach them.
translation:
  language: ar
  text: وعند الفجر جاء أيضًا إلى الهيكل، وكان الشعب كله يأتي إليه؛ فجلس يعلّمهم.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: هذه الآية امتداد لقصة المرأة التي أُمسكت في الزنى (يوحنا 7:53–8:11)، وهي غير موجودة في أقدم المخطوطات اليونانية. انظر الحاشية على يوحنا 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: Ὄρθρου
  choice: عند الفجر
  rationale: يدل المضاف إليه الدال على الزمن على وقت الفجر أو بدايات الصباح، و«عند الفجر» تعبير عربي موجز وطبيعي.
- source_word: παρεγένετο
  choice: جاء
  rationale: 'يفيد الوصول أو الحضور إلى مكان، و«جاء» يلائم ذكر الوجهة: «إلى الهيكل».'
- source_word: ἱερόν
  choice: الهيكل
  rationale: يشير إلى مجمّع الهيكل كله، بما فيه الساحات التي كان يجري فيها التعليم العلني، لا إلى المقدس الداخلي وحده.
- source_word: ἤρχετο
  choice: كان ... يأتي
  rationale: يحافظ هذا التركيب على دلالة الماضي الناقص، مصورًا مجيء الشعب إليه بوصفه حدثًا جاريًا.
- source_word: καθίσας
  choice: فجلس
  rationale: ينقل الفعل السابق للتعليم بعبارة عربية طبيعية، مع بقاء جلوس المعلّم واضحًا.
- source_word: ἐδίδασκεν
  choice: يعلّمهم
  rationale: جاء ضمن تركيب «فجلس يعلّمهم»، وهو ينقل الاستمرار الذي قد يفيده الماضي الناقص من غير حسمه قسرًا بمعنى الشروع وحده.
