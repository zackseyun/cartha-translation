base_translation:
  language: en
  yaml_path: translation/nt/john/008/025.yaml
  text: So they were saying to him, “Who are you?” Jesus said to them, “Just what I have been telling you from the beginning.”
translation:
  language: ar
  text: 'فقالوا له: «مَن أنت؟» فقال لهم يسوع: «ما ظللتُ أقوله لكم منذ البدء».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'العبارة اليونانية موجزة وملتبسة، ويمكن أيضًا فهمها بمعنى: «لماذا أكلّمكم أصلًا؟»'
    reason: حفظ الغموض النحوي الحقيقي في الأصل، إذ يمكن فهم τὴν ἀρχήν بمعنى «أصلًا/على الإطلاق» وقراءة الجملة كسؤال.
lexical_decisions:
- source_word: ἔλεγον οὖν
  choice: فقالوا
  rationale: ينقل الربط الاستنتاجي والسياق الحواري بصياغة عربية طبيعية، من غير إثقال العبارة بدلالة الاستمرار التي لا يلزم إبرازها هنا.
- source_word: Σὺ τίς εἶ;
  choice: مَن أنت؟
  rationale: صياغة عربية مباشرة تحفظ توكيد الضمير اليوناني الذي يركّز السؤال على هوية يسوع.
- source_word: Τὴν ἀρχὴν
  choice: منذ البدء
  rationale: يفهم العبارة ظرفيًا على أنها تشير إلى ما كان يسوع يقوله من البداية، وهو تفسير قديم وملائم للسياق، مع توثيق الوجه الآخر في الحاشية.
- source_word: ὅ τι καὶ λαλῶ ὑμῖν
  choice: ما ظللتُ أقوله لكم
  rationale: يحفظ مضمون الجواب بوصفه إحالة إلى كلام يسوع المستمر السابق، ويؤدي καί هنا بوصفها للتوكيد ضمن البنية كلها لا بمعنى «أيضًا» المنفصل.
theological_decisions:
- issue: غموض جواب يسوع نحويًا ودلاليًا
  choice: «أنا ما ظللتُ أقوله لكم منذ البدء»
  alternative: «لماذا أكلّمكم أصلًا؟» أو «ما أقوله لكم منذ البدء»
  rationale: التركيب اليوناني شديد الإيجاز ويقبل أكثر من تحليل؛ اختير الوجه الذي يجعل الجواب إحالة إلى تعليم يسوع السابق، توافقًا مع السياق، مع إبقاء البديل الجاد ظاهرًا في الحاشية بدل حسمه لاهوتيًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدم «ظللتُ أقوله» لإظهار استمرار القول منذ البدء، وتجنبت الصياغة الحرفية المتعثرة، مع تثبيت علامة الحاشية [a] في المتن.
