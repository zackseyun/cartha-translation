source:
  edition: SBLGNT
  text: Ἔλεγεν οὖν ὁ Ἰησοῦς πρὸς τοὺς πεπιστευκότας αὐτῷ Ἰουδαίους· Ἐὰν ὑμεῖς μείνητε ἐν τῷ λόγῳ τῷ ἐμῷ, ἀληθῶς μαθηταί μού ἐστε,
base_translation:
  language: en
  yaml_path: translation/nt/john/008/031.yaml
  text: So Jesus was saying to the Jews who had believed him[a], “If you remain in my word, you are truly my disciples,”
translation:
  language: ar
  text: 'فكان يسوع يقول لليهود الذين صدَّقوه[a]: «إن ثبتم في كلمتي، فأنتم حقًّا تلاميذي».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الذين آمنوا به». واليونانية تقول حرفيًّا: «الذين صدَّقوه».'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἔλεγεν
  choice: كان يقول
  rationale: صيغة الماضي الناقص تفيد فعلًا ماضيًا مستمرًّا أو متكررًا، و«كان يقول» تنقل هذا الجانب بوضوح.
- source_word: οὖν
  choice: فـ
  rationale: تربط الكلام بما قبله بوصفه استمرارًا أو نتيجة سياقية، من غير المبالغة في القوة الاستنتاجية.
- source_word: πρὸς τοὺς πεπιστευκότας αὐτῷ Ἰουδαίους
  choice: لليهود الذين صدَّقوه
  rationale: اسم الفاعل التام يدل على تصديق سابق ذي أثر قائم، والبناء مع المجرور αὐτῷ يعني مباشرةً أنهم صدَّقوه، لا أنه يتضمن صراحةً تركيب «آمنوا به».
- source_word: Ἐὰν
  choice: إن
  rationale: تدخل على شرط محتمل، و«إن» فصيحة وطبيعية هنا.
- source_word: ὑμεῖς
  choice: أنتم
  rationale: إثبات الضمير في جواب الشرط يحفظ التوكيد الموجود في اليونانية.
- source_word: μείνητε
  choice: ثبتم
  rationale: ينقل معنى الاستمرار والبقاء في كلام يسوع بلغة عربية طبيعية، مع دلالة على المواظبة وعدم التحول عنه.
- source_word: ἐν τῷ λόγῳ τῷ ἐμῷ
  choice: في كلمتي
  rationale: يحافظ على لفظ «الكلمة» وترداده اليوحناوي، مع إمكان أن يشير في السياق إلى قول يسوع وتعليمه.
- source_word: ἀληθῶς
  choice: حقًّا
  rationale: يفيد صدق الصفة وأصالتها، ويلائم الأسلوب العربي الموقر الواضح.
- source_word: μαθηταί μού ἐστε
  choice: فأنتم حقًّا تلاميذي
  rationale: «تلاميذي» المقابل الطبيعي في سياق الإنجيل، وترتيب الجملة العربية يبرز الضمير ويحفظ معنى التحقق الفعلي من التلمذة.
theological_decisions:
- issue: ترجمة πιστεύω مع المجرور αὐτῷ
  choice: الذين صدَّقوه
  alternative: الذين آمنوا به
  rationale: اليونانية تستعمل هنا الضمير في حالة المجرور بلا حرف εἰς؛ لذلك يحافظ المتن على المعنى المباشر «صدَّقوه»، بينما تُذكر الصياغة اليوحناوية المألوفة «آمنوا به» في الحاشية كي لا يُحسم التوتر الدلالي ضمنًا.
- issue: دلالة الثبات في كلمة يسوع
  choice: إن ثبتم في كلمتي
  alternative: إن واصلتم العمل بتعليمي
  rationale: يحفظ هذا الاختيار صورة μένω ولفظ λόγος وتردادهما اليوحناوي، من غير اختزال المعنى في الطاعة العملية وحدها أو تفسير «الكلمة» تفسيرًا ضيقًا.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعمل «صدَّقوه» في المتن للدقة التركيبية، مع إثبات البديل المألوف في الحاشية. وحُفظت ألفاظ «ثبتم» و«كلمتي» لما لها من صدى مهم في إنجيل يوحنا.
