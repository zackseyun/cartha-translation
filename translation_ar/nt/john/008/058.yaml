base_translation:
  language: en
  yaml_path: translation/nt/john/008/058.yaml
  text: Jesus said to them[a], “Truly, truly, I say to you, before Abraham came to be[b], I am.”
translation:
  language: ar
  text: 'قال لهم يسوع: «الحقَّ الحقَّ أقول لكم: قبل أن يأتي إبراهيم إلى الوجود[a]، أنا هو[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «قبل أن يولد إبراهيم». الفعل اليوناني أوسع معنى، ويمكن أن يعني «يأتي إلى الوجود» أو «يصير».'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أن تُفهم أيضًا بمعنى: «أنا كائن» أو «كنت موجودًا». لكن اليونانية تستعمل فعلًا في صيغة الحاضر: «أنا أكون/أنا موجود»، وتحافظ ترجمة «أنا هو» على الطابع المطلق للعبارة ودلالتها اللاهوتية المحتملة.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν αὐτοῖς Ἰησοῦς
  choice: قال لهم يسوع
  rationale: نقل مباشر وطبيعي للمقدمة السردية اليونانية، مع إبقاء ترتيب الاسم في موضعه دون تغيير المعنى.
- source_word: Ἀμὴν ἀμὴν
  choice: الحقَّ الحقَّ
  rationale: يحفظ تكرار الصيغة التوكيدية المهيبة، وهو تعبير عربي كتابي واضح ومألوف.
- source_word: λέγω ὑμῖν
  choice: أقول لكم
  rationale: يقابل العبارة اليونانية عن قرب ويحفظ صيغة الخطاب المباشر المتكررة في إنجيل يوحنا.
- source_word: πρὶν
  choice: قبل أن
  rationale: أداة زمنية عربية طبيعية تمهّد للجملة الفعلية المقابلة للمصدر اليوناني.
- source_word: γενέσθαι
  choice: يأتي إلى الوجود
  rationale: ينقل المعنى الأوسع للفعل γίνομαι ولا يضيّقه إلى الولادة الجسدية وحدها، كما يحافظ على المقابلة مع صيغة الوجود اللاحقة.
- source_word: Ἀβραὰμ
  choice: إبراهيم
  rationale: الصيغة العربية القياسية الموروثة للاسم.
- source_word: ἐγὼ εἰμί
  choice: أنا هو
  rationale: صيغة عربية موجزة ومقصودة الحدّة تحفظ الحاضر والتعبير المطلق قدر الإمكان، من غير تحويله إلى مجرد خبر عن الوجود السابق.
theological_decisions:
- issue: ترجمة ἐγὼ εἰμί في سياق ذي دلالة مسيحية لاهوتية قوية
  choice: أنا هو
  alternative: أنا كائن؛ كنت موجودًا
  rationale: النص اليوناني في زمن الحاضر وصيغته مطلقة على نحو لافت. تحافظ «أنا هو» على غرابة العبارة المقصودة وعلى احتمال صداها المتصل بالتعريف الإلهي، من غير أن تفرض هذا التفسير في المتن. أما «كنت موجودًا» فتسوّي التوتر الزمني وتحصر المعنى في الوجود السابق.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة مهيبة. أُبقي التكرار التوكيدي والعبارة الختامية المقتضبة غير المألوفة لأن حدّتها جزء من صياغة النص اليوناني، مع شرح البدائل في الحاشيتين.
