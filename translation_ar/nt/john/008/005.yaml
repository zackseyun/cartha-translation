translation:
  language: ar
  text: أما في شريعتنا، فقد أمر موسى أن تُرجم نساء كهؤلاء.[a] فماذا تقول أنت؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: هذه الآية جزء من قصة المرأة التي أُمسكت في الزنى (يوحنا 7:53–8:11). انظر الحاشية على يوحنا 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: τῷ νόμῳ ἡμῶν
  choice: في شريعتنا
  rationale: تنقل العبارة اليونانية بمعنى الشريعة التي ينتسب إليها المتكلمون، وصياغتها طبيعية وواضحة في العربية.
- source_word: ἐνετείλατο
  choice: أوصى
  rationale: تفيد هنا إصدار موسى حكمًا ملزمًا؛ و«أوصى» تعبير كتابي عربي مألوف يحفظ سلطة الأمر دون مبالغة.
- source_word: τὰς τοιαύτας
  choice: أمثال هؤلاء النساء
  rationale: يحفظ التأنيث والجمع في اليونانية، ويشير سياقيًا إلى النساء اللواتي من هذه الحال دون إضافة تفسير غير مصرح به.
- source_word: λιθοβολεῖσθαι
  choice: برجم
  rationale: مصدر الرجم ينقل الإعدام بالحجارة الذي يدل عليه الفعل المبني للمجهول بإيجاز طبيعي.
- source_word: σὺ οὖν τί λέγεις
  choice: فماذا تقول أنت؟
  rationale: الفاء تنقل قوة οὖν الاستنتاجية، وإظهار «أنت» يحفظ توكيد الضمير اليوناني σὺ.
theological_decisions:
- issue: صياغة حكم شريعة موسى
  choice: أوصى موسى برجم أمثال هؤلاء النساء
  alternative: أمر موسى بأن تُرجم أمثال هؤلاء النساء
  rationale: الصياغة المختارة تحافظ على نسبة الحكم إلى موسى وعلى دلالته الإلزامية، من غير إضافة «حتى الموت» غير المذكورة صراحة في العبارة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. وُضع رمز الحاشية بعد الجملة التي تتصل بالقصة النصية، وحُفظ توكيد «أنت» في السؤال الختامي.
