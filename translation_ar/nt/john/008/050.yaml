  text: But I do not seek my own glory[b][a]; there is One who seeks it and judges.
translation:
  language: ar
  text: أَمَّا أَنَا فَلَا أَطْلُبُ مَجْدِي؛ هُنَاكَ مَنْ يَطْلُبُهُ وَيَدِينُ.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'وبصياغة أقرب إلى الحرفية: «هناك الذي يطلب ويدين». والمفعول المفهوم لفعل «يطلب» هو مجد يسوع المذكور في الجملة السابقة.'
    reason: lexical_alternative
  - marker: b
    text: يُفهَم عادةً من السياق أن المقصود هو الآب، مع أن النص اليوناني لا يذكره صراحةً في هذه الآية.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ δὲ
  choice: أَمَّا أَنَا
  rationale: يحفظ إبراز الضمير الصريح وقوة المقابلة التي تؤديها δέ، بصياغة عربية طبيعية واضحة.
- source_word: οὐ ζητῶ
  choice: فَلَا أَطْلُبُ
  rationale: المضارع المنفي مناسب هنا، ويحافظ «أطلب» على الصلة اللفظية بالفعل نفسه في العبارة التالية.
- source_word: τὴν δόξαν μου
  choice: مَجْدِي
  rationale: ينقل الإضافة في اليونانية مباشرة من غير زيادة «الخاص»، وتلائم «المجد» الاستعمال اليوحناوي والسياق المتعلق بالتكريم.
- source_word: ἔστιν ὁ ζητῶν
  choice: بَلْ هُنَاكَ مَنْ يَطْلُبُهُ
  rationale: «هناك من» تؤدي التركيب الوجودي مع اسم الفاعل المعرّف من غير تسمية الشخص. أُضيف ضمير المفعول «ـه» عائدًا إلى «مجدي»، وهو مفهوم من الجملة السابقة ولازم لوضوح العربية.
- source_word: καὶ κρίνων
  choice: وَيَدِينُ
  rationale: ينقل اسم الفاعل المنسق بصيغة فعل مضارع عربية سلسة، ويحفظ المعنى القضائي للفعل κρίνω.
theological_decisions:
- issue: هوية الذي يطلب ويدين
  choice: 'تُركت هويته غير مصرّح بها في المتن: «هناك من»'
  alternative: إنه الآب الذي يطلبه ويدين
  rationale: يفهم السياق عادةً أن المقصود هو الآب، لكن النص اليوناني لا يسمّيه في هذه الآية؛ لذلك تحفظ الترجمة هذا القدر من الإبهام ولا تحسم ما تركه الأصل ضمنيًا.
- issue: مفعول «يطلب» في الجملة الثانية
  choice: أُظهر بضمير الغائب في «يطلبه»، عائدًا إلى مجد يسوع
  alternative: 'ترجمة حرفية: «هناك الذي يطلب ويدين» بلا مفعول ظاهر'
  rationale: المفعول مفهوم من «مجدي» في الجملة السابقة، وإظهاره بضمير يجعل العربية طبيعية من غير تغيير المرجع أو إضافة مضمون لاهوتي.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. استُعملت «أما أنا» لإبراز المقابلة، وحُفظ تكرار جذر الطلب. وُضعت علامتا الحاشية بعد العبارة التي تتعلقان بها، مع إبقاء هوية الفاعل ضمنية كما في الأصل.
