source:
  edition: robinson-pierpont-2005-byzantine
  text: Οἱ δὲ ἀκούσαντες, καὶ ὑπὸ τῆς συνειδήσεως ἐλεγχόμενοι, ἐξήρχοντο εἷς καθ' εἷς, ἀρξάμενοι ἀπὸ τῶν πρεσβυτέρων ἕως τῶν ἐσχάτων· καὶ κατελείφθη μόνος ὁ Ἰησοῦς, καὶ ἡ γυνὴ ἐν μέσῳ ἑστῶσα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/009.yaml
  text: But those[a] who heard it, being convicted by their conscience, went out one by one, beginning with the older ones down to the last. And Jesus was left alone, with the woman standing in the midst.
translation:
  language: ar
  text: أَمَّا هُمْ[a] فَلَمَّا سَمِعُوا، وَكَانَتْ ضَمَائِرُهُمْ تُبَكِّتُهُمْ، خَرَجُوا وَاحِدًا فَوَاحِدًا، مُبْتَدِئِينَ بِكِبَارِ السِّنِّ حَتَّى آخِرِهِمْ[b]. وَبَقِيَ يَسُوعُ وَحْدَهُ، وَالْمَرْأَةُ وَاقِفَةٌ فِي الْوَسَطِ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: هذه الآية جزء من تتمة قصة المرأة التي أُمسكت في الزنى (يوحنا 7:53–8:11). انظر الحاشية على يوحنا 7:53.
    reason: textual_critical
  - marker: b
    text: 'حرفيًّا: «إلى الأخيرين»؛ وقد يُفهم المقصود أنهم خرجوا من الأكبر سنًّا إلى الأصغر.'
    reason: translation_clarity
lexical_decisions:
- source_word: συνείδησις
  choice: ضمائرهم
  rationale: «الضمير» هو المقابل العربي الطبيعي والدقيق للملكة الأخلاقية الداخلية التي تميّز الصواب من الخطأ.
- source_word: ἐλέγχω
  choice: تُبَكِّتُهُمْ
  rationale: يفيد هنا انكشاف الذنب وإدانة الضمير للإنسان؛ و«تبكّت» تنقل هذا الأثر الأخلاقي الداخلي من غير إضافة تفسير زائد.
- source_word: πρεσβύτερος
  choice: كبار السن
  rationale: السياق يعرض ترتيب الخارجين بحسب السن أو الأقدمية، لا لقبًا رسميًا لقادة الجماعة؛ لذلك تجنبت «الشيوخ» التي قد توحي بمنصب ديني.
- source_word: εἷς καθ' εἷς
  choice: واحدًا فواحدًا
  rationale: تعبير عربي طبيعي يحافظ على معنى الخروج الفردي المتتابع.
- source_word: ἐν μέσῳ
  choice: في الوسط
  rationale: يحافظ على التعبير المكاني في اليونانية من غير تعيين إضافي لمن كانت المرأة في وسطهم.
theological_decisions:
- issue: وصف يسوع بأنه بقي وحده مع بقاء المرأة
  choice: وبقي يسوع وحده، والمرأة واقفة في الوسط
  alternative: فلم يبق من الرجال إلا يسوع، وبقيت المرأة واقفة في الوسط
  rationale: حُفظ التوتر الظاهر في صياغة المصدر، إذ يقول إن يسوع بقي وحده ثم يذكر المرأة، بدل تفسير «وحده» صراحة بأنه وحده من بين المتهمين.
translation_notes:
  register: صياغة عربية فصحى واضحة ومهيبة، مع إبقاء ترتيب الجمل وصورها قريبًا من اليونانية. استُعمل «أما هم» لربط الآية بما قبلها، و«كبار السن» لتجنب الإيحاء بلقب كنسي أو اجتماعي رسمي.
