  source_fidelity: 'ينقل النص عناصر اليونانية بدقة: سماعهم، وتبكيت الضمير لهم، وخروجهم فردًا فردًا، والبدء بكبار السن إلى الأخيرين، ثم بقاء يسوع والمرأة واقفة في الوسط. كما يحافظ على الصياغة التي يبدو فيها «وحده» مع استمرار ذكر المرأة دون تفسير زائد.'
  naturalness: الصياغة فصيحة وواضحة ومناسبة للسرد الكتابي العربي. «واحدًا فواحدًا» و«كبار السن» و«في الوسط» تعبيرات طبيعية. واستعمال «ضمائرهم تُبكِّتهم» مفهوم ومألوف في السجل الفصيح.
