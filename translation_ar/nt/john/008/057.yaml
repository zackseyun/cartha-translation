  text: εἶπον οὖν οἱ Ἰουδαῖοι πρὸς αὐτόν· Πεντήκοντα ἔτη οὔπω ἔχεις καὶ Ἀβραὰμ ἑώρακας;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/057.yaml
  text: So the Jews said to him, “You are not yet fifty years old, and you have seen Abraham?”
translation:
  language: ar
  text: 'فقال له اليهود[a]: «لم تبلغ الخمسين من العمر بعد، وقد رأيت إبراهيم؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أهل اليهودية»، وربما «قادة اليهود»، بحسب مدى دلالة التعبير اليوناني في هذا السياق.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ Ἰουδαῖοι
  choice: اليهود
  rationale: المقابل العربي المباشر للتسمية السردية اليونانية، من غير حصر المرجع في القادة وحدهم؛ وتُذكر الاحتمالات السياقية في الحاشية.
- source_word: οὖν
  choice: فـ
  rationale: فاء الاستئناف السببية/النتيجية تنقل الصلة الاستنتاجية بالسياق السابق بصورة طبيعية موجزة.
- source_word: πεντήκοντα ἔτη οὔπω ἔχεις
  choice: لم تبلغ الخمسين من العمر بعد
  rationale: صياغة عربية طبيعية تؤدي اصطلاح امتلاك عدد من السنين للدلالة على العمر.
- source_word: ἑώρακας
  choice: رأيت
  rationale: الفعل اليوناني تام، لكن العربية الفصحى تؤدي هذا السؤال الإنكاري طبيعيًا بالماضي، مع بقاء معنى حصول الرؤية المزعومة قائمًا في السياق.
- source_word: καὶ
  choice: و
  rationale: تحافظ الواو على الربط الإضافي وعلى نبرة الاستنكار في السؤال من غير إدخال تفسير زائد.
- source_word: Ἀβραὰμ
  choice: إبراهيم
  rationale: الصيغة العربية الكتابية المعيارية للاسم.
theological_decisions:
- issue: دلالة οἱ Ἰουδαῖοι في إنجيل يوحنا
  choice: اليهود
  alternative: اليهوديون أو قادة اليهود
  rationale: النص هنا يستعمل تسمية عامة ولا يحدد القادة وحدهم. لذلك أُبقي المقابل المباشر في المتن، مع حفظ الاحتمالات السياقية في الحاشية تجنبًا لتضييق المرجع تفسيريًا.
- issue: طبيعة السؤال في الجملة الثانية
  choice: وقد رأيت إبراهيم؟
  alternative: أفقد رأيت إبراهيم؟
  rationale: تحافظ الصياغة المختارة على الواو اليونانية وعلى الاستنكار الناشئ من اجتماع صغر السن المزعوم مع ادعاء الرؤية، دون إضافة أداة استفهام غير ملفوظة صراحة.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعمل «لم تبلغ الخمسين من العمر» بدل المحاكاة الحرفية «ليس لك خمسون سنة»، وأُبقي السؤال الإنكاري مكثفًا وقريبًا من ترتيب الأصل.
