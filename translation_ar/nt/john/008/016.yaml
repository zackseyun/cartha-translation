  yaml_path: translation/nt/john/008/016.yaml
  text: But even if I do judge[a], my judgment is true, because I am not alone, but I and the Father who sent me.
translation:
  language: ar
  text: ولكن حتى إن حكمتُ أنا[a]، فحكمي حق، لأنني لست وحدي، بل أنا والآب الذي أرسلني.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إن حكمتُ» أو «إن كنتُ سأحكم». يفيد التعبير الشرطي اليوناني احتمالًا، ويُحتمل أن تكون له هنا دلالة تنازلية: «حتى إن حكمتُ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν κρίνω
  choice: حتى إن حكمتُ أنا
  rationale: التركيب ἐὰν مع المضارع في صيغة الاحتمال يعرض حالة شرطية ممكنة، ويحتمل هنا معنى تنازليًا بحسب السياق. تحافظ الصياغة على هذا المعنى مع إبراز الضمير ἐγώ.
- source_word: δὲ
  choice: ولكن
  rationale: تفيد الأداة انتقالًا تقابليًا مع الكلام السابق، و«ولكن» تنقل هذا الاستدراك بوضوح.
- source_word: ἡ κρίσις ἡ ἐμὴ
  choice: فحكمي
  rationale: تنقل الإضافة معنى العبارة اليونانية طبيعيًا، وتحافظ كلمة «حكم» على دلالتها القضائية في السياق.
- source_word: ἀληθινή
  choice: حق
  rationale: تحافظ «حق» على اتساع الدلالة بين الصدق والصحة، وعلى الصدى اليوحناوي لمفهوم الحق، دون حصرها في الصلاحية القانونية وحدها.
- source_word: μόνος οὐκ εἰμί
  choice: لست وحدي
  rationale: صياغة عربية طبيعية تحفظ النقطة العلاقية، وهي أن حكم يسوع ليس صادرًا عنه بمعزل عن الآب.
- source_word: ἀλλ’ ἐγὼ καὶ ὁ πέμψας με πατήρ
  choice: بل أنا والآب الذي أرسلني
  rationale: تحفظ اقتران يسوع بالآب، وتنقل اسم الفاعل اليوناني بجملة صلة عربية واضحة تحدد الآب بأنه الذي أرسله.
theological_decisions:
- issue: علاقة حكم يسوع بالآب الذي أرسله
  choice: يُقدَّم حكم يسوع بوصفه حقًا لأنه ليس منفردًا أو مستقلًا عن الآب الذي أرسله.
  alternative: يمكن قصر العبارة على حجة قانونية تخص تعدد الشهود فقط، دون استنتاج دلالة لاهوتية أوسع.
  rationale: النص نفسه يعلل حقيقة الحكم بأن يسوع ليس وحده، بل هو والآب الذي أرسله. تحافظ الترجمة على هذا الارتباط من غير توسيعه إلى صياغة عقائدية لاحقة.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. اختيرت «حق» بدل «صحيح» لإبقاء الدلالة اليوحناوية والقضائية معًا، وأُثبتت «أنا» بعد الفعل لأن الضمير اليوناني مذكور للتوكيد.
