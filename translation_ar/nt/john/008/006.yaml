  yaml_path: translation/nt/john/008/006.yaml
  text: They[a] were saying this to test him, so that they might have an accusation against him. But Jesus, bending down, wrote on the ground with his finger, paying no attention.
translation:
  language: ar
  text: وكانوا[a] يقولون هذا ليمتحنوه، لكي تكون لهم تهمة عليه. أما يسوع فانحنى إلى أسفل، وكان يكتب بإصبعه على الأرض، متظاهرًا بأنه لا يسمع.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: هذه الآية جزء من قصة المرأة التي أُمسكت في الزنى (يوحنا 7:53–8:11). لا ترد هذه القصة في عدد من أقدم المخطوطات، وتختلف مواضعها في بعض الشواهد. كذلك لا ترد عبارة «متظاهرًا بأنه لا يسمع» في عدد من المخطوطات.
    reason: textual_critical
lexical_decisions:
- source_word: πειράζοντες
  choice: ليمتحنوه
  rationale: ينقل معنى وضع يسوع موضع الاختبار بقصد خبيث، من غير أن يحصر اللفظ في معنى الإغراء بالخطية أو يضيف صراحةً صورة الفخ.
- source_word: κατηγορίαν κατ' αὐτοῦ
  choice: ما يتهمونه به
  rationale: صياغة عربية طبيعية تحفظ معنى وجود أساس لاتهام موجَّه ضده، مع بقاء الطابع القضائي للسياق.
- source_word: κάτω κύψας
  choice: فانحنى إلى أسفل
  rationale: يحافظ على صورة الانحناء إلى أسفل الواردة في اليونانية، بصياغة واضحة ومباشرة.
- source_word: ἔγραφεν
  choice: وأخذ يكتب
  rationale: الماضي الناقص اليوناني يصور فعلًا مستمرًا؛ و«أخذ يكتب» تؤدي هذا الجانب بصورة طبيعية من غير تحديد مضمون الكتابة.
- source_word: μὴ προσποιούμενος
  choice: غير مبالٍ بهم
  rationale: يعبر عن تعمد عدم الالتفات إليهم أو الاستجابة لهم. أُثبتت العبارة لأنها واردة في النص البيزنطي المعتمد، مع التنبيه في الحاشية إلى اختلاف الشواهد.
theological_decisions:
- issue: مضمون ما كتبه يسوع على الأرض
  choice: عدم تحديد ما كتبه
  alternative: اقتراح أنه كتب خطايا المتهمين أو نصًا من الشريعة
  rationale: المصدر لا يذكر مضمون الكتابة، ولذلك تُحفظ دلالة النص المفتوحة ولا يُدخل تفسير لاهوتي غير مصرح به.
- issue: دافع السائلين
  choice: «ليمتحنوه» مع بيان غاية الاتهام
  alternative: «ليجربوه» أو «ليوقعوه في فخ»
  rationale: يحفظ اللفظ معنى الاختبار، بينما تكشف جملة الغاية نفسها عن القصد العدائي من غير زيادة تفسيرية.
translation_notes:
  register: فصحى معاصرة واضحة ذات نبرة كتابية وقورة. استُخدمت تراكيب مألوفة للقارئ العام، مع تجنب الألفاظ المذهبية والتفسيرات غير المنصوص عليها، والحفاظ على تسلسل الفعل اليوناني وصورته.
