id: JHN.8.29
reference: John 8:29
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ ὁ πέμψας με μετ’ ἐμοῦ ἐστιν· οὐκ ἀφῆκέν με ⸀μόνον, ὅτι ἐγὼ τὰ ἀρεστὰ αὐτῷ ποιῶ πάντοτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/029.yaml
  text: And the one who sent me is with me[a]. He has not left me alone[b], because I always do what is pleasing to him.
translation:
  language: ar
  text: والذي أرسلني هو معي، ولم يتركني وحدي، لأني أفعل دائمًا ما يرضيه.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ πέμψας με
  choice: الذي أرسلني
  rationale: نقل اسم الفاعل المعرّف المستعمل استعمال الاسم بصلة موصول طبيعية في العربية، مع إبقاء التعبير العلاقي دون إضافة «الآب».
- source_word: μετ’ ἐμοῦ ἐστιν
  choice: هو معي
  rationale: تعبير عربي واضح ومباشر يدل على الحضور والمصاحبة المستمرين، ويقابل معنى μετά مع المجرور.
- source_word: οὐκ ἀφῆκέν με μόνον
  choice: لم يتركني وحدي
  rationale: ينقل الفعل الماضي اليوناني وصيغة النفي نقلًا طبيعيًا، ويجعل μόνον حالًا بمعنى «وحدي».
- source_word: ὅτι
  choice: لأني
  rationale: تفيد السببية هنا، إذ تقدم العبارة التالية سبب عدم تركه وحده.
- source_word: τὰ ἀρεστὰ αὐτῷ
  choice: ما يرضيه
  rationale: صياغة عربية طبيعية تحفظ معنى الأشياء المرضية له دون تكلّف حرفي.
- source_word: ποιῶ πάντοτε
  choice: أفعل دائمًا
  rationale: يحفظ المضارع الدال على الفعل المعتاد، مع إبراز الاستمرار الذي تفيده πάντοτε.
theological_decisions:
- issue: مرجع «الذي أرسلني»
  choice: الإبقاء على التعبير «الذي أرسلني»
  alternative: التصريح بـ«الآب الذي أرسلني»
  rationale: السياق يوضح أن المقصود هو الآب، لكن النص اليوناني يحتفظ بالتعبير العلاقي؛ وعدم التصريح يصون أسلوب يوحنا ويتجنب الإضافة.
- issue: العلاقة السببية في ὅτι
  choice: «لأني» بوصفها تعليلًا
  alternative: 'فهمها على نحو تفسيري: «إني أفعل...»'
  rationale: القراءة السببية هي الأنسب نحويًا وسياقيًا، مع بقاء التوتر اللاهوتي في العبارة دون شرح يحدد طبيعة العلاقة بين طاعة يسوع وحضور الآب.
- issue: زمن ἀφῆκεν
  choice: «لم يتركني» بالماضي المنفي
  alternative: صياغة تؤكد النتيجة المستمرة مثل «ما تركني قط»
  rationale: يحافظ الماضي المنفي على صيغة الأوريست اليونانية، بينما تفيد الجملة السابقة «هو معي» استمرار الحضور بوضوح.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدم «هو معي» لإبراز الضمير الموجود في اليونانية والمحافظة على سلاسة الجملة، و«ما يرضيه» بدل الصياغة الحرفية الثقيلة «الأشياء المرضية له».
