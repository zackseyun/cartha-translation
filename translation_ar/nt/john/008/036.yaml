lexical_decisions:
- source_word: ἐὰν οὖν
  choice: فإن
  rationale: تجمع «فـ» بين الاستنتاج والارتباط بما سبق، وتؤدي «إن» معنى الشرط، في صياغة عربية طبيعية موجزة.
- source_word: ὁ υἱὸς
  choice: الابن
  rationale: أداة التعريف والسياق اليوحناوي يجعلان العبارة لقبًا مسيانيًّا يشير إلى يسوع، لا إشارة إلى ابن على وجه العموم.
- source_word: ὑμᾶς
  choice: كم
  rationale: ضمير المخاطبين بصيغة الجمع، وهو ظاهر في اللاحقة العربية.
- source_word: ἐλευθερώσῃ
  choice: حرَّركم
  rationale: فعل متعدٍّ مباشر ينقل فعل العتق أو التحرير بوضوح، ويناسب الشرط المتجه إلى النتيجة المستقبلية.
- source_word: ὄντως
  choice: حقًّا
  rationale: تفيد حقيقة الحرية وأصالتها وتؤدي قوة التوكيد في الظرف اليوناني دون تضييق معناها.
- source_word: ἐλεύθεροι
  choice: أحرارًا
  rationale: خبر وصفي يدل على الحالة الناتجة، ويحافظ على الصلة الاشتقاقية مع «حرَّركم».
- source_word: ἔσεσθε
  choice: تكونون
  rationale: ينقل صيغة المستقبل بحسب دلالة الجملة الشرطية، مع جواز العربية أن تعبّر بالمضارع في جواب الشرط.
theological_decisions:
- issue: هوية «الابن»
  choice: لقب يشير في السياق إلى يسوع على نحو فريد
  alternative: ابن بمعنى عام
  rationale: السياق اليوحناوي ومقابلة الابن بالعبد في البيت يدلان على الاستعمال اللقبي؛ والترجمة تُبقي «الابن» معرّفًا من غير إضافة تفسير عقائدي إلى النص.
- issue: طبيعة الحرية
  choice: حرية حقيقية من غير حصر مداها في الترجمة
  alternative: تقييدها صراحة بالحرية الروحية وحدها أو الاجتماعية وحدها
  rationale: السياق القريب يتناول العبودية للخطية، لكن صياغة الآية نفسها عامة مؤكدة؛ لذلك تُحفظ سعة العبارة وتوترها اللاهوتي.
