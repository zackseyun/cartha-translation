  text: τίς ἐξ ὑμῶν ἐλέγχει με περὶ ἁμαρτίας; ⸀εἰ ἀλήθειαν λέγω, διὰ τί ὑμεῖς οὐ πιστεύετέ μοι;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/046.yaml
  text: Which one of you convicts me of sin? If I speak the truth[c][b][a], why do you not believe me?
translation:
  language: ar
  text: مَن منكم يُثبت أنني مذنب بخطيئة؟[a] إن كنت أقول الحق، فلماذا لا تُصدِّقونني؟[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مَن منكم يكشف فيَّ خطيئة؟»'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «فلماذا لا تثقون بي؟» يمكن أن يدل الفعل اليوناني على تصديق المتكلم وعلى الثقة به.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς ἐξ ὑμῶν
  choice: مَن منكم
  rationale: تعبير استفهامي طبيعي وواضح ينقل التحدي المباشر الموجَّه إلى السامعين.
- source_word: ἐλέγχει με περὶ ἁμαρτίας
  choice: يُثبِت عليَّ خطيئة
  rationale: ينقل السياق الشبيه بالمحاكمة، أي إقامة الحجة على ذنب، من غير أن يحصر الخطية في فعل معيّن أو يحوّل الفعل إلى مجرد توبيخ.
- source_word: εἰ ἀλήθειαν λέγω
  choice: إن كنت أقول الحق
  rationale: يحافظ على صيغة الشرط في اليونانية وعلى التعبير الطبيعي «أقول الحق»، من غير تحويل الشرط تفسيرياً إلى معنى «بما أنني».
- source_word: διὰ τί
  choice: فلماذا
  rationale: ينقل سؤال السبب بعبارة عربية موجزة وطبيعية، والفاء تُظهر الصلة المنطقية بما سبقه.
- source_word: πιστεύετέ μοι
  choice: تُصدِّقونني
  rationale: صياغة عربية طبيعية لتصديق المتكلم وقبول قوله؛ وتُذكر دلالة الثقة الممكنة في الحاشية حفاظاً على سعة الفعل اليوناني.
theological_decisions:
- issue: القوة البلاغية لتحدّي يسوع المتعلق بالخطيئة وصدق كلامه
  choice: إبقاء السؤالين مباشرين من غير تلطيف أو شرح عقائدي زائد
  alternative: 'توسيع العبارة إلى: «هل يستطيع أحد منكم أن يثبت أنني مذنب بأي خطيئة؟»'
  rationale: النص نفسه يربط عجز المخاطَبين عن إثبات خطيئة على يسوع بسؤالهم عن عدم تصديقه؛ والصياغة المختارة تحفظ هذا التوتر والدلالة من غير إضافة ما ليس مصرحاً به.
- issue: دلالة πιστεύω مع المفعول في حالة المجرور اليونانية
  choice: تُصدِّقونني
  alternative: تثقون بي / تؤمنون بي
  rationale: «تصدقونني» أوضح في سياق قول الحق، بينما قد يتضمن الفعل اليوناني أيضاً معنى الثقة الشخصية؛ لذلك حُفظ هذا الاحتمال في الحاشية ولم يُفرض على المتن.
translation_notes:
  register: لغة عربية فصحى معاصرة واضحة ومهيبة. استُعمل «يُثبت عليَّ» بصبغة قضائية طبيعية، و«تُصدِّقونني» لتجنب الإيحاء الحصري الذي قد تحمله «تؤمنون بي» في الاستعمال اللاهوتي العربي، مع حفظ معنى الثقة في الحاشية.
