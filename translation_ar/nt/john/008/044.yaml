source:
  edition: SBLGNT
  text: ὑμεῖς ἐκ τοῦ πατρὸς τοῦ διαβόλου ἐστὲ καὶ τὰς ἐπιθυμίας τοῦ πατρὸς ὑμῶν θέλετε ποιεῖν. ἐκεῖνος ἀνθρωποκτόνος ἦν ἀπ’ ἀρχῆς, καὶ ἐν τῇ ἀληθείᾳ ⸂οὐκ ἔστηκεν⸃, ὅτι οὐκ ἔστιν ἀλήθεια ἐν αὐτῷ. ὅταν λαλῇ τὸ ψεῦδος, ἐκ τῶν ἰδίων λαλεῖ, ὅτι ψεύστης ἐστὶν καὶ ὁ πατὴρ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/044.yaml
  text: You are from your father[a], the devil, and you want to do your father's desires. He was a murderer from the beginning, and he has not stood in the truth, because there is no truth in him. Whenever he speaks the lie, he speaks from his own nature[c][b], because he is a liar and the father of it.
translation:
  language: ar
  text: أنتم من أبيكم، الشيطان، وتريدون أن تفعلوا رغبات أبيكم. كان قاتلًا للناس منذ البدء، ولم يثبت في الحق، لأنه لا حق فيه. وكلما تكلّم بالكذب[a]، فإنه يتكلم مما هو خاص به[b]، لأنه كذّاب وأبو الكذب[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًّا: «كلما تكلَّم بالكذبة»؛ ويمكن ترجمتها بسلاسة: «كلما كذب» أو «كلما تكلَّم بالباطل».'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًّا: «يتكلَّم مما هو له»؛ أي مما يخصه ويصدر عن طبيعته أو خُلُقه.'
    reason: lexical_alternative
  - marker: c
    text: 'حرفيًّا: «وأبوه»؛ والأرجح أن الضمير يعود إلى «الكذب»، أي إنه أبو الكذب ومصدره. وقد تُفهم العبارة أيضًا على نحو أعم: «أبو الأكاذيب».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ τοῦ πατρὸς τοῦ διαβόλου
  choice: مِنْ أَبِيكُمُ الشَّيْطَانِ
  rationale: تفيد ἐκ المصدر أو الانتماء، وتحافظ الصياغة على المواجهة وعلى كون «الشيطان» بدلًا بيانيًّا من «أبيكم».
- source_word: ἐπιθυμίας
  choice: شهوات
  rationale: تدل هنا على الرغبات المنحرفة عمومًا، لا على الشهوة الجنسية وحدها؛ و«شهوات» لفظ عربي كتابي مفهوم بهذا الاتساع.
- source_word: θέλετε ποιεῖν
  choice: تريدون أن تفعلوا
  rationale: ينقل معنى الإرادة والقصد بصياغة عربية طبيعية مباشرة.
- source_word: ἀνθρωποκτόνος
  choice: قاتلًا للناس
  rationale: يعني قاتل البشر؛ وهذه الصياغة أوضح للقارئ المعاصر من «قتّال الناس» وتحافظ على عموم العنصر ἀνθρωπο-.
- source_word: ἀπ’ ἀρχῆς
  choice: منذ البدء
  rationale: ينقل العبارة الزمنية ويحافظ على الصدى اليوحناوي المتكرر للفظ «البدء».
- source_word: ἐν τῇ ἀληθείᾳ οὐκ ἔστηκεν
  choice: لم يثبت في الحق
  rationale: يحافظ على صورة الوقوف أو الثبات من غير أن يصرّح بأنه كان في الحق أولًا ثم تركه.
- source_word: ὅταν λαλῇ τὸ ψεῦδος
  choice: متى تكلم بالكذب
  rationale: صياغة عربية واضحة تحفظ معنى التكرار الملازم لـὅταν، بينما يُذكر التركيب الحرفي «تكلّم بالكذبة» في الحاشية.
- source_word: ἐκ τῶν ἰδίων λαλεῖ
  choice: فمن ذاته يتكلم
  rationale: يحافظ قدر الإمكان على الإيجاز والغموض النسبي في «مما هو له»، مع إفادة أن الكذب يصدر من خاصته أو طبيعته.
- source_word: ψεύστης
  choice: كذاب
  rationale: مقابل عربي مباشر وطبيعي لاسم الفاعل الدال على اتصافه بالكذب.
- source_word: ὁ πατὴρ αὐτοῦ
  choice: أبو الكذب
  rationale: الضمير يعود على الأرجح إلى الكذب المذكور قبله؛ والصياغة العربية توضح المرجع من غير تحويل المفرد إلى جمع.
theological_decisions:
- issue: مرجع ὁ πατὴρ αὐτοῦ
  choice: أبو الكذب، أي مصدره ومنشؤه
  alternative: «أبوه» بإرجاع الضمير إلى الشيطان، أو «أبو الأكاذيب» بصياغة تعميمية
  rationale: أقرب مرجع نحوي وسياقي هو τὸ ψεῦδος، أي الكذب؛ أما «أبوه» فتنتج معنى غريبًا لا يقتضيه السياق، و«أبو الأكاذيب» توسع المفرد إلى جمع. أُبقي البديل في الحاشية لصون موضع الاحتمال.
- issue: هل تفيد العبارة أن الشيطان كان ثابتًا في الحق ثم سقط
  choice: لم يثبت في الحق
  alternative: لم يبقَ في الحق
  rationale: «لم يبقَ» توحي بوضوح بحالة سابقة في الحق، بينما اليونانية المنفية لا تحسم هذا الاستنتاج. «لم يثبت» تصون الصورة والتوتر من غير تقرير تاريخ سابق.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُعمل «الحق» و«البدء» للمحافظة على معجم يوحنا، مع تجنب ألفاظ عتيقة غير لازمة. جميع علامات الحواشي [a] و[b] و[c] مثبتة في المتن عند مواضعها.
