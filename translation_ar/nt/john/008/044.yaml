revisions:
- from: أَنْتُمْ مِنْ أَبِيكُمُ الشَّيْطَانِ، وَتُرِيدُونَ أَنْ تَفْعَلُوا شَهَوَاتِ أَبِيكُمْ. ذَاكَ كَانَ قَاتِلًا لِلنَّاسِ مُنْذُ الْبَدْءِ، وَلَمْ يَثْبُتْ فِي الْحَقِّ، لِأَنَّهُ لَا حَقَّ فِيهِ. وَمَتَى تَكَلَّمَ بِالْكَذِبِ[a]، فَمِنْ ذَاتِهِ يَتَكَلَّمُ[b]، لِأَنَّهُ كَذَّابٌ وَأَبُو الْكَذِبِ[c].
  to: أنتم من أبيكم، الشيطان، وتريدون أن تفعلوا رغبات أبيكم. كان قاتلًا للناس منذ البدء، ولم يثبت في الحق، لأنه لا حق فيه. وكلما تكلّم بالكذب[a]، فإنه يتكلم مما هو خاص به[b]، لأنه كذّاب وأبو الكذب[c].
  rationale: تُصحَّح العبارة الخاصة بمصدر كلام الشيطان لتقابل ἐκ τῶν ἰδίων بدقة أكبر، ويُستبدل اللفظ العربي الذي قد يضيّق «الرغبات» بلفظ أعم. وتبقى الصياغة غير حاسمة لمسألة ما إذا كان قد وقف سابقًا في الحق، وتحافظ الحواشي على مواضع البدائل والتفسير.
