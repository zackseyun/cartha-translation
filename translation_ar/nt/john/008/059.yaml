  yaml_path: translation/nt/john/008/059.yaml
  text: So they picked up stones to throw at him[a], but Jesus hid himself and went out of the temple.
translation:
  language: ar
  text: فالتقطوا حجارةً ليرموه بها، لكن يسوع اختبأ وخرج من الهيكل[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي، على وجه أدق: من ساحات الهيكل أو مجمّعه؛ فالكلمة اليونانية ἱερόν تشير إلى مجمّع الهيكل، لا إلى المقدس الداخلي وحده.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦραν οὖν λίθους
  choice: فرفعوا حجارةً
  rationale: ينقل «فـ» نتيجة الكلام السابق، و«رفعوا حجارة» تعبير عربي طبيعي عن تناولها استعدادًا لاستعمالها.
- source_word: ἵνα βάλωσιν ἐπ’ αὐτόν
  choice: ليرجموه بها
  rationale: تفيد ἵνα الغرض، والسياق هو إلقاء الحجارة عليه بقصد رجمه؛ وإضافة «بها» توضح مرجع الحجارة من غير زيادة في المعنى.
- source_word: ἐκρύβη
  choice: اختبأ
  rationale: 'مع أن الصيغة اليونانية مبنية للمجهول صرفيًا، فإنها تؤدي هنا معنى وسطيًا طبيعيًا: أخفى نفسه أو اختبأ، من غير افتراض فاعل آخر.'
- source_word: ἐξῆλθεν
  choice: خرج
  rationale: ترجمة مباشرة وموجزة للحركة إلى خارج المكان.
- source_word: ἐκ τοῦ ἱεροῦ
  choice: من الهيكل
  rationale: «الهيكل» هو التعبير العربي المألوف، مع توضيح أن ἱερόν يدل هنا على مجمّع الهيكل وساحاته، لا المقدس الداخلي وحده.
theological_decisions:
- issue: كيفية نجاة يسوع
  choice: إثبات أنه اختبأ وخرج فقط
  alternative: إضافة أنه اجتاز من وسطهم بأعجوبة أو صار غير منظور
  rationale: النص اليوناني المعطى لا يذكر إلا اختباء يسوع وخروجه، فلا تُضاف إليه تفاصيل من قراءات مخطوطية لاحقة أو استنتاجات تفسيرية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدمت «ليرجموه بها» لأنها طبيعية في العربية وتبيّن الفعل المقصود في هذا السياق، مع إبقاء السرد موجزًا وعدم إضافة كيفية خارقة للنجاة.
