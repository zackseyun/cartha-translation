    reason: textual_critical
lexical_decisions:
- source_word: Ἄγουσιν
  choice: فجاء ... بامرأة
  rationale: الفعل مضارع تاريخي بمعنى «يأتون بها/يقودونها»، وصيغ بالماضي «فجاء» لسلاسة السرد العربي، مع الباء للدلالة على إحضارها إلى يسوع.
- source_word: ἐν μοιχείᾳ κατειλημμένην
  choice: أُمسكت وهي تزني
  rationale: اسم المفعول التام المبني للمجهول من καταλαμβάνω يدل على أنها ضُبطت في حال ارتكاب الزنى، وهذه الصياغة العربية أوضح من التعبير الاسمي المجرد.
- source_word: στήσαντες
  choice: أوقفوها
  rationale: اسم الفاعل الأوريستي يصف وضعها واقفة أمام الحاضرين؛ وعُطف الفعل في العربية لأن ذلك طبيعي وموجز، مع بقاء ترتيب الحدث.
- source_word: ἐν μέσῳ
  choice: في الوسط
  rationale: تعبير طبيعي يحافظ على معنى وضعها وسط الجماعة، من غير تحديد زائد لمن كان يحيط بها.
- source_word: οἱ γραμματεῖς καὶ οἱ Φαρισαῖοι
  choice: الكتبة والفريسيون
  rationale: المقابل العربي الكتابي الشائع والواضح لهاتين الجماعتين.
