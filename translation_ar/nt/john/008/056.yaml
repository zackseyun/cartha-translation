lexical_decisions:
- source_word: Ἀβραὰμ
  choice: إبراهيم
  rationale: الصيغة العربية المعيارية الراسخة لاسم أبي الآباء.
- source_word: ὁ πατὴρ ὑμῶν
  choice: أبوكم
  rationale: تعبير عربي طبيعي ومباشر يحفظ علاقة الأبوة وصيغة خطاب الجمع.
- source_word: ἠγαλλιάσατο
  choice: ابتهج
  rationale: ينقل دلالة الفرح الشديد والابتهاج، مع إبقاء تمييز لفظي عن χαίρω اللاحقة.
- source_word: ἵνα ἴδῃ
  choice: بأن يرى
  rationale: صياغة عربية طبيعية تستوعب معنى مضمون الابتهاج مع بقاء احتمال الغاية قريبًا، من غير إضافة دلالة زمنية غير مصرّح بها.
- source_word: τὴν ἡμέραν τὴν ἐμήν
  choice: يومي
  rationale: يحفظ العبارة المجازية الموجزة والغنية دلاليًا من غير تعيين الحدث أو الزمن المقصود.
- source_word: καὶ εἶδεν
  choice: وقد رآه
  rationale: الضمير يعود إلى «يومي»، وإثباته في العربية يجعل الإحالة واضحة، وتفيد «قد» تحقق الرؤية في مقابل التطلع السابق.
- source_word: καὶ ἐχάρη
  choice: ففرح
  rationale: ينقل χαίρω بلفظ طبيعي، ويحفظ فرقًا نسبيًا عن قوة «ابتهج» في صدر الآية.
theological_decisions:
- issue: المقصود بعبارة «يومي»
  choice: الإبقاء على العبارة الحرفية «يومي» من غير تحديد الحدث المقصود.
  alternative: تفسيرها بيوم مجيء المسيح، أو خدمته الأرضية، أو موته وقيامته، أو ظهوره الأخير.
  rationale: العبارة اليونانية واسعة الدلالة، والآية نفسها لا تعيّن حدثًا أو وقتًا بعينه؛ لذلك ينبغي حفظ التوتر التفسيري.
- issue: دلالة ἵνα في ابتهاج إبراهيم
  choice: «بأن يرى» بوصفها صياغة تحتمل مضمون التطلع، مع عدم إقصاء معنى الغاية.
  alternative: «لكي يرى» أو «ليرى».
  rationale: يمكن فهم جملة ἵνα هنا على نحو غائي أو باعتبارها متممة لمعنى الابتهاج؛ والنص والحاشية يحفظان هذا الاحتمال الحقيقي من غير حسم زائد.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُعملت «ابتهج» ثم «فرح» للمحافظة على التنويع بين فعلي الفرح في اليونانية. وُضعت علامتا الحاشيتين بعد «يومي» وفق موضع المسألتين التفسيريتين.
