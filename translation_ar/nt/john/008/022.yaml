  text: ἔλεγον οὖν οἱ Ἰουδαῖοι· Μήτι ἀποκτενεῖ ἑαυτὸν ὅτι λέγει· Ὅπου ἐγὼ ὑπάγω ὑμεῖς οὐ δύνασθε ἐλθεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/022.yaml
  text: So the Jews were saying[a], “Surely he will not kill himself, since he says, ‘Where I am going, you cannot come’?”
translation:
  language: ar
  text: 'فكان اليهود يقولون[a]: «أفهل يعقل أن يقتل نفسه؟ لأنه يقول: حيث أذهب أنا لا تقدرون أن تأتوا.»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو ربما، بحسب السياق في إنجيل يوحنا: «أهل اليهودية» أو «قادة اليهود»، تبعًا لمدى شمول الإشارة هنا.'
    reason: بديل معجمي وسياقي يحفظ احتمال أن تكون العبارة أضيق من الإشارة إلى اليهود جميعًا.
lexical_decisions:
- source_word: ἔλεγον
  choice: كانوا يقولون
  rationale: صيغة الماضي الناقص تدل على كلام جارٍ أو متكرر في سياق السرد، وهذا التركيب يحفظ هذا الجانب في العربية الطبيعية.
- source_word: οὖν
  choice: فـ
  rationale: تفيد الصلة الاستنتاجية أو استمرار السرد بناءً على القول السابق، والفاء تؤدي ذلك بإيجاز وطبيعية.
- source_word: οἱ Ἰουδαῖοι
  choice: اليهود
  rationale: هذا هو المقابل المباشر للعبارة اليونانية. وقد تشير في سياق يوحنا إلى اليهود عمومًا أو إلى اليهودية أو بعض القادة والمعارضين، لذلك لم يُضيَّق مدلولها في المتن.
- source_word: Μήτι
  choice: ألعله
  rationale: تدخل على سؤال يتوقع جوابًا بالنفي، و«ألعله» تنقل الاستبعاد والاستفهام المتشكك من غير أن تحوله إلى تقرير.
- source_word: ἀποκτενεῖ ἑαυτόν
  choice: سيقتل نفسه
  rationale: ينقل الفعل المستقبلي والضمير الانعكاسي بوضوح وبلغة عربية معاصرة.
- source_word: ὅτι
  choice: لأنه
  rationale: تقدم سبب استنتاجهم، إذ بنوا تخمينهم على قوله اللاحق.
- source_word: λέγει
  choice: يقول
  rationale: يحفظ المضارع اليوناني الحاضر داخل إطار الكلام.
- source_word: Ὅπου ἐγὼ ὑπάγω
  choice: حيث أذهب أنا
  rationale: صياغة عربية واضحة تحافظ على معنى الذهاب وعلى إبراز الضمير ἐγώ دون أن تزيد معنى المغادرة صراحة.
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: لا تقدرون أن تأتوا
  rationale: تحفظ دلالة القدرة المنفية في δύνασθε، مع تركيب عربي واضح وطبيعي.
theological_decisions:
- issue: مدلول οἱ Ἰουδαῖοι في إنجيل يوحنا
  choice: إبقاء «اليهود» في المتن
  alternative: «أهل اليهودية» أو «قادة اليهود»
  rationale: اللفظ اليوناني لا يضيّق المرجع صراحة في هذه الآية. وقد يحمل السياق اليوحناوي دلالة جغرافية أو يشير إلى قادة ومعارضين بعينهم، لذلك تُحفظ سعة اللفظ في المتن وتُذكر الاحتمالات في الحاشية بدل حسمها تفسيريًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة سردية وقورة. استُخدم «ألعله» لنقل السؤال المتوقع نفيه، وأُبقيت العبارة «اليهود» في المتن مع حاشية تمنع التعميم غير المبرر.
