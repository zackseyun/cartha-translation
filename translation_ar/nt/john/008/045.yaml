lexical_decisions:
- source_word: ἐγὼ
  choice: أَمَّا أَنَا
  rationale: أُبقي ضمير المتكلم الصريح لإظهار التوكيد والمقابلة مع المخاطَبين، وصيغته مع «أمّا» طبيعية في العربية.
- source_word: δὲ
  choice: أَمَّا
  rationale: تفيد المقابلة بالسياق السابق، وقد دُمجت مع الضمير في تركيب عربي فصيح يحفظ القوة الاستدراكية.
- source_word: ὅτι
  choice: لِأَنِّي
  rationale: 'فُهمت الأداة هنا على معناها السببي، وهو الأنسب لتتابع الحجة: عدم تصديقهم له مرتبط بقوله الحق.'
- source_word: τὴν ἀλήθειαν
  choice: الْحَقَّ
  rationale: «الحق» المقابل العربي المباشر والطبيعي لـἀλήθεια في هذا السياق.
- source_word: λέγω
  choice: أَقُولُ
  rationale: يحفظ دلالة المضارع وصيغة الفعل العامة، وهو تركيب عربي طبيعي مع «الحق».
- source_word: οὐ πιστεύετέ μοι
  choice: لَا تُصَدِّقُونَنِي
  rationale: ينقل معنى πιστεύω مع مفعوله الشخصي بصياغة عربية مباشرة، من غير توسيعه إلى «لا تصدقون ما أقوله».
theological_decisions:
- issue: دلالة ὅτι وعلاقتها بقول يسوع الحق وعدم تصديق مخاطبيه له
  choice: 'سببية: «فلأني أقول الحق»'
  alternative: 'تقريرية/أشد حرفية: «أني أقول الحق»'
  rationale: السياق القريب والمقابلة في الخطاب يرجحان المعنى السببي، ويحفظ هذا الاختيار المفارقة الحادة من غير إضافة تفسير عقائدي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُعمل «أمّا أنا» لإبراز المقابلة، و«لا تصدقونني» لصون الإسناد الشخصي المباشر. وُضعت علامة الحاشية بعد الجملة لأنها تتناول فهم الرابط السببي وصياغة الجملة كلها.
