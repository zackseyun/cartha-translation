base_translation:
  language: en
  yaml_path: translation/nt/john/008/048.yaml
  text: The Jews answered and said to him[c][b][a], “Are we not right in saying that you are a Samaritan and have a demon?”
translation:
  language: ar
  text: 'فأجاب اليهود[a] وقالوا له: «ألسنا نقول بحق إنك سامريّ، وإن بك شيطانًا؟»[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'قد تعني العبارة في بعض السياقات: «أهل اليهودية» أو «قادة اليهود». وكثيرًا ما يشير تعبير «اليهود» في إنجيل يوحنا إلى جماعة معينة تعارض يسوع، لا إلى جميع اليهود بلا استثناء.'
    reason: alternative_reading
  - marker: b
    text: 'حرفيًا: «وإن بك شيطانًا»؛ ويمكن أن تُفهم: «وإنك ممسوس بشيطان».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπεκρίθησαν
  choice: فأجاب
  rationale: فعل ماضٍ بصيغة وسطى/مبنية للمجهول ذات معنى معلوم هنا، ودلالته المعتادة «أجابوا». صيغ المفرد في العربية جائزة وطبيعية مع جمع غير العاقل صرفيًا «اليهود» بوصفه اسم جماعة، لكن الأفصح هنا مراعاة المعنى؛ ومع ذلك جاء «فأجاب اليهود» استعمالًا عربيًا سليمًا موجزًا.
- source_word: οἱ Ἰουδαῖοι
  choice: اليهود
  rationale: نقل مباشر للعبارة اليونانية من غير تضييقها تفسيريًا إلى «قادة اليهود» أو تحويلها إلى «اليهوديون/أهل اليهودية». وتوضح الحاشية أن مرجعها السياقي ليس بالضرورة جميع اليهود بلا استثناء.
- source_word: εἶπαν αὐτῷ
  choice: وقالوا له
  rationale: يحفظ الفعل الثاني والازدواج السردي الموجود في اليونانية، وهو طبيعي في الأسلوب العربي الكتابي الواضح.
- source_word: Οὐ καλῶς λέγομεν ἡμεῖς
  choice: أما نقول بحق
  rationale: استفهام إنكاري يتوقع التصديق؛ و«بحق» تنقل καλῶς بمعنى «على صواب/بصورة صحيحة» بعبارة عربية طبيعية، مع إبقاء فعل القول حاضرًا.
- source_word: Σαμαρίτης
  choice: سامريّ
  rationale: نسبة إثنية/دينية مباشرة، مستعملة هنا على سبيل الإهانة في سياق الخصومة.
- source_word: δαιμόνιον ἔχεις
  choice: إن بك شيطانًا
  rationale: تعكس حرفيًا نسبيًا معنى «لديك/بك شيطان» من دون تفسير العبارة بالمصطلح الأشد تحديدًا «ممسوس» أو «ممسوس بالشيطان». و«بك شيطان» عربية طبيعية تفيد الملابسة أو السكنى.
theological_decisions:
- issue: مرجع οἱ Ἰουδαῖοι في إنجيل يوحنا
  choice: اليهود
  alternative: أهل اليهودية؛ قادة اليهود
  rationale: اللفظ اليوناني نفسه لا يحدد القادة، لذلك أبقيت الترجمة المباشرة ولم أُدخل تضييقًا تفسيريًا في المتن. وتمنع الحاشية فهم العبارة على أنها تعميم على كل يهودي.
- issue: درجة تفسير δαιμόνιον ἔχεις
  choice: إن بك شيطانًا
  alternative: إنك ممسوس بشيطان؛ إن شيطانًا يسكنك
  rationale: يحفظ الاختيار صورة «وجود شيطان لدى الشخص/به» ولا يحسم تفاصيل طبيعة التأثير الشيطاني بألفاظ تفسيرية أوسع من الأصل.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. حُفظ الازدواج السردي «أجاب... وقالوا»، وصيغ الاستفهام الإنكاري بعبارة طبيعية. وُضعت علامتا الحاشية بعد الجملة التي تتصلان بها، مع تجنب مصطلحات طائفية أو تفسيرية زائدة.
