  yaml_path: translation/nt/john/008/035.yaml
  text: The servant does not remain in the household forever[b][a]; the son remains forever.
translation:
  language: ar
  text: فالعبد[a] لا يبقى في البيت إلى الأبد، أمّا الابن[b] فيبقى إلى الأبد.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أن تعني الكلمة اليونانية أيضًا «الخادم»، لكن «العبد» تُبرز هنا بصورة أوضح اختلاف المكانة بينه وبين الابن داخل البيت.
    reason: lexical_alternative
  - marker: b
    text: قد تحمل عبارة «الابن» في سياق الكلام إشارة ضمنية إلى يسوع، مع أن صياغة هذه الآية تشبه أيضًا قولًا عامًا عن أهل البيت.
    reason: alternative_reading
lexical_decisions:
- source_word: δοῦλος
  choice: العبد
  rationale: تحفظ «العبد» دلالة الوضع غير الحر داخل البيت، وتُبرز المقابلة في المكانة والثبات بين العبد والابن. وقد تدل الكلمة اليونانية بحسب السياق على خادم، لذلك أُثبت البديل في الحاشية.
- source_word: μένει
  choice: يبقى
  rationale: استُعمل الفعل نفسه في العبارتين للمحافظة على تكرار الأصل، وهو تعبير عربي طبيعي يدل على دوام المقام والمكانة.
- source_word: οἰκία
  choice: البيت
  rationale: «البيت» مقابل مباشر وطبيعي، ويمكن أن يشمل في العربية مكان السكن والجماعة العائلية معًا، فيحفظ الصلة بسياق الانتماء والمكانة من غير حصر المعنى في البناء المادي.
- source_word: εἰς τὸν αἰῶνα
  choice: إلى الأبد
  rationale: تعبير عربي مألوف ينقل معنى الدوام، وقد تكرر كما في الأصل.
- source_word: υἱός
  choice: الابن
  rationale: يحفظ التحديد والتذكير في الأصل والمقابلة المنزلية مع العبد، من غير تحويل العبارة صراحةً إلى لقب مسياني.
- source_word: δὲ
  choice: أمّا ... فـ
  rationale: صيغت أداة الانتقال والمقابلة بأسلوب «أمّا ... فـ» العربي الطبيعي، وتكررت في الشطر الثاني لإبراز التوازي من غير إضافة ظرف زمني غير موجود في الأصل.
theological_decisions:
- issue: الإيحاء المسيحاني المحتمل في عبارة «الابن»
  choice: الابن بحرف عادي ومن غير تفسير داخل المتن
  alternative: الابن بوصفه لقبًا صريحًا للمسيح
  rationale: القول ذو صياغة مثلية عامة عن مكانة العبد والابن في البيت، لكنه يمهّد أيضًا لتطبيق يسوع في الآية التالية. لذلك يحفظ النص هذا التوتر ولا يحسم العبارة كلقب مسيحاني صريح.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ التوازي والتكرار في الجملتين، واستُعمل «البيت» بما يسمح بالدلالة على المنزل والأسرة معًا. جميع علامتي الحاشية واردتان في المتن.
