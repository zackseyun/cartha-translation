source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ἐάν τις τὸν ⸂ἐμὸν λόγον⸃ τηρήσῃ, θάνατον οὐ μὴ θεωρήσῃ εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/051.yaml
  text: Truly, truly, I say to you, if anyone keeps my word, he will certainly never see death forever.
translation:
  language: ar
  text: '«الحقَّ الحقَّ أقول لكم: إن حفظ أحدٌ كلامي، فلن يرى الموت إلى الأبد».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «لن يرى الموت إلى الدهر». ويجمع الأصل بين نفي شديد وعبارة «إلى الدهر»، أي «أبدًا».'
    reason: توضيح شدة النفي والصياغة الزمنية اليونانية، مع الحفاظ على العبارة في المتن.
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: الحقَّ الحقَّ
  rationale: صيغة يوحنا التأكيدية المتكررة، وقد صيغت بعبارة عربية كتابية واضحة تحافظ على التكرار والقوة.
- source_word: τηρήσῃ
  choice: حفظ
  rationale: يدل هنا على التمسك بالكلام والعمل به، و«حفظ» يترك هذا الاتساع الدلالي قائمًا.
- source_word: τὸν ἐμὸν λόγον
  choice: كلامي
  rationale: ينقل المفرد λόγον طبيعيًا من غير حصره في قول واحد أو تحويله إلى معنى اصطلاحي أضيق.
- source_word: θεωρήσῃ
  choice: يرى
  rationale: يحافظ على صورة رؤية الموت الواردة في النص، بدل تفسيرها مباشرةً بمعنى الذوق أو الاختبار.
- source_word: οὐ μὴ ... εἰς τὸν αἰῶνα
  choice: فلن ... إلى الأبد
  rationale: «لن» تنقل النفي القوي في οὐ μὴ، و«إلى الأبد» تمثل العبارة الزمنية الصريحة εἰς τὸν αἰῶνα.
theological_decisions:
- issue: معنى عدم رؤية الموت
  choice: الإبقاء على العبارة المجازية «لن يرى الموت»
  alternative: «لن يموت أبدًا» أو «لن يختبر الموت الأبدي»
  rationale: النص يقول حرفيًا «يرى الموت»، وتفسير نوع الموت المقصود محل توتر في السياق؛ لذلك لا ينبغي حسمه داخل المتن.
- issue: القوة الزمنية لعبارة εἰς τὸν αἰῶνα
  choice: إثبات «إلى الأبد» في المتن
  alternative: الاكتفاء بـ«لن يرى الموت أبدًا»
  rationale: يحافظ هذا على العنصر الزمني المنفصل في اليونانية، وإن كانت العربية تحتاج إلى بيان أن التركيب مقصود للتوكيد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ التكرار في المطلع، والصورة المجازية «يرى الموت»، والنهاية الزمنية الصريحة، من غير إدخال تفسير مذهبي لنوع الموت المقصود.
