  source_fidelity: 'ينقل النص بدقة عناصر اليونانية الأساسية: صيغة التأكيد المكررة «ἀμὴν ἀμὴν»، والشرط العام، و«كلامي»، وفعل «يرى» في صورة الموت، والنفي المؤكد οὐ μή مع الامتداد «εἰς τὸν αἰῶνα». و«فلن يرى الموت إلى الأبد» يحافظ على الصورة والتوكيد من غير تفسير لطبيعة الموت.'
