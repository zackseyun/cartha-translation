    reason: صياغة بديلة تُظهر بوضوح معنى الثقة الشخصية في تركيب πιστεύω εἰς.
lexical_decisions:
- source_word: ταῦτα
  choice: هذه الأمور
  rationale: يحفظ صيغة الجمع ويصل الكلام بما سبق، وهو تعبير عربي طبيعي عن مضمون أقواله السابقة.
- source_word: αὐτοῦ λαλοῦντος
  choice: وبينما كان يقول
  rationale: ينقل تركيب المضاف المطلق مع اسم الفاعل المضارع بوصفه فعلاً متزامناً مستمراً؛ فالإيمان وقع في أثناء كلامه.
- source_word: πολλοὶ
  choice: كثيرون
  rationale: الصفة مستعملة استعمال الاسم، وصيغة جمع المذكر العاقل واضحة من غير إضافة «من الناس».
- source_word: ἐπίστευσαν
  choice: آمن
  rationale: ينقل الفعل الماضي اليوناني بوصفه حدثاً منظوراً إليه في كليته، من غير زيادة معنى البدء الصريح.
- source_word: εἰς αὐτόν
  choice: به
  rationale: «آمن به» هو التعبير العربي الفصيح والطبيعي عن الثقة الموجَّهة إلى شخص، ويحفظ القوة العلائقية للتركيب اليوناني.
theological_decisions:
- issue: دلالة πιστεύω εἰς αὐτόν في الاستعمال اليوحناوي
  choice: آمن به
  alternative: صدَّقه؛ وضعوا ثقتهم فيه
  rationale: وجود εἰς مع πιστεύω يدل عادةً في يوحنا على إيمان أو ثقة موجَّهة إلى شخص المسيح، لا على مجرد تصديق كلامه. وتحفظ «آمن به» هذه الدلالة من غير توسع تفسيري.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُعملت «وبينما» لإبراز تزامن الإيمان مع استمرار الكلام، و«هذه الأمور» للمحافظة على جمع ταῦτα، و«آمن به» باعتبارها الصياغة العربية الطبيعية والدقيقة.
