  text: εἶπον οὖν ὑμῖν ὅτι ἀποθανεῖσθε ἐν ταῖς ἁμαρτίαις ὑμῶν· ἐὰν γὰρ μὴ πιστεύσητε ὅτι ἐγώ εἰμι, ἀποθανεῖσθε ἐν ταῖς ἁμαρτίαις ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/024.yaml
  text: So I told you that you will die in your sins. For unless you believe that I am[a], you will die in your sins.
translation:
  language: ar
  text: لذلك قلت لكم إنكم ستموتون في خطاياكم؛ فإن لم تؤمنوا أنني أنا[a]، فستموتون في خطاياكم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «أنني أنا». لا يذكر النص اليوناني خبرًا صريحًا بعد «أنا»، وقد تحمل هذه الصياغة دلالة أعمق في إنجيل يوحنا؛ ويمكن فهمها أيضًا بمعنى «أنني أنا هو».'
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπον οὖν ὑμῖν
  choice: لذلك قلت لكم
  rationale: تفيد οὖν الربط الاستنتاجي بما سبق، وتنقل «لذلك» هذا الترابط بوضوح، أما εἶπον مع ὑμῖν فترجمتها الطبيعية «قلت لكم».
- source_word: ἀποθανεῖσθε
  choice: ستموتون
  rationale: صيغة مستقبلية من فعل الموت، فحُفظ معناها المباشر من غير إضافة معنى «الهلاك» التفسيري.
- source_word: ἐν ταῖς ἁμαρτίαις ὑμῶν
  choice: في خطاياكم
  rationale: 'حُفظ جمع ἁμαρτίαις، وتدل ἐν هنا على الحال أو النطاق: أن يموتوا وهم باقون في خطاياهم.'
- source_word: ἐὰν γὰρ μὴ
  choice: لأنكم إن لم
  rationale: تنقل «لأن» تعليل γάρ، وتنقل «إن لم» الشرط المنفي في ἐὰν μή، مع صياغة عربية طبيعية.
- source_word: πιστεύσητε
  choice: تؤمنوا
  rationale: «تؤمنوا» هي المقابلة العربية المباشرة الشائعة لـ πιστεύω في السياق اليوحناوي، مع ما قد يحمله الفعل من معنى الثقة والاعتماد.
- source_word: ὅτι ἐγώ εἰμι
  choice: أني أنا[a]
  rationale: لا يصرّح اليوناني بخبر بعد ἐγώ εἰμι. وتحافظ «أني أنا» على هذا الانفتاح المقصود بدل إضافة «هو» أو تعيين هوية غير مذكورة، وتوضح الحاشية غرابة التركيب ودلالته المحتملة.
theological_decisions:
- issue: ترجمة العبارة اليوحناوية ἐγώ εἰμι من غير خبر صريح
  choice: أني أنا[a]
  alternative: أني أنا هو
  rationale: قد تُفهم العبارة على أنها تعريف بالهوية بمعنى «أنا هو»، وقد تحمل أيضًا صدى أعمق لصيغة «أنا كائن». أبقى النص خبرها غير مصرح به كما في اليونانية، وتشرح الحاشية ذلك من غير حسم التوتر اللاهوتي.
translation_notes:
  register: لغة عربية فصحى حديثة واضحة وكريمة. استُخدمت الفاصلة المنقوطة للفصل بين التقرير وتعليله، وحُفظ تكرار «ستموتون في خطاياكم» لما له من توكيد في الأصل.
