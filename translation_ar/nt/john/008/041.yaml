base_translation:
  language: en
  yaml_path: translation/nt/john/008/041.yaml
  text: You are doing the works of your father.” They said to him[a], “We were not born of sexual immorality; we have one Father—God.”
translation:
  language: ar
  text: 'أنتم تعملون أعمال أبيكم». فقالوا له: «نحن لم نُولَد من زنى[a]. لنا أب واحد، وهو الله».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لسنا أولادًا غير شرعيين». واليونانية حرفيًا: «لم نُولَد من زنى».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιεῖτε
  choice: تعملون
  rationale: المضارع يدل على فعل قائم، و«تعملون» تعبير عربي طبيعي يحافظ على الصلة اللفظية بـ«أعمال».
- source_word: τὰ ἔργα
  choice: أعمال
  rationale: تحافظ «أعمال» على المعنى المعتاد للكلمة وعلى التوازي مع الفعل ποιεῖτε.
- source_word: τοῦ πατρὸς ὑμῶν
  choice: أبيكم
  rationale: يحفظ لفظ الأبوة كما في اليونانية، بما فيه من دلالة علائقية ومجازية وتوتر لاهوتي في السياق.
- source_word: ἐκ πορνείας
  choice: من زنى
  rationale: ترجمة موجزة وقريبة من العبارة اليونانية، وتحفظ صورتها الصريحة من غير أن تستبدل بها تفسير عدم شرعية النسب.
- source_word: οὐ γεγεννήμεθα
  choice: لم نُولَد
  rationale: صياغة عربية طبيعية للمبني للمجهول في هذا التعبير، وتؤدي دلالة الميلاد دون تكلف في نقل صيغة التام اليونانية.
- source_word: ἕνα πατέρα ἔχομεν
  choice: لنا أب واحد
  rationale: تركيب عربي فصيح وطبيعي يبرز وحدانية الأب كما يبرزها العدد ἕνα.
- source_word: τὸν θεόν
  choice: وهو الله
  rationale: توضح العبارة البدل أو التفسير في اليونانية بصورة طبيعية، أي إن الأب الواحد المقصود هو الله.
theological_decisions:
- issue: هل تُفسَّر عبارة «من زنى» في المتن بأنها إنكار لعدم شرعية النسب؟
  choice: إبقاء العبارة الحرفية «لم نُولَد من زنى» في المتن
  alternative: لسنا أولادًا غير شرعيين
  rationale: قد تتضمن العبارة اليونانية إنكارًا لعدم شرعية النسب وربما تحمل إيحاءً جدليًا، لكنها تصوغ الدعوى حرفيًا من جهة الولادة «من زنى». إبقاء الصورة الأصلية يصون الغموض والتوتر دون فرض تفسير واحد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «أبيكم» و«أب واحد» للمحافظة على تكرار صورة الأبوة، مع صياغة «وهو الله» لتبيين البدل بصورة عربية طبيعية.
