lexical_decisions:
- source_word: γνώσεσθε
  choice: ستعرفون
  rationale: صيغة مستقبل من γινώσκω، و«ستعرفون» هي المقابل العربي المباشر والطبيعي، مع إمكان أن يدل السياق على التدرج في المعرفة دون فرضه في المتن.
- source_word: ἀλήθειαν / ἀλήθεια
  choice: الحقَّ / الحقُّ
  rationale: وردت أداة التعريف في الموضعين، فحُفظ التعريف والتكرار البلاغي. و«الحق» أفصح وأشيع كتابيًا من «الحقيقة» في هذا السياق.
- source_word: ἐλευθερώσει
  choice: سيحرِّركم
  rationale: يحفظ الفعل العربي القوة السببية للفعل اليوناني وصيغة المستقبل، من غير تحديد نوع الحرية داخل المتن.
- source_word: ὑμᾶς
  choice: كم
  rationale: ضمير المخاطبين جمع في اليونانية، وتُظهره لاحقة الجمع العربية بوضوح.
- source_word: καὶ ... καὶ
  choice: و... و...
  rationale: حُفظ عطف الجملتين وتتابعهما كما في النص اليوناني، بصياغة عربية طبيعية.
theological_decisions:
- issue: طبيعة الحرية في قول «الحق سيحرركم»
  choice: إبقاء الحرية غير محددة في المتن
  alternative: سيحرركم الحق من الخطيئة
  rationale: الآية نفسها لا تذكر قيدًا للحرية، وإن كان السياق اللاحق يربطها بالتحرر من الخطيئة؛ لذلك تُترك العبارة على سعتها ويُذكر الارتباط السياقي في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كريمة. استُعمل «الحق» للمحافظة على الاصطلاح المألوف والتكرار، ووُضعت علامة الحاشية المعجمية بعد «الحق» المتصل بالفعل الذي تتناوله، وعلامة الحاشية السياقية بعد جملة التحرير.
