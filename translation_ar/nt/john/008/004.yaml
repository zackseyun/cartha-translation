lexical_decisions:
- source_word: λέγουσιν
  choice: قالوا
  rationale: فعل مضارع تاريخي في اليونانية، ونُقل بالماضي لسلامة السرد العربي.
- source_word: Διδάσκαλε
  choice: يا معلّم
  rationale: نداء مباشر بلقب يدل على التعليم، وصياغته طبيعية وفصيحة في العربية المعاصرة.
- source_word: κατείληπται
  choice: ضُبطت
  rationale: المبني للمجهول في صيغة التام يدل على وقوع الضبط مع بقاء أثره حاضرًا في الموقف؛ و«ضُبطت» تؤدي المعنى القضائي والسردي بإيجاز.
- source_word: ἐπαυτοφώρῳ
  choice: بالجرم المشهود
  rationale: تعبير اصطلاحي يدل على الإمساك بالشخص في أثناء ارتكاب الفعل نفسه؛ و«بالجرم المشهود» المقابل العربي الطبيعي لهذا السياق.
- source_word: μοιχευομένη
  choice: وهي تزني
  rationale: اسم فاعل مضارع يصف حال المرأة وقت ضبطها، فحُفظت دلالة التزامن بجملة حالية واضحة.
