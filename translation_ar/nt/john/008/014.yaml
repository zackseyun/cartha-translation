review_pass:
  verdict: revise
  source_fidelity: 'النص يحافظ على البنية الأساسية للآية: الجواب والقول، والقيد التنازلي، وصدق الشهادة المبني على معرفة يسوع بمصدره ووجهته، ثم المقابلة مع جهل المخاطَبين. كما يحافظ على التمييز الزمني بين «أتيت» و«آتي»، ويعرض قراءة SBLGNT ذات «أو/ولا» مع توثيق البديل النصي. غير أن «أشهد لنفسي» قد تُفهم في العربية على أنها شهادة لمصلحة النفس أو دفاعًا عنها، بينما περί ἐμαυτοῦ تعني الشهادة عن الذات/بشأن الذات.'
  naturalness: الصياغة فصيحة وواضحة إجمالًا. «وإن كنتُ» أيسر وأشيع في العربية المعاصرة الواضحة من «حتى إن كنتُ» في هذا التركيب التنازلي، و«أشهد عن نفسي» أدق وأقل التباسًا من «أشهد لنفسي».
  terminology: أُبقيت ألفاظ «أشهد/شهادتي/حق» لأنها تحفظ حقل الشهادة وتجنّب حصر ἀληθής في الصحة القانونية. ولا تُضاف دلالة صريحة على منشأ سماوي أو صياغة عقائدية ليست منطوقة في الآية.
  issues:
  - severity: medium
    issue: «أشهد لنفسي» قد توحي بالشهادة لصالح النفس بدل الشهادة عنها.
    rationale: التركيب اليوناني μαρτυρῶ περὶ ἐμαυτοῦ هو «أشهد عن نفسي/بشأن نفسي». وتزيل «عن نفسي» الالتباس العربي مع الحفاظ على المعنى دون توسع تفسيري.
  - severity: low
    issue: «حتى إن كنتُ» أقل سلاسة من «وإن كنتُ» في هذا القيد التنازلي.
    rationale: «وإن كنتُ» تؤدي قوة Κἂν («حتى لو/وإن») بوضوح وفصاحة معاصرة، من دون تغيير المعنى.
