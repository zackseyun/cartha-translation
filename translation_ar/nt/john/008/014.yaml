revisions:
- from: 'فأجابهم يسوع وقال: «حتى إن كنتُ أشهد لنفسي، فشهادتي حق، لأني أعرف من أين أتيت وإلى أين أذهب؛ أما أنتم فلا تعرفون من أين آتي، ولا إلى أين أذهب».[a]'
  to: 'فأجاب يسوع وقال لهم: «وإن كنتُ أشهد عن نفسي، فشهادتي حق، لأني أعرف من أين أتيت وإلى أين أذهب؛ أما أنتم فلا تعرفون من أين آتي، ولا إلى أين أذهب».[a]'
  rationale: التعديلان مقتصران على إزالة التباس محتمل في علاقة الشهادة بالذات، وتحسين سلاسة أداة الشرط التنازلية. أُبقيت صياغة الشهادة بأنها «حق»، والتمييز بين الماضي والمضارع، وقراءة النص الأساس «ولا إلى أين أذهب»، والحاشية الخاصة بقراءة «وإلى أين أذهب».
