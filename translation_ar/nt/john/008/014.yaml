source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτοῖς· Κἂν ἐγὼ μαρτυρῶ περὶ ἐμαυτοῦ, ἀληθής ἐστιν ἡ μαρτυρία μου, ὅτι οἶδα πόθεν ἦλθον καὶ ποῦ ὑπάγω· ὑμεῖς δὲ οὐκ οἴδατε πόθεν ἔρχομαι ⸀ἢ ποῦ ὑπάγω.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/014.yaml
  text: Jesus answered and said to them[a], “Even if I testify about myself, my testimony is true, because I know where I came from and where I am going[b]; but you do not know where I come from or where I am going.”
translation:
  language: ar
  text: 'فأجاب يسوع وقال لهم: «وإن كنتُ أشهد عن نفسي، فشهادتي حق، لأني أعرف من أين أتيت وإلى أين أذهب؛ أما أنتم فلا تعرفون من أين آتي، ولا إلى أين أذهب».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ بعض المخطوطات: «من أين آتي وإلى أين أذهب» بدلًا من «من أين آتي، ولا إلى أين أذهب».'
    reason: textual_variant
lexical_decisions:
- source_word: ἀπεκρίθη ... καὶ εἶπεν αὐτοῖς
  choice: فأجابهم يسوع وقال
  rationale: يحافظ على اقتران فعلي الإجابة والقول الشائع في أسلوب يوحنا، مع صياغة عربية طبيعية وإدماج ضمير المفعول في «أجابهم».
- source_word: Κἂν
  choice: حتى إن كنتُ
  rationale: ينقل القوة التنازلية للتركيب، إذ يفترض يسوع الحالة جدلًا من غير أن يقر ببطلان شهادته.
- source_word: μαρτυρῶ περὶ ἐμαυτοῦ
  choice: أشهد لنفسي
  rationale: «أشهد» يحفظ المجال القانوني المتكرر في السياق، و«لنفسي» تعبير عربي موجز يدل هنا على الشهادة عن الذات دون إضافة تفسير عقائدي.
- source_word: ἀληθής ἐστιν ἡ μαρτυρία μου
  choice: فشهادتي حق
  rationale: يحافظ على وصف الشهادة بأنها حقيقية، لا على مجرد صلاحيتها القانونية؛ و«حق» فصيحة وواضحة وتلائم لغة يوحنا عن الحق.
- source_word: ὅτι οἶδα
  choice: لأني أعرف
  rationale: ينقل ὅτι سببيةً، ويحفظ الادعاء المعرفي المباشر في οἶδα.
- source_word: πόθεν ἦλθον
  choice: من أين أتيت
  rationale: يحفظ دلالة المصدر أو المنشأ وصيغة الماضي في ἦλθον بصورة عربية مباشرة.
- source_word: ποῦ ὑπάγω
  choice: إلى أين أذهب
  rationale: يعبّر عن وجهة الرحيل المقصودة في الفعل ὑπάγω بصيغة عربية طبيعية، مع إظهار «إلى» التي تقتضيها العربية.
- source_word: ὑμεῖς δὲ οὐκ οἴδατε
  choice: أما أنتم فلا تعرفون
  rationale: يحفظ إبراز الضمير والمقابلة بين معرفة يسوع وعدم معرفتهم.
- source_word: πόθεν ἔρχομαι
  choice: من أين آتي
  rationale: يحفظ زمن المضارع في ἔρχομαι، مميزًا إياه عن الماضي «أتيت» في العبارة السابقة.
theological_decisions:
- issue: طبيعة شهادة يسوع لنفسه
  choice: وُصفت شهادته بأنها «حق» ومُسندة إلى معرفته بمنشئه ووجهته.
  alternative: صياغة قانونية أضيق مثل «شهادتي صحيحة قانونيًا»، أو صياغة ميتافيزيقية تصرّح بالأصل السماوي.
  rationale: النص نفسه يربط صدق الشهادة بمعرفة يسوع من أين أتى وإلى أين يذهب، من غير أن يصرّح هنا بتفصيل منشئه أو وجهته؛ لذلك تُترك الدلالة اللاهوتية الأوسع لسياق الإنجيل.
- issue: التفاوت النصي في أداة الربط قبل ποῦ ὑπάγω
  choice: 'اعتماد قراءة SBLGNT «ولا إلى أين أذهب» (ἢ: أو).'
  alternative: «ومن أين آتي وإلى أين أذهب» وفق قراءة καί في بعض الشواهد.
  rationale: تُرجمت قراءة النص اليوناني المحدد في الطلب، مع توثيق القراءة البديلة في الحاشية دون طمس التفاوت النصي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حوفظ على التوازي بين «أتيت» في الماضي و«آتي» في المضارع، وعلى مفردات الشهادة والحق ذات الصلة بالسياق القضائي في يوحنا، من غير إثقال العبارة بمصطلحات تخصصية.
