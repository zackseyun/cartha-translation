base_translation:
  language: en
  yaml_path: translation/nt/john/008/037.yaml
  text: I know that you are Abraham’s offspring[a]; but you are seeking to kill me[b], because my word has no place in you.
translation:
  language: ar
  text: أنا أعلم أنكم نسل إبراهيم[a]، لكنكم تسعون إلى قتلي، لأن كلامي لا يجد له موضعًا فيكم[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ذرية إبراهيم».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «لأن كلامي لا يتسع له صدركم»؛ وقد تحتمل العبارة أيضًا معنى أن كلامه لا يتقدم فيهم.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σπέρμα Ἀβραάμ
  choice: نسل إبراهيم
  rationale: «نسل» اسم جمع طبيعي في العربية يدل هنا على الانحدار الجسدي من إبراهيم، ويحافظ على الصيغة الجمعية المفردة في اليونانية من غير أن يستبق التمييز السياقي بين النسب الجسدي والبنوّة الحقيقية.
- source_word: ζητεῖτέ με ἀποκτεῖναι
  choice: تسعون إلى قتلي
  rationale: ينقل تركيب ζητέω مع المصدر معنى السعي إلى الفعل، ويحافظ على دلالة المضارع من غير أن يحصر العبارة في مجرد الرغبة أو يقرر مدى نجاح المحاولة.
- source_word: ὁ λόγος ὁ ἐμὸς
  choice: كلامي
  rationale: «كلامي» تعبير عربي واضح وطبيعي يحفظ صلة λόγος بما يقوله يسوع، من غير تسطيح الدلالة إلى «رسالتي» أو تحميل لفظ «كلمتي» إيحاءً اصطلاحيًا غير لازم هنا.
- source_word: οὐ χωρεῖ ἐν ὑμῖν
  choice: لا يجد له موضعًا فيكم
  rationale: يحفظ صورة χωρέω المتعلقة بوجود مجال أو موضع، ويُبقي مفتوحًا طيف الدلالة بين عدم القبول الداخلي وعدم إتاحة المجال للكلام.
- source_word: ἀλλὰ
  choice: لكن
  rationale: تُظهر بوضوح التضاد بين الإقرار بنسبهم إلى إبراهيم وسعيهم إلى قتل يسوع.
- source_word: οἶδα ὅτι
  choice: أنا أعلم أن
  rationale: ترجمة مباشرة تحافظ على جملة المضمون الصريحة، مع إثبات الضمير لإبراز النبرة التقابلية طبيعيًا في العربية.
theological_decisions:
- issue: العلاقة بين النسب الجسدي إلى إبراهيم والانسجام الحقيقي مع إبراهيم
  choice: 'ترجمة σπέρμα Ἀβραάμ ترجمة نسبية واضحة: «نسل إبراهيم».'
  alternative: «أبناء إبراهيم»
  rationale: يعترف يسوع هنا بنسب مخاطبيه الجسدي، بينما تكشف الآيات المحيطة التوتر بين هذا النسب وأعمالهم. «نسل» لا تستبق حسم هذا التوتر ولا تخلط النسب الجسدي بالبنوّة ذات الدلالة الأخلاقية أو الروحية.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. استُعمل «نسل» لصياغة موجزة مفهومة، و«لا يجد له موضعًا فيكم» للمحافظة على الاستعارة اليونانية وعلى غموضها الدلالي المشروع.
