  text: οὐκ ἔγνωσαν ὅτι τὸν πατέρα αὐτοῖς ἔλεγεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/027.yaml
  text: They did not understand that he was speaking to them about the Father[a].
translation:
  language: ar
  text: لم يفهموا أنه كان يكلّمهم عن الآب[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لم يعرفوا أنه كان يكلّمهم عن الآب».'
    reason: بديل معجمي ممكن للفعل اليوناني γινώσκω.
lexical_decisions:
- source_word: οὐκ ἔγνωσαν
  choice: لم يفهموا
  rationale: مع أن γινώσκω يعني في الأصل «يعرف»، فالسياق هنا يدل على أنهم لم يدركوا المقصود من كلام يسوع؛ لذا تنقل «لم يفهموا» المعنى بوضوح في العربية المعاصرة.
- source_word: ὅτι
  choice: أنه
  rationale: تُدخل جملة المضمون التي تبيّن ما لم يفهموه.
- source_word: τὸν πατέρα
  choice: الآب
  rationale: يشير التعبير في سياق إنجيل يوحنا إلى الله بوصفه أبا يسوع، و«الآب» هو المقابل العربي الطبيعي لهذا الاستعمال اللقبي.
- source_word: αὐτοῖς
  choice: يكلّمهم
  rationale: أُدمج معنى ضمير المجرور في الفعل العربي؛ فـ«يكلّمهم» ينقل طبيعيًا معنى أنه كان يتحدث إليهم.
- source_word: ἔλεγεν
  choice: كان يكلّم
  rationale: صيغة «كان يكلّم» تعبّر عن الجانب الاستمراري للفعل الناقص اليوناني، وهي طبيعية في هذا السياق.
theological_decisions:
- issue: مرجع «الآب»
  choice: كان يسوع يتحدث عن الله الآب.
  alternative: أن يكون المقصود أبًا بشريًا.
  rationale: يحدّد السياق اليوحناوي القريب «الآب» بوصفه لقبًا لله في علاقة يسوع به، من غير إضافة مضمون عقائدي غير مصرّح به في النص.
- issue: دلالة γινώσκω في السياق
  choice: «يفهموا»
  alternative: «يعرفوا» أو «يدركوا»
  rationale: المقصود أنهم لم يفهموا مرجع كلامه، لا مجرد أنهم كانوا يفتقرون إلى معلومة؛ وتبقى «يعرفوا» إمكانية معجمية صحيحة مثبتة في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدم «الآب» للدلالة السياقية على الله، وصيغة «كان يكلّمهم» للمحافظة على الاستمرار الذي تفيده صيغة الفعل اليوناني.
