id: JHN.8.12
reference: John 8:12
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Πάλιν οὖν αὐτοῖς ⸂ἐλάλησεν ὁ Ἰησοῦς⸃ λέγων· Ἐγώ εἰμι τὸ φῶς τοῦ κόσμου· ὁ ἀκολουθῶν ⸀ἐμοὶ οὐ μὴ περιπατήσῃ ἐν τῇ σκοτίᾳ, ἀλλ’ ἕξει τὸ φῶς τῆς ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/012.yaml
  text: So Jesus spoke to them again[a], saying, “I am the light of the world. The one who follows me will certainly not walk in the darkness[b], but will have the light of life.”
translation:
  language: ar
  text: 'فكلّمهم يسوع أيضًا قائلًا: «أنا نور العالم. من يتبعني لن يمشي أبدًا في الظلمة[a]، بل سيكون له نور الحياة[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يستعمل النص اليوناني صيغة نفي شديدة (οὐ μὴ)، ويمكن ترجمتها أيضًا: «لن يمشي في الظلمة البتة».'
    reason: lexical_alternative
  - marker: b
    text: يمكن أيضًا فهم «نور الحياة» بمعنى «النور الذي يمنح الحياة».
    reason: alternative_reading
lexical_decisions:
- source_word: Πάλιν οὖν
  choice: أيضًا، مع فاء الاستئناف في «فكلّمهم»
  rationale: «أيضًا» تنقل معنى تكرار الكلام في Πάλιν، والفاء تصل القول بسياقه من غير أن تجعل οὖν استنتاجًا منطقيًا أقوى مما يحتمل.
- source_word: ἐλάλησεν ... λέγων
  choice: كلّمهم ... قائلًا
  rationale: يحافظ هذا على فعل الكلام وعلى صيغة الحال التي تمهّد للاقتباس المباشر، بلغة عربية فصيحة واضحة.
- source_word: Ἐγώ εἰμι
  choice: أنا
  rationale: في الجملة الاسمية العربية تؤدي «أنا نور العالم» معنى العبارة اليونانية المرتبطة بخبر صريح، من غير إضافة تفسير لاهوتي إلى الصياغة.
- source_word: τὸ φῶς τοῦ κόσμου
  choice: نور العالم
  rationale: ترجمة مباشرة وطبيعية تحفظ صورة النور وعلاقة الإضافة.
- source_word: ὁ ἀκολουθῶν ἐμοὶ
  choice: من يتبعني
  rationale: «من» الموصولة تعبّر طبيعيًا عن المفرد التمثيلي العام الذي تفيده الصفة الموصولة اليونانية.
- source_word: οὐ μὴ περιπατήσῃ
  choice: لن يمشي أبدًا
  rationale: «لن ... أبدًا» تنقل النفي اليوناني المؤكد οὐ μὴ بوضوح، وتحافظ على استعارة السير.
- source_word: ἐν τῇ σκοτίᾳ
  choice: في الظلمة
  rationale: تحفظ العبارة صورة الوجود أو السير ضمن نطاق الظلمة، وهي صياغة عربية مألوفة.
- source_word: ἕξει
  choice: سيكون له
  rationale: صياغة عربية طبيعية لمعنى الامتلاك في المستقبل من غير إثقال العبارة.
- source_word: τὸ φῶς τῆς ζωῆς
  choice: نور الحياة
  rationale: تحفظ الإضافة الموجزة وما فيها من سعة دلالية، بدل حصرها في معنى «النور الذي يمنح الحياة».
theological_decisions:
- issue: دلالة تعريف يسوع نفسه في Ἐγώ εἰμι
  choice: «أنا نور العالم» من غير زيادة «هو» أو إحالة صريحة إلى الاسم الإلهي
  alternative: «أنا هو نور العالم»، أو صياغة مشددة تبرز صدى محتملًا لعبارات «أنا هو»
  rationale: العبارة هنا مرتبطة نحويًا بخبر هو «نور العالم». والصياغة المختارة تنقل المعنى المباشر وتترك أي صدى يوحناوي أوسع من غير أن تفرضه في الترجمة.
- issue: معنى «نور الحياة»
  choice: 'الإبقاء على الإضافة: «نور الحياة»'
  alternative: «النور الذي يمنح الحياة» أو «النور المحيي»
  rationale: يمكن أن تدل الإضافة على النور المرتبط بالحياة أو الصادر عنها أو المانح لها؛ لذا يحفظ التعبير الحرفي هذا الثراء والتوتر الدلالي.
translation_notes:
  register: العربية فصحى حديثة واضحة ومهيبة. حُفظت استعارتا النور والسير في الظلمة، ووُضعت علامتا الحاشيتين عند العبارتين اللتين تفسرهما الحاشيتان.
