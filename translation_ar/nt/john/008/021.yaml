  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Εἶπεν οὖν πάλιν ⸀αὐτοῖς· Ἐγὼ ὑπάγω καὶ ζητήσετέ με, καὶ ἐν τῇ ἁμαρτίᾳ ὑμῶν ἀποθανεῖσθε· ὅπου ἐγὼ ὑπάγω ὑμεῖς οὐ δύνασθε ἐλθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/021.yaml
  text: So he said to them again[a], “I am going away, and you will seek me, and you will die in your sin. Where I am going[c][b], you are not able to come.”
translation:
  language: ar
  text: 'فقال لهم مرة أخرى: «أنا ذاهب، وستطلبونني[a]، وستموتون في خطيئتكم[b]. وحيث أذهب أنا، لا تقدرون أن تأتوا[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «ستبحثون عني». يمكن أن يدل الفعل على البحث عن شخص، وقد يحمل في إنجيل يوحنا أيضًا معنى روحيًا أعمق.
    reason: lexical_alternative
  - marker: b
    text: جاءت «الخطيئة» في اليونانية بالمفرد. وتترجمها بعض الترجمات بالجمع، لكن المفرد قد يشدد على حالة مستمرة بدلًا من أفعال منفردة.
    reason: lexical_alternative
  - marker: c
    text: أو «لا تستطيعون أن تأتوا».
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: فـ
  rationale: تفيد مواصلة الحديث وربطه بما سبقه من غير أن تُثقِل العربية بأداة استنتاج أقوى مما يقتضيه السياق.
- source_word: πάλιν
  choice: أيضًا
  rationale: تنقل معنى التكرار بعبارة عربية طبيعية في سياق استئناف يسوع كلامه إليهم.
- source_word: Ἐγὼ ὑπάγω
  choice: أنا ماضٍ
  rationale: يحافظ الضمير الصريح على بروز «أنا»، وتنقل «ماضٍ» معنى الرحيل مع إبقاء وجهة الذهاب وما تنطوي عليه لاهوتيًا غير مصرّح بهما.
- source_word: ζητήσετέ με
  choice: ستطلبونني
  rationale: «تطلبونني» تحتمل البحث عن شخص، كما يمكن أن تحمل في سياق يوحنا دلالة أعمق، ولذلك لا تحصر المعنى في بحث مكاني محض.
- source_word: ἐν τῇ ἁμαρτίᾳ ὑμῶν
  choice: في خطيئتكم
  rationale: يحافظ على حرف الجر وعلى مفرد «الخطيئة» في اليونانية، بما يسمح بفهمها حالةً مستمرة من دون أن يشرح ذلك داخل النص.
- source_word: ἀποθανεῖσθε
  choice: ستموتون
  rationale: ينقل صيغة المستقبل بوضوح ومباشرة.
- source_word: ὅπου ἐγὼ ὑπάγω
  choice: حيث أمضي أنا
  rationale: يكرر فعل المضي كما في الأصل، ويضع الضمير بعد الفعل لإبراز المقابلة بين يسوع ومخاطبيه من غير تكلف.
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: لا تقدرون أن تأتوا
  rationale: يحافظ على عنصر القدرة الصريح في δύνασθε بدل اختزاله إلى مجرد نفي المجيء.
theological_decisions:
- issue: إفراد ἁμαρτίᾳ أو جمعها
  choice: في خطيئتكم
  alternative: في خطاياكم
  rationale: الأصل اليوناني مفرد، وقد يشير إلى حالة الخطيئة المستمرة لا إلى تعداد أفعال منفردة. إبقاء المفرد يصون هذا التوتر ولا يفرض تفسيرًا عقائديًا في المتن.
- issue: دلالة رحيل يسوع في ὑπάγω
  choice: أنا ماضٍ
  alternative: أنا ذاهب / أنا راحل
  rationale: «ماضٍ» تنقل معنى الذهاب والرحيل، لكنها لا تحدد في المتن هل المقصود الموت أو القيامة أو الرجوع إلى الآب، فتُبقي اتساع الدلالة اليوحناوية.
- issue: طبيعة عدم القدرة في οὐ δύνασθε ἐλθεῖν
  choice: لا تقدرون أن تأتوا
  alternative: لا تستطيعون أن تأتوا / لا يمكنكم أن تأتوا
  rationale: الصياغة تحافظ على تصريح الأصل بعدم القدرة، من غير أن تحسم في المتن هل منشؤها حالتهم الروحية أو اختلاف المصير أو معنى آخر يوضحه السياق.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت «ماضٍ» لصون نبرة الرحيل وتكرار الفعل، و«تطلبونني» لإبقاء الاحتمالين الحرفي والروحي، مع المحافظة على مفرد «الخطيئة» وعلى التعبير الصريح عن عدم القدرة.
