  footnotes:
  - marker: a
    text: 'أو: «إن شهادة شخصين صادقة». تستعمل اليونانية لفظًا عامًا للبشر أو الأشخاص؛ و«رجلين» صياغة قانونية تقليدية لشاهدين بشريين.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμῳ
  choice: شريعتكم
  rationale: تشير الكلمة هنا إلى المرجعية التشريعية والكتابية التي يحتج بها المخاطَبون. ولفظ «الشريعة» طبيعي في العربية ويحفظ هذا المعنى القانوني والكتابي.
- source_word: ὑμετέρῳ
  choice: ـكم
  rationale: أُبقي ضمير المخاطَبين كما في اليونانية للمحافظة على المسافة البلاغية في قول يسوع، من غير تشديد زائد مثل «شريعتكم أنتم».
- source_word: γέγραπται
  choice: مكتوب
  rationale: صيغة عربية مألوفة للاقتباس الكتابي، وتحفظ دلالة الصيغة اليونانية على أن المكتوب ثابت وقائم.
- source_word: δύο ἀνθρώπων
  choice: رجلين
  rationale: يحفظ هذا اللفظ الصياغة القانونية المذكرة في الأصل. وقد وُضّح في الحاشية أن التعبير يؤدي معنى شاهدين من البشر في هذا السياق.
- source_word: μαρτυρία
  choice: شهادة
  rationale: «شهادة» هي المقابل العربي الطبيعي في السياق القضائي، وتنسجم مع تركيب «شهادة رجلين».
- source_word: ἀληθής
  choice: صادقة
  rationale: تنقل المعنى المباشر «حقيقية/صادقة»، مع بقاء دلالة القبول أو الثبوت القانوني مفهومة من السياق دون استبدالها بتفسير.
- source_word: καὶ ... δὲ
  choice: بل ... أيضًا
  rationale: ينقل «بل» القوة الانتقالية الخفيفة لـ δέ في سياق المحاجّة، بينما تعبّر «أيضًا» عن καί، بصياغة عربية طبيعية.
theological_decisions:
- issue: القوة البلاغية لعبارة «شريعتكم»
  choice: الإبقاء على ضمير المخاطَبين في «شريعتكم».
  alternative: «الشريعة» أو «شريعتكم أنتم»
  rationale: الضمير وارد صراحة في الأصل ويحفظ توتر الخطاب، من غير أن يُفهم منه بالضرورة أن يسوع يرفض الشريعة، ومن غير إضافة توكيد لا يقتضيه النص.
- issue: دلالة ἀνθρώπων في القاعدة القانونية
  choice: «رجلين» في المتن مع حاشية تبيّن المعنى الأوسع.
  alternative: «شخصين» أو «إنسانين»
  rationale: يحفظ المتن الصياغة المذكرة في الأصل والتعبير القانوني التقليدي، بينما تمنع الحاشية فهم العبارة على أنها تقرير مقصود لحصر مفهوم الشاهد في الذكور.
- issue: معنى ἀληθής في السياق القضائي
  choice: «صادقة»
  alternative: «صحيحة» أو «مقبولة» أو «ثابتة»
  rationale: يحافظ هذا الاختيار على الدلالة اللفظية الأساسية، ولا يحسم التوتر بين صدق الشهادة في ظاهر العبارة وصحتها أو ثبوتها قانونيًا.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُخدمت «الشريعة» للمرجعية القانونية الكتابية، وحُفظ الإيجاز والبناء الجدلي للنص مع وضع النقطتين قبل مضمون المكتوب.
