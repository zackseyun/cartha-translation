  rationale: استُبدلت «أشياء» بـ«أمور» لملاءمة السياق، وأعيد ترتيب الشطر الأول إلى «أمور كثيرة بشأنكم أقولها وأحكم فيها» لرفع الالتباس مع المحافظة على أن الأمور المتعلقة بالمخاطَبين هي موضوع القول والحكم. وأُبقيت الإشارة الصريحة «هذه» وتعددها، ولم يُضف اسم «الآب» أو معنى الإدانة.
