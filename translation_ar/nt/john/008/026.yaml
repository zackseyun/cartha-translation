  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: πολλὰ ἔχω περὶ ὑμῶν λαλεῖν καὶ κρίνειν· ἀλλ’ ὁ πέμψας με ἀληθής ἐστιν, κἀγὼ ἃ ἤκουσα παρ’ αὐτοῦ ταῦτα ⸀λαλῶ εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/026.yaml
  text: I have many things to say and to judge concerning you[a]. But the one who sent me is true, and what I heard from him[b], these things I speak to the world.
translation:
  language: ar
  text: لديَّ أمور كثيرة بشأنكم أقولها وأحكم فيها[a]. لكنَّ الذي أرسلني صادق، والأمور التي سمعتها منه، هذه أقولها للعالم[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «عنكم».'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن صياغتها: «وما سمعته منه، فهذا أقوله للعالم». لكن اليونانية تستعمل صيغة الجمع وتكرر اسم الإشارة صراحةً للتوكيد: «الأمور التي سمعتها منه، هذه أقولها».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλὰ
  choice: أشياء كثيرة
  rationale: صفة جمع محايد مستعملة استعمال الاسم؛ وتحافظ «أشياء كثيرة» على معنى التعدد بعبارة عربية واضحة.
- source_word: περὶ ὑμῶν
  choice: بشأنكم
  rationale: تفيد περί مع المضاف إليه هنا المرجع أو الموضوع. و«بشأنكم» تلائم سياق القول والحكم من غير أن تحصر المعنى في الإدانة.
- source_word: λαλεῖν
  choice: أقولها
  rationale: يناسب «أقولها» التركيب العربي مع «أشياء كثيرة»، ويعبّر عن النطق بمضمون يتعلق بالمخاطَبين.
- source_word: κρίνειν
  choice: أحكم فيها
  rationale: يحافظ الفعل على المعنى الواسع لـ κρίνω، أي إصدار الحكم، ولا يضيّقه إلى معنى الإدانة وحدها.
- source_word: ὁ πέμψας με
  choice: الذي أرسلني
  rationale: ينقل اسم الفاعل المعرّف بوصفه عبارة موصولة، من غير إضافة «الآب» التي لا ترد صراحة في هذه الجملة.
- source_word: ἀληθής
  choice: صادق
  rationale: «صادق» وصف طبيعي للشخص في العربية، وينقل هنا معنى صدق المُرسِل وموثوقية ما يصدر عنه، مع بقاء الصدى الأوسع لمعنى الحق في السياق اليوحناوي.
- source_word: ἃ ἤκουσα παρ’ αὐτοῦ
  choice: الأمور التي سمعتها منه
  rationale: يحافظ على جمع اسم الموصول اليوناني وعلى كون المسموع مضمونًا تلقّاه المتكلم من المُرسِل.
- source_word: ταῦτα
  choice: هذه
  rationale: أُبقي اسم الإشارة الصريح الذي يستأنف «الأمور التي سمعتها» ويؤكدها، بدل حذفه طلبًا للسلاسة.
- source_word: λαλῶ
  choice: أقولها
  rationale: ينقل المضارع الحاضر، ويصلح في العربية لإعلان مضمون موجَّه إلى العالم.
- source_word: εἰς τὸν κόσμον
  choice: للعالم
  rationale: مع فعل القول تدل العبارة على جهة الخطاب وجمهوره؛ و«للعالم» صياغة عربية طبيعية تحافظ على هذا الاتجاه.
theological_decisions:
- issue: مرجع «الذي أرسلني»
  choice: الإبقاء على المرجع ضمنيًا كما في اليونانية
  alternative: لكن الآب الذي أرسلني صادق
  rationale: السياق يشير إلى الآب، لكن النص لا يسمّيه في هذه العبارة؛ لذلك لا تُضاف تسمية تفسيرية إلى المتن.
- issue: دلالة κρίνειν
  choice: أحكم
  alternative: أدين
  rationale: «أحكم» يحفظ المجال الدلالي الأوسع للفعل ولا يفرض أن المقصود هنا هو الإدانة تحديدًا.
- issue: دلالة ἀληθής في وصف المُرسِل
  choice: صادق
  alternative: حقّ / موثوق
  rationale: «صادق» أفصح وأطبع في وصف شخص بالعربية، ولا يحصر العبارة في مجرد الأصالة الوجودية ولا يوسّعها إلى مفهوم الأمانة بلفظ غير مطابق.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حافظت الصياغة على التوازي بين القول والحكم، وعلى اسم الإشارة المؤكد في الشطر الأخير، وتجنبت التصريح بمرجع المُرسِل أو تضييق معنى الحكم بما يتجاوز ألفاظ المصدر.
