  source_fidelity: 'المعنى العام منقول بأمانة: كثرة الأمور، والقول والحكم، والمُرسِل غير المسمّى، وصدقُه، وما سمعه المتكلم منه، والتكرار التوكيدي لاسم الإشارة، والخطاب الموجّه إلى العالم. لكن «أحكم فيها بشأنكم» تجعل «فيها» متعلقةً بالأمور على نحوٍ ملتبس، ولا تُظهر بوضوح أن «بشأنكم» نطاقٌ للقول والحكم كما في اليونانية.'
