source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Ἐγὼ δαιμόνιον οὐκ ἔχω, ἀλλὰ τιμῶ τὸν πατέρα μου, καὶ ὑμεῖς ἀτιμάζετέ με.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/049.yaml
  text: Jesus answered[a], “I do not have a demon, but I honor my Father, and you dishonor me.”
translation:
  language: ar
  text: 'أجاب يسوع: «ليس بي شيطان[a]، بل أنا أكرم أبي، وأنتم تهينونني».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بصياغة تفسيرية أكثر: «لست ممسوسًا بشيطان».'
    reason: بديل معجمي يوضح الدلالة الاصطلاحية المحتملة لعبارة δαιμόνιον οὐκ ἔχω.
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: أجاب
  rationale: فعل سردي مألوف في الحوار، وينقل معنى الاستجابة بوضوح وطبيعية.
- source_word: δαιμόνιον οὐκ ἔχω
  choice: ليس بي شيطان
  rationale: تعبير عربي طبيعي يحافظ على صورة الأصل، «لي/عندي شيطان»، من غير أن يحسمها إلى صياغة تفسيرية مثل «لست ممسوسًا بشيطان».
- source_word: τιμῶ
  choice: أكرم
  rationale: ينقل معنى إظهار الكرامة والتوقير، ويحافظ على التضاد مع ἀτιμάζω.
- source_word: τὸν πατέρα μου
  choice: أبي
  rationale: إضافة «أب» إلى ضمير المتكلم هي الصياغة العربية الطبيعية، والسياق اليوحناوي يوضح أن المقصود هو الله.
- source_word: ἀτιμάζετέ
  choice: تهينون
  rationale: يحفظ التضاد الدلالي المباشر بين الإكرام والإهانة، وهو أوضح من تعبيرات أطول مثل «لا تكرمونني».
- source_word: με
  choice: ني
  rationale: ضمير المفعول به أُلحق بالفعل وفق الأسلوب العربي الطبيعي.
- source_word: Ἐγὼ
  choice: أنا
  rationale: أُثبت الضمير المنفصل ليعكس توكيد الضمير الصريح في اليونانية ويبرز المقابلة مع «أنتم».
theological_decisions:
- issue: الإشارة إلى «أبي»
  choice: فُهمت في سياق يوحنا على أنها إشارة يسوع إلى الله أبيه، من غير إضافة لفظ «الله» إلى النص.
  alternative: فهمها إشارة أسرية عامة إلى أب بشري.
  rationale: السياق القريب والاستعمال اليوحناوي يحددان المرجع، بينما تحافظ الصياغة «أبي» على ألفاظ الأصل بلا توسع تفسيري.
- issue: معنى «ليس بي شيطان»
  choice: الإبقاء على التعبير المباشر القريب من تركيب «لا أملك شيطانًا».
  alternative: «لست ممسوسًا بشيطان».
  rationale: البديل يوضح المعنى الاصطلاحي المحتمل لكنه أكثر تفسيرًا، لذلك وُضع في الحاشية حفاظًا على توتر الصياغة الأصلية.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدم «ليس بي شيطان» لأنه أفصح وأطبع من «ليس عندي شيطان»، مع إبقاء الحاشية التفسيرية. وُضع marker الحاشية [a] في المتن كما هو مطلوب.
