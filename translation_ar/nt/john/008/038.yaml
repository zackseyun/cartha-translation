revisions:
- from: أَتَكَلَّمُ بِمَا رَأَيْتُهُ عِنْدَ الآبِ، وَأَنْتُمْ أَيْضًا تَفْعَلُونَ مَا سَمِعْتُمُوهُ مِنَ الأَبِ.[a]
  to: أَتَكَلَّمُ بِمَا رَأَيْتُهُ عِنْدَ الآبِ، وَأَنْتُمْ إِذًا تَفْعَلُونَ مَا سَمِعْتُمُوهُ مِنَ الأَبِ.[a]
  rationale: التعديل الضروري الوحيد في المتن هو نقل οὖν بـ«إذًا» بدل «أيضًا». ويحافظ النص المنقح على دلالة παρά مع الداتيف في «عند الآب»، وعلى دلالة المصدر في «من الأب»، وعلى الغموض المقصود للمرجع الثاني. كما عُدّلت الحاشية لتوافق المتن المنقح وتؤدي وظيفتها التفسيرية بدقة.
