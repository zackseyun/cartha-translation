  text: ⸂ἃ ἐγὼ⸃ ἑώρακα παρὰ τῷ ⸀πατρὶ λαλῶ· καὶ ὑμεῖς οὖν ⸂ἃ ἠκούσατε⸃ παρὰ ⸂τοῦ πατρὸς⸃ ποιεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/038.yaml
  text: I speak what I have seen with the Father[a], and you, then, do what you have heard from your father.
translation:
  language: ar
  text: أَتَكَلَّمُ بِمَا رَأَيْتُهُ عِنْدَ الآبِ، وَأَنْتُمْ إِذًا تَفْعَلُونَ مَا سَمِعْتُمُوهُ مِنَ الأَبِ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: لا يرد ضمير الملكية صراحةً مع «الأب» في اليونانية، لكن السياق يبيّن المقصود لاحقًا (انظر الآية 44).
    reason: توضيح أن العبارة الثانية تبقي مرجع «الأب» غير مصرّح به في هذه الآية، من غير إدخال «أبيكم» أو تعيينه في المتن.
lexical_decisions:
- source_word: ἃ
  choice: ما
  rationale: اسم موصول محايد جمع يؤدي معنى مضمون الكلام؛ و«ما» عربية طبيعية وتحفظ الدلالة من غير إطالة.
- source_word: ἑώρακα
  choice: رأيتُه
  rationale: صيغة التمام اليونانية تشير إلى رؤية سابقة باقية الصلة بالحاضر؛ والسياق العربي يكفل استمرار أثرها.
- source_word: παρὰ τῷ πατρὶ
  choice: عند الآب
  rationale: παρά مع المجرور بالداتيف يدل هنا على الحضور والقرب؛ و«عند الآب» أدق من تحويله إلى مجرد مصدر بـ«من الآب».
- source_word: λαλῶ
  choice: أتكلّم بما
  rationale: يحفظ معنى الكلام ومضمونه بتركيب عربي طبيعي قريب من المباشر اليوناني.
- source_word: οὖν
  choice: أيضًا
  rationale: تُقرأ οὖν هنا في سياق المقابلة والنتيجة بين فعل يسوع وفعل مخاطبيه؛ و«أيضًا» تنقل الصلة والموازاة طبيعيًا من غير تشديد منطقي زائد.
- source_word: ἠκούσατε
  choice: سمعتموه
  rationale: الماضي العربي مناسب للأوريست، والضمير العائد يصل الجملة الموصولة بوضوح.
- source_word: παρὰ τοῦ πατρὸς
  choice: من الأب
  rationale: παρά مع المضاف إليه يدل على المصدر. حُفظ تعريف «الأب» كما في النص اليوناني، من غير إضافة «أبيكم» التي ليست صريحة في هذه الآية.
- source_word: ποιεῖτε
  choice: تفعلون
  rationale: المضارع ينقل الفعل الجاري أو المميِّز لسلوك المخاطبين، ويحافظ على بساطة ποιεῖτε.
- source_word: πατήρ / πατρὸς
  choice: الآب / الأب
  rationale: «الآب» في الموضع الأول هو الاستعمال العربي المألوف لله في علاقة يسوع به، و«الأب» في الثاني يبقي المرجع أقل تصريحًا ويحفظ التباين البلاغي.
theological_decisions:
- issue: هوية «الأب» في العبارة الثانية
  choice: إبقاء «من الأب» بحسب الصياغة الصريحة للنص اليوناني
  alternative: من أبيكم؛ أو من إبليس
  rationale: الآية 44 ستصرّح بهوية أبي المخاطبين، أما هذه الآية فتترك المرجع ضمنيًا. عدم إدخال «أبيكم» أو «إبليس» يحفظ التدرج الجدلي والتوتر المقصود.
- issue: دلالة العبارة الأولى على علاقة يسوع بالآب
  choice: «عند الآب»
  alternative: «من الآب» أو «في حضرة الآب»
  rationale: الجار مع الداتيف يبرز الحضور والقرب لا مجرد مصدر المعلومة، من غير إضافة شرح عقائدي إلى النص.
translation_notes:
  register: عربية فصحى واضحة ومهيبة بتركيب مباشر. استُعمل «الآب» للإشارة إلى الله، و«الأب» في العبارة الثانية للمحافظة على الغموض البلاغي المقصود. وُضع ضبط جزئي في النص لتسهيل القراءة والتمييز.
