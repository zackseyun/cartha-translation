  text: εἶπον οὖν αὐτῷ οἱ Φαρισαῖοι· Σὺ περὶ σεαυτοῦ μαρτυρεῖς· ἡ μαρτυρία σου οὐκ ἔστιν ἀληθής.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/013.yaml
  text: So the Pharisees said to him, “You are testifying about yourself; your testimony is not true.”
translation:
  language: ar
  text: 'فقال له الفريسيون: «أنت تشهد عن نفسك؛ شهادتك ليست صادقة[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «شهادتك غير معتبرة». يقول اليوناني حرفيًا: «ليست صادقة»، وقد تحمل العبارة في هذا السياق أيضًا معنى عدم صحة الشهادة أو عدم اعتبارها قانونيًا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: فـ
  rationale: تفيد الفاء هنا استمرار الحوار ونتيجته المنطقية بصورة طبيعية وموجزة في العربية.
- source_word: εἶπον ... αὐτῷ οἱ Φαρισαῖοι
  choice: فقال له الفريسيون
  rationale: صياغة عربية طبيعية تحفظ الفعل الماضي، والضمير الصريح، والفاعل.
- source_word: Σὺ
  choice: أنت
  rationale: إثبات ضمير المخاطب مستقلًا يحفظ توكيد الضمير اليوناني الصريح.
- source_word: περὶ σεαυτοῦ
  choice: لنفسك
  rationale: تعبير عربي موجز وطبيعي يدل على أن الشهادة بشأن المتكلم ومن جانبه، من غير حصر المعنى في مصطلح قانوني تقني.
- source_word: μαρτυρεῖς
  choice: تشهد
  rationale: المضارع البسيط هو المقابل العربي الطبيعي، ويحفظ دلالة الشهادة وسياقها الإثباتي.
- source_word: ἡ μαρτυρία σου
  choice: شهادتك
  rationale: يحافظ على الاتساق الاشتقاقي مع «تشهد» وعلى البعد القضائي المحتمل.
- source_word: οὐκ ἔστιν ἀληθής
  choice: ليست صادقة
  rationale: ينقل المعنى المباشر للصفة ἀληθής، مع إبقاء احتمال دلالتها السياقية على صحة الشهادة أو اعتبارها.
theological_decisions:
- issue: طبيعة اعتراض الفريسيين على شهادة المرء لنفسه
  choice: شهادتك ليست صادقة
  alternative: شهادتك غير معتبرة
  rationale: للسياق طابع قضائي، لكن ἀληθής أوسع من مصطلح تقني يفيد القبول القانوني وحده؛ لذا تحافظ «صادقة» على التوتر بين صدق الشهادة وصحتها الاعتبارية.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة، بصياغة حوارية طبيعية، مع الحفاظ على التوكيد في «أنت» وعلى التكرار الاشتقاقي بين «تشهد» و«شهادتك».
