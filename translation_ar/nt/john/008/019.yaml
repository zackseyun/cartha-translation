  text: ἔλεγον οὖν αὐτῷ· Ποῦ ἐστιν ὁ πατήρ σου; ἀπεκρίθη Ἰησοῦς· Οὔτε ἐμὲ οἴδατε οὔτε τὸν πατέρα μου· εἰ ἐμὲ ᾔδειτε, καὶ τὸν πατέρα μου ⸂ἂν ᾔδειτε⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/019.yaml
  text: So they were saying to him[a], “Where is your Father?” Jesus answered, “You know neither me nor my Father. If you knew me, you would know my Father also.”
translation:
  language: ar
  text: 'فكانوا يقولون له: «أين أبوك؟» أجاب يسوع: «أنتم لا تعرفونني ولا تعرفون أبي. لو كنتم تعرفونني، لكنتم تعرفون أبي أيضًا».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ويجوز بصياغة أوجز: «لو عرفتموني، لعرفتم أبي أيضًا». تفيد صيغة الشرط اليونانية حالة مخالفة للواقع، ويرجح أن المقصود هو الحال الحاضر.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: فكانوا يقولون
  rationale: ينقل صيغة الماضي الناقص اليونانية بما يوحي باستمرار القول أو تكراره، من غير المبالغة التي قد تفيدها عبارة مثل «ظلّوا يقولون».
- source_word: οὖν
  choice: فـ
  rationale: تحفظ رابط الاستمرار أو الاستنتاج في السياق بأسلوب عربي طبيعي موجز.
- source_word: Ποῦ ἐστιν ὁ πατήρ σου;
  choice: أين أبوك؟
  rationale: ترجمة مباشرة وطبيعية للسؤال. ولفظ «أبوك» يحتمل في ظاهر كلام السائلين المعنى العائلي، فيما يكشف السياق أن يسوع يقصد الآب الإلهي.
- source_word: ἀπεκρίθη
  choice: أجاب
  rationale: الفعل العربي المألوف والمباشر لنقل جواب يسوع.
- source_word: Οὔτε ἐμὲ οἴδατε οὔτε τὸν πατέρα μου
  choice: أنتم لا تعرفونني ولا تعرفون أبي
  rationale: تكرار «تعرفون» يوضح تركيب النفي المزدوج في العربية ويحفظ التوازي بين عدم معرفة يسوع وعدم معرفة أبيه.
- source_word: οἶδατε / ᾔδειτε
  choice: تعرفون / كنتم تعرفون
  rationale: «عرف» أوسع وأطبع هنا من ألفاظ تحصر المعنى في الإدراك العقلي أو التمييز، كما يحفظ وحدة اللفظ عبر الجملتين.
- source_word: εἰ ἐμὲ ᾔδειτε, καὶ τὸν πατέρα μου ἂν ᾔδειτε
  choice: لو كنتم تعرفونني، لكنتم تعرفون أبي أيضًا
  rationale: هذا التركيب العربي يبرز أن الشرط مخالف للواقع ويتعلق بالحال الحاضر، ويحفظ دلالة καί بلفظ «أيضًا».
- source_word: πατήρ / πατέρα μου
  choice: أبوك / أبي
  rationale: يحفظ علاقة الأبوة كما يعرضها النص. ولا تملك العربية تمييز الحرف الكبير الذي تستعمله بعض اللغات للإشارة إلى اللقب الإلهي، لكن السياق يبيّن أن المقصود بأبي يسوع هو الله.
theological_decisions:
- issue: هوية أبي يسوع في السؤال والجواب
  choice: الإبقاء على «أبوك» و«أبي» من غير إضافة تفسيرية داخل النص
  alternative: أين الله أبوك؟ / أبي، الله
  rationale: السياق اليوحناوي يحدد المرجع الإلهي، لكن إضافة «الله» داخل الآية تزيل شيئًا من سوء فهم المتكلمين ومن المفارقة المقصودة.
- issue: دلالة معرفة يسوع ومعرفة الآب
  choice: استعمال «تعرفون» في الموضعين
  alternative: تدركون / تفهمون / تميّزون
  rationale: «تعرفون» تحفظ سعة الدلالة والعلاقة الوثيقة بين معرفة يسوع ومعرفة أبيه، من غير حصرها في الفهم الذهني أو مجرد التعرّف.
- issue: قوة جملة الشرط
  choice: صياغتها بوصفها حالة مخالفة للواقع في الحاضر
  alternative: صياغتها بوصفها معرفة ماضية لم تتحقق
  rationale: الماضي الناقص مع ἄν في هذا السياق يفيد على الأرجح حالة حاضرة مخالفة للواقع؛ لذلك لا تُفرض عليه دلالة ماضٍ منقطع.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة ومهيبة من غير تكلّف. استُعمل «فكانوا يقولون» للمحافظة على جانب الاستمرار في الفعل، ووُضع رمز الحاشية بعد جملة الشرط التي تشرحها الحاشية.
