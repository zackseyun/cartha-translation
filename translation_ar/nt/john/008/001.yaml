lexical_decisions:
- source_word: πορεύομαι
  choice: ذهب
  rationale: الفعل هنا، مع أنه بصيغة صرفية مبنية للمجهول، يُستعمل بمعنى معلوم ويدل ببساطة على الانتقال إلى وجهة.
- source_word: ὄρος
  choice: جبل
  rationale: الاسم يدل على جبل أو مرتفع، وهو هنا جزء من الاسم الجغرافي المألوف «جبل الزيتون».
- source_word: ἐλαία
  choice: الزيتون
  rationale: صيغة الجمع المضاف إليه تشير إلى أشجار الزيتون، ويقابلها في العربية الاسم الجغرافي الراسخ «جبل الزيتون».
- source_word: δέ
  choice: أمّا ... فـ
  rationale: تنقل الاستئناف المقابل في السياق السابق بصورة عربية طبيعية، إذ انصرف الآخرون إلى بيوتهم بينما ذهب يسوع إلى جبل الزيتون.
