  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: νῦν δὲ ζητεῖτέ με ἀποκτεῖναι, ἄνθρωπον ὃς τὴν ἀλήθειαν ὑμῖν λελάληκα ἣν ἤκουσα παρὰ τοῦ θεοῦ· τοῦτο Ἀβραὰμ οὐκ ἐποίησεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/040.yaml
  text: But now you are seeking to kill me, a man who has told you the truth that I heard from God. Abraham did not do this.
translation:
  language: ar
  text: أَمَّا الآنَ فَأَنْتُمْ تَسْعَوْنَ إِلَى قَتْلِي، وَأَنَا إِنْسَانٌ قَدْ قُلْتُ لَكُمُ الْحَقَّ الَّذِي سَمِعْتُهُ مِنَ اللهِ. هٰذَا لَمْ يَفْعَلْهُ إِبْرَاهِيمُ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν δὲ
  choice: أَمَّا الآنَ فَـ
  rationale: ينقل التعارض الذي تفيده δέ مع الدلالة الزمنية لـνῦν، ويهيئ للمقابلة مع سلوك إبراهيم بأسلوب عربي طبيعي.
- source_word: ζητεῖτέ με ἀποκτεῖναι
  choice: أَنْتُمْ تَسْعَوْنَ إِلَى قَتْلِي
  rationale: يحفظ معنى القصد والمحاولة المستمرة في الفعل المضارع مع المصدر، من غير إضافة الحكم القانوني أو الأخلاقي الذي قد توحي به كلمة «اغتيالي» أو «قتلي ظلمًا».
- source_word: ἄνθρωπον
  choice: وَأَنَا إِنْسَانٌ
  rationale: «إنسان» هو المقابل العربي المباشر والطبيعي هنا، ويصرح ببشرية المتكلم دون أن يتجاوز ما يقوله النص أو ينفي أبعادًا لاهوتية أخرى.
- source_word: τὴν ἀλήθειαν
  choice: الْحَقَّ
  rationale: يحفظ التعريف والتوكيد اليوحناوي على مضمون محدد هو الحق.
- source_word: ὑμῖν λελάληκα
  choice: قَدْ قُلْتُ لَكُمُ
  rationale: «قد قلت» تنقل الفعل التام بوصفه كلامًا وقع وبقيت صلته بالحاضر، وهي أفصح في هذا التركيب من الترجمة الحرفية «تكلمت لكم».
- source_word: ἣν ἤκουσα παρὰ τοῦ θεοῦ
  choice: الَّذِي سَمِعْتُهُ مِنَ اللهِ
  rationale: «من الله» تنقل παρά مع المضاف إليه باعتبار الله مصدر ما سمعه، من غير تخصيص زائد مثل «من الآب».
- source_word: τοῦτο Ἀβραὰμ οὐκ ἐποίησεν
  choice: هٰذَا لَمْ يَفْعَلْهُ إِبْرَاهِيمُ
  rationale: يبقي اسم الإشارة وصلته بالفعل السابق ويحفظ المقابلة الصريحة مع سلوك إبراهيم دون تفسير «هذا» تفسيرًا أضيق.
theological_decisions:
- issue: وصف يسوع نفسه بلفظ ἄνθρωπον
  choice: وَأَنَا إِنْسَانٌ
  alternative: أنا رجل
  rationale: «إنسان» يحفظ الدلالة الصريحة على بشرية يسوع، وهو أنسب في العربية الفصحى لهذا التصريح الذاتي، من غير أن يُدخل نفيًا لألوهيته أو تقريرًا يتجاوز العبارة.
- issue: مصدر الحق في عبارة παρὰ τοῦ θεοῦ
  choice: مِنَ اللهِ
  alternative: من الآب
  rationale: النص اليوناني يقول «الله» لا «الآب»، ولذلك تُحفظ تسمية النص ولا يُستورد لقب لاهوتي أخص من السياق الأوسع.
- issue: مرجع اسم الإشارة τοῦτο
  choice: هٰذَا لَمْ يَفْعَلْهُ إِبْرَاهِيمُ
  alternative: لم يحاول إبراهيم أن يقتل من أخبره بالحق
  rationale: إبقاء «هذا» يحفظ الإيجاز وإمكان الإحالة إلى السعي لقتل يسوع أو إلى مجمل السلوك الموصوف، بدل حسم المرجع بتفسير موسع.
translation_notes:
  register: عربية فصحى واضحة وكريمة، مع تشكيل جزئي/كامل على النص لتيسير القراءة. اختير «تسعون إلى قتلي» لإبراز القصد المستمر، و«قد قلت لكم» لنقل الأثر الحاضر للفعل التام. لا توجد حواشٍ لازمة في هذه الآية.
