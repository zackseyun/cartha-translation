source:
  edition: SBLGNT
  text: εἶπεν ⸀οὖν ὁ Ἰησοῦς· Ὅταν ὑψώσητε τὸν υἱὸν τοῦ ἀνθρώπου, τότε γνώσεσθε ὅτι ἐγώ εἰμι, καὶ ἀπ’ ἐμαυτοῦ ποιῶ οὐδέν, ἀλλὰ καθὼς ἐδίδαξέν με ὁ ⸀πατὴρ ταῦτα λαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/028.yaml
  text: So Jesus said[a], “When you lift up the Son of Man, then you will know that I am he, and that I do nothing from myself, but just as the Father taught me[b], I speak these things.”
translation:
  language: ar
  text: 'فقال يسوع: «متى رفعتم[b] ابن الإنسان، فعندئذ ستعرفون أني أنا هو[a]، وأنني لا أفعل شيئًا من عندي، بل أقول هذه الأمور كما علّمني الآب».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'العبارة اليونانية: «أنا هو» (ἐγώ εἰμι)، من غير خبرٍ مُصرَّح به؛ ويمكن أن تُترجم أيضًا: «أنا هو» أو «أنا الكائن».'
    reason: alternative_reading
  - marker: b
    text: يمكن أن يشير «رفعتم» إلى الرفع الحسي، ولا سيما على الصليب، وإلى الرفعة أو التمجيد أيضًا في استعمال يوحنا.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: فـ
  rationale: تفيد مواصلة الحديث والنتيجة السياقية بخفة وطبيعية، من غير تحميل الرابط قوة استنتاجية زائدة.
- source_word: Ὅταν
  choice: متى
  rationale: تدل هنا على حدث مستقبل محدد، وتنسجم مع استعمال الفعل الماضي بعد أداة الشرط للدلالة على المستقبل.
- source_word: ὑψώσητε
  choice: رفعتم
  rationale: 'تحفظ المعنى المزدوج في إنجيل يوحنا: الرفع الحسي، ولا سيما على الصليب، والرفعة أو التمجيد، من غير حصر اللفظ في أحدهما.'
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: ابن الإنسان
  rationale: الترجمة العربية الراسخة لهذا اللقب، وتحفظ أصداءه الكتابية ووظيفته بوصفه تسمية يستعملها يسوع عن نفسه.
- source_word: γνώσεσθε
  choice: ستعرفون
  rationale: تنقل الإدراك المستقبلي بوضوح، ويمكن أن يتضمن السياق معنى التوصل إلى المعرفة أو التحقق.
- source_word: ἐγώ εἰμι
  choice: أني أنا هو
  rationale: صياغة عربية مفهومة تحافظ على العبارة المقتضبة والمهيبة من غير إضافة خبر يحدد معناها؛ وتوضح الحاشية أن اليونانية لا تصرح بخبر.
- source_word: ἀπ’ ἐμαυτοῦ
  choice: من عندي
  rationale: تعبير عربي طبيعي يدل على أن المصدر أو المبادرة ليست مستقلة من ذات المتكلم.
- source_word: ποιῶ οὐδέν
  choice: لا أفعل شيئًا
  rationale: يحفظ النفي المطلق وصيغة الحاضر الدالة على حقيقة عامة.
- source_word: καθὼς ἐδίδαξέν με ὁ πατήρ
  choice: كما علّمني الآب
  rationale: تنقل المطابقة التي تفيدها καθώς، مع استعمال «الآب» بوصفه التعبير الطبيعي في السياق اليوحناوي.
- source_word: ταῦτα λαλῶ
  choice: أقول هذه الأمور
  rationale: يحفظ اسم الإشارة ومضمون فعل الكلام، مع صياغة عربية أوضح وأطبع من «أتكلم هذه الأمور».
theological_decisions:
- issue: دلالة العبارة المقتضبة ἐγώ εἰμι
  choice: أني أنا هو
  alternative: أني أنا كائن
  rationale: النص اليوناني لا يذكر خبرًا صريحًا، وقد تحمل العبارة في يوحنا صدى لاهوتيًا من غير أن تحسمه القواعد وحدها. لذلك أبقى المتن الصياغة العربية المقتضبة، وتشرح الحاشية بنيتها بدل تحويلها إلى تصريح عقائدي أكثر تحديدًا.
- issue: المعنى المزدوج للفعل ὑψόω
  choice: رفعتم
  alternative: صلبتم / مجّدتم
  rationale: يمكن أن يشير اللفظ إلى رفع يسوع على الصليب وإلى رفعته أو تمجيده في آن واحد؛ لذلك تُحفظ الكلمة الأوسع ولا يُختزل معناها في تفسير واحد.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة ومهيبة. استُعملت «فقال» للربط السردي الطبيعي، و«متى رفعتم» لحدث مستقبل محدد، مع إبقاء غموض «أنا هو» والمعنى المزدوج لـ«رفعتم» ظاهرين في المتن والحواشي.
