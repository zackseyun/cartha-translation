  text: ὁ ὢν ἐκ τοῦ θεοῦ τὰ ῥήματα τοῦ θεοῦ ἀκούει· διὰ τοῦτο ὑμεῖς οὐκ ἀκούετε ὅτι ἐκ τοῦ θεοῦ οὐκ ἐστέ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/047.yaml
  text: The one who is from God hears the words of God[a]. For this reason you do not hear[b], because you are not from God.
translation:
  language: ar
  text: مَنْ كان مِنَ الله يسمع كلمات الله. ولهذا أنتم لا تسمعون، لأنكم لستم مِنَ الله.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا فهم أداة الربط اليونانية ὅτι بمعنى «أنَّ» بدل «لأنَّ»، فتكون العبارة: «ولهذا لا تسمعون أنكم لستم مِنَ الله». لكن المعنى السببي «لأنكم» أنسب للسياق.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ὢν
  choice: مَنْ كان
  rationale: يؤدي تركيب أداة التعريف مع اسم الفاعل معنى الشخص المنتمي إلى هذه الفئة، وصيغة «مَنْ كان» عربية طبيعية وتحفظ عموم الوصف.
- source_word: ἐκ τοῦ θεοῦ
  choice: مِنَ الله
  rationale: حرف الجر ἐκ يدل هنا على المصدر أو المنشأ، وتعبير «مِنَ الله» يحفظ هذا المعنى والتقابل اليوحناوي من غير تفسير عقائدي زائد.
- source_word: τὰ ῥήματα τοῦ θεοῦ
  choice: كلام الله
  rationale: «كلام» اسم جنس عربي فصيح وطبيعي يمكن أن يدل على الأقوال والكلمات، ويجنب ثقل «كلمات الله» مع بقاء المعنى المقصود من الجمع اليوناني.
- source_word: ἀκούει / ἀκούετε
  choice: يسمع / تسمعون
  rationale: يحفظ التكرار اللفظي في اليونانية والمعنى الأساسي للفعل، مع بقاء دلالة الإصغاء والاستجابة مفهومة من السياق دون تحويلها صراحة إلى «يطيع».
- source_word: διὰ τοῦτο
  choice: ولهذا
  rationale: تعبير عربي واضح يؤدي القوة الاستنتاجية أو التفسيرية للعبارة اليونانية.
- source_word: ὑμεῖς
  choice: أنتم
  rationale: إثبات الضمير المنفصل ينقل التأكيد الموجود في الضمير اليوناني الصريح.
- source_word: ὅτι
  choice: لأنكم
  rationale: 'فُهمت ὅτι سببية، وهو الأنسب لتدفق الحجة في السياق: عدم سماعهم ناشئ عن كونهم ليسوا من الله.'
- source_word: ἐκ τοῦ θεοῦ οὐκ ἐστέ
  choice: لستم مِنَ الله
  rationale: يحفظ التعبير عن المصدر أو المنشأ والتقابل المباشر مع صدر الآية من غير حصره في تصنيف لاهوتي لاحق.
theological_decisions:
- issue: معنى كون الإنسان «مِنَ الله»
  choice: 'الإبقاء على لغة المصدر أو المنشأ: «مِنَ الله»'
  alternative: «تابعًا لله» أو تفسيرها صراحة بالولادة من الله أو الاختيار
  rationale: النص نفسه يستعمل لغة المصدر، والترجمة تحافظ على توترها اللاهوتي من غير اختزالها في مذهب محدد.
- issue: قوة الفعل ἀκούω
  choice: «يسمع»
  alternative: «يصغي» أو «يطيع»
  rationale: قد يتضمن السماع في السياق القبول والاستجابة، لكن «يسمع» هو المقابل المعجمي المباشر ويحفظ التكرار المقصود.
- issue: دلالة ὅτι
  choice: 'سببية: «لأنكم»'
  alternative: 'تقريرية: «أنكم لستم من الله»'
  rationale: القراءة السببية أوضح في السياق وتفسر عدم السماع، مع إثبات البديل الممكن في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدم «مَنْ كان» بدل الصياغة الأثقل «الذي يكون»، وأُثبت «أنتم» لنقل توكيد الضمير اليوناني. وُضع مؤشر الحاشية بعد الجملة التي تتعلق بها القراءة البديلة.
