  text: ⸀εἶπεν αὐτοῖς ὁ Ἰησοῦς· Εἰ ὁ θεὸς πατὴρ ὑμῶν ἦν ἠγαπᾶτε ἂν ἐμέ, ἐγὼ γὰρ ἐκ τοῦ θεοῦ ἐξῆλθον καὶ ἥκω· οὐδὲ γὰρ ἀπ’ ἐμαυτοῦ ἐλήλυθα, ἀλλ’ ἐκεῖνός με ἀπέστειλεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/042.yaml
  text: Jesus said to them[a], “If God were your Father, you would love me, because I came from God and am here. For I have not come from myself[b], but he sent me.”
translation:
  language: ar
  text: 'قال لهم يسوع: «لو كان الله أباكم لأحببتموني، لأني خرجت من عند الله وها أنا هنا[a]. فما جئت من تلقاء نفسي[b]، بل هو أرسلني».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو بصياغة أكثر حرفية: «صدرت من الله وقد جئت». ويمكن أن تفيد العبارة أيضًا: «خرجت من عند الله وأتيت».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «ما جئت من نفسي». يمكن أن يركز الأصل اليوناني على المصدر أو على عدم التصرف بمبادرة مستقلة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ ... ἦν ... ἠγαπᾶτε ἂν
  choice: لو كان الله أباكم لأحببتموني
  rationale: تفيد صيغة الشرط مع الماضي وἄν شرطًا مخالفًا للواقع؛ وتنقل «لو... لَـ» هذا المعنى بوضوح في العربية.
- source_word: ἐκ τοῦ θεοῦ ἐξῆλθον
  choice: خرجت من عند الله
  rationale: يحفظ تعبير الخروج مع دلالة المنشأ الإلهي، من غير إدخال مصطلح لاهوتي تقني لاحق.
- source_word: καὶ ἥκω
  choice: وأتيت
  rationale: يعبر عن المجيء والوصول، ويستقيم طبيعيًا بعد «خرجت من عند الله»؛ وتوضح الحاشية إمكان إبراز النتيجة الحاضرة.
- source_word: οὐδὲ γὰρ ἀπ’ ἐμαυτοῦ ἐλήλυθα
  choice: فما جئت من تلقاء نفسي
  rationale: تعبير عربي طبيعي ينفي المبادرة والاستقلال الذاتي، مع إبقاء احتمال دلالة المصدر في الحاشية.
- source_word: ἀλλ’ ἐκεῖνός με ἀπέστειλεν
  choice: بل هو أرسلني
  rationale: الضمير المنفصل «هو» يحفظ توكيد ἐκεῖνος، و«أرسلني» تنقل لغة الإرسالية مباشرة.
theological_decisions:
- issue: صياغة منشأ يسوع من الله من غير زيادة تحديد عقائدي لاحق
  choice: خرجت من عند الله وأتيت
  alternative: صدرت من الله وقد جئت
  rationale: يحفظ النص دعوى المنشأ الإلهي والإرسالية بألفاظ المجيء والخروج العادية في اليونانية، ولا يحولها إلى مصطلح عقائدي تقني؛ ويُذكر البديل الأكثر حرفية في الحاشية.
- issue: دلالة ἀπ’ ἐμαυτοῦ بين المصدر والمبادرة المستقلة
  choice: ما جئت من تلقاء نفسي
  alternative: ما جئت من نفسي
  rationale: الصياغة المختارة طبيعية وتبرز نفي المبادرة الذاتية، بينما تحفظ الحاشية دلالة المصدر الممكنة والتوازي مع «من عند الله».
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كريمة. استُعمل «لو... لأحببتموني» لإظهار الشرط المخالف للواقع، و«من تلقاء نفسي» للطبيعية، مع حفظ الاحتمالات الدلالية الأصلية في الحواشي.
