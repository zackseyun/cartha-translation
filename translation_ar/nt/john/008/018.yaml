  text: ἐγώ εἰμι ὁ μαρτυρῶν περὶ ἐμαυτοῦ καὶ μαρτυρεῖ περὶ ἐμοῦ ὁ πέμψας με πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/018.yaml
  text: I am the one who testifies about myself[a], and the Father who sent me testifies about me.
translation:
  language: ar
  text: أنا الذي أشهد عن نفسي[a]، والآب الذي أرسلني يشهد عني.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أؤدي الشهادة عن نفسي ... يؤدي الشهادة عني».'
    reason: بديل لفظي يبرز معنى أداء الشهادة الكامن في الفعل اليوناني، مع بقاء «يشهد» أوجز وأطبع في العربية.
lexical_decisions:
- source_word: ἐγώ εἰμι ὁ μαρτυρῶν
  choice: أنا الذي أشهد
  rationale: تؤدي «أنا الذي» وظيفة التركيب اليوناني الذي يعرّف المتكلم بأنه صاحب الشهادة، بصياغة عربية طبيعية، من غير تحميل «ἐγώ εἰμι» هنا دلالة مطلقة لأن الخبر مذكور صراحة.
- source_word: μαρτυρῶν / μαρτυρεῖ
  choice: أشهد / يشهد
  rationale: يحافظ الفعل «يشهد» على التكرار اللفظي وعلى الطابع القانوني والشهادي للفعل اليوناني μαρτυρέω، وهو واضح وشائع في العربية المعاصرة.
- source_word: περὶ ἐμαυτοῦ / περὶ ἐμοῦ
  choice: عن نفسي / عني
  rationale: تفيد περί مع المضاف إليه هنا معنى الكلام أو الشهادة بشأن شخص. وتحافظ «عن» على هذا المعنى من غير أن تحوّله إلى «لمصلحتي» أو «نيابةً عني».
- source_word: ὁ πέμψας με πατήρ
  choice: الآب الذي أرسلني
  rationale: تنقل العبارة اسم «الآب» مع اسم الفاعل اليوناني في صورة جملة صلة عربية، ولا تضيف «أبي» أو «الله الآب» إذ لا يرد أي منهما صراحة في النص.
theological_decisions:
- issue: هوية «الآب» وعلاقته بيسوع
  choice: الآب الذي أرسلني
  alternative: أبي الذي أرسلني؛ الله الآب الذي أرسلني
  rationale: يبقي النص على التسمية العلاقية كما وردت في اليونانية، من غير توسع عقائدي أو إضافة ضمير ملكية غير مصرح به.
- issue: القوة القانونية والتكرار في لغة الشهادة
  choice: أشهد ... يشهد
  alternative: أؤدي الشهادة ... يؤدي الشهادة
  rationale: يحفظ اختيار جذر واحد في الموضعين ترابط حجة الشاهدين في السياق، مع إبقاء العبارة طبيعية ومفهومة.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. قُدِّم «الآب الذي أرسلني» على فعله في الشطر الثاني للمحافظة على وضوح هوية الشاهد الثاني وموازاة الشطر الأول.
