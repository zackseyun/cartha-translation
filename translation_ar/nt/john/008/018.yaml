  source_fidelity: 'النص العربي ينقل بدقة بنية الأصل اليوناني ومعناه: «أنا الذي أشهد عن نفسي» يقابل ἐγώ εἰμι ὁ μαρτυρῶν περὶ ἐμαυτοῦ، و«الآب الذي أرسلني يشهد عني» يقابل καὶ μαρτυρεῖ περὶ ἐμοῦ ὁ πέμψας με πατήρ. كما يحافظ على تكرار فعل الشهادة وعلى التمييز بين «نفسي» و«عني».'
