base_translation:
  language: en
  yaml_path: translation/nt/john/008/023.yaml
  text: And he was saying to them[a], “You are from below; I am from above. You are from this world[b]; I am not from this world.”
translation:
  language: ar
  text: 'وكان يقول لهم: «أنتم من أسفل[a]، أما أنا فمن فوق. أنتم من هذا العالم[b]، أما أنا فلست من هذا العالم».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أنتم مما هو أسفل، أما أنا فمما هو فوق».'
    reason: lexical_alternative
  - marker: b
    text: كثيرًا ما يدل «العالم» في إنجيل يوحنا لا على الأرض المادية فحسب، بل أيضًا على النظام البشري في انفصاله عن الله.
    reason: cultural_note
lexical_decisions:
- source_word: ἔλεγεν
  choice: كان يقول
  rationale: ينقل صيغة الماضي الناقص في اليونانية، بما تحتمله من فعل مستمر في سياق الحديث، ويظل تعبيرًا عربيًا طبيعيًا.
- source_word: Ὑμεῖς / ἐγώ
  choice: أنتم / أنا
  rationale: أُبقي الضميران الظاهران لأن ورودهما في اليونانية يؤكد المقابلة الحادة بين المخاطَبين ويسوع؛ واستُعملت «أما» لتجري المقابلة بوضوح وطبيعية في العربية.
- source_word: ἐκ τῶν κάτω
  choice: من أسفل
  rationale: يحافظ على صورة الاتجاه المكاني وعلى دلالة المصدر أو المنشأ من غير تحويلها إلى تفسير أخلاقي أو عقائدي صريح.
- source_word: ἐκ τῶν ἄνω
  choice: من فوق
  rationale: يقابل «من أسفل» مقابلة مباشرة، ويحفظ الصورة الرأسية المميزة لهذا القول دون إضافة «السماء» التي لا يذكرها النص صراحة.
- source_word: κόσμος
  choice: العالم
  rationale: هو المقابل العربي الواسع والمألوف للكلمة، ويحفظ إمكان دلالتها في يوحنا على النظام البشري المنفصل عن الله، لا على الأرض المادية وحدها.
- source_word: τούτου τοῦ κόσμου / τοῦ κόσμου τούτου
  choice: هذا العالم
  rationale: يحفظ اسم الإشارة في الموضعين ويعبّر طبيعيًا عن المجال الذي ينتمي إليه المخاطَبون والذي ينفي يسوع أن يكون مصدره منه.
- source_word: οὐκ εἰμὶ ἐκ τοῦ κόσμου τούτου
  choice: لست من هذا العالم
  rationale: يحافظ على تركيب ἐκ المتكرر وعلى معنى المصدر أو المنشأ، بدل أن يحصره في معنى الانتماء وحده.
theological_decisions:
- issue: دلالة المقابلة بين «من أسفل/من فوق» و«هذا العالم»
  choice: الإبقاء على لغة المصدر والمجال كما هي، من غير بسطها في شرح عقائدي داخل المتن.
  alternative: التصريح بالمقابلة على أنها أخلاقية، أو استبدال «من فوق» بعبارة مثل «من السماء».
  rationale: تجمع العبارة بين صورة مكانية ودلالة لاهوتية، لكن النص لا يفصّلها هنا؛ لذلك تحفظ الصياغة التوتر اليوحناوي والتمييز المتعلق بهوية يسوع من غير تضييق المعنى.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعملت «أما» لإبراز المقابلة التي تؤكدها الضمائر اليونانية، مع الحفاظ على التوازي والتكرار في بنية الآية.
