base_translation:
  language: en
  yaml_path: translation/nt/john/008/039.yaml
  text: They answered and said to him[a], “Abraham is our father.” Jesus says to them, “If you are Abraham’s children, you would be doing Abraham’s works.”
translation:
  language: ar
  text: 'فَأَجَابُوهُ وَقَالُوا لَهُ: «أَبْرَاهِيمُ هُوَ أَبُونَا». فَقَالَ لَهُمْ يَسُوعُ: «إِنْ كُنْتُمْ أَوْلَادَ أَبْرَاهِيمَ، لَكُنْتُمْ تَعْمَلُونَ أَعْمَالَ أَبْرَاهِيمَ».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لَوْ كُنْتُمْ أَوْلَادَ أَبْرَاهِيمَ، لَعَمِلْتُمْ أَعْمَالَ أَبْرَاهِيمَ». يمكن فهم صيغة الماضي الناقص في اليونانية على أنها تدل على شرط مخالف للواقع.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπεκρίθησαν καὶ εἶπαν αὐτῷ
  choice: فَأَجَابُوهُ وَقَالُوا لَهُ
  rationale: يحفظ الفعلين في الصياغة اليوحنّاوية، مع التعبير طبيعيًا عن كون الجواب موجَّهًا إلى يسوع.
- source_word: Ὁ πατὴρ ἡμῶν Ἀβραάμ ἐστιν
  choice: أَبْرَاهِيمُ هُوَ أَبُونَا
  rationale: صياغة عربية واضحة تحفظ توكيد انتسابهم إلى إبراهيم، ويؤدي الضمير «هو» وظيفة الفصل والتوكيد.
- source_word: λέγει αὐτοῖς ὁ Ἰησοῦς
  choice: فَقَالَ لَهُمْ يَسُوعُ
  rationale: نُقل الحاضر التاريخي اليوناني بالماضي العربي لأنه الأسلوب الطبيعي في السرد العربي، من غير تغيير في تسلسل الخطاب.
- source_word: τέκνα τοῦ Ἀβραάμ
  choice: أَوْلَادَ أَبْرَاهِيمَ
  rationale: «أولاد» تشمل الذكور والإناث وتحفظ معنى العلاقة البنوية، ولا تحصر العبارة في النسب الذكوري.
- source_word: τὰ ἔργα τοῦ Ἀβραὰμ
  choice: أَعْمَالَ أَبْرَاهِيمَ
  rationale: تحفظ اللفظة المحورية «أعمال» والتقابل بين ادعاء البنوة والسلوك الفعلي، بدل اختزالها إلى «ما فعله».
- source_word: ἐποιεῖτε
  choice: لَكُنْتُمْ تَعْمَلُونَ
  rationale: تعكس الصيغة الناقصة معنى الفعل المستمر في جواب الشرط، كما تنقل الدلالة المخالفة للواقع التي يرجحها السياق، من غير جعلها تقريرًا حاضرًا بسيطًا.
theological_decisions:
- issue: طبيعة البنوة لإبراهيم في جواب يسوع
  choice: الإبقاء على لغة البنوة والعلاقة كما وردت، مع بيان التناقض بين ادعائها وعدم ممارسة أعمال إبراهيم.
  alternative: تفسير العبارة صراحةً على أنها إنكار للنسب الجسدي أو قصر البنوة على معناها الروحي وحده.
  rationale: الآية نفسها تقابل بين قولهم إن إبراهيم أبوهم وبين أعمالهم؛ لذلك لا تُحمَّل الترجمة نظامًا لاهوتيًا أوسع مما يقوله النص في هذا الموضع.
- issue: قوة الجملة الشرطية
  choice: 'صياغة جواب الشرط بما يفيد أن سلوكهم القائم يناقض دعوى البنوة: «لكنتم تعملون».'
  alternative: 'صياغتها أمرًا مباشرًا: «فاعملوا أعمال إبراهيم»، أو تقريرًا واقعيًا: «فأنتم تعملون أعمال إبراهيم».'
  rationale: وجود ἐποιεῖτε بصيغة الماضي الناقص، مع السياق الجدلي، يرجح جوابًا مخالفًا للواقع، مع بقاء اختلاف ممكن في درجة التصريح بذلك، وهو مبيّن في الحاشية.
translation_notes:
  register: لغة عربية فصحى معاصرة، واضحة ومهيبة. استُعملت «أولاد» بدل «أبناء» لتجنب الإيحاء باختصاص الذكور، وحُفظ تكرار «إبراهيم» و«أعمال» لإبراز حجة النص. وُضعت علامة الحاشية عند الجملة الشرطية التي تشرحها.
