  verdict: revise
  source_fidelity: المعنى العام للنص اليوناني منقول بأمانة، بما في ذلك نهوض يسوع وعدم رؤيته أحدًا سوى المرأة وسؤالاه ذوا الطابع القضائي. لكن «ولما لم يرَ» توحي بعلاقة زمنية/شرطية ليست في صياغة المشاركة اليونانية، ويمكن صياغتها على نحو أقرب وأيسر.
  naturalness: الأسلوب فصيح وواضح عمومًا. إلا أن «ولما لم يرَ أحدًا إلا المرأة» أقل سلاسة من «ولم يرَ أحدًا غير المرأة»، و«ألم يحكم عليكِ أحد؟» أوضح وأشيع في السؤال المنفي من «أما حكم عليكِ أحد؟».
  terminology: «اعتدل» مناسب لـἀνακύψας ولا يفرض أنه وقف. و«الذين يتهمونك» ينقل κατήγοροί بصورة مفهومة. ولإبراز دلالة κατακρίνω القضائية الخاصة بالإدانة، يُستحسن «ألم يُدِنْكِ أحد؟»؛ وهو أدق من «حكم عليكِ» المجردة.
