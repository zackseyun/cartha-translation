  text: Ἀνακύψας δὲ ὁ Ἰησοῦς, καὶ μηδένα θεασάμενος πλὴν τῆς γυναικός, εἶπεν αὐτῇ, Ἡ γυνή, ποῦ εἰσιν ἐκεῖνοι οἱ κατήγοροί σου; Οὐδείς σε κατέκρινεν;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/010.yaml
  text: Then Jesus[a] straightened up, and seeing no one except the woman, said to her, "Woman, where are those accusers of yours? Has no one condemned you?"
translation:
  language: ar
  text: 'ثم اعتدل يسوع[a]، ولم يرَ أحدًا غير المرأة، فقال لها: «يا امرأة، أين أولئك الذين يتهمونك؟ ألم يُدِنْكِ أحد؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: هذه الآية جزء من قصة المرأة التي أُمسكت في الزنى (يوحنا 7:53–8:11)، وهي غير موجودة في أقدم المخطوطات اليونانية. انظر الحاشية على يوحنا 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: ἀνακύψας
  choice: اعتدل
  rationale: يدل على أن يسوع رفع جسده من وضع الانحناء الذي كان عليه وهو يكتب على الأرض؛ و«اعتدل» طبيعية ودقيقة من غير أن توحي بالضرورة بأنه وقف.
- source_word: θεασάμενος
  choice: لما لم يرَ
  rationale: ينقل معنى الإدراك البصري في صيغة الحال، ويبين أن الآخرين كانوا قد انصرفوا.
- source_word: κατήγοροί
  choice: الذين يتهمونك
  rationale: تعبير عربي واضح ينقل دورهم بوصفهم موجهي الاتهام، مع الحفاظ على الإشارة التعيينية في «أولئك».
- source_word: κατέκρινεν
  choice: حكم عليكِ
  rationale: يحفظ الدلالة القضائية للفعل، أي إصدار حكم بالإدانة، وهو أوضح في هذا السؤال من «دانك» المحتملة دينيًا وأخلاقيًا.
theological_decisions:
- issue: الوضع النصي ليوحنا 7:53–8:11
  choice: إبقاء الآية في المتن مع علامة حاشية نقدية
  alternative: حذف المقطع من المتن أو وضعه بين أقواس
  rationale: النص المصدر المحدد، طبعة روبنسون-بيربونت البيزنطية، يثبت الآية؛ لكن يلزم تنبيه القارئ بأمانة إلى غياب القصة عن أقدم المخطوطات اليونانية.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ووقورة. استُعمل «يا امرأة» لأنه نداء محترم في السياق اليوناني، وإن بدا مباشرًا في العربية الحديثة. وحوفظ على نبرة السؤال القضائية من غير إضافة تفسير مذهبي.
