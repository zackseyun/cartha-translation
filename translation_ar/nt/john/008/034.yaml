  text: Ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι πᾶς ὁ ποιῶν τὴν ἁμαρτίαν δοῦλός ἐστιν τῆς ἁμαρτίας·
base_translation:
  language: en
  yaml_path: translation/nt/john/008/034.yaml
  text: Jesus answered them[a], “Truly, truly, I say to you[b], everyone who practices sin is a servant of sin.”
translation:
  language: ar
  text: 'أجابهم يسوع: «الحقَّ الحقَّ أقول لكم: إنَّ كلَّ مَن يمارس الخطيئة[a] هو عبدٌ للخطيئة[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كلَّ مَن يفعل الخطيئة». ويمكن لاسم الفاعل اليوناني أن يُترجم على نحو أقرب إلى اللفظ، أما «يمارس» فتُبرز معنى السلوك المستمر أو المميز الذي يلائم السياق.'
    reason: lexical_alternative
  - marker: b
    text: يمكن أن تعني الكلمة اليونانية «عبدًا» أو «خادمًا»، لكن صورة العبودية والقيد هي المحور هنا.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς
  choice: أجابهم يسوع
  rationale: صياغة عربية طبيعية تحافظ على معنى الرد في سياق الحوار وعلى تقدم الفعل في السرد اليوناني.
- source_word: Ἀμὴν ἀμὴν
  choice: الحقَّ الحقَّ
  rationale: تحافظ على التكرار المميز لصيغة يسوع التوكيدية في إنجيل يوحنا، وتوصل معنى اليقين بعبارة عربية مفهومة ومهيبة.
- source_word: λέγω ὑμῖν
  choice: أقول لكم
  rationale: ترجمة مباشرة وطبيعية تحفظ النبرة الرسمية للتصريح.
- source_word: πᾶς ὁ ποιῶν τὴν ἁμαρτίαν
  choice: كلَّ مَن يمارس الخطيئة
  rationale: تفيد «يمارس» الفعل المتكرر أو المميز للسلوك في هذا السياق، مع إيراد الصياغة الأقرب حرفيًا في الحاشية كي لا يُحجب مدى دلالة اسم الفاعل اليوناني.
- source_word: δοῦλος
  choice: عبد
  rationale: «عبد» هي اللفظة العربية الطبيعية التي تعبّر هنا عن الخضوع والملكية، وتحفظ قوة صورة الاستعباد للخطيئة من غير إضافة تفسير إلى المتن.
- source_word: τῆς ἁμαρτίας
  choice: للخطيئة
  rationale: اللام في العربية تعبّر طبيعيًا عن التبعية والخضوع المقصودين بالإضافة اليونانية في عبارة «عبد للخطيئة».
theological_decisions:
- issue: هل يصف اسم الفاعل ποιῶν فعلًا منفردًا أم سلوكًا مستمرًا أو مميزًا؟
  choice: كل من يمارس الخطيئة
  alternative: كل من يفعل الخطيئة
  rationale: الصيغة الحاضرة في هذا السياق تلائم معنى الممارسة المستمرة أو المميزة، لكن هذا المعنى السياقي لا يحوَّل إلى قاعدة نحوية مطلقة؛ لذلك ذُكر البديل الأقرب إلى اللفظ في الحاشية.
- issue: قوة استعارة δοῦλος وعلاقة الإنسان بالخطيئة
  choice: عبد للخطيئة
  alternative: خادم للخطيئة
  rationale: سياق الحرية والعبودية يجعل معنى الاسترقاق والخضوع جوهريًا في قول يسوع؛ و«خادم» قد توحي بخدمة اختيارية ولا تنقل قوة القيد بالقدر نفسه.
translation_notes:
  register: العربية فصحى حديثة واضحة ذات نبرة مهيبة. حُفظ تكرار صيغة التوكيد اليوحناوية، واستُعملت «عبد للخطيئة» لأنها مألوفة وقوية دلاليًا، مع حواشٍ توضّح البدائل من غير حسم ما يتجاوز دلالة المصدر.
