  text: πᾶς γὰρ ὁ φαῦλα πράσσων μισεῖ τὸ φῶς καὶ οὐκ ἔρχεται πρὸς τὸ φῶς, ἵνα μὴ ἐλεγχθῇ τὰ ἔργα αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/003/020.yaml
  text: For everyone who practices evil hates the light and does not come to the light[b][a], lest his works be exposed.
translation:
  language: ar
  text: لأن كلَّ من يمارس الشر يبغض النور، ولا يأتي إلى النور، لئلا تُكشَف أعماله[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أن يفيد الفعل اليوناني أيضًا معنى أن يُظهَر خطأ الأعمال أو ذنبها، أو أن تُوبَّخ.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς γὰρ ὁ
  choice: لأن كلَّ من
  rationale: تنقل «لأن» وظيفة γάρ التفسيرية، ويعبّر «كل من» طبيعيًا عن التركيب اليوناني العام الذي يشمل كل شخص يتصف بالفعل الآتي.
- source_word: φαῦλα πράσσων
  choice: يمارس الشر
  rationale: لـ φαῦλα هنا دلالة أخلاقية في مقابل النور، وصيغة المضارع في πράσσων تشير إلى سلوك متكرر أو مميّز للشخص؛ لذلك ينقل «يمارس الشر» المعنى بصورة طبيعية وواضحة.
- source_word: μισεῖ τὸ φῶς
  choice: يبغض النور
  rationale: يحافظ «يبغض» على قوة μισεῖ، وتُبقي «النور» الصورة اللاهوتية المحورية في إنجيل يوحنا دون شرحها داخل النص.
- source_word: οὐκ ἔρχεται πρὸς τὸ φῶς
  choice: لا يأتي إلى النور
  rationale: صياغة مباشرة تحفظ صورة الحركة نحو النور وبساطة التعبير اليوناني.
- source_word: ἵνα μὴ
  choice: لئلا
  rationale: تنقل الغاية السلبية أو قصد التجنب بإيجاز وفصاحة.
- source_word: ἐλεγχθῇ
  choice: تُفضَح
  rationale: تلائم صورة النور الذي يكشف الأعمال، مع إثبات اتساع الدلالة في الحاشية لأنها قد تشمل أيضًا التوبيخ وإظهار الذنب.
- source_word: τὰ ἔργα αὐτοῦ
  choice: أعماله
  rationale: تحافظ على معنى ἔργα وعلى المفرد المذكر العام في الأصل، وهو استعمال طبيعي شامل في العربية.
theological_decisions:
- issue: دلالة ἐλεγχθῇ في صلة الأعمال بالنور
  choice: تُفضَح
  alternative: تُكشَف وتُظهَر إدانتها، أو تُوبَّخ
  rationale: السياق يصوّر النور كاشفًا حقيقة الأعمال، لكن الفعل اليوناني أوسع من مجرد الرؤية وقد يتضمن إظهار الخطأ والذنب؛ لذا اختير اللفظ الأنسب للصورة مع إبقاء البدائل في الحاشية.
- issue: المذكر المفرد في العبارة العامة
  choice: أعماله
  alternative: أعمالهم
  rationale: الأصل اليوناني يستعمل مفردًا مذكرًا استعمالًا عامًا. والمفرد المذكر في العربية يؤدي هذا المعنى بصورة طبيعية من غير تحويل البنية إلى الجمع.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة، تحافظ على صورة «النور» وعلى الترابط التفسيري مع الآية السابقة. استُعمل «يبغض» بدلًا من لفظ أخف، و«يمارس الشر» للدلالة على السلوك المتكرر.
