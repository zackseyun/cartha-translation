source:
  edition: SBLGNT
  text: αὕτη δέ ἐστιν ἡ κρίσις ὅτι τὸ φῶς ἐλήλυθεν εἰς τὸν κόσμον καὶ ἠγάπησαν οἱ ἄνθρωποι μᾶλλον τὸ σκότος ἢ τὸ φῶς, ἦν γὰρ ⸂αὐτῶν πονηρὰ⸃ τὰ ἔργα.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/019.yaml
  text: 'And this is the judgment: that the light has come into the world[a], and people loved the darkness rather than the light, because their works were evil.'
translation:
  language: ar
  text: 'وهذه هي الدينونة: أن النور قد جاء إلى العالم، وأحبّ الناس الظلمة أكثر من النور، لأن أعمالهم كانت شريرة.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κρίσις
  choice: الدينونة
  rationale: تحفظ المعنى الواسع للحكم والتقييم الذي يفضي إلى الإدانة، من غير حصر اللفظ مسبقًا في النتيجة وحدها.
- source_word: τὸ φῶς
  choice: النور
  rationale: إبقاء استعارة يوحنا كما هي، من غير استبدالها بتفسير صريح لهوية النور.
- source_word: ἐλήλυθεν
  choice: قد جاء
  rationale: ينقل دلالة صيغة التام اليونانية على مجيء وقع وما زال أثره قائمًا.
- source_word: κόσμον
  choice: العالم
  rationale: المقابل الطبيعي الذي يحفظ اتساع الاستعمال اليوحناوي من غير توسع تفسيري.
- source_word: ἠγάπησαν
  choice: أحبّوا
  rationale: يحفظ القوة الأخلاقية للفعل وصِلته بحقل المحبة، بدل اختزاله في مجرد التفضيل.
- source_word: οἱ ἄνθρωποι
  choice: الناس
  rationale: يدل هنا على البشر عمومًا، وهو تعبير عربي طبيعي ودقيق لا يقصر المعنى على الذكور.
- source_word: μᾶλλον ... ἢ
  choice: أكثر من
  rationale: ينقل المقارنة مباشرة في عربية واضحة، مع بقاء فعل «أحبّوا» على دلالته الأصلية.
- source_word: τὸ σκότος
  choice: الظلمة
  rationale: يحافظ على التضاد الرمزي اليوحناوي بين النور والظلمة.
- source_word: πονηρὰ
  choice: شريرة
  rationale: ينقل الوصف الأخلاقي القوي للأعمال، لا مجرد كونها رديئة.
- source_word: τὰ ἔργα
  choice: أعمالهم
  rationale: مقابل مباشر ومألوف يحفظ الصياغة اليوحناوية الموجزة.
theological_decisions:
- issue: مرجع «النور»
  choice: الإبقاء على الاستعارة «النور» دون التصريح بمرجعها
  alternative: استبدالها بـ«المسيح» أو «يسوع»
  rationale: السياق يربط النور بالابن ومجيئه الكاشف، لكن النص اليوناني يستعمل الاستعارة نفسها؛ وإبقاؤها يصون النسيج اللاهوتي اليوحناوي.
- issue: مدى دلالة οἱ ἄνθρωποι
  choice: الناس، أي البشر عمومًا
  alternative: الرجال
  rationale: اللفظ اليوناني في هذا السياق عام يشمل البشرية، و«الناس» هو التعبير العربي الطبيعي الذي يحفظ هذا الشمول.
- issue: دلالة κρίσις
  choice: الدينونة بوصفها الحكم الذي يكشف أساس الإدانة
  alternative: الإدانة وحدها
  rationale: يحافظ الاختيار على التوتر بين فعل الحكم ونتيجته بدل تضييق اللفظ إلى النتيجة فقط.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت «لكن» لإبراز المفارقة التي يفيدها السياق بين مجيء النور ومحبة الناس للظلمة، مع الحفاظ على ترتيب الأفكار وصور النص الأصلية.
