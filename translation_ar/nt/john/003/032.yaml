  text: What he has seen and heard[a], this he testifies to[b], and no one receives his testimony.
translation:
  language: ar
  text: ما رآه وسمعه، بهذا يشهد، ولا أحد يقبل شهادته.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: القول «لا أحد يقبل شهادته» تعميم صارخ؛ أما الآية التالية فتتكلم عمن يقبل شهادته.
