lexical_decisions:
- source_word: ὃ
  choice: ما
  rationale: اسم موصول لغير العاقل يحيل إلى مضمون ما رآه وسمعه، وهو طبيعي وواضح في العربية.
- source_word: ἑώρακεν
  choice: رآه
  rationale: يؤدي معنى الرؤية المكتملة ذات الصلة بالحاضر، مع ضمير يعود إلى «ما»؛ ولا تتوافر في العربية صيغة تطابق تمامًا دلالة التام اليوناني من غير إثقال.
- source_word: ἤκουσεν
  choice: سمعه
  rationale: يحافظ على اقتران السماع بالرؤية وعلى عود الضمير إلى المضمون نفسه، مع صيغة الماضي الموافقة للأصل.
- source_word: τοῦτο
  choice: فهذا
  rationale: اسم الإشارة يستأنف المضمون السابق ويبرز أنه عين ما يشهد به؛ والفاء تجعل التركيب الاستئنافي طبيعيًا بالعربية.
- source_word: μαρτυρεῖ
  choice: يشهد به
  rationale: يحفظ دلالة الشهادة وما فيها من إيحاء قانوني، والباء تلائم تعلق الشهادة بمضمون.
- source_word: μαρτυρίαν
  choice: شهادته
  rationale: يحافظ على الصلة الاشتقاقية والدلالية مع «يشهد» وعلى صورة الشاهد والشهادة.
- source_word: οὐδεὶς
  choice: لا أحد
  rationale: ينقل النفي العام بصورته القاطعة من غير تخفيف.
- source_word: λαμβάνει
  choice: يقبل
  rationale: في هذا السياق تدل الكلمة على تلقي الشهادة بالإقرار بها، و«يقبل» أوضح في العربية الحديثة من «يتلقى» مع بقاء معنى الاستجابة للشهادة.
theological_decisions:
- issue: مدى عموم النفي في «لا أحد يقبل شهادته»
  choice: 'الإبقاء على العبارة العامة القاطعة: «لا أحد يقبل شهادته»'
  alternative: «قليلون يقبلون شهادته» أو فهمها نفيًا مطلقًا حسابيًا بلا أي استثناء
  rationale: النص اليوناني يصوغ نفيًا عامًا صارخًا، بينما تتحدث الآية التالية عمن قبل شهادته. لذلك تُحفظ حدة العبارة والتوتر السياقي ولا يُحسمان بتلطيف تفسيري.
translation_notes:
  register: عربية فصحى حديثة، واضحة ورصينة. حُفظ التكرار الاشتقاقي بين «يشهد» و«شهادته»، كما حُفظ التركيب الاستئنافي المؤكد في الأصل بصياغة عربية طبيعية.
