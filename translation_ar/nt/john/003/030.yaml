  text: He must increase[a], but I must decrease.
translation:
  language: ar
  text: لا بُدَّ أن يزداد هو[a]، وأن أقلَّ أنا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بصورة أكثر حرفية: «لا بُدَّ أن يصير ذاك أعظم، وأن أصير أنا أقل».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνον
  choice: هو
  rationale: اسم الإشارة في صيغة النصب هو الفاعل المنطقي للمصدر مع δεῖ، ويشير في السياق إلى يسوع. والضمير «هو» طبيعي في العربية ويحفظ الإشارة من غير إضافة لفظية غير موجودة في اليونانية.
- source_word: δεῖ
  choice: لا بُدَّ
  rationale: تفيد العبارة ضرورة الأمر، وربما تحمل في السياق إيحاءً بضرورة إلهية، من غير أن يحدد النص طبيعتها صراحة. «لا بُدَّ» تحافظ على هذه القوة دون إفراط في التفسير.
- source_word: αὐξάνειν
  choice: يزداد
  rationale: الفعل يدل على الازدياد أو النمو، وصيغة المضارع المصدرية توحي بمسار مستمر. «يزداد» موجزة وواسعة الدلالة، فتشمل تعاظم المكانة والتأثير في السياق.
- source_word: ἐμὲ
  choice: أنا
  rationale: الضمير في صيغة النصب هو الفاعل المنطقي للمصدر، ويُصاغ في العربية ضميرًا مرفوعًا. إظهار «أنا» بعد الفعل يقوي المقابلة مع «هو» ويحاكي إبراز الضمير في الأصل.
- source_word: δὲ ... δὲ
  choice: هو ... أنا
  rationale: تقيم الأداتان مقابلة متوازنة بين ازدياده ونقصان المتكلم. صيغت المقابلة عربيًا ببنية «أن... وأن...» مع إبراز الضميرين؛ لأن استعمال «لكن» هنا أقل سلاسة بعد «لا بد» المشتركة دلاليًا بين الشقين.
- source_word: ἐλαττοῦσθαι
  choice: أنقص
  rationale: يدل الفعل على الصيرورة أقل أو التناقص. «أنقص» يقابل «يزداد» بإيجاز ويحفظ النبرة الحكمية للقول، مع بقاء البديل الحرفي في الحاشية.
theological_decisions:
- issue: طبيعة الضرورة التي تفيدها δεῖ
  choice: إثبات الضرورة بعبارة «لا بُدَّ» من غير تحديد مصدرها أو آليتها
  alternative: التصريح بأنها فريضة إلهية، أو فهمها ضرورة عملية محضة
  rationale: قد تحمل δεῖ في سياق يوحنا معنى الترتيب الإلهي في تاريخ الخلاص، لكن الآية لا تصرح بنوع الضرورة. لذلك تحافظ «لا بُدَّ» على الثقل اللاهوتي والتوتر الدلالي دون إضافة تفسير مذهبي.
- issue: معنى الازدياد والنقصان
  choice: الإبقاء على الصورة العامة «يزداد... أنقص»
  alternative: تفسيرها صراحة بازدياد الشهرة أو الأتباع ونقصانهما
  rationale: لا يحدد النص مجال الازدياد والنقصان. إبقاء الصورة مفتوحة يحفظ إمكان شمولها للمكانة والتأثير والظهور من غير حصرها في تفسير واحد.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة، بنبرة كريمة تحفظ التوازي والحِدّة الحكمية في الأصل. وُضع مؤشر الحاشية بعد «هو» لبيان البديل الأكثر حرفية للتعبير كله.
