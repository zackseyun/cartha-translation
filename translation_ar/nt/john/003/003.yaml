  text: ⸀ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Ἀμὴν ἀμὴν λέγω σοι, ἐὰν μή τις γεννηθῇ ἄνωθεν, οὐ δύναται ἰδεῖν τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/003.yaml
  text: Jesus answered and said to him, “Truly, truly, I say to you, unless someone is born from above,[a] he is not able to see the kingdom of God.”
translation:
  language: ar
  text: 'أجاب يسوع وقال له: «الحق الحق أقول لك: إن لم يولد أحد من فوق،[a] فلا يقدر أن يرى ملكوت الله».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «من جديد». يمكن أن يعني الظرف اليوناني كلا المعنيين: «من فوق» و«من جديد»، ويقوم الحوار في العدد التالي على هذا المعنى المزدوج.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: أجاب
  rationale: فعل سردي عربي مألوف ينقل معنى الاستجابة مباشرة.
- source_word: εἶπεν
  choice: وقال
  rationale: يحافظ على التركيب اليوناني ذي الفعلين، وهو طبيعي في الأسلوب الكتابي العربي.
- source_word: Ἀμὴν ἀμὴν
  choice: الحق الحق
  rationale: صيغة عربية واضحة ومهيبة تحفظ التكرار التوكيدي، بدل نقل «آمين» الذي قد يكون أقل وضوحًا بوصفه افتتاحًا للقول.
- source_word: ἐὰν μή τις
  choice: إن لم يولد أحد
  rationale: ينقل الشرط والاستعمال العام غير المحدد طبيعيًا من غير تخصيص جنس الشخص.
- source_word: γεννηθῇ
  choice: يولد
  rationale: يحفظ المبني للمجهول في السياق العربي ولا يضمّن معنى «من جديد» في الفعل نفسه.
- source_word: ἄνωθεν
  choice: من فوق
  rationale: يحفظ معنى الأصل العلوي الذي ينسجم مع استعمال يوحنا وسياق المقابلة بين السماوي والأرضي، مع إثبات معنى «من جديد» في الحاشية.
- source_word: οὐ δύναται
  choice: فلا يقدر
  rationale: يعكس معنى عدم القدرة صراحة وبأسلوب عربي طبيعي.
- source_word: ἰδεῖν
  choice: أن يرى
  rationale: المقابل المباشر الذي يبقي مجال الدلالة مفتوحًا بين الرؤية والإدراك أو الاختبار.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: ملكوت الله
  rationale: تعبير عربي راسخ ودقيق يحفظ دلالتي سلطان الله ونطاق حكمه دون تضييق المعنى.
theological_decisions:
- issue: دلالة ἄνωθεν في قول يسوع
  choice: من فوق
  alternative: من جديد
  rationale: للظرف اليوناني دلالتان حقيقيتان، ويؤيد السياق اليوحناوي معنى «من فوق»، في حين يكشف رد نيقوديموس في العدد التالي أنه فهم أيضًا معنى «من جديد». لذلك أُبقي المعنى الرئيس في المتن والبديل في الحاشية حفاظًا على التعدد المقصود والتوتر اللاهوتي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة، مع الإبقاء على الصياغة الكتابية المألوفة «الحق الحق» و«ملكوت الله». وُضع مؤشر الحاشية بعد العبارة التي يشرحها مباشرة.
