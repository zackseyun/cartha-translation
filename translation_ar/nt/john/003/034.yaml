  text: ὃν γὰρ ἀπέστειλεν ὁ θεὸς τὰ ῥήματα τοῦ θεοῦ λαλεῖ, οὐ γὰρ ἐκ μέτρου ⸀δίδωσιν τὸ πνεῦμα.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/034.yaml
  text: For the one whom God sent speaks the words of God[a], for he gives the Spirit without measure.
translation:
  language: ar
  text: لأن الذي أرسله الله ينطق بكلمات الله، لأنه يعطي الروح بلا حدّ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا فهم الضمير المستتر في «يعطي» على أنه يعود إلى الذي أرسله الله: «لأن الذي أرسله الله يعطي الروح بلا حدّ».'
    reason: تحتمل اليونانية أن يكون فاعل «يعطي» هو الله أو الشخص الذي أرسله.
lexical_decisions:
- source_word: ὃν
  choice: الذي
  rationale: اسم موصول مذكر مفرد يشير إلى الشخص الذي أرسله الله، وصيغة «الذي» طبيعية وتحفظ قوة التعبير الاسمية.
- source_word: ἀπέστειλεν
  choice: أرسله
  rationale: ينقل الفعل الماضي مباشرة ويحافظ على لغة الإرسال المتكررة في يوحنا دون إضافة معنى التكليف صراحة.
- source_word: τὰ ῥήματα τοῦ θεοῦ
  choice: كلمات الله
  rationale: يحفظ الجمع ودلالة الأقوال المنطوقة، وهو تعبير عربي واضح وطبيعي.
- source_word: λαλεῖ
  choice: يتكلم
  rationale: ينقل معنى الكلام المستمر أو المميز للشخص، وهو أنسب من تعبيرات أفصح لكنها أقل تداولًا مثل «يتفوه».
- source_word: οὐ ... ἐκ μέτρου
  choice: لا ... بمقدار محدود
  rationale: ينقل نفي الإعطاء بحسب مقياس أو حد، بعبارة عربية حديثة واضحة مع الحفاظ على صورة المقدار.
- source_word: δίδωσιν
  choice: يعطي
  rationale: مضارع مباشر يلائم صيغة الحاضر في اليونانية ولا يضيف إيحاءات غير لازمة.
- source_word: τὸ πνεῦμα
  choice: الروح
  rationale: السياق اليوحناوي يرجح الإشارة إلى روح الله؛ والتعريف يحفظ صيغة الأصل من غير إدخال وصف غير موجود في الآية.
theological_decisions:
- issue: فاعل δίδωσιν («يعطي»)
  choice: الإبقاء على الفاعل ضميرًا مستترًا في «يعطي»، مع كون عوده إلى الله هو الأرجح في السياق.
  alternative: قد يعود الضمير إلى الذي أرسله الله، أي الابن، فيكون هو الذي يعطي الروح بلا مقدار محدود.
  rationale: اليونانية لا تصرح بفاعل «يعطي». وذكر الله قبل ذلك وسياق تفسير كلام المرسَل بكلمات الله يرجحان أن الله هو المعطي، لكن عود الضمير إلى المرسَل ممكن نحويًا وتفسيريًا؛ لذلك يحفظ المتن هذا الاحتمال وتوضحه الحاشية بدل حسمه عقائديًا.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ورصينة. استُخدم «بمقدار محدود» بدل تعبيرات تراثية مثل «بكيل» لتوضيح المعنى مع إبقاء صورة القياس، وأُبقي فاعل «يعطي» غير مصرح به حفاظًا على غموض الأصل.
