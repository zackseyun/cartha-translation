  text: ὁ δὲ ποιῶν τὴν ἀλήθειαν ἔρχεται πρὸς τὸ φῶς, ἵνα φανερωθῇ αὐτοῦ τὰ ἔργα ὅτι ἐν θεῷ ἐστιν εἰργασμένα.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/021.yaml
  text: But the one who does the truth comes to the light[a], so that his works may be revealed[d][c][b], because they have been done in God.
translation:
  language: ar
  text: أَمَّا مَنْ يَعْمَلُ الْحَقَّ[a] فَيَأْتِي إِلَى النُّورِ، لِكَيْ يَتَبَيَّنَ أَنَّ أَعْمَالَهُ قَدْ عُمِلَتْ فِي اللهِ[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يمارس الحق»، أو «يفعل ما هو حق». والتعبير اليوناني حرفيًّا: «يعمل الحق».'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا أن تُفهم العبارة: «لأن أعماله قد عُملت في الله»، فتكون تعليلًا لظهور الأعمال لا بيانًا لمضمون ما يتبيّن.'
    reason: alternative_reading
  - marker: c
    text: قد تُفهم «في الله» أيضًا بمعنى «بالله» أو «بواسطة الله»، لكن العبارة اليونانية أوسع دلالة.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ποιῶν τὴν ἀλήθειαν
  choice: أَمَّا مَنْ يَعْمَلُ الْحَقَّ
  rationale: «أمّا» تُظهر المقابلة اللطيفة مع الآية السابقة، و«مَن يعمل» تنقل اسم الفاعل الدال على صفة مستمرة. وأُبقي التعبير «يعمل الحق» قريبًا من اليونانية، مع أنه غير مألوف نسبيًا، حفاظًا على دلالته الأخلاقية والإعلانية.
- source_word: ἔρχεται πρὸς τὸ φῶς
  choice: فَيَأْتِي إِلَى النُّورِ
  rationale: تنقل حركة الاقتراب التي تفيدها πρὸς وتحافظ على صورة النور المجازية.
- source_word: ἵνα φανερωθῇ αὐτοῦ τὰ ἔργα
  choice: لِكَيْ تَظْهَرَ أَعْمَالُهُ
  rationale: «لكي» تحفظ دلالة الغاية، و«تظهر» تنقل المبني للمجهول دلاليًا بصياغة عربية طبيعية من غير تعيين مَن يُظهرها.
- source_word: ὅτι
  choice: أَنَّهَا
  rationale: 'اختيرت «أنّ» بوصفها مُدخِلة لمضمون ما يظهر: أن الأعمال قد عُملت في الله. ويظل حملها على السببية ممكنًا، ولذلك ذُكر في الحاشية.'
- source_word: ἐν θεῷ
  choice: فِي اللهِ
  rationale: أُبقي حرف الجر «في» للمحافظة على انفتاح العبارة بين مجال العلاقة بالله وفاعليته، دون حصرها في معنى «بواسطة الله».
- source_word: ἐστιν εἰργασμένα
  choice: قَدْ عُمِلَتْ
  rationale: «قد» مع الماضي تعبّر بإيجاز عن تمام الفعل ونتيجته القائمة، ويحفظ المبني للمجهول عدم التصريح بالفاعل.
theological_decisions:
- issue: معنى التعبير ποιῶν τὴν ἀλήθειαν
  choice: يعمل الحق
  alternative: يمارس الحق؛ يفعل ما هو حق
  rationale: الصياغة القريبة من الأصل تحفظ النسيج اليوحناوي الذي يصوّر الحق شيئًا يُعمَل، لا مجرد قضية تُصدَّق، من غير تضييق المعنى بتفسير واحد.
- issue: وظيفة ὅτι
  choice: أنها قد عُملت، بوصف العبارة مضمون ما يظهر
  alternative: لأنها قد عُملت، بوصف العبارة سبب ظهور الأعمال
  rationale: يجوز نحويًا أن تكون ὅτι مضمونية أو سببية. اختيرت المضمونية في المتن لاتصالها الطبيعي بفعل الظهور، مع إثبات البديل في الحاشية حفاظًا على الغموض الحقيقي.
- issue: دلالة ἐν θεῷ
  choice: في الله
  alternative: بالله؛ بواسطة الله
  rationale: يحفظ النقل الحرفي نسبيًا سعة التعبير اليوناني، فلا يحسم إن كان التركيز على الفاعلية الإلهية أم على المجال والعلاقة بالله.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُخدم الضبط الجزئي لتيسير القراءة، وحُفظت غرابة «يعمل الحق» المقصودة مع شرحها في الحاشية. جميع علامات الحواشي الواردة مثبتة في المتن.
