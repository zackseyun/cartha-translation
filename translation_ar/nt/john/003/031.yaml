  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Ὁ ἄνωθεν ἐρχόμενος ἐπάνω πάντων ἐστίν. ὁ ὢν ἐκ τῆς γῆς ἐκ τῆς γῆς ἐστιν καὶ ἐκ τῆς γῆς λαλεῖ· ὁ ἐκ τοῦ οὐρανοῦ ἐρχόμενος ἐπάνω πάντων ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/john/003/031.yaml
  text: The one who comes from above is above all[a]. The one who is from the earth is from the earth and speaks from the earth[b]. The one who comes from heaven is above all.
translation:
  language: ar
  text: الآتي من فوق هو فوق الجميع[a]. والذي هو من الأرض هو من الأرض، ومن الأرض يتكلم[b]. والآتي من السماء هو فوق الجميع.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «من السماء» بدل «من فوق» في العبارة الأولى؛ فاللفظة اليونانية تدل هنا على المنشأ من العلو، وتوضحها لاحقًا عبارة «من السماء».
    reason: lexical_alternative
  - marker: b
    text: أو «يتكلم عن أمور الأرض». والأصل اليوناني يكرر حرفيًا «من الأرض»، وقد يدل ذلك على المصدر أو المجال أو موضوع الكلام.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνωθεν
  choice: من فوق
  rationale: تدل هنا على الأصل العلوي لا على التكرار، وتحافظ على المقابلة مع «من الأرض»، ثم توضحها عبارة «من السماء» لاحقًا.
- source_word: ἐρχόμενος
  choice: الآتي
  rationale: اسم فاعل عربي طبيعي يؤدي وظيفة اسم الفاعل اليوناني المعرّف ويحفظ طابعه الوصفي.
- source_word: ἐπάνω πάντων
  choice: فوق الجميع
  rationale: تحفظ صورة العلو ومعنى السيادة، كما تلائم التكرار البنيوي في الآية. ويمكن أن يشمل «الجميع» الأشخاص وكل الموجودات بحسب السياق.
- source_word: ὁ ὢν ἐκ τῆς γῆς
  choice: الذي هو من الأرض
  rationale: صياغة قريبة من التركيب اليوناني وتحافظ على التركيز على المنشأ.
- source_word: γῆ
  choice: الأرض
  rationale: تقابل السماء هنا، ولذلك فـ«الأرض» أنسب من «اليابسة» أو «التراب».
- source_word: ἐκ τῆς γῆς ἐστιν
  choice: هو من الأرض
  rationale: يحفظ تكرار العبارة في الأصل بدل اختصارها أو تنعيمها.
- source_word: ἐκ τῆς γῆς λαλεῖ
  choice: من الأرض يتكلم
  rationale: يحفظ حرف الجر المتكرر ويترك دلالته مفتوحة بين المصدر والمجال أو موضوع الكلام.
- source_word: οὐρανός
  choice: السماء
  rationale: تشير في السياق إلى المنشأ أو العالم السماوي، لا إلى السماء المرئية فحسب.
theological_decisions:
- issue: العلاقة بين «من فوق» و«من السماء»
  choice: 'إبقاء التعبيرين متميزين: «من فوق» أولًا و«من السماء» لاحقًا.'
  alternative: ترجمة التعبيرين كليهما بـ«من السماء».
  rationale: يستخدم الأصل عبارتين متقاربتين لكن غير متطابقتين؛ ويحفظ هذا الاختيار الأسلوب اليوحناوي، مع كون العبارة اللاحقة توضح المنشأ السماوي.
- issue: دلالة التكرار المتعلق بالأرض
  choice: 'الحفاظ على التكرار: «من الأرض ... من الأرض ... من الأرض».'
  alternative: اختصاره إلى تعبير مثل «الأرضي أرضيّ ويتكلم بطريقة أرضية».
  rationale: التكرار مقصود بلاغيًا ويشدد المقابلة بين المنشأ الأرضي والمنشأ السماوي، ولا ينبغي حسم دلالة الكلام بتفسير زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. حُفظ التوازي والتكرار في الأصل، واستُخدم «الآتي» لصياغة موجزة وطبيعية. أُبقيت الحواشي لتوضيح البدائل المعجمية من غير حسم الغموض الأصيل.
