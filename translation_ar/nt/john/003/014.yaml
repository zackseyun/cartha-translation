    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς ... οὕτως
  choice: كما ... هكذا
  rationale: يحافظ هذا التركيب العربي الواضح على المقابلة الصريحة بين ما فعله موسى وما لا بد أن يحدث لابن الإنسان.
- source_word: ὕψωσεν
  choice: رفع
  rationale: يدل في سياق الإشارة إلى سفر العدد على رفع الحيّة فعليًا، ويهيئ كذلك للتكرار اللفظي المقصود مع الفعل المبني للمجهول لاحقًا.
- source_word: τὸν ὄφιν
  choice: الحيّة
  rationale: لفظ كتابي فصيح وواضح، ويتوافق مع رواية العدد 21.
- source_word: ἐν τῇ ἐρήμῳ
  choice: في البرية
  rationale: «البرية» تعبير عربي كتابي مألوف ودقيق لسياق تيه بني إسرائيل، من غير أن يحصر المعنى في صحراء رملية.
- source_word: ὑψωθῆναι
  choice: أن يُرفَع
  rationale: يحفظ المعنى الحسي للرفع، مع إبقاء الإيحاء اليوحناوي بالتمجيد دون حسمه داخل المتن.
- source_word: δεῖ
  choice: لا بدّ أن
  rationale: ينقل معنى الضرورة القوية، بما فيها سياق الضرورة الإلهية، بصورة عربية طبيعية.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: ابن الإنسان
  rationale: يحفظ اللقب المعروف وإيحاءاته الكتابية واللاهوتية، ولا يستبدله بصياغة تفسيرية.
theological_decisions:
- issue: المعنى المزدوج للفعل ὑψόω في يوحنا
  choice: استعمال «رفع/يُرفَع» في الموضعين، مع بيان معنى التمجيد في الحاشية.
  alternative: «مجّد/يُمجَّد» أو «عُلِّي/يُعلّى»
  rationale: التكرار يربط رفع الحيّة برفع ابن الإنسان، بينما يسمح الفعل، ولا سيما في الاستعمال اليوحناوي، بإيحاء التمجيد أيضًا. تحافظ الصياغة المختارة على التوتر بين الرفع الجسدي والتمجيد ولا تختزل المعنى في أحدهما.
- issue: دلالة δεῖ على الضرورة
  choice: «لا بدّ أن»
  alternative: «ينبغي أن»
  rationale: «لا بدّ أن» أوضح في التعبير عن ضرورة ما سيحدث، لا عن مجرد استحسان أخلاقي أو احتمال.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كتابية رصينة. استُخدم «الحيّة» و«البرية» و«ابن الإنسان» للمحافظة على الصلات الكتابية، مع تجنب الألفاظ القديمة الغامضة. وُضعت علامتا الحاشيتين في الموضعين اللذين تفسرانهما مباشرة.
