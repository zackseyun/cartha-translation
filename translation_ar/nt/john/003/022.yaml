  to: بعد هذه الأمور، جاء يسوع وتلاميذه إلى أرض اليهودية، وكان يقيم هناك معهم ويعمِّد.[a]
  rationale: التعديل الوحيد هو جعل إقامة يسوع فعلًا مستمرًا ظاهرًا في العربية، بما يقابل صيغة الناقص في διέτριβεν ويحافظ على التوازي مع «كان يعمِّد». أما الحاشية فتبقى كما هي لأنها دقيقة ومرتبطة بموضعها الصحيح.
