  terminology: «يسوع»، «تلاميذه»، «أرض اليهودية»، و«يعمِّد» مصطلحات سليمة ومتسقة. لا يلزم تغيير الحاشية؛ فهي تعرض توضيح يوحنا 4:2 دون أن تعيد صياغة معنى الآية أو تحسم توترها السردي.
