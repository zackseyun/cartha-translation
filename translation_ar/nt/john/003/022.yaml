  text: Μετὰ ταῦτα ἦλθεν ὁ Ἰησοῦς καὶ οἱ μαθηταὶ αὐτοῦ εἰς τὴν Ἰουδαίαν γῆν, καὶ ἐκεῖ διέτριβεν μετ’ αὐτῶν καὶ ἐβάπτιζεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/022.yaml
  text: After these things[a], Jesus and his disciples went into the land of Judea[c][b], and there he was spending time with them and baptizing.
translation:
  language: ar
  text: بعد هذه الأمور، جاء يسوع وتلاميذه إلى أرض اليهودية، وكان يقيم هناك معهم ويعمِّد.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يوضح يوحنا 4:2 لاحقًا أن يسوع نفسه لم يكن يعمِّد، بل كان تلاميذه هم الذين يعمِّدون.
    reason: cross_reference
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: بعد هذه الأمور
  rationale: يحافظ على صيغة الجمع وعلى الانتقال الزمني في سرد يوحنا، مع بقاء العبارة واضحة في العربية المعاصرة.
- source_word: ἦλθεν
  choice: جاء
  rationale: المعنى المباشر للفعل هو «جاء»، وهو طبيعي في السرد العربي حتى مع ذكر وجهة الحركة.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: تلاميذه
  rationale: صياغة عربية طبيعية وموجزة للتركيب الإضافي.
- source_word: εἰς τὴν Ἰουδαίαν γῆν
  choice: إلى أرض اليهودية
  rationale: يعكس لفظ γῆ صراحةً بوصفه «أرضًا/منطقة»، ويحافظ على التمييز عن مدينة أورشليم دون افتراض أن المقصود حصريًا هو الريف.
- source_word: διέτριβεν
  choice: أقام هناك
  rationale: ينقل معنى المكث وقضاء مدة في المكان؛ وسياق الفعل الناقص يدل على الاستمرار، وهو ظاهر طبيعيًا في السياق العربي.
- source_word: μετ’ αὐτῶν
  choice: معهم
  rationale: ترجمة مباشرة، ومرجع الضمير هو التلاميذ.
- source_word: ἐβάπτιζεν
  choice: وكان يعمِّد
  rationale: يحافظ على الفعل الديني المألوف دون تحديد كيفية التعميد، وتنقل «كان» دلالة الاستمرار في الفعل الناقص.
theological_decisions:
- issue: فاعل التعميد وعلاقته بالتوضيح الوارد في يوحنا 4:2
  choice: الإبقاء على يسوع بوصفه الفاعل النحوي في هذه الآية
  alternative: إعادة صياغة العبارة بحيث يكون التلاميذ هم الفاعلين صراحةً
  rationale: الفعلان المفردان διέτριβεν وἐβάπτιζεν يعودان نحويًا إلى يسوع. أما يوحنا 4:2 فيوضح لاحقًا أن يسوع لم يكن يعمِّد بنفسه، بل كان تلاميذه يفعلون ذلك؛ لذلك لا ينبغي حل هذا التوتر بتغيير صياغة 3:22.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «أرض اليهودية» لمقابلة γῆ، و«أقام» بدل تعبير أطول مثل «قضى وقتًا» لأنه أفصح في وصف المكث. وُضع مؤشر الحاشية بعد جملة التعميد لأنه يتعلق بها مباشرةً.
