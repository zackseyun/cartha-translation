  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὁ πιστεύων εἰς αὐτὸν οὐ κρίνεται· ὁ ⸀δὲ μὴ πιστεύων ἤδη κέκριται, ὅτι μὴ πεπίστευκεν εἰς τὸ ὄνομα τοῦ μονογενοῦς υἱοῦ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/018.yaml
  text: The one who believes in him is not judged[a]; but the one who does not believe has already been judged[b], because he has not believed in the name of the one and only Son of God.
translation:
  language: ar
  text: مَن يؤمن به لا يُدان[a]؛ أمّا مَن لا يؤمن فقد أُدين بالفعل، لأنه لم يؤمن باسم ابن الله الوحيد[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لا يُحكَم عليه». وكذلك يمكن ترجمة «أُدين» لاحقًا: «حُكم عليه». فالفعل اليوناني κρίνω قد يعني «يحكم» أو، بحسب السياق، «يدين».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «ابن الله الفريد»؛ وتقليديًا: «ابن الله الوحيد المولود».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πιστεύων
  choice: مَن يؤمن
  rationale: اسم الفاعل المضارع المعرّف مستعمل استعمالًا اسميًا عامًا؛ وصيغة «مَن يؤمن» عربية طبيعية تحفظ هذا المعنى.
- source_word: εἰς αὐτόν
  choice: به
  rationale: مع فعل الإيمان، تنقل الباء العربية بصورة طبيعية معنى توجيه الثقة إلى الشخص.
- source_word: οὐ κρίνεται
  choice: لا يُدان
  rationale: يحمل κρίνω هنا، في سياق يوحنا 3:17–19، معنى الحكم القضائي السلبي؛ و«يُدان» توصل هذا المعنى بوضوح، مع إثبات البديل الأوسع «يُحكم عليه» في الحاشية.
- source_word: ὁ δὲ μὴ πιστεύων
  choice: أمّا مَن لا يؤمن
  rationale: «أمّا» تُظهر المقابلة التي تفيدها δέ، و«مَن لا يؤمن» صياغة عربية طبيعية للاسم الفاعل المنفي المستعمل اسميًا.
- source_word: ἤδη κέκριται
  choice: فقد دين بالفعل
  rationale: الماضي المبني للمجهول مع «قد» و«بالفعل» ينقل تمام الفعل الذي تفيده صيغة التام اليونانية وحالته القائمة، إضافة إلى معنى ἤδη.
- source_word: ὅτι
  choice: لأنه
  rationale: تُدخل سبب الدينونة المذكورة قبلها بوضوح.
- source_word: μὴ πεπίστευκεν
  choice: لم يؤمن
  rationale: هذه هي الصياغة العربية الطبيعية للنفي مع الفعل التام؛ والسياق يبيّن أن عدم الإيمان حالة قائمة، دون افتعال تركيب ثقيل.
- source_word: εἰς τὸ ὄνομα
  choice: باسم
  rationale: يحفظ لفظ «الاسم» كما في الأصل، وهو في الاستعمال اليوحناوي يتصل بهوية الشخص المعلنة وسلطانه، من غير تفكيك المعنى داخل المتن.
- source_word: τοῦ μονογενοῦς υἱοῦ
  choice: ابن الله الوحيد
  rationale: يفيد μονογενής هنا تفرّد الابن وكونه الوحيد؛ و«الوحيد» واضحة وفصيحة، مع ذكر «الفريد» و«الوحيد المولود» في الحاشية.
- source_word: τοῦ θεοῦ
  choice: الله
  rationale: إضافة «ابن» إلى «الله» تنقل المضاف إليه اليوناني مباشرة وبطبيعية عربية.
theological_decisions:
- issue: ترجمة κρίνω في هذه الآية
  choice: يُدان / دين
  alternative: يُحكم عليه / حُكم عليه
  rationale: السياق المباشر يقابل الخلاص بالدينونة، فيرجّح معنى الحكم السلبي، لكن الحاشية تحفظ السعة الدلالية للفعل اليوناني ولا تلغي احتمال الترجمة الأعم.
- issue: ترجمة μονογενής
  choice: الوحيد
  alternative: الفريد؛ الوحيد المولود
  rationale: «الوحيد» تنقل تفرّد بنوّة الابن دون إدخال إيحاء جسدي غير لازم؛ وتُحفظ الصياغة التقليدية ذات الأهمية التاريخية في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. استُخدمت «يُدان» بدل «يُحكم عليه» في المتن لإبراز القوة القضائية السلبية في السياق، مع حفظ البديل في الحاشية. وُضع كل مؤشر حاشية في المتن.
