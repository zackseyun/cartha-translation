  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω σοι ὅτι ὃ οἴδαμεν λαλοῦμεν καὶ ὃ ἑωράκαμεν μαρτυροῦμεν, καὶ τὴν μαρτυρίαν ἡμῶν οὐ λαμβάνετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/011.yaml
  text: Truly[a], truly, I tell you, we speak what we know and testify to what we have seen[c][b], and you do not receive our testimony.
translation:
  language: ar
  text: 'الحقَّ الحقَّ أقول لك[a]: إننا نتكلم بما نعرفه، ونشهد بما رأيناه، وأنتم لا تقبلون شهادتنا[b][c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «آمين آمين، أقول لك».'
    reason: lexical_alternative
  - marker: b
    text: وردت أفعال المتكلم وضمير الملكية بصيغة الجمع؛ ولا يحدد النص على وجه اليقين مَن الذين يشملهم يسوع بقوله «نحن».
    reason: alternative_reading
  - marker: c
    text: 'أو: «لا تتلقون شهادتنا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: الحقَّ الحقَّ
  rationale: ينقل التوكيد في الصيغة المكررة بعبارة عربية واضحة ومألوفة، مع إثبات اللفظ البديل في الحاشية.
- source_word: λέγω σοι
  choice: أقول لك
  rationale: يحفظ فعل القول والخطاب المفرد المباشر بصياغة عربية طبيعية ورصينة.
- source_word: ὅτι
  choice: إننا
  rationale: تُدخل «إنَّ» مضمون القول في العربية بوضوح، ولا تُفهم هنا على أنها أداة تعليل.
- source_word: ὃ οἴδαμεν λαλοῦμεν
  choice: نتكلم بما نعرفه
  rationale: يحفظ ترتيب المعرفة ثم الكلام، ويؤدي الموصول المحايد بصياغة عربية سليمة.
- source_word: ὃ ἑωράκαμεν μαρτυροῦμεν
  choice: نشهد بما رأيناه
  rationale: ينقل معنى الشهادة ويحفظ أثر الرؤية السابقة ذي الصلة بالحاضر من غير إثقال الأسلوب.
- source_word: τὴν μαρτυρίαν ἡμῶν
  choice: شهادتنا
  rationale: يحافظ على الصلة الاشتقاقية والدلالية مع «نشهد»، وعلى البعد الإثباتي في السياق اليوحناوي.
- source_word: οὐ λαμβάνετε
  choice: لا تقبلون
  rationale: «تقبلون» هي الصياغة العربية الطبيعية هنا لمعنى تلقي الشهادة وقبولها، مع ذكر البديل الأقرب إلى صورة الفعل اليوناني في الحاشية.
- source_word: καὶ
  choice: وَ
  rationale: تُحفظ أداة العطف اليونانية مباشرة من غير إضافة دلالة استدراكية صريحة مثل «لكن».
theological_decisions:
- issue: ضمائر المتكلم الجمع في «نتكلم... نعرفه... رأيناه... شهادتنا»
  choice: الإبقاء على صيغة الجمع من غير تحديد المقصودين بها
  alternative: تفسير الجمع بأنه يشمل يسوع وتلاميذه، أو أنه جمع بلاغي، أو أنه يشير إلى شهادة سماوية أو إلهية أوسع
  rationale: النص اليوناني يستعمل الجمع بوضوح، لكن مرجعه محل نقاش؛ لذلك تحفظ الترجمة الغموض والتوتر اللاهوتي بدل حسمهما.
- issue: الانتقال من المخاطب المفرد إلى المخاطب الجمع
  choice: إظهار الفرق بصيغتي «لك» و«أنتم... تقبلون»
  alternative: تسوية الخطاب كله على المفرد أو الجمع
  rationale: اليونانية تقول أولًا λέγω σοι بصيغة المفرد، ثم λαμβάνετε بصيغة الجمع؛ والعربية قادرة على إظهار هذا التحول بوضوح.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. حافظ النص على التكرار التوكيدي، وعلى صيغ الجمع المبهمة، وعلى التحول المقصود من المخاطب المفرد إلى الجمع، كما أبقى العطف الأخير بالواو من غير إدخال استدراك غير صريح في الأصل.
