  text: لكي تكونَ له حياةٌ أبديةٌ، لكلِّ مَن يؤمن به[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كل مؤمن».'
    reason: lexical_alternative
  - marker: b
    text: 'يستعمل النص اليوناني هنا حرف الجر «في» (ἐν αὐτῷ)، لا «إلى»؛ أما العربية الفصيحة فتقول: «يؤمن به».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: لكي
  rationale: تفيد الغاية أو النتيجة المتصلة بما سبق، و«لكي» تعبير عربي واضح يحفظ هذه الدلالة.
- source_word: πᾶς ὁ πιστεύων
  choice: كلِّ من يؤمن
  rationale: اسم الفاعل المعرَّف مستعمل استعمالًا اسميًا عامًا؛ وهذه الصياغة تنقل شموله لكل شخص يؤمن من غير تقييد جنسي.
- source_word: πιστεύων
  choice: يؤمن
  rationale: «يؤمن» هو المقابل العربي المباشر والمألوف للفعل في هذا السياق اليوحناوي، ولا يضيف معنى تفسيريًا غير مصرح به.
- source_word: ἐν αὐτῷ
  choice: به
  rationale: اليونانية تستعمل ἐν بمعنى «في»، لكن الفعل العربي الفصيح المألوف هو «آمن به». لذلك تحافظ «به» على المعنى مع سلامة الأسلوب العربي، وتوضح الحاشية صورة التعبير اليوناني.
- source_word: ἔχῃ
  choice: تكون لـ
  rationale: هذه صيغة عربية طبيعية للتعبير عن الامتلاك، وتحفظ وقوع الفعل ضمن جملة الغاية التي أدخلتها «لكي» من غير إيحاء بشك زائد.
- source_word: ζωὴν αἰώνιον
  choice: حياةٌ أبدية
  rationale: ترجمة راسخة وواضحة تنقل دوام الحياة وصفتها الأخروية في سياق يوحنا.
theological_decisions:
- issue: صياغة الإيمان مع ἐν αὐτῷ
  choice: يؤمن به
  alternative: يؤمن فيه / يؤمن إليه
  rationale: النص اليوناني يقرأ ἐν αὐτῷ لا εἰς αὐτόν، فلا يصح إقحام معنى «إليه». ومع ذلك تقتضي فصاحة العربية تعدية «آمن» بالباء؛ وتبين الحاشية حرف الجر الوارد في الأصل من غير التضحية بطبيعية العربية.
- issue: نطاق πᾶς ὁ πιστεύων
  choice: كل من يؤمن
  alternative: كل مؤمن
  rationale: تحفظ الصياغة العموم والشمول في العبارة اليونانية، من غير حصرها في جنس أو فئة.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ووقورة. استُعمل التركيب الاسمي «تكون لـ» لأنه طبيعي في العربية ويحافظ على معنى الامتلاك في ἔχῃ، مع إبقاء ترتيب الجملة قريبًا من الأصل.
