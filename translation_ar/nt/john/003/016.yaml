reference: John 3:16
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Οὕτως γὰρ ἠγάπησεν ὁ θεὸς τὸν κόσμον ὥστε τὸν ⸀υἱὸν τὸν μονογενῆ ἔδωκεν, ἵνα πᾶς ὁ πιστεύων εἰς αὐτὸν μὴ ἀπόληται ἀλλὰ ἔχῃ ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/016.yaml
  text: 'For God loved the world in this way: he gave his only Son[b][a], so that everyone who believes in him should not perish but have eternal life.'
translation:
  language: ar
  text: 'فإن الله أحب العالم هكذا: أعطى ابنه الوحيد[a]، لكي لا يهلك كل من يؤمن به، بل تكون له حياة أبدية.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو بحسب الصياغة التقليدية: «ابنه الوحيد المولود»؛ ويمكن أيضًا: «ابنه الفريد». اللفظة اليونانية تؤكد تفرّد الابن، وقد تُرجمت تاريخيًا بما يفيد أنه «الوحيد المولود».'
    reason: alternative_reading
lexical_decisions:
- source_word: Οὕτως
  choice: هكذا
  rationale: 'تفيد هنا، على الأرجح، الكيفية: إن إعطاء الابن يبيّن الطريقة التي أحب الله بها العالم، من غير أن يُنفى احتمال الفهم التقليدي الدال على شدة المحبة.'
- source_word: γὰρ
  choice: فلأن
  rationale: تحفظ القوة التفسيرية والسببية التي تربط الآية بالسياق السابق، وتأتي طبيعية في العربية مع الجملة التالية.
- source_word: ἠγάπησεν
  choice: أحب
  rationale: ماضٍ بسيط مباشر يحفظ دلالة الفعل اليوناني من غير إضافة زمنية تفسيرية.
- source_word: τὸν κόσμον
  choice: العالم
  rationale: يحفظ اتساع κόσμος في يوحنا، ولا يضيّقه إلى البشر وحدهم.
- source_word: ὥστε ... ἔδωκεν
  choice: بذل
  rationale: يقدّم إعطاء الابن بوصفه التعبير الفعلي عن محبة الله. واختيار «بذل» عربي طبيعي في هذا السياق، من غير حصر العطاء في التجسد أو الصلب وحده.
- source_word: τὸν υἱὸν τὸν μονογενῆ
  choice: ابنه الوحيد
  rationale: تعبير عربي واضح يحفظ بنوّة الابن وتفرّده؛ وتُذكر في الحاشية بدائل تعكس النقاش المعجمي والتقليد التاريخي.
- source_word: ἵνα
  choice: لكيلا ... بل
  rationale: تحفظ دلالة الغاية أو النتيجة المقصودة، بصياغة عربية طبيعية.
- source_word: πᾶς ὁ πιστεύων εἰς αὐτὸν
  choice: كل من يؤمن به
  rationale: صياغة جامعة وعامة تحافظ على معنى التركيب الاسمي ودلالة الإيمان به، بلا إدخال حسم مذهبي.
- source_word: μὴ ἀπόληται
  choice: لا يهلك
  rationale: يحفظ جسامة ἀπόλλυμι من غير تحديد تفسيري لطبيعة الهلاك.
- source_word: ἔχῃ ζωὴν αἰώνιον
  choice: تكون له حياة أبدية
  rationale: صياغة عربية واضحة تحافظ على امتلاك الحياة الأبدية بوصفه المقابل للهلاك.
theological_decisions:
- issue: دلالة Οὕτως
  choice: 'الكيفية: «هكذا»'
  alternative: 'الشدة أو المقدار: «إلى هذا الحد» أو الصياغة التقليدية «هكذا أحب الله العالم»'
  rationale: السياق النحوي مع ὥστε وإعطاء الابن يرجّح أن الفعل التالي يشرح كيفية المحبة. وتبقي الحاشية المجال للدلالة التقليدية من غير حسم زائد.
- issue: دلالة μονογενής في وصف الابن
  choice: «ابنه الوحيد» في المتن
  alternative: «ابنه الوحيد المولود» أو «ابنه الفريد»
  rationale: «الوحيد» واضحة وطبيعية وتحفظ تفرّد علاقة الابن بالآب، بينما تورد الحاشية الصياغة التاريخية والبديل المعجمي من غير فرض تفسير اشتقاقي في المتن.
- issue: نطاق πᾶς ὁ πιστεύων
  choice: «كل من يؤمن به»
  alternative: «مَن يؤمن به»
  rationale: يحفظ التعبير شموله وعمومه من غير إدخال موقف مذهبي بشأن الاختيار أو مدى الكفارة أو طبيعة الاستجابة البشرية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت «هكذا» قبل النقطتين لإبراز كيفية المحبة، و«بذل» للتعبير الطبيعي عن العطاء المكلف مع تجنب تقييده بحدث واحد. وُضع مؤشر الحاشية مباشرة بعد العبارة التي يشرحها.
