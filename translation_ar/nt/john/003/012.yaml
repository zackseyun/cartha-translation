  rationale: صُحِّح زمن نفي الإيمان ليطابق المضارع اليوناني، وأُظهر مستقبل جواب الشرط في «ستؤمنون» لمقابلة πιστεύσετε. ولم تُضف حواشٍ لأن النص العربي لا يحتاج إلى حاشية لشرح بديل معجمي، ولأن الحواشي الإنجليزية الواردة ليست جزءًا من مسودة عربية ذات مراجع حواشٍ.
