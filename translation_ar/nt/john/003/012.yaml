  terminology: «الأمور الأرضية» و«الأمور السماوية» مصطلحان سليمـان ومحايدان يحافظان على التقابل النصي ولا يفرضان تفسيرًا للاهوتيًا. و«كلّمتكم عن» مناسبة لسياق الحديث الموجّه إليهم.
