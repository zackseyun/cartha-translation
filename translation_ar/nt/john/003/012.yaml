source:
  edition: SBLGNT
  text: εἰ τὰ ἐπίγεια εἶπον ὑμῖν καὶ οὐ πιστεύετε, πῶς ἐὰν εἴπω ὑμῖν τὰ ἐπουράνια πιστεύσετε;
base_translation:
  language: en
  yaml_path: translation/nt/john/003/012.yaml
  text: If I told you about earthly things and you do not believe[b][a], how will you believe if I tell you about heavenly things?
translation:
  language: ar
  text: إن كنتُ قد كلّمتكم عن الأمور الأرضية ولا تؤمنون، فكيف ستؤمنون إن كلّمتكم عن الأمور السماوية؟
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ ἐπίγεια
  choice: الأمور الأرضية
  rationale: الصفة المحايدة الجمع مستعملة استعمال الاسم. تحافظ «الأمور الأرضية» على التقابل المباشر مع «الأمور السماوية» من غير حصر المعنى في أمثلة أرضية أو أحداث تقع على الأرض.
- source_word: εἶπον ὑμῖν
  choice: كلّمتكم
  rationale: يفيد الفعل قول يسوع السابق الموجَّه إليهم. و«كلّمتكم» عربية طبيعية تجمع معنى الكلام مع المخاطَبين من غير إضافة تفسيرية.
- source_word: οὐ πιστεύετε
  choice: لم تؤمنوا
  rationale: مع أن اليونانية تستعمل المضارع، فإن وقوع العبارة بعد الشرط المتعلق بكلام سابق يجعل الماضي في العربية أوضح وأفصح، مع بقاء معنى عدم استجابتهم بالإيمان.
- source_word: πῶς ... πιστεύσετε
  choice: فكيف تؤمنون
  rationale: يحافظ الاستفهام على طابعه البلاغي. ويؤدي المضارع العربي الدال على الاستقبال بعد الشرط معنى المستقبل اليوناني بصورة طبيعية، من غير تحويله إلى سؤال عن القدرة.
- source_word: ἐὰν εἴπω ὑμῖν
  choice: إن كلّمتكم
  rationale: تنقل «إن» الشرط المستقبلي المحتمل، ويقابل تكرار «كلّمتكم» التوازي القائم في اليونانية بين εἶπον وεἴπω.
- source_word: τὰ ἐπουράνια
  choice: الأمور السماوية
  rationale: الصفة المحايدة الجمع مستعملة استعمال الاسم، و«الأمور السماوية» تحفظ التقابل اللفظي والدلالي مع «الأمور الأرضية» من غير تحديد ماهية هذه الأمور.
theological_decisions:
- issue: دلالة التقابل بين τὰ ἐπίγεια وτὰ ἐπουράνια
  choice: إبقاء التقابل عامًا بصيغة «الأمور الأرضية» و«الأمور السماوية».
  alternative: تفسير الأولى بأنها أمثال مأخوذة من العالم الأرضي أو حقائق تقع على الأرض، وتفسير الثانية بأنها أسرار إلهية أعمق أو أمور في السماء.
  rationale: لا يحسم النص المقصود الدقيق من الفئتين، ولذلك تحافظ الصياغة العامة على الغموض الحقيقي والتوتر اللاهوتي بدل أن تفرض تفسيرًا بعينه.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُخدم توازٍ لفظي بين «كلّمتكم» في شطري الآية وبين «الأمور الأرضية» و«الأمور السماوية»، مع تجنب الشروح المذهبية داخل النص.
