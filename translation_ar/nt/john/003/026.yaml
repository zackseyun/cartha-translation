base_translation:
  language: en
  yaml_path: translation/nt/john/003/026.yaml
  text: And they came to John and said to him[a], “Rabbi, the one who was with you beyond the Jordan, to whom you have borne witness—look, he is baptizing[b], and everyone is going to him.”
translation:
  language: ar
  text: 'فجاؤوا إلى يوحنا وقالوا له: «يا رابي، ذاك الذي كان معك في ما وراء الأردن، الذي شهدت له[a]، ها هو ذا يعمِّد[b]، والجميع يأتون إليه!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الذي شهدت عنه». ترد العبارة في اليونانية بصيغة الداتيف، ويمكن أن يُعبَّر عنها عربيًا بالشهادة له أو الشهادة عنه.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «هذا يعمِّد». يصرّح النص اليوناني باسم الإشارة، وقد يحمل ذلك تشديدًا لافتًا في كلام المتكلمين.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον πρὸς τὸν Ἰωάννην
  choice: فجاؤوا إلى يوحنا
  rationale: ينقل فعل المجيء والاقتراب من يوحنا بصياغة عربية سردية طبيعية، وتحفظ الفاء اتصال الحدث بما قبله.
- source_word: Ῥαββί
  choice: يا رابي
  rationale: نُقل اللقب اليهودي صوتيًا بدل استبداله مباشرةً بـ«يا معلّم»، حفاظًا على بيئة النص التاريخية وعلى استعمال يوحنا لهذا اللقب.
- source_word: ὃς ἦν μετὰ σοῦ πέραν τοῦ Ἰορδάνου
  choice: ذاك الذي كان معك في ما وراء الأردن
  rationale: «ذاك الذي» تعبير عربي واضح عن الموصول مع إبقاء الإشارة إلى الشخص، و«في ما وراء الأردن» تنقل العبارة الجغرافية دون تفسير زائد.
- source_word: ᾧ σὺ μεμαρτύρηκας
  choice: الذي شهدت له
  rationale: تحفظ «شهدت» مفردة الشهادة المحورية في إنجيل يوحنا، ويعبّر حرف الجر «لـ» عن صيغة المجرور اليونانية مع إبقاء البديل «شهدت عنه» في الحاشية.
- source_word: ἴδε οὗτος
  choice: ها هو ذا
  rationale: صيغة تنبيه وإشارة عربية طبيعية تحفظ معًا قوة ἴδε ودلالة اسم الإشارة οὗτος، بدل تسطيحهما إلى ضمير مجرد.
- source_word: βαπτίζει
  choice: يعمِّد
  rationale: المضارع العربي يدل في السياق على النشاط الجاري الذي يبلّغ عنه المتكلمون.
- source_word: πάντες ἔρχονται πρὸς αὐτόν
  choice: والجميع يأتون إليه
  rationale: تحفظ صيغة التعميم البلاغي في πάντες واتجاه الحركة في ἔρχονται، من غير افتراض أن المقصود حصرٌ عددي مطلق.
theological_decisions:
- issue: لغة الشهادة في إنجيل يوحنا
  choice: شهدت له
  alternative: شهدت عنه
  rationale: اختير فعل «شهد» للمحافظة على خيط الشهادة المتكرر ذي الدلالة اللاهوتية في الإنجيل. أما تعلّق الشهادة بالشخص فيحتمل في العربية «له» و«عنه»، ولذلك لم يُحسم الفرق بصمت بل ذُكر البديل في الحاشية.
- issue: نبرة الإشارة إلى يسوع
  choice: ها هو ذا يعمِّد
  alternative: ها هو يعمِّد
  rationale: يبقي النص المختار قوة اسم الإشارة οὗτος وما قد تحمله من تشديد أو انزعاج في كلام تلاميذ يوحنا، من غير الجزم بدافعهم النفسي.
