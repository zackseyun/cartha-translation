  register: العربية فصحى حديثة واضحة ووقورة. حُفظ اللقب اليهودي «رابي»، ومصطلح «الشهادة» اليوحناوي، ونبرة التنبيه والإشارة في «ها هو ذا»، مع تجنب اللغة المذهبية أو تفسير انفعال المتكلمين على نحو جازم.
