id: JHN.3.4
reference: John 3:4
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: λέγει πρὸς αὐτὸν ⸀ὁ Νικόδημος· Πῶς δύναται ἄνθρωπος γεννηθῆναι γέρων ὤν; μὴ δύναται εἰς τὴν κοιλίαν τῆς μητρὸς αὐτοῦ δεύτερον εἰσελθεῖν καὶ γεννηθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/john/003/004.yaml
  text: Nicodemus said to him[a], “How can a man be born when he is old? He cannot enter his mother’s womb a second time and be born[b], can he?”
translation:
  language: ar
  text: 'فقال له نيقوديموس: «كيف يمكن لإنسان[a] أن يولد وهو شيخ؟ أيمكنه أن يدخل رحم أمه مرةً ثانيةً ويولد[b]؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'اللفظ اليوناني مفرد مذكر، ومعناه هنا عام: «إنسان» أو «شخص».'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «مرة ثانية»؛ إذ يفهم نيقوديموس كلام يسوع فهمًا حرفيًا.'
    reason: cross_reference
lexical_decisions:
- source_word: λέγει πρὸς αὐτὸν
  choice: فقال له
  rationale: المضارع هنا مضارع تاريخي شائع في السرد اليوحنّاوي؛ وصيغة الماضي العربية تؤدي وظيفته السردية بطلاقة.
- source_word: ὁ Νικόδημος
  choice: نيقوديموس
  rationale: نقلٌ صوتي للاسم بحسب الصيغة العربية الكتابية الشائعة.
- source_word: Πῶς δύναται
  choice: كيف يمكن
  rationale: تعبير عربي طبيعي ينقل السؤال عن الإمكان.
- source_word: ἄνθρωπος
  choice: إنسان
  rationale: اللفظ اليوناني مفرد مذكر ذو دلالة عامة هنا، و«إنسان» ينقل عمومه طبيعيًا من غير أن يقصر المعنى على الذكور.
- source_word: γεννηθῆναι
  choice: أن يولد
  rationale: المصدر المبني للمجهول يدل في هذا السياق على الولادة، من غير إضافة معنى «من جديد» إلى الفعل نفسه.
- source_word: γέρων ὤν
  choice: وهو شيخ
  rationale: صياغة عربية موجزة وطبيعية تنقل الحال وتفيد التقدم في السن.
- source_word: μὴ δύναται
  choice: أيمكنه
  rationale: صيغ الاستفهام وسياقه ينقلان استبعاد نيقوديموس للأمر، مع أن μή اليونانية تتوقع جوابًا بالنفي.
- source_word: εἰς τὴν κοιλίαν τῆς μητρὸς αὐτοῦ
  choice: أن يدخل رحم أمه
  rationale: المقصود من κοιλία مع ذكر الأم هو الرحم؛ وهذه الصياغة أدق وأفصح في العربية من «بطن أمه».
- source_word: δεύτερον
  choice: مرةً ثانيةً
  rationale: ينقل المعنى الصريح للفظ، ويحافظ على فهم نيقوديموس الحرفي لكلام يسوع.
- source_word: εἰσελθεῖν καὶ γεννηθῆναι
  choice: أن يدخل ... ويولد
  rationale: أُبقي الفعلان ظاهرين للمحافظة على تسلسل السؤال وصورته الحسية.
theological_decisions:
- issue: دلالة ἄνθρωπος العامة مع صيغته المذكرة المفردة
  choice: إنسان
  alternative: رجل
  rationale: «إنسان» هي المقابل العربي الطبيعي للفظ العام هنا، وتحفظ شموله من غير أن توحي بأن السؤال خاص بالذكور.
- issue: هل تُستورد دلالة «من جديد/من فوق» من يوحنا 3:3 إلى γεννηθῆναι في هذه الآية
  choice: أن يولد ... مرةً ثانيةً
  alternative: أن يولد من جديد
  rationale: تحتوي هذه الآية صراحةً على δεύτερον، أي «مرة ثانية»، وهو تعبير نيقوديموس عن فهمه الحرفي؛ لذلك لا تُحمَّل صياغة الآية مسبقًا دلالة ἄνωθεν المختلف عليها في الآية السابقة.
- issue: القوة الاستفهامية لأداة μή
  choice: أيمكنه أن يدخل ...؟
  alternative: لا يمكنه أن يدخل ...، أليس كذلك؟
  rationale: السؤال العربي في هذا السياق يؤدي معنى الاستبعاد والإنكار بصورة طبيعية، من غير تحويل بنية الجملة إلى تقرير يتبعه سؤال ذيلي غير مألوف.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «رحم أمه» للدقة الطبيعية، وحُفظت «مرة ثانية» لإبراز سوء الفهم الحرفي من غير حل التوتر السردي.
