review_pass:
  verdict: revise
  source_fidelity: تحتاج ترجمة κρίνῃ إلى تعديل. «ليدين» في العربية يضيّق الفعل إلى الإدانة، بينما κρίνω هنا أوسع، ومعنى «يدين» هو البديل السياقي الذي ينبغي أن يبقى في الحاشية. أما بقية البنية فتنقل الغرض المتقابل، وتكرار «العالم»، والخلاص «به» بأمانة جيدة.
  naturalness: الصياغة المقترحة فصحى حديثة واضحة. «فإن» أنسب للصلة التفسيرية مع السياق السابق، و«لكي يحكم على العالم» تعبير عربي طبيعي يتيح معنى الحكم دون افتراض الإدانة.
  terminology: «الابن»، و«العالم»، و«الخلاص/يخلص»، و«به» متسقة مع المصطلحات الكتابية ولا تضيف تفسيرًا مذهبيًا. تُنقل κρίνῃ بـ«يحكم على» للمحافظة على سعتها الدلالية.
  issues:
  - severity: medium
    issue: تضييق معنى κρίνῃ في المتن إلى «ليدين».
    rationale: الفعل اليوناني κρίνω يعني أساسًا «يحكم/يقضي»، وقد يكتسب معنى الإدانة بحسب السياق. جعل «يدين» في المتن يحوّل القراءة البديلة الأضيق إلى المعنى الرئيس، خلافًا للأصل وللمسار التدقيقي الإنجليزي.
  - severity: medium
    issue: الحاشية تعكس العلاقة الدلالية بين المعنى الرئيس والبديل.
    rationale: تصف الحاشية «يدين» بأنه من المعاني الأساسية، ثم تجعل «الحكم على العالم بالإدانة» بديلًا؛ والصواب أن يكون «يدين العالم» هو البديل الأضيق، مع بيان أن المعنى الأساسي هو الحكم.
