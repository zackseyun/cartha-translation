base_translation:
  language: en
  yaml_path: translation/nt/john/003/017.yaml
  text: For God did not send the Son into the world so that he might judge the world[a], but so that the world might be saved through him.
translation:
  language: ar
  text: فَإِنَّ اللهَ لَمْ يُرْسِلِ الابْنَ إِلَى الْعَالَمِ لِكَيْ يَحْكُمَ عَلَى الْعَالَمِ[a]، بَلْ لِكَيْ يَخْلُصَ الْعَالَمُ بِهِ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ليدين العالم». يمكن أن يُفهم الفعل اليوناني بهذا المعنى الأضيق في السياق، لكن معناه الأساسي هو «يحكم».'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ γὰρ
  choice: لِأَنَّ ... لَمْ
  rationale: تنقل «لأن» القوة التفسيرية لـγάρ وصلتها بما سبق، ويؤدي «لم» نفي الفعل الماضي بوضوح.
- source_word: ἀπέστειλεν
  choice: يُرْسِل
  rationale: «أرسل» هو المقابل العربي الطبيعي، ويحفظ موضوع إرسال الابن دون إضافة معنى التكليف صراحةً.
- source_word: ὁ θεὸς
  choice: الله
  rationale: الاسم المعرّف θεός يُنقل طبيعيًا في العربية إلى «الله».
- source_word: τὸν υἱὸν
  choice: الابن
  rationale: يحفظ أداة التعريف والقوة اللقبية في اليونانية، من غير إضافة ضمير ملكية غير مصرّح به.
- source_word: εἰς τὸν κόσμον
  choice: إلى العالم
  rationale: تعبير عربي طبيعي عن حركة الإرسال إلى نطاق العالم؛ و«إلى» هنا أوضح من الصياغة الحرفية «إلى داخل».
- source_word: ἵνα κρίνῃ τὸν κόσμον
  choice: ليدين العالم
  rationale: «يدين» يحفظ المعنى الأساسي الواسع لـκρίνω، أي يحكم أو يقضي، من غير حصره في الإدانة؛ ولام التعليل تنقل غرض ἵνα بصورة عربية موجزة.
- source_word: ἀλλ’ ἵνα
  choice: بل لِـ
  rationale: «بل» تُظهر التضاد القوي بين الغرضين، وتكرار لام التعليل يحفظ توازي العبارتين.
- source_word: σωθῇ
  choice: يخلص
  rationale: الصيغة العربية المبنية للمعلوم لفظًا هنا تحمل معنى النجاة بحسب الاستعمال الشائع، لكن الفاعل النحوي «العالم» يتلقى الخلاص، فتؤدي دلالة المبني للمجهول اليوناني بصورة طبيعية.
- source_word: ὁ κόσμος
  choice: العالم
  rationale: يحفظ تكرار κόσμος في الآية ولا يضيّق مدلوله إلى البشر وحدهم داخل نص الترجمة.
- source_word: δι’ αὐτοῦ
  choice: به
  rationale: الباء تعبّر طبيعيًا عن الوسيلة أو الواسطة التي تدل عليها διά مع المضاف إليه، مع إبقاء الإحالة إلى الابن واضحة.
theological_decisions:
- issue: معنى κρίνῃ في مقابل σωθῇ
  choice: يدين
  alternative: يحكم على العالم بالإدانة
  rationale: الفعل اليوناني κρίνω أوسع من معنى الإدانة وحده، ولذلك يحفظ «يدين» توتر النص بين الدينونة والخلاص من غير تقرير أن المقصود حصرًا هو الحكم بالعقوبة. ويُذكر المعنى الأضيق الممكن سياقيًا في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت صياغة متوازية («ليدين... بل ليخلص») تحفظ بنية الغرض والتضاد في الأصل، مع إبقاء «الابن» بلا ضمير ملكية، ووضع علامة الحاشية [a] في موضعها داخل المتن.
