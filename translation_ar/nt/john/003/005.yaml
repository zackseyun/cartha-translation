id: JHN.3.5
reference: John 3:5
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ⸀ἀπεκρίθη Ἰησοῦς· Ἀμὴν ἀμὴν λέγω σοι, ἐὰν μή τις γεννηθῇ ἐξ ὕδατος καὶ πνεύματος, οὐ δύναται εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/005.yaml
  text: Jesus answered[a], “Truly, truly, I say to you, unless someone is born of water and the Spirit[b], he is not able to enter the kingdom of God.”
translation:
  language: ar
  text: 'أجاب يسوع: «الحقَّ الحقَّ أقول لك: إن لم يُولَد أحدٌ من الماء والروح[a][b]، فلا يقدر أن يدخل ملكوت الله».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أن تُفهم الكلمة اليونانية هنا بمعنى «الروح» في إشارة إلى الروح القدس، وهو الأرجح في هذا السياق، أو بمعنى «روح» على نحو أعم. ولا تميّز المخطوطات اليونانية القديمة بين الحروف الكبيرة والصغيرة.
    reason: alternative_reading
  - marker: b
    text: فُهمت عبارة «من الماء والروح» بطرائق مختلفة، منها أنها صورة للتطهير والتجديد، أو إشارة إلى الولادة الجسدية والولادة الروحية، أو إشارة إلى المعمودية. يحافظ المتن على العبارة اليونانية من غير أن يحسم هذا الخلاف التفسيري.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: أجاب
  rationale: صياغة سردية عربية مألوفة تحفظ دلالة الرد في سياق الحوار.
- source_word: Ἀμὴν ἀμὴν
  choice: الحقَّ الحقَّ
  rationale: تنقل التوكيد في الصيغة اليونانية المكررة بلغة عربية كتابية واضحة ومألوفة.
- source_word: λέγω σοι
  choice: أقول لك
  rationale: تحفظ المباشرة والنبرة الوقورة في العبارة اليونانية.
- source_word: ἐὰν μή τις
  choice: إن لم ... أحدٌ
  rationale: تنقل الشرط والاستغراق العام من غير تخصيص الذكور.
- source_word: γεννηθῇ
  choice: يُولَد
  rationale: تحفظ صيغة المبني للمجهول، ولا تضيف «ثانية» أو «من فوق» لأن ἄνωθεν غير واردة في هذه الآية.
- source_word: ἐξ ὕδατος
  choice: من الماء
  rationale: تقابل ἐξ مباشرة وتأتي طبيعية مع فعل الولادة في العربية.
- source_word: καὶ πνεύματος
  choice: والروح
  rationale: «الروح» هي الإحالة الأرجح في السياق، مع إبقاء احتمال فهم اللفظة بمعنى أعم في الحاشية؛ والعربية لا تستخدم الحروف الكبيرة للتمييز كما تفعل الإنجليزية.
- source_word: οὐ δύναται
  choice: فلا يقدر
  rationale: تحفظ معنى القدرة أو عدمها الوارد صراحة في δύναμαι، وتربط جواب الشرط ربطًا عربيًا طبيعيًا.
- source_word: εἰσελθεῖν
  choice: أن يدخل
  rationale: المقابل العربي المباشر والطبيعي في هذا السياق.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: ملكوت الله
  rationale: تعبير عربي راسخ ودقيق، يبقي أبعاد βασιλεία من غير حصرها في معنى المكان أو السيادة وحده.
theological_decisions:
- issue: دلالة πνεύματος في عبارة ἐξ ὕδατος καὶ πνεύματος
  choice: الروح، مع ترجيح الإشارة إلى روح الله
  alternative: الروح بمعنى غير معيَّن أو مبدأ روحي
  rationale: السياق اليوحناوي والخلفية الكتابية يرجحان الإشارة إلى الروح القدس، لكن غياب أداة التعريف في اليونانية وغياب التمييز الطباعي بين الحروف الكبيرة والصغيرة فيها يستدعيان عدم إلغاء الاحتمال الآخر.
- issue: المقصود بعبارة «من الماء والروح»
  choice: إبقاء العبارة كما هي من غير حسم تفسيرها في المتن
  alternative: التطهير والتجديد؛ أو الولادة الجسدية والولادة الروحية؛ أو المعمودية
  rationale: النص اليوناني لا يصرّح في هذه الآية وحدها بأي واحد من هذه الشروح، لذلك لا تُدرج قراءة طائفية أو تفسيرية خاصة في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «ملكوت الله» بوصفه التعبير الكتابي العربي الراسخ، وحُفظ تكرار «الحق» للتوكيد. وُضعت علامتا الحاشيتين بعد «الروح» لأن الحاشيتين تتعلقان بدلالة πνεύματος وبالعبارة الكاملة «الماء والروح».
