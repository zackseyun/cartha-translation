  text: οὔπω γὰρ ἦν βεβλημένος εἰς τὴν φυλακὴν ⸀ὁ Ἰωάννης.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/024.yaml
  text: For John had not yet been thrown into prison[a].
translation:
  language: ar
  text: لأن يوحنا لم يكن قد أُلقي بعدُ في السجن[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي يوحنا المعمدان.
    reason: إحالة سياقية توضّح هوية يوحنا من غير إضافة اللقب إلى نص الآية.
lexical_decisions:
- source_word: οὔπω
  choice: لم يكن ... بعدُ
  rationale: ينقل معنى أن الإلقاء في السجن لم يكن قد وقع حتى تلك اللحظة من السرد، وهو تعبير عربي طبيعي مع صيغة الماضي الأسبق.
- source_word: γὰρ
  choice: لأن
  rationale: تفيد الأداة هنا تقديم خلفية تفسيرية لما يحيط بالآية، و«لأن» تؤدي هذا الربط بوضوح.
- source_word: ἦν βεβλημένος
  choice: لم يكن قد أُلقي
  rationale: يحافظ هذا التركيب على دلالة الفعل المكتمل السابق للنقطة الزمنية التي يتناولها السرد، وعلى صيغة المبني للمجهول.
- source_word: εἰς τὴν φυλακήν
  choice: في السجن
  rationale: هذا هو التعبير العربي المألوف عند الحديث عن إيداع شخص السجن؛ وهو يؤدي المقصود الاتجاهي في السياق من غير تكلّف حرفي.
- source_word: ὁ Ἰωάννης
  choice: يوحنا
  rationale: النص اليوناني يذكر الاسم وحده، فيُحافَظ عليه في المتن من دون إضافة وصف «المعمدان».
theological_decisions:
- issue: تحديد هوية يوحنا
  choice: يوحنا
  alternative: يوحنا المعمدان
  rationale: يتضح من السياق أن المقصود يوحنا المعمدان، لكن اليونانية في هذه الآية تقول «يوحنا» فقط؛ لذلك يُحفظ الاسم المجرد في المتن، ويُوضَّح المقصود في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدم «بعدُ» للدلالة الزمنية، وحُفظ البناء للمجهول وتسلسل الزمن في الأصل.
