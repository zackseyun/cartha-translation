  text: αὐτοὶ ὑμεῖς ⸀μοι μαρτυρεῖτε ὅτι ⸀εἶπον· Οὐκ εἰμὶ ἐγὼ ὁ χριστός, ἀλλ’ ὅτι Ἀπεσταλμένος εἰμὶ ἔμπροσθεν ἐκείνου.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/028.yaml
  text: You yourselves bear me witness that I said[a], ‘I am not the Messiah[b], but I have been sent ahead of him.’
translation:
  language: ar
  text: 'أنتم أنفسكم تشهدون لي أني قلت: «لستُ أنا المسيح، بل أنا مُرسَلٌ أمامه».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «بل قد أُرسلتُ أمامه» أو «بل أُرسلتُ قبله».'
    reason: يحمل البناء اليوناني معنى إرسال تمّ وله أثر أو صفة قائمة، كما يمكن أن تُفهم «أمامه» بمعنى التقدّم عليه في المهمة.
lexical_decisions:
- source_word: αὐτοὶ ὑμεῖς
  choice: أنتم أنفسكم
  rationale: يحفظ التوكيد الصريح على المخاطَبين أنفسهم بصياغة عربية طبيعية.
- source_word: μοι μαρτυρεῖτε
  choice: تشهدون لي
  rationale: ينقل الداتيف مع فعل الشهادة بمعنى أنهم يؤيدون قوله ويشهدون له، مع الحفاظ على النبرة الشهادية البارزة في يوحنا.
- source_word: εἶπον
  choice: قلت
  rationale: الماضي البسيط يلائم صيغة الماضي اليونانية وإشارة يوحنا إلى تصريح سابق.
- source_word: ὁ χριστός
  choice: المسيح
  rationale: اللفظ العربي المألوف يحمل هنا معنى اللقب، أي الممسوح المنتظَر، من غير تحويله إلى اسم شخصي محض.
- source_word: Ἀπεσταλμένος εἰμὶ
  choice: أنا مُرسَلٌ
  rationale: يحفظ البناء الذي يصف حالة يوحنا الحاضرة بوصفه شخصًا قد أُرسل، من غير حصره تعسفًا في زمن ماضٍ أو صيغة خبرية زمنية واحدة.
- source_word: ἔμπροσθεν ἐκείνου
  choice: أمامه
  rationale: تعبير عربي موجز يحفظ العلاقة المكانية أو التقدمية في الأصل، ويفهم في السياق على أنه أُرسل متقدمًا عليه وممهِّدًا له.
theological_decisions:
- issue: دلالة ὁ χριστός بوصفه لقبًا
  choice: المسيح
  alternative: الممسوح
  rationale: «المسيح» هو المقابل العربي الراسخ للقب، ويفيد في السياق الشخصية المنتظرة التي ينفي يوحنا أن يكونها؛ أما «الممسوح» فيوضح الاشتقاق لكنه أقل طبيعية هنا.
- issue: القوة الزمنية والحالية لعبارة Ἀπεσταλμένος εἰμὶ
  choice: أنا مُرسَلٌ أمامه
  alternative: قد أُرسلتُ أمامه / أُرسلتُ قبله
  rationale: الصياغة المختارة تبقي التوتر بين فعل الإرسال السابق والصفة أو المهمة القائمة الآن، ولا تختزل البناء اليوناني في زمن واحد؛ وتوضح الحاشية البدائل الممكنة.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعملت «لستُ أنا» للمحافظة على توكيد الضمير في النفي، و«أنا مُرسَلٌ» لإبراز المقابلة بين هوية المسيح ومهمة يوحنا. وُضع مؤشر الحاشية بعد الاقتباس لأنه يتناول العبارة الأخيرة كلها.
