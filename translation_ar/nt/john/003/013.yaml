lexical_decisions:
- source_word: οὐδεὶς
  choice: أحد
  rationale: مع أداة النفي «لم» تؤدي العبارة معنى النفي الشامل بصورة عربية طبيعية، من غير تقييد الدلالة بالذكور.
- source_word: ἀναβέβηκεν
  choice: يصعد
  rationale: جاء الفعل بعد «لم» ليعبّر في العربية عن فعل منفي مكتمل، ويحافظ «يصعد» على المقابلة اللفظية مع «نزل» وعلى السجل الرفيع المناسب للسياق.
- source_word: εἰς τὸν οὐρανόν
  choice: إلى السماء
  rationale: «إلى» هي الصياغة العربية الطبيعية للحركة باتجاه السماء، وتحافظ على التقابل مع «من السماء».
- source_word: εἰ μὴ
  choice: إلا
  rationale: أداة الاستثناء العربية المباشرة التي تحدد الاستثناء الوحيد بعد النفي.
- source_word: ὁ ἐκ τοῦ οὐρανοῦ καταβάς
  choice: الذي نزل من السماء
  rationale: تنقل التركيب الوصفي الاسمي بوضوح، وتحافظ على فعل النزول وعلى مقابلة الصعود والنزول. ويمكن فهم الفعل أيضًا بمعنى «أتى نازلًا»، وهو مذكور في الحاشية.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ابن الإنسان
  rationale: الصياغة العربية الراسخة لهذا اللقب في الأناجيل، وتحفظ صداه مع دانيال 7 من غير تحويله إلى تعبير تفسيري عام.
theological_decisions:
- issue: الدلالة المسيحانية لعبارة «ابن الإنسان»
  choice: إبقاء اللقب «ابن الإنسان» كما هو من غير إعادة صياغته تفسيرياً.
  alternative: الإنسان أو الكائن البشري
  rationale: يحمل التعبير في السياق اليوحناوي دلالة لقبية وصدى رؤيوياً، وإبقاؤه يحفظ التوتر بين صيغته البشرية ودلالته المسيحانية.
- issue: الدلالة الزمنية لصعود ابن الإنسان ونزوله
  choice: ترجمة الفعلين بصيغة «لم يصعد» و«نزل» من غير إضافة تفسير زمني أو عقائدي.
  alternative: لم يذهب إلى السماء ... جاء من السماء
  rationale: تحفظ الصياغة دعوى النص عن الأصل السماوي والوصول الفريد، مع إبقاء المقابلة الصريحة بين الصعود والنزول وعدم شرح كيفية الإسناد أو توقيته.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدمت «لم يصعد» بدل تركيب أثقل من قبيل «ما من أحد قد صعد»، مع الحفاظ على النفي الشامل والتقابل بين الصعود والنزول. وُضعت علامتا الحاشية بعد اللقب بحسب موضعهما في طبقة الاستشارة الإنجليزية.
