  text: Ἐγένετο οὖν ζήτησις ἐκ τῶν μαθητῶν Ἰωάννου μετὰ Ἰουδαίου περὶ καθαρισμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/025.yaml
  text: Then a dispute arose between John's disciples and a Jew about purification[a].
translation:
  language: ar
  text: فحدثت مناقشة بين بعض تلاميذ يوحنا ويهوديّ حول التطهير[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «التنقية»، وربما يُقصَد التطهير الشعائري. فاللفظ اليوناني عام، لكنه يحمل على الأرجح دلالة طقسية في هذا السياق.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο οὖν
  choice: فحدثت
  rationale: ينقل وقوع الحدث واستمرار السرد، وتؤدي الفاء وظيفة οὖν الانتقالية من غير أن تبالغ في إفادة نتيجة منطقية صريحة.
- source_word: ζήτησις
  choice: مناقشة
  rationale: يمكن أن تدل الكلمة على بحث أو مناقشة تنطوي على خلاف. و«مناقشة» تحفظ احتمال الجدل دون أن تفترض خصومة حادة لا يصرح بها النص.
- source_word: ἐκ τῶν μαθητῶν Ἰωάννου
  choice: بين بعض تلاميذ يوحنا
  rationale: حرفيًا «من تلاميذ يوحنا»، وهو يوحي بأن المشاركين كانوا من جماعتهم لا جميع التلاميذ؛ لذا يوضح «بعض» هذا المعنى الضمني الطبيعي في العربية.
- source_word: μετὰ Ἰουδαίου
  choice: ويهوديّ
  rationale: تحفظ صيغة المفرد والنكرة، ويقتضي تركيب «بين» العربي عطف الطرف الثاني بالواو.
- source_word: περὶ καθαρισμοῦ
  choice: حول التطهير
  rationale: «التطهير» يقابل καθαρισμός ويحفظ إمكان الدلالة العامة على التنقية مع الإيحاء الطقسي المرجح في السياق، من غير تقييده صراحة بالشعائر.
theological_decisions:
- issue: هل يُصرَّح بأن καθαρισμός تطهير طقسي؟
  choice: التطهير
  alternative: الاغتسال / التطهير الطقسي
  rationale: السياق القريب يرجح صلة الأمر بالتطهير الديني أو الشعائري، لكن الآية لا تحدد نوعه؛ لذلك تُبقي الصياغة العامة التوتر الدلالي وتشرح الحاشية الاحتمال الطقسي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. اختيرت «مناقشة» بدل «نزاع» لتجنب تشديد درجة الخصومة، وأُبقي «التطهير» عامًا مع بيان الاحتمال الطقسي في الحاشية.
