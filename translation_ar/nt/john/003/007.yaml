base_translation:
  language: en
  yaml_path: translation/nt/john/003/007.yaml
  text: Do not be amazed that I told you[b][a], ‘You must be born from above.’
translation:
  language: ar
  text: 'لا تتعجب من أني قلت لكَ[b]: «لا بد أن تولدوا من فوق[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «من جديد». يمكن للكلمة اليونانية ἄνωθεν أن تعني «من فوق» أو «من جديد».'
    reason: alternative_reading
  - marker: b
    text: «لكَ» هنا للمفرد، أما «تولدوا» فللجمع في اليونانية.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ θαυμάσῃς
  choice: لا تتعجب
  rationale: النهي بـ μή مع صيغة الماضي الاحتمالية يفيد الكف عن التعجب، و«لا تتعجب» تعبير عربي فصيح وطبيعي يحفظ قوة الفعل دون تكلف.
- source_word: ὅτι
  choice: لأني
  rationale: يمكن أن تدخل ὅτι هنا على مضمون القول أو تبين سبب التعجب. والصياغة العربية «لأني قلت» طبيعية في هذا السياق، ولا تغير مضمون العبارة المقتبسة.
- source_word: εἶπόν σοι
  choice: قلت لكَ
  rationale: ينقل الفعل مع ضمير المخاطب المفرد نقلًا مباشرًا، ويتيح إظهار التباين العددي مع ضمير الجمع اللاحق.
- source_word: Δεῖ
  choice: لا بد أن
  rationale: تؤدي معنى الضرورة الذي يفيده Δεῖ بعبارة عربية واضحة وقوية.
- source_word: ὑμᾶς
  choice: تولدوا
  rationale: أُثبتت صيغة جمع المخاطبين في الفعل العربي، خلافًا لضمير المفرد في «لكَ»، وبذلك يظهر التحول العددي الموجود في اليونانية.
- source_word: γεννηθῆναι
  choice: تولدوا
  rationale: البناء للمجهول في المصدر اليوناني يُنقل طبيعيًا إلى العربية بالفعل المبني للمجهول «تولدوا»، وهو الأنسب في سياق حديث الولادة.
- source_word: ἄνωθεν
  choice: من فوق
  rationale: يحفظ المعنى المكاني، أي الأصل العلوي أو السماوي، مع إثبات معنى «من جديد» الممكن لغويًا في الحاشية كي لا يزول التعدد الدلالي المقصود في الحوار.
theological_decisions:
- issue: معنى ἄνωθεν في قول الولادة
  choice: من فوق
  alternative: من جديد
  rationale: للكلمة اليونانية دلالتا «من فوق» و«من جديد». يرجح الاستعمال اليوحناوي وسياق الولادة الآتية من الله معنى «من فوق» في المتن، مع إبقاء الدلالة الأخرى في الحاشية حفاظًا على الغموض الدلالي والتوتر المقصودين في الحوار.
- issue: انتقال الخطاب من المفرد إلى الجمع
  choice: إظهار المفرد في «لكَ» والجمع في «تولدوا»
  alternative: تسوية الخطاب كله على المفرد في العربية
  rationale: النص اليوناني يخاطب نيقوديموس بالمفرد أولًا ثم يستعمل الجمع في ضرورة الولادة، وقد يكون لهذا الاتساع دلالة تتجاوز شخصه؛ لذلك حُفظ التباين ولم يُسوَّ.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعملت «لا بد أن» لإفادة الضرورة بصورة طبيعية، وأُظهر الفرق بين المخاطب المفرد والجمع في صيغ العربية نفسها. وُضعت علامتا الحاشيتين عند اللفظين اللذين تشرحانهما مباشرة.
