  source_fidelity: 'المعنى الأساسي منقول بأمانة: استمرار تعميد يوحنا، وقرب الموضع من ساليم، والعلة المرتبطة بـ«مياه كثيرة»، واستمرار مجيء الناس واعتمادهم. لكن كتابة اسم الموضع «عين نون» توحي بأنه اسمان أو تركيب عربي، في حين أن Αἰνὼν اسم موضع واحد، والأوضح تعريبه «أينون» (أو «عينون»).'
