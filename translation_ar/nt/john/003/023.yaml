  terminology: «يُعمِّد/يعتمدون» مصطلحان عربيان كنسيان مستقران ويحافظان على الفرق بين فعل المعمِّد وتلقّي المعمودية، من دون تقرير طريقة إجرائها. ينبغي أن تشير الحاشية إلى الصيغتين العربيتين بحسب موضعها، لا إلى «يُعمِّد» وحدها عند علامة موضوعة على «يعتمدون».
