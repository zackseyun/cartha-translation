  text: John also was baptizing at Aenon near Salim[a], because there were many waters there[b], and people were coming and being baptized.
translation:
  language: ar
  text: وكان يوحنا أيضًا يُعمِّد في أينون بالقرب من ساليم، لأن هناك مياهًا كثيرة[a]. وكانوا يأتون ويعتمدون[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «لأن مياهًا كثيرة كانت هناك»؛ وقد يفيد التعبير أيضًا وفرة الماء.'
    reason: lexical_alternative
  - marker: b
    text: يمكن أيضًا ترجمة الفعلين «يُعمِّد/يعتمدون» بـ«يُغطِّس/يُغطَّسون»، لكن أُبقي المصطلح المعروف، وهو لا يحسم في ذاته كيفية إجراء المعمودية.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ καὶ ὁ Ἰωάννης βαπτίζων
  choice: وكان يوحنا أيضًا يُعمِّد
  rationale: تنقل «كان... يُعمِّد» معنى الصيغة الدالة على نشاط مستمر في الماضي، وتؤدي الواو انتقال δέ الخفيف، بينما تنقل «أيضًا» καί.
- source_word: ἐν Αἰνὼν ἐγγὺς τοῦ Σαλείμ
  choice: في عين نون بالقرب من ساليم
  rationale: استُخدمت صيغة عربية واضحة لاسمي الموضعين، مع «بالقرب من» للدلالة على القرب المكاني.
- source_word: ὅτι ὕδατα πολλὰ ἦν ἐκεῖ
  choice: لأن مياهًا كثيرة كانت هناك
  rationale: يحافظ التعبير على جمع ὕδατα وعلى العلاقة السببية، مع بقاء العبارة طبيعية في العربية.
- source_word: παρεγίνοντο
  choice: كان الناس يأتون
  rationale: يفيد الفعل الناقص اليوناني مجيئًا متكررًا أو مستمرًا؛ وأُظهر الفاعل العام «الناس» لسلامة العربية ووضوحها.
- source_word: ἐβαπτίζοντο
  choice: يعتمدون
  rationale: يحافظ المبني للمجهول العربي على كونهم متلقين للمعمودية، ويوافق الفعل المستمر السابق.
theological_decisions:
- issue: ترجمة βαπτίζω
  choice: يُعمِّد / يعتمدون
  alternative: يُغطِّس / يُغطَّسون
  rationale: «عمّد» هو المصطلح الديني العربي المستقر، ولا يحسم وحده كيفية إجراء المعمودية؛ لذلك حُفظ البديل الأكثر تحديدًا في الحاشية دون فرض موقف طائفي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حُفظت البنية السردية واستمرارية الأفعال الماضية، وتجنبت الصياغة تقرير كيفية المعمودية. وُضع كل مؤشر حاشية في المتن عند العبارة التي يشرحها.
