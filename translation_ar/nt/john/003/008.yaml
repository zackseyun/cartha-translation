source:
  edition: SBLGNT
  text: τὸ πνεῦμα ὅπου θέλει πνεῖ, καὶ τὴν φωνὴν αὐτοῦ ἀκούεις, ἀλλ’ οὐκ οἶδας πόθεν ἔρχεται καὶ ποῦ ὑπάγει· οὕτως ἐστὶν πᾶς ὁ γεγεννημένος ἐκ τοῦ πνεύματος.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/008.yaml
  text: The wind blows where it wishes[a], and you hear its sound, but you do not know where it comes from and where it goes[b]. So it is with everyone who has been born of the Spirit.
translation:
  language: ar
  text: الرِّيحُ[a] تَهُبُّ حَيْثُ تَشَاءُ، وَتَسْمَعُ صَوْتَهَا[b]، لَكِنَّكَ لَا تَعْرِفُ مِنْ أَيْنَ تَأْتِي وَإِلَى أَيْنَ تَذْهَبُ. هَكَذَا يَكُونُ كُلُّ مَنْ وُلِدَ مِنَ الرُّوحِ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن للكلمة اليونانية المترجمة هنا «الريح» أن تعني أيضًا «الروح». وهي الكلمة نفسها المترجمة «الروح» في آخر الآية، فينشأ تلاعب لفظي لا يمكن نقله كاملًا إلى العربية.
    reason: lexical_alternative
  - marker: b
    text: يمكن أن تعني الكلمة اليونانية أيضًا «صوتًا»؛ لكنها تشير هنا إلى الأثر المسموع للريح.
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα (v. 8a)
  choice: الرِّيح
  rationale: اقتران الكلمة بالفعل πνεῖ «تهبّ» وبسماع صوتها يرجّح المعنى الحسي «الريح»، مع إبراز التلاعب الدلالي بينها وبين «الروح» في آخر الآية بواسطة حاشية.
- source_word: ὅπου θέλει
  choice: حيث تشاء
  rationale: تعبير عربي طبيعي يحفظ دلالة الإرادة والتشخيص البلاغي في اليونانية.
- source_word: πνεῖ
  choice: تهبّ
  rationale: هو الفعل العربي المألوف لهبوب الريح، ويحفظ الصورة الجوية بوضوح.
- source_word: φωνήν
  choice: صوتها
  rationale: «الصوت» يشمل الأثر المسموع للريح، ويحفظ شيئًا من إمكان معنى «الصوت/الصوت المنطوق» في اللفظة اليونانية دون مبالغة في تشخيص الريح.
- source_word: οὐκ οἶδας πόθεν ἔρχεται καὶ ποῦ ὑπάγει
  choice: لا تعرف من أين تأتي وإلى أين تذهب
  rationale: صياغة عربية مباشرة وطبيعية تحافظ على التقابل بين المنشأ والوجهة.
- source_word: οὕτως ἐστὶν
  choice: هكذا
  rationale: ينقل بإيجاز قوة التشبيه والتطبيق اللذين تدل عليهما العبارة اليونانية.
- source_word: πᾶς ὁ γεγεννημένος
  choice: كل من وُلِدَ
  rationale: ينقل البناء الاسمي العام، ويعبّر الماضي المبني للمجهول عن الولادة الواقعة، وإن لم يُظهر وحده كامل دلالة الحالة الناتجة في اسم الفاعل التام اليوناني.
- source_word: ἐκ τοῦ πνεύματος (v. 8b)
  choice: من الروح
  rationale: «من» تنقل ἐκ بوصفها دالة على المصدر أو المنشأ، و«الروح» في سياق الولادة الجديدة تشير إلى روح الله.
theological_decisions:
- issue: تكرار πνεῦμα مع اختلاف المعنى بين شطري الآية
  choice: ترجمة الأولى «الريح» والأخيرة «الروح»
  alternative: ترجمة اللفظتين بكلمة واحدة، أو جعل الأولى «الروح»
  rationale: السياق الأول، ولا سيما فعل «تهبّ» والصوت المسموع، يدل على الريح؛ أما سياق الولادة في آخر الآية فيدل على الروح. ولأن العربية لا تستطيع هنا إبقاء المعنيين بلفظة طبيعية واحدة، فُرِّق بينهما في المتن مع توضيح التلاعب اللفظي في الحاشية.
- issue: هوية «الروح» في عبارة الولادة
  choice: إبقاء «الروح» في المتن دون إضافة «القدس»
  alternative: «الروح القدس» أو «روح الله»
  rationale: السياق اللاهوتي يشير إلى روح الله، لكن النص اليوناني يقول «الروح» فقط؛ لذا يحفظ المتن صيغته ولا يضيف وصفًا تفسيريًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة، مع ألفاظ مألوفة وصياغة مباشرة. استُخدمت «تشاء» للمحافظة على التشخيص البلاغي، و«من الروح» للمحافظة على دلالة المصدر في ἐκ. جميع علامات الحواشي مثبتة في المتن.
