  terminology: «الريح» و«الروح» اختياران دقيقان للسياق ويحافظان على المقابلة المقصودة، و«من الروح» يحفظ دلالة المصدر في ἐκ دون إضافة «القدس» غير الموجودة في النص. ينبغي أن توضّح الحاشيتان التلاعب في πνεῦμα والبديل المعجمي لـ φωνή على موضعيهما المناسبين.
