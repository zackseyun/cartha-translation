lexical_decisions:
- source_word: Ἦν δὲ
  choice: وكان
  rationale: تؤدي الواو وظيفة δέ بوصفها أداة ربط خفيفة تنقل السرد إلى شخصية جديدة، ويؤدي «كان» معنى ἦν، من غير إدخال ظرف زمني غير موجود في الأصل.
- source_word: ἄνθρωπος
  choice: رجلٌ
  rationale: يشير الاسم هنا إلى شخص ذكر بعينه، لذلك فـ«رجل» ترجمة دقيقة وطبيعية.
- source_word: ἐκ τῶν Φαρισαίων
  choice: من الفريسيين
  rationale: تحافظ «من» على دلالة الانتماء إلى جماعة الفريسيين، وهي صياغة عربية واضحة ومباشرة.
- source_word: Νικόδημος ὄνομα αὐτῷ
  choice: اسمه نيقوديموس
  rationale: تنقل العبارة الاصطلاحية اليونانية الدالة على الاسم بصياغة عربية طبيعية وموجزة.
- source_word: ἄρχων
  choice: أحد رؤساء
  rationale: يدل اللفظ على شخص ذي سلطة. وصيغة «أحد رؤساء» طبيعية في العربية، وتحفظ كونه واحدًا من أصحاب القيادة من غير الجزم بمنصب مؤسسي محدد.
- source_word: τῶν Ἰουδαίων
  choice: اليهود
  rationale: يناسب السياق معنى الجماعة اليهودية وقيادتها، مع إبقاء احتمال الدلالة على أهل اليهودية أو السلطات اليهودية في الحاشية.
theological_decisions:
- issue: دلالة Ἰουδαίων في السياق اليوحناوي
  choice: اليهود
  alternative: أهل اليهودية؛ السلطات اليهودية
  rationale: يمكن للمصطلح في إنجيل يوحنا أن يحمل دلالة قومية أو دينية أو إقليمية، وقد يشير في بعض السياقات إلى القيادات. ولأن نيقوديموس فريسي وصاحب سلطة، اختير اللفظ الأوسع «اليهود»، مع حفظ الاحتمالات الأضيق في الحاشية دون حسم ما يبقيه الأصل مفتوحًا.
