  register: لغة عربية فصحى معاصرة واضحة ووقورة. استُخدمت الواو لربط الجملة بالسياق السابق، وجاء التركيب «أحد رؤساء» لتجنب عبارة حرفية ثقيلة ولعدم تحديد هيئة حاكمة بعينها لا يصرح بها النص.
