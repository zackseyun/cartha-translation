base_translation:
  language: en
  yaml_path: translation/nt/john/003/010.yaml
  text: Jesus answered and said to him[a], “You are the teacher of Israel, and you do not know these things?”
translation:
  language: ar
  text: 'أجاب يسوع وقال له: «أأنتَ معلّم إسرائيل[a]، ولا تعرف هذه الأمور؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا أن تُفهم العبارة: «أأنتَ معلّمًا من معلّمي إسرائيل؟» لكن اليونانية تستعمل أداة التعريف مع «المعلّم»، مما يُضفي على الخطاب نبرةً بلاغيةً حادّة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη ... καὶ εἶπεν αὐτῷ
  choice: أجاب ... وقال له
  rationale: يحافظ على الصيغة السردية اليونانية ذات الفعلين مع بقاء العبارة عربية واضحة وطبيعية.
- source_word: Σὺ
  choice: أأنتَ
  rationale: أُبرز الضمير كما في اليونانية، وصيغ الاستفهام بالهمزة لإظهار النبرة الاستنكارية الموجّهة إلى نيقوديموس.
- source_word: ὁ διδάσκαλος
  choice: معلّم
  rationale: العربية لا تستعمل أداة تنكير، وإضافة «إسرائيل» تجعل الاسم معرّفًا، فتحفظ قوة أداة التعريف اليونانية من غير صياغة متكلّفة.
- source_word: τοῦ Ἰσραὴλ
  choice: إسرائيل
  rationale: الإضافة «معلّم إسرائيل» تنقل المضاف إليه اليوناني وتحافظ على دلالة الانتماء والصفة التمثيلية، لا مجرد الموقع الجغرافي.
- source_word: ταῦτα
  choice: هذه الأمور
  rationale: تعبير عربي طبيعي يشير إلى مجمل ما سبق من تعليم، مع إبقاء المرجع واسعًا.
- source_word: γινώσκεις
  choice: تعرف
  rationale: ينقل المعنى الأساسي للفعل بشفافية، مع أن السياق يتضمن معنى الإدراك والفهم.
theological_decisions:
- issue: قوة خطاب يسوع لنيقوديموس بعبارة ὁ διδάσκαλος τοῦ Ἰσραὴλ
  choice: «معلّم إسرائيل» مع إبراز الضمير وصيغة الاستفهام الاستنكاري
  alternative: «معلّمًا في إسرائيل» أو «واحدًا من معلّمي إسرائيل»
  rationale: الإضافة العربية تعرّف «معلّم»، فتوافق «المعلّم» في اليونانية وتحفظ الحدة البلاغية من غير أن تقرر أنه المعلّم الوحيد في إسرائيل.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعملت «أأنتَ» لإبراز الضمير والاستفهام، وحُفظت الصيغة السردية «أجاب ... وقال له». وُضع مؤشر الحاشية بعد الاقتباس كله لأنه يشرح العبارة الواقعة داخله.
