  text: What is born of the flesh is flesh[b][a], and what is born of the Spirit is spirit.
translation:
  language: ar
  text: ما وُلِدَ من الجسد فهو جسدٌ[a]، وما وُلِدَ من الروح فهو روحٌ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أن يُفهم أيضًا: «ما وُلِدَ من الجسد فهو طبيعة بشرية». وقد تدل الكلمة اليونانية المترجمة «الجسد» في سياقات أخرى على الطبيعة البشرية الساقطة أو الخاطئة، لكن المقابلة هنا أساسًا مع الولادة من الروح.'
    reason: lexical_alternative
  - marker: b
    text: 'أي يمكن التعبير عن المعنى: «فهو روحي». ويقول اليوناني حرفيًا: «فهو روح»، محافظًا على مقابلة كيفية مع «جسد».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ γεγεννημένον
  choice: ما وُلِدَ
  rationale: يحافظ اسم الموصول «ما» مع الفعل المبني للمجهول على الدلالة العامة غير المحصورة في شخص بعينه، وينقل معنى اسم المفعول اليوناني في صياغة عربية طبيعية.
- source_word: ἐκ
  choice: من
  rationale: تفيد «من» المصدر أو المنشأ في سياق الولادة، وهي المقابل العربي الطبيعي هنا.
- source_word: σάρξ / σαρκὸς
  choice: الجسد / جسد
  rationale: يحفظ لفظ «الجسد» صورة النص والمقابلة مع «الروح»، من غير أن يضيّق المعنى إلى «الطبيعة الخاطئة». وجاء الخبر «جسد» نكرة موافقة للطابع الكيفي للعبارة اليونانية.
- source_word: πνεύματος / πνεῦμά
  choice: الروح / روح
  rationale: تدل «الروح» المعرّفة في العبارة الأولى، بحسب السياق، على روح الله بوصفه مصدر الولادة؛ أما «روح» في الخبر فنكرة تحفظ الدلالة الكيفية من غير مساواتها صراحةً بالروح نفسه أو تحويل الاسم إلى الصفة «روحي».
- source_word: ἐστιν
  choice: فهو
  rationale: تؤدي الفاء مع الضمير وظيفة الربط الخبري في العربية، وتحفظ البنية الحكمية الموجزة بصورة أفصح من تكرار فعل الكينونة.
theological_decisions:
- issue: دلالة σάρξ في الجملة الأولى
  choice: الجسد بوصفه مجال الولادة البشرية الطبيعية
  alternative: الطبيعة الخاطئة
  rationale: المقابلة المباشرة هنا هي بين الولادة من الجسد والولادة من الروح. واختيار «الطبيعة الخاطئة» يفرض معنى أخلاقيًا أضيق لا يوجبه السياق.
- issue: مرجع πνεῦμα في خبر الجملة الثانية
  choice: روح، بصيغة نكرة ذات دلالة كيفية
  alternative: هو الروح؛ أو هو روحي
  rationale: المصدر اليوناني يقول حرفيًا «هو روح» بلا أداة تعريف في الخبر. وتحفظ النكرة العربية التمييز بين الروح بوصفه مصدر الولادة وما تتصف به نتيجة هذه الولادة، من غير حسم زائد.
translation_notes:
  register: صياغة عربية فصحى حديثة، موجزة وذات إيقاع حكمي. استُخدمت حركات محدودة في «وُلِدَ» لمنع التباس المبني للمجهول، وحُفظت مقابلة «الجسد/جسد» مع «الروح/روح» كما في المصدر.
