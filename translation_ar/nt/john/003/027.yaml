  text: ἀπεκρίθη Ἰωάννης καὶ εἶπεν· Οὐ δύναται ἄνθρωπος λαμβάνειν ⸂οὐδὲ ἓν⸃ ἐὰν μὴ ᾖ δεδομένον αὐτῷ ἐκ τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/027.yaml
  text: John answered and said[a], “A man is not able to receive even one thing unless it has been given to him from heaven.”
translation:
  language: ar
  text: 'فأجاب يوحنا وقال: «لا يقدر إنسان أن ينال شيئًا واحدًا، ما لم يكن قد أُعطي له من السماء».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη Ἰωάννης καὶ εἶπεν
  choice: فأجاب يوحنا وقال
  rationale: يحافظ على صيغة السرد اليونانية المزدوجة «أجاب وقال»، مع استعمال الفاء لربط الجواب طبيعيًا بالسياق السابق.
- source_word: Οὐ δύναται
  choice: لا يقدر
  rationale: تعبير عربي فصيح وطبيعي ينقل معنى القدرة المنفية بوضوح.
- source_word: ἄνθρωπος
  choice: إنسان
  rationale: ينقل الاسم المفرد ذي الدلالة العامة من غير قصره على الذكور، وهو الاستعمال الطبيعي في العربية الفصحى المعاصرة.
- source_word: λαμβάνειν
  choice: أن ينال
  rationale: «ينال» يلائم هنا معنى تلقي ما يُمنح، ويبقي مجال الدلالة واسعًا ليشمل المقام أو الخدمة أو غيرهما بحسب السياق.
- source_word: οὐδὲ ἓν
  choice: شيئًا
  rationale: في سياق النفي، تفيد «شيئًا» العموم المقصود في العبارة اليونانية، مع تجنب صياغة عربية متكلفة مثل «ولا شيئًا واحدًا».
- source_word: ἐὰν μὴ
  choice: ما لم
  rationale: أداة شرط واستثناء عربية طبيعية ودقيقة في هذا السياق.
- source_word: ᾖ δεδομένον αὐτῷ
  choice: يكن قد أُعطي له
  rationale: ينقل التركيب التام المبني للمجهول بوصفه عطاءً سابقًا ذا نتيجة قائمة، ويحافظ على ذكر متلقي العطاء.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: من السماء
  rationale: يحفظ الصورة الأصلية ومصدر العطاء السماوي دون تفسيرها صراحة بعبارة «من الله».
theological_decisions:
- issue: مدى مبدأ العطاء من السماء
  choice: 'الإبقاء على العبارة عامة: لا ينال الإنسان شيئًا إلا إذا أُعطي له من السماء.'
  alternative: حصر القول في أدوار الخدمة والسلطان الروحي في السياق المباشر، أو توسيعه ليقرر حتمية شاملة لكل أفعال البشر.
  rationale: السياق يتعلق بخدمة يوحنا ومكانة يسوع، لكن صياغة القول عامة. لذلك تحافظ الترجمة على هذا الاتساع والتوتر دون فرض مذهب في الحتمية أو نفي الفاعلية البشرية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حوفظ على الصيغة السردية «أجاب... وقال»، وعلى «السماء» بوصفها تعبيرًا عن المصدر الإلهي دون تفسير زائد.
