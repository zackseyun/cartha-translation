source:
  edition: SBLGNT
  text: οὗτος ἦλθεν πρὸς αὐτὸν νυκτὸς καὶ εἶπεν αὐτῷ· Ῥαββί, οἴδαμεν ὅτι ἀπὸ θεοῦ ἐλήλυθας διδάσκαλος· οὐδεὶς γὰρ ⸂δύναται ταῦτα τὰ σημεῖα⸃ ποιεῖν ἃ σὺ ποιεῖς, ἐὰν μὴ ᾖ ὁ θεὸς μετ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/002.yaml
  text: This man came to him by night and said to him[a], “Rabbi, we know that you have come from God as a teacher[c][b], for no one is able to do these signs that you do unless God is with him.”
translation:
  language: ar
  text: 'جاء هذا الرجل إليه ليلًا[a] وقال له: «يا رابي، نحن نعلم أنك أتيت من عند الله معلّمًا، لأنه لا يقدر أحد أن يصنع هذه الآيات[b] التي تصنعها أنت إن لم يكن الله معه[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في الليل». وقد يكون لذكر الليل أيضًا صدى موضوعي في إنجيل يوحنا، حيث قد يحمل الليل والظلام دلالة رمزية.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «هذه المعجزات الدالّة». تُترجم الكلمة اليونانية هنا «الآيات» للمحافظة على كون هذه الأعمال تشير إلى حقيقة تتجاوز العمل نفسه.'
    reason: lexical_alternative
  - marker: c
    text: 'يحافظ النص على صيغة الغائب في اليونانية: «إن لم يكن الله معه»، مع أن نيقوديموس كان يخاطب يسوع مباشرة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  choice: هذا الرجل
  rationale: يعيد اسم الإشارة إلى نيقوديموس المذكور في الآية السابقة، ويحفظ قوة الإشارة بصياغة عربية طبيعية.
- source_word: νυκτός
  choice: ليلًا
  rationale: تعبير عربي موجز وطبيعي عن زمن المجيء، مع إبقاء احتمال الصدى الرمزي لليل في إنجيل يوحنا من غير إدخاله في صلب الترجمة.
- source_word: Ῥαββί
  choice: يا رابي
  rationale: يحفظ اللقب اليهودي المنقول صوتيًا في النص اليوناني بدل تسويته إلى «يا معلّم»، مع أن دور التعليم مذكور صراحة بعده.
- source_word: οἴδαμεν
  choice: نحن نعلم
  rationale: يحفظ صيغة المتكلم الجمع ولا يحولها إلى المفرد، سواء أكان نيقوديموس يتكلم باسم جماعة أم يستخدم الجمع على نحو تمثيلي.
- source_word: ἀπὸ θεοῦ ἐλήλυθας
  choice: أتيت من عند الله
  rationale: يحفظ دلالة المجيء والمصدر الإلهي، ولا يضيف مفهوم الإرسال الصريح الذي لا يرد فعله هنا.
- source_word: διδάσκαλος
  choice: معلّمًا
  rationale: 'ينقل الخبر الدال على الدور أو الصفة في تركيب عربي مباشر: أتيت من عند الله معلّمًا.'
- source_word: ταῦτα τὰ σημεῖα
  choice: هذه الآيات
  rationale: «الآيات» مصطلح عربي كتابي طبيعي للأعمال الدالة التي تشير إلى حقيقة تتجاوز الفعل نفسه، ولا تختزلها في مجرد عجائب.
- source_word: ποιεῖν ἃ σὺ ποιεῖς
  choice: أن يصنع هذه الآيات التي تصنعها أنت
  rationale: يحفظ تكرار الفعل اليوناني ويبرز ضمير المخاطب كما في المصدر.
- source_word: ἐὰν μὴ ᾖ ὁ θεὸς μετ’ αὐτοῦ
  choice: إن لم يكن الله معه
  rationale: 'يحفظ الشرط وصيغة الغائب في كلام نيقوديموس بدل تحويلها إلى خطاب مباشر: «معك».'
theological_decisions:
- issue: دلالة σημεῖα في إنجيل يوحنا
  choice: الآيات
  alternative: المعجزات
  rationale: «الآيات» تحفظ كون الأعمال خارقة ودالّة في آن واحد، وتشير إلى هوية يسوع ورسالته من غير حصر المعنى في القدرة العجيبة.
- issue: الانتقال من المخاطب إلى الغائب في كلام نيقوديموس
  choice: إن لم يكن الله معه
  alternative: إن لم يكن الله معك
  rationale: النص اليوناني ينتقل من مخاطبة يسوع إلى صياغة عامة بضمير الغائب؛ إبقاء هذا الانتقال يصون نسيج العبارة واحتمال رسميتها الخطابية.
- issue: هل يفيد ἀπὸ θεοῦ ἐλήλυθας إرسالًا رسميًا؟
  choice: أتيت من عند الله
  alternative: أرسلك الله
  rationale: العبارة تثبت المجيء من عند الله، لكنها لا تستخدم هنا فعل الإرسال؛ لذلك لا تُزاد دلالة أقوى من منطوق النص.
translation_notes:
  register: العربية فصحى معاصرة واضحة ووقورة. حُفظ اللقب التاريخي «رابي»، وصيغة الجمع «نحن نعلم»، وتكرار فعل «يصنع»، والتحول المقصود من المخاطب إلى الغائب، مع تجنب تفسير الدلالات اللاهوتية المحتملة داخل المتن.
