lexical_decisions:
- source_word: ἀπεκρίθη
  choice: أجاب
  rationale: فعل حواري مألوف يفيد الرد، و«أجاب» ينقل وظيفته السردية بإيجاز وطبيعية.
- source_word: Νικόδημος
  choice: نيقوديموس
  rationale: نقل صوتي للاسم الشخصي وفق الصيغة العربية الكتابية الشائعة.
- source_word: εἶπεν αὐτῷ
  choice: وقال له
  rationale: يحافظ على الفعل والضمير الواردين في اليونانية، من غير استبدال الضمير باسم يسوع تفسيرًا.
- source_word: Πῶς
  choice: كيف
  rationale: أداة استفهام عن الكيفية أو الإمكان.
- source_word: δύναται
  choice: يمكن أن
  rationale: تعبير عربي طبيعي ينقل معنى القدرة أو الإمكان في هذا السياق.
- source_word: ταῦτα
  choice: هذه الأمور
  rationale: يحفظ صيغة الجمع والإشارة إلى ما سبق أن شرحه يسوع، وهو أفصح هنا من «هذه الأشياء».
- source_word: γενέσθαι
  choice: تحدث
  rationale: ينقل المعنى الحدثي للفعل γίνομαι، أي وقوع الأمور أو تحققها، بلغة عربية واضحة.
theological_decisions:
- issue: صياغة سؤال نيقوديموس عن تحقق الولادة الجديدة والحقائق التي وصفها يسوع
  choice: كيف يمكن أن تحدث هذه الأمور؟
  alternative: كيف يمكن أن تكون هذه الأمور؟ / كيف يمكن أن تصير هذه الأمور؟
  rationale: «تحدث» تنقل معنى الوقوع والتحقق بصورة طبيعية من غير شرح كيفية ذلك أو حسم الغموض اللاهوتي في السؤال. وتُذكر «تكون» في الحاشية لأنها احتمال معجمي موجز يحفظ اتساع معنى γίνομαι.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة. أُبقي التركيب الحواري «أجاب... وقال له» لتمثيل الصياغة اليونانية، مع اختيار «هذه الأمور» بوصفها إحالة طبيعية إلى الأقوال السابقة.
