  text: ὁ ἔχων τὴν νύμφην νυμφίος ἐστίν· ὁ δὲ φίλος τοῦ νυμφίου ὁ ἑστηκὼς καὶ ἀκούων αὐτοῦ, χαρᾷ χαίρει διὰ τὴν φωνὴν τοῦ νυμφίου. αὕτη οὖν ἡ χαρὰ ἡ ἐμὴ πεπλήρωται.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/029.yaml
  text: The one who has the bride is the bridegroom[a]. But the friend of the bridegroom, who stands and hears him, rejoices greatly because of the bridegroom’s voice[c][b]. Therefore this joy of mine has been made complete.
translation:
  language: ar
  text: مَن له العروس فهو العريس. وأمّا صديق العريس، الذي يقف ويسمعه، فيفرح فرحًا عظيمًا بسبب صوت العريس[a]. فهذا فرحي قد اكتمل[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «يفرح فرحًا بسبب صوت العريس»؛ وفي التعبير اليوناني توكيد لشدة الفرح بتكرار لفظين من أصل واحد.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «قد بلغ ملأه» أو «قد تمّ»؛ فاللفظ اليوناني يدل على بلوغ التمام أو الاكتمال.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων τὴν νύμφην
  choice: مَن له العروس
  rationale: يحافظ على تركيب الملكية في اليونانية وعلى صورة العرس، من غير أن يضيف تفسيرًا لهوية العروس.
- source_word: νυμφίος
  choice: العريس
  rationale: اللفظ العربي الطبيعي الواضح المقابل للعروس، ويحفظ الصورة العرسية المتكررة في الآية.
- source_word: φίλος τοῦ νυμφίου
  choice: صديق العريس
  rationale: ترجمة مباشرة لا تستبدل الصديق بدور ثقافي أدق مثل «الإشبين»، وهو أمر لا يصرّح به اللفظ اليوناني.
- source_word: ὁ ἑστηκὼς καὶ ἀκούων αὐτοῦ
  choice: الواقف الذي يسمعه
  rationale: ينقل هيئة الصديق القائم والحاضر، ويُبقي مفعول السماع شخصًا كما في الضمير اليوناني، من غير إضافة «صوته» قبل ورود الصوت صراحة.
- source_word: χαρᾷ χαίρει
  choice: يفرح فرحًا عظيمًا
  rationale: يعبّر بأسلوب عربي طبيعي عن التوكيد الناشئ من اجتماع الاسم والفعل المتجانسين.
- source_word: διὰ τὴν φωνὴν τοῦ νυμφίου
  choice: لصوت العريس
  rationale: تنقل اللام سببية διά مع النصب بإيجاز طبيعي، مع إبقاء «صوت العريس» صريحًا.
- source_word: αὕτη οὖν ἡ χαρὰ ἡ ἐμὴ
  choice: لذلك قد اكتمل فرحي هذا
  rationale: «لذلك» تحفظ الاستنتاج، و«فرحي هذا» تنقل الإشارة والتخصيص الشخصي بصياغة عربية سليمة.
- source_word: πεπλήρωται
  choice: قد اكتمل
  rationale: ينقل تمام الفرح وبلوغه الكمال بوصفه حالة ناتجة قائمة، من غير قصر المعنى على إتمام نبوة.
theological_decisions:
- issue: صورة العرس وموقع يوحنا المعمدان فيها
  choice: الإبقاء على العروس والعريس وصديق العريس من دون تحديد هوية العروس داخل الترجمة
  alternative: تفسير العروس صراحة بأنها الكنيسة أو شعب الله، أو تسمية الصديق «الإشبين»
  rationale: الآية تعرض صورة عرسية لكنها لا تعرّف العروس صراحة، كما أن «صديق العريس» أوسع من تعيين وظيفة ثقافية مخصوصة؛ لذا تُترك الاستنتاجات اللاهوتية والتاريخية للتفسير.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «العريس» لأنه الجاري طبيعيًا في العربية المعاصرة، مع الحفاظ على تكراره وعلى الصورة المجازية. وُضعت علامتا الحاشية في المتن عند عبارتيهما.
