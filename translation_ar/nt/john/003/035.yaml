lexical_decisions:
- source_word: ὁ πατὴρ
  choice: الآب
  rationale: في السياق اليوحناوي لقب شخصي لله في علاقته بالابن، لا مجرد إشارة إلى أب بشري.
- source_word: ἀγαπᾷ
  choice: يحب
  rationale: المضارع اليوناني يعبّر هنا طبيعيًا عن حقيقة قائمة مستمرة، ويؤديها المضارع العربي بوضوح.
- source_word: τὸν υἱόν
  choice: الابن
  rationale: يُستعمل في السياق لقبًا للمسيح في علاقته بالآب، من غير إضافة تفسير عقائدي إلى النص.
- source_word: πάντα
  choice: كلَّ شيء
  rationale: ينقل شمول الجمع المحايد اليوناني بعبارة عربية طبيعية وواضحة.
- source_word: δέδωκεν
  choice: قد دفع
  rationale: «قد» مع الماضي تشير إلى فعل تمّ وبقي أثره، محافظةً بقدر طبيعي في العربية على دلالة صيغة التام اليونانية.
- source_word: ἐν τῇ χειρὶ αὐτοῦ
  choice: إلى يده
  rationale: تعبير عربي مألوف مع «دفع» يدل على التسليم والائتمان بالسلطان أو الملك، مع بيان اللفظ الحرفي في الحاشية.
theological_decisions:
- issue: علاقة الآب بالابن
  choice: الإبقاء على اللقبين العلائقيين «الآب» و«الابن»
  alternative: صياغتهما بوصفهما قرابة بشرية عامة
  rationale: السياق يتحدث عن الله والابن بصفتهما الشخصيتين، ولا يقتضي تفسيرًا أو توسعًا عقائديًا إضافيًا.
- issue: شمول ما دُفع إلى الابن واستمرار نتيجته
  choice: «قد دفع كلَّ شيء»
  alternative: «دفع كل شيء» بلا أداة تحقيق، أو تفسير العبارة صراحةً بأنها سلطان مطلق
  rationale: تحافظ الصياغة على الشمول وعلى تمام الفعل مع بقاء نتيجته، من غير أن تحصر «كل شيء» في نوع معين أو تضيف تحديدًا غير مصرّح به.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. اختير «دفع إلى يده» لأنه طبيعي في العربية ويحافظ على صورة اليد ودلالة التسليم، مع إثبات البديل الحرفي في الحاشية.
