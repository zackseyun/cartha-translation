base_translation:
  language: en
  yaml_path: translation/nt/john/003/036.yaml
  text: The one who believes in the Son has eternal life; but the one who disobeys the Son will not see life, but the wrath of God remains on him.
translation:
  language: ar
  text: مَنْ يؤمن بالابن فله حياة أبدية، وأما مَنْ يعصي الابن[a] فلن يرى الحياة، بل غضب الله باقٍ عليه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يرفض أن يؤمن بالابن». يمكن أن يحمل الفعل اليوناني معنى رفض الإيمان، إلى جانب معنى العصيان.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πιστεύων εἰς τὸν υἱόν
  choice: مَنْ يؤمن بالابن
  rationale: اسم الفاعل المضارع المعرَّف يفيد شخصًا على وجه العموم، و«يؤمن بالابن» تعبير عربي طبيعي يدل على الإيمان والثقة الموجَّهين إليه.
- source_word: ἔχει ζωὴν αἰώνιον
  choice: فله حياة أبدية
  rationale: يحفظ المضارع معنى الامتلاك الحاضر، وتؤدي «حياة أبدية» المعنى الراسخ للعبارة في الاستعمال اليوحناوي.
- source_word: ὁ δὲ ἀπειθῶν τῷ υἱῷ
  choice: وأما مَنْ يعصي الابن
  rationale: يحفظ «يعصي» القوة المعجمية الأوسع للفعل ἀπειθέω، مع بقاء معنى رفض الإيمان ممكنًا في السياق ومذكورًا في الحاشية.
- source_word: οὐκ ὄψεται ζωήν
  choice: فلن يرى الحياة
  rationale: ترجمة مباشرة للتعبير اليوحناوي، وتحفظ صيغته الاستعارية وقوته المستقبلية بدل تسويته إلى مجرد عدم امتلاك الحياة.
- source_word: ἡ ὀργὴ τοῦ θεοῦ
  choice: غضب الله
  rationale: ينقل تركيب الإضافة بوضوح ولا يلطّف دلالة الحكم الإلهي الصريحة.
- source_word: μένει ἐπ’ αὐτόν
  choice: باقٍ عليه
  rationale: يحفظ المضارع معنى الاستمرار القائم، و«عليه» يقابل ἐπί في دلالة استقرار الغضب على الشخص.
theological_decisions:
- issue: دلالة ἀπειθῶν في مقابل πιστεύων
  choice: يعصي الابن
  alternative: يرفض أن يؤمن بالابن
  rationale: قد يدل الفعل على العصيان أو الامتناع عن الإيمان، والمقابلة مع «يؤمن» تستحضر المعنى الثاني. أُبقي المعنى الأوسع في المتن وسُجّل البديل في الحاشية حفاظًا على التوتر الدلالي.
- issue: الزمن في الحياة الأبدية وغضب الله
  choice: امتلاك الحياة الآن واستمرار الغضب الآن، مع نفي رؤية الحياة مستقبلًا
  alternative: قصر الحياة والغضب على المستقبل وحده
  rationale: الفعلان ἔχει وμένει مضارعان، بينما ὄψεται مستقبل؛ لذلك تحافظ الصياغة على الجمع بين الواقع الحاضر والأفق المستقبلي دون تسويتهما.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدمت «مَنْ» للعموم، و«فله» لتأكيد الامتلاك الحاضر بإيجاز، مع إبقاء «يرى الحياة» بوصفه تعبيرًا يوحناويًا مقصودًا.
