lexical_decisions:
- source_word: ὁ λαβὼν
  choice: ومَن قَبِلَ
  rationale: اسم الفاعل المسبوق بأداة التعريف مستعمل استعمالًا اسميًّا عامًا؛ وهذه الصياغة العربية تفيد كل من يقبل الشهادة، وتحافظ بصيغة الماضي على المنظور التام بالنسبة إلى الفعل الرئيس.
- source_word: αὐτοῦ
  choice: شهادته
  rationale: الضمير يعود بحسب السياق إلى الآتي من فوق، أي الابن الذي يدور الكلام على شهادته، والضمير المتصل هو التعبير العربي الطبيعي.
- source_word: τὴν μαρτυρίαν
  choice: شهادته
  rationale: «الشهادة» تنقل المعنى القانوني والشهودي البارز في إنجيل يوحنا، وتلائم كونها شيئًا يُقبَل.
- source_word: ἐσφράγισεν
  choice: فقد صدَّق على
  rationale: الفعل يعني حرفيًّا وضع الختم، ويُستعمل هنا مجازًا بمعنى الإثبات أو الإقرار الرسمي. «صدَّق على» تعبير عربي واضح ينقل قوة المجاز، مع حفظ الصورة الحرفية في الحاشية.
- source_word: ὅτι
  choice: أن
  rationale: تدخل على مضمون ما أقرّ به الشخص، لا على جملة سببية.
- source_word: ὁ θεὸς
  choice: الله
  rationale: فاعل معرف واضح، ولا موجب لإضافة توكيد غير موجود في الأصل.
- source_word: ἀληθής
  choice: صادق
  rationale: في هذا السياق يدل الوصف على صدق الله وموثوقية شهادته. «صادق» أوضح في العربية عند وصف شخص، مع بقاء صلة العبارة بموضوع الحق والصدق في يوحنا.
theological_decisions:
- issue: القوة المجازية للغة الختم
  choice: «فقد صدَّق على» في المتن
  alternative: «فقد ختم بأن الله صادق» أو «وضع ختمه مؤكدًا أن الله صادق»
  rationale: قبول شهادة الابن يُعرض بوصفه إقرارًا بصدق الله. تنقل الصياغة المختارة وظيفة الختم بلغة عربية حديثة واضحة، بينما تحفظ الحاشية الصورة الأصلية المهمة.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعملت «صدَّق على» لا «شهد» لتجنب تكرار جذر الشهادة وللتعبير عن التصديق الرسمي الكامن في صورة وضع الختم. وُضعت علامة الحاشية مباشرة بعد العبارة التي تشرحها.
