  text: καὶ ⸂πολλοὶ ἐπίστευσαν εἰς αὐτὸν ἐκεῖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/042.yaml
  text: And many believed in him there.
translation:
  language: ar
  text: وآمن به كثيرون هناك.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: وَ
  rationale: حرف عطف يربط هذه الجملة بالسياق القصصي السابق، و«وَ» هي المقابل العربي المباشر الأقل تفسيرًا.
- source_word: πολλοὶ
  choice: كثيرون
  rationale: صفة جمع مذكر مستعملة استعمال الاسم، وتشير إلى أشخاص كثيرين. «كثيرون» موجزة وطبيعية ولا تحتاج إلى إضافة «من الناس».
- source_word: ἐπίστευσαν
  choice: آمن
  rationale: فعل ماضٍ يدل هنا على وقوع الإيمان، و«آمن» هو المقابل العربي المباشر من غير إضافة دلالة البدء التي قد توحي بها صياغة «ابتدأوا يؤمنون».
- source_word: εἰς αὐτόν
  choice: به
  rationale: تركيب πιστεύω εἰς يدل على إيمان موجَّه إلى شخص وثقة به. والتعبير العربي المألوف هو «آمن به»، ويحفظ المعنى من غير توسع تفسيري.
- source_word: ἐκεῖ
  choice: هناك
  rationale: ظرف مكان يحافظ على التشديد السردي على الموضع الذي وقع فيه الإيمان.
theological_decisions:
- issue: ترجمة πιστεύω εἰς αὐτόν في سياق الإيمان بيسوع
  choice: آمن به
  alternative: وضعوا ثقتهم فيه
  rationale: «آمن به» تنقل بصورة طبيعية ومباشرة الإيمان الموجَّه إلى يسوع، وتحفظ القوة اللاهوتية للعبارة من غير أن تستبدل لفظ الإيمان بشرح تفسيري أوسع.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة وموجزة وكريمة النبرة، مع الحفاظ على ترتيب المعنى اليوناني الطبيعي في العربية.
