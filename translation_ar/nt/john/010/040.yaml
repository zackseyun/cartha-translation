  text: Καὶ ἀπῆλθεν πάλιν πέραν τοῦ Ἰορδάνου εἰς τὸν τόπον ὅπου ἦν Ἰωάννης τὸ πρῶτον βαπτίζων, καὶ ἔμεινεν ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/040.yaml
  text: And he went away again across the Jordan to the place where John had first been baptizing[a], and he stayed there.
translation:
  language: ar
  text: وذهب مرة أخرى إلى الجانب الآخر من الأردن، إلى الموضع الذي كان يوحنا يعمّد فيه أولًا، وأقام هناك.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: ذهب
  rationale: يفيد الفعل مغادرة الموضع، و«ذهب» تعبير عربي طبيعي واضح، ويُفهَم معنى الانصراف من السياق.
- source_word: πάλιν
  choice: أيضًا
  rationale: تدل على تكرار الذهاب؛ و«أيضًا» تلائم ترتيب الجملة العربية وتحافظ على معنى العودة إلى ذلك الموضع.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: إلى عبر الأردن
  rationale: يفيد التعبير الجهة الواقعة في الجانب الآخر من نهر الأردن؛ و«عبر الأردن» صياغة عربية موجزة تحافظ على الدلالة الجغرافية.
- source_word: εἰς τὸν τόπον
  choice: إلى الموضع
  rationale: تنقل حركة التوجّه نحو مكان محدد، و«الموضع» فصيحة وواضحة في هذا السياق السردي.
- source_word: ὅπου ἦν Ἰωάννης
  choice: الذي كان يوحنا
  rationale: حُفظ زمن الماضي الناقص في «كان»، من غير إضافة تحديد زمني لا يصرّح به النص.
- source_word: τὸ πρῶτον
  choice: أولًا
  rationale: حال زمانية تشير إلى المرحلة الأولى أو السابقة من خدمة يوحنا، و«أولًا» تبقي الصلة المحتملة بالفعل «يعمّد» من غير توسع تفسيري.
- source_word: βαπτίζων
  choice: يعمّد فيه
  rationale: ينقل اسم الفاعل الدال على نشاط مستمر، وأُضيف «فيه» عربيًا لربط فعل التعميد بالموضع ربطًا طبيعيًا.
- source_word: ἔμεινεν
  choice: أقام
  rationale: يفيد البقاء في المكان، و«أقام» تعبير عربي طبيعي ودقيق في سياق الإقامة المؤقتة.
- source_word: ἐκεῖ
  choice: هناك
  rationale: مقابل مكاني مباشر وواضح.
