  text: ὁ πατήρ μου ⸀ὃ δέδωκέν ⸀μοι ⸂πάντων μεῖζων⸃ ἐστίν, καὶ οὐδεὶς δύναται ἁρπάζειν ἐκ τῆς χειρὸς τοῦ ⸀πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/029.yaml
  text: My Father[a], who has given them to me, is greater than all, and no one is able to snatch them out of the Father's hand.
translation:
  language: ar
  text: أبي، الذي أعطاني إياهم، أعظم من الجميع[a]، ولا يقدر أحد أن ينتزعهم من يد الآب.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بحرفية أكبر: «أبي، ما أعطاني إياه، أعظم من الجميع». العبارة اليونانية هنا عسيرة، ويفهم بعضهم أن العطية نفسها، لا الأشخاص الذين أُعطوا، هي موضوع المقارنة.'
    reason: قراءة بديلة ناتجة عن صعوبة نصية ونحوية حقيقية
lexical_decisions:
- source_word: ὁ πατήρ μου
  choice: أبي
  rationale: تعبير عربي فصيح وطبيعي يحفظ علاقة يسوع البنوية بالله من غير زيادة تفسيرية.
- source_word: ὃ δέδωκέν μοι
  choice: الذي أعطاني إياهم
  rationale: أُخذ الموصول بحسب سياق الخراف المذكورة في الآيتين السابقتين، وجاء «إياهم» لإظهار المرجع الشخصي، مع إبقاء الصعوبة النحوية والقراءة الحرفية البديلة في الحاشية. وتفيد صيغة التمام اليونانية عطية تمت وما زال أثرها قائمًا.
- source_word: πάντων μεῖζων
  choice: أعظم من الجميع
  rationale: تحفظ العبارة عموم المقارنة ولا تحصر πάντων صراحة في الأشخاص أو الأشياء.
- source_word: οὐδεὶς δύναται
  choice: لا يقدر أحد
  rationale: صياغة عربية طبيعية تنقل معنى القدرة المنفية في δύναται.
- source_word: ἁρπάζειν
  choice: أن ينتزعهم
  rationale: «ينتزع» يؤدي معنى الأخذ القسري ويحافظ على الصلة اللفظية بصورة الحماية في اليد.
- source_word: ἐκ τῆς χειρὸς τοῦ πατρός
  choice: من يد الآب
  rationale: تحفظ استعارة اليد بوصفها دالة على الحيازة والحماية والقدرة، و«من» هي الصياغة العربية الطبيعية للدلالة على الإخراج من نطاق اليد.
theological_decisions:
- issue: الصعوبة النصية والنحوية في ὃ δέδωκέν μοι
  choice: 'صياغة العبارة وفق مرجعها السياقي، أي الخراف: «الذي أعطاني إياهم»'
  alternative: «أبي، ما أعطاني إياه، أعظم من الجميع» أو «ما أعطاني إياه أبي أعظم من الجميع»
  rationale: النص اليوناني المطبوع عسير نحويًا، كما توجد اختلافات مخطوطية. والسياق يتحدث عن الخراف التي أعطاها الآب للابن، ولذلك تُظهر الصياغة المرجع الشخصي، بينما تحفظ الحاشية الاحتمال المحايد الحرفي بوصفه غموضًا حقيقيًا.
- issue: نطاق المقارنة في πάντων μεῖζων
  choice: «أعظم من الجميع» من غير تقييد المقارنة بالأشخاص أو الأشياء
  alternative: «أعظم من كل إنسان» أو «أعظم من كل شيء»
  rationale: صيغة πάντων عامة، وتحديدها بإحدى الفئتين يضيّق ما تركه النص واسعًا.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «أبي» و«الآب» للمحافظة على التمييز الطبيعي بين خطاب يسوع عن علاقته الخاصة وبين اللقب في العبارة الختامية، وحُفظت صورة اليد والانتزاع.
