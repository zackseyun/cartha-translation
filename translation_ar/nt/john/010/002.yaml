  text: ὁ δὲ εἰσερχόμενος διὰ τῆς θύρας ποιμήν ἐστιν τῶν προβάτων.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/002.yaml
  text: But the one who enters through the door is the shepherd of the sheep[a].
translation:
  language: ar
  text: أَمَّا الَّذِي يَدْخُلُ مِنَ الْبَابِ فَهُوَ رَاعِي الْخِرَافِ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «راعٍ للخراف». جاءت الكلمة اليونانية المترجمة «راعي» بلا أداة تعريف، لكن السياق يرجّح معنى التعريف: الراعي الشرعي في مقابل الدخلاء غير الشرعيين.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἰσερχόμενος
  choice: أَمَّا الَّذِي يَدْخُلُ
  rationale: اسم الفاعل المضارع المعرَّف بالأداة مستعمل استعمال الاسم، فيدل على الشخص المتصف بالدخول. وصيغة «الذي يدخل» عربية طبيعية وتحفظ دلالته العامة، بينما تنقل «أمّا» المقابلة التي تفيدها δέ مع الآية السابقة.
- source_word: διὰ τῆς θύρας
  choice: مِنَ الْبَابِ
  rationale: تدل διά مع المضاف إليه هنا على المرور عبر مدخل الباب. و«يدخل من الباب» هي العبارة العربية الطبيعية الواضحة لهذا المعنى المكاني.
- source_word: ποιμήν
  choice: رَاعِي
  rationale: المعنى المعجمي المباشر هو راعي الغنم. أُضيفت الكلمة إلى «الخراف»، فصارت «راعي الخراف» معرفةً بالإضافة، بما يلائم كون المقصود الراعي الشرعي في مقابل الدخلاء، مع بيان البديل النحوي الممكن في الحاشية.
- source_word: τῶν προβάτων
  choice: الْخِرَافِ
  rationale: تنقل اللفظة صورة الحيوانات نفسها بدل استبدالها بتعبير تفسيري مثل «القطيع». و«الخراف» واضحة وشائعة في العربية المعاصرة.
theological_decisions:
- issue: تعريف ποιμήν الواقعة خبرًا
  choice: راعي الخراف
  alternative: راعٍ للخراف
  rationale: 'مع أن ποιμήν غير مسبوقة بأداة التعريف في اليونانية، فإن السياق يقابل الداخل من الباب بالسارق واللص، ويرجّح التعريف: إنه الراعي الشرعي المعروف للخراف. لا يقصد الاختيار أن يضيف تحديدًا مسيحيًا يتجاوز صورة السياق، ولذلك أُثبت الاحتمال النحوي الآخر في الحاشية.'
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ومهيبة بلا تكلّف. استُعمل تركيب «أمّا... فهو» لإظهار المقابلة الطبيعية مع الآية السابقة، وحُفظت صورة الباب والخراف والراعي.
