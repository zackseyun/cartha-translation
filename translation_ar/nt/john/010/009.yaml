  yaml_path: translation/nt/john/010/009.yaml
  text: I am the door. If anyone enters through me[a], he will be saved, and will go in and go out and find pasture.
translation:
  language: ar
  text: أنا هو الباب[a]. إن دخل أحد من خلالي، يخلُص، ويدخل ويخرج ويجد مرعى.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «البوابة». يمكن أن تدل الكلمة اليونانية على باب أو بوابة؛ وأُبقي «الباب» في المتن لأنه المقابل المعجمي المباشر.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θύρα
  choice: الباب
  rationale: اللفظة اليونانية تدل أساسًا على باب أو مدخل، وقد تُفهم في سياق الرعي بمعنى البوابة. اختير «الباب» لأنه المقابل المعجمي المباشر ويحفظ صيغة الاستعارة اليوحناوية، مع إثبات البديل في الحاشية.
- source_word: δι’ ἐμοῦ
  choice: من خلالي
  rationale: تدل διά مع المضاف إليه هنا على الوسيلة؛ و«من خلالي» صياغة عربية واضحة تُبرز أن الدخول يتم بوساطة يسوع.
- source_word: ἐάν τις εἰσέλθῃ
  choice: إن دخل أحد
  rationale: تركيب ἐάν مع صيغة الاحتمال يفيد شرطًا عامًا مفتوح النطاق، و«إن دخل أحد» يحفظ الإيجاز وعدم التحديد.
- source_word: σωθήσεται
  choice: يخلُص
  rationale: يحفظ فعل «يخلُص» المجال الدلالي للخلاص والإنقاذ من غير حصره في السلامة الجسدية أو توسيعه إلى صياغة لاهوتية أكثر تحديدًا مما يقوله النص.
- source_word: εἰσελεύσεται καὶ ἐξελεύσεται
  choice: ويدخل ويخرج
  rationale: يحفظ التقابل الحركي البسيط في الأصل، من غير إضافة تفسير لمعاني الحرية أو الأمان.
- source_word: νομὴν
  choice: مرعى
  rationale: تعني اللفظة موضع الرعي أو الكلأ؛ و«مرعى» هي الصياغة العربية الطبيعية الملائمة لصورة الراعي والخراف.
- source_word: εὑρήσει
  choice: يجد
  rationale: مقابل مباشر وطبيعي للفعل اليوناني، ويحفظ بساطة العبارة.
theological_decisions:
- issue: صياغة استعارة θύρα في سياق الرعي
  choice: الباب
  alternative: البوابة
  rationale: «الباب» هو المقابل المباشر ويحفظ استعارة «أنا هو» كما صيغت، أما «البوابة» فتوضح سياق حظيرة الخراف لكنها تزيد تحديدًا سياقيًا؛ لذلك أُبقيت بديلًا في الحاشية.
- issue: مدى معنى σωθήσεται
  choice: يخلُص
  alternative: يُنجى
  rationale: «يخلُص» يحفظ السعة اللاهوتية للفعل في إنجيل يوحنا، مع إبقاء صلته بصورة النجاة والأمان، من غير اختزاله في إنقاذ جسدي محض.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة ذات نبرة كريمة. استُعملت صيغة «أنا هو» للمحافظة على البنية التوكيدية في الأصل وعلى نمط أقوال يسوع في يوحنا. أُثبتت علامة الحاشية في المتن بعد «من خلالي».
