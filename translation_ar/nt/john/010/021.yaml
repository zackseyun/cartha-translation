source:
  edition: SBLGNT
  text: ⸀ἄλλοι ἔλεγον· Ταῦτα τὰ ῥήματα οὐκ ἔστιν δαιμονιζομένου· μὴ δαιμόνιον δύναται τυφλῶν ὀφθαλμοὺς ⸀ἀνοῖξαι;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/021.yaml
  text: Others were saying[a], “These words are not those of a demon-possessed man. A demon cannot open the eyes of the blind, can it?”
translation:
  language: ar
  text: 'وكان آخرون يقولون: «هذه الكلمات ليست كلماتِ مَن به شيطان. أيقدر شيطان أن يفتح عيون العميان؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλοι
  choice: آخرون
  rationale: تُبرز المقابلة مع الفريق المذكور في السياق السابق، وهي صياغة عربية واضحة وطبيعية.
- source_word: ἔλεγον
  choice: كانوا يقولون
  rationale: ينقل التركيب مع كان دلالة الماضي الناقص على قول جارٍ أو متكرر، لا مجرد قول وقع مرة واحدة.
- source_word: Ταῦτα τὰ ῥήματα
  choice: هذه الكلمات
  rationale: ترجمة مباشرة تشير إلى أقوال يسوع المنطوقة، مع بقاء العبارة طبيعية في العربية.
- source_word: οὐκ ἔστιν δαιμονιζομένου
  choice: ليست كلماتِ مَن به شيطان
  rationale: يُفهم المضاف إليه في اليونانية على أنه يصف مصدر هذه الكلمات أو قائلها. وتعبير «مَن به شيطان» واضح من غير أن يفرض تصورًا تقنيًا زائدًا لمفهوم الاستحواذ.
- source_word: μὴ ... δύναται
  choice: أيقدر ... أن
  rationale: صيغ السؤال استفهامًا إنكاريًا يتوقع جوابًا بالنفي، كما تفيد μή في اليونانية، من غير تحويله إلى تقرير صريح.
- source_word: δαιμόνιον
  choice: شيطان
  rationale: المقابل العربي المباشر والمألوف للكلمة اليونانية في هذا السياق، وأدق من التفسير الأوسع «روح شرير».
- source_word: τυφλῶν ὀφθαλμοὺς
  choice: عيون العميان
  rationale: يحافظ على صورة فتح العيون وعلى الصلة الواضحة بشفاء الأعمى في السياق السابق.
- source_word: ἀνοῖξαι
  choice: يفتح
  rationale: يحفظ الصورة الحسية المباشرة للفعل اليوناني بدل تفسيرها بعبارة مثل «يعيد البصر».
theological_decisions:
- issue: صياغة δαιμονίζομαι وδαιμόνιον
  choice: مَن به شيطان / شيطان
  alternative: ممسوس بشيطان / روح شرير
  rationale: تحافظ الصياغة على التمييز بين الشخص الذي به شيطان والشيطان نفسه، ولا تُضعف لغة النص ولا تستورد تعريفًا مذهبيًا تفصيليًا لطبيعة الحالة.
- issue: قوة السؤال البلاغي الذي تقدمه μή
  choice: أيقدر شيطان أن يفتح عيون العميان؟
  alternative: لا يقدر شيطان أن يفتح عيون العميان، أليس كذلك؟
  rationale: الاستفهام المبدوء بالهمزة طبيعي ومفهوم بوصفه إنكاريًا في العربية، فيحفظ توقع الجواب بالنفي من غير أن يحول السؤال إلى حكم تقريري.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدم «وكان آخرون يقولون» لنقل دلالة الماضي الناقص وربط القول بالسياق، وحُفظ التوازي اللفظي بين «شيطان» في شطري الآية.
