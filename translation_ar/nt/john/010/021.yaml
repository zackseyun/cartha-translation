  source_fidelity: 'الترجمة تنقل عناصر اليونانية الأساسية بأمانة: «آخرون» تقابل ἄλλοι، و«كانوا يقولون»/«وكان آخرون يقولون» تعكس دلالة الفعل الناقص ἔλεγον، و«هذه الكلمات» تقابل Ταῦτα τὰ ῥήματα. كما أن «مَن به شيطان» ينقل δαιμονιζομένου دون تحميل المصطلح تعريفًا مذهبيًا زائدًا، ويحافظ السؤال «أيقدر شيطان أن يفتح عيون العميان؟» على صيغة السؤال البلاغي المتوقَّع جوابه بالنفي وعلى الصورة الحرفية لفعل «يفتح».'
