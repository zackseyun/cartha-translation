  terminology: «شيطان» مقابل عربي مألوف ومباشر لـ δαιμόνιον في هذا السياق، و«مَن به شيطان» صياغة متوازنة لـ δαιμονιζομένου. و«عيون العميان» و«يفتح» يحفظان المصطلح والصورة الحسية في النص اليوناني.
