  text: τούτῳ ὁ θυρωρὸς ἀνοίγει, καὶ τὰ πρόβατα τῆς φωνῆς αὐτοῦ ἀκούει καὶ τὰ ἴδια πρόβατα ⸀φωνεῖ κατ’ ὄνομα καὶ ἐξάγει αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/003.yaml
  text: To him the gatekeeper opens[a], and the sheep hear his voice, and he calls his own sheep by name and leads them out.
translation:
  language: ar
  text: يفتح له حارسُ الباب، والخراف تسمع صوته، وهو ينادي خرافه الخاصة بأسمائها، ويقودها إلى الخارج.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ويُخرجها».'
    reason: بديل معجمي للفعل ἐξάγει، الذي يمكن أن يعني «يقود إلى الخارج» أو «يُخرج».
lexical_decisions:
- source_word: τούτῳ
  choice: له
  rationale: ضمير الإشارة في صيغة المجرور يعود إلى الراعي المذكور في السياق السابق، و«له» تؤدي المرجع الشخصي بوضوح وطبيعية في العربية.
- source_word: ὁ θυρωρός
  choice: حارسُ الباب
  rationale: يدل اللفظ على المسؤول عن مدخل الحظيرة؛ و«حارس الباب» أوضح في السياق الرعوي من ألفاظ قد تبدو قديمة أو ملتبسة.
- source_word: ἀνοίγει
  choice: يفتح
  rationale: مضارع بسيط يحافظ على مباشرة الفعل في اليونانية.
- source_word: τὰ πρόβατα
  choice: الخراف
  rationale: المقابل العربي المألوف في صورة الراعي والقطيع.
- source_word: τῆς φωνῆς αὐτοῦ ἀκούει
  choice: تسمع صوته
  rationale: مع أن الفعل مفرد صرفيًا في اليونانية، فإن فاعله جمع محايد، وهو تركيب يوناني شائع يحمل معنى الجمع؛ لذلك جاء الفعل جمعًا في المعنى العربي. و«تسمع صوته» تحفظ بُعد السماع والتعرّف من غير زيادة تفسيرية.
- source_word: τὰ ἴδια πρόβατα
  choice: خرافه الخاصة
  rationale: تحفظ دلالة الملكية والعلاقة المميزة التي يؤكدها ἴδια.
- source_word: φωνεῖ κατ’ ὄνομα
  choice: ينادي ... كلًّا باسمها
  rationale: يبين التعبير أن النداء فردي، أي إن الراعي ينادي كل خروف باسمه، مع مراعاة جنس «الخراف» النحوي في الضمير العربي.
- source_word: ἐξάγει αὐτά
  choice: يقودها إلى الخارج
  rationale: يجمع ἐξάγει بين إخراجها من الحظيرة وقيادتها، و«يقودها إلى الخارج» يلائم صورة الراعي من غير حصر الفعل في مجرد النقل.
theological_decisions:
- issue: هوية الراعي وفاعليته في الصورة المجازية
  choice: 'أُبقيت أفعال الآية منسوبة إلى شخصية الراعي: يفتح له الحارس، وتسمع الخراف صوته، وينادي خرافه، ويقودها إلى الخارج.'
  alternative: التصريح بأن الراعي هو يسوع داخل نص الآية.
  rationale: السياق يفسر الصورة، لكن النص اليوناني هنا لا يذكر اسم يسوع؛ لذلك لا ينبغي إدخال التفسير المسيحاني في ألفاظ الآية نفسها، مع الحفاظ على الصورة وعلاقاتها كما وردت.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة، مع الحفاظ على بساطة الصورة الرعوية. وُضعت علامة الحاشية بعد «ويقودها إلى الخارج» لأنها تتعلق بالفعل ἐξάγει؛ موضعها في طبقة الاستشارة الإنجليزية بعد «يفتح» لا يطابق مضمون الحاشية.
