  source_fidelity: 'الترجمة أمينة للنص اليوناني: «لا أحد يأخذها مني» تنقل αἴρει ... ἀπ’ ἐμοῦ، و«أنا أبذلها من تلقاء نفسي» تحفظ المقابلة وطوعية الفعل في τίθημι ... ἀπ’ ἐμαυτοῦ. وتكرار «لي سلطان» يعكس تكرار ἐξουσίαν ἔχω، فيما يؤدي «أن آخذها من جديد» معنى πάλιν λαβεῖν من غير فرض تفسير أضيق مثل «أستردها». والخاتمة «هذا الأمر تلقيته من أبي» مطابقة للمعنى التركيبي والمعجمي.'
  naturalness: الصياغة عربية فصحى معاصرة، واضحة ووقورة. «أبذلها» تعبير طبيعي ومتسق في سياق بذل الحياة، و«من تلقاء نفسي» واضح في الدلالة على الطوعية. الضمائر مفهومة في سياق الخطاب السابق، وتوضحها الحاشية عند القراءة المنفردة.
  terminology: «سلطان» اختيار سليم لـἐξουσία، إذ يحافظ على معنى السلطة أو الصلاحية المخوَّلة ولا يختزله في القدرة المجردة. «الأمر» مناسب لـἐντολή في هذا السياق، و«أبي» يحفظ اللغة العلائقية في النص. استُخدم اسم «يسوع» في الحاشية استخدامًا طبيعيًا لا يضيف إلى متن الآية.
