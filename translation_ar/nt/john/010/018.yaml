id: JHN.10.18
reference: John 10:18
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: οὐδεὶς ⸀αἴρει αὐτὴν ἀπ’ ἐμοῦ, ἀλλ’ ἐγὼ τίθημι αὐτὴν ἀπ’ ἐμαυτοῦ. ἐξουσίαν ἔχω θεῖναι αὐτήν, καὶ ἐξουσίαν ἔχω πάλιν λαβεῖν αὐτήν· ταύτην τὴν ἐντολὴν ἔλαβον παρὰ τοῦ πατρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/018.yaml
  text: No one takes it from me[a], but I lay it down of myself. I have authority to lay it down, and I have authority to take it up again[c][b]. This command I received from my Father.
translation:
  language: ar
  text: لا أحد يأخذها مني، بل أنا أبذلها من تلقاء نفسي[a]. لي سلطان أن أبذلها، ولي سلطان أن آخذها من جديد[b][c]. هذا الأمر تلقيته من أبي.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «من نفسي» أو «بمبادرتي الخاصة». يشدد التعبير على أن يسوع يبذل حياته طوعًا.'
    reason: lexical_alternative
  - marker: b
    text: يمكن أن يدل «السلطان» هنا أيضًا على القدرة أو الحق؛ فاللفظ اليوناني يجمع معنى الاقتدار والصلاحية المشروعة.
    reason: lexical_alternative
  - marker: c
    text: 'أي: آخذ حياتي من جديد؛ فالضمير يعود إلى «حياتي» المذكورة في السياق السابق (يوحنا 10:17).'
    reason: cross_reference
lexical_decisions:
- source_word: αἴρει
  choice: يأخذها
  rationale: ينقل المعنى المباشر للفعل في سياق أخذ حياة يسوع منه، ويحافظ على التقابل مع بذله إياها طوعًا من غير إضافة دلالة العنف التي قد توحي بها «ينتزعها».
- source_word: τίθημι αὐτήν / θεῖναι αὐτήν
  choice: أبذلها / أن أبذلها
  rationale: «أبذل» تعبير عربي طبيعي عن تقديم الحياة طوعًا، ويحفظ تكرار الفعل ودلالته السياقية أفضل من الترجمة الحرفية الجامدة «أضعها».
- source_word: ἀπ’ ἐμαυτοῦ
  choice: من تلقاء نفسي
  rationale: يبرز مبادرة يسوع وطوعية بذله لحياته، من غير أن ينفي علاقته بأمر الآب المذكور في ختام الآية.
- source_word: ἐξουσίαν
  choice: سلطان
  rationale: «سلطان» يشمل الصلاحية والحق والقدرة المخوَّلة، ويلائم اقترانه بالأمر الذي تلقاه يسوع من أبيه.
- source_word: πάλιν λαβεῖν αὐτήν
  choice: أن آخذها من جديد
  rationale: يحافظ على المعنى الفعلي الواسع لـ λαμβάνω وعلى دلالة πάλιν، من غير حسم زائد بين «الأخذ» و«الاسترداد».
- source_word: ἐντολήν
  choice: الأمر
  rationale: ينقل قوة ἐντολή بوصفها أمرًا صادرًا من الآب، وهو أوضح في العربية المعاصرة هنا من «الوصية» التي قد تُفهم بمعنى وصية أخلاقية أو وصية ما قبل الموت.
- source_word: παρὰ τοῦ πατρός μου
  choice: من أبي
  rationale: ينقل معنى المصدر في παρά مع المضاف إليه، ويحفظ لغة العلاقة الشخصية بين الابن والآب.
theological_decisions:
- issue: دلالة ἐξουσία في موت يسوع وعودته إلى الحياة
  choice: سلطان
  alternative: قدرة أو حق
  rationale: يحفظ اللفظ اجتماع القدرة والصلاحية المشروعة، ويصون التوتر النصي بين فاعلية يسوع الطوعية وتلقيه الأمر من الآب.
- issue: دلالة ἀπ’ ἐμαυτοῦ
  choice: من تلقاء نفسي
  alternative: من نفسي أو بمبادرتي الخاصة
  rationale: يؤكد طوعية بذل يسوع لحياته من غير أن يوحي باستقلاله عن الآب، إذ تذكر الجملة الأخيرة الأمر الذي تلقاه منه.
- issue: مرجع الضمير αὐτήν
  choice: ها، عائدة إلى الحياة المذكورة في السياق السابق
  alternative: حياتي
  rationale: إبقاء الضمير يتبع صياغة اليونانية ويحافظ على الترابط مع يوحنا 10:17، بينما توضح الحاشية مرجعه عند قراءة الآية منفردة.
translation_notes:
  register: لغة عربية فصحى معاصرة واضحة ووقورة. استُعمل «أبذلها» بدل الحرفية «أضعها» لأنه التعبير العربي الطبيعي عن تقديم الحياة طوعًا، مع الحفاظ على تكراره داخل الآية. وُضعت علامات الحواشي عند العبارات التي تشرحها مباشرة.
