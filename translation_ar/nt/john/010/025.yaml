  verdict: revise
  source_fidelity: 'الترجمة دقيقة في معظم عناصر الآية: «فأجابهم»، و«قلت لكم»، و«لا تؤمنون»، و«الأعمال التي أعملها باسم أبي» تقابل اليونانية بوضوح وتحفظ التعبير اللاهوتي غير المفسَّر «باسم». لكن περὶ ἐμοῦ تعني «عني/بشأني»، لا «لي» في المقام الأول؛ إذ قد توحي «تشهد لي» بأنها شهادة لصالحه بدل أن تكون شهادة عنه.'
