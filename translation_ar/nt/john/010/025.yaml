  terminology: «الأعمال» و«تؤمنون» و«باسم أبي» اختيارات متسقة ومناسبة للسياق اليوحناوي. ويُستحسن اعتماد «تشهد عني» للمحافظة على دلالة فعل الشهادة مع حرف περὶ.
