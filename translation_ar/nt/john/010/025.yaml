    rationale: التركيب اليوناني يفيد أن الأعمال تشهد «عن» يسوع أو «بشأنه». أما اللام العربية فتقبل معنى الشهادة المؤيدة له، وهو تضييق أو تحويل محتمل للمعنى.
  - severity: low
    issue: الحاشية b تجعل «تشهد عني» بديلًا، مع أنها هي الصياغة الأقرب للنص اليوناني.
    rationale: بعد تصحيح المتن إلى «تشهد عني»، ينبغي أن تعرض الحاشية بديلًا عربيًا مناسبًا مثل «تشهد بشأنِي».
