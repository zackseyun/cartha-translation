  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Εἶπον ὑμῖν καὶ οὐ πιστεύετε· τὰ ἔργα ἃ ἐγὼ ποιῶ ἐν τῷ ὀνόματι τοῦ πατρός μου ταῦτα μαρτυρεῖ περὶ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/025.yaml
  text: Jesus answered them[a], “I told you, and you do not believe[b]. The works that I do in the name of my Father—these testify about me.”
translation:
  language: ar
  text: 'فأجابهم يسوع: «قلت لكم، ولا تؤمنون. الأعمال التي أعملها باسم أبي[a] هي التي تشهد عني[b].»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: بسلطان أبي.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: تشهد بشأنِي.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: فأجابهم
  rationale: صياغة سردية عربية مألوفة للحوار، وتحفظ دلالة الرد على المخاطَبين.
- source_word: Εἶπον ὑμῖν
  choice: قلت لكم
  rationale: تنقل القول السابق الموجَّه إليهم مباشرة، من غير إضافة تفسير غير وارد في اليونانية.
- source_word: οὐ πιστεύετε
  choice: لا تؤمنون
  rationale: تحفظ المصطلح اليوحناوي المتكرر ودلالته على تصديق قول يسوع والإيمان به، مع إبقاء الحاضر اليوناني طبيعيًا في العربية.
- source_word: τὰ ἔργα
  choice: الأعمال
  rationale: «الأعمال» هي المقابل العربي الأنسب، وتحافظ على الاتساق الاصطلاحي في إنجيل يوحنا وعلى الصلة بأفعال يسوع وآياته.
- source_word: ἐν τῷ ὀνόματι τοῦ πατρός μου
  choice: باسم أبي
  rationale: تحفظ العبارة اليونانية واتساعها الدلالي، بما يشمل التمثيل والتفويض والسلطان، من غير حصرها في تفسير واحد.
- source_word: ταῦτα μαρτυρεῖ περὶ ἐμοῦ
  choice: هي التي تشهد لي
  rationale: يبقي تركيب «هي التي» على توكيد اسم الإشارة اليوناني، بينما تؤدي «تشهد لي» معنى الشهادة المتعلقة بيسوع بلغة عربية طبيعية.
theological_decisions:
- issue: صلة أعمال يسوع باسم الآب وسلطانه
  choice: باسم أبي
  alternative: بسلطان أبي
  rationale: تحفظ الصياغة المختارة مدى التعبير الأصلي ولا تختزله في معنى السلطان وحده، مع إثبات هذا المعنى المحتمل في الحاشية.
- issue: وظيفة أعمال يسوع بوصفها شهادة له
  choice: تشهد لي
  alternative: تشهد عني
  rationale: «تشهد لي» عربية واضحة وتحفظ صورة الشهادة ذات الأهمية في إنجيل يوحنا، من غير توسيع مضمون الشهادة أو تحديد نتيجتها لاهوتيًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «هي التي» لإظهار توكيد ταῦτα بصورة طبيعية نسبيًا، ووُضعت علامتا الحاشيتين عند العبارتين اللتين تفسرهما الحاشيتان مباشرة.
