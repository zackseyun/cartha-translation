  text: ὁ ⸀μισθωτὸς καὶ οὐκ ὢν ποιμήν, οὗ οὐκ ⸀ἔστιν τὰ πρόβατα ἴδια, θεωρεῖ τὸν λύκον ἐρχόμενον καὶ ἀφίησιν τὰ πρόβατα καὶ φεύγει— καὶ ὁ λύκος ἁρπάζει αὐτὰ καὶ ⸀σκορπίζει—
base_translation:
  language: en
  yaml_path: translation/nt/john/010/012.yaml
  text: The hired hand[a], who is not a shepherd and whose sheep are not his own, sees the wolf coming and leaves the sheep and flees—and the wolf snatches them and scatters them.
translation:
  language: ar
  text: أَمَّا الأجيرُ، الذي ليس راعيًا، والخرافُ ليست له، فيرى الذئبَ آتيًا، فيترك الخرافَ ويهرب؛ فيخطفها الذئبُ ويُشتِّتها.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μισθωτός
  choice: الأجير
  rationale: يدل على من يعمل لقاء أجر، وهو لفظ عربي واضح يحفظ المقابلة بين العامل المأجور والراعي الحقيقي.
- source_word: οὐκ ὢν ποιμήν
  choice: الذي ليس راعيًا
  rationale: صيغ التركيب الوصفي اليوناني جملة موصولة طبيعية في العربية، مع إبقاء الحكم بأنه ليس راعيًا.
- source_word: οὗ οὐκ ἔστιν τὰ πρόβατα ἴδια
  choice: وليست الخراف له
  rationale: تؤدي معنى أن الخراف لا تخصه ولا تنتمي إليه، بعبارة عربية موجزة وطبيعية، من غير إضافة تفسير لعلاقة الملكية.
- source_word: θεωρεῖ
  choice: فيرى
  rationale: ينقل إدراك الخطر مباشرة من غير مبالغة تفسيرية.
- source_word: τὸν λύκον ἐρχόμενον
  choice: الذئب آتيًا
  rationale: يحفظ صورة الذئب في حال قدومه والصيغة الحية للمشهد.
- source_word: ἀφίησιν
  choice: فيترك
  rationale: المقابل المباشر للفعل، ويمكن أن يحمل في السياق معنى التخلي عند الخطر من غير الحاجة إلى تشديده داخل النص.
- source_word: φεύγει
  choice: ويهرب
  rationale: تعبير عربي واضح وموجز يلائم سياق الفرار من الخطر.
- source_word: ἁρπάζει
  choice: فيخطفها
  rationale: ينقل الأخذ العنيف والسريع الذي يقوم به الحيوان المفترس، والضمير يعود إلى الخراف.
- source_word: σκορπίζει
  choice: ويُشتِّتها
  rationale: يحفظ فعل التفريق ويصرح بالمفعول المفهوم من السياق بواسطة الضمير.
- source_word: πρόβατα
  choice: الخراف
  rationale: يحفظ الاسم الجمعي الملموس والصورة الرعوية المستمرة، بدل تحويله إلى لفظ تجريدي أو تفسيري.
theological_decisions:
- issue: القوة المجازية لصورة الراعي
  choice: الإبقاء على «الراعي» و«الأجير» بوصفهما لفظين رعويين حرفيين داخل الاستعارة
  alternative: استبدالهما بألفاظ تفسيرية مثل «القائد» أو «المسؤول»
  rationale: يقوم سياق يوحنا 10 على صورة رعوية ممتدة؛ وإحلال ألفاظ تفسيرية محلها يضعف الاستعارة ويدخل تفسيرًا لا يصرح به النص اليوناني.
- issue: درجة الذم في ἀφίησιν
  choice: «يترك» مع ترك السياق يبين أنه تخَلٍّ مذموم
  alternative: «يهجر» أو «يتخلى عن» لتصريح أقوى بالذم
  rationale: الفعل يحتمل معنى الترك أو التخلي. المقابل المختار يحفظ سعته الدلالية، بينما يكشف ذكر الخطر والهرب النبرة الأخلاقية من غير حسم زائد.
translation_notes:
  register: 'عربية فصحى حديثة، واضحة وكريمة الإيقاع. استُعمل «أمّا» لإبراز الشخصية المقابلة في السياق، وحُفظ تتابع الأفعال وسرعة المشهد. لا توجد علامة حاشية لأن الحاشية الإنجليزية المرفقة تبدو غير متطابقة مع موضعها: علامتها بعد «hired hand» لكن نصها يشرح فعل «leaves»؛ لذلك عولج التفاوت الدلالي في القرار المعجمي دون إنشاء حاشية عربية مضللة.'
