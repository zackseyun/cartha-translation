  text: ἀλλοτρίῳ δὲ οὐ μὴ ⸀ἀκολουθήσουσιν ἀλλὰ φεύξονται ἀπ’ αὐτοῦ, ὅτι οὐκ οἴδασι τῶν ἀλλοτρίων τὴν φωνήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/005.yaml
  text: But they will certainly not follow a stranger[a]; instead, they will flee from him[b], because they do not know the voice of strangers.
translation:
  language: ar
  text: أمّا الغريب، فلن تتبعه الخراف أبدًا[a]، بل تهرب منه، لأنها لا تعرف صوت الغرباء[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لن تتبعه إطلاقًا». تستعمل اليونانية نفيًا مؤكَّدًا (οὐ μή).'
    reason: lexical_alternative
  - marker: b
    text: يمكن أيضًا فهم «تعرف صوت الغرباء» بمعنى «تميّز صوت الغرباء».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλοτρίῳ
  choice: الغريب
  rationale: يدل في استعارة الراعي والخراف على من لا ينتمي إليها ولا تعرفه؛ و«الغريب» طبيعي في العربية ولا يوحي بالعرق أو القومية.
- source_word: οὐ μὴ ἀκολουθήσουσιν
  choice: فلن تتبعه أبدًا
  rationale: يجمع بين «لن» و«أبدًا» لنقل النفي اليوناني المؤكد مع بقاء العبارة عربية واضحة وطبيعية.
- source_word: ἀκολουθήσουσιν
  choice: تتبعه
  rationale: «تتبع» هو الفعل المباشر والطبيعي في سياق الخراف والراعي.
- source_word: φεύξονται ἀπ’ αὐτοῦ
  choice: تهرب منه
  rationale: ينقل معنى الابتعاد السريع والتحاشي الذي يفيده الفعل مع حرف الجر، بصياغة مألوفة في العربية المعاصرة.
- source_word: οἴδασι
  choice: تعرف
  rationale: يحفظ المعنى الأساسي للفعل، مع إبقاء احتمال أن تكون المعرفة هنا بمعنى التمييز أو التعرّف.
- source_word: τῶν ἀλλοτρίων τὴν φωνήν
  choice: أصوات الغرباء
  rationale: المفرد «الصوت» مع مضاف إليه جمع يمكن أن يفيد صوتًا نوعيًا، لكن العربية الطبيعية تميل هنا إلى الجمع «أصوات» مع تعدد الغرباء، من غير تغيير المقصود.
- source_word: δὲ ... ἀλλὰ
  choice: أمّا ... بل
  rationale: ينقل التقابل بين رفض اتباع الغريب والهرب منه في تركيب عربي واضح ومتين.
theological_decisions:
- issue: القوة المجازية لصورة الخراف والراعي
  choice: الإبقاء على الاستعارة كما هي من دون شرح هوية «الغريب» داخل النص
  alternative: تفسير «الغريب» صراحة بأنه معلّم كاذب أو قائد غير شرعي
  rationale: الآية نفسها تستمر في لغة الاستعارة ولا تعيّن مرجع الغريب صراحة، ولذلك فالتفسير المباشر في المتن يتجاوز الدليل اللغوي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. أُنِّثت الضمائر والأفعال مراعاةً لجمع غير العاقل «الخراف» المفهوم من السياق السابق. حُفظت الاستعارة بلا توسع تفسيري، ونُقلت قوة النفي بصيغة طبيعية.
