translation:
  language: ar
  text: 'أفتقولون للذي قدَّسه[a] الآب وأرسله إلى العالم: «إنك تُجدِّف»، لأني قلت: «أنا ابن الله»؟'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كرَّسه» أو «خصَّصه»؛ فالفعل اليوناني قد يدل على التقديس أو التكريس أو التخصيص لمهمة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡγίασεν
  choice: قدَّسه
  rationale: يحفظ المعنى الأساسي للفعل ἁγιάζω وصلته بالقداسة، مع إبقاء احتمال معنى التكريس أو التخصيص للمهمة من غير إدخاله تفسيرًا في صلب النص.
- source_word: ἀπέστειλεν
  choice: أرسله
  rationale: مقابل عربي مباشر وطبيعي يحافظ على لغة الإرسال المتكررة في يوحنا، وهو أقل تفسيرًا من «كلَّفه بمهمة».
- source_word: κόσμον
  choice: العالم
  rationale: هو المقابل المعتاد لـ κόσμος في يوحنا، ويحفظ اتساع الدلالة ولا يقصرها على البشر وحدهم.
- source_word: Βλασφημεῖς
  choice: إنك تُجدِّف
  rationale: ينقل صيغة الاتهام المباشر في المضارع بعربية واضحة وطبيعية.
- source_word: Υἱὸς τοῦ θεοῦ
  choice: ابن الله
  rationale: صياغة عربية اصطلاحية تحفظ القوة المسيحانية واللاهوتية للعبارة من غير إضافة أداة تعريف غير طبيعية في العربية.
- source_word: ὃν ὁ πατὴρ
  choice: للذي ... الآب
  rationale: يحفظ تركيب الموصول ومرجعه بعبارة عربية فصيحة واضحة.
- source_word: ὅτι ... ὅτι
  choice: فتقولون ... لأني قلت
  rationale: تُفهم ὅτι الأولى مع فعل القول بوصفها مدخلة لمضمون الاتهام، وتُنقل الثانية سببيةً لتبيين أن قول يسوع هو أساس تهمة التجديف.
theological_decisions:
- issue: دلالة ἡγίασεν في حديث الآب عن الابن
  choice: قدَّسه
  alternative: كرَّسه / خصَّصه
  rationale: يبقي «قدَّسه» الصلة اللفظية بالقداسة والتوتر الدلالي في النص، من غير أن يعني بالضرورة تحسينًا أخلاقيًا أو انتقالًا من عدم القداسة؛ وتوضح الحاشية احتمال التكريس أو التخصيص.
- issue: القوة المسيحانية لعبارة Υἱὸς τοῦ θεοῦ
  choice: ابن الله
  alternative: ابنٌ لله
  rationale: «ابن الله» هي الصياغة العربية الطبيعية للقب في هذا السياق، وتحفظ ثقل العبارة ضمن تهمة التجديف من غير فرض صياغة عقائدية لاحقة على النص.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة. استُعملت «أفتقولون» لربط السؤال الاحتجاجي بسياقه، و«إنك تُجدِّف» لنقل الاقتباس المباشر طبيعيًا. وُضعت علامة الحاشية بعد الآية لأنها تتعلق بلفظة «قدَّسه» الواردة في المتن.
