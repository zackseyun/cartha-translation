  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Οὐκ ἔστιν γεγραμμένον ἐν τῷ νόμῳ ὑμῶν ⸀ὅτι Ἐγὼ εἶπα· Θεοί ἐστε;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/034.yaml
  text: Jesus answered them[a], “Is it not written in your Law, ‘I said, you are gods’?”
translation:
  language: ar
  text: 'أجابهم يسوع: «أليس مكتوبًا في شريعتكم: "أنا قلت: إنكم آلهة[a]"؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كائنات إلهية». يقتبس يسوع هنا من المزمور 82:6، وتحديد المقصود بهذا اللفظ موضع خلاف تفسيري؛ لذلك يحافظ المتن على الصياغة المباشرة للاقتباس.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς
  choice: أجابهم
  rationale: تعبير عربي طبيعي ودقيق لفعل الجواب مع المفعول به في سياق الحوار.
- source_word: Οὐκ ἔστιν γεγραμμένον
  choice: أليس مكتوبًا
  rationale: يحافظ على صيغة السؤال وعلى الدلالة الحاضرة للصيغة اليونانية التي تُستعمل لتقديم اقتباس كتابي.
- source_word: ἐν τῷ νόμῳ ὑμῶν
  choice: في شريعتكم
  rationale: «الشريعة» واضحة في العربية وتشير هنا إلى الأسفار المقدسة اليهودية بمعناها الواسع، إذ يأتي الاقتباس من المزمور 82:6.
- source_word: Ἐγὼ εἶπα
  choice: أنا قلت
  rationale: يحافظ على الضمير الصريح الوارد في نص الاقتباس، من غير إضافة تشديد تفسيري.
- source_word: Θεοί
  choice: آلهة
  rationale: المقابل المباشر للجمع اليوناني، ويحفظ صياغة الاقتباس وقوته الجدلية دون حسم هوية المخاطَبين تفسيريًا.
- source_word: ἐστε
  choice: إنكم
  rationale: ينقل فعل الكينونة مباشرة في تركيب عربي طبيعي؛ ولا يضيف معنى «دُعيتم» غير الموجود في اليونانية.
theological_decisions:
- issue: ترجمة Θεοί في اقتباس يسوع من المزمور 82:6
  choice: آلهة
  alternative: كائنات إلهية
  rationale: اختير المقابل المعجمي المباشر في المتن حفاظًا على نص الاقتباس والتوتر التفسيري في حجة يسوع، بينما أُثبت البديل الممكن في الحاشية دون فرض تفسير بعينه.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم تركيب اقتباسي طبيعي مع إبقاء لفظ «آلهة» الصريح، وتجنُّب أي إضافة مذهبية أو تفسير يحسم المقصود من المخاطَبين.
