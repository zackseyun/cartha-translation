  yaml_path: translation/nt/john/010/020.yaml
  text: But many of them were saying[a], “He has a demon and is insane. Why do you listen to him?”
translation:
  language: ar
  text: 'لكن كثيرون منهم كانوا يقولون: «به شيطان وهو مجنون. لماذا تستمعون إليه؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: كانوا يقولون
  rationale: ينقل زمن الماضي الناقص الدال على قول مستمر أو متكرر في سياق المشهد.
- source_word: δὲ
  choice: لكن
  rationale: تفيد هنا الانتقال التقابلي مع رد الفعل الإيجابي المذكور في السياق السابق.
- source_word: πολλοὶ ἐξ αὐτῶν
  choice: كثيرين منهم
  rationale: صياغة عربية طبيعية تحفظ معنى أن القائلين فريق من الجماعة لا جميعها.
- source_word: Δαιμόνιον ἔχει
  choice: به شيطان
  rationale: ترجمة مباشرة وطبيعية للعبارة اليونانية، من غير تحويلها إلى توصيف عقائدي أكثر تفسيرًا مثل «ممسوس بشيطان».
- source_word: μαίνεται
  choice: يهذي
  rationale: تعبّر في هذا الاتهام العدائي عن الكلام أو السلوك الناشئ في زعمهم عن اختلال العقل، وهي أفصح وأقل إيحاءً بتشخيص طبي حديث من «مجنون».
- source_word: τί αὐτοῦ ἀκούετε;
  choice: لماذا تستمعون إليه؟
  rationale: تؤدي τί الاستفهامية هنا معنى «لماذا»، ويوافق «تستمعون إليه» دلالة ἀκούω مع المضاف إليه وسياق الإنكار.
theological_decisions:
- issue: صياغة الاتهام العدائي الموجَّه إلى يسوع
  choice: به شيطان، وهو يهذي
  alternative: إنه ممسوس بشيطان ومجنون
  rationale: تحفظ الصياغة الاتهام كما يورده السرد من غير تخفيفه، مع البقاء قريبًا من تركيب «له/به شيطان» وتجنب تقرير تفسير عقائدي أو تشخيص سريري يتجاوز النص.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ومهيبة. استُخدم «كانوا يقولون» لإبراز الاستمرار، و«به شيطان» للمحافظة على مباشرة الأصل، و«يهذي» لنقل الاتهام بالاختلال العقلي في عبارة طبيعية غير طبية.
