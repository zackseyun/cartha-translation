source:
  edition: SBLGNT
  text: Ἀμὴν ἀμὴν λέγω ὑμῖν, ὁ μὴ εἰσερχόμενος διὰ τῆς θύρας εἰς τὴν αὐλὴν τῶν προβάτων ἀλλὰ ἀναβαίνων ἀλλαχόθεν ἐκεῖνος κλέπτης ἐστὶν καὶ λῃστής·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/001.yaml
  text: Truly[a], truly, I say to you, the one who does not enter through the door into the sheepfold[c][b], but climbs up from somewhere else—that man is a thief and a robber.
translation:
  language: ar
  text: '«الحقَّ الحقَّ أقول لكم: إنَّ الذي لا يدخل إلى حظيرة الخراف من الباب[a]، بل يصعد من جهة أخرى، فذاك سارقٌ ولصّ[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «من البوابة». يمكن أن تدل الكلمة اليونانية θύρα على باب أو بوابة بحسب السياق.'
    reason: lexical_alternative
  - marker: b
    text: 'تميّز اليونانية بين «السارق» (κλέπτης)، الذي يغلب أن يسرق خفية، و«اللص» (λῃστής)، الذي قد يدل على من يسلب بالقوة أو العنف؛ ويمكن ترجمة الثانية أيضًا: «سالب» أو «قاطع طريق» بحسب السياق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  choice: الحقَّ الحقَّ
  rationale: يحفظ تكرار الصيغة التوكيدية ووقارها، بصياغة عربية مفهومة وشائعة في هذا السياق.
- source_word: λέγω ὑμῖν
  choice: أقول لكم
  rationale: ترجمة مباشرة وطبيعية لصيغة الخطاب.
- source_word: ὁ μὴ εἰσερχόμενος
  choice: الذي لا يدخل
  rationale: ينقل اسم الفاعل المعرَّف ذا الدلالة العامة المفردة من غير تكلف.
- source_word: διὰ τῆς θύρας
  choice: من الباب
  rationale: يؤدي معنى العبور بواسطة المدخل؛ ويمكن أن تعني θύρα الباب أو البوابة بحسب السياق.
- source_word: εἰς τὴν αὐλὴν τῶν προβάτων
  choice: إلى حظيرة الخراف
  rationale: αὐλή موضع مسوَّر أو فناء؛ و«حظيرة الخراف» تنقل الصورة الرعوية بوضوح.
- source_word: ἀλλὰ ἀναβαίνων ἀλλαχόθεν
  choice: بل يتسلَّق إليها من موضع آخر
  rationale: «يتسلّق» يحفظ صورة الصعود وتجاوز المدخل، و«من موضع آخر» تنقل ἀλλαχόθεν دون تحديد كيفية أخرى غير مصرّح بها.
- source_word: ἐκεῖνος
  choice: فذاك
  rationale: يحفظ قوة اسم الإشارة التعيينية والإبعادية بإيجاز عربي طبيعي.
- source_word: κλέπτης
  choice: سارق
  rationale: يدل على من يأخذ خفية، وهو المقابل المعتاد للكلمة.
- source_word: λῃστής
  choice: قاطع طريق
  rationale: يميّزه عن κλέπτης ويحفظ إيحاء السلب بالقوة أو العنف، وإن كان «لص» بديلًا أوسع.
theological_decisions:
- issue: الصورة المجازية للباب والحظيرة
  choice: 'إبقاء الصورة حسية كما هي: الباب وحظيرة الخراف، بلا تفسير رمزي مضاف.'
  alternative: استعمال «البوابة» و«زريبة الخراف»، أو شرح مدلول عناصر الصورة لاهوتيًا.
  rationale: الآية تفتتح صورة يشرحها السياق اللاحق؛ فلا ينبغي استباق الشرح أو تعيين مدلولها العقائدي داخل الترجمة.
- issue: التمييز بين κλέπτης وλῃστής
  choice: «سارق وقاطع طريق» لإظهار الفرق بين السرقة الخفية والسلب بالقوة.
  alternative: «سارق ولص» أو «لص وسالب».
  rationale: يحفظ اللفظان اليونانيان تمييزًا دلاليًا حقيقيًا، وتجنّب دمجهما في مترادفين عربيين لا يظهر بينهما فرق.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ التوكيد المكرر في مطلع القول، واستُخدمت «حظيرة» بوصفها التعبير الرعوي الطبيعي، مع إبقاء البدائل المعجمية الحقيقية في الحواشي دون توسيع تفسيري.
