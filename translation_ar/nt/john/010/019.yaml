  yaml_path: translation/nt/john/010/019.yaml
  text: Because of these words[a], a division arose again among the Jews.
translation:
  language: ar
  text: فنشأ من جديد انقسامٌ بين اليهود[a] بسبب هذه الأقوال.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أهل اليهودية»، أو في بعض سياقات إنجيل يوحنا «القادة اليهود». يعكس تعبير «اليهود» هنا اللفظ اليوناني، لكنه كثيرًا ما يشير في هذا الإنجيل إلى جماعة معيّنة يحددها السياق، لا إلى الشعب اليهودي كله.
    reason: lexical_alternative
lexical_decisions:
- source_word: Σχίσμα
  choice: انقسام
  rationale: يدل الاسم على شقّ أو انقسام، والمقصود هنا اختلاف الناس في استجابتهم لكلام يسوع؛ و«انقسام» تعبير عربي طبيعي ودقيق.
- source_word: πάλιν
  choice: أيضًا
  rationale: تفيد الكلمة تكرار الحدث. و«أيضًا» مع الفعل الماضي تعبّر طبيعيًا عن وقوع انقسام آخر، مع إمكان ترجمتها «من جديد».
- source_word: ἐγένετο
  choice: حدث
  rationale: الفعل يدل هنا على وقوع حالة أو نشوء حدث؛ و«حدث» يلائم «انقسام» ويحافظ على المعنى الحدثي.
- source_word: ἐν τοῖς Ἰουδαίοις
  choice: بين اليهود
  rationale: هذه أقرب صياغة مباشرة للعبارة اليونانية. وقد تدل Ἰουδαῖοι بحسب السياق في إنجيل يوحنا على أهل اليهودية أو القيادات اليهودية، لذلك تُذكر إمكانات الدلالة في الحاشية من غير حسم زائد في المتن.
- source_word: διὰ
  choice: بسبب
  rationale: تأتي διά مع النصب هنا للدلالة على السبب، و«بسبب» واضحة ومألوفة في العربية المعاصرة.
- source_word: τοὺς λόγους τούτους
  choice: هذه الأقوال
  rationale: تشير العبارة إلى ما قاله يسوع قبل ذلك. و«الأقوال» أوضح في الإحالة إلى كلام متصل من «الكلمات»، مع بقاء «هذا الكلام» احتمالًا صحيحًا.
theological_decisions:
- issue: مدلول Ἰουδαῖοι في إنجيل يوحنا
  choice: إبقاء «اليهود» في المتن مع حاشية توضيحية
  alternative: «أهل اليهودية» أو «القادة اليهود»
  rationale: يحافظ المتن على المقابل المباشر للفظ اليوناني، بينما تمنع الحاشية فهمه على أنه تعميم بالضرورة على الشعب اليهودي كله، وتصون في الوقت نفسه الاحتمال السياقي بدل حسمه تفسيريًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة، مع ترتيب عربي طبيعي يحافظ على السببية والتكرار. وُضع مؤشر الحاشية بعد الجملة لأنه يشرح لفظ «اليهود» الوارد فيها.
