  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: κἀγὼ ⸂δίδωμι αὐτοῖς ζωὴν αἰώνιον⸃, καὶ οὐ μὴ ἀπόλωνται εἰς τὸν αἰῶνα, καὶ οὐχ ἁρπάσει τις αὐτὰ ἐκ τῆς χειρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/028.yaml
  text: And I give them eternal life, and they will certainly never perish forever, and no one will snatch them out of my hand.
translation:
  language: ar
  text: وأنا أعطيها حياة أبدية، ولن تهلك أبدًا، ولن ينتزعها أحد من يدي.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζωὴν αἰώνιον
  choice: حياة أبدية
  rationale: تعبير عربي طبيعي ودقيق ينقل معنى الحياة ذات الصفة الأبدية.
- source_word: οὐ μὴ ἀπόλωνται εἰς τὸν αἰῶνα
  choice: لن تهلك أبدًا
  rationale: ينقل النفي اليوناني المؤكد مع العبارة الزمنية إلى صياغة عربية قوية وطبيعية، من دون التكرار غير المألوف «لن تهلك إلى الأبد أبدًا».
- source_word: ἁρπάσει
  choice: ينتزع
  rationale: يحفظ معنى الأخذ بالقوة أو الاختطاف من قبضة صاحب اليد.
- source_word: αὐτά
  choice: ها
  rationale: الضمير اليوناني محايد جمعًا لأنه يعود إلى «الخراف» في السياق؛ العربية تعامل غير العاقل جمعًا معاملة المفرد المؤنث.
- source_word: ἐκ τῆς χειρός μου
  choice: من يدي
  rationale: ترجمة مباشرة تحفظ الصورة المجازية للحماية والسلطان.
theological_decisions:
- issue: قوة النفي ودوامه
  choice: لن تهلك أبدًا
  alternative: لن تهلك إلى الأبد
  rationale: يحفظ هذا الاختيار التوكيد الشديد في οὐ μή مع εἰς τὸν αἰῶνα، من غير إضافة استنتاج مذهبي يتجاوز العبارة.
- issue: دلالة «الحياة الأبدية»
  choice: الإبقاء على التعبير بلا شرح تفسيري
  alternative: الحياة التي لا تنتهي
  rationale: يحافظ على المصطلح اليوحناوي وما قد يحمله من غنى دلالي، بدل اختزاله في المدة الزمنية وحدها.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة، مع الحفاظ على توازي الجمل وصورة اليد. استُخدم ضمير المفرد المؤنث عائدًا إلى الخراف المذكورة في السياق السابق.
