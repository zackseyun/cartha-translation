source:
  edition: SBLGNT
  text: καθὼς γινώσκει με ὁ πατὴρ κἀγὼ γινώσκω τὸν πατέρα, καὶ τὴν ψυχήν μου τίθημι ὑπὲρ τῶν προβάτων.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/015.yaml
  text: just as the Father knows me and I know the Father[b][a], and I lay down my life for the sheep.
translation:
  language: ar
  text: كما أن الآب يعرفني وأنا أعرف الآب، وأبذل حياتي[a] لأجل الخراف.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «نفسي». والمقصود هنا الحياة في سياق بذل الذات.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «نيابةً عن الخراف». وقد يفيد حرف الجر اليوناني معنى النيابة أو البذل القرباني.'
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς
  choice: كما أن
  rationale: تُدخل أداة المقارنة بوضوح وبصياغة عربية طبيعية، مع إبقاء الصلة بالسياق السابق.
- source_word: γινώσκει / γινώσκω
  choice: يعرفني / أعرف
  rationale: يحافظ فعل «عرف» على المعنى العلائقي العميق وعلى التوازي اللفظي بين معرفة الآب والابن.
- source_word: ὁ πατὴρ / τὸν πατέρα
  choice: الآب
  rationale: يحافظ على أداة التعريف وعلى الاستعمال اليوحناوي، من غير إضافة ضمير ملكية غير موجود في اليونانية.
- source_word: κἀγὼ
  choice: وأنا
  rationale: ينقل اقتران καί بالضمير ἐγώ ويحفظ التوازن بين شطري العبارة.
- source_word: τὴν ψυχήν μου
  choice: حياتي
  rationale: تدل ψυχή هنا على الحياة التي تُبذل في الموت، لا على النفس بوصفها جانبًا غير مادي فحسب.
- source_word: τίθημι
  choice: أبذل
  rationale: «أبذل حياتي» تعبير عربي طبيعي ينقل في هذا السياق معنى تقديم الحياة طوعًا، وإن كان المعنى الحرفي للفعل هو «أضع».
- source_word: ὑπὲρ
  choice: لأجل
  rationale: ينقل معنى المنفعة والنيابة أو البذل القرباني من غير حصره في صيغة عقائدية تقنية واحدة.
- source_word: τῶν προβάτων
  choice: الخراف
  rationale: يحفظ صورة الراعي والخراف المركزية في المقطع بدل تحويل الاسم إلى «القطيع».
theological_decisions:
- issue: دلالة ὑπὲρ في بذل يسوع نفسه
  choice: لأجل الخراف
  alternative: نيابةً عن الخراف
  rationale: «لأجل» تحفظ اتساع الدلالة، بما فيها المنفعة والنيابة والبُعد القرباني، من غير أن تحسمها في تفسير عقائدي أضيق من النص.
- issue: معنى ψυχή في السياق
  choice: حياتي
  alternative: نفسي
  rationale: السياق يتحدث عن موت الراعي الطوعي من أجل الخراف؛ لذلك تشير الكلمة إلى حياته، مع إثبات المقابل الحرفي في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختير «أبذل حياتي» لطبيعته في العربية ولدلالته على الفعل الطوعي، مع الحفاظ على التوازي الموجز في صدر الآية وإبقاء صورة الخراف كما هي.
