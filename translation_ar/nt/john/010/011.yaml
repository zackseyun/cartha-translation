lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: أنا هو
  rationale: صياغة عربية طبيعية تحفظ ضمير المتكلم الصريح ونبرة التعريف بالنفس، من غير توسيع لاهوتي يتجاوز العبارة في سياقها.
- source_word: ποιμήν
  choice: الراعي
  rationale: المقابل المباشر والملائم للصورة الرعوية، ولا يستورد دلالة كنسية لاحقة مثل «القس».
- source_word: καλός
  choice: الصالح
  rationale: ينقل معنى الجودة والصلاح والجدارة في هذا اللقب بصياغة عربية راسخة وطبيعية، مع الإشارة في الحاشية إلى إمكان معنى «النبيل» أو «المثالي».
- source_word: τὴν ψυχὴν αὐτοῦ τίθησιν
  choice: يبذل حياته
  rationale: هذا هو المقابل العربي الطبيعي للتعبير اليوناني الذي يعني حرفيًا وضع النفس، والمقصود به تقديم الحياة والتضحية بها.
- source_word: ὑπὲρ
  choice: عن
  rationale: يحفظ القوة النيابية أو التمثيلية المحتملة للجار اليوناني في عبارة عربية موجزة، من غير حصرها في نظرية كفارية بعينها.
- source_word: τῶν προβάτων
  choice: الخراف
  rationale: يحفظ أداة التعريف ولا يضيف ضمير ملكية غير موجود في اليونانية.
theological_decisions:
- issue: قوة عبارة التعريف بالنفس Ἐγώ εἰμι
  choice: أنا هو
  alternative: أنا نفسي الراعي الصالح؛ أو صياغة تُبرز تلميحًا مباشرًا إلى الاسم الإلهي
  rationale: تؤدي العبارة هنا وظيفة إسنادية في التعريف بالنفس. وتحفظ الصياغة العربية الضمير الصريح من غير أن تحسم ما قد يكون للعبارة من أصداء يوحناوية أوسع.
- issue: دلالة καλός في لقب الراعي
  choice: الراعي الصالح
  alternative: الراعي النبيل؛ الراعي المثالي
  rationale: «الصالح» دقيق ومألوف، ويتيح معنى الجودة الأخلاقية والجدارة من غير تضييق الدلالة على وجه واحد.
- issue: دلالة ὑπὲρ τῶν προβάτων بالنسبة إلى موت يسوع
  choice: عن الخراف
  alternative: لأجل الخراف؛ نيابةً عن الخراف
  rationale: تحفظ «عن» إمكان الدلالة على النيابة أو العمل لمصلحة الخراف، من غير فرض صياغة مذهبية تفصيلية لا يصرح بها العدد وحده.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت عبارة «يبذل حياته» بوصفها المقابل الاصطلاحي الطبيعي لـ«يضع نفسه»، مع إبقاء بدائل καλός وὑπέρ في الحواشي. وُضعت علامة الحاشية [a] بعد «الصالح»، و[b] بعد الجملة التي تتعلق بدلالة «عن».
