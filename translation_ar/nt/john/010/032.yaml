base_translation:
  language: en
  yaml_path: translation/nt/john/010/032.yaml
  text: Jesus answered them[a], “I showed you many good works from the Father[b]; for which of them are you stoning me?”
translation:
  language: ar
  text: 'فأجابهم يسوع: «أظهرت لكم أعمالًا حسنة كثيرة من الآب[a]؛ فلأيّ عملٍ منها[b] ترجمونني بالحجارة؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ اليونانية: «من الآب»، لا «من أبي».'
    reason: alternative_reading
  - marker: b
    text: 'أو: «فبسبب أيّ عملٍ منها؟»'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: أجاب
  rationale: فعل سردي عربي مألوف ينقل معنى الرد مباشرة من غير زيادة.
- source_word: Πολλὰ ἔργα καλὰ
  choice: أعمالًا حسنة كثيرة
  rationale: تحافظ «أعمال» على دلالة ἔργα المهمة في إنجيل يوحنا، وتنقل «حسنة» معنى καλὰ بوصفها أعمالًا جيدة نافعة وجديرة بالتقدير.
- source_word: ἔδειξα
  choice: أريتكم
  rationale: تنقل معنى الإظهار للعيان، وتلائم كون أعمال يسوع قد عُرضت أمام مخاطبيه.
- source_word: ἐκ τοῦ πατρός
  choice: من عند الآب
  rationale: تعبير عربي طبيعي يدل على المصدر، ويحافظ على أداة التعريف في اليونانية من دون إضافة ضمير الملكية «أبي».
- source_word: διὰ ποῖον αὐτῶν ἔργον
  choice: فلأيّ عمل منها
  rationale: تنقل «اللام» معنى السبب أو الأساس الذي تؤديه διά مع النصب، وتحافظ على إفراد «عمل» وعلى رجوع «منها» إلى الأعمال الكثيرة.
- source_word: ἐμὲ λιθάζετε
  choice: ترجمونني
  rationale: الفعل «رجم» هو المقابل العربي المباشر للرجم بالحجارة، وصيغة المضارع تحفظ حيوية المواجهة من غير إضافة معنى المحاولة أو الإرادة غير المصرح به.
theological_decisions:
- issue: الإشارة إلى الآب في قول يسوع
  choice: من عند الآب
  alternative: من عند أبي
  rationale: النص اليوناني يقول τοῦ πατρός من دون ضمير ملكية. لذلك تُحفظ عبارة «الآب» كما هي، فلا تُزاد دلالة بنوية صريحة على اللفظ، مع بقاء العلاقة واضحة من السياق.
- issue: طبيعة صلة الأعمال بالآب
  choice: 'صياغة تدل على المصدر: «من عند الآب»'
  alternative: نيابةً عن الآب
  rationale: حرف ἐκ يدل أساسًا على المصدر أو المنشأ؛ أما «نيابةً عن» فتحدد معنى الوكالة على نحو أضيق مما يصرح به النص.
translation_notes:
  register: صياغة عربية فصحى واضحة وموقرة. استُعملت «أريتكم» بدل تركيب أثقل مثل «أظهرت لكم»، و«ترجمونني» بلا إضافة «تحاولون» للمحافظة على صيغة النص المباشرة. تظهر علامتا الحاشيتين [a] و[b] في موضعيهما داخل المتن.
