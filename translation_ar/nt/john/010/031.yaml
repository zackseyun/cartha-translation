  text: So the Jews picked up stones again to stone him[a].
translation:
  language: ar
  text: فأخذ اليهود مرة أخرى حجارة ليرجموه[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو ربما بحسب السياق: «زعماء اليهود» أو «أهل اليهودية». كثيرًا ما تشير عبارة يوحنا «اليهود» إلى معارضين يهود معيّنين ليسوع، لا إلى الشعب اليهودي كله.'
    reason: قراءة بديلة وتوضيح نطاق مدلول العبارة
lexical_decisions:
- source_word: Ἐβάστασαν
  choice: حمل
  rationale: يفيد الفعل أخذ الشيء أو حمله. ومع «حجارة» في هذا السياق العدائي، تنقل «حمل» الفعل بوضوح من غير إضافة معنى غير مصرّح به.
- source_word: οὖν
  choice: فـ
  rationale: تفيد الفاء الصلة والنتيجة المتتابعة لما سبق، وهي طبيعية وموجزة في السرد العربي.
- source_word: πάλιν
  choice: أيضًا
  rationale: يدل اللفظ على تكرار الفعل؛ و«أيضًا» هنا تعبر عن عودتهم إلى الفعل مرة أخرى بسلاسة.
- source_word: λίθους
  choice: حجارةً
  rationale: ترجمة مباشرة للاسم، مع إبقاء قصد الرجم في الفعل اللاحق بدل تحميل الاسم معنى زائدًا.
- source_word: οἱ Ἰουδαῖοι
  choice: اليهود
  rationale: هذه هي المقابلة المباشرة للعبارة اليونانية. وقد يكون مدلولها في سياق يوحنا أضيق من عموم الشعب اليهودي، لذلك يُذكر هذا الاحتمال في الحاشية من غير تضييق النص الرئيس.
- source_word: ἵνα
  choice: لـ
  rationale: اللام تعبّر طبيعيًا عن الغرض المقصود في العربية.
- source_word: λιθάσωσιν
  choice: يرجموه
  rationale: الفعل اليوناني يعني الرجم بالحجارة تحديدًا، و«يرجم» هو المقابل العربي الدقيق والمألوف.
- source_word: αὐτόν
  choice: ـه
  rationale: ضمير المفعول يعود إلى يسوع، واتصاله بالفعل هو الصياغة العربية الطبيعية.
theological_decisions:
- issue: مدلول عبارة οἱ Ἰουδαῖοι ونطاقها في إنجيل يوحنا
  choice: إبقاء «اليهود» في المتن مع توضيح الاحتمال السياقي في الحاشية
  alternative: زعماء اليهود؛ أو اليهوديون، أي أهل اليهودية
  rationale: العبارة اليونانية صريحة، فلا ينبغي تضييق مدلولها في المتن بما لا تصرح به الآية. لكن استعمال يوحنا قد يشير بحسب السياق إلى معارضين يهود معيّنين، لا إلى الشعب اليهودي كله، فتحفظ الحاشية هذا الاحتمال وتمنع التعميم.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعمل التركيب الموجز «ليرجموه» لنقل الغرض، وأُبقيت عبارة «اليهود» قريبة من الأصل مع حاشية تمنع فهمها تعميمًا على الشعب كله.
