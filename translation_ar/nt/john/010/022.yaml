lexical_decisions:
- source_word: Ἐγένετο
  choice: أُقيم
  rationale: الفعل هنا يقدّم وقوع مناسبة احتفالية؛ وصيغة «أُقيم» عربية طبيعية مع الأعياد وتحفظ المعنى الحدثي.
- source_word: τότε
  choice: وفي ذلك الوقت
  rationale: تنقل الإشارة الزمنية وتصل العبارة بسياق السرد اتصالًا طبيعيًا.
- source_word: τὰ ἐγκαίνια
  choice: عيدُ التجديد
  rationale: يشير اللفظ إلى احتفال تجديد تكريس الهيكل؛ وهذه الصياغة تترجم مدلوله بدل الاكتفاء بالاسم الشائع «حانوكا».
- source_word: ἐν τοῖς Ἱεροσολύμοις
  choice: في أورشليم
  rationale: تعبير مكاني واضح وطبيعي، مع اعتماد الاسم العربي الكتابي المألوف للمدينة.
- source_word: χειμὼν ἦν
  choice: وكان فصلُ الشتاء
  rationale: ينقل الجملة الوصفية البسيطة بوضوح، ويجعل المقصود الموسمي صريحًا في العربية.
theological_decisions:
- issue: تحديد مدلول τὰ ἐγκαίνια
  choice: عيدُ التجديد في المتن
  alternative: حانوكا؛ أو عيد تدشين الهيكل
  rationale: يحافظ المتن على ترجمة المصطلح اليوناني، بينما توضّح الحاشية الاسم اليهودي الشائع وخلفية العيد، من غير فرض دلالة عقائدية إضافية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «أورشليم» لمألوفيتها في السياق الكتابي، و«عيد التجديد» ترجمةً مباشرة مع بيان الخلفية الثقافية في الحاشية.
