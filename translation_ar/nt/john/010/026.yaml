  yaml_path: translation/nt/john/010/026.yaml
  text: But you do not believe[a], because you are not among my sheep.
translation:
  language: ar
  text: لكِنَّكُمْ لَا تُؤْمِنُونَ، لِأَنَّكُمْ لَسْتُمْ مِنْ خِرَافِي.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لكنكم لا تؤمنون بأنكم لستم من خرافي». يمكن أن تُفهم أداة الربط اليونانية على أنها تُدخل مضمون الإيمان، لا أنها تبيّن السبب.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: لكِنَّ
  rationale: أداة استدراك تُظهر التعارض مع الكلام السابق، وهي طبيعية وواضحة في العربية الفصحى المعاصرة.
- source_word: ὑμεῖς
  choice: كُمْ في «لكنكم»
  rationale: الضمير مذكور صراحةً في اليونانية للتوكيد والمقابلة، ويؤديه الضمير المتصل في العربية من غير مبالغة بإضافة «أنتم أنفسكم».
- source_word: οὐ πιστεύετε
  choice: لَا تُؤْمِنُونَ
  rationale: ينقل المضارع المنفي بصورة طبيعية، ويحافظ على دلالة الإيمان الشائعة في إنجيل يوحنا.
- source_word: ὅτι
  choice: لِأَنَّ
  rationale: قُرئت سببيةً وفق السياق الأرجح، مع حفظ إمكان كونها مُدخِلةً لمضمون الإيمان في الحاشية.
- source_word: οὐκ ἐστὲ
  choice: لَسْتُمْ
  rationale: مقابل عربي مباشر وطبيعي لفعل الكينونة المنفي.
- source_word: ἐκ τῶν προβάτων
  choice: مِنْ خِرَافِي
  rationale: تفيد «مِن» الانتساب إلى جماعة الخراف، وتطابق تركيب «من خرافي» المألوف والواضح في هذا السياق.
- source_word: τῶν ἐμῶν
  choice: خِرَافِي
  rationale: تنقل الملكية بإضافة الاسم إلى ضمير المتكلم، وهي الصياغة العربية الأوجز والأفصح.
theological_decisions:
- issue: دلالة ὅτι وعلاقتها بعدم الإيمان والانتماء إلى خراف يسوع
  choice: 'القراءة السببية: «لأنكم لستم من خرافي»'
  alternative: 'قراءة المضمون: «لكنكم لا تؤمنون بأنكم لستم من خرافي»'
  rationale: تنسجم السببية على الأرجح مع المقابلة السياقية بين خراف يسوع التي تسمع صوته وتتبعه وبين المخاطَبين الذين لا يؤمنون. ومع ذلك، لا يُحسم الاحتمال النحوي الآخر، بل يُحفظ في الحاشية تجنبًا لحل التوتر اللاهوتي بما يتجاوز النص.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعملت «خرافي» بدل تعبير أطول مثل «من بين خرافي» لأن «من خرافي» طبيعية وتحفظ معنى الانتساب إلى الجماعة. وُضعت علامة الحاشية في المتن كما هو مطلوب.
