  text: ἀπεκρίθησαν αὐτῷ οἱ ⸀Ἰουδαῖοι· Περὶ καλοῦ ἔργου οὐ λιθάζομέν σε ἀλλὰ περὶ βλασφημίας, καὶ ὅτι σὺ ἄνθρωπος ὢν ποιεῖς σεαυτὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/033.yaml
  text: The Jews answered him[a], “We are not stoning you for a good work, but for blasphemy, and because you, being a man, make yourself God.”
translation:
  language: ar
  text: 'أجابه اليهود: «لسنا نرجمك من أجل عمل صالح، بل من أجل التجديف، ولأنك، وأنت إنسان، تجعل نفسك الله[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «تجعل نفسك إلهًا». جاءت θεόν في اليونانية بلا أداة تعريف، لكن سياق تهمة التجديف يرجّح أن المقصود هو «الله».'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰουδαῖοι
  choice: اليهود
  rationale: ترجمة مباشرة تحفظ تعبير يوحنا من غير أن تحصر المرجع في القادة اليهود أو سكان اليهودية، مع أن السياق يشير إلى الجماعة المعادية التي تواجه يسوع.
- source_word: Περὶ καλοῦ ἔργου
  choice: من أجل عمل صالح
  rationale: تنقل περί مع المضاف إليه هنا بوصفها دالة على السبب، وتحفظ إفراد ἔργου والمعنى الأخلاقي لـ καλοῦ بصياغة عربية طبيعية.
- source_word: λιθάζομέν
  choice: نرجمك
  rationale: الفعل المضارع يلائم المواجهة الجارية وقصدهم المباشر، و«نرجمك» هو التعبير العربي الطبيعي الواضح.
- source_word: βλασφημίας
  choice: التجديف
  rationale: هو المصطلح العربي المألوف للكلام أو الادعاء الذي يُعد إهانة لله، ويلائم صراحةً التهمة في السياق.
- source_word: ἄνθρωπος ὢν
  choice: وأنت إنسان
  rationale: تحفظ البنية الظرفية ذات القوة الاستدراكية من غير إضافة «مجرد» التي ليست في النص، وتبرز التناقض الذي يقصده المتكلمون.
- source_word: ποιεῖς σεαυτὸν θεόν
  choice: تجعل نفسك الله
  rationale: 'تحفظ معنى ποιέω مع الضمير الانعكاسي والمحمول: «تجعل نفسك كذا». واختيار «الله» ينقل أرجح معنى للتهمة في سياق التجديف، مع إثبات الاحتمال النحوي الآخر في الحاشية.'
theological_decisions:
- issue: دلالة θεόν غير المعرّفة بأداة التعريف في تهمة ποιεῖς σεαυτὸν θεόν
  choice: الله
  alternative: إلهًا
  rationale: مع أن غياب أداة التعريف في اليونانية يتيح من حيث الصياغة معنى «إلهًا»، فإن سياق تهمة التجديف والمواجهة في إنجيل يوحنا يرجّح أن المقصود ادعاء مقام يخص إله إسرائيل. أُبقي الاحتمال الآخر في الحاشية حتى لا يُطمس الغموض اللغوي الحقيقي.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ومهيبة. استُخدم «التجديف» بوصفه المصطلح الكتابي الشائع، وحُفظت مباشرة الاتهام وتوتره اللاهوتي من دون تضييق مدلول «اليهود» أو إضافة وصف غير وارد في النص.
