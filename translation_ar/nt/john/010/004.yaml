base_translation:
  language: en
  yaml_path: translation/nt/john/010/004.yaml
  text: When he has brought out all his own[a], he goes before them, and the sheep follow him, because they know his voice.
translation:
  language: ar
  text: ومتى أخرج خرافه كلها[a]، يسير أمامها، والخراف تتبعه لأنها تعرف صوته.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «دفعها إلى الخارج» أو «قادها إلى الخارج»؛ فالفعل اليوناني قد يفيد الدفع أو الإخراج من مكانٍ مسوَّر.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: ومتى
  rationale: تفيد أداة الزمن مع صيغة الاحتمال معنى «حين/متى»، وتحافظ «ومتى» على الطابع العام للمشهد من غير أن تجعله حدثًا وقع مرة واحدة فقط.
- source_word: τὰ ἴδια πάντα
  choice: خاصته جميعًا
  rationale: يحيل التعبير إلى كل ما يخص الراعي، والمقصود في السياق خرافه. وتحافظ الصياغة على التعبير اليوناني من غير إضافة «خرافه» قبل ورود «الخراف» صراحة في بقية الآية.
- source_word: ἐκβάλῃ
  choice: أخرج
  rationale: يدل الفعل على الحركة إلى خارج الحظيرة، وقد يحمل معنى الدفع أو الطرد. «أخرج» طبيعي في سياق الرعي ولا يفرض قسوة لا يقتضيها السياق، مع بيان البدائل في الحاشية.
- source_word: ἔμπροσθεν αὐτῶν πορεύεται
  choice: يسير أمامها
  rationale: ينقل بوضوح صورة الراعي الذي يتقدم خرافه، وضمير غير العاقل في العربية يلائم المرجع المقصود في السياق.
- source_word: τὰ πρόβατα αὐτῷ ἀκολουθεῖ
  choice: والخراف تتبعه
  rationale: «الخراف» المقابل المعتاد لـπρόβατα، و«تتبعه» صياغة عربية طبيعية للفعل مع مفعوله في الداتيف اليوناني.
- source_word: ὅτι οἴδασιν τὴν φωνὴν αὐτοῦ
  choice: لأنها تعرف صوته
  rationale: تبيّن «لأن» سبب اتباع الخراف له، وتحافظ «تعرف» على المعنى المباشر للفعل، مع اشتماله سياقيًا على تمييز الصوت.
theological_decisions:
- issue: صورة الراعي ودلالة ἐκβάλῃ
  choice: أخرج
  alternative: دفع إلى الخارج أو قاد إلى الخارج
  rationale: السياق يصور الراعي مع خرافه، لا طردًا عدائيًا. لذلك تنقل «أخرج» الحركة من داخل الحظيرة إلى خارجها من غير إدخال معنى لاهوتي قسري، بينما تحفظ الحاشية سعة دلالة الفعل.
translation_notes:
  register: صياغة عربية فصحى معاصرة، واضحة وموقرة. استُعملت «خاصته» للمحافظة على التعبير اليوناني الموجز، مع إبقاء صورة الخراف والراعي طبيعية ومفهومة.
