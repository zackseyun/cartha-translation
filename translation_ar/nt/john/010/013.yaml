  yaml_path: translation/nt/john/010/013.yaml
  text: because he is a hired hand and does not care about the sheep.
translation:
  language: ar
  text: لِأَنَّهُ أَجِيرٌ، وَلَا يَهْتَمُّ بِالْخِرَافِ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: لِأَنَّهُ
  rationale: تفيد الأداة هنا التعليل، إذ تبيّن سبب هرب الأجير المذكور في السياق السابق.
- source_word: μισθωτός
  choice: أَجِيرٌ
  rationale: تدل الكلمة على من يعمل لقاء أجر، و«أجير» تعبير عربي موجز وطبيعي يلائم سياق الرعاية.
- source_word: οὐ μέλει αὐτῷ περὶ
  choice: وَلَا يَهْتَمُّ بِـ
  rationale: ينقل هذا التعبير معنى عدم الاكتراث أو العناية نقلاً واضحًا وطبيعيًا، مع إبقاء القوة الأخلاقية في العبارة.
- source_word: τῶν προβάτων
  choice: الْخِرَافِ
  rationale: يحافظ اللفظ على الصورة الرعوية المباشرة في اليونانية، من غير استبداله بلفظ «القطيع» الأوسع دلالة.
theological_decisions:
- issue: وصف الأجير في مقابل الراعي الصالح
  choice: 'صياغة العبارة بوصفها حكمًا أخلاقيًا مباشرًا: الأجير لا يهتم بالخراف.'
  alternative: تعيين الأجير فئةً محددة من القادة الكذبة، أو تخفيف العبارة لتدل على مجرد فتور مهني.
  rationale: النص يذكر سبب التصرف بوضوح من غير أن يحدد هوية رمزية بعينها للأجير؛ لذلك تحافظ الترجمة على المقابلة مع الراعي الصالح من دون إضافة استنتاج عقائدي.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. استُعمل «أجير» لسلامته ودقته، و«يهتم بالخراف» لطبيعته ووضوحه لدى القارئ العام.
