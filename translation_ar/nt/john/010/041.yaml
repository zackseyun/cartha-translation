source:
  edition: SBLGNT
  text: καὶ πολλοὶ ἦλθον πρὸς αὐτὸν καὶ ἔλεγον ὅτι Ἰωάννης μὲν σημεῖον ἐποίησεν οὐδέν, πάντα δὲ ὅσα εἶπεν Ἰωάννης περὶ τούτου ἀληθῆ ἦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/041.yaml
  text: And many came to him and were saying, “John did no sign, but everything that John said about this man was true.”
translation:
  language: ar
  text: 'وجاء إليه كثيرون، وكانوا يقولون: «إن يوحنا لم يصنع أية آية[a]، لكن كل ما قاله يوحنا عن هذا الرجل[b] كان حقًّا».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لم يُجرِ أية آية».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «عنه». واليونانية حرفيًّا: «عن هذا» أو «عن هذا الرجل».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: كثيرون
  rationale: الصفة في اليونانية مستعملة استعمال الاسم، و«كثيرون» تؤدي المعنى بوضوح من غير زيادة.
- source_word: ἦλθον πρὸς αὐτὸν
  choice: جاء إليه
  rationale: ينقل حركة الناس نحو يسوع بصياغة عربية طبيعية ملائمة لمنظور السرد.
- source_word: ἔλεγον
  choice: كانوا يقولون
  rationale: تحفظ الصيغة دلالة الماضي الناقص على القول المستمر أو المتكرر من غير مبالغة في تحديد تكراره.
- source_word: σημεῖον
  choice: آية
  rationale: «آية» مصطلح عربي مناسب للعلامة الدالة ذات المغزى في إنجيل يوحنا، ولا تختزلها في مجرد معجزة.
- source_word: ἐποίησεν οὐδέν
  choice: لم يصنع أية آية
  rationale: صياغة عربية واضحة وقريبة من التركيب اليوناني الذي ينفي صنع أي آية.
- source_word: πάντα δὲ ὅσα
  choice: لكن كل ما
  rationale: تحفظ الشمول الذي يفيده التركيب اليوناني مع إبراز المقابلة بواسطة «لكن».
- source_word: περὶ τούτου
  choice: عن هذا الرجل
  rationale: تحفظ قوة اسم الإشارة τούτου وتوضح أن الكلام عن يسوع، مع بقاء البديل الأقصر «عنه» ممكنًا.
- source_word: ἀληθῆ ἦν
  choice: كان حقًّا
  rationale: تنقل الحكم بأن مجموع أقوال يوحنا كان مطابقًا للحق، من غير إضافة معنى التحقق اللاحق.
theological_decisions:
- issue: مصطلح σημεῖον في إنجيل يوحنا
  choice: آية
  alternative: معجزة
  rationale: اختيرت «آية» حفاظًا على وظيفة أعمال يسوع بوصفها علامات تشير إلى حقيقة تتجاوز الحدث نفسه، بدل تسطيح المصطلح إلى مجرد عمل خارق.
- issue: إحالة περὶ τούτου إلى يسوع
  choice: عن هذا الرجل
  alternative: عنه
  rationale: تحفظ الترجمة قوة اسم الإشارة اليوناني من غير إدخال تفسير عقائدي؛ ويُذكر البديل الطبيعي في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «كانوا يقولون» لحفظ جانب الاستمرار في الماضي الناقص، و«آية» للمحافظة على مصطلح يوحنا المحوري.
