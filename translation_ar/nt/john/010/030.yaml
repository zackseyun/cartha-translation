  text: ἐγὼ καὶ ὁ πατὴρ ἕν ἐσμεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/030.yaml
  text: I and the Father are one[a].
translation:
  language: ar
  text: أنا والآب واحد[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: الكلمة اليونانية المترجمة «واحد» محايدة نحويًا، فتؤكد الوحدانية من غير أن تجعل يسوع والآب شخصًا واحدًا.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ
  choice: أنا
  rationale: ضمير المتكلم المفرد مذكور صراحةً في اليونانية للتوكيد، ولذلك أُبقي ظاهرًا في العربية.
- source_word: καὶ
  choice: و
  rationale: حرف عطف بسيط يصل بين الفاعلين من غير إضافة معنى تفسيري.
- source_word: ὁ πατὴρ
  choice: الآب
  rationale: في الاستعمال اليوحناوي يشير اللفظ المعرّف إلى أبي يسوع بوصفه لقبًا إلهيًا شخصيًا؛ و«الآب» هي الصياغة العربية المألوفة والدقيقة في هذا السياق.
- source_word: ἕν
  choice: واحد
  rationale: اللفظ اليوناني محايد مفرد، فيدل على الوحدانية من غير أن يجعل يسوع والآب شخصًا واحدًا. و«واحد» تحافظ على إيجاز الأصل وتوتره الدلالي دون توسيع تفسيري.
- source_word: ἐσμεν
  choice: '[مفهوم من الجملة الاسمية العربية]'
  rationale: هو فعل كون في صيغة المتكلم الجمع، ويُفهم معنى الجمع في العربية من المبتدأ المركب «أنا والآب» والخبر «واحد». لا تحتاج الجملة الاسمية العربية الطبيعية إلى فعل ظاهر في الزمن الحاضر.
theological_decisions:
- issue: دلالة ἕν المحايد مع ἐσμεν بصيغة الجمع في قول ذي أهمية مسيانية
  choice: «أنا والآب واحد» بوصفها تأكيدًا لوحدانية حقيقية مع بقاء التمييز بين يسوع والآب.
  alternative: «أنا والآب شيء واحد» أو «أنا والآب في وحدة»
  rationale: صيغة «واحد» تنقل العبارة المباشرة من غير إضعافها إلى مجرد اتفاق، ومن غير توسيعها إلى مصطلحات عقائدية لاحقة. وتوضح الحاشية أن ἕν محايد، بما يحفظ التوتر بين الوحدانية والتمييز الشخصي.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة ووقورة. استُخدمت الصياغة الاسمية الطبيعية «أنا والآب واحد»، مع إبقاء الحاشية لشرح المعلومة النحوية اليونانية التي لا تظهر في العربية.
