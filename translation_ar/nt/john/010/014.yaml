lexical_decisions:
- source_word: ποιμήν
  choice: الراعي
  rationale: هذا هو المعنى العادي للكلمة، ويحفظ صورة رعاية الغنم في سياق الخطاب، من غير إدخال دلالة كنسية لاحقة مثل «القس».
- source_word: καλός
  choice: الصالح
  rationale: تنقل «الصالح» معنى الجودة الأخلاقية والجدارة الملائمة في وصف الراعي، وهي عبارة عربية طبيعية وراسخة من دون تضييق المعنى إلى مجرد المهارة.
- source_word: γινώσκω / γινώσκουσί
  choice: أعرف / تعرفني
  rationale: يحفظ فعل «عرف» معنى المعرفة الشخصية المتبادلة، ولا يقصره على الإدراك الذهني أو التعرف العابر.
- source_word: τὰ ἐμὰ / τὰ ἐμά
  choice: خاصتي
  rationale: تحفظ «خاصتي» التعبير اليوناني الموجز الدال على من ينتمون إلى المتكلم، من غير إضافة «الخراف» صراحة مع أنها مفهومة من السياق.
- source_word: ἐγώ εἰμι
  choice: أنا
  rationale: الجملة الاسمية العربية «أنا الراعي الصالح» هي الصياغة الطبيعية المطابقة للتعريف الذاتي في اليونانية، ولا تحتاج إلى فعل رابط في الزمن الحاضر.
- source_word: καί
  choice: و
  rationale: تحفظ الواو الربط التراكمي البسيط بين العبارات من غير إضافة توكيد غير منصوص عليه.
theological_decisions:
- issue: نقل العلاقة المتبادلة بين يسوع والمنتمين إليه من غير استيراد صياغات عقائدية لاحقة
  choice: خاصتي
  alternative: خرافي / الذين لي
  rationale: تُبقي «خاصتي» التركيز على الانتماء والمعرفة الشخصية المتبادلة، وتحفظ إيجاز الأصل وغموضه النحوي النسبي من غير التصريح باسم محذوف.
translation_notes:
  register: لغة عربية فصحى واضحة وموجزة وذات نبرة كريمة. استُعملت «خاصتي» بوصفها اسم جمع دالًا على المنتمين إلى المتكلم، وحُفظ التوازي اللفظي بين شطري الآية.
