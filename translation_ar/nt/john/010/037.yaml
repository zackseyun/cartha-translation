  text: εἰ οὐ ποιῶ τὰ ἔργα τοῦ πατρός μου, μὴ πιστεύετέ μοι·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/037.yaml
  text: If I am not doing the works of my Father[a], do not believe me;
translation:
  language: ar
  text: إن كنت لا أعمل أعمال أبي، فلا تصدّقوني[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فلا تصدّقوا ما أقوله».'
    reason: بديل معجمي يصرّح بالدلالة القولية الممكنة للفعل πιστεύω مع الضمير μοι.
lexical_decisions:
- source_word: εἰ οὐ ποιῶ
  choice: إن كنت لا أعمل
  rationale: ينقل الشرط مع نفي الفعل المضارع، ويحافظ على معنى العمل الجاري أو المعتاد من غير إثقال العبارة.
- source_word: τὰ ἔργα
  choice: أعمال
  rationale: «أعمال» هي المقابل الطبيعي الذي يحفظ الاستعمال اليوحنّاوي لأفعال يسوع بوصفها شاهدة له.
- source_word: τοῦ πατρός μου
  choice: أبي
  rationale: صياغة عربية مباشرة وطبيعية للإضافة اليونانية، والسياق يبيّن أن المقصود هو الآب.
- source_word: μὴ πιστεύετέ μοι
  choice: فلا تصدّقوني
  rationale: الفعل πιστεύω مع ضمير في حالة المجرور غير المباشر يفيد تصديق الشخص أو قبول شهادته. «تصدّقوني» تحفظ هذا التركيب الشخصي المباشر، ولا توسّعه في المتن إلى «ما أقوله».
theological_decisions:
- issue: دلالة πιστεύω مع μοι
  choice: فلا تصدّقوني
  alternative: فلا تصدّقوا ما أقوله
  rationale: يمكن أن يتداخل في التركيب معنى تصديق يسوع شخصيًا ومعنى قبول كلامه. اختيرت الصياغة الشخصية المباشرة في المتن، وأُثبت المعنى القولي المحتمل في الحاشية دون حسم التوتر بينهما.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموجزة، مع الحفاظ على بنية الشرط والنهي وعلى لفظ «أعمال» ذي الأهمية في سياق يوحنا.
