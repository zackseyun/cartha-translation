  text: πάντες ὅσοι ἦλθον ⸂πρὸ ἐμοῦ⸃ κλέπται εἰσὶν καὶ λῃσταί· ἀλλ’ οὐκ ἤκουσαν αὐτῶν τὰ πρόβατα.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/008.yaml
  text: All who came before me are thieves and robbers[a], but the sheep did not listen to them.
translation:
  language: ar
  text: جميع الذين أتوا قبلي لصوصٌ وقُطّاع طرقٍ[a]، لكن الخراف لم تستمع إليهم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «تقدّموني». قد تُفهم العبارة زمنيًا بمعنى «قبلي»، أو بمعنى أنهم تقدّموا مدّعين سلطةً بمعزل عن يسوع. ويشير السياق إلى الرعاة الكذبة، لا إلى جميع خدام الله السابقين.'
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες ὅσοι
  choice: جميع الذين
  rationale: تعبير عربي طبيعي يحفظ الشمول والتوزيع في العبارة اليونانية.
- source_word: ἦλθον
  choice: أتوا
  rationale: صيغة الماضي البسيط تلائم الفعل اليوناني الماضي ولا تضيف دلالة نتيجة حاضرة.
- source_word: πρὸ ἐμοῦ
  choice: قبلي
  rationale: يحفظ المعنى الزمني الأوضح بإيجاز، مع إبقاء احتمال معنى التقدّم أمامه في الحاشية.
- source_word: κλέπται
  choice: لصوص
  rationale: المقابل العربي المألوف لمن يسرق خفية، ويحفظ تمييز اللفظ عن λῃσταί.
- source_word: λῃσταί
  choice: قُطّاع طرق
  rationale: ينقل دلالة السلب العنيف أو الافتراسي ويميّزه عن «لصوص».
- source_word: ἀλλ’
  choice: لكن
  rationale: أداة استدراك عربية واضحة وطبيعية.
- source_word: οὐκ ἤκουσαν αὐτῶν
  choice: لم تستمع إليهم
  rationale: الفعل مع المضاف إليه يفيد السماع المتجاوب أو الإصغاء، وهو مناسب لصورة الخراف التي تميّز الصوت وتتبع صاحبه.
- source_word: τὰ πρόβατα
  choice: الخراف
  rationale: اللفظ العربي المعتاد في سياق الراعي والرعية، مع الحفاظ على التعريف والجمع.
theological_decisions:
- issue: نطاق ودلالة «جميع الذين أتوا قبلي»
  choice: إبقاء العبارة العامة «جميع الذين أتوا قبلي» في المتن دون تقييد صريح.
  alternative: جميع الذين تقدّموني، أي الذين ادّعوا سلطة الراعي بمعزل عن يسوع.
  rationale: صياغة اليونانية عامة، لكن السياق يتحدث عن رعاة كذبة ولا يقتضي إدانة جميع خدام الله السابقين. لذلك تُحفظ حدة العبارة وغموضها الحقيقي في المتن، ويُذكر التوضيح السياقي في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. استُخدم «قُطّاع طرق» للمحافظة على الفرق بين نوعي المجرمين في الأصل، ووُضعت علامة الحاشية بعد العبارة التي تتصل بها.
