  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: εἰ ἐκείνους εἶπεν θεοὺς πρὸς οὓς ὁ λόγος τοῦ θεοῦ ἐγένετο, καὶ οὐ δύναται λυθῆναι ἡ γραφή,
base_translation:
  language: en
  yaml_path: translation/nt/john/010/035.yaml
  text: If he called those to whom the word of God came ‘gods’—and the Scripture cannot be broken—[a][b]
translation:
  language: ar
  text: فَإِنْ كان قد سمّى «آلهةً» أولئك الذين جاءتهم كلمة الله — ولا يمكن أن يُنقَض الكتاب —[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ذوي صفة إلهية». يقول اليوناني حرفيًا «آلهة»، مرددًا صدى مزمور 82:6؛ ويفهم بعض المفسرين أن المقصود قضاة من البشر.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «لا يمكن أن يُبطَل» أو «لا يمكن أن يُنحّى جانبًا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: فَإِنْ كان
  rationale: تحافظ على بنية الشرط الحجاجية، وتلائم اتصال الآية بما بعدها في العربية.
- source_word: ἐκείνους
  choice: أولئك
  rationale: إحالة مباشرة إلى الأشخاص المذكورين في النص المقتبس، من غير إضافة أنهم رجال أو قضاة.
- source_word: εἶπεν
  choice: سمّى
  rationale: ينقل الاستعمال الخبري للفعل هنا، أي إطلاق تسمية «آلهة» عليهم، بصورة عربية طبيعية.
- source_word: θεοὺς
  choice: آلهةً
  rationale: ترجمة مباشرة للجمع اليوناني، وتحفظ الصدى اللفظي لمزمور 82:6 من غير تفسير المقصود بأنهم قضاة أو كائنات إلهية.
- source_word: πρὸς οὓς
  choice: الذين جاءتهم
  rationale: تفيد وصول كلمة الله إلى المخاطَبين، وهو المعنى الطبيعي للتركيب مع ἐγένετο.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: كلمة الله
  rationale: تعبير عربي واضح يشير هنا إلى قول الله أو خطابه، من غير حمله على معنى «الكلمة» الأقنومي في يوحنا 1.
- source_word: ἐγένετο
  choice: جاءت
  rationale: يحفظ المعنى الحدثي في التعبير الاصطلاحي «جاءتهم كلمة الله» من غير ترجمة حرفية ثقيلة.
- source_word: οὐ δύναται λυθῆναι
  choice: لا يمكن أن يُنقَض
  rationale: «يُنقَض» ينقل معنى إبطال سلطان النص أو إلغائه، وهو طبيعي في العربية وأدق من صورة «الكسر» الحرفية.
- source_word: ἡ γραφή
  choice: الكتاب
  rationale: تسمية عربية مألوفة للكتاب المقدس بوصفه النص المكتوب ذا السلطان، مع الحفاظ على التعريف في اليونانية.
theological_decisions:
- issue: مدلول «آلهة» في الاقتباس
  choice: إبقاء اللفظ «آلهة» في المتن بلا تفسير
  alternative: قضاة؛ كائنات إلهية
  rationale: حجة يسوع تعتمد على لفظ مزمور 82:6 نفسه؛ واستبداله بتفسير محدد يحسم خلافًا لا يحسمه هذا النص وحده.
- issue: معنى عدم إمكان نقض الكتاب
  choice: لا يمكن أن يُنقَض الكتاب
  alternative: لا يمكن أن يُبطَل الكتاب؛ لا يمكن تنحية الكتاب جانبًا
  rationale: ينقل التعبير عدم جواز إلغاء سلطان الكتاب أو إبطال حجته، مع إبقاء البدائل التوضيحية في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت «سمّى» لطبيعية التركيب، و«يُنقَض» لإظهار معنى الإبطال القانوني أو الحجاجي. وُضعت الجملة الاعتراضية بين شرطتين، وأُثبتت علامتا الحاشيتين في المتن.
