  text: But if I do them[a], even if you do not believe me, believe the works, so that you may know and continue to know that the Father is in me[c][b], and I am in the Father.
translation:
  language: ar
  text: لكن إن كنتُ أعملها، فحتى إن لم تصدّقوني[a]، صدّقوا الأعمال، لكي تعرفوا وتظلّوا تعرفون[b] أن الآب فيَّ وأنا في الآب.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لم تؤمنوا بي». فالتركيب اليوناني يحتمل تصديق كلام الشخص أو الإيمان به؛ ويرجّح السياق هنا «تصدّقوني» بسبب المقابلة مع «صدّقوا الأعمال».'
    reason: lexical_alternative
  - marker: b
    text: تعكس عبارة «تعرفوا وتظلّوا تعرفون» اختلاف صيغتي الفعل في اليونانية، وربما تشير إلى بلوغ المعرفة ثم الاستمرار فيها.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιῶ
  choice: كنتُ أعملها
  rationale: الفعل مضارع، وضمير المفعول المضاف في العربية يعود بوضوح إلى الأعمال المذكورة في السياق. وجاء بعد «إن» بصيغة «كنت أعملها» تعبيرًا عربيًا طبيعيًا عن تحقق الشرط المستمر، لا للدلالة على الماضي.
- source_word: κἂν ἐμοὶ μὴ πιστεύητε
  choice: فحتى إن لم تصدّقوني
  rationale: تركيب πιστεύω مع ضمير المجرور يحتمل تصديق كلام الشخص أو الإيمان به. اختير «تصدّقوني» لأنه يلائم المقابلة المباشرة مع «صدّقوا الأعمال»، مع إثبات البديل في الحاشية.
- source_word: τοῖς ἔργοις πιστεύετε
  choice: صدّقوا الأعمال
  rationale: يحافظ التعبير على إيجاز اليونانية وعلى كون الأعمال شاهدة لما يقوله يسوع، دون الإيحاء بأن الإيمان الديني موجَّه إلى الأعمال نفسها.
- source_word: ἔργοις
  choice: الأعمال
  rationale: «الأعمال» هو المقابل الطبيعي ويحفظ مصطلح يوحنا المتكرر؛ أما «الآيات» فتزيد تفسيرًا لأن الأصل هنا ἔργα لا σημεῖα.
- source_word: ἵνα γνῶτε καὶ γινώσκητε
  choice: لكي تعرفوا وتظلّوا عارفين
  rationale: يحاول هذا التعبير إظهار الفرق بين صيغة الحدث الكلي γνῶτε والصيغة الحاضرة المستمرة γινώσκητε، من غير تحويل الفعل الثاني إلى معنى مختلف مثل «تفهموا».
- source_word: ἐν ἐμοὶ ὁ πατὴρ κἀγὼ ἐν τῷ πατρί
  choice: أن الآب فيَّ وأنا في الآب
  rationale: يحفظ حرف الجر المتكرر ولغة السكن المتبادل كما وردت، من غير شرح عقائدي زائد.
- source_word: πατήρ
  choice: الآب
  rationale: يحافظ على الاسم المعرّف في اليونانية وعلى الاصطلاح العربي الكتابي الواضح، ولا يضيف ضمير الملكية «أبي».
theological_decisions:
- issue: وجود الآب والابن كلٌّ منهما في الآخر
  choice: أن الآب فيَّ وأنا في الآب
  alternative: أن الآب متحد بي وأنا متحد بالآب
  rationale: الصياغة المباشرة تحفظ قوة العبارة اليوحناوية وغموضها العلاقي واللاهوتي المشروع، ولا تستبدلها بمصطلح تفسيري أو بصياغة عقائدية لاحقة.
- issue: دلالة πιστεύω مع ἐμοί
  choice: تصدّقوني
  alternative: تؤمنوا بي
  rationale: السياق يقابل بين قبول قول يسوع وقبول شهادة أعماله؛ لذلك يرجح معنى التصديق هنا، مع إبقاء احتمال «الإيمان بي» في الحاشية بدل إلغائه.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «الآب» بوصفه المصطلح العربي المسيحي المعياري، وحُفظ تكرار «في» وقوة المقابلة بين تصديق يسوع وتصديق الأعمال. أضيف ضمير «ها» بعد «أعمل» لاستجلاء المفعول المفهوم من السياق.
