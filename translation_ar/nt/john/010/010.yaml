  rationale: تقتصر المراجعة على تصحيح الإحالة النحوية والأسلوبية في الشق الأخير. فإعادة ذكر «هذه الحياة» توضّح أن الوفرة تصف الحياة المذكورة، وتحافظ على المقابلة والغرض في الأصل من غير تضييق دلالة «حياة» أو توسيع دلالة الوفرة تفسيرياً.
