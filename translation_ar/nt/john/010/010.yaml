  text: ὁ κλέπτης οὐκ ἔρχεται εἰ μὴ ἵνα κλέψῃ καὶ θύσῃ καὶ ἀπολέσῃ· ἐγὼ ἦλθον ἵνα ζωὴν ἔχωσιν καὶ περισσὸν ἔχωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/010.yaml
  text: The thief comes only to steal and slaughter and destroy[a]; I came so that they may have life[b], and have it abundantly.
translation:
  language: ar
  text: لا يأتي السارق إلا ليسرق ويذبح ويُهلك؛ أما أنا فقد أتيت لتكون لهم حياة[a]، وتكون هذه الحياة بوفرة[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي حياة، من غير أن يصفها النص هنا صراحةً بأنها «أبدية».
    reason: theological_precision
  - marker: b
    text: 'أو: «لتكون لهم حياة وافرة»، أو: «لتكون لهم حياة في ملئها».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ κλέπτης
  choice: السارق
  rationale: أداة التعريف اليونانية تؤيد المفرد المعرّف ذي الدلالة التمثيلية في سياق حديث الراعي، ويقابله «السارق» طبيعيًا في العربية.
- source_word: οὐκ ἔρχεται εἰ μὴ
  choice: لا يأتي ... إلا
  rationale: يحافظ هذا الأسلوب العربي على بنية الحصر وقوتها في اليونانية من غير تكلّف.
- source_word: ἵνα κλέψῃ
  choice: ليسرق
  rationale: لام التعليل تعبّر بإيجاز ووضوح عن غرض المجيء.
- source_word: θύσῃ
  choice: يذبح
  rationale: الفعل اليوناني يدل كثيرًا على ذبح الحيوان، وهو الأنسب لصورة الخراف في السياق، مع بقاء معنى القتل ممكنًا.
- source_word: ἀπολέσῃ
  choice: يُهلك
  rationale: «يُهلك» ينقل معنى التدمير المؤدي إلى الفناء، ويصلح مع المفعول غير المذكور من دون تقييد طريقة الإهلاك.
- source_word: ἐγὼ ἦλθον
  choice: أما أنا فقد أتيت
  rationale: «أما أنا» تُبرز المقابلة التي يؤكدها الضمير اليوناني، و«قد أتيت» صياغة عربية طبيعية للماضي ذي الصلة بالمهمة الحاضرة.
- source_word: ἵνα ζωὴν ἔχωσιν
  choice: لتكون لهم حياة
  rationale: تنقل غاية المجيء وتحافظ على لفظ «حياة» بلا إضافة «أبدية»، لأن الصفة غير واردة في الآية.
- source_word: περισσὸν ἔχωσιν
  choice: ولتكون لهم بوفرة
  rationale: تحافظ الصياغة على تكرار ἔχωσιν وعلى كون περισσόν دالًا على الوفرة، مع إحالة الفعل ضمنًا إلى الحياة المذكورة.
theological_decisions:
- issue: مدى دلالة ζωὴ في الاستعمال اليوحناوي
  choice: حياة
  alternative: حياة أبدية؛ الحياة الحقيقية
  rationale: النص يقول «حياة» من غير صفة. إبقاء اللفظ عامًا يصون عمقه اليوحناوي ولا يضيف تحديدًا عقائديًا غير مصرّح به هنا.
- issue: قوة περισσὸν
  choice: بوفرة
  alternative: إلى الملء؛ حياة وافرة
  rationale: يدل اللفظ على فيض الحياة وكمالها من غير تحويله إلى وعد بالرخاء المادي أو توسيعه عقائديًا.
translation_notes:
  register: لغة عربية فصحى معاصرة واضحة وموقرة. استُخدم «يذبح» اتساقًا مع صورة الخراف، و«لا... إلا» لصون الحصر. وُضعت جميع علامتي الحاشيتين في المتن.
