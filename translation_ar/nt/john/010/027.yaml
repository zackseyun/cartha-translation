id: JHN.10.27
reference: John 10:27
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: τὰ πρόβατα τὰ ἐμὰ τῆς φωνῆς μου ⸀ἀκούουσιν, κἀγὼ γινώσκω αὐτά, καὶ ἀκολουθοῦσίν μοι,
base_translation:
  language: en
  yaml_path: translation/nt/john/010/027.yaml
  text: My sheep hear my voice, and I know them, and they follow me.
translation:
  language: ar
  text: خِرافي تسمع صوتي، وأنا أعرفها، وهي تتبعني.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ πρόβατα τὰ ἐμὰ
  choice: خِرافي
  rationale: ينقل الاسم وصيغة الملكية بعبارة عربية طبيعية موجزة، مع الحفاظ على صورة الراعي والخراف.
- source_word: τῆς φωνῆς μου
  choice: صوتي
  rationale: «الصوت» هو المقابل الدقيق في سياق تعرّف الخراف إلى راعيها.
- source_word: ἀκούουσιν
  choice: تسمع
  rationale: يحافظ على المعنى المباشر للفعل المضارع الدال هنا على السلوك المستمر أو المميِّز، من غير إضافة معنى الإصغاء المتعمّد صراحةً.
- source_word: κἀγὼ
  choice: وأنا
  rationale: ينقل اجتماع καί وἐγώ، ويحفظ الربط مع إبراز الضمير إبرازًا طبيعيًا في العربية.
- source_word: γινώσκω αὐτά
  choice: أعرفها
  rationale: يحفظ سعة معنى المعرفة وعمقها العلاقي في السياق، من غير توسيع تفسيري مثل «أعرفها معرفة شخصية».
- source_word: ἀκολουθοῦσίν μοι
  choice: وهي تتبعني
  rationale: صيغة المضارع العربية تعبّر طبيعيًا عن الفعل المستمر أو المعتاد، والضمير «هي» يعود إلى جماعة الخراف غير العاقلة بحسب المطابقة العربية.
theological_decisions:
- issue: القوة العلاقية للفعل γινώσκω في استعارة الراعي والخراف
  choice: أعرفها
  alternative: أتعرّف إليها / أعرفها معرفة شخصية
  rationale: «أعرفها» تترك للفظ عمقه العلاقي المحتمل من غير تضييقه إلى مجرد التعرّف أو توسيعه بتفسير عقائدي غير مصرّح به.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُخدم «خِرافي» بدل تركيب أثقل مثل «الخراف التي لي»، وحوفظ على توازي الجمل وبساطتها في الأصل.
