  text: καὶ περιεπάτει ὁ Ἰησοῦς ἐν τῷ ἱερῷ ἐν τῇ στοᾷ ⸀τοῦ Σολομῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/023.yaml
  text: And Jesus was walking in the temple courts[b][a], in Solomon’s Portico.
translation:
  language: ar
  text: وكان يسوع يتمشّى في ساحات الهيكل[a]، في رواق سليمان[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: تشير الكلمة اليونانية ἱερόν إلى مجمّع الهيكل أو حرمه، لا إلى المقدس الداخلي تحديدًا.
    reason: cultural_note
  - marker: b
    text: أي ممر مسقوف تحمله أعمدة.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: و
  rationale: أداة ربط بسيطة تحافظ على اتصال الجملة بسياقها من غير إضافة دلالة زمنية غير مصرّح بها.
- source_word: περιεπάτει
  choice: كان يتمشّى
  rationale: صيغة الماضي الناقص اليونانية تدل على فعل مستمر في الماضي؛ والتركيب «كان يتمشّى» ينقل هذا الجانب الاستمراري طبيعيًا.
- source_word: ἱερῷ
  choice: ساحات الهيكل
  rationale: تشير ἱερόν هنا إلى مجمّع الهيكل أو حرمه، لا إلى المقدس الداخلي خاصة؛ و«ساحات الهيكل» توضح أنه موضع عام ضمن المجمّع.
- source_word: στοᾷ
  choice: رواق
  rationale: تدل στοά على ممر مسقوف ذي أعمدة، و«رواق» مصطلح عربي واضح ومناسب لهذا الموضع المعماري المسمّى.
- source_word: τοῦ Σολομῶνος
  choice: سليمان
  rationale: 'نُقلت الإضافة اليونانية إلى تركيب الإضافة العربي الطبيعي: «رواق سليمان».'
theological_decisions: []
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «كان يتمشّى» لإبراز استمرار الفعل، و«ساحات الهيكل» للتمييز بين مجمّع الهيكل والمقدس الداخلي. وُضعت علامتا الحاشيتين مباشرة بعد اللفظ الذي تشرحه كل منهما.
