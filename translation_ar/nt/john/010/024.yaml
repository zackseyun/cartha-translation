  text: ἐκύκλωσαν οὖν αὐτὸν οἱ Ἰουδαῖοι καὶ ἔλεγον αὐτῷ· Ἕως πότε τὴν ψυχὴν ἡμῶν αἴρεις; εἰ σὺ εἶ ὁ χριστός, εἰπὲ ἡμῖν παρρησίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/024.yaml
  text: So the Jews surrounded him and were saying to him[a], “How long will you keep us in suspense? If you are the Messiah[b], tell us plainly.”
translation:
  language: ar
  text: 'فأحاط به اليهود[b]، وأخذوا يقولون له: «إلى متى تُبقينا في حيرة[a]؟ إن كنت أنت المسيح، فقل لنا بوضوح».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا تقريبًا: «إلى متى ترفع نفوسنا؟» وهو تعبير يفيد إبقاء الإنسان في عدم يقين أو حيرة.'
    reason: lexical_alternative
  - marker: b
    text: قد يُقصد بعبارة «اليهود» في بعض سياقات إنجيل يوحنا، على نحو أخص، السلطات اليهودية أو معارضو يسوع، لا الشعب اليهودي كله.
    reason: cultural_note
lexical_decisions:
- source_word: ἐκύκλωσαν
  choice: أحاط به
  rationale: ينقل المعنى المكاني المباشر للفعل، مع إبقاء احتمال أن يكون الموقف ضاغطًا أو مواجهًا من غير زيادة تفسيرية.
- source_word: οὖν
  choice: فـ
  rationale: الفاء تربط الحدث بما قبله ربطًا طبيعيًا في السرد العربي، وتؤدي معنى الانتقال أو النتيجة الذي تحمله οὖν.
- source_word: οἱ Ἰουδαῖοι
  choice: اليهود
  rationale: هذه هي الدلالة الصريحة للعبارة اليونانية. ولأن السياق اليوحناوي قد يضيّق مرجعها أحيانًا، تُذكر هذه الإمكانية في حاشية بدل إدخالها في المتن.
- source_word: ἔλεγον
  choice: أخذوا يقولون
  rationale: يحافظ هذا التعبير على الجانب الاستمراري أو التكراري لصيغة الماضي الناقص اليونانية بلغة عربية طبيعية.
- source_word: Ἕως πότε
  choice: إلى متى
  rationale: هو المقابل العربي الاصطلاحي الطبيعي للسؤال اليوناني.
- source_word: τὴν ψυχὴν ἡμῶν αἴρεις
  choice: تُبقينا في حيرة
  rationale: الترجمة تنقل المعنى الاصطلاحي، أي إبقاء المخاطَبين في عدم يقين، بينما تحفظ الحاشية الصورة الحرفية الغريبة في اليونانية.
- source_word: ὁ χριστός
  choice: المسيح
  rationale: اللفظ هنا لقب مسياني يهودي، و«المسيح» هو المقابل العربي الراسخ والمفهوم.
- source_word: εἰπὲ ἡμῖν
  choice: فقل لنا
  rationale: ينقل صيغة الأمر المباشرة بإيجاز وقوة.
- source_word: παρρησίᾳ
  choice: بصراحة
  rationale: في هذا السياق يطلب المتكلمون تصريحًا واضحًا لا لبس فيه؛ و«بصراحة» تؤدي معنى الكلام العلني الصريح بصورة طبيعية.
theological_decisions:
- issue: ترجمة Χριστός
  choice: المسيح
  alternative: المسيّا
  rationale: يعمل اللفظ هنا بوصفه لقبًا للمنتظر الممسوح. «المسيح» هو التعبير العربي الكتابي الشائع، ويحفظ وظيفة اللقب من غير تحويله إلى اسم شخصي صرف.
- issue: مرجع οἱ Ἰουδαῖοι في إنجيل يوحنا
  choice: اليهود
  alternative: قادة اليهود أو أهل اليهودية
  rationale: الآية نفسها لا تنص على أنهم القادة ولا تقصرهم على أهل إقليم اليهودية؛ لذلك يُحفظ اللفظ الأوسع في المتن، مع التنبيه في الحاشية إلى أن الاستعمال السياقي قد يكون أضيق.
translation_notes:
  register: صياغة عربية فصحى معاصرة، واضحة ورصينة. استُخدم «أخذوا يقولون» لحفظ استمرارية الفعل، و«تُبقينا في حيرة» لنقل معنى التعبير الاصطلاحي، مع إبقاء صورته الحرفية في الحاشية. وُضعت علامتا الحاشيتين في المتن صراحة.
