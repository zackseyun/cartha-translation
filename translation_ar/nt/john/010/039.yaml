  text: ἐζήτουν οὖν ⸂πάλιν αὐτὸν⸃ πιάσαι· καὶ ἐξῆλθεν ἐκ τῆς χειρὸς αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/039.yaml
  text: So they were seeking again to seize him[a], but he escaped from their hand.
translation:
  language: ar
  text: فعادوا يسعون إلى الإمساك به، لكنه خرج من أيديهم.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «خرج من يدهم»؛ وهو تعبير يفيد أنه أفلت من قبضتهم أو سلطانهم.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτουν
  choice: يسعون
  rationale: ينقل صيغة الماضي الناقص الدالة على فعل مستمر أو محاولة جارية، من غير اختزالها في فعل ماضٍ بسيط.
- source_word: οὖν
  choice: فـ
  rationale: تربط الجملة بما سبق بوصفها نتيجة أو تطورًا في السرد، وهي طبيعية وموجزة في العربية.
- source_word: πάλιν
  choice: عادوا
  rationale: صيغة «عادوا يسعون» تؤدي معنى التكرار الذي يفيده الظرف، بأسلوب عربي طبيعي.
- source_word: πιάσαι
  choice: الإمساك به
  rationale: يحافظ على معنى القبض الجسدي العدائي من غير أن يضيف بالضرورة الصبغة القانونية التي قد توحي بها عبارة «إلقاء القبض عليه».
- source_word: ἐξῆλθεν
  choice: خرج
  rationale: يحافظ على الدلالة المباشرة للفعل، بدل استبداله بفعل صريح مثل «أفلت» أو «هرب»، مع بقاء النتيجة مفهومة من السياق.
- source_word: ἐκ τῆς χειρὸς αὐτῶν
  choice: من أيديهم
  rationale: تعبير عربي مفهوم قريب من الصورة اليونانية، مع استعمال الجمع الطبيعي في العربية؛ والمقصود الخروج من قبضتهم أو سلطانهم.
theological_decisions:
- issue: هل يُصرَّح بأن يسوع أفلت، أم تُحفظ صورة الخروج من أيديهم؟
  choice: لكنه خرج من أيديهم
  alternative: لكنه أفلت من قبضتهم
  rationale: النص اليوناني لا يستعمل فعلًا صريحًا بمعنى الهرب أو الإفلات، بل يقول إنه «خرج من يدهم». إبقاء الصورة يحفظ صياغة السرد واحتمالها، بينما توضح الحاشية معناها الاصطلاحي.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة الأسلوب. استُعملت «فعادوا يسعون» لنقل الاستمرار والتكرار معًا، وحُفظت صورة «خرج من أيديهم» في المتن مع شرح معناها في الحاشية.
