source:
  edition: SBLGNT
  text: καὶ ἄλλα πρόβατα ἔχω ἃ οὐκ ἔστιν ἐκ τῆς αὐλῆς ταύτης· κἀκεῖνα ⸂δεῖ με⸃ ἀγαγεῖν, καὶ τῆς φωνῆς μου ἀκούσουσιν, καὶ ⸀γενήσονται μία ποίμνη, εἷς ποιμήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/016.yaml
  text: And I have other sheep that are not from this sheepfold[a]. I must bring them also, and they will listen to my voice. Then there will be one flock[b], one shepherd.
translation:
  language: ar
  text: ولي خراف أخرى ليست من هذه الحظيرة. لا بدّ لي أن آتي بها أيضًا، وستسمع صوتي[a]، فيكون قطيع واحد[b] وراعٍ واحد.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ستصغي إلى صوتي». يمكن أن يعني الفعل اليوناني السماع أو الإصغاء، ويُرجَّح في هذا السياق أنه يتضمن السماع المستجيب.'
    reason: lexical_alternative
  - marker: b
    text: 'يميّز النص اليوناني بين «الحظيرة» (αὐλή)، وهي موضع مسوّر، و«القطيع» (ποίμνη)، وهو جماعة الخراف. لذلك لا يقول هنا: «حظيرة واحدة».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἄλλα πρόβατα
  choice: خراف أخرى
  rationale: «πρόβατα» هو اللفظ المعتاد للخراف، لا للحملان خصوصًا، و«ἄλλα» تدل على خراف أخرى إلى جانب المذكورة ضمنًا.
- source_word: αὐλή
  choice: الحظيرة
  rationale: يدل اللفظ في سياق الرعي على موضع مسوّر تُجمع فيه الخراف، و«الحظيرة» تعبير عربي واضح وطبيعي.
- source_word: κἀκεῖνα
  choice: بها أيضًا
  rationale: الضمير يعود إلى «الخراف الأخرى»، وجاء مؤنثًا مفردًا بحسب المطابقة العربية لغير العاقل في الجمع.
- source_word: δεῖ με ἀγαγεῖν
  choice: لا بدّ لي أن آتي بها
  rationale: يحفظ «لا بدّ» معنى الضرورة في δεῖ، ويؤدي «آتي بها» معنى ἀγαγεῖν بصورة عربية طبيعية من غير حسم زائد بين الإحضار والقيادة.
- source_word: τῆς φωνῆς μου ἀκούσουσιν
  choice: ستسمع صوتي
  rationale: الفعل ἀκούω يحتمل السماع والإصغاء المستجيب؛ أُبقي اللفظ العربي «تسمع» على قدر من السعة، مع بيان الدلالة المحتملة في الحاشية.
- source_word: γενήσονται
  choice: فتصير
  rationale: يؤدي «تصير» معنى الانتقال أو التكوّن في γίνομαι، ويربط النتيجة بما قبلها ربطًا طبيعيًا.
- source_word: μία ποίμνη
  choice: رعية واحدة
  rationale: «ποίμνη» جماعة الخراف التي يرعاها الراعي، و«رعية» تحافظ على صورة الجماعة تحت رعاية راعٍ، وتميّزها عن الحظيرة المكانية.
- source_word: εἷς ποιμήν
  choice: راعٍ واحد
  rationale: ترجمة مباشرة للصورة الرعوية في النص، مع إبقاء التنكير الذي يوافق تركيب العبارة اليونانية.
theological_decisions:
- issue: التمييز بين αὐλή وποίμνη
  choice: هذه الحظيرة ... رعية واحدة
  alternative: هذه الحظيرة ... حظيرة واحدة
  rationale: 'يستخدم اليوناني لفظين مختلفين: الأول للمكان المسوّر، والثاني لجماعة الخراف. يحفظ هذا الاختيار الفرق ولا يحوّل وحدة الرعية إلى وحدة مكانية أو مؤسسية.'
- issue: قوة δεῖ
  choice: لا بدّ لي أن آتي بها أيضًا
  alternative: ينبغي لي أن آتي بها أيضًا
  rationale: «لا بدّ» تنقل قوة الضرورة بوضوح، من غير أن تضيف تفسيرًا عقائديًا لمصدر هذه الضرورة.
- issue: دلالة ἀκούω
  choice: ستسمع صوتي
  alternative: ستصغي إلى صوتي
  rationale: يحفظ «تسمع» المعنى الأساسي وإمكان دلالة الاستجابة في السياق، بينما قد يجعل «تصغي» هذا المعنى التفسيري صريحًا أكثر مما يقتضيه اللفظ وحده.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت «الحظيرة» للمكان و«الرعية» للجماعة حفاظًا على التمييز المعجمي والصورة الرعوية، وأُبقي تركيب الآية موجزًا وقريبًا من تسلسل الأصل.
