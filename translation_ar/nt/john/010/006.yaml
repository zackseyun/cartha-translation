lexical_decisions:
- source_word: παροιμίαν
  choice: الكلام المجازي
  rationale: تدل الكلمة على قول مجازي أو مَثَل أو حكمة ذات معنى غير مباشر. واختيار «الكلام المجازي» يحفظ اتساع الدلالة هنا ولا يحصرها في المعنى الاصطلاحي لـ«المَثَل» أو في معنى «المَثَل السائر».
- source_word: εἶπεν
  choice: قال
  rationale: الفعل العربي «قال» هو المقابل الطبيعي المباشر، ويلائم مفعوله «هذا الكلام المجازي».
- source_word: ἐκεῖνοι δὲ
  choice: لكنهم
  rationale: تنقل «لكن» المقابلة بين يسوع والمخاطَبين، ويؤدي الضمير المعنى عربيًا من غير تكلّف.
- source_word: οὐκ ἔγνωσαν
  choice: لم يفهموا
  rationale: السياق يتحدث عن عدم إدراك معنى خطاب يسوع المجازي، ولذلك فـ«لم يفهموا» أدق من «لم يعرفوا».
- source_word: τίνα ἦν ἃ ἐλάλει αὐτοῖς
  choice: ما كان يقوله لهم
  rationale: التركيب اليوناني غير مألوف حرفيًا، ومعناه أنهم لم يدركوا مضمون ما كان يسوع يقوله. تحافظ الصياغة العربية على المعنى وعلى تكرار «لهم» من غير ركاكة.
