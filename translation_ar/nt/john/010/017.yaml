  text: διὰ τοῦτό ⸂με ὁ πατὴρ⸃ ἀγαπᾷ ὅτι ἐγὼ τίθημι τὴν ψυχήν μου, ἵνα πάλιν λάβω αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/017.yaml
  text: For this reason the Father loves me[a], because I lay down my life so that I may take it up again.
translation:
  language: ar
  text: لهذا يحبني الآب، لأني أبذل حياتي[a] لكي آخذها من جديد.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «نفسي». المقصود على الأرجح حياة يسوع التي يبذلها بالموت ثم يأخذها من جديد.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: لهذا
  rationale: تعبير سببي طبيعي وموجز يحفظ الصلة بما يأتي وبالسياق السابق.
- source_word: με ὁ πατὴρ ἀγαπᾷ
  choice: يحبني الآب
  rationale: يحفظ «الآب» معرفًا من دون إضافة ضمير ملكية غير موجود في اليونانية، ويبين علاقة الفاعل بالمفعول بوضوح.
- source_word: ὅτι
  choice: لأني
  rationale: تفيد السببية هنا، فتبيّن سبب محبة الآب المذكورة في صدر الآية.
- source_word: τίθημι τὴν ψυχήν μου
  choice: أبذل حياتي
  rationale: «يبذل حياته» تعبير عربي طبيعي يدل على تقديم الحياة طوعًا حتى الموت، وهو أنسب من الترجمة الحرفية «أضع حياتي».
- source_word: ἵνα
  choice: لكي
  rationale: تحفظ دلالة الغاية من غير أن تحسم التوتر الممكن بين الغاية والنتيجة.
- source_word: πάλιν λάβω αὐτήν
  choice: آخذها أيضًا
  rationale: يحفظ الفعل اليوناني بمعنى الأخذ، وتؤدي «أيضًا» هنا معنى استعادة الحياة بعد بذلها؛ ويمكن فهم الفعل في السياق بمعنى استردادها.
theological_decisions:
- issue: معنى ψυχή في سياق موت المسيح الاختياري
  choice: حياتي
  alternative: نفسي
  rationale: السياق يتحدث عن الحياة التي يبذلها يسوع بالموت ثم يأخذها، ولا يركز على تمييز النفس من الجسد؛ لذلك «حياتي» أوضح مع إثبات البديل في الحاشية.
- issue: دلالة ἵνα مع λάβω في علاقة الموت بأخذ الحياة من جديد
  choice: لكي آخذها أيضًا
  alternative: حتى آخذها أيضًا
  rationale: «لكي» تبقي دلالة الغاية ظاهرة من غير تحويل صيغة الاحتمال اليونانية إلى تقرير مستقبلي صريح أو حسم المسألة في اتجاه نتيجة محضة.
- issue: دلالة λάβω على الفاعلية في أخذ الحياة من جديد
  choice: آخذها
  alternative: أستردها
  rationale: الترجمة المختارة أقرب إلى اللفظ اليوناني وتحفظ تعبير يوحنا عن فاعلية يسوع، بينما «أستردها» يوضح المعنى السياقي لكنه يزيد عنصر الاستعادة في صيغة الفعل العربية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم التعبير الاصطلاحي الطبيعي «أبذل حياتي» بدل الحرفية غير المألوفة «أضع نفسي»، مع إبقاء البديل المعجمي في الحاشية.
