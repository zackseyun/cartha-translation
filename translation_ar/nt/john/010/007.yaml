  text: 'فقال لهم يسوع مرة أخرى: «الحق الحق أقول لكم: أنا باب الخراف[a].»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بوابة الخراف». يمكن أن تعني الكلمة اليونانية «بابًا» أو «بوابة»، خصوصًا في سياق صورة الراعي وحظيرة الخراف.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: فـ
  rationale: تفيد الاستمرار والنتيجة المترتبة على عدم فهمهم كلامه السابق، وتأتي طبيعية في السرد العربي.
- source_word: πάλιν
  choice: أيضًا
  rationale: تدل على أن يسوع عاد إلى مخاطبتهم وشرح الصورة مرة أخرى.
- source_word: Ἀμὴν ἀμὴν
  choice: الحق الحق
  rationale: تحافظ على التكرار التوكيدي والصيغة الاحتفالية المميزة في إنجيل يوحنا، بلغة عربية مفهومة وموقرة.
- source_word: λέγω ὑμῖν
  choice: أقول لكم
  rationale: ترجمة مباشرة وطبيعية لصيغة الإعلان.
- source_word: ὅτι
  choice: —
  rationale: لا تحتاج العربية إلى أداة ربط بعد القول المباشر، والنقطتان تؤديان وظيفتها بوضوح.
- source_word: ἐγώ εἰμι
  choice: أنا
  rationale: الجملة الاسمية العربية تعبّر طبيعيًا عن معنى «أنا هو/أنا أكون»، ويحفظ الضمير المنفصل توكيد الهوية من غير تركيب متكلف.
- source_word: θύρα
  choice: باب
  rationale: «باب» هو المقابل العربي المباشر، ويصلح كذلك لمدخل حظيرة الخراف؛ أما «بوابة» فبديل سياقي ممكن.
- source_word: τῶν προβάτων
  choice: الخراف
  rationale: 'أُبقيت علاقة الإضافة كما في اليونانية: «باب الخراف»، من غير حسمها دلاليًا إلى «للخراف» أو توسيعها إلى «باب الحظيرة».'
theological_decisions:
- issue: التعريف المجازي بالذات في قول «أنا»
  choice: أنا باب الخراف
  alternative: أنا الباب للخراف / أنا بوابة الخراف
  rationale: تحفظ الصياغة استعارة يسوع وعلاقة الإضافة اليونانية من غير شرح عقائدي زائد أو حسم وظيفة الباب داخل نص الآية.
