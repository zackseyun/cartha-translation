  text: And his disciples asked him[a], saying, “Rabbi, who sinned, this man or his parents, that he should be born blind?”
translation:
  language: ar
  text: 'فسأله تلاميذه قائلين: «يا رابي، مَن أذنب: أهذا الرجل أم أبواه، لكي يولد أعمى؟»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بحيث وُلِد أعمى؟» قد تعبّر العبارة اليونانية عن علاقة غاية أو نتيجة يفترضها التلاميذ في سؤالهم.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἠρώτησαν
  choice: سأله
  rationale: فعل ماضٍ يقدّم سؤالًا مباشرًا موجّهًا إلى يسوع، و«سأله» هو المقابل العربي الطبيعي من غير زيادة في الرسمية أو الحدّة.
- source_word: μαθηταὶ
  choice: تلاميذه
  rationale: يحفظ علاقة التعلّم والاتباع، وهو التعبير العربي الراسخ والطبيعي في سياق الأناجيل.
- source_word: λέγοντες
  choice: قائلين
  rationale: يحافظ على البنية الحالية اليونانية وعلى انسياب السرد، مع فصاحة واضحة في العربية.
- source_word: Ῥαββί
  choice: يا رَبِّي
  rationale: نقلٌ صوتي للقب اليهودي التاريخي، مع أداة النداء العربية؛ وضُبطت الكلمة للتمييز بينها وبين «رَبّي» بمعنى سيدي أو إلهي.
- source_word: τίς
  choice: مَن
  rationale: أداة الاستفهام المباشرة عن الشخص المسؤول.
- source_word: ἥμαρτεν
  choice: أخطأ
  rationale: ينقل فعل ارتكاب الخطيئة بصياغة عربية موجزة وطبيعية؛ والسياق الديني يوضح المقصود.
- source_word: οὗτος
  choice: هذا الرجل
  rationale: يوضح أن الإشارة إلى الرجل الأعمى، بدل «هذا» التي قد تبدو مبتورة أو ملتبسة بالعربية.
- source_word: γονεῖς
  choice: أبواه
  rationale: مقابل عربي موجز ودقيق للوالدين، ملائم للإشارة إلى والدي رجل واحد.
- source_word: ἵνα
  choice: حتى
  rationale: تحفظ صلة الغاية أو النتيجة المفترضة في سؤال التلاميذ من غير أن تحسم طبيعتها أو تجعل الراوي يقرّها.
- source_word: τυφλὸς
  choice: أعمى
  rationale: صفة خبرية مباشرة تصف حاله عند الولادة.
- source_word: γεννηθῇ
  choice: وُلِد
  rationale: المبني للمجهول هو المقابل الطبيعي للفعل اليوناني، وتؤدي العربية معنى الجملة التابعة بعد «حتى» من غير حاجة إلى علامة صريحة للمزاج الاحتمالي.
theological_decisions:
- issue: دلالة ἵνα في سؤال التلاميذ عن الخطيئة والعمى منذ الولادة
  choice: «حتى وُلِد أعمى؟» مع حاشية توضّح إمكان فهم الصلة بوصفها غاية أو نتيجة مفترضة
  alternative: «فكانت النتيجة أن وُلِد أعمى؟» أو «لكي يولد أعمى؟»
  rationale: ينقل النص تصور التلاميذ للعلاقة بين الخطيئة والعمى، ولا يقرّر بصوت الراوي أن خطيئة الرجل أو والديه سببت العمى. وتحفظ الصياغة التوتر والدلالة غير المحسومة في ἵνα.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُبقي اللقب اليهودي «رَبِّي» منقولًا صوتيًا للحفاظ على الطابع التاريخي، ووُضعت الحاشية بعد الجملة التي تفسرها.
