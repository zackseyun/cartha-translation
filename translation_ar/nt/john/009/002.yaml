review_pass:
  verdict: revise
  source_fidelity: 'المعنى العام أمين للنص اليوناني: سؤال التلاميذ موجّه إلى يسوع، و«مَن أخطأ» و«أهذا الرجل أم أبواه» وذكر العمى عند الولادة كلها منقولة. لكن تركيب «حتى وُلِد أعمى» يحوّل الفعل التابع اليوناني γεννηθῇ (مبني للمجهول، subjunctive تحت ἵνα) إلى خبر ماضٍ تقريرِي أقل محافظة على علاقة الغاية/النتيجة المفترضة. كما أن «أخطأ» قد يفهم في العربية الحديثة على أنه ارتكب خطأً غير أخلاقي، بينما ἥμαρτεν تعني «أذنب/ارتكب خطيئة» في هذا السياق بوضوح أكبر.'
  naturalness: النص فصيح ومفهوم عمومًا. «فقالوا له» أسلس من «فسأله تلاميذه قائلين» لأن الفاعل جمع والفعل في المسودة مفرد عائد إلى يسوع من حيث الضمير، وإن كان صحيحًا نحويًا بمعنى سألوه. والصياغة «لكي يولد أعمى» طبيعية وتحفظ بنية السؤال على نحو أفضل من «حتى وُلِد أعمى».
  terminology: «يا رابي» نقل مناسب للقب Ῥαββί، والأفضل كتابته دون تشكيل غير لازم لتفادي التباس بصري مع «ربي». «أبواه» دقيق. ينبغي استخدام «أذنب» لتحديد مصطلح الخطيئة، مع عدم إضافة أي حكم على افتراض التلاميذ.
  issues:
  - severity: medium
    issue: صياغة «حتى وُلِد أعمى» تقريرية في الماضي.
    rationale: النص اليوناني يقول ἵνα τυφλὸς γεννηθῇ، أي «لكي/بحيث يولد أعمى»، ضمن سؤال يعرض افتراض التلاميذ. إبقاء الفعل في صيغة تابعة مستقبلية/احتمالية بالعربية يحفظ هذا البناء وموضع الالتباس بين الغاية والنتيجة.
  - severity: medium
    issue: «أخطأ» أوسع دلالة من ἥμαρτεν في العربية المعاصرة.
    rationale: قد تشير «أخطأ» إلى خطأ عادي؛ أما المقصود هنا فهو الذنب أو الخطيئة. «أذنب» أو «ارتكب خطيئة» أوضح وأوفى دون تفسير لاهوتي زائد.
  - severity: low
    issue: تركيب الافتتاح أقل سلاسة من الممكن.
    rationale: «فسأله تلاميذه قائلين» جائز، لكن «فسأله تلاميذه:» أو «فسأله تلاميذه قائلين» لا يقتضي تغييرًا. استُخدمت صياغة موجزة أكثر طبيعية مع الحفاظ على participle λέγοντες.
