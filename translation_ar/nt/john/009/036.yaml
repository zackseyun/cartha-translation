lexical_decisions:
- source_word: ἀπεκρίθη ἐκεῖνος καὶ εἶπεν
  choice: فأجاب ذاك وقال
  rationale: يحافظ على الفعلين السرديين في اليونانية وعلى دلالة ἐκεῖνος الإشارية إلى الرجل المذكور، بصياغة عربية واضحة ومألوفة كتابيًا.
- source_word: Καὶ τίς ἐστιν
  choice: ومن هو
  rationale: إبقاء الواو يحفظ اتصال الجواب بما قبله، والاستفهام ترجمة مباشرة طبيعية.
- source_word: κύριε
  choice: يا ربّ
  rationale: «ربّ» المقابل المعتاد لـ κύριος، مع بقاء احتمال أن تكون هنا صيغة احترام بمعنى «يا سيدي»؛ لذلك يُذكر البديل في الحاشية.
- source_word: ἵνα πιστεύσω εἰς αὐτόν
  choice: لأؤمن به
  rationale: اللام مع المضارع المنصوب تعبّر بإيجاز طبيعي عن الغاية التي تدل عليها ἵνα مع صيغة الالتزام، و«أؤمن به» تحفظ الصياغة اللاهوتية المألوفة لـ πιστεύω εἰς.
theological_decisions:
- issue: دلالة κύριε قبل اعتراف الرجل الصريح في الآية التالية
  choice: يا ربّ
  alternative: يا سيدي
  rationale: يمكن أن تكون الكلمة نداءً للرب أو مجرد خطاب احترام. اختير المقابل الأساسي «يا ربّ» مع حفظ الغموض السياقي بإثبات «يا سيدي» في الحاشية، دون الجزم بدرجة إدراك الرجل في هذه اللحظة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. أُبقي التركيب السردي المزدوج «فأجاب... وقال»، كما حُفظت الواو في بدء السؤال والغموض الحقيقي في κύριε.
