  yaml_path: translation/nt/john/009/024.yaml
  text: So they called the man who had been blind a second time and said to him[a], “Give glory to God; we know that this man is a sinner.”
translation:
  language: ar
  text: 'فدعوا الرجل الذي كان أعمى مرة ثانية، وقالوا له: «أعطِ المجد لله[a]؛ نحن نعلم أن هذا الرجل خاطئ».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو لعلها صيغة استحلاف اصطلاحية: «أعطِ الله المجد»، أي: «قل الحق أمام الله» أو «اعترف علانية أمام الله».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐφώνησαν
  choice: استدعوا
  rationale: الفعل هنا يدل على أنهم دعوا الرجل ليحضر إليهم مرة أخرى؛ و«استدعوا» عربية طبيعية في هذا السياق، من غير أن تقتضي بالضرورة إجراءً رسميًا قسريًا.
- source_word: οὖν
  choice: فـ
  rationale: الفاء تربط الاستدعاء بما سبقه وتؤدي معنى الانتقال أو النتيجة السردية الذي تحمله οὖν.
- source_word: ἐκ δευτέρου
  choice: للمرة الثانية
  rationale: تنقل العبارة اليونانية بدقة ووضوح، ولا تكتفي بـ«مرة أخرى» التي قد تخفي التحديد العددي.
- source_word: ὃς ἦν τυφλός
  choice: الذي كان أعمى
  rationale: تحافظ على صيغة الماضي في اليونانية، ويفهم من السياق أن العمى كان حالته السابقة قبل الشفاء.
- source_word: Δὸς δόξαν τῷ θεῷ
  choice: أعطِ المجد لله
  rationale: يحفظ اللفظ الظاهر للعبارة، مع بيان احتمال كونها صيغة استحلاف أو إلزام بقول الحق في الحاشية.
- source_word: ἡμεῖς οἴδαμεν
  choice: نحن نعلم
  rationale: إظهار الضمير «نحن» ينقل توكيد الضمير اليوناني المنفصل والنبرة الجازمة في قول المتكلمين.
- source_word: οὗτος ὁ ἄνθρωπος
  choice: هذا الرجل
  rationale: ترجمة مباشرة وطبيعية لا تضيف نبرة ازدراء غير مصرّح بها في اللفظ اليوناني.
- source_word: ἁμαρτωλός
  choice: خاطئ
  rationale: ينقل وصف الرجل بأنه من الخطاة بصيغة خبرية موجزة وطبيعية في العربية الكتابية المعاصرة.
theological_decisions:
- issue: الدلالة الاصطلاحية لعبارة Δὸς δόξαν τῷ θεῷ
  choice: إبقاء «أعطِ المجد لله» في المتن
  alternative: 'ترجمتها تفسيريًا: «قل الحق أمام الله» أو «اعترف علانية أمام الله»'
  rationale: قد تؤدي العبارة وظيفة استحلاف رسمي بقول الحق أو الإقرار به، لكن لفظها اليوناني يحتفظ بصورة إعطاء المجد لله. لذلك يحفظ المتن اللفظ الظاهر، وتوضح الحاشية الدلالة الاصطلاحية المحتملة دون حسمها.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «استدعوا» لملاءمة مشهد إعادة إحضار الرجل، وأُبقيت العبارة ذات الاحتمال الاصطلاحي على صورتها المباشرة مع حاشية تفسيرية. تظهر علامة الحاشية [a] في المتن.
