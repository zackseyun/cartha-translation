lexical_decisions:
- source_word: ὁ δὲ
  choice: فقال
  rationale: تؤدي الفاء هنا وظيفة الوصل السردي الطبيعي، والفاعل المستتر يعود إلى الرجل الذي كان أعمى؛ ولا حاجة إلى إظهار ضمير منفصل في العربية.
- source_word: ἔφη
  choice: قال
  rationale: صيغة الماضي من φημί أداة مألوفة لتقديم الكلام المباشر، و«قال» هي المقابل العربي الطبيعي الدقيق.
- source_word: Πιστεύω
  choice: أؤمن
  rationale: تحافظ «أؤمن» على الصلة اللفظية بمحور الإيمان في إنجيل يوحنا، وتلائم جواب الرجل المباشر عن إعلان يسوع لنفسه.
- source_word: κύριε
  choice: يا ربّ
  rationale: السياق، بما فيه إعلان الإيمان والسجود اللاحق، يرجّح الخطاب الأرفع «يا ربّ»، مع إبقاء احتمال «يا سيدي» في الحاشية لأن اللفظة اليونانية قد تكون خطاب احترام.
- source_word: προσεκύνησεν
  choice: سجد
  rationale: الفعل يدل على السجود أو إبداء الإجلال، وقد يدل في هذا السياق على العبادة. «سجد» يحفظ الفعل الجسدي والدلالة التعبدية معًا من غير أن يحسم ما في اللفظة من سعة دلالية.
- source_word: αὐτῷ
  choice: له
  rationale: 'الداتيف مع προσκυνέω يُنقل طبيعيًا في العربية باللام: «سجد له».'
theological_decisions:
- issue: هل κύριε مجرد خطاب احترام أم اعتراف أرفع؟
  choice: يا ربّ
  alternative: يا سيدي
  rationale: يبلغ السياق ذروته في إعلان الرجل إيمانه وسجوده ليسوع، ولذلك تناسب «يا ربّ» السياق، لكن احتمال خطاب الاحترام قائم لغويًا ومذكور في الحاشية.
- issue: هل προσεκύνησεν يعني العبادة صراحة أم السجود/إبداء الإجلال؟
  choice: سجد له
  alternative: عبده؛ أو انحنى أمامه إجلالًا
  rationale: «سجد له» هو المقابل العربي المباشر الذي يحفظ التوتر الدلالي بين الهيئة الجسدية والتعبد، بينما يوضح السياق ثقله اللاهوتي من غير إدخال حسم زائد في متن الترجمة.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة، ذات إيقاع سردي طبيعي. استُخدمت «سجد له» بدل «عبده» للمحافظة على السعة الدلالية للفعل اليوناني، مع بيان البدائل في الحاشية.
