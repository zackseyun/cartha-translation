base_translation:
  language: en
  yaml_path: translation/nt/john/009/011.yaml
  text: He answered[a], “The man called Jesus made mud and spread it on my eyes, and he told me, ‘Go to Siloam and wash.’ So I went away and washed[c][b], and I received my sight.”
translation:
  language: ar
  text: 'فأجاب: «الرجل الذي يُدعى يسوع صنع طينًا[a] وطلى عينيَّ بالطين[b]، وقال لي: ‹اذهب إلى سلوام واغتسل›. فذهبت واغتسلت، فأبصرت[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وحلًا». يمكن أن تدل الكلمة اليونانية على الطين أو الوحل.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «دهن عينيَّ بالطين» أو «مسحهما بالطين». يدل الفعل اليوناني على بسط مادة أو طلائها على شيء.'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «نلت بصري». يدل الفعل هنا، في سياق الشفاء من العمى، على نيل القدرة على الإبصار.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη ἐκεῖνος
  choice: فأجاب
  rationale: صيغة سردية عربية طبيعية تنقل فعل الإجابة، ويُفهم الضمير الصريح اليوناني من الفاعل المستتر في السياق دون الحاجة إلى التعبير الحرفي «ذلك الرجل».
- source_word: Ὁ ἄνθρωπος ὁ λεγόμενος Ἰησοῦς
  choice: الرجل الذي يُدعى يسوع
  rationale: يحفظ تعريف المتكلم ليسوع بوصفه «الرجل» المعروف بهذا الاسم، من غير إدخال لقب أو إقرار لاهوتي أرفع من مستوى فهمه في هذه المرحلة من السرد.
- source_word: πηλὸν ἐποίησεν
  choice: صنع طينًا
  rationale: «الطين» تعبير عربي واضح وطبيعي للمادة الناتجة من مزج التراب بالسائل، مع بقاء احتمال معنى الوحل أو الصلصال مذكورًا في الحاشية.
- source_word: ἐπέχρισέν μου τοὺς ὀφθαλμούς
  choice: طلى به عينيَّ
  rationale: ينقل فعل وضع المادة وبسطها على العينين بوضوح، ويتجنب الإيحاء الطقسي الذي قد يولده استعمال «مسح» أو «دهن» في بعض السياقات.
- source_word: εἶπέν μοι ὅτι
  choice: وقال لي
  rationale: تقديم مباشر وطبيعي للقول المقتبس في العربية.
- source_word: Ὕπαγε
  choice: اذهب
  rationale: أمر بسيط بالحركة، وهو المقابل العربي المباشر والطبيعي.
- source_word: εἰς τὸν Σιλωάμ
  choice: إلى سلوام
  rationale: يتبع النص اليوناني في ذكر اسم الموضع وحده، إذ سبق أن عُرّف في السياق بأنه البركة.
- source_word: νίψαι
  choice: اغتسل
  rationale: يعبر طبيعيًا عن صيغة الوسط في الأمر، أي أن يغسل المرء نفسه، من غير تكلف.
- source_word: ἀπελθὼν οὖν καὶ νιψάμενος
  choice: فذهبت واغتسلت
  rationale: الفاء تنقل نتيجة الأمر وتسلسل الحدثين، والصياغة العربية المصرّفة أوضح من محاكاة التركيب بالمشاركين اليونانيين.
- source_word: ἀνέβλεψα
  choice: فأبصرت
  rationale: في سياق شفاء الأعمى يدل الفعل على حصول البصر، لا على مجرد رفع النظر. وتفيد «أبصرت» ذلك بإيجاز من غير أن توحي ضرورةً بأنه استعاد بصرًا كان قد امتلكه سابقًا.
theological_decisions:
- issue: وصف المتكلم ليسوع
  choice: الرجل الذي يُدعى يسوع
  alternative: يسوع / الرجل يسوع
  rationale: يحافظ هذا التعبير على التدرج السردي في فهم الرجل لشخص يسوع؛ فهو يعرّفه هنا بصفته رجلًا معروفًا بهذا الاسم، من غير استباق اعترافات لاحقة أو إدخال معنى عقائدي غير مصرح به.
- issue: دلالة ἀνέβλεψα في حالة المولود أعمى
  choice: فأبصرت
  alternative: فاستعدت بصري
  rationale: «استعدت بصري» قد توحي بأنه كان مبصرًا ثم فقد بصره، بينما يذكر سياق الأصحاح أنه وُلد أعمى. لذلك يحفظ «فأبصرت» المعنى السياقي من غير خلق هذا التعارض.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة، بصياغة سردية طبيعية. استُعمل «طلى» لوصف الفعل المادي بدقة، و«أبصرت» للمحافظة على الإيجاز وعلى حقيقة أن الرجل لم يكن يستعيد بصرًا سابقًا بحسب سياق الأصحاح. وُضعت علامات الحواشي بجوار الألفاظ التي تشرحها مباشرة.
