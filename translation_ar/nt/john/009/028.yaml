lexical_decisions:
- source_word: ἐλοιδόρησαν
  choice: فشتموه
  rationale: الفعل يدل على توجيه كلام مهين جارح، و«شتموه» تعبير عربي واضح يحفظ شدة الإساءة اللفظية.
- source_word: καὶ εἶπον
  choice: وقالوا
  rationale: ينقل العطف والسرد اليونانيين بإيجاز طبيعي في العربية.
- source_word: Σὺ μαθητὴς εἶ ἐκείνου
  choice: أنت تلميذ ذاك
  rationale: يحفظ تقديم ضمير المخاطب للتوكيد، ويترجم μαθητής بـ«تلميذ» بما يفيد الارتباط والاتباع، بينما تنقل «ذاك» مسافة الإشارة التي قد تحمل نبرة ازدراء في السياق.
- source_word: ἡμεῖς δὲ
  choice: أما نحن
  rationale: يحفظ المقابلة وتوكيد ضمير المتكلمين بصياغة عربية طبيعية.
- source_word: τοῦ Μωϋσέως ἐσμὲν μαθηταί
  choice: فتلاميذ موسى
  rationale: ينقل علاقة الانتساب ويحافظ على ترجمة μαθητής من الجذر نفسه في شطري المقابلة؛ وحذف فعل الكينونة طبيعي في الجملة الاسمية العربية.
theological_decisions:
- issue: نبرة ἐκείνου في الإشارة إلى يسوع
  choice: «ذاك»
  alternative: «له» أو «ذلك الرجل»
  rationale: «ذاك» تحافظ على الإشارة البعيدة واحتمال النبرة الازدرائية في سياق الشتيمة، من غير أن تجعل الازدراء معنى صريحًا لا يحتمله اللفظ وحده.
- issue: اتساق ترجمة μαθητής
  choice: «تلميذ/تلاميذ» في الموضعين
  alternative: «تابع/أتباع»
  rationale: الاتساق يحفظ المقابلة البلاغية بين الانتساب إلى يسوع والانتساب إلى موسى، و«تلميذ» هو المقابل العربي المألوف الذي قد يشمل التعلم والاتباع.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعملت «أما نحن» لإبراز المقابلة الطبيعية، و«ذاك» لصون المسافة الدلالية والنبرة المحتملة في الأصل من دون مبالغة تفسيرية.
