  text: εἰ μὴ ἦν οὗτος παρὰ θεοῦ, οὐκ ἠδύνατο ποιεῖν οὐδέν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/033.yaml
  text: If this man were not from God[a], he could do nothing.
translation:
  language: ar
  text: لو لم يكن هذا الرجل من الله[a]، لما استطاع أن يفعل شيئًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إن لم يكن هذا الرجل من الله».'
    reason: بديل لفظي لتركيب εἰ μὴ؛ والصياغة الأساسية بـ«لو لم» تُظهر بوضوح أكبر طابع الشرط الافتراضي المخالف للواقع.
lexical_decisions:
- source_word: εἰ μὴ
  choice: لو لم
  rationale: ينقل تركيب الشرط المنفي، ومع جواب الشرط بـ«لما» يعبّر طبيعيًا في العربية عن الافتراض المخالف للواقع في هذا السياق.
- source_word: ἦν
  choice: يكن
  rationale: جاء بصيغة المضارع المجزوم بعد «لم» داخل تركيب «لو لم يكن»، وهو الأسلوب العربي الفصيح الملائم لمعنى الماضي الافتراضي.
- source_word: οὗτος
  choice: هذا الرجل
  rationale: الاسم الإشاري يعود في السياق إلى يسوع بوصفه شخصًا مذكرًا؛ وإضافة «الرجل» توضح المرجع وتأتي طبيعية في العربية من غير زيادة تفسيرية عقائدية.
- source_word: παρὰ θεοῦ
  choice: من الله
  rationale: تحافظ على معنى المصدر أو المنشأ الذي تدل عليه παρά مع المضاف إليه، من غير توسيع العبارة إلى «مرسل من الله» أو «مفوَّض من الله».
- source_word: οὐκ ἠδύνατο
  choice: لما استطاع
  rationale: تعبّر عن انعدام القدرة بوصفه نتيجة للشرط الافتراضي، وهي صياغة عربية موجزة وطبيعية.
- source_word: ποιεῖν
  choice: أن يفعل
  rationale: يحافظ على عموم الفعل اليوناني، ولا يقيّده صراحةً بصنع المعجزات مع أن السياق يشير إليها.
- source_word: οὐδέν
  choice: شيئًا
  rationale: بعد النفي في «لما استطاع» تؤدي «شيئًا» معنى النفي الكلي على نحو عربي سليم، بدل محاكاة النفي المزدوج اليوناني حرفيًا.
theological_decisions:
- issue: دلالة «من الله» في صلتها بيسوع
  choice: الإبقاء على العبارة المصدرية العامة «من الله».
  alternative: «مرسَل من الله» أو «مفوَّض من الله».
  rationale: تثبت العبارة صلة يسوع بالله بوصفه مصدرًا لقدرته وأعماله، لكنها لا تحدد هنا وحدها طبيعة تلك الصلة تحديدًا تقنيًا؛ لذلك لا تضيف الترجمة معنى رساليًا أو لاهوتيًا أضيق من النص.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم تركيب «لو لم... لما...» لما فيه من طبيعية ودقة في نقل الشرط الافتراضي، مع تجنب الصياغة الحرفية الثقيلة أو التوسعات العقائدية.
