  yaml_path: translation/nt/john/009/034.yaml
  text: They answered and said to him[a], “You were born entirely in sins[c][b], and are you teaching us?” And they cast him out.
translation:
  language: ar
  text: 'فأجابوا وقالوا له: «أنت وُلدتَ كلُّك في خطايا، أفتُعلِّمنا أنت؟» ثم طردوه.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «أخرجوه إلى الخارج». وقد يعني هذا طرده من حضرتهم، وقد يوحي السياق أيضًا بإقصائه من جماعة المجمع.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ
  choice: فأجابوه وقالوا له
  rationale: يحفظ الفعلين في الأسلوب اليوحنّاوي، مع صياغة عربية واضحة وطبيعية.
- source_word: Ἐν ἁμαρτίαις
  choice: في خطايا
  rationale: يحفظ صيغة الجمع في اليونانية وقوة اتهام المتكلمين، من غير تحويلها إلى تقرير عقائدي عن «الخطيئة» بالمفرد.
- source_word: ἐγεννήθης ὅλος
  choice: وُلدتَ كلُّك
  rationale: ينقل ὅλος بوصفه دالًّا على الشخص بكليته، ويحافظ على حدّة الإهانة من غير إسناد معنى تفسيري غير مصرّح به.
- source_word: καὶ σὺ διδάσκεις ἡμᾶς;
  choice: أفتعلِّمنا أنت؟
  rationale: إبراز الضمير «أنت» في آخر السؤال ينقل نبرة الاستنكار والتقابل مع «نا» في اليونانية.
- source_word: ἐξέβαλον αὐτὸν ἔξω
  choice: أخرجوه إلى الخارج
  rationale: يحفظ اقتران الفعل بظرف «إلى الخارج» ويعبّر عن الطرد بوضوح، مع إبقاء مدى الإقصاء المقصود غير محسوم.
theological_decisions:
- issue: دلالة الاتهام بأنه وُلد في خطايا
  choice: الإبقاء على صيغة الجمع وعلى الاتهام بأنه وُلد كلّه في خطايا
  alternative: وُلدتَ كلُّك في الخطيئة؛ أو وُلدتَ خاطئًا تمامًا
  rationale: النص يسجل إهانة المتكلمين، لكنه لا يحدد هل يقصدون خطيئته الشخصية أم خطايا والديه أم علاقة مفترضة بين العمى والخطيئة؛ لذلك لا تحسم الترجمة هذا التوتر.
- issue: مدى الطرد في ἐξέβαλον αὐτὸν ἔξω
  choice: أخرجوه إلى الخارج
  alternative: طردوه من المجمع
  rationale: العبارة قد تعني إخراجه من حضرتهم، وقد يوحي السياق بإقصائه من جماعة المجمع، لكن الآية نفسها لا تسمّي المجمع صراحة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حُفظت نبرة الاستنكار والإهانة، وصيغة الجمع «خطايا»، والتكرار الدلالي في «أخرجوه إلى الخارج» من غير إضافة تفسير مذهبي.
