base_translation:
  language: en
  yaml_path: translation/nt/john/009/041.yaml
  text: Jesus said to them[a], “If you were blind, you would not have sin. But now you say, ‘We see,’ so your sin remains.”
translation:
  language: ar
  text: 'فقال لهم يسوع: «لو كنتم عميانًا، لما كانت لكم خطيئة[a]. أما الآن فتقولون: ‘إننا نبصر’؛ تبقى خطيئتكم».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لما كان عليكم ذنب». اللفظ اليوناني هو «خطيئة»، وقد يتضمن هنا معنى التبعة والذنب.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τυφλοὶ
  choice: عميانًا
  rationale: يحافظ على المعنى المباشر وعلى استعارة العمى التي يطوّرها سياق الأصحاح، من غير إضافة تفسيرية مثل «روحيًّا».
- source_word: οὐκ ἂν εἴχετε
  choice: لما كانت لكم
  rationale: ينقل نتيجة الشرط المخالف للواقع إلى صياغة عربية طبيعية، ويحافظ على تركيب امتلاك الخطيئة في اليونانية.
- source_word: ἁμαρτίαν
  choice: خطيئة
  rationale: المقابل المباشر للكلمة اليونانية، مع احتمال دلالتها هنا على التبعة أو الذنب دون حصر معناها في ذلك.
- source_word: νῦν δὲ
  choice: أما الآن
  rationale: يبرز المقابلة بين الفرض السابق والواقع الحاضر بأسلوب عربي واضح.
- source_word: λέγετε ὅτι Βλέπομεν
  choice: 'فتقولون: ‘إننا نبصر’'
  rationale: يحافظ على الانتقال البلاغي من المخاطب الجمع إلى القول المباشر بضمير المتكلمين، وعلى مفارقة «الإبصار» في السياق.
- source_word: ἡ ἁμαρτία ὑμῶν μένει
  choice: تبقى خطيئتكم
  rationale: ينقل الفعل الحاضر μένει بمعنى الاستمرار، ويحافظ على لفظ «الخطيئة» بدل تفسيره تفسيرًا أضيق.
theological_decisions:
- issue: هل يُصرَّح بأن العمى روحي وأن الخطيئة تعني التبعة أو الذنب؟
  choice: الإبقاء على «عميانًا» و«خطيئة» بلا توسع تفسيري في المتن.
  alternative: «لو كنتم عميانًا روحيًّا، لما كنتم مذنبين».
  rationale: السياق يدل على الإدراك الروحي، لكن كلام يسوع يستبقي استعارة العمى الجسدي الممتدة في الأصحاح. والتصريح بـ«روحيًّا» أو استبدال «الخطيئة» بـ«الذنب» يحسم توترًا ودلالةً أوسع لا يحسمهما النص اليوناني.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدمت «نبصر» لموازاة استعارة العمى والإبصار، و«تبقى» لنقل الاستمرار في الفعل اليوناني. وُضع marker الحاشية عقب «خطيئة» لأنها موضع البديل المعجمي.
