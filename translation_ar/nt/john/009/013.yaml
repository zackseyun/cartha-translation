lexical_decisions:
- source_word: Ἄγουσιν
  choice: فجاؤوا... بـ
  rationale: المضارع اليوناني مضارع تاريخي في سياق السرد، فنُقل بالماضي العربي الطبيعي. وصيغة «جاؤوا به» تؤدي معنى اقتياده إلى جهة مقصودة دون إيحاء زائد بالقسر.
- source_word: αὐτὸν
  choice: بالرجل
  rationale: الضمير يعود إلى الرجل المذكور، وقد صُرّح به في العربية لربطه طبيعيًا بالوصف الاسمي اللاحق «الذي كان أعمى».
- source_word: πρὸς τοὺς Φαρισαίους
  choice: إلى الفريسيين
  rationale: تحفظ دلالة الحركة باتجاه أشخاص، وهي أقرب من «أمام الفريسيين» التي قد تضيف معنى المثول الرسمي.
- source_word: Φαρισαίους
  choice: الفريسيين
  rationale: الصيغة العربية المعيارية الشائعة لاسم هذه الجماعة.
- source_word: τόν ποτε τυφλόν
  choice: الرجل الذي كان أعمى من قبل
  rationale: التركيب اليوناني وصفيّ مستعمل استعمال الاسم، وتوضحه العربية بذكر «الرجل» وصلة الموصول، مع إبراز أن العمى كان حالته السابقة.
- source_word: ποτε
  choice: من قبل
  rationale: تؤدي هنا معنى «سابقًا» وتبرز المقابلة بين حالته الماضية وحالته الراهنة بلغة عربية طبيعية.
- source_word: τυφλόν
  choice: أعمى
  rationale: المقابل العربي المباشر للصفة الدالة على حالته السابقة.
