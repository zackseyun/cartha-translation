source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Οὔτε οὗτος ἥμαρτεν οὔτε οἱ γονεῖς αὐτοῦ, ἀλλ’ ἵνα φανερωθῇ τὰ ἔργα τοῦ θεοῦ ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/003.yaml
  text: Jesus answered[a], “Neither this man sinned, nor his parents[c][b], but so that the works of God might be revealed in him.”
translation:
  language: ar
  text: 'أجاب يسوع: «لم يخطئ هذا ولا أبواه، بل لكي تظهر أعمال الله فيه[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يأتي في اليونانية بعد «بل» تركيب «لكي تظهر أعمال الله فيه» من غير جملة رئيسة مصرّح بها. ويمكن فهم «فيه» أيضًا بمعنى «من خلاله».
    reason: بيان الاقتضاب النحوي وحفظ الاحتمال الدلالي لحرف الجر
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: أجاب
  rationale: الصياغة السردية العربية المألوفة في الحوار، وتنقل وظيفة الفعل مباشرة.
- source_word: Οὔτε ... οὔτε
  choice: لا ... ولا
  rationale: المقابلة العربية الطبيعية التي تحفظ نفي الاحتمالين على السواء.
- source_word: οὗτος
  choice: هذا
  rationale: الإشارة واضحة في السياق إلى الرجل المولود أعمى، ولا حاجة إلى إضافة «الرجل».
- source_word: ἥμαρτεν
  choice: أخطأ
  rationale: ينقل فعل ἁμαρτάνω بصياغة عربية مباشرة ومفهومة، بمعنى ارتكب خطيئة.
- source_word: οἱ γονεῖς αὐτοῦ
  choice: أبواه
  rationale: مثنى «أب» في العربية الفصيحة يُستعمل للأب والأم معًا، وهو موجز وطبيعي.
- source_word: ἀλλ’ ἵνα
  choice: بل لكي
  rationale: يحفظ الانتقال اليوناني المباشر إلى غرض إظهار أعمال الله، من غير إدخال عبارة غير مصرّح بها مثل «حدث هذا».
- source_word: φανερωθῇ
  choice: تظهر
  rationale: ينقل معنى الصيرورة إلى الظهور والإعلان بلغة عربية طبيعية؛ وصيغة الفعل العربية هنا تؤدي معنى المبني للمجهول الدلالي دون ثقل «يُكشف عنها».
- source_word: τὰ ἔργα τοῦ θεοῦ
  choice: أعمال الله
  rationale: تعبير مباشر يحفظ الاصطلاح اليوحناوي والإضافة في الأصل.
- source_word: ἐν αὐτῷ
  choice: فيه
  rationale: المقابل الأقرب لحرف الجر ἐν، ويحفظ احتمال أن يكون الرجل موضع ظهور الأعمال أو واسطته دون حسم زائد.
theological_decisions:
- issue: مدى نفي الصلة بين الخطيئة والعمى
  choice: قصر النفي على خطيئة هذا الرجل أو أبويه بوصفها تفسيرًا لهذه الحالة
  alternative: توسيع العبارة إلى تقرير أن المعاناة لا ترتبط بالخطيئة في أي حال
  rationale: النص يجيب عن البديلين المحددين في سؤال التلاميذ، ولا يصرح بقاعدة عامة عن كل معاناة.
- issue: 'دلالة ἵνα: الغرض أم النتيجة'
  choice: «لكي تظهر» بصياغة غرضية
  alternative: «فكانت النتيجة أن ظهرت» أو إعادة ترقيم العبارة لتجنب معنى الغرض
  rationale: القراءة الغرضية هي الدلالة المباشرة للبناء مع صيغة الاحتمال، وينبغي إبقاء توترها اللاهوتي دون إضافة تفسير عن تسبب الله في العمى.
- issue: تعلّق ἀλλ’ ἵνα مع غياب جملة رئيسة صريحة
  choice: الإبقاء على البناء المقتضب «بل لكي»
  alternative: إضافة «حدث هذا» أو وصل العبارة بما يليها في الآية التالية
  rationale: الأصل اليوناني مقتضب نحويًا، وإضافة حدث غير مصرّح به قد تحسم طبيعة العلاقة السببية؛ لذلك حُفظ الاقتضاب مع إيضاحه في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. اختير «أبواه» للإيجاز الطبيعي، وحُفظ البناء «بل لكي» رغم اقتضابه لأنه يعكس الأصل ولا يضيف سببًا غير مصرّح به. وُضعت علامة الحاشية بعد الاقتباس لأنها تتناول العبارة الختامية وبناء الجملة كله.
