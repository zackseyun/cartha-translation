source:
  edition: SBLGNT
  text: ⸀ἡμᾶς δεῖ ἐργάζεσθαι τὰ ἔργα τοῦ πέμψαντός με ἕως ἡμέρα ἐστίν· ἔρχεται νὺξ ὅτε οὐδεὶς δύναται ἐργάζεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/004.yaml
  text: We must do the works of the one who sent me while it is day; night is coming[a], when no one can work.
translation:
  language: ar
  text: يجب علينا أن نعمل أعمالَ الذي أرسلني ما دام النهار؛ فالليل آتٍ[a]، حين لا يستطيع أحد أن يعمل.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ بعض المخطوطات: «يجب عليّ أن أعمل أعمالَ الذي أرسلني».'
    reason: textual_variant
lexical_decisions:
- source_word: ἡμᾶς
  choice: علينا
  rationale: ضمير المتكلم الجمع مع δεῖ يفيد أن الضرورة واقعة علينا، وتؤديه العربية طبيعيًا بعبارة «يجب علينا».
- source_word: δεῖ
  choice: يجب
  rationale: ينقل معنى الضرورة والإلزام بوضوح وقوة في العربية المعاصرة.
- source_word: ἐργάζεσθαι τὰ ἔργα
  choice: أن نعمل أعمالَ
  rationale: يحافظ على الصلة اللفظية بين الفعل والاسم في اليونانية، وهي صياغة عربية مفهومة وملائمة للأسلوب اليوحناوي.
- source_word: τοῦ πέμψαντός με
  choice: الذي أرسلني
  rationale: ترجمة مباشرة لاسم الفاعل المعرّف، من غير التصريح بهوية المُرسِل بما يتجاوز النص.
- source_word: ἕως ἡμέρα ἐστίν
  choice: ما دام النهار
  rationale: تعبير عربي طبيعي يدل على استمرار فرصة العمل طوال بقاء النهار، ويحفظ المقابلة مع الليل الآتي.
- source_word: ἔρχεται νὺξ
  choice: فالليل آتٍ
  rationale: ينقل المضارع ذا الدلالة الوشيكة، وتوضح الفاء الانتقال إلى النتيجة المقابلة من غير إضافة معنى غريب عن السياق.
- source_word: ὅτε οὐδεὶς δύναται ἐργάζεσθαι
  choice: حين لا يستطيع أحد أن يعمل
  rationale: صياغة عربية واضحة تحافظ على الظرف الزمني، والنفي العام، ومعنى القدرة على العمل.
theological_decisions:
- issue: الاختلاف النصي في أول الآية بين ἡμᾶς («علينا/نحن») وἐμέ («عليّ/أنا»)
  choice: يجب علينا أن نعمل أعمالَ الذي أرسلني
  alternative: يجب عليّ أن أعمل أعمالَ الذي أرسلني
  rationale: تتبع الترجمة نص SBLGNT المعطى الذي يقرأ ἡμᾶς، مع إثبات القراءة المفردة المعروفة في الحاشية حفاظًا على الشفافية النصية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ التكرار الاشتقاقي في «نعمل أعمال» لما له من صلة بأسلوب يوحنا، واستُخدم «ما دام النهار» لتأدية المعنى الزمني بصورة طبيعية.
