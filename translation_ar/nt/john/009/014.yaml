  yaml_path: translation/nt/john/009/014.yaml
  text: It was a Sabbath on the day when Jesus made the mud and opened his eyes.
translation:
  language: ar
  text: وكان اليوم الذي صنع فيه يسوع الطين[a] وفتح عيني الرجل[b] يوم سبت.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمتها: «الصلصال».'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا في اليونانية: «فتح عينيه»، وهو تعبير حسي مباشر عن شفائه.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σάββατον
  choice: يوم سبت
  rationale: تعبير عربي طبيعي يحفظ الدلالة الزمنية، أي إن الحدث وقع في يوم السبت، من غير إضافة تفسير للنزاع اللاحق.
- source_word: ἐν ᾗ ἡμέρᾳ
  choice: اليوم الذي... فيه
  rationale: صياغة عربية سليمة تؤدي معنى العبارة الزمنية الموصولة من غير حرفية متكلفة.
- source_word: πηλόν
  choice: الطين
  rationale: هو المقابل العربي المألوف في سياق مزج التراب باللعاب ووضعه على العينين، مع إمكان فهمه بوصفه عجينًا من طين.
- source_word: ἐποίησεν
  choice: صنع
  rationale: ينقل المعنى العام للفعل ποιέω بوضوح، ويوافق صنع الطين في سياق الرواية.
- source_word: ἀνέῳξεν
  choice: فتح
  rationale: يحفظ الصورة الحسية المباشرة في اليونانية بدل تفسيرها بعبارة مثل «ردّ إليه بصره».
- source_word: αὐτοῦ τοὺς ὀφθαλμούς
  choice: عينيه
  rationale: يحافظ على الإحالة الجسدية المباشرة وعلى الضمير كما في النص، والسياق يبين أنه يعود إلى الرجل.
- source_word: δὲ
  choice: الواو في «وكان»
  rationale: تنقل الانتقال السردي الخفيف الذي تؤديه δέ من غير تحميله معنى استدراكيًا قويًا.
theological_decisions:
- issue: ذكر السبت وعلاقته بشفاء يسوع للرجل
  choice: 'إيراد الخبر الزمني كما هو: كان ذلك اليوم يوم سبت'
  alternative: إضافة تفسير عن مشروعية الشفاء في السبت أو عن النزاع بشأن الشريعة
  rationale: الآية تمهد للجدال اللاحق بذكر واقعة زمنية فقط؛ لذلك تُحفظ دلالتها وتوترها السردي من غير استباق الحكم اللاهوتي أو الفقهي.
translation_notes:
  register: العربية فصحى حديثة واضحة وموقرة. قُدِّم الظرف الزمني في تركيب اسمي طبيعي، وحُفظ التعبير الملموس «فتح عينيه» مع تجنب الشرح العقائدي داخل المتن.
