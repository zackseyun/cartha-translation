  text: ἔλεγον οὖν ἐκ τῶν Φαρισαίων τινές· ⸂Οὐκ ἔστιν οὗτος παρὰ θεοῦ ὁ ἄνθρωπος⸃, ὅτι τὸ σάββατον οὐ τηρεῖ. ⸀ἄλλοι ἔλεγον· Πῶς δύναται ἄνθρωπος ἁμαρτωλὸς τοιαῦτα σημεῖα ποιεῖν; καὶ σχίσμα ἦν ἐν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/016.yaml
  text: So some of the Pharisees were saying[a], “This man is not from God, because he does not keep the Sabbath.” But others were saying[b], “How can a sinful man do such signs?” And there was a division among them.
translation:
  language: ar
  text: 'فكان بعضُ الفريسيين يقولون: «هذا الإنسان ليس من عند الله، لأنه لا يحفظ السبت». وكان آخرون يقولون: «كيف يستطيع إنسان خاطئ[a] أن يصنع مثل هذه الآيات[b]؟» وكان بينهم انقسام.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا إعادة الصياغة: «إنسان من الخطاة». واليونانية تصف «الإنسان» بصفة «خاطئ».'
    reason: lexical_alternative
  - marker: b
    text: تكثر في إنجيل يوحنا تسمية أعمال يسوع «آيات» لإبراز دلالتها الكاشفة؛ ويمكن توضيح ذلك بترجمتها «آيات معجزية».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον οὖν ἐκ τῶν Φαρισαίων τινές
  choice: فكان بعضُ الفريسيين يقولون
  rationale: تنقل «فـ» وظيفة οὖν في متابعة السياق، ويعبّر تركيب «كان ... يقولون» عن الجانب الاستمراري للفعل الناقص ἔλεγον، بينما يوجز «بعض الفريسيين» معنى «بعضٌ من الفريسيين» في عربية طبيعية.
- source_word: οὗτος ... ὁ ἄνθρωπος
  choice: هذا الإنسان
  rationale: يحافظ على اسم الإشارة وعلى الإحالة إلى الشخص من غير إضافة نبرة ازدراء غير صريحة في الأصل.
- source_word: παρὰ θεοῦ
  choice: من عند الله
  rationale: يعبّر عن المصدر أو المنشأ الإلهي، من غير توسيع العبارة إلى «مرسَل من الله»، إذ لا يرد فعل الإرسال هنا.
- source_word: τὸ σάββατον οὐ τηρεῖ
  choice: لا يحفظ السبت
  rationale: «يحفظ السبت» تعبير عربي مفهوم ومستقر لأداء فريضة السبت ومراعاتها، ويحافظ على دلالة τηρεῖ الأساسية.
- source_word: ἄλλοι ἔλεγον
  choice: وكان آخرون يقولون
  rationale: يحفظ المقابلة بين الفريقين والجانب الاستمراري للفعل الناقص.
- source_word: Πῶς δύναται
  choice: كيف يستطيع
  rationale: صياغة عربية مباشرة تنقل سؤال الإمكان أو القدرة.
- source_word: ἄνθρωπος ἁμαρτωλὸς
  choice: إنسان خاطئ
  rationale: يحافظ على البنية اليونانية التي فيها الصفة ἁμαρτωλός نعتًا لـἄνθρωπος، بدل إعادة الصياغة باسم «خاطئ» وحده.
- source_word: τοιαῦτα σημεῖα
  choice: مثل هذه الآيات
  rationale: «الآيات» تحفظ دلالة σημεῖα اليوحناوية بوصف الأعمال علامات كاشفة، ولا تختزلها في مجرد معجزات؛ و«مثل هذه» تنقل τοιαῦτα طبيعيًا.
- source_word: σχίσμα ἦν ἐν αὐτοῖς
  choice: وكان بينهم انقسام
  rationale: صياغة واضحة وقريبة من الأصل، تدل على الانقسام القائم داخل الجماعة من غير مبالغة.
theological_decisions:
- issue: دلالة σημεῖα في يوحنا
  choice: الآيات
  alternative: المعجزات / الآيات المعجزية
  rationale: يستعمل يوحنا اللفظة للدلالة على أعمال تشير إلى هوية يسوع وتكشف معناها؛ لذلك تحافظ «الآيات» على هذا البعد من غير إضافة وصف غير موجود في النص.
- issue: معنى كون يسوع παρὰ θεοῦ
  choice: من عند الله
  alternative: مرسَل من الله
  rationale: تحفظ العبارة معنى المصدر أو المنشأ والتأييد المحتمل، من غير حسمه في مفهوم الإرسال، لأن فعل «أرسل» غير مذكور.
- issue: وصف ἄνθρωπος ἁμαρτωλός
  choice: إنسان خاطئ
  alternative: خاطئ
  rationale: يبقي الوصف نعتًا للإنسان كما في اليونانية، ويحفظ صيغة اعتراض المتكلمين من غير تحويلها إلى تقرير لاهوتي من الراوي.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُخدم «من عند الله» و«يحفظ السبت» بما يلائم السياق الديني من غير توسع تفسيري، ووُضعت علامتا الحاشية بعد اللفظتين اللتين تتناولهما الحاشيتان مباشرة.
