base_translation:
  language: en
  yaml_path: translation/nt/john/009/037.yaml
  text: Jesus said to him[a], “You have seen him, and the one speaking with you is he.”
translation:
  language: ar
  text: 'قال له يسوع: «لقد رأيتَه، والذي يتكلَّم معك[a] هو نفسه».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «الذي يتكلَّم إليك». واليونانية حرفيًا: «الذي يتكلَّم معك».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν αὐτῷ
  choice: قال له
  rationale: صيغة سردية مباشرة وطبيعية تنقل فعل القول مع المضاف إليه من غير زيادة في المعنى.
- source_word: Καὶ ἑώρακας
  choice: لقد رأيتَه
  rationale: 'تنقل «لقد» دلالة الفعل التام: رؤية حدثت وما زالت ذات صلة باللحظة الحاضرة. ولم تُترجم καί ترجمة آلية مستقلة، لأن توكيد «لقد» والربط السياقي يؤديان وظيفتها طبيعيًا في العربية.'
- source_word: αὐτὸν
  choice: ـه
  rationale: ضمير المفعول المفرد المذكر يحيل إلى الشخص المذكور في السؤال السابق من غير إعادة لقبه داخل الآية.
- source_word: ὁ λαλῶν
  choice: الذي يتكلَّم
  rationale: ينقل اسم الفاعل المضارع المعرَّف بوصفه فعلًا جاريًا، بعبارة عربية واضحة ورصينة.
- source_word: μετὰ σοῦ
  choice: معك
  rationale: تحافظ «معك» على المعنى الأساسي لحرف الجر μετά مع المجرور، مع بقاء العبارة طبيعية في العربية.
- source_word: ἐκεῖνός ἐστιν
  choice: هو ذاك
  rationale: صيغة تعريف موجزة ومؤكدة تحافظ على الإشارة إلى المرجع السابق، من غير إدخال لقب «ابن الإنسان» صراحة في هذه الجملة.
theological_decisions:
- issue: تعريف يسوع بنفسه بوصفه الشخص الذي سأل عنه الرجل في السياق السابق
  choice: «والذي يتكلَّم معك هو ذاك»
  alternative: «فهو الذي يتكلَّم معك»
  rationale: 'تحافظ الصياغة المختارة على خبري النص: أن الرجل قد رآه، وأن المتكلم معه هو ذلك الشخص بعينه، من غير توسيع تفسيري أو إعادة اللقب المحذوف في اليونانية.'
translation_notes:
  register: عربية فصحى حديثة واضحة وذات نبرة كتابية رصينة. استُعملت «هو ذاك» للمحافظة على قوة صيغة التعريف اليونانية، مع تجنّب شرح المرجع داخل المتن.
