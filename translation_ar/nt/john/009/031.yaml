  text: ⸀οἴδαμεν ὅτι ⸂ἁμαρτωλῶν ὁ θεὸς⸃ οὐκ ἀκούει, ἀλλ’ ἐάν τις θεοσεβὴς ᾖ καὶ τὸ θέλημα αὐτοῦ ποιῇ τούτου ἀκούει.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/031.yaml
  text: We know that God does not listen to sinners; but if anyone is God-fearing and does his will[a], he listens to him.
translation:
  language: ar
  text: نحن نعلم أن الله لا يستمع إلى الخطاة، لكن إن كان أحدٌ يتقي الله ويعمل بمشيئة الله، فإن الله يستمع إليه[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يعبد الله».'
    reason: بديل معجمي ممكن للفظة θεοσεβής.
lexical_decisions:
- source_word: οἴδαμεν
  choice: نحن نعلم
  rationale: صيغة οἶδα التامة تؤدي معنى الحاضر في اليونانية الكوينية، و«نعلم» هي المقابل العربي الطبيعي. وأُثبت الضمير لإبراز النبرة التقريرية.
- source_word: ἁμαρτωλῶν
  choice: الخطاة
  rationale: الجمع المجرور مع ἀκούει يدل على فئة الأشخاص المقصودة، و«الخطاة» ترجمة موجزة تحفظ القوة الأخلاقية والدينية.
- source_word: ἀκούει
  choice: يستمع إلى
  rationale: الفعل هنا لا يدل على مجرد السماع الحسي، بل على الإصغاء بعناية أو قبول؛ و«يستمع إلى» يحفظ هذا المعنى من غير أن يضيّقه إلى «يستجيب».
- source_word: θεοσεβὴς
  choice: يتقي الله
  rationale: اللفظة تصف من يوقر الله ويهابه. وصياغة «من يتقي الله» طبيعية في العربية وتحفظ الإشارة الصريحة إلى الله ولا تقصر المعنى على فعل العبادة الشعائري.
- source_word: τὸ θέλημα αὐτοῦ ποιῇ
  choice: يعمل بمشيئته
  rationale: تعبير عربي واضح وطبيعي عن اصطلاح «يفعل مشيئته»، ويفيد السلوك وفق مشيئة الله.
- source_word: τούτου ἀκούει
  choice: يستمع إلى من يتقي الله ...
  rationale: اسم الإشارة المجرور يعود بتوكيد إلى الشخص المذكور. وقد قُدِّم فعل الجواب في العربية لتجنب ضمير ملتبس مع الحفاظ على المقابلة.
- source_word: ἀλλ’ ἐάν τις
  choice: لكنه ... من
  rationale: تحفظ «لكن» التضاد، ويؤدي التركيب الموصول معنى الشرط العام غير المحدد بصورة عربية سلسة.
theological_decisions:
- issue: نطاق القول إن الله لا يستمع إلى الخطاة
  choice: إبقاء القول بصيغته القوية كما نطق به المتكلم في السياق، بلا تلطيف أو تعميم عقائدي زائد.
  alternative: «لا يستجيب لصلوات الخطاة» أو «لا يرضى عن الخطاة».
  rationale: النص اليوناني يقول ببساطة إن الله لا «يستمع إلى» الخطاة، في مقابل استماعه إلى من يتقيه ويعمل بمشيئته. فلا تُضاف «الصلوات»، ولا يُحوَّل كلام المتكلم إلى تقرير منهجي يحسم كل دلالة ممكنة لسماع الله.
- issue: دلالة θεοσεβής
  choice: من يتقي الله
  alternative: من يعبد الله
  rationale: الاختيار يحفظ معنى التوقير والمهابة الأوسع في الصفة، بينما البديل صحيح محتمل لكنه قد يوحي بالعبادة الشعائرية وحدها؛ لذلك حُفظ في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. أُعيد ترتيب جواب الشرط ليأتي «يستمع» قبل وصف الشخص، تفاديًا لالتباس مرجع الضمير في العربية، مع الحفاظ على بنية التضاد والمعنى الأصلي.
