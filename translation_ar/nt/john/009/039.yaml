base_translation:
  language: en
  yaml_path: translation/nt/john/009/039.yaml
  text: And Jesus said[a], “For judgment I came into this world, so that those who do not see may see, and those who see may become blind.”
translation:
  language: ar
  text: 'وقال يسوع: «للحُكم[a] أتيتُ إلى هذا العالم، لكي يُبصرَ الذين لا يُبصرون، ويصيرَ الذين يُبصرون عميانًا».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لدينونةٍ». قد تُبرز العبارة اليونانية النتيجة القضائية لمجيء يسوع، لا الإدانة وحدها.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίμα
  choice: دينونة
  rationale: تنقل معنى الحكم والنتيجة القضائية من غير قصره على الإدانة العقابية؛ وهذا يلائم الانقلاب المزدوج في الآية بين الإبصار والعمى.
- source_word: κόσμον
  choice: العالم
  rationale: هو المقابل العربي الطبيعي في الاستعمال اليوحناوي، ويشير هنا إلى عالم البشر الذي أتى إليه يسوع.
- source_word: οἱ μὴ βλέποντες / οἱ βλέποντες
  choice: الذين لا يُبصرون / الذين يُبصرون
  rationale: يحافظ هذا على التوازي اللفظي وعلى إمكان المعنى الحسي والروحي معًا، ولا يستبدل الطرف الأول مسبقًا بتعبير «العميان».
- source_word: βλέπωσιν
  choice: يُبصر
  rationale: يحفظ دلالة الرؤية، الحسية والروحية، في صيغة الغاية بعد ἵνα.
- source_word: τυφλοὶ γένωνται
  choice: يصير ... عميانًا
  rationale: ينقل معنى الصيرورة في γένωνται ويحافظ على حدة الانقلاب القضائي في القول.
- source_word: εἰς τὸν κόσμον τοῦτον ἦλθον
  choice: أتيتُ إلى هذا العالم
  rationale: صياغة عربية فصيحة وطبيعية تحفظ لغة المجيء اليوحناوية، مع أن «دخلتُ هذا العالم» ممكنة لكنها أقل ملاءمة لهذا السياق.
theological_decisions:
- issue: صلة القول بما يرد في يوحنا 3:17 عن عدم المجيء لدينونة العالم
  choice: الإبقاء على «لدينونةٍ» من غير تلطيف أو توفيق تفسيري
  alternative: «للفصل» أو «للإدانة»
  rationale: 'النص يعرض مجيء يسوع بوصفه مؤديًا إلى تمييز قضائي يكشف الحال الروحية: غير المبصرين يبصرون، والذين يزعمون الإبصار يصيرون عميانًا. «الإدانة» أضيق من السياق، و«الفصل» يخفف البعد القضائي.'
translation_notes:
  register: لغة عربية فصحى معاصرة، واضحة ومهيبة. استُعمل «يُبصر» بدل «يرى» للمحافظة على الصلة الدلالية بالعمى، ووُضع تنوين «دينونةٍ» لإبقاء احتمال التنكير الذي تسمح به اليونانية. نُقلت علامة الحاشية إلى نهاية القول لتتعلق بلفظ «دينونة» مع بقاء ظهورها في المتن.
