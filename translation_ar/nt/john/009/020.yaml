lexical_decisions:
- source_word: οὖν
  choice: فـ
  rationale: تفيد الفاء استمرار السرد ونتيجة الاستجواب السابق بصورة طبيعية موجزة في العربية.
- source_word: οἱ γονεῖς αὐτοῦ
  choice: والداه
  rationale: المثنى المضاف يعبّر بوضوح وطبيعية عن أبيه وأمه معًا.
- source_word: ἀπεκρίθησαν ... καὶ εἶπαν
  choice: أجاب ... وقالا
  rationale: حُفظ الفعلان في التعبير اليوناني بدل دمجهما، مع مراعاة تثنية الفاعل في العربية.
- source_word: Οἴδαμεν
  choice: نحن نعلم
  rationale: ينقل معنى المعرفة المؤكدة، وإظهار الضمير يلائم نبرة الشهادة والتوكيد.
- source_word: οὗτός ἐστιν ὁ υἱὸς ἡμῶν
  choice: هذا ابننا
  rationale: صياغة عربية طبيعية تحافظ على التعيين الصريح بالاسم الإشاري.
- source_word: τυφλὸς ἐγεννήθη
  choice: وُلد أعمى
  rationale: ترجمة مباشرة وموجزة تحفظ كون العمى وصفًا لحالته عند الولادة.
