  text: λέγουσιν ⸀οὖν τῷ τυφλῷ πάλιν· ⸂Τί σὺ⸃ λέγεις περὶ αὐτοῦ, ὅτι ἠνέῳξέν σου τοὺς ὀφθαλμούς; ὁ δὲ εἶπεν ὅτι Προφήτης ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/017.yaml
  text: So they said again to the blind man[a], “What do you say about him, since he opened your eyes?” And he said[c][b], “He is a prophet.”
translation:
  language: ar
  text: 'فقالوا للأعمى مرةً أخرى: «ماذا تقول أنت عنه، إذ فتح عينيك؟» فقال: «إنه نبي».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إنه النبي». قد تُفهم اللفظة اليونانية بقوة أقرب إلى اللقب، غير أن السياق يجيز أيضًا معنى «نبي».'
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: فـ
  rationale: تفيد استئنافًا ناتجًا عما سبق، وتحافظ على تدفق السرد الطبيعي دون إثقال العبارة.
- source_word: τῷ τυφλῷ
  choice: للأعمى
  rationale: الصفة مستعملة استعمال الاسم، وهذه صياغة عربية موجزة وطبيعية دون إضافة منظور غير مصرّح به في الجملة.
- source_word: πάλιν
  choice: مرةً أخرى
  rationale: تحفظ معنى تكرار التوجّه إليه بالسؤال في سياق الاستجواب الجاري.
- source_word: Τί σὺ λέγεις
  choice: ماذا تقول أنت
  rationale: إظهار الضمير «أنت» ينقل توكيد σὺ الصريح في اليونانية نقلاً طبيعيًا في العربية.
- source_word: περὶ αὐτοῦ
  choice: عنه
  rationale: مقابل عربي مباشر ومألوف للتركيب اليوناني في هذا السياق.
- source_word: ὅτι
  choice: إذ
  rationale: 'تنقل العلاقة السببية أو الظرفية المرنة: يسألون عن رأيه فيه بالنظر إلى أنه فتح عينيه، من غير حسم زائد بين «إذ» و«لأنه».'
- source_word: ἠνέῳξέν σου τοὺς ὀφθαλμούς
  choice: فتح عينيك
  rationale: صياغة مباشرة تحفظ الفعل الماضي وصورة فتح العينين كما في الأصل.
- source_word: Προφήτης ἐστίν
  choice: إنه نبي
  rationale: «نبي» خبر نكرة طبيعي في العربية، ويحفظ وصف الرجل ليسوع بأنه نبي دون فرض أن اللفظ لقب محدد.
theological_decisions:
- issue: هل تُفهم Προφήτης وصفًا نكرة أم لقبًا محددًا؟
  choice: إنه نبي
  alternative: إنه النبي
  rationale: غياب أداة التعريف وسياق تطور إدراك الرجل يؤيدان الوصف «نبي»، مع إثبات البديل ذي القوة اللقبية في الحاشية كي لا يُطمس الاحتمال الدلالي.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة، مع إبراز ضمير «أنت» حفاظًا على توكيد الأصل، وتجنب تعبيرات مذهبية أو تفسيرات تتجاوز النص.
