source:
  edition: SBLGNT
  text: πῶς δὲ νῦν βλέπει οὐκ οἴδαμεν, ἢ τίς ἤνοιξεν αὐτοῦ τοὺς ὀφθαλμοὺς ἡμεῖς οὐκ οἴδαμεν· ⸂αὐτὸν ἐρωτήσατε, ἡλικίαν ἔχει⸃, αὐτὸς περὶ ἑαυτοῦ λαλήσει.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/021.yaml
  text: But how he now sees[a], we do not know; or who opened his eyes, we do not know. Ask him; he is of age. He will speak for himself.
translation:
  language: ar
  text: أما كيف يبصر الآن، فلا نعلم؛ أو من فتح عينيه، فلا نعلم. اسألوه؛ فهو في سنّ الرشد، وسيتكلم عن نفسه بنفسه.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وهو يستطيع أن يتكلم عن نفسه». قد تُستعمل صيغة المستقبل اليونانية هنا تقريرًا عمليًا لقدرته على الإجابة أو لمسؤوليته عنها.'
    reason: بديل دلالي لصيغة المستقبل
lexical_decisions:
- source_word: πῶς δὲ νῦν βλέπει
  choice: أما كيف يبصر الآن
  rationale: تحافظ الصياغة على سؤال «كيف» وعلى دلالة الحاضر في «يبصر»، وتنقل δέ بربط استدراكي عربي طبيعي من غير أن تضيف معنى القدرة صراحة.
- source_word: οὐκ οἴδαμεν
  choice: فلا نعلم
  rationale: ترجمة مباشرة، مع إبقاء العبارة مكررة كما في اليونانية لإبراز إصرار الوالدين على عدم المعرفة.
- source_word: ἢ τίς ἤνοιξεν αὐτοῦ τοὺς ὀφθαλμούς
  choice: أو من فتح عينيه
  rationale: تحافظ على أداة البديل «أو» وعلى صورة «فتح العينين» المتكررة في سياق رواية المعجزة.
- source_word: αὐτὸν ἐρωτήσατε
  choice: اسألوه
  rationale: صيغة أمر جمع مباشرة وطبيعية، والضمير يحدد الابن بوصفه المسؤول عن الإجابة.
- source_word: ἡλικίαν ἔχει
  choice: فهو في سنّ الرشد
  rationale: يدل السياق على بلوغه السن التي يستطيع فيها أن يجيب مستقلًا، لا على قامته؛ و«في سن الرشد» تعبير عربي واضح ومعاصر.
- source_word: αὐτὸς περὶ ἑαυτοῦ λαλήσει
  choice: وسيتكلم عن نفسه بنفسه
  rationale: تحافظ صيغة المستقبل على λαλήσει، وينقل «بنفسه» توكيد αὐτός، بينما يعبر «عن نفسه» عن περὶ ἑαυτοῦ.
theological_decisions:
- issue: دلالة ἡλικίαν ἔχει في سياق الاستجواب
  choice: أنه بلغ سنًا تؤهله للإجابة عن نفسه استقلالًا
  alternative: أنه ناضج عمومًا، أو أنه مكتمل القامة
  rationale: حديث الوالدين موجّه إلى مستجوبين، وهما يحيلانهم إلى ابنهما ليجيب بنفسه؛ لذلك المقصود هنا السن المؤهلة للشهادة أو الجواب، لا الطول الجسدي.
- issue: قوة αὐτὸς περὶ ἑαυτοῦ λαλήσει
  choice: أنه سيتولى بنفسه الكلام عما يخصه
  alternative: أنه يستطيع أن يتكلم عن نفسه
  rationale: أُبقي المستقبل ظاهرًا في المتن، مع الحفاظ على التوكيد والسياق الشبيه بالاستجواب، ووُضّحت في الحاشية إمكانية فهم المستقبل كتقرير عملي للقدرة أو المسؤولية.
translation_notes:
  register: لغة عربية فصحى حديثة واضحة ووقورة. حُفظ تكرار «فلا نعلم» وبنية السؤالين، واستُعمل «سنّ الرشد» لتوضيح الدلالة الاجتماعية والسياقية لعبارة العمر من غير إدخال تحديد قانوني غير مذكور.
