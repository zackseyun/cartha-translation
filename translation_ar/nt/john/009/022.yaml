  text: ταῦτα εἶπαν οἱ γονεῖς αὐτοῦ ὅτι ἐφοβοῦντο τοὺς Ἰουδαίους, ἤδη γὰρ συνετέθειντο οἱ Ἰουδαῖοι ἵνα ἐάν τις αὐτὸν ὁμολογήσῃ χριστόν, ἀποσυνάγωγος γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/022.yaml
  text: His parents said these things because they were afraid of the Jews[a], for the Jews had already agreed that if anyone confessed him as the Messiah[b], he would be put out of the synagogue.
translation:
  language: ar
  text: قال أبواه هذه الأمور لأنهما كانا يخافان اليهود[a]، إذ كان اليهود قد اتفقوا من قبل على أن يُطرَد من المجمع كل من يعترف بأنه المسيح[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «اليهود». ويُرجَّح أن المقصود في هذا السياق السلطات اليهودية، لا عموم الشعب اليهودي بلا تمييز.'
    reason: cultural_note
  - marker: b
    text: 'أي: يعترف بأنه «المسيح المنتظر»، أو يقرّ بأنه المسيح.'
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα εἶπαν οἱ γονεῖς αὐτοῦ
  choice: قال أبواه هذا
  rationale: يؤدي المعنى الإشاري لما سبق بصياغة عربية طبيعية، ويعبّر «أبواه» بإيجاز عن الوالدين.
- source_word: ἐφοβοῦντο
  choice: كانا يخافان
  rationale: يحفظ دلالة الماضي الناقص على خوف مستمر في ذلك الموقف، مع مطابقة المثنى العربي.
- source_word: τοὺς Ἰουδαίους / οἱ Ἰουδαῖοι
  choice: اليهود
  rationale: يحافظ على اللفظ العام في اليونانية، مع بيان المرجع السياقي المحتمل في الحاشية تفاديًا للتعميم.
- source_word: ἤδη γὰρ συνετέθειντο
  choice: إذ كان ... قد اتفقوا من قبل
  rationale: ينقل التعليل وسبق الاتفاق، ويؤدي دلالة صيغة الماضي الأسبق دون الإيحاء بالضرورة بوجود مؤامرة.
- source_word: ἐάν τις αὐτὸν ὁμολογήσῃ χριστόν
  choice: كل من يعترف بأنه المسيح
  rationale: صياغة عربية واضحة تفيد الإقرار العلني به بصفته المسيح المنتظر.
- source_word: ἀποσυνάγωγος γένηται
  choice: يُطرَد من المجمع
  rationale: ينقل الأثر العملي للتعبير، أي الإقصاء من جماعة المجمع وحرمان المشاركة فيه.
theological_decisions:
- issue: ترجمة χριστόν
  choice: المسيح
  alternative: المسيح المنتظر؛ الكريستوس
  rationale: اللفظ هنا لقب يدل على الممسوح المنتظر، و«المسيح» هو المقابل العربي المألوف والدقيق؛ وتوضح الحاشية إمكان إبراز معنى اللقب.
- issue: مرجع οἱ Ἰουδαῖοι في سياق يوحنا
  choice: اليهود، مع حاشية سياقية
  alternative: رؤساء اليهود؛ السلطات اليهودية
  rationale: يبقى المتن قريبًا من عموم اللفظ اليوناني، فيما توضح الحاشية أن السياق يرجح أصحاب السلطة القادرين على الطرد من المجمع، لا اليهود بلا تمييز.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدم «المجمع» للمؤسسة اليهودية المحلية، و«يُطرَد» لإظهار معنى الإقصاء بعبارة مفهومة للقارئ المعاصر.
