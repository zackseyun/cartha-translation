  text: So they said to him[a], “How were your eyes opened?”
translation:
  language: ar
  text: 'فكانوا يقولون له: «كيف فُتحت عيناك؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: فكانوا يقولون
  rationale: الفعل ماضٍ ناقص، وصيغة «فكانوا يقولون» تنقل طابعه الاستمراري أو التكراري في السرد مع بقاء العربية طبيعية.
- source_word: οὖν
  choice: فـ
  rationale: الفاء تصل السؤال بما سبقه، وتنقل هنا معنى الاستمرار السردي والنتيجة على نحو موجز وطبيعي.
- source_word: αὐτῷ
  choice: له
  rationale: ترجمة مباشرة للمجرور الدال على مَن وُجِّه إليه الكلام.
- source_word: Πῶς
  choice: كيف
  rationale: المقابل العربي الطبيعي لأداة الاستفهام عن الكيفية.
- source_word: ἠνεῴχθησάν
  choice: فُتحت
  rationale: تحافظ صيغة المبني للمجهول على المبني للمجهول في اليونانية، من غير تعيين الفاعل الذي لم يذكره النص.
- source_word: σου οἱ ὀφθαλμοί
  choice: عيناك
  rationale: المثنى المضاف إلى ضمير المخاطب هو التعبير العربي الطبيعي والدقيق عن «عيناك»، ويغني عن نقل أداة التعريف اليونانية حرفيًا.
theological_decisions:
- issue: الفاعل الضمني في فتح العينين
  choice: 'الإبقاء على المبني للمجهول: «فُتحت عيناك»'
  alternative: «مَن فتح عينيك؟» أو «كيف أبصرت؟»
  rationale: لا يصرّح النص اليوناني بالفاعل، كما أن السؤال يتناول الكيفية؛ لذلك لا ينبغي إدخال فاعل أو تحويل المعنى إلى مجرد الإبصار.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُخدمت «فكانوا يقولون» لإظهار جانب الفعل الناقص، و«عيناك» للمثنى الطبيعي، مع الحفاظ على صيغة المبني للمجهول.
