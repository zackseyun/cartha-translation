  text: ⸀Ἤκουσεν Ἰησοῦς ὅτι ἐξέβαλον αὐτὸν ἔξω, καὶ εὑρὼν αὐτὸν ⸀εἶπεν· Σὺ πιστεύεις εἰς τὸν υἱὸν τοῦ ⸀ἀνθρώπου;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/035.yaml
  text: Jesus heard that they had thrown him out[a], and when he found him, he said, “Do you believe in the Son of Man?”
translation:
  language: ar
  text: 'وسمع يسوع أنهم طردوه خارجًا، ولما وجده قال له: «أأنت تؤمن بابن الإنسان؟»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ بعض المخطوطات: «ابن الله» بدلًا من «ابن الإنسان».'
    reason: textual_variant
lexical_decisions:
- source_word: ἐξέβαλον αὐτὸν ἔξω
  choice: طردوه خارجًا
  rationale: يفيد اقتران ἐκβάλλω بـἔξω الطرد الصريح والمؤكد، وتعبير «طردوه خارجًا» طبيعي وواضح ويحفظ قوة الأصل وسياق الإقصاء.
- source_word: εὑρὼν αὐτὸν
  choice: ولما وجده
  rationale: يحمل اسم الفاعل الأوريستي هنا دلالة زمنية، و«لما وجده» تنقل تعاقب الحدثين بلغة عربية طبيعية.
- source_word: Σὺ πιστεύεις
  choice: أأنت تؤمن
  rationale: يحفظ تقديم الضمير الصريح Σὺ نبرة التركيز في السؤال، فيما تنقل «تؤمن» المعنى المعتاد للفعل πιστεύω.
- source_word: πιστεύεις εἰς
  choice: تؤمن بـ
  rationale: تعبير «آمن بـ» هو المقابل العربي المألوف للتركيب الذي يدل على إيمان شخصي موجَّه نحو شخص.
- source_word: υἱὸν τοῦ ἀνθρώπου
  choice: ابن الإنسان
  rationale: هذا هو اللقب العربي الراسخ والدقيق، ويحفظ صداه الكتابي، ولا سيما صلته بدانيال 7 واستعماله في يوحنا.
theological_decisions:
- issue: قراءة اللقب المسيحاني في السؤال
  choice: ابن الإنسان
  alternative: ابن الله
  rationale: 'يتبع المتن قراءة SBLGNT: ἀνθρώπου، مع إثبات القراءة النصية المهمة «ابن الله» في الحاشية دون ترجيح لاهوتي صامت.'
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدم «أأنت» لإبراز الضمير اليوناني الصريح، ووُضعت علامة الحاشية بعد السؤال لأنها تتعلق بلقب «ابن الإنسان».
