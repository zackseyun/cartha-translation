base_translation:
  language: en
  yaml_path: translation/nt/john/009/009.yaml
  text: Some were saying[a], “This is he.” Others were saying, “No, but he is like him.” He kept saying, “I am he.”
translation:
  language: ar
  text: 'وكان بعضهم يقول: «هذا هو». وكان آخرون يقولون: «لا، بل يشبهه». أما هو فظل يقول: «أنا هو».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بحرفية أكثر: «أنا». والمعنى هنا هو التعريف العادي بالنفس؛ فالرجل يقول إنه الشخص الذي يتحدثون عنه.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλοι ... ἄλλοι
  choice: بعضهم ... وآخرون
  rationale: استُعمل اللفظ توزيعيًا للمقابلة بين جماعتين؛ وهذه الصياغة عربية طبيعية تحفظ التقابل.
- source_word: ἔλεγον
  choice: كان ... يقولون / يقولون
  rationale: صيغة الماضي الناقص تصوّر قولًا جاريًا أو متكررًا في أثناء الجدال، وقد نُقل ذلك بصيغة «كان يقولون» مع استمرار المشهد في الجملة التالية.
- source_word: Οὗτός ἐστιν
  choice: هذا هو
  rationale: يحفظ الإيجاز والإشارة المباشرة في اليونانية من غير إضافة اسم غير مصرح به.
- source_word: Οὐχί, ἀλλὰ
  choice: لا، بل
  rationale: «لا» تنقل النفي المؤكد بوضوح، و«بل» أداة الاستدراك العربية الطبيعية التي تستبدل دعوى الشبه بدعوى الهوية.
- source_word: ὅμοιος αὐτῷ ἐστιν
  choice: يشبهه
  rationale: تعبير عربي واضح وطبيعي يفيد التشابه دون التطابق.
- source_word: ἐκεῖνος ἔλεγεν
  choice: أما هو فظل يقول
  rationale: «أما هو» تميّزه عن الجماعتين، و«ظل يقول» تنقل دلالة الاستمرار أو التكرار في الماضي الناقص.
- source_word: Ἐγώ εἰμι
  choice: أنا هو
  rationale: يحافظ على صورة العبارة اليونانية ويؤدي في السياق معنى تعريف الرجل بنفسه بوصفه الشخص موضع النقاش، مع بيان ذلك في الحاشية.
theological_decisions:
- issue: دلالة Ἐγώ εἰμι في السياق اليوحناوي
  choice: أنا هو
  alternative: أنا / إنني أنا المقصود
  rationale: السياق المباشر هو خلاف بشأن هوية الرجل الذي كان أعمى، ولذلك تفيد العبارة هنا التعريف العادي بالنفس. أُبقيت الصيغة الموجزة «أنا هو» بدل تحميلها دلالة لاهوتية لا يقتضيها المقام، مع توضيح المعنى في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة سردية وقورة. حُفظ تكرار القول في المشهد، واستُعملت علامات الاقتباس للحوار المباشر بدل ترجمة ὅτι بأداة صريحة.
