source:
  edition: SBLGNT
  text: ἀπεκρίθη ὁ ἄνθρωπος καὶ εἶπεν αὐτοῖς· Ἐν ⸂τούτῳ γὰρ τὸ⸃ θαυμαστόν ἐστιν ὅτι ὑμεῖς οὐκ οἴδατε πόθεν ἐστίν, καὶ ἤνοιξέν μου τοὺς ὀφθαλμούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/030.yaml
  text: 'The man answered and said to them[a], “This is the remarkable thing: you do not know where he is from[b], and yet he opened my eyes.”'
translation:
  language: ar
  text: 'فأجاب الرجل وقال لهم: «إن العجيب في الأمر هو أنكم لا تعرفون من أين هو[a]، ومع ذلك فتح عينيَّ».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «من أين أتى».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη ὁ ἄνθρωπος καὶ εἶπεν αὐτοῖς
  choice: فأجاب الرجل وقال لهم
  rationale: صياغة قريبة من البنية اليونانية وتحافظ على أسلوب الحوار السردي، وهي طبيعية وفصيحة بالعربية.
- source_word: Ἐν τούτῳ γὰρ τὸ θαυμαστόν ἐστιν
  choice: إن العجيب في الأمر هو
  rationale: تنقل التركيب الاصطلاحي بوضوح، وتُظهر قوة γάρ التفسيرية بنبرة التعجب من غير تكلف.
- source_word: ὑμεῖς οὐκ οἴδατε
  choice: أنكم لا تعرفون
  rationale: يحافظ ضمير المخاطبين الظاهر على التوكيد الموجود في اليونانية، و«تعرفون» تدل على عدم العلم لا مجرد سوء الفهم.
- source_word: πόθεν ἐστίν
  choice: من أين هو
  rationale: تعبير عربي موجز وطبيعي يحفظ غموض السؤال عن منشئه أو مصدره، من غير تفسير زائد.
- source_word: καὶ
  choice: ومع ذلك
  rationale: يُبرز القوة الاستدراكية الساخرة التي تحملها الواو في السياق، إذ يقابل جهلهم بأصل يسوع حقيقة الشفاء.
- source_word: ἤνοιξέν μου τοὺς ὀφθαλμούς
  choice: فتح عينيَّ
  rationale: ترجمة مباشرة وطبيعية تشير أولًا إلى الشفاء الجسدي، مع إبقاء صدى البصر الروحي متاحًا في سياق الإنجيل.
theological_decisions:
- issue: الصدى المجازي لعبارة «فتح عينيَّ» في سياق يوحنا
  choice: الإبقاء على تعبير الشفاء الحرفي دون التصريح بالاستنارة الروحية
  alternative: صياغة تُبرز معنى الاستنارة الروحية
  rationale: المرجع المباشر هو شفاء عيني الرجل جسديًا، أما الدلالة الروحية الأوسع فينبغي أن تنشأ من السياق بدل إدخالها صراحة في الترجمة.
- issue: دلالة πόθεν ἐστίν على أصل يسوع
  choice: من أين هو
  alternative: من أين أتى
  rationale: الصياغة المختارة تحفظ اتساع العبارة اليونانية وإمكان توترها اليوحناوي بشأن منشأ يسوع، ولا تحصرها في مكان جغرافي أو حركة مجيء.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة، مع الحفاظ على نبرة الرجل الواثقة والساخرة ضمنًا. وُضع مؤشر الحاشية [a] في المتن كما هو مطلوب.
