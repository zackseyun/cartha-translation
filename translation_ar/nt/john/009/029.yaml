  text: ἡμεῖς οἴδαμεν ὅτι Μωϋσεῖ λελάληκεν ὁ θεός, τοῦτον δὲ οὐκ οἴδαμεν πόθεν ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/029.yaml
  text: We know that God has spoken to Moses[a], but as for this man, we do not know where he is from.
translation:
  language: ar
  text: نحن نعلم أن الله قد كلَّم موسى، أمّا هذا الرجل فلا نعلم من أين هو.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «من أين أتى». قد تحمل الأسئلة عن أصل يسوع في إنجيل يوحنا دلالة عادية ودلالة لاهوتية أعمق معًا.'
    reason: بيان البديل اللفظي والحفاظ على تعدد الدلالة في سياق يوحنا.
lexical_decisions:
- source_word: ἡμεῖς
  choice: نحن
  rationale: إثبات الضمير المنفصل يحفظ ما في اليونانية من توكيد ومقابلة، وهو طبيعي في هذا السياق العربي.
- source_word: οἴδαμεν
  choice: نعلم
  rationale: يفيد الفعل هنا المعرفة واليقين، وتكرار «نعلم» في شطري الآية يحافظ على البنية المتقابلة.
- source_word: Μωϋσεῖ
  choice: موسى
  rationale: الصيغة العربية المعيارية المستقرة للاسم العلم.
- source_word: λελάληκεν
  choice: قد كلَّم
  rationale: «كلَّم» يؤدي معنى مخاطبة الله لموسى، و«قد» تبرز وقوع الكلام بوصفه حقيقة ثابتة ذات أثر باقٍ، من غير إثقال العبارة.
- source_word: ὁ θεός
  choice: الله
  rationale: المقابل العربي المعياري للاسم في هذا السياق.
- source_word: τοῦτον
  choice: هذا الرجل
  rationale: يحيل اسم الإشارة إلى يسوع بنبرة تباعد، و«هذا الرجل» أوضح وأطبع عربيًا من «هذا» وحدها مع الحفاظ على تلك النبرة.
- source_word: δὲ
  choice: أمّا
  rationale: تُظهر التحول إلى موضوع مقابل، وتؤدي معنى «أما هذا الرجل» بصورة عربية طبيعية.
- source_word: οὐκ οἴδαμεν
  choice: فلا نعلم
  rationale: يحفظ النفي وتكرار فعل المعرفة، وتربط الفاء جواب «أمّا» في أسلوب عربي سليم.
- source_word: πόθεν ἐστίν
  choice: من أين هو
  rationale: صياغة موجزة تحافظ على غموض الأصل أو المصدر، فلا تحصر السؤال في الموطن الجغرافي ولا تفسره صراحةً بوصفه أصلًا إلهيًا.
theological_decisions:
- issue: دلالة أصل يسوع في πόθεν ἐστίν
  choice: من أين هو
  alternative: من أين أتى
  rationale: تحافظ الصياغة المختارة على إمكان المعنى العادي المتعلق بالمنشأ وعلى الإيحاء الأعمق المتكرر في إنجيل يوحنا بشأن أصل يسوع وسلطانه، من غير حسم التوتر اللاهوتي لصالح تفسير واحد.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدمت المقابلة «نحن نعلم... أمّا... فلا نعلم» لإبراز حدة ادعاء المتكلمين، مع تجنب الألفاظ المذهبية أو التفسير الزائد.
