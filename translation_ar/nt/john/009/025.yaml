  text: ἀπεκρίθη οὖν ⸀ἐκεῖνος· Εἰ ἁμαρτωλός ἐστιν οὐκ οἶδα· ἓν οἶδα ὅτι τυφλὸς ὢν ἄρτι βλέπω.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/025.yaml
  text: 'So that man answered[a], “Whether he is a sinner, I do not know. One thing I do know: though I was blind, now I see.”'
translation:
  language: ar
  text: 'فأجاب ذاك الرجل: «هل هو خاطئ أم لا، لا أعلم[a]. إنما أعلم شيئًا واحدًا: كنت أعمى، والآن أبصر».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إن كان خاطئًا، فلا أعلم».'
    reason: تحفظ المعنى الشرطي الممكن للأداة اليونانية εἰ، إلى جانب فهمها بوصفها مدخلةً لاستفهام غير مباشر.
lexical_decisions:
- source_word: ἀπεκρίθη οὖν
  choice: فأجاب
  rationale: ينقل فعل الإجابة مع أداة الربط الاستنتاجية/الاستمرارية οὖν بصياغة عربية سردية طبيعية؛ فالفاء تصل الجواب بما سبقه دون تثقيل الأسلوب.
- source_word: ἐκεῖνος
  choice: ذاك الرجل
  rationale: يحافظ على قوة اسم الإشارة الصريح، ويحدد المقصود طبيعيًا في العربية بأنه الرجل الذي كان أعمى.
- source_word: Εἰ ἁμαρτωλός ἐστιν
  choice: هل هو خاطئ أم لا
  rationale: تأتي εἰ هنا في استفهام غير مباشر متعلق بفعل المعرفة، فـ«هل... أم لا» أوضح في العربية من صيغة شرط قد توهم تعليق الجواب على تحقق الشرط.
- source_word: οὐκ οἶδα
  choice: لا أعلم
  rationale: صياغة فصيحة مباشرة تنقل معنى الفعل ذي الصيغة التامة والدلالة الحاضرة هنا.
- source_word: ἓν οἶδα
  choice: إنما أعلم شيئًا واحدًا
  rationale: تفيد «إنما» القصر والتوكيد، وتبرز المقابلة البلاغية بين ما لا يعلمه وما يعلمه يقينًا.
- source_word: τυφλὸς ὢν
  choice: كنت أعمى
  rationale: ينقل العبارة الحالية الظرفية باعتبارها وصفًا لحالته السابقة، في مقابل حالته الراهنة، من غير افتعال علاقة سببية.
- source_word: ἄρτι βλέπω
  choice: والآن أبصر
  rationale: يحفظ التقابل الزمني القوي بين العمى السابق والإبصار الحاضر، مع إبقاء الفعل بسيطًا ومباشرًا.
theological_decisions:
- issue: عرض قول الرجل عن كون يسوع خاطئًا من غير تحويل محدودية معرفته إلى حكم لاهوتي من الراوي
  choice: هل هو خاطئ أم لا، لا أعلم
  alternative: إن كان خاطئًا، فلا أعلم
  rationale: تُبقي الصياغة الحكم ضمن منظور المتكلم المحدود، وتحفظ كونه لا يفصل في اتهام الخصوم، من غير أن توحي بأن الراوي يقر بإمكان خطيئة يسوع أو ينفيها في هذا الموضع.
translation_notes:
  register: عربية فصحى حديثة واضحة وذات نبرة كريمة. استُعملت الفاء للربط السردي، و«ذاك الرجل» لإبراز اسم الإشارة، و«إنما» لإظهار التوكيد والمقابلة في الشهادة.
