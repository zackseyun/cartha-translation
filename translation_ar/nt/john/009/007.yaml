source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ· Ὕπαγε νίψαι εἰς τὴν κολυμβήθραν τοῦ Σιλωάμ (ὃ ἑρμηνεύεται Ἀπεσταλμένος). ἀπῆλθεν οὖν καὶ ἐνίψατο, καὶ ἦλθεν βλέπων.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/007.yaml
  text: And he said to him[a], “Go, wash in the pool of Siloam” (which is translated “Sent”). So he went and washed, and came back seeing.
translation:
  language: ar
  text: 'وقال له: «اذهب فاغسل عينيك في بركة سلوام» (الذي يُترجَم: «مُرسَل»)[a]. فذهب وغسل عينيه، وعاد وهو يُبصر.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الذي يعني: مُرسَل».'
    reason: بديل عربي طبيعي للفعل ἑρμηνεύεται؛ والصياغة في المتن «يُترجَم» أقرب إلى الطابع التفسيري اللغوي في اليونانية.
lexical_decisions:
- source_word: Ὕπαγε
  choice: اذهب
  rationale: فعل أمر مباشر بالحركة، و«اذهب» أفصح تعبير عربي طبيعي من غير إضافة معنى غير مصرّح به.
- source_word: νίψαι / ἐνίψατο
  choice: اغتسل / اغتسل
  rationale: ينص الفعل على الغسل، وغالبًا غسل جزء من الجسد لا الاستحمام الكامل. واستُعمل «اغتسل» هنا لتأدية المعنى الانعكاسي بصورة عربية طبيعية، من غير تعيين العضو الذي غسله لأن اليونانية لا تعيّنه صراحة.
- source_word: εἰς τὴν κολυμβήθραν
  choice: في بركة
  rationale: تدل κολυμβήθρα على بركة أو حوض ماء، ومع فعل الغسل يكون حرف الجر «في» طبيعيًا في العربية ولا يوحي بضرورة دخوله بكامل جسده إلى الماء.
- source_word: Σιλωάμ
  choice: سِلْوام
  rationale: نقل صوتي للاسم كما يرد في النص اليوناني، مع ضبطه لتيسير النطق.
- source_word: ὃ ἑρμηνεύεται Ἀπεσταλμένος
  choice: 'واسم «سِلْوام» يُترجم: «مُرسَل»'
  rationale: يحفظ العبارة بوصفها شرحًا لغويًا صريحًا للاسم، وتؤدي «مُرسَل» اسم المفعول اليوناني من غير توسيع رمزي.
- source_word: οὖν
  choice: فـ
  rationale: الفاء تفيد النتيجة والتتابع السردي بإيجاز طبيعي، وهو الأنسب لوظيفة οὖν هنا.
- source_word: ἀπῆλθεν
  choice: ذهب
  rationale: تعبير سردي عربي مباشر عن انصرافه لتنفيذ الأمر.
- source_word: ἦλθεν βλέπων
  choice: أتى وهو يُبصر
  rationale: يحافظ على فعل المجيء وعلى التركيب الحالي الذي يصفه مبصرًا عند مجيئه، من غير إضافة «عاد» التي يفهمها السياق لكنها ليست صريحة في الفعل اليوناني.
theological_decisions:
- issue: صياغة شرح اسم سِلْوام من غير تحميله رمزية يوحناوية زائدة
  choice: 'إبقاء الشرح بين قوسين في المتن: «واسم سِلْوام يُترجم: مُرسَل»'
  alternative: توسيع العبارة لربط «مُرسَل» صراحة بيسوع بوصفه المرسَل من الآب
  rationale: الشرح وارد في اليونانية ولذلك يُحفظ في المتن، لكن النص لا يصرّح هنا بتفسير رمزي محدد، فلا ينبغي للترجمة أن تحسمه أو توسعه.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. حُفظ الإيجاز السردي وتسلسل الأفعال، ووُضع الشرح الاسمي بين قوسين كما في المصدر، مع تجنب تفسير رمزي زائد.
