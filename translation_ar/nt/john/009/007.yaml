  to: 'وقال له: «اذهب فاغسل عينيك في بركة سلوام» (الذي يُترجَم: «مُرسَل»)[a]. فذهب وغسل عينيه، وعاد وهو يُبصر.'
  rationale: عُدّل فعل الغسل لتفادي إيحاء الاستحمام الكامل، ولإظهار المفعول المفهوم من السياق القريب، أي العينين اللتين وُضع عليهما الطين. وحُسّنت صياغة الشرح الاسمي، واستُخدم «عاد» لتأدية دلالة رجوع الرجل في سياق ذهابه إلى البركة ثم مجيئه مبصرًا. لم يُضف أي تفسير رمزي لعبارة «مُرسَل».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:22:28Z'
