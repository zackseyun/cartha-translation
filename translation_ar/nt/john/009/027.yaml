base_translation:
  language: en
  yaml_path: translation/nt/john/009/027.yaml
  text: He answered them[a], “I already told you, and you did not listen. Why do you want to hear it again? You do not also want to become his disciples[b], do you?”
translation:
  language: ar
  text: 'فأجابهم: «سبق أن قلت لكم، فلم تسمعوا[a]. فلماذا تريدون أن تسمعوا ذلك مرة أخرى؟ لا تريدون أنتم أيضًا أن تصيروا تلاميذ له، أليس كذلك؟[b]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «فلم تُصغوا». فالفعل اليوناني قد يعني السماع أو الإصغاء؛ والسياق يوحي هنا بعدم قبول ما قيل أو عدم الاكتراث به.'
    reason: lexical_alternative
  - marker: b
    text: 'يفيد السؤال المنفي في اليونانية توقُّع جواب بالنفي، أي بمعنى ساخر قريب من: «لا تريدون أنتم أيضًا أن تصيروا تلاميذ له، أليس كذلك؟»'
    reason: grammatical_rhetorical_force
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: فأجابهم
  rationale: صيغة سردية عربية طبيعية تحفظ معنى فعل الإجابة، مع إظهار ضمير المفعول الوارد في αὐτοῖς.
- source_word: ἤδη
  choice: سبق أن
  rationale: تؤدي معنى وقوع القول قبل هذه اللحظة، وتنسجم طبيعيًا مع «قلت لكم» في العربية المعاصرة.
- source_word: οὐκ ἠκούσατε
  choice: فلم تسمعوا
  rationale: تحفظ المقابلة اللفظية مع ἀκούειν في الجملة التالية، كما أن «سمع» قد يدل سياقيًا على الإصغاء والاستجابة، مع بيان الاحتمال في الحاشية.
- source_word: τί πάλιν θέλετε ἀκούειν
  choice: فلماذا تريدون أن تسمعوا ذلك مرة أخرى؟
  rationale: فُهم τί هنا على وجه سببي يفيد الاستنكار، وأضيف «ذلك» لأن مفعول السماع مفهوم من السياق ويلزم إظهاره لسلامة العربية.
- source_word: μὴ καὶ ὑμεῖς
  choice: ألعلّكم أنتم أيضًا
  rationale: تنقل «لعلّ» الاحتمال الاستنكاري الساخر بصورة طبيعية، بينما تُبرز «أنتم أيضًا» معنى καὶ ὑμεῖς؛ وتوضح الحاشية أن μή تتوقع جوابًا بالنفي.
- source_word: αὐτοῦ μαθηταὶ
  choice: تلاميذ له
  rationale: تركيب عربي واضح يحفظ مرجع الضمير من غير إضافة تفسيرية.
- source_word: γενέσθαι
  choice: أن تصيروا
  rationale: يحفظ المعنى الدال على الانتقال إلى حالة التلمذة، لا مجرد الاتصاف بها.
theological_decisions:
- issue: القوة البلاغية للسؤال الأخير
  choice: 'سؤال ساخر يُصاغ: «ألعلّكم أنتم أيضًا تريدون أن تصيروا تلاميذ له؟»'
  alternative: «هل تريدون أنتم أيضًا أن تصيروا تلاميذ له؟» أو «لستم تريدون أن تصيروا تلاميذ له أيضًا، أليس كذلك؟»
  rationale: تدل μή في هذا السؤال على توقع جواب بالنفي. وتحفظ صيغة «ألعلّكم» نبرة الاستنكار والسخرية من غير تركيب عربي ثقيل، مع توضيح التوقع النحوي في الحاشية.
translation_notes:
  register: لغة عربية فصحى معاصرة، واضحة وكريمة النبرة. حُفظ تكرار فعل السماع في الجملتين لصلته اللفظية في الأصل، واستُخدمت صيغة استفهام طبيعية تنقل السخرية مع شرح دلالتها النحوية في الحاشية.
