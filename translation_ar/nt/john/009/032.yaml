  yaml_path: translation/nt/john/009/032.yaml
  text: From of old it has never been heard that anyone opened the eyes of one born blind[a].
translation:
  language: ar
  text: منذ القِدَم، لم يُسمَع قط أن أحدًا فتح عيني مَن وُلِد أعمى.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «منذ بدء العالم لم يُسمَع قط…»'
    reason: بديل معجمي لعبارة ἐκ τοῦ αἰῶνος يحفظ الفهم التقليدي الأوسع لنطاقها الزمني.
lexical_decisions:
- source_word: ἐκ τοῦ αἰῶνος
  choice: منذ القِدَم
  rationale: تعبير زمني اصطلاحي يشير إلى امتداد التاريخ المعروف؛ و«منذ القِدَم» يحفظ دلالته التاريخية من غير أن يحمّله معنى ميتافيزيقيًا مثل «منذ الأزل».
- source_word: οὐκ ἠκούσθη
  choice: لم يُسمَع قط
  rationale: يحافظ على صيغة المبني للمجهول وعلى معنى انعدام أي سابقة معروفة، وهو تعبير عربي طبيعي واضح.
- source_word: ὅτι
  choice: أن
  rationale: تُدخل مضمون الأمر الذي لم يُسمع به، وهي المقابل العربي المباشر والطبيعي.
- source_word: ἠνέῳξέν
  choice: فتح
  rationale: ينقل المعنى المعجمي المباشر للفعل مع العينين، من غير تفسير زائد مثل «ردّ البصر».
- source_word: τις
  choice: أحدًا
  rationale: تلائم السياق المنفي العام، وتعبّر طبيعيًا عن الفاعل غير المعيّن.
- source_word: ὀφθαλμοὺς
  choice: عيني
  rationale: جاءت بالمثنى المضاف لأن اليونانية تشير إلى عيني الشخص المولود أعمى، وهذا هو التعبير العربي الأفصح والأطبع.
- source_word: τυφλοῦ γεγεννημένου
  choice: مولودٍ أعمى
  rationale: ينقل بإيجاز أن الشخص كان أعمى منذ ولادته، من غير إضافة اسم مثل «رجل» غير مصرّح به في العبارة اليونانية.
theological_decisions:
- issue: النطاق الزمني لعبارة ἐκ τοῦ αἰῶνος
  choice: منذ القِدَم، أي طوال التاريخ المعروف أو الذاكرة البشرية
  alternative: منذ بدء العالم؛ منذ الأزل
  rationale: القول هنا عن سابقة في الخبرة البشرية، لا تقرير ميتافيزيقي عن الأزل. وتحفظ الصياغة قوة الادعاء من غير تضييق العبارة أو المبالغة فيها.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «لم يُسمَع قط» لصون المبني للمجهول والقوة البلاغية، و«مولودٍ أعمى» لصياغة موجزة طبيعية لا تضيف تحديدًا غير موجود في الأصل.
