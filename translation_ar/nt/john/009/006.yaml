    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα εἰπὼν
  choice: وبعدما قال هذا
  rationale: اسم الإشارة المحايد الجمع في اليونانية يحيل إلى الكلام السابق، وصيغة اسم الفاعل الماضي تدل هنا على فعل سبق الأفعال الرئيسة؛ فتنقل «بعدما» هذا التتابع بلغة عربية طبيعية.
- source_word: ἔπτυσεν χαμαί
  choice: تفل على الأرض
  rationale: ينقل الفعل الحسي المباشر ومعنى χαμαί، أي على الأرض أو إليها، بعبارة عربية واضحة.
- source_word: ἐποίησεν πηλὸν ἐκ τοῦ πτύσματος
  choice: صنع من لعابه طينًا
  rationale: πηλός يدل على الطين أو التراب المبتل، وπτύσμα على البصاق أو اللعاب. واختيار «لعابه» واضح ومعاصر، مع إبقاء دلالة ἐκ على المادة التي صُنع منها الطين.
- source_word: ἐπέχρισεν
  choice: طلى
  rationale: يفيد الفعل اليوناني دهن مادة أو بسطها على سطح، و«طلى» يلائم وضع الطين على العينين من غير أن يفرض إيحاءً طقسيًا.
- source_word: αὐτοῦ τὸν πηλὸν ἐπὶ τοὺς ὀφθαλμούς
  choice: عينيه بالطين
  rationale: الضمير يعود طبيعيًا إلى الرجل الأعمى في السياق، والتعبير العربي بالباء بعد «طلى» ينقل وضع الطين على العينين، مع تعريف «الطين» للإحالة إلى الطين المذكور آنفًا.
theological_decisions:
- issue: احتمال الإيحاء الطقسي في ἐπέχρισεν
  choice: طلى عينيه بالطين
  alternative: دهن عينيه بالطين
  rationale: قد يُستعمل الفعل بمعنى الدهن أو المسح، لكنه في هذا السياق يصف تطبيق الطين تطبيقًا حسيًا. لذلك اختير فعل واضح غير طقسي في المتن، مع حفظ البديل المعجمي في الحاشية دون تقرير دلالة رمزية لا يصرح بها النص.
translation_notes:
  register: عربية فصحى حديثة، واضحة وموقرة. حافظت الصياغة على ترتيب الأفعال وعلى الطبيعة الحسية للمشهد، وتجنبت الألفاظ الطقسية التي قد تضيف إلى النص دلالة غير مصرّح بها.
