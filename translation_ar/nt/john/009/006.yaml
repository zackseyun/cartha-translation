  text: After saying these things[a], he spit on the ground and made mud from the saliva, and he spread the mud on his eyes,
translation:
  language: ar
  text: وبعد أن قال هذه الأمور، تفل على الأرض، وصنع من لعابه طينًا، وطلى عينيه بالطين[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
