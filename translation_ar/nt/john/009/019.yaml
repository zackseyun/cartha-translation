  yaml_path: translation/nt/john/009/019.yaml
  text: And they asked them, saying, “Is this your son, whom you say was born blind? How then does he now see?”
translation:
  language: ar
  text: 'وسألوهما قائلين: «أهذا ابنكما الذي تقولان إنه وُلِد أعمى؟ فكيف يبصر الآن؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠρώτησαν αὐτοὺς
  choice: وسألوهما
  rationale: الفعل يدل على توجيه سؤال، والضمير يعود إلى والدي الرجل، لذا صيغ بالمثنى في العربية.
- source_word: λέγοντες
  choice: قائلين
  rationale: يحفظ صيغة اسم الفاعل التي تقدّم الكلام المباشر، وهي فصيحة وطبيعية في السرد الكتابي العربي.
- source_word: Οὗτός ἐστιν ὁ υἱὸς ὑμῶν
  choice: أهذا ابنكما
  rationale: العبارة خبرية في صورتها اليونانية لكنها تؤدي وظيفة السؤال في السياق؛ وهم يخاطبون والدين اثنين، لذلك استُعمل ضمير المثنى.
- source_word: ὃν ὑμεῖς λέγετε
  choice: الذي تقولان
  rationale: اختير فعل محايد لا يضيف معنى الشك أو الاتهام، مع إظهار المخاطب المثنى الذي يعبّر عنه الضمير اليوناني المؤكد بحسب السياق.
- source_word: τυφλὸς ἐγεννήθη
  choice: إنه وُلِد أعمى
  rationale: ينقل بوضوح أن العمى كان منذ الولادة، ويحافظ على المبني للمجهول في الأصل.
- source_word: πῶς οὖν
  choice: فكيف
  rationale: الفاء تنقل قوة الاستنتاج في οὖν وتربط السؤال بما سبق بصورة عربية طبيعية.
- source_word: βλέπει
  choice: يبصر
  rationale: المضارع يصف واقع الإبصار الحالي، من غير تحويله إلى مجرد قدرة ممكنة.
- source_word: ἄρτι
  choice: الآن
  rationale: يبين المقابلة بين العمى السابق والإبصار في الحاضر.
theological_decisions: []
