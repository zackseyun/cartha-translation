  text: πάλιν οὖν ἠρώτων αὐτὸν καὶ οἱ Φαρισαῖοι πῶς ἀνέβλεψεν. ὁ δὲ εἶπεν αὐτοῖς· Πηλὸν ἐπέθηκέν μου ἐπὶ τοὺς ὀφθαλμούς, καὶ ἐνιψάμην, καὶ βλέπω.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/015.yaml
  text: So the Pharisees also asked him again how he had received his sight[a]. He said to them, “He put mud on my eyes, and I washed[b], and I see.”
translation:
  language: ar
  text: 'فسأله الفريسيون أيضًا من جديد كيف أبصر[a]. فقال لهم: «وضع طينًا على عينيَّ، فغسلتُ، وأنا أبصر».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كيف عاد إليه بصره».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν οὖν
  choice: فعاد ... يسألونه
  rationale: تنقل «فعاد» استئناف السرد ومعنى تكرار السؤال بصورة عربية طبيعية، من غير تضخيم القوة الاستنتاجية التي قد توحي بها «لذلك».
- source_word: ἠρώτων
  choice: يسألونه
  rationale: صيغة المضارع بعد «عاد» تلائم دلالة الماضي الناقص اليوناني على استمرار السؤال أو تكراره.
- source_word: καὶ οἱ Φαρισαῖοι
  choice: الفريسيون أيضًا
  rationale: تحفظ «أيضًا» معنى καί الذي يُدخل الفريسيين ضمن من توالوا على السؤال.
- source_word: πῶς ἀνέβλεψεν
  choice: كيف أبصر
  rationale: «أبصر» تعبير عربي موجز وطبيعي عن نيل البصر في سياق شفاء المولود أعمى، مع إثبات البديل التفسيري في الحاشية.
- source_word: Πηλὸν
  choice: طينًا
  rationale: «طين» يقابل πηλός بوضوح، ويشمل في العربية مادة الوحل أو الطين القابل للتشكيل من غير حاجة إلى حسم أدق من الأصل.
- source_word: ἐπέθηκέν μου ἐπὶ τοὺς ὀφθαλμούς
  choice: وضع طينًا على عينيَّ
  rationale: صياغة عربية مباشرة تحفظ فعل الوضع والموضع المذكورين في اليونانية.
- source_word: ἐνιψάμην
  choice: فغسلتهما
  rationale: ضمير التثنية يعود طبيعيًا إلى العينين، وينقل فعل الغسل الأوسط بحسب السياق من غير الإيحاء باغتسال الجسد كله.
- source_word: βλέπω
  choice: وأنا أبصر الآن
  rationale: تحفظ العبارة زمن الحاضر والنتيجة القائمة بوضوح؛ و«الآن» تُظهر التباين بين العمى السابق والإبصار الحاضر من غير تغيير جوهر القول.
