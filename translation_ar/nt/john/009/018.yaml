  yaml_path: translation/nt/john/009/018.yaml
  text: So the Jews did not believe concerning him that he had been blind and had received sight[a], until they called the parents of the one who had received sight.
translation:
  language: ar
  text: فلم يصدّق اليهود[a] أنه كان أعمى وأنه أبصر، إلى أن استدعوا والدي الذي أبصر.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو ربما: «زعماء اليهود» أو «أهل اليهودية»، بحسب فهم استعمال يوحنا لعبارة «اليهود» في هذا السياق.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπίστευσαν
  choice: لم يصدّق
  rationale: الفعل هنا يتعدى إلى مضمون تقريري بواسطة ὅτι، فالمقصود عدم قبول الخبر على أنه صحيح، لا عدم الثقة الشخصية.
- source_word: οἱ Ἰουδαῖοι
  choice: اليهود
  rationale: يحافظ هذا على اللفظ اليوناني من دون تضييق مرجعه تفسيرياً، مع بيان الاحتمالات السياقية في الحاشية.
- source_word: περὶ αὐτοῦ
  choice: عنه
  rationale: ترجمة عربية طبيعية ودقيقة لحرف الجر περί مع المضاف إليه في هذا السياق.
- source_word: ἦν τυφλὸς
  choice: كان أعمى
  rationale: يحافظ على صيغة الماضي في اليونانية، ويُفهم سبق العمى للشفاء من السياق.
- source_word: ἀνέβλεψεν
  choice: أبصر
  rationale: يؤدي معنى نيل البصر في سياق الشفاء من غير أن يوحي بأنه كان مبصراً من قبل، كما قد يوحي تعبير «استعاد بصره».
- source_word: ἕως ὅτου
  choice: حتى
  rationale: أداة عربية طبيعية تحدد الغاية الزمنية كما يفعل التعبير اليوناني.
- source_word: ἐφώνησαν
  choice: استدعوا
  rationale: السياق سياق تحقيق وطلب حضور الوالدين، ولذلك ينقل «استدعوا» قوة الفعل هنا بوضوح.
- source_word: γονεῖς
  choice: أبوي
  rationale: صيغة المثنى المضافة في العربية تؤدي معنى الوالدين بإيجاز وطبيعية.
- source_word: τοῦ ἀναβλέψαντος
  choice: الذي أبصر
  rationale: يحافظ على قوة اسم الفاعل المعرّف في اليونانية من دون إضافة وصف غير مصرح به.
theological_decisions:
- issue: مرجع ودلالة οἱ Ἰουδαῖοι في إنجيل يوحنا
  choice: اليهود
  alternative: زعماء اليهود، أو أهل اليهودية
  rationale: النص اليوناني يذكر «اليهود» صراحة، بينما قد يدل التعبير بحسب السياق اليوحناوي على جماعة محددة من السلطات اليهودية أو على أهل اليهودية. تُحفظ العبارة في المتن ويُشار إلى الاحتمال السياقي في الحاشية، تجنباً لحسم الغموض تفسيرياً.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُعمل «ثم» لإبراز التعاقب المفهوم بين العمى والإبصار، مع إبقاء البنية موجزة وقريبة من الأصل.
