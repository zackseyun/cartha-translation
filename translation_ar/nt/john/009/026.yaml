  text: 'فقالوا له: «ماذا فعل بك؟ كيف فتح عينيك؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπον
  choice: فقالوا
  rationale: الفعل ماضٍ من λέγω ويدخل كلام الجماعة المباشر؛ «قالوا» أدق من تخصيصه بمعنى «سألوا»، مع أن صيغة الكلام استفهامية.
- source_word: οὖν
  choice: فـ
  rationale: تفيد الفاء استمرار السياق والنتيجة الخطابية بصورة عربية طبيعية، من غير جعل الرابط زمنيًا محضًا.
- source_word: αὐτῷ
  choice: له
  rationale: ترجمة طبيعية للمفعول غير المباشر، والضمير يعود إلى الرجل الذي كان أعمى.
- source_word: Τί
  choice: ماذا
  rationale: أداة استفهام مباشرة عن الفعل الواقع عليه.
- source_word: ἐποίησέν σοι
  choice: فعل بك
  rationale: تحافظ «بك» على احتمال معنى ما فعله به، ولا تضيف إيحاء المنفعة الذي قد تحمله «فعل لأجلك».
- source_word: πῶς
  choice: كيف
  rationale: تنقل الاستفهام عن الكيفية أو الوسيلة نقلًا مباشرًا.
- source_word: ἤνοιξέν
  choice: فتح
  rationale: ماضٍ معلوم يحافظ على الفاعل المفرد وعلى صورة فتح العينين.
- source_word: σου τοὺς ὀφθαλμούς
  choice: عينيك
  rationale: المثنى هو التعبير العربي الطبيعي الدقيق عن العينين، ويستوعب ضمير الملكية اليوناني.
