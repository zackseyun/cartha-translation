  yaml_path: translation/nt/john/009/040.yaml
  text: Some of the Pharisees who were with him heard these things and said to him[a], “Surely we are not blind too, are we?”
translation:
  language: ar
  text: 'فَسَمِعَ بعضٌ من الفريسيين الذين كانوا معه هذه الأمور، فقالوا له: «ألسنا نحن أيضًا عميانًا؟»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «ألسنا نحن أيضًا عميانًا؟»؛ وصيغة السؤال في اليونانية تتوقع جوابًا بالنفي.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσαν
  choice: فَسَمِعَ
  rationale: ينقل الفعل الماضي وقوع سماع كلام يسوع في السياق السردي، من غير أن يضيف معنى الإصغاء المتعمد.
- source_word: ἐκ τῶν Φαρισαίων
  choice: بعضُ الفريسيين
  rationale: يحفظ دلالة ἐκ التبعيضية، إذ المقصود بعض الفريسيين لا جميعهم.
- source_word: ταῦτα
  choice: هذا
  rationale: الاسم الموصول الإشاري اليوناني جمع، لكنه يشير هنا طبيعيًا إلى مجمل ما قاله يسوع؛ و«هذا» العربية أوضح وأجزل من «هذه الأشياء» في هذا السياق.
- source_word: οἱ μετ’ αὐτοῦ ὄντες
  choice: الذين كانوا معه
  rationale: صياغة عربية طبيعية تحفظ وصف أولئك الفريسيين بأنهم كانوا حاضرين معه.
- source_word: εἶπον αὐτῷ
  choice: فقالوا له
  rationale: يحافظ على فعل القول الذي يقدم الكلام المباشر، بينما تُظهر صيغة الاقتباس أنه سؤال.
- source_word: Μὴ καὶ ἡμεῖς τυφλοί ἐσμεν;
  choice: أَلَعَلَّنا نحن أيضًا عميان؟
  rationale: صيغة «ألعلّنا» تنقل استفهامًا استنكاريًا يتوقع جوابًا بالنفي، وتحفظ «نحن» توكيد الضمير و«أيضًا» دلالة καί.
- source_word: τυφλοί
  choice: عميان
  rationale: يحفظ اللفظ غير المقيّد في الأصل ويترك للسياق إظهار معناه المجازي.
theological_decisions:
- issue: هل يُصرَّح بالمعنى الروحي للعمى؟
  choice: الإبقاء على «عميان» بلا إضافة
  alternative: عميان روحيًا
  rationale: الأصل لا يقيّد الصفة، والسياق يبرز معناها المجازي. عدم إضافة «روحيًا» يحفظ مفارقة يوحنا ولا يحوّل التفسير إلى جزء من النص.
- issue: اتجاه سؤال الفريسيين
  choice: صياغته كسؤال استنكاري يتوقع النفي
  alternative: 'صياغته كسؤال محايد: «هل نحن أيضًا عميان؟»'
  rationale: الأداة μή تشير عادة إلى أن المتكلمين يتوقعون جوابًا بالنفي، لكن النص لا يصرّح بنبرة أبعد من ذلك.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعملت «ألعلّنا» لنقل اتجاه السؤال نحو النفي من غير مبالغة في نبرة الاستنكار، ووُضع حرف الهامش بعد الاقتباس.
