  text: διὰ τοῦτο οἱ γονεῖς αὐτοῦ εἶπαν ὅτι Ἡλικίαν ἔχει, αὐτὸν ⸀ἐπερωτήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/023.yaml
  text: For this reason his parents said[a], “He is of age; ask him.”
translation:
  language: ar
  text: 'لذلك قال والداه: «إنه بالغ، فاسألوه هو[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إنه في سنٍّ تسمح له بالإجابة، فاستجوبوه».'
    reason: بديل لفظي يبيّن دلالة العبارة الاصطلاحية Ἡλικίαν ἔχει وإمكان فهم ἐπερωτήσατε بمعنى أقوى قليلًا من مجرد السؤال.
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: لذلك
  rationale: تربط العبارة القول بسبب الخوف المذكور في السياق السابق، وتحافظ على القوة السببية بعبارة عربية طبيعية موجزة.
- source_word: οἱ γονεῖς αὐτοῦ
  choice: والداه
  rationale: المثنى العربي يؤدي معنى أبويه مجتمعين بدقة وطبيعية.
- source_word: εἶπαν
  choice: قال
  rationale: فعل القول هنا عام، فلا حاجة إلى تخصيصه بمعنى «أجاب» أو «أخبر».
- source_word: Ἡλικίαν ἔχει
  choice: إنه بالغ
  rationale: 'هذا هو المعنى الاصطلاحي في السياق: بلغ السن التي يستطيع فيها أن يجيب عن نفسه، وهو أوضح من النقل الحرفي «له سن».'
- source_word: αὐτὸν
  choice: هو
  rationale: إظهار ضمير الفصل بعد المفعول المتصل في «فاسألوه هو» ينقل توكيد الضمير اليوناني على أن السؤال ينبغي أن يوجَّه إليه شخصيًا.
- source_word: ἐπερωτήσατε
  choice: فاسألوه
  rationale: صيغة الأمر تدعو المخاطبين إلى توجيه السؤال إليه، و«اسألوا» هي المقابل العربي الطبيعي غير المتكلف.
