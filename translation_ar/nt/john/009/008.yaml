  text: So the neighbors[a], and those who had seen him before as a beggar, were saying, “Is this not the man who used to sit and beg?”
translation:
  language: ar
  text: 'فكان الجيران والذين كانوا يرونه من قبل متسوّلًا يقولون: «أليس هذا هو الذي كان يجلس ويتسوّل؟»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'وبصياغة أقرب إلى اللفظ اليوناني: «أليس هذا هو الجالس والمتسوّل؟» يستعمل النص اليوناني صيغتي مشاركة، «الجالس» و«المتسوّل»، للتعريف به من خلال ما اعتاد أن يفعله سابقًا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: فكان
  rationale: تربط الفاء الكلام بما سبقه بوصفه استمرارًا سرديًّا، وتلائمها «كان» مع الفعل اليوناني الناقص الدال على قول جارٍ أو متكرر.
- source_word: γείτονες
  choice: الجيران
  rationale: مقابل عربي مباشر وطبيعي لمن يسكنون بالقرب منه.
- source_word: θεωροῦντες αὐτὸν τὸ πρότερον
  choice: الذين كانوا يرونه من قبل
  rationale: ينقل معنى الرؤية السابقة المتكررة على نحو يفسر قدرتهم على التعرف إليه، من غير المبالغة في معنى المراقبة.
- source_word: ὅτι προσαίτης ἦν
  choice: متسوّلًا
  rationale: تعرضه العبارة بصفته التي عرفوه بها سابقًا، ولا تجعل ὅτι سببية على نحو قاطع؛ والصياغة العربية موجزة وطبيعية.
- source_word: ἔλεγον
  choice: يقولون
  rationale: يحفظ الجانب الاستمراري للفعل الناقص، بما يوحي بتداول القول بينهم.
- source_word: Οὐχ οὗτός ἐστιν
  choice: أليس هذا هو
  rationale: يحفظ صيغة السؤال الذي يتوقع جوابًا بالإيجاب.
- source_word: ὁ καθήμενος καὶ προσαιτῶν
  choice: الذي كان يجلس ويتسوّل
  rationale: ينقل اسم الفاعل المعرّف في اليونانية بوصفه نشاطًا معتادًا كان الرجل معروفًا به، مع عربية واضحة وطبيعية.
