  terminology: '«متسوّل» واضح ومناسب في هذا السياق، و«الجيران» و«يجلس ويتسوّل» دقيقان من حيث المعنى والسجل. لكن وصف الحاشية للصيغ اليونانية بأنها «اسمي فاعل» غير دقيق نحويًا: καθήμενος صيغة مشاركة وسط/مبني للمجهول، في حين أن προσαιτῶν صيغة مشاركة فاعلة.'
