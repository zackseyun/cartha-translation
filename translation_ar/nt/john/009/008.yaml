  source_fidelity: 'النص الرئيس ينقل عناصر اليونانية الأساسية بأمانة: «فكان» تؤدي οὖν في سياق سردي، و«الجيران» تؤدي γείτονες، و«كانوا يرونه من قبل متسوّلًا» تعكس الرؤية السابقة للرجل في حال كونه متسوّلًا من غير فرض سببية قاطعة على ὅτι. كما أن «كان يجلس ويتسوّل» ينقل الوصف التعريفي ذي الدلالة الاعتيادية في اسمي المشاركة اليونانيين.'
