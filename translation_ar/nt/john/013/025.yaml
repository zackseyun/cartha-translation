lexical_decisions:
- source_word: ἀναπεσὼν
  choice: مال إلى الوراء
  rationale: يفيد الفعل في سياق الطعام الاتكاء، لكنه هنا، مع العبارة التي تلي، يصوّر حركة التلميذ إلى الوراء نحو صدر يسوع؛ و«مال إلى الوراء» تنقل الحركة بوضوح في العربية المعاصرة.
- source_word: ἐκεῖνος
  choice: ذاك
  rationale: يحافظ اسم الإشارة على قوة اللفظ اليوناني من غير إضافة تفسيرية مثل «ذلك التلميذ»، والمرجع واضح من السياق السابق.
- source_word: οὕτως
  choice: هكذا
  rationale: ترجمة مباشرة تحفظ صلة الحركة بالوضع الموصوف في السياق السابق.
- source_word: ἐπὶ τὸ στῆθος τοῦ Ἰησοῦ
  choice: على صدر يسوع
  rationale: ترجمة واضحة وطبيعية للموضع الجسدي، وتحفظ صورة النص من غير شرح داخل المتن.
- source_word: λέγει αὐτῷ
  choice: وقال له
  rationale: مع أن اليونانية تستعمل المضارع التاريخي، فالماضي هو الأسلوب السردي الطبيعي في العربية، والفاء تصل الفعل بحركة الميل السابقة.
- source_word: Κύριε
  choice: يا رب
  rationale: تحفظ «رب» الانفتاح الدلالي واللاهوتي للقب في خطاب يسوع، وتأتي أداة النداء بما يلائم العربية الطبيعية.
- source_word: τίς ἐστιν;
  choice: من هو؟
  rationale: صياغة عربية موجزة وطبيعية تسأل عن هوية الشخص المقصود، من غير تعيين زائد.
theological_decisions:
- issue: ترجمة κύριος في مخاطبة يسوع مباشرة
  choice: يا رب
  alternative: يا سيدي
  rationale: قد تكون الكلمة نداء احترام، لكنها تنسجم أيضًا مع الدلالة المسيحانية الأوسع في إنجيل يوحنا؛ و«يا رب» تحفظ هذا التوتر بدل قصرها على المجاملة.
