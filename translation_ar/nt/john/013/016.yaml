base_translation:
  language: en
  yaml_path: translation/nt/john/013/016.yaml
  text: Truly[a], truly, I say to you, a servant is not greater than his master[c][b], nor is an apostle greater than the one who sent him.
translation:
  language: ar
  text: '«الحقَّ الحقَّ أقول لكم: ليس عبدٌ أعظمَ من سيّده، ولا رسول[a]ٌ أعظمَ من الذي أرسله».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن ترجمة «رسول» أيضًا: «مبعوث»؛ فاللفظ اليوناني هنا يعني شخصًا أرسله آخر بتكليف.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: الحقَّ الحقَّ
  rationale: صيغة يوحنا التوكيدية المكررة؛ تحافظ على التكرار وقوة التقرير بلغة عربية مفهومة ومألوفة كتابيًا.
- source_word: λέγω ὑμῖν
  choice: أقول لكم
  rationale: نقل مباشر وطبيعي لصيغة الخطاب في المضارع.
- source_word: δοῦλος
  choice: عبد
  rationale: يحفظ علاقة الخضوع والملكية/السيادة التي يدل عليها اللفظ اليوناني في المقابلة مع السيد، وهو في العربية أوضح وأقوى من «خادم» هنا.
- source_word: μείζων
  choice: أعظم
  rationale: ينقل معنى التفوق في المنزلة أو الرتبة في كلتا المقابلتين من غير تضييق الدلالة.
- source_word: κύριος
  choice: سيّده
  rationale: السياق اجتماعي يقابل العبد بسيده، لا استعمالًا صريحًا للقب الإلهي «الرب».
- source_word: ἀπόστολος
  choice: رسول
  rationale: ينقل معنى الشخص المرسَل بتكليف، ويحافظ كذلك على المصطلح المعروف؛ وتوضح العبارة التالية علاقة الإرسال.
- source_word: τοῦ πέμψαντος αὐτόν
  choice: الذي أرسله
  rationale: صياغة عربية طبيعية للبناء الوصفي بالمصدر الفعلي، وتحفظ علاقة الرسول بمرسِله.
theological_decisions:
- issue: دلالة κύριος في المقابلة غير اللقبية
  choice: سيّده
  alternative: ربّه
  rationale: المقابلة المباشرة هي بين العبد وصاحب السلطان عليه، كما أن الشطر الثاني يقابل الرسول بمرسِله. لذلك تعبّر «سيّده» عن المعنى الاجتماعي من غير أن تفرض استعمالًا لقبيًا لا يقتضيه السياق.
- issue: دلالة ἀπόστολος بين المصطلح والدور العام
  choice: رسول
  alternative: مبعوث
  rationale: «رسول» يحفظ المصطلح اليوناني المعروف ومعنى الإرسال معًا، لكن اللفظ في هذا السياق يمكن أن يدل عمومًا على المبعوث، لا حصرًا على منصب رسولي محدد.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. حُفظ تكرار صيغة التوكيد، واستُعملت «عبد/سيّد» لإبراز علاقة الخضوع في الأصل، مع إبقاء «رسول» في المتن وشرح «مبعوث» في الحاشية.
