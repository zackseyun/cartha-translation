translation:
  language: ar
  text: لكن لم يعرف أحد من المتكئين عند المائدة لأي غرض قال له هذا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لماذا قال له هذا».'
    reason: بديل لغوي طبيعي للتعبير عن πρὸς τί، مع إمكان فهمه سؤالًا عن السبب أو الغرض.
lexical_decisions:
- source_word: τοῦτο
  choice: هذا
  rationale: اسم إشارة يعود إلى القول السابق، ويحافظ «هذا» على قوته الإشارية.
- source_word: δὲ
  choice: لكن
  rationale: تفيد الأداة انتقالًا يتضمن مقابلة خفيفة مع ما سبق، و«لكن» طبيعية في السياق.
- source_word: οὐδεὶς
  choice: لم ... أحد
  rationale: تنقل النفي الكلي بصياغة عربية سليمة مع الفعل.
- source_word: ἔγνω
  choice: يعرف
  rationale: ينقل معنى γινώσκω هنا بوصفه إدراكًا لمراد الكلام، من غير زيادة تفسيرية.
- source_word: τῶν ἀνακειμένων
  choice: من المتكئين إلى المائدة
  rationale: يحافظ على هيئة الاتكاء المتبعة عند تناول الطعام، مع ذكر المائدة لتوضيح سياق الوليمة.
- source_word: πρὸς τί
  choice: لأي غرض
  rationale: يحافظ على دلالة الغاية أو القصد في التركيب اليوناني، بدل اختزالها في سؤال عام عن السبب.
- source_word: εἶπεν αὐτῷ
  choice: قال له هذا
  rationale: ينقل الفعل والمفعول غير المباشر بوضوح، ويجعل «هذا» مفعول القول العائد إلى τοῦτο.
