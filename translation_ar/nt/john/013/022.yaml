  text: وكان التلاميذ ينظرون بعضهم إلى بعض، متحيّرين بشأن من يتكلّم عنه.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وظلّ التلاميذ ينظرون بعضهم إلى بعض، حائرين بشأن من يتكلّم عنه».'
    reason: بديل لغوي يبرز بصورة أقوى دلالة الاستمرار أو التكرار في ἔβλεπον، ويقدّم مقابلاً قريبًا لـἀπορούμενοι.
lexical_decisions:
- source_word: ἔβλεπον
  choice: كانوا ينظرون
  rationale: صيغة الماضي الناقص تدل على فعل مستمر في المشهد، ويؤديها التركيب العربي «كانوا ينظرون» بوضوح وطبيعية.
- source_word: εἰς ἀλλήλους
  choice: بعضهم إلى بعض
  rationale: تعبير عربي فصيح ينقل دلالة التبادل في نظر التلاميذ بعضهم إلى بعض.
- source_word: οἱ μαθηταὶ
  choice: التلاميذ
  rationale: أداة التعريف تشير إلى الجماعة المعروفة من السياق، من غير حاجة إلى إضافة «تلاميذه» غير المذكورة صراحة.
- source_word: ἀπορούμενοι
  choice: متحيّرين
  rationale: ينقل حال الشك والحيرة التي يدل عليها اسم الفاعل، ويرتبط بصورة طبيعية بالسؤال غير المباشر التالي.
- source_word: περὶ τίνος
  choice: فيمن ... عنه
  rationale: يحافظ على كون السؤال متعلقًا بالشخص الذي يدور حوله الكلام، بصياغة عربية موجزة وطبيعية.
- source_word: λέγει
  choice: يتكلّم
  rationale: يحافظ على زمن المضارع في النص اليوناني وعلى المعنى اللفظي دون تفسيره بمعنى «يقصد».
