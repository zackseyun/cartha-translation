    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: كان يعرف
  rationale: يفيد الفعل هنا معرفة يسوع القائمة في ذلك الوقت، وصيغة «كان يعرف» طبيعية في السرد العربي وتحافظ على الخلفية الزمنية.
- source_word: γὰρ
  choice: لأنه
  rationale: تقدّم الأداة تعليلًا للقول السابق، و«لأنه» توضح الصلة التفسيرية طبيعيًا.
- source_word: τὸν παραδιδόντα αὐτόν
  choice: مَن يُسلِّمه
  rationale: تحافظ العبارة على المعنى الأساسي للفعل، أي التسليم، وعلى قوة اسم الفاعل الحاضر، بينما يوضح السياق أن المقصود خيانة يهوذا.
- source_word: διὰ τοῦτο
  choice: ولهذا
  rationale: تنقل العلاقة السببية الصريحة بإيجاز وفصاحة.
- source_word: εἶπεν ὅτι
  choice: 'قال:'
  rationale: تؤدي النقطتان ووضع الكلام بين علامتي اقتباس وظيفة ὅτι في تقديم القول المباشر.
- source_word: Οὐχὶ πάντες
  choice: لستم جميعًا
  rationale: 'صياغة عربية طبيعية تُظهر أن الخطاب موجّه إلى جماعة، وتحفظ معنى النفي الجزئي: ليس كل المخاطَبين طاهرين.'
- source_word: καθαροί
  choice: طاهرين
  rationale: «طاهرين» تلائم خطاب الغسل وتحمل في العربية صدى النظافة والطهارة الباطنية، من غير حصر المعنى في الجانب الأخلاقي وحده.
- source_word: ἐστε
  choice: لستم
  rationale: أُدمج فعل الكينونة مع أداة النفي في الصياغة العربية الاسمية المناسبة للمخاطب الجمع.
theological_decisions:
- issue: دلالة παραδιδόντα في الإشارة إلى يهوذا
  choice: مَن يُسلِّمه
  alternative: مَن يخونه
  rationale: اختيرت الصياغة الأقرب إلى المعنى المعجمي للفعل كي تبقى صورة «التسليم» حاضرة، مع بيان دلالة الخيانة في الحاشية والسياق، من غير تسوية التعدد الدلالي.
- issue: دلالة καθαροί في سياق غسل الأرجل
  choice: طاهرين
  alternative: نظيفين
  rationale: تحفظ «طاهرين» التداخل بين صورة الاغتسال والحالة الباطنية في الخطاب، ولا تقصر الكلام على النظافة الجسدية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «مَن» الموصولة لصياغة اسم الفاعل اليوناني طبيعيًا، وحُفظ التعليل في جزأي الآية، كما حُفظت دلالة النفي الجزئي في «لستم جميعًا».
