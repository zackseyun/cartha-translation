  yaml_path: translation/nt/john/013/007.yaml
  text: Jesus answered and said to him[a], “What I am doing you do not know now[b], but you will understand after these things.”
translation:
  language: ar
  text: 'أجاب يسوع وقال له: «ما أفعله أنا لا تعرفه[a] أنت الآن، لكنك ستفهمه بعد هذه الأمور».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'استُعمل فعلان مختلفان في اليونانية: الأول يُترجم «تعرف»، والثاني يمكن أن يُترجم «ستعرف» أو «ستفهم».'
    reason: lexical_alternative
  - marker: b
    text: قد تشير عبارة «بعد هذه الأمور» إلى ما سيأتي في هذا المشهد، أو، على نطاق أوسع، إلى أحداث لاحقة ستوضح معنى ما فعله يسوع.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν
  choice: أجاب … وقال
  rationale: يحافظ على الفعلين الواردين في اليونانية، مع صياغة عربية سردية واضحة.
- source_word: Ὃ ἐγὼ ποιῶ
  choice: ما أفعله أنا
  rationale: ينقل الفعل المضارع بوصفه عملاً جاريًا في المشهد، ويحافظ على توكيد الضمير ἐγώ.
- source_word: σὺ οὐκ οἶδας ἄρτι
  choice: لا تعرفه أنت الآن
  rationale: يترجم οἶδας بـ«تعرف» ويحافظ على توكيد σὺ وعلى الدلالة الزمنية المباشرة لـἄρτι.
- source_word: γνώσῃ
  choice: ستفهمه
  rationale: ينقل معنى الإدراك اللاحق في السياق، ويميّزه عن فعل المعرفة οἶδας السابق.
- source_word: μετὰ ταῦτα
  choice: بعد هذه الأمور
  rationale: ترجمة قريبة من اللفظ اليوناني تحافظ على سعة المرجع الزمني ولا تختزله في «لاحقًا».
theological_decisions:
- issue: النطاق الزمني للفهم اللاحق
  choice: الإبقاء على العبارة العامة «بعد هذه الأمور»
  alternative: تحديدها بما بعد غسل الأرجل، أو بما بعد الصليب والقيامة، أو بالفهم الآتي بواسطة الروح
  rationale: النص اليوناني لا يحدد حدثًا واحدًا بعينه، لذلك تُحفظ دلالته المفتوحة ولا يُحسم التوتر التفسيري داخل المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. حُفظ توكيد الضميرين في «ما أفعله أنا» و«لا تعرفه أنت»، مع إبقاء التمييز المعجمي بين المعرفة الحالية والفهم اللاحق.
