source:
  edition: SBLGNT
  text: ⸀ἀποκρίνεται ὁ Ἰησοῦς· Ἐκεῖνός ἐστιν ᾧ ἐγὼ ⸀βάψω τὸ ψωμίον ⸂καὶ δώσω αὐτῷ⸃· ⸂βάψας οὖν⸃ τὸ ⸀ψωμίον δίδωσιν Ἰούδᾳ Σίμωνος ⸀Ἰσκαριώτου.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/026.yaml
  text: Jesus answers[a], “It is he to whom I will dip the piece of bread and give it.” So, having dipped the piece of bread, he gives it to Judas, the son of Simon Iscariot.
translation:
  language: ar
  text: 'يجيب يسوع: «هو الذي سأغمس له كسرة الخبز وأعطيه إياها». فغمس كسرة الخبز وأعطاها ليهوذا بن سمعان الإسخريوطي.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ليهوذا الإسخريوطي بن سمعان». تحتمل العبارة اليونانية الوجهين.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκρίνεται
  choice: يجيب
  rationale: مضارع تاريخي يضفي حيوية على السرد، وصيغة «يجيب» طبيعية وواضحة في العربية.
- source_word: Ἐκεῖνός ἐστιν
  choice: هو الذي
  rationale: تؤدي قوة التعريف بالشخص في العبارة اليونانية بصياغة عربية طبيعية.
- source_word: ᾧ
  choice: له
  rationale: 'ضمير الموصول في حالة المجرور يدل على متلقي الكسرة، وتؤديه العربية بوضوح داخل الصلة: «سأغمس له... وأعطيه».'
- source_word: βάψω
  choice: سأغمس
  rationale: يحفظ دلالة المستقبل، والغمس هنا خاص بالطعام لا بالاغتسال أو المعمودية.
- source_word: ψωμίον
  choice: كسرة الخبز
  rationale: تدل على قطعة صغيرة من الخبز أو الطعام؛ و«كسرة الخبز» موجزة وطبيعية في العربية المعاصرة.
- source_word: καὶ δώσω αὐτῷ
  choice: وأعطيه إياها
  rationale: تصرّح العربية بالمفعول المباشر العائد إلى كسرة الخبز وبالمتلقي، فتزيل التباس الضمائر من غير تغيير المعنى.
- source_word: βάψας οὖν
  choice: فغمس
  rationale: الفاء تنقل نتيجة الجواب وتسلسل الحدث، والفعل الماضي يؤدي سبق فعل الغمس على الإعطاء بصورة عربية طبيعية.
- source_word: δίδωσιν
  choice: وأعطاها
  rationale: رُدّ المضارع التاريخي إلى الماضي هنا وفق مألوف السرد العربي، مع بقاء تسلسل الفعل واضحًا.
- source_word: Ἰούδᾳ Σίμωνος Ἰσκαριώτου
  choice: ليهوذا بن سمعان الإسخريوطي
  rationale: يتبع أقرب تركيب نحوي، حيث يتصل لقب «الإسخريوطي» بسمعان، مع حفظ الاحتمال الآخر في الحاشية.
theological_decisions:
- issue: تحديد صاحب لقب «الإسخريوطي» في العبارة الأخيرة
  choice: يهوذا بن سمعان الإسخريوطي
  alternative: يهوذا الإسخريوطي بن سمعان
  rationale: ترتيب المضافين في Σίμωνος Ἰσκαριώτου يرجّح نحويًا وصف سمعان باللقب، لكن العبارة تحتمل أيضًا أن يكون اللقب وصفًا تقليديًا ليهوذا؛ لذلك أُبقي الاحتمال البديل في حاشية بدل حسم الغموض.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم المضارع في افتتاح القول للمحافظة على حيوية المضارع التاريخي، ثم الماضي في سرد الفعلين المتتابعين لطبيعية الأسلوب العربي. وُضع مؤشر الحاشية بعد العبارة التي يخصها.
