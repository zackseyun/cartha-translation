  text: فأشار سمعان بطرس إلى هذا التلميذ أن يسأل مَن عسى أن يكون الذي يتكلم عنه يسوع.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νεύει
  choice: أشار
  rationale: يدل الفعل على إعطاء إشارة غير لفظية، و«أشار» تعبير عربي طبيعي لا يحدد الإيماء بالرأس دون دليل.
- source_word: οὖν
  choice: فـ
  rationale: الفاء تنقل النتيجة أو الاستمرار السردي المترتب على الآية السابقة بإيجاز طبيعي.
- source_word: τούτῳ
  choice: إلى ذلك التلميذ
  rationale: يحافظ هذا التعبير على القوة الإشارية لاسم الإشارة، ويبيّن مرجعه من السياق من غير إضافة هوية جديدة.
- source_word: πυθέσθαι
  choice: أن يسأل
  rationale: المصدر يوضح الغرض من إشارة بطرس، و«أن يسأل» هو التعبير العربي الأوضح في السياق.
- source_word: τίς ἂν εἴη
  choice: مَن عسى أن يكون
  rationale: ينقل «عسى» ما في ἄν مع صيغة التمني من عدم الجزم أو الاحتمال، مع صياغة عربية فصيحة مفهومة.
- source_word: περὶ οὗ λέγει
  choice: الذي يتكلم عنه
  rationale: ينقل تركيب «عن مَن يتكلم» بصلة موصول عربية طبيعية، مع فهم المضارع اليوناني بوصفه حاضرًا سرديًا ضمن المشهد الجاري.
