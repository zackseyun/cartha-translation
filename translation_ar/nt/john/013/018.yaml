  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: οὐ περὶ πάντων ὑμῶν λέγω· ἐγὼ οἶδα ⸀τίνας ἐξελεξάμην· ἀλλ’ ἵνα ἡ γραφὴ πληρωθῇ· Ὁ τρώγων ⸀μου τὸν ἄρτον ἐπῆρεν ἐπ’ ἐμὲ τὴν πτέρναν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/018.yaml
  text: 'I am not speaking about all of you[a]. I know whom I have chosen[c][b]. But this is so that the Scripture may be fulfilled: ‘The one who eats my bread has lifted up his heel against me.’'
translation:
  language: ar
  text: 'لَسْتُ أَتَكَلَّمُ عَنْكُمْ جَمِيعًا. أَنَا أَعْرِفُ مَنِ اخْتَرْتُهُمْ. وَلَكِنْ هٰذَا لِكَيْ يَتِمَّ مَا جَاءَ فِي الْكِتَابِ: «الَّذِي يَأْكُلُ خُبْزِي رَفَعَ عَلَيَّ عَقِبَهُ».[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: إشارة إلى المزمور 41:9 بحسب الترقيم الشائع في الترجمات الحديثة (41:10 في بعض الترجمات).
    reason: cross_reference
  - marker: b
    text: «رفع عليّ عقبه» صورة تعبّر عن العداوة والخيانة.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ περὶ πάντων ὑμῶν λέγω
  choice: لست أتكلم عنكم جميعًا
  rationale: صياغة عربية طبيعية تحفظ تعلّق النفي بعبارة «عنكم جميعًا» ومعنى περὶ الدال على الحديث عن أشخاص.
- source_word: οἶδα
  choice: أنا أعرف
  rationale: الفعل οἶδα تامّ في صيغته لكنه حاضر المعنى في اليونانية الكوينه؛ لذلك نُقل بالمضارع العربي.
- source_word: τίνας ἐξελεξάμην
  choice: مَنِ اخترتهم
  rationale: تحفظ الصياغة المفعول الشخصي ومعنى الاختيار من غير أن تحدد نوع هذا الاختيار لاهوتيًا.
- source_word: ἀλλ’ ἵνα
  choice: ولكن هذا لكي
  rationale: تُظهر الصلة التي تفهم ضمنًا في العبارة اليونانية الموجزة، مع إبقاء معنى الغاية أو النتيجة دون إضافة تفسير سببي حتمي.
- source_word: ἡ γραφὴ πληρωθῇ
  choice: يتم ما جاء في الكتاب
  rationale: تعبير عربي واضح يشير إلى النص المقدس ويحفظ مفهوم إتمام الكتاب، بدل الصياغة الحرفية غير الطبيعية «يتم الكتاب».
- source_word: Ὁ τρώγων μου τὸν ἄρτον
  choice: الذي يأكل خبزي
  rationale: تنقل اسم الفاعل المعرّف بجملة موصولية طبيعية، وتربط ضمير الملكية بالخبز كما يقتضي السياق.
- source_word: ἐπῆρεν ἐπ’ ἐμὲ τὴν πτέρναν αὐτοῦ
  choice: رفع عليّ عقبه
  rationale: تحفظ صورة الاقتباس الأصلية وإيحاءها بالعداوة والخيانة، بدل تسطيحها إلى شرح مباشر.
theological_decisions:
- issue: علاقة اختيار يسوع بالخائن
  choice: ترجمة ἐξελεξάμην مباشرة بعبارة «اخترتهم» من غير تقييد نوع الاختيار
  alternative: تفسير الاختيار بأنه اختيار للخلاص، أو حصره صراحة في التعيين للرسولية
  rationale: الآية لا تعرّف المقصود اللاهوتي الدقيق من الاختيار؛ لذا تحفظ الترجمة التوتر في السياق ولا تحسم نقاشًا مذهبيًا.
- issue: دلالة ἀλλ’ ἵνα وصلتها بالخيانة وإتمام الكتاب
  choice: «ولكن هذا لكي يتم ما جاء في الكتاب»
  alternative: صياغة تفيد أن الخيانة وقعت اضطرارًا لأن الكتاب كان لا بد أن يتحقق
  rationale: تحفظ الصياغة لغة الغاية أو النتيجة وإتمام الكتاب من غير إضافة تقرير حتمي عن السببية لا تصرّح به العبارة نفسها.
translation_notes:
  register: فصحى معاصرة واضحة ووقورة. استُخدمت ألفاظ مألوفة وتراكيب طبيعية، مع إبقاء صورة «رفع العقِب» الواردة في الاقتباس وشرح دلالتها في الحاشية.
