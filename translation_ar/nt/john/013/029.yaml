base_translation:
  language: en
  yaml_path: translation/nt/john/013/029.yaml
  text: For some thought that[a], because Judas had the money box, Jesus was telling him[b], “Buy what we need for the feast,” or that he should give something to the poor.
translation:
  language: ar
  text: 'فقد ظنَّ بعضهم، إذ كان يهوذا يحمل صندوق المال[a]، أن يسوع يقول له: «اشترِ ما نحتاج إليه للعيد[b]»، أو أن يعطي الفقراء شيئًا.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «كيس المال». تشير الكلمة اليونانية إلى الوعاء الذي كانت تُحفظ فيه أموال الجماعة.'
    reason: lexical_alternative
  - marker: b
    text: المقصود بـ«العيد» هنا عيد الفصح في سياق هذا المقطع.
    reason: cross_reference
lexical_decisions:
- source_word: τινὲς
  choice: بعضهم
  rationale: نكرة جمع تشير طبيعيًا إلى بعض الحاضرين في السياق.
- source_word: ἐδόκουν
  choice: ظنَّ
  rationale: ينقل إدراكهم غير اليقيني بعبارة عربية سردية واضحة، من غير تحميل صيغة الماضي الناقص أكثر مما تحتمل.
- source_word: ἐπεὶ
  choice: لأن
  rationale: تبيّن سبب ظنهم، وهو أن يهوذا كان يحمل وعاء المال.
- source_word: γλωσσόκομον
  choice: صندوق المال
  rationale: تعبير واضح قريب من اللفظ اليوناني، ويدل على الوعاء الذي كانت تُحفظ فيه أموال الجماعة دون افتراض شكل أدق.
- source_word: εἶχεν
  choice: كان يحمل
  rationale: يحافظ على المعنى الأساسي للحيازة أو الإمساك، بينما يفهم من السياق أنه كان مسؤولًا عن الصندوق.
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: أن يسوع يقول له
  rationale: يبقي المضارع التاريخي في صياغة عربية سليمة داخل مضمون ظن الحاضرين.
- source_word: Ἀγόρασον
  choice: اشترِ
  rationale: أمر مباشر وطبيعي يعكس صيغة الأمر في اليونانية.
- source_word: ὧν χρείαν ἔχομεν
  choice: ما نحتاج إليه
  rationale: مقابل عربي فصيح وطبيعي للتركيب الموصول الدال على الأشياء اللازمة.
- source_word: εἰς τὴν ἑορτήν
  choice: للعيد
  rationale: ينقل معنى العيد الديني دون إضافة اسم الفصح الذي لا تكرره الآية نفسها صراحة.
- source_word: τοῖς πτωχοῖς
  choice: الفقراء
  rationale: المفعول غير المباشر مع فعل العطاء يُعبَّر عنه في العربية مباشرة بهذه الصياغة.
- source_word: ἵνα τι δῷ
  choice: أن يعطي الفقراء شيئًا
  rationale: يحفظ الاحتمال الثاني الذي فهمه الحاضرون، في تركيب عربي موجز وواضح.
theological_decisions:
- issue: تعيين العيد
  choice: العيد
  alternative: عيد الفصح
  rationale: السياق الأوسع يحدده بالفصح، لكن نص الآية يقول «العيد» فقط؛ لذلك تُحفظ صياغة الأصل ويُوضَّح السياق في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ ترتيب التعليل ومضمونا الظن، مع تجنب التفسير الزائد لمسؤولية يهوذا أو تسمية العيد داخل المتن.
