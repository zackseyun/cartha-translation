  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ὁ λαμβάνων ⸀ἄν τινα πέμψω ἐμὲ λαμβάνει, ὁ δὲ ἐμὲ λαμβάνων λαμβάνει τὸν πέμψαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/020.yaml
  text: Truly[a], truly, I say to you, whoever receives anyone I send receives me[b], and whoever receives me receives the one who sent me.
translation:
  language: ar
  text: 'الحقَّ الحقَّ أقول لكم: مَن يقبل أيَّ شخص أُرسله يقبلني، ومَن يقبلني يقبل الذي أرسلني.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يشير تعبير «الذي أرسلني» في هذا السياق إلى الآب.
    reason: cross_reference
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: الحقَّ الحقَّ
  rationale: يحفظ التكرار التوكيدي والصيغة الاحتفالية المميزة لأقوال يسوع، بلغة عربية كتابية واضحة ومألوفة.
- source_word: λέγω ὑμῖν
  choice: أقول لكم
  rationale: ترجمة مباشرة تحافظ على صيغة الخطاب الحاضرة وعلى نبرة القول الرسمية.
- source_word: ὁ λαμβάνων
  choice: مَن يقبل
  rationale: ينقل قوة اسم الفاعل المحلّى بأداة التعريف بوصفها عامة وشاملة، من غير تقييد بالذكور.
- source_word: ἄν τινα πέμψω
  choice: أيَّ شخص أُرسله
  rationale: يحفظ عدم التعيين والاحتمال اللذين تفيدهما ἄν مع τινα وفعل الإرسال في صيغة الاحتمال، مع وضوح المقصود البشري في العربية.
- source_word: λαμβάνει
  choice: يقبل
  rationale: يناسب قبول الشخص والاعتراف به، ويحافظ على التكرار المقصود الذي يربط الرسول بيسوع ثم بالذي أرسله.
- source_word: ὁ δὲ ἐμὲ λαμβάνων
  choice: ومَن يقبلني
  rationale: الواو تلائم وظيفة δέ الرابطة هنا، إذ يواصل الكلام سلسلة التمثيل ولا يقيم تضادًا قويًا.
- source_word: τὸν πέμψαντά με
  choice: الذي أرسلني
  rationale: يحافظ على التعبير العلائقي في الأصل من غير إدخال لقب «الآب» في المتن، مع أن السياق اليوحناوي يحدده.
theological_decisions:
- issue: تحديد هوية «الذي أرسلني»
  choice: الذي أرسلني
  alternative: الآب الذي أرسلني
  rationale: يشير السياق في إنجيل يوحنا إلى الآب، لكن الآية نفسها لا تذكر اللقب صراحة؛ لذلك يُحفظ نصها العلائقي، ويوضح الهامش المرجع المقصود.
- issue: عموم اسم الفاعل المذكر
  choice: مَن يقبل
  alternative: الرجل الذي يقبل
  rationale: الصيغة اليونانية عامة وتمثيلية وليست مقصورة على الذكور، و«مَن» تؤدي هذا العموم طبيعيًا في العربية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «يقبل» بدل «يرحّب» للمحافظة على سعة معنى λαμβάνω وعلى تكراره البنيوي في الآية. وُضع الضبط الجزئي في «الحقَّ» و«أيَّ» منعًا للالتباس.
