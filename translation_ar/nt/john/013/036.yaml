source:
  edition: SBLGNT
  text: Λέγει αὐτῷ Σίμων Πέτρος· Κύριε, ποῦ ὑπάγεις; ⸀ἀπεκρίθη Ἰησοῦς· Ὅπου ὑπάγω οὐ δύνασαί μοι νῦν ἀκολουθῆσαι, ⸂ἀκολουθήσεις δὲ ὕστερον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/036.yaml
  text: Simon Peter says to him[a], “Lord, where are you going?” Jesus answered, “Where I am going, you are not able to follow me now[b], but you will follow later.”
translation:
  language: ar
  text: 'قال له سمعان بطرس: «يا رب، إلى أين تذهب؟» أجابه يسوع: «حيث أذهب لا تقدر أن تتبعني الآن[a]، لكنك ستتبعني فيما بعد[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: «لا تستطيع أن تتبعني الآن». يستعمل اليوناني فعلًا يدل صراحةً على القدرة.'
    reason: lexical_alternative
  - marker: b
    text: قد تلمّح عبارة «ستتبعني فيما بعد» إلى اتباع بطرس ليسوع لاحقًا في الألم أو الموت، لكن العبارة نفسها لا تحدد كيفية ذلك.
    reason: cross_reference
lexical_decisions:
- source_word: Λέγει
  choice: قال
  rationale: استُخدم الماضي العربي المألوف في السرد بدل نقل الحاضر التاريخي اليوناني حرفيًا، لأن «قال» أفصح وأطبع في السرد العربي الحديث من «يقول» في هذا الموضع.
- source_word: Κύριε
  choice: يا رب
  rationale: يحفظ النداء والاحترام والرنين اللاهوتي للقب κύριος من غير تضييق معناه إلى «يا معلم».
- source_word: ποῦ ὑπάγεις
  choice: إلى أين تذهب؟
  rationale: تعبير عربي طبيعي يحفظ معنى الذهاب واتجاهه، ويرتبط لفظيًا بجواب يسوع.
- source_word: ἀπεκρίθη
  choice: أجابه
  rationale: صياغة موجزة وطبيعية في الحوار، وتُظهر أن كلام يسوع جواب مباشر لبطرس.
- source_word: Ὅπου ὑπάγω
  choice: حيث أذهب
  rationale: يحافظ على تكرار فعل الذهاب الوارد في سؤال بطرس، من غير تحديد الوجهة التي تركها النص غير مصرّح بها.
- source_word: οὐ δύνασαί μοι νῦν ἀκολουθῆσαι
  choice: لا تقدر أن تتبعني الآن
  rationale: يحفظ صراحةً معنى القدرة في δύναμαι، ويؤدي تبعية μοι مع ἀκολουθέω بعبارة عربية واضحة وطبيعية.
- source_word: ἀκολουθήσεις δὲ ὕστερον
  choice: لكنك ستتبعني فيما بعد
  rationale: يحفظ زمن المستقبل، ويعبّر عن مقابلة δέ مع «الآن»، وينقل ὕστερον بعبارة عربية طبيعية.
theological_decisions:
- issue: دلالة اتباع بطرس ليسوع فيما بعد
  choice: إبقاء العبارة عامة من غير تعيين كيفية هذا الاتباع
  alternative: تفسيرها صراحةً بأنها نبوءة باستشهاد بطرس، أو بردّه إلى التلمذة، أو باتباع أخروي
  rationale: النص اليوناني يثبت فقط أن بطرس لا يقدر أن يتبع يسوع الآن، لكنه سيتبعه فيما بعد؛ لذلك تُحفظ السعة السردية واللاهوتية ولا يُدرج تفسير بعينه في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم الماضي السردي الطبيعي في «قال» و«أجابه»، مع الحفاظ على التوازي بين «تذهب» و«أذهب»، وعلى معنى القدرة الصريح، وعلى غموض طبيعة الاتباع اللاحق.
