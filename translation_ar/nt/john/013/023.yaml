lexical_decisions:
- source_word: ἀνακείμενος
  choice: متكئًا
  rationale: يدل اللفظ على هيئة الاتكاء إلى المائدة في أثناء الطعام، و«متكئًا» تعبير عربي موجز ودقيق يحفظ المشهد التاريخي.
- source_word: εἷς ἐκ τῶν μαθητῶν αὐτοῦ
  choice: أحد تلاميذه
  rationale: ينقل التعبير التبعيضي اليوناني بصياغة عربية طبيعية وواضحة.
- source_word: ἐν τῷ κόλπῳ τοῦ Ἰησοῦ
  choice: إلى جوار يسوع
  rationale: يصف التعبير موضع التلميذ الملاصق ليسوع عند الاتكاء إلى المائدة. وهذه الصياغة تنقل المعنى المكاني بوضوح من غير أن توحي للقارئ الحديث بأنه كان جالسًا في حجره؛ أما الصورة الحرفية فمحفوظة في الحاشية.
- source_word: ὃν ἠγάπα ὁ Ἰησοῦς
  choice: وهو الذي كان يسوع يحبّه
  rationale: تحفظ الصلة وفاعل المحبة كما في اليونانية، وتأتي بصياغة عربية طبيعية مع دلالة الفعل المستمرة في هذا السياق.
theological_decisions:
- issue: موضع التلميذ الذي كان يسوع يحبّه بالنسبة إلى يسوع
  choice: إلى جوار يسوع
  alternative: في حضن يسوع
  rationale: العبارة في سياق العشاء تصف ترتيب المتكئين وقرب أحدهم من الآخر، ولا يلزم منها تقرير اتحاد صوفي أو جلوس التلميذ في حجر يسوع. تُحفظ الصورة اللفظية في الحاشية لما لها من صدى محتمل مع يوحنا 1:18 من غير فرض تفسير لاهوتي عليها في المتن.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «متكئًا» لإبقاء هيئة تناول الطعام القديمة، و«إلى جوار» لتوضيح الوضع المكاني، مع إبقاء العبارة الحرفية في الحاشية.
