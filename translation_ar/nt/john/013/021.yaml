source:
  edition: SBLGNT
  text: Ταῦτα εἰπὼν ⸀ὁ Ἰησοῦς ἐταράχθη τῷ πνεύματι καὶ ἐμαρτύρησεν καὶ εἶπεν· Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι εἷς ἐξ ὑμῶν παραδώσει με.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/021.yaml
  text: After saying these things[a], Jesus was troubled in spirit, and testified and said, “Truly, truly, I say to you, one of you will betray me.”
translation:
  language: ar
  text: 'وبعدما قال يسوع هذا، اضطرب في روحه، وشهد قائلًا: «الحق الحق أقول لكم: إن واحدًا منكم سيخونني[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بحرفية أكثر: «سيسلّمني».'
    reason: بديل معجمي يحفظ المعنى الأساسي للفعل اليوناني παραδίδωμι، أي التسليم أو الدفع إلى أيدي آخرين.
lexical_decisions:
- source_word: Ταῦτα εἰπὼν
  choice: وبعدما قال يسوع هذا
  rationale: صيغت العبارة بوصفها جملة زمنية طبيعية تدل على أن اضطراب يسوع أعقب كلامه السابق، من غير تكلّف في نقل اسم الإشارة الجمع اليوناني إلى العربية.
- source_word: ἐταράχθη τῷ πνεύματι
  choice: اضطرب في روحه
  rationale: ينقل الفعل اضطرابًا داخليًا حقيقيًا، وتوضح إضافة الضمير في العربية أن المقصود روح يسوع، من غير زيادة درجة للشدة لا ينص عليها الأصل.
- source_word: ἐμαρτύρησεν
  choice: شهد
  rationale: يحافظ على مفردات الشهادة المميزة في إنجيل يوحنا وعلى طابع القول الجاد، بدل تسويته إلى مجرد «قال» أو «أعلن».
- source_word: Ἀμὴν ἀμὴν
  choice: الحق الحق
  rationale: يحفظ التكرار والتوكيد الاحتفالي في الصيغة اليوحناوية، وهو تعبير عربي كتابي واضح ومألوف.
- source_word: λέγω ὑμῖν
  choice: أقول لكم
  rationale: نقل مباشر وواضح يلائم صيغة التصريح الجليل.
- source_word: εἷς ἐξ ὑμῶν
  choice: واحدًا منكم
  rationale: المقابل العربي الطبيعي للتعبير التبعيضي، ويحفظ وقع كون الفاعل واحدًا من الجماعة الحاضرة.
- source_word: παραδώσει με
  choice: سيخونني
  rationale: ينقل في السياق فعل التلميذ الغادر بوضوح للقارئ العربي، مع إثبات المعنى الحرفي الأوسع «يسلّمني» في الحاشية.
theological_decisions:
- issue: تصوير اضطراب يسوع الداخلي
  choice: اضطرب في روحه
  alternative: اضطرب بالروح؛ اضطرب في داخله
  rationale: يثبت واقعية اضطرابه الإنساني كما يعرضها النص، من غير التقليل منها أو إضافة تفسير عقائدي، كما يتجنب أن تُفهم «الروح» تلقائيًا على أنها إشارة إلى الروح القدس.
- issue: دلالة παραδίδωμι في التنبؤ بفعل يهوذا
  choice: سيخونني
  alternative: سيسلّمني
  rationale: السياق يجعل التسليم فعل خيانة من أحد التلاميذ؛ لذلك اختير التعبير السياقي الواضح، مع حفظ معنى الفعل الحرفي في الحاشية كي لا تضيع صلته بلغة التسليم في رواية الآلام.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة. حُفظ التكرار في «الحق الحق» ومفردة «شهد» لصلتهما بأسلوب يوحنا، ووُضعت علامة الحاشية مباشرة بعد اللفظة التي تشرحها.
