  text: If you know these things[a], you are blessed if you do them.
translation:
  language: ar
  text: إن كنتم تعرفون هذه الأمور، فطوبى لكم إن عملتم بها.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فسعداء أنتم» أو «فأنتم مغبوطون». تدل الكلمة اليونانية على حال من البركة والغبطة والازدهار، لا على مجرد الشعور بالسعادة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: إن
  rationale: أداة شرط مباشرة تلائم بنية الجملة اليونانية وتحافظ على معنى الشرط.
- source_word: ταῦτα
  choice: هذه الأمور
  rationale: تحافظ على صيغة الجمع المحايد، وتشير طبيعيًا إلى مثال يسوع وتعليمه السابقين.
- source_word: οἴδατε
  choice: تعرفون
  rationale: تنقل معنى العلم أو المعرفة مباشرة، من غير تحويل الفعل إلى «تفهمون» بما يتجاوز دلالته الصريحة.
- source_word: μακάριοί ἐστε
  choice: فطوبى لكم
  rationale: صياغة عربية كتابية طبيعية تعبّر عن حال البركة والغبطة، لا عن مجرد شعور عابر بالسعادة.
- source_word: ἐὰν ποιῆτε αὐτά
  choice: إن عملتم بها
  rationale: تحافظ على الشرط المتعلق بوضع هذه الأمور موضع العمل، وتأتي «بها» عربية طبيعية عائدة على «هذه الأمور».
theological_decisions:
- issue: دلالة μακάριοι في سياق التلمذة
  choice: طوبى لكم
  alternative: تكونون سعداء / محظوظون
  rationale: «طوبى لكم» تحفظ الثقل الكتابي لمعنى البركة والغبطة والحال المحمودة، من غير اختزال المعنى في الانفعال النفسي أو المصادفة الحسنة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُخدمت «هذه الأمور» لصون الجمع، و«عملتم بها» لتأكيد الانتقال من المعرفة إلى الممارسة بصياغة طبيعية.
