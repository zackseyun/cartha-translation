base_translation:
  language: en
  yaml_path: translation/nt/john/013/012.yaml
  text: So when he had washed their feet and taken his garments and reclined again[a], he said to them[b], “Do you understand what I have done for you?”
translation:
  language: ar
  text: 'فلمّا غسل أقدامهم وأخذ ثيابه واتكأ من جديد[a]، قال لهم: «هل تفهمون ما فعلته لأجلكم[b]؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «جلس من جديد»؛ والفعل اليوناني يشير في سياق الطعام إلى الاتكاء إلى المائدة.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «ما فعلته بكم»؛ فالضمير في اليونانية يحتمل معنى ما فُعل بهم أو ما فُعل لأجلهم، والسياق يرجّح هنا معنى الخدمة المقدَّمة لأجلهم.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅτε οὖν
  choice: فبعدما
  rationale: تجمع «فـ» بين الربط والتتابع السردي اللذين تفيدهما οὖν، وتؤدي «بعدما» معنى الجملة الزمنية وتوضح اكتمال الفعل السابق.
- source_word: ἔνιψεν τοὺς πόδας αὐτῶν
  choice: غسل أقدامهم
  rationale: ترجمة عربية مباشرة وطبيعية للفعل ومفعوله، والسياق الزمني مع «بعدما» يدل على اكتمال الغسل.
- source_word: ἔλαβεν τὰ ἱμάτια αὐτοῦ
  choice: أخذ ثيابه
  rationale: تحافظ على المعنى المعجمي المباشر لـ ἔλαβεν وἱμάτια دون إضافة «الخارجية» أو تفسير الفعل صراحة بمعنى «لبس».
- source_word: ἀνέπεσεν
  choice: اتكأ من جديد
  rationale: الفعل في سياق الطعام يشير إلى الاتكاء إلى المائدة، وهو أدق تاريخيًا من «جلس»، مع صياغة عربية مفهومة.
- source_word: πάλιν
  choice: من جديد
  rationale: تؤدي معنى التكرار بصورة طبيعية، وترتبط هنا بعودة يسوع إلى موضعه عند المائدة.
- source_word: Γινώσκετε
  choice: هل تفهمون
  rationale: السؤال يتناول إدراك مغزى الفعل، ولذلك «تفهمون» أنسب سياقيًا من مجرد «تعرفون».
- source_word: τί πεποίηκα ὑμῖν
  choice: ما فعلته لأجلكم
  rationale: الصيغة العربية تحافظ على الأثر الراهن للفعل التام بقدر ما تسمح به العربية، وتعرض القراءة النفعية المحتملة للداتيف مع التنبيه إلى البديل في الحاشية.
theological_decisions:
- issue: هيئة يسوع عند عودته إلى المائدة
  choice: اتكأ من جديد
  alternative: جلس من جديد؛ عاد إلى مكانه عند المائدة
  rationale: يحفظ الاختيار الصورة التاريخية التي يدل عليها ἀνέπεσεν في سياق الوليمة، من غير بناء دلالة عقائدية عليها.
- issue: دلالة ὑμῖν في سؤال يسوع
  choice: لأجلكم
  alternative: بكم؛ لكم
  rationale: «لأجلكم» تلائم دلالة المنفعة في سياق خدمة غسل الأرجل، مع بقاء الداتيف قابلًا لصياغة أقرب إلى «بكم/لكم»، ولذلك أُثبت البديل في الحاشية بدل إخفاء الاحتمال.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «اتكأ» للمحافظة على هيئة تناول الطعام في القرن الأول، وأُبقي «أخذ ثيابه» قريبًا من اللفظ اليوناني دون الزيادة التفسيرية «لبسها». وُضعت علامتا الحاشيتين في المتن عند موضعي البديلين.
