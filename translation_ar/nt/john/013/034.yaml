base_translation:
  language: en
  yaml_path: translation/nt/john/013/034.yaml
  text: 'A new commandment I give to you: that you love one another[a]. Just as I loved you[b], you also are to love one another.'
translation:
  language: ar
  text: 'وصية جديدة أعطيكم: أن تحبوا بعضكم بعضًا. كما أحببتكم، فأحبّوا أنتم أيضًا بعضكم بعضًا.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لكي تحبّوا أنتم أيضًا بعضكم بعضًا».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐντολὴν
  choice: وصيةً
  rationale: «وصية» هي المقابل العربي الطبيعي في السياق اليوحنّاوي، وتحفظ القوة الأخلاقية الرسمية للكلمة.
- source_word: καινὴν
  choice: جديدةً
  rationale: تنقل المعنى المباشر دون أن تحسم هل الجِدّة زمنية أم نوعية أم متعلقة بتحققها في محبة يسوع.
- source_word: δίδωμι ὑμῖν
  choice: أعطيكم
  rationale: صيغة عربية موجزة وطبيعية تحفظ زمن الحاضر والمخاطَبين بوصفهم متلقّي الوصية.
- source_word: ἀγαπᾶτε / ἠγάπησα
  choice: تحبّوا / أحببتكم / أحبّوا
  rationale: يحفظ جذر «المحبة» وتكراره المحوري في الآية، مع صيغ عربية تلائم وظيفة كل جملة.
- source_word: ἀλλήλους
  choice: بعضكم بعضًا
  rationale: المقابل العربي الفصيح والطبيعي للدلالة التبادلية.
- source_word: καθὼς
  choice: كما
  rationale: تبيّن أن محبة يسوع هي المثال أو المقياس، من غير توسع تفسيري.
- source_word: ἵνα καὶ ὑμεῖς ἀγαπᾶτε ἀλλήλους
  choice: هكذا أنتم أيضًا أحبّوا بعضكم بعضًا
  rationale: تبرز καὶ ὑμεῖς («أنتم أيضًا») وتحفظ القوة الحثّية، مع إرفاق حاشية تبين إمكان فهم ἵνα على أنه غاية أو نتيجة.
theological_decisions:
- issue: طبيعة «الوصية الجديدة»
  choice: الإبقاء على «جديدة» دون تفسير وجه الجِدّة في المتن
  alternative: تفسيرها بأنها جديدة زمنيًا، أو جديدة في نوعيتها، أو جديدة في تحققها بمحبة يسوع
  rationale: الآية تصف الوصية بأنها جديدة، لكنها لا تحدد داخل هذا العدد وحده وجه هذه الجِدّة.
- issue: وظيفة جملة ἵνα الثانية
  choice: 'صياغتها بصيغة حثّية: «هكذا أنتم أيضًا أحبّوا...»'
  alternative: «لكي تحبّوا أنتم أيضًا بعضكم بعضًا»
  rationale: السياق سياق وصية، لكن ἵνα يمكن أن تُفهم أيضًا بوصفها دالة على الغاية أو النتيجة؛ لذلك حُفظ البديل في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. قُدّمت «وصيةً جديدةً» للمحافظة على بروز العبارة في اليونانية، واستُخدمت صيغة الأمر في الخاتمة لإظهار القوة الحثّية مع عدم إخفاء البديل النحوي في الحاشية.
