base_translation:
  language: en
  yaml_path: translation/nt/john/013/009.yaml
  text: Simon Peter says to him[a], “Lord, not only my feet, but also my hands and my head.”
translation:
  language: ar
  text: 'يقول له سمعان بطرس: «يا رب[a]، لا تغسل قدميَّ فقط، بل يديَّ ورأسي أيضًا!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يا سيد». اليونانية: «كيريوس».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: يقول
  rationale: حُفظ المضارع السردي اليوناني لإبراز حيوية المشهد، وهو سائغ في السرد العربي.
- source_word: αὐτῷ
  choice: له
  rationale: نُقل الضمير كما في اليونانية من غير استبداله بالاسم الصريح «يسوع»، لأن مرجعه واضح من السياق.
- source_word: Σίμων Πέτρος
  choice: سمعان بطرس
  rationale: استُخدمت الصيغة العربية الكتابية المألوفة للاسمين.
- source_word: Κύριε
  choice: يا رب
  rationale: «رب» المقابل المعتاد للقب κύριος، ويحفظ دلالة الاحترام والرنين اللاهوتي في يوحنا، مع أداة النداء الطبيعية في العربية.
- source_word: μὴ ... μόνον ἀλλὰ καὶ
  choice: ليس ... فقط، بل ... أيضًا
  rationale: 'صياغة عربية طبيعية تحفظ بنية التوسيع التقابلي: لا هذا وحده، بل أشياء أخرى معه.'
- source_word: τοὺς πόδας μου
  choice: قدميَّ
  rationale: نقل مباشر للجمع اليوناني بمعنى القدمين؛ والمثنى هو التعبير العربي الطبيعي الدقيق.
- source_word: τὰς χεῖρας
  choice: يديَّ
  rationale: أُثبت ضمير المتكلم المفهوم من التنسيق، واستُعمل المثنى العربي الطبيعي.
- source_word: τὴν κεφαλήν
  choice: رأسي
  rationale: المعنى المعجمي المباشر، مع إظهار ضمير الملكية المفهوم من التنسيق.
theological_decisions:
- issue: ترجمة κύριος في نداء موجَّه إلى يسوع
  choice: يا رب
  alternative: يا سيد
  rationale: «يا رب» تحفظ اللقب المعتاد في العهد الجديد وما يحمله في إنجيل يوحنا من اتساع دلالي، من غير أن تحسم بأكثر مما يتيحه السياق المباشر؛ وتُذكر «يا سيد» بوصفها بديلًا معجميًا ممكنًا.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. حُفظ المضارع السردي، واستُعمل المثنى في أعضاء الجسد على نحو طبيعي. وُضعت علامة التعجب لإظهار اندفاع جواب بطرس، وهو مستفاد من السياق والنبرة لا من علامة ترقيم أصلية في المخطوطات.
