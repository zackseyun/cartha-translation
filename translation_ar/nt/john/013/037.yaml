  text: λέγει αὐτῷ ⸀ὁ Πέτρος· Κύριε, διὰ τί οὐ δύναμαί σοι ⸀ἀκολουθῆσαι ἄρτι; τὴν ψυχήν μου ὑπὲρ σοῦ θήσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/037.yaml
  text: Peter said to him[a], “Lord[b], why am I not able to follow you now? I will lay down my life for you.”
translation:
  language: ar
  text: 'قال له بطرس: «يا رب، لماذا لا أستطيع أن أتبعك الآن؟[a] سأبذل حياتي من أجلك».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في هذه اللحظة؟»'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا في اليونانية: «نفسي»، والمقصود في هذا التعبير: «حياتي».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: قال
  rationale: جاء الفعل في اليونانية بصيغة الحاضر السردي، لكن الماضي هو الأسلوب الطبيعي في السرد العربي ويحفظ المعنى.
- source_word: Κύριε
  choice: يا رب
  rationale: صيغة النداء العربية الطبيعية، وتحفظ معنى الاحترام وما قد يحمله اللقب من دلالة لاهوتية من غير حسم زائد.
- source_word: διὰ τί οὐ δύναμαί
  choice: لماذا لا أستطيع
  rationale: ترجمة واضحة ومباشرة للسؤال، وتحافظ على تركيز العبارة في عدم القدرة.
- source_word: σοι ἀκολουθῆσαι
  choice: أن أتبعك
  rationale: يحفظ فعل «أتبع» البعدين المكاني والتلمذي الحاضرين في سياق يوحنا.
- source_word: ἄρτι
  choice: الآن
  rationale: مقابل عربي موجز وطبيعي يدل على الزمن الحاضر المباشر.
- source_word: τὴν ψυχήν μου
  choice: حياتي
  rationale: ψυχή في تركيب بذل النفس تدل هنا على الحياة التي يُضحّى بها في الموت، لا على «النفس» بمعنى ميتافيزيقي مجرد.
- source_word: ὑπὲρ σοῦ
  choice: من أجلك
  rationale: تعبير عربي طبيعي يترك مجال الدلالة مفتوحًا بين العمل لمصلحة الآخر والتضحية لأجله، من غير فرض معنى بدلي تقني.
- source_word: θήσω
  choice: سأبذل
  rationale: يؤدي المعنى الاصطلاحي للفعل مع «الحياة»، أي تقديمها والتضحية بها، بصورة عربية طبيعية.
theological_decisions:
- issue: دلالة ψυχή في تصريح بطرس
  choice: حياتي
  alternative: نفسي
  rationale: السياق يتناول استعداد بطرس للموت من أجل يسوع، ولذلك فالمقصود هو الحياة المبذولة، مع إثبات اللفظ الحرفي في الحاشية.
- issue: دلالة ἀκολουθέω
  choice: أتبعك
  alternative: أرافقك / أذهب معك
  rationale: «أتبعك» تحافظ على التوتر المقصود بين اللحاق المكاني باتجاه ذهاب يسوع واتباعه بوصف بطرس تلميذًا.
- issue: مدى دلالة ὑπέρ
  choice: من أجلك
  alternative: نيابةً عنك
  rationale: لا تفرض العبارة هنا وحدها مفهوم النيابة بمعناه التقني؛ و«من أجلك» تحفظ اتساع الدلالة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «قال» بدل الحاضر السردي اليوناني، و«سأبذل حياتي» لتأدية الاصطلاح بصورة طبيعية، مع إبقاء دلالة الاتباع وعبارة «من أجلك» غير محصورة في تفسير لاهوتي بعينه.
