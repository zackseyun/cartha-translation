  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ⸀ἀποκρίνεται Ἰησοῦς· Τὴν ψυχήν σου ὑπὲρ ἐμοῦ θήσεις; ἀμὴν ἀμὴν λέγω σοι, οὐ μὴ ἀλέκτωρ φωνήσῃ ἕως οὗ ⸀ἀρνήσῃ με τρίς.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/038.yaml
  text: Jesus answered[a], “Will you lay down your life for me? Truly, truly, I say to you, the rooster will certainly not crow until you have denied me three times.”
translation:
  language: ar
  text: 'أجاب يسوع: «أتبذل حياتك[a] من أجلي؟ الحق الحق أقول لك: لن يصيح الديك حتى تنكرني ثلاث مرات».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «نفسك». يمكن للكلمة اليونانية ψυχή أن تعني «النفس» أو «الحياة»، والمقصود هنا بذل المرء حياته.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκρίνεται
  choice: أجاب
  rationale: المضارع التاريخي اليوناني يُنقل بالماضي، وهو الأسلوب الطبيعي في السرد العربي.
- source_word: τὴν ψυχήν σου
  choice: حياتك
  rationale: في تركيب «وضع النفس» يدل السياق على بذل الحياة والموت من أجل شخص، لا على تحديد مفهوم النفس غير المادية.
- source_word: ὑπὲρ ἐμοῦ
  choice: من أجلي
  rationale: تعبير عربي موجز وطبيعي ينقل معنى النيابة أو المنفعة المقصود هنا.
- source_word: θήσεις
  choice: أتبذل
  rationale: «بذل الحياة» هو المقابل العربي الاصطلاحي الواضح لعبارة وضع النفس، ويحافظ على معنى التضحية.
- source_word: ἀμὴν ἀμὴν
  choice: الحق الحق
  rationale: يحفظ التكرار والتوكيد الرسمي المميز لكلام يسوع في إنجيل يوحنا.
- source_word: οὐ μὴ
  choice: لن
  rationale: أداة النفي المستقبلية القوية في العربية تنقل النفي المؤكد، ويعزز السياق حتميته.
- source_word: ἀλέκτωρ φωνήσῃ
  choice: يصيح الديك
  rationale: هذا هو التعبير العربي المألوف لصوت الديك.
- source_word: ἕως οὗ
  choice: حتى
  rationale: تحفظ الحد الزمني الوارد في الأصل من غير تحويله إلى تفسير مطوّل.
- source_word: ἀρνήσῃ με
  choice: تنكرني
  rationale: ينقل فعل الإنكار أو التنصل من معرفة يسوع بصياغة عربية مباشرة.
- source_word: τρίς
  choice: ثلاث مرات
  rationale: صياغة عربية معاصرة واضحة تحفظ العدد والتكرار.
theological_decisions:
- issue: دلالة ψυχή في سياق استعداد بطرس للتضحية
  choice: حياتك
  alternative: نفسك
  rationale: السياق يتناول استعداد بطرس للموت من أجل يسوع؛ لذلك تنقل «حياتك» المعنى العملي المقصود من غير فرض تصور أنثروبولوجي أضيق.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم الماضي في السرد، وحُفظ تكرار الصيغة التوكيدية «الحق الحق»، ووُضعت علامة الحاشية عند اللفظة التي تتناولها مباشرة.
