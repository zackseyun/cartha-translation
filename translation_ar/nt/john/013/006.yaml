  text: So he comes to Simon Peter. He says to him[a], “Lord, are you washing my feet?”
translation:
  language: ar
  text: 'فجاء إلى سمعان بطرس، فقال له: «يا رب[أ]، أأنت تغسل قدميَّ؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: أ
    text: 'أو: «يا سيدي». يمكن أن تُستعمل الكلمة اليونانية κύριε نداءً احتراميًا، مع أن ترجمتها هنا بـ«يا رب» هي الترجمة الأساسية.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔρχεται
  choice: فجاء
  rationale: المضارع التاريخي اليوناني يضفي حيوية على السرد، لكن الماضي هو الأسلوب الطبيعي الواضح في السرد العربي، والفاء تربط الحدث بما قبله.
- source_word: οὖν
  choice: فـ
  rationale: تفيد هنا الانتقال والنتيجة في سياق السرد، وتؤدي الفاء هذا الربط بإيجاز وطبيعية.
- source_word: πρὸς Σίμωνα Πέτρον
  choice: إلى سمعان بطرس
  rationale: تعبر «إلى» بوضوح عن الحركة نحو الشخص، وتحافظ على الاسم المركب كما في المصدر.
- source_word: λέγει αὐτῷ
  choice: فقال له
  rationale: صيغ الماضي أنسب للسرد العربي الطبيعي، و«له» تقابل αὐτῷ صراحة.
- source_word: Κύριε
  choice: يا رب
  rationale: تحافظ على معنى المخاطبة الاحترامية وعلى الصدى المسيحاني الممكن في إنجيل يوحنا، دون حصر اللفظ في معنى أقل دلالة مثل «يا سيدي».
- source_word: σύ
  choice: أأنت
  rationale: إظهار الضمير المنفصل بعد همزة الاستفهام ينقل توكيد الضمير اليوناني ويبرز دهشة بطرس.
- source_word: μου
  choice: قدميَّ
  rationale: أُدي معنى الملكية بضمير المتكلم المتصل، وهو التعبير العربي الطبيعي.
- source_word: νίπτεις
  choice: تغسل
  rationale: الفعل يدل على غسل جزء من الجسد، والسياق يوضح أن المقصود غسل القدمين؛ والمضارع العربي ملائم للفعل الجاري أو المزمع مباشرة.
- source_word: τοὺς πόδας
  choice: قدميَّ
  rationale: استُعمل المثنى لأن الحديث عن قدمي بطرس، مع ضمير الملكية الذي يقابل μου.
theological_decisions:
- issue: ترجمة Κύριε في خطاب بطرس ليسوع
  choice: يا رب
  alternative: يا سيدي
  rationale: «يا رب» هي الترجمة الافتراضية التي تحفظ معًا الاحترام في الخطاب والعمق المسيحاني المحتمل، بينما يظل «يا سيدي» احتمالًا لغويًا مشروعًا لكنه أضعف في نقل صدى اللفظ داخل الإنجيل.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختير الماضي للسرد الطبيعي، مع الحفاظ على توكيد σύ بصيغة «أأنت». لم تُضف حاشية لأن «يا رب» ملائمة سياقيًا، ولأن إدراج بديل «يا سيدي» ليس ضروريًا لفهم الآية.
