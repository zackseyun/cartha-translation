  text: ἀπ’ ἄρτι λέγω ὑμῖν πρὸ τοῦ γενέσθαι, ἵνα ⸂πιστεύσητε ὅταν γένηται⸃ ὅτι ἐγώ εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/019.yaml
  text: From now on I am telling you before it happens[a], so that when it does happen, you may believe that I am he.
translation:
  language: ar
  text: من الآن أقول لكم، قبل أن يحدث، لكي تؤمنوا، حين يحدث، أني أنا هو.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بحرفية أكثر: «أني أنا». وقد تحمل العبارة اليونانية أيضًا صدى تعريف الله بنفسه في إشعياء وفي مواضع أخرى من إنجيل يوحنا.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπ’ ἄρτι
  choice: من الآن
  rationale: تعبير زمني عربي طبيعي يحفظ دلالة الانطلاق من اللحظة الحاضرة إلى ما بعدها.
- source_word: λέγω ὑμῖν
  choice: أقول لكم
  rationale: ينقل المضارع والخطاب المباشر بعبارة عربية واضحة، من غير إثقالها بدلالة الاستمرار.
- source_word: πρὸ τοῦ γενέσθαι
  choice: قبل أن يحدث
  rationale: يحفظ العلاقة الزمنية التي تفيدها πρό مع المصدر، مع إبقاء الحدث غير مصرّح به كما في اليونانية.
- source_word: ἵνα πιστεύσητε
  choice: لكي تؤمنوا
  rationale: «لكي» تحفظ معنى الغاية، و«تؤمنوا» هي المقابل المعتاد هنا لـ πιστεύω من غير فرض معنى ابتدائي أو تخصيصه بالثقة فقط.
- source_word: ὅταν γένηται
  choice: متى حدث
  rationale: «متى» مع الفعل الماضي في هذا السياق أسلوب فصيح يدل على وقوع مستقبلي منتظر، ويحفظ الصلة اللفظية بالفعل السابق.
- source_word: ὅτι ἐγώ εἰμι
  choice: أني أنا هو
  rationale: صياغة عربية مفهومة تحفظ قوة التعريف بالذات، ولا تضيف مسندًا اسميًا محددًا غير موجود في النص اليوناني؛ وتوضح الحاشية الصيغة الأقرب حرفيًا.
theological_decisions:
- issue: العبارة المطلقة ἐγώ εἰμι في سياق يوحنا واحتمال صداها مع إعلان الهوية الإلهية
  choice: أني أنا هو
  alternative: أني أنا
  rationale: «أنا هو» مفهومة عربيًا وتحفظ العبارة بلا تعيين لهوية المسند المحذوف، بينما تُذكر الصيغة الحرفية «أنا» في الحاشية للمحافظة على الغموض المقصود واحتمال الصدى الكتابي، من غير حسم لاهوتي زائد.
translation_notes:
  register: عربية فصحى حديثة، واضحة وموقرة. حوفظ على تكرار فعل «حدث» وعلى غموض الحدث في الأصل، كما وُضعت علامة الحاشية مباشرة بعد العبارة التي تشرحها.
