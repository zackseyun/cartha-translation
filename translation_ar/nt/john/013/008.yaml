  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: λέγει αὐτῷ Πέτρος· Οὐ μὴ νίψῃς ⸂μου τοὺς πόδας⸃ εἰς τὸν αἰῶνα. ἀπεκρίθη ⸂Ἰησοῦς αὐτῷ⸃· Ἐὰν μὴ νίψω σε, οὐκ ἔχεις μέρος μετ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/008.yaml
  text: Peter said to him[a], “You will never wash my feet.” Jesus answered him, “If I do not wash you, you have no share with me.”
translation:
  language: ar
  text: 'قال له بطرس: «لن تغسل قدميَّ أبدًا!» أجابه يسوع: «إن لم أغسلك، فلا نصيب لك معي[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فلا حصة لك معي».'
    reason: بديل معجمي للفظ μέρος، الذي يمكن أن يدل على النصيب أو الحصة أو الجزء.
lexical_decisions:
- source_word: Οὐ μὴ νίψῃς … εἰς τὸν αἰῶνα
  choice: لن تغسل … أبدًا
  rationale: يجمع هذا التعبير بين النفي المؤكد οὐ μή والعبارة الاصطلاحية εἰς τὸν αἰῶνα، فيفيد رفضًا قاطعًا لحدوث الفعل مستقبلًا. والصياغة العربية طبيعية وتحفظ قوة قول بطرس.
- source_word: μου τοὺς πόδας
  choice: قدميَّ
  rationale: ترجمة مباشرة للمفعول به مع ضمير المتكلم، من غير إضافة تفسيرية.
- source_word: ἀπεκρίθη Ἰησοῦς αὐτῷ
  choice: أجابه يسوع
  rationale: صياغة سردية عربية طبيعية تحفظ معنى فعل الإجابة ومرجع الضمير.
- source_word: Ἐὰν μὴ νίψω σε
  choice: إن لم أغسلك
  rationale: تحفظ بنية الشرط الصريحة، كما تحافظ على كون مفعول الغسل هو شخص بطرس كله في جواب يسوع، لا قدميه وحدهما.
- source_word: νίψω / νίψῃς
  choice: أغسل / تغسل
  rationale: الفعل اليوناني يدل على الغسل، ولا يتطلب إضافة معنى التطهير أو التنظيف الكامل في متن الترجمة.
- source_word: οὐκ ἔχεις μέρος
  choice: فلا نصيب لك
  rationale: «نصيب» تنقل المجال الدلالي لـ μέρος، الذي قد يعني الجزء أو الحصة أو المشاركة، وتصلح في العربية للتعبير عن الاشتراك أو الانتماء من غير حسم آليته اللاهوتية.
- source_word: μετ’ ἐμοῦ
  choice: معي
  rationale: حرف μετά مع المضاف إليه يفيد المصاحبة أو الارتباط؛ و«معي» أدق من «فيَّ»، التي قد تستورد تعبيرًا يوحناويًا آخر غير موجود هنا.
theological_decisions:
- issue: دلالة أن يكون لبطرس μέρος مع يسوع
  choice: الإبقاء على معنى النصيب أو المشاركة مع يسوع من غير تحديد آلية أسرارية أو خلاصية بعينها
  alternative: تفسير العبارة صراحة بأنها تشير إلى المعمودية أو التطهير الخلاصي أو مجرد الاتضاع في الخدمة
  rationale: يؤكد النص ضرورة غسل يسوع لبطرس لكي يكون له نصيب معه، لكنه لا يحدد في هذه الآية وحدها الكيفية اللاهوتية الدقيقة؛ لذلك تحفظ الترجمة اتساع اللفظ والتوتر الدلالي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُخدم «لن… أبدًا» لإظهار شدة رفض بطرس، و«قدميَّ» بصيغة المثنى الطبيعية، ووُضع هامش البديل عند العبارة التي يشرحها.
