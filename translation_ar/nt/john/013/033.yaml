  text: τεκνία, ἔτι μικρὸν μεθ’ ὑμῶν εἰμι· ζητήσετέ με, καὶ καθὼς εἶπον τοῖς Ἰουδαίοις ὅτι Ὅπου ⸂ἐγὼ ὑπάγω⸃ ὑμεῖς οὐ δύνασθε ἐλθεῖν, καὶ ὑμῖν λέγω ἄρτι.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/033.yaml
  text: Little children[a], I am with you a little while longer. You will seek me, and just as I said to the Jews, ‘Where I am going[b], you are not able to come,’ so now I also say to you.
translation:
  language: ar
  text: '«يا أولادي الصغار، ما زلت معكم وقتًا قليلًا. ستبحثون عني، وكما قلت لليهود[a]: ‹حيث أذهب أنا، لا تقدرون أن تأتوا[b]›، أقول لكم الآن أيضًا.»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لقادة اليهود»، لأن لفظ «اليهود» في إنجيل يوحنا قد يشير أحيانًا، بحسب السياق، إلى القيادات اليهودية على وجه أخص.'
    reason: alternative_reading
  - marker: b
    text: 'أو بصياغة أبسط: «لا تستطيعون أن تأتوا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τεκνία
  choice: يا أولادي الصغار
  rationale: صيغة نداء حنونة تحمل معنى البنوة والتصغير؛ وهذه الصياغة تحفظ الصورة العائلية ونبرة المودة بعبارة عربية واضحة.
- source_word: ἔτι μικρὸν μεθ’ ὑμῶν εἰμι
  choice: لن أبقى معكم إلا وقتًا قليلًا
  rationale: ينقل المعنى الزمني، أي قِصَر المدة المتبقية لوجوده معهم، بصياغة عربية طبيعية، من غير أن يضيف سبب الرحيل أو طبيعته.
- source_word: ζητήσετέ με
  choice: ستبحثون عني
  rationale: يعبر بوضوح عن طلب العثور عليه؛ وهو في العربية المعاصرة أقل التباسًا من «ستطلبونني».
- source_word: τοῖς Ἰουδαίοις
  choice: لليهود
  rationale: يحافظ على الدلالة المباشرة للفظ اليوناني ولا يضيّق المرجع إلى القادة وحدهم من غير قرينة حاسمة في هذه الآية.
- source_word: Ὅπου ἐγὼ ὑπάγω
  choice: حيث أذهب أنا
  rationale: يحفظ معنى الذهاب والمقابلة المؤكدة بالضمير ἐγώ، من غير تفسير وجهة الذهاب صراحة.
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: لا تقدرون أن تأتوا
  rationale: يحافظ على عنصر القدرة في δύνασθε بدل اختزاله إلى صيغة نفي مجردة.
- source_word: καὶ ὑμῖν λέγω ἄρτι
  choice: أقول لكم الآن أيضًا
  rationale: يبين أن القول السابق لليهود يُوجَّه الآن كذلك إلى التلاميذ، مع إبقاء التركيز على «الآن».
theological_decisions:
- issue: مرجع «اليهود» في سياق إنجيل يوحنا
  choice: اليهود
  alternative: قادة اليهود
  rationale: اللفظ اليوناني أوسع من «القادة»، والآية نفسها لا تحسم تضييق المرجع؛ لذلك بقي اللفظ في المتن، مع ذكر الاحتمال السياقي في الحاشية.
- issue: طبيعة عدم القدرة على المجيء
  choice: لا تقدرون أن تأتوا
  alternative: لا تستطيعون أن تأتوا / لا يمكنكم أن تأتوا
  rationale: لا يحدد النص هنا هل العجز مؤقت أو متعلق بوجهة يسوع أو بظرف آخر؛ فحُفظ التعبير من غير شرح لاهوتي زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظت نبرة المودة في النداء، واستُعملت صياغة طبيعية لقِصَر المدة المتبقية، مع تجنب تفسير وجهة يسوع أو سبب عجز المخاطَبين عن اللحاق به.
