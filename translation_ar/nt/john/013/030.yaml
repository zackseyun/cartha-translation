base_translation:
  language: en
  yaml_path: translation/nt/john/013/030.yaml
  text: So after taking the piece of bread[a], he went out immediately[c][b]. And it was night.
translation:
  language: ar
  text: فبعد أن أخذ ذاك[a] قطعة الخبز[b]، خرج في الحال. وكان ليلًا[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «ذاك». التعبير اليوناني أوكد من ضمير بسيط، ويلفت الانتباه إلى يهوذا.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا: «اللقمة» أو «القطعة». تشير الكلمة اليونانية إلى قطعة صغيرة من الخبز أو الطعام قُدِّمت في أثناء الوجبة.'
    reason: lexical_alternative
  - marker: c
    text: ذكرُ الليل هنا إشارة زمنية حرفية، وقد يكون له أيضًا صدى مع موضوع النور والظلمة في إنجيل يوحنا.
    reason: cross_reference
lexical_decisions:
- source_word: λαβὼν
  choice: بعد أن أخذ
  rationale: يؤدي اسم الفاعل اليوناني في هذا السياق وظيفة زمنية، فتُظهر الصياغة العربية تعاقب أخذ القطعة ثم الخروج.
- source_word: οὖν
  choice: فـ
  rationale: الفاء تربط الجملة بما قبلها وتناسب التقدم السردي الذي تدل عليه οὖν من غير إثقال الأسلوب بـ«لذلك».
- source_word: τὸ ψωμίον
  choice: قطعة الخبز
  rationale: تشير الكلمة إلى قطعة صغيرة من الخبز أو الطعام؛ و«قطعة الخبز» واضحة ومعاصرة وتحافظ على الإشارة إلى الخبز في سياق المائدة.
- source_word: ἐκεῖνος
  choice: ذاك
  rationale: اسم الإشارة اليوناني أوكد من ضمير بسيط، و«ذاك» يحفظ إبراز يهوذا ومسحة التبعيد في السرد من غير إضافة تفسير.
- source_word: ἐξῆλθεν
  choice: خرج
  rationale: ينقل المعنى المكاني المباشر للفعل ἐξέρχομαι بإيجاز وطبيعية.
- source_word: εὐθύς
  choice: في الحال
  rationale: تعبير عربي فصيح طبيعي يدل على وقوع الخروج دون إبطاء.
- source_word: ἦν δὲ νύξ
  choice: وكان ليلًا
  rationale: يحفظ العبارة الزمنية البسيطة وقوتها الأدبية، من غير إدخال معناها الرمزي المحتمل في صلب الترجمة.
theological_decisions:
- issue: الدلالة الرمزية المحتملة لليل في إنجيل يوحنا
  choice: 'إبقاء العبارة خبرًا زمنيًا مباشرًا: «وكان ليلًا».'
  alternative: التصريح في المتن بأن الليل يرمز إلى الظلمة الروحية.
  rationale: النص اليوناني يذكر الليل مباشرة، وقد يكتسب ضمن سياق الإنجيل صدى رمزيًا، لكن التصريح بهذا الصدى في المتن يحسم ما تركه النص موحيًا.
- issue: قوة اسم الإشارة ἐκεῖνος في الإحالة إلى يهوذا
  choice: ترجمته بـ«ذاك» للمحافظة على التوكيد والتبعيد السردي.
  alternative: 'ترجمته بضمير بسيط: «هو».'
  rationale: يحافظ اسم الإشارة على الصياغة المميزة في الأصل من غير أن يضيف حكمًا عقائديًا على يهوذا.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة ووقورة. استُعملت الفاء للربط السردي، وحُفظ إيجاز الجملة الأخيرة وقوتها، كما أُبقي اسم الإشارة الموكِّد بدل تسويته إلى ضمير عادي.
