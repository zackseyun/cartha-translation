source:
  edition: SBLGNT
  text: λέγει αὐτῷ ⸀ὁ Ἰησοῦς· Ὁ λελουμένος ⸂οὐκ ἔχει χρείαν⸃ ⸂εἰ μὴ⸃ τοὺς πόδας νίψασθαι, ἀλλ’ ἔστιν καθαρὸς ὅλος· καὶ ὑμεῖς καθαροί ἐστε, ἀλλ’ οὐχὶ πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/010.yaml
  text: Jesus said to him[a], “The one who has bathed has no need except to wash his feet, but is completely clean. And you are clean, but not all of you.”
translation:
  language: ar
  text: 'قال له يسوع: «مَن اغتسل[a] لا حاجة له إلا إلى غسل قدميه، بل هو طاهر كله. وأنتم طاهرون، لكن ليس كلكم».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تستعمل اليونانية فعلين مختلفين للغسل: λούω، أي «اغتسل» ويُستعمل لغسل الجسد كله، وνίπτω، أي «غسل» ويُستعمل كثيرًا لغسل عضو من الجسد، كالقدمين.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ λελουμένος
  choice: مَن اغتسل
  rationale: يحافظ الفعل «اغتسل» على معنى λούω الدال هنا على غسل الجسد كله، وعلى دلالة الحالة الناتجة من الفعل التام، بصياغة عربية طبيعية.
- source_word: οὐκ ἔχει χρείαν
  choice: لا حاجة له
  rationale: مقابل عربي واضح وقريب من تركيب اليونانية، مع بقاء الأسلوب فصيحًا وطبيعيًا.
- source_word: εἰ μὴ
  choice: إلا
  rationale: تفيد الاستثناء الوحيد من النفي السابق بإيجاز ووضوح.
- source_word: τοὺς πόδας νίψασθαι
  choice: إلى غسل قدميه
  rationale: يميّز «غسل» عن «اغتسل»، وينقل المفعول المحدد «القدمين» مع ضمير يعود إلى الشخص المفرد، من غير تشديد غير لازم على فاعل الغسل.
- source_word: καθαρὸς ὅλος
  choice: طاهر كله
  rationale: «طاهر» تلائم النظافة الحسية وتبقي الإيحاء الروحي ممكنًا، و«كله» تحفظ توكيد ὅλος على الشمول.
- source_word: καὶ ὑμεῖς καθαροί ἐστε
  choice: وأنتم طاهرون
  rationale: يحافظ على الخطاب بصيغة الجمع وعلى تكرار لفظ καθαρός الموضوعي.
- source_word: ἀλλ’ οὐχὶ πάντες
  choice: لكن ليس كلكم
  rationale: يوضح أن الاستثناء واقع داخل جماعة المخاطبين، من غير تعيين الشخص في نص الآية.
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: قال له يسوع
  rationale: نُقل المضارع التاريخي بصيغة الماضي الملائمة للسرد العربي.
theological_decisions:
- issue: التداخل بين الغسل الحسي والطهارة الرمزية أو الروحية
  choice: الإبقاء على ألفاظ «اغتسل» و«غسل قدميه» و«طاهر» من غير تفسير رمزي صريح
  alternative: إضافة وصف مثل «طاهر روحيًا» أو توحيد فعلي الغسل في لفظ واحد
  rationale: يعمل القول على المستويين الحسي والرمزي، والنص لا يصرّح هنا بتفسير عقائدي محدد؛ لذلك تحفظ الصياغة الصورة والتوتر الدلالي.
- issue: الموصول المفرد المذكر في Ὁ λελουμένος
  choice: مَن اغتسل
  alternative: الرجل الذي اغتسل أو الذي اغتسل
  rationale: «مَن» تؤدي المعنى العام للمفرد من غير إدخال تخصيص جنسي لا يقتضيه المقصود، مع بقاء الفعل مفردًا.
translation_notes:
  register: العربية فصحى حديثة واضحة ذات نبرة كتابية كريمة. استُعمل «طاهر» بدل «نظيف» للمحافظة على قابلية اللفظ للمعنى الحسي والرمزي معًا، ووُضع رمز الحاشية بعد «اغتسل» لأنه موضع بدء المقابلة بين فعلي الغسل.
