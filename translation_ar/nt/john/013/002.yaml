lexical_decisions:
- source_word: δείπνου γινομένου
  choice: في أثناء العشاء
  rationale: ينقل التركيب الإضافي المطلق ظرفًا متزامنًا، ويوضح أن العشاء كان جاريًا لا أنه انتهى.
- source_word: διάβολος
  choice: إبليس
  rationale: اللفظ هنا لقب للكائن الشرير الشخصي، و«إبليس» هو المقابل العربي الكتابي الواضح والطبيعي.
- source_word: ἤδη βεβληκότος εἰς τὴν καρδίαν
  choice: وقد ألقى ... في قلب
  rationale: يحفظ استعارة النص اليوناني ويفيد أن غرس النية قد وقع بالفعل، من غير أن يلغي مسؤولية يهوذا.
- source_word: καρδίαν
  choice: قلب
  rationale: يحفظ الصورة الأنثروبولوجية الأصلية، حيث يشمل القلب الإرادة والقصد ولا يقتصر على العاطفة.
- source_word: ἵνα παραδοῖ
  choice: أن يسلّمه
  rationale: يحفظ المعنى الأساسي للفعل، أي تسليم يسوع إلى خصومه، بينما يُفهم من السياق أن هذا التسليم خيانة.
- source_word: Ἰούδας Σίμωνος Ἰσκαριώτου
  choice: يهوذا الإسخريوطي، ابن سمعان
  rationale: يعكس على نحو طبيعي القراءة النصية التي تجعل «الإسخريوطي» وصفًا ليهوذا، ويزيل في العربية احتمال وصف سمعان به.
theological_decisions:
- issue: فاعلية إبليس ومسؤولية يهوذا في تسليم يسوع
  choice: ألقى إبليس النية في قلب يهوذا، ويهوذا هو الذي سيسلّم يسوع
  alternative: أوعز إبليس إلى يهوذا؛ أو تصرّف إبليس وحده من خلال يهوذا
  rationale: يحفظ النص معًا التأثير الشيطاني وفاعلية يهوذا البشرية، من غير حسم جدل الجبر أو المسؤولية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُعمل «في أثناء العشاء» لتجنب الإيحاء بانتهاء العشاء، وحُفظت استعارة القلب. وُضعت العلامات [b][c] بعد العبارة التي تشرحانها.
