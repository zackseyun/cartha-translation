  text: Ὅτε ⸀οὖν ἐξῆλθεν ⸀λέγει Ἰησοῦς· Νῦν ἐδοξάσθη ὁ υἱὸς τοῦ ἀνθρώπου, καὶ ὁ θεὸς ἐδοξάσθη ἐν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/013/031.yaml
  text: So when he had gone out[a], Jesus said, “Now the Son of Man has been glorified, and God has been glorified in him.”
translation:
  language: ar
  text: 'فلما خرج، قال يسوع: «الآن تمجَّد ابن الإنسان، وتمجَّد الله فيه[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «به». يمكن أن تُفهم العبارة اليونانية بمعنى أن الله تمجَّد في ابن الإنسان أو به.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅτε οὖν
  choice: فلما
  rationale: تجمع «فلما» بين الدلالة الزمنية لـὅτε وحركة السرد والاستنتاج التي تفيدها οὖν، بصياغة عربية طبيعية موجزة.
- source_word: ἐξῆλθεν
  choice: خرج
  rationale: يحفظ الفعل معنى المغادرة المكانية الواضح من السياق السابق، من غير إضافة اسم الفاعل الذي تركه النص مضمَرًا.
- source_word: λέγει
  choice: قال
  rationale: صيغ المضارع التاريخي اليوناني بالماضي، وهو الأسلوب الطبيعي في السرد العربي.
- source_word: Νῦν
  choice: الآن
  rationale: يحفظ القوة الزمنية والخطابية للكلمة، معلنًا بدء اللحظة التي يتحدث عنها يسوع.
- source_word: ἐδοξάσθη
  choice: تمجَّد
  rationale: صيغة عربية طبيعية تؤدي معنى المبني للمجهول في السياق، وتحفظ صيغة الماضي من غير حصر التمجيد في الصليب أو القيامة أو الصعود وحده.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ابن الإنسان
  rationale: يحفظ لقب يسوع المعروف وصلته النصية، ولا يستبدله بتعبير تفسيري.
- source_word: ὁ θεὸς
  choice: الله
  rationale: المقابل العربي المباشر والطبيعي للاسم في هذا السياق.
- source_word: ἐν αὐτῷ
  choice: فيه
  rationale: يحفظ الدلالة الأقرب لحرف الجر ἐν، مع إبقاء الاحتمال الأداتي «به» في الحاشية.
theological_decisions:
- issue: مدى دلالة تمجيد ابن الإنسان
  choice: الإبقاء على إعلان التمجيد بصيغة عامة بوصفه قد دخل حيز التحقق
  alternative: حصره في الصلب وحده، أو في القيامة والارتفاع وحدهما
  rationale: لا يحدد النص هنا مرحلة واحدة، ولذلك تحافظ الصياغة على اتساع الدلالة وعلى التوتر بين الحدث الوشيك وإعلانه بصيغة الماضي.
- issue: دلالة ἐν αὐτῷ
  choice: فيه
  alternative: به
  rationale: تحتمل العبارة علاقة التمجيد «في» الابن، كما تحتمل المعنى الأداتي «به». أُبقي المعنى الأقرب لفظًا في المتن، ووُضع البديل في الحاشية منعًا لحسم الغموض الحقيقي.
