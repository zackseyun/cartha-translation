  yaml_path: translation/nt/john/013/004.yaml
  text: He rises from the supper and lays aside his outer garments[a], and taking a towel[b], tied it around himself.
translation:
  language: ar
  text: فقام عن العشاء، ووضع ثيابه الخارجية جانبًا، وأخذ منشفةً وائتزر بها.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وربطها حول وسطه».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγείρεται
  choice: فقام
  rationale: الفعل المضارع التاريخي يُنقل طبيعيًا في السرد العربي بالماضي، و«قام» يعبّر بوضوح عن النهوض من موضع المائدة.
- source_word: ἐκ τοῦ δείπνου
  choice: عن العشاء
  rationale: «العشاء» تسمية عربية طبيعية للوجبة في هذا السياق، وحرف «عن» يلائم فعل القيام من المائدة أو الوجبة.
- source_word: τίθησιν τὰ ἱμάτια
  choice: ووضع ثيابه الخارجية جانبًا
  rationale: يفيد τίθημι هنا التنحية، وتشير ἱμάτια في السياق إلى الثياب الخارجية؛ وهذا يتجنب الإيحاء بأنه خلع جميع ملابسه.
- source_word: λαβὼν λέντιον
  choice: وأخذ منشفةً
  rationale: «منشفة» مقابل واضح ومعاصر لـ λέντιον، وهي قطعة قماش تُستعمل في الخدمة والتجفيف.
- source_word: διέζωσεν ἑαυτόν
  choice: وائتزر بها
  rationale: «ائتزر بها» ينقل معنى إحاطة المنشفة بوسطه وربطها، مع عود الضمير بوضوح إلى المنشفة.
