  text: And after the piece of bread[a], then Satan entered into him. So Jesus said to him, “What you are doing[b], do more quickly.”
translation:
  language: ar
  text: 'وبعد قطعة الخبز[a]، عندئذ دخل الشيطان فيه. فقال له يسوع: «ما تفعله، فافعله بسرعة أكبر[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «اللقمة». تشير الكلمة اليونانية إلى قطعة صغيرة من الطعام، وهي هنا على الأرجح قطعة الخبز المقدمة في أثناء العشاء.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «افعله سريعًا». اللفظة اليونانية بصيغة المقارنة، أي «بسرعة أكبر»، مع أن المعنى قد يصاغ في العربية أيضًا بلفظ «سريعًا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ψωμίον
  choice: قطعة الخبز
  rationale: تدل الكلمة على قطعة صغيرة من الطعام، ويرجح السياق أنها قطعة خبز. يحافظ هذا التعبير على الصورة المحسوسة بوضوح، من غير إضافة فعل غير مذكور في اليونانية.
- source_word: εἰσῆλθεν εἰς ἐκεῖνον
  choice: دخل الشيطان فيه
  rationale: ينقل تركيب الدخول مع εἰς نقلًا مباشرًا، ويحفظ وصف الفعل الشخصي من غير تفسيره بأنه مجرد تأثير أو توسيعه إلى صياغة عقائدية.
- source_word: ὁ Σατανᾶς
  choice: الشيطان
  rationale: هو المقابل العربي الراسخ للاسم أو اللقب Σατανᾶς في نصوص العهد الجديد.
- source_word: λέγει οὖν αὐτῷ ὁ Ἰησοῦς
  choice: فقال له يسوع
  rationale: صيغ الماضي هي الأسلوب الطبيعي للسرد العربي، والفاء تنقل الصلة الاستنتاجية أو التعاقبية التي تؤديها οὖν من غير تثقيل.
- source_word: Ὃ ποιεῖς
  choice: ما تفعله
  rationale: يحافظ المضارع العربي على دلالة الفعل الجاري أو المباشر، ولا يضيف معنى «ما أنت مزمع أن تفعله» غير المصرح به.
- source_word: ποίησον
  choice: افعله
  rationale: أمر مباشر موجز ينقل حدة صيغة الأمر اليونانية وبساطتها.
- source_word: τάχιον
  choice: أسرع
  rationale: الصيغة اليونانية صيغة تفضيل، ولذلك يعكس «أسرع» معناها المقارن بصورة أوضح من «سريعًا».
theological_decisions:
- issue: طبيعة فعل الشيطان تجاه يهوذا
  choice: الإبقاء على العبارة المباشرة «دخل الشيطان فيه»
  alternative: «استولى عليه الشيطان» أو «أسلم نفسه للشيطان»
  rationale: يذكر النص دخولًا شخصيًا للشيطان، لكنه لا يشرح مداه أو كيفيته. لذلك تحفظ الصياغة التوتر اللاهوتي من غير اختزاله إلى استعارة أو توسيعه إلى تقرير عقائدي لا ينص عليه العدد.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حوفظ على إيجاز العبارة اليونانية، وعلى التكرار المقصود بين «تفعله» و«افعله»، وعلى صيغة المقارنة في «أسرع».
