  text: ⸂εἰ ὁ θεὸς ἐδοξάσθη ἐν αὐτῷ,⸃ καὶ ὁ θεὸς δοξάσει αὐτὸν ἐν ⸀αὑτῷ, καὶ εὐθὺς δοξάσει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/032.yaml
  text: If God was glorified in him[a], God will also glorify him in himself[b], and will glorify him at once.
translation:
  language: ar
  text: إن كان الله قد تمجَّد فيه[a]، فإن الله سيمجِّده أيضًا في ذاته[b]، وسيمجِّده في الحال.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بما أن الله قد تمجَّد فيه». تستعمل اليونانية أداة الشرط «إن»، وإن كان السياق يرجّح أن الشرط مفترض التحقّق.'
    reason: alternative_reading
  - marker: b
    text: يمكن أن تُفهم عبارة «في ذاته» أيضًا بمعنى «مع ذاته» أو «بذاته»؛ فالعبارة اليونانية موجزة وغنية بالدلالة اللاهوتية.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: إن كان
  rationale: يحافظ على أداة الشرط اليونانية، مع بقاء احتمال أن يكون الشرط مفترض التحقق بحسب السياق.
- source_word: ἐδοξάσθη
  choice: قد تمجَّد
  rationale: ينقل صيغة الماضي المبني للمجهول، وتفيد «قد» تحقق الفعل دون حسم زمنه على نحو يتجاوز النص.
- source_word: ἐν αὐτῷ
  choice: فيه
  rationale: يحافظ على حرف الجر والتعبير اليوحناوي الموجز، بدل تفسيره صراحةً بمعنى «بواسطته».
- source_word: δοξάσει
  choice: سيمجِّد
  rationale: ينقل المستقبل ويحفظ التكرار والاتساق مع الفعل السابق من الجذر نفسه.
- source_word: ἐν αὑτῷ
  choice: في ذاته
  rationale: يعكس الضمير الانعكاسي العائد إلى الله ويحافظ على كثافة العبارة، مع بيان احتمالاتها في الحاشية.
- source_word: εὐθύς
  choice: حالًا
  rationale: تعبير عربي واضح وطبيعي يؤدي معنى الفورية.
theological_decisions:
- issue: دلالة εἰ الشرطية في سياق يبدو فيه تحقق الشرط مفترضًا
  choice: إن كان الله قد تمجَّد فيه
  alternative: بما أن الله قد تمجَّد فيه
  rationale: إبقاء صيغة الشرط أقرب إلى اللفظ اليوناني، بينما يتيح السياق فهم الشرط على أنه متحقق؛ وتُذكر القراءة السببية في الحاشية دون فرضها في المتن.
- issue: دلالة ἐν αὑτῷ وعلاقة تمجيد الابن بالله
  choice: في ذاته
  alternative: معه أو بذاته
  rationale: تحافظ الصياغة على الإيجاز والغموض الدلالي المشروع في اليونانية بدل حصر العبارة في معنى الوسيلة أو المصاحبة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حوفظ على تكرار «مجَّد/تمجَّد» وعلى الشرط والغموض المقصودين في الأصل، مع تجنب التفسير المذهبي.
