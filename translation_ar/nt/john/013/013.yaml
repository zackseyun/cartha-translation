  text: You call me Teacher and Lord, and you speak rightly, for I am.
translation:
  language: ar
  text: أَنْتُمْ تَدْعُونَنِي «الْمُعَلِّمَ» وَ«الرَّبَّ»[a]، وَحَسَنًا تَقُولُونَ، لِأَنِّي كَذَلِكَ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «السَّيِّد». يمكن للكلمة اليونانية أن تدل على السلطة أو السيادة؛ وقد أُبقي هنا على «الرَّبّ» بوصفه المقابل المعتاد للقب.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνεῖτέ
  choice: تَدْعُونَنِي
  rationale: ينقل فعل المخاطبة بلقبين بصورة طبيعية ومباشرة في العربية، من غير زيادة معنى التسمية الرسمية.
- source_word: Ὁ διδάσκαλος
  choice: «الْمُعَلِّمَ»
  rationale: المقابل العربي الواضح للقب الدال على التعليم، مع إبقاء أداة التعريف التي تُبرز اللقب في اليونانية.
- source_word: Ὁ κύριος
  choice: «الرَّبَّ»
  rationale: يحفظ الاستعمال اللقبي والثقل الدلالي لـκύριος في العهد الجديد، مع عدم حصره في معنى اجتماعي أضيق.
- source_word: καλῶς λέγετε
  choice: وَحَسَنًا تَقُولُونَ
  rationale: صياغة عربية فصيحة تحافظ على فعل القول وعلى التقويم الإيجابي الوارد في καλῶς، بدل تحويل العبارة إلى حكم تفسيري أوسع مثل «أنتم على حق».
- source_word: εἰμὶ γάρ
  choice: لِأَنِّي أَنَا كَذَلِكَ
  rationale: توضح في العربية أن يسوع يقرّ بانطباق اللقبين عليه، وتحافظ بضمير الفصل على نبرة التوكيد في العبارة اليونانية الموجزة.
theological_decisions:
- issue: ترجمة κύριος بوصفه لقبًا ليسوع
  choice: الرَّبّ
  alternative: السَّيِّد
  rationale: «الرَّبّ» هو المقابل الافتراضي للقب κύριος ويحفظ ثقله المسيحاني المحتمل، بينما تبقى «السيد» ممكنة إذا أُبرز معنى السلطة أو السيادة الاجتماعية. لا يحسم السياق وحده كل أبعاد اللقب، لذلك ذُكر البديل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. أُبقيت أداة التعريف في اللقبين لأنها طبيعية في العربية وتعكس صيغة اليونانية، ووُضعت علامتا اقتباس لإظهار أنهما لقبان. شُكّل النص لتفادي اللبس الإعرابي.
