base_translation:
  language: en
  yaml_path: translation/nt/john/013/001.yaml
  text: Before the Feast of the Passover[a], Jesus, knowing that his hour had come to depart from this world to the Father, having loved his own who were in the world[b], loved them to the end.
translation:
  language: ar
  text: وقبل عيد الفصح، كان يسوع يعلم أن ساعته قد جاءت لينتقل من هذا العالم إلى الآب، وإذ كان قد أحب خاصته الذين في العالم، أحبهم إلى النهاية.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا أن تُفهم العبارة: «إلى أقصى مدى» أو «تمامًا». وقد تجمع العبارة اليونانية بين استمرار المحبة حتى اللحظة الأخيرة وبلوغها أقصى كمالها.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρὸ δὲ τῆς ἑορτῆς τοῦ πάσχα
  choice: وقبل عيد الفصح
  rationale: تنقل «قبل» الدلالة الزمنية لحرف الجر، وتحفظ الواو الخفيفة وظيفة δέ بوصفها رابطًا سرديًا، بينما «عيد الفصح» تعبير عربي طبيعي واضح.
- source_word: εἰδὼς ὁ Ἰησοῦς
  choice: كان يسوع يعلم
  rationale: صياغة عربية طبيعية تنقل حال المعرفة الملازمة للفعل من غير أن تجعلها معرفة مكتسبة في تلك اللحظة.
- source_word: ἦλθεν αὐτοῦ ἡ ὥρα
  choice: أن ساعته قد جاءت
  rationale: تحفظ العبارة اليوحناوية «ساعته» وما فيها من دلالة على الموعد الحاسم، مع بيان سبق مجيء الساعة بالنسبة إلى أحداث السرد التالية.
- source_word: ἵνα μεταβῇ ἐκ τοῦ κόσμου τούτου πρὸς τὸν πατέρα
  choice: لينتقل من هذا العالم إلى الآب
  rationale: «ينتقل» تقابل حركة μεταβῇ من نطاق إلى آخر من غير قصرها صراحة على الموت وحده، وتحفظ المقابلة بين العالم والآب.
- source_word: ἀγαπήσας
  choice: وإذ كان قد أحب
  rationale: تحفظ الصلة الظرفية والبعد السابق أو التلخيصي لاسم الفاعل اليوناني، وتربط محبته السابقة بالفعل الختامي.
- source_word: τοὺς ἰδίους τοὺς ἐν τῷ κόσμῳ
  choice: خاصته الذين في العالم
  rationale: «خاصته» تحفظ الإيجاز والعلاقة المقصودة في اليونانية من غير تضييق المرجع إلى التلاميذ وحدهم.
- source_word: εἰς τέλος
  choice: إلى النهاية
  rationale: ترجمة قريبة من اللفظ تحفظ احتمال الدلالة الزمنية والدلالة على كمال المحبة، بدل حسم الغموض في المتن.
- source_word: ἠγάπησεν αὐτούς
  choice: أحبهم
  rationale: تنقل الفعل ببساطة وبلفظ المحبة نفسه، محافظة على التكرار المقصود مع ἀγαπήσας.
theological_decisions:
- issue: دلالة εἰς τέλος في وصف محبة يسوع
  choice: إلى النهاية
  alternative: إلى أقصى مدى؛ محبة كاملة
  rationale: قد تشير العبارة إلى الاستمرار حتى النهاية أو إلى بلوغ المحبة كمالها، وربما تجمع المعنيين؛ لذلك أبقى المتن العبارة المحتملة وشرح الحاشية أبعادها.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. قُسّمت الجملة الطويلة إلى جملتين لتحسين المقروئية مع الحفاظ على الروابط النحوية والمعنى. وُضع رمز الحاشية بعد العبارة التي يشرحها مباشرة.
