  text: ἐν τούτῳ γνώσονται πάντες ὅτι ἐμοὶ μαθηταί ἐστε, ἐὰν ἀγάπην ἔχητε ἐν ἀλλήλοις.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/035.yaml
  text: By this everyone will know that you are my disciples[b][a], if you have love for one another.
translation:
  language: ar
  text: 'بهذا سيعرف الجميع أنكم تلاميذي: إن كانت لكم محبة بعضكم لبعض.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'وحرفيًا: «إن كانت لكم محبة في ما بينكم»، أي محبة متبادلة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: بهذا
  rationale: ينقل الدلالة الإشارية الأداتية للعبارة، أي إن المحبة المتبادلة هي العلامة أو الوسيلة التي بها يعرف الناس تلاميذ يسوع.
- source_word: γνώσονται
  choice: سيعرف
  rationale: صيغة المستقبل تدل هنا على إدراك حقيقة أو التعرّف إليها؛ و«سيعرف» تعبير عربي طبيعي يحفظ سعة المعنى.
- source_word: πάντες
  choice: الجميع
  rationale: ينقل الشمول في الجمع اليوناني ذي الدلالة العامة من غير قصره على الذكور.
- source_word: ἐμοὶ μαθηταί ἐστε
  choice: أنكم تلاميذي
  rationale: الداتيف ἐμοὶ يفيد هنا الاختصاص، وتؤديه الإضافة العربية بوضوح وطبيعية.
- source_word: ἐὰν
  choice: إن
  rationale: تحفظ أداة الشرط اليونانية ودلالتها على العلامة المشروطة أو الدليل، من غير تحويلها إلى معنى زمني أو سببي.
- source_word: ἀγάπην ἔχητε
  choice: كانت لكم محبة
  rationale: صياغة عربية طبيعية لعبارة «تكون لكم محبة»، وتحفظ المحبة بوصفها أمرًا قائمًا بينهم.
- source_word: ἐν ἀλλήλοις
  choice: بعضكم لبعض
  rationale: يؤدي بوضوح معنى التبادل العلاقي المقصود، بدل الترجمة الحرفية الثقيلة «في بعضكم» أو «بين بعضكم».
theological_decisions:
- issue: طبيعة الشرط الذي تقدمه ἐὰν
  choice: إن كانت لكم محبة بعضكم لبعض
  alternative: متى كانت لكم محبة بعضكم لبعض
  rationale: «إن» تحفظ البنية الشرطية وتعرض المحبة المتبادلة علامةً يُعرَف بها التلاميذ، من غير الإيحاء بأنها وسيلة لاكتساب صفة التلمذة.
- issue: مدى πάντες
  choice: الجميع
  alternative: كل الناس
  rationale: كلاهما يفيد العموم، لكن «الجميع» موجز وطبيعي ولا يضيف اسمًا غير مصرح به في النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «بهذا» لصياغة موجزة وطبيعية، ووضعت النقطتان قبل جملة الشرط لإبراز أن المحبة المتبادلة هي العلامة المقصودة. أُبقيت «إن» الشرطية حفظًا لبنية الأصل.
