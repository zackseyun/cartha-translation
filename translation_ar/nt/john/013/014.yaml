id: JHN.13.14
reference: John 13:14
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: εἰ οὖν ἐγὼ ἔνιψα ὑμῶν τοὺς πόδας ὁ κύριος καὶ ὁ διδάσκαλος, καὶ ὑμεῖς ὀφείλετε ἀλλήλων νίπτειν τοὺς πόδας·
base_translation:
  language: en
  yaml_path: translation/nt/john/013/014.yaml
  text: If I then[a], the Lord and the Teacher, have washed your feet, you also ought to wash one another’s feet.
translation:
  language: ar
  text: فإن كنتُ أنا، الربُّ[a] والمعلّمُ، قد غسلتُ أقدامكم، فعليكم أنتم أيضًا أن يغسل بعضكم أقدام بعض.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «السيد». جاءت ترجمة κύριος هنا «الرب» بحسب استعمالها المعتاد لقبًا ليسوع.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ οὖν
  choice: فإن
  rationale: تجمع «فـ» الاستنتاجية و«إن» الشرطية في صياغة عربية طبيعية، وتحفظ منطق الاستدلال المبني على الفعل السابق.
- source_word: ἐγὼ
  choice: أنا
  rationale: أُبقي الضمير المنفصل لإظهار التوكيد والمقابلة بين ما فعله يسوع وما يجب على التلاميذ فعله.
- source_word: ἔνιψα
  choice: قد غسلتُ
  rationale: تنقل الفعل الماضي المكتمل، وتفيد «قد» تمام الفعل وصلته المباشرة بالموقف الحاضر.
- source_word: ὑμῶν τοὺς πόδας
  choice: أقدامكم
  rationale: صياغة عربية موجزة وطبيعية تنقل المفعول به والضمير الدال على الملكية.
- source_word: ὁ κύριος
  choice: الربُّ
  rationale: يحفظ اللقب المعتاد في هذا السياق، ويبرز التباين بين مقام يسوع وعمله المتواضع.
- source_word: ὁ διδάσκαλος
  choice: المعلّمُ
  rationale: ترجمة مباشرة للقب التعليمي، مع إبقائه موازيًا للقب «الرب».
- source_word: καὶ ὑμεῖς
  choice: فعليكم أنتم أيضًا
  rationale: تحفظ معنى الإضافة في καί وتوكيد الضمير الصريح ὑμεῖς، وتربط النتيجة بالشرط ربطًا عربيًا واضحًا.
- source_word: ὀφείλετε
  choice: عليكم
  rationale: تفيد الالتزام الأخلاقي الواجب من غير تحويل العبارة إلى أمر مباشر أشد من صيغة الأصل.
- source_word: ἀλλήλων
  choice: بعضكم ... بعض
  rationale: تعبير عربي متداول يحفظ المعنى التبادلي بين أفراد الجماعة.
- source_word: νίπτειν τοὺς πόδας
  choice: أن يغسل ... أقدام
  rationale: يحفظ الفعل الحسي المحدد، وهو غسل القدمين، ولا يختزله في معنى مجازي عام.
theological_decisions:
- issue: دلالة κύριος بوصفه لقبًا للمسيح
  choice: الرب
  alternative: السيد
  rationale: «الرب» هو المقابل المعتاد للقب κύριος في هذا السياق، ويحفظ ثقله اللقبي، مع إثبات البديل الممكن في الحاشية.
- issue: طبيعة الالتزام بغسل الأقدام
  choice: 'الإبقاء على الفعل الملموس: «أن يغسل بعضكم أقدام بعض»'
  alternative: أن يخدم بعضكم بعضًا بتواضع
  rationale: النص اليوناني يذكر غسل الأقدام صراحة؛ أما تعميمه إلى الخدمة المتواضعة فهو تطبيق تفسيري لا ينبغي أن يحل محل العبارة الأصلية في المتن.
translation_notes:
  register: لغة عربية فصحى معاصرة واضحة ووقورة. استُعملت بنية «فإن ... فعليكم» لإظهار الشرط والنتيجة طبيعيًا، وأُبقي التوكيد في «أنا» و«أنتم أيضًا». وُضع ضبط الإعراب في «الربُّ والمعلّمُ» منعًا لالتباس موقع اللقبين.
