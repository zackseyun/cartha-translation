base_translation:
  language: en
  yaml_path: translation/nt/john/013/005.yaml
  text: Then he pours water into the washbasin[b][a], and began to wash the disciples’ feet and to wipe them with the towel with which he was girded.
translation:
  language: ar
  text: ثم يصبّ ماءً في المِغسلة[a]، وبدأ يغسل أقدام التلاميذ ويمسحها بالمنشفة التي كان قد ائتزر بها[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الحوض». يدل اللفظ اليوناني على وعاء يُستعمل للغسل.
    reason: lexical_alternative
  - marker: b
    text: أي المنشفة التي كان قد لفّها وربطها حول وسطه استعدادًا للخدمة.
    reason: lexical_clarification
lexical_decisions:
- source_word: εἶτα
  choice: ثم
  rationale: تفيد تتابع الأحداث في السرد بعبارة عربية طبيعية واضحة.
- source_word: βάλλει
  choice: يصبّ
  rationale: الفعل يعني في أصله يضع أو يلقي، لكن صبّ الماء في وعاء هو المقابل العربي السياقي الطبيعي، مع إبقاء المضارع السردي في اليونانية.
- source_word: νιπτῆρα
  choice: المِغسلة
  rationale: يدل اللفظ على وعاء مخصّص للغسل، و«المِغسلة» تؤدي هذا المعنى بإيجاز؛ وتوضح الحاشية البديل العام.
- source_word: ἤρξατο
  choice: بدأ
  rationale: ينقل ابتداء الفعل التالي، ويحافظ على انتقال النص اليوناني من المضارع السردي «يصبّ» إلى الماضي.
- source_word: νίπτειν
  choice: يغسل
  rationale: مقابل مباشر وطبيعي لغسل جزء من الجسد، وهو هنا الأقدام.
- source_word: τοὺς πόδας τῶν μαθητῶν
  choice: أقدام التلاميذ
  rationale: تركيب إضافة عربي طبيعي يحفظ علاقة الملكية في الأصل.
- source_word: ἐκμάσσειν
  choice: يمسحها
  rationale: يدل الفعل على المسح، وقد يعود ضمير المؤنث المفرد في العربية إلى «الأقدام» غير العاقلة، مع احتمال أن يكون المقصود التجفيف مفهومًا من السياق.
- source_word: τῷ λεντίῳ
  choice: بالمنشفة
  rationale: مقابل واضح للقطعة القماشية المستعملة في المسح أو التجفيف.
- source_word: ᾧ ἦν διεζωσμένος
  choice: التي كان قد ائتزر بها
  rationale: ينقل معنى إحاطة المنشفة بوسطه دون التوسع في إضافة فعل الربط إلى المتن؛ وتشرح الحاشية التعبير بلفظ أبسط.
