  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ⸀εἰδὼς ὅτι πάντα ⸀ἔδωκεν αὐτῷ ὁ πατὴρ εἰς τὰς χεῖρας, καὶ ὅτι ἀπὸ θεοῦ ἐξῆλθεν καὶ πρὸς τὸν θεὸν ὑπάγει,
base_translation:
  language: en
  yaml_path: translation/nt/john/013/003.yaml
  text: Jesus[a], knowing that the Father had given all things into his hands, and that he had come from God and was going to God[b],
translation:
  language: ar
  text: كان يسوع يعلم أن الآب قد دفع كلَّ شيء إلى يديه، وأنه خرج من عند الله[a]، وأنه يمضي إلى الله[b]،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «جاء من عند الله».'
    reason: بديل معجمي يحافظ على دلالة المجيء والمنشأ الممكنة في الفعل اليوناني.
  - marker: b
    text: 'أو: «يعود إلى الله»؛ واليونانية تقول حرفيًا: «يمضي إلى الله».'
    reason: يوضح قراءة سياقية ممكنة مع التنبيه إلى أن معنى الرجوع ليس مصرحًا به في العبارة اليونانية.
lexical_decisions:
- source_word: εἰδὼς
  choice: كان يعلم
  rationale: اسم الفاعل يبيّن الحال أو الخلفية المؤدية إلى الفعل التالي؛ وصيغة «كان يعلم» طبيعية في العربية وتحفظ هذا الدور من غير مبالغة في تحديد العلاقة السببية.
- source_word: πάντα
  choice: كلَّ شيء
  rationale: تنقل شمول صيغة الجمع المحايد بعبارة عربية واضحة ومألوفة.
- source_word: ἔδωκεν ... εἰς τὰς χεῖρας
  choice: قد دفع ... إلى يديه
  rationale: تحفظ معنى العطاء السابق وصورة وضع الأشياء في اليدين، وهي صورة تدل في السياق على السلطة والائتمان من غير استبدالها بتفسير تجريدي.
- source_word: ὁ πατὴρ
  choice: الآب
  rationale: يحفظ اللقب المعرّف في اليونانية من غير إضافة ضمير ملكية غير موجود في النص.
- source_word: ἀπὸ θεοῦ
  choice: من عند الله
  rationale: تعبير عربي طبيعي عن المصدر أو المنشأ، مع إبقاء لفظ «الله» كما في اليونانية وعدم استبداله بـ«الآب».
- source_word: ἐξῆλθεν
  choice: خرج
  rationale: ينقل الفعل مباشرة ويحفظ إمكان دلالته على الخروج أو صدور المجيء من عند الله، بدل حصره في معنى تفسيري واحد.
- source_word: πρὸς τὸν θεὸν
  choice: إلى الله
  rationale: ينقل اتجاه الحركة المقصود بحرف الجر مباشرة، من غير إضافة «ليكون مع» أو «عائدًا».
- source_word: ὑπάγει
  choice: يمضي
  rationale: فعل عربي فصيح وحاليّ الدلالة يناسب الرحيل الوشيك ويحفظ زمن المضارع في اليونانية.
theological_decisions:
- issue: لغة منشأ يسوع في ἀπὸ θεοῦ ἐξῆλθεν
  choice: خرج من عند الله
  alternative: جاء من عند الله
  rationale: يحفظ الاختيار صراحة المنشأ الإلهي أو الإرسالية، كما يحفظ قوة فعل «خرج» واحتماله، من غير إدخال صياغة عقائدية لاحقة لا ينص عليها العدد.
- issue: وجهة يسوع في πρὸς τὸν θεὸν ὑπάγει
  choice: يمضي إلى الله
  alternative: يعود إلى الله
  rationale: السياق قد يفيد الرجوع، لكن لفظ «يعود» يصرّح بما يُستنتج من السياق ولا يرد في هذه العبارة نفسها؛ لذلك تُترك الدلالة على الوجهة كما هي.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. أُبقيت صورة «إلى يديه» لما تحمله من معنى السلطان والائتمان، واستُعمل «يمضي» لصون حركة الرحيل من غير إضافة معنى الرجوع صراحة. أُدرج اسم يسوع لتوضيح فاعل اسم الفاعل اليوناني في العدد المستقل، وهو مستفاد من السياق السابق.
