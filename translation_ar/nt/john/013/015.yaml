base_translation:
  language: en
  yaml_path: translation/nt/john/013/015.yaml
  text: For I have given you an example[a], so that just as I have done to you[c][b], you also may do.
translation:
  language: ar
  text: لأني أعطيتكم مثالًا[a]، لكي تفعلوا أنتم أيضًا كما صنعتُ بكم[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «نموذجًا» أو «قدوةً».
    reason: lexical_alternative
  - marker: b
    text: أو «صنعتُ لكم». تحتمل الصيغة اليونانية، في هذا السياق، الإشارة إلى ما صنعه يسوع بالتلاميذ أو لأجلهم؛ ولا يحسم النص هذا الفرق بمفرده.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπόδειγμα
  choice: مثالًا
  rationale: تدل الكلمة على مثال أو نموذج يُقدَّم للاقتداء؛ و«مثال» تعبير عربي طبيعي وواضح في سياق غسل الأرجل.
- source_word: γὰρ
  choice: لأني
  rationale: تربط الجملة بما قبلها بوصفها تعليلًا وشرحًا لفعل يسوع وتعليمه.
- source_word: ἔδωκα
  choice: أعطيتكم
  rationale: ينقل الماضي البسيط الحدث الذي أتمّه يسوع للتو، وتبقى دلالته الحاضرة ظاهرة من السياق والغرض المذكور بعده.
- source_word: ἵνα
  choice: حتى
  rationale: تفيد الغرض المقصود من إعطاء المثال، وهي صياغة عربية موجزة وطبيعية.
- source_word: καθὼς
  choice: كما
  rationale: تحافظ على علاقة المطابقة بين فعل يسوع والفعل المطلوب من التلاميذ من غير مبالغة في تحديد صورة المطابقة.
- source_word: ἐποίησα ὑμῖν
  choice: فعلتُ بكم
  rationale: يحافظ حرف الباء على اتجاه الفعل نحو التلاميذ في هذا السياق، من غير أن يفرض معنى المنفعة وحده؛ والسياق يوضح أن المقصود ما صنعه يسوع بهم.
- source_word: καὶ ὑμεῖς
  choice: أنتم أيضًا
  rationale: يحفظ توكيد الضمير وإدخال التلاميذ في الفعل المناظر.
- source_word: ποιῆτε
  choice: تفعلوا
  rationale: المضارع المنصوب بعد «حتى» ينقل غرض ἵνα مع صيغة الاحتمال المقصود، فيما يبيّن السياق قوة الالتزام الأخلاقي.
theological_decisions:
- issue: مدى إلزام اقتداء التلاميذ بفعل يسوع
  choice: عرض فعل يسوع بوصفه مثالًا ليعمل التلاميذ على منواله، من غير تحديد ما إذا كان ذلك يفرض طقس غسل الأرجل في كل سياق.
  alternative: فهمه إما أمرًا طقسيًا دائمًا بغسل الأرجل حرفيًا، أو رمزًا محضًا لا يقتضي اقتداءً عمليًا.
  rationale: النص يصرّح بغرض الاقتداء والمطابقة، لكنه لا يحسم في هذه الآية وحدها طبيعة التطبيق الكنسي أو الطقسي؛ لذلك ينبغي إبقاء هذا المجال مفتوحًا.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم ترتيب طبيعي مع إبراز «أنتم أيضًا» للمحافظة على توكيد الضمير اليوناني، وأُبقيت العبارة موجزة بما يلائم أسلوب الآية.
