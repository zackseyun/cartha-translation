  text: ὁ μὴ ἀγαπῶν με τοὺς λόγους μου οὐ τηρεῖ· καὶ ὁ λόγος ὃν ἀκούετε οὐκ ἔστιν ἐμὸς ἀλλὰ τοῦ πέμψαντός με πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/024.yaml
  text: The one who does not love me does not keep my words[a]. And the word that you hear is not mine[b], but belongs to the Father who sent me.
translation:
  language: ar
  text: مَنْ لا يحبّني لا يحفظ كلامي. والكلام الذي تسمعونه ليس لي، بل للآب الذي أرسلني.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ μὴ ἀγαπῶν με
  choice: مَنْ لا يحبّني
  rationale: ينقل اسم الفاعل المعرَّف المستعمل استعمالًا اسميًا للدلالة العامة، بصياغة عربية طبيعية تحفظ معنى الاتصاف بعدم محبة يسوع.
- source_word: τοὺς λόγους μου
  choice: كلامي
  rationale: «كلام» في العربية اسم جنس يصح أن يقابل جمع λόγους طبيعيًا، ويشير إلى أقوال يسوع وتعليمه من غير حصرها في أوامر منفردة.
- source_word: τηρεῖ
  choice: يحفظ
  rationale: يحفظ المجال الدلالي لِـτηρέω، بما فيه صون الكلام والالتزام به، ولا يضيّقه إلى مجرد الطاعة للأوامر.
- source_word: ὁ λόγος
  choice: الكلام
  rationale: ينقل المفرد λόγος بوصفه الكلام أو التعليم المسموع في وحدته، ويحافظ على الصلة اللفظية مع «كلامي» في الجملة السابقة.
- source_word: ὃν ἀκούετε
  choice: الذي تسمعونه
  rationale: ترجمة مباشرة وطبيعية للمضارع، من دون إضافة «مني» غير الصريحة في النص.
- source_word: οὐκ ἔστιν ἐμὸς
  choice: ليس لي
  rationale: يقابل ضمير الملكية ἐμός بإيجاز، مع إبقاء احتمال دلالة الملك والمصدر قائمًا بحسب السياق.
- source_word: ἀλλὰ τοῦ πέμψαντός με πατρός
  choice: بل للآب الذي أرسلني
  rationale: يعبّر عن المضاف إليه اليوناني الذي يقابل «ليس لي»، ويجعل جملة «الذي أرسلني» تتعلق طبيعيًا بالآب، من غير إضافة فعل تفسيري مثل «يصدر».
theological_decisions:
- issue: علاقة كلام يسوع بكلام الآب
  choice: ليس لي، بل للآب الذي أرسلني
  alternative: ليس صادرًا مني، بل من الآب الذي أرسلني
  rationale: الصياغة المختارة تحفظ تمييز يسوع عن الآب ووحدة الكلام في الوقت نفسه، وتبقي توتر النص بشأن الملك أو المصدر من غير أن تفسره عقائديًا أو توحي بأن يسوع يتنصل من الكلام.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُعمل «مَنْ» للعموم، و«يحفظ كلامي» للمحافظة على الصلة اللفظية والدلالية بين λόγοι وλόγος. لا يحتاج النص إلى حاشية لأن «ليس لي، بل للآب» يحفظ الإيجاز والغموض المشروع في تركيب الأصل.
