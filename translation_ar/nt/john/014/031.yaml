  source_fidelity: 'النص العربي ينقل بدقة عناصر اليونانية: الاستدراك في «ولكن»، والغاية في «لكي يعرف»، ولفظ «العالم»، ومحبة يسوع للآب، والمطابقة بين أمر الآب وفعل يسوع في «كما... هكذا»، ثم أمري الجمع «انهضوا» و«لنذهب من هنا». ولا يضيف ضمير ملكية إلى «الآب» أو تفسيرًا غير مصرح به.'
