source:
  edition: SBLGNT
  text: ἀλλ’ ἵνα γνῷ ὁ κόσμος ὅτι ἀγαπῶ τὸν πατέρα, καὶ καθὼς ⸀ἐνετείλατο μοι ὁ πατὴρ οὕτως ποιῶ. Ἐγείρεσθε, ἄγωμεν ἐντεῦθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/031.yaml
  text: But so that the world may know that I love the Father[a], I do just as the Father has commanded me. Rise, let us go from here.
translation:
  language: ar
  text: ولكن لكي يعرف العالم أني أحب الآب، وكما أمرني الآب هكذا أفعل. انهضوا، لنذهب من هنا.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλ’
  choice: ولكن
  rationale: تحافظ على قوة الاستدراك التي تصل الكلام بما قبله، وتلائم بقاء جملة الغاية متعلقة بالسياق السابق.
- source_word: ἵνα γνῷ
  choice: لكي يعرف
  rationale: تنقل دلالة الغاية في ἵνα مع صيغة الاحتمال اليونانية بعبارة عربية طبيعية وواضحة.
- source_word: ὁ κόσμος
  choice: العالم
  rationale: تحافظ على اللفظ اليوحناوي الواسع وعلى دلالته البشرية والجماعية من غير شرح تفسيري داخل النص.
- source_word: ἀγαπῶ τὸν πατέρα
  choice: أني أحب الآب
  rationale: تنقل المضارع ببساطة، وتحافظ على لقب «الآب» من غير إضافة ضمير ملكية غير موجود في اليونانية.
- source_word: καθὼς ἐνετείλατο μοι ὁ πατὴρ οὕτως ποιῶ
  choice: وكما أمرني الآب هكذا أفعل
  rationale: تحافظ على بنية المطابقة «كما... هكذا»، وتنقل قوة ἐντέλλομαι بلفظ «أمر» دون تلطيفها إلى مجرد الإرشاد.
- source_word: Ἐγείρεσθε
  choice: انهضوا
  rationale: صيغة أمر للجمع تدعو المخاطبين إلى القيام، و«انهضوا» فصيحة واضحة وملائمة للسياق.
- source_word: ἄγωμεν ἐντεῦθεν
  choice: لنذهب من هنا
  rationale: تنقل صيغة الحث للمتكلم مع الجماعة، وتحافظ على دلالة الانطلاق من الموضع الحاضر.
theological_decisions:
- issue: لقب πατήρ في علاقة يسوع بالآب
  choice: الآب
  alternative: أبي
  rationale: لا يرد في اليونانية ضمير ملكية؛ لذلك يحافظ النص على اللقب كما هو من غير توسع تفسيري.
- issue: قوة ἐντέλλομαι في وصف علاقة الآب بالابن
  choice: أمرني
  alternative: أوصاني
  rationale: «أمرني» تنقل بوضوح معنى التكليف الملزم والطاعة في السياق، ولا ينبغي تخفيف القوة المعجمية لدافع لاهوتي.
- issue: البنية الغائية الناقصة ظاهريًا في مطلع الآية
  choice: ولكن لكي يعرف العالم
  alternative: ولكن هذا يحدث لكي يعرف العالم
  rationale: تحافظ الصياغة المختارة على تعلق العبارة بما قبلها وعلى قدر من الإيجاز والتوتر النحوي في الأصل، من غير إدخال فعل تفسيري غير مصرح به.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كريمة. حوفظ على التوازي «كما... هكذا» وعلى الإيجاز في مطلع الجملة، مع تجنب الإضافات التفسيرية أو الاصطلاحات المذهبية.
