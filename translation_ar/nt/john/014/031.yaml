  terminology: «الآب» و«العالم» و«أحب» و«أمرني» اختيارات سليمة ومتسقة مع الدلالة اليوحناوية ومع قوة الفعل اليوناني. ولا توجد مسألة مصطلحية تستلزم تعديلًا.
