source:
  edition: SBLGNT
  text: λέγει αὐτῷ Ἰούδας, οὐχ ὁ Ἰσκαριώτης· Κύριε, ⸀τί γέγονεν ὅτι ἡμῖν μέλλεις ἐμφανίζειν σεαυτὸν καὶ οὐχὶ τῷ κόσμῳ;
base_translation:
  language: en
  yaml_path: translation/nt/john/014/022.yaml
  text: Judas (not Iscariot) said to him[a], “Lord[b], what has happened that you are going to reveal yourself to us and not to the world?”
translation:
  language: ar
  text: 'قال له يهوذا، لا الإسخريوطي: «يا رب، ما الذي حدث حتى إنك تنوي أن تُظهر نفسك لنا[a] لا للعالم؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «تُعلن نفسك لنا»، أو «تُعرّفنا بنفسك».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: قال
  rationale: استُخدم الماضي العربي الملائم للسرد، مع أن اليونانية تستعمل الحاضر التاريخي.
- source_word: Ἰούδας, οὐχ ὁ Ἰσκαριώτης
  choice: يهوذا، لا الإسخريوطي
  rationale: يحافظ على الاسم نفسه وعلى التوضيح الصريح الذي يميّز هذا التلميذ من يهوذا الإسخريوطي.
- source_word: Κύριε
  choice: يا رب
  rationale: صيغة النداء العربية الطبيعية التي تحفظ الاحترام والثقل الدلالي للقب κύριος.
- source_word: τί γέγονεν
  choice: ما الذي حدث
  rationale: ينقل دلالة صيغة التام على وقوع أمر ترتبت عليه الحالة الحاضرة، ويأتي واضحًا وطبيعيًا في العربية.
- source_word: ὅτι
  choice: حتى إنك
  rationale: 'يربط السؤال بالوضع الناتج عنه: ما الذي حدث بحيث صار قصد يسوع أن يُظهر نفسه للتلاميذ دون العالم.'
- source_word: μέλλεις
  choice: تنوي أن
  rationale: يحفظ معنى القصد المستقبلي من غير أن يبالغ في دلالة الوشيك.
- source_word: ἐμφανίζειν σεαυτόν
  choice: تُظهر نفسك
  rationale: يحفظ المعنى الانعكاسي واحتمال الظهور أو التعريف بالنفس، بلغة عربية واضحة؛ وتُذكر البدائل الدلالية في الحاشية.
- source_word: κόσμῳ
  choice: العالم
  rationale: يحافظ على مفردات يوحنا وعلى اتساع مدلول κόσμος دون حصره تفسيريًا في فئة بعينها.
theological_decisions:
- issue: مدلول κόσμος في الاستعمال اليوحناوي
  choice: العالم
  alternative: البشر عمومًا؛ أو نظام العالم غير المؤمن
  rationale: لا تحسم الآية وحدها كل أبعاد اللفظ؛ لذلك تُحفظ كلمة «العالم» بما فيها من توتر واتساع ليوضحهما السياق الأوسع.
- issue: طبيعة إظهار يسوع نفسه
  choice: تُظهر نفسك
  alternative: تُعلن نفسك؛ تُعرّفنا بنفسك
  rationale: الفعل ἐμφανίζω يحتمل الظهور المرئي والتعريف أو الإعلان. أبقت الصياغة هذا الاتساع ولم تقصره على كيفية محددة للإعلان.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «تنوي» بدل صياغة أثقل مثل «أنت مزمع»، مع إبقاء بنية السؤال ومفردة «العالم» اليوحناوية.
