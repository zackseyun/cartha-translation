  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ⸀ὁ Ἰησοῦς· Ἐγώ εἰμι ἡ ὁδὸς καὶ ἡ ἀλήθεια καὶ ἡ ζωή· οὐδεὶς ἔρχεται πρὸς τὸν πατέρα εἰ μὴ δι’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/006.yaml
  text: Jesus said to him[a], “I am the way, and the truth, and the life[b]. No one comes to the Father except through me.”
translation:
  language: ar
  text: 'قال له يسوع[a]: «أنا هو الطريق والحق والحياة. لا أحد يأتي إلى الآب إلا من خلالي[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «يقول له يسوع». يستعمل اليوناني هنا المضارع التاريخي.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «إلا بي».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: قال
  rationale: استُخدم الماضي العربي الطبيعي في السرد بدل الحاضر التاريخي اليوناني، مع بيان الصيغة الحرفية في الحاشية.
- source_word: αὐτῷ
  choice: له
  rationale: ترجمة مباشرة لضمير المفعول غير المباشر في صيغة عربية موجزة وطبيعية.
- source_word: Ἐγώ εἰμι
  choice: أنا هو
  rationale: يحافظ هذا التعبير على توكيد الضمير المنفصل في اليونانية وعلى الصيغة اليوحناوية المميزة، مع بقائه مفهومًا وفصيحًا.
- source_word: ἡ ὁδός
  choice: الطريق
  rationale: ينقل المعنى الحرفي والاستعاري معًا، أي سبيل الوصول إلى الآب.
- source_word: ἡ ἀλήθεια
  choice: الحق
  rationale: لفظ عربي راسخ ينقل معنى الحقيقة والصدق في السياق اليوحناوي دون تضييق دلالته.
- source_word: ἡ ζωή
  choice: الحياة
  rationale: يحفظ اتساع دلالة ζωή في يوحنا دون إضافة تفسير مثل الحياة الأبدية إلى نص الآية.
- source_word: οὐδεὶς
  choice: لا أحد
  rationale: المقابل العربي الطبيعي للضمير المنفي الشامل.
- source_word: ἔρχεται
  choice: يأتي
  rationale: المضارع العربي يلائم الحقيقة العامة المستمرة التي يفيدها المضارع اليوناني هنا.
- source_word: πρὸς τὸν πατέρα
  choice: إلى الآب
  rationale: ينقل معنى الاتجاه في πρός، ويستعمل «الآب» بوصفه اللقب الإلهي المقصود في السياق.
- source_word: εἰ μὴ
  choice: إلا
  rationale: ترجمة اصطلاحية دقيقة للبنية الاستثنائية، وهي أفصح من النقل الحرفي «إن لم» في هذا الموضع.
- source_word: δι’ ἐμοῦ
  choice: من خلالي
  rationale: ينقل معنى الوساطة أو السبيل الذي تفيده διά مع المضاف إليه، من غير تحويل العبارة إلى مجرد إذن صادر عن يسوع.
theological_decisions:
- issue: حصرية الوصول إلى الآب من خلال يسوع
  choice: 'أُبقي التصريح مباشرًا: «لا أحد يأتي إلى الآب إلا من خلالي».'
  alternative: لا أحد يأتي إلى الآب إلا بي.
  rationale: التركيب اليوناني صريح في الحصر وفي كون الوصول إلى الآب يتم بواسطة يسوع؛ فلا ينبغي تخفيفه أو توسيعه بما يتجاوز ألفاظ الآية.
- issue: البنية الثلاثية للمحمولات اليوحناوية
  choice: «الطريق والحق والحياة» مع أداة التعريف في كل عنصر بحسب العربية.
  alternative: «الطريق، والحق، والحياة» مع فصل العناصر بفواصل.
  rationale: تكرار أداة التعريف في اليونانية يميز كل محمول، والعربية تحافظ على ذلك طبيعيًا، بينما تكفي الواوات لإبراز الإيقاع الثلاثي دون إثقال بعلامات ترقيم غير لازمة.
- issue: قوة العبارة Ἐγώ εἰμι
  choice: «أنا هو»
  alternative: «أنا» أو «أنا الطريق»
  rationale: يحفظ «أنا هو» بروز الضمير اليوناني والصيغة اليوحناوية، من غير إضافة تفسير عقائدي إلى النص.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. روعي الإيجاز والإيقاع الثلاثي، وحُفظت قوة الحصر والوساطة في النص من غير شرح مذهبي داخل المتن.
