base_translation:
  language: en
  yaml_path: translation/nt/john/014/016.yaml
  text: And I will ask the Father[a], and he will give you another Advocate, so that he may be with you forever,
translation:
  language: ar
  text: وأنا سأطلب من الآب، فيعطيكم نصيرًا آخر[a] ليكون معكم إلى الأبد،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «مُعينًا» أو «مستشارًا»، وتقليديًا «مُعزّيًا»؛ فاللفظ اليوناني παράκλητος واسع الدلالة.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  choice: وأنا
  rationale: تجمع الكلمة بين أداة العطف والضمير، فتحفظ «وأنا» ترابط الكلام والتوكيد الخفيف من غير مبالغة.
- source_word: ἐρωτήσω
  choice: سأطلب
  rationale: الفعل في صيغة المستقبل، و«سأطلب» تعبير عربي طبيعي ودقيق هنا، بخلاف ألفاظ قد توحي بصياغة دينية أخص مما يقتضيه اليوناني.
- source_word: τὸν πατέρα
  choice: من الآب
  rationale: النص يقول «الآب» بأداة التعريف من غير ضمير ملكية، لذلك لم تُضف كلمة «أبي».
- source_word: ἄλλον
  choice: آخر
  rationale: ينص اللفظ على شخص آخر بالنسبة إلى شخص حاضر في السياق، من غير أن يشرح بذاته طبيعة التشابه بينهما.
- source_word: παράκλητον
  choice: نصيرًا
  rationale: «نصير» يحفظ كون المقصود شخصًا يقف مع الآخرين ويؤازرهم ويمثل جانبهم، من غير حصر اللفظ في التعزية أو المشورة وحدهما. ولثراء اللفظ اليوناني واختلاف ترجماته، أُثبتت بدائل في الحاشية.
- source_word: δώσει ὑμῖν
  choice: فيعطيكم
  rationale: الفاء تصل الجواب بالطلب اتصالًا عربيًا طبيعيًا، و«يعطيكم» تنقل الفعل ومفعوله غير المباشر بوضوح.
- source_word: ἵνα ᾖ
  choice: ليكون
  rationale: لام التعليل مع المضارع تنقل معنى الغاية في ἵνα مع صيغة الاحتمال التابعة لها، من غير تحويل العبارة إلى تقرير مستقل.
- source_word: μεθ’ ὑμῶν
  choice: معكم
  rationale: هذه هي الدلالة المباشرة لحرف الجر مع المضاف إليه في السياق.
- source_word: εἰς τὸν αἰῶνα
  choice: إلى الأبد
  rationale: هذا هو المقابل الاصطلاحي العربي الواضح لعبارة تفيد الدوام المستمر في السياق اليوحناوي.
theological_decisions:
- issue: ترجمة παράκλητος في سياق الوعد بالروح
  choice: نصيرًا
  alternative: مُعينًا، أو مستشارًا، أو مُعزّيًا
  rationale: يحافظ «نصير» على الطابع الشخصي والتمثيلي للفظ، ولا يختزل دوره في وظيفة واحدة. كما أن قول يسوع «آخر» يبقى على توتره الدلالي من غير إضافة تفسير عقائدي إلى المتن، وتعرض الحاشية البدائل المهمة في تقليد الترجمة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «الآب» بوصفه المصطلح اليوحناوي المألوف، وحُفظ تركيب الغاية في «ليكون»، مع تجنب إضافة ضمير ملكية أو شرح عقائدي غير صريح في الآية.
