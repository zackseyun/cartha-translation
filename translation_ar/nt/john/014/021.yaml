source:
  edition: SBLGNT
  text: ὁ ἔχων τὰς ἐντολάς μου καὶ τηρῶν αὐτὰς ἐκεῖνός ἐστιν ὁ ἀγαπῶν με· ὁ δὲ ἀγαπῶν με ἀγαπηθήσεται ὑπὸ τοῦ πατρός μου, κἀγὼ ἀγαπήσω αὐτὸν καὶ ἐμφανίσω αὐτῷ ἐμαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/021.yaml
  text: The one who has my commandments and keeps them is the one who loves me[a]. And the one who loves me will be loved by my Father[c][b], and I will love him and reveal myself to him.
translation:
  language: ar
  text: مَنْ عنده وصاياي ويحفظها، فهو الذي يحبني. والذي يحبني سيحبّه أبي، وأنا أيضًا سأحبّه وأُظهر له ذاتي.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'صيغة المفرد المذكر في الأصل تمثيلية، والمعنى يشمل كل مَن عنده وصايا يسوع ويحفظها. ويمكن أيضًا ترجمة العبارة الأخيرة: «وأكشف له عن نفسي» أو «وأُعلن له ذاتي».'
    reason: توضيح القوة التمثيلية للصيغة وبيان المجال الدلالي لفعل ἐμφανίζω.
lexical_decisions:
- source_word: ὁ ἔχων
  choice: مَنْ عنده
  rationale: ينقل اسم الفاعل المعرّف المستعمل استعمال الاسم بوصفه إشارة عامة إلى كل شخص تنطبق عليه الصفة، بصياغة عربية طبيعية.
- source_word: τὰς ἐντολάς μου
  choice: وصاياي
  rationale: تحفظ قوة الأمر والسلطان في ἐντολή، وتناسب الاستعمال اليوحناوي.
- source_word: τηρῶν
  choice: يحفظها
  rationale: 'يحفظ المعنى الواسع لـ τηρέω: مراعاة الوصايا والتمسك بها والعمل بمقتضاها، من غير اختزاله في مجرد الطاعة.'
- source_word: ἐκεῖνός ἐστιν ὁ ἀγαπῶν με
  choice: فهو الذي يحبني
  rationale: تحفظ الفاء ترابط الجملة، ويؤدي الضمير مع اسم الموصول وظيفة ἐκεῖνος التوكيدية في تحديد المحب الحقيقي.
- source_word: ἀγαπῶν / ἀγαπηθήσεται / ἀγαπήσω
  choice: يحب / سيحبّه / سأحبّه
  rationale: تُبقي تكرار جذر المحبة المقصود في اليونانية، مع تحويل المبني للمجهول إلى تركيب عربي معلوم طبيعي يحافظ على المعنى.
- source_word: ὁ δὲ ἀγαπῶν με
  choice: والذي يحبني
  rationale: δέ هنا رابط انتقالي خفيف لا يقتضي معنى الاستدراك القوي، ولذلك تلائمه الواو.
- source_word: ἀγαπηθήσεται ὑπὸ τοῦ πατρός μου
  choice: سيحبّه أبي
  rationale: صياغة عربية طبيعية للمبني للمجهول اليوناني، مع إبقاء أبي فاعل المحبة وصون اللغة البنوية.
- source_word: κἀγὼ
  choice: وأنا أيضًا
  rationale: يُظهر العنصر الإضافي في καὶ ἐγώ، أي إن محبة يسوع تأتي إلى جانب محبة الآب.
- source_word: ἐμφανίσω αὐτῷ ἐμαυτόν
  choice: وأُظهر له ذاتي
  rationale: ينقل معنى إظهار يسوع نفسه أو الإفصاح عن ذاته، ويحفظ كون شخصه هو موضوع الإظهار لا مجرد معلومات عنه.
- source_word: αὐτὸν / αὐτῷ
  choice: ـه / له
  rationale: يحافظ على صيغة المفرد المذكر التمثيلية في الأصل، بينما يوضح السياق أن القول عام.
theological_decisions:
- issue: العلاقة بين المحبة وحفظ الوصايا
  choice: صيغت العبارة على أنها تعرّف مَن يحب يسوع بأنه صاحب وصاياه وحافظها.
  alternative: أن الطاعة تكسب الإنسان محبة الله أو أنها مجرد دليل منفصل على المحبة.
  rationale: النحو اليوناني يقرر هوية وصفية وثيقة بين المحبة وحفظ الوصايا، من غير أن يصرح بعلاقة استحقاق؛ لذا لم تُضف لغة سببية أو استحقاقية.
- issue: طبيعة إظهار يسوع نفسه
  choice: وأُظهر له ذاتي
  alternative: وأُعلن له ذاتي / وأكشف له عن نفسي / وأتراءى له
  rationale: ἐμφανίζω يحتمل الإظهار والتعريف والإعلان الشخصي. «أُظهر له ذاتي» يبقي المجال الدلالي مفتوحًا ولا يحصر العبارة في ظهور بصري.
- issue: المفرد المذكر ذو القوة التمثيلية
  choice: استُخدمت صيغ المفرد المذكر في الضمائر، مع التنبيه إلى عمومها في الحاشية.
  alternative: إعادة الصياغة بالجمع أو تكرار «ذلك الشخص».
  rationale: الأصل يستعمل المفرد المذكر تمثيليًا؛ والحفاظ عليه أدق نحويًا، مع توضيح شموله لكل من تنطبق عليه الصفة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُعمل «مَنْ عنده» بدل تركيب أثقل مثل «الذي له»، و«يحفظها» لصون النبرة اليوحناوية. وُضعت علامة الحاشية بعد العبارة التي تتصل بمسألتي الضمير التمثيلي والإظهار الشخصي.
