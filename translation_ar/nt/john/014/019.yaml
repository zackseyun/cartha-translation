  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἔτι μικρὸν καὶ ὁ κόσμος με οὐκέτι θεωρεῖ, ὑμεῖς δὲ θεωρεῖτέ με, ὅτι ἐγὼ ζῶ καὶ ὑμεῖς ⸀ζήσετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/019.yaml
  text: A little while longer[a], and the world will no longer see me, but you will see me. Because I live[b], you also will live.
translation:
  language: ar
  text: بعد قليل، لن يراني العالم فيما بعد، أما أنتم فسترونني[a]. ولأني حيّ، فستحيون أنتم أيضًا[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أيضًا ترجمة الفعل اليوناني في الموضعين بمعنى «تعاينونني»؛ فهو قد يدل على رؤية تتجاوز مجرد اللمح.
    reason: lexical_alternative
  - marker: b
    text: قد تشير عبارة «فستحيون أنتم أيضًا» إلى مشاركة التلاميذ في حياة يسوع المقام، أو إلى حياتهم الروحية باتحادهم به، أو إلى كليهما.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτι μικρὸν
  choice: بعد قليل
  rationale: تعبير عربي طبيعي يدل على بقاء مدة قصيرة قبل التغير الوشيك، من غير زيادة تفسيرية.
- source_word: ὁ κόσμος
  choice: العالم
  rationale: يحافظ على اللفظ اليوحناوي الواسع، من غير حصره صراحة في الناس أو في نظام معادٍ لله.
- source_word: θεωρεῖ / θεωρεῖτέ
  choice: لن يراني / فسترونني
  rationale: «يرى» أوضح مقابل عربي في السياق، مع صيغة المستقبل التي يقتضيها الإطار الزمني، بينما قد يحمل الفعل اليوناني معنى المعاينة أو النظر المتأمل أيضًا.
- source_word: οὐκέτι
  choice: فيما بعد
  rationale: مع النفي السابق تؤدي معنى انقطاع الرؤية من النقطة الوشيكة فصاعدًا.
- source_word: δὲ
  choice: أما أنتم فـ
  rationale: يبين المقابلة الواضحة بين العالم والتلاميذ بأسلوب عربي فصيح وطبيعي.
- source_word: ὅτι
  choice: ولأني
  rationale: يفيد السببية على الأرجح، رابطًا حياة التلاميذ بحياة يسوع.
- source_word: ἐγὼ ζῶ
  choice: أنا حيّ
  rationale: صياغة عربية طبيعية تحفظ زمن الحاضر والتوكيد الذي يحمله الضمير اليوناني.
- source_word: καὶ ὑμεῖς ζήσετε
  choice: فستحيون أنتم أيضًا
  rationale: يحفظ المستقبل ومعنى «أيضًا»، ويبرز الصلة بين حياة يسوع وحياة التلاميذ.
theological_decisions:
- issue: طبيعة رؤية التلاميذ ليسوع
  choice: الإبقاء على «سترونني» بلا تحديد لنوع الرؤية
  alternative: رؤيته جسديًا بعد القيامة، أو إدراكه روحيًا بالإيمان، أو دلالة تشمل الأمرين
  rationale: النص اليوناني لا يحصر الرؤية في أحد هذه الأوجه، وقد يحتمل أكثر من صدى في السياق اليوحناوي.
- issue: مدلول «ستحيون»
  choice: الإبقاء على التعبير الواسع «فستحيون أنتم أيضًا»
  alternative: الحياة الروحية في الاتحاد بالمسيح، أو حياة القيامة، أو كلتاهما
  rationale: الفعل ζήσετε واسع الدلالة لاهوتيًا؛ وحصره في نوع واحد من الحياة يتجاوز ما تصرح به الآية.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدمت المقابلة «أما أنتم» لإظهار التضاد، وأُبقيت ألفاظ «العالم» و«ترونني» و«ستحيون» واسعة بما يكفي لصون الغموض المقصود والتوتر اللاهوتي في الأصل.
