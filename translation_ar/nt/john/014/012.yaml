source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ὁ πιστεύων εἰς ἐμὲ τὰ ἔργα ἃ ἐγὼ ποιῶ κἀκεῖνος ποιήσει, καὶ μείζονα τούτων ποιήσει, ὅτι ἐγὼ πρὸς τὸν ⸀πατέρα πορεύομαι·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/012.yaml
  text: Truly[a], truly, I say to you, the one who believes in me will also do the works that I do; and he will do greater works than these[b], because I am going to the Father.
translation:
  language: ar
  text: '«الحقَّ الحقَّ أقول لكم: من يؤمن بي، فهو[b] أيضًا سيعمل الأعمال التي أعملها، وسيعمل أعمالًا أعظم من هذه[a]، لأني ذاهب إلى الآب.»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «أعظم من هذه». ويمكن تقدير كلمة «أعمالًا» من العبارة السابقة في اليونانية.'
    reason: lexical_alternative
  - marker: b
    text: يستعمل اليوناني مفردًا مذكرًا تمثيليًا في عبارة «من يؤمن... فهو»، والمقصود عمومًا كل من يؤمن، رجلًا كان أو امرأة.
    reason: cultural_note
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: الحقَّ الحقَّ
  rationale: يحفظ تكرار الصيغة التوكيدية المهيبة، ويؤدي معناها بعبارة عربية واضحة وشائعة في سياق الإنجيل.
- source_word: ὁ πιστεύων εἰς ἐμέ
  choice: من يؤمن بي
  rationale: ينقل اسم الفاعل المعرف ذي الدلالة العامة بصياغة عربية طبيعية تشمل كل مؤمن، ويحفظ التعبير اليوحناوي «يؤمن بي».
- source_word: τὰ ἔργα
  choice: الأعمال
  rationale: يحفظ مفردات يوحنا ويربط القول بأعمال يسوع وآياته في الإنجيل، من غير تضييق مدلولها إلى نوع واحد من الأفعال.
- source_word: ἃ ἐγὼ ποιῶ
  choice: التي أعملها
  rationale: ينقل المضارع اليوناني بمضارع عربي مباشر، ويحافظ على الاتساق اللفظي مع «سيعمل».
- source_word: κἀκεῖνος
  choice: فهو أيضًا
  rationale: ينقل الإحالة المؤكدة في «وذاك أيضًا» إلى تركيب عربي طبيعي، مع إبراز معنى الإضافة بواسطة «أيضًا».
- source_word: ποιήσει
  choice: سيعمل
  rationale: يحفظ دلالة المستقبل واتساق الجذر مع «أعملها».
- source_word: καὶ μείζονα τούτων ποιήσει
  choice: وسيعمل أعمالًا أعظم من هذه
  rationale: يُقدَّر الاسم «أعمالًا» من العبارة السابقة كما يسمح التركيب اليوناني، فتستقيم العربية من غير تحديد المقصود بكيفية العظمة.
- source_word: ὅτι
  choice: لأني
  rationale: يبيّن العلاقة السببية بين الأعمال الأعظم وذهاب يسوع إلى الآب.
- source_word: πρὸς τὸν πατέρα πορεύομαι
  choice: ذاهب إلى الآب
  rationale: ينقل المضارع اليوناني الدال في السياق على ذهاب وشيك، ويحفظ «الآب» دون إضافة ضمير ملكية غير موجود في النص.
theological_decisions:
- issue: معنى «أعمالًا أعظم من هذه»
  choice: تُترك طبيعة العظمة مفتوحة كما في النص، مع ربطها بذهاب يسوع إلى الآب.
  alternative: تفسيرها صراحة بأنها أعظم من جهة الانتشار، أو الأهمية في تاريخ الفداء، أو خدمة الكنيسة بقوة الروح.
  rationale: لا يحدد العدد بأي معنى تكون الأعمال أعظم؛ ولذلك لا تضيف الترجمة تفسيرًا عقائديًا يحسم هذا التوتر.
- issue: المفرد المذكر في ὁ πιστεύων ... κἀκεῖνος
  choice: «من يؤمن بي، فهو أيضًا» مع حاشية توضح دلالته العامة.
  alternative: صياغة جمع مثل «الذين يؤمنون بي فسيعملون» لتجنب التذكير.
  rationale: يحفظ المفرد التمثيلي في اليونانية، مع توضيح أنه لا يقصر الوعد على الرجال.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدم «الحقَّ الحقَّ» للمطلع التوكيدي، وحُفظت مفردات «الأعمال» و«الآب» ذات الصلة بالسياق اليوحناوي. وُضع كل مؤشر حاشية عند العبارة التي يشرحها.
