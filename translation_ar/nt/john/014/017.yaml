id: JHN.14.17
reference: John 14:17
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: τὸ πνεῦμα τῆς ἀληθείας, ὃ ὁ κόσμος οὐ δύναται λαβεῖν, ὅτι οὐ θεωρεῖ αὐτὸ οὐδὲ ⸀γινώσκει· ⸀ὑμεῖς γινώσκετε αὐτό, ὅτι παρ’ ὑμῖν μένει καὶ ἐν ὑμῖν ⸀ἔσται.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/017.yaml
  text: the Spirit of truth[a], whom the world is not able to receive, because it neither sees him nor knows him. You know him[b], because he remains with you and will be in you.
translation:
  language: ar
  text: روح الحق[a]، الذي لا يستطيع العالم أن يقبله، لأنه لا يراه ولا يعرفه. أمّا أنتم فتعرفونه، لأنه يمكث معكم وسيكون فيكم[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يستعمل الأصل اليوناني صيغًا محايدة نحويًا لموافقتها كلمة «روح» (πνεῦμα)، مع أن المرجع في السياق شخصي؛ لذلك جاءت الإشارة إليه في العربية بصيغ الشخص.
    reason: lexical_alternative
  - marker: b
    text: 'أو: «سيكون بينكم». يحتمل تركيب اليونانية هذا المعنى الجماعي لأن ضمير المخاطَبين جمع، لكن «فيكم» تنقل المعنى المباشر وتحفظ المقابلة مع «معكم».'
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  choice: روح الحق
  rationale: يحافظ على تركيب الإضافة اليوناني والتعبير اليوحنّاوي المألوف، من غير تحويله إلى وصف مثل «الروح الصادق» أو تفسيره بعبارة مطوّلة.
- source_word: ὃ
  choice: الذي
  rationale: مع أن الضمير الموصول في اليونانية محايد نحويًا لموافقته πνεῦμα، تشير القرينة إلى الروح بوصفه فاعلًا شخصيًا؛ والصياغة العربية الشخصية طبيعية ولا توحي بأن الروح شيء غير شخصي.
- source_word: ὁ κόσμος
  choice: العالم
  rationale: ينقل اللفظ اليوحنّاوي الواسع من غير حصره في البشرية وحدها أو في نظام عالمي متمرّد وحده.
- source_word: οὐ δύναται λαβεῖν
  choice: لا يستطيع ... أن يقبله
  rationale: يحفظ معنى عدم الاستطاعة ومعنى λαμβάνω الأساسي، أي القبول أو التلقّي، بصياغة عربية واضحة.
- source_word: θεωρεῖ
  choice: يراه
  rationale: «يرى» تعبير طبيعي يحفظ المجال الحسي والإدراكي للفعل من غير أن يفسّره تفسيرًا زائدًا مثل «يدرك».
- source_word: γινώσκει / γινώσκετε
  choice: يعرفه / تعرفونه
  rationale: تكرار جذر «عرف» يحفظ المقابلة اللفظية بين عدم معرفة العالم ومعرفة التلاميذ.
- source_word: ὑμεῖς
  choice: أمّا أنتم
  rationale: يُظهر الضمير اليوناني الصريح توكيدًا ومقابلة؛ وتنقل «أمّا أنتم» هذا الأثر طبيعيًا، مع أن أداة المقابلة ليست مستقلة في الأصل.
- source_word: παρ’ ὑμῖν μένει
  choice: يمكث معكم
  rationale: يحفظ دلالة μένω المتكررة في يوحنا ودلالة παρά مع المجرور على الحضور «مع» المخاطَبين.
- source_word: ἐν ὑμῖν ἔσται
  choice: سيكون فيكم
  rationale: «في» هي الدلالة المباشرة لـἐν، وتحفظ التمييز عن «معكم» في العبارة السابقة.
theological_decisions:
- issue: الإشارة الشخصية إلى الروح مع حياد الصيغ اليونانية نحويًا
  choice: استعمال «الذي» وضمائر الشخص في العربية
  alternative: استعمال صيغ توحي بالشيئية مثل «الذي/ما» أو إعادة العبارة بلا ضمير شخصي
  rationale: الحياد في اليونانية سببه المطابقة النحوية مع πνεῦμα، ولا يثبت عدم الشخصية. تنقل العربية المرجع الشخصي الواضح في السياق، مع التنبيه إلى الظاهرة النحوية في الحاشية بدل بناء عقيدة على جنس نحوي.
- issue: علاقة الروح بالمؤمنين في παρ’ ὑμῖν وἐν ὑμῖν
  choice: 'الحفاظ على التمييز: «معكم» ثم «فيكم»'
  alternative: تسوية العبارتين إلى حضور عام، أو ترجمة الثانية «بينكم»
  rationale: يستخدم النص حرفي جر مختلفين، لذلك تُحفظ المقابلة والتدرّج من غير حسم كل أبعادهما اللاهوتية.
translation_notes:
  register: لغة عربية فصحى معاصرة، واضحة ووقورة. استُعمل «يمكث» للمحافظة على صلة الفعل بتعبير يوحنا المتكرر من دون اللجوء إلى ألفاظ مهجورة، ووُضعت علامة الحاشية الثانية عند العبارة التي تتناولها مباشرة.
