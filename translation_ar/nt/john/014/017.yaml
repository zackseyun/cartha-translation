  source_fidelity: 'الترجمة أمينة للنص اليوناني: تحافظ على «روح الحق»، وعلى عدم استطاعة العالم أن يتلقّاه، وعلى التوازي بين «لا يراه ولا يعرفه» و«تعرفونه»، وعلى التمييز المقصود بين «معكم» (παρ’ ὑμῖν) و«فيكم» (ἐν ὑμῖν). كما أن استعمال الإحالة المذكرة في العربية مناسب مع «روح» ومع الإحالة الشخصية في السياق، دون تغيير في مضمون النص.'
  naturalness: 'الصياغة عربية فصحى معاصرة وسلسة: «لا يستطيع العالم أن يقبله»، و«أمّا أنتم فتعرفونه»، و«يمكث معكم وسيكون فيكم» واضحة ووقورة. «يمكث» اختيار طبيعي ومناسب لسياق يوحنا.'
  terminology: «روح الحق» تعبير راسخ ودقيق لـτὸ πνεῦμα τῆς ἀληθείας. وتحافظ «العالم» و«يعرف» و«يمكث» على المصطلحات اليوحنّاوية من غير تفسير مذهبي زائد. الحاشيتان مرتبطتان بالموضعين المناسبين وتعكسان البديل النحوي/التفسيري دون إلغاء القراءة الرئيسة.
