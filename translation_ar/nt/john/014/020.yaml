  text: ἐν ἐκείνῃ τῇ ἡμέρᾳ ⸂γνώσεσθε ὑμεῖς⸃ ὅτι ἐγὼ ἐν τῷ πατρί μου καὶ ὑμεῖς ἐν ἐμοὶ κἀγὼ ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/020.yaml
  text: On that day you will know that I am in my Father[a], and you are in me[b], and I am in you.
translation:
  language: ar
  text: في ذلك اليوم[a] ستعرفون أنتم أني في أبي، وأنتم فيَّ، وأنا فيكم[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «يومئذ».'
    reason: lexical_alternative
  - marker: b
    text: حُفظ تكرار حرف «في» كما في الأصل، ليبقى معنى الكينونة المتبادلة مفتوحًا كما يورده يوحنا؛ أما «في اتحاد مع» فتفسير أوضح لكنه أضيق دلالة.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: في ذلك اليوم
  rationale: تعبير زمني طبيعي في العربية يحافظ على حرف الجر وعلى تخصيص اليوم باسم الإشارة.
- source_word: γνώσεσθε ὑμεῖς
  choice: ستعرفون أنتم
  rationale: صيغة المستقبل تنقل المعرفة أو الإدراك الآتي، وإثبات الضمير «أنتم» يحفظ التوكيد الموجود في النص اليوناني.
- source_word: ὅτι
  choice: أني
  rationale: تدخل على مضمون ما سيعرفه التلاميذ، لا على تعليل سببي.
- source_word: ἐγὼ ἐν τῷ πατρί μου
  choice: أني في أبي
  rationale: يحافظ التعبير على حرف «في» وعلى علاقة البنوة، من غير أن يفسر طبيعة هذه الكينونة تفسيرًا زائدًا.
- source_word: καὶ ὑμεῖς ἐν ἐμοὶ
  choice: وأنتم فيَّ
  rationale: يحفظ العبارة الاسمية والتكرار المقصود لحرف «في» بصياغة عربية طبيعية.
- source_word: κἀγὼ ἐν ὑμῖν
  choice: وأنا فيكم
  rationale: ينقل معنى «وأنا» ويحافظ على صورة السكن المتبادل من غير تحويلها إلى شرح تفسيري.
theological_decisions:
- issue: لغة الكينونة المتبادلة في إنجيل يوحنا
  choice: 'الإبقاء على حرف «في» في العبارات الثلاث: «في أبي، وأنتم فيَّ، وأنا فيكم».'
  alternative: «متحد بأبي، وأنتم متحدون بي، وأنا متحد بكم».
  rationale: التكرار مقصود في اليونانية ويحمل دلالات علائقية ولاهوتية متعددة؛ لذلك لا ينبغي حصره في تفسير واحد مثل الاتحاد وحده.
- issue: علاقة يسوع بالآب
  choice: «أني في أبي».
  alternative: «أني واحد مع أبي» أو «أني مع أبي».
  rationale: تنقل الصياغة قول النص كما هو، فلا تضعفه إلى مجرد المصاحبة ولا توسعه بإدخال صياغة عقائدية لا ترد صراحة في هذه الآية.
translation_notes:
  register: عربية فصحى حديثة، واضحة وموقرة. استُخدم «أبي» بدل تركيب حرفي ثقيل، وأُثبت «أنتم» للمحافظة على توكيد الضمير اليوناني. وُضعت الحركات الضرورية فقط في «فيَّ» منعًا للالتباس.
