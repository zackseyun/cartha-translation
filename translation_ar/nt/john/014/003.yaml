  yaml_path: translation/nt/john/014/003.yaml
  text: And if I go and prepare a place for you[a], I am coming again and will take you to myself, so that where I am[b], you also may be.
translation:
  language: ar
  text: وإن ذهبتُ وهيّأتُ لكم مكانًا، فأنا آتٍ من جديد[a]، وسآخذكم إليّ، لكي تكونوا أنتم أيضًا حيث أنا[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ويجوز: «فسآتي من جديد». يستعمل النص اليوناني فعلًا بصيغة الحاضر، لكن معناه هنا متجه إلى المستقبل.'
    reason: lexical_alternative
  - marker: b
    text: 'اختلفت التفسيرات في المقصود بقول يسوع «أنا آتٍ من جديد»: أهو مجيئه النهائي تحديدًا، أم ظهوراته بعد القيامة، أم مجيء الروح، أم وعد متعدد الأبعاد يشمل أكثر من واحد من هذه الأمور.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐὰν πορευθῶ
  choice: وإن ذهبتُ
  rationale: تحافظ «إن» على صيغة الشرط المستقبلية، وتنقل «ذهبت» المعنى المباشر للفعل من غير تفسير زائد لطبيعة الرحيل.
- source_word: ἑτοιμάσω τόπον ὑμῖν
  choice: هيّأتُ لكم مكانًا
  rationale: «هيّأ» تعبير عربي طبيعي ودقيق لمعنى الإعداد، و«مكانًا» تقابل τόπον من غير توسع في تحديد ماهيته.
- source_word: πάλιν ἔρχομαι
  choice: فأنا آتٍ من جديد
  rationale: تنقل العبارة وعدًا مستقبليًا، وتحافظ قدر الإمكان على حيوية الصيغة الحاضرة في اليونانية؛ و«من جديد» تؤدي معنى πάλιν بوضوح.
- source_word: παραλήμψομαι ὑμᾶς πρὸς ἐμαυτόν
  choice: وسآخذكم إليّ
  rationale: تعبّر عن أخذ التلاميذ إلى حضرة يسوع نفسه، وتحفظ القوة العلائقية لعبارة πρὸς ἐμαυτόν بلغة عربية واضحة.
- source_word: ἵνα
  choice: لكي
  rationale: تدل بوضوح على الغاية المقصودة في الجملة.
- source_word: ὅπου εἰμὶ ἐγὼ
  choice: حيث أكون أنا
  rationale: تحفظ دلالة المكان والتوكيد الذي يحمله الضمير اليوناني الصريح ἐγώ، من غير إضافة تفسيرية.
- source_word: καὶ ὑμεῖς ἦτε
  choice: تكونوا أنتم أيضًا
  rationale: صيغة المضارع المنصوب بعد «لكي» تحافظ على معنى الغاية، و«أيضًا» تقابل καί، مع إبراز الضمير كما في اليونانية.
theological_decisions:
- issue: طبيعة المجيء الموعود في πάλιν ἔρχομαι
  choice: صياغة الوعد بوصفه مجيئًا لاحقًا من غير تحديد كيفيته أو توقيته
  alternative: حصره في ظهورات يسوع بعد القيامة، أو مجيء الروح، أو المجيء النهائي وحده
  rationale: يَعِد النص بحضور متجدد وبأخذ التلاميذ إلى يسوع نفسه، لكنه لا يحسم في هذه الآية وحدها أيَّ تطبيق تفسيري بعينه؛ لذلك تُحفظ سعة العبارة وتوترها اللاهوتي.
