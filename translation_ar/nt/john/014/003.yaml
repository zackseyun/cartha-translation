  to: وإن ذهبتُ وهيّأتُ لكم مكانًا، فأنا آتٍ من جديد[a]، وسآخذكم إليّ، لكي تكونوا أنتم أيضًا حيث أنا[b].
  rationale: صُحِّحت كينونة يسوع إلى «حيث أنا» للمحافظة على المضارع الخبري في εἰμί وعلى توكيد ἐγώ، مع إبقاء «تكونوا» في صيغة الغاية. كما نُقل الهامش b إلى الموضع المقابل لمرساه في النص الإنجليزي المعتمد. ولا يلزم أي تغيير لمدلول المجيء أو لتعدد القراءات التفسيرية.
