lexical_decisions:
- source_word: ἐάν
  choice: إنْ
  rationale: تُدخل جملة شرطية، و«إنْ» هي المقابل العربي الفصيح الطبيعي هنا من غير تحويل الشرط إلى معنى التكرار.
- source_word: τι
  choice: شيئًا
  rationale: ضمير نكرة في موضع المفعول به؛ و«شيئًا» تنقل عموم الطلب بوضوح وطبيعية.
- source_word: αἰτήσητέ
  choice: طلبتم
  rationale: فعل ماضٍ في العربية بعد أداة الشرط يعبّر طبيعيًا عن الحدث المستقبل المحتمل، ويحفظ معنى الطلب دون تخصيص زائد.
- source_word: με
  choice: مني
  rationale: ضمير المتكلم موجود في نص SBLGNT، وتعبير «طلبتم مني» هو الصياغة العربية الطبيعية الدالة على أن الطلب موجَّه إلى يسوع.
- source_word: ἐν τῷ ὀνόματί μου
  choice: باسمي
  rationale: تعبير عربي موجز ومألوف يحفظ الصلة باسم يسوع وسلطانه وشخصه، من غير إدخال شرح تفسيري في المتن.
- source_word: ἐγὼ
  choice: سـ
  rationale: يظهر فاعل المتكلم ضمن صيغة «سأفعل»، وهي صياغة عربية طبيعية؛ ولا تُضاف «أنا» لأن ذلك قد يبالغ في نقل توكيد الضمير اليوناني.
- source_word: ποιήσω
  choice: سأفعله
  rationale: تنقل المستقبل بصراحة، ويعود ضمير المفعول إلى الشيء المطلوب، كما تقتضيه العربية الطبيعية.
theological_decisions:
- issue: وجود με («مني/إياي») وما يترتب عليه من كون الطلب موجَّهًا صراحةً إلى يسوع
  choice: إثبات «مني» في المتن
  alternative: «إنْ طلبتم شيئًا باسمي، فسأفعله»، بحذف «مني»
  rationale: النص اليوناني المعطى في SBLGNT يثبت με، لذلك يُترجم في المتن. ولأن بعض المخطوطات تحذفه، ولأن الاختلاف يؤثر في تحديد المخاطَب بالطلب، تُذكر القراءة البديلة في الحاشية من غير حسم لوازم لاهوتية تتجاوز النص.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. اختيرت «إنْ طلبتم مني شيئًا» لترتيب عربي طبيعي، مع إبقاء عبارة «باسمي» موجزة وغير تفسيرية. وُضع مؤشر الحاشية بعد العبارة التي يقع ضمنها الاختلاف النصي.
