  text: λέγει αὐτῷ ὁ Ἰησοῦς· ⸂Τοσούτῳ χρόνῳ⸃ μεθ’ ὑμῶν εἰμι καὶ οὐκ ἔγνωκάς με, Φίλιππε; ὁ ἑωρακὼς ἐμὲ ἑώρακεν τὸν πατέρα· ⸀πῶς σὺ λέγεις· Δεῖξον ἡμῖν τὸν πατέρα;
base_translation:
  language: en
  yaml_path: translation/nt/john/014/009.yaml
  text: Jesus said to him[a], “Have I been with you for so long, and you still have not known me, Philip? The one who has seen me has seen the Father. How can you say, ‘Show us the Father’?”
translation:
  language: ar
  text: 'قال له يسوع: «كلَّ هذه المدّة[a] وأنا معكم، ولم تعرفني بعدُ، يا فيلبس؟ من رآني فقد رأى الآب. فكيف تقول أنت: ‹أرِنا الآب›؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «منذ وقت طويل وأنا معكم».'
    reason: بديل معجمي طبيعي لعبارة Τοσούτῳ χρόνῳ يبرز طول المدّة.
lexical_decisions:
- source_word: Τοσούτῳ χρόνῳ
  choice: كلَّ هذه المدّة
  rationale: تفيد العبارة بالجرّ امتداد الزمن، وتحافظ هذه الصياغة على طول المدّة وعلى نبرة الاستفهام العتابي بلغة عربية طبيعية.
- source_word: μεθ’ ὑμῶν εἰμι
  choice: وأنا معكم
  rationale: المضارع اليوناني يدل هنا على حضور مستمر إلى لحظة الكلام؛ والجملة الاسمية العربية تنقل هذا الاستمرار بوضوح.
- source_word: οὐκ ἔγνωκάς με
  choice: ولم تعرفني بعدُ
  rationale: فعل γινώσκω في صيغة التام يشير إلى حالة عدم المعرفة رغم الفرصة السابقة؛ و«بعدُ» تُظهر استمرار هذه الحالة ونبرة العتاب من غير تغيير معنى الفعل.
- source_word: Φίλιππε
  choice: يا فيلبّس
  rationale: نُقل اسم المخاطَب بصيغته العربية الشائعة، وأُظهرت حالة النداء بأداة النداء.
- source_word: ὁ ἑωρακὼς ἐμὲ
  choice: من رآني
  rationale: تنقل «من» اسم الفاعل المعرّف المستعمل استعمالًا اسميًا، وتؤدي العربية بالفعل الماضي معنى الرؤية المتحققة بإيجاز طبيعي.
- source_word: ἑώρακεν τὸν πατέρα
  choice: فقد رأى الآب
  rationale: تحافظ الصياغة على قوة التام اليوناني وعلى اللقب اليوحناوي «الآب» من دون تخفيفه إلى مجرد الشبه أو إضافة تفسير عقائدي.
- source_word: πῶς σὺ λέγεις
  choice: فكيف تقول أنت
  rationale: «كيف» تحفظ قوة الاستنكار في السؤال، والضمير المنفصل «أنت» يعكس إبراز σὺ في النص اليوناني.
- source_word: Δεῖξον ἡμῖν τὸν πατέρα
  choice: أرِنا الآب
  rationale: فعل الأمر «أرِنا» هو المقابل العربي المباشر والطبيعي لـ δείκνυμι، ويحافظ على صيغة طلب فيلبّس الواردة في السياق السابق.
theological_decisions:
- issue: علاقة رؤية يسوع برؤية الآب
  choice: من رآني فقد رأى الآب
  alternative: من رآني فقد رأى ما يشبه الآب؛ أو صياغة موسعة تُدخل مصطلحات عقائدية لاحقة
  rationale: تُبقي الترجمة العبارة المسيحانية القوية كما هي، فلا تضعفها إلى مجرد تمثيل أو شبه، ولا توسعها بمقولات لاهوتية غير مذكورة في الآية، وبذلك تصون ما في النص من قوة وتوتر لاهوتي.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدم تركيب «كل هذه المدّة وأنا معكم» لأنه طبيعي في العربية ويحفظ استمرار الحضور ونبرة العتاب، مع الإبقاء على «الآب» بوصفه اللقب اللاهوتي الوارد في النص.
