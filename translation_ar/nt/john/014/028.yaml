  text: ἠκούσατε ὅτι ἐγὼ εἶπον ὑμῖν· Ὑπάγω καὶ ἔρχομαι πρὸς ὑμᾶς. εἰ ἠγαπᾶτέ με ἐχάρητε ἄν, ⸀ὅτι πορεύομαι πρὸς τὸν πατέρα, ὅτι ὁ ⸀πατὴρ μείζων μού ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/028.yaml
  text: You heard that I said to you[a], ‘I am going away, and I am coming to you.’ If you loved me, you would have rejoiced that I am going to the Father[b], because the Father is greater than I.
translation:
  language: ar
  text: 'سمعتم أني قلت لكم: «أنا ذاهب وآتي إليكم». لو كنتم تحبونني لفرحتم[a] بأني ذاهب إلى الآب، لأن الآب أعظم مني.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمة جواب الشرط: «لكان يحق لكم أن تفرحوا» أو «لكنتم تفرحون». غير أن «لفرحتم» يبرز أن الفرح كان سيحدث في هذا الشرط غير المتحقق.'
    reason: lexical_alternative
  - marker: b
    text: تُرجمت عبارة «الآب أعظم مني» كما وردت، من غير إضافة قيد تفسيري مثل «في الدور» أو «في المقام».
    reason: alternative_reading
lexical_decisions:
- source_word: ἠκούσατε
  choice: سمعتم
  rationale: الفعل ماضٍ يوناني يدل طبيعيًا على سماع قول سبق أن قاله يسوع، والماضي العربي واضح ومباشر.
- source_word: ὅτι
  choice: أني
  rationale: تُدخل مضمون ما سمعه التلاميذ، وتحافظ على الصلة النحوية بصورة طبيعية في العربية.
- source_word: Ὑπάγω
  choice: أنا ذاهب
  rationale: المضارع اليوناني ذو دلالة وشيكة أو مستقبلية هنا؛ وهذه الصياغة العربية تحفظ حيوية التعبير وحركة الابتعاد.
- source_word: ἔρχομαι πρὸς ὑμᾶς
  choice: آتي إليكم
  rationale: تحفظ دلالة المجيء المتجه إلى التلاميذ من غير أن تحسم زمنه بتوسّع تفسيري.
- source_word: εἰ ἠγαπᾶτέ με
  choice: لو كنتم تحبونني
  rationale: «لو» مع «كنتم تحبونني» تعبّر بوضوح عن الشرط المخالف للواقع الذي يفيده التركيب اليوناني في السياق.
- source_word: ἐχάρητε ἄν
  choice: لفرحتم
  rationale: جواب «لو» بالماضي يفيد النتيجة غير المتحققة، ويلائم الفعل اليوناني الماضي مع ἄν؛ ويمكن بحسب سعة الدلالة فهمه على نحو أعم.
- source_word: πορεύομαι πρὸς τὸν πατέρα
  choice: أنا ذاهب إلى الآب
  rationale: ينقل معنى الذهاب والوجهة العلائقية، مع إبقاء «الآب» لقبًا كما في اليونانية.
- source_word: πατέρα / πατὴρ
  choice: الآب
  rationale: النص اليوناني يستعمل أداة التعريف ولا يصرّح بضمير الملكية، و«الآب» يحفظ الصياغة واللقب اليوحناويين.
- source_word: μείζων
  choice: أعظم
  rationale: مقابل عربي مباشر للمقارنة من μέγας، من غير إضافة قيد تفسيري مثل «في المقام» أو «في الدور».
- source_word: μού
  choice: مني
  rationale: الصيغة العربية الطبيعية بعد اسم التفضيل، وتحفظ المقارنة الصريحة في الأصل.
theological_decisions:
- issue: دلالة قول «الآب أعظم مني» وصلته بالنقاشات المسيحانية
  choice: إبقاء المقارنة الصريحة «الآب أعظم مني» بلا قيد تفسيري في المتن.
  alternative: الآب أعظم مني في الدور أو المقام؛ أو الآب أعظم مني بالنظر إلى حال التجسد.
  rationale: النص اليوناني يقرر المقارنة من غير تحديد لوجهها. وإضافة قيد تحسم جدلًا لاهوتيًا لا يحسمه لفظ الآية نفسه، لذلك تُصان هنا حدة النص وغموضه الحقيقي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «لو... لَـ» لإظهار الشرط المخالف للواقع، وحُفظ لقب «الآب» والمقارنة اللاهوتية بلا شرح داخل المتن.
