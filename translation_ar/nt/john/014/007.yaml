  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: εἰ ⸀ἐγνώκειτέ με, καὶ τὸν πατέρα μου ⸂ἂν ᾔδειτε⸃· ⸀ἀπ’ ἄρτι γινώσκετε αὐτὸν καὶ ἑωράκατε ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/007.yaml
  text: If you had known me, you would have known my Father also. From now on you do know him and have seen him.
translation:
  language: ar
  text: لو كنتم قد عرفتموني، لعرفتم أبي أيضًا. ومن الآن تعرفونه وقد رأيتموه.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγνώκειτέ / γινώσκετε
  choice: عرفتم / تعرفونه
  rationale: نقل فعل المعرفة بصيغة عربية طبيعية، مع الحفاظ على الانتقال من الشرط المتعلق بالماضي إلى التقرير الحاضر.
- source_word: ᾔδειτε
  choice: لعرفتم
  rationale: صيغة جواب الشرط غير المتحقق في الماضي، وتؤديها العربية بوضوح باللام مع الفعل الماضي.
- source_word: ἀπ’ ἄρτι
  choice: ومن الآن
  rationale: تعبير عربي واضح يحفظ الدلالة الزمنية ابتداءً من اللحظة الحاضرة.
- source_word: ἑωράκατε
  choice: قد رأيتموه
  rationale: «قد» مع الماضي تنقل تمام الفعل ونتيجته القائمة في السياق.
theological_decisions:
- issue: العلاقة بين معرفة يسوع ومعرفة الآب ورؤيته
  choice: 'الإبقاء على العبارات المباشرة: «لعرفتم أبي أيضًا... تعرفونه وقد رأيتموه»'
  alternative: تفسير «رأيتموه» بمعنى «رأيتم إعلانَه فيّ» داخل المتن
  rationale: النص اليوناني يقرر المعرفة والرؤية مباشرة ولا يشرح كيفيتهما في هذه الآية؛ لذلك تُحفظ حدة العبارة ولا يُضاف تفسير مذهبي.
- issue: التوتر بين الشرط الماضي والتقرير الحاضر
  choice: «لو كنتم قد عرفتموني... ومن الآن تعرفونه»
  alternative: 'تسوية التوتر بترجمة الشرط على أنه واقع: «إن كنتم تعرفونني»'
  rationale: تحافظ الصياغة على قراءة النص المعطى وعلى الانتقال المقصود من عدم تحقق مفترض في الماضي إلى معرفة مؤكدة من الآن.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم «أبي» بدل «والدي» اتساقًا مع لغة العلاقة في سياق إنجيل يوحنا، وحُفظ التوكيد الحاضر دلاليًا من غير إضافة أداة ثقيلة لا يقتضيها الأسلوب العربي.
