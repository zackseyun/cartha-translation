  text: λέγει αὐτῷ Θωμᾶς· Κύριε, οὐκ οἴδαμεν ποῦ ὑπάγεις· ⸀πῶς ⸂δυνάμεθα τὴν ὁδὸν εἰδέναι⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/014/005.yaml
  text: Thomas said to him[a], “Lord, we do not know where you are going[b]. How can we know the way?”
translation:
  language: ar
  text: 'قال له توما: «يا رب، لا نعرف إلى أين تذهب، فكيف يمكننا أن نعرف الطريق؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει αὐτῷ Θωμᾶς
  choice: قال له توما
  rationale: صيغ المضارع التاريخي في السرد اليوناني تُنقل طبيعيًا إلى الماضي في العربية، مع إبقاء الضمير العائد إلى يسوع. واستُخدمت الصيغة العربية الشائعة للاسم «توما».
- source_word: Κύριε
  choice: يا رب
  rationale: ينقل النداء اليوناني بصيغة عربية طبيعية، ويحفظ ما في اللقب من توقير ومن دلالة أوسع محتملة دون قصره على معنى «سيدي» المهذب.
- source_word: οὐκ οἴδαμεν
  choice: لا نعرف
  rationale: الفعل يدل هنا على المعرفة، و«نعرف» مباشر وطبيعي، كما يتيح تكراره مع المصدر εἰδέναι.
- source_word: ποῦ ὑπάγεις
  choice: إلى أين تذهب
  rationale: صياغة عربية طبيعية تحافظ على غموض الوجهة وعلى الإيحاء اليوحناوي المحتمل بالمغادرة دون أن تفسره لاهوتيًا داخل الترجمة.
- source_word: πῶς δυνάμεθα
  choice: فكيف يمكننا
  rationale: «كيف يمكننا» ينقل الاستفهام عن الإمكان. وأُضيفت فاء تفريعية عربية طبيعية لإظهار الصلة المنطقية الواضحة بين الجملتين دون تغيير مضمون السؤال.
- source_word: τὴν ὁδὸν
  choice: الطريق
  rationale: «الطريق» هو المقابل العربي الطبيعي ويحفظ الصلة الموضوعية بقول يسوع في العدد التالي دون استباق تفسيره.
- source_word: εἰδέναι
  choice: أن نعرف
  rationale: يحافظ على تكرار جذر المعرفة الوارد مرتين في اليونانية وعلى منطق سؤال توما.
theological_decisions:
- issue: الدلالة اللاهوتية المحتملة للفعل ὑπάγεις في سياق يوحنا
  choice: إلى أين تذهب
  alternative: إلى أين تمضي / إلى أين تذهب بعيدًا
  rationale: الوجهة ذات أهمية لاهوتية في الإنجيل، لكن كلام توما يعبّر عن جهله بها ولا يشرحها. لذلك تحفظ الصياغة المحايدة التوتر السردي ولا تُدخل تفسير الرجوع إلى الآب في هذا العدد.
- issue: دلالة κύριε في خطاب توما ليسوع
  choice: يا رب
  alternative: يا سيدي
  rationale: «يا رب» يحفظ مجال الدلالة الذي قد يجمع بين التوقير والاعتراف التلمذي، من غير حسم مقدار الفهم الذي كان لدى توما في هذه اللحظة.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة، بتركيب حواري طبيعي. لم تُضف حاشية لأن البديل «كيف نقدر أن نعرف» لا يغيّر المعنى بما يستلزم تنبيه القارئ، ولأن تكرار «نعرف» ظاهر في النص العربي نفسه.
