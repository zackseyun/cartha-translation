  yaml_path: translation/nt/john/014/030.yaml
  text: I will no longer speak much with you[a], for the ruler of the world is coming[b]. And he has nothing in me.
translation:
  language: ar
  text: لن أتكلم معكم كثيرًا بعد الآن، لأن حاكم العالم[a] آتٍ، وليس له فيَّ شيء[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ويجوز: «حاكم هذا العالم». تضيف بعض الترجمات اسم الإشارة اتساقًا مع تعبيرات يوحناوية مشابهة، أما اليونانية هنا فتقول حرفيًّا: «حاكم العالم».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «ليس له حقّ عليَّ» أو «ليس له سلطان عليَّ». واليونانية حرفيًّا: «ليس له فيَّ شيء».'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκέτι πολλὰ λαλήσω
  choice: لن أتكلم ... كثيرًا بعد الآن
  rationale: ينقل الفعل المستقبل مع معنى التوقف ابتداءً من هذه اللحظة، ويعامل πολλὰ بوصفها استعمالًا ظرفيًّا بمعنى «كثيرًا».
- source_word: μεθ’ ὑμῶν
  choice: معكم
  rationale: يحافظ على معنى المصاحبة والمحادثة المباشرة مع التلاميذ.
- source_word: ἔρχεται
  choice: آتٍ
  rationale: صيغة عربية طبيعية تفيد المجيء الوشيك الذي تدل عليه صيغة الحاضر ذات القوة المستقبلية في السياق.
- source_word: ὁ τοῦ κόσμου ἄρχων
  choice: حاكم العالم
  rationale: «حاكم» واضحة في العربية المعاصرة لـἄρχων، و«العالم» تتبع النص اليوناني من غير إضافة اسم الإشارة «هذا».
- source_word: ἐν ἐμοὶ οὐκ ἔχει οὐδέν
  choice: ليس له فيَّ شيء
  rationale: صياغة عربية موجزة تحفظ صورة التعبير اليوناني وغموضه المقصود، من غير حصره في معنى الادعاء أو السلطان أو موطئ القدم.
theological_decisions:
- issue: هوية «حاكم العالم»
  choice: الإبقاء على اللقب «حاكم العالم» دون استبداله باسم «الشيطان».
  alternative: التصريح بأنه الشيطان، أو فهم العبارة تشخيصًا عامًا لقوى الشر العالمية.
  rationale: يشير السياق اليوحناوي إلى رئيس روحي شرير معادٍ ليسوع، يُفهم عادةً أنه الشيطان، لكن النص نفسه يورد اللقب لا الاسم؛ لذلك تُحفظ الدلالة الاستنتاجية دون حسمها في المتن.
- issue: معنى «ليس له فيَّ شيء»
  choice: الإبقاء على التعبير القريب من حرفية الأصل.
  alternative: «ليس له حقّ عليَّ»، أو «ليس له سلطان عليَّ»، أو «لا يجد فيَّ موطئ قدم».
  rationale: العبارة اليونانية موجزة واصطلاحية، وقد تشمل انتفاء الادعاء والسلطان وموضع التأثير؛ تعيين واحد من هذه المعاني في المتن يضيّق التوتر الدلالي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «آتٍ» لإيجاز معنى المجيء الوشيك، وحُفظت العبارة الأخيرة على قدر من الغرابة الطبيعية لصون اتساع دلالتها اللاهوتية.
