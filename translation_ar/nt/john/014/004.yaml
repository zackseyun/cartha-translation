  text: And you know the way where I am going[a].
translation:
  language: ar
  text: وَأَنْتُمْ تَعْرِفُونَ الطَّرِيقَ إِلَى حَيْثُ أَذْهَبُ أَنَا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ بعض المخطوطات: «وتعرفون حيث أذهب، وتعرفون الطريق».'
    reason: textual_variant
lexical_decisions:
- source_word: καὶ
  choice: وَ
  rationale: أداة ربط بسيطة تحفظ استمرار الكلام من غير إضافة توكيد.
- source_word: ὅπου
  choice: حَيْثُ
  rationale: ظرف مكان يدل على الجهة أو الموضع الذي يذهب إليه يسوع.
- source_word: ἐγὼ
  choice: ضمير المتكلم المستتر في «أَذْهَبُ»
  rationale: العربية تدل على الفاعل بصيغة الفعل، فلا يلزم إظهار «أنا» ما لم يُرَد توكيد خاص.
- source_word: ὑπάγω
  choice: أَذْهَبُ
  rationale: تعبير عربي طبيعي يحفظ معنى الحركة الحاضرة أو الوشيكة دون أن يضيف تفسير «أرحل».
- source_word: οἴδατε
  choice: تَعْرِفُونَ
  rationale: الفعل οἶδα تامّ الصيغة حاضر المعنى؛ و«تعرفون» سليمة مع مفعوله «الطريق» في العربية المعاصرة.
- source_word: τὴν ὁδόν
  choice: الطَّرِيقَ
  rationale: يحفظ المجال الدلالي لـὁδός، ويلائم السياق اللاحق دون إدخال تفسيره في هذه الآية.
theological_decisions:
- issue: ترتيب الجملة وعلاقة «حيث أذهب» بـ«الطريق»
  choice: تعرفون الطريق إلى حيث أذهب
  alternative: وحيث أذهب تعرفون الطريق
  rationale: أُضيفت «إلى» بوصفها لازمة في العربية الطبيعية لبيان علاقة الطريق بالوجهة، لا لإزالة التوتر المقصود في قول يسوع. أما البديل فأقرب إلى ترتيب اليونانية لكنه أقل سلاسة وقد يوهم أن «حيث أذهب» مفعول مستقل لـ«تعرفون».
- issue: القراءة النصية الأطول
  choice: 'اتباع نص SBLGNT: «وأنتم تعرفون الطريق إلى حيث أذهب»'
  alternative: «وتعرفون حيث أذهب، وتعرفون الطريق»
  rationale: القراءة الأطول تشهد لها بعض المخطوطات، لكنها ليست نص الطبعة اليونانية المعتمدة هنا، ولذلك ذُكرت في الحاشية ولم تُدخل في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل الضبط الجزئي الكامل في صياغة الآية لضمان القراءة السليمة، مع تركيب طبيعي لا يحمّل النص تفسيرًا مذهبيًا.
