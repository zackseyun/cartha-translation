  text: إن كنتم تحبّونني، فستحفظون[a] وصاياي.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فستطيعون أوامري». يمكن أن يعني الفعل اليوناني الحفظ أو المراعاة أو الصون أو الطاعة؛ واختيار «تحفظون» يُبقي معناه أوسع.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐὰν
  choice: إن
  rationale: تُدخل جملة شرطية، و«إن» تنقل الشرط بوضوح من غير أن تضيف معنى التكرار.
- source_word: ἀγαπᾶτέ
  choice: كنتم تحبّون
  rationale: فعل مضارع في صيغة الشرط للمخاطبين جمعًا؛ ومع «إن» تأتي «كنتم تحبّون» عربيةً طبيعية وتحافظ على معنى المحبة المستمرة من غير تكلّف.
- source_word: με
  choice: ني
  rationale: ضمير مفعول به يعود إلى يسوع، وأُلحق بالفعل على نحو عربي طبيعي.
- source_word: τὰς ἐντολὰς τὰς ἐμὰς
  choice: وصاياي
  rationale: «وصايا» تنقل ثقل ἐντολάς واستعمالها اليوحناوي المألوف، وضمير الملكية ينقل البناء المؤكد بإيجاز طبيعي.
- source_word: τηρήσετε
  choice: فستحفظون
  rationale: صيغة مستقبل دالة على الخبر، لا صيغة أمر. و«تحفظون» تُبقي المجال الدلالي الأوسع للفعل، بما يشمل المراعاة والالتزام والصون، مع إظهار جواب الشرط بالفاء والسين.
theological_decisions:
- issue: هل تُترجم τηρήσετε خبرًا في المستقبل أم أمرًا؟
  choice: 'خبر في المستقبل: «فستحفظون»'
  alternative: 'أمر: «فاحفظوا وصاياي»'
  rationale: الصيغة اليونانية مستقبل خبري لا أمر. تُبقي الترجمة العلاقة بين محبة يسوع وحفظ وصاياه كما صاغها النص، من غير تحويلها إلى وصية مباشرة أو حسم طبيعة هذه العلاقة تفسيرًا.
translation_notes:
