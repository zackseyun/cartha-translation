  text: καὶ ὅ τι ἂν αἰτήσητε ἐν τῷ ὀνόματί μου τοῦτο ποιήσω, ἵνα δοξασθῇ ὁ πατὴρ ἐν τῷ υἱῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/013.yaml
  text: And whatever you ask in my name[a], this I will do, so that the Father may be glorified in the Son.
translation:
  language: ar
  text: وكلُّ ما تطلبونه باسمي، فهذا سأفعله، لكي يتمجَّد الآب في الابن.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو «بواسطة الابن». يقول النص اليوناني حرفيًا: «في الابن»، وقد تدل العبارة على المجال الذي يتمجَّد فيه الآب أو على الوسيلة التي يتمجَّد بها.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅ τι ἂν
  choice: كلُّ ما
  rationale: ينقل تركيب الموصول مع ἄν دلالة العموم وعدم التحديد، وهو تعبير عربي طبيعي يحفظ اتساع المعنى.
- source_word: αἰτήσητε
  choice: تطلبونه
  rationale: الفعل αἰτέω يعني الطلب أو السؤال، و«تطلبونه» يلائم السياق ويُظهر صيغة المخاطب الجمع.
- source_word: ἐν τῷ ὀνόματί μου
  choice: باسمي
  rationale: يحفظ التعبير اليوحناوي الموجز وما فيه من دلالات التمثيل والسلطان والارتباط بيسوع، من غير حصره في تفسير واحد.
- source_word: τοῦτο
  choice: فهذا
  rationale: يُبقي اسم الإشارة الصريح ويصل الجواب بما سبق، محافظًا على توكيد العبارة اليونانية بأسلوب عربي واضح.
- source_word: ποιήσω
  choice: أفعله
  rationale: ينقل المعنى المباشر للفعل ποιέω وصيغة المستقبل التي يدل عليها السياق والصيغة اليونانية، مع ضمير يعود إلى المطلوب.
- source_word: ἵνα
  choice: لكي
  rationale: تعبّر «لكي» بوضوح عن الغاية التي تفيدها ἵνα.
- source_word: δοξασθῇ
  choice: يتمجَّد
  rationale: يحفظ لغة المجد الكتابية وصيغة المبني للمجهول، من غير إضعافها إلى مجرد الإكرام.
- source_word: ὁ πατὴρ
  choice: الآب
  rationale: ينقل اللقب الإلهي المعرّف كما يرد في النص، من غير إضافة «أبي» التي لا توجد في اليونانية.
- source_word: ἐν τῷ υἱῷ
  choice: في الابن
  rationale: يحافظ على حرف الجر ἐν وعلى ما في العبارة من احتمال دلالة المجال أو الوسيلة، بدل حصرها في معنى واحد.
theological_decisions:
- issue: معنى الطلب «باسمي»
  choice: الإبقاء على «باسمي» من غير شرح تفسيري داخل المتن.
  alternative: بسلطاني؛ أو باتحادكم بي؛ أو وفقًا لشخصي وإرادتي.
  rationale: يحمل التعبير في سياق يوحنا معاني مترابطة ومتعددة، وصياغته المباشرة تحفظ هذا الثراء ولا تفرض تفسيرًا مذهبيًا واحدًا.
- issue: دلالة ἐν τῷ υἱῷ
  choice: في الابن
  alternative: بواسطة الابن
  rationale: لا يفرض حرف الجر اليوناني هنا معنى واحدًا ضيقًا؛ لذلك يحفظ المتن الصياغة الأقرب، وتُذكر دلالة الوسيلة المحتملة في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُخدم «الآب» و«الابن» وفق الاصطلاح الكتابي الشائع، وحُفظ اسم الإشارة في «فهذا أفعله» لإبراز توكيد النص الأصلي. وُضع مؤشر الحاشية بعد «في الابن» لأن الحاشية تشرح هذه العبارة تحديدًا.
