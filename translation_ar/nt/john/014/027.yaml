source:
  edition: SBLGNT
  text: εἰρήνην ἀφίημι ὑμῖν, εἰρήνην τὴν ἐμὴν δίδωμι ὑμῖν· οὐ καθὼς ὁ κόσμος δίδωσιν ἐγὼ δίδωμι ὑμῖν. μὴ ταρασσέσθω ὑμῶν ἡ καρδία μηδὲ δειλιάτω.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/027.yaml
  text: Peace I leave with you; my peace I give to you. I do not give to you as the world gives. Do not let your heart be troubled[a], nor let it be fearful.
translation:
  language: ar
  text: سلامًا أترك لكم، سلامي أعطيكم. لا أعطيكم كما يعطي العالم. لا يضطرب قلبكم ولا يَجْبُنْ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «ولا يَخَفْ»، أو «ولا يفقد شجاعته». يدل الفعل اليوناني على الخوف أو التهيّب وفقدان الجرأة.
    reason: بدائل معجمية للفعل δειλιάω، الذي يجمع بين معنى الخوف ومعنى فقدان الشجاعة.
lexical_decisions:
- source_word: εἰρήνην
  choice: سلامًا
  rationale: «السلام» هو المقابل العربي الطبيعي والأوسع دلالة، ويحفظ ما في اللفظ من معاني الطمأنينة والسلامة والكمال دون حصره في مجرد غياب النزاع.
- source_word: ἀφίημι
  choice: أترك
  rationale: ينقل الفعل بصيغته الحاضرة نقلًا مباشرًا وطبيعيًا. أما «أورث» أو «أخلّف» فتضيفان إيحاءً وصائيًا لا يصرّح به اللفظ وحده.
- source_word: εἰρήνην τὴν ἐμὴν
  choice: سلامي
  rationale: تحفظ صيغة الإضافة العربية التوكيد العملي للملكية، وتميّز سلام يسوع من عطاء العالم من غير توسع تفسيري.
- source_word: δίδωμι
  choice: أعطي
  rationale: المقابل المباشر والطبيعي، كما يحفظ تكرار الفعل والتباين بين عطاء يسوع وعطاء العالم.
- source_word: οὐ καθὼς ὁ κόσμος δίδωσιν
  choice: لا أعطيكم كما يعطي العالم
  rationale: صياغة عربية واضحة تحافظ على المقارنة الصريحة وعلى التوكيد التقابلي في ترتيب الجملة اليونانية.
- source_word: κόσμος
  choice: العالم
  rationale: يحفظ المصطلح اليوحناوي الواسع ولا يضيّقه إلى «المجتمع البشري» أو «نظام العالم».
- source_word: μὴ ταρασσέσθω
  choice: لا يضطرب
  rationale: صيغة نهي عربية طبيعية تنقل معنى الاضطراب والانزعاج، وتحافظ على الصلة اللفظية بمطلع الإصحاح.
- source_word: ὑμῶν ἡ καρδία
  choice: قلبكم
  rationale: 'يحفظ المفرد الجمعي في اليونانية: «القلب» مفرد وضمير المخاطبين جمع، فيُنظر إلى التلاميذ جماعةً.'
- source_word: μηδὲ δειλιάτω
  choice: ولا يَجْبُنْ
  rationale: ينقل معنى الخوف المؤدي إلى التهيّب أو فقدان الشجاعة، ويميّزه من الاضطراب المذكور قبله. ضُبط الفعل جزئيًا منعًا لقراءته على غير وجهه.
theological_decisions:
- issue: طبيعة السلام الذي يعطيه يسوع
  choice: إبقاء «سلامًا» و«سلامي» من غير شرح داخل النص
  alternative: تحديده بأنه طمأنينة باطنية، أو سلام عهدي أخروي، أو مصالحة مع الله
  rationale: الآية لا تحصر السلام في واحد من هذه الأبعاد؛ لذلك يحفظ اللفظ العام ثراء المعنى والتوتر اللاهوتي بدل حسمه تفسيريًا.
- issue: القلب المفرد مع جماعة المخاطبين
  choice: قلبكم
  alternative: قلوبكم
  rationale: المفرد الجمعي قراءة نحوية حقيقية في الأصل، وحفظه ممكن ومفهوم بالعربية دون تقرير ما إذا كان التركيز فرديًا أم جماعيًا على نحو حصري.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة، مع موازاة إيقاعية بين «أترك» و«أعطي»، والحفاظ على المفرد الجمعي «قلبكم». استُعمل «يَجْبُنْ» لدقته، وأضيف الضبط الجزئي تسهيلًا للقراءة.
