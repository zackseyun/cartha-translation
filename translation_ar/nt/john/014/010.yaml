  to: أَلَا تُؤْمِنُ أَنِّي فِي الْآبِ وَأَنَّ الْآبَ فِيَّ؟ الْكَلِمَاتُ الَّتِي أَقُولُهَا لَكُمْ لَا أَتَكَلَّمُ مِنْ عِنْدِ نَفْسِي[a]، بَلِ الْآبُ الَّذِي يُقِيمُ فِيَّ[b] يَعْمَلُ أَعْمَالَهُ.
  rationale: يستبدل النص «الماكث» بـ«الذي يقيم» لتأمين عربية فصحى حديثة أوضح مع الحفاظ على الاستمرار الذي يفيده μένων. ويجعل «من عند نفسي» الإحالة إلى المتكلم أوضح من غير حصر العبارة في معنى الاستقلال بالسلطان. أما بقية الصياغة فتبقى حرفية وطبيعية، وتحافظ على الغموض العلائقي في لغة «في الآب ... فيَّ».
