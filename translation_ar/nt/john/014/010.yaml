  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: οὐ πιστεύεις ὅτι ἐγὼ ἐν τῷ πατρὶ καὶ ὁ πατὴρ ἐν ἐμοί ἐστιν; τὰ ῥήματα ἃ ἐγὼ ⸀λέγω ὑμῖν ἀπ’ ἐμαυτοῦ οὐ λαλῶ, ὁ δὲ ⸀πατὴρ ἐν ἐμοὶ ⸀μένων ποιεῖ τὰ ἔργα ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/010.yaml
  text: Do you not believe that I am in the Father and the Father is in me? The words that I say to you I do not speak from myself[b][a], but the Father who remains in me does his works.
translation:
  language: ar
  text: أَلَا تُؤْمِنُ أَنِّي فِي الْآبِ وَأَنَّ الْآبَ فِيَّ؟ الْكَلِمَاتُ الَّتِي أَقُولُهَا لَكُمْ لَا أَتَكَلَّمُ مِنْ عِنْدِ نَفْسِي[a]، بَلِ الْآبُ الَّذِي يُقِيمُ فِيَّ[b] يَعْمَلُ أَعْمَالَهُ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «من تلقاء نفسي». قد تدل العبارة على أن المتكلم لا يتكلم بمبادرة منه أو بسلطان مستقل.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «الباقي فيَّ» أو «الساكن فيَّ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστεύεις
  choice: تؤمن
  rationale: يحفظ اللفظ المحوري المتكرر في إنجيل يوحنا، وهو أوضح هنا من «تثق».
- source_word: ἐν τῷ πατρὶ ... ἐν ἐμοί
  choice: في الآب ... فيَّ
  rationale: يحافظ على لغة السكن المتبادل كما وردت، من غير تحويلها إلى تفسير مثل «متحد بالآب».
- source_word: τὰ ῥήματα
  choice: الكلمات
  rationale: ترجمة مباشرة وطبيعية تشير إلى مضمون ما يقوله يسوع.
- source_word: λέγω
  choice: أقول
  rationale: ينقل فعل القول المتعلق بالمضمون، مع إبقاء تمييز عربي طبيعي عن λαλῶ.
- source_word: ἀπ’ ἐμαυτοῦ
  choice: من عندي
  rationale: تعبير عربي فصيح وطبيعي يحفظ معنى المصدر، ويظل قابلًا لدلالة المبادرة أو السلطة الذاتية.
- source_word: λαλῶ
  choice: أتكلم بها
  rationale: يحافظ بقدر طبيعي على اختلاف الفعل عن «أقول»، والضمير «بها» يربطه بالكلمات المذكورة.
- source_word: μένων
  choice: الماكث
  rationale: يحفظ القوة الاستمرارية للفعل μένω والمفردات اليوحناوية، مع بيان البديل الأشيع في الحاشية.
- source_word: ποιεῖ
  choice: يعمل
  rationale: يلائم المفعول «أعماله» ويحافظ على الصلة اللفظية بين الفعل والاسم من غير تكلف.
- source_word: τὰ ἔργα αὐτοῦ
  choice: أعماله
  rationale: يمثل ضمير الملكية الصريح ويحفظ مفردة «الأعمال» المهمة في إنجيل يوحنا.
theological_decisions:
- issue: السكن المتبادل بين الآب والابن
  choice: الإبقاء على العبارة الحرفية العلائقية «أني في الآب وأن الآب فيَّ»
  alternative: «أني متحد بالآب وأن الآب متحد بي» أو «أنا والآب واحد»
  rationale: يحفظ صياغة هذه الآية وغموضها العلائقي المقصود، من غير مزجها بصيغ يوحناوية أخرى أو إدخال مصطلحات عقائدية تفسيرية.
- issue: مصدر كلام يسوع وعمل الآب فيه
  choice: «لا أتكلم بها من عندي ... الآب الماكث فيَّ يعمل أعماله»
  alternative: «لا أتكلم بسلطاني الخاص ... الآب الساكن فيَّ هو الذي يصنع الأعمال»
  rationale: يحفظ التمييز بين الآب والابن ووحدتهما في العمل والرسالة، ولا يحصر «من عندي» في معنى السلطة وحده ولا يضيف توكيدًا غير موجود في الأصل.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل الاستفهام «ألا تؤمن» لنقل السؤال المنفي بصورة طبيعية، وحُفظت لغة «في الآب/فيَّ» و«الأعمال» اليوحناوية من غير شرح داخل المتن. وُضعت علامتا الحاشيتين في المتن عند العبارتين المعنيتين.
