    rationale: اللفظ صحيح، لكنه أقل وضوحًا في الفصحى الحديثة المستهدفة من «الذي يقيم». والتعديل لا يغيّر الدلالة ولا يفرض تفسيرًا لاهوتيًا.
  - severity: low
    issue: الضمير «بها» بعد «أتكلم»
    rationale: ليس خطأً نحويًا، لكنه قد يقرأ على أنه استعانة بالكلمات لا كونها مضمون الكلام. حذفه ينتج تركيبًا عربيًا أيسر مع حفظ المعنى.
