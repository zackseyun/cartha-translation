review_pass:
  verdict: revise
  source_fidelity: 'يحافظ النص على ترتيب الحجة في اليونانية وعلى لغة الحلول المتبادل: «أنا في الآب والآب فيَّ». كما يمثل «كلمات»، و«لا أتكلم ... من عند نفسي»، وملكية الآب للأعمال تمثيلًا أمينًا للنص. التعديل المقترح يقتصر على جعل ترجمة μένων أوضح في العربية الفصحى الحديثة.'
  naturalness: «الماكث» فصيحة لكنها قليلة الاستعمال في العربية المعاصرة الواضحة، وقد تبدو ثقيلة أو غير مألوفة. «الذي يقيم فيَّ» أكثر سلاسة ووضوحًا، ويحفظ المعنى الاستمراري لـ μένων. كما أن حذف «بها» يجعل بناء «الكلمات التي أقولها لكم لا أتكلم من عند نفسي» أقرب إلى الأسلوب العربي الطبيعي، مع بقاء الكلمات مفعولًا دلاليًا لـ«أتكلم».
  terminology: يُستبقى «الآب»، و«فيَّ»، و«الكلمات»، و«الأعمال»؛ فهي مصطلحات مناسبة ومتسقة مع الاستعمال اليوحناوي. ولا ينبغي استبدال «في» بتعبير تفسيري مثل «متحد بـ».
