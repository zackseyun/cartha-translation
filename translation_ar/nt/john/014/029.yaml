  text: καὶ νῦν εἴρηκα ὑμῖν πρὶν γενέσθαι, ἵνα ὅταν γένηται πιστεύσητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/029.yaml
  text: And now I have told you before it happens[c][b][a], so that when it happens you may believe.
translation:
  language: ar
  text: وقد أخبرتكم الآن، قبل أن يحدث[a]، لكي، متى حدث[c]، تؤمنوا[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «قبل أن يقع».'
    reason: lexical_alternative
  - marker: b
    text: يمكن أن يحمل الفعل أيضًا معنى «تثقوا».
    reason: lexical_alternative
  - marker: c
    text: 'أو: «عندما يحدث».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: وقد... الآن
  rationale: تحافظ «الواو» على اتصال الكلام بما قبله، ويؤدي «الآن» الدلالة الزمنية، بينما تلائم «قد» صيغة الفعل التام ونتيجته الحاضرة.
- source_word: εἴρηκα ὑμῖν
  choice: قلتُ لكم
  rationale: ترجمة مباشرة وطبيعية لصيغة λέγω مع المفعول غير المباشر؛ و«قد» في السياق تساعد على نقل كون القول قد سبق وما زال ذا صلة بالحاضر.
- source_word: πρὶν γενέσθαι
  choice: قبل أن يحدث
  rationale: تنقل تركيب πρίν مع المصدر الدال على وقوع الأمر لاحقًا، مع إضمار الحدث في اليونانية وفهمه من السياق.
- source_word: ἵνα
  choice: لكي
  rationale: تحفظ دلالة الغاية بعبارة عربية واضحة ومألوفة.
- source_word: ὅταν γένηται
  choice: متى حدث
  rationale: تحفظ معنى الزمن المستقبلي المشروط، وتكرر جذر «حدث» كما تكرر اليونانية فعل γίνομαι.
- source_word: πιστεύσητε
  choice: تؤمنوا
  rationale: «تؤمنوا» هي المقابل الطبيعي الشائع لـ πιστεύω في إنجيل يوحنا، وتبقي المعنى مفتوحًا بين نشوء الإيمان وتقوّيه.
theological_decisions:
- issue: دلالة πιστεύσητε في السياق
  choice: تؤمنوا
  alternative: تثقوا، أو تزدادوا إيمانًا
  rationale: لا يحدد الفعل اليوناني نفسه هنا هل المقصود ابتداء الإيمان أم تثبيته وتقويته؛ لذلك لا تضيف الترجمة تحديدًا عقائديًا غير مصرح به.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. حوفظ على تكرار γίνομαι باستعمال «يحدث/حدث»، وعلى غاية القول السابق بواسطة «لكي»، من غير حسم ما إذا كان الإيمان المقصود ابتدائيًا أم متجددًا أو متقويًا.
