source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Ἐάν τις ἀγαπᾷ με τὸν λόγον μου τηρήσει, καὶ ὁ πατήρ μου ἀγαπήσει αὐτόν, καὶ πρὸς αὐτὸν ἐλευσόμεθα καὶ μονὴν παρ’ αὐτῷ ⸀ποιησόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/023.yaml
  text: Jesus answered and said to him[a], “If anyone loves me, he will keep my word, and my Father will love him[b], and we will come to him and make our dwelling with him.”
translation:
  language: ar
  text: 'أجاب يسوع وقال له: «إن أحبَّني أحد، فسيحفظ كلامي[a]، وسيحبُّه أبي، وسنأتي إليه، ونتخذ عنده مسكنًا[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «تعليمي» أو «ما أقوله».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «ونجعل لنا عنده مسكنًا» أو «ونتخذ عنده منزلًا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ
  choice: أجاب يسوع وقال له
  rationale: يحافظ على صيغتي الفعل في اليونانية وعلى الأسلوب السردي، مع بقاء العبارة عربية واضحة ومألوفة.
- source_word: Ἐάν τις ἀγαπᾷ με
  choice: إن أحبَّني أحد
  rationale: ينقل الشرط المفتوح العام بصياغة عربية موجزة، و«أحد» تشمل أي شخص من غير تقييد.
- source_word: τὸν λόγον μου τηρήσει
  choice: فسيحفظ كلامي
  rationale: «كلامي» يحافظ على دلالة λόγος اليوحناوية، و«يحفظ» ينقل معنى τηρέω الواسع، الذي يشمل التمسك والطاعة دون حصره في تنفيذ الأوامر فقط. وأُظهرت دلالة المستقبل بحرف السين.
- source_word: ὁ πατήρ μου ἀγαπήσει αὐτόν
  choice: وسيحبُّه أبي
  rationale: صياغة طبيعية تحافظ على المستقبل وعلى تسمية الله «أبي» كما وردت على لسان يسوع.
- source_word: πρὸς αὐτὸν ἐλευσόμεθα
  choice: وسنأتي إليه
  rationale: ينقل حركة المجيء نحو الشخص ويحافظ صراحة على المتكلم الجمع في الفعل اليوناني.
- source_word: μονὴν παρ’ αὐτῷ ποιησόμεθα
  choice: ونجعل عنده مسكننا
  rationale: «مسكن» مقابل واضح لـ μονή، وترتيب العبارة عربي طبيعي يعبّر عن الإقامة لدى الشخص. أُضيف ضمير الجمع في «مسكننا» لإظهار علاقة المسكن بالفاعل الجمع، وهي مفهومة من السياق اليوناني.
theological_decisions:
- issue: فاعل الجمع في «سنأتي... ونجعل»
  choice: الإبقاء على صيغة الجمع التي تشير في السياق إلى يسوع والآب معًا
  alternative: تخفيف صيغة الجمع أو إعادة العبارة بالمفرد
  rationale: الفعلان اليونانيان بصيغة المتكلم الجمع صريحان، ويعرضان مجيء يسوع والآب وعملهما المشترك من غير أن تضيف الترجمة شرحًا عقائديًا إلى النص.
- issue: مرجع الضمير المفرد العام
  choice: «أحد» ثم ضمير الغائب المذكر المفرد في «سيحبّه» و«إليه» و«عنده»
  alternative: إعادة الاسم أو استعمال صياغة جمع لتجنب الضمير المذكر
  rationale: العربية الفصحى تستعمل المذكر المفرد استعمالًا عامًا بعد «أحد»، وهذا يحفظ العدد المفرد في الأصل من غير تضييق نطاق العبارة على الرجال.
- issue: طبيعة السكن الإلهي
  choice: «نجعل عنده مسكننا»
  alternative: «نقيم معه» أو «نجعل فيه مسكننا»
  rationale: παρ’ αὐτῷ تعني «عنده/معه» ولا تقول صراحة «فيه»؛ لذلك حُفظ معنى الحضور والإقامة من غير تحويله إلى تحديد مكاني أو لاهوتي أضيق.
translation_notes:
  register: فصحى معاصرة واضحة ذات نبرة كتابية وقورة. استُعملت «أبي» بحسب الإضافة الأصلية، و«مسكننا» بدل «منزلنا» لتجنب غلبة الدلالة المنزلية المادية الحديثة. وُضعت علامتا الحاشية مباشرة بعد اللفظ الذي تشرحه كل حاشية.
