  terminology: «كلامي» مقابل مناسب لـ λόγος ويحفظ الرنين اليوحناوي، و«يحفظ» مناسب لـ τηρήσει. و«أبي» و«سيحبه» و«سنأتي إليه» سليمة. ويظل «مسكن» مقابلاً جيدًا لـ μονή؛ والتعديل يقتصر على تركيب الفعل مع الاسم النكرة.
