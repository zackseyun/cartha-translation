lexical_decisions:
- source_word: πιστεύετέ μοι
  choice: صدِّقوني
  rationale: الفعل πιστεύω مع ضمير المفعول غير المباشر μοι يعني هنا قبول قول المتكلم وتصديقه. و«صدِّقوني» تعبير عربي مباشر وطبيعي يحفظ النداء الشخصي من غير توسيعه إلى معنى آخر.
- source_word: ὅτι
  choice: '[علامة النقطتين بعد «صدِّقوني»]'
  rationale: تُدخل ὅτι مضمون ما ينبغي تصديقه. وتؤدي النقطتان هذا الدور في العربية بسلاسة ووضوح، بدل تركيب أثقل مثل «صدِّقوني أنني».
- source_word: ἐγὼ ἐν τῷ πατρὶ καὶ ὁ πατὴρ ἐν ἐμοί
  choice: أنا في الآب، والآب فيَّ
  rationale: تحافظ «في» على التكرار المقصود وعلى لغة السكن المتبادل في يوحنا، من غير استبدالها بتفسير مثل «متحد بالآب» أو «واحد مع الآب».
- source_word: εἰ δὲ μή
  choice: وإلا
  rationale: تعبير عربي موجز وطبيعي يحفظ الانتقال إلى أساس بديل للتصديق إذا لم يُقبل النداء السابق.
- source_word: διὰ τὰ ἔργα αὐτὰ
  choice: بسبب الأعمال نفسها
  rationale: تفيد διά مع النصب السبب أو الأساس، وتشدد αὐτά على الأعمال ذاتها بوصفها شاهدًا؛ لذلك تحافظ العبارة على المعنى وعلى التوكيد.
- source_word: πιστεύετε
  choice: فصدِّقوا
  rationale: أُبقي الفعل مطلقًا بلا مفعول صريح كما في اليونانية، فلا تُضاف عبارة «بي» أو «كلامي» تفسيرًا لما لم يصرح به النص.
theological_decisions:
- issue: السكن المتبادل بين الابن والآب
  choice: أنا في الآب، والآب فيَّ
  alternative: أنا واحد مع الآب، والآب واحد معي
  rationale: تحفظ الصياغة لغة النص العلائقية العميقة ولا تختزلها في صياغة عقائدية تفسيرية، مع إبقاء قوة القول ولاهوته.
- issue: أساس التصديق المستمد من الأعمال
  choice: فصدِّقوا بسبب الأعمال نفسها
  alternative: فصدِّقوني بسبب الأعمال نفسها / فآمنوا بي بسبب الأعمال نفسها
  rationale: لا يذكر الفعل اليوناني الأخير مفعولًا صريحًا. لذلك يُترك مطلقًا، وتُعرض الأعمال بوصفها أساس التصديق، من غير إدخال مفعول غير وارد في النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «صدِّقوني» بدل «آمنوا بي» لأن الفعل الأول يتعدى هنا إلى μοι، بينما تُرك الفعل الثاني بلا مفعول كما في الأصل. ووُضع مرجع الحاشية بعد الجملة التي تشرحها.
