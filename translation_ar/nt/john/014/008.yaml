  text: Λέγει αὐτῷ Φίλιππος· Κύριε, δεῖξον ἡμῖν τὸν πατέρα, καὶ ἀρκεῖ ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/008.yaml
  text: Philip said to him[a], “Lord, show us the Father, and that is enough for us.”
translation:
  language: ar
  text: 'قال له فيلبس: «يا رب، أرِنا الآب، وهذا يكفينا».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يا سيد، أرِنا الآب، وهذا يكفينا».'
    reason: بديل معجمي ممكن للفظ κύριε بوصفه نداء احترام.
lexical_decisions:
- source_word: Λέγει
  choice: قال
  rationale: الفعل مضارع تاريخي في اليونانية، لكن الماضي «قال» هو الأسلوب الطبيعي في السرد العربي الحديث ويحفظ وظيفته السردية.
- source_word: αὐτῷ
  choice: له
  rationale: ضمير في حالة المجرور الدالة هنا على المخاطَب، وصياغته العربية الطبيعية «قال له».
- source_word: Φίλιππος
  choice: فيلبس
  rationale: نقل الاسم بحسب الصيغة العربية الكتابية الشائعة.
- source_word: Κύριε
  choice: يا رب
  rationale: صيغة نداء من κύριος؛ و«يا رب» تحفظ دلالة التوقير والثقل المسيحاني في سياق يوحنا، مع بقاء معنى «يا سيد» ممكنًا من جهة اللفظ.
- source_word: δεῖξον
  choice: أرِنا
  rationale: أمر مباشر من δείκνυμι بمعنى إظهار شخص أو جعله منظورًا أو معروفًا؛ «أرِنا» موجزة وطبيعية.
- source_word: τὸν πατέρα
  choice: الآب
  rationale: يشير السياق إلى الله بوصفه أبا يسوع؛ و«الآب» هو المقابل العربي الواضح والمألوف لهذا الاستعمال اللاهوتي.
- source_word: καὶ
  choice: و
  rationale: حرف عطف بسيط يربط الطلب بما يراه فيلبس كافيًا.
- source_word: ἀρκεῖ ἡμῖν
  choice: هذا يكفينا
  rationale: يحمل ἀρκέω معنى الكفاية، والضمير الإشاري «هذا» يستأنف مضمون الطلب السابق طبيعيًا في العربية من غير إضافة تفسيرية.
theological_decisions:
- issue: ترجمة κύριος في مخاطبة يسوع
  choice: يا رب
  alternative: يا سيد
  rationale: «يا رب» أنسب لسياق إنجيل يوحنا وتحفظ ما قد يحمله اللقب من معنى يتجاوز مجرد الاحترام، من غير أن تجعل هذا المعنى صريحًا أكثر من الأصل. وأُثبت البديل الممكن في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. حُوِّل المضارع التاريخي اليوناني إلى الماضي الطبيعي في السرد العربي، وحُفظت الجملة قصيرة ومباشرة كما في الأصل.
