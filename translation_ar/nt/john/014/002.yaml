id: JHN.14.2
reference: John 14:2
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἐν τῇ οἰκίᾳ τοῦ πατρός μου μοναὶ πολλαί εἰσιν· εἰ δὲ μή, εἶπον ἂν ὑμῖν ⸀ὅτι πορεύομαι ἑτοιμάσαι τόπον ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/002.yaml
  text: In my Father's house there are many dwelling places[a]. If it were not so[b], would I have told you that I am going to prepare a place for you?
translation:
  language: ar
  text: في بيت أبي مساكن كثيرة[a]. ولو لم يكن الأمر كذلك، فهل كنت سأقول لكم إنني ذاهب لأهيئ لكم مكانًا؟[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «غرف كثيرة». تدل الكلمة اليونانية على أماكن للإقامة أو السكن؛ و«مساكن» أوسع دلالة، كما تحفظ صلتها بموضوع السكن والثبات في هذا الأصحاح.'
    reason: lexical_alternative
  - marker: b
    text: 'ويمكن أيضًا ترجمة العبارة خبرًا: «ولو لم يكن الأمر كذلك، لكنت قد قلت لكم، لأنني ذاهب لأهيئ لكم مكانًا». فالتركيب اليوناني يحتمل هذه القراءة أيضًا، إذ لم تكن علامات الترقيم جزءًا من النص الأصلي.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἰκίᾳ
  choice: بيت
  rationale: تدل الكلمة هنا على البيت أو المنزل على نحو طبيعي، و«بيت أبي» تحافظ على الصورة المحسوسة والتعبير اليوحناوي من غير تحويله تفسيريًا إلى «أسرة».
- source_word: πατρός μου
  choice: أبي
  rationale: هذه صياغة عربية طبيعية للإضافة اليونانية، وتشير في سياق كلام يسوع إلى الآب.
- source_word: μοναὶ πολλαί
  choice: مساكن كثيرة
  rationale: μονή موضع للإقامة أو السكن. و«مساكن» أوسع من «غرف»، كما تحفظ الصلة اللفظية بفكرة السكن والثبات في هذا الأصحاح.
- source_word: εἰ δὲ μή
  choice: ولو لم يكن الأمر كذلك
  rationale: تُظهر العبارة الشرط المفهوم بوضوح وطبيعية في العربية.
- source_word: εἶπον ἂν ὑμῖν
  choice: فهل كنت سأقول لكم
  rationale: تنقل الصيغة الشرطية مع القوة الاستفهامية البلاغية في القراءة المختارة، من غير إخفاء إمكان فهمها خبرًا، وهو مذكور في الحاشية.
- source_word: ὅτι
  choice: إنني
  rationale: تُفهم هنا على أنها تدخل مضمون القول؛ أما إمكان فهمها سببية بمعنى «لأنني» فمحفوظ في الحاشية.
- source_word: πορεύομαι
  choice: ذاهب
  rationale: تعبر عن الحاضر ذي الدلالة القريبة أو المستقبلية وتحفظ مباشرة قول يسوع.
- source_word: ἑτοιμάσαι
  choice: لأهيئ
  rationale: تنقل مصدر الغاية بعبارة عربية واضحة وطبيعية.
- source_word: τόπον
  choice: مكانًا
  rationale: اللفظ اليوناني عام، لذلك لا ينبغي تضييقه إلى «غرفة».
- source_word: ὑμῖν
  choice: لكم
  rationale: تنقل دلالة المستفيد، كما تُظهر صيغة الجمع العربية أن الخطاب موجّه إلى أكثر من شخص.
theological_decisions:
- issue: دلالة μονή في الصورة الأخروية
  choice: مساكن كثيرة
  alternative: غرف كثيرة؛ قصور كثيرة
  rationale: «مساكن» تحافظ على معنى مواضع الإقامة من غير الإيحاء بتقسيمات معمارية لا يصرح بها النص، ومن غير المبالغة الحديثة التي قد توحي بها «قصور».
- issue: ترقيم الجملة الثانية وقوتها
  choice: 'سؤال بلاغي: «ولو لم يكن الأمر كذلك، فهل كنت سأقول لكم إنني ذاهب لأهيئ لكم مكانًا؟»'
  alternative: 'خبر: «ولو لم يكن الأمر كذلك، لكنت قد قلت لكم، لأنني ذاهب لأهيئ لكم مكانًا.»'
  rationale: النص اليوناني الأصلي لا يحسم بعلامات ترقيمه إن كانت العبارة سؤالًا بلاغيًا، ولا يحسم تمامًا وظيفة ὅτι هنا. اختير السؤال لسلاسته في السياق، مع إثبات القراءة الخبرية الممكنة في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. استُخدمت «بيت أبي» لبساطتها ورسوخها، و«مساكن» لدقتها واتساعها، مع تجنب «منازل» إن فُهمت على أنها بيوت مستقلة وتجنب «قصور» لما تحمله من إيحاء زائد. أُبقي الالتباس الحقيقي في تركيب الجملة الثانية ظاهرًا بالحاشية.
