  text: Do not let your heart be troubled[a]. Believe in God[b]; believe also in me.
translation:
  language: ar
  text: «لا تضطرب قلوبكم. آمنوا بالله، وآمنوا بي أيضًا». [a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أنتم تؤمنون بالله، فآمنوا بي أيضًا». فصيغة الفعل اليوناني πιστεύετε يمكن أن تكون خبرًا («تؤمنون») أو أمرًا («آمنوا»).'
    reason: alternative_reading
  - marker: b
    text: 'أو: «توكلوا على الله، وتوكلوا عليّ أيضًا». فقد يحمل الفعل معنى الثقة والاتكال إلى جانب الإيمان.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ ταρασσέσθω
  choice: لا تضطرب
  rationale: صيغة النهي مع فعل الغائب المفرد تُنقل طبيعيًا إلى العربية بصيغة «لا تضطرب»، فتحافظ على قوة النهي من غير تكلّف حرفي.
- source_word: ὑμῶν ἡ καρδία
  choice: قلوبكم
  rationale: الأصل يجمع بين ضمير الجمع و«القلب» المفرد على نحو جماعي. وصيغة الجمع «قلوبكم» أفصح وأوضح في العربية عند مخاطبة جماعة، من غير تغيير للمعنى.
- source_word: πιστεύετε
  choice: آمنوا
  rationale: «آمنوا» المقابل المباشر الشائع، ويمكن أن يتضمن معنى الاتكال عند اقترانه بحرف الجر الدال على التوجّه. ويُذكر «توكلوا» بوصفه بديلًا دلاليًا في الحاشية.
- source_word: εἰς τὸν θεόν
  choice: بالله
  rationale: تتطلب العربية المعيارية مع فعل «آمن» حرف الباء؛ وهو ينقل هنا معنى الإيمان المتجه إلى الله بصورة طبيعية.
- source_word: καὶ εἰς ἐμὲ πιστεύετε
  choice: وآمنوا بي أيضًا
  rationale: تكرار الفعل يحفظ التوازي والتوكيد في اليونانية، و«أيضًا» تنقل القوة الإضافية لـκαί.
theological_decisions:
- issue: احتمال الخبر أو الأمر في صيغتي πιστεύετε
  choice: 'اعتبار الصيغتين أمرًا: «آمنوا بالله، وآمنوا بي أيضًا»'
  alternative: «أنتم تؤمنون بالله، فآمنوا بي أيضًا»؛ ويمكن نحويًا أيضًا فهم إحدى الصيغتين أو كلتيهما خبرًا.
  rationale: صيغة المضارع للمخاطب الجمع في اليونانية واحدة في الخبر والأمر، ولذلك يبقى الاحتمال حقيقيًا. يتلاءم الأمران مع النهي الافتتاحي وسياق التعزية والحث، مع إثبات القراءة الخبرية في الحاشية وعدم حسم الغموض دون تنبيه.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل جمع «قلوبكم» لسلامة الأسلوب العربي في خطاب الجماعة، وحُفظ توازي الشطرين وتكرار الفعل. وُضعت علامتا الحاشيتين بعد الآية لأن كلتيهما تتصلان بالجملة الختامية، مع إبقاء الغموض الصرفي والدلالة العلاقية للفعل ظاهرين في الحواشي.
