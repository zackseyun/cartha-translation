  text: Οὐκ ἀφήσω ὑμᾶς ὀρφανούς, ἔρχομαι πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/018.yaml
  text: I will not leave you as orphans[b][a]; I am coming to you.
translation:
  language: ar
  text: لن أترككم يتامى[a]؛ إني آتي إليكم[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لن أترككم بلا رعاية كالأيتام». تشير الصورة اليونانية إلى أبناء تُركوا من دون رعاية الوالدين.'
    reason: lexical_alternative
  - marker: b
    text: قد يشير «إني آتي إليكم» إلى مجيء يسوع بعد القيامة، أو مجيئه بواسطة الروح القدس، أو عودته في المستقبل؛ ولا تحسم العبارة اليونانية وحدها واحدًا من هذه الاحتمالات.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀφήσω
  choice: أترك
  rationale: الفعل هنا بمعنى يترك وراءه، لا بمعنى يغفر أو يسمح. و«أترك» تعبير عربي طبيعي يحافظ على اقترانه بصورة «يتامى».
- source_word: ὀρφανούς
  choice: يتامى
  rationale: تحافظ الكلمة على الصورة العائلية الملموسة لأبناء حُرموا رعاية الوالدين، مع إمكان استعمالها مجازًا لمن تُركوا بلا رعاية.
- source_word: ἔρχομαι
  choice: إني آتي
  rationale: يحافظ المضارع «آتي» على صيغة الحاضر اليونانية وما فيها من قرب وحيوية، من غير تحويلها صراحة إلى مستقبل.
- source_word: πρὸς ὑμᾶς
  choice: إليكم
  rationale: ترجمة عربية مألوفة لحركة المتكلم نحو المخاطَبين.
- source_word: Οὐκ
  choice: لن
  rationale: «لن» تنقل نفي الفعل ذي الدلالة المستقبلية بوضوح وطبيعية في العربية.
theological_decisions:
- issue: مرجع «إني آتي إليكم» وتوقيت هذا المجيء
  choice: إبقاء العبارة عامة من غير تعيين المقصود بالمجيء
  alternative: تخصيصها بظهورات يسوع بعد القيامة، أو مجيئه بواسطة الروح القدس، أو عودته في المستقبل
  rationale: السياق يسمح بأكثر من صلة لاهوتية، والعبارة اليونانية نفسها لا تحسم مرجعًا واحدًا؛ لذلك تحفظ الترجمة هذا الاتساع والتوتر.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة. استُعمل «إني آتي» للمحافظة على فورية المضارع اليوناني، ووُضعت علامتا الحاشيتين عند العبارتين اللتين تحتاجان إلى بيان معجمي ولاهوتي.
