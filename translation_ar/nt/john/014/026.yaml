source:
  edition: SBLGNT
  text: ὁ δὲ παράκλητος, τὸ πνεῦμα τὸ ἅγιον ὃ πέμψει ὁ πατὴρ ἐν τῷ ὀνόματί μου, ἐκεῖνος ὑμᾶς διδάξει πάντα καὶ ὑπομνήσει ὑμᾶς πάντα ἃ εἶπον ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/026.yaml
  text: But the Advocate[a], the Holy Spirit, whom the Father will send in my name, he will teach you all things and remind you of all that I said to you.
translation:
  language: ar
  text: أمّا النصير[a]، الروح القدس الذي سيرسله الآب باسمي، فهو سيعلّمكم كلَّ شيء، ويذكّركم بكلِّ ما قلته لكم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «المعين»، أو «المدافع»، أو «المعزّي». واللفظ اليوناني (باراكليتوس) يدل على من يُدعى ليقف إلى جانب شخص آخر لمساندته أو الدفاع عنه.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παράκλητος
  choice: النصير
  rationale: «النصير» لقب شخصي يدل على من يقف إلى جانب غيره لمساندته والدفاع عنه، فيحفظ شيئًا من اتساع اللفظ اليوناني ولا يحصره في التعزية العاطفية أو المساعدة العامة أو المعنى القضائي وحده. ولأن المقابل العربي الواحد لا يستوعب جميع دلالاته، أُثبتت بدائل رئيسية في الحاشية.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: الروح القدس
  rationale: الصياغة العربية المعاصرة المألوفة والدقيقة لهذا اللقب، وهي تحافظ على دلالة πνεῦμα وعلى تعريفه بصفة القداسة.
- source_word: ὃ πέμψει ὁ πατήρ
  choice: الذي سيرسله الآب
  rationale: يحافظ الموصول المذكر على الإحالة الشخصية إلى «النصير» و«الروح القدس»، ويعبّر المستقبل بـ«سيرسله» عن الفعل اليوناني المستقبلي.
- source_word: ἐν τῷ ὀνόματί μου
  choice: باسمي
  rationale: تعبير عربي طبيعي يحفظ المجال الدلالي للاسم، بما فيه التمثيل والسلطان، من غير حصر العبارة في معنى واحد مثل «نيابةً عني».
- source_word: ἐκεῖνος
  choice: فهو
  rationale: الضمير المنفصل بعد الفاء يبرز الفاعل ويعكس القوة التوكيدية لاسم الإشارة اليوناني المذكر، مع بقاء الأسلوب عربيًا طبيعيًا.
- source_word: διδάξει ὑμᾶς πάντα
  choice: سيعلّمكم كلَّ شيء
  rationale: ترجمة مباشرة واضحة تحفظ شمول πάντα من غير إضافة تحدد نطاقه بما لا يقوله النص.
- source_word: ὑπομνήσει ὑμᾶς
  choice: يذكّركم
  rationale: ينقل بإيجاز وطبيعية المعنى السببي للفعل، أي يجعلكم تتذكرون.
- source_word: πάντα ἃ εἶπον ὑμῖν
  choice: بكلِّ ما قلته لكم
  rationale: يحافظ على شمول العبارة وعلى بنية الموصول وصيغة كلام يسوع المباشرة.
theological_decisions:
- issue: المرجع الشخصي إلى الروح القدس
  choice: 'استخدام الموصول والضمير بصيغة المذكر: «الذي» و«فهو»'
  alternative: صياغة غير شخصية أو الاكتفاء بإحالة توافق الحياد النحوي لكلمة πνεῦμα في اليونانية
  rationale: يجمع النص بين πνεῦμα المحايدة نحويًا ولقب παράκλητος المذكر، ثم يستعمل ἐκεῖνος المذكر المؤكد، مع أفعال التعليم والتذكير؛ لذلك تحفظ الصياغة العربية الوكالة الشخصية الظاهرة في تركيب الآية من غير بناء استنتاجات زائدة عليه.
- issue: ترجمة لقب παράκλητος
  choice: النصير
  alternative: المعين، أو المدافع، أو المعزّي
  rationale: اللفظ اليوناني واسع الدلالة ويشير إلى شخص يُدعى ليقف إلى جانب آخر، بما قد يشمل المعونة والتأييد والدفاع والتشجيع. اختير «النصير» لاتساعه النسبي، وأُبقيت البدائل في الحاشية منعًا لطمس التوتر الدلالي أو حصر اللقب في وظيفة واحدة.
translation_notes:
  register: العربية فصحى معاصرة واضحة ووقورة. استُعمل تركيب «أمّا... فهو» ليؤدي الانتقال بـδέ ويبرز ἐκεῖνος، مع الحفاظ على ترتيب الأفكار وتكرار معنى الشمول في النص اليوناني.
