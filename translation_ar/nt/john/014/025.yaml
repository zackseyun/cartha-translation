  register: عربية فصحى معاصرة واضحة ووقورة. استُعملت «قد قلت» لنقل دلالة صيغة التام، و«باقٍ» للمحافظة على لفظ يوحنا المتكرر، مع تجنب الصياغة الحرفية المتكلفة.
