lexical_decisions:
- source_word: Ταῦτα
  choice: هذِهِ الأُمُورَ
  rationale: يحافظ على صيغة الجمع المحايد وإحالته إلى التعاليم السابقة، وهو أوضح في العربية من إفراد اسم الإشارة.
- source_word: λελάληκα
  choice: قَدْ قُلْتُ
  rationale: ينقل معنى الفعل في صيغة التام؛ وتفيد «قد» أن الكلام قد صدر، مع بقاء صلته بالحاضر، بينما تبدو «قلت» طبيعية في العربية.
- source_word: ὑμῖν
  choice: لَكُمْ
  rationale: ينقل ضمير المخاطبين الجمع من غير إضافة تفسيرية مثل «جميعًا».
- source_word: παρ’ ὑμῖν
  choice: مَعَكُمْ
  rationale: يعبّر طبيعيًا عن الحضور والقرب اللذين تفيدهما παρά مع المجرور في هذا السياق.
- source_word: μένων
  choice: وَأَنَا بَاقٍ
  rationale: ينقل اسم الفاعل الحاضر بصيغة حالية، ويحافظ على الصلة المعجمية بفعل μένω المتكرر في يوحنا دون أن يجعل العبارة متكلفة.
theological_decisions:
- issue: الحفاظ على الترابط الموضوعي للفظ μένω في إنجيل يوحنا
  choice: وَأَنَا بَاقٍ مَعَكُمْ
  alternative: وَأَنَا مُقِيمٌ مَعَكُمْ / مَا دُمْتُ مَعَكُمْ
  rationale: «باقٍ» يحافظ على المعنى الأساسي وعلى تكرار لفظ البقاء في يوحنا، من غير تحميل العبارة معنى عقائديًا زائدًا؛ أما «ما دمت» فأكثر سلاسة لكنه يحجب اللفظ المفتاحي.
