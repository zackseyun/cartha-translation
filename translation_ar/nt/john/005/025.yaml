  text: Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι ἔρχεται ὥρα καὶ νῦν ἐστιν ὅτε οἱ νεκροὶ ⸀ἀκούσουσιν τῆς φωνῆς τοῦ υἱοῦ τοῦ θεοῦ καὶ οἱ ἀκούσαντες ⸀ζήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/025.yaml
  text: Truly[a], truly, I say to you that an hour is coming, and now is, when the dead will hear the voice of the Son of God[d][c][b], and those who hear will live.
translation:
  language: ar
  text: '«الحقَّ الحقَّ أقول لكم: تأتي ساعة، وهي الآن حاضرة، حين يسمع الموتى صوت ابن الله، والذين يسمعون[a] يحيون.»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أيضًا ترجمة «الذين يسمعون» بـ«الذين سمعوا» أو «الذين يكونون قد سمعوا»، لأن الصيغة اليونانية حرفيًا أقرب إلى «الذين سمعوا».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  choice: الحقَّ الحقَّ
  rationale: صياغة عربية راسخة ومفهومة تحفظ التكرار التوكيدي والنبرة الاحتفالية، مع تجنب نقل «آمين» الذي قد لا يُفهم هنا بوصفه افتتاحًا لتوكيد القول.
- source_word: λέγω ὑμῖν
  choice: أقول لكم
  rationale: ينقل الخطاب المباشر ويحافظ على الإيقاع اليوحناوي بصياغة عربية طبيعية وفصيحة.
- source_word: ἔρχεται ὥρα
  choice: تأتي ساعة
  rationale: يحفظ لفظ «ساعة» المهم في إنجيل يوحنا، ولا يوسعه تفسيريًا إلى «وقت».
- source_word: καὶ νῦν ἐστιν
  choice: وهي الآن
  rationale: صياغة عربية موجزة تحافظ على التوتر بين مجيء الساعة وحضورها الآن، من دون إضافة «قد أتت» أو «حاضرة».
- source_word: οἱ νεκροὶ
  choice: الموتى
  rationale: ترجمة مباشرة لا تحصر المقصود في الموت الروحي أو الجسدي.
- source_word: ἀκούσουσιν τῆς φωνῆς
  choice: يسمع الموتى صوت
  rationale: «صوت» أنسب من «نبرة» أو «صدى» في هذا السياق الشخصي، و«يسمع» لا يفترض مسبقًا معنى الطاعة.
- source_word: τοῦ υἱοῦ τοῦ θεοῦ
  choice: ابن الله
  rationale: يحفظ اللقب المسيحاني كاملًا وبالصيغة العربية المألوفة والواضحة.
- source_word: οἱ ἀκούσαντες
  choice: الذين يسمعون
  rationale: ينقل اسم الفاعل اليوناني الأوريستي بصياغة عربية طبيعية ضمن علاقة السماع بالحياة، مع الإشارة في الحاشية إلى إمكان نقله بصيغة الماضي.
- source_word: ζήσουσιν
  choice: يحيون
  rationale: ينقل معنى ζάω مباشرة من غير تضييقه إلى «يقومون إلى الحياة»، مما يحفظ إمكان الرنين الروحي والقيامي معًا.
theological_decisions:
- issue: المقصود بـ«الموتى»
  choice: الإبقاء على «الموتى» بلا تفسير مضاف
  alternative: الأموات روحيًا؛ أو الموتى جسديًا
  rationale: عبارة «وهي الآن» تشير إلى بُعد حاضر، بينما يتناول السياق اللاحق قيامة الأجساد؛ لذلك ينبغي ألا تحسم الترجمة التوتر لصالح معنى واحد.
- issue: العلاقة الزمنية في «تأتي ساعة، وهي الآن»
  choice: الحفاظ على الجمع بين المستقبل والحاضر
  alternative: قد أتت الساعة الآن؛ أو ستأتي الساعة لاحقًا
  rationale: النص يجمع صراحة بين مجيء الساعة وكونها الآن، وهو توتر لاهوتي وزمني مقصود لا ينبغي تسويته.
- issue: لقب «ابن الله»
  choice: إثبات اللقب كما في اليونانية
  alternative: ابنُه؛ أو ابن الله الإلهي
  rationale: الصيغة المختارة تعكس النص مباشرة، بلا حذف للقب ولا إضافة تفسير عقائدي إليه.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة، مع إيقاع قريب من الأسلوب الكتابي المألوف. استُبقيت «ساعة» و«الموتى» و«يحيون» للمحافظة على اتساع الدلالة والتوتر اللاهوتي في الأصل. وُضع مؤشر الحاشية بعد الجملة التي تتعلق بها.
