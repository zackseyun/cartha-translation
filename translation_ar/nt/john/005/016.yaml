  text: And because of this the Jews were persecuting Jesus[a], because he was doing these things on the Sabbath.
translation:
  language: ar
  text: وَلِهٰذَا كَانَ الْيَهُودُ يَضْطَهِدُونَ يَسُوعَ[a]، لِأَنَّهُ كَانَ يَفْعَلُ هٰذِهِ الْأُمُورَ يَوْمَ السَّبْتِ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو «أهل اليهودية»، أو بحسب السياق: «قادة اليهود». كثيرًا ما يشير هذا التعبير في إنجيل يوحنا إلى جماعة معيّنة كانت تعارض يسوع، لا إلى كل يهودي بلا تمييز.'
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: ولهذا
  rationale: تفيد العبارة السببية، وتربط اضطهاد يسوع بما سبق من حدث ربطًا طبيعيًا وواضحًا في العربية.
- source_word: ἐδίωκον
  choice: كانوا يضطهدون
  rationale: ينقل الفعل معنى العداء والملاحقة المؤذية، بينما تعبّر صيغة «كانوا» عن الاستمرار أو التكرار الذي تدل عليه صيغة الماضي الناقص اليونانية، من غير استباق نية القتل المذكورة لاحقًا.
- source_word: οἱ Ἰουδαῖοι
  choice: اليهود
  rationale: ترجمة مباشرة للتعبير اليوناني، من غير تضييق مرجعه في المتن إلى «القادة»؛ وتوضح الحاشية إمكان أن يدل في السياق على جماعة محددة من المعارضين.
- source_word: ταῦτα
  choice: هذه الأمور
  rationale: تحافظ على صيغة الجمع وإشارتها إلى الأفعال المذكورة في السياق السابق.
- source_word: ἐποίει
  choice: كان يفعل
  rationale: تنقل الاستمرارية التي تحملها صيغة الماضي الناقص، وتبقي الاتهام متعلقًا بممارسة متواصلة أو متكررة.
- source_word: ἐν σαββάτῳ
  choice: في السبت
  rationale: تعبير عربي واضح عن وقوع الفعل في زمن السبت، من غير فرض التنكير غير المصرح به في السياق.
theological_decisions:
- issue: مرجع οἱ Ἰουδαῖοι وترجمته في إنجيل يوحنا
  choice: اليهود
  alternative: اليهوديون؛ أو، بحسب السياق، قادة اليهود
  rationale: أُبقيت الترجمة المعجمية المباشرة في المتن حفاظًا على ألفاظ المصدر، مع حاشية تمنع تعميم الإشارة على جميع اليهود بلا تمييز، إذ قد يشير استعمال يوحنا في مثل هذا السياق إلى فئة معينة معارضة ليسوع.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ووقورة. استُخدم التركيب «كانوا يضطهدون» و«كان يفعل» لإبراز الاستمرار في الفعلين، مع إبقاء اللفظ المباشر «اليهود» وإيضاح نطاقه السياقي في الحاشية.
