lexical_decisions:
- source_word: ὁ πέμψας με πατὴρ
  choice: الآب الذي أرسلني
  rationale: اسم الفاعل اليوناني المعرَّف يؤدي وظيفة وصفية مع «الآب»، والصلة العربية تنقل هذا التعريف بوضوح وطبيعية.
- source_word: ἐκεῖνος
  choice: هو
  rationale: الضمير المنفصل بعد ذكر الآب يستأنفه ويؤكده في العربية من غير غرابة «ذلك»، ويحفظ إبراز أن الآب نفسه هو الشاهد.
- source_word: μεμαρτύρηκεν περὶ ἐμοῦ
  choice: قد شهد لي
  rationale: «شهد لي» تعبير عربي طبيعي ينقل معنى الشهادة المتعلقة بيسوع والمؤيدة له، و«قد» مع الماضي تُبرز تحقق الشهادة وبقاء صلتها بالسياق.
- source_word: οὔτε ... οὔτε
  choice: لم ... ولا
  rationale: هذا هو البناء العربي الطبيعي للنفي المترابط في جملة فعلية، ويحفظ توازي السماع والرؤية.
- source_word: φωνὴν αὐτοῦ πώποτε ἀκηκόατε
  choice: لم تسمعوا صوته قط
  rationale: «قط» مع النفي تنقل πώποτε بمعنى «في أي وقت»، وصيغة الماضي العربية طبيعية هنا ولا تستلزم إهمال دلالة الخبرة الممتدة إلى الحاضر.
- source_word: εἶδος αὐτοῦ ἑωράκατε
  choice: رأيتم هيئته
  rationale: «هيئة» تنقل مجال εἶδος بوصفه الصورة أو المظهر المرئي، مع إبقاء العبارة غير محسومة بين الشكل والمظهر.
theological_decisions:
- issue: توكيد ἐκεῖνος العائد إلى الآب
  choice: إبراز الضمير في «هو قد شهد لي»
  alternative: «ذاك قد شهد لي» أو «هو نفسه قد شهد لي»
  rationale: الضمير المنفصل يحفظ التوكيد والاستئناف في عربية طبيعية، من دون إضافة لفظ «نفسه» غير الموجود صراحة أو استعمال «ذاك» الذي قد يوحي بمسافة أو جفاء.
- issue: مدلول εἶδος αὐτοῦ
  choice: «هيئته»
  alternative: «صورته» أو «مظهره»
  rationale: «هيئته» تبقي مجال اللفظ مفتوحًا بين الصورة المرئية والمظهر، فلا تحسم طبيعة الإدراك المقصود ولا تضيف تقريرًا لاهوتيًا.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «شهد لي» لسلامته وطبيعته في سياق الشهادة المؤيدة، وحُفظت الفاصلة الختامية لأن الآية تتصل نحويًا بما يليها.
