lexical_decisions:
- source_word: ἦν δέ
  choice: وكان
  rationale: الواو تنقل الربط السردي الخفيف الذي تؤديه δέ من غير أن تفرض معنى زمنيًا أو تضادًا قويًا، و«كان» يقدّم الشخصية في المشهد بصورة طبيعية.
- source_word: τις ἄνθρωπος
  choice: رجلٌ
  rationale: تدل العبارة على فرد غير معيّن؛ والتنكير في «رجلٌ» يؤدي هذا المعنى طبيعيًا من غير إضافة «معيّن» التي قد تبدو أثقل من الأصل.
- source_word: ἐκεῖ
  choice: هناك
  rationale: تشير إلى موضع المشهد المذكور في السياق السابق، و«هناك» هي المقابل المباشر والطبيعي.
- source_word: τριάκοντα ὀκτὼ ἔτη
  choice: ثمانٍ وثلاثين سنة
  rationale: هذه الصياغة العربية المعيارية للعدد مع «سنة»، وتحافظ على المدة المحددة في الأصل.
- source_word: ἔχων
  choice: يعاني ... منذ
  rationale: اسم الفاعل اليوناني مع مدة الزمن وشبه الجملة يصف حالة مستمرة حتى زمن الحدث؛ و«يعاني ... منذ» تنقل الاستمرار بعبارة عربية واضحة وطبيعية.
- source_word: ἐν τῇ ἀσθενείᾳ αὐτοῦ
  choice: من مرضه
  rationale: يمكن أن تعني ἀσθένεια الضعف أو المرض. وفي هذا السياق الجسدي، «مرضه» واضحة من غير تحديد نوع العلة، بينما تحفظ الحاشية البدائل المعجمية الحقيقية.
