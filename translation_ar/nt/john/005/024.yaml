source:
  edition: SBLGNT
  text: Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι ὁ τὸν λόγον μου ἀκούων καὶ πιστεύων τῷ πέμψαντί με ἔχει ζωὴν αἰώνιον, καὶ εἰς κρίσιν οὐκ ἔρχεται ἀλλὰ μεταβέβηκεν ἐκ τοῦ θανάτου εἰς τὴν ζωήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/024.yaml
  text: Truly[a], truly, I say to you, whoever hears my word and believes him who sent me has eternal life, and does not come into judgment[b], but has passed from death into life.
translation:
  language: ar
  text: '«الحقَّ الحقَّ أقول لكم: مَن يسمع كلامي ويؤمن بالذي أرسلني فله حياة أبدية، ولا يأتي إلى الدينونة[a]، بل قد انتقل[b] من الموت إلى الحياة».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «ولا يأتي إلى الإدانة». قد تعني الكلمة اليونانية κρίσις «الدينونة» أو «الحكم» عمومًا، وقد تدل في هذا السياق على حكم بالإدانة.'
    reason: lexical_alternative
  - marker: b
    text: 'يدل الفعل اليوناني بصيغة التام على انتقال اكتمل وما زالت نتيجته قائمة: «قد انتقل» أو «قد عبر» من الموت إلى الحياة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  choice: الحقَّ الحقَّ
  rationale: ينقل صيغة التوكيد المزدوجة المهيبة في كلام يسوع، بعبارة عربية مألوفة وواضحة، بدل إبقاء «آمين» دون ترجمة.
- source_word: λέγω ὑμῖν
  choice: أقول لكم
  rationale: ترجمة مباشرة وطبيعية لصيغة الخطاب.
- source_word: ὁ ... ἀκούων καὶ πιστεύων
  choice: مَن يسمع ... ويؤمن
  rationale: تفيد «مَن» العموم الذي تحمله صيغتا اسم الفاعل المعرّفتان، من غير تقييد بالجنس.
- source_word: τὸν λόγον μου
  choice: كلامي
  rationale: يشير λόγος هنا إلى كلام يسوع ورسالته المسموعة، و«كلامي» تعبير عربي طبيعي يحفظ الصلة اليوحناوية بمفهوم الكلمة.
- source_word: πιστεύων τῷ πέμψαντί με
  choice: يؤمن بالذي أرسلني
  rationale: ينقل معنى الإيمان والثقة بالمرسِل بصياغة عربية فصيحة مألوفة، مع بقاء صلة الإيمان بالذي أرسل يسوع ظاهرة.
- source_word: ἔχει ζωὴν αἰώνιον
  choice: فله حياة أبدية
  rationale: تُظهر اللام امتلاك الحياة في الحاضر كما يدل المضارع ἔχει، وتحافظ «حياة أبدية» على التعبير اليوحناوي المستقر.
- source_word: εἰς κρίσιν οὐκ ἔρχεται
  choice: ولا يأتي إلى الدينونة
  rationale: تحافظ «الدينونة» على معنى κρίσις بوصفه حكمًا قضائيًا قد يكون سلبيًا في السياق، من غير التصريح مسبقًا بنتيجته بوصفها إدانة.
- source_word: μεταβέβηκεν
  choice: بل قد انتقل
  rationale: «قد» مع الماضي تعبّر عن انتقال تمّ فعلًا، بينما يبيّن السياق استمرار نتيجته؛ فلا تُختزل العبارة في رجاء مستقبلي فقط.
- source_word: ἐκ τοῦ θανάτου εἰς τὴν ζωήν
  choice: من الموت إلى الحياة
  rationale: تحفظ المقابلة الحادة واتجاه الانتقال في الأصل اليوناني.
theological_decisions:
- issue: دلالة κρίσις في سياق الخلاص
  choice: الدينونة
  alternative: الإدانة
  rationale: قد تدل الكلمة على القضاء أو الحكم عمومًا، وإن كان السياق يرجّح حكمًا سلبيًا. اختيار «الدينونة» يحفظ سعة اللفظ والتوتر اللاهوتي، وتوضح الجملة التالية النتيجة الخلاصية.
- issue: دلالة المضارع والتام في علاقة الخلاص بالزمن
  choice: امتلاك الحياة الأبدية الآن، وانتقال تمّ من الموت إلى الحياة وما زالت نتيجته قائمة
  alternative: حياة لا تُمتلك إلا مستقبلًا أو تبرئة مستقبلية فقط
  rationale: يفيد المضارع ἔχει امتلاكًا حاضرًا، ويفيد التام μεταβέβηκεν انتقالًا مكتملًا ذا نتيجة مستمرة. تعكس الصياغة هذين الجانبين من غير إدخال منظومة مذهبية خاصة.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة، مع الحفاظ على الإيقاع التوكيدي في مطلع القول وعلى المقابلة اليوحناوية بين الموت والحياة. وُضعت علامتا الحاشيتين عند اللفظين اللذين تشرحهما كل حاشية.
