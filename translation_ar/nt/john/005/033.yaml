  text: أنتم أرسلتم إلى يوحنا، وقد شهد للحق.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑμεῖς
  choice: أنتم
  rationale: أُثبت الضمير المنفصل لإظهار التأكيد الناشئ من ذكر الضمير صراحة في اليونانية، من غير مبالغة مثل «أنتم أنفسكم».
- source_word: ἀπεστάλκατε
  choice: أرسلتم
  rationale: الفعل اليوناني ماضٍ تام في الصيغة، ويُفهم هنا من السياق على أنه إرسال وقع في الماضي؛ والماضي العربي «أرسلتم» طبيعي ودقيق، ولا يلزم تركيب «قد أرسلتم».
- source_word: πρὸς Ἰωάννην
  choice: إلى يوحنا
  rationale: ينقل حرف الجر مع اسم الشخص معنى التوجّه إليه، مع إبقاء الاسم كما ورد من دون إضافة «المعمدان».
- source_word: μεμαρτύρηκε
  choice: شهد
  rationale: «شهد» هو المقابل العربي الطبيعي لمفردات الشهادة، ويحفظ دلالتها القضائية؛ ويفيد السياق بقاء صلة شهادته بالحاضر، وإن لم تكن العربية ملزمة بصيغة مركبة لتجسيد التام اليوناني.
- source_word: τῇ ἀληθείᾳ
  choice: للحق
  rationale: اللام بعد «شهد» تركيب عربي فصيح وطبيعي، و«الحق» يحفظ أداة التعريف وإمكان الصدى اللاهوتي في الاستعمال اليوحناوي من غير تفسير زائد.
theological_decisions:
- issue: دلالة «الحق» في الاستعمال اليوحناوي
  choice: الحق
  alternative: الحقيقة
  rationale: «الحق» يحفظ التعريف ويمكن أن يدل على الصدق والواقع وعلى الدلالة اللاهوتية الأوسع في يوحنا، من غير حصر المعنى في مفهوم عقائدي محدد.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموجزة. استُعملت الفاء لربط شهادة يوحنا بإرسال المخاطَبين إليه ربطًا طبيعيًا، مع الحفاظ على ترتيب الفكرتين في الأصل.
