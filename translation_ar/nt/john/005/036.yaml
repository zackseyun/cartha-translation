  source_fidelity: 'الترجمة أمينة لبنية النص اليوناني ومعناه: أبقت المقابلة في «أمّا أنا»، وصرّحت بمرجع المقارنة المحذوف في «شهادة يوحنا»، وحافظت على غرض منح الأعمال لإتمامها، وعلى توكيد «هذه الأعمال نفسها»، وعلى مضمون شهادة الأعمال بأن الآب أرسل يسوع. وصيغة «قد أرسلني» مناسبة للتام اليوناني في عربية فصيحة طبيعية.'
  naturalness: النص عربي فصيح واضح وذو سجل وقور معاصر. تركيب «أمّا أنا فلي شهادة» سليم، واستعمال المفرد المؤنث «تشهد» مع «الأعمال» صحيح ومألوف، والشرطتان تفصلان الاعتراض التوكيدي بوضوح.
  terminology: اختيارات «شهادة»، و«الأعمال»، و«الآب»، و«أتمّها» متسقة مع الاستعمال اليوحناوي ولا تضيق دلالة النص. وعبارة «من شهادة يوحنا» ترفع التباسًا عربيًا محتملًا مع حفاظها على المعنى الإهليلجي في الأصل. الحاشية مربوطة في موضعها وتشرح هذا الحذف بدقة.
