id: JHN.5.36
reference: John 5:36
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἔχω τὴν μαρτυρίαν ⸀μείζω τοῦ Ἰωάννου, τὰ γὰρ ἔργα ἃ ⸀δέδωκέν μοι ὁ πατὴρ ἵνα τελειώσω αὐτά, αὐτὰ τὰ ἔργα ⸀ἃ ποιῶ, μαρτυρεῖ περὶ ἐμοῦ ὅτι ὁ πατήρ με ἀπέσταλκεν,
base_translation:
  language: en
  yaml_path: translation/nt/john/005/036.yaml
  text: But I have testimony greater than John's[a], for the works that the Father has given me to complete—these very works that I am doing—testify about me that the Father has sent me.
translation:
  language: ar
  text: أَمَّا أَنَا فَلِي شَهَادَةٌ أَعْظَمُ مِنْ شَهَادَةِ يُوحَنَّا،[a] لِأَنَّ الأَعْمَالَ الَّتِي أَعْطَانِي الآبُ لِأُتِمَّهَا—هَذِهِ الأَعْمَالُ نَفْسُهَا الَّتِي أَعْمَلُهَا—تَشْهَدُ لِي بِأَنَّ الآبَ قَدْ أَرْسَلَنِي.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًّا: «أعظم من يوحنا»، والمقصود: أعظم من شهادة يوحنا.'
    reason: يوضح الحذف في صيغة المقارنة اليونانية ويحفظ إمكان الاطلاع على صورتها الأقرب إلى الحرفية.
lexical_decisions:
- source_word: μαρτυρίαν
  choice: شهادة
  rationale: تنقل المعنى الإثباتي والقضائي في السياق اليوحناوي، وتلائم تركيب «لي شهادة» في العربية.
- source_word: μείζω
  choice: أعظم
  rationale: تعكس المقارنة في الدرجة والقيمة، وهي طبيعية عند وصف قوة الشهادة وحجيتها.
- source_word: τοῦ Ἰωάννου
  choice: من شهادة يوحنا
  rationale: يفكّ التقدير المحذوف الذي يدل عليه المضاف إليه اليوناني، ويمنع أن تُفهم المقارنة على أنها بين الشهادة وشخص يوحنا.
- source_word: ἔργα
  choice: الأعمال
  rationale: تحافظ على اللفظ اليوحناوي الواسع، فلا تحصره في المعجزات وحدها.
- source_word: δέδωκέν μοι
  choice: أعطاني
  rationale: صيغة الماضي العربية طبيعية هنا، بينما يظل أثر العطاء المستمر واضحًا من كون الأعمال موكلة إلى يسوع ليتمها.
- source_word: ὁ πατήρ
  choice: الآب
  rationale: ينقل اللقب العلاقي المحدد في النص من غير إضافة ضمير ملكية غير موجود.
- source_word: ἵνα τελειώσω αὐτά
  choice: لأتمها
  rationale: ينقل غرض العطاء ومعنى بلوغ الأعمال تمامها المقصود بإيجاز ووضوح.
- source_word: αὐτὰ τὰ ἔργα ἃ ποιῶ
  choice: هذه الأعمال نفسها التي أعملها
  rationale: يحفظ توكيد αὐτά وإحالة العبارة إلى الأعمال المذكورة، مع إبراز الفعل الجاري.
- source_word: μαρτυρεῖ περὶ ἐμοῦ
  choice: تشهد لي
  rationale: تعبير عربي فصيح طبيعي يفيد الإدلاء بالشهادة المؤيدة ليسوع؛ وجاء الفعل مفردًا مراعاةً لجمع غير العاقل.
- source_word: ἀπέσταλκεν
  choice: قد أرسلني
  rationale: تؤكد «قد» تحقق الإرسال، ويحفظ السياق دلالته المستمرة من غير تركيب عربي متكلف لمحاكاة التام اليوناني.
theological_decisions:
- issue: طبيعة الشهادة المؤيدة ليسوع
  choice: الأعمال التي أوكلها الآب إلى يسوع تشهد بأنه أرسله، وشهادتها أعظم من شهادة يوحنا.
  alternative: حصر الأعمال في المعجزات بوصفها براهين سلطة فقط.
  rationale: لفظ ἔργα أوسع من المعجزات وحدها، والنص نفسه يربط الأعمال بمهمة منحها الآب وبإتمامها، لذلك أبقت الترجمة مدلوله مفتوحًا.
- issue: مرجع المقارنة في «أعظم من»
  choice: التصريح بـ«من شهادة يوحنا».
  alternative: «أعظم من يوحنا» مع إبقاء الحذف اليوناني.
  rationale: المقارنة معنًى بين شهادتين، والتصريح بالمحذوف في العربية يزيل التباسًا غير مقصود من دون تغيير الدعوى.
- issue: لقب ὁ πατήρ
  choice: الآب
  alternative: الله أو أبي
  rationale: النص يقول «الآب» بلا لفظ «الله» وبلا ضمير ملكية، فحُفظت الصيغة العلاقية كما هي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «أمّا أنا فلي» لإبراز المقابلة في ἐγὼ δὲ، ووُضعت الجملة التوكيدية بين شرطتين للمحافظة على بنية الآية وتركيزها.
