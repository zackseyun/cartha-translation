source:
  edition: SBLGNT
  text: καὶ τὸν λόγον αὐτοῦ οὐκ ἔχετε ⸂ἐν ὑμῖν μένοντα⸃, ὅτι ὃν ἀπέστειλεν ἐκεῖνος τούτῳ ὑμεῖς οὐ πιστεύετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/038.yaml
  text: And you do not have his word abiding in you[a], because you do not believe the one whom he sent.
translation:
  language: ar
  text: وليست كلمته ثابتةً فيكم، لأنكم لا تؤمنون بالذي أرسله.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λόγον
  choice: كلمته
  rationale: تشير هنا إلى كلمة الله المعلنة، وتحافظ «كلمته» على التعبير اليوحناوي وعلى الصلة المباشرة بالضمير العائد إلى الآب.
- source_word: οὐκ ἔχετε ... ἐν ὑμῖν μένοντα
  choice: ليست ... ثابتةً فيكم
  rationale: ينقل هذا التركيب معنى عدم وجود الكلمة في داخلهم على نحو مستمر، بصياغة عربية طبيعية، وتحمل «ثابتة» القوة الاستمرارية للفعل μένω.
- source_word: ὅτι
  choice: لأن
  rationale: تقدم الأداة سبب عدم ثبات كلمة الله فيهم، ولذلك فالمعنى السببي هو الأنسب.
- source_word: ὃν ἀπέστειλεν ἐκεῖνος
  choice: الذي أرسله
  rationale: يشير الموصول إلى يسوع، والفاعل المستتر في «أرسله» يعود في السياق إلى الآب. الصياغة العربية طبيعية من غير إضافة تفسيرية إلى المتن.
- source_word: τούτῳ ... οὐ πιστεύετε
  choice: لا تؤمنون بالذي
  rationale: تنقل الباء مع «تؤمنون» علاقة πιστεύω بالمفعول الشخصي، بينما يبرز تقديم الصلة هوية الشخص الذي يرفضون الإيمان به.
theological_decisions:
- issue: العلاقة بين ثبات كلمة الله في السامعين وعدم إيمانهم بالمرسَل
  choice: 'يحافظ النص على العلاقة السببية: ليست كلمة الآب ثابتة فيهم لأنهم لا يؤمنون بالذي أرسله.'
  alternative: قد يُفهم الكلام على أنهم لا يحفظون كلمة الله أو لا يستجيبون لها في داخلهم، من غير تقرير عقيدة أوسع عن التجديد أو السكنى.
  rationale: تتجنب الصياغة حسم طبيعة «ثبات» الكلمة بمصطلحات مذهبية، وتحفظ التوتر اللاهوتي في العبارة.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. اختيرت «ثابتة فيكم» لتؤدي معنى الاستمرار في μένω بصورة طبيعية، مع الحفاظ على الإيجاز والبنية السببية للنص اليوناني.
