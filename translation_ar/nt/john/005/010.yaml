source:
  edition: SBLGNT
  text: ἔλεγον οὖν οἱ Ἰουδαῖοι τῷ τεθεραπευμένῳ· Σάββατόν ἐστιν, ⸀καὶ οὐκ ἔξεστίν σοι ἆραι τὸν ⸀κράβαττον.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/010.yaml
  text: So the Jews were saying to the man who had been healed[a], “It is the Sabbath[c][b], and it is not lawful for you to carry your mat.”
translation:
  language: ar
  text: 'فكان اليهود[a] يقولون للرجل الذي شُفي: «إنه يوم السبت، ولا يحلّ لك أن تحمل[b] فراشك[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: قد يكون المقصود هنا «قادة اليهود» أو «أهل اليهودية»، بحسب استعمال يوحنا للمصطلح في هذا السياق.
    reason: alternative_reading
  - marker: b
    text: أو «ترفع» أو «تأخذ فراشك».
    reason: lexical_alternative
  - marker: c
    text: يشير اللفظ المترجم «فراش» إلى بساط أو مضجع بسيط قابل للحمل، وليس بالضرورة إلى سرير كامل.
    reason: cultural_note
lexical_decisions:
- source_word: ἔλεγον
  choice: كانوا يقولون
  rationale: صيغة الماضي الناقص تدل على كلام جارٍ أو متكرر في الزمن الماضي، وهذا التعبير العربي يحفظ هذا الجانب بصورة طبيعية.
- source_word: οὖν
  choice: فـ
  rationale: الفاء تصل الكلام بما سبقه وتحفظ معنى الاستمرار أو النتيجة في السياق السردي من غير تكلّف.
- source_word: οἱ Ἰουδαῖοι
  choice: اليهود
  rationale: هذا هو المقابل المباشر للعبارة اليونانية. وقد يدل المصطلح في بعض مواضع يوحنا على فئة أضيق، لكن الآية نفسها لا تصرّح بأنهم القادة أو أهل اليهودية حصرًا.
- source_word: τῷ τεθεραπευμένῳ
  choice: للرجل الذي شُفي
  rationale: اسم الفاعل التام المبني للمجهول يشير إلى شفاء تمّ وبقي أثره. وإضافة «الرجل» طبيعية في العربية ويؤيدها سياق المقطع.
- source_word: Σάββατόν ἐστιν
  choice: إنه يوم السبت
  rationale: صياغة عربية واضحة وطبيعية للتقرير الزمني، ولا يقتضي غياب أداة التعريف في اليونانية معنى «يوم سبت ما» هنا.
- source_word: οὐκ ἔξεστίν σοι
  choice: لا يحلّ لك
  rationale: يحفظ التعبير معنى الجواز أو المشروعية، ويلائم سياق الاعتراض المتعلق بأحكام السبت.
- source_word: ἆραι
  choice: أن تحمل
  rationale: يمكن أن يعني الفعل «ترفع» أو «تأخذ»، لكن الاعتراض هنا منصبّ على نقل الفراش يوم السبت، ولذلك يعبّر «تحمل» عن القوة السياقية بوضوح.
- source_word: κράβαττον
  choice: فراشك
  rationale: يدل اللفظ على موضع نوم بسيط قابل للحمل، و«فراش» لفظ عربي طبيعي لا يلزم منه سرير ذو هيكل.
theological_decisions:
- issue: مرجع عبارة οἱ Ἰουδαῖοι في إنجيل يوحنا
  choice: اليهود
  alternative: قادة اليهود؛ أهل اليهودية
  rationale: حُفظ اللفظ العام كما في الأصل لأن السياق المباشر لا يحدد المتكلمين بأنهم القادة ولا يحصرهم جغرافيًا في أهل اليهودية. وتُذكر الاحتمالات الأضيق في الحاشية من غير حسم ما أبقاه النص محتمَلًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت صيغة «فكان ... يقولون» لحفظ الاستمرار السردي، و«لا يحلّ لك» لإبقاء النبرة الشرعية من غير إدخال تفسير مذهبي.
