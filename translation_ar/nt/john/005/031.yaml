  footnotes:
  - marker: a
    text: 'أو: «ليست معتبرة»، بالنظر إلى السياق القضائي المتعلق بالشهادة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐὰν
  choice: إِنْ
  rationale: تؤدي أداة الشرط اليونانية ببساطة، من غير إضافة معنى التكرار.
- source_word: ἐγὼ
  choice: كُنْتُ
  rationale: يظهر ضمير المتكلم في صيغة الفعل العربية، ولا حاجة إلى إبرازه بضمير منفصل قد يضيف توكيدًا أثقل من المطلوب.
- source_word: μαρτυρῶ
  choice: أَشْهَدُ
  rationale: تعبير عربي طبيعي يحفظ معنى الإدلاء بالشهادة وإيحاءه القضائي.
- source_word: περὶ ἐμαυτοῦ
  choice: لِنَفْسِي
  rationale: صياغة عربية مألوفة للشهادة المتعلقة بالذات، مع بقاء احتمال فهمها بمعنى الشهادة في شأن النفس أو لمصلحتها.
- source_word: ἡ μαρτυρία μου
  choice: شَهَادَتِي
  rationale: تحافظ على الصلة اللفظية بالفعل «أشهد» وعلى سياق الشهادة.
- source_word: οὐκ ἔστιν ἀληθής
  choice: لَيْسَتْ صَادِقَةً
  rationale: ينقل المعنى المباشر لـἀληθής ويحفظ التوتر في العبارة، بدل حصرها في معنى القبول أو الحجية القانونية.
theological_decisions:
- issue: معنى قول يسوع إن شهادته ليست ἀληθής
  choice: لَيْسَتْ صَادِقَةً
  alternative: ليست معتبرة / ليست حُجّة
  rationale: اللفظ اليوناني يدل مباشرة على الصدق، مع إمكان أن يحمل السياق القضائي معنى الاعتداد بالشهادة. لذلك يحفظ المتن المعنى المباشر، وتوضح الحاشية البديل السياقي دون إزالة التوتر مع يوحنا 8:14.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدم «أشهد لنفسي» لصياغة طبيعية موجزة، وأُبقي «صادقة» في المتن حفاظًا على الدلالة المباشرة والتوتر التفسيري، مع ذكر المعنى القضائي المحتمل في الحاشية.
