lexical_decisions:
- source_word: ἐν ταύταις
  choice: وفي هذه
  rationale: يحافظ على اسم الإشارة المؤنث الجمع في اليونانية، ويترك مرجعه إلى المنشآت المذكورة في الآية السابقة مفهومًا من السياق من غير إضافة اسم غير موجود في النص.
- source_word: κατέκειτο
  choice: كان يرقد
  rationale: ينقل دلالة الفعل الناقص على الاستمرار في الاضطجاع، ويأتي مفردًا لموافقته «جمع» بوصفه اسم جمع مفردًا.
- source_word: πλῆθος
  choice: جمعٌ
  rationale: يؤدي معنى العدد الكبير المجتمع مع الحفاظ على أسلوب عربي طبيعي رصين، من غير إضافة صفة «كثير» غير مصرّح بها.
- source_word: τῶν ἀσθενούντων
  choice: من المرضى
  rationale: السياق جسدي، ولذلك تعبّر «المرضى» بوضوح عن المصابين بالمرض أو الوهن البدني، لا عن الضعف بمعناه العام.
- source_word: τυφλῶν
  choice: عميان
  rationale: مقابل عربي مباشر وطبيعي للفئة المذكورة في التعداد.
- source_word: χωλῶν
  choice: عرج
  rationale: ينقل بدقة العجز عن المشي أو العرج، ويحافظ على إيجاز التعداد.
- source_word: ξηρῶν
  choice: مشلولون[a]
  rationale: المعنى الحرفي هو «يابسون»، لكنه في وصف الأجساد يشير على الأرجح إلى أعضاء يابسة أو ضامرة وعاجزة عن الحركة؛ لذا تنقل «مشلولون» المعنى الوظيفي بوضوح، مع إثبات الحرفي في الحاشية.
