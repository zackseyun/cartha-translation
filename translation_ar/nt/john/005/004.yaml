  to: لأن ملاكًا كان ينزل إلى البركة من حين إلى آخر ويحرّك الماء. فكان أول من يدخلها بعد تحريك الماء يُشفى من أي مرض كان مصابًا به.[a]
  rationale: يقتصر التعديل على تصحيح الفعل الدال على دخول الشخص إلى البركة، تمييزًا له من نزول الملاك، وعلى تحسين تمثيل التعبير الاصطلاحي اليوناني عن الإصابة بمرض. وحُفظت دلالة التكرار في الماضي في «كان ينزل» و«فكان ... يُشفى»، كما حُفظت الحاشية النقدية ومؤشرها.
