source:
  edition: robinson-pierpont-2005-byzantine
  text: Ἄγγελος γὰρ κατὰ καιρὸν κατέβαινεν ἐν τῇ κολυμβήθρᾳ, καὶ ἐτάρασσεν τὸ ὕδωρ· ὁ οὖν πρῶτος ἐμβὰς μετὰ τὴν ταραχὴν τοῦ ὕδατος, ὑγιὴς ἐγίνετο, ᾧ δήποτε κατείχετο νοσήματι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/005/004.yaml
  text: For an angel would go down into the pool from time to time and stir up the water. Therefore, the first one to step in after the stirring of the water would become well from whatever disease afflicted him.
translation:
  language: ar
  text: لأن ملاكًا كان ينزل إلى البركة من حين إلى آخر ويحرّك الماء. فكان أول من يدخلها بعد تحريك الماء يُشفى من أي مرض كان مصابًا به.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: هذه الآية، ومعها النصف الأخير من الآية 3، غير موجودة في أقدم البرديات اليونانية، مثل البرديتين 66 و75 من القرن الثالث، ولا في مخطوطتين رئيستين من القرن الرابع، هما السينائية والفاتيكانية. لكنها موجودة في غالبية المخطوطات البيزنطية، وكذلك في ترجمات لاتينية وسريانية مبكرة. ويرى كثير من الباحثين أنها إضافة نسخية مبكرة لتفسير سبب اجتماع المرضى عند البركة.
    reason: textual_critical
lexical_decisions:
- source_word: κατὰ καιρόν
  choice: من حين إلى آخر
  rationale: يفيد التعبير وقوع الحدث في أوقات متفرقة أو دوريًا، من غير دلالة لازمة على موسم محدد.
- source_word: κατέβαινεν
  choice: كان ينزل
  rationale: صيغة الماضي الناقص تدل هنا على فعل اعتيادي متكرر في الماضي، وهو ما تؤديه صيغة «كان ينزل» طبيعيًا في العربية.
- source_word: ἐτάρασσεν
  choice: يحرّك
  rationale: السياق يتحدث عن إحداث اضطراب أو حركة في الماء؛ و«يحرّك الماء» تعبير عربي واضح وطبيعي.
- source_word: ἐγίνετο ὑγιής
  choice: كان ... يُشفى
  rationale: ينقل معنى صيرورته صحيحًا، مع الحفاظ على الدلالة الاعتيادية للماضي الناقص.
- source_word: κατείχετο νοσήματι
  choice: كان يعانيه
  rationale: الفعل في المبني للمجهول مع «مرض» يفيد أن المرض كان مستوليًا عليه أو مصيبًا له؛ و«يعانيه» تؤدي المعنى اصطلاحيًا بوضوح.
theological_decisions:
- issue: طبيعة القول عن نزول الملاك والشفاء
  choice: إثبات العبارة كما ترد في النص اليوناني المحدد، مع تنبيه نقدي نصي
  alternative: صياغتها بوصفها اعتقادًا شعبيًا أو حذف الآية من المتن
  rationale: المصدر المطلوب، وهو نص روبنسون-بيربونت البيزنطي، يورد العبارة خبرًا بلا قيد. لا ينبغي إدخال تفسير غير موجود في اليونانية، لكن اختلاف الشواهد المخطوطية مهم ويُذكر في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدمت «البركة» للمسبح ذي الماء، وحوفظ على تكرار الفعل في الماضي بواسطة تركيب «كان» مع المضارع. وُضع مؤشر الحاشية في نهاية الآية لأنه يخص الآية كلها.
