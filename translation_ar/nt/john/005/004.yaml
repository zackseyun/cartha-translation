  source_fidelity: ينقل النص العبارة البيزنطية من حيث الملاك، وتكرار نزوله وتحريكه للماء، وشفاء أول شخص بعد اضطراب الماء. لكن «ينزل إليها» في الشطر الثاني لا يطابق ἐμβὰς، الذي يعني الدخول إلى البركة أو وطأها، لا النزول إليها.
  naturalness: الصياغة فصيحة واضحة عمومًا. واستبدال «ينزل إليها» بـ«يدخلها» أدق وأسلس في هذا الموضع. و«كان مصابًا به» أوضح من «كان يعانيه» في تمثيل كون المرض مستوليًا على الشخص.
  terminology: «ملاك»، «البركة»، و«يحرّك الماء» مناسبة. والحاشية النقدية متوازنة، وتعرض وضع الآية في الشواهد من دون فرض حكم تفسيري على المتن.
