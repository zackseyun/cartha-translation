  source_fidelity: 'النص العربي ينقل عناصر اليونانية كلها بأمانة: الاستئناف المقابِل في «لكنه»، وفعل الجواب مع المخاطَبين، وعبارة «أبي»، واستمرار العمل إلى الحاضر في «إلى الآن»، والتوازي الإضافي المؤكَّد في «وأنا أيضًا أعمل». والمضارع العربي مناسب للدلالة المستمرة هنا دون إلزام بتمييز صوري بين المضارع البسيط والمستمر.'
  naturalness: الصياغة فصيحة حديثة، موجزة، وسلسة في القراءة العامة. «أبي يعمل إلى الآن، وأنا أيضًا أعمل» تركيب عربي طبيعي ويحافظ على إيقاع التوازي في الأصل.
  terminology: «أبي» تحافظ على الإحالة الشخصية المباشرة دون تفسير عقائدي زائد، و«يعمل/أعمل» يحافظان على التكرار المقصود للفعل ἐργάζομαι. لا تحتاج العربية إلى حاشية خاصة بخيارات زمن المضارع الإنجليزية.
