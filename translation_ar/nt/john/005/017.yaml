base_translation:
  language: en
  yaml_path: translation/nt/john/005/017.yaml
  text: But he answered them[a], “My Father is working until now, and I also am working.”
translation:
  language: ar
  text: 'لكنه أجابهم: «أبي يعمل إلى الآن، وأنا أيضًا أعمل».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: لكن
  rationale: تفيد انتقالًا ذا مسحة من المقابلة مع الاتهام السابق، و«لكن» تؤدي ذلك بوضوح وطبيعية.
- source_word: ἀπεκρίνατο αὐτοῖς
  choice: أجابهم
  rationale: تعبير عربي فصيح وموجز ينقل الفعل مع ضمير المفعول المقابل للمجرور اليوناني.
- source_word: Ὁ πατήρ μου
  choice: أبي
  rationale: ينقل التعبير الشخصي المباشر والطبيعي من غير إضافة تفسير إلى النص.
- source_word: ἕως ἄρτι
  choice: إلى الآن
  rationale: تدل العبارة على امتداد العمل حتى الوقت الحاضر، وهذه صياغة عربية مباشرة مألوفة.
- source_word: ἐργάζεται
  choice: يعمل
  rationale: المضارع العربي يدل في هذا السياق على العمل المستمر، فلا حاجة إلى تركيب أثقل مثل «لا يزال يعمل» قد يزيد دلالة غير مصرّح بها.
- source_word: κἀγὼ
  choice: وأنا أيضًا
  rationale: يحفظ معنى الإضافة والتوازي الصريح بين عمل الآب وعمل يسوع.
- source_word: ἐργάζομαι
  choice: أعمل
  rationale: يحافظ على التوازي اللفظي مع «يعمل»، والمضارع العربي ملائم للدلالة على النشاط الجاري.
theological_decisions:
- issue: علاقة عمل يسوع بعمل الآب في سياق السبت
  choice: «أبي يعمل إلى الآن، وأنا أيضًا أعمل»
  alternative: «أبي لا يزال يعمل، وأنا كذلك أعمل»
  rationale: تحفظ الصياغة التوازي المقصود بين عمل الآب وعمل يسوع من غير تلطيفه أو إضافة شرح عن السبت أو الامتياز الإلهي أو المساواة يتجاوز منطوق الآية.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. اختير المضارع البسيط لأنه في العربية يؤدي بطبيعته معنى الفعل الجاري بحسب السياق، لذلك لا تستلزم الآية حاشية كتلك اللازمة لتمييز المضارع البسيط من المستمر في الإنجليزية.
