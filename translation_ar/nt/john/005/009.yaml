  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ εὐθέως ἐγένετο ὑγιὴς ὁ ἄνθρωπος καὶ ἦρε τὸν κράβαττον αὐτοῦ καὶ περιεπάτει. Ἦν δὲ σάββατον ἐν ἐκείνῃ τῇ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/009.yaml
  text: And immediately the man became well[a], and he picked up his mat and began to walk[c][b]. Now that day was a Sabbath.
translation:
  language: ar
  text: وفي الحال صار الرجل معافًى، وحمل حصيره[a]، وأخذ يمشي[b]. وكان ذلك اليوم يوم سبت[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فراشه». تشير الكلمة اليونانية إلى حصير أو فراش بسيط للنوم يمكن حمله، وليس بالضرورة إلى سرير كامل.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «وكان يمشي». قد تبرز صيغة الفعل اليوناني استمرار المشي، وقد تُفهم هنا أيضًا على أنها بداية مشيه بعد أن شُفي.'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «يوم السبت». والنص اليوناني حرفيًا: «وكان سبتٌ في ذلك اليوم».'
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθέως
  choice: في الحال
  rationale: تؤدي معنى فورية الشفاء بلغة عربية واضحة ورصينة.
- source_word: ἐγένετο ὑγιὴς
  choice: صار معافًى
  rationale: تحافظ على معنى الانتقال إلى حال العافية من غير أن تصرّح بصيغة مبنية للمجهول لا ترد في اليونانية.
- source_word: ὁ ἄνθρωπος
  choice: الرجل
  rationale: السياق يحدد شخصًا ذكرًا بعينه، وهذه الصياغة طبيعية في العربية.
- source_word: ἦρε
  choice: حمل
  rationale: يفيد هنا رفع الحصير وأخذه، وهو أنسب عربيًا من ترجمة حرفية قد تقتصر على فعل الرفع.
- source_word: κράβαττον
  choice: حصيره
  rationale: يدل اللفظ على حصير أو فراش بسيط قابل للحمل، لا على سرير كبير بالضرورة.
- source_word: περιεπάτει
  choice: أخذ يمشي
  rationale: تنقل الصيغة معنى الفعل الجاري، وتلائم السياق الذي بدأ فيه الرجل يمشي بعد شفائه، مع إبقاء «كان يمشي» بديلًا ممكنًا في الحاشية.
- source_word: Ἦν δὲ
  choice: وكان
  rationale: تنقل δέ هنا بوصفها انتقالًا سرديًا أو ملاحظة تفسيرية، لا مقابلة قوية.
- source_word: σάββατον
  choice: يوم سبت
  rationale: تصوغ اسم اليوم صياغة عربية طبيعية مع مراعاة أن الاسم في اليونانية غير معرّف بأداة.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: ذلك اليوم
  rationale: صياغة عربية موجزة وطبيعية تؤدي الدلالة الزمنية كاملة.
theological_decisions:
- issue: تعريف σάββατον في الملاحظة السردية
  choice: يوم سبت
  alternative: يوم السبت
  rationale: ورد الاسم في اليونانية بلا أداة تعريف، وتأتي العبارة ملاحظة زمنية تمهّد لما يلي. تحافظ الصياغة المختارة على ذلك، بينما تثبت الحاشية إمكان التعبير العربي المألوف «يوم السبت» من غير تحميل النص دلالة مذهبية.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدمت «صار معافًى» للمحافظة على بنية التحول في الأصل، و«أخذ يمشي» لصياغة الجانب الاستمراري أو الابتدائي بصورة طبيعية. وُضعت علامات الحواشي عند الألفاظ التي تخصها مباشرة.
