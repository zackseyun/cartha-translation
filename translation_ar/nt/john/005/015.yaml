  text: The man went away and reported to the Jews that Jesus was the one who had made him well[a].
translation:
  language: ar
  text: فذهب الرجل وأخبر اليهود أن يسوع هو الذي جعله معافًى[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «قادة اليهود»، أو «سكان اليهودية»، بحسب فهم استعمال يوحنا لعبارة «اليهود» في هذا السياق.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: فذهب
  rationale: يدل الفعل على مغادرة الرجل المكان، و«فذهب» تعبير عربي طبيعي يربط الحدث بما قبله ويحافظ على حركة السرد.
- source_word: ὁ ἄνθρωπος
  choice: الرجل
  rationale: يشير الاسم المذكر المفرد في السياق إلى الرجل الذي نال الشفاء.
- source_word: ἀνήγγειλεν
  choice: أخبر
  rationale: يفيد نقل المعلومة وإبلاغها، من غير أن يبالغ في معنى الإعلان العلني.
- source_word: τοῖς Ἰουδαίοις
  choice: اليهود
  rationale: يحافظ على اللفظ اليوناني من غير حصر مرجعه تفسيريًا في القادة أو سكان اليهودية، مع بيان الاحتمالات السياقية في الحاشية.
- source_word: ὅτι
  choice: أن
  rationale: أداة عربية طبيعية لإدخال مضمون الإخبار.
- source_word: Ἰησοῦς ἐστιν
  choice: يسوع هو
  rationale: يحافظ على الحاضر اليوناني وعلى التركيب التعريفي المؤكد، وهو طبيعي في العربية بعد فعل الإخبار الماضي من غير ضرورة لتحويله إلى الماضي.
- source_word: ὁ ποιήσας
  choice: الذي جعل
  rationale: ينقل معنى اسم الفاعل من ποιέω ويحدد يسوع بوصفه فاعل العمل، من غير استبدال الفعل صراحةً بـ«شفى».
- source_word: αὐτὸν ὑγιῆ
  choice: جعله معافًى
  rationale: «معافًى» تنقل معنى السلامة والصحة في ὑγιής، والتركيب العربي واضح وطبيعي في سياق الشفاء.
theological_decisions:
- issue: مرجع عبارة «اليهود» في إنجيل يوحنا
  choice: إبقاء «اليهود» في المتن مع ذكر احتمالَي «قادة اليهود» و«أهل اليهودية» في الحاشية.
  alternative: ترجمة العبارة في المتن بـ«قادة اليهود» أو «أهل اليهودية».
  rationale: اللفظ اليوناني نفسه لا يحسم هنا هذا التضييق، مع أن السياق اليوحناوي قد يسمح به؛ لذلك يُحفظ الغموض الحقيقي في المتن وتُذكر البدائل السياقية في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «فذهب» لسلاسة السرد، و«معافًى» للدلالة الطبيعية على استعادة الصحة، مع إبقاء العبارة الحساسة سياقيًا «اليهود» قريبة من الأصل وشرح احتمالاتها في الحاشية.
