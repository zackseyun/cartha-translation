base_translation:
  language: en
  yaml_path: translation/nt/john/005/029.yaml
  text: and will come out—those who have done good to the resurrection of life[a], but those who have done evil to the resurrection of judgment.
translation:
  language: ar
  text: وسيخرج الذين فعلوا الصالحات إلى قيامة الحياة، وأما الذين عملوا السيئات فإلى قيامة الدينونة.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «قيامة الإدانة» بدلًا من «قيامة الدينونة». واللفظ اليوناني يعني «الحكم» أو «الدينونة» بمعنى أوسع، أما «الإدانة» فتعبير تفسيري أضيق ورد في بعض الترجمات.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκπορεύσονται
  choice: فيخرج
  rationale: في سياق خروج الموتى من القبور، «يخرج» تعبير عربي طبيعي ومباشر، والفاء تصل الكلام بما قبله.
- source_word: τὰ ἀγαθὰ ποιήσαντες
  choice: الذين فعلوا الصالحات
  rationale: ينقل التركيب الاسمي الدال على الأمور الصالحة، مع المحافظة على إيجاز العبارة وطابعها الأخلاقي العام.
- source_word: ἀνάστασιν ζωῆς
  choice: قيامة الحياة
  rationale: يحافظ على تركيب الإضافة وعلى التوازي مع «قيامة الدينونة»، من غير تحويل الإضافة صراحة إلى غاية.
- source_word: τὰ φαῦλα πράξαντες
  choice: الذين عملوا السيئات
  rationale: «السيئات» تنقل المعنى الأخلاقي لـ φαῦλα، و«عملوا» تقابل πράξαντες طبيعيًا وتُبقي فرقًا أسلوبيًا طفيفًا عن «فعلوا».
- source_word: ἀνάστασιν κρίσεως
  choice: قيامة الدينونة
  rationale: «الدينونة» هنا بمعنى الحكم والقضاء، وهي أوسع من «الإدانة» ولا تحصر اللفظ اليوناني في الحكم بالإدانة وحده.
- source_word: δὲ
  choice: وأما
  rationale: يُظهر المقابلة الواضحة بين الفريقين ومصيريهما بأسلوب عربي فصيح طبيعي.
theological_decisions:
- issue: هل تُترجم κρίσεως بما يفيد الحكم عمومًا أم بالإدانة تحديدًا؟
  choice: الدينونة
  alternative: الإدانة
  rationale: اللفظ اليوناني κρίσις يدل أساسًا على الحكم أو القضاء، ولا يفرض بذاته التضييق إلى الإدانة؛ لذلك تُحفظ سعة الدلالة والتوتر اللاهوتي في النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعمل التوازي «قيامة الحياة/قيامة الدينونة»، مع تجنب الألفاظ المذهبية والتفسير الزائد.
