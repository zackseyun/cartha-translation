base_translation:
  language: en
  yaml_path: translation/nt/john/005/045.yaml
  text: 'Do not think that I will accuse you before the Father[a]; there is one who accuses you: Moses[b], in whom you have put your hope.'
translation:
  language: ar
  text: 'لا تظنّوا أني أنا سأتهمكم أمام الآب[a]؛ فهناك من يتّهمكم: موسى[b]، الذي وضعتم رجاءكم فيه.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لا تظنّوا أني أنا سأرفع عليكم دعوى لدى الآب».'
    reason: lexical_alternative
  - marker: b
    text: أي إن موسى، الذي وضعتم رجاءكم فيه، هو الذي يتّهمكم.
    reason: cross_reference
lexical_decisions:
- source_word: μὴ δοκεῖτε
  choice: لا تظنّوا
  rationale: صيغة نهي مباشرة وطبيعية في العربية، وتحفظ معنى «لا تظنوا/لا تفترضوا» دون زيادة.
- source_word: ἐγὼ κατηγορήσω ὑμῶν
  choice: أني أنا سأوجّه إليكم الاتهام
  rationale: أُبقي الضمير المنفصل «أنا» لإظهار توكيد ἐγώ، وتعبير «يوجّه الاتهام» ينقل الدلالة القضائية للفعل κατηγορέω من غير أن يرفعه إلى معنى الإدانة أو الحكم.
- source_word: πρὸς τὸν πατέρα
  choice: أمام الآب
  rationale: ينقل السياق الشبيه بالمحكمة نقلاً عربيًا طبيعيًا، مع الحفاظ على لقب «الآب» في إنجيل يوحنا.
- source_word: ἔστιν ὁ κατηγορῶν ὑμῶν
  choice: فهناك من يتّهمكم
  rationale: صياغة عربية واضحة تحفظ تقديم مُتَّهِم آخر في مقابل يسوع، كما تحافظ صيغة المضارع على قوة اسم الفاعل الحاضر في اليونانية.
- source_word: Μωϋσῆς
  choice: موسى
  rationale: الصيغة العربية المعيارية للاسم.
- source_word: εἰς ὃν
  choice: فيه
  rationale: يحفظ تعلّق الرجاء بموسى نفسه كما في النص، بدل تفسيره بأنه شريعته أو كتاباته.
- source_word: ἠλπίκατε
  choice: وضعتم رجاءكم
  rationale: ينقل صيغة التام بوصفها موقفًا اتخذوه وبقي أثره، وهو تعبير عربي واضح وطبيعي.
theological_decisions:
- issue: القوة القضائية لقول يسوع عن الاتهام
  choice: سأوجّه إليكم الاتهام / يتّهمكم
  alternative: سأدينكم / يدينكم
  rationale: الفعل κατηγορέω يعني الاتهام أو توجيه التهمة، لا إصدار حكم الإدانة؛ لذلك لا تُضاف إلى النص دعوى قضائية أو لاهوتية أقوى من لفظه.
- issue: متعلَّق الرجاء الموضوع في موسى
  choice: الذي وضعتم رجاءكم فيه
  alternative: في شريعة موسى / في كتابات موسى
  rationale: السياق الأوسع يتصل بكتابات موسى، لكن اليونانية تسمّي موسى نفسه؛ فحُفظ هذا التوتر دون إدخال التفسير في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدم «أمام الآب» للحفاظ على الصورة القضائية، و«هناك من يتّهمكم، وهو موسى» لتقديم موسى بوضوح مع بقاء المقابلة البلاغية. تظهر علامتا الحاشيتين [a] و[b] في المتن.
