id: JHN.5.21
reference: John 5:21
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ὁ πατὴρ ἐγείρει τοὺς νεκροὺς καὶ ζῳοποιεῖ, οὕτως καὶ ὁ υἱὸς οὓς θέλει ζῳοποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/021.yaml
  text: For just as the Father raises the dead and gives life[b][a], so also the Son gives life to whom he wishes.
translation:
  language: ar
  text: لأنه كما أن الآب يقيم الموتى ويحييهم، كذلك الابن أيضًا يحيي من يشاء.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: لأنه كما أن
  rationale: تحفظ «لأن» وظيفة γάρ التفسيرية، وتفتتح «كما أن» المقارنة التي يكملها «كذلك» في الشطر الثاني.
- source_word: ὁ πατὴρ
  choice: الآب
  rationale: اللفظ العربي المألوف واللائق للقب الإلهي في سياق العلاقة بين الآب والابن.
- source_word: ἐγείρει τοὺς νεκρούς
  choice: يقيم الموتى
  rationale: صياغة عربية طبيعية تحافظ على دلالة الإقامة في سياق الموت والقيامة.
- source_word: ζῳοποιεῖ
  choice: يحييهم / يحيي
  rationale: الفعل «يحيي» ينقل بإيجاز معنى منح الحياة أو جعل الحي؛ أضيف ضمير المفعول في الموضع الأول وفق العربية الطبيعية ومرجعه «الموتى»، وبقي الموضع الثاني مع مفعوله الموصول.
- source_word: οὕτως καὶ
  choice: كذلك ... أيضًا
  rationale: تحفظ المطابقة المؤكدة بين عمل الآب وعمل الابن، بصياغة عربية واضحة.
- source_word: ὁ υἱὸς
  choice: الابن
  rationale: يحافظ على اللقب المسيحاني في الموازاة الصريحة مع «الآب».
- source_word: οὓς θέλει
  choice: من يشاء
  rationale: تعبير عربي فصيح معاصر ينقل الإرادة والاختيار من غير تهوين أو تقادم أسلوبي.
theological_decisions:
- issue: الموازاة بين الآب والابن في الإحياء
  choice: 'الحفاظ على الموازاة الصريحة: «كما أن الآب... كذلك الابن أيضًا»'
  alternative: صياغة أرخى قد تخفف الموازاة
  rationale: النص اليوناني ينسب الإحياء إلى الابن على نحو موازٍ لعمل الآب؛ لذلك تُحفظ قوة العبارة من غير إضافة تفسير عقائدي.
- issue: دلالة θέλει على إرادة الابن
  choice: من يشاء
  alternative: من يريد
  rationale: «يشاء» تنقل القوة الإرادية بوضوح ووقار، مع إبقاء العبارة مطلقة كما في الأصل وعدم تحديد كيفية هذه المشيئة لاهوتيًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حافظت الصياغة على البنية المقارِنة وعلى تكرار فعل الإحياء، مع تجنب الحواشي غير الضرورية؛ فـ«يحيي» يؤدي طبيعيًا معنى «يعطي الحياة/يجعل حيًا».
