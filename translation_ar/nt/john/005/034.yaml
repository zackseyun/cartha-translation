  text: ἐγὼ δὲ οὐ παρὰ ἀνθρώπου τὴν μαρτυρίαν λαμβάνω, ἀλλὰ ταῦτα λέγω ἵνα ὑμεῖς σωθῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/034.yaml
  text: But I do not receive testimony from man; rather, I say these things so that you may be saved.
translation:
  language: ar
  text: أَمَّا أَنَا فَلَا أَتَلَقَّى شَهَادَةً مِنْ إِنْسَانٍ، لَكِنِّي أَقُولُ هَذَا لِكَيْ تَخْلُصُوا.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρὰ ἀνθρώπου
  choice: مِنْ إِنْسَانٍ
  rationale: تفيد παρά مع المضاف إليه مصدر الشهادة. ويحافظ المفرد «إنسان» على صيغة اليونانية، مع دلالة عامة على المصدر البشري لا على شخص محدد بالضرورة.
- source_word: μαρτυρίαν
  choice: شَهَادَةً
  rationale: «شهادة» هي المقابل العربي الطبيعي الذي يحفظ البعد الإثباتي والقضائي في السياق.
- source_word: λαμβάνω
  choice: أَتَلَقَّى
  rationale: ينقل معنى الأخذ أو التلقي هنا بصياغة عربية طبيعية مع «شهادة»، من غير أن يحصر المعنى في القبول الذهني وحده.
- source_word: ταῦτα
  choice: هَذَا
  rationale: مع أن الأصل جمع محايد حرفيًا، فالعربية الفصيحة تستعمل «هذا» طبيعيًا للإشارة إلى مجموع الكلام السابق أو الآتي بوصفه مضمونًا واحدًا؛ أما «هذه الأشياء» فثقيلة وقد توحي بأشياء مادية.
- source_word: λέγω
  choice: أَقُولُ
  rationale: مضارع بسيط مباشر يطابق زمن الفعل اليوناني ويناسب المفعول القولي.
- source_word: ἵνα ὑμεῖς σωθῆτε
  choice: لِكَيْ تَخْلُصُوا
  rationale: «لكي» تصرّح بالغرض، و«تخلصوا» تنقل المعنى الخلاصي من غير إضافة نموذج لاهوتي يحدد كيفية الخلاص. وفي العربية يؤدي المبني للمعلوم هنا المعنى الاصطلاحي الطبيعي للفعل اللازم «خلص».
- source_word: δὲ ... ἀλλὰ
  choice: أَمَّا أَنَا ... لَكِنِّي
  rationale: يحفظ هذا البناء الانتقال التقابلي بين نفي اعتماد يسوع على شهادة بشرية وبيان غرضه من قوله، بصياغة عربية واضحة وطبيعية.
theological_decisions:
- issue: مدلول «لكي تخلصوا» في السياق
  choice: الإبقاء على اللفظ الخلاصي الواسع «لكي تخلصوا»
  alternative: لكي تُنقَذوا / لكي تنالوا الخلاص
  rationale: يحمل σωθῆτε معنى الخلاص دون أن يحدد النص هنا نموذجًا عقائديًا خاصًا أو يقصره على نجاة جسدية. والصياغة المختارة تحفظ هذا الاتساع والتوتر اللاهوتي.
- issue: طبيعة عدم تلقي الشهادة البشرية
  choice: «لا أتلقى شهادة من إنسان»
  alternative: لا أقبل شهادة إنسان
  rationale: «أتلقى» أقرب إلى λαμβάνω ولا تجعل العبارة نفيًا لصحة شهادة يوحنا أو رفضًا لها؛ بل تترك مفتوحًا في السياق معنى أن سلطة يسوع وإثباته لا يعتمدان عليها.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل التشكيل الكامل لتثبيت القراءة، مع تجنب الترجمة الحرفية الثقيلة لعبارة ταῦτα. لا توجد حواشٍ، ولذلك لا توجد علامات حواشٍ في المتن.
