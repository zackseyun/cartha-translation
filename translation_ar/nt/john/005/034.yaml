  verdict: approve
  source_fidelity: 'ينقل النص بدقة البنية الأساسية لليونانية: نفي تلقي الشهادة من مصدر بشري، ثم بيان أن هذا القول يُقال لغرض خلاص المخاطَبين. «من إنسان» تحفظ المفرد العام في ἀνθρώπου، و«شهادة» مناسبة لـ μαρτυρίαν، و«لكي تخلصوا» تنقل غرض ἵνα ومعنى σωθῆτε الخلاصي دون تضييق عقائدي. استعمال «هذا» إحالةٌ عربية طبيعية إلى مضمون القول، وإن كان ταῦτα جمعًا في اليونانية.'
  naturalness: 'الصياغة فصيحة معاصرة وواضحة: «أما أنا فلا أتلقى شهادةً من إنسان، لكنني أقول هذا لكي تخلصوا». وهي محافظة على الوقار المناسب للسياق من غير تكلّف حرفي. التشكيل سليم ولا توجد مشكلات تركيبية أو أسلوبية تستلزم تعديلًا.'
  terminology: «شهادة» و«تخلصوا» مصطلحان عربيان راسخان ومناسبان للسياق الإنجيلي. «أتلقى» مقابل دقيق وطبيعي لـ λαμβάνω هنا، ولا يحوّل العبارة إلى رفضٍ لصحة شهادة يوحنا. لا توجد أسماء أو مصطلحات لاهوتية أخرى تحتاج إلى توحيد أو حاشية.
