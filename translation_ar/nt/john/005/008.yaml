base_translation:
  language: en
  yaml_path: translation/nt/john/005/008.yaml
  text: Jesus says to him[a], “Get up, pick up your mat, and walk.”
translation:
  language: ar
  text: 'يقول له يسوع: «قُمْ، واحمل فراشك[a]، وامشِ».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «حصيرك». تشير الكلمة اليونانية إلى فراش نوم بسيط أو حصير، لا إلى سرير كامل بالضرورة.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: يقول
  rationale: حُفظ المضارع السردي اليوناني بصيغة «يقول»، وهو أسلوب مفهوم وطبيعي في العربية ويعكس سمة يوحنا السردية.
- source_word: αὐτῷ
  choice: له
  rationale: ترجمة مباشرة للمفعول غير المباشر في صيغة المجرور باليونانية.
- source_word: Ἔγειρε
  choice: قُمْ
  rationale: أمر مباشر بالنهوض، وصيغة «قُمْ» موجزة وطبيعية وتحفظ قوة الأمر دون إضافة معنى الشفاء غير المصرح به.
- source_word: ἆρον
  choice: احمل
  rationale: الفعل αἴρω يدل هنا على رفع الفراش وأخذه؛ و«احمل» تلائم الشيء الخفيف القابل للنقل وتوضح الفعل المقصود في العربية.
- source_word: κράβαττόν
  choice: فراشك
  rationale: يدل اللفظ على فراش بسيط أو حصير للنوم، لا بالضرورة على سرير ذي هيكل. «فراش» عربية طبيعية واسعة الدلالة، وتنسجم مع إمكان حمله.
- source_word: περιπάτει
  choice: امشِ
  rationale: المقصود المشي الجسدي، والأمر «امشِ» هو المقابل العربي المباشر والطبيعي دون تحميل صيغة الفعل دلالة استمرارية زائدة.
theological_decisions:
- issue: طبيعة أمر يسوع في سياق الشفاء
  choice: 'صياغة الأوامر الثلاثة بوصفها أوامر جسدية مباشرة: النهوض، وحمل الفراش، والمشي.'
  alternative: إضافة تفسير مثل «قُمْ وقد شُفيت» أو «قُمْ واشفَ».
  rationale: النص اليوناني لا يذكر الشفاء صراحة في هذه الآية، وإن كان السياق يدل عليه؛ لذلك لا تُضاف عبارة تفسيرية تتجاوز ألفاظ المصدر.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. حُفظ المضارع السردي في «يقول»، واستُعملت أوامر موجزة وطبيعية. وُضعت علامة الحاشية عقب «فراشك» لأنها تتعلق بالدلالة المعجمية لهذه الكلمة.
