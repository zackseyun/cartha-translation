  text: ἄλλος ἐστὶν ὁ μαρτυρῶν περὶ ἐμοῦ, καὶ οἶδα ὅτι ἀληθής ἐστιν ἡ μαρτυρία ἣν μαρτυρεῖ περὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/032.yaml
  text: There is another who testifies about me[a], and I know that the testimony which he testifies about me is true.
translation:
  language: ar
  text: ثمة آخر يشهد عني[a]، وأنا أعلم أن الشهادة التي يشهد بها عني صادقة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يدلي بشهادة عني».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλος
  choice: آخر
  rationale: ينقل معنى شخص آخر مع إبقاء هويته غير مصرَّح بها، كما في النص اليوناني.
- source_word: ὁ μαρτυρῶν
  choice: يشهد
  rationale: اسم الفاعل المحلّى بأداة التعريف مستعمل استعمال الاسم؛ وصيغة «يشهد» طبيعية وتحفظ الدلالة الفعلية المستمرة بحسب السياق.
- source_word: περὶ ἐμοῦ
  choice: لي
  rationale: تفيد περί مع المضاف إليه موضوع الشهادة؛ و«يشهد لي» تعبير عربي فصيح طبيعي بمعنى يشهد في شأني أو عني.
- source_word: οἶδα
  choice: أعلم
  rationale: ترجمة مباشرة وفصيحة لفعل المعرفة.
- source_word: ἀληθής
  choice: حقّ
  rationale: ينقل كون الشهادة صادقة وثابتة من غير تضييق المعنى إلى مجرد صدق صاحبها.
- source_word: ἡ μαρτυρία
  choice: الشهادة
  rationale: يحفظ الطابع الشهادي أو القضائي في السياق، كما يحفظ الصلة الاشتقاقية بالفعل «يشهد».
- source_word: ἣν μαρτυρεῖ
  choice: التي يشهدها
  rationale: يحفظ بنية جملة الصلة والتكرار اليوحناوي بين «الشهادة» و«يشهد»، مع عربية مفهومة وإن كانت ذات نبرة رسمية.
theological_decisions:
- issue: هوية «الآخر» (ἄλλος)
  choice: إبقاء الإشارة عامة بصيغة «آخر» من دون تعيين هويته.
  alternative: تعيينه بيوحنا المعمدان، أو بالآب، أو بشاهد آخر بالمعنى القضائي.
  rationale: لا يصرّح العدد نفسه بهوية المشار إليه؛ لذلك يحافظ النص العربي على مقدار التحديد الموجود في الأصل ولا يحسم التوتر التفسيري.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «يشهد لي» لأنه طبيعي في سياق الشهادة، مع إثبات «يشهد عني» في الحاشية بوصفه بديلاً معجميًا أقرب إلى البنية الحرفية. حُفظ التكرار بين «الشهادة» و«يشهدها» إبقاءً لملمح الأسلوب اليوحناوي.
