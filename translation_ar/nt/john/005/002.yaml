  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἔστιν δὲ ἐν τοῖς Ἱεροσολύμοις ἐπὶ τῇ προβατικῇ κολυμβήθρα ἡ ἐπιλεγομένη Ἑβραϊστὶ ⸀Βηθεσδά, πέντε στοὰς ἔχουσα·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/002.yaml
  text: There is in Jerusalem[a], by the Sheep Gate, a pool called Bethesda in Hebrew[c][b], having five porticoes.
translation:
  language: ar
  text: وفي أورشليم، عند باب الضأن[a]، بركة تُسمّى بالعبرية[b] «بيت حسدا»[c]، ولها خمسة أروقة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: اليونانية تقول حرفيًا «عند الضأن» بصيغة موجزة، ويُرجَّح أن المقصود باب الضأن أو ناحيته (قارن نحميا 3:1؛ 12:39).
    reason: cross_reference
  - marker: b
    text: أو «بالآرامية»؛ فالعبارة التي يستعملها يوحنا بمعنى «بالعبرية» قد تشير إلى اللغة السامية المحلية في اليهودية، لا إلى العبرية القديمة حصرًا.
    reason: lexical_alternative
  - marker: c
    text: تقرأ بعض المخطوطات «بيت زاثا» أو «بيت صيدا» بدلًا من «بيت حسدا».
    reason: textual_variant
lexical_decisions:
- source_word: ἔστιν δὲ
  choice: وفي ... بركة
  rationale: صيغت الجملة العربية بأسلوب اسمي طبيعي يفيد وجود البركة، مع نقل δέ بواو وصل خفيفة من غير إضافة دلالة زمنية غير موجودة في الأصل.
- source_word: ἐν τοῖς Ἱεροσολύμοις
  choice: في أورشليم
  rationale: استُعمل الاسم العربي المألوف للمدينة، وصيغة الجمع اليونانية لا تستلزم جمعًا في العربية.
- source_word: ἐπὶ τῇ προβατικῇ
  choice: عند باب الضأن
  rationale: العبارة اليونانية موجزة وحُذف منها الموصوف؛ ويرجح أنها تشير إلى باب الضأن أو ناحيته. أُثبت هذا الفهم في المتن مع توضيح الحذف في الحاشية.
- source_word: κολυμβήθρα
  choice: بركة
  rationale: لفظ عربي واضح ودقيق لخزان أو حوض ماء من هذا النوع.
- source_word: ἡ ἐπιλεγομένη
  choice: تُسمّى
  rationale: ينقل وظيفة اسم المفعول اليوناني في التعريف باسم البركة بعبارة عربية طبيعية.
- source_word: Ἑβραϊστὶ
  choice: بالعبرية
  rationale: يحافظ على اللفظ الصريح في النص اليوناني، مع بيان احتمال الإشارة إلى الآرامية المحلية في الحاشية.
- source_word: Βηθεσδά
  choice: بيت حسدا
  rationale: نقل صوتي عربي للاسم الوارد في نص SBLGNT، مع إثبات القراءات النصية الأخرى في الحاشية.
- source_word: πέντε στοὰς ἔχουσα
  choice: ولها خمسة أروقة
  rationale: «أروقة» تنقل معنى المنشآت المسقوفة ذات الأعمدة، والصياغة العربية تحافظ على تعلقها بالبركة بوضوح.
theological_decisions: []
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُعمل تركيب اسمي طبيعي بدل ترجمة فعل الوجود ترجمة حرفية ثقيلة، وحُفظ إيجاز الآية وغموض العبارة الخاصة بموضع الضأن بواسطة حاشية.
