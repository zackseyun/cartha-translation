  yaml_path: translation/nt/john/005/042.yaml
  text: 'But I know you: you do not have the love of God in yourselves.'
translation:
  language: ar
  text: 'لكنني أعرفكم: ليست فيكم محبة الله.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بتحديد أوضح: «ليست فيكم محبة لله». ويمكن أيضًا أن تُفهَم العبارة بمعنى أوسع: «المحبة التي من الله».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: لكنني
  rationale: تفيد استدراكًا قويًّا متصلًا بالسياق السابق، وصيغة «لكنني» طبيعية وموجزة.
- source_word: ἔγνωκα
  choice: عرفتكم
  rationale: صيغة التام تدل على معرفة ثابتة متحصلة؛ والماضي العربي هنا يحافظ على دلالة المعرفة المتحققة، مع بقاء أثرها حاضرًا.
- source_word: ὑμᾶς
  choice: كم
  rationale: ضمير مفعول به لجمع المخاطبين، وهو ظاهر في اللاحقة العربية.
- source_word: ὅτι
  choice: ':'
  rationale: تدخل على مضمون ما عرفه يسوع عنهم؛ وتؤدي النقطتان هذا الربط بوضوح وطبيعية في العربية.
- source_word: τὴν ἀγάπην τοῦ θεοῦ
  choice: محبة الله
  rationale: 'يحافظ التركيب الإضافي العربي على غموض المضاف إليه اليوناني: فقد تكون المحبة الموجهة إلى الله أو المحبة الصادرة منه أو المنسوبة إليه.'
- source_word: οὐκ ἔχετε
  choice: ليست ... فيكم
  rationale: يعبر التركيب الاسمي المنفي عن عدم وجود المحبة في داخلهم تعبيرًا عربيًا طبيعيًا، مع الحفاظ على الحالة المستمرة.
- source_word: ἐν ἑαυτοῖς
  choice: فيكم
  rationale: ينقل معنى الوجود الداخلي لدى المخاطبين بصياغة عربية واضحة؛ ولا يلزم تكرار «أنفسكم» لأن الضمير يؤدي المعنى طبيعيًا.
theological_decisions:
- issue: دلالة المضاف إليه في «محبة الله»
  choice: الإبقاء على «محبة الله» دون تحديد اتجاه المحبة
  alternative: محبتكم لله؛ أو المحبة الآتية من الله؛ أو محبة الله لكم
  rationale: التركيب اليوناني τοῦ θεοῦ يحتمل المضاف إليه الموضوعي والمصدري/الذاتي. والسياق يرجح افتقارهم إلى محبة الله، لكن النص نفسه لا يحسم الدلالة نحويًا، لذلك تُحفظ سعة المعنى في المتن ويُوضح الاحتمال في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم تركيب موجز وطبيعي، مع إبقاء «محبة الله» على غموضها المقصود في الأصل، ووُضعت علامة الحاشية في المتن.
