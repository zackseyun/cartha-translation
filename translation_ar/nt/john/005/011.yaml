lexical_decisions:
- source_word: ἀπεκρίθη
  choice: أجاب
  rationale: فعل سردي مألوف ينقل الرد مباشرة، وهو طبيعي في العربية الفصحى الحديثة.
- source_word: Ὁ ποιήσας με ὑγιῆ
  choice: الذي شفاني
  rationale: ينقل في سياق المعجزة معنى التسبب في استعادة العافية بعبارة عربية موجزة وطبيعية، من غير إيحاءات روحية زائدة.
- source_word: ἐκεῖνός
  choice: هو
  rationale: حُفظ توكيد اسم الإشارة اليوناني بضمير فصل بارز بعد عبارة «الذي شفاني».
- source_word: Ἆρον
  choice: ارفع
  rationale: أمر مباشر بحمل الشيء من موضعه، وهو مقابل واضح وطبيعي للفعل اليوناني في هذا السياق.
- source_word: κράβαττόν
  choice: فراشك
  rationale: «فراش» يدل في العربية على ما يُبسط للنوم ويمكن حمله، فلا يوحي بالضرورة بسرير كبير من الأثاث.
- source_word: περιπάτει
  choice: امشِ
  rationale: صيغة أمر عربية طبيعية تنقل الأمر اليوناني بالمشي من غير إثقال الدلالة بإبراز الاستمرار صراحة.
- source_word: δὲ
  choice: فـ
  rationale: الفاء في «فأجابهم» تربط الرد بما قبله وتؤدي انتقالًا سرديًا ذا مسحة مقابلة بصورة طبيعية في العربية.
theological_decisions:
- issue: مدى دلالة وصف الشفاء
  choice: شفاني
  alternative: جعلني معافى / جعلني سليمًا
  rationale: السياق يتحدث عن شفاء جسدي؛ و«شفاني» يثبت ذلك بوضوح من غير توسيع العبارة إلى معنى الخلاص أو الكمال الروحي.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم «فراش» بدل «سرير» لتجنب تصور قطعة أثاث كبيرة، وحُفظ توكيد ἐκεῖνος بقول «هو قال لي».
