base_translation:
  language: en
  yaml_path: translation/nt/john/005/011.yaml
  text: But he answered them[a], “The one who made me well—that one said to me[b], ‘Pick up your mat and walk.’”
translation:
  language: ar
  text: 'فأجابهم: «الذي شفاني هو الذي قال لي: ارفع فراشك[a] وامشِ».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي حصيرك أو مضجعك البسيط الذي كنت تنام عليه.
