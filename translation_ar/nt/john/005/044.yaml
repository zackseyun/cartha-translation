    issue: «الله الوحيد»
    rationale: التركيب غير مألوف في الفصحى الحديثة، وقد يحمل إيحاءً غير مقصود؛ «الله وحده» هو التعبير العربي الطبيعي عن المصدر الإلهي الحصري في هذا السياق.
