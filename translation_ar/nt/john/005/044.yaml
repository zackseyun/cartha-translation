  text: πῶς δύνασθε ὑμεῖς πιστεῦσαι, δόξαν παρ’ ἀλλήλων λαμβάνοντες, καὶ τὴν δόξαν τὴν παρὰ τοῦ μόνου θεοῦ οὐ ζητεῖτε;
base_translation:
  language: en
  yaml_path: translation/nt/john/005/044.yaml
  text: How are you able to believe[c][b][a], receiving glory from one another and not seeking the glory that is from the only God?
translation:
  language: ar
  text: كَيْفَ تَقْدِرُونَ أَنْ تُؤْمِنُوا[b]، وَأَنْتُمْ تَتَلَقَّوْنَ مَجْدًا مِنْ بَعْضِكُمْ بَعْضًا، وَلَا تَطْلُبُونَ الْمَجْدَ الَّذِي مِنَ اللهِ وَحْدَهُ؟[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الكرامة» في موضعي «المجد» (اليونانية: δόξα).'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا صياغة مطلع الآية: «كيف يمكنكم أن تؤمنوا؟»'
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς δύνασθε
  choice: كَيْفَ تَقْدِرُونَ
  rationale: ينقل السؤال البلاغي المتعلق بالإمكان والقدرة بصورة عربية طبيعية، من غير أن يحسم هل المقصود استحالة مطلقة أم توبيخ عملي.
- source_word: ὑμεῖς
  choice: واو الجماعة في «تقدرون» و«تؤمنوا»
  rationale: صيغة الفعل العربية تُظهر المخاطبين بوضوح؛ وإضافة «أنتم» هنا قد تثقل العبارة، مع أن الضمير المنفصل اليوناني يفيد شيئًا من التوكيد.
- source_word: πιστεῦσαι
  choice: أَنْ تُؤْمِنُوا
  rationale: «تؤمنوا» المقابل المعتاد الواسع الدلالة لـ πιστεύω في يوحنا، ويحفظ مجال المعنى بين التصديق والثقة من غير تضييق عقائدي.
- source_word: δόξαν ... τὴν δόξαν
  choice: الْمَجْدَ ... الْمَجْدَ
  rationale: يحفظ تكرار اللفظة اليونانية والتقابل المقصود بين المجد المتبادل بين البشر والمجد الصادر من الله؛ و«الكرامة» بديل سياقي ممكن.
- source_word: παρ’ ἀλλήλων
  choice: بَعْضُكُمْ مِنْ بَعْضٍ
  rationale: تعبير عربي واضح ينقل العلاقة التبادلية ومصدر المجد البشري.
- source_word: λαμβάνοντες
  choice: وَأَنْتُمْ تَتَلَقَّوْنَ
  rationale: يبيّن أن الحال المستمر الموصوف هو تلقي المجد من الآخرين، ويحفظ ارتباط الحال بالسؤال الرئيس.
- source_word: καὶ ... οὐ ζητεῖτε
  choice: وَلَا تَطْلُبُونَ
  rationale: ينقل الفعل المحدود المنفي بوضوح، ويربطه بالحال السابقة وفق تدفق الجملة اليونانية.
- source_word: τὴν παρὰ τοῦ μόνου θεοῦ
  choice: الَّذِي مِنَ اللهِ الْوَحِيدِ
  rationale: ترجمة مباشرة للمصدر ولصفة الحصر μόνος، من غير توسيع تفسيري إلى صياغة أطول.
theological_decisions:
- issue: دلالة πιστεῦσαι في السياق اليوحناوي
  choice: تؤمنوا
  alternative: تثقوا
  rationale: «تؤمنوا» هي المقابلة العربية القياسية والأوسع، فلا تختزل الفعل في معنى نفسي أو عقائدي أضيق.
- issue: توحيد ترجمة δόξα في الموضعين
  choice: المجد في الموضعين
  alternative: الكرامة في الموضعين
  rationale: يحفظ التوازي اللفظي والتوتر بين المجد الذي يتلقاه الناس بعضهم من بعض والمجد الآتي من الله.
- issue: دلالة τοῦ μόνου θεοῦ
  choice: الله الوحيد
  alternative: الإله الواحد الوحيد
  rationale: تحفظ الصياغة حصر الألوهية الذي تفيده μόνος من غير إضافة ألفاظ ليست في الأصل أو استنتاجات لاهوتية خارجة عنه.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية كريمة. استُخدمت «تتلقون» لتجنب إيحاء أن المجد مجرد امتلاك سلبي، وحُفظ تكرار «المجد» والتقابل البنيوي في الأصل. وُضعت علامتا الحاشية في المتن بعد الجملة، وكلتاهما تشرح بديلًا لغويًا حقيقيًا.
