  text: τοῦτον ἰδὼν ὁ Ἰησοῦς κατακείμενον, καὶ γνοὺς ὅτι πολὺν ἤδη χρόνον ἔχει, λέγει αὐτῷ· Θέλεις ὑγιὴς γενέσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/john/005/006.yaml
  text: When Jesus saw this man lying there[a], and knew that he had already been there a long time, he said to him, “Do you want to become well?”
translation:
  language: ar
  text: 'فلما رأى يسوع هذا الرجل ملقى هناك، وعلم أنه على هذه الحال منذ وقت طويل، قال له: «أتريد أن تصير معافى؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτον
  choice: هذا الرجل
  rationale: اسم الإشارة يعود إلى الرجل المريض المذكور في السياق، والتصريح بـ«الرجل» واضح وطبيعي في العربية.
- source_word: ἰδὼν
  choice: فلما رأى
  rationale: حوِّل اسم الفاعل الماضي إلى جملة زمنية عربية طبيعية، مع الحفاظ على تعاقب الحدث قبل الفعل الرئيس.
- source_word: κατακείμενον
  choice: ملقى هناك
  rationale: ينقل هيئة الرجل الممدد في موضع البركة، ويجمع بصورة موجزة بين وضعه والمشهد المكاني.
- source_word: γνοὺς
  choice: وعلم
  rationale: ينقل معرفة يسوع من غير تحديد الوسيلة التي عرف بها، كما يفعل النص اليوناني.
- source_word: πολὺν ἤδη χρόνον ἔχει
  choice: أنه على هذه الحال منذ وقت طويل
  rationale: العبارة اليونانية موجزة ومحذوف متعلقها، والسياق يرجح مدة حالة الرجل أو وضعه. تحافظ الصياغة على هذا المعنى من غير قصرها على مدة وجوده عند البركة.
- source_word: λέγει αὐτῷ
  choice: قال له
  rationale: صيغ المضارع التاريخي في العربية بالماضي لسلامة السرد وطبيعته.
- source_word: Θέλεις
  choice: أتريد
  rationale: تعبير عربي مباشر وواضح عن الرغبة أو الإرادة من غير زيادة تفسيرية.
- source_word: ὑγιὴς
  choice: معافى
  rationale: يدل على الانتقال إلى السلامة من المرض أو العجز، وهو أنسب للسياق من «صحيح» أو «سليم».
- source_word: γενέσθαι
  choice: أن تصير
  rationale: يحفظ دلالة γίνομαι على الدخول في حالة جديدة، بدل الاكتفاء بالفعل الجامد «تكون».
theological_decisions:
- issue: طبيعة معرفة يسوع في γνοὺς
  choice: 'صياغتها بوصفها معرفة سردية مجردة: «وعلم»'
  alternative: تحديد أن معرفته كانت خارقة للطبيعة، أو أنه عرف بالملاحظة أو الخبر
  rationale: لا يذكر النص وسيلة معرفة يسوع، لذلك لا ينبغي للترجمة أن تحسم ما تركه النص غير محدد.
- issue: متعلق مدة πολὺν ἤδη χρόνον ἔχει
  choice: 'ربط المدة بحالة الرجل عمومًا: «على هذه الحال منذ وقت طويل»'
  alternative: 'ربطها حصريًا بوجوده في ذلك المكان: «هناك منذ وقت طويل»'
  rationale: التركيب اليوناني لا يصرح بالمتعلق، والسياق السابق يذكر مدة مرضه. تحافظ الصياغة المختارة على الإيجاز ولا تضيف أنه أمضى كامل المدة عند البركة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «فلما» لتسلسل السرد، و«معافى» لتوصيل معنى الشفاء بلغة مفهومة غير طبية، مع إبقاء مصدر معرفة يسوع غير محدد.
