  to: أَمَّا الرَّجُلُ الَّذِي شُفِيَ فَلَمْ يَكُنْ يَعْرِفُ مَنْ هُوَ، لِأَنَّ يَسُوعَ كَانَ قَدِ انْسَلَّ[a]، إِذْ كَانَ فِي الْمَكَانِ حَشْدٌ.
