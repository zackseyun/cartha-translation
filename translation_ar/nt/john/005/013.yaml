lexical_decisions:
- source_word: ἰαθεὶς
  choice: الرجل الذي شُفي
  rationale: اسم فاعل ماضٍ مبني للمجهول مع أداة التعريف، مستعمل استعمال الاسم. تحافظ الصياغة على المبني للمجهول وعلى سبق الشفاء للفعل الرئيس، وتُظهر المذكر المفرد طبيعيًا في العربية.
- source_word: οὐκ ᾔδει
  choice: لم يكن يعرف
  rationale: تعبير عربي طبيعي ينقل دلالة عدم المعرفة في ذلك الوقت.
- source_word: τίς ἐστιν
  choice: مَن هو
  rationale: يحافظ على الإحالة الشخصية إلى يسوع وعلى صيغة الاستفهام غير المباشر دون إضافة تفسير لهويته.
- source_word: ἐξένευσεν
  choice: كان قد انسلَّ من بين الناس
  rationale: ينقل الفعل معنى الابتعاد دون لفت الانتباه، كما يوضح أن ذلك سبق عدم تمكّن الرجل من معرفته. أُضيف «من بين الناس» لإبراز الانسحاب وسط الجمع بصورة عربية طبيعية.
- source_word: ὄχλου ὄντος
  choice: إذ كان ... جمعٌ
  rationale: ينقل تركيب المضاف إليه المطلق بوصفه ظرفًا مصاحبًا يمكن أن يحمل أيضًا مسحة سببية، من غير حسم زائد بين المصاحبة والتعليل.
- source_word: ἐν τῷ τόπῳ
  choice: في المكان
  rationale: مقابل مكاني مباشر يحافظ على ذكر الموضع صراحة بدل اختزاله إلى «هناك».
