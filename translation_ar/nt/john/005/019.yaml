  text: Ἀπεκρίνατο οὖν ὁ Ἰησοῦς καὶ ⸀ἔλεγεν αὐτοῖς· Ἀμὴν ἀμὴν λέγω ὑμῖν, οὐ δύναται ὁ υἱὸς ποιεῖν ἀφ’ ἑαυτοῦ οὐδὲν ⸀ἐὰν μή τι βλέπῃ τὸν πατέρα ποιοῦντα· ἃ γὰρ ἂν ἐκεῖνος ποιῇ, ταῦτα καὶ ὁ υἱὸς ὁμοίως ποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/019.yaml
  text: So Jesus answered and said to them[a], “Truly, truly, I say to you, the Son is not able to do anything from himself unless he sees the Father doing it; for whatever that one does[b], these things the Son also does likewise.”
translation:
  language: ar
  text: 'فأجابهم يسوع قائلًا: «الحقَّ الحقَّ أقول لكم: لا يقدر الابن أن يفعل شيئًا من عند نفسه، إلا ما يرى الآب يفعله[a]؛ لأن كل ما يفعله ذاك، يفعله الابن أيضًا على النحو نفسه[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ويجوز: «إلا إذا رأى الآب يفعل شيئًا». يفيد التركيب اليوناني الاستثناء، ويمكن نقله إما بهذه الصياغة الأقرب إلى بنيته، وإما بصياغة «إلا ما يرى الآب يفعله» الأكثر سلاسة في العربية.'
    reason: lexical_alternative
  - marker: b
    text: تجمع العبارة بين عدم فعل الابن من عند نفسه وبين فعله كل ما يفعله الآب وعلى النحو نفسه؛ وهي تصف هنا عدم انفصال فعله عن فعل الآب، من غير أن تشرح في هذه الآية وحدها كيفية هذه العلاقة.
    reason: theological_clarity
lexical_decisions:
- source_word: Ἀπεκρίνατο οὖν ὁ Ἰησοῦς καὶ ἔλεγεν αὐτοῖς
  choice: فأجابهم يسوع قائلًا
  rationale: تنقل οὖν بصلة سياقية طبيعية في الفاء، وتجمع «أجاب وكان يقول لهم» في صياغة عربية فصيحة غير متكلفة؛ و«قائلًا» تؤدي وظيفة إدخال القول من غير إثقال السرد.
- source_word: Ἀμὴν ἀμὴν λέγω ὑμῖν
  choice: الحقَّ الحقَّ أقول لكم
  rationale: تحافظ على التكرار التوكيدي والصيغة الجليلة المميزة لأقوال يسوع، مع وضوحها للقارئ العربي.
- source_word: οὐ δύναται ὁ υἱὸς ποιεῖν ἀφ’ ἑαυτοῦ οὐδὲν
  choice: لا يقدر الابن أن يفعل شيئًا من عند نفسه
  rationale: تحفظ معنى القدرة في δύναται، والنفي الشامل في οὐδὲν، ودلالة المصدر أو الانطلاق الذاتي في ἀφ’ ἑαυτοῦ، دون تحويل العبارة إلى مجرد نفي للإذن أو الإرادة.
- source_word: ἐὰν μή τι βλέπῃ τὸν πατέρα ποιοῦντα
  choice: إلا ما يرى الآب يفعله
  rationale: صياغة عربية طبيعية تحمل معنى الاستثناء في التركيب اليوناني، وتجعل τι مضمَّنًا في «ما» من غير إضافة مفعول محدد لا يصرح به النص.
- source_word: ἃ γὰρ ἂν ἐκεῖνος ποιῇ
  choice: لأن كل ما يفعله ذاك
  rationale: «كل ما» تنقل التعميم الذي تؤديه الصلة مع ἄν وصيغة الالتزام، و«ذاك» تحفظ بروز ἐκεῖνος وتمييز الآب من الابن، وإن كانت أفصح وأشد رسمية من الضمير وحده.
- source_word: ταῦτα καὶ ὁ υἱὸς ὁμοίως ποιεῖ
  choice: يفعله الابن أيضًا على النحو نفسه
  rationale: تحافظ على المطابقة المؤكدة بين فعل الآب وفعل الابن، وتؤدي καὶ وὁμοίως بعبارة عربية واضحة وطبيعية.
theological_decisions:
- issue: دلالة عدم قدرة الابن على الفعل من عند نفسه
  choice: لا يقدر الابن أن يفعل شيئًا من عند نفسه
  alternative: لا يفعل الابن شيئًا مستقلًّا عن الآب
  rationale: يحفظ الاختيار التصريح النصي بالقدرة وبالاعتماد في الفعل، من غير أن يخففه إلى مجرد قرار إرادي، ومن غير أن يضيف حكمًا ميتافيزيقيًا لا تصرح به الآية. أما البديل فيفسر «من عند نفسه» بالاستقلال وقد يضيّق مجال العبارة.
- issue: العلاقة بين أفعال الآب وأفعال الابن
  choice: كل ما يفعله ذاك، يفعله الابن أيضًا على النحو نفسه
  alternative: فما يعمله الآب يعمله الابن كذلك
  rationale: يحفظ النص عموم «كل ما» والتوكيد الموجود في ἐκεῖνος وὁμοίως، ويترك التوتر اللاهوتي بين اعتماد الابن ووحدة فعله مع الآب قائمًا بدل حسمه بتفسير مذهبي.
- issue: استعمال «الابن» و«الآب» لقبين علائقيين
  choice: الابن / الآب
  alternative: الابن / أبوه
  rationale: اليونانية تستعمل أداة التعريف ولا تتضمن ضمير ملكية صريحًا، والسياق يجعل اللفظين لقبين محددين؛ لذلك تحافظ الصياغة المختارة على بنية الأصل.
translation_notes:
  register: عربية فصحى معاصرة واضحة وجليلة. استُخدم «قائلًا» لتجنب التركيب الثقيل «أجاب وكان يقول»، و«الحق الحق» للإبقاء على التكرار الرسمي المميز. وُضعت علامتا الحاشية بعد العبارتين اللتين تحتاجان إلى بيان لغوي ولاهوتي، وهما ظاهرتان في المتن.
