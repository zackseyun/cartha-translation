id: JHN.5.30
reference: John 5:30
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Οὐ δύναμαι ἐγὼ ποιεῖν ἀπ’ ἐμαυτοῦ οὐδέν· καθὼς ἀκούω κρίνω, καὶ ἡ κρίσις ἡ ἐμὴ δικαία ἐστίν, ὅτι οὐ ζητῶ τὸ θέλημα τὸ ἐμὸν ἀλλὰ τὸ θέλημα τοῦ πέμψαντός ⸀με.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/030.yaml
  text: I am not able to do anything from myself. Just as I hear[a], I judge, and my judgment is just, because I do not seek my own will, but the will of the one who sent me.
translation:
  language: ar
  text: أنا لا أقدر أن أفعل شيئًا من تلقاء نفسي[a]. وكما أسمع أحكم، وحكمي عادل، لأني لا أطلب مشيئتي أنا، بل مشيئة الذي أرسلني.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ويجوز: «من نفسي». تدل العبارة اليونانية على أن الفعل لا يصدر عنه باستقلال.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ δύναμαι ἐγὼ
  choice: أنا لا أقدر
  rationale: يحافظ على نفي القدرة وعلى بروز الضمير ἐγώ، بصياغة عربية واضحة وطبيعية.
- source_word: ποιεῖν ἀπ’ ἐμαυτοῦ οὐδέν
  choice: أن أفعل شيئًا من تلقاء نفسي
  rationale: تنقل العبارة معنى أن الفعل لا يصدر عن استقلال ذاتي، مع استعمال «شيئًا» الملائم عربيًا في سياق النفي.
- source_word: καθὼς ἀκούω
  choice: وكما أسمع
  rationale: تحافظ «كما» على معنى المطابقة أو التوافق، ويبقى المضارع عامًا ومستمرًا كما في اليونانية.
- source_word: κρίνω / ἡ κρίσις ἡ ἐμὴ
  choice: أحكم / حكمي
  rationale: يحافظ تكرار الجذر العربي على الصلة اللفظية والقضائية بين الفعل والاسم في الأصل.
- source_word: δικαία
  choice: عادل
  rationale: يلائم السياق القضائي، ويعبّر عن عدالة الحكم واستقامته بوضوح.
- source_word: οὐ ζητῶ
  choice: لا أطلب
  rationale: ينقل معنى التماس الغاية أو السعي إليها دون توسيع تفسيري.
- source_word: τὸ θέλημα τὸ ἐμὸν
  choice: مشيئتي أنا
  rationale: يبرز توكيد الملكية في اليونانية، مع إبقاء مصطلح «المشيئة» الدقيق والمألوف.
- source_word: τοῦ πέμψαντός με
  choice: الذي أرسلني
  rationale: ينقل وصف الفاعل كما ورد، من غير إضافة لفظ «الآب» الذي لا يظهر صراحة في الجملة.
theological_decisions:
- issue: دلالة ἀπ’ ἐμαυτοῦ في علاقة عمل الابن بمن أرسله
  choice: من تلقاء نفسي
  alternative: من نفسي؛ باستقلال عن نفسي
  rationale: تفيد العبارة أن يسوع لا يعمل بمبادرة مستقلة عمن أرسله، من غير تحويل القول إلى تقرير تفسيري عن عجز مطلق أو عن الطبيعة الإلهية.
- issue: دلالة δικαία مع κρίσις
  choice: حكمي عادل
  alternative: حكمي بار؛ حكمي حق
  rationale: «عادل» أوضح في سياق القضاء، ويحفظ معنى صحة الحكم وإنصافه دون نفي البعد الأخلاقي.
translation_notes:
  register: لغة عربية فصحى معاصرة، واضحة ومهيبة. استُعمل «من تلقاء نفسي» لطبيعيته في العربية مع شرح دلالة المصدر والاستقلال في الحاشية، وحُفظ الترابط بين «أحكم» و«حكمي».
