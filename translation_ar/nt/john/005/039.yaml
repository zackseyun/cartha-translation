  text: Ἐραυνᾶτε τὰς γραφάς, ὅτι ὑμεῖς δοκεῖτε ἐν αὐταῖς ζωὴν αἰώνιον ἔχειν· καὶ ἐκεῖναί εἰσιν αἱ μαρτυροῦσαι περὶ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/039.yaml
  text: You search the Scriptures because you think that in them you have eternal life[a]; and these are the ones that testify about me.
translation:
  language: ar
  text: أنتم تفحصون الكتب المقدسة لأنكم تظنون أن لكم فيها حياة أبدية[a]؛ وهي التي تشهد عني.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «افحصوا الكتب المقدسة، لأنكم تظنون أن لكم فيها حياة أبدية»، إذا فُهمت «تفحصون» على أنها فعل أمر لا فعل خبر.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐραυνᾶτε
  choice: أنتم تفحصون
  rationale: الصيغة اليونانية تحتمل الخبر والأمر. اختير الخبر لأن السياق يصف ممارسة المخاطَبين وينتقد عدم إدراكهم شهادة الكتب ليسوع، مع حفظ احتمال الأمر في الحاشية.
- source_word: τὰς γραφάς
  choice: الكتب المقدسة
  rationale: تشير العبارة في السياق اليوحناوي إلى كتابات إسرائيل المقدسة، لا إلى كتابات عامة.
- source_word: ὅτι
  choice: لأنكم
  rationale: فُهمت أداة الربط سببية، إذ تبيّن سبب فحصهم للكتب.
- source_word: δοκεῖτε
  choice: تظنون
  rationale: تنقل اعتقادهم أو افتراضهم بوضوح، وتحفظ النبرة النقدية المعتدلة.
- source_word: ἐν αὐταῖς
  choice: فيها
  rationale: يحافظ هذا على الدلالة المباشرة لحرف الجر وعلى عود الضمير إلى الكتب المقدسة.
- source_word: ζωὴν αἰώνιον
  choice: حياة أبدية
  rationale: المقابل العربي الطبيعي والمتسق للمصطلح اليوحناوي.
- source_word: ἐκεῖναί εἰσιν αἱ μαρτυροῦσαι
  choice: وهي التي تشهد
  rationale: يحفظ الضمير العائد إلى الكتب المقدسة والتوكيد، ويقدّم صياغة عربية طبيعية مع إبقاء صورة الشهادة المهمة في يوحنا.
- source_word: περὶ ἐμοῦ
  choice: لي
  rationale: تؤدي معنى الشهادة بشأن يسوع بصياغة عربية فصيحة ومألوفة؛ والمعنى هو أنها تشهد عنه.
theological_decisions:
- issue: 'صيغة Ἐραυνᾶτε: خبر أم أمر'
  choice: 'الخبر: «أنتم تفحصون الكتب المقدسة»'
  alternative: 'الأمر: «افحصوا الكتب المقدسة»'
  rationale: تحتمل الصيغة اليونانية الوجهين صرفيًا. يرجّح السياق الخبر، لأن يسوع يصف نهج مخاطَبيه القائم ثم يكشف قصوره، لكن البديل الأمرِي مشروع ولذلك حُفظ في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «الكتب المقدسة» للدلالة على كتابات إسرائيل المقدسة، وحُفظ الغموض النحوي الحقيقي في مطلع الآية بحاشية.
