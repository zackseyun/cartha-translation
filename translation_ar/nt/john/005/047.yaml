  yaml_path: translation/nt/john/005/047.yaml
  text: But if you do not believe his writings[a], how will you believe my words?
translation:
  language: ar
  text: ولكن إن كنتم لا تصدّقون كتاباته[a]، فكيف ستصدّقون كلامي؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي كتابات موسى. ويمكن أن تدل الكلمة اليونانية أيضًا على «رسائل»، لكن المقصود هنا ما كتبه موسى.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: ولكن إن
  rationale: تنقل الشرط مع قوة δέ الاستدراكية، وتصل الحجة بما قبلها بصياغة عربية واضحة.
- source_word: τοῖς ἐκείνου γράμμασιν
  choice: ما كتبه هو
  rationale: يدل γράμμασιν هنا على المكتوب، وسياق يوحنا 5:45–46 يعيّن موسى مرجع الضمير. وتبقي الصياغة الضمير بارزًا كما في اليونانية من غير أن تزيد اسم موسى في المتن.
- source_word: οὐ πιστεύετε
  choice: لا تصدّقون
  rationale: الفعل مع المكتوبات هنا يعني قبولها بوصفها صادقة؛ و«تصدّقون» أنسب في العربية من «تؤمنون بـ» عند الحديث عن كلام أو كتابة.
- source_word: πῶς ... πιστεύσετε
  choice: فكيف ستصدّقون
  rationale: تحفظ أداة الاستفهام وصيغة المستقبل، كما تصون القوة البلاغية للسؤال.
- source_word: τοῖς ἐμοῖς ῥήμασιν
  choice: كلامي
  rationale: تنقل ῥήμασιν بوصفها أقوالًا منطوقة، وتُظهر المقابلة الطبيعية بين ما كتبه موسى وكلام يسوع.
theological_decisions:
- issue: مرجع ἐκείνου («هو»/«ذاك»)
  choice: الضمير عائد إلى موسى بحسب السياق المباشر
  alternative: إعادة اسم «موسى» صراحة في المتن، أو إبقاء مرجع عام
  rationale: تذكر الآيتان السابقتان موسى وتقولان إنه كتب عن يسوع. أُبقي الضمير في المتن وفاءً لبنية الأصل، مع توضيح المرجع في الحاشية.
- issue: دلالة πιστεύω في العبارتين
  choice: تصدّقون
  alternative: تؤمنون أو تثقون
  rationale: السياق يركّز على قبول شهادة المكتوب والكلام بوصفها صادقة، وتكرار الفعل نفسه في العربية يحفظ التوازي البلاغي في اليونانية.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة. استُعمل «ما كتبه هو» بدل «كتاباته» لإبراز الضمير المقابِل لـ«كلامي» ولتجنب إيحاء غير مقصود بمجموعة مؤلفات مستقلة. تظهر علامة الحاشية [a] في المتن.
