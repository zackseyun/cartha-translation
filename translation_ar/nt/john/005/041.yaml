  text: δόξαν παρὰ ἀνθρώπων οὐ λαμβάνω,
base_translation:
  language: en
  yaml_path: translation/nt/john/005/041.yaml
  text: I do not receive glory from men[b][a],
translation:
  language: ar
  text: لَا أَتَلَقَّى مَجْدًا مِنَ النَّاسِ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «إكرامًا» أو «مديحًا» بدلًا من «مجدًا».
    reason: lexical_alternative
lexical_decisions:
- source_word: δόξαν
  choice: مَجْدًا
  rationale: يحافظ «مجدًا» على الصلة اللفظية بموضوع المجد في إنجيل يوحنا، مع أن اللفظة في هذا السياق تشمل أيضًا معنى الإكرام أو المديح الصادر من الآخرين.
- source_word: παρὰ ἀνθρώπων
  choice: مِنَ النَّاسِ
  rationale: تفيد παρά مع المضاف إليه المصدر، أي «من». وἀνθρώπων لفظ عام للبشر هنا؛ لذا تؤدي «الناس» المعنى بوضوح وطبيعية في العربية من غير تقييده بالذكور.
- source_word: οὐ λαμβάνω
  choice: لَا أَتَلَقَّى
  rationale: ينقل الفعل معنى الأخذ أو التلقي، وصيغة المضارع العربي تلائم المضارع اليوناني وتبقي العبارة قريبة من الأصل من غير إدخال معنى «أطلب» تفسيرًا.
theological_decisions:
- issue: طبيعة قول يسوع عن المجد البشري
  choice: إبقاء العبارة نفيًا لتلقي المجد من الناس من غير توسع تفسيري
  alternative: التصريح بأنه لا يطلب استحسان الناس أو لا يستمد منهم إثبات هويته
  rationale: السياق يشير إلى أن رسالة يسوع وهويته لا تعتمدان على تزكية البشر، لكن النص نفسه يقول «لا أتلقى» ولا يقول صراحة «لا أطلب». لذلك تحفظ الصياغة توتر العبارة ولا تجعلها نفيًا ميتافيزيقيًا مطلقًا لكل إكرام بشري ولا تضيف تفسيرًا إلى المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. اختيرت «الناس» بوصفها المقابل العربي الطبيعي العام لـἀνθρώπων، واختير «أتلقى» لإظهار ورود المجد من مصدر خارجي مع الحفاظ على دلالة λαμβάνω.
