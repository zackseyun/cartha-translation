  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὁ γὰρ πατὴρ φιλεῖ τὸν υἱὸν καὶ πάντα δείκνυσιν αὐτῷ ἃ αὐτὸς ποιεῖ, καὶ μείζονα τούτων δείξει αὐτῷ ἔργα, ἵνα ὑμεῖς θαυμάζητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/020.yaml
  text: For the Father loves the Son and shows him all that he himself is doing; and he will show him greater works than these[a], so that you may marvel.
translation:
  language: ar
  text: لِأَنَّ الْآبَ يُحِبُّ الِابْنَ، وَيُرِيهِ كُلَّ مَا يَعْمَلُهُ هُوَ نَفْسُهُ؛ وَسَيُرِيهِ أَعْمَالًا أَعْظَمَ مِنْ هَذِهِ[a]، لِكَيْ تَتَعَجَّبُوا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «حَتَّى تَتَعَجَّبُوا». يمكن للتركيب اليوناني ἵνα مع صيغة الاحتمال أن يدل على الغاية، وقد يفيد في هذا السياق أيضًا ما سينتج من تعجُّب سامعي يسوع.'
    reason: alternative_reading
lexical_decisions:
- source_word: φιλεῖ
  choice: يُحِبُّ
  rationale: ينقل معنى المحبة بوضوح وطبيعية، من غير أن يوحي بأن φιλέω هنا محبة أدنى من ἀγαπάω، مع إبقاء قوة العلاقة بين الآب والابن.
- source_word: δείκνυσιν / δείξει
  choice: يُرِيهِ / سَيُرِيهِ
  rationale: الفعل «أرى» هو المقابل العربي الطبيعي المباشر في هذا السياق، ويحافظ تكراره على الصلة اللفظية بين المضارع والمستقبل في اليونانية.
- source_word: πάντα
  choice: كُلَّ مَا
  rationale: صياغة عربية طبيعية تؤدي الشمول، وترتبط بسلاسة بجملة الصلة التالية.
- source_word: ἃ αὐτὸς ποιεῖ
  choice: مَا يَعْمَلُهُ هُوَ نَفْسُهُ
  rationale: يحافظ على فعل المضارع وعلى توكيد αὐτός، ويوضح أن الآب يُري الابن ما يعمله الآب نفسه.
- source_word: μείζονα τούτων ... ἔργα
  choice: أَعْمَالًا أَعْظَمَ مِنْ هَذِهِ
  rationale: يحفظ لفظ «الأعمال» المهم في إنجيل يوحنا، وينقل المقارنة بتركيب عربي واضح.
- source_word: ἵνα ὑμεῖς θαυμάζητε
  choice: لِكَيْ تَتَعَجَّبُوا
  rationale: «لكي» تحفظ دلالة الغاية، مع إمكان أن يُفهَم منها الأثر الناتج في السياق، و«تتعجبوا» عربية معاصرة فصيحة تنقل θαυμάζω.
theological_decisions:
- issue: طبيعة محبة الآب للابن المعبَّر عنها بالفعل φιλέω
  choice: يُحِبُّ
  alternative: يَوَدُّ أو يُكِنُّ لَهُ مَوَدَّةً
  rationale: لا يفرض السياق تمييزًا لاهوتيًا يجعل φιλέω أضعف من ἀγαπάω؛ لذلك تحفظ «يحب» قوة العلاقة من غير زيادة تفسيرية.
- issue: دلالة ἵνα ὑμεῖς θαυμάζητε بين الغاية والنتيجة
  choice: لِكَيْ تَتَعَجَّبُوا
  alternative: حَتَّى تَتَعَجَّبُوا / فَتَتَعَجَّبُونَ
  rationale: تحافظ الصياغة المختارة على بنية الغاية في الأصل، فيما تشرح الحاشية أن السياق قد يتضمن أيضًا نتيجة التعجب، من غير حسم الغموض لصالح معنى واحد.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة، مع ضبط كامل للنص القصير. استُعمل «الابن» و«الأعمال» بما يلائم أسلوب يوحنا، وحُفظ توكيد «هو نفسه» والغموض النسبي بين الغاية والنتيجة.
