  text: لا تتعجّبوا من هذا، لأن ساعةً آتية يسمع فيها جميع الذين في القبور[a] صوته.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «المدافن». يمكن أن تدل الكلمة اليونانية على أماكن الدفن عمومًا؛ واختيرت «القبور» حفاظًا على الصورة المحسوسة.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ θαυμάζετε
  choice: لا تتعجّبوا
  rationale: نهي بصيغة المضارع مع μή. «لا تتعجّبوا» عربية فصيحة طبيعية تنقل معنى الدهشة من غير مبالغة.
- source_word: τοῦτο
  choice: من هذا
  rationale: اسم إشارة يعود إلى القول السابق، وجاء مع «تتعجّبوا» على الاستعمال العربي الطبيعي.
- source_word: ὅτι
  choice: لأنه
  rationale: تُفهم هنا تعليلًا للنهي، ولذلك تُرجمت بأداة سببية واضحة.
- source_word: ἔρχεται ὥρα
  choice: تأتي ساعة
  rationale: يحافظ على صورة «الساعة» المهمة في إنجيل يوحنا، بدل تعميمها إلى «وقت»، كما يعكس تنكير ὥρα.
- source_word: ἐν ᾗ
  choice: يسمع فيها
  rationale: يعكس تركيب الموصول «فيها» مع تقديم الفعل بما يلائم سلاسة العربية.
- source_word: πάντες οἱ ἐν τοῖς μνημείοις
  choice: جميع الذين في القبور
  rationale: ينقل πάντες مع الصفة الموصولة، ويختار «القبور» بوصفها تسمية عربية واضحة لأماكن الدفن مع إبقاء الصورة المحسوسة.
- source_word: ἀκούσουσιν
  choice: يسمع
  rationale: فعل مستقبل في اليونانية؛ تدل عليه في العربية جملة «تأتي ساعة يسمع فيها»، وهو تعبير طبيعي عن الحدث الآتي.
- source_word: τῆς φωνῆς αὐτοῦ
  choice: صوته
  rationale: ترجمة مباشرة موجزة لـ φωνή مع ضمير الغائب، ولا تستلزم إضافة «نداء» أو «صوتَ صوته».
theological_decisions:
- issue: الإشارة إلى القيامة من خلال سماع الذين في القبور صوته
  choice: الإبقاء على صورة القبور المحسوسة من غير إضافة تفسير عقائدي صريح داخل الآية
  alternative: التصريح بأن الموتى سيقومون، أو استعمال «أماكن الدفن» الأعم
  rationale: النص يمهّد للقيامة لكنه في هذه الجملة يعبّر عنها بمن في القبور وسماعهم صوته؛ لذا تُحفظ صياغته وتوتره اللاهوتي من غير توسيع تفسيري.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعمل «تأتي ساعة» للمحافظة على التعبير اليوحناوي، وصيغ ترتيب الجملة على نحو طبيعي من غير الابتعاد عن بنية الأصل.
