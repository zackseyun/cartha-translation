  yaml_path: translation/nt/john/005/012.yaml
  text: So they asked him[a], “Who is the man who said to you, ‘Pick it up and walk’?”
translation:
  language: ar
  text: 'فسألوه: «مَن هو الرجل الذي قال لك: ‹احملْ وامشِ›؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠρώτησαν
  choice: سألوه
  rationale: ينقل فعل السؤال بصياغة عربية طبيعية من غير أن يضيف معنى الاستجواب العدائي.
- source_word: οὖν
  choice: فـ
  rationale: الفاء تربط السؤال بما سبقه وتؤدي معنى الاستمرار أو النتيجة في السياق السردي بإيجاز طبيعي.
- source_word: ὁ ἄνθρωπος
  choice: الرجل
  rationale: يشير التعبير هنا إلى شخص ذكر بعينه، ولذلك فـ«الرجل» أدق من تعبير عام مثل «الشخص».
- source_word: ὁ εἰπών σοι
  choice: الذي قال لك
  rationale: ترجمة مباشرة وواضحة لاسم الفاعل الموصولي مع ضمير المخاطب في صياغة عربية مألوفة.
- source_word: Ἆρον
  choice: احملْ
  rationale: فعل أمر من αἴρω، والمفعول محذوف في النص اليوناني ويُفهم من السياق السابق؛ وتحافظ العربية على هذا الحذف بصورة سليمة وطبيعية.
- source_word: καὶ περιπάτει
  choice: وامشِ
  rationale: ينقل أمر المشي بوضوح من غير تحميل صيغة المضارع اليونانية دلالة استمرارية زائدة لا يقتضيها السياق.
theological_decisions: []
