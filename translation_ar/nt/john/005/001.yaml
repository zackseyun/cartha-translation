  text: Μετὰ ταῦτα ⸀ἦν ἑορτὴ τῶν Ἰουδαίων, καὶ ⸀ἀνέβη Ἰησοῦς εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/001.yaml
  text: After these things[a], there was a feast of the Jews[b], and Jesus went up to Jerusalem.
translation:
  language: ar
  text: بَعْدَ ذَلِكَ كَانَ عِيدٌ لِلْيَهُودِ[a]، وَصَعِدَ يَسُوعُ إِلَى أُورُشَلِيمَ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي عيدًا من أعياد الشعب اليهودي. وقد تعني الكلمة اليونانية المترجمة «اليهود» في بعض السياقات الأخرى «أهل اليهودية».
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: بَعْدَ ذَلِكَ
  rationale: تؤدي العبارة وظيفة انتقال سردي. وهذه الصياغة عربية طبيعية وتحفظ الإحالة إلى الأحداث السابقة دون التقيّد الحرفي غير المألوف بصيغة الجمع.
- source_word: ἦν
  choice: كَانَ
  rationale: ينقل الفعل الناقص كما هو، ويأتي طبيعيًا في تركيب «كان عيدٌ» للدلالة على وجود مناسبة عيد في ذلك الوقت.
- source_word: ἑορτὴ
  choice: عِيدٌ
  rationale: تدل الكلمة على مناسبة دينية احتفالية؛ و«عيد» هو المقابل العربي الواضح والمألوف في السياق اليهودي.
- source_word: τῶν Ἰουδαίων
  choice: لِلْيَهُودِ
  rationale: تفيد الإضافة أن العيد خاص بالشعب اليهودي أو من أعياده. واللام صياغة عربية موجزة وطبيعية تحفظ هذه العلاقة.
- source_word: ἀνέβη
  choice: صَعِدَ
  rationale: يحفظ معنى الذهاب صعودًا إلى أورشليم، وهو استعمال يرتبط بارتفاعها وباللغة التقليدية للذهاب إليها، من غير إضافة فعل غير موجود في الأصل.
- source_word: Ἱεροσόλυμα
  choice: أُورُشَلِيمَ
  rationale: الاسم العربي الكتابي المألوف للمدينة.
theological_decisions:
- issue: مدلول Ἰουδαίων في إنجيل يوحنا
  choice: اليهود
  alternative: أهل اليهودية / اليهوديون
  rationale: لأن الكلمة هنا تصف عيدًا دينيًا، فالإشارة إلى الشعب اليهودي أرجح من الإشارة الإقليمية إلى سكان اليهودية. وتوضح الحاشية أن للكلمة مدى دلاليًا أوسع في سياقات أخرى دون تحميل هذا الموضع معنى جدليًا.
translation_notes:
  register: صياغة عربية فصحى واضحة ووقورة، مع انتقال سردي طبيعي. استُعمل «صعد» بدل «ذهب» للمحافظة على صورة الأصل ولغة التوجّه إلى أورشليم.
