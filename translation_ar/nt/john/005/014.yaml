id: JHN.5.14
reference: John 5:14
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: μετὰ ταῦτα εὑρίσκει αὐτὸν ὁ Ἰησοῦς ἐν τῷ ἱερῷ καὶ εἶπεν αὐτῷ· Ἴδε ὑγιὴς γέγονας· μηκέτι ἁμάρτανε, ἵνα μὴ χεῖρόν ⸂σοί τι⸃ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/014.yaml
  text: After these things Jesus found him in the temple and said to him[a], “See, you have become well. Sin no more[c][b], so that something worse may not happen to you.”
translation:
  language: ar
  text: 'بعد هذه الأحداث[a] وجد يسوع الرجل في الهيكل وقال له: «ها أنت قد صرت معافى[b]. لا تخطئ بعد الآن، لئلا يصيبك ما هو أسوأ[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «بعد هذه الأشياء»؛ وهي عبارة تدل على تتابع أحداث الرواية.'
    reason: lexical_alternative
  - marker: b
    text: 'تفيد اليونانية: «قد صرت معافى»، مع إبراز أن العافية حالة حاضرة نتجت عما حدث.'
    reason: lexical_alternative
  - marker: c
    text: لا يصرح التحذير بأن المرض السابق نتج عن خطيئة محددة، ولا يحدد هل «ما هو أسوأ» معاناة زمنية أم الدينونة الأخيرة أم كليهما.
    reason: alternative_reading
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: بعد هذه الأحداث
  rationale: يحفظ صيغة الجمع وتسلسل السرد، مع استعمال «الأحداث» بدل الترجمة الحرفية الأثقل «الأشياء».
- source_word: εὑρίσκει
  choice: وجد
  rationale: المضارع اليوناني هنا مضارع تاريخي، والماضي هو الأسلوب الطبيعي في السرد العربي.
- source_word: αὐτόν
  choice: الرجل
  rationale: يُصرَّح بالمرجع في العربية لتجنب غموض الضمير عند انتقال الفاعل إلى يسوع، من غير إضافة معنى جديد إلى السياق.
- source_word: ἐν τῷ ἱερῷ
  choice: في الهيكل
  rationale: تشير اللفظة إلى مجمع الهيكل عمومًا، و«الهيكل» هو المقابل العربي الموجز المألوف.
- source_word: Ἴδε
  choice: ها أنت
  rationale: ينقل أداة التنبيه بصياغة عربية طبيعية مباشرة من غير نبرة قديمة متكلفة.
- source_word: ὑγιὴς γέγονας
  choice: قد صرت معافى
  rationale: يحفظ فعل الصيرورة وصيغة التمام الدالة على تغير حدث وبقيت نتيجته قائمة.
- source_word: μηκέτι ἁμάρτανε
  choice: لا تخطئ بعد الآن
  rationale: ينقل النهي عن الاستمرار أو العودة إلى الخطيئة من هذه اللحظة فصاعدًا، من غير الجزم بأن الفعل اليوناني يصف عادة مستمرة بعينها.
- source_word: ἵνα μὴ
  choice: لئلا
  rationale: صياغة عربية فصيحة ومفهومة تؤدي معنى الغاية أو النتيجة المحذَّر منها بإيجاز.
- source_word: χεῖρόν σοί τι γένηται
  choice: يصيبك ما هو أسوأ
  rationale: ينقل المقارنة والاحتمال ووقوع الأمر على المخاطب، من غير تحديد ماهية الأمر الأسوأ.
theological_decisions:
- issue: العلاقة بين الخطيئة والمعاناة في تحذير يسوع
  choice: إبقاء التحذير مباشرًا من غير التصريح بأن مرض الرجل السابق كان عقابًا على خطيئة محددة، ومن غير تحديد ماهية الأمر الأسوأ.
  alternative: اعتبار المرض السابق نتيجة مباشرة لخطيئة بعينها، أو حصر الأمر الأسوأ في عقوبة زمنية أو في الدينونة الأخيرة.
  rationale: النص يربط التحذير من الخطيئة بإمكان وقوع ما هو أسوأ، لكنه لا يصرح بسبب المرض السابق ولا يحدد طبيعة العاقبة الأسوأ؛ لذلك ينبغي صون هذا التوتر الدلالي واللاهوتي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حوفظ على إيجاز الجملة وقوة التحذير، واستُعملت صياغات طبيعية غير مذهبية، مع توضيح مواضع الغموض الحقيقي في الحواشي.
