id: JHN.5.43
reference: John 5:43
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἐγὼ ἐλήλυθα ἐν τῷ ὀνόματι τοῦ πατρός μου καὶ οὐ λαμβάνετέ με· ἐὰν ἄλλος ἔλθῃ ἐν τῷ ὀνόματι τῷ ἰδίῳ, ἐκεῖνον λήμψεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/043.yaml
  text: I have come in my Father's name[a], and you do not receive me. If another comes in his own name[b], you will receive him.
translation:
  language: ar
  text: أنا قد جئتُ باسم أبي[a]، وأنتم لا تقبلونني. إن جاء آخر باسمه هو[b]، فستقبلونه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بسلطان أبي» أو «نيابةً عن أبي». فالتعبير «باسم» قد يدل على التمثيل والسلطان، فضلًا عن الاسم نفسه.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «بسلطانه هو». وتقابل هذه العبارة بوضوح مجيء يسوع «باسم أبي».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλήλυθα
  choice: قد جئتُ
  rationale: ينقل الفعل التام اليوناني مجيئًا وقع وما زالت نتيجته حاضرة، وهو تعبير عربي طبيعي.
- source_word: ἐν τῷ ὀνόματι τοῦ πατρός μου
  choice: باسم أبي
  rationale: يحفظ التعبير اليوناني وما يحتمله من معنى التمثيل والسلطان، من غير حصره في تفسير واحد.
- source_word: οὐ λαμβάνετέ με
  choice: لا تقبلونني
  rationale: الفعل هنا يدل على قبول يسوع والاستجابة له، لا على الأخذ المادي؛ و«تقبلونني» أوضح في العربية المعاصرة.
- source_word: ἄλλος
  choice: آخر
  rationale: ترجمة مباشرة تحفظ المقابلة مع المتكلم دون تعيين هوية الشخص الآخر.
- source_word: ἐν τῷ ὀνόματι τῷ ἰδίῳ
  choice: باسمه هو
  rationale: يحفظ التوازي مع «باسم أبي»، وتفيد «هو» التوكيد الكامن في ἰδίῳ، أي باسمه الخاص لا باسم مُرسِل.
- source_word: ἐκεῖνον λήμψεσθε
  choice: فستقبلونه
  rationale: تكرار جذر «قبل» يحافظ على التضاد البلاغي بين رفض يسوع وقبول الآخر، وتؤدي الفاء صلة جواب الشرط طبيعيًا.
theological_decisions:
- issue: هل يُصرَّح بأن «أبي» هو الله الآب؟
  choice: الإبقاء على «أبي» كما في النص، دون إضافة «الله».
  alternative: «أبي، الله» أو «الله أبي»
  rationale: السياق اليوحناوي يوضح المرجع، أما التصريح به فيضيف إلى صياغة اليونانية ما ليس ملفوظًا فيها.
- issue: هل يُفسَّر «باسم» في المتن على أنه سلطان؟
  choice: الإبقاء على «باسم» في العبارتين.
  alternative: «بسلطان أبي» و«بسلطانه هو»
  rationale: يتضمن التعبير معنى السلطان والتمثيل، لكنه لا يقتصر عليهما؛ كما أن إبقاءه يحفظ التوازي المقصود والتوتر بين الإرسال الإلهي والادعاء الذاتي.
translation_notes:
  register: صياغة عربية فصحى واضحة وكريمة. استُخدم «تقبلونني» بدل «تأخذونني» لتجنب المعنى المادي، وحُفظ تكرار الفعل والتوازي بين «باسم أبي» و«باسمه هو».
