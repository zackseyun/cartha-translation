  text: ὥσπερ γὰρ ὁ πατὴρ ἔχει ζωὴν ἐν ἑαυτῷ, οὕτως ⸂καὶ τῷ υἱῷ ἔδωκεν⸃ ζωὴν ἔχειν ἐν ἑαυτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/026.yaml
  text: For just as the Father has life in himself[b][a], so he also granted the Son to have life in himself.
translation:
  language: ar
  text: فكما أن الآب له حياة في ذاته[a]، هكذا أعطى[b] الابنَ أيضًا أن تكون له حياة في ذاته.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: تعبير «حياة في ذاته» يحافظ على اللفظ اليوناني، وقد يُفهم منه أن الحياة كامنة في ذات الآب؛ ولم يُستبدل به المصطلح اللاهوتي «حياة ذاتية الوجود».
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًّا: «أعطى الابن أن تكون له حياة في ذاته». وتحافظ الترجمة هنا على لغة العطاء الواردة في اليونانية من غير إضافة تفسير لاهوتي.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: فكما أنَّ
  rationale: تنقل γάρ التعليلية وὥσπερ المقارِنة في تركيب عربي طبيعي، وتحافظ على الصلة المنطقية بالسياق السابق.
- source_word: ὁ πατὴρ
  choice: الآب
  rationale: اللقب المحدد لله في الاستعمال اليوحناوي، وصيغته العربية المألوفة تحافظ على دلالته العلائقية.
- source_word: ἔχει ζωὴν
  choice: له حياة
  rationale: تعبير عربي فصيح ومباشر عن معنى الامتلاك في المضارع من غير توسيع تفسيري.
- source_word: ζωὴν ἐν ἑαυτῷ
  choice: حياة في ذاته
  rationale: يحافظ على شبه الجملة الصريح وعلى تكراره المتوازي في شطري الآية، ولا يستبدله بالمصطلح اللاهوتي التفسيري «حياة ذاتية الوجود».
- source_word: οὕτως καὶ
  choice: كذلك
  rationale: يحفظ الترابط المقارن ὥσπερ...οὕτως؛ ودلالة καί الإضافية مفهومة في المقابلة العربية من غير إثقال العبارة.
- source_word: τῷ υἱῷ
  choice: الابن
  rationale: مفعول غير مباشر مع ἔδωκεν، وهو لقب الابن في السياق المسيحاني.
- source_word: ἔδωκεν
  choice: أعطى
  rationale: المعنى العادي المباشر للفعل اليوناني في الماضي؛ ويحافظ على لغة العطاء الواردة في النص من غير تلطيف أو إضافة لاهوتية.
- source_word: ζωὴν ἔχειν
  choice: أن تكون له حياة
  rationale: صياغة عربية طبيعية للمصدر اليوناني المكمل، مع الحفاظ على معنى «أن يكون له حياة».
- source_word: ἐν ἑαυτῷ
  choice: في ذاته
  rationale: يحافظ على العبارة نفسها في الحديث عن الآب والابن، وعلى التوازي المقصود بينهما.
theological_decisions:
- issue: هل تُفسَّر عبارة «حياة في ذاته» صراحةً بمصطلح الوجود الذاتي؟
  choice: الإبقاء على «حياة في ذاته»
  alternative: «حياة ذاتية الوجود» أو «الوجود الذاتي»
  rationale: العبارة اليونانية هي ἐν ἑαυτῷ؛ والترجمة الحرفية الطبيعية تحفظ ثقلها اللاهوتي وغموضها الحقيقي من غير إحلال مصطلح عقائدي لاحق محل ألفاظ النص.
- issue: كيفية نقل ἔδωκεν في علاقة الآب بالابن
  choice: «أعطى» مع إبقاء بنية العطاء كما وردت
  alternative: «منح»
  rationale: يصرّح النص بأن الآب أعطى الابن أن تكون له حياة في ذاته. فلا ينبغي تخفيف هذه اللغة ولا شرح علاقتها بألوهية الابن داخل المتن؛ بل يُحفظ التوتر اللاهوتي ويُترك للسياق اليوحناوي الأوسع.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «في ذاته» لأنه طبيعي في السياق ويحفظ التوازي، واستُخدم «أعطى» لمباشرته وقربه من اللفظ اليوناني. وُضعت علامتا الحاشية في المتن كلتاهما، مع تجنب المصطلحات اللاهوتية التقنية.
