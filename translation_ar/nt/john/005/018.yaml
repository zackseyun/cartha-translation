base_translation:
  language: en
  yaml_path: translation/nt/john/005/018.yaml
  text: For this reason[a], therefore, the Jews were seeking all the more to kill him, because he was not only breaking the Sabbath, but was also calling God his own Father[b], making himself equal with God.
translation:
  language: ar
  text: ولهذا السبب كان اليهود[a] يسعون أكثر إلى قتله، لأنه لم يكن ينقض السبت فحسب، بل كان أيضًا يقول إن الله أبوه هو، جاعلًا نفسه مساويًا لله.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: كثيرًا ما يُراد بعبارة «اليهود» في إنجيل يوحنا، بحسب السياق، معارضو يسوع في اليهودية أو بعض السلطات اليهودية، لا جميع اليهود بلا تمييز.
    reason: cultural_note
  - marker: b
    text: 'أو: «جاعلًا نفسه معادلًا لله».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο οὖν
  choice: ولهذا، إذًا
  rationale: يحفظ أداتي الربط والاستنتاج معًا، مع صياغة عربية واضحة تصل الآية بما سبقها.
- source_word: μᾶλλον ἐζήτουν ... ἀποκτεῖναι
  choice: ازداد سعي ... إلى قتله
  rationale: ينقل معنى المقارنة والتصعيد في μᾶλλον، ويعبّر عن الفعل الناقص ἐζήτουν بوصفه سعيًا مستمرًا أو متكررًا.
- source_word: οἱ Ἰουδαῖοι
  choice: اليهود
  rationale: يحافظ على اللفظ الصريح في اليونانية، مع بيان التحديد السياقي المحتمل في الحاشية بدل إدخاله في المتن.
- source_word: ἔλυε τὸ σάββατον
  choice: ينقض السبت
  rationale: «ينقض» تعبير عربي طبيعي ودقيق لانتهاك حكم السبت أو إبطاله عمليًا، ويعرض سبب الاتهام دون زيادة تفسيرية.
- source_word: πατέρα ἴδιον ἔλεγε τὸν θεόν
  choice: يقول إن الله أبوه الخاص
  rationale: يحفظ فعل القول والتوكيد في ἴδιον، الذي يدل على نسبة أبوة الله إليه على نحو خاص.
- source_word: ἴσον ἑαυτὸν ποιῶν τῷ θεῷ
  choice: جاعلًا نفسه مساويًا لله
  rationale: ينقل تركيب الحال ومعنى المساواة صراحة، من غير تخفيف للقوة المسيحانية أو إضافة مصطلحات عقائدية لاحقة.
theological_decisions:
- issue: القوة المسيحانية لعبارة المساواة بالله
  choice: جاعلًا نفسه مساويًا لله
  alternative: مدّعيًا المساواة بالله
  rationale: الاختيار الأقرب إلى البنية اليونانية هو «جاعلًا نفسه»، وهو يبقي تقرير يوحنا ووجه استدلال المعارضين كما وردا دون تحويل العبارة إلى مجرد ادعاء قد يوحي ضمنًا بنفي صحتها.
- issue: مرجع عبارة «اليهود» في سياق إنجيل يوحنا
  choice: إبقاء «اليهود» في المتن مع حاشية سياقية
  alternative: قادة اليهود أو اليهودية
  rationale: النص اليوناني يقول οἱ Ἰουδαῖοι، وتضييق المرجع في المتن يتجاوز اللفظ؛ أما الحاشية فتمنع فهمه كتعميم على كل يهودي دون تمييز.
translation_notes:
  register: عربية فصحى حديثة، واضحة وموقرة. استُخدم «ينقض السبت» لصياغته الطبيعية في السياق الديني، وحُفظ التوكيد في «أبوه الخاص». وُضعت علامتا الحاشية [a] و[b] في المتن.
