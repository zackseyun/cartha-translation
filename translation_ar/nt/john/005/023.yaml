  naturalness: 'الصياغة فصحى حديثة واضحة ومألوفة: «لكي يكرم الجميعُ الابنَ كما يكرمون الآبَ. ومن لا يكرم الابنَ لا يكرم الآبَ الذي أرسله.» والانتقال من المفرد اللفظي في «يكرم الجميع» إلى الجمع في «يكرمون» جائز وطبيعي لأن «الجميع» يدل على جماعة الأشخاص.'
  terminology: «الابن» و«الآب» مصطلحان عربيان كتابيان مناسبان للسياق اليوحناوي، و«يكرم» مقابل دقيق ومتسق لـ τιμάω. لا تُدخل الترجمة تقريرًا عقائديًا زائدًا، لكنها تحفظ قوة المقارنة النصية بين إكرام الابن وإكرام الآب.
