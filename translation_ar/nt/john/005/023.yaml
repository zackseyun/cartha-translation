id: JHN.5.23
reference: John 5:23
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἵνα πάντες τιμῶσι τὸν υἱὸν καθὼς τιμῶσι τὸν πατέρα. ὁ μὴ τιμῶν τὸν υἱὸν οὐ τιμᾷ τὸν πατέρα τὸν πέμψαντα αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/023.yaml
  text: so that all may honor the Son just as they honor the Father. The one who does not honor the Son does not honor the Father who sent him.
translation:
  language: ar
  text: لكي يكرم الجميعُ الابنَ كما يكرمون الآبَ. ومن لا يكرم الابنَ لا يكرم الآبَ الذي أرسله.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: لكي
  rationale: تُدخل جملة الغاية، وتؤدي المعنى الغائي بوضوح وطبيعية في العربية المعاصرة.
- source_word: πάντες
  choice: الجميع
  rationale: تنقل شمول اللفظة اليونانية بإيجاز، وتأتي فاعلًا طبيعيًا مع الفعل «يكرم».
- source_word: τιμῶσι / τιμῶν / τιμᾷ
  choice: يكرم / يكرمون
  rationale: يحافظ الجذر «كرم» على معنى إظهار الإكرام والتوقير، كما يحفظ التكرار المقصود والتوازي في الآية.
- source_word: τὸν υἱὸν
  choice: الابن
  rationale: التعريف والسياق اليوحناويان يدلان على اللقب الشخصي للمسيح، وتؤدي العربية ذلك من غير حاجة إلى تمييز طباعي بالحروف الكبيرة.
- source_word: καθὼς
  choice: كما
  rationale: تنقل المقارنة المباشرة والقوية بين إكرام الابن وإكرام الآب من غير زيادة تفسيرية.
- source_word: τὸν πατέρα
  choice: الآب
  rationale: «الآب» هو المقابل العربي المتعارف عليه للقب الإلهي في هذا السياق، ويميّزه من الاستعمال الأسري العام لكلمة «الأب».
- source_word: ὁ μὴ τιμῶν
  choice: ومن لا يكرم
  rationale: 'صياغة عربية طبيعية للتركيب الاسمي العام، وتحفظ دلالته الشاملة: كل من لا يكرم.'
- source_word: τὸν πέμψαντα αὐτόν
  choice: الذي أرسله
  rationale: تجعل العبارة صلةً للآب كما في اليونانية، وتحافظ على ضمير المفعول العائد إلى الابن بدل استبداله باسم تفسيري.
- source_word: πέμψαντα
  choice: أرسل
  rationale: هو المعنى المباشر للفعل، ولا يضيف معنى تكليف رسمي قد تتضمنه ألفاظ مثل «أوفد» أو «كلّف».
theological_decisions:
- issue: قوة المقارنة بين إكرام الابن وإكرام الآب
  choice: «كما يكرمون الآب»
  alternative: «على نحو يشبه إكرامهم للآب»
  rationale: «كما» تحفظ المقابلة القوية التي تفيدها καθώς، من غير تضعيفها إلى مجرد تشابه، ومن غير إدخال مصطلحات عقائدية لاحقة في نص الآية.
- issue: تعيين «الابن» و«الآب» كلقبين شخصيين
  choice: «الابن» و«الآب»
  alternative: «الابن» و«الأب» بالمعنى الأسري العام
  rationale: السياق يعيّن يسوع والله الآب بوضوح. واختيار «الآب» يتبع الاستعمال العربي الكتابي الواضح من غير إضافة مضمون غير موجود في النص اليوناني.
- issue: مرجع الضمير في «أرسله»
  choice: الإبقاء على الضمير العائد إلى الابن
  alternative: «الآب الذي أرسل الابن»
  rationale: الضمير في الأصل اليوناني يعود إلى الابن، والسياق العربي يتيح فهمه؛ لذلك أُبقي حفاظًا على بنية النص وتجنبًا لاستبداله بتكرار تفسيري.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ومهيبة، تحافظ على التكرار البلاغي في «يكرم» وعلى التوازي بين الابن والآب. لا توجد حاجة إلى حاشية نصية أو تفسيرية في هذه الآية.
