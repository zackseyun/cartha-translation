  text: ἐκεῖνος ἦν ὁ λύχνος ὁ καιόμενος καὶ φαίνων, ὑμεῖς δὲ ἠθελήσατε ἀγαλλιαθῆναι πρὸς ὥραν ἐν τῷ φωτὶ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/035.yaml
  text: He was the lamp that was burning and shining[a], and you were willing to rejoice for a time in his light.
translation:
  language: ar
  text: كان هو السراج المتّقد المضيء، وأنتم أردتم أن تبتهجوا في نوره إلى حين.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مدةً قصيرة». يدل التعبير على زمن محدود، وليس بالضرورة ساعة حرفية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνος
  choice: كان هو
  rationale: يحفظ التوكيد الذي في اسم الإشارة اليوناني مع إحالة طبيعية في العربية إلى يوحنا المعمدان.
- source_word: λύχνος
  choice: السراج
  rationale: يدل على مصباح يحمل ضوءًا، لا على الضوء المجرّد؛ وبذلك يبقى التمييز بين يوحنا بوصفه سراجًا والمسيح بوصفه النور.
- source_word: καιόμενος
  choice: المتّقد
  rationale: ينقل حالة الاشتعال المستمرة وصفًا للسراج، ويقترن في العربية الفصيحة طبيعيًا بـ«المضيء».
- source_word: φαίνων
  choice: المضيء
  rationale: المعنى هنا إصدار الضوء لا مجرد الظهور.
- source_word: ἠθελήσατε
  choice: أردتم
  rationale: ينقل دلالة الإرادة والميل في الفعل دون أن يضيف معنى الاستمرار.
- source_word: ἀγαλλιαθῆναι
  choice: أن تبتهجوا
  rationale: يعبر عن الفرح الشديد بلغة عربية واضحة وكريمة.
- source_word: πρὸς ὥραν
  choice: إلى حين
  rationale: تعبير عربي طبيعي يدل على مدة محدودة، ولا يقصر المعنى على ساعة حرفية.
- source_word: ἐν τῷ φωτὶ αὐτοῦ
  choice: بنوره
  rationale: الباء طبيعية مع الابتهاج بسبب نور السراج أو في ضيائه، وتحفظ صلة الضمير بيوحنا دون إقحام تفسير إضافي.
theological_decisions:
- issue: التمييز المجازي بين يوحنا ويسوع في صور النور في إنجيل يوحنا
  choice: وُصف يوحنا بأنه «السراج» لا «النور».
  alternative: كان هو النور
  rationale: النص اليوناني يستعمل λύχνος لا φῶς، فيحفظ ليوحنا دور الشاهد المستمد ضياؤه ولا يساويه بالنور ذاته.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعمل «السراج» لدقته ووضوحه، و«إلى حين» لنقل محدودية المدة. وُضعت علامة الحاشية بعد العبارة التي تشرحها.
