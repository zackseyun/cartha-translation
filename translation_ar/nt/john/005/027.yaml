  yaml_path: translation/nt/john/005/027.yaml
  text: And he gave him authority to execute judgment[a], because he is the Son of Man.
translation:
  language: ar
  text: وأعطاه سلطانًا أن يُجري الدينونة، لأنه ابن الإنسان.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لأنه إنسان»، أي لأنه يشترك في الطبيعة البشرية. ويفهم المتن العبارة على الأرجح بوصفها لقبًا في إنجيل يوحنا.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξουσίαν
  choice: سلطانًا
  rationale: تدل الكلمة هنا على سلطة مخوَّلة وولاية شرعية، لا على مجرد القدرة؛ و«سلطان» ملائم للسياق القضائي ومألوف في العربية الكتابية الواضحة.
- source_word: ἔδωκεν
  choice: أعطاه
  rationale: ينقل الفعل الماضي البسيط مباشرة، مع ضم المفعول إليه αὐτῷ إلى الفعل على نحو عربي طبيعي.
- source_word: κρίσιν ποιεῖν
  choice: أن يُجري الدينونة
  rationale: التركيب اليوناني يعني حرفيًا فعل الدينونة، والمقصود ممارسة الحكم وتنفيذه؛ و«يُجري الدينونة» يحفظ الطابع القضائي من غير اختزاله إلى «يدين» فقط.
- source_word: ὅτι
  choice: لأنه
  rationale: تأتي ὅτι هنا سببية، فتبيّن علة منح السلطان.
- source_word: υἱὸς ἀνθρώπου
  choice: ابن الإنسان
  rationale: مع غياب أداة التعريف في اليونانية، يرجّح سياق يوحنا استعمال العبارة لقبًا معروفًا ليسوع، وله صدى دانيالي؛ والعربية تعبّر عن هذا اللقب طبيعيًا بالإضافة المعرفة «ابن الإنسان».
- source_word: ἐστίν
  choice: هو
  rationale: نُقلت الرابطة بصيغة الضمير في «لأنه ابن الإنسان»، وهي الصياغة العربية الطبيعية المقابلة للمعنى الاسمي في اليونانية.
theological_decisions:
- issue: هل تُفهم عبارة υἱὸς ἀνθρώπου لقبًا مسيانيًا أم وصفًا عامًا للإنسانية؟
  choice: إثبات اللقب «ابن الإنسان» في المتن.
  alternative: «لأنه ابن بشر»، أي لأنه يشترك في الطبيعة البشرية.
  rationale: استعمال العبارة في إنجيل يوحنا وسياق سلطان الدينونة يرجّحان اللقب المعروف وما يحمله من صدى دانيال 7. ومع ذلك، لا يُلغى الاحتمال النحوي الدال على البشرية، بل يُحفظ في الحاشية صونًا للغموض الحقيقي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «سلطان» و«الدينونة» للمحافظة على الدلالة القضائية والجرس الكتابي المألوف، مع تركيب عربي موجز وطبيعي.
