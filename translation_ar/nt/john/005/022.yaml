  text: οὐδὲ γὰρ ὁ πατὴρ κρίνει οὐδένα, ἀλλὰ τὴν κρίσιν πᾶσαν δέδωκεν τῷ υἱῷ,
base_translation:
  language: en
  yaml_path: translation/nt/john/005/022.yaml
  text: For the Father judges no one, but has given all judgment to the Son,
translation:
  language: ar
  text: لِأَنَّ الآبَ لا يَدِينُ أَحَدًا، بَلْ أَعْطَى الدَّيْنُونَةَ كُلَّهَا لِلابْنِ،
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδὲ γὰρ
  choice: لِأَنَّ ... لا
  rationale: تنقل «لأن» قوة γάρ التفسيرية التي تصل القول بسياقه السابق، بينما تؤدي «لا» مع «أحدًا» النفي الشامل الذي تعبّر عنه οὐδένα؛ ولا تستلزم العربية هنا ترجمة οὐδέ بأداة مستقلة.
- source_word: ὁ πατὴρ
  choice: الآب
  rationale: اللفظ في السياق اليوحناوي لقب لله في علاقته بالابن، و«الآب» هو المقابل العربي الواضح والمستقر لهذا اللقب.
- source_word: κρίνει
  choice: يَدِينُ
  rationale: الفعل هنا يقرر حقيقة عامة، و«يدين» يحافظ على معنى ممارسة القضاء والحكم دون حصره بالضرورة في مجرد إصدار حكم بالإدانة.
- source_word: οὐδένα
  choice: أحدًا
  rationale: مع النفي السابق تفيد «لا يدين أحدًا» النفي الشامل بصورة عربية طبيعية وواضحة.
- source_word: ἀλλὰ
  choice: بل
  rationale: «بل» تُظهر المقابلة القوية بين نفي الدينونة عن الآب وإعطاء الدينونة للابن، وهي أنسب بعد جملة منفية.
- source_word: τὴν κρίσιν πᾶσαν
  choice: الدَّيْنُونَةَ كُلَّهَا
  rationale: تحفظ «الدينونة» الاسم المصدري الدال على فعل القضاء ووظيفته، وتحفظ «كلها» شمول πᾶσαν من غير إضافة تفسيرية مثل «سلطان».
- source_word: δέδωκεν
  choice: أَعْطَى
  rationale: الماضي العربي يعبّر طبيعيًا عن فعل تمّ وتظل نتيجته قائمة في السياق؛ أما «قد أعطى» فممكنة لكنها أثقل هنا ولا يلزمها النص العربي لإفادة النتيجة المستمرة.
- source_word: τῷ υἱῷ
  choice: لِلابْنِ
  rationale: يحفظ أداة التعريف واللقب المسيحاني «الابن» دون إضافة ضمير ملكية غير موجود صراحة في اليونانية.
theological_decisions:
- issue: العلاقة بين دينونة الآب ودينونة الابن
  choice: 'إبقاء القول مباشرًا: الآب لا يدين أحدًا، بل أعطى الدينونة كلها للابن.'
  alternative: تقييد المعنى بعبارة «لا يدين أحدًا بمعزل عن الابن»، أو حصر الدينونة في الدينونة النهائية وحدها.
  rationale: لا يتضمن النص هذه القيود؛ لذلك تحفظ الصياغة التوتر اللاهوتي كما هو ولا تضيف توفيقًا تفسيريًا.
- issue: لقب «الابن» المسيحاني
  choice: الإبقاء على «الابن» بوصفه لقبًا معرفًا.
  alternative: ترجمته «ابنه».
  rationale: اليونانية تستعمل الاسم مع أداة التعريف من غير ضمير ملكية، واللقب مهم في سياق علاقة الآب بالابن في إنجيل يوحنا.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كتابية رصينة. استُعملت «الدينونة» للمحافظة على الصلة الدلالية بين κρίνει وκρίσιν، مع تجنب إضافة «سلطان» التي تفسر المعنى بدل أن تترجمه. لا توجد حواشٍ لازمة في هذه الآية.
