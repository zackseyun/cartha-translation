  source_fidelity: 'النص العربي ينقل عناصر اليونانية كلها بأمانة: «المريض» لـὁ ἀσθενῶν، و«يا سيد» نداء مناسب لـΚύριε في هذا السياق، و«متى تحرّك الماء» لـὅταν ταραχθῇ τὸ ὕδωρ، و«يضعني في البركة» لـβάλῃ με εἰς τὴν κολυμβήθραν، ثم معنى السبق في «ينزل غيري قبلي». ولا يضيف سببًا لتحرّك الماء غير موجود في نص SBLGNT.'
