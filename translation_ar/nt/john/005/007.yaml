  terminology: «البركة» مصطلح عربي مألوف للحوض في هذا السياق. واختيار «يا سيد» يحفظ الاحترام ودلالة Κύριε غير المحسومة هنا، ولا يفرض قراءة لاهوتية محددة. وهو اختلاف جائز عن أثر التدقيق الإنجليزي الذي اختار “Lord”، لأن اللفظ اليوناني قابل للنداء الاحترامي في هذا الموضع.
