source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτῷ ὁ ἀσθενῶν· Κύριε, ἄνθρωπον οὐκ ἔχω ἵνα ὅταν ταραχθῇ τὸ ὕδωρ βάλῃ με εἰς τὴν κολυμβήθραν· ἐν ᾧ δὲ ἔρχομαι ἐγὼ ἄλλος πρὸ ἐμοῦ καταβαίνει.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/007.yaml
  text: The sick man answered him, “Lord, I have no one to put me into the pool when the water is stirred up; but while I am coming, another goes down before me.”
translation:
  language: ar
  text: 'فأجابه المريض: «يا سيد، ليس لي أحد يضعني في البركة متى تحرّك الماء. وبينما أنا آتٍ، ينزل غيري قبلي».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἀσθενῶν
  choice: المريض
  rationale: تعبير عربي طبيعي ودقيق عن الشخص الذي كان يعاني المرض.
- source_word: Κύριε
  choice: يا سيد
  rationale: يحفظ صيغة المخاطبة المحترمة وما في اللفظ اليوناني من احتمال أن يكون نداءً بشريًا أو اعترافًا أرفع، من غير حسم السياق لاهوتيًا.
- source_word: κολυμβήθραν
  choice: البركة
  rationale: اللفظ المعتاد والواضح لحوض الماء المقصود في السياق.
- source_word: ταραχθῇ
  choice: تحرّك
  rationale: ينقل اضطراب الماء بعبارة عربية طبيعية من غير إضافة سبب غير مذكور في نص SBLGNT.
- source_word: βάλῃ με
  choice: يضعني
  rationale: ينقل معنى إدخال الرجل العاجز إلى البركة من غير إيحاء غير لازم بالعنف الذي قد تحمله كلمة «يلقيني».
- source_word: ἐν ᾧ δὲ ἔρχομαι ἐγώ
  choice: وبينما أنا آتٍ
  rationale: يحافظ على صورة محاولته الوصول بنفسه وعلى التزامن الذي تعبّر عنه العبارة اليونانية.
theological_decisions:
- issue: دلالة النداء Κύριε
  choice: يا سيد
  alternative: يا رب
  rationale: في هذا الموضع يمكن أن يكون اللفظ مجرد خطاب احترام قبل أن يعرف المريض هوية يسوع؛ لذلك اختيرت عبارة تحفظ الاحترام ولا تفرض اعترافًا لاهوتيًا، مع بقاء اللفظ اليوناني نفسه قابلًا لدلالة أرفع بحسب السياق الأوسع.
- issue: سبب تحرّك الماء
  choice: عدم ذكر السبب
  alternative: إضافة إشارة إلى ملاك يحرّك الماء
  rationale: الآية في SBLGNT تذكر تحرّك الماء فقط، فلا تُضاف إليها مادة تفسيرية أو نصية غير واردة في المصدر المعطى.
translation_notes:
  register: عربية فصحى حديثة، واضحة وكريمة النبرة. استُخدم «متى» للدلالة على الوقت المتكرر المتوقع، وحُفظ الانتقال المقابل في الجملة الثانية من غير تكلّف.
