  yaml_path: translation/nt/john/005/046.yaml
  text: For if you believed Moses[a], you would believe me[b], for he wrote about me.
translation:
  language: ar
  text: فلو كنتم تصدّقون موسى، لصدّقتموني، لأنه كتب عني.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ γὰρ
  choice: فلو
  rationale: تربط الفاء الكلام بالحجة السابقة، وتفيد «لو» شرطًا مخالفًا للواقع في هذا السياق.
- source_word: ἐπιστεύετε Μωϋσεῖ
  choice: كنتم تصدّقون موسى
  rationale: الفعل مع المجرور دلاليًا يشير إلى تصديق شخص؛ وصيغة الماضي المستمر ملائمة لبنية الشرط غير المتحقق، مع إبقاء الصلة اللفظية بالفعل نفسه في جواب الشرط.
- source_word: ἐπιστεύετε ἂν ἐμοί
  choice: لصدّقتموني أنا أيضًا
  rationale: الماضي مع ἄν يعبّر عن جواب شرط مخالف للواقع. و«تصدّقونني» أدق من «تؤمنون بي» لأن الأصل يستعمل المفعول غير المباشر لا تركيب εἰς، أما «أنا» فتبرز المقابلة بين موسى ويسوع، و«أيضًا» توضح العلاقة الاستدلالية من غير تغيير مضمونها.
- source_word: περὶ γὰρ ἐμοῦ
  choice: لأنه ... عني
  rationale: περί مع المضاف إليه تعني «عن» أو «بشأن»، و«عني» تعبير عربي طبيعي مباشر.
- source_word: ἐκεῖνος
  choice: هو
  rationale: اسم الإشارة اليوناني يعود على موسى بنبرة توكيدية؛ والضمير المنفصل «هو» يحفظ هذا التوكيد في العربية.
- source_word: ἔγραψεν
  choice: كتب
  rationale: الماضي البسيط ينقل صيغة الماضي اليونانية بوضوح وطبيعية.
theological_decisions:
- issue: طبيعة شهادة موسى ليسوع
  choice: لأنه هو كتب عني
  alternative: لأنه هو كتب بشأني
  rationale: تحفظ العبارة دعوى أن كتابات موسى تتناول يسوع، من غير تعيين نص بعينه أو توسيع الدعوى بتفسير عقائدي غير مصرّح به في اليونانية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. حوفظ على تكرار جذر «صدّق» في طرفي الشرط لأنه يقابل تكرار الفعل اليوناني، وعلى توكيد ἐκεῖνος باستعمال «هو».
