  text: καὶ οὐ θέλετε ἐλθεῖν πρός με ἵνα ζωὴν ἔχητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/040.yaml
  text: Yet you are not willing to come to me so that you may have life[a][b].
translation:
  language: ar
  text: لكنكم لا تريدون أن تأتوا إليَّ لكي تكون لكم حياة[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وأنتم لا تريدون أن تأتوا إليَّ لكي تكون لكم حياة». يمكن أن تُترجم أداة العطف اليونانية ببساطة إلى «و».'
    reason: lexical_alternative
  - marker: b
    text: غالبًا ما تحمل «الحياة» في إنجيل يوحنا معنى أوسع، هو الحياة الآتية من الله، أي الحياة الأبدية، مع أن كلمة «أبدية» غير مذكورة هنا.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ
  choice: لكنكم
  rationale: تفيد καί في هذا السياق مقابلةً لما سبق، فاختيرت «لكن» لإبراز الاستدراك بصورة طبيعية، مع بيان احتمال «و» في الحاشية.
- source_word: οὐ θέλετε
  choice: لا تريدون
  rationale: تنقل الإرادة أو الرغبة التي يدل عليها θέλω من غير تشديد المعنى إلى «ترفضون».
- source_word: ἐλθεῖν πρός με
  choice: أن تأتوا إليَّ
  rationale: يحافظ هذا التعبير على صورة المجيء إلى يسوع كما وردت، من غير تفسيرها في المتن بمعنى «تؤمنوا بي».
- source_word: ἵνα
  choice: لكي
  rationale: تعبّر «لكي» بوضوح عن الغرض الذي تقدمه ἵνα.
- source_word: ζωὴν
  choice: حياة
  rationale: ينقل اللفظ كما هو من غير إضافة صفة «أبدية» غير المذكورة صراحةً في اليونانية.
- source_word: ἔχητε
  choice: تكون لكم
  rationale: صياغة عربية طبيعية لمعنى امتلاك الحياة في تركيب الغاية، وتحافظ على دلالة الفعل ἔχω.
theological_decisions:
- issue: هل تُترجم ζωὴν إلى «حياة» أم «حياة أبدية»؟
  choice: حياة
  alternative: حياة أبدية
  rationale: تحمل «الحياة» في إنجيل يوحنا غالبًا معنى الحياة الآتية من الله، لكن صفة «أبدية» غير واردة في هذه الآية، لذلك تُحفظ الدلالة السياقية من غير إضافتها إلى المتن.
- issue: هل يُفسَّر «المجيء إليَّ» في المتن بمعنى الإيمان؟
  choice: أن تأتوا إليَّ
  alternative: أن تؤمنوا بي
  rationale: يرتبط المجيء إلى يسوع بالإيمان في إنجيل يوحنا، لكن النص يستعمل فعل المجيء؛ والإبقاء عليه يحفظ الصورة اليوحناوية ولا يستبدلها بتفسيرها.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُخدمت «لكنكم» لإظهار المقابلة السياقية، و«لكي تكون لكم حياة» لصياغة الغاية والامتلاك بأسلوب عربي طبيعي، مع الحفاظ على إيجاز الأصل وصورته.
