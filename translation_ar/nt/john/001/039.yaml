base_translation:
  language: en
  yaml_path: translation/nt/john/001/039.yaml
  text: He said to them[a], “Come, and you will see.” So they went and saw where he was staying, and they stayed with him that day. It was about the tenth hour.
translation:
  language: ar
  text: 'فقال لهما: «تعاليا فستريان». فأتيا ورأيا أين يقيم، ومكثا معه ذلك اليوم. وكانت الساعة نحو العاشرة.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي نحو الرابعة بعد الظهر إذا حُسبت الساعات من شروق الشمس؛ ويفهمها بعضهم بحسب الحساب الروماني بمعنى نحو العاشرة صباحًا.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: فقال لهما
  rationale: نُقل المضارع التاريخي بصيغة الماضي الملائمة للسرد العربي، والضمير المثنى مفهوم من سياق الرجلين المذكورين قبله.
- source_word: Ἔρχεσθε καὶ ὄψεσθε
  choice: تعاليا وانظرا
  rationale: 'يحافظ فعل الأمر للمثنى على الدعوة المباشرة، ويؤدي المستقبل اليوناني هنا بصيغة أمر عربية طبيعية في جواب الدعوة دون تغيير المقصود: المجيء سيتيح لهما أن يريا.'
- source_word: ἦλθαν οὖν καὶ εἶδαν
  choice: فذهبا ورأيا
  rationale: الفاء تنقل نتيجة الدعوة، و«ذهبا» طبيعية من منظور السرد، مع إبقاء الصدى اللفظي بين «انظرا» و«رأيا» قدر الإمكان.
- source_word: ποῦ μένει
  choice: أين يقيم
  rationale: يفيد μένω هنا موضع إقامة يسوع في ذلك الوقت، و«يقيم» فصيحة وطبيعية من غير افتراض أنه منزل دائم أو نُزُل.
- source_word: παρ’ αὐτῷ ἔμειναν
  choice: مكثا معه
  rationale: «معه» تنقل معنى المصاحبة في παρά مع المجرور، و«مكثا» تؤدي معنى البقاء مع تجنب تكرار «يقيم» على نحو ثقيل.
- source_word: τὴν ἡμέραν ἐκείνην
  choice: ذلك اليوم
  rationale: ترجمة مباشرة لا تضيف «بقية» أو «طوال»، وهما معنيان محتملان سياقيًا لكنهما غير مصرح بهما.
- source_word: ὥρα ἦν ὡς δεκάτη
  choice: وكانت الساعة نحو العاشرة
  rationale: تحافظ على التعبير العددي التقريبي في الأصل من غير حسم نظام حساب الساعات.
theological_decisions:
- issue: طريقة حساب «الساعة العاشرة»
  choice: إبقاء التعبير «الساعة نحو العاشرة» في المتن
  alternative: نحو الرابعة بعد الظهر بحسب الحساب من شروق الشمس، أو نحو العاشرة صباحًا بحسب الحساب الروماني
  rationale: لا يحدد النص نظام حساب الوقت؛ لذا يحفظ المتن الغموض الحقيقي، وتعرض الحاشية الاحتمالين الرئيسيين من غير فرض توفيق زمني.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت صيغ المثنى لأن المخاطبَين والرجلين الفاعلين اثنان في السياق المباشر. وُضعت علامة الحاشية بعد عبارة الوقت التي تشرحها.
