base_translation:
  language: en
  yaml_path: translation/nt/john/001/037.yaml
  text: And the two disciples heard him speaking[a], and they followed Jesus.
translation:
  language: ar
  text: وسمع تلميذاه الاثنان[a] ما كان يقوله، فتبعا يسوع.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي تلميذا يوحنا المعمدان.
    reason: توضيح مرجع ضمير الملكية بحسب السياق السابق.
lexical_decisions:
- source_word: ἤκουσαν
  choice: سمع
  rationale: يفيد الفعل هنا وقوع السماع في حدث ماضٍ، من غير أن يقتضي معنى الإصغاء المتواصل.
- source_word: οἱ δύο μαθηταὶ αὐτοῦ
  choice: تلميذاه الاثنان
  rationale: يحافظ على ضمير الملكية الوارد صراحةً في اليونانية وعلى تحديد العدد، ويعود الضمير بحسب السياق إلى يوحنا المعمدان.
- source_word: λαλοῦντος
  choice: ما كان يقوله
  rationale: ينقل اسم الفاعل المضارع بوصفه فعلاً متزامناً مع السماع، بصياغة عربية طبيعية تدل على الكلام الجاري آنذاك.
- source_word: ἠκολούθησαν
  choice: تبعا
  rationale: يحفظ المعنى المباشر، أي السير وراء يسوع، مع إبقاء الإيحاء السردي الأوسع باتباعه من غير حسم زائد.
- source_word: τῷ Ἰησοῦ
  choice: يسوع
  rationale: يتعدى فعل «تبع» إلى المفعول به مباشرةً في العربية، وهو المقابل الطبيعي لتركيب المجرور باليونانية مع ἀκολουθέω.
theological_decisions:
- issue: مرجع الضمير αὐτοῦ في «تلميذاه الاثنان»
  choice: يُفهم أنه يعود إلى يوحنا المعمدان
  alternative: إبقاء مرجع الضمير غير مصرّح به اعتماداً على السياق وحده
  rationale: يبين يوحنا 1:35-36 أن الرجلين كانا من تلاميذ يوحنا المعمدان، وأنهما سمعا كلامه ثم تبعا يسوع. أبقى المتن الضمير كما في الأصل، ووضحت الحاشية مرجعه السياقي منعاً للالتباس.
translation_notes:
  register: صياغة عربية فصحى حديثة، موجزة وكريمة النبرة. استُعمل المثنى في «تلميذاه» و«تبعا» حفاظاً على دقة العدد، وأُبقي فعل الاتباع قابلاً لمعناه الحركي المباشر وإيحائه التلمذي.
