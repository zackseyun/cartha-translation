  text: καὶ λέγει αὐτῷ· Ἀμὴν ἀμὴν λέγω ⸀ὑμῖν, ὄψεσθε τὸν οὐρανὸν ἀνεῳγότα καὶ τοὺς ἀγγέλους τοῦ θεοῦ ἀναβαίνοντας καὶ καταβαίνοντας ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/051.yaml
  text: And he said to him[a], “Truly, truly, I say to you[b], you will see heaven opened and the angels of God ascending and descending on the Son of Man.”
translation:
  language: ar
  text: 'ويقول له: «الحقَّ الحقَّ أقول لكم[a]: سترون السماء مفتوحة، وملائكة الله يصعدون وينزلون على ابن الإنسان[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ينتقل الكلام هنا من المفرد في «ويقول له» إلى الجمع في «أقول لكم» و«سترون» في النص اليوناني.
    reason: lexical_alternative
  - marker: b
    text: تُذكِّر هذه الصورة بحلم يعقوب في تكوين 28:12، لكنها تتمحور هنا حول ابن الإنسان.
    reason: cross_reference
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  choice: الحقَّ الحقَّ
  rationale: ينقل صيغة التوكيد المكررة بعبارة عربية واضحة ورصينة، ويحافظ على وقعها الاحتفالي من غير إبقاء اللفظ السامي منقولًا صوتيًا.
- source_word: ὑμῖν / ὄψεσθε
  choice: لكم / سترون
  rationale: صيغتا الجمع ظاهرتان في العربية، وبذلك يُحفظ انتقال الخطاب من نثنائيل المفرد إلى جماعة المخاطَبين.
- source_word: τὸν οὐρανὸν ἀνεῳγότα
  choice: السماء مفتوحة
  rationale: يعبر اسم المفعول عن حالة السماء بعد أن فُتحت، من غير إضافة معنى تفسيري مثل «مشرعة».
- source_word: ἀγγέλους
  choice: ملائكة
  rationale: السياق الرؤيوي والإضافة إلى الله يجعلان المقصود كائنات سماوية لا رسلًا بشريين.
- source_word: ἀναβαίνοντας καὶ καταβαίνοντας
  choice: يصعدون وينزلون
  rationale: يحفظ ترتيب الفعلين وصدى لغة تكوين 28، مع صياغة عربية طبيعية.
- source_word: ἐπὶ
  choice: على
  rationale: يحافظ على الصورة المكانية في اليونانية وعلى صلتها بابن الإنسان من غير شرح طبيعة هذه الصلة داخل المتن.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ابن الإنسان
  rationale: يحفظ لقب يسوع المعروف وأصداءه الكتابية، بدل استبداله بتعبير تفسيري.
theological_decisions:
- issue: انتقال المخاطَب من المفرد في «وقال له» إلى الجمع في «أقول لكم» و«سترون».
  choice: إظهار الجمع صراحة في المتن العربي والتنبيه إلى الانتقال في الحاشية.
  alternative: توحيد الخطاب بصيغة المفرد على أساس أن الكلام موجَّه إلى نثنائيل.
  rationale: النص اليوناني يميز عمدًا بين αὐτῷ المفرد وὑμῖν/ὄψεσθε الجمع، والعربية قادرة على إظهار هذا الفرق بوضوح.
- issue: صورة صعود ملائكة الله ونزولهم على ابن الإنسان وصلتها بحلم يعقوب.
  choice: إبقاء الصورة كما هي في المتن، وذكر صداها الكتابي في الحاشية.
  alternative: شرح ابن الإنسان في المتن بوصفه السلم أو موضع الاتصال بين السماء والأرض.
  rationale: الصدى مع تكوين 28 قوي، لكن تحديد مدلوله اللاهوتي تفصيلًا يتجاوز ما تصرح به الآية نفسها.
- issue: دلالة ἐπὶ في علاقة حركة الملائكة بابن الإنسان.
  choice: ترجمتها «على» مع إبقاء الصورة المكانية وتوترها التفسيري.
  alternative: ترجمتها «فوق» أو إعادة صياغتها «نحو ابن الإنسان ومن عنده».
  rationale: «على» هي المقابل الأقرب هنا، ولا تحسم وحدها كيفية تصور الصعود والنزول أو اتجاههما.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُخدم الجمع الصريح حيث يقتضيه اليوناني، وحُفظت الصورة الاستعارية واللقب «ابن الإنسان» من غير توسع تفسيري.
