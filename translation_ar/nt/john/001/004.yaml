  text: ἐν αὐτῷ ζωὴ ἦν, καὶ ἡ ζωὴ ἦν τὸ φῶς τῶν ἀνθρώπων·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/004.yaml
  text: In him was life[a], and the life was the light of men.
translation:
  language: ar
  text: فِيهِ كَانَتِ الْحَيَاةُ، وَكَانَتِ الْحَيَاةُ نُورَ الْبَشَرِ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ويجوز: «نور الناس» أو «نور الإنسانية». اللفظة اليونانية عامة وتشير إلى البشر جميعًا.'
    reason: بديل معجمي يوضح العموم المقصود في τῶν ἀνθρώπων.
lexical_decisions:
- source_word: ἐν αὐτῷ
  choice: فِيهِ
  rationale: تحافظ «فيه» على دلالة حرف الجر ἐν، ويعود الضمير المذكر إلى «الكلمة» في السياق السابق؛ وتستطيع العربية استعمال ضمير المذكر مع أن «الكلمة» مؤنثة نحويًا لأن المرجع معروض بوصفه شخصًا.
- source_word: ζωὴ
  choice: الْحَيَاةُ
  rationale: تنقل «الحياة» المعنى المباشر للفظة ζωή من غير تقييدها هنا بعبارة تفسيرية مثل «الحياة الأبدية»، وتدع السياق اليوحناوي يكشف غناها الدلالي.
- source_word: ἦν
  choice: كَانَتْ
  rationale: الفعل «كان» هو المقابل الطبيعي لصيغة الماضي الناقص من εἰμί، ويحافظ على بساطة العبارة واتساقها مع أسلوب المطلع.
- source_word: ἡ ζωὴ
  choice: الْحَيَاةُ
  rationale: أُبقي التعريف لأن العبارة تعود إلى الحياة المذكورة في الشطر الأول.
- source_word: τὸ φῶς
  choice: نُورَ
  rationale: «النور» هو المقابل الطبيعي للصورة اليوحناوية φῶς. وجاء منصوبًا خبرًا لـ«كان»، أما التعريف الدلالي فيُفهم من الإضافة إلى «البشر».
- source_word: τῶν ἀνθρώπων
  choice: الْبَشَرِ
  rationale: تؤدي «البشر» الإشارة العامة إلى جميع الناس في ἀνθρώπων، وتحافظ على صيغة الإضافة اليونانية من غير أن توحي باختصاص الذكور.
theological_decisions:
- issue: مرجع الضمير αὐτῷ وقوته الشخصية
  choice: «فيه»، بضمير مذكر شخصي يعود إلى الكلمة
  alternative: «فيها»، بمراعاة التأنيث النحوي لكلمة «الكلمة»، أو فهم المرجع فهمًا مجردًا
  rationale: يعرض السياق القريب «الكلمة» بسمات شخصية، لذلك يحفظ الضمير المذكر هذه القوة من غير إدخال صياغة عقائدية زائدة على الآية.
- issue: عموم لفظة ἀνθρώπων
  choice: «البشر» بمعنى الجنس البشري كله
  alternative: «الناس» أو «الإنسانية»
  rationale: اللفظة اليونانية جمع مذكر من جهة الصيغة، لكنها عامة المرجع هنا. و«البشر» واضحة وشاملة وتحفظ علاقة الإضافة في «نور البشر».
- issue: العلاقة بين الحياة والنور
  choice: 'الإبقاء على العبارة الخبرية المباشرة: «كانت الحياة نور البشر»'
  alternative: تفسيرها بعبارة مثل «كانت الحياة تنير البشر»
  rationale: النص يقرر هوية خبرية بين الحياة والنور، ولا ينبغي تحويل الصورة إلى فعل وظيفي يزيل توترها وغناها اللاهوتي.
translation_notes:
  register: صياغة عربية فصحى واضحة وموجزة ذات إيقاع مهيب يلائم مطلع الإنجيل. استُعملت «البشر» بدل «الرجال» لأن المرجع اليوناني عام، ووُضع رمز الحاشية بعد العبارة التي يشرحها.
