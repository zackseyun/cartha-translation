  text: οὗτος ἦλθεν εἰς μαρτυρίαν, ἵνα μαρτυρήσῃ περὶ τοῦ φωτός, ἵνα πάντες πιστεύσωσιν δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/007.yaml
  text: He came as a witness[a], so that he might testify about the Light[b], so that all might believe through him.
translation:
  language: ar
  text: جاء هذا للشهادة[a]، لكي يشهد بشأن النور، ولكي يؤمن الجميع بواسطته[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «جاء ليكون شاهدًا».'
    reason: lexical_alternative
  - marker: b
    text: أي بواسطة يوحنا وشهادته؛ ويرى بعضهم أن الضمير يعود إلى النور.
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτος
  choice: هذا
  rationale: اسم الإشارة يعود بتوكيد إلى يوحنا المذكور في الآية السابقة، ويحفظ قوة الإحالة في اليونانية من غير أن يضيف اسمًا غير موجود في النص.
- source_word: ἦλθεν
  choice: جاء
  rationale: ترجمة مباشرة وطبيعية للفعل، وتحفظ حركة السرد.
- source_word: εἰς μαρτυρίαν
  choice: للشهادة
  rationale: تحفظ الاسم المجرّد μαρτυρία والصلة اللفظية بالفعل اللاحق «يشهد»، كما تعبّر طبيعيًا عن الغرض من مجيئه.
- source_word: ἵνα μαρτυρήσῃ
  choice: لكي يشهد
  rationale: تحفظ دلالة الغرض في ἵνα والمعنى الشهادي للفعل μαρτυρέω.
- source_word: περὶ τοῦ φωτός
  choice: بشأن النور
  rationale: تنقل περί مع المضاف إليه بمعنى «عن/بشأن»، وتتجنب إيحاء «يشهد للنور» بأنه يدافع عنه فحسب.
- source_word: ἵνα πάντες πιστεύσωσιν
  choice: ولكي يؤمن الجميع
  rationale: تُبقي جملة الغرض الثانية مستقلة كما في اليونانية، وتنقل πάντες بلفظ شامل غير مقيّد.
- source_word: δι’ αὐτοῦ
  choice: بواسطته
  rationale: تنقل معنى الوسيلة في διά مع المضاف إليه، مع إبقاء الضمير كما هو وعدم استبداله بتفسير داخل المتن.
theological_decisions:
- issue: مرجع الضمير في δι’ αὐτοῦ
  choice: أُبقي الضمير «ـه» في المتن، مع ترجيح عوده إلى يوحنا في الحاشية
  alternative: قد يعود الضمير إلى النور
  rationale: يوحنا هو الفاعل والمحور النحوي الأقرب، وسياق الآيتين 7–8 يميّزه من النور، لذلك يُرجَّح أن الإيمان يحدث بواسطة شهادته؛ لكن صيغة اليونانية تسمح نحويًا بأن يُفهم الضمير على غير ذلك، فحُفظ الاحتمال في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. حُفظ التوازي بين عبارتي الغرض «لكي... ولكي...»، كما حُفظ الاشتقاق المتكرر بين «الشهادة» و«يشهد». لا تستعمل العربية تمييز الحروف الكبيرة، لذلك يظهر «النور» من دون علامة طباعية خاصة.
