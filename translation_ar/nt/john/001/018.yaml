    reason: lexical_alternative
  - marker: c
    text: 'أو: «أعلنه»، أو «كشف عنه»، أو «فسّره».'
    reason: lexical_alternative
lexical_decisions:
- source_word: θεὸν οὐδεὶς ἑώρακεν πώποτε
  choice: الله لم يره أحد قط
  rationale: صياغة عربية طبيعية تحافظ على النفي الشامل ومعنى πώποτε، وتقدّم المفعول به كما في اليونانية لإبرازه.
- source_word: μονογενὴς θεὸς
  choice: الإله الوحيد الفريد
  rationale: 'يتبع قراءة SBLGNT: θεός، ويعبّر «الوحيد الفريد» عن معنى التفرد والوحدانية في μονογενής من غير افتراض أن المعنى المعجمي هو «المولود».'
- source_word: ὁ ὢν
  choice: الكائن
  rationale: اسم فاعل معرف يوافق التركيب الوصفي اليوناني ويحافظ على دلالته المستمرة بإيجاز عربي فصيح.
- source_word: εἰς τὸν κόλπον τοῦ πατρὸς
  choice: في حضن الآب
  rationale: يحفظ الصورة الحرفية التي تعبّر عن القرب والحميمية، بدل استبدالها بتفسير مثل «إلى جانب الآب».
- source_word: ἐκεῖνος
  choice: هو الذي
  rationale: ينقل توكيد اسم الإشارة اليوناني ويزيل احتمال التباس الفاعل في الجملة العربية.
- source_word: ἐξηγήσατο
  choice: عرّف به
  rationale: ينقل في السياق معنى الإظهار والتعريف بالله بعبارة عربية موجزة وطبيعية، مع توثيق البدائل الممكنة في الحاشية.
theological_decisions:
- issue: القراءة النصية μονογενὴς θεὸς في مقابل ὁ μονογενὴς υἱός
  choice: الإله الوحيد الفريد
  alternative: الابن الوحيد، أو الابن الوحيد المولود
  rationale: يتبع المتن قراءة SBLGNT المطبوعة ولا يسوّي الخلاف النصي، بل يثبت القراءة المهمة البديلة في الحاشية.
- issue: دلالة μονογενής
  choice: الوحيد الفريد
  alternative: الوحيد المولود
  rationale: تعكس الصياغة معنى الوحيد من نوعه أو الفريد، من غير تحميل اللفظة وحدها مفهوم الولادة؛ وتُذكر الصياغة التقليدية ضمن حاشية الاختلاف النصي.
- issue: مرجع الضمير المستتر في ἐξηγήσατο
  choice: عرّف به، أي بالله المذكور أولًا
  alternative: أعلنه أو كشف عنه
  rationale: يحافظ على حركة العبارة من عدم رؤية الله إلى تعريف الإله الفريد به، من دون إضافة تفسير عقائدي زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة مهيبة. حُفظت صورة «حضن الآب» ودلالة التوكيد في ἐκεῖνος، ووُثقت القراءة النصية البديلة والبدائل المعجمية من غير حسم صامت للتوتر النصي أو اللاهوتي.
