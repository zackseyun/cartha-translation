  text: All things came into being through him[a], and apart from him not even one thing came into being that has come into being.
translation:
  language: ar
  text: جميعُ الأشياء جاءت إلى الوجود بواسطته، ومن دونه لم يأتِ إلى الوجود شيءٌ واحدٌ مما جاء إلى الوجود.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، مع وصل «ما جاء إلى الوجود» ببداية الآية 4: «ما جاء إلى الوجود فيه كان حياةً».'
    reason: قراءة بديلة ناشئة عن احتمال اختلاف موضع الفصل في النص اليوناني القديم.
lexical_decisions:
- source_word: πάντα
  choice: جميع الأشياء
  rationale: تفيد صيغة الجمع المحايد الشمول، وتحافظ «جميع الأشياء» على النطاق الكوني وعلى معنى التعدد بوضوح.
- source_word: δι’ αὐτοῦ
  choice: بواسطته
  rationale: تفيد διά مع المضاف إليه الوساطة أو الأداة؛ و«بواسطته» تبيّن أن كل الأشياء وجدت عن طريقه من غير أن تحسم ما يتجاوز دلالة العبارة.
- source_word: ἐγένετο
  choice: جاءت إلى الوجود
  rationale: يدل الفعل هنا على الدخول في الوجود، لا على مجرد الصنع؛ وهذه الصياغة تحفظ المعنى الوجودي وتلائم السياق.
- source_word: χωρὶς αὐτοῦ
  choice: من دونه
  rationale: تعبّر بدون تكلف عن الانفصال وغياب أي نشأة مستقلة عنه.
- source_word: οὐδὲ ἕν
  choice: ولا شيء واحد
  rationale: تحفظ الترجمة توكيد النفي في οὐδὲ مع المفرد المحايد ἕν، فتستبعد أي استثناء.
- source_word: ὃ γέγονεν
  choice: مما جاء إلى الوجود
  rationale: أُلحقت العبارة بالآية الثالثة وفق ترقيم النص المقدَّم، وصيغت على نحو يدل على كل ما تحقق وجوده، مع إبقاء القراءة البديلة في الحاشية.
theological_decisions:
- issue: تعلّق العبارة الختامية ὃ γέγονεν
  choice: 'إلحاقها بالآية الثالثة: «ولا شيء واحد مما جاء إلى الوجود»'
  alternative: 'بدء الآية الرابعة بها: «ما جاء إلى الوجود فيه كان حياةً»'
  rationale: لم تكن المخطوطات اليونانية الأولى منقوطة على نحو يحسم موضع الفصل، ولذلك يحتمل التركيب إلحاق العبارة بالآية الثالثة أو بدء الآية الرابعة بها. أُثبتت القراءة الأولى في المتن، وحُفظ الاحتمال الحقيقي الآخر في الحاشية من غير حسم لاهوتي زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة مهيبة. حوفظ على التكرار المقصود لعبارة «جاء إلى الوجود» لإبراز التوكيد والبنية المنطقية في الأصل، ووُضعت علامة الحاشية بعد العبارة المختلف في تعلّقها.
