  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Καὶ αὕτη ἐστὶν ἡ μαρτυρία τοῦ Ἰωάννου ὅτε ⸀ἀπέστειλαν οἱ Ἰουδαῖοι ἐξ Ἱεροσολύμων ἱερεῖς καὶ Λευίτας ἵνα ἐρωτήσωσιν αὐτόν· Σὺ τίς εἶ;
base_translation:
  language: en
  yaml_path: translation/nt/john/001/019.yaml
  text: And this is the testimony of John[a], when the Jews sent priests and Levites from Jerusalem to ask him, “Who are you?”
translation:
  language: ar
  text: 'وهذه هي شهادة يوحنا، حين أرسل اليهود[a] من أورشليم كهنةً ولاويين ليسألوه: «مَن أنت؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «قادة اليهود»، أو «أهل اليهودية». كثيرًا ما يُراد بعبارة «اليهود» في إنجيل يوحنا، على وجه الخصوص، السلطات الدينية في اليهودية، لا الشعب اليهودي كله.
    reason: بديل معجمي وتوضيح لنطاق المرجع في السياق اليوحناوي.
lexical_decisions:
- source_word: μαρτυρία
  choice: شهادة
  rationale: تنقل معنى الإفادة التي يقدمها يوحنا وتحافظ على الإيحاء القضائي المتكرر في إنجيل يوحنا.
- source_word: τοῦ Ἰωάννου
  choice: يوحنا
  rationale: 'الإضافة ذاتية المعنى: الشهادة الصادرة عن يوحنا، لا الشهادة عنه.'
- source_word: ὅτε
  choice: حين
  rationale: أداة زمنية طبيعية تصل الشهادة بالمناسبة التي أُدلي بها فيها.
- source_word: ἀπέστειλαν
  choice: أرسل
  rationale: مقابل عربي واضح ومباشر للفعل في هذا السياق السردي.
- source_word: οἱ Ἰουδαῖοι
  choice: اليهود
  rationale: يحافظ على التعبير اليوناني دون حسم نطاق مرجعه في المتن، مع إيضاح دلالته السياقية المحتملة في الحاشية.
- source_word: ἐξ Ἱεροσολύμων
  choice: من أورشليم
  rationale: صياغة عربية مألوفة تدل على مكان انطلاق المرسَلين، مع استعمال الاسم الكتابي الشائع للمدينة.
- source_word: ἱερεῖς καὶ Λευίτας
  choice: كهنةً ولاويين
  rationale: يحافظ على تمييز النص بين الفئتين المرتبطتين بخدمة الهيكل.
- source_word: ἵνα ἐρωτήσωσιν αὐτόν
  choice: ليسألوه
  rationale: صيغة موجزة وطبيعية تؤدي معنى الغرض الذي تفيده ἵνα.
- source_word: Σὺ τίς εἶ;
  choice: مَن أنت؟
  rationale: المقابل العربي الطبيعي للسؤال، ويظهر فيه ضمير المخاطب صراحةً كما في اليونانية.
theological_decisions:
- issue: مرجع οἱ Ἰουδαῖοι في إنجيل يوحنا
  choice: إبقاء «اليهود» في المتن مع حاشية توضيحية
  alternative: «قادة اليهود» أو «أهل اليهودية»
  rationale: يحافظ هذا على الصياغة الأصلية وعلى قدر من الغموض المرجعي، بينما يمنع فهم العبارة على أنها تعميم على الشعب اليهودي كله؛ فإرسال الكهنة واللاويين من أورشليم يرجح أن السلطات الدينية اليهودية مقصودة بوجه خاص.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. حوفظ على ترتيب الجملة وتدفقها قدر الإمكان، واستُعملت «حين» لصلة طبيعية، مع إبقاء المصطلحات الكتابية المألوفة «أورشليم» و«لاويين».
