base_translation:
  language: en
  yaml_path: translation/nt/john/001/038.yaml
  text: Then Jesus turned and[a], seeing them following, said to them, “What are you seeking?” They said to him, “Rabbi” (which translated means Teacher)[c][b], “where are you staying?”
translation:
  language: ar
  text: 'فالتفت يسوع ورآهما يتبعانه، فقال لهما: «ماذا تطلبان؟»[a] فقالا له: «رابي» (أي: «يا معلّم»)، أين تقيم؟[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «عمّ تبحثان؟» يمكن أن يدل الفعل اليوناني على البحث العادي، لكن «تطلبان» تُبقي أيضًا احتمال المعنى الأعمق في رواية يوحنا.'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «أين تمكث؟» الفعل اليوناني نفسه يُترجم في مواضع أخرى من إنجيل يوحنا بـ«يمكث» أو «يثبت».'
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς
  choice: التفت
  rationale: ينقل فعل الالتفات السابق للكلام بصورة عربية طبيعية، من غير زيادة تحديد لاتجاه الحركة.
- source_word: θεασάμενος
  choice: رآهما
  rationale: يؤدي معنى الإدراك البصري المقصود في السياق بإيجاز، مع استعمال ضمير المثنى الموافق للتلميذين المذكورين في السياق.
- source_word: ἀκολουθοῦντας
  choice: يتبعانه
  rationale: يحفظ دلالة الفعل المستمر، ويتيح بقاء المعنى بين الاتباع الحرفي وبداية اتباع التلميذ لمعلمه.
- source_word: Τί ζητεῖτε;
  choice: ماذا تطلبان؟
  rationale: الفعل ζητέω يدل على الطلب أو البحث؛ و«تطلبان» عربية طبيعية وتحفظ احتمال العمق الدلالي في رواية يوحنا.
- source_word: Ῥαββί
  choice: رَبِّي
  rationale: نُقل اللقب السامي صوتيًا بدل استبداله، لأن النص نفسه يورد تفسيره مباشرة.
- source_word: μεθερμηνευόμενον Διδάσκαλε
  choice: 'أي عند الترجمة: «يا معلّم»'
  rationale: يحفظ وظيفة الملاحظة التفسيرية التي يشرح بها الكاتب اللقب السامي لقرائه، وتؤدي «يا معلّم» صيغة النداء في Διδάσκαλε.
- source_word: ποῦ μένεις;
  choice: أين تقيم؟
  rationale: هذا هو المعنى المكاني الطبيعي في السؤال عن موضع إقامة يسوع، مع التنبيه في الحاشية إلى الصلة اللفظية بفعل المكث ذي الأهمية في إنجيل يوحنا.
theological_decisions:
- issue: دلالة μένω في أول موضع يوحناوي لفعل يكتسب لاحقًا وزنًا لاهوتيًا
  choice: أين تقيم؟
  alternative: أين تمكث؟
  rationale: السياق المباشر سؤال عملي عن موضع إقامة يسوع. تحافظ «تقيم» على وضوح المعنى هنا، بينما تذكر الحاشية امتداد الفعل الدلالي من غير فرض معاني مواضع لاحقة على هذا السؤال.
- issue: احتمال المعنى المزدوج في ζητέω
  choice: ماذا تطلبان؟
  alternative: عمّ تبحثان؟
  rationale: «تطلبان» تسع السؤال العادي عن الغرض وتبقي في الوقت نفسه احتمال الطلب الأعمق الذي ينسجم مع أسلوب يوحنا، من غير حسمه تفسيرياً.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ووقورة. استُعمل المثنى لأن المخاطَبين هما التلميذان في السياق. حُفظ اللقب السامي مع تفسير الكاتب له، وبقيت إمكانات الدلالة اليوحناوية في ζητέω وμένω ظاهرة من غير إثقال المتن أو حسم الغموض.
