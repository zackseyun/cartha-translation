  text: Καὶ ὁ λόγος σὰρξ ἐγένετο καὶ ἐσκήνωσεν ἐν ἡμῖν, καὶ ἐθεασάμεθα τὴν δόξαν αὐτοῦ, δόξαν ὡς μονογενοῦς παρὰ πατρός, πλήρης χάριτος καὶ ἀληθείας·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/014.yaml
  text: And the Word became flesh and dwelt among us[a], and we saw his glory, glory as of the one and only Son from the Father[b], full of grace and truth.
translation:
  language: ar
  text: وصار الكلمة جسدًا، وسكن بيننا[a]، ورأينا مجده، مجدًا كمجد الابن الوحيد الآتي من عند الآب[b]، وهو مملوء بالنعمة والحق.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «نصب مسكنه بيننا»؛ فالفعل اليوناني يستحضر صورة الخيمة أو المسكن.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «الابن المولود الوحيد»؛ ويمكن أيضًا: «الابن الفريد». لا تذكر اليونانية لفظ «ابن» صراحةً في هذه العبارة، لكن السياق يدل عليه.'
    reason: alternative_reading
lexical_decisions:
- source_word: λόγος
  choice: الكلمة
  rationale: يحفظ اللقب اليوحناوي الراسخ والغني بسياقه، من غير اختزاله في «الرسالة» أو «العقل».
- source_word: σὰρξ
  choice: جسدًا
  rationale: ينقل المعنى الحرفي القوي، أي الدخول في الوجود البشري الجسدي الحقيقي، بدل تحويله إلى تعبير تجريدي مثل «الطبيعة البشرية».
- source_word: ἐγένετο
  choice: صار
  rationale: تعبير عربي طبيعي يحفظ معنى التحول الذي تفيده الصيغة اليونانية في هذا السياق.
- source_word: ἐσκήνωσεν ἐν ἡμῖν
  choice: سكن بيننا
  rationale: صياغة واضحة وطبيعية، مع حفظ صورة نصب الخيمة أو المسكن في الحاشية.
- source_word: ἐθεασάμεθα
  choice: رأينا
  rationale: ينقل المشاهدة المباشرة بلغة عربية ميسرة، من دون اللجوء إلى ألفاظ أقدم مثل «عاينا».
- source_word: δόξαν
  choice: مجده / مجدًا
  rationale: «المجد» هو المقابل الكتابي الطبيعي الذي يحفظ الثقل الدلالي واللاهوتي للكلمة.
- source_word: ὡς
  choice: كما
  rationale: يحفظ الصيغة المقارِنة في اليونانية من غير أن يحولها إلى مجرد تشبيه ينفي الحقيقة.
- source_word: μονογενοῦς
  choice: وحيدٍ
  rationale: يحفظ التركيب اليوناني الموجز وغموضه النسبي هنا، إذ لا ترد كلمة «ابن» صراحة في هذه العبارة، ويعبّر عن التفرد دون أن يحسم دلالة الاشتقاق لصالح «المولود الوحيد».
- source_word: παρὰ πατρός
  choice: من عند الآب
  rationale: «من عند» تنقل معنى المصدر والحضور القريب الذي قد تفيده παρά، و«الآب» ملائم لهوية المرجع في سياق المطلع.
- source_word: πλήρης χάριτος καὶ ἀληθείας
  choice: مملوءًا نعمةً وحقًّا
  rationale: صياغة عربية طبيعية تحافظ على الوصف الاسمي للكلمة/الوحيد وعلى الاقتران الكتابي بين النعمة والحق.
theological_decisions:
- issue: دلالة μονογενοῦς وغياب كلمة «ابن» الصريحة في اليونانية
  choice: وحيدٍ
  alternative: الابن الوحيد؛ المولود الوحيد؛ الفريد
  rationale: يبقي المتن قريبًا من اليونانية ويحفظ دلالة التفرد من غير إضافة «ابن» في المتن أو حسم الجدل الاشتقاقي. تبيّن الحاشية القراءات التفسيرية المألوفة.
- issue: إبراز صورة المسكن في ἐσκήνωσεν
  choice: سكن بيننا
  alternative: نصب مسكنه بيننا؛ خيّم بيننا
  rationale: يقدّم المتن عبارة عربية واضحة، بينما تحفظ الحاشية صدى الخيمة/المسكن وما قد يستدعيه من حضور الله وسط شعبه.
- issue: مرجع πλήρης من الناحية النحوية
  choice: مملوءًا
  alternative: مملوءٌ
  rationale: جاءت الصياغة منصوبة لتتبع «وحيدًا» في العربية وتصفه وصفًا متصلًا، مع بقاء المرجع في السياق هو الكلمة المتجسد؛ ولا تُنشئ ترجمة عربية منفصلة خلافًا لاهوتيًا غير موجود في النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُخدمت «الكلمة» و«الآب» و«المجد» و«النعمة والحق» لما لها من رسوخ ودقة في السياق اليوحناوي، مع تجنب الألفاظ العتيقة حيث لا تدعو الحاجة.
