  text: And the light shines in the darkness[a], and the darkness has not overcome it.
translation:
  language: ar
  text: والنور يضيء في الظلمة، والظلمة لم تغلبه.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «والظلمة لم تدركه» أو «لم تمسك به». يحتمل الفعل اليوناني معنى الغلبة، ومعنى الإمساك أو الفهم.'
    reason: alternative_reading
lexical_decisions:
- source_word: φῶς
  choice: النور
  rationale: حُفظت أداة التعريف للدلالة الموضوعية المحددة على النور في سياق فاتحة يوحنا.
- source_word: σκοτίᾳ / σκοτία
  choice: الظلمة
  rationale: حُفظ التعريف في الموضعين، مع إبقاء التقابل الموضوعي بين النور والظلمة.
- source_word: φαίνει
  choice: يضيء
  rationale: صيغة المضارع تنقل الفعل الجاري والمستمر طبيعيًا في العربية، من غير مبالغة في تحميل الجانب الصرفي.
- source_word: κατέλαβεν
  choice: لم تغلبه
  rationale: للفعل معاني الأخذ والإدراك والغلبة؛ وتناسب «تغلبه» صورة الصراع بين النور والظلمة، مع حفظ المعنى الإدراكي البديل في الحاشية.
- source_word: αὐτὸ
  choice: ـه في «تغلبه»
  rationale: الضمير اليوناني محايد عائد إلى «النور»؛ ويأتي ضمير الغائب المذكر في العربية موافقًا لجنس «النور» النحوي، من غير أن يحسم وحده الإحالة الشخصية الأوسع في السياق.
theological_decisions:
- issue: دلالة κατέλαβεν في تقابل النور والظلمة
  choice: لم تغلبه
  alternative: لم تدركه أو لم تمسك به
  rationale: يحتمل اليوناني معنى عدائيًا، أي الغلبة أو الاستيلاء، ومعنى إدراكيًا، أي الفهم أو الإمساك بالمعنى. يرجّح التصوير المباشر للنور والظلمة معنى الغلبة في المتن، بينما تحفظ الحاشية التعدد الدلالي الحقيقي.
