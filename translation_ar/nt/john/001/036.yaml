  yaml_path: translation/nt/john/001/036.yaml
  text: And looking at Jesus as he was walking, he says, “Look, the Lamb of God!”
translation:
  language: ar
  text: 'وإذ نظر إلى يسوع وهو يمشي، قال: «انظر، هذا هو حمل الله!»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβλέψας
  choice: نظر إلى
  rationale: ينقل معنى النظر المقصود أو المتأمل إلى شخص، بصياغة عربية طبيعية من غير مبالغة تفسيرية.
- source_word: περιπατοῦντι
  choice: وهو يمشي
  rationale: حالٌ تصف يسوع وقت نظر يوحنا إليه، وهي أقرب صياغة عربية واضحة للبنية اليونانية.
- source_word: λέγει
  choice: فقال
  rationale: المضارع السردي اليوناني يُنقل طبيعيًا في السرد العربي بالماضي، مع الفاء لربط القول بالنظر.
- source_word: Ἴδε
  choice: انظروا! هذا هو
  rationale: «انظروا» تحفظ قوة لفت الانتباه، وإضافة «هذا هو» توضح الإشارة في العربية من غير تغيير هوية المشار إليه.
- source_word: ὁ ἀμνὸς τοῦ θεοῦ
  choice: حمل الله
  rationale: ترجمة مباشرة تحفظ الصورة اللاهوتية والإضافة اليونانية من غير تفسير معنى العلاقة.
theological_decisions:
- issue: دلالة عبارة «حمل الله»
  choice: 'الإبقاء على الصورة كما هي: «حمل الله»'
  alternative: تفسيرها داخل المتن مثل «الحمل الذي يقدمه الله» أو «الحمل التابع لله»
  rationale: الإضافة τοῦ θεοῦ تحتمل ثراءً دلاليًا، والآية نفسها لا تحدد هنا نوع العلاقة؛ لذلك لا ينبغي حسمها تفسيريًا.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم خطاب الجمع في «انظروا» لأن يوحنا يتحدث إلى التلميذين المذكورين في السياق السابق، مع بقاء العبارة مباشرة وحيوية.
