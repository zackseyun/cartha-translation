  yaml_path: translation/nt/john/001/042.yaml
  text: He brought him to Jesus[a]. Looking at him, Jesus said, “You are Simon, the son of John[b]; you will be called Cephas” (which is translated Peter).
translation:
  language: ar
  text: 'فأحضره إلى يسوع. فنظر إليه يسوع وقال: «أنت سمعان بن يوحنا[a]. ستُدعى كيفا[b]» (أي بطرس).'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ بعض المخطوطات: «يونان» بدلًا من «يوحنا»؛ أما نص SBLGNT فيقرأ: «يوحنا».'
    reason: textual_variant
  - marker: b
    text: «كيفا» اسم آرامي يقابله في اليونانية «بطرس»، ويحمل معنى «صخرة» أو «حجر».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγαγεν αὐτὸν πρὸς τὸν Ἰησοῦν
  choice: فجاء به إلى يسوع
  rationale: ينقل الفعل الماضي معنى إحضار الشخص إلى يسوع بعبارة عربية طبيعية، وتفيد «إلى» اتجاه الحركة نحو شخص.
- source_word: ἐμβλέψας αὐτῷ
  choice: فحدَّق إليه
  rationale: الفعل يدل على نظر متفحّص أو ثابت، و«حدَّق إليه» تحافظ على هذه القوة أكثر من «نظر إليه» من غير إطالة.
- source_word: Σὺ εἶ Σίμων
  choice: أنت سمعان
  rationale: يحافظ الضمير المنفصل على المباشرة والتوكيد الموجودين في الضمير اليوناني الصريح.
- source_word: ὁ υἱὸς Ἰωάννου
  choice: بن يوحنا
  rationale: تتبع الترجمة قراءة SBLGNT «Ἰωάννου»، أي يوحنا، مع إثبات القراءة النصية البديلة في الحاشية.
- source_word: κληθήσῃ
  choice: ستُدعى
  rationale: تنقل صيغة المستقبل المبني للمجهول بوضوح وتحافظ على دلالة إطلاق الاسم.
- source_word: Κηφᾶς
  choice: كيفا
  rationale: نُقل الاسم السامي صوتيًا بصيغته العربية المألوفة بدل ترجمة معناه داخل المتن.
- source_word: ὃ ἑρμηνεύεται Πέτρος
  choice: أي بطرس
  rationale: تؤدي العبارة وظيفة الشرح التي يؤديها النص اليوناني، مع إبقاء «بطرس» اسمًا منقولًا لا ترجمةً إلى «صخرة».
theological_decisions:
- issue: شرح العلاقة بين «كيفا» و«بطرس»
  choice: 'إبقاء الاسمين في المتن: «كيفا» و«بطرس»'
  alternative: ترجمة معنى الاسم في المتن إلى «صخرة» أو «حجر»
  rationale: السياق سياق تسمية، والنص نفسه يقابل الاسم السامي بالاسم اليوناني. لذلك يُحفظ الاسمان بوصفهما علمين، ويُذكر معناهما اللغوي في الحاشية دون استنتاج دلالة لاهوتية لاحقة.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعمل «سمعان» و«يوحنا» و«كيفا» و«بطرس» وفق الصيغ العربية الكتابية الشائعة، وحُفظ الاعتراض التفسيري بإيجاز طبيعي.
