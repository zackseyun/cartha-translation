base_translation:
  language: en
  yaml_path: translation/nt/john/001/010.yaml
  text: He was in the world[a], and the world came into being through him[b], and the world did not know him.
translation:
  language: ar
  text: كان في العالم، وبواسطته أتى العالم إلى الوجود[a]، ولم يعرفه العالم.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «صار العالم بواسطته» أو «خُلق العالم بواسطته». الفعل اليوناني يعني هنا أن العالم أتى إلى الوجود.'
    reason: lexical_alternative
  - marker: b
    text: قد تحمل عبارة «لم يعرفه» أيضًا معنى «لم يتعرّف إليه» أو «لم يُقِرّ به».
    reason: lexical_alternative
lexical_decisions:
- source_word: κόσμῳ / κόσμος
  choice: العالم
  rationale: تتكرر اللفظة ثلاث مرات، و«العالم» يحافظ على هذا التكرار وعلى اتساع الدلالة بين الخليقة والبشر من غير حسم تفسيري زائد.
- source_word: ἦν
  choice: كان
  rationale: ينقل فعل الكينونة في صيغة الماضي الناقص ببساطة، ويفيد وجوده المستمر في العالم من غير إضافة فلسفية.
- source_word: δι’ αὐτοῦ
  choice: به
  rationale: ينقل معنى الواسطة أو الوسيلة الذي تؤديه διά مع المضاف إليه، وهو تعبير عربي طبيعي في سياق إيجاد العالم.
- source_word: ἐγένετο
  choice: وُجد
  rationale: هنا بمعنى أتى إلى الوجود؛ و«وُجد» يميز إيجاد العالم من فعل الكينونة السابق «كان»، من غير إدخال فاعل غير مصرّح به في العبارة.
- source_word: ἔγνω
  choice: لم يعرفه
  rationale: يحافظ على المعنى الأساسي للفعل وعلى عمقه اليوحناوي، مع إمكان تضمّنه عدم التعرّف إليه أو عدم الإقرار به.
- source_word: αὐτόν / αὐτοῦ
  choice: ـه / به
  rationale: تحافظ الضمائر المذكرة على الإحالة الشخصية إلى الكلمة في السياق السابق.
theological_decisions:
- issue: مرجع الفاعل المستتر في «كان»
  choice: استُعمل ضمير مستتر مذكر مفهوم من السياق، عائد إلى الكلمة.
  alternative: التصريح بقول «هو كان» أو إعادة «الكلمة».
  rationale: اليونانية لا تذكر اسم الفاعل في هذه الآية، والسياق السابق يعيّن مرجعه الشخصي؛ أما العربية فتسمح بإبقائه مستترًا من غير إبهام مصطنع.
- issue: لغة الخلق وعلاقتها بالكلمة
  choice: «كان» للكلمة في مقابل «وُجد» للعالم.
  alternative: «صُنع العالم به».
  rationale: يحافظ هذا على المقابلة المقصودة بين ἦν وἐγένετο، أي بين كينونة الكلمة ومجيء العالم إلى الوجود، من غير إضافة مصطلحات عقائدية لاحقة.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة ذات نبرة كتابية رصينة. حُفظ تكرار «العالم» في المواضع الثلاثة، ووُضعت علامتا الحاشية في المتن عند العبارتين اللتين لهما بدائل دلالية.
