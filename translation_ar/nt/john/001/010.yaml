  rationale: استُبدلت «وبه وُجد العالم» بـ«وبواسطته أتى العالم إلى الوجود» لتقديم المقابل العربي الأوضح لـδι’ αὐτοῦ ἐγένετο، ولإبراز التباين النصي بين كينونة الكلمة السابقة («كان») ومجيء العالم إلى الوجود. كما صُحح موضع مرساة الحاشية [b] لتشير إلى العبارة التي تفسرها. ولم يُضف النص تفسيرًا مذهبيًا أو يحسم دلالة «العالم» الضمنية.
