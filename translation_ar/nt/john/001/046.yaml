  text: καὶ εἶπεν αὐτῷ Ναθαναήλ· Ἐκ Ναζαρὲτ δύναταί τι ἀγαθὸν εἶναι; λέγει αὐτῷ ⸀ὁ Φίλιππος· Ἔρχου καὶ ἴδε.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/046.yaml
  text: And Nathanael said to him[a], “Can anything good come from Nazareth?” Philip said to him, “Come and see.”
translation:
  language: ar
  text: 'فقال له نثنائيل: «أيمكن أن يكون من الناصرة شيء صالح؟» فقال له فيلبس: «تعال وانظر».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ εἶπεν αὐτῷ Ναθαναήλ
  choice: فقال له نثنائيل
  rationale: الفاء ملائمة لوصل الجواب بسياقه المباشر في السرد العربي، و«قال له» تؤدي فعل القول مع المفعول غير المباشر بوضوح.
- source_word: Ἐκ Ναζαρὲτ
  choice: من الناصرة
  rationale: حرف الجر ἐκ يدل على المصدر أو المنشأ، و«من الناصرة» يحفظ هذا المعنى بصياغة عربية طبيعية.
- source_word: δύναταί τι ἀγαθὸν εἶναι
  choice: أيمكن أن يكون ... شيء صالح؟
  rationale: تحفظ الصياغة معنى الإمكان في δύναται والمعنى الحرفي النسبي لـ εἶναι «يكون»، من غير تحويله تفسيريًا إلى «يخرج» أو «يأتي».
- source_word: λέγει αὐτῷ ὁ Φίλιππος
  choice: فقال له فيلبس
  rationale: صيغ المضارع التاريخي اليوناني بالماضي العربي الطبيعي في سياق السرد، مع إبقاء المخاطَب صريحًا.
- source_word: Ἔρχου καὶ ἴδε
  choice: تعال وانظر
  rationale: دعوة مباشرة تحفظ فعلي الأمر، وتبقي دلالة الرؤية الحرفية والموضوعية في إنجيل يوحنا.
theological_decisions:
- issue: نبرة سؤال نثنائيل عن الناصرة
  choice: سؤال استنكاري مباشر من غير إضافة ألفاظ تدل صراحة على السخرية أو الاحتقار
  alternative: هل يمكن أن يأتي من الناصرة شيء صالح؟
  rationale: يفيد السياق شك نثنائيل، لكن اليونانية لا تصرح بسخرية أو احتقار؛ لذلك تُحفظ قوة السؤال من غير تضخيم نبرته.
- issue: دلالة εἶναι مع ἐκ Ναζαρὲτ
  choice: أن يكون من الناصرة
  alternative: أن يأتي من الناصرة
  rationale: تبقي هذه الصياغة الاحتمال الدلالي الحرفي للفعل «يكون» وعلاقة المنشأ، بدل حسمه بفعل حركة غير وارد صراحة في الأصل.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة، بصياغة سردية طبيعية وأسماء معرّبة وفق الاستعمال الكتابي الشائع. لا حاجة إلى حاشية لأن المتن يحفظ القراءة الأقرب إلى تركيب الأصل نفسه.
