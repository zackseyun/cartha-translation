source:
  edition: SBLGNT
  text: λέγει αὐτῷ Ναθαναήλ· Πόθεν με γινώσκεις; ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Πρὸ τοῦ σε Φίλιππον φωνῆσαι ὄντα ὑπὸ τὴν συκῆν εἶδόν σε.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/048.yaml
  text: Nathanael said to him[a], “How do you know me?” Jesus answered and said to him, “Before Philip called you, while you were under the fig tree, I saw you.”
translation:
  language: ar
  text: 'قال له نثنائيل: «مِن أين تعرفني؟»[a] أجابه يسوع وقال له: «قبل أن يناديك فيلبس، رأيتك وأنت تحت شجرة التين».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كيف تعرفني؟»'
    reason: 'بديل اصطلاحي عربي يبرز أن السؤال قد يُفهم على أنه عن كيفية المعرفة أو أساسها، في حين أن الأصل يقول حرفيًا: «مِن أين تعرفني؟».'
lexical_decisions:
- source_word: Πόθεν με γινώσκεις
  choice: مِن أين تعرفني؟
  rationale: يحافظ على الصورة الاستفهامية الأصلية في Πόθεν («من أين») مع تعبير عربي فصيح مفهوم يسأل عن مصدر معرفة يسوع بنثنائيل، من غير تفسير زائد.
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ
  choice: أجابه يسوع وقال له
  rationale: ينقل الفعلين الواردين في اليونانية ويحافظ على أسلوب السرد اليوحناوي، مع بقاء العبارة طبيعية في العربية.
- source_word: Πρὸ τοῦ σε Φίλιππον φωνῆσαι
  choice: قبل أن يناديك فيلبس
  rationale: ينقل دلالة السبق الزمني في Πρὸ τοῦ مع المصدر، ويؤدي φωνέω بمعنى النداء الملائم للسياق.
- source_word: ὄντα ὑπὸ τὴν συκῆν
  choice: وأنت تحت شجرة التين
  rationale: يؤدي اسم الفاعل الدال على الحال بصياغة عربية طبيعية، ويحافظ على ظرف وجود نثنائيل حين رآه يسوع.
- source_word: εἶδόν σε
  choice: رأيتك
  rationale: ترجمة مباشرة للماضي اليوناني؛ أما علاقة السبق فقد أوضحتها بالفعل عبارة «قبل أن».
- source_word: συκῆν
  choice: شجرة التين
  rationale: تسمية عربية واضحة وطبيعية للشجرة المقصودة، بدل الاكتفاء بلفظ قد يُفهم على أنه الثمرة.
theological_decisions:
- issue: طبيعة معرفة يسوع السابقة بنثنائيل
  choice: إبقاء قول يسوع مباشرًا من غير بيان كيفية رؤيته أو معرفته
  alternative: التصريح بأنها معرفة خارقة أو نبوية، أو حملها على مجرد مشاهدة عادية سابقة
  rationale: لا تشرح الآية نفسها آلية الرؤية أو المعرفة؛ لذلك تحافظ الترجمة على التوتر الدلالي واللاهوتي وتترك تحديده للسياق.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «مِن أين تعرفني؟» حفاظًا على صيغة الأصل، ووُضع البديل الاصطلاحي «كيف تعرفني؟» في الحاشية. وُضع مؤشر الحاشية بعد السؤال الذي تتعلق به مباشرة.
