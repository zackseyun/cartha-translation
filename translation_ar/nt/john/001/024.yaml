lexical_decisions:
- source_word: Καὶ
  choice: و
  rationale: أداة ربط عادية تحافظ على تسلسل السرد من غير إضافة دلالة زمنية أو تفسيرية.
- source_word: ἀπεσταλμένοι ἦσαν
  choice: كانوا قد أُرسلوا
  rationale: تعكس الصيغة المحيطية، المؤلفة من اسم المفعول التام مع الفعل «كان»، إرسالًا تمّ قبل هذه اللحظة وظل أثره قائمًا، وهي صياغة عربية طبيعية.
- source_word: ἐκ
  choice: من عند
  rationale: تحافظ على دلالة المصدر أو الجهة التي خرج منها المرسلون، من غير أن تحوّلها صراحةً إلى دلالة الفاعل المباشر.
- source_word: τῶν Φαρισαίων
  choice: الفريسيين
  rationale: النقل العربي المألوف لاسم هذه الجماعة، مع أداة التعريف.
theological_decisions:
- issue: صلة المرسلين بالفريسيين
  choice: أُرسل الرجال من عند الفريسيين، مع إبراز مصدر الوفد أو الجهة التي صدر عنها.
  alternative: أرسلهم الفريسيون، مع إبراز الفريسيين بوصفهم الفاعل المباشر.
  rationale: تستعمل اليونانية ἐκ مع المضاف إليه، وهي تدل مباشرةً على المصدر أو المنشأ أكثر من دلالتها على الفاعل؛ لذلك تُبقي الصياغة العربية هذا الفرق ولا تمنع أن يفهم السياق أنهم كُلّفوا من الفريسيين.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُعمل المبني للمجهول مع «من عند» للمحافظة على ترتيب العبارة اليونانية ودلالة المصدر، ووُضعت علامة الحاشية في المتن.
