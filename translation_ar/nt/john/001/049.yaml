  text: ἀπεκρίθη ⸂αὐτῷ Ναθαναήλ⸃· Ῥαββί, σὺ εἶ ὁ υἱὸς τοῦ θεοῦ, σὺ ⸂βασιλεὺς εἶ⸃ τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/049.yaml
  text: Nathanael answered him, “Rabbi, you are the Son of God; you are the King of Israel.”
translation:
  language: ar
  text: 'أجابه نثنائيل: «يا رابي، أنت ابن الله، أنت ملك إسرائيل».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: أجابه
  rationale: صياغة سردية عربية طبيعية تنقل فعل الإجابة، مع إظهار المفعول به الذي يدل عليه αὐτῷ.
- source_word: Ναθαναήλ
  choice: نثنائيل
  rationale: نقل الاسم بصيغته العربية الكتابية المألوفة.
- source_word: Ῥαββί
  choice: يا رَبِّي
  rationale: نقل للقب اليهودي بصورته العربية المعرّبة المألوفة، مع أداة النداء لتوضيح أنه خطاب مباشر؛ ويحافظ على سياقه الثقافي بدل استبداله بتفسير «يا معلّم».
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: ابن الله
  rationale: يحفظ اللقب المعرّف وقوته المسيانية والمسيحانية دون توسيع أو تخفيف.
- source_word: βασιλεὺς
  choice: ملك
  rationale: المقابل المعجمي المباشر، وهو معرّف بالإضافة في «ملك إسرائيل» بما يلائم دلالة المسند اليوناني المحددة سياقيًا.
- source_word: τοῦ Ἰσραήλ
  choice: إسرائيل
  rationale: الإضافة العربية «ملك إسرائيل» تقابل تركيب المضاف إليه اليوناني وتحفظ الصيغة اللقبية دون تحويلها إلى «ملك على إسرائيل».
- source_word: σὺ εἶ … σὺ … εἶ
  choice: أنت … أنت …
  rationale: تكرار ضمير الفصل/الخطاب يحفظ التوكيد والتوازي الاعترافي في اليونانية، مع حذف فعل الكينونة في الجملة الاسمية وفق العربية الفصيحة الطبيعية.
theological_decisions:
- issue: القوة المسيحانية والمسيانية للاعتراف «ابن الله»
  choice: 'إبقاء اللقب كما ورد: «ابن الله»'
  alternative: «ابنٌ لله» أو صياغة تفسيرية موسعة
  rationale: التركيب اليوناني معرف ويحمل في سياق يوحنا دلالة لقبية قوية؛ تحفظ الترجمة ذلك دون إدخال صياغة عقائدية لاحقة أو جعله نكرة.
- issue: الدلالة الملكية المسيانية لعبارة «ملك إسرائيل»
  choice: «ملك إسرائيل»
  alternative: «الملك على إسرائيل» أو «ملك بني إسرائيل»
  rationale: تحفظ الإضافة العربية صورة اللقب الملكي كما في الأصل، من غير زيادة حرف جر تفسيري أو استبدال الاسم القومي الوارد في النص.
translation_notes:
  register: لغة عربية فصحى حديثة واضحة وموقرة. حُفظ التوازي المؤكد بتكرار «أنت»، واستُعملت الجملة الاسمية الطبيعية في العربية. لا توجد حواشٍ لازمة لهذا العدد.
