  source_fidelity: 'النص العربي يحافظ على عناصر اليونانية كلها: المقابلة الاستدراكية، وتلقّي المسيح، ومنح الحق، والتحول إلى أولاد الله، والعبارة التفسيرية الخاصة بالذين يؤمنون باسمه. وترتيب «أي الذين يؤمنون باسمه» يعكس بصورة مناسبة العبارة الوصفية الختامية في الأصل دون دمج التعبيرين.'
