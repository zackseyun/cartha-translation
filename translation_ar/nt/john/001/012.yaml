id: JHN.1.12
reference: John 1:12
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὅσοι δὲ ἔλαβον αὐτόν, ἔδωκεν αὐτοῖς ἐξουσίαν τέκνα θεοῦ γενέσθαι, τοῖς πιστεύουσιν εἰς τὸ ὄνομα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/john/001/012.yaml
  text: But to all who received him[a], he gave them the right to become children of God—to those who believe in his name,
translation:
  language: ar
  text: أَمَّا كُلُّ الَّذِينَ قَبِلُوهُ، فَأَعْطَاهُمْ حَقَّ[a] أَنْ يَصِيرُوا أَوْلَادَ اللهِ—أَيِ الَّذِينَ يُؤْمِنُونَ بِاسْمِهِ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «سلطانًا» أو «قدرةً» على أن يصيروا أولاد الله؛ فاللفظ اليوناني قد يدل على سلطان ممنوح، أو حق، أو أهلية وقدرة.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσοι
  choice: كُلُّ الَّذِينَ
  rationale: تعبير جمعي يشمل جميع مَن ينطبق عليهم الوصف، وهو طبيعي وواضح في العربية المعاصرة.
- source_word: δὲ
  choice: أَمَّا ... فَـ
  rationale: يُظهر المقابلة مع رفضه المذكور في السياق السابق، ويؤدي معنى الاستدراك بأسلوب عربي فصيح طبيعي.
- source_word: ἔλαβον αὐτόν
  choice: قَبِلُوهُ
  rationale: المقصود تلقّيه والترحيب به، لا أخذه ماديًّا؛ و«قبلوه» موجزة وتحفظ المعنى السياقي.
- source_word: ἔδωκεν
  choice: أَعْطَاهُمْ
  rationale: مقابل مباشر للفعل اليوناني، بينما يحمل المفعول «حقّ» دلالة المنح والتفويض.
- source_word: ἐξουσίαν
  choice: حَقَّ
  rationale: يدل اللفظ هنا على حق أو صلاحية ممنوحة، لا على قوة مجردة؛ وأُثبتت البدائل الدلالية في الحاشية.
- source_word: τέκνα θεοῦ
  choice: أَوْلَادَ اللهِ
  rationale: τέκνα لفظ شامل للذكور والإناث، بخلاف لفظ «بنين» أو «أبناء» إذا فُهم على تخصيص الذكور.
- source_word: γενέσθαι
  choice: أَنْ يَصِيرُوا
  rationale: يحفظ معنى الانتقال إلى حال جديدة الذي يفيده الفعل، بدل الاكتفاء بمعنى الكينونة.
- source_word: τοῖς πιστεύουσιν
  choice: الَّذِينَ يُؤْمِنُونَ
  rationale: يحافظ على صيغة الإيمان الفعلية وعلى وصف هؤلاء بأنهم متصفون بالإيمان.
- source_word: εἰς τὸ ὄνομα αὐτοῦ
  choice: بِاسْمِهِ
  rationale: تعبير عربي طبيعي عن توجيه الإيمان إلى اسمه، مع إبقاء «الاسم» وعدم اختزاله إلى الضمير وحده.
theological_decisions:
- issue: العلاقة بين «قبلوه» و«يؤمنون باسمه»
  choice: إبقاء التعبيرين، مع عرض الثاني بيانًا لهوية المذكورين أولًا.
  alternative: دمج التعبيرين في عبارة واحدة باعتبارهما مترادفين تمامًا.
  rationale: النص اليوناني يثبت التعبيرين، والثاني يحدد مَن هم الذين قبلوه دون أن يلغي التعبير الأول؛ والشرطة مع «أي» تُظهر علاقة البيان بوضوح.
- issue: دلالة البنوة في τέκνα θεοῦ
  choice: أولاد الله
  alternative: أبناء الله أو بنو الله
  rationale: اللفظ اليوناني τέκνα شامل وليس خاصًّا بالذكور، لذا يحافظ «أولاد» على هذا الاتساع دون استيراد تخصيص غير موجود في الأصل.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم تركيب «أمّا... فـ» لإبراز المقابلة، ووُضعت الحاشية بعد «حق» لأنها تتعلق باللفظ المترجم عن ἐξουσίαν.
