  terminology: يُحافَظ على «البرية» و«الرب» بوصفهما مصطلحين مناسبين للاقتباس النبوي ولسياق الإنجيل. «اجعلوا طريق الرب مستقيمًا» يعبّر بوضوح عن εὐθύνατε من غير إضافة تفسيرية.
