base_translation:
  language: en
  yaml_path: translation/nt/john/001/023.yaml
  text: He said[a], “I am a voice of one crying out in the wilderness, ‘Make straight the way of the Lord,’ just as Isaiah the prophet said.”
translation:
  language: ar
  text: 'قال: «أنا صوتُ مَن يصرخ في البرية[a]: ‹اجعلوا طريقَ الرب مستقيمًا›، كما قال إشعياء النبي».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن، من حيث التركيب اليوناني، أن تتعلّق عبارة «في البرية» بـ«صوت»، فيكون المعنى: «أنا صوتٌ في البرية، صوتُ مَن يصرخ». لكن القراءة الأرجح والأكثر طبيعية تجعلها تصف مَن يصرخ.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔφη
  choice: قال
  rationale: فعل قول سردي مألوف يلائم سياق الحوار، ولا يحتاج في العربية إلى إظهار الضمير لأن الفاعل مفهوم من السياق.
- source_word: Ἐγὼ
  choice: أنا
  rationale: يحافظ على ضمير المتكلم الصريح في اليونانية وعلى نبرة التعريف بالنفس.
- source_word: φωνὴ βοῶντος
  choice: صوتُ صارخٍ
  rationale: ينقل تركيب الإضافة وإيحاء النداء القوي بإيجاز عربي طبيعي، من غير تحويل الصورة إلى مجرد «منادٍ».
- source_word: ἐν τῇ ἐρήμῳ
  choice: في البرية
  rationale: «البرية» تعبير عربي واضح ومناسب للمكان غير المأهول، ويحفظ صدى الاقتباس النبوي.
- source_word: Εὐθύνατε
  choice: قَوِّموا
  rationale: أمر مباشر يفيد جعل الطريق مستقيمًا، ويحافظ على الصورة الحسية والمجازية في الاقتباس.
- source_word: τὴν ὁδὸν
  choice: طريقَ
  rationale: «طريق» هي المقابلة الطبيعية التي تحفظ المعنى الحرفي والمجازي معًا.
- source_word: κυρίου
  choice: الرب
  rationale: ينقل اللقب اللاهوتي في اقتباس إشعياء ويحفظ ثقله العهدي، بدل إضعافه بلفظ مثل «السيد».
- source_word: καθὼς εἶπεν Ἠσαΐας ὁ προφήτης
  choice: كما قال إشعياء النبي
  rationale: صياغة عربية طبيعية قريبة من ترتيب اليونانية وتبيّن مطابقة تعريف يوحنا لقول النبي.
theological_decisions:
- issue: دلالة κυρίου في اقتباس إشعياء
  choice: الرب
  alternative: السيد
  rationale: «الرب» يحفظ الصدى الإلهي والعهدي لنص إشعياء ولا يحسم بأكثر مما يقوله السياق كيفية انطباق الاقتباس في إنجيل يوحنا.
- issue: تعلّق عبارة «في البرية»
  choice: صوتُ صارخٍ في البرية
  alternative: صوتٌ في البرية لصارخٍ
  rationale: القراءة المختارة هي الأيسر نحويًا وسياقيًا، إذ تجعل الصارخ هو الموجود في البرية، مع إبقاء الاحتمال التركيبي الآخر في الحاشية بدل إلغائه.
translation_notes:
  register: فصحى معاصرة واضحة ذات نبرة كتابية رصينة. استُعمل «صارخ» للمحافظة على قوة βοῶντος، و«قَوِّموا» للمحافظة على صورة جعل الطريق مستقيمًا. وُضع رمز الحاشية بعد فعل القول لبيان أن الحاشية تتعلق ببنية العبارة المقتبسة كلها.
