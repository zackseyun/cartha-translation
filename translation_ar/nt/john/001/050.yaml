base_translation:
  language: en
  yaml_path: translation/nt/john/001/050.yaml
  text: Jesus answered and said to him[a], “Because I told you that I saw you under the fig tree, do you believe? You will see greater things than these.”
translation:
  language: ar
  text: 'أجاب يسوع وقال له: «ألأنّي قلت لك إنّي رأيتك تحت شجرة التين تؤمن؟ سترى أعظم من هذه.»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ
  choice: أجاب يسوع وقال له
  rationale: يحافظ على الصيغة السردية اليونانية المزدوجة بصياغة عربية واضحة ومألوفة.
- source_word: Ὅτι εἶπόν σοι ὅτι
  choice: ألأنّي قلت لك إنّي
  rationale: تؤدي ὅτι الأولى سببية في سؤال، والثانية مفسِّرة لمضمون القول. وإدخال همزة الاستفهام على «لأنّي» يوضح البنية العربية من غير حسم النبرة بوصفها توبيخًا.
- source_word: εἶδόν σε ὑποκάτω τῆς συκῆς
  choice: رأيتك تحت شجرة التين
  rationale: ترجمة مباشرة وطبيعية تحفظ الصورة المكانية المحددة؛ و«شجرة التين» أوضح للقارئ المعاصر من الاقتصار على «التينة».
- source_word: πιστεύεις
  choice: تؤمن؟
  rationale: يحفظ المضارع وصيغة السؤال المقتضبة، ولا يضيف مفعولًا أو يحدد مضمون الإيمان بما ليس مصرحًا به هنا.
- source_word: μείζω τούτων ὄψῃ
  choice: سترى أعظم من هذه
  rationale: يحفظ المقارنة والجمع المحايد قدر ما تسمح به العربية، مع إبقاء «أعظم» مستعملًا استعمال الاسم كما في الأصل بدل إضافة اسم تفسيري مثل «أمور».
theological_decisions:
- issue: قوة السؤال πιστεύεις; وعلاقة السبب بالإيمان
  choice: «ألأنّي قلت لك ... تؤمن؟» بوصفه سؤالًا بلاغيًا حقيقيًا
  alternative: '«لأنّي قلت لك ... تؤمن؟» أو قراءته تقريرًا: «أنت تؤمن لأنّي قلت لك...»'
  rationale: صياغة الاستفهام توافق السياق وعلامة الاستفهام في النص المحرر، مع إبقاء إمكان التعجب أو التنبيه اللطيف من غير تحويل العبارة صراحةً إلى توبيخ أو تقرير.
- issue: مرجع الجمع في μείζω τούτων
  choice: «أعظم من هذه»
  alternative: «أمورًا أعظم من هذا»
  rationale: يحافظ على صيغة الجمع في τούτων وعلى عدم تصريح اليونانية باسم «أمور»، فلا يضيّق المرجع أو يحوله إلى مفرد.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. استُعملت «ألأنّي» لضغط البنية الاستفهامية السببية على نحو قريب من اليونانية، وحُفظت صيغة «أجاب ... وقال» لأنها سمة سردية ظاهرة في الأصل.
