base_translation:
  language: en
  yaml_path: translation/nt/john/001/021.yaml
  text: And they asked him[a], “What then? Are you Elijah?” And he says, “I am not.” “Are you the Prophet?” And he answered[b], “No.”
translation:
  language: ar
  text: 'فسألوه: «فماذا إذن؟ أأنت إيليا؟» فقال[b]: «لستُ». «أأنت النبي[a]؟» فأجاب: «لا».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ذلك النبي»، ويُرجَّح أن المقصود النبي المنتظر الذي يكون مثل موسى (تثنية 18: 15، 18).'
    reason: alternative_reading
  - marker: b
    text: 'الفعل في اليونانية بصيغة المضارع التاريخي، وحرفيًا: «فيقول»، وهو أسلوب سردي يضفي حيوية على الرواية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠρώτησαν
  choice: فسألوه
  rationale: صيغة الماضي هنا تسرد سؤالًا مباشرًا ببساطة، و«سألوه» هي المقابل العربي الطبيعي من غير إضافة معنى الاستجواب أو الإلحاح.
- source_word: Τί οὖν;
  choice: فماذا إذن؟
  rationale: تحفظ العبارة إيجاز الأصل ووظيفته بوصفها انتقالًا منطقيًا إلى سؤال تالٍ، وتؤدي «فـ» معنى الربط الذي يحمله οὖν في السياق.
- source_word: σὺ Ἠλίας εἶ
  choice: أأنت إيليا؟
  rationale: همزة الاستفهام مع الضمير المنفصل تنقل السؤال المباشر وبروز الضمير σὺ، و«إيليا» هي الصيغة العربية المألوفة للاسم.
- source_word: Οὐκ εἰμί
  choice: لستُ
  rationale: يحافظ هذا الجواب على قِصر العبارة اليونانية ونفيها المباشر، من غير إضافة «هو» التي لا ترد صراحة في الأصل.
- source_word: Ὁ προφήτης
  choice: النبي
  rationale: أل التعريف تنقل أداة التعريف اليونانية وتشير إلى شخصية منتظرة معروفة في السياق، من غير أن تحسم هويتها داخل المتن.
- source_word: λέγει
  choice: فقال
  rationale: الفعل اليوناني مضارع تاريخي، لكن الماضي هو الأسلوب السردي الطبيعي الواضح في العربية؛ وتوضح الحاشية صيغة الأصل.
- source_word: ἀπεκρίθη
  choice: فأجاب
  rationale: مقابل عربي مباشر وطبيعي لفعل الجواب في السرد.
- source_word: Οὔ
  choice: لا
  rationale: تنقل أداة النفي المستقلة جوابًا سلبيًا مباشرًا ومقتضبًا.
theological_decisions:
- issue: هوية «النبي»
  choice: إبقاء اللقب «النبي» من غير شرح تفسيري في المتن.
  alternative: «ذلك النبي» أو التصريح بأنه النبي المنتظر مثل موسى في تثنية 18.
  rationale: أداة التعريف تدل على شخصية محددة معروفة لدى السائلين، لكن النص لا يسمّيها صراحة؛ لذلك يحافظ المتن على الإشارة والتوتر التفسيري، وتعرض الحاشية الاحتمال الأرجح.
- issue: إنكار يوحنا أنه إيليا
  choice: 'نقل جوابه مباشرة: «لستُ».'
  alternative: تقييد الجواب بمعنى «لست إيليا حرفيًا» أو التوفيق الصريح بينه وبين نصوص أخرى.
  rationale: النص يورد إنكار يوحنا بلا قيد، فلا ينبغي إدخال توفيق لاهوتي أو تفسير من خارج الآية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة، مع الحفاظ على تتابع الأسئلة والأجوبة وقِصر إنكاري يوحنا. وُضعت علامة الحاشية [a] عند «النبي» لأنها تخص هويته، وعلامة [b] عند «فقال» لأنها تخص المضارع التاريخي في λέγει.
