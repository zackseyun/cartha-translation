  yaml_path: translation/nt/john/001/002.yaml
  text: He was in the beginning with God[a].
translation:
  language: ar
  text: كان هو في البدء مع الله[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «هذا كان في البدء مع الله».'
    reason: بديل معجمي يحافظ على الصيغة الإشارية الحرفية للاسم οὗτος.
lexical_decisions:
- source_word: οὗτος
  choice: هو
  rationale: اسم الإشارة اليوناني يعني حرفيًا «هذا»، لكنه هنا يعود إلى «الكلمة» المذكور في الآية السابقة. استُعمل الضمير «هو» لأنه طبيعي في العربية ويحافظ على الإحالة الشخصية، مع إثبات البديل الحرفي في الحاشية.
- source_word: ἦν
  choice: كان
  rationale: صيغة الماضي الناقص من فعل الكينونة تدل هنا على حالة مستمرة في الزمن الماضي؛ و«كان» هي المقابل العربي الطبيعي من غير إضافة معنى «وُجد» أو «خُلق».
- source_word: ἐν ἀρχῇ
  choice: في البدء
  rationale: تحافظ العبارة على الصدى الواضح لتكوين 1:1 وعلى الاتساق مع يوحنا 1:1، بخلاف «في البداية» الأقل احتفاظًا بالرنين الأدبي.
- source_word: πρὸς
  choice: مع
  rationale: يفيد الحرف هنا الحضور والعلاقة والتمايز؛ و«مع» تؤدي ذلك بإيجاز وطبيعية، من غير الإفراط في تفسيره بـ«نحو» أو «في حضرة».
- source_word: τὸν θεόν
  choice: الله
  rationale: أداة التعريف اليونانية تحدد المرجع، واسم الجلالة «الله» هو التعبير العربي الاصطلاحي الدقيق والطبيعي.
theological_decisions:
- issue: مرجع οὗτος وصلته بيوحنا 1:1
  choice: إرجاعه إلى «الكلمة» بصيغة الضمير الشخصي «هو».
  alternative: ترجمته حرفيًا باسم الإشارة «هذا».
  rationale: الآية تلخّص ما سبق عن «الكلمة» وتؤكد وجوده في البدء وعلاقته بالله. يحافظ «هو» على المرجع الشخصي من غير إدخال توصيف عقائدي زائد، بينما تُذكر الصيغة الحرفية الممكنة في الحاشية.
- issue: دلالة πρὸς τὸν θεόν
  choice: «مع الله» بما يفيد العلاقة والحضور مع بقاء التمايز.
  alternative: «نحو الله» أو «في حضرة الله».
  rationale: تحفظ «مع الله» التوتر اللاهوتي في السياق بين الصلة الوثيقة والتمايز، من غير تحديد ماهية هذه العلاقة بمقولات ميتافيزيقية غير مصرّح بها في النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. اختير «في البدء» لصداها الكتابي المعروف، وجاء «كان هو» لإبراز الإحالة إلى «الكلمة» مع بقاء التركيب طبيعيًا وموجزًا.
