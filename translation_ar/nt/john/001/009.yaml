  yaml_path: translation/nt/john/001/009.yaml
  text: The true light[a], which enlightens every person, was coming into the world.
translation:
  language: ar
  text: كان النور الحقيقي[a]، الذي ينير كل إنسان، آتيًا إلى العالم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كان النور الحقيقي، الذي ينير كل إنسان آتيًا إلى العالم». ويجوز في اليونانية أن تتعلّق عبارة «آتيًا إلى العالم» بـ«كل إنسان» بدلًا من «النور الحقيقي».'
    reason: alternative_reading
lexical_decisions:
- source_word: φῶς
  choice: النور
  rationale: استُعمل الاسم العربي المألوف «النور» مع أداة التعريف، محافظًا على الصورة المحورية في سياق يوحنا من غير إضافة تفسير عقائدي إلى اللفظ نفسه.
- source_word: ἀληθινόν
  choice: الحقيقي
  rationale: ينقل معنى ما هو حق وأصيل وكامل التحقق، لا مجرد ما هو صادق في مقابل الكذب.
- source_word: φωτίζει
  choice: ينير
  rationale: فعل عربي طبيعي يحفظ صورة إعطاء النور، ويصلح للمعنى الحرفي والمجازي في السياق.
- source_word: πάντα ἄνθρωπον
  choice: كل إنسان
  rationale: ينقل المفرد العام الشامل في اليونانية بعبارة عربية معاصرة طبيعية تشمل البشر جميعًا.
- source_word: ἐρχόμενον εἰς τὸν κόσμον
  choice: آتيًا إلى العالم
  rationale: يحفظ صورة المجيء إلى العالم، ويربط النعت في النص الرئيس بـ«النور الحقيقي» بحسب سياق مقدمة الإنجيل، مع إثبات الوجه النحوي الآخر في الحاشية.
- source_word: κόσμον
  choice: العالم
  rationale: هو المقابل المعتاد لـκόσμος في يوحنا، ولا يقتضي السياق هنا معنى أضيق.
- source_word: ἦν
  choice: كان
  rationale: ينقل الفعل الناقص في الزمن الماضي، ويأتلف مع «آتيًا» لتكوين العبارة العربية «كان ... آتيًا».
theological_decisions:
- issue: تعلّق اسم الفاعل ἐρχόμενον («الآتي» أو «الآتي إلى العالم»)
  choice: 'تعلّقه من حيث المعنى بـ«النور الحقيقي»: «كان النور الحقيقي ... آتيًا إلى العالم»'
  alternative: 'تعلّقه بـ«كل إنسان»: «ينير كل إنسان آتٍ إلى العالم»'
  rationale: صيغة اسم الفاعل اليونانية يمكن نحويًا أن تصف «إنسان»، لكن سياق مقدمة يوحنا واستعمال عبارة المجيء إلى العالم يرجّحان الإشارة إلى مجيء النور. أُبقي الوجه الآخر في الحاشية صونًا للغموض الحقيقي في الأصل.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُعملت «آتيًا» بدل «قادمًا» للمحافظة على الإيجاز والنبرة المألوفة في النصوص الكتابية، من غير التضحية بوضوح العبارة.
