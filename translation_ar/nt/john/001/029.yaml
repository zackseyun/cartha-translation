  yaml_path: translation/nt/john/001/029.yaml
  text: The next day he sees Jesus coming toward him and says, “Look, the Lamb of God, who takes away the sin of the world!”
translation:
  language: ar
  text: 'في اليوم التالي، يرى يسوع مقبلًا نحوه، فيقول: «ها هو حمل الله الذي يرفع خطيئة العالم»[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أن يعني الفعل اليوناني المترجم «يرفع» أيضًا «يزيل» أو «يحمل».
    reason: الحفاظ على المجال الدلالي للفعل αἴρων، الذي قد يفيد أخذ الخطيئة وإزالتها أو حملها.
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: في اليوم التالي
  rationale: تعبير عربي طبيعي ودقيق يدل على اليوم الذي يلي الحدث السابق.
- source_word: βλέπει ... λέγει
  choice: رأى ... فقال
  rationale: حُوِّل المضارع التاريخي اليوناني إلى الماضي السردي المألوف في العربية، من دون تغيير تسلسل الحدث.
- source_word: Ἴδε
  choice: ها هو
  rationale: ينقل أسلوب لفت الانتباه بوضوح وطبيعية، ويتجنب فرض عدد المخاطَبين الذي لا تصرّح به العربية هنا.
- source_word: ὁ ἀμνὸς τοῦ θεοῦ
  choice: حمل الله
  rationale: يحافظ على الصورة والاستناد الإضافي في اليونانية من غير تفسير زائد.
- source_word: τὴν ἁμαρτίαν τοῦ κόσμου
  choice: خطيئة العالم
  rationale: يحافظ على المفرد في النص اليوناني وعلى شمول «العالم».
theological_decisions:
- issue: دلالة ὁ αἴρων
  choice: الذي يرفع
  alternative: الذي يزيل / الذي يحمل
  rationale: «يرفع» أقرب إلى سعة الفعل اليوناني، إذ يمكن أن يشير إلى الإزالة أو إلى الحمل؛ وتوضح الحاشية هذا الاحتمال من غير حسم توتر النص لمصلحة تفسير واحد.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدم الماضي السردي لطبيعية الأسلوب العربي، مع إبقاء صورة «حمل الله» ومفرد «خطيئة» كما في الأصل.
