base_translation:
  language: en
  yaml_path: translation/nt/john/001/027.yaml
  text: the one coming after me[a], whose sandal strap I am not worthy to untie.
translation:
  language: ar
  text: الآتي بعدي، الذي لستُ أهلًا لأن أحلَّ رباط نعله.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ὀπίσω μου ἐρχόμενος
  choice: الآتي بعدي
  rationale: اسم الفاعل المعرَّف مستعمل استعمال الاسم ويشير إلى شخص بعينه. وتحافظ «الآتي بعدي» على دلالة اسم الفاعل وعلى معنى التعاقب، من غير حصر العبارة في الموقع المكاني.
- source_word: οὗ
  choice: الذي ... نعله
  rationale: أُعيد تركيب ضمير الوصل المجرور بصياغة عربية طبيعية، وأُظهرت علاقة الملكية في «نعله».
- source_word: οὐκ εἰμὶ ἄξιος
  choice: لستُ أهلًا
  rationale: تنقل «أهلًا» معنى الجدارة أو الاستحقاق، وتحفظ تعبير يوحنا عن تواضعه بلغة عربية واضحة ومألوفة.
- source_word: ἵνα λύσω
  choice: لأن أحلَّ
  rationale: تأتي ἵνα مع صيغة الاحتمال بعد وصف الأهلية لتبين الفعل المقصود؛ و«لأن أحلَّ» تحافظ على بنية العبارة ودلالتها بصورة عربية سليمة.
- source_word: ἱμάντα
  choice: رباط
  rationale: يدل اللفظ هنا على السير أو الرباط الذي يثبت النعل، و«رباط» واضحة في العربية المعاصرة.
- source_word: τοῦ ὑποδήματος
  choice: نعله
  rationale: يدل ὑπόδημα على ما يُلبس في القدم، ويرجح «النعل» في البيئة التاريخية للنص.
theological_decisions:
- issue: دلالة «بعدي» في وصف الآتي
  choice: 'أُبقيت الدلالة الزمنية/التعاقبية: «الآتي بعدي»'
  alternative: الآتي خلفي
  rationale: يفيد السياق أن الشخص يأتي بعد يوحنا في ترتيب الظهور والخدمة، مع وجود دلالة تفوق في السياق الأوسع. ولا تُدخل الصياغة في هذه العبارة وحدها ما تصرح به الآيات المجاورة.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. حافظت الصياغة على إيجاز الأصل، ولم تُضف علامة حاشية لأن المسودة العربية لا تحتاج إلى بديل لفظي ضروري؛ كما أن الحاشية الإنجليزية المعطاة تكرر فعليًا صياغة المتن الإنجليزي ولا تقابل موضعًا مختلفًا في النص اليوناني.
