source:
  edition: SBLGNT
  text: εἶπαν οὖν αὐτῷ· Τίς εἶ; ἵνα ἀπόκρισιν δῶμεν τοῖς πέμψασιν ἡμᾶς· τί λέγεις περὶ σεαυτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/001/022.yaml
  text: So they said to him, “Who are you, so that we may give an answer to those who sent us? What do you say about yourself?”
translation:
  language: ar
  text: 'فقالوا له: «فمَن أنت، لكي نُعطي جوابًا للذين أرسلونا؟ ماذا تقول عن نفسك؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: فـ
  rationale: تفيد الاستنتاج أو الانتقال من الحوار السابق، والفاء تحافظ على ترابط الكلام بإيجاز طبيعي.
- source_word: εἶπαν ... αὐτῷ
  choice: قالوا له
  rationale: صياغة عربية مباشرة ومألوفة لتقديم الكلام المنقول، من غير زيادة تفسيرية.
- source_word: Τίς εἶ;
  choice: مَن أنت؟
  rationale: ينقل سؤال الهوية الموجز في اليونانية بوضوح ومباشرة.
- source_word: ἵνα
  choice: لكي
  rationale: تحفظ دلالة الغرض في السياق بأسلوب عربي فصيح وطبيعي.
- source_word: ἀπόκρισιν δῶμεν
  choice: نُعطي جوابًا
  rationale: يحافظ على صورة الفعل اليوناني δίδωμι مع الاسم ἀπόκρισις، وهو تعبير عربي واضح في سياق نقل الرد.
- source_word: τοῖς πέμψασιν ἡμᾶς
  choice: للذين أرسلونا
  rationale: ينقل اسم الفاعل المعرّف بوصفه جملة صلة عربية طبيعية، مع إبقاء هوية المرسِلين كما هي في السياق.
- source_word: τί λέγεις
  choice: ماذا تقول
  rationale: المضارع هنا يطلب تصريح يوحنا عن هويته؛ والصياغة تحافظ على بساطة السؤال.
- source_word: περὶ σεαυτοῦ
  choice: عن نفسك
  rationale: تنقل περί مع المضاف إليه ودلالة الضمير الانعكاسي بدقة ووضوح.
theological_decisions: []
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة، مع الحفاظ على إيجاز السؤال اليوناني وترابطه. وُضعت الفاء قبل «مَن» لتجسيد οὖν بوصفها أداة انتقال واستنتاج، من دون إثقال العبارة بـ«إذًا» أو «لذلك».
