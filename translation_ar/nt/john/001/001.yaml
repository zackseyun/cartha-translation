  text: Ἐν ἀρχῇ ἦν ὁ λόγος, καὶ ὁ λόγος ἦν πρὸς τὸν θεόν, καὶ θεὸς ἦν ὁ λόγος.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/001.yaml
  text: In the beginning was the Word[a], and the Word was with God[b], and the Word was God.
translation:
  language: ar
  text: في البدء[b] كانت الكلمة، وكانت الكلمة مع الله، وكانت الكلمة الله[a].
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 'أو: «وكانت الكلمة إلهية»، أو: «وكانت الكلمة ما كانه الله». تفيد الصياغة اليونانية في العبارة الأخيرة وصف الكلمة من حيث طبيعتها، مع تمييزها عن «الله» المذكور في العبارة السابقة.'
    reason: alternative_reading
  - marker: b
    text: تردد عبارة «في البدء» صدى تكوين 1:1، فتربط الكلمة ببدء الخليقة.
    reason: cross_reference
lexical_decisions:
- source_word: Ἐν ἀρχῇ
  choice: في البدء
  rationale: يحفظ الصدى المباشر لتكوين 1:1، وهو تعبير عربي فصيح ومألوف.
- source_word: ἦν
  choice: كان
  rationale: ينقل صيغة الماضي الناقص للفعل εἰμί بصورة طبيعية، ويحفظ إيقاع التكرار في الآية.
- source_word: ὁ λόγος
  choice: الكلمة
  rationale: ينقل الدلالة على الكلام والإعلان، ويحفظ استعمال يوحنا للفظ لقبًا شخصيًا محمّلًا بالمعنى، من غير حصره في «العقل» أو «الرسالة».
- source_word: πρὸς τὸν θεόν
  choice: مع الله
  rationale: يعبر بالعربية الطبيعية عن العلاقة والحضور المتبادل اللذين تفيدهما πρός في هذا السياق، مع إبقاء التمييز الشخصي.
- source_word: θεὸς ἦν ὁ λόγος
  choice: وكان الكلمة الله
  rationale: 'يحفظ قوة المسند النوعية في اليونانية: يقرر حقيقة ألوهية الكلمة، من غير أن يساويه من جهة الشخص بالله المذكور في العبارة السابقة.'
theological_decisions:
- issue: ترجمة θεός غير المعرّفة بأداة في العبارة الأخيرة
  choice: وكان الكلمة الله
  alternative: 'وكان الكلمة إلهيًا؛ أو: وما كانه الله كانه الكلمة'
  rationale: تقديم θεός بوصفها خبرًا غير معرّف يعطيها قوة نوعية، فيصف طبيعة الكلمة مع إبقاء تمييزه عن الله في العبارة السابقة. الصياغة الرئيسة مباشرة وأقوى من «إلهيًا»، أما البديل التفسيري فيوضح المعنى لكنه ليس ترجمة موجزة.
translation_notes:
  register: 'عربية فصحى واضحة ومهيبة، مع الحفاظ على التوازي والإيقاع في الأصل. وُضعت علامتا الحاشيتين في موضعين دالّين: [a] بعد تقرير العبارة الأخيرة، و[b] بعد الآية لأنها تشرح العبارة الافتتاحية.'
