base_translation:
  language: en
  yaml_path: translation/nt/john/001/047.yaml
  text: Jesus saw Nathanael coming toward him and said about him, “Look, truly an Israelite in whom there is no deceit.”
translation:
  language: ar
  text: 'رأى يسوع نثنائيل مقبلًا إليه، وقال عنه: «ها هو ذا إسرائيليّ حقًّا لا غشّ فيه».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἴδε
  choice: انظروا
  rationale: أداة تنبيه تلفت أنظار الحاضرين إلى نثنائيل؛ وصيغة الجمع العربية طبيعية في هذا السياق، مع بقاء المخاطَبين غير مصرَّح بهم في اليونانية.
- source_word: ἀληθῶς Ἰσραηλίτης
  choice: إسرائيليّ حقًّا
  rationale: يحافظ على دلالة ἀληθῶς بوصفها توكيدًا لصدق الوصف، من غير تحويل العبارة إلى حكم على الهوية العرقية أو الدينية.
- source_word: δόλος
  choice: غشّ
  rationale: ينقل معنى الخداع والمكر المقصود، وهو تعبير عربي واضح وموجز.
theological_decisions:
- issue: دلالة «إسرائيلي حقًّا»
  choice: إبقاء العبارة كما هي من دون تفسير لاهوتي داخل المتن
  alternative: إسرائيلي أصيل أو مؤمن إسرائيلي حقيقي
  rationale: النص يربط الوصف بانعدام الغش، لكنه لا يشرح هنا كل ما يعنيه كون المرء «إسرائيليًّا حقًّا»؛ لذلك ينبغي حفظ هذا الانفتاح.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعمل «مقبلًا إليه» لصياغة طبيعية، و«انظروا» بدل «هوذا» لتجنب الأسلوب العتيق مع الحفاظ على قوة التنبيه.
