  text: ὅτι ὁ νόμος διὰ Μωϋσέως ἐδόθη, ἡ χάρις καὶ ἡ ἀλήθεια διὰ Ἰησοῦ Χριστοῦ ἐγένετο.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/017.yaml
  text: For the law was given through Moses[a]; grace and truth came through Jesus the Messiah.
translation:
  language: ar
  text: لأن الشريعة أُعطيت على يد موسى، أما النعمة والحق فجاءا على يد يسوع المسيح.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: لأن
  rationale: تفيد هنا التعليل والشرح لما سبق في يوحنا 1:16، و«لأن» تنقل هذه العلاقة بوضوح.
- source_word: ὁ νόμος
  choice: الشريعة
  rationale: تشير إلى شريعة موسى بوصفها منظومة العهد المعروفة؛ و«الشريعة» في العربية أوضح من «الناموس» للقارئ المعاصر.
- source_word: διὰ Μωϋσέως
  choice: على يد موسى
  rationale: تنقل معنى الوساطة أو الوكالة الذي تفيده διά مع المضاف إليه، وتلائم الاستعمال العربي الطبيعي.
- source_word: ἐδόθη
  choice: أُعطيت
  rationale: تحافظ على صيغة المبني للمجهول وعلى معنى الإعطاء من غير تعيين الفاعل صراحة.
- source_word: ἡ χάρις καὶ ἡ ἀλήθεια
  choice: النعمة والحق
  rationale: يحفظ التعبيران الدلالة اليوحناوية والارتباط بيوحنا 1:14؛ واختير «الحق» لأنه التعبير العربي الكتابي الطبيعي عن ἀλήθεια في هذا السياق.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: على يد يسوع المسيح
  rationale: يحافظ على التوازي مع «على يد موسى»، ويترجم Χριστός بلقبه العربي الدال على المسيّا، لا بمجرد نقل صوتي أجنبي.
- source_word: ἐγένετο
  choice: جاءا
  rationale: ينقل معنى مجيء النعمة والحق وتحققهما تاريخيًا من خلال يسوع، مع مطابقة الفعل للمثنى في العربية، من غير الإيحاء بأنهما خُلقتا أو بدأتا في الوجود المطلق.
theological_decisions:
- issue: دلالة Χριστός في عبارة Ἰησοῦ Χριστοῦ
  choice: يسوع المسيح
  alternative: يسوع المَسيّا
  rationale: «المسيح» هو المقابل العربي الراسخ والدال على لقب «الممسوح»، فيحفظ معنى اللقب على نحو طبيعي من غير تحويله إلى اسم علم خالٍ من الدلالة.
- issue: العلاقة بين الشريعة والنعمة والحق
  choice: الإبقاء على المقابلة من غير إضافة «لكن» ذات الدلالة التضادية القوية
  alternative: لكن النعمة والحق جاءا
  rationale: النص اليوناني يضع العبارتين في توازٍ ومقابلة، لكنه لا يصرّح بأن الشريعة مناقضة للنعمة والحق؛ لذلك استُعمل «أما» لتنظيم المقابلة دون حسم توترها لاهوتيًا.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعملت «الشريعة» بدل «الناموس» لوضوحها المعاصر، و«على يد» لإبراز الوساطة في العبارتين المتوازيتين. لم تُضف حاشية لأن النص اليوناني لا يتضمن قراءة بديلة هنا، ولأن «المسيح» نفسه ترجمة عربية دلالية طبيعية للقب Χριστός.
