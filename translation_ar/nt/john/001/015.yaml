base_translation:
  language: en
  yaml_path: translation/nt/john/001/015.yaml
  text: John testifies about him and has cried out[a], saying, “This was he of whom I said, ‘The one coming after me has become before me[b], because he was before me.’”
translation:
  language: ar
  text: 'يشهد يوحنا عنه، وقد نادى قائلًا: «هذا هو الذي قلت عنه: الآتي بعدي صار قبلي[a]، لأنه كان قبلي[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «تقدّمني» أو «صار أرفع مني مقامًا». يمكن للعبارة اليونانية أن تدل على الأولوية أو الرتبة، لا على الترتيب وحده.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «لأنه كان موجودًا قبلي». تحافظ عبارة «كان قبلي» على قرب أكبر من اليونانية، مع بقائها قابلة للدلالة في السياق على سبق الوجود.'
    reason: alternative_reading
lexical_decisions:
- source_word: μαρτυρεῖ περὶ αὐτοῦ
  choice: يشهد له
  rationale: صياغة عربية فصيحة وطبيعية تؤدي معنى الشهادة بشأنه، وتحافظ صيغة المضارع على حيوية الشهادة واستمرارها.
- source_word: κέκραγεν
  choice: قد نادى
  rationale: «قد» مع الماضي تنقل، بقدر طبيعي في العربية، دلالة الفعل اليوناني التام على نداء وقع وبقي صداه أو أثره قائمًا؛ و«نادى» واضحة من غير مبالغة تفسيرية.
- source_word: λέγων
  choice: قائلًا
  rationale: تحافظ على الصلة الحالية في اليونانية بصياغة عربية سليمة.
- source_word: Οὗτος ἦν ὃν εἶπον
  choice: هذا هو الذي قلت عنه
  rationale: تعبير عربي طبيعي للتعريف بالشخص المشار إليه. استُعمل «هو» بدل النقل الحرفي الثقيل «كان» لأن العربية في هذا الأسلوب تعرّف بالشخص الحاضر الذي سبق الكلام عنه، مع بقاء الإحالة الماضية في «قلت».
- source_word: Ὁ ὀπίσω μου ἐρχόμενος
  choice: الآتي بعدي
  rationale: يحافظ على صورة المجيء وعلى معنى الترتيب الزمني أو الظهور اللاحق، من غير حسم جميع إيحاءات العبارة.
- source_word: ἔμπροσθέν μου γέγονεν
  choice: صار قبلي
  rationale: يحفظ فعل γίνομαι بصيغة تدل على الصيرورة، وينقل ἔμπροσθεν بلفظ «قبلي» الذي يترك مجالًا للأولوية في الترتيب أو المقام. أُضيفت حاشية لبيان البدائل الدلالية.
- source_word: ὅτι πρῶτός μου ἦν
  choice: لأنه كان قبلي
  rationale: «لأن» تبين التعليل، و«كان قبلي» قريبة من العبارة اليونانية وتبقي احتمال الإشارة إلى الوجود السابق دون إدخال لفظ «وُجد» في المتن.
theological_decisions:
- issue: مدى التصريح بسبق وجود المسيح في العبارة الأخيرة
  choice: لأنه كان قبلي
  alternative: لأنه كان موجودًا قبلي
  rationale: السياق اليوحناوي يتيح فهم العبارة على سبق الوجود، لكن النص اليوناني يقول حرفيًا ما يقارب «كان قبلي». إبقاء هذه الصياغة يحفظ قوة الدلالة والتوتر اللاهوتي من غير إضافة تفسيرية إلى المتن.
- issue: 'دلالة ἔμπροσθέν μου γέγονεν: السبق أم التفوق في المقام'
  choice: صار قبلي
  alternative: تقدّمني / صار أرفع مني مقامًا
  rationale: العبارة اليونانية يمكن أن تدل على الأولوية أو التقدم في الرتبة، إلى جانب صورتها الترتيبية. اختيرت صياغة قريبة وواسعة الدلالة، مع توضيح البدائل في الحاشية بدل حسمها مذهبيًا.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة ومهيبة من غير تراكيب تراثية ثقيلة. وُضعت علامتا الحاشيتين [a] و[b] في المتن، وحُفظ الغموض الدلالي المقصود في عبارتي الأولوية وسبق الوجود.
