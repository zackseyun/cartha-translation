  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: وفي اليوم التالي
  rationale: تعبير زمني اصطلاحي بمعنى «في اليوم التالي». وأُبقيت الواو لربط المشهد بسياقه السردي، مع أن العربية قد تستغني عنها أحيانًا.
- source_word: πάλιν
  choice: أيضًا
  rationale: تفيد تكرار وجود يوحنا في المشهد؛ و«أيضًا» طبيعية هنا مع حال الوقوف، بينما تظل «مرة أخرى» بديلًا ممكنًا.
- source_word: εἱστήκει
  choice: كان ... واقفًا هناك
  rationale: الصيغة تصف حالة ماضية مستمرة هي الوقوف. أُضيفت «هناك» لتستقيم العبارة العربية وتوضح الموقع المفهوم من السياق دون تعيين مكان جديد.
- source_word: ὁ Ἰωάννης
  choice: يوحنا
  rationale: الصيغة العربية المعيارية للاسم. لم تُضف عبارة «المعمدان» لأن النص اليوناني يقول «يوحنا» فقط.
- source_word: καὶ
  choice: ومعه
  rationale: نُقلت الواو مع استكمال المحمول المفهوم لتكوين جملة عربية طبيعية، بدل عطف عبارة اسمية ناقصة.
- source_word: ἐκ τῶν μαθητῶν αὐτοῦ δύο
  choice: اثنان من تلاميذه
  rationale: يحفظ التعبير معنى التبعيض في ἐκ، أي اثنان من بين تلاميذه، مع الإبقاء على «تلاميذ» بوصفها المقابل المألوف لـ μαθηταί.
