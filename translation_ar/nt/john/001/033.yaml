  text: κἀγὼ οὐκ ᾔδειν αὐτόν, ἀλλ’ ὁ πέμψας με βαπτίζειν ἐν ὕδατι ἐκεῖνός μοι εἶπεν· Ἐφ’ ὃν ἂν ἴδῃς τὸ πνεῦμα καταβαῖνον καὶ μένον ἐπ’ αὐτόν, οὗτός ἐστιν ὁ βαπτίζων ἐν πνεύματι ἁγίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/033.yaml
  text: And I did not know him[a], but the one who sent me to baptize in water said to me, ‘The one on whom you see the Spirit descending and remaining on him[c][b], this is he who baptizes in the Holy Spirit.’
translation:
  language: ar
  text: 'وأنا لم أكن أعرفه[a]، لكن الذي أرسلني لأعمِّد في الماء قال لي: «الذي ترى الروح نازلًا وماكثًا عليه[b]، هو الذي يعمِّد في الروح القدس[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لم أكن قد تعرّفت إليه». يمكن أن يدل التعبير اليوناني في السياق على عدم المعرفة أو عدم التعرّف.'
    reason: lexical_alternative
  - marker: b
    text: '«ماكثًا» تترجم فعلًا محوريًّا في إنجيل يوحنا، ويمكن أيضًا ترجمته: «باقيًا».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «لأعمِّد بالماء» و«يعمِّد بالروح القدس». يستعمل اليوناني حرف الجر نفسه في العبارتين، ويحافظ المتن على هذا التوازي باستعمال «في».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ οὐκ ᾔδειν αὐτόν
  choice: وأنا لم أكن أعرفه
  rationale: تنقل «κἀγώ» صلة الكلام مع إبراز المتكلم، ويعبّر «لم أكن أعرفه» عن استمرار عدم المعرفة في الزمن الماضي، مع إبقاء احتمال أن المقصود عدم التعرّف إليه للسياق.
- source_word: ὁ πέμψας με
  choice: الذي أرسلني
  rationale: صياغة عربية طبيعية تنقل اسم الفاعل المعرّف المستعمل استعمال الاسم من غير أسلوب قديم أو متكلّف.
- source_word: βαπτίζειν ἐν ὕδατι
  choice: لأعمِّد في الماء
  rationale: اللام تبيّن غرض الإرسال، و«في الماء» تحافظ على حرف الجر اليوناني وعلى التوازي مع «في الروح القدس».
- source_word: Ἐφ’ ὃν ἂν ἴδῃς
  choice: الذي ترى ... عليه
  rationale: تنقل علامة التعريف بصياغة عربية واضحة، مع تقديم الاسم الموصول وإتمام صلته بالضمير في «عليه».
- source_word: τὸ πνεῦμα καταβαῖνον καὶ μένον ἐπ’ αὐτόν
  choice: الروح نازلًا وماكثًا عليه
  rationale: يحافظ الحالان «نازلًا وماكثًا» على توازي اسمي الفاعل في اليونانية، و«ماكثًا» ينقل فعل μένω المهم في إنجيل يوحنا من غير حصره في معنى الاستقرار المكاني وحده.
- source_word: οὗτός ἐστιν ὁ βαπτίζων ἐν πνεύματι ἁγίῳ
  choice: هو الذي يعمِّد في الروح القدس
  rationale: «هو» تؤدي وظيفة التعريف والتعيين في العبارة، والمضارع «يعمِّد» ينقل اسم الفاعل الدال على صفة هذا الشخص وعمله.
theological_decisions:
- issue: مرجع πνεῦμα وعبارة πνεύματι ἁγίῳ
  choice: الروح ... الروح القدس
  alternative: الروح ... روح قدس
  rationale: السياق نفسه يعرّف الروح النازل بأنه الروح القدس في ختام الآية؛ واستعمال التعريف في العربية يوضح وحدة المرجع من غير إضافة تفسير مذهبي.
- issue: حرف الجر في عبارتي المعمودية
  choice: في الماء ... في الروح القدس
  alternative: بالماء ... بالروح القدس
  rationale: يحافظ اختيار «في» في الموضعين على حرف الجر اليوناني ἐν وعلى التوازي المقصود، مع إثبات البديل العربي الشائع في الحاشية.
- issue: دلالة οὐκ ᾔδειν
  choice: لم أكن أعرفه
  alternative: لم أكن قد تعرّفت إليه
  rationale: يبقي المتن الدلالة الأوسع للمعرفة، ولا يحسم ما إذا كان المقصود عدم المعرفة السابقة أو عدم التعرّف إلى هويته المعلنة.
translation_notes:
  register: العربية فصحى معاصرة واضحة ووقورة. روعي التوازي التركيبي بين المعمودية في الماء والمعمودية في الروح القدس، وحُفظت دلالة فعل «المكث» اليوحناوية، مع تجنّب ألفاظ طائفية أو تفسيرية زائدة.
