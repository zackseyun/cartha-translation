lexical_decisions:
- source_word: ἦν
  choice: كان
  rationale: فعل ماضٍ ناقص يصف حال فيلبس ومنشأه، و«كان» أقرب مقابل عربي مباشر.
- source_word: δὲ
  choice: وَ
  rationale: أداة ربط خفيفة تواصل السرد من غير أن تفيد تعارضًا قويًا؛ والواو طبيعية في العربية هنا.
- source_word: ὁ Φίλιππος
  choice: فيلبس
  rationale: نقل للاسم الشخصي وفق الصيغة العربية الكتابية الشائعة.
- source_word: ἀπὸ Βηθσαϊδά
  choice: من بيت صيدا
  rationale: تدل ἀπό على المصدر أو المنشأ، و«من» تؤدي هذا المعنى بوضوح، مع نقل اسم المكان بصيغته العربية الشائعة.
- source_word: ἐκ τῆς πόλεως
  choice: من مدينة
  rationale: تدل ἐκ هنا على المنشأ أيضًا، وحُفظ تكرار حرف الجر كما في اليونانية. و«مدينة» مقابل مباشر لـπόλις، مع إمكان فهمها بمعنى بلدة بحسب حجم الموضع.
- source_word: Ἀνδρέου καὶ Πέτρου
  choice: أندراوس وبطرس
  rationale: المضاف إليه يربط المدينة بأندراوس وبطرس من جهة المنشأ؛ وأُبقي التعبير موجزًا من غير إضافة تفسير إلى المتن.
