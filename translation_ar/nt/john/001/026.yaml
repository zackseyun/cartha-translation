  text: ἀπεκρίθη αὐτοῖς ὁ Ἰωάννης λέγων· Ἐγὼ βαπτίζω ἐν ὕδατι· ⸀μέσος ὑμῶν ⸀ἕστηκεν ὃν ὑμεῖς οὐκ οἴδατε,
base_translation:
  language: en
  yaml_path: translation/nt/john/001/026.yaml
  text: John answered them[a], saying, “I baptize in water. Among you stands one whom you do not know,”
translation:
  language: ar
  text: 'فأجابهم يوحنا قائلًا: «أنا أُعمِّد في الماء. يقف بينكم مَن لا تعرفونه[a]»،'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وفي وسطكم يقف مَن لا تعرفونه».'
    reason: بديل تعبيري لـ μέσος ὑμῶν يحافظ على صورة «الوسط» بصورة أوضح، لكنه أكثر أدبية من «بينكم».
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς ὁ Ἰωάννης λέγων
  choice: فأجابهم يوحنا قائلًا
  rationale: يحافظ على بنية الجملة اليونانية وعلى فعل الجواب وصيغة الحال التي تمهّد للكلام، بصياغة عربية واضحة وفصيحة.
- source_word: βαπτίζω
  choice: أُعمِّد
  rationale: «أُعمِّد» هو المقابل الكتابي العربي المستقر، ويحفظ المعنى في سياقه من غير حصره في وصف لطريقة إجراء الطقس.
- source_word: ἐν ὕδατι
  choice: في الماء
  rationale: ينقل حرف الجر ἐν ودلالته المكانية بصياغة مباشرة، مع إبقاء الاحتمال الذي قد يُعبَّر عنه عربيًا أيضًا بـ«بالماء».
- source_word: μέσος ὑμῶν
  choice: بينكم
  rationale: تعبير عربي طبيعي يدل على وجود الشخص في وسط الجماعة، من غير تكلف حرفي.
- source_word: ἕστηκεν
  choice: قائمٌ
  rationale: ينقل الحالة الحاضرة الناتجة التي تفيدها صيغة التام اليونانية؛ فالمقصود أنه قد اتخذ موقفه وهو الآن قائم بينهم.
- source_word: ὃν ὑμεῖς οὐκ οἴδατε
  choice: مَن لا تعرفونه
  rationale: يحافظ على عموم المرجع غير المسمّى وعلى معنى عدم المعرفة، من غير تضييقه إلى مجرد عدم التعرّف البصري.
theological_decisions:
- issue: هوية الشخص غير المسمّى القائم بينهم
  choice: مَن لا تعرفونه
  alternative: المسيح الذي لا تعرفونه / هو الذي لا تعرفونه
  rationale: مع أن السياق الأوسع يبيّن أن المقصود هو يسوع، لا يسمّيه هذا العدد، بل يحافظ على التشويق السردي؛ لذلك لا تُضاف هوية صريحة غير واردة في النص.
- issue: دلالة المعمودية وطريقتها
  choice: أُعمِّد في الماء
  alternative: أغمس في الماء / أُعمِّد بالماء
  rationale: يحافظ اختيار «أُعمِّد» على المصطلح نفسه من غير فرض تحديد طائفي لطريقة الإجراء، بينما تنقل «في الماء» الصياغة اليونانية بصورة مباشرة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «بينكم» في المتن لسلاسته، ووُضع البديل الأقرب حرفيًا في الحاشية. أُبقيت علامة الترقيم الدالة على استمرار كلام يوحنا في العدد التالي.
