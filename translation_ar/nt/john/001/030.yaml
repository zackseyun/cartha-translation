base_translation:
  language: en
  yaml_path: translation/nt/john/001/030.yaml
  text: This is he of whom I said[a], ‘After me comes a man who ranks before me[b], because he was before me.’
translation:
  language: ar
  text: 'هذا هو الذي قلتُ عنه[a]: «يأتي بعدي رجلٌ صار متقدّمًا عليّ، لأنه كان قبلي[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: قلتُ بشأنه.'
    reason: lexical_alternative
  - marker: b
    text: 'قد تفيد «صار متقدّمًا عليّ» الأسبقية أو علو المنزلة. ويمكن أن تُفهم «كان قبلي» أيضًا بمعنى: «كان موجودًا قبلي».'
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτός ἐστιν
  choice: هذا هو
  rationale: صيغة تعريف توكيدية طبيعية في العربية، تحافظ على بروز اسم الإشارة.
- source_word: ὑπὲρ οὗ ἐγὼ εἶπον
  choice: الذي قلتُ عنه
  rationale: تؤدي معنى الإحالة إلى الشخص الذي سبق أن تكلم يوحنا عنه، بعبارة عربية واضحة وموجزة.
- source_word: Ὀπίσω μου ἔρχεται
  choice: يأتي بعدي
  rationale: تفيد الترتيب الزمني هنا بصورة طبيعية، من غير حمل العبارة على المعنى المكاني وحده.
- source_word: ἀνὴρ
  choice: رجلٌ
  rationale: ينقل الاسم المذكر المفرد صراحة، كما في النص اليوناني.
- source_word: ἔμπροσθέν μου γέγονεν
  choice: صار قبلي
  rationale: يحافظ على دلالة الفعل التام في بلوغ حالة قائمة وعلى إيجاز العبارة اليونانية، مع إبقاء احتمال التقدم في المرتبة أو الأولوية دون حسم زائد.
- source_word: ὅτι
  choice: لأنه
  rationale: يبين العلاقة السببية بين الجملة الأخيرة وما قبلها.
- source_word: πρῶτός μου ἦν
  choice: كان قبلي
  rationale: ترجمة موجزة تحفظ التوتر الدلالي بين الأسبقية الزمنية والتقدم في المقام، ولا تضيف فعل «وُجد» إلى المتن.
theological_decisions:
- issue: مدى التصريح بوجود المسيح السابق في العبارة الأخيرة
  choice: كان قبلي
  alternative: كان موجودًا قبلي
  rationale: السياق اليوحناوي يرجح دلالة الوجود السابق، لكن اليونانية أكثر إيجازًا؛ لذلك تحفظ الصياغة المختارة الدلالة الزمنية وإمكان دلالة المقام من غير تفسير زائد.
- issue: 'دلالة ἔμπροσθέν μου γέγονεν: الأسبقية أم علو المرتبة'
  choice: صار قبلي
  alternative: تقدَّم عليَّ في المرتبة
  rationale: الصياغة المختارة تبقي الغموض الحقيقي في التركيب، بينما يوضح الهامش احتمال التفوق أو الأولوية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حوفظ على التوازي بين «صار قبلي» و«كان قبلي» وعلى الإيجاز اللاهوتي للنص، مع وضع البدائل التفسيرية في الحاشية.
