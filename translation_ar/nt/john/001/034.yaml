base_translation:
  language: en
  yaml_path: translation/nt/john/001/034.yaml
  text: And I have seen and have testified that this is the Chosen One of God[a].
translation:
  language: ar
  text: وأنا قد رأيت وشهدت أن هذا هو مختار الله[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ بعض المخطوطات: «ابن الله» بدلًا من «مختار الله».'
    reason: textual_variant
lexical_decisions:
- source_word: κἀγώ
  choice: وأنا
  rationale: تنقل الواو معنى الاستمرار والربط في καί، ويُبرز الضمير المنفصل «أنا» الفاعل كما في اليونانية من غير مبالغة.
- source_word: ἑώρακα
  choice: قد رأيت
  rationale: صيغة التمام اليونانية تدل على رؤية تمت وبقي أثرها؛ و«قد رأيت» صياغة عربية طبيعية تحافظ على هذا المعنى في السياق.
- source_word: μεμαρτύρηκα
  choice: وشهدت
  rationale: تنقل فعل الشهادة بوضوح وكرامة، ويُفهم من السياق أن الشهادة قد أُدّيت وما زالت قائمة؛ وتكرار «قد» غير لازم في العربية.
- source_word: ὅτι
  choice: أن
  rationale: تُدخل مضمون الشهادة هنا، لا سببها.
- source_word: οὗτός
  choice: هذا
  rationale: يحافظ اسم الإشارة على التعيين المباشر ليسوع في النص اليوناني.
- source_word: ἐκλεκτός
  choice: مختار
  rationale: الصفة مسبوقة بأداة التعريف ومستعملة استعمال الاسم اللقبي؛ و«مختار» واضحة وطبيعية وتحافظ على معنى الاختيار الإلهي.
- source_word: τοῦ θεοῦ
  choice: الله
  rationale: في تركيب «مختار الله» تعبّر الإضافة العربية مباشرة وبطبيعية عن الإضافة اليونانية من غير زيادة تفسيرية.
theological_decisions:
- issue: اللقب المسيحاني في يوحنا 1:34
  choice: مختار الله
  alternative: ابن الله
  rationale: نص SBLGNT المقدم يقرأ ὁ ἐκλεκτὸς τοῦ θεοῦ، لذلك تُترجم هذه القراءة في المتن بدل تسويتها مع القراءة الأشهر. وتُذكر قراءة «ابن الله» في الحاشية لأهميتها النصية واللاهوتية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حافظت الصياغة على توازي فعلي الرؤية والشهادة، وعلى اسم الإشارة المباشر، وأبقت القراءة النصية الأقل شيوعًا في المتن مع توثيق البديل في الحاشية.
