  text: καὶ ἠρώτησαν αὐτὸν καὶ εἶπαν αὐτῷ· Τί οὖν βαπτίζεις εἰ σὺ οὐκ εἶ ὁ χριστὸς ⸂οὐδὲ Ἠλίας οὐδὲ⸃ ὁ προφήτης;
base_translation:
  language: en
  yaml_path: translation/nt/john/001/025.yaml
  text: And they asked him and said to him[a], “Why then are you baptizing, if you are not the Messiah, nor Elijah[b], nor the Prophet?”
translation:
  language: ar
  text: 'فسألوه وقالوا له: «فلماذا إذن تُعمِّد، إن لم تكن أنت المسيح[a]، ولا إيليا، ولا النبي[b]؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي «المسيّا»، وهو لقب الممسوح المنتظر. واللفظ اليوناني هو Χριστός (خريستوس).
    reason: alternative_rendering
  - marker: b
    text: يُرجَّح أن المقصود بـ«النبي» هو النبي المنتظر مثل موسى (انظر التثنية 18:15).
    reason: cross_reference
lexical_decisions:
- source_word: ἠρώτησαν
  choice: فسألوه
  rationale: ينقل الفعل الماضي في السياق السردي بعبارة عربية طبيعية، من غير أن يضفي على السؤال نبرة عدائية غير مصرَّح بها.
- source_word: εἶπαν αὐτῷ
  choice: وقالوا له
  rationale: يحافظ على الفعل الثاني الوارد في اليونانية بدل دمج «سألوا» و«قالوا» في فعل واحد.
- source_word: Τί οὖν
  choice: فلماذا إذن
  rationale: مع أن τί تعني حرفيًا «ماذا»، فإنها هنا تسأل عن سبب الفعل أو مسوّغه، ولذلك تؤدي «لماذا» المعنى المقصود بوضوح.
- source_word: βαπτίζεις
  choice: تُعمِّد
  rationale: صيغة المضارع تدل على الممارسة الجارية التي يسألون يوحنا عنها، والفعل المتعدي يوضح أنه يعمّد آخرين.
- source_word: ὁ χριστός
  choice: المسيح
  rationale: ينقل اللقب اليوناني بصيغته العربية الراسخة ويحافظ على سياق انتظار الممسوح المنتظر، لا على أنه اسم شخصي مجرد.
- source_word: Ἠλίας
  choice: إيليا
  rationale: الصيغة العربية المألوفة لاسم النبي.
- source_word: ὁ προφήτης
  choice: النبي
  rationale: أداة التعريف تشير إلى شخصية معروفة في أفق انتظار السائلين، لا إلى نبي غير معيّن.
- source_word: οὐδὲ ... οὐδὲ
  choice: ولا ... ولا
  rationale: يحافظ على تتابع البديلين المنفيين في النص اليوناني بصياغة عربية سليمة.
theological_decisions:
- issue: دلالة ὁ χριστός في سؤال الهوية
  choice: المسيح
  alternative: المسيّا
  rationale: «المسيح» هو المقابل العربي الراسخ للقب Χριστός ويحتفظ بدلالة الممسوح المنتظر في هذا السياق، مع بيان المقابل البديل في الحاشية.
- issue: هل ὁ προφήτης نبي عام أم شخصية منتظرة محددة؟
  choice: النبي
  alternative: نبي
  rationale: أداة التعريف والسياق، الذي يعدد شخصيات بعينها، يرجحان أن السؤال عن «النبي» المنتظر، مع عدم إدخال تحديد يتجاوز النص في المتن.
translation_notes:
  register: صياغة عربية فصحى معاصرة وواضحة، مع الحفاظ على الفعلين السرديين «سألوا» و«قالوا» وعلى تكرار النفي. وُضعت علامتا الحاشيتين عند المصطلحين اللذين تشرحهما الحاشيتان مباشرة.
