lexical_decisions:
- source_word: κἀγὼ
  choice: وأنا
  rationale: تحفظ اتصال الكلام بما قبله مع إبراز الضمير، من غير إثقال العبارة بإضافة «أيضًا» التي قد توحي بقوة دلالية زائدة.
- source_word: οὐκ ᾔδειν
  choice: لم أكن أعرفه
  rationale: تنقل حالة عدم المعرفة في الماضي مباشرة، وتبقي احتمال عدم التعرّف قائمًا من غير أن تحصر المعنى فيه.
- source_word: ἵνα φανερωθῇ
  choice: لكي يُظهَر
  rationale: تحفظ معنى الغاية وصيغة المبني للمجهول في اليونانية، من غير تعيين الفاعل.
- source_word: τῷ Ἰσραὴλ
  choice: لإسرائيل
  rationale: تنقل الداتيف بوصفه الجهة التي يُظهَر لها، وتحفظ المرجع الجمعي كما ورد.
- source_word: διὰ τοῦτο
  choice: لهذا
  rationale: عبارة عربية طبيعية تشير إلى الغاية المذكورة قبلها وتحفظ القوة التفسيرية للأصل.
- source_word: ἦλθον ἐγὼ
  choice: جئتُ
  rationale: تنقل الفعل الماضي البسيط، ويظهر توكيد الضمير في صيغة الفعل وفي «وأنا» في صدر الجملة.
- source_word: ἐν ὕδατι
  choice: في الماء
  rationale: تحفظ حرف الجر وصورة التعميد في الماء كما في النص اليوناني، بدل تحويلها إلى دلالة الوسيلة «بالماء».
- source_word: βαπτίζων
  choice: أعمِّد
  rationale: صيغة الحال العربية بعد «جئت» تنقل الفعل المصاحب للمجيء طبيعيًا، مع استعمال اللفظ الديني المستقر من غير حسم كيفية الطقس.
theological_decisions:
- issue: معنى قول يوحنا إنه لم يكن يعرف يسوع
  choice: لم أكن أعرفه
  alternative: لم أكن أتعرّف إليه / لم أكن أعرف أنه المسيح
  rationale: النص لا يحدد هل المقصود انعدام المعرفة الشخصية أم عدم التعرّف إلى هويته؛ لذلك تُحفظ العبارة الأوسع وتُذكر دلالة التعرّف في الحاشية.
- issue: الفاعل الذي أظهر يسوع لإسرائيل
  choice: يُظهَر، بصيغة المبني للمجهول
  alternative: يُظهره الله
  rationale: الأصل مبني للمجهول ولا يصرّح بالفاعل، فلا تضيف الترجمة اسم الله تفسيرًا.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. قُدّمت جملة الغاية على «جئت لهذا» لتفادي التباس عود اسم الإشارة، مع إبقاء ترتيب الأفكار قريبًا من اليونانية.
