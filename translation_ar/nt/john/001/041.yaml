  text: εὑρίσκει οὗτος ⸀πρῶτον τὸν ἀδελφὸν τὸν ἴδιον Σίμωνα καὶ λέγει αὐτῷ· Εὑρήκαμεν τὸν Μεσσίαν (ὅ ἐστιν μεθερμηνευόμενον χριστός).
base_translation:
  language: en
  yaml_path: translation/nt/john/001/041.yaml
  text: He first found his own brother Simon and said to him[a], “We have found the Messiah” (which means Messiah).
translation:
  language: ar
  text: 'فوجد أولًا[a] أخاه سمعان، وقال له: «وجدنا المسيّا» (أي: المسيح).'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'في بعض المخطوطات: «وكان هو أول من وجد أخاه سمعان».'
    reason: اختلاف نصي بين πρῶτον («أولًا») وπρῶτος («كان هو أول من»).
lexical_decisions:
- source_word: εὑρίσκει
  choice: فوجد
  rationale: صيغ المضارع التاريخي في اليونانية، ويؤديها الماضي العربي أداءً طبيعيًا في السرد مع الحفاظ على معنى الحدث.
- source_word: οὗτος
  choice: فاعل مستتر في «فوجد»
  rationale: يعود اسم الإشارة إلى أندراوس في السياق، والعربية الطبيعية تستغني هنا عن «هذا» أو «هو» لأن المرجع واضح.
- source_word: πρῶτον
  choice: أولًا
  rationale: 'يحفظ المعنى الظرفي في النص المختار: كان العثور على سمعان أول ما فعله.'
- source_word: ἀδελφὸν τὸν ἴδιον
  choice: أخاه
  rationale: ضمير الملكية في «أخاه» يعبّر طبيعيًا عن كونه أخاه هو؛ أما ترجمة ἴδιον بلفظ مستقل فتنتج تركيبًا عربيًا متكلفًا أو قد توحي بأنه شقيقه من الأبوين.
- source_word: Σίμωνα
  choice: سمعان
  rationale: الصيغة العربية الكتابية المعروفة للاسم الشخصي، وهي مناسبة للنقل لا لترجمة الاسم.
- source_word: λέγει αὐτῷ
  choice: وقال له
  rationale: نُقل المضارع التاريخي إلى الماضي العربي لسلامة السرد، مع إبقاء فعل القول قريبًا من اليونانية.
- source_word: Εὑρήκαμεν
  choice: وجدنا
  rationale: 'يفيد التمام في السياق: لقد تحقق العثور وصار حقيقة حاضرة، ويؤدي الماضي العربي هذا المعنى طبيعيًا من غير إثقال العبارة بـ«قد».'
- source_word: Μεσσίαν
  choice: المسيّا
  rationale: نقل صوتي للقب السامي الوارد في اليونانية، بما يتيح للجملة الاعتراضية أن تشرح مقابله اليوناني بدل أن تكرر اللفظ نفسه.
- source_word: μεθερμηνευόμενον
  choice: أي
  rationale: أداة تفسير عربية موجزة وطبيعية تؤدي وظيفة الشرح والترجمة التي تؤديها الكلمة اليونانية.
- source_word: χριστός
  choice: المسيح
  rationale: هو المقابل العربي المألوف للقب اليوناني χριστός، ويحافظ هنا على التمييز بين اللفظ السامي المنقول «المسيّا» ومقابله اليوناني المترجم «المسيح».
theological_decisions:
- issue: العلاقة بين Μεσσίας وχριστός
  choice: «المسيّا» للفظ السامي و«المسيح» لمقابله اليوناني
  alternative: «المسيح» في الموضعين، أو «الممسوح» في الجملة التفسيرية
  rationale: تمييز اللفظين يحفظ وظيفة شرح يوحنا للقب السامي بمقابله اليوناني. أما تكرار «المسيح» في الموضعين فيطمس الشرح، و«الممسوح» يشرح أصل اللقب دلاليًا لكنه لا يمثل على نحو مباشر المقابل الاصطلاحي الذي يورده النص.
- issue: دلالة πρῶτον والقراءة النصية البديلة
  choice: 'المتن يتبع قراءة SBLGNT الظرفية: «أولًا»'
  alternative: «وكان هو أول من وجد أخاه» وفق قراءة πρῶτος في بعض الشواهد
  rationale: قراءة المتن πρῶτον تصف ترتيب فعل أندراوس؛ وقد أُثبتت القراءة البديلة في الحاشية من غير دمج القراءتين أو حسم الفرق بينهما لاهوتيًا.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم الماضي للسرد الطبيعي، وحُفظ الفرق المقصود بين «المسيّا» بوصفه نقلًا للفظ السامي و«المسيح» بوصفه مقابله اليوناني.
