source:
  edition: SBLGNT
  text: ἦν Ἀνδρέας ὁ ἀδελφὸς Σίμωνος Πέτρου εἷς ἐκ τῶν δύο τῶν ἀκουσάντων παρὰ Ἰωάννου καὶ ἀκολουθησάντων αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/040.yaml
  text: Andrew[a], Simon Peter’s brother, was one of the two who had heard from John and followed him.
translation:
  language: ar
  text: وكان أندراوس، أخو سمعان بطرس، واحدًا من الاثنين اللذين سمعا من يوحنا وتبعاه.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: الضمير في «تبعاه» يعود إلى يسوع بحسب السياق.
    reason: توضيح مرجع الضمير مع الحفاظ على صياغة الأصل في المتن.
lexical_decisions:
- source_word: ἦν
  choice: كان
  rationale: فعل ناقص يربط أندراوس بخبره «واحدًا من الاثنين»، وهو المقابل العربي الطبيعي هنا.
- source_word: Ἀνδρέας
  choice: أندراوس
  rationale: نقل للاسم وفق صيغته العربية الكتابية الشائعة.
- source_word: ὁ ἀδελφὸς Σίμωνος Πέτρου
  choice: أخو سمعان بطرس
  rationale: يحفظ علاقة الأخوّة الحرفية وصيغة الإضافة بعبارة عربية موجزة وطبيعية.
- source_word: εἷς ἐκ τῶν δύο
  choice: واحدًا من الاثنين
  rationale: تعبير عربي دقيق وطبيعي عن علاقة الجزء بالمجموع.
- source_word: τῶν ἀκουσάντων
  choice: اللذين سمعا
  rationale: اسم الموصول المثنى مع الفعل الماضي يحفظ دلالة اسم الفاعل الأوريستي ويصلح طبيعيًا للسياق العربي.
- source_word: παρὰ Ἰωάννου
  choice: من يوحنا
  rationale: يحافظ على معنى المصدر في παρά مع المضاف إليه من غير إضافة «المعمدان» أو «كلام» غير المذكورين صراحة.
- source_word: καὶ ἀκολουθησάντων αὐτῷ
  choice: وتبعاه
  rationale: الفعل المتعدي مع ضمير المفرد المذكر ينقل معنى اتباع الشخص؛ ويُفهم من السياق أن الضمير يعود إلى يسوع.
theological_decisions:
- issue: مرجع الضمير في αὐτῷ
  choice: الإبقاء عليه ضميرًا في «تبعاه»، ومرجعه يسوع بحسب السياق
  alternative: اعتبار الضمير عائدًا إلى يوحنا
  rationale: يروي السياق المباشر أن التلميذين سمعا شهادة يوحنا ثم تبعا يسوع. والإبقاء على الضمير يحفظ صياغة اليونانية من غير إدخال الاسم تفسيرًا في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل المثنى «اللذين سمعا» و«تبعاه» حفاظًا على العدد، مع ترتيب قريب من الأصل وصياغة طبيعية.
