  text: καὶ ὡμολόγησεν καὶ οὐκ ἠρνήσατο, καὶ ὡμολόγησεν ὅτι ⸂Ἐγὼ οὐκ εἰμὶ⸃ ὁ χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/020.yaml
  text: And he confessed and did not deny[a], but confessed, “I am not the Messiah.”
translation:
  language: ar
  text: 'فاعترف ولم يُنكر، بل اعترف قائلًا: «لستُ أنا المسيح[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي «الممسوح». اللفظ اليوناني Χριστός (خريستوس) لقبٌ مسياني، ولذلك تُرجم هنا «المسيح».
    reason: alternative_reading
lexical_decisions:
- source_word: ὡμολόγησεν
  choice: اعترف
  rationale: ينقل معنى الإقرار العلني الصريح، ويحافظ تكراره على التوكيد البلاغي في اليونانية.
- source_word: οὐκ ἠρνήσατο
  choice: لم يُنكر
  rationale: ترجمة مباشرة تحفظ المقابلة المؤكدة بين الاعتراف وعدم الإنكار.
- source_word: καὶ ... καὶ ... καὶ
  choice: فـ... و... بل...
  rationale: تُبقي تتابع الجملة، بينما تنقل «بل» الاستدراك والتصعيد البلاغي الطبيعي في العربية عند إعادة التصريح.
- source_word: Ἐγὼ οὐκ εἰμὶ
  choice: لستُ أنا
  rationale: تُظهر الضمير اليوناني الصريح وتؤدي توكيد نفي الهوية بصياغة عربية طبيعية.
- source_word: ὁ χριστός
  choice: المسيح
  rationale: «المسيح» هو المقابل العربي الراسخ للقب اليوناني Χριστός، ويدل هنا على المنتظَر الممسوح.
theological_decisions:
- issue: دلالة Χριστός بوصفه لقبًا
  choice: المسيح
  alternative: الممسوح
  rationale: يعمل اللفظ هنا لقبًا للمنتظَر، و«المسيح» يؤدي هذا المعنى بوضوح في العربية من غير تحويله إلى اسم شخصي محض. وتوضح الحاشية معناه الحرفي.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. حُفظ التكرار المقصود للفعل «اعترف»، وأُبرز توكيد الضمير في «لستُ أنا»، مع استعمال «بل» لصياغة الاستدراك بصورة طبيعية.
