base_translation:
  language: en
  yaml_path: translation/nt/john/001/016.yaml
  text: For from his fullness we have all received[a], and grace upon grace.
translation:
  language: ar
  text: لِأَنَّنَا جَمِيعًا أَخَذْنَا مِنْ مِلْئِهِ، وَنِعْمَةً بَدَلَ نِعْمَةٍ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «نعمةً فوق نعمة»، أو: «نعمةً بعد نعمة». يمكن أن تدل العبارة اليونانية على تعاقب النعمة، إذ تتلو عطيةٌ أخرى، مع أن ἀντί تعني في أصلها على نحو أقرب «بدل» أو «عوضًا عن».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: لأنَّ
  rationale: تفيد الأداة هنا التعليل أو التفسير لما سبق، و«لأنَّ» تنقل هذه الصلة بوضوح.
- source_word: ἐκ τοῦ πληρώματος αὐτοῦ
  choice: مِنْ مِلْئِهِ
  rationale: تحافظ العبارة على معنى المصدر الذي يُؤخذ منه وعلى نسبة الملء إليه، بصياغة عربية موجزة.
- source_word: ἡμεῖς πάντες
  choice: نحن جميعًا
  rationale: إبراز الضمير في اليونانية مع πάντες يفيد التوكيد؛ وقد نُقل هذا المعنى في العربية بتقديم ضمير الجماعة المتصل دلاليًا بالفعل مع «جميعًا».
- source_word: ἐλάβομεν
  choice: أخذنا
  rationale: الفعل يعني الأخذ أو التلقي. و«أخذنا» قريب من صورته المباشرة في اليونانية ويناسب الأخذ من الملء.
- source_word: καὶ
  choice: و
  rationale: تنقل حرف العطف من غير فرض علاقة تفسيرية زائدة.
- source_word: χάριν ἀντὶ χάριτος
  choice: نعمةً بدل نعمةٍ
  rationale: «بدل» تحافظ على القوة الأساسية لـἀντί، أي المقابلة أو حلول شيء محل آخر، من غير حسم ما إذا كان المقصود الاستبدال أم تعاقب النعم.
theological_decisions:
- issue: دلالة χάριν ἀντὶ χάριτος
  choice: نعمةً بدل نعمةٍ
  alternative: نعمةً فوق نعمة؛ نعمةً بعد نعمة
  rationale: العبارة اليونانية موضع خلاف. تحافظ الصياغة المختارة على الدلالة الأقرب لـἀντί وعلى التوتر بين الإحلال والتعاقب، بينما يبيّن الهامش القراءات الاصطلاحية الممكنة.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. رُوعي الإيجاز، وحُفظ غموض العبارة الختامية بدل تفسيرها تفسيرًا تراكميًا حصريًا.
