  text: εὑρίσκει Φίλιππος τὸν Ναθαναὴλ καὶ λέγει αὐτῷ· Ὃν ἔγραψεν Μωϋσῆς ἐν τῷ νόμῳ καὶ οἱ προφῆται εὑρήκαμεν, ⸀Ἰησοῦν υἱὸν τοῦ Ἰωσὴφ τὸν ἀπὸ Ναζαρέτ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/045.yaml
  text: 'Philip found Nathanael and said to him[a], “We have found him of whom Moses in the Law and also the prophets wrote: Jesus son of Joseph[b], from Nazareth.”'
translation:
  language: ar
  text: 'فوجد فيلبس نثنائيل وقال له: «وجدنا الذي كتب عنه موسى في الشريعة، وكتب عنه الأنبياء أيضًا: يسوع ابن يوسف، من الناصرة».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὑρίσκει ... λέγει
  choice: فوجد ... وقال
  rationale: الفعلان مضارعان تاريخيان في اليونانية، ويؤدي الماضي في العربية السرد الطبيعي من غير تغيير لتتابع الحدث.
- source_word: Ὃν ἔγραψεν Μωϋσῆς ... καὶ οἱ προφῆται
  choice: الذي كتب عنه موسى ... وكتب عنه الأنبياء أيضًا
  rationale: تكرار «كتب عنه» يوضح أن موسى والأنبياء جميعًا يشهدون للشخص نفسه، مع الحفاظ على بنية القول ومعناه.
- source_word: ἐν τῷ νόμῳ
  choice: في الشريعة
  rationale: تشير العبارة إلى شريعة موسى بوصفها نصًا مقدسًا معروفًا، و«الشريعة» واضحة وشائعة في العربية الكتابية المعاصرة.
- source_word: εὑρήκαμεν
  choice: وجدنا
  rationale: يدل التام اليوناني على اكتشاف قائم الأثر؛ ويفيد «وجدنا» هذا المعنى طبيعيًا في سياق إعلان الاكتشاف.
- source_word: υἱὸν τοῦ Ἰωσὴφ
  choice: ابن يوسف
  rationale: نقل مباشر للتعريف الاجتماعي الوارد على لسان فيلبس، دون إضافة تفسير عقائدي إلى النص.
- source_word: τὸν ἀπὸ Ναζαρέτ
  choice: الذي من الناصرة
  rationale: يحافظ على دلالة ἀπό، أي الانتماء أو المجيء من مكان، بدل اختزالها في لقب تقليدي.
- source_word: Φίλιππος / Ναθαναὴλ / Ἰησοῦν / Μωϋσῆς / Ἰωσὴφ / Ναζαρέτ
  choice: فيلبس / نثنائيل / يسوع / موسى / يوسف / الناصرة
  rationale: استُخدمت الصيغ العربية الكتابية المألوفة للأسماء والأماكن.
theological_decisions:
- issue: وصف يسوع بأنه «ابن يوسف»
  choice: الإبقاء على «يسوع ابن يوسف» كما قال فيلبس
  alternative: يسوع، الذي كان يُظن أنه ابن يوسف
  rationale: الآية تنقل تعريف فيلبس الأولي ليسوع في إطار اجتماعي مألوف؛ وإضافة «كان يُظن» توفيق تفسيري غير موجود في النص.
- issue: نطاق شهادة موسى والأنبياء
  choice: صياغة تجعل موسى والأنبياء كليهما يكتبان عن الشخص الذي وجده التلاميذ
  alternative: صياغة قد توهم أن «الأنبياء» تابعون لعبارة «في الشريعة» أو لا تشارك بوضوح في فعل الكتابة
  rationale: التركيب اليوناني يجعل موسى والأنبياء شاهدين كتابيين على الشخص نفسه، من غير تفصيل إضافي لطبيعة النبوءات.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كريمة. استُخدم الماضي للسرد الطبيعي، وحُفظ وصف «ابن يوسف» والتعبير المكاني «من الناصرة» دون مواءمة عقائدية أو تحويله إلى لقب.
