lexical_decisions:
- source_word: ταῦτα
  choice: هذه الأمور
  rationale: يحفظ صيغة الجمع في اسم الإشارة، ويعيد الإحالة إلى الحوار والأحداث السابقة بصياغة عربية واضحة.
- source_word: ἐν Βηθανίᾳ
  choice: في بيت عنيا
  rationale: ترجمة مكانية مباشرة وطبيعية لحرف الجر مع اسم الموضع.
- source_word: ἐγένετο
  choice: حدثت
  rationale: يدل الفعل هنا على وقوع الأحداث، و«حدثت» تعبير عربي موجز وحديث يوافق جمع «هذه الأمور».
- source_word: πέραν τοῦ Ἰορδάνου
  choice: في عبر الأردن
  rationale: ينقل معنى الموقع في الجهة الأخرى من نهر الأردن، مع الحفاظ على الإيجاز والتعبير الجغرافي العربي المألوف كتابيًا.
- source_word: ὅπου
  choice: حيث
  rationale: أداة ربط مكانية طبيعية تقدّم الجملة التي تحدد موضع نشاط يوحنا.
- source_word: ἦν ὁ Ἰωάννης βαπτίζων
  choice: كان يوحنا يعمِّد
  rationale: ينقل التركيب الدال على الاستمرار في الماضي، ويحافظ على المصطلح العربي الراسخ للفعل βαπτίζω في هذا السياق.
theological_decisions:
- issue: قراءة اسم الموضع Βηθανίᾳ («بيت عنيا») في مقابل القراءة المختلفة Βηθαβαρᾷ («بيت عبرة»)
  choice: بيت عنيا
  alternative: بيت عبرة
  rationale: يتبع المتن قراءة SBLGNT «بيت عنيا»، بينما تُذكر «بيت عبرة» في الحاشية لأنها قراءة مخطوطية وتقليد ترجمي لاحق معروف، من غير إحلالها محل قراءة النص النقدي.
