    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τὰ ἴδια
  choice: إلى ما هو له
  rationale: يحفظ صيغة المحايد الجمع في اليونانية، التي تشير إلى ما يخصه أو إلى نطاقه، من غير حصر المعنى في البيت أو الوطن، ويميّزها عن صيغة المذكر الجمع التالية الدالة على أشخاص.
- source_word: ἦλθεν
  choice: جاء
  rationale: ترجمة مباشرة وطبيعية للفعل ἔρχομαι في صيغة الماضي.
- source_word: οἱ ἴδιοι
  choice: خاصته
  rationale: تعبير عربي موجز يدل على الأشخاص المنتمين إليه، ويحافظ على المقابلة مع «ما هو له» في العبارة الأولى.
- source_word: παρέλαβον
  choice: لم يقبلوه
  rationale: يفيد هنا قبول الشخص أو الترحيب به؛ و«قبلوه» واسع الدلالة وطبيعي في العربية من غير تضييق المعنى على مجرد الاستضافة.
- source_word: αὐτόν
  choice: ـه في «يقبلوه»
  rationale: ضمير المفعول يعود إلى الكلمة/النور في السياق، ويُصاغ طبيعيًا في العربية ضميرًا متصلًا.
theological_decisions:
- issue: مرجع ودلالة الاستعمال المزدوج لكلمة ἴδιος
  choice: تشير العبارة الأولى إلى ما يخصه، بينما تشير الثانية إلى خاصته من الناس.
  alternative: أن تشير العبارتان كلتاهما إلى قومه، أو أن تعني الأولى بيته تحديدًا.
  rationale: ينتقل النص اليوناني من المحايد الجمع τὰ ἴδια إلى المذكر الجمع οἱ ἴδιοι، مما يرجح مقابلة مقصودة بين ما يخصه والأشخاص الذين هم خاصته. تحافظ الصياغة على سعة دلالة العبارة الأولى ولا تحصرها في البيت أو الوطن.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة. استُعملت «خاصته» بوصفها تعبيرًا فصيحًا مفهومًا يدل على أناس ينتمون إليه، مع إبقاء العبارة الأولى أوسع دلالة. وُضع رابط الاستدراك «لكن» لإظهار المقابلة التي تؤديها καί سياقيًا.
