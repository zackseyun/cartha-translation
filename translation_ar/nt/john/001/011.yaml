  text: He came to his own[b][a], and his own people did not receive him.
translation:
  language: ar
  text: جاء إلى ما يخصه[a]، وخاصته لم يقبلوه[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إلى ما هو له»، أو «إلى ملكه»، أو «إلى موطنه». العبارة اليونانية هنا بصيغة الجمع المحايد، وهي تختلف عن صيغة الجمع المذكر «خاصته» في العبارة التالية.'
    reason: alternative_reading
  - marker: b
