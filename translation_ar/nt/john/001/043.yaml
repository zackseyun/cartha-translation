  yaml_path: translation/nt/john/001/043.yaml
  text: The next day he wanted to go out into Galilee[a], and Jesus finds Philip and says to him[c][b], “Follow me.”
translation:
  language: ar
  text: 'وفي اليوم التالي أراد أن يخرج إلى الجليل[a]، فيجد يسوع فيلبس ويقول له[b]: «اتبعني[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يفيد حرف الجر اليوناني حركةً نحو الجليل أو إلى داخله.
    reason: lexical_alternative
  - marker: b
    text: ورد الفعلان «يجد» و«يقول» بصيغة الحاضر في اليونانية، وهو حاضر تاريخي يضفي حيوية على السرد.
