    text: قد يعني الأمر «اتبعني» مرافقة يسوع فعليًّا، ويحمل أيضًا معنى دعوته إلى أن يصير من تلاميذه.
    reason: alternative_reading
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: وفي اليوم التالي
  rationale: تعبير عربي طبيعي يحفظ تعاقب أحداث الرواية، وتؤدي الواو وظيفة الربط بالسياق السابق.
- source_word: ἠθέλησεν
  choice: أراد
  rationale: يحفظ معنى الإرادة أو الرغبة من غير أن يقوّيه إلى معنى الحسم التام مثل «قرّر».
- source_word: ἐξελθεῖν
  choice: أن يخرج
  rationale: ينقل الدلالة الأساسية لفعل الخروج، مع بقاء جهة الحركة مبيّنة بعبارة «إلى الجليل».
- source_word: εἰς τὴν Γαλιλαίαν
  choice: إلى الجليل
  rationale: «إلى» هي الصياغة العربية الطبيعية للحركة نحو مكان، ويمكن أن تشمل بحسب السياق الدخول إلى منطقته.
- source_word: εὑρίσκει
  choice: فيجد
  rationale: حُفظ الحاضر التاريخي اليوناني لإبقاء حيوية السرد، وربطت الفاء الحدث بما سبقه ربطًا طبيعيًّا.
- source_word: λέγει
  choice: ويقول
  rationale: حُفظت صيغة الحاضر التاريخي كما في الأصل، وعُطف الفعل على «يجد».
- source_word: Φίλιππον
  choice: فيلبس
  rationale: نُقل الاسم الشخصي وفق الصيغة العربية الكتابية الشائعة.
- source_word: ὁ Ἰησοῦς
  choice: يسوع
  rationale: أُبقي الاسم الصريح في موضعه الدلالي لتوضيح فاعل الفعلين في السرد.
- source_word: Ἀκολούθει μοι
  choice: اتبعني
  rationale: صيغة عربية موجزة وطبيعية تحفظ إمكان المرافقة الفعلية ودلالة الدعوة المستمرة إلى التلمذة.
theological_decisions:
- issue: دلالة أمر يسوع لفيلبس
  choice: «اتبعني» بوصفها دعوة مباشرة تحتمل المرافقة والتلمذة
  alternative: «تعال معي» بمعنى المرافقة الجسدية وحدها
  rationale: يحمل التعبير في سياقه الإنجيلي معنى التلمذة، لكنه ينشأ داخل مشهد حركة فعلية؛ لذلك حُفظ اللفظ الموجز من غير حصره في أحد الجانبين.
- issue: فاعل «أراد»
  choice: إبقاؤه مستترًا كما يسمح التركيب العربي، ثم ذكر «يسوع» حيث يصرّح به النص اليوناني
  alternative: إضافة «يسوع» بعد «أراد» منذ بداية الجملة
  rationale: الفاعل مفهوم من السياق، والأصل اليوناني لا يذكر الاسم صراحة إلا مع فعل «يجد»؛ فتحفظ الصياغة ترتيب الإفصاح في المصدر من غير غموض مخل.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم الحاضر التاريخي عمدًا موافقةً لبنية السرد اليوناني، مع صياغة طبيعية موجزة وتجنّب المصطلحات المذهبية.
