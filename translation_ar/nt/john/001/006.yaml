  text: كان هناك إنسانٌ قد أُرسل من الله، اسمه يوحنا.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγένετο
  choice: ظهر
  rationale: يُدخل الفعل شخصية جديدة إلى السرد. و«ظهر» عربية طبيعية هنا، من غير أن تحمل معنى الخلق.
- source_word: ἄνθρωπος
  choice: إنسانٌ
  rationale: يدل اللفظ على شخص بشري، وهو هنا رجل بعينه؛ و«إنسان» يحافظ على اللفظ العام في الأصل مع وضوح المرجع من الاسم.
- source_word: ἀπεσταλμένος
  choice: مُرسَلٌ
  rationale: يحفظ اسم المفعول معنى الإرسال الواقع عليه، كما يحفظ صلته المباشرة بعبارة «من الله».
- source_word: παρὰ θεοῦ
  choice: من الله
  rationale: تفيد παρά مع المضاف إليه المصدر أو المنشأ؛ لذا تحافظ «من الله» على جهة الإرسال من غير تحويل التركيز إلى مجرد الفاعلية.
- source_word: ὄνομα αὐτῷ Ἰωάννης
  choice: اسمه يوحنا
  rationale: 'صياغة عربية واضحة وموجزة تؤدي معنى التعبير اليوناني التعريفي، حرفيًا: «اسمٌ له: يوحنا».'
- source_word: Ἰωάννης
  choice: يوحنا
  rationale: الصيغة العربية الكتابية المستقرة لهذا الاسم.
theological_decisions:
- issue: طبيعة رسالة يوحنا
  choice: يُقدَّم يوحنا بوصفه مُرسَلًا من الله.
  alternative: أرسله الله.
  rationale: تحافظ عبارة «مُرسَل من الله» على المبني للمجهول وعلى دلالة المصدر في παρὰ θεοῦ، من غير إضافة تحديد لوظيفته يتجاوز النص.
translation_notes:
  register: لغة عربية فصحى واضحة ووقورة. اختيرت جملة موجزة تحاكي بنية الأصل، مع إبقاء «من الله» للدلالة على مصدر الإرسال. لا توجد حاشية لازمة؛ فبدائل صياغة الاسم في الإنجليزية لا تمثل غموضًا دلاليًا يحتاج إليه القارئ العربي.
