    reason: lexical_alternative
lexical_decisions:
- source_word: οἳ
  choice: الذين
  rationale: اسم موصول يعود إلى المذكورين في الآية السابقة، ويحافظ على الارتباط النحوي بها.
- source_word: ἐξ αἱμάτων
  choice: من دماءٍ
  rationale: يحافظ على صيغة الجمع اللافتة في اليونانية وعلى دلالة الأصل البشري أو النسب الطبيعي، مع توضيح التعبير في الحاشية.
- source_word: θελήματος
  choice: مشيئة
  rationale: تنقل معنى الإرادة أو القصد، وتحافظ على تكرار البنية في العبارتين المتوازيتين.
- source_word: σαρκὸς
  choice: جسد
  rationale: تحافظ على الصورة الأصلية وتشير في السياق إلى التناسل أو الدافع البشري الطبيعي، من غير أن تُحمَّل معنى اصطلاحيًا طائفيًا.
- source_word: ἀνδρὸς
  choice: رجل
  rationale: تنقل المفرد الدال على الذكر البالغ، ويُرجَّح أنه يشير هنا إلى دور الرجل في الإنجاب.
- source_word: ἐκ θεοῦ
  choice: من الله
  rationale: تعبير عربي طبيعي يحافظ على مقابلة المصدر الإلهي بالمصادر البشرية المنفية.
- source_word: ἐγεννήθησαν
  choice: وُلِدوا
  rationale: صيغة المبني للمجهول الطبيعية في العربية لهذا السياق، وتحفظ معنى الولادة أو المنشأ من غير استعمال لفظ قديم أو تقني.
theological_decisions:
- issue: طبيعة المقابلة بين الأصل البشري والأصل الإلهي
  choice: تصف الآية ولادةً أو منشأً ليس قائمًا على النسب الطبيعي ولا على إرادة الإنجاب البشرية، بل على الله.
  alternative: قد تُفهم العبارة على نحو أضيق بوصفها نفيًا للاتكال على النسب العرقي وحده، أو تُقرأ ضمن تفسيرات لاهوتية لاحقة ذات طابع أسراري أو ميتافيزيقي.
  rationale: النفي الثلاثي يقابل التولد البشري الطبيعي بالولادة من الله. وتحفظ الصياغة هذه المقابلة من غير فرض عقيدة طائفية تفصيلية تتجاوز منطوق النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. أُبقيت «دماء» بصيغة الجمع لصون غرابة الأصل، وأُرفقت حاشية تشرح دلالتها الاصطلاحية. كما حُفظ التوازي الثلاثي في النفي والمقابلة الختامية «بل من الله».
