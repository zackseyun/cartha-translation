  text: He was not the light[a], but came to bear witness about the light.
translation:
  language: ar
  text: لم يكن هو النور، بل جاء ليشهد للنور.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا أكثر: «لم يكن هو النور، بل لكي يشهد عن النور». لا يذكر النص اليوناني فعلًا رئيسًا صريحًا بعد «بل»، ويُفهم من السياق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἦν
  choice: لم يكن
  rationale: ينقل نفي فعل الكينونة في الماضي بوضوح وطبيعية، مع بقاء دلالة الناقص اليوناني مناسبة للسياق الوصفي.
- source_word: ἐκεῖνος
  choice: هو
  rationale: اسم الإشارة اليوناني يؤدي هنا وظيفة الإحالة الشخصية المؤكدة؛ و«هو» عربي طبيعي ويحفظ قدرًا من التوكيد دون تعبير متكلف مثل «ذلك».
- source_word: τὸ φῶς
  choice: النور
  rationale: حُفظ التعريف لأنه يشير إلى النور المحدد الذي سبق ذكره في فاتحة الإنجيل.
- source_word: ἀλλ’ ἵνα
  choice: بل جاء ليشهد
  rationale: بعد «بل» توجد في اليونانية جملة غرضية بلا فعل رئيس مصرح به. أُضيف «جاء» من السياق لتستقيم العربية، مع بيان الصياغة الأقرب إلى اللفظ في الحاشية.
- source_word: μαρτυρήσῃ
  choice: يشهد
  rationale: «يشهد» يقابل الفعل اليوناني مباشرة ويحفظ دلالته الشهادية المهمة في إنجيل يوحنا، وهو أفصح وأوجز هنا من «يؤدي شهادة».
- source_word: περὶ τοῦ φωτός
  choice: للنور
  rationale: تؤدي اللام في العربية معنى الشهادة بشأن النور على نحو طبيعي موجز؛ و«عن النور» بديل أقرب إلى البنية اليونانية.
theological_decisions:
- issue: هوية يوحنا ودوره بالنسبة إلى النور
  choice: تنفي الآية أن يكون يوحنا نفسه النور، وتجعل مجيئه لغرض الشهادة للنور.
  alternative: 'يمكن إبقاء الحذف اليوناني ظاهرًا أكثر: «لم يكن هو النور، بل لكي يشهد عن النور».'
  rationale: تحفظ الصياغة التمييز بين الشاهد والنور دون إضافة تفسير عقائدي. ولفظة «جاء» استكمال سياقي للحذف النحوي، لا تقرير لاهوتي زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُعمل «بل» لإبراز المقابلة، و«يشهد» حفاظًا على مفردات الشهادة المتكررة في يوحنا.
