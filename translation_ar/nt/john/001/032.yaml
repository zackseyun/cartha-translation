  yaml_path: translation/nt/john/001/032.yaml
  text: And John testified[a], saying, “I have seen the Spirit descending like a dove out of heaven[b], and it remained on him.”
translation:
  language: ar
  text: 'وشهد يوحنا قائلًا: «لقد رأيت الروح نازلًا من السماء[b] مثل حمامة[a]، وبقي عليه».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كحمامة». يفيد التعبيران التشبيه، وهو المعنى الأرجح للأداة اليونانية هنا.'
    reason: lexical_alternative
  - marker: b
    text: 'حرف الجر اليوناني يفيد صدور النزول من السماء، ويمكن إبراز الصورة بقول: «خارجًا من السماء».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμαρτύρησεν
  choice: شهد
  rationale: ينقل معنى الإدلاء بالشهادة بوضوح، ويحافظ على دلالة الشهادة المهمة في سياق إنجيل يوحنا.
- source_word: λέγων
  choice: قائلًا
  rationale: يحافظ على تركيب اسم الفاعل اليوناني الذي يقدّم مضمون شهادة يوحنا، وهو تعبير عربي فصيح وطبيعي.
- source_word: Τεθέαμαι
  choice: لقد رأيت
  rationale: صيغة التمام اليونانية تفيد رؤية حدثت وما زالت ذات صلة؛ و«لقد رأيت» تؤكد المعاينة من غير استعمال لفظ قديم أو متكلف.
- source_word: τὸ πνεῦμα
  choice: الروح
  rationale: السياق المباشر في يوحنا 1:32–33 يدل على روح الله؛ والتعريف يحافظ على إحالة النص من غير إضافة كلمة «القدس» غير الواردة صراحة في هذه الآية.
- source_word: καταβαῖνον
  choice: نازلًا
  rationale: يعبّر بوضوح عن الحركة إلى أسفل، ويطابق «الروح» في التذكير النحوي العربي.
- source_word: ὡς περιστερὰν
  choice: مثل حمامة
  rationale: يُظهر معنى التشبيه الطبيعي في ὡς، من غير الجزم بأن الروح صار حمامة حرفية أو اتخذ بالضرورة جسد حمامة.
- source_word: ἐξ οὐρανοῦ
  choice: من السماء
  rationale: ترجمة عربية طبيعية لحركة صادرة من موضع أو مصدر، وتحفظ صورة النزول السماوي من غير تعبير مكاني متكلف.
- source_word: ἔμεινεν
  choice: بقي
  rationale: يحافظ على المعنى الأساسي لفعل μένω وعلى صداه الموضوعي المتكرر في إنجيل يوحنا، بخلاف تعبيرات أقل اتساقًا مثل «مكث» أو «استقر».
- source_word: ἐπ’ αὐτόν
  choice: عليه
  rationale: ينقل دلالة ἐπί على وجود الروح فوق الشخص أو عليه بصياغة عربية موجزة وطبيعية.
theological_decisions:
- issue: تحديد مدلول τὸ πνεῦμα
  choice: «الروح» بوصفه روح الله
  alternative: «روح» بمعنى غير محدد أو قوة غير شخصية
  rationale: يبين السياق التالي مباشرة، ولا سيما يوحنا 1:33، أن المقصود هو الروح القدس. ومع ذلك لم تُضف كلمة «القدس» هنا لأنها غير موجودة صراحة في نص الآية.
- issue: دلالة ὡς περιστερὰν
  choice: 'تشبيه كيفية النزول: «مثل حمامة»'
  alternative: «بصفة حمامة» أو فهم العبارة على أنها تحدد تحولًا حرفيًا إلى حمامة
  rationale: تدل ὡς عادة على المشابهة هنا، لذلك تحفظ الترجمة الصورة ولا تحسم ماهية التجلي أو شكله بما يتجاوز النص.
- issue: إعادة الضمير في ἔμεινεν ἐπ’ αὐτόν
  choice: 'إبقاء الفاعل مفهومًا من «الروح»: «وبقي عليه»'
  alternative: 'إضافة ضمير صريح: «وهو بقي عليه»'
  rationale: الفعل اليوناني لا يتضمن ضميرًا مستقلًا، والعربية تسمح بفهم فاعله من السياق؛ وهذا يتجنب إثقال العبارة أو إدخال توكيد غير موجود.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة ووقورة. استُعمل «شهد» و«بقي» للمحافظة على المفردات الموضوعية المتكررة في إنجيل يوحنا، مع تجنب الألفاظ القديمة مثل «عاينت» و«حلّ» التي قد تضيف دلالات أو تبدو أقل طبيعية.
