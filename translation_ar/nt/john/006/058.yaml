  yaml_path: translation/nt/john/006/058.yaml
  text: This is the bread that came down from heaven[a], not as the fathers ate and died[b]; the one who eats this bread will live forever.
translation:
  language: ar
  text: هذا هو الخبز الذي نزل من السماء، ليس كالذي أكله الآباء[a] وماتوا؛ مَن يأكل هذا الخبز فسيحيا إلى الأبد[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الأسلاف». ويُرجَّح أن «الآباء» تشير إلى آباء إسرائيل الذين أكلوا في البرية.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «إلى الدهر/العصر»، وهو تعبير يفيد حياة تدوم إلى الأبد.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός ἐστιν ὁ ἄρτος
  choice: هذا هو الخبز
  rationale: صياغة عربية مباشرة وطبيعية تحافظ على اسم الإشارة وأداة التعريف، إذ يشير السياق إلى خبز محدد سبق الحديث عنه.
- source_word: ὁ ἐξ οὐρανοῦ καταβάς
  choice: الذي نزل من السماء
  rationale: حُوِّل اسم الفاعل اليوناني الماضي إلى جملة صلة عربية واضحة، مع الحفاظ على معنى المصدر «من السماء».
- source_word: οὐ καθὼς ἔφαγον οἱ πατέρες καὶ ἀπέθανον
  choice: لا كالذي أكله الآباء وماتوا
  rationale: تُظهر الصياغة المقارنة الموجزة في اليونانية بصياغة عربية مفهومة، من غير إضافة «المنّ» أو ضمير ملكية غير موجودين في النص المعتمد.
- source_word: οἱ πατέρες
  choice: الآباء
  rationale: يحافظ اللفظ على الصيغة المذكرة في اليونانية وعلى الإشارة المرجحة إلى آباء إسرائيل في البرية؛ وأُثبت البديل «الأسلاف» في الحاشية.
- source_word: ὁ τρώγων τοῦτον τὸν ἄρτον
  choice: مَن يأكل هذا الخبز
  rationale: تنقل «مَن» الصفة الاسمية العامة، ويؤدي «يأكل» المعنى الطبيعي للفعل من غير تضخيم دلالته إلى «يمضغ» أو تحميله تفسيرًا لاهوتيًا مخصوصًا.
- source_word: ζήσει εἰς τὸν αἰῶνα
  choice: فسيحيا إلى الأبد
  rationale: تعبير عربي مألوف ينقل الاصطلاح اليوحناوي الدال على حياة دائمة، مع بيان صورته الأقرب إلى الحرفية في الحاشية.
theological_decisions:
- issue: مرجع «الآباء» في المقارنة بخبز البرية
  choice: الإبقاء على «الآباء»
  alternative: الأسلاف
  rationale: النص اليوناني مذكر جمع، ويرجح أنه يستحضر آباء إسرائيل الذين أكلوا في البرية. ولا يضيف النص هنا لفظ «المنّ»، لذلك لم يُدرج في المتن.
- issue: دلالة الفعل τρώγων في خطاب خبز الحياة
  choice: مَن يأكل
  alternative: مَن يتناول / مَن يقتات
  rationale: «يأكل» يحفظ الصورة اللفظية وتوترها اللاهوتي من غير حسم الجدل بين القراءة الأسرارية والقراءة المجازية الإيمانية.
- issue: مدى عبارة εἰς τὸν αἰῶνα
  choice: إلى الأبد
  alternative: إلى الدهر
  rationale: الترجمة المختارة هي التعبير العربي الطبيعي عن الدوام المقصود في هذا السياق، بينما تُذكر البنية الأقرب إلى الحرفية في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حوفظ على صورة الخبز والأكل من دون إدخال مصطلحات طائفية أو تفسير أسراري أو مجازي في صلب الترجمة، ووُضعت علامتا الحاشيتين عند اللفظين اللذين تشرحانهما مباشرة.
