  terminology: «سلة» مقابلة عامة مناسبة لـκοφίνος من غير ادعاء حجم أو نوع محدد، و«كِسَر» أدق من «فتات» في سياق قطع الخبز المكسورة. لا توجد مصطلحات لاهوتية محل إشكال.
