  text: εἰδὼς δὲ ὁ Ἰησοῦς ἐν ἑαυτῷ ὅτι γογγύζουσιν περὶ τούτου οἱ μαθηταὶ αὐτοῦ εἶπεν αὐτοῖς· Τοῦτο ὑμᾶς σκανδαλίζει;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/061.yaml
  text: But Jesus[a], knowing in himself that his disciples were grumbling about this, said to them, “Does this offend you?"
translation:
  language: ar
  text: 'لكن يسوع، إذ كان يعلم في نفسه أن تلاميذه يتذمّرون من هذا، قال لهم: «أهذا يُعثِركم؟»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أهذا يثير استياءكم؟» أو «أهذا يسبّب لكم عثرة؟»'
    reason: بدائل معجمية توضّح أن الفعل قد يدل على الاستياء أو على التعثر المؤدي إلى الرفض.
lexical_decisions:
- source_word: εἰδὼς
  choice: إذ كان يعلم
  rationale: ينقل معنى اسم الفاعل الدال على علمٍ متزامن مع الحدث، بصياغة عربية طبيعية مرتبطة بالفعل الرئيس.
- source_word: ἐν ἑαυτῷ
  choice: في نفسه
  rationale: يحفظ دلالة أن يسوع عرف الأمر في باطنه، لا من تقرير خارجي، من غير توسع تفسيري.
- source_word: γογγύζουσιν
  choice: يتذمّرون
  rationale: يفيد الشكوى الخافتة وعدم الرضا، وهو أوضح في العربية المعاصرة من «يتمتمون» وأدق سياقيًا من مجرد «يشكون».
- source_word: περὶ τούτου
  choice: من هذا
  rationale: تعبير عربي طبيعي للتذمر بسبب الكلام السابق، ويحفظ إحالة اسم الإشارة من غير إضافة تفسيرية.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: تلاميذه
  rationale: صياغة عربية موجزة وطبيعية، ولا تحصر المقصود في الاثني عشر.
- source_word: Τοῦτο
  choice: هذا
  rationale: يحفظ إيجاز اسم الإشارة في اليونانية ولا يضيف «التعليم» أو «الكلام».
- source_word: σκανδαλίζει
  choice: يُعثِركم
  rationale: يحفظ صورة العثرة والمعنى المحتمل المتمثل في التعثر المؤدي إلى الرفض أو الارتداد، مع بيان البديل العربي الأكثر تداولًا في الحاشية.
theological_decisions:
- issue: دلالة σκανδαλίζει بين الاستياء والتعثر المؤدي إلى الرفض
  choice: أهذا يُعثِركم؟
  alternative: أهذا يسيء إليكم؟ / أهذا يصدمكم؟
  rationale: «يُعثِركم» يحافظ على الاستعارة اليونانية وعلى التوتر بين الانزعاج من القول والتعثر بسببه حتى رفضه، بدل قصر المعنى على شعور بالإهانة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «يتذمّرون» بدل اللفظ التراثي «يتمتمون»، و«يُعثِركم» للمحافظة على الصورة الكتابية مع شرحها في الحاشية.
