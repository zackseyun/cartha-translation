base_translation:
  language: en
  yaml_path: translation/nt/john/006/015.yaml
  text: So Jesus[a], knowing that they were about to come and seize him in order to make him king, withdrew again to the mountain by himself.
translation:
  language: ar
  text: فإذ علم يسوع أنهم كانوا على وشك أن يأتوا ويأخذوه بالقوة[a] ليجعلوه ملكًا، انصرف ثانيةً إلى الجبل وحده.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يختطفوه».'
    reason: بديل معجمي للفعل ἁρπάζειν؛ أما المتن فيصرّح بدلالة الأخذ القسري من غير تخصيص معنى الاختطاف الحديث.
lexical_decisions:
- source_word: οὖν
  choice: فـ
  rationale: تفيد الانتقال والنتيجة السردية المترتبة على الحدث السابق، بصياغة عربية طبيعية موجزة.
- source_word: γνοὺς
  choice: إذ علم
  rationale: ينقل اسم الفاعل الظرفي بوصفه سببًا أو ظرفًا لانصراف يسوع، من غير زيادة تفسيرية.
- source_word: μέλλουσιν ἔρχεσθαι
  choice: مزمعون أن يأتوا
  rationale: يحفظ معنى الفعل الوشيك المقصود، وتلائم العبارة الأسلوب العربي الفصيح.
- source_word: ἁρπάζειν
  choice: يختطفوه
  rationale: ينقل معنى الأخذ المفاجئ أو القسري في الفعل اليوناني؛ وتوضح الحاشية وجه القوة في السياق.
- source_word: ἵνα ποιήσωσιν βασιλέα
  choice: ليجعلوه ملكًا
  rationale: تعبر اللام بوضوح وإيجاز عن الغرض الذي تدل عليه ἵνα مع صيغة الالتزام.
- source_word: ἀνεχώρησεν
  choice: انصرف
  rationale: يدل على الابتعاد عن المكان والموقف، مع بقاء دلالة التجنب السياقية دون مبالغة مثل «هرب».
- source_word: πάλιν
  choice: ثانيةً
  rationale: يحفظ معنى التكرار بصياغة عربية طبيعية.
- source_word: εἰς τὸ ὄρος
  choice: إلى الجبل
  rationale: ترجمة مباشرة لا تخصص الموضع بما لا يقوله النص.
- source_word: αὐτὸς μόνος
  choice: وحده
  rationale: تؤدي في العربية معنى الانفراد المؤكد طبيعيًا من غير حشو.
theological_decisions:
- issue: طبيعة محاولة الجمع تنصيب يسوع ملكًا
  choice: يختطفوه ليجعلوه ملكًا
  alternative: يأخذوه ليجعلوه ملكًا
  rationale: الفعل ἁρπάζειν يتضمن الأخذ بالقوة أو على نحو قسري، فلا ينبغي تلطيف المشهد إلى مجرد دعوة أو تنصيب طوعي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «مزمعون» للمحافظة على معنى الوشيك، و«وحده» لنقل التأكيد في αὐτὸς μόνος بصورة طبيعية.
