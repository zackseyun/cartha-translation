  text: Ἐμάχοντο οὖν πρὸς ἀλλήλους οἱ Ἰουδαῖοι λέγοντες· Πῶς δύναται οὗτος ἡμῖν δοῦναι τὴν σάρκα ⸀αὐτοῦ φαγεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/052.yaml
  text: So the Jews were arguing among themselves[a], saying[b], “How can this man give us his flesh to eat?”
translation:
  language: ar
  text: 'فكان اليهود يتجادلون فيما بينهم[a] قائلين: «كيف يستطيع هذا الرجل أن يعطينا لحمه[b] لنأكله؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو «أهل اليهودية»، أو بحسب السياق «قادة اليهود». واليونانية تقول ببساطة: «اليهود».'
    reason: alternative_reading
  - marker: b
    text: أو «جسده». الكلمة اليونانية هي σάρξ، ومعناها الأساسي «لحم»؛ وقد حُفظ هذا اللفظ في المتن لصون التعبير المحسوس والتوتر المقصود في الكلام.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐμάχοντο
  choice: أخذوا يتجادلون
  rationale: يدل الماضي الناقص على جدال مستمر، وتفيد صيغة «أخذوا يتجادلون» بدء النزاع واستمراره في سياق السرد، من غير أن توحي بعراك جسدي.
- source_word: οὖν
  choice: فـ
  rationale: الفاء طبيعية في العربية وتربط رد فعلهم بالكلام السابق، محافظةً على القوة الاستنتاجية أو السردية للأداة.
- source_word: πρὸς ἀλλήλους
  choice: فيما بينهم
  rationale: تعبير عربي مألوف ينقل معنى التنازع المتبادل داخل الجماعة.
- source_word: οἱ Ἰουδαῖοι
  choice: اليهود
  rationale: هذا هو اللفظ الصريح في اليونانية؛ ولا يضيّق النص نفسه المرجع إلى قادة اليهود أو أهل اليهودية، لذلك يُحفظ الاحتمال في الحاشية.
- source_word: λέγοντες
  choice: قائلين
  rationale: ينقل اسم الفاعل الذي يقدم مضمون جدالهم بصياغة عربية فصيحة ومباشرة.
- source_word: Πῶς δύναται
  choice: كيف يستطيع
  rationale: ترجمة طبيعية للسؤال عن الإمكان أو القدرة.
- source_word: οὗτος
  choice: هذا
  rationale: يحافظ اسم الإشارة على نبرة الإبعاد أو الازدراء المحتملة من غير إضافة اسم «الرجل» غير الموجود صراحةً في اليونانية.
- source_word: ἡμῖν
  choice: لنا
  rationale: ينقل المفعول غير المباشر مع فعل «يعطي» بصياغة عربية طبيعية.
- source_word: δοῦναι
  choice: يعطينا
  rationale: ينقل المعنى الأساسي للفعل δίδωμι بلا تشديد أو تخفيف تفسيري.
- source_word: τὴν σάρκα αὐτοῦ
  choice: جسده
  rationale: «الجسد» هو المقابل العربي الطبيعي الملموس لـσάρξ هنا، ويحفظ حدة الصورة من دون تفسيرها؛ وتوضح الحاشية إمكان التعبير بـ«لحمه» للمحافظة على الفرق اللفظي.
- source_word: φαγεῖν
  choice: لنأكله
  rationale: ينقل مصدر الأكل بوصفه الغرض أو الفعل المتمم للعطاء في تركيب عربي واضح.
theological_decisions:
- issue: ترجمة σάρξ في سياق ذي توتر لاهوتي وحسي
  choice: جسده
  alternative: لحمه
  rationale: المقصود في رد السامعين معنى مادي محسوس، لا «الطبيعة الخاطئة». لفظ «جسده» عربي واضح وكريم، فيما تحفظ الحاشية «لحمه» بوصفه المقابل الأشد حرفية، من غير حسم طبيعة الأكل أو فرض تفسير أسراري.
- issue: تحديد مرجع οἱ Ἰουδαῖοι في إنجيل يوحنا
  choice: اليهود
  alternative: أهل اليهودية، أو قادة اليهود بحسب السياق
  rationale: يتبع المتن اللفظ اليوناني العام ولا يضيّق مدلوله تفسيرياً، بينما تنبه الحاشية إلى البدائل السياقية منعاً للتعميم غير المقصود.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت الفاء للربط السردي، و«أخذوا يتجادلون» لإبراز استمرار الفعل. حُفظ اسم الإشارة «هذا» لما قد يحمله من نبرة إبعاد، وأُبقي مرجع «اليهود» وتفسير σάρξ مفتوحين مع بيان البدائل في الحواشي.
