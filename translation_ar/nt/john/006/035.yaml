  text: ⸀Εἶπεν αὐτοῖς ὁ Ἰησοῦς· Ἐγώ εἰμι ὁ ἄρτος τῆς ζωῆς· ὁ ἐρχόμενος πρὸς ἐμὲ οὐ μὴ πεινάσῃ, καὶ ὁ πιστεύων εἰς ⸀ἐμὲ οὐ μὴ ⸀διψήσει πώποτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/035.yaml
  text: Jesus said to them, “I am the bread of life; the one who comes to me will never hunger, and the one who believes in me will never thirst again.”
translation:
  language: ar
  text: 'قال لهم يسوع: «أنا هو خبز الحياة. من يُقبِل إليَّ فلن يجوع أبدًا، ومن يؤمن بي فلن يعطش أبدًا».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًّا: «لن يعطش قط»؛ ففي اليونانية نفيٌ مؤكد مع كلمة تفيد «في أي وقت».'
    reason: بيان قوة النفي والحفاظ على الدلالة الحرفية لـ πώποτε.
lexical_decisions:
- source_word: Εἶπεν αὐτοῖς ὁ Ἰησοῦς
  choice: قال لهم يسوع
  rationale: صياغة عربية سردية طبيعية تحافظ على الفعل الماضي وعلى المفعول غير المباشر.
- source_word: Ἐγώ εἰμι
  choice: أنا هو
  rationale: يحافظ على ضمير المتكلم الصريح ذي النبرة التوكيدية وعلى صيغة التعريف المهيبة، من غير إضافة تفسير لاهوتي.
- source_word: ὁ ἄρτος τῆς ζωῆς
  choice: خبز الحياة
  rationale: ترجمة قريبة واصطلاحية تحفظ تركيب الإضافة وقوة الاستعارة، بخلاف «الخبز الواهب للحياة» الأكثر تفسيرًا.
- source_word: ὁ ἐρχόμενος πρὸς ἐμὲ
  choice: من يُقبِل إليَّ
  rationale: ينقل اسم الفاعل الحاضر بمعنى عام مستمر، ويُظهر دلالة الحركة نحو يسوع التي تحملها πρός.
- source_word: οὐ μὴ πεινάσῃ
  choice: فلن يجوع أبدًا
  rationale: «لن» مع «أبدًا» تنقل النفي اليوناني المؤكد بصياغة عربية طبيعية.
- source_word: ὁ πιστεύων εἰς ἐμὲ
  choice: من يؤمن بي
  rationale: «يؤمن بـ» هو المقابل العربي المألوف والشفاف لتركيب πιστεύω εἰς في الاستعمال اليوحناوي، من غير اختزاله في معنى الثقة وحده.
- source_word: οὐ μὴ διψήσει πώποτε
  choice: فلن يعطش أبدًا
  rationale: يحافظ على النفي الشديد وعلى معنى πώποτε، أي «في أي وقت قط»، ولا يضيف معنى «مرة أخرى» غير الموجود في اليونانية.
theological_decisions:
- issue: دلالة Ἐγώ εἰμι في تعريف يسوع لنفسه
  choice: أنا هو
  alternative: أنا
  rationale: تُبقي الصياغة المباشرة والتوكيد ظاهرين، وتتيح لأصداء أقوال «أنا هو» اليوحناوية أن تبقى من غير شرح عقائدي زائد.
- issue: ترجمة πιστεύων εἰς ἐμέ
  choice: من يؤمن بي
  alternative: من يثق بي
  rationale: «يؤمن بي» تحفظ مصطلح الإيمان والاستعمال اليوحناوي الراسخ، بينما «يثق بي» تبرز جانبًا صحيحًا لكنها أضيق دلالة.
- issue: مدى نفي العطش
  choice: فلن يعطش أبدًا
  alternative: فلن يعطش مرة أخرى
  rationale: πώποτε تعني «قط/في أي وقت»، ولذلك لا ينبغي إدخال معنى التكرار الذي توحي به عبارة «مرة أخرى».
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدمت «يُقبِل إليَّ» لإبراز الحركة المقصودة في الأصل، و«أبدًا» لنقل النفي المؤكد بصورة طبيعية. وُضع مؤشر الحاشية بعد الاقتباس كله ليتصل بعبارة العطش الختامية.
