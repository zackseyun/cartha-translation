translation:
  language: ar
  text: وكان البحر يضطرب لأن ريحًا شديدة كانت تهبّ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وكان البحر يهيج»، أو: «وكان البحر يتعالى».'
    reason: بدائل معجمية للفعل διεγείρετο، الذي قد يدل على اضطراب البحر أو هيجانه أو ارتفاعه.
lexical_decisions:
- source_word: ἥ τε θάλασσα
  choice: وكان البحر
  rationale: لفظة θάλασσα تعني «البحر»، والسياق يشير إلى بحر الجليل، لكن النص اليوناني يستعمل الاسم العام. ونُقلت τε بواو وصل خفيفة.
- source_word: ἀνέμου μεγάλου
  choice: ريحًا شديدة
  rationale: ἄνεμος تعني «ريح»، وμέγας مع الريح تُؤدَّى طبيعيًا في العربية بـ«شديدة» من غير مبالغة إلى معنى العنف.
- source_word: πνέοντος
  choice: كانت تهبّ
  rationale: اسم الفاعل المضارع يصف ظرفًا مستمرًا، وصيغته العربية في جملة سببية تحافظ على الاستمرار وعلى علاقته بحالة البحر.
- source_word: διεγείρετο
  choice: يضطرب
  rationale: الفعل في صيغة الماضي الناقص المبني للمجهول يصور حركة متواصلة تصيب البحر. «يضطرب» تعبير عربي طبيعي يحفظ معنى الهيجان والحركة، من غير إضافة صورة أمواج تتقاذف لم يصرح بها النص.
