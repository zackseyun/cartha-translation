base_translation:
  language: en
  yaml_path: translation/nt/john/006/005.yaml
  text: So Jesus[a], lifting up his eyes and seeing that a large crowd was coming toward him, said to Philip[c][b], “Where are we to buy bread so that these may eat?”
translation:
  language: ar
  text: 'فرفع يسوع عينيه، ورأى جمعًا كثيرًا مقبلًا إليه، فقال لفيلبس: «من أين نشتري خبزًا[a] ليأكل هؤلاء؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أرغفةً». يمكن للكلمة اليونانية أن تدل على الخبز عمومًا أو على أرغفة منفردة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπάρας ... τοὺς ὀφθαλμούς
  choice: رفع ... عينيه
  rationale: يحافظ على التعبير اليوناني الاصطلاحي بصياغة عربية طبيعية، مع استعمال ضمير الملكية الملائم لأعضاء الجسد.
- source_word: οὖν
  choice: فـ
  rationale: الفاء تصل الآية بسياقها وتؤدي معنى الانتقال أو النتيجة السردية من غير تثقيل العبارة بـ«لذلك».
- source_word: θεασάμενος
  choice: رأى
  rationale: ينقل معنى المعاينة المقصودة بوضوح، وتنسيق الفعل مع ما قبله طبيعي في السرد العربي.
- source_word: πολὺς ὄχλος
  choice: جمعًا كثيرًا
  rationale: ترجمة واضحة تدل على كثرة عدد الناس، من غير إيحاء بمعنى العظمة أو المكانة.
- source_word: ἔρχεται πρὸς αὐτόν
  choice: مقبلًا إليه
  rationale: ينقل الحركة الجارية في اتجاه يسوع بصياغة عربية موجزة وطبيعية.
- source_word: λέγει πρὸς Φίλιππον
  choice: فقال لفيلبس
  rationale: صيغ المضارع التاريخي بالماضي بما يلائم السرد العربي، وحُفظ توجيه الكلام إلى فيلبس.
- source_word: Πόθεν ἀγοράσωμεν
  choice: من أين نشتري
  rationale: «من أين» تقابل الدلالة المصدرية لـΠόθεν، والمضارع العربي هنا يؤدي معنى السؤال التداولي المقصود من صيغة المداولات اليونانية.
- source_word: ἄρτους
  choice: خبزًا
  rationale: لفظة ἄρτος قد تدل على الخبز عمومًا أو على الأرغفة؛ واختيار «خبزًا» طبيعي في سياق إطعام الجمع مع إثبات البديل في الحاشية.
- source_word: ἵνα φάγωσιν οὗτοι
  choice: ليأكل هؤلاء
  rationale: لام التعليل تنقل غرض الشراء، و«هؤلاء» تحفظ الإشارة المباشرة إلى الحاضرين.
theological_decisions:
- issue: صياغة المضارع التاريخي والتراكيب الحالية في السرد
  choice: استعمال الماضي «فقال» مع تنسيق أفعال المعاينة بالعربية
  alternative: 'المحافظة الشكلية على المضارع: «يقول لفيلبس»، أو إبقاء التراكيب الحالية حرفيًا'
  rationale: القرار أسلوبي لا عقائدي؛ فهو يجعل السرد عربيًا طبيعيًا مع الحفاظ على ترتيب الأفعال ومضمونها.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظت صورة رفع العينين، واستُعملت الفاء لأداء رابط οὖν بسلاسة، وتُرك السؤال بصيغته المباشرة من غير إضافة تفسير لنية يسوع.
