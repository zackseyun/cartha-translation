  yaml_path: translation/nt/john/006/044.yaml
  text: No one is able to come to me unless the Father who sent me draws him[b][a], and I will raise him up on the last day.
translation:
  language: ar
  text: لا يقدر أحد أن يأتي إليّ إن لم يجتذبه[a][b] الآب الذي أرسلني، وأنا أقيمه في اليوم الأخير.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يجرّه» أو «يسحبه». قد يحمل الفعل اليوناني معنى أقوى للجذب أو السحب؛ واستُعمل «يجتذبه» في المتن للمحافظة على مدى اللفظ من غير فرض تفسير لاهوتي محدد لكيفية إحضار الآب الإنسان إلى الابن.'
    reason: lexical_alternative
  - marker: b
    text: يستعمل النص اليوناني ضمير المذكر المفرد، لكن دلالته هنا تمثيلية عامة، فالقول ينطبق على كل إنسان، لا على الذكور وحدهم.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς
  choice: لا ... أحد
  rationale: صياغة عربية فصيحة طبيعية تحفظ النفي الشامل.
- source_word: δύναται
  choice: يقدر
  rationale: ينقل معنى القدرة صراحة، ويحفظ قوة القول عن عدم الاستطاعة.
- source_word: ἐλθεῖν πρός με
  choice: أن يأتي إليَّ
  rationale: ترجمة مباشرة وطبيعية لحركة المجيء نحو يسوع، من غير تفسير زائد لدلالتها في السياق.
- source_word: ἐὰν μὴ
  choice: إن لم
  rationale: تركيب شرطي عربي واضح يؤدي معنى الاستثناء الشرطي في اليونانية.
- source_word: ὁ πατὴρ ὁ πέμψας με
  choice: الآب الذي أرسلني
  rationale: يحفظ لقب «الآب»، ويترجم اسم الفاعل المعرّف بجملة صلة عربية سلسة.
- source_word: ἑλκύσῃ
  choice: يجتذبه
  rationale: «يجتذب» يحفظ معنى الجذب والتحريك نحو جهة ما، من غير أن يفرض وحده تصورًا لاهوتيًا محددًا عن كيفية فعل الآب؛ وتُذكر البدائل الأقوى في الحاشية.
- source_word: αὐτόν
  choice: ـه
  rationale: ضمير المذكر المفرد يطابق النص اليوناني، وله هنا دلالة تمثيلية عامة تشمل الإنسان أيًّا كان جنسه.
- source_word: κἀγὼ
  choice: وأنا
  rationale: ينقل اتصال καί وتوكيد الضمير ἐγώ بصياغة عربية طبيعية.
- source_word: ἀναστήσω
  choice: أقيمه
  rationale: تعبير عربي كتابي واضح عن الإقامة من الموت، ويحافظ على الصيغة الفعلية بدل استبدالها باسم اصطلاحي.
- source_word: ἐν τῇ ἐσχάτῃ ἡμέρᾳ
  choice: في اليوم الأخير
  rationale: صياغة عربية مألوفة تحفظ الإشارة الأخروية كما هي.
theological_decisions:
- issue: دلالة ἑλκύσῃ في سياق خلاصي موضع خلاف
  choice: يجتذبه
  alternative: يجرّه أو يسحبه
  rationale: قد يدل الفعل على جذب قوي أو جرّ في بعض السياقات، لكن «يجتذب» هنا يبقي مدى الدلالة مفتوحًا ولا يحسم آلية النعمة وفق تصور مذهبي بعينه.
- issue: الدلالة العامة لضمير المذكر αὐτόν
  choice: ضمير المذكر المفرد «ـه»
  alternative: ذلك الإنسان
  rationale: يحافظ الاختيار على صورة النص اليوناني، مع بيان أن المذكر هنا تمثيلي عام وليس حصرًا في الذكور.
