  text: So when the people saw the sign that he had done[a], they were saying[b], “This truly is the Prophet who is coming into the world.”
translation:
  language: ar
  text: 'فلما رأى الناس الآية التي صنعها[a]، كانوا يقولون: «هذا هو حقًّا النبي الآتي إلى العالم».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «المعجزة التي صنعها». يستعمل يوحنا عادةً كلمة «آية» (σημεῖον) ليبرز ما تكشفه أعمال يسوع من معنى، لا طابعها المعجزي وحده.'
    reason: lexical_alternative
  - marker: b
    text: 'يُرجَّح أن عبارة «النبي» تشير إلى النبي المنتظر الذي يكون مثل موسى (التثنية 18: 15–18).'
    reason: cross_reference
lexical_decisions:
- source_word: οἱ οὖν ἄνθρωποι
  choice: فلما رأى الناس
  rationale: تدل ἄνθρωποι هنا على الناس في الجمع لا على الذكور حصرًا. ونُقل οὖν مع الظرفية التي في اسم الفاعل بصياغة «فلما» الطبيعية في السرد العربي، إذ تربط رد فعلهم بما سبق.
- source_word: ἰδόντες
  choice: رأى
  rationale: نُقل اسم الفاعل الماضي بفعل ماضٍ داخل تركيب «فلما»، بما يحفظ سبق الرؤية على قولهم ويأتي عربيًّا سلسًا.
- source_word: ὃ ἐποίησεν σημεῖον
  choice: الآية التي صنعها
  rationale: تحفظ «الآية» الدلالة الكاشفة لكلمة σημεῖον في يوحنا، بدل اختزالها في مجرد عمل خارق. و«صنعها» تقابل ἐποίησεν مباشرة وبأسلوب عربي فصيح.
- source_word: ἔλεγον
  choice: أخذوا يقولون
  rationale: ينقل هذا التركيب جانب الاستمرار أو التكرر في صيغة الماضي الناقص، بدل جعله قولًا لحظيًّا فقط.
- source_word: ἀληθῶς
  choice: حقًّا
  rationale: تؤدي معنى التأكيد على صدق التعرّف بصورة موجزة وطبيعية.
- source_word: ὁ προφήτης
  choice: النبي
  rationale: أداة التعريف تدل على شخصية منتظرة ومعهودة في السياق، مع إبقاء هويتها بلا شرح زائد داخل المتن.
- source_word: ὁ ἐρχόμενος εἰς τὸν κόσμον
  choice: الآتي إلى العالم
  rationale: يحفظ الوصف الاسمي وصيغة الحضور في العبارة اليونانية، دون تحويلها تفسيريًّا إلى «الذي كان مزمعًا أن يأتي».
theological_decisions:
- issue: هوية «النبي»
  choice: إبقاء العبارة «النبي» معرفة من غير تعيين صريح في المتن
  alternative: النبي الذي مثل موسى
  rationale: 'يرجح أن القول يلمّح إلى النبي المنتظر بحسب التثنية 18: 15–18، لكن النص اليوناني لا يصرح إلا بـ«النبي»، لذلك تُحفظ الإشارة والتوتر التفسيري ويُذكر الاحتمال في الحاشية.'
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «فلما» لتجميع الرابط السردي وسبق الرؤية بصورة طبيعية، و«أخذوا يقولون» لإظهار الاستمرار في ἔλεγον. وُضعت علامتا الحاشية كلتاهما في المتن، مع نقل الحاشية الثانية إلى موضعها المنطقي بعد الجملة التي تتضمن «النبي».
