  text: But he was saying this to test him[a], for he himself knew what he was about to do.
translation:
  language: ar
  text: وقال هذا ليمتحنه[a]، لأنه هو نفسه كان يعلم ما كان مزمعًا أن يفعله.
  philosophy: optimal-equivalence
  footnotes:
