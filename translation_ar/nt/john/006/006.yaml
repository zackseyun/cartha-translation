lexical_decisions:
- source_word: τοῦτο δὲ ἔλεγεν
  choice: وإنما قال هذا
  rationale: تفيد δέ هنا انتقالًا تفسيريًا مع شيء من المقابلة، وتؤدي «وإنما» طبيعيًا معنى أن قوله كان لغرض مخصوص. وصيغة الماضي «قال» أفصح في السرد العربي، مع أن اليونانية تستعمل الماضي الناقص.
- source_word: πειράζων αὐτόν
  choice: ليمتحنه
  rationale: السياق يدل على الاختبار وإظهار ما عند فيلبس، لا على الإغراء بالشر. واللام تُظهر بوضوح القوة الغرضية لاسم الفاعل اليوناني.
- source_word: αὐτὸς γὰρ ᾔδει
  choice: لأنه هو نفسه كان يعلم
  rationale: تحفظ «هو نفسه» توكيد الضمير الصريح αὐτός، ويعبّر «كان يعلم» عن حالة المعرفة السابقة والمستمرة في سياق السرد.
- source_word: τί ἔμελλεν ποιεῖν
  choice: ما هو مزمع أن يفعله
  rationale: تحفظ «مزمع» دلالة μέλλω التي قد تجمع بين القصد وقرب الفعل، دون حصرها في أحد المعنيين.
theological_decisions:
- issue: دلالة πειράζων في فعل يسوع تجاه فيلبس
  choice: ليمتحنه
  alternative: ليجرّبه؛ ليفتنه
  rationale: المعنى السياقي هو الاختبار أو التحقق مما عند فيلبس، وليس إغراءه بالشر. وتوضح الحاشية البديل المعجمي دون إدخال حكم عقائدي زائد.
- issue: التوكيد على معرفة يسوع السابقة
  choice: هو نفسه كان يعلم
  alternative: كان يعلم
  rationale: إبقاء «هو نفسه» يحفظ توكيد αὐτός ويبرز قصد يسوع ومعرفته من غير توسيع لاهوتي يتجاوز النص.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «ليمتحنه» بوصفه التعبير الأوضح في السياق، و«مزمع» للحفاظ على التوتر الدلالي بين القصد وقرب وقوع الفعل.
