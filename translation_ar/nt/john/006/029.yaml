base_translation:
  language: en
  yaml_path: translation/nt/john/006/029.yaml
  text: 'Jesus answered and said to them[b][a], “This is the work of God: that you believe in the one whom he has sent.”'
translation:
  language: ar
  text: 'فأجابهم يسوع قائلًا: «هذا هو عمل الله[a]: أن تؤمنوا[b] بالذي أرسله».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «العمل الذي يطلبه الله»، أو «العمل الذي يعمله الله». تحتمل العبارة اليونانية أكثر من معنى، ولذلك يحافظ المتن على هذا الاحتمال.
    reason: alternative_reading
  - marker: b
    text: أو «أن تثقوا بالذي أرسله».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη ὁ Ἰησοῦς καὶ εἶπεν αὐτοῖς
  choice: فأجابهم يسوع قائلًا
  rationale: صياغة عربية طبيعية تحفظ فعلي الجواب والقول في اليونانية من غير تكرار ثقيل.
- source_word: Τοῦτό ἐστιν
  choice: هذا هو
  rationale: ينقل اسم الإشارة وفعل الكينونة ويحافظ على نبرة التحديد والتوكيد.
- source_word: τὸ ἔργον τοῦ θεοῦ
  choice: عمل الله
  rationale: ترجمة قريبة تحافظ على احتمال أن يكون المقصود العمل الذي يطلبه الله أو العمل الذي يعمله الله.
- source_word: ἵνα πιστεύητε
  choice: أن تؤمنوا
  rationale: تؤدي جملة ἵνα هنا بوصفها مبينة لمضمون العمل، وتنقل πιστεύω بصيغته العربية المألوفة.
- source_word: εἰς ὃν
  choice: بالذي
  rationale: الفعل العربي «آمن بـ» هو المقابل الطبيعي لتركيب πιστεύω εἰς، والموصول يدل بوضوح على شخص.
- source_word: ἀπέστειλεν ἐκεῖνος
  choice: أرسله
  rationale: الفاعل المفهوم من السياق هو الله؛ والضمير المستتر في العربية يجنّب صياغة ثقيلة، مع إبقاء فعل الإرسال في الماضي كما في اليونانية.
theological_decisions:
- issue: دلالة الإضافة في «عمل الله» (τοῦ θεοῦ)
  choice: الإبقاء على عبارة «عمل الله» في المتن
  alternative: «العمل الذي يطلبه الله» أو «العمل الذي يعمله الله»
  rationale: الإضافة اليونانية تحتمل أن تشير إلى العمل المطلوب من الله أو الصادر عنه. والسياق يؤيد الاحتمال الأول، لكن صياغة جواب يسوع لا تستبعد الثاني؛ لذلك لا يحسم المتن هذا التوتر.
- issue: دلالة πιστεύητε مع εἰς
  choice: «أن تؤمنوا بالذي»
  alternative: «أن تثقوا بالذي»
  rationale: «آمن بـ» هو التعبير العربي الكتابي والطبيعي لهذا التركيب، بينما «ثق بـ» يبرز جانب الاتكال المشروع دلاليًا من غير أن يكون لازمًا في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «فأجابهم يسوع قائلًا» لتفادي ثقل «أجاب وقال لهم»، مع حفظ البنية السردية. وُضعت علامتا الحاشية بعد العبارتين اللتين تفسرانهما مباشرة.
