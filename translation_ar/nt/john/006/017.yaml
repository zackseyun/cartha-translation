source:
  edition: SBLGNT
  text: καὶ ἐμβάντες ⸀εἰς πλοῖον ἤρχοντο πέραν τῆς θαλάσσης εἰς Καφαρναούμ. καὶ σκοτία ἤδη ἐγεγόνει καὶ ⸀οὔπω ἐληλύθει πρὸς αὐτοὺς ὁ Ἰησοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/017.yaml
  text: They got into a boat and were heading across the sea to Capernaum[a]. And it had already become dark[c][b], and Jesus had not yet come to them.
translation:
  language: ar
  text: فركبوا قاربًا، وكانوا متجهين عبر البحر[a] إلى كفرناحوم. وكان الظلام قد حلَّ بالفعل[b]، ولم يكن يسوع قد جاء إليهم بعد.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إلى الضفة الأخرى من البحر».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «وكان قد أظلم بالفعل».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβάντες εἰς πλοῖον
  choice: فركبوا قاربًا
  rationale: صيغ اسم الفاعل الأوريستي في عبارة فعلية منسقة طبيعية في العربية، مع إبقاء حدث ركوب القارب سابقًا للحركة عبر البحر. واختير «قارب» لأن السياق لا يدل على سفينة كبيرة.
- source_word: ἤρχοντο
  choice: وكانوا متجهين
  rationale: تحفظ هذه الصياغة الاستمرارية التي يفيدها الماضي الناقص اليوناني، بدل تصوير الحركة كحدث منتهٍ.
- source_word: πέραν τῆς θαλάσσης
  choice: عبر البحر
  rationale: تنقل اتجاه الحركة عبر البحر بإيجاز، مع إثبات احتمال «إلى الضفة الأخرى من البحر» في الحاشية. وأُبقيت «البحر» موافقة للفظ اليوناني واستعمال يوحنا.
- source_word: εἰς Καφαρναούμ
  choice: إلى كفرناحوم
  rationale: نقل عربي مألوف لاسم المكان مع حفظ دلالة الاتجاه.
- source_word: σκοτία ἤδη ἐγεγόνει
  choice: وكان الظلام قد حلَّ بالفعل
  rationale: تنقل الصياغة حالة نتجت عن تغير سابق، وهو ما يناسب صيغة الماضي التام في اليونانية، وتأتي طبيعية في العربية الفصحى المعاصرة.
- source_word: οὔπω ἐληλύθει πρὸς αὐτοὺς
  choice: ولم يكن يسوع قد جاء إليهم بعد
  rationale: تحفظ الصياغة معنى أنه حتى تلك اللحظة لم يكن يسوع قد وصل إليهم، من غير تفسير «جاء» بمعنى «انضم».
- source_word: ὁ Ἰησοῦς
  choice: يسوع
  rationale: الصيغة العربية المألوفة للاسم.
theological_decisions:
- issue: التتابع الزمني والجانب السردي
  choice: صيغ ركوب القارب كفعل سابق، والحركة كحدث مستمر، وحلول الظلام ومجيء يسوع بصيغ تحفظ منظور الزمن السابق في السرد.
  alternative: صياغة الحركة كفعل ماضٍ بسيط، أو الاكتفاء بقول «وكان الجو مظلمًا».
  rationale: يحفظ ذلك توتر السرد وتسلسل أحداثه من غير إضافة دلالة عقائدية لا ينص عليها الأصل.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. استُخدم تنسيق الأفعال بدل تركيب حرفي ثقيل لاسم الفاعل اليوناني، مع الحفاظ على الاستمرارية والتتابع الزمني. وُضعت علامتا الحاشية في موضعي العبارتين اللتين تشرحانهما مباشرة.
