  rationale: تعبير عربي طبيعي يجمع دلالة المصدر أو المنشأ مع إيحاء القرب والحضور الشخصي الذي قد تحمله παρά مع المضاف إليه.
- source_word: οὗτος
  choice: فهذا
  rationale: يحفظ الإحالة التوكيدية إلى الشخص المذكور قبله، وتربط الفاء الجملة بما قبلها ربطًا عربيًا طبيعيًا.
- source_word: ἑώρακεν
  choice: قد رأى
  rationale: تحفظ «قد» معنى الفعل التام وأهميته المستمرة في السياق.
