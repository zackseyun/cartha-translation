  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἀλλ’ εἶπον ὑμῖν ὅτι καὶ ἑωράκατέ με καὶ οὐ πιστεύετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/036.yaml
  text: But I told you that you have even seen me[a], and yet you do not believe.
translation:
  language: ar
  text: لكني قلت لكم إنكم قد رأيتموني فعلًا[a]، ومع ذلك لا تؤمنون.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو بصورة أقرب إلى ترتيب اليونانية: «إنكم قد رأيتموني أيضًا، ولا تؤمنون».'
    reason: بديل معجمي ونحوي لقوة καί الأولى وتكرار أداة العطف.
lexical_decisions:
- source_word: ἀλλ’
  choice: لكني
  rationale: أداة استدراك تربط القول بما سبقه وتُظهر المقابلة بعبارة عربية موجزة وطبيعية.
- source_word: εἶπον ὑμῖν
  choice: قلت لكم
  rationale: ينقل الفعل الماضي مع المفعول غير المباشر نقلًا مباشرًا مطابقًا لبنية العربية.
- source_word: ὅτι
  choice: إنكم
  rationale: تُدخل مضمون القول السابق في العربية بوضوح.
- source_word: καὶ ἑωράκατέ με
  choice: قد رأيتموني فعلًا
  rationale: «قد» مع الماضي تلائم تمام الفعل وأثره الحاضر، و«فعلًا» تنقل القوة التوكيدية المحتملة لـ καί في هذا السياق.
- source_word: καὶ οὐ πιστεύετε
  choice: ومع ذلك لا تؤمنون
  rationale: تُظهر «ومع ذلك» المفارقة الخطابية بين رؤيتهم ليسوع واستمرار عدم إيمانهم، مع إبقاء الربط بين الجملتين.
theological_decisions:
- issue: قوة καί الأولى في καὶ ἑωράκατέ με
  choice: فعلًا
  alternative: 'أيضًا؛ أو ترجمة سببية تنازلية: مع أنكم رأيتموني'
  rationale: تحتمل καί هنا معنى التوكيد أو الإضافة. اختير التوكيد لأنه طبيعي في العربية ويحفظ المفارقة من غير تحويل البنية صراحةً إلى جملة تنازلية.
- issue: معنى πιστεύετε
  choice: تؤمنون
  alternative: تثقون
  rationale: «تؤمنون» هو المقابل المباشر والمألوف للفعل πιστεύω في سياق يوحنا، ولا يحصره في مجرد التصديق العقلي ولا يوسعه بتفسير زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. حافظت الصياغة على تمام فعل الرؤية وعلى المفارقة مع عدم الإيمان، من غير إضافة تفسير مذهبي.
