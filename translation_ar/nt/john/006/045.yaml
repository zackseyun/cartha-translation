base_translation:
  language: en
  yaml_path: translation/nt/john/006/045.yaml
  text: It is written in the Prophets[a], ‘And they will all be taught by God.’ Everyone who has heard from the Father and has learned comes to me.
translation:
  language: ar
  text: 'مكتوبٌ في الأنبياء: «وسيكون الجميع مُعَلَّمين من الله».[a] كلُّ من سمع من الآب وتعلَّم يأتي إليَّ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وسيكون الجميع تلاميذَ الله».'
    reason: بديل لفظي للاقتباس النبوي يحافظ على نسبة التعليم إلى الله؛ أما النص الرئيس فيُظهر بوضوح أن الله هو الذي يعلّمهم.
lexical_decisions:
- source_word: ἔστιν γεγραμμένον
  choice: مكتوبٌ
  rationale: صياغة عربية مألوفة لعبارة الاستشهاد، وتحفظ معنى الكتابة الثابتة من غير تكلّف.
- source_word: ἐν τοῖς προφήταις
  choice: في الأنبياء
  rationale: تحفظ الصيغة اليونانية التي تشير في هذا السياق إلى أسفار الأنبياء ضمن الكتب المقدسة.
- source_word: ἔσονται πάντες διδακτοὶ θεοῦ
  choice: وسيكون الجميع متعلِّمين من الله
  rationale: تحفظ صيغة المستقبل ودلالة كون الله مصدر التعليم، مع الإبقاء على قرب التعبير من تركيب الاقتباس النبوي.
- source_word: πᾶς ὁ ἀκούσας
  choice: كلُّ من سمع
  rationale: ينقل التركيب الاسمي العام ودلالة الفعل السابق للفعل الرئيس بعبارة عربية طبيعية.
- source_word: παρὰ τοῦ πατρὸς
  choice: من الآب
  rationale: تنقل معنى المصدر في παρά مع المضاف إليه، وتحفظ الاستعمال اليوحناوي للقب الآب.
- source_word: καὶ μαθὼν
  choice: وتعلَّم
  rationale: تحفظ اقتران السماع بالتعلّم بوصفهما سابقين للمجيء، دون إضافة تفسير سببي غير مصرّح به.
- source_word: ἔρχεται πρὸς ἐμέ
  choice: يأتي إليَّ
  rationale: صياغة عربية مباشرة تحفظ المضارع والحركة الشخصية نحو يسوع.
theological_decisions:
- issue: العلاقة بين تعليم الله والمجيء إلى يسوع
  choice: 'الإبقاء على تسلسل النص: من سمع من الآب وتعلّم يأتي إلى يسوع.'
  alternative: تفسير حتمي صريح، أو تفسير تآزري يشدّد على الاستجابة البشرية.
  rationale: النص يقرر العلاقة من غير أن يشرح آليتها الميتافيزيقية، ولذلك تُحفظ دلالته وتوتره اللاهوتي بلا حسم مذهبي.
- issue: صلة الآب بيسوع
  choice: الإبقاء على «الآب» و«إليَّ» في علاقة مباشرة كما في الأصل.
  alternative: توسيع العبارة بشرح عقائدي لهوية يسوع أو طبيعة سلطانه.
  rationale: يحفظ ذلك القوة المسيحانية في السياق اليوحناوي من غير إضافة ما لا تقوله الآية صراحة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «الآب» محافظةً على المصطلح اليوحناوي، ووُضع marker الحاشية بعد الاقتباس الذي تتعلق به.
