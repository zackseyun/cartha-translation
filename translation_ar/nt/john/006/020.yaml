lexical_decisions:
- source_word: ὁ δὲ
  choice: فقال
  rationale: تؤدي الفاء انتقال السرد وتطوره بصورة طبيعية، والضمير المستتر في «قال» يعود إلى يسوع كما يؤدي ὁ المستعمل استعمالًا ضميريًا.
- source_word: λέγει
  choice: قال
  rationale: الفعل في اليونانية مضارع تاريخي، لكن الماضي هو الأسلوب الطبيعي في السرد العربي ويحفظ المعنى دون تكلّف في محاكاة الصيغة.
- source_word: αὐτοῖς
  choice: لهم
  rationale: ترجمة مباشرة للضمير في صيغة جمع المذكر، مع ترك السياق يحدد أنهم التلاميذ.
- source_word: Ἐγώ εἰμι
  choice: أنا هو
  rationale: تصلح العبارة العربية للتعريف بالمتكلم في هذا السياق، وتحافظ في الوقت نفسه على الصياغة المقتضبة واحتمال صداها اللاهوتي في إنجيل يوحنا. تُذكر الترجمة الأشد حرفية في الحاشية.
- source_word: μὴ φοβεῖσθε
  choice: لا تخافوا
  rationale: نهي عربي واضح وطبيعي يطابق وظيفة الصيغة اليونانية في طمأنة التلاميذ.
theological_decisions:
- issue: هل تُفهم Ἐγώ εἰμι على أنها مجرد تعريف بالنفس أم تحمل أيضًا صدى لاهوتيًا؟
  choice: 'المتن: «أنا هو»'
  alternative: '«أنا أكون»؛ أو بحسب المعنى السياقي: «إنه أنا»'
  rationale: «أنا هو» تعرّف المتكلم تعريفًا طبيعيًا نسبيًا وتحافظ على إيجاز اليونانية وإمكان الدلالة الأوسع في أسلوب يوحنا، من غير حسم الصدى اللاهوتي أو فرضه.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُخدم الماضي للسرد الطبيعي، وحُفظ إيجاز قول يسوع والتوتر الدلالي في Ἐγώ εἰμι.
