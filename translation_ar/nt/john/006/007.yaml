lexical_decisions:
- source_word: Διακοσίων δηναρίων ἄρτοι
  choice: خبز بمئتي دينار
  rationale: يحافظ على وحدة النقد القديمة وعلى دلالة قيمة الخبز، بصياغة عربية موجزة وطبيعية.
- source_word: οὐκ ἀρκοῦσιν αὐτοῖς
  choice: لا يكفيهم
  rationale: ينقل معنى عدم الكفاية مباشرة، مع عودة ضمير الجمع إلى الجموع في السياق.
- source_word: ἵνα ἕκαστος βραχύ τι λάβῃ
  choice: حتى يأخذ كل واحد منهم شيئًا قليلًا
  rationale: يحفظ بنية الغاية/النتيجة المحتملة في ἵνα ولا يحسمها بأكثر مما يقتضيه النص، وينقل βραχύ τι بوضوح.
