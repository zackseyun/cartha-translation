  text: Ἐγόγγυζον οὖν οἱ Ἰουδαῖοι περὶ αὐτοῦ ὅτι εἶπεν· Ἐγώ εἰμι ὁ ἄρτος ὁ καταβὰς ἐκ τοῦ οὐρανοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/041.yaml
  text: So the Jews were grumbling about him because he said[a], “I am the bread that came down from heaven.”
translation:
  language: ar
  text: 'فكان اليهود[a] يتذمّرون بشأنه لأنه قال: «أنا هو الخبز الذي نزل من السماء».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أهل اليهودية»، وفي بعض السياقات «قادة اليهود». قد تشير عبارة يوحنا «اليهود» إلى جماعة معيّنة كانت تعارض يسوع، لا إلى الشعب اليهودي كله.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγόγγυζον
  choice: أخذوا يتذمّرون
  rationale: ينقل صيغة الماضي الناقص فعلًا مستمرًّا أو متكررًا في الماضي، ويحفظ معنى الشكوى الساخطة بصياغة عربية طبيعية.
- source_word: οὖν
  choice: فـ
  rationale: تربط الكلام بما سبقه وتُظهر النتيجة أو التطور السردي بإيجاز طبيعي.
- source_word: οἱ Ἰουδαῖοι
  choice: اليهود
  rationale: ترجمة مباشرة للعبارة اليونانية من غير تضييق مدلولها إلى القادة أو توسيعه ليشمل جميع اليهود؛ وتوضح الحاشية إمكان دلالتها السياقية.
- source_word: περὶ αὐτοῦ
  choice: عليه
  rationale: تؤدي معنى التذمر بشأنه في تركيب عربي مألوف، من غير أن تضيف إلى حرف الجر حكمًا تفسيريًا زائدًا.
- source_word: ὅτι
  choice: لأنه
  rationale: تفيد هنا سبب تذمرهم، لا مجرد إدخال مضمون القول.
- source_word: εἶπεν
  choice: قال
  rationale: ينقل الماضي البسيط اليوناني بوضوح ومن غير حاجة إلى صيغة الماضي الأسبق.
- source_word: Ἐγώ εἰμι
  choice: أنا هو
  rationale: يحفظ إبراز ضمير المتكلم وصيغة التعريف الخبرية في تعبير عربي كتابي واضح.
- source_word: ὁ ἄρτος
  choice: الخبز
  rationale: يحفظ أداة التعريف ويقدم الاستعارة المركزية مباشرة.
- source_word: ὁ καταβὰς
  choice: الذي نزل
  rationale: يحوّل اسم الفاعل اليوناني المعرّف إلى جملة صلة عربية طبيعية، مع إبقاء النزول حدثًا متحققًا.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: من السماء
  rationale: تعبير عربي مألوف يحفظ معنى المصدر أو المنشأ.
theological_decisions:
- issue: مدلول οἱ Ἰουδαῖοι في إنجيل يوحنا
  choice: اليهود في المتن مع حاشية توضيحية
  alternative: اليهوديون، أو قادة اليهود
  rationale: يحافظ هذا على اللفظ اليوناني من غير أن يحدد المرجع بما لا تصرح به الآية. وتمنع الحاشية فهم العبارة كتعميم على الشعب اليهودي كله، إذ قد تشير في السياق اليوحناوي إلى جماعة معينة معارضة ليسوع.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختير «يتذمّرون» بدل «يتمتمون» أو «يتذمرون سرًّا» لأنه ينقل معنى الشكوى المستمرة من غير غموض أو زيادة تفسيرية.
