  text: ⸀εἶπεν ὁ Ἰησοῦς· Ποιήσατε τοὺς ἀνθρώπους ἀναπεσεῖν. ἦν δὲ χόρτος πολὺς ἐν τῷ τόπῳ. ἀνέπεσαν οὖν οἱ ἄνδρες τὸν ἀριθμὸν ⸀ὡς πεντακισχίλιοι.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/010.yaml
  text: Jesus said, “Have the people sit down.” Now there was plenty of grass in the place. So the men sat down, about five thousand in number.
translation:
  language: ar
  text: 'قال يسوع: «أجلسوا الناس[a]». وكان في ذلك المكان عشب كثير. فجلس الرجال، وكان عددهم نحو خمسة آلاف.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يقول اليوناني أولًا «الناس» (ἀνθρώπους)، ثم يقول «الرجال» (ἄνδρες)، مما يدل على أن عدد نحو خمسة آلاف يعود إلى الرجال تحديدًا.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ποιήσατε ... ἀναπεσεῖν
  choice: أجلسوا
  rationale: تركيب سببي يفيد الأمر بجعل الناس يجلسون؛ وصيغة «أجلسوا» عربية طبيعية موجزة تحفظ قوة الأمر.
- source_word: τοὺς ἀνθρώπους
  choice: الناس
  rationale: اللفظ عام يشمل الحاضرين، ويجب تمييزه من ἄνδρες اللاحقة الدالة على الرجال.
- source_word: ἀναπεσεῖν / ἀνέπεσαν
  choice: أجلسوا / فجلس
  rationale: قد يدل الفعل على الاتكاء لتناول الطعام، لكن «الجلوس» هو التعبير العربي الطبيعي في هذا المشهد الخارجي، من غير نفي لإمكان معنى الاتكاء.
- source_word: χόρτος πολὺς
  choice: عشب كثير
  rationale: ترجمة مباشرة وواضحة تحفظ معنى وفرة العشب ونبرة السرد.
- source_word: ἐν τῷ τόπῳ
  choice: في ذلك المكان
  rationale: صياغة عربية طبيعية للعبارة المكانية، مع جعل الإحالة إلى موضع الحدث واضحة.
- source_word: οἱ ἄνδρες
  choice: الرجال
  rationale: ἄνδρες لفظ خاص بالذكور الرجال، بخلاف اللفظ العام «الناس» في أول الآية.
- source_word: τὸν ἀριθμὸν ὡς πεντακισχίλιοι
  choice: وكان عددهم نحو خمسة آلاف
  rationale: تحفظ العبارة ذكر العدد صراحة، وتنقل ὡς التقريبية بلفظ «نحو» في عربية سليمة.
theological_decisions:
- issue: تحديد الفئة التي يشملها تعداد الخمسة آلاف
  choice: تمييز «الناس» في الأمر من «الرجال» في التعداد
  alternative: ترجمة اللفظين كليهما بلفظ عام مثل «الناس»
  rationale: ينتقل النص اليوناني عمدًا من ἀνθρώπους العام إلى ἄνδρες الخاص بالرجال؛ وحفظ هذا الفرق يمنع طمس دلالة النص من غير إضافة استنتاج بشأن بقية الحاضرين.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختير «جلس» بدل «اتكأ» لسلاسة السرد، مع بقاء «اتكأ» احتمالًا معجميًا مرتبطًا بوضع تناول الطعام. وُضعت علامة الحاشية بعد «الناس» حيث يظهر أول طرف من المقابلة اللفظية.
