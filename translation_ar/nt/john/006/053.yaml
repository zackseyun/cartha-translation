  text: εἶπεν οὖν αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν, ἐὰν μὴ φάγητε τὴν σάρκα τοῦ υἱοῦ τοῦ ἀνθρώπου καὶ πίητε αὐτοῦ τὸ αἷμα, οὐκ ἔχετε ζωὴν ἐν ἑαυτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/053.yaml
  text: So Jesus said to them[a], “Truly, truly, I say to you, unless you eat the flesh of the Son of Man and drink his blood[b], you do not have life in yourselves.”
translation:
  language: ar
  text: 'فقال لهم يسوع: «الحقَّ الحقَّ أقول لكم: إن لم تأكلوا لحمَ ابن الإنسان[a] وتشربوا دمه، فليست لكم حياةٌ[b] في أنفسكم».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن ترجمة «لحم» هنا بـ«جسد»، لكن اليونانية تستعمل σάρξ، أي «لحم»، وهو لفظ يحفظ القوة الحسية الملموسة للقول.
    reason: lexical_alternative
  - marker: b
    text: تقول الآية «حياة» فقط، لا «حياة أبدية»، مع أن السياق الأوسع في إنجيل يوحنا يربط هذه الحياة كثيرًا بالحياة الأبدية.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: فقال
  rationale: الفاء تربط القول بما سبقه ربطًا استنتاجيًّا أو انتقاليًّا طبيعيًّا في العربية، من غير إثقال العبارة بلفظ مثل «لذلك».
- source_word: Ἀμὴν ἀμὴν
  choice: الحقَّ الحقَّ
  rationale: تنقل الصيغة اليوحناوية المكررة التي تستهل إعلانًا مؤكدًا ومهيبًا، وتحافظ على التكرار المقصود.
- source_word: ἐὰν μὴ
  choice: إن لم
  rationale: صياغة شرطية عربية واضحة ومباشرة تقابل التركيب اليوناني.
- source_word: φάγητε
  choice: تأكلوا
  rationale: المعنى الحرفي المباشر للفعل، ويحفظ حدة الصورة الملموسة في القول.
- source_word: σάρκα
  choice: لحمَ
  rationale: يقابل «اللحم» القوة الحسية الملموسة للفظ اليوناني σάρξ على نحو أدق من «الجسد»، ولا يستبدل اللفظ بتعبير تفسيري.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: ابن الإنسان
  rationale: يحفظ اللقب المعروف ليسوع وصِلته الكتابية والمسيانية من غير إعادة تفسيره.
- source_word: πίητε
  choice: تشربوا
  rationale: ترجمة حرفية تحفظ التوازي الصادم المقصود مع «تأكلوا».
- source_word: αἷμα
  choice: دمه
  rationale: يحفظ الصورة الصريحة والثقل اللاهوتي للفظ اليوناني.
- source_word: ζωὴν
  choice: حياةٌ
  rationale: النص يقول «حياة» من غير صفة «أبدية»، ولذلك لا تُضاف الصفة من السياق الأوسع.
- source_word: ἐν ἑαυτοῖς
  choice: في أنفسكم
  rationale: ترجمة مباشرة تحفظ دلالة وجود الحياة في المخاطَبين أو امتلاكهم لها.
theological_decisions:
- issue: هل تُترجم لغة الأكل والشرب حرفيًّا أم تُفسَّر بحسب الجدل الأسراري أو المجازي؟
  choice: الإبقاء على «تأكلوا لحم ابن الإنسان وتشربوا دمه»
  alternative: استخدام ألفاظ تفسيرية مثل «تتناولوا» أو «تقبلوا»، أو استبدال «اللحم» بـ«الجسد» في المتن
  rationale: الصياغة الأصلية ملموسة وصادمة عمدًا. يحفظ النقل الحرفي التوتر بين القراءات الأسرارية والمجازية وغيرها، ولا يحسمه لمصلحة تقليد مذهبي بعينه.
- issue: هل تُوسَّع «حياة» إلى «حياة أبدية» اعتمادًا على السياق اليوحناوي؟
  choice: إبقاء «حياة» وحدها في المتن
  alternative: «حياة أبدية»
  rationale: لا توجد في الآية صفة αἰώνιος، وإضافتها تُدخل تفسيرًا سياقيًّا ليس مصرحًا به في العبارة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. حُفظ التكرار في «الحق الحق»، واستُعمل «لحم» بدل «جسد» لصيانة ملموسية σάρξ، مع توضيح البديل في الحاشية. وُضعت علامتا الحاشيتين عند اللفظين اللذين تشرحانهما مباشرة.
