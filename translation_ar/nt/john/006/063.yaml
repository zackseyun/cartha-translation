base_translation:
  language: en
  yaml_path: translation/nt/john/006/063.yaml
  text: It is the Spirit who gives life[a]; the flesh benefits nothing[c][b]. The words that I have spoken to you are spirit and are life.
translation:
  language: ar
  text: الرُّوح[a] هو الذي يُحيي، أمّا الجسد[b] فلا ينفع شيئًا. الكلمات التي قلتُها لكم هي روح وحياة[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أن تعني «الرُّوح» هنا الروح القدس أو «الروح» بمعنى عام؛ والسياق يرجّح الروح القدس.
    reason: alternative_reading
  - marker: b
    text: قد يشير «الجسد» هنا على نحو واسع إلى ما هو بشري محض؛ أما ترجمته بـ«الطبيعة الخاطئة» فتزيد تفسيرًا لا يقتضيه اللفظ اليوناني.
    reason: lexical_alternative
  - marker: c
    text: 'يمكن فهم العبارة أيضًا بمعنى: «هي الروح والحياة» أو «هي روحية وواهبة للحياة». الصياغة اليونانية موجزة وذات دلالة كيفية.'
    reason: alternative_reading
lexical_decisions:
- source_word: πνεῦμα
  choice: الرُّوح
  rationale: يحافظ اللفظ العربي على المعنى المباشر وعلى إمكان الإشارة إلى روح الله، وهو الأرجح في السياق، من غير أن يزيل تمامًا احتمال المعنى العام «الروح».
- source_word: ζῳοποιοῦν
  choice: هو الذي يُحيي
  rationale: ينقل اسم الفاعل اليوناني ذي الدلالة المستمرة بصياغة عربية طبيعية، ويعبّر عن منح الحياة أو جعل المرء حيًّا.
- source_word: σὰρξ
  choice: الجسد
  rationale: «الجسد» هو المقابل العربي المباشر ويحفظ اتساع التعبير اليوحناوي؛ أما «الطبيعة الخاطئة» فتقييد تفسيري لا يفرضه النص.
- source_word: ὠφελεῖ οὐδέν
  choice: لا ينفع شيئًا
  rationale: صياغة عربية واضحة تحفظ النفي المطلق في الأصل.
- source_word: ῥήματα
  choice: الكلمات
  rationale: يدل اللفظ على الأقوال أو الكلمات المنطوقة، و«الكلمات» مباشر ومفهوم في السياق.
- source_word: λελάληκα
  choice: قلتُها
  rationale: صياغة عربية طبيعية للكلام المنطوق؛ والسياق يجعل أثر هذه الكلمات الحاضر واضحًا، وإن لم يطابق العربيةُ تمامًا صيغةَ التام اليونانية.
- source_word: πνεῦμά ἐστιν
  choice: هي روح
  rationale: يحفظ العبارة اليونانية المكثفة وطابعها الكيفي، من غير تحويلها تفسيرًا إلى «روحية» أو مساواتها صراحةً بروح الله.
- source_word: ζωή
  choice: حياة
  rationale: المقابل المباشر للمصطلح اليوحناوي، مع إبقاء عمقه اللاهوتي دون شرح زائد.
theological_decisions:
- issue: مرجع πνεῦμα في الجملة الأولى
  choice: الإبقاء على «الرُّوح»، مع ترجيح الإشارة إلى روح الله في الحاشية
  alternative: الروح بوصفها مبدأً روحيًا عامًا، أو روح الإنسان
  rationale: السياق اليوحناوي يربط منح الحياة بروح الله، لكن اللفظ نفسه يحتمل «الروح»، والعربية لا تستخدم الحروف الكبيرة لتمييز أحد المعنيين.
- issue: معنى σὰρξ في مقابل الروح
  choice: الجسد بوصفه لفظًا واسع الدلالة
  alternative: الطبيعة الخاطئة، أو الجهد البشري المحض، أو البدن المادي وحده
  rationale: الإبقاء على «الجسد» يصون التوتر المقصود ولا يفرض تصورًا لاهوتيًا أضيق من الأصل.
- issue: دلالة πνεῦμά ἐστιν في الجملة الأخيرة
  choice: 'دلالة كيفية: الكلمات «هي روح وحياة»'
  alternative: 'دلالة تعريفية: الكلمات هي روح الله والحياة؛ أو تفسيرية: الكلمات روحية وواهبة للحياة'
  rationale: المسند غير المعرّف يرجح الوصف الكيفي، والعبارة العربية المختارة تحافظ على إيجاز الأصل وجرأته.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «أمّا» لإبراز المقابلة بين الروح والجسد، وحُفظت العبارة الختامية المكثفة «هي روح وحياة» بدل توسيعها بتفسير مذهبي.
