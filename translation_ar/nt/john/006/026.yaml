  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς καὶ εἶπεν· Ἀμὴν ἀμὴν λέγω ὑμῖν, ζητεῖτέ με οὐχ ὅτι εἴδετε σημεῖα ἀλλ’ ὅτι ἐφάγετε ἐκ τῶν ἄρτων καὶ ἐχορτάσθητε·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/026.yaml
  text: Jesus answered them[a], “Truly, truly, I say to you, you are seeking me not because you saw signs, but because you ate of the loaves and were filled.
translation:
  language: ar
  text: 'أجابهم يسوع وقال: «الحق الحق أقول لكم: أنتم تطلبونني، لا لأنكم رأيتم آيات، بل لأنكم أكلتم من الأرغفة وشبعتم».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς καὶ εἶπεν
  choice: أجابهم يسوع وقال
  rationale: يحافظ على صيغتي إدخال الكلام في اليونانية، وهما طبيعيتان ومألوفتان في العربية الفصحى الكتابية من غير غموض.
- source_word: Ἀμὴν ἀμὴν
  choice: الحق الحق
  rationale: صيغة عربية واضحة ومهيبة تحفظ التكرار المميز في إنجيل يوحنا وتؤدي معنى التوكيد، بدل الاكتفاء بنقل صوتي قد يكون أقل شفافية.
- source_word: λέγω ὑμῖν
  choice: أقول لكم
  rationale: مقابل مباشر يحفظ رسمية العبارة وقوتها.
- source_word: ζητεῖτέ με
  choice: أنتم تطلبونني
  rationale: يُبرز الضميرُ المنفصل المخاطَبين، ويؤدي المضارع معنى السعي الجاري إلى يسوع؛ و«تطلبونني» أفصح وأنسب لتواتر موضوع الطلب في يوحنا من «تبحثون عني».
- source_word: οὐχ ὅτι ... ἀλλ’ ὅτι
  choice: لا لأنكم ... بل لأنكم
  rationale: ينقل بوضوح المقابلة بين السببين أو الدافعين.
- source_word: εἴδετε
  choice: رأيتم
  rationale: ترجمة مباشرة لفعل الرؤية، بلا تحميله معنى الإدراك الروحي الذي لا يصرح به اللفظ هنا.
- source_word: σημεῖα
  choice: آيات
  rationale: «آيات» اللفظة العربية الطبيعية للأعمال الدالة، وتحفظ كون هذه الأعمال علامات تشير إلى ما وراء الحدث نفسه، بخلاف «معجزات» التي تركز على خرق المألوف.
- source_word: ἐφάγετε ἐκ τῶν ἄρτων
  choice: أكلتم من الأرغفة
  rationale: يحفظ حرف الجر الدال على الأخذ من الشيء، كما يحفظ جمع ἄρτων وإحالته إلى الأرغفة التي أُكثرت.
- source_word: ἐχορτάσθητε
  choice: شبعتم
  rationale: مقابل عربي موجز وطبيعي يفيد الأكل حتى الامتلاء؛ ويؤدي معنى المبني للمجهول اليوناني على نحو عربي غير متكلف.
theological_decisions:
- issue: دلالة σημεῖα في السياق اليوحناوي
  choice: آيات
  alternative: معجزات / علامات معجزية
  rationale: «آيات» تحفظ البعد الإشاري لأعمال يسوع في يوحنا من غير إضافة تفسيرية إلى النص.
- issue: سبب طلب الجموع ليس مجرد مشاهدة الآيات بل الأكل والشبع
  choice: 'إبقاء المقابلة الصريحة: «لا لأنكم رأيتم آيات، بل لأنكم أكلتم... وشبعتم»'
  alternative: صياغة توحي بأنهم لم يشاهدوا الآيات أصلًا أو لم يفهموها روحيًا
  rationale: التركيب اليوناني يقابل الدافع المعلن بالدافع الفعلي؛ فلا ينبغي للترجمة أن تحسم ما إذا كانت «رؤية الآيات» تعني المشاهدة فقط أم إدراك مغزاها.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة وقورة. حُفظت الصيغة اليوحناوية «الحق الحق»، وجمع «الأرغفة»، والمقابلة السببية، من غير إضافة شرح مذهبي أو حاشية غير لازمة.
