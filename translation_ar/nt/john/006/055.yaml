  text: For my flesh is true food[a], and my blood is true drink.
translation:
  language: ar
  text: لِأَنَّ لَحْمِي طَعَامٌ حَقِيقِيٌّ[a]، وَدَمِي شَرَابٌ حَقِيقِيٌّ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «طعامٌ حَقّ، وشرابٌ حَقّ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: لأنَّ
  rationale: تحفظ الأداة التعليلية الصلة التفسيرية بما سبق، وهي صياغة عربية طبيعية في هذا السياق.
- source_word: σάρξ
  choice: جسدي
  rationale: «الجسد» هو المقابل العربي الطبيعي هنا، ويحفظ الموازاة الصريحة بين جسد يسوع ودمه من غير تلطيف أو تأويل.
- source_word: ἀληθής
  choice: حقيقيّ
  rationale: يدل على ما هو حق وواقع وأصيل، ويأتي وصفًا طبيعيًا للطعام والشراب في العربية، مع إبقاء الدلالة اللاهوتية مفتوحة.
- source_word: βρῶσις
  choice: طعام
  rationale: مع أن اللفظة قد تدل على الأكل، فإن موقعها خبرًا مع ἀληθής وموازاتها لـ πόσις يرجحان معنى ما يُؤكل.
- source_word: αἷμα
  choice: دمي
  rationale: ترجمة حرفية تحفظ صورة النص وموازاة الجسد والدم.
- source_word: πόσις
  choice: شراب
  rationale: المعنى هنا هو ما يُشرب، وهو المقابل العربي الطبيعي لـ«طعام» في هذا التركيب.
theological_decisions:
- issue: دلالة ἀληθής في سياق الخلافات المتعلقة بالعشاء الرباني
  choice: حقيقيّ
  alternative: حقّ
  rationale: «حقيقي» عربية طبيعية في وصف الطعام والشراب وتحفظ معنى الحق والواقع من غير أن تحدد وحدها كيفية الحضور أو تحسم الخلاف اللاهوتي. وأُثبت البديل الأقرب إلى الصيغة اليونانية في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة، مع الحفاظ على التوازي الإيقاعي بين «جسدي... ودمي» و«طعام... وشراب».
