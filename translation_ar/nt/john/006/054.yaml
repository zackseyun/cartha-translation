base_translation:
  language: en
  yaml_path: translation/nt/john/006/054.yaml
  text: The one who eats my flesh and drinks my blood has eternal life[b][a], and I will raise him up on the last day.
translation:
  language: ar
  text: الذي يأكل[a] لحمي ويشرب دمي له حياة أبدية، وأنا سأقيمه في اليوم الأخير.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يقتات من». والفعل اليوناني أكثر حسية من لفظ عام للأكل، وقد يفيد بصورة أوضح «يمضغ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ τρώγων
  choice: الذي يأكل
  rationale: اسم الموصول مع الفعل المضارع يحافظ على صيغة المفرد وعلى وصف الشخص بأنه متميّز بهذا الفعل، ويقابل اسم الفاعل المعرّف في اليونانية بصورة طبيعية وواضحة.
- source_word: τρώγων
  choice: يأكل
  rationale: الفعل اليوناني أكثر حسية من اللفظ العام للأكل، وقد يدل على المضغ أو الأكل الفعلي. اختير «يأكل» لوضوحه وطبيعته، مع إثبات النبرة الأشد حسية في الحاشية.
- source_word: μου τὴν σάρκα
  choice: لحمي
  rationale: تحافظ «لحمي» على المعنى الحسي المباشر لكلمة σάρξ ولا تستبدلها بـ«جسدي»، فتُبقي التوتر المقصود في العبارة.
- source_word: καὶ πίνων μου τὸ αἷμα
  choice: ويشرب دمي
  rationale: ترجمة حرفية طبيعية تحفظ التوازي بين فعلي الأكل والشرب ولا تلطف صورة الدم.
- source_word: ἔχει ζωὴν αἰώνιον
  choice: له حياة أبدية
  rationale: «له» صياغة عربية طبيعية تفيد الامتلاك الحاضر الذي يدل عليه المضارع اليوناني، و«حياة أبدية» هي المقابلة الواضحة والمألوفة للعبارة اليوحناوية.
- source_word: κἀγὼ ἀναστήσω αὐτὸν
  choice: وأنا أقيمه
  rationale: تحفظ «وأنا» بروز الضمير، وتؤدي «أقيمه» معنى الإنهاض في سياق القيامة من غير إضافة تفسير غير مصرح به في العبارة نفسها.
- source_word: τῇ ἐσχάτῃ ἡμέρᾳ
  choice: في اليوم الأخير
  rationale: تعبير عربي فصيح ومألوف للمصطلح الأخروي المتكرر في إنجيل يوحنا.
theological_decisions:
- issue: هل تُفسَّر لغة أكل اللحم وشرب الدم في المتن تفسيرًا أسراريًا أو مجازيًا؟
  choice: 'الإبقاء على الألفاظ الحسية المباشرة: «يأكل لحمي ويشرب دمي»'
  alternative: التصريح بأنها تشير إلى الإفخارستيا، أو استبدالها في المتن بتعبير عن الإيمان
  rationale: النص اليوناني نفسه يستعمل ألفاظًا حسية مباشرة، ولذلك ينبغي إبقاء المجال مفتوحًا أمام التفسيرات اللاهوتية المختلفة بدل حسمها داخل الترجمة.
- issue: إحالة αὐτόν المذكر المفرد
  choice: أقيمه
  alternative: أقيم ذلك الشخص، أو صياغة جمع محايدة
  rationale: الضمير اليوناني مذكر مفرد ويعود إلى اسم الفاعل المفرد؛ والضمير المتصل في «أقيمه» يحفظ هذه المطابقة بصورة عربية طبيعية.
translation_notes:
  register: لغة عربية فصحى حديثة واضحة ومهيبة. استُعملت «لحمي» بدل «جسدي» التزامًا بدلالة σάρξ الحسية، وحُفظ تركيب المفرد المذكر والتوكيد في «وأنا» من غير توسع تفسيري.
