base_translation:
  language: en
  yaml_path: translation/nt/john/006/050.yaml
  text: This is the bread that comes down from heaven[b][a], so that anyone may eat from it and not die.
translation:
  language: ar
  text: هذا هو الخبز النازل من السماء[a]، لكي يأكل منه الإنسان ولا يموت[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «هذا هو الخبز الذي ينزل من السماء».'
    reason: lexical_alternative
  - marker: b
    text: تُركت عبارة «ولا يموت» عامة؛ إذ يفهمها المفسرون في السياق بطرائق مختلفة، منها النجاة من الموت النهائي، أو الموت الروحي، أو الهلاك في الدينونة الأخيرة.
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτός
  choice: هذا
  rationale: اسم إشارة يعرّف الخبز الذي يتحدث عنه يسوع، و«هذا» يحفظ مباشرة التعبير اليوناني بوضوح.
- source_word: ἄρτος
  choice: الخبز
  rationale: المعنى المعجمي المعتاد هو الخبز، وهو يحفظ في السياق القوتين الحرفية والمجازية من غير شرح زائد.
- source_word: ὁ ἐκ τοῦ οὐρανοῦ καταβαίνων
  choice: النازل من السماء
  rationale: يحفظ اسم الفاعل دلالة الفعل الحاضر وصورته الحية، مع صياغة عربية موجزة وطبيعية.
- source_word: οὐρανός
  choice: السماء
  rationale: السياق اليوحناوي يشير إلى العالم السماوي الإلهي، لا إلى الجو أو الفضاء المرئي فحسب.
- source_word: ἵνα
  choice: لكي
  rationale: تنقل معنى الغاية أو النتيجة المحتملة في العبارة اليونانية من غير حسم زائد للعلاقة بينهما.
- source_word: τις
  choice: الإنسان
  rationale: استُعمل اسم الجنس للدلالة العامة غير المحددة؛ فالمقصود أي إنسان، لا شخص بعينه.
- source_word: ἐξ αὐτοῦ
  choice: منه
  rationale: يقابل حرف الجر ἐκ/ἐξ مع فعل الأكل بصورة طبيعية ومباشرة في العربية.
- source_word: φάγῃ
  choice: يأكل
  rationale: الفعل المضارع بعد «لكي» يؤدي وظيفة صيغة الاحتمال اليونانية في جملة الغاية ويحافظ على عموم القول.
- source_word: μὴ ἀποθάνῃ
  choice: ولا يموت
  rationale: ينقل المعنى الأساسي للفعل ἀποθνῄσκω من غير استبداله بتعبير تفسيري مثل «يهلك» أو تقييد نوع الموت.
theological_decisions:
- issue: طبيعة الموت في عبارة «ولا يموت»
  choice: الإبقاء على العبارة العامة «ولا يموت» من غير تحديد نوع الموت
  alternative: ولا يموت روحيًا؛ أو ولا يهلك إلى الأبد
  rationale: لا تحدد الآية نفسها صراحةً أ意كون الموت جسديًا أم روحيًا أم أخرويًا. ويحفظ التعبير العام عمق التوتر اللاهوتي في خطاب خبز الحياة من غير فرض تفسير مذهبي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختير «النازل» للمحافظة على صورة اسم الفاعل الحاضر، واستُعمل «الإنسان» اسمَ جنس للدلالة على أي إنسان من غير تخصيص.
