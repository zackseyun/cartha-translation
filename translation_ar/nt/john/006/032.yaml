base_translation:
  language: en
  yaml_path: translation/nt/john/006/032.yaml
  text: So Jesus said to them[a], “Truly, truly, I say to you, Moses has not given you the bread from heaven[b], but my Father gives you the true bread from heaven.”
translation:
  language: ar
  text: 'فقال لهم يسوع: «الحق الحق أقول لكم: ليس موسى هو الذي أعطاكم الخبز من السماء[a]، بل أبي يعطيكم الخبز الحقيقي[b] من السماء.»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا أن تُترجم: «موسى لم يعطكم الخبز من السماء». يَرِد النفي في اليونانية قبل اسم «موسى»، مما يُبرز بصورة خاصة التباين في الفاعل.'
    reason: lexical_alternative
  - marker: b
    text: يمكن أن يُفهم «الحقيقي» أيضًا بمعنى «الأصيل» أو «الحقّ»؛ أي الخبز الذي يمثّل الحقيقة الكاملة، لا المنّ السابق بوصفه علامة فحسب.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: فـ
  rationale: تربط الجملة بالحوار السابق ربطًا طبيعيًا، وتحمل معنى الاستمرار أو النتيجة من غير إثقال الأسلوب.
- source_word: Ἀμὴν ἀμὴν
  choice: الحق الحق
  rationale: تحافظ على تكرار الصيغة اليوحناوية المهيبة وعلى توكيدها، وهي عبارة عربية كتابية واضحة ومألوفة.
- source_word: λέγω ὑμῖν
  choice: أقول لكم
  rationale: ترجمة مباشرة وطبيعية تلائم صيغة الإعلان المؤكد.
- source_word: οὐ Μωϋσῆς δέδωκεν ὑμῖν
  choice: ليس موسى هو الذي أعطاكم
  rationale: يُبرز وضع النفي قبل اسم موسى التباين في الفاعل، مع نقل الفعل التام اليوناني بصيغة عربية طبيعية تشير إلى العطاء الماضي ذي الصلة بالحوار الحاضر.
- source_word: τὸν ἄρτον ἐκ τοῦ οὐρανοῦ
  choice: الخبز من السماء
  rationale: يحفظ صورة المصدر السماوي بعبارة عربية واضحة ومباشرة.
- source_word: ἀλλ’ ὁ πατήρ μου δίδωσιν ὑμῖν
  choice: بل أبي يعطيكم
  rationale: تحفظ «بل» المقابلة القوية، وينقل المضارع «يعطيكم» عطاء الآب الحاضر في الخطاب.
- source_word: ὁ πατήρ μου
  choice: أبي
  rationale: صيغة عربية طبيعية وموجزة تحفظ دعوى يسوع البنوية من غير شرح زائد.
- source_word: τὸν ἀληθινόν
  choice: الحقيقي
  rationale: تنقل معنى ما هو حق وأصيل وكامل التحقق، مع إبقاء المجال للدلالة اليوحناوية التي تقابل الحقيقة النهائية بالمنّ السابق بوصفه علامة.
theological_decisions:
- issue: التباين بين عطاء موسى وعطاء الآب
  choice: ليس موسى هو الذي أعطاكم ... بل أبي يعطيكم
  alternative: موسى لم يعطكم ... بل أبي يعطيكم
  rationale: الصياغة المختارة تحفظ بروز النفي السابق لاسم موسى في اليونانية، وتُظهر التباين في الفاعل، كما تبقي الفرق بين العطاء الماضي وعطاء الآب الحاضر.
- issue: دلالة الخبز الحقيقي
  choice: الخبز الحقيقي
  alternative: الخبز الحق أو الخبز الأصيل
  rationale: «الحقيقي» عربية واضحة وتحتمل معنى الحقيقي والأصيل والنهائي، من غير حصر الدلالة في تفسير لاهوتي واحد أو تسوية العلاقة المتوترة بين المنّ والعطية التي يتحدث عنها يسوع.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة. حُفظ التكرار في «الحق الحق»، وأُبرز التباين التركيبي في الفاعل، مع تجنب التفسير العقائدي الزائد.
