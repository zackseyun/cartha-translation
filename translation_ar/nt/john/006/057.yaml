source:
  edition: SBLGNT
  text: καθὼς ἀπέστειλέν με ὁ ζῶν πατὴρ κἀγὼ ζῶ διὰ τὸν πατέρα, καὶ ὁ τρώγων με κἀκεῖνος ⸀ζήσει δι’ ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/057.yaml
  text: Just as the living Father sent me[a], and I live because of the Father[b], so also the one who feeds on me will live because of me.
translation:
  language: ar
  text: كما أرسلني الآب الحي، وأنا أحيا بسبب الآب[a]، كذلك من يأكلني[b] سيحيا هو أيضًا بسببي.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بالآب» و«بي». قد تدل أداة الجر اليونانية على السبب أو الوسيلة؛ وقد اختير هنا المعنى السببي للمحافظة على التوازي بين علاقة الابن بالآب وعلاقة المؤمن بالابن.'
    reason: alternative_reading
  - marker: b
    text: 'الفعل اليوناني صريح ومحسوس، ومعناه الحرفي الأكل، ويمكن أن يحمل إيحاء المضغ. ويمكن أيضًا أن تُصاغ العبارة: «من يقتات بي».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: كما ... كذلك
  rationale: تنقل أداة التشبيه وتُظهر بوضوح التوازي الذي يحكم الجملة كلها، بصياغة عربية طبيعية.
- source_word: ὁ ζῶν πατὴρ
  choice: الآب الحي
  rationale: ترجمة مباشرة للتركيب الوصفي، وتحفظ التشديد اليوحناوي على الحياة من غير تحويل المعنى إلى «المُحيي».
- source_word: ἀπέστειλέν με
  choice: أرسلني
  rationale: ينقل الماضي اليوناني ببساطة ويحفظ معنى الإرسال من غير تخصيصه بمعنى التكليف وحده.
- source_word: κἀγὼ ζῶ
  choice: وأنا أحيا
  rationale: تحفظ المضارع والمعنى الفعلي المستمر، مع إبراز الضمير كما في اليونانية.
- source_word: διὰ τὸν πατέρα
  choice: بسبب الآب
  rationale: تفيد διά مع النصب هنا السبب أو الأساس على نحو طبيعي، وتحافظ على التوازي مع δι’ ἐμέ.
- source_word: ὁ τρώγων με
  choice: من يأكلني
  rationale: يحفظ الفعل الحسي الصريح الدال على الأكل، ولا يستبدله بتعبير تفسيري قد يحسم المقصود لاهوتيًا.
- source_word: κἀκεῖνος
  choice: هو أيضًا
  rationale: ينقل توكيد الضمير ومعنى «ذلك أيضًا» في ترتيب عربي سليم.
- source_word: ζήσει
  choice: سيحيا
  rationale: يحفظ صيغة المستقبل والتوازي اللفظي مع «أحيا».
- source_word: δι’ ἐμέ
  choice: بسببي
  rationale: 'ينقل المعنى السببي المحتمل ويحافظ على التوازي: حياة الابن بسبب الآب، وحياة الآكل بسبب الابن.'
theological_decisions:
- issue: دلالة علاقة حياة الابن بالآب في διὰ τὸν πατέρα
  choice: أحيا بسبب الآب
  alternative: أحيا بالآب / من خلال الآب
  rationale: تحفظ الصياغة السببية الأرجح مع διά والنصب، من غير أن تضيف استنتاجًا عن طبيعة الابن أو مرتبته، وتُبقي التركيز على العلاقة والتوازي الواردين في الآية.
- issue: هل الأكل في ὁ τρώγων με إفخارستي حصرًا أم مجازي أوسع
  choice: من يأكلني
  alternative: من يقتات بي / من يتناولني
  rationale: تحفظ الترجمة الفعل اليوناني المحسوس والقوي، مع إبقاء المجال مفتوحًا للقراءات الأسرارية والمجازية والمرتبطة بالإيمان، من غير حسم ما لم يحسمه النص نفسه.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة وموقرة. استُعمل تركيب «كما ... كذلك» لإبراز المقارنة، و«هو أيضًا» لحفظ توكيد κἀκεῖνος. تجنبت الصياغة تفسير الأكل تفسيرًا طائفيًا محددًا أو حسم الدلالة السببية/الوسيلية في المتن من دون تنبيه.
