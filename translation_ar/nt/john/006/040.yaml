  text: τοῦτο ⸀γάρ ἐστιν τὸ θέλημα τοῦ ⸂πατρός μου⸃ ἵνα πᾶς ὁ θεωρῶν τὸν υἱὸν καὶ πιστεύων εἰς αὐτὸν ἔχῃ ζωὴν αἰώνιον, καὶ ἀναστήσω αὐτὸν ⸀ἐγὼ τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/040.yaml
  text: 'For this is the will of my Father: that everyone who sees the Son and believes in him may have eternal life[b][a], and I myself will raise him up on the last day.'
translation:
  language: ar
  text: 'لِأَنَّ هذِهِ هِيَ مَشِيئَةُ أَبِي: أَنْ تَكُونَ لِكُلِّ مَنْ يَنْظُرُ إِلَى الابْنِ[a] وَيُؤْمِنُ بِهِ حَيَاةٌ أَبَدِيَّةٌ، وَأَنَا نَفْسِي[b] سَأُقِيمُهُ فِي الْيَوْمِ الْأَخِيرِ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «كل من يُبصر الابن ويؤمن به». قد يدل الفعل على نظر متأنٍّ أو معاينة مقصودة، لا على مجرد الرؤية الجسدية.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا: «وسأقيمه». يَرِد في اليونانية ضمير «أنا» صراحةً للتوكيد، ولذلك تُرجمت العبارة: «وأنا نفسي سأقيمه».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο γάρ ἐστιν
  choice: لِأَنَّ هذِهِ هِيَ
  rationale: تحافظ «لأن» على القوة التفسيرية لـγάρ وربط الآية بما قبلها، وتؤدي «هذه هي» تركيب τοῦτο ἐστιν بوضوح عربي طبيعي.
- source_word: τὸ θέλημα τοῦ πατρός μου
  choice: مَشِيئَةُ أَبِي
  rationale: «مشيئة» المقابل العربي المألوف والدقيق لـθέλημα في هذا السياق، و«أبي» تنقل علاقة البنوة مباشرة دون زيادة تفسيرية.
- source_word: ἵνα
  choice: أَنْ تَكُونَ
  rationale: تقدّم مضمون المشيئة وغايتها بصياغة عربية سليمة، مع عدم تحويل البنية إلى تقرير خبري مستقل.
- source_word: πᾶς ὁ θεωρῶν
  choice: لِكُلِّ مَنْ يَنْظُرُ إِلَى
  rationale: يعكس التركيب العام «كل من»، وتوحي «ينظر إلى» برؤية مقصودة ومتأملة، لا بمجرد الإبصار العابر.
- source_word: τὸν υἱὸν
  choice: الِابْنِ
  rationale: تحافظ «الابن» على الاستعمال اللقبي والمسيحاني في سياق يوحنا.
- source_word: καὶ πιστεύων εἰς αὐτὸν
  choice: وَيُؤْمِنُ بِهِ
  rationale: صياغة عربية معيارية تعبّر طبيعيًا عن الإيمان الموجّه إلى شخص، وتحفظ اقتران النظر بالإيمان.
- source_word: ἔχῃ ζωὴν αἰώνιον
  choice: تَكُونَ لَهُ حَيَاةٌ أَبَدِيَّةٌ
  rationale: تحافظ على صيغة الغاية التابعة لـἵνα من غير تسويتها بخبر مستقل، و«حياة أبدية» تنقل العبارة اليوحناوية المألوفة.
- source_word: καὶ ἀναστήσω αὐτὸν ἐγὼ
  choice: وَأَنَا نَفْسِي سَأُقِيمُهُ
  rationale: «سأقيمه» تنقل فعل الإقامة في سياق القيامة، و«أنا نفسي» تحفظ توكيد الضمير اليوناني الصريح ἐγώ.
- source_word: τῇ ἐσχάτῃ ἡμέρᾳ
  choice: فِي الْيَوْمِ الْأَخِيرِ
  rationale: ترجمة عربية طبيعية ودقيقة للظرف الزمني، وتحافظ على التعبير الأخروي دون شرح زائد.
theological_decisions:
- issue: نطاق الشرط في πᾶς ὁ θεωρῶν ... καὶ πιστεύων
  choice: أن تكون لكل من ينظر إلى الابن ويؤمن به حياة أبدية
  alternative: أن كل من يرى الابن ويؤمن به له حياة أبدية
  rationale: تحفظ الصياغة عموم «كل من» واقتران النظر بالإيمان، وتبقيهما داخل مضمون مشيئة الآب وغايتها بحسب ἵνα مع صيغة الفعل، من غير إدخال تصور مذهبي عن الاختيار أو الإرادة الحرة.
- issue: توكيد ἐγώ في وعد القيامة
  choice: وأنا نفسي سأقيمه
  alternative: وسأقيمه
  rationale: يحفظ الضمير المؤكد وكالة يسوع الشخصية الصريحة في النص من غير إضافة مضمون عقائدي يتجاوز العبارة.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُخدمت «ينظر إلى» لإبراز دلالة θεωρέω الأقوى من مجرد الرؤية، وحُفظ توكيد «أنا» في جملة القيامة. وُضعت علامتا الحاشيتين بعد العبارتين اللتين تشرحانهما مباشرة.
