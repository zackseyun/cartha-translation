  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὅτι καταβέβηκα ⸀ἀπὸ τοῦ οὐρανοῦ οὐχ ἵνα ποιῶ τὸ θέλημα τὸ ἐμὸν ἀλλὰ τὸ θέλημα τοῦ πέμψαντός με·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/038.yaml
  text: For I have come down from heaven, not to do my own will, but the will of the one who sent me.
translation:
  language: ar
  text: لأني قد نزلتُ من السماء، لا لأعمل مشيئتي أنا، بل مشيئةَ الذي أرسلني.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: لأني
  rationale: تؤدي الأداة هنا معنى التعليل، إذ تفسر العبارة ما سبقها، و«لأني» صياغة عربية طبيعية تحفظ هذه القوة السببية.
- source_word: καταβέβηκα
  choice: قد نزلتُ
  rationale: الفعل في صيغة التام اليوناني يدل على نزول تمّ وله أثر حاضر. وتساعد «قد» مع الماضي على إبراز تحقق الفعل في العربية من غير تكلف.
- source_word: ἀπὸ τοῦ οὐρανοῦ
  choice: من السماء
  rationale: ترجمة مباشرة وطبيعية تحفظ صورة المصدر المكاني ودلالتها في سياق يوحنا.
- source_word: οὐχ ἵνα ποιῶ
  choice: لا لأعمل
  rationale: تحفظ «لا لـ» دلالة الغاية المنفية في ἵνα، و«أعمل» تؤدي معنى ποιῶ بوضوح وتلائم «المشيئة» في العربية الفصيحة.
- source_word: τὸ θέλημα
  choice: مشيئة
  rationale: تحفظ اللفظة المعنى الشخصي واللاهوتي للإرادة والقصد، كما تسمح بالإبقاء على التوازي بين طرفي المقابلة.
- source_word: τὸ ἐμὸν
  choice: مشيئتي أنا
  rationale: الضمير المنفصل «أنا» يُظهر توكيد صفة الملكية في اليونانية ويقوي المقابلة مع مشيئة الذي أرسله.
- source_word: ἀλλὰ
  choice: بل
  rationale: '«بل» أنسب للمقابلة التصحيحية بعد النفي: ليس الغرض الأول، بل الغرض المقابل.'
- source_word: τοῦ πέμψαντός με
  choice: الذي أرسلني
  rationale: ينقل اسم الفاعل المعرّف بعبارة موصولة طبيعية، من غير أن يضيف إلى النص هنا تسمية «الآب» رغم وضوحها من السياق الأوسع.
theological_decisions:
- issue: دلالة النزول من السماء
  choice: 'إبقاء العبارة المكانية صريحة: «قد نزلتُ من السماء»'
  alternative: تفسيرها ديناميكيًا على أنها مجرد تكليف إلهي
  rationale: النص نفسه يصوغ أصل المتكلم بلغة النزول من السماء؛ لذلك لا ينبغي إضعاف العبارة أو استبدالها بتفسير للمهمة.
- issue: العلاقة بين مشيئة يسوع ومشيئة مُرسِله
  choice: 'تكرار «مشيئة» وحفظ المقابلة: «مشيئتي أنا، بل مشيئة الذي أرسلني»'
  alternative: 'صياغتها: «ما أريده أنا، بل ما يريده الذي أرسلني»'
  rationale: يحفظ التكرار تناظر النص ووزنه اللاهوتي، ويُبقي التمييز الحقيقي في سياق الرسالة والطاعة من غير تفسير مذهبي زائد أو إلغاء للتوتر.
- issue: هوية الذي أرسل يسوع
  choice: «الذي أرسلني» دون إضافة «الآب»
  alternative: «الآب الذي أرسلني»
  rationale: تحافظ الصياغة على حدود العبارة اليونانية في هذه الآية، ولا تستبق تحديد الهوية بتفسير مضاف، مع أن السياق اليوحناوي يوضحها.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «مشيئة» بدل الصياغة التفسيرية «ما أريد»، وحُفظ التوازي والمقابلة. لا توجد حواشٍ لازمة لهذه الآية.
