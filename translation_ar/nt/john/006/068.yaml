lexical_decisions:
- source_word: ἀπεκρίθη αὐτῷ
  choice: فأجابه
  rationale: صياغة عربية طبيعية تجمع فعل الإجابة والضمير العائد إلى يسوع، وتحافظ على وظيفة العبارة السردية.
- source_word: Σίμων Πέτρος
  choice: سمعان بطرس
  rationale: النقل العربي الكتابي الشائع للاسمين.
- source_word: Κύριε
  choice: يا ربّ
  rationale: تحافظ على النداء وعلى الدلالة الاحترامية والثقل اللاهوتي المحتمل للقب κύριος في سياق يوحنا.
- source_word: πρὸς τίνα ἀπελευσόμεθα
  choice: إلى مَن نذهب؟
  rationale: تنقل حرف الجر ذي الوجهة الشخصية وصيغة المستقبل الاستفهامية بأسلوب عربي واضح وطبيعي.
- source_word: ῥήματα
  choice: كلمات
  rationale: تحافظ على صيغة الجمع وعلى الإشارة إلى الأقوال المنطوقة، من غير تحويلها إلى مفهوم تجريدي مفرد.
- source_word: ζωῆς αἰωνίου
  choice: الحياة الأبدية
  rationale: الترجمة العربية المألوفة والدقيقة للتركيب الإضافي، مع الحفاظ على التعبير اليوحناوي المحوري.
- source_word: ἔχεις
  choice: عندك
  rationale: تعبير عربي طبيعي عن الحيازة في هذا السياق، مع بقاء الخطاب المباشر ليسوع.
theological_decisions:
- issue: دلالة Κύριε عند مخاطبة يسوع
  choice: يا ربّ
  alternative: يا سيّد
  rationale: «يا ربّ» تحافظ على كون اللفظ نداء احترام، كما تتيح صداه المسيحاني في إنجيل يوحنا من غير أن تحسم وحدها مدى إدراك بطرس الكامل له.
