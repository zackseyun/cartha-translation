  yaml_path: translation/nt/john/006/030.yaml
  text: So they said to him[a], “Then what sign are you doing, so that we may see and believe you? What work are you doing?”
translation:
  language: ar
  text: 'فقالوا له: «فأيَّ آيةٍ تصنع أنت لنرى ونصدّقك[a]؟ أيَّ عملٍ تعمل؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «نؤمن بك» أو «نثق بك». واليونانية أقرب حرفيًا إلى «نصدّقك»، إذ تستعمل ضمير المخاطَب في حالة الداتيف، لا التعبير اليوحناوي الأشهر الذي يعني «نؤمن بـ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπον οὖν αὐτῷ
  choice: فقالوا له
  rationale: تؤدي الفاء معنى οὖν الاستنتاجي والتتابعي بعبارة عربية طبيعية، مع إبقاء صلة الكلام بما قبله.
- source_word: Τί οὖν
  choice: فأيَّ
  rationale: تحفظ الفاء تكرار οὖν وقوة سؤالهم المبني على كلام يسوع السابق، من غير إثقال الأسلوب.
- source_word: ποιεῖς σὺ σημεῖον
  choice: أيَّ آيةٍ تصنع أنت
  rationale: «آية» هي المقابل العربي الطبيعي للمصطلح اليوحناوي σημεῖον، و«تصنع» تحفظ فعل ποιεῖς، أما إظهار «أنت» فيعكس ضمير التوكيد σὺ ونبرة التحدي.
- source_word: σημεῖον
  choice: آية
  rationale: «آية» تحافظ على كون الفعل علامة تشير إلى ما وراءها، بدل إضافة وصف تفسيري مثل «معجزة».
- source_word: ἵνα ἴδωμεν καὶ πιστεύσωμέν σοι
  choice: لنرى ونصدّقك
  rationale: اللام تؤدي غرض ἵνα مع فعلي الالتماس، و«نصدّقك» تحفظ بناء πιστεύω مع ضمير المجرور σοι، أي تصديق قوله أو دعواه، من غير تحويله صراحة إلى التعبير اليوحناوي الآخر «نؤمن بك».
- source_word: τί ἐργάζῃ
  choice: أيَّ عملٍ تعمل؟
  rationale: يحفظ الاشتقاق العربي بين «عمل» و«تعمل» تلازم ἔργον المفهوم وفعل ἐργάζῃ، كما يميز هذا السؤال قليلًا عن «تصنع» في السؤال الأول.
theological_decisions:
- issue: دلالة πιστεύω مع σοι بصيغة المجرور
  choice: نصدّقك
  alternative: نؤمن بك؛ نثق بك
  rationale: البناء اليوناني هنا هو πιστεύω مع σοι، لا التعبير اليوحناوي الأشهر πιστεύω εἰς. لذلك يحفظ المتن معنى تصديق يسوع أو دعواه، مع ذكر البدائل الممكنة في الحاشية وعدم حسم التوتر الدلالي لاهوتيًا.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُعملت «آية» للمصطلح اليوحناوي، وأُبقي ضمير «أنت» لإظهار التوكيد في الأصل. أما «أيَّ عملٍ تعمل؟» فتحفظ الموازاة اللفظية ونبرة التحدي، وإن كانت أفصح وأشد رسمية قليلًا من لغة الحديث اليومية.
