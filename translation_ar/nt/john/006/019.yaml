  to: فلمّا جدّفوا نحو خمسًا وعشرين أو ثلاثين غلوةً[a]، رأوا يسوع ماشيًا على البحر ومقتربًا من القارب، فخافوا.
  rationale: حُذفت الحاشية [b] لأنها لا تضيف معلومة نصية لازمة وتفسر العلاقة السردية تفسيرًا غير مطلوب. وأُبقيت الحاشية [a] لتعريف وحدة القياس القديمة، مع تعديل طفيف في التعبير إلى «تقريبًا». كما صُحح ضبط العدد في المتن، من دون تغيير المعنى أو درجة الغموض في الأصل.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:19:45Z'
