  text: ἐληλακότες οὖν ὡς σταδίους εἴκοσι πέντε ἢ τριάκοντα θεωροῦσιν τὸν Ἰησοῦν περιπατοῦντα ἐπὶ τῆς θαλάσσης καὶ ἐγγὺς τοῦ πλοίου γινόμενον, καὶ ἐφοβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/019.yaml
  text: So when they had rowed about twenty-five or thirty stadia[a], they saw Jesus walking on the sea and coming near the boat[b], and they were afraid.
translation:
  language: ar
  text: فلمّا جدّفوا نحو خمسًا وعشرين أو ثلاثين غلوةً[a]، رأوا يسوع ماشيًا على البحر ومقتربًا من القارب، فخافوا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: الغلوة وحدة قديمة لقياس المسافة؛ وخمس وعشرون أو ثلاثون غلوة تساوي تقريبًا خمسة إلى ستة كيلومترات.
    reason: cultural_note
lexical_decisions:
- source_word: ἐληλακότες
  choice: جدّفوا
  rationale: الفعل ἐλαύνω في هذا السياق البحري يدل على دفع القارب بالتجديف، و«جدّفوا» أدق من تعبير عام مثل «ساروا».
- source_word: οὖν
  choice: فلمّا
  rationale: أُدمجت قوة الرابط السردي في الفاء، مع «لمّا» التي تنقل الفعل السابق بوصفه تمهيدًا لرؤيتهم يسوع، بأسلوب عربي طبيعي.
- source_word: ὡς
  choice: نحو
  rationale: تفيد ὡς مع قياس المسافة التقريب، و«نحو» واضحة وفصيحة.
- source_word: σταδίους εἴκοσι πέντε ἢ τριάκοντα
  choice: خمسة وعشرين أو ثلاثين غلوةً
  rationale: حُفظت وحدة القياس القديمة بدل إحلال وحدة حديثة في المتن، مع شرحها وتحويلها التقريبي في الحاشية.
- source_word: θεωροῦσιν
  choice: رأوا
  rationale: تنقل الإدراك البصري بوضوح وطبيعية من غير تكلف أو إيحاء تفسيري زائد.
- source_word: περιπατοῦντα ἐπὶ τῆς θαλάσσης
  choice: ماشيًا على البحر
  rationale: يحافظ على لفظ θάλασσα، «البحر»، وعلى المعنى المباشر لحرف الجر في سياق الرواية.
- source_word: ἐγγὺς τοῦ πλοίου γινόμενον
  choice: مقتربًا من القارب
  rationale: ينقل γινόμενον مع ἐγγύς بوصفه حركة إلى القرب، لا مجرد وجود ثابت بالقرب من القارب.
- source_word: πλοίου
  choice: القارب
  rationale: أنسب من «السفينة» لحجم المركب في سياق بحر الجليل.
- source_word: ἐφοβήθησαν
  choice: فخافوا
  rationale: صياغة عربية موجزة وطبيعية تنقل رد فعلهم عند الرؤية.
theological_decisions:
- issue: وصف المعجزة من غير تخفيف معناها المباشر
  choice: ماشيًا على البحر
  alternative: ماشيًا بجانب البحر؛ ماشيًا على الماء
  rationale: السياق يجعل معنى «بجانب البحر» غير ملائم، لأن التلاميذ كانوا في القارب بعيدًا عن الشاطئ. أما «على الماء» فيوضح المقصود، لكنه يستبدل لفظ «البحر» الوارد في اليونانية؛ لذلك حُفظ التعبير المباشر «على البحر».
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعملت «غلوة» بوصفها المقابل العربي التراثي لوحدة stadion، مع شرح حديث في الحاشية. وُضعت علامة الحاشية [a] بعد وحدة القياس، وعلامة [b] بعد جملة الخوف.
