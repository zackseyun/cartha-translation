  source_fidelity: 'المتن ينقل عناصر اليونانية الأساسية بأمانة: التجديف، والمسافة التقريبية، ورؤية يسوع ماشيًا على البحر ومقتربًا من القارب، ثم خوفهم. لكن الحاشية [b] تضيف شرحًا غير لازم ولا تؤدي وظيفة حاشية مستندة إلى لفظٍ أو تركيبٍ محدد في الأصل.'
  naturalness: الصياغة فصيحة معاصرة وواضحة. وتعبير «غلوة» مقبول مع تعريفه في الحاشية؛ وتحسين ضبط العدد في المتن إلى «خمسًا وعشرين» أدق نحويًا في موقعه.
  terminology: «يسوع»، «البحر»، و«القارب» اختيارات سليمة. و«ماشيًا على البحر» يحافظ على لفظ θάλασσα ومعنى ἐπί في السياق من غير تفسير عقائدي زائد.
  issues:
