lexical_decisions:
- source_word: ἐγώ εἰμι
  choice: أنا هو
  rationale: صيغة عربية فصيحة وطبيعية في هذا القول الاسمي، تحفظ التصريح بالفاعل وقوة تعريف يسوع بنفسه، من غير إضافة تفسير لاهوتي غير موجود في اليونانية.
- source_word: ὁ ἄρτος
  choice: خبز
  rationale: «خبز» هو المقابل العربي الطبيعي للاسم، وهو هنا خبر معرّف بالإضافة الآتية؛ لذلك لا يلزم إدخال «الـ» عليه.
- source_word: τῆς ζωῆς
  choice: الحياة
  rationale: 'تُرجمت الإضافة اليونانية بإضافة عربية مباشرة: «خبز الحياة»، محافظةً على إيجاز العبارة وعلى احتمال العلاقة الدلالية دون توسيعها إلى «الذي يمنح الحياة».'
theological_decisions:
- issue: قوة قول «أنا هو» في لاهوت يوحنا
  choice: أنا هو خبز الحياة
  alternative: أنا خبز الحياة
  rationale: العبارة اليونانية هنا جملة ذات خبر، لا استعمال مطلق لعبارة ἐγώ εἰμι. تحافظ الصياغة المختارة على قوة التعريف الذاتي من غير تحويلها إلى تصريح لاهوتي أوسع من النص.
- issue: دلالة إضافة «الحياة» إلى «الخبز»
  choice: الإبقاء على «خبز الحياة»
  alternative: الخبز الذي يمنح الحياة
  rationale: الإضافة اليونانية موجزة ويمكن أن تحمل أكثر من وجه دلالي مترابط؛ أما البديل فيحسمها بوصفها إفادة أو منحًا للحياة، وهو تفسير محتمل لكنه أصرح من الأصل.
