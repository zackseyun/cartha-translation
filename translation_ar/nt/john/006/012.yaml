  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὡς δὲ ἐνεπλήσθησαν λέγει τοῖς μαθηταῖς αὐτοῦ· Συναγάγετε τὰ περισσεύσαντα κλάσματα, ἵνα μή τι ἀπόληται.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/012.yaml
  text: And when they were filled[a], he says to his disciples, “Gather up the leftover pieces[d][c][b], so that nothing may be lost.”
translation:
  language: ar
  text: 'ولمّا شبعوا[a]، يقول لتلاميذه[b]: «اجمعوا الكِسَر المتبقية[c]، لئلا يضيع منها شيء[d]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «امتلأوا» أو «أكلوا حتى شبعوا».'
    reason: lexical_alternative
  - marker: b
    text: 'جاء الفعل في اليونانية بالمضارع التاريخي: «يقول». ويمكن في العربية السردية أن يقال: «قال».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «القطع المتبقية» أو «الفتات المتبقي». وتشير اللفظة اليونانية إلى قطع مكسورة.'
    reason: lexical_alternative
  - marker: d
    text: 'أو: «لئلا يُهدَر شيء منها». واليونانية، على نحو أكثر حرفية، تقول: «لئلا يضيع شيء».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: ولمّا
  rationale: تنقل الظرفية الزمنية مع أداة الربط الخفيفة في صياغة عربية طبيعية تحافظ على تدفق السرد.
- source_word: ἐνεπλήσθησαν
  choice: شبعوا
  rationale: الفعل المبني للمجهول يدل هنا على الامتلاء من الطعام والوصول إلى الشبع؛ و«شبعوا» أوضح وأفصح في العربية من النقل الحرفي «امتلأوا».
- source_word: λέγει
  choice: يقول
  rationale: أُبقي المضارع التاريخي كما في اليونانية، وهو مفهوم في السرد العربي ويبرز حيوية المشهد.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: لتلاميذه
  rationale: «التلاميذ» هو المقابل الاصطلاحي الدقيق في سياق الأناجيل، والضمير ينقل αὐτοῦ بإيجاز طبيعي.
- source_word: Συναγάγετε
  choice: اجمعوا
  rationale: أمر مباشر طبيعي، يؤدي معنى جمع الأشياء المتفرقة.
- source_word: τὰ περισσεύσαντα κλάσματα
  choice: الكِسَر المتبقية
  rationale: «الكِسَر» تنقل κλάσματα بوصفها قطعًا مكسورة من الخبز، و«المتبقية» تنقل ما فضل بعد الأكل.
- source_word: ἵνα μή τι ἀπόληται
  choice: لئلا يضيع منها شيء
  rationale: تحافظ العبارة على معنى الضياع الأقرب إلى اللفظ اليوناني، مع إيضاح المرجع المادي بضمير «منها» دون اختزاله إلى معنى الإسراف فقط.
theological_decisions:
- issue: احتمال تحميل ἀπόληται معنى خلاصيًا بسبب استعمالاته الأخرى في يوحنا
  choice: لئلا يضيع منها شيء
  alternative: لئلا يُهدَر شيء منها
  rationale: السياق المباشر يتحدث عن كِسَر الطعام، لكن اختيار «يضيع» يحفظ الصدى المعجمي الأوسع الممكن في إنجيل يوحنا من غير أن يفرض تأويلًا خلاصيًا على الآية.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. استُعمل «شبعوا» لطبيعته في سياق الطعام، وحُفظ المضارع التاريخي «يقول»، مع إبقاء «يضيع» لعدم إغلاق التوتر الدلالي في اللفظة اليونانية.
