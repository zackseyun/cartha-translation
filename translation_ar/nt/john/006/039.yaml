source:
  edition: SBLGNT
  text: τοῦτο δέ ἐστιν τὸ θέλημα τοῦ πέμψαντός ⸀με ἵνα πᾶν ὃ δέδωκέν μοι μὴ ἀπολέσω ἐξ αὐτοῦ ἀλλὰ ἀναστήσω ⸀αὐτὸ τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/039.yaml
  text: 'And this is the will of the one who sent me: that I should lose nothing of all that he has given me[a], but should raise it up on the last day.'
translation:
  language: ar
  text: 'وهذه هي مشيئةُ الذي أرسلني: ألّا أُضيِّع شيئًا من كلِّ ما أعطانيه[a]، بل أن أُقيمه في اليوم الأخير.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بصياغة أكثر تخصيصًا للأشخاص: «ألّا أُضيِّع أحدًا من كلِّ الذين أعطاني إياهم ... بل أن أُقيمهم». يستعمل اليوناني تعبيرًا جمعيًّا بصيغة المفرد، وحرفيًّا: «كلَّ ما ... إياه».'
    reason: alternative_reading
lexical_decisions:
- source_word: θέλημα
  choice: مشيئة
  rationale: «مشيئة» هي المقابل العربي الطبيعي في هذا السياق لمقصد الله وإرادته، من غير حصرها في مجرد رغبة أو في صياغة عقدية أخص.
- source_word: τοῦ πέμψαντός με
  choice: الذي أرسلني
  rationale: يحافظ على قوة اسم الفاعل المعرَّف وعلى العلاقة الفعلية الواضحة، بصياغة عربية طبيعية.
- source_word: ἵνα
  choice: ألّا ... بل أن
  rationale: تُبيّن مضمون المشيئة وغايتها في تركيب عربي سلس، مع الحفاظ على المقابلة بين النفي والاستدراك.
- source_word: πᾶν ὃ δέδωκέν μοι
  choice: كلِّ ما أعطانيه
  rationale: يحافظ على صيغة المحايد المفرد ذات المعنى الجمعي في اليونانية، ولا يحوّل المرجع صراحةً إلى أشخاص قبل أن يفعل النص ذلك.
- source_word: δέδωκέν
  choice: أعطانيه
  rationale: الفعل «أعطى» هو المقابل المباشر؛ وتؤدي صيغة الماضي العربية هنا معنى الفعل التام اليوناني في السياق، أي العطاء المنجز القائم الأثر.
- source_word: μὴ ἀπολέσω ἐξ αὐτοῦ
  choice: ألّا أُضيِّع شيئًا من
  rationale: في هذا السياق يفيد ἀπόλλυμι عدم فقدان شيء من العطية، و«أُضيِّع» عربية طبيعية تحفظ مسؤولية عدم الفقد من غير إيحاء غير لازم بالإهلاك المباشر.
- source_word: ἀναστήσω αὐτὸ
  choice: أُقيمه
  rationale: «أُقيمه» تعبير عربي كتابي واضح للقيامة، ويحافظ ضمير المفرد على الصيغة الجمعية المفردة في الأصل.
- source_word: τῇ ἐσχάτῃ ἡμέρᾳ
  choice: في اليوم الأخير
  rationale: صياغة عربية مألوفة وواضحة تحفظ الإشارة الأخروية في إنجيل يوحنا.
theological_decisions:
- issue: هل تُصاغ العطية بصيغة شخصية جمعًا أم بحسب التعبير اليوناني المحايد المفرد ذي الدلالة الجمعية؟
  choice: كل ما أعطانيه ... أُقيمه
  alternative: كل من أعطاني إياهم ... أُقيمهم
  rationale: 'تستعمل اليونانية صيغًا محايدة مفردة: πᾶν وὃ وαὐτό. لذلك تحافظ الترجمة الرئيسية على التعبير الجمعي المفرد، مع بيان الصياغة الشخصية الممكنة في الحاشية، من غير حسمٍ زائد لهوية المرجع على مستوى الصياغة النحوية.'
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «مشيئة» و«أُقيمه» اتساقًا مع السياق اللاهوتي والقيامي، مع إبقاء البنية الجمعية المفردة في المتن وشرح البديل الشخصي في الحاشية.
