source:
  edition: SBLGNT
  text: εἶπον οὖν πρὸς αὐτόν· Τί ποιῶμεν ἵνα ἐργαζώμεθα τὰ ἔργα τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/028.yaml
  text: Then they said to him[a], “What must we do so that we may work the works of God?”
translation:
  language: ar
  text: 'فقالوا له إذًا: «ماذا ينبغي أن نفعل لكي نعمل أعمال الله[a]؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا فهم العبارة بمعنى: «ماذا ينبغي أن نفعل لكي نقوم بالأعمال التي يطلبها الله؟» فالإضافة في اليونانية تحتمل هذا المعنى، كما تحتمل أن تكون الأعمال لله أو صادرة عنه.'
    reason: قراءة بديلة تحفظ تعدد دلالات الإضافة اليونانية.
lexical_decisions:
- source_word: εἶπον
  choice: قالوا
  rationale: صيغة الماضي تُترجم بفعل سردي بسيط، ولا تستلزم معنى أكثر تخصيصًا مثل «أخبروه».
- source_word: οὖν
  choice: إذًا
  rationale: تربط السؤال بما سبقه وتحتمل معنى الاستمرار والاستنتاج، و«إذًا» تحافظ على هذه الصلة دون جعلها زمنية محضة.
- source_word: πρὸς αὐτόν
  choice: له
  rationale: مع فعل القول، تفيد πρός مع النصب توجيه الكلام إلى المخاطَب، ويؤديها التعبير العربي المألوف «قالوا له».
- source_word: Τί ποιῶμεν
  choice: ماذا ينبغي أن نفعل
  rationale: السؤال بصيغة المضارع الالتزامية سؤال تداولي عن الفعل المطلوب؛ و«ينبغي» تنقل هذه القوة من غير تشديد زائد إلى حد الإلزام المطلق.
- source_word: ἵνα
  choice: لكي
  rationale: تُدخل جملة الغاية بعبارة عربية واضحة وطبيعية.
- source_word: ἐργαζώμεθα
  choice: نعمل
  rationale: تحافظ على الصلة اللفظية المقصودة مع الاسم التالي ἔργα، كما في «نعمل أعمال».
- source_word: τὰ ἔργα
  choice: أعمال
  rationale: «أعمال» هي المقابل الطبيعي، وتحفظ التكرار الاشتقاقي والرنين الدلالي في السياق اليوحناوي.
- source_word: τοῦ θεοῦ
  choice: الله
  rationale: تركيب «أعمال الله» يبقي علاقة المضاف بالمضاف إليه مفتوحة، فلا يحسم هل المقصود الأعمال التي يطلبها الله أم التي تخصه أو تصدر عنه.
theological_decisions:
- issue: دلالة الإضافة في τὰ ἔργα τοῦ θεοῦ
  choice: إبقاء العبارة «أعمال الله» بلا حسم
  alternative: الأعمال التي يطلبها الله
  rationale: الإضافة اليونانية تحتمل أكثر من علاقة دلالية، ويستثمر العدد التالي هذا التوتر؛ لذلك لا ينبغي إدخال تفسير واحد في صلب النص.
translation_notes:
  register: لغة عربية فصحى معاصرة واضحة وكريمة. حُفظ التكرار بين «نفعل» و«نعمل أعمال»، مع إبقاء «أعمال الله» على غموضها الدلالي المقصود.
