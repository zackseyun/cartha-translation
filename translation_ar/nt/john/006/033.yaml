base_translation:
  language: en
  yaml_path: translation/nt/john/006/033.yaml
  text: For the bread of God is the one who comes down from heaven and gives life to the world[a].
translation:
  language: ar
  text: لِأَنَّ خُبْزَ اللهِ هُوَ الَّذِي يَنْزِلُ مِنَ السَّمَاءِ وَيَهَبُ الْحَيَاةَ لِلْعَالَمِ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ما ينزل من السماء ويهب الحياة للعالم». يمكن فهم العبارة اليونانية على نحو غير شخصي، لكن صيغتا اسم الفاعل المذكرتان ترجّحان الإشارة إلى شخص.'
    reason: alternative_reading
lexical_decisions:
- source_word: γὰρ
  choice: لِأَنَّ
  rationale: تُبقي الصلة التعليلية بما سبق، وهي صياغة عربية واضحة وطبيعية.
- source_word: ἄρτος
  choice: خُبْز
  rationale: يحفظ الصورة الحسية المركزية في الخطاب بدل تعميمها إلى «طعام».
- source_word: τοῦ θεοῦ
  choice: اللهِ
  rationale: الإضافة في «خُبْزَ اللهِ» تحفظ اتساع دلالة المضاف إليه بين النسبة والملكية والمصدر، من غير حسم زائد.
- source_word: ὁ καταβαίνων
  choice: الَّذِي يَنْزِلُ
  rationale: اسم الفاعل المعرّف في اليونانية مذكر مفرد، فتُبقي «الذي» الإشارة الشخصية المرجحة، مع التعبير الطبيعي عن الفعل المستمر أو المميز.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: مِنَ السَّمَاءِ
  rationale: ترجمة عربية مألوفة تحفظ دلالة المصدر والمنشأ.
- source_word: ζωὴν
  choice: الْحَيَاةَ
  rationale: يحفظ اللفظ البسيط والثقيل دلاليًا والمركزي في إنجيل يوحنا.
- source_word: διδοὺς
  choice: يَهَبُ
  rationale: يعبر طبيعيًا عن منح الحياة، ويحفظ اقتران الفعل بالفعل السابق بوصفهما عملين مميزين للمرجع.
- source_word: τῷ κόσμῳ
  choice: لِلْعَالَمِ
  rationale: يحفظ المصطلح اليوحناوي واتساعه، ولا يضيقه إلى «البشرية» أو إلى فئة لاهوتية محددة.
theological_decisions:
- issue: الإشارة الشخصية أو غير الشخصية في ὁ καταβαίνων ... καὶ ζωὴν διδοὺς
  choice: استخدام «الذي ينزل من السماء ويهب الحياة للعالم» بصيغة ترجّح المرجع الشخصي.
  alternative: «ما ينزل من السماء ويهب الحياة للعالم» بصيغة غير شخصية.
  rationale: أداتا اسم الفاعل في اليونانية مذكرتان مفردتان، وهذا يرجح مرجعًا شخصيًا ويمهد لتعريف يسوع نفسه بأنه الخبز، من غير إضافة تفسير عقائدي إلى المتن. وتُذكر الإمكانية غير الشخصية في الحاشية حفاظًا على موضع الالتباس الحقيقي.
- issue: مدى دلالة κόσμος
  choice: الإبقاء على «العالم».
  alternative: «البشرية» أو «جميع الناس».
  rationale: «العالم» يحفظ سعة التعبير الأصلي والتوتر اللاهوتي في النص من غير تحديد مسبق لمدى المنح أو كيفية تطبيقه.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «يهب» لفصاحتها الطبيعية مع «الحياة»، وحُفظت صورة «خبز الله» ومصطلح «العالم». أُثبتت علامة الحاشية [a] في المتن.
