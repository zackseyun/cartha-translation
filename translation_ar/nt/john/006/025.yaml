  text: And when they found him on the other side of the sea[a], they said to him, “Rabbi, when did you get here?”
translation:
  language: ar
  text: 'ولمّا وجدوه في الجانب الآخر من البحر، قالوا له: «يا رابّي، متى جئت إلى هنا؟»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «متى أتيت إلى هنا؟» الفعل اليوناني بصيغة التام، ويمكن نقله بصياغة أكثر رسمية على هذا النحو، لكن المقصود في السياق هو المجيء والوصول.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ εὑρόντες αὐτόν
  choice: ولمّا وجدوه
  rationale: تؤدي «لمّا» المعنى الزمني لاسم الفاعل اليوناني الماضي، وتحافظ على تعاقب الحدثين بصياغة عربية طبيعية، بينما تصل الواو الكلام بما سبقه.
- source_word: πέραν τῆς θαλάσσης
  choice: في الجانب الآخر من البحيرة
  rationale: تفيد العبارة موضعًا واقعًا في الجهة المقابلة عبر الماء. و«البحيرة» أوضح في هذا السياق الجغرافي العربي من «البحر»، مع بقاء معنى العبور إلى الجانب الآخر.
- source_word: Ῥαββί
  choice: يا رَبِّي
  rationale: نقلٌ صوتي للقب اليهودي في النداء، يحفظ البيئة التاريخية ولا يستبدله بالتفسير «يا معلّم».
- source_word: πότε
  choice: متى
  rationale: المقابل العربي الطبيعي لأداة الاستفهام الزمانية.
- source_word: ὧδε
  choice: إلى هنا
  rationale: مع فعل المجيء، تعبّر «إلى هنا» طبيعيًا عن بلوغ هذا الموضع.
- source_word: γέγονας
  choice: جئت
  rationale: صيغة التام من γίνομαι تدل هنا بحسب السياق على الوصول أو الحضور. «جئت» عربية طبيعية وتحفظ معنى الوصول من غير ترجمة حرفية مضللة مثل «صرت».
- source_word: εἶπον αὐτῷ
  choice: قالوا له
  rationale: يحافظ على الدلالة المباشرة للفعل λέγω، مع أن مضمون القول سؤال؛ أما «سألوه» فتفسير للسياق.
