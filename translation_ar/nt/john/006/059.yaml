lexical_decisions:
- source_word: ταῦτα
  choice: هذا
  rationale: اسم الإشارة المحايد الجمع يعود إلى مجمل الأقوال السابقة. والعربية الفصيحة تعبّر طبيعيًا عن مجموع الكلام بالمفرد «هذا»، من غير أن تحصره في قول واحد.
- source_word: εἶπεν
  choice: قال
  rationale: ترجمة مباشرة لفعل λέγω في الماضي، مع إبقاء الفاعل مستترًا كما في اليونانية، وهو مفهوم من السياق أنه يسوع.
- source_word: ἐν συναγωγῇ
  choice: في المجمع
  rationale: يدل السياق المحلي على مجمع معروف في كفرناحوم، و«المجمع» هو المقابل العربي الواضح لموضع العبادة اليهودي.
- source_word: διδάσκων
  choice: وهو يعلِّم
  rationale: تعكس العبارة اسم الفاعل الحالي بوصفه فعلًا متزامنًا مع «قال»، في صياغة عربية طبيعية.
- source_word: ἐν Καφαρναούμ
  choice: في كفرناحوم
  rationale: نقل صوتي مألوف لاسم الموضع Καφαρναούμ مع حرف الجر المكاني الطبيعي «في».
