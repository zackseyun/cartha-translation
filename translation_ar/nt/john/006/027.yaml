  text: ἐργάζεσθε μὴ τὴν βρῶσιν τὴν ἀπολλυμένην ἀλλὰ τὴν βρῶσιν τὴν μένουσαν εἰς ζωὴν αἰώνιον, ἣν ὁ υἱὸς τοῦ ἀνθρώπου ὑμῖν δώσει, τοῦτον γὰρ ὁ πατὴρ ἐσφράγισεν ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/027.yaml
  text: Do not work for the food that perishes[a], but for the food that remains to eternal life, which the Son of Man will give to you[b]; for God the Father has set his seal on him.
translation:
  language: ar
  text: لا تعملوا من أجل الطعام الزائل، بل من أجل الطعام الذي يبقى للحياة الأبدية[a]، الذي سيعطيكم إياه ابن الإنسان؛ لأن الله الآب قد وضع ختمه عليه[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الذي يدوم للحياة الأبدية». وقد تدل العبارة اليونانية على الغاية أو النتيجة.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «ختم». وتوحي صورة الختم بالتصديق أو التوثيق أو التفويض.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐργάζεσθε μὴ ... ἀλλὰ
  choice: لا تعملوا من أجل ... بل من أجل
  rationale: يحفظ صيغة الأمر المنهي عنه والتقابل، ويجعل المقصود بالعمل من أجل شيء واضحًا في العربية.
- source_word: βρῶσιν
  choice: الطعام
  rationale: المقصود في السياق ما يُؤكل، و«الطعام» أدق تعبير عربي طبيعي.
- source_word: τὴν ἀπολλυμένην
  choice: الزائل
  rationale: ينقل معنى الطعام المعرض للفناء والفساد دون حصره في التلف المادي وحده.
- source_word: τὴν μένουσαν
  choice: الذي يبقى
  rationale: يحفظ التقابل مع الطعام الزائل، بلغة عربية واضحة ومعاصرة.
- source_word: εἰς ζωὴν αἰώνιον
  choice: للحياة الأبدية
  rationale: ينقل دلالة الغاية أو النتيجة في εἰς بصياغة عربية طبيعية، مع إثبات البديل الأقرب حرفيًا في الحاشية.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ابن الإنسان
  rationale: الترجمة الاصطلاحية الراسخة لهذا اللقب، وتحفظ صلته اللفظية وخلفيته الكتابية.
- source_word: ὑμῖν δώσει
  choice: سيعطيكم إياه
  rationale: صياغة عربية طبيعية تحفظ الفعل المستقبل والمفعول غير المباشر، وتعيد الضمير إلى الطعام.
- source_word: ἐσφράγισεν
  choice: قد وضع ختمه عليه
  rationale: يحفظ صورة الختم في اليونانية بدل استبدالها بتفسير مجرد مثل «فوّضه» أو «صدّق عليه».
- source_word: ὁ πατὴρ ... ὁ θεός
  choice: الله الآب
  rationale: ينقل التركيب البدلي الذي يعرّف الآب بأنه الله بصياغة عربية موجزة ومألوفة.
theological_decisions:
- issue: دلالة الطعام الباقي εἰς ζωὴν αἰώνιον
  choice: الذي يبقى للحياة الأبدية
  alternative: الذي يبقى إلى حياة أبدية
  rationale: تحفظ الصياغة المختارة دلالة الغاية أو النتيجة دون أن تحدد آلية العلاقة، وتورد الحاشية البديل الأقرب إلى حرف الجر اليوناني.
- issue: معنى ختم الآب لابن الإنسان
  choice: قد وضع ختمه عليه
  alternative: قد أثبت صدقه أو فوّضه
  rationale: الإبقاء على الاستعارة يمنع حصرها في تفسير لاهوتي واحد؛ ويمكن أن تفيد التصديق أو الإثبات أو التفويض بحسب السياق.
- issue: تركيب ὁ πατὴρ ... ὁ θεός
  choice: الله الآب
  alternative: الآب، أي الله
  rationale: الصياغة العربية المختارة تنقل تعريف الآب بأنه الله من غير إضافة تفصيل عقائدي غير مصرح به في الآية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «الزائل» في مقابل «الذي يبقى» لإبراز التضاد، وحُفظت استعارة الختم مع شرح موجز في الحاشية دون حسمها في معنى لاهوتي واحد.
