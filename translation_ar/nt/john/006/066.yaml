  text: Ἐκ τούτου πολλοὶ ⸀ἐκ ⸂τῶν μαθητῶν αὐτοῦ ἀπῆλθον⸃ εἰς τὰ ὀπίσω καὶ οὐκέτι μετ’ αὐτοῦ περιεπάτουν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/066.yaml
  text: From this time many of his disciples went back and no longer walked with him[a].
translation:
  language: ar
  text: ومنذ ذلك الوقت رجع كثيرون من تلاميذه إلى الوراء، ولم يعودوا يسيرون معه[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وبسبب هذا، انصرف كثيرون من تلاميذه»؛ إذ يمكن فهم العبارة اليونانية الافتتاحية على معنى السببية، وإن كان السياق يرجّح دلالتها على بداية مرحلة جديدة: «ومنذ ذلك الوقت».'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐκ τούτου
  choice: ومنذ ذلك الوقت
  rationale: يفهم التركيب هنا زمنيًا في ضوء السياق، إذ يشير إلى نقطة تحوّل بدأت بعدها مغادرة كثيرين، مع إثبات الاحتمال السببي في الحاشية.
- source_word: πολλοὶ ἐκ τῶν μαθητῶν αὐτοῦ
  choice: كثيرون من تلاميذه
  rationale: يحفظ معنى التبعيض الذي تفيده ἐκ، من غير أن يوحي بأن جميع التلاميذ رجعوا.
- source_word: ἀπῆλθον εἰς τὰ ὀπίσω
  choice: رجع ... إلى الوراء
  rationale: ينقل اجتماع فعل الذهاب مع التعبير الاتجاهي، فيدل على التراجع والانصراف لا على مجرد المغادرة.
- source_word: οὐκέτι
  choice: لم يعودوا
  rationale: صياغة عربية طبيعية تدل على توقف الفعل منذ تلك النقطة.
- source_word: μετ’ αὐτοῦ περιεπάτουν
  choice: يسيرون معه
  rationale: يحفظ صورة السير الواردة في اليونانية وما تتضمنه في السياق من استمرار الصحبة والاتباع، من غير اختزالها تفسيريًا في «يتبعونه».
theological_decisions:
- issue: هل يُصاغ μαθηταί بما يحصر المقصود في الاثني عشر أو يقرر حقيقة إيمانهم؟
  choice: تلاميذه
  alternative: أتباعه
  rationale: يحافظ لفظ «تلاميذه» على الفئة السردية التي يسميها النص، من غير مساواتها بالاثني عشر أو الفصل مسبقًا في طبيعة إيمان هؤلاء.
- issue: دلالة «السير معه»
  choice: يسيرون معه
  alternative: يتبعونه
  rationale: يبقي التعبير المجازي مفتوحًا على الصحبة والاتباع المستمرين، ولا يحسمه بلفظ تفسيري واحد.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُعمل «رجعوا إلى الوراء» لإبراز قوة التعبير اليوناني، و«يسيرون معه» للمحافظة على صورته المجازية مع وضوحها للقارئ العام.
