  rationale: تفيد العبارة انتقالًا زمنيًا مع صلة بما قبلها؛ و«ولمّا» تؤدي المعنيين بعبارة عربية طبيعية من غير إدخال ظرف بمعنى «الآن».
- source_word: ὀψία ἐγένετο
  choice: حلّ المساء
  rationale: تعبير عربي فصيح وطبيعي يدل على مجيء وقت المساء، ويقابل دلالة العبارة اليونانية.
- source_word: κατέβησαν
  choice: نزل
  rationale: يحافظ على معنى الحركة إلى أسفل، ويلائم اتجاه التلاميذ نحو المسطح المائي.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: تلاميذه
  rationale: صياغة عربية طبيعية ومباشرة لبنية الاسم مع ضمير الملكية.
- source_word: ἐπὶ τὴν θάλασσαν
  choice: إلى البحر
  rationale: تدل ἐπί مع حالة النصب بعد فعل حركة على الاتجاه إلى المكان، و«البحر» هو المقابل المباشر لـ θάλασσα.
