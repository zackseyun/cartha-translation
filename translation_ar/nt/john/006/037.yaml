  text: πᾶν ὃ δίδωσίν μοι ὁ πατὴρ πρὸς ἐμὲ ἥξει, καὶ τὸν ἐρχόμενον πρός ⸀με οὐ μὴ ἐκβάλω ἔξω,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/037.yaml
  text: All that the Father gives me will come to me[b][a], and the one who comes to me I will certainly not cast out.
translation:
  language: ar
  text: كلُّ ما يعطيني الآبُ سيأتي إليَّ، ومن يأتي إليَّ فلن أطرده إلى الخارج أبدًا[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فلن أطرده إلى الخارج بأي حال». في اليونانية نفيٌ مؤكد.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν ὃ
  choice: كلُّ ما
  rationale: يحافظ على صيغة المفرد المحايد ذات الدلالة الجمعية في اليونانية، من غير تحويلها صراحةً إلى «كل من»، مع بقاء العربية طبيعية وواضحة.
- source_word: δίδωσίν μοι
  choice: يعطيني
  rationale: مضارع بسيط يوافق زمن الفعل اليوناني ولا يفترض أن العطاء مستمر أو مكتمل على نحو لا يصرح به النص.
- source_word: ὁ πατήρ
  choice: الآب
  rationale: يحافظ على أداة التعريف وعلى الاستعمال اليوحناوي، من غير إضافة ضمير ملكية غير موجود صراحةً.
- source_word: πρὸς ἐμὲ ἥξει
  choice: سيأتي إليَّ
  rationale: تعبير عربي طبيعي ودقيق لمعنى المجيء نحو يسوع.
- source_word: τὸν ἐρχόμενον πρός με
  choice: من يأتي إليَّ
  rationale: ينقل اسم الفاعل المعرّف بدلالة عامة في صياغة عربية سلسة، من غير تضييق مرجعه.
- source_word: οὐ μὴ ἐκβάλω ἔξω
  choice: فلن أطرحه خارجًا أبدًا
  rationale: «لن... أبدًا» تنقل النفي اليوناني المؤكد، و«أطرحه خارجًا» تحفظ فعل الطرد مع الظرف ἔξω بدل امتصاصه ضمنيًا.
theological_decisions:
- issue: صيغة πᾶν ὃ الجمعية وعلاقتها بعطاء الآب ومجيء البشر
  choice: كلُّ ما يعطيني الآب
  alternative: كلُّ من يعطيني الآب
  rationale: يحفظ الاختيار الصيغة الجمعية المحايدة في الأصل ولا يحسم التوتر التفسيري بتحويلها إلى تعبير شخصي صريح.
- issue: قوة الوعد في οὐ μὴ ἐκβάλω ἔξω
  choice: فلن أطرحه خارجًا أبدًا
  alternative: فلن أطرحه خارجًا بأي حال
  rationale: ينقل النفي المؤكد بوصفه ضمانًا قويًا لقبول الآتي، من غير توسيعه إلى صياغة مذهبية عن الثبات أو الارتداد.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعمل «الآب» وفق الاصطلاح الكتابي، وحُفظت الصيغة الجمعية «كل ما» والنفي المؤكد من دون تفسير مذهبي زائد.
