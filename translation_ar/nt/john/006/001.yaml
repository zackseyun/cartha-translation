  text: Μετὰ ταῦτα ἀπῆλθεν ὁ Ἰησοῦς πέραν τῆς θαλάσσης τῆς Γαλιλαίας τῆς Τιβεριάδος.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/001.yaml
  text: After these things[a], Jesus went away to the other side of the Sea of Galilee[b], which is the Sea of Tiberias.
translation:
  language: ar
  text: بعد هذه الأمور، مضى يسوع إلى الضفة الأخرى من بحر الجليل، أي بحر طبرية.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يُعرف هذا المسطح المائي أيضًا باسم «بحر طبرية»؛ فالاسمان يشيران هنا إلى البحر نفسه.
    reason: cultural_note
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: بعد هذه الأمور
  rationale: يحافظ على صيغة الجمع في اليونانية وعلى العبارة الانتقالية المميزة ليوحنا، مع بقاء العربية واضحة وطبيعية.
- source_word: ἀπῆλθεν
  choice: مضى
  rationale: ينقل معنى الذهاب والمغادرة بإيجاز عربي فصيح، من غير إضافة كيفية العبور التي لا يصرح بها النص.
- source_word: πέραν
  choice: إلى الضفة الأخرى من
  rationale: هذا هو المقابل السياقي الطبيعي عند الحديث عن الانتقال إلى الجانب المقابل من مسطح مائي.
- source_word: τῆς θαλάσσης
  choice: بحر
  rationale: يحافظ على لفظ θάλασσα وعلى الاسم الكتابي المعروف، مع أن المسطح المائي بحيرة جغرافيًا.
- source_word: τῆς Γαλιλαίας
  choice: الجليل
  rationale: 'تُصاغ الإضافة اليونانية طبيعيًا في العربية باسم المكان: «بحر الجليل».'
- source_word: τῆς Τιβεριάδος
  choice: أي بحر طبرية
  rationale: يبيّن أن «طبرية» تسمية أخرى للمسطح المائي نفسه، ويؤدي التتابع الإضافي اليوناني بعبارة عربية واضحة.
theological_decisions: []
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختيرت «مضى» بدل صيغة أثقل مثل «غادر»، وحُفظ جمع العبارة الافتتاحية «هذه الأمور». وُضعت علامة الحاشية بعد الاسم البديل لأنها تشرح ازدواج التسمية.
