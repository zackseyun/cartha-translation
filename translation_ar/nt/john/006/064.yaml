    rationale: النص اليوناني في هذه الآية يقول فقط إن شخصًا «سيسلّمه»؛ أما تحديد «خصومه» فمستفاد من السياق الأوسع لا من ألفاظ الآية نفسها. كما أن الحاشية الموسومة lexical_alternative ينبغي أن تقدّم بديلًا معجميًا/سياقيًا موجزًا، لا تفسيرًا تفصيليًا.
