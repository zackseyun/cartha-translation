base_translation:
  language: en
  yaml_path: translation/nt/john/006/064.yaml
  text: But there are some among you who do not believe[a]. For Jesus knew from the beginning who those were who did not believe[b], and who it was who would betray him.
translation:
  language: ar
  text: لكِنَّ بَعْضَكُمْ لا يُؤْمِنُونَ. فقد كان يسوعُ يَعْلَمُ منذُ البدءِ مَنِ الذينَ لا يُؤْمِنُونَ، ومَنِ الذي سيُسَلِّمُهُ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: سيخونه.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: لكِنَّ
  rationale: أداة استدراك تُظهر التعارض مع الكلام السابق بوضوح وطبيعية.
- source_word: ἐξ ὑμῶν τινες
  choice: بَعْضَكُمْ
  rationale: تعبير عربي موجز وطبيعي يدل على فئة غير محددة من المخاطَبين، ويحفظ معنى الانتماء إلى الجماعة.
- source_word: οἳ οὐ πιστεύουσιν
  choice: لا يُؤْمِنُونَ
  rationale: المضارع العربي يحفظ دلالة الحالة المستمرة في السياق من غير تكلّف.
- source_word: ᾔδει
  choice: كان يَعْلَمُ
  rationale: ينقل حالة العلم القائمة في الماضي، وهو أنسب من صيغة قد توحي باكتساب المعرفة حينئذ.
- source_word: ἐξ ἀρχῆς
  choice: منذُ البدءِ
  rationale: يحفظ العبارة الزمنية كما وردت من غير تحديدٍ لماهية البدء، إذ يظل ذلك مفتوحًا سياقيًا.
- source_word: οἱ μὴ πιστεύοντες
  choice: الذينَ لا يُؤْمِنُونَ
  rationale: صياغة عربية طبيعية تحفظ دلالة اسم الفاعل اليوناني على جماعة متصفة بعدم الإيمان.
- source_word: παραδώσων
  choice: سيُسَلِّمُهُ
  rationale: يحفظ المعنى الأساسي للفعل، أي تسليم يسوع إلى الآخرين، ولا يحسم في المتن وحده الدلالة السياقية على الخيانة.
- source_word: αὐτόν
  choice: ـهُ
  rationale: ضمير المفعول يعود إلى يسوع بوضوح.
theological_decisions:
- issue: دلالة πιστεύω في استجابة التلاميذ ليسوع
  choice: يؤمنون
  alternative: يثقون
  rationale: «يؤمنون» هو المقابل العربي الأوسع والأرسخ في يوحنا، ويحفظ البعدين التصديقي والعلائقي من غير تضييق المعنى.
- issue: دلالة παραδίδωμι في الإشارة إلى يهوذا
  choice: يُسَلِّمُه
  alternative: يخونه
  rationale: اختير المعنى المعجمي المباشر في المتن حفاظًا على صورة التسليم، مع بيان الدلالة السياقية على الخيانة في الحاشية، فلا تُطمس العلاقة بين فعل التسليم ومسار الأحداث.
translation_notes:
  register: لغة عربية فصحى واضحة ومهيبة، ببناء طبيعي مع المحافظة على الغموض الزمني في «منذ البدء» وعلى التوتر الدلالي في فعل «يُسلِّمه». أُثبتت الحركات الجزئية فقط حيث تعين القراءة.
