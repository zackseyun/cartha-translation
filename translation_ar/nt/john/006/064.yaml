  verdict: revise
  source_fidelity: 'المتن ينقل عناصر اليونانية بأمانة: الاستدراك، وجود فئة من المخاطَبين لا تؤمن، علم يسوع السابق «منذ البدء»، وتحديد الشخص الذي «سيسلّمه». واختيار «سيُسَلِّمُه» يحافظ على المعنى المعجمي المباشر لـ παραδίδωμι ولا يفرض تفسيرًا مذهبيًا.'
  naturalness: الصياغة فصيحة وواضحة عمومًا، و«كان يسوع يعلم» مناسبة للدلالة الماضية المستمرة للفعل ᾔδει. والعبارة «مَنِ الذين لا يؤمنون» سليمة ومألوفة في العربية، مع أن «مَن هم الذين لا يؤمنون» ممكنة أيضًا.
  terminology: «يؤمنون» مقابل راسخ وطبيعي لـ πιστεύουσιν في هذا السياق. و«يسلّمه» مناسب لـ παραδώσων؛ ويمكن ذكر «يخونه» في الحاشية بوصفه المقابل السياقي، لا بوصفه شرحًا يضيف تفاصيل غير واردة في الآية.
  issues:
