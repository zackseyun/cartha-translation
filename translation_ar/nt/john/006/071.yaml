  text: ἔλεγεν δὲ τὸν Ἰούδαν Σίμωνος ⸀Ἰσκαριώτου· οὗτος γὰρ ἔμελλεν ⸂παραδιδόναι αὐτόν⸃, ⸀εἷς ἐκ τῶν δώδεκα.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/071.yaml
  text: He was speaking about Judas[a], the son of Simon Iscariot, for this one was about to betray him, being one of the Twelve.
translation:
  language: ar
  text: وكان يتكلم عن يهوذا بن سمعان الإسخريوطي، فهذا كان سيُسلِّمه[a]، وهو واحد من الاثني عشر.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: سيخونه.'
    reason: بديل سياقي لفعل «يُسلِّمه»؛ إذ قد يدل الفعل في هذا السياق على الخيانة، مع إبقاء معنى التسليم المباشر في المتن.
lexical_decisions:
- source_word: ἔλεγεν δὲ τὸν Ἰούδαν
  choice: وكان يتكلم عن يهوذا
  rationale: ينقل الفعل الناقص بوصفه توضيحًا سرديًا مستمرًا، ويعبّر عن متعلَّق الكلام بصياغة عربية طبيعية. وتؤدي الواو وظيفة δὲ الانتقالية الخفيفة من غير افتعال مقابلة.
- source_word: Σίμωνος Ἰσκαριώτου
  choice: بن سمعان الإسخريوطي
  rationale: يحافظ على تتابع المضافين في اليونانية، حيث يعرّف النص يهوذا بأنه ابن سمعان الإسخريوطي.
- source_word: οὗτος γὰρ
  choice: فهذا
  rationale: تحفظ اسم الإشارة المؤكد نسبيًا، وتؤدي الفاء معنى التعليل والتفسير الذي تدخله γὰρ.
- source_word: ἔμελλεν
  choice: كان سيُـ
  rationale: تعبّر عن الفعل المستقبل من منظور السرد الماضي من غير أن تضيف معنى القَدَر المحتوم أو تنسب إلى يهوذا نيةً صريحة لا يصرح بها اللفظ.
- source_word: παραδιδόναι αὐτόν
  choice: يُسلِّمه
  rationale: يحافظ على المعنى المباشر للفعل، أي تسليم شخص إلى آخرين، مع بقاء دلالة الخيانة واضحة من السياق من غير إحلال التفسير الأخلاقي محل صورة الفعل الأصلية.
- source_word: εἷς ἐκ τῶν δώδεκα
  choice: وهو واحد من الاثني عشر
  rationale: صياغة عربية واضحة تحفظ العبارة الاعتراضية المؤكدة للمفارقة في كون من سيسلمه واحدًا من جماعة الاثني عشر.
theological_decisions:
- issue: دلالة παραδιδόναι في فعل يهوذا
  choice: يُسلِّمه
  alternative: يخونه
  rationale: اختيرت صورة «التسليم» الأقرب إلى اللفظ اليوناني، لأنها تحفظ الفعل الملموس وما يحمله السياق من معنى الخيانة دون أن تختزل أحدهما في الآخر.
- issue: قوة ἔμελλεν
  choice: كان سيُسلِّمه
  alternative: كان مقدرًا له أن يسلّمه / كان ينوي أن يسلّمه
  rationale: الصياغة المختارة تثبت الحدث المستقبلي من منظور الراوي، ولا تحسم هل المراد حتمية قدرية أم قصد شخصي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «الاثني عشر» بوصفه اسمًا معروفًا للجماعة، وحُفظ اسم الإشارة في «فهذا» لما فيه من توكيد سردي.
