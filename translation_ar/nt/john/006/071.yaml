  source_fidelity: 'المتن يطابق اليونانية بدقة جيدة: «وكان يتكلم عن» ينقل ἔλεγεν مع متعلَّقه، و«يهوذا بن سمعان الإسخريوطي» يعكس الإضافة، و«فهذا» يحفظ إبراز οὗτος، و«كان سيُسلِّمه» ينقل الاستقبال المنظور من الماضي في ἔμελλεν παραδιδόναι من غير تقرير قصد أو حتمية. و«وهو واحد من الاثني عشر» تحافظ على العبارة الختامية. لكن الحاشية الحالية تضيف «إلى أيدي خصومه»، وهي تفصيل لا يصرح به هذا العدد نفسه.'
