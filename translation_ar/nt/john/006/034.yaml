    reason: alternative_reading
lexical_decisions:
- source_word: εἶπον οὖν
  choice: فقالوا
  rationale: 'الفاء تربط الطلب بما سبقه ربطًا طبيعيًا، وصيغة الجمع في εἶπον يوضحها السياق: «قالوا».'
- source_word: πρὸς αὐτόν
  choice: له
  rationale: مع فعل القول، تؤدي اللام معنى توجيه الكلام إلى المخاطَب بعبارة عربية طبيعية.
- source_word: Κύριε
  choice: يا رب
  rationale: تحافظ «يا رب» على دلالة اللقب اليوناني واتساعه، إذ يمكن أن يكون خطاب توقير وقد يحمل دلالة أعمق.
- source_word: πάντοτε
  choice: دائمًا
  rationale: تنقل معنى الاستمرار في الطلب بوضوح وبأسلوب عربي معاصر.
- source_word: δὸς ἡμῖν
  choice: أعطِنا
  rationale: صيغة أمر تُستعمل هنا للطلب المباشر، والضمير المتصل ينقل المفعول غير المباشر بإيجاز طبيعي.
- source_word: τὸν ἄρτον τοῦτον
  choice: هذا الخبز
  rationale: تحافظ العبارة على اسم الإشارة وعلى الصلة بالخبز المذكور في الحديث السابق.
theological_decisions:
- issue: دلالة Κύριε في خطاب يسوع
  choice: يا رب
  alternative: يا سيدي
  rationale: «يا رب» تحافظ على الانفتاح الدلالي للقب، فلا تحصره في مجرد صيغة احترام، مع أن فهم المتكلمين في هذا الموضع قد لا يكون اعترافًا مسيانيًا كاملًا.
