  text: καὶ ἔλεγεν· Διὰ τοῦτο εἴρηκα ὑμῖν ὅτι οὐδεὶς δύναται ἐλθεῖν πρός με ἐὰν μὴ ᾖ δεδομένον αὐτῷ ἐκ τοῦ ⸀πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/065.yaml
  text: And he was saying[b][a], “For this reason I have told you that no one is able to come to me unless it has been given to him from the Father.”
translation:
  language: ar
  text: 'وكان يقول: «لهذا قلت لكم: لا يقدر أحد أن يأتي إليّ ما لم يكن قد أُعطي له[a] ذلك من الآب».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مُنح». جاءت العبارة اليونانية بصيغة المفرد المذكر في «له»، لكنها تُستعمل هنا بمعنى عام يشمل أي إنسان.'
    reason: «مُنح» بديل معجمي ممكن لـ δεδομένον، و«له» يقابل αὐτῷ، وهو مفرد مذكر ذو دلالة عامة في هذا السياق.
lexical_decisions:
- source_word: ἔλεγεν
  choice: وكان يقول
  rationale: يحفظ دلالة الماضي الناقص على قولٍ مستمر أو متواصل في سياق الخطاب، مع سلامة الأسلوب العربي.
- source_word: Διὰ τοῦτο
  choice: لهذا
  rationale: تعبير عربي طبيعي يحيل إلى الكلام السابق ويقدّم تعليلًا لما قاله يسوع.
- source_word: εἴρηκα
  choice: قلت لكم
  rationale: يؤدي معنى القول السابق الموجّه إلى المخاطبين؛ ولا تملك العربية صيغة مطابقة للماضي التام اليوناني، والسياق يُبقي صلة القول السابق بالحاضر واضحة.
- source_word: οὐδεὶς δύναται
  choice: لا يقدر أحد
  rationale: يعبّر بوضوح عن عدم القدرة، لا عن مجرد عدم الإذن.
- source_word: ἐλθεῖν πρός με
  choice: أن يأتي إليّ
  rationale: صياغة عربية مألوفة تحفظ التعبير اليوحناوي من غير إضافة تفسير لمعناه الإيماني أو العلاقي.
- source_word: ἐὰν μὴ ᾖ δεδομένον
  choice: ما لم يكن ذلك قد أُعطي
  rationale: يحفظ البناء الشرطي والمبني للمجهول، كما تقارب «كان قد أُعطي» دلالة الحالة الناتجة عن عطاء سابق.
- source_word: αὐτῷ
  choice: له
  rationale: يحفظ صيغة المفرد المذكر ذات الدلالة العامة في الأصل، وهي طبيعية في العربية.
- source_word: ἐκ τοῦ πατρός
  choice: من الآب
  rationale: تحفظ «من» معنى المصدر أو المنشأ في ἐκ، من غير تحويله صراحةً إلى دلالة الفاعل التي تفيدها «على يد الآب» أو نحوها.
theological_decisions:
- issue: التمكين الإلهي وقدرة الإنسان على الإتيان إلى يسوع
  choice: إبقاء عدم القدرة مشروطًا بما يُعطى للإنسان من الآب، من غير شرح مذهبي لطبيعة هذا العطاء أو مداه.
  alternative: تفسير العطاء إما بوصفه منحًا إلهيًا فعّالًا حتمي النتيجة، وإما بوصفه تمكينًا سابقًا يمكن مقاومته.
  rationale: النص اليوناني يقرر شرطًا لازمًا للإتيان إلى يسوع، لكنه لا يحسم في هذه الجملة وحدها الخلافات اللاهوتية اللاحقة بشأن علاقة العطاء الإلهي باستجابة الإنسان.
- issue: المذكر المفرد العام في αὐτῷ
  choice: ترجمته «له» مع بيان قوته العامة في الحاشية.
  alternative: ترجمته بتعبير تفسيري شامل مثل «لذلك الشخص» أو «لأي إنسان».
  rationale: «له» تطابق الصيغة النحوية للمصدر وتظل في العربية قابلة للاستعمال العام، من غير حصر المقصود في الرجال.
translation_notes:
  register: العربية فصحى حديثة واضحة وموقرة. استُخدم «الآب» بحسب الاصطلاح الكتابي المألوف، وحُفظ المبني للمجهول ومعنى المصدر في «من الآب» دون تسوية التوتر اللاهوتي الكامن في العبارة.
