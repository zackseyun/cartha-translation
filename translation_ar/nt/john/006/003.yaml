  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνῆλθεν
  choice: صعد
  rationale: فعل ماضٍ من ἀνέρχομαι يدل هنا على حركة جغرافية إلى موضع مرتفع؛ و«صعد» هو المقابل العربي الطبيعي الدقيق من غير إيحاء اصطلاحي زائد.
- source_word: δὲ
  choice: ثم
  rationale: تؤدي الأداة هنا وظيفة الانتقال السردي لا الاستدراك القوي، و«ثم» تنقل تتابع الأحداث بوضوح.
- source_word: εἰς τὸ ὄρος
  choice: إلى الجبل
  rationale: مع فعل الصعود، تفيد العبارة التوجه إلى الجبل والصعود عليه. وهذه الصياغة عربية طبيعية، وتحافظ على أداة التعريف من غير افتراض أن الجبل مسمّى.
- source_word: Ἰησοῦς
  choice: يسوع
  rationale: الصيغة العربية المعيارية للاسم في سياق العهد الجديد.
- source_word: ἐκεῖ
  choice: هناك
  rationale: مقابل مكاني مباشر وطبيعي للظرف اليوناني.
- source_word: ἐκάθητο
  choice: جلس
  rationale: يفيد الفعل الجلوس أو البقاء جالسًا. و«جلس» تلائم السرد العربي، فيما يوضح السياق المشهدي الاستمرار الذي قد يحمله الماضي الناقص.
- source_word: μετὰ τῶν μαθητῶν αὐτοῦ
  choice: مع تلاميذه
  rationale: «مع» تنقل μετά مع المضاف إليه، و«تلاميذه» تحفظ علاقة التعلّم والاتباع الملازمة لـ μαθητής في سياق الأناجيل.
