- source_word: ὁ ἀδελφὸς Σίμωνος Πέτρου
  choice: أخو سمعان بطرس
  rationale: يحفظ علاقة الأخوّة والتركيب التعريفي الإضافي بإيجاز عربي طبيعي.
- source_word: Σίμωνος Πέτρου
  choice: سمعان بطرس
  rationale: الاسمان معًا يحددان الشخص المعروف بسمعان بطرس، من غير إضافة تفسير غير موجود في النص.
