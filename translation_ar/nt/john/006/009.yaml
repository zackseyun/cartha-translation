base_translation:
  language: en
  yaml_path: translation/nt/john/006/009.yaml
  text: There is a boy here who has five barley loaves and two fish[a], but what are these for so many?
translation:
  language: ar
  text: «هنا صبيٌّ معه خمسة أرغفة شعير وسمكتان، ولكن ماذا عسى أن تكفي هذه لعدد كبير كهذا؟»[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ولكن ما الذي تُجديه هذه لعدد كبير كهذا؟»'
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδάριον
  choice: صبيّ
  rationale: يدل اللفظ على طفل أو فتى صغير، و«صبي» تعبير عربي فصيح وطبيعي من غير زيادة تفسيرية.
- source_word: ὧδε
  choice: هنا
  rationale: ظرف مكان مباشر، و«هنا» أقرب مقابله الطبيعي.
- source_word: ὃς ἔχει
  choice: معه
  rationale: تؤدي «معه» معنى امتلاك الصبي للطعام في هذا السياق بصورة عربية طبيعية وموجزة.
- source_word: ἄρτους κριθίνους
  choice: أرغفة من شعير
  rationale: ينقل «أرغفة» معنى ἄρτους، وتبيّن عبارة «من شعير» نوع الخبز بوضوح.
- source_word: ὀψάρια
  choice: سمكتان
  rationale: يشير اللفظ هنا إلى السمك المأكول مع الخبز؛ والتثنية العربية تنقل العدد المذكور بوضوح من غير افتراض أنهما صغيرتان.
- source_word: ἀλλὰ
  choice: ولكن
  rationale: تفيد أداة الاستدراك التباين بين الطعام الموجود وكثرة الناس.
- source_word: ταῦτα τί ἐστιν
  choice: ما هذه
  rationale: يحافظ هذا التركيب على الصياغة الاستفهامية المقتضبة وعلى الإشارة إلى الأشياء المذكورة، مع بقاء الدلالة التقويمية مفهومة من السياق.
- source_word: εἰς τοσούτους
  choice: لعدد كبير كهذا
  rationale: تعبّر العبارة عن عدم كفاية الطعام بالنسبة إلى كثرة الحاضرين، بصياغة عربية واضحة لا تفترض لفظ «الجمع» صراحة.
