    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς
  choice: نحن
  rationale: ورود الضمير صراحةً في اليونانية يفيد التوكيد، وتحافظ عليه العربية بذكر «نحن» مع واو العطف.
- source_word: πεπιστεύκαμεν
  choice: قد آمنا
  rationale: صيغة التام تدل على إيمان تحقق وبقي أثره قائمًا؛ و«قد آمنا» تحافظ على الفعل السابق من غير أن تحوله إلى مجرد حالة حاضرة.
- source_word: ἐγνώκαμεν
  choice: عرفنا
  rationale: صيغة التام تجمع بين بلوغ المعرفة وثبوتها. و«عرفنا» طبيعية في العربية، ويُفهم استمرار نتيجتها من اقترانها بـ«قد آمنا» ومن السياق.
- source_word: ὅτι
  choice: أنك
  rationale: تُدخل مضمون الإيمان والمعرفة، لا سببهما.
- source_word: ὁ ἅγιος
  choice: قدوس
  rationale: التركيب اليوناني لقب معرف يدل على الشخص المكرس لله والمتميز بالقداسة. و«قدوس» يصوغه في العربية لقبًا مسيانيًا موجزًا ومهيبًا، لا مجرد وصف أخلاقي.
- source_word: τοῦ θεοῦ
  choice: الله
  rationale: الإضافة في «قدوس الله» تحافظ على سعة دلالة المضاف إليه اليوناني، التي قد تفيد العلاقة أو الانتماء أو المصدر، من غير حصرها في معنى واحد.
theological_decisions:
- issue: اللقب المسيحاني في يوحنا 6:69
  choice: قدوس الله
  alternative: القدوس الآتي من الله؛ المسيح ابن الله الحي
  rationale: نص SBLGNT هو ὁ ἅγιος τοῦ θεοῦ، فينبغي نقله مباشرةً دون مواءمته مع متى 16:16 أو مع القراءات الموسعة في بعض المخطوطات. وتحافظ الإضافة العربية على العلاقة الواسعة التي تفيدها صيغة المضاف إليه.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. حُفظ توكيد الضمير، واقتران الإيمان بالمعرفة، وغموض الإضافة اللاهوتي المشروع دون إدخال قراءة طائفية أو مواءمة نصية.
