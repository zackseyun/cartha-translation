  text: So when the crowd saw that Jesus was not there[a], nor his disciples, they themselves got into the boats and came to Capernaum, looking for Jesus.
translation:
  language: ar
  text: فَلَمَّا رَأَى الْجَمْعُ أَنَّ يَسُوعَ لَيْسَ هُنَاكَ، وَلَا تَلَامِيذُهُ، رَكِبُوا هُمْ أَنْفُسُهُمُ الْقَوَارِبَ[a] وَجَاءُوا إِلَى كَفْرَنَاحُومَ يَبْحَثُونَ عَنْ يَسُوعَ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الْقَوَارِبَ الصَّغِيرَةَ»؛ فَالْكَلِمَةُ الْيُونَانِيَّةُ صِيغَةُ تَصْغِيرٍ لِكَلِمَةِ «قَارِب».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε οὖν
  choice: فَلَمَّا
  rationale: تنقل العلاقة الزمنية مع استمرارية السياق والاستنتاج السردي بصياغة عربية طبيعية موجزة.
- source_word: ὁ ὄχλος
  choice: الْجَمْعُ
  rationale: تدل على جماعة الناس المحتشدة، وهي لفظة عربية واضحة ولائقة بالسياق السردي.
- source_word: εἶδεν
  choice: رَأَى
  rationale: تحافظ على الدلالة المباشرة للفعل من غير تحويلها تفسيريًا إلى «أدرك» أو «لاحظ».
- source_word: οὐκ ἔστιν ἐκεῖ
  choice: لَيْسَ هُنَاكَ
  rationale: تحافظ على زمن الفعل اليوناني الحاضر داخل السرد، وهي طبيعية في العربية بعد فعل الرؤية الماضي.
- source_word: οὐδὲ οἱ μαθηταὶ αὐτοῦ
  choice: وَلَا تَلَامِيذُهُ
  rationale: تنقل العطف المنفي بإيجاز، من غير إضافة فعل غير مصرح به في النص.
- source_word: ἐνέβησαν
  choice: رَكِبُوا
  rationale: الفعل العربي المألوف للصعود إلى وسيلة نقل أو الإبحار فيها، ويلائم القوارب هنا.
- source_word: αὐτοὶ
  choice: هُمْ أَنْفُسُهُمْ
  rationale: تحفظ توكيد الضمير اليوناني على أن أفراد الجمع أنفسهم ركبوا القوارب.
- source_word: τὰ πλοιάρια
  choice: الْقَوَارِبَ
  rationale: صياغة عربية سلسة؛ أما صيغة التصغير أو الإشارة إلى صغر القوارب فمحفوظة في الحاشية.
- source_word: ἦλθον εἰς Καφαρναοὺμ
  choice: وَجَاءُوا إِلَى كَفْرَنَاحُومَ
  rationale: تتبع القيمة الأساسية لفعل المجيء وتحافظ على منظور السرد اليوناني.
- source_word: ζητοῦντες τὸν Ἰησοῦν
  choice: يَبْحَثُونَ عَنْ يَسُوعَ
  rationale: تعبر بوضوح عن محاولة العثور عليه، وتتجنب إيحاءً روحيًا زائدًا قد تحمله ألفاظ مثل «يطلبون» خارج السياق.
