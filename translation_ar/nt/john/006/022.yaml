  text: Τῇ ἐπαύριον ὁ ὄχλος ὁ ἑστηκὼς πέραν τῆς θαλάσσης ⸀εἶδον ὅτι πλοιάριον ἄλλο οὐκ ἦν ἐκεῖ εἰ μὴ ⸀ἕν, καὶ ὅτι οὐ συνεισῆλθεν τοῖς μαθηταῖς αὐτοῦ ὁ Ἰησοῦς εἰς τὸ ⸀πλοῖον ἀλλὰ μόνοι οἱ μαθηταὶ αὐτοῦ ἀπῆλθον·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/022.yaml
  text: On the next day[a], the crowd that had been standing on the other side of the sea saw that no other small boat had been there except one, and that Jesus had not gone with his disciples into the boat[b], but that his disciples had gone away alone.
translation:
  language: ar
  text: وفي اليوم التالي، رأى الجمع الذي كان واقفًا في الجانب الآخر من البحر أنه لم يكن هناك قارب صغير آخر إلا واحد[a]، وأن يسوع لم يدخل القارب[b] مع تلاميذه، بل مضى تلاميذه وحدهم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن ترجمة «قارب صغير» هنا بـ«قارب»؛ فاللفظة اليونانية πλοιάριον صيغة تصغير.
    reason: lexical_alternative
  - marker: b
    text: تختلف بعض المخطوطات والطبعات في هذا العدد بين «قارب صغير» (πλοιάριον) و«قارب» (πλοῖον)؛ وتتبع الترجمة لفظ النص اليوناني المطبوع في كل موضع.
    reason: textual_variant
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: وفي اليوم التالي
  rationale: تعبير زمني اصطلاحي ينقل السرد إلى أحداث اليوم التالي، والواو تلائم استمرارية السياق.
- source_word: ὁ ὄχλος ὁ ἑστηκὼς
  choice: الجمع الذي كان واقفًا
  rationale: يحافظ على دلالة اسم الفاعل التام بوصفه حالة قائمة أو مستمرة، بصياغة عربية واضحة.
- source_word: πέραν τῆς θαλάσσης
  choice: في الجانب الآخر من البحر
  rationale: يفيد الموقع على الضفة المقابلة، وهي عبارة عربية طبيعية وواضحة جغرافيًا.
- source_word: εἶδον
  choice: رأى
  rationale: يحافظ على المعنى الأساسي للإدراك البصري؛ وجاء الفعل مفردًا في العربية لمطابقة اسم الجمع «الجمع».
- source_word: πλοιάριον
  choice: قارب صغير
  rationale: يعكس صيغة التصغير اليونانية من غير تكلف.
- source_word: ἄλλο οὐκ ἦν ἐκεῖ εἰ μὴ ἕν
  choice: لم يكن هناك سوى قارب صغير واحد
  rationale: تنقل العبارة معنى الحصر بوضوح وطبيعية.
- source_word: συνεισῆλθεν
  choice: لم يركب ... مع
  rationale: الفعل يعني الدخول مع شخص آخر، وفي سياق القارب تكون «يركب ... مع» عربية طبيعية وتحفظ معنى المصاحبة.
- source_word: εἰς τὸ πλοῖον
  choice: القارب
  rationale: تعكس اللفظة العامة πλοῖον هنا، بخلاف صيغة التصغير في العبارة السابقة.
- source_word: μόνοι
  choice: وحدهم
  rationale: تبرز أن التلاميذ غادروا من دون يسوع.
- source_word: ἀπῆλθον
  choice: مضى
  rationale: ينقل معنى الذهاب أو الانصراف بصياغة سردية عربية موجزة ودقيقة.
