source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Οὐκ ἐγὼ ὑμᾶς τοὺς δώδεκα ἐξελεξάμην; καὶ ἐξ ὑμῶν εἷς διάβολός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/070.yaml
  text: Jesus answered them[a], “Did I not choose you, the Twelve? Yet one of you is a devil.”
translation:
  language: ar
  text: 'فأجابهم يسوع: «ألم أختركم أنتم الاثني عشر؟ ومع ذلك، واحد منكم شيطان[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «مُفترٍ». قد تدل الكلمة اليونانية على من يوجّه اتهامًا كاذبًا، كما تُطلق في سياقات كثيرة على إبليس. أما هنا فصياغتها وصفية، وليست تعريفًا مباشرًا للواحد منهم بأنه إبليس نفسه.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: فأجابهم
  rationale: صيغة سردية عربية طبيعية تنقل فعل الإجابة في سياق الحوار، مع إبقاء ضمير الجمع مفعولًا به.
- source_word: Οὐκ ἐγὼ ὑμᾶς τοὺς δώδεκα ἐξελεξάμην;
  choice: ألم أختركم أنتم الاثني عشر؟
  rationale: 'يحفظ السؤال الإنكاري الذي ينتظر جوابًا بالإيجاب، ويُبرز المخاطَبين بوصفهم الجماعة المعروفة: الاثني عشر. ودلالة المتكلم ظاهرة في الفعل «أختر».'
- source_word: καὶ
  choice: ومع ذلك
  rationale: الواو هنا تصل الجملتين مع إفادة مفارقة واضحة بين اختيار الاثني عشر وكون واحد منهم شيطانًا؛ فعبارة «ومع ذلك» تنقل هذا التباين طبيعيًا.
- source_word: ἐξ ὑμῶν εἷς
  choice: واحد منكم
  rationale: ترجمة عربية مألوفة ودقيقة للتركيب التبعي الدال على واحد من بين الجماعة.
- source_word: διάβολός
  choice: شيطان
  rationale: الاسم هنا بلا أداة تعريف وفي موقع الخبر، فيصف الواحد منهم وصفًا شديدًا ولا يصرّح بأنه «إبليس» نفسه. وتحفظ «شيطان» قوة العبارة مع بيان البديل المعجمي في الحاشية.
theological_decisions:
- issue: هل διάβολός تعريف للشخص بأنه إبليس أم وصف نوعي له؟
  choice: شيطان
  alternative: إبليس؛ أو مُفترٍ
  rationale: غياب أداة التعريف ووقوع الاسم خبرًا يرجحان الوصف النوعي بدل المطابقة المباشرة مع إبليس. وتحفظ «شيطان» حدة العبارة ولا تختزلها في معنى الافتراء وحده، من غير أن تحسم طبيعة الصلة بإبليس.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُعمل السؤال الإنكاري الطبيعي «ألم أختركم» وحُفظ لقب الجماعة «الاثني عشر». وُضعت علامة الحاشية مباشرة بعد اللفظة التي تشرحها.
