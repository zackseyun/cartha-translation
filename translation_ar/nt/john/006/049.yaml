base_translation:
  language: en
  yaml_path: translation/nt/john/006/049.yaml
  text: Your fathers ate the manna in the wilderness[a], and they died.
translation:
  language: ar
  text: آباؤكم أكلوا المنّ في البرية، وماتوا.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ πατέρες ὑμῶν
  choice: آباؤكم
  rationale: يحافظ على المعنى الحرفي لـπατέρες وعلى الإشارة التمثيلية إلى أسلاف المخاطَبين من جيل البرية، وهو تعبير عربي كتابي واضح وطبيعي.
- source_word: ἔφαγον
  choice: أكلوا
  rationale: ترجمة مباشرة لصيغة الماضي الدالة على وقوع الفعل، من غير حاجة إلى إضافة دلالة تفسيرية.
- source_word: ἐν τῇ ἐρήμῳ
  choice: في البرية
  rationale: «البرية» هي الصياغة العربية الكتابية المألوفة لسياق خروج إسرائيل، وتحفظ الصدى النصي أكثر من «الصحراء».
- source_word: τὸ μάννα
  choice: المنّ
  rationale: يحفظ أداة التعريف اليونانية ويشير بوضوح إلى الطعام المعروف في رواية البرية.
- source_word: ἀπέθανον
  choice: وماتوا
  rationale: ينقل وقوع الموت فعليًا ويحافظ على المقابلة السياقية مع الخبز الذي يمنح الحياة.
theological_decisions:
- issue: الإشارة إلى جيل إسرائيل في البرية
  choice: آباؤكم
  alternative: أسلافكم
  rationale: «آباؤكم» يحفظ الصيغة اليونانية والقوة الخطابية المباشرة، من غير إضافة تفسير طائفي أو طمس للإشارة التاريخية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة ذات نبرة كتابية كريمة. لم تُضف حاشية لأن «آباؤكم» طبيعي ودقيق في العربية، والبديل «أسلافكم» لا يحتاج إلى تنبيه نصي في هذا الموضع.
