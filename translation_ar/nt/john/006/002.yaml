  yaml_path: translation/nt/john/006/002.yaml
  text: And a large crowd was following him[a], because they were seeing the signs that he was doing on those who were sick.
translation:
  language: ar
  text: وكان يتبعه جمعٌ كبيرٌ، لأنهم كانوا يرون الآيات[a] التي كان يصنعها للمرضى.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «المعجزات» أو «الآيات المعجزية»؛ فاللفظ الذي يستعمله يوحنا، «الآيات»، يُبرز ما تكشفه هذه الأعمال عن يسوع.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκολούθει
  choice: كان يتبعه
  rationale: الماضي الناقص يدل على فعل مستمر في الماضي، وصيغة «كان يتبعه» تنقل هذا الجانب بوضوح وطبيعية.
- source_word: δὲ
  choice: الواو في «وكان»
  rationale: أداة ربط خفيفة تواصل السرد، ولا تقتضي هنا معنى الاستدراك القوي.
- source_word: ὄχλος πολύς
  choice: جمعٌ كبير
  rationale: ينقل معنى كثرة الناس بلغة عربية واضحة وموجزة.
- source_word: ἐθεώρουν
  choice: كانوا يرون
  rationale: يحفظ دلالة الماضي الناقص على الرؤية المتكررة أو المستمرة، من غير تحميل الفعل معنى زائدًا.
- source_word: σημεῖα
  choice: الآيات
  rationale: «الآيات» تحافظ على دلالة الأعمال بوصفها علامات تكشف عن هوية يسوع، لا مجرد عجائب خارقة.
- source_word: ἐποίει
  choice: كان يصنعها
  rationale: ينقل الاستمرار في الماضي، و«يصنع» تعبير عربي كتابي مفهوم يلائم الأعمال الخارقة دون إضافة تفسير.
- source_word: ἐπὶ τῶν ἀσθενούντων
  choice: للمرضى
  rationale: يعبر طبيعيًا عن تعلق هذه الآيات بالمرضى بوصفهم من أُجريت لأجلهم، بدل ترجمة حرفية ثقيلة مثل «على المرضى».
- source_word: ἀσθενούντων
  choice: المرضى
  rationale: السياق يشير إلى المصابين بمرض جسدي، و«المرضى» واضحة ومباشرة.
theological_decisions:
- issue: مصطلح σημεῖα في إنجيل يوحنا
  choice: الآيات
  alternative: المعجزات أو الآيات المعجزية
  rationale: يستعمل يوحنا اللفظ لإبراز ما تكشفه أعمال يسوع، لا لمجرد وصف طابعها الخارق؛ لذلك تُحفظ الدلالة الإشارية في المتن وتُذكر البدائل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت صيغ «كان + مضارع» للمحافظة على الجانب الاستمراري للأفعال اليونانية الناقصة، مع تجنب الحرفية الثقيلة.
