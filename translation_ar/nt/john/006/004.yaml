- source_word: ἑορτὴ
  choice: عيد
  rationale: تنقل معنى الاحتفال الديني المعيّن، وتلائم هنا البدل التوضيحي من «الفصح».
- source_word: τῶν Ἰουδαίων
  choice: اليهود
  rationale: السياق يتحدث عن الفصح بوصفه عيدًا دينيًا للشعب اليهودي عمومًا، لا مناسبة إقليمية مقصورة على سكان اليهودية، مع إبقاء البديل المعجمي في الحاشية.
theological_decisions:
- issue: دلالة Ἰουδαίων في السرد اليوحناوي
  choice: اليهود
  alternative: أهل اليهودية
  rationale: اللفظ اليوناني يتسع بحسب السياق لليهود عمومًا أو لأهل اليهودية. وبما أن الفصح عيد للشعب اليهودي كله، فـ«اليهود» أرجح هنا، مع توثيق الاحتمال الآخر دون تحميل العبارة إيحاءات معادية لليهود.
