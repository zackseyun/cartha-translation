source:
  edition: SBLGNT
  text: ἐγώ εἰμι ὁ ἄρτος ὁ ζῶν ὁ ἐκ τοῦ οὐρανοῦ καταβάς· ἐάν τις φάγῃ ἐκ τούτου τοῦ ἄρτου ⸀ζήσει εἰς τὸν αἰῶνα, καὶ ὁ ἄρτος δὲ ὃν ἐγὼ δώσω ἡ σάρξ μού ⸀ἐστιν ὑπὲρ τῆς τοῦ κόσμου ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/051.yaml
  text: I am the living bread that came down from heaven[a]. If anyone eats of this bread, he will live forever[c][b]. And the bread that I will give for the life of the world is my flesh.
translation:
  language: ar
  text: أنا هو الخبز الحي الذي نزل من السماء. إن أكل أحد من هذا الخبز، فسيحيا إلى الأبد[a]. والخبز الذي سأعطيه من أجل حياة العالم هو لحمي[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'وحرفيًا: «سيحيا إلى الدهر»؛ والتعبير يعني حياة دائمة، أي إلى الأبد.'
    reason: lexical_alternative
  - marker: b
    text: 'اليونانية: «لحمي»، لا «جسدي»؛ فاللفظ هنا ملموس ومقصود.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγώ εἰμι ὁ ἄρτος ὁ ζῶν
  choice: أنا هو الخبز الحي
  rationale: تحافظ العبارة على صيغة التعريف والتوكيد في «ἐγώ εἰμι»، وتنقل اسم الفاعل «ζῶν» بصفة «الحي» دون استبداله بعبارة «خبز الحياة» الواردة في سياق قريب.
- source_word: ὁ ἐκ τοῦ οὐρανοῦ καταβάς
  choice: الذي نزل من السماء
  rationale: صياغة عربية طبيعية تنقل اسم الفاعل اليوناني الدال على نزول تمّ، من غير تخفيف للدلالة المسيحانية في القول.
- source_word: ἐάν τις φάγῃ ἐκ τούτου τοῦ ἄρτου
  choice: إن أكل أحد من هذا الخبز
  rationale: «إن» مع الفعل تنقل الشرط العام، و«أحد» تحفظ عموم «τις»، أما «من هذا الخبز» فتنقل «ἐκ» بعبارة عربية سليمة.
- source_word: ζήσει εἰς τὸν αἰῶνα
  choice: فسيحيا إلى الأبد
  rationale: «إلى الأبد» هي المقابل العربي الواضح للتعبير الاصطلاحي اليوحناوي، مع إثبات البديل الحرفي في الحاشية.
- source_word: ὁ ἄρτος δὲ ὃν ἐγὼ δώσω
  choice: والخبز الذي سأعطيه
  rationale: الواو تلائم انتقال «δέ» الهادئ، والمستقبل «سأعطيه» يحفظ الإشارة إلى عطاء آتٍ.
- source_word: ἡ σάρξ μού ἐστιν
  choice: هو لحمي
  rationale: «لحم» هو المقابل المباشر الملموس لـ«σάρξ»، بخلاف «جسد» الذي قد يلطّف اللفظ أو يفسره.
- source_word: ὑπὲρ τῆς τοῦ κόσμου ζωῆς
  choice: من أجل حياة العالم
  rationale: تنقل العبارة معنى الغاية أو المنفعة في «ὑπέρ»، وتحفظ «العالم» بمداه اليوحناوي دون تضييقه إلى فئة بعينها.
theological_decisions:
- issue: دلالة σάρξ في وصف يسوع لعطائه
  choice: «لحمي» في المتن
  alternative: «جسدي»
  rationale: اللفظ اليوناني ملموس ومقصود في هذا السياق، وترجمته «جسدي» قد تحسم جانبًا من التفسير أو تخفف حدة التعبير.
- issue: مدى «العالم»
  choice: إبقاء «العالم» من غير تقييد
  alternative: «البشرية» أو جماعة مخصوصة
  rationale: يحفظ النص اتساع «κόσμος» والتوتر اللاهوتي في العبارة، ولا يفرض تحديدًا مذهبيًا لا يصرح به الأصل.
- issue: قوة عبارة النزول من السماء
  choice: «الذي نزل من السماء» بصياغة مباشرة
  alternative: تفسيرها على أنها مجرد إرسال أو تكليف إلهي
  rationale: الترجمة المباشرة تحفظ الدعوى التي يقررها النص من غير اختزالها أو إضافة شرح عقائدي إليها.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدمت «أنا هو» للمحافظة على التوكيد وصدى صيغة التعريف اليوحناوية، و«إن أكل أحد» لتجنب التذكير غير الضروري مع إبقاء المفرد العام. رُتبت العبارة الأخيرة ترتيبًا عربيًا طبيعيًا مع إبقاء «من أجل حياة العالم» متصلة بالعطاء.
