  text: καὶ ἔλεγον· ⸀Οὐχ οὗτός ἐστιν Ἰησοῦς ὁ υἱὸς Ἰωσήφ, οὗ ἡμεῖς οἴδαμεν τὸν πατέρα καὶ τὴν μητέρα; πῶς ⸀νῦν ⸀λέγει ὅτι Ἐκ τοῦ οὐρανοῦ καταβέβηκα;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/042.yaml
  text: And they were saying, “Is this not Jesus, the son of Joseph, whose father and mother we know? How does he now say, ‘I have come down from heaven’?”
translation:
  language: ar
  text: 'وكانوا يقولون: «أليس هذا هو يسوع ابن يوسف، الذي نعرف أباه وأمَّه؟ فكيف يقول الآن: إني نزلتُ من السماء؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: كانوا يقولون
  rationale: ينقل صيغة الماضي الناقص اليونانية بما تدل عليه من قول مستمر أو متكرر، وهو تعبير عربي طبيعي.
- source_word: Οὐχ οὗτός ἐστιν
  choice: أليس هذا هو
  rationale: يحفظ الاستفهام المنفي الذي يتوقع موافقة السامعين، مع صياغة عربية واضحة.
- source_word: ὁ υἱὸς Ἰωσήφ
  choice: يسوع ابن يوسف
  rationale: ترجمة مباشرة تحفظ تشديد المتكلمين على النسب البشري المعروف ليسوع.
- source_word: οὗ ἡμεῖς οἴδαμεν τὸν πατέρα καὶ τὴν μητέρα
  choice: الذي نعرف أباه وأمَّه
  rationale: صياغة عربية فصيحة وطبيعية تحفظ جملة الصلة وادعاءهم معرفة والدي يسوع.
- source_word: πῶς νῦν λέγει
  choice: فكيف يقول الآن
  rationale: يحفظ المعنى الأساسي لـ πῶς، وزمن المضارع في λέγει، ودلالة νῦν، من غير إضافة معنى الإمكان أو التعليل.
- source_word: Ἐκ τοῦ οὐρανοῦ
  choice: من السماء
  rationale: ينقل دلالة المصدر أو المنشأ في ἐκ مع المضاف إليه بتعبير عربي مألوف.
- source_word: καταβέβηκα
  choice: نزلتُ
  rationale: الفعل العربي الطبيعي في هذا السياق؛ ويفيد السياق أن النزول قد تم مع بقاء صلته بالحاضر، وإن لم يكن في العربية مقابل صرفي مطابق للتام اليوناني.
theological_decisions:
- issue: اعتراض الجمع على قول يسوع إنه ذو منشأ سماوي
  choice: إني نزلتُ من السماء
  alternative: إني جئتُ من السماء
  rationale: يحفظ فعل النزول وصراحة الادعاء كما يورده النص، من غير تحويله إلى مجاز أو تفسيره عقائديًا بما يتجاوز العبارة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «كانوا يقولون» لحفظ استمرارية الماضي الناقص، و«فكيف يقول الآن» لصون حدة الاعتراض من غير إدخال معنى «كيف يستطيع». لا توجد حاجة إلى حاشية في هذه الآية.
