  text: ὁ τρώγων μου τὴν σάρκα καὶ πίνων μου τὸ αἷμα ἐν ἐμοὶ μένει κἀγὼ ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/056.yaml
  text: The one who eats my flesh and drinks my blood remains in me[b][a], and I in him.
translation:
  language: ar
  text: مَن يأكل[a] لحمي ويشرب دمي يبقى فيَّ[b]، وأنا فيه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يتغذّى على» أو «يمضغ»؛ فالفعل اليوناني هنا أكثر حيوية من اللفظ العام للأكل.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «يثبت فيَّ»؛ وهو تعبير تقليدي شائع لترجمة هذا الفعل اليوحناوي.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ τρώγων
  choice: مَن يأكل
  rationale: اسم الفاعل المسبوق بأداة التعريف يدل على شخص يتصف بهذا الفعل. وصيغة «مَن يأكل» عربية طبيعية، وتحافظ على الدلالة العامة وعلى استمرار الفعل الذي تفيده صيغة المضارع.
- source_word: τρώγων
  choice: يأكل
  rationale: الفعل τρώγω أشد تصويرًا من اللفظ اليوناني العام للأكل، وقد يفيد الأكل أو المضغ. اختير «يأكل» لوضوحه وطبيعته، مع إثبات حيوية اللفظ في الحاشية.
- source_word: μου τὴν σάρκα
  choice: لحمي
  rationale: تحافظ كلمة «لحمي» على المعنى الحسي المباشر لـσάρξ، وعلى التمييز الممكن بينها وبين «الجسد» بوصفه مقابلًا شائعًا لـσῶμα، من غير تفسير الصورة تفسيرًا مذهبيًا.
- source_word: καὶ πίνων μου τὸ αἷμα
  choice: ويشرب دمي
  rationale: ترجمة مباشرة للمشاركة المنسقة مع الفعل السابق، وتحفظ صورة الدم الصريحة والصادمة في النص.
- source_word: ἐν ἐμοὶ μένει
  choice: يبقى فيَّ
  rationale: الفعل μένω من الألفاظ المحورية في يوحنا، و«يبقى» تعبير عربي واضح ومعاصر يحفظ معنى الاستمرار والثبات العلاقي من غير تحويله إلى صيغة عقائدية تفسيرية.
- source_word: κἀγὼ ἐν αὐτῷ
  choice: وأنا فيه
  rationale: يحذف اليوناني الفعل في الشطر الثاني اعتمادًا على ما سبق؛ لذلك حُفظ الإيجاز نفسه في العربية بدل تكرار «أبقى».
- source_word: αὐτῷ
  choice: فيه
  rationale: الضمير اليوناني مفرد مذكر يعود إلى الشخص الذي يأكل ويشرب، ويقابله طبيعيًا ضمير المفرد المذكر في العربية.
theological_decisions:
- issue: هل الأكل من اللحم والشرب من الدم تعبيران أسراريان أم مجاز عن الإيمان؟
  choice: 'الإبقاء على الصورة الحسية الصريحة: «يأكل لحمي ويشرب دمي».'
  alternative: إضافة ألفاظ تفسرها صراحةً بالمشاركة في الإفخارستيا أو بالإيمان.
  rationale: النص اليوناني يورد الصورة من غير أن يحسم داخل هذه الآية وحدها الخلاف بين القراءات المسيحية؛ فالترجمة لا تضيف تفسيرًا مذهبيًا.
- issue: لغة السكنى المتبادلة في يوحنا
  choice: «يبقى فيَّ، وأنا فيه».
  alternative: «يثبت فيَّ» أو «يتحد بي».
  rationale: «يبقى» يحفظ دلالة الاستمرار في μένω، أما «يتحد بي» فيحوّل العبارة إلى تفسير لاهوتي أضيق. وحُفظ حذف الفعل في الشطر الثاني كما في اليونانية.
translation_notes:
  register: لغة عربية فصحى واضحة وموقرة. استُعملت «مَن» لصياغة العبارة الاسمية اليونانية صياغة طبيعية عامة، و«لحمي» للمحافظة على حسية σάρξ، و«يبقى» لوضوحها المعاصر مع ذكر «يثبت» في الحاشية.
