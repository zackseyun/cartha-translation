base_translation:
  language: en
  yaml_path: translation/nt/john/006/023.yaml
  text: But boats came from Tiberias near the place where they ate the bread after the Lord had given thanks[a].
translation:
  language: ar
  text: لكن جاءت قوارب من طبرية قرب المكان الذي أكلوا فيه الخبز بعدما شكر الرب[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بصورة أكثر حرفية: «لكن جاءت قوارب صغيرة من طبرية». فاللفظة اليونانية πλοιάρια صيغة تصغير.'
    reason: بديل معجمي يحفظ دلالة التصغير في اللفظة اليونانية.
lexical_decisions:
- source_word: ἀλλὰ
  choice: لكن
  rationale: أداة استدراك تقابل ما سبق، و«لكن» واضحة وطبيعية في السياق السردي.
- source_word: ἦλθεν
  choice: جاءت
  rationale: فعل ماضٍ يصف وصول القوارب، و«جاءت» يؤدي المعنى مباشرة.
- source_word: πλοιάρια
  choice: قوارب
  rationale: اللفظة اليونانية صيغة تصغير، لكن «قوارب» هي الصياغة العربية الطبيعية، مع بيان دلالة التصغير في الحاشية.
- source_word: ἐκ Τιβεριάδος
  choice: من طبرية
  rationale: تعبير مكاني يدل على منشأ القوارب.
- source_word: ἐγγὺς τοῦ τόπου
  choice: إلى قرب المكان
  rationale: يحفظ معنى الاقتراب والوصول إلى ناحية قريبة من المكان، مع انسجامه مع فعل المجيء.
- source_word: ὅπου
  choice: الذي ... فيه
  rationale: تركيب موصول عربي طبيعي يؤدي معنى ظرف المكان اليوناني.
- source_word: ἔφαγον τὸν ἄρτον
  choice: أكلوا فيه الخبز
  rationale: الماضي البسيط يطابق صيغة الفعل اليوناني، والتعريف يشير إلى الخبز المذكور سابقًا.
- source_word: εὐχαριστήσαντος
  choice: بعدما شكر
  rationale: اسم الفاعل الماضي في تركيب الإضافة المطلقة يدل هنا طبيعيًا على فعل سابق للأكل.
- source_word: τοῦ κυρίου
  choice: الرب
  rationale: يحفظ اللقب التكريمي والمغزى المسيحاني المحتمل في سياق يوحنا دون تفسير زائد.
theological_decisions:
- issue: ترجمة κύριος
  choice: الرب
  alternative: السيد
  rationale: «الرب» يحفظ اللقب الذي يطلقه النص على يسوع وما يحمله من رنين لاهوتي، بينما قد تحصر «السيد» الدلالة في معنى اجتماعي أو تكريمي فحسب.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. حوفظ على ترتيب الحدث وعلى تعلق عبارة «بعدما شكر الرب» بأكل الخبز، دون إضافة فاعل للشكر غير المذكور صراحة بالاسم.
