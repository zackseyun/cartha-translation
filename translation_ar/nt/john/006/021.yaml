  to: فكانوا مستعدين لأن يأخذوه إلى القارب، وفي الحال صار القارب عند البرّ الذي كانوا متجهين إليه.[a]
  rationale: يحفظ النص المنقح اتصال οὖν بسياق الجملة السابقة، ودلالة ἤθελον المستمرة بوصفها استعدادًا لقبول يسوع في القارب، وفورية εὐθέως. كما يترجم ἐγένετο τὸ πλοῖον ἐπὶ τῆς γῆς بعبارة عربية مفهومة لا تشرح الحدث أو تخفف فجائيته، ويترك «وصل إلى الشاطئ» بديلًا في الحاشية.
