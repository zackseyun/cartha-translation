  yaml_path: translation/nt/john/006/021.yaml
  text: So they were willing to take him into the boat[a], and immediately the boat was at the land to which they were going.
translation:
  language: ar
  text: فكانوا مستعدين لأن يأخذوه إلى القارب، وفي الحال صار القارب عند البرّ الذي كانوا متجهين إليه.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وفي الحال وصل القارب إلى الشاطئ الذي كانوا متجهين إليه».'
    reason: بديل معجمي وسياقي لعبارة ἐγένετο ... ἐπὶ τῆς γῆς، يصرّح بمعنى الوصول إلى الشاطئ مع أن المتن يحافظ على التعبير المكاني المباشر.
lexical_decisions:
- source_word: ἤθελον
  choice: أرادوا
  rationale: ينقل معنى θέλω في صيغة الماضي الناقص، ويمكن في السياق أن يدل على الإرادة والاستعداد من غير إضافة تفسيرية زائدة.
- source_word: οὖν
  choice: فـ
  rationale: تربط النتيجة بالسياق السابق ربطًا طبيعيًا موجزًا في العربية.
- source_word: λαβεῖν αὐτὸν εἰς τὸ πλοῖον
  choice: أن يأخذوه إلى القارب
  rationale: تعبير عربي واضح قريب من الصورة اليونانية، ويفيد إدخاله إلى القارب في هذا السياق.
- source_word: πλοῖον
  choice: القارب
  rationale: أنسب لحجم المركب في سياق بحيرة الجليل من «السفينة».
- source_word: εὐθέως
  choice: للحال
  rationale: يحفظ دلالة الفورية وحدّة الانتقال السردي بصياغة عربية فصيحة مفهومة.
- source_word: ἐγένετο τὸ πλοῖον ἐπὶ τῆς γῆς
  choice: صار القارب عند الأرض
  rationale: يحافظ على تركيب γίνομαι المكاني وعلى غرابة الفورية، من غير أن يوهم بأن القارب صار فوق اليابسة فعليًا.
- source_word: γῆς
  choice: الأرض
  rationale: يقابل اللفظ اليوناني مباشرة، مع إمكان فهمه هنا على أنه البر أو الشاطئ.
- source_word: εἰς ἣν ὑπῆγον
  choice: التي كانوا متجهين إليها
  rationale: صياغة عربية طبيعية تحفظ الوجهة واستمرار الرحلة الذي تفيده صيغة الماضي الناقص.
theological_decisions:
- issue: هل تُصاغ الجملة الثانية بما يفسر أو يخفف الفورية التي قد تحمل دلالة معجزية؟
  choice: 'الإبقاء على العبارة المباشرة: «وللحال صار القارب عند الأرض»'
  alternative: «وللحال وصل القارب إلى الشاطئ»
  rationale: النص اليوناني يعرض الحدث بإيجاز وفورية بارزة؛ لذا تُحفظ هذه الحدة والغموض السردي من غير تفسير المعجزة أو التخفيف منها.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختير «القارب» بدل «السفينة»، وحُفظت الفورية والعبارة المكانية غير المعتادة في المتن، مع تقديم الصياغة التفسيرية الطبيعية في الحاشية.
