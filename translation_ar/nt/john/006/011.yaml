  text: So Jesus took the loaves[a], and after giving thanks he distributed them to those who were reclining; likewise also from the fish[b], as much as they wanted.
translation:
  language: ar
  text: فأخذ يسوع الأرغفة، وشكر، ثم وزّعها على المتكئين[a]، ووزّع عليهم كذلك من السمك[b] بقدر ما أرادوا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الجالسين إلى الطعام». تقول اليونانية حرفيًا «المتكئين»، إذ كان الاتكاء هو الوضع المعتاد عند تناول الطعام.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «السمك الصغير». قد يدل اللفظ اليوناني على السمك الذي يؤكل مع الخبز، وربما كان سمكًا صغيرًا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: فـ
  rationale: تفيد الانتقال والنتيجة في سياق السرد، وتحافظ «فـ» على هذا الربط بأسلوب عربي طبيعي موجز.
- source_word: τοὺς ἄρτους
  choice: الأرغفة
  rationale: المفرد ἄρτος قد يعني الخبز عمومًا، لكن صيغة الجمع في سياق الإطعام تشير طبيعيًا إلى أرغفة معدودة.
- source_word: εὐχαριστήσας
  choice: وشكر، ثم
  rationale: ينقل الفعل السابق زمنيًا للفعل الرئيس من غير إضافة مفعول غير مذكور في اليونانية، مثل «الله».
- source_word: διέδωκεν
  choice: وزّعها
  rationale: الفعل يدل على التوزيع بين الجماعة، والضمير يعود بوضوح إلى الأرغفة.
- source_word: τοῖς ἀνακειμένοις
  choice: على المتكئين
  rationale: يحافظ على الصورة الأصلية لوضعية الاتكاء المعتادة عند تناول الطعام، بدل تسويتها إلى مجرد الجلوس.
- source_word: ὁμοίως καὶ
  choice: وكذلك
  rationale: تؤدي معنى الموازاة بين توزيع الأرغفة وتوزيع السمك من غير حشو غير طبيعي في العربية.
- source_word: ἐκ τῶν ὀψαρίων
  choice: أعطاهم من السمك
  rationale: يحافظ حرف الجر «من» على صياغة المصدر، ويُستفاد فعل الإعطاء من فعل التوزيع السابق. واللفظ اليوناني قد يدل على السمك المأكول مع الخبز، وربما السمك الصغير، لكن «السمك» أنسب في المتن.
- source_word: ὅσον ἤθελον
  choice: بقدر ما أرادوا
  rationale: ينقل مقدار ما ناله الآكلون بحسب إرادتهم، بعبارة عربية واضحة وطبيعية.
theological_decisions:
- issue: الإيحاء الإفخارستي المحتمل في εὐχαριστήσας ضمن رواية الإطعام
  choice: «شكر» من غير توسع طقسي
  alternative: «بارك» أو التصريح بدلالة إفخارستية في المتن
  rationale: الفعل اليوناني يعني أنه قدّم الشكر. وقد يحمل السياق أصداء لاهوتية لاحقة، لكن لا ينبغي إدخال تفسير أسراري صريح في نص الترجمة.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. استُخدم «المتكئين» للمحافظة على صورة الأصل الثقافية، مع إيضاحها في الحاشية. ووُضعت علامة الحاشية [a] بعد اللفظ الذي تشرحه، لا بعد «الأرغفة».
