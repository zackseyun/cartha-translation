  text: Truly[a], truly, I say to you[b], the one who believes has eternal life.
translation:
  language: ar
  text: 'الحقَّ الحقَّ أقول لكم: الذي يؤمن[a] له حياة أبدية[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو «مَن يؤمن». في اليونانية اسم فاعل مضارع معرَّف، وحرفيًا: «المؤمن» أو «الذي يؤمن».'
    reason: lexical_alternative
  - marker: b
    text: 'أو «حياة دائمة إلى الأبد»؛ وحرفيًا على نحو أقرب: «حياة الدهر» أو «الحياة الدهرية».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: الحقَّ الحقَّ
  rationale: تنقل العبارة الاستهلالية التوكيدية الخاصة بأسلوب يوحنا، وتحفظ التكرار وقوة التصريح بلغة عربية كتابية واضحة.
- source_word: λέγω ὑμῖν
  choice: أقول لكم
  rationale: ترجمة مباشرة للفعل المضارع والضمير في صيغة الجمع، وتحافظ على الإيقاع الرسمي للقول.
- source_word: ὁ πιστεύων
  choice: الذي يؤمن
  rationale: تنقل اسم الفاعل المضارع المعرَّف بوصفه دالًا على الشخص المتصف بالإيمان، من غير إضافة مفعول غير مذكور في النص اليوناني.
- source_word: ἔχει
  choice: له
  rationale: تعبير عربي طبيعي عن الملكية في الزمن الحاضر، ويحفظ تأكيد النص أن الحياة الأبدية حاضرة للمؤمن، لا مجرد وعد مستقبلي.
- source_word: ζωὴν αἰώνιον
  choice: حياة أبدية
  rationale: تعبير عربي راسخ وطبيعي ينقل المعنى الزمني والكيفي للعبارة في سياق يوحنا، مع إمكان ترجمتها حرفيًا على نحو أقرب إلى «حياة الدهر».
theological_decisions:
- issue: امتلاك الحياة الأبدية في الحاضر
  choice: له حياة أبدية
  alternative: ستكون له حياة أبدية
  rationale: الفعل اليوناني ἔχει في المضارع، ولذلك ينبغي إبقاء الحياة الأبدية حقيقة حاضرة في العبارة، من غير تحويلها إلى المستقبل.
translation_notes:
  register: العربية فصحى معاصرة واضحة ذات نبرة وقورة. حُفظ تكرار «الحقَّ» المميز لأقوال يسوع في يوحنا، واستُعمل التركيب العربي الطبيعي «له حياة» لإبقاء دلالة الحاضر. وُضعت علامتا الحاشيتين عند العبارتين اللتين تفسرانهما.
