lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτοῖς
  choice: فأجابهم يسوع
  rationale: الصيغة اليونانية الحرفية «أجاب يسوع وقال لهم» تركيب سردي مألوف، لكن «فأجابهم يسوع» ينقل فعل الاستجابة كاملًا بعربية طبيعية واضحة من غير حشو، مع دلالة الفاء على تعاقب الكلام.
- source_word: Μὴ γογγύζετε
  choice: لا تتذمّروا
  rationale: الفعل γογγύζω يدل على التذمر أو الهمهمة بالشكوى. وصيغة «لا تتذمّروا» تحفظ النهي من غير الجزم بأن الفعل كان قد بدأ، كما تلائم صدى تذمر الشعب في الرواية الكتابية.
- source_word: μετ’ ἀλλήλων
  choice: فيما بينكم
  rationale: تفيد العبارة فعلًا متبادلًا داخل الجماعة؛ و«فيما بينكم» تعبير عربي طبيعي يحفظ هذا المعنى.
- source_word: Ἰησοῦς
  choice: يسوع
  rationale: الصيغة العربية الكتابية المعيارية للاسم.
