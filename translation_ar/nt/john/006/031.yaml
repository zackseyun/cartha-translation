  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: οἱ πατέρες ἡμῶν τὸ μάννα ἔφαγον ἐν τῇ ἐρήμῳ, καθώς ἐστιν γεγραμμένον· Ἄρτον ἐκ τοῦ οὐρανοῦ ἔδωκεν αὐτοῖς φαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/031.yaml
  text: 'Our fathers ate the manna in the wilderness[b][a], just as it is written: ‘He gave them bread from heaven to eat.’'
translation:
  language: ar
  text: 'آباؤنا أكلوا المنَّ في البرية[a]، كما هو مكتوب: «أعطاهم خبزًا من السماء ليأكلوا».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أيضًا ترجمة «البرية» بـ«الصحراء».
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πατέρες ἡμῶν
  choice: آباؤنا
  rationale: يحفظ المعنى الحرفي وصيغة التذكير في اليونانية، وهو تعبير عربي كتابي طبيعي يشير هنا إلى أسلاف بني إسرائيل.
- source_word: τὸ μάννα
  choice: المنَّ
  rationale: هو الاسم العربي المستقر للطعام الذي أُعطي لبني إسرائيل في البرية، مع أداة التعريف للدلالة على العطية المعروفة.
- source_word: ἔφαγον
  choice: أكلوا
  rationale: ينقل الفعل الماضي اليوناني مباشرة وبوضوح من غير زيادة تفسيرية.
- source_word: ἐν τῇ ἐρήμῳ
  choice: في البرية
  rationale: «البرية» تلائم سياق الخروج وتحفظ الصدى الكتابي، مع إمكان معنى «الصحراء» بحسب السياق.
- source_word: καθώς ἐστιν γεγραμμένον
  choice: كما هو مكتوب
  rationale: صيغة عربية طبيعية ومستقرة لإدخال اقتباس من الكتاب، وتحفظ معنى الشهادة المكتوبة القائمة.
- source_word: Ἄρτον
  choice: خبزًا
  rationale: ينقل المعنى العام لـἄρτος هنا بوصفه طعامًا معطًى، من غير أن يخصصه برغيف واحد.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: من السماء
  rationale: ترجمة مباشرة وطبيعية تحفظ دلالة المصدر السماوي.
- source_word: ἔδωκεν αὐτοῖς φαγεῖν
  choice: أعطاهم ... ليأكلوا
  rationale: يحفظ تركيب العطاء مع غايته، ويأتي فصيحًا وطبيعيًا في العربية.
theological_decisions:
- issue: نقل الاقتباس عن المن من غير استباق التفسير المسيحاني اللاحق في الخطاب
  choice: إبقاء العبارة خبرًا كتابيًا عن إعطاء الخبز من السماء، بلا توسعة تفسيرية أو تمييز طباعي يوحي مسبقًا بأن المقصود هنا هو المسيح.
  alternative: صياغة تفسيرية تستبق إعلان يسوع عن الخبز الحقيقي النازل من السماء.
  rationale: المتكلمون في هذا الموضع يستشهدون بعطية المن التاريخية؛ لذلك ينبغي أن ينشأ المعنى المسيحاني من تطور الحوار نفسه لا أن يُدرج في كلامهم.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُعمل «آباؤنا» لأنه طبيعي ودقيق في العربية، فلم تُضف حاشية «أسلافنا» التي يحتاج إليها القارئ الإنجليزي أكثر من العربي. وُضع مؤشر الحاشية بعد «البرية» مباشرة.
