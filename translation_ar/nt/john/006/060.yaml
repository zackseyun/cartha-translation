  text: Therefore many of his disciples[a], when they heard it, said, “This word is hard[b]; who can listen to it?”
translation:
  language: ar
  text: 'فقال كثيرون من تلاميذه، لما سمعوا هذا: «هذا الكلام[a] صعب؛ مَن يقدر أن يصغي إليه؟»[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «هذا القول صعب». ويمكن أن تعني الكلمة اليونانية المترجمة «الكلام» أيضًا «القول» أو «الرسالة» أو «التعليم».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «مَن يقدر أن يسمعه؟» فالفعل اليوناني قد يعني السماع أو الإصغاء أو الاستجابة بالقبول، بحسب السياق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλοὶ οὖν
  choice: فقال كثيرون
  rationale: «كثيرون» تنقل الكمية بإيجاز، وتأتي الفاء لربط رد الفعل بما سبقه ربطًا طبيعيًا في العربية، مع إسناد فعل القول الوارد لاحقًا.
- source_word: ἀκούσαντες
  choice: لما سمعوا هذا
  rationale: تنقل اسم الفاعل الماضي بوظيفة زمنية واضحة، و«هذا» يحيل طبيعيًا إلى الكلام السابق.
- source_word: ἐκ τῶν μαθητῶν αὐτοῦ
  choice: من تلاميذه
  rationale: تفيد أن المتكلمين كانوا من ضمن جماعة تلاميذه، من غير إيحاء بأن جميع التلاميذ قالوا ذلك.
- source_word: Σκληρός
  choice: صعب
  rationale: «صعب» تعبير عربي طبيعي يمكن أن يدل على صعوبة تقبّل الكلام أو احتماله، ولا يحصر الاعتراض في التعقيد الفكري وحده؛ وتوضح الحاشية إمكان معنى الشدة.
- source_word: ὁ λόγος οὗτος
  choice: هذا الكلام
  rationale: «الكلام» أنسب في العربية الحديثة للإشارة إلى الخطاب أو القول المسموع، ويحافظ على سعة λόγος بين القول والكلام والتعليم.
- source_word: τίς δύναται
  choice: مَن يقدر
  rationale: صياغة عربية مباشرة وطبيعية لسؤال القدرة.
- source_word: αὐτοῦ ἀκούειν
  choice: أن يصغي إليه
  rationale: «يصغي إليه» تتجاوز مجرد وصول الصوت إلى معنى الاستماع المتقبّل، من دون أن تحسم المعنى إلى «يقبله».
theological_decisions:
- issue: طبيعة اعتراض التلاميذ على خطاب يسوع
  choice: يصفون الكلام بأنه صعب التلقي أو الاحتمال، من دون تحديد هل الصعوبة فكرية أم أخلاقية أم ناتجة عن شدته.
  alternative: «هذا الكلام قاسٍ» أو «هذا الكلام عسير الفهم» أو «مَن يستطيع أن يقبله؟»
  rationale: يمكن أن تدل σκληρός على الصعوبة أو الشدة أو ما يصعب احتماله، ويمكن أن تمتد ἀκούειν من السماع إلى الإصغاء والقبول. اختيرت صياغة تحافظ على هذا التوتر ولا تحصره في تفسير واحد.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم «الكلام» بدل «الكلمة» لأن المقصود خطاب مسموع، و«يصغي» للحفاظ على الفرق السياقي بين مجرد السماع والاستماع المتقبّل. وُضع رابط النتيجة في الفاء العربية بدل ترجمة οὖν بكلمة مستقلة ثقيلة.
