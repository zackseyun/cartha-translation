  text: So Jesus said to the Twelve[a], “You do not want to go away too, do you?”
translation:
  language: ar
  text: 'فقال يسوع للاثني عشر: «لا تريدون أنتم أيضًا أن تنصرفوا، أليس كذلك؟»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أفتريدون أنتم أيضًا أن ترحلوا؟» تبدأ صيغة السؤال اليونانية بالأداة μή، وهي غالبًا توحي بأن المتكلم يتوقع جوابًا بالنفي.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: فـ
  rationale: تربط القول بما سبق، إذ كان كثير من التلاميذ قد رجعوا، وتحافظ على انسياب السرد الطبيعي في العربية.
- source_word: τοῖς δώδεκα
  choice: للاثني عشر
  rationale: يحافظ على التعبير بوصفه لقبًا معروفًا لجماعة يسوع الداخلية، من غير إضافة كلمة «تلاميذ» غير الموجودة في النص.
- source_word: Μὴ καὶ ὑμεῖς
  choice: أما أنتم أيضًا، فلا ...، أليس كذلك؟
  rationale: تنقل صياغة السؤال اليوناني التي تتوقع غالبًا جوابًا بالنفي، مع إبراز «أنتم أيضًا» بالمقابلة مع الذين انصرفوا.
- source_word: θέλετε
  choice: تريدون
  rationale: مقابل عربي واضح وطبيعي يدل هنا على الرغبة أو الإرادة.
- source_word: ὑπάγειν
  choice: أن تذهبوا
  rationale: يحافظ على معنى الحركة والابتعاد من غير أن يحدد صراحةً أن المقصود ترك يسوع، مع أن السياق يوحي بذلك.
theological_decisions:
- issue: دلالة السؤال المبدوء بالأداة μή
  choice: سؤال بصياغة تتوقع جوابًا بالنفي من غير تحويل هذا التوقع إلى تقرير جازم
  alternative: «أفتريدون أنتم أيضًا أن ترحلوا؟» بوصفه سؤالًا أقرب إلى الحياد
  rationale: تدل μή في هذا النوع من الأسئلة غالبًا على توقع جواب بالنفي. وتنقل الصياغة العربية المختارة هذه النبرة مع إبقاء إمكانية جواب المخاطَبين مفتوحة.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُخدم «الاثنا عشر» بوصفه لقبًا جماعيًا، وصيغ السؤال بطريقة عربية طبيعية نسبيًا تحفظ توقع الجواب بالنفي دون إلغاء التوتر الموجود في السؤال.
