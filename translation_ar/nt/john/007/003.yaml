base_translation:
  language: en
  yaml_path: translation/nt/john/007/003.yaml
  text: So his brothers said to him[a], “Leave here and go to Judea, so that your disciples also may see the works you are doing.”
translation:
  language: ar
  text: 'فقال له إخوته: «انتقل من هنا واذهب إلى اليهودية، لكي يرى[a] تلاميذك أيضًا الأعمال التي تقوم بها.»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لكي يشاهد تلاميذك أيضًا»؛ وبحسب صيغة الفعل اليوناني حرفيًا: «فسيرى تلاميذك أيضًا». فالفعل قد يشدد على المشاهدة أو المعاينة، وقد جاء هنا بصيغة المستقبل في جملة تفيد الغرض.'
    reason: بديل معجمي وصرفي
lexical_decisions:
- source_word: οὖν
  choice: فقال
  rationale: أُدمج رابط الاستنتاج أو تتابع السرد في الفاء العربية، وهي صياغة طبيعية تصل هذه الجملة بسياقها السابق من غير إثقال.
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: إخوته
  rationale: ينقل اللفظ اليوناني بصيغة المذكر الجمع ودلالته العائلية المباشرة، من غير توسيعه إلى الإخوة والأخوات أو حسم طبيعة القرابة بأكثر مما يقوله اللفظ.
- source_word: Μετάβηθι ἐντεῦθεν
  choice: انتقل من هنا
  rationale: يحافظ على الأمر المباشر بالمغادرة والانتقال من الموضع الحالي، بصياغة عربية واضحة.
- source_word: ὕπαγε εἰς τὴν Ἰουδαίαν
  choice: اذهب إلى اليهودية
  rationale: ترجمة مباشرة وطبيعية لفعل الحركة واسم الإقليم الجغرافي.
- source_word: ἵνα καὶ οἱ μαθηταί σου
  choice: لكي يرى تلاميذك أيضًا
  rationale: تنقل لكي غرض الجملة، وتُبقي أيضًا مرتبطة بالتلاميذ على نحو طبيعي في العربية.
- source_word: θεωρήσουσιν
  choice: يرى
  rationale: الفعل يدل على الرؤية المتأنية أو المشاهدة، وقد ورد بصيغة المستقبل داخل جملة غرض؛ لذلك صيغ بالمضارع المنصوب بعد لكي، مع بيان البدائل في الحاشية.
- source_word: σοῦ τὰ ἔργα ἃ ποιεῖς
  choice: الأعمال التي تقوم بها
  rationale: تحافظ كلمة الأعمال على اللفظ اليوحناوي الموضوعي ἔργα، وتعبّر عبارة تقوم بها طبيعيًا عن صلة الموصول والفعل مع دلالة الإضافة إلى يسوع.
theological_decisions:
- issue: مدلول «إخوته»
  choice: الإبقاء على التسمية العائلية المباشرة «إخوته»
  alternative: أقاربه
  rationale: اللفظ اليوناني يعني «إخوة» في صورته المباشرة، لكن الآية نفسها لا تفصّل طبيعة القرابة؛ لذلك لا تُستبدل به تسمية أوسع ولا يُضاف تفسير عقائدي يحسم ما لم تصرّح به العبارة.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة الأسلوب. استُخدمت ألفاظ مألوفة مع الحفاظ على مصطلحي «التلاميذ» و«الأعمال» لما لهما من حضور موضوعي في إنجيل يوحنا.
