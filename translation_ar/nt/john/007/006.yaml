source:
  edition: SBLGNT
  text: λέγει οὖν αὐτοῖς ὁ Ἰησοῦς· Ὁ καιρὸς ὁ ἐμὸς οὔπω πάρεστιν, ὁ δὲ καιρὸς ὁ ὑμέτερος πάντοτέ ἐστιν ἕτοιμος.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/006.yaml
  text: So Jesus said to them[a], “My time has not yet come, but your time is always ready.”
translation:
  language: ar
  text: 'فقال لهم يسوع: «إن وقتي لم يَحِنْ بعد، أما وقتكم فمهيَّأ دائمًا».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إن موعدي المحدد لم يأتِ بعد». يمكن أن تدل الكلمة اليونانية على الوقت الملائم أو المحدد، لا على الزمن بمعناه العام فحسب.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: فـ
  rationale: تفيد الاستمرار الناتج عما سبق أو الانتقال السردي، وتؤدي ذلك بإيجاز وطبيعية في العربية.
- source_word: λέγει ... ὁ Ἰησοῦς
  choice: قال يسوع
  rationale: الفعل مضارع تاريخي في اليونانية، ويُصاغ بالماضي في السرد العربي الطبيعي.
- source_word: αὐτοῖς
  choice: لهم
  rationale: ترجمة مباشرة للمفعول غير المباشر من غير تحديد زائد على النص.
- source_word: καιρός
  choice: وقت
  rationale: يدل هنا على الوقت الملائم أو المحدد، ولفظ «وقت» يحفظ الإيجاز والتوازي من غير حسم زائد.
- source_word: ὁ καιρὸς ὁ ἐμός
  choice: وقتي
  rationale: يحفظ المقابلة والتوكيد بالملكية في صياغة عربية طبيعية.
- source_word: οὔπω πάρεστιν
  choice: لم يَحِنْ بعد
  rationale: تعبير عربي فصيح وطبيعي يفيد أن الوقت المعني لم يأت أو لم يصبح حاضرًا بعد.
- source_word: δὲ
  choice: أما
  rationale: تبرز المقابلة بين وقت يسوع ووقتهم بوضوح، من غير أن تثقل العبارة.
- source_word: ὁ καιρὸς ὁ ὑμέτερος
  choice: وقتكم
  rationale: يماثل «وقتي» ويحفظ التضاد الصريح في الأصل.
- source_word: πάντοτέ
  choice: دائمًا
  rationale: المقابل العربي المباشر لمعنى «في كل وقت».
- source_word: ἕτοιμος
  choice: مهيَّأ
  rationale: ينقل معنى الاستعداد أو الجاهزية، ويلائم وصف «الوقت» في العربية أكثر من إسناد «جاهز» إليه هنا.
theological_decisions:
- issue: دلالة «وقت» يسوع في سياق إنجيل يوحنا
  choice: وقتي
  alternative: موعدي المحدد؛ ساعتي
  rationale: يحافظ النص على لفظ καιρός «وقت» ولا يستبدله بـὥρα «ساعة»، كما لا يصرّح في المتن بدلالة لاهوتية أوسع مما يقوله الأصل.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدمت «لم يَحِنْ بعد» للتعبير الطبيعي عن عدم مجيء الوقت، وحُفظت المقابلة الموجزة بين «وقتي» و«وقتكم».
