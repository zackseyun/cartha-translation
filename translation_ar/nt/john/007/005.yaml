  yaml_path: translation/nt/john/007/005.yaml
  text: For not even his brothers believed in him[a].
translation:
  language: ar
  text: فإن حتى إخوته لم يكونوا يؤمنون به[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فإن حتى إخوته لم يؤمنوا به». يمكن أن يدل الفعل اليوناني بصيغة الماضي الناقص على حالة أو فعل مستمر في الماضي، أو يُنقل في العربية بماضٍ بسيط بحسب السياق.'
    reason: بديل صرفي أسلوبي يحفظ احتمال دلالة الماضي الناقص اليوناني.
lexical_decisions:
- source_word: οὐδὲ
  choice: حتى ... لم
  rationale: ينقل معنى «ولا حتى» التوكيدي في صياغة عربية طبيعية، ويبرز أن عدم الإيمان شمل إخوته أيضًا.
- source_word: γὰρ
  choice: فـ
  rationale: الفاء تبيّن أن الجملة تعليل لما سبق وتحافظ على اتصالها بالسياق من غير توسع تفسيري.
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: إخوته
  rationale: اللفظ اليوناني مذكر جمع، ويشير في السرد إلى إخوة يسوع الذكور أو أقربائه كما يعرضهم النص؛ و«إخوته» المقابل العربي المباشر والطبيعي.
- source_word: ἐπίστευον
  choice: لم يكونوا يؤمنون
  rationale: الفعل في صيغة الماضي الناقص، وهذه الصياغة تنقل إمكان الدلالة على حالة أو فعل مستمر في الماضي مع بقاء العربية واضحة.
- source_word: εἰς αὐτόν
  choice: به
  rationale: تركيب «آمن به» هو المقابل العربي المألوف والطبيعي لـ πιστεύω εἰς، ويدل هنا على إيمان أو ثقة موجّهة إلى شخصه.
theological_decisions:
- issue: دلالة πιστεύω εἰς αὐτόν في استعمال يوحنا
  choice: الإيمان بيسوع أو وضع الثقة فيه
  alternative: لم يكونوا يثقون به
  rationale: يستعمل يوحنا πιστεύω مع εἰς عادة للدلالة على الإيمان بيسوع أو الثقة الشخصية فيه. تحافظ الترجمة على هذا المعنى دون أن تحدد أسباب عدم إيمانهم أو تستورد نتائج عقائدية لاحقة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختيرت «لم يكونوا يؤمنون» في المتن لإظهار جانب الاستمرار في الماضي، مع إثبات الصياغة الأبسط «لم يؤمنوا» في الحاشية. وُضع مؤشر الحاشية بعد الجملة مباشرة.
