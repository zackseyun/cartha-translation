  to: إن أراد أحد أن يعمل مشيئة الله، فسيعرف بشأن التعليم هل هو من الله، أم إنني أتكلم من عند نفسي[a].
  rationale: استُبدلت «مشيئته» بـ«مشيئة الله» لأن الضمير العربي بعد «أحد» يلتبس، بل يرجح أن يعود إلى الشخص المذكور، خلاف المرجع السياقي للنص. ولم يُغيَّر سائر البناء أو دلالة عبارة «من عند نفسي»، وحُفظت الحاشية ومرساها.
