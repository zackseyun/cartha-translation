  text: ἐάν τις θέλῃ τὸ θέλημα αὐτοῦ ποιεῖν, γνώσεται περὶ τῆς διδαχῆς πότερον ἐκ τοῦ θεοῦ ἐστιν ἢ ἐγὼ ἀπ’ ἐμαυτοῦ λαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/017.yaml
  text: If anyone wants to do his will[a], he will know about the teaching, whether it is from God or whether I am speaking from myself.
translation:
  language: ar
  text: إن أراد أحد أن يعمل مشيئة الله، فسيعرف بشأن التعليم هل هو من الله، أم إنني أتكلم من عند نفسي[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو «من تلقاء نفسي»، أو «بسلطاني الخاص». والعبارة اليونانية حرفيًا: «من نفسي».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τις θέλῃ
  choice: إن أراد أحد
  rationale: تفيد ἐάν مع صيغة الاحتمال شرطًا عامًا، ويحفظ «أراد» معنى الرغبة والاستعداد بعبارة عربية طبيعية.
- source_word: τὸ θέλημα αὐτοῦ ποιεῖν
  choice: أن يعمل مشيئته
  rationale: يحافظ على الضمير الوارد في اليونانية وعلى التعبير المألوف «يعمل مشيئة» دون استبداله بتفسير صريح.
- source_word: γνώσεται
  choice: فسيعرف
  rationale: ينقل صيغة المستقبل ويفيد المعرفة أو التمييز الناتج عن الشرط المذكور.
- source_word: περὶ τῆς διδαχῆς
  choice: بشأن التعليم
  rationale: ينقل معنى περί مع المضاف إليه، ويحافظ على التعريف في «التعليم» بوصفه التعليم الجاري الحديث عنه.
- source_word: πότερον ... ἢ
  choice: هل ... أم
  rationale: صياغة عربية سليمة تعرض البديلين بوضوح داخل سؤال غير مباشر.
- source_word: ἐκ τοῦ θεοῦ
  choice: من الله
  rationale: تحافظ «من» على دلالة المصدر أو المنشأ في ἐκ دون إضافة فعل غير موجود صراحة.
- source_word: ἀπ’ ἐμαυτοῦ
  choice: من عند نفسي
  rationale: تحفظ صورة المصدر في اليونانية، وتبقى طبيعية في العربية، من غير حصر المعنى في الاستقلال بالسلطان.
- source_word: λαλῶ
  choice: أتكلم
  rationale: ينقل المضارع اليوناني مباشرة ويلائم سياق كلام يسوع الجاري.
theological_decisions:
- issue: مرجع الضمير في αὐτοῦ
  choice: الإبقاء على «مشيئته» مع كون الله هو المرجع الأرجح سياقيًا
  alternative: أن يعمل مشيئة الله
  rationale: السياق يوضح أن المرجع هو الله، لكن النص اليوناني يستعمل الضمير؛ لذلك يحفظه النص العربي ولا يحوّل التفسير السياقي إلى تصريح.
- issue: دلالة ἀπ’ ἐμαυτοῦ
  choice: من عند نفسي
  alternative: من تلقاء نفسي؛ أو بسلطاني الخاص
  rationale: العبارة اليونانية تدل مباشرة على المصدر أو المنشأ. أما معنى التصرف المستقل أو السلطان الذاتي فمحتمل، لكنه أوسع من اللفظ نفسه، ولذلك يرد في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدم «هل ... أم» لعرض البديلين طبيعيًا، وأُبقي الضمير في «مشيئته» وصورة المصدر في «من عند نفسي» صونًا لصياغة الأصل وما فيها من مجال دلالي.
