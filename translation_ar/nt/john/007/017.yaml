  terminology: «التعليم»، و«من الله»، و«من عند نفسي» اختيارات مناسبة. ويُصرَّح بـ«مشيئة الله» في المتن لتفادي الإحالة العربية الملتبسة، لا لإضافة تفسير مذهبي.
