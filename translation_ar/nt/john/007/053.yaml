translation:
  language: ar
  text: وذهب[a] كلُّ واحدٍ إلى بيته.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: تبدأ بهذه الآية قصة المرأة التي أُمسكت في الزنى (يوحنا 7:‏53–8:‏11). والمقطع كله غير موجود في أقدم المخطوطات اليونانية، ومنها برديات من القرن الثالث والمخطوطتان السينائية والفاتيكانية من القرن الرابع، كما أنه غير موجود في ترجمات قبطية وسريانية مبكرة. لكنه موجود في مخطوطة بيزا من القرن الخامس، وفي التقليد اللاتيني، وفي التقليد البيزنطي اللاحق ذي الأغلبية. وترد القصة في بعض المخطوطات في مواضع مختلفة، مثل بعد يوحنا 21:‏25 أو لوقا 21:‏38، مما يشير إلى أنها كانت في الأصل تقليدًا شفهيًا مستقلًا أُدرج في مسار نقل النص. وقد أُبقي عليها هنا لما حظيت به من محبة وتقدير لاهوتي ورعوي على مدى 1500 سنة من القراءة المسيحية.
    reason: textual_critical
lexical_decisions:
- source_word: ἐπορεύθη
  choice: ذهب
  rationale: الفعل يدل على الانتقال أو الانصراف؛ و«ذهب» هو التعبير العربي الطبيعي هنا من غير إضافة معنى غير منصوص عليه.
- source_word: ἕκαστος
  choice: كلُّ واحدٍ
  rationale: يحافظ هذا التعبير على صيغة المفرد وعلى إبراز تفرّق الأفراد واحدًا واحدًا.
- source_word: οἶκον
  choice: بيته
  rationale: مع أن المعنى الحرفي هو «بيت»، فإن العبارة اليونانية εἰς τὸν οἶκον αὐτοῦ تعني طبيعيًا الذهاب إلى بيت الشخص، ولذلك جاءت «إلى بيته».
- source_word: Καί
  choice: ثم
  rationale: تصل الأداة الجملة بما قبلها، و«ثم» تلائم هنا الانتقال السردي إلى انصراف كل واحد إلى بيته، من غير إثقال الأسلوب بحرف عطف افتتاحي غير طبيعي.
