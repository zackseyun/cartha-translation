base_translation:
  language: en
  yaml_path: translation/nt/john/007/052.yaml
  text: They answered and said to him[b][a], “Are you also from Galilee? Search and see that no prophet arises from Galilee.”
translation:
  language: ar
  text: 'فأجابوه وقالوا له: «أفأنت أيضًا من الجليل؟ ابحث وانظر: لا يقوم نبيّ من الجليل[a].»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لا يُقام نبيّ من الجليل»، مع احتمال أن يكون المعنى أن الله يقيم الأنبياء. والسؤال اليوناني مصوغ بطريقة ترجّح جوابًا بالنفي: «أنت أيضًا لستَ من الجليل، أليس كذلك؟»'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ
  choice: فأجابوه وقالوا له
  rationale: يحافظ على الفعلين وصيغة السرد اليوحناوية، مع تعبير عربي واضح غير متكلّف.
- source_word: Μὴ καὶ σὺ ἐκ τῆς Γαλιλαίας εἶ;
  choice: ألعلك أنت أيضًا من الجليل؟
  rationale: ينقل السؤال الاستنكاري الذي صيغ في اليونانية على نحو يتوقع جوابًا بالنفي، من غير إضافة تفسير إلى المتن.
- source_word: ἐραύνησον καὶ ἴδε
  choice: ابحث وانظر
  rationale: يحفظ تتابع فعلي الأمر ومباشرة التحدي الجدلي في الأصل.
- source_word: προφήτης
  choice: نبيّ
  rationale: الاسم نكرة في اليونانية، والسياق يفيد نفي ظهور أي نبي من الجليل، لا الإشارة بالضرورة إلى «النبي» المنتظر.
- source_word: οὐκ ἐγείρεται
  choice: لا يقوم
  rationale: يحفظ صورة الفعل اليوناني وإمكان فهمه بمعنى ظهور نبي أو إقامته، وهو تعبير عربي مألوف في هذا السياق.
theological_decisions:
- issue: القوة البلاغية للسؤال المنفي
  choice: ألعلك أنت أيضًا من الجليل؟
  alternative: أفأنت أيضًا من الجليل؟ / ألستَ أنت أيضًا من الجليل؟
  rationale: تفيد «ألعلك» الاستنكار وعدم التصديق، وتبقي توقع الجواب بالنفي ظاهرًا من غير صياغة عربية ملتبسة.
- issue: دلالة ἐγείρεται وصيغته الصرفية
  choice: لا يقوم نبيّ
  alternative: لا يُقام نبيّ
  rationale: الصيغة اليونانية يمكن أن تُفهم وسطية/لازمة بمعنى «يقوم أو يظهر»، أو مبنية للمجهول بمعنى «يُقام» مع احتمال كون الله هو الفاعل المفهوم. اختيرت صياغة المتن الطبيعية، وحُفظ البديل في الحاشية.
- issue: دعوى عدم قيام نبي من الجليل
  choice: نقل قول المتكلمين كما هو
  alternative: تصحيح الدعوى داخل المتن
  rationale: العبارة قول جدلي للشخصيات، ولا ينبغي للترجمة أن تصححه أو توفّقه مع التاريخ داخل المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «ألعلك» لإظهار نبرة الاستنكار وتوقّع النفي، و«يقوم» للمحافظة على صورة الفعل وإبقاء الاحتمال الدلالي مفتوحًا. جميع علامات الحواشي الواردة مثبتة في المتن.
