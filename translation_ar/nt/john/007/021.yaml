  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτοῖς· Ἓν ἔργον ἐποίησα καὶ πάντες θαυμάζετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/021.yaml
  text: Jesus answered and said to them[a], “I did one work[b], and you all marvel.”
translation:
  language: ar
  text: 'أَجَابَهُمْ يَسُوعُ وَقَالَ: «عَمِلْتُ عَمَلًا وَاحِدًا[a][b]، وَأَنْتُمْ جَمِيعًا تَتَعَجَّبُونَ».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «فِعْلًا». يمكن أن تحمل الكلمة اليونانية المعنيين، لكن «عملًا» يحفظ استعمال يوحنا المتكرر لهذا اللفظ في حديثه عن أعمال يسوع.
    reason: lexical_alternative
  - marker: b
    text: 'يُرجَّح أنه يشير إلى شفاء يسوع للرجل المقعد في يوم السبت (يوحنا 5: 1–18).'
    reason: cross_reference
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν αὐτοῖς
  choice: أَجَابَهُمْ … وَقَالَ
  rationale: يحافظ على فعلي الصيغة السردية في الأصل، ويعبّر عن المفعول غير المباشر بضمير متصل طبيعي في العربية.
- source_word: Ἓν ἔργον
  choice: عَمَلًا وَاحِدًا
  rationale: يحفظ تأكيد العدد «واحدًا»، ويستبقي لفظ «عمل» المتكرر في إنجيل يوحنا لوصف أعمال يسوع وما قد يحمله من دلالة لاهوتية.
- source_word: ἐποίησα
  choice: عَمِلْتُ
  rationale: تعبير عربي مباشر وبسيط عن الفعل الماضي، من غير إضافة معنى الأداء الرسمي أو الإنجاز.
- source_word: πάντες
  choice: جَمِيعًا
  rationale: يبين أن الكلام موجَّه إلى الجماعة كلها، مع بقاء المخاطب الجمع ظاهرًا في «أنتم».
- source_word: θαυμάζετε
  choice: تَتَعَجَّبُونَ
  rationale: يحفظ زمن المضارع ومعنى الدهشة الذي قد يتضمن الاستغراب، من غير حصره في الإعجاب الإيجابي.
theological_decisions:
- issue: الدلالة اليوحناوية للفظ ἔργον
  choice: عَمَلًا
  alternative: فِعْلًا
  rationale: يُرجَّح أن الكلام يشير إلى شفاء المقعد في السبت، ويستعمل يوحنا «العمل» مرارًا لأفعال يسوع بدلالة أوسع؛ لذا يحفظ «عملًا» هذا الترابط من غير إدخال التفسير في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظت الصيغة المزدوجة «أجاب… وقال»، كما حُفظ المضارع في «تتعجبون» والغموض بين الدهشة والاستغراب.
