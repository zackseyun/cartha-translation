source:
  edition: SBLGNT
  text: ἔκραξεν οὖν ἐν τῷ ἱερῷ διδάσκων ὁ Ἰησοῦς καὶ λέγων· Κἀμὲ οἴδατε καὶ οἴδατε πόθεν εἰμί· καὶ ἀπ’ ἐμαυτοῦ οὐκ ἐλήλυθα, ἀλλ’ ἔστιν ἀληθινὸς ὁ πέμψας με, ὃν ὑμεῖς οὐκ οἴδατε·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/028.yaml
  text: So Jesus cried out in the temple[a], teaching and saying, “You know me, and you know where I am from. And I have not come from myself, but the one who sent me is true[c][b], whom you do not know.”
translation:
  language: ar
  text: 'فَنَادَى يَسُوعُ بِصَوْتٍ عَالٍ وَهُوَ يُعَلِّمُ فِي الْهَيْكَلِ قَائِلًا: «أَنْتُمْ تَعْرِفُونَنِي، وَتَعْرِفُونَ مِنْ أَيْنَ أَنَا.[a] وَلَمْ آتِ مِنْ تِلْقَاءِ نَفْسِي،[b] بَلِ الَّذِي أَرْسَلَنِي هُوَ الْحَقُّ،[c] وَأَنْتُمْ لَا تَعْرِفُونَهُ».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'قد تُفهم العبارة في سياقها على أنها تحمل سخرية أو تحدّيًا: «أتعرفونني وتعرفون من أين أنا؟» لكن صياغتها اليونانية خبرية.'
    reason: alternative_reading
  - marker: b
    text: '«من تلقاء نفسي» تعني أيضًا: «بمبادرة مني» أو «من عند نفسي».'
    reason: lexical_alternative
  - marker: c
    text: 'يمكن أن تعني «الحقّ» أيضًا: «حقيقي» أو «أصيل».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκραξεν
  choice: نادى بصوت عالٍ
  rationale: ينقل قوة النداء العلني المسموع من غير أن يوحي بالضرورة بالألم أو الاستغاثة.
- source_word: ἐν τῷ ἱερῷ
  choice: في الهيكل
  rationale: يشير اللفظ اليوناني إلى مجمّع الهيكل، وهذه الصياغة العربية الطبيعية تتسع لذلك المعنى.
- source_word: διδάσκων ... καὶ λέγων
  choice: وهو يعلّم ... قائلًا
  rationale: يحفظ فعل التعليم المستمر ويمهّد طبيعيًا للكلام المباشر.
- source_word: Κἀμὲ οἴδατε
  choice: أنتم تعرفونني
  rationale: يحفظ توكيد الضمير ونبرة المواجهة من دون صياغة عربية متكلّفة.
- source_word: οἴδατε ... οἴδατε
  choice: تعرفونني، وتعرفون
  rationale: يبقي التكرار البلاغي المقصود في العبارة اليونانية.
- source_word: πόθεν εἰμί
  choice: من أين أنا
  rationale: يحافظ على غموض المنشأ بين الأصل الظاهر والأصل الأعمق، من غير تفسير زائد.
- source_word: ἀπ’ ἐμαυτοῦ
  choice: من تلقاء نفسي
  rationale: تعبير عربي واضح يفيد أن مجيئه لم يكن بمبادرة مستقلة، مع إبقاء علاقة العبارة بمصدر الإرسال.
- source_word: οὐκ ἐλήλυθα
  choice: لم آتِ
  rationale: الصيغة العربية الطبيعية تؤدي معنى المجيء الذي ترتبط به رسالته الحاضرة، من غير تكلّف زمني.
- source_word: ἀληθινὸς
  choice: حقٌّ
  rationale: لفظ موجز ذو جرس يوحناوي، ويمكن أن يدل على الصدق وعلى الحقيقة أو الأصالة.
- source_word: ὁ πέμψας με
  choice: الذي أرسلني
  rationale: يحفظ الوصف العلاقي والشخصي من غير إضافة «الآب» التي لا ترد صراحة في هذه الجملة.
- source_word: ὃν ὑμεῖς οὐκ οἴδατε
  choice: وأنتم لا تعرفونه
  rationale: يحفظ الاتهام المباشر وتوكيد ضمير المخاطبين.
theological_decisions:
- issue: هل قول يسوع «أنتم تعرفونني، وتعرفون من أين أنا» تقرير مباشر أم يحمل سخرية أو تحديًا؟
  choice: أُبقي تقريرًا في المتن.
  alternative: صياغته سؤالًا إنكاريًا أو إضافة ما يصرّح بالسخرية.
  rationale: التركيب اليوناني خبري، أما النبرة الساخرة أو التحدّية فمحتملة من السياق؛ لذلك لا تُحسم في الترجمة.
- issue: مدلول أصل يسوع في «من أين أنا» و«لم آت من تلقاء نفسي»
  choice: أُبقيت العبارة واسعة الدلالة.
  alternative: قصرها على المنشأ الجغرافي أو التصريح بالأصل السماوي.
  rationale: يسمح سياق يوحنا بتراكب المعنيين، والنص هنا لا يصرّح بأحدهما على نحو يستبعد الآخر.
- issue: هوية «الذي أرسلني»
  choice: لم تُضف كلمة «الآب».
  alternative: «الآب الذي أرسلني».
  rationale: النص اليوناني يستخدم وصفًا موصوليًا ولا يسمّي الآب صراحة في هذه الآية، مع أن السياق يبيّن المرجع.
- issue: مدلول ἀληθινὸς في وصف المُرسِل
  choice: تُرجم «حقٌّ».
  alternative: «صادق» أو «حقيقي».
  rationale: «حق» يترك مجالًا لدلالتي الصدق والحقيقة أو الأصالة، ولا يحصر اللفظ في مجرد صدق القول.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «الهيكل» وفق الاستعمال الكتابي الشائع، و«نادى بصوت عالٍ» لتوضيح قوة الفعل من غير مبالغة. وُضعت علامات الحواشي عند المواضع التي تشرحها مباشرة.
