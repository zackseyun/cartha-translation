  text: ⸂ἐθαύμαζον οὖν⸃ οἱ Ἰουδαῖοι λέγοντες· Πῶς οὗτος γράμματα οἶδεν μὴ μεμαθηκώς;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/015.yaml
  text: So the Jews were marveling[a], saying[b], “How does this man know letters without having studied?”
translation:
  language: ar
  text: 'فكان اليهود[b] يتعجّبون قائلين: «كيف يعرف هذا الرجل الكتب[a]، مع أنه لم يتعلّم؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كيف لهذا الرجل مثل هذا العلم؟» والتعبير اليوناني حرفيًا: «يعرف الحروف/الكتابات».'
    reason: lexical_alternative
  - marker: b
    text: تشير عبارة «اليهود» هنا، بحسب السياق في إنجيل يوحنا، إلى محاوري يسوع أو معارضيه اليهود في أورشليم، ويُحتمل أن يكون من بينهم بعض أصحاب السلطة في اليهودية؛ ولا تعني الشعب اليهودي كله.
    reason: cultural_note
lexical_decisions:
- source_word: ἐθαύμαζον
  choice: كانوا يتعجّبون
  rationale: صيغة الماضي الناقص تدل على ردّ فعل مستمر في ذلك المشهد، وتركيب «كانوا يتعجّبون» يحفظ هذا الجانب دون المبالغة في معنى الدهشة.
- source_word: οὖν
  choice: فـ
  rationale: الفاء تربط ردّ فعلهم بما سبقه ربطًا سرديًا وسببيًا طبيعيًا في العربية.
- source_word: οἱ Ἰουδαῖοι
  choice: اليهود
  rationale: هذه هي المقابلة المعجمية المباشرة للتعبير اليوناني، مع إيضاح مرجعه السياقي في الحاشية بدل تضييقه تفسيريًا في المتن.
- source_word: λέγοντες
  choice: قائلين
  rationale: يحفظ صيغة اسم الفاعل التي تمهّد للكلام المباشر، وهو تعبير عربي فصيح وطبيعي.
- source_word: Πῶς
  choice: كيف
  rationale: ينقل أداة الاستفهام المباشرة بوضوح وإيجاز.
- source_word: οὗτος
  choice: هذا الرجل
  rationale: تعبير عربي طبيعي يحفظ مسافة الإشارة في الأصل من غير إضافة نبرة ازدراء غير لازمة.
- source_word: γράμματα
  choice: الكتب
  rationale: تشير الكلمة هنا إلى المعرفة بالكتابات والتعلّم، لا إلى مجرد القدرة على تهجئة الحروف. واختيار «الكتب» يحافظ على صورة الأصل الموجزة، بينما توضّح الحاشية المعنى الاصطلاحي المحتمل.
- source_word: οἶδεν
  choice: يعرف
  rationale: ينقل المعنى الحالي الثابت للفعل اليوناني بصياغة عربية مباشرة.
- source_word: μὴ μεμαθηκώς
  choice: مع أنه لم يتعلّم
  rationale: ينقل عدم تلقي التعليم المتوقع أو المعترف به، من غير تخصيص نوع المؤسسة التعليمية بما لا يصرّح به النص.
theological_decisions:
- issue: المرجع المقصود بعبارة οἱ Ἰουδαῖοι في إنجيل يوحنا
  choice: اليهود
  alternative: قادة اليهود؛ أهل اليهودية
  rationale: أُبقي المقابل المعجمي المباشر في المتن، لأن الأصل لا يصرّح هنا بلفظ «القادة». وتمنع الحاشية فهم العبارة كتعميم على الشعب اليهودي كله، مع الحفاظ على التوتر والسعة الدلالية في النص.
translation_notes:
  register: العربية فصحى معاصرة واضحة ومهيبة. استُخدم تركيب «فكان ... يتعجّبون» لإظهار الاستمرار في الماضي، ووُضعت علامتا الحاشية عند اللفظين اللذين تفسّرهما مباشرة.
