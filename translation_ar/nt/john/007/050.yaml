  text: 'قال لهم نيقوديموس، الذي جاء إليه من قبل، وكان واحدًا منهم:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: فقال
  rationale: المضارع التاريخي اليوناني يؤدي وظيفة سردية؛ وصيغة الماضي العربية أنسب في السرد، كما أن الفاء تصل الكلام بسياقه.
- source_word: Νικόδημος
  choice: نيقوديموس
  rationale: نقل الاسم بصيغته العربية الكتابية الشائعة.
- source_word: πρὸς αὐτούς
  choice: لهم
  rationale: تفيد πρός مع فعل القول جهة الخطاب؛ و«قال لهم» تعبير عربي طبيعي ودقيق.
- source_word: ὁ ἐλθὼν πρὸς αὐτὸν πρότερον
  choice: الذي كان قد جاء إليه من قبل
  rationale: نقلت العبارة الوصفية بوصفها صلة تحدد نيقوديموس، واستُعمل «كان قد جاء» لإظهار سبق المجيء على القول، مع إبقاء ضمير «إليه» كما في اليونانية.
- source_word: εἷς ὢν ἐξ αὐτῶν
  choice: وهو واحد منهم
  rationale: تحافظ الجملة الحالية على كون العبارة معلومة تعريفية مصاحبة من غير تحويلها إلى تعليل سببي.
theological_decisions:
- issue: مرجع الضمير αὐτόν في عبارة «جاء إليه»
  choice: الإبقاء على الضمير «إليه» في المتن، مع فهمه سياقيًا على أنه يسوع
  alternative: 'التصريح في المتن: «جاء إلى يسوع»'
  rationale: يشير سياق يوحنا 3:1–2 إلى يسوع، لكن النص اليوناني يستعمل ضميرًا؛ لذلك يحافظ المتن على صياغته ولا يستبدل المرجع الضمني باسم صريح.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حوفظ على البنية الاعتراضية التعريفية بترتيب طبيعي، وانتهت الآية بنقطتين لأنها تمهد للقول الوارد في الآية التالية.
