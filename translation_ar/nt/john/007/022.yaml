base_translation:
  language: en
  yaml_path: translation/nt/john/007/022.yaml
  text: For this reason Moses has given you circumcision—not that it is from Moses[a], but from the fathers—and on the Sabbath you circumcise a man.
translation:
  language: ar
  text: لهذا أعطاكم موسى الختان—لا لأن الختان من موسى[a]، بل من الآباء—وتختنون رجلًا في يوم السبت.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ويمكن أن تُترجم: «ليس أن الختان من موسى، بل من الآباء». وتوضح الجملة الاعتراضية أن الختان لم يبدأ مع موسى، بل يرجع إلى الآباء الأوّلين.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: لهذا
  rationale: أداة سببية تفسيرية تربط الكلام بتعليل يسوع، وتحافظ على الإيجاز وقوة الربط في اليونانية.
- source_word: Μωϋσῆς δέδωκεν ὑμῖν
  choice: أعطاكم موسى
  rationale: صياغة عربية طبيعية تنقل فعل العطاء بوصفه تشريعًا قائم الأثر؛ ولا يلزم في العربية إظهار صيغة التمام اليونانية بأداة مستقلة.
- source_word: τὴν περιτομήν
  choice: الختان
  rationale: المصطلح العربي المباشر للممارسة والعلامة العهدية المقصودة.
- source_word: οὐχ ὅτι ἐκ τοῦ Μωϋσέως ἐστὶν ἀλλ’ ἐκ τῶν πατέρων
  choice: لا لأنه من موسى، بل من الآباء
  rationale: تحافظ العبارة على الاعتراض التفسيري وعلى معنى المصدر أو الأصل في ἐκ، من غير توسيع المقصود داخل المتن.
- source_word: ἐν σαββάτῳ
  choice: في السبت
  rationale: تعبير عربي كتابي موجز عن الزمن، ويشير هنا إلى حكم السبت بوجه عام لا إلى سبت معيّن.
- source_word: περιτέμνετε ἄνθρωπον
  choice: تختنون رجلًا
  rationale: ينقل المضارع الدال على العادة، ويُظهر أن المقصود ذكر لأن الختان يقع على الذكور؛ و«رجلًا» طبيعية في العربية أكثر من «إنسانًا» في هذا السياق.
theological_decisions:
- issue: مرجع «الآباء» في الاعتراض التفسيري
  choice: الإبقاء على «الآباء» بما يفيد الآباء الأوّلين، ومنهم الآباء البطاركة، وأن الختان سابق لشريعة موسى.
  alternative: تفسيرها صراحةً بـ«الأجداد» أو «الآباء البطاركة».
  rationale: اللفظ اليوناني يحتمل الإشارة إلى أسلاف إسرائيل بوجه عام، مع كون السياق التاريخي يرجّح الآباء البطاركة. إبقاء «الآباء» يصون الصياغة الكتابية ولا يحسم مدى الإشارة أكثر مما يفعل النص.
- issue: العلاقة المنطقية في καὶ قبل ممارسة الختان في السبت
  choice: ومع ذلك تختنون رجلًا في السبت
  alternative: وتختنون رجلًا في السبت
  rationale: السياق يتضمن مفارقة حجاجية بين حفظ السبت وإجراء الختان فيه. «ومع ذلك» توضح هذه العلاقة الطبيعية، مع بقاء المعنى الأساسي للعطف؛ أما الترجمة الحرفية بـ«و» وحدها فممكنة.
translation_notes:
  register: لغة عربية فصحى معاصرة، واضحة ووقورة. استُخدم الشرطان الطويلان لإبراز الجملة الاعتراضية، وأُبقي مصطلحا «الختان» و«الآباء» بصيغتهما الكتابية المألوفة.
