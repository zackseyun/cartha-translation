reference: John 7:1
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Καὶ ⸂μετὰ ταῦτα περιεπάτει ὁ Ἰησοῦς⸃ ἐν τῇ Γαλιλαίᾳ, οὐ γὰρ ἤθελεν ἐν τῇ Ἰουδαίᾳ περιπατεῖν, ὅτι ἐζήτουν αὐτὸν οἱ Ἰουδαῖοι ἀποκτεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/001.yaml
  text: And after these things Jesus was walking in Galilee[a], for he did not want to walk in Judea, because the Jews were seeking to kill him.
translation:
  language: ar
  text: وبعد هذه الأمور، كان يسوع يتنقّل في الجليل، لأنه لم يكن يريد أن يتنقّل في اليهودية، إذ كان اليهود[a] يسعون إلى قتله.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أهل اليهودية»، أو: «قادة اليهود». كثيرًا ما تشير عبارة «اليهود» في إنجيل يوحنا، بحسب السياق، إلى السلطات اليهودية في اليهودية أو إلى المعارضين في أحداث الرواية، لا إلى الشعب اليهودي كله.'
    reason: بديل معجمي وتوضيح سياقي لتفادي التعميم العرقي مع الحفاظ على لفظ الأصل في المتن.
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: بعد هذه الأمور
  rationale: يحفظ صيغة الجمع في العبارة اليونانية ووظيفتها بوصفها انتقالًا زمنيًا يربط بالسياق السابق.
- source_word: περιεπάτει / περιπατεῖν
  choice: كان يتنقّل / أن يتنقّل
  rationale: ينقل دلالة الاستمرار في صيغة الماضي الناقص، ويحفظ تكرار الفعل في الموضعين، مع تجنّب «يمشي» التي قد توحي بالمشي على الأقدام فحسب بدل التجوال داخل الإقليم.
- source_word: ἐν τῇ Γαλιλαίᾳ
  choice: في الجليل
  rationale: ترجمة مكانية مباشرة وطبيعية لا توسّع مدى الحركة إلى «في أنحاء الجليل» دون ضرورة.
- source_word: οὐ γὰρ ἤθελεν
  choice: لأنه لم يكن يريد
  rationale: ينقل γάρ بوصفها تعليلًا لما سبق، ويحفظ معنى الإرادة دون أن يوحي بعدم القدرة.
- source_word: ἐν τῇ Ἰουδαίᾳ
  choice: في اليهودية
  rationale: الاسم الجغرافي المقصود هو إقليم اليهودية، وصيغته العربية المألوفة واضحة.
- source_word: ὅτι
  choice: إذ
  rationale: أداة تعليل طبيعية هنا، تبيّن سبب عدم إرادته التنقّل في اليهودية من غير إثقال العبارة بتكرار «لأن».
- source_word: ἐζήτουν
  choice: كانوا يسعون
  rationale: يحفظ الاستمرار في الماضي الناقص ومعنى القصد العدائي المستمر، ويترك المصدر التالي يحدّد غاية السعي.
- source_word: οἱ Ἰουδαῖοι
  choice: اليهود
  rationale: يحفظ اللفظ اليوناني في المتن، مع حاشية توضّح أن الاستعمال السردي هنا قد يقصد المعارضين اليهود في اليهودية، ولا سيما أصحاب السلطة، لا الشعب اليهودي كله.
- source_word: ἀποκτεῖναι
  choice: إلى قتله
  rationale: صياغة عربية مباشرة تنقل غاية السعي بوضوح.
theological_decisions:
- issue: مرجع عبارة οἱ Ἰουδαῖοι في إنجيل يوحنا
  choice: إبقاء «اليهود» في المتن مع حاشية سياقية مقيِّدة
  alternative: «قادة اليهود» أو «أهل اليهودية»
  rationale: يحفظ هذا الاختيار الصياغة المصدرية ولا يحسم في المتن ما يحتمل قدرًا من الاتساع، وفي الوقت نفسه يمنع فهم العبارة على أنها إدانة عرقية شاملة؛ فالسياق يشير إلى المعارضين في اليهودية، وبخاصة ذوي السلطة منهم.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُعمل «يتنقّل» بدل «يمشي» لنقل معنى التجوال الإقليمي مع الحفاظ على تكرار الفعل اليوناني، ووُضعت علامة الحاشية مباشرة بعد اللفظ الذي تشرحه.
