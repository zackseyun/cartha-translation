  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὁ ἀφ’ ἑαυτοῦ λαλῶν τὴν δόξαν τὴν ἰδίαν ζητεῖ· ὁ δὲ ζητῶν τὴν δόξαν τοῦ πέμψαντος αὐτὸν οὗτος ἀληθής ἐστιν καὶ ἀδικία ἐν αὐτῷ οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/018.yaml
  text: The one who speaks from himself seeks his own glory[a]; but the one who seeks the glory of the one who sent him, this one is true[c][b], and there is no unrighteousness in him.
translation:
  language: ar
  text: مَن يتكلَّم من عند نفسه يطلب مجده هو[a]؛ وأمّا مَن يطلب مجد مَن أرسله، فهو صادق[b]، وليس فيه ظلم[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «من تلقاء نفسه» أو «بسلطانه الخاص» بدلًا من «من عند نفسه».'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا: «أمين» بدلًا من «صادق».'
    reason: lexical_alternative
  - marker: c
    text: 'يمكن أيضًا: «إثم» أو «جور» بدلًا من «ظلم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφ’ ἑαυτοῦ
  choice: من عند نفسه
  rationale: يحافظ هذا التعبير على معنى المصدر الذاتي للكلام، وعلى المقابلة مع كون الشخص مُرسَلًا من آخر، من غير حصر المعنى في «من تلقاء نفسه» أو «بسلطانه الخاص».
- source_word: λαλῶν
  choice: يتكلَّم
  rationale: صياغة عربية طبيعية للمشاركة المضارعة المستعملة استعمال الاسم، وتفيد وصفًا عامًا مستمر الصلاحية.
- source_word: δόξαν τὴν ἰδίαν
  choice: مجده هو
  rationale: «المجد» يحفظ الرنين اليوحناوي والبعد المتعلق بالإكرام، وإضافة ضمير الفصل «هو» تُبرز المقابلة بين مجد المتكلم ومجد مُرسِله.
- source_word: ζητεῖ
  choice: يطلب
  rationale: يحفظ التكرار المقصود للفعل في شطري الآية، وهو المقابل المباشر الطبيعي لـ ζητέω.
- source_word: τοῦ πέμψαντος αὐτὸν
  choice: الذي أرسله
  rationale: ينقل اسم الفاعل المعرّف بعبارة موصولة عربية واضحة، ويحفظ الوكالة الشخصية في الإرسال.
- source_word: οὗτος
  choice: فهو
  rationale: الفاء والضمير يعبّران طبيعيًا في العربية عن النتيجة والإشارة المؤكدة إلى الشخص المذكور، من غير ثقل عبارة «فهذا هو».
- source_word: ἀληθής
  choice: صادق
  rationale: في وصف شخص يتكلم ويطلب مجد مُرسِله، «صادق» عربية طبيعية تحتمل صدق القول وأمانة الشخص، مع الإشارة في الحاشية إلى إمكان «حق».
- source_word: ἀδικία
  choice: ظلم
  rationale: «ظلم» المقابل العربي الواسع والطبيعي لـ ἀδικία، ويمكن أن يشمل الجور والباطل الأخلاقي؛ وتوضح الحاشية إمكان «إثم» أو «عدم بر».
- source_word: ἐν αὐτῷ οὐκ ἔστιν
  choice: ليس فيه
  rationale: يحفظ التركيب الدال على انتفاء الصفة عنه بصياغة عربية موجزة وطبيعية.
theological_decisions:
- issue: المقابلة بين الكلام من عند النفس وطلب مجد المُرسِل
  choice: إبقاء المقابلة بين مصدر الكلام الذاتي وغايته المتمثلة في تمجيد الذات، وبين طلب مجد المُرسِل.
  alternative: تفسير «من عند نفسه» تفسيرًا تقنيًا محصورًا في «بسلطانه الخاص»، أو قصر المقابلة صراحةً على يسوع والمعلمين الكذبة.
  rationale: السياق يتناول مصدر التعليم وغايته. تحافظ الصياغة على لغة النص المتعلقة بالإرسال والمجد من غير إدخال تصنيف عقائدي يتجاوز العبارة اليونانية.
- issue: دلالة ἀληθής
  choice: صادق
  alternative: حق أو أمين
  rationale: اللفظة قد تدل هنا على صدق الشخص أو موثوقيته وأصالته. «صادق» أنسب وصفًا للمتكلم في العربية، مع إبقاء البديل الأوسع في الحاشية.
- issue: دلالة ἀδικία
  choice: ظلم
  alternative: إثم أو عدم بر أو جور
  rationale: يحفظ «ظلم» النطاق الأخلاقي للفظة ولا يقصرها على مخالفة قانونية أو فعل منفرد، بينما تعرض الحاشية بدائل ممكنة دون حسم زائد.
translation_notes:
  register: العربية فصحى حديثة واضحة وموقرة. استُعملت «من عند نفسه» للحفاظ على غموض العلاقة بين المصدر والسلطان، و«مجده هو» لإبراز المقابلة، مع تجنب التراكيب الحرفية الثقيلة. جميع علامات الحواشي مثبتة في مواضعها في المتن.
