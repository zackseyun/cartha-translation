  text: Μὴ ὁ νόμος ἡμῶν κρίνει τὸν ἄνθρωπον ἐὰν μὴ ἀκούσῃ ⸂πρῶτον παρ’ αὐτοῦ⸃ καὶ γνῷ τί ποιεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/051.yaml
  text: Our law does not judge a man unless it first hears from him and knows what he is doing[b][a], does it?
translation:
  language: ar
  text: «ألا تحكم شريعتنا على إنسان ما لم تسمع منه أولًا وتعرف ما يفعل؟»
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ
  choice: أَ...؟
  rationale: تصدّرت μή سؤالًا يتوقع جوابًا بالنفي؛ وتؤدي همزة الاستفهام مع صياغة السؤال هذا الأثر البلاغي طبيعيًا في العربية.
- source_word: ὁ νόμος ἡμῶν
  choice: شريعتنا
  rationale: يحيل التعبير إلى الشريعة أو المعيار القانوني الذي يحتج به نيقوديموس، و«شريعتنا» موجزة وطبيعية ولا تحصر المرجع صراحة في أسفار موسى وحدها.
- source_word: κρίνει
  choice: تحكم على
  rationale: يحافظ هذا التعبير على المعنى القضائي العام من غير أن يحمّله معنى «تدين» أو «تحكم بالإدانة»، وهو أقوى مما يقتضيه السياق.
- source_word: τὸν ἄνθρωπον
  choice: إنسان
  rationale: الاسم مفرد ذو دلالة عامة؛ و«إنسان» يحفظ المفرد التمثيلي في عربية طبيعية من غير أن يوهم الإشارة إلى شخص محدد.
- source_word: ἐὰν μὴ
  choice: قبل أن
  rationale: في هذا السياق الإجرائي، تنقل «قبل أن» الشرط السلبي مع ارتباطه بـ«أولًا»، وتوضح أن السماع والمعرفة يسبقان الحكم.
- source_word: ἀκούσῃ πρῶτον παρ’ αὐτοῦ
  choice: تسمع منه أولًا
  rationale: تنقل παρά مع المضاف إليه معنى تلقي القول أو الشهادة من الشخص نفسه، وتحفظ πρῶτον ترتيب الإجراء.
- source_word: γνῷ
  choice: تعرف
  rationale: تفيد هنا التوصل إلى معرفة وقائع القضية، و«تعرف» مباشرة ومناسبة للسياق القضائي.
- source_word: τί ποιεῖ
  choice: ما يفعل
  rationale: تحفظ المضارع اليوناني من غير تحويله إلى فعل ماضٍ مكتمل، وتبقى طبيعية في العربية.
theological_decisions: []
