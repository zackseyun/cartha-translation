  register: صياغة عربية فصحى حديثة، واضحة ووقورة. استُخدم التأنيث في «تحكم/تسمع/تعرف» لمطابقة «شريعتنا»، وحُفظ السؤال البلاغي المتوقع جوابه بالنفي من غير إضافة تفسير مذهبي.
