  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ ἴδε παρρησίᾳ λαλεῖ καὶ οὐδὲν αὐτῷ λέγουσιν· μήποτε ἀληθῶς ἔγνωσαν οἱ ἄρχοντες ὅτι οὗτός ⸀ἐστιν ὁ χριστός;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/026.yaml
  text: And look[a], he is speaking openly, and they say nothing to him. Can it be that the rulers truly know that this is the Messiah?
translation:
  language: ar
  text: وها هو يتكلّم علانية، ولا يقولون له شيئًا. أفيكون الرؤساء قد عرفوا حقًّا أن هذا هو المسيح؟
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἴδε
  choice: وها هو
  rationale: تؤدي وظيفة لفت الانتباه في العربية المعاصرة الفصيحة، وتنسجم طبيعيًا مع الفعل الجاري بعدها.
- source_word: παρρησίᾳ
  choice: علانية
  rationale: تنقل معنى الكلام الجهري العلني غير المستتر في سياق التعليم أمام الناس، من غير حصر المعنى في الجرأة.
- source_word: λαλεῖ
  choice: يتكلّم
  rationale: المضارع العربي يصوّر الحدث الجاري الذي يشاهده المتكلمون.
- source_word: οὐδὲν αὐτῷ λέγουσιν
  choice: لا يقولون له شيئًا
  rationale: ترجمة مباشرة تحفظ دلالة αὐτῷ بوصفها «له»، ولا تضيف معنى «ضده» غير المصرح به.
- source_word: μήποτε
  choice: أفيكون
  rationale: صيغة استفهامية تعبّر عن الاستنتاج المتردد والمستغرب، مع إبقاء السؤال مفتوحًا بدل تحويله إلى نفي جازم.
- source_word: ἀληθῶς
  choice: حقًّا
  rationale: مقابل عربي طبيعي يحفظ قوة التوكيد في الظرف.
- source_word: ἔγνωσαν
  choice: قد عرفوا
  rationale: تحفظ صيغة الماضي اليونانية وإيحاء الوصول إلى معرفة أو إدراك، مع «قد» الملائمة للسؤال عن تحقق الأمر.
- source_word: οἱ ἄρχοντες
  choice: الرؤساء
  rationale: تعبير كتابي عربي واضح عن أصحاب السلطة والقيادة في هذا السياق، من دون توسيع المرجع إلى جميع السلطات.
- source_word: ὅτι οὗτός ἐστιν ὁ χριστός
  choice: أن هذا هو المسيح
  rationale: «المسيح» هو المقابل العربي الراسخ للقب اليوناني χριστός ويحفظ كونه لقبًا مسيانيًا في سؤال الجموع.
theological_decisions:
- issue: ترجمة ὁ χριστός بوصفه لقبًا
  choice: المسيح
  alternative: المسيّا
  rationale: «المسيح» في العربية هو اللقب الموروث والمفهوم مباشرة، ويؤدي معنى الممسوح المنتظر في السياق، من غير معاملته كاسم شخصي محض.
- issue: قوة السؤال الذي يبدأ بـ μήποτε
  choice: أفيكون الرؤساء قد عرفوا حقًّا...؟
  alternative: ألعلّ الرؤساء عرفوا حقًّا...؟
  rationale: الصياغة المختارة تحفظ التردد والدهشة ولا تحسم إن كان السؤال يتوقع النفي، وبذلك تصون التوتر القائم في الأصل.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعملت «وها هو» للفت الانتباه على نحو طبيعي، و«علانية» لإبراز الطابع العلني للكلام، مع تجنب ألفاظ قديمة مثل «هوذا» وتجنب إضافة تفسير غير منصوص عليه.
