    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: فأجاب
  rationale: فعل السرد الحواري الطبيعي في العربية، وصيغة الجمع مفهومة من الفاعل «الفريسيون».
- source_word: οὖν
  choice: فـ
  rationale: تنقل الصلة الاستنتاجية أو التعقيبية بالسياق في أسلوب عربي طبيعي من غير إثقال الحوار بـ«لذلك».
- source_word: αὐτοῖς
  choice: هم في «فأجابهم»
  rationale: أُدمج ضمير المفعول في الفعل على نحو عربي فصيح وطبيعي.
- source_word: οἱ Φαρισαῖοι
  choice: الفريسيون
  rationale: التسمية العربية المعيارية لهذه الجماعة اليهودية، مع التعريف.
- source_word: Μὴ καὶ ὑμεῖς
  choice: أفـ... أنتم أيضًا
  rationale: الاستفهام ينقل النبرة الإنكارية التي تتوقع جوابًا بالنفي، ويُبرز «أنتم» مع معنى «أيضًا».
- source_word: πεπλάνησθε
  choice: قد ضُلِّلتم
  rationale: يحافظ على دلالة الوقوع تحت التضليل وعلى أثر صيغة التام، من غير حصر المعنى في الخداع المتعمد وحده.
theological_decisions:
- issue: القوة البلاغية للسؤال المصدَّر بـ μή
  choice: 'صياغته سؤالًا إنكاريًا: «أفقد...؟» من غير إضافة «بالتأكيد» أو نحوها'
  alternative: «أفما خُدعتم أنتم أيضًا؟» أو «أحقًا ضللتم أنتم أيضًا؟»
  rationale: تفيد μή توقُّع جواب بالنفي، وتؤدي صيغة الاستفهام العربية هذا التوقع مع إبقاء لهجة الفريسيين الازدرائية من غير شرح زائد.
- issue: دلالة πεπλάνησθε بين التضليل والخداع
  choice: «ضُلِّلتم» في المتن
  alternative: «خُدعتم»
  rationale: «ضُلِّلتم» أوسع وتحفظ معنى الانقياد إلى الخطأ، بينما قد توحي «خُدعتم» بتركيز أضيق على الخداع.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموجزة، بنبرة حوارية مهيبة. أُبقي ضمير «أنتم» ظاهرًا لإفادة التوكيد المقابل في اليونانية.
