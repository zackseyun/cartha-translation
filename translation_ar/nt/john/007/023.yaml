base_translation:
  language: en
  yaml_path: translation/nt/john/007/023.yaml
  text: If a man receives circumcision on the Sabbath so that the law of Moses may not be broken[c][b][a], are you angry with me because I made a whole man well on the Sabbath?
translation:
  language: ar
  text: إذا كان الرجل يُختَن يوم السبت[a] لكي لا تُنقَض شريعة موسى[b]، أفتغضبون مني لأني جعلت إنسانًا بكامله معافًى يوم السبت؟[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «يتلقى الختان». ويمكن ترجمتها أيضًا: «يخضع للختان».'
    reason: lexical_alternative
  - marker: b
    text: يمكن أيضًا ترجمة «لا تُنقَض» بـ«لا تُبطَل» أو «لا تُخالَف».
    reason: lexical_alternative
  - marker: c
    text: تُبرز عبارة «إنسانًا بكامله معافًى» المقابلة بين ختان جزء من الجسد وإعادة الإنسان كله إلى العافية.
    reason: rhetorical_clarification
lexical_decisions:
- source_word: περιτομὴν λαμβάνει
  choice: يقبل الختان
  rationale: يحافظ على الصورة اليونانية «يأخذ/يقبل ختانًا» بصياغة عربية مفهومة، بدل تحويلها مباشرة إلى المبني للمجهول.
- source_word: ἄνθρωπος
  choice: الرجل
  rationale: السياق يخص ذكرًا تحديدًا لأن الكلام عن الختان، لذا فـ«الرجل» أدق من لفظ عام مثل «الإنسان» في الجملة الأولى.
- source_word: ἐν σαββάτῳ
  choice: في السبت
  rationale: تعبير عربي طبيعي للدلالة الزمنية، ويشير هنا إلى يوم السبت وشعيرته المعروفة.
- source_word: ἵνα μὴ λυθῇ ὁ νόμος Μωϋσέως
  choice: لكي لا تُنقَض شريعة موسى
  rationale: الفعل λύω في السياق القانوني يحتمل النقض أو الإبطال أو المخالفة؛ و«تُنقَض» تحافظ على مجاله الدلالي من غير حصره في مجرد العصيان.
- source_word: χολᾶτε
  choice: أتغضبون مني
  rationale: ينقل الغضب أو السخط بصياغة مباشرة طبيعية من غير مبالغة في شدته.
- source_word: ὅλον ἄνθρωπον
  choice: إنسانًا كاملًا
  rationale: يحفظ التشديد على الإنسان كله في مقابل إجراء الختان في جزء من الجسد، مع تجنب إيحاء أن «كامل» وصف للكمال الأخلاقي.
- source_word: ὑγιῆ ἐποίησα
  choice: جعلت ... معافًى
  rationale: يحافظ على تركيب «جعلتُه صحيحًا/معافًى» وعلى المقابلة البلاغية، بدل اختزاله إلى «شفيت».
theological_decisions:
- issue: مغزى المقارنة بين الختان والشفاء في السبت
  choice: يعتمد يسوع على قبول إجراء الختان في السبت صونًا لشريعة موسى، ثم يحتج بالأولى على مشروعية إعادة إنسان كامل إلى العافية في السبت.
  alternative: قد تُفهم العبارة بوصفها مقابلة عامة بين الشعيرة الدينية وفعل الرحمة.
  rationale: بنية الآية نفسها تربط الختان بعدم نقض شريعة موسى، ثم تقابل معالجة جزء من الجسد بجعل الإنسان كله معافًى؛ فحُفظ هذا الاستدلال من غير إدخال موقف مذهبي لاحق من الشريعة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُخدم الاستفهام الإنكاري «أفتغضبون» للمحافظة على قوة السؤال، وحُفظت المقابلة اللفظية بين الختان وعافية الإنسان كله.
