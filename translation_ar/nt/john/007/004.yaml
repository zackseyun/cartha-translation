  yaml_path: translation/nt/john/007/004.yaml
  text: For no one does anything in secret while seeking to be in public view. If you do these things, show yourself to the world.
translation:
  language: ar
  text: فما من أحد يعمل شيئًا في الخفاء، وهو نفسه يسعى إلى أن يكون في العلن[a]. إن كنت تفعل هذه الأمور، فأظهر نفسك للعالم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أن يكون معروفًا علنًا». يشدد التعبير اليوناني على العلنية والظهور أمام الناس.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς γάρ
  choice: فما من أحد
  rationale: يحفظ معنى النفي العام والقوة التفسيرية التي تؤديها γάρ، بصياغة عربية طبيعية تصل الكلام بما قبله.
- source_word: τι ἐν κρυπτῷ ποιεῖ
  choice: يعمل شيئًا في الخفاء
  rationale: ينقل المفعول غير المحدد τι، ويحافظ على معنى العمل في السر أو بعيدًا عن الأنظار.
- source_word: καὶ ζητεῖ αὐτὸς
  choice: وهو نفسه يسعى
  rationale: يحافظ على معنى السعي المقصود وعلى توكيد الفاعل الذي تؤديه αὐτός.
- source_word: ἐν παρρησίᾳ εἶναι
  choice: أن يكون في العلن[a]
  rationale: ينقل معنى الظهور والانكشاف أمام الناس في هذا السياق، من غير حصر اللفظ في معنى الجرأة في الكلام.
- source_word: εἰ ταῦτα ποιεῖς
  choice: إن كنت تعمل هذه الأمور
  rationale: صياغة عربية طبيعية للشرط الحاضر، وتبقي الإشارة إلى الأعمال المذكورة في السياق.
- source_word: φανέρωσον σεαυτὸν
  choice: فأظهر نفسك
  rationale: ينقل الأمر المباشر بالإظهار العلني ويحافظ على الضمير الانعكاسي.
- source_word: τῷ κόσμῳ
  choice: للعالم
  rationale: يحافظ على لفظ يوحنا المميز κόσμος وعلى صداه الأدبي، مع ملاءمته لمعنى الجمهور الأوسع في السياق.
theological_decisions:
- issue: دلالة κόσμος في سياق إنجيل يوحنا
  choice: العالم
  alternative: الناس / الجمهور
  rationale: يدل السياق المباشر على الظهور أمام الناس، لكن «العالم» يحفظ اللفظ اليوحناوي وتردده الأدبي واللاهوتي من غير أن يفرض عليه تفسيرًا زائدًا.
- issue: دلالة ἐν παρρησίᾳ εἶναι
  choice: أن يكون في العلن
  alternative: أن يكون معروفًا علنًا
  rationale: العبارة هنا تتعلق بالظهور العام لا بحرية الكلام؛ والصياغة المختارة تحافظ على شيء من سعة التعبير اليوناني، بينما يوضح البديل احتمال معنى الاشتهار العلني.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. استُخدمت «فما من أحد» لربط التعليل بما قبله، وأُبقي توكيد αὐτός في «هو نفسه»، مع الحفاظ على المصطلح اليوحناوي «العالم».
