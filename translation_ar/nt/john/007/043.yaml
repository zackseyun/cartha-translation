  yaml_path: translation/nt/john/007/043.yaml
  text: So there was a division in the crowd because of him.
translation:
  language: ar
  text: فحدث انقسام في الجمع بسببه.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σχίσμα
  choice: انقسام
  rationale: يدل الاسم على انقسام جماعة إلى مواقف متعارضة، و«انقسام» تعبير عربي واضح وطبيعي يحفظ معنى التصدع بين الناس.
- source_word: οὖν
  choice: فـ
  rationale: تفيد الأداة النتيجة المترتبة على النقاش السابق، والفاء تربط الجملة بسياقها ربطًا طبيعيًا من غير مبالغة في القوة المنطقية.
- source_word: ἐγένετο
  choice: حدث
  rationale: يعبّر الفعل هنا عن نشوء الانقسام أو وقوعه، و«حدث» صياغة عربية موجزة وطبيعية.
- source_word: ἐν τῷ ὄχλῳ
  choice: في الجمع
  rationale: يشير ὄχλος إلى جمهور الناس المجتمعين في السياق، و«الجمع» لفظ واضح وفصيح يحافظ على الدلالة الجماعية.
- source_word: δι’ αὐτόν
  choice: بسببه
  rationale: تفيد διά مع حالة النصب السببية هنا، و«بسببه» تنقل السبب مباشرة مع إبقاء الإحالة الضميرية إلى يسوع كما في الأصل.
theological_decisions:
- issue: مرجع الضمير αὐτόν
  choice: الضمير في «بسببه»، ومرجعه يسوع في السياق
  alternative: 'التصريح: «بسبب يسوع»'
  rationale: يحيل الضمير في السياق إلى يسوع، لكن إبقاء الضمير يصون صيغة الأصل ولا يضيف توضيحًا غير لازم.
translation_notes:
  register: عربية فصحى حديثة، موجزة وكريمة النبرة. استُخدمت الفاء لبيان النتيجة، وحُفظ الضمير من غير استبداله باسم صريح.
