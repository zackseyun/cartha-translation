  text: ἄλλοι ἔλεγον· Οὗτός ἐστιν ὁ χριστός· ⸂οἱ δὲ⸃ ἔλεγον· Μὴ γὰρ ἐκ τῆς Γαλιλαίας ὁ χριστὸς ἔρχεται;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/041.yaml
  text: Others were saying[a], “This is the Messiah.” But some were saying, “Surely the Messiah does not come from Galilee[b], does he?”
translation:
  language: ar
  text: 'وكان آخرون يقولون: «هذا هو المسيح[a]». لكنّ آخرين كانوا يقولون: «أَمِنَ الجليل يأتي المسيح؟[b]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: الممسوح المنتظر.'
    reason: يوضح المعنى اللقبي والاشتقاقي لكلمة «المسيح».
  - marker: b
    text: 'السؤال استنكاري، ويتوقع المتكلمون جوابًا بالنفي: «لا، لا يأتي المسيح من الجليل».'
    reason: يوضح قوة أداة الاستفهام اليونانية التي تتوقع جوابًا بالنفي من غير إلغاء صيغة السؤال في المتن.
lexical_decisions:
- source_word: ἄλλοι
  choice: آخرون
  rationale: صفة اسمية جمع تشير إلى جماعة أخرى من بين الحشد، وتحافظ على المقابلة بين الآراء.
- source_word: ἔλεγον
  choice: كانوا يقولون
  rationale: صيغة الماضي الناقص تدل على قول مستمر أو متكرر في أثناء النقاش.
- source_word: Οὗτός ἐστιν
  choice: هذا هو
  rationale: صياغة عربية طبيعية للتعيين المباشر، مع ضمير الفصل الملائم للخبر المعرّف.
- source_word: ὁ χριστός
  choice: المسيح
  rationale: هنا لقب للشخص الممسوح المنتظر، و«المسيح» هو المقابل العربي المألوف والدقيق.
- source_word: οἱ δὲ
  choice: لكنّ آخرين
  rationale: تُبرز δέ الانتقال إلى جماعة مخالفة، ويُفهم «آخرين» من أداة التعريف الجمعية المستعملة استعمالًا اسميًا.
- source_word: Μὴ γὰρ
  choice: أَمِنَ ...؟
  rationale: استفهام إنكاري يتوقع جوابًا بالنفي؛ وتؤدي الصياغة العربية معنى الاستبعاد من غير أن تحوّله إلى تقرير صريح.
- source_word: ἐκ τῆς Γαλιλαίας
  choice: مِنَ الجليل
  rationale: تفيد ἐκ منشأ الشخص أو مصدر مجيئه، ويقابلها طبيعيًا حرف الجر «مِن».
- source_word: ἔρχεται
  choice: يأتي
  rationale: المضارع هنا يعبّر عن التوقع العام المتعلق بمنشأ المسيح وظهوره.
theological_decisions:
- issue: دلالة Χριστός بوصفه لقبًا
  choice: المسيح
  alternative: الممسوح
  rationale: الكلمة لقب للشخص المنتظر موضع الخلاف بين الجموع. «المسيح» هو اللفظ العربي الكتابي الحي، بينما يوضح «الممسوح» معناها الاشتقاقي لكنه أقل طبيعية كلقب في هذا السياق.
- issue: قوة السؤال المنفي Μὴ γὰρ
  choice: 'استفهام إنكاري: «أَمِنَ الجليل يأتي المسيح؟»'
  alternative: «إنّ المسيح لا يأتي من الجليل، أليس كذلك؟»
  rationale: تحافظ الصياغة المختارة على كون العبارة سؤالًا يتوقع النفي، من غير إضافة تقرير ثم سؤال ذيلي غير موجودين بهذه الصورة في اليونانية.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة. استُخدمت «كانوا يقولون» لنقل دلالة الماضي الناقص، وحوفظ على التباين بين جماعتين بعبارة «آخرون ... لكنّ آخرين». وُضع كل من علامتي الحاشية [a] و[b] في المتن.
