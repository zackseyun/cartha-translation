base_translation:
  language: en
  yaml_path: translation/nt/john/007/039.yaml
  text: He said this about the Spirit[a], whom those who believed in him were about to receive; for the Spirit was not yet[b], because Jesus had not yet been glorified.
translation:
  language: ar
  text: قال هذا عن الروح[a] الذي كان الذين آمنوا به مزمعين أن يتلقّوه؛ لأن الروح لم يكن بعد[b]، إذ لم يكن يسوع قد مُجِّد بعد.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: المقصود روح الله؛ ولا ترد كلمة «القدس» في النص اليوناني هنا.
    reason: lexical_clarification
  - marker: b
    text: 'أو، على سبيل التوضيح: «لأن الروح لم يكن قد أُعطي بعد». واليونانية تقول حرفيًا: «لأن الروح لم يكن بعد»، وتربط ذلك بأن يسوع لم يكن قد مُجِّد بعد.'
    reason: alternative_reading
lexical_decisions:
- source_word: πνεύματος / πνεῦμα
  choice: الروح
  rationale: السياق يدل على روح الله الذي سيقبله المؤمنون. لم تُضف صفة «القدس» لأنها غير واردة في النص اليوناني.
- source_word: οὗ
  choice: الذي
  rationale: اسم الموصول يعود إلى «الروح»، وصيغة العاقل ملائمة هنا للمرجع الإلهي.
- source_word: ἔμελλον λαμβάνειν
  choice: كانوا مزمعين أن يقبلوه
  rationale: تحفظ هذه الصياغة الدلالة الاستقبالية للفعل μέλλω مع المصدر، وتأتي عربية فصيحة مفهومة.
- source_word: πιστεύσαντες εἰς αὐτόν
  choice: المؤمنون به
  rationale: تنقل الاصطلاح اليوحناوي πιστεύω εἰς بصورة طبيعية، من غير فرض دلالة زمنية زائدة على اسم الفاعل الأوريستي.
- source_word: οὔπω γὰρ ἦν πνεῦμα
  choice: لأن الروح لم يكن قد أُعطي بعد
  rationale: هذه صياغة تفسيرية عربية طبيعية للعبارة اليونانية المقتضبة، مع إثبات القراءة الحرفية التي تحفظ توتر الأصل في الحاشية.
- source_word: ἐδοξάσθη
  choice: مُجِّد
  rationale: يحفظ المصطلح اليوحناوي المتكرر ولا يضيّق معناه إلى الرفع وحده.
theological_decisions:
- issue: كيفية نقل οὔπω γὰρ ἦν πνεῦμα من غير الإيحاء بأن الروح لم يكن موجودًا وجودًا ذاتيًا.
  choice: «لأن الروح لم يكن قد أُعطي بعد» في المتن، مع بيان حرفية اليونانية في الحاشية.
  alternative: «لأن الروح لم يكن بعد»
  rationale: العبارة الحرفية شديدة الالتباس في العربية وقد تُفهم وجوديًا؛ لذا يوضح المتن المعنى السياقي، بينما تحفظ الحاشية صيغة الأصل المقتضبة وصلتها بعدم تمجيد يسوع.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «مزمعين» للمستقبل المنظور من زمن السرد، و«يقبلوه» بوصفها صياغة كتابية مفهومة للتلقي. وُضعت علامتا الحاشية [a] و[b] في المتن.
