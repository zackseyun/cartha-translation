base_translation:
  language: en
  yaml_path: translation/nt/john/007/037.yaml
  text: On the last day[a], the great day of the feast, Jesus stood and cried out, saying, “If anyone is thirsty, let him come to me and drink.”
translation:
  language: ar
  text: 'وفي اليوم الأخير من العيد، ذلك اليوم العظيم، وقف يسوع ونادى بصوت عالٍ قائلًا: «إن عطش أحد، فليأتِ إليَّ وليشرب».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν δὲ
  choice: وفي
  rationale: تفيد Ἐν مع المجرور الظرفية الزمنية، بينما δέ أداة ربط خفيفة؛ وتنقل الواو سير الكلام طبيعيًّا من غير إقحام معنى تقابلي قوي.
- source_word: τῇ ἐσχάτῃ ἡμέρᾳ τῇ μεγάλῃ τῆς ἑορτῆς
  choice: اليوم الأخير من العيد، ذلك اليوم العظيم
  rationale: يحافظ التعبير على كون اليوم هو الأخير وعلى وصفه صراحةً بالعظيم، مع ترتيب عربي واضح يمنع أن تُفهم صفة «العظيم» على أنها وصف للعيد نفسه.
- source_word: εἱστήκει
  choice: وقف
  rationale: تنقل هيئة الوقوف في سرد عربي موجز وطبيعي، من غير إضافة معنى مثل اتخاذ موقف رسمي لا يوجبه اللفظ.
- source_word: ἔκραξεν λέγων
  choice: نادى بصوت عالٍ قائلًا
  rationale: يُظهر «بصوت عالٍ» قوة κράζω بوصفه نداءً مسموعًا علنيًّا، ويحفظ «قائلًا» وظيفة اسم الفاعل الذي يقدم مضمون النداء.
- source_word: Ἐάν τις διψᾷ
  choice: إن عطش أحد
  rationale: «أحد» نكرة عامة تقابل τις، والفعل «عطش» يحفظ صورة العطش من دون تفسيرها داخل النص.
- source_word: ἐρχέσθω πρός με καὶ πινέτω
  choice: فليأتِ إليَّ وليشرب
  rationale: لام الأمر مناسبة لصيغتي الأمر الغائبتين، وتُبقي الدعوة بصيغتها المفردة العامة وتحفظ توازي الفعلين.
theological_decisions:
- issue: الدلالة المجازية للعطش والشرب
  choice: إبقاء الصورتين بلفظي «عطش» و«يشرب» من دون شرح
  alternative: تفسيرهما في المتن بالإيمان أو قبول الروح أو نوال الحياة
  rationale: لا يشرح العدد نفسه الصورة صراحةً؛ وإبقاؤها يحفظ انفتاح العبارة وصلتها بما يلي من السياق من غير حسم تفسيري زائد.
- issue: عموم τις وصيغة الأمر المفرد
  choice: «أحد، فليأتِ... وليشرب»
  alternative: صياغة جمع مثل «فليأتوا... وليشربوا»
  rationale: الصياغة العربية المختارة عامة بطبيعتها، وفي الوقت نفسه تحافظ على الإفراد النحوي في الأصل اليوناني من غير تخصيص الدعوة بالذكور.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعملت جملة مباشرة تصلح للقراءة العامة، مع إبقاء صورة العطش والشرب وقوة النداء، وتجنب الألفاظ المذهبية أو الشروح المدخلة في المتن.
