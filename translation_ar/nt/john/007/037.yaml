  source_fidelity: 'النص العربي ينقل عناصر اليونانية الأساسية بأمانة: الظرف الزمني مع رابط سردي خفيف، واليوم الأخير الموصوف بأنه العظيم من العيد، ووقوف يسوع، والنداء العلني القوي، ثم الدعوة الشرطية العامة إلى المجيء والشرب. وصيغة «إن عطش أحد» تحافظ على صورة العطش من غير تفسير زائد، و«فليأتِ إليَّ وليشرب» تنقل صيغتي الأمر بوضوح.'
