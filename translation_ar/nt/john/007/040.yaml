  text: Therefore[a], some from the crowd, when they heard these words, were saying, “This truly is the Prophet.”
translation:
  language: ar
  text: 'فبعضٌ من الجمع، لما سمعوا هذه الأقوال، أخذوا يقولون: «هذا هو حقًّا النبيّ[a]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يُرجَّح أن عبارة «النبيّ» تشير إلى النبي الذي كان يُنتظر أن يكون مثل موسى (انظر التثنية 18:15)، مع أن بعض المفسرين يفهمونها بمعنى أعم: «النبيّ».'
    reason: cross_reference
lexical_decisions:
- source_word: Ἐκ τοῦ ὄχλου
  choice: بعضٌ من الجمع
  rationale: 'تُظهر العبارة معنى التبعيض: المتكلمون فريق من الجمع لا الجمع كله، وصياغة «بعض من الجمع» واضحة وطبيعية.'
- source_word: οὖν
  choice: فـ
  rationale: الفاء تصل رد فعل بعض الجمع بالسياق السابق اتصالًا طبيعيًا، وتحفظ معنى التطور أو النتيجة الذي تؤديه οὖν دون إثقال العبارة.
- source_word: ἀκούσαντες
  choice: لما سمعوا
  rationale: تعبر «لما سمعوا» تعبيرًا عربيًا طبيعيًا عن الفعل السابق للفعل الرئيس.
- source_word: τῶν λόγων τούτων
  choice: هذه الأقوال
  rationale: تشير إلى الكلام السابق مباشرة، و«الأقوال» تلائم λόγοι في سياق كلام يسوع.
- source_word: ἔλεγον
  choice: أخذوا يقولون
  rationale: تحفظ الصياغة الجانب الاستمراري للفعل الناقص، بدل عرضه قولًا لحظيًا واحدًا.
- source_word: Οὗτός ἐστιν
  choice: هذا هو
  rationale: تحفظ الإشارة المباشرة الواضحة إلى يسوع بصياغة عربية مألوفة.
- source_word: ἀληθῶς
  choice: حقًّا
  rationale: تنقل توكيد صدق الحكم بنبرة فصيحة ومفهومة.
- source_word: ὁ προφήτης
  choice: النبيّ المنتظَر
  rationale: «المنتظَر» توضح القوة اللقبية لأداة التعريف في هذا السياق، مع إبقاء هوية الشخصية غير محسومة في المتن وشرح الاحتمال في الحاشية.
theological_decisions:
- issue: المقصود بعبارة ὁ προφήτης
  choice: النبيّ المنتظَر
  alternative: النبيّ؛ أو اعتبار اللقب مرادفًا صريحًا للمسيح
  rationale: يرجح السياق الإشارة إلى شخصية نبوية منتظرة، ربما النبي الذي مثل موسى، لكن الآية لا تصرح بأنه المسيح؛ لذلك تحافظ الترجمة على التوتر ولا تدمج اللقبين.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت الفاء للربط السياقي، و«أخذوا يقولون» لإبراز الاستمرار، مع تجنب تقرير هوية «النبي» بما يتجاوز نص الآية.
