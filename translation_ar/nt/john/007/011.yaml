  yaml_path: translation/nt/john/007/011.yaml
  text: So the Jews were looking for him at the feast and were saying[a], “Where is that one?”
translation:
  language: ar
  text: 'فكان اليهود[a] يبحثون عنه في العيد، ويقولون: «أين ذاك؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أهل اليهودية»؛ وربما يُراد في سياق رواية يوحنا، على نحو أخص، السلطات اليهودية في منطقة اليهودية.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: فـ
  rationale: تفيد استمرار السرد والنتيجة السياقية بصورة طبيعية موجزة، من غير مبالغة في جعلها استنتاجًا منطقيًا صريحًا.
- source_word: Ἰουδαῖοι
  choice: اليهود
  rationale: هو المقابل المعجمي المباشر، ولا تحصر الآية نفسها المقصود صراحةً في أهل اليهودية أو في السلطات اليهودية؛ لذلك يُحفظ الاحتمال السياقي في الحاشية.
- source_word: ἐζήτουν
  choice: كانوا يبحثون عنه
  rationale: تنقل صيغة الماضي الناقص الدالة على فعل مستمر في أثناء العيد، بعبارة عربية واضحة وطبيعية.
- source_word: ἐν τῇ ἑορτῇ
  choice: في العيد
  rationale: تشير أداة التعريف إلى العيد المعروف من السياق، وحرف «في» يشمل الحضور والزمن من دون زيادة تفسيرية.
- source_word: ἔλεγον
  choice: ويقولون
  rationale: يحافظ المضارع المحكي بعد «كان» المفهومة من السياق على دلالة القول الجاري أو المتكرر في الماضي.
- source_word: ἐκεῖνος
  choice: ذاك
  rationale: يحفظ قوة اسم الإشارة ومسافة التعبير من غير إضافة كلمة «الرجل» غير الموجودة في اليونانية.
theological_decisions:
- issue: مرجع Ἰουδαῖοι في سرد يوحنا
  choice: «اليهود» في المتن مع حاشية توضح الاحتمال السياقي
  alternative: «أهل اليهودية» أو «السلطات اليهودية»
  rationale: اللفظ اليوناني قابل لهذه الدلالات بحسب السياق، لكن هذه الآية وحدها لا تصرّح بحصره في فئة أضيق؛ لذا لا يُحسم الغموض التفسيري داخل المتن.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُعمل «ذاك» للمحافظة على الإشارة البعيدة بلا إضافة تفسيرية، ووُضعت علامة الحاشية مباشرة بعد اللفظ الذي تتناوله.
