  text: Ἔλεγον οὖν τινες ἐκ τῶν Ἱεροσολυμιτῶν· Οὐχ οὗτός ἐστιν ὃν ζητοῦσιν ἀποκτεῖναι;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/025.yaml
  text: So some of the people of Jerusalem were saying[a], “Is this not the man they are seeking to kill?”
translation:
  language: ar
  text: 'فكان بعضُ أهل أورشليم يقولون: «أليس هذا هو الذي يسعون إلى قتله؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔλεγον
  choice: كانوا يقولون
  rationale: الماضي الناقص يدل على قول مستمر أو متكرر في سياق المشهد، وصيغة «كانوا يقولون» تنقل هذا الجانب بوضوح.
- source_word: οὖν
  choice: فـ
  rationale: تربط الجملة بما قبلها ربطًا سرديًا ونتائجيًا طبيعيًا من غير مبالغة في قوة الاستنتاج.
- source_word: τινες
  choice: بعض
  rationale: تدل على جماعة غير محددة من بين مجموعة أكبر، و«بعض» هي المقابل العربي الموجز والطبيعي.
- source_word: ἐκ τῶν Ἱεροσολυμιτῶν
  choice: أهل أورشليم
  rationale: تفيد أناسًا من سكان أورشليم؛ و«أهل أورشليم» تعبير عربي واضح وطبيعي يحافظ على دلالة الانتماء إلى المدينة.
- source_word: Οὐχ
  choice: أليس
  rationale: تفتتح سؤالًا يتوقع جوابًا بالإيجاب، و«أليس» تحفظ قوته البلاغية.
- source_word: οὗτός
  choice: هذا
  rationale: اسم إشارة يحيل إلى يسوع الحاضر في المشهد، ونُقل مباشرة من غير إضافة تفسيرية.
- source_word: ὃν ζητοῦσιν
  choice: الذي يسعون
  rationale: تحافظ الصلة على البنية المرجعية، وينقل المضارع «يسعون» القصد الجاري في ذلك الوقت.
- source_word: ἀποκτεῖναι
  choice: إلى قتله
  rationale: «قتل» هو المعنى المباشر للمصدر، ولا يضيف إيحاءً قضائيًا غير لازم مثل «إعدامه».
theological_decisions: []
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «أورشليم» بوصفه الاسم الكتابي العربي الشائع، وجاء ترتيب «بعض أهل أورشليم» طبيعيًا مع إبقاء دلالة ἐκ على أن المتكلمين فئة من أهل المدينة.
