  yaml_path: translation/nt/john/007/032.yaml
  text: The Pharisees heard the crowd muttering these things about him[c][b][a], and the chief priests and the Pharisees sent officers to seize him.
translation:
  language: ar
  text: سمع الفريسيون الجمع يتهامسون بهذه الأقوال عنه[a]، فأرسل رؤساء الكهنة والفريسيون أعوانًا[b] ليمسكوا به[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «يتذمّرون» أو «يتمتمون». يدل اللفظ اليوناني على كلام خافت قد تنطوي نبرته على الاستياء.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا: «حرسًا» أو «شرطة الهيكل». والمقصود أعوان رسميون أرسلتهم السلطات اليهودية.'
    reason: lexical_alternative
  - marker: c
    text: 'يمكن أيضًا: «ليقبضوا عليه». والتعبير اليوناني يعني حرفيًّا أن يمسكوا به أو يسيطروا عليه.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤκουσαν
  choice: سمع
  rationale: ينقل الفعل الماضي معنى وصول كلام الجمع إلى مسامع الفريسيين بوضوح وطبيعية.
- source_word: τοῦ ὄχλου
  choice: الجمع
  rationale: لفظ عربي فصيح ومألوف يدل على جماعة الناس المحتشدة، ويحافظ على كون الاسم اليوناني مفردًا جمعيّ المعنى.
- source_word: γογγύζοντος
  choice: يتمتم
  rationale: يفيد كلامًا خافتًا غير واضح، وقد يحمل نبرة استياء، من غير أن يحصر المعنى في التذمر الصريح.
- source_word: περὶ αὐτοῦ ταῦτα
  choice: بهذه الأمور عنه
  rationale: يحافظ على جمع ταῦτα وعلى تعلق الكلام بيسوع، مع ترتيب عربي واضح.
- source_word: οἱ ἀρχιερεῖς
  choice: رؤساء الكهنة
  rationale: يدل في هذا السياق على القيادات الكهنوتية، لا على وجود عدة أشخاص يشغلون منصب رئيس الكهنة في الوقت نفسه.
- source_word: ὑπηρέτας
  choice: رجالًا من الحرس
  rationale: يوضح أنهم أعوان رسميون مكلفون بتنفيذ أمر السلطات، من غير الجزم بأن التسمية المؤسسية الدقيقة هي «شرطة الهيكل».
- source_word: ἵνα πιάσωσιν αὐτόν
  choice: ليمسكوا به
  rationale: ينقل غرض الإرسال ويحافظ على المعنى الحرفي الأساسي للفعل، وهو القبض الجسدي على الشخص، من غير قصره على إجراء قانوني محدد.
theological_decisions:
- issue: هوية ὑπηρέτας المؤسسية
  choice: رجال من الحرس تابعون لسلطة رؤساء الكهنة والفريسيين
  alternative: خدم؛ أو شرطة الهيكل
  rationale: السياق يدل على أعوان رسميين أُرسلوا للقبض على يسوع، لكن اللفظ اليوناني نفسه لا يحدد وحدتهم المؤسسية بدقة.
translation_notes:
  register: صياغة عربية فصحى حديثة واضحة ووقورة. استُعمل «الجمع» اسمًا جمعيًّا، و«يتمتم» للمحافظة على خفوت الكلام مع إبقاء احتمال الاستياء في الحاشية. وتجنب النص تحديد هوية الحرس بما يتجاوز دلالة الأصل.
