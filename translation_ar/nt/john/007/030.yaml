  yaml_path: translation/nt/john/007/030.yaml
  text: So they were seeking to seize him[a], yet no one laid a hand on him[b], because his hour had not yet come.
translation:
  language: ar
  text: فكانوا يسعون إلى الإمساك به[a]، لكن لم يمدّ أحدٌ يده إليه، لأن ساعته لم تكن قد جاءت بعد[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يسعون إلى القبض عليه». فالفعل اليوناني يعني الإمساك، ويرجّح السياق أن المقصود هو القبض عليه لاعتقاله.'
    reason: lexical_alternative
  - marker: b
    text: «ساعته» تعبير متكرر في إنجيل يوحنا عن الوقت الذي عيّنه الله في رسالة يسوع، ولا سيما وقت آلامه وموته وقيامته وتمجيده.
    reason: cross_reference
lexical_decisions:
- source_word: ἐζήτουν
  choice: أخذوا يسعون
  rationale: صيغة الماضي الناقص تدل على مسعى مستمر أو محاولة جارية؛ والتعبير «أخذوا يسعون» ينقل هذا الجانب بوضوح في العربية.
- source_word: οὖν
  choice: فـ
  rationale: تفيد الفاء هنا النتيجة والاستمرار المنطقي في السياق، وهي طبيعية وموجزة في السرد العربي.
- source_word: πιάσαι
  choice: إلى الإمساك به
  rationale: يحافظ «الإمساك» على المعنى الأساسي للفعل، وهو القبض على الشخص، من غير أن يفرض منذ البداية دلالة قانونية رسمية مثل «اعتقاله».
- source_word: οὐδεὶς
  choice: لم ... أحدٌ
  rationale: الصياغة العربية القياسية الواضحة للنفي الشامل.
- source_word: ἐπέβαλεν ἐπ’ αὐτὸν τὴν χεῖρα
  choice: يمدّ ... يده إليه
  rationale: تعبير عربي طبيعي يحافظ على صورة اليد المفردة وعلى معنى الإقدام على أخذه أو القبض عليه.
- source_word: ὅτι
  choice: لأن
  rationale: تقدّم سبب عدم إقدام أحد على الإمساك به بوضوح.
- source_word: οὔπω
  choice: بعد
  rationale: مع النفي تؤدي «بعد» معنى «ليس إلى الآن» بصورة عربية طبيعية.
- source_word: ἐληλύθει
  choice: لم تكن قد جاءت
  rationale: 'تنقل دلالة الماضي الأسبق: عند تلك النقطة الزمنية لم تكن الساعة قد حانت.'
- source_word: ἡ ὥρα αὐτοῦ
  choice: ساعته
  rationale: يحافظ اللفظ الحرفي على المصطلح اليوحناوي المحمّل بالدلالة، بدل تسطيحه إلى «وقته» أو تضييقه إلى الموت وحده.
theological_decisions:
- issue: دلالة «ساعته» في سياق إنجيل يوحنا
  choice: الإبقاء على «ساعته» في المتن من غير تفسير موسّع
  alternative: وقته؛ أو الموعد المعيّن لموته
  rationale: العبارة تشير في يوحنا إلى التوقيت المعيّن ضمن رسالة يسوع، ولا سيما آلامه وموته وقيامته وتمجيده، لكن الآية نفسها لا تحصرها في حدث واحد؛ لذلك يحفظ اللفظ توتر العبارة واتساعها اللاهوتي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «أخذوا يسعون» لنقل استمرارية الماضي الناقص، وحُفظت صورة «مدّ يده إليه» ومصطلح «ساعته» اليوحناوي. جميع علامات الحواشي مثبتة في المتن.
