  text: οὐ δύναται ὁ κόσμος μισεῖν ὑμᾶς, ἐμὲ δὲ μισεῖ, ὅτι ἐγὼ μαρτυρῶ περὶ αὐτοῦ ὅτι τὰ ἔργα αὐτοῦ πονηρά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/007.yaml
  text: The world is not able to hate you[a], but it hates me[d][c][b], because I testify about it that its works are evil.
translation:
  language: ar
  text: لا يستطيع العالم[b] أن يبغضكم[a]، لكنه يبغضني، لأنني أشهد بشأنه أن أعماله شريرة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لا يمكن للعالم أن يبغضكم».'
    reason: lexical_alternative
  - marker: b
    text: كثيرًا ما يشير «العالم» في إنجيل يوحنا إلى المجتمع البشري في معارضته لله، لا إلى الخليقة المادية في ذاتها.
    reason: cultural_note
lexical_decisions:
- source_word: οὐ δύναται
  choice: لا يستطيع
  rationale: يحافظ على معنى القدرة أو الاستطاعة في الفعل δύναμαι، ويأتي عربيًا طبيعيًا وواضحًا.
- source_word: ὁ κόσμος
  choice: العالم
  rationale: يحفظ اللفظ اليوحناوي المتعدد الدلالات من غير تضييقه إلى «نظام العالم» أو «أهل العالم».
- source_word: μισεῖν / μισεῖ
  choice: يبغض / يبغض
  rationale: يحافظ على تكرار الفعل وعلى حدّة المقابلة بين المخاطَبين ويسوع.
- source_word: ἐμὲ δὲ
  choice: لكنه يبغضني
  rationale: تنقل δέ بوصفها أداة مقابلة، مع صياغة عربية طبيعية تبرز التضاد.
- source_word: μαρτυρῶ
  choice: أشهد
  rationale: لفظ عربي واضح يحفظ دلالة الشهادة في μαρτυρέω من غير تكلّف.
- source_word: περὶ αὐτοῦ
  choice: عليه
  rationale: «أشهد عليه» تركيب عربي طبيعي في سياق شهادة تكشف الشر، مع بقاء «العالم» هو المرجع.
- source_word: τὰ ἔργα αὐτοῦ
  choice: أعماله
  rationale: ترجمة مباشرة تحافظ على الرنين الأخلاقي واللاهوتي لكلمة ἔργα في يوحنا.
- source_word: πονηρά
  choice: شريرة
  rationale: تنقل الحكم الأخلاقي القوي في πονηρά، لا مجرد معنى الرداءة.
theological_decisions:
- issue: مرجع «العالم» وقوته اللاهوتية في السياق اليوحناوي
  choice: إبقاء «العالم» بلا توسيع تفسيري
  alternative: نظام العالم؛ البشرية المتمردة على الله
  rationale: يحمل κόσμος في يوحنا دلالات متراكبة، وهنا يظهر في موقف أخلاقي معارض ليسوع لأن شهادته تكشف شر أعماله. تُبقي الترجمة هذا التوتر من غير حصر المصطلح في تفسير واحد.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ووقورة. استُخدم «يبغض» بدل «يكره» للمحافظة على النبرة الكتابية من غير غموض، و«أشهد عليه» لصياغة عربية طبيعية تحمل معنى الشهادة الكاشفة والإدانة السياقية.
