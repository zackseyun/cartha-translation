lexical_decisions:
- source_word: τινὲς δὲ
  choice: لكن بعضًا
  rationale: تنقل العبارة فئة غير محددة من الجماعة مع إبراز المقابلة بسياق ردود أفعال الحشد.
- source_word: ἤθελον
  choice: أرادوا
  rationale: صيغة الماضي الناقص تدل على رغبة أو نية ماضية؛ وهذه الصياغة العربية طبيعية ولا تبالغ في تحديد الجانب الفعلي.
- source_word: ἐξ αὐτῶν
  choice: منهم
  rationale: تدل على أن هؤلاء البعض كانوا من الجماعة المذكورة، وصياغة «بعضًا منهم» واضحة وموجزة.
- source_word: πιάσαι
  choice: أن يمسكوه
  rationale: يحافظ «يمسكوه» على المعنى الأساسي، وهو القبض عليه أو الإمساك به، من غير حصره في إجراء اعتقال رسمي؛ وتذكر الحاشية هذا الاحتمال السياقي.
- source_word: ἀλλ’ οὐδεὶς
  choice: غير أن أحدًا لم
  rationale: تبرز المقابلة القوية بين نيتهم وعدم وقوع الفعل، وتحافظ على النفي الشامل.
- source_word: ἐπέβαλεν ἐπ’ αὐτὸν τὰς χεῖρας
  choice: يمدّ يده إليه
  rationale: تعبير عربي طبيعي يقابل الصورة الاصطلاحية اليونانية ويفيد محاولة القبض العدائية، مع إبقاء الصورة الجسدية دون ترجمة حرفية متكلفة.
