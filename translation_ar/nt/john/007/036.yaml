base_translation:
  language: en
  yaml_path: translation/nt/john/007/036.yaml
  text: What is this statement that he said[a], ‘You will seek me and will not find me, and where I am[c][b], you are not able to come’?”
translation:
  language: ar
  text: 'ما هذا القول[a] الذي قاله: «ستطلبونني ولن تجدوني، وحيث أنا[b] لا تقدرون أن تأتوا»؟[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ما هذه الكلمة التي قالها؟» أو «ما هذا الكلام الذي قاله؟». يمكن أن تعني الكلمة اليونانية λόγος «كلمة» أو «قولًا» أو «كلامًا» بحسب السياق.'
    reason: lexical_alternative
  - marker: b
    text: 'تترجم بعض الترجمات هذه العبارة: «حيث أنا ذاهب»، لكن النص اليوناني هنا يقول حرفيًا: «حيث أنا»، محافظًا على توتر مقصود في صياغة يوحنا.'
    reason: alternative_reading
  - marker: c
    text: 'يمكن أيضًا ترقيم الكلام على أنه اقتباسان: «ستطلبونني ولن تجدوني»، و«حيث أنا لا تقدرون أن تأتوا». غير أن اليونانية تصل العبارتين بحرف العطف «و» ضمن قول واحد متتابع.'
    reason: punctuation_alternative
lexical_decisions:
- source_word: λόγος
  choice: القول
  rationale: يشير هنا إلى مضمون ما قاله يسوع، ولفظة «القول» عربية طبيعية تحافظ على الصلة اللفظية بالكلام المنقول، من غير أن تحصر المعنى في كلمة مفردة.
- source_word: τίς ἐστιν ὁ λόγος οὗτος
  choice: ما هذا القول
  rationale: يحافظ على صيغة الاستفهام اليونانية مباشرة، بدل تحويلها تفسيريًا إلى «ماذا يعني هذا القول؟».
- source_word: Ζητήσετέ με
  choice: ستطلبونني
  rationale: ينقل فعل ζητέω بمعنى السعي إلى العثور على شخص، ويحافظ على صيغة المستقبل.
- source_word: οὐχ εὑρήσετε
  choice: لن تجدوني
  rationale: ترجمة مباشرة للنفي في المستقبل، مع إظهار المفعول به في العربية لتمام المعنى.
- source_word: ὅπου εἰμὶ ἐγὼ
  choice: حيث أكون أنا
  rationale: يحافظ على معنى الحضور الوارد في النص («حيث أنا/أكون»)، ولا يستبدله تفسيريًا بعبارة «حيث أنا ذاهب»؛ وإبراز الضمير «أنا» يعكس ἐγώ.
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: لا تقدرون أن تأتوا
  rationale: يُظهر معنى القدرة في δύνασθε، بدل الاكتفاء بصياغة مختصرة مثل «لا تستطيعون المجيء».
- source_word: εἶπε
  choice: قاله
  rationale: صياغة عربية موجزة وطبيعية تنقل فعل القول وتصل العبارة بالمقول المباشر.
theological_decisions:
- issue: زمن عبارة يسوع ὅπου εἰμὶ ἐγὼ
  choice: الإبقاء على «حيث أكون أنا»
  alternative: حيث أنا ذاهب
  rationale: النص اليوناني يستعمل فعل الكينونة في الحاضر، لا فعل الذهاب. والإبقاء عليه يصون التوتر المقصود في إنجيل يوحنا بشأن موضع يسوع وهويته وصلته بالآب، من غير حسمه بتفسير مكاني مستقبلي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «القول» بدل «العبارة» لسلامة النبرة العربية وقربه من المجال الدلالي للكلمة اليونانية، مع إبقاء البنية الاستفهامية والتوتر اللاهوتي في زمن فعل الكينونة.
