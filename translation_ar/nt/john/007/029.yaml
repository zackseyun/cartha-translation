  source_fidelity: 'النص العربي ينقل عناصر اليونانية كلها بأمانة: التوكيد في ἐγώ («أمّا أنا»)، المعرفة الحاضرة في οἶδα، التعليل المرجّح في ὅτι («لأنّي»)، دلالة المصدر/المنشأ في παρ’ αὐτοῦ εἰμι («منه»)، وفعل الإرسال الماضي («أرسلني»). ولا يضيف تفسيرًا عقديًا إلى المتن.'
  naturalness: 'الصياغة فصيحة معاصرة، موجزة، وملائمة لسياق الخطاب: «أمّا أنا فأعرفه، لأنّي منه، وهو أرسلني». وهي سليمة نحويًا وواضحة، مع حفظ النبرة التوكيدية.'
  terminology: «أعرفه» و«منه» و«أرسلني» اختيارات دقيقة وطبيعية. يحافظ «منه» على اتساع العبارة اليوحناوية دون تحويلها إلى معنى مكاني أو إلى مجرد مجيء. الحاشية تذكر البدائل ذات الصلة وقراءة ὅτι الممكنة دون فرضها.
