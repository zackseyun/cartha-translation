  text: ἐγὼ οἶδα αὐτόν, ὅτι παρ’ αὐτοῦ εἰμι κἀκεῖνός με ἀπέστειλεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/029.yaml
  text: I know him[a], because I am from him[b], and he sent me.
translation:
  language: ar
  text: أَمَّا أَنَا فَأَعْرِفُهُ، لِأَنِّي مِنْهُ[a]، وَهُوَ أَرْسَلَنِي.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «لأنني جئت من عنده» أو «لأنني من عنده». فالعبارة اليونانية تدل على المصدر أو المنشأ، وقد توحي كذلك بالصدور من حضرته. ويمكن نحويًّا أن تُفهم ὅτι بمعنى «أنَّ»، فتكون العبارة: «أعرف أنني منه»، غير أن السياق يرجّح المعنى السببي: «لأنني منه».'
    reason: بدائل لغوية وقراءة نحوية محتملة
lexical_decisions:
- source_word: ἐγὼ
  choice: أَمَّا أَنَا
  rationale: أُبرز الضمير المنفصل لإظهار التوكيد والمقابلة الكامنين في ذكر الضمير اليوناني صراحة.
- source_word: οἶδα
  choice: أَعْرِفُ
  rationale: الفعل يدل هنا على حالة حاضرة من المعرفة؛ والمضارع العربي طبيعي ودقيق في السياق.
- source_word: αὐτόν
  choice: ـهُ
  rationale: الضمير يعود في السياق إلى الآب، وقد أُبقي ضميرًا من غير إدخال تفسير في المتن.
- source_word: ὅτι
  choice: لِأَنِّي
  rationale: فُهمت الأداة على أنها سببية، فتبيّن علة معرفة يسوع به؛ مع بقاء احتمال الدلالة المضمونية مذكورًا في الحاشية.
- source_word: παρ’ αὐτοῦ
  choice: مِنْهُ
  rationale: παρά مع المضاف إليه تفيد المصدر أو المنشأ. و«منه» تحافظ على الإيجاز والعمق من غير حصر العبارة في مجيء مكاني.
- source_word: εἰμι
  choice: أَنَا ... مِنْهُ
  rationale: حُفظ معنى فعل الكينونة في تركيب عربي اسمي طبيعي، بدل تحويله إلى «جئت».
- source_word: κἀκεῖνός
  choice: وَهُوَ
  rationale: ترجمة طبيعية لاجتماع καί وἐκεῖνος، مع إبراز الفاعل كما في اليونانية.
- source_word: με
  choice: ـنِي
  rationale: ضمير المفعول المباشر تُرجم بصيغته العربية المعتادة.
- source_word: ἀπέστειλεν
  choice: أَرْسَلَنِي
  rationale: الماضي العربي يلائم صيغة الماضي اليونانية ويحفظ موضوع الإرسال في إنجيل يوحنا.
theological_decisions:
- issue: دلالة علاقة يسوع بالآب في παρ’ αὐτοῦ εἰμι
  choice: لِأَنِّي مِنْهُ
  alternative: لأنني جئت من عنده؛ لأنني من عنده
  rationale: تحفظ الصياغة معنى المصدر أو المنشأ وتبقي الثقل اللاهوتي للعبارة من غير تضييقه إلى مجرد حركة أو مكان أو مهمة.
- issue: وظيفة ὅτι
  choice: 'سببية: «لِأَنِّي»'
  alternative: 'مضمونية: «أعرف أنني منه»'
  rationale: السياق يرجّح أن العبارة تعطي سبب معرفة يسوع بالآب، لكن البنية اليونانية تسمح نحويًا بالقراءة المضمونية، ولذلك ذُكرت في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «أمّا أنا» لإبراز توكيد ἐγώ، وحُفظ التركيب الموجز «منه» لتجنب تفسير العلاقة تفسيرًا زائدًا. وُضع مؤشر الحاشية في المتن عند موضع العبارة ذات الاحتمالين.
