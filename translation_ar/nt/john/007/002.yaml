  text: The Jewish feast[a], the Feast of Tabernacles, was near.
translation:
  language: ar
  text: وكان عيد اليهود، عيد المظال[a]، قريبًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'وبعبارة أقرب إلى الحرفية: «عيد الأكواخ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: وَ
  rationale: أداة ربط سردية خفيفة تصل هذه الجملة بما قبلها من غير أن تُحمَّل معنى زمنيًا صريحًا مثل «الآن» ولا معنى استدراكيًا قويًا.
- source_word: ἐγγὺς
  choice: قد اقترب
  rationale: ينقل القرب الزمني للعيد بلغة عربية طبيعية واضحة، مع «كان» الدالة على الإطار السردي.
- source_word: ἑορτὴ
  choice: عيد
  rationale: اللفظ العربي المألوف لاحتفال ديني دوري، وهو أنسب هنا من تعبيرات أقل رسوخًا مثل «مهرجان».
- source_word: τῶν Ἰουδαίων
  choice: اليهود
  rationale: حُفظ تركيب الإضافة «عيد اليهود»، وهو طبيعي في العربية ويبيّن أن المقصود عيد يهودي من غير إيحاء جدلي.
- source_word: σκηνοπηγία
  choice: عيد المظال
  rationale: الاسم العربي المتداول للعيد الكتابي المرتبط بالإقامة في عرائش أو أكواخ مؤقتة؛ ويُشرح معناه الحرفي في الحاشية.
theological_decisions:
- issue: دلالة τῶν Ἰουδαίων في تسمية العيد
  choice: عيد اليهود
  alternative: العيد اليهودي
  rationale: السياق يعرّف العيد بوصفه من أعياد اليهود، ولا يتضمن حكمًا جدليًا عليهم. وصيغة الإضافة أقرب إلى بنية الأصل وطبيعية في العربية.
- issue: تسمية σκηνοπηγία
  choice: عيد المظال
  alternative: عيد الأكواخ / عيد العرائش
  rationale: «عيد المظال» هو الاسم العربي الأشهر والأوضح للقارئ، بينما تحافظ الحاشية على الدلالة الحرفية المتعلقة بالأكواخ أو العرائش المؤقتة.
translation_notes:
  register: صياغة عربية فصحى معاصرة، واضحة ووقورة. حافظت على أداة الربط السردية دون إدخال «الآن»، وعلى الاسم التقليدي المعروف للعيد مع بيان دلالته الحرفية في الحاشية.
