source:
  edition: SBLGNT
  text: εἶπον οὖν οἱ Ἰουδαῖοι πρὸς ἑαυτούς· Ποῦ οὗτος μέλλει πορεύεσθαι ὅτι ἡμεῖς οὐχ εὑρήσομεν αὐτόν; μὴ εἰς τὴν διασπορὰν τῶν Ἑλλήνων μέλλει πορεύεσθαι καὶ διδάσκειν τοὺς Ἕλληνας;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/035.yaml
  text: So the Jews said to one another, “Where is this man about to go, that we will not find him? He is not about to go to the dispersion among the Greeks and teach the Greeks, is he?”
translation:
  language: ar
  text: 'فقال اليهود[a] بعضهم لبعض: «إلى أين يوشك هذا الرجل أن يذهب فلا نجده؟ ألعله يوشك أن يذهب إلى يهود الشتات[b] بين اليونانيين ويعلِّم اليونانيين؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أهل اليهودية». يمكن أن يدل اللفظ اليوناني على اليهود عمومًا، أو على أهل منطقة اليهودية في بعض السياقات.'
    reason: lexical_alternative
  - marker: b
    text: المقصود يهود الشتات المقيمون بين السكان اليونانيين أو الناطقين باليونانية، لا شتاتًا يتكوّن من اليونانيين.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ Ἰουδαῖοι
  choice: اليهود
  rationale: المقابل العربي المباشر الذي يحافظ على الدلالة الجماعية من غير أن يضيف أن المقصود القادة؛ ويُذكر احتمال «أهل اليهودية» في الحاشية.
- source_word: πρὸς ἑαυτούς
  choice: بعضهم لبعض
  rationale: يؤدي المعنى التبادلي الطبيعي في السياق بوضوح.
- source_word: Ποῦ οὗτος
  choice: إلى أين ... هذا الرجل
  rationale: يحافظ «هذا الرجل» على نبرة الإشارة التي قد تفيد التباعد، وهو تعبير عربي طبيعي.
- source_word: μέλλει πορεύεσθαι
  choice: يوشك أن يذهب
  rationale: ينقل القوة الاستقبالية أو قرب الفعل في μέλλω مع المصدر، من غير الجزم بقصد داخلي.
- source_word: ὅτι ἡμεῖς οὐχ εὑρήσομεν αὐτόν
  choice: فلا نجده
  rationale: ينقل النتيجة المتصورة بإيجاز طبيعي، من غير إضافة معنى عدم القدرة غير المصرح به.
- source_word: μὴ
  choice: ألعله
  rationale: يصوغ سؤالًا توقعيًا يحمل في السياق ترجيح النفي، مع إبقاء الكلام سؤالًا ساخرًا أو متشككًا.
- source_word: διασπορὰν τῶν Ἑλλήνων
  choice: يهود الشتات بين اليونانيين
  rationale: يوضح أن الشتات هو اليهود المقيمون بين الشعوب اليونانية، لا شتاتًا مؤلفًا من اليونانيين؛ وإضافة «يهود» إيضاح دلالي لازم في العربية الحديثة لتجنب الالتباس.
- source_word: Ἕλληνας
  choice: اليونانيين
  rationale: يحافظ على المعنى الإثني الثقافي المباشر، من غير توسيعه إلى «الأمم».
- source_word: καὶ διδάσκειν τοὺς Ἕλληνας
  choice: ويعلِّم اليونانيين
  rationale: ترجمة مباشرة وطبيعية لعبارة المصدر وتحفظ مفارقة تخمين المتكلمين.
theological_decisions:
- issue: دلالة Ἰουδαῖοι في السرد اليوحناوي
  choice: اليهود
  alternative: أهل اليهودية
  rationale: لا يفرض السياق هنا قصر اللفظ على سكان اليهودية أو على القادة، لذلك أُبقي المقابل الأوسع والأقرب إلى اللفظ اليوناني، مع حفظ البديل الجغرافي في الحاشية.
- issue: هوية «الشتات بين اليونانيين»
  choice: يهود الشتات بين اليونانيين
  alternative: الشتات بين اليونانيين
  rationale: تحديد «يهود» يمنع أن يُفهم التركيب على أنه شتات اليونانيين، ويتفق مع الاستعمال اليهودي المعروف لكلمة διασπορά، من غير تغيير هوية «اليونانيين» الذين سيعلّمهم.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدم «يوشك أن» لنقل μέλλει، و«ألعله» لصياغة السؤال الذي يتوقع النفي. وُضعت علامتا الحاشيتين في المتن عند موضعيهما.
