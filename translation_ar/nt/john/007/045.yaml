  text: Ἦλθον οὖν οἱ ὑπηρέται πρὸς τοὺς ἀρχιερεῖς καὶ Φαρισαίους, καὶ εἶπον αὐτοῖς ἐκεῖνοι· Διὰ τί οὐκ ἠγάγετε αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/045.yaml
  text: So the officers came to the chief priests and Pharisees[a], and they said to them[b], “Why did you not bring him?”
translation:
  language: ar
  text: 'فجاء الحرس إلى رؤساء الكهنة والفريسيين، فقال لهم أولئك[a]: «لماذا لم تأتوا[b] به؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فقالوا لهم». ترد في اليونانية كلمة إشارة صريحة بمعنى «أولئك»، ويُرجَّح أنها للتوكيد وتشير إلى رؤساء الكهنة والفريسيين.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «لماذا لم تقتادوه؟» يمكن أن يعني الفعل اليوناني «قاد» أو «أحضر»؛ ومعنى الإحضار أنسب هنا لأن الحرس كانوا قد أُرسلوا للقبض على يسوع.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: فـ
  rationale: تفيد الفاء هنا التعقيب والنتيجة السردية بصورة طبيعية، من غير إثقال العبارة بأداة استنتاج رسمية.
- source_word: ὑπηρέται
  choice: الحرس
  rationale: يدل اللفظ في هذا السياق على رجال تابعين للسلطات أُرسلوا للقبض على يسوع، ولذلك فـ«الحرس» أوضح من «الخدم» مع بقاء الوظيفة العامة من غير إضافة «حرس الهيكل» إلى النص.
- source_word: ἀρχιερεῖς
  choice: رؤساء الكهنة
  rationale: التعبير العربي المألوف عن جماعة القيادات الكهنوتية، لا عن عدة أشخاص يشغل كل واحد منهم منصب رئيس الكهنة في الوقت نفسه.
- source_word: Φαρισαίους
  choice: الفريسيين
  rationale: الصيغة العربية المعيارية لاسم هذه الجماعة اليهودية.
- source_word: ἐκεῖνοι
  choice: أولئك
  rationale: يحافظ على اسم الإشارة الصريح والمؤكد في اليونانية، ويعيد الإشارة إلى رؤساء الكهنة والفريسيين بوصفهم المتكلمين.
- source_word: Διὰ τί
  choice: لماذا
  rationale: المقابل العربي الطبيعي المباشر للسؤال عن السبب.
- source_word: ἠγάγετε
  choice: لم تأتوا به
  rationale: ينقل الفعل الماضي ومعنى الإحضار بصورة عربية طبيعية تلائم تكليف الحرس بالقبض على يسوع، مع بيان معنى الاقتياد البديل في الحاشية.
- source_word: αὐτόν
  choice: به
  rationale: الضمير يعود إلى يسوع، وتقتضي العبارة العربية الطبيعية مع «أتى» استعمال الباء.
