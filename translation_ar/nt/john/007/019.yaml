  terminology: «موسى» و«الشريعة» مناسبان للسياق الموسوي. و«يلتزم بالشريعة» ينقل المعنى الاصطلاحي لـ ποιεῖ τὸν νόμον دون تحميل النص تفسيرًا مذهبيًا.
