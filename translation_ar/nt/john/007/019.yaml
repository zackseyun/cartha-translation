  source_fidelity: 'المعنى العام منقول بأمانة: الاستفهام المنفي الذي ينتظر جوابًا إيجابيًا، والتقابل مع عدم حفظ الشريعة، ثم سؤال يسوع عن السعي إلى قتله. غير أن «يعمل بالشريعة» قد تُفهم في العربية المعاصرة بمعنى العمل في مجال الشريعة أو الاحتكام إليها، لا بمعنى الامتثال لها، ولذلك تحتاج إلى صياغة أدق.'
