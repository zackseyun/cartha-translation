  to: ألم يعطكم موسى الشريعة؟ ومع ذلك، لا أحد منكم يلتزم بالشريعة[a]. فلماذا تسعون إلى قتلي؟
  rationale: تُستبدل الصياغة الملتبسة «يعمل بالشريعة» بـ«يلتزم بالشريعة» لتدل بوضوح على حفظ الشريعة وامتثالها، مع الإبقاء في الحاشية على الصورة الحرفية للفعل اليوناني. كما تُصاغ الجملة الأولى باستفهام منفي عربي أكثر سلاسة مع المحافظة على قوتها البلاغية.
