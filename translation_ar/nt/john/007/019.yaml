  text: Οὐ Μωϋσῆς ⸀δέδωκεν ὑμῖν τὸν νόμον; καὶ οὐδεὶς ἐξ ὑμῶν ποιεῖ τὸν νόμον. τί με ζητεῖτε ἀποκτεῖναι;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/019.yaml
  text: Did not Moses give you the law? Yet none of you keeps the law[b][a]. Why are you seeking to kill me?
translation:
  language: ar
  text: ألم يعطكم موسى الشريعة؟ ومع ذلك، لا أحد منكم يلتزم بالشريعة[a]. فلماذا تسعون إلى قتلي؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «يفعل الشريعة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ ... δέδωκεν
  choice: أليس ... قد أعطاكم
  rationale: صيغ الاستفهام المنفي بما يفيد توقّع جواب مثبت، واستُعملت «قد» مع الماضي لتعكس دلالة الفعل اليوناني التام على العطاء الواقع ذي الأثر القائم.
- source_word: Μωϋσῆς
  choice: موسى
  rationale: الصيغة العربية المعيارية المألوفة للاسم.
- source_word: τὸν νόμον
  choice: الشريعة
  rationale: المقصود هنا شريعة موسى المعطاة لإسرائيل، و«الشريعة» أوضح وأطبع في العربية من «القانون» في هذا السياق الكتابي.
- source_word: καὶ
  choice: ومع ذلك
  rationale: 'أُبرزت قوة العطف التقابلية في السياق: أُعطيت لهم الشريعة، ومع ذلك لا يعمل بها أحد منهم.'
- source_word: οὐδεὶς ἐξ ὑμῶν
  choice: لا أحد منكم
  rationale: تعبير عربي طبيعي يحفظ النفي الشامل المؤكد.
- source_word: ποιεῖ τὸν νόμον
  choice: يعمل بالشريعة
  rationale: يحافظ على صورة «فعل الشريعة» بصورة عربية سليمة، ويدل على تطبيقها وطاعتها من غير تضييق المعنى على فعل واحد.
- source_word: τί
  choice: لماذا
  rationale: أداة الاستفهام هنا سببية، و«لماذا» هي المقابل العربي الطبيعي المباشر.
- source_word: ζητεῖτε ἀποκτεῖναι
  choice: تسعون إلى قتلي
  rationale: «تسعون» تنقل معنى القصد والطلب المستمر في الفعل المضارع، و«إلى قتلي» تحافظ على بنية الفعل مع المصدر ودلالة القتل الصريحة.
theological_decisions:
- issue: مرجع «الشريعة»
  choice: شريعة موسى المعطاة لإسرائيل
  alternative: الشريعة بمعنى أخلاقي عام
  rationale: ذكر موسى صراحة بوصفه من أعطاهم الشريعة يحدد المرجع بوصفه الشريعة الموسوية، من غير إضافة تفسير مذهبي إلى المتن.
- issue: معنى العمل بالشريعة
  choice: ممارستها وطاعتها
  alternative: مجرد امتلاك الشريعة أو تعليمها
  rationale: الفعل ποιεῖ يدل على فعل ما تقضي به الشريعة، ويُبقي النص التوتر القائم بين تلقيها وعدم تطبيقها.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُعملت «الشريعة» للدلالة الطبيعية على ناموس موسى، و«يعمل بالشريعة» للموازنة بين قرب الصياغة من الأصل وسلامتها في العربية.
