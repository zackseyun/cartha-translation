source:
  edition: SBLGNT
  text: Ὡς δὲ ἀνέβησαν οἱ ἀδελφοὶ αὐτοῦ ⸂εἰς τὴν ἑορτήν, τότε καὶ αὐτὸς ἀνέβη⸃, οὐ φανερῶς ἀλλὰ ὡς ἐν κρυπτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/010.yaml
  text: But when his brothers had gone up to the feast[a], then he also went up, not openly but as if in secret.
translation:
  language: ar
  text: ولكن لما صعد إخوته إلى العيد، صعد هو أيضًا حينئذ، لا علنًا، بل كأنه في الخفاء.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «بل في الخفاء». والعبارة اليونانية حرفيًا «بل كأنه في الخفاء»، وقد تفيد شيئًا من التلطيف في التقرير.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  choice: ولكن لما
  rationale: تؤدي «لما» معنى الجملة الزمنية مع الفعل الماضي، وتحفظ «لكن» الانتقال والمقابلة الخفيفة في السياق السابق.
- source_word: ἀνέβησαν ... ἀνέβη
  choice: صعد ... صعد
  rationale: يحفظ «صعد» الدلالة الجغرافية والاصطلاحية للصعود إلى أورشليم في سياق الحج، ويُفهم تعاقب الحدثين من «لما» و«حينئذ».
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: إخوته
  rationale: يشير السياق المباشر إلى إخوة يسوع الذكور، وهذه الصياغة عربية طبيعية ودقيقة.
- source_word: εἰς τὴν ἑορτήν
  choice: إلى العيد
  rationale: «العيد» مقابل واضح وموجز لـἑορτή، والمقصود في السياق عيد المظال.
- source_word: τότε καὶ αὐτὸς
  choice: هو أيضًا حينئذ
  rationale: تحفظ الصياغة معنى التعاقب في τότε والإضافة والتوكيد في καὶ αὐτός، مع ترتيب عربي واضح.
- source_word: οὐ φανερῶς
  choice: لا علنًا
  rationale: مقابل مباشر لـφανερῶς، ويعبّر عن عدم الذهاب على نحو ظاهر أو علني.
- source_word: ἀλλὰ ὡς ἐν κρυπτῷ
  choice: بل كأنه في الخفاء
  rationale: تحفظ «كأنه» قوة ὡς المؤهِّلة للعبارة بدل تسويتها إلى تقرير جازم بأنه ذهب سرًا.
theological_decisions:
- issue: علاقة صعود يسوع هنا بقوله السابق عن عدم الصعود إلى العيد
  choice: يُروى أنه صعد بعد إخوته وعلى غير نحو علني، من دون تفسير أو مواءمة مضافة.
  alternative: صياغة توحي بأنه غيّر رأيه، أو تحل التوتر مع يوحنا 7:8 بتفسير ضمني.
  rationale: النص اليوناني يذكر تسلسل الحدث وكيفية الصعود فحسب؛ لذلك تُحفظ دلالة النص والتوتر السردي من غير فرض حل تفسيري.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. استُخدم «العيد» لاتساقه مع السياق اليهودي، وحُفظت الصيغة المؤهلة «كأنه في الخفاء» مع شرح البديل الأملس في الحاشية.
