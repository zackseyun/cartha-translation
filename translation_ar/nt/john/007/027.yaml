base_translation:
  language: en
  yaml_path: translation/nt/john/007/027.yaml
  text: But we know where this man is from; but when the Messiah comes[a], no one knows where he is from.
translation:
  language: ar
  text: لكننا نعرف من أين هو، هذا الرجل؛ أمّا المسيح، فعندما يأتي[a]، فلا أحد يعرف من أين هو.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لكننا نعرف من أين يأتي هذا الرجل؛ أمّا المسيح، فمتى يأتي، فلا أحد يعرف من أين يأتي».'
    reason: بديل تعبيري لعبارة السؤال عن الأصل في الشطرين، لا اختلاف في النص اليوناني.
lexical_decisions:
- source_word: ἀλλὰ
  choice: لكننا
  rationale: تفيد الاستدراك والتباين مع الكلام السابق، وصياغتها مع ضمير الجماعة طبيعية في العربية.
- source_word: τοῦτον
  choice: هذا الرجل
  rationale: اسم الإشارة يعود إلى يسوع عودة شخصية مباشرة، و«هذا الرجل» أوضح في العربية من «هذا» وحدها.
- source_word: οἴδαμεν
  choice: نعرف
  rationale: ينقل معرفة المتكلمين بأصل يسوع المزعوم بصياغة عربية مباشرة.
- source_word: πόθεν ἐστίν
  choice: من أين هذا الرجل / من أين هو
  rationale: يحافظ على تكرار السؤال عن الأصل في الشطرين، مع صياغة عربية موجزة وطبيعية؛ ويمكن أيضًا فهم العبارة بمعنى «من أين يأتي» كما توضّح الحاشية.
- source_word: ὁ δὲ χριστός
  choice: أمّا المسيح
  rationale: «أمّا» تُبرز المقابلة، و«المسيح» هو اللقب العربي المألوف للشخص المنتظَر هنا، لا مجرد اسم شخصي.
- source_word: ὅταν ἔρχηται
  choice: فعندما يأتي
  rationale: ينقل الحدث المستقبلي المتوقع الذي تعبّر عنه ὅταν مع صيغة الالتزام، من غير أن يوحي بتوقيت محدد.
- source_word: οὐδεὶς γινώσκει
  choice: لا أحد يعرف
  rationale: صياغة عربية واضحة تنقل النفي العام وفعل المعرفة دون زيادة تفسيرية.
theological_decisions:
- issue: دلالة Χριστός بوصفه لقبًا
  choice: المسيح
  alternative: الممسوح
  rationale: السياق يتحدث عن الشخصية المسيانية المنتظرة. و«المسيح» هو المقابل العربي الراسخ الذي يحفظ وظيفة اللقب وسياقه اليهودي، بينما «الممسوح» أقل طبيعية وقد يبدو شرحًا لا ترجمة.
- issue: طبيعة قول الجمع عن أصل المسيح
  choice: نقل قولهم كما هو من غير تصحيحه أو إقراره
  alternative: إضافة تفسير يبين أنه اعتقاد شعبي أو فهم خاطئ
  rationale: النص يسجل قول المتكلمين ولا يقدمه هنا بوصفه تقريرًا عقائديًا من الراوي؛ لذلك تُصان حدة التوتر من غير شرح داخل المتن.
translation_notes:
  register: العربية فصحى معاصرة واضحة وذات نبرة كريمة. استُعملت «أمّا» للمقابلة الطبيعية، وحُفظ تكرار السؤال عن الأصل في شطري الآية. وُضعت علامة الحاشية [a] في المتن عند العبارة التي تتصل بها.
