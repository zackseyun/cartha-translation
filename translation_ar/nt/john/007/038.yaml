  text: The one who believes in me[a], just as the Scripture has said[b], rivers of living water will flow from his belly.
translation:
  language: ar
  text: مَن يؤمن بي، كما قال الكتاب، ستجري من جوفه[a][b] أنهارُ ماءٍ حيٍّ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يعود الضمير، بحسب أقرب مرجع نحوي، إلى المؤمن؛ ويرى بعضهم أنه يعود إلى المسيح، فتكون الأنهار جارية منه.
    reason: alternative_reading
  - marker: b
    text: الكلمة اليونانية تعني حرفيًا «البطن» أو «الرحم»، وتُستعمل هنا على الأرجح مجازًا للدلالة على باطن الإنسان.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πιστεύων εἰς ἐμέ
  choice: مَن يؤمن بي
  rationale: تؤدي «مَن» مع الفعل المضارع معنى اسم الفاعل المعرف المستعمل اسميًا، وتعبّر طبيعيًا عن الشخص الذي يتصف بالإيمان الموجَّه إلى يسوع.
- source_word: καθὼς εἶπεν ἡ γραφή
  choice: كما قال الكتاب
  rationale: تحافظ على صيغة الإحالة إلى «الكتاب» بالمفرد وعلى الفعل الماضي، بأسلوب عربي واضح ومألوف.
- source_word: ποταμοὶ
  choice: أنهارُ
  rationale: تنقل صورة الأنهار ووفرة الماء، من غير تخفيفها إلى «جداول».
- source_word: ἐκ τῆς κοιλίας αὐτοῦ
  choice: من جوفه
  rationale: «الجوف» تعبير عربي فصيح يشير إلى داخل الإنسان، ويحفظ الصورة الجسدية المجازية للكلمة اليونانية دون أن يحصرها في معنى تشريحي صرف.
- source_word: ῥεύσουσιν
  choice: ستجري
  rationale: تنقل صيغة المستقبل ومعنى الجريان مباشرة، من غير إضافة معنى الاندفاع الشديد.
- source_word: ὕδατος ζῶντος
  choice: ماءٍ حيّ
  rationale: تحفظ العبارة اليوحناوية وصورتها اللاهوتية، بدل تفسيرها بعبارة مثل «ماء يهب الحياة».
theological_decisions:
- issue: مرجع الضمير في αὐτοῦ («جوفه»)
  choice: يُفهم في متن الترجمة على نحو طبيعي أنه يعود إلى المؤمن.
  alternative: قد يُفهم أنه يعود إلى المسيح، فتكون الأنهار جارية منه.
  rationale: أقرب مرجع نحوي هو «مَن يؤمن»، كما ينسجم ذلك مع تفسير العدد التالي المتعلق بالروح الذي يناله المؤمنون؛ لكن احتمال عود الضمير إلى المسيح محفوظ في الحاشية لعدم حسم موضع الخلاف ضمنًا.
- issue: الدلالة المجازية لكلمة κοιλία
  choice: جوفه
  alternative: بطنه؛ أو أعماقه؛ أو من داخله
  rationale: «جوفه» أقرب إلى الصورة الأصلية من «أعماقه»، وأوضح في العربية الحديثة من ترجمة تشريحية محضة، مع بيان المعنى الحرفي والمجازي في الحاشية.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة ووقورة. استُعملت «مَن يؤمن» بدل صياغة اسمية ثقيلة، و«جوفه» للموازنة بين الصورة الأصلية وسلامة الفهم. وُضعت علامتا الحاشيتين مباشرة بعد موضع الضمير واللفظ اللذين تتعلقان بهما.
