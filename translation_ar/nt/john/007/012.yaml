  naturalness: '«فكان بعضهم يقولون» غير منسجم نحويًا؛ فـ«بعضهم» يُستعمل هنا مع الفعل المفرد: «كان بعضهم يقول». كما أن وضع علامة الحاشية (b) بعد «بل» لا يربطها مباشرة بالفعل الذي تشرح بدائله.'
  terminology: «همس» مناسب لإبراز خفوت التداول، و«صالح» ينقل Ἀγαθός من دون إضافة «رجل». و«يُضِلّ» ترجمة مناسبة لـπλανᾷ، مع حفظ «يخدع» و«يقود ... إلى الضلال» بديلين في الحاشية.
