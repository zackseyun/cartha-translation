  text: καὶ γογγυσμὸς ⸂περὶ αὐτοῦ ἦν πολὺς⸃ ἐν τοῖς ὄχλοις· οἱ μὲν ἔλεγον ὅτι Ἀγαθός ἐστιν, ἄλλοι ⸀δὲ ἔλεγον· Οὔ, ἀλλὰ πλανᾷ τὸν ὄχλον.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/012.yaml
  text: And there was much murmuring about him among the crowds[a]. Some were saying, “He is good.” Others were saying, “No, on the contrary[b], he is misleading the crowd.”
translation:
  language: ar
  text: 'وكان بين الجموع همسٌ كثيرٌ بشأنه[a]. وكان بعضهم يقول: «إنه صالح». وآخرون يقولون: «لا، بل يُضِلُّ الحشد[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «تذمّر كثير» أو «كلام خافت كثير» بشأنه.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «يخدع الحشد» أو «يقود الحشد إلى الضلال».'
    reason: lexical_alternative
lexical_decisions:
- source_word: γογγυσμός
  choice: همس
  rationale: يدل اللفظ هنا على كلام خافت متداول بين الناس، قد يحمل التذمر أو الاعتراض. و«همس» يحفظ طابع الكلام غير العلني من غير أن يحصره في الشكوى وحدها.
- source_word: περὶ αὐτοῦ
  choice: عنه
  rationale: تعبير عربي طبيعي ومباشر يحفظ معنى الحديث المتعلق بيسوع.
- source_word: πολύς
  choice: كثير
  rationale: ينقل كثرة الهمس وانتشاره بإيجاز ووضوح.
- source_word: ἐν τοῖς ὄχλοις
  choice: بين الجموع
  rationale: يحفظ صيغة الجمع في اليونانية ويصور تداول الكلام في أوساط الجماعات المحتشدة.
- source_word: οἱ μὲν ... ἄλλοι δὲ
  choice: بعضهم ... آخرون
  rationale: ينقل التقابل بين الفريقين بعبارة عربية واضحة وطبيعية.
- source_word: Ἀγαθός
  choice: صالح
  rationale: ينقل الصفة اليونانية من غير إضافة «رجل»، ويحافظ على الحكم المتعلق بصفة الشخص. و«صالح» أفصح في هذا السياق من «جيد» عند وصف الخُلُق.
- source_word: Οὔ, ἀλλὰ
  choice: لا، بل
  rationale: يحفظ النفي المباشر ثم التصحيح المضاد بإيجاز عربي طبيعي.
- source_word: πλανᾷ
  choice: يُضِلُّ
  rationale: يحفظ قوة الفعل الذي قد يعني الإضلال أو الخداع أو اقتياد الناس إلى الضلال، من غير الجزم في المتن بكيفية وقوع ذلك.
- source_word: τὸν ὄχλον
  choice: الجمع
  rationale: يحفظ الانتقال اليوناني من «الجموع» بصيغة الجمع إلى الجماعة المحتشدة بوصفها كيانًا جمعيًا واحدًا.
theological_decisions:
- issue: تباين أحكام الجموع على يسوع
  choice: 'نقل القولين المتعارضين مباشرة وبحياد: «إنه صالح» و«إنه يُضِلُّ الجمع»'
  alternative: صياغة أحد القولين بما يضعفه أو يوحي بتأييد الراوي له
  rationale: الآية تعرض انقسام الرأي العام ولا تنص هنا على تبني الراوي لأي من الحكمين؛ لذلك تُحفظ حدة التوتر بينهما.
- issue: دلالة πλανᾷ على القصد أو النتيجة
  choice: يُضِلُّ
  alternative: يخدع
  rationale: «يُضِلُّ» يبقي التركيز على قيادة الجمع إلى الخطأ، ولا يفرض وحده حكمًا تفصيليًا بشأن تعمد الخداع، مع إثبات البدائل الممكنة في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُعمل «همس» لإبراز خفوت الكلام وتداوله بعيدًا عن التصريح العلني، ووُضعت بدائل التذمر والكلام الخافت في الحاشية. وحُفظت صفة Ἀγαθός بلا إضافة اسم غير وارد في الأصل، كما حُفظ التحول من «الجموع» إلى «الجمع» بحسب العدد في النص اليوناني.
