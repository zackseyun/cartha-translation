id: JHN.7.48
reference: John 7:48
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: μή τις ἐκ τῶν ἀρχόντων ἐπίστευσεν εἰς αὐτὸν ἢ ἐκ τῶν Φαρισαίων;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/048.yaml
  text: Has any one of the rulers or of the Pharisees believed in him?[a]
translation:
  language: ar
  text: أفهل آمن به أحدٌ من الرؤساء أو من الفريسيين؟[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: في اليونانية، صيغ السؤال بأداة «μή» تدل على أن المتكلم يتوقع جوابًا بالنفي.
    reason: lexical_alternative
lexical_decisions:
- source_word: μή τις
  choice: أفهل ... أحدٌ
  rationale: يحافظ هذا التعبير على صيغة السؤال البلاغي، بينما تدل «μή» في هذا السياق على أن المتكلمين يتوقعون جوابًا بالنفي، من غير تحويل السؤال في المتن إلى نفي صريح.
- source_word: ἐκ τῶν ἀρχόντων
  choice: من الرؤساء
  rationale: تشير الكلمة هنا إلى أصحاب السلطة والقيادة المعترف بهم بين اليهود. و«الرؤساء» موجزة ومألوفة وتناسب السياق المؤسسي.
- source_word: ἐπίστευσεν εἰς αὐτόν
  choice: آمن به
  rationale: هذه هي الصياغة العربية الطبيعية لعبارة يوحنا المألوفة πιστεύω εἰς، وتحفظ دلالة الإيمان الموجَّه إلى شخص.
- source_word: ἢ
  choice: أو
  rationale: تنقل أداة العطف ببساطة من غير إضافة معنى تصاعدي غير مصرح به.
- source_word: ἐκ τῶν Φαρισαίων
  choice: من الفريسيين
  rationale: تحفظ معنى الانتماء إلى الجماعة، وتوازي عبارة «من الرؤساء».
theological_decisions:
- issue: القوة البلاغية للسؤال المنفي
  choice: الإبقاء على السؤال البلاغي الذي يتوقع جوابًا بالنفي
  alternative: ما آمن به أحد من الرؤساء أو الفريسيين
  rationale: تفيد «μή τις» أن المتكلمين يتوقعون جواب «لا»، لكن النص اليوناني يظل سؤالًا. لذلك تحافظ الترجمة على صيغته وعلى نبرة الاحتقار الضمنية من غير أن تحوّلها إلى تقرير صريح.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعملت «أفهل» لإبراز اتصال السؤال بالسياق وقوته البلاغية، مع إبقاء الجواب المتوقع ضمنيًا لا مصرحًا به.
