  text: εἶπεν οὖν ὁ Ἰησοῦς· Ἔτι ⸂χρόνον μικρὸν⸃ μεθ’ ὑμῶν εἰμι καὶ ὑπάγω πρὸς τὸν πέμψαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/033.yaml
  text: So Jesus said[a], “I am with you a little while longer[b], and I am going to the one who sent me.”
translation:
  language: ar
  text: 'فقال يسوع: «ما زلتُ معكم وقتًا قصيرًا، وأمضي إلى الذي أرسلني».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: المقصود بـ«الذي أرسلني» هو الآب، كما يتضح من السياق الأوسع في إنجيل يوحنا.
    reason: cross_reference
lexical_decisions:
- source_word: οὖν
  choice: فـ
  rationale: تفيد الفاء استمرار السياق وارتباط قول يسوع بما سبقه، بصياغة عربية طبيعية موجزة.
- source_word: Ἔτι χρόνον μικρόν
  choice: ما زلتُ معكم وقتًا قصيرًا
  rationale: ينقل «ما زلت» معنى ἔτι، وينقل «وقتًا قصيرًا» الدلالة الزمنية المباشرة للعبارة، مع الحفاظ على ترتيب عربي واضح.
- source_word: μεθ’ ὑμῶν εἰμι
  choice: معكم
  rationale: أُدمج فعل الكينونة في تركيب «ما زلتُ معكم»، وهو التعبير العربي الطبيعي المطابق لمعنى استمرار الحضور.
- source_word: καὶ ὑπάγω
  choice: ثم أمضي
  rationale: «أمضي» تنقل معنى الذهاب والمغادرة في ὑπάγω، و«ثم» توضح التعاقب المفهوم من بقاء وقت قصير قبل الذهاب.
- source_word: πρὸς τὸν πέμψαντά με
  choice: إلى الذي أرسلني
  rationale: يحافظ على اسم الفاعل الموصول في اليونانية دون التصريح في المتن بهوية المُرسِل.
theological_decisions:
- issue: هوية «الذي أرسلني»
  choice: إبقاء العبارة «الذي أرسلني» في المتن
  alternative: إلى الآب الذي أرسلني
  rationale: السياق اليوحناوي يدل على الآب، لكن النص اليوناني هنا يعبّر عنه بطريق غير مباشر؛ لذلك حُفظ التعبير كما هو، مع توضيح المرجع في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «ما زلت» لإبراز معنى الاستمرار، و«أمضي» للمحافظة على بساطة الفعل وما يحمله في سياق يوحنا من معنى الرحيل. وُضعت علامة الحاشية بعد الجملة التي تشرحها.
