source:
  edition: SBLGNT
  text: ⸀οὐχ ἡ γραφὴ εἶπεν ὅτι ἐκ τοῦ σπέρματος Δαυίδ, καὶ ἀπὸ Βηθλέεμ τῆς κώμης ὅπου ἦν Δαυίδ, ⸂ἔρχεται ὁ χριστός⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/042.yaml
  text: Has not the Scripture said that the Messiah comes from the offspring of David and from Bethlehem[a], the village where David was?
translation:
  language: ar
  text: أَلَمْ يَقُلِ الْكِتَابُ إِنَّ الْمَسِيحَ يَأْتِي مِنْ نَسْلِ دَاوُدَ، وَمِنْ بَيْتِ لَحْمٍ، الْقَرْيَةِ الَّتِي كَانَ فِيهَا دَاوُدُ؟
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ γραφή
  choice: الكتاب
  rationale: يشير التعبير في هذا السياق إلى الكتاب المقدس بوصفه شاهدًا ذا سلطان، و«الكتاب» هو المقابل العربي المألوف والموجز.
- source_word: εἶπεν
  choice: قال
  rationale: نُقل الماضي اليوناني بصيغة الماضي العربية الطبيعية داخل السؤال البلاغي، من غير حاجة إلى تركيب يفيد تمام المعنى.
- source_word: ἐκ τοῦ σπέρματος Δαυίδ
  choice: من نسل داود
  rationale: يدل σπέρμα هنا على السلالة والنسب، و«نسل» يحفظ هذا المعنى بوضوح من غير إيحاء مادي غير مقصود.
- source_word: ἀπὸ Βηθλέεμ
  choice: من بيت لحم
  rationale: تفيد ἀπό المنشأ أو المصدر، و«من» هي الصياغة العربية الطبيعية.
- source_word: τῆς κώμης
  choice: القرية
  rationale: تعني κώμη مستوطنة صغيرة أو قرية، و«القرية» أدق من «المدينة».
- source_word: ὅπου ἦν Δαυίδ
  choice: التي كان فيها داود
  rationale: تحفظ الصياغة بساطة الأصل وغموضه النسبي، ولا تضيف تفسيرًا مثل «التي وُلد فيها» أو «التي كان منها».
- source_word: ἔρχεται
  choice: يأتي
  rationale: يحفظ المضارع في العبارة التي تعرض التوقع الكتابي بشأن مجيء المسيح ومنشئه.
- source_word: ὁ χριστός
  choice: المسيح
  rationale: اللفظ هنا لقب للمَلِك المنتظر، و«المسيح» هو المقابل العربي الراسخ والدقيق للقب اليوناني.
theological_decisions:
- issue: ترجمة ὁ χριστός بوصفه لقبًا
  choice: المسيح
  alternative: الخرستوس (نقل صوتي)
  rationale: يعمل اللفظ في هذا الجدال بوصفه لقبًا يهوديًا للملك الموعود؛ لذلك تُرجمت دلالته بدل الاكتفاء بنقله صوتيًا، من غير تحميله معنى طائفيًا إضافيًا.
translation_notes:
  register: صياغة عربية فصحى معاصرة، واضحة ووقورة. حُفظ السؤال البلاغي، كما حُفظت البنية التفسيرية التي تصف بيت لحم بأنها القرية التي كان فيها داود، من غير توسيع تفسيري.
