id: JHN.7.8
reference: John 7:8
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὑμεῖς ἀνάβητε εἰς τὴν ⸀ἑορτήν· ἐγὼ ⸀οὐκ ἀναβαίνω εἰς τὴν ἑορτὴν ταύτην, ὅτι ὁ ⸂ἐμὸς καιρὸς⸃ οὔπω πεπλήρωται.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/008.yaml
  text: You go up to the feast[a]. I am not going up to this feast[b], because my time has not yet come to fulfillment.
translation:
  language: ar
  text: اصعدوا أنتم إلى العيد. أمّا أنا فلا أصعد إلى هذا العيد[a]، لأن وقتي[b] لم يكتمل بعد.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ بعض المخطوطات: «أمّا أنا فلا أصعد إلى هذا العيد بعدُ»، أي: ليس الآن.'
    reason: textual_variant
  - marker: b
    text: 'أو: «موعدي المحدد».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνάβητε
  choice: اصعدوا
  rationale: يحفظ معنى الصعود في سياق التوجّه إلى أورشليم للاحتفال بالعيد، وهو تعبير عربي واضح ومألوف في هذا السياق.
- source_word: ἑορτή
  choice: العيد
  rationale: ينقل معنى المناسبة الدينية الاحتفالية بدقة وبصياغة عربية طبيعية.
- source_word: οὐκ ἀναβαίνω
  choice: فلا أصعد
  rationale: يتبع قراءة SBLGNT «οὐκ» (لا)، ويحافظ على صيغة المضارع من غير إدخال معنى «ليس بعد» في المتن.
- source_word: ταύτην
  choice: هذا
  rationale: ينقل اسم الإشارة الذي يحدد العيد الجاري الحديث عنه.
- source_word: καιρός
  choice: وقتي
  rationale: صياغة موجزة وطبيعية تحفظ إمكان دلالة اللفظة على الوقت أو الموعد الملائم من غير أن تحسم في المتن أنه موعد معيّن.
- source_word: πεπλήρωται
  choice: لم يكتمل بعد
  rationale: يحفظ معنى بلوغ التمام الكامن في صيغة الفعل التامة المبنية للمجهول، مع تعبير عربي طبيعي أوضح من الترجمة الحرفية الثقيلة.
theological_decisions:
- issue: الاختلاف النصي في قول يسوع عن صعوده إلى العيد
  choice: 'اتباع قراءة SBLGNT «οὐκ» في المتن: «فلا أصعد إلى هذا العيد».'
  alternative: 'تقرأ بعض المخطوطات «οὔπω»: «فلا أصعد إلى هذا العيد بعدُ».'
  rationale: تُبقي الترجمة التوتر الظاهر مع صعود يسوع لاحقًا ولا تحلّه بإدخال «بعدُ» في المتن، مع إثبات القراءة البديلة المهمة في الحاشية بشفافية.
- issue: دلالة καιρός
  choice: وقتي
  alternative: موعدي المحدد
  rationale: «وقتي» يحفظ سعة اللفظة واحتمال الإشارة إلى توقيت ذي تعيين إلهي، بينما «موعدي المحدد» يصرّح بما قد يكون ضمنيًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «أمّا أنا» لإبراز المقابلة التي يدل عليها الضمير اليوناني الصريح، وحُفظ «اصعدوا/أصعد» لاتساق الصورة المكانية في سياق الذهاب إلى العيد.
