  text: Ἤδη δὲ τῆς ἑορτῆς μεσούσης ⸀ἀνέβη Ἰησοῦς εἰς τὸ ἱερὸν καὶ ἐδίδασκεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/014.yaml
  text: When the feast was already half over[c][b][a], Jesus went up into the temple and was teaching.
translation:
  language: ar
  text: ولمّا كان العيد قد انتصف[a]، صعد يسوع إلى الهيكل[b]، وكان يعلِّم[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ولمّا صار العيد في منتصفه».'
    reason: lexical_alternative
  - marker: b
    text: اللفظ اليوناني هنا يشير إلى مجمّع الهيكل أو ساحاته، لا إلى المقدس الداخلي تحديدًا.
    reason: cultural_note
  - marker: c
    text: 'تفيد الصيغة اليونانية أن التعليم كان مستمرًّا؛ ويمكن ترجمتها: «وكان مستمرًّا في التعليم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤδη δὲ
  choice: ولمّا كان ... قد
  rationale: تؤدي الواو الانتقال السردي الخفيف الذي تحمله δὲ، ويعبّر تركيب «كان قد» في السياق عن بلوغ العيد هذه المرحلة بالفعل من غير إثقال العبارة بلفظ زائد.
- source_word: τῆς ἑορτῆς μεσούσης
  choice: كان العيد قد انتصف
  rationale: ينقل التركيب الزمني المطلق بالجر معنى وصول العيد إلى منتصفه، بعبارة عربية واضحة وطبيعية.
- source_word: ἀνέβη
  choice: صعد
  rationale: يحفظ الدلالة الاتجاهية للفعل، وهي الصعود إلى أورشليم أو إلى نطاق الهيكل.
- source_word: Ἰησοῦς
  choice: يسوع
  rationale: الصيغة العربية المعيارية للاسم.
- source_word: εἰς τὸ ἱερὸν
  choice: إلى الهيكل
  rationale: «الهيكل» هو المقابل العربي المألوف، مع توضيح أن ἱερόν يدل هنا على مجمّع الهيكل وساحاته، لا على المقدس الداخلي وحده.
- source_word: ἐδίδασκεν
  choice: كان يعلِّم
  rationale: ينقل صيغة الماضي الناقص بوصفها فعلاً مستمراً، من غير إضافة معنى البدء غير المصرح به.
theological_decisions:
- issue: مدلول ἱερόν
  choice: الهيكل، بمعنى مجمّع الهيكل وساحاته
  alternative: المقدس الداخلي أو مبنى الهيكل وحده
  rationale: اللفظ اليوناني ἱερόν أوسع من ναός، ولذلك لا ينبغي أن توحي الترجمة بأن يسوع كان داخل المقدس الداخلي.
- issue: قيمة الماضي الناقص في ἐδίδασκεν
  choice: كان يعلِّم
  alternative: أخذ يعلِّم / بدأ يعلِّم
  rationale: الصيغة تصوّر التعليم فعلاً جارياً، ولا تفرض بذاتها معنى الشروع؛ لذا حُفظ التوتر الزمني دون تفسير زائد.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة وموقّرة. استُخدم «ولمّا» لربط الظرف الزمني بالفعل الرئيس بسلاسة، وحُفظت دلالة الاستمرار في «كان يعلِّم» من غير إدخال معنى الشروع.
