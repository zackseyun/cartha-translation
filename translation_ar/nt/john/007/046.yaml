lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: أجاب
  rationale: فعل سردي طبيعي في العربية يؤدي معنى الرد في سياق الحوار، وصيغة المفرد جائزة لأن الفاعل جمع غير عاقل لفظًا.
- source_word: οἱ ὑπηρέται
  choice: الحرس
  rationale: يدل السياق في يوحنا 7:32، 45 على رجال أُرسلوا للقبض على يسوع؛ و«الحرس» يوضح وظيفتهم من غير التحديد التفسيري الزائد في «شرطة الهيكل».
- source_word: Οὐδέποτε
  choice: لم... قط
  rationale: تركيب عربي فصيح وطبيعي ينقل النفي المطلق عبر الزمن.
- source_word: ἐλάλησεν
  choice: يتكلم
  rationale: جاء بعد «لم» مجزومًا، وهو المقابل العربي الطبيعي للفعل اليوناني الدال على الكلام.
- source_word: οὕτως
  choice: هكذا
  rationale: ينقل دلالة الكيفية بإيجاز ووضوح.
- source_word: ἄνθρωπος
  choice: إنسان
  rationale: يحافظ على الاسم المفرد وعلى القوة التمثيلية العامة للكلمة اليونانية، مع صياغة عربية طبيعية لا تحصر المعنى في ذكر بالغ.
theological_decisions:
- issue: القوة العامة لصيغة المفرد ἄνθρωπος
  choice: إنسان
  alternative: أحد
  rationale: «إنسان» يقابل اللفظ اليوناني المفرد مباشرة ويحفظ الإشارة إلى البشرية، بينما «أحد» طبيعي أيضًا لكنه يخفف الصورة الاسمية الموجودة في الأصل.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم «الحرس» للدلالة الوظيفية، وصيغ النفي بـ«لم... قط» للمحافظة على قوة Οὐδέποτε.
