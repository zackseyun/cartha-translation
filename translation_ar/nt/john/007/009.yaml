lexical_decisions:
- source_word: ταῦτα
  choice: هذه الأمور
  rationale: اسم الإشارة المحايد في صيغة الجمع يعود إلى ما قاله يسوع في الآيات السابقة؛ وصيغة «هذه الأمور» تحفظ دلالة الجمع من غير إضافة تفسيرية.
- source_word: δὲ εἰπὼν
  choice: وبعد أن قال
  rationale: يعبّر اسم الفاعل اليوناني في صيغة الماضي عن فعل سبق الفعل الرئيس، فجاء التركيب العربي الزمني طبيعيًا، مع الواو لربط حركة السرد بما قبلها.
- source_word: αὐτὸς
  choice: هو
  rationale: ذِكر الضمير صراحةً بعد الفعل في العربية يحفظ قدرًا من التوكيد الموجود في اليونانية، ويبرز بقاء يسوع في مقابل ذهاب إخوته المفهوم من السياق، من دون مبالغة مثل «هو نفسه».
- source_word: ἔμεινεν
  choice: بقي
  rationale: «بقي» هو المقابل العربي المباشر والطبيعي للفعل μένω في هذا السياق المكاني، ويحافظ كذلك على اللفظ اليوحناوي المتكرر.
- source_word: ἐν τῇ Γαλιλαίᾳ
  choice: في الجليل
  rationale: ترجمة مكانية مباشرة تحافظ على اسم الإقليم كما هو شائع في العربية الكتابية المعاصرة.
