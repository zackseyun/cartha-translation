  text: μὴ κρίνετε κατ’ ὄψιν, ἀλλὰ τὴν δικαίαν κρίσιν ⸀κρίνετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/024.yaml
  text: Do not judge according to appearance[a], but judge with righteous judgment.
translation:
  language: ar
  text: لا تحكموا بحسب الظاهر[a]، بل احكموا حكمًا عادلًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لا تحكموا على أساس المظهر الخارجي، بل احكموا حكمًا عادلًا».'
    reason: بديل معجمي يصرّح بأن ὄψις تشير هنا إلى المظهر الخارجي أو ما يبدو للناظر.
lexical_decisions:
- source_word: μὴ κρίνετε
  choice: لا تحكموا
  rationale: ينقل صيغة النهي بوضوح وإيجاز، من غير افتراض أن المقصود هو التوقف عن فعل جارٍ.
- source_word: κατ’ ὄψιν
  choice: بحسب الظاهر
  rationale: تعبير عربي طبيعي يدل على الحكم استنادًا إلى ما يبدو للعين أو إلى الانطباع السطحي، ويحافظ على إفراد اللفظ اليوناني.
- source_word: ἀλλὰ
  choice: بل
  rationale: تلائم الانتقال من النهي إلى الأمر المقابل، وتبرز التضاد القوي بين طريقتي الحكم.
- source_word: τὴν δικαίαν κρίσιν
  choice: حكمًا عادلًا
  rationale: صياغة عربية سليمة تحفظ معنى κρίσις ومعنى δικαία بوصفه حكمًا موافقًا للعدل، من غير حصره في إجراء قضائي رسمي.
- source_word: κρίνετε
  choice: احكموا
  rationale: تكرار جذر «حكم» في الشطرين يحفظ الموازاة البلاغية الموجودة في اليونانية.
theological_decisions:
- issue: دلالة δικαίαν في السياق الأخلاقي القضائي
  choice: عادلًا
  alternative: بارًّا
  rationale: «عادلًا» أفصح وأوضح مع «حكمًا» في العربية المعاصرة، وينقل الاستقامة والإنصاف المقصودين من غير إدخال دلالة عقائدية خاصة؛ أما «حكمًا بارًّا» فأقل طبيعية وقد يوحي بوصف الشخص أكثر من وصف الحكم.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة، مع الحفاظ على صيغة الجمع، والتقابل بين النهي والأمر، وتكرار فعل الحكم في الأصل.
