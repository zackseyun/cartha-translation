  text: The crowd answered[a], “You have a demon. Who is seeking to kill you?”
translation:
  language: ar
  text: 'فأجاب الجمع: «بك شيطان![a] مَن يطلب أن يقتلك؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أنت ممسوس بشيطان». وحرفيًا: «لديك شيطان».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: فأجاب
  rationale: فعل سردي مألوف في الحوار، ينقل معنى الرد بوضوح وفصاحة.
- source_word: ὁ ὄχλος
  choice: الجمع
  rationale: يدل اللفظ على جماعة من الناس؛ و«الجمع» تعبير عربي واضح وموجز يلائم المشهد.
- source_word: Δαιμόνιον ἔχεις
  choice: بك شيطان
  rationale: يحافظ هذا التعبير العربي الطبيعي على صورة الأصل الحرفية، أي وجود شيطان مع المخاطَب، من غير أن يضيف تحديدًا تفسيريًا لدرجة تسلطه عليه.
- source_word: τίς
  choice: مَن
  rationale: يحافظ على أداة الاستفهام الصريحة وعلى الصيغة البلاغية التي رد بها الجمع.
- source_word: ζητεῖ
  choice: يطلب
  rationale: ينقل المضارع الدال على السعي الجاري، وهو تعبير فصيح وطبيعي مع المصدر المؤول التالي.
- source_word: ἀποκτεῖναι
  choice: أن يقتلك
  rationale: ترجمة مباشرة للفعل بمعنى القتل، من غير إضافة دلالة قانونية أو أخلاقية ليست صريحة في اللفظ.
theological_decisions:
- issue: صياغة اتهام الجمع ليسوع في Δαιμόνιον ἔχεις
  choice: بك شيطان
  alternative: أنت ممسوس بشيطان
  rationale: النص يورد اتهام الجمع العدائي ولا يقرّه. وتحافظ الصياغة المختارة على صورة الأصل من غير أن تحسم طبيعة تأثير الشيطان أو درجته بتعبير تفسيري أضيق.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة. استُخدمت «بك شيطان» لأنها طبيعية في العربية وتحافظ على قربها من تركيب الأصل، مع توضيح البديل والحرفية في الحاشية.
