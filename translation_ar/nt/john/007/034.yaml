base_translation:
  language: en
  yaml_path: translation/nt/john/007/034.yaml
  text: You will seek me and will not find me[a], and where I am[b], you are not able to come.
translation:
  language: ar
  text: ستطلبونني[a] ولن تجدونني، وحيث أكون أنا، لا تقدرون أن تأتوا[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ستبحثون عني».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «لا تستطيعون المجيء».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητήσετέ με
  choice: ستطلبونني
  rationale: صيغة مستقبل للمخاطبين الجمع، ومعناها هنا السعي إلى العثور على يسوع. يحافظ «تطلبونني» على المقابلة المباشرة مع «فلا تجدونني»، من غير أن يضفي على الفعل بالضرورة معنى روحيا خاصا.
- source_word: οὐχ εὑρήσετε
  choice: فلا تجدونني
  rationale: نفي مباشر لفعل مستقبل. جاءت الفاء لتبيين النتيجة الطبيعية في العربية من غير إضافة توكيد غير موجود في اليونانية.
- source_word: ὅπου εἰμὶ ἐγώ
  choice: وحيث أكون أنا
  rationale: ينقل «حيث» الدلالة المكانية، ويحافظ إظهار الضمير «أنا» على التقابل الذي يؤكده ورود ἐγώ صراحة.
- source_word: ὑμεῖς οὐ δύνασθε ἐλθεῖν
  choice: لا تقدرون أن تأتوا
  rationale: يُظهر معنى القدرة في δύνασθε ويحافظ على ضمير المخاطبين الجمع في صيغة الفعل، من غير تحويل عدم القدرة إلى مجرد منع أو عدم إذن.
theological_decisions:
- issue: طبيعة عدم القدرة في قول يسوع «لا تقدرون أن تأتوا»
  choice: صياغته خبرا عن عدم القدرة من غير تحديد سببها
  alternative: لا يجوز لكم أن تأتوا
  rationale: يدل δύνασθε على القدرة لا على الإذن، والنص نفسه لا يحدد هل عدم القدرة أخلاقي أم روحي أم قضائي أم مؤقت؛ لذلك تُحفظ المسألة من غير حسم تفسيري.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. اختير «تطلبونني» لما فيه من قرب من اللفظ اليوناني ومن انسجام مع «تجدونني»، واختير «لا تقدرون أن تأتوا» لإبراز معنى عدم القدرة مع بقاء سببها مفتوحا كما في الأصل.
