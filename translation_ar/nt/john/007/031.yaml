  text: ⸂ἐκ τοῦ ὄχλου δὲ πολλοὶ⸃ ἐπίστευσαν εἰς αὐτόν, καὶ ⸀ἔλεγον· Ὁ χριστὸς ὅταν ἔλθῃ ⸀μὴ πλείονα ⸀σημεῖα ποιήσει ὧν οὗτος ἐποίησεν;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/031.yaml
  text: But many from the crowd believed in him[a], and they were saying, “When the Messiah comes, he will not do more signs than this man has done, will he?”
translation:
  language: ar
  text: 'لكن كثيرون من الجمع آمنوا به، وكانوا يقولون: «حين يأتي المسيح[a]، فلن يصنع آيات أكثر مما صنع هذا، أليس كذلك؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي «الممسوح»؛ وهو لقب الملك المنتظر.
    reason: توضيح دلالة اللقب اليوناني Χριστός في سياقه اليهودي المسياني.
lexical_decisions:
- source_word: ἐκ τοῦ ὄχλου δὲ πολλοὶ
  choice: لكن كثيرين من الجمع
  rationale: تحفظ «من الجمع» معنى أن هؤلاء فئة من جمع أكبر، وتؤدي «لكن» التباين اللطيف الذي تشير إليه δέ مع سياق المقاومة وعدم الإيمان.
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: آمنوا به
  rationale: تعبير عربي طبيعي ودقيق عن إيمان موجَّه إلى شخص، من غير إضافة تفسيرية مثل «وضعوا ثقتهم فيه».
- source_word: ἔλεγον
  choice: كانوا يقولون
  rationale: يحفظ صيغة الماضي الناقص اليونانية التي توحي بقول مستمر أو متكرر.
- source_word: Ὁ χριστός
  choice: المسيح
  rationale: اللفظ هنا لقب يهودي مسياني، و«المسيح» هو المقابل العربي الراسخ ويحفظ دلالة «الممسوح».
- source_word: ὅταν ἔλθῃ
  choice: حين يأتي
  rationale: ينقل الإحالة المستقبلية غير المحددة بصورة عربية طبيعية، من غير تحويلها إلى شرط شاكّ مثل «إن جاء».
- source_word: μὴ ... ποιήσει
  choice: فلن يصنع ... أليس كذلك؟
  rationale: يحفظ توقع الجواب بالنفي الذي تدل عليه μή، مع صياغة استفهامية عربية واضحة.
- source_word: πλείονα σημεῖα
  choice: آيات أكثر
  rationale: «أكثر» تحافظ على المقارنة من جهة العدد لا العظمة، و«آيات» تصون مصطلح يوحنا الدال على الأعمال التي تشير إلى هوية يسوع.
- source_word: οὗτος ἐποίησεν
  choice: مما صنع هذا
  rationale: «هذا» ينقل طريقة إشارة الجمع إلى يسوع، والفعل «صنع» يلائم الاستعمال المتعلق بالآيات من غير زيادة لفظ «الرجل» غير الموجود صراحة في اليونانية.
theological_decisions:
- issue: دلالة Χριστός بوصفه لقبًا
  choice: المسيح
  alternative: الممسوح
  rationale: السياق يتحدث عن الشخصية المنتظرة «حين يأتي»، ولذلك حُفظ اللقب المسياني بصيغته العربية المألوفة، مع بيان معناه الاشتقاقي في الحاشية.
- issue: قوة الاستفهام المنفي بـ μή
  choice: فلن يصنع ... أليس كذلك؟
  alternative: أفسيصنع ...؟
  rationale: 'الصياغة المختارة تُظهر أن المتكلمين يتوقعون جوابًا بالنفي: لا يُنتظر أن يصنع المسيح آيات أكثر مما صنع يسوع. وهي تحافظ على الاستدلال المسياني للجمع من غير تحويله إلى تصريح مباشر محسوم بهوية يسوع.'
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم «الجمع» اتساقًا مع لغة السرد الإنجيلي، و«كانوا يقولون» لحفظ الاستمرار، كما صيغ السؤال بذيل «أليس كذلك؟» لإبراز توقع الجواب بالنفي.
