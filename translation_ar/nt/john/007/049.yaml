base_translation:
  language: en
  yaml_path: translation/nt/john/007/049.yaml
  text: But this crowd[a], which does not know the law[b], is accursed.
translation:
  language: ar
  text: أمّا هذا الجمع الذي لا يعرف الشريعة[b]، فهم ملعونون.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «واقعون تحت لعنة».'
    reason: lexical_alternative
  - marker: b
    text: «الشريعة» هنا هي شريعة اليهود، أي التوراة.
    reason: cultural_note
lexical_decisions:
- source_word: ἀλλὰ
  choice: أَمَّا ... فَـ
  rationale: تنقل أداة الاستدراك والمقابلة مع الكلام السابق بصياغة عربية طبيعية، وتبرز ازدراء المتكلمين لهذا الجمع.
- source_word: ὁ ὄχλος οὗτος
  choice: هٰذَا الْجَمْعُ
  rationale: «الجمع» لفظ عربي واضح ومحايد نسبيًا يدل على جمهور الناس، من غير الإيحاء السلبي الزائد الذي قد تحمله كلمة «الرعاع».
- source_word: ὁ μὴ γινώσκων
  choice: الَّذِي لَا يَعْرِفُ
  rationale: يحافظ على وظيفة اسم الفاعل المعرّف بوصفه نعتًا للجمع، وعلى معنى الحالة المستمرة في السياق.
- source_word: τὸν νόμον
  choice: الشَّرِيعَةَ
  rationale: تشير هنا إلى شريعة اليهود، أي التوراة، و«الشريعة» أوضح للقارئ العربي من «الناموس» مع الحفاظ على المرجع الثقافي.
- source_word: ἐπάρατοί
  choice: مَلْعُونُونَ
  rationale: تنقل قوة الحكم العدائي في اليونانية بلفظ عربي مباشر، ويمكن فهمها أيضًا بمعنى أنهم واقعون تحت لعنة.
- source_word: εἰσιν
  choice: فَهُمْ
  rationale: يعكس الجمع اليوناني ويعامل أفراد الجمع بوصفهم جماعة من الناس، وهو أسلوب عربي طبيعي مع الاسم الجمعي.
theological_decisions:
- issue: هل يُعرض حكم المتكلمين العدائي كأنه تقرير لاهوتي من الراوي؟
  choice: إبقاء القول إدانة مباشرة على لسان خصوم يسوع، من غير تلطيف ولا إضافة مسافة تفسيرية.
  alternative: إضافة عبارة مثل «ويزعمون أنهم ملعونون» لإبعاد الراوي عن الحكم.
  rationale: النص جزء من كلام مباشر، وسياقه يحدد هوية المتكلمين. لذلك تُحفظ حدّة قولهم من غير أن تُنسب موافقته إلى الراوي، ومن غير إضافة ألفاظ ليست في الأصل.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُعمل «الجمع» بدل ألفاظ تحمل احتقارًا زائدًا غير لازم من الأصل، و«الشريعة» بدل «الناموس» لزيادة الوضوح. وُضع علامتا الحاشيتين بعد الجملة؛ [a] تتعلق بـ«ملعونون»، و[b] بـ«الشريعة».
