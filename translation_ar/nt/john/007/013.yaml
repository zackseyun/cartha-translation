lexical_decisions:
- source_word: οὐδεὶς
  choice: لم يكن أحد
  rationale: ينقل ضمير النفي الشامل بصياغة عربية فصيحة تلائم الفعل الماضي الناقص الدلالة.
- source_word: μέντοι
  choice: ومع ذلك
  rationale: تؤدي معنى الاستدراك الخفيف المتصل بتباين أقوال الجموع في السياق السابق.
- source_word: παρρησίᾳ
  choice: علنًا
  rationale: تعبّر هنا عن الكلام على الملأ بلا إخفاء، مع إبقاء احتمال الجرأة والصراحة ضمن الدلالة السياقية.
- source_word: ἐλάλει
  choice: كان يتكلم
  rationale: تركيب «كان يتكلم» يحافظ على الجانب الاستمراري أو الاعتيادي لصيغة الماضي الناقص اليونانية.
- source_word: περὶ αὐτοῦ
  choice: عنه
  rationale: مقابل عربي طبيعي ومباشر لحرف الجر مع ضمير الغائب.
- source_word: διὰ τὸν φόβον
  choice: خوفًا من
  rationale: صياغة عربية موجزة وطبيعية تؤدي علاقة السبب وتحافظ على البناء الاسمي للخوف.
- source_word: τῶν Ἰουδαίων
  choice: اليهود
  rationale: يحافظ على اللفظ اليوناني العام دون حسم مرجعه في المتن، وتوضح الحاشية أن المقصود في هذا السياق قد يكون السلطات أو القادة اليهود في اليهودية.
theological_decisions:
- issue: مرجع «اليهود» في السرد اليوحناوي
  choice: إبقاء «اليهود» في المتن مع حاشية توضح الاحتمال السياقي الأضيق
  alternative: القادة اليهود؛ السلطات اليهودية في اليهودية
  rationale: يحفظ هذا الاختيار عمومية اللفظ اليوناني والتوتر الدلالي، مع الحد من إساءة فهمه بوصفه تعميمًا على جميع اليهود عبر العصور.
