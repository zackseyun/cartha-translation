  text: Ὡς οὖν ἀπέβησαν εἰς τὴν γῆν βλέπουσιν ἀνθρακιὰν κειμένην καὶ ὀψάριον ἐπικείμενον καὶ ἄρτον.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/009.yaml
  text: So when they got out onto the land[a], they saw a charcoal fire laid there, and fish lying on it[b], and bread.
translation:
  language: ar
  text: فَلَمَّا نَزَلُوا إِلَى الْبَرِّ[a]، رَأَوْا نَارًا مِنَ الْفَحْمِ[b] قَدْ وُضِعَتْ هُنَاكَ، وَسَمَكَةً مَوْضُوعَةً عَلَيْهَا، وَخُبْزًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وصلوا إلى الشاطئ». واليونانية أقرب حرفيًا إلى: «نزلوا إلى البر».'
    reason: lexical_alternative
  - marker: b
    text: يرد اللفظ المترجم «نارًا من الفحم» أيضًا في يوحنا 18:18، فينشئ صلة لفظية بين هذا المشهد والمكان الذي أنكر فيه بطرس يسوع.
    reason: cross_reference
lexical_decisions:
- source_word: Ὡς οὖν
  choice: فَلَمَّا
  rationale: تؤدي المعنى الزمني مع استمرار السرد بصورة عربية طبيعية؛ وارتباط الجملة بما قبلها ظاهر من السياق دون الحاجة إلى إثقالها بلفظ استنتاجي مستقل.
- source_word: ἀπέβησαν εἰς τὴν γῆν
  choice: نَزَلُوا إِلَى الْبَرِّ
  rationale: ينقل الخروج من القارب والوصول إلى اليابسة، مع استعمال «البر» بالمعنى المقابل للماء، من غير تخصيص اللفظ اليوناني بالشاطئ وحده.
- source_word: βλέπουσιν
  choice: رَأَوْا
  rationale: المضارع اليوناني مضارع تاريخي، والماضي هو الأسلوب الطبيعي في السرد العربي هنا.
- source_word: ἀνθρακιὰν
  choice: نَارًا مِنَ الْفَحْمِ
  rationale: تعبير واضح ودقيق عن نار الفحم، ويحافظ على الصلة اللفظية مع يوحنا 18:18.
- source_word: κειμένην
  choice: مُعَدَّةً هُنَاكَ
  rationale: يفيد أن نار الفحم كانت موجودة ومهيأة في الموضع؛ وهو أسلس في العربية من ترجمة حرفية مثل «موضوعة» عند وصف النار.
- source_word: ὀψάριον
  choice: سَمَكَةٌ
  rationale: يحافظ على صيغة المفرد في اليونانية وعلى معنى السمك بوصفه طعامًا، من غير إضافة أنها مطهية صراحة.
- source_word: ἐπικείμενον
  choice: وَعَلَيْهَا
  rationale: يبيّن بوضوح أن السمكة كانت فوق نار الفحم، ويؤدي علاقة المكان التي يدل عليها اسم الفاعل اليوناني.
- source_word: ἄρτον
  choice: خُبْزًا
  rationale: ترجمة عامة غير متكلفة لا تحدد عدد الأرغفة أو شكلها بما يتجاوز النص.
theological_decisions:
- issue: المضارع التاريخي في βλέπουσιν
  choice: صيغة الماضي «رأوا»
  alternative: 'الإبقاء على الحاضر السردي: «يرون»'
  rationale: الاختيار أسلوبي لا عقدي؛ فالماضي أوضح وأطبع في السرد العربي الحديث، ولا يغير ترتيب الحدث أو مضمونه.
- issue: الصلة اللفظية لنار الفحم بإنكار بطرس
  choice: الحفاظ على التعبير نفسه «نار من الفحم» مع إيضاح الصلة في الحاشية
  alternative: تعبير عام مثل «نار» أو «موقد»
  rationale: اللفظ اليوناني ἀνθρακιά نادر في العهد الجديد ويرد أيضًا في يوحنا 18:18؛ الحفاظ عليه يصون الصدى السردي من غير فرض تفسير لاهوتي بعينه.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُعمل «البر» في مقابل الماء، وصيغ الفعل بالماضي ملاءمةً للسرد العربي. حوفظ على مفرد «سمكة» وعلى التمييز الدلالي لنار الفحم دون توسيع تفسيري.
