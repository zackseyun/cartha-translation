  to: فَلَمَّا نَزَلُوا إِلَى الْبَرِّ[a]، رَأَوْا نَارًا مِنَ الْفَحْمِ[b] قَدْ وُضِعَتْ هُنَاكَ، وَسَمَكَةً مَوْضُوعَةً عَلَيْهَا، وَخُبْزًا.
  rationale: استُبدلت «مُعَدَّةً» بـ«قد وُضِعت» لتجنب الإيحاء بإعداد مقصود غير مصرح به ولتمثيل الحالة الموصوفة في κειμένην. وأُعيدت صياغة وصف السمكة لتكون مفعولًا معطوفًا لـ«رأوا» وموصوفة بأنها موضوعة على النار، موافقةً لـἐπικείμενον. ولا تمس التعديلات معنى المشهد أو الصياغة اللاهوتية.
