  text: ⸀ἔρχεται ⸀ὁ Ἰησοῦς καὶ λαμβάνει τὸν ἄρτον καὶ δίδωσιν αὐτοῖς, καὶ τὸ ὀψάριον ὁμοίως.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/013.yaml
  text: Jesus comes and takes the bread and gives it to them[b][a], and the fish likewise.
translation:
  language: ar
  text: يأتي يسوع ويأخذ الخبز ويعطيهم إياه[a]، والسمك كذلك[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «جاء يسوع وأخذ الخبز وأعطاهم إياه». تستعمل اليونانية هنا أفعالًا مضارعة في السرد عن أحداث ماضية.'
    reason: lexical_alternative
  - marker: b
    text: 'أي: وفعل بالسمك بالطريقة نفسها.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: يأتي
  rationale: أُبقي المضارع التاريخي كما في اليونانية لإظهار حيوية السرد اليوحناوي، مع إمكان التعبير عنه بالماضي في العربية.
- source_word: λαμβάνει
  choice: يأخذ
  rationale: ينقل الفعل البسيط الذي يسبق توزيع الطعام من غير إضافة معنى تفسيري مثل «يقدّم».
- source_word: τὸν ἄρτον
  choice: الخبز
  rationale: أداة التعريف تشير إلى الخبز الحاضر في الوجبة، و«الخبز» هو التعبير العربي الطبيعي.
- source_word: δίδωσιν αὐτοῖς
  choice: ويعطيهم إياه
  rationale: أُظهر المفعول المفهوم من «الخبز» بالضمير «إياه» لتكون العبارة العربية واضحة وطبيعية، من غير تحويل الفعل إلى «يخدمهم» أو «يقدّم لهم».
- source_word: τὸ ὀψάριον
  choice: السمك
  rationale: تشير الكلمة في السياق إلى السمك بوصفه طعامًا، ولا تقتضي بذاتها وصفه بالمشوي أو المطبوخ.
- source_word: ὁμοίως
  choice: كذلك
  rationale: تحافظ على إيجاز اليونانية وتفيد أن يسوع فعل بالسمك ما فعله بالخبز.
theological_decisions:
- issue: المضارع التاريخي في سياق ظهور يسوع بعد القيامة
  choice: 'الإبقاء على المضارع: «يأتي... ويأخذ... ويعطي»'
  alternative: 'صياغته بالماضي: «جاء... وأخذ... وأعطى»'
  rationale: هذا قرار سردي لا عقائدي؛ فالمضارع يحفظ ملمح الأسلوب اليوناني، بينما يؤدي الماضي المعنى الحدثي نفسه في العربية.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ومهيبة، مع الحفاظ على المضارع التاريخي والإيجاز في العبارة الأخيرة. وُضع كل رمز حاشية في المتن.
