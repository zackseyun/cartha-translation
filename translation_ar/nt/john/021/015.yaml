  text: Ὅτε οὖν ἠρίστησαν λέγει τῷ Σίμωνι Πέτρῳ ὁ Ἰησοῦς· Σίμων ⸀Ἰωάννου, ἀγαπᾷς με πλέον τούτων; λέγει αὐτῷ· Ναί, κύριε, σὺ οἶδας ὅτι φιλῶ σε. λέγει αὐτῷ· Βόσκε τὰ ἀρνία μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/015.yaml
  text: So when they had eaten breakfast[a], Jesus said to Simon Peter, “Simon, son of John, do you love me more than these?” He said to him, “Yes, Lord; you know that I love you.” He said to him[b], “Feed my lambs.”
translation:
  language: ar
  text: 'فلما تناولوا الفطور، قال يسوع لسمعان بطرس: «يا سمعان بن يوحنا، أتحبني[a] أكثر من هؤلاء[b]؟» قال له: «نعم يا رب، أنت تعلم أني أحبك». فقال له: «أطعم حملاني».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يستعمل النص اليوناني فعلين مختلفين: يسأل يسوع بالفعل ἀγαπάω («يحب»)، ويجيب بطرس بالفعل φιλέω («يحب، يكنّ مودة»). يرى بعض المفسرين فرقًا مقصودًا بينهما، ويرى آخرون أن التنويع أسلوبي. نُقل الفعلان بصيغ من «أحب» في المتن لئلا يُبالَغ في تقرير فرق لا يصرح به السياق.'
    reason: lexical_alternative
  - marker: b
    text: 'عبارة «أكثر من هؤلاء» موجزة في اليونانية ووجه المقارنة فيها غير مصرح به. فقد يكون المعنى: «أكثر مما يحبني هؤلاء»، أو «أكثر من محبتك لهؤلاء»، أو «أكثر من محبتك لهذه الأشياء».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἠρίστησαν
  choice: تناولوا الفطور
  rationale: يدل الفعل على تناول وجبة الصباح، وهذه صياغة عربية طبيعية تحفظ التحديد الزمني.
- source_word: Σίμων Ἰωάννου
  choice: يا سمعان بن يوحنا
  rationale: صيغة الإضافة اليونانية هنا تفيد النسب، و«بن يوحنا» تنقل القراءة المباشرة للنص من غير استبدالها بالصيغة التقليدية «بن يونا».
- source_word: ἀγαπᾷς / φιλῶ
  choice: أتحبني / أني أحبك
  rationale: الفعلان يمكن أن يدلا على المحبة، ولا يثبت السياق وحده وجود تدرج مقصود بينهما؛ لذلك استُعمل «أحب» في المتن مع بيان اختلاف اللفظ اليوناني في الحاشية.
- source_word: πλέον τούτων
  choice: أكثر من هؤلاء
  rationale: تحفظ العبارة إيجاز المقارنة وعدم التصريح بوجهها قدر الإمكان، مع توضيح الاحتمالات التي لا تستطيع صيغة الإشارة العربية جمعها كلها في الحاشية.
- source_word: κύριε
  choice: يا رب
  rationale: يناسب هذا اللقب مقام مخاطبة بطرس ليسوع في السياق اليوحناوي، وهو أبلغ من مجرد نداء الاحترام.
- source_word: Βόσκε
  choice: أطعم
  rationale: الفعل βόσκω يركز على إطعام القطيع، بخلاف لفظ الرعاية الأوسع، ولذلك نُقل بفعل «أطعم».
- source_word: τὰ ἀρνία μου
  choice: حملاني
  rationale: «الحملان» تنقل صورة صغار الغنم، والضمير المتصل يحفظ نسبة القطيع إلى يسوع بصياغة عربية موجزة.
theological_decisions:
- issue: هل يُفرَّق بوضوح بين ἀγαπάω وφιλέω في المتن؟
  choice: نقل الفعلين بصيغ من «أحب»، مع توثيق اختلافهما في الحاشية.
  alternative: ترجمة الأول «تحب» والثاني «أكنّ لك المودة» أو اعتبارهما درجتين مختلفتين من المحبة.
  rationale: الدلالة المقصودة من التناوب بين الفعلين موضع خلاف، ولا يصرح النص بأنه يقيم تدرجًا لاهوتيًا بين نوعين من المحبة؛ لذا لا تُفرض هذه القراءة في المتن.
- issue: مرجع المقارنة في πλέον τούτων
  choice: الإبقاء على الصيغة الموجزة «أكثر من هؤلاء» وشرح الاحتمالات في الحاشية.
  alternative: تعيين المعنى بأنه «أكثر مما يحبني هؤلاء» أو «أكثر من محبتك لهذه الأشياء».
  rationale: التركيب اليوناني يحذف الطرف أو الوجه المقارَن به، فيحتمل مقارنة محبة بطرس بمحبة الآخرين، أو مقارنة محبته ليسوع بمحبته لأشخاص أو أشياء حاضرة. تعيين احتمال واحد يضيّق النص بلا مسوغ حاسم.
translation_notes:
  register: لغة عربية فصحى معاصرة، واضحة ومهيبة. استُعمل «فلما» لوصل الحدث بما قبله، والنداء «يا سمعان» لطبيعية الخطاب العربي. وُضعت علامتا الحاشيتين عند العبارتين اللتين تتعلقان بهما مباشرة.
