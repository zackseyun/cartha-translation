  text: Μετὰ ταῦτα ἐφανέρωσεν ἑαυτὸν πάλιν ⸀ὁ Ἰησοῦς τοῖς μαθηταῖς ἐπὶ τῆς θαλάσσης τῆς Τιβεριάδος· ἐφανέρωσεν δὲ οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/001.yaml
  text: After these things[a], Jesus revealed himself again to the disciples by the Sea of Tiberias, and he revealed himself in this way.
translation:
  language: ar
  text: 'بعد هذه الأمور، أظهر يسوع نفسه[a] مرة أخرى للتلاميذ عند بحر طبرية، وأظهر نفسه على هذا النحو:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ظهر». قد يدل الفعل اليوناني على أن يجعل المرء نفسه مرئيًا أو معروفًا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: بعد هذه الأمور
  rationale: يحفظ الجمع في اسم الإشارة ويؤدي الانتقال الزمني بصياغة عربية واضحة وقريبة من الأسلوب اليوحناوي.
- source_word: ἐφανέρωσεν ἑαυτὸν
  choice: أظهر يسوع نفسه
  rationale: ينقل معنى جعل الذات ظاهرة ويحفظ قوة الضمير الانعكاسي، مع إبقاء دلالة الإفصاح والظهور معًا.
- source_word: πάλιν
  choice: مرة أخرى
  rationale: يدل بوضوح على تكرر إظهار يسوع نفسه بعد ظهوراته السابقة.
- source_word: τοῖς μαθηταῖς
  choice: للتلاميذ
  rationale: يبقى قريبًا من اليونانية التي لا تصرّح بضمير الملكية «تلاميذه».
- source_word: ἐπὶ τῆς θαλάσσης τῆς Τιβεριάδος
  choice: عند بحيرة طبريّة
  rationale: «عند» تؤدي الموقع المقصود طبيعيًا، و«بحيرة طبريّة» تسمية عربية واضحة للمسطح المائي المعروف مع الحفاظ على الاسم الوارد في النص.
- source_word: ἐφανέρωσεν δὲ οὕτως
  choice: وقد أظهر نفسه هكذا
  rationale: يحفظ تكرار الفعل للتماسك الأدبي، ويجعل العبارة تمهيدًا مباشرًا لكيفية الظهور في الرواية التالية.
theological_decisions:
- issue: لغة ظهور يسوع بعد القيامة
  choice: أظهر يسوع نفسه
  alternative: ظهر؛ أعلن نفسه
  rationale: «أظهر نفسه» يحفظ كون يسوع هو المبادر بإظهار ذاته، من غير اختزال الحدث في مجرد رؤية بصرية ولا تحميل اللفظ معنى عقائديًا أضيق من اليونانية.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعملت «بحيرة» بدل النقل الحرفي «بحر» لأنها التسمية الطبيعية المفهومة عربيًا، مع إبقاء «طبريّة». وُضعت علامة الحاشية بعد الجملة التي تكرر فيها الفعل لتبيين أن البديل يتعلق بفعل الإظهار في الآية.
