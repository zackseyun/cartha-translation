    reason: بديل معجمي طبيعي للفعل ἐφανερώθη.
lexical_decisions:
- source_word: τοῦτο ἤδη τρίτον
  choice: وكانت هذه هي المرة الثالثة
  rationale: تشير «هذه» إلى واقعة الظهور المروية للتو، وتؤدي «المرة الثالثة» معنى الترتيب الظرفي بعبارة عربية طبيعية، بينما يدل السياق على بلوغ العدد الآن ثلاث مرات.
- source_word: ἐφανερώθη
  choice: أُظهِر فيها يسوع نفسه
  rationale: يحافظ هذا التعبير على دلالة الظهور والانكشاف المقصود وعلى الصيغة المبنية للمجهول، مع إضافة «نفسه» اللازمة لوضوح العبارة العربية؛ و«ظهر» بديل سياقي سليم.
- source_word: τοῖς μαθηταῖς
  choice: للتلاميذ
  rationale: يتبع التعريف في اليونانية من غير إضافة ضمير ملكية غير مصرّح به.
- source_word: ἐγερθεὶς ἐκ νεκρῶν
  choice: بعد أن أُقيم من بين الأموات
  rationale: ينقل سبق الحدث ويحافظ على المبني للمجهول في اسم الفاعل اليوناني، كما تعكس «من بين الأموات» تركيب ἐκ νεκρῶν بوضوح.
theological_decisions:
- issue: صياغة لغة القيامة في ἐγερθεὶς ἐκ νεκρῶν
  choice: بعد أن أُقيم من بين الأموات
  alternative: بعد أن قام من بين الأموات
  rationale: الأصل مبني للمجهول، ولذلك تُحفظ هذه الصيغة بدل تحويلها إلى فعل لازم مبني للمعلوم، من غير حسم هوية الفاعل غير المذكور صراحة في الآية.
- issue: دلالة ἐφανερώθη
  choice: أُظهِر فيها يسوع نفسه
  alternative: ظهر يسوع
  rationale: يحافظ النص الرئيس على الصيغة المبنية للمجهول وعلى نبرة الإعلان أو الإظهار في الاستعمال اليوحناوي، مع إثبات البديل الطبيعي في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «أُظهِر فيها يسوع نفسه» للموازنة بين بنية الأصل المبنية للمجهول وسلامة الأسلوب العربي، مع تجنب إضافة «تلاميذه» لأن الأصل يقول «التلاميذ».
