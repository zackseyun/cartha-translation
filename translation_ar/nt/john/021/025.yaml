  to: وهناك أيضًا أمور كثيرة أخرى فعلها يسوع، ولو كُتبت واحدةً واحدةً، فأظن أن العالم نفسه لما اتسع للكتب التي ستُكتب.[a]
  rationale: تُصحَّح بنية الشرط العربية بإضافة جواب الشرط «لما اتسع»، مع إبقاء «أظن» تعليقًا شخصيًا للكاتب والمحافظة على المبالغة المكانية. كما استُبدلت «كانت ستُكتب» بـ«ستُكتب» لتمثيل النتيجة المتوقعة في الفرض بعبارة عربية أسلس. وحُدِّثت الحاشية لتطابق النص المنقح وتحافظ على البديل المعجمي للفعل χωρήσειν.
