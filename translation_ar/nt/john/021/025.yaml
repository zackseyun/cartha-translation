  terminology: «يسوع»، و«أمور كثيرة أخرى»، و«أظن»، و«العالم نفسه»، و«يتسع» اختيارات سليمة ومناسبة للسجل العربي المعاصر. استُبقيت المبالغة البلاغية من غير تفسير عقائدي.
