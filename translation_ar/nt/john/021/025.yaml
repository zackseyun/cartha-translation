  source_fidelity: 'النص يحفظ العناصر الأساسية: كثرة أعمال يسوع، والتسجيل واحدًا واحدًا، وتعليق الكاتب الشخصي، والتوكيد على العالم نفسه، وصورة السعة المكانية. لكن جواب الشرط في «لو كُتبت ... لا يتسع» يحتاج إلى صياغة شرطية عربية مكتملة، كما أن «كانت ستُكتب» توحي بزمن ماضٍ مستقبلي لا يلزم في العربية هنا.'
