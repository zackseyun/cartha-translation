base_translation:
  language: en
  yaml_path: translation/nt/john/021/025.yaml
  text: There are also many other things that Jesus did[a], which, if they were written down one by one, I suppose that not even the world itself would have room for the books being written.
translation:
  language: ar
  text: وهناك أيضًا أمور كثيرة أخرى فعلها يسوع، ولو كُتبت واحدةً واحدةً، فأظن أن العالم نفسه لما اتسع للكتب التي ستُكتب.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لما احتوى الكتب التي ستُكتب». يمكن أن يعني الفعل اليوناني «يتسع لـ» أو «يحتوي».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: و
  rationale: أداة ربط خفيفة تصل الخاتمة بما قبلها من غير إدخال دلالة زمنية غير موجودة في الأصل.
- source_word: ἄλλα πολλὰ
  choice: أمور كثيرة أخرى
  rationale: صياغة عربية طبيعية تحفظ معنى الكثرة والإضافة إلى ما دُوِّن سابقًا.
- source_word: ἃ ἐποίησεν ὁ Ἰησοῦς
  choice: فعلها يسوع
  rationale: الفعل ποιέω يدل هنا على أعمال يسوع بوجه عام، و«فعل» أوسع وأنسب من تقييده بمعنى الصنع.
- source_word: ἐὰν γράφηται καθ’ ἕν
  choice: لو كُتبت واحدًا فواحدًا
  rationale: تحفظ الصيغة الشرطية الافتراضية وقوة التوزيع في καθ’ ἕν، مع تعبير عربي مفهوم.
- source_word: οὐδ’ αὐτὸν ... τὸν κόσμον
  choice: حتى العالم نفسه لا
  rationale: ينقل التوكيد في αὐτόν ومعنى «ولا حتى» في οὐδέ بتركيب عربي طبيعي.
- source_word: οἶμαι
  choice: أظن
  rationale: يحفظ التعليق الشخصي للكاتب ونبرته التأملية من غير مبالغة في اليقين.
- source_word: χωρήσειν
  choice: لا يتسع لـ
  rationale: يحفظ الصورة المكانية للفعل، مع إبقاء معنى «يحتوي» بديلًا معجميًا ممكنًا.
- source_word: τὰ γραφόμενα βιβλία
  choice: الكتب التي كانت ستُكتب
  rationale: يعبّر بوضوح عن الكتب الناتجة في الحالة الافتراضية، وهو المقصود السياقي للمشاركة المبنية للمجهول.
theological_decisions:
- issue: المبالغة البلاغية في سعة العالم للكتب
  choice: الإبقاء على صورة أن العالم نفسه لا يتسع للكتب
  alternative: تبسيطها إلى تعبير مثل «لكانت الكتب لا تُحصى»
  rationale: النص يختتم الإنجيل بمبالغة بلاغية مقصودة؛ فحُفظت صورتها وتوترها من غير تحويلها إلى تقرير حرفي أو تذويبها في تعبير عام.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «أمور» للأعمال المتعددة، و«واحدًا فواحدًا» لحفظ التوزيع، ووُضع فعل الرأي «أظن» صراحةً كما في اليونانية.
