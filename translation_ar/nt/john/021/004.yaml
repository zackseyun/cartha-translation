base_translation:
  language: en
  yaml_path: translation/nt/john/021/004.yaml
  text: When daybreak had already come[a], Jesus stood on the shore; yet the disciples did not know that it was Jesus.
translation:
  language: ar
  text: ولمّا كان الصباح قد أقبل، وقف يسوع على الشاطئ، لكن التلاميذ لم يعلموا أنه يسوع.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لم يدركوا أنه يسوع». واليونانية حرفيًا أقرب إلى: «لم يعلموا أنه يسوع».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρωΐας δὲ ἤδη γενομένης
  choice: ولمّا كان الصباح قد أقبل
  rationale: تؤدي العبارة المطلقة بالمضاف إليه معنى الظرف الزمني، وينقل «قد أقبل» معنى ἤδη مع γενομένης بصياغة عربية طبيعية. وتؤدي الواو وظيفة δὲ بوصفها رابطًا سرديًا خفيفًا من غير مبالغة في معنى الاستدراك.
- source_word: ἔστη
  choice: وقف
  rationale: ترجمة مباشرة طبيعية للماضي اليوناني، وتفيد وجود يسوع واقفًا في الموضع من غير زيادة تفسيرية.
- source_word: εἰς τὸν αἰγιαλόν
  choice: على الشاطئ
  rationale: مع فعل الوقوف تُفهم εἰς هنا دالةً اصطلاحيًا على الموضع، و«الشاطئ» تعبير عربي واضح عن αἰγιαλός.
- source_word: οὐ μέντοι
  choice: لكن ... لم
  rationale: ينقل التركيب معنى الاستدراك بين وقوف يسوع هناك وعدم معرفة التلاميذ له.
- source_word: ᾔδεισαν
  choice: لم يعلموا
  rationale: يحافظ على الدلالة المباشرة للفعل οἶδα، أي العلم أو المعرفة، ولا يستبدل بها معنى «يتعرّفوا» الأكثر تفسيرًا.
- source_word: οἱ μαθηταὶ
  choice: التلاميذ
  rationale: أداة التعريف تشير إلى الجماعة المعروفة في السياق، ولا حاجة إلى إضافة ضمير ملكية غير موجود في الأصل.
- source_word: ὅτι Ἰησοῦς ἐστιν
  choice: أنه يسوع
  rationale: صياغة عربية موجزة وطبيعية لجملة التعريف، وتحافظ على مضمون الأصل من غير إضافة.
theological_decisions:
- issue: عدم معرفة يسوع بعد القيامة
  choice: لم يعلموا أنه يسوع
  alternative: لم يتعرّفوا أنه يسوع
  rationale: يذكر النص واقع عدم المعرفة من غير أن يفسر سببه. فحُفظ اللفظ الأعم، وتُرك احتمال معنى عدم التعرّف في الحاشية، من غير استنتاج عقائدي بشأن هيئة يسوع أو إدراك التلاميذ.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «ولمّا» للانتقال السردي والظرف الزمني، وحُفظت العبارة المباشرة «لم يعلموا» مع بيان البديل السياقي في الحاشية.
