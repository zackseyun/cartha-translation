    rationale: الأصل يقول حرفيًا في المعنى «إن أردتُ/إن أريد»، لا «إن كنت أريد». حذف «كنت» يعطي شرطًا عربيًا مباشرًا ويحفظ الطابع الافتراضي من دون إيحاء استمراري زائد.
  - severity: low
    issue: ترجمة αὐτόν بـ«هذا»
    rationale: الأصل يستعمل ضميرًا لا اسم إشارة. «هو» بعد «يبقى» يوضح الشخص المقصود طبيعيًا في العربية مع تجنب قوة الإشارة الإضافية في «هذا».
