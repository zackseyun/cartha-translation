  rationale: عُدِّلت صياغة الشرط إلى «إن أردتُ» لتقابل ἐὰν θέλω مباشرةً وبعربية فصحى طبيعية، واستُبدل اسم الإشارة بضمير يوافق αὐτόν من غير زيادة في الدلالة الإشارية. وتبقى طبيعة «المجيء» غير معيّنة في النص والحاشية.
