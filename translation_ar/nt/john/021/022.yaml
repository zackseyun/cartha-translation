  text: λέγει αὐτῷ ὁ Ἰησοῦς· Ἐὰν αὐτὸν θέλω μένειν ἕως ἔρχομαι, τί πρὸς σέ; σύ ⸂μοι ἀκολούθει⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/022.yaml
  text: Jesus said to him[a], “If I want him to remain until I come[b], what is that to you? You follow me.”
translation:
  language: ar
  text: 'قال له يسوع: «إن أردتُ أن يبقى هو إلى أن آتي[a]، فما شأنك أنت؟ أنت اتبعني».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: تُركت عبارة «إلى أن آتي» مفتوحة عمدًا؛ إذ يختلف المفسرون في كونها تشير إلى مجيء يسوع في حدث تاريخي لاحق أو إلى مجيئه الأخير.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: قال له يسوع
  rationale: صيغ المضارع التاريخي اليوناني بالماضي العربي الملائم للسرد.
- source_word: Ἐὰν
  choice: إن
  rationale: تؤدي معنى الشرط والافتراض بإيجاز طبيعي، من غير زيادة في درجة اليقين أو الشك.
- source_word: θέλω
  choice: أريد
  rationale: تنقل معنى الإرادة أو الرغبة الشائع في الفعل، بصياغة عربية واضحة.
- source_word: αὐτὸν
  choice: هذا
  rationale: السياق يشير إلى التلميذ المذكور، واسم الإشارة طبيعي هنا ويحافظ على المقابلة بينه وبين المخاطب.
- source_word: μένειν
  choice: أن يبقى
  rationale: يحفظ المعنى العام للفعل من غير تفسيره تحديدًا بأنه البقاء حيًّا.
- source_word: ἕως ἔρχομαι
  choice: إلى أن آتي
  rationale: ترجمة زمنية مباشرة تترك طبيعة مجيء يسوع ومرجعه مفتوحين كما في الأصل.
- source_word: τί πρὸς σέ;
  choice: فما شأنك أنت؟
  rationale: تؤدي العبارة الاصطلاحية المباشرة التي تصرف بطرس عن الانشغال بمصير الآخر.
- source_word: σύ μοι ἀκολούθει
  choice: أنت اتبعني
  rationale: إبراز الضمير المستقل يحفظ توكيد σύ والمقابلة مع «هذا»، والأمر المضارع يُنقل بصيغة عربية طبيعية.
theological_decisions:
- issue: مرجع مجيء يسوع في ἕως ἔρχομαι
  choice: «إلى أن آتي» من غير تحديد نوع المجيء
  alternative: أن آتي في حدث تاريخي لاحق، أو في الدينونة، أو في المجيء الأخير
  rationale: لا تحدد الآية مرجع المجيء، والسياق التالي يحذر من تحميل كلام يسوع أكثر مما قال؛ لذلك تُحفظ دلالة العبارة مفتوحة.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. حُفظت مباشرة العتاب وتوكيد المخاطب، وتُجنب تفسير «يبقى» بمعنى «يبقى حيًّا» أو تعيين المقصود بالمجيء.
