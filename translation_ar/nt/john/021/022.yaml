review_pass:
  verdict: revise
  source_fidelity: 'المعنى العام منقول بأمانة: الشرط، وبقاء التلميذ، وعبارة «إلى أن آتي»، والاستفهام الزجري، والأمر باتباع يسوع. لكن «إن كنت أريد» أقل مباشرة من الشرط اليوناني ἐὰν θέλω، وقد توحي بصيغة مستمرة لا تلزم في الأصل. كما أن «هذا» أقوى إشاريةً من الضمير αὐτόν.'
  naturalness: النص فصيح ومفهوم، لكن «إن أردتُ» أيسر وأدق في العربية المعاصرة من «إن كنت أريد». وإظهار المرجع بـ«هو» بعد «يبقى» يوضح الإحالة من غير تحويل الضمير اليوناني إلى اسم إشارة.
  terminology: «يسوع»، «يبقى»، «إلى أن آتي»، و«اتبعني» مناسبة وواضحة. الحاشية تحافظ بحق على عدم تعيين المقصود بالمجيء.
  issues:
