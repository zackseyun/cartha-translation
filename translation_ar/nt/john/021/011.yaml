base_translation:
  language: en
  yaml_path: translation/nt/john/021/011.yaml
  text: So Simon Peter went aboard and pulled the net onto the shore[a], full of large fish, one hundred fifty-three; and though there were so many[b], the net was not torn.
translation:
  language: ar
  text: فصعد سمعان بطرس[a] وجرَّ الشبكة إلى البرّ[b]، وكانت ممتلئة بمئة وثلاث وخمسين سمكة كبيرة. ومع هذا العدد الكبير من السمك، لم تتمزق الشبكة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «صعد إلى القارب». الفعل اليوناني يعني حرفيًا «صعد»، ويرجح في هذا السياق أن بطرس صعد إلى القارب ليسحب الشبكة.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «إلى اليابسة»؛ والمقصود هنا إخراج الشبكة من الماء إلى البرّ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβη
  choice: صعد
  rationale: يحافظ على المعنى المباشر للفعل اليوناني وعلى عدم التصريح بوجهة الصعود، مع إيضاح الدلالة السياقية المحتملة في الحاشية.
- source_word: οὖν
  choice: فـ
  rationale: فاء التعقيب تربط الفعل طبيعيًا بما سبقه، وتنقل وظيفة أداة الربط في سياق السرد.
- source_word: εἵλκυσεν
  choice: جرَّ
  rationale: ينقل فعل سحب الشبكة الثقيلة إلى اليابسة بوضوح، من غير إضافة معنى غير موجود في النص.
- source_word: τὸ δίκτυον
  choice: الشبكة
  rationale: المقابل العربي المباشر والمألوف لأداة الصيد المذكورة.
- source_word: εἰς τὴν γῆν
  choice: إلى البرّ
  rationale: يحفظ معنى اليابسة في مقابل الماء، ويلائم مشهد الصيد من غير حصره في لفظ الشاطئ وحده.
- source_word: μεστὸν ἰχθύων μεγάλων
  choice: وكانت ممتلئة ... بسمكة كبيرة
  rationale: صياغة عربية طبيعية تنقل امتلاء الشبكة بالسمك الكبير، مع إظهار عود الضمير إلى الشبكة.
- source_word: ἑκατὸν πεντήκοντα τριῶν
  choice: بمئة وثلاث وخمسين
  rationale: نقل مباشر للعدد المحدد الوارد في النص اليوناني.
- source_word: τοσούτων ὄντων
  choice: ومع أنها كانت بهذا العدد الكبير
  rationale: ينقل التركيب المطلق ذي الدلالة التنازلية، مع إبقاء الإشارة إلى كثرة السمك واضحة في العربية.
- source_word: οὐκ ἐσχίσθη
  choice: لم تتمزق
  rationale: يحافظ على المبني للمجهول في اليونانية وعلى وصف بقاء الشبكة سليمة رغم الحمل.
theological_decisions: []
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة سردية وقورة. اختير «صعد» للحفاظ على إيجاز الأصل واحتماله، و«البرّ» لإبراز التقابل الطبيعي مع الماء. وُضع العدد بصياغة عربية معيارية، وقُسمت الجملة بما ييسر قراءتها من غير تغيير العلاقات الدلالية.
