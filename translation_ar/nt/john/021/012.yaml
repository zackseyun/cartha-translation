  text: λέγει αὐτοῖς ὁ Ἰησοῦς· Δεῦτε ἀριστήσατε. οὐδεὶς ⸀δὲ ἐτόλμα τῶν μαθητῶν ἐξετάσαι αὐτόν· Σὺ τίς εἶ; εἰδότες ὅτι ὁ κύριός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/012.yaml
  text: Jesus said to them[a], “Come, eat breakfast.” But none of the disciples dared to ask him[b], “Who are you?” knowing that it was the Lord.
translation:
  language: ar
  text: 'قال لهم يسوع: «تعالوا تناولوا الفطور[a]». ولم يجرؤ أحد من التلاميذ أن يسألوه[b]: «مَن أنت؟» إذ كانوا يعلمون أنه الرب.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: «كلوا وجبة الصباح». يدل الفعل اليوناني تحديدًا على تناول وجبة الصباح.'
    reason: lexical_alternative
  - marker: b
    text: يمكن أن يدل الفعل المترجم «يسألوه» أيضًا على استجوابه أو سؤاله بتدقيق وفحص.
    reason: lexical_alternative
lexical_decisions:
- source_word: Δεῦτε
  choice: تعالوا
  rationale: دعوة بصيغة الأمر للجمع، ومعناها الطبيعي هنا «تعالوا».
- source_word: ἀριστήσατε
  choice: تناولوا الفطور
  rationale: الفعل يدل تحديدًا على تناول وجبة الصباح، وهذه العبارة عربية واضحة وطبيعية.
- source_word: οὐδεὶς δὲ
  choice: ولم ... أحد
  rationale: تنقل الواو الانتقال الخفيف الذي تؤديه δέ من غير المبالغة في جعله تضادًا قويًا.
- source_word: ἐτόλμα
  choice: يجرؤ
  rationale: ينقل معنى الشجاعة أو الإقدام في هذا التركيب مع المصدر.
- source_word: ἐξετάσαι
  choice: أن يستفهم
  rationale: «يستفهم» يلائم السؤال المباشر ويحفظ شيئًا من قوة الفعل الذي قد يدل على السؤال المتفحص، بخلاف «يسأل» الأعم.
- source_word: Σὺ τίς εἶ;
  choice: مَن أنت؟
  rationale: الصياغة العربية الطبيعية لسؤال الهوية، ويظهر ضمير المخاطب في «أنت» كما في اليونانية.
- source_word: εἰδότες ὅτι
  choice: إذ كانوا يعلمون أن
  rationale: يحافظ على البنية الحالية للفاعل في اليونانية، مع إبقاء العلاقة الظرفية أو السببية غير محسومة تمامًا.
- source_word: ὁ κύριός
  choice: الرب
  rationale: يحفظ اللقب المسيحاني في سياق ظهور يسوع بعد القيامة، والتعريف طبيعي في العربية.
theological_decisions:
- issue: ترجمة κύριος في الإشارة إلى يسوع
  choice: الرب
  alternative: السيد
  rationale: «الرب» يحفظ الثقل المسيحاني للقب في سياق الظهور بعد القيامة، من غير إضافة تفسير يتجاوز النص.
- issue: دلالة εἰδότες على علاقة معرفتهم بعدم السؤال
  choice: إذ كانوا يعلمون
  alternative: لأنهم كانوا يعلمون
  rationale: «إذ» تحفظ احتمال الملابسة أو السببية في اسم الفاعل اليوناني، ولا تحسمه إلى سببية صريحة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «تناولوا الفطور» للدقة الزمنية والطبيعية، و«يستفهم» لحفظ قوة ἐξετάσαι، و«إذ» لصون الغموض الحقيقي في علاقة الحال بالسبب.
