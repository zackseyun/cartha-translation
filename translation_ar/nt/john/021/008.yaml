  yaml_path: translation/nt/john/021/008.yaml
  text: But the other disciples came in the small boat[a], for they were not far from the land, but about two hundred cubits away[c][b], dragging the net of fish.
translation:
  language: ar
  text: أمّا التلاميذ الآخرون فجاؤوا في القارب الصغير، لأنهم لم يكونوا بعيدين عن البر، بل كانوا على بُعد نحو مئتي ذراع[a]، وهم يجرّون شبكة السمك[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: نحو مئتي ذراع، أي قرابة 90 مترًا.
    reason: cultural_note
  - marker: b
    text: 'قد تُفهم الإضافة بمعنى: الشبكة التي تحتوي على السمك.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἄλλοι μαθηταὶ
  choice: أَمَّا التلاميذ الآخرون
  rationale: تُظهر «أمّا» الانتقال والمقابلة مع فعل بطرس في الآية السابقة، من غير جعل δέ أداة استدراك قوية بالضرورة.
- source_word: τῷ πλοιαρίῳ
  choice: في القارب الصغير
  rationale: يحفظ الوصف التصغيري في πλοιάριον بصياغة عربية طبيعية.
- source_word: ἦλθον
  choice: فجاؤوا
  rationale: ترجمة سردية طبيعية للماضي ἦλθον، مع الفاء لربط الخبر ببنية «أمّا».
- source_word: οὐ γὰρ ἦσαν μακρὰν ἀπὸ τῆς γῆς
  choice: لأنهم لم يكونوا بعيدين عن البر
  rationale: تنقل γάρ تعليلًا، وتؤدي «البر» معنى γῆ المقابل للماء في هذا السياق.
- source_word: ἀλλὰ ὡς ἀπὸ πηχῶν διακοσίων
  choice: بل كانوا على بُعد نحو مئتي ذراع
  rationale: «نحو» تحفظ التقريب في ὡς، والإبقاء على «الذراع» يصون وحدة القياس القديمة، مع توضيح المسافة في الحاشية.
- source_word: σύροντες
  choice: وهم يجرّون
  rationale: تنقل اسم الفاعل بوصفه فعلًا متزامنًا مع مجيئهم، وتحفظ دلالة السحب المادي.
- source_word: τὸ δίκτυον τῶν ἰχθύων
  choice: شبكة السمك
  rationale: ترجمة قريبة تحافظ على احتمال علاقة الإضافة في اليونانية من غير أن تضيف صراحة أن الشبكة كانت ممتلئة، مع بيان المعنى السياقي البديل في الحاشية.
