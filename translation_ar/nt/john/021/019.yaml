id: JHN.21.19
reference: John 21:19
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: τοῦτο δὲ εἶπεν σημαίνων ποίῳ θανάτῳ δοξάσει τὸν θεόν. καὶ τοῦτο εἰπὼν λέγει αὐτῷ· Ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/019.yaml
  text: He said this to indicate by what kind of death he would glorify God[a]. And after saying this, he says to him[b], “Follow me.”
translation:
  language: ar
  text: 'قال هذا ليدلّ على نوع الميتة التي سيمجّد بها الله[a]. وبعدما قال هذا، يقول له[b]: «اتبعني».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بأية ميتة سيمجّد الله».'
    reason: lexical_alternative
  - marker: b
    text: 'يستعمل النص اليوناني المضارع التاريخي: «يقول له».'
    reason: lexical_alternative
lexical_decisions:
- source_word: σημαίνων
  choice: ليدلّ على
  rationale: ينقل معنى الإظهار أو التعريف بطريق الإشارة والدلالة، ويؤدي وظيفة اسم الفاعل اليوناني في بيان مغزى كلام يسوع.
- source_word: ποίῳ θανάτῳ
  choice: نوع الميتة التي
  rationale: يحفظ الدلالة النوعية في ποίῳ، فلا يختزل العبارة إلى مجرد السؤال عن الموت، كما تلائم الصياغة العربية تركيب الجملة الموصولة.
- source_word: δοξάσει τὸν θεόν
  choice: سيمجّد بها الله
  rationale: يحفظ صيغة الاستقبال ومعنى تمجيد الله، وتعود الباء على الميتة بوصفها الوسيلة أو الكيفية.
- source_word: καὶ τοῦτο εἰπὼν
  choice: وبعدما قال هذا
  rationale: صياغة عربية طبيعية تنقل سبق فعل القول على الأمر اللاحق.
- source_word: λέγει αὐτῷ
  choice: يقول له
  rationale: يحفظ المضارع التاريخي في اليونانية وما يضفيه من حيوية على السرد.
- source_word: Ἀκολούθει μοι
  choice: اتبعني
  rationale: أمر عربي مباشر وطبيعي يحفظ إمكان الدلالة على الاتباع الفوري والمستمر من غير إضافة تفسيرية.
theological_decisions:
- issue: دلالة تمجيد الله بموت بطرس
  choice: الإبقاء على عبارة «سيمجّد بها الله» بلا توسيع تفسيري
  alternative: التصريح بأن استشهاد بطرس أو شهادته الأمينة هو الذي سيمجّد الله
  rationale: النص يربط موت بطرس بتمجيد الله، لكنه لا يشرح هنا آلية ذلك؛ لذا تحافظ الصياغة على الثقل اللاهوتي من غير إدخال تفسير مذهبي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ المضارع التاريخي، واستُعملت «الميتة» لإبراز كيفية الموت أو نوعه، مع تجنب أي شرح مذهبي زائد.
