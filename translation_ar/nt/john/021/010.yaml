lexical_decisions:
- source_word: λέγει
  choice: فقال
  rationale: مضارع تاريخي في سياق سردي، وصيغة الماضي العربية أنسب للسرد الطبيعي، مع الفاء لربط القول بما سبقه.
- source_word: Ἐνέγκατε
  choice: هاتوا
  rationale: أمر جمع مباشر يفيد إحضار الشيء إلى المتكلم، وهو طبيعي وواضح في السياق.
- source_word: ἀπὸ τῶν ὀψαρίων
  choice: بعض السمك
  rationale: يفيد التركيب معنى التبعيض، أي إحضار جزء من الصيد لا كله.
- source_word: ὀψαρίων
  choice: السمك
  rationale: السياق يتحدث عن السمك المصيد، ولا يقتضي اللفظ هنا تخصيصه بالصغير أو بالمعدّ للطعام.
- source_word: ὧν ἐπιάσατε
  choice: الذي اصطدتموه
  rationale: ترجمة طبيعية لجملة الصلة التي تحدد السمك المقصود، مع ضمير مفرد مراعاة لاسم الجنس الجمعي «السمك».
- source_word: νῦν
  choice: الآن
  rationale: يحافظ على الدلالة الزمنية الصريحة في اليونانية وعلى إمكان تعلقها بحدث الصيد القريب دون استبدالها بتفسير أضيق مثل «للتو».
