base_translation:
  language: en
  yaml_path: translation/nt/john/021/024.yaml
  text: This is the disciple who testifies about these things and who wrote these things[a], and we know that his testimony is true.
translation:
  language: ar
  text: هذا هو التلميذ الذي يشهد عن هذه الأمور والذي كتب هذه الأمور[a]، ونحن نعلم أن شهادته صادقة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمة العبارة: «يشهد بشأن هذه الأمور ... شهادته حق». وتستعمل اليونانية ألفاظًا من أصل واحد لفعل «يشهد» واسم «شهادة» في الآية كلها.'
    reason: توضيح بديل أسلوبي والمحافظة على الإشارة إلى الصلة الاشتقاقية في لغة المصدر.
lexical_decisions:
- source_word: Οὗτός
  choice: هذا هو
  rationale: صيغة تعريف طبيعية تحافظ على قوة الإشارة إلى التلميذ المذكور قبلًا.
- source_word: ὁ μαθητὴς
  choice: التلميذ
  rationale: المقابل العربي المعياري والطبيعي لتابع يسوع في السياق اليوحناوي.
- source_word: ὁ μαρτυρῶν περὶ τούτων
  choice: الذي يشهد بهذه الأمور
  rationale: يحافظ المضارع «يشهد» على القوة المستمرة أو المميزة لاسم الفاعل، وتؤدي «بهذه الأمور» معنى الإشارة إلى محتوى الإنجيل.
- source_word: ὁ γράψας ταῦτα
  choice: وهو الذي كتبها
  rationale: ينقل الفعل المكتمل في اسم الفاعل الماضي، مع إرجاع الضمير إلى «هذه الأمور» تجنبًا لتكرار ثقيل في العربية.
- source_word: οἴδαμεν
  choice: ونحن نعلم
  rationale: ينقل المتكلم الجمع كما هو، من غير تعيين هوية المتكلمين.
- source_word: ἀληθὴς
  choice: صادقة
  rationale: وصف طبيعي للشهادة في العربية، ويفيد مطابقتها للحق دون إضافة معنى الثقة العملية وحدها.
- source_word: αὐτοῦ ἡ μαρτυρία
  choice: شهادته
  rationale: صيغة الإضافة الضميرية طبيعية وتحافظ على الصلة الاشتقاقية مع الفعل «يشهد».
theological_decisions:
- issue: هوية المتكلمين في «ونحن نعلم»
  choice: الإبقاء على صيغة المتكلم الجمع من غير تحديد أصحابها
  alternative: اعتبارها قول الكاتب التحريري أو جماعة تؤيد شهادة التلميذ
  rationale: النص اليوناني لا يحدد مرجع صيغة الجمع، ولذلك ينبغي عدم حسم مسألة التأليف أو هوية الجماعة في الترجمة.
- issue: صلة التلميذ بفعل الكتابة
  choice: إسناد الشهادة والكتابة إلى التلميذ نفسه كما تفعل البنية اليونانية
  alternative: تفسير الكتابة على أنها تدوين لاحق لشهادة التلميذ بواسطة آخرين
  rationale: التركيب يصف «التلميذ» بأنه الشاهد وبأنه الذي كتب، فلا تُدرج في الترجمة فرضية تحريرية لا يصرح بها النص.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُخدم «يشهد/شهادته» للمحافظة على التوازي الاشتقاقي، وأُبقيت «ونحن نعلم» مبهمة المرجع كما في الأصل.
