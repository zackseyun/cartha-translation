  text: So Jesus said to them[a], “Children, you do not have any fish, do you?” They answered him, “No.”
translation:
  language: ar
  text: 'فقال لهم يسوع: «يا أولادي، أليس عندكم سمك؟»[a] فأجابوه: «لا».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «أليس عندكم شيءٌ يؤكل؟» فاللفظة اليونانية προσφάγιον تشير، على نحو أخص، إلى طعام يُؤكل مع الخبز؛ وفي سياق الصيد يُرجَّح أن المقصود هو السمك.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: فـ
  rationale: حرف استئناف وتعقيب طبيعي يحفظ تتابع السرد من غير إثقال بعبارة سببية.
- source_word: Παιδία
  choice: يا أولادي
  rationale: صيغة نداء ودية ذات مسحة أبوية؛ و«يا أولادي» أفصح وأطبع في العربية من «يا أطفال»، من غير أن تجعل المخاطَبين أبناءً حرفيين.
- source_word: μή τι
  choice: أليس عندكم...؟
  rationale: استفهام منفي يتوقع جوابًا بالنفي، وهو ما تنقله هذه الصياغة العربية بوضوح وطبيعية.
- source_word: προσφάγιον
  choice: شيءٌ يؤكل مع الخبز
  rationale: يحفظ المعنى المعجمي للطعام الذي يؤكل مع الخبز، بدل حصره في السمك؛ والسياق يجعل السمك مرجحًا.
- source_word: ἔχετε
  choice: عندكم
  rationale: تعبير عربي طبيعي عن الحيازة في هذا السؤال.
- source_word: ἀπεκρίθησαν αὐτῷ
  choice: أجابوه
  rationale: صياغة عربية موجزة وأمينة لعبارة الجواب الموجه إليه.
- source_word: Οὔ
  choice: لا
  rationale: يحافظ على قِصر الجواب اليوناني وحسمه.
