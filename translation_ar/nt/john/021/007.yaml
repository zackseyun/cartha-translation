source:
  edition: SBLGNT
  text: λέγει οὖν ὁ μαθητὴς ἐκεῖνος ὃν ἠγάπα ὁ Ἰησοῦς τῷ Πέτρῳ· Ὁ κύριός ἐστιν. Σίμων οὖν Πέτρος, ἀκούσας ὅτι ὁ κύριός ἐστιν, τὸν ἐπενδύτην διεζώσατο, ἦν γὰρ γυμνός, καὶ ἔβαλεν ἑαυτὸν εἰς τὴν θάλασσαν·
base_translation:
  language: en
  yaml_path: translation/nt/john/021/007.yaml
  text: So that disciple whom Jesus loved said to Peter[a], “It is the Lord.” Therefore, when Simon Peter heard that it was the Lord, he tied his outer garment around himself (for he was lightly clothed) and threw himself into the sea.
translation:
  language: ar
  text: 'فقال ذلك التلميذ الذي كان يسوع يحبّه لبطرس: «إنه الرب». فلما سمع سمعان بطرس أنه الرب، شدّ ثوبه الخارجي حوله، لأنه كان عاريًا[a]، وألقى بنفسه في البحر.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «قليل الثياب». فاللفظ اليوناني يمكن أن يعني العري، أو أن الشخص لم يكن مكتسيًا بما يكفي، بحسب السياق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει οὖν
  choice: فقال
  rationale: تنقل الفاء تقدّم السرد والارتباط بالسياق الذي تؤديه οὖν، بصياغة عربية طبيعية موجزة.
- source_word: ὁ μαθητὴς ἐκεῖνος ὃν ἠγάπα ὁ Ἰησοῦς
  choice: ذلك التلميذ الذي كان يسوع يحبّه
  rationale: تحافظ «ذلك» على اسم الإشارة ἐκεῖνος، وينقل الفعل الناقص «كان يحبّه» صيغة الماضي المستمر ἠγάπα.
- source_word: Ὁ κύριός ἐστιν
  choice: إنه الرب
  rationale: صياغة عربية طبيعية للتعرّف إلى شخص حاضر، مع إبقاء κύριος «الرب» وما يحمله اللقب من دلالة في السياق.
- source_word: ἀκούσας
  choice: فلما سمع
  rationale: تنقل اسم الفاعل الأوريستي بوصفه حدثًا زمنيًا سابقًا للفعل التالي، وتلائم تسلسل السرد العربي.
- source_word: τὸν ἐπενδύτην
  choice: ثوبه الخارجي
  rationale: ينقل المعنى العام للثوب الذي يُلبس فوق غيره من غير افتراض نوع محدد من ملابس الصيادين.
- source_word: διεζώσατο
  choice: شدّ ... حوله
  rationale: يحافظ على معنى إحكام الثوب أو ربطه حول الجسد، بدل الاكتفاء بالفعل العام «لبس».
- source_word: ἦν γὰρ γυμνός
  choice: لأنه كان عاريًا
  rationale: يعكس المعنى المباشر لـγυμνός، مع إثبات احتمال أن المراد قلة الثياب لا العري التام في الحاشية حفاظًا على الغموض المعجمي والسياقي.
- source_word: ἔβαλεν ἑαυτὸν εἰς τὴν θάλασσαν
  choice: وألقى بنفسه في البحر
  rationale: يحافظ على الصورة القوية للفعل βάλλω مع الضمير الانعكاسي، وعلى لفظ «البحر» مقابل θάλασσα.
theological_decisions:
- issue: ترجمة κύριος عند تعرّف التلميذ إلى يسوع
  choice: الرب
  alternative: السيد / المعلّم
  rationale: «الرب» يحفظ اللقب المعتاد ودلالته المسيحانية الممكنة في سياق ظهور يسوع بعد القيامة، من غير شرح زائد أو حسم لكل أبعاد اللقب.
- issue: دلالة γυμνός على هيئة بطرس
  choice: عاريًا في المتن، مع بيان الاحتمال السياقي في الحاشية
  alternative: خفيف الثياب / غير مكتسي بما يكفي
  rationale: اللفظ اليوناني يحتمل العري حرفيًا أو عدم اكتمال اللباس بحسب السياق. اختيار المقابل المباشر في المتن مع الحاشية يحفظ التوتر الدلالي ولا يحسمه ضمنًا.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُعملت الفاء لتتابع السرد، وتُركت الجملة مباشرة وحيوية، مع تجنب الألفاظ اللباسية القديمة مثل «ائتزر» لأنها قد توحي بثوب بعينه أو تقلل الوضوح لدى القارئ العام.
