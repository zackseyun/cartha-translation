source:
  edition: SBLGNT
  text: ἐξῆλθεν οὖν ⸂οὗτος ὁ λόγος⸃ εἰς τοὺς ἀδελφοὺς ὅτι ὁ μαθητὴς ἐκεῖνος οὐκ ἀποθνῄσκει. ⸂οὐκ εἶπεν δὲ⸃ αὐτῷ ὁ Ἰησοῦς ὅτι οὐκ ἀποθνῄσκει ἀλλ’· Ἐὰν αὐτὸν θέλω μένειν ἕως ἔρχομαι, τί πρὸς σέ;
base_translation:
  language: en
  yaml_path: translation/nt/john/021/023.yaml
  text: So this report spread among the brothers that that disciple would not die. Yet Jesus did not say to him that he would not die, but, “If I want him to remain until I come, what is that to you?”
translation:
  language: ar
  text: 'فشاع هذا الخبر بين الإخوة: «إن ذلك التلميذ لن يموت». لكن يسوع لم يقل له إنه لن يموت، بل قال: «إن كنت أشاء أن يبقى إلى أن آتي، فما شأنك أنت؟»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي إن يسوع لم يَعِد بأن ذلك التلميذ لن يموت؛ بل قال كلامًا شرطيًا: «إن كنت أشاء أن يبقى إلى أن آتي...» ويمكن أيضًا ترجمة «هذا الخبر» بـ«هذا القول».'
    reason: توضيح الالتباس الذي يصححه النص وذكر البديل المعجمي لـλόγος.
lexical_decisions:
- source_word: ἐξῆλθεν οὖν οὗτος ὁ λόγος
  choice: فشاع هذا الخبر
  rationale: ينقل التعبير معنى خروج قول وتداوله داخل الجماعة؛ و«شاع الخبر» عربية طبيعية، مع إبقاء «القول» بديلًا ممكنًا في الحاشية.
- source_word: εἰς τοὺς ἀδελφοὺς
  choice: بين الإخوة
  rationale: السياق يدل على انتشار الخبر داخل جماعة التلاميذ، و«الإخوة» تحافظ على صيغة الجمع المذكر في اليونانية.
- source_word: ὁ μαθητὴς ἐκεῖνος οὐκ ἀποθνῄσκει
  choice: إن ذلك التلميذ لن يموت
  rationale: «ذلك التلميذ» يحفظ اسم الإشارة، وصيغة المستقبل العربية تنقل مضمون الخبر المتداول بصورة طبيعية.
- source_word: οὐκ εἶπεν δὲ
  choice: لكن يسوع لم يقل
  rationale: تفيد δέ هنا الاستدراك وتصحيح الفهم السابق، ولذلك تلائمها «لكن».
- source_word: Ἐὰν αὐτὸν θέλω μένειν
  choice: إن كنت أشاء أن يبقى
  rationale: تحافظ «إن» على الشرط الحقيقي في العبارة، و«أشاء» تنقل معنى الإرادة في θέλω بلغة عربية فصيحة واضحة.
- source_word: ἕως ἔρχομαι
  choice: إلى أن آتي
  rationale: ترجمة قريبة من اليونانية تحفظ فعل المجيء دون تفسيره صراحة بأنه الرجوع.
- source_word: τί πρὸς σέ
  choice: فما شأنك أنت؟
  rationale: تؤدي العبارة الاصطلاحية معنى أن الأمر لا يخص المخاطَب، مع إبراز ضمير «أنت» المقابل لـσέ.
theological_decisions:
- issue: طبيعة الخبر المتداول عن مصير التلميذ
  choice: صياغة الكلام بوصفه خبرًا شاع، ثم إبقاء نفي الراوي الصريح أن يسوع قال إن التلميذ لن يموت.
  alternative: 'ترجمة أكثر حرفية: «فخرج هذا القول إلى الإخوة».'
  rationale: يفرّق النص نفسه بين الاستنتاج المتداول وكلام يسوع الفعلي، فلا تُجعل العبارة وعدًا بعدم موت التلميذ.
- issue: القوة الشرطية في قول يسوع
  choice: «إن كنت أشاء أن يبقى إلى أن آتي».
  alternative: «أريد أن يبقى إلى أن آتي».
  rationale: يحفظ الاختيار أداة الشرط ἐάν، ولا يحوّل الفرض إلى تصريح بأن يسوع أراد بالفعل بقاء التلميذ حتى مجيئه.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعمل «شاع الخبر» بدل النقل الحرفي الجامد، مع الحفاظ على الاستدراك والشرط وعلى الإشارة المحددة إلى «ذلك التلميذ».
