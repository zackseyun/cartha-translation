source:
  edition: SBLGNT
  text: ⸀Ἐπιστραφεὶς ὁ Πέτρος βλέπει τὸν μαθητὴν ὃν ἠγάπα ὁ Ἰησοῦς ἀκολουθοῦντα, ὃς καὶ ἀνέπεσεν ἐν τῷ δείπνῳ ἐπὶ τὸ στῆθος αὐτοῦ καὶ εἶπεν· Κύριε, τίς ἐστιν ὁ παραδιδούς σε;
base_translation:
  language: en
  yaml_path: translation/nt/john/021/020.yaml
  text: Peter turned and saw the disciple whom Jesus loved following[a], who had also leaned back against his chest at the supper and said, “Lord[b], who is the one betraying you?”
translation:
  language: ar
  text: 'فالتفت بطرس فرأى التلميذ الذي كان يسوع يحبّه يتبع[a]، وهو الذي اتكأ أيضًا في أثناء العشاء على صدره[b] وقال: «يا رب، من هو الذي يسلّمك؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «يتبعه» أو «يتبعهما»؛ فاسم الفاعل اليوناني لا يذكر مفعول الاتباع صراحةً.'
    reason: lexical_alternative
  - marker: b
    text: 'أي: كان متكئًا عند المائدة على صدر يسوع؛ فالعبارة تعكس هيئة الاتكاء عند تناول الطعام.'
    reason: cultural_clarification
lexical_decisions:
- source_word: Ἐπιστραφεὶς
  choice: فالتفت
  rationale: ينقل اسم الفاعل الدال على فعل سابق بصياغة عربية طبيعية، ويبيّن أن بطرس وجّه نظره إلى الخلف أو الجانب دون تكلّف.
- source_word: βλέπει
  choice: فرأى
  rationale: المضارع التاريخي اليوناني أُدي بصيغة الماضي الملائمة للسرد العربي، مع الحفاظ على تعاقب الحدثين.
- source_word: μαθητὴν
  choice: التلميذ
  rationale: هو المقابل العربي المألوف للمصطلح اليوحناوي، ويحفظ دلالته الخاصة بمن يتعلم ويتبع يسوع.
- source_word: ὃν ἠγάπα ὁ Ἰησοῦς
  choice: الذي كان يسوع يحبه
  rationale: صياغة عربية طبيعية تحفظ دلالة الماضي الناقص على المحبة القائمة في إطار السرد.
- source_word: ἀκολουθοῦντα
  choice: يتبع
  rationale: تُرك المفعول غير مصرّح به كما في اليونانية، حفاظًا على احتمال أن يكون المعنى يتبعه أو يتبعهما، مع بيان ذلك في الحاشية.
- source_word: ἀνέπεσεν
  choice: اتكأ
  rationale: يعبر عن هيئة الاستلقاء أو الاتكاء المتبعة عند تناول الطعام في ذلك العصر، وهو تعبير عربي موجز ومفهوم.
- source_word: ἐν τῷ δείπνῳ
  choice: عند العشاء
  rationale: يحدد سياق الوجبة المعينة بعبارة عربية فصيحة وطبيعية، من غير إضفاء معنى طقسي غير موجود في اللفظ.
- source_word: ἐπὶ τὸ στῆθος αὐτοῦ
  choice: على صدره
  rationale: يحفظ الصورة الجسدية المباشرة في النص، مع إيضاح وضعية الاتكاء في الحاشية.
- source_word: Κύριε
  choice: يا رب
  rationale: المقابل المعتاد للنداء κύριε، ويحفظ الاحترام والرنين اللاهوتي في خطاب يسوع.
- source_word: ὁ παραδιδούς σε
  choice: الذي يسلّمك
  rationale: يحفظ صورة παραδίδωμι الأساسية، أي التسليم إلى أيدي الخصوم، وهي في هذا السياق فعل الخيانة، من غير حذف البنية الوصفية الحاضرة.
theological_decisions:
- issue: المفعول غير المذكور مع ἀκολουθοῦντα
  choice: يتبع، بلا مفعول صريح
  alternative: يتبعه أو يتبعهما
  rationale: لا يحدد النص اليوناني مفعول الاتباع. إبقاء الفعل بلا مفعول يحفظ الغموض الحقيقي بدل حسم ما إذا كان التلميذ يتبع يسوع وحده أم يسوع وبطرس.
- issue: دلالة παραδιδούς في سياق الآلام
  choice: يسلّمك
  alternative: يخونك
  rationale: «يسلّمك» أقرب إلى الصورة اللفظية اليونانية، مع بقاء معنى الخيانة واضحًا من السياق؛ أما «يخونك» فيصرّح بالدلالة السياقية لكنه يفقد صورة التسليم.
- issue: المضارع التاريخي βλέπει
  choice: فرأى
  alternative: فيرى
  rationale: تحويله إلى الماضي قرار أسلوبي يجعل السرد العربي طبيعيًا ولا يغير المضمون اللاهوتي.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة، مع تراكيب سردية طبيعية. حُفظ غموض مفعول «يتبع»، ووُضعت علامة الحاشية الثانية عند العبارة التي تشرحها فعلًا، أي وضعية الاتكاء على الصدر.
