  text: But he said to them[a], “Cast the net on the right side of the boat, and you will find some.” So they cast it, and they were no longer able to haul it in because of the multitude of fish.
translation:
  language: ar
  text: 'فقال لهم: «ألقوا الشبكة إلى الجانب الأيمن من القارب، فتجدوا سمكًا[a]». فألقوها، فلم يعودوا قادرين على سحبها من كثرة السمك.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «فتجدون»؛ لم يُذكر المفعول به في اليونانية، لكن سياق الصيد يفهم منه السمك.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Βάλετε
  choice: ألقوا
  rationale: فعل أمر يدل هنا على إلقاء شبكة الصيد، و«ألقوا» هو التعبير العربي الطبيعي في هذا السياق.
- source_word: τὰ δεξιὰ μέρη τοῦ πλοίου
  choice: الجانب الأيمن من القارب
  rationale: العبارة اليونانية حرفيًا «النواحي اليمنى من القارب»، والمقصود طبيعيًا جانبه الأيمن؛ وتجنب الصياغة المصطلح البحري غير المألوف.
- source_word: πλοίου
  choice: القارب
  rationale: يلائم مركب الصيد في بحيرة الجليل أكثر من «السفينة».
- source_word: τὸ δίκτυον
  choice: الشبكة
  rationale: المقابل العربي المباشر لشبكة الصيد المفردة.
- source_word: εὑρήσετε
  choice: فتجدوا سمكًا
  rationale: الفعل اليوناني لا يصرح بالمفعول، لكن سياق الصيد يدل على السمك؛ أُضيف «سمكًا» لوضوح العربية مع بيان ذلك في الحاشية.
- source_word: οὐκέτι
  choice: فلم يعودوا
  rationale: ينقل معنى النفي الزمني، أي إنهم بعد امتلاء الشبكة لم يظلوا قادرين على سحبها.
- source_word: ἑλκύσαι
  choice: على سحبها
  rationale: «سحب» تعبير عربي طبيعي عن جر شبكة الصيد المثقلة إلى القارب.
- source_word: ἴσχυον
  choice: قادرين
  rationale: الفعل يدل هنا على امتلاك القوة أو القدرة على أداء الفعل.
- source_word: ἀπὸ τοῦ πλήθους τῶν ἰχθύων
  choice: من كثرة السمك
  rationale: صياغة عربية موجزة وطبيعية تحفظ معنى السببية وكثرة الأسماك.
