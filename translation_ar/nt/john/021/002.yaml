source:
  edition: SBLGNT
  text: ἦσαν ὁμοῦ Σίμων Πέτρος καὶ Θωμᾶς ὁ λεγόμενος Δίδυμος καὶ Ναθαναὴλ ὁ ἀπὸ Κανὰ τῆς Γαλιλαίας καὶ οἱ τοῦ Ζεβεδαίου καὶ ἄλλοι ἐκ τῶν μαθητῶν αὐτοῦ δύο.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/002.yaml
  text: Simon Peter[a], Thomas called Didymus, Nathanael from Cana of Galilee, the sons of Zebedee, and two others of his disciples were together.
translation:
  language: ar
  text: كان سمعان بطرس، وتوما الذي يُقال له التوأم[a]، ونثنائيل من قانا الجليل، وابنا زبدي، واثنان آخران من تلاميذه، معًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'اليونانية: «ديديموس»، ومعناها «التوأم».'
    reason: بيان اللفظ اليوناني الذي تُرجم معناه في المتن.
lexical_decisions:
- source_word: ἦσαν ὁμοῦ
  choice: كانوا ... معًا
  rationale: ينقل الفعل الناقص حالة اجتماعهم في الماضي، وتؤدي «معًا» معنى وجودهم في موضع واحد. وورد الفعل مفردًا في العربية لمجيئه قبل تعداد الأشخاص، مع تأخير «معًا» لصياغة طبيعية.
- source_word: Σίμων Πέτρος
  choice: سمعان بطرس
  rationale: الصيغة العربية المألوفة للاسم واللقب.
- source_word: Θωμᾶς ὁ λεγόμενος Δίδυμος
  choice: توما الذي يُقال له التوأم[a]
  rationale: تُرجم Δίδυμος بحسب معناه، «التوأم»، بدل الاكتفاء بنقله صوتيًا، مع إبقاء صيغة λεγόμενος ظاهرة في النص. وتوضح الحاشية اللفظ اليوناني المنقول صوتيًا.
- source_word: Ναθαναὴλ ὁ ἀπὸ Κανὰ τῆς Γαλιλαίας
  choice: نثنائيل من قانا الجليل
  rationale: تنقل «من» دلالة المنشأ في ἀπό، و«قانا الجليل» تسمية جغرافية عربية موجزة ومألوفة.
- source_word: οἱ τοῦ Ζεβεδαίου
  choice: ابنا زبدي
  rationale: التركيب اليوناني يحذف كلمة «ابنان» المفهومة من السياق؛ وإثباتها لازم للوضوح بالعربية، والمقصود ابنا زبدي المعروفان.
- source_word: ἄλλοι ἐκ τῶν μαθητῶν αὐτοῦ δύο
  choice: واثنان آخران من تلاميذه
  rationale: تحافظ الصياغة على العدد وعلى الدلالة التبعيضية لحرف ἐκ.
- source_word: καί ... καί
  choice: فواصل مع واو العطف
  rationale: صيغ التعداد بالعربية صياغة طبيعية مع الواو حيث يلزم، من غير فقدان ترابط عناصر القائمة.
