  text: λέγει αὐτοῖς Σίμων Πέτρος· Ὑπάγω ἁλιεύειν· λέγουσιν αὐτῷ· Ἐρχόμεθα καὶ ἡμεῖς σὺν σοί. ἐξῆλθον καὶ ἐνέβησαν εἰς τὸ ⸀πλοῖον, καὶ ἐν ἐκείνῃ τῇ νυκτὶ ἐπίασαν οὐδέν.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/003.yaml
  text: Simon Peter said to them[a], “I am going to fish.” They said to him, “We are also coming with you.” They went out and got into the boat, and that night they caught nothing.
translation:
  language: ar
  text: 'قال لهم سمعان بطرس[a]: «أنا ذاهب لأصطاد السمك». فقالوا له: «ونحن أيضًا سنأتي معك». فخرجوا وركبوا القارب، وفي تلك الليلة لم يصطادوا شيئًا.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'جاء الفعلان في اليونانية بصيغة المضارع التاريخي: «يقول لهم سمعان بطرس... يقولون له»، وهي سمة سردية شائعة تُنقل هنا بالماضي وفق الأسلوب العربي الطبيعي.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει ... λέγουσιν
  choice: قال ... فقالوا
  rationale: استُعمل الماضي لأنه الأسلوب الطبيعي في السرد العربي، مع بيان المضارع التاريخي اليوناني في الحاشية.
- source_word: Ὑπάγω ἁλιεύειν
  choice: أنا ذاهب لأصطاد السمك
  rationale: تنقل العبارة قصد بطرس المباشر، وتوضح أن الفعل ἁλιεύειν يعني صيد السمك في هذا السياق.
- source_word: Ἐρχόμεθα καὶ ἡμεῖς σὺν σοί
  choice: ونحن أيضًا نأتي معك
  rationale: تحافظ على توكيد καὶ ἡμεῖς، وعلى معنى المصاحبة في σὺν σοί، مع إبقاء صورة المضارع في جوابهم.
- source_word: ἐξῆλθον
  choice: خرجوا
  rationale: مقابل مباشر وطبيعي لفعل الخروج، من غير إضافة تحديد مكاني لا يصرح به النص.
- source_word: ἐνέβησαν εἰς τὸ πλοῖον
  choice: ركبوا القارب
  rationale: صياغة عربية مألوفة للصعود إلى وسيلة نقل، و«القارب» أنسب من «السفينة» في سياق الصيد.
- source_word: ἐν ἐκείνῃ τῇ νυκτὶ
  choice: في تلك الليلة
  rationale: تنقل التعبير الزمني بوضوح وطبيعية.
- source_word: ἐπίασαν οὐδέν
  choice: لم يصطادوا شيئًا
  rationale: يعني πιάζω هنا الإمساك بصيد، والنفي مع «شيئًا» يحفظ معنى انعدام الحصيلة تمامًا.
