  yaml_path: translation/nt/john/021/017.yaml
  text: He said to him the third time[a], “Simon, son of John, do you love me?” Peter was grieved because he said to him the third time, “Do you love me?” And he said to him, “Lord, you know all things; you know that I love you.” Jesus said to him[b], “Feed my sheep.”
translation:
  language: ar
  text: 'قال له للمرة الثالثة[a]: «يا سمعان بن يوحنا، أتحبني؟» فحزن بطرس لأنه قال له للمرة الثالثة: «أتحبني؟» وقال له: «يا رب، أنت تعرف كل شيء؛ وأنت تعلم أني أحبك»[b]. فقال له يسوع: «أطعم خرافي».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يستعمل اليوناني هنا الفعل φιλέω، أي «يحبّ، يكنّ مودة»، بينما استعمل يسوع في السؤالين السابقين الفعل ἀγαπάω. يرى بعض المفسرين أن بين الفعلين فرقًا مقصودًا، ويراه آخرون تناوبًا بين لفظين متداخلين في هذا السياق. لذلك تُرجما بلفظ «أحب» من غير فرض فرق أشد مما يثبته النص.
    reason: lexical_alternative
  - marker: b
    text: 'يستعمل بطرس في جوابه فعلين يونانيين مختلفين للمعرفة: οἶδα وγινώσκω. نُقلا هنا بـ«تعرف» و«تعلم» للمحافظة على الاختلاف اللفظي، من غير الجزم بفرق دلالي محدد بينهما في هذا السياق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ τρίτον
  choice: للمرة الثالثة
  rationale: تعبير عربي طبيعي يحفظ دلالة التكرار وتسلسله.
- source_word: Σίμων Ἰωάννου
  choice: يا سمعان بن يوحنا
  rationale: المضاف إليه اليوناني يُفهم هنا على أنه نسبة أبوية؛ والنداء الصريح طبيعي في العربية.
- source_word: φιλεῖς / φιλῶ
  choice: أتحبني؟ / أحبك
  rationale: الفعل يدل على المحبة والمودة، و«أحب» يحفظ قوة الحوار من غير فرض تمييز حاد بينه وبين ἀγαπάω في السؤالين السابقين.
- source_word: ἐλυπήθη
  choice: فحزن
  rationale: ينقل الأسى الذي أصاب بطرس بصياغة عربية واضحة ومباشرة.
- source_word: Κύριε
  choice: يا رب
  rationale: يلائم خطاب بطرس ليسوع القائم ويحفظ اللقب من غير اختزاله إلى مجرد صيغة احترام.
- source_word: πάντα σὺ οἶδας
  choice: أنت تعرف كل شيء
  rationale: يحفظ شمول πάντα وتوكيد الضمير σὺ في عبارة عربية طبيعية.
- source_word: οἶδας ... γινώσκεις
  choice: تعرف ... تعلم
  rationale: يحفظ اختلاف الفعلين اليونانيين بلفظين عربيين متقاربين من غير الادعاء بوجود تمييز اصطلاحي قاطع بينهما.
- source_word: Βόσκε
  choice: أطعم
  rationale: يعكس المعنى المحدد للفعل βόσκω، أي توفير الطعام أو المرعى، بدل تعميمه إلى كل أعمال الرعاية.
- source_word: πρόβατά
  choice: خرافي
  rationale: «خراف» تقابل πρόβατα وتحفظ الفرق عن «الحملان» المذكورة في العدد 15.
theological_decisions:
- issue: هل يُجسَّد فرق حاد بين φιλέω وἀγαπάω في حوار يسوع وبطرس؟
  choice: استعمال «أحب» لـφιλέω في المتن، مع بيان التناوب اللفظي في الحاشية.
  alternative: التفريق في العربية بين «تحب» و«تودّ» أو «تعزّ».
  rationale: التداخل الدلالي بين الفعلين في اليونانية الكوينه لا يبرر فرض فرق لاهوتي حاسم في المتن؛ والحاشية تحفظ موضع الاحتمال والتوتر التفسيري.
- issue: مدى قول بطرس «تعرف كل شيء»
  choice: إبقاء العبارة شاملة كما وردت من غير تقييد أو توسعة عقائدية.
  alternative: تقييدها إلى «تعرف كل شيء عن هذا الأمر» أو شرحها صراحة بأنها تقرير لعقيدة العلم الكلي.
  rationale: النص يقول πάντα، أي «كل شيء»؛ فينبغي نقل قوته من غير إضافة تفسير عقائدي إلى ألفاظ الآية.
- issue: اختلاف οἶδας وγινώσκεις في جواب بطرس
  choice: ترجمتهما «تعرف» و«تعلم» مع حاشية تنبه إلى اختلاف الأصل من غير تحديد فرق صارم.
  alternative: توحيدهما في العربية بلفظ «تعلم» في الموضعين، أو تحميل أحدهما معنى «تدرك يقينًا».
  rationale: اللفظان كلاهما يفيدان المعرفة هنا، وقد تكون بينهما دلالة دقيقة، لكن تعيينها على نحو قاطع يتجاوز ما يثبته السياق.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «سمعان» للصيغة اليونانية Σίμων، و«خرافي» للدلالة على الملكية مع الحفاظ على صورة القطيع. وُضعت علامتا الحاشية في المتن؛ العلامة [a] بعد ذكر المرة الثالثة أولًا، و[b] بعد نسبة القول إلى يسوع لتلحق بملاحظة جواب بطرس كما في طبقة الاستشارة الإنجليزية، مع أن الأنسب موضوعيًا أن تتصل الحاشية الثانية بعبارة «تعرف... تعلم».
