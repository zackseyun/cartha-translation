base_translation:
  language: en
  yaml_path: translation/nt/john/021/016.yaml
  text: He said to him again a second time[a], “Simon, son of John, do you love me?” He said to him, “Yes, Lord; you know that I love you.” He said to him[b], “Shepherd my sheep.”
translation:
  language: ar
  text: 'قال له مرة أخرى، للمرة الثانية: «يا سمعان بن يوحنا، أتحبني؟» قال له: «نعم يا رب، أنت تعلم أنني أحبك». قال له: «ارعَ خرافي».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يستعمل النص اليوناني فعلين مختلفين للمحبة في هذا الحوار: يسأل يسوع بالفعل ἀγαπάω، ويجيب بطرس بالفعل φιλέω. يرى بعض المفسرين فرقًا بينهما، ويراه آخرون تنوعًا أسلوبيًا؛ لذلك تُرجم كلاهما هنا بـ«أحب».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν δεύτερον
  choice: ثانيةً
  rationale: يفيد التركيب اليوناني التكرار وأن هذا هو السؤال الثاني. تؤدي «ثانيةً» المعنيين طبيعيًا في العربية من غير حشو ثقيل.
- source_word: Σίμων Ἰωάννου
  choice: يا سمعان بن يوحنا
  rationale: المضاف إليه Ἰωάννου يُفهم هنا على أنه نسبة أبوية، أي «بن يوحنا».
- source_word: ἀγαπᾷς με
  choice: أتحبني؟
  rationale: ترجمة مباشرة وطبيعية للفعل ἀγαπάω مع مفعوله، من غير تحميله درجة عاطفية خاصة لا يوجبها السياق.
- source_word: Ναί, κύριε
  choice: نعم يا رب
  rationale: «نعم» جواب إثبات بسيط، و«يا رب» تلائم خطاب بطرس ليسوع في هذا السياق.
- source_word: σὺ οἶδας
  choice: أنت تعلم
  rationale: إظهار الضمير المنفصل يحفظ التوكيد الخفيف في الضمير اليوناني الصريح σὺ.
- source_word: ὅτι φιλῶ σε
  choice: أني أحبك
  rationale: يُترجم φιλέω هنا أيضًا بـ«أحب» لأن الفرق المقصود بينه وبين ἀγαπάω غير محسوم في هذا السياق؛ ويُبيَّن التنوع اللفظي في الحاشية.
- source_word: Ποίμαινε
  choice: ارعَ
  rationale: فعل الأمر من ποιμαίνω يستحضر عمل الراعي في رعاية القطيع وقيادته، وتحفظ «ارعَ» الصورة الرعوية بإيجاز.
- source_word: τὰ πρόβατά μου
  choice: خرافي
  rationale: تحفظ الترجمة الصورة المحسوسة للغنم وملكية يسوع لها.
theological_decisions:
- issue: هل يُميَّز بين ἀγαπάω وφιλέω بفعلين عربيين مختلفين؟
  choice: ترجمة الفعلين بـ«أحب» في المتن، مع بيان اختلاف اللفظ اليوناني في الحاشية.
  alternative: ترجمة ἀγαπάω بـ«تحب» وφιλέω بـ«أودّك» أو «أكنّ لك مودة».
  rationale: يوجد تنوع لفظي حقيقي، لكن مدى دلالته المقصودة هنا محل خلاف، كما أن استعمال يوحنا قد يُظهر تداخلًا بين الفعلين. التفريق الحاد في المتن قد يفرض معنى نفسيًا أو لاهوتيًا غير محسوم.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعملت «ثانيةً» لتأدية πάλιν δεύτερον بصورة طبيعية، وحُفظت الصورة الرعوية في «ارعَ خرافي». وُضعت علامة الحاشية بعد الآية لأنها تتناول لفظي المحبة الواردين فيها.
