reference: John 21:18
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω σοι, ὅτε ἦς νεώτερος, ἐζώννυες σεαυτὸν καὶ περιεπάτεις ὅπου ἤθελες· ὅταν δὲ γηράσῃς, ἐκτενεῖς τὰς χεῖράς σου, καὶ ἄλλος ⸂σε ζώσει⸃ καὶ οἴσει ὅπου οὐ θέλεις.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/018.yaml
  text: Truly[a], truly, I say to you, when you were younger, you used to dress yourself and walk where you wanted; but when you grow old, you will stretch out your hands[c][b], and another will dress you and carry you where you do not want to go.
translation:
  language: ar
  text: '«الحقَّ الحقَّ أقول لك: حين كنتَ أصغر سنًّا، كنتَ تشدُّ حزامك بنفسك[a] وتمشي حيث تشاء؛ ولكن حين تشيخ، ستمدُّ يديك[b]، وآخر سيشدُّ لك حزامك ويأخذك[c] إلى حيث لا تشاء.»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: كنتَ تتمنطق أو تشدّ حزامك بنفسك. يدل الفعل اليوناني حرفيًّا على شدّ الثياب أو ربطها بالحزام، ويقابل هنا استقلال بطرس السابق باعتماده على غيره لاحقًا.'
    reason: lexical_alternative
  - marker: b
    text: غالبًا ما تُفهم عبارة «ستمدّ يديك» على أنها إشارة إلى موت بطرس صلبًا؛ ويوضح العدد التالي أن يسوع قال هذا مشيرًا إلى نوع الموت الذي سيمجّد به بطرس الله.
    reason: cross_reference
  - marker: c
    text: 'أو: «يحملك» أو «يقتادك». يمكن أن يدل الفعل اليوناني على حمل شخص أو أخذه إلى وجهة لا يريدها.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: الحقَّ الحقَّ
  rationale: يحفظ تكرار الصيغة التوكيدية المهيبة في أسلوب عربي كتابي واضح، من غير الاكتفاء بنقل صوتي مثل «آمين آمين».
- source_word: ὅτε ἦς νεώτερος
  choice: حين كنتَ أصغر سنًّا
  rationale: يعكس صيغة المقارنة νεώτερος بوضوح ويربطها بالمقابلة مع الشيخوخة اللاحقة.
- source_word: ἐζώννυες σεαυτόν / ἄλλος σε ζώσει
  choice: كنتَ تشدُّ ثيابك بنفسك / آخر سيشدُّ ثيابك
  rationale: يحافظ على الفعل والصورة نفسيهما في طرفي المقابلة؛ والفعل يدل حرفيًّا على شدّ الثياب أو تمنطقها، بينما العبارة العربية طبيعية نسبيًّا ولا تختزل المعنى في مجرد ارتداء الثياب.
- source_word: περιεπάτεις ὅπου ἤθελες
  choice: وتمشي حيث تشاء
  rationale: يحفظ المعنى الحركي الملموس للفعل، ويبرز حرية بطرس السابقة.
- source_word: ὅταν δὲ γηράσῃς
  choice: ولكن حين تشيخ
  rationale: صياغة عربية طبيعية ذات دلالة مستقبلية في السياق، و«لكن» تؤدي المقابلة التي تفيدها δέ.
- source_word: ἐκτενεῖς τὰς χεῖράς σου
  choice: ستمدُّ يديك
  rationale: ترجمة مباشرة للصورة من غير إدخال تفسير الصلب في المتن.
- source_word: οἴσει
  choice: يأخذك
  rationale: الفعل φέρω واسع الدلالة، وقد يعني يحمل أو يأخذ إلى موضع؛ «يأخذك» أوضح في العربية هنا مع إبقاء احتمال الاقتياد أو الحمل في الحاشية.
- source_word: ὅπου οὐ θέλεις
  choice: إلى حيث لا تشاء
  rationale: تؤدي الوجهة غير المرغوبة بعبارة عربية موجزة، من غير إضافة فعل غير موجود صراحة في اليونانية.
theological_decisions:
- issue: هل تُصرَّح الإشارة إلى صلب بطرس في المتن؟
  choice: الإبقاء على صورة «ستمد يديك» من غير تفسير صريح في المتن
  alternative: صياغة العبارة بوصفها نبوءة صريحة عن الصلب
  rationale: العدد التالي هو الذي يفسر القول بأنه يشير إلى نوع الموت الذي سيمجد به بطرس الله؛ لذا يحفظ المتن تسلسل النص وغموض الصورة المقصود.
- issue: هل يُترجم ζώσει بمعنى «يربطك»؟
  choice: سيشد ثيابك
  alternative: سيربطك
  rationale: التكرار المقصود للفعل نفسه يقابل اعتماد بطرس على نفسه سابقًا باعتماده على آخر لاحقًا. أما «يربطك» فقد يرجّح دلالة الأسر أو الصلب قبل أن يوضحها السياق التالي.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة، مع الحفاظ على التكرار اليوحناوي والصور الحسية في الأصل. وُضعت علامات الحواشي بحسب مواضعها الدلالية في المتن، من غير تفسير نبوءة الموت داخله.
