  text: 'فلمّا رآه بطرس، قال ليسوع: «يا رب، وماذا عن هذا؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτον ... ἰδών
  choice: فلمّا رآه
  rationale: يعيد اسم الإشارة إلى التلميذ المذكور في السياق السابق بصياغة عربية طبيعية، ويؤدي اسم الفاعل الظرفي بمعنى زمني.
- source_word: οὖν
  choice: فـ
  rationale: تربط الآية بما قبلها ربطًا استنتاجيًا/سرديًا موجزًا يناسب العربية.
- source_word: λέγει
  choice: قال
  rationale: المضارع التاريخي اليوناني يُنقل بالماضي في السرد العربي الطبيعي من غير تغيير في زمن الحدث.
- source_word: Κύριε
  choice: يا رب
  rationale: ترجمة مباشرة للنداء اليوناني في مخاطبة يسوع.
- source_word: οὗτος δὲ τί;
  choice: وهذا ماذا يكون أمره؟
  rationale: يحافظ على إيجاز السؤال وعدم اكتماله النحوي في اليونانية، مع إيضاح عربي محدود يدل على السؤال عن شأن التلميذ الآخر دون تحديد مصيره أو مهمته.
theological_decisions:
- issue: المقصود بالسؤال الناقص «οὗτος δὲ τί;»
  choice: وهذا ماذا يكون أمره؟
  alternative: وماذا عن هذا؟
  rationale: الصياغة المختارة تحفظ انفتاح السؤال على شأن الرجل أو مصيره أو ما سيطلبه يسوع منه، ولا تحسم معنى لم يصرح به النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم الماضي بدل المضارع التاريخي لأنه الأسلوب الطبيعي في السرد العربي، مع إبقاء السؤال مقتضبًا ومفتوح الدلالة.
