  text: ὅτι τὰ ῥήματα ἃ ⸀ἔδωκάς μοι δέδωκα αὐτοῖς, καὶ αὐτοὶ ἔλαβον καὶ ἔγνωσαν ἀληθῶς ὅτι παρὰ σοῦ ἐξῆλθον, καὶ ἐπίστευσαν ὅτι σύ με ἀπέστειλας.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/008.yaml
  text: For the words that you gave me I have given to them[a], and they received them and truly came to know that I came from you[b], and they believed that you sent me.
translation:
  language: ar
  text: لأن الأقوال التي أعطيتني إياها قد أعطيتُها لهم[a]، وهم تلقّوها وعرفوا حقًّا أني خرجتُ من عندك[b]، وآمنوا أنك أنت أرسلتني.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الكلمات التي أعطيتني إياها».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «أتيتُ من عندك».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥήματα
  choice: الأقوال
  rationale: تدل ῥήματα على الأقوال أو الكلمات المنطوقة؛ و«الأقوال» تحافظ على الجمع وتناسب السياق العربي، مع توثيق «الكلمات» بديلًا في الحاشية.
- source_word: ἔδωκάς ... δέδωκα
  choice: أعطيتني ... قد أعطيتُها
  rationale: 'يحافظ التعبير بـ«قد» في الفعل الثاني على معنى الفعل التام: عطاء اكتمل وبقي أثره، مع إبقاء مقابلة العطاء بين الآب والابن.'
- source_word: ἔλαβον
  choice: قبلوها
  rationale: في هذا السياق يتجاوز الفعل مجرد الأخذ المادي إلى تلقي الأقوال وقبولها، و«قبلوها» عربية طبيعية دون زيادة تفسيرية كبيرة.
- source_word: ἔγνωσαν ἀληθῶς
  choice: عرفوا حقًّا
  rationale: ينقل «عرفوا» فعل المعرفة، وتحفظ «حقًّا» الظرف ἀληθῶς من غير تحويله إلى يقين ذهني فقط.
- source_word: παρὰ σοῦ ἐξῆλθον
  choice: خرجتُ من عندك
  rationale: يحفظ «خرجت» الدلالة الحركية للفعل ἐξέρχομαι، ويعبّر «من عندك» عن المصدر في παρά مع المضاف إليه دون حسم الوزن اللاهوتي للعبارة.
- source_word: ἐπίστευσαν ὅτι
  choice: آمنوا أن
  rationale: تأتي الجملة التالية مضمونًا للإيمان؛ لذا تنقل «آمنوا أن» البنية الخبرية مباشرة.
- source_word: ἀπέστειλας
  choice: أرسلتني
  rationale: «أرسل» المقابل العربي المباشر، ويحفظ فعل الآب في إرسال الابن دون إضافة معنى التكليف صراحة.
- source_word: ὅτι
  choice: لأن
  rationale: ὅτι الأولى تعليلية أو تفسيرية بالنسبة إلى السياق السابق، و«لأن» توصل هذه العلاقة بوضوح.
theological_decisions:
- issue: علاقة الابن بالآب في παρὰ σοῦ ἐξῆλθον
  choice: خرجتُ من عندك
  alternative: أتيتُ من عندك
  rationale: تحافظ الصياغة المختارة على لفظ الخروج ودلالة المصدر مع ترك طبيعة هذا الخروج ووزنه اللاهوتي كما في النص، دون إدخال مصطلحات عقائدية لاحقة.
- issue: قوة σύ في σύ με ἀπέστειλας
  choice: أنك أنت أرسلتني
  alternative: أنك أرسلتني
  rationale: إثبات الضمير المنفصل «أنت» يحفظ بروز σύ في اليونانية ويؤكد أن الآب هو المرسِل من غير إضافة تفسير.
- issue: دلالة الإيمان في ἐπίστευσαν ὅτι
  choice: آمنوا أن
  alternative: صدّقوا أن
  rationale: «آمنوا» تحفظ المصطلح اليوحناوي المعتاد، بينما تبقي جملة «أن» واضحة في أن المذكور هنا مضمون إيمانهم.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعملت «الأقوال» للجمع الملموس، و«من عندك» لصياغة عربية طبيعية تحفظ معنى المصدر، مع إبراز الضمير في «أنك أنت أرسلتني» موافقةً للتوكيد في الأصل.
