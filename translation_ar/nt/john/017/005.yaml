id: JHN.17.5
reference: John 17:5
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ νῦν δόξασόν με σύ, πάτερ, παρὰ σεαυτῷ τῇ δόξῃ ᾗ εἶχον πρὸ τοῦ τὸν κόσμον εἶναι παρὰ σοί.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/005.yaml
  text: And now[a], Father[b], glorify me in your presence with the glory that I had with you before the world existed.
translation:
  language: ar
  text: والآن، مجِّدني أنت يا أبتِ عندك[a]، بالمجد الذي كان لي معك قبل أن يكون العالم[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «لدى ذاتك»؛ فالعبارة اليونانية قد تدل بصورة أكثر حرفية على القرب من الآب أو الحضور لديه.
    reason: lexical_alternative
  - marker: b
    text: أو «قبل أن يوجد العالم» أو «قبل أن يأتي العالم إلى الوجود».
    reason: lexical_alternative
lexical_decisions:
- source_word: δόξασόν
  choice: مجِّدني
  rationale: صيغة أمر من δοξάζω. يحافظ فعل «مجَّد» على مفردات المجد المحورية في إنجيل يوحنا، ولا يضيّق المعنى إلى مجرد التكريم.
- source_word: σύ, πάτερ
  choice: أنت يا أبتِ
  rationale: أُبقي الضمير الصريح «أنت» لإظهار التوكيد الموجود في اليونانية، واستُعمل «يا أبتِ» نداءً عربيًا فصيحًا واضحًا من غير إضافة تفسيرية.
- source_word: παρὰ σεαυτῷ
  choice: عندك
  rationale: تفيد παρά مع المجرور القرب أو الحضور. و«عندك» عربية طبيعية تحفظ هذا المعنى المكاني والعلاقي، مع بيان البديل الأقرب إلى ظاهر التركيب في الحاشية.
- source_word: τῇ δόξῃ
  choice: بالمجد
  rationale: تنقل الباء علاقة المجد بفعل التمجيد بصورة طبيعية، من غير حسم زائد لوظيفة المجرور بين المصاحبة والوسيلة.
- source_word: ᾗ εἶχον
  choice: الذي كان لي
  rationale: ينقل هذا التعبير دلالة εἶχον على كون المجد سابقًا للمسيح أو خاصًا به، مع الحفاظ على بساطة العبارة.
- source_word: πρὸ τοῦ τὸν κόσμον εἶναι
  choice: قبل أن يكون العالم
  rationale: ينقل تركيب المصدر المسبوق بـ πρὸ τοῦ دلالة الزمن السابق، ويحافظ على فعل الكينونة من غير توسيعه إلى وصف لعملية الخلق.
- source_word: παρὰ σοί
  choice: معك
  rationale: تفيد παρά مع المجرور الوجود في القرب والحضور. و«معك» موجزة وطبيعية، وتحفظ البعد العلاقي في العبارة.
- source_word: κόσμον
  choice: العالم
  rationale: «العالم» هو المقابل العربي المألوف والملائم لـ κόσμος في هذا السياق اليوحناوي.
theological_decisions:
- issue: دلالة الآية على وجود الابن قبل وجود العالم
  choice: صيغت العبارة الزمنية مباشرةً بوصفها مجدًا كان للمسيح مع الآب قبل أن يكون العالم.
  alternative: تخفيف العبارة لتدل على مجد مقدَّر له فحسب قبل الخلق.
  rationale: ينسب النص اليوناني المجد إلى المتكلم بصيغة «كان لي» ويضعه «معك» قبل وجود العالم؛ لذلك ينبغي عدم إضعاف هذه الدلالة أو توسيعها بعقيدة تفسيرية غير مصرَّح بها في الآية.
- issue: طبيعة المجد المذكور
  choice: الإبقاء على لفظ «المجد» بلا شرح تفسيري داخل المتن.
  alternative: ترجمته بـ«الجلال» أو «الكرامة».
  rationale: لا تعرّف الآية طبيعة هذا المجد تعريفًا إضافيًا؛ والإبقاء على «المجد» يحفظ المفردة اليوحناوية والتوتر اللاهوتي في النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة دعائية مهيبة. حُفظ توكيد الضمير اليوناني في «أنت يا أبتِ»، واستُعملت عبارتا «عندك» و«معك» لتجنب الحرفية المتكلفة مع إبقاء معنى القرب والحضور.
