  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ليسوا منتمين إلى العالم». يستعمل النص اليوناني حرف الجر «مِن» (ἐκ)، وقد يدل على المصدر أو المنشأ أو الانتماء.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ
  choice: مِن
  rationale: حرف الجر «مِن» هو المقابل العربي الطبيعي لـἐκ هنا، ويحفظ دلالة المصدر أو المنشأ، مع إمكان أن يفهم منه أيضًا عدم الانتماء.
- source_word: κόσμου
  choice: الْعَالَمِ
  rationale: يحافظ «العالم» على اللفظ اليوحنّاوي الواسع من غير تضييقه إلى «نظام العالم» أو إضافة تفسير عقائدي إلى المتن.
- source_word: οὐκ εἰσὶν
  choice: لَيْسُوا
  rationale: ينقل نفي الكينونة في الزمن الحاضر نقلًا مباشرًا وطبيعيًا في العربية.
- source_word: καθὼς
  choice: كَمَا أَنَّ
  rationale: تُظهر العبارة المقارنة الواضحة بين التلاميذ ويسوع بلغة عربية فصيحة وطبيعية.
- source_word: ἐγὼ
  choice: أَنَا
  rationale: أُبقي الضمير المنفصل لأنه وارد صراحة في اليونانية ويمنح طرف المقارنة توكيدًا.
- source_word: οὐκ εἰμὶ
  choice: لَسْتُ
  rationale: ينقل صيغة المتكلم المفرد المنفية في الحاضر بإيجاز ودقة.
- source_word: ἐκ τοῦ κόσμου
  choice: مِنَ الْعَالَمِ
  rationale: تُحفظ العبارة نفسها في الجملتين، بما يصون التوازي اللفظي والدلالي في النص اليوناني.
theological_decisions:
- issue: دلالة «العالم» في لاهوت يوحنا
  choice: إبقاء «العالم» بلا توسيع تفسيري في المتن.
  alternative: نظام العالم؛ النظام الحاضر الساقط
  rationale: يحمل κόσμος في يوحنا أبعادًا لاهوتية بحسب السياق، لكن الآية لا تفرض تفسيرًا أضيق؛ لذلك يحفظ اللفظ البسيط التوتر الدلالي ولا يستورد شرحًا مذهبيًا.
- issue: دلالة ἐκ بين المنشأ والانتماء
  choice: ترجمة العبارة «مِنَ العالم» مع بيان احتمال الانتماء في الحاشية.
  alternative: ليسوا للعالم؛ لا ينتمون إلى العالم
  rationale: «مِن» أقرب إلى صورة الأصل اليوناني وتحفظ معنى المصدر أو المنشأ، بينما تسمح الحاشية بإظهار دلالة الانتماء المحتملة من غير حسم الغموض في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم التشكيل الجزئي لرفع اللبس، وحُفظ التوازي بين شطري الآية، مع إبراز الضمير «أنا» الوارد صراحة في اليونانية.
