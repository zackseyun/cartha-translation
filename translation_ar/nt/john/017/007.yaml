  text: Now they have come to know that everything you have given me is from you[a].
translation:
  language: ar
  text: الآن قد عرفوا أن كلَّ ما أعطيتني إياه هو منك[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أن كلَّ ما أعطيتني إياه يأتي منك».'
    reason: بديل لفظي يعبّر عن دلالة المصدر في παρὰ σοῦ بصيغة فعلية.
lexical_decisions:
- source_word: νῦν
  choice: الآن
  rationale: ظرف زمان يحدد المرحلة الراهنة التي بلغها التلاميذ في معرفتهم، و«الآن» موجزة وطبيعية.
- source_word: ἔγνωκαν
  choice: قد عرفوا
  rationale: صيغة التام اليونانية تدل على معرفة تحققت وبقي أثرها حاضرًا؛ وتؤدي «قد عرفوا» هذا المعنى بعبارة عربية واضحة دون زيادة تفسيرية.
- source_word: ὅτι
  choice: أن
  rationale: أداة تُدخل مضمون ما عرفه التلاميذ.
- source_word: πάντα ὅσα
  choice: كلَّ ما
  rationale: تركيب عربي طبيعي يحفظ معنى الشمول مع الصلة التي تتبع الاسم الموصول.
- source_word: δέδωκάς μοι
  choice: أعطيتني إياه
  rationale: يحفظ فعل العطاء وكون المتكلم هو المتلقي؛ وأُضيف ضمير المفعول «إياه» لاستقامة العربية بعد «كل ما».
- source_word: παρὰ σοῦ
  choice: منك
  rationale: παρά مع المضاف إليه يدل هنا على المصدر أو المنشأ، و«منك» تنقل ذلك بإيجاز.
- source_word: εἰσιν
  choice: هو
  rationale: مع أن الفعل في اليونانية جمع، يعود الخبر في العربية طبيعيًا على «كل ما» بوصفه تركيبًا مفردًا في اللفظ.
theological_decisions:
- issue: علاقة ما أعطاه الآب للابن بمصدره
  choice: أن كلَّ ما أعطيتني إياه هو منك
  alternative: أن كلَّ ما أعطيتني إياه يأتي منك
  rationale: تحافظ الصياغة على تقرير أن مصدر كل ما أُعطي للابن هو الآب، من غير توسيع العبارة إلى صياغة عقائدية لاحقة أو حسم ما يتركه النص موجزًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «قد عرفوا» لإبراز النتيجة الحاضرة لفعل المعرفة، وحُفظت دلالة المصدر في «منك». تظهر علامة الحاشية [a] في المتن.
