  text: Ἐφανέρωσά σου τὸ ὄνομα τοῖς ἀνθρώποις οὓς ⸀ἔδωκάς μοι ἐκ τοῦ κόσμου. σοὶ ἦσαν κἀμοὶ αὐτοὺς ⸁ἔδωκας, καὶ τὸν λόγον σου τετήρηκαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/006.yaml
  text: I have made your name known to the men whom you gave me out of the world. They were yours, and you gave them to me, and they have kept your word.
translation:
  language: ar
  text: أظهرتُ اسمك[a][b] للناس الذين أعطيتني إياهم من العالم[c]. كانوا لك، فأعطيتني إياهم، وقد حفظوا كلمتك[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أعلنتُ اسمك».'
    reason: lexical_alternative
  - marker: b
    text: لا يُراد بـ«اسمك» مجرد تسمية منطوقة، بل هوية الله وصفاته كما أعلنها.
    reason: cultural_note
  - marker: c
    text: تفيد العبارة أيضًا أنهم أُعطوا له من وسط العالم.
    reason: lexical_alternative
  - marker: d
    text: 'أي: راعوا كلمتك وتمسكوا بها وأطاعوها؛ واليونانية تقول حرفيًا: «حفظوا كلمتك».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐφανέρωσά
  choice: أظهرتُ
  rationale: ينقل فعل φανερόω معنى إظهار ما كان غير ظاهر أو التعريف به، ويحافظ على اقترانه المباشر بلفظ «اسمك» من غير تفكيك الصورة الأصلية.
- source_word: τὸ ὄνομα
  choice: اسمك
  rationale: يحافظ على اللفظ الملموس في اليونانية وعلى عمقه في إنجيل يوحنا، حيث يدل الاسم على هوية الله المعلنة وصفاته وحضوره، من غير اختزاله في تفسير واحد.
- source_word: τοῖς ἀνθρώποις
  choice: للناس
  rationale: لفظ ἄνθρωποι يدل هنا على أشخاص بشريين، و«الناس» عربية طبيعية ودقيقة؛ أما كون المشار إليهم في السياق المباشر تلاميذ يسوع فيُفهم من السياق ولا يلزم تضمينه في اللفظ نفسه.
- source_word: οὓς ἔδωκάς μοι
  choice: الذين أعطيتني إياهم
  rationale: صياغة عربية واضحة تحافظ على فعل العطاء وعلى كون الأشخاص هم المفعول به المعطى للابن.
- source_word: ἐκ τοῦ κόσμου
  choice: من العالم
  rationale: حرف الجر ἐκ يفيد المصدر أو الخروج من وسط شيء؛ و«من العالم» تؤدي المعنى طبيعيًا في العربية، مع إمكان فهم الاختيار من وسط العالم بحسب السياق.
- source_word: σοὶ ἦσαν
  choice: كانوا لك
  rationale: يحافظ على إيجاز العبارة اليونانية ودلالتها على الاختصاص أو الانتماء.
- source_word: κἀμοὶ αὐτοὺς ἔδωκας
  choice: فأعطيتني إياهم
  rationale: ينقل معنى إعطائهم للابن بترتيب عربي طبيعي، وتفيد الفاء اتصال الجملة بما قبلها من غير إضافة تفسير عقدي.
- source_word: τὸν λόγον σου
  choice: كلمتك
  rationale: يحافظ على لفظ λόγος وعلى صداه اللاهوتي في يوحنا، بدل حصره في «رسالتك» أو «تعليمك».
- source_word: τετήρηκαν
  choice: قد حفظوا
  rationale: يحافظ على معنى τηρέω الأساسي، أي الحفظ والمراعاة، وعلى دلالة صيغة التمام اليونانية إلى حد مناسب في العربية بواسطة «قد».
theological_decisions:
- issue: دلالة «اسمك» في لاهوت يوحنا
  choice: الإبقاء على «اسمك» في المتن
  alternative: تفسيرها في المتن بعبارة «مَن أنت» أو «حقيقتك وصفاتك»
  rationale: النص يصرح بالاسم، وهو في السياق يحمل معنى الهوية والصفات المعلنة؛ إبقاء الصورة الأصلية يصون غناها ولا يحصرها في إعادة صياغة تفسيرية.
- issue: دلالة τοῖς ἀνθρώποις وهوية المشار إليهم
  choice: ترجمتها «للناس»
  alternative: «للرجال» أو «للبشر»
  rationale: اللفظ اليوناني يمكن أن يكون عامًا، والسياق يحدد أن المقصود المباشر هم التلاميذ. «الناس» أدق وأطبع في العربية من غير أن تنفي هذا المرجع السياقي.
- issue: إعطاء الآب أشخاصًا للابن
  choice: الحفاظ على عبارة العطاء كما وردت من غير شرح مذهبي
  alternative: صياغتها بما يحسم آلية الاختيار وفق تصور إصلاحي أو أرميني بعينه
  rationale: الآية تؤكد فعل العطاء، لكنها لا تفصل هنا آليته أو علاقته بجميع مسائل الاختيار والإيمان؛ لذلك تُصان العبارة والتوتر اللاهوتي من غير استيراد منظومة طائفية.
- issue: معنى حفظ الكلمة
  choice: «حفظوا كلمتك»
  alternative: «أطاعوا كلمتك»
  rationale: الحفظ يتسع للمراعاة والتمسك والطاعة، وهو أقرب إلى اللفظ اليوناني؛ أما «أطاعوا» فيبرز جانبًا صحيحًا لكنه أضيق.
translation_notes:
  register: العربية فصحى حديثة واضحة ووقورة. حافظت الصياغة على إيجاز الصلاة وتكرار فعل «أعطى» ولفظي «الاسم» و«الكلمة»، مع تجنب التراكيب القديمة الثقيلة والتفسير المذهبي داخل المتن.
