  text: καὶ ὑπὲρ αὐτῶν ἐγὼ ἁγιάζω ἐμαυτόν, ἵνα ⸂ὦσιν καὶ αὐτοὶ⸃ ἡγιασμένοι ἐν ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/019.yaml
  text: And for their sake I sanctify myself[b][a], so that they also may be sanctified in truth.
translation:
  language: ar
  text: ومن أجلهم أُقدِّس نفسي[a]، لكي يكونوا هم أيضًا مُقدَّسين في الحق[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أُكرِّس نفسي». الفعل اليوناني من الجذر نفسه المستعمل لاحقًا في عبارة «مُقدَّسين».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «بالحق». يمكن أن تدل العبارة اليونانية على المجال الذي يحدث فيه التقديس أو على وسيلته؛ قارن 17:17.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπὲρ αὐτῶν
  choice: من أجلهم
  rationale: تنقل معنى المنفعة المقصودة في ὑπέρ مع المضاف إليه، من غير أن تفرض معنى النيابة أو الاستبدال.
- source_word: ἁγιάζω ... ἡγιασμένοι
  choice: أُقدِّس ... مُقدَّسين
  rationale: يحافظ تكرار الجذر العربي على تكرار الجذر اليوناني، مع بيان المعنى التكريسي المحتمل في الحاشية.
- source_word: ἐμαυτόν
  choice: نفسي
  rationale: مقابل عربي مباشر وطبيعي للضمير الانعكاسي.
- source_word: ἵνα
  choice: لكي
  rationale: تؤدي قوة الغاية في الأداة اليونانية بعبارة عربية واضحة.
- source_word: ὦσιν καὶ αὐτοὶ
  choice: يكونوا هم أيضًا
  rationale: تحفظ معنى الاشتمال والتوكيد الذي يحمله καὶ αὐτοὶ.
- source_word: ἐν ἀληθείᾳ
  choice: في الحق
  rationale: تعبير عربي طبيعي يحفظ معنى المجال أو الواقع، ويبقي الصلة اللفظية بيوحنا 17:17 من غير حسم معنى الوسيلة.
theological_decisions:
- issue: معنى تقديس يسوع لنفسه
  choice: الإبقاء على «أُقدِّس نفسي» في المتن، مع توضيح احتمال «أُكرِّس نفسي» في الحاشية.
  alternative: أُكرِّس نفسي
  rationale: الفعل هنا يمكن أن يدل على تخصيص النفس لله وللمهمة، لا على الانتقال من نجاسة أخلاقية إلى قداسة؛ لكن إبقاء «أُقدِّس» يصون التوازي الجذري مع تقديس التلاميذ.
- issue: دلالة ἐν ἀληθείᾳ
  choice: في الحق
  alternative: بالحق
  rationale: حرف ἐν يسمح بفهم العبارة على أنها مجال التقديس أو وسيلته. اختيرت صيغة المجال في المتن، وأُبقي احتمال الوسيلة في الحاشية من غير حسم التوتر الدلالي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ تكرار جذر «قدّس» لإظهار الترابط في الأصل، مع تجنب تفسير معنى تقديس يسوع تفسيرًا مذهبيًا داخل المتن.
