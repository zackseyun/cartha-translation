source:
  edition: SBLGNT
  text: αὕτη δέ ἐστιν ἡ αἰώνιος ζωὴ ἵνα γινώσκωσι σὲ τὸν μόνον ἀληθινὸν θεὸν καὶ ὃν ἀπέστειλας Ἰησοῦν Χριστόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/003.yaml
  text: 'And this is eternal life: that they may know you[a], the only true God, and Jesus the Messiah whom you sent.'
translation:
  language: ar
  text: 'وهذه هي الحياة الأبدية: أن يعرفوك، أنت وحدك الإله الحقيقي، وأن يعرفوا يسوع المسيح[a] الذي أرسلته.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: اللفظة اليونانية Χριστός، المترجمة «المسيح»، تعني «الممسوح»، ويمكن أن تُستعمل لقبًا أو، في بعض السياقات، تسميةً تؤدي وظيفة الاسم.
    reason: بيان المجال الدلالي لـΧριστός والحفاظ على احتمال استعمالها لقبًا أو تسميةً ملازمة.
lexical_decisions:
- source_word: αὕτη δέ ἐστιν
  choice: وهذه هي
  rationale: تحافظ «و» على قوة δέ الرابطة هنا من غير أن تفرض معنى الاستدراك، وتأتي العبارة عربية سلسة في سياق الشرح.
- source_word: ἡ αἰώνιος ζωὴ
  choice: الحياة الأبدية
  rationale: 'تعبير عربي راسخ ودقيق للمفهوم اليوحناوي: الحياة المنتمية إلى الدهر الآتي والمتصفة بالدوام.'
- source_word: ἵνα γινώσκωσι
  choice: أن يعرفوا
  rationale: تبيّن الجملة مضمون الحياة الأبدية، وصيغة المضارع اليوناني تلائم معرفة مستمرة وليست مجرد إدراك عابر.
- source_word: σὲ τὸν μόνον ἀληθινὸν θεὸν
  choice: يعرفوك، أنت وحدك الإله الحقيقي
  rationale: تحافظ الصياغة على المخاطب بوصفه مفعولًا للفعل، وعلى دلالة μόνον وἀληθινόν، مع ترتيب عربي واضح وطبيعي.
- source_word: καὶ
  choice: وأن يعرفوا
  rationale: أُعيد الفعل في العربية لتوضيح عطف المفعول الثاني ومنع اللبس النحوي، من غير إضافة معنى غير موجود في الأصل.
- source_word: ὃν ἀπέστειλας
  choice: الذي أرسلته
  rationale: تنقل جملة الصلة التي تعرّف يسوع بعلاقته بإرسالية الآب، ويؤدي الماضي العربي معنى الفعل اليوناني الماضي أداءً طبيعيًا.
- source_word: Ἰησοῦν Χριστόν
  choice: يسوع المسيح
  rationale: «المسيح» المقابل العربي المعتاد لـΧριστός، ويحفظ دلالته اللقبية، مع إمكان سماعه أيضًا كتسمية ملازمة ليسوع بحسب السياق.
theological_decisions:
- issue: علاقة عبارة «أنت وحدك الإله الحقيقي» بيسوع في الآية
  choice: الإبقاء على خطاب الآب بأنه وحده الإله الحقيقي، وتمييز يسوع بوصفه الذي أرسله، من دون شرح عقائدي مضاف.
  alternative: إضافة تعبير يصرّح بعقيدة الثالوث أو إعادة الصياغة بما يخفف التمييز النحوي بين الآب ويسوع.
  rationale: يحفظ ذلك wording النص وتوتره اللاهوتي المشروع، ولا يجعل الترجمة تحسم داخل الآية مسائل يبيّنها السياق اليوحناوي الأوسع.
- issue: دلالة Χριστόν
  choice: المسيح
  alternative: الممسوح، أو التعامل مع اللفظة بوصفها اسمًا محضًا بلا دلالة لقبية.
  rationale: «المسيح» هو المقابل العربي الطبيعي والتقليدي الذي يبقي معنى اللقب حاضرًا، فيما توضّح الحاشية إمكان الاستعمال الشبيه بالاسم.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. أُعيد «أن يعرفوا» قبل «يسوع المسيح» لتجنب توهّم أن يسوع بدلٌ من «الإله الحقيقي»، مع بقاء التنسيق الدلالي للأصل. وُضعت علامة الحاشية مباشرة بعد اللفظة التي تشرحها.
