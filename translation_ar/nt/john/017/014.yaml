base_translation:
  language: en
  yaml_path: translation/nt/john/017/014.yaml
  text: I have given them your word[a], and the world has hated them because they are not of the world, just as I am not of the world.
translation:
  language: ar
  text: أنا أعطيتهم كلمتك، والعالم أبغضهم، لأنهم ليسوا من العالم[a]، كما أني أنا لست من العالم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا فهم العبارة بمعنى: «لا ينتمون إلى العالم». تستعمل اليونانية حرفًا يفيد حرفيًا المنشأ، وقد يدل هنا على المنشأ أو الانتماء.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δέδωκα
  choice: أعطيتهم
  rationale: صيغة التام اليونانية تصف عطاءً تمّ وما زال أثره قائمًا؛ والماضي العربي «أعطيتهم» يؤدي المعنى طبيعيًا في السياق من غير زيادة تفسيرية.
- source_word: λόγον
  choice: كلمتك
  rationale: تحافظ «كلمتك» على اللفظ اليوحناوي وما يحمله من دلالة، ولا تحصره في معنى «رسالتك» التفسيري.
- source_word: κόσμος
  choice: العالم
  rationale: هو المقابل العربي المألوف الذي يحفظ سعة اللفظ؛ ويُفهم عداء العالم من السياق دون إدخال شرح في صلب النص.
- source_word: ἐμίσησεν
  choice: أبغضهم
  rationale: ينقل الفعل الماضي اليوناني بعبارة عربية واضحة، ويعبّر السياق نفسه عن العداوة القائمة.
- source_word: ὅτι
  choice: لأنهم
  rationale: الأداة هنا سببية، إذ تبيّن سبب بغض العالم لهم.
- source_word: ἐκ τοῦ κόσμου
  choice: من العالم
  rationale: تحفظ «من» دلالة ἐκ على المنشأ، مع إبقاء احتمال الانتماء حاضرًا من غير حسم تفسيري.
- source_word: καθὼς
  choice: كما
  rationale: تبيّن المقارنة المباشرة بين علاقة التلاميذ بالعالم وعلاقة يسوع به.
theological_decisions:
- issue: علاقة التلاميذ بالعالم بالمقارنة مع يسوع
  choice: «ليسوا من العالم، كما أني أنا لست من العالم»
  alternative: «لا ينتمون إلى العالم، كما أني لا أنتمي إلى العالم»
  rationale: تحافظ الصياغة المختارة على توتر ἐκ بين المنشأ والانتماء، وتنقل المقارنة كما وردت دون تحويلها إلى تقرير اجتماعي محض أو إضافة دعوى ميتافيزيقية لا يصرّح بها النص.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. أُبقي تكرار «أنا» في الشطر الأخير لإظهار توكيد الضمير في اليونانية، ووُضع مرجع الحاشية عند العبارة التي تشرحها.
