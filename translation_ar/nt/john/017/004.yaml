base_translation:
  language: en
  yaml_path: translation/nt/john/017/004.yaml
  text: I glorified you on the earth by completing the work that you have given me to do[a].
translation:
  language: ar
  text: أنا مجَّدتك على الأرض، إذ أتممتُ[a] العمل الذي أعطيتني لأعمله.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أنا مجَّدتك على الأرض، وقد أتممتُ العمل الذي أعطيتني لأعمله».'
    reason: بديل نحوي يعكس اسم الفاعل الماضي في اليونانية، ويُبقي احتمال العلاقة الظرفية أو المصاحبة بدل التصريح بعلاقة الوسيلة.
lexical_decisions:
- source_word: ἐδόξασα
  choice: مجَّدتك
  rationale: يحفظ المعنى اليوحناوي القوي للفعل δοξάζω، أي إظهار المجد وإعلانه، وهو أدق من «أكرمتك» في هذا السياق.
- source_word: ἐπὶ τῆς γῆς
  choice: على الأرض
  rationale: ترجمة مباشرة وطبيعية للعبارة المكانية، وتحفظ دلالة أداة الجر مع المضاف إليه.
- source_word: τελειώσας
  choice: إذ أتممتُ
  rationale: ينقل اسم الفاعل الماضي رابطًا إتمام العمل بتمجيد الآب، مع إبقاء العلاقة قابلة لأن تُفهم على أنها وسيلة أو ظرف ملازم.
- source_word: τὸ ἔργον
  choice: العمل
  rationale: المقابل الأوضح والأكثر ملاءمة في سياق رسالة يسوع التي أعطاه الآب إياها.
- source_word: δέδωκάς μοι
  choice: أعطيتني
  rationale: صيغة الماضي العربية طبيعية هنا، ويفهم من السياق أن العطية ما زالت ذات أثر؛ أما «قد أعطيتني» فثقيلة داخل الصلة.
- source_word: ἵνα ποιήσω
  choice: لأعمله
  rationale: ينقل غرض العطاء بإيجاز، ويعيد ضمير المفعول إلى «العمل» على نحو طبيعي في العربية.
- source_word: ἐγώ σε
  choice: أنا ... ـك
  rationale: إثبات «أنا» يحفظ توكيد الضمير اليوناني الصريح، والضمير المتصل ينقل المفعول به بصورة عربية سليمة.
theological_decisions:
- issue: علاقة τελειώσας بتمجيد الآب
  choice: صيغت «إذ أتممتُ» لربط تمجيد الآب بإتمام العمل، من غير حصر العلاقة في معنى الوسيلة وحده.
  alternative: «بإتمامي العمل» أو «بعد أن أتممتُ العمل»
  rationale: السياق النحوي يرجح أن إتمام العمل يبين كيف تحقق التمجيد أو يصف ظرفه الملازم. «إذ» تحفظ هذا الارتباط وبعض الغموض الحقيقي، بخلاف «بعد أن» الزمنية المحضة أو «بإتمامي» التي تحسم معنى الوسيلة.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة موقرة. استُعمل «مجَّدتك» للمصطلح اليوحناوي، و«إذ أتممتُ» لتحقيق توازن بين دقة التركيب وطبيعية العبارة، مع إثبات علامة الحاشية [a] في المتن.
