  text: καθὼς ἐμὲ ἀπέστειλας εἰς τὸν κόσμον, κἀγὼ ἀπέστειλα αὐτοὺς εἰς τὸν κόσμον·
base_translation:
  language: en
  yaml_path: translation/nt/john/017/018.yaml
  text: Just as you sent me into the world, I also sent them into the world.
translation:
  language: ar
  text: كما أرسلتني إلى العالم، أرسلتُهم أنا أيضًا إلى العالم.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς
  choice: كما
  rationale: تفيد المقارنة بين إرسال الآب ليسوع وإرسال يسوع لتلاميذه، و«كما» تؤدي هذا المعنى بوضوح وطبيعية.
- source_word: ἐμὲ
  choice: ـني
  rationale: ضمير المفعول به في «أرسلتني»، وصيغة عربية مباشرة تحفظ موقعه النحوي.
- source_word: ἀπέστειλας
  choice: أرسلت
  rationale: المعنى الأساسي للفعل هو الإرسال؛ وهذه الصياغة تحفظ لغة الرسالة في يوحنا من غير إضافة تفسيرية مثل «كلّفت».
- source_word: εἰς τὸν κόσμον
  choice: إلى العالم
  rationale: «إلى» هي الصياغة العربية الطبيعية لحركة الإرسال نحو العالم ومجاله، مع إبقاء دلالة «العالم» اليوحناوية مفتوحة.
- source_word: κἀγὼ
  choice: أنا أيضًا
  rationale: تحفظ القوة الإضافية في καὶ ἐγώ، ويُظهر الضمير المنفصل التوازي والتوكيد في العربية.
- source_word: ἀπέστειλα
  choice: أرسلتُ
  rationale: تكرار الجذر نفسه يحفظ التوازي المقصود بين إرسال الآب للابن وإرسال الابن للتلاميذ.
- source_word: αὐτοὺς
  choice: ـهم
  rationale: ضمير المفعول به يعود في السياق إلى التلاميذ، وتؤديه العربية بإيجاز طبيعي.
- source_word: κόσμον
  choice: العالم
  rationale: يحفظ المصطلح اليوحناوي المحوري وما فيه من توتر بين كون العالم مجال الرسالة وكونه كثيرًا ما يقاوم الله.
theological_decisions:
- issue: التوازي الرسالي بين إرسال الآب للابن وإرسال الابن للتلاميذ
  choice: الحفاظ على «أرسلت ... أرسلت» في الشطرين
  alternative: تنويع الفعل، مثل «أرسلت ... كلّفت»
  rationale: يبرز تكرار الفعل وجه المقارنة النصي من غير أن يوحي بأن منزلة التلاميذ أو طبيعة رسالتهم مطابقة لمنزلة الابن ورسالته الفريدة.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. قُدِّم الفعل في الشطر الأول وفق الأسلوب الطبيعي، وأُبرز «أنا أيضًا» في الشطر الثاني للحفاظ على القوة الإضافية والتوازي. لا حاجة إلى حواشٍ في هذه الآية.
