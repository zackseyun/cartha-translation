id: JHN.17.15
reference: John 17:15
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: οὐκ ἐρωτῶ ἵνα ἄρῃς αὐτοὺς ἐκ τοῦ κόσμου ἀλλ’ ἵνα τηρήσῃς αὐτοὺς ἐκ τοῦ πονηροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/015.yaml
  text: I am not asking that you take them out of the world[a], but that you keep them from the evil one.
translation:
  language: ar
  text: لا أطلب أن تأخذهم من العالم، بل أن تحفظهم من الشرير.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «من الشر». فالعبارة اليونانية τοῦ πονηροῦ يمكن أن تعني «الشرير» أو «الشر».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐρωτῶ
  choice: أطلب
  rationale: الفعل في المضارع المتكلم المفرد، وفي سياق صلاة يسوع يدل على الطلب المباشر؛ و«أطلب» لفظ عربي طبيعي يحافظ على المعنى من غير إضافة نبرة اصطلاحية.
- source_word: ἄρῃς
  choice: تأخذهم من
  rationale: الفعل αἴρω هنا بمعنى الأخذ أو الإزالة، وتركيب «تأخذهم من العالم» واضح وطبيعي ويقابل ἐκ τοῦ κόσμου.
- source_word: κόσμου
  choice: العالم
  rationale: «العالم» هو المقابل العربي الواسع والطبيعي لـκόσμος، ويحفظ مدى اللفظ في الاستعمال اليوحناوي من غير حصره في المجتمع أو النظام البشري.
- source_word: τηρήσῃς
  choice: تحفظهم
  rationale: τηρέω يفيد الحفظ والصون والحراسة؛ و«تحفظهم» يلائم سياق الحماية الإلهية من غير تحديد وسيلتها.
- source_word: ἐκ
  choice: من
  rationale: مع τηρήσῃς يدل الحرف على الوقاية أو الحفظ من شيء، و«من» أفصح وأوجز في العربية.
- source_word: τοῦ πονηροῦ
  choice: الشرير
  rationale: الصيغة اليونانية المعرّفة تحتمل المذكر «الشرير» والمحايد «الشر». رُجّح المعنى الشخصي بالنظر إلى الاستعمال اليوحناوي، مع إثبات البديل في الحاشية صونًا للغموض الحقيقي.
theological_decisions:
- issue: هل τοῦ πονηροῦ يدل على الشر بوجه عام أم على الشرير بصفته شخصًا؟
  choice: الشرير
  alternative: الشر
  rationale: الصيغة اليونانية ملتبسة من جهة الجنس، لكن الاستعمال اليوحناوي وسياق الحفظ الإلهي يرجّحان الإشارة الشخصية. ولئلا يُحسم التوتر الدلالي حسمًا زائدًا، أُثبت المعنى غير الشخصي في الحاشية.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة، بصياغة مباشرة تحافظ على تقابل «لا أطلب... بل...» وعلى الغموض الدلالي في العبارة الأخيرة بواسطة الحاشية.
