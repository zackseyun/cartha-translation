id: JHN.17.25
reference: John 17:25
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ⸀Πάτερ δίκαιε, καὶ ὁ κόσμος σε οὐκ ἔγνω, ἐγὼ δέ σε ἔγνων, καὶ οὗτοι ἔγνωσαν ὅτι σύ με ἀπέστειλας,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/025.yaml
  text: Righteous Father[a], though the world has not known you, I have known you[b], and these have known that you sent me.
translation:
  language: ar
  text: أيها الآب البارّ، والعالم لم يعرفك[a]، أمّا أنا فعرفتك، وهؤلاء عرفوا أنك أنت أرسلتني[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أن تُفهم العبارة بحسب السياق: «مع أن العالم لم يعرفك». أمّا اليونانية فتبدأ بحرف عطف يمكن نقله حرفيًا: «والعالم لم يعرفك».'
    reason: lexical_alternative
  - marker: b
    text: جاءت أفعال «عرف» في اليونانية بصيغة الأوريست، وهي تعرض الأفعال بوصفها وقائع مكتملة من غير أن تنفي بقاء أثر هذه المعرفة في الحاضر.
    reason: translation_note
lexical_decisions:
- source_word: Πάτερ δίκαιε
  choice: أيها الآب البارّ
  rationale: صيغة نداء مباشرة؛ و«البارّ» تحفظ الدلالة الأخلاقية واللاهوتية للصفة δίκαιος من غير حصرها في العدل القضائي.
- source_word: καὶ ὁ κόσμος σε οὐκ ἔγνω
  choice: والعالم لم يعرفك
  rationale: أُبقي حرف العطف «الواو» قريبًا من اليونانية، مع ترك احتمال فهمه عطفًا أو إقرارًا يحمل معنى المفارقة أو الاستدراك بحسب السياق.
- source_word: ὁ κόσμος
  choice: العالم
  rationale: يحفظ اللفظ اتساع الاستعمال اليوحناوي ولا يحصره تفسيرًا في «أهل العالم» أو «نظام العالم».
- source_word: ἐγὼ δέ σε ἔγνων
  choice: أمّا أنا فعرفتك
  rationale: تركيب «أمّا... فـ» يبرز المقابلة التي تؤديها δέ مع الضمير المؤكد ἐγώ، وهو طبيعي وفصيح في العربية.
- source_word: ἔγνω / ἔγνων / ἔγνωσαν
  choice: عرف / عرفت / عرفوا
  rationale: صيغ الماضي العربية تقابل صيغ الأوريست اليونانية بوضوح، مع بقاء معنى المعرفة الشخصية والعلاقية ممكنًا في السياق.
- source_word: οὗτοι
  choice: هؤلاء
  rationale: نقل مباشر لاسم الإشارة من غير إضافة «التلاميذ» تفسيرًا في صلب النص.
- source_word: σύ με ἀπέστειλας
  choice: أنت أرسلتني
  rationale: إظهار ضمير المخاطب مستقلًا يحفظ توكيد σύ في اليونانية، والماضي مناسب لفعل الإرسال.
theological_decisions:
- issue: صفة الآب في δίκαιε
  choice: الآب البارّ
  alternative: الآب العادل
  rationale: «البارّ» أوسع من الإنصاف القضائي وحده، ويحفظ ثقل المصطلح الأخلاقي والكتابي.
- issue: دلالة κόσμος في السياق اليوحناوي
  choice: العالم
  alternative: أهل العالم
  rationale: اختيار اللفظ الأوسع يحفظ التوتر الدلالي بين الخليقة والبشرية في ابتعادها عن الله، بدل حسم المقصود داخل الترجمة.
- issue: العلاقة الخطابية التي يؤديها καὶ الأول
  choice: والعالم لم يعرفك
  alternative: مع أن العالم لم يعرفك
  rationale: النص اليوناني يستعمل καὶ، وقد يُفهم في السياق على وجه يحمل معنى المفارقة أو التنازل. إبقاء الواو في المتن يحفظ هذا القدر من الغموض، وتُذكر القراءة التنازلية في الحاشية.
- issue: زمن أفعال المعرفة الأوريستية
  choice: 'الماضي العربي: عرفتك، وعرفوا'
  alternative: صياغة تفيد الاستمرار أو تمام الفعل إلى الحاضر
  rationale: الماضي هو المقابل العربي المباشر والطبيعي، ولا يمنع أن تكون للمعرفة آثار حاضرة في سياق الصلاة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة دعائية مهيبة. استُعمل «أيها» للنداء، و«أمّا أنا فـ» لإظهار المقابلة الطبيعية، مع تجنب الألفاظ الطائفية أو الشروح التفسيرية داخل المتن.
