  yaml_path: translation/nt/john/017/021.yaml
  text: that they may all be one[a], just as you, Father, are in me and I am in you; that they also may be in us[c][b], so that the world may believe that you sent me.
translation:
  language: ar
  text: لِيَكُونُوا جَمِيعًا وَاحِدًا[a]، كَمَا أَنَّكَ أَنْتَ، أَيُّهَا الآبُ، فِيَّ وَأَنَا فِيكَ، وَلِيَكُونُوا هُمْ أَيْضًا فِينَا[b]، لِكَيْ يُؤْمِنَ الْعَالَمُ[c] أَنَّكَ أَرْسَلْتَنِي.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ليكونوا جميعًا متحدين». والأصل اليوناني أقرب حرفيًا إلى «ليكونوا جميعًا واحدًا»، وهي عبارة تحفظ معنى الوحدة الأوسع من غير أن تحصره في جانب بعينه.'
    reason: lexical_alternative
  - marker: b
    text: يتكرر حرف «في» في العبارات «فيَّ» و«فيك» و«فينا». وهذا يعكس لغة يوحنا عن السكن المتبادل والمشاركة، وهي أقوى من مجرد المصاحبة.
    reason: cross_reference
  - marker: c
    text: 'يمكن أن تُفهم أيضًا: «لكي يأتي العالم إلى الإيمان». والفعل اليوناني لا يحدد صراحةً أَيَكُونُ التركيز على بدء الإيمان أم استمراره.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: لِيَكُونُوا / لِكَيْ يُؤْمِنَ
  rationale: تحافظ لام التعليل و«لكي» على تتابع عبارات الغاية أو النتيجة الثلاث، مع صياغة عربية طبيعية.
- source_word: πάντες ἓν
  choice: جميعًا واحدًا
  rationale: يحفظ «واحدًا» صورة المفرد المحايد في اليونانية ولا يحصر الوحدة في نوع محدد، بينما ينقل «جميعًا» شمول πάντες.
- source_word: καθὼς
  choice: كما أنَّ
  rationale: تُظهر المقارنة بين وحدة المؤمنين وعلاقة الآب بالابن بوضوح في العربية.
- source_word: πάτερ
  choice: يا أبي
  rationale: يحفظ النداء المباشر والعلاقة الشخصية؛ والإضافة إلى المتكلم طبيعية في العربية عند مناداة الأب.
- source_word: ἐν ἐμοὶ κἀγὼ ἐν σοί
  choice: فيَّ وأنا فيك
  rationale: يُحافظ على تكرار «في» وعلى لغة يوحنا في السكن المتبادل، بدل إضعافها إلى مجرد المصاحبة.
- source_word: καὶ αὐτοὶ ἐν ἡμῖν
  choice: هم أيضًا فينا
  rationale: يحفظ القوة الإضافية لـ καί، ويُبقي لغة المشاركة أو السكن دون شرح تفسيري زائد.
- source_word: ὁ κόσμος
  choice: العالم
  rationale: هو المقابل المألوف الذي يصون الكثافة الدلالية لمصطلح κόσμος في يوحنا.
- source_word: πιστεύῃ
  choice: يؤمن
  rationale: ينقل المضارع المنصوب في عبارة الغاية دون أن يفرض معنى ابتداء الإيمان أو استمراره.
- source_word: ἀπέστειλας
  choice: أرسلتني
  rationale: ينقل الماضي اليوناني بصيغة عربية مباشرة وطبيعية، مع إبقاء المتكلم مفعولًا به كما في الأصل.
theological_decisions:
- issue: طبيعة وحدة المؤمنين قياسًا إلى علاقة الآب والابن
  choice: «ليكونوا جميعًا واحدًا» مع إبقاء «فينا»
  alternative: «ليكونوا جميعًا متحدين» أو «واحدًا في الهدف»
  rationale: لا يحدد النص الوحدة بأنها تنظيمية أو أخلاقية أو ميتافيزيقية؛ لذلك يحفظ «واحدًا» عمق العبارة وتوترها اللاهوتي دون تضييقها.
- issue: لغة السكن أو المشاركة عند يوحنا
  choice: «فيَّ... فيك... فينا»
  alternative: «معي... معك... معنا» أو «متحدين بنا»
  rationale: يكرر الأصل حرف ἐν، والترجمة الحرفية نسبيًا تصون دلالة السكن المتبادل والمشاركة الأقوى من مجرد المصاحبة.
- issue: دلالة πιστεύῃ الزمنية أو الحدثية
  choice: «يؤمن»
  alternative: «يأتي إلى الإيمان» أو «يستمر في الإيمان»
  rationale: الصيغة اليونانية لا تحسم وحدها أ意كون التركيز على بدء الإيمان أم استمراره، ولذلك تُترك الدلالة مفتوحة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم الضبط الجزئي عند مواضع قد يلتبس نطقها، وحُفظ توازي العبارات الثلاث وبنية المقارنة. وُضعت علامة الحاشية [c] بعد «العالم» لتتصل بعبارة «يؤمن العالم» كلها دون قطع الفعل عن غايته.
