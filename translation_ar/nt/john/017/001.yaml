source:
  edition: SBLGNT
  text: Ταῦτα ⸀ἐλάλησεν Ἰησοῦς, καὶ ⸂ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ εἰς τὸν οὐρανὸν εἶπεν⸃· Πάτερ, ἐλήλυθεν ἡ ὥρα· δόξασόν σου τὸν υἱόν, ⸀ἵνα ὁ ⸀υἱὸς δοξάσῃ σέ,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/001.yaml
  text: 'Jesus said these things, and lifting up his eyes to heaven, he said: “Father, the hour has come. Glorify your Son, so that the Son may glorify you,”'
translation:
  language: ar
  text: 'قال يسوع هذه الأمور، ورفع عينيه نحو السماء وقال: «أيها الآب، قد جاءت الساعة. مجِّد ابنك، لكي يمجِّدك الابن،»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ταῦτα
  choice: هذا
  rationale: اسم الإشارة المحايد الجمع يعود إلى الكلام السابق كله؛ والمفرد «هذا» في العربية طبيعي عند الإشارة إلى مضمون كلام متكامل، من غير إضافة اسم غير موجود في اليونانية.
- source_word: ἐλάλησεν
  choice: قال
  rationale: مع وجود مضمون سابق ثم فعل قول يقدّم الصلاة، تؤدي «قال» المعنى بوضوح وطبيعية أكثر من «تكلّم»، من غير تغيير للمحتوى.
- source_word: ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: رفع عينيه
  rationale: يحفظ الفعل الجسدي وصيغة التتابع التي يدل عليها اسم الفاعل الأوريستي، بصياغة عربية موجزة وطبيعية.
- source_word: εἰς τὸν οὐρανόν
  choice: نحو السماء
  rationale: تنقل «نحو» دلالة الاتجاه المقصودة بحرف الجر εἰς في هذا السياق.
- source_word: Πάτερ
  choice: أيها الآب
  rationale: نداء عربي فصيح يحفظ لفظ «الآب» من غير إضافة ضمير ملكية غير مصرح به في النص اليوناني.
- source_word: ἐλήλυθεν ἡ ὥρα
  choice: قد جاءت الساعة
  rationale: تحفظ «الساعة» بوصفها لفظًا يوحناويًا محوريًا، وتعبّر «قد جاءت» عن تمام وصول الموعد الحاسم في صيغة يونانية تامة.
- source_word: δόξασόν
  choice: مجِّد
  rationale: «مجِّد» يقابل δοξάζω ويحفظ أبعاده المتعلقة بإظهار المجد والإكرام، ولا يختزله في معنى «أكرم» وحده.
- source_word: σου τὸν υἱόν
  choice: ابنك
  rationale: تنقل الإضافة اليونانية بصيغة الملكية العربية الطبيعية.
- source_word: ἵνα
  choice: لكي
  rationale: تبيّن بوضوح علاقة الغاية أو النتيجة المقصودة، من غير حسم ما قد يتداخل بينهما في السياق.
- source_word: ὁ υἱὸς
  choice: الابن
  rationale: تحفظ أداة التعريف والتحول من «ابنك» إلى اللقب المعرّف «الابن».
- source_word: δοξάσῃ σέ
  choice: يمجِّدك
  rationale: تحفظ تكرار جذر التمجيد والتناظر المقصود بين تمجيد الابن وتمجيد الآب.
theological_decisions:
- issue: التمجيد المتبادل بين الآب والابن
  choice: «مجِّد ابنك، لكي يمجِّدك الابن»
  alternative: «أكرم ابنك لكي يعيد إليك المجد»
  rationale: الصياغة المختارة تحفظ تكرار الفعل نفسه والتناظر اللاهوتي في اليونانية، ولا تضيف شرحًا لطبيعة هذا التمجيد أو وسيلته.
- issue: دلالة «الابن» كلقب
  choice: الإبقاء على «الابن» معرّفًا
  alternative: «ابنك» في الموضعين
  rationale: العربية لا تستخدم الحروف الكبيرة لتمييز الألقاب، لذلك يحفظ التعريفُ التحولَ النصي من «ابنك» إلى «الابن» بقدر ما تسمح به العربية.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدم «أيها الآب» لتجنب إضافة «أبي» إلى النداء، وحُفظت «الساعة» و«مجِّد» و«الابن» لما لها من ترابط لفظي وموضوعي في إنجيل يوحنا. تنتهي العبارة بفاصلة لأن الجملة والصلاة تستمران في العدد التالي.
