  text: I do not ask concerning these only[a], but also concerning those who believe in me through their word[b],
translation:
  language: ar
  text: ولا أطلب بخصوص هؤلاء فقط، بل أيضًا بخصوص الذين يؤمنون بي بواسطة كلامهم،
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐρωτῶ
  choice: أطلب
  rationale: يفيد الفعل هنا طلب يسوع من الآب. و«أطلب» واضحة وتحافظ على المعنى الأساسي من غير إضافة إيحاء تعبدي صريح كما قد تفعل «أصلّي».
- source_word: περὶ τούτων
  choice: من أجل هؤلاء
  rationale: تفيد περί مع المضاف إليه موضوع الطلب أو من يقع الطلب لأجلهم. وفي سياق الصلاة تبدو «من أجل هؤلاء» عربية طبيعية، مع إبقاء هوية المشار إليهم مفهومة من السياق.
- source_word: μόνον
  choice: وحدهم
  rationale: تنقل معنى القصر، وتلائم في العربية الإشارة إلى جماعة الأشخاص في «هؤلاء».
- source_word: ἀλλὰ καὶ
  choice: بل أيضًا
  rationale: تحفظ الانتقال من نفي القصر إلى إضافة فئة أخرى.
- source_word: τῶν πιστευόντων
  choice: الذين يؤمنون
  rationale: تنقل اسم الفاعل الحاضر بصيغة موصولية ذات قوة فعلية، من غير تحويله إلى تسمية جامدة مثل «المؤمنين».
- source_word: διὰ τοῦ λόγου αὐτῶν
  choice: بواسطة كلامهم
  rationale: «بواسطة» تبين الوسيلة، و«كلامهم» تحافظ على λόγος وعلى إسناده إلى التلاميذ، من غير حصره تفسيرياً في «رسالتهم».
- source_word: εἰς ἐμέ
  choice: بي
  rationale: هذه الصياغة هي المقابل العربي الطبيعي لبنية πιστεύω εἰς حين يكون موضوع الإيمان شخصًا، وتحفظ تعلق الإيمان بالمسيح.
- source_word: Οὐ ... μόνον
  choice: ولا أطلب ... وحدهم
  rationale: تحافظ على النفي والقصر في تركيب عربي واضح، وتصل الآية بسياق الصلاة السابق بواسطة الواو.
theological_decisions:
- issue: نطاق طلب يسوع بعد التلاميذ الحاضرين
  choice: يشمل النص آخرين يؤمنون بالمسيح بواسطة كلام التلاميذ، من غير التصريح بزمن إيمانهم.
  alternative: أن يُفهم النص حصراً على جماعة أضيق كانت قد بدأت تؤمن بواسطة التلاميذ.
  rationale: صيغة «الذين يؤمنون» تقابل اسم الفاعل الحاضر ولا تضيف «سوف»، وبذلك تتيح دلالة المؤمنين اللاحقين من غير أن تحسم في الترجمة ما تركه اليوناني ضمنياً.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة. اختيرت «أطلب» بدل «أصلّي» لتجنب زيادة تفسيرية، و«كلامهم» بدل «رسالتهم» للمحافظة على السعة المعجمية والجرس اليوحناوي. لا حاجة إلى حاشية لأن البدائل لا تمثل غموضاً نصياً ضرورياً، كما أن حاشيتي الطبقة الإنجليزية تبدوان متبادلتين على نحو لا يوافق موضعي علامتيهما.
