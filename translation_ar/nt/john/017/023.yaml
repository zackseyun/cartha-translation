  yaml_path: translation/nt/john/017/023.yaml
  text: I in them and you in me[a], so that they may be perfected into one, so that the world may know that you sent me and loved them just as you loved me.
translation:
  language: ar
  text: أنا فيهم، وأنت فيَّ، لكي يُكمَّلوا فيصيروا واحدًا[a]، لكي يعرف العالم أنك أرسلتني، وأنك أحببتهم كما أحببتني.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لكي يُجعلوا كاملين في واحد»، أو: «لكي يُبلَغ بهم إلى التمام فيصيروا واحدًا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ ἐν αὐτοῖς καὶ σὺ ἐν ἐμοί
  choice: أنا فيهم، وأنت فيَّ
  rationale: يحافظ على حرف الجر «في» وعلى لغة السكن المتبادل البارزة في إنجيل يوحنا، من غير تحويلها إلى «بينهم».
- source_word: τετελειωμένοι
  choice: يُكمَّلوا
  rationale: ينقل صيغة المبني للمجهول ومعنى البلوغ إلى التمام، مع تجنب حصر العبارة في الكمال الأخلاقي المطلق.
- source_word: εἰς ἕν
  choice: فيصيروا واحدًا
  rationale: يُظهر اتجاه الفعل ونتيجته نحو الوحدة، وهو معنى εἰς مع النصب، بصياغة عربية طبيعية.
- source_word: γινώσκῃ
  choice: يعرف
  rationale: ترجمة مباشرة وطبيعية لصيغة المضارع المنصوب بعد ἵνα ضمن جملة الغاية.
- source_word: ὁ κόσμος
  choice: العالم
  rationale: يحافظ على التعبير اليوحناوي المألوف من غير توسيع تفسيري إلى «أهل العالم» أو «نظام العالم».
- source_word: ἀπέστειλας
  choice: أرسلتني
  rationale: ينقل الفعل ببساطة واتساق، ويحفظ موضوع إرسال الآب للابن.
- source_word: ἠγάπησας
  choice: أحببت
  rationale: يحفظ التكرار المعجمي للفعل في شطري العبارة.
- source_word: καθὼς
  choice: كما
  rationale: يعبّر عن المقارنة المباشرة بلا تلطيف أو شرح زائد.
theological_decisions:
- issue: قوة المقارنة في «أحببتهم كما أحببتني»
  choice: 'إبقاء المقارنة مباشرة: «كما أحببتني»'
  alternative: تلطيفها إلى «بمحبة شبيهة بمحبتك لي» أو «بنفس نوع المحبة»
  rationale: تفيد καθὼς مقارنة حقيقية، وينبغي حفظ ثقلها اللاهوتي من غير تضييق مداها أو توسيعه تفسيريًا.
- issue: دلالة τετελειωμένοι في السياق
  choice: التعبير عن الإكمال المؤدي إلى أن يصيروا واحدًا
  alternative: «يصيروا كاملين في واحد» أو صياغة توحي بالكمال الأخلاقي المطلق
  rationale: الصيغة تدل على حالة ناتجة من الإتمام، والسياق يربط هذا الإتمام بالوحدة؛ لذا تحافظ الصياغة على المعنيين من غير حسم زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدمت «فيصيروا» لإظهار نتيجة εἰς ἕν بصورة طبيعية، مع إبقاء لغة «فيهم/فيَّ» والمقارنة «كما أحببتني» على مباشرتها.
