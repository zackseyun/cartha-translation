lexical_decisions:
- source_word: ἐρωτῶ
  choice: أسأل
  rationale: يحفظ المعنى الأساسي للفعل، أي الطلب والسؤال، من غير إدخال لفظ ديني أصرح مما يقتضيه اليوناني، مع أن السياق سياق صلاة إلى الآب.
- source_word: περὶ αὐτῶν
  choice: من أجلهم
  rationale: تفيد περί مع المضاف إليه هنا موضوع الطلب، وفي سياق الصلاة تحمل طبيعيًا معنى التوسل لأجل أشخاص؛ وهذه الصياغة عربية واضحة وتحفظ التوازي المتكرر في الآية.
- source_word: κόσμου
  choice: العالم
  rationale: يحفظ المصطلح اليوحناوي وتوتره الدلالي من غير تضييقه إلى البشرية عمومًا أو إلى نظام عالمي معادٍ لله.
- source_word: ὧν δέδωκάς μοι
  choice: الذين أعطيتني إياهم
  rationale: صياغة عربية طبيعية للمجموعة الشخصية المقصودة، وتحفظ كونهم معطَين للابن من الآب.
- source_word: δέδωκάς
  choice: أعطيتني
  rationale: الماضي العربي هو الأنسب هنا، ويُفهم استمرار أثر العطاء من السياق؛ أما محاولة تمثيل التام اليوناني تركيبًا فقد تنتج عبارة غير طبيعية.
- source_word: ὅτι
  choice: لأن
  rationale: 'تُظهر القوة السببية الطبيعية: يسأل من أجلهم لأنهم للآب.'
- source_word: σοί εἰσιν
  choice: هم لك
  rationale: ترجمة موجزة مباشرة تحفظ معنى الاختصاص والانتماء من غير شرح زائد.
- source_word: ἐγὼ
  choice: أنا
  rationale: إثبات الضمير يحفظ توكيد الفاعل والتقابل في بنية القول.
- source_word: ἀλλὰ
  choice: بل
  rationale: 'تلائم تركيب النفي والاستدراك: «لا... بل...» وتحفظ قوة المقابلة.'
theological_decisions:
- issue: هل يُترجم ἐρωτῶ بلفظ صلاة صريح؟
  choice: أسأل
  alternative: أصلّي من أجلهم
  rationale: السياق صلاة، لكن الفعل نفسه يعني أساسًا السؤال أو الطلب؛ لذلك تحفظ «أسأل» الشفافية المعجمية ولا تضيف اصطلاحًا دينيًا أصرح من الأصل.
- issue: دلالة περί مع ἐρωτῶ
  choice: من أجلهم
  alternative: عنهم / بشأنهم
  rationale: يتيح الأصل معنى «بشأنهم» ومعنى «من أجلهم»، والسياق الشفاعي يرجّح العربية الطبيعية «من أجلهم»، مع إثبات البديل في الحاشية حفظًا للغموض الدلالي.
- issue: نطاق «العالم» في المقابلة
  choice: العالم من غير تضييق تفسيري
  alternative: البشرية عمومًا / العالم غير المؤمن
  rationale: لـκόσμος ظلال دلالية متعددة في يوحنا، فلا تحسم الترجمة المقصود لصالح قراءة عقدية بعينها.
- issue: طبيعة الانتماء في σοί εἰσιν
  choice: هم لك
  alternative: هم ملكك / ينتمون إليك
  rationale: «هم لك» تحفظ الصياغة العلائقية والاختصاص من غير تحويلها إلى تعبير ملكية أشد أو تفسيرها تفصيلًا.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُعمل «من أجل» لتأدية معنى التوسل في السياق، مع إبقاء البديل الأقرب إلى البنية اليونانية في الحاشية. وُضع كل مؤشر حاشية في المتن، وتجنبت الصياغة حسم معنى «العالم» أو طبيعة الانتماء حسمًا مذهبيًا.
