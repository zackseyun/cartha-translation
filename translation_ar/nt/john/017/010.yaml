  text: καὶ τὰ ἐμὰ πάντα σά ἐστιν καὶ τὰ σὰ ἐμά, καὶ δεδόξασμαι ἐν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/010.yaml
  text: And all that is mine is yours[a], and what is yours is mine, and I have been glorified in them.
translation:
  language: ar
  text: وكلُّ ما لي هو لك، وما لك هو لي، وقد مُجِّدتُ فيهم.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو «بواسطتهم» أو «بينهم». يقول اليوناني حرفيًا: «فيهم»، وقد يدل التعبير في السياق على المكان أو الوسيلة أو ظهور المجد.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἐμὰ πάντα
  choice: كلُّ ما لي
  rationale: تعبير عربي طبيعي يحفظ شمول العبارة اليونانية من غير أن يحصرها في الأشياء المادية.
- source_word: σά
  choice: لك
  rationale: ينقل دلالة الملكية بإيجاز ويناسب تركيب الجملة الاسمية العربية.
- source_word: τὰ σὰ ἐμά
  choice: ما لك هو لي
  rationale: يحافظ على التوازي والتبادل الصريح في الملكية مع صياغة عربية سليمة.
- source_word: δεδόξασμαι
  choice: قد مُجِّدتُ
  rationale: يحفظ المبني للمجهول، وتساعد «قد» على نقل دلالة الفعل التام ذي الأثر القائم.
- source_word: ἐν αὐτοῖς
  choice: فيهم
  rationale: هو المقابل المباشر للفظ اليوناني، ويُبقي مفتوحًا احتمال المكان أو الوسيلة أو ظهور المجد بحسب السياق.
theological_decisions:
- issue: الملكية المتبادلة بين الابن والآب
  choice: 'إبقاء التصريح المتبادل كما هو: «كل ما لي هو لك، وما لك هو لي».'
  alternative: تخفيف العبارة إلى مجرد تعاون وظيفي.
  rationale: النص اليوناني يقرر الملكية المتبادلة بوضوح؛ فلا ينبغي إضعافها أو إضافة مصطلحات عقائدية لاحقة غير واردة في الآية.
- issue: مرجع «فيهم» ودلالة حرف الجر
  choice: إبقاء الصياغة المباشرة «فيهم» في المتن.
  alternative: «بواسطتهم» أو «بينهم».
  rationale: يسمح ἐν بهذه الظلال الدلالية في السياق، ولا يوجب النص حسمها؛ لذلك تُحفظ الصياغة الأقرب ويُشار إلى البدائل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة، واضحة وموقرة. استُخدم «مُجِّدتُ» بدل صياغة تفسيرية، وحُفظ التوازي الموجز في عبارتي الملكية.
