  source_fidelity: 'المتن يحافظ بدقة على البنية الأساسية للنص اليوناني: الاستمرار في «كنت أحفظهم»، وتمييز «حرستهم»، ومرجع «الذي أعطيتني» إلى «اسمك»، والاستثناء «ابن الهلاك»، وغرض إتمام الكتاب. إلا أن «فلم» تُدخل علاقة استنتاجية ليست ظاهرة في العطف اليوناني، و«لكي يتمّ الكتاب» أقل وضوحًا في العربية وقد تُفهم عن اكتمال الكتاب نفسه لا تحقق ما فيه.'
