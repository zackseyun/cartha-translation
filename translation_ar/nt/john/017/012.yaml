  text: ὅτε ἤμην μετ’ ⸀αὐτῶν ἐγὼ ἐτήρουν αὐτοὺς ἐν τῷ ὀνόματί σου ⸀ᾧ δέδωκάς μοι, ⸀καὶ ἐφύλαξα, καὶ οὐδεὶς ἐξ αὐτῶν ἀπώλετο εἰ μὴ ὁ υἱὸς τῆς ἀπωλείας, ἵνα ἡ γραφὴ πληρωθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/012.yaml
  text: While I was with them[a], I kept them in your name, which you have given me, and I guarded them, and not one of them perished except the son of destruction[b], so that the Scripture might be fulfilled.
translation:
  language: ar
  text: حين كنت معهم، كنت أحفظهم في اسمك الذي أعطيتني، وحرستهم، ولم يهلك منهم أحد[a] إلا ابن الهلاك[b]، لكي يتمّ ما في الكتاب.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ولم يَضِع منهم أحد».'
    reason: lexical_alternative
  - marker: b
    text: «ابن الهلاك» تعبير على الطريقة العبرية؛ ويمكن أن يُفهم أيضًا بمعنى «الذي مآله إلى الهلاك».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε ἤμην μετ’ αὐτῶν
  choice: حين كنت معهم
  rationale: ينقل الظرف الزمني وحالة وجود يسوع المستمرة مع التلاميذ بعبارة عربية طبيعية.
- source_word: ἐγὼ ἐτήρουν αὐτοὺς
  choice: كنت أحفظهم
  rationale: يحافظ على دلالة الفعل الناقص في الاستمرار، ويعكس توكيد الضمير اليوناني من خلال السياق من غير تثقيل العبارة العربية.
- source_word: ἐν τῷ ὀνόματί σου
  choice: في اسمك
  rationale: صياغة قريبة من الأصل تحفظ الغنى الدلالي للاسم بوصفه مرتبطًا بشخص الله وسلطانه من غير تفسير زائد.
- source_word: ᾧ δέδωκάς μοι
  choice: الذي أعطيتني
  rationale: اسم الموصول المفرد يعود بحسب نحو النص إلى «اسمك»، ويحافظ التعبير على دلالة العطاء من غير إقحام مفعول غير مصرّح به.
- source_word: καὶ ἐφύλαξα
  choice: وقد حرستهم
  rationale: يميز φυλάσσω عن τηρέω، وينقل معنى الحراسة والحماية مع إظهار الانتقال إلى الفعل التام.
- source_word: οὐδεὶς ἐξ αὐτῶν ἀπώλετο
  choice: فلم يهلك منهم أحد
  rationale: يعبر «يهلك» عن المعنى الجاد للفعل ἀπόλλυμι، مع إبقاء بديل «يَضِع» في الحاشية لصِلته بالاستعمال اليوحناوي.
- source_word: ὁ υἱὸς τῆς ἀπωλείας
  choice: ابن الهلاك
  rationale: يحافظ على التركيب السامي الموجز ولا يحوله في المتن إلى تقرير صريح عن المصير أو التعيين السابق.
- source_word: ἵνα ἡ γραφὴ πληρωθῇ
  choice: لكي يتمّ الكتاب
  rationale: يحفظ دلالة الغاية أو النتيجة في ἵνα، ويترجم γραφή المفردة المعرفة بصياغة كتابية عربية مألوفة.
theological_decisions:
- issue: مرجع ᾧ δέδωκάς μοι
  choice: 'يعود اسم الموصول إلى «اسمك»: «اسمك الذي أعطيتني».'
  alternative: 'إرجاع العبارة إلى التلاميذ: «الذين أعطيتني».'
  rationale: ضمير الوصل في النص اليوناني محايد مفرد، فيوافق ὀνόματι، لا αὐτούς المذكر الجمع؛ لذلك تتبع الترجمة نحو النص المعطى ولا توائمه مع عبارات يوحناوية أخرى.
- issue: معنى ὁ υἱὸς τῆς ἀπωλείας
  choice: «ابن الهلاك»، مع إبقاء التعبير السامي في المتن.
  alternative: «المصير إلى الهلاك» أو «الذي كُتب عليه الهلاك».
  rationale: الصياغة الحرفية المفهومة تحفظ التوتر اللاهوتي، ولا توسع العبارة إلى تقرير مذهبي عن سبق التعيين.
translation_notes:
  register: العربية فصحى حديثة واضحة ووقورة. استُخدم «أحفظ» ثم «حرست» لصون التنويع بين الفعلين اليونانيين، ووُضعت علامتا الحاشية في المتن عند موضعي البدائل.
