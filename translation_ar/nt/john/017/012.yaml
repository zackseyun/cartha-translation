  terminology: «في اسمك»، و«ابن الهلاك»، و«يهلك» اختيارات مناسبة وتحافظ على المصطلحات والتوتر الدلالي. تُصان السمة السامية في «ابن الهلاك» من غير تحميلها تفسيرًا مذهبيًا.
