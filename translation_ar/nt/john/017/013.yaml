base_translation:
  language: en
  yaml_path: translation/nt/john/017/013.yaml
  text: But now I am coming to you[b][a], and I am speaking these things in the world so that they may have my joy fulfilled in themselves.
translation:
  language: ar
  text: أَمَّا الآنَ فَإِنِّي آتِي إِلَيْكَ، وَأَتَكَلَّمُ بِهَذِهِ الأُمُورِ وَأَنَا فِي الْعَالَمِ، لِكَيْ يَكُونَ فَرَحِي فِي دَاخِلِهِمْ[b] كَامِلًا[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مُكْتَمِلًا» أو «قَدْ بَلَغَ مِلْأَهُ».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «فِيمَا بَيْنَهُمْ»؛ وحرفيًّا: «فِي أَنْفُسِهِمْ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν δὲ
  choice: أَمَّا الآنَ
  rationale: تنقل الانتقال الخطابي والمقابلة الخفيفة مع الكلام السابق من غير مبالغة في معنى الاستدراك.
- source_word: πρὸς σὲ ἔρχομαι
  choice: فَإِنِّي آتِي إِلَيْكَ
  rationale: تحافظ على صورة التوجّه نحو الآب، وصيغة المضارع العربية تلائم الفعل الوشيك الذي يتحدث عنه يسوع.
- source_word: ταῦτα λαλῶ
  choice: وَأَتَكَلَّمُ بِهَذَا
  rationale: تعبير عربي طبيعي يحفظ دلالة التلفظ بهذه الأمور في سياق الصلاة الجارية.
- source_word: ἐν τῷ κόσμῳ
  choice: وَأَنَا فِي الْعَالَمِ
  rationale: إضافة «وأنا» توضح بالعربية أن العبارة ظرفية متعلقة بتكلم يسوع، مع إبقاء لفظ «العالم» المحوري في إنجيل يوحنا.
- source_word: ἵνα ἔχωσιν
  choice: لِكَيْ يَكُونَ
  rationale: تنقل غاية الكلام بوضوح؛ وصيغة «يكون فرحي في داخلهم» تؤدي معنى امتلاكهم هذا الفرح بصورة طبيعية في العربية.
- source_word: τὴν χαρὰν τὴν ἐμὴν
  choice: فَرَحِي
  rationale: تحفظ الإضافة المؤكدة في اليونانية وتدل طبيعيًا على الفرح الذي يخص يسوع.
- source_word: πεπληρωμένην
  choice: كَامِلًا
  rationale: تعبر عن بلوغ الفرح ملأه وعن الحالة الناتجة التي تفيدها صيغة اسم المفعول التام، من غير صياغة عربية ثقيلة.
- source_word: ἐν ἑαυτοῖς
  choice: فِي دَاخِلِهِمْ
  rationale: تؤدي القراءة الأرجح، أي حضور الفرح واكتماله في باطن التلاميذ، مع إثبات البديل الجمعي الممكن في الحاشية.
theological_decisions:
- issue: طبيعة «فرحي»
  choice: الفرح الذي يخص يسوع ويصير حاضرًا كاملًا في تلاميذه.
  alternative: الفرح المتعلق بيسوع، لا فرح يسوع نفسه.
  rationale: الضمير الملكي ἐμὴν يدل على الأرجح على فرح يسوع نفسه؛ وتحفظ الصياغة هذا المعنى من غير إضافة تفسير عقائدي عن كيفية اشتراك التلاميذ فيه.
- issue: موضع اكتمال الفرح
  choice: في داخل التلاميذ.
  alternative: فيما بينهم.
  rationale: يمكن للتركيب الجمعي ἐν ἑαυτοῖς أن يُفهم فهمًا باطنيًا أو تبادليًا؛ اختير المعنى الباطني لأنه أنسب في السياق، وأُبقي البديل في الحاشية.
translation_notes:
  register: 'عربية فصحى حديثة واضحة ذات نبرة موقرة. روعي الإيقاع الطبيعي، فصيغت العبارة الظرفية «وأنا في العالم» لتجنب الالتباس، وحُفظت ألفاظ يوحنا الأساسية: الآتي، العالم، الفرح، والكمال.'
