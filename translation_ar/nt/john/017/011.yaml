  text: καὶ οὐκέτι εἰμὶ ἐν τῷ κόσμῳ, καὶ ⸀αὐτοὶ ἐν τῷ κόσμῳ εἰσίν, κἀγὼ πρὸς σὲ ἔρχομαι. πάτερ ἅγιε, τήρησον αὐτοὺς ἐν τῷ ὀνόματί σου ᾧ δέδωκάς μοι, ἵνα ὦσιν ἓν ⸀καθὼς ἡμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/011.yaml
  text: And I am no longer in the world[a], but they are in the world, and I am coming to you. Holy Father, keep them in your name, which you have given to me, so that they may be one[b], just as we are.
translation:
  language: ar
  text: ولم أعد في العالم، أما هم ففي العالم، وأنا آتٍ إليك. أيها الآب القدوس، احفظهم في اسمك[a] الذي أعطيتني إياه[b]، ليكونوا واحدًا كما نحن.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمتها: «احفظهم باسمك» أو «احمهم بواسطة اسمك». فالتركيب اليوناني قد يدل على المجال أو الوسيلة أو السلطان.'
    reason: lexical_alternative
  - marker: b
    text: 'تقرأ بعض المخطوطات العبارة بمعنى: «احفظهم في اسمك الذي أعطيتني إياه»، بينما تُفهم مخطوطات أخرى بمعنى: «احفظ في اسمك الذين أعطيتني إياهم». تتبع هذه الترجمة نص SBLGNT، حيث يعود «الذي» على «الاسم».'
    reason: textual_variant
lexical_decisions:
- source_word: οὐκέτι
  choice: لستُ بعدُ
  rationale: تؤدي معنى انقطاع الحال من منظور المتكلم الحاضر، بصياغة عربية فصيحة وطبيعية.
- source_word: κόσμος
  choice: العالم
  rationale: تحافظ على اللفظ اليوحناوي المألوف للدلالة هنا على المجال البشري الأرضي الذي يبقى فيه التلاميذ.
- source_word: κἀγὼ πρὸς σὲ ἔρχομαι
  choice: وأنا آتٍ إليك
  rationale: تنقل المضارع ذي الدلالة الاستقبالية القريبة وتحافظ على اتجاه الفعل اليوناني نحو المخاطَب.
- source_word: πάτερ ἅγιε
  choice: أيها الآب القدوس
  rationale: صيغة نداء عربية طبيعية تحفظ معًا معنى الأبوة والقداسة.
- source_word: τήρησον
  choice: احفظهم
  rationale: الفعل العربي «حفظ» واسع الدلالة، فيشمل الحراسة والصون والثبات من غير قصر المعنى على الحماية الجسدية.
- source_word: ἐν τῷ ὀνόματί σου
  choice: في اسمك
  rationale: تحافظ «في» على احتمال دلالة المجال أو الوسيلة أو السلطان، ولا تحسم العبارة بتفسير واحد.
- source_word: ᾧ δέδωκάς μοι
  choice: الذي أعطيتني إياه
  rationale: الضمير الموصول في نص SBLGNT يطابق «الاسم»، وإضافة «إياه» توضح في العربية أن الاسم هو الشيء المُعطى من غير إعادة صياغة المعنى.
- source_word: ἵνα ὦσιν ἓν
  choice: ليكونوا واحدًا
  rationale: تنقل لام التعليل غرض العبارة، ويحفظ «واحدًا» صورة المفرد المحايد الدالة على الوحدة.
- source_word: καθὼς ἡμεῖς
  choice: كما نحن
  rationale: تحافظ على المقارنة وعلى إيجاز الأصل، حيث يُفهم خبر الضمير من العبارة السابقة من غير تحديد زائد لطبيعة الوحدة.
theological_decisions:
- issue: دلالة «احفظهم في اسمك»
  choice: الإبقاء على «في اسمك» في المتن
  alternative: احفظهم باسمك؛ احمهم بواسطة اسمك
  rationale: يمكن للتركيب اليوناني أن يدل على المجال أو الوسيلة أو السلطان؛ لذا يحفظ المتن سعة العبارة، وتعرض الحاشية البدائل الممكنة.
- issue: قوة المقارنة في «ليكونوا واحدًا كما نحن»
  choice: إثبات المقارنة من غير شرح لطبيعة الوحدة
  alternative: حصرها في تعاون أخلاقي محض؛ أو جعلها تطابقًا في الكينونة
  rationale: النص يقيم تشبيهًا حقيقيًا بين وحدة التلاميذ ووحدة الآب والابن، لكنه لا يحدد في هذه العبارة وحدها ماهية هذا التشبيه، فلا ينبغي للترجمة أن تضعف المقارنة أو توسعها مذهبيًا.
- issue: مرجع الضمير الموصول في «الذي أعطيتني إياه»
  choice: إرجاعه إلى «اسمك» وفق نص SBLGNT
  alternative: 'فهم العبارة بمعنى: احفظ باسمك الذين أعطيتني إياهم'
  rationale: صيغة ᾧ في النص المعتمد مفرد محايد وتطابق ὀνόματι، ولذلك تُترجم على أن الاسم هو المُعطى، مع ذكر القراءة الأخرى في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «أما هم ففي العالم» لإبراز المقابلة الطبيعية بين رحيل يسوع وبقاء التلاميذ، وحُفظ إيجاز «كما نحن» لئلا يضاف إلى المقارنة ما لا يصرح به النص.
