  text: καθὼς ἔδωκας αὐτῷ ἐξουσίαν πάσης σαρκός, ἵνα πᾶν ὃ δέδωκας αὐτῷ ⸀δώσῃ αὐτοῖς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/002.yaml
  text: just as you gave him authority over all flesh[a], so that to all whom you have given him[b], he may give eternal life.
translation:
  language: ar
  text: كما أعطيتَه سلطانًا على كلِّ بشرٍ[a]، لكي يمنحَ الحياةَ الأبديةَ لجميع مَن أعطيتَهم له[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «على البشرية كلِّها». حرفيًا: «على كل جسد»، وهو تعبير كتابي يُراد به جميع البشر.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «كلَّ ما أعطيتَه له»؛ يستعمل اليوناني تعبيرًا جمعي المعنى بصيغة المفرد المحايد للدلالة على الأشخاص الذين أعطاهم الآب للابن.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: كما
  rationale: تحفظ معنى المقارنة والارتباط بما سبق بصياغة عربية طبيعية.
- source_word: ἔδωκας
  choice: أعطيتَه
  rationale: صيغة الماضي تناسب الفعل اليوناني الماضي وتشير إلى منح الآب السلطان للابن.
- source_word: ἐξουσίαν
  choice: سلطانًا
  rationale: تفيد الحق والولاية الممنوحين، لا مجرد القدرة الخام.
- source_word: πάσης σαρκός
  choice: على كلِّ بشرٍ
  rationale: تحافظ على صورة «البشر/اللحم» الكتابية بعبارة عربية مفهومة تشير إلى جميع الناس، من غير أن توحي بأن المقصود أجسادهم فقط.
- source_word: ἵνα
  choice: لكي
  rationale: تبيّن غرض منح السلطان بوضوح.
- source_word: πᾶν ὃ
  choice: لجميع مَن
  rationale: التركيب اليوناني مفرد محايد ذو دلالة جمعية، لكنه يشير هنا إلى أشخاص؛ وهذه الصياغة تنقل المرجع الشخصي طبيعيًا.
- source_word: δέδωκας
  choice: أعطيتَهم
  rationale: السياق العربي مع صلة الموصول يعبّر عن فعل تمّ وما زالت نتيجته قائمة، مع إظهار الجمع الذي ينطوي عليه التعبير الجمعي اليوناني.
- source_word: δώσῃ
  choice: يمنحَ
  rationale: المضارع المنصوب بعد «لكي» ينقل معنى الغرض المقصود دون إضعافه أو تحويله إلى مجرد احتمال.
- source_word: αὐτοῖς
  choice: لجميع مَن أعطيتَهم له
  rationale: دُمج الضمير الدال على المستفيدين في العبارة الموصولة تفاديًا للتكرار، مع إبقاء المستفيد من الحياة الأبدية واضحًا.
- source_word: ζωὴν αἰώνιον
  choice: الحياةَ الأبديةَ
  rationale: التعبير العربي الكتابي المألوف والدقيق للمفهوم اليوحناوي، ويشمل دوام الحياة ونوعها المنتمي إلى الدهر الآتي.
theological_decisions:
- issue: نطاق «كل بشر» وهوية الذين ينالون الحياة الأبدية
  choice: الإبقاء على شمول سلطان الابن لكل البشر، مع تخصيص منح الحياة الأبدية بجميع مَن أعطاهم الآب له.
  alternative: 'تسوية العبارتين بحيث يُفهم منهما نطاق واحد، أو ترجمة التعبير الجمعي حرفيًا: «كل ما أعطيته له».'
  rationale: يميّز النص نفسه بين النطاق العام للسلطان والجماعة التي أعطاها الآب للابن؛ فتحفظ الترجمة هذا التوتر من غير فرض منظومة لاهوتية عليه.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختير «كل بشر» للمحافظة على النكهة الكتابية مع شرح الحرفية في الحاشية، وصيغت العبارة الجمعية بصيغة الأشخاص لسلامة العربية ووضوح المرجع.
