  yaml_path: translation/nt/john/017/026.yaml
  text: And I made your name known to them[a], and I will make it known, so that the love with which you loved me may be in them[c][b], and I in them.
translation:
  language: ar
  text: وقد عرَّفتُهم اسمك[a]، وسأعرِّفهم به، لكي تكون فيهم المحبة التي أحببتني بها، وأكون أنا فيهم.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كشفتُ لهم اسمك، وسأكشفه لهم». و«اسمك» يشير إلى هوية الله وصفاته كما أعلنها، لا إلى مجرد لفظ يُنطق.'
    reason: lexical_alternative_and_cultural_note
  - marker: b
    text: يمكن أن تعني «فيهم» أيضًا «بينهم»، لكن «فيهم» تحافظ على دلالة السكنى الباطنة البارزة في إنجيل يوحنا.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώρισα
  choice: عرَّفتُهم
  rationale: ينقل الفعل الماضي السببي «جعلتُهم يعرفون»، بصياغة عربية طبيعية، ويحافظ على صلته بالفعل المستقبل الآتي.
- source_word: τὸ ὄνομά σου
  choice: باسمك
  rationale: يحفظ التعبير الملموس «اسمك» كما في اليونانية، من غير استبداله بتفسير مثل «شخصك» أو «صفاتك».
- source_word: γνωρίσω
  choice: سأظل أعرِّفهم به
  rationale: الفعل مستقبل، والمفعول مفهوم من «اسمك». أُضيفت «أظل» لإفادة استمرار التعريف في السياق، من غير تحويله إلى مجرد كشف لحظي.
- source_word: ἵνα
  choice: لكي
  rationale: تؤدي معنى الغاية أو النتيجة المقصودة بوضوح في العربية المعاصرة.
- source_word: ἡ ἀγάπη
  choice: المحبة
  rationale: المقابل العربي المعتاد والدقيق لـἀγάπη في هذا السياق.
- source_word: ἣν ἠγάπησάς με
  choice: التي أحببتني بها
  rationale: يحفظ صورة المحبة التي أحبّ بها الآب الابن، مع تركيب عربي سليم.
- source_word: ἐν αὐτοῖς
  choice: فيهم
  rationale: الترجمة المباشرة لحرف الجر ἐν، وتحفظ دلالة الحلول المتكررة في يوحنا بدل حصرها في معنى «بينهم».
- source_word: κἀγὼ ἐν αὐτοῖς
  choice: وأكون أنا فيهم
  rationale: يُصرَّح بالفعل المفهوم من الجملة اليونانية الناقصة نحويًا لتستقيم العربية، مع إبقاء المحبة وحضور المسيح حقيقتين منسقتين.
theological_decisions:
- issue: دلالة «اسمك» في لاهوت يوحنا
  choice: الإبقاء على «اسمك» في المتن
  alternative: هويتك أو صفاتك
  rationale: الاسم يشير إلى هوية الله وصفاته كما أعلنها، لكن توسيع العبارة داخل المتن يحسم دلالتها تفسيرًا؛ لذا حُفظ التعبير الكتابي وأُوضح في الحاشية.
- issue: العلاقة بين محبة الآب وحضور المسيح في المؤمنين
  choice: 'تنسيق الأمرين: «تكون فيهم المحبة... وأكون أنا فيهم»'
  alternative: جعل أحدهما سببًا للآخر أو تابعًا له
  rationale: اليونانية تنسق بين الأمرين ولا تصرح بأن أحدهما سبب الآخر، لذلك تُحفظ العلاقة من غير حسم زائد.
- issue: دلالة ἐν αὐτοῖς
  choice: فيهم
  alternative: بينهم
  rationale: كلا المعنيين ممكن لغويًا، لكن «فيهم» هو الأقرب إلى اللفظ وإلى موضوع السكنى المتبادلة في إنجيل يوحنا.
translation_notes:
  register: عربية فصحى واضحة ومهيبة. استُخدم «عرَّفتهم باسمك» لتجنب التركيب الأثقل «جعلت اسمك معروفًا لهم»، وصُرّح بـ«أكون» في الجملة الأخيرة لأن حذف الفعل على غرار اليونانية غير طبيعي في العربية هنا.
