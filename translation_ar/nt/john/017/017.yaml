  yaml_path: translation/nt/john/017/017.yaml
  text: Sanctify them in the truth[a]; your word is truth.
translation:
  language: ar
  text: قَدِّسْهُمْ فِي الْحَقِّ؛ كَلِمَتُكَ حَقٌّ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كَلِمَتُكَ هِيَ الْحَقُّ». جاءت كلمة «حق» في اليونانية خبرًا بلا أداة تعريف، وقد يبرز ذلك المعنى النوعي («كلمتك حقّ») بدلًا من التعريف أو المطابقة المباشرة («كلمتك هي الحق»).'
    reason: alternative_reading
lexical_decisions:
- source_word: ἁγίασον
  choice: قَدِّسْ
  rationale: صيغة أمر ماضٍ من ἁγιάζω، وتفيد تخصيصهم لله وجعلهم مقدسين. والفعل «قدّس» يحفظ بُعدَي التكريس والقداسة في عبارة عربية موجزة ومألوفة كتابيًا.
- source_word: αὐτοὺς
  choice: هُمْ
  rationale: ضمير مفعول به للجمع، ويعود في السياق إلى التلاميذ.
- source_word: ἐν τῇ ἀληθείᾳ
  choice: فِي الْحَقِّ
  rationale: تحافظ «في» على سعة دلالة ἐν، التي قد تتضمن المجال أو الوسيلة، من غير حصرها في معنى أداتي فقط؛ كما أن أداة التعريف في اليونانية تساند «الحق» لا «حق» على نحو نكرة.
- source_word: λόγος
  choice: كَلِمَة
  rationale: تشير هنا إلى ما يعلنه الله ويبلغه. و«كلمة» هي المقابل العربي الطبيعي الذي يحافظ على الصلة اللفظية والاستعمال اليوحناوي، من غير التفسير الزائد الذي قد تحمله «رسالة».
- source_word: ὁ σὸς
  choice: كَ
  rationale: 'التركيب اليوناني يعني حرفيًا «الكلمة التي لك»، وتؤديه العربية الطبيعية بضمير الملكية المتصل: «كلمتك».'
- source_word: ἀλήθειά ἐστιν
  choice: هِيَ حَقٌّ
  rationale: جاء خبر ἀλήθεια بلا أداة تعريف، ولذلك تحافظ «حقٌّ» على القوة الوصفية/النوعية للعبارة بدل أن تحسمها في صيغة المطابقة «هي الحق». وأُثبت ضمير الفصل «هي» لوضوح الإسناد وفصاحته.
theological_decisions:
- issue: هل يُنقل ἀλήθειά في الجملة الثانية نكرةً ذات قوة نوعية أم معرفةً تفيد المطابقة؟
  choice: كَلِمَتُكَ هِيَ حَقٌّ
  alternative: كَلِمَتُكَ هِيَ الْحَقُّ
  rationale: 'عدم وجود أداة التعريف مع خبر ἀλήθεια يرجح إبراز الصفة الجوهرية: كلمة الله حق. ومع ذلك تبقى صيغة التعريف ممكنة نحويًا بسبب موقع الخبر في اليونانية، لذا ذُكرت في الحاشية بدل إلغاء الاحتمال.'
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم «قدّسهم» للمحافظة على المعنى التكريسي والأخلاقي معًا، و«في الحق» لصون سعة حرف الجر اليوناني. ضُبطت الكلمات بالشكل الجزئي/الكامل هنا لتسهيل القراءة، ووُضع رمز الحاشية في المتن كما يلزم.
