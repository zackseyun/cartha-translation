review_pass:
  verdict: revise
  source_fidelity: 'المعنى العام أمين للنص اليوناني: النداء، وإرادة يسوع، وكون المعطَين معه، ورؤية المجد الموهوب، ومحبة الآب قبل تأسيس العالم كلها محفوظة. لكن «أيضًا» في الصياغة الحالية تتعلق ظاهريًا بـ«أنا» في العربية، في حين أن κἀκεῖνοι تؤكد أن الأشخاص المعطَين هم أيضًا يكونون معه.'
  naturalness: الأسلوب فصيح وواضح عمومًا. نقل «أيضًا» إلى «هم أيضًا معي» يجعل الجملة العربية أكثر سلاسة ويزيل التباسًا نحويًا ودلاليًا.
  terminology: «يا أبتِ»، و«وهبتهم»، و«أريد»، و«مجدي»، و«تأسيس العالم» اختيارات سليمة ووقورة في العربية الفصحى الحديثة. وتبقى لغة المجد الموهوب والمحبة السابقة لتأسيس العالم بلا توسع تفسيري.
  issues:
  - severity: medium
    issue: موضع «أيضًا» في «حيث أكون أنا أيضًا»
    rationale: في اليونانية، ἐγώ تشديد على «أنا» في «حيث أكون أنا»، أما κἀκεῖνοι («وهم/أولئك أيضًا») فتتعلق بالذين أعطاهم الآب للابن. الصياغة الحالية قد تفيد أن يسوع هو أيضًا موجود في ذلك الموضع، ولا تُظهر بوضوح الإضافة المقصودة للأشخاص المعطَين.
  revised_text: يا أبتِ، أريد أن يكون الذين وهبتهم لي هم أيضًا معي حيث أكون أنا، لكي يروا مجدي الذي وهبتني إياه، لأنك أحببتني قبل تأسيس العالم.
