  to: يا أبتِ، أريد أن يكون الذين وهبتهم لي هم أيضًا معي حيث أكون أنا، لكي يروا مجدي الذي وهبتني إياه، لأنك أحببتني قبل تأسيس العالم.
  rationale: تقتصر المراجعة على نقل القوة الإضافية في κἀκεῖνοι إلى «هم أيضًا»، مع إبقاء تشديد ἐγώ في «أنا». كما صيغت العبارة الحرفية في الحاشية على نحو أقرب إلى تركيب اليونانية مع الحفاظ على تفسير الإحالة الجمعية.
