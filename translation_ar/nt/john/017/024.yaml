  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ⸀πάτερ, ⸀ὃ δέδωκάς μοι, θέλω ἵνα ὅπου εἰμὶ ἐγὼ κἀκεῖνοι ὦσιν μετ’ ἐμοῦ, ἵνα θεωρῶσιν τὴν δόξαν τὴν ἐμὴν ἣν ⸀δέδωκάς μοι, ὅτι ἠγάπησάς με πρὸ καταβολῆς κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/024.yaml
  text: Father[a], I desire that those whom you have given me also may be with me where I am, so that they may see my glory that you have given me, because you loved me before the foundation of the world.
translation:
  language: ar
  text: يا أبتِ، أريد أن يكون الذين وهبتهم لي هم أيضًا معي حيث أكون أنا، لكي يروا مجدي الذي وهبتني إياه، لأنك أحببتني قبل تأسيس العالم.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάτερ
  choice: يا أبتِ
  rationale: نداء مباشر لله؛ وهذه صيغة عربية فصيحة طبيعية تحفظ معنى النداء من غير إضافة ضمير ملكية غير موجود في اليونانية.
- source_word: ὃ δέδωκάς μοι
  choice: الذين وهبتهم لي
  rationale: الضمير اليوناني مفرد محايد حرفيًا، لكنه ذو دلالة جمعية على أناس، كما يوضحه الانتقال إلى ضمير الجمع والفعل الجمع بعده؛ لذلك صيغ شخصيًا بالجمع في العربية.
- source_word: δέδωκάς
  choice: وهبتهم
  rationale: الفعل التام يدل على عطاء تمّ وبقي أثره. لا تملك العربية مقابلاً صرفيًا مطابقًا للتام اليوناني، والماضي هنا طبيعي ويحفظ تمام الفعل، بينما يوضح السياق استمرار نتيجته.
- source_word: θέλω
  choice: أريد
  rationale: ينقل الإرادة والرغبة القوية في سياق الصلاة بلغة عربية واضحة، من غير تحويل القول إلى خبر عن المستقبل أو إلى أمر صريح.
- source_word: ὅπου εἰμὶ ἐγὼ κἀκεῖνοι ὦσιν μετ’ ἐμοῦ
  choice: أن يكون الذين وهبتهم لي معي حيث أكون أنا أيضًا
  rationale: يحفظ مضمون الإرادة ووجود المعطَين مع يسوع في الموضع الذي يكون فيه. وُضع «أيضًا» مع العبارة على نحو عربي طبيعي مع إبقاء القوة الإضافية في κἀκεῖνοι.
- source_word: θεωρῶσιν
  choice: يروا
  rationale: لفظ واضح معاصر يعبّر عن الرؤية المقصودة، من غير اللجوء إلى «يعاينوا» أو «يشاهدوا» بما قد يضيف إيحاءات غير لازمة.
- source_word: τὴν δόξαν τὴν ἐμὴν
  choice: مجدي
  rationale: صياغة عربية طبيعية تحفظ نسبة المجد إلى المتكلم من غير تركيب حرفي ثقيل.
- source_word: ἣν δέδωκάς μοι
  choice: الذي وهبتني إياه
  rationale: صلة تحدد المجد بوصفه ما وهبه الآب للابن، مع ضمير عائد صريح يلائم العربية.
- source_word: ὅτι
  choice: لأن
  rationale: يُفهم هنا سببيًا، فيربط هبة المجد بمحبة الآب للابن قبل تأسيس العالم.
- source_word: ἠγάπησάς με πρὸ καταβολῆς κόσμου
  choice: أحببتني قبل تأسيس العالم
  rationale: يحفظ الماضي والتحديد الزمني السابق لخلق العالم بلا تلطيف أو توسع تفسيري.
theological_decisions:
- issue: دلالة محبة الآب للابن قبل تأسيس العالم
  choice: 'الإبقاء على العبارة الزمنية المباشرة: «لأنك أحببتني قبل تأسيس العالم».'
  alternative: تلطيف الإشارة السابقة للخلق أو تحويلها إلى تعبير مجازي.
  rationale: النص اليوناني يقدّم تصريحًا زمنيًا واضحًا، وينبغي حفظه بلا تفسير زائد أو تقليل من قوته.
- issue: قوة θέλω في صلاة يسوع
  choice: «أريد»
  alternative: «أشاء» أو صياغة أمر صريح.
  rationale: «أريد» تحفظ الإرادة القوية وتظل طبيعية في العربية الحديثة، من غير حسم التوتر بين الطلب والإرادة بصياغة عقائدية أثقل من النص.
- issue: المجد الذي وهبه الآب للابن
  choice: «مجدي الذي وهبتني إياه»
  alternative: إعادة صياغة الهبة بما يجعل المجد مجرد إظهار لاحق أو بما ينفي حقيقة الهبة.
  rationale: 'تُحفظ لغة النص كما هي: المجد للابن، وهو أيضًا موصوف بأنه موهوب له، من غير محاولة حل هذا التوتر اللاهوتي داخل الترجمة.'
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «يا أبتِ» للنداء الكتابي الطبيعي، و«أريد» بدل ألفاظ أشد قدمًا، مع الحفاظ على بنية الصلاة وعلى الغموض أو التوتر الحقيقي في لغة الهبة والمجد.
