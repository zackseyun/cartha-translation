lexical_decisions:
- source_word: κἀγὼ
  choice: وأنا
  rationale: اللفظة اختصار لـ καί + ἐγώ، فتحفظ «وأنا» صلة الكلام وتُبرز الضمير، مع إمكان فهم معنى الإضافة؛ لذلك ذُكر البديل في الحاشية.
- source_word: τὴν δόξαν
  choice: المجد
  rationale: «المجد» يحفظ الثقل اللاهوتي للفظة δόξα واستعمالها المميز في إنجيل يوحنا، ولا يختزلها في الكرامة البشرية أو البهاء وحده.
- source_word: ἣν δέδωκάς μοι
  choice: الذي أعطيتني إياه
  rationale: صياغة عربية طبيعية للصلة، وتحافظ دلاليًا على العطية المنجزة ذات الأثر القائم التي يوحي بها التام اليوناني.
- source_word: δέδωκα αὐτοῖς
  choice: قد أعطيتهم
  rationale: «قد» مع الماضي تفيد تحقق الفعل، وتعبّر بوضوح وطبيعية عن العطية المنجزة دون إثقال الأسلوب العربي.
- source_word: ἵνα ὦσιν
  choice: ليكونوا
  rationale: لام التعليل مع المضارع المنصوب تنقل بوضوح معنى الغاية أو النتيجة المقصودة.
- source_word: ἓν
  choice: واحدًا
  rationale: يحافظ المفرد المحايد في اليونانية على التعبير الموجز عن الوحدة من غير تفسيرها مؤسسيًا أو علائقيًا أو وجوديًا.
- source_word: καθὼς
  choice: كما
  rationale: أداة مقارنة عربية واضحة وطبيعية، تنقل المقابلة المباشرة دون مبالغة تفسيرية.
- source_word: ἡμεῖς ἕν
  choice: أننا واحد
  rationale: إدخال «أننا» بعد «كما» يجعل العبارة سليمة في العربية، مع إبقاء «واحد» مفتوحة الدلالة وعدم استبدالها بتفسير مثل «متحدون».
theological_decisions:
- issue: طبيعة وحدة المؤمنين قياسًا إلى وحدة الآب والابن
  choice: ليكونوا واحدًا كما أننا واحد
  alternative: ليكونوا متحدين كما نحن متحدون
  rationale: النص يقرر مقارنة حقيقية، لكنه لا يحدد هنا هل هذه الوحدة وجودية أم علائقية أم رسالية أم كنسية؛ لذا تحافظ الصياغة على التوتر اللاهوتي ولا تحسم ما تركه النص مفتوحًا.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُعملت «وأنا قد أعطيتهم» للمحافظة على تسلسل الخطاب وإبراز الفاعل، و«ليكونوا واحدًا» للمحافظة على إيجاز الأصل وغموضه المقصود بشأن طبيعة الوحدة.
