  text: εἶπεν δὲ τοῦτο οὐχ ὅτι περὶ τῶν πτωχῶν ἔμελεν αὐτῷ, ἀλλ’ ὅτι κλέπτης ἦν καὶ τὸ γλωσσόκομον ⸀ἔχων τὰ βαλλόμενα ἐβάσταζεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/006.yaml
  text: He said this not because he cared about the poor[a], but because he was a thief, and having the money box[b], he used to take what was put into it.
translation:
  language: ar
  text: قال هذا لا لأنه كان يهتم بالفقراء، بل لأنه كان لصًّا؛ وكان صندوق المال معه[a]، فكان يأخذ ما يُوضَع فيه[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «وكان كيس المال معه». فاللفظة اليونانية قد تدل على وعاء تُحفَظ فيه النقود.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «كان يحمل ما يُوضَع فيه»، أو: «كان يختلس ما يُوضَع فيه». فالفعل قد يعني «يحمل»، لكن وصفه هنا بأنه لص يرجّح معنى الاستيلاء على المال.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν δὲ τοῦτο
  choice: قال هذا
  rationale: ينقل العبارة مباشرة، مع عدم إثقال العربية بأداة ربط؛ فـδέ هنا خفيفة واتصالها بالسياق مفهوم.
- source_word: οὐχ ὅτι περὶ τῶν πτωχῶν ἔμελεν αὐτῷ
  choice: لا لأنه كان يهتم بالفقراء
  rationale: تعبير عربي طبيعي يوضح أن الجملة تنفي الدافع المزعوم، ويحافظ على دلالة الاستمرار في ἔμελεν.
- source_word: ἀλλ’ ὅτι κλέπτης ἦν
  choice: بل لأنه كان لصًّا
  rationale: يحافظ على المقابلة بين الدافع المنفي والسبب الحقيقي، ويترجم κλέπτης بدقة من غير إيحاء بالعنف الذي قد تحمله كلمة «قاطع طريق» أو «سالب».
- source_word: τὸ γλωσσόκομον ἔχων
  choice: وكان صندوق المال معه
  rationale: صياغة واضحة وطبيعية تدل على حيازته الصندوق وإشرافه العملي عليه، من غير إضافة منصب غير مصرّح به في النص.
- source_word: τὰ βαλλόμενα
  choice: ما يُوضَع فيه
  rationale: ينقل اسم المفعول المبني للمجهول، ويصرّح بمرجع الظرف في العربية لسلامة الفهم.
- source_word: ἐβάσταζεν
  choice: فكان يأخذ
  rationale: يحافظ على دلالة الفعل الماضي الناقص في اليونانية، ويتيح للسياق السابق، «كان لصًّا»، أن يبين أن الأخذ كان اختلاسًا، من غير حصر الدلالة المعجمية الواسعة للفعل في معنى واحد.
theological_decisions:
- issue: دلالة ἐβάσταζεν وصلتها باتهام يهوذا بالسرقة
  choice: فكان يأخذ ما يُوضَع فيه
  alternative: 'كان يحمل ما يُوضَع فيه؛ أو: كان يختلس ما يُوضَع فيه'
  rationale: قد يعني الفعل «يحمل»، لكنه في هذا السياق، بعد وصف يهوذا بأنه لص، يرجح معنى الأخذ لنفسه أو الاستيلاء. اختير «يأخذ» في المتن للمحافظة على شيء من السعة الدلالية، مع بيان البدائل في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعملت جملة قصيرة ذات مقابلة مباشرة بين الدافع المنفي والسبب المثبت، وحُفظت دلالة الاعتياد في الفعل الناقص بصيغة «فكان يأخذ». جميع علامات الحواشي واردة في المتن.
