  yaml_path: translation/nt/john/012/018.yaml
  text: For this reason also the crowd went to meet him[b][a], because they heard that he had done this sign.
translation:
  language: ar
  text: ولهذا أيضًا توجّه الجمع للقائه[a]، لأنهم سمعوا أنه صنع هذه الآية[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لاقاه الجمع». يفيد الفعل اليوناني التوجّه للقاء شخص.'
    reason: lexical_alternative
  - marker: b
    text: '«الآية» هي تسمية مميزة في إنجيل يوحنا لعمل عجيب يدل، إلى جانب كونه معجزة، على هوية يسوع ورسالته. ويمكن ترجمتها: «المعجزة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: ولهذا
  rationale: تنقل العبارة السببية الصريحة التي تربط خروج الجمع بما سبق، بصياغة عربية طبيعية موجزة.
- source_word: καὶ
  choice: أيضًا
  rationale: تحفظ المعنى الإضافي للأداة من غير مبالغة في توكيدها.
- source_word: ὑπήντησεν αὐτῷ
  choice: خرج للقائه
  rationale: يفيد الفعل اليوناني التوجّه لملاقاة شخص؛ و«خرج للقائه» تعبير عربي طبيعي يحفظ هذه الدلالة الحركية.
- source_word: ὁ ὄχλος
  choice: الجمع
  rationale: لفظ واضح وفصيح يدل على جماعة الناس المحتشدة، ويلائم الاستعمال المتكرر في سياق الإنجيل.
- source_word: ὅτι
  choice: لأن
  rationale: تقدّم سبب خروج الجمع للقائه.
- source_word: ἤκουσαν
  choice: سمعوا
  rationale: ينقل صيغة الماضي نقلًا مباشرًا، ويُفهم ترتيب الحدثين طبيعيًا من العلاقة السببية.
- source_word: τοῦτο αὐτὸν πεποιηκέναι τὸ σημεῖον
  choice: أنه صنع هذه الآية
  rationale: تحفظ «هذه» الإشارة إلى العمل المذكور في السياق، وتنقل صيغة التمام في تركيب عربي طبيعي بعد فعل السماع.
- source_word: τὸ σημεῖον
  choice: الآية
  rationale: «الآية» تعبّر عن العمل العجيب بوصفه علامة دالة تتجاوز الحدث نفسه، وتحفظ الاستعمال المميز للكلمة في يوحنا.
theological_decisions:
- issue: ترجمة المصطلح اليوحناوي σημεῖον
  choice: الآية
  alternative: المعجزة
  rationale: «الآية» تحافظ على البعد الدلالي والكاشف للعمل، فلا تختزله في كونه حدثًا خارقًا فحسب، من غير إضافة تفسير عقائدي إلى النص.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ووقورة. استُعمل «الجمع» بدل ألفاظ أقدم مثل «الجموع»، وحُفظت الصلة السببية والحركة المقصودة في الفعل اليوناني، مع إبقاء الدلالة اليوحناوية المفتوحة للفظ «الآية».
