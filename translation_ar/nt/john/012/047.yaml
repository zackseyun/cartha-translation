review_pass:
  verdict: revise
  source_fidelity: يترجم المشروع κρίνω بـ«أدين» في الموضعين، لكن هذا يضيّق الفعل اليوناني إلى الإدانة ويجعل الحكم سلبيًا صريحًا. الأصل يكرر فعل «الدينونة/الحكم» نفسه في الموضعين، والسياق يسمح بدلالة الحكم السلبي دون أن يفرضها في اللفظ. «أحكم عليه» و«أحكم على العالم» يحافظان على التكرار وعلى هذا القدر من الانفتاح.
  naturalness: النص فصيح واضح وطبيعي. وصياغة «فأنا لا أحكم عليه؛ لأني لم آتِ لأحكم على العالم» سليمة في العربية الحديثة وتحافظ على تقابل العبارة.
  terminology: «كلماتي»، «يحفظها»، «العالم»، و«أخلّص» اختيارات مناسبة. يلزم استبدال «أدينه/لأدين» بـ«أحكم عليه/لأحكم على» اتساقًا مع الدلالة الأوسع لـκρίνω ومع مسار التدقيق الإنجليزي الذي يختار “judge” في المتن.
  issues:
  - severity: medium
    issue: تضييق κρίνω إلى «أدان» في الموضعين.
    rationale: «أدان» يصرّح بالإدانة، بينما κρίνω هنا هو «يحكم/يدين» ويُراد الحفاظ على التوتر السياقي دون حسمه بترجمة تفسيرية. كما أن المتن الإنجليزي المراجع يستعمل “judge”، لا “condemn”.
  revised_text: وَإِنْ سَمِعَ أَحَدٌ كَلِمَاتِي وَلَمْ يَحْفَظْهَا، فَأَنَا لَا أَحْكُمُ عَلَيْهِ؛ لِأَنِّي لَمْ آتِ لِأَحْكُمَ عَلَى الْعَالَمِ، بَلْ لِأُخَلِّصَ الْعَالَمَ.
