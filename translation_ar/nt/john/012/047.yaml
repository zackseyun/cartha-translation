source:
  edition: SBLGNT
  text: καὶ ἐάν τίς μου ἀκούσῃ τῶν ῥημάτων καὶ μὴ ⸀φυλάξῃ, ἐγὼ οὐ κρίνω αὐτόν, οὐ γὰρ ἦλθον ἵνα κρίνω τὸν κόσμον ἀλλ’ ἵνα σώσω τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/047.yaml
  text: And if anyone hears my words and does not keep them[a], I do not judge him; for I did not come to judge the world[b], but to save the world.
translation:
  language: ar
  text: وَإِنْ سَمِعَ أَحَدٌ كَلِمَاتِي وَلَمْ يَحْفَظْهَا، فَأَنَا لَا أَحْكُمُ عَلَيْهِ؛ لِأَنِّي لَمْ آتِ لِأَحْكُمَ عَلَى الْعَالَمِ، بَلْ لِأُخَلِّصَ الْعَالَمَ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐάν τίς
  choice: وإن سمع أحد
  rationale: ينقل الشرط المفتوح العام بصياغة عربية فصيحة وطبيعية، و«أحد» تشمل أي شخص.
- source_word: ἀκούσῃ
  choice: سمع
  rationale: يحافظ على المعنى الأساسي للفعل، من غير إضافة دلالة الإصغاء المتعمد أو الطاعة.
- source_word: τῶν ῥημάτων
  choice: كلماتي
  rationale: تعبير موجز وطبيعي عن أقوال يسوع المنطوقة، ويحافظ على الارتباط اللفظي بكلامه.
- source_word: φυλάξῃ
  choice: يحفظها
  rationale: «يحفظ» يتسع لمعاني الصون والمراعاة والعمل بالكلام، فلا يضيّق الدلالة إلى «يطيع» وحدها.
- source_word: οὐ κρίνω αὐτόν
  choice: فأنا لا أدينه
  rationale: في هذا السياق يفيد κρίνω إصدار الحكم السلبي؛ و«أدين» عربية طبيعية، مع إبقاء الفعل نفسه في جملة الغاية للمحافظة على التكرار.
- source_word: ἦλθον
  choice: لم آتِ
  rationale: ينقل مجيء يسوع ورسالته بصيغة عربية مألوفة وموجزة.
- source_word: ἵνα κρίνω
  choice: لأدين
  rationale: لام التعليل تعبّر طبيعيًا عن الغاية التي تفيدها ἵνα مع صيغة النصب.
- source_word: κόσμον
  choice: العالم
  rationale: المقابل العربي المألوف لـ κόσμος في يوحنا، ولا يفرض تضييقًا غير مصرّح به إلى البشر وحدهم.
- source_word: σώσω
  choice: أخلّص
  rationale: يحفظ الدلالة الخلاصية المركزية للفعل σῴζω، وهو التعبير الكتابي العربي الواضح والمستقر.
theological_decisions:
- issue: قول يسوع إنه لا يدين في علاقته بلغة الدينونة في إنجيل يوحنا
  choice: ترجمة κρίνω بـ«أدين» في الموضعين، وترك البعد الزمني والرسالي للسياق.
  alternative: «أحكم عليه» أو إضافة «الآن» تفسيرًا
  rationale: يحافظ تكرار اللفظ على مقابلة النص بين غاية المجيء للدينونة وغاية المجيء للخلاص، من غير حلّ التوتر مع نصوص يوحنا الأخرى أو إدخال قيد زمني غير موجود صراحة.
- issue: الضمير المفرد المذكر αὐτόν بعد τις العامة
  choice: «أدينه» عائدًا إلى «أحد»
  alternative: «أدين ذلك الشخص»
  rationale: العربية تستعمل «أحد» استعمالًا عامًا، ويعود إليه ضمير المفرد المذكر نحويًا من غير أن يحصر المعنى في الذكور.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت صياغة قريبة من بنية اليونانية من غير جمود، مع الحفاظ على تكرار «أدين» و«العالم» وعلى التقابل بين الدينونة والخلاص. لا توجد حاجة إلى حاشية لأن العموم في «أحد» واضح عربيًا، ولأن «أدين» ينقل في السياق الحكم السلبي بصورة طبيعية.
