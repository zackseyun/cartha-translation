revisions:
- from: وَإِنْ سَمِعَ أَحَدٌ كَلِمَاتِي وَلَمْ يَحْفَظْهَا، فَأَنَا لَا أَدِينُهُ؛ لِأَنِّي لَمْ آتِ لِأَدِينَ الْعَالَمَ، بَلْ لِأُخَلِّصَ الْعَالَمَ.
  to: وَإِنْ سَمِعَ أَحَدٌ كَلِمَاتِي وَلَمْ يَحْفَظْهَا، فَأَنَا لَا أَحْكُمُ عَلَيْهِ؛ لِأَنِّي لَمْ آتِ لِأَحْكُمَ عَلَى الْعَالَمِ، بَلْ لِأُخَلِّصَ الْعَالَمَ.
  rationale: التعديل الوحيد هو ردّ κρίνω إلى «أحكم» في الموضعين، مع استعمال حرف الجر الملائم في العربية («على»). وبذلك يُصان التكرار اليوناني، وتبقى إمكانية دلالة الحكم السلبي مفهومة من السياق من غير جعلها المعنى الوحيد في المتن. لا تستلزم العربية حاشية للعموم في «أحد»، ولا تُنقل الحاشية الإنجليزية ذات الموضع الملتبس كما هي.
