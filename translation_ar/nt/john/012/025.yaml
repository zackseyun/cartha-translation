  text: ὁ φιλῶν τὴν ψυχὴν αὐτοῦ ⸀ἀπολλύει αὐτήν, καὶ ὁ μισῶν τὴν ψυχὴν αὐτοῦ ἐν τῷ κόσμῳ τούτῳ εἰς ζωὴν αἰώνιον φυλάξει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/025.yaml
  text: The one who loves his life loses it[b][a], and the one who hates his life in this world will keep it for eternal life.
translation:
  language: ar
  text: مَنْ يُحِبُّ حياتَهُ يَفْقِدُها[a]، ومَنْ يُبْغِضُ حياتَهُ[b] في هذا العالَم سيَحْفَظُها للحياة الأبديّة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «نَفْسَه» أو «ذاتَه»؛ فالكلمة اليونانية ψυχή قد تعني الحياة أو النفس أو الذات بحسب السياق.'
    reason: lexical_alternative
  - marker: b
    text: «يبغض حياته» مفارقة مقصودة تعني رفض التعلّق بالحياة في نظام العالم الحاضر، ولا تدعو إلى كراهية الذات. قارن لوقا 14:26، حيث يرد أسلوب مشابه.
    reason: cross_reference
lexical_decisions:
- source_word: ὁ φιλῶν
  choice: مَنْ يُحِبُّ
  rationale: اسم الفاعل المعرَّف بالأداة مستعمل استعمالًا اسميًّا عامًا؛ وصيغة «مَنْ يُحِبُّ» طبيعية في العربية وتحفظ المعنى العام والاستمرار السياقي.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: حياتَهُ
  rationale: تشير ψυχή هنا إلى حياة الإنسان أو ذاته التي قد يفقدها أو يحفظها، لا بالضرورة إلى النفس بوصفها جزءًا غير مادي؛ و«حياته» تلائم التضاد بين الفقد والحفظ.
- source_word: ἀπολλύει αὐτήν
  choice: يَفْقِدُها
  rationale: مع وجود «حياته» مفعولًا به، تنقل «يفقدها» النتيجة المقصودة بصورة عربية سليمة، وتحافظ على مقابلتها مع «يحفظها».
- source_word: ὁ μισῶν
  choice: مَنْ يُبْغِضُ
  rationale: تُبقي «يبغض» القوة المقصودة في μισέω ولا تلطّف المفارقة إلى «يحب أقل»، مع بقاء العبارة اللاحقة «في هذا العالم» مقيِّدة للسياق.
- source_word: ἐν τῷ κόσμῳ τούτῳ
  choice: في هذا العالَم
  rationale: ترجمة مباشرة وطبيعية، وتشير في السياق اليوحناوي إلى الحياة ضمن نظام العالم الحاضر في مقابل الحياة الأبدية.
- source_word: φυλάξει αὐτήν
  choice: يَحْفَظُها
  rationale: ينقل «يحفظها» معنى الصون والإبقاء في φυλάσσω، ويقيم تضادًا واضحًا مع «يفقدها»؛ أما دلالة المستقبل فتفهم من البنية الشرطية العامة وغاية الحياة الأبدية.
- source_word: εἰς ζωὴν αἰώνιον
  choice: للحياة الأبديّة
  rationale: تفيد اللام الغاية أو المآل، فتعبّر بإيجاز عن حفظ الحياة وصولًا إلى الحياة الأبدية.
theological_decisions:
- issue: معنى «يبغض حياته»
  choice: الإبقاء على اللفظ القوي «يبغض حياته» بوصفه مفارقة تدعو إلى رفض التعلّق بالحياة في العالم الحاضر.
  alternative: يحب حياته أقل؛ أو لا يتمسك بحياته
  rationale: الفعل اليوناني μισέω قوي، والنص يقصد مفارقة ينبغي ألا تُحلّ داخل المتن. وعبارة «في هذا العالم» تحدد مجال البغض، فلا يُفهم منه تمجيد كراهية الذات.
- issue: ترجمة ψυχή
  choice: حياة
  alternative: نفس؛ ذات
  rationale: سياق الفقد والحفظ يرجّح معنى الحياة أو الذات الحية، وتجنّب «نفس» هنا يمنع فرض تمييز أنثروبولوجي بين الجسد والنفس لا يقتضيه النص، مع إثبات البدائل في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة، بصياغة حكمية موجزة تحافظ على التوازي والمفارقة. استُعمل «يبغض» بدل «يكره» لملاءمته للسجل الكتابي من غير غموض، ووُضعت علامتا الحاشيتين عند الموضعين اللذين تشرحانهما مباشرة.
