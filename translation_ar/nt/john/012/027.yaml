  text: Νῦν ἡ ψυχή μου τετάρακται, καὶ τί εἴπω; πάτερ, σῶσόν με ἐκ τῆς ὥρας ταύτης. ἀλλὰ διὰ τοῦτο ἦλθον εἰς τὴν ὥραν ταύτην.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/027.yaml
  text: Now my soul is troubled[a], and what should I say? Father, save me from this hour. But for this reason I came to this hour.
translation:
  language: ar
  text: الآن نفسي مضطربة، وماذا أقول؟ يا أبتِ، خلِّصني من هذه الساعة.[a] ولكن لهذا أتيت إلى هذه الساعة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ويجوز أيضًا: «وماذا أقول؟ أأقول: يا أبتِ، خلِّصني من هذه الساعة؟» إذ يمكن فهم العبارة اليونانية سؤالًا بلاغيًا، لا طلبًا مباشرًا.'
    reason: alternative_reading
lexical_decisions:
- source_word: Νῦν
  choice: الآن
  rationale: ظرف زمان يدل على آنية اضطراب يسوع، و«الآن» ترجمة مباشرة وطبيعية.
- source_word: ψυχή
  choice: نفسي
  rationale: تشير هنا إلى ذات يسوع وحياته الباطنة، وتحافظ «نفسي» على ثقل التعبير من غير تفسير زائد.
- source_word: τετάρακται
  choice: مضطربة
  rationale: صيغة التام المبني للمجهول تدل على حالة حاضرة ناتجة من اضطراب؛ والتعبير العربي الاسمي ينقل هذه الحالة بوضوح.
- source_word: τί εἴπω
  choice: ماذا أقول؟
  rationale: ينقل صيغة التساؤل التداولي التي تعبّر عن التردد والتفكير فيما ينبغي قوله، بأسلوب عربي طبيعي.
- source_word: πάτερ
  choice: يا أبتِ
  rationale: نداء مباشر لله؛ و«يا أبتِ» فصيحة ودالة بوضوح على المخاطبة.
- source_word: σῶσόν με ἐκ τῆς ὥρας ταύτης
  choice: خلِّصني من هذه الساعة
  rationale: يحافظ على صيغة الأمر ومعنى الإنقاذ من المحنة المقبلة، من غير إضعاف الدلالة اللاهوتية لفعل الخلاص.
- source_word: ὥρα
  choice: الساعة
  rationale: تحافظ على اللفظ اليوحناوي المحوري الذي يدل على الوقت المعيّن لآلام يسوع وموته وتمجيده، بدل تعميمه إلى «الوقت».
- source_word: ἀλλὰ διὰ τοῦτο
  choice: ولكن لهذا
  rationale: ينقل التقابل مع ما سبق، مع إبقاء الإشارة في «لهذا» مفتوحة كما في اليونانية دون إضافة تفسير للغرض.
- source_word: ἦλθον εἰς τὴν ὥραν ταύτην
  choice: أتيت إلى هذه الساعة
  rationale: يحافظ على دلالة المجيء إلى الساعة المعيّنة وعلى حرف الاتجاه εἰς، بدل تحويل العبارة صراحةً إلى «أتيت لأجل هذه الساعة».
theological_decisions:
- issue: هل تُفهم عبارة «يا أبتِ، خلِّصني من هذه الساعة» طلبًا مباشرًا أم احتمالًا مرفوضًا داخل سؤال بلاغي؟
  choice: 'صياغتها طلبًا مباشرًا: «يا أبتِ، خلِّصني من هذه الساعة».'
  alternative: 'صياغتها ضمن سؤال بلاغي: «وماذا أقول؟ أأقول: يا أبتِ، خلِّصني من هذه الساعة؟»'
  rationale: علامات الترقيم ليست أصلية في أقدم المخطوطات، ولذلك يحتمل التركيب القراءتين. يتبع المتن ترقيم SBLGNT بوصف العبارة طلبًا مباشرًا، ثم يحفظ البديل في الحاشية، وبذلك لا يُمحى التوتر بين اضطراب يسوع وقبوله الساعة التي أتى إليها.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة، مع الحفاظ على المصطلح اليوحناوي «الساعة» وعلى الغموض الحقيقي في ترقيم العبارة. استُخدم «يا أبتِ» بوصفه نداءً فصيحًا طبيعيًا، وتُركت «لهذا» من غير توسيع تفسيري.
