  verdict: approve
  source_fidelity: الترجمة تنقل البناء الزمني في «ὡς ... ἔχετε» بـ«ما دام ... معكم»، والأمر المستمر «آمنوا بالنور»، وغاية «لكي تصيروا أبناء النور» مع المحافظة على دلالة الصيرورة في γένησθε. كما تنقل الجملة السردية الأخيرة ترتيب الانصراف ثم الاختفاء، ولا تضيف تفسيرًا للمقصود بـ«النور».
  naturalness: 'النص فصيح معاصر وواضح: «ما دام النور معكم» و«فآمنوا بالنور» و«ثم انصرف واختفى عنهم» تراكيب طبيعية ملائمة لسياق كتابي رصين. «قال يسوع هذا» موجز وسليم في العربية، وإن كان «قال يسوع هذه الأمور» أقرب لفظيًا، فلا تستلزم الأمانة تغييرًا.'
  terminology: «النور» و«آمنوا بالنور» يحفظان الاصطلاح اليوحناوي. و«أبناء النور» مقابل مناسب لـυἱοὶ φωτός ويحافظ على الصورة المذكرة الاصطلاحية دون فرض قراءة مذهبية. الحاشية (أ) تشرح التعبير وتثبت البديل بوضوح، والحاشية (ب) منسجمة مع أسبقية اسم الفاعل اليوناني.
