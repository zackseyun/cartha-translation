base_translation:
  language: en
  yaml_path: translation/nt/john/012/036.yaml
  text: While you have the light[a], believe in the light, so that you may become sons of light. Jesus spoke these things[b], and he departed and hid from them.
translation:
  language: ar
  text: ما دام النور معكم، فآمنوا بالنور لكي تصيروا أبناء النور[a]. قال يسوع هذا، ثم انصرف واختفى عنهم[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «بنو النور». وهو تعبير يعني أناسًا يتصفون بالنور؛ ويجوز ترجمته: «أولاد النور».'
    reason: lexical_alternative
  - marker: b
    text: 'ويجوز: «وانصرف، فاختفى عنهم»، إذ يسبق فعل الانصراف فعل الاختفاء في تركيب الأصل.'
    reason: previous_rendering
lexical_decisions:
- source_word: ὡς τὸ φῶς ἔχετε
  choice: ما دام النور معكم
  rationale: 'يفيد التركيب معنى الزمن المحدود: «ما دمتم تتمتعون بوجود النور بينكم». وهذه الصياغة عربية طبيعية وتحفظ الإلحاح من غير توسع تفسيري.'
- source_word: πιστεύετε εἰς τὸ φῶς
  choice: فآمنوا بالنور
  rationale: ينقل فعل الأمر الحاضر والدلالة اليوحناوية لعبارة πιστεύω εἰς بوضوح، وتفيد الفاء ارتباط الدعوة بمدة وجود النور معهم.
- source_word: ἵνα υἱοὶ φωτὸς γένησθε
  choice: لكي تصيروا أبناء النور
  rationale: «لكي» تحفظ دلالة الغاية، و«تصيروا» تنقل معنى التحول في γένησθε، و«أبناء النور» تحافظ على الصورة الذكورية الصريحة والتعبير السامي الدال على من يتصفون بالنور.
- source_word: Ταῦτα ἐλάλησεν Ἰησοῦς
  choice: قال يسوع هذا
  rationale: صياغة عربية موجزة وطبيعية تشير إلى الكلام السابق كله، من غير تكلف «تكلم بهذه الأشياء».
- source_word: ἀπελθὼν ἐκρύβη ἀπ’ αὐτῶν
  choice: ثم انصرف واختفى عنهم
  rationale: تنقل «ثم» تقدم فعل الانصراف على الاختفاء، ويعبّر «اختفى» عن الاستعمال اللازم ذي المعنى الوسطي للصيغة اليونانية من غير الإيحاء بأن شخصًا آخر أخفاه.
theological_decisions:
- issue: التعبير العائلي المذكر υἱοὶ φωτός
  choice: أبناء النور
  alternative: أولاد النور
  rationale: 'يحفظ الاختيار لفظ «الأبناء» المذكر الوارد في الأصل، مع إبقاء الدلالة الاصطلاحية العامة: أناس يتصفون بالنور وينتمون إليه.'
- issue: دلالة النور في السياق اليوحناوي
  choice: النور
  alternative: من هو النور
  rationale: أُبقيت الصورة كما وردت لتظل قابلة للدلالة التصويرية والمسيحانية معًا، من غير إدخال تفسير صريح في المتن.
- issue: صيغة ἐκρύβη
  choice: اختفى عنهم
  alternative: أخفى نفسه عنهم
  rationale: الصيغة مبنية للمجهول من حيث الشكل، لكنها تؤدي هنا معنى لازمًا أو وسطيًا على الأرجح. «اختفى» يحفظ الفعل السردي من غير نسبة الإخفاء إلى فاعل آخر.
translation_notes:
  register: 'العربية فصحى معاصرة واضحة ومهيبة. استُعملت «ما دام... معكم» بدل صياغة حرفية ثقيلة مثل «ما دمتم تملكون النور»، وحُفظت مفردات يوحنا الأساسية: النور، الإيمان، وأبناء النور.'
