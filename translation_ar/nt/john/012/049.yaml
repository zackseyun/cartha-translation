base_translation:
  language: en
  yaml_path: translation/nt/john/012/049.yaml
  text: For I have not spoken from myself[b][a], but the Father who sent me has himself given me a command as to what I should say and what I should speak.
translation:
  language: ar
  text: لأنني لم أتكلّم من عند نفسي[a]، بل الآب الذي أرسلني هو نفسه قد أعطاني أمرًا بشأن ما أقول وما أتكلّم به[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «من تلقاء نفسي»، أو: «بسلطاني الخاص».'
    reason: lexical_alternative
  - marker: b
    text: يستعمل النص اليوناني فعلين مختلفين، هما «أقول» و«أتكلّم»، وقد حافظت الترجمة على هذا التمييز.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ ἐμαυτοῦ
  choice: من عند نفسي
  rationale: تعبير قريب من الأصل وواضح في العربية، يحفظ معنى أن كلام يسوع لا يصدر عنه على نحو مستقل، من غير أن يحصر العبارة في تفسير «السلطان» وحده.
- source_word: οὐκ ἐλάλησα
  choice: لم أتكلّم
  rationale: الماضي المنفي هو الصياغة العربية الطبيعية هنا، ويعبّر في السياق عن كلام يسوع في خدمته حتى هذه اللحظة.
- source_word: ὁ πέμψας με πατὴρ
  choice: الآب الذي أرسلني
  rationale: ينقل اسم الفاعل اليوناني بجملة صلة عربية طبيعية، ويحفظ «الآب» بوصفه لقبًا إلهيًا في السياق اليوحناوي.
- source_word: αὐτός
  choice: هو نفسه
  rationale: يحفظ التوكيد الصريح في الضمير اليوناني.
- source_word: ἐντολήν
  choice: أمرًا
  rationale: لفظ عربي معاصر يحفظ قوة الإلزام والسلطان، من غير الإيحاء بالضرورة بوصية تشريعية مدوّنة.
- source_word: δέδωκεν
  choice: قد أعطاني
  rationale: «قد» مع الماضي تلائم العربية وتبرز أن إعطاء الأمر قد تم وأن أثره قائم في السياق.
- source_word: τί εἴπω καὶ τί λαλήσω
  choice: ما أقول وما أتكلّم به
  rationale: يحفظ التوازي والتمييز بين فعلي «القول» و«التكلّم» في اليونانية، مع صياغة عربية مفهومة.
theological_decisions:
- issue: علاقة كلام الابن بأمر الآب
  choice: صياغة تفيد أن يسوع لا يتكلّم استقلالًا عن الآب، بل وفق الأمر الذي أعطاه إياه الآب في إطار إرساليته.
  alternative: أن يكون المقصود مجرد نبي بشري، أو أن يتصرّف مستقلًا ثم يتفق مع الآب.
  rationale: النص يصرّح بأن كلامه ليس «من عند نفسه» وأن الآب المرسِل أعطاه أمرًا؛ وتحفظ الترجمة هذه العلاقة في الإرسالية من غير إضافة حكم عن طبيعة الابن لا يصرّح به هذا العدد.
- issue: ترجمة πατήρ
  choice: الآب
  alternative: الأب
  rationale: «الآب» هو الاستعمال العربي الواضح للقب الإلهي في هذا السياق، ويميّزه من الإشارة العامة إلى أب بشري.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُعمل «من عند نفسي» للمحافظة على صورة الأصل وغموضه الدلالي النسبي، وحُفظ التوكيد في «هو نفسه» والتمييز بين فعلي القول والتكلّم.
