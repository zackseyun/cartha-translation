  text: He was saying this to signify what kind of death he was about to die[a].
translation:
  language: ar
  text: وكان يقول هذا مبيّنًا أيَّ نوعٍ من الموت كان مزمعًا أن يموت.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بأيّة طريقة كان سيموت». قد يركّز التعبير اليوناني على كيفية الموت.'
    reason: بديل معجمي يحفظ احتمال دلالة صيغة المجرور اليونانية على كيفية الموت أو وسيلته.
lexical_decisions:
- source_word: τοῦτο
  choice: هذا
  rationale: اسم إشارة مفرد محايد يعود إلى قول يسوع السابق، و«هذا» هو المقابل العربي الطبيعي.
- source_word: δὲ
  choice: الواو في «وكان»
  rationale: أداة ربط انتقالية خفيفة لا تفيد هنا تعارضًا قويًا؛ وتؤدي الواو هذا الربط طبيعيًا من غير إضافة ظرف زمني غير موجود في الأصل.
- source_word: ἔλεγεν
  choice: كان يقول
  rationale: صيغة الماضي الناقص تدل على فعل ماضٍ مستمر أو منظور إليه في سياقه، ويحفظ «كان يقول» هذه السمة.
- source_word: σημαίνων
  choice: مشيرًا إلى
  rationale: اسم فاعل يبين الكيفية أو الفعل المصاحب، ومعناه أنه كان يدل بكلامه على الأمر؛ و«مشيرًا إلى» عربية واضحة وتحفظ دلالة الإيحاء غير المباشر.
- source_word: ποίῳ θανάτῳ
  choice: أيّة ميتة
  rationale: التركيب يحدد نوع الموت أو كيفيته، و«أيّة ميتة» يحفظ إيجاز الأصل ويفيد نوع الموت، مع بيان احتمال التركيز على الكيفية في الحاشية.
- source_word: ἤμελλεν
  choice: كان مزمعًا أن
  rationale: يفيد مستقبلًا متوقعًا أو وشيكًا في السياق، و«كان مزمعًا أن» يحفظ المعنى من غير أن يضيف حتمية لاهوتية لا يقتضيها الفعل وحده.
- source_word: ἀποθνῄσκειν
  choice: يموت
  rationale: مصدر مكمّل للفعل ἤμελλεν، ويقابله طبيعيًا بعد «أن» الفعل «يموت».
theological_decisions:
- issue: هل يُصرَّح بأن المقصود هو الصلب؟
  choice: 'الإبقاء على التعبير غير المباشر: «أيّة ميتة كان مزمعًا أن يموت»'
  alternative: «كيف كان سيُصلب» أو «أيّة ميتة على الصليب كان سيموت»
  rationale: يذكر الإنجيلي أن كلام يسوع أشار إلى نوع موته من غير أن يسمّي الصلب في هذه الآية؛ فالتصريح به هنا، وإن دل عليه السياق، يتجاوز صياغة النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «ميتة» للدلالة على نوع الموت، و«مزمعًا» لما فيه من دقة مع بقاء العبارة مفهومة في السياق الكتابي. ظهرت علامة الحاشية [a] في المتن.
