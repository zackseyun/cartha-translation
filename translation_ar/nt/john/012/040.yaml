source:
  edition: SBLGNT
  text: Τετύφλωκεν αὐτῶν τοὺς ὀφθαλμοὺς καὶ ⸀ἐπώρωσεν αὐτῶν τὴν καρδίαν, ἵνα μὴ ἴδωσιν τοῖς ὀφθαλμοῖς καὶ νοήσωσιν τῇ καρδίᾳ καὶ ⸀στραφῶσιν, καὶ ⸀ἰάσομαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/040.yaml
  text: He has blinded their eyes and hardened their heart[a], so that they may not see with their eyes and understand with their heart and turn[c][b], and I would heal them.
translation:
  language: ar
  text: «لقد أعمى عيونهم وقسّى قلبهم، لئلّا يبصروا بعيونهم ويفهموا بقلبهم ويرجعوا[a][c]، فأشفيَهم[b]»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يتحوّلوا». والفعل اليوناني يعني الرجوع أو التحوّل؛ وقد يُترجم تفسيريًا: «يهتدوا».'
    reason: lexical_alternative
  - marker: b
    text: 'الفعل اليوناني بصيغة المستقبل: «وسأشفيهم». وتؤدي «فأشفيَهم» علاقته السياقية بما قبلها في العربية.'
    reason: lexical_alternative
  - marker: c
    text: هذا الكلام مقتبس من إشعياء 6:10.
    reason: cross_reference
lexical_decisions:
- source_word: Τετύφλωκεν
  choice: لقد أعمى
  rationale: ينقل الفعل التام اليوناني فعلًا وقع وبقي أثره قائمًا، مع صياغة عربية طبيعية.
- source_word: ἐπώρωσεν
  choice: قسّى
  rationale: يحفظ معنى جعل القلب قاسيًا أو عديم الحس، ويحافظ على حدة صورة القضاء النبوي.
- source_word: καρδίαν / καρδίᾳ
  choice: قلبهم / بقلبهم
  rationale: يحافظ على صورة «القلب» وعلى المفرد ذي الدلالة الجماعية في النص اليوناني، بدل تفسيره بـ«العقل».
- source_word: ἵνα μὴ
  choice: لئلّا
  rationale: تؤدي معنى الغاية أو النتيجة المنفية بإيجاز عربي واضح، من غير حسم التوتر بينهما.
- source_word: ἴδωσιν τοῖς ὀφθαλμοῖς
  choice: يبصروا بعيونهم
  rationale: يحفظ الصورة الحسية والتوازي مع الفهم بالقلب.
- source_word: νοήσωσιν
  choice: يفهموا
  rationale: ينقل معنى الإدراك والفهم بصياغة عربية مألوفة.
- source_word: στραφῶσιν
  choice: يرجعوا
  rationale: يحفظ المعنى الواسع للرجوع أو التحول من غير إدخال مصطلح عقائدي أضيق مثل «يتحولوا إلى الإيمان».
- source_word: ἰάσομαι
  choice: فأشفيهم
  rationale: تنسجم الصيغة مع تركيب «لئلّا» المتتابع وتبرز أن الشفاء مترتب على الرجوع، مع بيان صيغة المستقبل اليونانية في الحاشية.
theological_decisions:
- issue: الفاعلية الإلهية في الإعماء وتقسية القلب
  choice: 'الإبقاء على الإسناد المباشر: «لقد أعمى... وقسّى...»'
  alternative: صياغة مبنية للمجهول تخفف الإسناد، مثل «عميت عيونهم وقست قلوبهم»
  rationale: الفعلان اليونانيان مسندان إلى فاعل مفرد مفهوم من سياق الاقتباس؛ لذلك لا تُخفَّف حدة القول أو توتره اللاهوتي.
- issue: دلالة στραφῶσιν على الرجوع
  choice: «يرجعوا» في المتن
  alternative: «يهتدوا» أو «يتوبوا»
  rationale: «يرجعوا» أوسع دلالة وأقرب إلى الصورة النبوية، فلا تحصر اللفظ في اصطلاح عقائدي واحد.
- issue: صيغة الشفاء وعلاقتها بتركيب الغاية أو النتيجة
  choice: «فأشفيهم»
  alternative: «وسأشفيهم»
  rationale: الصياغة المختارة طبيعية في العربية داخل تركيب «لئلّا... ويرجعوا، فأشفيهم»، بينما تُذكر صيغة المستقبل الصرفية بوصفها بديلًا حرفيًا في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. حُفظت الصور الملموسة «العيون» و«القلب»، كما حُفظ مفرد «قلبهم» بوصفه جمعيًا، ولم تُلطَّف الفاعلية الإلهية أو تُستبدل بألفاظ مذهبية.
