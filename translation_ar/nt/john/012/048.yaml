base_translation:
  language: en
  yaml_path: translation/nt/john/012/048.yaml
  text: 'The one who rejects me and does not receive my words has one who judges him: the word that I spoke will judge him on the last day[a][b].'
translation:
  language: ar
  text: 'مَنْ يرفضني ولا يقبل أقوالي، فله مَنْ يحكم عليه: الكلام الذي تكلَّمتُ به هو الذي سيحكم عليه في اليوم الأخير[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ولا يتلقّى أقوالي». يمكن أن يدل الفعل اليوناني على التلقّي أو الترحيب أو القبول.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «الرسالة التي تكلَّمتُ بها». يمكن أن تعني الكلمة اليونانية «الكلام» أو «الرسالة» بحسب السياق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀθετῶν
  choice: يرفضني
  rationale: يفيد الفعل هنا رفض شخص يسوع ونبذ ما يعلنه، لا مجرد التجاهل؛ و«يرفضني» تعبير عربي طبيعي يحفظ القوة الشخصية في العبارة.
- source_word: μὴ λαμβάνων τὰ ῥήματά μου
  choice: ولا يقبل أقوالي
  rationale: يحمل λαμβάνω معنى التلقي والقبول، و«يقبل» أوضح في العربية في سياق الاستجابة لكلام معلَّم. و«أقوالي» تحافظ على جمع ῥήματα وعلى دلالته في الكلام المنطوق.
- source_word: ἔχει τὸν κρίνοντα αὐτόν
  choice: فله مَنْ يدينه
  rationale: تحفظ العبارة البناء الإهليلجي الذي يفيد أن الرافض له بالفعل مَن يحكم عليه، وتمهّد لتعيين هذا الحاكم في الجملة التالية. اختير «يدينه» هنا بمعنى يحكم عليه في سياق الدينونة، مع إبقاء النتيجة غير مصرّح بها.
- source_word: ὁ λόγος
  choice: الكلام
  rationale: يمكن أن يدل λόγος على الكلمة أو الكلام أو الرسالة. «الكلام» مفرد جمعي طبيعي في العربية، ويعود إلى ما نطق به يسوع مع الحفاظ على ثقله وعلى تشخيصه البلاغي.
- source_word: ὃν ἐλάλησα
  choice: الذي تكلَّمتُ به
  rationale: صياغة عربية طبيعية تنقل الفعل الماضي ἐλάλησα وتربط الموصول بـ«الكلام» من غير إضافة معنى زائد.
- source_word: ἐκεῖνος
  choice: هو الذي
  rationale: تنقل هذه الصياغة توكيد اسم الإشارة اليوناني وإحالته إلى «الكلام» المذكور مباشرة.
- source_word: κρινεῖ
  choice: سيدينه
  rationale: ينقل فعل الحكم الأخروي في السياق. لا يُفهم منه بالضرورة التصريح المسبق بنتيجة الحكم، بل وقوع الدينونة عليه.
- source_word: ἐν τῇ ἐσχάτῃ ἡμέρᾳ
  choice: في اليوم الأخير
  rationale: تعبير عربي مألوف يحفظ العبارة الأخروية اليوحناوية من غير إدخال تفصيل عقائدي غير مذكور.
theological_decisions:
- issue: طبيعة القائم بالدينونة في الآية
  choice: يُعرض كلام يسوع نفسه بوصفه القائم بالدينونة أو أساسها في اليوم الأخير.
  alternative: اعتبار الكلام مجرد معيار ضمني، مع جعل يسوع وحده القائم المباشر بالدينونة.
  rationale: تقول الصياغة أولًا إن للرافض مَن يدينه، ثم تعيّنه بأنه الكلام الذي تكلم به يسوع. حُفظ هذا التوتر والتشخيص كما هو، من غير مواءمته قسرًا مع نصوص يوحناوية أخرى عن دور الابن في الدينونة.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُخدم «أقوالي» للجمع ῥήματα و«الكلام» للمفرد λόγος لإظهار التمييز اللفظي في الأصل بعبارة عربية طبيعية، مع إبقاء تشخيص الكلام بوصفه الدائن في اليوم الأخير.
