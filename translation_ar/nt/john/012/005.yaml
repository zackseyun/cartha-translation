  text: لماذا لم يُبَعْ هذا الطِّيب بثلاثمئة دينار، ويُعطَ ثمنه للفقراء؟[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: كان الدينار أجرًا يوميًّا معتادًا للعامل؛ وكانت ثلاثمئة دينار تعادل تقريبًا دخل سنة، مع احتساب أيام التوقف عن العمل.
    reason: cultural_note
lexical_decisions:
- source_word: Διὰ τί
  choice: لماذا
  rationale: استفهام سببي مباشر بمعنى «لأي سبب؟»، و«لماذا» هي الصياغة العربية الطبيعية الموجزة.
- source_word: τοῦτο τὸ μύρον
  choice: هذا الطِّيب
  rationale: «الطِّيب» لفظ عربي واضح ومألوف للمادة العطرية الثمينة المستعملة في الدهن، ويحافظ على طبيعة المادة في سياق القرن الأول دون حصرها في العطر الحديث المرشوش.
- source_word: οὐκ ἐπράθη
  choice: لم يُبَعْ
  rationale: يحافظ على المبني للمجهول في صيغة الماضي وعلى قوة السؤال الاعتراضي في اليونانية.
- source_word: τριακοσίων δηναρίων
  choice: بثلاثمئة دينار
  rationale: المضاف إليه في اليونانية يدل على الثمن. أُبقي اسم العملة التاريخية بدل استبداله بقيمة حديثة تقريبية، مع توضيح قوته الشرائية في الحاشية.
- source_word: καὶ ἐδόθη
  choice: ويُعطَ
  rationale: 'يحافظ على المبني للمجهول، والعطف يدل على الغاية العملية التالية للبيع: إعطاء الثمن للفقراء، وهو مفهوم من السياق من غير إضافة تفسيرية إلى المتن.'
- source_word: πτωχοῖς
  choice: للفقراء
  rationale: ترجمة مباشرة وطبيعية لصفة الجمع المستعملة استعمال الاسم، وتحافظ على الفئة الاجتماعية المقصودة.
