lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: وفي اليوم التالي
  rationale: تعبير زمني عربي طبيعي يحفظ تتابع السرد، وأضيفت الواو لربط الآية بسياقها السابق.
- source_word: ὁ ὄχλος πολὺς
  choice: الجمع الكثير
  rationale: ينقل معنى جماعة كبيرة من الناس بعبارة عربية واضحة ومألوفة في الأسلوب الكتابي دون استعمال لفظ مهجور.
- source_word: ὁ ἐλθὼν εἰς τὴν ἑορτήν
  choice: الذي جاء إلى العيد
  rationale: صيغ اسم الفاعل الموصول في اليونانية جملةً موصولة طبيعية، و«جاء» يدل سياقيًا على فعل سابق، أما ἑορτή فتعني العيد أو الاحتفال الديني.
- source_word: ἀκούσαντες
  choice: سمع
  rationale: رغم أن «الجمع» مفرد لفظًا، فالفاعل في اليونانية ينتقل إلى الجمع باعتبار أفراده؛ والعربية تجيز مراعاة لفظ اسم الجمع بالمفرد مع بقاء المعنى الجماعي واضحًا.
- source_word: ὅτι ἔρχεται
  choice: أن يسوع آتٍ
  rationale: يحفظ الحاضر السردي اليوناني ودلالة الاقتراب الجاري، مع صياغة عربية طبيعية لا تحوله صراحةً إلى زمن ماضٍ.
- source_word: ὁ Ἰησοῦς
  choice: يسوع
  rationale: نقل الاسم الشخصي بصيغته العربية الكتابية الشائعة.
- source_word: εἰς Ἱεροσόλυμα
  choice: إلى أورشليم
  rationale: «إلى» هي المقابل الطبيعي لحركة التوجه نحو المدينة، و«أورشليم» الصيغة العربية الكتابية المعروفة للاسم.
