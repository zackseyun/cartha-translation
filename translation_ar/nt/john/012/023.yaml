  text: ὁ δὲ Ἰησοῦς ⸀ἀποκρίνεται αὐτοῖς λέγων· Ἐλήλυθεν ἡ ὥρα ἵνα δοξασθῇ ὁ υἱὸς τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/023.yaml
  text: But Jesus answered them[a], saying[b], “The hour has come for the Son of Man to be glorified.”
translation:
  language: ar
  text: 'فأجابهم يسوع قائلًا: «قد أتت الساعة[a] ليتمجّد ابن الإنسان[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «حان الوقت». يقول اليوناني حرفيًا «الساعة»، وهي كلمة تتكرر في إنجيل يوحنا للدلالة على الموعد المعيّن لآلام يسوع ومجده.
    reason: lexical_alternative
  - marker: b
    text: أو «الإنسان». واللقب اليوناني «ابن الإنسان» يردّد صدى دانيال 7، وقد أُبقي هنا لما له من قوة لاهوتية وترابط مع ذلك النص.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκρίνεται
  choice: فأجاب
  rationale: المضارع التاريخي اليوناني يُنقل طبيعيًا في السرد العربي بالماضي، و«أجاب» هو المقابل المباشر الملائم للسياق.
- source_word: αὐτοῖς
  choice: هم
  rationale: أُدمج ضمير المفعول في الفعل «فأجابهم»، وهو الأسلوب العربي الطبيعي.
- source_word: λέγων
  choice: قائلًا
  rationale: يحافظ على بنية اسم الفاعل الذي يقدّم الكلام المباشر من غير تكلّف.
- source_word: Ἐλήλυθεν
  choice: قد أتت
  rationale: «قد» مع الماضي تنقل وصول الساعة وتحقّق حضورها، بما يقارب دلالة التام اليوناني على حالة حاضرة نتجت عن المجيء.
- source_word: ὥρα
  choice: الساعة
  rationale: تحفظ اللفظ اليوحناوي المتكرر ودلالته على الموعد الحاسم المعيّن ليسوع، بدل تسطيحه إلى «الوقت».
- source_word: ἵνα
  choice: لِـ
  rationale: لام التعليل مع المضارع المنصوب تعبّر بإيجاز طبيعي عن الغاية أو المضمون المرتبطين بمجيء الساعة.
- source_word: δοξασθῇ
  choice: يتمجّد
  rationale: صيغة عربية طبيعية تؤدي المبني للمجهول الدال على نيل المجد، وتحفظ الثقل اللاهوتي للفعل في يوحنا.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ابن الإنسان
  rationale: اللقب العربي الراسخ يحفظ صلته بدانيال 7 وقوته المسيحانية والأخروية، بدل تحويله إلى وصف عام للإنسان.
theological_decisions:
- issue: ترجمة اللقب ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ابن الإنسان
  alternative: الإنسان
  rationale: العبارة لقب مسيحاني ذو صدى دانيالي ويوحناوي، لا مجرد إشارة عامة إلى البشرية؛ لذلك حُفظ اللقب التقليدي من غير تفسير زائد.
- issue: دلالة Ἐλήλυθεν ἡ ὥρα من جهة الزمن والموضوع اليوحناوي
  choice: قد أتت الساعة
  alternative: حان الوقت
  rationale: تحفظ «الساعة» الموضوع اليوحناوي المتكرر، وتحافظ «قد أتت» على معنى الوصول الذي تم وأصبحت نتيجته حاضرة، من غير حصر التمجيد في جانب واحد من الألم أو القيامة أو الرفعة.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقّرة. استُخدمت الفاء لربط الجواب بالسياق السابق، ووُضعت علامتا الحاشيتين عند اللفظين اللذين تشرحانهما مباشرة.
