  yaml_path: translation/nt/john/012/011.yaml
  text: because many of the Jews were going away because of him and were believing in Jesus[a][b][c][d].
translation:
  language: ar
  text: لِأَنَّ كَثِيرِينَ مِنَ الْيَهُودِ[a] كَانُوا يُغَادِرُونَ[b] بِسَبَبِهِ[d] وَيُؤْمِنُونَ بِيَسُوعَ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مِنَ اليهوديّين»، أي من أهل اليهودية. وقد يدل لفظ «اليهود» في إنجيل يوحنا، بحسب السياق، على أهل اليهودية أو على السلطات اليهودية.'
    reason: alternative_reading
  - marker: b
    text: 'أو: «يبتعدون» أو «ينصرفون». يدل الفعل اليوناني على حركة مستمرة أو متكررة للمغادرة أو الابتعاد، ويرجَّح في السياق أنهم كانوا يبتعدون عن موقف معارضي يسوع أو نفوذهم.'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «يضعون ثقتهم في يسوع» أو «يثقون بيسوع».'
    reason: lexical_alternative
  - marker: d
    text: الضمير في «بسببه» يعود في السياق إلى لعازر.
    reason: referent_clarification
lexical_decisions:
- source_word: ὅτι
  choice: لِأَنَّ
  rationale: تُبقي الأداة على معناها السببي، إذ تشرح سبب سعي رؤساء الكهنة إلى قتل لعازر في الآية السابقة.
- source_word: πολλοὶ ... τῶν Ἰουδαίων
  choice: كَثِيرِينَ مِنَ الْيَهُودِ
  rationale: تنقل علاقة الجزء بالكل في اليونانية بوضوح، وتشير إلى كثيرين من الجماعة لا إلى اليهود جميعًا.
- source_word: δι’ αὐτὸν
  choice: بِسَبَبِهِ
  rationale: تفيد διά مع النصب السببية هنا؛ والضمير يعود في السياق إلى لعازر، من غير إدخال اسمه في النص.
- source_word: ὑπῆγον
  choice: كَانُوا يَنْصَرِفُونَ
  rationale: صيغة الماضي الناقص تدل على فعل مستمر أو متكرر. و«ينصرفون» تحفظ معنى الابتعاد أو المغادرة من غير حصره في حركة مكانية أو ارتداد رسمي.
- source_word: ἐπίστευον εἰς τὸν Ἰησοῦν
  choice: يُؤْمِنُونَ بِيَسُوعَ
  rationale: تنقل الصيغة المستمرة واتجاه الإيمان نحو يسوع، من غير توسيعها إلى نتائج عقائدية لا تصرح بها الآية.
theological_decisions:
- issue: مدلول Ἰουδαίων في سياق إنجيل يوحنا
  choice: اليهود
  alternative: اليهوديون، أي أهل اليهودية؛ أو السلطات اليهودية في مواضع أخرى
  rationale: العبارة هنا تتحدث عن «كثيرين من» جماعة أوسع، فلا تُفهم إدانةً عامة لجميع اليهود. أبقى النص اللفظ الأوسع، مع إثبات الاحتمال الجغرافي في الحاشية.
- issue: قوة التعبير πιστεύω εἰς
  choice: يؤمنون بيسوع
  alternative: يضعون ثقتهم في يسوع؛ يثقون بيسوع
  rationale: يحفظ النص فعل الإيمان الموجَّه إلى يسوع، من غير استبداله بتعبير عقائدي أقوى مثل «صاروا تلاميذ» أو «نالوا الخلاص».
- issue: مرجع الضمير في δι’ αὐτόν
  choice: الإبقاء على الضمير «بسببه»
  alternative: بسبب لعازر
  rationale: السياق يجعل لعازر المرجع الأرجح، لكن إبقاء الضمير يطابق صياغة الأصل ولا يزيل الإحالة النصية.
translation_notes:
  register: صياغة عربية فصحى معاصرة وواضحة، ذات نبرة كتابية رصينة. استُعمل «كانوا ينصرفون ويؤمنون» لإظهار الاستمرار في الفعلين، ووُضع «بسببه» بينهما وفق ترتيب طبيعي مع إبقاء العلاقة السببية واضحة.
