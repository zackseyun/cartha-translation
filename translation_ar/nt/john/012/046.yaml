  terminology: «نورًا»، «العالم»، «يؤمن بي»، و«الظلمة» اختيارات عربية حديثة وطبيعية وتحافظ على المصطلحات والصور اليوحناوية. ولا يلزم وضع حاشية عربية هنا؛ فالبديل الإنجليزي «a light» لا يقتضي بديلًا ذا فرق دلالي لازم في العربية، إذ تؤدي «نورًا» بالفعل المعنى غير المعرّف/الوصفي.
