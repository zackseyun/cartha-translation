  text: ἐγὼ φῶς εἰς τὸν κόσμον ἐλήλυθα, ἵνα πᾶς ὁ πιστεύων εἰς ἐμὲ ἐν τῇ σκοτίᾳ μὴ μείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/046.yaml
  text: I have come into the world as light[b][a], so that everyone who believes in me may not remain in the darkness.
translation:
  language: ar
  text: أنا قد جئتُ إلى العالم نورًا، لكي لا يبقى كلُّ مَن يؤمن بي في الظلمة.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φῶς
  choice: نورًا
  rationale: يحفظ استعارة النور المحورية في إنجيل يوحنا، ويؤدي الاسم اليوناني غير المعرَّف بصياغة عربية طبيعية تفيد هوية يسوع ووظيفته من غير إضافة تفسيرية.
- source_word: εἰς τὸν κόσμον
  choice: إلى العالم
  rationale: ينقل اتجاه المجيء إلى نطاق العالم، وهو الاستعمال العربي الطبيعي الموافق لدلالة εἰς مع المفعول به.
- source_word: ἐλήλυθα
  choice: قد جئتُ
  rationale: تساعد «قد» مع الماضي على إبراز وقوع المجيء وأثره القائم، بما يقارب دلالة صيغة التام اليونانية.
- source_word: ἵνα
  choice: لكي
  rationale: تؤدي معنى الغاية بوضوح ومن دون تحويله إلى مجرد نتيجة.
- source_word: πᾶς ὁ πιστεύων
  choice: كلُّ مَن يؤمن
  rationale: تعبير عربي جامع وطبيعي يدل على كل فرد يتصف بالإيمان، ويحفظ العموم من غير إدخال قضايا لاهوتية لا يحسمها النص.
- source_word: πιστεύων εἰς ἐμέ
  choice: يؤمن بي
  rationale: هو المقابل العربي المألوف للإيمان الموجَّه إلى شخص، ويحفظ الصياغة اليوحناوية من غير توسيعها إلى شرح.
- source_word: ἐν τῇ σκοτίᾳ
  choice: في الظلمة
  rationale: التعريف في «الظلمة» يحفظ صورتها بوصفها المجال الروحي والأخلاقي المعروف في سياق يوحنا.
- source_word: μὴ μείνῃ
  choice: لا يبقى
  rationale: ينقل النفي مع فعل البقاء داخل جملة الغاية بصياغة عربية واضحة ومباشرة.
theological_decisions:
- issue: تعريف المسيح بنفسه في صورة النور
  choice: «جئتُ إلى العالم نورًا»
  alternative: «جئتُ إلى العالم بوصفي نورًا» أو «جئتُ لأنير العالم»
  rationale: الصياغة المختارة تحفظ الاستعارة نفسها وتعرض يسوع نورًا آتيًا إلى العالم، من غير تحويل الصورة إلى شرح لوظيفته أو إضافة مضمون عقائدي.
- issue: مدى عبارة πᾶς ὁ πιστεύων
  choice: «كلُّ مَن يؤمن بي»
  alternative: «أيُّ شخص يؤمن بي» أو «مَن يؤمن بي، أيًّا كان»
  rationale: تحفظ العبارة شمول فئة المؤمنين كما يقررها النص، من غير حسم نقاشات لاهوتية أوسع بشأن كيفية الإيمان أو الاختيار.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. أُبقي الضمير «أنا» لإظهار التوكيد الموجود في ἐγώ، وقُدِّم شبه الجملة «في الظلمة» بعد فعل البقاء لتوضيح أن النفي واقع على بقاء كل مؤمن فيها.
