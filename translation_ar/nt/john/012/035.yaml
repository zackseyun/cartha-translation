id: JHN.12.35
reference: John 12:35
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτοῖς ὁ Ἰησοῦς· Ἔτι μικρὸν χρόνον τὸ φῶς ⸂ἐν ὑμῖν⸃ ἐστιν. περιπατεῖτε ⸀ὡς τὸ φῶς ἔχετε, ἵνα μὴ σκοτία ὑμᾶς καταλάβῃ, καὶ ὁ περιπατῶν ἐν τῇ σκοτίᾳ οὐκ οἶδεν ποῦ ὑπάγει.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/035.yaml
  text: So Jesus said to them[a], “The light is still among you for a little while. Walk while you have the light, so that darkness may not overtake you. The one who walks in the darkness does not know where he is going.”
translation:
  language: ar
  text: 'فقال لهم يسوع: «لا يزال النور بينكم[a] وقتًا قصيرًا. سيروا ما دام النور معكم، لئلا يدرككم الظلام. ومن يسير في الظلام لا يعرف إلى أين يذهب».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «فيكم» أو «معكم». تحتمل العبارة اليونانية أكثر من معنى، لكن «بينكم» أنسب للسياق المباشر الذي يتحدث عن حضور يسوع العلني في وسطهم.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: فـ
  rationale: أداة ربط طبيعية تصل جواب يسوع بالحوار السابق من غير المبالغة في الدلالة الاستنتاجية.
- source_word: Ἔτι μικρὸν χρόνον
  choice: زمنًا قليلًا بعد
  rationale: ينقل معنى الاستمرار المحدود زمنيًا في عبارة عربية واضحة وموجزة.
- source_word: τὸ φῶς
  choice: النور
  rationale: يحافظ على صورة النور كما هي وعلى ثقلها المجازي والمسيحاني في سياق يوحنا من غير تفسير داخل المتن.
- source_word: ἐν ὑμῖν
  choice: بينكم
  rationale: يلائم السياق المباشر الذي يتحدث فيه يسوع عن بقاء حضوره العلني بينهم مدة قصيرة، مع حفظ الاحتمالات الأخرى في الحاشية.
- source_word: περιπατεῖτε
  choice: سيروا
  rationale: يحافظ على استعارة السير، وهي مفهومة عربيًا ويمكن أن تشمل السلوك والحركة في السياق.
- source_word: ὡς τὸ φῶς ἔχετε
  choice: ما دام النور معكم
  rationale: يفهم ὡς هنا فهمًا زمنيًا، ويعبّر طبيعيًا عن الإلحاح المرتبط بمحدودية مدة وجود النور.
- source_word: ἵνα μὴ
  choice: لئلا
  rationale: صياغة عربية موجزة وواضحة تؤدي غرض النفي المقصود.
- source_word: σκοτία
  choice: الظلام
  rationale: يحفظ التقابل اليوحناوي المباشر بين النور والظلام.
- source_word: καταλάβῃ
  choice: يدرككم
  rationale: ينقل صورة الظلام الذي يلحق بالإنسان ويفاجئه؛ كما يبقي قدرًا من الاتساع الدلالي بين اللحاق والإمساك.
- source_word: ὁ περιπατῶν
  choice: من يسير
  rationale: صياغة عربية عامة وطبيعية للمشارك الاسمي، من غير حصر المعنى في شخص بعينه.
- source_word: ἐν τῇ σκοτίᾳ
  choice: في الظلام
  rationale: يحافظ على الصورة المحددة المقابلة للنور.
- source_word: οὐκ οἶδεν ποῦ ὑπάγει
  choice: لا يعرف إلى أين يذهب
  rationale: ترجمة عربية مباشرة وطبيعية تحفظ دلالة الجهل بالوجهة.
theological_decisions:
- issue: دلالة ἐν ὑμῖν في وصف وجود النور
  choice: بينكم
  alternative: فيكم أو معكم
  rationale: السياق السردي يرجّح حضور يسوع العلني وسط مخاطبيه بوصفه النور، من غير إدخال مفهوم السكنى الباطنية في المتن. ولأن العبارة اليونانية تحتمل أيضًا معنى «فيكم» أو «معكم»، حُفظ هذا التوتر في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظت استعارتا النور والظلام والسير، واستُعملت «سيروا» بدل تفسيرها مباشرة بمعنى «اسلكوا» أو «عيشوا»، لتجنب تسطيح الصورة الأصلية.
