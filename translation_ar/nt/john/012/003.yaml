source:
  edition: SBLGNT
  text: ἡ οὖν ⸀Μαριὰμ λαβοῦσα λίτραν μύρου νάρδου πιστικῆς πολυτίμου ἤλειψεν τοὺς πόδας τοῦ Ἰησοῦ καὶ ἐξέμαξεν ταῖς θριξὶν αὐτῆς τοὺς πόδας αὐτοῦ· ἡ δὲ οἰκία ἐπληρώθη ἐκ τῆς ὀσμῆς τοῦ μύρου.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/003.yaml
  text: Then Mary took a litra of costly pure nard perfume[a], anointed Jesus's feet, and wiped his feet with her hair[c][b]. And the house was filled with the fragrance of the perfume.
translation:
  language: ar
  text: فأخذت مريم ليترا[a] من طيب النارد[c] الخالص[b] الغالي الثمن، ودهنت به قدمي يسوع، ثم مسحت قدميه بشعرها. فامتلأ البيت برائحة الطيب.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: الليترا وحدة وزن رومانية، تساوي نحو اثنتي عشرة أوقية، أي قرابة ثلث كيلوغرام.
    reason: cultural_note
  - marker: b
    text: 'أو: «الأصيل». معنى الصفة اليونانية πιστικῆς موضع خلاف معجمي.'
    reason: lexical_alternative
  - marker: c
    text: النارد مادة عطرية نفيسة، ويُسمّى أيضًا «سنبل الطيب».
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: فـ
  rationale: تفيد الانتقال والارتباط بما سبق في سياق السرد، من غير تحميلها معنى استنتاجيًا أقوى مما يقتضيه المقام.
- source_word: λαβοῦσα
  choice: أخذت
  rationale: حُوِّل اسم الفاعل اليوناني السابق للفعل الرئيس إلى فعل ماضٍ عربي طبيعي يحافظ على تتابع الأحداث.
- source_word: λίτραν
  choice: ليترا
  rationale: نُقلت تسمية وحدة الوزن الرومانية القديمة صوتيًا للمحافظة على خصوصية النص، مع بيان مقدارها التقريبي في الحاشية.
- source_word: μύρου
  choice: طيب
  rationale: يدل اللفظ هنا على مادة عطرية زيتية تُستعمل للدهن؛ و«طيب» لفظ عربي واضح وملائم، كما ينسجم مع ذكر الرائحة في ختام الآية.
- source_word: νάρδου
  choice: النارد
  rationale: حُفظ اسم المادة العطرية الوارد في الأصل بدل استبداله باسم عام.
- source_word: πιστικῆς
  choice: الخالص
  rationale: هذا معنى مرجح في السياق، مع إبقاء الخلاف المعجمي ظاهرًا في الحاشية وعدم حسمه بصمت.
- source_word: πολυτίμου
  choice: غالي الثمن
  rationale: ينقل بوضوح قيمة الطيب المالية العالية بلغة عربية معاصرة طبيعية.
- source_word: ἤλειψεν
  choice: دهنت به
  rationale: يصف الفعل تطبيق الطيب على الجسد، وهذه الصياغة تحافظ على الفعل المادي من غير فرض دلالة طقسية أو لاهوتية بعينها.
- source_word: ἐξέμαξεν
  choice: مسحت
  rationale: ينقل معنى المسح أو التجفيف، مع بيان الشعر بوصفه أداة الفعل.
- source_word: ταῖς θριξὶν αὐτῆς
  choice: بشعرها
  rationale: ترجمة عربية طبيعية للمجرور الدال على الأداة.
- source_word: ἐπληρώθη
  choice: امتلأ
  rationale: يحافظ على صورة انتشار الرائحة حتى ملأت البيت، بصياغة عربية سليمة.
- source_word: ὀσμῆς τοῦ μύρου
  choice: برائحة الطيب
  rationale: يحافظ على التكرار المعجمي بين الطيب في أول الآية ورائحته في آخرها.
theological_decisions:
- issue: احتمال تحميل فعل ἤλειψεν دلالة لاهوتية زائدة
  choice: دهنت به قدمي يسوع
  alternative: 'مسحت قدمي يسوع بالطيب؛ أو: مسحتهما بالطيب'
  rationale: ينص السياق على وضع الطيب على قدمي يسوع، لكنه لا يحدد هنا وحده طبيعة رمزية أو طقسية بعينها؛ لذلك اختير تعبير يحفظ الحدث ويترك دلالته الأوسع مفتوحة.
translation_notes:
  register: فصحى معاصرة واضحة ذات نبرة وقورة. استُعمل «طيب» بدل تعبير تقني ثقيل، وحُفظت «ليترا» و«النارد» مع إيضاحهما في الحواشي. وُضعت جميع علامات الحواشي في المتن عند الألفاظ التي تشرحها.
