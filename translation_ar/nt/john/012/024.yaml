base_translation:
  language: en
  yaml_path: translation/nt/john/012/024.yaml
  text: Truly[a], truly, I say to you, unless the grain of wheat falls into the ground and dies, it remains by itself; but if it dies[b], it bears much fruit.
translation:
  language: ar
  text: 'الحقَّ الحقَّ أقول لكم: إن لم تقع حبّة الحنطة في الأرض وتَمُتْ، تبقى هي وحدها[a]؛ ولكن إن ماتت[b]، تُنتج ثمرًا كثيرًا.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «تبقى بمفردها».'
    reason: lexical_alternative
  - marker: b
    text: تشير الصورة إلى حبّة لا تصير مثمرة إلا إذا ماتت في الأرض؛ وفي السياق يطبّق يسوع هذا النمط على موته وعلى الذين يتبعونه.
    reason: cross_reference
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: الحقَّ الحقَّ
  rationale: 'صيغة توكيد احتفالية متكررة تميّز كلام يسوع في يوحنا. يحفظ هذا التعبير التكرار وقوة التوكيد بلغة عربية كتابية واضحة، بدل إبقائها منقولة صوتيًا: «آمين آمين».'
- source_word: λέγω ὑμῖν
  choice: أقول لكم
  rationale: ترجمة مباشرة تحفظ صيغة الخطاب الموجّه إلى الجمع والأسلوب اليوحناوي.
- source_word: ἐὰν μὴ
  choice: إن لم
  rationale: تنقل تركيب الشرط المنفي بوضوح وطبيعية، من غير زيادة تفسيرية.
- source_word: ὁ κόκκος τοῦ σίτου
  choice: حبّة الحنطة
  rationale: κόκκος حبّة أو بذرة، وσίτος هنا الحنطة في الصورة الزراعية. «حبّة الحنطة» تعبير عربي طبيعي ودقيق.
- source_word: πεσὼν εἰς τὴν γῆν
  choice: تقع ... في الأرض
  rationale: صيغ اسم الفاعل اليوناني فعلًا عربيًا ضمن الشرط، مع حفظ معنى الدخول في التربة الزراعية لا مجرد السقوط على سطحها.
- source_word: ἀποθάνῃ
  choice: تمت / ماتت
  rationale: يحفظ فعل الموت الصريح في شطري المقابلة، ولا يستبدله بتفسير نباتي مثل «تتحلل».
- source_word: αὐτὸς μόνος μένει
  choice: تبقى هي وحدها
  rationale: الضمير «هي» ينقل القوة التوكيدية في αὐτός، و«وحدها» تنقل μόνος وتحافظ على معنى بقاء الحبة منفردة بلا إقحام معنى وجداني.
- source_word: ἐὰν δὲ ἀποθάνῃ
  choice: ولكن إن ماتت
  rationale: «ولكن» تبرز المقابلة التي تؤديها δέ بين النتيجتين.
- source_word: πολὺν καρπὸν φέρει
  choice: تُنتج ثمرًا كثيرًا
  rationale: ينقل التعبير الاصطلاحي معنى الإثمار بعبارة عربية طبيعية، مع إبقاء صورة «الثمر» وعدم توسيعها إلى «حصاد».
theological_decisions:
- issue: الصورة الزراعية ودلالتها الضمنية على موت يسوع واتباعه
  choice: إبقاء الصورة الزراعية كما وردت في المتن من غير التصريح بتطبيقها اللاهوتي
  alternative: توسيع العبارة لتذكر صراحة أن يسوع يشير إلى موته وما ينشأ عنه من حياة أو ثمر
  rationale: السياق يربط الصورة بموت يسوع، والآيات التالية توسعها إلى التلمذة، لكن هذه الآية نفسها تعرض الصورة ولا تفك جميع دلالاتها. لذلك حُفظ التوتر والاستعارة، ووُضع الإيضاح السياقي في الحاشية فقط.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة وقورة. حُفظ التكرار في «الحق الحق» والتوازي الشرطي والمقابلة بين بقاء الحبة وحدها وإنتاج الثمر. نُقلت علامة الحاشية [a] إلى موضع العبارة التي تشرحها، لأن مضمونها بديل لـ«تبقى هي وحدها» لا لعبارة الافتتاح.
