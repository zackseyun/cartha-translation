  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: εὑρὼν δὲ ὁ Ἰησοῦς ὀνάριον ἐκάθισεν ἐπ’ αὐτό, καθώς ἐστιν γεγραμμένον·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/014.yaml
  text: 'Then Jesus[a], having found a young donkey, sat on it, just as it is written:'
translation:
  language: ar
  text: 'ثم وجد يسوع جحشًا[a]، فجلس عليه، كما هو مكتوب:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «حمارًا صغيرًا». اللفظة اليونانية ὀνάριον تدل على حمار، وغالبًا ما يكون صغير السن.
    reason: بديل معجمي يحفظ المدى الدلالي للفظ اليوناني.
lexical_decisions:
- source_word: εὑρὼν
  choice: وجد
  rationale: اسم فاعل ماضٍ يدل على فعل سبق الفعل الرئيس. وصياغة «ثم وجد... فجلس» تنقل هذا التعاقب بوضوح وطبيعية في العربية.
- source_word: δὲ
  choice: ثم
  rationale: أداة ربط خفيفة تدفع السرد إلى الأمام هنا، ولا تستلزم معنى الاستدراك.
- source_word: ὀνάριον
  choice: جحشًا
  rationale: يدل اللفظ على حمار، وغالبًا حمار صغير؛ و«جحش» لفظ عربي واضح وموجز لصغير الحمار، مع إثبات البديل الأعم في الحاشية حفظًا للمدى الدلالي.
- source_word: ἐκάθισεν ἐπ’ αὐτό
  choice: فجلس عليه
  rationale: ينقل التعبير اليوناني المباشر كما هو، من غير استبداله بتعبير تفسيري مثل «امتطاه».
- source_word: καθώς ἐστιν γεγραμμένον
  choice: كما هو مكتوب
  rationale: صيغة عربية مألوفة لإدخال الاقتباس الكتابي، وتحفظ معنى المطابقة في καθώς ودلالة الحالة القائمة في صيغة «مكتوب».
- source_word: ὁ Ἰησοῦς
  choice: يسوع
  rationale: يُذكر الاسم العلم في العربية بلا أداة تعريف، وفق الاستعمال الطبيعي.
theological_decisions:
- issue: علاقة فعل يسوع بالنص الكتابي المقتبس
  choice: عرض فعل يسوع ثم إدخال الاقتباس بعبارة «كما هو مكتوب»، من غير التصريح بدافعه.
  alternative: صياغة أكثر تفسيرًا توحي بأنه تعمد تمثيل النبوءة لإتمامها.
  rationale: تثبت الآية المطابقة بين الحدث والمكتوب، لكنها لا تصرح هنا بدافع يسوع؛ لذلك تحافظ الصياغة على هذا القدر من التحديد ولا تتجاوزه.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُخدم «فجلس» لإظهار تعاقب العثور والجلوس بسلاسة، مع تجنب ألفاظ أكثر تفسيرًا مثل «امتطى».
