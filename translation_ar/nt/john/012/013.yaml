  text: ἔλαβον τὰ βαΐα τῶν φοινίκων καὶ ἐξῆλθον εἰς ὑπάντησιν αὐτῷ, καὶ ⸀ἐκραύγαζον· Ὡσαννά, εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου, ⸂καὶ ὁ⸃ βασιλεὺς τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/013.yaml
  text: They took the palm branches and went out to meet him[a], and they were crying out, “Hosanna! Blessed is the one who comes in the name of the Lord[c][b], even the King of Israel!”
translation:
  language: ar
  text: 'فأخذوا سعف النخل وخرجوا للقائه، وكانوا يهتفون: «أوصنا!»[a] «مبارك الآتي باسم الرب! وملك إسرائيل!»[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «أوصنا» هتاف ذو أصل عبري معناه «خلِّص الآن» أو «نرجوك أن تخلِّص»، وقد صار أيضًا هتاف تسبيح.
    reason: lexical_alternative
  - marker: b
    text: يرد هذا الهتاف صدى لمزمور 118:26.
    reason: cross_reference
lexical_decisions:
- source_word: βαΐα τῶν φοινίκων
  choice: سعف النخل
  rationale: تعبير عربي طبيعي ودقيق يدل على أغصان النخل وورقه، ويحافظ على صورة المشهد من غير إطالة حرفية.
- source_word: ἐξῆλθον εἰς ὑπάντησιν αὐτῷ
  choice: خرجوا للقائه
  rationale: ينقل مباشرة معنى الخروج لمقابلة شخص، من غير إضافة معنى الترحيب غير المصرح به.
- source_word: ἐκραύγαζον
  choice: كانوا يهتفون
  rationale: صيغة «كانوا» تحفظ دلالة الاستمرار أو التكرار في الفعل الناقص، و«يهتفون» تلائم هتاف جمهور في هذا السياق.
- source_word: Ὡσαννά
  choice: أوصنّا
  rationale: نقل صوتي عربي شائع للهتاف ذي الأصل العبري؛ ويُشرح معناه ووظيفته في الحاشية.
- source_word: εὐλογημένος ὁ ἐρχόμενος
  choice: مبارك الآتي
  rationale: صياغة عربية واضحة وموجزة تحفظ اسم الفاعل المعرّف وصدى المزمور.
- source_word: ἐν ὀνόματι κυρίου
  choice: باسم الرب
  rationale: التعبير العربي الكتابي الطبيعي المقابل للعبارة اليونانية، مع إبقاء «الرب» وفق لفظ κύριος في النص اليوناني.
- source_word: καὶ ὁ βασιλεὺς τοῦ Ἰσραήλ
  choice: وملك إسرائيل
  rationale: يحافظ على καί بصورتها المباشرة «و»، وعلى اللقب الملكي من غير تفسير زائد؛ وتُذكر إمكانية فهمها توكيدًا أو عطف بيان في الحاشية.
theological_decisions:
- issue: ترجمة κύριος في الاقتباس ذي الصلة بمزمور 118:26
  choice: الرب
  alternative: الرَّبّ بحروف أو تنسيق يدل صراحة على اسم يهوه
  rationale: النص اليوناني يقرأ κυρίου؛ لذا تُترجم «الرب» من غير إدخال تمييز طباعي مستمد مباشرة من النص العبري، مع الحفاظ على صدى المزمور.
- issue: العلاقة النحوية بين «الآتي باسم الرب» و«ملك إسرائيل»
  choice: وملك إسرائيل
  alternative: أي ملك إسرائيل / بل ملك إسرائيل
  rationale: تحتمل καί العطف المباشر أو الاستعمال التوكيدي/البياني. أبقينا «و» في المتن لأنها الأقرب إلى اليونانية وتحفظ الاحتمالين، وبيّنا البديل في الحاشية.
- issue: القوة الملكية والمسيانية للهتاف
  choice: إبقاء لقب «ملك إسرائيل» كما هو
  alternative: ملكُنا، ملك إسرائيل / المسيح ملك إسرائيل
  rationale: اللقب الملكي صريح في النص، لكن إضافة ضمير أو لقب «المسيح» تتجاوز عبارته.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «سعف النخل» لتعبير عربي مألوف، و«كانوا يهتفون» لحفظ استمرارية الفعل. وُضعت جميع علامات الحواشي في المتن بمحاذاة العبارات التي تشرحها.
