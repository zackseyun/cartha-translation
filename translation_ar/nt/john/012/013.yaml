  terminology: «الرب» مناسبة لـ κυρίου في صدى المزمور، و«ملك إسرائيل» يحفظ اللقب الملكي دون إضافة تفسير مسياني. لا حاجة إلى حاشية بديلة للواو ما دام المتن اختار المقابل المباشر «و».
