id: JHN.12.38
reference: John 12:38
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἵνα ὁ λόγος Ἠσαΐου τοῦ προφήτου πληρωθῇ ὃν εἶπεν· Κύριε, τίς ἐπίστευσεν τῇ ἀκοῇ ἡμῶν; καὶ ὁ βραχίων κυρίου τίνι ἀπεκαλύφθη;
base_translation:
  language: en
  yaml_path: translation/nt/john/012/038.yaml
  text: 'so that the word of Isaiah the prophet might be fulfilled[a], which he said: “Lord, who has believed our report? And to whom has the arm of the Lord been revealed?”'
translation:
  language: ar
  text: 'لكي تتم كلمة إشعياء النبي التي قالها: «يا رب، من صدّق خبرنا[a]؟ ولمن أُعلنت ذراع الرب؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «ما سمعناه» أو «رسالتنا».
    reason: بدائل معجمية حقيقية للكلمة اليونانية ἀκοή، التي قد تشير إلى السماع أو إلى مضمون الخبر المسموع والمبلّغ.
lexical_decisions:
- source_word: ἵνα
  choice: لكي
  rationale: تحافظ على صيغة الغاية/النتيجة في اليونانية من غير أن تحسم ما إذا كان التركيز على القصد أم على النتيجة.
- source_word: ὁ λόγος Ἠσαΐου τοῦ προφήτου
  choice: كلمة إشعياء النبي
  rationale: ترجمة مباشرة وطبيعية لصيغة الاستشهاد، مع إبقاء «كلمة» للدلالة على القول النبوي.
- source_word: πληρωθῇ
  choice: تتم
  rationale: تنقل صيغة المبني للمجهول في سياق إتمام النبوة بأسلوب عربي مألوف، إذ يُفهم أن الكلمة هي التي بلغت تمامها.
- source_word: Κύριε
  choice: يا رب
  rationale: صيغة نداء عربية واضحة تقابل المنادى اليوناني.
- source_word: ἐπίστευσεν τῇ ἀκοῇ ἡμῶν
  choice: صدّق خبرنا
  rationale: الفعل «صدّق» يتعدى إلى مضمون البلاغ بصورة طبيعية، و«خبرنا» يحفظ معنى ما أُبلغ أو أُعلن مع إثبات البدائل الممكنة في الحاشية.
- source_word: ὁ βραχίων κυρίου
  choice: ذراع الرب
  rationale: يحافظ على الاستعارة الكتابية الدالة على قدرة الرب وعمله، من غير تفسيرها داخل النص.
- source_word: ἀπεκαλύφθη
  choice: أُعلنت
  rationale: تحفظ المبني للمجهول ومعنى الكشف أو الإظهار، وتلائم في العربية إظهار «ذراع الرب» وعمله.
theological_decisions:
- issue: دلالة ἵνα بين الغاية والنتيجة في إتمام النبوة
  choice: لكي تتم
  alternative: فتمت بذلك؛ حتى تتم
  rationale: الصياغة المختارة تبقي توتر العبارة اليونانية بين القصد والنتيجة ولا تضيف تفسيرًا حتميًا يتجاوز النص.
- issue: معنى ἀκοή في اقتباس إشعياء
  choice: خبرنا
  alternative: ما سمعناه؛ رسالتنا
  rationale: يمكن أن تدل الكلمة على السماع أو على مضمون ما يُسمع ويُبلّغ. «خبرنا» أنسب للسؤال البلاغي في العربية، مع حفظ الاحتمالات الأخرى في الحاشية.
- issue: استعارة ذراع الرب
  choice: ذراع الرب
  alternative: قدرة الرب؛ عمل الرب القدير
  rationale: أُبقيت الصورة الكتابية نفسها بدل استبدالها بتفسير لاهوتي مباشر.
translation_notes:
  register: عربية فصحى معاصرة واضحة وذات نبرة كتابية رصينة. استُخدم «صدّق خبرنا» لسلامته وطبيعته، وأُبقيت استعارة «ذراع الرب» كما هي. وُضع رمز الحاشية بعد اللفظ الذي تتعلق به مباشرة.
