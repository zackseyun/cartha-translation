  yaml_path: translation/nt/john/012/008.yaml
  text: For you always have the poor with you[a], but you do not always have me.
translation:
  language: ar
  text: لأن الفقراء معكم دائمًا، أما أنا فلست معكم دائمًا.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πτωχούς
  choice: الفقراء
  rationale: الصفة اليونانية مستعملة استعمال الاسم وتشير إلى الفقراء بوصفهم فئة عامة؛ و«الفقراء» تعبير عربي طبيعي وموجز.
- source_word: γάρ
  choice: فَـ
  rationale: تفيد الأداة هنا التعليل لما سبق، والفاء تحافظ على الصلة التفسيرية بصورة طبيعية في العربية.
- source_word: πάντοτε
  choice: دائمًا
  rationale: تدل على الحضور أو الإتاحة المستمرة في هذا السياق، وقد روعي تكرار اللفظ نفسه في الجملتين.
- source_word: ἔχετε ... μεθ’ ἑαυτῶν
  choice: معكم
  rationale: المقصود وجود الشخص في صحبتهم أو بينهم، لا الملكية؛ لذا تؤدي «معكم» المعنى العربي الطبيعي، مع صياغة الجملة الاسمية التي لا تحتاج إلى مقابل مستقل للفعل «لديكم».
- source_word: ἐμέ
  choice: أنا
  rationale: أُبرز ضمير المتكلم في تركيب المقابلة «أما أنا»، بما يحافظ على التشديد الوارد في الضمير اليوناني.
- source_word: δέ
  choice: أمّا ... فَـ
  rationale: هذا التركيب العربي يبين المقابلة بين دوام وجود الفقراء معهم وعدم دوام وجود يسوع معهم.
- source_word: οὐ πάντοτε ἔχετε
  choice: لستُ معكم دائمًا
  rationale: تنقل الصياغة معنى عدم دوام حضوره معهم، ولا توحي بالامتلاك الذي قد توحي به ترجمة حرفية مثل «لا تملكونني».
theological_decisions:
- issue: إمكان إساءة استعمال قول يسوع للانتقاص من الاهتمام بالفقراء
  choice: إبقاء القول مقابلة مباشرة بين دوام وجود الفقراء معهم ومحدودية مدة وجود يسوع معهم.
  alternative: صياغة تفسيرية توحي بأن الفقراء أقل أهمية، أو صياغة مخففة تطمس المقابلة.
  rationale: النص اليوناني يقرر فرقًا في الحضور والتوقيت، ولا يصرح بتقليل شأن الفقراء. لذلك تحافظ الترجمة على التوتر دون إضافة حكم لاهوتي غير مذكور.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ووقورة. استُخدمت جملتان اسميتان طبيعيتان في العربية لتجنب إيحاء الملكية في «ἔχετε»، مع الحفاظ على التعليل والمقابلة والتكرار.
