  text: Ἔγνω ⸀οὖν ὄχλος πολὺς ἐκ τῶν Ἰουδαίων ὅτι ἐκεῖ ἐστιν, καὶ ἦλθον οὐ διὰ τὸν Ἰησοῦν μόνον, ἀλλ’ ἵνα καὶ τὸν Λάζαρον ἴδωσιν ὃν ἤγειρεν ἐκ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/009.yaml
  text: So a large crowd of the Jews learned that he was there[a], and they came not only because of Jesus, but also so that they might see Lazarus, whom he had raised from the dead.
translation:
  language: ar
  text: فعلم حشدٌ كبيرٌ من اليهود[a] أن يسوع كان هناك، فجاؤوا لا من أجل يسوع وحده، بل ليروا أيضًا لعازر الذي أقامه من بين الأموات.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «من أهل اليهودية». يمكن أن تشير الكلمة اليونانية إلى اليهود عمومًا، أو إلى أهل اليهودية في بعض سياقات إنجيل يوحنا.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἔγνω
  choice: فعَلِمَ
  rationale: يدل الماضي هنا على وصول الخبر إلى الجمع وعلمهم به، لا على مجرد امتلاك معرفة سابقة.
- source_word: οὖν
  choice: فـ
  rationale: الفاء تربط الحدث بما قبله ربطًا سببيًا أو استنتاجيًا طبيعيًا في السرد العربي.
- source_word: ὄχλος πολὺς
  choice: جمعٌ كبيرٌ
  rationale: يحافظ على دلالة الاسم الجمعي وعلى وصف كثرة الحاضرين بعبارة عربية واضحة.
- source_word: ἐκ τῶν Ἰουδαίων
  choice: من اليهود
  rationale: تعكس ἐκ معنى الانتماء إلى جماعة أوسع، مع إبقاء احتمال الدلالة الجغرافية لكلمة Ἰουδαῖοι في الحاشية.
- source_word: ὅτι ἐκεῖ ἐστιν
  choice: أنه هناك
  rationale: الضمير المستتر يعود إلى يسوع بحسب السياق، والعبارة العربية لا تحتاج إلى فعل كينونة ظاهر في الزمن الحاضر.
- source_word: ἦλθον
  choice: فجاؤوا
  rationale: تنقل فعل الحركة من منظور موضع الحدث، مع وصل طبيعي بما سبق.
- source_word: οὐ διὰ τὸν Ἰησοῦν μόνον
  choice: لا من أجل يسوع وحده
  rationale: تنقل διά مع المنصوب بوصفها سببًا أو دافعًا للمجيء، وتحفظ تركيب «ليس فقط» بصياغة عربية موجزة.
- source_word: ἀλλ’ ἵνα καὶ ... ἴδωσιν
  choice: بل ليروا أيضًا
  rationale: تحفظ المقابلة والغرض معًا بصياغة عربية طبيعية، واللام تؤدي معنى ἵνα الغائي.
- source_word: Λάζαρον
  choice: لعازر
  rationale: الصيغة العربية الشائعة للاسم الكتابي.
- source_word: ὃν ἤγειρεν ἐκ νεκρῶν
  choice: الذي أقامه من بين الأموات
  rationale: «أقام» تنقل معنى إعادة لعازر إلى الحياة، و«من بين الأموات» تحافظ على صورة ἐκ νεκρῶν.
theological_decisions:
- issue: دلالة Ἰουδαίων في سياق إنجيل يوحنا
  choice: من اليهود
  alternative: من أهل اليهودية
  rationale: يمكن أن تشير الكلمة إلى اليهود عمومًا أو، في بعض سياقات يوحنا، إلى أهل اليهودية تحديدًا. لا يفرض السياق المباشر هنا حصرها جغرافيًا، لذلك أُثبتت الدلالة الأوسع في المتن مع حفظ البديل في الحاشية، من غير إضفاء معنى جدلي أو سلبي على الجماعة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت الفاء لنقل ترابط السرد، وحُفظت المقابلة بين المجيء من أجل يسوع والرغبة في رؤية لعازر دون زيادة تفسيرية.
