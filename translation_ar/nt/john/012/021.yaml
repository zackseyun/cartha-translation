  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: οὗτοι οὖν προσῆλθον Φιλίππῳ τῷ ἀπὸ Βηθσαϊδὰ τῆς Γαλιλαίας, καὶ ἠρώτων αὐτὸν λέγοντες· Κύριε, θέλομεν τὸν Ἰησοῦν ἰδεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/021.yaml
  text: So these came to Philip[a], who was from Bethsaida in Galilee, and were asking him, saying, “Lord, we want to see Jesus.”
translation:
  language: ar
  text: 'فهؤلاء إذًا تقدَّموا إلى فيلبُّس، وهو من بيت صيدا في الجليل، وأخذوا يسألونه قائلين: «يا سيدي[a]، نريد أن نرى يسوع».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمتها: «يا رب». فالنداء اليوناني κύριε قد يكون لقبًا بمعنى «الرب»، وقد يُستعمل كذلك لمخاطبة شخص باحترام بمعنى «يا سيدي».'
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτοι οὖν
  choice: فهؤلاء إذًا
  rationale: تحافظ «هؤلاء» على الإشارة إلى اليونانيين المذكورين في الآية السابقة، وتنقل «إذًا» قوة أداة الربط التي تدفع السرد إلى الأمام.
- source_word: προσῆλθον
  choice: تقدَّموا إلى
  rationale: تعبير عربي طبيعي يفيد الاقتراب من شخص والتوجّه إليه.
- source_word: Φιλίππῳ
  choice: فيلبُّس
  rationale: الصيغة العربية الشائعة للاسم اليوناني Φίλιππος.
- source_word: τῷ ἀπὸ Βηθσαϊδὰ τῆς Γαλιλαίας
  choice: وهو من بيت صيدا في الجليل
  rationale: تنقل العبارة الوصفية المحدِّدة لفيلبّس بصياغة عربية واضحة، مع بيان الموقع الجغرافي من غير تكلّف.
- source_word: ἠρώτων αὐτὸν
  choice: أخذوا يسألونه
  rationale: ينقل الفعل الناقص اليوناني بوصفه فعلًا ممتدًّا أو متكرّرًا في ذلك الموقف، بدل اختزاله في سؤال لحظي واحد.
- source_word: λέγοντες
  choice: قائلين
  rationale: يحافظ على اسم الفاعل الذي يقدّم مضمون طلبهم.
- source_word: Κύριε
  choice: يا سيدي
  rationale: في مخاطبة فيلبّس هنا، يُفهم اللفظ اليوناني على الأرجح بوصفه صيغة احترام؛ و«يا سيدي» تؤدي هذا المعنى طبيعيًّا من غير أن توحي بأنهم يلقّبون فيلبّس بالرب الإلهي.
- source_word: θέλομεν
  choice: نريد
  rationale: مقابل عربي مباشر ومعاصر للتعبير عن الإرادة أو الرغبة.
- source_word: τὸν Ἰησοῦν ἰδεῖν
  choice: أن نرى يسوع
  rationale: يحافظ على المعنى الصريح للفعل «يرى»، من غير توسيعه تفسيريًّا إلى «نلتقي» أو «نتحدّث مع».
theological_decisions:
- issue: دلالة κύριε في خطاب موجَّه إلى فيلبّس
  choice: يا سيدي
  alternative: يا رب
  rationale: يمكن أن يدل κύριε على «يا رب» أو أن يكون نداء احترام بمعنى «يا سيدي». ولأن المخاطَب المباشر هو فيلبّس، فصيغة الاحترام هي الأرجح سياقيًّا. أُبقي الاحتمال الحرفي الآخر في الحاشية صونًا للمدى الدلالي من غير إضفاء اعتراف لاهوتي على خطاب موجَّه إلى فيلبّس.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة ووقورة. استُعملت «أخذوا يسألونه» لإظهار الاستمرار الذي يفيده الماضي الناقص اليوناني، واختيرت «يا سيدي» بحسب سياق الخطاب مع إثبات البديل في الحاشية.
