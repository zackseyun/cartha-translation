  to: فكان الجمع الذي كان معه حين نادى لعازر ليخرج من القبر وأقامه من بين الأموات، كان يشهد.[a]
  rationale: تُظهر «ليخرج من القبر» جهة النداء التي يفيدها الأصل بوضوح في عربية طبيعية، من دون تغيير مضمون الحدث. وأُبقيت «كان يشهد» لإبراز الاستمرار الذي يدل عليه الماضي الناقص، وحُذفت الزيادة غير اللازمة «بذلك»، وصُقلت الحاشية لتقديم بديل معجمي طبيعي.
