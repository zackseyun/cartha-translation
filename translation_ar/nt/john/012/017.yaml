review_pass:
  verdict: revise
  source_fidelity: ينقل النص هوية الجمع، واستمرار فعل الشهادة في الماضي، ونداء لعازر وإقامته من بين الأموات بأمانة. لكن موضع «من القبر» في الصياغة الحالية قد يُفهم عربيًا على أنه يصف مكان النداء أو مكان يسوع، لا خروج لعازر، في حين أن التركيب اليوناني يربطه بنداء لعازر للخروج من القبر.
  naturalness: الأسلوب فصيح وواضح عمومًا. وتكون العبارة أكثر سلامة ورفعًا للالتباس ببيان أن النداء كان موجّهًا إلى لعازر ليخرج من القبر. كما أن «كان يشهد» يفي بدلالة الماضي الناقص دون حاجة إلى «بذلك»، التي لا مقابل صريحًا لها في اليونانية.
  terminology: «الجمع»، و«يشهد»، و«أقامه من بين الأموات» اختيارات مناسبة للفصحى الحديثة وتحافظ على مفردات يوحنا المحورية ودلالة الإقامة. ينبغي أن تقدّم الحاشية بديلًا عربيًا حقيقيًا للفعل، لا إعادة صياغة ثقيلة لعبارة المتن.
  issues:
  - severity: medium
    issue: التباس تعلّق عبارة «من القبر» في «نادى لعازر من القبر».
    rationale: الأصل يفيد أن يسوع نادى لعازر للخروج من القبر. وقد يُفهم التركيب العربي الحالي على أن يسوع نادى وهو من القبر أو أن العبارة مجرد تحديد لموضع لعازر، من غير إبراز جهة الخروج.
  - severity: low
    issue: إضافة «بذلك» إلى متعلّق «يشهد».
    rationale: هي مفهومة من السياق، لكنها ليست لازمة في العربية ولا يقابلها مفعول صريح في النص اليوناني؛ حذفها يحافظ على إيجاز الأصل.
  - severity: low
    issue: صياغة الحاشية الحالية غير سلسة ولا تعرض البديل بصورة مميزة بما يكفي.
    rationale: «يؤدي الشهادة بذلك» ثقيلة، وعبارة «الشهادة أو الإدلاء بها» متداخلة دلاليًا. «يدلي بشهادته» بديل عربي طبيعي.
