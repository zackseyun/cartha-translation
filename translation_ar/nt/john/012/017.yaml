  text: So the crowd that had been with him when he called Lazarus out of the tomb and raised him from the dead was bearing witness[a].
translation:
  language: ar
  text: فكان الجمع الذي كان معه حين نادى لعازر ليخرج من القبر وأقامه من بين الأموات، كان يشهد.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كان يدلي بشهادته»؛ قد يدل الفعل اليوناني على الشهادة أو الإدلاء بها، وهو موضوع متكرر في إنجيل يوحنا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμαρτύρει
  choice: كان ... يشهد
  rationale: صيغة الماضي الناقص تدل في السياق على شهادة مستمرة أو متكررة، و«يشهد» يحافظ على اللفظ المحوري المتكرر في إنجيل يوحنا.
- source_word: οὖν
  choice: فـ
  rationale: الفاء تربط الآية بسياقها السابق ربطًا سرديًا ونتائجيًا طبيعيًا في العربية.
- source_word: ὁ ὄχλος
  choice: الجمع
  rationale: لفظ عربي واضح ومألوف لجماعة الناس المشار إليها، ويحافظ على كونها جماعة محددة.
- source_word: ὁ ὢν μετ’ αὐτοῦ
  choice: الذي كان معه
  rationale: ينقل اسم الفاعل المعرّف بوصفه محددًا للجمع الذي حضر الواقعة السابقة، من غير إضافة زمنية غير لازمة.
- source_word: ὅτε
  choice: حين
  rationale: أداة زمنية طبيعية تُدخل الواقعة التي شهدها الجمع.
- source_word: ἐφώνησεν
  choice: نادى
  rationale: ينقل فعل φωνέω هنا بوصفه نداء يسوع للعازر، من دون إضافة شدة ليست لازمة في الفعل نفسه.
- source_word: ἐκ τοῦ μνημείου
  choice: من القبر
  rationale: المقصود موضع الدفن؛ و«من القبر» عربية طبيعية وتفيد الخروج منه في سياق النداء.
- source_word: ἤγειρεν
  choice: أقامه
  rationale: «أقام» هو التعبير العربي الملائم في سياق الإقامة من الموت، ويحفظ دلالة الفعل من غير شرح زائد.
- source_word: ἐκ νεκρῶν
  choice: من بين الأموات
  rationale: يحافظ على تركيب اليونانية الذي يصوّر إخراج لعازر من وسط الأموات، مع بقاء العبارة عربية واضحة.
theological_decisions:
- issue: صياغة إقامة لعازر من الموت
  choice: أقامه من بين الأموات
  alternative: أعاده إلى الحياة من بين الأموات
  rationale: النص اليوناني ينسب إلى يسوع إقامة لعازر من بين الأموات صراحة؛ فحُفظ تقرير المعجزة من غير تلطيف أو إدخال تفسير عقائدي زائد.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة ووقورة. استُعملت بنية «كان ... يشهد» لإبراز الاستمرار في الماضي، وأُضيف «بذلك» لإكمال المتعلَّق المفهوم من السياق في العربية من غير تغيير مضمون الشهادة.
