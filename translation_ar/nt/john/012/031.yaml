base_translation:
  language: en
  yaml_path: translation/nt/john/012/031.yaml
  text: Now is the judgment of this world[b][a]; now the ruler of this world will be cast out.
translation:
  language: ar
  text: الآن دينونةُ هذا العالم؛ الآن سيُطرَد حاكمُ هذا العالم إلى الخارج.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يُفهَم «حاكم هذا العالم» عادةً على أنه إشارة إلى الشيطان. ويمكن أيضًا ترجمة «حاكم» بـ«رئيس».
    reason: alternative_reading_and_lexical_alternative
lexical_decisions:
- source_word: νῦν
  choice: الآن
  rationale: تحافظ على القوة الزمنية المؤكدة وعلى التوازي الناتج من تكرار اللفظة في الجملتين.
- source_word: κρίσις
  choice: دينونة
  rationale: تنقل معنى الحكم الحاسم في السياق اليوحناوي، من غير حصر الدلالة في مجرد التقييم أو التصريح بالإدانة.
- source_word: τοῦ κόσμου τούτου
  choice: هذا العالم
  rationale: صياغة مباشرة تحفظ اسم الإشارة والتباين اليوحناوي المرتبط بالعالم الحاضر.
- source_word: ὁ ἄρχων
  choice: حاكم
  rationale: لفظ عربي واضح يدل على صاحب سلطة، من غير إدخال هوية الاسم المقصود في صلب النص.
- source_word: ἐκβληθήσεται ἔξω
  choice: سيُطرَد ... إلى الخارج
  rationale: تحفظ صيغة المبني للمجهول وقوة الإقصاء التي يؤكدها اجتماع الفعل مع ἔξω.
theological_decisions:
- issue: هوية «حاكم هذا العالم»
  choice: إبقاء اللقب في المتن من غير تسميته
  alternative: الشيطان أو إبليس؛ أو تشخيص نظام العالم الحاضر
  rationale: النص اليوناني يستعمل اللقب ولا يذكر الاسم صراحة؛ لذلك تُحفظ الدلالة اللاهوتية الضمنية من غير حسم تفسيري داخل المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. حُفظ التكرار البلاغي لكلمة «الآن» وبنية الجملتين المتوازيتين، مع تجنب تفسير هوية الحاكم داخل المتن.
