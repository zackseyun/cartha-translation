  text: ἀπεκρίθη ⸂Ἰησοῦς καὶ εἶπεν⸃· Οὐ δι’ ἐμὲ ⸂ἡ φωνὴ αὕτη⸃ γέγονεν ἀλλὰ δι’ ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/030.yaml
  text: Jesus answered and said[a], “This voice has not come for my sake, but for yours.”
translation:
  language: ar
  text: 'فأجاب يسوع وقال: «لم يأتِ هذا الصوت من أجلي، بل من أجلكم».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لم يحدث هذا الصوت بسببي، بل بسببكم». يمكن أن تفيد أداة الجر اليونانية معنى السببية أيضًا، لكن السياق يرجّح معنى «من أجل» أو «لفائدة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: أجاب
  rationale: صياغة عربية مألوفة لفعل الاستجابة في سياق الحوار، وتحفظ وظيفته السردية.
- source_word: εἶπεν
  choice: وقال
  rationale: إبقاء الفعلين يعكس الصيغة اليونانية ἀπεκρίθη ... καὶ εἶπεν، وهي طبيعية ومهيبة في العربية.
- source_word: φωνή
  choice: الصوت
  rationale: السياق يشير إلى القول السماوي الذي سمعه الجمع؛ و«الصوت» أدق من ألفاظ أعم مثل «الجلبة» أو «الدوي».
- source_word: γέγονεν
  choice: لم يكن
  rationale: الفعل التام يدل هنا على وقوع الصوت وحدوثه؛ و«لم يكن هذا الصوت» تعبير عربي طبيعي يحفظ معنى الحدث من غير نقل حرفي متكلف.
- source_word: δι’ ἐμέ
  choice: من أجلي
  rationale: تنقل على الأرجح معنى الغاية أو المنفعة في διά مع النصب، أي إن الصوت لم يكن لفائدة يسوع.
- source_word: δι’ ὑμᾶς
  choice: من أجلكم
  rationale: تحفظ التوازي والمقابلة مع «من أجلي»، وتدل على أن الصوت كان لمنفعة السامعين.
- source_word: Οὐ ... ἀλλὰ
  choice: لم ... بل
  rationale: تحفظ المقابلة الاستدراكية المباشرة في الأصل.
theological_decisions:
- issue: الغرض من الصوت السماوي
  choice: لم يكن الصوت لفائدة يسوع، بل لفائدة السامعين المحيطين به.
  alternative: حدث الصوت بسببي وبسببكم.
  rationale: تركيب διά مع النصب في الشطرين يُفهم على الأرجح بمعنى الغاية أو المنفعة في هذا السياق. ومع ذلك، تُذكر الإمكانية السببية في الحاشية حفاظًا على السعة الدلالية من غير حسم زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظت الصيغة السردية الثنائية «أجاب... وقال»، كما حُفظ التوازي بين «من أجلي» و«من أجلكم». وُضعت علامة الحاشية بعد الاقتباس الذي تتعلق به.
