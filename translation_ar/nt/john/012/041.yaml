base_translation:
  language: en
  yaml_path: translation/nt/john/012/041.yaml
  text: Isaiah said these things because he saw his glory and spoke about him[a].
translation:
  language: ar
  text: قال إشعياء هذه الأمور لأنه رأى مجده وتكلّم عنه.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «قال إشعياء هذه الأمور لأنه رأى مجد الله وتكلّم عنه». يُرجَّح أن الضميرين يعودان إلى يسوع في سياق يوحنا، لكن الخلفية الأوسع في إشعياء هي رؤيا مجد الرب (إشعياء 6:1).'
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα
  choice: هذه الأمور
  rationale: اسم إشارة محايد في صيغة الجمع يعود إلى الأقوال النبوية المقتبسة سابقًا، و«هذه الأمور» تعبير عربي واضح يحفظ دلالة الجمع.
- source_word: εἶπεν
  choice: قال
  rationale: ترجمة مباشرة للفعل λέγω في الماضي، مع تمييزه عن ἐλάλησεν اللاحق.
- source_word: Ἠσαΐας
  choice: إشعياء
  rationale: الصيغة العربية المألوفة لاسم النبي.
- source_word: ὅτι
  choice: لأنه
  rationale: 'تفيد ὅτι هنا على الأرجح التعليل: قال إشعياء هذه الأمور بسبب رؤيته المجد وتكلّمه عنه، مع أن المعنى التفسيري «إنه» ممكن نحويًا.'
- source_word: εἶδεν
  choice: رأى
  rationale: المقابل العربي الطبيعي والمباشر للفعل ὁράω.
- source_word: δόξαν
  choice: مجده
  rationale: «المجد» هو المقابل الراسخ لـδόξα ويحفظ ثقل اللفظ في سياق يوحنا؛ وأُلحقت به لاحقة الملكية لترجمة αὐτοῦ.
- source_word: ἐλάλησεν
  choice: تكلّم
  rationale: يحفظ معنى λαλέω ويميّزه قليلًا عن εἶπεν المترجم «قال».
- source_word: περὶ αὐτοῦ
  choice: عنه
  rationale: صياغة عربية موجزة وطبيعية لمعنى «بشأنه/عنه».
theological_decisions:
- issue: مرجع الضميرين αὐτοῦ / αὐτοῦ
  choice: الإبقاء على الضميرين «ـه/عنه» في المتن، بما يتيح أن يعودا في سياق يوحنا إلى يسوع.
  alternative: 'التصريح باسم الله أو الرب: «رأى مجد الله وتكلّم عنه».'
  rationale: السياق المباشر في يوحنا 12 يوجّه الضميرين إلى يسوع، لكن خلفية إشعياء 6 هي رؤية مجد الرب. يحفظ الضمير العربي إحالة النص الأصلية والتوتر المقصود، وتوضح الحاشية كلا البعدين من غير استبدال الضمير بتفسير صريح.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُخدم «هذه الأمور» لحفظ جمع ταῦτα، و«تكلّم عنه» لصياغة طبيعية مع إبقاء الضمائر على غموضها الحقيقي وعدم حسم مرجعها داخل المتن.
