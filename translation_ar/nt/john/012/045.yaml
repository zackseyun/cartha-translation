lexical_decisions:
- source_word: καὶ
  choice: وَ
  rationale: أداة ربط بسيطة تصل القول بسياقه السابق، وتؤديها الواو طبيعيًا في العربية.
- source_word: ὁ θεωρῶν ἐμὲ
  choice: مَن يراني
  rationale: اسم الفاعل المحلّى بالأداة يُستعمل استعمالًا اسميًا عامًا؛ وصيغة «مَن يراني» عربية طبيعية تحفظ الدلالة العامة. ويدل θεωρέω هنا على الرؤية التي قد تتضمن النظر المتأمل والإدراك، لا مجرد وقوع البصر.
- source_word: θεωρεῖ
  choice: يرى
  rationale: تحافظ «يرى» على تكرار الفعل وعلى أسلوب عربي واضح مع بقاء معنى المعاينة أو الإدراك بحسب السياق.
- source_word: τὸν πέμψαντά με
  choice: الذي أرسلني
  rationale: تنقل العبارة الوصفية كما هي من غير إدخال لقب «الآب» غير المذكور صراحة في هذه الآية.
theological_decisions:
- issue: العلاقة بين رؤية يسوع ورؤية الذي أرسله
  choice: 'الإبقاء على العبارة المباشرة: «يرى الذي أرسلني»'
  alternative: تفسيرها بأنها مجرد معرفة بالمرسِل من خلال يسوع، أو توسيعها إلى تصريح صريح بالهوية الذاتية
  rationale: يفيد النص وحدة إعلانية قوية بين رؤية يسوع ورؤية مرسله، لكنه لا يشرح هنا طبيعة هذه الوحدة؛ لذلك تُحفظ قوة العبارة وتوترها اللاهوتي من غير تخفيف أو توسع عقائدي.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة. استُخدمت «مَن» للدلالة العامة، وحُفظ تكرار فعل الرؤية في شطري الآية.
