source:
  edition: SBLGNT
  text: ⸀ταῦτα οὐκ ἔγνωσαν ⸂αὐτοῦ οἱ μαθηταὶ⸃ τὸ πρῶτον, ἀλλ’ ὅτε ἐδοξάσθη Ἰησοῦς τότε ἐμνήσθησαν ὅτι ταῦτα ἦν ἐπ’ αὐτῷ γεγραμμένα καὶ ταῦτα ἐποίησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/016.yaml
  text: His disciples did not understand these things at first[a], but when Jesus was glorified[c][b], then they remembered that these things had been written about him and that they had done these things to him.
translation:
  language: ar
  text: لم يفهم تلاميذه هذه الأمور في البداية[a]، ولكن حين مُجِّد يسوع[b]، تذكّروا أن هذه الأمور كانت قد كُتبت عنه[c]، وأنهم فعلوا به هذه الأمور.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لم يعرف تلاميذه هذه الأمور في البداية».'
    reason: lexical_alternative
  - marker: b
    text: تشير عبارة «مُجِّد» في إنجيل يوحنا عادةً إلى تمجيد يسوع المرتبط بموته وقيامته ورفعته.
    reason: cross_reference
  - marker: c
    text: 'أو: «كانت مكتوبة بشأنه».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγνωσαν
  choice: لم يفهم
  rationale: يفيد السياق أنهم لم يدركوا دلالة الأحداث، لا أنهم كانوا يجهلون مجرد وقائعها؛ و«يفهم» تعبير عربي طبيعي يحفظ هذا المعنى.
- source_word: αὐτοῦ οἱ μαθηταί
  choice: تلاميذه
  rationale: الضمير في حالة المضاف إليه يدل طبيعيًا على الاختصاص، وتؤديه العربية الموجزة بالضمير المتصل.
- source_word: τὸ πρῶτον
  choice: في البداية
  rationale: تعبير زمني عربي واضح يقابل معنى «أولًا/في أول الأمر» دون إيحاء بأنها المرة الأولى فقط.
- source_word: ἐδοξάσθη
  choice: مُجِّد
  rationale: يحفظ لفظ المجد وثقله اللاهوتي في يوحنا، بدل تضييقه إلى التكريم أو الرفعة وحدهما.
- source_word: ἐμνήσθησαν
  choice: تذكّروا
  rationale: ينقل الفعل بصياغة عربية طبيعية تناسب تسلسل الرواية.
- source_word: ἐπ’ αὐτῷ γεγραμμένα
  choice: كانت قد كُتبت عنه
  rationale: تفيد ἐπί مع المجرور هنا معنى «عن/بشأن»، وصيغة «كانت قد كُتبت» توضح سبق الكتابة على تذكّر التلاميذ.
- source_word: ταῦτα ἐποίησαν αὐτῷ
  choice: أنهم فعلوا به هذه الأمور
  rationale: تحفظ الفعل والضمير كما في اليونانية، وتُبقي مرجع الفاعل الجمعي ضمنيًا كما في المصدر بدل تحديده تفسيريًا.
- source_word: ταῦτα
  choice: هذه الأمور
  rationale: تحفظ صيغة الجمع وتكرار اسم الإشارة اللذين يربطان الأحداث بما كُتب.
theological_decisions:
- issue: مدلول تمجيد يسوع في سياق يوحنا
  choice: مُجِّد يسوع
  alternative: رُفع يسوع / أُكرم يسوع
  rationale: تُبقي الصياغة معنى المجد اليوحناوي متعدد الطبقات، من غير حصره في القيامة أو الصعود أو في آلامه وحدها.
- issue: مرجع الفاعل في «فعلوا به هذه الأمور»
  choice: 'الإبقاء على الفاعل الجمعي ضمنيًا: «أنهم فعلوا»'
  alternative: تحديده صراحة بأنه الجموع أو الناس
  rationale: الفاعل مستتر في صيغة الفعل اليوناني ويُفهم من السياق السابق؛ تحديده باسم بعينه يضيف تفسيرًا غير مصرّح به في الآية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختير «في البداية» لسلاسة الأسلوب، وحُفظ تكرار «هذه الأمور» وبناء «فعلوا به» لصون ترابط النص وغموض مرجع الفاعل. وُضع كل مؤشّر حاشية في المتن.
