  yaml_path: translation/nt/john/012/050.yaml
  text: And I know that his commandment is eternal life. So what I speak[a], I speak just as the Father has told me.
translation:
  language: ar
  text: وأنا أعلم أن وصيته هي حياة أبدية.[a] لذلك، ما أتكلم به، أتكلم به كما قال لي الآب.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وصيته تقود إلى الحياة الأبدية»، أو: «وصيته تتعلق بالحياة الأبدية». واليونانية تقول حرفيًا: «وصيته هي حياة أبدية».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐντολή
  choice: وصية
  rationale: تقابل اللفظة اليونانية الدالة على أمر ذي سلطان، وهي صياغة عربية فصيحة ومألوفة في هذا السياق، وتحافظ على قربها المعجمي دون توسيعها إلى «تعليم».
- source_word: ζωὴ αἰώνιος
  choice: حياة أبدية
  rationale: التعبير اليوحناوي المألوف، ويحفظ دلالة الدوام والثقل اللاهوتي للحياة الآتية.
- source_word: ἃ
  choice: ما
  rationale: صياغة عربية طبيعية للموصول المحايد الجمع، وتجعل كلام يسوع مفعولًا لفعل التكلم دون حرفية متكلفة.
- source_word: λαλῶ
  choice: أتكلم
  rationale: تكرار «أتكلم» في الموضعين يحفظ تكرار الفعل اليوناني ويبرز التطابق بين كلام يسوع وما قاله له الآب.
- source_word: καθὼς
  choice: كما
  rationale: تفيد المطابقة على نحو طبيعي وواضح في العربية، دون إضافة تشديد غير مصرّح به مثل «تمامًا».
- source_word: εἴρηκέν μοι
  choice: قال لي
  rationale: صياغة عربية مباشرة تحفظ فعل القول؛ وسياق الفعل التام في اليونانية يدل على قول سابق باقٍ أثره، وهو مفهوم من السياق دون تركيب عربي ثقيل.
- source_word: ὁ πατήρ
  choice: الآب
  rationale: يحفظ اللقب المعرّف في اليونانية ولا يضيف ضمير الملكية «أبي» غير الموجود في النص.
- source_word: οὖν
  choice: إذًا
  rationale: تحفظ العلاقة الاستنتاجية مع الجملة السابقة وتأتي في موضع عربي طبيعي داخل الجملة.
- source_word: οἶδα
  choice: أعلم
  rationale: مقابل عربي مباشر وفصيح، ويلائم نبرة اليقين في العبارة.
theological_decisions:
- issue: معنى «وصيته هي حياة أبدية»
  choice: 'إبقاء العبارة الإسنادية المباشرة: «وصيته هي حياة أبدية».'
  alternative: «وصيته تقود إلى الحياة الأبدية» أو «وصيته تتعلق بالحياة الأبدية».
  rationale: يقول اليوناني حرفيًا إن الوصية «هي» حياة أبدية. تبقي الترجمة هذا التوتر الدلالي ولا تحسم هل المقصود النتيجة أم المضمون أم الصلة الواهبة للحياة.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية كريمة. حُفظ تكرار «أتكلم» والتعبير الإسنادي غير المفسَّر. وُضعت علامة الحاشية بعد الآية لأنها تشرح عبارة «وصيته هي حياة أبدية».
