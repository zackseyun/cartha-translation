  text: ὁ οὖν ὄχλος ὁ ἑστὼς καὶ ἀκούσας ἔλεγεν βροντὴν γεγονέναι· ἄλλοι ἔλεγον· Ἄγγελος αὐτῷ λελάληκεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/029.yaml
  text: So the crowd that was standing there and had heard it was saying that thunder had happened; others were saying[a], “An angel has spoken to him.”
translation:
  language: ar
  text: 'فكان الجمع الواقف هناك، إذ سمع ذلك، يقول: «قد وقع رعدٌ»[a]. وكان آخرون يقولون: «لقد كلَّمه ملاك».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو بصياغة أكثر سلاسة: «كان هناك رعد». واليونانية حرفيًا: «حدث رعد».'
    reason: إثبات البديل الاصطلاحي مع بيان صورة العبارة اليونانية.
lexical_decisions:
- source_word: οὖν
  choice: فـ
  rationale: تحفظ صلة الاستمرار والنتيجة بالسياق السابق من غير إثقال الأسلوب.
- source_word: ὁ ὄχλος ὁ ἑστὼς
  choice: الجمع الواقف هناك
  rationale: تنقل معنى الجماعة المحتشدة، وتحفظ دلالة اسم الفاعل التام على كونهم قائمين في الموضع وقت الحدث.
- source_word: ἀκούσας
  choice: إذ سمع ذلك
  rationale: تبيّن أن السماع سبق قول الجمع؛ وأُضيف اسم الإشارة لأن مفعول السماع مضمر في اليونانية ويُفهم من الصوت المذكور في الآية السابقة.
- source_word: ἔλεγεν
  choice: كان ... يقول
  rationale: تحفظ دلالة الماضي الناقص على القول المستمر أو المتكرر.
- source_word: βροντὴν γεγονέναι
  choice: قد وقع رعدٌ
  rationale: صياغة عربية واضحة وقريبة من التركيب اليوناني، الذي يفيد حرفيًا أن رعدًا قد حدث، من غير تحويل تفسير الجمع إلى تقرير من الراوي.
- source_word: ἄλλοι
  choice: آخرون
  rationale: تدل على فريق آخر من الجمع في مقابل الفريق الأول.
- source_word: Ἄγγελος
  choice: ملاك
  rationale: السياق يدل على أن الجمع ظن المتكلم كائنًا سماويًا، لا رسولًا بشريًا.
- source_word: αὐτῷ λελάληκεν
  choice: لقد كلَّمه
  rationale: الفعل «كلَّمه» يؤدي معنى التحدث إليه، و«لقد» تلائم دلالة التمام والنتيجة الحاضرة في صيغة الفعل اليوناني التامة.
theological_decisions:
- issue: هوية المتكلم كما فهمها الفريق الآخر من الجمع
  choice: ملاك
  alternative: رسول
  rationale: يحكي النص تفسير الجمع للصوت السماوي؛ و«ملاك» هو المعنى الراجح هنا، مع عدم إضافة حكم من الراوي على صحة تفسيرهم.
translation_notes:
  register: 'فصحى معاصرة واضحة ووقورة. حُفظ اختلاف تفسيري الجمع للصوت: فريق عده رعدًا، وفريق قال إن ملاكًا كلّم يسوع. وُضع دليل الحاشية مباشرة بعد العبارة التي تشرحها.'
