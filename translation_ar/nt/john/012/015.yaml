base_translation:
  language: en
  yaml_path: translation/nt/john/012/015.yaml
  text: Do not be afraid[a], daughter of Zion. Look, your King is coming[e][d][c][b], seated on a donkey’s colt.
translation:
  language: ar
  text: «لا تخافي، يا ابنة صهيون[a]. ها ملككِ آتٍ[b]، جالسًا على جَحْشِ حمارٍ[c].»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «ابنة صهيون» تشخيص نبوي لصهيون، أي أورشليم، في صورة ابنة.
    reason: cultural_note
  - marker: b
    text: تُردِّد هذه العبارة صدى زكريا 9:9، وتقدّم يسوع بوصفه ملك صهيون الموعود.
    reason: cross_reference
  - marker: c
    text: '«الجحش» صغير الحمار. أو: «على جحشٍ لحمار».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ φοβοῦ
  choice: لا تخافي
  rationale: نهي موجَّه إلى «ابنة صهيون» المؤنثة؛ وهذه صياغة عربية فصيحة طبيعية تحفظ معنى الكف عن الخوف.
- source_word: θυγάτηρ Σιών
  choice: يا ابنة صهيون
  rationale: تحفظ صورة النداء النبوي التي تُشخِّص صهيون/أورشليم في هيئة ابنة، مع إظهار النداء طبيعيًا في العربية.
- source_word: ἰδοὺ
  choice: ها
  rationale: أداة تنبيه موجزة ومعاصرة تؤدي وظيفة لفت النظر من غير صياغة عتيقة أو توسع تفسيري.
- source_word: ὁ βασιλεύς σου
  choice: ملككِ
  rationale: تنقل أداة التعريف والضمير المخاطب المؤنث بوضوح؛ ولا تحتاج العربية إلى تمييز لقبي بحرف كبير.
- source_word: ἔρχεται
  choice: آتٍ
  rationale: تعبر صيغة اسم الفاعل في السياق عن المجيء الحاضر الوشيك بأسلوب عربي رصين وطبيعي.
- source_word: καθήμενος
  choice: جالسًا
  rationale: تحفظ المعنى الوصفي الحرفي للمشاركة، ولا تضيف معنى «راكبًا» وإن كان مفهومًا من السياق.
- source_word: ἐπὶ πῶλον ὄνου
  choice: على جَحْش أتان
  rationale: يحفظ اللفظان معنى الحيوان الصغير وتحديد أنه من الحمير؛ و«أتان» توضح أن ὄνου هنا مضاف إليه من غير تسوية العبارة إلى مجرد «حمار صغير».
theological_decisions:
- issue: التلميح النبوي إلى زكريا 9:9 وصورة الملك المسياني
  choice: الإبقاء على «ابنة صهيون» و«ملككِ» في المتن من غير شرح تفسيري داخله
  alternative: استبدال صهيون بأورشليم أو التصريح في المتن بأن الآتي هو الملك المسياني الموعود
  rationale: يحفظ النص صياغة الاقتباس النبوي وقوته اللاهوتية، بينما يوضع بيان التلميح في الحاشية دون إدخال تفسير زائد في المتن.
- issue: كتابة لقب الملك
  choice: ملككِ بلا تمييز طباعي خاص
  alternative: إبرازه بعلامات أو صياغة تفسيرية للدلالة على لقب مسياني
  rationale: العربية لا تستخدم الحروف الكبيرة، والسياق نفسه يحدد المرجع؛ لذلك لا تُضاف علامة قد توحي بحسم طباعي غير موجود في اليونانية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كتابية كريمة. استُخدمت «ها» للتنبيه و«آتٍ» للمجيء الجاري، وحُفظت الصورة النبوية والعبارة الحيوانية المحددة دون توسع مذهبي.
