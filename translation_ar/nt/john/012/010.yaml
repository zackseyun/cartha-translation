  text: ἐβουλεύσαντο δὲ οἱ ἀρχιερεῖς ἵνα καὶ τὸν Λάζαρον ἀποκτείνωσιν,
base_translation:
  language: en
  yaml_path: translation/nt/john/012/010.yaml
  text: So the chief priests decided to kill Lazarus also,[a]
translation:
  language: ar
  text: فقرَّر رؤساء الكهنة أن يقتلوا لعازر أيضًا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «خطَّط رؤساء الكهنة لقتل لعازر أيضًا».'
    reason: بديل معجمي للفعل ἐβουλεύσαντο، يبرز جانب التدبير والتخطيط بدل النتيجة المتمثلة في القرار.
lexical_decisions:
- source_word: ἐβουλεύσαντο
  choice: قرَّر
  rationale: يدل الفعل هنا على التشاور أو التدبر الذي انتهى إلى عزم مستقر؛ و«قرَّر» تعبير عربي واضح يحفظ معنى القصد المتعمد، بينما «خطَّط» يبرز عملية التخطيط أكثر.
- source_word: δὲ
  choice: فـ
  rationale: أداة ربط مرنة، والفاء تلائم هنا تتابع السرد وما في السياق السابق من علاقة سببية، من غير أن تضيف تضادًا قويًا.
- source_word: οἱ ἀρχιερεῖς
  choice: رؤساء الكهنة
  rationale: يشير الجمع في سياق الأناجيل إلى قيادات الكهنوت، و«رؤساء الكهنة» هو المقابل العربي الدقيق والمألوف.
- source_word: ἵνα
  choice: أن
  rationale: تأتي مع فعل القرار لتبين مضمون القصد وغايته، والمصدر المؤول بـ«أن» هو الأسلوب العربي الطبيعي هنا.
- source_word: καὶ
  choice: أيضًا
  rationale: تحفظ دلالة الإضافة، إذ صار لعازر كذلك هدفًا للقتل، من غير إدخال توكيد زائد قد توحي به «حتى».
- source_word: τὸν Λάζαρον
  choice: لعازر
  rationale: نُقل الاسم بحسب صيغته العربية الكتابية المألوفة، ولم يُمثَّل التعريف اليوناني تمثيلًا مستقلًا لأن أسماء الأعلام لا تحتاج إليه في العربية.
- source_word: ἀποκτείνωσιν
  choice: يقتلوا
  rationale: «يقتلوا» هو المقابل المباشر والطبيعي، ولا يوحي بإجراء قضائي كما قد يفعل «يُميتوا»، ولا يضيف حكمًا أخلاقيًا زائدًا كما قد يفعل «يغتالوا».
theological_decisions:
- issue: تصوير نية رؤساء الكهنة تجاه لعازر
  choice: صياغة العبارة بوصفها قرارًا عدائيًا صريحًا بقتل لعازر، من غير إضافة دافع أو وصف للمؤامرة.
  alternative: استخدام لغة أشد في معنى التدبير المسبق، مثل «تآمروا» أو «دبَّروا لقتله».
  rationale: النص يثبت قصدًا متعمدًا وقرارًا بالقتل، لكنه لا يستعمل في هذه الجملة لفظًا متخصصًا يدل بذاته على التآمر؛ لذلك تحافظ الصياغة على خطورة الفعل من دون تحميله تفسيرًا زائدًا.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. استُعملت الفاء لوصل الآية بسياقها السابق، وحُفظ ترتيب المعنى اليوناني وصراحته من غير جمود تركيبي.
