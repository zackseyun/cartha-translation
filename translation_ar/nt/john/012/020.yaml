base_translation:
  language: en
  yaml_path: translation/nt/john/012/020.yaml
  text: There were some Greeks among those going up to worship at the feast[a].
translation:
  language: ar
  text: وكان بعضُ اليونانيين[a] من بين الصاعدين ليسجدوا في العيد.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أناسٌ من اليونانيين»؛ وربما كانوا من غير اليهود ممن صعدوا للعبادة في العيد.'
    reason: تبيّن صياغة بديلة لـἝλληνές τινες وتحفظ عدم حسم هوية هؤلاء اليونانيين.
lexical_decisions:
- source_word: Ἦσαν δὲ
  choice: وكان
  rationale: تفيد ἦσαν الوجود، أمّا δέ فهي أداة ربط خفيفة؛ وتنقل «وكان» الانتقال في السياق من غير إضافة معنى زمني صريح.
- source_word: Ἕλληνές τινες
  choice: بعضُ اليونانيين
  rationale: المعنى المباشر لـἝλληνες هو «اليونانيون»، وتفيد τινες عدم التعيين. ولم تُعمَّم العبارة إلى «الأمم» لأن النص لا يحسم هوية هؤلاء بأكثر من ذلك.
- source_word: ἐκ τῶν ἀναβαινόντων
  choice: من بين الصاعدين
  rationale: تفيد ἐκ أنهم كانوا ضمن جماعة الصاعدين، ويحافظ «الصاعدين» على تعبير الصعود المتعارف عليه في الحج إلى أورشليم.
- source_word: ἵνα προσκυνήσωσιν
  choice: ليسجدوا
  rationale: تفيد ἵνα مع صيغة الاحتمال الغرض، ويدل προσκυνέω هنا على السجود تعبّدًا لا على مجرد الانحناء للتحية.
- source_word: ἐν τῇ ἑορτῇ
  choice: في العيد
  rationale: تشير ἑορτή في هذا السياق إلى مناسبة العيد اليهودي، و«في العيد» تعبير عربي موجز يحفظ صياغة النص من غير شرح زائد.
theological_decisions:
- issue: هوية Ἕλληνες
  choice: الإبقاء على «اليونانيين» بوصفها تسمية قومية أو ثقافية
  alternative: «الأمم» أو التصريح بأنهم غير يهود
  rationale: لا يحدد النص هل كانوا يهودًا ناطقين باليونانية، أم مهتدين إلى اليهودية، أم من المتعبدين من غير اليهود؛ لذلك تُحفظ تسمية النص وما فيها من احتمال من غير حسم تفسيري.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كتابية رصينة. استُخدم «ليسجدوا» للحفاظ على الصورة الأصلية ومعناها التعبدي، ووُضعت علامة الحاشية عقب «اليونانيين» لأنها تتعلق بهويتهم وصياغة تسميتهم.
