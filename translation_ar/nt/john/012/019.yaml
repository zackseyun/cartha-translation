base_translation:
  language: en
  yaml_path: translation/nt/john/012/019.yaml
  text: So the Pharisees said to one another[a], “You see that you are accomplishing nothing. Look—the world has gone after him.”
translation:
  language: ar
  text: 'قال الفريسيون بعضهم لبعض: «ترون أنكم لا تحققون شيئًا. انظروا، قد ذهب العالم وراءه».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لقد ذهب الجميع وراءه». يقول النص اليوناني «العالم»، ويبدو أن العبارة مبالغة بلاغية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: فـ
  rationale: تفيد الانتقال المبني على ما سبق ونتيجته، وتؤديه الفاء بطبيعية وإيجاز في العربية.
- source_word: πρὸς ἑαυτούς
  choice: بعضهم لبعض
  rationale: السياق يقتضي المعنى التبادلي، أي إن الفريسيين كانوا يخاطب بعضهم بعضًا.
- source_word: Θεωρεῖτε
  choice: ترون
  rationale: صيغة مضارع خبرية للجمع، وتعبّر هنا عن تقرير استنكاري مشوب بالإحباط، لا عن مجرد أمر بالنظر.
- source_word: οὐκ ὠφελεῖτε οὐδέν
  choice: أنكم لا تحققون شيئًا
  rationale: تنقل معنى عدم جدوى مساعيهم بعبارة عربية واضحة، بدل ترجمة حرفية موهمة مثل «لا تنفعون شيئًا».
- source_word: ἴδε
  choice: انظروا
  rationale: أداة تنبيه مفاجئة، وصيغة الجمع ملائمة لخطاب الجماعة في العربية.
- source_word: κόσμος
  choice: العالم
  rationale: تحافظ على اللفظ اليوناني وعلى المبالغة البلاغية المقصودة، من غير اختزالها تفسيريًا إلى «الجميع» في المتن.
- source_word: ὀπίσω αὐτοῦ
  choice: وراءه
  rationale: تحفظ الصورة الأصلية وتؤدي معنى اتباعه في هذا السياق بصورة طبيعية.
- source_word: ἀπῆλθεν
  choice: لقد مضى
  rationale: ينقل الفعل الماضي مع إبراز النتيجة التي صارت واضحة للمتكلمين، ويتلاءم مع التعبير «مضى وراءه».
theological_decisions:
- issue: مدى مدلول κόσμος في كلام الفريسيين
  choice: إبقاء «العالم» بوصفها مبالغة بلاغية
  alternative: «الجميع» أو «الجمهور كله»
  rationale: القول صادر في سياق الإحباط والمبالغة، فلا يدل حرفيًا على أن كل إنسان صار تابعًا ليسوع. إبقاء اللفظ يحفظ الصياغة اليونانية ورنينها في إنجيل يوحنا من غير فرض تفسير عقائدي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «لا تحققون شيئًا» لتبيين عدم جدوى جهودهم، مع إبقاء «العالم» و«وراءه» قريبين من الصورة اليونانية.
