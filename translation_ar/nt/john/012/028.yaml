  text: πάτερ, δόξασόν σου τὸ ὄνομα. ἦλθεν οὖν φωνὴ ἐκ τοῦ οὐρανοῦ· Καὶ ἐδόξασα καὶ πάλιν δοξάσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/028.yaml
  text: 'Father[a], glorify your name. Then a voice came from heaven: “I have glorified it, and I will glorify it again.”'
translation:
  language: ar
  text: '«يا أبتِ، مجِّد اسمك». فجاء صوت من السماء: «قد مجَّدتُه، وسأمجِّده أيضًا».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، ترجمةً أقرب إلى صيغة الفعل اليوناني: «مجَّدتُه، وسأمجِّده أيضًا».'
    reason: بديل صرفي يبين أن الفعل الأول في اليونانية ماضٍ بسيط، مع أن «قد مجَّدتُه» أنسب لإبراز تمام الفعل وصلته بالحاضر.
lexical_decisions:
- source_word: πάτερ
  choice: يا أبتِ
  rationale: نداء مباشر لله بصيغة المفرد، ولا يتضمن الأصل ضمير الملكية «لي». وصيغة «يا أبتِ» فصيحة ومألوفة في العربية الكتابية.
- source_word: δόξασόν
  choice: مجِّد
  rationale: فعل أمر يفيد إظهار المجد؛ و«مجِّد» يحفظ شبكة ألفاظ المجد ذات الثقل اللاهوتي في إنجيل يوحنا، بخلاف «أكرم» الأضعف دلالة هنا.
- source_word: σου τὸ ὄνομα
  choice: اسمك
  rationale: تعبير عربي طبيعي يحفظ دلالة الاسم على شخص الله وصفاته المعلنة وسمعته، من غير توسع تفسيري.
- source_word: ἦλθεν οὖν
  choice: فجاء
  rationale: الفاء تنقل التعاقب والنتيجة السردية اللذين تؤديهما οὖν في السياق، و«جاء» تقابل الفعل اليوناني مباشرة.
- source_word: φωνὴ ἐκ τοῦ οὐρανοῦ
  choice: صوت من السماء
  rationale: الكلام المنقول بعده يبين أن φωνή صوت ناطق، و«من السماء» تحافظ على منشئه الإلهي.
- source_word: Καὶ ἐδόξασα καὶ πάλιν δοξάσω
  choice: قد مجَّدتُه، وسأمجِّده أيضًا
  rationale: «قد» مع الماضي تفيد إنجاز الفعل مع صلته بالحاضر، والمفعول المتصل يعود بوضوح إلى «اسمك». وتُربط «أيضًا» بالفعل المستقبل وفق المعنى السياقي.
theological_decisions:
- issue: مرجع المفعول المحذوف في جواب الآب
  choice: إظهار الضمير «ـه» عائدًا إلى «اسمك»
  alternative: 'إبقاء المفعول محذوفًا: «قد مجَّدت، وسأمجِّد أيضًا»'
  rationale: يجوز حذف المفعول في اليونانية لاستفادته من السياق، لكن إظهاره في العربية أوضح وأطبع، ولا يضيف مرجعًا جديدًا بل يصرح بما يدل عليه السياق.
- issue: ترجمة δοξάζω في سياق يوحنا اللاهوتي
  choice: مجَّد
  alternative: أكرم؛ أظهر مجد
  rationale: «مجَّد» يحفظ الترابط اللفظي واللاهوتي بين مجد الآب ومجد الابن، ولا يختزل المعنى في مجرد التكريم.
- issue: قيمة الماضي اليوناني ἐδόξασα
  choice: «قد مجَّدتُه» لإبراز الفعل المنجز ذي الصلة بالحاضر
  alternative: «مجَّدتُه» بوصفها مقابلة صورية مباشرة للماضي اليوناني
  rationale: الفعل اليوناني ماضٍ بسيط من جهة الصيغة، ولا يفرض بذاته معنى المضارع التام. أُثبت البديل في الحاشية صونًا لهذا الفرق من غير إضعاف سلاسة المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة مهيبة. حُفظ التوازي بين «مجِّد» و«مجَّدتُه» و«سأمجِّده»، واستُعملت «يا أبتِ» بوصفها صيغة نداء فصيحة من غير إضافة ضمير ملكية غير موجود في الأصل.
