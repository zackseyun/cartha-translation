  text: Ἰησοῦς δὲ ἔκραξεν καὶ εἶπεν· Ὁ πιστεύων εἰς ἐμὲ οὐ πιστεύει εἰς ἐμὲ ἀλλὰ εἰς τὸν πέμψαντά με,
base_translation:
  language: en
  yaml_path: translation/nt/john/012/044.yaml
  text: But Jesus cried out and said[a], “The one who believes in me does not believe in me[b], but in the one who sent me,”
translation:
  language: ar
  text: 'لكن يسوع صرخ وقال: «مَن يؤمن بي لا يؤمن بي، بل بالذي أرسلني.»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔκραξεν
  choice: نادى بصوت عالٍ
  rationale: يدل الفعل على نداء جهري قوي؛ وهذه الصياغة طبيعية وتحفظ قوة الإعلان من غير إيحاء غير لازم بالاستغاثة.
- source_word: Ὁ πιστεύων
  choice: مَن يؤمن
  rationale: اسم الفاعل المعرّف مستعمل استعمالًا عامًا، و«مَن يؤمن» تنقل هذا العموم بوضوح في العربية المعاصرة.
- source_word: πιστεύων / πιστεύει εἰς
  choice: يؤمن بـ
  rationale: يحفظ الفعل المتكرر وصيغته اليوحناوية المألوفة في توجيه الإيمان نحو شخص.
- source_word: τὸν πέμψαντά με
  choice: الذي أرسلني
  rationale: تحفظ العبارة البناء الوصفي والإحالة غير المباشرة في اليونانية، من غير إدخال «الآب» في المتن.
- source_word: δὲ
  choice: لكن
  rationale: تنقل الانتقال المقترن بشيء من المقابلة مع السياق السابق.
theological_decisions:
- issue: قد تُفهم عبارة «لا يؤمن بي، بل بالذي أرسلني» على أنها تنفي كون يسوع موضوعًا للإيمان.
  choice: إضافة «وحدي» في المتن لتوضيح أن الإيمان بيسوع لا ينفصل عن الإيمان بمرسله.
  alternative: الإبقاء حرفيًا على «لا يؤمن بي، بل بالذي أرسلني» مع شرح في حاشية.
  rationale: تُسهل «وحدي» العربية المقصود البلاغي، لكنها غير مذكورة صراحة في اليونانية؛ لذلك تُعلَّم بحاشية توضح حرفية النص.
translation_notes:
  register: عربية فصحى واضحة ومهيبة؛ استُعمل «نادى بصوت عالٍ» لإبراز الجهر، و«مَن يؤمن» للعموم. أُدرجت كلمة تفسيرية معلَّمة بحاشية لصياغة عربية طبيعية.
