lexical_decisions:
- source_word: ὅμως μέντοι
  choice: ومع ذلك
  rationale: تنقل قوة الاستدراك والتنازل في اجتماع الأداتين بصياغة عربية طبيعية وواضحة.
- source_word: καὶ ἐκ τῶν ἀρχόντων πολλοὶ
  choice: آمن به أيضًا كثيرون من القادة
  rationale: تفيد ἐκ الانتماء إلى جماعة القادة، و«القادة» أنسب هنا من «الرؤساء» أو «الحكام» لأنها تشير إلى أصحاب النفوذ في السياق الديني والاجتماعي.
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: آمن به
  rationale: صياغة عربية مألوفة تحافظ على توجّه الإيمان نحو شخص يسوع من غير إضعافه أو تحميله حكمًا لاهوتيًا زائدًا.
- source_word: διὰ τοὺς Φαρισαίους
  choice: بسبب الفريسيين
  rationale: تحافظ على دلالة السبب في διά مع النصب، من غير إضافة لفظ «الخوف» الذي يفهم من السياق لكنه غير مصرّح به.
- source_word: οὐχ ὡμολόγουν
  choice: لم يكونوا يقرّون بذلك
  rationale: تنقل صيغة الماضي الناقص معنى الامتناع المستمر أو المعتاد عن الإقرار العلني، و«بذلك» تعود إلى إيمانهم المذكور من غير تعيين مفعول غير موجود صراحة في اليونانية.
- source_word: ἵνα μὴ
  choice: لئلّا
  rationale: صياغة موجزة وطبيعية تحفظ معنى الغرض، أي تجنب النتيجة المقصودة.
- source_word: ἀποσυνάγωγοι γένωνται
  choice: يُستبعَدوا من جماعة المجمع
  rationale: توضح أن المقصود استبعادهم من الجماعة المرتبطة بالمجمع، لا مجرد إخراجهم من مبنى، مع الحفاظ على معنى الإقصاء الاجتماعي والديني.
theological_decisions:
- issue: طبيعة إيمان القادة في ضوء لاهوت يوحنا
  choice: ترجمة ἐπίστευσαν مباشرةً بـ«آمن» مع إبقاء التوتر بينها وبين عدم إقرارهم العلني.
  alternative: وصف إيمانهم بأنه ظاهري فقط، أو الجزم بأنه إيمان خلاصي كامل.
  rationale: النص يثبت أنهم آمنوا، ثم يذكر امتناعهم عن الإقرار بسبب الفريسيين؛ فلا ينبغي للترجمة أن تحسم منزلة إيمانهم لاهوتيًا بما يتجاوز العبارة الأصلية.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُعملت «جماعة المجمع» في المتن لتجنب فهم الاستبعاد على أنه إخراج من مبنى فحسب، مع عرض البدائل الأقرب حرفيًا في الحاشية.
