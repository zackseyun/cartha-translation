lexical_decisions:
- source_word: οὖν
  choice: فـ
  rationale: تنقل أداة الربط السردية وتصل الآية بما قبلها من غير إثقال العبارة بصيغة استنتاجية رسمية.
- source_word: πρὸ ἓξ ἡμερῶν τοῦ πάσχα
  choice: قبل الفصح بستة أيام
  rationale: صياغة عربية طبيعية ودقيقة للتركيب الزمني، مع إبقاء اسم العيد اليهودي المعروف.
- source_word: ἦλθεν εἰς Βηθανίαν
  choice: جاء يسوع إلى بيت عنيا
  rationale: «جاء» هو المقابل السردي المباشر للفعل، و«بيت عنيا» هي الصيغة العربية المألوفة لاسم الموضع.
- source_word: ὅπου ἦν Λάζαρος
  choice: حيث كان لعازر
  rationale: يحافظ على الدلالة المكانية البسيطة، من غير إضافة أنه كان يقيم هناك أو يسكن فيها.
- source_word: ἤγειρεν
  choice: أقامه
  rationale: ينقل معنى الإقامة في سياق الموت والقيامة، وتوضح صيغة الماضي أن الحدث سبق مجيء يسوع المذكور هنا.
- source_word: ἐκ νεκρῶν
  choice: من الأموات
  rationale: تعبير عربي واضح وشائع في سياق الإقامة من الموت، مع بيان الصياغة الأشد حرفية في الحاشية.
theological_decisions:
- issue: تعيين فاعل إقامة لعازر
  choice: الذي أقامه يسوع من الأموات
  alternative: الذي أقامه من الأموات
  rationale: يكرر النص اليوناني اسم يسوع صراحة في ختام الجملة، لذلك أُبقي الاسم بدل الضمير حفاظًا على تأكيد المصدر.
translation_notes:
  register: العربية فصحى حديثة واضحة ذات نبرة سردية موقرة. وُضع مؤشر الحاشية بعد العبارة التي تشرحها، أي «من الأموات»، لا بعد «الفصح».
