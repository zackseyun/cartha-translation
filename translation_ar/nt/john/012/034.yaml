  text: ἀπεκρίθη ⸀οὖν αὐτῷ ὁ ὄχλος· Ἡμεῖς ἠκούσαμεν ἐκ τοῦ νόμου ὅτι ὁ χριστὸς μένει εἰς τὸν αἰῶνα, καὶ πῶς ⸂λέγεις σὺ⸃ ⸀ὅτι δεῖ ὑψωθῆναι τὸν υἱὸν τοῦ ἀνθρώπου; τίς ἐστιν οὗτος ὁ υἱὸς τοῦ ἀνθρώπου;
base_translation:
  language: en
  yaml_path: translation/nt/john/012/034.yaml
  text: So the crowd answered him[a], "We have heard from the Law that the Messiah remains forever[b], and how can you say that the Son of Man must be lifted up? Who is this Son of Man?"
translation:
  language: ar
  text: 'فأجابه الحشد: «نحن سمعنا من الشريعة أن المسيح[a] يبقى إلى الأبد، فكيف تقول أنت إنه لا بد أن يُرفَع[b] ابن الإنسان؟ من هو ابن الإنسان هذا؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'اليونانية: «المسيح»، وهو هنا لقب يشير إلى المسيح المنتظر.'
    reason: lexical_alternative
  - marker: b
    text: يمكن أن تعني أيضًا «يُعظَّم» أو «يُمجَّد». وفي إنجيل يوحنا قد يجمع «الرفع» بين الرفع الجسدي والتمجيد.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη οὖν αὐτῷ ὁ ὄχλος
  choice: فأجابه الجمع
  rationale: «الجمع» تعبير عربي واضح عن الحشد المجتمع، والفاء تنقل استئناف الكلام وارتباطه بما قبله دون تثقيل الأسلوب. والضمير في «أجابه» يحفظ αὐτῷ.
- source_word: Ἡμεῖς ἠκούσαμεν
  choice: نحن سمعنا
  rationale: إثبات «نحن» يعكس الضمير اليوناني الصريح ويبرز مقابلة ما تلقاه الجمع بما يقوله يسوع، والماضي مناسب لنقل ما سبق أن سمعوه.
- source_word: ἐκ τοῦ νόμου
  choice: من الشريعة
  rationale: يحفظ التعبير اليوناني وإطاره اليهودي الكتابي؛ و«الشريعة» أوضح في العربية هنا من «الناموس» للقارئ المعاصر.
- source_word: ὁ χριστός
  choice: المسيح
  rationale: اللفظ هنا لقب مسياني، و«المسيح» هو المقابل العربي الطبيعي الراسخ الذي يحفظ سياقه اليهودي.
- source_word: μένει εἰς τὸν αἰῶνα
  choice: يبقى إلى الأبد
  rationale: «يبقى» ينقل الدوام في μένει، و«إلى الأبد» يقابل الاصطلاح الزمني اليوناني بوضوح.
- source_word: πῶς λέγεις σὺ
  choice: فكيف تقول أنت
  rationale: يحفظ نبرة الاستغراب أو الاعتراض، ويعكس الضمير المشدد σὺ بذكر «أنت» صراحة.
- source_word: δεῖ
  choice: لا بد أن
  rationale: تعبير عربي طبيعي عن الضرورة التي يدل عليها الفعل اليوناني.
- source_word: ὑψωθῆναι
  choice: يُرفَع
  rationale: يحفظ إمكان الدلالة على الرفع المادي وعلى الرفعة أو التمجيد، فلا يحسم التوتر المقصود في الاستعمال اليوحناوي.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ابن الإنسان
  rationale: المقابل العربي الاصطلاحي للقب، مع إبقاء صداه الكتابي دون تفسير زائد.
- source_word: τίς ἐστιν οὗτος ὁ υἱὸς τοῦ ἀνθρώπου
  choice: من هو ابن الإنسان هذا؟
  rationale: صياغة عربية طبيعية تحفظ اسم الإشارة ونبرة السؤال عن هوية صاحب اللقب.
theological_decisions:
- issue: دلالة ὁ χριστός
  choice: المسيح
  alternative: المسيح الموعود / الكريستوس
  rationale: «المسيح» هو اللقب العربي الكتابي الطبيعي، ولا يحتاج النص إلى إضافة «الموعود» التفسيرية.
- issue: دلالة ὑψωθῆναι في إنجيل يوحنا
  choice: يُرفَع
  alternative: يُمجَّد / يُعلَّق
  rationale: «يُرفَع» يبقي المعنى مزدوجًا بين الرفع الجسدي والرفعة أو التمجيد، بدل قصره على الصلب أو التمجيد وحده.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة، مع تجنب الألفاظ القديمة غير الضرورية. استُعملت «الشريعة» بدل «الناموس»، وحُفظ تكرار لقب «ابن الإنسان» والتوتر الدلالي في «يُرفَع».
