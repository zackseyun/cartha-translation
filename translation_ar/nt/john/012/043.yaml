base_translation:
  language: en
  yaml_path: translation/nt/john/012/043.yaml
  text: For they loved the glory of men rather than the glory of God[a].
translation:
  language: ar
  text: لِأَنَّهُمْ أَحَبُّوا مَجْدَ النَّاسِ أَكْثَرَ مِنْ مَجْدِ اللهِ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو يمكن أن يُفهَمَ «مجد الناس» و«مجد الله» بمعنى «الثناء الصادر من الناس» و«الثناء الصادر من الله»، أو «استحسان الناس» و«استحسان الله».
    reason: بيان بدائل دلالية لـδόξα، مع المحافظة على احتمال دلالة الإضافة على المصدر أو الانتماء.
lexical_decisions:
- source_word: ἠγάπησαν
  choice: أَحَبُّوا
  rationale: ينقل قوة الفعل ἀγαπάω وصلته الدلالية بلغة المحبة، فيما تُظهر صيغة المقارنة معنى التفضيل من غير استبدال الفعل بتفسير أضيق.
- source_word: γὰρ
  choice: لِأَنَّ
  rationale: أداة تعليل تربط الآية بسبب ما سبقها، و«لأن» واضحة وطبيعية في العربية المعاصرة.
- source_word: δόξαν
  choice: مَجْدَ
  rationale: يحفظ تكرار اللفظة اليونانية واتساع معناها، بما يشمل المجد والكرامة والثناء، ويحافظ على صداها اللاهوتي في إنجيل يوحنا.
- source_word: τῶν ἀνθρώπων
  choice: النَّاسِ
  rationale: ἄνθρωποι تشير هنا إلى البشر عمومًا لا إلى الذكور وحدهم؛ و«الناس» ترجمة عربية طبيعية ودقيقة، مع إبقاء علاقة المضاف والمضاف إليه المحتملة للمصدر أو الانتماء.
- source_word: μᾶλλον ἤπερ
  choice: أَكْثَرَ مِنْ
  rationale: ينقل المقارنة والتفضيل بين موضوعي المحبة بوضوح، من دون تحويلها إلى نفي مطلق لمحبة أحدهما.
- source_word: τοῦ θεοῦ
  choice: اللهِ
  rationale: يحفظ التوازي التركيبي مع «الناس» ويترك الإضافة محتملة الدلالة على المصدر أو الانتماء كما في اليونانية.
theological_decisions:
- issue: دلالة δόξα في المقابلة بين الناس والله
  choice: مجد
  alternative: ثناء / استحسان / كرامة
  rationale: «مجد» يحفظ الاتساع المعجمي والتواصل الموضوعي مع لاهوت المجد في يوحنا، بينما البدائل تفسر اللفظة تفسيرًا أضيق.
- issue: طبيعة المقارنة في μᾶλλον ἤπερ
  choice: أكثر من
  alternative: بدلًا من
  rationale: «أكثر من» يحافظ على الصيغة المقارنة التي تفيد تفضيل مجد الناس، ولا يحسم العبارة وكأنها تنفي تمامًا أي محبة لمجد الله.
- issue: علاقة الإضافة في «مجد الناس» و«مجد الله»
  choice: إضافة مباشرة
  alternative: المجد الآتي من الناس / من الله
  rationale: الإضافة العربية تعكس تركيب اليونانية وتحفظ الاحتمال بين المجد المنسوب إلى صاحبه والمجد الصادر عنه، بدل حصره في معنى الاستحسان الآتي منه.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «الناس» للدلالة العامة على البشر، وحُفظ التوازي اللفظي بين «مجد الناس» و«مجد الله»، مع ضبطٍ كامل موجّه للقراءة المنشورة.
