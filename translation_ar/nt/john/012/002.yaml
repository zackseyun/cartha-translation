  text: So they made a dinner for him there[a], and Martha was serving, but Lazarus was one of those reclining at the table with him.
translation:
  language: ar
  text: فأعدّوا له هناك عشاءً، وكانت مرثا تخدم، وكان لعازر واحدًا من المتكئين معه إلى المائدة.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «واحدًا من المتكئين معه». وكان الاتكاء الوضع المعتاد عند تناول وجبة رسمية.'
    reason: cultural_note
lexical_decisions:
- source_word: ἐποίησαν
  choice: أعدّوا
  rationale: يأتي ποιέω مع δεῖπνον بمعنى إعداد وجبة؛ و«أعدّوا» تعبير عربي طبيعي، مع إبقاء الفاعلين غير مصرَّح بهويتهم كما في اليونانية.
- source_word: οὖν
  choice: فـ
  rationale: الفاء تصل الآية بما قبلها وتؤدي معنى الاستمرار أو النتيجة السردية بإيجاز طبيعي.
- source_word: αὐτῷ
  choice: له
  rationale: تفيد صيغة المجرور أن العشاء أُعدّ لأجل يسوع.
- source_word: δεῖπνον
  choice: عشاءً
  rationale: تشير الكلمة إلى الوجبة الرئيسية، وغالبًا المسائية؛ و«عشاء» واضحة ولا توحي بوليمة أضخم مما يدل عليه الأصل.
- source_word: ἐκεῖ
  choice: هناك
  rationale: تنقل دلالة المكان وتحيل في السياق إلى بيت عنيا.
- source_word: διηκόνει
  choice: كانت مرثا تخدم
  rationale: صيغة الماضي الناقص تصوّر خدمة مرثا بوصفها فعلًا جاريًا، و«تخدم» مناسبة لخدمة الطعام دون إيحاء كنسي زائد.
- source_word: δὲ
  choice: أمّا ... فـ
  rationale: تبرز المقابلة الخفيفة بين انشغال مرثا بالخدمة ووجود لعازر بين المتكئين.
- source_word: εἷς ἦν ἐκ
  choice: كان واحدًا من
  rationale: تنقل العبارة بوضوح أن لعازر فرد من جماعة الحاضرين.
- source_word: ἀνακειμένων
  choice: المتكئين ... إلى المائدة
  rationale: تحفظ وضع الاتكاء المرتبط بتناول الطعام في ذلك العصر، مع إضافة «إلى المائدة» لإيضاح المشهد طبيعيًا بالعربية.
- source_word: σὺν αὐτῷ
  choice: معه
  rationale: تفيد المصاحبة، والضمير يعود إلى يسوع بحسب السياق.
