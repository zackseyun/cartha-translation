  text: ἐὰν ἐμοί ⸂τις διακονῇ⸃ ἐμοὶ ἀκολουθείτω, καὶ ὅπου εἰμὶ ἐγὼ ἐκεῖ καὶ ὁ διάκονος ὁ ἐμὸς ἔσται· ⸀ἐάν τις ἐμοὶ διακονῇ τιμήσει αὐτὸν ὁ πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/026.yaml
  text: If anyone serves me[a], let him follow me; and where I am, there my servant will be also. If anyone serves me, the Father will honor him.
translation:
  language: ar
  text: إن كان أحدٌ يخدمني[a]، فليتبعني؛ وحيث أكون أنا، يكون خادمي هناك أيضًا. إن كان أحدٌ يخدمني، فسيكرمه الآب.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'جاء التركيب اليوناني بصيغة المفرد المذكر المستعملة استعمالًا عامًا: «إن كان أحدٌ يخدمني... فسيكرمه الآب». والمقصود أي شخص.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διακονῇ (διακονέω)
  choice: يخدمني
  rationale: يفيد الفعل تقديم الخدمة ليسوع. وهذه صياغة عربية واضحة وعامة، ولا تحصر المعنى في خدمة كنسية رسمية.
- source_word: ἀκολουθείτω
  choice: فليتبعني
  rationale: تحفظ لام الأمر قوة صيغة الأمر اليونانية، وتلائم سياق التلمذة من غير مبالغة في التصريح بدلالة الاستمرار.
- source_word: διάκονος
  choice: خادمي
  rationale: المقصود هنا من يخدم يسوع عمومًا، لا صاحب رتبة كنسية؛ لذلك «خادمي» أوضح من «شمّاسي» أو «خادم كنسي».
- source_word: ὅπου εἰμὶ ἐγὼ
  choice: حيث أكون أنا
  rationale: يحفظ الضمير المنفصل «أنا» التوكيد الموجود في ἐγώ، مع بقاء العبارة طبيعية ومفهومة.
- source_word: ἐκεῖ καὶ
  choice: هناك أيضًا
  rationale: تنقل «هناك» الدلالة المكانية، وتنقل «أيضًا» معنى الإضافة في καί.
- source_word: τιμήσει
  choice: فسيكرمه
  rationale: «يكرمه» ينقل معنى منح الكرامة، والسين تبين الوعد المستقبلي الذي تعبّر عنه الصيغة اليونانية.
- source_word: ὁ πατήρ
  choice: الآب
  rationale: يحافظ على اللقب اليوحناوي كما ورد من غير إضافة ضمير ملكية غير موجود في اليونانية.
- source_word: τις
  choice: أحدٌ
  rationale: «أحد» ينقل المرجع غير المحدد العام في العبارة الشرطية، ويشمل أي شخص من غير تخصيصه بالذكور.
- source_word: αὐτόν
  choice: ـه في «فسيكرمه»
  rationale: يحفظ الضمير المفرد المذكر المطابق نحويًا للمرجع العام «أحد»، وهو استعمال عربي طبيعي في هذا التركيب.
theological_decisions:
- issue: الإحالة العامة بصيغة المفرد المذكر في الشرط
  choice: استعمال «أحد» مع ضمائر المفرد المذكر في «فليتبعني» و«خادمي» و«فسيكرمه»
  alternative: إعادة الصياغة بالجمع أو تكرار «ذلك الشخص» لتجنب ضمائر التذكير
  rationale: يبقى التركيب عامًا شاملًا لأي شخص، مع حفظ صيغة المفرد المطابقة للمصدر واستعمال العربية الطبيعي، من غير حصر المعنى في الرجال.
- issue: طبيعة الكرامة التي يمنحها الآب
  choice: «فسيكرمه الآب» من غير تحديد صورة هذه الكرامة
  alternative: تفسيرها في المتن بأنها مكافأة سماوية أو تمجيد أخروي بعينه
  rationale: يعد النص بكرامة يمنحها الآب، لكنه لا يحدد هنا صورتها؛ لذلك تُحفظ سعة المعنى ولا يُفرض عليه تفسير عقدي أضيق.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعملت «فليتبعني» لحفظ قوة الأمر، و«خادمي» لتجنب الإيحاء بمنصب كنسي، مع إبقاء التوكيد في «أنا» والوعد المستقبلي في «فسيكرمه».
