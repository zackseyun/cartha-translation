  source_fidelity: 'ينقل النص بدقة البنية الشرطية المكررة في اليونانية: خدمة يسوع، والأمر باتباعه، ووعد وجود خادمه حيث يكون هو، ثم وعد إكرام الآب. وتحافظ «حيث أكون أنا» على التوكيد الذي يفيده الضمير ἐγώ، وتنقل «هناك أيضًا» الدلالة المكانية والإضافية في ἐκεῖ καί. ولا يضيف النص تحديدًا لطبيعة الإكرام.'
