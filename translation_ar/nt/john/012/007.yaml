base_translation:
  language: en
  yaml_path: translation/nt/john/012/007.yaml
  text: So Jesus said[a], “Leave her alone[b], so that she may keep it for the day of my burial.”
translation:
  language: ar
  text: 'فقال يسوع: «دعها وشأنها، لكي تحتفظ به ليوم دفني»[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «دعها وشأنها؛ فقد احتفظت به ليوم دفني». يفهم بعضهم العبارة على أنها تصف ما فعلته بالفعل، لا ما قد تفعله لاحقًا.'
    reason: alternative_reading
  - marker: b
    text: 'أو: «دعها وشأنها، لكي تحتفظ به إلى يوم دفني». يمكن أن يُفهم التركيب اليوناني أيضًا بدلالة زمنية أكثر صراحة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: فـ
  rationale: تربط القول بما سبقه وتؤدي معنى الاستمرار أو النتيجة في السرد بأسلوب عربي طبيعي، من غير إثقال العبارة بـ«لذلك».
- source_word: Ἄφες αὐτήν
  choice: دعها وشأنها
  rationale: أمر موجَّه إلى شخص واحد بالكف عن مضايقتها أو الاعتراض عليها. وهذه العبارة واضحة وطبيعية وتحفظ قوة الأمر.
- source_word: ἵνα
  choice: لكي
  rationale: تُبقي علاقة الغرض أو النتيجة المقصودة التي تفيدها الأداة اليونانية، من غير حسم الصعوبة التركيبية في بقية الجملة.
- source_word: εἰς τὴν ἡμέραν
  choice: ليوم
  rationale: تشير إلى المناسبة المستقبلية المقصودة، مع تجنب حصر المعنى في الدلالة الزمنية الصريحة «إلى يوم»؛ وقد أُثبت هذا الاحتمال في الحاشية.
- source_word: ἐνταφιασμοῦ
  choice: دفني
  rationale: «الدفن» هو المقابل العربي الواضح والمألوف، ويحفظ الإشارة المباشرة إلى موت يسوع الوشيك.
- source_word: τηρήσῃ
  choice: تحتفظ
  rationale: يناسب معنى حفظ الشيء أو إبقائه لغرض معين، وصيغة المضارع بعد «لكي» تنقل قراءة الغرض المتجهة إلى الأمام.
- source_word: αὐτό
  choice: به
  rationale: يحفظ الضمير المحايد العائد إلى الطيب من غير إضافة اسم تفسيري غير وارد في النص اليوناني.
theological_decisions:
- issue: 'صلة فعل المرأة بدفن يسوع: أهو احتفاظ مقصود للمستقبل أم وصف لما فعلته بالفعل؟'
  choice: «لكي تحتفظ به ليوم دفني» بوصفها عبارة غرض متجهة إلى يوم الدفن.
  alternative: «فقد احتفظت به ليوم دفني» بوصفها وصفًا لما سبق أن فعلته، أو «لكي تحتفظ به إلى يوم دفني» بدلالة زمنية أصرح.
  rationale: التركيب اليوناني صعب ويحتمل أكثر من فهم. يحافظ النص الرئيس على البنية الظاهرة للأمر متبوعًا بعبارة الغرض، بينما تُذكر القراءات الأخرى في الحواشي حتى لا يُحسم توتر حقيقي في النص من غير بيان.
translation_notes:
  register: العربية فصحى معاصرة واضحة ووقورة. استُعملت «دعها وشأنها» لأنها طبيعية في الخطاب المباشر وتحفظ صيغة الأمر المفرد، واستُعمل «دفني» بدل تعبير تقني مثل «وضعي في القبر». أُبقي الضمير «به» كما في الأصل، اعتمادًا على مرجعه في السياق السابق.
