  text: 'For this reason they were not able to believe, because Isaiah said again:'
translation:
  language: ar
  text: 'لِهٰذَا لَمْ يَكُونُوا قَادِرِينَ عَلَى أَنْ يُؤْمِنُوا، لِأَنَّ إِشَعْيَاءُ قَالَ أَيْضًا:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: لِهٰذَا
  rationale: ينقل رابطة السبب الصريحة مع السياق السابق بعبارة عربية موجزة وطبيعية، لا بمجرد استنتاج مثل «لذلك».
- source_word: οὐκ ἠδύναντο
  choice: لَمْ يَكُونُوا قَادِرِينَ
  rationale: يحفظ معنى عدم القدرة الذي يدل عليه الفعل الناقص، من غير تحويله إلى مجرد عدم رغبة.
- source_word: πιστεύειν
  choice: عَلَى أَنْ يُؤْمِنُوا
  rationale: «يؤمنوا» هو المقابل الطبيعي للفعل في الاستعمال اليوحناوي، وجاء التركيب مع «قادرين على» عربيًّا واضحًا.
- source_word: ὅτι
  choice: لِأَنَّ
  rationale: يفيد السببية هنا، إذ يقدّم قول إشعياء التالي سببًا لعدم قدرتهم على الإيمان.
- source_word: πάλιν
  choice: أَيْضًا
  rationale: يشير إلى قول إضافي لإشعياء بعد الاقتباس السابق؛ و«أيضًا» أفصح في صيغة إدخال اقتباس آخر من «مرة أخرى» التي قد توحي بتكرار القول نفسه.
- source_word: εἶπεν
  choice: قَالَ
  rationale: المقابل العربي المباشر والطبيعي في صيغة تقديم الاقتباس.
- source_word: Ἠσαΐας
  choice: إِشَعْيَاءَ
  rationale: الصيغة العربية الكتابية الشائعة للاسم، منصوبة لأنها فاعل «قال» بعد «أنّ» ضمن تركيب «لأنّ».
theological_decisions:
- issue: طبيعة عدم القدرة على الإيمان
  choice: «لم يكونوا قادرين على أن يؤمنوا»
  alternative: «لم يريدوا أن يؤمنوا» أو تفسير العبارة صراحةً وفق مذهب لاهوتي بعينه
  rationale: النص اليوناني يصرّح بعدم القدرة، لا بمجرد رفض الإرادة. وتحفظ الصياغة هذا التوتر من غير أن تحدد هنا كيفية عمل التقسية الإلهية أو علاقتها بمسؤولية الإنسان.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ومهيبة. استُعملت «أيضًا» للدلالة على اقتباس آخر من إشعياء، وخُتمت الآية بنقطتين لأنها تمهّد للاقتباس التالي.
