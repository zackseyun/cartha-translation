base_translation:
  language: en
  yaml_path: translation/nt/john/012/004.yaml
  text: But Judas Iscariot[a], one of his disciples—the one who was about to betray him—said,
translation:
  language: ar
  text: 'فقال يهوذا الإسخريوطي، أحد تلاميذه، وهو الذي كان مزمعًا أن يسلّمه[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: كان على وشك أن يسلّمه؛ ويمكن ترجمة الفعل أيضًا: «يخونه».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: فقال
  rationale: استُعمل الماضي العربي في السرد بدل الحاضر التاريخي اليوناني، لأن «فقال» هو الأسلوب الطبيعي في العربية ويصل الكلام بما قبله.
- source_word: δὲ
  choice: فـ
  rationale: تفيد الفاء الانتقال والتعقيب في السياق السردي، وتوحي بالتحول من فعل مريم إلى اعتراض يهوذا من غير تشديد التباين أكثر مما يحتمله δέ.
- source_word: Ἰούδας ὁ Ἰσκαριώτης
  choice: يهوذا الإسخريوطي
  rationale: الصيغة العربية الكتابية المألوفة للاسم واللقب، وهي واضحة وطبيعية في العربية الفصحى.
- source_word: εἷς τῶν μαθητῶν αὐτοῦ
  choice: أحد تلاميذه
  rationale: «تلاميذ» تحافظ على علاقة التعلّم من المعلّم التي يدل عليها μαθητής، وهي أدق من «أتباع» هنا.
- source_word: ὁ μέλλων
  choice: وهو الذي كان مزمعًا أن
  rationale: «كان مزمعًا أن» تنقل دلالة التطلع إلى فعل لاحق أو كونه مقبلًا عليه، وتحافظ على العبارة الوصفية الاعتراضية.
- source_word: παραδιδόναι
  choice: يسلّمه
  rationale: المعنى الأساسي للفعل هو التسليم أو الدفع إلى سلطة آخرين. وفي السياق يتضمن هذا الفعل الخيانة، لكن «يسلّمه» يحافظ على المجال الدلالي اليوناني وعلى الصلة اللفظية باستعمالات الفعل الأخرى.
theological_decisions:
- issue: دلالة παραδιδόναι في فعل يهوذا تجاه يسوع
  choice: يسلّمه
  alternative: يخونه
  rationale: «يخونه» يصرّح بالطابع الأخلاقي للفعل، وهو صحيح سياقيًا، أما «يسلّمه» فيحافظ على المعنى المباشر الأوسع للفعل اليوناني ولا يلغي ما يفهمه السياق من خيانة. أُثبت البديل التفسيري في الحاشية حفاظًا على الشفافية.
translation_notes:
  register: عربية فصحى واضحة ذات نبرة سردية وقورة. استُعملت «مزمعًا» لدقتها وإيجازها مع بقائها مفهومة في السياق الكتابي، ووُضع وصف يهوذا بين فواصل للمحافظة على بنية الجملة دون إثقال.
