  yaml_path: translation/nt/john/012/032.yaml
  text: And I[a], when I am lifted up from the earth[c][b], will draw all people to myself.
translation:
  language: ar
  text: وأنا، متى[a] رُفعتُ[b] عن الأرض، سأجذب الجميع[c] إليَّ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إن رُفعتُ». يستعمل اليوناني صيغة شرطية، لكن السياق يشير إلى موت يسوع الوشيك بوصفه أمرًا محققًا.'
    reason: alternative_reading
  - marker: b
    text: 'يمكن أن يحمل «رُفعتُ» أيضًا معنى «مُجِّدتُ»، فيحفظ المعنى المزدوج عند يوحنا: الصلب والتمجيد.'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «جميع الناس». اللفظ اليوناني يعني حرفيًا «الجميع»، ويشير هنا على الأرجح إلى البشر، من غير أن يحسم كيفية ارتباط ذلك بالجدالات اللاهوتية اللاحقة حول مدى الخلاص.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  choice: وأنا
  rationale: تحفظ الواو صلة الكلام بما قبله، ويُبرز الضمير المنفصل شخص المتكلم إبرازًا طبيعيًا في العربية.
- source_word: ἐὰν
  choice: متى
  rationale: الصيغة اليونانية شرطية مع فعل في صيغة الاحتمال، لكن السياق يعرض الحدث بوصفه موت يسوع الوشيك؛ و«متى» تحفظ مسحة التعليق على تحقق الحدث من غير أن تجعله مجرد احتمال.
- source_word: ὑψωθῶ
  choice: رُفعتُ
  rationale: تحفظ معنى الرفع المادي على الصليب، وتبقي في الوقت نفسه إيحاء الرفعة والتمجيد المقصود في إنجيل يوحنا.
- source_word: ἐκ τῆς γῆς
  choice: عن الأرض
  rationale: تعبير عربي طبيعي للرفع والانفصال عن سطح الأرض، ويلائم الإشارة إلى هيئة الصلب التي يوضحها العدد التالي.
- source_word: πάντας
  choice: الجميع
  rationale: صيغة المذكر الجمع في اليونانية تشير هنا طبيعيًا إلى البشر؛ و«الجميع» واسعة الدلالة من غير أن تحسم كيفية ارتباط هذا الشمول بجدالات الخلاص اللاحقة.
- source_word: ἑλκύσω
  choice: سأجذب
  rationale: «أجذب» تنقل معنى الاستمالة أو السحب نحو جهة، من غير أن تحدد آلية هذا الجذب أو درجته بأكثر مما يحدده النص.
- source_word: πρὸς ἐμαυτόν
  choice: إليَّ
  rationale: تنقل الاتجاه نحو شخص يسوع بصياغة عربية فصيحة وطبيعية؛ ودلالة العائد مفهومة من اتحاد الفاعل والمرجع في السياق.
theological_decisions:
- issue: مدى شمول πάντας وصلته بالخلاص
  choice: الجميع
  alternative: جميع الناس؛ كلَّ شيء
  rationale: المفعول اليوناني مذكر جمع، ولذلك يُفهم طبيعيًا على البشر لا على الأشياء. وتحفظ «الجميع» سعة العبارة من غير أن تقرر هل المقصود كل فرد بلا استثناء أم الناس على اختلاف فئاتهم.
- issue: المعنى المزدوج للفعل ὑψωθῶ عند يوحنا
  choice: رُفعتُ
  alternative: مُجِّدتُ؛ ارتفعتُ
  rationale: «رُفعتُ» تُبقي معًا الإشارة الجسدية إلى الصلب والإيحاء اللاهوتي بالرفعة والتمجيد، فلا تختزل التوتر المقصود في أحد المعنيين.
- issue: القوة الشرطية في ἐὰν ὑψωθῶ
  choice: متى رُفعتُ
  alternative: إن رُفعتُ
  rationale: «متى» توافق يقين الحدث الوشيك في السياق، بينما تُذكر الصيغة الشرطية الحرفية في الحاشية حتى لا تُمحى البنية اليونانية.
