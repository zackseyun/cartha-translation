  text: ومع أنه[a] كان قد صنع أمامهم آيات كثيرة جدًا، فإنهم لم يؤمنوا به[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ويمكن أن تترجم البداية: «لكن مع أنه كان قد صنع أمامهم آيات كثيرة جدًا».'
    reason: صياغة بديلة لأداة الربط وبنية التنازل.
  - marker: b
    text: 'ويمكن أن تترجم: «ظلوا لا يؤمنون به»؛ فصيغة الفعل اليوناني قد تشير إلى عدم إيمان مستمر أو متكرر.'
    reason: بيان الدلالة الزمنية المحتملة للفعل الماضي الناقص.
lexical_decisions:
- source_word: τοσαῦτα
  choice: كثيرة جدًا
  rationale: تؤدي المعنى الكمي المؤكد، أي كثرة عدد الآيات، بعبارة عربية واضحة وطبيعية.
- source_word: δὲ
  choice: ومع أن
  rationale: 'يظهر معنى المقابلة مع السياق السابق ضمن تركيب يفيد التنازل: على الرغم من كثرة الآيات، بقي عدم الإيمان.'
- source_word: σημεῖα
  choice: آيات
  rationale: 'تحافظ «آيات» على دلالة المصطلح اليوحناوي: أعمال خارقة تشير إلى حقيقة تتجاوز العمل نفسه، بخلاف «معجزات» التي قد تبرز الجانب الخارق وحده.'
- source_word: πεποιηκότος
  choice: كان قد صنع
  rationale: ينقل سبق الفعل الذي يفيده اسم الفاعل التام، مع بقاء نتائج الآيات حاضرة في الموقف.
- source_word: ἔμπροσθεν αὐτῶν
  choice: أمامهم
  rationale: تفيد أن الآيات صُنعت علنًا وفي حضورهم.
- source_word: οὐκ ἐπίστευον
  choice: لم يؤمنوا
  rationale: صياغة عربية طبيعية للماضي الناقص اليوناني، مع بيان احتمال الاستمرار أو التكرار في الحاشية بدل تحميل المتن تعبيرًا تفسيريًا زائدًا.
- source_word: εἰς αὐτόν
  choice: به
  rationale: هذا هو التعبير العربي المألوف عن الإيمان بشخص، ويؤدي معنى πιστεύω مع εἰς دون حرفية متكلفة.
theological_decisions:
- issue: دلالة الماضي الناقص في عدم الإيمان
  choice: لم يؤمنوا به
  alternative: ظلوا لا يؤمنون به
  rationale: يحافظ المتن على العربية الطبيعية، بينما تسجل الحاشية احتمال دلالة الفعل على حالة مستمرة أو متكررة، من غير أن تضيف معنى الرفض المتعمد غير المصرح به.
- issue: العلاقة بين الآيات وعدم الإيمان
  choice: ومع أنه... فإنهم لم يؤمنوا
  alternative: لكن مع أنه... لم يؤمنوا
  rationale: ينقل التركيب معنى المفارقة والتنازل بوضوح، من غير تفسير سبب عدم الإيمان أو حسم التوتر اللاهوتي في النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «آيات» للمحافظة على المصطلح اليوحناوي، وصيغت الجملة تنازليًا لإبراز المفارقة بين كثرة الآيات وعدم الإيمان.
