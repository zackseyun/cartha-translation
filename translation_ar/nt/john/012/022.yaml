  yaml_path: translation/nt/john/012/022.yaml
  text: Philip comes and tells Andrew[a]; Andrew and Philip come and tell Jesus.
translation:
  language: ar
  text: فيأتي فيلبس ويخبر أندراوس[a]، ويأتي أندراوس وفيلبس ويخبران يسوع.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يستعمل اليوناني المضارع التاريخي في الآية كلها: «يأتي... يخبر... يأتي... يخبران»، وهو أسلوب سردي شائع يضفي على الحدث حيوية وفورية. وكثيرًا ما تنقله الترجمات بصيغة الماضي.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: يأتي
  rationale: أُبقي المضارع التاريخي ليحافظ النص على حيوية السرد في اليونانية، بدل تحويله إلى الماضي.
- source_word: λέγει / λέγουσιν
  choice: يخبر / يخبران
  rationale: الفعل هنا يدل على نقل كلام إلى شخص؛ وصيغة «يخبر» طبيعية وواضحة في العربية، مع مطابقة التثنية في الجملة الثانية.
- source_word: ὁ Φίλιππος
  choice: فيلبس
  rationale: نُقل الاسم بصيغته العربية الكتابية الشائعة، ولم تُترجم أداة التعريف اليونانية لأنها غير ذات دلالة خاصة هنا.
- source_word: τῷ Ἀνδρέᾳ
  choice: أندراوس
  rationale: نُقل الاسم بصيغته العربية الشائعة، وعُبّر عن المفعول غير المباشر بمفعول به مباشر يلائم الفعل «يخبر».
- source_word: τῷ Ἰησοῦ
  choice: يسوع
  rationale: نُقل الاسم بصيغته العربية الشائعة، وجاء مفعولًا به مباشرًا مع «يخبران» وفق الاستعمال العربي الطبيعي.
- source_word: καί
  choice: و
  rationale: حُفظ الربط البسيط المتتابع في الأصل من غير إضافة معنى زمني أو سببي غير مصرّح به.
