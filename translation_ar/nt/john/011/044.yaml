source:
  edition: SBLGNT
  text: ⸀ἐξῆλθεν ὁ τεθνηκὼς δεδεμένος τοὺς πόδας καὶ τὰς χεῖρας κειρίαις, καὶ ἡ ὄψις αὐτοῦ σουδαρίῳ περιεδέδετο. λέγει ⸂αὐτοῖς ὁ Ἰησοῦς⸃· Λύσατε αὐτὸν καὶ ἄφετε ⸀αὐτὸν ὑπάγειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/044.yaml
  text: The man who had died came out, his feet and hands bound with burial cloths, and his face wrapped with a cloth. Jesus says to them, “Unbind him and let him go.”
translation:
  language: ar
  text: 'فخرج الذي كان ميتًا، وكانت يداه ورجلاه مربوطتين بلفائف جنائزية، وكان وجهه ملفوفًا بمنديل. فقال لهم يسوع: «حلّوه ودعوه يذهب».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ τεθνηκώς
  choice: الميت
  rationale: اسم فاعل تام يفيد الشخص الذي مات؛ و«الميت» صياغة عربية طبيعية موجزة، والسياق يوضح عودته إلى الحياة.
- source_word: κειρίαις
  choice: بأكفان
  rationale: تشير إلى لفائف أو أربطة قماشية جنائزية؛ و«أكفان» لفظ عربي واضح في سياق الدفن، مع أن اليونانية أقرب حرفيًا إلى قطع أو أربطة القماش.
- source_word: ἡ ὄψις
  choice: وجهه
  rationale: تعني هنا ظاهر الوجه أو الوجه، وهو المقصود في سياق تغطيته بالمنديل.
- source_word: σουδαρίῳ
  choice: بمنديل
  rationale: قطعة قماش منفصلة لُف بها الوجه؛ «منديل» هو المقابل التقليدي الواضح، من دون افتراض هيئة دقيقة للقماش.
- source_word: Λύσατε
  choice: حلّوه
  rationale: يحافظ على معنى فك القيود أو الأربطة بصيغة أمر مباشرة.
- source_word: ἄφετε αὐτὸν ὑπάγειν
  choice: دعوه يذهب
  rationale: ينقل تركيب الإذن في اليونانية طبيعيًا، من غير تحديد وجهة الذهاب.
theological_decisions:
- issue: وصف لعازر بعد خروجه من القبر
  choice: الميت
  alternative: الذي كان قد مات
  rationale: يحافظ على التعبير الاسمي المكثف في اليونانية، ولا ينفي أن خروجه نفسه دليل إحيائه.
- issue: زمن فعل كلام يسوع
  choice: فقال
  alternative: فيقول
  rationale: المضارع التاريخي اليوناني يُنقل طبيعيًا في السرد العربي بالماضي؛ لا يترتب على الاختيار فرق لاهوتي.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة، بصياغة سردية طبيعية. تُجنبت التفاصيل غير المصرح بها عن هيئة الأكفان أو طريقة ربط الجسد.
