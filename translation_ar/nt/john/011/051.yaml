  yaml_path: translation/nt/john/011/051.yaml
  text: He did not say this from himself[a], but being high priest that year, he prophesied that Jesus was going to die for the nation[c][b],
translation:
  language: ar
  text: أما هذا فلم يقله من عند نفسه[a]، بل إنه، بصفته رئيس الكهنة في تلك السنة، تنبأ بأن يسوع كان سيموت من أجل الأمة[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «من تلقاء نفسه».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «نيابةً عن الأمة». ويمكن أيضًا ترجمة «كان سيموت»: «كان مزمعًا أن يموت» أو «كان مُقدَّرًا له أن يموت».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δὲ
  choice: لكنه لم يقل هذا
  rationale: نُقلت δέ بأداة استدراك خفيفة تلائم المقابلة اللاحقة، من غير إضافة دلالة زمنية غير موجودة في اليونانية.
- source_word: ἀφ’ ἑαυτοῦ
  choice: من عند نفسه
  rationale: تعبير عربي طبيعي يحفظ معنى مصدر القول، أي إنه لم ينشأ من قيافا وحده أو بمبادرته الخاصة.
- source_word: ἀλλὰ ἀρχιερεὺς ὢν τοῦ ἐνιαυτοῦ ἐκείνου
  choice: بل إذ كان رئيسًا للكهنة في تلك السنة
  rationale: تحفظ «إذ كان» البنية الحالية وما فيها من معنى خلفي أو سببي، وتؤدي العبارة الزمنية بوضوح.
- source_word: ἐπροφήτευσεν
  choice: تنبأ
  rationale: ينقل الفعل دلالته النبوية الصريحة من غير إضافة حكم على وعي قيافا أو حاله الروحية.
- source_word: ἔμελλεν ... ἀποθνῄσκειν
  choice: كان مزمعًا أن يموت
  rationale: «مزمعًا» تحفظ التوجه المستقبلي واحتمال معنى الحدث المقرر أو الوشيك، من غير حصره في قرب زمني شديد.
- source_word: ὑπὲρ τοῦ ἔθνους
  choice: من أجل الأمة
  rationale: «من أجل» تؤدي المعنى النفعي أو التمثيلي الواسع لحرف الجر، بينما تحافظ «الأمة» على المفرد والإشارة السياقية إلى الأمة اليهودية.
theological_decisions:
- issue: طبيعة نبوة قيافا
  choice: إثبات أن كلامه كان نبوة لكونه رئيسًا للكهنة في تلك السنة، من غير تحديد مدى وعيه بها أو تقديم نظرية كاملة للوحي.
  alternative: أن يكون قيافا قد تنبأ بوعي كامل، أو أن يكون الكلام مجرد مفارقة لا نبوة حقيقية.
  rationale: النص يصرح بأنه «تنبأ»، ولذلك تُحفظ القوة النبوية الحقيقية مع عدم تجاوز ما يقوله النص عن قصده الداخلي.
- issue: دلالة ὑπὲρ في موت يسوع
  choice: من أجل الأمة
  alternative: نيابة عن الأمة؛ بدلًا من الأمة
  rationale: الصياغة المختارة تبقي المجال الدلالي النفعي والتمثيلي مفتوحًا، ولا تفرض في المتن صيغة كفارية تقنية أضيق مما يقتضيه هذا الموضع وحده.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُعمل «رئيسًا للكهنة» بوصفه المقابل الكتابي المألوف، و«مزمعًا» للحفاظ بإيجاز على مرونة μέλλω. وُضعت علامتا الحاشية في المتن، ودُمج البديلان المتعلقان بالعبارة الختامية في حاشية واحدة لتجنب تتابع علامتين عند الموضع نفسه.
