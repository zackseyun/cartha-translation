  source_fidelity: المعنى العام منقول بأمانة، بما في ذلك المصدر غير الذاتي للقول، والنبوة، وموت يسوع من أجل الأمة. لكن «رئيسًا للكهنة» أقل دقة من لقب ἀρχιερεύς المفرد؛ والأوضح في العربية الكتابية المعاصرة هو «رئيس الكهنة». كما أن «كان مزمعًا أن يموت» قد توحي في الاستعمال المعاصر بقصد الفاعل، في حين أن «كان سيموت» تنقل مستقبلية μέλλω بوضوح ومن دون إيحاءات زائدة.
  naturalness: 'الصياغة المقترحة أكثر سلاسة في الفصحى المعاصرة: «أما هذا فلم يقله...» تؤدي الانتقال الذي تفيده δέ من غير استدراك أقوى من اللازم، و«بصفته رئيس الكهنة» طبيعية وتحافظ على وظيفة اسم الفاعل اليوناني.'
  terminology: يُستحسن اعتماد «رئيس الكهنة» للمنصب المفرد، لا «رئيس للكهنة» التي قد تُفهم بمعنى رئيسٍ على جماعة الكهنة. وتبقى «الأمة» مناسبة لـ ἔθνος في هذا السياق، و«من أجل» تحافظ على سعة ὑπέρ.
