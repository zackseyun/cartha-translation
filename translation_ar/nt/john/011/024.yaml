  yaml_path: translation/nt/john/011/024.yaml
  text: Martha said to him[a], “I know that he will rise again in the resurrection on the last day.”
translation:
  language: ar
  text: 'قالت له مرثا: «أنا أعلم أنه سيقوم في القيامة في اليوم الأخير».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «سيقوم عند القيامة في اليوم الأخير».'
    reason: بديل لغوي ممكن لحرف الجر ἐν قبل «القيامة».
lexical_decisions:
- source_word: λέγει
  choice: فقالت
  rationale: المضارع التاريخي اليوناني يُنقل بالماضي في السرد العربي الطبيعي، واقترنت الفاء بالسياق الحواري.
- source_word: αὐτῷ
  choice: له
  rationale: ترجمة طبيعية لضمير المفعول غير المباشر مع فعل القول.
- source_word: ἡ Μάρθα
  choice: مرثا
  rationale: نقل للاسم بصيغته العربية الكتابية الشائعة.
- source_word: Οἶδα
  choice: أنا أعلم
  rationale: يحفظ تقرير مرثا الواثق للمعرفة، وإظهار الضمير يلائم نبرة التأكيد.
- source_word: ἀναστήσεται
  choice: سيقوم
  rationale: الفعل في سياق القيامة يعني النهوض من الموت؛ والصيغة العربية تحافظ على المنظور غير المبني للمجهول في اليونانية.
- source_word: ἐν τῇ ἀναστάσει
  choice: في القيامة
  rationale: يحافظ على حرف الجر وصياغة النص، مع دلالة زمن القيامة ومجالها.
- source_word: ἐν τῇ ἐσχάτῃ ἡμέρᾳ
  choice: في اليوم الأخير
  rationale: تعبير عربي واضح ومألوف يحفظ حرف الجر والتحديد الأخروي.
theological_decisions:
- issue: الإشارة إلى القيامة الأخروية
  choice: «سيقوم في القيامة في اليوم الأخير»
  alternative: فهم العبارة على أنها رجاء عام في حياة بعد الموت
  rationale: تكرار جذر القيامة مع عبارة «اليوم الأخير» يدل على قيامة مستقبلية محددة، من غير إضافة تفاصيل عقائدية لا يصرح بها النص.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة؛ استُخدم الماضي في إطار الحوار، مع إبقاء تكرار «سيقوم/القيامة» المقصود في الأصل وعدم تسويته أسلوبيًا.
