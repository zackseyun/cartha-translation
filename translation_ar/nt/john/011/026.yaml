  text: And everyone who lives and believes in me will certainly never die forever. Do you believe this?
translation:
  language: ar
  text: وكلُّ مَن هو حيٌّ ويؤمن بي فلن يموت إلى الأبد. أتؤمن بهذا؟
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς ὁ ζῶν καὶ πιστεύων εἰς ἐμέ
  choice: كلُّ مَن كان حيًّا ويؤمن بي
  rationale: يحافظ على الاسمين الموصولين الدالين على الحال والاستمرار، ويصوغ العبارة بعربية واضحة من غير دمجهما في مفهوم لاهوتي واحد.
- source_word: οὐ μὴ ἀποθάνῃ
  choice: فلن يموت
  rationale: «لن» تنقل النفي اليوناني المؤكد بصياغة عربية طبيعية وقوية.
- source_word: εἰς τὸν αἰῶνα
  choice: إلى الأبد
  rationale: المقابل الاصطلاحي الطبيعي للعبارة الزمنية، مع إبقاء التوتر المقصود بين الموت الجسدي والحياة التي يتحدث عنها السياق بدل تفسيره داخل المتن.
- source_word: πιστεύεις τοῦτο;
  choice: أتؤمن بهذا؟
  rationale: ينقل السؤال المباشر الموجَّه إلى المخاطبة المفردة بإيجاز ووضوح.
theological_decisions:
- issue: معنى عدم الموت مع واقع الموت الجسدي
  choice: فلن يموت إلى الأبد
  alternative: فلن يموت أبدًا
  rationale: يحافظ الاختيار على البنية الزمنية لعبارة εἰς τὸν αἰῶνα وعلى التوتر اللاهوتي في قول يسوع، من غير إضافة تفسير مثل «موتًا أبديًا» لا يرد صراحة في النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدم «كان حيًّا» لتجنب ثقل «كل الحي» في العربية، مع إبقاء «يؤمن» بصيغة المضارع. لا توجد حواشٍ، ولذلك لا توجد علامات حواشٍ في المتن.
