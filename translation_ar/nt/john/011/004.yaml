source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὁ Ἰησοῦς εἶπεν· Αὕτη ἡ ἀσθένεια οὐκ ἔστιν πρὸς θάνατον ἀλλ’ ὑπὲρ τῆς δόξης τοῦ θεοῦ ἵνα δοξασθῇ ὁ υἱὸς τοῦ θεοῦ δι’ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/004.yaml
  text: But when Jesus heard it[a], he said, “This sickness is not unto death, but for the glory of God, so that the Son of God may be glorified through it.”
translation:
  language: ar
  text: 'فلما سمع يسوع ذلك، قال: «هذا المرض ليس للموت[a]، بل لمجد الله، لكي يتمجّد ابن الله به».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لا يؤول إلى الموت». قد يدل التعبير اليوناني على أن الموت ليس المآل النهائي أو الغاية من هذا المرض.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας δὲ ὁ Ἰησοῦς
  choice: فلما سمع يسوع ذلك
  rationale: تنقل العبارة الظرف الزمني للمصدر اليوناني مع انتقال سردي طبيعي؛ وأُضيف اسم الإشارة «ذلك» بحسب السياق، أي خبر مرض لعازر.
- source_word: ἀσθένεια
  choice: المرض
  rationale: لفظ عربي واضح وواسع الدلالة يناسب حالة لعازر من غير إيحاء طبي تخصصي.
- source_word: οὐκ ἔστιν πρὸς θάνατον
  choice: ليس للموت
  rationale: تحافظ اللام على دلالة الغاية أو المآل في πρὸς، وتُبقي التوتر السردي قائمًا لأن لعازر يموت لاحقًا، من غير تحويل القول إلى نفي مسطح لوقوع الموت.
- source_word: ὑπὲρ τῆς δόξης τοῦ θεοῦ
  choice: لمجد الله
  rationale: صياغة عربية موجزة وطبيعية تعبّر هنا عن الغاية أو ما يؤول إلى إظهار مجد الله.
- source_word: ἵνα δοξασθῇ
  choice: لكي يتمجّد
  rationale: «لكي» تنقل غرض ἵνα، وصيغة «يتمجّد» تحفظ المبني للمجهول في الفعل اليوناني.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: ابن الله
  rationale: الترجمة العربية المباشرة والدقيقة للقب المسيح في النص.
- source_word: δι’ αὐτῆς
  choice: به
  rationale: تنقل معنى الوسيلة في διά مع المضاف إليه، والضمير يعود إلى المرض؛ والتذكير يوافق «المرض» في العربية.
theological_decisions:
- issue: معنى «ليس للموت» مع أن لعازر يموت لاحقًا في الرواية
  choice: الإبقاء على عبارة «ليس للموت» بما يسمح بأن الموت ليس المآل النهائي أو الغاية من المرض.
  alternative: «لا يؤدي إلى الموت» أو فهمه نفيًا مطلقًا لوقوع موت لعازر.
  rationale: تركيب πρὸς θάνατον يحتمل دلالة المآل أو الغاية، وسياق يوحنا 11 يُظهر وقوع الموت ثم تجاوزه؛ لذلك تحفظ الصياغة التوتر ولا تحسمه بتفسير زائد.
- issue: العلاقة بين مجد الله وتمجيد ابن الله
  choice: 'إبقاء العبارتين متميزتين: المرض لمجد الله، والغاية أن يتمجّد ابن الله به.'
  alternative: دمج العبارتين في قول عام واحد عن المجد الإلهي.
  rationale: النص اليوناني يذكر مجد الله وتمجيد الابن صراحةً وفي علاقة غائية، فينبغي الحفاظ على كليهما من غير إضافة شرح عقائدي.
translation_notes:
  register: فصحى معاصرة واضحة وكريمة النبرة. اختير «فلما» للربط الزمني السلس، وحُفظت العبارة المقصودة «ليس للموت» مع حاشية توضّح مجال دلالتها من غير إزالة الغموض أو التوتر اللاهوتي.
