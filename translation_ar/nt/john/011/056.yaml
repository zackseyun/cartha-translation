  text: ἐζήτουν οὖν τὸν Ἰησοῦν καὶ ἔλεγον μετ’ ἀλλήλων ἐν τῷ ἱερῷ ἑστηκότες· Τί δοκεῖ ὑμῖν; ὅτι οὐ μὴ ἔλθῃ εἰς τὴν ἑορτήν;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/056.yaml
  text: So they were looking for Jesus and saying to one another as they stood in the temple courts[b][a], “What do you think? That he certainly will not come to the feast?”
translation:
  language: ar
  text: 'فكانوا يبحثون عن يسوع، ويقول بعضهم لبعض، وهم واقفون في ساحات الهيكل[a]: «ما رأيكم؟ ألن يأتي إلى العيد البتة؟»[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: اللفظ اليوناني يشير إلى مجمّع الهيكل وساحاته، لا إلى المقدس الداخلي تحديدًا.
    reason: cultural_note
  - marker: b
    text: 'أو: «إنه لن يأتي إلى العيد البتة؟» فاليونانية تستخدم نفيًا مؤكدًا (οὐ μή).'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτουν
  choice: أخذوا يبحثون عن
  rationale: الماضي الناقص يدل على فعل مستمر أو متكرر في ذلك المشهد؛ وهذه الصياغة تنقل الاستمرار بلغة عربية طبيعية.
- source_word: οὖν
  choice: فـ
  rationale: تربط الآية بما قبلها بوصفها استمرارًا أو نتيجة سياقية موجزة.
- source_word: ἔλεγον μετ’ ἀλλήλων
  choice: ويقول بعضهم لبعض
  rationale: ينقل الفعل المستمر والمعنى التبادلي للمحادثة داخل الجماعة.
- source_word: ἐν τῷ ἱερῷ
  choice: في ساحات الهيكل
  rationale: اللفظ ἱερόν يشير إلى مجمّع الهيكل أو أروقته وساحاته، لا إلى المقدس الداخلي وحده.
- source_word: ἑστηκότες
  choice: وهم واقفون
  rationale: يحافظ على دلالة اسم الفاعل في صيغة التمام، أي حالتهم القائمة وقت الحديث.
- source_word: Τί δοκεῖ ὑμῖν;
  choice: ما رأيكم؟
  rationale: تعبير عربي واضح وطبيعي للسؤال عن تقدير المخاطبين أو رأيهم.
- source_word: ὅτι οὐ μὴ ἔλθῃ
  choice: ألن يأتي ... قطعًا؟
  rationale: يحافظ على كون العبارة سؤالًا تابعًا لسؤال الرأي، وينقل النفي اليوناني المؤكد دون تحويله إلى تقرير قاطع.
- source_word: εἰς τὴν ἑορτήν
  choice: إلى العيد
  rationale: لفظ موجز ومألوف في سياق أعياد اليهود، والسياق السابق يحدد أنه عيد الفصح.
theological_decisions:
- issue: قوة النفي وصيغة السؤال في οὐ μὴ ἔλθῃ
  choice: «ألن يأتي إلى العيد قطعًا؟»
  alternative: «إنه لن يأتي إلى العيد قطعًا؟» أو «ترى، ألا يأتي إلى العيد؟»
  rationale: النص يجمع سؤال الرأي مع نفي مؤكد. الصياغة المختارة تبقي الكلام استفهاميًا وتحفظ قوة النفي، من غير الجزم بما إذا كان المتكلمون يتوقعون غيابه أو يتعجبون من احتمال ذلك.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «ساحات الهيكل» لتمييز مجمّع الهيكل من المقدس الداخلي، وحُفظت قوة النفي مع إبقاء العبارة سؤالًا تداوليًا طبيعيًا.
