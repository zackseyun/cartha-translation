base_translation:
  language: en
  yaml_path: translation/nt/john/011/039.yaml
  text: Jesus said[a], “Take away the stone.” Martha, the sister of the dead man, said to him, “Lord, by now he smells[c][b], for he has been dead four days.”
translation:
  language: ar
  text: 'قال يسوع: «أزيلوا الحجر». فقالت له مرثا، أخت الذي مات[a]: «يا رب، فقد أنتن[b]، إذ مضى على موته أربعة أيام[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أخت الميت».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «صارت له رائحة كريهة»؛ والفعل اليوناني يعني أن تنبعث منه رائحة، وهي هنا رائحة كريهة.'
    reason: lexical_alternative
  - marker: c
    text: 'حرفيًا: «إنه في يومه الرابع»؛ أي مضى على موته أربعة أيام.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄρατε
  choice: ارفعوا
  rationale: فعل أمر موجَّه إلى جماعة، ومع الحجر الذي يسد القبر يفيد رفعه وإبعاده. «ارفعوا الحجر» تعبير عربي طبيعي ومباشر.
- source_word: τὸν λίθον
  choice: الحجر
  rationale: يشير في سياق القبر إلى الحجر الموضوع على مدخله، و«الحجر» هو المقابل العربي الواضح والمألوف.
- source_word: τοῦ τετελευτηκότος
  choice: الذي مات
  rationale: اسم فاعل تام يدل على من مات وبقي في حالة الموت. تحافظ الصياغة على معنى الأصل من غير إدخال اسم لعازر غير المذكور في الآية.
- source_word: Κύριε
  choice: يا رب
  rationale: يحفظ اللقب κύριος ووزنه في إنجيل يوحنا، مع بقائه نداءً طبيعيًا في كلام مرثا.
- source_word: ἤδη ὄζει
  choice: لقد أنتن الآن
  rationale: الفعل ὄζει يعني صدور رائحة، وهي في السياق رائحة كريهة ناتجة عن الموت. «أنتن» دقيق وموجز، و«الآن» ينقل الدلالة الزمنية لـἤδη.
- source_word: τεταρταῖος γάρ ἐστιν
  choice: فهذا يومه الرابع
  rationale: يحافظ على الصورة اليونانية المكثفة، أي إنه في اليوم الرابع منذ موته، مع صياغة عربية مفهومة ومن دون تكرار فعل الموت صراحة.
theological_decisions:
- issue: دلالة κύριος في خطاب مرثا ليسوع
  choice: يا رب
  alternative: يا سيدي
  rationale: «يا رب» يحفظ الثقل المحتمل للقب في السياق اليوحناوي ولا يختزله إلى مجرد مجاملة اجتماعية، من غير أن يفرض على هذه العبارة وحدها تصريحًا لاهوتيًا كاملًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «أنتن» لدقة المعنى مع شرح أقل حدّة في الحاشية، وحُفظت العبارة اليونانية المكثفة «فهذا يومه الرابع» مع توضيحها.
