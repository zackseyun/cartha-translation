base_translation:
  language: en
  yaml_path: translation/nt/john/011/011.yaml
  text: After saying these things[a], he said to them, “Lazarus our friend has fallen asleep, but I am going so that I may wake him up.”
translation:
  language: ar
  text: 'قال هذه الأمور، ثم قال لهم: «لعازر صديقنا قد نام، لكنني ذاهب لأوقظه».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي، بتعبير أوضح: «قد مات». يستعمل يسوع النوم هنا مجازًا عن الموت، لكن التلاميذ يسيئون فهم كلامه في الآيات التالية.'
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα εἶπεν, καὶ μετὰ τοῦτο
  choice: قال هذا، ثم
  rationale: يحفظ تعاقب الفعلين في اليونانية بصياغة عربية طبيعية، ويعيد اسم الإشارة إلى الكلام السابق دون إثقال العبارة.
- source_word: λέγει αὐτοῖς
  choice: قال لهم
  rationale: حُوِّل المضارع التاريخي إلى الماضي الملائم للسرد العربي.
- source_word: Λάζαρος ὁ φίλος ἡμῶν
  choice: لعازر صديقنا
  rationale: صياغة عربية مباشرة وطبيعية تحافظ على دلالة العلاقة.
- source_word: κεκοίμηται
  choice: قد نام
  rationale: يحفظ استعارة النوم للموت، كما يحافظ «قد» مع الماضي على دلالة الحالة الناتجة عن الفعل التام.
- source_word: ἀλλὰ πορεύομαι
  choice: لكنني ذاهب
  rationale: يحفظ التقابل ودلالة الحركة المقصودة الوشيكة بصياغة عربية جارية.
- source_word: ἵνα ἐξυπνίσω αὐτόν
  choice: لأوقظه
  rationale: اللام تفيد الغرض بوضوح، و«أوقظه» تواصل صورة النوم من غير تفسير مبكر.
theological_decisions:
- issue: هل تُفسَّر κεκοίμηται في المتن بمعنى الموت أم تُحفَظ استعارة النوم؟
  choice: 'إبقاء الاستعارة: «قد نام»'
  alternative: «قد مات»
  rationale: يتعمد يسوع استعمال صورة النوم هنا، ويسيء التلاميذ فهمها في الآيات التالية؛ لذلك يحفظ المتن التوتر السردي، وتوضح الحاشية المقصود.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة. استُخدمت صياغة موجزة طبيعية، مع الحفاظ على استعارة النوم والتسلسل السردي في الأصل اليوناني.
