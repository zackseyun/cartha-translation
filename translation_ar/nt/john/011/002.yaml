  text: ἦν δὲ ⸀Μαριὰμ ἡ ἀλείψασα τὸν κύριον μύρῳ καὶ ἐκμάξασα τοὺς πόδας αὐτοῦ ταῖς θριξὶν αὐτῆς, ἧς ὁ ἀδελφὸς Λάζαρος ἠσθένει.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/002.yaml
  text: It was Mary who had anointed the Lord with perfume and wiped his feet with her hair[a], whose brother Lazarus was sick.
translation:
  language: ar
  text: وكانت مريم هي التي دهنت الرب بالطيب ومسحت قدميه بشعرها[a]؛ وكان أخوها لعازر مريضًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «بمرهم عطري» أو «بزيت عطري»؛ فالكلمة اليونانية تشير إلى زيت أو مرهم معطّر.
    reason: بديل معجمي يوضح المجال الدلالي لكلمة μύρον.
lexical_decisions:
- source_word: ἦν δὲ
  choice: وكانت ... هي
  rationale: تنقل الواو قوة δέ الانتقالية في السياق، بينما تفيد «كانت ... هي» معنى التعريف والتعيين في التركيب اليوناني من غير إضافة ظرف زمني غير موجود في الأصل.
- source_word: Μαριὰμ
  choice: مريم
  rationale: الصيغة العربية المألوفة للاسم في التقليد الكتابي والاستعمال العام.
- source_word: ἡ ἀλείψασα
  choice: التي دهنت
  rationale: تحوّل اسم الفاعل المعرّف إلى جملة صلة عربية طبيعية، وتحافظ على وصف مريم بالفعل الذي يعرّفها.
- source_word: τὸν κύριον
  choice: الرب
  rationale: يحفظ اللقب الموجّه إلى يسوع وثقله السردي واللاهوتي، بدل اختزاله إلى معنى اجتماعي مثل «السيد» أو «المعلّم».
- source_word: μύρῳ
  choice: بالطيب
  rationale: «الطيب» لفظ عربي واضح وفصيح يدل في هذا السياق على مادة عطرية من زيت أو مرهم، مع بيان البدائل الأدق في الحاشية.
- source_word: καὶ ἐκμάξασα
  choice: ومسحت
  rationale: ينقل المعنى المباشر للفعل، أي المسح أو التجفيف بالمسح، بصياغة عربية طبيعية.
- source_word: τοὺς πόδας αὐτοῦ
  choice: قدميه
  rationale: ترجمة مباشرة وموجزة للمفعول به مع ضمير الملكية.
- source_word: ταῖς θριξὶν αὐτῆς
  choice: بشعرها
  rationale: تنقل دلالة الأداة في حالة الجر اليونانية بالباء العربية، وتحافظ على التعبير الطبيعي.
- source_word: ἧς ὁ ἀδελφὸς Λάζαρος
  choice: وكان لعازر ... أخاها
  rationale: تفك الجملة الموصولة اليونانية إلى جملة عربية مستقلة لتجنب ثقل التراكيب المتداخلة، مع الحفاظ على كون لعازر أخا مريم.
- source_word: ἠσθένει
  choice: المريض
  rationale: يفيد المرض الجسدي في السياق. جرى إدماجه وصفًا للعازر ضمن صياغة عربية طبيعية، والسياق السابق يثبت استمرار مرضه.
theological_decisions:
- issue: ترجمة κύριος لقبًا ليسوع
  choice: الرب
  alternative: السيد
  rationale: «الرب» يحافظ على الوزن السردي واللاهوتي للقب في إنجيل يوحنا من غير حصره في معنى السيادة الاجتماعية، مع إبقاء هوية المشار إليه كما يعرضها النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدمت جملتان مربوطتان بفاصلة منقوطة لتخفيف تراكم جمل الصلة، مع الحفاظ على تعيين مريم وصلتها بلعازر. يظهر رمز الحاشية [a] في المتن مباشرة بعد العبارة التي يشرحها.
