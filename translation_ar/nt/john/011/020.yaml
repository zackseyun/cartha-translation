  text: So when Martha heard that Jesus was coming[a], she went to meet him; but Mary was sitting in the house.
translation:
  language: ar
  text: فلما سمعت مرثا أن يسوع آتٍ[a]، ذهبت للقائه؛ أما مريم فكانت جالسة في البيت.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أن يسوع يأتي». يستعمل النص اليوناني فعلًا مضارعًا في الخبر المنقول، ويمكن نقله بصورة أكثر حرفية بمضارع تصويري.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: فـ
  rationale: تفيد استئناف السرد مع صلة سببية أو استنتاجية بالسياق السابق، وتؤدي الفاء هذا المعنى طبيعيًا في العربية.
- source_word: ὡς
  choice: لما
  rationale: تدخل هنا على جملة زمنية، و«لما» واضحة وفصيحة من غير أن تضيف معنى الفورية الذي قد توحي به «حالما».
- source_word: ἤκουσεν
  choice: سمعت
  rationale: تنقل المعنى المباشر للفعل ἀκούω من دون استبداله بتفسير مثل «علمت».
- source_word: ἔρχεται
  choice: آتٍ
  rationale: يحافظ اسم الفاعل على الحضور والحركة الجارية اللذين يفيدهما المضارع اليوناني، ويلائم سياق الخبر المنقول في العربية. ويمكن أيضًا صياغته بفعل ماضٍ مستمر بحسب منظور السرد.
- source_word: ὑπήντησεν
  choice: ذهبت للقائه
  rationale: يحفظ دلالة التوجه لملاقاة شخص، بدل الاقتصار على «لاقته» التي قد تفقد العنصر الاتجاهي.
- source_word: δὲ
  choice: أما
  rationale: تبرز المقابلة الهادئة بين خروج مرثا وحال مريم، مع تركيب عربي طبيعي يكتمل بالفاء.
- source_word: ἐν τῷ οἴκῳ
  choice: في البيت
  rationale: ترجمة مباشرة وطبيعية للعبارة المكانية، وتحافظ على الاسم المحسوس «البيت».
- source_word: ἐκαθέζετο
  choice: كانت جالسة
  rationale: تنقل الاستمرار الذي يفيده الماضي الناقص اليوناني من غير إضافة معنى «بقيت» غير المصرح به.
- source_word: Μάρθα / Μαρία / Ἰησοῦς
  choice: مرثا / مريم / يسوع
  rationale: صيغ عربية كتابية مستقرة ومفهومة للأسماء الشخصية.
