  text: ἠγάπα δὲ ὁ Ἰησοῦς τὴν Μάρθαν καὶ τὴν ἀδελφὴν αὐτῆς καὶ τὸν Λάζαρον.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/005.yaml
  text: Jesus loved Martha and her sister and Lazarus.
translation:
  language: ar
  text: وكان يسوع يحبّ مرثا وأختها ولعازر.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠγάπα
  choice: كان يحبّ
  rationale: الفعل الناقص يدل هنا بطبيعية على حالة مستمرة في الزمن الماضي؛ وصيغة «كان يحبّ» تنقل هذا الاستمرار بوضوح من غير مبالغة.
- source_word: δὲ
  choice: و
  rationale: أداة ربط خفيفة تصل الجملة بسياقها السردي، و«و» العربية تؤدي هذا الدور من غير أن تفرض معنى استدراكيًا قويًا.
- source_word: τὴν Μάρθαν
  choice: مرثا
  rationale: نقل للاسم بحسب صورته العربية الكتابية الشائعة.
- source_word: τὴν ἀδελφὴν αὐτῆς
  choice: أختها
  rationale: تعبير عربي طبيعي يحافظ على عدم تسمية الأخت في هذه الآية.
- source_word: τὸν Λάζαρον
  choice: لعازر
  rationale: نقل للاسم بحسب صورته العربية الكتابية الشائعة.
- source_word: καὶ ... καὶ ... καὶ
  choice: و... و... و
  rationale: حُفظ عطف الأشخاص الثلاثة كما في بنية النص اليوناني، مع اتصال الواو بالأسماء وفق الرسم العربي.
theological_decisions:
- issue: دلالة صيغة الماضي الناقص ἠγάπα في وصف محبة يسوع
  choice: بيان محبة يسوع المستمرة لمرثا وأختها ولعازر
  alternative: «أحبّ» بوصفه ماضيًا بسيطًا، أو معنى ابتدائيًا مثل «بدأ يحبّ»
  rationale: الصيغة اليونانية تصوّر على الأرجح حالة قائمة في الماضي، لذلك تنقل «كان يحبّ» هذا الجانب من دون إضافة دعوى عاطفية أو عقائدية لا ينص عليها السياق.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُخدمت «وكان» لربط الجملة بالسياق ونقل الأداة δὲ بخفة، مع الحفاظ على دلالة الاستمرار في الفعل الناقص. لا حاجة إلى حاشية في هذه الآية.
