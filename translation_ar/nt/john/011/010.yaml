base_translation:
  language: en
  yaml_path: translation/nt/john/011/010.yaml
  text: But if anyone walks in the night[a], he stumbles, because the light is not in him.
translation:
  language: ar
  text: وَلَكِنْ إِنْ مَشَى أَحَدٌ لَيْلًا، فَإِنَّهُ يَتَعَثَّرُ، لِأَنَّ النُّورَ لَيْسَ فِيهِ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لأن النور ليس معه». واليونانية تقول حرفيًا: «ليس فيه»، وقد توحي بأكثر من مجرد غياب الضوء الخارجي.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐὰν δέ τις
  choice: أَمَّا مَنْ
  rationale: ينقل الشرط العام مع التحول التقابلي عن الآية السابقة بصياغة عربية طبيعية، من غير تقييد الفاعل بشخص معين.
- source_word: περιπατῇ
  choice: يَمْشِي
  rationale: يحفظ صورة المشي الحرفية وما يمكن أن تحمله في سياق يوحنا من دلالة مجازية.
- source_word: ἐν τῇ νυκτί
  choice: لَيْلًا
  rationale: تعبير عربي واضح وطبيعي يحفظ صورة الليل، ولا يستبدلها تفسيرًا بلفظ «الظلام».
- source_word: προσκόπτει
  choice: يَتَعَثَّرُ
  rationale: يؤدي معنى الاصطدام أو العثرة، ويحفظ إمكان المعنى الحسي والمجازي معًا.
- source_word: ὅτι
  choice: لِأَنَّ
  rationale: يبيّن العلاقة السببية الصريحة في العبارة اليونانية.
- source_word: τὸ φῶς
  choice: النُّورَ
  rationale: يحفظ التعريف والصورة المحورية للنور في هذا السياق.
- source_word: οὐκ ἔστιν ἐν αὐτῷ
  choice: لَيْسَ فِيهِ
  rationale: ينقل حرف الجر ἐν بمعناه المباشر «في»، ويحفظ التوتر بين صورة الإنارة الحسية وإمكان الدلالة الداخلية الأعمق.
theological_decisions:
- issue: دلالة عبارة «النور ليس فيه»
  choice: الإبقاء على الصياغة الداخلية «ليس فيه»
  alternative: «ليس معه» بوصفها إشارة محضة إلى غياب الضوء الخارجي
  rationale: النص اليوناني يقول حرفيًا «فيه»، ولغة النور في يوحنا قد تحمل عمقًا لاهوتيًا إلى جانب الصورة الحسية. لذلك تُحفظ العبارة من غير اختزالها في تفسير خارجي أو روحي حصري.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعملت «أمّا مَن» لربط المقابلة بالآية السابقة طبيعيًا، مع الحفاظ على عمومية الشرط. وُضعَت علامة الحاشية بعد العبارة التي تشرحها.
