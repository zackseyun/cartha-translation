  text: εἶπεν οὖν Θωμᾶς ὁ λεγόμενος Δίδυμος τοῖς συμμαθηταῖς· Ἄγωμεν καὶ ἡμεῖς ἵνα ἀποθάνωμεν μετ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/016.yaml
  text: So Thomas[a], called Didymus, said to his fellow disciples, “Let us also go, so that we may die with him.”
translation:
  language: ar
  text: 'فقال توما، الذي يُقال له التوأم، لرفقائه التلاميذ: «لنذهب نحن أيضًا لكي نموت معه».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: فـ
  rationale: تفيد الاستمرار والاستنتاج من الحوار السابق بصياغة عربية طبيعية موجزة.
- source_word: Θωμᾶς
  choice: توما
  rationale: نقل الاسم بصيغته العربية الكتابية المألوفة.
- source_word: ὁ λεγόμενος Δίδυμος
  choice: الذي يُقال له التوأم
  rationale: ترجمة معنى Δίδυμος بدل إبقائه اسمًا يونانيًا مبهمًا، مع الحفاظ على صيغة اللقب في الأصل.
- source_word: τοῖς συμμαθηταῖς
  choice: للتلاميذ رفقائه
  rationale: تؤدي معنى التلاميذ المشاركين له في التلمذة؛ وقد صيغت في النص العربي ضمنيًا من خلال سياق القول، لكن يلزم إظهار المتلقين، لذا الاختيار المنشور الأنسب هو «لرفقائه التلاميذ».
- source_word: Ἄγωμεν καὶ ἡμεῖς
  choice: لنذهب نحن أيضًا
  rationale: تنقل صيغة الحث في فعل الجمع، مع إبراز شمول المتكلم ورفقائه كما في καὶ ἡμεῖς.
- source_word: ἵνα ἀποθάνωμεν μετ’ αὐτοῦ
  choice: لكي نموت معه
  rationale: تحافظ على رابطة الغاية أو النتيجة المقصودة دون تفسير نبرة توما أو دوافعه.
theological_decisions:
- issue: نبرة قول توما ومقصده
  choice: صياغة مباشرة بلا تلوين تفسيري
  alternative: الشجاعة والوفاء، أو الاستسلام المتشائم، أو السخرية
  rationale: النص اليوناني لا يحسم النبرة النفسية، ولذلك تُترك دلالته محتملة كما هي.
translation_notes:
  register: عربية فصحى واضحة ومهيبة. تُرجم اللقب Δίδυμος بمعناه «التوأم» لأن الأصل يقدمه بوصفه لقبًا ذا دلالة.
