  text: εἶπεν οὖν ⸀ἡ Μάρθα πρὸς ⸀τὸν Ἰησοῦν· Κύριε, εἰ ἦς ὧδε ⸂οὐκ ἂν ἀπέθανεν ὁ ἀδελφός μου⸃·
base_translation:
  language: en
  yaml_path: translation/nt/john/011/021.yaml
  text: So Martha said to Jesus[a], “Lord, if you had been here, my brother would not have died.”
translation:
  language: ar
  text: 'فقالت مرثا ليسوع[a]: «يا رب، لو كنتَ هنا، لما مات أخي».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يا سيدي»؛ يمكن أن تكون الكلمة اليونانية κύριε صيغة خطاب تنمّ عن الاحترام، لكن «يا رب» تحفظ أيضًا ما قد تحمله في إنجيل يوحنا من دلالة لاهوتية.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: فـ
  rationale: تفيد οὖν هنا استمرار السرد مع صلة بما سبق؛ والفاء طبيعية وموجزة في العربية.
- source_word: εἶπεν
  choice: قالت
  rationale: فعل القول العادي الملائم للسياق السردي، مع تأنيثه لموافقة مرثا.
- source_word: πρὸς τὸν Ἰησοῦν
  choice: ليسوع
  rationale: تدل πρός مع المفعول به بعد فعل القول على المخاطَب؛ واللام هي الصياغة العربية الطبيعية.
- source_word: Κύριε
  choice: يا رب
  rationale: يحفظ معنى المخاطبة باحترام، كما يبقي الدلالة اللاهوتية المحتملة في إنجيل يوحنا من غير حسم زائد.
- source_word: εἰ ἦς ὧδε
  choice: لو كنتَ هنا
  rationale: «لو» مع الماضي تعبّر طبيعيًا عن الشرط الممتنع في الماضي، و«هنا» تقابل ὧδε بوضوح.
- source_word: οὐκ ἂν ἀπέθανεν
  choice: لما مات
  rationale: اللام مع «ما» في جواب «لو» تنقل النتيجة الماضية المخالفة للواقع بصورة عربية فصيحة وطبيعية.
- source_word: ὁ ἀδελφός μου
  choice: أخي
  rationale: يشير ἀδελφός هنا إلى لعازر، أخي مرثا بالنسب؛ و«أخي» هي المقابلة المباشرة الطبيعية.
theological_decisions:
- issue: ترجمة κύριος في خطاب مرثا ليسوع
  choice: يا رب
  alternative: يا سيدي
  rationale: «يا رب» تحفظ مجال اللفظة بين خطاب الاحترام والإيحاء المسيحاني المحتمل في إنجيل يوحنا، في حين أن «يا سيدي» قد تضيّقها إلى مجرد الاحترام.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «لو... لما...» لنقل الشرط الماضي المخالف للواقع بصورة طبيعية، مع إبقاء التوتر الدلالي في «يا رب» وشرحه في الحاشية.
