  - marker: b
    text: 'أو: «أصغيت إليّ». وقد يدل السماع في سياق الصلاة على الإصغاء الموافق، لكن النص يقول حرفيًا: «سمعتني».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦραν
  choice: أزاحوا
  rationale: الفعل αἴρω يعني الرفع أو الأخذ والإزالة؛ وفي سياق الحجر الذي يسدّ القبر، تعبّر «أزاحوا» طبيعيًا عن نقله من موضعه من غير تقييد كيفية ذلك.
- source_word: οὖν
  choice: فـ
  rationale: تفيد الفاء نتيجة الأمر السابق وتتابع السرد بإيجاز طبيعي.
- source_word: λίθον
  choice: الحجر
  rationale: المقابل المألوف لـ λίθος في سياق حجر القبر.
- source_word: ἦρεν τοὺς ὀφθαλμοὺς ἄνω
  choice: رفع عينيه إلى فوق
  rationale: يحفظ الصورة الصريحة في اليونانية، مع عبارة عربية واضحة تدل على توجيه النظر إلى العلاء.
- source_word: δὲ
  choice: و
  rationale: أداة انتقال سردي خفيف هنا، لا تفيد مقابلة قوية تستلزم «لكن».
- source_word: Πάτερ
  choice: يا أبتِ
  rationale: صيغة نداء عربية مباشرة وموقرة تحفظ مخاطبة الآب من غير زيادة تفسيرية.
- source_word: εὐχαριστῶ σοι
  choice: أشكرك
  rationale: صياغة عربية طبيعية ودقيقة لفعل الشكر في الزمن الحاضر.
- source_word: ὅτι ἤκουσάς μου
  choice: لأنك سمعتني
  rationale: يحفظ الفعل الماضي اليوناني ومعنى السماع المباشر، من غير أن يحوّله صراحة إلى «استجبت لي».
theological_decisions:
- issue: مخاطبة يسوع لله في الصلاة
  choice: يا أبتِ
  alternative: أيها الآب
  rationale: تحفظ صيغة النداء البسيطة في النص وألفة الخطاب ووقاره، من غير إضافة أسلوب طقسي أو شرح عقائدي.
- issue: دلالة سماع الآب ليسوع
  choice: لأنك سمعتني
  alternative: لأنك أصغيت إليّ
  rationale: «سمعتني» تلتزم باللفظ وتترك للسياق دلالة السماع الموافق في الصلاة، من غير أن تحسمها تفسيريًا بلفظ «استجبت».
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت الفاء لربط الحدث بما قبله، وحُفظت صورة رفع العينين، كما حُفظ الماضي في «سمعتني» بدل إدخال تفسير صريح للاستجابة.
