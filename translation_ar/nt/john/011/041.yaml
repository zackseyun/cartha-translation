  text: 'فأزاحوا الحجر. ورفع يسوع عينيه نحو العلاء[a] وقال: «يا أبتِ، أشكرك لأنك سمعتني[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «رفع نظره»؛ وبعبارة أسلس: «نظر إلى أعلى».'
