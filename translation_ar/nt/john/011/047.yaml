  text: συνήγαγον οὖν οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι συνέδριον, καὶ ἔλεγον· Τί ποιοῦμεν ὅτι οὗτος ὁ ἄνθρωπος πολλὰ ⸂ποιεῖ σημεῖα⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/047.yaml
  text: So the chief priests and the Pharisees gathered a council and were saying[a], “What are we doing? For this man is doing many signs.”
translation:
  language: ar
  text: 'فجمع رؤساء الكهنة والفريسيون مجلسًا[a]، وكانوا يقولون: «ماذا نفعل؟ فهذا الرجل يصنع آيات كثيرة».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «السنهدريم»، مجلس الحكم اليهودي.'
    reason: توضيح الهوية المؤسسية المرجحة للمجلس مع إبقاء الاسم التقني خارج المتن.
lexical_decisions:
- source_word: συνήγαγον
  choice: جمع
  rationale: فعل ماضٍ متعدٍّ، ومعناه هنا أنهم دعوا المجلس إلى الاجتماع؛ و«جمع» يحافظ على الصياغة اليونانية من غير زيادة تفسيرية.
- source_word: οὖν
  choice: فـ
  rationale: تفيد النتيجة والسير السردي المترتب على ما سبق، وتؤديه الفاء بصورة طبيعية موجزة في العربية.
- source_word: ἀρχιερεῖς
  choice: رؤساء الكهنة
  rationale: التعبير العربي المألوف للقيادات الكهنوتية، ولا يوهم وجود عدة أشخاص يشغلون منصب رئيس الكهنة في آن واحد.
- source_word: Φαρισαῖοι
  choice: الفريسيون
  rationale: الصيغة العربية الراسخة لاسم الجماعة اليهودية.
- source_word: συνέδριον
  choice: المجلس
  rationale: يترجم الاسم المؤسسي ترجمة واضحة، والسياق يرجح أنه مجلس الحكم اليهودي المعروف؛ تُذكر تسمية «السنهدريم» في الحاشية.
- source_word: ἔλεγον
  choice: كانوا يقولون
  rationale: يحافظ على دلالة الماضي الناقص، بما يوحي بحديث جارٍ أو متكرر داخل الاجتماع.
- source_word: Τί ποιοῦμεν
  choice: ماذا نفعل؟
  rationale: 'يحافظ على المضارع الإخباري في اليونانية وعلى توتر السؤال بين معنى: ماذا نفعل الآن؟ وماذا ينبغي أن نفعل؟'
- source_word: ὅτι
  choice: فـ
  rationale: تقدم علة السؤال بصورة عربية طبيعية ومباشرة.
- source_word: οὗτος ὁ ἄνθρωπος
  choice: هذا الرجل
  rationale: ترجمة دقيقة تحفظ نبرة الإشارة إلى يسوع من غير إضافة تفسير.
- source_word: πολλὰ ποιεῖ σημεῖα
  choice: يصنع آيات كثيرة
  rationale: يحفظ المضارع والدلالة اليوحناوية لكلمة «آيات» بوصفها أعمالًا ذات مغزى كاشف، بدل اختزالها في «معجزات».
theological_decisions:
- issue: ترجمة σημεῖα في السياق اليوحناوي
  choice: آيات
  alternative: معجزات / آيات معجزية
  rationale: «آيات» تحفظ كون الأعمال علامات تكشف هوية يسوع وتشير إلى معنى يتجاوز الحدث نفسه، من غير توسع تفسيري.
- issue: تعيين مدلول συνέδριον
  choice: المجلس
  alternative: السنهدريم / مجلسًا
  rationale: «المجلس» يترجم اللفظ بوضوح، بينما توضح الحاشية الاسم التقليدي للمؤسسة المرجحة. التعريف أنسب للسياق الذي يتحدث عن الهيئة المعروفة التي جمعها رؤساء الكهنة والفريسيون.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «كانوا يقولون» لحفظ الجانب الاستمراري، و«ماذا نفعل؟» للإبقاء على الغموض الحقيقي بين وصف تقاعسهم والتشاور في الإجراء الواجب. وُضع مؤشر الحاشية بعد الجملة التي تتضمن «المجلس».
