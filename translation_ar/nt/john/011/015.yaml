base_translation:
  language: en
  yaml_path: translation/nt/john/011/015.yaml
  text: And I am glad for your sake that I was not there[a], so that you may believe. But let us go to him.
translation:
  language: ar
  text: ويسرّني لأجلكم أنني لم أكن هناك، لكي تؤمنوا.[a] لكن لنذهب إليه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو قد يُفهم: «لكي تبتدئوا بالإيمان». قد توحي صيغة الفعل اليوناني بمعنى البدء بالإيمان، لكن «تؤمنوا» أوسع دلالة وأقل حسمًا من جهة التفسير.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρω
  choice: أفرح
  rationale: فعل مضارع يدل على الفرح، وهذه صياغة عربية واضحة وتحافظ على الدلالة الوجدانية الإيجابية.
- source_word: δι’ ὑμᾶς
  choice: لأجلكم
  rationale: تنقل معنى المصلحة أو المنفعة المقصودة للتلاميذ، لا مجرد كونهم سببًا للفرح.
- source_word: ἵνα πιστεύσητε
  choice: لكي تؤمنوا
  rationale: تحافظ على دلالة الغرض في ἵνα مع صياغة طبيعية، من غير أن تحسم ما إذا كان الفعل يعني بدء الإيمان أو نموه وتثبيته.
- source_word: ὅτι οὐκ ἤμην ἐκεῖ
  choice: بأنّي لم أكن هناك
  rationale: تجعل ὅτι رابطًا بمضمون الفرح، وتحافظ على المعنى المباشر لعبارة عدم الوجود هناك.
- source_word: ἀλλὰ
  choice: لكن
  rationale: تنقل الانتقال التقابلي من بيان الغرض إلى الدعوة إلى العمل.
- source_word: ἄγωμεν
  choice: هلمّوا نذهب
  rationale: تنقل صيغة الحث في المتكلم الجمع بصياغة عربية فصيحة ومفهومة.
- source_word: πρὸς αὐτόν
  choice: إليه
  rationale: تعبير عربي طبيعي عن الحركة نحو شخص.
theological_decisions:
- issue: دلالة πιστεύσητε في سياق يوحنا
  choice: تؤمنوا
  alternative: تأتوا إلى الإيمان
  rationale: صيغة الماضي الاحتمالية اليونانية قد تحمل معنى الدخول في الإيمان، لكنها لا تفرض القول إن التلاميذ كانوا عديمي الإيمان من قبل. لذلك يحافظ المتن على التعبير الأوسع، وتُذكر الدلالة البديلة في الحاشية.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُعمل «هلمّوا نذهب» لإبراز الحث الجماعي، مع إبقاء الغموض الحقيقي في دلالة «تؤمنوا» بواسطة الحاشية.
