  text: Jesus said to her, “Did I not tell you that if you believe, you will see the glory of God?”
translation:
  language: ar
  text: 'قال لها يسوع: «ألم أقل لكِ: إن آمنتِ سترين مجد الله؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: قال
  rationale: المضارع التاريخي في اليونانية يُنقل طبيعيًا بالماضي في السرد العربي المعاصر.
- source_word: αὐτῇ
  choice: لها
  rationale: ضمير المفعول غير المباشر يعود في السياق إلى مرثا، وصيغة «لها» واضحة وطبيعية.
- source_word: Οὐκ εἶπόν σοι
  choice: ألم أقل لكِ
  rationale: يحفظ الاستفهام الإنكاري المتوقع جوابه بالإيجاب، مع إبقاء فعل القول وصيغة الخطاب المؤنث المفرد.
- source_word: ἐὰν πιστεύσῃς
  choice: إن آمنتِ
  rationale: تنقل الشرط ومعنى الإيمان مباشرة، وتحافظ على الصلة اللفظية باستعمالات πιστεύω في يوحنا.
- source_word: ὄψῃ
  choice: سترين
  rationale: ترجمة طبيعية لصيغة المستقبل، مع مطابقة المخاطبة المؤنثة المفردة.
- source_word: δόξαν
  choice: مجد
  rationale: «مجد» هو المقابل الكتابي العربي الراسخ لـδόξα، ويحفظ دلالته على ظهور عظمة الله وإعلانه عن ذاته دون تفسير زائد.
- source_word: τοῦ θεοῦ
  choice: الله
  rationale: تركيب «مجد الله» ينقل الإضافة اليونانية بدقة وفصاحة.
theological_decisions:
- issue: علاقة الإيمان برؤية مجد الله
  choice: إبقاء الكلام وعدًا شرطيًا مباشرًا موجَّهًا إلى مرثا
  alternative: تفسيره قاعدة عامة عن الإيمان والمعجزات، أو حصره تفسيرًا في إقامة لعازر وحدها
  rationale: النص نفسه يصوغ كلام يسوع شرطًا ووعدًا مباشرين؛ لذلك لا تضيف الترجمة تحديدًا لمدى الوعد ولا تحسم آثاره اللاهوتية الأوسع.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدمت علامات التأنيث في «لكِ، آمنتِ، سترين» لتوضيح أن الخطاب موجَّه إلى مرثا، من غير حاجة إلى حاشية.
