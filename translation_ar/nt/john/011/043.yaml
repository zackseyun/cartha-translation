  text: And after saying these things[a], he cried out with a loud voice, “Lazarus, come out!”
translation:
  language: ar
  text: 'وبعدما قال هذا، صرخ بصوت عالٍ: «يا لعازر، اخرج!»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα
  choice: هذا
  rationale: اسم الإشارة في اليونانية جمع محايد، لكنه يشير طبيعيًا إلى الكلام السابق جملةً واحدة؛ وصيغة «هذا» أفصح وأيسر في العربية من «هذه الأشياء» في هذا السياق.
- source_word: εἰπὼν
  choice: بعدما قال
  rationale: اسم فاعل ماضٍ يدل على أن القول سبق الفعل الرئيس؛ و«بعدما قال» تنقل هذا التتابع بوضوح وطبيعية.
- source_word: φωνῇ μεγάλῃ
  choice: بصوت عالٍ
  rationale: تعبير عربي طبيعي ينقل دلالة الكيفية وشدة الصوت في الأصل.
- source_word: ἐκραύγασεν
  choice: صرخ
  rationale: الفعل يدل على إطلاق نداء أو صيحة قوية؛ و«صرخ» يحفظ قوة التعبير من غير حشو، مع أن شدة الصوت مذكورة صراحة.
- source_word: Λάζαρε
  choice: يا لعازر
  rationale: نُقل الاسم وفق صورته العربية المألوفة، وأُظهرت صيغة النداء اليونانية بأداة النداء العربية «يا».
- source_word: δεῦρο ἔξω
  choice: اخرج
  rationale: التركيب دعوة آمرة إلى المجيء إلى الخارج؛ ويؤدي فعل الأمر «اخرج» المعنى كاملًا بإيجاز وقوة في العربية المعاصرة.
theological_decisions:
- issue: صياغة أمر المعجزة من غير استيراد تعبير تقليدي عتيق
  choice: اخرج
  alternative: هلمَّ إلى الخارج
  rationale: «اخرج» ينقل المقصود المباشر من δεῦρο ἔξω بلغة عربية واضحة وقوية، بينما «هلمَّ إلى الخارج» أقرب إلى التفكيك اللفظي لكنه أقل طبيعية وأشد تقليدية. لا يترتب على الاختيار حسم لمسألة لاهوتية.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة، مع إبقاء الجملة موجزة وقوية بما يلائم النداء. لا توجد حواشٍ لأن البديل التقليدي الإنجليزي لا يقابله هنا بديل عربي ضروري للنشر.
