base_translation:
  language: en
  yaml_path: translation/nt/john/011/031.yaml
  text: So the Jews who were with her in the house and comforting her[a], when they saw that Mary got up quickly and went out, followed her, thinking that she was going to the tomb to weep there.
translation:
  language: ar
  text: فاليهود[a] الذين كانوا معها في البيت يعزّونها، لما رأوا مريم نهضت مسرعةً وخرجت، تبعوها، ظانّين أنها ذاهبة إلى القبر لتبكي هناك.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أهل اليهودية». قد يدل اللفظ اليوناني في إنجيل يوحنا أحيانًا على أهل اليهودية أو على قيادتهم، لكنه يشير هنا إلى جماعة المعزّين الذين كانوا مع مريم.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ οὖν Ἰουδαῖοι
  choice: فاليهود
  rationale: تؤدي الفاء وظيفة οὖν في وصل تطور السرد بما قبله بصورة طبيعية. ولفظ «اليهود» هو المقابل المباشر، مع بيان احتمال «اليهوديون» في الحاشية مراعاةً لتنوع دلالة اللفظ في يوحنا.
- source_word: οἱ ὄντες μετ’ αὐτῆς ἐν τῇ οἰκίᾳ καὶ παραμυθούμενοι αὐτήν
  choice: الذين كانوا معها في البيت يعزّونها
  rationale: يحافظ التعبير على تحديد الجماعة الموجودة مع مريم داخل البيت، وينقل παραμυθέομαι بالفعل العربي المألوف «يعزّي» الملائم لسياق الوفاة.
- source_word: ἰδόντες
  choice: لما رأوا
  rationale: صياغة زمنية طبيعية تنقل سبق الرؤية لاتّباعهم مريم.
- source_word: ταχέως ἀνέστη καὶ ἐξῆλθεν
  choice: تنهض مسرعةً وتخرج
  rationale: «تنهض» تدل هنا على القيام من موضعها، لا على القيامة، و«مسرعةً» تنقل ظرف السرعة بعبارة عربية سليمة.
- source_word: ἠκολούθησαν αὐτῇ
  choice: تبعوها
  rationale: ينقل المعنى الحركي المباشر للفعل دون إقحام دلالة التلمذة.
- source_word: δόξαντες
  choice: ظانّين
  rationale: يعبّر عن استنتاجهم غير المتحقق أو افتراضهم بشأن مقصد مريم.
- source_word: ὑπάγει εἰς τὸ μνημεῖον
  choice: أنها ذاهبة إلى القبر
  rationale: تنقل صيغة الخطاب غير المباشر طبيعيًا، و«القبر» هو اللفظ العربي الواضح للمدفن المقصود في السياق.
- source_word: ἵνα κλαύσῃ ἐκεῖ
  choice: لتبكي هناك
  rationale: لام التعليل تنقل بوضوح غرض الذهاب الذي تفيده ἵνα مع صيغة الاحتمال في تصورهم.
theological_decisions:
- issue: دلالة Ἰουδαῖοι في السرد اليوحناوي
  choice: اليهود
  alternative: اليهوديون، أي أهل اليهودية
  rationale: يشير اللفظ هنا تحديدًا إلى جماعة المعزّين الموجودين مع مريم، لا إلى اليهود جميعًا ولا بالضرورة إلى القيادة اليهودية. أُبقي المقابل المباشر في المتن، مع حفظ الاحتمال الجغرافي في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُعمل «يعزّونها» لأنه الأنسب لسياق الحداد، وحُفظ تسلسل الأفعال وإيقاع السرد من غير تكلّف. وُضعت علامة الحاشية في ختام الآية لأنها تتعلق بلفظ «اليهود» الوارد في بدايتها.
