base_translation:
  language: en
  yaml_path: translation/nt/john/011/006.yaml
  text: So when he heard that he was sick[a], he then stayed two days in the place where he was.
translation:
  language: ar
  text: فلما سمع أنه مريض[a]، مكث حينئذ يومين في المكان الذي كان فيه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ويجوز: «أنه كان مريضًا». جاء الفعل في اليونانية بصيغة المضارع: «أنه مريض».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς οὖν
  choice: فلما
  rationale: تؤدي «فـ» وظيفة οὖν في وصل الحدث بما قبله وإبراز تقدّم السرد، وتؤدي «لما» المعنى الزمني لـὡς بصياغة عربية طبيعية.
- source_word: ἤκουσεν
  choice: سمع
  rationale: المعنى المباشر للفعل ἀκούω، ولا تستلزم العبارة إضافة «أُخبر» أو «علم».
- source_word: ὅτι ἀσθενεῖ
  choice: أنه مريض
  rationale: يدل ἀσθενέω في سياق لعازر على المرض الجسدي. والجملة الاسمية العربية تحافظ طبيعيًا على معنى المضارع اليوناني بعد فعل السماع الماضي.
- source_word: τότε μὲν
  choice: حينئذ
  rationale: تنقل τότε الإشارة الزمنية، وتحافظ على قدر من إبراز المفارقة السردية التي تسهم فيها μέν، من غير تركيب عربي متكلف. ولا يلزم أن يكون لـμέν مقابل مستقل لأن وظيفتها هنا خفيفة وتمهّد لما يلي في السرد.
- source_word: ἔμεινεν
  choice: مكث
  rationale: «مكث» فعل عربي واضح ودقيق للبقاء في موضع مدة من الزمن.
- source_word: ἐν ᾧ ἦν τόπῳ
  choice: في المكان الذي كان فيه
  rationale: يحافظ على التوكيد المكاني وعلى شيء من التكرار الموجود في اليونانية، مع بقاء العبارة عربية سليمة.
- source_word: δύο ἡμέρας
  choice: يومين
  rationale: نقل مباشر لنصب المدة في اليونانية، وهو في العربية ظرف زمان منصوب يدل على مدة المكث.
theological_decisions:
- issue: دلالة مكث يسوع بعد سماعه بمرض لعازر
  choice: 'إبقاء العبارة صريحة: سمع أنه مريض، فمكث حينئذ يومين.'
  alternative: إضافة تفسير يفيد أن التأخير كان بدافع الرحمة أو لتحقيق قصد إلهي.
  rationale: الآية تعرض توترًا سرديًا مقصودًا بين سماع خبر المرض والمكث يومين؛ فلا ينبغي للترجمة أن تفسر هذا التوتر أو تلطفه داخل النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختيرت «فلما» لتدفق سردي طبيعي، و«مكث» للدقة والوضوح. أُبقي التركيب المكاني كاملًا للمحافظة على ملامح الأصل، ووُضعت علامة الحاشية [a] في المتن.
