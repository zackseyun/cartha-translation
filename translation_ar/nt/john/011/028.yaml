  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Καὶ ⸀τοῦτο εἰποῦσα ἀπῆλθεν καὶ ἐφώνησεν ⸀Μαριὰμ τὴν ἀδελφὴν αὐτῆς λάθρᾳ εἰποῦσα· Ὁ διδάσκαλος πάρεστιν καὶ φωνεῖ σε.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/028.yaml
  text: And after saying this[a], she went away and called Mary her sister privately, saying[c][b], “The Teacher is here and is calling for you.”
translation:
  language: ar
  text: 'وبعدما قالت هذا، ذهبت ونادت مريم أختها على انفراد، قائلة: «المعلّم هنا، وهو يطلبكِ.»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο εἰποῦσα
  choice: وبعدما قالت هذا
  rationale: ينقل اسم الإشارة وتسلسل الحدث الذي يدل عليه اسم الفاعل الأوريستي بصياغة عربية طبيعية.
- source_word: ἀπῆλθεν
  choice: ذهبت
  rationale: يفيد مغادرة الموضع، و«ذهبت» واضحة ومناسبة للسرد من غير تكلّف.
- source_word: ἐφώνησεν Μαριὰμ
  choice: نادت مريم
  rationale: الفعل هنا يعني دعوة شخص أو مناداته؛ و«نادت مريم» تلائم السياق العربي.
- source_word: τὴν ἀδελφὴν αὐτῆς
  choice: أختها
  rationale: عبارة بدل توضّح صلة مريم بها، وهذه هي الصياغة العربية المباشرة.
- source_word: λάθρᾳ
  choice: على انفراد
  rationale: يدل الظرف على كلام بعيد عن مسامع الحاضرين، من غير أن يلزم منه قصد الخداع الذي قد توحي به «سرًّا».
- source_word: εἰποῦσα
  choice: قائلة
  rationale: يحافظ على البنية الحالية التي تمهّد للكلام المباشر، وهو فصيح وطبيعي في السرد.
- source_word: Ὁ διδάσκαλος
  choice: المعلّم
  rationale: هذا هو المعنى المعجمي المباشر للقب، ويحفظ طابعه الاحترامي من غير إضافة دلالة سلطوية غير مصرّح بها.
- source_word: πάρεστιν
  choice: هنا
  rationale: ينقل معنى الحضور في الموضع بإيجاز طبيعي ضمن الجملة الاسمية العربية.
- source_word: φωνεῖ σε
  choice: وهو يطلبكِ
  rationale: يفيد في السياق أنه يدعو مريم إلى الحضور؛ وصيغة المضارع تحفظ آنية الطلب، مع تأنيث ضمير المخاطبة.
theological_decisions:
- issue: ترجمة لقب يسوع διδάσκαλος
  choice: المعلّم
  alternative: السيّد
  rationale: «المعلّم» يحفظ المدلول المعجمي العادي للقب واحترام المتكلمة، من غير توسيع لاهوتي أو سلطوي لا يقتضيه اللفظ.
- issue: دلالة λάθρᾳ
  choice: على انفراد
  alternative: سرًّا
  rationale: العبارة تصف تواصلًا لا يسمعه الآخرون، لكنها لا تثبت بذاتها وجود خوف أو خداع؛ لذلك تتجنب الترجمة إقحام دافع غير مذكور.
- issue: دلالة المضارع في φωνεῖ σε
  choice: وهو يطلبكِ
  alternative: وهو يناديكِ
  rationale: يحفظ الاختيار معنى الدعوة الجارية إلى الحضور بحسب السياق، دون تحويلها إلى صيغة أمر أو إضافة مضمون عقائدي.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقّرة، مع خطاب مؤنث صريح في «يطلبكِ». لا توجد حاشية لازمة؛ فالبدائل المعجمية لا تمثل غموضًا جوهريًا يحتاجه القارئ لفهم النص.
