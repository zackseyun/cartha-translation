source:
  edition: SBLGNT
  text: ἡ οὖν ⸀Μαριὰμ ὡς ἦλθεν ὅπου ⸀ἦν Ἰησοῦς ἰδοῦσα αὐτὸν ἔπεσεν αὐτοῦ ⸀πρὸς τοὺς πόδας, λέγουσα αὐτῷ· Κύριε, εἰ ἦς ὧδε οὐκ ἄν ⸂μου ἀπέθανεν⸃ ὁ ἀδελφός.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/032.yaml
  text: So when Mary came where Jesus was and saw him[a], she fell at his feet, saying to him, “Lord, if you had been here, my brother would not have died.”
translation:
  language: ar
  text: 'فلما وصلت مريم إلى حيث كان يسوع ورأته، ارتمت عند قدميه وقالت له: «يا رب، لو كنت هنا لما مات أخي».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يا سيدي». قد تكون الكلمة اليونانية Κύριε صيغةَ خطابٍ تدل على الاحترام، لكنها تُرجمت هنا «يا رب» اتساقًا مع المقابل المعتاد لكلمة κύριος ومع تصوير إنجيل يوحنا ليسوع.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: فـ
  rationale: تفيد الانتقال والنتيجة في سياق السرد، وتؤديها الفاء بالعربية بوضوح وطبيعية.
- source_word: ὡς ἦλθεν
  choice: لما وصلت
  rationale: ὡς هنا زمانية مع فعل ماض، و«لما» تنقل معنى «حين» مع إبراز تعاقب الحدثين؛ واختيار «وصلت» يلائم بلوغ المكان المقصود.
- source_word: ὅπου ἦν Ἰησοῦς
  choice: إلى حيث كان يسوع
  rationale: يحافظ على دلالة المكان في العبارة اليونانية، ويتصل طبيعيًا بفعل الوصول.
- source_word: ἰδοῦσα αὐτόν
  choice: ورأته
  rationale: تحويل اسم الفاعل الظرفي إلى فعل معطوف صياغة عربية طبيعية تحفظ تتابع الأفعال.
- source_word: ἔπεσεν αὐτοῦ πρὸς τοὺς πόδας
  choice: ارتمت عند قدميه
  rationale: تنقل حركة السقوط عند القدمين بوصفها انطراحًا أمام يسوع، من غير أن تفرض وحدها تفسيرًا تعبديًا محددًا.
- source_word: λέγουσα αὐτῷ
  choice: وقالت له
  rationale: صياغة عربية سلسة للمشاركة الحالية التي تقدم كلام مريم المباشر.
- source_word: Κύριε
  choice: يا رب
  rationale: «رب» المقابل المعتاد لـκύριος، مع أداة النداء اللازمة طبيعيًا في العربية؛ ويبقي إمكان الاحترام والمعنى الأثقل في السياق اليوحناوي.
- source_word: εἰ ἦς ὧδε
  choice: لو كنت هنا
  rationale: «لو» مع الماضي هي الصياغة العربية الطبيعية للشرط الماضي الممتنع.
- source_word: οὐκ ἄν ... ἀπέθανεν
  choice: لما مات
  rationale: جواب «لو» المنفي بـ«لما» ينقل النتيجة الماضية المخالفة للواقع بإيجاز ودقة.
- source_word: μου ὁ ἀδελφός
  choice: أخي
  rationale: الإضافة العربية الطبيعية تنقل ضمير الملكية دون توسع.
theological_decisions:
- issue: دلالة Κύριε في خطاب مريم ليسوع
  choice: يا رب
  alternative: يا سيدي
  rationale: «يا رب» تحافظ على المقابل الأساسي لـκύριος وعلى الثقل السردي واللاهوتي المحتمل في إنجيل يوحنا، من غير أن تحسم أن مريم تصوغ هنا اعترافًا لاهوتيًا كاملًا؛ لذلك تُذكر دلالة الاحترام البديلة في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدمت «ارتمت عند قدميه» لتصوير الفعل بصورة طبيعية، و«لو كنت هنا لما مات أخي» للحفاظ على الشرط الماضي المخالف للواقع. وُضعت علامة الحاشية بعد الآية لأنها تتعلق بلفظ «يا رب» داخل الاقتباس.
