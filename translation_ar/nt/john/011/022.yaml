  text: But even now I know that whatever you ask from God, God will give you.
translation:
  language: ar
  text: لكني الآن أيضًا أعلم أن كل ما تطلبه من الله يعطيك الله إياه.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «والآن أيضًا أعلم». يمكن أن تُترجم أداة الربط اليونانية بمعنى «و»، غير أن السياق يسمح أيضًا بفهمها على أنها انتقال استدراكي بعد كلام مرثا عن موت لعازر.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: لكني حتى الآن
  rationale: تؤدي «لكن» التحول الاستدراكي في السياق بعد حديث مرثا عن موت لعازر، وتحفظ «حتى الآن» القوة الزمنية لعبارة νῦν.
- source_word: οἶδα
  choice: أعلم
  rationale: الفعل ذو صيغة التام ومعنى الحاضر هنا، وأقرب مقابله العربي المباشر «أعلم».
- source_word: ὅσα ἂν
  choice: كل ما
  rationale: الضمير الموصول مع ἄν يفيد العموم وعدم التعيين؛ و«كل ما» تعبير عربي طبيعي يحفظ هذا الاتساع.
- source_word: αἰτήσῃ τὸν θεὸν
  choice: تطلبه من الله
  rationale: اليونانية تجعل «الله» مفعولًا مباشرًا للفعل، لكن العربية المألوفة في معنى الالتماس تقول «طلب من الله». أُضيف ضمير المفعول في «تطلبه» لإحكام تركيب «كل ما» دون تعيين مضمون الطلب.
- source_word: δώσει σοι ὁ θεός
  choice: يعطيك الله إياه
  rationale: تحفظ «يعطي» المعنى المباشر للفعل δίδωμι، ويبين الضمير «إياه» أن المعطى هو كل ما سبق ذكره، وهو لازم لوضوح العبارة العربية.
theological_decisions:
- issue: قد تُحمَّل عبارة مرثا عن طلب يسوع من الله وإعطاء الله له دلالة عقدية تتجاوز كلام الشخصية في سياقه السردي.
  choice: 'الإبقاء على الصياغة الصريحة: «كل ما تطلبه من الله يعطيك الله إياه».'
  alternative: توسيع «الله» إلى «الآب»، أو إعادة الصياغة لتفادي ما قد يُفهم من التمايز أو الخضوع.
  rationale: النص ينقل قول مرثا ويكرر لفظ θεός، فلا يصح إدخال «الآب» ولا تسوية التوتر اللاهوتي السردي بإضافة تفسير غير مصرَّح به.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. اختيرت «لكني» بدل «ولكن حتى الآن» لخفة الأسلوب، واستُعمل «تطلبه من الله» بوصفه التعبير العربي الطبيعي مع الحفاظ على عموم الطلب وتكرار لفظ «الله» في الأصل.
