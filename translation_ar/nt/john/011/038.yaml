  text: Ἰησοῦς οὖν πάλιν ἐμβριμώμενος ἐν ἑαυτῷ ἔρχεται εἰς τὸ μνημεῖον· ἦν δὲ σπήλαιον, καὶ λίθος ἐπέκειτο ἐπ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/038.yaml
  text: Jesus[a], then, again deeply moved within himself, came to the tomb. Now it was a cave, and a stone was lying against it.
translation:
  language: ar
  text: فجاء يسوع إلى القبر، وهو مرة أخرى مضطرب بشدة في داخله.[a] وكان القبر مغارةً، وقد وُضع حجر على مدخلها.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مستاء في داخله»، أو «مضطرب بشدة في داخله». الفعل اليوناني قوي على نحو لافت، وقد يدل على أكثر من الحزن وحده.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: حينئذ
  rationale: تربط ما حدث بما سبقه وتدفع السرد إلى الأمام، من غير أن تفرض استنتاجًا سببيًا أقوى مما يقتضيه السياق.
- source_word: πάλιν
  choice: أيضًا
  rationale: تفيد تكرار الانفعال المذكور سابقًا، وتأتي في العربية طبيعيًا مع وصف حال يسوع.
- source_word: ἐμβριμώμενος ἐν ἑαυτῷ
  choice: مضطرب بشدة في داخله
  rationale: يحفظ شدة الفعل اليوناني ولا يحصر الانفعال في الحزن أو الغضب؛ وتُذكر دلالة الاستياء المحتملة في الحاشية.
- source_word: ἔρχεται
  choice: جاء
  rationale: المضارع التاريخي اليوناني يُصاغ بالماضي في السرد العربي الطبيعي.
- source_word: μνημεῖον
  choice: القبر
  rationale: يدل هنا على موضع دفن، ويؤكد وصفه اللاحق أنه قبر في مغارة.
- source_word: σπήλαιον
  choice: مغارة
  rationale: مقابل عربي واضح وطبيعي لموضع صخري مجوف استُعمل قبرًا.
- source_word: λίθος
  choice: حجر
  rationale: المقابل المباشر، وهو في السياق حجر إغلاق القبر.
- source_word: ἐπέκειτο ἐπ’ αὐτῷ
  choice: وُضع على مدخلها
  rationale: يوضح الوضع العملي للحجر عند فتحة المغارة، مع تجنب الصورة غير الطبيعية الموحية بأنه كان فوق المغارة كلها.
theological_decisions:
- issue: القوة الانفعالية لعبارة ἐμβριμώμενος ἐν ἑαυτῷ في وصف يسوع
  choice: مضطرب بشدة في داخله
  alternative: مستاء في داخله؛ متأثر بشدة في داخله
  rationale: الفعل شديد الدلالة وقد يتضمن الاستياء أو الغضب، لكن السياق لا يحسم طبيعة الانفعال وحدها؛ لذلك يحفظ المتن الشدة والغموض، وتورد الحاشية البدائل.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة سردية وقورة. قُدّمت الحال الانفعالية بعد فعل المجيء لتجنب الثقل، مع إبقاء «في داخله» محافظةً على العبارة اليونانية. أُظهر مرجع الضمير في وصف الحجر بعبارة «على مدخلها» لأن المقصود إغلاق فتحة المغارة.
