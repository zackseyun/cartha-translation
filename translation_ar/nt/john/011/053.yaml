  yaml_path: translation/nt/john/011/053.yaml
  text: So from that day on they planned to kill him.
translation:
  language: ar
  text: فَمُنْذُ ذَلِكَ الْيَوْمِ خَطَّطُوا لِقَتْلِهِ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπ’ ἐκείνης ... τῆς ἡμέρας
  choice: مِنْ ذَلِكَ الْيَوْمِ
  rationale: تفيد العبارة نقطة البداية الزمنية لما استمر بعد ذلك، وهذا التعبير العربي الطبيعي يؤدي المعنى من غير حاجة إلى زيادة «فصاعدًا».
- source_word: οὖν
  choice: فَـ
  rationale: الفاء تربط النتيجة بما سبق في مشهد المجلس، وتحافظ بإيجاز وطبيعية على القوة الاستنتاجية والسردية للأداة اليونانية.
- source_word: ἐβουλεύσαντο
  choice: خَطَّطُوا
  rationale: يدل الفعل هنا على تشاور أفضى إلى تدبير مقصود؛ و«خططوا» يحفظ معنى القصد التآمري بوضوح، بخلاف تعبير قد يوحي بمجرد المناقشة.
- source_word: ἵνα ἀποκτείνωσιν
  choice: لِقَتْلِ
  rationale: اللام مع المصدر تؤدي غرض تركيب ἵνα بعد فعل التخطيط في عربية واضحة، و«القتل» هو المعنى المباشر من غير إيحاء زائد بإجراء قضائي.
- source_word: αὐτόν
  choice: ـهِ
  rationale: الضمير يعود إلى يسوع في السياق القريب، فالإبقاء على الضمير يطابق صياغة الأصل ولا يستلزم التصريح بالاسم.
theological_decisions:
- issue: طبيعة قصد القادة تجاه يسوع
  choice: صياغة العبارة بوصفها خطة فعلية لقتله، من غير تلطيفها إلى مجرد نقاش أو احتمال.
  alternative: تشاوروا في قتله / فكروا في أن يقتلوه
  rationale: يعرض النص تحولًا حاسمًا إلى تدبير عدائي بعد مداولات المجلس؛ لذلك ينبغي الحفاظ على جسامة القصد من غير إضافة توصيف قانوني أو لاهوتي لا يصرح به النص.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة وذات نبرة سردية كريمة. اختيرت الفاء للوصل الطبيعي بما قبل، و«خططوا لقتله» لتجنب الأسلوب القديم في «تشاوروا لكي يقتلوه» مع حفظ دلالة التدبير المقصود.
