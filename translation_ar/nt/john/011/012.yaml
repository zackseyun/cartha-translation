  text: So the disciples said to him[a], “Lord, if he has fallen asleep[b], he will recover.”
translation:
  language: ar
  text: 'فقال له التلاميذ: «يا رب، إن كان قد نام[a]، فسيتعافى[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إن كان نائمًا». كان يسوع قد تكلم عن موت لعازر مجازًا بوصفه نومًا، لكن التلاميذ فهموا أنه يقصد النوم العادي.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا ترجمة الفعل اليوناني: «فسيخلُص»، لكنه يشير هنا إلى التعافي من المرض، أي: «فسيتعافى» أو «سيسترد عافيته».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: فـ
  rationale: تفيد الفاء هنا أن قول التلاميذ جاء نتيجةً واستنتاجًا من كلام يسوع السابق، وتحافظ على سلاسة السرد العربي.
- source_word: οἱ μαθηταὶ
  choice: التلاميذ
  rationale: أداة التعريف حاضرة في اليونانية، والمرجع واضح من السياق؛ فلا حاجة إلى إضافة «تلاميذه».
- source_word: αὐτῷ
  choice: له
  rationale: يحافظ على الضمير الوارد في الأصل، ومرجعه، أي يسوع، واضح من السياق.
- source_word: Κύριε
  choice: يا رب
  rationale: صيغة نداء عربية طبيعية تحفظ معنى المخاطبة باحترام، كما تُبقي الرنين المسيحاني المحتمل في إنجيل يوحنا دون أن تحسمه.
- source_word: εἰ
  choice: إن كان
  rationale: ينقل الشرط كما في الأصل، ويوافق افتراض التلاميذ المبني على فهمهم الحرفي للنوم.
- source_word: κεκοίμηται
  choice: قد نام
  rationale: ينقل صيغة التمام والحالة الناتجة عنها بعبارة عربية طبيعية. والسياق يقتضي لغة النوم العادي لأن التلاميذ لم يفهموا أن يسوع كان يشير إلى الموت.
- source_word: σωθήσεται
  choice: فسيُشفى
  rationale: يمكن للفعل أن يعني «يُخلَّص»، لكنه في سياق المرض يدل على النجاة منه واسترداد العافية؛ لذلك «سيُشفى» أوضح للقارئ العربي هنا.
theological_decisions:
- issue: ترجمة κύριος في مخاطبة يسوع مباشرة
  choice: يا رب
  alternative: يا سيد
  rationale: «يا رب» تحفظ المعنى المعجمي الشائع وطبقات الدلالة في إنجيل يوحنا، من الاحترام في الخطاب إلى الإيحاء المسيحاني، من غير مبالغة في حسم المقصود.
- issue: الحفاظ على التوتر بين النوم الحرفي واستعارة الموت في κεκοίμηται
  choice: 'صياغته في المتن بلغة النوم العادي: «قد نام»'
  alternative: قد رقد
  rationale: النقطة السردية هي أن التلاميذ فهموا كلام يسوع عن موت لعازر على أنه نوم عادي. و«قد نام» تُظهر فهمهم، بينما يوضح السياق اللاحق المعنى الذي قصده يسوع.
- issue: دلالة σωθήσεται في سياق المرض
  choice: فسيُشفى
  alternative: فسيخلص
  rationale: تحافظ «فسيُشفى» على الدلالة السياقية المتعلقة باسترداد الصحة، وتتجنب أن تُدخل في كلام التلاميذ معنى الخلاص اللاهوتي غير المقصود هنا، مع بيان المعنى الحرفي البديل في الحاشية.
translation_notes:
  register: لغة عربية فصحى حديثة واضحة وموجزة. استُخدمت «فـ» لربط الاستنتاج بالسياق السابق، و«قد نام» بدل «رقد» لأن الأولى أيسر للقارئ المعاصر وتُبرز فهم التلاميذ للنوم العادي. وُضعت علامتا الحاشيتين عند اللفظين اللذين تتعلقان بهما مباشرة.
