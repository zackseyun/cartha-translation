  yaml_path: translation/nt/john/011/052.yaml
  text: and not for the nation only[b][a], but also so that he might gather into one the scattered children of God.
translation:
  language: ar
  text: وليس عن الأمة وحدها[a]، بل أيضًا لكي يجمع أبناء الله المشتتين في واحد.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'المقصود بـ«الأمة» في السياق هو الأمة اليهودية. ويمكن أيضًا ترجمة صدر الآية: «وليس عن الأمة فقط، بل لكي يجمع أيضًا أبناء الله المشتتين في واحد».'
    reason: ملاحظة سياقية وبديل تركيبي يحفظ احتمال تعلّق «أيضًا» بالفعل «يجمع».
lexical_decisions:
- source_word: ἔθνους
  choice: الأمة
  rationale: تحفظ المفرد والدلالة الجماعية، وتشير في السياق إلى الأمة اليهودية دون إدخال هذا التفسير في صلب النص.
- source_word: ἵνα
  choice: لكي
  rationale: أداة غرض عربية طبيعية تحفظ القوة الغائية للعبارة اليونانية، مع بقاء احتمال تداخل الغرض والنتيجة بحسب السياق.
- source_word: τέκνα τοῦ θεοῦ
  choice: أبناء الله
  rationale: تعبير عربي شامل في هذا السياق، يقابل τέκνα دون حصره في الذكور أو استبداله بتعبير طائفي أضيق.
- source_word: τὰ διεσκορπισμένα
  choice: المشتَّتين
  rationale: يحفظ وصفهم بأنهم في حالة تشتت، وفق دلالة اسم المفعول التام المبني للمجهول.
- source_word: συναγάγῃ
  choice: يجمع
  rationale: ينقل فعل الجمع بإيجاز، وتدل «لكي» على علاقته بالغرض دون حاجة إلى تمثيل صيغة الاحتمال اليونانية بفعل مساعد غير طبيعي في العربية.
- source_word: εἰς ἕν
  choice: إلى واحد
  rationale: يحافظ على إيجاز اليونانية وغموضها المقصود، من غير إضافة «جسد» أو تفسير العبارة صراحةً بأنها «وحدة».
- source_word: καὶ οὐχ ὑπὲρ τοῦ ἔθνους μόνον, ἀλλ’
  choice: وليس عن الأمة وحدها، بل أيضًا
  rationale: تستأنف فكرة الآية السابقة عن موت يسوع نيابةً عن الآخرين، وتحفظ بناء المقابلة بين «وحدها» و«بل أيضًا».
theological_decisions:
- issue: هوية «أبناء الله»
  choice: الإبقاء على التعبير واسعًا بوصفهم أبناء الله المشتتين خارج نطاق «الأمة» المذكورة.
  alternative: حصرهم في يهود الشتات، أو تعريفهم صراحةً بأنهم المختارون من اليهود والأمم.
  rationale: تقابل الآية بين الأمة وبين جماعة أوسع، لكنها لا تحدد هنا بدقة جميع أفراد هذه الجماعة؛ لذلك لا تحسم الترجمة الخلاف التفسيري.
- issue: دلالة εἰς ἕν
  choice: إلى واحد
  alternative: إلى جسد واحد؛ في وحدة؛ ليصيروا واحدًا
  rationale: لا يذكر الأصل اسمًا مثل «جسد»، وصيغته الموجزة تسمح بمدى لاهوتي لا ينبغي تضييقه بإضافة تفسيرية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُخدمت «الأمة» للمحافظة على الدلالة الجماعية، و«إلى واحد» للمحافظة على إيجاز الأصل من غير إضافة تفسيرية. وُضع مؤشر الحاشية [a] في المتن.
