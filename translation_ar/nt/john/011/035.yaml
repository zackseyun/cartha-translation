lexical_decisions:
- source_word: ἐδάκρυσεν
  choice: بكى
  rationale: فعل ماضٍ يوناني من δακρύω يدل على ذرف الدموع. «بكى» هو المقابل العربي الطبيعي الموجز، من غير إضافة معنى البدء أو رفع الصوت بالنحيب.
- source_word: ὁ Ἰησοῦς
  choice: يسوع
  rationale: اسم علم مسبوق بأداة التعريف في اليونانية وهو فاعل الجملة؛ ويُترجم في العربية على الصورة المألوفة «يسوع» من دون أداة تعريف.
theological_decisions:
- issue: وصف انفعال يسوع الإنساني
  choice: بكى يسوع
  alternative: ذرف يسوع الدموع
  rationale: تحافظ الصياغة على العرض السردي المباشر لتأثر يسوع الإنساني الحقيقي، من غير تهوين لمشاعره أو توسيعها إلى نحيب مرتفع لا يدل عليه الفعل اليوناني.
