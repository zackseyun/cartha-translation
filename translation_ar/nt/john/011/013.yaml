  rationale: رُفع الالتباس العربي في مرجع الضمير بتسمية لعازر، ونُقلت علامة الحاشية إلى «النوم» لأنها تشرح تلك العبارة. واستُبدل التركيب الحرفي غير الطبيعي في المتن بـ«النوم»، مع إبقاء البديل الحرفي والتفسير اللازم في الحاشية.
