  source_fidelity: يُحافِظ النص على الزمن السابق في «كان قد تكلّم» وعلى المقابلة بـ«لكنهم ظنّوا». لكن الضمير في «موته» قد يُفهم عربيًا على أنه عائد إلى يسوع، بينما المقصود في السياق هو موت لعازر؛ لذلك يلزم رفع هذا الالتباس. كما أن عبارة «رقاد النوم» حرفية لكنها غير طبيعية في متن عربي حديث، وتوحي في العربية بالوفاة أكثر من النوم العادي، فتضعف المفارقة السردية.
