  text: εἰρήκει δὲ ὁ Ἰησοῦς περὶ τοῦ θανάτου αὐτοῦ. ἐκεῖνοι δὲ ἔδοξαν ὅτι περὶ τῆς κοιμήσεως τοῦ ὕπνου λέγει.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/013.yaml
  text: Jesus had spoken about his death[a], but they thought that he was speaking about the sleep of rest.
translation:
  language: ar
  text: وكان يسوع قد تكلَّم عن موت لعازر، لكنهم ظنّوا أنه يتكلَّم عن النوم[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «عن رُقاد النوم»، أي إنهم ظنّوا أنه يقصد نومًا حرفيًا لا الموت.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰρήκει
  choice: كان قد تكلَّم
  rationale: صيغة الماضي التام تدل على كلام سبق ظنَّ التلاميذ، وهذا التركيب العربي يحفظ العلاقة الزمنية بوضوح.
- source_word: δὲ ... δὲ
  choice: و... لكن
  rationale: الأولى انتقالية خفيفة تلائمها الواو في العربية، والثانية تفيد المقابلة بين قصد يسوع وفهم التلاميذ.
- source_word: περὶ τοῦ θανάτου αὐτοῦ
  choice: عن موته
  rationale: ترجمة مباشرة وطبيعية؛ والضمير يعود في السياق إلى لعازر من غير حاجة إلى إضافة اسمه في النص.
- source_word: ἐκεῖνοι
  choice: هم
  rationale: الإحالة إلى التلاميذ مفهومة من السياق، والضمير العربي هو التعبير الطبيعي.
- source_word: ἔδοξαν
  choice: ظنّوا
  rationale: ينقل انطباع التلاميذ الخاطئ بوضوح من غير زيادة تفسيرية.
- source_word: κοιμήσεως τοῦ ὕπνου
  choice: رقاد النوم
  rationale: يحفظ التركيب الإضافي المؤكد في اليونانية ويميّز النوم الحرفي الذي فهمه التلاميذ من استعمال الرقاد كناية عن الموت.
- source_word: λέγει
  choice: يتكلَّم
  rationale: المضارع اليوناني محفوظ بمضارع عربي داخل مقول الظن، وهو طبيعي في هذا السياق.
theological_decisions:
- issue: هل يوحي وصف الموت بالرقاد بعقيدة محددة عن حال الموتى؟
  choice: التصريح بأن المقصود هو الموت، مع إبقاء فهم التلاميذ للنوم الحرفي
  alternative: صياغة تفسّر طبيعة حال الميت أو تحسم مدلول الرقاد عقائديًا
  rationale: الآية تشرح سوء فهم سرديًا ولا تقرر هنا مذهبًا عن الحالة الوسطى؛ لذلك تُحفظ المقابلة من غير توسع عقائدي.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. اختير «رقاد النوم» للمحافظة على التوكيد اليوناني مع إيضاح غرابته الأسلوبية في الحاشية. وُضعت علامة الحاشية بعد العبارة التي تشرحها.
