  text: Ἐλθὼν οὖν ὁ Ἰησοῦς εὗρεν αὐτὸν τέσσαρας ⸂ἤδη ἡμέρας⸃ ἔχοντα ἐν τῷ μνημείῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/017.yaml
  text: So when Jesus arrived, he found that Lazarus had already been in the tomb four days.
translation:
  language: ar
  text: فَلَمَّا وَصَلَ يَسُوعُ، وَجَدَ أَنَّ لِعَازَرَ قَدْ مَضَتْ عَلَيْهِ أَرْبَعَةُ أَيَّامٍ فِي الْقَبْرِ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλθὼν
  choice: فَلَمَّا وَصَلَ يَسُوعُ
  rationale: اسم الفاعل اليوناني الماضي يدل هنا على حدث سبق الفعل الرئيس، وصيغة «لما وصل» تنقل العلاقة الزمنية بسرد عربي طبيعي.
- source_word: οὖν
  choice: الفاء في «فلما»
  rationale: الأداة هنا وصلة سردية تربط وصول يسوع بما سبق، وتؤدي الفاء هذا الربط طبيعيًا من غير أن توحي باستنتاج منطقي صريح.
- source_word: εὗρεν
  choice: وَجَدَ
  rationale: ترجمة مباشرة وطبيعية للفعل في هذا السياق السردي، ومعناه هنا تبيّن له واقع الحال.
- source_word: αὐτὸν
  choice: أَنَّ لِعَازَرَ
  rationale: أُظهر مرجع الضمير، وهو لعازر، اتقاءً للالتباس؛ وهو معلوم بوضوح من السياق ولا يضيف معلومة جديدة.
- source_word: τέσσαρας ἤδη ἡμέρας ἔχοντα
  choice: قَدْ مَضَتْ عَلَيْهِ أَرْبَعَةُ أَيَّامٍ
  rationale: التركيب اليوناني يفيد مدة اكتملت بالفعل. وهذه العبارة العربية تنقل معنى انقضاء الأيام الأربعة وتحفظ دلالة ἤδη بواسطة «قد» مع الفعل الماضي.
- source_word: μνημείῳ
  choice: الْقَبْرِ
  rationale: يدل اللفظ هنا على موضع الدفن، و«القبر» هو المقابل العربي الواضح والطبيعي في السياق.
theological_decisions:
- issue: إظهار مرجع الضمير αὐτόν
  choice: 'التصريح باسم لعازر: «وجد أن لعازر...»'
  alternative: 'الإبقاء على الضمير: «وجده...»'
  rationale: مرجع الضمير واضح في اليونانية من السياق، لكن التصريح بالاسم يمنع اللبس في العربية من غير أن يحسم مسألة لاهوتية أو يضيف معنى غير موجود.
- issue: تحديد بدء مدة الأيام الأربعة
  choice: «مضت عليه أربعة أيام في القبر»
  alternative: «كان في القبر منذ أربعة أيام»
  rationale: السياق يدل على مدة وجود لعازر في القبر، لكن النص لا يفصّل طريقة عدّ الأيام؛ لذلك صيغت العبارة من غير إضافة مثل «أربعة أيام كاملة».
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «وصل» بدل الصياغة الحرفية الثقيلة «إذ أتى»، ودُمجت οὖν في الفاء السردية. لا توجد علامات حواشٍ لأن النص لا يحتاج إلى حاشية تفسيرية أو نصية.
