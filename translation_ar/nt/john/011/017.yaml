  source_fidelity: 'النص العربي ينقل بدقة البنية السردية والمعنى الأساسي للنص اليوناني: وصول يسوع، ثم تبيّنه أن لعازر كان في القبر منذ مدة أربعة أيام. الفاء في «فلما» تؤدي وظيفة الوصل السردي لـ οὖν، و«قد مضت عليه أربعة أيام» تنقل بصورة سليمة دلالة ἤδη مع مدة الأيام الأربعة، من دون إضافة بشأن كيفية احتسابها.'
