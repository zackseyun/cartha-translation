  terminology: «يسوع» و«لعازر» صائبان، و«القبر» مقابل عربي واضح ومناسب لـ μνημεῖον في هذا الموضع. لا تتضمن الصياغة تحميلًا لاهوتيًا أو تفسيرًا زائدًا.
