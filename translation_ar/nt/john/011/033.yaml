  to: فلما رأى يسوعُ مريمَ تبكي، واليهودَ الذين جاءوا معها يبكون[a]، تأثر بعمق في روحه[b] واضطرب في داخله.
  rationale: أضيفت حاشية سياقية لـ«اليهود» موافقةً للدلالة في هذا السياق ولأثر المراجعة الإنجليزي. واستبدلت «اضطرب بشدة» بـ«تأثر بعمق» في النص الرئيس لتفادي ترجيح معنى بعينه للفعل اليوناني المختلف عليه، مع إبقاء البدائل الأقوى في الحاشية. كما استبدلت «أقلق نفسه» بـ«اضطرب في داخله» لأنها أفصح وأشيع في العربية الحديثة، وتحفظ الدلالة الداخلية المنعكسة دون تغيير معنى المقطع.
