review_pass:
  verdict: revise
  source_fidelity: يُحسن النص نقل البنية الزمنية، والبكاء، ومجيء الحاضرين مع مريم، كما يحافظ على التمييز بين الانفعال في الروح واضطراب يسوع. لكن «اضطرب بشدة» يضعف جانب الاستياء/الانزعاج القوي المحتمل في ἐνεβριμήσατο، و«أقلق نفسه» غير مألوفة في العربية الفصحى الحديثة لهذا السياق. كذلك لا توجد حاشية توضّح أن «اليهود» هم الحاضرون مع مريم في السياق، لا الشعب اليهودي عامة.
  naturalness: '«فلما رأى» و«الذين جاءوا معها» سليمتان وطبيعيتان. والأوضح والأكثر سلاسة في الخاتمة: «تأثر بعمق في روحه واضطرب في داخله». وهذه الصياغة لا تعيّن سبب الانفعال، وتحافظ بقدر مناسب على انعكاسية الفعل الثاني في عربية طبيعية.'
  terminology: يبقى «اليهود» المقابل المعجمي المباشر لـἸουδαίους، مع حاشية سياقية لازمة لتفادي التعميم. ويُستحسن جعل الحاشية الخاصة بـἐνεβριμήσατο أوسع، فتذكر «استاء» و«احتدّ» و«تأثر بعمق» بوصفها إمكانات لا قراءات محسومة.
  issues:
  - severity: medium
    issue: غياب حاشية لـ«اليهود»
    rationale: 'يتضمن مسار المراجعة الإنجليزي تنبيهًا معجميًا وسياقيًا مهمًا: المراد هم المعزّون اليهود الحاضرون مع مريم، لا تعميمًا على الشعب اليهودي. ينبغي إتاحة هذا التوضيح في العربية أيضًا.'
  - severity: low
    issue: «أقلق نفسه» تعبير غير سلس في هذا الموضع
