  text: Therefore[a], when Jesus saw her weeping, and the Jews who had come with her weeping[b], he was deeply moved in his spirit and troubled himself.
translation:
  language: ar
  text: فلما رأى يسوعُ مريمَ تبكي، واليهودَ الذين جاءوا معها يبكون[a]، تأثر بعمق في روحه[b] واضطرب في داخله.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أيضًا ترجمة «اليهود» بـ«اليهوديّين» أو «أهل اليهودية». والمقصود هنا المعزّون اليهود الحاضرون مع مريم، لا الشعب اليهودي كله.
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أن تعني العبارة أيضًا: «استاء بشدة في روحه» أو «احتدّ في داخله». فاللفظ اليوناني يدل على انفعال داخلي قوي، وقد يتضمن الاستياء أو الغضب، من غير أن يحدد النص صراحة سببه أو وجهته.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: فـ
  rationale: تفيد مواصلة السرد والنتيجة السياقية بعبارة عربية طبيعية، من غير إثقال النص بـ«لذلك».
- source_word: ὡς εἶδεν
  choice: لما رأى
  rationale: تؤدي الدلالة الزمنية للتركيب وتوضح تعاقب الحدثين.
- source_word: κλαίουσαν / κλαίοντας
  choice: تبكي / يبكون
  rationale: ينقل الفعلان البكاء المسموع بلغة عربية واضحة ورصينة، من غير حصره في النواح الطقسي.
- source_word: συνελθόντας αὐτῇ
  choice: الذين جاءوا معها
  rationale: ترجمة مباشرة وطبيعية للمشاركة في المجيء، وتناسب سياق مرافقة مريم.
- source_word: Ἰουδαίους
  choice: اليهود
  rationale: المقابل المباشر هنا، والمقصود في السياق اليهود الحاضرون مع مريم لا الشعب اليهودي كله.
- source_word: ἐνεβριμήσατο
  choice: اضطرب بشدة
  rationale: يحفظ قوة الانفعال الداخلي ولا يحسم هل هو غضب أم استياء أم تأثر عميق؛ وتوضح الحاشية البدائل الدلالية.
- source_word: τῷ πνεύματι
  choice: في روحه
  rationale: يحفظ الدلالة على المجال الداخلي الذي وقع فيه الانفعال.
- source_word: ἐτάραξεν ἑαυτόν
  choice: أقلق نفسه
  rationale: يحافظ على الصيغة الانعكاسية الصريحة في اليونانية بدل تسويتها إلى «انزعج» أو «اضطرب» فقط.
theological_decisions:
- issue: طبيعة انفعال يسوع في ἐνεβριμήσατο
  choice: اضطرب بشدة
  alternative: استاء بشدة؛ احتدّ في داخله؛ تأثر بعمق
  rationale: اللفظ يدل على انفعال قوي وقد يتضمن الاستياء أو الغضب، لكن النص لا يحدد هنا على نحو قاطع وجهة ذلك الانفعال أو سببه؛ لذلك تُحفظ قوة التعبير مع إبقاء التوتر التفسيري.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. ذُكر اسم مريم بدل الضمير لسلامة الإحالة في الآية المنفردة. حُفظت الصيغة الانعكاسية في خاتمة الآية، ووُضعت علامة الحاشية في المتن عند العبارة التي تشرحها.
