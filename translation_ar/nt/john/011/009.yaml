  text: ἀπεκρίθη Ἰησοῦς· Οὐχὶ δώδεκα ⸂ὧραί εἰσιν⸃ τῆς ἡμέρας; ἐάν τις περιπατῇ ἐν τῇ ἡμέρᾳ, οὐ προσκόπτει, ὅτι τὸ φῶς τοῦ κόσμου τούτου βλέπει·
base_translation:
  language: en
  yaml_path: translation/nt/john/011/009.yaml
  text: Jesus answered[a], “Are there not twelve hours in the day? If anyone walks in the day, he does not stumble[c][b], because he sees the light of this world.”
translation:
  language: ar
  text: 'أجاب يسوع: «أليست ساعات النهار[a] اثنتي عشرة؟ إن مشى أحد في النهار فلا يعثر، لأنه يرى نور هذا العالم.»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أليست للنهار اثنتا عشرة ساعة؟»'
    reason: بديل لفظي يحفظ بصورة أوضح احتمال تعلق الإضافة «τῆς ἡμέρας» بالساعات.
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: أجاب
  rationale: فعل سردي مألوف ينقل معنى الاستجابة من غير إضافة دلالة ليست في اليونانية.
- source_word: Οὐχὶ
  choice: أليست
  rationale: صيغة استفهام إنكاري تتوقع جوابًا بالإيجاب، وتحافظ عليها العربية بصورة طبيعية.
- source_word: δώδεκα ὧραί εἰσιν τῆς ἡμέρας
  choice: ساعات النهار اثنتي عشرة
  rationale: صياغة عربية واضحة تحفظ عدد الساعات وعلاقتها بفترة النهار، مع إبقاء احتمال فهم الإضافة كما توضحه الحاشية.
- source_word: ἐάν τις περιπατῇ
  choice: إن كان أحد يمشي
  rationale: يحفظ الشرط والمرجع المفرد العام في العبارة اليونانية.
- source_word: ἐν τῇ ἡμέρᾳ
  choice: في النهار
  rationale: ترجمة مباشرة تحافظ على التوازي مع صدر القول وعلى إمكان الدلالة المجازية.
- source_word: προσκόπτει
  choice: يعثر
  rationale: يحفظ الصورة الحرفية وإمكان امتدادها المجازي، بخلاف تعبيرات أضيق مثل يتعثر بشيء.
- source_word: τὸ φῶς
  choice: نور
  rationale: لفظ عربي طبيعي ورفيع يحفظ الصورة الأساسية والرنين اليوحناوي من غير تفسير زائد.
- source_word: τοῦ κόσμου τούτου
  choice: هذا العالم
  rationale: يحفظ الإضافة واسم الإشارة في اليونانية بعبارة عربية مألوفة.
- source_word: βλέπει
  choice: يرى
  rationale: ينقل المضارع الخبري مباشرة من غير إضافة معنى القدرة مثل يستطيع أن يرى.
theological_decisions:
- issue: الدلالة الرمزية المحتملة للنور في السياق اليوحناوي
  choice: إبقاء صورة «نور هذا العالم» كما هي من غير جعل الإشارة إلى يسوع أو الاستنارة الإلهية صريحة
  alternative: تفسير النور صراحة بأنه يسوع أو الهداية الإلهية
  rationale: تسمح العبارة في سياقها المباشر بصورة مأثورية عن السير نهارًا، مع احتمال رنين لاهوتي أوسع في إنجيل يوحنا؛ لذلك تُصان الدلالتان من غير حسم تفسيري.
- issue: المفرد التمثيلي في τις ... βλέπει
  choice: استعمال «أحد» ثم فعل مفرد مذكر مستتر الفاعل
  alternative: صياغة جمع عامة أو محايدة
  rationale: العربية تعبّر طبيعيًا عن المرجع العام المفرد بـ«أحد»، ويواصل الفعلان «يمشي» و«يرى» الإحالة المفردة من غير ضمير منفصل ثقيل.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «يعثر» بدل تعبير أكثر عامية، وحُفظ إيقاع السؤال البلاغي والتوازي بين «النهار» و«نور هذا العالم». وُضع مؤشر الحاشية [a] في النص الرئيس كما يلزم.
