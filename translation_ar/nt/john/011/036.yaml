  text: So the Jews were saying[a], “See how he loved him!”
translation:
  language: ar
  text: 'فكان اليهود يقولون[a]: «انظروا كيف كان يحبّه!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أهل اليهودية»، إذا فُهمت العبارة على أنها تشير بصورة أكثر تحديدًا إلى الحاضرين اليهود هناك من منطقة اليهودية.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλεγον
  choice: كانوا يقولون
  rationale: الماضي الناقص يدل على قول مستمر أو متكرر في المشهد، وصيغة «كانوا يقولون» تحفظ هذا الجانب.
- source_word: οὖν
  choice: فـ
  rationale: تفيد الربط بما سبق والاستنتاج من بكاء يسوع، والفاء طبيعية وموجزة في العربية.
- source_word: οἱ Ἰουδαῖοι
  choice: اليهود
  rationale: تنقل اللفظ اليوناني مباشرة، مع توضيح المرجع المحلي المحتمل في الحاشية؛ والمقصود في السياق المشاهدون اليهود الحاضرون، لا تعميم الحكم على جميع اليهود.
- source_word: Ἴδε
  choice: انظروا
  rationale: أمر للفت الانتباه. استُعمل الجمع لأن الخطاب صادر في جماعة وموجّه إلى الحاضرين، وهو طبيعي في العربية.
- source_word: πῶς
  choice: كم
  rationale: في هذا السياق التعجبي تعبّر «كم» طبيعيًا عن مقدار المحبة، وإن كان اللفظ اليوناني قد يحتمل أيضًا معنى الكيفية.
- source_word: ἐφίλει
  choice: كان يحبّه
  rationale: يدل الفعل على المحبة والمودة الشخصية، و«يحبّه» أوضح وأقوى من «كان مولعًا به» أو «كان يودّه»، كما تحفظ صيغة «كان» جانب الماضي الناقص.
- source_word: αὐτόν
  choice: ـه
  rationale: ضمير مفعول به مفرد مذكر يعود إلى لعازر.
theological_decisions:
- issue: ترجمة οἱ Ἰουδαῖοι في إنجيل يوحنا
  choice: اليهود
  alternative: اليهوديّون من أهل اليهودية
  rationale: أُبقي اللفظ المباشر في المتن مراعاةً لشفافية النص، بينما توضّح الحاشية أن العبارة قد تُفهم إقليميًا وأن المرجع المباشر هنا هو الحاضرون في المشهد، فلا ينبغي أخذها كتعميم سلبي على الشعب اليهودي كله.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت الفاء للوصل السلس، وصيغة الماضي الناقص لحفظ استمرارية القول، ووُضعت علامة الحاشية في المتن كما هو مطلوب.
