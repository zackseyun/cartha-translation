  text: λέγει αὐτῇ ὁ Ἰησοῦς· Ἀναστήσεται ὁ ἀδελφός σου.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/023.yaml
  text: Jesus says to her[a], “Your brother will rise again.”
translation:
  language: ar
  text: 'قال لها يسوع: «سيقوم أخوك.»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: قال
  rationale: المضارع التاريخي شائع في السرد اليوناني، لكن الماضي «قال» هو الأسلوب الطبيعي الواضح في السرد العربي، من غير تغيير في الحدث.
- source_word: αὐτῇ
  choice: لها
  rationale: تعبير عربي مباشر وطبيعي عن ضمير المفعول غير المباشر في اليونانية.
- source_word: Ἀναστήσεται
  choice: سيقوم
  rationale: الفعل مستقبل متوسط الصيغة، ويعني في سياق موت لعازر أنه سيقوم من الموت. و«سيقوم» تحافظ على صيغة الفاعل ولا تضيف لفظ «ثانية» غير الموجود صراحة في اليونانية.
- source_word: ὁ ἀδελφός σου
  choice: أخوك
  rationale: المقابل العربي الطبيعي والموجز للعبارة الاسمية الدالة على أخي مرثا.
- source_word: ὁ Ἰησοῦς
  choice: يسوع
  rationale: نقل الاسم الشخصي بالصيغة العربية الكتابية المألوفة، من دون تمثيل أداة التعريف اليونانية تمثيلًا مستقلًا.
theological_decisions:
- issue: دلالة القيامة وتوقيتها
  choice: سيقوم
  alternative: سيُقام؛ سيقوم ثانية
  rationale: «سيقوم» تفيد في السياق القيام من الموت، مع إبقاء قول يسوع مفتوحًا من جهة ما إذا كان يشير هنا إلى الإحياء القريب أو القيامة في اليوم الأخير. أما «سيُقام» فتُبرز فاعلًا إلهيًا ضمنيًا أكثر مما تفعل الصيغة اليونانية، و«ثانية» إضافة تفسيرية لا يقتضيها اللفظ العربي.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة وموجزة. استُخدم الماضي السردي الطبيعي في العربية، مع الحفاظ على إيجاز جواب يسوع وعلى التوتر المقصود في السياق بشأن زمن القيامة.
