  text: ⸂Ὁ οὖν Ἰησοῦς⸃ οὐκέτι παρρησίᾳ περιεπάτει ἐν τοῖς Ἰουδαίοις, ἀλλὰ ἀπῆλθεν ἐκεῖθεν εἰς τὴν χώραν ἐγγὺς τῆς ἐρήμου, εἰς Ἐφραὶμ λεγομένην πόλιν, κἀκεῖ ⸀ἔμεινεν μετὰ τῶν ⸀μαθητῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/054.yaml
  text: So Jesus no longer walked openly among the Jews[a], but departed from there to the region near the wilderness, to a city called Ephraim, and stayed there with the disciples.
translation:
  language: ar
  text: لذلك لم يَعُدْ يسوع يتجوّل علانيةً بين اليهود[a]، بل غادر من هناك إلى المنطقة القريبة من البرية، إلى مدينة تُدعى أفرايم، وأقام هناك مع التلاميذ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بين أهل اليهودية». وقد تدل عبارة «اليهود» في إنجيل يوحنا، بحسب السياق، على أهل اليهودية بوجه أخص، أو على السلطات اليهودية.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: لذلك
  rationale: تفيد نتيجة سردية مترتبة على المؤامرة السابقة لقتل يسوع، وتحفظ القوة الاستنتاجية في العربية بوضوح.
- source_word: οὐκέτι
  choice: لم يَعُدْ
  rationale: ينقل النفي الزمني الدال على توقف نمط سابق.
- source_word: παρρησίᾳ
  choice: علانيةً
  rationale: السياق يدل على الظهور والتحرك على الملأ، لا على الجرأة النفسية.
- source_word: περιεπάτει
  choice: يتجوّل
  rationale: الفعل الناقص يصور حركة يسوع المعتادة أو المستمرة؛ و«يتجوّل» طبيعية في سياق التنقل العلني، مع بقاء صورة السير.
- source_word: ἐν τοῖς Ἰουδαίοις
  choice: بين اليهود
  rationale: يحفظ المقابل المألوف مع إبقاء احتمال الدلالة الإقليمية «اليهوديين/أهل اليهودية» في الحاشية، لأن استعمال يوحنا للكلمة يتغير بحسب السياق.
- source_word: ἀπῆλθεν ἐκεῖθεν
  choice: غادر من هناك
  rationale: ينقل حركة الابتعاد عن الموضع السابق بإيجاز ووضوح.
- source_word: χώραν
  choice: المنطقة
  rationale: يدل هنا على نطاق جغرافي أو إقليم، لا على دولة بالمعنى الحديث.
- source_word: ἐγγὺς τῆς ἐρήμου
  choice: القريبة من البرية
  rationale: «البرية» تلائم الأرض القليلة العمران في الاستعمال الكتابي، ولا تفرض معنى الصحراء الرملية.
- source_word: εἰς Ἐφραὶμ λεγομένην πόλιν
  choice: إلى مدينة تُدعى أفرايم
  rationale: ترجمة مباشرة وطبيعية للتركيب، مع نقل πόλις إلى «مدينة» وλεγομένην إلى «تُدعى».
- source_word: κἀκεῖ ἔμεινεν
  choice: وأقام هناك
  rationale: «أقام» تعبير عربي طبيعي عن البقاء مدةً في موضع ضمن سياق السفر.
- source_word: μετὰ τῶν μαθητῶν
  choice: مع التلاميذ
  rationale: يحافظ على أداة التعريف ولا يضيف ضمير الملكية غير المذكور صراحةً في اليونانية.
theological_decisions:
- issue: مدلول Ἰουδαῖοι في إنجيل يوحنا
  choice: بين اليهود
  alternative: بين اليهوديين، أي أهل اليهودية
  rationale: اللفظ اليوحناوي قد يحمل دلالة قومية أو إقليمية أو يشير إلى القيادات بحسب السياق. يبقي المتن الصياغة العربية المألوفة، فيما تحفظ الحاشية الاحتمال الإقليمي كي لا يُفهم الكلام تعميمًا على جميع اليهود أو حصرًا في السلطات.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُعمل «يتجوّل علانيةً» لنقل الحركة العامة المستمرة، و«البرية» للمشهد الجغرافي الكتابي، مع تجنب إضافة «تلاميذه» لأن النص اليوناني يقول حرفيًا «التلاميذ».
