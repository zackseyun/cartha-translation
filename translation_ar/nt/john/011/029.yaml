lexical_decisions:
- source_word: ἐκείνη
  choice: ضمير مستتر في «سمعت» و«قامت»
  rationale: اسم الإشارة يعود إلى مريم المذكورة في السياق، والعربية الطبيعية تستغني عنه بضمير الفاعل المستتر ما دام المرجع واضحًا.
- source_word: δὲ
  choice: الفاء في «فلمّا»
  rationale: الأداة هنا رابط سردي خفيف، لا تفيد تضادًا قويًا؛ والفاء تلائم تعاقب أحداث الرواية في العربية.
- source_word: ὡς
  choice: لمّا
  rationale: تقدّم جملة زمنية تحدد وقت وقوع الفعل التالي، من غير تقوية المعنى إلى «حالما».
- source_word: ἤκουσεν
  choice: سمعت ذلك
  rationale: الفعل يعني «سمعت»، وأُضيف اسم الإشارة ليعود طبيعيًا إلى الخبر الذي نقلته مرثا في الآية السابقة.
- source_word: ἠγέρθη
  choice: قامت
  rationale: 'مع أن الصيغة اليونانية مبنية للمجهول صرفيًا، فهي هنا ذات معنى لازم: نهضت أو قامت، ولا تدل على أن فاعلًا آخر أقامها.'
- source_word: ταχὺ
  choice: مسرعةً
  rationale: ينقل معنى السرعة والمبادرة بصياغة عربية طبيعية، من غير المبالغة التي قد توحي بها «في الحال».
- source_word: ἤρχετο
  choice: ذهبت
  rationale: الماضي الناقص يصوّر الحركة الجارية نحو يسوع، لكن تسلسل السرد العربي الطبيعي يسمح بالماضي البسيط «ذهبت».
- source_word: πρὸς αὐτόν
  choice: إليه
  rationale: يفيد حركة مريم نحو يسوع، و«إليه» هي العبارة العربية الموجزة والطبيعية في السياق.
