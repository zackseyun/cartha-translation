base_translation:
  language: en
  yaml_path: translation/nt/john/011/055.yaml
  text: The Passover of the Jews was near[b][a], and many went up to Jerusalem from the countryside before the Passover to purify themselves.
translation:
  language: ar
  text: وكان فصح اليهود قريبًا، فصعد كثيرون من الأرياف إلى أورشليم قبل الفصح ليطهّروا أنفسهم.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي ليقوموا بما يلزم من طقوس التطهير استعدادًا للفصح.
    reason: cultural_note
lexical_decisions:
- source_word: Ἦν δὲ
  choice: وكان
  rationale: تنقل الواو صلة δέ الخفيفة بالسياق، ويؤدي «كان» وظيفة الفعل من غير إضافة ظرف زمان غير موجود في الأصل.
- source_word: ἐγγὺς
  choice: قد اقترب
  rationale: يعبّر تعبيرًا عربيًا طبيعيًا عن القرب الزمني للفصح.
- source_word: τὸ πάσχα τῶν Ἰουδαίων
  choice: فصح اليهود
  rationale: يحافظ على تركيب الإضافة اليوناني المتكرر في يوحنا، بدل تسويته إلى صفة.
- source_word: ἀνέβησαν πολλοὶ εἰς Ἱεροσόλυμα
  choice: فصعد كثيرون إلى أورشليم
  rationale: يحفظ فعل الصعود المرتبط جغرافيًا وعرفيًا بالحج إلى أورشليم، مع نقل πολλοί المستعمل اسميًا بصياغة موجزة.
- source_word: ἐκ τῆς χώρας
  choice: من الأرياف
  rationale: يفيد المناطق خارج المدينة بصياغة عربية واضحة، من غير حصرها في إقليم واحد محدد.
- source_word: πρὸ τοῦ πάσχα
  choice: قبل الفصح
  rationale: نقل زمني مباشر وواضح.
- source_word: ἵνα ἁγνίσωσιν ἑαυτούς
  choice: ليطهّروا أنفسهم
  rationale: تؤدي اللام معنى الغرض في ἵνα، وتحفظ معنى التطهير من غير إدخال تفسير طقسي مطوّل في المتن.
theological_decisions:
- issue: طبيعة التطهير السابق للفصح
  choice: ليطهّروا أنفسهم
  alternative: ليتطهّروا طقسيًا؛ ليكرّسوا أنفسهم
  rationale: السياق يدل على الاستعداد بحسب أحكام الطهارة اليهودية قبل الفصح، لكن المتن اليوناني يكتفي بفعل التطهير؛ لذلك تُحفظ عبارته ويُوضَّح السياق التاريخي في الحاشية من غير استيراد تصنيف مذهبي أو أخلاقي لاحق.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «فصح اليهود» للمحافظة على الإضافة الأصلية المتكررة في إنجيل يوحنا، و«أورشليم» للاسم الكتابي المألوف. وُضع مؤشر الحاشية بعد عبارة التطهير التي تشرحها مباشرة.
