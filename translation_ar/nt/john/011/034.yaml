  yaml_path: translation/nt/john/011/034.yaml
  text: And he said[a], “Where have you laid him?” They said to him, “Lord, come and see.”
translation:
  language: ar
  text: 'فقال: «أين وضعتموه؟» قالوا له: «يا ربّ[a]، تعالَ وانظر».


    [a] أو: «يا سيّد». يمكن أن تُستعمل الكلمة اليونانية κύριε لقبَ احترام في المخاطبة، لكن تُرجمت هنا «يا ربّ» لأنها تحافظ أيضًا على ما قد تحمله من دلالة أعمق عند مخاطبة يسوع.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يا سيّد». يمكن أن تُستعمل الكلمة اليونانية κύριε لقبَ احترام في المخاطبة، لكن تُرجمت هنا «يا ربّ» لأنها تحافظ أيضًا على ما قد تحمله من دلالة أعمق عند مخاطبة يسوع.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν
  choice: فقال
  rationale: الفعل λέγω هو فعل القول المعتاد. ومع أن الكلام التالي سؤال، فإن «فقال» يحافظ على صيغة المصدر من غير تحويل تفسيري إلى «فسأل».
- source_word: Ποῦ
  choice: أين
  rationale: أداة استفهام مباشرة عن المكان.
- source_word: τεθείκατε
  choice: وضعتموه
  rationale: صيغة تامة من τίθημι تشير إلى فعل وضع لعازر الذي تمّ وبقيت نتيجته؛ و«وضعتموه» هي الصياغة العربية الطبيعية الواضحة في هذا السياق، من غير إضافة صريحة غير موجودة مثل «دفنتموه».
- source_word: αὐτόν
  choice: ـه
  rationale: ضمير مذكر مفرد يعود إلى لعازر، وأُلحق بالفعل على نحو طبيعي في العربية.
- source_word: λέγουσιν
  choice: قالوا
  rationale: هو مضارع تاريخي في اليونانية، ويُنقل إلى الماضي في السرد العربي الطبيعي.
- source_word: Κύριε
  choice: يا ربّ
  rationale: نداء مباشر ليسوع. تحافظ «يا ربّ» على إمكان دلالة اللقب اللاهوتية، مع التنبيه في الحاشية إلى إمكان استعماله خطابَ احترام.
- source_word: ἔρχου
  choice: تعالَ
  rationale: فعل أمر مباشر من ἔρχομαι، وتؤديه «تعالَ» بوضوح وطبيعية.
- source_word: ἴδε
  choice: انظر
  rationale: فعل أمر من ὁράω؛ و«انظر» تلائم اقترانه بـ«تعال» وتحافظ على التعبير المباشر.
theological_decisions:
- issue: ترجمة κύριος عند مخاطبة يسوع
  choice: يا ربّ
  alternative: يا سيّد
  rationale: قد تكون الكلمة هنا خطاب احترام، وقد تحمل أيضًا صدى أعمق في سياق إنجيل يوحنا. اختيرت «يا ربّ» في المتن لصون هذا الاحتمال من غير حسم زائد، وأُثبت البديل في الحاشية حفاظًا على الغموض الحقيقي.
translation_notes:
  register: عربية فصحى معاصرة، واضحة وكريمة، مع حوار طبيعي موجز. وُضعت علامة الحاشية بعد «يا ربّ» لأنها تتعلق بترجمة κύριε، لا بفعل «فقال».
