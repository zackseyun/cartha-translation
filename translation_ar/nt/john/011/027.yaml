id: JHN.11.27
reference: John 11:27
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: λέγει αὐτῷ· Ναί, κύριε· ἐγὼ πεπίστευκα ὅτι σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ ὁ εἰς τὸν κόσμον ἐρχόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/027.yaml
  text: She said to him[a], “Yes, Lord; I have believed that you are the Messiah, the Son of God[b], the one coming into the world.”
translation:
  language: ar
  text: 'قالت له: «نعم يا رب، أنا قد آمنت أنك أنت المسيح[a]، ابن الله، الآتي إلى العالم[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «المسيح» لقب معناه «الممسوح».
    reason: lexical_clarification
  - marker: b
    text: 'أو: «الذي يأتي إلى العالم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτῷ
  choice: قالت له
  rationale: استُعمل الماضي بما يلائم السرد العربي الطبيعي، والفاعل المؤنث مفهوم من السياق، إذ المتكلمة مرثا.
- source_word: Ναί, κύριε
  choice: نعم يا رب
  rationale: «نعم» جواب إثبات مباشر، و«يا رب» يحفظ قوة النداء التوقيرية في سياق هذا الاعتراف.
- source_word: ἐγὼ πεπίστευκα
  choice: أنا قد آمنت
  rationale: إثبات الضمير ينقل توكيد ἐγώ، و«قد آمنت» يحفظ قدر الإمكان دلالة صيغة التام على إيمان ترسخ في الماضي وما زال قائمًا.
- source_word: ὅτι σὺ εἶ
  choice: أنك أنت
  rationale: «أن» تقدم مضمون الإيمان، والضمير المنفصل «أنت» يحفظ توكيد σὺ.
- source_word: ὁ χριστός
  choice: المسيح
  rationale: هذا هو المقابل العربي الراسخ للقب اليوناني Χριστός، ويحفظ معناه بوصفه لقبًا لا اسمًا شخصيًا مجردًا.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: ابن الله
  rationale: ترجمة مباشرة تحافظ على اللقب التعريفي وثقله في الاعتراف بيسوع.
- source_word: ὁ εἰς τὸν κόσμον ἐρχόμενος
  choice: الآتي إلى العالم
  rationale: يحفظ التركيب الوصفي القائم على اسم الفاعل، بما فيه من صدى التوقع لشخص معروف بأنه الآتي.
- source_word: κόσμον
  choice: العالم
  rationale: المقابل العربي الطبيعي لـ κόσμος في هذا السياق اليوحناوي، حيث يدل على عالم الوجود البشري الذي يأتي إليه الابن.
theological_decisions:
- issue: ترجمة Χριστός بوصفه لقبًا اعترافيًا
  choice: المسيح
  alternative: الممسوح أو المسيّا
  rationale: «المسيح» هو اللقب العربي الكتابي الراسخ، ويحافظ هنا على الهوية المسيانية التي تعترف بها مرثا دون تحويل اللقب إلى اسم شخصي محض.
- issue: قوة κύριε في خطاب مرثا
  choice: يا رب
  alternative: يا سيدي
  rationale: سياق الاعتراف بيسوع بوصفه المسيح وابن الله يرجح النداء التوقيري «يا رب»، مع عدم إضافة مضمون يتجاوز اللفظ نفسه.
- issue: دلالة صيغة التام في πεπίστευκα
  choice: أنا قد آمنت
  alternative: أنا أؤمن أو قد صرت أؤمن
  rationale: الصياغة المختارة تبقي الإيمان فعلًا سابقًا ذا نتيجة مستمرة، من غير أن تحسم هل التركيز على بدء الإيمان أم على حالته الراهنة وحدها.
- issue: وظيفة ὁ ἐρχόμενος
  choice: الآتي إلى العالم
  alternative: الذي يأتي إلى العالم
  rationale: اسم الفاعل المعرف قد يعمل وصفًا لقبيًا للشخص المنتظر؛ أبقت الترجمة هذا الإيجاز والرنين، مع بيان الصياغة الوصلية الممكنة في الحاشية.
translation_notes:
  register: فصحى معاصرة واضحة ووقورة. حوفظ على التوكيد في «أنا» و«أنت»، وعلى تتابع الألقاب الاعترافية، مع تجنب شرحها داخل المتن أو تسوية دلالة صيغة التام والمشاركة الحاضرة تسوية زائدة.
