lexical_decisions:
- source_word: τινὲς δὲ ἐξ αὐτῶν
  choice: لكنَّ بعضًا منهم
  rationale: تفيد العبارة جماعةً فرعية من المذكورين قبلًا، وتحفظ «لكنَّ» قوة المقابلة السياقية في δὲ.
- source_word: ἀπῆλθον πρὸς τοὺς Φαρισαίους
  choice: ذهبوا إلى الفريسيين
  rationale: تعبير عربي طبيعي يدل على انتقالهم إلى الفريسيين؛ ولا يقتضي السياق إبراز معنى المغادرة بلفظ مستقل.
- source_word: εἶπαν αὐτοῖς
  choice: أخبروهم
  rationale: ينقل معنى إبلاغهم بالأمر في هذا السياق السردي، من غير إضافة دافع عدائي.
- source_word: ἃ ἐποίησεν Ἰησοῦς
  choice: بما فعله يسوع
  rationale: صياغة عربية موجزة وطبيعية تحافظ على مضمون الموصول الجمعي اليوناني، وعلى سبق فعل يسوع بالنسبة إلى الإخبار.
theological_decisions:
- issue: دافع الذين ذهبوا إلى الفريسيين
  choice: لغة إخبار محايدة لا تصرّح بالدافع
  alternative: وشوا بيسوع أو أبلغوا عنه بقصد الإدانة
  rationale: النص اليوناني يذكر ذهابهم وإخبارهم بما فعله يسوع، لكنه لا يصرّح بنيتهم؛ لذلك لا تُضاف دلالة الخيانة أو العداء.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة. استُعمل «أخبروهم» بوصفه تعبيرًا سرديًا طبيعيًا ومحايدًا، مع تجنب الألفاظ التي تنسب إليهم الوشاية أو الخيانة.
