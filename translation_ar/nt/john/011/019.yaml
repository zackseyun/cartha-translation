  text: Many of the Jews had come to Martha and Mary to comfort them about their brother[a].
translation:
  language: ar
  text: وكان كثيرون من اليهود قد جاؤوا إلى مرثا ومريم ليعزّوهما في أخيهما.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وكان كثيرون من سكان اليهودية قد جاؤوا إلى مرثا ومريم». يمكن أن يدل اللفظ اليوناني على اليهود عمومًا، أو على سكان اليهودية تحديدًا في بعض سياقات إنجيل يوحنا.'
    reason: alternative_reading
lexical_decisions:
- source_word: πολλοὶ δὲ
  choice: وكان كثيرون
  rationale: πολλοί تعني «كثيرون»، وأما δέ فهي أداة ربط خفيفة؛ نُقلت هنا بالواو مع «كان» لربط الجملة بالسياق السردي من غير الإيحاء بتعارض قوي.
- source_word: ἐκ τῶν Ἰουδαίων
  choice: من اليهود
  rationale: التركيب جزئي، أي «كثيرون من بين اليهود». ولفظ Ἰουδαῖοι هنا وصف غير سجالي للذين أتوا للتعزية، لذا يلائم «اليهود»، مع إثبات احتمال «أهل اليهودية» في الحاشية.
- source_word: ἐληλύθεισαν
  choice: قد جاؤوا
  rationale: صيغة الماضي التام تدل على مجيئهم السابق بالنسبة إلى زمن المشهد؛ ويؤدي «كان... قد جاؤوا» هذا المعنى بالعربية.
- source_word: πρὸς τὴν Μάρθαν καὶ Μαριὰμ
  choice: إلى مرثا ومريم
  rationale: πρός مع النصب تفيد التوجه إلى شخصين أو زيارتهما، واستُعمل الاسمان العربيان الشائعان.
- source_word: ἵνα παραμυθήσωνται αὐτὰς
  choice: ليعزّوهما
  rationale: ἵνα مع صيغة الالتزام تفيد الغرض، وπαραμυθέομαι هنا يعني التعزية والمواساة في الحزن. وصيغة التثنية العربية تحافظ بدقة على عود الضمير إلى الأختين.
- source_word: περὶ τοῦ ἀδελφοῦ
  choice: في أخيهما
  rationale: περί مع المضاف إليه تعني «بشأن/من جهة». والتعبير العربي الطبيعي في سياق الوفاة هو «عزّاهما في أخيهما»، مع بيان أن الأخ واحد مشترك بينهما.
theological_decisions:
- issue: دلالة Ἰουδαίων في سياق إنجيل يوحنا
  choice: اليهود
  alternative: أهل اليهودية
  rationale: السياق هنا وصفي لا سجالي، ويتحدث عن جماعة جاءت لتعزية مرثا ومريم؛ لذلك يناسب المعنى الإثني الديني الأوسع «اليهود». ومع ذلك، قد يدل اللفظ في بعض مواضع يوحنا على أهل اليهودية تحديدًا، فحُفظ هذا الاحتمال في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُعمل «ليعزّوهما في أخيهما» بوصفه تعبيرًا عربيًا طبيعيًا في سياق الحداد، وحُفظت صيغة التثنية لتحديد مرجع الضمير.
