base_translation:
  language: en
  yaml_path: translation/nt/john/011/037.yaml
  text: But some of them said[a], “Could not this man, who opened the eyes of the blind man, also have made it so that this man would not die?”
translation:
  language: ar
  text: 'لكن قال بعضهم: «أما كان هذا الذي فتح عيني الأعمى قادرًا أيضًا أن يمنع هذا الرجل من الموت؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τινὲς δὲ ἐξ αὐτῶν
  choice: لكن بعضهم
  rationale: تفيد العبارة «بعضًا منهم»، وتؤدي «لكن» وظيفة δέ في إبراز التباين مع رد الفعل السابق.
- source_word: εἶπαν
  choice: قالوا
  rationale: الماضي البسيط ملائم لصيغة الماضي السردية في اليونانية.
- source_word: Οὐκ ἐδύνατο
  choice: أما كان ... قادرًا
  rationale: صياغة عربية طبيعية لسؤال إنكاري عن القدرة في الزمن الماضي، مع إبقاء نبرة الاعتراض الضمني.
- source_word: οὗτος ὁ ἀνοίξας
  choice: هذا الذي فتح
  rationale: يحافظ اسم الإشارة على النبرة المباشرة، وتُنقل الصفة الفعلية بجملة موصولة طبيعية.
- source_word: τοὺς ὀφθαλμοὺς τοῦ τυφλοῦ
  choice: عيني الأعمى
  rationale: المثنى هو التعبير العربي الطبيعي للعينين، و«الأعمى» يشير إلى الرجل المعروف من السياق السابق.
- source_word: ποιῆσαι ἵνα ... μὴ ἀποθάνῃ
  choice: أن يمنع ... من الموت
  rationale: 'ينقل المعنى السببي للتركيب بوضوح وإيجاز في العربية: إحداث نتيجة عدم الموت، من غير إضافة تفسير إلى النص.'
- source_word: καὶ οὗτος
  choice: أيضًا ... هذا الرجل
  rationale: «أيضًا» تنقل καί، و«هذا الرجل» يحافظ على اسم الإشارة ويميّز لعازر عن يسوع.
theological_decisions:
- issue: نبرة سؤال المتكلمين
  choice: سؤال إنكاري يحمل تشكيكًا ضمنيًا في عدم منع موت لعازر
  alternative: سؤال محايد عن قدرة يسوع
  rationale: صيغة Οὐκ ἐδύνατο تتوقع جوابًا مثبتًا وتوحي بالاعتراض، لكن الترجمة لا تضيف اتهامًا صريحًا غير موجود في النص.
- issue: العلاقة بين القدرة ومنع الموت
  choice: إبقاء السؤال عن إمكان منع الموت دون تفسير سبب عدم التدخل
  alternative: إضافة تفسير لنية يسوع أو غرضه
  rationale: يحافظ ذلك على التوتر اللاهوتي والسردي الذي يتركه النص قائمًا.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُخدمت «أما كان ... قادرًا» لصون قوة السؤال الإنكاري، و«يمنع هذا الرجل من الموت» بوصفها الصياغة العربية الطبيعية الأقرب إلى المعنى السببي.
