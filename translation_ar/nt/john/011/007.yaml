base_translation:
  language: en
  yaml_path: translation/nt/john/011/007.yaml
  text: Then after this he says to the disciples[a], “Let us go into Judea again.”
translation:
  language: ar
  text: 'ثُمَّ، بَعْدَ ذَلِكَ، يَقُولُ لِلتَّلَامِيذِ: «لِنَذْهَبْ مَرَّةً أُخْرَى إِلَى الْيَهُودِيَّةِ».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπειτα μετὰ τοῦτο
  choice: ثُمَّ، بَعْدَ ذَلِكَ،
  rationale: يحافظ على تعبيري التتابع الزمني الواردين في اليونانية، مع فصل العبارة الاعتراضية بفاصلتين ليأتي الأسلوب العربي واضحًا وطبيعيًا.
- source_word: λέγει
  choice: يَقُولُ
  rationale: يحافظ على المضارع التاريخي الذي يستخدمه يوحنا لإضفاء الحيوية على السرد، بدل تسويته إلى الماضي.
- source_word: τοῖς μαθηταῖς
  choice: لِلتَّلَامِيذِ
  rationale: ينقل المفعول غير المباشر كما هو، من غير إضافة ضمير ملكية غير مصرَّح به في الأصل.
- source_word: Ἄγωμεν
  choice: لِنَذْهَبْ
  rationale: ينقل صيغة الحث في المتكلم الجمع بعبارة عربية مباشرة وطبيعية.
- source_word: εἰς τὴν Ἰουδαίαν
  choice: إِلَى الْيَهُودِيَّةِ
  rationale: «إلى» هي الصياغة العربية الطبيعية للدلالة على الحركة باتجاه الإقليم، ولا يقتضي السياق إبراز معنى الدخول بلفظ مستقل.
- source_word: πάλιν
  choice: مَرَّةً أُخْرَى
  rationale: يبين أن المقصود هو الرجوع إلى منطقة سبق الذهاب إليها، بصياغة عربية واضحة.
theological_decisions:
- issue: المضارع التاريخي في السرد اليوحناوي
  choice: 'الإبقاء على المضارع: «يقول»'
  alternative: 'تسوية السرد إلى الماضي: «قال»'
  rationale: الإبقاء على المضارع يعكس أسلوب النص اليوناني وحيويته من غير أن يغيّر المعنى اللاهوتي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. أُبقي التتابع المزدوج في «ثم، بعد ذلك» لأنه حاضر في الأصل، وحُفظ المضارع التاريخي. لم تُضف حاشية لمقابلة εἰς، لأن العربية الطبيعية تستخدم «إلى» هنا، ولا ينشأ فيها التقابل الإنجليزي نفسه بين “to” و“into”.
