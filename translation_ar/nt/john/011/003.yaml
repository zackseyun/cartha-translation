  yaml_path: translation/nt/john/011/003.yaml
  text: So the sisters sent word to him, saying, “Lord, look, the one you love is sick.”
translation:
  language: ar
  text: 'فأرسلت الأختان إليه تقولان: «يا رب، انظر، إن الذي تحبه مريض».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمة العبارة: «فأرسلت الأختان إليه خبرًا قائلتين»؛ فالنص اليوناني يذكر الإرسال إليه، ويُفهم أن المرسَل هو الرسالة أو الخبر.'
    reason: توضيح المفعول المحذوف في الأصل وتجنب الإيحاء بأن الأختين ذهبتا بنفسيهما.
lexical_decisions:
- source_word: ἀπέστειλαν ... πρὸς αὐτόν
  choice: أرسلت ... إليه
  rationale: ينقل فعل الإرسال مع جهة الرسالة بعبارة عربية طبيعية، ويُفهم من السياق أنهما أرسلتا إليه خبرًا.
- source_word: ἴδε
  choice: انظر
  rationale: يحافظ على صيغة الأمر الالتفاتية في اليونانية، وهي هنا لتنبيه المخاطَب إلى الحال لا لطلب الرؤية الحرفية.
- source_word: ὃν φιλεῖς
  choice: الذي تحبه
  rationale: ترجمة مباشرة وطبيعية للفعل φιλέω من غير تحميله تمييزًا اصطلاحيًا صارمًا عن أفعال المحبة الأخرى.
- source_word: ἀσθενεῖ
  choice: مريض
  rationale: يؤدي معنى كونه في حالة مرض بصياغة عربية واضحة وموجزة.
theological_decisions: []
