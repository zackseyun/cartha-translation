  yaml_path: translation/nt/john/011/014.yaml
  text: So then Jesus told them plainly[a], “Lazarus has died.”
translation:
  language: ar
  text: 'فقال لهم يسوع عندئذٍ بصراحة: «مات لعازر».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «حينئذٍ قال لهم يسوع علانيةً: مات لعازر».'
    reason: بديل معجمي يحافظ على إمكان ترجمة παρρησίᾳ بـ«علانيةً»، وعلى صياغة τότε οὖν بـ«حينئذٍ».
lexical_decisions:
- source_word: τότε οὖν
  choice: عندئذٍ
  rationale: تفيد العبارة مجتمعةً الانتقال الزمني الناتج من السياق؛ و«عندئذٍ» عربية طبيعية تحافظ على تقدّم السرد من غير تكرار ثقيل لأداتين رابطتين.
- source_word: εἶπεν αὐτοῖς
  choice: فقال لهم
  rationale: ترجمة مباشرة وطبيعية لفعل القول مع المفعول غير المباشر، وتلائم إدخال الكلام المنقول.
- source_word: παρρησίᾳ
  choice: بصراحة
  rationale: يدل اللفظ هنا على الكلام الصريح الواضح، في مقابل التعبير السابق غير المباشر عن النوم.
- source_word: Λάζαρος
  choice: لعازر
  rationale: الصيغة العربية الكتابية الشائعة للاسم العلم.
- source_word: ἀπέθανεν
  choice: مات
  rationale: ينقل الفعل الماضي الحدث بوضوح وإيجاز، من غير فرض صيغة زمنية مركبة لا يقتضيها اليوناني.
theological_decisions:
- issue: طبيعة تصريح يسوع عن حالة لعازر
  choice: تصريح مباشر بأن لعازر مات موتًا جسديًا
  alternative: الإبقاء على استعارة النوم الواردة في السياق السابق
  rationale: يستعمل النص هنا ἀπέθανεν صراحةً، فيرفع بنفسه الالتباس الناتج من التعبير السابق عن النوم؛ لذلك ينبغي ألا تُعاد الاستعارة في هذه الآية.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة ومهيبة. استُعملت «بصراحة» لإبراز زوال الإبهام في السياق، مع إثبات البديل «علانيةً» في الحاشية.
