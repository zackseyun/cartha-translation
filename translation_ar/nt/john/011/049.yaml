  rationale: ترجمة مباشرة للفعل مع المفعول غير المباشر.
- source_word: Ὑμεῖς
  choice: أنتم
  rationale: إظهار الضمير المنفصل يحفظ توكيد الضمير الصريح في اليونانية.
- source_word: οὐκ οἴδατε οὐδέν
  choice: لا تعرفون شيئًا على الإطلاق
  rationale: يحفظ النفي اليوناني المؤكد ونبرة التوبيخ في عربية فصيحة طبيعية، من غير أن يُفهم النفي المزدوج على أنه إبطال للنفي.
theological_decisions:
