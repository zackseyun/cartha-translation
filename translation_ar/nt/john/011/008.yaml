id: JHN.11.8
reference: John 11:8
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: λέγουσιν αὐτῷ οἱ μαθηταί· Ῥαββί, νῦν ἐζήτουν σε λιθάσαι οἱ Ἰουδαῖοι, καὶ πάλιν ὑπάγεις ἐκεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/008.yaml
  text: The disciples said to him[a], “Rabbi, just now the Jews were seeking to stone you, and are you going there again?”
translation:
  language: ar
  text: 'قال له التلاميذ: «يا معلّم، كان اليهود[a] قبل قليل يحاولون أن يرجموك، فهل تذهب إلى هناك ثانية؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو «أهل اليهودية»، أو بحسب السياق: «قادة اليهود». كثيرًا ما يستعمل يوحنا لفظ «اليهود» للدلالة على معارضي يسوع في اليهودية، لا على الشعب اليهودي كله.'
    reason: alternative_reading
lexical_decisions:
- source_word: λέγουσιν
  choice: قال
  rationale: فعل مضارع تاريخي في السرد اليوناني، ويؤدَّى طبيعيًا بالماضي في العربية المعاصرة.
- source_word: Ῥαββί
  choice: يا معلّم
  rationale: لقب سامي منقول إلى اليونانية، ومعناه «معلّم». ترجمة المعنى أوضح للقارئ العربي، مع الحفاظ على صيغة النداء.
- source_word: νῦν
  choice: قبل قليل
  rationale: يدل السياق على حداثة محاولة الرجم، لا على اللحظة الحاضرة وحدها.
- source_word: ἐζήτουν
  choice: كانوا يحاولون
  rationale: الماضي الناقص يفيد الاستمرار أو المحاولة في الزمن الماضي، و«كانوا يحاولون» ينقل المعنى المقصود طبيعيًا.
- source_word: λιθάσαι
  choice: أن يرجموك
  rationale: مقابل مباشر لفعل الرجم، من غير إضافة «حتى الموت» لأنها غير مصرّح بها في اليونانية.
- source_word: οἱ Ἰουδαῖοι
  choice: اليهود
  rationale: هذا هو المقابل المعجمي المباشر، مع بيان احتمال الدلالة الأضيق سياقيًا في الحاشية بدل حسمها داخل النص.
- source_word: πάλιν
  choice: ثانية
  rationale: تنقل معنى التكرار بوضوح وطبيعية.
- source_word: ὑπάγεις
  choice: تذهب
  rationale: الفعل هنا يدل على الذهاب إلى الموضع المذكور، وهو أنسب من «تنصرف» في السياق.
- source_word: ἐκεῖ
  choice: إلى هناك
  rationale: إشارة مكانية تعود إلى اليهودية، موضع الخطر المذكور في السياق.
theological_decisions:
- issue: مرجع οἱ Ἰουδαῖοι في إنجيل يوحنا
  choice: اليهود
  alternative: أهل اليهودية؛ أو، بحسب السياق، قادة اليهود
  rationale: أُبقي المقابل المعجمي المباشر في المتن لأن الآية لا تصرّح بأن المقصود هم القادة وحدهم، مع حفظ الاحتمال السياقي الأضيق في الحاشية حتى لا يُفهم اللفظ على أنه يعمّ الشعب اليهودي كله.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل الاستفهام «فهل» لإبراز دهشة التلاميذ واعتراضهم الضمني، وحُفظت الحاشية في المتن بعلامة [a].
