lexical_decisions:
- source_word: ᾔδειν
  choice: كنت أعلم
  rationale: تنقل صيغة الماضي من οἶδα بعربية طبيعية، من غير فرض معنى الماضي الأسبق.
- source_word: πάντοτέ μου ἀκούεις
  choice: تسمع لي دائمًا
  rationale: يحافظ التعبير «تسمع لي» على معنى السماع المتقبّل في سياق الصلاة، من غير أن يحصره صراحة في الاستجابة للطلب.
- source_word: ἀλλὰ
  choice: لكنني
  rationale: تؤدي قوة الاستدراك بوضوح وتربط علم يسوع السابق بسبب قوله العلني.
- source_word: διὰ τὸν ὄχλον
  choice: من أجل الجمع
  rationale: تنقل διά مع المنصوب بمعنى السبب أو المراعاة المقصودة، وتنسجم مع جملة الغاية اللاحقة.
- source_word: τὸν περιεστῶτα
  choice: الواقف حولي
  rationale: ينقل وضع الجمع المحيط بيسوع، ويجعل المرجع المكاني طبيعيًا في العربية.
- source_word: εἶπον
  choice: قلت هذا
  rationale: يبيّن بأقل قدر من الإيضاح أن الإشارة إلى الكلام الذي نطق به يسوع للتو.
- source_word: ἵνα πιστεύσωσιν
  choice: لكي يؤمنوا
  rationale: يحافظ على دلالة الغاية في ἵνα مع صيغة الالتزام.
- source_word: ὅτι σύ με ἀπέστειλας
  choice: أنك أنت أرسلتني
  rationale: يحافظ على فعل الإرسال وعلى توكيد الضمير اليوناني الصريح σύ بواسطة «أنت».
theological_decisions:
- issue: دلالة سماع الآب ليسوع
  choice: النص يقرر أن الآب يسمع ليسوع دائمًا، وأن يسوع نطق بهذا علنًا لمصلحة الجمع.
  alternative: قد يُفهم السماع على أنه استجابة للصلاة بوجه عام، أو بوصفه إبرازًا لعلاقة يسوع بالآب.
  rationale: تعبير «تسمع لي» يبقي معنى السماع المتقبّل حاضرًا من غير إضافة صياغة عقائدية أو حصره في تفسير واحد.
- issue: غاية الصلاة المعلنة
  choice: قال يسوع هذا لكي يؤمن الجمع بأن الآب أرسله.
  alternative: قد تُفهم الغاية على أنها توثيق هذه الآية بعينها فقط، بدل الإشارة الأوسع إلى رسالة يسوع.
  rationale: 'تحافظ الترجمة على مضمون جملة الغاية كما هو: الإيمان بأن المخاطَب أرسل يسوع، من غير تضييق أو توسيع.'
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعمل «الجمع» مقابل ὄχλος، و«تسمع لي» للحفاظ على دلالة السماع في سياق الصلاة من غير الإفراط في التفسير.
