    text: 'يمكن أيضًا: «من أجل الجمع الواقف حولي».'
    reason: lexical_alternative
  - marker: b
    text: 'يَرِد ضمير المخاطب صريحًا في اليونانية للتوكيد: «أنك أنت أرسلتني».'
