  text: οὐδὲ ⸀λογίζεσθε ὅτι συμφέρει ⸀ὑμῖν ἵνα εἷς ἄνθρωπος ἀποθάνῃ ὑπὲρ τοῦ λαοῦ καὶ μὴ ὅλον τὸ ἔθνος ἀπόληται.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/050.yaml
  text: Nor do you consider that it is better for you that one man die for the people[a], and not that the whole nation perish.
translation:
  language: ar
  text: ولا تحسبون أنه من الأفضل لكم أن يموت رجل واحد عن الشعب[a] وألّا تهلك الأمة كلها.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لأجل الشعب»؛ وقد تحمل العبارة أيضًا معنى «نيابةً عن الشعب».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ λογίζεσθε
  choice: ولا تحسبون
  rationale: ينقل فعل التفكير والتقدير العملي في سياق مداولة سياسية، مع الحفاظ على قوة النفي العاطفة على الكلام السابق.
- source_word: συμφέρει ὑμῖν
  choice: من الأفضل لكم
  rationale: يعبّر بوضوح عن المنفعة العملية والمصلحة المقصودة في قول قيافا، بصياغة عربية طبيعية.
- source_word: εἷς ἄνθρωπος
  choice: رجلٌ واحدٌ
  rationale: يحفظ الإفراد والصيغة المذكرة في اليونانية ويبرز مقابلة الفرد بالأمة كلها.
- source_word: ἀποθάνῃ
  choice: يموت
  rationale: ينقل الحدث في جملة أن المصدرية بصورة عربية سلسة، من غير إضافة دلالة احتمالية غير لازمة.
- source_word: ὑπὲρ τοῦ λαοῦ
  choice: عن الشعب
  rationale: تعبير عربي موجز يحتمل معنى الموت لأجل الشعب أو نيابةً عنه، ويحافظ على اتساع الدلالة في السياق اليوحناوي.
- source_word: ὅλον τὸ ἔθνος
  choice: الأمة كلها
  rationale: يميّز الكيان القومي كله من «الشعب» ويحفظ شمول ὅλον بترتيب عربي طبيعي.
- source_word: ἀπόληται
  choice: تهلك
  rationale: ينقل معنى الخراب أو الفناء الجسيم من غير تحديد وسيلته، ويلائم الحديث عن مصير الأمة.
theological_decisions:
- issue: دلالة ὑπέρ في موت يسوع
  choice: «عن الشعب» في المتن
  alternative: «لأجل الشعب» أو «نيابةً عن الشعب»
  rationale: قول قيافا في مستواه المباشر يتناول المصلحة السياسية، لكن الراوي يقدمه لاحقًا بوصفه نبوة غير مقصودة. لذلك تحافظ الصياغة العامة على التوتر بين المنفعة والنيابة ولا تحصر العبارة في تفسير لاهوتي واحد.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُخدم «تحسبون» بمعنى تقدّرون أو تدركون، و«الأمة كلها» لتأكيد المقابلة بين موت الواحد وهلاك الجماعة القومية بأسرها.
