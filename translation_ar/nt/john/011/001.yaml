  text: Ἦν δέ τις ἀσθενῶν, Λάζαρος ἀπὸ Βηθανίας ἐκ τῆς κώμης Μαρίας καὶ Μάρθας τῆς ἀδελφῆς αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/001.yaml
  text: A certain man was sick[a], Lazarus from Bethany, from the village of Mary and her sister Martha.
translation:
  language: ar
  text: وكان رجلٌ مريضٌ، اسمه لعازر، من بيت عنيا، من قرية مريم وأختها مرثا.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἦν δέ
  choice: وكان
  rationale: تؤدي الواو وظيفة δέ بوصفها رابطًا سرديًا خفيفًا، ويعبّر «كان» عن الفعل Ἦν بلا إضافة ظرف زمان غير موجود صراحةً في الأصل.
- source_word: τις
  choice: رجلٌ
  rationale: الضمير النكرة يدل على شخص معيّن غير مسمّى في أول العبارة، وهو ذكر بحسب المرجع؛ وتأتي العربية الطبيعية بـ«رجل» من غير حاجة إلى «رجل معيّن».
- source_word: ἀσθενῶν
  choice: مريضًا
  rationale: يدل اسم الفاعل هنا على المرض، لا مجرد الضعف، وجاء خبرًا لـ«كان» في صياغة عربية طبيعية.
- source_word: Λάζαρος
  choice: اسمه لعازر
  rationale: نُقل الاسم بالصيغة العربية الكتابية الشائعة، وأُضيفت «اسمه» لإيضاح البدل في العربية من غير تغيير المعنى.
- source_word: ἀπὸ Βηθανίας
  choice: من بيت عنيا
  rationale: تحفظ «من» دلالة المصدر أو الانتماء المكاني في ἀπό، مع استعمال الصيغة العربية الشائعة لاسم المكان.
- source_word: ἐκ τῆς κώμης
  choice: من قرية
  rationale: κώμη مستوطنة صغيرة، لذا «قرية» أدق من «مدينة»، و«من» تقابل ἐκ طبيعيًا في السياق.
- source_word: Μαρίας καὶ Μάρθας τῆς ἀδελφῆς αὐτῆς
  choice: مريم ومرثا أختها
  rationale: تتعلق الإضافة بـ«قرية»، وتوضح العبارة التابعة أن مرثا أخت مريم؛ وتحفظ الصياغة هذا الارتباط بأقل قدر من التفسير.
theological_decisions: []
