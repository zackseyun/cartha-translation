  register: عربية فصحى حديثة واضحة ووقورة. حُفظ التكرار المكاني «من بيت عنيا، من قرية...» لأنه قائم في النص اليوناني، ولم تُضف حاشية لأن البديل الإنجليزي لا يعكس غموضًا دلاليًا يحتاج إليه القارئ العربي.
