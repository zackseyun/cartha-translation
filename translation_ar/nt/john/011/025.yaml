  yaml_path: translation/nt/john/011/025.yaml
  text: Jesus said to her[a], “I am the resurrection and the life. The one who believes in me, even if he dies, will live,”
translation:
  language: ar
  text: 'قال لها يسوع: «أنا القيامة والحياة. من يؤمن بي[a]، ولو مات، فسيحيا».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'جاء التعبير اليوناني بصيغة المفرد المذكر: «الذي يؤمن… وإن مات»، وهي هنا صيغة تمثيلية تشمل كل من يؤمن.'
    reason: توضيح دلالة صيغة المذكر المفرد العامة في الأصل
lexical_decisions:
- source_word: εἶπεν αὐτῇ ὁ Ἰησοῦς
  choice: قال لها يسوع
  rationale: صياغة سردية عربية مباشرة تحفظ الفعل والضمير المؤنث العائد إلى مرثا، مع ترتيب طبيعي في العربية.
- source_word: Ἐγώ εἰμι
  choice: أنا
  rationale: الجملة الاسمية العربية تؤدي معنى «أنا أكون» من غير حاجة إلى فعل رابط في الزمن الحاضر، ويُبقي الضمير المنفصل نبرة التوكيد.
- source_word: ἡ ἀνάστασις
  choice: القيامة
  rationale: يدل اللفظ هنا على القيامة من الموت، والتعريف محفوظ كما في اليونانية.
- source_word: ἡ ζωή
  choice: الحياة
  rationale: يحفظ التعريف والتوازي مع «القيامة» في قول يسوع عن هويته.
- source_word: ὁ πιστεύων εἰς ἐμέ
  choice: من يؤمن بي
  rationale: «من» صيغة عربية طبيعية عامة تشمل كل شخص، والفعل المضارع يحفظ وصف الشخص بالإيمان، أما «بي» فهي المقابل الاصطلاحي الطبيعي للإيمان الموجَّه إلى شخص.
- source_word: κἂν ἀποθάνῃ
  choice: ولو مات
  rationale: '«لو» المسبوقة بالواو تنقل بوضوح معنى الشرط التنازلي: حتى في حالة موته.'
- source_word: ζήσεται
  choice: فسيحيا
  rationale: يحفظ المستقبل والمعنى الواسع للفعل من غير إضافة «من جديد»، وهي غير مصرح بها في اليونانية.
theological_decisions:
- issue: مدى قول يسوع «Ἐγώ εἰμι ἡ ἀνάστασις καὶ ἡ ζωή»
  choice: أنا القيامة والحياة
  alternative: أنا الذي يمنح القيامة والحياة
  rationale: تُحفظ المطابقة المباشرة بين يسوع والقيامة والحياة، ولا يُختزل القول إلى مجرد وظيفة أو عطية.
- issue: المفرد المذكر التمثيلي في ὁ πιστεύων وما يتبعه من أفعال مفردة
  choice: من يؤمن بي، ولو مات، فسيحيا
  alternative: كل الذين يؤمنون بي، حتى إن ماتوا، فسيحيون
  rationale: تحفظ الصياغة العربية المفرد الموجود في الأصل، بينما تؤدي «من» معنى العموم من غير قصر الوعد على الذكور.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعملت الجملة الاسمية «أنا القيامة والحياة» لأنها المقابل العربي الطبيعي للجملة اليونانية ذات فعل الكينونة، مع الحفاظ على التوكيد والادعاء المباشر. وُضعت علامة الحاشية عند عبارة «من يؤمن بي» لأنها موضع المسألة الصرفية التي تشرحها الحاشية.
