  text: δεδώκεισαν ⸀δὲ οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι ⸀ἐντολὰς ἵνα ἐάν τις γνῷ ποῦ ἐστιν μηνύσῃ, ὅπως πιάσωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/057.yaml
  text: The chief priests and the Pharisees had given orders that if anyone knew where he was[a], he should report it[b], so that they might seize him.
translation:
  language: ar
  text: وكان رؤساء الكهنة والفريسيون قد أصدروا أوامر تقضي بأن يُبلِّغهم كلُّ من يعرف أين هو، لكي يقبضوا عليه.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεδώκεισαν
  choice: كانوا قد أصدروا
  rationale: صيغة الماضي الأسبق تدل على أن إصدار الأوامر سبق اللحظة السردية؛ وتركيب «كانوا قد» ينقل ذلك بوضوح في العربية.
- source_word: δὲ
  choice: وَ
  rationale: تؤدي هنا وظيفة الانتقال السردي لا الاستدراك القوي، والواو هي الرابط العربي الطبيعي في هذا السياق.
- source_word: ἀρχιερεῖς
  choice: رؤساء الكهنة
  rationale: المقصود كبار السلطات الكهنوتية، لا عدة أشخاص يشغلون منصب رئيس الكهنة في الوقت نفسه.
- source_word: Φαρισαῖοι
  choice: الفريسيون
  rationale: الصيغة العربية المعيارية لاسم هذه الجماعة اليهودية.
- source_word: ἐντολὰς
  choice: أوامر
  rationale: يناسب السياق الإداري والسلطوي، ويحافظ على قوة التوجيهات الملزمة.
- source_word: ἵνα ἐάν τις γνῷ
  choice: تقضي بأن ... كلُّ من يعرف
  rationale: صياغة عربية طبيعية تنقل مضمون الأوامر مع الشرط العام المتعلق بأي شخص تتوافر لديه المعلومة.
- source_word: ποῦ ἐστιν
  choice: أين هو
  rationale: يحافظ على زمن المضارع في اليونانية، وهو طبيعي في العربية داخل السؤال غير المباشر ولا يحتاج إلى إرجاع زمني.
- source_word: μηνύσῃ
  choice: يُبلِّغهم
  rationale: الفعل يدل على نقل المعلومة إلى أصحاب السلطة؛ وذِكر ضمير المتلقين لازم للوضوح العربي ومفهوم من السياق.
- source_word: ὅπως
  choice: لكي
  rationale: ينقل بوضوح معنى الغاية.
- source_word: πιάσωσιν
  choice: يقبضوا عليه
  rationale: يناسب سياق تعقّب شخص بغرض احتجازه، مع الحفاظ على معنى الإمساك به دون تفصيل قانوني زائد.
theological_decisions: []
