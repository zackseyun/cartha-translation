source:
  edition: SBLGNT
  text: Πολλοὶ οὖν ἐκ τῶν Ἰουδαίων, οἱ ἐλθόντες πρὸς τὴν ⸀Μαριὰμ καὶ θεασάμενοι ⸀ἃ ⸀ἐποίησεν, ἐπίστευσαν εἰς αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/011/045.yaml
  text: Therefore many of the Jews who had come to Mary and had seen what he had done believed in him[a].
translation:
  language: ar
  text: فآمن به كثيرون من اليهود الذين جاؤوا إلى مريم ورأوا ما فعله.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كثيرون من بين اليهود». ويرى بعضهم أن اللفظ اليوناني المترجم «اليهود» يمكن أن يعني «أهل اليهودية» في بعض سياقات إنجيل يوحنا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλοὶ οὖν
  choice: فـ... كثيرون
  rationale: تفيد «فـ» النتيجة المترتبة على الحدث السابق، وتحافظ «كثيرون» على الدلالة الكمية غير المحددة.
- source_word: ἐκ τῶν Ἰουδαίων
  choice: من اليهود
  rationale: تنقل «من» المعنى التبعيضي في اليونانية بعبارة عربية طبيعية، أي كثيرون من بين اليهود.
- source_word: οἱ ἐλθόντες πρὸς τὴν Μαριὰμ
  choice: الذين جاؤوا إلى مريم
  rationale: صياغة موصولية واضحة تحافظ على وظيفة اسم الفاعل اليوناني في تحديد الجماعة المقصودة.
- source_word: θεασάμενοι ἃ ἐποίησεν
  choice: ورأوا ما فعله
  rationale: تنقل الرؤية المباشرة للفعل بصياغة عربية طبيعية من غير زيادة تفسيرية.
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: آمن به
  rationale: المقابل العربي المألوف والطبيعي لتركيب πιστεύω εἰς، ويحافظ على اتجاه الإيمان نحو شخص يسوع.
theological_decisions:
- issue: دلالة ἐπίστευσαν εἰς αὐτόν في سياق يوحنا
  choice: آمن به
  alternative: وضعوا ثقتهم فيه
  rationale: «آمن به» يحافظ على اصطلاح الإيمان اليوحناوي دون توسيعه تفسيريًا إلى صيغة قد تشدد على جانب واحد من معناه.
- issue: هوية Ἰουδαῖοι
  choice: اليهود
  alternative: اليهوديّين/أهل اليهودية
  rationale: «اليهود» هي الدلالة الطبيعية هنا، مع إبقاء البديل الجغرافي المحتمل في الحاشية لأن اللفظ قد يُناقش بهذا المعنى في بعض سياقات يوحنا.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة. قُدِّم الفعل «آمن» لانسجام السرد العربي وإبراز نتيجة ما شاهدوه، من غير تغيير العلاقات النحوية أو المعنى.
