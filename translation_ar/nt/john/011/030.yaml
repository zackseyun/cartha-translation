base_translation:
  language: en
  yaml_path: translation/nt/john/011/030.yaml
  text: Jesus had not yet come into the village[a], but was still in the place where Martha had met him.
translation:
  language: ar
  text: ولم يكن يسوع قد وصل إلى القرية بعد، بل كان لا يزال في المكان الذي لاقته[a] فيه مرثا.
  philosophy: optimal-equivalence
  footnotes:
