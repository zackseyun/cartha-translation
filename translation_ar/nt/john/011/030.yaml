lexical_decisions:
- source_word: οὔπω
  choice: لم يكن ... بعد
  rationale: ينقل بوضوح أن الوصول لم يحدث حتى تلك اللحظة، وهو التعبير العربي الطبيعي عن النفي مع «بعد».
- source_word: δὲ
  choice: و
  rationale: أداة انتقال سردي خفيف هنا، فَنُقلت بواو الاستئناف من غير إقحام ظرف زمني غير موجود في الأصل.
- source_word: ἐληλύθει ... εἰς τὴν κώμην
  choice: قد وصل إلى القرية
  rationale: صيغة الماضي التام تفيد أن الوصول لم يكن قد وقع بالنسبة إلى زمن السرد، و«وصل إلى» تعبير عربي طبيعي لا يزيد معنى الدخول الفعلي.
- source_word: κώμην
  choice: القرية
  rationale: تدل الكلمة عادة على تجمّع سكني صغير، و«القرية» مقابل عربي واضح ومباشر.
- source_word: ἀλλ’
  choice: بل
  rationale: تُظهر المقابلة بين عدم وصوله إلى القرية واستمرار وجوده في الموضع السابق.
- source_word: ἔτι
  choice: لا يزال
  rationale: يفيد استمرار وجود يسوع في المكان نفسه.
- source_word: τόπῳ
  choice: المكان
  rationale: مقابل عام وطبيعي للكلمة الدالة على الموضع.
- source_word: ὅπου
  choice: الذي ... فيه
  rationale: صياغة عربية طبيعية للجملة الموصولة الدالة على المكان.
- source_word: ὑπήντησεν αὐτῷ
  choice: لاقته
  rationale: تنقل معنى اللقاء بإيجاز، مع إبقاء دلالة الخروج للقائه بوصفها احتمالًا أوضح في الحاشية.
- source_word: Μάρθα
  choice: مرثا
  rationale: الصيغة العربية المألوفة للاسم.
