base_translation:
  language: en
  yaml_path: translation/nt/john/011/048.yaml
  text: If we let him go on like this[a], everyone will believe in him[b], and the Romans will come and take away both our place and our nation.
translation:
  language: ar
  text: «إن تركناه يستمر هكذا، فسيؤمن به الجميع، وسيأتي الرومان ويأخذون منا مكاننا[a] وأمتنا[b].»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «هيكلنا»؛ واليونانية تقول حرفيًا «مكاننا»، وقد تشير خصوصًا إلى الهيكل أو، على نحو أوسع، إلى موضعهم أو مكانتهم.
    reason: alternative_reading
  - marker: b
    text: أو «شعبنا».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφῶμεν αὐτὸν οὕτως
  choice: تركناه يستمر هكذا
  rationale: يفيد الفعل هنا السماح أو الترك، وتُبرز «يستمر هكذا» الحالة المتواصلة التي يشير إليها السياق من غير زيادة تفسيرية.
- source_word: πάντες
  choice: الجميع
  rationale: ينقل الشمول العام بصياغة عربية طبيعية.
- source_word: πιστεύσουσιν εἰς αὐτόν
  choice: سيؤمن به
  rationale: 'ترجمة مباشرة للبناء اليوحناوي πιστεύω εἰς، وتحافظ على دلالته المعتادة: الإيمان به.'
- source_word: ἐλεύσονται οἱ Ῥωμαῖοι
  choice: سيأتي الرومان
  rationale: ينقل الفعل المستقبلي والفاعل الصريح بوضوح وبلا توسع.
- source_word: ἀροῦσιν ἡμῶν
  choice: ينتزعون منا
  rationale: يحافظ على المعنى الأساسي للفعل، أي الأخذ أو الإزالة، من دون تشديده إلى «يدمرون»؛ و«منا» تعبّر عن علاقة ἡμῶν بالمفعولين.
- source_word: τόπον
  choice: مكاننا
  rationale: يحافظ على اللفظ العام في اليونانية وعلى احتماله أن يشير إلى الهيكل أو إلى موضعهم ومكانتهم، بدل حسمه في المتن.
- source_word: ἔθνος
  choice: أمتنا
  rationale: تلائم الخوف السياسي القومي في السياق، مع إبقاء احتمال معنى «شعبنا» في الحاشية.
- source_word: καὶ τὸν τόπον καὶ τὸ ἔθνος
  choice: مكاننا وأمتنا
  rationale: تربط المفعولين بالفعل نفسه وتوضح أن ضمير الملكية يعود إليهما كليهما، من غير إثقال العبارة العربية.
theological_decisions:
- issue: مدلول «مكاننا» (τόπον)
  choice: الإبقاء على «مكاننا» في المتن
  alternative: «هيكلنا» أو «مكانتنا»
  rationale: قد يكون خوف المتكلمين متعلقًا بالهيكل، أو بموضعهم ومكانتهم، أو بكليهما؛ لكن اللفظ اليوناني أوسع، لذلك تُحفظ دلالته المفتوحة في المتن.
- issue: مدلول ἔθνος
  choice: «أمتنا»
  alternative: «شعبنا»
  rationale: «أمتنا» مناسبة للبعد السياسي في تهديد الرومان، بينما يظل معنى الجماعة اليهودية بوصفها شعبًا احتمالًا معجميًا حقيقيًا مذكورًا في الحاشية.
translation_notes:
  register: العربية فصحى معاصرة واضحة ورصينة. استُعملت «تركناه يستمر هكذا» لتوضيح معنى السماح باستمرار الحال، وحُفظ الغموض المقصود في «مكاننا» مع بيان احتمالاته في الحاشية.
