source:
  edition: SBLGNT
  text: ἔλεγον οὖν αὐτῷ οἱ ἄλλοι μαθηταί· Ἑωράκαμεν τὸν κύριον. ὁ δὲ εἶπεν αὐτοῖς· Ἐὰν μὴ ἴδω ἐν ταῖς χερσὶν αὐτοῦ τὸν τύπον τῶν ἥλων καὶ βάλω τὸν δάκτυλόν μου εἰς τὸν τύπον τῶν ἥλων καὶ βάλω ⸂μου τὴν χεῖρα⸃ εἰς τὴν πλευρὰν αὐτοῦ, οὐ μὴ πιστεύσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/025.yaml
  text: So the other disciples were telling him[a], “We have seen the Lord.” But he said to them, “Unless I see in his hands the mark of the nails, and put my finger into the mark of the nails, and put my hand into his side, I will certainly not believe.”
translation:
  language: ar
  text: 'فكان التلاميذ الآخرون يقولون له: «لقد رأينا الرب». فقال لهم: «إن لم أرَ في يديه أثر المسامير، وأضع إصبعي في أثر المسامير، وأضع يدي في جنبه، فلن أؤمن قطعًا[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فلن أؤمن أبدًا». تستعمل اليونانية نفيًا شديد التوكيد.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: كانوا يقولون
  rationale: صيغة الماضي الناقص تدل على قول مستمر أو متكرر، وتركيب «كانوا يقولون» ينقل هذا الجانب بوضوح.
- source_word: οὖν
  choice: فـ
  rationale: الفاء تربط الآية بسياق السرد السابق ربطًا طبيعيًا، وتنقل معنى الاستمرار أو النتيجة السياقية دون إثقال.
- source_word: Ἑωράκαμεν
  choice: لقد رأينا
  rationale: الفعل في صيغة التام يشير إلى حدث تمّ وله أثر حاضر، و«لقد رأينا» تحافظ على هذا التوكيد والارتباط بالحاضر.
- source_word: κύριον
  choice: الرب
  rationale: ينقل اللقب المسيحاني في السياق، حيث يشير إلى يسوع القائم، ولا يختزله في معنى «المعلّم».
- source_word: τύπον
  choice: أثر
  rationale: يدل هنا على العلامة أو الانطباع الذي خلّفته المسامير؛ و«أثر» لفظ عربي واضح وطبيعي ويحافظ على الملموسية.
- source_word: βάλω ... εἰς
  choice: أضع ... في
  rationale: «أضع» هو المقابل الطبيعي في هذا السياق الجسدي، و«في» تنقل اتجاه الحركة الذي تفيده εἰς من غير تعبير عربي متكلف.
- source_word: πλευράν
  choice: جنبه
  rationale: «الجنب» هو التعبير العربي الكتابي والطبيعي عن جانب الجسد في هذا السياق، ويحافظ على الإحالة إلى جرح الطعنة.
- source_word: οὐ μὴ πιστεύσω
  choice: فلن أؤمن أبدًا
  rationale: اجتماع οὐ μή مع صيغة الفعل يفيد نفيًا شديد التوكيد؛ و«لن ... أبدًا» ينقل قوة الرفض بوضوح، مع بقاء الكلام داخل الشرط المذكور.
theological_decisions:
- issue: قوة رفض توما في οὐ μὴ πιστεύσω
  choice: فلن أؤمن أبدًا
  alternative: فلن أؤمن قطعًا
  rationale: النفي اليوناني مؤكد جدًا. يحافظ النص على حدة رفض توما من غير أن يفسر دوافعه أو يحسم ما إذا كان «أبدًا» مطلقًا خارج إطار الشرط؛ لذلك توضح الحاشية أن المعنى محكوم بالشرط السابق.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُخدم «كانوا يقولون» لإبراز الاستمرار، و«أثر المسامير» بدل ألفاظ أقل تداولًا مثل «طبعة المسامير». وُضع مؤشر الحاشية بعد الجملة التي يشرحها.
