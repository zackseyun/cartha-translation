  source_fidelity: 'المسودة تنقل تسلسل الحدث والوصول إلى القبر نقلًا صحيحًا، وتحفظ الاستمرار في «كان الاثنان يركضان». لكن «فأسرع التلميذ الآخر وسبق بطرس» قد تُفهم على أن التلميذ زاد سرعته، بدل المقارنة الصريحة: كان أسرع من بطرس. والصياغة المقترحة تجعل هذه المقارنة ظاهرة وتحافظ على معنى التقدّم في الركض.'
