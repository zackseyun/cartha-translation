    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτρεχον
  choice: كانا يركضان
  rationale: صيغة الماضي الناقص تدل على فعل مستمر في الماضي، والتركيب العربي «كانا يركضان» يحفظ هذا المعنى.
- source_word: δὲ
  choice: فـ
  rationale: أداة ربط خفيفة تنقل السرد إلى ما حدث أثناء ركضهما، من غير إقحام تضاد قوي.
- source_word: οἱ δύο
  choice: الاثنان
  rationale: ينقل التعبير الاسمي الصريح في اليونانية بوضوح.
- source_word: ὁμοῦ
  choice: معًا
  rationale: تدل على اشتراكهما في الركض، وهي المقابل العربي الطبيعي الموجز.
- source_word: ὁ ἄλλος μαθητής
  choice: التلميذ الآخر
  rationale: «التلميذ» هو المقابل المألوف لـ μαθητής في سياق الأناجيل، و«الآخر» يميزه من بطرس.
- source_word: προέδραμεν
  choice: سبق
  rationale: الفعل يعني الركض إلى الأمام أو التقدم في الركض؛ و«سبق» طبيعي في العربية ويحفظ النتيجة المكانية للمسابقة.
- source_word: τάχιον τοῦ Πέτρου
  choice: أسرع ... بطرس
  rationale: 'يحفظ المقارنة الصريحة في اليونانية ضمن صياغة عربية طبيعية: «أسرع ... وسبق بطرس».'
- source_word: ἦλθεν πρῶτος
  choice: وصل ... أولًا
  rationale: «وصل أولًا» أوضح في سياق بلوغ مكان المقصد، مع حفظ معنى الأولوية.
- source_word: εἰς τὸ μνημεῖον
  choice: إلى القبر
  rationale: المقصود موضع دفن يسوع. وتدل الآية التالية على أنه بلغ القبر ولم يكن قد دخله، لذلك «إلى» أدق من «داخل».
