  text: καὶ τὸ σουδάριον, ὃ ἦν ἐπὶ τῆς κεφαλῆς αὐτοῦ, οὐ μετὰ τῶν ὀθονίων κείμενον ἀλλὰ χωρὶς ἐντετυλιγμένον εἰς ἕνα τόπον·
base_translation:
  language: en
  yaml_path: translation/nt/john/020/007.yaml
  text: and the face cloth[a], which had been on his head, was not lying with the linen cloths but folded up separately in one place.
translation:
  language: ar
  text: والمنديل الذي كان على رأسه، لم يكن موضوعًا مع أكفان الكتان، بل كان ملفوفًا[a] على حدة في موضع واحد.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مطويًا» أو «ملفوفًا على هيئة لفافة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: σουδάριον
  choice: المنديل
  rationale: يدل في سياق الدفن على قطعة القماش التي كانت على رأس يسوع؛ ولفظ «المنديل» عربي واضح وطبيعي، وتوضح الجملة التابعة موضع استعماله دون زيادة تفسيرية.
- source_word: ἐπὶ τῆς κεφαλῆς αὐτοῦ
  choice: على رأسه
  rationale: ترجمة مباشرة تحفظ دلالة حرف الجر ولا تحدد هل كان القماش حول الرأس أو فوقه.
- source_word: ὀθονίων
  choice: أكفان الكتان
  rationale: يحفظ معنى قطع الكتان المستعملة في الدفن، مع بيان السياق الجنائزي بعبارة عربية مألوفة.
- source_word: κείμενον
  choice: موضوعًا
  rationale: ينقل حالة وجود المنديل في موضعه، وهو أنسب مع اسم المفعول «ملفوفًا» في تركيب عربي سلس.
- source_word: χωρὶς
  choice: على حدة
  rationale: يبين الانفصال المكاني عن أكفان الكتان ويحفظ المقابلة التي أدخلتها ἀλλά.
- source_word: ἐντετυλιγμένον
  choice: ملفوفًا
  rationale: ينقل حالة ناتجة مستمرة يدل عليها اسم المفعول التام، من غير الجزم بأنه كان مطويًا طيًا منتظمًا؛ وتُذكر البدائل الممكنة في الحاشية.
- source_word: εἰς ἕνα τόπον
  choice: في موضع واحد
  rationale: ترجمة قريبة وطبيعية تشير إلى مكان متميز دون تحويل العبارة إلى «موضعه الخاص» على نحو تفسيري.
- source_word: καὶ
  choice: و
  rationale: أداة عطف تواصل وصف ما رآه التلميذ في الآية السابقة.
theological_decisions:
- issue: هل يدل ترتيب أكفان الدفن على معنى لاهوتي يتجاوز الوصف السردي؟
  choice: تُترجم الآية بوصفها ملاحظة عن انفصال المنديل وحالته ومكانه، دون إضافة دلالة رمزية أو حجة دفاعية.
  alternative: اعتبار لفّ المنديل أو طيه رمزًا للقصد والنظام، أو برهانًا حاسمًا على إعادة بناء معينة لحدث القيامة.
  rationale: يصف النص اليوناني موضع المنديل وحالته، لكنه لا يصرح بمعنى رمزي؛ لذلك تبقى الترجمة وصفية وتحفظ المجال للاستدلال دون إدخاله في النص.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. استُعمل «المنديل» مع العبارة المفسرة «الذي كان على رأسه»، و«على حدة» لإبراز الانفصال المكاني. وُضع مؤشر الحاشية [a] مباشرة بعد اللفظ الذي تتعلق به البدائل.
