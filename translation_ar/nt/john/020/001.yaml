base_translation:
  language: en
  yaml_path: translation/nt/john/020/001.yaml
  text: On the first day of the week[a], Mary Magdalene comes to the tomb early, while it was still dark, and sees the stone having been taken away from the tomb.
translation:
  language: ar
  text: وفي اليوم الأول من الأسبوع[a]، تأتي مريم المجدلية إلى القبر باكرًا، والظلام لا يزال قائمًا، وترى الحجر قد أُزيل عن القبر.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «في واحدة من السبوت»، وهو تعبير اصطلاحي يعني «في اليوم الأول من الأسبوع».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ δὲ μιᾷ τῶν σαββάτων
  choice: وفي اليوم الأول من الأسبوع
  rationale: ينقل التعبير الاصطلاحي اليوناني بمعناه الزمني الطبيعي في العربية، مع تمثيل δέ بواو استئنافية خفيفة دون إدخال معنى «الآن» غير الموجود صراحةً.
- source_word: Μαρία ἡ Μαγδαληνὴ
  choice: مريم المجدلية
  rationale: الصيغة العربية المألوفة للاسم والنسبة إلى مجدل، وهي واضحة وطبيعية في العربية الكتابية المعاصرة.
- source_word: ἔρχεται
  choice: تأتي
  rationale: يحافظ المضارع على المضارع التاريخي في السرد وعلى حيوية المشهد، وهو مستساغ في العربية.
- source_word: πρωῒ
  choice: باكرًا
  rationale: يدل على وقت مبكر، ويترك للعبارة التالية بيان أن الظلام كان لا يزال باقيًا، دون تفسيره بأنه الفجر صراحةً.
- source_word: σκοτίας ἔτι οὔσης
  choice: إذ كان الظلام لا يزال باقيًا
  rationale: صياغة زمنية طبيعية تنقل استمرار الظلام بوصفه الظرف المصاحب للمجيء.
- source_word: εἰς τὸ μνημεῖον
  choice: إلى القبر
  rationale: يشير μνημεῖον هنا إلى موضع الدفن؛ و«القبر» هو المقابل العربي الواضح والمألوف.
- source_word: βλέπει
  choice: فترى
  rationale: يحافظ على المضارع التاريخي، وتربط الفاء الرؤية بما سبق ربطًا سرديًا طبيعيًا.
- source_word: τὸν λίθον ἠρμένον
  choice: أن الحجر قد أُزيل
  rationale: ينقل اسم المفعول التام المبني للمجهول فعلًا مكتملًا وحالة ناتجة قائمة عند وصول مريم، من غير تعيين الفاعل.
- source_word: ἐκ τοῦ μνημείου
  choice: عن القبر
  rationale: تفيد «عن» إبعاد الحجر من موضعه عند القبر دون إضافة «المدخل»، وهي غير مذكورة صراحةً في النص.
theological_decisions:
- issue: زمن السرد في خبر القيامة
  choice: الإبقاء على المضارع التاريخي في «تأتي» و«ترى»
  alternative: 'تحويل الفعلين إلى الماضي: «أتت» و«رأت»'
  rationale: المضارع التاريخي سمة ظاهرة في النص اليوناني، ويمكن حفظه طبيعيًا في العربية بما يصون حيوية السرد من غير إضافة تفسير لاهوتي.
- issue: الفاعل في إزالة الحجر
  choice: 'استخدام المبني للمجهول: «قد أُزيل»'
  alternative: تعيين فاعل الإزالة أو استعمال صيغة قد توحي به
  rationale: النص يصف الحجر في حالة ناتجة عن فعل سابق ولا يصرح هنا بمن أزاله؛ لذلك تُحفظ هذه المساحة دون حسم.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة، مع الحفاظ على المضارع التاريخي، وتجنب الألفاظ القديمة غير الضرورية أو الإضافات التفسيرية.
