  text: λέγει αὐτῷ ὁ Ἰησοῦς· Ὅτι ἑώρακάς με πεπίστευκας; μακάριοι οἱ μὴ ἰδόντες καὶ πιστεύσαντες.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/029.yaml
  text: Jesus said to him, “Because you have seen me, you have believed? Blessed are those who have not seen and yet have believed.”
translation:
  language: ar
  text: 'قال له يسوع: «ألأنك رأيتني آمنت؟[a] طوبى للذين لم يروا وآمنوا».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لأنك رأيتني آمنت». يمكن فهم العبارة اليونانية على أنها سؤال أو تقرير.'
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: قال له يسوع
  rationale: المضارع التاريخي اليوناني يُنقل بالماضي العربي على نحو طبيعي في السرد، مع إبقاء الضمير العائد إلى توما.
- source_word: Ὅτι
  choice: لأنك
  rationale: تُفهم هنا سببية، فتربط رؤية توما بإيمانه، مع صوغ العبارة استفهامًا بحسب الترقيم المرجح.
- source_word: ἑώρακάς με
  choice: رأيتني
  rationale: الماضي العربي هو التعبير الطبيعي عن فعل الرؤية المكتمل ذي الصلة بالحاضر في هذا السياق، من غير إثقال الصياغة بمحاكاة صرفية حرفية.
- source_word: πεπίστευκας
  choice: آمنت
  rationale: ينقل تحقق الإيمان الناتج عن الرؤية بعبارة عربية موجزة وطبيعية.
- source_word: μακάριοι
  choice: طوبى
  rationale: صيغة عربية راسخة ومهيبة في أقوال التطويب، وتدل على الغبطة والبركة لا على مجرد الشعور بالسعادة.
- source_word: οἱ μὴ ἰδόντες καὶ πιστεύσαντες
  choice: الذين لم يروا وآمنوا
  rationale: يحافظ على النفي والعطف الصريحين في اليونانية من غير إضافة «ومع ذلك»، مع صياغة عربية واضحة.
theological_decisions:
- issue: القوة البلاغية للجملة الأولى
  choice: 'صيغت استفهامًا: «ألأنك رأيتني آمنت؟»'
  alternative: 'يمكن صوغها خبرًا: «لأنك رأيتني آمنت».'
  rationale: النص اليوناني القديم لا يحسم بعلامات الترقيم هل العبارة سؤال أم تقرير. الاستفهام مناسب للسياق وللترقيم النقدي الشائع، بينما حُفظ الاحتمال الخبري في الحاشية تجنبًا لحسم الغموض.
- issue: العلاقة بين عدم الرؤية والإيمان
  choice: «لم يروا وآمنوا»
  alternative: «لم يروا ومع ذلك آمنوا»
  rationale: العطف البسيط يطابق καί ويحفظ المقابلة التي يفهمها السياق دون إضافة أداة استدراك غير مصرّح بها.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدمت «طوبى» لملاءمتها لأسلوب التطويب، وأُثبتت الحاشية بعد الجملة المختلف في تنغيمها.
