  text: ⸀ταῦτα εἰποῦσα ἐστράφη εἰς τὰ ὀπίσω, καὶ θεωρεῖ τὸν Ἰησοῦν ἑστῶτα, καὶ οὐκ ᾔδει ὅτι Ἰησοῦς ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/014.yaml
  text: After saying these things[a], she turned around and saw Jesus standing there, and she did not know that it was Jesus.
translation:
  language: ar
  text: وبعد أن قالت هذا، التفتت إلى الوراء، فرأت يسوع واقفًا، ولم تكن تعلم أنه يسوع.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لم تتعرّف على يسوع». واليونانية حرفيًا: «لم تكن تعلم أنه يسوع»، وهي تعبّر عن عدم معرفتها بهويته.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα εἰποῦσα
  choice: وبعدما قالت هذا
  rationale: يؤدي اسم الإشارة المحايد الجمع بحسب الاستعمال العربي الطبيعي بالإفراد «هذا»، ويعبّر «بعدما قالت» عن سبق فعل اسم الفاعل الأوريستي للفعل الرئيس.
- source_word: ἐστράφη εἰς τὰ ὀπίσω
  choice: التفتت إلى الوراء
  rationale: تعبير عربي طبيعي ودقيق لحركة الالتفات نحو ما وراءها.
- source_word: θεωρεῖ
  choice: فرأت
  rationale: ينقل الحاضر التاريخي بصيغة الماضي الملائمة للسرد العربي، مع دلالة المعاينة البصرية في السياق.
- source_word: ἑστῶτα
  choice: واقفًا
  rationale: يحفظ هيئة يسوع القائمة التي يدل عليها اسم الفاعل التام، من غير إضافة مكانية غير مصرّح بها في اليونانية.
- source_word: οὐκ ᾔδει
  choice: لم تكن تعلم
  rationale: يحافظ على المعنى الأساسي لفعل المعرفة، بدل إدخال معنى التعرّف التفسيري في المتن.
- source_word: ὅτι Ἰησοῦς ἐστιν
  choice: أنه يسوع
  rationale: صياغة تعريفية عربية واضحة تحافظ على مضمون عدم معرفتها بهوية الشخص.
theological_decisions:
- issue: تحديد هوية يسوع القائم من الموت في السرد
  choice: لم تكن تعلم أنه يسوع
  alternative: لم تتعرّف إلى أنه يسوع
  rationale: النص يثبت جهل مريم بهوية الشخص من غير أن يبيّن سبب ذلك؛ لذلك تُحفظ دلالة المعرفة في المتن ويُذكر احتمال التعرّف في الحاشية دون حسم التوتر السردي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «التفتت إلى الوراء» بدل تعبير حرفي متكلّف، وحُفظت صيغة المعرفة في الجملة الأخيرة مع توضيح البديل السياقي في الحاشية.
