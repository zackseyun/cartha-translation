  text: And stooping to look in[a], he sees the linen cloths lying there, yet he did not enter.
translation:
  language: ar
  text: وانحنى لينظر إلى الداخل، فرأى لفائف الكتان موضوعةً، لكنه لم يدخل.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρακύψας
  choice: وانحنى لينظر إلى الداخل
  rationale: اسم فاعل ماضٍ يصف حركة التلميذ عند مدخل القبر؛ تجمع الصياغة بين انحنائه وتطلعه إلى داخله من غير أن توحي بأنه دخل.
- source_word: βλέπει
  choice: فرأى
  rationale: المضارع التاريخي في اليونانية يضفي حيوية على السرد، لكن الماضي هو الأسلوب الطبيعي الواضح في السرد العربي، ولا يغيّر ترتيب الحدث أو معناه.
- source_word: κείμενα
  choice: موضوعةً
  rationale: تفيد الكلمة وجود اللفائف في وضع مستقر أو ملقاة في مكانها، و«موضوعة» تنقل الحالة المرئية من غير الإيحاء بأن فاعلًا مذكورًا وضعها في تلك اللحظة.
- source_word: τὰ ὀθόνια
  choice: لفائف الكتان
  rationale: تشير إلى قطع أو لفائف كتانية مرتبطة بالدفن؛ و«لفائف الكتان» واضحة في العربية وتحافظ على مادة الأقمشة ووظيفتها السياقية.
- source_word: οὐ μέντοι
  choice: لكنه لم
  rationale: تنقل أداة الاستدراك التباين الهادئ بين رؤيته ما في القبر وعدم دخوله.
- source_word: εἰσῆλθεν
  choice: يدخل
  rationale: المقابل العربي المباشر والطبيعي لفعل الدخول، وهو ملائم للسجل الفصيح وللسياق المكاني.
theological_decisions: []
