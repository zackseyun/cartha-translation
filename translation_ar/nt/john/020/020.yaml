source:
  edition: SBLGNT
  text: καὶ τοῦτο εἰπὼν ⸀ἔδειξεν τὰς χεῖρας καὶ τὴν πλευρὰν ⸀αὐτοῖς. ἐχάρησαν οὖν οἱ μαθηταὶ ἰδόντες τὸν κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/020.yaml
  text: And after saying this, he showed them his hands and his side. Then the disciples rejoiced when they saw the Lord.
translation:
  language: ar
  text: وبعدما قال هذا، أراهم يديه وجنبه. ففرح التلاميذ حين رأوا الرب.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο εἰπὼν
  choice: وبعدما قال هذا
  rationale: اسم الفاعل الأوريستي يدل هنا على فعل سبق الفعل الرئيس؛ وهذه الصياغة العربية الطبيعية تحفظ التعاقب الزمني.
- source_word: ἔδειξεν ... αὐτοῖς
  choice: أراهم
  rationale: الفعل مع ضمير المفعول غير المباشر يفيد أنه جعلهم يرون، و«أراهم» موجزة وطبيعية في العربية.
- source_word: τὰς χεῖρας
  choice: يديه
  rationale: مع أن اليونانية تستعمل أداة التعريف، تقتضي العربية في هذا السياق إضافة اليدين إلى يسوع، مع الحفاظ على صيغة المثنى.
- source_word: τὴν πλευράν
  choice: جنبه
  rationale: «الجنب» المقابل العربي المباشر والطبيعي لـπλευρά، والإضافة إلى الضمير مفهومة من السياق.
- source_word: ἐχάρησαν
  choice: فرح
  rationale: «فرح» يؤدي معنى الابتهاج بوضوح وقوة طبيعية من غير مبالغة تفسيرية.
- source_word: οὖν
  choice: فـ
  rationale: الفاء تبين أن فرح التلاميذ جاء نتيجة لما أراهم إياه، وتحافظ على انسياب السرد.
- source_word: οἱ μαθηταί
  choice: التلاميذ
  rationale: هو المقابل العربي الراسخ والدقيق للفظ μαθηταί في سياق الأناجيل.
- source_word: ἰδόντες
  choice: حين رأوا
  rationale: تحويل اسم الفاعل الأوريستي إلى جملة زمنية يوضح أن رؤيتهم للرب كانت مناسبة فرحهم وسببه المباشر.
- source_word: τὸν κύριον
  choice: الرب
  rationale: يحفظ اللقب الكريستولوجي ووزنه في سياق ظهور يسوع بعد القيامة، بدل اختزاله إلى معنى «المعلم» أو «السيد» فحسب.
theological_decisions:
- issue: دلالة κύριος
  choice: الرب
  alternative: السيد
  rationale: في سياق الظهور بعد القيامة، يحمل اللفظ دلالة لقبية وكريستولوجية، و«الرب» يحفظ هذا الثقل مع بقاء العبارة طبيعية في العربية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة؛ الصياغة موجزة وتحتفظ بالتعاقب الزمني وعلاقة النتيجة في الأصل اليوناني.
