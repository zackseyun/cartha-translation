  text: Θωμᾶς δὲ εἷς ἐκ τῶν δώδεκα, ὁ λεγόμενος Δίδυμος, οὐκ ἦν μετ’ αὐτῶν ὅτε ⸀ἦλθεν Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/024.yaml
  text: Thomas[a], one of the Twelve, the one called Didymus, was not with them when Jesus came.
translation:
  language: ar
  text: أمّا توما، أحد الاثني عشر، الذي يُدعى ديديموس[a]، فلم يكن معهم حين جاء يسوع.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «ديديموس» كلمة يونانية تعني «التوأم».
    reason: بيان معنى اللقب اليوناني المنقول صوتيًا.
lexical_decisions:
- source_word: δὲ
  choice: أمّا ... فـ
  rationale: تدل الأداة هنا على انتقال سردي لطيف مع إبراز توما في مقابل الجماعة الحاضرة، لا على تعارض شديد. وتؤدي صيغة «أمّا ... فـ» هذا الدور طبيعيًا في العربية من غير إضافة معنى زمني.
- source_word: εἷς ἐκ τῶν δώδεκα
  choice: أحد الاثني عشر
  rationale: تعبير عربي مباشر يحفظ كون «الاثني عشر» تسمية معروفة لجماعة الرسل، من غير إضافة كلمة «تلميذ» غير المذكورة صراحة في النص.
- source_word: ὁ λεγόμενος Δίδυμος
  choice: الذي كان يُدعى ديديموس[a]
  rationale: حُفظ اللقب اليوناني منقولًا صوتيًا بوصفه الاسم الذي كان توما يُعرف به، مع بيان معناه في الحاشية حتى لا يضيع مدلوله المعجمي.
- source_word: οὐκ ἦν μετ’ αὐτῶν
  choice: لم يكن معهم
  rationale: نقل مباشر وطبيعي لحالة غياب توما عن الجماعة في ذلك الوقت.
- source_word: ὅτε ἦλθεν Ἰησοῦς
  choice: حين جاء يسوع
  rationale: يحفظ الفعل العام «جاء» من غير تخصيص زائد مثل «وصل»، ويعبّر بوضوح عن توقيت غياب توما.
theological_decisions:
- issue: نقل Δίδυμος
  choice: ديديموس مع شرح معناه في حاشية
  alternative: التوأم
  rationale: اللفظ لقب يوناني ذو معنى معروف. إبقاء صورته الاسمية في المتن ينسجم مع عبارة «كان يُدعى»، وشرح معناه في الحاشية يحفظ دلالته للقارئ من غير ترجيح عقائدي أو تفسير زائد.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعملت «أمّا ... فـ» لنقل التحول السردي الذي تؤديه δὲ، وتُركت «الاثني عشر» كتسمية معروفة من غير توسع تفسيري.
