source:
  edition: SBLGNT
  text: Οὔσης οὖν ὀψίας τῇ ἡμέρᾳ ἐκείνῃ τῇ ⸀μιᾷ σαββάτων, καὶ τῶν θυρῶν κεκλεισμένων ὅπου ἦσαν οἱ ⸀μαθηταὶ διὰ τὸν φόβον τῶν Ἰουδαίων, ἦλθεν ὁ Ἰησοῦς καὶ ἔστη εἰς τὸ μέσον, καὶ λέγει αὐτοῖς· Εἰρήνη ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/019.yaml
  text: So when it was evening on that day[a], the first day of the week, and the doors had been locked where the disciples were because of fear of the Jews, Jesus came and stood in the midst of them and said to them[b], “Peace to you.”
translation:
  language: ar
  text: 'ولمّا كان مساء ذلك اليوم، اليوم الأول من الأسبوع، وكانت الأبواب موصدة حيث كان التلاميذ بسبب خوفهم من اليهود[a]، جاء يسوع ووقف في وسطهم وقال لهم: «السلام لكم»[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: قد يُقصد بـ«اليهود» هنا «زعماء اليهود» أو «أهل اليهودية»، بحسب فهم اللفظ اليوناني في هذا السياق.
    reason: alternative_reading
  - marker: b
    text: 'أو: «ليكن السلام معكم». واليونانية حرفيًا: «السلام لكم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὔσης οὖν ὀψίας
  choice: ولمّا حلّ مساء
  rationale: تنقل العبارة المطلقة بالمضاف إليه بوصفها إطارًا زمنيًا، وتعبّر الواو عن صلة السرد بما سبق من غير إثقال بـ«لذلك».
- source_word: τῇ ἡμέρᾳ ἐκείνῃ
  choice: ذلك اليوم
  rationale: صياغة عربية واضحة تحفظ الإشارة الزمنية الصريحة.
- source_word: τῇ μιᾷ σαββάτων
  choice: أول الأسبوع
  rationale: تؤدي الاصطلاح اليوناني الدال على اليوم الأول من الأسبوع بصياغة عربية طبيعية من غير إضافة تفسيرية.
- source_word: τῶν θυρῶν κεκλεισμένων
  choice: كانت الأبواب ... موصدة
  rationale: «موصدة» تدل على الإغلاق المحكم وتلائم حالة الخوف والحذر، مع حفظ حالة الإغلاق الناتجة التي يفيدها اسم المفعول التام.
- source_word: ὅπου ἦσαν οἱ μαθηταί
  choice: حيث كان التلاميذ
  rationale: تحفظ العبارة دلالتها المكانية البسيطة من غير إضافة أنهم كانوا مجتمعين أو مقيمين.
- source_word: διὰ τὸν φόβον τῶν Ἰουδαίων
  choice: بسبب خوفهم من اليهود
  rationale: توضح في العربية أن الخوف واقع على التلاميذ وأن اليهود هم متعلَّقه، مع إبقاء اللفظ اليوناني العام دون تضييق مرجعه في المتن.
- source_word: ἔστη εἰς τὸ μέσον
  choice: وقف في وسطهم
  rationale: تحفظ الصورة المكانية الحية، ويُفهم ضمير الجمع من السياق.
- source_word: λέγει αὐτοῖς
  choice: وقال لهم
  rationale: صيغ المضارع التاريخي بالماضي الملائم للسرد العربي، مع الحفاظ على تتابع الحدث.
- source_word: Εἰρήνη ὑμῖν
  choice: السلام لكم
  rationale: صياغة قريبة من التركيب اليوناني ومفهومة بوصفها تحية وإعلان سلام.
theological_decisions:
- issue: مرجع τῶν Ἰουδαίων في إنجيل يوحنا
  choice: اليهود في المتن مع بيان الاحتمالات السياقية في الحاشية
  alternative: زعماء اليهود؛ أو أهل اليهودية
  rationale: اللفظ اليوناني لا يصرّح هنا بالزعماء، وقد يتفاوت مرجعه في يوحنا بحسب السياق. لذلك يحفظ المتن عموم اللفظ، بينما تمنع الحاشية حصره عرقيًا أو تضييقه بلا تنبيه.
- issue: طبيعة قول Εἰρήνη ὑμῖν
  choice: السلام لكم
  alternative: ليكن السلام معكم
  rationale: يحفظ الاختيار إيجاز الأصل وغموضه المشروع بين التحية وإعلان السلام، من غير تحويله صراحة إلى مجرد تمنٍّ.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «موصدة» للدلالة على الإغلاق المحكم، وحُفظت العبارة «السلام لكم» لقربها من الأصل. وُضعت علامتا الحاشيتين في المتن عند العبارتين اللتين تشرحهما الحاشيتان.
