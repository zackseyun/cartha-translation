  text: ἔρχεται ⸀Μαριὰμ ἡ Μαγδαληνὴ ⸀ἀγγέλλουσα τοῖς μαθηταῖς ὅτι ⸀Ἑώρακα τὸν κύριον καὶ ταῦτα εἶπεν αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/018.yaml
  text: Mary Magdalene came announcing to the disciples[a], “I have seen the Lord,” and that he had said these things to her.
translation:
  language: ar
  text: 'جاءت مريم المجدلية تُخبر التلاميذ[a]: «لقد رأيتُ الرب»، وأنه قال لها هذه الأمور.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «جاءت مريم المجدلية إلى التلاميذ وقالت: ‹لقد رأيتُ الرب›، وقال لها هذه الأمور». ويمكن فهم العبارة الأخيرة إما على أنها جزء من خبر مريم، وإما على أنها تعليق من الراوي.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔρχεται
  choice: جاءت
  rationale: المضارع اليوناني مضارع تاريخي في سياق سردي، والماضي هو الأسلوب العربي الطبيعي هنا. واختيار «جاءت» يلائم حركتها نحو التلاميذ.
- source_word: Μαριὰμ ἡ Μαγδαληνὴ
  choice: مريم المجدلية
  rationale: الصيغة العربية المألوفة للاسم والنسبة، وهي واضحة وطبيعية.
- source_word: ἀγγέλλουσα
  choice: تُخبر
  rationale: اسم الفاعل يدل على نقل رسالة بالتزامن مع مجيئها؛ وتحافظ «تُخبر» على القوة الفعلية في عربية طبيعية.
- source_word: τοῖς μαθηταῖς
  choice: التلاميذ
  rationale: «التلاميذ» المقابل الاصطلاحي الدقيق، ولا تُضاف «تلاميذه» لأن ضمير الملكية غير مذكور في اليونانية.
- source_word: ὅτι
  choice: علامتا الاقتباس بعد النقطتين
  rationale: تُفهم الأداة هنا على أنها تُدخل مضمون الخبر، وتمثيل القول المباشر بعلامتي اقتباس طبيعي في العربية.
- source_word: Ἑώρακα
  choice: لقد رأيتُ
  rationale: تؤدي «لقد» مع الماضي معنى الفعل التام ونتيجته الحاضرة في هذا السياق، من غير صياغة عربية متكلفة.
- source_word: τὸν κύριον
  choice: الرب
  rationale: تحافظ «الرب» على ثقل اللقب في سياق القيامة وعلى الاستعمال العهدي الجديد المألوف.
- source_word: καὶ ταῦτα εἶπεν αὐτῇ
  choice: وأنه قال لها هذه الأمور
  rationale: تُبقي العبارة ضمن مضمون إخبار مريم، مع الحفاظ على «هذه الأمور» مقابل ταῦτα. ويظل احتمال كونها تعليقًا من الراوي مذكورًا في الحاشية.
theological_decisions:
- issue: ترجمة κύριος في سياق القيامة
  choice: الرب
  alternative: السيد
  rationale: يشير اللقب إلى يسوع ويحمل دلالة مسيانية معروفة؛ و«الرب» يحفظ ثقله من غير إضعافه أو فرض تفسير إضافي.
- issue: صلة καὶ ταῦτα εἶπεν αὐτῇ بخبر مريم
  choice: 'اعتبارها استمرارًا لمضمون ما أخبرت به: «وأنه قال لها هذه الأمور»'
  alternative: 'اعتبارها تعليقًا مستقلًا من الراوي: «وقال لها هذه الأمور»'
  rationale: مع أن ὅτι لا تتكرر، يمكن أن تستمر الجملة طبيعيًا بوصفها المفعول المضموني لـἀγγέλλουσα. ولأن التركيب اليوناني يحتمل الوجهين، تُحفظ القراءة البديلة في الحاشية بدل حسم الغموض بصمت.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت صياغة طبيعية للسرد مع إبقاء الغموض النحوي الحقيقي في ختام الآية ظاهرًا في الحاشية.
