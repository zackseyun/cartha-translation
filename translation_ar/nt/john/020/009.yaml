base_translation:
  language: en
  yaml_path: translation/nt/john/020/009.yaml
  text: For they did not yet understand the Scripture[a], that he had to rise from the dead.
translation:
  language: ar
  text: 'لأنهما لم يكونا قد فهما بعدُ ما يقوله الكتاب: إنه لا بد أن يقوم من بين الأموات.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إنه لا بد أن يُقام من بين الأموات». والفعل اليوناني هنا مبني للمعلوم، ومعناه «أن يقوم».'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδέπω
  choice: لم ... بعدُ
  rationale: تعبير عربي طبيعي يدل على أن الفهم لم يحدث إلى ذلك الوقت.
- source_word: γὰρ
  choice: لأنهما
  rationale: تحفظ الأداة وظيفتها التعليلية وصلتها بما قبلها، مع ضمير التثنية لأن السياق يتحدث عن بطرس والتلميذ الآخر.
- source_word: ᾔδεισαν
  choice: لم يكونا قد فهما
  rationale: المقصود في السياق إدراك معنى الشهادة الكتابية، لا مجرد العلم بوجودها.
- source_word: τὴν γραφὴν
  choice: ما يقوله الكتاب
  rationale: يحفظ دلالة γραφή على الكتاب المقدس، ويؤدي المفرد اليوناني بصياغة عربية واضحة وطبيعية.
- source_word: ὅτι
  choice: إنه
  rationale: تقدم مضمون ما يقوله الكتاب، وقد استُعملت النقطتان لتوضيح العلاقة التفسيرية.
- source_word: δεῖ
  choice: لا بد أن
  rationale: ينقل معنى الضرورة القوية، بما فيها دلالة الضرورة الإلهية في السياق، من غير إضافة تفسير عقائدي.
- source_word: αὐτὸν
  choice: ـه في «إنه»
  rationale: يظهر الضمير بوصفه صاحب فعل القيام في تركيب عربي طبيعي.
- source_word: ἐκ νεκρῶν
  choice: من بين الأموات
  rationale: ينقل صورة الخروج من جماعة الموتى، مع بقاء العبارة مفهومة في العربية المعاصرة.
- source_word: ἀναστῆναι
  choice: أن يقوم
  rationale: يحفظ صيغة الفعل المبني للمعلوم في اليونانية ولا يحولها في المتن إلى صيغة المبني للمجهول.
theological_decisions:
- issue: صيغة التعبير عن القيامة والفاعل فيها
  choice: إنه لا بد أن يقوم من بين الأموات
  alternative: إنه لا بد أن يُقام من بين الأموات
  rationale: المصدر اليوناني ἀναστῆναι مبني للمعلوم، ولذلك يحافظ المتن على «يقوم». أما صيغة «يُقام» فتوافق تعبيرات أخرى في العهد الجديد، لكنها ليست الصيغة النحوية المستعملة هنا؛ فذُكرت في الحاشية من غير فرض توفيق عقائدي على نص الآية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت صيغة التثنية مراعاةً للسياق الذي يشير إلى بطرس والتلميذ الآخر، مع أن اليونانية تستعمل الجمع لعدم وجود صيغة تثنية فيها. وتحافظ العبارة على المفرد في «الكتاب» وعلى الصيغة المعلومة لفعل القيامة.
