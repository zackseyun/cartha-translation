  text: καὶ λέγουσιν αὐτῇ ἐκεῖνοι· Γύναι, τί κλαίεις; λέγει αὐτοῖς ὅτι Ἦραν τὸν κύριόν μου, καὶ οὐκ οἶδα ποῦ ἔθηκαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/013.yaml
  text: And they said to her[a], “Woman, why are you weeping?” She said to them, “They have taken away my Lord[b], and I do not know where they have put him.”
translation:
  language: ar
  text: 'فقالا لها: «يا امرأة، لماذا تبكين؟» قالت لهما: «أخذوا ربي[a]، ولا أعرف أين وضعوه».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «سيدي». يمكن أن تعني الكلمة اليونانية لقب احترام بمعنى «السيد»، كما قد تحمل معنى «الرب» بحسب السياق.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκεῖνοι
  choice: قالا
  rationale: يشير الضمير إلى الملاكين المذكورين في السياق السابق؛ وتُظهر صيغة المثنى العربية المرجع بوضوح من غير إضافة تفسيرية.
- source_word: Γύναι
  choice: يا امرأة
  rationale: نداء مباشر محترم في هذا السياق، ويحافظ على صياغة يوحنا من غير تلطيف عاطفي زائد.
- source_word: τί κλαίεις
  choice: لماذا تبكين؟
  rationale: مع أن τί تعني حرفيًا «ماذا»، فإن التركيب الاستفهامي هنا يفيد السؤال عن السبب، و«لماذا تبكين؟» هي العربية الطبيعية.
- source_word: Ἦραν
  choice: أخذوا
  rationale: ينقل الفعل الماضي المكتمل ومعنى إزالة الجسد من موضعه، وهو موجز وطبيعي في العربية.
- source_word: τὸν κύριόν μου
  choice: سيدي
  rationale: «سيدي» تنقل κύριός μου طبيعيًا وتحفظ إمكان دلالتها على الاحترام والسيادة معًا؛ وتوضح الحاشية البديل اللاهوتي التقليدي.
- source_word: οὐκ οἶδα
  choice: لا أعرف
  rationale: الفعل οἶδα ذو دلالة حالية هنا، و«لا أعرف» تعبير عربي فصيح وواضح.
- source_word: ποῦ ἔθηκαν αὐτόν
  choice: أين وضعوه
  rationale: تنقل المعنى العام للفعل τίθημι، أي وضعه أو جعله في مكان، من غير تخصيص غير وارد في النص.
theological_decisions:
- issue: دلالة κύριος في كلام مريم
  choice: سيدي
  alternative: ربي
  rationale: يمكن أن تكون الكلمة لقب احترام بمعنى «السيد»، ويمكن أن تحمل صدى إيمانيًا أقوى. اختيرت «سيدي» في المتن لأنها طبيعية في الإضافة الشخصية وتحفظ الاحتمال السياقي، مع إثبات «ربي» في الحاشية حتى لا تُحسم الدلالة اللاهوتية ضمنًا.
- issue: نبرة Γύναι
  choice: يا امرأة
  alternative: يا سيدتي
  rationale: اللفظ اليوناني محترم في السياق لكنه لا يتضمن لفظًا زائدًا للمجاملة؛ لذلك حُفظ النداء المباشر بلا خشونة مقصودة ولا تلطيف تفسيري.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم المثنى في «فقالا» و«لهما» لأن المتكلمين ملاكان، وحُفظ السؤال بصيغته العربية الاصطلاحية الطبيعية.
