  text: Πολλὰ μὲν οὖν καὶ ἄλλα σημεῖα ἐποίησεν ὁ Ἰησοῦς ἐνώπιον τῶν ⸀μαθητῶν, ἃ οὐκ ἔστιν γεγραμμένα ἐν τῷ βιβλίῳ τούτῳ·
base_translation:
  language: en
  yaml_path: translation/nt/john/020/030.yaml
  text: Jesus did many other signs in the presence of the disciples[a], which are not written in this book.
translation:
  language: ar
  text: وقد صنع يسوع آياتٍ أخرى كثيرة أمام التلاميذ[a]، لم تُكتب في هذا الكتاب.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «معجزات». واللفظ اليوناني هو «آيات»، أي أعمال تشير إلى ما وراءها وتكشف مَن هو يسوع.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλὰ μὲν οὖν καὶ ἄλλα
  choice: وقد ... أخرى كثيرة
  rationale: تنقل الواو مع «قد» استمرار الكلام وخلاصته بصورة عربية طبيعية، بينما تُعبّر «أخرى كثيرة» عن كثرة الآيات الأخرى. ولا يُفرد μέν بلفظ مستقل لأنه يمهّد للمقابلة التي تكتمل في العدد التالي.
- source_word: σημεῖα
  choice: آيات
  rationale: 'تحافظ «آيات» على دلالة اللفظ في إنجيل يوحنا: أعمال معجزية تشير إلى هوية يسوع وتتجاوز مجرد إظهار القدرة.'
- source_word: ἐποίησεν
  choice: صنع
  rationale: «صنع» مقابل مباشر وطبيعي للفعل ποιέω في سياق صنع الآيات، مع بقاء «أجرى» احتمالًا عربيًا أكثر تفسيرًا.
- source_word: ἐνώπιον τῶν μαθητῶν
  choice: أمام التلاميذ
  rationale: تبيّن العبارة أن التلاميذ كانوا حاضرين وشهودًا، من غير إضافة ضمير ملكية غير موجود صراحة في اليونانية.
- source_word: ἃ οὐκ ἔστιν γεγραμμένα
  choice: لم تُكتب
  rationale: تحافظ الصياغة على المبني للمجهول وعلى معنى عدم إدراج تلك الآيات كتابةً، بأسلوب عربي موجز وطبيعي.
- source_word: ἐν τῷ βιβλίῳ τούτῳ
  choice: في هذا الكتاب
  rationale: «الكتاب» هو المقابل الواضح والطبيعي لـ βιβλίον هنا، إذ يشير إلى هذا المؤلَّف المكتوب.
theological_decisions:
- issue: الدلالة اليوحناوية للفظ σημεῖα
  choice: آيات
  alternative: معجزات
  rationale: «آيات» تحفظ التوتر الدلالي المقصود بين العمل المعجزي وبين كونه علامة تكشف هوية يسوع ورسالته، من غير اختزاله في مظهر للقوة وحده.
translation_notes:
  register: صياغة عربية فصحى معاصرة، واضحة ومهيبة. استُخدمت «وقد» للربط الطبيعي بالسياق، وحُفظت «آيات» بوصفها المصطلح اليوحناوي المحوري، مع شرح البديل في الحاشية.
