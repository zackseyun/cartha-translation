lexical_decisions:
- source_word: δὲ
  choice: أما
  rationale: تفيد انتقالًا سرديًا مع مقابلة خفيفة بالمشهد السابق، وتوجّه الانتباه طبيعيًا إلى مريم.
- source_word: εἱστήκει
  choice: كانت واقفة
  rationale: تنقل الحالة المستمرة التي يدل عليها الفعل بصيغته هنا، لا مجرد وقوف وقع وانتهى.
- source_word: πρὸς τῷ μνημείῳ ἔξω
  choice: خارج القبر
  rationale: تعبير عربي طبيعي يحدد موضع مريم خارج القبر، في مقابل نظرها لاحقًا إلى داخله.
- source_word: μνημεῖον
  choice: القبر
  rationale: يدل في هذا السياق على موضع الدفن، و«القبر» هو اللفظ العربي الواضح والمألوف.
- source_word: κλαίουσα / ἔκλαιεν
  choice: تبكي / كانت تبكي
  rationale: يحافظ التكرار على استمرار بكائها وعلى الصدى اللفظي الموجود في اليونانية.
- source_word: ὡς οὖν
  choice: وبينما
  rationale: تربط الفعل التالي ببكائها المستمر وتدفع السرد إلى الأمام من غير المبالغة في معنى السببية.
- source_word: παρέκυψεν
  choice: انحنت لتنظر
  rationale: يجمع الفعل بين الانحناء والنظر إلى الداخل؛ وهذه الصياغة تبين الحركة وغرضها بوضوح.
- source_word: εἰς τὸ μνημεῖον
  choice: إلى داخل القبر
  rationale: تنقل اتجاه النظر نحو باطن القبر بصورة عربية واضحة.
