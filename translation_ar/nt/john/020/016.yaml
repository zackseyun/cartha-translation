base_translation:
  language: en
  yaml_path: translation/nt/john/020/016.yaml
  text: Jesus says to her[a], “Mary.” Turning, she says to him in Hebrew, “Rabboni!” (which means, “Teacher”).
translation:
  language: ar
  text: 'يقول لها يسوع: «يا مريم». فالتفتت وقالت له بالعبرية[a]: «رَبُّونِي!» (أي: «يا معلّم»).'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بالآرامية». قد يُستعمل تعبير يوحنا «بالعبرية» بمعنى أوسع، فيشير إلى اللسان السامي الذي كان دارجًا في اليهودية.'
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει
  choice: يقول
  rationale: حُفظ المضارع التاريخي الذي يضفي حيوية على سرد يوحنا، بدل تسويته إلى الماضي.
- source_word: αὐτῇ
  choice: لها
  rationale: تعبير عربي طبيعي عن ضمير المفعول غير المباشر في صيغة المجرور اليونانية.
- source_word: Μαριάμ
  choice: يا مريم
  rationale: استُخدم الاسم العربي المألوف، وأُظهرت دلالة النداء التي يحملها السياق وإن لم تستعمل اليونانية أداة نداء مستقلة.
- source_word: στραφεῖσα ἐκείνη
  choice: فالتفتت
  rationale: صياغة عربية موجزة وطبيعية تحفظ تعاقب الفعل؛ والفاعل المؤنث في الفعل يغني عن ترجمة ἐκείνη بضمير مستقل.
- source_word: λέγει αὐτῷ
  choice: وقالت له
  rationale: استُعمل الماضي هنا على نحو طبيعي بعد الفعل التابع، مع نقل الداتيف بعبارة «له».
- source_word: Ἑβραϊστί
  choice: بالعبرية
  rationale: يتبع النص اليوناني حرفيًا في تسمية اللغة، مع حفظ احتمال أن المقصود الآرامية في الحاشية.
- source_word: Ραββουνι
  choice: رَبُّونِي
  rationale: نُقلت اللفظة صوتيًا لأن الإنجيل نفسه يفسرها مباشرة، مما يحفظ نبرتها الثقافية والعاطفية.
- source_word: ὃ λέγεται Διδάσκαλε
  choice: 'أي: «يا معلّم»'
  rationale: «أي» تؤدي وظيفة الشرح بصورة عربية طبيعية، وأُظهرت صيغة النداء في Διδάσκαλε بأداة «يا».
theological_decisions:
- issue: دلالة Ἑβραϊστί في السرد اليوحناوي
  choice: بالعبرية
  alternative: بالآرامية
  rationale: يحافظ المتن على اللفظ اليوناني الصريح، بينما تُذكر في الحاشية إمكانية استعمال يوحنا للمصطلح بمعنى أوسع يشمل اللسان السامي الدارج في اليهودية، دون حسم التوتر التفسيري.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ المضارع التاريخي في افتتاح القول، واستُعملت أداة النداء مع «مريم» و«معلّم» لتؤدي الوظيفة التداولية لصيغة الخطاب اليونانية بصورة طبيعية.
