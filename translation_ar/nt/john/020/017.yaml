source:
  edition: SBLGNT
  text: λέγει ⸀αὐτῇ Ἰησοῦς· Μή μου ἅπτου, οὔπω γὰρ ἀναβέβηκα πρὸς τὸν ⸀πατέρα· πορεύου δὲ πρὸς τοὺς ἀδελφούς μου καὶ εἰπὲ αὐτοῖς· Ἀναβαίνω πρὸς τὸν πατέρα μου καὶ πατέρα ὑμῶν καὶ θεόν μου καὶ θεὸν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/017.yaml
  text: Jesus said to her[a], “Do not cling to me, for I have not yet ascended to the Father. But go to my brothers and tell them, ‘I am ascending to my Father and your Father[b], and my God and your God.’”
translation:
  language: ar
  text: 'قال لها يسوع: «لا تتشبثي بي[a]، لأني لم أصعد بعد إلى الآب. ولكن اذهبي إلى إخوتي[b] وقولي لهم: إني أصعد إلى أبي وأبيكم، وإلهي وإلهكم».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «لا تلمسيني» أو «لا تستمري في الإمساك بي». والأرجح أن اليونانية تشير إلى التشبث بيسوع أو مواصلة الإمساك به، لا إلى مجرد ملامسته.
    reason: lexical_alternative
  - marker: b
    text: اللفظ اليوناني هنا جمع مذكر بمعنى «الإخوة». ويشير في هذا السياق إلى تلاميذ يسوع، وقد يشمل جماعة تمثيلية أوسع.
    reason: cultural_note
lexical_decisions:
- source_word: ἅπτου
  choice: تتشبثي بي
  rationale: ينقل معنى التعلّق أو الاستمرار في الإمساك، وهو أنسب للسياق ولصيغة النهي بالمضارع من الاقتصار على معنى اللمس العابر.
- source_word: οὔπω γὰρ ἀναβέβηκα
  choice: لأني لم أصعد بعد
  rationale: يحفظ معنى الصعود إلى الآب وقوة صيغة التام اليونانية، مع تعبير عربي واضح وطبيعي.
- source_word: πρὸς τὸν πατέρα
  choice: إلى الآب
  rationale: يحافظ على أداة التعريف في العبارة اليونانية من غير إضافة ضمير الملكية، إذ يأتي لاحقًا التعبير الصريح «أبي وأبيكم».
- source_word: πορεύου
  choice: اذهبي
  rationale: أمر مباشر بالحركة، وهذه الصياغة هي الأوضح والأطبع في العربية.
- source_word: ἀδελφούς
  choice: إخوتي
  rationale: يحفظ صيغة الجمع المذكر في الأصل، مع بيان نطاق الإشارة المحتمل في الحاشية بدل توسيع النص نفسه.
- source_word: εἰπὲ αὐτοῖς
  choice: قولي لهم
  rationale: ترجمة مباشرة وطبيعية لصيغة الأمر في تركيب الإبلاغ.
- source_word: Ἀναβαίνω
  choice: إني أصعد
  rationale: يحفظ المضارع اليوناني وحركته الحاضرة المتجهة إلى حدث قريب، من غير تحويله إلى ماضٍ أو تفسيره تفسيرًا زائدًا.
- source_word: πατέρα μου καὶ πατέρα ὑμῶν
  choice: أبي وأبيكم
  rationale: يحفظ التوازي المقصود والتمييز بين نسبة الآب إلى يسوع ونسبته إلى المخاطَبين.
- source_word: θεόν μου καὶ θεὸν ὑμῶν
  choice: إلهي وإلهكم
  rationale: ترجمة مباشرة تحافظ على البنية المتوازية وعلى كامل ثقل العبارة اللاهوتي من غير تلطيف تفسيري.
theological_decisions:
- issue: معنى Μή μου ἅπτου
  choice: نهي عن استمرار التعلّق أو الإمساك
  alternative: لا تلمسيني
  rationale: صيغة الفعل والسياق يرجحان معنى فعل مستمر، لكن الحاشية تحفظ احتمال الترجمة الأوسع «لا تلمسيني» من غير حسم ما لا يحسمه النص تمامًا.
- issue: ترجمة πατέρα في الجملة الأولى
  choice: الآب
  alternative: أبي
  rationale: 'لا يرد ضمير الملكية μου في هذه الجملة من الأصل، ولذلك تُحفظ الصياغة «الآب»، بينما يصرح الكلام اللاحق بالعلاقة: «أبي وأبيكم».'
- issue: الدلالة المسيحانية لعبارة «إلهي وإلهكم»
  choice: إثبات العبارة كما هي بلا تلطيف عقائدي
  alternative: صياغة تفسيرية تخفف عبارة «إلهي»
  rationale: ينبغي إبقاء التوتر اللاهوتي والوزن الكامل لعبارة يوحنا كما وردت، من غير تعديلها استباقًا لتفادي فهم معين.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. روعي التأنيث في أمري مريم «اذهبي» و«قولي»، وحُفظ التوازي الإيقاعي والدلالي في «أبي وأبيكم، وإلهي وإلهكم»، مع تجنب الصياغة الطائفية أو الشرح العقائدي داخل المتن.
