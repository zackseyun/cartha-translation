source:
  edition: SBLGNT
  text: ταῦτα δὲ γέγραπται ἵνα ⸀πιστεύητε ὅτι Ἰησοῦς ἐστιν ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ, καὶ ἵνα πιστεύοντες ζωὴν ἔχητε ἐν τῷ ὀνόματι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/031.yaml
  text: But these have been written so that you may believe that Jesus is the Messiah[a], the Son of God[b], and so that by believing you may have life in his name.
translation:
  language: ar
  text: أمّا هذه الأمور فقد كُتبت لكي تؤمنوا[a] أن يسوع هو المسيح[b]، ابن الله، ولكي تكون لكم، بإيمانكم، حياة باسمه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ بعض المخطوطات الفعل اليوناني بصيغة الماضي البسيط، وقد تفيد «لكي تأتوا إلى الإيمان»؛ أما النص المطبوع فيقرأه بصيغة المضارع، وقد تفيد «لكي تستمروا في الإيمان». ويصوغ المتن المعنى على نحو عام: «لكي تؤمنوا».'
    reason: textual_variant
  - marker: b
    text: اللفظ اليوناني Χριστός لقبٌ يُترجم هنا «المسيح». ويمكن نقله صوتيًا «كريستوس»، لكن «المسيح» يبيّن معنى اللقب.
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα
  choice: هذه
  rationale: تشير إلى الآيات والأمور المكتوبة المذكورة في السياق السابق، ويجوز في العربية استعمال اسم الإشارة وحده بوضوح.
- source_word: δὲ
  choice: أمّا
  rationale: تفيد انتقالًا مع مقابلة لطيفة بما سبق، وصيغة «أمّا هذه» طبيعية وفصيحة في هذا الموضع.
- source_word: γέγραπται
  choice: فقد كُتبت
  rationale: يحفظ المبني للمجهول، وتساعد «قد» مع الماضي على إبراز الفعل المنجز ذي الأثر القائم.
- source_word: ἵνα πιστεύητε
  choice: لكي تؤمنوا
  rationale: تنقل الغرض من الكتابة من غير حسم زائد لدلالة صيغة الفعل على ابتداء الإيمان أو استمراره؛ ويُشرح الاختلاف النصي في الحاشية.
- source_word: ὁ χριστός
  choice: المسيح
  rationale: ترجمة عربية راسخة للقب اليوناني Χριστός، وتحفظ كونه لقبًا لا اسمًا شخصيًا فحسب.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: ابن الله
  rationale: تنقل اللقب المسيحاني/اللاهوتي بصيغته العربية الدقيقة والمألوفة دون تخفيف أو توسع.
- source_word: πιστεύοντες
  choice: بإيمانكم
  rationale: صياغة ظرفية طبيعية تعبّر عن الوسيلة أو الحال المتصلة بالحصول على الحياة، دون إضافة مضمون غير موجود.
- source_word: ζωὴν ἔχητε
  choice: تكون لكم حياة
  rationale: تعبير عربي طبيعي يحفظ معنى امتلاك الحياة، ولا يضيف وصف «الأبدية» غير الوارد صراحة في اليونانية.
- source_word: ἐν τῷ ὀνόματι αὐτοῦ
  choice: باسمه
  rationale: تحفظ الصلة بالاسم في عبارة عربية موجزة وطبيعية، مع بقاء سعة الدلالة اللاهوتية للتعبير.
theological_decisions:
- issue: دلالة Χριστός بوصفه لقبًا
  choice: المسيح
  alternative: المسيح المنتظر
  rationale: «المسيح» هو المقابل العربي التقليدي الدقيق للقب، أما إضافة «المنتظر» فتوضح ضمنًا لكنها ليست لفظًا مستقلًا في النص.
- issue: الاختلاف النصي والجانبي في πιστεύητε
  choice: لكي تؤمنوا
  alternative: لكي تستمروا في الإيمان / لكي تأتوا إلى الإيمان
  rationale: النص المطبوع يقرأ صيغة المضارع، مع وجود قراءة معتبرة بصيغة الماضي البسيط؛ والترجمة العامة تتجنب حسم ما إذا كان المقصود ابتداء الإيمان أو استمراره، بينما توثق الحاشية المسألة.
- issue: معنى الحياة
  choice: حياة
  alternative: حياة أبدية
  rationale: يحافظ النص على اللفظ غير المقيّد في اليونانية، تاركًا لعمق الاستعمال اليوحناوي أن يظهر من السياق من غير إدخال صفة غير موجودة هنا.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حُفظ توازي عبارتي الغرض بـ«لكي»، واستُعمل «المسيح» بوصفه اللقب العربي الراسخ. وُضعت علامة الحاشية بعد «المسيح» لتوثيق المسألة المرتبطة مباشرة بهدف الإيمان وفق مادة الاستشارة، مع دمج بيان القراءة البديلة ودلالة اللقب في حاشية واحدة كي يطابق كل مؤشر حاشية موضعًا ظاهرًا في المتن.
