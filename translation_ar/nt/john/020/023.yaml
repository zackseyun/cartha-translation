  source_fidelity: الترجمة تنقل بدقة البنية الشرطية غير المحددة في ἄν τινων، ومعنى ἀφῆτε «غفرتم»، وتقابل κρατῆτε مع الغفران بعبارة «أبقيتم». وتحافظ الجملتان الجوابيتان على المبني للمجهول من غير تسمية الفاعل، وعلى الإيحاء الناتج من صيغة التام اليونانية بواسطة الماضي المبني للمجهول مع «قد». إعادة «خطايا» في الشطر الثاني توضيح عربي مشروع للمتعلَّق المفهوم من السياق، ولا تضيف معنى لاهوتيًا.
