  terminology: «خطايا» و«غفرتم» مصطلحان طبيعيان ودقيقان. اختيار «أبقيتم» يحفظ مجال «الاحتفاظ/الإمساك» في κρατέω دون تحويله تفسيريًا إلى «لم تغفروا». كما أن المبني للمجهول لا يحسم مسألة الفاعل الإلهي أو العلاقة الدقيقة بين فعل المخاطَبين والغفران.
