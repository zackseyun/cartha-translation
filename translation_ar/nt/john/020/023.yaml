base_translation:
  language: en
  yaml_path: translation/nt/john/020/023.yaml
  text: If you forgive the sins of any[a], they have been forgiven them; if you retain them[b], they have been retained.
translation:
  language: ar
  text: إِنْ غَفَرْتُمْ خَطَايَا أَيِّ أُنَاسٍ، فَقَدْ غُفِرَتْ لَهُمْ[a]؛ وَإِنْ أَبْقَيْتُمْ خَطَايَا أَيِّ أُنَاسٍ، فَقَدْ أُبْقِيَتْ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'استعمل اليوناني هنا فعلًا تامًّا مبنيًّا للمجهول، ويمكن التعبير عن دلالته أيضًا: «فهي مغفورة لهم»، أي إن الغفران واقع ونتيجته قائمة.'
    reason: aspectual_alternative
  - marker: b
    text: 'يمكن ترجمة «أبقيتم» أيضًا: «أمسكتم». والفعل اليوناني في الجواب تامّ مبنيّ للمجهول، فيفيد وقوع الإبقاء وبقاء نتيجته، من غير أن يذكر فاعله.'
    reason: lexical_and_aspectual_alternative
lexical_decisions:
- source_word: ἄν τινων
  choice: إِنْ ... أَيِّ أُنَاسٍ
  rationale: 'ينقل تركيب الشرط غير المحدد: الفعل معلّق على أيّ أشخاص يكونون، من غير تحويله إلى صيغة موصولية أو تخصيص فئة بعينها.'
- source_word: ἀφῆτε
  choice: غَفَرْتُمْ
  rationale: المعنى المألوف للفعل ἀφίημι مع الخطايا هو الغفران، وهو التعبير العربي الطبيعي والواضح في هذا السياق.
- source_word: τὰς ἁμαρτίας
  choice: خَطَايَا
  rationale: «خطايا» المقابل العربي المباشر والطبيعي، ولا تحتاج العربية هنا إلى أداة تعريف لأن الإضافة إلى «أي أناس» تحقق التحديد التركيبي المناسب.
- source_word: ἀφέωνται αὐτοῖς
  choice: فَقَدْ غُفِرَتْ لَهُمْ
  rationale: البناء للمجهول يحفظ عدم التصريح بالفاعل، و«قد» مع الماضي ينقل قدر الإمكان دلالة الفعل التام على وقوع الفعل وبقاء نتيجته؛ واللام تقابل ضمير المفعول غير المباشر αὐτοῖς.
- source_word: κρατῆτε
  choice: أَبْقَيْتُمْ
  rationale: الفعل هنا يقابل الغفران ويدل على إبقاء الخطايا وعدم إطلاقها. «أبقيتم» أوضح في العربية المعاصرة من «أمسكتم»، من غير أن يصرّح بتفسير مثل «لم تغفروا».
- source_word: κεκράτηνται
  choice: فَقَدْ أُبْقِيَتْ
  rationale: يحفظ المبني للمجهول، والتوازي مع «فقد غُفرت»، ودلالة الحالة الناتجة المستمرة التي تحملها صيغة التام اليونانية.
theological_decisions:
- issue: هل تُصاغ الآية بما يفيد أن التلاميذ يُحدثون الغفران استقلالًا، أم أن إعلانهم يوافق فعلًا إلهيًا سابقًا؟
  choice: 'الإبقاء على المبني للمجهول: «فقد غُفرت» و«فقد أُبقيت».'
  alternative: 'التصريح بالفاعل: «فقد غفرها الله لهم» و«فقد أبقاها الله»؛ أو الاكتفاء بالمضارع: «تُغفر» و«تُبقى».'
  rationale: النص اليوناني لا يسمّي فاعل الغفران أو الإبقاء، مع أن المبني للمجهول قد يُفهم لاهوتيًا على أنه يشير إلى الله. لذلك لا تضيف الترجمة فاعلًا ولا تحسم طبيعة العلاقة بين فعل التلاميذ والفعل الإلهي، بل تحفظ التوتر المقصود وصيغة النتيجة القائمة.
translation_notes:
  register: العربية فصحى حديثة واضحة ذات نبرة كتابية كريمة. حوفظ على التوازي بين شطري الآية، وعلى الشرط غير المحدد، وعلى المبني للمجهول في الجوابين. تكرار «خطايا أي أناس» في الشطر الثاني مقصود لتجنب غموض الضمائر في العربية ولإظهار متعلق الفعل بوضوح.
