base_translation:
  language: en
  yaml_path: translation/nt/john/020/027.yaml
  text: Then he said to Thomas[a], “Bring your finger here and see my hands, and bring your hand and put it into my side, and do not become unbelieving, but believing.”
translation:
  language: ar
  text: 'ثم قال لتوما: «هات إصبعك إلى هنا وانظر إلى يديَّ، وهات يدك وضعها في جنبي، ولا تَصِرْ غير مؤمن، بل مؤمنًا».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ولا تَصِرْ غير وفيّ، بل وفيًّا». يمكن أن تحمل الصفتان اليونانيتان كلا المعنيين، لكن المقابلة في هذا السياق تتركز على إيمان توما بيسوع القائم.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἶτα
  choice: ثم
  rationale: تفيد تتابع أحداث الرواية بعبارة عربية موجزة وطبيعية.
- source_word: λέγει
  choice: قال
  rationale: المضارع التاريخي اليوناني يُنقل بالماضي، وهو الأنسب للسرد العربي.
- source_word: Φέρε
  choice: هات
  rationale: تنقل الأمر بتحريك الإصبع واليد إلى الموضع المشار إليه، وتحافظ طبيعيًا على تكرار الفعل في الجملتين.
- source_word: δάκτυλόν σου ὧδε
  choice: إصبعك إلى هنا
  rationale: يحفظ دلالة الإشارة المكانية في ὧδε، ويبيّن اتجاه الحركة الذي يقتضيه السياق.
- source_word: ἴδε
  choice: انظر
  rationale: أفصح مع المفعول «يديَّ» في العربية من «رَ»، من غير النبرة القديمة التي قد تحملها «هوذا».
- source_word: τὰς χεῖράς μου
  choice: يديَّ
  rationale: يحفظ صيغة المثنى الطبيعية في العربية بدل جمع اليدين.
- source_word: βάλε εἰς τὴν πλευράν μου
  choice: ضعها في جنبي
  rationale: ترجمة مباشرة وطبيعية للأمر وللاتجاه الذي تفيده εἰς؛ ويعود الضمير إلى اليد.
- source_word: μὴ γίνου
  choice: لا تَصِرْ
  rationale: يحفظ المعنى التحولي أو الصيروري في γίνομαι بدل تحويله إلى وصف ساكن محض.
- source_word: ἄπιστος
  choice: غير مؤمن
  rationale: السياق المباشر هو امتناع توما عن تصديق قيامة يسوع، لذلك يبرز معنى عدم الإيمان.
- source_word: πιστός
  choice: مؤمنًا
  rationale: يقابل «غير مؤمن» بوضوح ويحفظ تركيز السياق على الإيمان بيسوع القائم، مع الإقرار بإمكان معنى «أمين» معجميًا.
theological_decisions:
- issue: المقابلة بين ἄπιστος وπιστός في خطاب يسوع لتوما
  choice: غير مؤمن / مؤمنًا
  alternative: غير أمين / أمينًا
  rationale: يتناول السياق رفض توما أن يصدق شهادة التلاميذ عن القيامة ما لم يرَ ويلمس، ولذلك يغلب هنا معنى الإيمان. وتُذكر الدلالة البديلة في الحاشية حفاظًا على المدى الدلالي للصفة اليونانية.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُعمل «هات» لصيغة أمر طبيعية تحفظ تكرار Φέρε، و«لا تَصِرْ» لإبقاء الدلالة الصيرورية. وُضعت علامة الحاشية بعد الجملة التي تتصل بها.
