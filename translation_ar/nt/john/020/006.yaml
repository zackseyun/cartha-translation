  text: Then Simon Peter also came[a], following him, and entered into the tomb; and he sees the linen cloths lying there,
translation:
  language: ar
  text: ثم جاء سمعان بطرس أيضًا، يتبعه، ودخل القبر، فرأى لفائف الكتان موضوعة هناك،
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρχεται
  choice: جاء
  rationale: المضارع التاريخي اليوناني يدفع السرد بحيوية، لكن الماضي هو الأسلوب الطبيعي الواضح في السرد العربي هنا.
- source_word: οὖν
  choice: ثم
  rationale: تدل في السياق على تتابع الحدث، و«ثم» تلائم مجيء بطرس بعد التلميذ الآخر.
- source_word: καὶ Σίμων Πέτρος
  choice: سمعان بطرس أيضًا
  rationale: 'تفيد καὶ معنى الإضافة هنا: جاء سمعان بطرس هو أيضًا، بعد وصول التلميذ الآخر.'
- source_word: ἀκολουθῶν αὐτῷ
  choice: وهو يتبعه
  rationale: تنقل اسم الفاعل الحاضر بوصفه فعلاً متزامنًا مع المجيء، وتحافظ على مرجع الضمير دون زيادة تفسيرية.
- source_word: εἰσῆλθεν εἰς τὸ μνημεῖον
  choice: ودخل القبر
  rationale: صياغة عربية طبيعية تنقل حركة الدخول، و«القبر» هو المعنى السياقي لـ μνημεῖον.
- source_word: θεωρεῖ
  choice: فرأى
  rationale: الفعل يدل على الرؤية المتفحصة أو الملاحظة؛ اختير الماضي لاتساق السرد العربي، مع بقاء معنى المعاينة واضحًا من المشهد.
- source_word: τὰ ὀθόνια
  choice: أكفان الكتان
  rationale: تشير ὀθόνια إلى قطع كتان مستخدمة في الدفن؛ و«أكفان الكتان» واضحة للقارئ العربي وتحفظ مادة القماش ووظيفته السياقية.
- source_word: κείμενα
  choice: موضوعة هناك
  rationale: تنقل حالة قطع الكتان وهي مستقرة في موضعها؛ وأضيفت «هناك» طبيعيًا للإشارة إلى موضعها داخل القبر.
