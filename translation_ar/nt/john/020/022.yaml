  text: And after saying this[a], he breathed on them and said to them, “Receive the Holy Spirit.”
translation:
  language: ar
  text: 'وبعد أن قال هذا، نفخ عليهم[a] وقال لهم: «اقبلوا الروح القدس».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «نفخ فيهم». ويذكّر الفعل أيضًا بتصوير الخلق والخليقة الجديدة في التكوين 2:7 وحزقيال 37.'
    reason: بديل معجمي وصدى بين نصي
lexical_decisions:
- source_word: τοῦτο εἰπὼν
  choice: وبعدما قال هذا
  rationale: اسم الفاعل الأوريستي يدل طبيعيًا على فعل سبق الفعل الرئيس؛ وهذه الصياغة عربية واضحة وتحفظ التعاقب الزمني.
- source_word: ἐνεφύσησεν
  choice: نفخ عليهم
  rationale: الفعل يدل على النفخ، والسياق يرجّح توجيه النفخة إليهم. أبقت الصياغة صدى صور الخلق والخليقة الجديدة من غير أن تفرضه صراحة في المتن.
- source_word: λέγει αὐτοῖς
  choice: وقال لهم
  rationale: مع أن اليونانية تستعمل المضارع التاريخي، فإن الماضي أنسب للسرد العربي المتصل ولا يغيّر المعنى.
- source_word: Λάβετε
  choice: اقبلوا
  rationale: في سياق عطية الروح، «اقبلوا» تعبر طبيعيًا عن التلقي المقصود، بينما قد توحي «خذوا» بالمبادرة إلى الاستحواذ.
- source_word: πνεῦμα ἅγιον
  choice: الروح القدس
  rationale: العبارة في السياق اليوحناوي تشير إلى روح الله القدوس؛ والتعريف هو التعبير العربي المألوف عن هذا المرجع، مع أن الأصل اليوناني غير معرّف.
theological_decisions:
- issue: هل تشير عبارة πνεῦμα ἅγιον إلى الروح الإلهي أم إلى روح مقدسة على نحو غير شخصي؟
  choice: الروح القدس
  alternative: روحًا مقدسة
  rationale: السياق في إنجيل يوحنا واستعمال العهد الجديد يرجحان الإشارة إلى الروح القدس، ولا يضيف التعريف العربي مضمونًا غير موجود بل يوضح المرجع الطبيعي للعبارة.
- issue: دلالة فعل ἐνεφύσησεν وصلته بصور الخلق والخليقة الجديدة
  choice: نفخ عليهم مع حاشية تبقي احتمال «نفخ فيهم» وتذكر الصدى النصي
  alternative: نفخ فيهم
  rationale: حرف الجر غير مذكور صراحة في اليونانية، لذلك لا ينبغي حسم اتجاه النفخ بما يتجاوز دلالة الفعل؛ وتوضح الحاشية البديل والصدى المحتملين من غير فرض تفسير لاهوتي في المتن.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة. استُخدم الماضي في السرد بدل المضارع التاريخي اليوناني، وحُفظت العبارة الأمرية موجزة ومباشرة.
