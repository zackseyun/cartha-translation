source:
  edition: SBLGNT
  text: λέγει ⸀αὐτῇ Ἰησοῦς· Γύναι, τί κλαίεις; τίνα ζητεῖς; ἐκείνη δοκοῦσα ὅτι ὁ κηπουρός ἐστιν λέγει αὐτῷ· Κύριε, εἰ σὺ ἐβάστασας αὐτόν, εἰπέ μοι ποῦ ἔθηκας αὐτόν, κἀγὼ αὐτὸν ἀρῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/015.yaml
  text: Jesus says to her[a], “Woman, why are you weeping? Whom are you seeking?” She, supposing that he was the gardener, says to him, “Sir, if you carried him away, tell me where you put him, and I will take him away.”
translation:
  language: ar
  text: 'قال لها يسوع: «يا امرأة، لماذا تبكين؟ عمَّن تبحثين؟» وإذ ظنَّت أنه البستاني، قالت له: «يا سيدي[a]، إن كنت أنت قد حملته، فقل لي أين وضعته، وأنا سآخذه».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'اليونانية: «يا رب» (κύριε)؛ ويُرجَّح أنها تُستعمل هنا بمعنى نداء الاحترام «يا سيدي»، لأن مريم تظن أنها تخاطب البستاني.'
    reason: alternative_reading
lexical_decisions:
- source_word: Γύναι
  choice: يا امرأة
  rationale: صيغة نداء محترمة في هذا السياق، وليست ازدرائية. وتحافظ «يا امرأة» على مباشرة التعبير وتكراره في إنجيل يوحنا من غير إضافة معنى غير مصرح به.
- source_word: τί κλαίεις
  choice: لماذا تبكين؟
  rationale: استُعملت «لماذا» للدلالة الاصطلاحية على السبب، و«تبكين» تعكس معنى κλαίω بوضوح وبنبرة تلائم مشهد الحزن.
- source_word: τίνα ζητεῖς
  choice: عمَّن تبحثين؟
  rationale: السؤال عن شخص، و«تبحثين عن» تعبير عربي طبيعي يؤدي معنى ζητέω في هذا السياق.
- source_word: δοκοῦσα
  choice: فظنَّت
  rationale: تنقل استنتاج مريم الخاطئ من غير أن توحي بيقين زائد، وتنسجم طبيعيًا مع السرد العربي.
- source_word: ὁ κηπουρός
  choice: البستاني
  rationale: المقابل العربي المباشر والشائع لمن يعتني بالبستان.
- source_word: Κύριε
  choice: يا سيدي
  rationale: مع أن اللفظ اليوناني قد يعني «الرب»، فإن مريم تظن أنها تخاطب البستاني؛ لذلك يفيد هنا على الأرجح الاحترام في المخاطبة.
- source_word: ἐβάστασας αὐτόν
  choice: حملته من هنا
  rationale: يحفظ المعنى الجسدي للفعل βαστάζω في سياق نقل الجسد، وتوضح «من هنا» دلالة الإبعاد التي يقتضيها السياق من غير مبالغة.
- source_word: ποῦ ἔθηκας αὐτόν
  choice: أين وضعته
  rationale: تؤدي المعنى العام للفعل τίθημι بعبارة عربية واضحة وطبيعية، من غير تخصيص هيئة وضع الجسد.
- source_word: κἀγὼ αὐτὸν ἀρῶ
  choice: وأنا آخذه
  rationale: تعكس تعهد مريم بأن تتولى أخذ الجسد، وتحافظ على دلالة αἴρω المفتوحة بين الأخذ والحمل والإزالة.
theological_decisions:
- issue: ترجمة κύριε في خطاب مريم قبل أن تعرف يسوع القائم
  choice: يا سيدي
  alternative: يا رب
  rationale: 'السياق هو الحاكم هنا: مريم تحسب المتكلم بستانيًا، ولذلك يُرجح أن κύριε نداء احترام لا اعترافًا مسيانيًا. أُبقي المعنى الحرفي البديل في الحاشية حفاظًا على شفافية النص اليوناني.'
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُعمل الماضي في أفعال السرد بما يلائم العربية الطبيعية، مع إبقاء الأسئلة والخطاب المباشر موجزين. وُضع مؤشر الحاشية بعد «يا سيدي»، أي عند اللفظ الذي تتناوله الحاشية.
