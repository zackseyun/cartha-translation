source:
  edition: SBLGNT
  text: Καὶ μεθ’ ἡμέρας ὀκτὼ πάλιν ἦσαν ἔσω οἱ μαθηταὶ αὐτοῦ καὶ Θωμᾶς μετ’ αὐτῶν. ἔρχεται ὁ Ἰησοῦς τῶν θυρῶν κεκλεισμένων, καὶ ἔστη εἰς τὸ μέσον καὶ εἶπεν· Εἰρήνη ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/026.yaml
  text: And after eight days, his disciples were inside again, and Thomas was with them. Jesus comes, though the doors had been shut, and stood in the midst and said, “Peace to you.”
translation:
  language: ar
  text: 'وبعد ثمانية أيام، كان تلاميذه في الداخل مرة أخرى، وكان توما معهم. فجاء يسوع وكانت الأبواب مغلقة، ووقف في الوسط وقال: «السلام لكم!»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεθ’ ἡμέρας ὀκτώ
  choice: بعد ثمانية أيام
  rationale: نقل مباشر للتعبير اليوناني مع إبقاء طريقة العد القديمة كما هي، من غير إضافة تفسير زمني غير منصوص عليه.
- source_word: ἔσω
  choice: في الداخل
  rationale: يحافظ على عدم تحديد المكان في الأصل، بدل افتراض اسم البيت أو الغرفة.
- source_word: ἔρχεται
  choice: فجاء
  rationale: المضارع التاريخي اليوناني يؤدي وظيفة سردية؛ والماضي هو الأسلوب العربي الطبيعي المتسق مع الفعلين التاليين «وقف» و«قال».
- source_word: τῶν θυρῶν κεκλεισμένων
  choice: مع أن الأبواب كانت مغلقة
  rationale: ينقل تركيب المضاف المطلق ودلالته الظرفية التنازلية الطبيعية في السياق، من دون بيان كيفية دخول يسوع.
- source_word: ἔστη εἰς τὸ μέσον
  choice: وقف في وسطهم
  rationale: صياغة عربية طبيعية؛ والضمير يوضح أن المقصود وسط المجتمعين، وهو مفهوم من السياق.
- source_word: Εἰρήνη ὑμῖν
  choice: السلام لكم!
  rationale: يحافظ على صيغة السلام الاسمية الموجزة وعلى مضمونها الذي قد يكون تحية وإعلان سلام معًا.
theological_decisions:
- issue: كيفية حضور يسوع مع كون الأبواب مغلقة
  choice: 'عدم تفسير الكيفية: «مع أن الأبواب كانت مغلقة»'
  alternative: إضافة أنه مر عبر الأبواب أو دخل بطريقة معجزية محددة
  rationale: النص يثبت إغلاق الأبواب وحضور يسوع، لكنه لا يشرح الآلية؛ لذلك تُصان المساحة التي يتركها الأصل.
- issue: القيمة الزمنية للمضارع التاريخي ἔρχεται
  choice: صيغة الماضي السردي العربية «فجاء»
  alternative: المضارع «يأتي» أو «يجيء»
  rationale: هذا قرار أسلوبي لا عقائدي؛ فالماضي أكثر طبيعية في السرد العربي ولا يغير ترتيب الحدث أو مضمونه.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة، بجمل طبيعية ومفردات شائعة. حُفظ الإيجاز السردي وعدم تحديد المكان أو كيفية دخول يسوع، ولم تُضف حواشٍ لعدم وجود حاجة نصية ملحّة.
