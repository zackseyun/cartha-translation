    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: أجاب
  rationale: الفعل العربي «أجاب» هو المقابل السردي الطبيعي لـἀποκρίνομαι، ويحافظ على معنى الرد دون توسع.
- source_word: Θωμᾶς
  choice: توما
  rationale: نُقل الاسم بصيغته العربية الكتابية الشائعة.
- source_word: εἶπεν αὐτῷ
  choice: قال له
  rationale: يحافظ على ضمير المفعول غير المباشر الصريح αὐτῷ من غير استبداله باسم يسوع، وهو غير مذكور هنا في اليونانية.
- source_word: Ὁ κύριός μου
  choice: ربي
  rationale: «الرب» يحفظ دلالة κύριος من جهة السيادة والوقار والثقل اللاهوتي، والضمير المتصل ينقل μου بصورة عربية طبيعية.
- source_word: ὁ θεός μου
  choice: إلهي
  rationale: ينقل θεός مع ضمير الملكية μου بوضوح، ويحافظ على الطابع الشخصي للاعتراف.
- source_word: καὶ
  choice: و
  rationale: تربط الواو اللقبين كما تفعل καὶ في الاعتراف اليوناني.
theological_decisions:
- issue: هل كلام توما خطاب مباشر ليسوع أم مجرد صيحة لا تُسند اللقبين إليه؟
  choice: 'خطاب مباشر ليسوع: «ربي وإلهي!»'
  alternative: اعتبار العبارة صيحة موجهة إلى الله لا إقرارًا مباشرًا بشأن يسوع
  rationale: يصرّح النص بأن توما «قال له» (αὐτῷ)، كما أن الاسمين المرفوعين المعرّفين بالأداة يمكن أن يؤديا وظيفة النداء في اليونانية الكوينِية. لذلك تُحفظ قوة الخطاب المباشر من غير تخفيف أو إضافة تفسيرية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعملت صيغة «ربي وإلهي» الطبيعية والموجزة، مع إبقاء «قال له» لإظهار جهة الخطاب وصون الدلالة الأصلية.
