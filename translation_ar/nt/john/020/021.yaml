  text: εἶπεν οὖν αὐτοῖς ⸂ὁ Ἰησοῦς⸃ πάλιν· Εἰρήνη ὑμῖν· καθὼς ἀπέσταλκέν με ὁ πατήρ, κἀγὼ πέμπω ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/021.yaml
  text: So Jesus said to them again[a], “Peace to you. As the Father has sent me, even so I am sending you.”
translation:
  language: ar
  text: 'فقال لهم يسوع أيضًا: «سلام لكم»[a]. «كما أرسلني الآب، كذلك أرسلكم أنا».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بحسب الصياغة التقليدية: «السلام عليكم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: فـ
  rationale: تربط الكلام بما سبقه بوصفه استمرارًا للمشهد، من غير إثقال العبارة بـ«لذلك» التي قد توحي باستنتاج منطقي أقوى من السياق.
- source_word: πάλιν
  choice: أيضًا
  rationale: تفيد أن يسوع كرر التحية الواردة في الآية السابقة، وهي صياغة عربية طبيعية هنا.
- source_word: Εἰρήνη ὑμῖν
  choice: سلام لكم
  rationale: تنقل العبارة الاسمية الموجزة ذات الصبغة السامية من غير إضافة فعل غير موجود في اليونانية.
- source_word: καθὼς
  choice: كما
  rationale: تحفظ المقارنة المباشرة بين إرسال الآب ليسوع وإرسال يسوع لتلاميذه.
- source_word: ἀπέσταλκέν
  choice: أرسلني
  rationale: الماضي العربي هو الأنسب طبيعيًا لحدث الإرسال المكتمل، ويبقى أثره المستمر مفهومًا من سياق التكليف الحاضر.
- source_word: ὁ πατήρ
  choice: الآب
  rationale: يحفظ اللقب المعرّف في النص اليوناني والتعبير اليوحناوي، من غير إدخال ضمير ملكية غير مصرح به.
- source_word: κἀγὼ
  choice: أنا أيضًا
  rationale: ينقل اقتران «وأنا» مع إبراز الضمير، ويبيّن طرف المقارنة من غير توسيع معناها.
- source_word: πέμπω
  choice: أرسلكم
  rationale: المضارع العربي في هذا السياق الإنشائي يفيد التكليف الجاري، وهو طبيعي وأقرب من صيغة مركبة مثل «أنا بصدد إرسالكم».
theological_decisions:
- issue: العلاقة بين إرسال الآب ليسوع وإرسال يسوع للتلاميذ
  choice: «كما أرسلني الآب، أرسلكم أنا أيضًا»
  alternative: «مثلما أرسلني الآب، هكذا أرسلكم»
  rationale: تحفظ الصياغة قياس الرسالتين والتكليف، من غير أن تفترض تطابقًا كاملًا في السلطة أو الكيفية أو الوظيفة، ومن غير إضافة تفسير عقائدي لا يصرح به النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدمت «سلام لكم» للمحافظة على إيجاز العبارة اليونانية الخالية من الفعل، مع إثبات البديل التقليدي في الحاشية.
