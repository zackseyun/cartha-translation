  source_fidelity: 'النص الرئيس ينقل عناصر اليونانية الأساسية بدقة: الاستئناف بـ«فـ»، والتكرار بـ«أيضًا»، والتحية الموجزة، وقياس إرسال التلاميذ بإرسال الآب ليسوع. لكن «أنا أيضًا» قد تُفهم أساسًا بمعنى الإضافة («أنا بدوري») أكثر من إبراز النتيجة المقابلة في البناء القياسي؛ و«كذلك ... أنا» أوضح في نقل قوة κἀγώ ضمن هذا التركيب.'
