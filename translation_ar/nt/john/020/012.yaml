  text: and she sees two angels in white sitting[a], one at the head and one at the feet[b], where the body of Jesus had been lying.
translation:
  language: ar
  text: وترى ملاكين في ثياب بيضاء[a] جالسين، أحدهما عند الرأس والآخر عند القدمين، حيث كان جسد يسوع راقدًا[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «في الأبيض». ويمكن ترجمتها أيضًا: «مرتديين ثيابًا بيضاء».'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا ترجمتها: «حيث كان جسد يسوع موضوعًا». تصف صيغة الفعل اليوناني الحالة التي كان عليها الجسد في ذلك الموضع.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θεωρεῖ
  choice: ترى
  rationale: يحافظ المضارع على حيوية المضارع السردي في اليونانية، والفاعل المؤنث مفهوم من السياق السابق دون حاجة إلى إضافة ضمير منفصل.
- source_word: ἀγγέλους
  choice: ملاكين
  rationale: السياق عند القبر واللباس الأبيض يدل على كائنين سماويين، لا على رسولين بشريين.
- source_word: ἐν λευκοῖς
  choice: في ثياب بيضاء
  rationale: العبارة اليونانية موجزة، وحرفيتها «في بياض»؛ ذِكر الثياب يجعل المعنى المقصود طبيعيًا وواضحًا بالعربية من غير تفصيل زائد.
- source_word: καθεζομένους
  choice: جالسين
  rationale: ينقل هيئة الملاكين كما يصفها اسم الفاعل اليوناني، من غير إضافة ظرف مكان غير ملفوظ به.
- source_word: ἕνα πρὸς τῇ κεφαλῇ καὶ ἕνα πρὸς τοῖς ποσίν
  choice: أحدهما عند الرأس والآخر عند القدمين
  rationale: تنقل «عند» دلالة القرب المكاني، ويشير الرأس والقدمان إلى طرفي الموضع الذي كان الجسد فيه.
- source_word: ὅπου
  choice: حيث
  rationale: مقابل عربي مباشر وموجز لظرف المكان الموصول.
- source_word: ἔκειτο
  choice: كان ... موضوعًا
  rationale: ينقل حالة الجسد المستمرة في ذلك الموضع قبل لحظة الرؤية، مع تجنب تحويل الفعل إلى مجرد حدث وضعٍ سابق.
- source_word: σῶμα τοῦ Ἰησοῦ
  choice: جسد يسوع
  rationale: «جسد» هو المقابل المعتاد والمحترم، والإضافة العربية تنقل المضاف إليه اليوناني بوضوح.
theological_decisions:
- issue: طبيعة ἀγγέλους في سياق القيامة
  choice: ملاكين سماويين
  alternative: رسولين أو مبعوثين بشريين
  rationale: مع أن اللفظة قد تعني «رسلًا»، فإن سياق القبر والهيئة البيضاء يرجح بوضوح الكائنات الملائكية، وهو حكم سياقي معجمي لا إضافة مذهبية.
- issue: القيمة الزمنية والحالية للفعل ἔκειτο
  choice: 'حالة سابقة مستمرة: كان الجسد موضوعًا'
  alternative: كان جسد يسوع موضوعًا هناك / كان قد وُضع
  rationale: صيغة الماضي الناقص تصف حالة الجسد في ذلك الموضع؛ وتحافظ الصياغة المختارة على هذه الحالة السابقة من غير أن تجعل النص يصرح بحدث الوضع نفسه.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ المضارع السردي في «ترى»، واستُعملت صيغة المثنى في «ملاكين» ثم «أحدهما... والآخر» بما يلائم الأسلوب العربي الطبيعي.
