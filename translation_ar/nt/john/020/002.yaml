  text: So she runs and comes to Simon Peter and to the other disciple[a], whom Jesus loved, and says to them, “They have taken the Lord out of the tomb[b], and we do not know where they have laid him.”
translation:
  language: ar
  text: 'فتركض وتأتي إلى سمعان بطرس وإلى التلميذ الآخر الذي كان يسوع يحبّه[a]، وتقول لهما: «أخذوا الرب من القبر، ونحن لا نعرف أين وضعوه[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'الفعل اليوناني هنا من φιλέω، ويمكن أن يبرز المودّة؛ ويمكن أيضًا ترجمة العبارة: «الذي كان يسوع يكنّ له المودّة».'
    reason: lexical_alternative
  - marker: b
    text: 'تقول مريم: «نحن لا نعرف»، محافظةً على صيغة المتكلم الجمع في اليونانية. وقد يفهم بعض القرّاء أنها تشمل نساء أخريات كنّ معها، لكن النص هنا لا يفسّر سبب استعمال الجمع.'
    reason: alternative_reading
lexical_decisions:
- source_word: τρέχει οὖν καὶ ἔρχεται
  choice: فتركض وتأتي
  rationale: يحافظ المضارعان على حيوية السرد التاريخي، وتؤدي الفاء معنى النتيجة والانتقال الذي تفيده οὖν بصورة طبيعية في العربية.
- source_word: πρὸς Σίμωνα Πέτρον καὶ πρὸς τὸν ἄλλον μαθητήν
  choice: إلى سمعان بطرس وإلى التلميذ الآخر
  rationale: «إلى» تعبّر طبيعيًا عن الحركة نحو شخص، و«التلميذ» هو المقابل المألوف لـ μαθητής في سياق الأناجيل.
- source_word: ὃν ἐφίλει ὁ Ἰησοῦς
  choice: الذي كان يسوع يحبّه
  rationale: تفيد صيغة الماضي الناقص محبةً مستمرة في الزمن الماضي، ويؤدي «كان... يحبّه» هذا المعنى دون إثقال الأسلوب.
- source_word: λέγει αὐτοῖς
  choice: وتقول لهما
  rationale: يُحفظ المضارع التاريخي، وتدل صيغة المثنى على أن الخطاب موجّه إلى بطرس والتلميذ الآخر.
- source_word: Ἦραν τὸν κύριον ἐκ τοῦ μνημείου
  choice: أخذوا الرب من القبر
  rationale: «أخذوا» تنقل الفعل المكتمل من غير تعيين فاعليه، و«القبر» هو المعنى السياقي الطبيعي لـ μνημεῖον، مع إبقاء «الرب» لقبًا تبجيليًا ليسوع.
- source_word: οὐκ οἴδαμεν
  choice: ونحن لا نعرف
  rationale: يُحفظ صراحةً ضمير المتكلمين الجمع في اليونانية، ولا يُحوَّل إلى المفرد رغم أن المتكلمة هي مريم.
- source_word: ποῦ ἔθηκαν αὐτόν
  choice: أين وضعوه
  rationale: «وضعوه» تؤدي معنى τίθημι هنا بوضوح وطبيعية، وتحافظ على الغموض في هوية الذين نقلوه.
theological_decisions:
- issue: ترجمة κύριος لقبًا ليسوع
  choice: الرب
  alternative: السيد
  rationale: «الرب» هو المقابل العربي المألوف للقب المسيحاني في هذا السياق، ولا يختزل اللفظ إلى مجرد معنى السيد أو المعلّم.
- issue: صيغة الجمع في οἴδαμεν
  choice: ونحن لا نعرف
  alternative: وأنا لا أعرف
  rationale: النص اليوناني يستعمل المتكلم الجمع صراحةً؛ لذلك يُحفظ الجمع من غير افتراض مَن يشملهم أو تسوية العبارة مع كون مريم هي المتكلمة.
