  text: τότε οὖν εἰσῆλθεν καὶ ὁ ἄλλος μαθητὴς ὁ ἐλθὼν πρῶτος εἰς τὸ μνημεῖον, καὶ εἶδεν καὶ ἐπίστευσεν·
base_translation:
  language: en
  yaml_path: translation/nt/john/020/008.yaml
  text: Then the other disciple[a], who had arrived at the tomb first, also went in[b], and he saw and believed.
translation:
  language: ar
  text: فدخل حينئذٍ التلميذ الآخر أيضًا، الذي كان قد وصل أولًا إلى القبر، فرأى وآمن.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'لا يذكر النص اليوناني صراحةً ما الذي آمن به؛ وقد اختلف المفسرون: هل آمن بقيامة يسوع، أم بما دلّ عليه المشهد أمامه، أم بالخبر السابق؟'
    reason: alternative_reading
lexical_decisions:
- source_word: τότε οὖν
  choice: فحينئذ
  rationale: تجمع بين تتابع الأحداث والدلالة الاستنتاجية الخفيفة التي تحملها οὖν، بصياغة عربية سردية طبيعية.
- source_word: εἰσῆλθεν
  choice: دخل
  rationale: المقابل العربي المباشر والطبيعي للفعل الدال على الدخول، ويغني عن شرح جهة الحركة.
- source_word: ὁ ἄλλος μαθητής
  choice: التلميذ الآخر
  rationale: «التلميذ» هو المقابل المألوف والدقيق لـ μαθητής في السياق اليوحناوي.
- source_word: ὁ ἐλθὼν πρῶτος εἰς τὸ μνημεῖον
  choice: وهو الذي وصل إلى القبر أولًا
  rationale: توضح العبارة أن وصوله سبق دخوله، وتحافظ على كونه أول من بلغ القبر.
- source_word: μνημεῖον
  choice: القبر
  rationale: يشير اللفظ هنا إلى موضع دفن يسوع، و«القبر» هو التعبير العربي الواضح والمألوف.
- source_word: καὶ εἶδεν
  choice: فرأى
  rationale: ينقل فعل الرؤية مباشرة، مع فاء تربط دخوله بما رآه في تسلسل سردي طبيعي.
- source_word: ἐπίστευσεν
  choice: آمن
  rationale: يحافظ على إطلاق الفعل في اليونانية من غير إضافة مفعول أو تحديد مضمون الإيمان.
theological_decisions:
- issue: مضمون إيمان التلميذ
  choice: 'إبقاء الفعل مطلقًا: «آمن»'
  alternative: آمن بأن يسوع قام؛ أو صدّق خبر مريم؛ أو صار مؤمنًا
  rationale: النص اليوناني لا يصرح بما آمن به، وتحديد المضمون يحسم توترًا تفسيريًا يتركه السياق مفتوحًا، ولا سيما بالنظر إلى الآية التالية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «فحينئذ» لنقل التعاقب مع الاستنتاج الخفيف، وأُبقي «آمن» بلا مفعول حفاظًا على غموض الأصل المقصود.
