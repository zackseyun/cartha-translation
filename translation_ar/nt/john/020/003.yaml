  rationale: صيغة الماضي من ἐξέρχομαι تدل على مغادرة مكان؛ و«خرج» تعبير عربي طبيعي يحفظ معنى الانطلاق إلى الخارج.
- source_word: οὖν
  choice: فـ
  rationale: الفاء تربط الحدث بما سبقه وتفيد التعقيب والنتيجة السردية بصورة طبيعية في العربية.
- source_word: ὁ Πέτρος
  choice: بطرس
  rationale: النقل العربي المعياري للاسم الشخصي Πέτρος.
- source_word: ὁ ἄλλος μαθητής
  choice: التلميذ الآخر
  rationale: «التلميذ» هو المقابل المعتاد لـ μαθητής في سياق الأناجيل، و«الآخر» يميزه من بطرس.
- source_word: ἤρχοντο
  choice: كانا في طريقهما
  rationale: تحفظ العبارة هيئة الماضي المستمر في الفعل اليوناني الناقص، وتلائم حركة الشخصين نحو مقصد في العربية الطبيعية.
- source_word: εἰς τὸ μνημεῖον
  choice: إلى القبر
  rationale: المقصود هو قبر يسوع، و«إلى» تدل على الحركة نحو الوجهة من غير أن توحي بأنهما دخلاه في هذه اللحظة.
