  source_fidelity: 'النص ينقل تسلسل الآية ومعانيها الأساسية بأمانة: اقتياد يسوع من عند قيافا إلى المقر الروماني، الوقت المبكر، امتناعهم عن الدخول اتقاءً للنجاسة الشعائرية، وغاية أكل الفصح. لكن «ليتمكّنوا» تضيف إيحاءً بالقدرة لا يظهر صراحة في فعل الغاية اليوناني φάγωσιν؛ والأدق والأبسط «لكي يأكلوا».'
