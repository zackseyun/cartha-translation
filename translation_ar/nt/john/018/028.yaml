source:
  edition: SBLGNT
  text: Ἄγουσιν οὖν τὸν Ἰησοῦν ἀπὸ τοῦ Καϊάφα εἰς τὸ πραιτώριον· ἦν δὲ πρωΐ· καὶ αὐτοὶ οὐκ εἰσῆλθον εἰς τὸ πραιτώριον, ἵνα μὴ μιανθῶσιν ⸀ἀλλὰ φάγωσιν τὸ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/028.yaml
  text: So they led Jesus from Caiaphas into the governor’s headquarters[a]. Now it was early morning. They themselves did not enter the headquarters, so that they would not be defiled[c][b], but could eat the Passover.
translation:
  language: ar
  text: فاقتادوا يسوعَ من عند قيافا إلى دار الحاكم[a]. وكان ذلك في الصباح الباكر. أمّا هم فلم يدخلوا دار الحاكم لئلّا يتنجّسوا[b]، بل لكي يأكلوا الفصح[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «البريتوريوم»، أي المقر الرسمي للحاكم الروماني ومكان إقامته ومقرّ القضاء.'
    reason: lexical_alternative
  - marker: b
    text: أي يصيروا في حال نجاسة شعائرية.
    reason: cultural_note
  - marker: c
    text: قد يُقصد بـ«أكل الفصح» عشاء الفصح نفسه، أو على نحو أوسع وجبات العيد أو الاحتفالات والممارسات المرتبطة بأيامه.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄγουσιν
  choice: فَساقوا
  rationale: المضارع التاريخي يُنقل بالماضي في السرد العربي الطبيعي، و«ساقوا» يلائم اقتياد يسوع وهو في قبضتهم.
- source_word: οὖν
  choice: فَـ
  rationale: تربط الفاء الحدث بما سبقه ربطًا سرديًا طبيعيًا من غير إثقال العبارة بـ«لذلك».
- source_word: ἀπὸ τοῦ Καϊάφα
  choice: من عند قيافا
  rationale: تعبير عربي طبيعي يدل على الانتقال من موضع قيافا أو حضرته، من غير إضافة مكان لم يصرّح به النص.
- source_word: πραιτώριον
  choice: دار الحاكم
  rationale: يدل اللفظ هنا على المقر الرسمي للحاكم الروماني ومكان إقامته وإجراء القضاء؛ و«دار الحاكم» واضحة وموجزة، مع بيان البديل في الحاشية.
- source_word: πρωΐ
  choice: في الصباح الباكر
  rationale: ينقل معنى الوقت المبكر من النهار من غير الجزم بأنه لحظة الفجر تحديدًا.
- source_word: αὐτοὶ
  choice: أمّا هم
  rationale: يحفظ توكيد الضمير والتباين بين اقتيادهم يسوع وامتناعهم هم عن الدخول.
- source_word: μιανθῶσιν
  choice: يتنجّسوا
  rationale: «يتنجّسوا» ينقل معنى صيرورتهم في حال نجاسة شعائرية، لا مجرد الاتساخ المادي.
- source_word: φάγωσιν τὸ πάσχα
  choice: يتمكّنوا من أكل الفصح
  rationale: يحفظ العبارة المصدرية كما هي ولا يحسم هل المقصود عشاء الفصح تحديدًا أم الأكل المرتبط بالعيد على نطاق أوسع، كما يبرز أن اجتناب النجاسة غايته إمكان الأكل.
- source_word: Καϊάφα
  choice: قيافا
  rationale: نقل صوتي عربي مستقر للاسم الشخصي.
- source_word: Ἰησοῦν
  choice: يسوع
  rationale: الصيغة العربية المستقرة للاسم الشخصي في سياق العهد الجديد.
theological_decisions:
- issue: مدلول «أكل الفصح» وعلاقته بالتسلسل الزمني للآلام في إنجيل يوحنا
  choice: الإبقاء على «أكل الفصح» من غير تقييده بعشاء الفصح وحده
  alternative: أكل عشاء الفصح؛ أو أكل ذبائح ووجبات العيد
  rationale: العبارة اليونانية لا تفصل بذاتها في نطاق الإشارة، وتحديدها في المتن من شأنه أن يحسم جدلًا زمنيًا ولاهوتيًا لا يحسمه هذا اللفظ وحده.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت «دار الحاكم» بدل النقل الصوتي الغامض في المتن، وحُفظ توكيد αὐτοὶ بصيغة «أمّا هم». وُضعت علامات الحواشي [a] و[b] و[c] عند الألفاظ التي تشرحها، بالترتيب.
