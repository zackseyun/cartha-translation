  terminology: «قيافا» و«يسوع» صيغتان عربيتان مستقرّتان، و«دار الحاكم» ترجمة مفهومة لـπραιτώριον مع توضيح مناسب في الحاشية. «يتنجّسوا» يحفظ المعنى الشعائري. تبقى «الفصح» غير مقيّدة، فلا تحسم المسألة الزمنية أو التفسيرية المتنازع عليها.
