  to: فاقتادوا يسوعَ من عند قيافا إلى دار الحاكم[a]. وكان ذلك في الصباح الباكر. أمّا هم فلم يدخلوا دار الحاكم لئلّا يتنجّسوا[b]، بل لكي يأكلوا الفصح[c].
  rationale: يحذف التنقيح الإيحاء الزائد بالقدرة في «ليتمكّنوا»، ويستبدله بفعل غاية مباشر يطابق اليونانية مع الحفاظ على عدم حسم مدلول «الفصح». كما يحسّن الفعل الافتتاحي إلى «فاقتادوا» ويضبط الحاشية لتعبّر بوضوح عن اتساع المرجع المحتمل من غير تقرير تفسير بعينه.
