source:
  edition: SBLGNT
  text: ἔστιν δὲ συνήθεια ὑμῖν ἵνα ἕνα ⸂ἀπολύσω ὑμῖν⸃ ἐν τῷ πάσχα· βούλεσθε οὖν ⸄ἀπολύσω ὑμῖν⸅ τὸν βασιλέα τῶν Ἰουδαίων;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/039.yaml
  text: But you have a custom that I release one man for you at the Passover[a]. So do you want me to release to you the King of the Jews?
translation:
  language: ar
  text: ولكنْ لكم عادةٌ أن أُطلِق لكم واحدًا في الفصح. أفتريدون إذًا أن أُطلِق لكم ملك اليهود[a]؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «ملك أهل اليهودية». قد تدل الكلمة اليونانية على اليهود أو على أهل اليهودية بحسب السياق؛ ويبدو أنها هنا جزء من اللقب الثابت المستعمل في رواية الآلام.
    reason: alternative_reading
lexical_decisions:
- source_word: συνήθεια
  choice: عادة
  rationale: تنقل معنى العرف أو الممارسة المستقرة، وهي صياغة عربية واضحة وطبيعية في هذا السياق القضائي والاحتفالي.
- source_word: ἵνα ἕνα ἀπολύσω ὑμῖν
  choice: أن أُطلِق لكم واحدًا
  rationale: تحافظ على عدم تعيين ἕνα في اليونانية، بينما يدل السياق على سجين واحد، وتؤدي أداة الجر «لكم» معنى المستفيد.
- source_word: ἀπολύω
  choice: أُطلِق
  rationale: فعل مناسب لإخلاء سبيل سجين، ويحافظ على الاتساق في موضعي الفعل في الآية.
- source_word: ἐν τῷ πάσχα
  choice: في الفصح
  rationale: تعبير عربي موجز وطبيعي يدل على زمن العيد، من غير حسم زائد بين «في» و«أثناء».
- source_word: βούλεσθε οὖν
  choice: أفتريدون إذًا
  rationale: «تريدون» واضحة ومعاصرة، و«إذًا» تحفظ الاستنتاج الذي تفيده οὖν، مع همزة الاستفهام.
- source_word: τὸν βασιλέα τῶν Ἰουδαίων
  choice: ملك اليهود
  rationale: يحفظ اللقب المتكرر في رواية الآلام، وينقل Ἰουδαίων بالمعنى التاريخي الشائع هنا، مع إثبات الاحتمال الإقليمي في الحاشية.
theological_decisions:
- issue: دلالة Ἰουδαίων في لقب τὸν βασιλέα τῶν Ἰουδαίων
  choice: ملك اليهود
  alternative: ملك أهل اليهودية
  rationale: تؤدي «اليهود» صيغة اللقب والاتهام الملكي المعروفة في رواية الآلام، من غير قصرها على الانتماء الإقليمي؛ ولأن اللفظة اليونانية قد تدل بحسب السياق على اليهود أو أهل اليهودية، أُبقي البديل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «ولكنْ» لإظهار الانتقال التقابلي، و«واحدًا» للمحافظة على إيجاز الأصل وعدم إضافة «رجلًا» أو «سجينًا» صراحةً، مع بقاء المعنى مفهومًا من السياق.
