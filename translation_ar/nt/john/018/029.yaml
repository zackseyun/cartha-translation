  text: ἐξῆλθεν οὖν ὁ Πιλᾶτος ⸀ἔξω πρὸς αὐτοὺς καὶ ⸀φησίν· Τίνα κατηγορίαν φέρετε ⸀κατὰ τοῦ ἀνθρώπου τούτου;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/029.yaml
  text: So Pilate went outside to them and said, “What accusation do you bring against this man?”
translation:
  language: ar
  text: 'فخرج بيلاطس إليهم وقال: «ما التهمة التي تقدمونها ضد هذا الرجل؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλθεν ... ἔξω
  choice: خرج
  rationale: الفعل مع الظرف يؤكد انتقال بيلاطس من الداخل إلى الخارج. «خرج» يؤدي المعنى المكاني طبيعيًا بالعربية، ولا حاجة إلى تكرار «إلى الخارج» لأن الخروج يتضمنه.
- source_word: οὖν
  choice: فـ
  rationale: الفاء تصل هذا الحدث بما سبقه وتؤدي معنى الاستمرار والنتيجة السردية بإيجاز طبيعي.
- source_word: ὁ Πιλᾶτος
  choice: بيلاطس
  rationale: الاسم المعروف في التقليد العربي، وحذف أداة التعريف قبل الاسم هو الأسلوب العربي الطبيعي.
- source_word: πρὸς αὐτούς
  choice: إليهم
  rationale: تدل πρός مع النصب هنا على الحركة نحو أشخاص للقائهم.
- source_word: φησίν
  choice: قال
  rationale: مع أن اليونانية تستعمل المضارع التاريخي، فالماضي أنسب للسرد العربي المتصل ويحفظ الحدث دون تكلف.
- source_word: Τίνα κατηγορίαν
  choice: ما التهمة
  rationale: κατηγορία لفظ قضائي يدل على اتهام أو تهمة؛ و«التهمة» واضحة وموجزة في سياق الاستجواب القانوني.
- source_word: φέρετε
  choice: تقدمونها
  rationale: يحمل φέρω هنا معنى تقديم التهمة رسميًا؛ والضمير يعود بوضوح إلى «التهمة» ويجعل العبارة عربية سليمة.
- source_word: κατὰ τοῦ ἀνθρώπου τούτου
  choice: ضد هذا الرجل
  rationale: κατά مع المضاف إليه ذات دلالة قضائية بمعنى «ضد»، وἄνθρωπος يشير هنا إلى رجل بعينه.
