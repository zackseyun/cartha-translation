base_translation:
  language: en
  yaml_path: translation/nt/john/018/030.yaml
  text: They answered and said to him[a], “If this man were not an evildoer, we would not have handed him over to you.”
translation:
  language: ar
  text: 'فأجابوا وقالوا له: «لو لم يكن هذا الرجل يفعل شرًّا[a]، لما سلَّمناه إليك».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فاعلَ شرّ».'
    reason: بديل اسمي ممكن للعبارة اليونانية، مع أن المتن يحفظ قوتها الفعلية بصورة أوضح.
lexical_decisions:
- source_word: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ
  choice: فأجابوا وقالوا له
  rationale: يحفظ الفعلين في الصيغة السردية اليونانية، مع تعبير عربي واضح وطبيعي.
- source_word: Εἰ μὴ ἦν
  choice: لو لم يكن
  rationale: ينقل الشرط المخالف للواقع بوضوح، ويتوافق مع جواب الشرط «لما سلَّمناه».
- source_word: οὗτος
  choice: هذا الرجل
  rationale: تعبير عربي طبيعي يحفظ الإشارة ذات النبرة المتباعدة من غير أن يضيف ازدراءً غير صريح.
- source_word: κακὸν ποιῶν
  choice: يفعل شرًّا
  rationale: يحفظ القوة الفعلية لاسم الفاعل ποιῶν وعمومية الاتهام، ولا يحوله إلى وصف قانوني محدد.
- source_word: οὐκ ἄν σοι παρεδώκαμεν αὐτόν
  choice: لما سلَّمناه إليك
  rationale: ينقل جواب الشرط المخالف للواقع، ويؤدي معنى التسليم إلى السلطة في هذا السياق القضائي بعبارة عربية موجزة.
theological_decisions:
- issue: طبيعة اتهام رؤساء اليهود ليسوع
  choice: يفعل شرًّا
  alternative: شريرًا أو مجرمًا
  rationale: العبارة اليونانية عامة وتصف فعل الشر، ولا تقدم تهمة قانونية محددة؛ لذلك أبقت الصياغة الاتهام عامًا ولم تضف توصيفًا قضائيًا.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة. حُفظت الصيغة السردية المزدوجة «فأجابوا وقالوا»، واستُخدم بناء «لو... لما» الطبيعي للتعبير عن الشرط المخالف للواقع.
