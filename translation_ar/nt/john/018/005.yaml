  source_fidelity: 'النص العربي ينقل عناصر اليونانية كلها بأمانة: جوابهم «يسوع الناصري»، وجواب يسوع المقتضب Ἐγώ εἰμι بصيغة «أنا هو»، ثم الإشارة إلى يهوذا بوصفه الذي يسلّمه وكونه واقفًا معهم. ويحافظ «أنا هو» على الإيجاز والاحتمال الدلالي في الأصل، دون أن يفرض التوسيع التفسيري الإنجليزي «أنا هو المقصود».'
