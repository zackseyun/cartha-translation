base_translation:
  language: en
  yaml_path: translation/nt/john/018/005.yaml
  text: They answered him, “Jesus the Nazarene.” He said to them, “I am he.” Now Judas, who was betraying him, was also standing with them.
translation:
  language: ar
  text: 'أجابوه: «يسوع الناصري». فقال لهم: «أنا هو». وكان يهوذا الذي يسلّمه واقفًا أيضًا معهم.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰησοῦν τὸν Ναζωραῖον
  choice: يسوع الناصري
  rationale: ينقل اللقب الجغرافي بصياغة عربية طبيعية ومباشرة.
- source_word: Ἐγώ εἰμι
  choice: أنا هو
  rationale: يحافظ على الصياغة المقتضبة ذات الدلالة المفتوحة، مع إضمار المرجع المفهوم من السؤال والسياق، بدل توسيعها تفسيريًا.
- source_word: ὁ παραδιδοὺς αὐτόν
  choice: الذي يسلّمه
  rationale: اسم الفاعل في الزمن الحاضر يصوّر يهوذا وهو قائم بدور تسليم يسوع في هذا المشهد، لذلك استُعمل المضارع.
- source_word: εἱστήκει
  choice: كان ... واقفًا
  rationale: ينقل معنى الماضي التام الدال على الحالة القائمة في ذلك الوقت بصياغة عربية سلسة.
theological_decisions:
- issue: احتمال الصلة بين Ἐγώ εἰμι وصيغة «أنا هو» اللاهوتية في إنجيل يوحنا
  choice: أنا هو
  alternative: أنا المطلوب / أنا يسوع
  rationale: اختيرت صياغة قريبة من الأصل لا تحسم ما إذا كانت العبارة مجرد تعريف بالنفس أم تحمل صدى لاهوتيًا أوسع؛ البدائل التفسيرية تضيق هذا الاحتمال.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة؛ حُفظ الإيجاز والتتابع السردي في الأصل، واستُخدم «يسلّمه» بدل تعبير أشد تفسيرًا مثل «يخونه».
