  text: λέγει αὐτῷ ὁ Πιλᾶτος· Τί ἐστιν ἀλήθεια; Καὶ τοῦτο εἰπὼν πάλιν ἐξῆλθεν πρὸς τοὺς Ἰουδαίους, καὶ λέγει αὐτοῖς· Ἐγὼ οὐδεμίαν ⸂εὑρίσκω ἐν αὐτῷ αἰτίαν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/038.yaml
  text: Pilate said to him[a], “What is truth?” After saying this, he went out again to the Jews and said to them, “I find no case against him.”
translation:
  language: ar
  text: 'قال له بيلاطس: «ما هو الحق؟» وبعدما قال هذا، خرج ثانيةً إلى اليهود[a] وقال لهم: «لا أجد عليه أيَّ تهمة».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «قادة اليهود». قد تشير عبارة «اليهود» في إنجيل يوحنا، بحسب السياق، إلى السلطات اليهودية أو إلى الجماعة الممثِّلة التي كانت تعارض يسوع، لا إلى جميع اليهود.'
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Πιλᾶτος
  choice: قال له بيلاطس
  rationale: المضارع اليوناني هنا مضارع تاريخي، والماضي هو الأسلوب الطبيعي في السرد العربي.
- source_word: Τί ἐστιν ἀλήθεια;
  choice: ما هو الحق؟
  rationale: نُقلت ἀλήθεια بلا زيادة تعريف تفسيري، و«الحق» هو المقابل العربي الطبيعي الذي يحتمل المعنى العام أو الفلسفي.
- source_word: Καὶ τοῦτο εἰπὼν
  choice: وبعدما قال هذا
  rationale: ينقل بوضوح سبق قول بيلاطس لخروجه، وهو مدلول اسم الفاعل اليوناني في السياق.
- source_word: πάλιν ἐξῆλθεν
  choice: خرج ثانيةً
  rationale: يحفظ معنى تكرار الخروج في πάλιν بصياغة عربية طبيعية.
- source_word: πρὸς τοὺς Ἰουδαίους
  choice: إلى اليهود
  rationale: يحافظ المتن على المقابل المباشر للفظ اليوناني، مع بيان الاحتمال السياقي الأضيق في الحاشية.
- source_word: καὶ λέγει αὐτοῖς
  choice: وقال لهم
  rationale: المضارع التاريخي نُقل بالماضي بما يلائم السرد العربي.
- source_word: Ἐγὼ οὐδεμίαν εὑρίσκω ἐν αὐτῷ αἰτίαν
  choice: لا أجد عليه أيَّ تهمة
  rationale: αἰτία في هذا السياق القضائي تدل على التهمة أو الدعوى، و«عليه» تعبير عربي موجز وطبيعي عن إسناد التهمة إليه.
theological_decisions:
- issue: مدلول Ἰουδαίοις في رواية آلام يسوع عند يوحنا
  choice: اليهود في المتن، مع حاشية تذكر «قادة اليهود» بوصفه احتمالًا سياقيًا
  alternative: قادة اليهود؛ اليهودية/أهل اليهودية
  rationale: يحافظ المتن على اللفظ الصريح في الأصل، بينما تمنع الحاشية حمله بالضرورة على جميع أفراد الشعب اليهودي، إذ قد يشير في هذا السياق إلى السلطات أو جماعة المتهمين الحاضرة.
translation_notes:
  register: 'عربية فصحى حديثة واضحة ومهيبة، مع صياغة سردية طبيعية ومصطلح قضائي مفهوم. ينبغي أن يظهر مؤشر الحاشية مرة واحدة بعد «اليهود»؛ أُدرجت النقطة الختامية قبل المؤشر الأخير في النص المقدم آليًا، ويُعتمد في النشر المتن: «... إلى اليهود[a] وقال لهم: «لا أجد عليه أيَّ تهمة».»'
