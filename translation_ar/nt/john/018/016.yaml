  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος εἱστήκει πρὸς τῇ θύρᾳ ἔξω. ἐξῆλθεν οὖν ὁ μαθητὴς ὁ ἄλλος ⸀ὁ γνωστὸς ⸂τοῦ ἀρχιερέως⸃ καὶ εἶπεν τῇ θυρωρῷ καὶ εἰσήγαγεν τὸν Πέτρον.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/016.yaml
  text: But Peter was standing outside at the door[a]. So the other disciple, who was known to the high priest[b], went out and spoke to the doorkeeper and brought Peter in.
translation:
  language: ar
  text: أَمَّا بطرس فكان واقفًا في الخارج عند الباب. فخرج التلميذ الآخر، الذي كان معروفًا لدى رئيس الكهنة[a]، وكلَّم حارسة الباب[b]، وأدخل بطرس.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الذي كان من معارف رئيس الكهنة». لا تحدد اليونانية مدى قرب العلاقة بينهما.
    reason: lexical_alternative
  - marker: b
    text: أو «حارسة المدخل». يدل اللفظ اليوناني على المرأة المكلَّفة بحراسة موضع الدخول.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἱστήκει
  choice: كان واقفًا
  rationale: ينقل صيغة الماضي التام ذات الدلالة الاستمرارية هنا، فيصف وضع بطرس القائم آنذاك من غير مبالغة في تحديد مدة وقوفه.
- source_word: πρὸς τῇ θύρᾳ ἔξω
  choice: في الخارج عند الباب
  rationale: 'يحفظ عنصري العبارة: وجود بطرس خارج المكان ووقوفه عند المدخل. واختير «الباب» لأنه المعنى الأساسي لـ θύρα.'
- source_word: ὁ μαθητὴς ὁ ἄλλος
  choice: التلميذ الآخر
  rationale: «التلميذ» هو المقابل العربي الطبيعي المتسق مع الاستعمال الإنجيلي لـ μαθητής، ويحفظ معنى التبعية والتعلُّم.
- source_word: ὁ γνωστὸς τοῦ ἀρχιερέως
  choice: الذي كان معروفًا لدى رئيس الكهنة
  rationale: صياغة مباشرة تحفظ إبهام γνωστός بشأن طبيعة العلاقة ومدى قربها، فلا تجعل التلميذ صديقًا حميمًا ولا مجرد شخص سمع به رئيس الكهنة.
- source_word: ἀρχιερεύς
  choice: رئيس الكهنة
  rationale: التعبير العربي المألوف والدقيق للمنصب الكهنوتي اليهودي المقصود في السياق.
- source_word: τῇ θυρωρῷ
  choice: حارسة الباب
  rationale: يدل θυρωρός على الشخص المكلَّف بحراسة المدخل، وتُظهر أداة التعريف المؤنثة في اليونانية أن القائم بهذه المهمة امرأة، ولذلك صُرِّح بالتأنيث في العربية.
- source_word: εἶπεν τῇ θυρωρῷ
  choice: كلَّم حارسة الباب
  rationale: لأن النص لا يورد كلامًا مباشرًا، فالفعل «كلَّم» طبيعي في العربية وأدق سياقيًا من «قال لحارسة الباب» من دون ذكر المقول.
- source_word: εἰσήγαγεν τὸν Πέτρον
  choice: أدخل بطرس
  rationale: ينقل الفعل εἰσάγω بإيجاز ووضوح، ويدل على تمكين بطرس من الدخول من غير إضافة كيفية لم يذكرها النص.
theological_decisions: []
translation_notes:
  register: صياغة عربية فصحى معاصرة، واضحة ووقورة. استُخدم «أَمَّا» لإبراز الانتقال المقابِل إلى بطرس، وربطت الفاء خروج التلميذ الآخر بما سبقه على نحو طبيعي. حُفظ إبهام طبيعة معرفة التلميذ برئيس الكهنة، مع إظهار جنس حارسة الباب الذي تدل عليه الصيغة اليونانية.
