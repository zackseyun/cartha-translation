  text: ἦν δὲ Καϊάφας ὁ συμβουλεύσας τοῖς Ἰουδαίοις ὅτι συμφέρει ἕνα ἄνθρωπον ⸀ἀποθανεῖν ὑπὲρ τοῦ λαοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/014.yaml
  text: Caiaphas was the one who had advised the Jews that it was better for one man to die for the people[a][b].
translation:
  language: ar
  text: وكان قيافا هو الذي أشار على اليهود[a] بأنه من الأفضل أن يموت رجل واحد من أجل الشعب[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «قادة اليهود» أو «أهل اليهودية»، بحسب فهم المقصود بعبارة «اليهود» في سياق إنجيل يوحنا.
    reason: alternative_reading
  - marker: b
    text: أو «نيابةً عن الشعب»؛ وقد تحمل العبارة في السياق أيضًا إيحاءً تمثيليًا أو ذبيحيًا.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ
  choice: وكان
  rationale: تنقل الواو الاستئنافية مع كان الربط السردي الخفيف الذي تؤديه δέ، من غير المبالغة في معنى الاستدراك أو إضافة ظرف زمني صريح.
- source_word: Καϊάφας
  choice: قيافا
  rationale: نقل صوتي للاسم وفق الصيغة العربية الكتابية الشائعة.
- source_word: ὁ συμβουλεύσας
  choice: هو الذي أشار
  rationale: تفيد الصيغة الموصولة تعريف قيافا بالفعل السابق المنسوب إليه؛ و«أشار على» تعبير عربي طبيعي للمشورة في هذا السياق.
- source_word: τοῖς Ἰουδαίοις
  choice: اليهود
  rationale: يحافظ على اللفظ اليوناني من غير تضييق صريح إلى القادة أو أهل اليهودية، مع بيان الاحتمالات السياقية في الحاشية.
- source_word: ὅτι συμφέρει
  choice: بأنه من الأفضل
  rationale: ينقل معنى النفع أو الملاءمة بصياغة عربية واضحة وطبيعية تلائم سياق المداولة السياسية.
- source_word: ἕνα ἄνθρωπον
  choice: رجل واحد
  rationale: يحافظ على العدد المفرد وعلى الإشارة المذكرة المحددة في السياق.
- source_word: ἀποθανεῖν
  choice: أن يموت
  rationale: مقابل مباشر وطبيعي للمصدر اليوناني.
- source_word: ὑπὲρ τοῦ λαοῦ
  choice: من أجل الشعب
  rationale: تعبير عربي موجز يحتمل معنى النفع والنيابة، من غير حسم الدلالة في معنى بدلي صريح.
- source_word: λαοῦ
  choice: الشعب
  rationale: هو المقابل الأدق لـλαός هنا، بخلاف «الأمة» التي تقابل ἔθνος في السياق الأوسع من يوحنا 11.
theological_decisions:
- issue: الدلالة المحتملة للنيابة أو الكفارة في ὑπὲρ τοῦ λαοῦ
  choice: من أجل الشعب
  alternative: نيابةً عن الشعب؛ عوضًا عن الشعب
  rationale: قد تدل ὑπέρ على المنفعة أو النيابة، وقد تحمل في سياق يوحنا إيحاءً ذبيحيًا أو بدليًا. تحافظ الصياغة المختارة على هذا التوتر من غير إدخال تقرير عقائدي أكثر صراحة مما يقوله النص.
- issue: مرجع τοῖς Ἰουδαίοις في استعمال يوحنا
  choice: اليهود
  alternative: قادة اليهود؛ أهل اليهودية
  rationale: لا يضيف النص اليوناني قيدًا يحدد الجماعة، لذلك يحافظ المتن على اللفظ العام، بينما تعرض الحاشية الاحتمالات السياقية الحقيقية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حُفظ الربط السردي في «وكان»، وتُركت عبارتا «اليهود» و«من أجل الشعب» على اتساعهما الدلالي، مع توضيح البدائل في الحواشي دون حسم الخلاف التفسيري.
