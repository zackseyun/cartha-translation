  text: Ὁ οὖν ἀρχιερεὺς ἠρώτησεν τὸν Ἰησοῦν περὶ τῶν μαθητῶν αὐτοῦ καὶ περὶ τῆς διδαχῆς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/019.yaml
  text: So the high priest questioned Jesus about his disciples and about his teaching[a].
translation:
  language: ar
  text: فسأل رئيس الكهنة يسوع عن تلاميذه وعن تعليمه.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فاستجوب رئيس الكهنة يسوع». يمكن أن يعني الفعل اليوناني «سأل» أو «استجوب»، والسياق الرسمي يسمح بالمعنى الثاني.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: فـ
  rationale: تربط الجملة بما سبق ربطًا سرديًا أو استنتاجيًا خفيفًا، وهي طبيعية في العربية المعاصرة من غير مبالغة في بيان علاقة منطقية حاسمة.
- source_word: ἀρχιερεὺς
  choice: رئيس الكهنة
  rationale: الترجمة العربية المألوفة والدقيقة للمنصب اليهودي بصيغة المفرد المعرّف، من غير استبدال اللقب باسم حنّان أو محاولة التوفيق التاريخي داخل المتن.
- source_word: ἠρώτησεν
  choice: سأل
  rationale: الفعل اليوناني يحتمل السؤال والاستجواب. اختير «سأل» لأنه عربي واضح وطبيعي ويحافظ على سعة الدلالة، مع إثبات البديل السياقي في الحاشية.
- source_word: περὶ
  choice: عن
  rationale: تؤدي معنى موضوع السؤال بوضوح، وتلائم التكرار في «عن تلاميذه وعن تعليمه».
- source_word: μαθητῶν
  choice: تلاميذه
  rationale: تحفظ علاقة التلميذ بالمعلّم، وهي المقابل الإنجيلي العربي المستقر والأدق من «أتباعه» هنا.
- source_word: διδαχῆς
  choice: تعليمه
  rationale: لفظ واضح ومعاصر ينقل مضمون ما كان يسوع يعلّمه، ولا يحمّل النص إيحاءات اصطلاحية لاحقة قد يحملها لفظ «عقيدته».
- source_word: αὐτοῦ
  choice: ـه
  rationale: أُلحقت علامة الملكية بكل من «تلاميذه» و«تعليمه»، ومرجعها يسوع في الموضعين.
theological_decisions:
- issue: لقب ἀρχιερεύς في سياق يَرِد فيه حنّان، مع أن قيافا كان رئيس الكهنة المعترف به رسميًا لدى الرومان
  choice: رئيس الكهنة
  alternative: حنّان رئيس الكهنة؛ أو كبير الكهنة
  rationale: يُترجم اللقب اليوناني كما ورد، من غير إدخال اسم تفسيري أو تسوية تاريخية في المتن، وبذلك تُحفظ طريقة العرض السردي عند يوحنا.
- issue: درجة القوة القضائية في ἠρώτησεν
  choice: سأل، مع ذكر «استجوب» في الحاشية
  alternative: استجوب
  rationale: لا يفرض الفعل وحده معنى الاستجواب الرسمي، وإن كان السياق يسمح به؛ لذلك يحفظ المتن المعنى الأوسع وتعرض الحاشية القراءة السياقية الأقوى.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة، بصياغة موجزة تحافظ على تكرار «عن» في الأصل وعلى الغموض المعجمي في فعل السؤال من خلال الحاشية.
