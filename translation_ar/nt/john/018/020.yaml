base_translation:
  language: en
  yaml_path: translation/nt/john/018/020.yaml
  text: Jesus answered him[a], “I have spoken openly to the world. I always taught in the synagogue and in the temple, where all the Jews gather[b], and I said nothing in secret.”
translation:
  language: ar
  text: 'أجابه يسوع: «لقد تكلّمتُ إلى العالم علانيةً. وكنتُ دائمًا أعلّم في المجمع وفي الهيكل[a]، حيث يجتمع اليهود جميعًا[b]، ولم أقل شيئًا في الخفاء».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: في ساحات الهيكل أو ضمن مجمّع الهيكل؛ فاللفظ اليوناني يشير إلى مجمّع الهيكل، لا إلى المقدس الداخلي وحده.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أن تُترجم أيضًا: «الشعب اليهودي كله»، وقد تعني الكلمة اليونانية في بعض سياقات يوحنا «أهل اليهودية». ويتحدد معناها بحسب السياق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησίᾳ
  choice: علانيةً
  rationale: يفيد السياق الكلام العلني غير المستور، في مقابلة «في الخفاء»، من غير أن يُحمَّل اللفظ هنا معنى الجرأة وحدها.
- source_word: λελάληκα
  choice: لقد تكلّمتُ
  rationale: تحافظ صيغة الماضي المقترن بـ«لقد» على صلة كلام يسوع السابق بالموقف الحاضر، بما يلائم دلالة صيغة التمام اليونانية.
- source_word: τῷ κόσμῳ
  choice: إلى العالم
  rationale: يحفظ التعبير اللفظ اليوحناوي «العالم» واتساعه، بدل اختزاله في «الجمهور».
- source_word: πάντοτε
  choice: دائمًا
  rationale: ترجمة زمنية مباشرة وطبيعية تدل على اعتياد التعليم العلني.
- source_word: ἐδίδαξα
  choice: كنتُ أعلّم
  rationale: صياغة عربية طبيعية تُبرز الممارسة المعتادة التي يوضحها «دائمًا»، من غير تغيير مضمون الفعل.
- source_word: ἐν συναγωγῇ
  choice: في المجمع
  rationale: يحافظ على المفرد اليوناني الذي يمكن أن يُستعمل استعمالًا عامًا للدلالة على موضع الاجتماع والتعليم اليهودي.
- source_word: ἐν τῷ ἱερῷ
  choice: في الهيكل
  rationale: «الهيكل» هو المقابل العربي المألوف، مع إيضاح أن اللفظ اليوناني يشمل مجمّع الهيكل لا المقدس الداخلي وحده.
- source_word: πάντες οἱ Ἰουδαῖοι
  choice: اليهود جميعًا
  rationale: ترجمة مباشرة تلائم هنا سياق الاجتماع العام في المجمع والهيكل، مع إبقاء البدائل الدلالية في الحاشية.
- source_word: συνέρχονται
  choice: يجتمع
  rationale: ينقل معنى الالتقاء والاجتماع المشترك بعبارة عربية واضحة.
- source_word: ἐν κρυπτῷ
  choice: في الخفاء
  rationale: يحفظ المقابلة الصريحة بين الكلام العلني والكلام الخفي.
- source_word: ἐλάλησα οὐδέν
  choice: لم أقل شيئًا
  rationale: تعبير عربي فصيح وطبيعي ينقل النفي المؤكد من غير ركاكة.
- source_word: ἀπεκρίθη αὐτῷ
  choice: أجابه
  rationale: صياغة سردية موجزة وطبيعية تجمع الفعل ومفعوله في العربية.
theological_decisions:
- issue: مدلول Ἰουδαῖοι في إنجيل يوحنا
  choice: اليهود جميعًا
  alternative: الشعب اليهودي كله؛ أو جميع أهل اليهودية في بعض السياقات
  rationale: اللفظ اليوحناوي يتغير مدلوله بحسب السياق؛ وقد يشير إلى اليهود عمومًا أو أهل اليهودية أو بعض القيادات. يشير ذكر المجمع والهيكل هنا إلى سياق الاجتماع الديني العام، ولذلك أُبقيت الترجمة المباشرة مع توثيق الاحتمال الدلالي، من غير تضييقها على السلطات أو تحميلها إيحاءً معاديًا لليهود.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظت المقابلة البلاغية بين «علانيةً» و«في الخفاء»، واستُعمل «العالم» للمحافظة على الأسلوب اليوحناوي. وُضعت علامتا الحاشيتين عند اللفظين اللذين تفسرانهما مباشرة، تصحيحًا لعدم اتساق موضع العلامة الأولى في طبقة الاستشارة الإنجليزية.
