  terminology: الأسماء «حَنّان» و«قيافا» والصيغة «رئيس الكهنة» منسجمة مع الاستعمال العربي الكتابي المألوف. وجملة الصلة «الذي كان رئيس الكهنة» تعود بوضوح إلى قيافا، كما في اليونانية.
