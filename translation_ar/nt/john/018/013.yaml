  text: καὶ ⸀ἤγαγον πρὸς Ἅνναν πρῶτον· ἦν γὰρ πενθερὸς τοῦ Καϊάφα, ὃς ἦν ἀρχιερεὺς τοῦ ἐνιαυτοῦ ἐκείνου·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/013.yaml
  text: And they led him first to Annas, for he was the father-in-law of Caiaphas, who was high priest that year.
translation:
  language: ar
  text: واقتادوه أولًا إلى حَنّان، لأنه كان حَمَا قيافا، الذي كان رئيس الكهنة في تلك السنة.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤγαγον
  choice: اقتادوه
  rationale: يفيد الفعل ἄγω القيادة أو الإحضار، و«اقتادوه» يلائم سياق نقل يسوع وهو رهن الاعتقال، مع إظهار المفعول به المفهوم من السياق.
- source_word: πρὸς Ἅνναν
  choice: إلى حَنّان
  rationale: تدل πρός مع النصب هنا على الحركة باتجاه شخص، فالصياغة المباشرة هي «إلى حَنّان».
- source_word: πρῶτον
  choice: أولًا
  rationale: تأتي الكلمة ظرفًا للدلالة على الترتيب، أي إن حَنّان كان الوجهة الأولى.
- source_word: πενθερὸς
  choice: حَمَا
  rationale: تدل الكلمة تحديدًا على والد الزوجة، و«حَمَا» هي المقابل العربي الدقيق والموجز.
- source_word: ἀρχιερεὺς
  choice: رئيس الكهنة
  rationale: هذا هو المقابل العربي المألوف والدقيق للمنصب الكهنوتي اليهودي الأعلى.
- source_word: τοῦ ἐνιαυτοῦ ἐκείνου
  choice: في تلك السنة
  rationale: تنقل العبارة التحديد الزمني بصياغة عربية طبيعية من غير تكلف حرفي.
- source_word: Ἅνναν
  choice: حَنّان
  rationale: نُقل الاسم الشخصي بصيغته العربية الكتابية الشائعة.
- source_word: Καϊάφα
  choice: قيافا
  rationale: نُقل الاسم الشخصي بصيغته العربية الكتابية الشائعة.
theological_decisions:
- issue: مرجع عبارة «الذي كان رئيس الكهنة في تلك السنة»
  choice: تعود جملة الصلة على قيافا.
  alternative: قد تُفهم خطأً على أنها تعود على حَنّان إذا أُسيئت صياغة العربية.
  rationale: الضمير الموصول اليوناني ὃς مذكر مفرد، وأقرب سوابقه Καϊάφα، فتعود الجملة طبيعيًا على قيافا. حافظت الصياغة العربية على هذا الارتباط من غير إدخال غموض غير موجود في الأصل.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «اقتادوه» لإبراز النقل تحت الحراسة، و«حَمَا» للدقة القرابية، مع الحفاظ على ترتيب الجملة وتعيين مرجع جملة الصلة.
