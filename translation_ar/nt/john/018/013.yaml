  source_fidelity: 'النص يطابق اليونانية بدقة: «واقتادوه» ينقل دلالة ἤγαγον في سياق الاحتجاز، و«أولًا» يحفظ ترتيب πρῶτον، و«إلى حَنّان» ينقل اتجاه πρὸς Ἅνναν. كما أن «حَمَا قيافا» يعبّر بدقة عن πενθερὸς τοῦ Καϊάφα، و«رئيس الكهنة في تلك السنة» ينقل ἀρχιερεὺς τοῦ ἐνιαυτοῦ ἐκείνου.'
