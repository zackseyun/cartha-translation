  text: And when he had said these things[a], one of the officers standing by struck Jesus, saying[b], “Is this how you answer the high priest?”
translation:
  language: ar
  text: 'ولمّا قال هذا الكلام، ضرب[a] يسوعَ أحدُ الحراس[b] الذي كان واقفًا هناك، قائلًا: «أهكذا تجيب رئيس الكهنة؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يدل التعبير اليوناني على ضربة باليد، وقد تكون صفعة أو ضربة شبيهة بها.
    reason: lexical_alternative
  - marker: b
    text: يمكن أيضًا ترجمة الكلمة اليونانية بـ«الخدم» أو «المرافقين»؛ ويُرجَّح في هذا السياق أنها تشير إلى أفراد رسميين تابعين للسلطة الكهنوتية.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: هذا الكلام
  rationale: يحيل اسم الإشارة إلى ما قاله يسوع قبيل ذلك. و«هذا الكلام» تعبير عربي طبيعي يحفظ الإحالة إلى مجموع أقواله من غير تكلّف في ترجمة صيغة الجمع اليونانية.
- source_word: αὐτοῦ εἰπόντος
  choice: ولمّا قال
  rationale: ترجمة زمنية طبيعية للتركيب اليوناني المطلق بالمضاف إليه، وتدل على أن الضربة وقعت عقب كلام يسوع.
- source_word: εἷς παρεστηκὼς τῶν ὑπηρετῶν
  choice: واحدٌ من الحرس الواقفين هناك
  rationale: يفيد ὑπηρέται هنا أفرادًا تابعين للسلطة القائمة في هذا المشهد، لا خدمًا منزليين بالضرورة؛ و«الواقفين هناك» تنقل معنى الحضور والوقوف في المكان.
- source_word: ἔδωκεν ῥάπισμα
  choice: لطم
  rationale: ينقل الفعل العربي بإيجاز معنى توجيه ضربة باليد، مع بيان المدى الدلالي المحتمل في الحاشية.
- source_word: Οὕτως ἀποκρίνῃ
  choice: أهكذا تجيب
  rationale: يحفظ أسلوب الاستنكار والسؤال عن طريقة مخاطبة رئيس الكهنة.
- source_word: τῷ ἀρχιερεῖ
  choice: رئيس الكهنة
  rationale: هو المقابل العربي المألوف والدقيق للقب ἀρχιερεύς في هذا السياق.
theological_decisions:
- issue: تحديد هوية ὑπηρετῶν
  choice: الحرس، أي أفراد تابعون للسلطة الكهنوتية
  alternative: الخدم أو المرافقون
  rationale: يرجّح سياق القبض والمحاكمة أنهم موظفون أو حرس رسميون، لكن الحاشية تحفظ السعة المعجمية ولا تجعل التحديد أضيق مما يسمح به النص.
translation_notes:
  register: صياغة عربية فصحى واضحة وموقّرة، مع ترتيب نحوي طبيعي. استُخدم «هذا الكلام» بدل الترجمة الحرفية المتكلّفة لصيغة الجمع، وحُفظت السعة الدلالية لكلمتي ῥάπισμα وὑπηρέται في الحاشيتين.
