base_translation:
  language: en
  yaml_path: translation/nt/john/018/011.yaml
  text: So Jesus said to Peter[a], “Put the sword into its sheath[b]. Shall I not drink the cup that the Father has given me?”
translation:
  language: ar
  text: 'فقال يسوع لبطرس: «ضَعِ السيفَ في غِمده[a]. أَفَلا أشرب الكأس[b] التي أعطانيها الآب؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «قِرابه».'
    reason: lexical_alternative
  - marker: b
    text: «الكأس» صورة كتابية مجازية للألم أو المصير الذي عيّنه الله؛ قارن صلاة يسوع في جثسيماني (متى 26:39؛ مرقس 14:36؛ لوقا 22:42).
    reason: cross_reference
lexical_decisions:
- source_word: οὖν
  choice: فـ
  rationale: تفيد مواصلة السرد وربط كلام يسوع بما وقع قبله، من غير إثقال العبارة بـ«لذلك».
- source_word: Βάλε
  choice: ضَعْ
  rationale: فعل أمر مباشر وطبيعي يؤدي المعنى السياقي للفعل βάλλω، أي وضع السيف داخل غمده.
- source_word: μάχαιραν
  choice: سيفك
  rationale: «السيف» هو المقابل العربي الواضح والمألوف للسلاح ذي النصل في مشهد القبض. أضيف ضمير المخاطب لأن العربية الطبيعية في هذا السياق تقتضيه، ولأن السيف الذي بيد بطرس هو المقصود بوضوح.
- source_word: θήκην
  choice: غِمده
  rationale: «الغِمد» هو الوعاء الذي يُدخل فيه السيف، وهو لفظ عربي دقيق ومفهوم.
- source_word: ποτήριον
  choice: الكأس
  rationale: يحفظ الصورة المجازية في اليونانية ولا يفسرها في المتن بأنها الألم أو الموت أو الغضب.
- source_word: δέδωκέν
  choice: أعطانيها
  rationale: ينقل فعل العطاء المكتمل ذا الصلة بالحاضر بصياغة عربية طبيعية؛ ولا تتطلب العربية هنا مقابلاً مستقلاً لصيغة التام اليونانية.
- source_word: ὁ πατήρ
  choice: الآب
  rationale: يحفظ التعبير اليوحناوي المعرّف من غير إضافة «أبي»، وهي غير مذكورة صراحة في النص اليوناني.
- source_word: οὐ μὴ πίω αὐτό;
  choice: أَفَلا أشرب
  rationale: 'صيغة استفهام إنكاري تتوقع جواباً بالإيجاب، فتحفظ قوة السؤال البلاغي: سيشرب يسوع الكأس بالفعل.'
theological_decisions:
- issue: دلالة «الكأس»
  choice: الإبقاء على «الكأس» بوصفها صورة مجازية من غير تفسيرها داخل المتن
  alternative: الألم المعيَّن ليسوع؛ المصير الذي عيّنه الآب؛ كأس الغضب الإلهي
  rationale: السياق الكتابي يربط الكأس بالألم أو المصير الذي عيّنه الله، لكن الآية نفسها لا تحصر الصورة في تسمية عقائدية أضيق.
- issue: علاقة يسوع بالآب في عبارة «أعطانيها الآب»
  choice: نقل العبارة مباشرة بما يظهر قبول يسوع الطوعي لما أعطاه الآب
  alternative: «التي عيّنها لي أبي» أو «التي سلّمني إياها الآب»
  rationale: الترجمة المباشرة تحفظ طاعة الابن للآب من غير الانتقاص من كرامته أو إضافة شرح عقائدي غير مصرح به.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «غِمد» لدقته وشيوعه، وحُفظ مجاز «الكأس» والسؤال البلاغي من غير تفكيكهما أو تضييق معناهما.
