  yaml_path: translation/nt/john/018/034.yaml
  text: Jesus answered[a], “Are you saying this on your own, or did others tell you about me?”
translation:
  language: ar
  text: 'أجاب يسوع: «أمِن تلقاء نفسك تقول هذا، أم أخبرك آخرون عني؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: أجاب
  rationale: فعل سردي مألوف يدل على الرد في سياق الحوار.
- source_word: Ἀπὸ σεαυτοῦ
  choice: مِن عندك
  rationale: يحافظ على معنى المصدر أو المنشأ في ἀπό مع ضمير المخاطب الانعكاسي، ويأتي عربيًا طبيعيًا من غير تفسير زائد للدافع.
- source_word: σὺ
  choice: الفاعل المستتر في «تقول» مع إبراز المعنى بواسطة «مِن عندك»
  rationale: العربية لا تحتاج إلى إظهار الضمير، كما أن العبارة المصدرية نفسها توجّه السؤال بوضوح إلى بيلاطس وتحفظ قدرًا مناسبًا من التوكيد.
- source_word: τοῦτο
  choice: هذا
  rationale: إشارة موجزة وواضحة إلى سؤال بيلاطس السابق.
- source_word: λέγεις
  choice: تقول
  rationale: المضارع العربي يلائم الكلام المباشر ويحافظ على الصياغة اليونانية من دون تحويلها إلى سؤال عن الدافع.
- source_word: ἢ
  choice: أم
  rationale: «أم» هي الأنسب بين بديلين داخل سؤال واحد.
- source_word: ἄλλοι
  choice: آخرون
  rationale: تنقل الجمع غير المعيّن بإيجاز ووضوح.
- source_word: εἶπόν σοι
  choice: قاله لك
  rationale: ينقل فعل λέγω ومفعول القول المفهوم من السياق، ويحافظ على الفرق اللفظي عن تعبير المصدر في الشطر الأول.
- source_word: περὶ ἐμοῦ
  choice: عني
  rationale: صياغة عربية طبيعية ودقيقة لمعنى «بشأني/عنّي».
theological_decisions:
- issue: مغزى سؤال يسوع لبيلاطس
  choice: 'صياغته سؤالًا عن مصدر قول بيلاطس: أهو صادر من عنده أم من إخبار آخرين؟'
  alternative: «هل تسأل هذا من تلقاء نفسك؟» أو صياغة تصرّح بأن المقصود مبادرته أو دوافعه
  rationale: النص اليوناني يركّز على منشأ القول، ولا يصرّح بدافع بيلاطس ولا يشرح البعد اللاهوتي الأوسع؛ لذلك تُحفظ مساحة التوتر والتأويل.
translation_notes:
  register: عربية فصحى حديثة، واضحة وكريمة. استُعملت «أمِن عندك» بهمزة الاستفهام قبل شبه الجملة لتقديم عنصر المصدر كما في اليونانية، مع تجنب العبارة الأثقل «أمن نفسك» التي قد توحي بمعنى نفسي غير مقصود.
