  text: ἐκραύγασαν οὖν ⸀πάλιν λέγοντες· Μὴ τοῦτον ἀλλὰ τὸν Βαραββᾶν. ἦν δὲ ὁ Βαραββᾶς λῃστής.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/040.yaml
  text: So they shouted again[a], saying, “Not this man, but Barabbas!” Now Barabbas was a robber.
translation:
  language: ar
  text: 'فصرخوا من جديد قائلين: «ليس هذا، بل باراباس!» وكان باراباس لصًّا.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «قاطعَ طريق»؛ فاللفظ اليوناني قد يشير إلى لص أو قاطع طريق، وقد يُطلَق في بعض السياقات على متمرد عنيف.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκραύγασαν
  choice: صرخوا
  rationale: يفيد الفعل إطلاق صوت عالٍ؛ و«صرخوا» تعبير عربي طبيعي يحفظ قوة الأصل.
- source_word: οὖν
  choice: فـ
  rationale: تربط الفاء الكلام بما سبقه، وتنقل هنا معنى الاستمرار أو النتيجة الذي تؤديه οὖν.
- source_word: πάλιν
  choice: من جديد
  rationale: تنقل معنى التكرار بوضوح وبصياغة عربية طبيعية.
- source_word: λέγοντες
  choice: قائلين
  rationale: يحفظ اسم الفاعل بنية الأصل، مع بقاء التعبير فصيحًا بعد «صرخوا».
- source_word: Μὴ τοῦτον ἀλλὰ τὸν Βαραββᾶν
  choice: ليس هذا، بل باراباس
  rationale: يحفظ قوة اسم الإشارة والمقابلة الموجزة في اليونانية دون إضافة فعل غير مصرّح به.
- source_word: Βαραββᾶν / Βαραββᾶς
  choice: باراباس
  rationale: نقل صوتي للاسم بحسب صورته اليونانية الشائعة في العربية.
- source_word: ἦν δὲ
  choice: وكان
  rationale: تقدّم الواو الجملة التفسيرية الخلفية بصورة عربية سلسة، بينما ينقل فعل «كان» زمن الأصل.
- source_word: λῃστής
  choice: لصًّا
  rationale: «لص» هو المقابل المباشر الشفاف للمعنى الأساسي، مع إثبات احتمال معنى «قاطع طريق» أو متمرد عنيف في الحاشية.
theological_decisions:
- issue: دلالة λῃστής في وصف باراباس
  choice: لصًّا
  alternative: قاطع طريق؛ أو متمرد عنيف
  rationale: يدل اللفظ أساسًا على اللص أو قاطع الطريق، وقد يتسع في بعض السياقات لشخص يمارس العنف في إطار تمرد. غير أن هذه الآية وحدها لا تفرض المعنى السياسي الأخص، لذلك أُبقي المعنى المباشر في المتن والنطاق الأوسع في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. حُفظ إيجاز النداء وبنية «صرخوا... قائلين»، ووُضع مؤشر الحاشية مباشرة بعد اللفظ المشروح.
