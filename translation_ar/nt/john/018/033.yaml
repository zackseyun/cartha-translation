  text: Εἰσῆλθεν οὖν ⸂πάλιν εἰς τὸ πραιτώριον⸃ ὁ Πιλᾶτος καὶ ἐφώνησεν τὸν Ἰησοῦν καὶ εἶπεν αὐτῷ· Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/033.yaml
  text: So Pilate went back into the governor’s headquarters and called Jesus and said to him[b][a], “Are you the King of the Jews?”
translation:
  language: ar
  text: 'فدخل بيلاطس ثانيةً إلى مقرّ الحاكم[a]، واستدعى يسوع وقال له: «أأنت ملك اليهود[b]؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «دار الولاية»، أي المقرّ الرسمي أو دار إقامة الحاكم الروماني.
    reason: lexical_alternative
  - marker: b
    text: يمكن أن تعني الكلمة اليونانية أيضًا «أهل اليهودية»، إذ قد تشير إلى اليهود عمومًا أو إلى سكان منطقة اليهودية بحسب السياق.
    reason: alternative_reading
lexical_decisions:
- source_word: Εἰσῆλθεν ... πάλιν
  choice: دخل ... ثانيةً
  rationale: ينقل معنى الدخول المتكرر أو العودة إلى الداخل بعبارة عربية واضحة وطبيعية، من غير إضافة ما لا يقتضيه السياق.
- source_word: οὖν
  choice: فـ
  rationale: الفاء تلائم السرد العربي وتحفظ صلة هذه الخطوة بما سبق من أحداث.
- source_word: πραιτώριον
  choice: مقرّ الحاكم
  rationale: تعبير مفهوم للقارئ المعاصر يدل على المقر الرسمي للحاكم الروماني، مع إثبات المصطلح التقليدي في الحاشية.
- source_word: ἐφώνησεν
  choice: استدعى
  rationale: الفعل هنا يدل على دعوة يسوع للحضور، و«استدعى» أدق في سياق التحقيق الرسمي من «نادى».
- source_word: εἶπεν αὐτῷ
  choice: قال له
  rationale: يحافظ على عموم فعل القول في اليونانية، بينما تظهر دلالة السؤال من صيغة الكلام المنقول.
- source_word: Σὺ εἶ
  choice: أأنت
  rationale: صيغة استفهام عربية فصيحة تُبرز الضمير الصريح كما في الأصل من غير افتعال.
- source_word: ὁ βασιλεὺς
  choice: ملك
  rationale: ينقل اللقب في تركيب إضافي عربي طبيعي؛ ولا تحتاج العربية إلى أداة تعريف مستقلة قبل المضاف.
- source_word: τῶν Ἰουδαίων
  choice: اليهود
  rationale: هو المعنى الأنسب للاتهام السياسي وصيغة اللقب في سياق المحاكمة، مع إبقاء احتمال «اليهوديّين/أهل اليهودية» في الحاشية.
theological_decisions:
- issue: دلالة Ἰουδαίων في اللقب الملكي
  choice: اليهود
  alternative: أهل اليهودية (اليهوديّون بالمعنى الجغرافي)
  rationale: «ملك اليهود» هو التعبير الأوفق للاتهام الذي ينظر فيه بيلاطس، لكنه لا يلغي إمكان الدلالة الجغرافية للفظ اليوناني في بعض السياقات، لذلك حُفظ البديل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «فدخل» لاستمرار السرد، و«مقرّ الحاكم» للوضوح، مع حفظ المصطلح التقليدي والاحتمال الدلالي للفظ Ἰουδαίων في الحواشي.
