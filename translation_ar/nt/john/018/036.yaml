  verdict: approve
  source_fidelity: النص العربي ينقل بدقة البنية الشرطية المخالفة للواقع في اليونانية («لو كانت... لكان... يقاتلون»)، ودلالة المنشأ في ἐκ («من هذا العالم»)، وغرض القتال مع المبني للمجهول («لكيلا أُسلَّم»). كما يحافظ على التحول الختامي من «من هذا العالم» إلى الإشارة الموجزة «من هنا»، الموافق لـἐντεῦθεν.
  naturalness: الصياغة فصحى معاصرة واضحة وسليمة. تكرار «مملكتي» طبيعي ومقصود، و«خُدّامي يقاتلون» مناسب لسياق المملكة ولا يفرض توصيفًا مؤسسيًا غير موجود في الأصل. «ولكن، في الواقع» يؤدي التقابل بين الشرط الافتراضي والحال الفعلية بوضوح.
  terminology: «مملكتي»، «العالم»، و«اليهود» اختيارات مستقرة ومناسبة. وتتعامل الحاشية بحذر سليم مع اتساع لفظ Ἰουδαῖοι وإمكان دلالته الأضيق سياقيًا، دون تحويل المتن إلى تفسير. لا توجد مشكلة في المصطلحات اللاهوتية أو الأسماء.
