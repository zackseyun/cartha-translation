  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Ἡ βασιλεία ἡ ἐμὴ οὐκ ἔστιν ἐκ τοῦ κόσμου τούτου· εἰ ἐκ τοῦ κόσμου τούτου ἦν ἡ βασιλεία ἡ ἐμή, οἱ ὑπηρέται ⸂οἱ ἐμοὶ ἠγωνίζοντο ἄν⸃, ἵνα μὴ παραδοθῶ τοῖς Ἰουδαίοις· νῦν δὲ ἡ βασιλεία ἡ ἐμὴ οὐκ ἔστιν ἐντεῦθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/036.yaml
  text: Jesus answered[a], “My kingdom is not from this world. If my kingdom were from this world, my servants would be fighting so that I might not be handed over to the Jews. But as it is, my kingdom is not from here.”
translation:
  language: ar
  text: 'أجاب يسوع: «مملكتي ليست من هذا العالم. لو كانت مملكتي من هذا العالم، لكان خُدّامي يقاتلون لكيلا أُسلَّم إلى اليهود[a]. ولكن، في الواقع، مملكتي ليست من هنا».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أهل اليهودية»، وربما يُقصد هنا على نحو أخصّ السلطات اليهودية.
    reason: يحفظ احتمال الدلالة الجغرافية أو السياقية الأضيق للفظ Ἰουδαῖοι من غير فرضها في المتن.
lexical_decisions:
- source_word: βασιλεία
  choice: مملكتي
  rationale: «المملكة» هي الصياغة العربية الطبيعية الراسخة هنا، ويمكنها أن تدل على نطاق الملك وسلطانه معًا، كما تلائم التكرار في العبارة اليونانية.
- source_word: ἐκ τοῦ κόσμου τούτου
  choice: من هذا العالم
  rationale: يحافظ حرف الجر ἐκ على معنى المصدر أو المنشأ، فلا توحي العبارة بأن ملكوت يسوع غائب عن العالم، بل بأنه لا يستمد أصله منه.
- source_word: κόσμος
  choice: العالم
  rationale: مقابل مباشر وواضح يحفظ اتساع الاستعمال اليوحناوي من غير إدخال تفسير مثل «نظام العالم» في صلب النص.
- source_word: ὑπηρέται
  choice: خُدّامي
  rationale: يدل اللفظ على أشخاص يعملون تحت سلطة صاحبهم؛ و«خُدّامي» تلائم سياق المملكة من غير تخصيصهم كحرس أو موظفين رسميين.
- source_word: ἠγωνίζοντο ἄν
  choice: لكان خُدّامي يقاتلون
  rationale: تنقل الجملة الشرطية المخالفة للواقع، ويؤدي الفعل «يقاتلون» معنى النضال العملي لمنع التسليم من غير مبالغة أسلوبية.
- source_word: ἵνα μὴ παραδοθῶ
  choice: لكيلا أُسلَّم
  rationale: تحفظ غرض القتال المفترض وصيغة المبني للمجهول، وتؤدي معنى التسليم إلى سلطة أخرى بعبارة عربية موجزة وواضحة.
- source_word: τοῖς Ἰουδαίοις
  choice: إلى اليهود[a]
  rationale: يحفظ المعنى المعجمي المباشر، بينما توضح الحاشية إمكان الدلالة السياقية الأضيق على أهل اليهودية أو سلطاتها.
- source_word: νῦν δὲ
  choice: ولكن، في الواقع
  rationale: يبين الانتقال من الشرط الافتراضي إلى الحال الفعلية؛ فـνῦν هنا منطقي تقابلي أكثر منه إشارة زمنية محضة.
- source_word: ἐντεῦθεν
  choice: من هنا
  rationale: يحافظ على التعبير الإشاري الموجز في اليونانية وعلى اختلافه اللفظي عن «من هذا العالم».
theological_decisions:
- issue: طبيعة مملكة يسوع وصلتها بالعالم
  choice: «ليست من هذا العالم» بوصفها عبارة عن المصدر والمنشأ
  alternative: «ليست في هذا العالم» أو «ليست جزءًا من هذا العالم»
  rationale: النص ينفي أن يكون منشأ مملكة يسوع من نظام العالم، ولا ينفي حضورها أو عملها فيه؛ لذلك حُفظت دلالة المصدر من غير حسم التوتر اللاهوتي لصالح الانسحاب من الواقع الأرضي.
- issue: مدلول Ἰουδαῖοι في سياق يوحنا
  choice: «اليهود» في المتن مع بديل سياقي في الحاشية
  alternative: «أهل اليهودية» أو «السلطات اليهودية»
  rationale: اللفظ اليوناني يحتمل الدلالة العامة، وقد يضيق في هذا السياق ليشير إلى أهل اليهودية، ولا سيما السلطات؛ لذلك لم يُحسم المرجع الأضيق داخل المتن.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حُفظ تكرار «مملكتي» والبناء الشرطي المخالف للواقع، واستُعملت «من» لإبراز دلالة المصدر في العبارتين الرئيسيتين. وُضع مؤشر الحاشية مباشرة بعد «اليهود» لأنه يتصل بهذا اللفظ تحديدًا.
