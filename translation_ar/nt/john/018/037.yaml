source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτῷ ὁ Πιλᾶτος· Οὐκοῦν βασιλεὺς εἶ σύ; ἀπεκρίθη ⸀ὁ Ἰησοῦς· Σὺ λέγεις ὅτι βασιλεύς ⸀εἰμι. ἐγὼ εἰς τοῦτο γεγέννημαι καὶ εἰς τοῦτο ἐλήλυθα εἰς τὸν κόσμον ἵνα μαρτυρήσω τῇ ἀληθείᾳ· πᾶς ὁ ὢν ἐκ τῆς ἀληθείας ἀκούει μου τῆς φωνῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/037.yaml
  text: 'Then Pilate said to him[a], “So then, are you a king?” Jesus answered, “You say that I am a king. For this I have been born, and for this I have come into the world: that I should bear witness to the truth. Everyone who is of the truth listens to my voice.”'
translation:
  language: ar
  text: 'فقال له بيلاطس: «أفأنت إذًا ملك؟» أجاب يسوع: «أنت تقول إني ملك.[a] لهذا وُلدت، ولهذا أتيت إلى العالم: لكي أشهد للحق. كل من هو من الحق يسمع صوتي.»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أنت تقول ذلك: أنا ملك»، أو: «لقد أصبت بقولك إني ملك». العبارة اليونانية موجزة، ويمكن فهمها على أنها إقرار متحفّظ.'
    reason: alternative_reading
lexical_decisions:
- source_word: Οὐκοῦν
  choice: أفـ... إذًا
  rationale: تنقل أداة الاستنتاج التي يستخلص بها بيلاطس نتيجة من الحوار السابق، مع صياغة استفهامية عربية طبيعية.
- source_word: βασιλεὺς
  choice: ملك
  rationale: المقابل المباشر الملائم لسياق التحقيق الروماني، ويحفظ الدلالتين السياسية والمسيانية من غير شرح زائد.
- source_word: Σὺ λέγεις ὅτι βασιλεύς εἰμι
  choice: أنت تقول إني ملك
  rationale: تحافظ على إيجاز اليونانية واحتمال كون العبارة إقرارًا متحفّظًا، من غير تحويلها إلى إثبات قاطع أو نفي.
- source_word: γεγέννημαι
  choice: وُلدت
  rationale: صياغة عربية طبيعية للمبني للمجهول، ولا تستورد معنى «وُلدت ولادة أزلية» أو غيره مما لا يقتضيه السياق.
- source_word: ἐλήλυθα εἰς τὸν κόσμον
  choice: أتيت إلى العالم
  rationale: تحفظ العبارة مستقلة عن ذكر الولادة، وبذلك تبقي إيحاءات الرسالة والأصل في الأسلوب اليوحناوي من غير تفسير إضافي.
- source_word: μαρτυρήσω τῇ ἀληθείᾳ
  choice: أشهد للحق
  rationale: تنقل لغة الشهادة القانونية واللاهوتية، و«للحق» تركيب عربي موجز وطبيعي مع فعل الشهادة.
- source_word: πᾶς ὁ ὢν ἐκ τῆς ἀληθείας
  choice: كل من هو من الحق
  rationale: تحفظ علاقة المصدر أو الانتماء التي تؤديها ἐκ، وتتجنب حسمها بتفسير «ينتمي إلى الحق».
- source_word: ἀκούει μου τῆς φωνῆς
  choice: يسمع صوتي
  rationale: هو المعنى المباشر للفعل، ويظل قادرًا في السياق على الدلالة على الإصغاء والاستجابة، كما يحفظ صدى صورة الراعي في إنجيل يوحنا.
theological_decisions:
- issue: دلالة جواب يسوع «Σὺ λέγεις ὅτι βασιλεύς εἰμι»
  choice: إبقاء العبارة بصيغة «أنت تقول إني ملك» بوصفها قابلة لأن تُفهم إقرارًا متحفّظًا
  alternative: '«أنت تقول ذلك: أنا ملك» أو «لقد أصبت بقولك إني ملك»'
  rationale: التركيب اليوناني موجز ويحتمل درجات من الإقرار، ولا يصرّح بإثبات emphatic ولا بمباعدة أو نفي؛ لذلك حُفظ التوتر في المتن وذُكرت الاحتمالات في الحاشية.
- issue: العلاقة بين «وُلدت» و«أتيت إلى العالم»
  choice: الإبقاء على العبارتين منفصلتين
  alternative: دمجهما في عبارة واحدة عن رسالة يسوع
  rationale: يميّز النص بين الولادة والمجيء إلى العالم، وقد تحمل العبارة الثانية دلالة يوحناوية على الأصل والرسالة؛ فلا ينبغي تسوية هذا التمييز بتفسير واحد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «أفأنت إذًا» لإظهار الاستنتاج في سؤال بيلاطس، وأُبقيت تعابير «من الحق» و«يسمع صوتي» قريبة من الصورة اليوحناوية مع بقائها مفهومة للقارئ العام.
