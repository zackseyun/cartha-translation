  text: πάλιν οὖν ⸂ἐπηρώτησεν αὐτούς⸃· Τίνα ζητεῖτε; οἱ δὲ εἶπαν· Ἰησοῦν τὸν Ναζωραῖον.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/007.yaml
  text: So he asked them again[a], “Whom are you seeking?” And they said, “Jesus the Nazarene.”
translation:
  language: ar
  text: 'فسألهم مرة أخرى: «مَن تطلبون؟» فقالوا: «يسوع الناصري».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو «يسوع من الناصرة»؛ واليونانية حرفيًا: «يسوع الناصري».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν οὖν
  choice: فسألهم مرة أخرى
  rationale: تفيد πάλιν تكرار السؤال، بينما تصل οὖν الكلام بما سبقه. وتؤدي الفاء هذا الانتقال السردي طبيعيًا في العربية، مع تقديم الفعل الموافق للأسلوب العربي.
- source_word: ἐπηρώτησεν αὐτούς
  choice: سألهم
  rationale: الفعل يدل هنا على توجيه سؤال مباشر، والضمير يعود إلى جماعة الآتين للقبض عليه؛ لذا فالصياغة الموجزة «سألهم» دقيقة وطبيعية.
- source_word: Τίνα ζητεῖτε
  choice: مَن تطلبون؟
  rationale: «مَن» أداة الاستفهام الطبيعية عن الشخص، و«تطلبون» تحافظ على معنى ζητέω وعلى صلته اللفظية باستعمالاته في سياق يوحنا، من غير توسع تفسيري.
- source_word: οἱ δὲ εἶπαν
  choice: فقالوا
  rationale: δέ هنا أداة انتقال في الحوار أكثر من كونها استدراكًا قويًا، ولذلك تنقلها الفاء بسلاسة في السرد العربي.
- source_word: Ἰησοῦν τὸν Ναζωραῖον
  choice: يسوع الناصري
  rationale: «يسوع» هو الرسم العربي المألوف للاسم، و«الناصري» يحافظ على الصفة/اللقب الجغرافي في اليونانية بصياغة عربية واضحة وموجزة.
theological_decisions:
- issue: دلالة Ναζωραῖος بوصفها نعتًا ليسوع
  choice: الناصري
  alternative: من الناصرة
  rationale: اللفظ في هذا الموضع تعريف تاريخي وجغرافي، لا لقب عقائدي. وتحافظ «الناصري» على بنية التعبير اليوناني، فيما يوضح الهامش البديل الجغرافي الشائع من غير حسم زائد لدلالة الصيغة.
translation_notes:
  register: لغة عربية فصحى حديثة واضحة ووقورة. استُعملت الفاء لربط السؤال والجواب بالسياق السابق، وحُفظ الإيجاز والحوار المباشر في الأصل.
