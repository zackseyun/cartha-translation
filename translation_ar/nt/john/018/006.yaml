  yaml_path: translation/nt/john/018/006.yaml
  text: So when he said to them[a], “I am he,” they went backward and fell to the ground.
translation:
  language: ar
  text: 'فلما قال لهم: «أنا هو[a]»، تراجعوا وسقطوا على الأرض.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «أنا». وقد يكون في العبارة اليونانية أيضًا صدى لأقوال «أنا هو» المميزة في إنجيل يوحنا.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὡς οὖν
  choice: فلما
  rationale: تؤدي «فـ» وظيفة الربط والاستنتاج السردي في οὖν، وتؤدي «لما» المعنى الزمني في ὡς، بصياغة عربية طبيعية موجزة.
- source_word: εἶπεν αὐτοῖς
  choice: قال لهم
  rationale: ترجمة مباشرة وطبيعية للفعل λέγω مع المفعول غير المباشر αὐτοῖς.
- source_word: Ἐγώ εἰμι
  choice: أنا هو
  rationale: تفيد التعريف بالنفس في سياق السؤال عمّن يطلبونه، مع إبقاء صيغة قريبة من اليونانية تسمح بسماع الصدى المحتمل لعبارات «أنا هو» في يوحنا.
- source_word: ἀπῆλθον εἰς τὰ ὀπίσω
  choice: تراجعوا
  rationale: تعبير عربي طبيعي يدل بوضوح على الحركة إلى الوراء، من غير إضافة سبب نفسي غير مصرح به في النص.
- source_word: ἔπεσαν χαμαί
  choice: سقطوا على الأرض
  rationale: ينقل المعنى المكاني الصريح لكلمة χαμαί بعبارة عربية مألوفة.
theological_decisions:
- issue: دلالة Ἐγώ εἰμι في السياق اليوحناوي
  choice: أنا هو
  alternative: أنا
  rationale: السياق المباشر يدل على تعريف يسوع بنفسه جوابًا عن الشخص الذي يطلبونه، لكن العبارة اليونانية حرفيًا «أنا» وقد تحمل صدى لاهوتيًا مقصودًا في إنجيل يوحنا؛ لذلك تُحفظ الصيغة الحرفية في الحاشية دون حسم هذا التوتر.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «فلما» للربط الزمني السلس، و«تراجعوا» لتجنب العبارة الأثقل «ذهبوا إلى الوراء». وُضع مؤشر الحاشية بعد «لهم» كي لا يقطع العبارة المقتبسة، مع أن الحاشية تشرح قول «أنا هو».
