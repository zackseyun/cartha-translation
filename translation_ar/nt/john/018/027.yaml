lexical_decisions:
- source_word: πάλιν
  choice: مرة أخرى
  rationale: تفيد تكرار الفعل، وهذه العبارة عربية طبيعية واضحة في سياق إنكارات بطرس المتكررة.
- source_word: οὖν
  choice: فـ
  rationale: تربط الجملة بما قبلها وتفيد هنا تتابع السرد والنتيجة السياقية من غير مبالغة في إبراز الاستنتاج المنطقي.
- source_word: ἠρνήσατο
  choice: أنكر ذلك
  rationale: الفعل يعني أنكر أو نفى. أُضيف اسم الإشارة «ذلك» في العربية إحالةً إلى مضمون السؤال السابق، مع بيان في الحاشية أن المفعول غير مصرّح به في اليونانية.
- source_word: Πέτρος
  choice: بطرس
  rationale: الصيغة العربية المعيارية الشائعة للاسم.
- source_word: καὶ
  choice: و
  rationale: حرف عطف بسيط يصل إنكار بطرس بالحدث الذي وقع عقبه مباشرة.
- source_word: εὐθέως
  choice: في الحال
  rationale: تنقل معنى الفورية بعبارة عربية واضحة وطبيعية.
- source_word: ἀλέκτωρ
  choice: ديك
  rationale: اللفظ اليوناني يدل على ذكر الدجاج، و«ديك» هو المقابل العربي المباشر الشائع.
- source_word: ἐφώνησεν
  choice: صاح
  rationale: مع كون الديك هو الفاعل، تؤدي «صاح» المعنى السياقي الطبيعي للفعل الذي يدل في أصله على إصدار صوت أو النداء.
