  text: Ἰησοῦς ⸀οὖν εἰδὼς πάντα τὰ ἐρχόμενα ἐπ’ αὐτὸν ⸂ἐξῆλθεν, καὶ λέγει⸃ αὐτοῖς· Τίνα ζητεῖτε;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/004.yaml
  text: Jesus therefore[a], knowing all the things coming upon him, went out and said to them, “Whom are you seeking?”
translation:
  language: ar
  text: 'فيسوع، إذ كان يعلم كلَّ ما سيأتي عليه، خرج وقال لهم: «مَن تطلبون؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: فـ
  rationale: تفيد استمرار السرد والنتيجة في هذا السياق، وهي طبيعية وموجزة في العربية.
- source_word: εἰδὼς
  choice: إذ كان يعلم
  rationale: تحافظ على كون علم يسوع سابقًا لخروجه ومصاحبًا له، بصياغة عربية واضحة.
- source_word: πάντα τὰ ἐρχόμενα ἐπ’ αὐτόν
  choice: كلَّ ما سيأتي عليه
  rationale: تنقل شمول πάντα ودلالة الأحداث الوشيكة، وتحافظ على تعبير «يأتي عليه» من غير تحديد ما لم يحدده اليوناني.
- source_word: ἐξῆλθεν
  choice: خرج
  rationale: المقابل العربي المباشر الطبيعي، من غير إضافة إيحاء درامي.
- source_word: λέγει
  choice: وقال
  rationale: صيغ الماضي أنسب للسرد العربي المتصل، مع أن اليونانية تستعمل المضارع التاريخي.
- source_word: Τίνα ζητεῖτε
  choice: مَن تطلبون؟
  rationale: «مَن» تؤدي وظيفة المفعول به في العربية، و«تطلبون» تحافظ على نبرة ζητέω الأرفع قليلًا من «تبحثون عن».
theological_decisions:
- issue: علم يسوع السابق بما سيأتي عليه
  choice: إثبات أنه كان يعلم كل ما سيأتي عليه من غير توسيع عقائدي
  alternative: صياغة تفسيرية تصرّح بعلم شامل أو تفصّل الأحداث المقصودة
  rationale: النص يؤكد وعي يسوع الكامل بالأحداث المقبلة، لكنه لا يصوغ هنا شرحًا عقائديًا منهجيًا؛ لذا تُحفظ دلالته من غير زيادة.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُعملت «فيسوع» لربط الآية بالسياق، و«كل ما سيأتي عليه» لصياغة طبيعية تحفظ قربها من التركيب اليوناني.
