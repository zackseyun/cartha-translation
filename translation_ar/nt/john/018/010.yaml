  text: Σίμων οὖν Πέτρος ἔχων μάχαιραν εἵλκυσεν αὐτὴν καὶ ἔπαισεν τὸν τοῦ ἀρχιερέως δοῦλον καὶ ἀπέκοψεν αὐτοῦ τὸ ⸀ὠτάριον τὸ δεξιόν. ἦν δὲ ὄνομα τῷ δούλῳ Μάλχος.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/010.yaml
  text: Then Simon Peter[a], having a sword, drew it and struck the high priest’s servant and cut off his right ear. Now the servant’s name was Malchus.
translation:
  language: ar
  text: فاستلَّ سمعان بطرس سيفًا كان معه، فضرب عبدَ رئيس الكهنة[a] وقطع أذنه اليمنى. وكان اسم العبد مَلْخُس.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «خادم رئيس الكهنة». واللفظة اليونانية نفسها في آخر الآية يمكن ترجمتها: «وكان اسم الخادم مَلْخُس». فاللفظة اليونانية δοῦλος قد تعني عبدًا أو خادمًا بحسب السياق.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: فـ
  rationale: تفيد الانتقال والنتيجة السردية المترتبة على المشهد السابق، من غير إضفاء استدلال منطقي زائد.
- source_word: ἔχων μάχαιραν
  choice: سيفًا كان معه
  rationale: صياغة عربية طبيعية تحفظ معنى حيازة السلاح؛ و«سيف» مقابل عام مناسب لـμάχαιρα التي قد تدل على سيف قصير.
- source_word: εἵλκυσεν αὐτὴν
  choice: استلَّ
  rationale: فعل عربي فصيح واضح يدل في سياق السلاح على إخراجه من غمده، ويغني عن تكرار الضمير.
- source_word: ἔπαισεν
  choice: ضرب
  rationale: ينقل الفعل مباشرة بلغة عربية جارية وكريمة النبرة.
- source_word: τὸν τοῦ ἀρχιερέως δοῦλον
  choice: عبدَ رئيس الكهنة
  rationale: «عبد» يحفظ دلالة التبعية والملكية في δοῦλος هنا، بخلاف «خادم» التي قد توحي بمجرد وظيفة مأجورة.
- source_word: ἀπέκοψεν
  choice: قطع
  rationale: مقابل مباشر وطبيعي يدل على إزالة العضو بالقطع.
- source_word: ὠτάριον τὸ δεξιόν
  choice: أذنه اليمنى
  rationale: صياغة عربية موجزة؛ وصيغة التصغير اليونانية لا تستلزم تصغيرًا في العربية، ولا يحدد النص شحمة الأذن.
- source_word: ἦν δὲ ὄνομα τῷ δούλῳ Μάλχος
  choice: وكان اسم العبد مَلْخُس
  rationale: تنقل δέ بوصل سردي طبيعي، وتحول تركيب الاسم الداتي إلى تعبير عربي مألوف، مع ضبط نقل الاسم عَلَمًا.
theological_decisions:
- issue: ترجمة δοῦλος
  choice: عبد
  alternative: خادم
  rationale: صلة الإضافة إلى رئيس الكهنة تجعل التبعية المملوكة بارزة، ولذلك اختير «عبد» في المتن، مع إثبات «خادم» بديلًا سياقيًا ممكنًا في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. استُعمل «استلَّ» لدقته وشيوعه في سياق السيف، وحُفظ الإيقاع السردي الموجز. وُضع رمز الحاشية بعد نهاية الآية لأنه يوضح موضعي ورود اللفظة نفسها.
