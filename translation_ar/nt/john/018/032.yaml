  text: ἵνα ὁ λόγος τοῦ Ἰησοῦ πληρωθῇ ὃν εἶπεν σημαίνων ποίῳ θανάτῳ ἤμελλεν ἀποθνῄσκειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/032.yaml
  text: so that the word of Jesus would be fulfilled[a], which he had spoken[c][b], indicating by what kind of death he was about to die.
translation:
  language: ar
  text: لكي تتم كلمة يسوع[a] التي قالها، مبيّنًا بها أيَّ نوعٍ من الموت كان مزمعًا أن يموت.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «قول يسوع».'
    reason: lexical_alternative
  - marker: b
    text: أي إن يسوع كان قد أشار إلى الكيفية التي سيموت بها، ويُرجَّح أن الإشارة كانت إلى الصلب. قارن يوحنا 12:32–33.
    reason: cross_reference
lexical_decisions:
- source_word: ἵνα
  choice: لكي
  rationale: تنقل غرض الجملة أو نتيجتها المقصودة بوضوح، مع إبقاء الصلة بما قبل الآية.
- source_word: ὁ λόγος τοῦ Ἰησοῦ
  choice: كلمة يسوع
  rationale: تشير هنا إلى قول نطق به يسوع، لا إلى لقب «الكلمة» في يوحنا 1:1؛ وأُبقي التعبير الحرفي المألوف مع توضيح البديل في الحاشية.
- source_word: πληρωθῇ
  choice: تتم
  rationale: تحفظ صيغة الإتمام ذات الدلالة اليوحناوية، وهي عربية طبيعية في سياق تحقق قول سابق.
- source_word: ὃν εἶπεν
  choice: التي قالها
  rationale: يعود الضمير الموصول إلى «كلمة»، وتؤدي الصياغة العربية المعنى السابق زمنيًا من غير حاجة إلى تركيب ثقيل.
- source_word: σημαίνων
  choice: مشيرًا بها
  rationale: تحفظ صيغة الحال في اليونانية وتوضح أن قول يسوع نفسه كان يشير إلى كيفية موته.
- source_word: ποίῳ θανάτῳ
  choice: إلى أيّ نوع من الموت
  rationale: تنقل ποῖος بوصفه سؤالًا عن نوع الموت أو طريقته، لا عن مجرد وقوعه.
- source_word: ἤμελλεν ἀποθνῄσκειν
  choice: كان مزمعًا أن يموت
  rationale: تعبير عربي فصيح عن المستقبل القريب أو المنتظر، من غير تحميل الفعل معنى حتميًا عقديًا أقوى مما يقتضيه النص.
theological_decisions:
- issue: لغة إتمام قول يسوع السابق
  choice: لكي تتم كلمة يسوع
  alternative: لكي يتحقق ما قاله يسوع
  rationale: الإبقاء على «تتم» يحفظ لفظ الإتمام ووزنه اللاهوتي في إنجيل يوحنا، بدل تسطيحه إلى مجرد تحقق تنبؤ.
- issue: دلالة μέλλω في موت يسوع
  choice: كان مزمعًا أن يموت
  alternative: كان مقدرًا له أن يموت
  rationale: الصياغة المختارة تدل على الموت الآتي أو الوشيك، ولا تستورد إلى هذه العبارة تقريرًا أقوى عن التقدير السابق.
- issue: كيفية موت يسوع
  choice: أيّ نوع من الموت
  alternative: بأي موت
  rationale: يحافظ النص على الإشارة العامة إلى نوع الموت، بينما توضح الحاشية الصلة المرجحة بالصلب من خلال يوحنا 12:32–33 من غير إدخال لفظ «الصلب» في المتن.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت «مشيرًا بها» لتجنب الغموض في مرجع الحال، و«مزمعًا» لملاءمة الأسلوب الكتابي من غير تقرير حتمية زائدة. جميع علامات الحواشي الواردة مثبتة في المتن.
