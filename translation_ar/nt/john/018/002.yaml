  yaml_path: translation/nt/john/018/002.yaml
  text: Judas, who was betraying him, also knew the place, because Jesus had often gathered there with his disciples.
translation:
  language: ar
  text: وكان يهوذا، الذي كان يخون يسوع[a]، يعرف المكان أيضًا، لأن يسوع كان كثيرًا ما يجتمع هناك مع تلاميذه[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كان يسلّم يسوع».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «كان كثيرًا ما يلتقي هناك بتلاميذه».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: كان يعرف
  rationale: يفيد الفعل οἶδα المعرفة أو الإلمام؛ وصيغة «كان يعرف» طبيعية في سياق السرد الماضي وتدل على معرفة يهوذا بالمكان.
- source_word: δὲ
  choice: و
  rationale: تؤدي الواو وظيفة الانتقال السردي الخفيف الذي تحمله δέ من غير أن توحي بتعارض قوي أو تضيف ظرفًا زمنيًا غير موجود في الأصل.
- source_word: καὶ
  choice: أيضًا
  rationale: تحفظ القوة الإضافية للكلمة، إذ تفيد أن يهوذا هو الآخر كان يعرف المكان.
- source_word: ὁ παραδιδοὺς αὐτὸν
  choice: الذي كان يخونه
  rationale: يحدد اسم الفاعل الحاضر دور يهوذا الجاري في أحداث الآلام. و«يخونه» تنقل المعنى الأخلاقي والسردي المقصود في السياق، مع إثبات البديل الحرفي في الحاشية.
- source_word: τὸν τόπον
  choice: المكان
  rationale: ترجمة مباشرة وطبيعية تشير إلى الموضع المعروف من السياق.
- source_word: ὅτι
  choice: لأن
  rationale: تقدم الجملة التالية بوصفها سبب معرفة يهوذا بالمكان.
- source_word: πολλάκις
  choice: كثيرًا ما
  rationale: تعبير عربي طبيعي يدل على تكرر الفعل مرات عديدة.
- source_word: συνήχθη
  choice: كان يجتمع
  rationale: يمكن فهم الصيغة المبنية للمجهول هنا بمعنى لازم هو الاجتماع. وهذه الصياغة تحافظ على دلالة التجمع وتلائم العربية المعاصرة.
- source_word: μετὰ τῶν μαθητῶν αὐτοῦ
  choice: مع تلاميذه
  rationale: تنقل معنى المصاحبة في μετά وتحافظ على لفظ «التلاميذ» الملائم لعلاقة المعلم بأتباعه في الإنجيل.
theological_decisions:
- issue: دلالة παραδιδοὺς في وصف يهوذا
  choice: يخونه
  alternative: يسلّمه
  rationale: في سياق آلام المسيح يدل الفعل على خيانة يهوذا لا على مجرد تسليم محايد. ومع ذلك تُحفظ الدلالة الحرفية الممكنة «يسلّمه» في الحاشية.
- issue: دلالة συνήχθη
  choice: كان يجتمع هناك مع تلاميذه
  alternative: كان يلتقي هناك بتلاميذه
  rationale: تسمح الصيغة اليونانية بمعنى لازم في هذا السياق. واختيار «يجتمع» أقرب إلى صورة التجمع في اللفظ الأصلي، من غير الإيحاء بأن طرفًا آخر كان يجمع يسوع قسرًا.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة ووقورة. استُخدمت «و» للانتقال السردي الخفيف، وحُفظ تتابع الجملة اليونانية بقدر يسمح به الأسلوب العربي الطبيعي، مع تجنب حسم البدائل المعجمية دون بيانها.
