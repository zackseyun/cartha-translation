base_translation:
  language: en
  yaml_path: translation/nt/john/018/026.yaml
  text: One of the high priest’s servants[a], being a relative of the man whose ear Peter had cut off, said, “Didn’t I see you in the garden with him?”
translation:
  language: ar
  text: 'قال أحد عبيد[a] رئيس الكهنة، وهو قريب للرجل الذي قطع بطرس أذنه: «ألم أرك أنا في البستان معه؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «خدم». يمكن أن تدل الكلمة اليونانية على العبيد أو الخدم بحسب السياق؛ واختيرت هنا «عبيد» لإبراز وضع التبعية الذي يفيده اللفظ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δούλων
  choice: عبيد
  rationale: يدل اللفظ هنا على أفراد من حاشية رئيس الكهنة كانوا في وضع عبودية، لا على خدم بالمعنى الوظيفي العام؛ لذلك يحافظ «عبيد» على الدلالة الاجتماعية للنص.
- source_word: ἀρχιερέως
  choice: رئيس الكهنة
  rationale: هو المقابل العربي المألوف للمنصب الكهنوتي الأعلى في سياق آلام يسوع.
- source_word: συγγενὴς ὢν
  choice: وكان من أقرباء
  rationale: تنقل العبارة الحالية معنى صلة القرابة بوضوح، وتحافظ على كونها وصفًا مصاحبًا للمتكلم.
- source_word: οὗ
  choice: الرجل الذي
  rationale: أُظهر مرجع اسم الموصول في العربية ليتضح أن الأذن كانت للرجل الذي تربطه بالمتكلم قرابة.
- source_word: ἀπέκοψεν
  choice: قطع
  rationale: فعل مباشر وطبيعي يفيد فصل الأذن؛ وتسلسل السرد العربي يوضح أن الحدث سبق هذا الكلام من غير حاجة إلى صيغة مركبة.
- source_word: ὠτίον
  choice: أذنه
  rationale: المقابل العربي الطبيعي؛ والضمير يبين صاحب الأذن بوضوح.
- source_word: Οὐκ ἐγώ σε εἶδον
  choice: ألم أرك أنا
  rationale: صيغة استفهام تتوقع جوابًا بالإيجاب، مع إبراز ضمير المتكلم كما يبرزه ἐγώ في اليونانية.
- source_word: ἐν τῷ κήπῳ
  choice: في البستان
  rationale: «البستان» تعبير عربي واضح وطبيعي عن κῆπος في موضع القبض على يسوع.
- source_word: μετ’ αὐτοῦ
  choice: معه
  rationale: ترجمة مباشرة، ومرجع الضمير إلى يسوع مفهوم من السياق.
theological_decisions:
- issue: ترجمة δοῦλος في سياق منزلي غير مجازي
  choice: عبيد
  alternative: خدم
  rationale: لا ينبغي تلطيف وضع العبودية الذي يدل عليه اللفظ في هذا السياق؛ فالمقصود أفراد تابعون لبيت رئيس الكهنة، مع إثبات البديل في الحاشية لبيان المجال الدلالي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حافظت الصياغة على نبرة السؤال الذي يتوقع الإقرار، وعلى توكيد المتكلم في «أنا»، من غير تكلف أو ألفاظ قديمة.
