base_translation:
  language: en
  yaml_path: translation/nt/john/018/023.yaml
  text: Jesus answered him[a], “If I spoke wrongly, testify about the wrong; but if rightly[b], why do you strike me?”
translation:
  language: ar
  text: 'فأجابه يسوع: «إن كنتُ قد تكلّمتُ خطأً، فاشهد على الخطأ؛ وإن كنتُ قد تكلّمتُ صوابًا، فلماذا تضربني؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη αὐτῷ Ἰησοῦς
  choice: فأجابه يسوع
  rationale: صياغة عربية طبيعية تحفظ فعل الجواب وضمير المخاطَب، وتربط الرد بالسياق السابق.
- source_word: Εἰ κακῶς ἐλάλησα
  choice: إن كنتُ قد تكلّمتُ خطأً
  rationale: يحفظ الشرط وتقابل الحالين κακῶς وκαλῶς، مع استعمال الماضي المركب الطبيعي للإشارة إلى الكلام السابق.
- source_word: μαρτύρησον περὶ τοῦ κακοῦ
  choice: فاشهد على الخطأ
  rationale: يحفظ فعل الشهادة ونبرته القضائية، ويُبقي τοῦ κακοῦ اسمًا يدل على الخطأ المزعوم من غير تضييقه إلى جريمة أو شر أخلاقي محدد.
- source_word: εἰ δὲ καλῶς
  choice: وإن كنتُ قد تكلّمتُ صوابًا
  rationale: أُعيد فعل الكلام المحذوف في اليونانية لتستقيم العبارة العربية، مع الحفاظ على المقابلة بين خطأً وصوابًا.
- source_word: τί με δέρεις
  choice: فلماذا تضربني؟
  rationale: ينقل τί بمعناه السببي الاصطلاحي، ويترجم δέρεις بالفعل العام «تضرب» من غير حصره في صفعة واحدة أو توسيعه إلى الضرب المتكرر.
theological_decisions:
- issue: طبيعة رد يسوع على العنف الواقع عليه
  choice: صياغته بوصفه احتجاجًا قضائيًا وأخلاقيًا مباشرًا يطالب بإثبات الخطأ
  alternative: تفسير العبارة تفسيرًا موسعًا بوصفها إدانة صريحة للمحاكمة أو تلطيف نبرتها القانونية
  rationale: النص نفسه يقابل بين الشهادة على الخطأ والضرب عند الكلام الصواب؛ لذلك تُحفظ حجته كما هي من غير إضافة تعليق عقائدي أو قانوني غير مصرح به.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُخدمت «خطأً/صوابًا» لإبراز التقابل، و«فاشهد» للمحافظة على الجو القضائي، و«تضربني» بوصفها أوسع مقابل عربي مناسب للفعل اليوناني.
