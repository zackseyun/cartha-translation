  yaml_path: translation/nt/john/018/024.yaml
  text: So Annas sent him bound to Caiaphas the high priest[a].
translation:
  language: ar
  text: فأرسله حنّان موثَقًا إلى قيافا رئيس الكهنة.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بحسب السياق: «وكان حنّان قد أرسله موثَقًا إلى قيافا رئيس الكهنة»، إذا عُدّت العبارة ملاحظة اعتراضية تشرح ما جرى سابقًا.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: أرسله
  rationale: فعل ماضٍ في السرد، والمقابل العربي الطبيعي المباشر هو «أرسل».
- source_word: οὖν
  choice: فـ
  rationale: تفيد الفاء الانتقال أو النتيجة السردية بإيجاز وطبيعية، وتحفظ قوة أداة الربط اليونانية.
- source_word: δεδεμένον
  choice: موثَقًا
  rationale: اسم مفعول يدل على حاله عند الإرسال؛ و«موثَقًا» تعبير عربي فصيح واضح لا يضيف تأكيد «ما زال» غير الصريح في النص.
- source_word: πρὸς
  choice: إلى
  rationale: تدل مع فعل الإرسال على الحركة باتجاه شخص.
- source_word: Καϊάφαν
  choice: قيافا
  rationale: الصيغة العربية الشائعة للاسم Καϊάφας.
- source_word: τὸν ἀρχιερέα
  choice: رئيس الكهنة
  rationale: المقابل العربي الراسخ للمنصب اليهودي ἀρχιερεύς، وهو هنا وصف لقيافا بصفته صاحب المنصب.
- source_word: ὁ Ἅννας
  choice: حنّان
  rationale: الصيغة العربية الكتابية الشائعة للاسم Ἅννας.
theological_decisions:
- issue: تسلسل الحدث بالنسبة إلى السياق المحيط
  choice: 'صياغة الفعل بوصفه حدثًا ماضيًا متتابعًا: «فأرسله حنّان»'
  alternative: 'فهم العبارة على أنها ملاحظة اعتراضية تسترجع حدثًا سابقًا: «وكان حنّان قد أرسله»'
  rationale: صيغة الماضي اليونانية تقرأ بطبيعتها خبرًا سرديًا. ولأن علاقة الآية بما قبلها تحتمل نقاشًا، لا يحسم المتن الإشكال بحل توفيقي، بل تُحفظ القراءة السياقية البديلة في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «موثَقًا» للدلالة على كونه مقيدًا، مع إبقاء الغموض المتعلق بالترتيب الزمني في الحاشية بدل حسمه في المتن.
