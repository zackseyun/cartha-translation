base_translation:
  language: en
  yaml_path: translation/nt/john/018/017.yaml
  text: So the servant girl who kept the door said to Peter[a], “You are not also one of this man's disciples, are you?” He said, “I am not.”
translation:
  language: ar
  text: 'فقالت الجارية[a] حارسةُ الباب لبطرس: «ألستَ أنت أيضًا من تلاميذ هذا الرجل؟» قال: «لستُ منهم».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «الفتاة الخادمة التي تحرس الباب»، أو «الأَمَة حارسة الباب».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: فـ
  rationale: تفيد الانتقال والنتيجة في سياق السرد، وصيغة الفاء طبيعية وموجزة في العربية.
- source_word: παιδίσκη
  choice: الجارية
  rationale: تدل على فتاة خادمة، وقد تُفهم أيضًا على أنها أَمَة؛ و«الجارية» تحافظ على دلالة السن والخدمة من غير الجزم بوضعها القانوني.
- source_word: θυρωρός
  choice: حارسة الباب
  rationale: تنقل وظيفة الفتاة بصياغة عربية واضحة وطبيعية.
- source_word: Μὴ καὶ σὺ
  choice: ألستَ أنت أيضًا
  rationale: يحافظ الاستفهام المنفي على توقّع جواب بالنفي، مع إبراز معنى «أيضًا».
- source_word: ἐκ τῶν μαθητῶν
  choice: من تلاميذ
  rationale: تعبير عربي طبيعي يحفظ معنى الانتماء إلى الجماعة.
- source_word: τοῦ ἀνθρώπου τούτου
  choice: هذا الرجل
  rationale: يحفظ اللفظ العادي ἄνθρωπος ونبرة الإشارة المتباعدة، من غير تحويله إلى لقب.
- source_word: ἐκεῖνος
  choice: قال
  rationale: مرجع الضمير واضح وهو بطرس، وتسمح العربية بحذفه في جملة القول من غير التباس.
- source_word: Οὐκ εἰμί
  choice: لستُ منهم
  rationale: يحفظ النفي المقتضب، ويُظهر في العربية المحذوف المفهوم من السؤال، أي أنه ليس من التلاميذ.
theological_decisions:
- issue: قوة السؤال المنفي الذي تصدّره μή
  choice: ألستَ أنت أيضًا من تلاميذ هذا الرجل؟
  alternative: أأنت أيضًا من تلاميذ هذا الرجل؟
  rationale: الصياغة المختارة تُبقي توقّع المتكلمة جوابًا بالنفي، وهو أثر نحوي وخطابي في اليونانية، من غير المبالغة في تحديد نبرتها.
- issue: الدلالة الاجتماعية لكلمة παιδίσκη
  choice: الجارية
  alternative: الأَمَة أو الفتاة الخادمة
  rationale: اللفظة قد تدل على خادمة أو أَمَة شابة. «الجارية» موجزة وتحافظ على هذا المجال الدلالي، مع بيان البدائل في الحاشية بدل الجزم بوضع قانوني لا يصرّح به السياق.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة، مع استفهام منفي طبيعي يحفظ توقع الجواب بالنفي. استُخدمت «الجارية» بوصفها لفظًا موجزًا، وأُثبت مجالها الدلالي في الحاشية.
