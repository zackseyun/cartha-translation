  text: ἵνα πληρωθῇ ὁ λόγος ὃν εἶπεν ὅτι Οὓς δέδωκάς μοι οὐκ ἀπώλεσα ἐξ αὐτῶν οὐδένα.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/009.yaml
  text: 'so that the word that he had spoken might be fulfilled: “Of those whom you have given me[a], I lost not one.”'
translation:
  language: ar
  text: 'لكي تتم الكلمة التي قالها: «الذين أعطيتني إياهم لم أفقد منهم أحدًا».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: لكي
  rationale: تفيد الغاية أو النتيجة، وتحافظ هنا على الصلة المقصودة بين حماية التلاميذ وإتمام قول يسوع.
- source_word: πληρωθῇ
  choice: تتم
  rationale: مبني للمجهول في اليونانية، لكن العربية الفصيحة تجيز إسناد التمام إلى الكلمة نفسها بصورة طبيعية؛ واللفظ يحفظ معنى تحقق القول من غير تحويله صراحة إلى نبوة كتابية.
- source_word: ὁ λόγος
  choice: الكلمة
  rationale: المقصود قول محدد سبق أن نطق به يسوع، و«الكلمة» تحافظ على التعبير اليوحناوي من غير الإيحاء هنا بلقب «الكلمة».
- source_word: ὃν εἶπεν
  choice: التي قالها
  rationale: صياغة عربية طبيعية تبين أن القول سبق الحدث الحالي، من غير حاجة إلى تركيب زمني ثقيل.
- source_word: ὅτι
  choice: علامة النقطتين
  rationale: تدخل مضمون القول، وعلامة النقطتين تمهد للاقتباس المباشر بوضوح.
- source_word: Οὓς δέδωκάς μοι
  choice: الذين أعطيتني إياهم
  rationale: تحفظ دلالة العطاء الموجَّه إلى يسوع، وتؤدي تمام الفعل اليوناني في سياق عربي طبيعي يدل على عطية قائمة الأثر.
- source_word: ἀπώλεσα
  choice: لم أفقد
  rationale: السياق هو حفظ التلاميذ الموكولين إلى يسوع، لذلك يفيد الفعل الفقد لا الإهلاك المتعمد، مع إبقاء الصدى اللفظي ليوحنا 17:12.
- source_word: ἐξ αὐτῶν οὐδένα
  choice: منهم أحدًا
  rationale: 'تنقل التركيب التبعي والتوكيد بالنفي نقلًا عربيًا موجزًا وطبيعيًا: لم يُفقد أي واحد من بينهم.'
theological_decisions:
- issue: طبيعة لغة الإتمام
  choice: «لكي تتم الكلمة» بوصفها تحققًا لقول يسوع السابق
  alternative: «لكي تتحقق الكلمة» أو «لكي تصدق الكلمة»
  rationale: يحفظ «تتم» الثقل اللاهوتي لصيغة الإتمام عند يوحنا من غير أن يضيف إلى النص وصف القول بأنه نبوة كتابية رسمية.
- issue: دلالة ἀπώλεσα في شأن التلاميذ
  choice: «لم أفقد» بمعنى حفظ من أُعطوا ليسوع
  alternative: «لم أُهلك» أو «لم أدع أحدًا منهم يهلك»
  rationale: المشهد يتناول حماية التلاميذ وقت القبض على يسوع، مع صدى يوحنا 17:12؛ و«أفقد» يبقي التوتر اليوحناوي ولا يفرض تصورًا عقائديًا أضيق.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. روعي ترتيب الاقتباس اليوناني مع تجنب الحرفية الثقيلة. لا توجد حاشية لازمة؛ فالبدائل الإنجليزية المذكورة لـ«منهم أحدًا» فروق أسلوبية يؤديها النص العربي نفسه بوضوح.
