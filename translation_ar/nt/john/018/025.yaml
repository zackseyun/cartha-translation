  text: Ἦν δὲ Σίμων Πέτρος ἑστὼς καὶ θερμαινόμενος. εἶπον οὖν αὐτῷ· Μὴ καὶ σὺ ἐκ τῶν μαθητῶν αὐτοῦ εἶ; ⸀ἠρνήσατο ἐκεῖνος καὶ εἶπεν· Οὐκ εἰμί.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/025.yaml
  text: Simon Peter was standing and warming himself. So they said to him[a], “You are not also one of his disciples, are you?” He denied it and said, “I am not.”
translation:
  language: ar
  text: 'وكان سمعان بطرس واقفًا يستدفئ. فقالوا له[a]: «لستَ أنت أيضًا من تلاميذه، أليس كذلك؟» فأنكر وقال: «لستُ».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أحقًّا لستَ أنت أيضًا من تلاميذه؟» صيغة السؤال في اليونانية، باستعمال μή، توحي بأن المتكلمين كانوا يتوقعون جوابًا بالنفي.'
    reason: بيان الدلالة التداولية لصيغة السؤال وذكر بديل ترجمي.
lexical_decisions:
- source_word: Ἦν δὲ Σίμων Πέτρος
  choice: وكان سمعان بطرس
  rationale: نُقلت δέ بواو استئنافية خفيفة تواصل السرد من غير أن تضيف معنى زمنيًا صريحًا أو تُبرز تعارضًا غير مقصود.
- source_word: ἑστὼς καὶ θερμαινόμενος
  choice: واقفًا يستدفئ
  rationale: يحفظ التعبير هيئة بطرس المستمرة وفعل تدفئته لنفسه، من غير إضافة «عند النار» لأنها مفهومة من السياق وليست مذكورة في هذه الآية.
- source_word: εἶπον οὖν αὐτῷ
  choice: فقالوا له
  rationale: الفاء تؤدي وظيفة οὖν في وصل الحدث بما سبقه على نحو طبيعي في السرد العربي، وصيغة الجمع في «قالوا» محفوظة.
- source_word: Μὴ καὶ σὺ ἐκ τῶν μαθητῶν αὐτοῦ εἶ;
  choice: لستَ أنت أيضًا من تلاميذه، أليس كذلك؟
  rationale: يحافظ التركيب على معنى الانتماء في ἐκ، وعلى «أيضًا» المقابلة لـ καὶ، ويُظهر أن صيغة السؤال تتوقع جوابًا بالنفي.
- source_word: ἠρνήσατο ἐκεῖνος καὶ εἶπεν
  choice: فأنكر وقال
  rationale: «أنكر» تنقل فعل الرفض وعدم الإقرار من غير توسيع مضمونه، ولا يلزم تمثيل ἐκεῖνος بضمير مستقل في العربية لأن الفاعل مفهوم وصيغة اللفظ تفيد إبراز بطرس في السياق.
- source_word: Οὐκ εἰμί
  choice: لستُ
  rationale: صياغة موجزة تحافظ على جواب اليونانية المقتضب، ويُفهم خبره المحذوف من السؤال السابق من غير إضافة «منهم» إلى النص.
theological_decisions:
- issue: نطاق إنكار بطرس
  choice: 'جُعل الإنكار منصبًّا، بحسب السؤال، على كونه واحدًا من تلاميذ يسوع، مع إبقاء الجواب نفسه مقتضبًا: «لستُ».'
  alternative: توسيعه إلى «لستُ واحدًا منهم» أو جعله إنكارًا عقائديًا أعم.
  rationale: النص اليوناني موجز ومحذوف الخبر، ويستمد معناه المباشر من السؤال؛ لذلك لا يُوسَّع الإنكار إلى معنى لاهوتي أشمل مما يصرح به السياق.
translation_notes:
  register: العربية فصحى حديثة واضحة ذات نبرة سردية رصينة. استُعمل «يستدفئ» بدل تعبير أطول، وحُفظ إيجاز جواب بطرس مع إبقاء الحذف المفهوم طبيعيًا بقدر الإمكان.
