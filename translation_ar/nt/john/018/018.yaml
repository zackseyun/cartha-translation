  text: The servants and the officers were standing there[a], having made a charcoal fire because it was cold, and they were warming themselves[b]. Peter also was standing with them and warming himself.
translation:
  language: ar
  text: وكان العبيد[a] والأعوان[b] واقفين، وقد أشعلوا نارًا من الفحم لأن الجو كان باردًا، وكانوا يستدفئون. وكان بطرس أيضًا واقفًا معهم يستدفئ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الخدم». يدل اللفظ اليوناني على أشخاص في خدمة البيت، ويُرجَّح في هذا السياق أنهم كانوا عبيدًا.
    reason: lexical_alternative
  - marker: b
    text: أو «الحرس». يشير اللفظ إلى أعوان أو موظفين رسميين ذوي مهام تنفيذية، ويُرجَّح أنهم كانوا تابعين للهيكل أو لرئاسة الكهنة.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλοι
  choice: العبيد
  rationale: ينقل اللفظ الوضع الاجتماعي المقيَّد الذي يدل عليه الاسم غالبًا في هذا السياق، مع إثبات البديل الأوسع «الخدم» في الحاشية.
- source_word: ὑπηρέται
  choice: الحرس
  rationale: يشير اللفظ في سياق يوحنا إلى أعوان رسميين ذوي مهام تنفيذية تابعين للمؤسسة الدينية؛ و«الحرس» واضح للقارئ، مع ذكر «الأعوان» بديلًا أقل تخصيصًا.
- source_word: ἀνθρακιὰν
  choice: نارًا من الفحم
  rationale: يحفظ التفصيل المادي المحدد، وهو نار الفحم لا مجرد نار عامة، بصياغة عربية طبيعية.
- source_word: πεποιηκότες
  choice: وقد أوقدوا
  rationale: تؤدي معنى الفعل المنجز الذي بقيت نتيجته حاضرة، أي أن النار كانت قد أُوقدت وهم واقفون حولها.
- source_word: ὅτι ψῦχος ἦν
  choice: لأن الجو كان باردًا
  rationale: يحفظ العلاقة السببية بوضوح، وتعبير «الجو كان باردًا» طبيعي في العربية المعاصرة.
- source_word: ἐθερμαίνοντο
  choice: كانوا يستدفئون
  rationale: ينقل الفعل المستمر ومعناه الانعكاسي الطبيعي في العربية من غير إضافة غير منصوص عليها.
- source_word: ἑστὼς καὶ θερμαινόμενος
  choice: واقفًا معهم يستدفئ
  rationale: يحفظ تزامن الوقوف والاستدفاء واستمرار الحالين بصياغة عربية موجزة وطبيعية.
- source_word: δέ
  choice: الواو في «وكان»
  rationale: تنقل الربط السردي الخفيف من غير إدخال ظرف زمني صريح أو إبراز مقابلة قوية.
