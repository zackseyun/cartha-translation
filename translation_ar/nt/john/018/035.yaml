  text: ἀπεκρίθη ὁ Πιλᾶτος· Μήτι ἐγὼ Ἰουδαῖός εἰμι; τὸ ἔθνος τὸ σὸν καὶ οἱ ἀρχιερεῖς παρέδωκάν σε ἐμοί· τί ἐποίησας;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/035.yaml
  text: Pilate answered[a], “I am not a Jew, am I? Your own nation and the chief priests handed you over to me. What have you done?”
translation:
  language: ar
  text: 'أجاب بيلاطس: «وهل أنا يهوديّ[a]؟ أمتك ورؤساء الكهنة سلّموك إليّ. ماذا فعلت؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «من أهل اليهودية». قد تشير الكلمة اليونانية إلى هوية قومية أو دينية («يهودي»)، أو إلى انتماء إقليمي («من أهل اليهودية»)، بحسب السياق.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: أجاب
  rationale: فعل سردي مألوف وواضح يدل على الرد في الحوار.
- source_word: Μήτι
  choice: وهل أنا...؟
  rationale: صيغة استفهام إنكاري طبيعية في العربية، تنقل توقّع جواب بالنفي دون إضافة معنى غير موجود في الأصل.
- source_word: Ἰουδαῖός
  choice: يهوديّ
  rationale: السياق يقابل بيلاطس بأمة يسوع ورؤساء كهنتها، ولذلك تلائم هنا الدلالة القومية والدينية الأوسع، مع إثبات احتمال الدلالة الإقليمية في الحاشية.
- source_word: τὸ ἔθνος τὸ σὸν
  choice: أمتك
  rationale: تنقل ἔθνος والدلالة الملكية المؤكدة بإيجاز عربي طبيعي، وتحافظ على نبرة المباعدة في كلام بيلاطس.
- source_word: οἱ ἀρχιερεῖς
  choice: رؤساء الكهنة
  rationale: المقابل العربي المألوف والدقيق لجماعة القيادات الكهنوتية في أورشليم.
- source_word: παρέδωκάν σε ἐμοί
  choice: سلّموك إليّ
  rationale: يحفظ معنى تسليم شخص إلى السلطة من غير تحميل العبارة هنا معنى الخيانة صراحة.
- source_word: τί ἐποίησας
  choice: ماذا فعلت؟
  rationale: ينقل السؤال المباشر عن الفعل الذي أدى إلى مثول يسوع أمام بيلاطس بصياغة عربية واضحة.
theological_decisions:
- issue: دلالة Ἰουδαῖός في إنجيل يوحنا
  choice: يهوديّ
  alternative: من أهل اليهودية
  rationale: قد تدل الكلمة بحسب السياق على الهوية القومية أو الدينية، أو على الانتماء الإقليمي إلى اليهودية. اقترانها هنا بعبارة «أمتك» يرجّح المعنى القومي الأوسع، مع إبقاء الاحتمال الإقليمي في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُخدم «وهل أنا يهوديّ؟» استفهامًا إنكاريًا طبيعيًا ينقل قوة Μήτι، مع تجنّب تركيب ذيلي متكلّف في العربية.
