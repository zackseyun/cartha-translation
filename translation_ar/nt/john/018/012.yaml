translation:
  language: ar
  text: فالكتيبة والقائد وحرس اليهود[a] أمسكوا بيسوع وأوثقوه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «حرس قادة اليهود»، أو «حرس أهل اليهودية»، بحسب السياق؛ فكثيرًا ما يستعمل يوحنا تعبير «اليهود» بمعنى أخصّ من الشعب اليهودي كله.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: فـ
  rationale: تفيد مواصلة السرد والنتيجة المترتبة على المشهد السابق، وهي طبيعية وموجزة في العربية.
- source_word: σπεῖρα
  choice: الكتيبة
  rationale: تحافظ على الدلالة العسكرية المحددة للمصطلح من غير إضافة «رومانية»، إذ لا تَرِد هذه الصفة صراحة في اللفظ اليوناني.
- source_word: χιλίαρχος
  choice: القائد
  rationale: تؤدي معنى الضابط المسؤول عن الكتيبة بلغة عربية واضحة، من غير استعمال لقب تاريخي غامض لدى القارئ العام.
- source_word: ὑπηρέται
  choice: حَرَس
  rationale: يدل السياق على رجال رسميين شاركوا في القبض، لا على خدم منزليين. ولفظ «حَرَس» واضح ولا يحددهم تحديدًا زائدًا مثل «شرطة الهيكل».
- source_word: τῶν Ἰουδαίων
  choice: اليهود
  rationale: ترجمة مباشرة للعبارة اليونانية، مع إبقاء احتمال دلالتها السياقية الأضيق في الحاشية بدل حسمه داخل المتن.
- source_word: συνέλαβον
  choice: أمسكت ... بيسوع
  rationale: يحفظ معنى الإمساك والسيطرة الجسدية، من غير قصر الفعل على الإجراء القانوني الذي قد يوحي به «ألقت القبض».
- source_word: ἔδησαν
  choice: أوثقوه
  rationale: تعبير عربي فصيح طبيعي يدل على تقييده وربطه، ويحافظ على أسلوب السرد الوقور.
theological_decisions:
- issue: مرجع ودلالة τῶν Ἰουδαίων في إنجيل يوحنا
  choice: «اليهود» في المتن
  alternative: «قادة اليهود» أو «اليهوديون»
  rationale: يحافظ المتن على صياغة الأصل ولا يحسم الجدل الدلالي المتعلق باستعمال يوحنا لهذا التعبير. وتوضح الحاشية أن المقصود قد يكون جماعة أضيق من الشعب اليهودي كله، منعًا لفهم العبارة على نحو تعميمي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختيرت ألفاظ عسكرية ومؤسسية مفهومة، مع تجنب الإضافات التفسيرية غير الصريحة في الأصل. أُثبتت علامة الحاشية [a] في المتن.
