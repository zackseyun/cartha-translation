  text: After saying these things[a], Jesus went out with his disciples across the Kidron Valley, where there was a garden, into which he and his disciples entered.
translation:
  language: ar
  text: وبعد أن قال يسوع هذه الأمور، خرج مع تلاميذه إلى الجهة الأخرى من وادي قدرون[a]، حيث كان بستان، فدخله هو وتلاميذه.
  philosophy: optimal-equivalence
  footnotes:
