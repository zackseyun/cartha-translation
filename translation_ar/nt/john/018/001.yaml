    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα εἰπὼν
  choice: وبعدما قال يسوع هذا
  rationale: صيغت العبارة كجملة زمنية طبيعية تؤدي معنى اسم الفاعل الماضي وتوضح تعاقب الأحداث، مع إبقاء «هذا» مفردًا جمعي الدلالة في العربية للإشارة إلى الكلام السابق.
- source_word: ἐξῆλθεν
  choice: خرج
  rationale: ينقل المعنى الحركي المباشر للفعل ويحافظ على بساطة الأسلوب السردي عند يوحنا.
- source_word: σὺν τοῖς μαθηταῖς αὐτοῦ
  choice: مع تلاميذه
  rationale: تعبير عربي واضح وطبيعي عن المصاحبة التي تفيدها σύν مع المجرور.
- source_word: πέραν τοῦ χειμάρρου τοῦ Κεδρών
  choice: إلى الجهة الأخرى من وادي قدرون
  rationale: «إلى الجهة الأخرى» تؤدي معنى الوصول إلى الجانب المقابل، و«وادي» ملائم لمجرى الماء الموسمي الذي تدل عليه χείμαρρος، مع نقل الاسم العلم «قدرون» بصيغته العربية المألوفة.
- source_word: ὅπου ἦν κῆπος
  choice: حيث كان بستان
  rationale: يحافظ على دلالة الوجود في العبارة اليونانية، و«بستان» لفظ عربي مفهوم وطبيعي لـ κῆπος.
- source_word: εἰς ὃν εἰσῆλθεν
  choice: فدخله
  rationale: يؤدي الاتجاه إلى داخل البستان بعبارة عربية موجزة وطبيعية، وتفيد الفاء تعاقب الدخول على الوصول إلى الموضع.
- source_word: αὐτὸς καὶ οἱ μαθηταὶ αὐτοῦ
  choice: هو وتلاميذه
  rationale: إثبات الضمير المنفصل يحافظ على حضور αὐτός في النص من غير تحميله توكيدًا زائدًا مثل «هو نفسه».
