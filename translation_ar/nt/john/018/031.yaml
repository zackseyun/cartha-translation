  text: εἶπεν οὖν αὐτοῖς ⸀ὁ Πιλᾶτος· Λάβετε αὐτὸν ὑμεῖς, καὶ κατὰ τὸν νόμον ὑμῶν κρίνατε αὐτόν. ⸀εἶπον αὐτῷ οἱ Ἰουδαῖοι· Ἡμῖν οὐκ ἔξεστιν ἀποκτεῖναι οὐδένα·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/031.yaml
  text: So Pilate said to them[a], “Take him yourselves and judge him according to your law.” The Jews said to him, “It is not lawful for us to put anyone to death.”
translation:
  language: ar
  text: 'فقال لهم بيلاطس: «خذوه أنتم، واحكموا عليه بحسب شريعتكم». فقال له اليهود[a]: «لا يحلّ لنا أن نقتل أحدًا».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: المقصود في هذا السياق السلطات اليهودية أو المشتكون اليهود الذين كانوا يخاطبون بيلاطس، لا الشعب اليهودي كله.
    reason: توضيح المرجع السياقي لعبارة οἱ Ἰουδαῖοι وتفادي تعميمها على جميع اليهود.
lexical_decisions:
- source_word: οὖν
  choice: فـ
  rationale: فاء الاستئناف تنقل سير الحوار ونتيجته طبيعيًا في العربية من غير إثقال النص بـ«لذلك».
- source_word: Λάβετε αὐτὸν ὑμεῖς
  choice: خذوه أنتم
  rationale: يحافظ الضمير المنفصل «أنتم» على توكيد الفاعل الصريح ὑμεῖς، بينما يعود ضمير المفعول على يسوع.
- source_word: κατὰ τὸν νόμον ὑμῶν
  choice: بحسب شريعتكم
  rationale: تؤدي «بحسب» معنى المطابقة للمعيار في κατά، وتحافظ «شريعتكم» على إحالة بيلاطس إلى ناموسهم بصيغة التباعد.
- source_word: κρίνατε αὐτόν
  choice: احكموا عليه
  rationale: صياغة عربية طبيعية تحفظ المجال القضائي الواسع للفعل κρίνω من غير حصره في محاكمة رومانية رسمية.
- source_word: οἱ Ἰουδαῖοι
  choice: اليهود
  rationale: ترجمة مباشرة للعبارة اليونانية، مع حاشية توضّح أن المرجع السياقي هو السلطات أو المشتكون اليهود الحاضرون أمام بيلاطس، لا الشعب اليهودي كله.
- source_word: Ἡμῖν οὐκ ἔξεστιν
  choice: لا يحلّ لنا
  rationale: تعبير عربي فصيح ومألوف يدل على عدم الجواز أو المشروعية في هذا السياق القانوني.
- source_word: ἀποκτεῖναι οὐδένα
  choice: أن نقتل أحدًا
  rationale: يحافظ «نقتل» على الدلالة الأساسية للفعل من غير تضييقها إلى مصطلح «نُعدم»، فيما يظل السياق القضائي دالًا على القتل تنفيذًا للحكم.
theological_decisions:
- issue: مرجع οἱ Ἰουδαῖοι في سياق محاكمة يسوع
  choice: إبقاء «اليهود» في المتن مع حاشية سياقية
  alternative: «زعماء اليهود» أو «السلطات اليهودية»
  rationale: يحفظ الاختيار صيغة الأصل وما فيها من سعة دلالية، بينما تمنع الحاشية تعميم الإشارة على الشعب اليهودي كله؛ فالمتكلمون هنا هم الحاضرون لدى بيلاطس من السلطات أو المشتكين.
- issue: دلالة ἀποκτεῖναι في التبادل القضائي
  choice: «أن نقتل»
  alternative: «أن نُعدم» أو «أن نميت أحدًا»
  rationale: «نقتل» أقرب إلى المعنى المعجمي العام، ولا تحسم أكثر مما يحسمه اللفظ اليوناني، مع بقاء القوة القضائية واضحة من السياق.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «شريعتكم» لملاءمته السياق الكتابي والقانوني، و«لا يحلّ لنا» للتعبير الطبيعي عن عدم الجواز. وُضع مؤشر الحاشية بعد «اليهود» لأنه اللفظ الذي توضحه الحاشية.
