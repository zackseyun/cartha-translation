  text: Why do you question me? Question those who have heard what I said to them. Look[a], they know what I said.
translation:
  language: ar
  text: «لِمَ تسألني؟ اسأل الذين سمعوا ما قلته لهم. ها هم يعرفون ما قلتُه أنا».[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لِمَ تستجوبني؟ استجوب الذين سمعوا ما قلته لهم». يدل الفعل اليوناني بوجه عام على السؤال، وقد تلائم ترجمة «استجوب» سياق التحقيق الرسمي، لكنها أضيق دلالة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί με ἐρωτᾷς
  choice: لِمَ تستجوبني؟
  rationale: يفيد التركيب سؤالًا اعتراضيًا مباشرًا. واختيار «تستجوبني» يلائم سياق التحقيق الرسمي أمام رئيس الكهنة، مع بقاء معنى السؤال حاضرًا.
- source_word: ἐρώτησον
  choice: استجوب
  rationale: صيغة الأمر تدعو إلى توجيه السؤال مباشرة إلى السامعين، وتكرار «استجوب» يحفظ التوازي مع الفعل السابق والنبرة القضائية من غير المبالغة إلى معنى «امتحن» أو «حقّق».
- source_word: τοὺς ἀκηκοότας
  choice: الذين سمعوا
  rationale: اسم الفاعل التام يدل على أشخاص سمعوا كلام يسوع وصاروا شهودًا عليه. وهذه الصياغة العربية طبيعية ولا تضيف مفعولًا غير مصرح به.
- source_word: τί ἐλάλησα αὐτοῖς
  choice: ما قلته لهم
  rationale: ينقل المعنى الشائع للفعل λαλέω في هذا السياق بعبارة عربية طبيعية ودقيقة، من غير إيحاء زائد بالتعليم أو الإخبار.
- source_word: ἴδε
  choice: ها هم
  rationale: أداة تنبيه وإشارة إلى المذكورين الحاضرين أو المتاح سؤالهم. «ها هم» تحفظ قوة لفت الانتباه وتتصل طبيعيًا بضمير الإشارة التالي.
- source_word: οὗτοι οἴδασιν
  choice: هم يعرفون
  rationale: اقتران «ها» بـ«هم» ينقل القوة الإشارية والتوكيدية في οὗτοι، بينما «يعرفون» تعبير عربي طبيعي عن علمهم بمضمون كلامه.
- source_word: ἃ εἶπον ἐγώ
  choice: ما قلتُه أنا
  rationale: يحفظ «ما قلتُه» مضمون الموصول، ويُظهر الضمير المنفصل «أنا» توكيد ἐγώ الصريح في اليونانية.
theological_decisions:
- issue: النبرة القضائية في جواب يسوع أمام رئيس الكهنة
  choice: ترجمة ἐρωτάω في الموضعين بـ«استجوب»
  alternative: ترجمته بـ«سأل» في الموضعين
  rationale: السياق تحقيق رسمي، و«استجوب» ينقل هذه النبرة مع المحافظة على التوازي اللفظي. لكن الفعل اليوناني نفسه يمكن أن يُفهم على نحو أعم بوصفه سؤالًا، لذلك يُذكر البديل في الحاشية من غير حسم دلالي زائد.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُخدمت «لِمَ» للإيجاز الطبيعي، وحُفظ التوازي بين الفعلين، كما حُفظ توكيد الضمير اليوناني الأخير بصيغة «أنا».
