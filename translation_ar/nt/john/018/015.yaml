  register: عربية فصحى حديثة واضحة ذات نبرة سردية وقورة. حُفظ استمرار فعل الاتباع، واستُخدمت «لدى» لتجنب الإيحاء بعلاقة حميمة غير مصرّح بها. وُضعت علامة الحاشية بعد الجملة التي تُظهر الفعل الضمني، مع إبقاء الفاصلة الختامية لأن الآية تتصل نحويًا بما بعدها.
