lexical_decisions:
- source_word: Ἠκολούθει
  choice: كان يتبع
  rationale: صيغة الماضي الناقص تدل على فعل مستمر في سياق السرد، و«كان يتبع» تنقل هذا الجانب بوضوح.
- source_word: δὲ
  choice: الواو
  rationale: أداة ربط خفيفة تواصل السرد، وتنقلها الواو طبيعيًا من غير إقحام معنى زمني أو تضاد قوي.
- source_word: καὶ ἄλλος μαθητής
  choice: وكذلك تلميذ آخر
  rationale: يفهم من العطف أن التلميذ الآخر كان يتبع يسوع أيضًا؛ و«كذلك» تُظهر الفعل المشترك طبيعيًا، مع توضيح رسمي في الحاشية.
- source_word: μαθητής
  choice: تلميذ
  rationale: المقابل العربي المألوف والدقيق في إنجيل يوحنا لمن يتعلم من يسوع ويتبعه.
- source_word: ἐκεῖνος
  choice: ذلك
  rationale: اسم الإشارة يعود إلى «تلميذ آخر» المذكور قبله ويحافظ على الإحالة النصية.
- source_word: γνωστὸς
  choice: معروفًا لدى
  rationale: ينقل كونه معروفًا لرئيس الكهنة من غير المبالغة في درجة العلاقة كما قد توحي «مقرّبًا».
- source_word: ἀρχιερεῖ / ἀρχιερέως
  choice: رئيس الكهنة
  rationale: المقابل الاصطلاحي القياسي للمفرد ἀρχιερεύς في هذا السياق.
- source_word: συνεισῆλθεν
  choice: دخل مع
  rationale: ينقل معنى الدخول المصاحب الذي تحمله السابقة σύν بعبارة عربية مباشرة.
- source_word: αὐλήν
  choice: فناء دار
  rationale: تشير الكلمة هنا إلى الساحة الداخلية المسوّرة التابعة لمقر رئيس الكهنة؛ وإضافة «دار» توضّح موضع الفناء من غير تحويله إلى قصر.
