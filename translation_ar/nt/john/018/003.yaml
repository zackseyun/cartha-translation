base_translation:
  language: en
  yaml_path: translation/nt/john/018/003.yaml
  text: So Judas[a], having taken the cohort and officers from the chief priests and from the Pharisees[b], comes there with lanterns and torches and weapons.
translation:
  language: ar
  text: فأخذ يهوذا الكتيبة[a] وأعوانًا من رؤساء الكهنة ومن الفريسيين[b]، وجاء إلى ذلك الموضع ومعه فوانيس ومشاعل وأسلحة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أن تعني «مفرزة عسكرية» أو «فرقة من الجنود». فاللفظ اليوناني يشير إلى وحدة عسكرية، ولا يقتضي أن الكتيبة كلها كانت حاضرة.
    reason: lexical_alternative
  - marker: b
    text: يمكن ترجمتها أيضًا «خدمًا رسميين» أو «شرطة الهيكل». والمقصود أعوان رسميون تابعون للسلطات اليهودية.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: فـ
  rationale: تربط الجملة بما قبلها بوصفها استمرارًا ونتيجةً في سياق السرد، من غير إثقال العبارة بأداة استنتاج رسمية.
- source_word: λαβὼν
  choice: أخذ
  rationale: ينقل الفعل السابق للمجيء بصيغة عربية طبيعية، مع بقاء ترتيب الحدثين واضحًا.
- source_word: σπεῖραν
  choice: الكتيبة
  rationale: يحافظ على الدلالة العسكرية التاريخية للمصطلح، مع توضيح في الحاشية أنه لا يلزم منه حضور الكتيبة بكاملها.
- source_word: ὑπηρέτας
  choice: حرسًا
  rationale: السياق يدل على أعوان رسميين تابعين للسلطات اليهودية ومشاركين في القبض، و«حرس» أوضح للقارئ من «خدم» التي قد توحي بخدمة منزلية.
- source_word: ἀρχιερέων
  choice: رؤساء الكهنة
  rationale: التعبير العربي المألوف عن القيادات الكهنوتية التي يشير إليها الجمع اليوناني.
- source_word: Φαρισαίων
  choice: الفريسيين
  rationale: النقل العربي المعياري لاسم الجماعة.
- source_word: ἔρχεται
  choice: جاء
  rationale: المضارع التاريخي اليوناني يؤدي وظيفة سردية حية، لكن الماضي هو الأسلوب الطبيعي الواضح في السرد العربي هنا، ولا يغير زمن الحدث.
- source_word: ἐκεῖ
  choice: إلى هناك
  rationale: يحيل بإيجاز إلى الموضع المذكور في السياق السابق.
- source_word: φανῶν
  choice: فوانيس
  rationale: يدل على وسائل إنارة محمولة، ويحافظ على تمييزها من المشاعل المذكورة بعدها.
- source_word: λαμπάδων
  choice: مشاعل
  rationale: ينقل المعنى المعتاد للمصطلح ويحفظ ازدواج نوعي وسائل الإنارة في الأصل.
- source_word: ὅπλων
  choice: أسلحة
  rationale: لفظ عربي عام وواضح لأدوات القتال، من غير تخصيص لنوع لم يذكره النص.
theological_decisions:
- issue: هوية القوة التي جاءت للقبض على يسوع وتركيبها
  choice: الكتيبة وحرس من عند رؤساء الكهنة ومن عند الفريسيين
  alternative: جماعة من الجنود وخدم تابعون للسلطات اليهودية
  rationale: يحفظ النص تمييزه بين القوة العسكرية والأعوان الرسميين القادمين من القيادات اليهودية، من غير تحديد عدد الجنود أو الجزم بأن الوحدة العسكرية حضرت بكاملها.
translation_notes:
  register: لغة عربية فصحى معاصرة واضحة ووقورة. استُعمل «فوانيس» و«مشاعل» للمحافظة على التمييز بين اللفظين اليونانيين، وصيغت الجملة بالماضي لأنه الأنسب للسرد العربي الطبيعي.
