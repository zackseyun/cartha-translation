source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Εἶπον ὑμῖν ὅτι ἐγώ εἰμι· εἰ οὖν ἐμὲ ζητεῖτε, ἄφετε τούτους ὑπάγειν·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/008.yaml
  text: Jesus answered[a], “I told you that I am he. So if you are seeking me, let these men go.”
translation:
  language: ar
  text: 'أجاب يسوع: «قلت لكم: أنا هو[a]. فإن كنتم تطلبونني، فدعوا هؤلاء يذهبون».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمتها: «أنا». فالعبارة اليونانية لا تذكر خبرًا بعد «أنا»، لكن السياق يدل على أن يسوع يعرّف نفسه بأنه الشخص الذي يطلبونه.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: أجاب
  rationale: الصياغة السردية العربية المألوفة لفعل الجواب في الحوار، وهي واضحة ورصينة.
- source_word: Εἶπον ὑμῖν
  choice: قلت لكم
  rationale: ينقل الماضي اليوناني والمفعول غير المباشر نقلًا مباشرًا وطبيعيًا، مع الإشارة إلى قول يسوع السابق.
- source_word: ἐγώ εἰμι
  choice: أنا هو
  rationale: تؤدي معنى التعريف بالشخص المطلوب في هذا السياق، مع إبقاء الصياغة قريبة من العبارة اليونانية المطلقة وعدم حسم إيحائها اللاهوتي.
- source_word: ζητεῖτε
  choice: تطلبونني
  rationale: يفيد البحث عن شخص بعينه، وهو تعبير عربي فصيح ومباشر يلائم مشهد القبض.
- source_word: ἄφετε
  choice: دعوا
  rationale: ينقل صيغة الأمر الدالة هنا على السماح، من غير أن يضيف معنى الاحتجاز أو الإفراج الرسمي.
- source_word: τούτους
  choice: هؤلاء
  rationale: يحافظ على اسم الإشارة كما في اليونانية، ومرجعه إلى رفاق يسوع واضح من السياق.
- source_word: ὑπάγειν
  choice: يذهبون
  rationale: ينقل معنى المغادرة المأذون بها بإيجاز وطبيعية، دون تشديد زائد على الابتعاد.
theological_decisions:
- issue: دلالة العبارة ἐγώ εἰμι في سياق إنجيل يوحنا
  choice: أنا هو
  alternative: أنا
  rationale: السياق المباشر سياق تعريف يسوع بأنه الشخص الذي يطلبونه، لذلك توضح «أنا هو» هذا المعنى. وفي الوقت نفسه قد تحمل العبارة اليونانية المطلقة صدى لاهوتيًا في إنجيل يوحنا؛ لذا تُحفظ الصيغة الأقرب حرفيًا «أنا» في الحاشية بدل إلغاء هذا التوتر أو الجزم بتفسير واحد.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُعملت صياغة موجزة تحافظ على بنية الحوار، ووُضعت علامة الحاشية مباشرة بعد العبارة التي تشرحها.
