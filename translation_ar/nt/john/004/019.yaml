  text: λέγει αὐτῷ ἡ γυνή· Κύριε, θεωρῶ ὅτι προφήτης εἶ σύ.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/019.yaml
  text: The woman said to him[a], “Lord, I see that you are a prophet.”
translation:
  language: ar
  text: 'قالت له المرأة: «يا رب[a]، أرى أنك نبي».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يا سيدي». يمكن أن تكون الكلمة اليونانية Κύριε صيغة خطاب احترام، كما يمكن أن تعني «يا رب».'
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει
  choice: قالت
  rationale: المضارع السردي اليوناني يُنقل طبيعيًا في العربية بالفعل الماضي، مع تأنيثه لموافقة «المرأة».
- source_word: αὐτῷ
  choice: له
  rationale: ينقل ضمير المفعول غير المباشر في صيغة عربية موجزة وطبيعية.
- source_word: ἡ γυνή
  choice: المرأة
  rationale: يشير السياق إلى المرأة السامرية، لا إلى زوجة.
- source_word: Κύριε
  choice: يا رب
  rationale: ترجمة مباشرة لصيغة النداء، مع إبقاء احتمال كونها خطاب احترام بمعنى «يا سيدي» في الحاشية.
- source_word: θεωρῶ
  choice: أرى
  rationale: تفيد هنا الإدراك والاستنتاج مما كشفه يسوع، و«أرى» واضحة وطبيعية وتحفظ اتساع الدلالة.
- source_word: ὅτι
  choice: أنك
  rationale: تدخل مضمون إدراك المرأة في تركيب عربي سليم.
- source_word: προφήτης
  choice: نبي
  rationale: الخبر اليوناني غير المعرّف يدل هنا على أنها تدرك أنه نبي، لا أنه بالضرورة «النبي» المعيّن.
- source_word: σύ
  choice: الكاف في «أنك»
  rationale: ينقل ضمير المخاطب الصريح؛ ولا يلزم إبراز إضافي في العربية لأن السياق والتركيب يؤديان المعنى طبيعيًا.
theological_decisions:
- issue: دلالة Κύριε في خطاب المرأة ليسوع
  choice: يا رب
  alternative: يا سيدي
  rationale: يمكن أن تكون الكلمة اعترافًا بلقب «الرب»، ويمكن في هذا الموضع أن تكون مجرد خطاب احترام. أُبقيت «يا رب» في المتن وحُفظ الاحتمال الآخر في الحاشية دون حسم تطور فهم المرأة للمسيح.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة، مع الحفاظ على إيقاع الحوار ولباقة خطاب المرأة، وعلى الغموض الدلالي المقصود في لقب Κύριε.
