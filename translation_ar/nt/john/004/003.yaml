  footnotes:
  - marker: a
    text: 'أو: «وذهب ثانيةً إلى الجليل». يمكن أن تعني الكلمة اليونانية πάλιν «ثانيةً»، لكنها هنا على الأرجح تفيد العودة، ولذلك تُرجمت «رجع».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφῆκεν
  choice: ترك
  rationale: الفعل هنا يعني مغادرة مكان وتركه وراءه، و«ترك» تعبير عربي مباشر وطبيعي مع «اليهودية» مفعولًا به.
- source_word: τὴν Ἰουδαίαν
  choice: اليهودية
  rationale: الاسم الجغرافي المألوف للإقليم في سياق الإنجيل.
- source_word: ἀπῆλθεν
  choice: رجع
  rationale: يدل الفعل على الذهاب والمغادرة، ومع πάλιν في سياق الرحلة يصح في العربية جمع المعنيين في «رجع» للدلالة على العودة إلى الوجهة.
- source_word: πάλιν
  choice: رجع
  rationale: تدل الكلمة هنا على الأرجح على العودة، لا مجرد تكرار الفعل؛ لذلك أُدمج معناها طبيعيًا في «رجع»، مع إثبات البديل الحرفي في الحاشية.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: إلى الجليل
  rationale: حرف الجر εἰς يدل على الاتجاه نحو وجهة، و«إلى الجليل» هو التعبير العربي الطبيعي.
