- source_word: πόλιν
  choice: المدينة
  rationale: ينقل المعنى المعتاد لـ πόλις في السياق، مع أداة التعريف المطابقة للنص.
- source_word: τοῖς ἀνθρώποις
  choice: للناس
  rationale: صياغة عربية جامعة وطبيعية تقابل الجمع العام ἀνθρώποις دون تخصيصه بالرجال.
- source_word: λέγει
  choice: تقول
  rationale: حُفظ المضارع التاريخي في اليونانية لإبراز حيوية السرد، بدل تحويله إلى الماضي.
