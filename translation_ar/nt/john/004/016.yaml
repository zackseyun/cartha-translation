lexical_decisions:
- source_word: Λέγει
  choice: قال
  rationale: المضارع اليوناني هنا مضارع تاريخي شائع في السرد؛ وصيغة الماضي «قال» هي الأسلوب الطبيعي الواضح في السرد العربي.
- source_word: αὐτῇ
  choice: لها
  rationale: ضمير في حالة المجرور الدالة هنا على المخاطَبة غير المباشرة، ويقابله طبيعيًا «لها».
- source_word: Ὕπαγε
  choice: اذهبي
  rationale: فعل أمر للمفرد المؤنث يطلب منها الانصراف لتنفيذ الأمر التالي؛ و«اذهبي» مقابل موجز وطبيعي.
- source_word: φώνησον
  choice: ادعي
  rationale: فعل أمر بمعنى النداء أو الاستدعاء؛ و«ادعي» مناسب للسياق وأشيع من «استدعي» الرسمية.
- source_word: τὸν ἄνδρα σου
  choice: زوجك
  rationale: لفظة ἀνήρ قد تعني «رجلًا» أو «زوجًا»، لكن تركيبها مع ضمير الملكية والسياق الأسري يرجّحان «زوجك».
- source_word: καὶ
  choice: و
  rationale: حرف عطف بسيط يصل بين فعلي الأمر.
- source_word: ἐλθὲ
  choice: تعالي
  rationale: فعل أمر للمفرد المؤنث من فعل المجيء؛ ولا يصرّح الأصل بمعنى «العودة»، لذلك لم تُضف كلمة «ارجعي».
- source_word: ἐνθάδε
  choice: إلى هنا
  rationale: ظرف مكان يعني «هنا/إلى هذا الموضع»، ومع فعل الحركة يكون «إلى هنا» تعبيرًا عربيًا طبيعيًا.
