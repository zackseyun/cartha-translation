  source_fidelity: 'ينقل النص عناصر اليونانية كلها بأمانة: «الموظف الملكي» لـὁ βασιλικός، وفعل الأمر «انزل» لـκατάβηθι مع دلالة الاتجاه الهابط، و«قبل أن يموت طفلي» لـπρὶν ἀποθανεῖν τὸ παιδίον μου. كما يحافظ «طفلي» على عدم تعيين الجنس في παιδίον، وينقل «فقال له» المضارع التاريخي نقلاً سرديًا عربيًا طبيعيًا.'
