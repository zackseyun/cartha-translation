  text: λέγει πρὸς αὐτὸν ὁ βασιλικός· Κύριε, κατάβηθι πρὶν ἀποθανεῖν τὸ παιδίον μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/049.yaml
  text: The royal official said to him[a], “Lord, come down before my child dies.”
translation:
  language: ar
  text: 'فقال له الموظف الملكي: «يا ربّ[a]، انزل قبل أن يموت طفلي».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يا سيدي». فاللفظة اليونانية κύριε نداء احترام، ويمكن أن تعني أيضًا «يا ربّ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ βασιλικός
  choice: الموظف الملكي
  rationale: تأتي الكلمة هنا اسمًا لشخص مرتبط بالملك أو بالبلاط؛ و«الموظف الملكي» تعبير عربي حديث واضح يحفظ هذه الصلة من غير أن يفترض أنه من طبقة النبلاء.
- source_word: Κύριε
  choice: يا ربّ
  rationale: يمكن أن تكون الكلمة نداء احترام بمعنى «يا سيدي»، لكنها تحتمل أيضًا دلالة «الرب» الأوسع في سياق إنجيل يوحنا؛ لذلك حُفظت هذه الدلالة في المتن مع بيان البديل في الحاشية.
- source_word: κατάβηθι
  choice: انزل
  rationale: فعل أمر يدل على النزول، ويحفظ البعد الجغرافي في الانتقال من قانا إلى كفرناحوم. وصيغة «انزل» طبيعية لأن المخاطَب هو الذي سيغادر موضعه.
- source_word: πρὶν ἀποθανεῖν
  choice: قبل أن يموت
  rationale: تفيد πρίν مع المصدر الزمن السابق لوقوع الفعل؛ وتقتضي العربية إظهار الفاعل المفهوم من السياق.
- source_word: τὸ παιδίον μου
  choice: طفلي
  rationale: παιδίον تعني طفلًا أو ولدًا صغيرًا، ولا تحدد الجنس هنا؛ لذا يتجنب «طفلي» زيادة «ابني» التي لا يصرح بها لفظ هذه الآية.
- source_word: λέγει πρὸς αὐτόν
  choice: فقال له
  rationale: المضارع التاريخي اليوناني يُنقل طبيعيًا بالماضي في السرد العربي، والفاء تصل القول بما سبقه في السياق.
theological_decisions:
- issue: ترجمة κύριος عند مخاطبة يسوع
  choice: يا ربّ
  alternative: يا سيدي
  rationale: يحفظ «يا ربّ» إمكان الدلالة اليوحناوية الأعمق من غير الجزم بأن المتكلم يعلن هنا اعترافًا لاهوتيًا كاملًا، بينما توضح الحاشية أن اللفظة قد تكون مجرد خطاب احترام في السياق المباشر.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعمل «الموظف الملكي» بدل تعبيرات قديمة مثل «خادم الملك»، وحُفظ فعل النزول والدلالة غير المحددة لجنس الطفل، مع إبقاء التوتر الدلالي في κύριε بواسطة الحاشية.
