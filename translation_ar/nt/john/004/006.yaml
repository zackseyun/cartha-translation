base_translation:
  language: en
  yaml_path: translation/nt/john/004/006.yaml
  text: Jacob’s well was there[a]. So Jesus, wearied from the journey, was sitting there by the well[c][b]. It was about the sixth hour.
translation:
  language: ar
  text: وكانت هناك بئر يعقوب[a]. فكان يسوع، وقد أعياه السفر، جالسًا هكذا عند البئر[b]. وكانت الساعة نحو السادسة[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «عين يعقوب»؛ فاللفظ اليوناني يمكن أن يدل على نبع أو بئر.
    reason: lexical_alternative
  - marker: b
    text: يمكن أن تفيد «هكذا» معنى «على تلك الحال» أو «بهذه الهيئة».
    reason: lexical_alternative
  - marker: c
    text: أي نحو الظهر إذا حُسبت الساعات بحسب ساعات النهار اليهودية؛ وقد اقترح بعضهم نظامًا آخر للعدّ يجعلها نحو السادسة مساءً.
    reason: alternative_reading
lexical_decisions:
- source_word: πηγὴ τοῦ Ἰακώβ
  choice: بئر يعقوب
  rationale: لفظ πηγή قد يدل على نبع أو بئر، لكن سياق استقاء الماء واستعمال الرواية لاحقًا يجعلان «بئر يعقوب» التعبير العربي الطبيعي هنا، مع إثبات البديل في الحاشية.
- source_word: κεκοπιακὼς ἐκ τῆς ὁδοιπορίας
  choice: وقد أعياه السفر
  rationale: اسم الفاعل التام يدل على حالة تعب ناتجة من عناء السير؛ و«أعياه السفر» عربية واضحة تحفظ السبب والنتيجة.
- source_word: ἐκαθέζετο
  choice: كان ... جالسًا
  rationale: الصيغة الناقصة ترسم حالة مستمرة في خلفية المشهد، ولذلك ينقلها التركيب الوصفي «كان جالسًا» بصورة طبيعية.
- source_word: οὕτως
  choice: هكذا
  rationale: أُبقي الظرف ظاهرًا لأن دلالته الدقيقة محل نقاش، وقد يشير إلى جلوس يسوع على تلك الحال أو إلى كيفية جلوسه؛ ولا يصح إسقاط هذا الغموض من المتن.
- source_word: ἐπὶ τῇ πηγῇ
  choice: عند البئر
  rationale: حرف الجر مع المجرور هنا مكاني، و«عند البئر» تعبير عربي طبيعي لا يوهم أن يسوع جلس فوقها.
- source_word: ὥρα ἦν ὡς ἕκτη
  choice: كانت الساعة نحو السادسة
  rationale: «نحو» تنقل معنى التقريب في ὡς، والإبقاء على «السادسة» يحفظ طريقة التعبير الأصلية من غير تحويلها في المتن إلى توقيت حديث.
- source_word: δὲ / οὖν
  choice: و / فـ
  rationale: نُقلت حركة السرد والنتيجة السياقية بأداتي الربط العربيتين الموجزتين «و» و«فـ»، من غير إضافة ظرف زمان لا يقابله لفظ صريح في الأصل.
theological_decisions:
- issue: تحديد المقصود بالساعة السادسة
  choice: الإبقاء على العبارة الحرفية «نحو السادسة» في المتن
  alternative: نحو الظهر بحسب عدّ ساعات النهار اليهودي، أو نحو السادسة مساءً بحسب فرضية العدّ الروماني
  rationale: النص اليوناني لا يحدد المقابل على الساعة الحديثة، والمسألة ذات أثر في مناقشة التسلسل الزمني في إنجيل يوحنا؛ لذلك لا تُحسم في الترجمة.
translation_notes:
  register: لغة عربية فصحى حديثة واضحة ووقورة. حُفظت العبارة الزمنية القديمة والغموض الحقيقي في «هكذا»، مع شرح البدائل في الحواشي بدل حسمها داخل المتن.
