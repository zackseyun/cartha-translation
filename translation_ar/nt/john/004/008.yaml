  text: οἱ γὰρ μαθηταὶ αὐτοῦ ἀπεληλύθεισαν εἰς τὴν πόλιν, ἵνα τροφὰς ἀγοράσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/008.yaml
  text: For his disciples had gone away into the city to buy food[a][b].
translation:
  language: ar
  text: لِأَنَّ تَلَامِيذَهُ كَانُوا قَدْ ذَهَبُوا إِلَى الْمَدِينَةِ لِيَشْتَرُوا طَعَامًا[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «إلى البلدة»؛ يمكن أن تعني πόλις «مدينة» أو، بحسب السياق، «بلدة».
    reason: lexical_alternative
  - marker: b
    text: أو «ليشتروا مؤنًا».
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: لِأَنَّ
  rationale: أداة تعليل تربط هذه الجملة بما قبلها وتوضح سبب وجود يسوع وحده عند البئر.
- source_word: μαθηταὶ αὐτοῦ
  choice: تَلَامِيذَهُ
  rationale: صياغة عربية طبيعية ودقيقة للتركيب الإضافي، وتحافظ على الدلالة المألوفة لكلمة μαθηταί.
- source_word: ἀπεληλύθεισαν
  choice: كَانُوا قَدْ ذَهَبُوا
  rationale: الماضي الأسبق في اليونانية يدل على فعل وقع قبل المشهد الجاري؛ ويؤدي تركيب «كانوا قد ذهبوا» هذه الدلالة الزمنية بوضوح.
- source_word: εἰς τὴν πόλιν
  choice: إِلَى الْمَدِينَةِ
  rationale: يفيد حرف الجر εἰς الحركة نحو مكان أو إلى داخله؛ و«إلى المدينة» أفصح وأكثر طبيعية هنا، مع إمكان فهم πόλις بمعنى البلدة بحسب السياق.
- source_word: ἵνα
  choice: لِـ
  rationale: تدخل ἵνα هنا على جملة غرض، وتؤدي لام التعليل هذا المعنى بإيجاز وطبيعية.
- source_word: τροφὰς
  choice: طَعَامًا
  rationale: تشير الكلمة إلى الطعام أو المؤن، و«طعامًا» هو المقابل العربي العام والطبيعي في السياق.
- source_word: ἀγοράσωσιν
  choice: يَشْتَرُوا
  rationale: فعل مضارع منصوب بعد لام التعليل ينقل غرض الذهاب، وهو مقابل عربي مباشر وحديث للفعل اليوناني.
