source:
  edition: SBLGNT
  text: Καὶ ἐπὶ τούτῳ ἦλθαν οἱ μαθηταὶ αὐτοῦ, καὶ ⸀ἐθαύμαζον ὅτι μετὰ γυναικὸς ἐλάλει· οὐδεὶς μέντοι εἶπεν· Τί ζητεῖς; ἢ τί λαλεῖς μετ’ αὐτῆς;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/027.yaml
  text: And at this point his disciples came[a], and they were amazed that he was speaking with a woman. Yet no one said, “What are you seeking?” or[b], “Why are you speaking with her?”
translation:
  language: ar
  text: 'وفي تلك اللحظة جاء تلاميذه، وكانوا يتعجبون لأنه كان يتحدث مع امرأة. ومع ذلك، لم يقل أحد: «ماذا تطلب؟»[a] أو: «لماذا تتحدث معها؟»[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ماذا تريد؟»'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «ماذا تتحدث معها؟» والمقصود في السياق: «لماذا تتحدث معها؟»'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τούτῳ
  choice: في تلك اللحظة
  rationale: تعبير زمني يشير إلى وقوع مجيء التلاميذ عند هذه النقطة من الحديث، وصياغته طبيعية في العربية المعاصرة.
- source_word: ἐθαύμαζον
  choice: كانوا يتعجبون
  rationale: يحافظ الماضي الناقص في العربية على دلالة الفعل اليوناني الناقص بوصفه رد فعل مستمرًا أو جاريًا، من غير إضافة سبب لم يذكره النص.
- source_word: μετὰ γυναικὸς
  choice: مع امرأة
  rationale: الاسم اليوناني غير معرّف، والسياق يدل على امرأة لا على زوجة؛ لذلك تحافظ الصياغة على التنكير.
- source_word: ἐλάλει
  choice: كان يتحدث
  rationale: ينقل صيغة الماضي الناقص الدالة على حديث كان جاريًا، ويحافظ على الصلة اللفظية بالسؤال اللاحق.
- source_word: μέντοι
  choice: مع ذلك
  rationale: 'ينقل المقابلة الاستدراكية: فعلى الرغم من تعجبهم، لم يصرّح أحد بالسؤال.'
- source_word: Τί ζητεῖς;
  choice: ماذا تطلب؟
  rationale: يحافظ على المعنى الأساسي للفعل ζητέω وعلى بقاء المفعول به غير مصرح به، مع إثبات المعنى السياقي البديل في الحاشية.
- source_word: τί λαλεῖς μετ’ αὐτῆς;
  choice: لماذا تتحدث معها؟
  rationale: ينقل القوة التداولية الطبيعية للسؤال في السياق؛ فالصياغة الحرفية بـ«ماذا» غير مألوفة في العربية، مع توضيحها في الحاشية.
theological_decisions:
- issue: الدلالة الاجتماعية لحديث يسوع مع امرأة
  choice: إبقاء تعجب التلاميذ من حديثه مع امرأة من غير تحديد سببه
  alternative: إضافة تفسير يتعلق بالأعراف بين الرجال والنساء أو بالعلاقة بين اليهود والسامريين
  rationale: لا يصرح النص اليوناني بسبب التعجب، ولذلك تحافظ الترجمة على تحفظ النص ولا تُدخل تفسيرًا اجتماعيًا أو طائفيًا في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت صيغتا «كانوا يتعجبون» و«كان يتحدث» لإظهار الاستمرار الذي تدل عليه صيغتا الماضي الناقص في اليونانية، مع تجنب اللغة التراثية الثقيلة أو التوسع التفسيري.
