base_translation:
  language: en
  yaml_path: translation/nt/john/004/035.yaml
  text: 'Do you not say[a], ‘There are still four months, and then the harvest comes’? Look, I tell you: lift up your eyes and see the fields, that they are white for harvest already.'
translation:
  language: ar
  text: 'أما تقولون أنتم: «لا تزال هناك أربعة أشهر، ثم يأتي الحصاد»؟ ها أنا أقول لكم: ارفعوا عيونكم وانظروا إلى الحقول؛ إنها بيضاء[a] للحصاد بالفعل.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ناضجة للحصاد». يقول النص اليوناني حرفيًا «بيضاء»، محافظًا على صورة الحقول المرئية، مع إفادة أنها قد صارت مهيأة للحصاد.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ ὑμεῖς λέγετε
  choice: أما تقولون أنتم
  rationale: صياغة عربية طبيعية للسؤال المنفي، مع إبراز الضمير ὑμεῖς بلفظ «أنتم» دون مبالغة.
- source_word: Ἔτι τετράμηνός ἐστιν
  choice: لا تزال هناك أربعة أشهر
  rationale: تنقل المدة المتبقية إلى الحصاد بصياغة عربية واضحة ومألوفة.
- source_word: ὁ θερισμὸς ἔρχεται
  choice: يأتي الحصاد
  rationale: تحافظ على زمن المضارع وصورة مجيء الحصاد.
- source_word: ἰδοὺ λέγω ὑμῖν
  choice: ها أنا أقول لكم
  rationale: تنقل أداة لفت الانتباه ἰδοὺ بعبارة عربية فصيحة حية وغير متكلفة.
- source_word: ἐπάρατε τοὺς ὀφθαλμοὺς ὑμῶν
  choice: ارفعوا عيونكم
  rationale: تحافظ على الصورة الحسية المباشرة في الأصل بدل اختزالها إلى مجرد النظر.
- source_word: θεάσασθε
  choice: انظروا إلى
  rationale: يدل على النظر المقصود والمتأمل، ويلائم السياق بعد الأمر برفع العيون.
- source_word: τὰς χώρας
  choice: الحقول
  rationale: المقصود في سياق الحصاد هو الأراضي المزروعة، و«الحقول» أوضح مقابل عربي.
- source_word: λευκαί εἰσιν
  choice: إنها بيضاء
  rationale: تحافظ على اللون والصورة البصرية الصريحة في اليونانية، بدل تفسيرها في المتن بأنها ناضجة.
- source_word: πρὸς θερισμόν
  choice: للحصاد
  rationale: ترجمة موجزة تحفظ استعارة الحصاد ولا تضيف لفظ «جاهزة» التفسيري.
- source_word: ἤδη
  choice: بالفعل
  rationale: تنقل معنى تحقق الحال الآن، في مقابلة الانتظار أربعة أشهر، وتأتي في موضع ختامي ذي وقع واضح.
theological_decisions:
- issue: هل تُفسَّر صورة الحصاد في المتن تفسيرًا روحيًا صريحًا؟
  choice: الإبقاء على الصورة الزراعية كما وردت
  alternative: 'صياغتها مثل: «الناس مستعدون لأن يُجمعوا»'
  rationale: السياق يوحي بمرجع روحي وإرسالي، لكن ألفاظ الأصل تظل زراعية؛ لذلك تحفظ الترجمة الاستعارة ولا تحسم تفسيرها داخل المتن.
translation_notes:
  register: العربية فصحى حديثة واضحة وذات نبرة كريمة. حُفظت الصور الحسية في «ارفعوا عيونكم» و«بيضاء»، مع تجنب الألفاظ العتيقة والتفسير اللاهوتي المضاف.
