    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ σὺ
  choice: أَلَعَلَّكَ
  rationale: تنقل صيغة الاستفهام الإنكاري التي تتوقع جوابًا بالنفي، مع إبراز ضمير المخاطب بأسلوب عربي طبيعي.
- source_word: μείζων
  choice: أَعْظَمُ مِنْ
  rationale: المقصود العظمة في المقام والشأن، لا كِبَر الحجم.
- source_word: τοῦ πατρὸς ἡμῶν Ἰακώβ
  choice: أَبِينَا يَعْقُوبَ
  rationale: تحفظ لغة الانتساب والتوقير التي تعبّر بها المرأة عن ميراث قومها.
- source_word: ἔδωκεν ἡμῖν
  choice: أَعْطَانَا
  rationale: ينقل الفعل الماضي بإيجاز وفصاحة.
- source_word: τὸ φρέαρ
  choice: الْبِئْرَ
  rationale: φρέαρ هنا بئر، وليس نبعًا؛ ويؤيد ذلك سياق بئر يعقوب.
- source_word: καὶ αὐτὸς ἐξ αὐτοῦ ἔπιεν
  choice: وَشَرِبَ مِنْهَا هُوَ نَفْسُهُ
  rationale: يحفظ توكيد αὐτός، ويستعمل التأنيث في الضمير موافقةً لكلمة «البئر» في العربية.
- source_word: οἱ υἱοὶ αὐτοῦ
  choice: وَبَنُوهُ
  rationale: يحفظ الدلالة المذكرة المحددة لكلمة υἱοί مع صياغة عربية موجزة.
- source_word: τὰ θρέμματα αὐτοῦ
  choice: وَمَوَاشِيهِ
  rationale: لفظ جامع للحيوانات المستأنسة التي يقتنيها الإنسان، من غير حصرها في البقر.
theological_decisions:
- issue: قوة الاستفهام المصدَّر بـ μή
  choice: استفهام إنكاري يتوقع جوابًا بالنفي
  alternative: أنت لست أعظم من أبينا يعقوب، أليس كذلك؟
  rationale: تدل μή في هذا السؤال على توقّع المتكلمة جواب «لا». وتحفظ «ألعلك» هذا التوقع من غير تحويل السؤال إلى تقرير صريح أو إزالة نبرة التحدي.
translation_notes:
  register: لغة عربية فصحى واضحة وموقّرة. استُعملت «ألعلك» لنقل الاستفهام الإنكاري وتوقع النفي، و«مواشيه» بوصفها لفظًا حديثًا جامعًا. وُضع رمز الحاشية بعد السؤال كله لأن الحاشية تشرح قوة الجملة الاستفهامية بأكملها.
