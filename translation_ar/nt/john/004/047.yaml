- from: فلمّا سمع هذا الرجل أن يسوع قد جاء من اليهودية إلى الجليل، ذهب إليه وظلّ يطلب منه أن ينزل ويشفي ابنه[a]، لأنه كان مشرفًا على الموت.
  to: فلمّا سمع هذا الرجل أن يسوع قد جاء من اليهودية إلى الجليل، ذهب إليه وظلّ يطلب منه أن ينزل[a] ويشفي ابنه، لأنه كان على وشك أن يموت.
  rationale: نُقلت علامة الحاشية إلى «ينزل» لتتصل بالعبارة التي تشرحها، واستُبدل التعبير الأقل شيوعًا «مشرفًا على الموت» بعبارة فصحى معاصرة واضحة تحفظ معنى قرب الموت. أما «ظلّ يطلب» فيبقى جائزًا لترجمة احتمال الاستمرار في صيغة ἠρώτα من دون إضافة معنى التوسل.
  reviewer_model: gpt-5.6-terra
