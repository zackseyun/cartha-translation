  text: οὗτος ἀκούσας ὅτι Ἰησοῦς ἥκει ἐκ τῆς Ἰουδαίας εἰς τὴν Γαλιλαίαν ἀπῆλθεν πρὸς αὐτὸν καὶ ⸀ἠρώτα ἵνα καταβῇ καὶ ἰάσηται αὐτοῦ τὸν υἱόν, ἤμελλεν γὰρ ἀποθνῄσκειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/047.yaml
  text: When this man heard that Jesus had come from Judea into Galilee[a], he went to him and asked him to come down and heal his son[b], for he was about to die.
translation:
  language: ar
  text: فلمّا سمع هذا الرجل أن يسوع قد جاء من اليهودية إلى الجليل، ذهب إليه وظلّ يطلب منه أن ينزل[a] ويشفي ابنه، لأنه كان على وشك أن يموت.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '«أن ينزل»: تعكس العبارة الانتقال إلى موضع أقل ارتفاعًا.'
    reason: cultural_note
lexical_decisions:
- source_word: οὗτος
  choice: هذا الرجل
  rationale: يحفظ قوة اسم الإشارة ويربطه طبيعيًا بالمسؤول الملكي المذكور في الآية السابقة.
- source_word: ἀκούσας
  choice: فلمّا سمع
  rationale: صياغة زمنية عربية طبيعية للمشاركة الماضية، وتوضح علاقتها بالفعل الرئيس.
- source_word: ἥκει
  choice: قد جاء
  rationale: ينقل معنى الوصول والحضور الناتج عنه، ويلائم مضمون الخبر الذي سمعه الرجل.
- source_word: ἐκ τῆς Ἰουδαίας εἰς τὴν Γαλιλαίαν
  choice: من اليهودية إلى الجليل
  rationale: يحفظ جهة الانطلاق والوصول بعبارة عربية واضحة وطبيعية.
- source_word: ἀπῆλθεν πρὸς αὐτόν
  choice: ذهب إليه
  rationale: المقابل العربي الطبيعي للانتقال إلى شخص مقصود.
- source_word: ἠρώτα
  choice: ظلّ يطلب منه
  rationale: يبرز صيغة الماضي الناقص التي قد تدل على استمرار الطلب، من غير تحميل الفعل معنى التوسل الشديد.
- source_word: ἵνα καταβῇ
  choice: أن ينزل
  rationale: يحفظ معنى الحركة إلى موضع أخفض في καταβαίνω، ويأتي طبيعيًا بعد فعل الطلب.
- source_word: ἰάσηται
  choice: ويشفي
  rationale: ينقل المعنى الجسدي المباشر للفعل ἰάομαι بلفظ عربي مألوف في سياق الشفاء.
- source_word: αὐτοῦ τὸν υἱόν
  choice: ابنه
  rationale: صياغة عربية مباشرة وطبيعية لعلاقة الملكية.
- source_word: ἤμελλεν γὰρ ἀποθνῄσκειν
  choice: لأنه كان مشرفًا على الموت
  rationale: ينقل دلالة μέλλω على قرب وقوع الموت مع الحفاظ على الإلحاح السياقي.
theological_decisions:
- issue: مرجع الضمير في عبارة ἤμελλεν γὰρ ἀποθνῄσκειν
  choice: الابن هو المشرف على الموت
  alternative: يسوع أو المسؤول هو المشرف على الموت
  rationale: الابن هو أقرب مرجع نحوي، والسياق يبين أنه المريض الذي يطلب أبوه شفاءه.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «ظلّ يطلب» لإظهار احتمال الاستمرار في صيغة الماضي الناقص، مع تجنب «توسّل» لأنها قد تزيد قوة عاطفية لا يفرضها اللفظ اليوناني. وُضع مؤشر الحاشية بعد العبارة التي تشرحها مباشرة.
