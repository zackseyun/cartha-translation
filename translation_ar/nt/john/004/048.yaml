  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: εἶπεν οὖν ὁ Ἰησοῦς πρὸς αὐτόν· Ἐὰν μὴ σημεῖα καὶ τέρατα ἴδητε, οὐ μὴ πιστεύσητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/048.yaml
  text: So Jesus said to him[a], “Unless you see signs and wonders, you will certainly not believe.”
translation:
  language: ar
  text: 'فقال له يسوع: «إن لم تروا آيات وعجائب، فلن تؤمنوا أبدًا».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: الفعلان «تروا» و«تؤمنوا» بصيغة الجمع في اليونانية، ولذلك يُرجَّح أن كلام يسوع يتجاوز الرجل نفسه ليشمل جماعة أوسع.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: فـ
  rationale: تفيد الاستمرار والنتيجة في سياق السرد، وهي طبيعية وموجزة في العربية.
- source_word: πρὸς αὐτόν
  choice: له
  rationale: تنقل توجيه الكلام إلى الرجل المذكور بصياغة عربية مألوفة.
- source_word: Ἐὰν μὴ
  choice: إن لم
  rationale: صياغة شرطية عربية مباشرة تحفظ معنى الشرط المنفي.
- source_word: σημεῖα
  choice: آيات
  rationale: تحفظ الدلالة اليوحناوية على أعمال تشير إلى معنى يتجاوز الحدث نفسه، من غير إضافة تفسيرية مثل «معجزات».
- source_word: τέρατα
  choice: عجائب
  rationale: تنقل معنى الظواهر الخارقة المثيرة للدهشة، وتحافظ على الاقتران المألوف «آيات وعجائب».
- source_word: ἴδητε
  choice: تروا
  rationale: تحفظ صيغة المخاطب الجمع في اليونانية وتلائم الجملة الشرطية العربية.
- source_word: οὐ μὴ πιστεύσητε
  choice: فلن تؤمنوا أبدًا
  rationale: تنقل النفي اليوناني المؤكد بصياغة عربية طبيعية وقوية.
- source_word: πιστεύσητε
  choice: تؤمنوا
  rationale: اللفظ العربي المعتاد الذي يحفظ المعنى اليوحناوي للإيمان من دون تضييقه إلى مجرد التصديق أو توسيعه تفسيريًا.
theological_decisions:
- issue: عدد المخاطَبين ونطاق القول
  choice: 'جاءت مقدمة الكلام بالمفرد «له»، بينما صيغ الفعلان في قول يسوع بالجمع: «تروا… تؤمنوا».'
  alternative: اعتبار القول كله موجَّهًا إلى الرجل وحده، أو إضافة تعبير تفسيري مثل «أنتم الناس».
  rationale: الإطار السردي يحدد مخاطَبًا واحدًا، لكن ἴδητε وπιστεύσητε بصيغة الجمع، مما يوسع نطاق القول على الأرجح إلى الحاضرين أو إلى جماعة أوسع. العربية تبيّن الفرق العددي مباشرة من غير توسع تفسيري.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة. استُخدم «آيات وعجائب» حفاظًا على المصطلحين اليونانيين، وأُبرز الجمع صرفيًا في كلام يسوع.
