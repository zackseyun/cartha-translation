  text: ἀπεκρίθη ἡ γυνὴ καὶ εἶπεν ⸀αὐτῷ· Οὐκ ἔχω ἄνδρα. λέγει αὐτῇ ὁ Ἰησοῦς· Καλῶς εἶπας ὅτι Ἄνδρα οὐκ ἔχω·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/017.yaml
  text: 'The woman answered and said to him[a], “I do not have a husband.” Jesus said to her[b], “You have spoken well: ‘I do not have a husband.’”'
translation:
  language: ar
  text: 'فأجابت المرأة وقالت له: «ليس لي زوج». فقال لها يسوع: «أحسنتِ إذ قلتِ: ليس لي زوج».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη ἡ γυνὴ καὶ εἶπεν
  choice: فأجابت المرأة وقالت
  rationale: يحافظ على فعلي الإجابة والقول في اليونانية، مع ربطهما بصياغة سردية عربية واضحة.
- source_word: Οὐκ ἔχω ἄνδρα
  choice: ليس لي زوج
  rationale: لفظ ἀνήρ قد يعني رجلًا أو زوجًا، لكن سياق الحديث عن تاريخ المرأة الزوجي في العدد التالي يرجّح «زوج». والصياغة العربية موجزة وطبيعية.
- source_word: λέγει
  choice: فقال
  rationale: المضارع التاريخي اليوناني نُقل بالماضي، وهو الأنسب للسرد العربي المتتابع.
- source_word: Καλῶς εἶπας
  choice: أحسنتِ إذ قلتِ
  rationale: تؤدي معنى استحسان صحة قولها بصورة عربية طبيعية، وتحافظ على توجيه الخطاب إلى امرأة.
- source_word: ὅτι Ἄνδρα οὐκ ἔχω
  choice: 'إذ قلتِ: ليس لي زوج'
  rationale: تُفهم ὅτι هنا على أنها تُدخل مضمون القول؛ والنقطتان تُظهران أن يسوع يقتبس عبارتها، مع إبقاء تكرارها الوارد في الأصل.
theological_decisions:
- issue: دلالة ἀνήρ في قول المرأة
  choice: زوج
  alternative: رجل
  rationale: مع أن اللفظ يحتمل المعنيين، فإن السياق المباشر، ولا سيما العدد 18، يتناول الأزواج والوضع الزوجي، لذلك «زوج» هو المعنى السياقي من غير إضافة تفسير مذهبي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «ليس لي زوج» لبساطتها وقربها من تركيب الأصل، مع الحفاظ على تكرار العبارة في جواب يسوع.
