  rationale: يشير λόγος هنا إلى كلام يسوع المنطوق؛ و«كلامه» عربية واضحة وتحفظ، بقدر مناسب، دلالة اللفظ من غير حصره في «تعليم».
- source_word: αὐτοῦ
