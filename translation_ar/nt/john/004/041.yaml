theological_decisions:
- issue: صياغة πιστεύω في سياق سردي ذي دلالة خلاصية
  choice: آمن
  alternative: آمنوا به / دخلوا في الإيمان
  rationale: يقول اليوناني ببساطة إن عددًا أكبر آمن، ولا يذكر متعلَّق الفعل صراحة في هذه الآية؛ لذلك تُترك للسياق اليوحناوي دلالة أن الإيمان متعلق بيسوع، من غير توسيع عقائدي داخل النص.
