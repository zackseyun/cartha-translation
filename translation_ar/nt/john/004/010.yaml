source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῇ· Εἰ ᾔδεις τὴν δωρεὰν τοῦ θεοῦ καὶ τίς ἐστιν ὁ λέγων σοι· Δός μοι πεῖν, σὺ ἂν ᾔτησας αὐτὸν καὶ ἔδωκεν ἄν σοι ὕδωρ ζῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/010.yaml
  text: Jesus answered and said to her[a], “If you knew the gift of God, and who it is who says to you, ‘Give me a drink,’ you would have asked him, and he would have given you living water.”
translation:
  language: ar
  text: 'فأجابها يسوع وقال: «لو كنتِ تعرفين عطية الله، ومَن هو الذي يقول لكِ: أعطيني لأشرب، لطلبتِ أنتِ منه، ولأعطاكِ ماءً حيًّا[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ماءً جاريًا» أو «ماءً عذبًا». قد تشير العبارة إلى الماء المتدفق، لكن «ماءً حيًّا» تحافظ على دلالتها المزدوجة المقصودة هنا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῇ
  choice: فأجابها يسوع وقال
  rationale: يحافظ على فعلي الكلام في اليونانية وصيغة السرد، مع صياغة عربية واضحة وطبيعية.
- source_word: τὴν δωρεὰν τοῦ θεοῦ
  choice: عطية الله
  rationale: «عطية» تنقل معنى الهبة الممنوحة مجانًا، والإضافة تحافظ على احتمال دلالة τοῦ θεοῦ على المصدر أو الملكية من غير حسم زائد.
- source_word: τίς ἐστιν ὁ λέγων σοι
  choice: مَن هو الذي يقول لكِ
  rationale: يحفظ التشديد على هوية المتكلم، ويعبّر عن اسم الفاعل الحاضر بصياغة عربية مألوفة.
- source_word: Δός μοι πεῖν
  choice: أعطيني لأشرب
  rationale: ترجمة قريبة من تركيب الأمر مع المصدر، واضحة في العربية وتحافظ على طلب يسوع المباشر.
- source_word: σὺ ἂν ᾔτησας αὐτόν
  choice: لطلبتِ أنتِ منه
  rationale: لام الجواب تنقل الشرط المخالف للواقع، وإظهار «أنتِ» يحفظ توكيد الضمير اليوناني σὺ.
- source_word: ἔδωκεν ἄν σοι
  choice: ولأعطاكِ
  rationale: ينقل جواب الشرط غير المتحقق بإيجاز عربي طبيعي.
- source_word: ὕδωρ ζῶν
  choice: ماءً حيًّا
  rationale: يحافظ على التعبير الحرفي ذي الدلالة المزدوجة في السياق، بدل قصره على معنى الماء الجاري.
theological_decisions:
- issue: الحفاظ على الدلالة الحسية والرمزية لعبارة ὕδωρ ζῶν
  choice: ماءً حيًّا
  alternative: ماءً جاريًا أو ماءً عذبًا
  rationale: يمكن أن تدل العبارة في الاستعمال العادي على الماء الجاري أو المتجدد، لكنها في هذا السياق تحمل أيضًا معنى أعمق؛ لذا تحافظ «ماء حي» على التوتر المقصود ولا تحسمه في اتجاه مادي فقط.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت علامات التأنيث في الضمائر والأفعال لأن المخاطَبة امرأة، وحُفظ التكرار «أجاب... وقال» لتمثيل الصيغة اليونانية من غير تعقيد.
