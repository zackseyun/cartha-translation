  yaml_path: translation/nt/john/004/052.yaml
  text: So he asked them the hour in which he got better. Then they said to him[a], “Yesterday at the seventh hour the fever left him.”
translation:
  language: ar
  text: 'فسألهم عن الساعة التي تحسَّنت فيها حاله. فقالوا له: «أمس، في الساعة السابعة[a]، فارقته الحُمّى».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي نحو الواحدة ظهرًا إذا حُسبت الساعات ابتداءً من شروق الشمس؛ ويرى بعضهم أن يوحنا يتبع نظامًا آخر في حساب الوقت.
    reason: بيان الاحتمال الزمني مع الحفاظ على غموض نظام حساب الساعات في المتن.
lexical_decisions:
- source_word: ἐπύθετο οὖν
  choice: فسألهم
  rationale: يفيد الفعل الاستفسار، وتؤدي الفاء صلة الاستنتاج والتتابع السردي بما سبق من السياق.
- source_word: τὴν ὥραν παρ’ αὐτῶν
  choice: عن الساعة
  rationale: صيغت παρά مع المضاف إليه بحسب الأسلوب العربي الطبيعي بعد فعل السؤال، مع إبقاء معنى السؤال عن وقت محدد.
- source_word: ἐν ᾗ κομψότερον ἔσχεν
  choice: التي تحسَّنت فيها حاله
  rationale: التعبير اليوناني اصطلاح يدل على صيرورة المريض إلى حال أفضل، وهذه الصياغة عربية واضحة ولا توحي بالضرورة بأنه شُفي تمامًا.
- source_word: εἶπαν οὖν αὐτῷ
  choice: فقالوا له
  rationale: الفاء تنقل جواب الخدم في تتابع طبيعي، وتحافظ على القوة السردية لـοὖν دون إثقال العبارة.
- source_word: Ἐχθὲς ὥραν ἑβδόμην
  choice: أمس، في الساعة السابعة
  rationale: أُبقي ترقيم الساعة كما في اليونانية بدل تحويله إلى توقيت حديث، لأن النص لا يحدد نظام حساب الساعات.
- source_word: ἀφῆκεν αὐτὸν ὁ πυρετός
  choice: فارقته الحُمّى
  rationale: يحافظ هذا التعبير الطبيعي على تصوير الحمى فاعلًا يترك المريض، كما في البنية اليونانية.
theological_decisions:
- issue: نظام حساب «الساعة السابعة»
  choice: إبقاء «الساعة السابعة» في المتن
  alternative: نحو الواحدة ظهرًا إذا حُسبت الساعات من شروق الشمس، أو توقيت آخر بحسب فهم نظام يوحنا الزمني
  rationale: لا يحدد النص نفسه نظام حساب الوقت، لذلك تُحفظ دلالة الأصل واحتمالاتها بدل حسمها في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «تحسَّنت حاله» لتجنب العامية وللدلالة على التحسن دون الجزم بالشفاء الكامل، و«فارقته الحُمّى» لصون الصورة التعبيرية الطبيعية في الأصل.
