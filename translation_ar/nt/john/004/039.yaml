  text: And many of the Samaritans from that town believed in him because of the word of the woman who was testifying, “He told me everything I did.”
translation:
  language: ar
  text: 'ومن تلك المدينة آمن به كثيرون من السامريين بسبب كلام المرأة[a] التي كانت تشهد: «قال لي كل ما فعلتُ».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بسبب رسالة المرأة». يمكن للكلمة اليونانية λόγος أن تعني «كلامًا» أو «رسالة» أو «خبرًا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐκ δὲ τῆς πόλεως ἐκείνης
  choice: ومن تلك المدينة
  rationale: تحفظ «مِن» دلالة المصدر في ἐκ، وتنقل الواو δέ بوصفها رابطًا سرديًّا خفيفًا. و«المدينة» المقابل العربي الطبيعي لـ πόλις دون افتراض حجم المستوطنة.
- source_word: πολλοὶ ... τῶν Σαμαριτῶν
  choice: كثيرون من سامريّي
  rationale: 'تنقل التركيب التبعيضي: كثيرون من بين السامريين، مع ربطه طبيعيًّا بتلك المدينة.'
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: آمن به
  rationale: صياغة عربية مألوفة ودقيقة للإيمان أو الثقة الموجّهة إلى شخص، من غير توسيع عقائدي.
- source_word: διὰ τὸν λόγον
  choice: بسبب كلام
  rationale: تنقل διά السببية، وتبقي «كلام» المجال الدلالي لـ λόγος قريبًا من الأصل؛ ويمكن فهمه أيضًا بمعنى الرسالة أو القول.
- source_word: τῆς γυναικὸς μαρτυρούσης
  choice: المرأة التي كانت تشهد قائلة
  rationale: تحفظ قيمة اسم الفاعل الحاضر الدالة على الشهادة الجارية، وتأتي «قائلة» لتمهيد مضمون الشهادة في عربية طبيعية.
- source_word: Εἶπέν μοι πάντα ἃ ἐποίησα
  choice: قال لي كلَّ ما فعلتُ
  rationale: تحافظ على بساطة λέγω مع المفعول غير المباشر، وتنقل aorist ἐποίησα بالماضي العربي الطبيعي من غير تحميله زمنًا مركبًا غير لازم.
theological_decisions:
- issue: دلالة πιστεύω εἰς في الاستعمال اليوحناوي
  choice: آمن به
  alternative: وضعوا ثقتهم فيه
  rationale: يثبت النص إيمانًا موجّهًا إلى يسوع، لكن لا يفصّل هنا تصنيفًا عقائديًّا لاحقًا؛ لذلك تحافظ العبارة المختارة على القوة العلائقية من غير إضافة تفسيرية.
