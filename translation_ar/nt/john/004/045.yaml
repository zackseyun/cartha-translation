id: JHN.4.45
reference: John 4:45
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὅτε οὖν ἦλθεν εἰς τὴν Γαλιλαίαν, ἐδέξαντο αὐτὸν οἱ Γαλιλαῖοι, πάντα ἑωρακότες ⸀ὅσα ἐποίησεν ἐν Ἱεροσολύμοις ἐν τῇ ἑορτῇ, καὶ αὐτοὶ γὰρ ἦλθον εἰς τὴν ἑορτήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/045.yaml
  text: So when he came into Galilee[a], the Galileans welcomed him, having seen all that he had done in Jerusalem at the feast[b], for they too had gone to the feast.
translation:
  language: ar
  text: فَلَمَّا جاءَ إِلى الجَليلِ، رَحَّبَ بِهِ أَهْلُ الجَليلِ[a]، إِذْ كانُوا قَدْ رَأَوْا كُلَّ ما صَنَعَهُ في أُورُشَليمَ أَثْناءَ العِيدِ[b]، لِأَنَّهُمْ هُمْ أَيْضًا كانُوا قَدْ ذَهَبُوا إِلى العِيدِ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «استقبله». يمكن للفعل اليوناني أن يعني الاستقبال أو الترحيب، ويشير السياق هنا إلى استقبال إيجابي.'
    reason: lexical_alternative
  - marker: b
    text: أي عيد ديني. ويُفهَم من السياق أنه أحد أعياد الحج إلى أورشليم.
    reason: cultural_note
lexical_decisions:
- source_word: ὅτε οὖν
  choice: فَلَمَّا
  rationale: تنقل الفاء قوة οὖν في استئناف السرد وربطه بما قبله، وتؤدي «لما» معنى الظرف الزمني بصورة عربية طبيعية.
- source_word: ἦλθεν εἰς τὴν Γαλιλαίαν
  choice: جاء إلى الجليل
  rationale: تؤدي معنى الحركة باتجاه الإقليم، وهي أفصح وأطبع عربيًا من تعبير حرفي مثل «دخل إلى».
- source_word: ἐδέξαντο αὐτὸν
  choice: رحَّب به
  rationale: الفعل يدل هنا على استقبال إيجابي لا على مجرد التلقي؛ وتوضح الحاشية البديل الأقرب إلى اللفظ العام.
- source_word: οἱ Γαλιλαῖοι
  choice: أهل الجليل
  rationale: تعبير عربي واضح وطبيعي عن سكان الإقليم، ويتجنب ثقل النسبة في «الجليليين».
- source_word: πάντα ἑωρακότες ὅσα
  choice: إذ كانوا قد رأوا كل ما
  rationale: تحفظ «إذ» الصلة الحالية المحتملة للعبارة الحالية، ويبين الماضي التام العربي سبق رؤيتهم لاستقبالهم له دون الجزم بأن العلاقة سببية محضة.
- source_word: ἐποίησεν
  choice: صنعه
  rationale: «صنع» مقابل واسع وطبيعي لـ ποιέω، ويحفظ عدم تحديد طبيعة الأعمال في هذه الآية.
- source_word: ἐν Ἱεροσολύμοις
  choice: في أورشليم
  rationale: الصيغة العربية الكتابية الشائعة لاسم المدينة.
- source_word: ἐν τῇ ἑορτῇ
  choice: أثناء العيد
  rationale: تعبر بوضوح عن وقوع الأعمال في مدة المناسبة الدينية؛ وتشرح الحاشية الدلالة الثقافية للكلمة.
- source_word: καὶ αὐτοὶ γὰρ
  choice: لأنهم هم أيضًا
  rationale: «لأن» تحفظ الوظيفة التفسيرية لـ γάρ، و«هم أيضًا» تحفظ توكيد αὐτοὶ ومعنى المشاركة.
- source_word: ἦλθον εἰς τὴν ἑορτήν
  choice: كانوا قد ذهبوا إلى العيد
  rationale: يبين الماضي التام أن حضورهم العيد سبق استقبالهم ليسوع، و«ذهبوا» ملائمة لمنظور السرد بعد عودتهم إلى الجليل.
theological_decisions:
- issue: طبيعة استقبال أهل الجليل ليسوع
  choice: رحَّب به
  alternative: قبلوه / استقبلوه
  rationale: السياق يوحي باستقبال إيجابي بسبب ما شاهدوه، لكن الآية لا تقرر بالضرورة إيمانًا عميقًا أو صحيحًا؛ لذلك لا تُستعمل عبارة تحمل معنى الإيمان أو القبول اللاهوتي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة، مع إبقاء ترابط السرد ودلالة الأسبقية الزمنية. وُضعت علامتا الحاشيتين في المتن عند عبارتيهما المعنيتين، من دون تحميل الترحيب معنى الإيمان الكامل أو تحديد اسم العيد بما يتجاوز نص الآية.
