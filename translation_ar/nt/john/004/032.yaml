lexical_decisions:
- source_word: δὲ
  choice: لكن
  rationale: تفيد انتقالًا مع مقابلة خفيفة بين كلام التلاميذ وجواب يسوع، و«لكن» طبيعية في هذا السياق.
- source_word: εἶπεν αὐτοῖς
  choice: قال لهم
  rationale: ترجمة مباشرة وطبيعية تحفظ الأسلوب السردي.
- source_word: Ἐγὼ
  choice: لي
  rationale: ينقل التركيب العربي معنى امتلاك المتكلم للطعام، وتبرز المقابلة بالسياق دون إضافة توكيد ثقيل مثل «أنا نفسي».
- source_word: βρῶσιν
  choice: طعام
  rationale: يدل اللفظ هنا على الطعام، وتُبقي هذه الترجمة الصورة المجازية دون تفسيرها قبل أوانها.
- source_word: ἔχω φαγεῖν
  choice: لي طعام آكله
  rationale: صياغة عربية موجزة وطبيعية تنقل معنى وجود طعام لدى يسوع ليأكله.
- source_word: ἣν
  choice: ـه في «تعرفونه»
  rationale: ضمير المفعول يعود إلى «طعام» كما يعود اسم الموصول اليوناني إلى βρῶσιν.
- source_word: ὑμεῖς οὐκ οἴδατε
  choice: لا تعرفونه
  rationale: يحفظ النفي والفعل المباشر والمقابلة التي يفيدها الضمير اليوناني الصريح، من غير إدخال تفسير مثل «لا تعرفون عنه».
theological_decisions:
- issue: المعنى المجازي لـ«الطعام»
  choice: الإبقاء على لفظ «طعام» في المتن من غير شرح المقصود
  alternative: لي ما آكله ولا تعرفونه
  rationale: يتضح المجاز في السياق اللاحق، لكن هذه الآية تُبقي سوء فهم التلاميذ مقصودًا؛ لذلك لا ينبغي أن تحسم الترجمة الصورة بتفسير مبكر.
