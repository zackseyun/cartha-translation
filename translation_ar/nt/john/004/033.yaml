lexical_decisions:
- source_word: ἔλεγον
  choice: كانوا يقولون
  rationale: صيغة الماضي الناقص تدل على كلام جارٍ أو متكرر في المشهد، فجيء بتركيب «كان... يقول» لإبراز هذا الجانب.
- source_word: οὖν
  choice: فـ
  rationale: تربط الفاء الكلام بما سبقه ربطًا طبيعيًا، وتحمل معنى الاستمرار أو النتيجة السياقية دون تثقيل العبارة.
- source_word: οἱ μαθηταὶ
  choice: التلاميذ
  rationale: هو المقابل العربي المعياري والدقيق في سياق إنجيل يوحنا.
- source_word: πρὸς ἀλλήλους
  choice: بعضهم لبعض
  rationale: تعبير عربي طبيعي يحفظ معنى تبادل الكلام داخل الجماعة.
- source_word: Μή τις
  choice: أَلعلَّ أحدًا
  rationale: يحافظ على صورة السؤال مع الإشارة إلى أن المتكلمين يرجحون جوابًا بالنفي، من غير تحويل السؤال إلى تقرير جازم.
- source_word: ἤνεγκεν
  choice: قد أحضر
  rationale: الفعل هنا يعني إحضار الطعام إلى يسوع؛ و«أحضر» واضح وطبيعي في العربية.
- source_word: αὐτῷ
  choice: له
  rationale: ينقل المفعول غير المباشر بوضوح وإيجاز.
- source_word: φαγεῖν
  choice: شيئًا ليأكله
  rationale: المصدر اليوناني يعني حرفيًا «ليأكل»، وإضمار شيء مأكول مفهوم من السياق؛ وإظهاره يجعل العربية سليمة وطبيعية.
