  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῇ· Πᾶς ὁ πίνων ἐκ τοῦ ὕδατος τούτου διψήσει πάλιν·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/013.yaml
  text: Jesus answered and said to her[a], “Everyone who drinks from this water will be thirsty again.”
translation:
  language: ar
  text: 'أجابها يسوع وقال: «كلُّ مَن يشرب من هذا الماء سيعطش ثانيةً»[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «سيظمأ من جديد».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: أجاب
  rationale: فعل سردي مألوف يدل على الرد، ويحافظ على مقابلة الفعل اليوناني دون تكلّف.
- source_word: εἶπεν
  choice: وقال
  rationale: أُبقي الفعلان في الصيغة «أجاب... وقال» حفاظًا على التركيب السردي المزدوج في الأصل.
- source_word: αὐτῇ
  choice: ها في «أجابها»
  rationale: يعبّر ضمير المفعول المتصل بوضوح وطبيعية عن المجرور الدال على المرأة السامرية.
- source_word: Πᾶς ὁ πίνων
  choice: كلُّ مَن يشرب
  rationale: ينقل الدلالة العامة الشاملة لاسم الفاعل المعرّف، من غير قصر العبارة على الذكور.
- source_word: ἐκ
  choice: من
  rationale: حرف الجر العربي الطبيعي عند الحديث عن الشرب من مصدر.
- source_word: τοῦ ὕδατος τούτου
  choice: هذا الماء
  rationale: ترجمة مباشرة واضحة تحفظ قوة اسم الإشارة والإحالة إلى الماء المادي الجاري الحديث عنه.
- source_word: διψήσει
  choice: سيعطش
  rationale: فعل عربي فصيح وطبيعي يطابق صيغة المستقبل ودلالة الفعل اليوناني بدقة.
- source_word: πάλιν
  choice: ثانيةً
  rationale: تعبير عربي واضح عن تكرار العطش، ويؤدي معنى «من جديد» بإيجاز.
theological_decisions:
- issue: الإبقاء على صيغة القول المزدوجة ἀπεκρίθη ... καὶ εἶπεν
  choice: أجابها يسوع وقال
  alternative: قال لها يسوع، أو أجابها يسوع
  rationale: يذكر الأصل فعلين صراحة في صيغة سردية يوحناوية مألوفة؛ والإبقاء عليهما يحفظ نسيج النص من غير تغيير معناه.
- issue: الدلالة العامة للتركيب Πᾶς ὁ πίνων
  choice: كلُّ مَن يشرب
  alternative: كل إنسان يشرب، أو مَن يشرب
  rationale: المذكر النحوي في اليونانية عام لا يخص الرجال؛ وهذه الصياغة العربية تنقل الشمول بدقة وطبيعية.
translation_notes:
  register: العربية فصحى حديثة واضحة ومهيبة. استُخدم «سيعطش» في المتن لأنه طبيعي ودقيق، مع إثبات البديل «سيظمأ» في الحاشية. وُضعت علامة الحاشية بعد الاقتباس الذي تتعلق به.
