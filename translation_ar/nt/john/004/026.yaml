lexical_decisions:
- source_word: λέγει
  choice: قال
  rationale: المضارع التاريخي اليوناني يُنقل طبيعيًا في السرد العربي بصيغة الماضي، من غير تغيير وظيفته السردية.
- source_word: αὐτῇ
  choice: لها
  rationale: صياغة عربية موجزة وطبيعية للمفعول غير المباشر في صيغة المؤنث.
- source_word: Ἐγώ εἰμι
  choice: أنا هو
  rationale: في هذا السياق جواب تعريفي عن المسيح المذكور في الآية السابقة؛ و«أنا هو» تعبير عربي مفهوم، مع التنبيه إلى أن اليونانية حرفيًا «أنا أكون/أنا» ولا تذكر ضمير «هو» مستقلًا.
- source_word: ὁ λαλῶν σοι
  choice: أنا الذي يكلّمك
  rationale: ينقل اسم الفاعل المعرّف بوصفه عبارة تعريفية استئنافية طبيعية في العربية، ويحافظ على زمن الكلام الجاري.
theological_decisions:
- issue: هل يُصرَّح بهوية المسيح داخل النص الرئيسي؟
  choice: 'الإبقاء على جواب تعريفي موجز: «أنا هو»، من دون إضافة لفظ «المسيح».'
  alternative: «أنا، الذي يكلّمك» أو «أنا المسيح»
  rationale: السياق السابق يبيّن أن المقصود هو المسيح، لكن لفظ «المسيح» غير وارد في هذه الآية. لا تضيف الصياغة المختارة اللقب نفسه، وتوضح الحاشية أن «هو» مُقدَّر سياقيًا لا ملفوظ به في اليونانية.
translation_notes:
  register: فصحى معاصرة واضحة ووقورة. استُخدم «يكلّمك» بدل «يتحدث إليك» لقربه من اللفظ اليوناني وإيجازه، وأُبقي التعريف المسياني ضمنيًا كما في المصدر.
