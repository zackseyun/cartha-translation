  text: λέγει αὐτῷ ἡ γυνή· Οἶδα ὅτι Μεσσίας ἔρχεται, ὁ λεγόμενος χριστός· ὅταν ἔλθῃ ἐκεῖνος, ἀναγγελεῖ ἡμῖν ⸀ἅπαντα.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/025.yaml
  text: The woman said to him[a], “I know that Messiah is coming” (the one called Messiah). “When he comes, he will tell us all things.”
translation:
  language: ar
  text: 'قالت له المرأة: «أعرف أن مَسِيّا آتٍ، وهو الذي يُدعى المسيح[a]. وعندما يأتي، فهو سيخبرنا بكل شيء».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «مَسِيّا» نقلٌ للقب السامي، و«المسيح» هو المقابل اليوناني له، ومعناه «الممسوح».
    reason: توضيح العلاقة اللغوية بين Μεσσίας وχριστός التي يتعمد النص إظهارها.
lexical_decisions:
- source_word: λέγει
  choice: قالت
  rationale: الفعل مضارع تاريخي في السرد اليوناني، والأفصح في السرد العربي الحديث نقله بالماضي.
- source_word: γυνή
  choice: المرأة
  rationale: يشير السياق إلى المرأة السامرية، لا إلى الزوجة.
- source_word: Οἶδα
  choice: أعرف
  rationale: تعبير عربي مباشر وطبيعي عن العلم بحقيقة أو شخص منتظر.
- source_word: Μεσσίας
  choice: مَسِيّا
  rationale: نقل صوتي للقب السامي كما أورده النص اليوناني، وبذلك يبقى الشرح اللاحق بلفظ «المسيح» ظاهرًا.
- source_word: ἔρχεται
  choice: آتٍ
  rationale: يحمل المضارع هنا معنى المستقبل القريب أو المنتظر، و«آتٍ» موجزة وطبيعية وتحافظ على قوة التعبير.
- source_word: ὁ λεγόμενος χριστός
  choice: وهو الذي يُدعى المسيح
  rationale: يحفظ العبارة التفسيرية التي تقابل اللقب السامي «مَسِيّا» بنظيره اليوناني «المسيح».
- source_word: ὅταν ἔλθῃ ἐκεῖνος
  choice: وعندما يأتي، فهو
  rationale: «عندما يأتي» تؤدي الظرف المستقبلي، واستئناف «فهو» يحفظ قدرًا من توكيد اسم الإشارة ἐκεῖνος من غير صياغة عربية متكلفة.
- source_word: ἀναγγελεῖ ἡμῖν ἅπαντα
  choice: سيخبرنا بكل شيء
  rationale: صياغة عربية واضحة تؤدي معنى إظهار الأمور وإبلاغها لنا، وتحفظ شمول ἅπαντα.
theological_decisions:
- issue: التمييز بين Μεσσίας وχριστός في العبارة التفسيرية
  choice: نقل Μεσσίας صوتيًا «مَسِيّا»، وترجمة χριστός باللقب العربي المألوف «المسيح».
  alternative: ترجمة اللفظين كليهما «المسيح»، أو استعمال «الممسوح» للفظ الثاني.
  rationale: يورد النص لقبًا ساميًا منقولًا إلى اليونانية ثم يشرحه باللقب اليوناني المقابل. إبقاء اللفظ الأول منقولًا والثاني مترجمًا يحفظ البنية التفسيرية ولا يجعل اللقبين اسمين لشخصين مختلفين.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُعمل «مَسِيّا» لإبراز الشرح الثنائي اللغة في الأصل، ووُضع مؤشر الحاشية مباشرة بعد العبارة التي يشرحها.
