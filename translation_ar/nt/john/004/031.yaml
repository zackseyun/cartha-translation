  text: Meanwhile, the disciples were urging him, saying, “Rabbi, eat.”
translation:
  language: ar
  text: 'وفي أثناء ذلك كان التلاميذ يلحّون عليه[b] قائلين: «يا معلّم[a]، كُلْ».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «رابي» لقب مخاطبة يهودي معناه «معلّم».
    reason: cultural_note
  - marker: b
    text: 'يمكن أيضًا ترجمة الفعل: «كانوا يطلبون منه» أو «ظلّوا يطلبون منه»؛ والمقصود هنا أنهم كانوا يحثّونه على الأكل.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν τῷ μεταξὺ
  choice: وفي أثناء ذلك
  rationale: تعبير زمني يدل على الفترة الواقعة بين انصراف المرأة والحوار التالي، وهذه صياغة عربية طبيعية وواضحة.
- source_word: ἠρώτων
  choice: كان التلاميذ يلحّون عليه
  rationale: الفعل في صيغة الماضي الناقص يدل على فعل مستمر أو متكرر، والسياق يفيد أنهم كانوا يحثّونه على الأكل، لا أنهم يطرحون سؤالًا لمجرد الاستفهام.
- source_word: αὐτὸν
  choice: عليه
  rationale: 'ضمير يعود إلى يسوع، وجاء مع الفعل «يلحّون» وفق الاستعمال العربي الطبيعي: يلحّون عليه.'
- source_word: οἱ μαθηταὶ
  choice: التلاميذ
  rationale: أداة التعريف تحدد الجماعة المعروفة من السياق، فلا حاجة إلى إضافة «تلاميذه».
- source_word: λέγοντες
  choice: قائلين
  rationale: يحفظ وظيفة اسم الفاعل الذي يمهّد لمضمون طلبهم بصياغة عربية فصيحة.
- source_word: Ῥαββί
  choice: يا معلّم
  rationale: اللفظ لقب مخاطبة يهودي معناه «معلّم». ترجمة المعنى أوضح للقارئ العربي، مع بيان اللفظ الثقافي في الحاشية.
- source_word: φάγε
  choice: كُلْ
  rationale: أمر مفرد مباشر من فعل الأكل، وترجمته الموجزة تحفظ قوة الأصل دون توسع تفسيري.
