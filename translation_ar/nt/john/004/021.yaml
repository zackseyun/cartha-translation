source:
  edition: SBLGNT
  text: λέγει αὐτῇ ὁ Ἰησοῦς· ⸂Πίστευέ μοι, γύναι⸃, ὅτι ἔρχεται ὥρα ὅτε οὔτε ἐν τῷ ὄρει τούτῳ οὔτε ἐν Ἱεροσολύμοις προσκυνήσετε τῷ πατρί.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/021.yaml
  text: Jesus said to her[a], “Believe me, woman[c][b], an hour is coming when neither on this mountain nor in Jerusalem will you worship the Father.”
translation:
  language: ar
  text: 'قال لها يسوع: «صدّقيني[a]، يا امرأة[b]، تأتي ساعة[c] لا تعبدون فيها الآب، لا على هذا الجبل ولا في أورشليم.»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ثقي بي». يمكن للفعل اليوناني أن يعني تصديق ما يقوله الشخص أو الثقة به.'
    reason: lexical_alternative
  - marker: b
    text: كان النداء «يا امرأة» في هذا السياق محترمًا، ولم يكن تعبيرًا فظًّا.
    reason: cultural_note
  - marker: c
    text: 'أو: «تأتي الساعة». مع أن كلمة «ساعة» هنا بلا أداة تعريف في اليونانية، فكثيرًا ما يستخدمها يوحنا للدلالة على زمن حاسم في تدبير الله.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πίστευέ μοι
  choice: صدّقيني
  rationale: صيغة الأمر مع ضمير المتكلم في حالة المجرور تطلب منها أن تقبل صدق ما سيقوله يسوع. «صدّقيني» عربية طبيعية وتحافظ على الصلة بالفعل اليوناني πιστεύω، مع بقاء معنى «ثقي بي» ممكنًا.
- source_word: γύναι
  choice: يا امرأة
  rationale: نقل مباشر لصيغة النداء اليونانية. كانت في هذا السياق صيغة خطاب محترمة لا إهانة فيها، ويبيّن ذلك الهامش دون إضافة وصف غير موجود في الأصل.
- source_word: ἔρχεται ὥρα
  choice: تأتي ساعة
  rationale: يحافظ على غياب أداة التعريف وعلى لفظ «ساعة» المتكرر بوصفه لفظًا موضوعيًا في إنجيل يوحنا، بدل تعميمه إلى «وقت».
- source_word: ἐν τῷ ὄρει τούτῳ
  choice: على هذا الجبل
  rationale: حرف الجر «على» هو التعبير العربي الطبيعي مع الجبل بوصفه موضع العبادة.
- source_word: ἐν Ἱεροσολύμοις
  choice: في أورشليم
  rationale: صياغة عربية مألوفة لاسم المدينة ولمعنى حرف الجر المكاني.
- source_word: προσκυνήσετε
  choice: تعبدون
  rationale: فعل مستقبل للمخاطب الجمع، والسياق يتناول العبادة الدينية لا مجرد الانحناء الجسدي.
- source_word: τῷ πατρί
  choice: الآب
  rationale: يشير السياق اليوحناوي إلى الله بصفته الآب؛ و«الآب» هو المقابل العربي الواضح للقب الإلهي.
- source_word: οὔτε ... οὔτε
  choice: لا ... ولا
  rationale: المقابل العربي الطبيعي للتركيب المترابط، ويحفظ نفي الموضعين معًا.
theological_decisions:
- issue: نبرة نداء يسوع γύναι
  choice: يا امرأة
  alternative: يا سيدتي؛ أيتها المرأة العزيزة
  rationale: يحفظ اللفظ الأصلي من غير تلطيف تفسيري، مع توضيح طابعه المحترم في هامش حتى لا يُفهم بوصفه جفاءً.
- issue: دلالة ὥρα في إنجيل يوحنا
  choice: ساعة
  alternative: وقت؛ الساعة
  rationale: يبقي اللفظ اليوحناوي المتكرر ويحفظ التوتر بشأن الزمن الحاسم الآتي، كما يعكس غياب أداة التعريف في هذا الموضع.
- issue: نطاق التحول في موضع العبادة
  choice: لا تعبدون فيها الآب، لا على هذا الجبل ولا في أورشليم
  alternative: لن تعبدوا الآب على هذا الجبل ولا في أورشليم
  rationale: يحافظ على نفي كلا الموقعين دون تفسير طبيعة العبادة الجديدة أو إدخال حكم طائفي بشأنها.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدم «صدّقيني» مراعاةً لجنس المخاطبة، وحُفظت «ساعة» و«يا امرأة» لقربهما من الأصل مع إسناد ما قد يلتبس إلى الهوامش. وُضع الظرف «فيها» لربط النفي بالساعة الآتية بوضوح طبيعي.
