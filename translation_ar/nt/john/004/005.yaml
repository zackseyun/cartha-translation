base_translation:
  language: en
  yaml_path: translation/nt/john/004/005.yaml
  text: So he came to a town of Samaria called Sychar[b][a], near the piece of land that Jacob had given to Joseph his son.
translation:
  language: ar
  text: فجاء إلى بلدةٍ في السامرة تُدعى سوخار، بالقرب من قطعة الأرض[a] التي أعطاها يعقوب لابنه يوسف.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الحقل» أو «المُلك من الأرض». يمكن أن تدل الكلمة اليونانية χωρίον على حقل أو مُلك أو قطعة من الأرض.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: فجاء
  rationale: المضارع اليوناني هنا مضارع تاريخي في السرد، والماضي هو الأسلوب الطبيعي في العربية مع الحفاظ على تتابع الأحداث.
- source_word: οὖν
  choice: فـ
  rationale: تفيد الفاء الانتقال أو النتيجة المتصلة بالسياق السابق، وهي موجزة وطبيعية في السرد العربي.
- source_word: πόλιν
  choice: بلدة
  rationale: يمكن أن تدل πόλις على مدينة أو بلدة؛ واختيار «بلدة» لا يبالغ في تقدير حجم سوخار، مع إثبات البديل في الحاشية.
- source_word: τῆς Σαμαρείας
  choice: في السامرة
  rationale: ترجمة مكانية طبيعية للمضاف إليه الذي يحدد الإقليم الذي تقع فيه البلدة.
- source_word: λεγομένην Συχὰρ
  choice: تُدعى سوخار
  rationale: صياغة عربية واضحة وطبيعية للعبارة التي تعرّف البلدة باسمها.
- source_word: πλησίον
  choice: بالقرب من
  rationale: تنقل الدلالة المكانية المباشرة بعبارة عربية مألوفة.
- source_word: χωρίου
  choice: قطعة الأرض
  rationale: لفظ شامل لقطعة أو ملك من الأرض، ولا يحصر المعنى في أرض مزروعة كما قد تفعل كلمة «حقل».
- source_word: ὃ ἔδωκεν Ἰακὼβ
  choice: التي أعطاها يعقوب
  rationale: يحافظ على صلة الموصول وعلى الفعل الماضي بوصف العطية حدثًا سابقًا.
- source_word: τῷ Ἰωσὴφ τῷ υἱῷ αὐτοῦ
  choice: لابنه يوسف
  rationale: صياغة عربية طبيعية تحفظ كون يوسف متلقي العطية وابن يعقوب، وإن غيّرت ترتيب الاسم والصفة بما يلائم العربية.
