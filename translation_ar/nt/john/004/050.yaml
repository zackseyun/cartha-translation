  text: λέγει αὐτῷ ὁ Ἰησοῦς· Πορεύου· ὁ υἱός σου ζῇ. ⸀ἐπίστευσεν ὁ ἄνθρωπος τῷ λόγῳ ⸀ὃν εἶπεν αὐτῷ ὁ Ἰησοῦς καὶ ἐπορεύετο.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/050.yaml
  text: Jesus said to him[a], “Go; your son lives.” The man believed the word that Jesus spoke to him and went on his way.
translation:
  language: ar
  text: 'فقال له يسوع: «اذهب، ابنك حيّ». فآمن[a] الرجل بما قاله له يسوع، ومضى في طريقه.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وثق الرجل بما قاله له يسوع».'
    reason: بديل معجمي يبرز معنى الثقة الممكن في ἐπίστευσεν مع القول الموجَّه إليه.
lexical_decisions:
- source_word: Πορεύου
  choice: اذهب
  rationale: فعل أمر مباشر وطبيعي في العربية، يحافظ على إيجاز العبارة وحركة السرد.
- source_word: ὁ υἱός σου
  choice: ابنك
  rationale: ينقل υἱός بدقة بوصفه «الابن»، لا اللفظ الأعم «الطفل».
- source_word: ζῇ
  choice: حيّ
  rationale: خبر حاضر موجز يقابل معنى «يحيا/هو حي»، من غير تحويله إلى وعد مستقبلي.
- source_word: ἐπίστευσεν
  choice: آمن
  rationale: يحافظ على المقابل المعتاد لجذر πιστεύω، مع بقاء معنى التصديق والثقة حاضرًا في السياق.
- source_word: ὁ ἄνθρωπος
  choice: الرجل
  rationale: يتبع الوصف العام في هذه الآية، ولا يستبدله بلقب «الموظف الملكي» الوارد في السياق السابق.
- source_word: τῷ λόγῳ ὃν εἶπεν αὐτῷ ὁ Ἰησοῦς
  choice: بما قاله له يسوع
  rationale: صياغة عربية طبيعية تنقل أن موضوع إيمانه هو القول الذي وجّهه يسوع إليه، وتتجنب التركيب الحرفي الثقيل «بالكلمة التي قالها».
- source_word: ἐπορεύετο
  choice: مضى في طريقه
  rationale: ينقل شروع الرجل في الذهاب واستمراره في طريقه بعد أن آمن، بما يلائم صيغة الماضي الناقص وسياق الرحلة.
theological_decisions:
- issue: دلالة πιστεύω في استجابة الرجل لوعد يسوع
  choice: آمن
  alternative: وثق بما قاله له يسوع
  rationale: لا تحسم الآية طبيعة هذا الإيمان ضمن تصنيفات عقائدية لاحقة؛ ولفظ «آمن» يبقي التوتر السردي واللاهوتي، بينما توضح الحاشية إمكان إبراز معنى الثقة.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم التركيب الاسمي الموجز «ابنك حيّ» للمحافظة على قوة إعلان يسوع، وصيغت جملة λόγος على نحو طبيعي في العربية دون إضعاف معناها.
