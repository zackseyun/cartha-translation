  text: 'فَإِنَّهُ فِي هٰذَا يَصْدُقُ الْقَوْلُ: «وَاحِدٌ يَزْرَعُ، وَآخَرُ يَحْصُدُ».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فَإِنَّهُ فِي هٰذَا يَكُونُ الْقَوْلُ حَقًّا: وَاحِدٌ هُوَ الزَّارِعُ، وَآخَرُ هُوَ الْحَاصِدُ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν γὰρ τούτῳ
  choice: فَفِي هٰذَا
  rationale: تحافظ الفاء على الصلة التفسيرية التي تؤديها γάρ، وتحفظ عبارة «في هذا» الإشارة المجملة إلى الحالة التي يصفها يسوع من غير زيادة تفسيرية.
- source_word: ὁ λόγος
  choice: القول
  rationale: يدل λόγος هنا على قول شائع أو حكمة موجزة، لا على لقب «الكلمة». و«القول» عربي طبيعي ولا يخصصه بوصفه مثلًا أكثر مما يسمح به اليوناني.
- source_word: ἐστὶν ἀληθινός
  choice: يَصْدُقُ
  rationale: صياغة عربية فصيحة وطبيعية تؤدي معنى كون القول صحيحًا وثابتًا في هذه الحالة.
- source_word: ὅτι
  choice: ':'
  rationale: تُدخل النقطتان مضمون القول مباشرة، وهو أداء طبيعي لوظيفة ὅτι هنا.
- source_word: ἄλλος ... καὶ ἄλλος
  choice: واحدٌ ... وآخرُ
  rationale: تحفظ المقابلة بين طرفين مختلفين بإيجاز ووضوح.
- source_word: ὁ σπείρων
  choice: واحدٌ يزرع
  rationale: يحفظ الفعل الجاري في اسم الفاعل اليوناني مع صياغة عربية طبيعية، ويتجنب حصر المعنى في لقب ثابت مثل «الزارع».
- source_word: ὁ θερίζων
  choice: آخرُ يحصد
  rationale: يوازي «واحد يزرع» ويحفظ الدلالة الفعلية لاسم الفاعل اليوناني في عبارة عربية مأثورة الإيقاع.
theological_decisions:
- issue: تحديد المقصود بالزارع والحاصد
  choice: إبقاء القول عامًا من غير تسمية أطرافه المقصودة
  alternative: تعيين الزارع بالأنبياء أو يوحنا المعمدان أو يسوع، والحاصد بالتلاميذ
  rationale: النص اليوناني في هذه الآية يورد حكمة عامة، ويترك للسياق تطبيقها؛ فتعيين الأشخاص داخل الترجمة يضيف تفسيرًا لا يصرح به النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة وقورة. صيغ القول بإيقاع موجز يلائم الحكمة الشائعة، مع الحفاظ على الصلة بالسياق وعلى المقابلة بين فعل الزرع وفعل الحصاد.
