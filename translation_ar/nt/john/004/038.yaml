  text: I sent you to reap what you have not labored for[a]; others have labored[b], and you have entered into their labor.
translation:
  language: ar
  text: أنا أرسلتكم لتحصدوا ما لم تتعبوا فيه[a]. آخرون تعبوا، وأنتم دخلتم في تعبهم[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لتجمعوا المحصول الذي لم تتعبوا فيه».'
