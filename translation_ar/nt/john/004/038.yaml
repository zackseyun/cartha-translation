  - marker: b
    text: 'أو بالمعنى: «شاركتم في ثمرة تعبهم» أو «شاركتم في عملهم». واليونانية تقول حرفيًا: «دخلتم في تعبهم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλα
  choice: أرسلت
  rationale: صيغة الماضي اليونانية تشير هنا إلى إرسال تمّ، و«أرسلت» تحفظ معنى الإرسال من غير توسيعه إلى تكليف تفسيري.
- source_word: θερίζειν
  choice: لتحصدوا
  rationale: تحفظ الصورة الزراعية القائمة في السياق، وهي عبارة عربية واضحة وطبيعية.
- source_word: ὃ
  choice: ما
  rationale: الاسم الموصول المحايد مستعمل استعمالًا اسميًا، و«ما» تؤدي معناه بإيجاز وطبيعية.
- source_word: κεκοπιάκατε
  choice: لم تتعبوا فيه
  rationale: تحفظ معنى بذل الجهد، وتربط التعب بما يُحصد ربطًا عربيًا طبيعيًا من غير إضافة «الثمر» غير المذكور صراحة.
- source_word: ἄλλοι
  choice: آخرون
  rationale: تنقل الجمع المطلق كما هو، من غير تعيين هوية هؤلاء الآخرين.
- source_word: κεκοπιάκασιν
  choice: تعبوا
  rationale: تكرر جذر «تعب» للمحافظة على الصلة اللفظية مع الفعل السابق والاسم اللاحق، مع دلالة السياق على أثر العمل السابق.
- source_word: εἰς τὸν κόπον αὐτῶν εἰσεληλύθατε
  choice: دخلتم في تعبهم
  rationale: ترجمة قريبة من التركيب اليوناني تحفظ غرابته المقصودة ولا تستبدله تفسيرًا مثل الانتفاع بثمر عملهم أو المشاركة فيه.
- source_word: ἐγὼ ... ὑμεῖς
  choice: أنا ... أنتم
  rationale: إظهار الضميرين يحفظ قدرًا من التوكيد الموجود بسبب التصريح بهما في اليونانية.
- source_word: κόπον
  choice: تعبهم
  rationale: اختيار «تعب» يحافظ على التجانس الاشتقاقي مع «تتعبوا» و«تعبوا»، ويعبّر عن العمل الشاق لا عن العمل بمعناه العام فقط.
theological_decisions:
- issue: هوية «الآخرين» وطبيعة الحصاد
  choice: الإبقاء على «آخرون» والصورة الزراعية من غير تحديد المقصودين
  alternative: تعيين الآخرين بالأنبياء أو يوحنا المعمدان أو يسوع، أو التصريح بأن الحصاد هو ثمرة خدمتهم
  rationale: النص لا يحدد هوية الآخرين، ولذلك تُحفظ سعته والتوتر التفسيري فيه بدل إدخال تحديد عقائدي أو تاريخي.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم «حصد» للإبقاء على الاستعارة الزراعية، و«تعب» في المواضع الثلاثة للمحافظة قدر الإمكان على الترابط الاشتقاقي في اليونانية. أُبقي التركيب «دخلتم في تعبهم» في المتن رغم شيء من غرابته لأنه الأقرب إلى الأصل، مع شرح البدائل في الحاشية.
