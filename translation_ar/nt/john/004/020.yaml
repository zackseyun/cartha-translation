  text: οἱ πατέρες ἡμῶν ἐν τῷ ὄρει τούτῳ προσεκύνησαν· καὶ ὑμεῖς λέγετε ὅτι ἐν Ἱεροσολύμοις ἐστὶν ὁ τόπος ὅπου ⸂προσκυνεῖν δεῖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/020.yaml
  text: Our fathers worshiped on this mountain[b][a], and you say that in Jerusalem is the place where one must worship.
translation:
  language: ar
  text: سجد آباؤنا[a] على هذا الجبل، وأنتم تقولون إن المكان الذي يجب أن يسجد فيه الناس[b] هو في أورشليم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أسلافنا».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «ينبغي السجود فيه».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πατέρες ἡμῶν
  choice: آباؤنا
  rationale: يحافظ على التعبير اليوناني الحرفي وعلى دلالة الانتماء الجماعي والتاريخي، مع بيان البديل «أسلافنا» في الحاشية.
- source_word: ἐν τῷ ὄρει τούτῳ
  choice: على هذا الجبل
  rationale: حرف الجر «على» هو التعبير العربي الطبيعي عند الحديث عن موضع العبادة فوق جبل، ويؤدي المعنى المكاني لـἐν في هذا السياق.
- source_word: προσεκύνησαν
  choice: سجد
  rationale: ينقل فعل προσκυνέω بما فيه من سجود تعبدي، ويلائم سياق الخلاف بشأن موضع العبادة من غير إضافة مفعول غير مصرّح به في الأصل.
- source_word: ὑμεῖς
  choice: أنتم
  rationale: إثبات الضمير المنفصل يحفظ المقابلة الصريحة في اليونانية بين «آباؤنا» و«أنتم» من غير إضافة «اليهود» أو غيرها.
- source_word: ἐν Ἱεροσολύμοις
  choice: في أورشليم
  rationale: صياغة عربية مكانية طبيعية، ولا تستدعي الصيغة اليونانية لاسم المدينة أي تغيير في الاسم العربي.
- source_word: ὁ τόπος
  choice: المكان
  rationale: ترجمة مباشرة تحفظ التعريف، من غير إدخال وصف تفسيري مثل «المكان الصحيح».
- source_word: ὅπου
  choice: الذي ... فيه
  rationale: تركيب صلة عربي طبيعي يؤدي وظيفة ظرف المكان النسبي في اليونانية.
- source_word: προσκυνεῖν δεῖ
  choice: يجب أن يسجد فيه الناس
  rationale: يحفظ معنى الضرورة العامة غير الموجّهة إلى شخص بعينه، ويجعل التركيب واضحًا في العربية الحديثة.
- source_word: καὶ
  choice: و
  rationale: يحافظ على حرف العطف التنسيقي في الأصل، بينما تظهر المقابلة من الضمير «أنتم» والسياق.
theological_decisions:
- issue: هل تُصرَّح هويتا السامريين واليهود في المقابلة؟
  choice: أُبقيت المقابلة ضمنية في «آباؤنا ... وأنتم تقولون».
  alternative: «آباؤنا السامريون ... وأنتم أيها اليهود تقولون»
  rationale: الأصل يبرز المقابلة بالضمائر والسياق، ولا يسمّي الطرفين في هذه الآية؛ والتصريح بهما يضيف تفسيرًا غير وارد في ألفاظها.
- issue: كيفية نقل الضرورة غير الشخصية في προσκυνεῖν δεῖ
  choice: «يجب أن يسجد فيه الناس»
  alternative: «ينبغي السجود فيه»
  rationale: الصياغة المختارة تنقل الإلزام العام بوضوح من غير تحويل الكلام إلى أمر موجه إلى فرد محدد، مع إبقاء الصياغة الأقرب إلى البنية غير الشخصية في الحاشية.
- issue: دلالة προσκυνέω بين السجود والعبادة
  choice: «سجد»
  alternative: «تعبّد» أو «عبد»
  rationale: «سجد» يحفظ الصورة الجسدية والتعبدية الكامنة في الفعل ولا يحسمها في لفظ أعم، والسياق يوضح أن المقصود سجود العبادة.
translation_notes:
  register: لغة عربية فصحى حديثة واضحة ومهيبة. حُفظت المقابلة بين الجماعتين من خلال «آباؤنا» و«أنتم»، واستُعمل «سجد» لصون الصلة اللفظية بين الفعلين اليونانيين في نص الآية.
