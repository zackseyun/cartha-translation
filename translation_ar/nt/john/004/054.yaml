source:
  edition: SBLGNT
  text: τοῦτο ⸀δὲ πάλιν δεύτερον σημεῖον ἐποίησεν ὁ Ἰησοῦς ἐλθὼν ἐκ τῆς Ἰουδαίας εἰς τὴν Γαλιλαίαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/054.yaml
  text: This again was the second sign Jesus did after coming from Judea into Galilee[a].
translation:
  language: ar
  text: وهذه أيضًا هي الآية الثانية التي صنعها يسوع بعدما جاء من اليهودية إلى الجليل[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «المعجزة». يكثر يوحنا من استعمال «الآية» لإبراز دلالة العمل إلى جانب قوته الخارقة.'
    reason: بديل معجمي يوضح المجال الدلالي لكلمة σημεῖον.
lexical_decisions:
- source_word: τοῦτο
  choice: وهذه
  rationale: اسم الإشارة يعود إلى حادثة الشفاء التي رُويت للتو، وجاء مؤنثًا لموافقته «الآية» في العربية.
- source_word: δὲ πάλιν
  choice: أيضًا
  rationale: ينقل معنى التكرار مع الربط الخفيف الذي تؤديه δέ، من غير إثقال العبارة بحرف عطف استدراكي لا يقتضيه السياق.
- source_word: δεύτερον
  choice: الثانية
  rationale: عدد ترتيبي يصف «الآية»، وصيغته المؤنثة توافق الاسم العربي.
- source_word: σημεῖον
  choice: الآية
  rationale: تحفظ الدلالة اليوحناوية على عمل خارق يشير إلى معنى يتجاوز القدرة الظاهرة وحدها، بخلاف «المعجزة» التي قد تبرز الجانب الخارق فقط.
- source_word: ἐποίησεν
  choice: صنعها
  rationale: ترجمة مباشرة وطبيعية نسبيًا لاقتران ποιέω بـσημεῖον، مع ضمير يعود إلى الآية.
- source_word: ἐλθὼν
  choice: بعدما جاء
  rationale: يُفهم اسم الفاعل الماضي هنا على وجه زمني سابق للفعل الرئيس، فتحفظ الصياغة ترتيب الوصول ثم صنع الآية.
- source_word: ἐκ τῆς Ἰουδαίας
  choice: من اليهودية
  rationale: ينقل المعنى المكاني المباشر لحرف الجر ἐκ.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: إلى الجليل
  rationale: صياغة عربية طبيعية تنقل اتجاه الحركة الذي يدل عليه εἰς.
theological_decisions:
- issue: مصطلح σημεῖον في إنجيل يوحنا
  choice: الآية
  alternative: المعجزة
  rationale: «الآية» تحافظ على الوظيفة الأدبية واللاهوتية للمصطلح في يوحنا، إذ يدل العمل على حقيقة تتجاوز الحدث الخارق نفسه، من غير إضافة تفسير مذهبي.
- issue: علاقة «الثانية» بعودة يسوع إلى الجليل
  choice: الإبقاء على الصياغة التي تعدّها الآية الثانية بعدما جاء من اليهودية إلى الجليل
  alternative: اعتبارها ثاني آيات يسوع على الإطلاق
  rationale: تركيب النص قد يربط الترتيب بخدمة يسوع في الجليل بعد مجيئه من اليهودية؛ لذلك لم تُضف عبارة تحسم نطاق العدّ بما يتجاوز النص.
translation_notes:
  register: فصحى معاصرة واضحة ووقورة. استُعملت «الآية» اتساقًا مع المصطلح اليوحناوي، وحُفظت البنية الزمنية من غير تكلف حرفي.
