  text: Ὡς οὖν ἔγνω ὁ ⸀Ἰησοῦς ὅτι ἤκουσαν οἱ Φαρισαῖοι ὅτι Ἰησοῦς πλείονας μαθητὰς ποιεῖ καὶ βαπτίζει ἢ Ἰωάννης—
base_translation:
  language: en
  yaml_path: translation/nt/john/004/001.yaml
  text: Therefore[a], when Jesus knew that the Pharisees had heard that Jesus was making and baptizing more disciples than John—
translation:
  language: ar
  text: فلما علم يسوع أن الفريسيين سمعوا أنه يجعل تلاميذ أكثر من يوحنا ويعمّد—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أنه يجعل تلاميذ ويعمّد أكثر مما يفعل يوحنا». يحتمل النص اليوناني أن تتعلق المقارنة بالنشاطين معًا، لا بعدد «التلاميذ» وحده.'
    reason: بديل تركيبي يحفظ احتمال نطاق المقارنة في الأصل اليوناني.
lexical_decisions:
- source_word: Ὡς οὖν
  choice: فلما
  rationale: تفيد «لما» الزمن، وتربط الفاء الجملة بما قبلها بما يلائم وظيفة οὖν الاستنتاجية أو الانتقالية في السياق القصصي.
- source_word: ἔγνω
  choice: علم
  rationale: صيغة الماضي من γινώσκω هنا تدل على أن يسوع عرف الأمر أو صار على علم به، و«علم» موجزة وفصيحة.
- source_word: οἱ Φαρισαῖοι
  choice: الفريسيين
  rationale: الصيغة العربية المعيارية لاسم هذه الجماعة، مع أداة التعريف.
- source_word: ἤκουσαν
  choice: سمعوا
  rationale: الماضي العربي داخل مضمون العلم يوضح طبيعيًا أن الخبر بلغ الفريسيين قبل تصرف يسوع، من غير حاجة إلى تركيب زائد.
- source_word: πλείονας μαθητὰς
  choice: تلاميذ ... أكثر
  rationale: ينقل المقارنة العددية بعبارة عربية طبيعية، مع تأخير «أكثر» لتشمل نحويًا النشاطين المنسقين وتحفظ احتمال التركيب اليوناني.
- source_word: ποιεῖ
  choice: يجعل تلاميذ
  rationale: يحافظ على معنى ποιέω مع μαθητάς، أي ضمّ أشخاص ليصيروا تلاميذ، بلفظ قريب من الأصل ومفهوم.
- source_word: βαπτίζει
  choice: يعمّد
  rationale: هو المقابل العربي الكتابي الشائع والواضح للفعل βαπτίζω.
- source_word: ἢ Ἰωάννης
  choice: من يوحنا
  rationale: صيغة المقارنة العربية الطبيعية بعد «أكثر»، مع إبقاء العبارة موجزة كما في اليونانية.
theological_decisions:
- issue: احتمال أن يوحي ظاهر الآية بأن يسوع كان يعمّد بنفسه
  choice: 'الإبقاء على ظاهر العبارة: «يجعل تلاميذ ويعمّد»'
  alternative: 'استباق توضيح الآية التالية بصياغة مثل: «يجعل تلاميذ وكان تلاميذه يعمّدون»'
  rationale: تنسب هذه الآية النشاط إلى يسوع في ظاهرها، ثم تأتي الآية 4:2 لتوضح أن تلاميذه هم الذين كانوا يعمّدون. لذلك لا ينبغي إدخال توضيح الآية التالية هنا أو إزالة التوتر السردي.
- issue: نطاق المقارنة في πλείονας μαθητὰς ποιεῖ καὶ βαπτίζει ἢ Ἰωάννης
  choice: 'صياغة تسمح بأن تتعلق «أكثر من يوحنا» بالنشاط المركب: جعل التلاميذ والتعميد'
  alternative: 'فهم «أكثر» على أنها تصف عدد التلاميذ وحده: «يجعل تلاميذ أكثر من يوحنا ويعمّدهم»'
  rationale: يحتمل التركيب اليوناني أن تنطبق المقارنة على النشاطين المنسقين، كما يحتمل أن يكون التركيز على عدد التلاميذ؛ لذا حُفظ الاحتمال الآخر في الحاشية بدل حسمه صمتًا.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. استُعملت «فلما» لربط الزمن بالسياق السابق بسلاسة، وحُفظت الشرطة في نهاية الآية لأن الجملة تستمر في الآية التالية. وُضع مؤشر الحاشية [a] بعد العبارة المقارَنة وقبل اكتمال الجملة الممتدة.
