source:
  edition: SBLGNT
  text: ἔγνω οὖν ὁ πατὴρ ⸀ὅτι ἐκείνῃ τῇ ὥρᾳ ἐν ᾗ εἶπεν αὐτῷ ὁ ⸀Ἰησοῦς· Ὁ υἱός σου ζῇ, καὶ ἐπίστευσεν αὐτὸς καὶ ἡ οἰκία αὐτοῦ ὅλη.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/053.yaml
  text: So the father knew that it was at that hour when Jesus said to him[a], “Your son lives,” and he himself believed[b], and his whole household.
translation:
  language: ar
  text: 'فعرف الأب أن ذلك كان في تلك الساعة التي قال له فيها يسوع: «ابنك حيّ»[a]. فآمن هو وأهل بيته جميعًا[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: «ابنك يعيش».'
    reason: lexical_alternative
  - marker: b
    text: قد يشير «آمن» إلى تصديقه كلمة يسوع على وجه الخصوص، أو إلى بلوغه إيمانًا أكمل بيسوع؛ فالنص اليوناني لا يحدد مدى الإيمان صراحةً.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔγνω
  choice: فعرف
  rationale: يدل الماضي هنا على إدراك الأب التطابق بين ساعة شفاء ابنه والساعة التي نطق فيها يسوع بكلمته؛ و«عرف» واضحة وتحافظ على الدلالة المعرفية.
- source_word: οὖν
  choice: فـ
  rationale: تفيد نتيجةً مستخلصة من خبر الخدم في الآية السابقة، والفاء هي أوجز رابط سببي استنتاجي طبيعي في العربية.
- source_word: ὁ πατὴρ
  choice: الأب
  rationale: يتبع التعبير اليوناني مباشرة ويحافظ على التركيز السردي على علاقته بابنه بدل إعادة وصفه بالموظف الملكي.
- source_word: ἐκείνῃ τῇ ὥρᾳ
  choice: في الساعة نفسها
  rationale: يشير التركيب إلى الساعة المحددة التي طابقت وقت قول يسوع؛ و«نفسها» توضح المطابقة التي يقررها السياق من غير إضافة «بالضبط».
- source_word: ἐν ᾗ
  choice: التي ... فيها
  rationale: صياغة عربية طبيعية للموصول الزمني اليوناني، مع الحفاظ على صلته بـ«الساعة».
- source_word: εἶπεν αὐτῷ ὁ Ἰησοῦς
  choice: قال له فيها يسوع
  rationale: ترجمة مباشرة وطبيعية لفعل القول مع المفعول غير المباشر.
- source_word: Ὁ υἱός σου ζῇ
  choice: ابنك حيّ
  rationale: ينقل المضارع ζῇ بوصفه تقريرًا لحالة حاضرة. وهذه الصياغة أفصح وأطبع في العربية من الترجمة الحرفية «ابنك يحيا» في هذا السياق.
- source_word: ἐπίστευσεν
  choice: فآمن
  rationale: «آمن» المقابل المعتاد لـπιστεύω، ويحافظ هنا على إطلاق الفعل من غير تحديد زائد لموضوع الإيمان أو مداه.
- source_word: αὐτὸς
  choice: هو
  rationale: إبراز الضمير المنفصل يحفظ قدرًا من توكيد الضمير اليوناني ويميز الأب عن أهل بيته.
- source_word: ἡ οἰκία αὐτοῦ ὅλη
  choice: أهل بيته جميعًا
  rationale: οἰκία تدل هنا على الجماعة المنزلية لا المبنى، و«أهل بيته جميعًا» عربية واضحة تنقل معنى الشمول في ὅλη.
theological_decisions:
- issue: مدلول إيمان الأب
  choice: 'الإبقاء على الفعل مطلقًا: «فآمن»'
  alternative: أن يُفهم بأنه صدّق كلمة يسوع الخاصة بالشفاء فقط، أو أنه بلغ في هذه اللحظة إيمانًا أكمل بيسوع
  rationale: لا يصرح النص اليوناني بمدى الإيمان أو موضوعه الكامل. والسياق يربطه بيسوع وكلمته، لكن الترجمة لا تحسم ما تركه النص ضمنيًا.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعملت «ابنك حيّ» لطبيعتها في العربية مع إثبات البديل الأقرب إلى صورة الفعل اليوناني في الحاشية، وحُفظ إطلاق «آمن» منعًا لحسم دلالة لاهوتية يتركها الأصل ضمنية.
