  yaml_path: translation/nt/john/004/029.yaml
  text: Come[a], see a man who told me everything I have done. Could this be the Messiah?
translation:
  language: ar
  text: تعالوا وانظروا إلى رجل أخبرني بكل ما فعلت. أيمكن أن يكون هذا هو المسيح؟[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ألعل هذا هو المسيح؟» تفيد صيغة السؤال اليونانية ترددًا، وقد توحي بتوقّع جواب بالنفي.'
    reason: بيان قوة أداة الاستفهام μήτι والمحافظة على احتمالها الدلالي.
lexical_decisions:
- source_word: Δεῦτε
  choice: تعالوا
  rationale: فعل دعوة موجَّه إلى جماعة؛ وصيغة الجمع العربية تنقل العدد وقوة النداء بوضوح.
- source_word: ἴδετε
  choice: انظروا إلى
  rationale: تأتي مع «تعالوا» دعوةً مباشرة إلى الذهاب ورؤية الرجل، وهذه صياغة عربية طبيعية وواضحة.
- source_word: ἄνθρωπον
  choice: رجل
  rationale: الاسم مفرد ويشير هنا إلى شخص ذكر هو يسوع؛ و«رجل» أدق في السياق من «شخص».
- source_word: ὃς εἶπέ μοι
  choice: أخبرني
  rationale: ينقل المعنى السياقي للفعل «قال لي» مع مضمون الخبر اللاحق بصورة عربية طبيعية.
- source_word: πάντα ὅσα
  choice: بكل ما
  rationale: يحفظ معنى الشمول الذي تؤديه العبارة اليونانية من غير إثقال الأسلوب العربي.
- source_word: ἐποίησα
  choice: فعلت
  rationale: الماضي العربي ينقل الفعل اليوناني الماضي بوضوح ويشمل أفعالها السابقة المقصودة في الشهادة.
- source_word: μήτι
  choice: أيمكن أن يكون
  rationale: صيغة استفهام احتمالية تحفظ تردد المتكلمة ودعوتها السامعين إلى النظر في الأمر، من غير تحويل السؤال إلى تقرير جازم.
- source_word: ὁ χριστός
  choice: المسيح
  rationale: ينقل اللقب اليهودي المنتظر ترجمةً مباشرة وطبيعية في العربية، لا باعتباره اسمًا شخصيًا مجردًا.
theological_decisions:
- issue: دلالة السؤال الذي تصدّره μήτι
  choice: أيمكن أن يكون هذا هو المسيح؟
  alternative: أليس هذا هو المسيح؟
  rationale: الأداة اليونانية قد توحي بتوقع جواب بالنفي أو بتردد، لكن السياق يُظهر أن المرأة تطرح احتمالًا وتدعو الآخرين إلى التحقق؛ لذلك حُفظت النبرة الاحتمالية مع بيان البديل في الحاشية.
- issue: ترجمة Χριστός بوصفه لقبًا
  choice: المسيح
  alternative: الممسوح
  rationale: «المسيح» هو المقابل العربي الراسخ للقب، ويحفظ خلفيته المسيانية في هذا السياق من دون صياغة تفسيرية ثقيلة.
