  yaml_path: translation/nt/john/004/051.yaml
  text: And while he was already going down[a], his servants met him, saying that his child was alive.
translation:
  language: ar
  text: 'وبينما كان نازلًا بالفعل، لقيه عبيده وقالوا له: «إن غلامك حيّ».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ابنك» أو «خادمك»؛ فاللفظة اليونانية المترجمة «غلام» قد تعني طفلًا أو فتىً، وقد تعني خادمًا في بعض السياقات.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤδη
  choice: كان نازلًا
  rationale: تفيد ἤδη أن النزول كان قد بدأ وصار جاريًا؛ ويؤدي السياق العربي مع «بينما» هذا المعنى طبيعيًا من غير حشو «بالفعل».
- source_word: δὲ
  choice: و
  rationale: أداة ربط سردية خفيفة تتابع مجرى الأحداث من غير دلالة قوية على الاستدراك.
- source_word: καταβαίνοντος
  choice: نازلًا
  rationale: اسم الفاعل المضارع في تركيب المضاف المطلق يدل على فعل مستمر متزامن؛ و«نازلًا» طبيعي في وصف السفر من قانا إلى كفرناحوم.
- source_word: δοῦλοι
  choice: عبيده
  rationale: يحفظ اللفظ واقع التبعية والملكية المنزلية الذي يدل عليه δοῦλοι، بخلاف «خدمه» التي قد توحي بعلاقة عمل حرة حديثة.
- source_word: ὑπήντησαν αὐτῷ
  choice: لقيه
  rationale: تعبير عربي موجز وطبيعي لمعنى ملاقاتهم إياه في الطريق، من غير زيادة غير لازمة.
- source_word: λέγοντες
  choice: وقالوا له
  rationale: تحويل اسم الفاعل المصاحب إلى فعل معطوف هو الأسلوب العربي الطبيعي، ويحفظ تزامن القول مع اللقاء.
- source_word: παῖς
  choice: غلامك
  rationale: «غلام» يحتمل الصبي والتابع أو الخادم في العربية، فيحفظ قدرًا من السعة الدلالية في παῖς من غير حسم غير لازم بأنه ابن.
- source_word: ζῇ
  choice: حيّ
  rationale: يحفظ المضارع اليوناني ودلالته المباشرة على كونه حيًا، من غير إضافة تفسيرية مثل «تعافى».
theological_decisions:
- issue: مرجع παῖς في رواية الشفاء
  choice: غلامك
  alternative: ابنك؛ خادمك
  rationale: اللفظة اليونانية واسعة الدلالة، وقد تشير إلى ولد أو صبي أو خادم. يحفظ «غلامك» هذا التوتر المعجمي، فيما توضّح الحاشية البدائل الممكنة من غير فرض قراءة مذهبية أو مواءمة صامتة مع ألفاظ السياق الأخرى.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة سردية كريمة. استُخدم «عبيده» لحفظ الواقع الاجتماعي، و«غلامك» لصون الغموض الحقيقي في παῖς. وُضعت علامة الحاشية بعد الجملة التي تتضمن اللفظة المشروحة.
