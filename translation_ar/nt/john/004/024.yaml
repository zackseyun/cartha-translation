source:
  edition: SBLGNT
  text: πνεῦμα ὁ θεός, καὶ τοὺς προσκυνοῦντας αὐτὸν ἐν πνεύματι καὶ ἀληθείᾳ δεῖ προσκυνεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/024.yaml
  text: God is spirit[b][a], and those who worship him must worship in spirit and truth.
translation:
  language: ar
  text: اللهُ روحٌ، وعلى الذين يسجدون له أن يسجدوا بالروح والحقّ.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا فهم العبارة: «بالروح القدس والحق». تحتمل اليونانية هذا المعنى الأخص، لكن صياغة المتن تُبقي العبارة على سعتها.'
    reason: alternative_reading
  - marker: b
    text: تصف عبارة «الله روح» طبيعة الله؛ ولا تعني أنه مجرد روح واحد بين أرواح أخرى.
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα
  choice: روحٌ
  rationale: خبر نوعي مقدَّم يصف طبيعة الله، ولا يقدّمه بوصفه روحًا واحدًا ضمن فئة من الأرواح. والتنكير في العربية يلائم الجملة الاسمية هنا من غير إدخال أداة تفيد أنه «روح من الأرواح».
- source_word: ὁ θεός
  choice: اللهُ
  rationale: المقابل العربي الطبيعي للاسم الإلهي في هذا السياق، وهو المبتدأ نحويًا رغم تأخره في ترتيب العبارة اليونانية.
- source_word: τοὺς προσκυνοῦντας
  choice: الذين يسجدون له
  rationale: اسم الفاعل المعرّف يدل على فئة العابدين عمومًا. واختيار «يسجدون له» يحفظ الدلالة الأصلية للفعل على الخضوع والسجود التعبدي بعبارة عربية طبيعية.
- source_word: ἐν πνεύματι
  choice: بالروح
  rationale: يحفظ اتساع العبارة اليونانية من غير أن يحسم هل المقصود الروح الإنساني في عبادة روحية أم الروح القدس تحديدًا؛ ويُذكر الوجه الأخص في الحاشية.
- source_word: ἀληθείᾳ
  choice: الحقّ
  rationale: «الحق» تعبير عربي كتابي وطبيعي يجمع معنى الصدق والحقيقة والواقع المعلن، وهو أنسب من حصر اللفظ في الإخلاص الشخصي.
- source_word: δεῖ
  choice: على ... أن
  rationale: تركيب عربي واضح يؤدي معنى الضرورة والإلزام الذي يحمله الفعل اليوناني.
- source_word: προσκυνεῖν
  choice: يسجدوا
  rationale: يحفظ معنى العبادة مع إبراز صورة الخضوع الكامنة في الفعل؛ والسياق يوضح أن السجود هنا تعبدي لله.
theological_decisions:
- issue: معنى «الله روح»
  choice: عبارة نوعية تصف طبيعة الله
  alternative: «الله روحٌ من الأرواح» أو فهمها على أنها تسمية للروح القدس تحديدًا
  rationale: تقديم الخبر غير المعرّف πνεῦμα على المبتدأ المعرّف ὁ θεός يرجّح الدلالة النوعية، فلا تجعل الله فردًا ضمن جنس الأرواح ولا تطابق بين «الله» و«الروح القدس» بما يتجاوز منطوق العبارة.
- issue: معنى «بالروح والحق»
  choice: صياغة واسعة تبقي «الروح» بلا تحديد صريح
  alternative: «بالروح القدس والحق» أو «بإخلاص وصدق»
  rationale: غياب أداة التعريف عن πνεύματι واقترانه بـἀληθείᾳ يسمح بفهم روحي عام وبفهم أخص يشير إلى الروح القدس. لذلك لا يضيّق المتن العبارة إلى أحد الوجهين، وتوضح الحاشية إمكان القراءة الأخص.
- issue: ترجمة προσκυνέω
  choice: «يسجد» في سياق العبادة
  alternative: «يعبد»
  rationale: «يسجد» أقرب إلى الصورة المعجمية للفعل ويحفظ عنصر الخضوع الجسدي والتعبدي، بينما يبيّن المفعول «له» والسياق أن المراد عبادة الله، لا مجرد حركة جسدية.
translation_notes:
  register: لغة عربية فصحى حديثة واضحة ومهيبة. استُخدم «يسجد» بدل «يعبد» للمحافظة على صورة προσκυνέω، مع بقاء المعنى التعبدي جليًا من السياق. وُضعت علامتا الحاشيتين بعد الجملة التي تتصلان بتفسيرها.
