  text: Ἔρχεται γυνὴ ἐκ τῆς Σαμαρείας ἀντλῆσαι ὕδωρ. λέγει αὐτῇ ὁ Ἰησοῦς· Δός μοι πεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/007.yaml
  text: A woman from Samaria came to draw water. Jesus said to her[a], “Give me a drink.”
translation:
  language: ar
  text: 'جاءت امرأة من السامرة لتستقي ماءً. فقال لها يسوع[a]: «أعطيني لأشرب».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بحرفية أكثر: «تأتي... فيقول»؛ إذ يستعمل اليوناني المضارع التاريخي في السرد.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔρχεται
  choice: جاءت
  rationale: الفعل مضارع تاريخي في سياق سردي؛ وصيغة الماضي هي الأفصح والأكثر طبيعية في السرد العربي، مع بقاء البديل الحرفي «تأتي» في الحاشية.
- source_word: γυνὴ
  choice: امرأة
  rationale: يدل الاسم هنا على امرأة غير معيّنة، لا على زوجة تحديدًا، وتؤدي العربية هذا المعنى بالتنكير.
- source_word: ἐκ τῆς Σαμαρείας
  choice: من السامرة
  rationale: ترجمة مباشرة للمصدر أو مكان القدوم، من غير استبدال العبارة بوصف عرقي مثل «سامرية» لم يرد صراحة في هذه الآية.
- source_word: ἀντλῆσαι ὕδωρ
  choice: لتستقي ماءً
  rationale: المصدر يفيد الغرض، و«استقى ماءً» تعبير عربي طبيعي ودقيق لأخذ الماء من بئر.
- source_word: λέγει αὐτῇ
  choice: فقال لها
  rationale: الفعل مضارع تاريخي ثانٍ؛ نُقل بالماضي لسلامة السرد العربي، وأضيفت الفاء الطبيعية لبيان تعاقب الحدثين دون تغيير المعنى.
- source_word: Δός μοι πεῖν
  choice: أعطيني لأشرب
  rationale: يحافظ هذا التعبير على بنية الطلب اليونانية، حيث يتبع فعل الأمر مصدرٌ يفيد الشرب، وهو عربي واضح وموجز.
theological_decisions:
- issue: دلالة «السامرة»
  choice: الإبقاء على عبارة «امرأة من السامرة» بوصفها تحديدًا لمكان قدومها
  alternative: «امرأة سامرية» أو «امرأة من مدينة السامرة»
  rationale: النص اليوناني في هذه الآية يقول حرفيًا إنها امرأة «من السامرة»، ولا يصرّح هنا بالصيغة النسبية ولا يحسم أن المقصود مدينة السامرة تحديدًا؛ لذا تحفظ الترجمة صياغة المصدر ولا تستبق دلالات السياق الأوسع.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم الماضي في المتن لأنه الطبيعي في السرد العربي، مع توثيق المضارع التاريخي في الحاشية. وصيغة «أعطيني» صحيحة لأن المخاطَبة مؤنثة.
