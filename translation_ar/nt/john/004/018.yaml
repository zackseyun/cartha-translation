  text: For you have had five husbands[a], and the man you now have is not your husband; this you have said truly.
translation:
  language: ar
  text: فقد كان لكِ خمسة أزواج[a]، والرجل الذي معكِ الآن ليس زوجكِ؛ هذا قلتِه بصدق.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن ترجمتها حرفيًا أكثر: «فقد كان لكِ خمسة رجال، والذي معكِ الآن ليس رجلكِ/زوجكِ». فالكلمة اليونانية ἀνήρ قد تعني «رجلًا» أو «زوجًا»، والسياق هنا يرجّح «زوجًا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πέντε γὰρ ἄνδρας ἔσχες
  choice: فلقد كان لكِ خمسة أزواج
  rationale: تؤدي «فـ» معنى التعليل في γάρ، وتفيد «لقد» تحقق الخبر الماضي مع صلته بالحاضر. ويحدد السياق معنى ἄνδρας هنا بأنه «أزواج» لا مطلق «رجال».
- source_word: καὶ νῦν ὃν ἔχεις
  choice: والذي لكِ الآن
  rationale: صياغة عربية طبيعية قريبة من تركيب الأصل، وتحافظ على دلالة ἔχεις العلائقية من غير إضافة فعل مثل «تعيشين معه» لا يرد صراحة في اليونانية.
- source_word: οὐκ ἔστιν σου ἀνήρ
  choice: ليس زوجكِ
  rationale: السياق والمضاف إليه σου يدلان على العلاقة الزوجية، ولذلك «زوجكِ» أوضح من «رجلكِ» في العربية المعاصرة.
- source_word: τοῦτο ἀληθὲς εἴρηκας
  choice: هذا قلتِه بصدق
  rationale: تحافظ الصياغة على الإشارة بـ«هذا» وعلى كون ἀληθές وصفًا لصدق القول، كما تعكس قدر الإمكان ترتيب العبارة اليونانية وتوكيدها.
theological_decisions:
- issue: دلالة ἀνήρ في الموضعين
  choice: «أزواج» في الموضع الأول و«زوجكِ» في الثاني
  alternative: «رجال» و«رجلكِ» على نحو أكثر حرفية معجميًا
  rationale: يمكن أن تعني ἀνήρ «رجلًا» أو «زوجًا»، لكن المقابلة بين تاريخ المرأة السابق وعلاقتها الحالية تجعل المعنى الزوجي هو الأرجح سياقيًا، من غير استيراد حكم مذهبي زائد.
- issue: طبيعة العلاقة الحالية
  choice: «والذي لكِ الآن ليس زوجكِ»
  alternative: «والرجل الذي تعيشين معه الآن ليس زوجكِ»
  rationale: لا يصرح النص بأنها تعيش معه؛ لذا تُحفظ صياغة ἔχεις العلائقية من غير توسيع تفسيري.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدمت علامات التأنيث في الضمائر والأفعال لإزالة اللبس في خطاب المرأة، وحُفظت البنية التعليلية والمقابلة في الأصل دون توسيع تفسيري.
