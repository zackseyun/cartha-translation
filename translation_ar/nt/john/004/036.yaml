  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ⸀ὁ θερίζων μισθὸν λαμβάνει καὶ συνάγει καρπὸν εἰς ζωὴν αἰώνιον, ⸀ἵνα ὁ σπείρων ὁμοῦ χαίρῃ καὶ ὁ θερίζων.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/036.yaml
  text: The one who reaps is receiving wages and gathering fruit for eternal life[b][a], so that the one who sows and the one who reaps may rejoice together.
translation:
  language: ar
  text: الحاصد يتقاضى أجرًا[a] ويجمع ثمرًا للحياة الأبدية[b]، لكي يفرح الزارع والحاصد معًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مكافأة». فاللفظ اليوناني قد يعني أجر العمل أو الجزاء.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «إلى الحياة الأبدية». ويمكن أن يدل التعبير على الغاية أو النتيجة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ θερίζων
  choice: الحاصد
  rationale: اسم فاعل معرّف يؤدي وظيفة اسمية، ويحافظ بإيجاز وطبيعية على صورة الحصاد.
- source_word: μισθὸν λαμβάνει
  choice: يتقاضى أجرًا
  rationale: تعبير عربي طبيعي لأخذ أجر العمل، ويحفظ صورة العامل الذي ينال أجره؛ والمضارع ينقل دلالة الحاضر في اليونانية.
- source_word: συνάγει καρπὸν
  choice: يجمع ثمرًا
  rationale: يحافظ على الفعل المستمر وعلى صورة الثمر دون دمجه في لفظ الحصاد نفسه.
- source_word: εἰς ζωὴν αἰώνιον
  choice: للحياة الأبدية
  rationale: اللام عربية طبيعية ويمكن أن تدل على الغاية أو النتيجة، فلا تحسم ما يتركه التركيب اليوناني محتملًا.
- source_word: ἵνα
  choice: لكي
  rationale: تنقل جملة الغاية بوضوح مع إبقاء احتمال امتزاج الغاية بالنتيجة في السياق.
- source_word: ὁ σπείρων ... ὁ θερίζων
  choice: الزارع والحاصد
  rationale: صياغة اسمية متوازية وطبيعية تحافظ على تقابل من يزرع ومن يحصد.
- source_word: ὁμοῦ χαίρῃ
  choice: يفرح ... معًا
  rationale: تنقل الفرح المشترك المقصود، مع صيغة مضارع ملائمة بعد «لكي».
theological_decisions:
- issue: هل يُصرَّح بأن الحصاد قائم «من الآن»؟
  choice: عدم إضافة «من الآن» أو «قد»
  alternative: إضافة لفظ يبرز فورية الحصاد في السياق
  rationale: لا توجد في هذه الجملة كلمة مستقلة تقابل «من الآن»، والمضارع العربي يكفي لنقل الفعل الحاضر من غير توسيع تفسيري.
- issue: دلالة εἰς في صلة الثمر بالحياة الأبدية
  choice: للحياة الأبدية
  alternative: إلى الحياة الأبدية
  rationale: يحفظ الاختيار اتجاه الثمر نحو الحياة الأبدية، مع عدم حصر العلاقة في الغاية وحدها أو النتيجة وحدها.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة، مع إبقاء استعارة الزرع والحصاد والثمر. استُخدم «يتقاضى» لأنه طبيعي في سياق الأجر، وتُركت فورية الحدث للمضارع من غير إضافة لفظ غير موجود في النص.
