  text: Μετὰ δὲ τὰς δύο ἡμέρας ἐξῆλθεν ⸀ἐκεῖθεν εἰς τὴν Γαλιλαίαν·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/043.yaml
  text: After the two days[a], he departed from there for Galilee.
translation:
  language: ar
  text: وبعد اليومين، غادر من هناك إلى الجليل.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ δὲ τὰς δύο ἡμέρας
  choice: وبعد اليومين
  rationale: تفيد μετά مع حالة النصب التعاقب الزمني، أي «بعد». وأداة التعريف في «اليومين» تحيل طبيعيًا إلى مدة اليومين المذكورة قبلاً. ونُقلت δέ بالواو بوصفها رابطًا سرديًا خفيفًا.
- source_word: ἐξῆλθεν
  choice: غادر
  rationale: الفعل ἐξέρχομαι يعني حرفيًا «خرج»، لكنه في سياق الانتقال من مكان إلى آخر يفيد المغادرة؛ و«غادر» تعبير عربي طبيعي ودقيق هنا.
- source_word: ἐκεῖθεν
  choice: من هناك
  rationale: ظرف مكان يدل على الانطلاق من الموضع السابق ذكره، وأقرب مقابلاته العربية الطبيعية «من هناك».
- source_word: εἰς τὴν Γαλιλαίαν
  choice: إلى الجليل
  rationale: تفيد εἰς الحركة باتجاه مقصد، ولذلك تنقلها «إلى» بدقة ووضوح من غير مبالغة في إبراز معنى الدخول المكاني.
theological_decisions: []
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة وموجزة، تحافظ على تتابع السرد وعلى الإحالة إلى اليومين السابق ذكرهما. لا حاجة إلى حاشية؛ فالبديل الإنجليزي «to Galilee» هو المقابل المباشر نفسه للصياغة العربية «إلى الجليل».
