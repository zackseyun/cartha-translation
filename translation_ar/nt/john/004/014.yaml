id: JHN.4.14
reference: John 4:14
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὃς δ’ ἂν πίῃ ἐκ τοῦ ὕδατος οὗ ἐγὼ δώσω αὐτῷ, οὐ μὴ ⸀διψήσει εἰς τὸν αἰῶνα, ἀλλὰ τὸ ὕδωρ ὃ δώσω αὐτῷ γενήσεται ἐν αὐτῷ πηγὴ ὕδατος ἁλλομένου εἰς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/014.yaml
  text: But whoever drinks from the water that I will give him will never thirst forever; rather, the water that I will give him will become in him a spring of water welling up to eternal life.
translation:
  language: ar
  text: وأمّا مَن يشرب من الماء الذي سأعطيه أنا، فلن يعطش إلى الأبد؛ بل الماء الذي سأعطيه سيصير فيه ينبوع ماء يتدفّق إلى حياة أبدية.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ μὴ διψήσει εἰς τὸν αἰῶνα
  choice: فلن يعطش إلى الأبد
  rationale: ينقل النفي اليوناني المؤكد مع العبارة الزمنية الصريحة، من غير حذف «إلى الأبد» أو إضعافها.
- source_word: πηγὴ ὕδατος
  choice: ينبوع ماء
  rationale: «ينبوع» مقابل طبيعي ودقيق لمصدر الماء المتفجر أو الجاري، ويحافظ على صورة النص.
- source_word: ἁλλομένου
  choice: يتدفّق
  rationale: الفعل يدل على حركة الماء الوثّابة أو الفوّارة؛ و«يتدفّق» واضح وطبيعي بالعربية ويحفظ حيوية الصورة.
- source_word: ζωὴν αἰώνιον
  choice: حياة أبدية
  rationale: المقابل العربي المألوف والدقيق للعبارة، مع إبقاء غياب أداة التعريف كما يسمح السياق.
theological_decisions:
- issue: دلالة εἰς في عبارة «ἁλλομένου εἰς ζωὴν αἰώνιον»
  choice: إلى حياة أبدية
  alternative: مانحًا حياة أبدية
  rationale: أُبقي حرف الغاية «إلى» للمحافظة على الانفتاح الدلالي للصورة وعدم تفسير علاقة الينبوع بالحياة الأبدية تفسيرًا سببيًا زائدًا.
- issue: قوة نفي العطش ومداه
  choice: فلن يعطش إلى الأبد
  alternative: فلن يعطش أبدًا
  rationale: الصياغة المختارة تحفظ على نحو ظاهر كلًا من النفي المؤكد ومداه الزمني الوارد في الأصل، من غير حسم طبيعة العطش خارج استعارة السياق.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «وأمّا مَن» لإبراز المقابلة التي تحملها δέ مع الجملة السابقة، وتكرار «الذي سأعطيه» حفاظًا على بنية الأصل وتوكيده.
