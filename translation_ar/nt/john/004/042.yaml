base_translation:
  language: en
  yaml_path: translation/nt/john/004/042.yaml
  text: And they were saying to the woman[a], “We no longer believe because of your word, for we ourselves have heard[b], and we know that this one truly is the Savior of the world.”
translation:
  language: ar
  text: 'وكانوا يقولون للمرأة: «لم نَعُد نؤمن بسبب كلامكِ، لأننا نحن قد سمعنا، ونعلم أن هذا هو حقًّا مخلّص العالم».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῇ τε γυναικὶ ἔλεγον
  choice: وكانوا يقولون للمرأة
  rationale: ينقل الفعل الناقص معنى القول الجاري أو المتكرر في الماضي، وتؤدي الواو قوة τε الرابطة الخفيفة في السياق.
- source_word: Οὐκέτι διὰ τὴν σὴν λαλιὰν πιστεύομεν
  choice: لم نَعُد نؤمن بسبب كلامكِ
  rationale: «لم نعد» تنقل النفي الزمني، و«بسبب كلامك» تعبر طبيعيًّا عن διά مع النصب وعن شهادة المرأة المنطوقة من غير حصر اللفظ في كلمة واحدة.
- source_word: αὐτοὶ γὰρ ἀκηκόαμεν
  choice: لأننا نحن قد سمعنا
  rationale: الضمير المنفصل «نحن» يحفظ توكيد αὐτοὶ والمقابلة بين السماع المباشر وخبر المرأة، و«قد سمعنا» تلائم أثر صيغة التمام في اليونانية.
- source_word: καὶ οἴδαμεν
  choice: ونعلم
  rationale: οἴδαμεν فعل دال على حالة حاضرة، لذلك فالمضارع العربي هو المقابل الطبيعي.
- source_word: οὗτός ἐστιν ἀληθῶς
  choice: أن هذا هو حقًّا
  rationale: «هذا» يحفظ قوة اسم الإشارة، وضمير الفصل «هو» مع «حقًّا» ينقلان التوكيد والوقار في الاعتراف.
- source_word: ὁ σωτὴρ τοῦ κόσμου
  choice: مخلّص العالم
  rationale: ترجمة مباشرة تحافظ على اللقب المسيحاني وعلى المجال الواسع لكلمة κόσμος دون إضافة تفسيرية.
theological_decisions:
- issue: مدى اعتراف السامريين ودلالة «العالم»
  choice: مخلّص العالم
  alternative: مخلّص جميع الناس؛ أو مخلّص فئة مخصوصة من العالم
  rationale: يحفظ النص اعترافه الواسع كما هو، من غير تضييق «العالم» إلى جماعة بعينها أو توسيعه بصياغة عقائدية تتجاوز العبارة اليونانية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم جمع المذكر بحسب العرف العربي لفاعل جماعي مختلط أو غير مصرّح بجنس أفراده، مع الحفاظ على خطاب المؤنث في «كلامكِ».
