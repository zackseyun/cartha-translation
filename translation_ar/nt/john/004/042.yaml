  source_fidelity: 'النص العربي ينقل عناصر اليونانية الأساسية بأمانة: الاستمرار/التكرار الماضي في «وكانوا يقولون»، والنفي الزمني في «لم نعد»، وسبب الإيمان السابق في «بسبب كلامكِ»، وتوكيد الخبرة المباشرة في «لأننا نحن قد سمعنا»، ثم المعرفة الحالية والاعتراف بأن يسوع «مخلّص العالم». ولا يضيف إلى مدى «العالم» أو يضيّقه.'
  naturalness: الصياغة فصيحة واضحة وملائمة لسجل إنجيل يوحنا. «لم نعد نؤمن بسبب كلامكِ» عربية طبيعية وتحفظ المقابلة المقصودة بين شهادة المرأة وسماعهم المباشر. و«هذا هو حقًّا مخلّص العالم» سليمة وموقّرة.
  terminology: «مخلّص العالم» مقابلة راسخة ودقيقة لـ ὁ σωτὴρ τοῦ κόσμου، و«كلامكِ» مناسب لـ λαλιὰν في هذا السياق الشفهي. حافظت الترجمة على الإشارة المؤكدة في «هذا» من غير تحميلها تفسيرًا عقائديًا.
