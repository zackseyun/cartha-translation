base_translation:
  language: en
  yaml_path: translation/nt/john/004/034.yaml
  text: Jesus said to them[b][a], “My food is to do the will of him who sent me and to complete his work.”
translation:
  language: ar
  text: 'قال لهم يسوع: «طعامي هو أن أعمل مشيئة الذي أرسلني[b] وأن أُتمَّ عمله[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أُكمل عمله».'
    reason: lexical_alternative
  - marker: b
    text: تشير عبارة «الذي أرسلني» في السياق إلى الآب، مع أن النص اليوناني لا يذكر هذا اللقب صراحة هنا.
    reason: cross_reference
lexical_decisions:
- source_word: λέγει αὐτοῖς ὁ Ἰησοῦς
  choice: قال لهم يسوع
  rationale: صيغ المضارع التاريخي في اليونانية بصيغة الماضي العربية الملائمة للسرد، مع الحفاظ على الفاعل والمخاطَبين.
- source_word: Ἐμὸν βρῶμά ἐστιν
  choice: طعامي هو
  rationale: يحافظ هذا التعبير على استعارة الطعام الملموسة المرتبطة بحديث التلاميذ عن الأكل، وهو طبيعي وواضح بالعربية.
- source_word: ἵνα ποιήσω
  choice: أن أعمل
  rationale: تؤدي «أن» مع المضارع معنى مضمون العبارة وغايتها بسلاسة، و«أعمل مشيئة» تركيب عربي فصيح شائع.
- source_word: τὸ θέλημα
  choice: مشيئة
  rationale: «مشيئة» المقابل الدقيق والطبيعي في هذا السياق لإرادة الله، من غير توسيع تفسيري.
- source_word: τοῦ πέμψαντός με
  choice: الذي أرسلني
  rationale: تحافظ الصلة على صيغة اسم الفاعل المعرّف في الأصل، من غير إضافة لقب «الآب» غير المذكور صراحة في الآية.
- source_word: τελειώσω
  choice: أُتمَّ
  rationale: تنقل معنى إنجاز العمل وبلوغه تمامه، وتحفظ دلالة الإكمال الأوسع من مجرد التوقف عند نهايته.
- source_word: αὐτοῦ τὸ ἔργον
  choice: عمله
  rationale: ترجمة موجزة وطبيعية تحافظ على ضمير الإضافة وعلى معنى المهمة أو العمل الموكول إلى يسوع.
theological_decisions:
- issue: مرجع «الذي أرسلني»
  choice: الإبقاء على العبارة الضمنية «الذي أرسلني» في المتن
  alternative: «الآب الذي أرسلني»
  rationale: يشير السياق في يوحنا إلى الآب، لكن النص اليوناني هنا لا يذكر هذا اللقب صراحة؛ لذلك تُصان صياغة الأصل ويُوضح المرجع في الحاشية.
- issue: دلالة τελειώσω
  choice: «أُتمَّ عمله»
  alternative: «أُكمل عمله» أو «أُنهي عمله»
  rationale: «أُتمَّ» تحفظ احتمال بلوغ العمل غايته وكماله، ولا تحصر المعنى في مجرد الانتهاء الزمني.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظت استعارة الطعام، وتُرك المرجع إلى الآب ضمنيًا كما في اليونانية، مع تجنب الصياغة الحرفية المتكلفة.
