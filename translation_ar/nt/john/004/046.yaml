source:
  edition: SBLGNT
  text: Ἦλθεν οὖν ⸀πάλιν εἰς τὴν Κανὰ τῆς Γαλιλαίας, ὅπου ἐποίησεν τὸ ὕδωρ οἶνον. καὶ ἦν τις βασιλικὸς οὗ ὁ υἱὸς ἠσθένει ἐν Καφαρναούμ.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/046.yaml
  text: So he came again to Cana of Galilee[a], where he had made the water wine[b]. And there was a certain royal official whose son was sick in Capernaum.
translation:
  language: ar
  text: فَجَاءَ أَيْضًا إِلَى قَانَا الْجَلِيلِ، حَيْثُ كَانَ قَدْ جَعَلَ الْمَاءَ خَمْرًا[a]. وَكَانَ هُنَاكَ مُوَظَّفٌ مَلَكِيٌّ[b]، وَكَانَ ابْنُهُ مَرِيضًا فِي كَفْرَنَاحُومَ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو بتعبير تفسيري أكثر: «حَوَّلَ الماءَ إلى خمر». أمّا اليونانية فتقول حرفيًّا: «جَعَلَ الماءَ خمرًا».'
    reason: lexical_alternative
  - marker: b
    text: أو «رجل من حاشية الملك» أو «رجل في خدمة الملك». يدل اللفظ اليوناني βασιλικός على شخص مرتبط بملك أو بالبلاط الملكي، من غير تحديد دقيق لمنصبه.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: فَـ
  rationale: تفيد وصل الحدث بما سبقه واستمرار السرد، وهي طبيعية في العربية من غير إثقال دلالة الاستنتاج.
- source_word: πάλιν
  choice: أَيْضًا
  rationale: تنقل معنى العودة إلى قانا مرة أخرى بعبارة عربية موجزة وطبيعية.
- source_word: Κανὰ τῆς Γαλιλαίας
  choice: قَانَا الْجَلِيلِ
  rationale: صيغة عربية مألوفة لاسم الموضع مع بيان الإقليم، وتحافظ على تركيب الإضافة في اليونانية.
- source_word: ἐποίησεν τὸ ὕδωρ οἶνον
  choice: جَعَلَ الْمَاءَ خَمْرًا
  rationale: تحافظ على الصياغة اليونانية المباشرة «جعل الماء خمرًا»، مع استخدام «كان قد» للدلالة على سبق الحدث للزيارة الحالية.
- source_word: τις
  choice: مُوَظَّفٌ
  rationale: التنكير في العربية يؤدي وظيفة الضمير اليوناني في تقديم شخص معيّن غير مسمّى، ولا حاجة إلى عبارة ثقيلة من قبيل «موظف معيّن».
- source_word: βασιλικός
  choice: مُوَظَّفٌ مَلَكِيٌّ
  rationale: يدل اللفظ على شخص مرتبط بالملك أو بخدمته، وهذه العبارة واضحة وحديثة من غير الجزم برتبته أو طبقته الاجتماعية.
- source_word: υἱός
  choice: ابْنُهُ
  rationale: ينقل التحديد الصريح للجنس في اللفظ اليوناني.
- source_word: ἠσθένει
  choice: كَانَ ... مَرِيضًا
  rationale: السياق يدل على مرض جسدي، وصيغة «كان مريضًا» تنقل قيمة الماضي المستمر للفعل.
- source_word: Καφαρναούμ
  choice: كفْرَنَاحُومَ
  rationale: النقل العربي الشائع لاسم المكان.
theological_decisions:
- issue: تعيين مدلول βασιλικός وصلته بالبلاط الحاكم
  choice: مُوَظَّفٌ مَلَكِيٌّ
  alternative: رجل من حاشية الملك؛ رجل في خدمة الملك؛ نبيل
  rationale: النص يثبت صلته بملك أو بحكم ملكي، لكنه لا يحدد منصبه ولا يصرح بأنه من طبقة النبلاء؛ لذلك تتجنب الصياغة زيادة تفصيل تاريخي أو اجتماعي غير محسوم.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم الربط بالفاء لاستمرار السرد، وحوفظ على الصياغة المباشرة لصنع الماء خمرًا، مع وضع علامتي الحاشيتين عند العبارتين اللتين تفسرهما الحاشيتان فعلًا.
