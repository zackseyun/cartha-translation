  - severity: low
    issue: «وهي الآن»
    rationale: تحتاج الجملة الاسمية إلى خبر ظاهر في العربية. «وهي الآن حاضرة» تنقل بوضوح καὶ νῦν ἐστιν من غير زيادة تفسيرية معتبرة.
  - severity: low
