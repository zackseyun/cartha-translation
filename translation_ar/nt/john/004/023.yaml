  source_fidelity: المعنى العام منقول بأمانة، بما في ذلك حضور «الساعة» الآن ودلالة «بالروح والحق». لكن تحويل τοὺς προσκυνοῦντας αὐτόν إلى «ليسجدوا له» يجعلها جملة غائية («يطلبهم لكي يسجدوا») بدل أن تكون وصفًا للأشخاص الذين يطلبهم الآب («الذين يعبدونه»).
  naturalness: «وهي الآن» مبتورة قليلًا في العربية المعاصرة؛ و«وهي الآن حاضرة» أوضح وأفصح. كما أن تكرار «يسجد» يجعل العبارة أضيق من دلالة προσκυνέω في هذا الموضع، في حين أن «يعبد» طبيعي ومتسق مع «العابدون».
  terminology: «الآب» مناسب لقبًا إلهيًا. و«بالروح والحق» تحافظ على الإيجاز وعلى عدم حسم مرجع πνεύματι. والأدق أن يُستعمل «العبادة/يعبدون» في طرفي العبارة للمحافظة على اتساق اللفظ اليوناني ودلالته التعبدية الأوسع، مع بقاء إمكان السجود ضمن المعنى.
