id: JHN.4.23
reference: John 4:23
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἀλλὰ ἔρχεται ὥρα καὶ νῦν ἐστιν, ὅτε οἱ ἀληθινοὶ προσκυνηταὶ προσκυνήσουσιν τῷ πατρὶ ἐν πνεύματι καὶ ἀληθείᾳ, καὶ γὰρ ὁ πατὴρ τοιούτους ζητεῖ τοὺς προσκυνοῦντας αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/023.yaml
  text: But an hour is coming[a], and is now here, when the true worshipers will worship the Father in spirit and truth; for the Father indeed seeks such people to worship him.
translation:
  language: ar
  text: لكن تأتي ساعة، وهي الآن حاضرة، حين يعبد العابدون الحقيقيون الآب بالروح والحق[a]؛ فالآب بالفعل يطلب مثل هؤلاء الذين يعبدونه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أيضًا فهم العبارة على أنها «في الروح». وقد تشير العبارة اليونانية إلى عبادة يمكّنها الروح القدس، أو عبادة تصدر من روح الإنسان، أو عبادة تتسم بالواقع الروحي.
    reason: للحفاظ على الاحتمال الدلالي واللاهوتي في ἐν πνεύματι وعدم حسمه في المتن.
lexical_decisions:
- source_word: ἀλλὰ
  choice: لكن
  rationale: تفيد الاستدراك والمقابلة مع الكلام السابق عن ارتباط العبادة بالمكان، وهي صياغة عربية موجزة وطبيعية.
- source_word: ἔρχεται ὥρα
  choice: تأتي ساعة
  rationale: تحافظ على غياب أداة التعريف في اليونانية وعلى لفظ «الساعة» ذي الدلالة المميزة في إنجيل يوحنا، بدل تعميمه إلى «وقت».
- source_word: καὶ νῦν ἐστιν
  choice: وهي الآن
  rationale: تعبير عربي طبيعي يحفظ التوتر بين مجيء الساعة وحضورها المتحقق بالفعل.
- source_word: οἱ ἀληθινοὶ προσκυνηταὶ
  choice: العابدون الحقيقيون
  rationale: ينقل معنى العابدين الصادقين أو الحقيقيين ويحافظ على الصفة اليوحناوية دون إدخال تمييز طائفي.
- source_word: προσκυνήσουσιν
  choice: سيسجدون
  rationale: السجود هو المعنى الحسي والأساسي للفعل في سياق التعبد، وصيغة المستقبل تنقل دلالة الفعل اليوناني.
- source_word: τῷ πατρὶ
  choice: للآب
  rationale: «الآب» هو اللقب الإلهي المألوف والمناسب للسياق اليوحناوي.
- source_word: ἐν πνεύματι καὶ ἀληθείᾳ
  choice: بالروح والحق
  rationale: يحافظ على الاسمين وعلى الإيجاز، ولا يحوّل «الحق» إلى حال مثل «بحق». وقد تحمل «الروح» معنى الروح القدس أو روح الإنسان أو المجال الروحي؛ لذلك تُبيَّن السعة الدلالية في الحاشية.
- source_word: καὶ γὰρ
  choice: فـ... بالفعل
  rationale: الفاء تبين التعليل، و«بالفعل» تنقل جانب التوكيد الذي تضيفه καί إلى γάρ.
- source_word: τοιούτους ζητεῖ
  choice: يطلب بالفعل أمثال هؤلاء
  rationale: يحافظ على المضارع وعلى الإشارة إلى أناس من هذا النوع، بصياغة عربية فصيحة مفهومة.
- source_word: τοὺς προσκυνοῦντας αὐτόν
  choice: ليسجدوا له
  rationale: يعبّر عن الغاية أو الوصف المقصود لهؤلاء في عربية سلسة، مع إبقاء صلة العبادة بالسجود.
theological_decisions:
- issue: دلالة ἐν πνεύματι
  choice: بالروح، من غير حسم المرجع في المتن
  alternative: بروحهم؛ أو بالروح القدس؛ أو عبادة ذات طابع روحي
  rationale: اللفظ اليوناني بلا أداة تعريف ويسمح بأكثر من فهم ذي وزن لاهوتي. تُبقي الصياغة العربية قدرًا من هذا الاحتمال، وتشرح الحاشية القراءات الممكنة بدل فرض إحداها.
- issue: دلالة «العابدون الحقيقيون»
  choice: وصف نوعي للعابدين الصادقين أو المتوافقين مع حقيقة إعلان الله
  alternative: العابدون الصادقون؛ العابدون حقًا
  rationale: تحافظ الصياغة على اصطلاح يوحنا وعلى المقابلة السياقية، من غير تحويله إلى تعريف لطائفة بعينها.
- issue: العبادة بوصفها سجودًا
  choice: سيسجدون... ليسجدوا له
  alternative: سيعبدون... ليعبدوه
  rationale: ينقل «السجود» الصورة الأصلية في προσκυνέω، وهو مفهوم في العربية بوصفه فعل عبادة، من غير إضافة كيفية لم يذكرها النص.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «السجود» لنقل προσκυνέω، و«وهي الآن» للحفاظ بصورة طبيعية على الجمع اليوحناوي بين المستقبل والحضور الراهن. وُضع مؤشر الحاشية بعد العبارة التي يشرحها مباشرة.
