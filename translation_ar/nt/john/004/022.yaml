source:
  edition: SBLGNT
  text: ὑμεῖς προσκυνεῖτε ὃ οὐκ οἴδατε, ἡμεῖς προσκυνοῦμεν ὃ οἴδαμεν, ὅτι ἡ σωτηρία ἐκ τῶν Ἰουδαίων ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/022.yaml
  text: You worship what you do not know; we worship what we know[a], because salvation is from the Jews.
translation:
  language: ar
  text: أنتم تسجدون لما لا تعرفون، ونحن نسجد لما نعرف، لأن الخلاص من اليهود[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «من الشعب اليهودي». وفي مواضع أخرى من يوحنا قد تعني الكلمة «أهل اليهودية»، أما هنا فالمقابلة مع السامريين تتعلق بالعبادة وتاريخ الخلاص.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκυνεῖτε / προσκυνοῦμεν
  choice: تسجدون / نسجد
  rationale: الفعل في هذا السياق يدل على العبادة الدينية. و«السجود» تعبير عربي طبيعي ومهيب يدل على التعبد، ويحافظ على التوازي اللفظي في الجملة.
- source_word: ὃ
  choice: ما / لما
  rationale: اسم الموصول اليوناني محايد، ولذلك تحافظ «ما» على عمومية العبارة من غير تحويلها إلى «مَن» أو التصريح بشخص المعبود على نحو يتجاوز صياغة الأصل.
- source_word: οἴδατε / οἴδαμεν
  choice: تعرفون / نعرف
  rationale: تنقل «يعرف» معنى العلم بموضوع العبادة بصورة مباشرة وطبيعية، وتحفظ المقابلة الحادة بين الطرفين.
- source_word: σωτηρία
  choice: الخلاص
  rationale: «الخلاص» هو المقابل العربي المألوف والملائم لعمل الله المنقذ في هذا السياق، ولا يقصر المعنى على نجاة زمنية.
- source_word: ἐκ
  choice: من
  rationale: تفيد «من» المصدر أو المنشأ بإيجاز، كما في اليونانية، من غير إضافة فعل تفسيري مثل «يأتي».
- source_word: τῶν Ἰουδαίων
  choice: اليهود
  rationale: هذا هو المقابل المباشر، والسياق يقابل السامريين باليهود في العبادة وتاريخ الخلاص. وتوضح الحاشية أن المراد قد يُعبَّر عنه أيضًا بـ«الشعب اليهودي»، لا «أهل اليهودية» فحسب.
theological_decisions:
- issue: معنى «الخلاص من اليهود»
  choice: إبقاء العبارة بوصفها تقريرًا لمصدر الخلاص التاريخي عبر اليهود ضمن تدبير الله
  alternative: قصرها على الأصل اليهودي للمسيح، أو توسيعها لتصبح حكمًا شاملًا بالتفوق العرقي
  rationale: تربط ὅτι المقابلة السابقة بتاريخ الخلاص. وتحفظ الترجمة صياغة النص من غير اختزالها في أصل المسيح وحده، ومن غير تحميلها ادعاءً عرقيًا أو موقفًا لاهوتيًا يتجاوز النص.
translation_notes:
  register: عربية فصحى واضحة ومهيبة. استُعمل «السجود» بمعنى العبادة، وحُفظ التوازي بين «تسجدون/نسجد» و«لا تعرفون/نعرف». وُضعت علامة الحاشية في المتن بعد «اليهود».
