  source_fidelity: 'النص العربي ينقل عناصر اليونانية بدقة: «فلمّا» تؤدي الوظيفة الزمنية المتصلة بالسياق لـὡς οὖν، و«جاء إليه السامريون» تمثل ἦλθον πρὸς αὐτὸν، و«طلبوا منه أن يمكث عندهم» تمثل ἠρώτων αὐτὸν μεῖναι παρ’ αὐτοῖς، مع الحفاظ على «هناك» ومدة «يومين». اختيار الماضي البسيط لـἠρώτων مقبول عربيًا، والحاشية تحفظ احتمال الاستمرار أو التكرار الملازم للماضي الناقص.'
  naturalness: 'الصياغة فصيحة حديثة، واضحة، ومترابطة: «فمكث هناك يومين» طبيعية وموجزة. واستعمال «يمكث/مكث» مناسب للسياق ويحافظ على الترابط اللفظي دون تكلف.'
  terminology: «السامريون» تسمية عربية معيارية ودقيقة. و«يمكث عندهم» ينقل معنى الإقامة معهم/لديهم بوضوح، ولا توجد مصطلحات لاهوتية أو أسماء تستلزم تعديلًا.
