base_translation:
  language: en
  yaml_path: translation/nt/john/004/040.yaml
  text: So when the Samaritans came to him[a], they asked him to stay with them, and he stayed there two days.
translation:
  language: ar
  text: فَلَمَّا جَاءَ إِلَيْهِ السَّامِرِيُّونَ، طَلَبُوا مِنْهُ[a] أَنْ يَمْكُثَ عِنْدَهُمْ، فَمَكَثَ هُنَاكَ يَوْمَيْنِ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كانوا يطلبون منه». قد تدل صيغة الماضي الناقص في اليونانية على طلب متواصل أو متكرر.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς οὖν
  choice: فَلَمَّا
  rationale: تؤدي معنى التتابع والارتباط بما سبق، مع الدلالة الزمنية، بصياغة عربية طبيعية موجزة.
- source_word: ἦλθον πρὸς αὐτὸν
  choice: جَاءَ إِلَيْهِ
  rationale: ينقل بوضوح حركة السامريين نحو يسوع، وهو التعبير العربي الطبيعي في السياق.
- source_word: οἱ Σαμαρῖται
  choice: السَّامِرِيُّونَ
  rationale: تسمية مباشرة للجماعة كما في النص اليوناني.
- source_word: ἠρώτων
  choice: طَلَبُوا مِنْهُ
  rationale: صياغة عربية طبيعية للفعل في هذا السياق، مع بيان احتمال دلالة الماضي الناقص على الطلب المستمر أو المتكرر في الحاشية.
- source_word: μεῖναι παρ’ αὐτοῖς
  choice: أَنْ يَمْكُثَ عِنْدَهُمْ
  rationale: «يمكث» تعبر عن البقاء مدة، و«عندهم» تنقل معنى الإقامة في صحبتهم أو مكانهم.
- source_word: καὶ ἔμεινεν ἐκεῖ
  choice: فَمَكَثَ هُنَاكَ
  rationale: تحافظ على الصلة اللفظية بالفعل السابق وتمثل ἐκεῖ صراحة، مع استعمال الفاء الطبيعية للدلالة على الاستجابة والنتيجة.
- source_word: δύο ἡμέρας
  choice: يَوْمَيْنِ
  rationale: ترجمة مباشرة لمدة الإقامة، بصيغة المثنى العربية الطبيعية.
