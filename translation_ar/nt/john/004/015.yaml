  text: λέγει πρὸς αὐτὸν ἡ γυνή· Κύριε, δός μοι τοῦτο τὸ ὕδωρ, ἵνα μὴ διψῶ μηδὲ ⸀διέρχωμαι ἐνθάδε ἀντλεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/015.yaml
  text: The woman said to him[a], “Lord, give me this water, so that I may not be thirsty or come here to draw.”
translation:
  language: ar
  text: 'قالت له المرأة: «يا ربّ[a]، أعطني هذا الماء، لكيلا أعطش ولا آتي إلى هنا لأستقي».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يا سيدي، أعطني هذا الماء…»'
    reason: يحفظ احتمال كون Κύριε مجرد صيغة مخاطبة احترامية في هذا الموضع.
lexical_decisions:
- source_word: λέγει
  choice: قالت
  rationale: استُخدم الماضي بما يلائم السرد العربي الطبيعي، مع الحفاظ على وظيفة المضارع التاريخي اليوناني.
- source_word: γυνή
  choice: المرأة
  rationale: المقصود في السياق المرأة السامرية، وهذه هي الدلالة الطبيعية هنا.
- source_word: Κύριε
  choice: يا ربّ
  rationale: يحفظ المعنى المعجمي وإمكان الصدى الأعمق في إنجيل يوحنا، مع إثبات معنى المخاطبة الاحترامية البديل في الحاشية.
- source_word: δός μοι
  choice: أعطني
  rationale: ترجمة مباشرة وطبيعية لصيغة الأمر.
- source_word: τοῦτο τὸ ὕδωρ
  choice: هذا الماء
  rationale: لا يكرر النص اليوناني هنا صفة «الحي»، فلا تُضاف من السياق.
- source_word: ἵνα μὴ διψῶ
  choice: لكيلا أعطش
  rationale: تعبير عربي واضح يحفظ معنى الغاية والنفي دون تحويل صيغة الاحتمال إلى تقرير مؤكد.
- source_word: μηδὲ διέρχωμαι ἐνθάδε
  choice: ولا آتي إلى هنا
  rationale: ينقل النفي الإضافي والإشارة المكانية، ويوافق منظور المتكلمة وهي عند البئر.
- source_word: ἀντλεῖν
  choice: لأستقي
  rationale: الفعل العربي «استقى» يؤدي معنى استخراج الماء من بئر من غير حاجة إلى تكرار كلمة «الماء».
theological_decisions:
- issue: دلالة Κύριε في خطاب المرأة السامرية
  choice: يا ربّ
  alternative: يا سيدي
  rationale: قد تكون الكلمة نداء احترام عاديًا، وقد تحمل في سياق يوحنا إيحاءً أعمق؛ لذلك حُفظ «يا ربّ» في المتن وذُكر البديل في الحاشية دون حسم التوتر الدلالي.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. وُضع مؤشر الحاشية بعد الاقتباس كله لأنه يشرح لفظ «يا ربّ» الوارد داخله، واستُخدم «أستقي» بوصفه تعبيرًا طبيعيًا موجزًا عن جلب الماء من البئر.
