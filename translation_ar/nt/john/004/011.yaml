id: JHN.4.11
reference: John 4:11
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ⸂ἡ γυνή⸃· Κύριε, οὔτε ἄντλημα ἔχεις καὶ τὸ φρέαρ ἐστὶν βαθύ· πόθεν οὖν ἔχεις τὸ ὕδωρ τὸ ζῶν;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/011.yaml
  text: The woman said to him[a], “Lord, you have neither a bucket nor is the well deep[b]. So where do you get the living water?”
translation:
  language: ar
  text: 'قالت له المرأة: «يا سيدي[a]، ليس معك دلو، والبئر عميقة؛ فمن أين لك الماء الحي[b]؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «يا رب». يمكن أن تكون الكلمة اليونانية صيغة خطاب محترمة بمعنى «يا سيدي»، كما يمكن أن تعني «يا رب» بحسب السياق.
    reason: alternative_reading
  - marker: b
    text: يمكن أن تعني العبارة أيضًا «الماء الجاري»، أي الماء العذب المتدفق في مقابل الماء الراكد، مع احتفاظها هنا بالدلالة الأعمق في كلام يسوع.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτῷ ἡ γυνή
  choice: قالت له المرأة
  rationale: استُخدم الماضي لأنه الأسلوب الطبيعي في السرد العربي، مع إبقاء الفاعل والتعلّق بالضمير واضحين.
- source_word: Κύριε
  choice: يا سيدي
  rationale: صيغة نداء محترمة تلائم مرحلة الحوار، مع إبقاء احتمال معنى «يا رب» في الحاشية.
- source_word: ἄντλημα
  choice: دلو
  rationale: لفظ عربي مألوف للأداة التي يُستقى بها الماء من البئر.
- source_word: τὸ φρέαρ
  choice: البئر
  rationale: هو المعنى الملائم للمشهد، حيث يُستخرج الماء من بئر عميقة.
- source_word: βαθύ
  choice: عميقة
  rationale: ينقل وصف العمق بلا إضافة معنى المبالغة.
- source_word: πόθεν οὖν ἔχεις
  choice: فمن أين لك
  rationale: صياغة عربية طبيعية تحفظ السؤال عن المصدر وعلاقة الاستنتاج التي تؤديها οὖν.
- source_word: τὸ ὕδωρ τὸ ζῶν
  choice: الماء الحي
  rationale: ترجمة مباشرة تحفظ التوتر بين المعنى الاعتيادي، أي الماء الجاري أو المتجدد، والدلالة الأعمق في سياق يوحنا.
theological_decisions:
- issue: دلالة Κύριε في خطاب المرأة ليسوع
  choice: يا سيدي
  alternative: يا رب
  rationale: قد تكون الكلمة في هذا الموضع مجرد خطاب احترام، ولا يثبت السياق أن المرأة تعبّر بعدُ عن اعتراف لاهوتي. أُثبت البديل في الحاشية حفاظًا على سعة اللفظ اليوناني.
- issue: ازدواج دلالة ὕδωρ τὸ ζῶν
  choice: الماء الحي
  alternative: الماء الجاري
  rationale: تحفظ العبارة الحرفية سوء الفهم الظاهر لدى المرأة، وفي الوقت نفسه لا تمحو المعنى الأعمق المقصود في كلام يسوع.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. استُخدمت جملة «ليس معك دلو، والبئر عميقة» لأنها تنقل تركيب اليونانية ومنطق السؤال طبيعيًا، من غير إقحام صيغة نفي مترابطة توهم أن عمق البئر منفي.
