- source_word: ἐκ τῆς πόλεως
  choice: من المدينة
  rationale: «من المدينة» تعبير عربي طبيعي يدل على الحركة من داخلها إلى خارجها، ويحافظ على تعريف πόλις.
- source_word: ἤρχοντο
  choice: كانوا آتين
  rationale: تركيب «كانوا آتين» يحفظ بوضوح دلالة الحدث الجاري في الماضي التي تحملها صيغة الماضي الناقص، بدل اختزالها إلى «أتوا».
- source_word: πρὸς αὐτόν
  choice: إليه
  rationale: «إليه» تعبير عربي موجز وطبيعي عن الحركة باتجاه الشخص المقصود.
