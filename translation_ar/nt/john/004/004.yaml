  text: ἔδει δὲ αὐτὸν διέρχεσθαι διὰ τῆς Σαμαρείας.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/004.yaml
  text: He had to pass through Samaria[a].
translation:
  language: ar
  text: وكان لا بدَّ له أن يمرَّ عبر السامرة[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وكان ينبغي له أن يجتاز السامرة». يعبّر النص اليوناني عن الضرورة من غير أن يحدّد أساسها بدقة.'
    reason: بديل لفظي مع بيان بقاء أساس الضرورة غير محدد
lexical_decisions:
- source_word: ἔδει
  choice: كان لا بدَّ له
  rationale: تعبير عربي طبيعي يفيد ضرورة واقعة في سياق ماضٍ، من غير أن يحدّد أساس هذه الضرورة.
- source_word: δὲ
  choice: الواو في «وكان»
  rationale: تفيد هنا انتقالًا سرديًا خفيفًا لا استدراكًا قويًا؛ والوصل بالواو أنسب للسياق العربي.
- source_word: αὐτὸν
  choice: له
  rationale: الضمير في اليونانية منصوب بوصفه فاعل المصدر، ويقابله عربيًا تركيب «كان لا بد له أن...».
- source_word: διέρχεσθαι
  choice: أن يمرَّ عبر
  rationale: ينقل معنى اجتياز منطقة أو المرور خلالها بعبارة عربية واضحة وموجزة.
- source_word: διὰ τῆς Σαμαρείας
  choice: عبر السامرة
  rationale: حرف الجر اليوناني مع المضاف إليه يدل على الحركة خلال مكان؛ و«السامرة» تسمية كافية من دون إضافة تفسيرية إلى المتن.
theological_decisions:
- issue: طبيعة الضرورة التي يفيدها ἔδει
  choice: إثبات الضرورة بعبارة «كان لا بدَّ له» من غير تعيين سببها
  alternative: أن يُفهم ذلك على أنه ضرورة جغرافية محضة، أو ضرورة إلهية مرتبطة برسالة يسوع
  rationale: النص اليوناني يقرر وجود ضرورة، لكنه لا يبيّن في هذه الآية وحدها أساسها؛ لذلك تُحفظ الدلالة مفتوحة ولا تُحسم تفسيريًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «لا بدَّ» لأنه طبيعي للقارئ المعاصر، مع إبقاء معنى الضرورة والغموض المتعلق بسببها.
