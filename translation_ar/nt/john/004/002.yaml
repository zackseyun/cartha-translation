  yaml_path: translation/nt/john/004/002.yaml
  text: although Jesus himself was not baptizing[a], but his disciples were—
translation:
  language: ar
  text: مع أن يسوع نفسه لم يكن يعمِّد، بل كان تلاميذه هم الذين يعمِّدون—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καίτοιγε
  choice: مع أن
  rationale: تؤدي معنى الاستدراك التنازلي الذي يوضح العبارة السابقة، وهي صياغة عربية فصيحة وطبيعية.
- source_word: Ἰησοῦς αὐτὸς
  choice: يسوع نفسه
  rationale: يحفظ الضمير التوكيدي، فيبيّن أن يسوع شخصيًا لم يكن القائم بالتعميد.
- source_word: οὐκ ἐβάπτιζεν
  choice: لم يكن يعمِّد
  rationale: تنقل صيغة الماضي الناقص اليونانية بوصفها فعلًا مستمرًا أو معتادًا في ذلك السياق.
- source_word: ἀλλ’
  choice: بل
  rationale: تفيد الإضراب التصحيحي والتباين بين يسوع وتلاميذه على نحو طبيعي في العربية.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: كان تلاميذه هم الذين يعمِّدون
  rationale: يُستعاد الفعل المحذوف المفهوم من الشطر السابق، مع إبراز المقابلة التي تحملها العبارة اليونانية.
theological_decisions:
- issue: تحديد من كان يجري التعميد في خدمة يسوع
  choice: يسوع نفسه لم يكن يجري التعميد، بل كان تلاميذه يجرونه.
  alternative: لم يعمِّد يسوع، بل عمَّد تلاميذه.
  rationale: تحفظ الصياغة التوكيد على «نفسه» ودلالة الماضي الناقص على الاستمرار أو الاعتياد، من غير إضافة تفسير لاهوتي يتجاوز النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «يعمِّد» بوصفه المقابل الكتابي العربي المألوف لـ βαπτίζω، مع تكرار الفعل في الشطر الثاني لسلامة العربية ووضوح المقابلة. أُبقيت الشرطة الختامية لأن الآية جملة اعتراضية متصلة بالسياق.
