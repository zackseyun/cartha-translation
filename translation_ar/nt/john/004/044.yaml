  source_fidelity: 'النص ينقل عناصر اليونانية كلها بأمانة: «لأن» تؤدي γάρ التفسيرية، و«يسوع نفسه» تحفظ التوكيد في αὐτός، و«شهد» تحافظ على مفردة الشهادة اليوحناوية، و«لا كرامة له» تقابل τιμὴν οὐκ ἔχει بصياغة اسمية فصيحة. و«في وطنه» تترك نطاق πατρίς غير محسوم، كما في الأصل.'
