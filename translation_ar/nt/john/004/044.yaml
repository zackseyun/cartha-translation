  terminology: «النبي»، «شهد»، و«كرامة» ألفاظ مناسبة للسجل الكتابي العربي وتحافظ على الدلالات الرئيسة دون تحميل تفسيري. الحاشية تبيّن بدقة أن «وطنه» قد تشمل البلدة أو المنطقة الأصلية، فلا تحسم الإحالة السردية المختلف فيها.
