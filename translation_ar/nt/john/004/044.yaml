  yaml_path: translation/nt/john/004/044.yaml
  text: For Jesus himself testified that a prophet has no honor in his own homeland[a].
translation:
  language: ar
  text: لِأَنَّ يَسُوعَ نَفْسَهُ شَهِدَ أَنَّ النَّبِيَّ لَا كَرَامَةَ لَهُ فِي وَطَنِهِ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في بلده» أو «في موطنه الأصلي». يمكن أن تدل الكلمة اليونانية على الوطن أو البلدة أو المنطقة التي ينتمي إليها الإنسان.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: لِأَنَّ
  rationale: تؤدي معنى التعليل والتفسير الذي يربط الآية بسياقها السابق، من غير إسقاط أداة الربط.
- source_word: αὐτὸς ... Ἰησοῦς
  choice: يَسُوعَ نَفْسَهُ
  rationale: تحفظ توكيد الضمير αὐτός مع الاسم بصياغة عربية طبيعية.
- source_word: ἐμαρτύρησεν
  choice: شَهِدَ
  rationale: يحافظ على لغة الشهادة البارزة في إنجيل يوحنا، وهو تعبير عربي واضح ومباشر.
- source_word: ὅτι
  choice: أَنَّ
  rationale: تدخل على مضمون شهادة يسوع بصورة طبيعية في العربية.
- source_word: προφήτης
  choice: النَّبِيَّ
  rationale: 'تفيد أل الجنسية هنا المعنى العام المَثَلي: النبي بصفته نبيًا، ولا تجعل القول مقصورًا على نبي بعينه.'
- source_word: ἐν τῇ ἰδίᾳ πατρίδι
  choice: فِي وَطَنِهِ
  rationale: تنقل معنى الموطن أو البلدة أو المنطقة الأصلية، وتعبّر الإضافة عن معنى ἰδίᾳ بوضوح ومن غير حشو.
- source_word: τιμὴν οὐκ ἔχει
  choice: لَا كَرَامَةَ لَهُ
  rationale: صياغة عربية فصيحة تحفظ الاسم τιμή ومعنى عدم نيل التكريم، بدل تحويل العبارة إلى فعل مبني للمجهول.
theological_decisions:
- issue: مرجع «وطنه» ونطاقه في سياق إنجيل يوحنا
  choice: إبقاء المثل عامًا بلفظ «في وطنه» من غير تعيين الموضع المقصود
  alternative: تعيينه باليهودية أو الجليل أو الناصرة
  rationale: لا تعيّن الآية نفسها المرجع الجغرافي، ولذلك تحافظ الصياغة على الاحتمال والتوتر السردي ولا تفرض تفسيرًا توفيقيًا.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت «لا كرامة له» لصياغة مَثَلية طبيعية، مع إبقاء أداة التعليل والتوكيد ولغة الشهادة في النص.
