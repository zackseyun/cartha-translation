base_translation:
  language: en
  yaml_path: translation/nt/john/004/009.yaml
  text: So the Samaritan woman said to him[a], “How is it that you, being a Jew, ask for a drink from me, a Samaritan woman?” (For Jews do not associate with Samaritans.)
translation:
  language: ar
  text: 'فقالت له المرأة السامرية: «كيف تطلب مني شرابًا، وأنت يهودي وأنا امرأة سامرية؟» (لأن اليهود لا يخالطون السامريين).[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لأن اليهود لا يتعاملون مع السامريين». وقد يكون المعنى على وجه أخص أنهم لا يشتركون معهم في استعمال الأشياء، مثل أواني الشرب.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει οὖν
  choice: فقالت
  rationale: الفاء تنقل تقدم السرد وارتباط جواب المرأة بطلب يسوع، من غير إثقال العبارة بحرف استنتاج صريح.
- source_word: ἡ γυνὴ ἡ Σαμαρῖτις
  choice: المرأة السامرية
  rationale: تعبير عربي طبيعي يحفظ تعريف المرأة وجنسها وانتماءها الجماعي.
- source_word: Πῶς
  choice: كيف
  rationale: تفيد الاستغراب من الطلب المخالف للأعراف الاجتماعية، وتبقي صيغة السؤال اليونانية من دون تحويلها إلى «لماذا».
- source_word: Ἰουδαῖος
  choice: يهودي
  rationale: المقابلة هنا بين جماعتين دينيتين اجتماعيتين، اليهود والسامريين، لا بين منطقتين جغرافيتين فحسب.
- source_word: ὢν
  choice: وأنت
  rationale: صياغة حالية عربية طبيعية تحفظ كون هوية المخاطَب خلفيةً للاستغراب من غير تحديد العلاقة بأنها سببية أو استدراكية حصراً.
- source_word: παρ’ ἐμοῦ πεῖν αἰτεῖς
  choice: تطلب مني أن أسقيك
  rationale: ينقل طلب الشرب إلى تعبير عربي مألوف في المقام، مع إبراز أن الطلب موجَّه إليها.
- source_word: γυναικὸς Σαμαρίτιδος οὔσης
  choice: وأنا امرأة سامرية
  rationale: يحفظ وصف المتكلمة لنفسها وأساس استغرابها، بصياغة عربية واضحة تلائم تركيب الحال اليوناني.
- source_word: συγχρῶνται
  choice: يخالطون
  rationale: يعبر عن عدم المعاشرة أو التعامل الاجتماعي عامة، مع إبقاء احتمال المعنى الأخص، أي الاشتراك في استعمال الأشياء، في الحاشية.
theological_decisions:
- issue: دلالة Ἰουδαῖος في الاستعمال اليوحناوي
  choice: يهودي
  alternative: يهودي من منطقة اليهودية
  rationale: السياق يقابل بين اليهود والسامريين بوصفهم جماعتين ذاتي هوية دينية واجتماعية، لا مجرد سكان منطقتين.
- issue: مدى دلالة συγχρῶνται
  choice: عدم المخالطة الاجتماعية عامة
  alternative: عدم الاشتراك في استعمال الأشياء، ولا سيما أواني الشرب
  rationale: العبارة تصلح لتفسير القطيعة الاجتماعية الواسعة، لكن سياق طلب الماء يجعل الإشارة الأخص إلى مشاركة الأواني محتملة؛ لذلك حُفظت في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدمت «يخالطون» لتجنب إيحاء «يعاشرون» غير المقصود في الاستعمال المعاصر، وحُفظ التفسير اليوحناوي بين قوسين. وُضع مؤشر الحاشية بعد الجملة التفسيرية التي تتعلق بها.
