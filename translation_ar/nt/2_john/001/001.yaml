  text: Ὁ πρεσβύτερος ἐκλεκτῇ κυρίᾳ καὶ τοῖς τέκνοις αὐτῆς, οὓς ἐγὼ ἀγαπῶ ἐν ἀληθείᾳ, καὶ οὐκ ἐγὼ μόνος ἀλλὰ καὶ πάντες οἱ ἐγνωκότες τὴν ἀλήθειαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/001.yaml
  text: The elder[a], to the chosen lady and her children, whom I love in truth—and not I alone[b], but also all who have come to know the truth—
translation:
  language: ar
  text: مِنَ الشيخ[a] إلى السيدة المختارة[c] وأولادها، الذين أحبهم في الحق[b]، ولست أنا وحدي، بل أيضًا جميع الذين قد عرفوا الحق—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: قد يُفهم اللقب بمعنى «الشيخ» من حيث السن أو المكانة أو القيادة المعترف بها.
    reason: lexical_alternative
  - marker: b
    text: يمكن أن تعني العبارة «بصدق» أو «في الحق» بالمعنى اليوحناوي الأوسع.
    reason: lexical_alternative
  - marker: c
    text: أو «إلى سيدة مختارة». وقد يفهم بعضهم «السيدة وأولادها» على أنها إشارة مجازية إلى كنيسة محلية وأعضائها، أو يفهم «كيريا» اسمًا شخصيًا.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὁ πρεσβύτερος
  choice: الشيخ
  rationale: تصلح بوصفها لقبًا أو وصفًا للسن والمكانة والقيادة المعترف بها، من غير إدخال مصطلح كنسي تقني زائد.
- source_word: ἐκλεκτῇ
  choice: المختارة
  rationale: تنقل معنى الاختيار بصياغة عربية طبيعية، وتبقى صالحة سواء أكانت المخاطبة امرأة بعينها أم جماعة ممثَّلة في صورة امرأة.
- source_word: κυρίᾳ
  choice: السيدة
  rationale: هي المقابل العربي الطبيعي للفظ الدال على سيدة، مع إبقاء احتمال كونه اسمًا علمًا في الحاشية.
- source_word: τοῖς τέκνοις αὐτῆς
  choice: وأولادها
  rationale: لفظ شامل غير مقصور على الذكور، ويحافظ على ظاهر الإحالة إلى السيدة دون حسم القراءة المجازية الكنسية.
- source_word: οὓς
  choice: الذين
  rationale: يعود طبيعيًا إلى الأولاد بوصفهم أشخاصًا، ويمكن أن يشمل جماعة المخاطبين في السياق.
- source_word: ἀγαπῶ
  choice: أحبهم
  rationale: ينقل الفعل مباشرة بلا إضافة تقوية لا يدل عليها الأصل.
- source_word: ἐν ἀληθείᾳ
  choice: في الحق
  rationale: يحافظ على احتمال الإخلاص والصدق، وعلى الدلالة اليوحناوية الأوسع للحق، بدل اختزاله في «حقًا».
- source_word: οὐκ ἐγὼ μόνος ἀλλὰ καὶ πάντες
  choice: ولست أنا وحدي، بل أيضًا جميع
  rationale: يحفظ المقابلة والتوكيد في تركيب عربي واضح.
- source_word: οἱ ἐγνωκότες
  choice: الذين قد عرفوا
  rationale: ينقل دلالة صيغة التمام على معرفة تم الوصول إليها وما زالت قائمة.
- source_word: τὴν ἀλήθειαν
  choice: الحق
  rationale: يحفظ تكرار اللفظ ورنينه اللاهوتي في الأدب اليوحناوي.
theological_decisions:
- issue: هوية ἐκλεκτῇ κυρίᾳ
  choice: السيدة المختارة
  alternative: امرأة مسيحية بعينها؛ أو كنيسة محلية مشخصنة؛ أو «كيريا» بوصفه اسمًا شخصيًا
  rationale: التركيب اليوناني يحتمل هذه القراءات، فتبقي الصياغة الرئيسة المعنى الاسمي العام، وتعرض الحاشية الاحتمالات دون حسم.
- issue: دلالة ἐν ἀληθείᾳ
  choice: في الحق
  alternative: بصدق؛ أو في نطاق الحق
  rationale: تحافظ العبارة على التوتر بين معنى المحبة الصادقة وبين المعنى اليوحناوي المرتبط بالحق.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «مِنَ الشيخ إلى» بوصفها صيغة افتتاح رسالة طبيعية، وحُفظت الشرطة في النهاية لأن الجملة تستمر في العدد التالي. جُعلت الحواشي مطابقة للعلامات الظاهرة في المتن.
