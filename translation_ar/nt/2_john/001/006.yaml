  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ αὕτη ἐστὶν ἡ ἀγάπη, ἵνα περιπατῶμεν κατὰ τὰς ἐντολὰς αὐτοῦ· αὕτη ⸂ἡ ἐντολή ἐστιν⸃, καθὼς ἠκούσατε ἀπ’ ἀρχῆς, ἵνα ἐν αὐτῇ περιπατῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/006.yaml
  text: 'And this is love: that we walk according to his commandments. This is the commandment[a], just as you heard from the beginning, that you should walk in it.'
translation:
  language: ar
  text: 'وهذه هي المحبة: أن نسلك بحسب وصاياه. وهذه هي الوصية[a]، كما سمعتم من البدء: أن تسلكوا فيها.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أن تسلكوا في المحبة»؛ فقد يعود الضمير في «فيها» إلى «المحبة» لا إلى «الوصية».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγάπη
  choice: المحبة
  rationale: المقابل العربي الطبيعي في هذا السياق، ويحفظ الصلة اللفظية والاستعمال اليوحناوي المحيط.
- source_word: ἵνα περιπατῶμεν
  choice: أن نسلك
  rationale: تشرح العبارة مضمون المحبة في الممارسة، وتحفظ صيغة المتكلم الجمع والصورة الأخلاقية للفعل.
- source_word: περιπατέω
  choice: نسلك / تسلكوا
  rationale: يحفظ الاستعارة اليوحناوية المتكررة في شطري الآية بدل تسويتها إلى «نعيش».
- source_word: κατὰ τὰς ἐντολὰς αὐτοῦ
  choice: بحسب وصاياه
  rationale: ينقل معنى المطابقة الذي تؤديه κατά مع النصب، ويحفظ جمع «الوصايا» والضمير.
- source_word: ἐντολάς / ἐντολή
  choice: وصاياه / الوصية
  rationale: يحفظ الرابط المعجمي والتحول البلاغي من الجمع إلى المفرد.
- source_word: αὕτη ἡ ἐντολή ἐστιν
  choice: وهذه هي الوصية
  rationale: لا يضيف ضمير ملكية غير موجود في اليونانية، ويحفظ التوكيد في العبارة.
- source_word: καθὼς ἠκούσατε ἀπ’ ἀρχῆς
  choice: كما سمعتم من البدء
  rationale: يحفظ زمن الفعل والتعبير اليوحناوي «من البدء» بصياغة عربية واضحة.
- source_word: ἵνα ἐν αὐτῇ περιπατῆτε
  choice: أن تسلكوا فيها
  rationale: يحفظ ضمير المؤنث والاستعارة وحرف الجر من دون توسيع تفسيري.
theological_decisions:
- issue: مرجع الضمير αὐτῇ في العبارة الأخيرة
  choice: يُفهم في المتن على أنه يعود إلى «الوصية» المفردة السابقة مباشرة
  alternative: 'قد يعود إلى «المحبة» في أول الآية، فيكون المعنى: «أن تسلكوا في المحبة»'
  rationale: «الوصية» هي أقرب مرجع نحوي مؤنث مفرد، لكن «المحبة» مؤنث مفرد أيضًا ومرتبطة بالمضمون؛ لذلك تُحفظ الإمكانية البديلة في حاشية بدل حسمها عقائديًا.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة. استُعمل «نسلك» للمحافظة على الاستعارة الأخلاقية المتكررة، و«الوصية/الوصايا» للمحافظة على الرابط اللفظي والتحول من الجمع إلى المفرد.
