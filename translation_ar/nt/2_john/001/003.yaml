  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἔσται μεθ’ ἡμῶν χάρις ἔλεος εἰρήνη παρὰ θεοῦ πατρός, καὶ ⸀παρὰ Ἰησοῦ Χριστοῦ τοῦ υἱοῦ τοῦ πατρός, ἐν ἀληθείᾳ καὶ ἀγάπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/003.yaml
  text: Grace[a], mercy, and peace will be with us from God the Father and from Jesus the Messiah, the Father's Son[b], in truth and love.
translation:
  language: ar
  text: ستكون معنا النعمة والرحمة والسلام من الله الآب، ومن يسوع المسيح، ابن الآب، في الحق والمحبة.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔσται
  choice: ستكون
  rationale: صيغة المستقبل الخبرية من «يكون»، فتحافظ على كون العبارة تقريرًا مؤكدًا لا مجرد تمنٍّ أو دعاء.
- source_word: μεθ’ ἡμῶν
  choice: معنا
  rationale: μετά مع المضاف إليه تدل هنا على المصاحبة، و«معنا» طبيعية في سياق التحية الرسولية.
- source_word: χάρις ἔλεος εἰρήνη
  choice: النعمة والرحمة والسلام
  rationale: الأسماء الثلاثة هي فاعل «ستكون»، وحُفظ ترتيب اليونانية والصياغة العربية الكتابية الواضحة.
- source_word: παρὰ θεοῦ πατρός
  choice: من الله الآب
  rationale: παρά مع المضاف إليه تفيد المصدر؛ ولا يرد في اليونانية ضمير ملكية يجيز إضافة «أبينا».
- source_word: παρὰ Ἰησοῦ Χριστοῦ
  choice: ومن يسوع المسيح
  rationale: تفيد παρά المصدر مرة أخرى. تُرجم اللقب Χριστός بصيغته العربية الراسخة «المسيح»، التي تحمل معنى اللقب ولا تقتصر على نقل صوتي أجنبي.
- source_word: τοῦ υἱοῦ τοῦ πατρός
  choice: ابن الآب
  rationale: العبارة بدل أو وصف مطابق ليسوع المسيح، وتحدد علاقته بالآب بوضوح من غير إضافة تفسير عقائدي إلى النص.
- source_word: ἐν ἀληθείᾳ καὶ ἀγάπῃ
  choice: في الحق والمحبة
  rationale: حُفظ معنى ἐν الأساسي «في»، مع التعبير العربي الطبيعي عن الاسمين المجردين.
theological_decisions:
- issue: ترجمة Χριστοῦ
  choice: المسيح
  alternative: المسيّا
  rationale: «المسيح» هو المقابل العربي الدلالي الراسخ للقب اليوناني Χριστός، ويحفظ كونه لقبًا ليسوع. أما «المسيّا» فنقل لصيغة سامية أخرى وليس لازمًا هنا.
- issue: علاقة «ابن الآب» بيسوع المسيح
  choice: جعل العبارة وصفًا مطابقًا ليسوع المسيح
  alternative: فصلها بوصف أرخى أو مستقل
  rationale: تركيب المضاف إليه المعرّف يتبع «يسوع المسيح» مباشرة، والأقرب نحويًا أنه يعرّفه بأنه ابن الآب، من غير توسيع لاهوتي يتجاوز النص.
- issue: القوة الكلامية لصيغة ἔσται
  choice: 'خبر مستقبلي: «ستكون»'
  alternative: 'صيغة دعائية: «لتكن»'
  rationale: النص اليوناني يستعمل المستقبل الخبري لا صيغة تمنٍّ أو أمر؛ لذلك حُفظ التوتر بين قالب البركة وصيغته الخبرية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدمت الصياغة الخبرية «ستكون معنا» وفق البنية اليونانية، مع إبقاء «في الحق والمحبة» موجزة كما في الأصل.
