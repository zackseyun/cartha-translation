base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/004.yaml
  text: I rejoiced greatly that I have found some of your children walking in the truth[b][a], just as we received a commandment from the Father.
translation:
  language: ar
  text: فرحتُ جدًا إذ وجدتُ بعض أولادك[a] سالكين في الحق[b]، كما تسلَّمنا وصيةً من الآب.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مِن بين أولادك». يدل التعبير اليوناني على بعضهم، لا على جميعهم بالضرورة.'
