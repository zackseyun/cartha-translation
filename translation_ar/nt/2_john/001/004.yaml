  - marker: b
    text: 'أو: «سالكين في الصدق». ويُرجَّح أن العبارة لا تشير إلى الصدق وحده، بل إلى العيش وفق الحق المعلن.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐχάρην λίαν
  choice: فرحتُ جدًا
  rationale: يحفظ معنى الفرح وشدة λίαν بعبارة عربية واضحة وطبيعية.
- source_word: ὅτι
  choice: إذ
  rationale: تربط سبب الفرح بما اكتشفه الكاتب، وهي هنا أسلس من «لأن» مع بقاء العلاقة السببية.
- source_word: εὕρηκα
  choice: وجدتُ
  rationale: الفعل العربي الماضي هو الصياغة الطبيعية هنا؛ وسياق الكلام يحمل أثر الاكتشاف القائم، وإن لم يطابق تمامًا دلالة التام اليوناني.
- source_word: ἐκ τῶν τέκνων σου
  choice: بعض أولادك
  rationale: ينقل المعنى التبعيضي في ἐκ مع المجرور، فلا يوحي بأن الكاتب يقصد جميع الأولاد بالضرورة.
- source_word: περιπατοῦντας
  choice: سالكين
  rationale: يحافظ على استعارة السير الأخلاقية اليوحناوية بدل اختزالها في «يعيشون».
- source_word: ἐν ἀληθείᾳ
  choice: في الحق
  rationale: يحفظ معنى المجال أو المعيار الذي يجري فيه السلوك، ويرجح الإشارة إلى الحق المعلن لا إلى مجرد الصدق الشخصي.
- source_word: καθὼς
  choice: كما
  rationale: تبيّن المطابقة بين سلوك الأولاد والوصية التي تسلّمها الكاتب ومن معه.
- source_word: ἐντολὴν ἐλάβομεν
  choice: تسلَّمنا وصيةً
  rationale: «تسلّمنا» يؤدي معنى التلقي بوضوح، و«وصية» تحافظ على الثقل الأخلاقي والعهدي للمصطلح اليوحناوي.
- source_word: παρὰ τοῦ πατρός
  choice: من الآب
  rationale: ينقل اللقب كما ورد من غير إضافة تفسيرية مثل «الله الآب».
theological_decisions:
- issue: مرجع «الآب»
  choice: الإبقاء على «الآب» بلا توسعة
  alternative: من الله الآب
  rationale: النص اليوناني يقول «الآب» فقط، والسياق اليوحناوي يوضح المرجع دون حاجة إلى إضافة لفظ غير موجود.
- issue: نطاق «أولادك»
  choice: بعض أولادك
  alternative: أولادك؛ أو من بين أولادك
  rationale: التركيب التبعيضي ἐκ τῶν τέκνων يدل على أفراد من بين الأولاد، ولا يصرح بأن الجميع كانوا سالكين في الحق.
- issue: دلالة «في الحق»
  choice: الإبقاء على العبارة «في الحق»
  alternative: في صدق؛ أو بالحق
  rationale: تحفظ العبارة احتمال المجال أو المعيار المرتبط بالحق المعلن، ولا تحصرها في الإخلاص أو الصدق الذاتي.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ووقورة. استُبقيت استعارة «السلوك» الشائعة كتابيًا، مع استعمال «أولادك» بوصفه تعبيرًا شاملًا غير مقصور على الذكور.
