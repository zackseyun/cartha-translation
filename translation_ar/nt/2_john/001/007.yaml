  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὅτι πολλοὶ πλάνοι ⸀ἐξῆλθον εἰς τὸν κόσμον, οἱ μὴ ὁμολογοῦντες Ἰησοῦν Χριστὸν ἐρχόμενον ἐν σαρκί· οὗτός ἐστιν ὁ πλάνος καὶ ὁ ἀντίχριστος.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/007.yaml
  text: For many deceivers have gone out into the world[a], those who do not confess Jesus the Messiah coming in the flesh[b]. This is the deceiver and the antichrist.
translation:
  language: ar
  text: لِأَنَّ مُضِلِّينَ كَثِيرِينَ خَرَجُوا إِلَى الْعَالَمِ، وَهُمْ الَّذِينَ لَا يَعْتَرِفُونَ بِيَسُوعَ الْمَسِيحِ آتِيًا فِي الْجَسَدِ.[a] هَذَا هُوَ الْمُضِلُّ وَضِدُّ الْمَسِيحِ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «لا يعترفون بأن يسوع المسيح قد أتى في الجسد». لكن اليونانية تقول حرفيًا «آتيًا في الجسد»، وهي صياغة تؤكد حقيقة مجيئه في وجود بشري متجسد.'
    reason: lexical_alternative
  - marker: b
    text: '«ضدّ المسيح»: أي المناوئ للمسيح؛ ويُترجم اللفظ اليوناني أيضًا بالنقل الصوتي «أنتيخريستوس».'
    reason: term_clarification
lexical_decisions:
- source_word: ὅτι
  choice: لأنَّ
  rationale: تفيد الأداة هنا التعليل لما سبق، و«لأنَّ» تنقل هذه الصلة بوضوح في العربية.
- source_word: πολλοὶ πλάνοι
  choice: مُضِلِّين كثيرين
  rationale: تشير πλάνοι إلى أشخاص يُضلّون غيرهم، لا إلى مجرد أشخاص ضالين؛ كما يحافظ «مُضِلّ» على الصلة بالتعبير المفرد اللاحق.
- source_word: ἐξῆλθον εἰς τὸν κόσμον
  choice: خرجوا إلى العالم
  rationale: صياغة مباشرة تحفظ معنى الانتشار العلني في العالم من غير تحميل κόσμος معنى «نظام العالم».
- source_word: οἱ μὴ ὁμολογοῦντες
  choice: وهم الذين لا يعترفون
  rationale: اسم الفاعل المعرّف يؤدي وظيفة اسمية، فصيغ بعبارة موصولة طبيعية. و«يعترفون» يحفظ معنى الإقرار المعلن.
- source_word: Ἰησοῦν Χριστόν
  choice: يسوع المسيح
  rationale: «المسيح» هو المقابل العربي الراسخ للقب Χριστός، والسياق يبرز هوية يسوع المسيانية.
- source_word: ἐρχόμενον
  choice: آتيًا
  rationale: يحفظ اسم الفاعل العربي الصيغة الحاضرة في اليونانية وصلتها بيسوع المسيح، من غير تحويلها صراحةً إلى حدث ماضٍ مكتمل.
- source_word: ἐν σαρκί
  choice: في الجسد
  rationale: التعبير العربي الطبيعي يحفظ دلالة التجسد البشري الحقيقي، ولا يوحي بمعنى «الطبيعة الخاطئة».
- source_word: οὗτός ἐστιν
  choice: هذا هو
  rationale: يحفظ الإشارة المفردة التي تصف كل من ينطبق عليه القول أو هذا النمط من الأشخاص.
- source_word: ὁ πλάνος
  choice: المُضِلّ
  rationale: يحافظ على الاتساق المعجمي مع πλάνοι في أول الآية.
- source_word: ὁ ἀντίχριστος
  choice: ضدّ المسيح
  rationale: هذا هو التعبير العربي الكتابي الواضح عن ἀντίχριστος، ويدل على المعارض للمسيح أو المناوئ له.
theological_decisions:
- issue: دلالة Χριστός
  choice: المسيح
  alternative: كريستوس أو استعمال اللفظ بوصفه اسمًا مجردًا
  rationale: السياق يتناول مضمون الاعتراف بهوية يسوع، ولذلك أبقيت دلالة اللقب صريحة باستعمال «المسيح».
- issue: قوة ἐρχόμενον ἐν σαρκί
  choice: آتيًا في الجسد
  alternative: قد أتى في الجسد
  rationale: النص اليوناني يستعمل اسم فاعل حاضرًا؛ فتحفظ الترجمة صيغته وما فيها من احتمال زمني، بدل حصرها في الماضي، مع تأكيد مجيئه البشري المتجسد.
- issue: معنى σάρξ
  choice: الجسد، أي الوجود البشري المتجسد الحقيقي
  alternative: الطبيعة الخاطئة
  rationale: السياق مسيحيّ يتعلق بحقيقة تجسد يسوع، لا بالفساد الأخلاقي.
- issue: المفرد بعد الجمع في οὗτός
  choice: هذا هو المُضِلّ
  alternative: هؤلاء هم المُضِلّون
  rationale: أُبقي المفرد كما في اليونانية، إذ يشخّص كل من يرفض هذا الاعتراف بوصفه ممثلًا لهذا الوصف، من غير تسوية التوتر النحوي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «المُضِلّ» بدل «المخادع» لإبراز أن πλάνος يضلل الآخرين، واستُبقيت صيغة «آتيًا» للمحافظة على الغموض الزمني الحقيقي في اسم الفاعل اليوناني.
