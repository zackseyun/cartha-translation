  text: πᾶς ὁ ⸀προάγων καὶ μὴ μένων ἐν τῇ διδαχῇ τοῦ Χριστοῦ θεὸν οὐκ ἔχει· ὁ μένων ἐν τῇ ⸀διδαχῇ, οὗτος καὶ τὸν πατέρα καὶ τὸν υἱὸν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/009.yaml
  text: Everyone who goes on ahead and does not remain in the teaching of Messiah does not have God[a]. The one who remains in the teaching[b], this one has both the Father and the Son.
translation:
  language: ar
  text: كلُّ مَن يتقدَّم ولا يثبت في تعليم المسيح، فليس له الله[a]. أمّا مَن يثبت في التعليم[b]، فله الآب والابن معًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أيضًا ترجمة «يتقدَّم» بـ«يمضي أبعد من اللازم» أو «يندفع إلى الأمام». وتقرأ بعض المخطوطات «يتعدّى» بدلًا من «يتقدَّم».
    reason: textual_variant
  - marker: b
    text: قد تعني عبارة «تعليم المسيح» تعليمَ المسيح نفسه، أو التعليمَ المتعلّق بالمسيح.
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ὁ προάγων
  choice: كلُّ مَن يتقدَّم
  rationale: 'تفيد العبارة معنى عامًا: كل من يمضي إلى الأمام. ويحفظ «يتقدَّم» صورة النص من غير أن يحسمها بتفسير مثل «يتجاوز الحد»، كما يميّزها من القراءة النصية البديلة «يتعدّى».'
- source_word: μὴ μένων / ὁ μένων
  choice: لا يثبت / مَن يثبت
  rationale: الفعل μένω يوحناوي بارز يدل على البقاء والاستمرار. و«يثبت» تعبير عربي طبيعي يحفظ معنى الاستقرار والاستمرار في التعليم، مع تكراره لإبراز المقابلة.
- source_word: ἐν τῇ διδαχῇ
  choice: في تعليم / في التعليم
  rationale: «تعليم» أوضح وأيسر من «عقيدة» هنا، ويحافظ على المجال الدلالي للكلمة اليونانية διδαχή.
- source_word: τοῦ Χριστοῦ
  choice: المسيح
  rationale: Χριστός لقب معناه المسيح. وتبقي صيغة «تعليم المسيح» الإضافة محتملةً لأن تدل على التعليم الصادر منه أو التعليم المتعلق به.
- source_word: θεὸν οὐκ ἔχει
  choice: فليس له الله
  rationale: يحفظ هذا التعبير الصياغة اليوحناوية الحادة ولا يوسّعها تفسيرًا إلى «ليست له شركة مع الله».
- source_word: οὗτος
  choice: فهو
  rationale: يؤدي ضمير الفصل مع الفاء وظيفة الإشارة التوكيدية في عربية طبيعية، من غير الصياغة الثقيلة «فهذا هو».
- source_word: καὶ τὸν πατέρα καὶ τὸν υἱὸν ἔχει
  choice: فهو له الآب والابن معًا
  rationale: 'تنقل «معًا» ترابط καὶ...καὶ، وتحفظ اللقبين الشخصيين الصريحين: الآب والابن.'
theological_decisions:
- issue: دلالة προάγων في القراءة المعتمدة
  choice: يتقدَّم
  alternative: يتجاوز الحد؛ يندفع إلى الأمام؛ يتعدّى
  rationale: نص SBLGNT يقرأ προάγων لا παραβαίνων. لذلك حُفظت استعارة التقدّم في المتن، مع ذكر احتمال «يتجاوز الحد» والقراءة المخطوطية البديلة في الحاشية.
- issue: معنى إضافة «تعليم المسيح»
  choice: الإبقاء على الإضافة العربية الموجزة «تعليم المسيح»
  alternative: تعليم المسيح نفسه؛ التعليم عن المسيح
  rationale: يمكن أن تكون الإضافة اليونانية ذاتية أو موضوعية، والسياق اللاهوتي يسمح بأن يكون المقصود تعليم المسيح أو التعليم المتعلق به؛ لذلك لم يُحسم الاحتمال في المتن.
- issue: لقب Χριστός
  choice: المسيح
  alternative: كريستوس/المسيح بوصفه اسمًا محضًا
  rationale: تُرجم اللقب بمعناه العربي الراسخ «المسيح»، وهو هنا لقب لا مجرد اسم شخصي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «يثبت» للمحافظة على التكرار اليوحناوي والمقابلة، و«فليس له الله» لصون حدة العبارة الأصلية من غير شرح مذهبي زائد.
