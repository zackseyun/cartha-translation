  text: διὰ τὴν ἀλήθειαν τὴν μένουσαν ἐν ἡμῖν, καὶ μεθ’ ἡμῶν ἔσται εἰς τὸν αἰῶνα·
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/002.yaml
  text: because of the truth that remains in us and will be with us forever[a].
translation:
  language: ar
  text: بسبب الحق الذي يبقى فينا، وسيكون معنا إلى الأبد[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الذي يثبت فينا».'
    reason: بديل معجمي للفعل μένω يبرز معنى الثبات والاستمرار.
lexical_decisions:
- source_word: διὰ
  choice: بسبب
  rationale: تأتي διά هنا مع النصب فتفيد السبب أو العلة، وتبيّن أساس المحبة المذكورة في الآية السابقة.
- source_word: ἀλήθειαν
  choice: الحق
  rationale: ينقل اللفظ اليوناني مباشرة من غير تضييق دلالته على الإنجيل أو التعليم الصحيح وحده.
- source_word: τὴν μένουσαν
  choice: الذي يبقى
  rationale: يعبّر اسم الفاعل المضارع عن حضور مستمر؛ و«يبقى» عربية واضحة تحفظ معنى الاستمرار.
- source_word: ἐν ἡμῖν
  choice: فينا
  rationale: هو المقابل المباشر والطبيعي للتركيب، ويحفظ معنى حضور الحق في المؤمنين من غير تحويله إلى «بيننا».
- source_word: καὶ μεθ’ ἡμῶν ἔσται
  choice: وسيكون معنا
  rationale: ترجمة مباشرة وطبيعية للفعل المستقبل وحرف المصاحبة، من غير إضافة معنى الاستمرار إلى هذا الشطر.
- source_word: εἰς τὸν αἰῶνα
  choice: إلى الأبد
  rationale: هذا تعبير اصطلاحي عن الدوام، و«إلى الأبد» هو المقابل العربي الواضح والمألوف.
theological_decisions:
- issue: الدلالة اللاهوتية لكلمة «الحق» في الأدب اليوحناوي
  choice: الإبقاء على لفظ «الحق» وحده
  alternative: «حق الإنجيل» أو «التعليم الحق»
  rationale: لا يحدد النص اليوناني صراحةً ما إذا كان المقصود رسالة الإنجيل أو التعليم الصحيح أو واقع إعلان الله الأوسع؛ لذلك تحفظ الترجمة سعة اللفظ وتوتره اللاهوتي.
translation_notes:
  register: صياغة عربية فصحى معاصرة وواضحة ذات نبرة كتابية رصينة. استُعمل «يبقى» في المتن لأنه أسهل للقارئ العام، مع إثبات «يثبت» بديلًا في الحاشية.
