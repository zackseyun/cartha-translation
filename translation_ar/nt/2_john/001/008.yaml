base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/008.yaml
  text: Watch yourselves[a], so that you may not lose what we have worked for, but may receive a full reward.
translation:
  language: ar
  text: انتبهوا إلى أنفسكم، لئلا تخسروا ما عملنا لأجله، بل لكي تنالوا أجرًا كاملًا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ بعض المخطوطات: «ما عملتم لأجله» بدلًا من «ما عملنا لأجله».'
    reason: textual_variant
lexical_decisions:
- source_word: βλέπετε ἑαυτούς
  choice: انتبهوا إلى أنفسكم
  rationale: يفيد فعل الأمر المضارع دعوة جماعية إلى اليقظة المستمرة، والضمير الانعكاسي يجعل التحذير موجَّهًا إلى القراء بشأن أنفسهم.
- source_word: ἵνα μὴ ἀπολέσητε
  choice: لئلا تخسروا
  rationale: تعبّر ἵνα مع النفي وصيغة الاحتمال عن غاية أو نتيجة يُراد تجنبها، و«تخسروا» تلائم سياق ضياع ثمرة العمل دون الإيحاء بالإهلاك.
- source_word: ἃ εἰργασάμεθα
  choice: ما عملنا لأجله
  rationale: تحافظ الصياغة على قراءة المتكلم الجمع الواردة في SBLGNT، وعلى صلة العمل بالثمرة أو الغاية المعرضة للخسارة.
- source_word: μισθὸν πλήρη
  choice: أجرًا كاملًا
  rationale: «أجر» مقابل عربي طبيعي لـ μισθός في هذا السياق، و«كاملًا» تنقل معنى تمام الأجر دون تحديد ماهيته.
- source_word: ἀπολάβητε
  choice: تنالوا
  rationale: ينقل معنى الحصول أو التلقي بوضوح، من غير فرض دلالة «الاسترداد» التي قد يحملها الفعل في سياقات أخرى.
theological_decisions:
- issue: فاعل εἰργασάμεθα
  choice: عملنا
  alternative: عملتم
  rationale: النص اليوناني المعطى يقرأ صيغة المتكلم الجمع، فتُنسب أعمال السعي إلى الكاتب ومن معه. وتوجد قراءة مخطوطية بصيغة المخاطب الجمع تنسب العمل إلى القراء، ولذلك تُذكر في الحاشية بدل إحلالها في المتن.
- issue: طبيعة الأجر
  choice: أجرًا كاملًا بلا تفسير إضافي
  alternative: تحديده بأنه خلاص أو مكافأة أخروية بعينها
  rationale: الآية لا تعرّف ماهية الأجر صراحة، لذا تُحفظ سعة التعبير والتوتر اللاهوتي دون إدخال تفسير مذهبي.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدم «انتبهوا إلى أنفسكم» لتحذير طبيعي مباشر، مع الحفاظ على صيغة الجمع والتوازي بين الخسارة ونيل الأجر.
