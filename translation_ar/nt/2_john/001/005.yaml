  text: καὶ νῦν ἐρωτῶ σε, κυρία, οὐχ ὡς ἐντολὴν ⸂καινὴν γράφων σοι⸃ ἀλλὰ ἣν εἴχομεν ἀπ’ ἀρχῆς, ἵνα ἀγαπῶμεν ἀλλήλους.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/005.yaml
  text: 'And now I ask you[a], lady, not as though I were writing to you a new commandment, but the one we have had from the beginning: that we love one another.'
translation:
  language: ar
  text: 'والآن أطلب منكِ[a]، يا سيدتي، لا كأنني أكتب إليكِ وصيةً جديدة، بل كالوصية التي كانت لنا منذ البدء: أن نحبَّ بعضنا بعضًا.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو ربما: «إلى الكنيسة»، إذا كانت «السيدة» إشارة مجازية إلى الكنيسة؛ ويرى بعضهم أيضًا أن «كيريا» اسم امرأة.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐρωτῶ
  choice: أطلب
  rationale: يفيد الفعل هنا الطلب في سياق رسائلي؛ و«أطلب» طبيعية وتحافظ على النبرة من غير تشديدها إلى «أحثّ».
- source_word: κυρία
  choice: يا سيدتي
  rationale: صيغة نداء مؤنثة تعني «سيدة». تحافظ «يا سيدتي» على الخطاب المباشر ولا تحسم هل المقصود امرأة بعينها أم جماعة مجسَّدة، مع بيان الاحتمالات في الحاشية.
- source_word: ἐντολὴν καινὴν
  choice: وصية جديدة
  rationale: ترجمة مألوفة ودقيقة تحفظ الصدى اليوحناوي لعبارة «وصية جديدة».
- source_word: γράφων σοι
  choice: كأني أكتب إليكِ
  rationale: تصوغ اسم الفاعل اليوناني صياغة عربية طبيعية داخل تركيب المقابلة «لا كأني... بل».
- source_word: ἣν εἴχομεν
  choice: الوصية التي كانت لنا
  rationale: يحافظ الماضي «كانت» على قيمة صيغة الناقص εἴχομεν، بينما يدل «منذ البدء» على امتدادها الزمني؛ وتكرار «الوصية» يوضح مرجع اسم الموصول في العربية.
- source_word: ἀπ’ ἀρχῆς
  choice: منذ البدء
  rationale: تعبير عربي طبيعي يحفظ العبارة اليوحناوية ودلالتها الزمنية.
- source_word: ἵνα ἀγαπῶμεν ἀλλήλους
  choice: أن يحب بعضنا بعضًا
  rationale: ينقل مضمون الوصية مع إبقاء صيغة الجمع الشاملة والتبادلية في عبارة عربية واضحة.
theological_decisions:
- issue: مرجع κυρία
  choice: إبقاء الخطاب الحرفي «يا سيدتي» من غير تعيين هوية المخاطَبة
  alternative: فهمها رمزًا لكنيسة محلية، أو اعتبار «كيريا» اسم علم
  rationale: اللفظة اليونانية نفسها تعني «سيدة»، والسياق يسمح بأكثر من تحديد؛ لذلك تُصان المسألة مفتوحة في المتن وتُذكر الاحتمالات في الحاشية.
- issue: القيمة الزمنية لعبارة ἣν εἴχομεν ἀπ’ ἀρχῆς
  choice: «التي كانت لنا منذ البدء»
  alternative: «التي لنا منذ البدء»
  rationale: المختار يعكس صيغة الماضي الناقص في الأصل من غير إنكار استمرار الوصية، وهو ظاهر من كون الكاتب لا يزال يطلب العمل بها.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة رسائلية كريمة. استُعملت علامات التأنيث في «منكِ/إليكِ» اتساقًا مع ظاهر κυρία، مع حاشية تحفظ احتمال الإشارة المجازية إلى الكنيسة أو احتمال الاسم الشخصي.
