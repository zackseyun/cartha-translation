    issue: «أن يحب بعضنا بعضًا»
    rationale: الفعل اليوناني ἀγαπῶμεν في صيغة المتكلم الجمع، ومعناه «أن نحبّ بعضنا بعضًا». الصيغة الحالية «يحب» غائب مفرد ولا تنقل الشخص النحوي في الأصل.
  - severity: medium
    issue: «بل الوصية التي كانت لنا»
    rationale: بعد «لا كأنني أكتب...» يحتاج الشق المقابل في العربية إلى رابط المقارنة المقدر في اليونانية؛ «بل كالوصية التي كانت لنا» يبين أن المقصود ليس كتابة وصية جديدة بل وصية كانت لهم منذ البدء.
  - severity: medium
    issue: 'الحاشية: «أو ربما: منكم»'
    rationale: 'الأصل الإنجليزي يذكر احتمال فهم «lady» بمعنى الكنيسة، لا استبدال «منكِ» بـ«منكم». الأنسب عربيًا: «أو ربما: إلى الكنيسة».'
