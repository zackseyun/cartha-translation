  verdict: revise
  source_fidelity: 'يلزم تصحيح صيغة الفعل الأخيرة إلى المتكلم الجمع، لأن ἀγαπῶμεν تعني «نحبّ»، لا «يحب». كما أن المقابلة اليونانية بين «وصية جديدة» ووصية كانت منذ البدء تُنقل عربيًا بوضوح أكبر بإظهار الكاف المحذوفة تقديرًا في الشق الثاني: «بل كوصية...» .'
  naturalness: النص بعد التصحيح فصيح معاصر وسلس. تركيب «بل كالوصية التي كانت لنا» يحفظ علاقة المقابلة ويزيل الوقفة غير المكتملة نحويًا في «بل الوصية».
  terminology: «يا سيدتي» و«وصية جديدة» و«منذ البدء» اختيارات مناسبة وتحافظ على الغموض المقصود في κυρία وعلى الصياغة اليوحناوية. تُصحَّح الحاشية لتقول «إلى الكنيسة» بدل «منكم»، لأن الاحتمال البديل يتعلق بمرجع «السيدة» لا بتحويل المخاطب إلى ضمير جمع في العبارة العربية.
  issues:
