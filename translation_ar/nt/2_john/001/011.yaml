source:
  edition: SBLGNT
  text: ὁ ⸂λέγων γὰρ⸃ αὐτῷ χαίρειν κοινωνεῖ τοῖς ἔργοις αὐτοῦ τοῖς πονηροῖς.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/011.yaml
  text: For the one who says to him[a], “Greetings,” shares in his evil works.
translation:
  language: ar
  text: 'لأن من يقول له: «سلام!»[a] يشترك في أعماله الشريرة.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «تحية!» اللفظة اليونانية صيغة مألوفة للتحية، وهي في هذا السياق تفيد إظهار القبول أو الترحيب، لا مجرد تبادل كلمات المجاملة.'
    reason: بديل معجمي وتوضيح دلالة الصيغة في السياق
lexical_decisions:
- source_word: ὁ λέγων
  choice: من يقول
  rationale: اسم الموصول «من» مع الفعل المضارع ينقل الاستعمال الاسمي العام لاسم الفاعل اليوناني، ويشير إلى أي شخص يفعل ذلك.
- source_word: γάρ
  choice: لأن
  rationale: تفيد الأداة تعليل النهي الوارد في العدد السابق، و«لأن» تؤدي هذا الربط بوضوح في العربية.
- source_word: αὐτῷ
  choice: له
  rationale: يحافظ الضمير على الإحالة إلى الشخص المذكور في السياق السابق من غير إضافة تفسيرية إلى نص العدد.
- source_word: χαίρειν
  choice: «سلام!»
  rationale: جاء المصدر بعد فعل القول بوصفه صيغة تحية اصطلاحية، و«سلام» تحية عربية طبيعية تحفظ معنى التحية من غير أن تجعل «الترحيب» التفسيري جزءًا صريحًا من المتن.
- source_word: κοινωνεῖ
  choice: يشترك في
  rationale: الفعل مع المجرور دلاليًا يفيد المشاركة في شيء؛ و«يشترك في» يبيّن التورط أو المساهمة من غير تحميل اللفظ معنى كنسيًا اصطلاحيًا أضيق.
- source_word: τοῖς ἔργοις αὐτοῦ τοῖς πονηροῖς
  choice: أعماله الشريرة
  rationale: يحافظ «أعمال» على المقابل المباشر لـἔργα، وتصفها «الشريرة» بحسب القوة الأخلاقية لـπονηρός.
theological_decisions:
- issue: هل المقصود بالتحية مجرد المجاملة أم إظهار القبول بما يؤدي إلى المشاركة؟
  choice: أُبقيت صيغة التحية في المتن كما هي، بينما يوضح السياق القريب، ولا سيما استقبال المعلّم ودعمه في العدد السابق، أن التحذير يتعلق بتحية تنطوي على القبول أو التأييد وتفضي إلى الاشتراك في أعماله الشريرة.
  alternative: اعتبار العدد حظرًا مطلقًا لأي تحية مهذبة تُوجَّه إلى مثل هذا الشخص في كل ظرف.
  rationale: χαίρειν صيغة تحية في ذاتها، أما κοινωνεῖ والسياق السابق فيبرزان معنى التواطؤ أو الدعم. لذلك لا يوسّع المتن العبارة إلى «يرحّب به» ولا يحصرها في تبادل كلمات المجاملة، بل يحفظ التوتر الذي في النص.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة. استُعملت «سلام» بوصفها صيغة تحية طبيعية، و«يشترك في» لنقل معنى المشاركة الأخلاقية بوضوح، مع إبقاء التفسير السياقي الأوسع في الحاشية.
