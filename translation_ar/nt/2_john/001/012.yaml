  text: Πολλὰ ἔχων ὑμῖν γράφειν οὐκ ἐβουλήθην διὰ χάρτου καὶ μέλανος, ἀλλὰ ἐλπίζω ⸀γενέσθαι πρὸς ὑμᾶς καὶ στόμα πρὸς στόμα λαλῆσαι, ἵνα ἡ χαρὰ ⸀ὑμῶν ⸂πεπληρωμένη ᾖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/012.yaml
  text: Though I have many things to write to you[a], I did not want to do so with paper and ink. Instead, I hope to come to you and speak face to face, so that your joy may be made complete.
translation:
  language: ar
  text: مع أن لدي أمورًا كثيرة لأكتبها إليكم، لم أشأ أن أفعل ذلك بالورق والحبر، بل أرجو أن آتي إليكم وأتحدث معكم وجهًا لوجه، لكي يكون فرحكم[a] كاملًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ بعض المخطوطات: «فرحنا» بدلًا من «فرحكم».'
    reason: textual_variant
lexical_decisions:
- source_word: Πολλὰ ἔχων ὑμῖν γράφειν
  choice: مع أن لدي أمورًا كثيرة أكتبها إليكم
  rationale: تؤدي صيغة اسم الفاعل معنى الحال التنازلية في عربية طبيعية، وتحافظ «أمورًا كثيرة» على دلالة الجمع في Πολλά، كما تُظهر «إليكم» جهة الكتابة.
- source_word: οὐκ ἐβουλήθην
  choice: لم أشأ
  rationale: تعبير عربي فصيح وموجز ينقل معنى الإرادة أو الرغبة في βούλομαι ويلائم نبرة الرسالة.
- source_word: διὰ χάρτου καὶ μέλανος
  choice: بالورق والحبر
  rationale: الباء تنقل معنى الوسيلة الذي تؤديه διά مع المضاف إليه، بصياغة عربية واضحة وطبيعية.
- source_word: ἀλλὰ ἐλπίζω γενέσθαι πρὸς ὑμᾶς
  choice: بل أرجو أن آتي إليكم
  rationale: تنقل «آتي إليكم» المعنى الاصطلاحي للحضور عند المخاطَبين، مع الحفاظ على الاتجاه الذي تفيده πρός.
- source_word: στόμα πρὸς στόμα λαλῆσαι
  choice: وأتحدث معكم وجهًا لوجه
  rationale: «وجهًا لوجه» هو المقابل العربي الطبيعي للتواصل الشخصي المباشر المقصود من التعبير اليوناني الحرفي «فمًا إلى فم»، و«أتحدث معكم» يوضح المشاركة في الحديث دون تغيير المعنى.
- source_word: ἵνα ἡ χαρὰ ὑμῶν πεπληρωμένη ᾖ
  choice: لكي يكون فرحكم كاملًا
  rationale: تحافظ «لكي» على غرض العبارة، وتنقل «يكون... كاملًا» حالة الامتلاء أو الاكتمال التي تفيدها صيغة اسم المفعول التام مع فعل الكينونة.
theological_decisions:
- issue: اختلاف الضمير الذي يحدد أصحاب الفرح
  choice: فرحكم
  alternative: فرحنا
  rationale: يتبع النص الرئيسي قراءة SBLGNT، وهي ὑμῶν («فرحكم»). ولأن قراءة ἡμῶν («فرحنا») واردة في بعض المخطوطات ولها أثر تفسيري، أُثبتت في الحاشية بدل إسقاطها.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة، مع تركيب رسائلي طبيعي. استُخدم «بالورق والحبر» للوسيلة، و«وجهًا لوجه» بدل المقابلة الحرفية المضللة، مع إبقاء اختلاف الضمير في حاشية نصية.
