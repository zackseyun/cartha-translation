  to: مع أن لدي أمورًا كثيرة لأكتبها إليكم، لم أشأ أن أفعل ذلك بالورق والحبر، بل أرجو أن آتي إليكم وأتحدث معكم وجهًا لوجه، لكي يكون فرحكم[a] كاملًا.
