  terminology: «الورق والحبر»، و«وجهًا لوجه»، و«فرحكم كاملًا» اختيارات سليمة في العربية الفصحى الحديثة. و«لم أشأ» مناسبة لنبرة الرسالة ولمعنى ἐβουλήθην. لا توجد مصطلحات لاهوتية تستلزم تعديلًا.
