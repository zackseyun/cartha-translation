revisions:
- from: 'إِنْ جَاءَكُمْ أَحَدٌ وَلَا يَحْمِلُ هَذَا التَّعْلِيمَ، فَلَا تَقْبَلُوهُ فِي الْبَيْتِ، وَلَا تَقُولُوا لَهُ: «سَلَامٌ».[a][b]'
  to: 'إِنْ يَأْتِكُمْ أَحَدٌ وَلَا يَأْتِ بِهَذَا التَّعْلِيمِ[b]، فَلَا تَسْتَقْبِلُوهُ فِي بُيُوتِكُمْ، وَلَا تَقُولُوا لَهُ: «سَلَامٌ»[a].'
  rationale: تُحسّن المراجعة المطابقة الزمنية والتعبير العربي عن «جلب التعليم»، وتوضح ارتباط الحواشي بمواضعها، وتزيل من الحاشية وصفًا تفسيريًا زائدًا، من غير تغيير المعنى أو حسم نطاق النهي اللاهوتي بما يتجاوز ألفاظ الآية.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T06:31:55Z'
review_pass:
  verdict: revise
  source_fidelity: يلزم تعديل محدود. «إن يأتكم» يحافظ على زمن المضارع في ἔρχεται بصورة أوضح من «إن جاءكم»، و«لا يأتِ بهذا التعليم» تعبير عربي طبيعي عن οὐ φέρει في هذا السياق، أي لا يأتي حاملًا هذا التعليم. «فلا تستقبلوه في بيوتكم» ينقل النهي عن الاستقبال في سياق الضيافة الذي تفيده εἰς οἰκίαν، من غير توسيع نطاقه إلى كل تعامل ممكن.
  naturalness: 'النص المعدل فصيح معاصر وسلس. عبارة «ولا تقولوا له: سلام» عربية واضحة وتحافظ على فعل القول ومضمون التحية؛ وهي أدق شكليًا من اختزالها إلى «لا تحيّوه»، مع أن هذا الاختزال صالح في الحاشية.'
  terminology: «التعليم» مناسب لـ διδαχή. وحُفظ المفرد المذكر في الضمير «تستقبلوه». عُدّلت الحاشية السياقية لتتجنب وصف الإقرار بأنه «رسولي» في حين أن هذا الوصف ليس لفظًا في السياق المباشر، مع إبقاء التوضيح السياقي غير الجازم.
