  text: εἴ τις ἔρχεται πρὸς ὑμᾶς καὶ ταύτην τὴν διδαχὴν οὐ φέρει, μὴ λαμβάνετε αὐτὸν εἰς οἰκίαν καὶ χαίρειν αὐτῷ μὴ λέγετε·
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/010.yaml
  text: If anyone comes to you and does not bring this teaching, do not receive him into your house, and do not say a greeting to him.
translation:
  language: ar
  text: 'إِنْ يَأْتِكُمْ أَحَدٌ وَلَا يَأْتِ بِهَذَا التَّعْلِيمِ[b]، فَلَا تَسْتَقْبِلُوهُ فِي بُيُوتِكُمْ، وَلَا تَقُولُوا لَهُ: «سَلَامٌ»[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمتها بأسلوب أكثر اختصارًا: «ولا تُحَيُّوهُ». واليونانية تقول حرفيًّا ما معناه: «ولا تقولوا له تحية».'
    reason: lexical_alternative
  - marker: b
    text: يتعلق التحذير في السياق بمن لا يأتي بـ«هذا التعليم»، ويُرجَّح أنه معلّم متنقّل تخالف رسالته الإقرار المبيَّن في الآيات المحيطة.
    reason: cross_reference
lexical_decisions:
- source_word: εἴ τις
  choice: إِنْ جَاءَكُمْ أَحَدٌ
  rationale: ينقل أداة الشرط والحالة العامة غير المحددة بصياغة عربية طبيعية.
- source_word: ἔρχεται πρὸς ὑμᾶς
  choice: جَاءَكُمْ
  rationale: تعبير عربي مباشر عن المجيء إلى المخاطَبين، من غير إضافة دلالة كنسية لا يصرّح بها النص.
- source_word: ταύτην τὴν διδαχήν
  choice: هَذَا التَّعْلِيمَ
  rationale: «التعليم» واضح ومعاصر، ويحفظ اسم الإشارة وإحالة العبارة إلى مضمون الآيات المحيطة دون حسمه داخل الترجمة.
- source_word: οὐ φέρει
  choice: لَا يَحْمِلُ
  rationale: يحفظ صورة الفعل اليوناني في حمل التعليم أو الإتيان به، وهي مفهومة في العربية.
- source_word: μὴ λαμβάνετε αὐτὸν
  choice: فَلَا تَقْبَلُوهُ
  rationale: «تقبلوه» تنقل معنى الاستقبال والقبول، وتترك عبارة البيت التالية لتحدد سياق الضيافة.
- source_word: εἰς οἰκίαν
  choice: فِي الْبَيْتِ
  rationale: صياغة طبيعية لعبارة الدخول في نطاق البيت والضيافة؛ لم يُضف ضمير ملكية لأن اليونانية لا تصرّح به.
- source_word: χαίρειν αὐτῷ μὴ λέγετε
  choice: 'وَلَا تَقُولُوا لَهُ: «سَلَامٌ»'
  rationale: يحفظ بنية «لا تقولوا له» ويعرض مضمون التحية بصورة عربية واضحة، بدل اختزال العبارة إلى «لا تسلّموا عليه».
theological_decisions:
- issue: نطاق النهي المتعلق بمن لا يحمل هذا التعليم
  choice: 'أُبقي النهي في صورته الملموسة: عدم قبوله في البيت وعدم قول التحية له.'
  alternative: تفسيره إما حظرًا مطلقًا لكل تعامل اجتماعي، وإما منعًا مقصورًا على استضافته معلّمًا في اجتماع الكنيسة.
  rationale: السياق يرجّح الحديث عن معلّم جوّال وتعليم مخالف، لكن ألفاظ الآية نفسها لا تحسم كامل نطاق التطبيق؛ لذلك لم تُوسَّع أو تُضيَّق في المتن.
- issue: إحالة الضمير αὐτόν
  choice: تقبَلُوه بصيغة المفرد المذكر التي تستوعب المرجع العام في العربية.
  alternative: استعمال صيغة محايدة أو جمعية لا يتيحها النظام النحوي العربي على النحو نفسه.
  rationale: يحافظ الاختيار على المفرد المذكر في الأصل من غير أن يقصر الحالة بالضرورة على رجل بعينه.
- issue: دلالة التحية χαίρειν
  choice: «سَلَامٌ» بوصفها مضمون التحية العربية الطبيعية، مع إبقاء فعل القول.
  alternative: «لا تسلّموا عليه» أو «لا تحيّوه».
  rationale: يحافظ هذا على الصياغة اليونانية اللافتة «لا تقولوا له تحية»، مع تجنب لفظ عربي متكلف مثل «فرحًا» لا يؤدي وظيفة التحية طبيعيًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة، مع ضبط كامل للنص الرئيس. حُفظت الصياغة الشرطية، وجرى تجنب المصطلحات الطائفية والتوسعات التفسيرية. وُضعت علامتا الحاشيتين بعد الجملة لأن الأولى تشرح التحية والثانية تشرح نطاق التحذير في سياقه.
