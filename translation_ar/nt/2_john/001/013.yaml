  text: The children of your chosen sister greet you.
translation:
  language: ar
  text: يُسَلِّم عليكِ أبناءُ أختكِ المختارة.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀσπάζεταί σε
  choice: يُسَلِّم عليكِ
  rationale: تعبير عربي طبيعي يؤدي معنى توجيه التحية، مع تأنيث ضمير المخاطبة بحسب «أختكِ» في السياق المباشر.
- source_word: τὰ τέκνα
  choice: أبناءُ
  rationale: تؤدي معنى الأولاد أو الأبناء بصيغة جماعية طبيعية، من غير تحديد جنسهم.
- source_word: τῆς ἀδελφῆς σου τῆς ἐκλεκτῆς
  choice: أختكِ المختارة
  rationale: يحافظ على ترتيب العلاقة والوصف، ويترجم ἐκλεκτή بمعنى من وقع عليها الاختيار دون إضافة تفسير لاهوتي.
theological_decisions:
- issue: هل «الأخت المختارة» امرأة بعينها أم جماعة كنسية بصياغة مجازية؟
  choice: الإبقاء على العبارة الحرفية «أختكِ المختارة»
  alternative: تفسيرها صراحةً بأنها كنيسة أخرى
  rationale: النص اليوناني يحتمل القراءة الشخصية والمجازية، فلا ينبغي حسم المقصود داخل المتن.
- issue: دلالة ἐκλεκτή
  choice: المختارة
  alternative: المنتخبة
  rationale: «المختارة» عربية واضحة وطبيعية وتحفظ الدلالة اللاهوتية المحتملة من غير تحميل اللفظ اصطلاحًا مذهبيًا خاصًا.
translation_notes:
  register: عربية فصحى حديثة موجزة وكريمة النبرة، مع الحفاظ على الغموض المقصود في هوية السيدة وأختها وأبنائهما.
