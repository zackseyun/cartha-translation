  text: Ἡμεῖς δὲ ὀφείλομεν εὐχαριστεῖν τῷ θεῷ πάντοτε περὶ ὑμῶν, ἀδελφοὶ ἠγαπημένοι ὑπὸ κυρίου, ὅτι εἵλατο ὑμᾶς ὁ θεὸς ⸀ἀπαρχὴν εἰς σωτηρίαν ἐν ἁγιασμῷ πνεύματος καὶ πίστει ἀληθείας,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/013.yaml
  text: But we ought always to give thanks to God for you[a], brothers beloved by the Lord, because God chose you as firstfruits for salvation through sanctification by the Spirit and faith in the truth[b],
translation:
  language: ar
  text: أَمَّا نَحْنُ، فَيَجِبُ عَلَيْنَا أَنْ نَشْكُرَ اللهَ دَائِمًا مِنْ أَجْلِكُمْ، أَيُّهَا الإِخْوَةُ[b] الَّذِينَ أَحَبَّهُمُ الرَّبُّ، لِأَنَّ اللهَ اخْتَارَكُمْ بَاكُورَةً[a] لِلْخَلَاصِ، بِتَقْدِيسِ الرُّوحِ وَالإِيمَانِ بِالْحَقِّ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'في بعض المخطوطات: «لأن الله اختاركم منذ البدء للخلاص». يتبع المتن قراءة «باكورةً» (ἀπαρχήν)، أما القراءة البديلة فهي «منذ البدء» (ἀπ’ ἀρχῆς).'
    reason: textual_variant
  - marker: b
    text: لفظ «الإخوة» يقابل جمع المذكر ἀδελφοί في اليونانية، وقد يشمل الخطاب جماعة المؤمنين كلها، رجالًا ونساءً.
    reason: cultural_note
lexical_decisions:
- source_word: Ἡμεῖς δὲ
  choice: أَمَّا نَحْنُ
  rationale: تنقل أداة المقابلة δέ مع توكيد الضمير الصريح Ἡμεῖς، وتلائم العربية الفصيحة الطبيعية في الانتقال من وصف الهالكين إلى جماعة المؤمنين.
- source_word: ὀφείλομεν
  choice: فَيَجِبُ عَلَيْنَا
  rationale: تعبّر عن الواجب الأخلاقي واللياقة الملزمة في صيغة الشكر، من غير مبالغة في معنى الإكراه.
- source_word: εὐχαριστεῖν τῷ θεῷ πάντοτε περὶ ὑμῶν
  choice: أَنْ نَشْكُرَ اللهَ دَائِمًا مِنْ أَجْلِكُمْ
  rationale: صياغة عربية واضحة تحفظ فعل الشكر، ومتعلقه بالله، ودوامه، وكون المخاطبين سببًا له.
- source_word: ἀδελφοὶ
  choice: أَيُّهَا الإِخْوَةُ
  rationale: تحفظ صيغة الجمع المذكر في اليونانية، مع بيان إمكان شمول الخطاب للجماعة المؤمنة كلها في الحاشية.
- source_word: ἠγαπημένοι ὑπὸ κυρίου
  choice: الْمَحْبُوبُونَ مِنَ الرَّبِّ
  rationale: تنقل اسم المفعول الدال على حالة المحبة الثابتة، وتحفظ كون الرب فاعل المحبة من خلال تركيب «من الرب».
- source_word: εἵλατο
  choice: اخْتَارَكُمْ
  rationale: المعنى المباشر للفعل المتوسط αἱρέομαι هنا هو الاختيار؛ ولا تضيف الصياغة نظرية لاهوتية تتجاوز تصريح النص.
- source_word: ἀπαρχὴν
  choice: بَاكُورَةً
  rationale: تتبع قراءة SBLGNT المطبوعة ἀπαρχήν وتحفظ صورتها الزراعية والدينية المألوفة، مع إثبات القراءة البديلة في الحاشية.
- source_word: εἰς σωτηρίαν
  choice: لِلْخَلَاصِ
  rationale: تنقل دلالة الغاية أو النتيجة في εἰς بصياغة عربية موجزة وواضحة.
- source_word: ἐν ἁγιασμῷ πνεύματος
  choice: بِتَقْدِيسِ الرُّوحِ
  rationale: الباء مناسبة لدلالة الوسيلة أو المجال في ἐν، و«تقديس» يحفظ الاسم المصدري. ويُفهم الروح هنا على أنه الروح القدس بحسب السياق الخلاصي البولسي.
- source_word: καὶ πίστει ἀληθείας
  choice: وَالإِيمَانِ بِالْحَقِّ
  rationale: تفهم إضافة ἀληθείας على أنها موضوعية؛ أي إن الحق هو موضوع الإيمان، وهو المعنى الأرجح والأوضح في السياق.
theological_decisions:
- issue: مرجع πνεύματος في عبارة ἐν ἁγιασμῷ πνεύματος
  choice: الروح القدس
  alternative: روح الإنسان
  rationale: ينسب السياق الخلاصي البولسي التقديس على الأرجح إلى روح الله. وتحفظ الترجمة لفظ «الروح» من دون إضافة «القدس» إلى المتن، فلا تخفي أن التركيب اليوناني نفسه يحتمل من حيث الصياغة وجهًا آخر.
- issue: دلالة εἵλατο ὑμᾶς ὁ θεὸς
  choice: الله اختاركم
  alternative: الله اصطفاكم أو اتخذكم لنفسه
  rationale: «اختاركم» هو المقابل المعجمي المباشر، ويثبت فعل الاختيار الإلهي كما ورد من غير إدخال تصور مذهبي تفصيلي عن الانتخاب.
- issue: قراءة ἀπαρχὴν مقابل ἀπ’ ἀρχῆς
  choice: باكورةً
  alternative: منذ البدء
  rationale: المتن يتبع نص SBLGNT المعطى، وهو ἀπαρχήν، مع صون القراءة النصية المشهورة الأخرى في الحاشية وعدم دمج القراءتين.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة، مع ضبط كامل للنص الرئيس. استُخدمت تراكيب كتابية مألوفة من غير تقليد صياغة تراثية غامضة. وُضعت علامتا الحاشية في ختام الآية لأن الحاشية [a] تتعلق بقراءة داخل جملة الاختيار، والحاشية [b] تشرح لفظ «الإخوة» الوارد قبلها.
