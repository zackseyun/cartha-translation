id: 2TH.2.15
reference: 2 Thessalonians 2:15
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἄρα οὖν, ἀδελφοί, στήκετε, καὶ κρατεῖτε τὰς παραδόσεις ἃς ἐδιδάχθητε εἴτε διὰ λόγου εἴτε δι’ ἐπιστολῆς ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/015.yaml
  text: So then[a], brothers, stand firm and hold fast to the traditions that you were taught, whether by word or by our letter.
translation:
  language: ar
  text: فإذًا، يا إخوة[a]، اثبتوا وتمسَّكوا بالتقاليد التي عُلِّمتموها، سواء بكلامٍ أم برسالةٍ منّا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أيها الإخوة والأخوات»؛ تقول اليونانية «إخوة»، لكن الخطاب يُرجَّح أنه موجَّه إلى الجماعة كلها.
    reason: بديل معجمي يوضّح شمول المخاطَبين المحتمل مع إبقاء صيغة الأصل في المتن.
lexical_decisions:
- source_word: ἄρα οὖν
  choice: فإذًا
  rationale: تنقل أداتا الاستنتاج معًا معنى استخلاص النتيجة مما سبق، بصياغة عربية موجزة وطبيعية.
- source_word: ἀδελφοί
  choice: يا إخوة
  rationale: يحافظ النداء على صيغة الجمع المذكر في اليونانية، مع بيان احتمال شمول الجماعة كلها في الحاشية.
- source_word: στήκετε
  choice: اثبتوا
  rationale: فعل أمر يدل على مواصلة الرسوخ وعدم التزعزع، و«اثبتوا» تعبير عربي واضح ومباشر.
- source_word: κρατεῖτε
  choice: تمسَّكوا
  rationale: ينقل معنى الاحتفاظ القوي والاستمرار في الالتزام، ويوافق قوة صيغة الأمر.
- source_word: τὰς παραδόσεις
  choice: بالتقاليد
  rationale: يحافظ على معنى ما سُلِّم أو نُقل إلى الآخرين، من غير اختزاله في «تعاليم» ولا تحميله مفاهيم مذهبية لاحقة.
- source_word: ἃς ἐδιδάχθητε
  choice: التي عُلِّمتموها
  rationale: يحافظ على المبني للمجهول وعلى كون المخاطَبين متلقّين للتعليم الرسولي.
- source_word: διὰ λόγου
  choice: بكلامٍ
  rationale: ينقل لفظ λόγος، ويفهم منه هنا الكلام المنطوق في مقابل الرسالة المكتوبة.
- source_word: δι’ ἐπιστολῆς ἡμῶν
  choice: برسالةٍ منّا
  rationale: صياغة عربية طبيعية تحفظ وسيلة النقل المكتوبة ونسبة الرسالة إلى المتكلمين، دون الجزم بأن المقصود رسالة بعينها.
theological_decisions:
- issue: ترجمة παράδοσις في سياق يُستشهد به في الجدل حول التقليد الرسولي
  choice: التقاليد
  alternative: التعاليم؛ الوصايا
  rationale: اللفظ اليوناني يشير إلى ما جرى تسليمه، ويشمل في الآية النقل الشفهي والكتابي. تحافظ «التقاليد» على هذا المعنى من غير أن تحسم خلافات مذهبية لاحقة بشأن نطاق التقليد أو سلطانه.
- issue: صيغة ἀδελφοί مع احتمال توجيه الخطاب إلى جماعة مختلطة
  choice: يا إخوة
  alternative: أيها الإخوة والأخوات
  rationale: يحافظ المتن على الصيغة المذكرة في الأصل، بينما توضّح الحاشية أن الاستعمال يُحتمل أن يشمل المؤمنات أيضًا.
- issue: هوية «الرسالة» في δι’ ἐπιστολῆς ἡμῶν
  choice: برسالةٍ منّا
  alternative: برسالتنا
  rationale: التنكير في العربية يصون عدم تعيين الرسالة في العبارة اليونانية، ويتجنب الإيحاء بأن النص يحسم أي رسالة مقصودة.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقّرة. استُخدم «اثبتوا وتمسّكوا» للموازنة بين قوتَي الأمرين، وأُبقي «التقاليد» لصون صورة ما جرى تسليمه شفهيًا وكتابيًا.
