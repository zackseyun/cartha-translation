  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ τότε ἀποκαλυφθήσεται ὁ ἄνομος, ὃν ὁ κύριος ⸀Ἰησοῦς ⸀ἀνελεῖ τῷ πνεύματι τοῦ στόματος αὐτοῦ καὶ καταργήσει τῇ ἐπιφανείᾳ τῆς παρουσίας αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/008.yaml
  text: And then the lawless one will be revealed[a], whom the Lord Jesus will slay with the breath of his mouth and bring to nothing by the appearance of his coming[b],
translation:
  language: ar
  text: وحينئذ سيُكشَف الخارج على الشريعة، الذي سيقتله الرب يسوع بنفخة فمه[a]، ويُبطله بظهور مجيئه[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بروح فمه». يمكن للكلمة اليونانية أن تعني «النفخة» أو «الروح»، و«النفخة» أنسب لهذا التركيب هنا.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «بتجلّي حضوره». «المجيء» هو المعنى المعتاد للكلمة اليونانية في هذا السياق، مع أن «الحضور» داخل في نطاق معناها.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκαλυφθήσεται
  choice: سيُكشَف
  rationale: يحفظ صيغة المستقبل المبني للمجهول ودلالة الظهور بعد الخفاء، من غير تعيين الفاعل.
- source_word: ὁ ἄνομος
  choice: الخارج على الشريعة
  rationale: ينقل الصفة المعرَّفة المستعملة استعمال الاسم، ويحافظ على عنصر مخالفة الشريعة في ἄνομος من غير إضافة لفظ «الرجل» غير الموجود في هذه الآية.
- source_word: ὁ κύριος Ἰησοῦς
  choice: الرب يسوع
  rationale: الصياغة العربية المألوفة والواضحة للقب κύριος والاسم الشخصي Ἰησοῦς.
- source_word: ἀνελεῖ
  choice: سيقتله
  rationale: الفعل في هذا السياق يدل على القتل، وهذه العبارة صريحة وطبيعية في العربية المعاصرة.
- source_word: τῷ πνεύματι τοῦ στόματος αὐτοῦ
  choice: بنفخة فمه
  rationale: «النفخة» هي الأنسب لهذا التركيب التصويري، مع إبقاء معنى «الروح» الممكن معجميًا في الحاشية.
- source_word: καταργήσει
  choice: يُبطله
  rationale: يفيد جعل الخصم عديم الفاعلية وإنهاء أثره، من غير حصر المعنى في الإبادة المادية.
- source_word: τῇ ἐπιφανείᾳ
  choice: بظهور
  rationale: ينقل معنى التجلي أو الظهور المرئي بصياغة عربية مباشرة.
- source_word: τῆς παρουσίας αὐτοῦ
  choice: مجيئه
  rationale: في السياق الأخروي تدل παρουσία عادةً على المجيء أو الوصول، مع إثبات معنى «الحضور» الممكن في الحاشية.
theological_decisions:
- issue: وصف الخصم الأخروي وهويته
  choice: الخارج على الشريعة
  alternative: الأثيم؛ الرجل المتعدي على الشريعة
  rationale: تلتزم الصياغة بالصفة الاسمية ὁ ἄνομος في هذه الآية، فلا تستورد لفظ «الرجل» من السياق القريب ولا تعيّن هوية هذه الشخصية أبعد مما يقوله النص.
- issue: وسيلة قضاء الرب يسوع على الخصم
  choice: بنفخة فمه
  alternative: بروح فمه
  rationale: «النفخة» تلائم هذا التركيب وصورة القضاء النبوي، لكن πνεῦμα يحتمل أيضًا «الروح»، ولذلك حُفظ البديل في الحاشية.
- issue: دلالة παρουσία الأخروية
  choice: مجيئه
  alternative: حضوره
  rationale: «المجيء» هو المعنى السياقي الأرجح هنا، من غير إنكار أن اللفظة قد تدل معجميًا على الحضور.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ التوازي بين فعلي القضاء «سيقتله» و«يُبطله»، كما حُفظ تركيب «ظهور مجيئه» لإبراز الاسمين اليونانيين من غير دمجهما في تعبير تفسيري واحد.
