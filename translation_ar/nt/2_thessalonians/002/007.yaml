  to: فإن سرَّ التعدّي على الشريعة يعمل بالفعل؛ غير أن الذي يحجز الآن[a] سيظلّ يحجز إلى أن يزول من الوسط[b].
  rationale: التعديل الوحيد هو «يعمل بالفعل» بدل «يعمل منذ الآن» لإبراز أن سرّ التعدّي ناشط مسبقًا وقت الكلام، مع استمرار المعنى. تُبقي الترجمة على البنية الإهليلجية نسبيًا، وعلى عدم تعيين الحاجز أو كيفية زواله، وتبقى الحواشي مرتبطة بالمواضع الصحيحة.
