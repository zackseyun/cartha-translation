  text: τὸ γὰρ μυστήριον ἤδη ἐνεργεῖται τῆς ἀνομίας· μόνον ὁ κατέχων ἄρτι ἕως ἐκ μέσου γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/007.yaml
  text: For the mystery of lawlessness is already at work[b][a]; only the one who now restrains will do so until he is out of the way.
translation:
  language: ar
  text: فإن سرَّ التعدّي على الشريعة يعمل بالفعل؛ غير أن الذي يحجز الآن[a] سيظلّ يحجز إلى أن يزول من الوسط[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الذي يُمسك الآن»؛ لا يحدّد النص اليوناني هوية هذا الذي يحجز.
    reason: alternative_reading
  - marker: b
    text: أو «إلى أن يُزال» أو «إلى أن يُؤخذ من الوسط». لا يصرّح النص اليوناني بكيفية حدوث ذلك.
    reason: lexical_alternative
lexical_decisions:
- source_word: μυστήριον
  choice: سرّ
  rationale: ينقل معنى حقيقة خفيّة أو مستترة، لا مجرد لغز، وهو استعمال راسخ ومفهوم في العربية الكتابية الحديثة.
- source_word: ἐνεργεῖται
  choice: يعمل منذ الآن
  rationale: يعبّر بوضوح عن نشاط جارٍ قد بدأ بالفعل، مع الحفاظ على دلالة الحال والاستمرار.
- source_word: ἀνομίας
  choice: التعدّي على الشريعة
  rationale: يوضح معنى رفض الشريعة أو انتهاكها، ويحافظ على الصلة الدلالية بالقانون الإلهي دون اختزاله في الشر عمومًا.
- source_word: μόνον
  choice: غير أن
  rationale: تؤدي وظيفة التقييد والانتقال التي تحملها الكلمة هنا، بصورة طبيعية في السياق العربي.
- source_word: ὁ κατέχων
  choice: الذي يحجز
  rationale: يحافظ على صيغة اسم الفاعل وعلى معنى المنع أو الإمساك، من غير أن يعيّن هوية القائم بالحجز.
- source_word: ἄρτι
  choice: الآن
  rationale: ينقل الإشارة المباشرة إلى الزمن الحاضر.
- source_word: ἕως ἐκ μέσου γένηται
  choice: إلى أن يزول من الوسط
  rationale: صياغة عربية طبيعية تنقل بلوغ حالة الخروج من الوسط من غير التصريح بفاعل يزيله؛ وتُذكر البدائل الأكثر صراحة في الحاشية.
theological_decisions:
- issue: هوية ὁ κατέχων، أي الذي يحجز
  choice: الإبقاء على التعبير العام «الذي يحجز الآن» دون تعيين هويته
  alternative: تعيينه بالدولة الرومانية، أو الحكم البشري، أو الروح القدس، أو كائن ملائكي، أو بولس والكرازة الرسولية
  rationale: النص اليوناني يذكر شخصًا قائمًا بالحجز لكنه لا يحدّد هويته في هذه الآية، لذلك ينبغي إبقاء المسألة مفتوحة.
- issue: كيفية زوال الحاجز في ἕως ἐκ μέσου γένηται
  choice: «إلى أن يزول من الوسط» بصياغة لا تحدد عامل الإزالة
  alternative: «إلى أن يُزال» أو «إلى أن يُؤخذ من الوسط»
  rationale: العبارة اليونانية تصف صيرورته خارج الوسط، ولا تصرّح بمن يُحدث ذلك؛ فالصياغة المختارة تحفظ هذا الغموض.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقّرة. استُخدمت «سيظلّ يحجز» لاستكمال التركيب اليوناني الموجز استكمالًا طبيعيًا، مع إبقاء هوية الحاجز وكيفية زواله غير محسومتين.
