  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: εἰς τὸ μὴ ταχέως σαλευθῆναι ὑμᾶς ἀπὸ τοῦ νοὸς ⸀μηδὲ θροεῖσθαι μήτε διὰ πνεύματος μήτε διὰ λόγου μήτε δι’ ἐπιστολῆς ὡς δι’ ἡμῶν, ὡς ὅτι ἐνέστηκεν ἡ ἡμέρα τοῦ ⸀κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/002.yaml
  text: that you not be quickly shaken from your mind or alarmed[a], either by a spirit or by a message or by a letter as if from us[b], to the effect that the day of the Lord has come.
translation:
  language: ar
  text: ألا تتزعزعوا سريعًا عن اتزانكم الذهني ولا ترتاعوا، سواء أكان ذلك بروحٍ[a] أم بكلامٍ أم برسالةٍ، كما لو كان صادرًا عنا، ومفاده أن يوم الرب قد حلَّ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «قول روحي» أو «وحي نبوي».
    reason: lexical_alternative
  - marker: b
    text: أو «حاضر الآن». يمكن لصيغة التام اليونانية أن تفيد أن الادعاء هو أن يوم الرب قد أتى وصار حاضرًا بالفعل.
    reason: alternative_reading
lexical_decisions:
- source_word: ταχέως
  choice: سريعًا
  rationale: ينقل معنى السرعة في التزعزع، لا معنى قرب الحدث زمنيًّا.
- source_word: σαλευθῆναι
  choice: تتزعزعوا
  rationale: يحافظ على صورة الاهتزاز والاضطراب التي يحملها الفعل المبني للمجهول، وهو تعبير عربي طبيعي.
- source_word: ἀπὸ τοῦ νοὸς
  choice: عن اتزان فكركم
  rationale: العبارة اليونانية اصطلاحية وتشير إلى الابتعاد عن حالة فكرية مستقرة؛ وهذه الصياغة أوضح من النقل الحرفي «عن ذهنكم» من غير أن تحصر المعنى في الانفعال وحده.
- source_word: θροεῖσθαι
  choice: ترتاعوا
  rationale: ينقل شدة الاضطراب والهلع التي يفيدها الفعل، مع بقاء الأسلوب فصيحًا مفهومًا.
- source_word: πνεύματος
  choice: روحٍ
  rationale: يحافظ على اللفظ اليوناني المجرّد من أداة التعريف وعلى غموضه بين روحٍ مزعومة ووحي أو قول روحي؛ ويُشرح الاحتمال الأخير في الحاشية.
- source_word: λόγου
  choice: كلام
  rationale: يدل في هذا السياق على قول أو بلاغ شفهي في مقابل الرسالة المكتوبة، مع تجنب التفسير الزائد.
- source_word: ἐπιστολῆς
  choice: رسالة
  rationale: المقابل العربي الطبيعي للمكاتبة المكتوبة.
- source_word: ὡς δι’ ἡμῶν
  choice: كأنها منا
  rationale: يوضح أن الرسالة تُنسب إلى بولس ورفيقيه، ويحافظ على كون هذه النسبة ادعاءً لا حقيقة مقررة.
- source_word: ὡς ὅτι
  choice: ومفادها أن
  rationale: ينقل معنى أن الوسائل المذكورة تحمل هذا الادعاء أو تؤديه، بدل تكرار أداة تشبيه مبهمة في العربية.
- source_word: ἐνέστηκεν
  choice: قد حلَّ
  rationale: يعبر عن وصول اليوم وكونه واقعًا حاضرًا بحسب الادعاء؛ ويُحفظ معنى «حاضر الآن» في الحاشية لما له من دلالة تفسيرية.
- source_word: ἡμέρα τοῦ κυρίου
  choice: يوم الرب
  rationale: هو التعبير الأخروي المعروف في الكتاب المقدس، ولا يدل هنا على يوم عبادة أسبوعي.
theological_decisions:
- issue: دلالة ἐνέστηκεν في الادعاء الأخروي
  choice: قد حلَّ
  alternative: حاضر الآن / قد أتى وصار حاضرًا
  rationale: صيغة التام اليونانية تعرض الوصول بوصفه مؤديًا إلى واقع حاضر. «قد حلَّ» عربية طبيعية، فيما تحفظ الحاشية احتمال إبراز الحضور الراهن صراحة.
- issue: دلالة πνεύματος ضمن وسائل الادعاء الثلاث
  choice: روحٍ
  alternative: قول روحي / وحي نبوي
  rationale: يبقي النص على الغموض الحقيقي في الاسم اليوناني غير المعرّف، فلا يجزم بأنه الروح القدس ولا يحوّله في المتن إلى تفسير محدد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «اتزان فكركم» لإظهار المعنى الاصطلاحي لعبارة ἀπὸ τοῦ νοὸς، مع إبقاء استعارة التزعزع. وُضعت علامتا الحاشية عند «روح» و«قد حلَّ» لأنهما موضعا البديلين المعجمي والتفسيري مباشرة.
