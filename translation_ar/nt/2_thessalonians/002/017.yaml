  text: لِيُشَجِّعْ قلوبكم[a] ويُثَبِّتْها[b] في كل عمل صالح وقول صالح.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لِيُعَزِّ قلوبكم» أو «لِيَحُثَّكم»؛ فالفعل اليوناني قد يدل أيضًا على التعزية أو الحث.'
