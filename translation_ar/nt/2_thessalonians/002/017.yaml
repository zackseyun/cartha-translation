lexical_decisions:
- source_word: παρακαλέσαι
  choice: لِيُشَجِّعْ
  rationale: ينقل المعنى الواسع للفعل في سياق الدعاء، من غير حصره في المواساة العاطفية أو الحث الأخلاقي وحده، كما يحافظ على صلته بالتشجيع الأبدي المذكور في الآية السابقة.
- source_word: καρδίας
  choice: قلوبكم
  rationale: يحافظ على الصورة الكتابية للقلب بوصفه باطن الإنسان، بدل اختزالها في العواطف أو الذهن.
- source_word: στηρίξαι
  choice: ويُثَبِّتْها
  rationale: يفيد جعل القلوب راسخة ثابتة، ويأتي طبيعيًا في العربية مع الضمير العائد إلى القلوب.
- source_word: ἐν παντὶ
  choice: في كل
  rationale: يحافظ على دلالة المجال الذي يحدث فيه التثبيت.
- source_word: ἔργῳ
  choice: عمل
  rationale: مقابل مباشر وطبيعي يدل على الفعل أو الصنيع، ويقابل «قول» في العبارة.
- source_word: λόγῳ
  choice: قول
  rationale: السياق يرجح الكلام أو القول في موازاة العمل، و«قول» أوضح من «كلمة» في العربية هنا.
- source_word: ἀγαθῷ
  choice: صالح
  rationale: ينقل المعنى الأخلاقي الواسع، وقد كُررت الصفة عربيًا لإظهار تعلقها بالعمل والقول كليهما.
- source_word: ὑμῶν
  choice: ـكم
  rationale: ضمير جمع المخاطبين مضاف إلى «قلوب».
- source_word: καὶ
  choice: و
  rationale: تربط فعلي الدعاء، وكذلك العمل والقول، ربطًا مباشرًا.
theological_decisions:
- issue: هل تُفسَّر καρδία بمصطلح نفسي حديث؟
  choice: قلوبكم
  alternative: دواخلكم أو أذهانكم
  rationale: تُبقي الترجمة الاستعارة الكتابية وما فيها من شمول لباطن الإنسان، ولا تحصرها في العقل أو العاطفة.
- issue: مدى رسمية ترجمة στηρίξαι
  choice: يُثَبِّتْها
  alternative: يقوّيها أو يرسّخها
  rationale: «يثبتها» يحفظ معنى جعل القلوب راسخة، مع بقاء البدائل الدلالية مذكورة في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت صيغة الدعاء «لِيُشَجِّعْ... ويُثَبِّتْ» لأن الآية تتمة لدعاء الآية السابقة. كُررت «صالح» لتجنب توهم تعلقها بالقول وحده، مع الحفاظ على الاقتران الموجز بين العمل والقول.
