    rationale: «التعدّي» يوحي عادةً بمخالفة أو تجاوز معيّن، فيما ἀνομία تصف الإثم أو اللاشرعية بوصفها سمة مميزة. «إنسان الإثم» أوسع وأقرب إلى دلالة المصدر، مع بقاء القراءة «الخطيئة» للحاشية النصية.
  - severity: low
    issue: وُضعت علامتا الحاشيتين في نهاية الآية بدلًا من موضعي «التمرّد» و«إنسان الإثم».
    rationale: تخص الحاشية (أ) ἀποστασία، وتخص (ب) القراءة البديلة في ἀνομίας؛ وإلحاق كل علامة بلفظها يزيل الالتباس ويحسن قابلية التدقيق.
