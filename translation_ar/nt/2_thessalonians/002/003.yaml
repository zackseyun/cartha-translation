source:
  edition: SBLGNT
  text: μή τις ὑμᾶς ἐξαπατήσῃ κατὰ μηδένα τρόπον· ὅτι ἐὰν μὴ ἔλθῃ ἡ ἀποστασία πρῶτον καὶ ἀποκαλυφθῇ ὁ ἄνθρωπος τῆς ⸀ἀνομίας, ὁ υἱὸς τῆς ἀπωλείας,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/003.yaml
  text: Let no one deceive you in any way[a], because that day will not come unless the rebellion comes first and the man of lawlessness is revealed[b], the son of destruction.
translation:
  language: ar
  text: لا يخدعنَّكم أحدٌ بأيِّ وسيلة، لأن ذلك اليوم لن يأتي ما لم يأتِ التمرُّد[a] أولًا، ويُكشَف إنسانُ الإثم[b]، ابنُ الهلاك.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أيضًا ترجمة «التمرُّد» بـ«الارتداد» أو «السقوط عن الإيمان». وقد يدل اللفظ اليوناني على تمرّد حاسم، وغالبًا ما يُفهم على أنه ارتداد ديني.
    reason: alternative_reading
  - marker: b
    text: 'تقرأ بعض المخطوطات: «إنسان الخطيئة» بدلًا من «إنسان الإثم».'
    reason: textual_variant
lexical_decisions:
- source_word: ἐξαπατήσῃ
  choice: يخدعنَّكم
  rationale: ينقل معنى الخداع أو التضليل بعبارة عربية طبيعية، مع نون التوكيد التي تلائم قوة النهي.
- source_word: κατὰ μηδένα τρόπον
  choice: بأيِّ وسيلة
  rationale: تؤدي معنى النهي عن قبول الخداع مهما كانت طريقته، بصياغة عربية واضحة.
- source_word: ὅτι
  choice: لأن
  rationale: تُظهر أن ما يلي تعليل للتحذير السابق.
- source_word: ἐὰν μὴ ἔλθῃ
  choice: لن يأتي ما لم يأتِ
  rationale: توضح الشرط السابق الضروري، مع إظهار «ذلك اليوم» المفهوم من سياق الآية السابقة.
- source_word: ἀποστασία
  choice: التمرُّد
  rationale: يحفظ المعنى الواسع للثورة أو العصيان الحاسم، من غير حصره سلفًا في الارتداد الديني.
- source_word: πρῶτον
  choice: أولًا
  rationale: ينقل بوضوح دلالة الترتيب الزمني.
- source_word: ἀποκαλυφθῇ
  choice: يُكشَف
  rationale: يحفظ صيغة المبني للمجهول ودلالة ظهور هذه الشخصية وانكشافها.
- source_word: ὁ ἄνθρωπος τῆς ἀνομίας
  choice: إنسانُ التعدّي
  rationale: «إنسان» يقابل الاسم المفرد المذكر من غير إيحاء بأن المقصود البشرية عمومًا، و«التعدّي» يعبّر عن ἀνομία بوصفها انتهاكًا للناموس ورفضًا له.
- source_word: ὁ υἱὸς τῆς ἀπωλείας
  choice: ابنُ الهلاك
  rationale: يحفظ التركيب السامي في اليونانية، بما يترك دلالته على الاتصاف بالهلاك أو المصير إليه من غير تفكيك تفسيري داخل المتن.
theological_decisions:
- issue: إظهار فاعل «لن يأتي» المحذوف في اليونانية
  choice: إضافة «ذلك اليوم» اعتمادًا على السياق المباشر في الآية السابقة
  alternative: 'إبقاء العبارة ناقصة: «لأنه ما لم يأتِ التمرّد...»'
  rationale: المقصود نحويًا مفهوم من «يوم الرب» في 2:2، وإظهاره يمنع الغموض في العربية من غير إضافة تفسير يتجاوز السياق.
- issue: دلالة ἀποστασία
  choice: التمرُّد
  alternative: الارتداد أو الانشقاق
  rationale: اللفظ قد يدل على ثورة أو عصيان، وقد يُفهم بوصفه ارتدادًا دينيًا. اختير اللفظ الأوسع في المتن، وحُفظ البديل في الحاشية تجنبًا لحسم الخلاف الأخروي.
- issue: القراءة النصية في τῆς ἀνομίας
  choice: 'اتباع SBLGNT: «التعدّي»'
  alternative: «الخطيئة» وفق قراءة مخطوطية أخرى
  rationale: المصدر المعطى يقرأ ἀνομίας، لذلك يتبعه المتن، مع توثيق القراءة المعروفة ἁμαρτίας في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. حافظت الصياغة على تتابع الحدثين وعلى المبني للمجهول، وأبقت التعبير السامي «ابن الهلاك» من غير توسيع تفسيري. وُضعت علامتا الحاشيتين بعد الجملة المتصلة بهما لضمان ظهورهما في المتن.
