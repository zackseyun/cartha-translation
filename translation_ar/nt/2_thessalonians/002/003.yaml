revisions:
- from: لا يخدعنَّكم أحدٌ بأيِّ وسيلة، لأن ذلك اليوم لن يأتي ما لم يأتِ التمرُّد أولًا، ويُكشَف إنسانُ التعدّي، ابنُ الهلاك.[a][b]
  to: لا يخدعنَّكم أحدٌ بأيِّ وسيلة، لأن ذلك اليوم لن يأتي ما لم يأتِ التمرُّد[a] أولًا، ويُكشَف إنسانُ الإثم[b]، ابنُ الهلاك.
  rationale: حُسّنت مقابلة ἀνομία إلى «الإثم» لتؤدي معناها الأوسع في العربية الفصحى الحديثة، من غير فرض تفسير محدد للشخصية أو لطبيعة تمرّدها. ونُقلت علامتا الحاشيتين إلى اللفظين المعنيين مباشرةً. أما إظهار «ذلك اليوم» فمشروع لأنه محذوف في اليونانية ومفهوم من السياق المباشر السابق.
