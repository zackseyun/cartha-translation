  source_fidelity: 'النص العربي يحافظ على عناصر اليونانية الأساسية: التوكيد في «نفسه»، والانتقال الخطابي في «وأمّا»، واللقبين «ربّنا» و«الله أبونا»، وصيغتي المحبة والعطاء في المفرد، و«تشجيعًا أبديًا» و«رجاءً صالحًا» و«بالنعمة». كما يحافظ الموصول المفرد «الذي» على البنية اليونانية اللافتة دون حسم مرجعه لاهوتيًا.'
