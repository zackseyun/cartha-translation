  terminology: «ربّنا يسوع المسيح» و«الله أبونا» و«النعمة» مصطلحات عربية كتابية راسخة. «تشجيع» اختيار صالح لـ παράκλησις في السياق، وتحفظ الحاشية البدائل المعجمية المهمة. «رجاء صالح» ترجمة مباشرة ومألوفة لـ ἐλπίδα ἀγαθήν.
