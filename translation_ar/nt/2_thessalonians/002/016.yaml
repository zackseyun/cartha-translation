id: 2TH.2.16
reference: 2 Thessalonians 2:16
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Αὐτὸς δὲ ὁ κύριος ἡμῶν Ἰησοῦς Χριστὸς καὶ ⸀θεὸς ⸀ὁ πατὴρ ἡμῶν, ὁ ἀγαπήσας ἡμᾶς καὶ δοὺς παράκλησιν αἰωνίαν καὶ ἐλπίδα ἀγαθὴν ἐν χάριτι,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/016.yaml
  text: May our Lord Jesus the Messiah himself[a], and God our Father, who loved us and gave us eternal encouragement and good hope by grace,
translation:
  language: ar
  text: وأمّا ربُّنا يسوعُ المسيحُ نفسه، واللهُ أبونا، الذي أحبَّنا ومنحنا تشجيعًا أبديًّا[a] ورجاءً صالحًا بالنعمة،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «عزاءً» أو «تعزيةً».
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτὸς
  choice: نفسه
  rationale: يحفظ الاستعمال التوكيدي للضمير، ويبرز أن الرب يسوع المسيح ذاته هو المذكور في الدعاء.
- source_word: δὲ
  choice: وأمّا
  rationale: ينقل الانتقال الخطابي اللطيف إلى الدعاء من غير جعله تضادًّا حادًّا؛ وتكتمل بنية «أمّا» مع فعل الدعاء في العدد التالي.
- source_word: κύριος
  choice: ربُّنا
  rationale: المقابل العربي المألوف والملائم للقب المسيحاني κύριος، مع حفظ ضمير المتكلمين.
- source_word: Ἰησοῦς Χριστὸς
  choice: يسوعُ المسيحُ
  rationale: يُترجم Χριστός بوصفه لقبًا، و«المسيح» هو المقابل العربي الطبيعي الواضح.
- source_word: θεὸς ὁ πατὴρ ἡμῶν
  choice: اللهُ أبونا
  rationale: يحفظ الاسمين في تركيب عربي مباشر من غير إضافة تفسيرية.
- source_word: ὁ ἀγαπήσας
  choice: الذي أحبَّنا
  rationale: تؤدي الجملة الموصولة معنى اسم الفاعل اليوناني الماضي أداءً عربيًّا طبيعيًّا، مع إبقاء صيغة المفرد كما في المصدر.
- source_word: δοὺς
  choice: ومنحنا
  rationale: ينقل فعل العطاء بصياغة عربية طبيعية تلائم العطايا المعنوية، ويحفظ اقترانه بالفعل السابق.
- source_word: παράκλησιν
  choice: تشجيعًا
  rationale: يلائم سياق تثبيت القلوب في العدد التالي، مع إثبات احتمالي العزاء والتعزية في الحاشية.
- source_word: αἰωνίαν
  choice: أبديًّا
  rationale: يحفظ دلالة الدوام في αἰώνιος بصياغة عربية مألوفة.
- source_word: ἐλπίδα ἀγαθὴν
  choice: رجاءً صالحًا
  rationale: ترجمة مباشرة تحفظ وصف الرجاء بأنه صالح من غير توسيع تفسيري.
- source_word: ἐν χάριτι
  choice: بالنعمة
  rationale: تنقل الاستعمال الوسيلي أو السببي المحتمل لـἐν بإيجاز طبيعي.
theological_decisions:
- issue: 'إسناد الصفتين المفردتين «الذي أحبنا ومنحنا» بعد الاسمين المنسقين: الرب يسوع المسيح والله الآب'
  choice: الإبقاء على الموصول المفرد «الذي» من غير توسيع يحدد مرجعه صراحةً
  alternative: استعمال المثنى «اللذان» لإسناد المحبة والعطاء صراحةً إلى كليهما، أو إعادة الصياغة لقصرهما صراحةً على الله الآب
  rationale: يأتي المصدر اليوناني باسمين منسقين تتبعهما صيغتان مفردتان. يحفظ الموصول المفرد الظاهرة النحوية والتوتر اللاهوتي، ولا يفرض حسمًا يتجاوز النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظت الجملة بوصفها بداية دعاء يكتمل فعله في العدد 17، ولذلك انتهت بفاصلة.
