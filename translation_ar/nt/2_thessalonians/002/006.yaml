  text: And now you know what is restraining him[b][a], so that he may be revealed in his own time.
translation:
  language: ar
  text: والآن تعرفون ما يحجزه[a]، لكي يُعلَن هو في وقته هو[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ما يمسكه أو يمنعه». يستعمل النص اليوناني تعبيرًا محايدًا، ولا يحدّد هنا الجهة التي تحجزه.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «في وقته المعيَّن». يمكن أن تدل العبارة اليونانية على الوقت الملائم أو المحدَّد.'
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ κατέχον
  choice: ما يحجزه
  rationale: يحافظ اسم الموصول «ما» على الصيغة المحايدة في اليونانية، ولا يعيّن الجهة التي تمارس الحجز. وأُبرز المفعول بضمير الغائب وفق سياق الشخص المزمع أن يُكشَف عنه.
- source_word: οἴδατε
  choice: أنتم تعرفون
  rationale: ترجمة مباشرة للفعل ذي المعنى الحاضر، مع إظهار ضمير الجمع للتوكيد والوضوح في العربية.
- source_word: εἰς τὸ ἀποκαλυφθῆναι αὐτόν
  choice: لكي يُكشَف عنه
  rationale: تحافظ «لكي» على دلالة الغاية، وتحافظ صيغة المبني للمجهول على كون هذا الشخص موضوع الكشف من غير تعيين من يكشف عنه.
- source_word: ἐν τῷ ἑαυτοῦ καιρῷ
  choice: في وقته هو
  rationale: تنقل العبارة معنى الوقت الخاص به، ويؤدي ضمير الفصل «هو» وظيفة التوكيد من غير إضافة صريحة لفكرة التعيين الإلهي.
- source_word: νῦν
  choice: الآن
  rationale: مقابل زمني مباشر وواضح، وينسجم طبيعيًا مع سياق الخطاب.
theological_decisions:
- issue: هوية الجهة الحاجزة
  choice: الإبقاء على التعبير المحايد «ما يحجزه» من غير تحديد هوية الحاجز
  alternative: الحكم الروماني، أو الروح القدس، أو قوة ملائكية، أو قضاء الله وعنايته
  rationale: يستعمل النص تعبيرًا محايدًا ولا يعيّن الجهة الحاجزة، ولذلك لا تحسم الترجمة مسألة تفسيرية طال الخلاف فيها.
- issue: دلالة καιρός في السياق الأخروي
  choice: في وقته هو
  alternative: في وقته المعيَّن، أو في الوقت الملائم له
  rationale: قد يدل اللفظ على وقت ملائم أو معيَّن، لكن الصياغة المختارة تحفظ الإيجاز والغموض النسبي في الأصل ولا تضيف جهة التعيين.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «ما» للمحافظة على حياد التعبير اليوناني، و«في وقته هو» لنقل التوكيد من دون توسيع تفسيري.
