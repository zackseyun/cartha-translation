lexical_decisions:
- source_word: οὗ
  choice: الذي يكون مجيئه
  rationale: ضمير موصول في حالة المضاف إليه يعود إلى «إنسان الإثم» في الآية السابقة؛ وهذه الصياغة تحفظ الصلة والملكية بصورة طبيعية في العربية.
- source_word: παρουσία
  choice: مجيئه
  rationale: يدل اللفظ في هذا السياق الأخروي على المجيء أو الوصول، لا على مجرد الحضور الساكن.
- source_word: κατ’ ἐνέργειαν
  choice: وفقًا لعمل
  rationale: تنقل العبارة معنى الموافقة في الكيفية أو الارتباط بالنشاط المؤثر، مع تجنب تعبير اصطلاحي ثقيل.
- source_word: τοῦ Σατανᾶ
  choice: الشيطان
  rationale: هو الاسم المألوف في العربية الكتابية، وحالة الإضافة تربط العمل به أو تجعله صادرًا عنه.
- source_word: ἐν πάσῃ δυνάμει
  choice: بكل قوة
  rationale: تحفظ معنى القوة من غير حصره مسبقًا في المعجزات، وتفيد المصاحبة أو الوسيلة.
- source_word: σημείοις
  choice: آيات
  rationale: مقابل عربي راسخ للأعمال الدالة أو العلامات الخارقة في سياق العهد الجديد.
- source_word: τέρασιν
  choice: عجائب
  rationale: ينقل معنى الظواهر المثيرة للدهشة ويحافظ على الاقتران المألوف بين الآيات والعجائب.
- source_word: ψεύδους
  choice: الكذب
  rationale: الإضافة الحرفية تحفظ احتمال اتصاف العجائب، أو السلسلة كلها، بالكذب والخداع، من غير الجزم بأنها حيل مزيفة محضة أو قوى خارقة حقيقية.
theological_decisions:
- issue: طبيعة القوة والآيات والعجائب الشيطانية
  choice: الإبقاء على وصفها بارتباطها بالكذب من غير تحديد ماهيتها الميتافيزيقية
  alternative: ترجمتها على أنها خدع زائفة محضة، أو الجزم بأنها معجزات شيطانية حقيقية
  rationale: النص اليوناني يربط مجيء الأثيم بعمل الشيطان ويذكر القوة والآيات والعجائب مع إضافة «الكذب»، لكنه لا يحسم هل الظواهر مصطنعة كليًا أم خارقة ومستعملة للخداع.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حوفظ على تركيب الآية الموصول لأنها تتمة مباشرة للآية السابقة، واستُعملت «عجائب الكذب» للمحافظة على الإضافة اليونانية وعلى التوتر الدلالي دون تفسير مذهبي زائد.
