translation:
  language: ar
  text: إلى هذا دعاكم عن طريق بشارتنا، لكي تنالوا مجد ربنا يسوع المسيح.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمة «لكي تنالوا مجد ربنا يسوع المسيح» هكذا: «لكي تحرزوا مجد ربنا يسوع المسيح» أو «لكي تشتركوا في مجد ربنا يسوع المسيح».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ὃ
  choice: إلى هذا
  rationale: يشير تركيب حرف الجر مع ضمير الوصل إلى ما سبق من الخلاص والتقديس، مع إبقاء مرجع الإشارة واسعًا كما في اليونانية.
- source_word: ἐκάλεσεν ὑμᾶς
  choice: دعاكم
  rationale: يحافظ على الدلالة البولسية للدعوة الإلهية من غير تقييدها بتفسير مذهبي، والفاعل المفهوم من السياق هو الله.
- source_word: διὰ τοῦ εὐαγγελίου ἡμῶν
  choice: بواسطة بشارتنا
  rationale: تفيد διά مع المضاف إليه الوسيلة؛ و«بشارتنا» تعني البشارة التي أعلنها الرسل، لا بشارة مختلفة تخصهم.
- source_word: εἰς περιποίησιν δόξης
  choice: لكي تنالوا مجد
  rationale: يعبّر هذا التركيب الطبيعي عن الغاية وعن معنى الاقتناء أو الحصول الكامن في περιποίησις، مع إبقاء احتمال المشاركة أو التملك مذكورًا في الحاشية.
- source_word: τοῦ κυρίου ἡμῶν
  choice: ربنا
  rationale: ينقل لقب κύριος بصيغته العربية الكتابية الواضحة ويحافظ على دلالته اللاهوتية.
- source_word: Ἰησοῦ Χριστοῦ
  choice: يسوع المسيح
  rationale: «المسيح» ترجمة عربية راسخة للقب Χριστός، وهي تحمل معنى الممسوح المنتظر ولا تحتاج في العربية إلى تحويله إلى اسم آخر.
theological_decisions:
- issue: طبيعة الدعوة الإلهية
  choice: دعاكم
  alternative: استدعاكم دعوة فعّالة / دعاكم على سبيل الدعوة المجردة
  rationale: النص يثبت أن الله دعاهم بواسطة البشارة، لكنه لا يفصّل هنا كيفية فاعلية هذه الدعوة؛ لذلك تُحفظ العبارة من دون حسم مذهبي زائد.
- issue: دلالة περιποίησις مع «المجد»
  choice: لكي تنالوا مجد ربنا
  alternative: لكي تقتنوا مجد ربنا / لكي تشتركوا في مجد ربنا
  rationale: «تنالوا» عربية طبيعية تحتمل بلوغ المجد والحصول عليه، من غير أن تحسم وحدها هل المقصود امتلاكه أم المشاركة فيه.
- issue: دلالة Χριστός
  choice: المسيح
  alternative: الممسوح
  rationale: «المسيح» هو اللقب العربي المألوف والدقيق لـΧριστός ويحفظ هويته اللقبية في هذا السياق.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. استُخدمت «بواسطة» لإظهار معنى الوسيلة في διά، و«بشارتنا» محافظةً على إيجاز التعبير الرسولي. وُضع رمز الحاشية بعد الجملة التي تتناولها.
