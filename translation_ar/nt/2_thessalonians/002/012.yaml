translation:
  language: ar
  text: لكي يُحكَم على جميع الذين لم يؤمنوا بالحق، بل رضوا بالإثم[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لكي يُدان جميع الذين...». قد يدل الفعل اليوناني في هذا السياق على حكم بالإدانة، لكن معناه الحرفي الأوسع هو «يُحكَم على».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: لكي
  rationale: تربط الجملة بما قبلها وتحتمل دلالة الغاية أو النتيجة بحسب السياق، من غير حسم زائد.
- source_word: κριθῶσιν
  choice: يُحكَم على
  rationale: يحافظ على المعنى القضائي العام للفعل κρίνω، مع أن السياق يوحي بحكم سلبي، ولا يصرّح في المتن بمعنى الإدانة الأقوى.
- source_word: πάντες
  choice: جميع
  rationale: تنقل شمول اللفظة اليونانية بوضوح، وتنسجم طبيعيًا مع جملة الموصول التالية.
- source_word: οἱ μὴ πιστεύσαντες
  choice: الذين لم يؤمنوا
  rationale: تنقل اسم الفاعل اليوناني المستعمل استعمالًا اسميًا، وتحافظ على دلالة عدم الإيمان دون تحويلها إلى مجرد عدم المعرفة.
- source_word: τῇ ἀληθείᾳ
  choice: بالحق
  rationale: الباء تلائم تعدية «آمن» في العربية، والتعريف يحفظ الإشارة إلى الحق المحدد في السياق، أي حق البشارة.
- source_word: ἀλλὰ
  choice: بل
  rationale: تُظهر المقابلة القوية بين عدم الإيمان بالحق والسرور بالإثم، وهي أنسب هنا من مجرد العطف الاستدراكي الضعيف.
- source_word: εὐδοκήσαντες
  choice: سُرّوا
  rationale: تنقل البعد الوجداني والإرادي في εὐδοκέω، أي الابتهاج أو الرضا، ولا تختزله في الموافقة الذهنية وحدها.
- source_word: τῇ ἀδικίᾳ
  choice: بالإثم
  rationale: «الإثم» لفظ عربي واضح ذو سجل أخلاقي وديني، وينقل هنا معنى ἀδικία بوصفها الشر أو مخالفة البر، لا الظلم الاجتماعي وحده.
theological_decisions:
- issue: هل يُترجم κριθῶσιν بمعنى الحكم العام أم الإدانة الصريحة؟
  choice: يُحكَم على
  alternative: يُدان
  rationale: السياق سلبي ويدل على حكم مؤاخذة، لكن الفعل اليوناني في ذاته أعم من الإدانة. لذلك يحافظ المتن على سعة اللفظ، وتذكر الحاشية البديل الذي يلائم قوة السياق.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ووقورة. استُعملت «بل» لإبراز التضاد، وحُفظت دلالة الحكم القضائي من غير حسم التوتر الدلالي لصالح الإدانة الصريحة.
