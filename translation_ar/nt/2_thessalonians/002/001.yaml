id: 2TH.2.1
reference: 2 Thessalonians 2:1
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Ἐρωτῶμεν δὲ ὑμᾶς, ἀδελφοί, ὑπὲρ τῆς παρουσίας τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ καὶ ἡμῶν ἐπισυναγωγῆς ἐπ’ αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/001.yaml
  text: We ask you[a], brothers, concerning the coming of our Lord Jesus the Messiah and our gathering together to him[b],
translation:
  language: ar
  text: وأما مجيء ربنا يسوع المسيح واجتماعنا إليه، فنطلب إليكم، أيها الإخوة،
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐρωτῶμεν
  choice: فنطلب إليكم
  rationale: الفعل هنا يقدّم التماسًا رعويًا لا أمرًا؛ و«نطلب إليكم» عربية واضحة تحفظ رفق العبارة.
- source_word: δὲ
  choice: وأما
  rationale: تفيد δέ الانتقال إلى موضوع جديد متصل بالسياق، و«أما» تؤدي هذا الانتقال طبيعيًا، مع الفاء في جوابها.
- source_word: ἀδελφοί
  choice: أيها الإخوة
  rationale: يحفظ النداء بصيغته المذكرة في اليونانية، وهو في الاستعمال الرسولي قد يشمل جماعة المؤمنين كلها.
- source_word: ὑπὲρ
  choice: وأما
  rationale: تدخل ὑπέρ هنا على موضوع الطلب بمعنى «من جهة»؛ ونُقلت دلالتها بواسطة تركيب «أما ... فنطلب» العربي الطبيعي.
- source_word: παρουσίας
  choice: مجيء
  rationale: في هذا السياق الأخروي تدل παρουσία على مجيء الرب، لا على مجرد الحضور.
- source_word: κυρίου
  choice: ربنا
  rationale: «الرب» يحفظ دلالة اللقب على السلطان واستعماله اللاهوتي الراسخ، والضمير ينقل ἡμῶν.
- source_word: Ἰησοῦ Χριστοῦ
  choice: يسوع المسيح
  rationale: «المسيح» ترجمة عربية دلالية مستقرة للقب Χριστός، وليس مجرد نقل صوتي له، وتأتي هنا لقبًا ليسوع.
- source_word: ἐπισυναγωγῆς
  choice: اجتماعنا
  rationale: ينقل معنى اجتماع المؤمنين معًا دون فرض دلالة مؤسسية أو تحديد كيفية الاجتماع.
- source_word: ἐπ’ αὐτόν
  choice: إليه
  rationale: تحفظ اتجاه الاجتماع نحو المسيح، وتبقى طبيعية وموجزة في العربية.
theological_decisions:
- issue: دلالة Χριστοῦ في اللقب المسياني
  choice: المسيح
  alternative: المسيح بوصفه اسمًا علمًا محضًا
  rationale: اللفظ العربي «المسيح» يحفظ معنى اللقب المسياني بصورة طبيعية، من غير طمس وظيفته اللقبية.
- issue: نطاق المخاطبين بلفظ ἀδελφοί
  choice: أيها الإخوة
  alternative: أيها الإخوة والأخوات
  rationale: حُفظت الصيغة المذكرة الصريحة في الأصل، مع إدراك أن الاستعمال السياقي قد يتوجه إلى جماعة المؤمنين كلها.
- issue: العلاقة بين المجيء والاجتماع
  choice: 'العطف البسيط: «مجيء... واجتماعنا»'
  alternative: اجتماعنا عند مجيئه، أو جعل أحدهما تفسيرًا للآخر
  rationale: الأصل يعطف الأمرين بـ καί تحت ὑπέρ من غير أن يحدد صراحة علاقتهما الزمنية أو المنطقية؛ لذلك لا تُفرض منظومة أخروية بعينها.
translation_notes:
  register: عربية فصحى معاصرة رصينة ومفهومة. قُدِّم موضوع الطلب في تركيب «وأما... فنطلب» ليحاكي انتقال δέ وارتباط ὑπέρ بالفعل بصورة عربية طبيعية، مع إبقاء تنسيق «المجيء» و«الاجتماع» كما في الأصل.
