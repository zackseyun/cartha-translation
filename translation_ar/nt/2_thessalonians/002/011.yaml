lexical_decisions:
- source_word: διὰ τοῦτο
  choice: ولذلك
  rationale: تؤدي العبارة معنى السببية مع الإحالة إلى ما سبق، أي رفضهم محبة الحق، وتأتي طبيعية وموجزة في العربية.
- source_word: πέμπει
  choice: يرسل
  rationale: يحافظ المضارع العربي على زمن الفعل اليوناني وعلى إسناد الفعل مباشرة إلى الله من غير تخفيفه إلى مجرد السماح.
- source_word: ἐνέργειαν
  choice: فاعلية
  rationale: تنقل معنى العمل المؤثر أو القوة العاملة، وتحافظ على كونه اسمًا يدل على أثر فعّال دون إضافة وصف للقوة غير مصرح به.
- source_word: πλάνης
  choice: الضلال
  rationale: يشمل في هذا السياق معنى الانحراف عن الحق والتضليل المؤدي إلى تصديق الكذب، مع إبقاء العلاقة الإضافية مفتوحة دلاليًا.
- source_word: ἐνέργειαν πλάνης
  choice: فاعليةَ الضلال
  rationale: تحافظ الإضافة العربية على بنية الاسمين في اليونانية وعلى الغموض المشروع بين فاعلية تتصف بالضلال وفاعلية تُحدثه.
- source_word: εἰς τὸ πιστεῦσαι
  choice: لكي يصدّقوا
  rationale: تنقل البناء الذي يحتمل الغاية أو النتيجة دون محاولة حسم العلاقة الدقيقة، وصيغة «يصدّقوا» طبيعية مع مفعول يدل على خبر كاذب.
- source_word: τῷ ψεύδει
  choice: الكذب
  rationale: تحافظ أداة التعريف على التحديد الموجود في اليونانية، ويمكن أن تشير في السياق إلى الكذب المعين المرتبط بالخداع السابق.
theological_decisions:
- issue: فعل الله في الدينونة والتقسية
  choice: يرسل إليهم اللهُ فاعليةَ الضلال
  alternative: يسمح الله بأن تأتيهم فاعلية الضلال؛ أو يسلّمهم إلى الضلال
  rationale: يجعل النص اليوناني الله فاعل «يرسل» صراحة، فلا تُخفف العبارة إلى مجرد السماح. وتُترك كيفية هذا الفعل الإلهي وعلاقته برفض البشر للحق ضمن التوتر اللاهوتي الذي يحفظه السياق.
- issue: دلالة εἰς τό بين الغاية والنتيجة
  choice: لكي يصدّقوا
  alternative: فينتهي بهم الأمر إلى تصديق الكذب
  rationale: تحتمل الصيغة اليونانية الغاية والنتيجة؛ و«لكي» تحافظ على الاتجاه المقصود في العبارة، من غير شرح إضافي يحسم المسألة تفسيريا.
translation_notes:
  register: صياغة عربية فصحى معاصرة ومهيبة. اختيرت «فاعلية الضلال» للمحافظة على الإضافة بين ἐνέργεια وπλάνη، مع بيان البدائل الأكثر سلاسة في الحاشية. وُضع marker الحاشية بعد العبارة التي يشرحها مباشرة.
