source:
  edition: SBLGNT
  text: ὁ ἀντικείμενος καὶ ὑπεραιρόμενος ἐπὶ πάντα λεγόμενον θεὸν ἢ σέβασμα, ὥστε αὐτὸν εἰς τὸν ναὸν τοῦ ⸀θεοῦ καθίσαι ἀποδεικνύντα ἑαυτὸν ὅτι ἔστιν θεός.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/004.yaml
  text: the one who opposes and exalts himself over every so-called god or object of worship[a], so that he takes his seat in the temple of God[b], displaying himself as being God.
translation:
  language: ar
  text: الذي يعارض ويتعاظم فوق كل ما يُسمّى إلهًا أو معبودًا، حتى إنه يجلس في هيكل الله[b]، مُظهرًا نفسه على أنه الله.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مُظهرًا نفسه على أنه إله».'
    reason: alternative_reading
  - marker: b
    text: 'أو: «مَقدِس الله» بدلًا من «هيكل الله».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἀντικείμενος
  choice: المقاوم
  rationale: اسم فاعل معرَّف مستعمل استعمال الاسم؛ ينقل معنى المعارضة المستمرة من غير تحويله إلى لقب اصطلاحي غير مصرَّح به.
- source_word: ὑπεραιρόμενος
  choice: المتعالي على
  rationale: يحفظ دلالة رفع الذات والتعاظم، وتلائم «على» تركيب التفوق الوارد مع ἐπί.
- source_word: ἐπὶ πάντα λεγόμενον θεὸν
  choice: على كل ما يُدعى إلهًا
  rationale: «يُدعى» تنقل λεγόμενον من غير الإقرار بحقيقة الألوهية، و«كل ما» تستوعب الصيغة المحايدة في اليونانية.
- source_word: σέβασμα
  choice: معبودًا
  rationale: لفظ عربي واضح يدل على ما يُتخذ موضوعًا للعبادة، سواء أكان إلهًا مزعومًا أم شيئًا مقدسًا آخر.
- source_word: ὥστε
  choice: حتى إنه
  rationale: تُظهر النتيجة المترتبة على المعارضة والتعالي، بصياغة عربية طبيعية.
- source_word: εἰς τὸν ναὸν τοῦ θεοῦ
  choice: في هيكل الله
  rationale: «الهيكل» المقابل الكتابي الطبيعي لـναός، مع إبقاء احتمال الدلالة الأخص على المقدس في الحاشية.
- source_word: καθίσαι
  choice: يجلس
  rationale: ينقل فعل اتخاذ موضع الجلوس بوضوح، من غير إضافة معنى التتويج صراحة إلى النص.
- source_word: ἀποδεικνύντα ἑαυτὸν
  choice: مُظهرًا نفسه
  rationale: يحفظ معنى إظهار الذات وتقديمها علنًا، من غير تضييقه إلى إعلان لفظي.
- source_word: ὅτι ἔστιν θεός
  choice: أنه الله
  rationale: ينقل ذروة ادعائه في سياق جلوسه في هيكل الله؛ وعدم وجود أداة تعريف في اليونانية يتيح بديل «إله» المحفوظ في الحاشية.
theological_decisions:
- issue: هل تُترجم θεός الأخيرة «الله» أم «إله»؟
  choice: الله
  alternative: إله
  rationale: سياق الجلوس في هيكل الله وإظهار الذات يؤيد فهم العبارة بوصفها ادعاءً بالمقام الإلهي الأعلى، من غير أن يثبت السرد حقيقة هذا الادعاء. ويبقى «إله» ممكنًا لغويًا لكون الاسم غير معرَّف، لذلك أُثبت في الحاشية.
- issue: هل تُترجم ναός «هيكل» أم «مقدس»؟
  choice: هيكل الله
  alternative: مقدس الله
  rationale: «هيكل الله» أوضح وأطبع للقارئ العربي، ولا يحسم هل المراد بناء حرفي أم صورة مقدسة؛ أما «المقدس» فيبرز الدلالة الأخص الممكنة للفظ اليوناني.
translation_notes:
  register: صياغة عربية فصحى معاصرة، واضحة ومهيبة، تحافظ على تتابع الأوصاف في اليونانية وعلى الغموض الحقيقي في θεός وναός. وُضعت علامتا الحاشيتين عند نهاية العبارة لأن [a] تتعلق بخاتمتها و[b] بلفظ «هيكل» السابق.
