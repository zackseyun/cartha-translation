  text: ألا تذكرون أني، حين كنت لا أزال معكم، كنت أقول لكم هذه الأمور؟
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μνημονεύετε
  choice: تذكرون
  rationale: يفيد الفعل استحضار التعليم السابق والاحتفاظ به في الذاكرة، و«تذكرون» هو المقابل العربي الطبيعي في هذا السؤال الإنكاري.
- source_word: ἔτι
  choice: لا أزال
  rationale: تدل الكلمة هنا، مع اسم الفاعل ὢν، على استمرار وجود بولس معهم في ذلك الوقت؛ وتؤدي «لا أزال» هذا المعنى الزمني بوضوح.
- source_word: ὢν πρὸς ὑμᾶς
  choice: حين كنت ... معكم
  rationale: التركيب يدل اصطلاحيًا على الحضور الشخصي بينهم، وصياغة «حين كنت معكم» تُظهر الدلالة الزمنية لاسم الفاعل في عربية طبيعية.
- source_word: ταῦτα
  choice: هذه الأمور
  rationale: يحيل اسم الإشارة الجمع إلى المسائل التي كان بولس يعلّمهم إياها في السياق، و«هذه الأمور» تحفظ معنى الجمع بوضوح.
- source_word: ἔλεγον
  choice: كنت أقول
  rationale: الماضي الناقص اليوناني يصوّر قولًا مستمرًا أو متكررًا في الماضي؛ و«كنت أقول» تحافظ على هذا الجانب دون المبالغة في تحديد مقدار التكرار.
- source_word: οὐ ... ὅτι
  choice: ألا تذكرون أن...؟
  rationale: يأتي السؤال بصيغة تتوقع الإقرار، وتُدخل «أن» مضمون ما ينبغي أن يتذكروه، بما يوافق البنية اليونانية.
