  text: καὶ ἐν πάσῃ ἀπάτῃ ⸀ἀδικίας τοῖς ἀπολλυμένοις, ἀνθ’ ὧν τὴν ἀγάπην τῆς ἀληθείας οὐκ ἐδέξαντο εἰς τὸ σωθῆναι αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/010.yaml
  text: and with every deception of unrighteousness for those who are perishing[d][c][b][a], because they did not accept the love of the truth so as to be saved.
translation:
  language: ar
  text: وبكل خداع الإثم للذين يهلكون، لأنهم لم يقبلوا محبة الحق لكي يخلصوا.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπάτῃ
  choice: خداع
  rationale: تدل الكلمة على الخداع أو التضليل؛ و«خداع» لفظ عربي واضح يلائم السياق من غير أن يحصر المعنى في حالة ذهنية داخلية.
- source_word: ἀδικίας
  choice: للإثم
  rationale: الإضافة تصف الخداع بأنه متسم بالشر ومناقض للبر. و«الإثم» يحفظ القوة الأخلاقية للكلمة في عربية طبيعية.
- source_word: τοῖς ἀπολλυμένοις
  choice: بين الهالكين
  rationale: تحتمل صيغة المجرور اليونانية معنى المجال أو الجهة المتلقية؛ و«بين» تعرض الخداع عاملًا في وسط الذين هم في حال هلاك، من غير تحويلهم إلى فئة محكوم عليها بصياغة تقريرية زائدة.
- source_word: ἀνθ’ ὧν
  choice: لأنهم
  rationale: يؤدي التركيب هنا معنى السببية، و«لأنهم» ينقله بوضوح في سياق الجملة.
- source_word: τὴν ἀγάπην τῆς ἀληθείας
  choice: محبة الحق
  rationale: تحفظ العبارة بنية الإضافة واحتمالها، مع أن السياق يرجح معنى محبتهم للحق وقبولهم له.
- source_word: ἐδέξαντο
  choice: لم يقبلوا
  rationale: الفعل يعني تلقّى أو قبل أو رحّب؛ و«لم يقبلوا» طبيعي مع المفعول المجرد ويفيد الرفض المسؤول دون مبالغة تفسيرية.
- source_word: εἰς τὸ σωθῆναι αὐτούς
  choice: لكي يخلُصوا
  rationale: 'ينقل غاية التركيب أو نتيجته المقصودة بعبارة عربية واضحة، مع إبقاء الفعل مبنيًا للمجهول دلاليًا: نوال الخلاص لا تخليص الذات.'
theological_decisions:
- issue: هل يُفهم «الهالكون» على أنه حكم ثابت سابق أم حالة جارية؟
  choice: الهالكون
  alternative: المحكوم عليهم بالهلاك
  rationale: اسم الفاعل اليوناني في الزمن الحاضر يصور حالة مستمرة، فلا ينبغي تحميله تصريحًا بقضاء ثابت لا تنص عليه العبارة نفسها.
- issue: هل «محبة الحق» هي محبة الناس للحق أم محبة الحق لهم؟
  choice: محبة الحق
  alternative: محبتهم للحق
  rationale: الإضافة اليونانية تحتمل من حيث الصياغة أكثر من علاقة، وإن كان السياق يرجح محبتهم للحق؛ لذلك حُفظ التركيب الموجز من دون حسم تفسيري زائد.
- issue: هل εἰς مع المصدر تفيد الغاية أم النتيجة؟
  choice: لكي يخلُصوا
  alternative: فيخلُصوا
  rationale: «لكي» تعرض دلالة الغاية الراجحة، مع بقاء الصلة بين قبول محبة الحق والخلاص واضحة دون تفصيل مذهبي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختيرت صياغة قريبة من بنية الأصل مع سلاسة كافية للقارئ العام، وحُفظت الإضافة في «محبة الحق» والتوتر اللاهوتي في «الهالكين» دون إدخال تفسير طائفي.
