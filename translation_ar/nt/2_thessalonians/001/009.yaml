  text: οἵτινες δίκην τίσουσιν ὄλεθρον αἰώνιον ἀπὸ προσώπου τοῦ κυρίου καὶ ἀπὸ τῆς δόξης τῆς ἰσχύος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/009.yaml
  text: These will pay the penalty of eternal destruction[a], away from the presence of the Lord and from the glory of his might,
translation:
  language: ar
  text: هؤلاء سيدفعون عقوبةَ هلاكٍ أبدي، بعيدًا عن حضرة الرب وعن مجد قوته.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو ربما: «هلاك صادر من حضرة الرب ومن مجد قوته». يمكن أن يُفهم حرف الجر اليوناني إما على معنى الانفصال («بعيدًا عن») وإما على معنى المصدر أو المنشأ («من»).'
    reason: alternative_reading
lexical_decisions:
- source_word: οἵτινες
  choice: هؤلاء
  rationale: تعود على المضطهِدين أو المقاومين المذكورين في السياق السابق، وتحافظ على قوة الاستئناف والإشارة بعبارة عربية طبيعية.
- source_word: δίκην τίσουσιν
  choice: سيؤدّون عقوبة
  rationale: التركيب اليوناني ذو دلالة قضائية، ومعناه تحمّل الجزاء أو أداء العقوبة. وهذه الصياغة تحافظ على الصورة القانونية بلغة عربية واضحة.
- source_word: ὄλεθρον
  choice: هلاك
  rationale: ينقل شدة اللفظ في سياق الدينونة من غير أن يحدد وحده كيفية العقاب النهائي أو يحسم الجدل اللاهوتي بشأنها.
- source_word: αἰώνιον
  choice: أبدي
  rationale: هو المقابل الطبيعي في هذا السياق الأخروي، ويعبّر عن دوام الحكم ونهائيته.
- source_word: ἀπὸ προσώπου τοῦ κυρίου
  choice: بعيدًا عن حضرة الرب
  rationale: فُهمت ἀπό هنا على معنى الانفصال والإقصاء، و«حضرة» تؤدي المعنى الاصطلاحي لـπρόσωπον في هذا التركيب أفضل من الترجمة الحرفية «وجه».
- source_word: καὶ ἀπὸ τῆς δόξης τῆς ἰσχύος αὐτοῦ
  choice: وعن مجد قوته
  rationale: تحافظ «مجد» على دلالة δόξα، وتنقل «قوة» معنى ἰσχύς بوضوح؛ والمضاف إليه يصف المجد المتعلق بقوة الرب أو المتجلي فيها.
theological_decisions:
- issue: دلالة ἀπό في علاقتها بالدينونة النهائية
  choice: 'الانفصال أو الإقصاء: «بعيدًا عن حضرة الرب»'
  alternative: 'المصدر أو المنشأ: «هلاك صادر من حضرة الرب ومن مجد قوته»'
  rationale: يمكن أن تدل ἀπό على الانفصال أو على المصدر. قراءة الانفصال قوية في سياق العقوبة القضائية، لكن قراءة المصدر ممكنة نحويًا وذات أهمية تفسيرية، ولذلك حُفظت في الحاشية.
- issue: مدلول «هلاك أبدي»
  choice: إبقاء العبارة من غير تحديد كيفية العقاب النهائي
  alternative: تفسيرها بوصفها فناءً، أو بوصفها عذابًا واعيًا أبديًا
  rationale: تقرر العبارة اليونانية طبيعة الجزاء من حيث كونه هلاكًا أبديًا، لكنها لا تحسم بمفردها الخلاف اللاهوتي الأوسع حول الكيفية؛ لذلك لا تُستورد نتيجة مذهبية إلى النص.
translation_notes:
  register: صياغة عربية فصحى معاصرة، واضحة ووقورة. استُعملت «حضرة الرب» بدل «وجه الرب» لأنها الأنسب اصطلاحيًا في هذا السياق، مع إبقاء الغموض الحقيقي في حرف الجر اليوناني ضمن الحاشية.
