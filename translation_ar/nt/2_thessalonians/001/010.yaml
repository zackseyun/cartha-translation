source:
  edition: SBLGNT
  text: ὅταν ἔλθῃ ἐνδοξασθῆναι ἐν τοῖς ἁγίοις αὐτοῦ καὶ θαυμασθῆναι ἐν πᾶσιν τοῖς πιστεύσασιν, ὅτι ἐπιστεύθη τὸ μαρτύριον ἡμῶν ἐφ’ ὑμᾶς, ἐν τῇ ἡμέρᾳ ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/010.yaml
  text: on that day when he comes to be glorified among his saints and to be marveled at among all who have believed[b][a], because our testimony to you was believed.
translation:
  language: ar
  text: في ذلك اليوم، حين يأتي ليُمجَّد بين قدِّيسيه[a] ويكون موضع إعجاب لدى جميع الذين آمنوا، لأن شهادتنا لكم قد صُدِّقت.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في قدِّيسيه». يمكن أن يدل حرف الجر اليوناني على أنه يُمجَّد بين شعبه المقدس، أو أن مجده يظهر فيهم.'
    reason: lexical_alternative
  - marker: b
    text: 'ويمكن، باتباع ترتيب اليونانية، أن تُقرأ: «حين يأتي ليُمجَّد بين قدِّيسيه ويكون موضع إعجاب لدى جميع الذين آمنوا، لأن شهادتنا لكم قد صُدِّقت، في ذلك اليوم».'
    reason: word_order_alternative
lexical_decisions:
- source_word: ὅταν ἔλθῃ
  choice: حين يأتي
  rationale: تفيد ὅταν مع صيغة الماضي الاحتمالية حدثًا مستقبليًا محددًا هنا؛ و«حين يأتي» عربية طبيعية وتحافظ على الدلالة الزمنية.
- source_word: ἐνδοξασθῆναι
  choice: ليُمجَّد
  rationale: يحافظ المبني للمجهول مع لام الغرض على معنى أن مجيئه يؤول إلى تمجيده، وعلى دلالة المجد الإلهي.
- source_word: ἐν τοῖς ἁγίοις αὐτοῦ
  choice: بين قدِّيسيه
  rationale: تنقل «بين» المعنى الجماعي المحتمل لحرف الجر ἐν، مع إبقاء احتمال «في قديسيه» في الحاشية لأن مجده قد يُفهم أنه يظهر فيهم.
- source_word: θαυμασθῆναι
  choice: ويكون موضع إعجاب
  rationale: تعبير عربي واضح يفيد الدهشة الممزوجة بالإعجاب، ويحافظ على المبني للمجهول وموازاته لـ«ليُمجَّد».
- source_word: ἐν πᾶσιν τοῖς πιστεύσασιν
  choice: لدى جميع الذين آمنوا
  rationale: تحافظ الصياغة على القوة الفعلية لاسم الفاعل اليوناني، وتدل على الجماعة التي تبدي الإعجاب دون تكرار «بين» على نحو ثقيل.
- source_word: ὅτι
  choice: لأن
  rationale: 'تفيد العلة: يُعَدّ المخاطبون من الذين آمنوا لأنهم صدقوا الشهادة الموجهة إليهم.'
- source_word: ἐπιστεύθη
  choice: قد صُدِّقت
  rationale: يحافظ المبني للمجهول على كون الشهادة هي موضوع التصديق، ويأتي الفعل من الجذر العربي نفسه الملائم لمعنى الإيمان بصحة الخبر.
- source_word: τὸ μαρτύριον ἡμῶν
  choice: شهادتنا
  rationale: تنقل بإيجاز معنى الشهادة أو الإعلان الرسولي.
- source_word: ἐφ’ ὑμᾶς
  choice: لكم
  rationale: تفيد اتجاه الشهادة إلى المخاطبين، وهي صياغة عربية طبيعية في هذا السياق.
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: في ذلك اليوم
  rationale: تعبير زمني عربي مألوف يحافظ على النبرة الأخروية، ووُضع في البداية لوضوح تعلقه بالمجيء كله.
theological_decisions:
- issue: مرجع «قديسيه» ودلالة حرف الجر ἐν
  choice: «بين قديسيه»، في إشارة سياقية إلى شعب المسيح المقدس
  alternative: «في قديسيه»، بما يشدد على ظهور مجده فيهم؛ أو «بين مقدسيه» مع احتمال أوسع للكائنات السماوية
  rationale: يربط السياق «قديسيه» بـ«جميع الذين آمنوا»، مما يرجح المؤمنين، لكن الحاشية تحفظ التوتر الحقيقي في دلالة ἐν ولا تحسم كيفية ظهور المجد.
- issue: دلالة πιστεύσασιν وἐπιστεύθη بالنسبة إلى الشهادة الرسولية
  choice: «الذين آمنوا» و«شهادتنا... قد صُدِّقت»
  alternative: «الذين صدقوا» أو «الذين وثقوا»، مع «قُبلت شهادتنا بإيمان»
  rationale: تُبقي الصياغة لغة الإيمان في الموضع الأول، وتوضح في الثاني أن الشهادة نفسها لقيت التصديق، دون تحميل العبارة معنى مذهبيًا زائدًا.
- issue: موضع العبارة الزمنية وعلاقتها بالجملة
  choice: تقديم «في ذلك اليوم» لتأطير حدث المجيء كله
  alternative: إبقاؤها في خاتمة الآية وفق ترتيب اليونانية
  rationale: التقديم أوضح في العربية، بينما تُحفظ في الحاشية إمكانية إبقاء العبارة في النهاية بما يعكس ترتيب النص اليوناني وتعلقه البنيوي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُخدم «قدِّيسيه» بوصفه المقابل الكنسي المألوف لـἁγίοις، مع شرح البديل في الحاشية. تجنبت الصياغة التراكيب القديمة الثقيلة، وحافظت على المبني للمجهول والتوازي قدر الإمكان.
