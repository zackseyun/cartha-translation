  text: Παῦλος καὶ Σιλουανὸς καὶ Τιμόθεος τῇ ἐκκλησίᾳ Θεσσαλονικέων ἐν θεῷ πατρὶ ἡμῶν καὶ κυρίῳ Ἰησοῦ Χριστῷ·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/001.yaml
  text: 'Paul and Silvanus and Timothy[b][a], to the church of the Thessalonians in God our Father and the Lord Jesus the Messiah:'
translation:
  language: ar
  text: 'مِن بولس وسلوانس وتيموثاوس، إلى كنيسة أهل تسالونيكي في الله أبينا والرب يسوع المسيح[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي «الممسوح». واللفظ اليوناني Χριστός لقبٌ مسياني، ويُترجم في العربية تقليديًا «المسيح».
    reason: alternative_reading
lexical_decisions:
- source_word: Παῦλος
  choice: بولس
  rationale: الصيغة العربية المعيارية للاسم اليوناني Παῦλος.
- source_word: Σιλουανὸς
  choice: سلوانس
  rationale: نقل مباشر للاسم الوارد في النص اليوناني، من غير توحيده مع الصيغة المختصرة «سيلا» المعروفة من سفر أعمال الرسل.
- source_word: Τιμόθεος
  choice: تيموثاوس
  rationale: الصيغة العربية المعيارية للاسم اليوناني Τιμόθεος.
- source_word: ἐκκλησίᾳ
  choice: كنيسة
  rationale: المقابل العربي الطبيعي في الرسائل البولسية للجماعة المسيحية المجتمعة.
- source_word: Θεσσαλονικέων
  choice: أهل تسالونيكي
  rationale: يحفظ دلالة صيغة الجمع المضافة على الناس، لا على المدينة بوصفها مكانًا فحسب، ويأتي طبيعيًا في العربية.
- source_word: ἐν
  choice: الكائنة في
  rationale: أُضيفت «الكائنة» لسلامة التركيب العربي مع إبقاء حرف «في» ودلالته اللاهوتية المضغوطة من غير تفسيرها بأنها ملكية أو تأسيس.
- source_word: θεῷ πατρὶ ἡμῶν
  choice: الله أبينا
  rationale: يحفظ ضمير المتكلمين الصريح ἡμῶν، ولا يحوله إلى اللقب الأعم «الله الآب».
- source_word: κυρίῳ
  choice: الرب
  rationale: المقابل العربي الراسخ للقب κύριος هنا.
- source_word: Ἰησοῦ Χριστῷ
  choice: يسوع المسيح
  rationale: «المسيح» في العربية عنوان ذو معنى مسياني، وهو أيضًا الصيغة الكتابية العربية الطبيعية والراسخة، بخلاف النقل الصوتي «كريستوس».
theological_decisions:
- issue: دلالة Χριστός في تسلسل الاسم واللقب Ἰησοῦ Χριστῷ
  choice: يسوع المسيح
  alternative: يسوع الممسوح
  rationale: يحفظ «المسيح» القوة اللقبية والمسيانية للكلمة اليونانية، مع لغة عربية طبيعية ومهيبة؛ وتوضح الحاشية معنى اللقب بدل استبداله بتعبير غير مألوف.
- issue: العلاقة التي تعبّر عنها العبارة ἐν θεῷ πατρὶ ἡμῶν καὶ κυρίῳ Ἰησοῦ Χριστῷ
  choice: الكائنة في الله أبينا والرب يسوع المسيح
  alternative: المنتمية إلى الله أبينا والرب يسوع المسيح
  rationale: الإبقاء على «في» يصون احتمال المجال أو الاتحاد أو الرسوخ، ولا يحسم العبارة لصالح معنى الملكية.
- issue: العلاقة النحوية بين θεῷ وκυρίῳ تحت حرف الجر ἐν
  choice: في الله أبينا والرب يسوع المسيح
  alternative: في الله أبينا وفي الرب يسوع المسيح
  rationale: يحافظ على حرف الجر الواحد المشترك كما في اليونانية، من غير فصل المصطلحين أو طمس تمييز الشخصين.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُعملت صيغة افتتاح الرسالة «مِن ... إلى ...» لتمام التركيب العربي، مع إبقاء ترتيب المرسلين والمخاطَبين. وتحافظ «الكائنة في» على غرابة العبارة اللاهوتية المقصودة مع جعلها مفهومة.
