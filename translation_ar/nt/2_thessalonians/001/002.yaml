  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ ⸀πατρὸς καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/002.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a].
translation:
  language: ar
  text: نعمةٌ لكم وسلامٌ من الله الآب والرب يسوع المسيح.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάρις
  choice: نعمة
  rationale: تحفظ دلالة التحية الرسولية وما تحمله الكلمة من معنى لاهوتي، وهي الصياغة العربية الطبيعية الراسخة.
- source_word: ὑμῖν
  choice: لكم
  rationale: تنقل دلالة المفعول غير المباشر في صيغة البركة نقلًا موجزًا وطبيعيًا.
- source_word: εἰρήνη
  choice: سلام
  rationale: تحفظ المعنى المباشر وما يتضمنه من اكتمال الخير والعافية.
- source_word: ἀπὸ
  choice: من
  rationale: تدل بوضوح على مصدر النعمة والسلام.
- source_word: θεοῦ πατρὸς
  choice: الله الآب
  rationale: النص اليوناني المطبوع لا يتضمن ضمير «نا»، و«الله الآب» صياغة عربية طبيعية تحفظ اللقب الأبوي من غير إضافة.
- source_word: κυρίου
  choice: الرب
  rationale: تنقل القوة اللقبية للكلمة وتحافظ على الاستعمال المعروف في العهد الجديد.
- source_word: Ἰησοῦ Χριστοῦ
  choice: يسوع المسيح
  rationale: «المسيح» ينقل معنى Χριστός بوصفه لقبًا، وهو كذلك التعبير العربي الطبيعي والراسخ.
theological_decisions:
- issue: هل يُضاف ضمير المتكلمين إلى «الآب»؟
  choice: الله الآب
  alternative: الله أبينا
  rationale: لا يرد ἡμῶν («نا») في نص SBLGNT المقدم؛ لذلك تُحفظ الصياغة المصدرية من غير إضافة، مع استعمال تركيب عربي واضح وطبيعي.
- issue: نقل لقب Χριστός
  choice: المسيح
  alternative: كريستوس
  rationale: «المسيح» ينقل معنى اللقب اليوناني مباشرة، ويحافظ على طابعه المسياني من غير تحويله إلى نقل صوتي مبهم.
translation_notes:
  register: صياغة عربية فصحى معاصرة، موجزة وكريمة، تحافظ على بنية التحية الرسولية. استُعمل «الله الآب» بدل «الله أبينا» التزامًا بالنص اليوناني المقدم، واستُعمل «المسيح» بوصفه المقابل العربي الطبيعي للقب Χριστός.
