translation:
  language: ar
  text: إذ إن من العدل عند الله أن يجازي بضيقٍ الذين يضيّقون عليكم[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إن كان من العدل حقًّا عند الله أن يجازي بضيقٍ الذين يضيّقون عليكم».'
    reason: تعكس هذه الصياغة البديلة الصورة الشرطية الأقرب حرفيًا للأداة اليونانية εἴπερ، مع أن السياق يرجّح أنها مقدمة مفترضة الصحة لا شرط مشكوك فيه.
lexical_decisions:
- source_word: εἴπερ
  choice: إذ إن
  rationale: تفيد الأداة هنا مقدمةً يفترض بولس صحتها في سياق حجته، ولذلك تنقل «إذ إن» هذا التعليل الطبيعي، مع إثبات الصيغة الشرطية المحتملة في الحاشية.
- source_word: δίκαιον
  choice: من العدل
  rationale: يصف اللفظ ما يوافق عدل الله في القضاء والجزاء، وهذه الصياغة عربية واضحة وملائمة للسياق القضائي.
- source_word: παρὰ θεῷ
  choice: عند الله
  rationale: تعبّر العبارة عن كون هذا الأمر عدلًا بحسب حكم الله ومعياره، من غير إضافة تفسير عقائدي زائد.
- source_word: ἀνταποδοῦναι
  choice: أن يجازي
  rationale: ينقل الفعل معنى إعطاء المقابل أو ردّ الجزاء، وهو أفصح هنا من تعبيرات قد توحي بانتقام بشري دارج.
- source_word: τοῖς θλίβουσιν ὑμᾶς
  choice: الذين يضيّقون عليكم
  rationale: تنقل العبارة معنى إيقاع الضغط والضيق بالمؤمنين، وتحافظ على الصلة اللفظية بالفعل والاسم المتجاورين في اليونانية.
- source_word: θλῖψιν
  choice: بضيقٍ
  rationale: يحافظ «ضيق» على التجانس مع «يضيّقون»، ويعبّر بإيجاز عن الشدة التي تقع عليهم جزاءً.
theological_decisions:
- issue: طبيعة الجزاء الإلهي وتوقيته
  choice: إثبات أن الله يجازي مضايقي المؤمنين بضيق من غير تحديد توقيت هذا الجزاء أو كيفيته في هذه العبارة وحدها.
  alternative: حصر الضيق في الدينونة الأخيرة، أو اعتباره شاملًا لأحكام تاريخية حاضرة إلى جانب الدينونة الأخيرة.
  rationale: النص اليوناني يقرر عدل المقابلة الإلهية، لكنه لا يحسم في هذه الجملة وحدها جميع مسائل توقيتها وكيفيتها؛ لذلك تُركت العبارة عامة.
translation_notes:
  register: العربية فصحى حديثة واضحة ذات نبرة وقورة. حوفظ على التجانس الاشتقاقي بين «يضيّقون» و«ضيق»، وعلى عمومية العبارة بشأن زمن الجزاء وكيفيته.
