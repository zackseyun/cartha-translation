lexical_decisions:
- source_word: ἐν φλογὶ πυρός
  choice: في لهيب نار
  rationale: ينقل صورة النار المتلهبة بعبارة عربية طبيعية ومكثفة، ويبقي العبارة متصلة بظهور الرب المذكور في الآية السابقة.
- source_word: διδόντος ἐκδίκησιν
  choice: مُنزلًا النقمة
  rationale: الفعل «يعطي» مع «النقمة» تعبير اصطلاحي عن إنزال الجزاء القضائي؛ وصيغة اسم الفاعل تحفظ ارتباط العبارة بالرب يسوع في السياق السابق.
- source_word: ἐκδίκησιν
  choice: النقمة
  rationale: تحفظ قوة اللفظ الدال على العقاب الانتقامي القضائي في سياق دينونة الله، من غير تلطيفه إلى مجرد نتيجة أو عقوبة عامة.
- source_word: τοῖς μὴ εἰδόσι θεὸν
  choice: بالذين لا يعرفون الله
  rationale: ينقل المعنى الحاضر لصيغة οἶδα بعبارة عربية واضحة، ويحافظ على وصف حالتهم من غير إضافة معنى الرفض المتعمد.
- source_word: τοῖς μὴ ὑπακούουσιν
  choice: بالذين لا يطيعون
  rationale: ترجمة مباشرة تحفظ معنى عدم الطاعة أو عدم الاستجابة، من غير إضافة قصد صريح بالرفض لا تذكره الصيغة اليونانية.
- source_word: τῷ εὐαγγελίῳ
  choice: إنجيل
  rationale: «الإنجيل» هو المقابل العربي الراسخ والمفهوم للمصطلح البولسي، ويحمل معنى البشارة ضمن استعماله الكتابي.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: ربنا يسوع
  rationale: يحفظ اللقب κύριος وعلاقة الإضافة، بصياغة عربية طبيعية وموجزة.
theological_decisions:
- issue: طبيعة ἐκδίκησις في الدينونة الإلهية
  choice: النقمة
  alternative: الجزاء
  rationale: «النقمة» تحفظ شدة اللفظ وصورته القضائية في سياق دينونة الرب، ولا تختزله في انفعال بشري آثم؛ أما «الجزاء» فأوضح قضائيًا لكنه أخف قوة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. أبقيت تركيب الآية بوصفه تتمة نحوية للآية السابقة، واستُخدم «مُنزلًا» للحفاظ على صيغة اسم الفاعل اليونانية، مع تجنب إضافة دلالة على التعمد إلى عبارتي عدم المعرفة وعدم الطاعة.
