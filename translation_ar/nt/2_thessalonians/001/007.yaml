  text: and to you who are being afflicted[a], relief with us at the revelation of the Lord Jesus from heaven with his mighty angels.
translation:
  language: ar
  text: وأن يمنحكم، أنتم الذين تعانون الضيق، راحةً معنا عند إعلان الرب يسوع من السماء مع ملائكة قدرته.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بعبارة أسلس: «مع ملائكته الأقوياء».'
    reason: lexical_alternative
lexical_decisions:
- source_word: θλιβομένοις
  choice: الذين تُضطهدون
  rationale: اسم فاعل مضارع مبني للمجهول يدل على من يقاسون ضغطًا أو أذى مستمرًا؛ و«تُضطهدون» واضحة في السياق وتحفظ معنى وقوع الأذى عليهم.
- source_word: ἄνεσιν
  choice: فرجٌ
  rationale: يدل اللفظ على رفع الضغط والإراحة منه؛ و«فرج» يقابل الضيق والاضطهاد، ولا يحصر المعنى في راحة نفسية داخلية.
- source_word: μεθ’ ἡμῶν
  choice: معنا
  rationale: يحفظ معنى المصاحبة وإدراج بولس ورفقائه في الفرج الموعود نفسه.
- source_word: ἐν τῇ ἀποκαλύψει
  choice: عند إعلان
  rationale: تؤدي «عند» القوة الزمنية لحرف الجر مع اسم الحدث، مع الإبقاء على الصيغة الاسمية لـἀποκάλυψις.
- source_word: ἀποκαλύψει
  choice: إعلان
  rationale: يفيد الكشف والإظهار بعد خفاء؛ و«إعلان» طبيعي في العربية ويحفظ الدلالة الأخروية دون تحويل العبارة إلى مجرد ظهور بصري.
- source_word: κυρίου
  choice: الرب
  rationale: الترجمة العربية الراسخة للقب κύριος في هذا السياق.
- source_word: ἀπ’ οὐρανοῦ
  choice: من السماء
  rationale: ينقل معنى المصدر أو المنشأ الذي تدل عليه ἀπό بعبارة عربية مباشرة.
- source_word: μετ’ ἀγγέλων δυνάμεως αὐτοῦ
  choice: مع ملائكة قدرته
  rationale: يحافظ على التركيب الإضافي المكثف في اليونانية، ويترك مفتوحًا ما إذا كانت الإضافة وصفية، أي «ملائكته الأقوياء»، أو دالة على ارتباط الملائكة بقدرته.
theological_decisions:
- issue: دلالة التركيب الإضافي ἀγγέλων δυνάμεως αὐτοῦ
  choice: مع ملائكة قدرته
  alternative: مع ملائكته الأقوياء
  rationale: التركيب اليوناني يحتمل الإضافة الحرفية والوصف النوعي. أُبقي التركيب الإضافي في المتن حفاظًا على الغموض الحقيقي، وأُثبت البديل الاصطلاحي السلس في الحاشية.
- issue: القوة الزمنية لعبارة ἐν τῇ ἀποκαλύψει
  choice: عند إعلان الرب يسوع
  alternative: حين يُعلَن الرب يسوع
  rationale: يربط النص الفرج بحدث إعلان يسوع في المستقبل؛ وتحفظ الصياغة المختارة البنية الاسمية للمصدر مع بيان دلالتها الزمنية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «فرج» لإبراز المقابلة مع الضيق، وحُفظ التركيب «ملائكة قدرته» في المتن لصون احتمالَي الإضافة اليونانية، مع البديل الأسلس في الحاشية.
