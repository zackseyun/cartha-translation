    issue: «تُضطهدون» أضيق من θλιβομένοις.
    rationale: الفعل θλίβω في هذا الموضع يدل على من يقاسون الضيق أو الشدة، وقد يشمل الاضطهاد لكنه لا يقتصر عليه. لذلك يلزم تعبير أوسع يحفظ الدلالة دون تخصيص سبب الضيق.
  - severity: low
    issue: العبارة الاسمية «ولكم ... فرجٌ» لا تُظهر في العربية بوضوح ارتباط المفعول بالفعل الحاكم في الآية السابقة.
    rationale: النص اليوناني جزء من تركيب متصل بما قبله. إضافة «أن يمنحكم» تجعل العربية مكتملة وطبيعية، مع كون الفعل مفهومًا من السياق السابق لا إضافةً دلالية جديدة.
  revised_text: وأن يمنحكم، أنتم الذين تعانون الضيق، راحةً معنا عند إعلان الرب يسوع من السماء مع ملائكة قدرته.[a]
