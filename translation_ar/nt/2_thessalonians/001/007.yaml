revisions:
- from: ولكم أنتم الذين تُضطهدون، فرجٌ معنا عند إعلان الرب يسوع من السماء مع ملائكة قدرته.[a]
  to: وأن يمنحكم، أنتم الذين تعانون الضيق، راحةً معنا عند إعلان الرب يسوع من السماء مع ملائكة قدرته.[a]
  rationale: استُبدلت «تُضطهدون» بـ«تعانون الضيق» لتشمل مجال θλιβομένοις الدلالي من غير حصره في الاضطهاد. وأُظهر الفعل الحاكم المفهوم من السياق السابق في «وأن يمنحكم» لتستقيم الجملة العربية. وحُفظت الإضافة «ملائكة قدرته» والحاشية لأنهما تصونان الاحتمالين المشروعين في العبارة اليونانية.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:19:29Z'
review_pass:
  verdict: revise
  source_fidelity: تُقيِّد «تُضطهدون» دلالة θλιβομένοις إلى الاضطهاد، بينما اللفظ اليوناني أوسع ويشير إلى المعاناة من الضيق أو الشدة الجارية. أمّا «راحةً معنا» فتنقل ἄνεσιν وμεθ’ ἡμῶν بوضوح. وتحافظ «مع ملائكة قدرته» على الإضافة اليونانية المحتملة.
  naturalness: 'الصياغة المعدلة فصيحة معاصرة ومتصلة نحويًا: إدخال «أن يمنحكم» يبيّن التبعية للفعل الحاكم في الآية السابقة، دون إضافة معنى مستقل. و«تعانون الضيق» أوضح وأوسع استعمالًا من المبني للمجهول «تُضايَقون».'
  terminology: «الرب يسوع»، «السماء»، و«ملائكة قدرته» مناسبة. «إعلان الرب يسوع» ممكنة في العربية الفصحى لنقل ἀποκάλυψις، وتُبقي التعبير اسميًا ولا تفرض تفسيرًا إضافيًا. وتحفظ الحاشية البديل الوصفي السلس دون جعله المعنى الوحيد.
  issues:
