source:
  edition: SBLGNT
  text: Εὐχαριστεῖν ὀφείλομεν τῷ θεῷ πάντοτε περὶ ὑμῶν, ἀδελφοί, καθὼς ἄξιόν ἐστιν, ὅτι ὑπεραυξάνει ἡ πίστις ὑμῶν καὶ πλεονάζει ἡ ἀγάπη ἑνὸς ἑκάστου πάντων ὑμῶν εἰς ἀλλήλους,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/003.yaml
  text: We ought always to give thanks to God for you[a], brothers, as is fitting, because your faith is growing abundantly and the love of each and every one of you for one another is increasing[c][b],
translation:
  language: ar
  text: ينبغي لنا أن نشكر الله دائمًا من أجلكم، أيها الإخوة[a]، كما يليق، لأن إيمانكم ينمو نموًّا عظيمًا[b]، وتزداد محبة كل واحد منكم للآخرين في الجماعة[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أيها الإخوة والأخوات». اللفظ اليوناني يعني حرفيًا «الإخوة»، ويمكن أن يُستعمل في مخاطبة جماعة المؤمنين كلها، رجالًا ونساءً.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «أمانتكم تزداد كثيرًا». يمكن للكلمة اليونانية أن تدل على الإيمان أو الثقة أو الأمانة، و«الإيمان» هو المعنى الأرجح هنا.'
    reason: alternative_reading
  - marker: c
    text: 'تؤكد العبارة اليونانية الشمول الفردي: محبة كل واحد من جميعكم تجاه الآخرين بعضهم لبعض.'
    reason: source_form
lexical_decisions:
- source_word: Εὐχαριστεῖν ὀφείλομεν
  choice: يجب علينا أن نشكر
  rationale: ينقل تركيب المصدر مع ὀφείλομεν معنى الالتزام الأدبي والاستحقاق، بصياغة عربية طبيعية دون جعله ضرورة قسرية مطلقة.
- source_word: πάντοτε περὶ ὑμῶν
  choice: دائمًا من أجلكم
  rationale: يحفظ الدلالة الزمنية، ويؤدي περί في صيغة الشكر بتعبير عربي مألوف.
- source_word: ἀδελφοί
  choice: أيها الإخوة
  rationale: يحافظ على صيغة النداء المذكرة في اليونانية، مع بيان إمكان شمولها جماعة المؤمنين كلها في الحاشية.
- source_word: καθὼς ἄξιόν ἐστιν
  choice: كما يليق
  rationale: يعبر عن الملاءمة والاستحقاق الأدبي بلغة عربية واضحة، دون الإيحاء بأن المخاطبين هم موضوع الأهلية.
- source_word: ὑπεραυξάνει
  choice: ينمو نموًّا فائقًا
  rationale: يحفظ معنى النمو مع قوة التكثيف في الفعل المركب، بدل اختزاله إلى مجرد الزيادة.
- source_word: ἡ πίστις ὑμῶν
  choice: إيمانكم
  rationale: «الإيمان» هو المقابل الأرجح في السياق، مع إبقاء احتمال معنى الأمانة أو الثبات في الحاشية.
- source_word: πλεονάζει ἡ ἀγάπη
  choice: محبة ... تزداد
  rationale: صياغة عربية طبيعية تحافظ على المضارع الدال على الزيادة المتواصلة.
- source_word: ἑνὸς ἑκάστου πάντων ὑμῶν εἰς ἀλλήλους
  choice: محبة كل واحد منكم للآخرين
  rationale: تنقل التشديد التوزيعي في العبارة اليونانية وتوضح أن المحبة متبادلة داخل الجماعة، من غير تركيب عربي مثقل.
theological_decisions:
- issue: دلالة πίστις
  choice: إيمانكم
  alternative: أمانتكم أو ثباتكم في الإيمان
  rationale: السياق يرجح نمو إيمان أهل تسالونيكي، لكن المجال الدلالي للكلمة يمكن أن يتضمن الأمانة؛ لذلك لم يُحسم الاحتمال البديل بلا تنبيه.
- issue: خطاب ἀδελφοί لجماعة قد تضم رجالًا ونساءً
  choice: أيها الإخوة
  alternative: أيها الإخوة والأخوات
  rationale: أُبقيت الصيغة النحوية الظاهرة في الأصل، مع توضيح الاستعمال الجمعي الشامل الممكن في الحاشية.
- issue: قوة الالتزام في ὀφείλομεν
  choice: يجب علينا
  alternative: ينبغي لنا
  rationale: «يجب علينا» يظهر أن الشكر واجب لائق، لكن السياق لا يقدمه بوصفه إكراهًا قانونيًا؛ وتساعد عبارة «كما يليق» على ضبط النبرة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «نموًّا فائقًا» لإبراز قوة الفعل اليوناني النادر، وصيغت العبارة التوزيعية الثقيلة بأسلوب عربي مقروء مع حفظ صورتها الأقرب في الحاشية.
