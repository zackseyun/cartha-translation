  naturalness: النص فصيح وواضح إجمالًا. «ينبغي لنا» أنسب للنبرة الرسولية من «يجب علينا»، و«نموًّا فائقًا» مفهوم، وإن كان «ينمو نموًّا عظيمًا» أكثر سلاسة مع حفظ التكثيف.
  terminology: «الإيمان»، و«المحبة»، و«أيها الإخوة» مقابلات مناسبة. حاشية الإخوة تحافظ على اللفظ الظاهر وتشرح إمكان شموله الجماعة. وحاشية πίστις تحفظ البديل الدلالي بلا فرض قراءة عقدية.
