revisions:
- from: يجب علينا أن نشكر الله دائمًا من أجلكم، أيها الإخوة[a]، كما يليق، لأن إيمانكم ينمو نموًّا فائقًا[b]، ومحبة كل واحد منكم للآخرين تزداد[c].
  to: ينبغي لنا أن نشكر الله دائمًا من أجلكم، أيها الإخوة[a]، كما يليق، لأن إيمانكم ينمو نموًّا عظيمًا[b]، وتزداد محبة كل واحد منكم للآخرين في الجماعة[c].
  rationale: استُبدلت «يجب علينا» بـ«ينبغي لنا» لمطابقة قوة ὀφείλομεν وسياقها. وعُدلت عبارة النمو إلى تعبير عربي أكثر سلاسة يحفظ تكثيف ὑπεραυξάνει. وأعيدت صياغة خاتمة الآية وحاشيتها لإبراز أن المحبة تخص كل فرد وتتجه إلى الآخرين داخل الجماعة، دون ادعاء حرفية عربية غير سليمة.
