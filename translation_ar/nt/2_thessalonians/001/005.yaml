  text: ἔνδειγμα τῆς δικαίας κρίσεως τοῦ θεοῦ, εἰς τὸ καταξιωθῆναι ὑμᾶς τῆς βασιλείας τοῦ θεοῦ, ὑπὲρ ἧς καὶ πάσχετε,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/005.yaml
  text: This is evidence of the righteous judgment of God[a], so that you may be counted worthy of the kingdom of God, for which you are also suffering[c][b],
translation:
  language: ar
  text: وهذا دليلٌ على دينونة الله العادلة[a]، لكي تُحسَبوا أهلًا لملكوت الله[b]، الذي تتألّمون أيضًا من أجله[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «برهان» أو «علامة» على دينونة الله العادلة.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «فتُحسَبوا أهلًا» أو «مما يؤدّي إلى أن تُحسَبوا أهلًا». قد يدلّ التركيب اليوناني على الغاية أو النتيجة.'
    reason: alternative_reading
  - marker: c
    text: 'أو: «في سبيله» أو «لصالحه».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔνδειγμα
  choice: دليل
  rationale: تدلّ الكلمة على ما يكشف حقيقةً أو يشهد لها. و«دليل» تعبير عربي طبيعي يحفظ قوة الاستدلال، مع بيان البدائل الممكنة في الحاشية. أُضيف «وهذا» لأن العبارة اليونانية بلا فعل وتعتمد نحويًا على السياق السابق.
- source_word: δικαίας κρίσεως
  choice: دينونة الله العادلة
  rationale: تحفظ «دينونة» معنى الحكم القضائي الإلهي، وتنقل «العادلة» الصفة الأخلاقية التي تحملها δικαίας.
- source_word: εἰς τὸ καταξιωθῆναι
  choice: لكي تُحسَبوا أهلًا
  rationale: تنقل صيغة المبني للمجهول معنى اعتبارهم أهلًا، لا جعلهم مستحقين في ذواتهم. و«لكي» تعبّر طبيعيًا عن الغاية، مع إبقاء احتمال النتيجة في الحاشية.
- source_word: βασιλείας τοῦ θεοῦ
  choice: ملكوت الله
  rationale: تعبير كتابي عربي مألوف وشفاف يحفظ دلالة العبارة اليونانية ووزنها اللاهوتي.
- source_word: ὑπὲρ ἧς
  choice: من أجله
  rationale: يربط آلامهم بالملكوت على معنى «لأجل» أو «في سبيل»، من غير حصر دلالة ὑπέρ في صياغة تفسيرية واحدة.
- source_word: καὶ πάσχετε
  choice: تتألّمون أيضًا
  rationale: المضارع العربي يلائم الألم الجاري، و«أيضًا» تحفظ καί وتربط العبارة بما سبق من ذكر الضيقات.
theological_decisions:
- issue: علاقة الألم باعتبار المؤمنين أهلًا للملكوت
  choice: يعرض النص آلامهم بوصفها مرتبطة بدينونة الله العادلة وبأن يُحسَبوا أهلًا للملكوت، من غير أن يصرّح بأن الألم ثمنٌ لاستحقاق دخوله.
  alternative: أن آلامهم تكسبهم بذاتها استحقاق دخول الملكوت.
  rationale: الفعل المبني للمجهول καταξιωθῆναι يعني «أن يُحسَبوا/يُعتبَروا أهلًا»، وتركيب الغاية أو النتيجة يترك توتر العلاقة قائمًا دون إدخال مفهوم الاستحقاق الكسبي في الترجمة.
translation_notes:
  register: صياغة عربية فصحى واضحة وموقّرة، مع استعمال «ملكوت» المألوف كتابيًا. حُفظت بنية الجملة التابعة للسياق بإضافة «وهذا»، ووُضعت علامات الحواشي كلها في المتن.
