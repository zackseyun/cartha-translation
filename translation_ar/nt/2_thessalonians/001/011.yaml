- from: ولهذه الغاية أيضًا نصلّي دائمًا من أجلكم، لكي يحسبكم إلهنا أهلًا للدعوة[a]، ويتمّم بقوة كل عزم على الخير[b] وكل عمل نابع من الإيمان[c].
  to: ولهذه الغاية أيضًا نصلّي دائمًا من أجلكم، لكي يحسبكم إلهنا أهلًا للدعوة[a]، ويتمّم بقوة كل عزم على الخير[b] وعمل إيمان[c].
  rationale: حُذفت «كل» الثانية لأنها ليست ممثلة بمحدِّد مستقل في الأصل، واستُبدلت الصياغة التفسيرية «نابع من الإيمان» بتركيب «عمل إيمان» الذي يصون سعة الإضافة اليونانية. وعُدِّلت الحاشية لتعرض الاحتمالات من دون إضافة معنى كمي أو فرض قراءة سببية في المتن.
