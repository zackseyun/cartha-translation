source:
  edition: SBLGNT
  text: εἰς ὃ καὶ προσευχόμεθα πάντοτε περὶ ὑμῶν, ἵνα ὑμᾶς ἀξιώσῃ τῆς κλήσεως ὁ θεὸς ἡμῶν καὶ πληρώσῃ πᾶσαν εὐδοκίαν ἀγαθωσύνης καὶ ἔργον πίστεως ἐν δυνάμει,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/011.yaml
  text: To this end also we always pray for you[a], that our God may count you worthy of the calling and may fulfill every good resolve and work of faith with power[c][b],
translation:
  language: ar
  text: ولهذه الغاية أيضًا نصلّي دائمًا من أجلكم، لكي يحسبكم إلهنا أهلًا للدعوة[a]، ويتمّم بقوة كل عزم على الخير[b] وعمل إيمان[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يجعلكم أهلًا للدعوة». يمكن أن يعني الفعل اليوناني «يحسب أهلًا» أو «يجعل أهلًا».'
    reason: alternative_reading
  - marker: b
    text: 'أو: «كل قصد للخير» أو «كل عزم صالح».'
    reason: lexical_alternative
  - marker: c
    text: يمكن أن يُفهم أيضًا على أنه «عمل يصدر عن الإيمان». كما يمكن أن تحمل كلمة «الإيمان» معنى «الأمانة» في السياق.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ὃ
  choice: ولهذه الغاية
  rationale: تعبير عربي طبيعي يحيل إلى ما سبق ويحفظ دلالة الغاية في εἰς.
- source_word: καὶ
  choice: أيضًا
  rationale: يحفظ معنى الإضافة والتوكيد من غير مبالغة.
- source_word: προσευχόμεθα πάντοτε περὶ ὑμῶν
  choice: نصلّي دائمًا من أجلكم
  rationale: ينقل الصلاة المعتادة المستمرة، ويصوغ περὶ ὑμῶν بصياغة عربية مألوفة.
- source_word: ἵνα
  choice: لكي
  rationale: يحفظ احتمال الغاية مع كونه مدخلًا إلى مضمون الصلاة.
- source_word: ἀξιώσῃ
  choice: يحسبكم ... أهلًا
  rationale: يحفظ المعنى التقويمي للفعل، مع إثبات احتمال معنى «يجعلكم أهلًا» في الحاشية.
- source_word: τῆς κλήσεως
  choice: للدعوة
  rationale: لا يضيف ضمير ملكية غير موجود في اليونانية، ويحيل إلى الدعوة المعهودة في السياق.
- source_word: ὁ θεὸς ἡμῶν
  choice: إلهنا
  rationale: يحفظ ضمير المتكلمين الصريح في الأصل.
- source_word: πληρώσῃ
  choice: يتمّم
  rationale: يلائم إنجاز العزم والعمل وإيصالهما إلى التمام.
- source_word: πᾶσαν εὐδοκίαν ἀγαθωσύνης
  choice: كل عزم على الخير
  rationale: ينقل εὐδοκία بوصفها قصدًا أو عزمًا، ويحفظ ἀγαθωσύνης اسمًا دالًا على الخير من دون اختزال الاحتمالات الأخرى.
- source_word: ἔργον πίστεως
  choice: كل عمل نابع من الإيمان
  rationale: صياغة عربية واضحة للاحتمال الراجح، مع إبقاء احتمال «عمل الإيمان» أو العمل المتصف بالأمانة في الحاشية.
- source_word: ἐν δυνάμει
  choice: بقوة
  rationale: وُضع مع الفعل «يتمّم» بحيث يشمل إتمام كل من العزم والعمل، موافقًا لبنية الجملة.
theological_decisions:
- issue: دلالة ἀξιώσῃ بالنسبة إلى الدعوة الإلهية
  choice: يحسبكم إلهنا أهلًا للدعوة
  alternative: يجعلكم أهلًا للدعوة
  rationale: للفعل معنى تقويمي ومعنى سببي محتملان؛ اختير الأول في المتن وحُفظ الثاني في الحاشية، من غير حسم التوتر اللاهوتي.
- issue: دلالة الإضافة في ἔργον πίστεως
  choice: عمل نابع من الإيمان
  alternative: عمل الإيمان؛ أو عمل يتصف بالأمانة
  rationale: قد تكون الإضافة سببية أو وصفية، كما قد تدل πίστις على الإيمان أو الأمانة بحسب السياق؛ لذلك ذُكر البديل في الحاشية.
- issue: العلاقة في εὐδοκίαν ἀγαθωσύνης
  choice: عزم على الخير
  alternative: قصد الخير؛ أو عزم صالح
  rationale: الإضافة اليونانية موجزة وتحتمل أن يكون العزم متجهًا إلى الخير أو متصفًا به؛ اختيرت صياغة طبيعية مع حفظ البدائل.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعملت «ولهذه الغاية» لربط الآية بما قبلها، و«عزم على الخير» لتجنب إيحاء العاطفة العابرة. وُضعت جميع علامات الحواشي في المتن، مع الحفاظ على الغموض المعجمي واللاهوتي الحقيقي.
