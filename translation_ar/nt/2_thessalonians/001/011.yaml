    rationale: πᾶσαν يرد مع εὐδοκίαν مفردًا، وليس في النص محدِّد مستقل يقتضي «كل عمل». حذف «كل» الثاني أوصل إلى بنية الأصل بأدقّية.
  - severity: medium
    issue: تعيين الإضافة في «عمل نابع من الإيمان»
    rationale: العبارة اليونانية ἔργον πίστεως تترك نوع العلاقة بين العمل والإيمان مفتوحًا نسبيًا. «نابع من» يختار علاقة سببية تفسيرية؛ والأفضل في المتن «عمل إيمان» مع بيان الاحتمالات في الحاشية.
