source:
  edition: SBLGNT
  text: ὅπως ἐνδοξασθῇ τὸ ὄνομα τοῦ κυρίου ἡμῶν Ἰησοῦ ἐν ὑμῖν, καὶ ὑμεῖς ἐν αὐτῷ, κατὰ τὴν χάριν τοῦ θεοῦ ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/012.yaml
  text: so that the name of our Lord Jesus may be glorified in you[a], and you in him[c][b], according to the grace of our God and the Lord Jesus the Messiah.
translation:
  language: ar
  text: لكي يتمجَّد اسم ربِّنا يسوع فيكم[a]، وتتمجَّدوا أنتم فيه، بحسب نعمة إلهنا والرب يسوع المسيح[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بينكم». يمكن أن يفيد حرف الجر اليوناني كلا المعنيين في هذا السياق.'
    reason: lexical_alternative
  - marker: b
    text: يمكن فهم العبارة اليونانية الختامية على أنها تربط «إلهنا» و«الرب يسوع المسيح» في تعبير واحد، أو على أنها تشير إلى «إلهنا» وإلى «الرب يسوع المسيح» على نحو متميز. لا تحسم الترجمة هذا النقاش بإضافة تفسير إلى المتن.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπως
  choice: لكي
  rationale: تفيد الغاية أو النتيجة المقصودة المترتبة على الصلاة السابقة، و«لكي» صياغة عربية طبيعية ودقيقة.
- source_word: ἐνδοξασθῇ
  choice: يتمجَّد
  rationale: تحفظ صيغة المبني للمجهول والدلالة اللاهوتية لجذر المجد، مع ملاءمتها للسياق العربي.
- source_word: τὸ ὄνομα
  choice: اسم
  rationale: أُبقي اللفظ كما في اليونانية، بما يحمله كتابيًا من دلالة على هوية الشخص المعلنة وسمعته، من غير تحويله إلى تفسير.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: ربِّنا يسوع
  rationale: ترتيب عربي طبيعي يحفظ اللقب والإضافة.
- source_word: ἐν ὑμῖν
  choice: فيكم
  rationale: يحافظ على الصورة اليونانية، مع إمكان أن يحمل حرف الجر معنى «بينكم» في هذا السياق، ولذلك ذُكر البديل في الحاشية.
- source_word: καὶ ὑμεῖς ἐν αὐτῷ
  choice: وتتمجَّدوا أنتم فيه
  rationale: أُظهر الفعل المحذوف في الشطر الثاني لاستقامة العربية، مع الحفاظ على التوازي المتبادل. والضمير يُفهم على الأرجح عائدًا إلى الرب يسوع.
- source_word: κατὰ τὴν χάριν
  choice: بحسب نعمة
  rationale: تنقل معنى المعيار أو الأساس من غير حصره في معنى الوسيلة وحده.
- source_word: χάριν
  choice: نعمة
  rationale: المقابل العربي الكتابي الراسخ والملائم لاستعمال بولس.
- source_word: τοῦ θεοῦ ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ
  choice: إلهنا وربِّنا يسوع المسيح
  rationale: تحافظ الصياغة على تماسك التركيب اليوناني وعلى عدم تكرار أداة التعريف، فلا تفرض فصلًا بين مرجعَي اللقبين. «المسيح» هو المقابل العربي الطبيعي للقب Χριστός.
theological_decisions:
- issue: دلالة Χριστοῦ
  choice: المسيح
  alternative: المسيّا
  rationale: «المسيح» في العربية الفصحى هو اللقب الكتابي الطبيعي والمفهوم، وينقل معنى الممسوح من غير أن يتحول إلى اسم شخصي محض.
- issue: مرجع αὐτῷ
  choice: فيه، أي في الرب يسوع على الأرجح
  alternative: فيه، أي في الاسم
  rationale: التوازي بين تمجيد اسم الرب في المؤمنين وتمجيدهم فيه، إلى جانب الاستعمال البولسي لعبارة «فيه»، يرجح عود الضمير إلى يسوع؛ لكن الترجمة لا تضيف المرجع إلى المتن.
- issue: قوة العبارة الختامية المضافة
  choice: إلهنا وربِّنا يسوع المسيح
  alternative: إلهنا والرب يسوع المسيح
  rationale: وجود أداة تعريف واحدة قبل θεοῦ وربط κυρίου به بواسطة καί يجعل العبارة وثيقة الترابط، وقد تُفهم على أنها تسند اللقبين إلى مرجع واحد، مع إمكان مناقشة قراءتها على مرجعين. حافظت الترجمة على إحكام اليونانية ولم تضف أداة تفصل المرجعين.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُخدم «يتمجَّد» وحُذف التشكيل إلا حيث يعين على القراءة، وأُظهر الفعل في الشطر الموازي لتجنب تركيب عربي مبتور. جميع علامات الحواشي مثبتة في المتن.
