  text: ὥστε ⸂αὐτοὺς ἡμᾶς⸃ ἐν ὑμῖν ⸀ἐγκαυχᾶσθαι ἐν ταῖς ἐκκλησίαις τοῦ θεοῦ ὑπὲρ τῆς ὑπομονῆς ὑμῶν καὶ πίστεως ἐν πᾶσιν τοῖς διωγμοῖς ὑμῶν καὶ ταῖς θλίψεσιν αἷς ἀνέχεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/004.yaml
  text: so that we ourselves boast about you among the churches of God because of your perseverance and faith in all your persecutions and afflictions that you are enduring,[a]
translation:
  language: ar
  text: حتى إننا نحن أنفسنا نفتخر بكم بين كنائس الله، بسبب ثباتكم وإيمانكم[a] في جميع اضطهاداتكم وضيقاتكم التي تحتملونها.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «ثباتكم في الإيمان»؛ فقد تدل كلمة πίστις على الإيمان أو على الوفاء والثبات في الإيمان، ولا سيما في سياق المعاناة.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: حتى إننا
  rationale: تُفيد النتيجة المترتبة على الكلام السابق، وهذه الصياغة تصل الجملة بسياقها اتصالًا طبيعيًا.
- source_word: αὐτοὺς ἡμᾶς
  choice: نحن أنفسنا
  rationale: تحفظ توكيد الضمير على بولس ورفقائه.
- source_word: ἐν ὑμῖν ἐγκαυχᾶσθαι
  choice: نفتخر بكم
  rationale: ينقل معنى الافتخار واتخاذ المخاطَبين موضوعًا له بعبارة عربية واضحة، من غير تخفيف لقوة التعبير.
- source_word: ἐν ταῖς ἐκκλησίαις τοῦ θεοῦ
  choice: بين كنائس الله
  rationale: يعبّر عن الجماعات التي يجري الافتخار في وسطها، ويحفظ صيغة الجمع ونسبتها إلى الله.
- source_word: ὑπὲρ τῆς ὑπομονῆς ὑμῶν καὶ πίστεως
  choice: بسبب ثباتكم وإيمانكم
  rationale: يفيد ὑπέρ هنا أساس الافتخار؛ و«الثبات» يعبّر بإيجاز عن الاحتمال الراسخ تحت الضغط، مع إبقاء πίστις على «الإيمان» في المتن.
- source_word: ἐν πᾶσιν τοῖς διωγμοῖς ὑμῶν καὶ ταῖς θλίψεσιν αἷς ἀνέχεσθε
  choice: في جميع ما تحتملونه من اضطهادات وضيقات
  rationale: تجعل صلة الموصول طبيعية في العربية، وتحفظ استمرار الاحتمال والتمييز بين الاضطهاد العدائي والضيقات الأوسع.
theological_decisions:
- issue: دلالة πίστις في سياق المعاناة
  choice: إيمانكم
  alternative: أمانتكم أو ثباتكم في الإيمان
  rationale: يمكن أن تدل الكلمة على الإيمان أو الأمانة الراسخة. أُبقي «الإيمان» في المتن، مع إثبات الاحتمال السياقي الآخر في الحاشية من غير حسم زائد.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «نفتخر» لحفظ قوة التعبير، و«ضيقات» لوزنه الكتابي المفهوم، مع إعادة ترتيب آخر الجملة لتجنب تركيب موصول ثقيل من دون تغيير المعنى.
