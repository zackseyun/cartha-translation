base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/007.yaml
  text: For you yourselves know how you ought to imitate us[a], because we did not behave disorderly among you.
translation:
  language: ar
  text: لأنكم أنتم تعرفون كيف يجب أن تقتدوا بنا، إذ إننا لم نسلك بينكم بلا انضباط[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، على نحو أخص في هذا السياق: «لم نكن عاطلين بينكم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ
  choice: أنتم
  rationale: 'أُبرز الضمير المنفصل إلى جانب ضمير الفعل للمحافظة على معنى التوكيد: أنتم أنفسكم تعرفون.'
- source_word: γὰρ
  choice: لأنكم
  rationale: تفيد γάρ التعليل أو الشرح لما سبق، واللام هنا تؤدي هذا الربط بصورة طبيعية في العربية.
- source_word: οἴδατε
  choice: تعرفون
  rationale: الفعل οἶδα، مع كونه تامّ الصيغة في اليونانية، يحمل هنا معنى حاضرًا؛ و«تعرفون» تعبير عربي واضح وطبيعي.
- source_word: πῶς
  choice: كيف
  rationale: تنقل معنى الكيفية أو الطريقة مباشرة.
- source_word: δεῖ
  choice: يجب
  rationale: تحفظ معنى الضرورة أو الالتزام، وتنسجم طبيعيًا مع المصدر المؤول في العربية.
- source_word: μιμεῖσθαι
  choice: أن تقتدوا
  rationale: «تقتدوا» تنقل معنى محاكاة السلوك والاحتذاء بالشخص، وهي أفصح وأطبع في هذا السياق من «تقلّدوا» أو «تحاكوا».
- source_word: ἡμᾶς
  choice: بنا
  rationale: يحافظ على كون المفعول به أشخاصًا، دون تحويله تفسيرًا إلى «بمثالنا».
- source_word: ὅτι
  choice: إذ إننا
  rationale: تربط العبارة التالية بما قبلها بوصفها أساسًا يبيّن كيفية الاقتداء، مع إبقاء الصلة التعليلية أو التفسيرية الطبيعية في السياق.
- source_word: οὐκ ἠτακτήσαμεν
  choice: لم نسلك بينكم بلا انضباط
  rationale: ينقل المعنى الأوسع للفعل ἀτακτέω، أي السلوك على نحو غير منضبط أو خارج عن النظام، من غير قصره على البطالة وحدها.
- source_word: ἐν ὑμῖν
  choice: بينكم
  rationale: تعبير عربي طبيعي يدل على السلوك في وسط جماعة التسالونيكيين.
theological_decisions:
- issue: مدلول ἀτακτέω في السياق المباشر
  choice: وصف عام للسلوك غير المنضبط، لا حصره في الكسل أو البطالة في المتن
  alternative: «لم نكن عاطلين بينكم»
  rationale: يرتبط سياق الأصحاح بالامتناع عن العمل، ولذلك فمعنى العطالة محتمل بقوة هنا؛ لكن المجال الدلالي للفعل أوسع من ذلك. أبقى المتن هذا الاتساع، وأثبت المعنى الأخص المحتمل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «تقتدوا بنا» لصياغة طبيعية، وحُفظ توكيد αὐτοὶ بذكر «أنتم» صراحة، كما حُفظ الاتساع الدلالي للفعل ἀτακτέω في المتن مع بيان احتمال معنى العطالة في الحاشية.
