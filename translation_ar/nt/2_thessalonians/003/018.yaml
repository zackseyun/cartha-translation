  text: نِعْمَةُ رَبِّنَا يَسُوعَ الْمَسِيحِ مَعَكُمْ أَجْمَعِينَ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάρις
  choice: نِعْمَة
  rationale: المقابل العربي الكتابي الراسخ الذي يجمع معنى الإحسان المجاني والعطية الإلهية في البركة الرسولية.
- source_word: κυρίου
  choice: رَبِّنَا
  rationale: ينقل لقب السيادة والتوقير، ويحفظ ضمير المتكلم الجمع في τοῦ κυρίου ἡμῶν.
- source_word: Ἰησοῦ Χριστοῦ
  choice: يَسُوعَ الْمَسِيحِ
  rationale: يُنقل الاسم Ἰησοῦς صوتيًا، ويُترجم اللقب Χριστός إلى «المسيح»، وهو المقابل العربي المألوف والواضح لمعنى الممسوح.
- source_word: μετὰ πάντων ὑμῶν
  choice: مَعَكُمْ أَجْمَعِينَ
  rationale: صياغة عربية طبيعية تحفظ شمول πάντων لجميع المخاطَبين، ولا تحتاج إلى إظهار فعل مقدّر في جملة البركة الاسمية.
theological_decisions:
- issue: دلالة Χριστοῦ في البركة الختامية
  choice: المسيح
  alternative: كريستوس بوصفه اسمًا منقولًا صوتيًا
  rationale: يبقى معنى اللقب «الممسوح» حاضرًا، و«المسيح» هو المقابل العربي التاريخي الطبيعي دون فرض تمييز مذهبي.
- issue: الفعل المحذوف في عبارة البركة
  choice: 'الإبقاء على الجملة الاسمية: «نعمة... معكم»'
  alternative: «لتكن نعمة... معكم»
  rationale: اليونانية لا تذكر فعلًا، والعربية الفصيحة تستوعب هذا الأسلوب وتحفظ إيجاز الأصل وقوته البرَكية.
translation_notes:
  register: عربية فصحى واضحة وموقرة، بصياغة ختامية مألوفة. استُعمل «أجمعين» لتأكيد شمول الجماعة كلها كما في πάντων ὑμῶν، مع تجنب إضافة حاشية لا تدعمها ضرورة نصية أو دلالية.
