  text: πιστὸς δέ ἐστιν ὁ κύριος, ὃς στηρίξει ὑμᾶς καὶ φυλάξει ἀπὸ τοῦ πονηροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/003.yaml
  text: But the Lord is faithful[a], who will strengthen you and guard you from the evil one.
translation:
  language: ar
  text: أَمَّا الرَّبُّ فَأَمِينٌ، وَهُوَ سَيُثَبِّتُكُمْ وَيَحْرُسُكُمْ مِنَ الشِّرِّيرِ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «من الشر». فالعبارة اليونانية τοῦ πονηροῦ يمكن أن تُقرأ على أنها للمذكر، «الشرير»، أو للمحايد، «الشر».'
    reason: alternative_reading
lexical_decisions:
- source_word: πιστὸς
  choice: أمين
  rationale: صفة خبرية تعبّر عن ثبات الرب وجداراته بالثقة، في مقابلة عدم إيمان جميع الناس في السياق السابق.
- source_word: δέ
  choice: أمّا
  rationale: تُبرز المقابلة مع القول السابق إن الإيمان ليس للجميع، وتأتي طبيعية في العربية مع الفاء في جوابها.
- source_word: ὁ κύριος
  choice: الرب
  rationale: تنقل اللقب كما هو من غير تعيين زائد للمرجع؛ ويرجح في السياق البولسي أنه الرب يسوع.
- source_word: στηρίξει
  choice: سيثبّتكم
  rationale: يحفظ معنى جعل المؤمنين راسخين أقوياء، وهو أدق هنا من تعبير قد يقتصر على التقوية الجسدية.
- source_word: φυλάξει
  choice: يحرسكم
  rationale: ينقل معنى الحراسة الفاعلة والحفظ من الخطر، وينسجم مع العبارة التالية.
- source_word: ἀπὸ
  choice: من
  rationale: ينقل معنى الحفظ بعيدًا عن الخطر أو من سلطانه.
- source_word: τοῦ πονηροῦ
  choice: الشرير
  rationale: الصيغة اليونانية تحتمل المذكر «الشرير» والمحايد «الشر». اختير المعنى الشخصي في المتن مع إبقاء الاحتمال الآخر في الحاشية.
theological_decisions:
- issue: مرجع τοῦ πονηροῦ
  choice: الشرير
  alternative: الشر
  rationale: الصيغة اليونانية ملتبسة نحويًا بين المذكر والمحايد. يحافظ المتن على القراءة الشخصية الشائعة في استعمال العهد الجديد، وتثبت الحاشية القراءة المجردة الممكنة دون حسم الغموض.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُعمل تركيب «أمّا... فـ» لإظهار المقابلة طبيعيًا، واختير «سيثبّتكم ويحرسكم» للمحافظة على توازي الفعلين ووعدهما المستقبلي.
