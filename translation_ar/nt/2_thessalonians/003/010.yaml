  text: καὶ γὰρ ὅτε ἦμεν πρὸς ὑμᾶς, τοῦτο παρηγγέλλομεν ὑμῖν, ὅτι εἴ τις οὐ θέλει ἐργάζεσθαι μηδὲ ἐσθιέτω.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/010.yaml
  text: 'For even when we were with you, we kept commanding you this: if anyone is not willing to work, neither let him eat.'
translation:
  language: ar
  text: 'فإننا، حتى عندما كنا معكم، كنا نأمركم بهذا: إن كان أحد لا يريد أن يعمل[a]، فلا يأكل أيضًا[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: المقصود عدم الرغبة في العمل، لا العجز عنه.
    reason: lexical_alternative
  - marker: b
    text: 'أو: فلا يأكل.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: فإننا، حتى
  rationale: تنقل الفاء التعليلية قوة γάρ الرابطة بما سبق، وتنقل «حتى» توكيد καί في سياق الإشارة إلى وقت وجود الرسل بينهم.
- source_word: ὅτε ἦμεν πρὸς ὑμᾶς
  choice: حين كنا معكم
  rationale: تؤدي πρός مع الأشخاص هنا معنى الوجود في صحبتهم، وهذه صياغة عربية طبيعية وواضحة.
- source_word: τοῦτο παρηγγέλλομεν ὑμῖν
  choice: كنا نأمركم بهذا
  rationale: الفعل يدل على إصدار أمر أو توجيه ملزم، وصيغة «كنا نأمركم» تحفظ دلالة الماضي الناقص على الفعل المستمر أو المتكرر دون تكلف.
- source_word: εἴ τις οὐ θέλει ἐργάζεσθαι
  choice: إن كان أحد لا يريد أن يعمل
  rationale: تحفظ العبارة دلالة θέλει على الإرادة والرغبة، فلا تحول المعنى إلى العجز عن العمل.
- source_word: μηδὲ ἐσθιέτω
  choice: فلا يأكل أيضًا
  rationale: تحفظ صيغة الأمر للغائب والقوة الرابطة في μηδέ؛ و«أيضًا» تبين أن الامتناع عن الأكل نتيجة موازية للامتناع الإرادي عن العمل.
theological_decisions:
- issue: هل يتناول القول العجز عن العمل أم عدم الرغبة فيه؟
  choice: لا يريد أن يعمل
  alternative: لا يستطيع أن يعمل
  rationale: θέλει يتعلق بالإرادة، ولذلك يخص النص من لا يرغب في العمل، لا من يعجز عنه.
- issue: قوة صيغة الأمر في نتيجة الشرط
  choice: فلا يأكل أيضًا
  alternative: فلا يُسمح له أن يأكل
  rationale: الصياغة المختارة تحفظ الأمر للغائب كما في اليونانية، من غير إدخال فاعل مسؤول عن المنع لم يذكره النص صراحة.
translation_notes:
  register: لغة عربية فصحى حديثة واضحة ورصينة. استُخدمت «كنا نأمركم» لإبراز قوة الفعل واستمرارية التوجيه، وحُفظ الشرط بصيغة عامة مفردة من غير إضافة تفسير طائفي أو اجتماعي غير منصوص عليه.
