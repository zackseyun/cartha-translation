  text: οὐχ ὅτι οὐκ ἔχομεν ἐξουσίαν, ἀλλ’ ἵνα ἑαυτοὺς τύπον δῶμεν ὑμῖν εἰς τὸ μιμεῖσθαι ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/009.yaml
  text: not because we do not have the right, but in order to give ourselves to you as an example for you to imitate us.
translation:
  language: ar
  text: لا لأننا لا نملك الحقَّ[a]، بل لكي نجعل أنفسنا قدوةً[b] لكم، كي تقتدوا بنا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «السلطة» أو «القوة». يرجّح السياق معنى الحق المشروع أو الاستحقاق.
    reason: lexical_alternative
  - marker: b
    text: أو «نموذجًا» أو «مثالًا يُحتذى».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξουσίαν
  choice: الحقَّ
  rationale: يدل السياق على استحقاق مشروع لنيل الإعالة، لا على مجرد القدرة أو النفوذ؛ و«الحق» أوضح تعبير عربي عن هذا المعنى هنا.
- source_word: ἑαυτοὺς
  choice: أنفسنا
  rationale: ضمير انعكاسي يعود إلى بولس ورفقائه، وتحافظ «أنفسنا» على دلالته المباشرة.
- source_word: τύπον
  choice: قدوةً
  rationale: يشير اللفظ هنا إلى نموذج في السلوك جدير بأن يُحتذى، و«قدوة» تؤدي هذا المعنى بوضوح وطبيعية.
- source_word: δῶμεν
  choice: نجعل
  rationale: التركيب اليوناني يعني حرفيًا إعطاء أنفسهم مثالًا؛ وتؤدي صيغة «نجعل أنفسنا قدوة» المقصود بصورة عربية طبيعية من غير تغيير في الفاعل أو الغاية.
- source_word: εἰς τὸ μιμεῖσθαι
  choice: كي تقتدوا
  rationale: يحمل التركيب معنى الغاية، و«كي» تصرّح بهذه الغاية بوضوح.
- source_word: μιμεῖσθαι ἡμᾶς
  choice: تقتدوا بنا
  rationale: ينقل معنى محاكاتهم باتباع سلوكهم، وهو تعبير عربي طبيعي يحفظ القوة النموذجية للفعل.
- source_word: οὐχ ὅτι οὐκ
  choice: لا لأننا لا
  rationale: يحافظ على النفي المزدوج بوصفه توضيحًا للدافع، ويمهّد للمقابلة مع الغاية الإيجابية.
- source_word: ἀλλ’ ἵνα
  choice: بل لكي
  rationale: يبرز الانتقال من نفي الدافع السابق إلى بيان الغاية المقصودة.
theological_decisions:
- issue: طبيعة الاستحقاق في ἐξουσίαν
  choice: يؤكد بولس أن له ولرفقائه حقًا مشروعًا في الإعالة، مع أنهم لم يستعملوه في هذا المقام.
  alternative: قد يُفهم اللفظ بمعنى أوسع هو السلطة أو الصلاحية الرسولية.
  rationale: يتناول السياق عملهم بأيديهم كي لا يثقلوا على أحد، ولذلك يتقدم معنى الاستحقاق المشروع للإعالة. ولا توسّع الصياغة هذا القول إلى تقرير أشمل عن السلطة الرسولية.
translation_notes:
  register: صياغة عربية فصحى معاصرة وواضحة، تحافظ على المقابلة البلاغية بين نفي الدافع وبيان الغاية. استُعملت «قدوة» لتلائم سياق الاقتداء، مع إثبات البدائل المعجمية في الحاشية.
