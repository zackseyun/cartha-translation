  text: Τὸ λοιπὸν προσεύχεσθε, ἀδελφοί, περὶ ἡμῶν, ἵνα ὁ λόγος τοῦ κυρίου τρέχῃ καὶ δοξάζηται καθὼς καὶ πρὸς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/001.yaml
  text: Finally[a], brothers, pray for us, that the word of the Lord may spread rapidly and be honored, just as it was among you[b],
translation:
  language: ar
  text: أخيرًا، صلّوا أيها الإخوة[a] من أجلنا، لكي تنتشر كلمة الرب سريعًا وتُكرَم، كما كان الأمر عندكم أيضًا،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أن يشمل لفظ «الإخوة» الإخوة والأخوات؛ فاليونانية تقول حرفيًا «الإخوة»، وقد يُخاطَب به جميع أفراد الكنيسة على سبيل التمثيل.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὸ λοιπὸν
  choice: أخيرًا
  rationale: علامة خطابية مألوفة تُدخل القسم الختامي من الرسالة، وهي أ自然 في العربية من الترجمة الحرفية «أما الباقي».
- source_word: προσεύχεσθε
  choice: صلّوا
  rationale: فعل أمر للجمع يدعو إلى الصلاة؛ وصيغة الأمر العربية واضحة، ولا يلزم إثقالها بعبارة تصرّح بالاستمرار.
- source_word: ἀδελφοί
  choice: أيها الإخوة
  rationale: يحافظ على صيغة النداء المذكرة في اليونانية، مع بيان احتمال شمول الخطاب للكنيسة كلها في الحاشية.
- source_word: περὶ ἡμῶν
  choice: من أجلنا
  rationale: التعبير العربي الطبيعي مع فعل الصلاة، بدلًا من «بشأننا» الحرفية.
- source_word: ἵνα
  choice: لكي
  rationale: ينقل معنى الغاية أو النتيجة المقصودة في طلب الصلاة.
- source_word: ὁ λόγος τοῦ κυρίου
  choice: كلمة الرب
  rationale: يحفظ التعبير الكتابي والإضافة اليونانية، ويمكن أن يدل على البشارة المعلنة من الرب أو عنه.
- source_word: τρέχῃ
  choice: تنتشر ... سريعًا
  rationale: الفعل يعني حرفيًا «تجري»، لكنه هنا استعارة لسرعة تقدّم كلمة الرب وانتشارها؛ والصياغة المختارة توضح المعنى في العربية المعاصرة.
- source_word: δοξάζηται
  choice: تُكرَم
  rationale: ينقل في هذا السياق معنى أن تُستقبل كلمة الرب بالتوقير والتقدير؛ وتوضح الحاشية اللفظ الحرفي «تُمجَّد».
- source_word: καθὼς καὶ πρὸς ὑμᾶς
  choice: كما حدث عندكم أيضًا
  rationale: صياغة عربية طبيعية تستكمل الفعل المضمر في المقارنة، وتحفظ καί بلفظ «أيضًا».
theological_decisions:
- issue: دلالة ἀδελφοί في خطاب جماعي للكنيسة
  choice: أيها الإخوة
  alternative: أيها الإخوة والأخوات
  rationale: أُبقيت الصيغة المذكرة الواردة في الأصل، من غير توسيعها داخل المتن، مع الإشارة في الحاشية إلى إمكان استعمالها تمثيليًا للجماعة كلها.
- issue: استعارة τρέχῃ في وصف تقدّم كلمة الرب
  choice: تنتشر ... سريعًا
  alternative: تجري
  rationale: التكافؤ الأمثل يقدّم المعنى المقصود بوضوح، بينما تُحفظ الصورة الحرفية في الحاشية كي لا تضيع الاستعارة الأصلية.
- issue: معنى δοξάζηται عند إسناده إلى كلمة الرب
  choice: تُكرَم
  alternative: تُمجَّد
  rationale: «تُكرَم» طبيعية في العربية عند الحديث عن تلقّي الرسالة بالتوقير، مع إبقاء «تُمجَّد» بوصفها المقابل الحرفي في الحاشية وعدم حسم مدى الدلالة لاهوتيًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت صياغة طبيعية مع الحفاظ في الحواشي على الاستعارة اليونانية والبدائل المعجمية المهمة.
