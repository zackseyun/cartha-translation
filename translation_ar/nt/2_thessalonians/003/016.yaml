  terminology: «الرب»، و«رب السلام»، و«السلام» اختيارات سليمة ومحافظة على عدم تعيين مرجع «الرب» بما يتجاوز النص. و«نفسه» تحفظ وظيفة αὐτός التوكيدية.
  issues:
