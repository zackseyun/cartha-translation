  text: Αὐτὸς δὲ ὁ κύριος τῆς εἰρήνης δῴη ὑμῖν τὴν εἰρήνην διὰ παντὸς ἐν παντὶ τρόπῳ. ὁ κύριος μετὰ πάντων ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/016.yaml
  text: May the Lord of peace himself give you peace at all times in every way[b][a]. The Lord be with all of you.
translation:
  language: ar
  text: ولْيمنحكم ربُّ السلام نفسه السلامَ في كل حين[a] وبكل طريقة[b]. وليكن الرب معكم جميعًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «على الدوام».
    reason: lexical_alternative
  - marker: b
    text: أو «من كل وجه».
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτὸς
  choice: نفسه
  rationale: استعمال توكيدي يعود إلى «رب السلام»، ويحفظ التشديد على أن الرب ذاته هو الذي يمنح السلام.
- source_word: δὲ
  choice: الربط بالسياق دون أداة مستقلة
  rationale: تفيد انتقالًا خفيفًا إلى البركة الختامية، ولا يلزم في العربية إظهارها بكلمة مثل «أما الآن»؛ فبدء الجملة بلام الدعاء يؤدي الانتقال طبيعيًا.
- source_word: ὁ κύριος
  choice: الرب
  rationale: يحفظ اللقب كما ورد في النص من غير توسيع تفسيري.
- source_word: τῆς εἰρήνης
  choice: السلام
  rationale: حُفظ التركيب الإضافي في «رب السلام»، وهو تعبير لقبي موجز وطبيعي في العربية.
- source_word: δῴη
  choice: ولْيمنحكم
  rationale: صيغة المضارع المقترن بلام الدعاء تنقل قوة صيغة التمني في البركة، لا مجرد تقرير وقوع الفعل.
- source_word: τὴν εἰρήνην
  choice: السلام
  rationale: إثبات أداة التعريف طبيعي في العربية ويحافظ على تكرار لفظ السلام في العبارة.
- source_word: διὰ παντὸς
  choice: في كل حين
  rationale: ينقل الدلالة الزمنية المستمرة بوضوح، مع إثبات البديل «على الدوام» في الحاشية.
- source_word: ἐν παντὶ τρόπῳ
  choice: من كل وجه
  rationale: تعبير عربي طبيعي نسبيًا يحفظ سعة معنى الكيفية أو الوجه من غير حصره في وسائل محددة.
- source_word: μετὰ πάντων ὑμῶν
  choice: معكم جميعًا
  rationale: يحفظ شمول πάντων ويجري بسلاسة في العربية المعاصرة.
theological_decisions:
- issue: مرجع لقب «الرب» في البركة
  choice: الإبقاء على «الرب» من غير إضافة اسم يحدد المرجع
  alternative: «الرب يسوع» أو تعميم المرجع صراحةً إلى الله
  rationale: النص اليوناني يذكر «الرب» وحده. وقد يرجح السياق البولسي الإشارة إلى الرب يسوع، لكن الترجمة لا ينبغي أن تضيف ما لم يصرح به النص.
- issue: قوة العبارة الختامية الاسمية
  choice: «الرب معكم جميعًا» بوصفها بركة ودعاءً مفهومًا من السياق
  alternative: 'صياغتها خبرًا صريحًا: «الرب هو معكم جميعًا»، أو إضافة فعل دعائي: «ليكن الرب معكم جميعًا»'
  rationale: اليونانية لا تذكر فعلًا في العبارة الأخيرة، وسياق البركة يحمل معنى التمني. تحافظ الجملة الاسمية العربية على إيجاز الأصل وتسمح بقوة الدعاء من غير تحويلها صراحةً إلى تقرير خبري.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعملت لام الدعاء في «ولْيمنحكم» لنقل صيغة البركة، وحُفظ التوكيد في «نفسه» والشمول في «جميعًا». وُضعت علامتا الحاشيتين مباشرة بعد العبارتين اللتين تشرحانهما.
