lexical_decisions:
- source_word: ῥυσθῶμεν
  choice: نُنقَذ
  rationale: 'صيغة المبني للمجهول بعد ἵνα تفيد الغرض: «وأن نُنقَذ». وهذا يحفظ معنى التخليص من أذى الخصوم من غير تحديد وسيلة النجاة.'
- source_word: ἀτόπων
  choice: المنحرفين
  rationale: تنقل معنى الخروج عما هو لائق أو سوي، وتبقيها متميزة دلاليًا عن πονηρῶν. وأُثبت احتمال «غير العقلانيين» في الحاشية.
- source_word: πονηρῶν
  choice: الأشرار
  rationale: ترجمة عربية واضحة للمصطلح الأخلاقي الدال على الشر، وتنسجم طبيعيًا مع «المنحرفين».
- source_word: ἀνθρώπων
  choice: الناس
  rationale: اللفظة اليونانية العامة تعني البشر أو الناس، ولا يقتضي السياق العربي هنا حصر الخصوم في الذكور.
- source_word: πίστις
  choice: الإيمان
  rationale: هو المعنى الأرجح في سياق معارضة الرسالة الرسولية، مع حفظ احتمال «الأمانة» في الحاشية.
- source_word: οὐ γὰρ πάντων ἡ πίστις
  choice: فليس الإيمان لدى الجميع
  rationale: صياغة عربية طبيعية قريبة من العبارة اليونانية الموجزة، وتحاشي تحويلها إلى تقرير لاهوتي أوسع من مدلول السياق.
theological_decisions:
- issue: دلالة πίστις في العبارة الموجزة
  choice: الإيمان
  alternative: الأمانة؛ «فليس الجميع أمناء»
  rationale: يشير السياق على الأرجح إلى أن الخصوم لا يؤمنون، لكن πίστις قد تدل أيضًا على الأمانة أو الموثوقية؛ لذلك حُفظ الاحتمال البديل في الحاشية بدل إلغاء التوتر الدلالي.
translation_notes:
  register: لغة عربية فصحى حديثة واضحة ووقورة. استُخدم «الناس» وفق الدلالة العامة لـ ἀνθρώπων، وحُفظ إيجاز الجملة اليونانية والتباس πίστις الحقيقي بحاشية موجزة.
