base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/012.yaml
  text: To such people we command and urge in the Lord Jesus the Messiah that[a], working quietly[c][b], they should eat their own bread.
translation:
  language: ar
  text: وأمّا أمثال هؤلاء، فنأمرهم ونحثّهم في الرب يسوع المسيح[a] أن يعملوا بهدوء ويأكلوا خبزهم الخاص.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أن تُفهم عبارة «في الرب يسوع المسيح» على أنها تشير إلى الارتباط به أو إلى سلطانه؛ ولذلك يمكن ترجمتها أيضًا: «بسلطان الرب يسوع المسيح».'
    reason: semantic_ambiguity
lexical_decisions:
- source_word: τοῖς δὲ τοιούτοις
  choice: وأمّا أمثال هؤلاء
  rationale: تشير العبارة إلى الأشخاص الموصوفين قبلًا، وتنقل δέ بوصفها انتقالًا خفيفًا في الخطاب، لا ظرفًا زمنيًا بمعنى «الآن».
- source_word: παραγγέλλομεν καὶ παρακαλοῦμεν
  choice: فنأمرهم ونحثّهم
  rationale: يحفظ الفعلان معًا قوة الأمر الرسولي وحرارة الحث، من غير دمجهما في فعل عام واحد.
- source_word: ἐν κυρίῳ Ἰησοῦ Χριστῷ
  choice: في الرب يسوع المسيح
  rationale: تحافظ «في» على سعة دلالة ἐν، التي قد تشير إلى المجال أو الارتباط أو السلطة، و«المسيح» تؤدي Χριστός بوصفه لقبًا.
- source_word: μετὰ ἡσυχίας ἐργαζόμενοι
  choice: أن يعملوا بهدوء
  rationale: صياغة عربية طبيعية تنقل العمل المصحوب بالهدوء والاستقرار، في مقابلة البطالة المشوشة الواردة في السياق.
- source_word: τὸν ἑαυτῶν ἄρτον ἐσθίωσιν
  choice: ويأكلوا خبزهم الخاص
  rationale: تحفظ صورة الخبز الملموسة وتؤدي الضمير الانعكاسي الدال على أن يكون قوتهم من عندهم، من غير إضافة تفسير «من عمل أيديهم» إلى المتن.
theological_decisions:
- issue: دلالة Χριστός
  choice: المسيح
  alternative: كريستوس أو اعتبار اللفظة جزءًا من الاسم فحسب
  rationale: اللفظة هنا لقب ذو دلالة، والصياغة العربية المألوفة «يسوع المسيح» تحافظ على هذا اللقب من غير فرض قراءة مذهبية خاصة.
- issue: قوة التوجيه الرسولي
  choice: الإبقاء على «نأمر» و«نحث» معًا
  alternative: اختزالهما إلى «نوصي» أو «نعلّم»
  rationale: يجمع النص عمدًا بين السلطة والرعاية الملحّة، ولذلك لا ينبغي تسطيح الفعلين في فعل واحد.
- issue: دلالة ἐν في عبارة «في الرب»
  choice: في الرب
  alternative: بسلطان الرب
  rationale: اختيار «في» لا يحصر العبارة في الوسيلة أو السلطة وحدها، بل يبقي احتمال المجال والارتباط بالرب حاضرًا.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت «وأمّا» للانتقال إلى الفئة المذكورة، و«بهدوء» لصياغة طبيعية غير متكلفة، مع إبقاء صورة «الخبز» بدل تعميمها إلى «الطعام» أو «القوت».
