  text: Παραγγέλλομεν δὲ ὑμῖν, ἀδελφοί, ἐν ὀνόματι τοῦ κυρίου ⸀ἡμῶν Ἰησοῦ Χριστοῦ στέλλεσθαι ὑμᾶς ἀπὸ παντὸς ἀδελφοῦ ἀτάκτως περιπατοῦντος καὶ μὴ κατὰ τὴν παράδοσιν ἣν ⸀παρελάβοσαν παρ’ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/006.yaml
  text: We command you[a], brothers, in the name of our Lord Jesus the Messiah[e][d][c][b], to keep away from every brother who is walking disorderly and not according to the tradition that they received from us.
translation:
  language: ar
  text: ونأمركم، أيها الإخوة[a]، باسم ربنا يسوع المسيح، أن تبتعدوا[b] عن كل أخ يسلك بلا انضباط[c]، ولا يسلك بحسب التقليد الذي تسلَّموه منا[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: وردت «الإخوة» في اليونانية بصيغة جمع المذكر، والخطاب موجَّه إلى جماعة الكنيسة كلها.
    reason: lexical_alternative
  - marker: b
    text: 'أو: «أن تمتنعوا عن مخالطة»؛ يفيد اليوناني أن ينأى المرء بنفسه عن الارتباط الوثيق.'
    reason: lexical_alternative
  - marker: c
    text: يمكن أن تُفهم أيضًا بمعنى «في كسل»، ولا سيما في ضوء سياق الأعداد التالية؛ لكن اللفظ اليوناني أوسع، ويدل على السلوك غير المنضبط أو الخارج عن النظام.
    reason: lexical_alternative
  - marker: d
    text: 'تقرأ بعض المخطوطات: «الذي تسلَّمتموه منا»، وتقرأ أخرى: «الذي تسلَّمه منا»، فتجعلان العبارة أنسب نحويًا لما قبلها. أما النص المطبوع فيقرأ بصيغة الجمع: «الذي تسلَّموه منا».'
    reason: textual_variant
lexical_decisions:
- source_word: Παραγγέλλομεν
  choice: نأمركم
  rationale: الفعل اليوناني يدل على توجيه مُلزِم صادر بسلطان، ولذلك تنقل «نأمركم» قوته أوضح من «نوصيكم».
- source_word: ἀδελφοί
  choice: أيها الإخوة
  rationale: حُفظ الجمع المذكر الوارد في اليونانية، مع بيان أن الخطاب موجَّه إلى الكنيسة كلها في الحاشية.
- source_word: ἐν ὀνόματι τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: باسم ربنا يسوع المسيح
  rationale: صياغة عربية طبيعية تحافظ على العبارة السلطانية والشعائرية «باسم»، وعلى لقب Χριστός بصيغته العربية المألوفة «المسيح».
- source_word: στέλλεσθαι ὑμᾶς ἀπὸ
  choice: أن تبتعدوا عن
  rationale: يفيد التركيب أن ينأى المخاطبون بأنفسهم عن المخالطة الوثيقة، من غير أن يُحمَّل وحده معنى الطرد الكنسي الرسمي.
- source_word: ἀτάκτως
  choice: بلا انضباط
  rationale: يحفظ المعنى الأوسع للسلوك الخارج عن النظام والانضباط؛ أما الكسل فهو احتمال يبرزه السياق اللاحق لكنه أضيق من اللفظ هنا.
- source_word: περιπατοῦντος
  choice: يسلك
  rationale: «يسلك» تعبير عربي كتابي مفهوم يحفظ استعارة المشي للدلالة على نهج الحياة والتصرف.
- source_word: παράδοσιν
  choice: التقليد
  rationale: ينقل معنى ما سُلِّم وتناقله المتلقون، ويظل سياق الآية محددًا له بوصفه ما نُقل عن الرسل.
- source_word: ἣν παρελάβοσαν παρ’ ἡμῶν
  choice: الذي تسلَّموه منا
  rationale: تتبع الصياغة قراءة SBLGNT بصيغة الغائب الجمع، وتحافظ على عدم التوافق الظاهر مع «كل أخ» المفرد بدل تسوية النص صمتًا.
theological_decisions:
- issue: دلالة Χριστοῦ في اللقب المسياني
  choice: المسيح
  alternative: المسيّا
  rationale: «المسيح» هو المقابل العربي الراسخ للقب Χριστός ويحافظ على معناه المسياني في عبارة «يسوع المسيح» من غير تحويله إلى تفسير طائفي.
- issue: مدى الابتعاد الذي يأمر به στέλλεσθαι ὑμᾶς ἀπὸ
  choice: أن تبتعدوا عن
  alternative: أن تنسحبوا من مخالطة
  rationale: يحفظ الاختيار قوة التأديب الاجتماعي، لكنه لا يحسم العبارة على أنها إجراء طرد كنسي رسمي لا يصرح به اللفظ نفسه.
- issue: عدم التوافق العددي في ἣν παρελάβοσαν
  choice: الذي تسلَّموه منا
  alternative: الذي تسلَّمه منا / الذي تسلَّمتموه منا
  rationale: اتباع صيغة الجمع في النص المطبوع يحفظ توتر القراءة وشذوذها النحوي النسبي، بينما تُذكر القراءات الميسِّرة في الحاشية.
translation_notes:
  register: العربية فصحى حديثة واضحة ووقورة. استُخدمت «نأمركم» لإبقاء قوة الأمر الرسولي، و«يسلك» للمحافظة على الاستعارة البولسية المألوفة، مع تجنب مصطلحات قانونية كنسية قد تجعل نطاق التأديب أضيق أو أشد مما يقوله النص.
