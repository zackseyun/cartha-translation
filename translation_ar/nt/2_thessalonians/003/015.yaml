  yaml_path: translation/nt/2_thessalonians/003/015.yaml
  text: And do not regard him as an enemy[b][a], but admonish him as a brother.
translation:
  language: ar
  text: ولا تَعُدُّوه عدوًّا، بل نَبِّهوه كأخٍ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «الأخ» هنا مؤمن آخر في الجماعة المسيحية، وقد يُراد باللفظ، على نحو تمثيلي، أيُّ عضوٍ فيها.
    reason: cultural_note
lexical_decisions:
- source_word: ἡγεῖσθε
  choice: تَعُدُّوه
  rationale: ينقل معنى الحكم على الشخص أو اعتباره في منزلة معينة، وهو تعبير عربي واضح وطبيعي.
- source_word: ἐχθρὸν
  choice: عدوًّا
  rationale: المقابل العربي المباشر الذي يحفظ فئة التقييم المقصودة بعد ὡς.
- source_word: νουθετεῖτε
  choice: أنذِروه
  rationale: يفيد التنبيه التحذيري بقصد التقويم، ويحفظ القوة الرعوية والتأديبية للفعل دون اختزاله في التعليم وحده.
- source_word: ἀδελφόν
  choice: أخٍ
  rationale: يحفظ الاسم المذكر المفرد في الأصل، وهو هنا وصف لعضو في جماعة المؤمنين.
- source_word: ὡς
  choice: كـ
  rationale: تؤدي معنى المعاملة أو الاعتبار بهذه الصفة في كلا طرفي المقابلة.
- source_word: καὶ μὴ ... ἀλλὰ
  choice: ولا ... بل ...
  rationale: تحفظ الصلة بما سبق والتقابل القوي بين رفض اعتباره عدوًّا ووجوب إنذاره كأخ.
theological_decisions:
- issue: الموقف التأديبي من المؤمن غير المطيع
  choice: 'يميز النص بين التقويم داخل الجماعة والعداء الشخصي: فلا يُعَدّ المخالف عدوًّا، بل يُنذَر مع استمرار اعتباره أخًا.'
  alternative: قد تُفهم العبارة نصيحة عامة في النزاعات الشخصية لا توجيهًا متعلقًا بتأديب الجماعة.
  rationale: يشير سياق 2 تسالونيكي 3:14–15 إلى شخص من داخل الجماعة يُتخذ تجاهه إجراء تقويمي، مع بقاء وصف «أخ» الذي يحفظ رابطة الجماعة دون تحويله إلى عدو.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «تَعُدُّوه» لتجنب جمود «تعتبروه»، و«أنذِروه» لإبراز التنبيه التصحيحي. وُضعت علامة الحاشية بعد «كأخ» لأنها تشرح مدلول هذا اللفظ.
