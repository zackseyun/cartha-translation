  text: ὁ δὲ κύριος κατευθύναι ὑμῶν τὰς καρδίας εἰς τὴν ἀγάπην τοῦ θεοῦ καὶ εἰς τὴν ὑπομονὴν τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/005.yaml
  text: May the Lord direct your hearts into the love of God and into the steadfastness of Messiah[a][b][c].
translation:
  language: ar
  text: وَلْيُوَجِّهْ الربُّ قلوبَكم إلى محبةِ الله[a] وإلى ثباتِ المسيح[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «محبتكم لله». ويمكن أن تعني العبارة اليونانية أيضًا «محبة الله لكم».
    reason: alternative_reading
  - marker: b
    text: أو «ثبات المسيح نفسه» أو «الثبات لأجل المسيح».
    reason: alternative_reading
  - marker: c
    text: اللفظة اليونانية Χριστός تعني «المسيح» وتُستعمل هنا لقبًا.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: الرب
  rationale: المقابل العربي الكتابي المألوف للقب، ويحفظ ثقله الإلهي والمسيحاني من غير أن يحدّد مرجعه بأكثر مما يحدّده النص.
- source_word: κατευθύναι
  choice: لْيُوَجِّه
  rationale: صيغة الدعاء في العربية تنقل فعل التمنّي أو الصلاة الذي تؤديه صيغة التمنّي اليونانية، و«يوجّه» طبيعية وتحفظ معنى الإرشاد نحو غاية.
- source_word: καρδίας
  choice: قلوبكم
  rationale: يحفظ الاستعارة الكتابية التي تجعل القلب مركز الفكر والإرادة والعاطفة، بدل تسطيحها بتعبير تفسيري.
- source_word: ἀγάπην
  choice: محبة
  rationale: مقابل عربي واضح ومألوف لـἀγάπη، ويلائم السياق الروحي من غير زيادة تفسيرية.
- source_word: τοῦ θεοῦ
  choice: الله
  rationale: الإضافة في «محبة الله» تبقي احتمال أن تكون المحبة من الله أو موجهة إليه، ولا تحسم وجه الإضافة اليونانية.
- source_word: ὑπομονὴν
  choice: ثبات
  rationale: ينقل معنى الصمود والمثابرة تحت الضغط، وهو موجز وطبيعي في تركيب «إلى ثبات...».
- source_word: τοῦ Χριστοῦ
  choice: المسيح
  rationale: تُرجم Χριστός بوصفه لقبًا إلى «المسيح». وتحافظ الإضافة في «ثبات المسيح» على القراءة التي تنسب الثبات إليه، مع بيان الاحتمالات الأخرى في الحاشية.
theological_decisions:
- issue: احتمال أوجه الإضافة في τὴν ἀγάπην τοῦ θεοῦ
  choice: محبة الله
  alternative: محبتكم لله؛ محبة الله لكم
  rationale: الإضافة اليونانية تحتمل أن تكون المحبة صادرة من الله أو موجهة إليه، وربما تشير على نحو أوسع إلى دائرة المحبة الإلهية؛ لذلك حُفظ التركيب الموجز في المتن ووُضحت الاحتمالات في الحاشية.
- issue: احتمال أوجه الإضافة في τὴν ὑπομονὴν τοῦ Χριστοῦ
  choice: ثبات المسيح
  alternative: الثبات لأجل المسيح؛ الثبات انتظارًا للمسيح؛ ثبات كالثبات الذي أظهره المسيح
  rationale: يمكن فهم الإضافة على أنها تشير إلى ثبات المسيح نفسه، أو إلى ثبات موجّه نحوه أو لأجله، أو إلى ثبات يتصف بصفته؛ فلا ينبغي حسم التوتر التفسيري في المتن.
- issue: ترجمة Χριστοῦ
  choice: المسيح
  alternative: كريستوس
  rationale: اللفظة لقب ذو معنى وليست مجرد اسم منقول صوتيًا، و«المسيح» هو مقابلها العربي الدقيق والمستقر.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت صيغة الدعاء «ولْيُوَجِّه» لنقل صيغة التمنّي اليونانية، مع إبقاء الإضافتين «محبة الله» و«ثبات المسيح» قدر الإمكان من غير حسم تفسيري. أُثبتت جميع علامات الحواشي في المتن.
