  - severity: medium
    issue: الحاشية تقترح معنى «هكذا يكون خطّي»
    rationale: العبارة οὕτως γράφω تعني حرفيًا «هكذا أكتب/بهذه الطريقة أكتب»؛ وقد يُستنتج ارتباطها بالخط من السياق، لكن لا يصح تقديم «يكون خطّي» بوصفه بديلًا ترجمياً مباشرًا.
  - severity: low
