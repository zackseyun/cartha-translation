  source_fidelity: 'النص اليوناني يفيد أن التحية مكتوبة بيد بولس نفسه وتعمل علامةً في كل رسالة، ثم يختم بعبارة موجزة: «هكذا أكتب». المسودة تنقل هذا المعنى إجمالًا، لكن تركيب «بيدي أنا بولس» يحتاج إلى فصلٍ أوضح للاسم بوصفه تعريفًا للكاتب.'
  naturalness: «التحية بيدي أنا، بولس» أفصح وأوضح في العربية الفصحى الحديثة من «بيدي أنا بولس»، إذ لا يلتبس فيها موقع «بولس» ولا يختل النسق.
  terminology: «التحية»، «علامة»، و«رسالة» مقابلات سليمة وطبيعية. لا حاجة إلى تحميل «هكذا أكتب» معنى محددًا عن شكل الخط. الحاشية الحالية التي تقترح «هكذا يكون خطّي» تتجاوز اللفظ اليوناني وتفسيره المحتمل.
  issues:
