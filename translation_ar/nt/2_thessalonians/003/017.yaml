  text: The greeting is by my own hand—Paul's—which is a sign in every letter[a]; this is how I write.
translation:
  language: ar
  text: التَّحِيَّةُ بِيَدِي أَنَا، بُولُسَ؛ وَهِيَ عَلَامَةٌ فِي كُلِّ رِسَالَةٍ. هَكَذَا أَكْتُبُ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بهذه الطريقة أكتب». والعبارة موجزة، وقد تشير إلى طريقة الكتابة أو إلى هذه الصيغة المكتوبة بوصفها علامةً للتوثيق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ ἀσπασμὸς
  choice: التَّحِيَّةُ
  rationale: يدل اللفظ على التحية في سياق ختام الرسالة، و«التحية» تعبير عربي فصيح وطبيعي.
- source_word: τῇ ἐμῇ χειρὶ Παύλου
  choice: بِيَدِي أَنَا بُولُسَ
  rationale: ينقل الداتيف معنى الكتابة بخط بولس نفسه، ويحافظ على ذكر اسمه بوصفه تعريفًا توكيديًا للمتكلم.
- source_word: σημεῖον
  choice: عَلَامَةٌ
  rationale: المقصود علامة دالة تُعرِّف كتابة بولس وتوثّق الرسالة؛ و«علامة» هي المقابل العربي المباشر والواضح.
- source_word: ἐν πάσῃ ἐπιστολῇ
  choice: فِي كُلِّ رِسَالَةٍ
  rationale: يحافظ على عموم العبارة اليونانية، مع استعمال «رسالة» المألوف في العربية الحديثة.
- source_word: οὕτως γράφω
  choice: هَكَذَا أَكْتُبُ
  rationale: ترجمة موجزة وقريبة من الأصل، وتحفظ إمكان دلالة οὕτως على الكيفية أو على الإشارة إلى الصيغة المكتوبة أمام القارئ.
theological_decisions:
- issue: مدى دلالة صيغة الكتابة بخط بولس
  choice: تُعرض التحية المكتوبة بيده على أنها علامة في كل رسالة، من غير توسيعها إلى دعوى عن أسلوبه كله.
  alternative: 'يمكن فهم الجملة الأخيرة على نحو أضيق: «وهكذا أكتب الآن»، أو تفسيرها بأنها تشير إلى هيئة خطه بوصفها وسيلة توثيق.'
  rationale: السياق يؤيد وظيفة التوثيق، لكن العبارة اليونانية الموجزة لا تحدد بدقة هل «هكذا» تشير إلى هيئة الخط أم إلى هذه الصيغة بعينها؛ لذلك حُفظ إيجازها وغموضها المشروع.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «بيدي أنا بولس» لإبراز أن بولس كتب التحية شخصيًا، مع إبقاء «هكذا أكتب» موجزة وقريبة من تركيب الأصل.
