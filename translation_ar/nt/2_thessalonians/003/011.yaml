  rationale: ينقل معنى التصرف المخالف للنظام أو الترتيب، من غير حصره في الكسل وحده؛ ويوضح السياق جانب البطالة.
- source_word: μηδὲν ἐργαζομένους
  choice: فلا يعملون شيئًا
  rationale: يحفظ نفي أي عمل مع إبراز μηδέν، ويهيئ للمقابلة اللفظية مع الفعل التالي.
- source_word: ἀλλὰ περιεργαζομένους
  choice: بل يتدخلون في شؤون غيرهم
  rationale: ينقل المقابلة القوية ومعنى الانشغال المتطفل بأمور الآخرين، وإن تعذر نقل التلاعب الاشتقاقي اليوناني كاملًا في المتن.
