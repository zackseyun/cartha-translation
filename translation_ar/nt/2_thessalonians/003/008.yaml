  text: nor did we eat bread from anyone free of charge[a], but with labor and hardship, working night and day so as not to burden any of you.
translation:
  language: ar
  text: ولم نأكل خبزًا من أحد مجانًا[a]، بل كنا نعمل ليلًا ونهارًا بكدّ ومشقّة، لكيلا نثقل على أحد منكم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ولم نأكل خبز أحد بلا مقابل». أبقى اليوناني لفظ «الخبز» حرفيًا، مع أنه قد يشير على نحو أوسع إلى الطعام أو الإعالة المادية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δωρεὰν
  choice: مجانًا
  rationale: تفيد الظرفية نيل الشيء بلا مقابل؛ و«مجانًا» تعبير عربي واضح يحفظ الدلالة الاقتصادية في السياق.
- source_word: ἄρτον
  choice: خبزًا
  rationale: المعنى الحرفي هو «خبز»، وقد يُراد به الطعام أو الإعالة عمومًا. إبقاء اللفظ الملموس يحفظ صورة الأصل.
- source_word: παρά τινος
  choice: من أحد
  rationale: تفيد παρά مع المضاف إليه المصدر، وτινος نكرة؛ فالصياغة العربية تنقل نفي الأخذ من أي شخص.
- source_word: ἐν κόπῳ καὶ μόχθῳ
  choice: بكدّ ومشقّة
  rationale: اللفظان متقاربان ويؤكدان الجهد الشاق والمعاناة؛ والجمع بين «كدّ» و«مشقّة» يحفظ القوة التراكمية بعبارة عربية طبيعية.
- source_word: νυκτὸς καὶ ἡμέρας
  choice: ليلًا ونهارًا
  rationale: تعبير زمني يدل على العمل المتواصل عبر الليل والنهار، وهذه هي الصياغة العربية المألوفة.
- source_word: ἐργαζόμενοι
  choice: كنا نعمل
  rationale: اسم الفاعل يصف ما كان يفعله بولس ورفيقاه لتأمين معيشتهما؛ وصيغة «كنا نعمل» طبيعية في العربية وتوضح الاستمرار.
- source_word: πρὸς τὸ μὴ ἐπιβαρῆσαί
  choice: لكيلا نثقل على
  rationale: التركيب يدل على الغرض، والفعل هنا يشير إلى فرض عبء مادي أو مالي؛ و«لكيلا نثقل على» يحفظ الاستعارة والدلالة السياقية.
- source_word: τινα ὑμῶν
  choice: أحد منكم
  rationale: النكرة المفردة مع ضمير الجمع تفيد أي فرد منهم، وهو ما تنقله العبارة العربية بوضوح.
- source_word: οὐδὲ ... ἀλλ’
  choice: ولم ... بل
  rationale: يحفظ هذا التركيب المقابلة القوية بين عدم تلقي الإعالة بلا مقابل وبين العمل الشاق.
