  text: Εἰ δέ τις οὐχ ὑπακούει τῷ λόγῳ ἡμῶν διὰ τῆς ἐπιστολῆς, τοῦτον σημειοῦσθε, ⸀μὴ ⸀συναναμίγνυσθαι αὐτῷ, ἵνα ἐντραπῇ·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/014.yaml
  text: And if anyone does not obey our word through this letter[a], take note of that person; do not associate with him[d][c][b], so that he may be ashamed.
translation:
  language: ar
  text: وَإِنْ كَانَ أَحَدٌ لَا يُطِيعُ كَلَامَنَا الْمُبَلَّغَ بِهَذِهِ الرِّسَالَةِ[a]، فَضَعُوا عَلَامَةً عَلَى ذَلِكَ الشَّخْصِ[b]، وَلَا تُخَالِطُوهُ[c]، لِكَيْ يَخْجَلَ[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كلامنا الوارد في هذه الرسالة» أو «كلامنا بواسطة هذه الرسالة». يمكن أن تدل العبارة اليونانية على أن الرسالة هي الوسيلة التي وصل بها الكلام.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «لاحظوا ذلك الشخص» أو «ميّزوه».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «لا تصاحبوه».'
    reason: lexical_alternative
  - marker: d
    text: المقصد تصحيحي؛ قارن العدد 15، حيث يُطلَب منهم أن ينذروه «كأخ».
    reason: cross_reference
lexical_decisions:
- source_word: ὑπακούει
  choice: يُطِيعُ
  rationale: الفعل يدل هنا على الامتثال لكلام ذي سلطان، و«يطيع» هو المقابل العربي الواضح والطبيعي في سياق الوصية الرسولية.
- source_word: τῷ λόγῳ ἡμῶν
  choice: كَلَامَنَا
  rationale: يشير λόγος هنا إلى كلام الرسل وتعليمهم، و«كلامنا» يحافظ على صياغة الأصل من غير أن يضيّق المعنى إلى وصية واحدة.
- source_word: διὰ τῆς ἐπιστολῆς
  choice: الَّذِي فِي هَذِهِ الرِّسَالَةِ
  rationale: تحتمل العبارة اليونانية الوسيلة أو المجال الذي وصل فيه الكلام. الصياغة العربية المختارة طبيعية وتربط الكلام بمضمون الرسالة الحاضرة، مع بيان البديل الأدق من جهة الوسيلة في الحاشية.
- source_word: σημειοῦσθε
  choice: فَضَعُوا عَلَيْهِ عَلَامَةً
  rationale: يفيد الأمر تمييز الشخص وتحديده بحيث يكون معروفًا لدى الجماعة؛ وهذه الصياغة تحفظ صورة «العلامة» في الأصل وتبقى مفهومة بالعربية المعاصرة.
- source_word: τοῦτον
  choice: عَلَيْهِ
  rationale: الضمير يعود تحديدًا إلى الشخص الذي لا يطيع، وقد أُدمج طبيعيًا في العبارة العربية «ضعوا عليه علامة».
- source_word: μὴ συναναμίγνυσθαι αὐτῷ
  choice: وَلَا تُخَالِطُوهُ
  rationale: الفعل يعني الاختلاط أو المعاشرة والمصاحبة. «لا تخالطوه» موجزة وطبيعية وتحفظ قوة التوجيه من غير تحويله إلى مصطلح كنسي تقني.
- source_word: ἐντραπῇ
  choice: يَخْجَلَ
  rationale: يدل المبني للمجهول هنا على أن يشعر الشخص بالخجل أو الحياء. «يخجل» يؤدي الغرض المقصود من غير أن يوحي بأن الإذلال غاية في ذاته.
- source_word: τις
  choice: أَحَدٌ
  rationale: الضمير نكرة عام في شرط مفتوح، و«أحد» هو التعبير العربي الطبيعي في هذا التركيب.
- source_word: αὐτῷ
  choice: ـهُ
  rationale: الضمير المفرد يعود إلى الشخص المذكور، وحُفظ في العربية بضمير المذكر المفرد وفق صيغة الأصل.
theological_decisions:
- issue: طبيعة الإجراء الذي يأمر به التعبير μὴ συναναμίγνυσθαι αὐτῷ
  choice: امتناع الجماعة عن مخالطة المؤمن غير المطيع بوصفه إجراءً تأديبيًا تصحيحيًا، من غير تعريفه تقنيًا بأنه حكم نهائي أو صيغة كنسية لاحقة.
  alternative: اعتباره حرمانًا كنسيًا كاملًا بالمعنى التقني الأقوى، أو مجرد تجنب اجتماعي عابر لا بُعد جماعيًا له.
  rationale: الآية التالية تأمر بعدم عده عدوًا بل بإنذاره كأخ، مما يبيّن المقصد التصحيحي، بينما يظل مدى عدم المخالطة غير محدد تفصيلًا في النص.
- issue: قوة ἐντραπῇ
  choice: الخجل المقصود نتيجة تأديبية يُرجى منها الرجوع والتصحيح.
  alternative: الإذلال العلني بوصفه غاية في ذاته.
  rationale: أداة الغاية ἵνα والسياق التالي يدلان على قصد علاجي؛ لذلك تحفظ «لكي يخجل» الجدية الأخلاقية من دون إدخال غاية انتقامية غير منصوص عليها.
translation_notes:
  register: صياغة عربية فصحى حديثة واضحة وموقرة. استُخدم ضبط محدود لتسهيل القراءة، مع الحفاظ على بناء الشرط والأمر والغاية. لم تُستعمل مصطلحات كنسية تقنية لا يفرضها النص، وأُبقي مدى عدم المخالطة مفتوحًا كما في اليونانية.
