lexical_decisions:
- source_word: ὑμεῖς δέ
  choice: أمّا أنتم
  rationale: تفيد δέ المقابلة مع الكلام السابق عن المتكاسلين، ويبرز الضمير المتقدم ὑμεῖς المخاطَبين؛ وتحفظ «أمّا أنتم» المقابلة والتوكيد طبيعيًّا.
- source_word: ἀδελφοί
  choice: أيها الإخوة
  rationale: اللفظ اليوناني نداء جمع مذكر بمعنى «الإخوة»، وهو في سياق مخاطبة الكنيسة يمكن أن يشمل جماعة المؤمنين كلها؛ أُبقي اللفظ الصريح في المتن ووُضّح شموله المحتمل في الحاشية.
- source_word: μὴ ἐγκακήσητε
  choice: فلا تفتروا
  rationale: التركيب نهي، والفعل يدل على الوهن أو فقدان العزم في مواصلة العمل. «لا تفتروا» تعبير عربي موجز يحفظ معنى عدم التراخي والاستسلام للإعياء.
- source_word: καλοποιοῦντες
  choice: عن فعل الخير
  rationale: اسم الفاعل المضارع يصف النشاط المستمر الذي ينبغي ألا يفتروا فيه. ويتطلب الفعل العربي «فتر» حرف الجر «عن»، فتأتي العبارة طبيعية مع بقاء معنى المواظبة على عمل الخير.
theological_decisions:
- issue: دلالة ἀδελφοί في خطاب جماعة المؤمنين
  choice: أيها الإخوة
  alternative: أيها الإخوة والأخوات
  rationale: الصيغة اليونانية مذكّرة جمعًا، مع احتمال قوي أن تكون خطابًا شاملًا للكنيسة كلها. يحافظ المتن على صورة الأصل، بينما تبيّن الحاشية الدلالة الشاملة المحتملة من غير حسم ما يتركه الاستعمال للسياق.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «أمّا أنتم» لإبراز المقابلة، و«لا تفتروا» لصياغة نهي طبيعي موجّه إلى الجمع، مع تجنب العبارات المذهبية أو التفسيرية الزائدة.
