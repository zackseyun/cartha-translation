translation:
  language: ar
  text: الذي بذل نفسه فديةً عن الجميع[a]، الشهادة في أوقاتها المعيَّنة[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «نيابةً عن الجميع». يحفظ لفظ «الجميع» عموم التعبير اليوناني من غير أن يحسم هل المراد كل فرد أم جميع فئات الناس.'
    reason: alternative_reading
  - marker: b
    text: 'حرفيًا: «الشهادة في أوقاتها الخاصة». العبارة اليونانية مكثفة، وقد تعني أن بذل المسيح نفسه هو الشهادة التي ظهرت في الأزمنة المعيَّنة لها.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δοὺς
  choice: بذل
  rationale: اسم الفاعل اليوناني يصف عمل «الإنسان المسيح يسوع» المذكور في الآية السابقة. و«بذل نفسه» تعبير عربي طبيعي يحفظ معنى العطاء الطوعي للنفس.
- source_word: ἑαυτὸν
  choice: نفسه
  rationale: يحفظ الضمير الانعكاسي والتوكيد على أن المسيح قدّم ذاته.
- source_word: ἀντίλυτρον
  choice: فديةً
  rationale: يدل اللفظ على ثمن الفداء، وتحمل السابقة ἀντί- إيحاءً بالمقابلة أو النيابة. «فدية» تؤدي المعنى الأساسي بوضوح من غير إدخال شرح عقائدي موسع في المتن.
- source_word: ὑπὲρ πάντων
  choice: عن الجميع
  rationale: «عن» تلائم اقتران العبارة بالفدية في العربية، وتحفظ معنى النيابة واتساع πάντων من غير حسم هل المقصود كل فرد أم جميع الفئات.
- source_word: τὸ μαρτύριον
  choice: وهذه هي الشهادة
  rationale: العبارة اليونانية مكثفة، ويُفهم الاسم على أنه بدل أو استئناف يصف بذل المسيح لنفسه بأنه الشهادة. أضيف اسم الإشارة والضمير الرابط لإظهار هذه الصلة في عربية طبيعية من غير إضافة فعل حدثي غير موجود في الأصل.
- source_word: καιροῖς ἰδίοις
  choice: في أوقاتها المعيَّنة
  rationale: يعكس الجمع καιροῖς، وتؤدي «المعيَّنة» معنى الأزمنة الخاصة أو الملائمة في السياق، مع إبقاء العبارة مرتبطة بالشهادة من غير التصريح بمن عيّنها.
theological_decisions:
- issue: مدى πάντων في صلة فدية المسيح
  choice: عن الجميع
  alternative: عن كل إنسان؛ عن جميع فئات الناس
  rationale: يحفظ النص لفظ العموم كما هو، ولا يحسم الجدل اللاحق بين شموله كل فرد وشموله جميع أصناف البشر.
- issue: القوة النيابية في ἀντίλυτρον
  choice: فدية
  alternative: فدية بديلة؛ فدية في مقابل الجميع
  rationale: يحمل اللفظ معنى الفداء مع إيحاء بالمقابلة والنيابة، لكن توسيع المتن قد يحوله إلى تفسير عقائدي يتجاوز مقدار التصريح في العبارة اليونانية.
- issue: صلة «الشهادة» ببذل المسيح نفسه
  choice: وهذه هي الشهادة
  alternative: الشهادة في أوقاتها المعيَّنة؛ شهادةً في الأوقات المعيَّنة
  rationale: يُقرأ التركيب المكثف بوصفه استئنافًا أو بدلًا يشير إلى بذل المسيح نفسه. الصياغة العربية توضّح الإحالة، مع بقاء الاحتمال النحوي موثقًا في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. اختير «بذل نفسه» بدل ترجمة آلية أثقل، وفُكّ التركيب الاسمي المكثف بعبارة «وهذه هي» لتوضيح البدل أو الاستئناف دون إضافة فعل مثل «أُدِّيت» لا يرد صراحة في اليونانية.
