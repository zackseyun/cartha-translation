  text: σωθήσεται δὲ διὰ τῆς τεκνογονίας, ἐὰν μείνωσιν ἐν πίστει καὶ ἀγάπῃ καὶ ἁγιασμῷ μετὰ σωφροσύνης.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/015.yaml
  text: Yet she will be saved through childbearing[c][b][a], if they continue in faith and love and holiness with self-control.
translation:
  language: ar
  text: لكنها ستُخلَّص من خلال الإنجاب[a]، إن ثبتنَ[c] في الإيمان[b] والمحبة والقداسة مع ضبط النفس.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «من خلال الولادة». يفهم بعضهم العبارة على أنها تشير إلى ولادة محددة، وربما ولادة المسيح، لكن يمكن أيضًا فهمها فهمًا عامًا بمعنى الإنجاب.'
    reason: alternative_reading
  - marker: b
    text: يمكن أيضًا فهم «الإيمان» هنا بمعنى «الأمانة».
    reason: lexical_alternative
  - marker: c
    text: ينتقل النص اليوناني من المفرد «ستُخلَّص» إلى الجمع «إن ثبتنَ».
    reason: lexical_alternative
lexical_decisions:
- source_word: σωθήσεται
  choice: ستُخلَّص
  rationale: يحافظ الفعل المبني للمجهول على المعنى المعتاد لـσῴζω في الاستعمال البولسي، من غير حصره في السلامة الجسدية.
- source_word: δὲ
  choice: لكنها
  rationale: تفيد δέ انتقالًا ذا مسحة تقابل مع الكلام السابق، و«لكن» تؤديه بوضوح من غير مبالغة.
- source_word: διὰ τῆς τεκνογονίας
  choice: من خلال الإنجاب
  rationale: تفيد τεκνογονία إنجاب الأولاد؛ وهذه الصياغة عربية طبيعية وتحافظ على دلالة الوساطة في διά، مع إبقاء احتمال فهم العبارة على ولادة بعينها في الحاشية.
- source_word: ἐὰν μείνωσιν
  choice: إن ثبتنَ
  rationale: تؤدي أداة الشرط ومعنى الاستمرار أو البقاء، كما تُظهر صيغة جمع المؤنث التحول من المفرد إلى الجمع في اليونانية.
- source_word: ἐν πίστει
  choice: في الإيمان
  rationale: «الإيمان» هو المقابل المعتاد لـπίστις، مع التنبيه إلى احتمال معنى الأمانة في الحاشية.
- source_word: ἀγάπῃ
  choice: المحبة
  rationale: المقابل العربي الطبيعي والمستقر لـἀγάπη.
- source_word: ἁγιασμῷ
  choice: القداسة
  rationale: تلائم سياق تعداد الفضائل، وتحفظ المعنى الأخلاقي والروحي من غير استعمال اصطلاح تقني ثقيل.
- source_word: μετὰ σωφροσύνης
  choice: مع ضبط النفس
  rationale: صياغة عربية واضحة تؤدي معنى التعقل والسيطرة على النفس في σωφροσύνη.
theological_decisions:
- issue: التحول من المفرد «ستُخلَّص» إلى الجمع «إن ثبتنَ»
  choice: الإبقاء على التحول النحوي بين المفرد المؤنث والجمع المؤنث
  alternative: تسوية العدد وصياغة العبارة كلها عن النساء بصيغة الجمع، أو تفسير المفرد على حواء والجمع على النساء عمومًا
  rationale: النص اليوناني نفسه ينتقل من المفرد إلى الجمع؛ وإظهار ذلك يحفظ التوتر التفسيري ولا يفرض تعيينًا لمرجع المفرد.
- issue: معنى الخلاص من خلال الإنجاب
  choice: إبقاء «ستُخلَّص من خلال الإنجاب» بلا تحديد لنوع الخلاص أو كيفية علاقته بالإنجاب
  alternative: ستُحفَظ سالمة في الولادة، أو تخلص بقبول الأمومة، أو تخلص من خلال ولادة المسيح
  rationale: العبارة موضع خلاف حقيقي، ولا يصرح اليوناني بأنها سلامة جسدية ولا يحدد ولادة مسيانية بعينها؛ لذلك ينبغي ألا يحسم المتن ما تركه المصدر محتملًا.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُخدمت «إن ثبتنَ» لإظهار جمع المؤنث الصريح وحفظ التحول العددي في الأصل، مع تجنب تفسير العبارة الخلافية داخل المتن.
