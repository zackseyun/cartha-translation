source:
  edition: SBLGNT
  text: εἰς ὃ ἐτέθην ἐγὼ κῆρυξ καὶ ἀπόστολος— ἀλήθειαν ⸀λέγω, οὐ ψεύδομαι— διδάσκαλος ἐθνῶν ἐν πίστει καὶ ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/007.yaml
  text: For this I was appointed a herald and an apostle—I am telling the truth[c][b][a]; I am not lying—a teacher of the Gentiles in faith and truth.
translation:
  language: ar
  text: ولهذا[a] عُيِّنتُ مناديًا ورسولًا—أقول الحق ولا أكذب—ومعلِّمًا للأمم[b]، في الإيمان والحق[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ولأجل هذا الغرض»؛ ويمكن أيضًا فهمها: «ولأجل ذلك الذي عُيِّنتُ له».'
    reason: lexical_alternative
  - marker: b
    text: 'أي غير اليهود؛ ويمكن ترجمتها أيضًا: «الشعوب».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «في الأمانة والحق».'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς ὃ
  choice: ولهذا
  rationale: تعود العبارة على الغرض أو الإعلان السابق، و«ولهذا» عربية طبيعية تحفظ الإحالة من غير أن تحسم بدقة ما إذا كان المعنى «لهذا الأمر» أو «لهذا الغرض».
- source_word: ἐτέθην
  choice: عُيِّنتُ
  rationale: المبني للمجهول من τίθημι يدل هنا على التكليف بمنصب أو خدمة، لا على الوضع المكاني.
- source_word: κῆρυξ
  choice: مناديًا
  rationale: ينقل معنى الشخص المكلَّف بإعلان رسالة على الملأ نيابةً عن غيره، مع تجنب حصره في مفهوم الوعظ الكنسي.
- source_word: ἀπόστολος
  choice: رسولًا
  rationale: هو المقابل العربي الراسخ للقب بولس وخدمته في هذا السياق.
- source_word: ἀλήθειαν λέγω, οὐ ψεύδομαι
  choice: أقول الحق ولا أكذب
  rationale: صياغة عربية واضحة تحفظ التوكيد المزدوج والاعتراض الذي يؤكد صدق كلام بولس.
- source_word: διδάσκαλος ἐθνῶν
  choice: معلِّمًا للأمم
  rationale: «الأمم» تقابل ἔθνη وتحمل في السياق البولسي دلالة غير اليهود، مع إبقاء الدلالة الحرفية الأوسع الممكنة.
- source_word: ἐν πίστει καὶ ἀληθείᾳ
  choice: في الإيمان والحق
  rationale: تحافظ «في» على مرونة ἐν، إذ قد تصف مجال الخدمة أو طابعها، وتترجم πίστις باللفظ المعتاد «الإيمان» من غير إلغاء احتمال معنى الأمانة.
theological_decisions:
- issue: مرجع ἐθνῶν في إرسالية بولس
  choice: الأمم
  alternative: الشعوب؛ غير اليهود
  rationale: «الأمم» تعبير عربي كتابي مفهوم يمكن أن يدل على الشعوب عمومًا، ويشير في الاستعمال البولسي غالبًا إلى غير اليهود، فلا يفرض التفسير أحد الوجهين بأكثر مما يسمح به السياق.
- issue: دلالة πίστις في ἐν πίστει καὶ ἀληθείᾳ
  choice: الإيمان
  alternative: الأمانة
  rationale: «الإيمان» هو المقابل الأساسي الطبيعي، لكن «الأمانة» ممكنة معجميًا إذا كانت العبارة تصف كيفية أداء بولس لخدمته؛ لذلك حُفظ هذا الوجه في الحاشية.
translation_notes:
  register: لغة عربية فصحى حديثة واضحة ووقورة. استُخدمت الشرطتان لإبراز العبارة الاعتراضية كما في النص اليوناني، وحُفظت «في» لتجنب حسم علاقة العبارة الختامية بالخدمة أو التعليم.
