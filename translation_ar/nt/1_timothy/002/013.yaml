  source_fidelity: 'النص العربي ينقل عناصر اليونانية كلها بأمانة: «لأن» تؤدي γάρ بوصفها تعليلًا، و«آدم» و«حواء» اسما العَلَم، و«جُبِلَ» مبني للمجهول ويؤدي ἐπλάσθη بمعنى التشكيل/الجبْل، و«أولًا ... ثم» يحفظان الترتيب الزمني في πρῶτος وεἶτα دون إضافة استنتاج لاهوتي.'
