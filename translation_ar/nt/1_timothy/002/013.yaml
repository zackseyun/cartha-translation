- source_word: ἐπλάσθη
  choice: جُبِلَ
  rationale: صيغة مبنية للمجهول تفيد التشكيل والصوغ، وتُبقي الصلة اللفظية بلغة رواية الخلق في سفر التكوين.
- source_word: εἶτα
  choice: ثُمَّ
  rationale: تنقل التعاقب الزمني البسيط بعبارة عربية طبيعية وفصيحة.
- source_word: Εὕα
  choice: حَوَّاءُ
  rationale: الاسم العَلَم بصيغته العربية الكتابية المألوفة، وهو معطوف على نائب الفاعل ولذلك رُفع.
theological_decisions:
- issue: صلة ترتيب الخلق في سفر التكوين بالسياق الكنسي موضع الخلاف
  choice: 'صياغة الآية بوصفها تقريرًا بسيطًا للتتابع الزمني: جُبل آدم أولًا، ثم حواء.'
  alternative: صياغة تفسيرية تُضمّن النص نتائج تتعلق بالسلطة أو بتمايز الأدوار.
  rationale: النص اليوناني نفسه يذكر ترتيب الجَبْل، ولا يصرّح في هذه الآية وحدها بما يترتب عليه لاهوتيًا؛ لذلك تحافظ الترجمة على التوتر التفسيري ولا تستبق الاستنتاج.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقّرة. اختير «جُبِلَ» لدقته وصلته بلغة الخلق، مع شرح البديل في الحاشية. أُبقي التركيب موجزًا ومحافظًا على الترتيب والتعليل في الأصل.
