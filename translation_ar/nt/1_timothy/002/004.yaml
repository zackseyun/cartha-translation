  yaml_path: translation/nt/1_timothy/002/004.yaml
  text: who desires all people to be saved and to come to the knowledge of the truth[a][b].
translation:
  language: ar
  text: الذي يريد[a] أن يَخلُص جميع الناس، وأن يصلوا إلى معرفة الحق[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «يشاء». يمكن أن يدل الفعل اليوناني على الإرادة أو الرغبة؛ واختيرت «يريد» لئلا تحسم الترجمة الجدل اللاهوتي بما يتجاوز لفظ النص.
    reason: lexical_alternative
  - marker: b
    text: أو «إلى المعرفة التامة بالحق». قد تحمل الكلمة اليونانية معنى المعرفة الأتم أو الأكمل.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: الذي
  rationale: اسم موصول يعود على الله المذكور في الآية السابقة، ويحافظ على الصلة النحوية بالسياق.
- source_word: πάντας ἀνθρώπους
  choice: جميع الناس
  rationale: يدل التعبير اليوناني على البشر عمومًا، لا على الذكور وحدهم، وتؤدي عبارة «جميع الناس» معناه بوضوح من غير تقييده بفئات معينة.
- source_word: θέλει
  choice: يريد
  rationale: فعل عربي طبيعي واسع الدلالة يقابل معنى الرغبة أو الإرادة في θέλω، من غير تحويل اللفظ إلى مصطلح فلسفي أو لاهوتي أدق مما يقتضيه النص.
- source_word: σωθῆναι
  choice: أن يَخلُص
  rationale: يحمل المصدر اليوناني المبني للمجهول معنى الخلاص هنا. واستُعمل الفعل العربي اللازم «يَخلُص» للدلالة على نوال الخلاص، مع إبقاء الله بوصفه فاعل «يريد» لا فاعلًا نحويًا مباشرًا لفعل الخلاص.
- source_word: εἰς ἐπίγνωσιν ἀληθείας
  choice: إلى معرفة الحق
  rationale: تنقل العبارة اتجاه الحركة نحو معرفة الحق، وتحافظ على إمكان أن تحمل ἐπίγνωσις معنى المعرفة الأتم من غير فرض هذا التفصيل في المتن.
- source_word: ἐλθεῖν
  choice: أن يصلوا
  rationale: الفعل ἔρχομαι مع εἰς يفيد الوصول إلى حالة أو واقع؛ و«يصلوا إلى» تعبير عربي طبيعي يؤدي هذه الحركة المجازية بوضوح.
theological_decisions:
- issue: شمول πάντας ἀνθρώπους وطبيعة إرادة الله الخلاصية
  choice: «جميع الناس» و«يريد»
  alternative: «كل أصناف الناس» أو «يشاء» بصياغة قد تُفهم بوصفها تقريرًا تقنيًا لطبيعة الإرادة الإلهية
  rationale: ظاهر العبارة اليونانية شامل. لذلك لا يضيّق النص نطاقها إلى أصناف من الناس، ولا يجعل θέλει مصطلحًا فنيًا يحسم الجدل في طبيعة الإرادة الإلهية، بل يحفظ الشمول والتوتر اللاهوتي القائمين في العبارة.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ومهيبة. ضُبطت عين الفعل في «يَخلُص» جزئيًا منعًا لقراءته «يُخلِّص» المتعدي، وحُفظت علامات الحواشي في المتن.
