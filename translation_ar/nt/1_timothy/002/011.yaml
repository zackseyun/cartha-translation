  text: γυνὴ ἐν ἡσυχίᾳ μανθανέτω ἐν πάσῃ ὑποταγῇ·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/011.yaml
  text: A woman must learn in quietness[b][a], in all submission.
translation:
  language: ar
  text: لِتَتَعَلَّمِ المرأةُ[a] في هدوءٍ[b]، في كلِّ خضوعٍ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الزوجة»، بحسب السياق؛ فاللفظة اليونانية قد تعني «امرأة» أو «زوجة».
    reason: alternative_reading
  - marker: b
    text: أو «في صمت»؛ ويمكن أن تدلّ اللفظة اليونانية أيضًا على الهدوء أو السكينة، لا على انعدام الكلام بالضرورة.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνὴ
  choice: المرأة
  rationale: يمكن أن تدلّ γυνή على «امرأة» أو «زوجة» بحسب السياق. ولم يُصرَّح هنا بسياق زوجي، لذلك تحافظ «المرأة» على الدلالة العامة وعلى صيغة المفرد من غير تقييد المرجع بالحالة الزوجية.
- source_word: ἐν ἡσυχίᾳ
  choice: في هدوء
  rationale: تدلّ ἡσυχία على الهدوء والسكينة، وقد تدلّ على الصمت، لكنها لا تقتضي بالضرورة انعدام الكلام مطلقًا. وتحافظ «في هدوء» على صورة شبه الجملة وعلى سعة الدلالة.
- source_word: μανθανέτω
  choice: لِتَتَعَلَّمْ
  rationale: الفعل أمر مضارع للغائب المفرد. وصيغة «لِتَتَعَلَّمْ» تنقل قوة التوجيه بوضوح، مع إبراز الأمر الإيجابي بالتعلّم.
- source_word: ἐν πάσῃ ὑποταγῇ
  choice: في كلِّ خضوع
  rationale: تحافظ العبارة على حرف الجر وعلى شمول πάσῃ، ولا تضيف طرفًا محددًا للخضوع لم يذكره النص اليوناني.
theological_decisions:
- issue: هل تدلّ ἡσυχία على الصمت المطلق أم على هيئة هادئة؟
  choice: في هدوء
  alternative: في صمت
  rationale: تسمح اللفظة بالمعنيين، لكن «الهدوء» لا يجعل الوصية أصرم مما تقتضيه اللفظة، بينما تُحفظ إمكانية معنى «الصمت» في الحاشية.
- issue: هل تُترجم γυνή بـ«امرأة» أم «زوجة»؟
  choice: المرأة
  alternative: الزوجة
  rationale: لا يحدّد التركيب نفسه علاقة زوجية، ولذلك تتجنب «المرأة» تضييق المرجع، مع إثبات الاحتمال الآخر في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُخدمت لام الأمر لنقل صيغة الأمر اليونانية، وحُفظ تكرار «في» ومقدار الإبهام في جهة الخضوع كما في الأصل.
