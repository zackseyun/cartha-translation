  text: for kings and all who are in high positions[a], so that we may lead a tranquil and quiet life in all godliness and dignity.
translation:
  language: ar
  text: من أجل الملوك وجميع من هم في مكانة رفيعة[a]، لكي نحيا حياة مطمئنة هادئة بكل تقوى ووقار.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «جميع ذوي السلطة». والعبارة اليونانية حرفيًا: «جميع الكائنين في رفعة/مكانة عالية».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ
  choice: من أجل
  rationale: في سياق الدعاء والابتهال الوارد في الآية السابقة، تدل العبارة على تقديم الصلاة لأجل أشخاص معينين، و«من أجل» تعبير عربي طبيعي ودقيق.
- source_word: βασιλέων
  choice: الملوك
  rationale: الاسم اليوناني يدل تحديدًا على الملوك، فحُفظ معناه المباشر من غير توسيعه إلى كل الحكام.
- source_word: πάντων τῶν ἐν ὑπεροχῇ ὄντων
  choice: جميع من هم في مكانة رفيعة
  rationale: تفيد العبارة وجود الأشخاص في منزلة أو موقع بارز، وهي أوسع دلالة من شغل منصب رسمي ذي سلطة؛ لذلك حُفظ هذا الاتساع مع بيان البديل في الحاشية.
- source_word: ἵνα
  choice: لكي
  rationale: تُظهر أداة الغاية بوضوح أن ما يليها هو الغرض المقصود من الصلاة لأجل هؤلاء.
- source_word: ἤρεμον
  choice: مطمئنة
  rationale: تنقل معنى السكينة والتحرر من الاضطراب، مع إبقاء فرق دلالي عن الصفة التالية.
- source_word: ἡσύχιον
  choice: هادئة
  rationale: تعبّر عن الهدوء والسكون، وتنسجم طبيعيًا مع «حياة» من غير دمج الصفتين في معنى واحد.
- source_word: βίον διάγωμεν
  choice: نحيا حياة
  rationale: الفعل مع الاسم يدل على قضاء المرء حياته أو سلوكه فيها؛ و«نحيا حياة» صياغة عربية واضحة وطبيعية.
- source_word: ἐν πάσῃ εὐσεβείᾳ
  choice: بكل تقوى
  rationale: التقوى هنا هي التعبد الورع الذي يظهر في السلوك، والباء تعبّر طبيعيًا عن الهيئة أو الكيفية.
- source_word: σεμνότητι
  choice: وقار
  rationale: يدل اللفظ على الجدية الأخلاقية الجديرة بالاحترام، و«وقار» لفظ عربي حالي يحفظ هذا الوزن الأدبي والاجتماعي.
theological_decisions:
- issue: نطاق الصلاة لأجل الحكام وغرضها
  choice: تُعرض الصلاة لأجل الملوك وذوي المكانة الرفيعة بغرض أن يعيش المؤمنون في الطمأنينة والهدوء والتقوى والوقار.
  alternative: صياغة تشدد على الخضوع للسلطات الحاكمة، أو تحصر العبارة في أصحاب السلطة الرسمية وحدهم.
  rationale: النص اليوناني يحدد من تُقدَّم الصلاة لأجلهم والظروف الاجتماعية المرجوة لحياة المؤمنين، لكنه لا يقرر هنا تأييدًا غير مشروط لكل حاكم ولا يحصر المعنيين في المناصب الرسمية؛ لذلك لم تُضف إليه نظرية سياسية أو كنسية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت «مكانة رفيعة» للمحافظة على اتساع العبارة اليونانية، و«مطمئنة هادئة» للإبقاء على تمايز الصفتين، و«بكل تقوى ووقار» لصياغة عربية طبيعية موجزة.
