lexical_decisions:
- source_word: Ἀδὰμ
  choice: آدم
  rationale: نقل الاسم بصيغته العربية الكتابية المألوفة.
- source_word: ἠπατήθη
  choice: لم يُخدع
  rationale: ينقل المبني للمجهول في الماضي مباشرة، وهو أفصح وأدق من تعبيرات أكثر تفسيرًا مثل «لم يَضِلّ».
- source_word: γυνή
  choice: المرأة
  rationale: مع أن اللفظة قد تعني «الزوجة»، فإن الإحالة إلى رواية التكوين والمقابلة مع آدم ترجّح المعنى العام المباشر «المرأة».
- source_word: ἐξαπατηθεῖσα
  choice: إذ خُدعت
  rationale: يحافظ على دلالة اسم الفاعل الظرفية وعلى سبق الخداع للفعل الرئيس. وُضع احتمال التشديد الكامن في الفعل المركب في الحاشية بدل فرضه في المتن، لأن مدى قوة السابقة محل نقاش.
- source_word: ἐν παραβάσει
  choice: في تعدٍّ
  rationale: يحافظ على صورة حرف الجر والاسم المجرّد، من غير تحويل المرأة إلى وصف اسمي مثل «متعدية»، ومن غير إضافة مفعول غير مذكور.
- source_word: γέγονεν
  choice: صارت
  rationale: تنقل صيغة التام من γίνομαι بما يجمع الانتقال إلى الحال والنتيجة القائمة، بدل تسطيحها إلى مجرد «كانت».
- source_word: δὲ
  choice: لكنَّ
  rationale: تُظهر المقابلة الصريحة بين آدم والمرأة.
- source_word: καὶ
  choice: وَ
  rationale: تصل القول بالسياق السابق من غير إضافة معنى استنتاجي غير مصرّح به.
theological_decisions:
- issue: صياغة علاقة المرأة بالتعدي دون توسيع العبارة إلى حكم عام على النساء أو إلى تقرير أنطولوجي.
  choice: «لكنَّ المرأة، إذ خُدعت، صارت في تعدٍّ»
  alternative: «لكن المرأة، إذ خُدعت، وقعت في التعدي» أو «صارت متعدية»
  rationale: الصياغة المختارة تبقي العبارة مرتبطة بسرد التكوين، وتحافظ على الاسم المجرّد παράβασις وعلى التوتر القائم في النص، من غير تحويله إلى لقب شخصي أو استنتاج عقائدي أوسع.
