  text: 'بل بما يليق بالنساء اللواتي يُعلنَّ أنهن يتقين الله: بالأعمال الصالحة[a][b][c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «بما هو ملائم» أو «بما هو مناسب».
    reason: lexical_alternative
  - marker: b
    text: أو «التديّن تجاه الله» أو «الورع تجاه الله».
    reason: lexical_alternative
  - marker: c
    text: 'حرفيًا: «من خلال الأعمال الصالحة»؛ والمعنى هنا أن الأعمال الصالحة هي الزينة اللائقة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: بل
  rationale: تفيد مقابلة مباشرة مع الزينة الخارجية المذكورة في الآية السابقة، و«بل» طبيعية في هذا السياق.
- source_word: ὃ πρέπει
  choice: بما يليق
  rationale: تؤدي معنى ما هو ملائم أو جدير، وتنسجم نحويًا مع المقابلة بين نوعي الزينة.
- source_word: γυναιξὶν
  choice: بالنساء
  rationale: الجمع هنا عام ويشير إلى النساء، لا إلى الزوجات حصرًا.
- source_word: ἐπαγγελλομέναις
  choice: اللواتي يُعلنَّ
  rationale: ينقل معنى الجهر بالانتساب إلى التقوى أو ادعائها من غير أن يوحي بنذر أو وعد.
- source_word: θεοσέβειαν
  choice: تقواهن لله
  rationale: يبيّن أن المقصود تقوى متجهة إلى الله، مع الحفاظ على إيجاز العبارة.
- source_word: δι’ ἔργων ἀγαθῶν
  choice: بالأعمال الصالحة
  rationale: تحافظ الباء على دلالة الوسيلة أو الكيفية في διά مع المضاف إليه، وتُبقي صلة الأعمال بما يليق بهن واضحة.
theological_decisions:
- issue: علاقة الأعمال الصالحة بإعلان التقوى
  choice: تُعرض الأعمال الصالحة بوصفها الزينة أو التعبير العملي اللائق بالنساء اللواتي يُعلنَّ تقواهن لله.
  alternative: اعتبار الأعمال أساسًا استحقاقيًا للقبول أمام الله.
  rationale: السياق يقابل الزينة الخارجية بالسلوك اللائق بإعلان التقوى، ولا يصرّح بحكم عن استحقاق الخلاص؛ لذلك لا تضيف الترجمة هذا الحكم.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. حوفظ على بنية المقابلة مع الآية السابقة، وعلى دلالة «بالأعمال الصالحة» من غير إدخال تقرير خلاصي غير موجود في النص.
