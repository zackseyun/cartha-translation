source:
  edition: SBLGNT
  text: ⸂διδάσκειν δὲ γυναικὶ⸃ οὐκ ἐπιτρέπω, οὐδὲ αὐθεντεῖν ἀνδρός, ἀλλ’ εἶναι ἐν ἡσυχίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/012.yaml
  text: But I do not permit a woman to teach or to exercise authority over a man[a]; instead[c][b], she is to be in quietness.
translation:
  language: ar
  text: لكنني لا أسمح للمرأة أن تُعلِّم أو أن تمارس سلطةً على الرجل[a][b]، بل أن تكون في هدوء[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «للزوجة أن تُعلِّم زوجها أو أن تمارس سلطةً عليه». فاللفظتان اليونانيتان يمكن أن تدلا على «المرأة والرجل» أو على «الزوجة والزوج».'
    reason: alternative_reading
  - marker: b
    text: 'أو: «أن تكون لها سلطة على»؛ وربما: «أن تتسلط على». الفعل اليوناني نادر، ودقته الدلالية موضع نقاش.'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «في صمت». يمكن أن تدل اللفظة اليونانية على الهدوء أو السكون أو الصمت بحسب السياق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διδάσκειν
  choice: أن تُعلِّم
  rationale: ينقل المصدر اليوناني بوصفه مكمّلًا مباشرًا للفعل «أسمح»، من غير إضافة دلالة زمنية أو استمرارية لا يقتضيها السياق.
- source_word: δὲ
  choice: لكنني
  rationale: تفيد الأداة انتقالًا ذا مسحة استدراكية من الكلام السابق، و«لكن» تؤدي ذلك بوضوح في العربية المعاصرة.
- source_word: γυναικὶ
  choice: للمرأة
  rationale: يمكن أن تعني اللفظة «امرأة» أو «زوجة». اختير المعنى العام لملاءمته لسياق 2:9–15، مع إثبات المعنى الزوجي الممكن في الحاشية.
- source_word: οὐκ ἐπιτρέπω
  choice: لا أسمح
  rationale: صياغة عربية طبيعية ودقيقة للحاضر اليوناني، وتحافظ على المتكلم المفرد من غير حسم ما إذا كان الحاضر عامًا أو ظرفيًا.
- source_word: οὐδὲ
  choice: أو
  rationale: تنسق المنع الثاني مع الأول تحت نفي واحد؛ و«أو» هي الصياغة العربية الطبيعية بعد «لا أسمح ... أن».
- source_word: αὐθεντεῖν
  choice: أن تمارس سلطةً على
  rationale: الفعل نادر ودلالته محل نقاش. هذه العبارة تنقل معنى ممارسة السلطة بصياغة محايدة نسبيًا، من غير افتراض أن المقصود حتمًا تسلّط تعسفي.
- source_word: ἀνδρός
  choice: الرجل
  rationale: يمكن أن تعني اللفظة «رجلًا» أو «زوجًا». رُجِّح المعنى العام في المتن، مع حفظ الاحتمال الزوجي في الحاشية.
- source_word: ἀλλ’
  choice: بل
  rationale: تقدم الأداة البديل المقابل لما سبق، و«بل» تؤدي هذا التقابل بإيجاز وفصاحة.
- source_word: εἶναι
  choice: أن تكون
  rationale: تحافظ على البنية المصدرية التابعة لـ«أسمح» والمفهومة أيضًا بعد «بل»، من غير إضافة فعل مثل «تبقى» لا يرد في الأصل.
- source_word: ἐν ἡσυχίᾳ
  choice: في هدوء
  rationale: تنقل مجال اللفظة الذي قد يشمل الهدوء والسكون أو الصمت بحسب السياق، ولا تفترض بالضرورة انعدام الكلام تمامًا.
theological_decisions:
- issue: دلالة αὐθεντεῖν في نص كنسي موضع نقاش
  choice: أن تمارس سلطةً على
  alternative: أن تكون لها سلطة على؛ أو أن تتسلط على
  rationale: يحفظ الاختيار معنى السلطة المحايد نسبيًا، بينما تعرض الحاشية احتمال المعنى الوصفي الساكن واحتمال التسلط، فلا يُحسم الجدل اللاهوتي بما يتجاوز الدليل اللغوي.
- issue: هل γυνή وἀνήρ تعنيان امرأة ورجلًا أم زوجة وزوجًا؟
  choice: المرأة ... الرجل
  alternative: الزوجة ... زوجها
  rationale: تسمح اللفظتان بالمعنيين العام والزوجي. يرجح السياق الأوسع المعنى العام، لكن الاحتمال الزوجي حقيقي ولذلك أُثبت في الحاشية.
- issue: مدى دلالة ἡσυχία
  choice: في هدوء
  alternative: في صمت
  rationale: «الهدوء» يحفظ الدلالة الأوسع ولا يحولها تلقائيًا إلى صمت مطلق، مع بيان «الصمت» بوصفه احتمالًا معجميًا مشروعًا.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُعملت «لا أسمح» بدل صياغة أشد تقعيدًا، وحُفظت بنية التقابل بين المنع و«بل أن تكون». وُضعت علامتا الحاشيتين [a][b] بعد العبارة التي تتعلقان بها، وعلامة [c] بعد «هدوء».
