source:
  edition: SBLGNT
  text: Βούλομαι οὖν προσεύχεσθαι τοὺς ἄνδρας ἐν παντὶ τόπῳ, ἐπαίροντας ὁσίους χεῖρας χωρὶς ὀργῆς καὶ ⸀διαλογισμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/008.yaml
  text: Therefore I want the men in every place to pray[a], lifting up holy hands without anger or quarreling.
translation:
  language: ar
  text: لذلك أريد أن يصلّي الرجال في كل مكان، رافعين أيديًا مقدسة، بلا غضب ولا جدال.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بلا غضب ولا شك». يمكن للكلمة اليونانية أن تشير إلى التفكير الباطني أو الشك، لكن المرجح هنا أنها تشير إلى الجدال الخصامي في اجتماع المؤمنين.'
    reason: بديل معجمي يحفظ احتمالًا حقيقيًا في دلالة διαλογισμοῦ.
lexical_decisions:
- source_word: Βούλομαι
  choice: أريد
  rationale: ينقل معنى الإرادة أو الرغبة بصياغة عربية طبيعية، مع إبقاء قوة توجيه بولس.
- source_word: οὖν
  choice: إذًا
  rationale: تحفظ الصلة الاستنتاجية أو الانتقالية بما سبق، وتنسجم طبيعيًا مع ترتيب الجملة العربية.
- source_word: προσεύχεσθαι
  choice: أن يصلّي
  rationale: المقابل العربي المألوف للفعل، والمصدر المؤول متعلق بـ«أريد».
- source_word: τοὺς ἄνδρας
  choice: الرجال
  rationale: الاسم اليوناني هنا محدد من جهة الجنس، وسياق التعليم المتعاقب للرجال والنساء يرجح هذا المعنى على «الناس» أو «الأزواج».
- source_word: ἐν παντὶ τόπῳ
  choice: في كل مكان
  rationale: ترجمة مباشرة وطبيعية تحفظ المعنى التوزيعي للعبارة.
- source_word: ἐπαίροντας
  choice: رافعين
  rationale: حال تصف الهيئة المصاحبة للصلاة، وتحفظ صورة رفع اليدين.
- source_word: ὁσίους χεῖρας
  choice: أيديًا مقدسة
  rationale: تحفظ التعبير المجازي المباشر ودلالة ὅσιος على القداسة والتقوى المقبولة لدى الله، من غير استبداله بلفظ «طاهرة» ذي تلوين مختلف.
- source_word: χωρὶς
  choice: بلا
  rationale: تؤدي معنى انتفاء الشيء بوضوح وإيجاز في العربية المعاصرة.
- source_word: ὀργῆς
  choice: غضب
  rationale: لفظ عربي واضح يلائم السياق العلاقي أكثر من «سخط» الأشد وقعًا.
- source_word: διαλογισμοῦ
  choice: جدال
  rationale: قد يدل اللفظ على التفكير أو الشك أو المنازعة؛ واقترانه بالغضب في سياق صلاة الجماعة يرجح الجدال الخصامي، مع حفظ احتمال «الشك» في الحاشية.
theological_decisions:
- issue: التحديد الجنسي في τοὺς ἄνδρας
  choice: الرجال
  alternative: الناس، الجميع، الأزواج
  rationale: يحفظ التحديد الصريح في الأصل، ولا يسوّيه بإحالة عامة، ولا يحوله إلى «الأزواج» من دون قرينة كافية.
- issue: معنى διαλογισμοῦ في سياق الصلاة
  choice: جدال
  alternative: شك
  rationale: المعنى العلاقي الخصامي هو الأرجح مع «الغضب» وفي سياق العبادة الجماعية، لكن الدلالة على الشك ممكنة معجميًا ولذلك تُذكر في الحاشية بدل إلغائها.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «فأريد إذًا» لإظهار الصلة بما سبق، وحُفظت صورة «رفع الأيدي المقدسة» وخصوصية الإشارة إلى الرجال. وُضع رقم الحاشية بعد العبارة التي تتناولها.
