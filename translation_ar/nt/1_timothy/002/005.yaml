  text: 'فإن الله واحد، والوسيط بين الله والبشر واحد: إنسانٌ، المسيح يسوع.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἷς ... εἷς
  choice: واحد ... واحد
  rationale: حُفظ التوازي التوكيدي في اليونانية بين وحدانية الله ووحدانية الوسيط.
- source_word: γὰρ
  choice: فإن
  rationale: تؤدي وظيفة التعليل والشرح المتصل بالسياق السابق بأسلوب عربي فصيح طبيعي.
- source_word: μεσίτης
  choice: الوسيط
  rationale: المقابل العربي الدقيق والمألوف لمن يقف بين طرفين، كما تلائم معه صيغة «بين الله والبشر» الاستعمال العربي.
- source_word: θεοῦ καὶ ἀνθρώπων
  choice: بين الله والبشر
  rationale: تحويل المضاف إليه اليوناني إلى تركيب «بين ... و...» يوافق تعدية «الوسيط» في العربية، و«البشر» تشمل الإنسانية عمومًا كما يفعل الجمع اليوناني.
- source_word: ἄνθρωπος
  choice: الإنسان
  rationale: يحفظ الصلة اللفظية والدلالية بالحديث عن البشر، ويؤكد إنسانية الوسيط من غير أن يضيف حكمًا على طبيعته الإلهية.
- source_word: Χριστὸς Ἰησοῦς
  choice: المسيح يسوع
  rationale: 'تُرجم Χριστός بوصفه لقبًا إلى «المسيح»، وحُفظ ترتيب النص اليوناني: اللقب ثم الاسم.'
theological_decisions:
- issue: الصلة بين ἀνθρώπων وἄνθρωπος
  choice: البشر ... الإنسان
  alternative: الناس ... إنسانًا
  rationale: يحفظ الاختيار معنى الإنسانية العام في الجمع، ثم يبرز إنسانية الوسيط في المفرد، من غير قصر «البشر» على الذكور.
- issue: دلالة Χριστός
  choice: المسيح يسوع
  alternative: يسوع المسيح
  rationale: «المسيح» ترجمة للقب لا مجرد نقل صوتي، وترتيب «المسيح يسوع» يطابق ترتيب Χριστὸς Ἰησοῦς في المصدر.
- issue: الدلالة المسيحانية لعبارة ἄνθρωπος Χριστὸς Ἰησοῦς
  choice: وهو الإنسان، المسيح يسوع
  alternative: وهو إنسان، المسيح يسوع
  rationale: تُثبت الصياغة إنسانية الوسيط كما يفعل النص، من غير أن تستنتج نفي ألوهيته أو تضيف تصريحًا بها؛ وتوضح الفاصلة أن «المسيح يسوع» بدل يعيّن ذلك الإنسان.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. أُعيد ترتيب صدر الجملة إلى «الله واحد ... والوسيط ... واحد» للمحافظة على التوازي بصورة طبيعية في العربية، واستُخدمت الفاصلة لإظهار البدل في العبارة الختامية.
