source:
  edition: SBLGNT
  text: ὡσαύτως ⸀καὶ γυναῖκας ἐν καταστολῇ κοσμίῳ μετὰ αἰδοῦς καὶ σωφροσύνης κοσμεῖν ἑαυτάς, μὴ ἐν πλέγμασιν ⸀καὶ ⸀χρυσίῳ ἢ μαργαρίταις ἢ ἱματισμῷ πολυτελεῖ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/009.yaml
  text: Likewise also[a], women are to adorn themselves in respectable clothing, with modesty and self-control, not with braided hair and gold or pearls or expensive clothing[b],
translation:
  language: ar
  text: وكذلك، ينبغي للنساء أيضًا أن يزيِّنَّ أنفسهن بلباس لائق[a]، بحياء وضبط النفس، لا بضفائر ولا بذهب أو لآلئ أو بثياب باهظة الثمن[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمة العبارة: «بهيئة لائقة» أو «بلباس محتشم».'
    reason: lexical_alternative
  - marker: b
    text: يُرجَّح أن عبارة «بضفائر وذهب أو لآلئ أو ثياب باهظة الثمن» تشير إلى الزينة الاستعراضية المتكلفة، لا إلى تحريم كل استعمال للضفائر أو الحلي في جميع الأحوال.
    reason: cultural_note
lexical_decisions:
- source_word: ὡσαύτως καί
  choice: وكذلك أيضًا
  rationale: يحافظ على صلة الإضافة بالتوجيه السابق، ممثلًا كلًّا من ὡσαύτως وκαί، مع بقاء العبارة مفهومة في العربية المعاصرة.
- source_word: γυναῖκας
  choice: النساء
  rationale: قد تعني γυνή «امرأة» أو «زوجة»، لكن الجمع هنا، في سياق وصايا عامة ومن دون قرينة زوجية، يرجّح «النساء».
- source_word: ἐν καταστολῇ κοσμίῳ
  choice: بلباس لائق
  rationale: تفيد καταστολή اللباس أو الهيئة، وتدل κόσμιος على ما هو منظم ومناسب ومحترم؛ و«لباس لائق» عبارة عربية طبيعية تجمع المعنى الخارجي والاجتماعي الأخلاقي.
- source_word: μετὰ αἰδοῦς
  choice: بحياء
  rationale: تدل αἰδώς على الحياء والتحفظ اللذين يردعان عن التصرف غير اللائق، و«حياء» أوضح مقابل عربي في سياق المظهر والسلوك.
- source_word: σωφροσύνης
  choice: ضبط للنفس
  rationale: تشمل σωφροσύνη رجاحة العقل التي تظهر في التعقل وكبح النفس؛ و«ضبط النفس» واضح ومعاصر ويحفظ جانب التقييد الذاتي.
- source_word: κοσμεῖν ἑαυτάς
  choice: أن يزيِّنَّ أنفسهن
  rationale: يحفظ معنى κοσμέω، أي التزيين أو الترتيب، ويصون الصلة اللفظية بين الهيئة اللائقة والزينة المتكلفة المذكورة في المقابلة.
- source_word: μὴ ἐν πλέγμασιν
  choice: لا بضفائر
  rationale: تشير πλέγματα إلى ضفائر الشعر أو تسريحاته المضفورة؛ و«ضفائر» ترجمة موجزة لا تضيف إلى النص وصفًا غير مصرح به مثل «متكلفة».
- source_word: χρυσίῳ
  choice: ذهب
  rationale: يعدّد التركيب وسائل الزينة، و«ذهب» يحافظ على عموم اللفظ اليوناني من دون تقييده بنوع معين من الحلي.
- source_word: μαργαρίταις
  choice: لآلئ
  rationale: هذا هو المعنى المعجمي المباشر للكلمة، وهي عنصر من قائمة مظاهر الزينة الثمينة.
- source_word: ἱματισμῷ πολυτελεῖ
  choice: ثياب باهظة الثمن
  rationale: تعني ἱματισμός الثياب أو اللباس، وتعني πολυτελής الغالي أو الباهظ؛ والصياغة العربية واضحة وتحفظ التركيز على الكلفة.
theological_decisions:
- issue: هل الخطاب موجَّه إلى النساء عمومًا أم إلى الزوجات خصوصًا؟
  choice: النساء عمومًا
  alternative: الزوجات
  rationale: يَرِد الجمع γυναῖκας في سياق وصايا عامة، ولا توجد علامة سياقية تقصره على المتزوجات؛ لذلك لا ينبغي للتفسير أن يضيّق مدلول النص.
- issue: هل القائمة تحظر كل استعمال للضفائر والذهب واللآلئ والثياب الغالية حظرًا مطلقًا، أم تقابل الزينة اللائقة بالمظهر الاستعراضي؟
  choice: إبقاء ألفاظ المنع كما هي، مع بيان أن المقابلة السياقية تُفهم غالبًا على أنها تستهدف الزينة الاستعراضية
  alternative: اعتبارها حظرًا مطلقًا لكل ضفائر أو ذهب أو لآلئ أو ثياب غالية في جميع الأحوال
  rationale: يقابل التركيب بين التزين بلباس لائق مع الحياء وضبط النفس وبين قائمة مظاهر فاخرة. تُبقي الترجمة القائمة حرفية ولا تضيف قيدًا تفسيريًا إلى المتن، بينما توضح الحاشية الاحتمال السياقي من غير إلغاء إمكان القراءة الأشد حرفية.
translation_notes:
  register: صياغة عربية فصحى معاصرة، واضحة ووقورة. استُعمل «بلباس لائق» بدل تعبيرات قديمة أو شديدة التفسير، و«ضبط النفس» لإبراز المعنى العملي لـσωφροσύνη. وُضع رمز الحاشية [a] بعد العبارة التي تشرحها الحاشية مباشرة.
