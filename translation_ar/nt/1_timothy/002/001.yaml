  text: Παρακαλῶ οὖν πρῶτον πάντων ποιεῖσθαι δεήσεις, προσευχάς, ἐντεύξεις, εὐχαριστίας, ὑπὲρ πάντων ἀνθρώπων,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/001.yaml
  text: Therefore[a], first of all, I urge that petitions, prayers, intercessions, and thanksgivings be made for all people[c][b],
translation:
  language: ar
  text: فأحثّ، قبل كل شيء، على أن تُقدَّم طلبات وصلوات وابتهالات وأفعال شكر من أجل جميع الناس[a][b]،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «جميع الناس» ترجمة لتعبير يوناني عام عن البشر، لا عن الذكور وحدهم.
    reason: lexical_alternative
  - marker: b
    text: 'يفهم بعضهم «جميع الناس» هنا بمعنى «كل أصناف الناس»، لكن اليونانية نفسها تقول ببساطة: «جميع الناس».'
    reason: alternative_reading
lexical_decisions:
- source_word: Παρακαλῶ
  choice: أحثّ
  rationale: تنقل قوة التوجيه الرسولي الجاد بلغة عربية معاصرة واضحة، من غير جفاف «أوصي» ولا قدم «أعظ».
- source_word: οὖν
  choice: فـ
  rationale: تفيد الانتقال الاستنتاجي المتصل بما سبق بصورة طبيعية في العربية؛ و«لذلك» بديل أكثر تصريحًا.
- source_word: πρῶτον πάντων
  choice: قبل كل شيء
  rationale: تعبّر عن أولوية الأمر، لا بالضرورة عن كونه أول بند في تسلسل عددي.
- source_word: ποιεῖσθαι
  choice: تُقام
  rationale: صيغة مبنية للمجهول تستوعب أصناف الصلاة الأربعة، وهي أفصح في هذا السياق من الترجمة الحرفية «تُفعل».
- source_word: δεήσεις
  choice: طلبات
  rationale: تشير إلى التماس ما تدعو إليه الحاجة، مع وضوحها للقارئ الحديث.
- source_word: προσευχάς
  choice: صلوات
  rationale: المقابل العام المباشر للمفردة اليونانية الخاصة بالصلاة.
- source_word: ἐντεύξεις
  choice: ابتهالات
  rationale: تحافظ على كونها توسلات مرفوعة إلى الله من غير حصر معناها في الشفاعة عن الآخرين؛ فهذا التخصيص ليس لازمًا من اللفظة وحدها.
- source_word: εὐχαριστίας
  choice: أفعال شكر
  rationale: تحافظ على الجمع والتمييز عن بقية أصناف الصلاة، وتأتي طبيعية وواضحة في العربية.
- source_word: ὑπὲρ
  choice: من أجل
  rationale: تفيد المصلحة والنيابة في هذا السياق؛ ويمكن أيضًا فهمها بمعنى «نيابةً عن».
- source_word: πάντων ἀνθρώπων
  choice: جميع الناس
  rationale: ἄνθρωποι هنا تعبير عام عن البشر، لا عن الذكور وحدهم، والعبارة اليونانية نفسها لا تضيف تقييد «كل أصناف الناس».
theological_decisions:
- issue: نطاق πάντων ἀνθρώπων
  choice: جميع الناس
  alternative: كل أصناف الناس
  rationale: المعنى الظاهر للعبارة اليونانية هو «جميع الناس». أما حملها على جميع الفئات أو الأصناف فهو تفسير محتمل في النقاش اللاهوتي، لكنه ليس تقييدًا مصرحًا به في نص العبارة، لذلك لا تُحسم المسألة تضييقًا داخل المتن.
- issue: دلالة ἐντεύξεις
  choice: ابتهالات
  alternative: شفاعات
  rationale: قد تدل المفردة في السياق على التماسات أو مناجاة، وربما تشمل الصلاة لأجل الآخرين، لكن ترجمتها «شفاعات» وحدها قد تستبق عبارة «من أجل جميع الناس» وتضيّق المجال الدلالي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «فـ» لربط الآية بما قبلها، وحُفظ تعداد أصناف الصلاة الأربعة وصيغة المبني للمجهول. وُضعت علامتا الحاشيتين بعد العبارة التي تشرحانها.
