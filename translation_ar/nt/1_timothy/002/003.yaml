  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο
  choice: هذا
  rationale: اسم إشارة محايد مفرد يعود إلى التوجيه السابق المتعلق بالصلاة؛ و«هذا» يحفظ الإحالة من غير زيادة تفسيرية.
- source_word: καλὸν
  choice: حسنٌ
  rationale: يدل هنا على ما هو صالح ولائق أخلاقيًا، و«حسن» تعبير عربي طبيعي يحفظ سعة المعنى.
- source_word: ἀπόδεκτον
  choice: مقبولٌ
  rationale: يفيد ما يُتلقّى بالرضا والاستحسان؛ و«مقبول» مقابل مباشر لا يبالغ في تفسير درجة الرضا.
- source_word: ἐνώπιον
  choice: في نظر
  rationale: السياق سياق تقويم إلهي، و«في نظر» يعبّر بوضوح وطبيعية عن كون الأمر منظورًا إليه بالاستحسان لدى الله.
- source_word: σωτῆρος
  choice: مخلِّص
  rationale: يحفظ اللقب اللاهوتي المعروف الدال على الله بوصفه مصدر الخلاص.
- source_word: ἡμῶν
  choice: نا
  rationale: أُلحقت الضمير باللقب في «مخلِّصنا» لنقل الإضافة اليونانية بتركيب عربي طبيعي.
- source_word: θεοῦ
  choice: الله
  rationale: الاسم في علاقة بدل أو عطف بيان مع «مخلِّصنا»، والترتيب «الله مخلِّصنا» واضح وفصيح.
theological_decisions:
- issue: العلاقة التفسيرية في τοῦ σωτῆρος ἡμῶν θεοῦ
  choice: الله مخلِّصنا
  alternative: إلهنا المخلِّص
  rationale: يفهم التركيب اليوناني طبيعيًا على أنه يعرّف الله بأنه مخلِّصنا. وتحفظ الصياغة المختارة اللقب والعلاقة البدلّية من غير إدخال تحديد عقائدي زائد.
translation_notes:
