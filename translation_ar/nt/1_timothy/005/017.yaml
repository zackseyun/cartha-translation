  text: Οἱ καλῶς προεστῶτες πρεσβύτεροι διπλῆς τιμῆς ἀξιούσθωσαν, μάλιστα οἱ κοπιῶντες ἐν λόγῳ καὶ διδασκαλίᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/017.yaml
  text: Let the elders who lead well be considered worthy of double honor[c][b][a], especially those who labor in word and teaching.
translation:
  language: ar
  text: ليُعَدَّ الشيوخُ الذين يُحسنون القيادة أهلًا لضعفَي الكرامة[a]، ولا سيما[b] الذين يكدّون في الكلمة والتعليم[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «مستحقين لضعفَي الكرامة». وقد تشمل العبارة التقدير والدعم المادي معًا، ولا سيما في ضوء الآية التالية.
    reason: lexical_alternative
  - marker: b
    text: يرى بعضهم أن «ولا سيما» يمكن أن تُفهم بمعنى «أي»، فتكون العبارة التالية تعريفًا للشيوخ المقصودين بأنهم الذين يكدّون في الكلمة والتعليم.
    reason: alternative_reading
  - marker: c
    text: تشير عبارة «في الكلمة والتعليم» على الأرجح إلى خدمة شفهية، مثل الكرازة والتعليم.
    reason: cultural_note
lexical_decisions:
- source_word: πρεσβύτεροι
  choice: الشيوخ
  rationale: يشير اللفظ هنا، في سياق الرسائل الرعوية، إلى قادة معترف بهم في جماعة المؤمنين، لا إلى كبار السن عمومًا. ولفظ «الشيوخ» عربي واضح ويحافظ على بساطة المصطلح من غير أن يفرض بنية كنسية لاحقة.
- source_word: καλῶς προεστῶτες
  choice: الذين يُحسنون القيادة
  rationale: يدل الفعل في هذا السياق على تولّي القيادة والإشراف. وهذه الصياغة طبيعية في العربية المعاصرة، وتحفظ معنى ممارسة القيادة مع بيان جودتها من غير إيحاء متشدد قد يحمله لفظ «يحكمون».
- source_word: διπλῆς τιμῆς
  choice: لكرامة مضاعفة
  rationale: تحافظ الصياغة على اتساع معنى العبارة اليونانية، الذي قد يشمل التقدير والدعم المادي معًا، ولا تحصره في واحد منهما.
- source_word: ἀξιούσθωσαν
  choice: ليُعَدَّ ... أهلًا
  rationale: تنقل الصيغةُ المبنية للمجهول مع الأمر دعوةَ الجماعة إلى الإقرار باستحقاق هؤلاء الشيوخ، وهي صياغة عربية فصيحة ومفهومة.
- source_word: μάλιστα
  choice: ولا سيما
  rationale: تفيد إبراز فئة على نحو خاص، مع إبقاء احتمال العلاقة التفسيرية موضع بحث وعدم حسمها في المتن.
- source_word: κοπιῶντες
  choice: الذين يكدّون
  rationale: ينقل «يكدّون» معنى الجهد الشاق والمثابرة الذي يحمله الفعل اليوناني، بلغة عربية طبيعية رصينة.
- source_word: ἐν λόγῳ
  choice: في الكلمة
  rationale: تحفظ الترجمة سعة لفظ λόγος بدل تخصيصه صراحة بالوعظ، مع أن السياق يرجّح الخدمة الشفهية والإعلان.
- source_word: διδασκαλίᾳ
  choice: التعليم
  rationale: لفظ واضح ومعاصر ينقل نشاط التعليم من غير تضييقه إلى معنى «العقيدة» الاصطلاحي.
theological_decisions:
- issue: مدلول «كرامة مضاعفة» في معاملة قادة الكنيسة
  choice: إبقاء العبارة الواسعة «كرامة مضاعفة» في المتن
  alternative: احترام مضاعف؛ أو مكافأة مضاعفة؛ أو كرامة تشمل الدعم المادي
  rationale: يشير سياق الآية التالية إلى الدعم المادي، بينما يمكن أن تشمل τιμή التوقير أيضًا. لذلك تحافظ الصياغة على المجال الدلالي ولا تفرض تصورًا طائفيًا خاصًا لنظام القيادة أو التعويض.
- issue: دلالة μάλιστα
  choice: ولا سيما
  alternative: أي الذين يكدّون في الكلمة والتعليم
  rationale: تحفظ «ولا سيما» معنى التخصيص بالتوكيد، من غير أن تحسم هل العبارة تعيّن جميع الشيوخ المقصودين أم تبرز فئة منهم تبذل جهدًا خاصًا في هذه الخدمة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُخدم «الشيوخ» بوصفه المصطلح الكنسي السياقي من غير تحميله بنية مذهبية لاحقة، وحُفظت مواضع الغموض الحقيقية في «كرامة مضاعفة» و«ولا سيما» و«الكلمة» مع شرح موجز في الحواشي.
