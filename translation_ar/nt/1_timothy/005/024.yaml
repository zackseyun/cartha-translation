  text: Τινῶν ἀνθρώπων αἱ ἁμαρτίαι πρόδηλοί εἰσιν, προάγουσαι εἰς κρίσιν, τισὶν δὲ καὶ ἐπακολουθοῦσιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/024.yaml
  text: The sins of some people are obvious[a], going before them to judgment[b], but for others they follow after.
translation:
  language: ar
  text: خَطايا بعض الناس ظاهرة[a]، فتسبقهم إلى الدينونة[b]، وأما خطايا آخرين فتتبعهم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «خَطايا بعض الناس بيّنة».'
    reason: lexical_alternative
  - marker: b
    text: قد تشير «الدينونة» في هذا السياق إلى التقييم الحاضر، مع أن اللفظ قد يحمل أيضًا معنى أوسع هو دينونة الله.
    reason: alternative_reading
lexical_decisions:
- source_word: Τινῶν ἀνθρώπων αἱ ἁμαρτίαι
  choice: خَطايا بعض الناس
  rationale: ينقل تركيب الإضافة بوضوح، و«الناس» مناسبة لأن ἄνθρωπος هنا عام من جهة اللفظ، من غير حصر غير لازم في الرجال.
- source_word: πρόδηλοί
  choice: ظاهرة
  rationale: لفظ عربي واضح ومعاصر يفيد أن الخطايا بيّنة ومكشوفة.
- source_word: προάγουσαι
  choice: فتسبقهم
  rationale: يحفظ صورة الخطايا التي تتقدم أصحابها، مع إظهار المفعول المفهوم من السياق.
- source_word: εἰς κρίσιν
  choice: إلى الدينونة
  rationale: يحفظ الاتجاه الذي تدل عليه εἰς، ويُبقي κρίσις عامة بحيث قد تشير إلى التقييم في السياق أو إلى الدينونة بمعناها الأوسع.
- source_word: τισὶν δὲ καὶ ἐπακολουθοῦσιν
  choice: وأما بعضهم الآخر فتتبعهم خطاياهم فيما بعد
  rationale: يبيّن المقابلة ويحفظ صورة الخطايا التي تأتي وراء أصحابها، مع توضيح الفاعل في العربية وإبراز معنى التأخر الملازم للفعل.
theological_decisions:
- issue: مدى معنى κρίσις
  choice: الدينونة، من دون تحديد نوعها في المتن
  alternative: التقييم أو الفحص الحاضر في سياق الجماعة
  rationale: السياق القريب يتناول تقييم الأشخاص، لكن اللفظ يحتمل أيضًا معنى أوسع؛ لذلك تُحفظ السعة الدلالية مع بيانها في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختيرت «خَطايا» بفتح الخاء للوضوح، وحُفظ التشخيص البلاغي للخطايا بوصفها تسبق أصحابها أو تتبعهم.
