base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/019.yaml
  text: Do not accept an accusation against an elder[b][a], except on the basis of two or three witnesses.
translation:
  language: ar
  text: لا تقبل اتهامًا ضد شيخ[a] إلا بناءً على شهادة شاهدين أو ثلاثة.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «رجل مسن»، إذا كان المقصود بـ πρεσβυτέρου المعنى المتعلق بالعمر، لا الشيخ الذي يتولى مسؤولية في الكنيسة.'
    reason: alternative_reading
  - marker: b
    text: تعكس هذه العبارة المبدأ القضائي في العهد القديم القائل إن الأمر يثبت بشهادة «شاهدين أو ثلاثة» (انظر تثنية 19:15).
    reason: cross_reference
lexical_decisions:
- source_word: κατὰ πρεσβυτέρου
  choice: على شيخ
  rationale: يمكن أن تدل πρεσβύτερος على رجل متقدم في السن أو على شيخ يتولى مسؤولية في الكنيسة. ويرجح السياق القريب، الذي يتناول شؤون الشيوخ والمساءلة، المعنى القيادي، مع إثبات البديل في الحاشية.
- source_word: κατηγορίαν
  choice: شكوى
  rationale: تفيد الكلمة اتهامًا أو دعوى ذات طابع رسمي. و«شكوى» عربية واضحة تلائم الإجراء المذكور من غير أن تفترض مسبقًا ثبوت التهمة.
- source_word: μὴ παραδέχου
  choice: لا تقبل
  rationale: صيغة النهي تدل على عدم تلقي الشكوى أو قبول النظر فيها؛ و«لا تقبل» موجزة وتحافظ على المعنى الإجرائي.
- source_word: ἐκτὸς εἰ μὴ
  choice: إلا
  rationale: هذا التركيب يفيد الاستثناء، و«إلا» هي الصياغة العربية الطبيعية والمباشرة.
- source_word: ἐπὶ δύο ἢ τριῶν μαρτύρων
  choice: بناءً على شهادة شاهدين أو ثلاثة
  rationale: توضح العبارة أن قبول الشكوى مشروط بأساس إثباتي من شاهدين أو ثلاثة، وتحافظ على صدى المبدأ القضائي في الشريعة.
theological_decisions:
- issue: دلالة πρεσβυτέρου في سياق الكنيسة
  choice: شيخ بمعنى قائد أو مسؤول في الكنيسة
  alternative: رجل متقدم في السن
  rationale: يرجح سياق الرسالة القريب المعنى المتعلق بمسؤولية كنسية، لكن اللفظة اليونانية تحتمل المعنى العمري أيضًا؛ لذلك لم يُطمس هذا الاحتمال بل ذُكر في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعملت «شكوى» بدل صياغة أشد تقريرًا مثل «تهمة» للمحافظة على كون الأمر ادعاءً لم يثبت بعد، وأُدرجت علامتا الحاشيتين في المتن.
