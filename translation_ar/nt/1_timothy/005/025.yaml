  text: Likewise also[a], good works are evident, and those that are otherwise cannot remain hidden.
translation:
  language: ar
  text: وكذلك أيضًا، الأعمال الصالحة ظاهرة، والأعمال التي هي بخلاف ذلك لا يمكن أن تظل مخفية.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «التي تختلف عنها»، أو: «التي ليست كذلك». ويفهم بعضهم العبارة على أنها تشير تحديدًا إلى الأعمال الشريرة، قياسًا على الآية السابقة.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὡσαύτως καὶ
  choice: وكذلك أيضًا
  rationale: يحافظ على أداة المماثلة وعلى καί، ويُبرز الصلة المتوازية الوثيقة بما سبق، مع بقاء العبارة مفهومة في العربية المعاصرة.
- source_word: ἔργα τὰ καλά
  choice: الأعمال الصالحة
  rationale: تعبير عربي راسخ وطبيعي ينقل معنى الأعمال أو الأفعال الموصوفة بأنها حسنة أخلاقيًا.
- source_word: πρόδηλα
  choice: ظاهرة
  rationale: ينقل معنى كونها بيّنة أو منكشفة، ويقيم المقابلة مع ما لا يمكن أن يظل مخفيًا، من غير إثقال العبارة بدلالة زمنية غير محسومة في السياق.
- source_word: τὰ ἄλλως ἔχοντα
  choice: التي هي على خلاف ذلك
  rationale: 'يحفظ إيجاز التعبير اليوناني وغموضه: فقد يدل على الأعمال التي ليست ظاهرة على هذا النحو، ولا يصرّح النص بأنها أعمال شريرة.'
- source_word: κρυβῆναι οὐ δύνανται
  choice: لا يمكن أن تظل مخفية
  rationale: يعبّر عن عدم القدرة، وتفيد «تظل مخفية» أن الأعمال غير الظاهرة الآن لن تبقى مستترة.
theological_decisions:
- issue: هل تشير عبارة τὰ ἄλλως ἔχοντα تحديدًا إلى الأعمال الشريرة أم عمومًا إلى الأعمال التي ليست ظاهرة على النحو نفسه؟
  choice: 'الإبقاء على المعنى الأعم: الأعمال التي هي على خلاف ذلك أو ليست ظاهرة على النحو نفسه'
  alternative: تفسيرها تحديدًا بأنها الأعمال الشريرة قياسًا على الآية السابقة
  rationale: اليونانية لا تذكر «الشريرة» صراحة. لذلك يحافظ النص على الاحتمال الدلالي ولا يحسم المقابلة أخلاقيًا بما يتجاوز اللفظ، مع بقاء هذا الفهم ممكنًا من السياق.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «وكذلك أيضًا» للمحافظة على البنية التوكيدية في الأصل، وأُبقيت عبارة «على خلاف ذلك» عامةً كيلا يُحسم غموض النص اليوناني.
