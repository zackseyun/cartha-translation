  yaml_path: translation/nt/1_timothy/005/003.yaml
  text: Honor widows who are truly widows[a].
translation:
  language: ar
  text: أَكْرِمِ الأَرَامِلَ اللَّاتِي هُنَّ أَرَامِلُ حَقًّا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أَعِلِ الأرامل اللاتي هن أرامل حقًّا». يُرجَّح في هذا السياق أن يشمل «الإكرام» العناية المادية.'
    reason: بديل معجمي يوضح الدلالة السياقية المحتملة للفعل τιμάω.
lexical_decisions:
- source_word: Χήρας
  choice: الأرامل
  rationale: الاسم χήρα يدل مباشرة على المرأة التي مات زوجها، وجمع النصب هنا مفعول به لفعل الأمر.
- source_word: τίμα
  choice: أكرم
  rationale: الفعل τιμάω يعني الإكرام والتقدير وإظهار الاحترام. وفي هذا السياق يُرجَّح أن يشمل أيضًا الرعاية المادية، لكن «أكرم» يحفظ اتساع الدلالة الأصلية ولا يحصرها في الإعالة المالية.
- source_word: τὰς ὄντως χήρας
  choice: اللاتي هن أرامل حقًّا
  rationale: يحفظ هذا التعبير تكرار لفظ «الأرامل» في اليونانية، وينقل وظيفة ὄντως في تمييز من تنطبق عليهن صفة الترمل على النحو الذي يوضحه السياق اللاحق.
- source_word: ὄντως
  choice: حقًّا
  rationale: تفيد الكلمة «بالفعل، حقًّا»، وهي هنا علامة تقييد وتمييز لا مجرد توكيد بلاغي.
theological_decisions:
- issue: مدى دلالة τιμάω في السياق
  choice: الإكرام، مع احتمال اشتماله على الرعاية والإعالة المادية
  alternative: أَعِلِ الأرامل اللاتي هن أرامل حقًّا
  rationale: يناقش السياق القريب مسؤولية العناية المادية بالأرامل، لكن الفعل اليوناني أوسع من الإعالة وحدها. لذلك أبقى النص الرئيس معنى «الإكرام»، وذُكر المعنى السياقي الأضيق في الحاشية دون حسم التوتر الدلالي.
translation_notes:
  register: صياغة عربية فصحى حديثة واضحة ووقورة. استُخدم «حقًّا» للمحافظة على التمييز الذي يفيده ὄντως، وأُبقي تكرار «الأرامل» لأنه مقصود في النص اليوناني.
