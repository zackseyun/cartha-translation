base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/009.yaml
  text: Let a widow be enrolled only if she is not less than sixty years old[a], having been the wife of one husband,
translation:
  language: ar
  text: لا تُدرَج أرملةٌ في القائمة إلا إذا كان عمرها لا يقل عن ستين سنة، وكانت زوجةَ رجلٍ واحد[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «امرأة لرجل واحد». قد تشير العبارة إلى أمانتها الزوجية وحسن سيرتها، مع أن بعضهم يفهمها بمعنى أنها لم تتزوج إلا مرة واحدة.'
    reason: alternative_reading
lexical_decisions:
- source_word: Χήρα
  choice: أرملة
  rationale: المعنى المعتاد للكلمة في السياق، وهو امرأة مات زوجها، والحديث هنا عن شروط إدراج الأرامل في قائمة معتمدة.
- source_word: καταλεγέσθω
  choice: لا تُدرَج ... في القائمة إلا
  rationale: ينقل المعنى الإداري للفعل، أي تسجيلها رسميًا في قائمة، كما يحفظ قوة القيد الوارد في العبارة اليونانية.
- source_word: μὴ ἔλαττον ἐτῶν ἑξήκοντα
  choice: إذا كان عمرها لا يقل عن ستين سنة
  rationale: صياغة عربية واضحة وطبيعية تؤدي معنى الحد الأدنى للعمر بدقة.
- source_word: γεγονυῖα
  choice: كان عمرها
  rationale: اسم الفاعل التام مع تعبير العمر يدل اصطلاحيًا على بلوغ السن وصيرورتها في هذه الحال.
- source_word: ἑνὸς ἀνδρὸς γυνή
  choice: كانت زوجةَ رجلٍ واحد
  rationale: صياغة قريبة من تركيب الأصل وتحفظ احتمال دلالته على الوفاء الزوجي أو على الزواج مرة واحدة، من غير حسم ما لم يحسمه النص.
theological_decisions:
- issue: دلالة ἑνὸς ἀνδρὸς γυνή
  choice: الإبقاء على التعبير «زوجة رجل واحد» في المتن
  alternative: كانت وفية لزوجها؛ أو لم تتزوج إلا مرة واحدة
  rationale: التركيب يحتمل وصف الأمانة والسيرة الزوجية، كما فهمه بعضهم على أنه قصر الزواج على مرة واحدة. إبقاء العبارة الاصطلاحية مع حاشية يحفظ هذا التوتر التفسيري ولا يفرض موقفًا مذهبيًا.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُعمل «تُدرَج في القائمة» لإظهار الطابع الرسمي للتسجيل، وحُفظت العبارة الزوجية المحتملة الدلالة مع شرحها في الحاشية.
