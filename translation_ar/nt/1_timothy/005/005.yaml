  text: ἡ δὲ ὄντως χήρα καὶ μεμονωμένη ἤλπικεν ἐπὶ ⸀θεὸν καὶ προσμένει ταῖς δεήσεσιν καὶ ταῖς προσευχαῖς νυκτὸς καὶ ἡμέρας·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/005.yaml
  text: She who is truly a widow[a], and is left all alone[c][b], has set her hope on God and continues in petitions and prayers night and day.
translation:
  language: ar
  text: أمّا الأرملة حقًّا[a]، التي بقيت وحدها[b]، فقد وضعت رجاءها في الله[c]، وتواظب على الطلبات والصلوات ليلًا ونهارًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي الأرملة فعلًا بالمعنى الذي يحدده هذا السياق، لا مجرد من تُدعى أرملة.
    reason: lexical_alternative
  - marker: b
    text: 'أو: «التي تُركت وحدها» أو «المنفردة». يشدد اللفظ اليوناني على حالتها القائمة بوصفها وحدها.'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «رجت الله». قد تفيد صيغة التام اليونانية رجاءً راسخًا ما زال أثره قائمًا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: أمّا
  rationale: تفيد الانتقال مع إبراز المقابلة في السياق، من غير إدخال معنى زمني غير موجود في الأصل.
- source_word: ὄντως χήρα
  choice: الأرملة حقًّا
  rationale: يحفظ وصف الأرملة بأنها أرملة بالمعنى الفعلي الذي يحدده السياق، لا بمجرد اللقب الاجتماعي.
- source_word: μεμονωμένη
  choice: التي تُركت وحيدة
  rationale: 'يعكس اسم الفاعل التام المبني للمجهول حالةً ناتجة مستمرة: صارت بلا من يؤازرها وبقيت كذلك.'
- source_word: ἤλπικεν ἐπὶ θεόν
  choice: فقد وضعت رجاءها في الله
  rationale: ينقل صيغة التام بوصفها رجاءً راسخًا نشأ في الماضي وما زال أثره قائمًا.
- source_word: προσμένει
  choice: تواظب على
  rationale: تعبير عربي طبيعي يدل على الاستمرار والمثابرة من غير مبالغة في شدة الفعل.
- source_word: ταῖς δεήσεσιν καὶ ταῖς προσευχαῖς
  choice: الابتهالات والصلوات
  rationale: يُبقي اللفظين اليونانيين متميزين؛ فالابتهالات تبرز التضرع والطلب، والصلوات أعم.
- source_word: νυκτὸς καὶ ἡμέρας
  choice: ليلًا ونهارًا
  rationale: يحفظ ترتيب الأصل وتعبيره الاصطلاحي عن الممارسة المستمرة.
theological_decisions:
- issue: دلالة «الأرملة حقًّا»
  choice: 'وصف فئة محددة في سياق رعاية الجماعة: أرملة بلا سند، تتكل على الله وتواظب على الصلاة.'
  alternative: أن يكون الكلام وصفًا عامًا لكل الأرامل من غير أي دلالة على معايير الرعاية.
  rationale: وجود ὄντως وسياق 1 تيموثاوس 5 يميزان الأرملة المقصودة هنا، مع تجنب إدخال نظام كنسي مذهبي في الصياغة.
- issue: طبيعة الرجاء في صيغة التام
  choice: رجاء وُضع في الله ولا يزال ثابتًا.
  alternative: 'فعل رجاء وقع في الماضي فحسب، أو عبارة تقريرية مجردة: «ترجو الله».'
  rationale: صيغة ἤλπικεν التامة تتيح إبراز الحالة المستمرة الناتجة، ولذلك اختير تركيب يحفظ الفعل السابق وأثره الحاضر.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُعملت «أمّا» لربط الجملة بسياق المقابلة، و«تواظب» للدلالة على الاستمرار، مع إبقاء التمييز بين الابتهالات والصلوات. جميع علامات الحواشي مرتبة وموضوعة عند العبارة التي تشرحها.
