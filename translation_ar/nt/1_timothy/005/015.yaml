  text: For some have already turned aside to follow Satan.
translation:
  language: ar
  text: لأن بعضهن قد انحرفن بالفعل وراء الشيطان.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «خلف الشيطان»؛ والمعنى: اتبعن الشيطان.'
    reason: توضيح الصورة الأصلية وبيان معناها السياقي من غير استبدالها في المتن.
lexical_decisions:
- source_word: ἤδη
  choice: بالفعل
  rationale: تنقل تحقق الانحراف قبل وقت القول، وهي صياغة عربية طبيعية تحفظ القوة الزمنية للكلمة.
- source_word: γάρ
  choice: لأن
  rationale: تُبقي الصلة التعليلية أو التفسيرية بما سبق.
- source_word: τινες
  choice: بعضهن
  rationale: تحفظ دلالة جماعة غير محددة، وتراعي أن السياق السابق يتحدث عن النساء الشابات.
- source_word: ἐξετράπησαν
  choice: انحرفن
  rationale: تحفظ صورة العدول عن المسار من غير أن تضيف معنى سببيًا مثل «أُضللن».
- source_word: ὀπίσω
  choice: وراء
  rationale: تحفظ الصورة المكانية الأصلية «وراء/خلف»، وتوحي في هذا السياق بالسير في أثر شخص واتباعه من غير أن تستبدل الصورة بتفسير محض.
- source_word: Σατανᾶ
  choice: الشيطان
  rationale: الصيغة العربية المعيارية المعروفة للاسم أو اللقب في العهد الجديد.
theological_decisions:
- issue: هل تُترجم عبارة ὀπίσω τοῦ Σατανᾶ ترجمة تصويرية «وراء الشيطان» أم تفسيرية «ليتبعن الشيطان»؟
  choice: وراء الشيطان
  alternative: ليتبعن الشيطان
  rationale: تُبقي الترجمة المختارة صورة النص واحتمالها الدلالي، مع بقاء معنى الاتباع مفهومًا في العربية، من غير إضافة علاقة غائية غير مصرّح بها نحويًا.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموجزة. استُعمل ضمير جمع المؤنث اتساقًا مع مرجع «بعض» في السياق السابق، مع الحفاظ على استعارة الانحراف والسير وراء شخص.
