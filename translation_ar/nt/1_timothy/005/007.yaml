    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: وَ
  rationale: حرف عطف بسيط يصل هذه الوصية بما سبق من غير إضافة توكيد غير موجود في اليونانية.
- source_word: ταῦτα
  choice: بهذه الأمور
  rationale: اسم الإشارة المحايد الجمع يعود طبيعيًا إلى التوجيهات السابقة والمحيطة، ولفظ «الأمور» يحافظ على عموم التعبير اليوناني.
- source_word: παράγγελλε
  choice: أوصِ
  rationale: صيغة أمر تحمل معنى التوجيه الملزم ذي السلطة. «أوصِ» طبيعية في العربية الفصحى وتحافظ على الجدية، مع بيان بديل أشد صراحة في الحاشية.
- source_word: ἵνα
  choice: لكي
  rationale: تُدخل جملة الغاية أو النتيجة المقصودة بوضوح وطبيعية.
- source_word: ἀνεπίλημπτοι
  choice: بلا ملامة
  rationale: تدل العبارة على ألا يكون الشخص عرضة للوم مشروع؛ وهي أقل إيحاءً بالكمال المطلق من «بلا عيب».
- source_word: ὦσιν
  choice: يكونوا
  rationale: تنقل صيغة المضارع الالتزامية بعد ἵνα ضمن جملة الغاية، مع إبقاء مرجع فاعل الجمع غير مصرّح به كما في اليونانية.
theological_decisions:
- issue: مرجع فاعل الجمع المستتر في «يكونوا بلا ملامة»
  choice: الإبقاء عليه بصيغة الجمع من غير تسمية الجماعة المقصودة في المتن.
  alternative: قد يُفهم أنه يشير إلى المذكورين في التوجيهات السابقة، ولا سيما الأرامل وأهل بيوتهن؛ وقد يُفهم على نطاق أوسع بحسب السياق.
  rationale: لا يصرّح النص اليوناني بمرجع الفاعل. لذلك لا ينبغي حسم الغموض بإضافة اسم غير موجود في الأصل.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدمت «أوصِ» لتجنب تركيب ثقيل مع الحفاظ على سلطة الأمر، و«بلا ملامة» للتعبير عن انتفاء موجب اللوم من غير الإيحاء بعصمة مطلقة.
