lexical_decisions:
- source_word: ἔχουσαι
  choice: فتقعن تحت
  rationale: اسم الفاعل يعني حرفيًا «ولهن»، لكنه مع κρίμα يدل اصطلاحيًا على الوقوع تحت حكم؛ والصياغة العربية تربطه طبيعيًا بالسياق السابق.
- source_word: κρίμα
  choice: الدينونة
  rationale: تعبّر عن الحكم القضائي الجاد من غير أن تحسم أن المقصود هو الإدانة الأبدية أو عقوبة بعينها.
- source_word: ὅτι
  choice: لأنهن
  rationale: تُدخل سبب وقوعهن تحت الدينونة بوضوح.
- source_word: τὴν πρώτην πίστιν
  choice: إيمانهن الأول
  rationale: تحافظ «الإيمان» على الدلالة الأساسية لـ πίστις، و«الأول» تقابل πρῶτος مباشرة وتبقي احتمال العهد أو الالتزام السابق موضحًا في الحاشية.
- source_word: ἠθέτησαν
  choice: نبذن
  rationale: تفيد رفض الشيء وطرحه جانبًا، وتحافظ على قوة الفعل دون افتراض معنى تقني غير مصرّح به.
theological_decisions:
- issue: معنى τὴν πρώτην πίστιν في السياق
  choice: إيمانهن الأول
  alternative: عهدهن الأول أو التزامهن السابق
  rationale: قد تشير πίστις إلى الإيمان الذي سبق أن أقررنه، أو إلى عهد أو التزام سابق ربما اتصل بإدراج المرأة في سجل الأرامل. أبقى المتن معنى «الإيمان»، وتعرض الحاشية الاحتمال السياقي الآخر من غير حسم.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعملت «الدينونة» للحفاظ على الطابع القضائي، وأُبقي الغموض الحقيقي في «الإيمان الأول» مع بيان البدائل في الحاشية.
