  text: εἴ ⸀τις πιστὴ ἔχει χήρας, ⸀ἐπαρκείτω αὐταῖς, καὶ μὴ βαρείσθω ἡ ἐκκλησία, ἵνα ταῖς ὄντως χήραις ἐπαρκέσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/016.yaml
  text: If any believing woman has widows[a], let her provide for them, and let the church not be burdened, so that it may provide for those who are truly widows.
translation:
  language: ar
  text: إن كانت امرأة مؤمنة لديها أرامل[a]، فَلْتُعِنْهُنَّ، ولا تُثقَّل الكنيسة، لكي تعين الأرامل حقًّا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ بعض المخطوطات: «إن كان رجل مؤمن أو امرأة مؤمنة لديه أو لديها أرامل»، أو: «إن كان مؤمن لديه أرامل»، فتوسّع الوصية بحيث لا يقتصر فاعلها على امرأة.'
    reason: textual_variant
lexical_decisions:
- source_word: τις πιστὴ
  choice: امرأة مؤمنة
  rationale: الصيغة اليونانية مؤنثة مفردة في هذا النص، ولذلك تشير إلى امرأة بعينها من حيث الجنس، و«مؤمنة» تعبّر طبيعيًّا عن هويتها المسيحية.
- source_word: χήρας
  choice: أرامل
  rationale: جمع صريح لكلمة «أرملة»، والسياق يتناول تقديم العون المادي للأرامل.
- source_word: ἐπαρκείτω / ἐπαρκέσῃ
  choice: فلتعِنْهُنَّ / تعين
  rationale: الفعل يدل هنا على تقديم العون الكافي والعملي. حافظت الترجمة على الجذر العربي نفسه في الموضعين لإظهار التكرار في الأصل.
- source_word: βαρείσθω
  choice: لا تُثقَّل
  rationale: يحفظ صورة الثقل في المبني للمجهول، ويفيد عدم تحميل الكنيسة عبء مسؤولية الإعالة.
- source_word: ἡ ἐκκλησία
  choice: الكنيسة
  rationale: المقصود جماعة المؤمنين المحلية، و«الكنيسة» هي العبارة العربية القياسية والواضحة في هذا السياق.
- source_word: ταῖς ὄντως χήραις
  choice: الأرامل حقًّا
  rationale: يحفظ التشديد الذي تفيده ὄντως، ويشير في سياق الإصحاح إلى من تنطبق عليهن حالة الترمل المحتاجة إلى عون الكنيسة فعلًا، دون إدخال هذا التفسير في المتن.
theological_decisions:
- issue: جنس الفاعل في العبارة الافتتاحية
  choice: امرأة مؤمنة
  alternative: أي مؤمن؛ أو أي رجل مؤمن أو امرأة مؤمنة
  rationale: النص المزوَّد من SBLGNT يقرأ τις πιστή بصيغة المؤنث المفرد، فحُفظ جنس الفاعل في المتن. أما القراءات الأوسع في بعض المخطوطات فذُكرت في الحاشية بدل إحلالها محل قراءة المتن.
- issue: معنى «الأرامل حقًّا»
  choice: إبقاء العبارة الموجزة «الأرامل حقًّا»
  alternative: الأرامل المحتاجات فعلًا؛ أو الأرامل اللواتي لا عائل لهن
  rationale: الصياغة المختارة تحفظ تعبير الأصل والتوتر السياقي، ولا تختزل الفئة إلى تفسير واحد، مع أن سياق الإصحاح يوضح أنها تتصل بمن يحتجن إلى إعالة الكنيسة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «فلتعِنْهُنَّ» للدلالة على العون العملي الكافي مع الحفاظ على تكرار الفعل اليوناني، و«لا تُثقَّل الكنيسة» لصون صورة العبء في الأصل.
