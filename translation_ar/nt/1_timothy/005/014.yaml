  rationale: يُبقي التنقيح المقصود السياقي لـ«الأرامل الأصغر سنًّا» وغموض هوية «الخصم»، ويجعل بناء الجملة أكثر مباشرة في العربية. كما يستبدل «للتشهير» بـ«للإساءة» لتفادي حصر λοιδορίας في معنى قانوني أو إعلامي خاص، مع الحفاظ على معنى إعطاء الخصم مناسبة للكلام العدائي.
