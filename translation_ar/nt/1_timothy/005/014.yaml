base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/014.yaml
  text: Therefore I want younger widows to marry[a], to bear children, to manage their households[b], and to give the opponent no opportunity for slander.
translation:
  language: ar
  text: لذلك أريد أن تتزوّج الأرامل الأصغر سنًّا[a]، وأن يلدن الأولاد، ويدبّرن بيوتهن، وألّا يعطين الخصم[b] أي ذريعة للإساءة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يقول اليوناني ببساطة: «يتزوّجن»؛ ولأن الحديث عن أرامل، فالزواج مرة أخرى مفهوم من السياق.'
    reason: lexical_alternative
  - marker: b
    text: أو «العدو»؛ وقد يكون المقصود الشيطان.
    reason: alternative_reading
lexical_decisions:
- source_word: βούλομαι
  choice: أريد
  rationale: تنقل إرادة بولس أو رغبته بصياغة عربية طبيعية، وتحافظ على الطابع الشخصي للفعل.
- source_word: οὖν
  choice: لذلك
  rationale: تُظهر أن الكلام نتيجة مستخلصة من المناقشة السابقة.
- source_word: νεωτέρας
  choice: الأرامل الأصغر سنًّا
  rationale: الصفة تعني حرفيًّا «الأصغر سنًّا»، لكن سياق الأصحاح يحدد أن المقصود هو الأرامل؛ لذلك أُظهر الاسم المفهوم من السياق.
- source_word: γαμεῖν
  choice: أن يتزوّجن
  rationale: الفعل يعني «يتزوجن» دون أن يصرّح لغويًّا بمعنى «مرة أخرى»؛ أما كون الزواج هنا زواجًا ثانيًا فمفهوم من أن المخاطبات أرامل.
- source_word: τεκνογονεῖν
  choice: ويلدن الأولاد
  rationale: يحافظ على الدلالة المحددة للفعل، وهي إنجاب الأولاد أو ولادتهم، بدل تعبير أوسع مثل «يكون لهن أولاد».
- source_word: οἰκοδεσποτεῖν
  choice: ويدبّرن بيوتهن
  rationale: ينقل معنى تولّي تدبير شؤون البيت والإشراف عليه، من غير تحميل الفعل إيحاءً قاسيًا بالسيطرة.
- source_word: μηδεμίαν ἀφορμὴν
  choice: أي فرصة
  rationale: العبارة تدل على عدم إعطاء منفذ أو مناسبة، و«أي فرصة» واضحة وطبيعية بعد النفي في العربية.
- source_word: διδόναι
  choice: يعطين
  rationale: يحافظ على المعنى المباشر للفعل وعلى تنسيقه مع سلسلة الأفعال السابقة.
- source_word: τῷ ἀντικειμένῳ
  choice: الخصم
  rationale: يحافظ على المفرد وعلى معنى «المعارض» من غير أن يحسم هل المقصود إنسان معادٍ أم الشيطان.
- source_word: λοιδορίας χάριν
  choice: للتشهير
  rationale: ينقل الغرض المتعلق بالكلام العدائي الذي يسيء إلى السمعة؛ وهو تعبير عربي موجز يناسب تركيب إعطاء فرصة.
theological_decisions:
- issue: هوية τῷ ἀντικειμένῳ
  choice: الخصم، مع إبقاء هويته غير محددة
  alternative: العدو، على أن يُفهم أنه الشيطان
  rationale: النص اليوناني يقول حرفيًّا «المعارض» ولا يسمّي الشيطان صراحة، كما أن السياق يسمح بأن يكون المقصود ناقدًا معاديًا. لذلك لا تحسم الترجمة هوية المرجع، وتذكر الحاشية الاحتمال الآخر.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة. صيغت الأفعال بعد «أريد من» على نحو طبيعي، مع الحفاظ على تتابعها في الأصل وعلى غموض هوية الخصم.
