source:
  edition: SBLGNT
  text: εἰ δέ τις χήρα τέκνα ἢ ἔκγονα ἔχει, μανθανέτωσαν πρῶτον τὸν ἴδιον οἶκον εὐσεβεῖν καὶ ἀμοιβὰς ἀποδιδόναι τοῖς προγόνοις, τοῦτο γάρ ἐστιν ἀπόδεκτον ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/004.yaml
  text: But if any widow has children or grandchildren[a], let them first learn to show godliness to their own household and to repay their forebears[c][b], for this is acceptable before God.
translation:
  language: ar
  text: ولكن إن كانت لأرملةٍ أولادٌ أو أحفاد[a]، فليتعلّموا أولًا أن يُظهروا التقوى في رعاية أهل بيتهم[b]، وأن يردّوا الجميل إلى أسلافهم[c]؛ لأن هذا مقبول أمام الله.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أولاد أو ذرية». فاللفظ اليوناني ἔκγονα أوسع من «أحفاد»، لكنه يشير هنا على الأرجح إلى الجيل التالي في الأسرة.
    reason: lexical_alternative
  - marker: b
    text: أو «أن يمارسوا التقوى نحو أهل بيتهم». فاللفظ اليوناني يربط رعاية الأسرة بالتقوى.
    reason: lexical_alternative
  - marker: c
    text: 'حرفيًا: «إلى من سبقوهم في النسب» أو «إلى أسلافهم». ويُقصد في هذا السياق الوالدان أو الأجداد على الأرجح.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χήρα
  choice: أرملة
  rationale: المعنى المعتاد للفظ اليوناني، وسياق الفقرة كله يتناول الأرامل.
- source_word: τέκνα ἢ ἔκγονα
  choice: أولاد أو أحفاد
  rationale: τέκνα تعني الأولاد، وἔκγονα تعني الذرية أو المتحدرين، والأحفاد هم المراد الأرجح في سياق مسؤولية الأجيال القريبة عن رعاية الأرملة.
- source_word: μανθανέτωσαν
  choice: فليتعلّموا
  rationale: صيغة أمر للغائب الجمع، وترجمتها بهذه الصيغة تحفظ قوة الأمر وتُظهر أن الأولاد أو الأحفاد هم المخاطبون.
- source_word: πρῶτον
  choice: أولًا
  rationale: تفيد أولوية الواجب العائلي بوصفه المجال الأول لممارسة التقوى.
- source_word: τὸν ἴδιον οἶκον
  choice: أهل بيتهم
  rationale: οἶκος هنا يشير إلى الأسرة أو أهل البيت، لا إلى البناء المادي، والضمير يحفظ معنى ἴδιον، أي الخاص بهم.
- source_word: εὐσεβεῖν
  choice: أن يمارسوا التقوى نحو
  rationale: يحفظ التعبير البعد الديني الصريح للفظ، مع توجيه هذه التقوى عمليًا إلى أهل البيت.
- source_word: ἀμοιβὰς ἀποδιδόναι
  choice: أن يردّوا الجميل
  rationale: ينقل معنى تقديم المقابل والوفاء لمن سبق أن اعتنى بهم، بصياغة عربية طبيعية من غير إيحاء بمعاملة مالية محضة.
- source_word: τοῖς προγόνοις
  choice: إلى والديهم وأجدادهم
  rationale: اللفظ يدل على السابقين في النسب أو الأصول. وتحديد الوالدين والأجداد يوضح المقصود المرجح في سياق الأسرة الحاضرة، مع إثبات المجال الأوسع في الحاشية.
- source_word: ἀπόδεκτον
  choice: مقبول
  rationale: مقابل مباشر يفيد أن الله يتقبل هذا السلوك ويرضاه.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: لدى الله
  rationale: تعبير عربي طبيعي ينقل معنى كون الفعل مقبولًا في حضرة الله ووفق حكمه.
theological_decisions:
- issue: مرجع فعل الأمر الجمع μανθανέτωσαν
  choice: الأمر موجّه إلى أولاد الأرملة أو أحفادها.
  alternative: أن يكون الأمر موجّهًا إلى الأرامل عمومًا، مع تحوّل في العدد أو فاعل مقدّر.
  rationale: أقرب مرجع جمع في التركيب هو «الأولاد أو الأحفاد»، وهذا يلائم الحديث عن وفاء الأجيال اللاحقة لمن سبقوهم بالرعاية.
- issue: دلالة εὐσεβεῖν في صلتها برعاية الأسرة
  choice: القيام بالواجب نحو أهل البيت ممارسة للتقوى، لا مجرد التزام اجتماعي.
  alternative: أن يدل اللفظ فقط على أداء واجب عائلي مع تهميش دلالته الدينية.
  rationale: للفعل دلالة صريحة على التقوى، كما أن ختام الآية يضع هذا السلوك أمام الله؛ لذلك حُفظ البعد الديني من غير زيادة تفسيرية.
- issue: مدى دلالة τοῖς προγόνοις
  choice: صيغت في المتن «والديهم وأجدادهم» بحسب الأجيال السابقة القريبة في سياق الرعاية الأسرية.
  alternative: «أسلافهم» أو «أصولهم»، بما يحفظ العموم الحرفي لكنه قد يوحي في العربية بأسلاف بعيدين أو متوفين.
  rationale: الصياغة المختارة أوضح للقارئ المعاصر وتلائم السياق، بينما تحفظ الحاشية السعة المعجمية للفظ اليوناني.
translation_notes:
  register: العربية فصحى معاصرة واضحة ووقورة. استُخدم «أهل بيتهم» بدل «بيتهم» لتجنب فهم المبنى، و«يردّوا الجميل» بدل تعبير مالي جامد. وُضعت علامات الحواشي [a] و[b] و[c] في مواضعها داخل المتن.
