lexical_decisions:
- source_word: μηκέτι
  choice: لا تَعُدْ
  rationale: تعبير عربي طبيعي يدل على التوقف عن ممارسة سابقة، ويحافظ على قوة الأمر في اليونانية.
- source_word: ὑδροπότει
  choice: تَشْرَبُ الماءَ وحده
  rationale: الفعل يعني شرب الماء، والمقابلة مع استعمال الخمر تدل على أن المقصود عدم الاقتصار على الماء، لا الامتناع عنه كليًا.
- source_word: ἀλλὰ
  choice: بل
  rationale: أداة استدراك مناسبة تنقل الانتقال إلى التوجيه المقابل.
- source_word: οἴνῳ ὀλίγῳ
  choice: قليلًا من الخمر
  rationale: يحافظ على ذكر الخمر صراحة وعلى قيد القلة الدال على المقدار المحدود.
- source_word: χρῶ
  choice: استعمل
  rationale: ينقل المعنى الأساسي للفعل، أي الانتفاع بشيء أو استعماله، من غير إضافة غرض طبي غير مصرّح به صراحة.
- source_word: διὰ
  choice: من أجل
  rationale: ينقل معنى السبب أو الاعتبار الدافع مع الاسم في حالة النصب.
- source_word: στόμαχον
  choice: معدتك
  rationale: المقابل التشريحي المباشر والواضح للكلمة اليونانية.
- source_word: πυκνάς
  choice: المتكررة
  rationale: يعبّر طبيعيًا عن كثرة وقوع العلل وتواترها.
- source_word: ἀσθενείας
  choice: أمراضك
  rationale: السياق الجسدي والطبي يرجّح معنى الأمراض أو العلل على معنى الضعف العام.
theological_decisions:
- issue: هل يُصرَّح بأن ممارسة تيموثاوس السابقة كانت الاقتصار على الماء؟
  choice: لا تَعُدْ تَشْرَبُ الماءَ وحده
  alternative: لا تَعُدْ تَشْرَبُ الماء
  rationale: المقابلة مع «بل استعمل قليلًا من الخمر» تدل على عدم الاقتصار على الماء، لا على تحريم شربه؛ وإضافة «وحده» تمنع فهمًا عربيًا مضللًا.
- issue: هل تُترجم οἶνος ترجمة حرفية أم تُعمَّم بوصفها شرابًا علاجيًا؟
  choice: الخمر
  alternative: شراب علاجي
  rationale: النص اليوناني يذكر الخمر صراحة، فلا ينبغي تلطيف اللفظ أو توسيعه لأسباب عقدية أو ثقافية؛ كما أن «قليلًا» يحفظ قيد الاعتدال الوارد في النص.
translation_notes:
  register: العربية فصحى حديثة، واضحة ووقورة. استُخدم «لا تَعُدْ» لصياغة النهي عن استمرار عادة سابقة، و«وحده» لإظهار معنى الحصر الذي تفيده المقابلة في السياق. وُضعت علامة الحاشية [a] في المتن.
