  text: But refuse younger widows[a], for when they become sensual against the Messiah, they desire to marry[c][b],
translation:
  language: ar
  text: أمّا الأرامل الأصغر سنًّا، فلا تُدرِجْهُنَّ في القائمة[a]؛ لأنهنّ، متى استسلمن لشهواتهنّ بما يتعارض مع المسيح[b][c]، يرغبن في الزواج.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًّا: «فارفض الأرامل الأصغر سنًّا». ويُفهم الأمر في سياقه على أنه عدم إدراجهنّ في قائمة الأرامل المذكورة سابقًا، لا نبذهنّ أو الامتناع عن مساعدتهنّ.'
    reason: contextual_clarification
  - marker: b
    text: 'حرفيًّا: «ضدّ المسيح». والعلاقة النحوية في اليونانية موجزة وصعبة؛ وقد يكون المعنى أن شهواتهنّ تدخل في صراع مع إخلاص أو التزام سابق للمسيح.'
    reason: alternative_reading
  - marker: c
    text: 'يمكن أيضًا ترجمة العبارة: «متى غلبتهنّ الشهوة على نحوٍ يصرفهنّ عن المسيح» أو «متى صرن مندفعات وراء الشهوة في معارضة للمسيح».'
    reason: lexical_alternative
lexical_decisions:
- source_word: νεωτέρας δὲ χήρας
  choice: أمّا الأرامل الأصغر سنًّا
  rationale: تنقل الصفة بصيغتها المقارنة وتُظهر الانتقال المقابل إلى فئة أخرى من الأرامل دون تحديد سنّ غير مذكور.
- source_word: παραιτοῦ
  choice: فلا تقبل إدراجهنّ في القائمة
  rationale: السياق السابق يتناول إدراج الأرامل في قائمة مخصوصة؛ وهذه الصياغة تمنع فهم الأمر على أنه رفض للأرامل الشابات بوصفهن أشخاصًا أو قطع للعلاقة بهن.
- source_word: ὅταν γὰρ
  choice: لأنهنّ متى
  rationale: تحفظ القوة التعليلية لـ γάρ والدلالة الزمنية العامة لـ ὅταν.
- source_word: καταστρηνιάσωσιν
  choice: اندفعن وراء شهواتهنّ
  rationale: الفعل النادر يدل على تغلّب نزعات شهوانية أو حسية تدفع إلى مسار يناقض التزامًا سابقًا؛ والصياغة العربية واضحة من غير اختزال المعنى في مجرد الرغبة في الزواج.
- source_word: τοῦ Χριστοῦ
  choice: في تعارض مع المسيح
  rationale: تحافظ على العلاقة الصعبة التي يفيدها المضاف إليه اليوناني بعد الفعل، من غير الجزم بأن المقصود هو الزواج نفسه بوصفه معارضة للمسيح.
- source_word: γαμεῖν θέλουσιν
  choice: أردن أن يتزوّجن
  rationale: تنقل معنى الرغبة أو الإرادة الذي تفيده θέλουσιν مع مصدر الزواج.
theological_decisions:
- issue: دلالة Χριστοῦ
  choice: المسيح
  alternative: المسيح يسوع / لقب بمعنى الممسوح
  rationale: «المسيح» هو المقابل العربي الطبيعي الراسخ للقب Χριστός، ولا داعي هنا إلى تحويله إلى اسم شخصي موسّع.
- issue: معنى καταστρηνιάσωσιν τοῦ Χριστοῦ
  choice: اندفعن وراء شهواتهنّ في تعارض مع المسيح
  alternative: غلبتهنّ الشهوة بعيدًا عن المسيح / تمردن على المسيح بدافع الشهوة
  rationale: تبقي الصياغة التوتر القائم في اليونانية بين الدافع الحسي وعلاقته بالمسيح، ولا تجعل الزواج في ذاته موضع الإدانة، ولا تفترض في المتن تفسيرًا كاملًا لطبيعة الالتزام السابق.
- issue: نطاق الأمر παραιτοῦ
  choice: عدم قبول إدراجهن في القائمة
  alternative: ارفضهنّ
  rationale: يبيّن السياق أن الأمر متعلق بالقائمة المذكورة في الآية 9، فتجنّبت الصياغة إيحاء رفض الأرامل الأصغر سنًا أو نبذهن مطلقًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «الأصغر سنًّا» لحفظ المقارنة، وذُكرت «القائمة» اعتمادًا على السياق المباشر لتفادي معنى الرفض الاجتماعي المطلق. أما العبارة المتعلقة بالمسيح فصيغت بقدر من الحرفية مع شرح البدائل في الحواشي حفاظًا على غموض التركيب اليوناني وتوتره اللاهوتي.
