    reason: cross_reference
lexical_decisions:
- source_word: τοὺς ἁμαρτάνοντας
  choice: الذين يخطئون
  rationale: اسم فاعل مضارع مسبوق بأداة التعريف، ويدل مباشرة على «الذين يخطئون». وقد يوحي وجهه الاستمراري بالتمادي في الخطية، لكن التصريح بذلك في المتن أضيق من اللفظ اليوناني، لذلك ذُكر في الحاشية.
- source_word: ἐνώπιον πάντων
  choice: أمام الجميع
  rationale: يحافظ على معنى العبارة الحرفي، أي وقوع التوبيخ في حضور الجميع، بلغة عربية واضحة وطبيعية.
- source_word: ἔλεγχε
  choice: فوبِّخهم
  rationale: الفعل قد يعني الكشف أو الإدانة أو التوبيخ؛ وفي سياق التأديب والرعاية، ينقل «وبِّخ» معنى المواجهة التصحيحية من غير قصره على مجرد فضح الخطأ.
- source_word: οἱ λοιποὶ
  choice: الباقين
  rationale: ينقل الإشارة إلى سائر من عدا المخطئين بإيجاز، مع إبقاء هوية هذه الجماعة غير محددة كما في الأصل.
- source_word: φόβον ἔχωσιν
  choice: يكون عند الباقين أيضًا خوف
  rationale: يحافظ على تركيب «يكون لهم خوف» وعلى اتساع دلالة الخوف، فلا يحصره في الرعب ولا يفسره صراحة بأنه خشية توقيرية.
theological_decisions:
- issue: نطاق المقصودين بالذين يخطئون
  choice: 'أُبقي المتن عامًا: «الذين يخطئون»، من غير إضافة «الشيوخ».'
  alternative: قد يكون المقصود تحديدًا الشيوخ الذين يخطئون، بسبب السياق المباشر في الآيتين 19–20.
  rationale: الآية نفسها لا تكرر لفظ «الشيوخ»، مع أن السياق السابق يجعل تخصيصهم احتمالًا قويًا. لذلك حُفظ لفظ النص في المتن، ووُضح الاحتمال السياقي في الحاشية من غير حسم التوتر التفسيري.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «يخطئون» بدل تعبير أثقل مثل «الذين هم في حال ارتكاب الخطية»، وحُفظت علنية التوبيخ واتساع دلالة الخوف. وُضعت علامة الحاشية [b] عند العبارة التي تتعلق بنطاق المخطئين، ثم [a] عند العبارة نفسها لبيان احتمال الاستمرار، التزامًا بظهور جميع العلامات في المتن.
