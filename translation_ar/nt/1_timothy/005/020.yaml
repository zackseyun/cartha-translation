  text: وَبِّخ الذين يخطئون[a][b] أمام الجميع، لكي يخاف الباقون أيضًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الذين يستمرون في الخطيئة»؛ فقد يوحي اسم الفاعل الحاضر بسلوك خاطئ مستمر.'
