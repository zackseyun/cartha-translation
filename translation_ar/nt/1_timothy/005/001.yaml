lexical_decisions:
- source_word: Πρεσβυτέρῳ
  choice: رجلًا مسنًّا
  rationale: الصفة اليونانية مستعملة استعمال الاسم، والمقابلة مع «الشبان» هنا، ثم مع فئات النساء في الآية التالية، ترجّح الدلالة العمرية. وأُبقي التذكير وصيغة المفرد.
- source_word: μὴ ἐπιπλήξῃς
  choice: لا توبِّخ
  rationale: الفعل يدل على الزجر أو التقريع بالكلام. «توبِّخ» عربية واضحة ومباشرة، ولا تضيف إلى النص تحديدًا زائدًا لدرجة الحدّة.
- source_word: ἀλλὰ παρακάλει
  choice: بل ناشِده
  rationale: للفعل معانٍ منها الحث والتشجيع والمناشدة. وفي مقابل التوبيخ، ومع التشبيه بالأب، تعبّر «ناشِده» عن مخاطبة احترامية ملحّة دون قسوة.
- source_word: ὡς πατέρα
  choice: كأب
  rationale: تنقل أداة التشبيه ὡς بإيجاز طبيعي وتحفظ صورة العلاقة العائلية.
- source_word: νεωτέρους
  choice: الشبان
  rationale: الصفة المذكرة الجمع مستعملة استعمال الاسم، ويؤيد السياق تخصيص الذكور إذ تعالج الآية التالية النساء الأكبر والأصغر سنًّا على حدة.
- source_word: ὡς ἀδελφούς
  choice: كإخوة
  rationale: يحفظ التذكير في الاسم اليوناني وصورة الأسرة، من غير إضافة معنى مثل «في الإيمان» غير المصرح به.
theological_decisions:
- issue: هل Πρεσβυτέρῳ يعني صاحب منصب كنسي أم رجلًا متقدمًا في السن؟
  choice: 'الدلالة العمرية: «رجلًا مسنًّا»'
  alternative: «شيخًا» بمعنى صاحب منصب كنسي
  rationale: 'ينظم السياق المخاطَبين بحسب العمر والجنس: رجل مسن كأب، وشبان كإخوة، ثم نساء مسنات كأمهات وشابات كأخوات. وهذا التناظر يرجح الدلالة العمرية، مع إبقاء البديل الحقيقي في الحاشية.'
- issue: هل ἀδελφούς يُترجم ترجمة شاملة للجنسين؟
  choice: «إخوة» في الإشارة إلى الذكور
  alternative: «إخوة وأخوات»
  rationale: السياق يميز بين الذكور والإناث، واللفظ هنا مذكر وجزء من تقسيم محدد بحسب الجنس والعمر؛ لذلك لا يناسب تعميمه على الجنسين.
translation_notes:
  register: صياغة عربية فصحى معاصرة، واضحة ووقورة. اختيرت «ناشِده» لإظهار المقابلة بين الزجر القاسي والمخاطبة الاحترامية، واستُخدمت «كأب» و«كإخوة» للمحافظة على الإيجاز والتوازي العائلي في الأصل.
