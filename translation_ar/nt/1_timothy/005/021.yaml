base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/021.yaml
  text: I solemnly charge you in the presence of God and Messiah Jesus and the chosen angels[a], that you keep these things without prejudice[c][b], doing nothing according to partiality.
translation:
  language: ar
  text: أوصيك أمام الله والمسيح يسوع والملائكة المختارين[a] أن تحفظ هذه الأمور من دون حكم مسبق[b]، وألا تفعل شيئًا بدافع المحاباة[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الملائكة المصطفين».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «من دون إصدار حكم سلفًا».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «من غير تحيز إلى أحد».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διαμαρτύρομαι
  choice: أناشدك بكل جدية
  rationale: ينقل قوة التكليف المؤكد والمهيب في سياق الوصية، ولا يحصر الفعل في معنى الشهادة وحدها.
- source_word: ἐνώπιον
  choice: أمام
  rationale: تعبير عربي طبيعي يحفظ معنى الحضور والشهادة المهيبة.
- source_word: Χριστοῦ Ἰησοῦ
  choice: المسيح يسوع
  rationale: يحفظ ترتيب الأصل ويترجم Χριστός بوصفه لقبا ذا معنى، بصيغة عربية راسخة ومفهومة.
- source_word: ἐκλεκτῶν ἀγγέλων
  choice: الملائكة المختارين
  rationale: ينقل معنى الاختيار بوضوح من غير أن يحدد سبب الاختيار أو طبيعته بما يتجاوز النص.
- source_word: ταῦτα
  choice: هذه الأمور
  rationale: يحيل إجمالا إلى الوصايا السابقة من غير زيادة تفسيرية.
- source_word: φυλάξῃς
  choice: تحفظ
  rationale: يجمع بين مراعاة الوصايا والتمسك بها بأمانة.
- source_word: χωρὶς προκρίματος
  choice: من دون حكم مسبق
  rationale: يعكس المعنى الدقيق لـ πρόκριμα، أي إصدار حكم قبل النظر المنصف، ويميزه عن المحاباة المذكورة بعده.
- source_word: μηδὲν ποιῶν
  choice: وألا تفعل شيئا
  rationale: يصوغ اسم الفاعل اليوناني في عطف عربي طبيعي مع إبقاء صلته بالوصية الرئيسة.
- source_word: κατὰ πρόσκλισιν
  choice: بدافع المحاباة
  rationale: يؤدي معنى الميل إلى طرف وتفضيله، بلغة عربية واضحة وسلسة.
theological_decisions:
- issue: دلالة Χριστός
  choice: المسيح يسوع
  alternative: يسوع المسيح
  rationale: ترجمة «المسيح» تحفظ مدلول اللقب، وترتيب «المسيح يسوع» يوافق ترتيب العبارة اليونانية من غير تحويلها إلى صيغة اسمية مألوفة على حساب الأصل.
- issue: هوية «الملائكة المختارين»
  choice: الإبقاء على الوصف من غير تفسير إضافي
  alternative: تفسيرهم بأنهم فئة بعينها من الملائكة الأمناء أو الشهود
  rationale: النص يصفهم بالمختارين لكنه لا يبين جهة الاختيار أو غايته؛ لذلك لا ينبغي حسم الاحتمال لاهوتيا داخل الترجمة.
translation_notes:
  register: العربية فصحى معاصرة واضحة ومهيبة. استعملت «أناشدك بكل جدية» لإظهار قوة التكليف، وميزت بين «الحكم المسبق» و«المحاباة» حتى لا يندمج المصطلحان اليونانيان المختلفان في معنى واحد.
