source:
  edition: SBLGNT
  text: ἐν ἔργοις καλοῖς μαρτυρουμένη, εἰ ἐτεκνοτρόφησεν, εἰ ἐξενοδόχησεν, εἰ ἁγίων πόδας ἔνιψεν, εἰ θλιβομένοις ἐπήρκεσεν, εἰ παντὶ ἔργῳ ἀγαθῷ ἐπηκολούθησεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/010.yaml
  text: 'well attested for good works: if she has raised children[a], if she has shown hospitality, if she has washed the feet of the saints, if she has helped those under affliction[c][b], if she has followed every good work.'
translation:
  language: ar
  text: 'مَشهودًا لها بالأعمال الحسنة: إن كانت قد ربَّت الأولاد، وإن كانت قد أضافت الغرباء[a]، وإن كانت قد غسلت أقدام القديسين[b]، وإن كانت قد أعانت الذين يعانون الضيق، وإن كانت قد سعت وراء كل عمل صالح[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي استقبلت الغرباء أو الضيوف في بيتها وأكرمتهم.
    reason: lexical_alternative
  - marker: b
    text: «القديسون» هنا هم شعب الله المقدس، أي سائر المؤمنين.
    reason: lexical_alternative
  - marker: c
    text: 'أو: اتبعت كل عمل صالح. يفيد التعبير اليوناني السعي النشط والمتابعة المثابرة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἔργοις καλοῖς μαρτυρουμένη
  choice: مَشهودًا لها بالأعمال الحسنة
  rationale: يحفظ معنى اسم المفعول المبني للمجهول، أي شهادة الآخرين لها، ويجعل الأعمال الحسنة أساس هذه الشهادة في عربية واضحة.
- source_word: εἰ
  choice: إن كانت قد
  rationale: ينقل تكرار أداة الشرط التي تعرض معايير القبول، مع صياغة عربية طبيعية للأفعال الماضية.
- source_word: ἐτεκνοτρόφησεν
  choice: ربَّت الأولاد
  rationale: يدل الفعل على تنشئة الأولاد ورعايتهم، ولا يحدد أنهم أولادها البيولوجيون.
- source_word: ἐξενοδόχησεν
  choice: أضافت الغرباء
  rationale: ينقل المعنى المحدد للفعل، وهو استقبال الغرباء أو الضيوف وإكرامهم، بدل الاكتفاء بلفظ عام عن الضيافة.
- source_word: ἁγίων πόδας ἔνιψεν
  choice: غسلت أقدام القديسين
  rationale: يحافظ على الفعل الحرفي ذي الدلالة الثقافية وعلى المصطلح البولسي «القديسين».
- source_word: θλιβομένοις ἐπήρκεσεν
  choice: أعانت المتضايقين
  rationale: «المتضايقين» يشمل من يقاسون الشدة والضغط من غير حصر المعنى في الاضطهاد، و«أعانت» تنقل تقديم العون العملي.
- source_word: παντὶ ἔργῳ ἀγαθῷ ἐπηκολούθησεν
  choice: اتبعت كل عمل صالح
  rationale: يحافظ على صورة الاتباع في الفعل اليوناني وعلى العبارة المتكررة «عمل صالح»، من غير توسيع تفسيري إلى التكريس أو التفاني.
theological_decisions:
- issue: مرجع «القديسين» (ἁγίων)
  choice: الإبقاء على «القديسين» في المتن، بمعنى شعب الله المقدس، أي المؤمنين
  alternative: المؤمنين أو الأتقياء
  rationale: يحفظ المصطلح البولسي ودلالته على جماعة المؤمنين بوصفهم مكرسين لله، وتوضح الحاشية المقصود دون استبدال اللفظ بتفسيره.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُعملت أفعال موجزة متوازية تلائم بنية قائمة الشروط، مع الحفاظ على التمييز بين «الأعمال الحسنة» في صدر العبارة و«كل عمل صالح» في ختامها، وعلى الغموض المشروع بشأن صلة المرأة بالأولاد الذين ربّتهم.
