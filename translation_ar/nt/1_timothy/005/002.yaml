  text: older women as mothers[a], younger women as sisters, in all purity.
translation:
  language: ar
  text: والنساء الأكبر سنًّا كأمهات، والأصغر سنًّا كأخوات، بكل طهارة[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «بكل عفة». يمكن أن تحمل الكلمة هنا دلالة قوية على الطهارة الجنسية وحسن السلوك في هذا الجانب.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρεσβυτέρας
  choice: النساء الأكبر سنًّا
  rationale: صفة مؤنثة مجموعة مستعملة استعمال الاسم، ويبيّن تقابلها مع νεωτέρας أن المقصود السن لا منصب الشيوخ في الكنيسة.
- source_word: ὡς
  choice: كـ
  rationale: 'تفيد التشبيه، والصياغة العربية الموجزة تحافظ على التوازي: كأمهات... كأخوات.'
- source_word: μητέρας
  choice: أمهات
  rationale: تحافظ على صورة العلاقة العائلية من غير إضافة ضمير ملكية غير مذكور في اليونانية.
- source_word: νεωτέρας
  choice: الأصغر سنًّا
  rationale: صفة مؤنثة مجموعة مستعملة استعمال الاسم، وتقابل النساء الأكبر سنًّا. وهذه الصياغة واضحة ولا تحصر المرجع في فئة عمرية ضيقة.
- source_word: ἀδελφὰς
  choice: أخوات
  rationale: تنقل صورة العلاقة العائلية الطبيعية من غير إضافة «أخواتك»، إذ لا يرد ضمير ملكية في الأصل.
- source_word: ἐν πάσῃ ἁγνείᾳ
  choice: بكل طهارة
  rationale: تنقل العبارة معنى السلوك المتسم بالطهارة الكاملة، مع إبقاء المجال الدلالي واسعًا ليشمل الطهارة الأخلاقية وما يتضمنه السياق بقوة من العفة وحسن السلوك الجنسي.
theological_decisions:
- issue: نطاق معنى ἁγνεία في توجيه معاملة النساء الأصغر سنًّا
  choice: بكل طهارة
  alternative: بكل عفة
  rationale: «الطهارة» تحافظ على سعة اللفظ اليوناني ولا تقصره على العفة الجنسية وحدها، مع أن هذا المعنى حاضر بقوة في سياق معاملة النساء كأخوات.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة، مع الحفاظ على البنية المتوازية والصورة العائلية في الأصل. وُضع حرف العطف في البداية لأن الآية تتمة مباشرة للتوجيه السابق.
