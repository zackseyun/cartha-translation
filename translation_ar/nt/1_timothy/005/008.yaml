  source_fidelity: 'يحافظ المشروع على البنية الأساسية للنص: دائرة أوسع («τῶν ἰδίων») ثم أهل البيت بوجه أخص، وعلى دلالة التنكّر للإيمان والمقارنة بـ«غير المؤمن». لكن «خاصته» في الاستعمال العربي الحديث قد توحي بالحاشية أو بالمقرّبين، ولا تعبّر بوضوح كافٍ عن الأشخاص الذين تقع عليهم مسؤولية الرعاية. كما أن «يعتني» أعمّ من الدلالة العملية لـπρονοεῖ في هذا السياق.'
