reference: 1 Timothy 5:8
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: εἰ δέ τις τῶν ἰδίων καὶ ⸀μάλιστα οἰκείων οὐ ⸀προνοεῖ, τὴν πίστιν ἤρνηται καὶ ἔστιν ἀπίστου χείρων.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/008.yaml
  text: But if anyone does not provide for his own[a], and especially for members of his household[b], he has denied the faith and is worse than an unbeliever.
translation:
  language: ar
  text: ولكن إن كان أحدٌ لا يرعى شؤون من يخصّونه[a]، ولا سيما أهل بيته، فقد أنكر الإيمان[b]، وهو أسوأ من غير المؤمن.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: الأشخاص الذين يخصّونه وتلزمه رعايتهم؛ والعبارة أوسع من أهل البيت وحدهم.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: تبرّأ من الإيمان.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τις
  choice: أحد
  rationale: اسم نكرة ذو دلالة عامة؛ و«أحد» ينقل الشمول من غير حصر الحكم في الذكور.
- source_word: τῶν ἰδίων
  choice: خاصته
  rationale: تعبير أوسع من المقيمين في بيت واحد، ويشمل من يرتبطون بالشخص وتلزمه رعايتهم، ثم يضيّق التعبير التالي الدائرة إلى أهل البيت بوجه خاص.
- source_word: μάλιστα
  choice: ولا سيما
  rationale: يبرز فئة تستحق عناية خاصة داخل الفئة الأوسع، وهو تعبير عربي فصيح وطبيعي.
- source_word: οἰκείων
  choice: أهل بيته
  rationale: يدل على المنتمين إلى البيت أو الأسرة المنزلية، ويحافظ على التمييز بين هذه الفئة و«خاصته» الأوسع.
- source_word: προνοεῖ
  choice: يعتني بـ
  rationale: يدل هنا على التدبير المسبق والرعاية العملية، بما فيها الإعالة؛ و«يعتني» يحفظ اتساع المعنى بدل قصره على النفقة وحدها.
- source_word: τὴν πίστιν
  choice: الإيمان
  rationale: يشير في السياق إلى الإيمان المسيحي الذي يقرّ به الشخص، لا إلى مجرد الثقة ولا إلى الأمانة بوصفها صفة عامة.
- source_word: ἤρνηται
  choice: فقد أنكر
  rationale: ينقل صيغة التام اليونانية بوصفها فعلًا وقع وبقيت نتيجته قائمة، ويحفظ شدة معنى التنكر للإيمان بالسلوك.
- source_word: ἀπίστου
  choice: غير المؤمن
  rationale: يدل في هذه المقابلة على من لا يؤمن، لا على شخص غير جدير بالثقة فحسب.
- source_word: χείρων
  choice: شرّ
  rationale: ينقل المقارنة الأخلاقية القوية بصياغة عربية موجزة وطبيعية.
theological_decisions:
- issue: الدلالة العامة في التركيب المفرد
  choice: «إن كان أحد» مع إحالات عربية لا تحصر الحكم في جنس بعينه
  alternative: «إن كان رجل» أو إعادة الصياغة بصيغة الجمع
  rationale: التركيب اليوناني مفرد وذو قوة عامة. تحافظ الصياغة العربية على المفرد والشمول معًا من غير أن تجعل الحكم خاصًا بالرجال.
- issue: معنى πίστις في τὴν πίστιν ἤρνηται
  choice: «الإيمان» بمعنى الإيمان المسيحي المُقَرّ به
  alternative: «الثقة» أو «الأمانة»
  rationale: أداة التعريف والسياق في الرسائل الرعوية يرجحان الإشارة إلى الإيمان الذي يعلنه الشخص، والذي يناقضه إهمال واجب الرعاية عمليًا.
- issue: نطاق واجب الرعاية
  choice: الإبقاء على التدرج بين «خاصته» و«أهل بيته»
  alternative: دمج العبارتين في «أسرته»
  rationale: النص يذكر دائرة أوسع ثم يشدد على أهل البيت بوصفهم فئة ذات أولوية خاصة؛ ودمج العبارتين يطمس هذا التدرج.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. اختيرت «خاصته» للحفاظ على اتساع العبارة الأولى، و«أهل بيته» لتحديد الفئة الأخص. وُضع كل من علامتي الحاشية [a] و[b] في موضعه في المتن.
