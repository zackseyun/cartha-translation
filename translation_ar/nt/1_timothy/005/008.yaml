  to: ولكن إن كان أحدٌ لا يرعى شؤون من يخصّونه[a]، ولا سيما أهل بيته، فقد أنكر الإيمان[b]، وهو أسوأ من غير المؤمن.
  rationale: تستبدل المراجعة «خاصته» بعبارة عربية أوضح تحافظ على اتساع τῶν ἰδίων، وتستبدل «يعتني» بـ«يرعى شؤون» لإبراز الرعاية العملية والتدبير دون إضافة تفسير مذهبي أو تضييق غير لازم. كما تُحسّن المقارنة إلى «أسوأ من». تبقى علامة الحاشية [b] ملتصقة بـ«الإيمان»، وهو موضعها الصحيح لأن البديل يتعلق بالفعل «أنكر».
