review_pass:
  verdict: revise
  source_fidelity: 'المعنى الأساسي محفوظ: σπαταλῶσα تصف أسلوب حياة منغمسًا في اللذة أو الترف، وτέθνηκεν يدل على حالة «ميتة» قائمة، مع المفارقة المقصودة بينها وبين كونها حية. لكن «وَإِنْ كَانَتْ حَيَّةً» تحمل في الاستعمال العربي مسحة شرطية («حتى لو كانت») أقوى من الصلة الحالية/التنازلية في ζῶσα، فتستحسن صياغة تُظهر أنها حية فعلًا.'
  naturalness: «أَمَّا ... فَهِيَ» تركيب فصيح وطبيعي. والصياغة المنقحة «مَعَ أَنَّهَا حَيَّةٌ» أوضح في نقل المفارقة من غير إيحاء بافتراض مشروط. واستعمال «لِلْمُتْعَةِ» مفردًا عامًا عربي معاصر طبيعي، مع بقاء معنى التوجه إلى اللذة.
  terminology: «مَيْتَةٌ» تحافظ على الاستعارة غير المفسَّرة ولا تفرض توصيفًا عقائديًا مثل «ميتة روحيًا». و«تعيش للمتعة» مناسب لـσπαταλάω، بينما يرد «تعيش في الترف» بديلًا معجميًا قريبًا في الحاشية.
  issues:
  - severity: medium
    issue: القوة الدلالية لعبارة «وَإِنْ كَانَتْ حَيَّةً»
    rationale: يمكن أن تُفهم «وإن كانت» على أنها فرض أو تنازل افتراضي، في حين أن ζῶσα تصف المرأة بوصفها حية بالفعل وتخدم المفارقة مع «ميتة». «مع أنها حية» تنقل هذه العلاقة بوضوح أكبر.
  - severity: low
    issue: اتساع «اللذات» مقارنة بدلالة الفعل
    rationale: الجمع مفهوم، لكن «المتعة» بصيغة الجنس أوجز وأقرب إلى وصف نمط حياة موجَّه إلى اللذة، لا إلى تعداد لذات متعددة.
