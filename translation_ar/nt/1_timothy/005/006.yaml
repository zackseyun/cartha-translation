  text: But she who lives for pleasure is dead even while she lives[a].
translation:
  language: ar
  text: أَمَّا الَّتِي تَعِيشُ لِلْمُتْعَةِ، فَهِيَ مَيْتَةٌ، مَعَ أَنَّهَا حَيَّةٌ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الَّتِي تَعِيشُ فِي التَّرَفِ».'
    reason: بديل معجمي لـσπαταλῶσα يبرز معنى العيش المترف أو المنغمس في اللذة.
lexical_decisions:
- source_word: σπαταλῶσα
  choice: تَعِيشُ لِلَّذَّاتِ
  rationale: يدل اسم الفاعل المضارع على نمط حياة مستمر يتسم بالانغماس في الملذات والترف، لا على مجرد التمتع العابر. وهذه الصياغة عربية طبيعية وتحفظ معنى التوجه الحياتي.
- source_word: ζῶσα
  choice: وَإِنْ كَانَتْ حَيَّةً
  rationale: تؤدي الصياغة معنى الحال ذي القوة الاستدراكية، وتُبرز المفارقة المقصودة مع «ميتة» من غير تكرار حرفي ثقيل.
- source_word: τέθνηκεν
  choice: فَهِيَ مَيْتَةٌ
  rationale: الفعل في صيغة التام يشدد على حالة الموت القائمة الناتجة عن وقوعه؛ لذلك تنقل «ميتة» الحالة الحاضرة وتحفظ الاستعارة دون تفسيرها داخل النص.
- source_word: ἡ ... σπαταλῶσα
  choice: الَّتِي تَعِيشُ لِلَّذَّاتِ
  rationale: أداة التعريف مع اسم الفاعل المؤنث مفيدة للاسمية. يحفظ الموصول التأنيث والإحالة السياقية إلى الأرملة من غير إضافة لفظ «الأرملة» غير الموجود صراحة في هذه الجملة.
- source_word: δὲ
  choice: أَمَّا
  rationale: تُظهر «أما» المقابلة مع الأرملة الحقيقية الموصوفة في الآية السابقة، وهي أنسب في العربية لافتتاح الطرف المقابل من الكلام.
theological_decisions:
- issue: طبيعة الموت المذكور في السياق
  choice: إبقاء «ميتة» استعارة غير مفسَّرة مع مفارقتها لكون المرأة حية
  alternative: التصريح بأنها ميتة روحيًا أو أخلاقيًا أو معدودة كالميتة اجتماعيًا
  rationale: تقابل «ميتة» و«حية» يستبعد الموت الجسدي المباشر، لكنه لا يحدد في العبارة وحدها توصيفًا عقائديًا أدق. لذا يحفظ النص التوتر اللاهوتي ولا يضيّق الاستعارة بإضافة تفسير.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم التشكيل الكامل لتيسير القراءة، مع الحفاظ على الإيجاز والمفارقة البلاغية في الأصل.
