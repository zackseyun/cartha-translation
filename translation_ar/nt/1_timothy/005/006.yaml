  rationale: 'تُبقي المراجعة المقابلة التي يفيدها δέ، والاستمرار الأسلوبي في σπαταλῶσα، وحالة الموت القائمة في τέθνηκεν. وتستبدل العبارة ذات الإيحاء الشرطي بصياغة تنازلية تصف المفارقة الواقعة فعلًا: هي ميتة مع أنها حية، دون تفسير طبيعة هذا الموت.'
