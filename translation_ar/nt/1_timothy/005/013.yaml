source:
  edition: SBLGNT
  text: ἅμα δὲ καὶ ἀργαὶ μανθάνουσιν, περιερχόμεναι τὰς οἰκίας, οὐ μόνον δὲ ἀργαὶ ἀλλὰ καὶ φλύαροι καὶ περίεργοι, λαλοῦσαι τὰ μὴ δέοντα.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/013.yaml
  text: At the same time[a], they also learn to be idle, going around from house to house; and not only idle, but also gossips and busybodies[b], saying what they ought not to say.
translation:
  language: ar
  text: وفي الوقت نفسه، يتعلَّمن الكسل، متنقِّلات من بيت إلى بيت؛ ولا يقتصر الأمر على كونهن كسولات، بل هنَّ أيضًا ثرثارات[a] ومتدخِّلات فيما لا يعنيهن[b]، يتكلَّمن بما لا ينبغي.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «نمّامات». قد تدل الكلمة اليونانية على الكلام الفارغ أو الطائش بوجه أعم، ويُحتمل أن تشمل النميمة في هذا السياق.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «متطفِّلات» أو «مقحمات أنفسهن فيما لا يعنيهن».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅμα δὲ καὶ
  choice: وفي الوقت نفسه ... أيضًا
  rationale: ينقل معنى التزامن والإضافة، ويحافظ على صلة العبارة بالسياق السابق بصياغة عربية طبيعية.
- source_word: ἀργαὶ
  choice: البطالة / عاطلات
  rationale: يدل اللفظ على ترك العمل والانشغال النافع، لا على الكسل بوصفه طبعًا أخلاقيًا فحسب. استُخدم الاسمان المتقاربان للحفاظ قدر الإمكان على تكرار الفكرة في اليونانية مع سلامة العربية.
- source_word: μανθάνουσιν
  choice: يتعلَّمن ... حياة
  rationale: يشير الفعل هنا إلى اكتساب نمط أو عادة، لا إلى تلقّي تعليم رسمي؛ وإضافة «حياة» تجعل التركيب طبيعيًا بالعربية من غير طمس دلالة التعلّم والاكتساب.
- source_word: περιερχόμεναι τὰς οἰκίας
  choice: متنقِّلات من بيت إلى بيت
  rationale: ينقل حركة الانتقال بين البيوت بصياغة عربية واضحة ومألوفة.
- source_word: φλύαροι
  choice: ثرثارات
  rationale: يحمل اللفظ معنى الكلام الفارغ أو الطائش، وقد يشمل النميمة في هذا السياق. «ثرثارات» تحفظ سعته، مع ذكر البديل السياقي في الحاشية.
- source_word: περίεργοι
  choice: متدخِّلات في شؤون غيرهن
  rationale: المقصود التدخل غير اللائق فيما لا يعنيهن؛ وهذه العبارة أوضح للقارئ العربي المعاصر من استعمال «فضوليات» المحتمل التباسه بحب الاستطلاع.
- source_word: λαλοῦσαι
  choice: يتكلَّمن
  rationale: فعل كلام بسيط يلائم الجملة التابعة ولا يضيف معنى غير موجود في الأصل.
- source_word: τὰ μὴ δέοντα
  choice: بما لا ينبغي
  rationale: يحفظ معنى ما لا يليق أو لا يصح قوله، ويترك فعل الكلام السابق يحدد مجال عدم اللياقة.
theological_decisions:
- issue: مرجع صيغ جمع المؤنث
  choice: يتعلَّمن ... متنقِّلات ... عاطلات ... ثرثارات ... متدخِّلات
  alternative: هؤلاء النساء
  rationale: الصيغ اليونانية مؤنثة الجمع، وتشير في السياق إلى الأرامل الأصغر سنًا. تحافظ العربية على التأنيث بوضوح من غير تكرار المرجع الذي يبيّنه السياق.
- issue: مدى معنى φλύαροι
  choice: ثرثارات
  alternative: نمّامات
  rationale: اللفظ قد يدل على الكلام الفارغ أو الطائش عمومًا، وإن كان السياق قد يشمل النميمة. اختير اللفظ الأوسع لتجنب حصر المعنى، وأثبت البديل في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. روعي تأنيث جميع الأوصاف والأفعال بحسب المرجع اليوناني، واستُعيض عن «فضوليات» بعبارة أوضح تمنع فهمها بمعنى مجرد حب المعرفة.
