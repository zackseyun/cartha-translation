revisions:
- from: وفي الوقت نفسه، يتعلَّمن أيضًا حياة البطالة، متنقِّلات من بيت إلى بيت. ولا يصرن عاطلات فحسب، بل ثرثارات[a] أيضًا، ومتدخِّلات في شؤون غيرهن[b]، يتكلَّمن بما لا ينبغي.
  to: وفي الوقت نفسه، يتعلَّمن الكسل، متنقِّلات من بيت إلى بيت؛ ولا يقتصر الأمر على كونهن كسولات، بل هنَّ أيضًا ثرثارات[a] ومتدخِّلات فيما لا يعنيهن[b]، يتكلَّمن بما لا ينبغي.
  rationale: تستبدل المراجعة التعبير الملتبس بالبطالة الوظيفية بتعبير عربي معاصر يطابق دلالة الخمول المكتسب، وتحافظ على تكرار الوصف في الأصل. كما تحذف دلالة التحول غير الموجودة في النص، وتستعمل تعبيرًا أوسع وأقرب لمعنى التدخل غير اللائق. وتبقى الحواشي مثبتة في مواضعها وتعرض البدائل المعجمية دون فرض تفسير أضيق.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:25:53Z'
review_pass:
  verdict: revise
  source_fidelity: المعنى العام محفوظ، وصيغ التأنيث والجمع توافق اليونانية وتشير إلى الأرامل الأصغر سنًا في السياق. لكن «حياة البطالة» قد تُفهم في العربية المعاصرة بمعنى عدم التوظف، وتُضعف دلالة ἀργαὶ على الكسل/الخمول. كما أن «يصرن» تضيف تحولًا مستقبليًا لا يقتضيه الوصف اليوناني الحالي.
  naturalness: الصياغة مفهومة وفصيحة عمومًا، لكن «يتعلمن أيضًا حياة البطالة» أقل سلاسة وأشد التباسًا من «يتعلمن الكسل». والصياغة المنقحة تحافظ على التكرار المقصود بعبارتي «الكسل» و«كسولات».
  terminology: «ثرثارات» اختيار سليم لـ φλύαροι لأنه لا يحصر المعنى في النميمة، والحاشية تعرض «نمّامات» بديلًا سياقيًا مناسبًا. والأدق والأوجز لـ περίεργοι هو «متدخِّلات فيما لا يعنيهن»، إذ ينقل التدخل في غير الشأن الخاص من غير تقييده بشؤون الآخرين فقط.
  issues:
