  - severity: low
    issue: إضافة دلالة التحول في «ولا يصرن عاطلات»
    rationale: الفعل «يصرن» يوحي بأنهن ينتقلن إلى حالة جديدة، بينما النص يصفهن بأنهن لسن كسولات فقط بل ثرثارات ومتدخلات أيضًا.
  - severity: low
