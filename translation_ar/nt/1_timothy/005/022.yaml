base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/022.yaml
  text: Do not lay hands on anyone hastily[a], nor share in the sins of others; keep yourself pure.
translation:
  language: ar
  text: لا تضع يديك على أحد بتسرّع[a]، ولا تشترك في خطايا الآخرين؛ واحفظ نفسك طاهرًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، على نحو أخص بحسب السياق: «لا تعيّن أحدًا، أو تقيمه للخدمة، بتسرّع». يقول اليوناني حرفيًا: «لا تضع يديك على أحد»، وهو تعبير يرتبط غالبًا بتكليف شخص بالخدمة أو الاعتراف به فيها.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χεῖρας ... ἐπιτίθει
  choice: تضع يديك على
  rationale: يحافظ على صورة التعبير اليوناني «وضع اليدين» من غير حصره في معنى التعيين أو الرسامة، مع بيان دلالته السياقية المحتملة في الحاشية.
- source_word: ταχέως
  choice: بتسرّع
  rationale: يفيد هنا العجلة غير المتأنية، لا مجرد السرعة الزمنية؛ و«بتسرّع» تنقل التحذير من الإقدام قبل التحقق.
- source_word: μηδενὶ
  choice: على أحد
  rationale: مع النهي، هذه صياغة عربية طبيعية تحافظ على شمول النهي لكل شخص.
- source_word: μηδὲ κοινώνει
  choice: ولا تشترك في
  rationale: ينقل معنى المشاركة أو التورط في الأمر، من غير تضييقه إلى مفهوم الشركة الدينية الاصطلاحي.
- source_word: ἁμαρτίαις ἀλλοτρίαις
  choice: خطايا الآخرين
  rationale: صياغة واضحة وطبيعية تدل على الخطايا التي يرتكبها غير المخاطَب، مع إبقاء كيفية الاشتراك فيها غير محددة.
- source_word: σεαυτὸν
  choice: نفسك
  rationale: المفعول الانعكاسي المباشر للفعل، وصياغته العربية مألوفة.
- source_word: ἁγνὸν
  choice: طاهرًا
  rationale: يدل على الطهارة الأخلاقية بمعناها الواسع؛ ولا يحصرها في العفة الجنسية وحدها.
- source_word: τήρει
  choice: احفظ
  rationale: يعبر عن الاستمرار في صيانة الحالة والمحافظة عليها، وهو مناسب لصيغة الأمر الحاضر في اليونانية.
theological_decisions:
- issue: معنى وضع اليدين في السياق
  choice: الإبقاء على التعبير «تضع يديك على» دون التصريح بالرسامة أو التعيين.
  alternative: لا تعيّن أحدًا بتسرّع؛ أو لا ترسم أحدًا بسرعة.
  rationale: يرجح السياق المتعلق بالشيوخ والمسؤولية أن المقصود اعتماد شخص للخدمة أو تعيينه بوضع اليدين، لكن النص اليوناني نفسه يستعمل التعبير الأوسع. لذلك تُحفظ عبارته في المتن ويُذكر الاحتمال الأخص في الحاشية، تجنبًا لفرض إجراء كنسي محدد.
- issue: العلاقة بين النهيين
  choice: إبقاء النهي الثاني عامًا بوصفه تحذيرًا من التورط في خطايا الآخرين، مع احتمال اتصاله بالتأييد المتسرع.
  alternative: اعتباره تحذيرًا عامًا مستقلًا؛ أو حصره في الاشتراك في الذنب بسبب الرسامة المتسرعة.
  rationale: تجاور العبارتين يوحي بأن وضع اليدين بتسرع قد يجعل المخاطَب شريكًا في خطايا غيره، لكن اليونانية لا تصرح بطبيعة الرابط. لذا لا تُحسم العلاقة التفسيرية في المتن.
translation_notes:
  register: عربية فصحى حديثة، واضحة ورصينة. حُفظ التعبير التصويري «وضع اليدين» في المتن، واستُعمل «بتسرّع» لإظهار أن التحذير من العجلة غير المتأنية. أما «طاهرًا» فتبقي معنى الطهارة الأخلاقية واسعًا.
