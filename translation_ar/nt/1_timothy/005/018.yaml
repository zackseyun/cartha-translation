base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/018.yaml
  text: For the Scripture says[a], “You shall not muzzle an ox while it is threshing,” and[b], “The laborer is worthy of his wages.”
translation:
  language: ar
  text: 'لِأَنَّ الْكِتَابَ يَقُولُ: «لَا تَكُمَّ ثَوْرًا وَهُوَ يَدْرُسُ الْحَبَّ»[a]، وَ«الْعَامِلُ يَسْتَحِقُّ أُجْرَتَهُ»[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: وهو يدوس السنابل لفصل الحَبّ عنها.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «العامل جدير بأجره».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει γὰρ ἡ γραφή
  choice: لِأَنَّ الْكِتَابَ يَقُولُ
  rationale: تُظهر «لأنَّ» الصلة التفسيرية بما سبق، و«الكتاب» تعبير عربي راسخ عن الكتاب المقدس ذي السلطان، والمضارع «يقول» يصوّر شهادته الدائمة.
- source_word: Βοῦν
  choice: ثَوْرًا
  rationale: تشير الكلمة هنا إلى حيوان من البقر يُستخدم في العمل الزراعي؛ و«ثورًا» هي المقابلة العربية الطبيعية في هذا الاقتباس.
- source_word: ἀλοῶντα
  choice: وَهُوَ يَدْرُسُ الْحَبَّ
  rationale: يعبّر التركيب عن الثور المنهمك في فصل الحب عن سنبله بالدوس؛ وقد ذُكر «الحب» لتوضيح العمل الزراعي للقارئ المعاصر.
- source_word: οὐ φιμώσεις
  choice: لَا تَكُمَّ
  rationale: ينقل النهي بصيغة موجزة ذات نبرة تشريعية، و«تكمّ» تعني وضع الكِمام على فم الحيوان ومنعه من الأكل.
- source_word: καί
  choice: وَيَقُولُ أَيْضًا
  rationale: يوضح ربط القول الثاني بالأول تحت فعل القول الواحد؛ وتكرار «يقول» طبيعي في العربية ويمنع التباس العطف.
- source_word: Ἄξιος ὁ ἐργάτης
  choice: الْعَامِلُ مُسْتَحِقٌّ
  rationale: «العامل» لفظ عربي واضح وعام يقابل ἐργάτης، و«مستحق» يحفظ معنى الجدارة والاستحقاق.
- source_word: τοῦ μισθοῦ αὐτοῦ
  choice: أُجْرَتَهُ
  rationale: «الأجرة» تعني المقابل المستحق للعمل، والضمير المفرد المذكر يحفظ صيغة الأصل اليوناني.
theological_decisions:
- issue: نطاق «الكتاب» بالنسبة إلى القولين المقتبسين
  choice: إبقاء القولين معًا تحت صيغة «الكتاب يقول» من غير تحديد إضافي لطبيعتهما القانونية
  alternative: قصر وصف «الكتاب» على الاقتباس الأول، واعتبار الثاني مثلًا أو قولًا للرب منفصلًا عنه
  rationale: صياغة الآية تعرض القولين بعد مقدمة واحدة وتربطهما بالواو. لذلك تحافظ الترجمة على هذا البناء من غير فرض نظرية قانونية لا يصرّح بها النص.
- issue: جنس وعدد الضمير في αὐτοῦ
  choice: أُجْرَتَهُ
  alternative: أُجْرَتَهُمْ
  rationale: الأصل مفرد مذكر، فحُفظت صيغته، مع أن المبدأ المذكور عام في دلالته.
translation_notes:
  register: عربية فصحى حديثة واضحة، بنبرة كتابية كريمة. استُعمل «تكمّ» لدقة الصورة، و«يدرس الحب» لتجنب التباس «الدرس» بمعنى التعلّم، مع شرح الممارسة الزراعية في الحاشية.
