  source_fidelity: 'النص العربي ينقل البنية والمعنى اليونانيين بأمانة: «يريدون أن يكونوا» تقابل θέλοντες εἶναι، و«معلّمي الشريعة» تقابل νομοδιδάσκαλοι من غير تخصيص غير وارد في المتن. كما أن «مع أنهم لا يفهمون» تؤدي الوظيفة التنازلية الملائمة لاسم الفاعل المنفي μὴ νοοῦντες، و«لا ... ولا» تحفظ اقتران μήτε ... μήτε. وعبارة «الأمور التي يؤكّدونها بثقة» تنقل مضمون περὶ τίνων διαβεβαιοῦνται نقلاً واضحًا، وإن كانت أقل محاكاةً للبنية الحرفية.'
