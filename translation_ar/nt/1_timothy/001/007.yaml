source:
  edition: SBLGNT
  text: θέλοντες εἶναι νομοδιδάσκαλοι, μὴ νοοῦντες μήτε ἃ λέγουσιν μήτε περὶ τίνων διαβεβαιοῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/007.yaml
  text: wanting to be teachers of the law[b][a], though they understand neither what they are saying nor the things about which they speak so confidently.
translation:
  language: ar
  text: يريدون أن يكونوا معلّمي الشريعة[a]، مع أنهم لا يفهمون لا ما يقولونه ولا الأمور التي يؤكّدونها بثقة.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يُرجَّح أن «معلّمي الشريعة» هم الذين يدّعون سلطة تعليم الشريعة اليهودية، أي التوراة.
    reason: cultural_note
  - marker: b
    text: 'أو: «لا يفهمون ما يقولون ولا ما يؤكّدونه بثقة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλοντες
  choice: يريدون
  rationale: ينقل معنى اسم الفاعل المضارع الدال على إرادة مستمرة، ويرتبط بأصحاب القول المذكورين في السياق السابق.
- source_word: εἶναι
  choice: أن يكونوا
  rationale: صياغة عربية طبيعية للمصدر المكمّل للفعل θέλοντες.
- source_word: νομοδιδάσκαλοι
  choice: معلّمي الشريعة
  rationale: ينقل الاسم المركب بمعنى من يعلّمون الناموس أو الشريعة، مع إبقاء الإشارة في المتن عامة وعدم إضافة «الموسوية» التي لا يصرّح بها اللفظ اليوناني.
- source_word: μὴ νοοῦντες
  choice: مع أنهم لا يفهمون
  rationale: 'يُظهر العلاقة التنازلية في السياق: يريدون التعليم مع افتقارهم إلى الفهم.'
- source_word: μήτε ... μήτε
  choice: لا ... ولا
  rationale: المقابلة العربية الطبيعية للنفي المزدوج المترابط في اليونانية.
- source_word: ἃ λέγουσιν
  choice: ما يقولونه
  rationale: ينقل مضمون كلامهم بوضوح، من غير تحميل زمن المضارع دلالة إضافية غير لازمة في العربية.
- source_word: περὶ τίνων
  choice: الأمور التي
  rationale: تعبير عربي سلس يحفظ الإشارة إلى الموضوعات التي تتناولها تأكيداتهم.
- source_word: διαβεβαιοῦνται
  choice: يؤكّدونها بثقة
  rationale: ينقل معنى التشديد في التقرير أو الجزم الواثق، وهو محور المفارقة مع عدم فهمهم.
theological_decisions:
- issue: مرجع «الشريعة» في νομοδιδάσκαλοι
  choice: 'إبقاء اللفظ عامًا في المتن: «الشريعة»'
  alternative: «شريعة موسى» أو «التوراة»
  rationale: يرجّح السياق أن المقصود هو الشريعة اليهودية، لكن اللفظ اليوناني نفسه لا يذكر موسى ولا التوراة صراحة؛ لذلك يُحفظ عموم التعبير في المتن وتُشرح دلالته المرجحة في الحاشية.
- issue: العلاقة بين الرغبة في التعليم وعدم الفهم
  choice: 'صياغتها تنازليًا: «مع أنهم لا يفهمون»'
  alternative: «وهم لا يفهمون»
  rationale: السياق يبرز التوتر بين طموحهم إلى مكانة المعلّم وجهلهم بمضمون كلامهم، من غير إضافة حكم عقائدي يتجاوز النص.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعملت «الشريعة» لأنها طبيعية للقارئ العربي وتحفظ عموم νόμος، ووُضعت علامتا الحاشية [a] و[b] في المتن كما يلزم.
