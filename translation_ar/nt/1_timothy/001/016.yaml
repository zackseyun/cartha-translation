- from: 'لكنني لهذا نلت الرحمة، لكي يُظهر المسيح يسوع فيَّ، أنا أولهم[a]، كلَّ طول أناته[b]، ليكون ذلك نموذجًا للذين سيؤمنون به[c] لنوال الحياة الأبدية.


    [a] أو: «أنا أولًا». وقد تفيد الكلمة اليونانية الأولوية أو الصدارة؛ ويشير السياق إلى كونه أول الخطاة، أي في مقدمتهم.

    [b] أو: «كلَّ صبره» أو «كلَّ حلمه».

    [c] أو: «الذين كان مزمعًا أن يؤمنوا به».'
  to: 'لكنني لهذا نلتُ الرحمة، لكي يُظهر المسيح يسوع فيَّ أنا، الأوّل، كلَّ طول أناته، وليجعل مني مثالًا للذين سيؤمنون به لنوال الحياة الأبدية.


    [a] أو: «أنا المتقدّم». ويشير السياق السابق إلى كونه في مقدمة الخطاة.


    [b] أو: «كلَّ صبره» أو «كلَّ حلمه».


    [c] أو: «الذين كان مزمعًا أن يؤمنوا به».'
  rationale: تُبقي المراجعة الغموض النسبي في «الأوّل» دون تحويله إلى «الأسوأ»، وتوضح وظيفة «مثالًا» بوصفها غرضًا من إظهار المسيح طول أناته في بولس. كما تُصحح الحاشية كيلا تعامل الصفة اليونانية كأنها ظرف مستقل.
