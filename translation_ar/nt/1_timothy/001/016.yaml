source:
  edition: SBLGNT
  text: ἀλλὰ διὰ τοῦτο ἠλεήθην, ἵνα ἐν ἐμοὶ πρώτῳ ἐνδείξηται ⸂Χριστὸς Ἰησοῦς⸃ τὴν ⸀ἅπασαν μακροθυμίαν, πρὸς ὑποτύπωσιν τῶν μελλόντων πιστεύειν ἐπ’ αὐτῷ εἰς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/016.yaml
  text: But for this reason I received mercy[a], so that in me, as the foremost[d][c][b], Messiah Jesus might display all his patience as a pattern for those who were going to believe in him for eternal life.
translation:
  language: ar
  text: 'لكنني لهذا نلتُ الرحمة، لكي يُظهر المسيح يسوع فيَّ أنا، الأوّل، كلَّ طول أناته، وليجعل مني مثالًا للذين سيؤمنون به لنوال الحياة الأبدية.


    [a] أو: «أنا المتقدّم». ويشير السياق السابق إلى كونه في مقدمة الخطاة.


    [b] أو: «كلَّ صبره» أو «كلَّ حلمه».


    [c] أو: «الذين كان مزمعًا أن يؤمنوا به».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أنا المتقدّم». ويشير السياق السابق إلى كونه في مقدمة الخطاة.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «كلَّ صبره» أو «كلَّ حلمه».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «الذين كان مزمعًا أن يؤمنوا به».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠλεήθην
  choice: نلت الرحمة
  rationale: صياغة عربية طبيعية تحافظ على المبني للمجهول من حيث عدم تسمية فاعل الرحمة صراحةً.
- source_word: πρώτῳ
  choice: أنا أولهم
  rationale: يربط اللفظ بسياق العدد السابق، حيث يصف بولس نفسه بأنه أول الخطاة، مع إبقاء احتمال معنى «أولًا» في الحاشية.
- source_word: ἐνδείξηται
  choice: يُظهر
  rationale: ينقل معنى الإظهار والبيان، ويلائم صيغة الغرض بعد ἵνα.
- source_word: Χριστὸς Ἰησοῦς
  choice: المسيح يسوع
  rationale: «المسيح» هو المقابل العربي الراسخ للقب Χριστός ويحفظ دلالته المسيانية.
- source_word: ἅπασαν μακροθυμίαν
  choice: كلَّ طول أناته
  rationale: «طول الأناة» ينقل الصبر الممتد وضبط النفس، و«كل» تحفظ توكيد الشمول في ἅπασαν.
- source_word: ὑποτύπωσιν
  choice: نموذجًا
  rationale: يدل على مثال أو نمط معروض ليستدل به اللاحقون.
- source_word: τῶν μελλόντων πιστεύειν
  choice: الذين سيؤمنون
  rationale: صياغة عربية سلسة تحفظ الاستقبال النسبي لتجربة بولس؛ والصياغة الأقرب حرفيًا مذكورة في الحاشية.
- source_word: πιστεύειν ἐπ’ αὐτῷ
  choice: سيؤمنون به
  rationale: المقابل العربي الطبيعي للتركيب الذي يدل على وضع الإيمان في شخصه.
- source_word: εἰς ζωὴν αἰώνιον
  choice: لنوال الحياة الأبدية
  rationale: يُظهر اتجاه الإيمان وغايته أو نتيجته من غير حسم زائد بين الغاية والنتيجة.
theological_decisions:
- issue: مرجع الرحمة وطول الأناة
  choice: عدم تسمية فاعل الرحمة في العبارة الأولى، مع إسناد إظهار طول الأناة إلى المسيح يسوع كما في النص
  alternative: التصريح بأن الله الآب هو الذي رحم بولس، أو دمج الرحمة وطول الأناة في فعل واحد منسوب صراحةً إلى المسيح
  rationale: الفعل ἠλεήθην مبني للمجهول ولا يذكر الفاعل، بينما جملة الغرض تسمي المسيح يسوع فاعلًا للإظهار؛ لذلك تحافظ الصياغة على هذا التوتر النصي.
- issue: دلالة πρώτῳ
  choice: أنا أولهم، مع حاشية «أنا أولًا»
  alternative: أنا أسوأهم
  rationale: «أسوأهم» تفسير سياقي ممكن لكنه يزيد حكمًا تقويميًا غير مصرح به في اللفظ نفسه؛ أما «أولهم» فيحفظ الصدارة مع صلته بالعدد السابق.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُعمل «طول الأناة» لكونه تعبيرًا كتابيًا مفهومًا، مع بدائل أبسط في الحاشية. حُفظ ترتيب الجملة قدر الإمكان من غير التضحية بسلاسة العربية.
