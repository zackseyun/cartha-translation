source:
  edition: SBLGNT
  text: πιστὸς ὁ λόγος καὶ πάσης ἀποδοχῆς ἄξιος, ὅτι Χριστὸς Ἰησοῦς ἦλθεν εἰς τὸν κόσμον ἁμαρτωλοὺς σῶσαι· ὧν πρῶτός εἰμι ἐγώ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/015.yaml
  text: 'The saying is trustworthy and worthy of full acceptance: that Messiah Jesus came into the world to save sinners[b][a], of whom I am the foremost.'
translation:
  language: ar
  text: 'هذا القول جدير بالثقة ومستحقّ للقبول التام: إن المسيح يسوع[a] جاء إلى العالم ليخلّص الخطاة، وأنا أولهم[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: الممسوح يسوع؛ و«المسيح» لقب لا اسم عائلة.'
    reason: توضيح الدلالة اللقبية للمصطلح اليوناني Χριστός.
  - marker: b
    text: 'أو: وأنا أبرزهم، أو رئيسهم؛ وقد يفهمها بعضهم بمعنى: أسوأهم.'
    reason: بيان المدى الدلالي لكلمة πρῶτος من غير حسم الغموض في المتن.
lexical_decisions:
- source_word: πιστὸς ὁ λόγος
  choice: هذا القول جدير بالثقة
  rationale: الصيغة في الرسائل الرعوية تقدّم قولًا موثوقًا؛ و«هذا القول» عربية طبيعية واضحة، و«جدير بالثقة» تنقل معنى πιστός.
- source_word: πάσης ἀποδοχῆς ἄξιος
  choice: مستحقّ للقبول التام
  rationale: تنقل ἄξιος معنى الاستحقاق، بينما يعبّر «القبول التام» بصورة عربية سليمة عن القوة التكثيفية لـ πάσης مع ἀποδοχῆς.
- source_word: ὅτι
  choice: إن
  rationale: تقدّم «إن» مضمون القول الموثوق به، بدل تفسير الأداة على أنها سببية.
- source_word: Χριστὸς Ἰησοῦς
  choice: المسيح يسوع
  rationale: تحافظ «المسيح» على الدلالة اللقبية لـ Χριστός، مع إبقاء ترتيب الأصل.
- source_word: ἦλθεν εἰς τὸν κόσμον
  choice: جاء إلى العالم
  rationale: ترجمة مباشرة وطبيعية تحفظ صورة المجيء إلى العالم وما تحمله من دلالة دون توسيع تفسيري.
- source_word: ἁμαρτωλοὺς σῶσαι
  choice: ليخلّص الخطاة
  rationale: تنقل صيغة الغرض في المصدر σῶσαι، وتستعمل المقابل العربي المألوف والدقيق للخلاص والخطاة.
- source_word: ὧν πρῶτός εἰμι ἐγώ
  choice: وأنا أولهم
  rationale: تحافظ على استعارة الترتيب في πρῶτος وعلى توكيد الضمير ἐγώ، ولا تحسمها تفسيريًا بمعنى «أسوأهم».
theological_decisions:
- issue: ترجمة Χριστός
  choice: المسيح يسوع
  alternative: يسوع المسيح
  rationale: «المسيح» هو المقابل العربي الراسخ للقب Χριστός، والحفاظ على ترتيب «المسيح يسوع» يصون ترتيب النص اليوناني؛ أما «يسوع المسيح» فأشيع عربيًا لكنه يعكس ترتيبًا مختلفًا.
- issue: دلالة πρῶτος بين الخطاة
  choice: وأنا أولهم
  alternative: وأنا أسوأهم / رئيسهم
  rationale: «أولهم» يصون الغموض الحقيقي بين الأول في المرتبة والأبرز، ولا يحوّل العبارة إلى حكم نوعي صريح مثل «أسوأهم».
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. اختيرت صياغة قريبة من بنية الأصل مع سلاسة طبيعية، وحُفظ الغموض الدلالي في πρῶτος داخل المتن وشرح في الحاشية.
