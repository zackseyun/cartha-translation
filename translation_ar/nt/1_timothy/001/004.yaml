  text: μηδὲ προσέχειν μύθοις καὶ γενεαλογίαις ἀπεράντοις, αἵτινες ⸀ἐκζητήσεις παρέχουσι μᾶλλον ἢ οἰκονομίαν θεοῦ τὴν ἐν πίστει—
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/004.yaml
  text: nor to pay attention to myths and endless genealogies[c][b][a], which promote speculations rather than the stewardship from God that is by faith—
translation:
  language: ar
  text: وألّا يصغوا إلى الخرافات وسلاسل الأنساب التي لا نهاية لها، وهي أمور تثير تكهّنات[a] بدلًا من تدبير الله الذي بالإيمان[b][c]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «تثير نزاعات»، أو «تفضي إلى تحقيقات وتساؤلات». تدل الكلمة اليونانية على استقصاءات أو مجادلات، وهنا تحمل معنى سلبيًا يشير إلى بحث غير مثمر.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «إدارة الله»، أو «خطة الله»، أو «التدبير الآتي من الله». يمكن أن تدل الكلمة اليونانية على التدبير أو الإدارة أو خطة مرتبة.'
    reason: lexical_alternative
  - marker: c
    text: 'حرفيًا: «الذي في الإيمان». وقد تُفهم «الإيمان» هنا أيضًا بظل دلالي أقرب إلى «الثقة» أو «الأمانة».'
    reason: alternative_reading
lexical_decisions:
- source_word: προσέχειν
  choice: ينشغلوا بـ
  rationale: ينقل معنى توجيه الانتباه والاهتمام المستمر إلى شيء، وهو طبيعي في العربية ضمن سياق النهي، من غير مبالغة إلى معنى التكريس الكامل.
- source_word: μύθοις
  choice: الخرافات
  rationale: مقابل عربي واضح ومعاصر للروايات المختلقة أو الدينية الزائفة، ولا يحمل نبرة قصص الأطفال التي قد توحي بها بعض البدائل.
- source_word: γενεαλογίαις ἀπεράντοις
  choice: سلاسل الأنساب التي لا نهاية لها
  rationale: يحافظ على معنى الأنساب وعلى قوة ἀπεράντοις الدالة على الامتداد غير المنتهي، بصياغة عربية طبيعية.
- source_word: αἵτινες
  choice: وهي أمور
  rationale: يُظهر الطابع التفسيري النوعي للضمير اليوناني، إذ يصف طبيعة الخرافات وسلاسل الأنساب ونتيجتها.
- source_word: ἐκζητήσεις
  choice: تكهّنات
  rationale: يلائم السياق السلبي للاستقصاءات أو التساؤلات غير المثمرة، مع إبقاء بدائل النزاعات والتحقيقات في الحاشية.
- source_word: παρέχουσι
  choice: تثير
  rationale: يعبر طبيعيًا عن كون تلك الأمور تتسبب في نشوء التكهّنات وتغذيها.
- source_word: μᾶλλον ἢ
  choice: بدلًا من
  rationale: ينقل المقابلة بين نتيجتين بوضوح، لا مجرد تفاوت في الدرجة.
- source_word: οἰκονομίαν θεοῦ
  choice: تدبير الله
  rationale: «تدبير» يجمع في العربية بين معاني الإدارة والترتيب والخطة، ويحافظ الإضافة إلى الله على قدر من الانفتاح في علاقة المضاف إليه.
- source_word: τὴν ἐν πίστει
  choice: القائم على الإيمان
  rationale: صياغة عربية طبيعية تصل العبارة بالتدبير وتحفظ دلالة المجال أو الوسيلة المحتملة في ἐν.
- source_word: πίστει
  choice: الإيمان
  rationale: هو المقابل الافتراضي المباشر لـ πίστις هنا، مع إثبات احتمالي الثقة والأمانة في الحاشية.
theological_decisions:
- issue: معنى οἰκονομίαν θεοῦ
  choice: تدبير الله
  alternative: إدارة الله؛ خطة الله؛ التدبير الآتي من الله؛ الوكالة التي من الله
  rationale: يحفظ «التدبير» المجال الدلالي للكلمة من غير حصرها في خطة خلاصية مجردة أو في وكالة كنسية بعينها، فيما تظل علاقة θεοῦ قابلة للفهم على أنها ملكية أو مصدر.
- issue: دلالة πίστει في τὴν ἐν πίστει
  choice: الإيمان
  alternative: الثقة؛ الأمانة
  rationale: السياق لا يفرض العدول عن المعنى المعتاد «الإيمان»، لكن الحاشية تحفظ إمكان ظلال الثقة أو الأمانة دون حسم لاهوتي زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «ينشغلوا» لتجنب ترجمة حرفية ثقيلة لعبارة إعارة الانتباه، و«سلاسل الأنساب» لتوضيح المقصود الطبيعي من الجمع. رُتبت علامات الحواشي بحسب مواضعها الفعلية في النص، وحُفظت الشرطة الختامية لأن الآية تتصل نحويًا بما يليها.
