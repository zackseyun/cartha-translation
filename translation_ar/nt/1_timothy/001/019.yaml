translation:
  language: ar
  text: متمسِّكًا بالإيمان[b] وبضمير صالح[a]، الذي نبذه بعضهم، فتحطَّمت سفينتهم فيما يتعلق بالإيمان.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: الموصول في اليونانية مؤنث مفرد، ويعود على الأرجح إلى «الضمير الصالح»؛ وقد يفهمه بعضهم على أنه يشير بصورة أوسع إلى الإيمان والضمير الصالح معًا.
    reason: alternative_reading
  - marker: b
    text: يمكن أيضًا أن تُفهم الكلمة المترجمة «الإيمان» بمعنى «الثقة»، أو بمعنى «الأمانة» على احتمال أضعف في هذا السياق.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχων
  choice: متمسِّكًا
  rationale: اسم الفاعل في اليونانية يدل على استمرار الفعل، و«متمسِّكًا» ينقل معنى الحفاظ الفعّال على الإيمان والضمير، مع اتصاله بالمخاطَب الضمني في الآية السابقة.
- source_word: πίστιν
  choice: الإيمان
  rationale: المعنى الأرجح هنا هو الإيمان المسيحي، ولا سيما مع أداة التعريف في العبارة الثانية، مع بقاء إمكان معنى «الثقة» في الاستعمال الأوسع للكلمة.
- source_word: ἀγαθὴν συνείδησιν
  choice: ضمير صالح
  rationale: ينقل «صالح» الوصف الأخلاقي المباشر في ἀγαθή، بخلاف «ضمير مستريح» أو «نقي» اللذين قد يضيّقان الدلالة.
- source_word: ἀπωσάμενοι
  choice: نبذه
  rationale: «نبذ» يعبّر بوضوح وإيجاز عن الإبعاد المتعمَّد والرفض الذي يفيده الفعل اليوناني.
- source_word: ἐναυάγησαν
  choice: تحطَّمت بهم السفينة
  rationale: يحافظ هذا التعبير على صورة كارثة السفينة في الأصل، وهو مفهوم في العربية بوصفه استعارة للفشل والهلاك.
- source_word: περὶ τὴν πίστιν
  choice: فيما يخصّ الإيمان
  rationale: تبيّن العبارة المجال الذي وقع فيه تحطم السفينة، من غير أن تجعل الإيمان نفسه هو السفينة على نحو لا يصرّح به الأصل.
theological_decisions:
- issue: مرجع الضمير الموصول ἥν
  choice: يعود «الذي» إلى «ضمير صالح» تحديدًا.
  alternative: قد يُفهم الموصول على أنه يلخّص «الإيمان والضمير الصالح» معًا.
  rationale: الضمير اليوناني مؤنث مفرد، فيوافق συνείδησιν، أي «الضمير»، وهو أقرب اسم إليه. أثبتت الحاشية إمكان الفهم الأوسع من غير إدخاله في المتن.
- issue: دلالة πίστις
  choice: الإيمان
  alternative: الثقة، أو الأمانة على احتمال أضعف هنا
  rationale: السياق، ولا سيما ورود أداة التعريف في περὶ τὴν πίστιν، يرجّح الإيمان المسيحي أو مضمونه، من غير إنكار المجال الدلالي الأوسع للكلمة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة وقورة. استُعمل «تحطمت بهم السفينة» للمحافظة على الاستعارة البحرية، وتُركت الصلة بالآية السابقة ظاهرة في صيغة «متمسِّكًا» من غير إضافة فاعل غير مذكور في الأصل.
