  text: Καθὼς παρεκάλεσά σε προσμεῖναι ἐν Ἐφέσῳ, πορευόμενος εἰς Μακεδονίαν, ἵνα παραγγείλῃς τισὶν μὴ ἑτεροδιδασκαλεῖν
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/003.yaml
  text: Just as I urged you to remain in Ephesus when I was going into Macedonia[a], so that you might instruct certain people not to teach different doctrine,
translation:
  language: ar
  text: كما حثثتُك أن تبقى في أفسس حين كنتُ ذاهبًا إلى مكدونية، لكي تأمر[a] بعض الناس ألّا يعلِّموا تعليمًا مغايرًا،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «توصي».'
    reason: بديل معجمي أقلّ قوة للفعل اليوناني الذي قد يفيد توجيهًا ذا سلطة أو أمرًا.
lexical_decisions:
- source_word: Καθὼς
  choice: كما
  rationale: تحافظ «كما» على قوة الاستئناف والإحالة إلى الطلب السابق، وتبقي ترابط العبارة مع ما يلي من السياق.
- source_word: παρεκάλεσά
  choice: حثثتُك
  rationale: ينقل الفعل معنى الطلب الجاد والحث، من غير تحويله إلى أمر صريح.
- source_word: προσμεῖναι
  choice: أن تبقى
  rationale: تعبير عربي طبيعي ودقيق عن الاستمرار في مكان بعينه.
- source_word: ἐν Ἐφέσῳ
  choice: في أفسس
  rationale: النقل العربي المألوف لاسم المدينة مع حرف الجر المناسب.
- source_word: πορευόμενος εἰς Μακεδονίαν
  choice: حين كنتُ ذاهبًا إلى مكدونية
  rationale: يبيّن الظرف الزمني، ويحافظ على كون بولس هو فاعل الذهاب بحسب الارتباط النحوي الأرجح.
- source_word: ἵνα
  choice: لكي
  rationale: تنقل بوضوح دلالة الغرض.
- source_word: παραγγείλῃς
  choice: توصي
  rationale: تفيد توجيهًا ذا سلطة من غير المبالغة في حدته؛ وأُثبت البديل الأقوى «تأمر» في الحاشية.
- source_word: τισὶν
  choice: بعض الناس
  rationale: تدل على أشخاص محددين لكن غير مسمّين، بصياغة عربية واضحة.
- source_word: ἑτεροδιδασκαλεῖν
  choice: يعلِّموا تعليمًا مغايرًا
  rationale: تحافظ على معنى التعليم المختلف عن المعيار المقصود، من غير إضافة الحكم التفسيري الأقوى «تعليمًا باطلًا».
theological_decisions:
- issue: درجة القوة السلطوية في παραγγείλῃς
  choice: توصي
  alternative: تأمر
  rationale: السياق يدل على تكليف رسولي وتصحيح تعليمي، لذلك لا تعني الكلمة مجرد اقتراح. لكن «توصي» تجمع بين السلطة ووضوح الأسلوب، مع حفظ «تأمر» بديلًا معجميًا ممكنًا.
- issue: تقويم التعليم المشار إليه في ἑτεροδιδασκαλεῖν
  choice: تعليمًا مغايرًا
  alternative: تعليمًا باطلًا
  rationale: المركب اليوناني يبرز المغايرة في التعليم، أما وصفه صراحة بالبطلان فيزيد حكمًا تفسيريًا على الدلالة المعجمية المباشرة؛ لذلك حُفظ التوتر من غير تخفيف معنى الانحراف أو تشديده.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظت صيغة الجملة الممتدة في الأصل، ولذلك تنتهي الآية بفاصلة تمهيدًا لاستمرار الكلام في الآية التالية.
