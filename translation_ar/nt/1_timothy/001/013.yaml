  to: كنتُ من قبلُ مُجدِّفًا ومضطهِدًا ورجلًا عنيفًا[a]، لكن أُظهرت لي رحمةٌ[b]، لأنني فعلتُ ذلك عن جهلٍ[c] وفي عدم إيمانٍ[d].
  rationale: حُذفت «مع أنني» لأنها تضيف معنى تنازليًا لا يصرح به الأصل، واستُبدلت صياغة الرحمة بما يعكس المبني للمجهول اليوناني. ولم يُغيَّر المعنى المقصود ولا مواضع الحواشي أو دلالاتها المعجمية.
