lexical_decisions:
- source_word: τὸ πρότερον ὄντα
  choice: مع أنني كنتُ من قبلُ
  rationale: ينقل الحال السابقة لبولس وقوة اسم الفاعل، ويربط العبارة طبيعيًا بما قبلها في العربية.
- source_word: βλάσφημον
  choice: مجدِّفًا
  rationale: المقابل العربي المباشر للمستعمل استعمال الاسم في وصف الشخص.
- source_word: διώκτην
  choice: مضطهِدًا
  rationale: ينقل معنى من يمارس الاضطهاد، ويلائم سياق عداء بولس السابق للمؤمنين.
- source_word: ὑβριστήν
  choice: رجلًا عنيفًا
  rationale: تعبير واضح يفيد السلوك العدواني المؤذي والمهين، لا مجرد الكبرياء.
- source_word: ἠλεήθην
  choice: نلتُ رحمةً
  rationale: صياغة عربية طبيعية تحافظ على كون بولس متلقيًا للرحمة؛ ويمكن تمثيل المبني للمجهول صراحةً في الحاشية.
- source_word: ὅτι
  choice: لأنني
  rationale: يحفظ الدلالة السببية أو التفسيرية الطبيعية للأداة اليونانية دون القول إن الجهل استحق الرحمة.
- source_word: ἀγνοῶν ἐποίησα
  choice: فعلتُ ذلك عن جهلٍ
  rationale: ينقل الفعل والاسم الفاعل معًا بصياغة عربية سليمة، ويجعل الجهل وصفًا لكيفية الفعل.
- source_word: ἐν ἀπιστίᾳ
  choice: في عدم إيمانٍ
  rationale: يفيد غياب الإيمان في هذا السياق، مع إبقاء احتمال عدم الأمانة في الحاشية.
theological_decisions:
- issue: دلالة ὅτι وعلاقة الجهل بالرحمة
  choice: «لأنني فعلتُ ذلك عن جهلٍ وفي عدم إيمانٍ»
  alternative: اعتبار العبارة مجرد بيان للظرف لا تعليلًا للرحمة
  rationale: تحفظ «لأن» الصياغة السببية أو التفسيرية في اليونانية، من غير أن تضيف أن الجهل أكسب بولس استحقاقًا للرحمة أو تحسم التوتر اللاهوتي.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. روعي تتابع أوصاف بولس، مع استخدام «مع أنني» لاستكمال التركيب المتصل بالآية السابقة، ووُضعت علامات الحواشي في مواضعها داخل النص.
