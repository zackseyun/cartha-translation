  text: كنتُ من قبلُ مُجدِّفًا ومضطهِدًا ورجلًا عنيفًا[a]، لكن أُظهرت لي رحمةٌ[b]، لأنني فعلتُ ذلك عن جهلٍ[c] وفي عدم إيمانٍ[d].
