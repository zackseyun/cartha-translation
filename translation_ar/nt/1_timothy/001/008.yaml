  text: Οἴδαμεν δὲ ὅτι καλὸς ὁ νόμος ἐάν τις αὐτῷ νομίμως χρῆται,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/008.yaml
  text: We know that the law is good[a], if one uses it lawfully,
translation:
  language: ar
  text: ونعلم أن الشريعة صالحة، إذا استعملها أحد استعمالًا مشروعًا[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «إذا استعملها أحد على الوجه الصحيح»، أو «استعمالًا موافقًا للشريعة».
    reason: بدائل معجمية توضّح أن νομίμως قد تدل على الاستعمال الصحيح أو المشروع أو الموافق للشريعة.
lexical_decisions:
- source_word: Οἴδαμεν
  choice: نعلم
  rationale: الفعل οἶδα في هذه الصيغة يفيد معرفة حاضرة راسخة؛ و«نعلم» هي المقابل العربي الطبيعي المباشر.
- source_word: δὲ
  choice: الواو في «ونحن»
  rationale: تفيد δέ انتقالًا خفيفًا في سياق الكلام، لا تعارضًا قويًا؛ فأُديت بواو الاستئناف مع الضمير لإبراز الانتقال بصورة عربية طبيعية.
- source_word: καλὸς
  choice: صالحة
  rationale: تصف الكلمة الشريعة بصفة إيجابية عامة. و«صالحة» تلائم المؤنث «الشريعة» وتحفظ المعنى من غير تضييقه إلى معنى أخلاقي أو نفعي بعينه.
- source_word: ὁ νόμος
  choice: الشريعة
  rationale: «الشريعة» مقابل عربي واضح لـ νόμος في هذا السياق البولسي، مع إبقاء نطاقها غير محدد صراحة في النص.
- source_word: ἐάν τις
  choice: إذا استعملها أحد
  rationale: ينشئ التعبير شرطًا عامًا؛ و«أحد» يحفظ الإفراد والعموم في عربية طبيعية.
- source_word: αὐτῷ ... χρῆται
  choice: استعملها
  rationale: يعود الضمير إلى الشريعة، والفعل χράομαι يعني الاستعمال أو الانتفاع؛ و«استعملها» موجز وواضح.
- source_word: νομίμως
  choice: استعمالًا مشروعًا
  rationale: يفيد الظرف ما يوافق الشريعة أو القاعدة الصحيحة. و«مشروعًا» يحفظ في العربية صلة اشتقاقية ودلالية مسموعة مع «الشريعة»، مع بقاء معنى «على الوجه الصحيح» ممكنًا.
theological_decisions:
- issue: نطاق «الشريعة»
  choice: الإبقاء على «الشريعة» من غير إضافة «الموسوية»
  alternative: الشريعة الموسوية؛ أو القانون عمومًا
  rationale: قد يشير السياق خصوصًا إلى شريعة موسى، لكن اليونانية لا تصرح بهذا التحديد؛ لذلك تُرك النطاق مفتوحًا كما في الأصل.
- issue: دلالة νομίμως وكيفية استعمال الشريعة
  choice: استعمالًا مشروعًا
  alternative: على الوجه الصحيح؛ استعمالًا موافقًا للشريعة
  rationale: لا يحدد النص هنا تفاصيل الاستعمال الصحيح، فلا ينبغي إدخال تصور مذهبي معين. وتحفظ الصياغة معنى المشروعية والتجاوب اللفظي بين νόμος وνομίμως.
translation_notes:
  register: العربية فصحى حديثة واضحة وموقرة. استُخدمت «ونحن نعلم» لانتقال سلس، و«صالحة» بدل «جيدة» لملاءمة الحديث عن الشريعة، مع الحفاظ قدر الإمكان على التلاعب الاشتقاقي بين νόμος وνομίμως بواسطة «الشريعة» و«مشروعًا».
