lexical_decisions:
- source_word: πόρνοις
  choice: لِمُرتكبي الفجور الجنسي
  rationale: ينقل اللفظ بوصفه فئة واسعة من السلوك الجنسي غير الأخلاقي، من غير حصره في الزنا بمعناه الضيق، وهو تعبير واضح في العربية المعاصرة.
- source_word: ἀρσενοκοίταις
  choice: للرجال الذين يضاجعون رجالًا
  rationale: يحافظ على الدلالة الذكورية والسلوكية للفظ اليوناني النادر، ويتجنب إسقاط فئة حديثة تتعلق بالهوية أو الميول على النص.
- source_word: ἀνδραποδισταῖς
  choice: لتجّار الرقيق
  rationale: يدل اللفظ على من يستولون على أشخاص أو يتاجرون بهم بقصد استرقاقهم؛ و«تجّار الرقيق» موجز وواضح ويحفظ الإشارة الصريحة إلى العبودية.
- source_word: ψεύσταις
  choice: للكاذبين
  rationale: مقابل عربي مباشر وطبيعي للاسم الدال على الذين يكذبون.
- source_word: ἐπιόρκοις
  choice: للحالفين زورًا
  rationale: يعبّر بوضوح عن أداء يمين كاذبة، وهو أدق وأيسر فهمًا لعامة القراء من بعض المصطلحات القانونية.
- source_word: καὶ εἴ τι ἕτερον
  choice: ولكل ما عدا ذلك
  rationale: يحفظ القوة التوسيعية للعبارة التي تضم كل أمر آخر مماثل لم يُذكر في القائمة.
- source_word: τῇ ὑγιαινούσῃ διδασκαλίᾳ
  choice: التعليم السليم
  rationale: ينقل الاستعمال المجازي لمعنى الصحة والسلامة بعبارة عربية طبيعية، من غير إثقال النص بمصطلح كنسي تخصصي.
- source_word: ἀντίκειται
  choice: يناقض
  rationale: يؤدي معنى الوقوف في جهة مضادة أو التعارض مع التعليم، ويلائم التركيب العربي الموجز.
theological_decisions:
- issue: ترجمة ἀρσενοκοίταις في سياق لغوي ولاهوتي مختلف عليه
  choice: للرجال الذين يضاجعون رجالًا
  alternative: لممارسي العلاقات الجنسية المثلية من الرجال
  rationale: تُبقي الصياغة المختارة التركيز على الفعل الجنسي بين الذكور، كما يدل تركيب اللفظ اليوناني على الأرجح، من غير تحويله إلى تصنيف حديث للهوية. ولأن اللفظ نادر ودائرة معناه الدقيقة موضع نقاش، تُذكر صياغة بديلة في الحاشية ولا يُدّعى حسم ما لا يحسمه اللفظ نفسه.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. أُبقيت لامات الجر لأن الآية جزء من قائمة نحوية ممتدة من السياق السابق، وخُتمت بفاصلة للدلالة على استمرار الجملة.
