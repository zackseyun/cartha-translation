  text: لِمرتكبي الفجور الجنسي، وللرجال الذين يمارسون الجنس مع رجال،[a] ولتجّار الرقيق، وللكاذبين، وللحالفين زورًا، ولأيّ أمرٍ آخر يناقض التعليم السليم،
  philosophy: optimal-equivalence
  footnotes:
