    text: 'أو: «لممارسي العلاقات الجنسية المثلية من الرجال». اللفظ اليوناني ἀρσενοκοῖται نادر، ودائرة معناه الدقيقة موضع نقاش، لكنه يشير إلى نشاط جنسي بين الذكور.'
