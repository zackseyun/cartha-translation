lexical_decisions:
- source_word: ὧν
  choice: عن هذه الأمور
  rationale: الضمير الموصول في صيغة المضاف إليه يعود إلى ما سبق في الآية 5. وصياغة «عن هذه الأمور» تُظهر مرجعه في العربية بوضوح من غير حصره في عنصر واحد بعينه.
- source_word: τινες
  choice: ومنهم أناس
  rationale: يحافظ على دلالة الإبهام في الضمير، ويأتي طبيعيًا في العربية مع الصلة السياقية بما قبل.
- source_word: ἀστοχήσαντες
  choice: حادوا
  rationale: الفعل يدل على إخطاء الهدف أو الانحراف عنه. و«حادوا عن» ينقل معنى عدم بلوغ المقصود والانصراف عنه بعبارة عربية موجزة.
- source_word: ἐξετράπησαν
  choice: فانحرفوا
  rationale: 'ينقل صورة التحول عن المسار السليم، كما يبيّن تعاقب الفعلين: الحياد عن الأمور السابقة ثم الاتجاه إلى الكلام الفارغ.'
- source_word: εἰς
  choice: إلى
  rationale: تدل على اتجاه التحول ونتيجته، وتلائم الفعل «انحرفوا» في العربية.
- source_word: ματαιολογίαν
  choice: كلام فارغ
  rationale: ينقل معنى الكلام الباطل أو العقيم الذي لا ثمرة له، بلغة واضحة وحديثة من غير تخصيصه بالجدال وحده.
theological_decisions:
- issue: مرجع ὧν
  choice: إشارة عامة إلى الأمور المذكورة قبله في الآية 5
  alternative: حصر الإشارة في القلب الطاهر والضمير الصالح والإيمان الصادق، أو إبقاء تركيب حرفي مثل «التي»
  rationale: الإشارة عائدة نحويًا إلى السياق السابق، لكن النص لا يصرّح هنا بتحديد أضيق؛ لذلك تحفظ «هذه الأمور» الإحالة من غير حسم زائد.
