base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/001.yaml
  text: Paul[a], an apostle of Messiah Jesus by the command of God our Savior and Messiah Jesus our hope[b],
translation:
  language: ar
  text: بولس، رسولُ المسيح يسوع[a]، بأمر الله مخلّصنا والمسيح يسوع رجائنا[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Χριστός لقب معناه «المسيح»، وقد يميل في بعض السياقات إلى أن يُستعمل كجزء من الاسم المركّب؛ وهنا حُفظ معناه اللقبي.
    reason: alternative_reading
  - marker: b
    text: 'ويمكن إبراز تعلّق «بأمر» بالطرف الثاني هكذا: «بأمر الله مخلّصنا، وبأمر المسيح يسوع رجائنا». وفي اليونانية تتعطف العبارتان تحت كلمة واحدة هي «بأمر».'
    reason: syntactic_clarity
lexical_decisions:
- source_word: Παῦλος
  choice: بولس
  rationale: الصيغة العربية المألوفة للاسم العلم اليوناني.
- source_word: ἀπόστολος
  choice: رسول
  rationale: ينقل اللقب والوظيفة في الاستعمال المسيحي المبكر، وهو أدق هنا من «مبعوث» أو «مرسَل».
- source_word: Χριστοῦ Ἰησοῦ
  choice: المسيح يسوع
  rationale: تُرجم Χριστός بوصفه لقبًا إلى «المسيح»، مع إبقاء ترتيب الاسمين كما في النص اليوناني.
- source_word: κατ’ ἐπιταγὴν
  choice: بأمر
  rationale: صياغة عربية موجزة وطبيعية تفيد أن إرسالية بولس قائمة على توجيه ذي سلطان.
- source_word: θεοῦ σωτῆρος ἡμῶν
  choice: الله مخلّصنا
  rationale: تحافظ على الإضافة وعلى إسناد لقب «المخلّص» إلى الله بوضوح.
- source_word: Χριστοῦ Ἰησοῦ τῆς ἐλπίδος ἡμῶν
  choice: المسيح يسوع رجائنا
  rationale: تحافظ على التركيب البدلي الموجز الذي يعرّف المسيح يسوع بأنه رجاؤنا، دون توسيعه إلى جملة تفسيرية.
- source_word: ἐλπίδος
  choice: رجائنا
  rationale: «الرجاء» هو المقابل العربي الطبيعي الذي يجمع معنى التطلع الواثق والانتظار.
theological_decisions:
- issue: ترجمة Χριστός
  choice: المسيح
  alternative: كريستوس
  rationale: اللفظة لقب ذو دلالة مسيانية في هذا السياق، لذلك تُترجم ولا تُنقل صوتيًا.
- issue: علاقة «رجائنا» بالمسيح يسوع
  choice: 'بدل أو وصف تعريفي موجز: «المسيح يسوع رجائنا»'
  alternative: «المسيح يسوع، الذي هو رجاؤنا»
  rationale: يحافظ الاختيار على إيجاز التركيب اليوناني وعلى تعريف المسيح يسوع بأنه الرجاء من غير إضافة جملة تفسيرية.
- issue: تعلّق المركبين المضافين بكلمة ἐπιταγήν
  choice: أمر واحد منسوب إلى الله مخلّصنا والمسيح يسوع رجائنا
  alternative: 'إبراز حرف الجر مع الطرف الثاني: «بأمر الله مخلّصنا، وبأمر المسيح يسوع رجائنا»'
  rationale: العطف اليوناني ينسّق الطرفين تحت عبارة «بأمر»، والصياغة المختارة تحافظ على هذا التركيب من غير إيحاء بوجود أمرين منفصلين.
translation_notes:
  register: العربية فصحى معاصرة، واضحة ووقورة. استُعملت «رسول» و«المسيح» و«الرجاء» وفق الاستعمال الكتابي العربي المألوف، مع الحفاظ على ترتيب «المسيح يسوع» وعلى إيجاز التحية اليونانية.
