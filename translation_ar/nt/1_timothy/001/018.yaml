  yaml_path: translation/nt/1_timothy/001/018.yaml
  text: This charge I entrust to you[a], child Timothy, in accordance with the prophecies previously made about you, so that by them you may wage the good warfare[c][b],
translation:
  language: ar
  text: هذه الوصية أستودعك إياها، يا ولدي تيموثاوس، وفقًا للنبوءات التي سبق أن قيلت في شأنك[a]، لكي تخوض بها[b] حربًا نبيلة[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «عنك»؛ ويحتمل أيضًا: «عليك»، بمعنى نبوءات قيلت لتيموثاوس أو بشأنه.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «من خلالها» أو «فيها»؛ فقد تعبّر اليونانية عن الوسيلة أو عن المجال.'
    reason: lexical_alternative
  - marker: c
    text: 'تُترجم تقليديًا: «الجهاد الحسن». والعبارة اليونانية أقرب حرفيًا إلى خوض حرب أو حملة نبيلة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγγελίαν
  choice: الوصية
  rationale: تدل الكلمة على توجيه ملزم ذي سلطة. و«الوصية» مألوفة وواضحة في العربية الكتابية، وتحفظ جدية التكليف من غير أن تحصره في معنى الأمر العسكري.
- source_word: παρατίθεμαί
  choice: أستودعك إياها
  rationale: يفيد الفعل هنا وضع الأمر في عهدة شخص ومسؤوليته؛ وصيغة «أستودعك إياها» طبيعية وتحفظ معنى الائتمان الشخصي.
- source_word: τέκνον
  choice: يا ولدي
  rationale: اللفظة تعني حرفيًا «طفل/ولد» وتأتي نداءً أبويًا حنونًا. و«يا ولدي» تنقل القرابة الروحية من غير أن تزعم بنوة جسدية.
- source_word: κατὰ
  choice: بمقتضى
  rationale: تعبّر عن موافقة الوصية للنبوءات السابقة وارتباطها بها، من غير الجزم بطبيعة هذا الارتباط بما يتجاوز النص.
- source_word: τὰς προαγούσας
  choice: التي سبق أن قيلت
  rationale: المعنى الحرفي هو «السابقة/المتقدمة»، والمقصود في السياق نبوءات صدرت من قبل؛ فهذه الصياغة تؤدي القوة الزمنية بوضوح.
- source_word: ἐπὶ σὲ
  choice: في شأنك
  rationale: تدل العبارة على توجه النبوءات إلى تيموثاوس أو تعلقها به. و«في شأنك» واضحة، مع إثبات البدائل الممكنة في الحاشية.
- source_word: προφητείας
  choice: النبوءات
  rationale: ترجمة مباشرة للاسم الجمع، وتشير إلى أقوال أو رسائل نبوية من غير إضافة تفسير مؤسسي.
- source_word: στρατεύῃ
  choice: تخوض
  rationale: الفعل ذو صورة عسكرية ويدل على الاشتراك في حرب أو حملة. ويلائم «تخوض» المفعول «الحرب» في العربية الطبيعية.
- source_word: ἐν αὐταῖς
  choice: بها
  rationale: يمكن أن تكون ἐν للوسيلة أو للمجال؛ «بها» تؤدي المعنى الأداتي بإيجاز، مع حفظ احتمال معنى المجال في الحاشية.
- source_word: τὴν καλὴν στρατείαν
  choice: الحرب الحسنة
  rationale: تحفظ العبارة صورة الخدمة أو الحملة العسكرية، ولا تختزلها في عراك منفرد. و«الحسنة» تنقل καλός من غير إضافة توصيف عقائدي.
theological_decisions:
- issue: طبيعة صلة النبوءات السابقة بتكليف تيموثاوس
  choice: تُعرض النبوءات السابقة بوصفها أساسًا أو إطارًا لوصية بولس ودليلًا لتيموثاوس في خوض الحرب الحسنة.
  alternative: اعتبار النبوءات طقس رسامة رسميًا، أو مجرد تشجيع شخصي خاص.
  rationale: يربط النص اليوناني الوصية بالنبوءات ويجعلها وسيلة أو مجالًا لخدمة تيموثاوس، لكنه لا يحدد في هذه الآية وحدها نظرية طقسية أو مؤسسية كاملة.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة وقورة. حُفظت الصورة العسكرية من غير مبالغة، واستُعمل «يا ولدي» للتعبير عن النداء الأبوي الحنون. وُضعت جميع علامات الحواشي في المتن بحسب مواضع الإبهام المعجمي.
