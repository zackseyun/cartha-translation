  text: Τιμοθέῳ γνησίῳ τέκνῳ ἐν πίστει· χάρις, ἔλεος, εἰρήνη ἀπὸ θεοῦ ⸀πατρὸς καὶ Χριστοῦ Ἰησοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/002.yaml
  text: 'To Timothy[a], my true child in the faith: grace, mercy[b], and peace from God the Father and Messiah Jesus our Lord.'
translation:
  language: ar
  text: 'إلى تيموثاوس، ابني الحقيقي في الإيمان[a]: نعمة ورحمة وسلام من الله الآب والمسيح يسوع ربنا.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ابني الحقيقي بالإيمان»؛ وقد تحمل العبارة اليونانية معنى البنوة القائمة في مجال الإيمان المشترك أو الحاصلة بالإيمان.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γνησίῳ
  choice: الحقيقي
  rationale: ينقل معنى الأصالة وصدق رابطة البنوة الروحية، من غير أن يوحي ببنوة جسدية أو شرعية قانونية.
- source_word: τέκνῳ
  choice: ابني
  rationale: اللفظ اليوناني يعني «طفلًا/ولدًا» ويُستعمل هنا مجازًا للبنوة الروحية. واختيار «ابني» طبيعي في العربية ومناسب لأن المخاطَب تيموثاوس، مع أن ضمير المتكلم مفهوم من العلاقة لا مذكور صراحة في اليونانية.
- source_word: ἐν πίστει
  choice: في الإيمان
  rationale: يحفظ احتمال أن يكون الإيمان هو المجال المشترك الذي تقوم فيه هذه البنوة الروحية، دون حصر العبارة في فعل الإيمان الشخصي وحده.
- source_word: χάρις
  choice: نعمة
  rationale: المقابل العربي المألوف والدقيق في تحيات بولس.
- source_word: ἔλεος
  choice: رحمة
  rationale: مقابل مباشر يحفظ العنصر المميز في صيغة التحية هنا.
- source_word: εἰρήνη
  choice: سلام
  rationale: مقابل مباشر وطبيعي يحفظ المعنى اللاهوتي والتحية معًا.
- source_word: θεοῦ πατρὸς
  choice: الله الآب
  rationale: صياغة عربية طبيعية ودقيقة للتركيب اليوناني، وتُبقي «الآب» لقبًا لله.
- source_word: Χριστοῦ Ἰησοῦ
  choice: المسيح يسوع
  rationale: «المسيح» ترجمة لقب Χριστός في العربية، مع إبقاء ترتيب اللقب والاسم كما في المصدر.
- source_word: κυρίου
  choice: ربنا
  rationale: يحفظ دلالة السيادة في κύριος وعلاقته بجماعة المؤمنين كما يدل ضمير الجمع اليوناني.
theological_decisions:
- issue: دلالة ἐν πίστει
  choice: في الإيمان
  alternative: بالإيمان
  rationale: «في الإيمان» أبقى على احتمال المجال أو الواقع الإيماني المشترك، بينما قد توحي «بالإيمان» بأن الإيمان هو الوسيلة وحدها؛ وقد أُثبت البديل في الحاشية للمحافظة على الاحتمال.
- issue: ترجمة Χριστοῦ Ἰησοῦ
  choice: المسيح يسوع
  alternative: يسوع المسيح
  rationale: حُفظ ترتيب المصدر، حيث يسبق اللقبُ الاسمَ، كما أن «المسيح» ترجمة عربية حية للقب وليست مجرد نقل صوتي.
- issue: البنوة في γνησίῳ τέκνῳ
  choice: ابني الحقيقي
  alternative: الابن الأصيل
  rationale: الصياغة المختارة توضح العلاقة الروحية المفهومة من السياق من غير ادعاء بنوة جسدية، وتحافظ على معنى الأصالة في γνήσιος.
translation_notes:
  register: صياغة فصحى معاصرة، واضحة ووقورة. استُعملت ألفاظ كنسية عربية راسخة مثل «النعمة» و«المسيح» و«الآب»، مع تجنب التراكيب القديمة غير الضرورية. وُضعت علامة الحاشية [a] في المتن عند موضع العبارة المحتملة الدلالة.
