  yaml_path: translation/nt/1_timothy/001/005.yaml
  text: The goal of the instruction is love from a pure heart and a good conscience and sincere faith[c][b][a],
translation:
  language: ar
  text: أمّا غايةُ التوجيه فهي المحبّة النابعة من قلب طاهر، وضمير صالح، وإيمان بلا رياء[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إيمان صادق». ويمكن أن تُفهم πίστις في بعض السياقات بمعنى «الثقة» أو «الأمانة».'
    reason: alternative_reading
  - marker: b
    text: يمكن أيضًا ترجمة «التوجيه» بـ«الأمر» أو «التكليف» أو «الوصية».
    reason: lexical_alternative
lexical_decisions:
- source_word: τέλος
  choice: غاية
  rationale: تفيد هنا الهدف المقصود من الوصية، لا انتهاءها، وهي صياغة عربية طبيعية تحفظ القوة الغائية للكلمة.
- source_word: παραγγελίας
  choice: الوصيّة
  rationale: تدل الكلمة على أمر أو تكليف أو توجيه؛ و«الوصية» تلائم سياق تكليف تيموثاوس بالتعليم، مع إثبات البدائل في الحاشية.
- source_word: ἀγάπη
  choice: المحبّة
  rationale: المقابل العربي المألوف والدقيق في هذا السياق الأخلاقي.
- source_word: ἐκ
  choice: النابعة من
  rationale: تبيّن أن الصفات الثلاث الآتية هي مصدر المحبة ومنشؤها، بصياغة عربية واضحة.
- source_word: καθαρᾶς καρδίας
  choice: قلب طاهر
  rationale: تحفظ الدلالة الأخلاقية والباطنية للعبارة في عربية فصيحة طبيعية.
- source_word: συνειδήσεως ἀγαθῆς
  choice: ضمير صالح
  rationale: «صالح» أقرب إلى ἀγαθῆς من التعبير التفسيري «ضمير مستريح» أو «نقي».
- source_word: πίστεως
  choice: إيمان
  rationale: المعنى الأرجح هنا هو الإيمان الحقيقي، مع إبقاء احتمالَي الثقة والأمانة في الحاشية.
- source_word: ἀνυποκρίτου
  choice: بلا رياء
  rationale: ينقل المعنى الحرفي الواضح لغياب النفاق، ويحافظ على قوة التعبير اليوناني دون تركيب عربي ثقيل.
- source_word: δὲ
  choice: أمّا
  rationale: تنقل الانتقال أو المقابلة الخفيفة مع الكلام السابق من غير إدخال دلالة زمنية غير موجودة في الأصل.
theological_decisions:
- issue: دلالة πίστις في πίστεως ἀνυποκρίτου
  choice: إيمان
  alternative: ثقة أو أمانة
  rationale: «إيمان» هو المعنى الأرجح في السياق، لكن المجال الدلالي للكلمة يسمح أيضًا بـ«الثقة» أو «الأمانة»، لذلك لم يُحسم الاحتمال ضمنيًا بل ذُكر في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ووقورة. استُخدمت «أمّا» لإظهار الانتقال الخفيف الذي تؤديه δέ، وحُفظ التوازي بين القلب والضمير والإيمان. وُضعت علامتا الحاشيتين في موضعيهما داخل النص.
