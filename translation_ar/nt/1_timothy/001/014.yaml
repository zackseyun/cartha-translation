  text: ὑπερεπλεόνασεν δὲ ἡ χάρις τοῦ κυρίου ἡμῶν μετὰ πίστεως καὶ ἀγάπης τῆς ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/014.yaml
  text: But the grace of our Lord overflowed all the more[a], with faith and love that are in Messiah Jesus.
translation:
  language: ar
  text: ولكن نعمة ربنا فاضت بوفرة فائقة، مع الإيمان والمحبة اللذين في المسيح يسوع.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπερεπλεόνασεν
  choice: فاضت فيضًا عظيمًا جدًا
  rationale: ينقل التعبير قوة الفعل المركب الدال على الوفرة الفائقة، بصياغة عربية واضحة وطبيعية، من غير الاكتفاء بمعنى «كثرت» الأضعف.
- source_word: δὲ
  choice: ولكن
  rationale: تفيد الأداة هنا المقابلة مع ما سبق من الحديث عن التجديف والاضطهاد وعدم الإيمان.
- source_word: χάρις
  choice: نعمة
  rationale: المقابل العربي المألوف والدقيق في هذا السياق لعطية الرب وإحسانه غير المستحق.
- source_word: τοῦ κυρίου ἡμῶν
  choice: ربنا
  rationale: يحفظ لقب κύριος وصيغة المتكلم الجمع بإيجاز عربي طبيعي.
- source_word: μετὰ πίστεως καὶ ἀγάπης
  choice: مع الإيمان والمحبة
  rationale: يحافظ على الدلالة الأساسية لحرف الجر μετά وعلى ارتباط الإيمان والمحبة بالنعمة الفائضة، من غير حسم ما إذا كانا مجرد مصاحبين لها أو من ثمارها.
- source_word: τῆς ἐν Χριστῷ Ἰησοῦ
  choice: اللذين في المسيح يسوع
  rationale: يجعل الوصف راجعًا بوضوح إلى الإيمان والمحبة معًا، ويحفظ ترتيب اللقب والاسم في اليونانية وصيغة «في المسيح» البولسية.
theological_decisions:
- issue: علاقة «مع الإيمان والمحبة» بالنعمة
  choice: إبقاء العبارة متعلقة بفيض النعمة بوصف الإيمان والمحبة مصاحبين له
  alternative: التصريح بأن النعمة أنشأت الإيمان والمحبة في بولس
  rationale: التركيب اليوناني يربط العبارة بالفعل والنعمة مباشرة، لكنه لا يصرح بعلاقة سببية؛ لذلك تُحفظ المرونة الدلالية ولا يُضاف تفسير لاهوتي إلى النص.
- issue: دلالة Χριστός وترتيب Χριστῷ Ἰησοῦ
  choice: المسيح يسوع
  alternative: يسوع المسيح
  rationale: «المسيح» في العربية ينقل اللقب الملوكي/المسياني، وترتيب «المسيح يسوع» يحافظ على ترتيب الأصل ويظل مفهومًا في السجل الكتابي الفصيح.
translation_notes:
  register: صياغة عربية فصحى حديثة ذات نبرة كتابية كريمة. استُعمل المفعول المطلق «فيضًا» لتقوية معنى الفعل اليوناني المركب من غير اللجوء إلى لفظ غريب أو عتيق، وحُفظت العبارة «في المسيح يسوع» من دون تفسير زائد.
