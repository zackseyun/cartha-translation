  text: ὧν ἐστιν Ὑμέναιος καὶ Ἀλέξανδρος, οὓς παρέδωκα τῷ Σατανᾷ ἵνα παιδευθῶσι μὴ βλασφημεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/020.yaml
  text: among whom are Hymenaeus and Alexander[b][a], whom I have handed over to Satan so that they may be taught not to blaspheme.
translation:
  language: ar
  text: ومِن بينهم هيمينايوس والإسكندر، اللذان سلَّمتُهما إلى الشيطان[a] لكي يُؤدَّبا على ألّا يجدِّفا[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «دفعتُهما إلى الشيطان». يُرجَّح أن العبارة تشير إلى تأديب تصحيحي شديد، لا إلى حكم نهائي بالهلاك.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا ترجمة «يُؤدَّبا»: «يتعلَّما» أو «يُدرَّبا» أو «يُقوَّما»؛ فالكلمة اليونانية تتضمن معنى التعليم المصحوب بالتقويم.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν ἐστιν
  choice: ومِن بينهم
  rationale: تعبير عربي طبيعي يحفظ دلالة التبعيض في ضمير الموصول اليوناني ويربط الاسمين بالجماعة المذكورة سابقًا.
- source_word: Ὑμέναιος καὶ Ἀλέξανδρος
  choice: هيمينايوس والإسكندر
  rationale: نُقل الاسم الأول صوتيًا عن اليونانية، واستُعملت الصيغة العربية الراسخة لاسم الإسكندر.
- source_word: οὓς παρέδωκα
  choice: اللذان سلَّمتُهما
  rationale: يحفظ الفعل معنى التسليم أو الدفع إلى سلطة طرف آخر، ويعبّر الماضي العربي بوضوح عن الفعل الذي أتمه بولس.
- source_word: τῷ Σατανᾷ
  choice: إلى الشيطان
  rationale: «الشيطان» هو المقابل العربي المألوف لهذا اللقب في سياق العهد الجديد.
- source_word: ἵνα παιδευθῶσι
  choice: لكي يُؤدَّبا
  rationale: صيغة المبني للمجهول تحفظ بنية الأصل، و«يُؤدَّبا» تجمع معنى التعليم والتقويم بالعقوبة أو الانضباط، بما يلائم السياق التصحيحي.
- source_word: μὴ βλασφημεῖν
  choice: على ألّا يجدِّفا
  rationale: «يجدِّفا» يحفظ الثقل الديني للفعل اليوناني، وتركيب «يُؤدَّبا على ألّا» واضح وطبيعي في العربية.
theological_decisions:
- issue: معنى «سلَّمتُهما إلى الشيطان»
  choice: أُبقيت العبارة حرفية في المتن مع الإشارة في الحاشية إلى غايتها التأديبية التصحيحية.
  alternative: تفسيرها في المتن بأنها إخراج من جماعة الكنيسة، أو إصابة جسدية خارقة، أو حكم نهائي بالهلاك.
  rationale: لا يحدد النص آلية التسليم، لكن جملة الغاية تدل على قصد تقويمي؛ لذلك تُحفظ العبارة والتوتر اللاهوتي من دون فرض تفسير كنسي أو معجزي بعينه.
- issue: مدى معنى παιδευθῶσι
  choice: يُؤدَّبا
  alternative: يتعلَّما؛ يُدرَّبا؛ يُقوَّما
  rationale: السياق يجمع بين الإيلام أو الانضباط وبين غاية تعليمية إصلاحية، و«يُؤدَّبا» يحفظ هذين الجانبين من غير حصر المعنى في التعليم الذهني.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظت العبارة اللاهوتية الصعبة كما هي، مع توضيح البدائل الدلالية في الحواشي دون حسم آلية التأديب.
