id: 1TI.1.11
reference: 1 Timothy 1:11
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: κατὰ τὸ εὐαγγέλιον τῆς δόξης τοῦ μακαρίου θεοῦ, ὃ ἐπιστεύθην ἐγώ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/011.yaml
  text: according to the gospel of the glory of the blessed God[a], which was entrusted to me.
translation:
  language: ar
  text: بحسب إنجيل مجد الله المبارك[a]، الذي اؤتمنتُ عليه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو بصياغة أكثر سلاسة: «الإنجيل المجيد لله المبارك».'
    reason: alternative_reading
lexical_decisions:
- source_word: κατὰ
  choice: بحسب
  rationale: تفيد κατά مع النصب هنا الموافقة لمعيار أو قاعدة، و«بحسب» صياغة عربية موجزة وطبيعية تحفظ هذه العلاقة.
- source_word: εὐαγγέλιον
  choice: إنجيل
  rationale: «إنجيل» هو المقابل العربي الراسخ والمفهوم في السياق البولسي، ويحفظ الدلالة الدينية للمصطلح.
- source_word: τῆς δόξης
  choice: مجد
  rationale: أُبقي التركيب الإضافي «إنجيل مجد...» بدل تحويل الاسم إلى صفة، حفاظًا على بنية اليونانية وعلى احتمال كون الإضافة وصفية أو دالة على التعلّق.
- source_word: μακαρίου
  choice: المبارك
  rationale: عند وصف الله، «المبارك» مقابل عربي لائق لـ μακάριος؛ أما «السعيد» فلا يلائم جلال السياق.
- source_word: θεοῦ
  choice: الله
  rationale: ترجمة مباشرة لـ θεός في تركيب الإضافة.
- source_word: ὃ
  choice: الذي ... عليه
  rationale: يعود اسم الموصول على «الإنجيل»، وتستدعي العربية مع فعل «ائتمن» حرف الجر «على».
- source_word: ἐπιστεύθην
  choice: اؤتمنتُ
  rationale: المبني للمجهول هنا من πιστεύω يحمل معنى تسليم أمانة أو تكليف، لا مجرد الإيمان.
- source_word: ἐγώ
  choice: التاء في اؤتمنتُ
  rationale: يُعبَّر عن ضمير المتكلم في العربية بتصريف الفعل؛ ولا تستلزم دلالة السياق إضافة «أنا» المنفصلة، التي قد تُحدث توكيدًا زائدًا.
theological_decisions:
- issue: علاقة الإضافة في τὸ εὐαγγέλιον τῆς δόξης τοῦ μακαρίου θεοῦ
  choice: إنجيل مجد الله المبارك
  alternative: الإنجيل المجيد لله المبارك
  rationale: يحفظ النص تركيب «إنجيل المجد» بدل حسم الإضافة على أنها صفة بمعنى «الإنجيل المجيد». ويُذكر الوجه الوصفي الأكثر سلاسة في الحاشية.
- issue: معنى ἐπιστεύθην
  choice: اؤتمنتُ عليه
  alternative: آمنتُ به
  rationale: السياق والتركيب يدلان على تسليم الإنجيل إلى بولس بوصفه أمانة أو تكليفًا، لا على فعل الإيمان به.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حُفظ تركيب الإضافة اليوناني في المتن، مع تقديم الصياغة الوصفية الأيسر في الحاشية.
