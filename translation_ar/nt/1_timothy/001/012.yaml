    reason: lexical_alternative
lexical_decisions:
- source_word: Χάριν ἔχω
  choice: أشكر
  rationale: هذا التعبير اليوناني اصطلاح شائع لإبداء الشكر؛ و«أشكر» عربية واضحة وطبيعية وتحفظ قوته الفعلية.
- source_word: ἐνδυναμώσαντί με
  choice: الذي قوّاني
  rationale: ينسب اسم الفاعل إلى المسيح فعل تمكين بولس وتقويته، من غير تخصيص نوع هذه القوة بما لا يذكره النص.
- source_word: Χριστῷ Ἰησοῦ
  choice: المسيح يسوع
  rationale: «المسيح» ينقل معنى اللقب Χριστός بصيغته العربية الراسخة، مع إبقاء ترتيب اللقب والاسم كما في اليونانية.
- source_word: τῷ κυρίῳ ἡμῶν
  choice: ربنا
  rationale: يحفظ اللقب المسيحاني الدال على السلطان، وهو التعبير العربي المألوف والواضح.
- source_word: πιστόν
  choice: أمينًا
  rationale: تدل هنا على من يُعتمد عليه في ما يُعهد إليه؛ و«أمينًا» تحفظ معنى الأمانة والجدارة بالثقة.
- source_word: ἡγήσατο
  choice: عدّني
  rationale: ينقل معنى النظر إلى شخص واعتباره على صفة معينة، بصياغة عربية موجزة ومألوفة كتابيًا.
- source_word: θέμενος
  choice: إذ جعلني
  rationale: يحفظ المعنى الأساسي، أي وضع بولس في مهمة الخدمة، من غير أن يفرض على العبارة مفهوم منصب كنسي رسمي لاحق.
- source_word: εἰς διακονίαν
  choice: في الخدمة
  rationale: «الخدمة» تنقل المجال الواسع لكلمة διακονία، بينما يعبّر حرف الجر «في» مع «جعلني» طبيعيًا عن إدخاله في هذا العمل.
theological_decisions:
- issue: نقل لقب Χριστός
  choice: المسيح يسوع
  alternative: يسوع المسيح
  rationale: حُفظ ترتيب الأصل «المسيح يسوع»، كما نُقل اللقب بمعناه العربي الراسخ بدل معاملته كاسم لا دلالة له.
- issue: طبيعة تكليف بولس
  choice: إذ جعلني في الخدمة
  alternative: إذ عيّنني للخدمة
  rationale: الصياغة المختارة تحفظ صورة «الوضع في الخدمة» وتفيد التكليف، من غير أن توحي بالضرورة بمنصب مؤسسي أضيق من دلالة النص.
- issue: العلاقة بين اعتباره أمينًا وجعله في الخدمة
  choice: لأنه عدّني أمينًا، إذ جعلني في الخدمة
  alternative: لأنه عدّني أمينًا وعيّنني للخدمة
  rationale: حُفظت تبعية اسم الفاعل θέμενος للفعل الرئيس، من غير تحويل الفعلين إلى حدثين مستقلين أو حسم العلاقة المنطقية بأكثر مما تسمح به الصياغة اليونانية.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ووقورة. استُخدمت «أشكر» بدل ترجمة حرفية ثقيلة للتعبير الاصطلاحي، وحُفظت بنية الجملة وعلاقة أفعالها قدر الإمكان من غير إقحام مصطلحات كنسية متأخرة.
