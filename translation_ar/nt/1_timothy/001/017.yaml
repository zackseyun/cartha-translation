  text: τῷ δὲ βασιλεῖ τῶν αἰώνων, ἀφθάρτῳ, ἀοράτῳ, ⸀μόνῳ θεῷ, τιμὴ καὶ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/017.yaml
  text: To the King of the ages[a], immortal, invisible, the only God, be honor and glory forever and ever. Amen.
translation:
  language: ar
  text: أمّا ملك الدهور، الذي لا يفنى ولا يُرى، الإله الوحيد[a]، فله الكرامة والمجد إلى دهر الدهور. آمين.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ بعض المخطوطات: «الإله الحكيم الوحيد».'
    reason: textual_variant
lexical_decisions:
- source_word: τῷ δὲ βασιλεῖ τῶν αἰώνων
  choice: أمّا ملك الدهور ... فله
  rationale: يحافظ «ملك الدهور» على تركيب الإضافة وصورة αἰών، ويعبّر بناء «أمّا ... فله» طبيعيًا عن الانتقال الذي تؤديه δέ وعن صيغة التكريم في الجملة اليونانية من غير إضافة ظرف زمني غير موجود في الأصل.
- source_word: ἀφθάρτῳ
  choice: الذي لا يفنى
  rationale: تعبير عربي واضح يصف تنزّه الله عن الفناء والفساد، وهو أنسب في السياق من «الخالد» الذي قد يركّز على عدم الموت وحده.
- source_word: ἀοράτῳ
  choice: لا يُرى
  rationale: ينقل معنى عدم إمكان رؤيته بعبارة عربية مباشرة وسلسة، مع اقترانه وصفيًا بـ«لا يفنى».
- source_word: μόνῳ θεῷ
  choice: الإله الوحيد
  rationale: يعكس قراءة SBLGNT التي لا تتضمن σοφῷ، ويحفظ قوة الإقرار بأن الله هو الإله الوحيد.
- source_word: τιμὴ καὶ δόξα
  choice: الكرامة والمجد
  rationale: مقابل مألوف ودقيق للاسمين في سياق التمجيد، مع إبقاء التمييز بين التكريم والمجد.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: إلى دهر الدهور
  rationale: صيغة عربية راسخة ومهيبة تعبّر عن الاستمرار الأبدي وتحافظ على صورة «الدهور» في العبارة اليونانية.
- source_word: ἀμήν
  choice: آمين
  rationale: النقل الصوتي العربي المألوف في النصوص الكتابية والعبادة.
theological_decisions:
- issue: الحفاظ على القوة التوحيدية لعبارة μόνῳ θεῷ من غير إدخال تفسير عقائدي زائد
  choice: الإله الوحيد
  alternative: لله وحده
  rationale: ينقل الاختيار الصفة والنعت كما في النص، ويترك إقرار النص بالتوحيد قائمًا من غير إضافة قيد يحسم علاقته بسائر الشهادة الرسولية.
- issue: الاختلاف النصي الذي يضيف σοφῷ («الحكيم»)
  choice: عدم إدراج «الحكيم» في المتن
  alternative: الإله الحكيم الوحيد
  rationale: النص اليوناني المعتمد SBLGNT يقرأ μόνῳ θεῷ بلا σοφῷ؛ لذلك تُذكر القراءة الأطول في الحاشية ولا تُدخل في المتن.
translation_notes:
  register: 'عربية فصحى معاصرة واضحة ذات نبرة تمجيدية رصينة. استُخدم بناء «أمّا ... فله» ليبقى الكلام طبيعيًا مع إظهار وجهة الكرامة والمجد، واستُعيض عن الصفات التراثية الأثقل «غير الفاني، غير المنظور» بعبارة موصولة مفهومة: «الذي لا يفنى ولا يُرى».'
