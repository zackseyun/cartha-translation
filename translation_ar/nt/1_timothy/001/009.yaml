source:
  edition: SBLGNT
  text: εἰδὼς τοῦτο, ὅτι δικαίῳ νόμος οὐ κεῖται, ἀνόμοις δὲ καὶ ἀνυποτάκτοις, ἀσεβέσι καὶ ἁμαρτωλοῖς, ἀνοσίοις καὶ βεβήλοις, πατρολῴαις καὶ μητρολῴαις, ἀνδροφόνοις,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/009.yaml
  text: 'understanding this: the law is not laid down for a righteous man, but for the lawless and rebellious, the ungodly and sinful, the unholy and profane, those who kill their fathers and those who kill their mothers, murderers,'
translation:
  language: ar
  text: 'مع العلم بهذا: أن الشريعة لا تُوضَع للبار، بل للخارجين على الشريعة والمتمرّدين، وللفجّار والخاطئين، وللمنتهكين للقداسة والمنتهكين للمقدسات، ولقاتلي آبائهم وقاتلي أمهاتهم[a]، وللقتلة،'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو ربما: «لضاربي آبائهم وضاربي أمهاتهم»؛ فاللفظان اليونانيان قد يشيران إلى الاعتداء العنيف على الوالدين، وإن كان معنى القتل مرجحًا في هذا السياق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς τοῦτο
  choice: عالمًا هذا
  rationale: يحافظ على قوة اسم الفاعل الدال على المعرفة، ويربط القول بما سبقه دون تحويله إلى فعل مستقل.
- source_word: δικαίῳ
  choice: للبار
  rationale: ينقل المفرد المذكر التمثيلي بإيجاز طبيعي، ولا يحصر الدلالة في شخص معيّن.
- source_word: νόμος οὐ κεῖται
  choice: لا تُوضَع الشريعة
  rationale: يحافظ على صورة κεῖται القانونية، أي وضع الشريعة أو تقريرها، بدل التفسير الأبعد «لا تنطبق».
- source_word: ἀνόμοις
  choice: للخارجين على الشريعة
  rationale: يوضح معنى مخالفة الشريعة في العربية المعاصرة، ويتجنب «بلا ناموس» غير الطبيعية.
- source_word: ἀνυποτάκτοις
  choice: المتمرّدين
  rationale: ينقل معنى رفض الخضوع بلفظ واضح ومألوف.
- source_word: ἀσεβέσι
  choice: الفجّار
  rationale: يدل على انعدام التقوى نحو الله، مع تمييزه قدر الإمكان عن الألفاظ التالية.
- source_word: ἁμαρτωλοῖς
  choice: الخاطئين
  rationale: يقابل اللفظ اليوناني الدال على مرتكبي الخطية ويحافظ على بنية الأزواج في القائمة.
- source_word: ἀνοσίοις
  choice: غير المقدّسين
  rationale: ينقل معنى انتهاك ما يليق بالقداسة، مع إبقاء التمييز عن βεβήλοις.
- source_word: βεβήλοις
  choice: المدنّسين
  rationale: يفيد امتهان المقدسات وجعلها مدنسة، وهو أوضح من استعمال «دنيويين» المحتمل الالتباس.
- source_word: πατρολῴαις
  choice: قاتلي آبائهم
  rationale: اللفظ النادر قد يعني ضاربي الآباء أو قاتليهم؛ اختير معنى القتل لملاءمة السياق، مع إثبات البديل في الحاشية.
- source_word: μητρολῴαις
  choice: قاتلي أمهاتهم
  rationale: موازٍ للفظ السابق، واختير معنى القتل مع حفظ احتمال الاعتداء بالضرب في الحاشية.
- source_word: ἀνδροφόνοις
  choice: القتلة
  rationale: لفظ عربي موجز وواضح يدل هنا على القتل الإجرامي ضمن قائمة الرذائل.
theological_decisions:
- issue: دلالة المذكر المفرد في δικαίῳ
  choice: للبار
  alternative: للإنسان البار؛ للأبرار
  rationale: يحفظ صيغة المفرد المذكر في اليونانية بوصفها تمثيلية، من غير إضافة «رجل» التي قد توهم الحصر في الذكور.
- issue: القوة الدلالية لـ πατρολῴαις وμητρολῴαις
  choice: قاتلي آبائهم وقاتلي أمهاتهم
  alternative: ضاربي آبائهم وضاربي أمهاتهم
  rationale: يمكن أن يشير اللفظان إلى الاعتداء العنيف أو القتل. يرجح السياق معنى القتل، لكن الغموض المعجمي الحقيقي محفوظ في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. حوفظ على تتابع الأزواج في قائمة الرذائل، وعلى الصيغة القانونية في «لا تُوضَع الشريعة»، مع تجنب الألفاظ القديمة غير المألوفة مثل «الناموس».
