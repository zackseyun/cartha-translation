lexical_decisions:
- source_word: Ταῦτά
  choice: هذه الأمور
  rationale: يحفظ جمع اسم الإشارة المحايد وإحالته إلى مجموعة التعليمات الواردة في السياق، وهو أوضح عربيًا من «هذا».
- source_word: σοι
  choice: إليك
  rationale: صياغة عربية طبيعية مع فعل الكتابة، وتؤدي معنى ضمير المخاطب في حالة المجرور غير المباشر.
- source_word: γράφω
  choice: أكتب
  rationale: المضارع العربي الطبيعي يلائم المضارع الرسائلي اليوناني ويعبّر عن فعل الكتابة الجاري.
- source_word: ἐλπίζων
  choice: راجيًا
  rationale: حال اسمية موجزة تحفظ معنى الرجاء الملازم للفعل الرئيس من غير أن تحوّله إلى يقين.
- source_word: ἐλθεῖν
  choice: أن آتي
  rationale: ينقل مصدر ἔρχομαι الدال على المجيء نحو المخاطَب بصياغة عربية طبيعية بعد «راجيًا».
- source_word: πρὸς σὲ
  choice: إليك
  rationale: يعبّر عن الاتجاه نحو تيموثاوس بعد فعل الحركة، من دون إضافة معنى «لأكون معك» غير المصرّح به.
- source_word: ἐν τάχει
  choice: قريبًا
  rationale: يناسب السياق الرسائلي ويفيد قرب زمن المجيء، مع إبقاء احتمال معنى السرعة في الحاشية.
