review_pass:
  verdict: revise
  source_fidelity: 'ينقل النص القوائم الوصفية اليونانية بدقة عامة: «الشمامسة» مناسبة في هذا السياق الكنسي، و«وقورين»، والتحذير من التعلّق بالخمر الكثير، ومن الكسب الدنيء، كلها تحفظ المعنى. لكن «ذوي لسانين» صورة حرفية قد تُفهم في العربية المعاصرة على أنها تتعلق بتعدد اللغات، لا بازدواج القول المقصود في διλόγους.'
