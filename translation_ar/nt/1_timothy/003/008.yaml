  rationale: عُدِّلت عبارة ازدواج القول إلى تعبير عربي معاصر لا يحتمل التباس تعدد اللغات، مع إبقاء الصورة الحرفية في الحاشية. كما صُقلت صياغة بديل التعلّق بالخمر لتكون طبيعية وواضحة، من غير تحويل المعنى إلى تشخيص طبي في المتن. ولم يتغير المعنى أو درجة التحذيرات في النص.
