    reason: lexical_alternative
  - marker: b
    text: 'أو: غير مدمنين على شرب الخمر بكثرة.'
    reason: lexical_alternative
  - marker: c
    text: 'أو: لا يسعون وراء ربح مخزٍ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διακόνους
  choice: الشمامسة
  rationale: يرد اللفظ هنا في قائمة مؤهلات موازية لمؤهلات المشرفين في الآيات السابقة، ولذلك يدل على خدمة كنسية معترف بها، لا على الخدم بالمعنى العام.
- source_word: ὡσαύτως
  choice: وكذلك
  rationale: تربط هذه الفئة بما سبق من مؤهلات المشرفين، مع الانتقال إلى جماعة أخرى ذات صلة.
- source_word: σεμνούς
  choice: أهلَ وقار
  rationale: تعبير عربي طبيعي يدل على الرزانة والسلوك الجدير بالاحترام، من غير إيحاء بالتجهم.
- source_word: μὴ διλόγους
  choice: لا ذوي لسانين
  rationale: يحافظ على الصورة اليونانية الحية التي تصف ازدواج الكلام وعدم صدقه، مع إيضاحها في الحاشية.
- source_word: μὴ οἴνῳ πολλῷ προσέχοντας
  choice: ولا مولعين بكثرة الخمر
  rationale: ينقل معنى التعلق والانشغال بالخمر مع إبقاء دلالة πολλῷ على الكثرة، من غير إدخال مصطلح سريري حديث كالإدمان.
- source_word: μὴ αἰσχροκερδεῖς
  choice: ولا طامعين في مكسب دنيء
  rationale: يعبر عن التطلع إلى الربح بطريقة معيبة أو مخزية، ويحافظ على القوة الأخلاقية للمركب اليوناني.
theological_decisions:
- issue: الدلالة الكنسية للفظ διάκονος
  choice: الشمامسة بوصفه اسم خدمة كنسية
  alternative: الخدام أو القائمون بالخدمة
  rationale: السياق يعرض مؤهلات أدوار معترف بها في الجماعة، أولًا المشرفين ثم الشمامسة. وهذا الاختيار يحفظ خصوصية السياق من غير تحميل اللفظ بنى طائفية لاحقة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حُفظت الصورة المجازية في «ذوي لسانين» مع شرحها، واستُعمل «الشمامسة» للدلالة السياقية على الخدمة الكنسية المعترف بها دون تفصيل مذهبي.
