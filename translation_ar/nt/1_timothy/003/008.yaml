  text: Deacons likewise must be dignified[a], not double-tongued, not devoted to much wine, not greedy for shameful gain[c][b],
translation:
  language: ar
  text: وكذلك يجب أن يكون الشمامسة وقورين، غير مزدوجي الكلام[a]، وغير مولعين بكثرة الخمر[b]، وغير طامعين في مكسب دنيء[c].
