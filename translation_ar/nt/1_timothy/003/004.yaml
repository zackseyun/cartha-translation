  text: أن يُحسن تدبير أهل بيته[a]، وله أولاد في خضوع[b] بكل وقار[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أن يقود أهل بيته قيادة حسنة»، أو «أن يحكم بيته حكمًا حسنًا».'
