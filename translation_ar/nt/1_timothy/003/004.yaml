    reason: alternative_reading
lexical_decisions:
- source_word: τοῦ ἰδίου οἴκου
  choice: أهل بيته
  rationale: يدل οἶκος هنا على البيت بوصفه الأسرة ومن يعيشون تحت رعايته، لا على المبنى وحده. وتؤدي الإضافة في «أهل بيته» معنى ἰδίου الطبيعي، أي بيته هو.
- source_word: καλῶς προϊστάμενον
  choice: أن يُحسن تدبير
  rationale: يفيد προΐστημι تولّي القيادة والإشراف المسؤول، ويفيد καλῶς حسن القيام بذلك. تجمع الصياغة العربية بين المعنيين بصورة طبيعية من غير تشديد اللفظ إلى «التسلط» ولا إضعافه إلى مجرد الرعاية.
- source_word: τέκνα ἔχοντα
  choice: وأن يكون أولاده
  rationale: تنقل العبارة الحالة المطلوبة في الأولاد ضمن وصف حسن تدبير البيت، وهي صياغة عربية أوضح من النقل الحرفي «حاملًا أولاده».
- source_word: ἐν ὑποταγῇ
  choice: في خضوع
  rationale: يحافظ «خضوع» على الصيغة الاسمية وعلى معنى النظام والقبول بالسلطة، من غير اختزاله في الطاعة لسلوك معين أو تفسيره على أنه مجرد سيطرة خارجية.
- source_word: μετὰ πάσης σεμνότητος
  choice: بكل وقار
  rationale: يفيد σεμνότης الوقار والجدية والسلوك الجدير بالاحترام. وتحافظ العبارة على إيجاز الأصل، كما لا تحسم وحدها هل الوقار وصف لخضوع الأولاد أم لطريقة إدارة البيت عمومًا.
theological_decisions:
- issue: نطاق سلطة رب الأسرة
  choice: يعرض النص قيام المرشح للإشراف بتدبير أسرته تدبيرًا مسؤولًا ومنظمًا.
  alternative: قراءة تشدد معنى الحكم الأبوي، أو قراءة تلغي دلالة السلطة وتحصرها في الرعاية وحدها.
  rationale: يدل προϊστάμενον وὑποταγή على قيادة فعلية ونظام داخل البيت، لكن الآية تورد مؤهلًا للخدمة ولا تقدم بمفردها مذهبًا شاملًا في كل صور السلطة الأسرية.
- issue: متعلَّق عبارة «بكل وقار»
  choice: الإبقاء على موضع العبارة وصياغتها من غير حسم متعلَّقها.
  alternative: أن تصف العبارة خضوع الأولاد خاصة، أو أن تصف طريقة الرجل في تدبير بيته عمومًا.
  rationale: يحتمل التركيب اليوناني كلا الوجهين، ولذلك تحافظ الترجمة على هذا القدر من الغموض بدل أن تفرض تفسيرًا واحدًا.
translation_notes:
  register: لغة عربية فصحى معاصرة واضحة ووقورة. استُعمل «أهل بيته» للدلالة على الأسرة المنزلية، و«يُحسن تدبير» لتأدية معنى الإشراف المسؤول بصورة طبيعية، مع إبقاء الاحتمال النحوي في «بكل وقار» مفتوحًا.
