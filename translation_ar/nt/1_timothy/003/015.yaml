language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἐὰν δὲ βραδύνω, ἵνα εἰδῇς πῶς δεῖ ἐν οἴκῳ θεοῦ ἀναστρέφεσθαι, ἥτις ἐστὶν ἐκκλησία θεοῦ ζῶντος, στῦλος καὶ ἑδραίωμα τῆς ἀληθείας·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/015.yaml
  text: But if I am delayed[a], I write so that you may know how one ought to conduct oneself in the household of God, which is the assembly of the living God[b], the pillar and support of the truth.
translation:
  language: ar
  text: ولكن إن تأخرتُ[a]، فأكتب إليك لكي تعرف كيف ينبغي للمرء أن يسلك في بيت الله، الذي هو جماعة الله الحي[b]، عمود الحق ودعامته[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أبطأتُ»؛ والمقصود التأخر في المجيء.'
    reason: lexical_alternative
  - marker: b
    text: 'أو بحسب التعبير الكنسي المألوف: «كنيسة الله الحي».'
    reason: lexical_alternative
  - marker: c
    text: 'يمكن أيضًا ترجمة «دعامته»: «ركيزته» أو «حصنه»؛ واقتُرح كذلك «أساسه».'
    reason: lexical_alternative
lexical_decisions:
- source_word: βραδύνω
  choice: أتأخرتُ
  rationale: يفيد الفعل هنا التباطؤ أو التأخر في المجيء. وصيغة «تأخرتُ» عربية طبيعية ولا توحي بحكم أخلاقي على البطء.
- source_word: ἵνα εἰδῇς
  choice: فلكي تعرف
  rationale: تحفظ العبارة معنى الغاية، وتستند دلاليًا إلى فعل الكتابة المذكور في السياق السابق من غير إدخال فعل صريح غير موجود في هذه الجملة اليونانية.
- source_word: πῶς δεῖ ... ἀναστρέφεσθαι
  choice: كيف ينبغي للمرء أن يسلك
  rationale: الفعل يدل على السلوك والتصرف وطريقة العيش، و«ينبغي» تنقل معنى الضرورة المعيارية في δεῖ، أما «للمرء» فتحفظ الصياغة غير الشخصية بدل قصرها على تيموثاوس وحده.
- source_word: ἐν οἴκῳ θεοῦ
  choice: في بيت الله
  rationale: تحفظ الصورة الأصلية لكلمة οἶκος، بينما يوضح البدل اللاحق أن المقصود جماعة الله لا مجرد مبنى.
- source_word: ἐκκλησία
  choice: جماعة
  rationale: تنقل المعنى الأساسي للجماعة المجتمعة، وتتفادى حصر اللفظ ابتداءً في مدلول مؤسسي متأخر؛ وتُذكر الصيغة الكنسية المألوفة في الحاشية.
- source_word: θεοῦ ζῶντος
  choice: الله الحي
  rationale: صياغة عربية موجزة ومألوفة تحفظ وصف الله بأنه الحي.
- source_word: στῦλος
  choice: عمود
  rationale: يحفظ الاستعارة المعمارية بلفظ واضح ومباشر.
- source_word: ἑδραίωμα
  choice: دعامة
  rationale: ينقل معنى ما يثبت ويسند، من غير الجزم بأن المقصود أساس منشئ للحق. وتعرض الحاشية البدائل الممكنة.
- source_word: τῆς ἀληθείας
  choice: الحق
  rationale: «الحق» هو المقابل العربي الطبيعي في هذا السياق، ويحفظ التعريف والمعنى اللاهوتي من غير توسع تفسيري.
theological_decisions:
- issue: مدلول ἐκκλησία في وصف بيت الله
  choice: جماعة الله الحي
  alternative: كنيسة الله الحي
  rationale: «جماعة» تبرز أن الحديث عن شعب مجتمع، مع إبقاء المقابل الكنسي التقليدي في الحاشية وعدم إنكار البعد الكنسي للنص.
- issue: علاقة «عمود الحق ودعامته» بالجماعة
  choice: إبقاء العبارة خبرًا عن جماعة الله من غير شرح عقائدي داخل المتن
  alternative: عمود الحق وأساسه
  rationale: النحو اليوناني ينسب الوصف إلى الجماعة. واختيار «دعامة» يحفظ دعوى النص القوية بشأن إسناد الجماعة للحق، من غير الإيحاء بأنها مصدر الحق أو منشئه.
- issue: الفاعل المقصود في δεῖ ... ἀναστρέφεσθαι
  choice: 'صياغة غير شخصية: «ينبغي للمرء أن يسلك»'
  alternative: «ينبغي لك أن تسلك»
  rationale: المصدر اليوناني غير محدد الفاعل، ولذلك لا ينبغي حصر التكليف في تيموثاوس، وإن كان هو المخاطب المباشر في «تعرف».
translation_notes:
  register: لغة عربية فصحى معاصرة واضحة ووقورة. حُفظت استعارتا البيت والبناء، واستُعمل «أي» لبيان علاقة «جماعة الله الحي» بـ«بيت الله». أبقي تركيب الغاية «فلكي تعرف» مرتبطًا بالسياق السابق بدل إضافة «أكتب» إلى متن هذه الآية مع أنه مفهوم من الآية السابقة.
