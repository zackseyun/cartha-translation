    rationale: الفعل اليوناني οἶδεν متبوعًا بالمصدر يفيد معرفة كيفية أداء الفعل. وإضافة «كيف» تنقل هذا المعنى بجلاء وتزيل احتمال فهم «أن» على أنها مضمون معرفة خبري.
