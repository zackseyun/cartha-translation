source:
  edition: SBLGNT
  text: (εἰ δέ τις τοῦ ἰδίου οἴκου προστῆναι οὐκ οἶδεν, πῶς ἐκκλησίας θεοῦ ἐπιμελήσεται;)
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/005.yaml
  text: But if someone does not know how to manage his own household[c][b][a], how will he care for God’s church?
translation:
  language: ar
  text: ولكن إن كان أحد لا يعرف كيف يدبّر أهل بيته، فكيف سيعتني بكنيسة الله؟
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δέ
  choice: ولكن إن كان
  rationale: يحفظ معنى الشرط مع الانتقال الاستدراكي الخفيف الذي تؤديه δέ، بصياغة عربية طبيعية.
- source_word: τις
  choice: أحد
  rationale: ينقل اسم الشرط غير المعيّن دون زيادة تحديد لا يصرّح بها اللفظ نفسه، مع بقاء السياق السابق متعلقًا بشروط المشرف.
- source_word: τοῦ ἰδίου οἴκου
  choice: أهل بيته
  rationale: المقصود بالـοἶκος هنا الوحدة المنزلية الواقعة تحت رعايته وتدبيره، لا المبنى وحده؛ و«أهل بيته» تعبير عربي واضح وطبيعي.
- source_word: προστῆναι
  choice: أن يدبّر
  rationale: يفيد تولّي المسؤولية والقيادة العملية في البيت، من غير تحميل اللفظ نبرة تسلطية زائدة كما قد توحي «يحكم».
- source_word: οὐκ οἶδεν
  choice: لا يعرف أن
  rationale: الفعل مع المصدر يدل على معرفة كيفية القيام بالأمر؛ وهذه الصياغة العربية تؤدي المعنى اصطلاحيًا من غير تحويله صراحة إلى عدم قدرة.
- source_word: πῶς
  choice: فكيف
  rationale: يحفظ السؤال الاستنكاري والاستنتاج من تدبير البيت إلى العناية بالكنيسة.
- source_word: ἐκκλησίας θεοῦ
  choice: بكنيسة الله
  rationale: «كنيسة الله» هي الصياغة العربية المألوفة والدقيقة للمضاف والمضاف إليه في هذا السياق الكنسي.
- source_word: ἐπιμελήσεται
  choice: سيعتني
  rationale: ينقل معنى الاهتمام المسؤول والرعاية الفعلية، ويحفظ الفرق بين هذا الفعل وبين προΐστημι المستعمل بشأن البيت.
theological_decisions:
- issue: العلاقة بين تدبير البيت والإشراف على الكنيسة
  choice: استعمال «يدبّر» للبيت و«سيعتني» بكنيسة الله
  alternative: استعمال لفظ قيادة واحد في العبارتين، أو ترجمة الفعل الأول بـ«يحكم»
  rationale: 'النص اليوناني يستعمل فعلين مختلفين: προΐστημι للمسؤولية في البيت وἐπιμελέομαι للعناية بالكنيسة. إبقاء الفرق يمنع اختزال الإشراف الكنسي في السيطرة، من غير نفي القياس بين المجالين.'
- issue: صياغة الفاعل غير المعيّن في سياق شروط المشرف
  choice: «إن كان أحد» مع تجنب ضمير ظاهر لا تقتضيه العربية
  alternative: التصريح بـ«رجل»، أو استعمال صياغة جمع محايدة
  rationale: τις لفظ غير معيّن، بينما السياق الأوسع يخص المشرف. العربية تسمح بحفظ عدم التعيين في اللفظ نفسه من غير طمس السياق أو إضافة تحديد غير موجود في هذه الجملة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. اختير «أهل بيته» بدل «بيته» وحدها لمنع فهم οἶκος على أنه المبنى، وحُفظ التمييز الدلالي بين التدبير المنزلي والعناية بالكنيسة. لا تستلزم الآية حواشي نصية أو معجمية في الصياغة المختارة.
