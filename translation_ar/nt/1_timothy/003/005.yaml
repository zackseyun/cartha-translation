  source_fidelity: 'المعنى العام محفوظ: الشرط والاستنتاج الاستنكاري، وتباين «تدبير» أهل البيت و«العناية» بالكنيسة، مطابقان للنص اليوناني. لكن تركيب «لا يعرف أن يدبّر» لا يبيّن بوضوح الدلالة الاصطلاحية لـ οἶδεν مع المصدر، وهي «لا يعرف كيف يدبّر»، وقد يُفهم على أنه لا يعلم حقيقة أنه يدبّر.'
  naturalness: النص فصيح وواضح إجمالًا، إلا أن «لا يعرف كيف يدبّر» أشيع وأدق في العربية المعاصرة من «لا يعرف أن يدبّر» في هذا السياق.
  terminology: «أهل بيته» ترجمة طبيعية لـ τοῦ ἰδίου οἴκου في السياق، و«يدبّر» لـ προστῆναι و«يعتني بكنيسة الله» لـ ἐπιμελήσεται وἐκκλησίας θεοῦ مناسبان، ويحافظان على التمييز بين الفعلين.
