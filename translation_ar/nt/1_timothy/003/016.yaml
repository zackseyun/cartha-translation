source:
  edition: SBLGNT
  text: καὶ ὁμολογουμένως μέγα ἐστὶν τὸ τῆς εὐσεβείας μυστήριον· ⸀Ὃς ἐφανερώθη ἐν σαρκί, ἐδικαιώθη ἐν πνεύματι, ὤφθη ἀγγέλοις, ἐκηρύχθη ἐν ἔθνεσιν, ἐπιστεύθη ἐν κόσμῳ, ἀνελήμφθη ἐν δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/016.yaml
  text: 'And undeniably[a], great is the mystery of godliness:

    He was revealed in flesh,

    was vindicated in spirit,

    was seen by angels,

    was proclaimed among the nations,

    was believed on in the world[d][c][b],

    was taken up in glory.'
translation:
  language: ar
  text: 'ولا جدال في أن سرَّ التقوى عظيم:


    هو الذي[a] ظهر في الجسد،


    وأُثبت حقُّه في الروح[b]،


    ورأته الملائكة،


    وأُعلن عنه بين الأمم[c]،


    وأُومن به في العالم،


    ورُفع في مجد[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ بعض المخطوطات: «الله ظهر في الجسد» بدلًا من «هو الذي ظهر في الجسد». أمّا النص اليوناني النقدي فيقرأ ضميرًا موصولًا مذكرًا بمعنى «الذي»، وهو ما يعكسه المتن.'
    reason: textual_variant
  - marker: b
    text: 'يمكن أيضًا أن تترجم: «أُثبت حقه بالروح» أو «أُثبت حقه في الروح القدس». فالعبارة اليونانية موجزة، وقد تشير إلى عمل الروح القدس أو إلى مجال الحياة الروحية.'
    reason: alternative_reading
  - marker: c
    text: 'يمكن أيضًا أن تترجم: «بين غير اليهود».'
    reason: lexical_alternative
  - marker: d
    text: 'يمكن أيضًا أن تترجم: «رُفع إلى المجد».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμολογουμένως
  choice: ولا جدال في أن
  rationale: ينقل معنى الأمر المُقَرّ به علنًا أو المتفق عليه، بعبارة عربية معاصرة واضحة غير متكلّفة.
- source_word: μέγα ἐστὶν
  choice: عظيم
  rationale: يحافظ على قوة الوصف، مع صياغة عربية طبيعية في الجملة الافتتاحية.
- source_word: τὸ τῆς εὐσεβείας μυστήριον
  choice: سرّ التقوى
  rationale: «السر» في الاستعمال البولسي حقيقة إلهية كانت خفية ثم أُعلنت، و«التقوى» تعبّر عن التعبد لله والحياة الموافقة له.
- source_word: Ὃς
  choice: هو الذي
  rationale: يعكس قراءة النص النقدي، وهي ضمير موصول مذكر لا لفظ «الله». وإضافة «هو» توضح بدء المقطع الاعترافي والإشارة الشخصية إلى المسيح.
- source_word: ἐφανερώθη ἐν σαρκί
  choice: ظهر في الجسد
  rationale: «ظهر» عربية واضحة تؤدي معنى الانكشاف والظهور، و«في الجسد» تشير إلى الوجود البشري المتجسد من غير شرح زائد.
- source_word: ἐδικαιώθη
  choice: تبيَّن أنه على حق
  rationale: المعنى هنا هو ثبوت الحق أو التبرئة وإظهار الاستقامة، لا التحول إلى بار؛ لذلك تتجنب الصياغة إيحاءات «جُعِل بارًا».
- source_word: ἐν πνεύματι
  choice: في الروح
  rationale: تحافظ الصياغة على إيجاز اليونانية وعلى احتمال الإشارة إلى الروح القدس أو إلى مجال الوجود الروحي، من غير حسم تفسيري.
- source_word: ὤφθη ἀγγέλοις
  choice: رأته الملائكة
  rationale: ينقل دلالة الرؤية بوضوح، ويفهم ἀγγέλοις على الملائكة السماويين في هذا السياق المسيحاني.
- source_word: ἐκηρύχθη ἐν ἔθνεσιν
  choice: نُودي به بين الأمم
  rationale: «نُودي به» تؤدي معنى الإعلان العلني، و«الأمم» أوسع من «الوثنيين» مع بقائها قابلة للدلالة على غير اليهود.
- source_word: ἐπιστεύθη ἐν κόσμῳ
  choice: أُومن به في العالم
  rationale: يحافظ المبني للمجهول على بنية العبارة وعلى كون المسيح موضوع الإيمان، بصياغة عربية موجزة.
- source_word: ἀνελήμφθη ἐν δόξῃ
  choice: رُفع في مجد
  rationale: ينقل فعل الرفع وصيغة المبني للمجهول، ويبقي حرف الجر محتملًا للدلالة على المصاحبة أو المجال.
theological_decisions:
- issue: 'الاختلاف النصي في مطلع المقطع: Ὃς أم θεός أم ὅ'
  choice: هو الذي ظهر في الجسد
  alternative: 'الله ظهر في الجسد؛ أو: الذي ظهر في الجسد بصيغة محايدة في بعض الشواهد'
  rationale: نص SBLGNT يقرأ الضمير الموصول المذكر Ὃς، ولذلك تُترجم القراءة النقدية في المتن، مع إثبات القراءة التاريخية المهمة «الله» في الحاشية بدل إدخالها في النص.
- issue: مرجع ἐν πνεύματι
  choice: في الروح
  alternative: 'بالروح؛ أو: في الروح القدس'
  rationale: العبارة اليونانية موجزة وتحتمل أن يكون الروح القدس هو الفاعل، أو أن يكون المقصود مجال الحياة الروحية. أبقى المتن هذا التوتر، وتعرض الحاشية الاحتمالات.
- issue: دلالة ἐδικαιώθη في وصف المسيح
  choice: تبيَّن أنه على حق
  alternative: 'تَبَرَّر؛ أو: أُثبت برّه'
  rationale: المقصود في السياق إظهار أنه محق وتثبيت براءته أو بره، لا القول إنه انتقل من عدم البر إلى البر.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات إيقاع اعترافي موجز، مع الحفاظ على توازي الأسطر والمبني للمجهول حيث يلائم العربية. جرى تجنب المصطلحات الطائفية والحسم التفسيري في المواضع الغامضة.
