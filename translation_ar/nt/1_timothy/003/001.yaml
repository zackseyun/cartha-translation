id: 1TI.3.1
reference: 1 Timothy 3:1
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Πιστὸς ὁ λόγος· εἴ τις ἐπισκοπῆς ὀρέγεται, καλοῦ ἔργου ἐπιθυμεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/001.yaml
  text: 'This saying is trustworthy: if anyone aspires to oversight[b][a], he desires a good work.'
translation:
  language: ar
  text: 'هذه كلمة جديرة بالثقة: إن كان أحد يطمح إلى الإشراف[a]، فهو يرغب في عمل صالح[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو «منصب المشرف»؛ وتقليديًا: «الأسقفية».'
    reason: alternative_reading
  - marker: b
    text: أو «مهمة نبيلة».
    reason: lexical_alternative
lexical_decisions:
- source_word: Πιστὸς ὁ λόγος
  choice: هذه كلمة جديرة بالثقة
  rationale: صياغة عربية طبيعية تنقل العبارة الاصطلاحية التي تقدّم قولًا موثوقًا، مع إبقاء «كلمة» مقابل λόγος دون جمود لفظي.
- source_word: εἴ τις
  choice: إن كان أحد
  rationale: تنقل أداة الشرط والضمير النكرة بمعناهما العام من غير أن تفرض على العبارة نفسها تخصيصًا بالذكر.
- source_word: ἐπισκοπῆς
  choice: الإشراف
  rationale: يحفظ المعنى الأساسي المتعلق بالمراقبة والرعاية والمسؤولية، ولا يقيّده تلقائيًا ببنية كنسية متأخرة.
- source_word: ὀρέγεται
  choice: يطمح إلى
  rationale: يعبر طبيعيًا عن التطلع المقصود والسعي إلى بلوغ المسؤولية.
- source_word: καλοῦ ἔργου
  choice: عمل صالح
  rationale: يحافظ على دلالة ἔργον بوصفه عملًا لا مجرد منزلة، وينقل καλός بمعناه الإيجابي المباشر.
- source_word: ἐπιθυμεῖ
  choice: يرغب في
  rationale: ينقل معنى الرغبة الإيجابية ويحافظ على التوازي الدلالي مع «يطمح» من غير مبالغة في شدة التعبير.
theological_decisions:
- issue: هل تُترجم ἐπισκοπῆς بمصطلح وظيفة كنسية متأخر؟
  choice: الإشراف
  alternative: منصب المشرف؛ الأسقفية
  rationale: اللفظ اليوناني يحتمل المسؤولية أو مهمة الإشراف، ولا يستلزم وحده نظامًا كنسيًا لاحقًا؛ لذا تُحفظ سعته الدلالية في المتن وتُذكر البدائل في الحاشية.
- issue: هل يُجعل εἴ τις خاصًا بالرجل؟
  choice: إن كان أحد
  alternative: إن كان رجل
  rationale: الضمير اليوناني النكرة عام في هذه العبارة؛ فلا ينبغي استيراد تخصيص جنسي من اللفظ نفسه، مع بقاء الصياغة العربية اللاحقة منسجمة نحويًا مع «أحد».
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «جديرة بالثقة» لصياغة العبارة الافتتاحية بصورة مألوفة، و«الإشراف» لتجنب تحميل النص مصطلحات طائفية أو مؤسسية متأخرة. وُضعت علامتا الحاشيتين مباشرة بعد اللفظين اللذين تشرحانهما.
