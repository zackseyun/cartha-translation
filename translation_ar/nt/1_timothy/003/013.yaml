  text: οἱ γὰρ καλῶς διακονήσαντες βαθμὸν ἑαυτοῖς καλὸν περιποιοῦνται καὶ πολλὴν παρρησίαν ἐν πίστει τῇ ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/013.yaml
  text: For those who have served well obtain for themselves a good standing and great boldness in the faith that is in Messiah Jesus[a][b][c].
translation:
  language: ar
  text: لِأَنَّ الَّذِينَ خَدَمُوا خِدْمَةً حَسَنَةً يَكْتَسِبُونَ لِأَنْفُسِهِمْ مَكَانَةً حَسَنَةً، وَجُرْأَةً كَبِيرَةً[a] فِي الْإِيمَانِ الَّذِي فِي الْمَسِيحِ يَسُوعَ[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «ثقة كبيرة»؛ فاللفظة اليونانية قد تدل على الجرأة أو الثقة أو الصراحة.
    reason: lexical_alternative
  - marker: b
    text: أو «في الأمانة التي في المسيح يسوع»؛ فاللفظة اليونانية قد تعني الإيمان أو الثقة أو الأمانة.
    reason: alternative_reading
  - marker: c
    text: اللفظة اليونانية تعني «المسيح»، وقد استُعملت هنا بوصفها لقبًا.
    reason: lexical_alternative
lexical_decisions:
- source_word: διακονήσαντες
  choice: خَدَمُوا
  rationale: الفعل يعني خدم أو قام بالخدمة، وهو يعود في السياق إلى الخدّام المذكورين، من غير أن يفرض اسم المنصب على معنى الفعل نفسه.
- source_word: καλῶς
  choice: حَسَنًا
  rationale: 'حال يصف كيفية الخدمة، وينقل المعنى المباشر: على نحو حسن أو جيد.'
- source_word: βαθμὸν ... καλὸν
  choice: مَكَانَةً حَسَنَةً
  rationale: تدل العبارة مجازًا على منزلة أو مكانة مشرفة يكتسبها المرء، لا بالضرورة على رتبة كنسية رسمية.
- source_word: περιποιοῦνται
  choice: يَكْتَسِبُونَ لِأَنْفُسِهِمْ
  rationale: يحفظ دلالة الصيغة الوسطى الانعكاسية، أي إن ثمرة الخدمة تعود إليهم.
- source_word: παρρησίαν
  choice: جُرْأَةً
  rationale: تنقل قوة اللفظ الدال على حرية الكلام والثقة الجريئة، مع إثبات «ثقة» بديلًا في الحاشية.
- source_word: πίστει
  choice: الْإِيمَانِ
  rationale: هو المقابل الأوضح هنا، مع بقاء احتمال معنى الأمانة قائمًا وإثباته في الحاشية.
- source_word: τῇ ἐν Χριστῷ Ἰησοῦ
  choice: الَّذِي فِي الْمَسِيحِ يَسُوعَ
  rationale: يحفظ ارتباط شبه الجملة بـ«الإيمان» بحسب تركيب اليونانية بدل تسطيحها إلى عبارة عامة.
- source_word: Χριστῷ
  choice: الْمَسِيحِ
  rationale: Χριστός لقب يعني المسيح الممسوح، و«المسيح» هو المقابل العربي الطبيعي الراسخ الذي يحفظ وظيفته اللقبية.
theological_decisions:
- issue: دلالة πίστις في ἐν πίστει τῇ ἐν Χριστῷ Ἰησοῦ
  choice: الإيمان
  alternative: الأمانة
  rationale: يرجح السياق معنى الإيمان المتعلق بالمسيح يسوع أو القائم فيه، لكن اللفظة اليونانية قد تدل أيضًا على الأمانة؛ لذلك لم يُلغَ الاحتمال البديل بل حُفظ في الحاشية.
- issue: طبيعة βαθμὸν καλὸν
  choice: مكانة حسنة
  alternative: درجة حسنة
  rationale: «مكانة» تعبر عن المنزلة المشرفة الناتجة من حسن الخدمة من غير الجزم بأن المقصود ترقية رسمية أو درجة كنسية محددة.
translation_notes:
  register: عربية فصحى واضحة وموقرة، مع صياغة مفهومة للقارئ المعاصر. استُخدم «خدموا» بدل تحويل الفعل إلى اسم منصب، و«مكانة» بدل «درجة» لتجنب الإيحاء غير المؤكد برتبة كنسية رسمية. وُضعت جميع علامات الحواشي في المتن.
