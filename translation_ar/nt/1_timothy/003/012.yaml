  text: διάκονοι ἔστωσαν μιᾶς γυναικὸς ἄνδρες, τέκνων καλῶς προϊστάμενοι καὶ τῶν ἰδίων οἴκων·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/012.yaml
  text: Deacons must be husbands of one wife[a], managing their children and their own households well.
translation:
  language: ar
  text: يجب أن يكون كلُّ واحدٍ من الشمامسة زوجَ امرأةٍ واحدة[a]، وأن يُحسنوا تدبير أولادهم وبيوتهم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «رجال امرأة واحدة». قد تدل العبارة على الأمانة الزوجية؛ ويفهمها بعضهم بمعنى أخص، فيرون أنها تستبعد تعدد الزوجات أو الزواج مرة أخرى.'
    reason: قراءة بديلة تحفظ الإيجاز الاصطلاحي في اليونانية وتوضح نطاق الخلاف التفسيري.
lexical_decisions:
- source_word: διάκονοι
  choice: الشمامسة
  rationale: في سياق مؤهلات الخدمة الكنسية، تدل الكلمة على أصحاب خدمة معترف بها، ولذلك استُخدم اسم الوظيفة «الشمامسة» لا اللفظ العام «الخدام».
- source_word: ἔστωσαν
  choice: يجب أن يكون
  rationale: صيغة الأمر هنا معيار إلزامي ضمن قائمة مؤهلات، وعبارة «يجب أن يكون» تنقل هذه القوة بوضوح في العربية المعاصرة.
- source_word: μιᾶς γυναικὸς ἄνδρες
  choice: كلٌّ منهم، زوجَ امرأة واحدة
  rationale: يحافظ التعبير على الإشارة الصريحة إلى الرجل وعلى معنى «امرأة واحدة»، مع إضافة «كلٌّ منهم» لمنع أن يوهم التركيب العربي أن الشمامسة جميعًا أزواج لامرأة واحدة بعينها. ولا يحسم ما إذا كان المقصود الأساسي الأمانة الزوجية أو حظر تعدد الزوجات أو الزواج مرة أخرى.
- source_word: τέκνων
  choice: أولادهم
  rationale: الضمير مفهوم من السياق ومن الموازاة مع «بيوتهم»، وإظهاره لازم لطبيعية العربية.
- source_word: καλῶς
  choice: يُحسنوا
  rationale: نُقل الظرف اليوناني بصيغة فعلية عربية طبيعية تفيد أداء التدبير على وجه حسن.
- source_word: προϊστάμενοι
  choice: تدبير
  rationale: يدل اسم الفاعل على تولي المسؤولية والإشراف؛ و«تدبير» يلائم سياق الأسرة من غير إيحاء سلطوي زائد.
- source_word: τῶν ἰδίων οἴκων
  choice: بيوتهم
  rationale: المراد بالبيوت هنا الوحدات المنزلية والأسرية لا المباني وحدها. و«بيوتهم» لفظ عربي طبيعي يتسع لهذا المعنى، بينما تُفهم دلالة الخصوص من ضمير الملكية.
theological_decisions:
- issue: تفسير عبارة μιᾶς γυναικὸς ἄνδρες ضمن مؤهلات الشمامسة
  choice: زوجَ امرأة واحدة
  alternative: رجل امرأة واحدة؛ أمينًا لزوجته؛ لم يتزوج إلا مرة واحدة
  rationale: العبارة اليونانية موجزة واصطلاحية، وتحتمل التشديد على الأمانة الزوجية أو الزواج الأحادي، ويفهمها بعضهم على أنها تستبعد الزواج مرة أخرى. أبقى النص ترجمة قريبة من الصياغة الأصلية، ووُضعت وجوه الفهم في الحاشية من غير فرض حسم مذهبي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُخدم «الشمامسة» بوصفه اسم الوظيفة الكنسية الشائع، وصيغت الجملة بصيغة إلزامية. حافظت الحاشية على الغموض الحقيقي في العبارة المتعلقة بالزواج.
