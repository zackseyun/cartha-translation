base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/007.yaml
  text: And he must also have a good testimony from those outside, so that he may not fall into reproach and the devil’s snare.
translation:
  language: ar
  text: ويجب أيضًا أن تكون له شهادة حسنة من الذين في الخارج[a]، لئلا يقع في التعيير[b] وفي فخ إبليس[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «من الغرباء». والمقصود أشخاص من خارج الجماعة المسيحية.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «في العار».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «في فخ المفتري»، إذا أُخذت كلمة διάβολος بمعناها العام؛ وقد فُهمت هنا على أنها تشير إلى إبليس.'
    reason: alternative_reading
lexical_decisions:
- source_word: δεῖ
  choice: يجب
  rationale: ينقل معنى الضرورة والإلزام في شروط الناظر، بصياغة عربية واضحة ومباشرة.
- source_word: δὲ καὶ
  choice: أيضًا
  rationale: يصل هذا الشرط بما سبقه ويُظهر إضافته إلى بقية الشروط، من غير إثقال العبارة بأداة استدراك لا يقتضيها السياق العربي.
- source_word: μαρτυρίαν καλὴν
  choice: شهادة حسنة
  rationale: يحافظ على معنى الشهادة أو الإفادة الحسنة عن الشخص، مع إبقاء الصياغة أقرب إلى اليونانية من «سمعة طيبة»، وهي ترجمة ممكنة لكنها أكثر تفسيرًا.
- source_word: ἔχειν
  choice: أن تكون له
  rationale: صياغة عربية طبيعية لمعنى الامتلاك في هذا التركيب.
- source_word: ἀπὸ τῶν ἔξωθεν
  choice: من الذين في الخارج
  rationale: يحافظ على الصورة المكانية في الأصل من دون إدخال «الكنيسة» صراحة؛ والمقصود يُبيَّن في الحاشية.
- source_word: ἵνα μὴ
  choice: لئلا
  rationale: ينقل بإيجاز ووضوح معنى الغاية أو النتيجة المنفية.
- source_word: εἰς ὀνειδισμὸν ἐμπέσῃ
  choice: يقع في التعيير
  rationale: يحافظ على استعارة الوقوع وعلى معنى اللوم العلني والإهانة الاجتماعية في ὀνειδισμός، بدل حصره في الشعور الداخلي بالخزي.
- source_word: παγίδα
  choice: فخ
  rationale: لفظ عربي واضح وطبيعي يحفظ صورة أداة الاصطياد الكامنة في الأصل.
- source_word: τοῦ διαβόλου
  choice: إبليس
  rationale: يفهم اللفظ هنا، وفق الاستعمال الغالب في العهد الجديد، اسمًا للشرير الشخصي؛ و«إبليس» تعبير عربي كتابي معروف وموجز.
theological_decisions:
- issue: دلالة τοῦ διαβόλου
  choice: إبليس، أي الشرير الشخصي
  alternative: المفتري أو النمّام على نحو عام
  rationale: غلبة استعمال διάβολος في الرسائل الرعوية وسائر العهد الجديد تشير إلى إبليس، كما يلائم السياق الانتقال من التعيير العلني إلى الخطر الروحي. ومع ذلك تُحفظ في الحاشية الإمكانية المعجمية العامة للفظ.
translation_notes:
  register: فصحى معاصرة واضحة ذات نبرة وقورة. أبقت الترجمة «شهادة حسنة» و«الذين في الخارج» قريبتي الصياغة من الأصل، واستعملت «فخ» بدل لفظ أقدم مثل «شَرَك» لتيسير الفهم العام، مع حفظ البدائل الدلالية في الحواشي.
