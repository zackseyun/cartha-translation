  yaml_path: translation/nt/1_timothy/003/010.yaml
  text: And these also must first be tested[a]; then let them serve[b], being beyond reproach.
translation:
  language: ar
  text: وهؤلاء أيضًا لِيُختَبَروا أولًا، ثم ليخدموا[a] وهم بلا لوم[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ليخدموا كشمامسة». الفعل اليوناني يعني «يخدم»، لكنه يرد هنا في سياق مؤهلات الشمامسة.'
    reason: lexical_alternative
  - marker: b
    text: أي لا تُثبت ضدهم تهمة وجيهة؛ وليس المعنى أنهم بلا خطية.
    reason: lexical_clarification
lexical_decisions:
- source_word: οὗτοι
  choice: هؤلاء أيضًا
  rationale: يحفظ اسم الإشارة وقوة الإضافة، ويرجع بحسب السياق إلى الأشخاص المرشحين للخدمة المذكورة.
- source_word: δοκιμαζέσθωσαν
  choice: لِيُختَبَروا
  rationale: ينقل صيغة الأمر المبني للمجهول ومعنى الفحص للتحقق من الأهلية.
- source_word: πρῶτον ... εἶτα
  choice: أولًا ... ثم
  rationale: يحفظ بوضوح ترتيب الاختبار قبل مباشرة الخدمة.
- source_word: διακονείτωσαν
  choice: ليخدموا
  rationale: ترجمة مباشرة للفعل الذي يعني الخدمة، مع ترك السياق يبين أن المقصود خدمة الشمامسة وعدم إدخال اسم وظيفة غير وارد صراحة في العبارة.
- source_word: ἀνέγκλητοι
  choice: بلا ملامة
  rationale: يفيد عدم وجود تهمة صحيحة تثبت عليهم، من غير أن يوحي بالعصمة من الخطأ.
- source_word: ὄντες
  choice: إن كانوا
  rationale: يصوغ الحال بصيغة شرطية عربية طبيعية تبين أن عدم الملامة شرط لمباشرة الخدمة، من غير تغيير جوهر الدلالة.
theological_decisions:
- issue: هل يُترجم διακονείτωσαν ترجمة عامة أم يُصرَّح بوظيفة الشماس؟
  choice: ليخدموا
  alternative: ليخدموا شمامسةً
  rationale: الفعل نفسه يعني «يخدم»، وسياق الفقرة يضفي عليه المعنى الوظيفي. إبقاء الترجمة فعلية يحفظ اللفظ اليوناني ولا يحجب دلالة السياق، وتوضح الحاشية الاحتمال الوظيفي.
- issue: هل يدل ἀνέγκλητοι على الكمال الخالي من الخطية؟
  choice: بلا ملامة
  alternative: لا تُوجَّه إليهم تهمة
  rationale: المقصود أهلية لا تثبت ضدها ملامة أو تهمة معتبرة، لا العصمة أو الكمال المطلق.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدمت «ليُختَبَروا» و«ليخدموا» للمحافظة على تعاقب صيغتي الأمر، وصيغت العبارة الحالية «ὄντες» بـ«إن كانوا» لتكون طبيعية وتبرز شرط الأهلية.
