base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/002.yaml
  text: Therefore an overseer must be above reproach[a], the husband of one wife, sober-minded, self-controlled, respectable, hospitable, able to teach,
translation:
  language: ar
  text: لذلك يجب أن يكون المشرف بلا لوم، زوجَ امرأةٍ واحدة[a]، متيقظًا، متعقّلًا، حسنَ السيرة، مضيافًا، قادرًا على التعليم،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «رجلَ امرأةٍ واحدة»؛ وقد تشدد العبارة على الأمانة لزوجته، لا على حالته الزوجية وحدها.'
    reason: alternative_reading
lexical_decisions:
- source_word: δεῖ
  choice: يجب
  rationale: تنقل معنى الضرورة والإلزام في سياق شروط الخدمة، لا مجرد الاستحسان.
- source_word: οὖν
  choice: لذلك
  rationale: تحفظ علاقة الاستنتاج بما سبق بعبارة عربية واضحة.
- source_word: ἐπίσκοπον
  choice: المشرف
  rationale: ترجمة وظيفية شفافة للقب اليوناني، من غير استيراد دلالات كنسية تطورت لاحقًا.
- source_word: ἀνεπίλημπτον
  choice: بلا لوم
  rationale: تفيد أن سلوكه لا يتيح أساسًا صحيحًا للاتهام، من غير أن توحي بالعصمة من الخطأ.
- source_word: μιᾶς γυναικὸς ἄνδρα
  choice: زوجَ امرأةٍ واحدة
  rationale: صياغة قريبة من اليونانية تحفظ التحديد الذكوري ولا تحسم وحدها الخلاف حول دلالة العبارة.
- source_word: νηφάλιον
  choice: متيقظًا
  rationale: تعبّر عن الاتزان واليقظة الذهنية والسلوكية، لا عن مجرد الامتناع عن الخمر.
- source_word: σώφρονα
  choice: متعقّلًا
  rationale: تنقل سلامة الحكم وضبط النفس مع تجنب تكرار معنى «متيقظًا».
- source_word: κόσμιον
  choice: محتشمًا
  rationale: تفيد الوقار وحسن السلوك والترتيب اللائق في عربية فصيحة مفهومة.
- source_word: φιλόξενον
  choice: مضيافًا
  rationale: المقابل العربي الموجز والطبيعي لمن يرحب بالضيوف والغرباء.
- source_word: διδακτικόν
  choice: قادرًا على التعليم
  rationale: توضح الكفاية والأهلية للتعليم، لا مجرد الرغبة فيه.
theological_decisions:
- issue: دلالة μιᾶς γυναικὸς ἄνδρα ضمن مؤهلات المشرف
  choice: زوجَ امرأةٍ واحدة
  alternative: رجلَ امرأةٍ واحدة؛ أو وفيًّا لزوجته
  rationale: 'العبارة موضع خلاف: فقد تشدد على الأمانة الزوجية، أو تستبعد تعدد الزوجات، أو تتصل بقيود على الزواج بعد وفاة الزوجة أو الطلاق. أبقت الترجمة الصياغة الأقرب إلى الأصل، وذكرت احتمال الأمانة الزوجية في الحاشية دون حسم التوتر التفسيري.'
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت ألفاظ وظيفية وأخلاقية مألوفة، مع الحفاظ على إيقاع قائمة المؤهلات وعلى غموض العبارة المتعلقة بالزواج.
