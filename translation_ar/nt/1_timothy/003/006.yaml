  text: He must not be a recent convert[a], so that he may not become puffed up and fall into the judgment of the devil.
translation:
  language: ar
  text: ولا يكن حديث الإيمان، لئلّا ينتفخ بالكبرياء فيقع في دينونة إبليس.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فيقع في الدينونة نفسها التي وقعت على إبليس»؛ ويحتمل أيضًا: «فيقع تحت دينونة مرتبطة بإبليس».'
    reason: alternative_reading
lexical_decisions:
- source_word: νεόφυτον
  choice: حديث الإيمان
  rationale: اللفظ يعني حرفيًا «حديث الغرس»، ويُستعمل هنا مجازًا لمن دخل الإيمان حديثًا. وعبارة «حديث الإيمان» واضحة وطبيعية في العربية الكنسية المعاصرة من غير أن توسّع المعنى إلى مجرد قلّة الخبرة.
- source_word: τυφωθεὶς
  choice: ينتفخ بالكبرياء
  rationale: يحفظ صورة الانتفاخ ويبيّن أن المقصود هو الغرور، بصياغة عربية مألوفة.
- source_word: κρίμα
  choice: دينونة
  rationale: تؤدي معنى الحكم ذي العاقبة السلبية في هذا السياق، مع إبقاء علاقة هذه الدينونة بإبليس غير محسومة.
- source_word: τοῦ διαβόλου
  choice: إبليس
  rationale: تُركت الإضافة في «دينونة إبليس» على إبهامها، إذ يمكن أن تشير إلى الدينونة الواقعة على إبليس أو إلى دينونة مرتبطة به.
- source_word: ἐμπέσῃ
  choice: يقع تحت
  rationale: تعبير عربي طبيعي عن الدخول في نطاق حكم أو دينونة، ويحافظ على حركة الوقوع التي في الفعل اليوناني.
- source_word: ἵνα μὴ
  choice: لئلّا
  rationale: صياغة فصيحة موجزة وطبيعية تؤدي معنى الغاية أو النتيجة المقصودة.
theological_decisions:
- issue: معنى العبارة εἰς κρίμα ἐμπέσῃ τοῦ διαβόλου
  choice: «فيقع تحت دينونة إبليس» مع إبقاء الإضافة محتملة الدلالة
  alternative: «فيقع في الدينونة نفسها التي وقعت على إبليس» أو «فيقع تحت دينونة مرتبطة بإبليس»
  rationale: الإضافة اليونانية τοῦ διαβόλου تحتمل أن تكون الدينونة الواقعة على إبليس، كما تحتمل علاقة أعمّ بدينونة مرتبطة به؛ لذلك لا يحسم المتن ما لم يحسمه الأصل.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدمت «حديث الإيمان» بدل الترجمة الحرفية «حديث الغرس»، وحُفظ إبهام إضافة «دينونة إبليس» مع شرحه في الحاشية.
