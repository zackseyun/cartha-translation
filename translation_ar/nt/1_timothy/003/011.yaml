  text: γυναῖκας ὡσαύτως σεμνάς, μὴ διαβόλους, νηφαλίους, πιστὰς ἐν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/011.yaml
  text: Women likewise must be dignified[a], not slanderers, sober-minded, faithful in all things.
translation:
  language: ar
  text: وكذلك يجب أن تكون النساءُ وقوراتٍ[a]، غيرَ مُفتريات، متعقّلات، أميناتٍ في كل شيء.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وكذلك يجب أن تكون الزوجات وقورات...». يمكن أن تعني الكلمة اليونانية هنا «النساء» أو «الزوجات»، ولا يقول النص صراحةً «زوجاتهم».'
    reason: alternative_reading
lexical_decisions:
- source_word: γυναῖκας
  choice: النساء
  rationale: يمكن أن تعني الكلمة اليونانية «نساء» أو «زوجات». اختيرت «النساء» في المتن لأنها لا تضيف ضمير ملكية غير موجود في الأصل، مع إثبات الاحتمال الآخر في الحاشية.
- source_word: ὡσαύτως
  choice: وكذلك
  rationale: تحافظ على الصلة البنيوية بقائمة المؤهلات السابقة، وهي عبارة عربية موجزة وطبيعية.
- source_word: σεμνάς
  choice: وقورات
  rationale: تنقل معنى الرزانة والجدارة بالاحترام والهيبة الأخلاقية، بصياغة عربية واضحة ولائقة.
- source_word: μὴ διαβόλους
  choice: غير نمّامات
  rationale: الكلمة هنا وصف لمن يطلقن كلامًا افترائيًا أو مؤذيًا، وليست لقبًا لإبليس. و«نمّامات» تعبير طبيعي في هذا السياق الأخلاقي، وإن كان الافتراء داخلًا في المعنى.
- source_word: νηφαλίους
  choice: متعقّلات
  rationale: تنقل معنى اليقظة والاتزان وضبط الذهن والسلوك، ولا تحصر اللفظ في الامتناع الحرفي عن السكر.
- source_word: πιστὰς
  choice: أمينات
  rationale: يفيد السياق الثبات والموثوقية في السلوك؛ و«أمينات» تؤدي هذا المعنى بوضوح، مع بقاء إمكان الدلالة الأوسع على الوفاء.
- source_word: ἐν πᾶσιν
  choice: في كل شيء
  rationale: تحافظ على شمول العبارة اليونانية دون تقييد مجالها.
theological_decisions:
- issue: مرجع γυναῖκας في قائمة المؤهلات
  choice: النساء
  alternative: الزوجات
  rationale: تحتمل γυνή في هذا السياق معنى «المرأة» ومعنى «الزوجة». ولا يوجد في النص ضمير صريح بمعنى «زوجاتهم»، كما أن «وكذلك» قد تشير إلى فئة موازية. لذلك تُرك المتن واسعًا وأُثبت احتمال «الزوجات» في الحاشية، من غير حسم لمسألة خدمتهن أو علاقتهن بالشمامسة.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُعمل جمع المؤنث بما يلائم سلسلة الصفات اليونانية، وحُفظ الغموض الحقيقي في هوية النساء بواسطة الحاشية.
