    reason: lexical_alternative
lexical_decisions:
- source_word: πάροινον
  choice: مُدمن للخمر
  rationale: يفيد اللفظ من يلازم الخمر أو يدمنها؛ وهذه الصياغة العربية الطبيعية تعبّر عن الصفة المستقرة، لا عن مجرد شرب الخمر.
- source_word: πλήκτην
  choice: عنيف
  rationale: المعنى الحرفي هو الضارب، لكن «عنيف» ينقل بوضوح سمة الاعتداء، مع إبقاء الدلالة الجسدية ضمن نطاق اللفظ.
- source_word: ἐπιεικῆ
  choice: حليم
  rationale: يدل اللفظ على الرفق والتسامح والاعتدال في معاملة الآخرين؛ و«حليم» موجزة وطبيعية في سياق صفات المشرف.
- source_word: ἄμαχον
  choice: مسالم
  rationale: يفيد عدم الميل إلى الخصام أو الشجار؛ و«مسالم» يصوغه بوصفه خُلُقًا إيجابيًا.
- source_word: ἀφιλάργυρον
  choice: غير محبّ للمال
  rationale: ينفي المركب اليوناني محبة المال صراحة، فحافظت الترجمة على الدافع الباطني بدل اختزاله في الجشع الظاهر.
theological_decisions: []
translation_notes:
  register: عربية فصحى حديثة، واضحة وموجزة، تحافظ على نسق قائمة الصفات وعلى المقابلة بين «عنيف» و«حليم». استُخدم النصب في «حليمًا، مسالمًا» لمواصلة البناء النحوي الذي يبدأ في الآية السابقة بوجوب أن يكون المشرف متصفًا بهذه الصفات.
