lexical_decisions:
- source_word: ἔχοντας
  choice: متمسّكين
  rationale: اسم فاعل حاضر يصف الشمامسة المذكورين في السياق السابق، ويفيد استمرار حيازتهم للإيمان وثباتهم عليه، لا مجرد امتلاكه ذهنيًا.
- source_word: τὸ μυστήριον
  choice: بسرّ
  rationale: يحافظ «سرّ» على الاستعمال البولسي لما كان خفيًا ثم أعلنه الله، من غير إضافة تفسيرية مثل «السرّ المعلَن» ليست صريحة في النص.
- source_word: τῆς πίστεως
  choice: الإيمان
  rationale: وجود أداة التعريف والسياق الكنسي يرجّحان أن المقصود مضمون الإيمان المسيحي، مع بقاء إمكان فهم العبارة على معنى الإيمان نفسه.
- source_word: ἐν καθαρᾷ συνειδήσει
  choice: بضمير طاهر
  rationale: الباء تؤدي وظيفة ἐν طبيعيًا في العربية، و«طاهر» يقابل καθαρός مباشرة ويحافظ على الصورة الأخلاقية، بينما «ضمير نقي» بديل عربي صحيح.
theological_decisions:
- issue: دلالة τῆς πίστεως
  choice: الإيمان بوصفه مضمون المعتقد المسيحي على الأرجح
  alternative: الإيمان بوصفه فعل الثقة أو التصديق
  rationale: سياق مؤهلات الشمامسة يرجّح المعنى الموضوعي، لكن الترجمة «الإيمان» لا تغلق الباب أمام التوتر الدلالي الموجود في اليونانية.
translation_notes:
  register: عربية فصحى واضحة وكريمة. اختير «متمسّكين» لإبراز الثبات المستمر، و«بضمير طاهر» لصياغة عربية طبيعية وقريبة من البنية اليونانية.
