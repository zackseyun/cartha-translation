lexical_decisions:
- source_word: ἐν
  choice: بِـ
  rationale: تفيد الباء هنا الوسيلة أو الملابسة في صلتها بما قبل هذه العبارة، وهي صياغة عربية موجزة تحافظ على ارتباطها بالسياق السابق.
- source_word: ὑποκρίσει
  choice: رِيَاءِ
  rationale: ينقل «الرياء» معنى التظاهر المخالف للحقيقة في سياق أخلاقي وديني، وهو تعبير عربي فصيح وواضح.
- source_word: ψευδολόγων
  choice: كَذَّابِينَ
  rationale: المضاف إليه الجمع يصف أشخاصًا يتصفون بالكذب؛ و«كذّابين» طبيعي ومباشر في العربية.
- source_word: κεκαυστηριασμένων
  choice: قد كُوِيَ
  rationale: يحفظ صورة الكي في الفعل اليوناني، بينما تدل «قد» مع المبني للمجهول على الحالة الناتجة عن فعل سابق، بما يلائم اسم المفعول التام.
- source_word: τὴν ἰδίαν συνείδησιν
  choice: ضَمِيرُهُمُ الخاصُّ
  rationale: يحافظ على مفرد «الضمير» وعلى معنى الملكية والتوكيد في ἰδίαν؛ والمفرد هنا توزيعي، أي ضمير كل واحد منهم.
theological_decisions:
- issue: القوة المجازية للفعل κεκαυστηριασμένων
  choice: «قد كُوِيَ ضميرهم» مع إبقاء الصورة مفتوحة الدلالة
  alternative: «وُسِمَ ضميرهم» أو «أُحرِق ضميرهم بالكي»
  rationale: قد توحي الصورة بضمير موسوم أو متبلد الحس بسبب الكي. لا يحدد النص وحده وجه الصورة تحديدًا قاطعًا، لذلك يحافظ المتن على المجاز ولا يقرر استحالة التوبة أو حكمًا عقائديًا نهائيًا.
translation_notes:
  register: عربية فصحى حديثة، موجزة ومهيبة. العبارة جزء نحوي تابع لما قبلها، ولذلك تبدأ بالباء. ضُبطت كلمات المتن جزئيًا لإزالة التباس الإعراب في تركيب موجز.
