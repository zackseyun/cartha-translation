  text: μὴ ἀμέλει τοῦ ἐν σοὶ χαρίσματος, ὃ ἐδόθη σοι διὰ προφητείας μετὰ ἐπιθέσεως τῶν χειρῶν τοῦ πρεσβυτερίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/014.yaml
  text: Do not neglect the gift that is in you[b][a], which was given to you through prophecy with the laying on of the hands of the eldership.
translation:
  language: ar
  text: لا تُهمِل الموهبة التي فيك، التي أُعطيت لك بواسطة نبوّة[b]، مع وضع جماعة الشيوخ أيديهم[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: «هيئة الشيوخ»؛ والمقصود جماعة الشيوخ بوصفها هيئة واحدة.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «بواسطة قول نبوي»؛ فقد تدل العبارة على نبوّة صاحبت منح الموهبة أو كانت وسيلةً لمنحها.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ἀμέλει
  choice: لا تُهمِل
  rationale: ينقل صيغة النهي الحاضر بوضوح، ويفيد عدم الاستمرار في إهمال ما اؤتمن عليه تيموثاوس.
- source_word: χάρισμα
  choice: الموهبة
  rationale: لفظ عربي طبيعي يدل على عطية أو قدرة ممنوحة، من غير إضافة وصف «روحية» غير مصرّح به في اليونانية.
- source_word: τοῦ ἐν σοὶ χαρίσματος
  choice: الموهبة التي فيك
  rationale: يحافظ على دلالة ἐν المكانية أو الباطنية، بدل اختزال العبارة إلى «موهبتك».
- source_word: ἐδόθη σοι
  choice: أُعطيت لك
  rationale: يحفظ المبني للمجهول ولا يصرّح بهوية المُعطي، إذ يتركها النص اليوناني ضمنية.
- source_word: διὰ προφητείας
  choice: بواسطة نبوّة
  rationale: يعكس معنى الوساطة أو الوسيلة في διά مع المضاف إليه، مع إبقاء احتمال أن تكون النبوّة قولًا نبويًا صاحب منح الموهبة أو توسّط فيه.
- source_word: μετὰ ἐπιθέσεως τῶν χειρῶν
  choice: مع وضع أيدي
  rationale: ينقل التعبير الطقسي مباشرة بصياغة عربية واضحة، ويحافظ على اقتران وضع الأيدي بمنح الموهبة.
- source_word: πρεσβυτερίου
  choice: جماعة الشيوخ
  rationale: يدل على هيئة جماعية من الشيوخ، من غير استيراد مصطلح طائفي لاحق أو الإيحاء بشيخ واحد.
theological_decisions:
- issue: هل تُخصَّص χάρισμα صراحة بأنها موهبة روحية أو كنسية؟
  choice: الموهبة
  alternative: الموهبة الروحية
  rationale: يرجّح السياق موهبة للخدمة، لكن النص يقول χάρισμα فقط؛ لذلك تحافظ الصياغة المختارة على سعة اللفظ ولا تفرض إطارًا لاهوتيًا أضيق.
- issue: كيفية نقل πρεσβυτέριον من غير تقرير نظام كنسي لاحق
  choice: جماعة الشيوخ
  alternative: هيئة الشيوخ أو مجلس الشيوخ
  rationale: تُظهر العبارة أن المقصود جماعة من الشيوخ شاركت في وضع الأيدي، وتتجنب الحمولة السياسية المحتملة في «مجلس الشيوخ» والدلالات الطائفية اللاحقة.
- issue: صلة النبوّة بمنح الموهبة
  choice: بواسطة نبوّة
  alternative: بقول نبوي
  rationale: تحافظ العبارة على دلالة الوساطة المحتملة في διά، من غير حسم ما إذا كانت النبوّة قد صاحبت المنح أو كانت وسيلته.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ووقورة. استُعملت «الموهبة» بدل «العطية» لسلامة السياق العربي، و«جماعة الشيوخ» لتوضيح المعنى الجمعي مع تجنّب المصطلحات المذهبية أو السياسية.
