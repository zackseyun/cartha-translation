  text: εἰς τοῦτο ⸀γὰρ κοπιῶμεν καὶ ⸀ὀνειδιζόμεθα, ὅτι ἠλπίκαμεν ἐπὶ θεῷ ζῶντι, ὅς ἐστιν σωτὴρ πάντων ἀνθρώπων, μάλιστα πιστῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/010.yaml
  text: For to this end we labor and are reproached[a], because we have put our hope in the living God, who is the Savior of all people[c][b], especially of believers.
translation:
  language: ar
  text: ولهذا نتعب ونُعيَّر[a]، لأننا قد وضعنا رجاءنا في الله الحي[b]، الذي هو مخلِّص جميع الناس[c]، ولا سيما المؤمنين.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «نكدّ ونُشتم».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «علّقنا رجاءنا بالله الحي».'
    reason: lexical_alternative
  - marker: c
    text: 'نُقلت عبارة «مخلِّص جميع الناس، ولا سيما المؤمنين» كما وردت. ويختلف المفسرون: هل تؤكد كلمة «مخلِّص» هنا عناية الله الحافظة لجميع الناس، أم تدبيره الخلاصي للجميع، أم الخلاص الذي يناله المؤمنون على نحو خاص؟'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς τοῦτο
  choice: فلأجل هذا
  rationale: تنقل العبارة معنى الغاية المرتبط بما سبق، بصياغة عربية واضحة وطبيعية.
- source_word: γὰρ
  choice: فـ
  rationale: تفيد تعليل الكلام السابق وربطه بهذه الجملة دون إثقال الأسلوب.
- source_word: κοπιῶμεν
  choice: نتعب
  rationale: الفعل يدل على بذل جهد شاق، و«نتعب» واضح ويحفظ معنى الكدّ.
- source_word: ὀνειδιζόμεθα
  choice: نُعيَّر
  rationale: يحفظ المبني للمجهول ودلالة التعرض للتوبيخ والعار اللفظي.
- source_word: ἠλπίκαμεν ἐπὶ
  choice: قد وضعنا رجاءنا في
  rationale: تعكس صيغة التام اليونانية فعلًا تمّ وله أثر مستمر، في رجاء ثابت بالله.
- source_word: θεῷ ζῶντι
  choice: الله الحي
  rationale: تعبير كتابي عربي مألوف ومباشر يطابق تركيب الأصل.
- source_word: σωτὴρ
  choice: مخلِّص
  rationale: يحفظ الوزن اللاهوتي المعروف للكلمة من غير حصر معناها في الحفظ الزمني أو النجاة وحدهما.
- source_word: πάντων ἀνθρώπων
  choice: جميع الناس
  rationale: ينقل الإحالة العامة إلى البشر كافة بلغة عربية طبيعية جامعة.
- source_word: μάλιστα
  choice: ولا سيما
  rationale: تنقل معنى «خصوصًا/بالأخص» وتحفظ التوتر بين شمول جميع الناس والعلاقة المميزة بالمؤمنين.
- source_word: πιστῶν
  choice: المؤمنين
  rationale: اللفظ الأنسب في السياق لمن يتصفون بالإيمان، وهو واضح في العربية المعاصرة.
theological_decisions:
- issue: معنى «مخلِّص جميع الناس، ولا سيما المؤمنين»
  choice: الإبقاء على شمول «جميع الناس» وعلى خصوصية «المؤمنين» كما وردتا، دون تفسير إحداهما بما يلغي الأخرى.
  alternative: فهم «مخلِّص» بمعنى الحافظ لجميع الناس والمخلِّص فدائيًا للمؤمنين، أو فهم العبارة على أنها تقرر خلاص الجميع، أو جعل «جميع الناس» تعني جميع أصناف الناس.
  rationale: النص اليوناني يجمع صراحة بين العموم والخصوص، لذلك تحفظ الترجمة هذا التوتر اللاهوتي ولا تحسمه لمصلحة قراءة مذهبية بعينها.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «فلأجل هذا» لإبراز الغاية، و«ولا سيما» للحفاظ على قوة μάλιστα من غير إزالة الغموض اللاهوتي المقصود في العبارة.
