  yaml_path: translation/nt/1_timothy/004/015.yaml
  text: Practice these things; be in them[a], so that your progress may be evident to all.
translation:
  language: ar
  text: اهتمَّ بهذه الأمور، وكن منغمسًا فيها[a]، لكي يكون تقدُّمك ظاهرًا للجميع.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «كن في هذه الأمور»، أي انخرط فيها انخراطًا كاملًا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: هذه الأمور
  rationale: اسم الإشارة للجمع يعود إلى الوصايا السابقة، و«هذه الأمور» تعبير عربي طبيعي يحافظ على اتساع المرجع.
- source_word: μελέτα
  choice: اهتمَّ
  rationale: الفعل يدل هنا على العناية المستمرة والممارسة الجادّة، لا على التأمل الذهني وحده؛ و«اهتمَّ» واضح وطبيعي في السياق الرعوي.
- source_word: ἐν τούτοις ἴσθι
  choice: كن منغمسًا فيها
  rationale: العبارة حرفيًا «كن في هذه الأمور»، وهي تعبّر عن الانخراط الكامل فيها. اختير التعبير الاصطلاحي الواضح، مع إثبات الصياغة الحرفية في الحاشية.
- source_word: ἵνα
  choice: لكي
  rationale: تحافظ على دلالة الغاية، مع احتمال النتيجة الملازم للسياق.
- source_word: σου ἡ προκοπή
  choice: تقدُّمك
  rationale: «التقدُّم» ينقل معنى النمو أو الارتقاء من غير حصره في النضج الروحي أو الكفاءة الخدمية وحدهما.
- source_word: φανερὰ ᾖ
  choice: يكون ... ظاهرًا
  rationale: ينقل التركيب الوصفي مع فعل الكينونة، ويعبّر بوضوح عن إمكان ملاحظة التقدّم علنًا.
- source_word: πᾶσιν
  choice: للجميع
  rationale: مقابل موجز وطبيعي للداتيف الجمع، ويشير إلى جميع من هم في نطاق النظر.
theological_decisions:
- issue: نطاق تقدُّم تيموثاوس الظاهر
  choice: الإبقاء على «تقدُّمك» بمعناها الواسع، شاملاً التقدّم الملحوظ في الواجبات المذكورة في السياق.
  alternative: حصره في النمو الروحي وحده، أو في الفاعلية الخدمية وحدها.
  rationale: لفظة προκοπή والسياق المحيط يشملان التعليم والسلوك والمواظبة؛ لذلك لا يضيّق النص ما أبقاه اليوناني واسعًا.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «كن منغمسًا فيها» بدل النقل الحرفي غير المألوف «كن فيها»، مع حفظ الصورة الأصلية في الحاشية.
