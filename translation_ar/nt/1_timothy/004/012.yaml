  text: μηδείς σου τῆς νεότητος καταφρονείτω, ἀλλὰ τύπος γίνου τῶν πιστῶν ἐν λόγῳ, ἐν ἀναστροφῇ, ἐν ⸀ἀγάπῃ, ἐν πίστει, ἐν ἁγνείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/012.yaml
  text: Let no one look down on your youth[a], but be an example for the believers in speech, in conduct, in love, in faith, in purity.
translation:
  language: ar
  text: لا يَحتقرْ أحدٌ صِغَرَ سنِّك، بل كُنْ قدوةً للمؤمنين في الكلام، وفي السلوك، وفي المحبة، وفي الإيمان[a]، وفي الطهارة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الأمانة». يمكن أن تدل الكلمة اليونانية في هذا السياق على الإيمان أو الأمانة.
    reason: alternative_reading
lexical_decisions:
- source_word: μηδείς ... καταφρονείτω
  choice: لا يَحتقرْ أحدٌ
  rationale: صياغة نهي عربية واضحة تحفظ قوة الأمر في اليونانية. و«يحتقر» ينقل معنى النظر إلى الشخص بازدراء بسبب صغر سنه.
- source_word: σου τῆς νεότητος
  choice: حداثةَ سنِّك
  rationale: تعبير عربي طبيعي يوضح أن المقصود صغر السن، مع إبقاء المخاطَب المفرد.
- source_word: ἀλλὰ τύπος γίνου
  choice: بل كُنْ قدوةً
  rationale: «قدوة» تنقل معنى النموذج الذي يُحتذى، و«كن» تؤدي صيغة الأمر بصورة موجزة وطبيعية.
- source_word: τῶν πιστῶν
  choice: للمؤمنين
  rationale: يفهم التركيب هنا على أن تيموثاوس ينبغي أن يكون قدوة لجماعة المؤمنين.
- source_word: ἐν λόγῳ
  choice: في الكلام
  rationale: يشير λόγος في هذه القائمة إلى ما يقوله الشخص وطريقة كلامه.
- source_word: ἐν ἀναστροφῇ
  choice: في السلوك
  rationale: «السلوك» تعبير عربي مألوف لمعنى التصرف وطريقة الحياة.
- source_word: ἐν ἀγάπῃ
  choice: في المحبة
  rationale: يحفظ المعنى المباشر لـἀγάπη ويلائم نسق قائمة الفضائل.
- source_word: ἐν πίστει
  choice: في الإيمان
  rationale: «الإيمان» هو المقابل الأساسي لـπίστις ويحفظ إمكان دلالته على الثقة أو الإيمان، مع إثبات احتمال «الأمانة» في الحاشية.
- source_word: ἐν ἁγνείᾳ
  choice: في الطهارة
  rationale: «الطهارة» تحفظ الدلالة الأخلاقية الواسعة للكلمة من غير حصرها صراحة في العفة الجنسية.
theological_decisions:
- issue: دلالة πίστις في قائمة الفضائل
  choice: الإيمان
  alternative: الأمانة
  rationale: السياق يحتمل الإيمان بوصفه ثقةً بالله، كما يحتمل الأمانة بوصفها صفة عملية. اختير «الإيمان» في المتن، مع إبقاء الاحتمال الآخر في الحاشية بدل حسم الغموض.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حوفظ على التوازي المتكرر في «في...» لإبراز بنية قائمة الفضائل في الأصل، واستُعمل «حداثة سنك» بدل «شبابك» لتوضيح أن الاعتراض متعلق بصغر العمر.
