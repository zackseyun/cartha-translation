  rationale: استُبدلت «ثابر على» بـ«اثبت على» لتقريب دلالة ἐπίμενε αὐτοῖς، وهي الاستمرار الراسخ في ما سبق ذكره، مع الحفاظ على مرجع الضمير الجمعي في «هذه الأمور». وأعيدت صياغة الجملة التعليلية لتكون عربية أكثر سلاسة مع إبقاء علاقة الوسيلة في τοῦτο ποιῶν. كما نُقلت علامة الحاشية الخاصة بـσώσεις إلى نهاية الجملة التي تتضمن الفعل المقصود.
