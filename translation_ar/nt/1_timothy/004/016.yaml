  text: ἔπεχε σεαυτῷ καὶ τῇ διδασκαλίᾳ· ἐπίμενε αὐτοῖς· τοῦτο γὰρ ποιῶν καὶ σεαυτὸν σώσεις καὶ τοὺς ἀκούοντάς σου.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/016.yaml
  text: Pay close attention to yourself and to the teaching[a]; persist in these things[b]. For by doing this you will save both yourself and those who listen to you.
translation:
  language: ar
  text: انتبه جيدًا إلى نفسك وإلى التعليم، واثبت على هذه الأمور[a]؛ فإنك، بفعلك هذا، ستخلّص نفسك والذين يسمعونك أيضًا.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو «داوم عليها»؛ حرفيًا: «اثبت فيها» أو «استمر فيها».'
    reason: lexical_alternative
  - marker: b
    text: أو «ستحفظ». يمكن للفعل اليوناني أن يدل، بحسب السياق، على الإنقاذ أو الحفظ أو الخلاص.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεχε
  choice: انتبه جيدًا
  rationale: يفيد فعل الأمر انتباهًا متواصلًا ودقيقًا، لا مجرد التفات عابر؛ وهذه الصياغة عربية طبيعية وتحفظ قوة الوصية.
- source_word: σεαυτῷ
  choice: إلى نفسك
  rationale: ضمير انعكاسي في حالة المجرور يدل على ما ينبغي توجيه الانتباه إليه.
- source_word: τῇ διδασκαλίᾳ
  choice: إلى التعليم
  rationale: يمكن أن تشير الكلمة إلى فعل التعليم أو مضمونه. و«التعليم» واضحة وغير مثقلة بالمصطلحات، مع إبقاء هذا الاتساع الدلالي.
- source_word: ἐπίμενε
  choice: ثابر
  rationale: يفيد الأمر الاستمرار الراسخ مع المواظبة، وهو ما تؤديه «ثابر» بإيجاز وقوة.
- source_word: αὐτοῖς
  choice: على هذه الأمور
  rationale: الضمير اليوناني بصيغة الجمع يعود طبيعيًا إلى الشؤون المذكورة في الوصية السابقة. والتعبير يوضح المرجع في العربية من غير حصره بصورة مصطنعة.
- source_word: τοῦτο γὰρ ποιῶν
  choice: لأنك إذ تفعل هذا
  rationale: تحفظ الصياغة علاقة التعليل، وتبقي اسم الفاعل اليوناني محتملًا لمعنى الوسيلة أو الظرف المصاحب.
- source_word: σώσεις
  choice: ستخلّص
  rationale: تحفظ اللفظة الثقل اللاهوتي للفعل اليوناني، ولا تختزله في مجرد الحفظ الزمني، مع بيان اتساعه الدلالي في الحاشية.
- source_word: τοὺς ἀκούοντάς σου
  choice: الذين يسمعونك
  rationale: تنقل اسم الفاعل الحاضر بصورة عربية طبيعية، وتحفظ معنى الاستماع المستمر إلى تعليم تيموثاوس.
theological_decisions:
- issue: دلالة «ستخلّص» في وصية رعوية
  choice: إبقاء «ستخلّص» في المتن من غير قصرها على الخلاص الأخروي وحده أو على الحفظ العملي وحده.
  alternative: «ستحفظ» لإبراز السلامة أو الحماية الروحية والعملية.
  rationale: يربط النص مثابرة تيموثاوس في حياته وتعليمه بخلاصه وخلاص سامعيه. ولا يشرح النص هنا كيفية هذه العلاقة ولا ينسب الخلاص إلى استحقاق ذاتي؛ لذلك تحافظ الترجمة على قوة العبارة وتوترها اللاهوتي من غير إضافة تفسير مذهبي.
translation_notes:
  register: لغة عربية فصحى معاصرة واضحة ووقورة. استُخدمت «التعليم» بدل «العقيدة» لتجنب الاصطلاح الأثقل، و«ثابر» لإظهار الاستمرار الراسخ. وُضعت علامتا الحاشيتين في المتن عند موضعي الغموض المعجمي الفعليين.
