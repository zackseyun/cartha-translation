lexical_decisions:
- source_word: Παράγγελλε
  choice: أوصِ
  rationale: فعل أمر مضارع للمفرد، يفيد الاستمرار في إصدار توجيه ذي سلطة. «أوصِ» يحفظ قوة التكليف والتوجيه في سياق رعوي، من غير أن يوحي بالضرورة بأمر قسري.
- source_word: ταῦτα
  choice: بهذه الأمور
  rationale: اسم إشارة محايد جمع يعود طبيعيًا إلى التعاليم والتوجيهات السابقة، وتؤدي «هذه الأمور» معنى الجمع بوضوح.
- source_word: καὶ
  choice: و
  rationale: حرف عطف بسيط يصل بين فعلي الأمر.
- source_word: δίδασκε
  choice: علِّمها
  rationale: فعل أمر مضارع يفيد مواصلة التعليم. أُظهر المفعول المفهوم عائدًا إلى «هذه الأمور» بصيغة «ها» ليكون التعبير العربي طبيعيًا وموجزًا.
theological_decisions:
- issue: قوة السلطة الرعوية التي يدل عليها παραγγέλλω
  choice: أوصِ بهذه الأمور
  alternative: مُرْ بهذه الأمور
  rationale: «أوصِ» تنقل توجيهًا ملزمًا ذا سلطة في العربية المعاصرة، مع تجنب إيحاء «مُرْ بهذه الأمور» غير الطبيعي أو القسري. ولأن اللفظ اليوناني يحتمل في السياق معنى الأمر الأقوى، أُثبت البديل في الحاشية حفظًا للمدى الدلالي.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة وذات نبرة توجيهية لائقة. حُفظ توازي فعلي الأمر، وأُبقيت دلالة الاستمرار ضمن صيغة الأمر والسياق بدل إضافة «داوم على» التي توسع النص.
