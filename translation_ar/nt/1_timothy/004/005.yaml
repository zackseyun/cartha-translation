  text: ἁγιάζεται γὰρ διὰ λόγου θεοῦ καὶ ἐντεύξεως.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/005.yaml
  text: for it is sanctified through the word of God and prayer[a][b].
translation:
  language: ar
  text: لأنه يُقدَّس بكلمة الله والصلاة[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يُجعل مقدسًا».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «الابتهال» أو «الالتماس» بدلًا من «الصلاة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁγιάζεται
  choice: يُقدَّس
  rationale: فعل مضارع مبني للمجهول، ومرجعه الطعام المذكور في السياق السابق. يحافظ «يُقدَّس» على دلالة التخصيص لله أو جعله مقدسًا من غير أن يحصرها في التطهير الأخلاقي.
- source_word: γὰρ
  choice: لأنه
  rationale: أداة تعليل تبيّن سبب قبول ما خلقه الله عند تناوله بالشكر، وصيغة «لأنه» طبيعية وواضحة في العربية.
- source_word: διὰ
  choice: بـ
  rationale: تدل διά مع المضاف إليه هنا على الوسيلة؛ والباء العربية تؤدي هذه الدلالة بإيجاز وطبيعية.
- source_word: λόγου θεοῦ
  choice: بكلمة الله
  rationale: ترجمة مباشرة للتركيب، مع إبقاء المقصود من «كلمة الله» مفتوحًا كما في الأصل، من غير حصره في تفسير بعينه.
- source_word: ἐντεύξεως
  choice: الصلاة
  rationale: يمكن أن تدل الكلمة على الابتهال أو الالتماس، لكن «الصلاة» أنسب للسياق الذي يتحدث عن تناول الطعام بالشكر، مع إثبات الدلالات الأخص في الحاشية.
theological_decisions:
- issue: مدى دلالة التقديس في السياق
  choice: 'الإبقاء على لغة التقديس: «يُقدَّس»'
  alternative: «يُخصَّص للاستعمال المقبول» أو «يُجعل مقدسًا»
  rationale: السياق المباشر يتناول الطعام الذي يُقبَل بالشكر، لكن اللفظ اليوناني نفسه يحمل معنى التقديس. لذلك تُحفظ عبارته من غير إدخال حكم أسراري أو خلاصي، ويُترك للسياق تحديد نوع التقديس.
