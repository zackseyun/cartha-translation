reference: 1 Timothy 4:6
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Ταῦτα ὑποτιθέμενος τοῖς ἀδελφοῖς καλὸς ἔσῃ διάκονος ⸂Χριστοῦ Ἰησοῦ⸃, ἐντρεφόμενος τοῖς λόγοις τῆς πίστεως καὶ τῆς καλῆς διδασκαλίας ᾗ παρηκολούθηκας,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/006.yaml
  text: By putting these things before the brothers[a], you will be a good servant of Messiah Jesus[c][b], being nourished by the words of the faith and of the good teaching that you have followed.
translation:
  language: ar
  text: إذا عرضتَ هذه الأمور على الإخوة[a]، فستكون خادمًا صالحًا للمسيح يسوع[b]، متغذّيًا بكلمات الإيمان[c] والتعليم الحسن الذي اتبعتَه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: قد يُراد بـ«الإخوة» هنا جماعة المؤمنين عمومًا، بما فيها النساء، بحسب السياق.
    reason: cultural_note
  - marker: b
    text: 'في بعض الشواهد يَرِد ترتيب الاسمين: «يسوع المسيح».'
    reason: textual_variant
  - marker: c
    text: يمكن أن تُفهم العبارة أيضًا بمعنى «كلمات إيمان»؛ غير أن «الإيمان» هنا يُرجَّح أن يشير إلى مضمون المعتقد المسيحي المعروف.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα ὑποτιθέμενος
  choice: إذا عرضتَ هذه الأمور على
  rationale: يفيد الفعل وضع الأمور أمام الآخرين، أي عرضها عليهم وتذكيرهم بها. وصيغة الشرط العربية تنقل بوضوح علاقة اسم الفاعل بالفعل الرئيس من غير أن تفقد المعنى العملي.
- source_word: τοῖς ἀδελφοῖς
  choice: الإخوة
  rationale: يحافظ على صيغة الجمع المذكر في اليونانية، مع بيان إمكان شمول جماعة المؤمنين كلها في الحاشية.
- source_word: καλὸς ... διάκονος
  choice: خادمًا صالحًا
  rationale: διάκονος هنا وصف لوظيفة الخدمة، ولا يدل بوضوح على رتبة كنسية رسمية؛ و«صالح» مقابل طبيعي ومباشر لـκαλός.
- source_word: Χριστοῦ Ἰησοῦ
  choice: المسيح يسوع
  rationale: «المسيح» هو المقابل العربي الراسخ للقب Χριστός، ويحفظ دلالته اللقبية، مع نقل اسم Ἰησοῦ بصورته العربية المألوفة «يسوع».
- source_word: ἐντρεφόμενος
  choice: متغذّيًا
  rationale: يحفظ استعارة التغذي والتنشئة المستمرة في النص، بدل اختزالها في معنى التدريب وحده.
- source_word: τοῖς λόγοις τῆς πίστεως
  choice: بكلمات الإيمان
  rationale: يحافظ على λόγοις بوصفها «كلمات» وعلى πίστις بوصفها «الإيمان»؛ والسياق يرجح أن المقصود مضمون الإيمان المعترف به.
- source_word: τῆς καλῆς διδασκαλίας
  choice: التعليم الحسن
  rationale: ترجمة مباشرة وواضحة لـδιδασκαλία وκαλή، من غير استبدال «الحسن» بوصف تفسيري مثل «السليم».
- source_word: ᾗ παρηκολούθηκας
  choice: الذي اتبعتَه
  rationale: الضمير اليوناني المفرد المؤنث يعود على الأرجح إلى «التعليم»؛ وصيغته العربية تتبع جنس الاسم العربي. و«اتبعتَه» تنقل معنى الملازمة والاتباع دون تضييق دلالته.
theological_decisions:
- issue: دلالة Χριστός
  choice: المسيح يسوع
  alternative: يسوع المسيح بحسب اختلاف ترتيب الكلمتين في بعض الشواهد
  rationale: يحفظ النص الرئيس ترتيب SBLGNT والدلالة اللقبية لكلمة Χριστός، بينما تُذكر قراءة الترتيب البديل في الحاشية بوصفها مسألة نصية لا عقائدية.
- issue: مدلول τοῖς ἀδελφοῖς من جهة الشمول
  choice: الإخوة
  alternative: الإخوة والأخوات، أي المؤمنون عمومًا
  rationale: اختيرت الصيغة المطابقة نحويًا للأصل، مع عدم حسم نطاقها الاجتماعي الضمني، ولذلك وُضح احتمال الشمول في الحاشية.
- issue: معنى πίστις في العبارة
  choice: الإيمان
  alternative: إيمان
  rationale: أداة التعريف والسياق المقترن بالتعليم يرجحان الإشارة إلى مضمون الإيمان المسيحي، مع إبقاء إمكان قراءة العبارة على نحو أقل اصطلاحية في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «إذا... فستكون» لنقل العلاقة المنطقية بين اسم الفاعل والفعل الرئيس بصورة طبيعية، وحُفظت استعارتا عرض الأمور والتغذي بالكلمات.
