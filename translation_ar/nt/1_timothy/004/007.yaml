translation:
  language: ar
  text: أمّا الخرافات غير المقدّسة الشبيهة بحكايات العجائز[a]، فارفضها، ودرِّب نفسك على التقوى.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًّا: «خرافات تتّسم بما يُنسب إلى النساء المسنّات»؛ وهو تعبير ازدرائي. ويمكن ترجمتها اصطلاحيًّا: «حكايات العجائز».'
    reason: lexical_alternative
lexical_decisions:
- source_word: βεβήλους
  choice: غير المقدّسة
  rationale: تنقل المقابلة بين ما هو مقدّس وما هو خارج دائرة القداسة، من غير أن توحي بالضرورة بالإلحاد أو بالنجاسة الطقسية.
- source_word: γραώδεις
  choice: التي هي من قبيل حكايات العجائز
  rationale: صياغة عربية مفهومة تحفظ الصورة الازدرائية المرتبطة في اليونانية بما يُعَدّ من خصائص النساء المسنّات، وتتجنب نحت صفة عربية غريبة مثل «عجائزية».
- source_word: μύθους
  choice: الخرافات
  rationale: «الخرافات» لفظ عربي طبيعي للقصص المختلقة أو الادعاءات القصصية غير الموثوقة في هذا السياق.
- source_word: παραιτοῦ
  choice: فارفضها
  rationale: الأمر اليوناني يطلب الامتناع عنها ورفضها؛ و«ارفض» موجزة وقوية من غير توسع تفسيري.
- source_word: γύμναζε
  choice: درِّب
  rationale: تحفظ صورة التمرين والتدريب التي يحملها الفعل اليوناني، وتأتي طبيعية في العربية.
- source_word: σεαυτόν
  choice: نفسك
  rationale: تنقل ضمير الانعكاس الذي يجعل تيموثاوس نفسه موضوع التدريب.
- source_word: πρὸς εὐσέβειαν
  choice: على التقوى
  rationale: تفيد «على» مع فعل التدريب الغاية المقصودة، و«التقوى» تؤدي معنى الحياة المتجهة إلى الله والموقرة له.
- source_word: δὲ ... δὲ
  choice: أمّا ... و
  rationale: «أمّا» تبرز الانتقال التقابلي من السياق السابق، والواو تصل الأمر الإيجابي بالأمر السلبي بصورة عربية سلسة.
theological_decisions:
- issue: نقل العبارة الازدرائية γραώδεις μύθους
  choice: التي هي من قبيل حكايات العجائز
  alternative: الخرافات السخيفة؛ حكايات العجائز
  rationale: يحافظ الاختيار على الصورة الثقافية الحادة في الأصل بدل تلطيفها إلى «السخيفة»، لكنه يصوغها بعبارة عربية واضحة، مع بيان حرفية التعبير وقوته الازدرائية في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُخدمت «غير المقدّسة» بدل «الدنسة» لتجنب إيحاء النجاسة الطقسية، و«درِّب نفسك» للحفاظ على استعارة التدريب البدني.
