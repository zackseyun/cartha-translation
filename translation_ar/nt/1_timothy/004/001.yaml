  source_fidelity: 'المعنى الأساسي منقول بأمانة: القول الصريح للروح، والأزمنة اللاحقة، والابتعاد عن الإيمان، والالتفات إلى الأرواح المضللة وتعاليم الشياطين. لكن «إذ يصغون» أضعف قليلًا من προσέχοντες التي تفيد توجيه الانتباه والإنصات المنقاد، و«بوضوح» أنسب في العربية المعاصرة لسياق ῥητῶς.'
