id: 1TI.4.1
reference: 1 Timothy 4:1
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Τὸ δὲ πνεῦμα ῥητῶς λέγει ὅτι ἐν ὑστέροις καιροῖς ἀποστήσονταί τινες τῆς πίστεως, προσέχοντες πνεύμασι πλάνοις καὶ διδασκαλίαις δαιμονίων
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/001.yaml
  text: The Spirit explicitly says that in later times some will depart from the faith[a], paying attention to deceitful spirits and teachings of demons[c][b],
translation:
  language: ar
  text: والروح يقول بوضوح إنه في أزمنة لاحقة[a] سيبتعد بعض الناس عن الإيمان[b]، منصتين إلى أرواح مُضِلّة[c] وتعاليم شياطين.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «في الأزمنة الأخيرة».
    reason: lexical_alternative
  - marker: b
    text: أو «سيرتدّ بعض الناس عن الإيمان».
    reason: lexical_alternative
  - marker: c
    text: أو «أرواح خادعة».
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὸ ... πνεῦμα
  choice: الروح
  rationale: وجود أداة التعريف والسياق النبوي في الرسالة يرجّحان أن المقصود هو الروح القدس، من غير إضافة وصف غير مذكور صراحةً في النص.
- source_word: δὲ
  choice: أمّا
  rationale: تفيد انتقالًا لطيفًا في مجرى الكلام، وتؤديه «أمّا» بالعربية من غير أن تفرض معنى زمنيًا أو تضادًا قويًا.
- source_word: ῥητῶς
  choice: صراحةً
  rationale: تنقل معنى القول الواضح الصريح بعبارة عربية معاصرة وطبيعية.
- source_word: λέγει
  choice: يقول
  rationale: يحافظ على زمن المضارع وعلى صيغة الكلام النبوي المباشر.
- source_word: ἐν ὑστέροις καιροῖς
  choice: في أزمنة لاحقة
  rationale: تشير العبارة إلى أزمنة تأتي بعد زمن الكاتب، ولا تحصرها بالضرورة في النهاية الأخروية وحدها.
- source_word: ἀποστήσονταί
  choice: سيبتعد
  rationale: ينقل معنى الانفصال أو الانسحاب من غير تحميل اللفظ مسبقًا صياغة عقدية أشد؛ وأُثبت «سيرتدّون» بديلًا ممكنًا في الحاشية.
- source_word: τινες
  choice: بعض الناس
  rationale: تعبير عربي واضح وطبيعي عن الضمير اليوناني الدال على جماعة غير محددة.
- source_word: τῆς πίστεως
  choice: الإيمان
  rationale: السياق وأداة التعريف يرجحان الإشارة إلى الإيمان بوصفه مضمون الاعتقاد، مع بقاء العبارة العربية غير مثقلة بتفسير مذهبي زائد.
- source_word: προσέχοντες
  choice: إذ يصغون إلى
  rationale: يبين ارتباط ابتعادهم بإعارتهم الانتباه لهذه الأرواح والتعاليم، بصياغة عربية سلسة.
- source_word: πνεύμασι πλάνοις
  choice: أرواح مُضِلّة
  rationale: تؤدي معنى أرواح تقود الآخرين إلى الضلال؛ و«خادعة» بديل دلالي معتبر مثبت في الحاشية.
- source_word: διδασκαλίαις δαιμονίων
  choice: تعاليم شياطين
  rationale: تحافظ على تركيب الإضافة الذي يمكن أن يدل على مصدر هذه التعاليم أو ارتباطها بالشياطين، من غير حسم زائد.
theological_decisions:
- issue: مرجع «الروح»
  choice: الروح القدس
  alternative: روح نبوية أو الروح البشرية
  rationale: السياق الرسولي والقول النبوي الصريح يرجحان أن المتكلم هو الروح القدس، لكن الترجمة تلتزم لفظ «الروح» كما في الأصل ولا تضيف «القدس» إلى المتن.
- issue: دلالة «الإيمان»
  choice: الإيمان بوصفه مضمون الاعتقاد المسيحي
  alternative: الإيمان الشخصي أو الأمانة
  rationale: أداة التعريف وسياق التحذير من التعاليم المضللة يرجحان المعنى الموضوعي، من غير إدخال حكم مذهبي في إمكان الارتداد أو طبيعته.
- issue: علاقة «تعاليم» بـ«شياطين»
  choice: إضافة تحتمل المصدر أو الارتباط
  alternative: تعاليم تتناول الشياطين موضوعًا
  rationale: السياق يرجح أنها تعاليم ناشئة عن الشياطين أو متصلة بها، وصيغة «تعاليم شياطين» تحفظ إيجاز الأصل ولا توسع التفسير.
translation_notes:
  register: العربية فصحى حديثة واضحة ووقورة. استُخدمت «أمّا» للانتقال الخطابي، و«إذ يصغون» لبيان الصلة بين الابتعاد والإصغاء، مع تجنب المصطلحات المذهبية المتخصصة والحفاظ على إمكانات الألفاظ اليونانية في الحواشي.
