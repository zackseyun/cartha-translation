  text: κωλυόντων γαμεῖν, ἀπέχεσθαι βρωμάτων ἃ ὁ θεὸς ἔκτισεν εἰς μετάλημψιν μετὰ εὐχαριστίας τοῖς πιστοῖς καὶ ἐπεγνωκόσι τὴν ἀλήθειαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/003.yaml
  text: forbidding marriage and requiring abstinence from foods that God created to be received with thanksgiving by those who believe and have come to know the truth[a].
translation:
  language: ar
  text: يمنعون الزواج، ويفرضون الامتناع عن أطعمة خلقها الله لكي يتناولها بالشكر المؤمنون الذين عرفوا الحق.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'وحرفيًا بصورة أقرب: «يمنعون أن يتزوجوا، وأن يمتنعوا عن أطعمة». وقد أوضح المتن أن المعلّمين الكذبة كانوا يفرضون الامتناع عن بعض الأطعمة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κωλυόντων
  choice: يمنعون
  rationale: اسم فاعل مضارع يواصل وصف المعلّمين المذكورين سابقًا، و«يمنعون» تعبير عربي مباشر وطبيعي.
- source_word: γαμεῖν
  choice: الزواج
  rationale: المصدر اليوناني يعني «أن يتزوجوا»، وصياغة «يمنعون الزواج» عربية موجزة وتحفظ معنى الحظر.
- source_word: ἀπέχεσθαι
  choice: يفرضون الامتناع
  rationale: المعنى المعجمي هو «الامتناع»، أمّا قوة الإلزام فمفهومة من تركيب المنع؛ وقد صُرّح بها لتستقيم العبارة العربية ويتضح أن هؤلاء يوجبون الامتناع.
- source_word: βρωμάτων
  choice: عن أطعمة
  rationale: تحفظ جمع الاسم اليوناني وتدل على أصناف من الطعام دون أن توحي بأن المقصود الطعام كله.
- source_word: ἃ
  choice: خلقها
  rationale: أُدمج ضمير الوصل في جملة الصلة العربية، وضمير المؤنث المفرد يلائم جمع غير العاقل «أطعمة».
- source_word: ἔκτισεν
  choice: خلقها
  rationale: «خلق» يحفظ دلالة الخلق الواضحة في κτίζω أفضل من لفظ عام مثل «صنع».
- source_word: εἰς μετάλημψιν
  choice: لكي يتناولها
  rationale: يبيّن غاية الخلق في هذا السياق، و«يتناولها» تعبير عربي طبيعي عن الاشتراك في الطعام وأكله.
- source_word: μετὰ εὐχαριστίας
  choice: بالشكر
  rationale: ينقل معنى تناول الطعام مصحوبًا بشكر الله بعبارة عربية واضحة ومألوفة.
- source_word: τοῖς πιστοῖς
  choice: المؤمنون
  rationale: يدل هنا على الذين يؤمنون، لا على مجرد المتصفين بالأمانة.
- source_word: ἐπεγνωκόσι τὴν ἀλήθειαν
  choice: الذين عرفوا الحق
  rationale: ينقل اسم الفاعل التام بوصفه معرفة تحققت وما زال أثرها قائمًا، من غير إثقال الصياغة العربية.
theological_decisions:
- issue: هل تشير عبارة τοῖς πιστοῖς καὶ ἐπεγνωκόσι τὴν ἀλήθειαν إلى جماعة واحدة أم جماعتين؟
  choice: 'جماعة واحدة موصوفة بصفتين: المؤمنون الذين عرفوا الحق'
  alternative: 'جماعتان: المؤمنون، والذين عرفوا الحق'
  rationale: أداة التعريف المشتركة مع الوصفين المنسقين ترجّح أنهما وصفان للأشخاص أنفسهم، فلا داعي إلى افتراض جماعتين.
- issue: علاقة ἀπέχεσθαι بـ κωλυόντων
  choice: إظهار أن المعلّمين يفرضون الامتناع عن الأطعمة
  alternative: 'الصياغة الحرفية الملتبسة: «يمنعون الزواج والامتناع عن أطعمة»'
  rationale: تتابع المصدرين بعد فعل المنع يخلق حذفًا/اختزالًا في اليونانية؛ والسياق يدل على أن التعليم الزائف يوجب الامتناع عن أطعمة، لا أنه يمنعه.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدم الفعلان المضارعان «يمنعون» و«يفرضون» لمواصلة الوصف الجاري، وحُفظت الإحالة إلى جماعة واحدة في «المؤمنون الذين عرفوا الحق».
