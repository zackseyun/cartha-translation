lexical_decisions:
- source_word: ὅτι
  choice: لِأَنَّ
  rationale: تُبقي الأداة على وظيفتها التفسيرية أو التعليلية في السياق السابق، وهي صياغة عربية طبيعية.
- source_word: πᾶν κτίσμα θεοῦ
  choice: كُلَّ مَا خَلَقَهُ اللهُ
  rationale: تنقل المعنى التوزيعي لـπᾶν، وتعبّر طبيعيًا عن κτίσμα بوصفه «ما خُلق» دون حصره في الكائنات الحية، مع إظهار الله مصدر الخلق.
- source_word: καλόν
  choice: حَسَنٌ
  rationale: «حسن» لفظ عربي واضح ورصين يلائم وصف الخليقة ويراعي صدى لغة الخلق، من غير إضافة معنى أخلاقي أضيق من الأصل.
- source_word: οὐδὲν ἀπόβλητον
  choice: وَلَا شَيْءَ يُرْفَضُ
  rationale: 'صياغة عربية مباشرة تحفظ النفي المطلق ومعنى الصفة ἀπόβλητον: ما يستحق الرفض أو يُطرح جانبًا.'
- source_word: μετὰ εὐχαριστίας
  choice: مَعَ الشُّكْرِ
  rationale: تنقل معنى تقديم الشكر بوضوح، وتنسجم مع الاستعمال العربي الكتابي والطبيعي.
- source_word: λαμβανόμενον
  choice: إِذَا قُبِلَ
  rationale: تحوّل اسم المفعول اليوناني إلى جملة ظرفية شرطية طبيعية في العربية، مع إبقاء ارتباط عدم الرفض بالتناول المصحوب بالشكر.
theological_decisions:
- issue: نطاق κτίσμα في سياق الأطعمة والنهي عن التقشف
  choice: كُلَّ مَا خَلَقَهُ اللهُ
  alternative: كل خليقة الله؛ كل مخلوق لله؛ جميع الأطعمة التي خلقها الله
  rationale: الأصل أوسع لفظًا من «الأطعمة»، وإن كان السياق يتناولها؛ لذلك تحفظ الصياغة المبدأ الخَلْقي العام ولا تضيّقه بتفسير سياقي داخل المتن.
- issue: دلالة λαμβανόμενον الظرفية أو الشرطية
  choice: إِذَا قُبِلَ مَعَ الشُّكْرِ
  alternative: متى قُبِل مع الشكر؛ حال كونه مقبولًا مع الشكر
  rationale: «إذا» عربية سلسة تعبّر عن الملابسة ذات القوة الشرطية الممكنة، دون الجزم بما يتجاوز دلالة اسم المفعول اليوناني.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُخدم «كل ما خلقه الله» لتجنب الإيحاء بأن الكلام مقصور على الكائنات الحية، وحُفظت علامتا الحاشيتين [a] و[b] في المتن.
