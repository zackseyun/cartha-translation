  text: لِأَنَّ كُلَّ مَا خَلَقَهُ اللهُ حَسَنٌ[a]، وَلَا شَيْءَ يُرْفَضُ إِذَا قُبِلَ مَعَ الشُّكْرِ[b]،
  philosophy: optimal-equivalence
