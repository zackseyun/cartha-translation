  text: Until I come[a], devote yourself to the public reading, to exhortation, to teaching.
translation:
  language: ar
  text: إلى أن آتي، واظب على القراءة العلنية[a]، وعلى الحثّ، وعلى التعليم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «قراءة الأسفار المقدسة». يقول اليوناني حرفيًا: «القراءة»، لكن السياق يرجح أن المقصود قراءة الأسفار المقدسة علنًا في اجتماع الجماعة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕως ἔρχομαι
  choice: إلى أن آتي
  rationale: يفيد التركيب المدة الممتدة حتى مجيء بولس، ويحافظ هذا التعبير على صياغة اليونانية الطبيعية وعلى دلالتها المستقبلية في السياق.
- source_word: πρόσεχε
  choice: واظب على
  rationale: صيغة الأمر تدعو إلى اهتمام مستمر وممارسة مواظبة، لا إلى انتباه عابر.
- source_word: τῇ ἀναγνώσει
  choice: القراءة العلنية
  rationale: الاسم يعني في ذاته «القراءة»، ويرجح السياق الكنسي أن المقصود القراءة على مسامع الجماعة. ولفظ «العلنية» يبين هذا المعنى المرجح من غير إضافة «الكتاب المقدس» إلى المتن.
- source_word: τῇ παρακλήσει
  choice: الوعظ
  rationale: يمكن أن يدل اللفظ على الحث أو التشجيع أو المناشدة؛ وفي سياق خدمة الجماعة إلى جانب القراءة والتعليم، تنقل كلمة «الوعظ» وظيفته الخطابية والرعوية بوضوح.
- source_word: τῇ διδασκαλίᾳ
  choice: التعليم
  rationale: يدل اللفظ هنا على فعل التعليم أو مضمونه، و«التعليم» لفظ عربي واضح لا يحصر المعنى في العقيدة المصوغة منهجيًا.
theological_decisions:
- issue: هل يُصرَّح بأن موضوع القراءة هو الكتاب المقدس؟
  choice: القراءة العلنية
  alternative: 'قراءة الأسفار المقدسة؛ أو: القراءة'
  rationale: يرجح سياق تنظيم العبادة والخدمة أن المقصود قراءة الأسفار المقدسة على الجماعة، لكن النص اليوناني يقول حرفيًا «القراءة» ولا يذكر مفعولها. لذلك يثبت المتن الطابع العلني المرجح، وتُحفظ الإضافة التفسيرية في الحاشية.
- issue: دلالة παράκλησις بين الحث والتشجيع
  choice: الوعظ
  alternative: 'الحث؛ أو: التشجيع'
  rationale: يحمل اللفظ مجالًا دلاليًا يشمل الحث والتشجيع. اختير «الوعظ» لأنه طبيعي في تسلسل مهام الخدمة العامة، من غير إنكار النبرة التشجيعية الممكنة.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ووقورة. استُخدمت «واظب على» لإبراز الاستمرار في الأمر، وحوفظ على التوازي بين «القراءة العلنية» و«الوعظ» و«التعليم».
