  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἡ γὰρ σωματικὴ γυμνασία πρὸς ὀλίγον ἐστὶν ὠφέλιμος, ἡ δὲ εὐσέβεια πρὸς πάντα ὠφέλιμός ἐστιν, ἐπαγγελίαν ἔχουσα ζωῆς τῆς νῦν καὶ τῆς μελλούσης.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/008.yaml
  text: For bodily training is beneficial for a little while[a], but godliness is beneficial for all things[c][b], since it holds promise for the present life and the coming one.
translation:
  language: ar
  text: لأَنَّ التَّدْرِيبَ الْبَدَنِيَّ نَافِعٌ إِلَى حَدٍّ مَا[a]، أَمَّا التَّقْوَى فَنَافِعَةٌ فِي كُلِّ شَيْءٍ، إِذْ لَهَا وَعْدُ الْحَيَاةِ الْحَاضِرَةِ وَالْآتِيَةِ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «نافعٌ إلى وقت قصير». تحتمل العبارة اليونانية محدودية النفع من حيث المقدار أو من حيث المدة.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًّا: «إذ لها وعدُ الحياة التي الآن والتي ستأتي».'
    reason: lexical_alternative
lexical_decisions:
- source_word: σωματικὴ γυμνασία
  choice: التدريب البدني
  rationale: ينقل معنى التدريب أو التمرين المتعلق بالجسد بعبارة عربية معاصرة واضحة، من غير حصره في المنافسة الرياضية.
- source_word: πρὸς ὀλίγον
  choice: إلى حدّ ما
  rationale: يحفظ دلالة محدودية النفع من حيث المقدار، مع التنبيه في الحاشية إلى إمكان فهم العبارة زمنيًا.
- source_word: ὠφέλιμος
  choice: نافع
  rationale: لفظ عربي واضح وطبيعي يصلح للعبارتين ويحافظ على التوازي بين التدريب البدني والتقوى.
- source_word: εὐσέβεια
  choice: التقوى
  rationale: تعبير عربي كتابي راسخ عن الحياة المتجهة إلى الله والممتلئة بتوقيره، وهو أنسب في السياق من ألفاظ قد توحي بمجرد الطقوس.
- source_word: πρὸς πάντα
  choice: في كل شيء
  rationale: يحفظ شمول العبارة اليونانية ويأتي طبيعيًا مع وصف التقوى بأنها نافعة.
- source_word: ἐπαγγελίαν ἔχουσα
  choice: إذ لها وعد
  rationale: 'يحافظ على القوة التفسيرية للعبارة الحالية وعلى صورتها القريبة من الأصل: للتقوى وعد متعلق بالحياة.'
- source_word: ζωῆς τῆς νῦν
  choice: الحياة الحاضرة
  rationale: صياغة عربية طبيعية تنقل الحياة التي الآن وتقابل بوضوح الحياة الآتية.
- source_word: τῆς μελλούσης
  choice: الآتية
  rationale: يحافظ على الإضمار في اليونانية، إذ تُفهم كلمة الحياة من العبارة السابقة، مع وضوح المعنى بالعربية.
theological_decisions:
- issue: مدى نفع التدريب البدني
  choice: للتدريب البدني نفع محدود، في مقابل شمول نفع التقوى
  alternative: للتدريب البدني نفع لمدة قصيرة
  rationale: العبارة اليونانية πρὸς ὀλίγον تحتمل محدودية المقدار أو المدة؛ اختيرت صياغة لا تنفي نفع التدريب البدني ولا تجعله شرًا، مع إبقاء الاحتمال الزمني في الحاشية.
- issue: طبيعة وعد التقوى
  choice: للتقوى وعد يتعلق بالحياة الحاضرة والآتية
  alternative: التقوى تضمن كل منفعة دنيوية بعينها
  rationale: يحافظ النص على عموم الوعد كما في الأصل، من غير تحويله إلى ضمان محدد للصحة أو الثراء أو الراحة في الحياة الحاضرة.
translation_notes:
  register: فصحى معاصرة واضحة ذات نبرة كتابية وقورة. حوفظ على التوازي بين «نافع» و«نافعة»، وعلى غموض πρὸς ὀλίγον بوضع أحد وجهيه في المتن والآخر في الحاشية.
