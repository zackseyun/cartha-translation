id: 1TI.6.17
reference: 1 Timothy 6:17
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Τοῖς πλουσίοις ἐν τῷ νῦν αἰῶνι παράγγελλε μὴ ὑψηλοφρονεῖν μηδὲ ἠλπικέναι ἐπὶ πλούτου ἀδηλότητι, ἀλλ’ ⸀ἐπὶ ⸀θεῷ τῷ παρέχοντι ἡμῖν πάντα πλουσίως εἰς ἀπόλαυσιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/017.yaml
  text: Command those who are rich in the present age not to be arrogant[a], nor to set their hope on the uncertainty of riches, but on God[b], who richly provides us with everything for enjoyment.
translation:
  language: ar
  text: أَوْصِ الأغنياء في العصر الحاضر[a] ألّا يتكبّروا، وألّا يعلّقوا رجاءهم على عدم ثبات الغنى[b]، بل على الله الذي يمنحنا كلَّ شيء بوفرة لنتمتّع به.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «في هذا العالم الحاضر». يمكن أن تعني الكلمة اليونانية «عصرًا»، وبالتوسّع نظام العالم الحاضر؛ وتحافظ «العصر» بصورة أفضل على المقابلة الزمنية عند بولس.
    reason: lexical_alternative
  - marker: b
    text: أو «على الغنى غير المضمون».
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῖς πλουσίοις
  choice: الأغنياء
  rationale: ترجمة اسمية طبيعية لصفة الجمع المعرّفة المستعملة استعمال الاسم، وتحافظ على الإشارة المباشرة إلى فئة الأغنياء.
- source_word: ἐν τῷ νῦν αἰῶνι
  choice: في العصر الحاضر
  rationale: تحافظ «العصر» على الدلالة الزمنية والأخروية المحتملة لكلمة αἰών، بدل حصرها في معنى العالم المادي.
- source_word: παράγγελλε
  choice: أَوْصِ
  rationale: صيغة أمر تفيد تكليف تيموثاوس بإعطاء توجيه ملزم؛ و«أوصِ» عربية واضحة ذات قوة سلطانية من غير غلظة زائدة.
- source_word: μὴ ὑψηλοφρονεῖν
  choice: ألّا يتكبّروا
  rationale: تؤدي المعنى الأخلاقي للفعل، أي التعالي والكبرياء، بعبارة عربية معاصرة ومباشرة.
- source_word: μηδὲ ἠλπικέναι
  choice: وألّا يعلّقوا رجاءهم
  rationale: تعبّر عن وضع الرجاء في شيء والاعتماد المستقر عليه، وهو ما يلائم صيغة المصدر التام.
- source_word: ἐπὶ πλούτου ἀδηλότητι
  choice: على عدم ثبات الغنى
  rationale: تنقل كون الغنى غير ثابت ولا مأمون البقاء، مع تجنّب العبارة الحرفية الثقيلة «عدم يقين الغنى».
- source_word: ἀλλ’ ἐπὶ θεῷ
  choice: بل على الله
  rationale: تحافظ على المقابلة النحوية والدلالية بين الاتكال على الغنى ووضع الرجاء على الله.
- source_word: τῷ παρέχοντι ἡμῖν
  choice: الذي يمنحنا
  rationale: تؤدي معنى العطاء والتوفير في تركيب عربي طبيعي، وتحافظ على وصف الله بأنه مصدر العطايا.
- source_word: πάντα
  choice: كلَّ شيء
  rationale: تحافظ على شمول العبارة اليونانية من غير تقييدها بالضروريات فقط.
- source_word: πλουσίως
  choice: بوفرة
  rationale: تنقل معنى العطاء الوافر بوضوح، وإن لم تكرر جذر «الغنى» تكرارًا قد يبدو متكلّفًا في العربية.
- source_word: εἰς ἀπόλαυσιν
  choice: لنتمتّع به
  rationale: تبيّن الغاية من العطاء، ويعود الضمير طبيعيًا على «كل شيء».
theological_decisions:
- issue: دلالة αἰών في السياق الأخلاقي والأخروي
  choice: العصر الحاضر
  alternative: العالم الحاضر
  rationale: «العصر» تصون البعد الزمني والمقابلة البولسية بين الزمن الحاضر وما سيأتي، ولا تختزل المعنى في الكون المادي.
- issue: مدى العطاء الإلهي في πάντα
  choice: كل شيء
  alternative: كل ما نحتاج إليه
  rationale: النص واسع العبارة ولا يقصر العطاء على الضروريات؛ لذلك تُحفظ شموليته من غير تحميلها وعدًا بالثراء.
- issue: الغرض من العطاء الإلهي في εἰς ἀπόλαυσιν
  choice: لنتمتّع به
  alternative: للاستمتاع
  rationale: يصرّح النص بأن عطايا الله موهوبة للتمتع، مع بقاء هذا القول في توتره السياقي مع التحذير من الاتكال على الغنى.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «أوصِ» لقوة الأمر الرعوي، و«عدم ثبات الغنى» لصياغة عدم موثوقية الثروة بلغة طبيعية. وُضعت علامتا الحاشيتين عند العبارتين اللتين تشرحانهما.
