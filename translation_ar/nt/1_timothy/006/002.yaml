  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: οἱ δὲ πιστοὺς ἔχοντες δεσπότας μὴ καταφρονείτωσαν, ὅτι ἀδελφοί εἰσιν· ἀλλὰ μᾶλλον δουλευέτωσαν, ὅτι πιστοί εἰσιν καὶ ἀγαπητοὶ οἱ τῆς εὐεργεσίας ἀντιλαμβανόμενοι. Ταῦτα δίδασκε καὶ παρακάλει.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/002.yaml
  text: And those who have believing masters must not despise them because they are brothers[a]; rather, they must serve them all the more, because those who partake of the benefit are believers and beloved[b]. Teach and urge these things.
translation:
  language: ar
  text: وأمّا الذين لهم سادة مؤمنون، فلا يحتقرونهم لأنهم إخوة[a]، بل ليخدموهم أكثر، لأن الذين ينالون الإحسان مؤمنون وأحبّاء[b]. علِّم هذه الأمور وحُثَّ عليها.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إخوة وأخوات»؛ واللفظ اليوناني حرفيًا: «إخوة».'
    reason: lexical_alternative
  - marker: b
    text: عبارة «الذين ينالون الإحسان» عسيرة التفسير. والأرجح أنها تشير إلى السادة المؤمنين بوصفهم المنتفعين من خدمة عبيدهم.
    reason: alternative_reading
lexical_decisions:
- source_word: πιστοὺς
  choice: مؤمنون
  rationale: يدل الوصف هنا على أن السادة مؤمنون بالمسيح، لا على مجرد كونهم أمناء أو جديرين بالثقة.
- source_word: δεσπότας
  choice: سادة
  rationale: يناسب سياق العبودية المنزلية ويدل على أصحاب السلطة على الخدم، من غير الإيحاء الديني الذي قد تحمله ألفاظ أخرى.
- source_word: καταφρονείτωσαν
  choice: فلا يحتقرونهم
  rationale: ينقل معنى الازدراء والاستخفاف، ويحافظ على قوة النهي بصياغة عربية واضحة.
- source_word: ἀδελφοί
  choice: إخوة
  rationale: يحفظ صيغة الجمع المذكر في اليونانية، مع دلالتها السياقية على الإخوة في الإيمان.
- source_word: μᾶλλον δουλευέτωσαν
  choice: بل ليخدموهم بالأحرى
  rationale: «يخدموا» تعبر طبيعيًا عن أداء الخدمة في وضع العبودية، و«بالأحرى» تحفظ قوة μᾶλλον.
- source_word: πιστοί
  choice: مؤمنون
  rationale: المراد أشخاص يؤمنون بالمسيح، وهو المعنى نفسه الذي يحمله الوصف في أول الآية.
- source_word: ἀγαπητοὶ
  choice: محبوبون
  rationale: يحفظ معنى المحبة والعلاقة الوجدانية في الاستعمال المسيحي من غير توسع تفسيري.
- source_word: οἱ τῆς εὐεργεσίας ἀντιλαμβανόμενοι
  choice: الذين ينالون الإحسان
  rationale: صياغة موجزة تحفظ قدرًا من غموض التركيب اليوناني؛ و«الإحسان» ينقل εὐεργεσία، بينما «ينالون» يلائم معنى الانتفاع أو الحصول عليه.
- source_word: Ταῦτα δίδασκε καὶ παρακάλει
  choice: علِّم بهذه الأمور وحُثَّ عليها
  rationale: ينقل فعلي الأمر الموجهين إلى تيموثاوس بلغة عربية فصيحة وطبيعية.
theological_decisions:
- issue: دلالة ἀδελφοί في سياق جماعة المؤمنين
  choice: إخوة
  alternative: إخوة وأخوات؛ إخوة في الإيمان
  rationale: أُبقيت صيغة المذكر الواردة في الأصل، مع بيان إمكان الدلالة الجامعة في الحاشية من غير إدخالها في المتن.
- issue: مصطلحات المكانة الاجتماعية في سياق العبودية
  choice: سادة ... يخدموهم
  alternative: مالكون ... يستعبدوهم؛ سادة ... يكونوا عبيدًا لهم
  rationale: «سادة» تنقل δεσπόται، و«يخدموهم» تنقل الفعل δουλεύω طبيعيًا، مع إبقاء واقع علاقة العبودية ظاهرًا من السياق من غير تعبير عربي متكلف.
- issue: مرجع οἱ τῆς εὐεργεσίας ἀντιλαμβανόμενοι
  choice: الأرجح أن المنتفعين هم السادة المؤمنون
  alternative: الخدم المؤمنون هم المتمسكون بالإحسان؛ أو أن الطرفين يشتركان في المنفعة
  rationale: يرجح السياق عود العبارة إلى السادة الذين ينتفعون بخدمة عبيدهم، لكن التركيب اليوناني مضغوط ومختلف في تفسيره؛ لذلك تُرك المتن غير مفرط في التحديد، ووُضح الاحتمال في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «بالأحرى» للمحافظة على المقابلة والتوكيد، وأُبقي الغموض الحقيقي في العبارة المتعلقة بالإحسان مع شرحه في الحاشية.
