  source_fidelity: المعنى العام منقول بأمانة، بما في ذلك النهي عن ازدراء السادة المؤمنين، والدعوة إلى مزيد من خدمتهم، وغموض عبارة المنتفعين بالإحسان. لكن «علِّم بهذه الأمور» لا تقابل «علِّم هذه الأمور» على الوجه الأدق؛ فالباء توحي بالتعليم بواسطة الأمور لا بتعليمها. كما أن «بالأحرى» تؤدي غالبًا معنى المقابلة («بل») وقد سبقتها «بل» بالفعل، فيبقى معنى μᾶλλον، أي «أكثر»، أوضح بلفظ صريح.
  naturalness: النص فصيح ومفهوم. وتحسين «ليخدموهم أكثر» يزيل التكرار الدلالي بين «بل» و«بالأحرى»، و«أحبّاء» أرسخ وأوضح في الاستعمال الكنسي العربي من «محبوبون» هنا، مع بقاء المعنى «beloved».
