  yaml_path: translation/nt/1_timothy/006/014.yaml
  text: that you keep the commandment unstained and above reproach until the appearing of our Lord Jesus the Messiah[c][b][a],
translation:
  language: ar
  text: أن تحفظ الوصية بلا دنس ولا لوم إلى ظهور ربنا يسوع المسيح[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ويجوز: «يسوع المَسيّا». فاللقب اليوناني Χριστός يعني «المسيح/المَسيّا»، وقد يُستعمل أيضًا استعمالًا قريبًا من الاسم العلم.'
    reason: alternative_reading
  - marker: b
    text: قد يصف تعبیر «بلا دنس ولا لوم» الوصية نفسها، أو طريقة حفظ تيموثاوس لها؛ فالعبارة اليونانية موجزة وتحتمل الوجهين.
    reason: lexical_alternative
  - marker: c
    text: 'ويجوز: «أن تحفظ الوصية طاهرةً وبلا لوم».'
    reason: previous_rendering
lexical_decisions:
- source_word: τηρῆσαί
  choice: أن تحفظ
  rationale: الفعل هنا تابع للوصية السابقة، و«تحفظ» يؤدي معنى الالتزام الأمين المستمر من غير حصره في مجرد المراعاة أو الحراسة.
- source_word: τὴν ἐντολὴν
  choice: الوصية
  rationale: يحافظ هذا اللفظ على قوة المفرد المعرّف وعلى الصلة بالتكليف الرسولي الوارد في السياق.
- source_word: ἄσπιλον
  choice: بلا دنس
  rationale: تعبير عربي واضح يؤدي معنى الخلو من العيب أو البقعة، وتسمح صيغته المضغوطة ببقاء احتمال تعلق الوصف بالوصية أو بطريقة حفظها.
- source_word: ἀνεπίλημπτον
  choice: ولا ملامة
  rationale: ينقل معنى ما لا يتيح أساسًا مشروعًا للوم، وهو أوضح للقارئ العام من ألفاظ أقل تداولًا مثل «غير مأخوذ عليه».
- source_word: μέχρι τῆς ἐπιφανείας
  choice: إلى ظهور
  rationale: «إلى» تبين امتداد الحفظ حتى الحدث الآتي، و«ظهور» تنقل معنى الانكشاف العلني من غير إضافة لفظ «الثاني» غير الموجود صراحة في اليونانية.
- source_word: τοῦ κυρίου ἡμῶν
  choice: ربنا
  rationale: صياغة عربية طبيعية تحفظ اللقب المسياني وعلاقة المتكلم والجماعة به.
- source_word: Ἰησοῦ Χριστοῦ
  choice: يسوع المسيح
  rationale: «المسيح» هو المقابل العربي الراسخ للقب Χριστός، ويحفظ دلالته بوصفه لقبًا مع إمكان سماعه في الاستعمال الموروث قريبًا من الاسم.
theological_decisions:
- issue: دلالة Χριστός في العبارة Ἰησοῦ Χριστοῦ
  choice: يسوع المسيح
  alternative: يسوع المَسيّا
  rationale: «المسيح» ترجمة عربية طبيعية للقب الذي يعني الممسوح، وتحفظ القوة اللقبية في سياق الظهور الأخروي من غير تحويل اللفظ إلى مجرد اسم علم.
- issue: متعلَّق الوصفين ἄσπιλον وἀνεπίλημπτον
  choice: 'صياغة مضغوطة: «تحفظ الوصية بلا دنس ولا ملامة»'
  alternative: «تحفظ الوصية، وأنت بلا دنس ولا ملامة» أو «تحفظ الوصية طاهرة وبلا ملامة»
  rationale: تركيب اليونانية يسمح بفهم الوصفين على أنهما للوصية أو لحفظ تيموثاوس إياها؛ لذلك لا تحسم الصياغة العربية هذه العلاقة بلا ضرورة.
translation_notes:
  register: صياغة عربية فصحى حديثة، موجزة ومهيبة. تجنبت إضافة «الثاني» إلى الظهور، وأبقت العلاقة النحوية بين الوصفين والوصية أو فعل حفظها مفتوحة بقدر ما يسمح به الأسلوب العربي.
