  text: قد انتفخ من الكبرياء[a]، وهو لا يفهم شيئًا، بل هو مريضٌ مولَعٌ بالمجادلات والمماحكات اللفظية[b]، ومنها ينشأ الحسد والخصام والافتراءات[c] والظنون الشريرة،
