lexical_decisions:
- source_word: τετύφωται
  choice: انتفخ كبرياءً
  rationale: يحفظ صورة الانتفاخ التي يفيدها الفعل اليوناني، مع بيان أن المقصود هو الغرور، كما يعكس حالة قائمة ناتجة من فعل سابق.
- source_word: μηδὲν ἐπιστάμενος
  choice: وهو لا يفهم شيئًا
  rationale: ينقل معنى انعدام الفهم أو الإدراك، بصياغة عربية طبيعية وواضحة.
- source_word: νοσῶν
  choice: مريض بالولع
  rationale: يحافظ على استعارة المرض في اليونانية، ويبيّن أن المرض مجازي ويتمثل في تعلق غير سوي.
- source_word: περὶ ζητήσεις
  choice: بالمجادلات
  rationale: تشير ζητήσεις هنا إلى مسائل جدلية ومنازعات، و«المجادلات» واضحة ومناسبة للسياق.
- source_word: λογομαχίας
  choice: المماحكات اللفظية
  rationale: تنقل معنى الخصومات أو المعارك بشأن الألفاظ، وتحافظ على الطابع النزاعي للمركب اليوناني.
- source_word: ἐξ ὧν γίνεται
  choice: ومنها ينشأ
  rationale: 'يبين علاقة النتيجة: هذه الرذائل تنشأ عن المجادلات والمماحكات اللفظية.'
- source_word: φθόνος
  choice: الحسد
  rationale: المقابل العربي المباشر لمعنى تمني زوال نعمة الغير أو الاستياء منها.
- source_word: ἔρις
  choice: الخصام
  rationale: يعبر بوضوح عن النزاع والشقاق في قائمة الرذائل.
- source_word: βλασφημίαι
  choice: الافتراءات
  rationale: في هذا السياق المتعلق بالعلاقات بين الناس، اللفظة اليونانية تدل على الكلام المسيء أو التشهير، لا يلزم أن تعني التجديف على الله.
- source_word: ὑπόνοιαι πονηραί
  choice: الظنون الشريرة
  rationale: ترجمة مباشرة تحفظ الوصف الأخلاقي العام في πονηραί دون تضييقه إلى معنى واحد مثل الخبث.
theological_decisions:
- issue: 'مرجع βλασφημίαι: الإساءة إلى الناس أم التجديف على الله'
  choice: الافتراءات
  alternative: التجديفات / كلمات الإساءة
  rationale: قائمة النتائج الناشئة عن الخصومات ترجّح الإساءة القولية إلى الآخرين، مع إبقاء المعنى الآخر في الحاشية لأن اللفظة قد تدل في سياقات أخرى على التجديف.
