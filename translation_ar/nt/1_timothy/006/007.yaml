base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/007.yaml
  text: For we brought nothing into the world[a], and we are not able to carry anything out.
translation:
  language: ar
  text: لأننا لم نأتِ إلى العالم بشيء[a]، ولا نستطيع أن نُخرج منه شيئًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'وبصورة أقرب إلى اللفظ: «لأننا لم نُدخل شيئًا إلى العالم، لأننا لا نستطيع أيضًا أن نُخرج شيئًا». يمكن أن تُفهم أداة الربط اليونانية بمعنى سببي («لأن»)، أو على أنها تُدخل العبارة الثانية الموازية للأولى.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲν
  choice: شيئًا
  rationale: نكرة في سياق النفي تفيد النفي المطلق، وهي المفعول به للفعل «نُدخِل».
- source_word: γὰρ
  choice: لأننا
  rationale: تربط الآية بما قبلها على جهة التعليل والتفسير، و«لأن» واضحة وطبيعية في العربية.
- source_word: εἰσηνέγκαμεν
  choice: نُدخِل
  rationale: الفعل يعني «أدخل/حمل إلى الداخل»، ويشير هنا إلى دخول الإنسان العالم عند مولده؛ وصيغة الماضي المنفي العربية تؤدي معنى اليونانية.
- source_word: εἰς τὸν κόσμον
  choice: إلى العالم
  rationale: المقصود عالم الحياة البشرية الذي يولد الإنسان فيه، لا «الكون» بمعناه الاصطلاحي.
- source_word: ὅτι
  choice: ولا
  rationale: صيغت أداة الربط في المتن بوصفها انتقالًا إلى العبارة الموازية الثانية، مع إثبات احتمال المعنى السببي في الحاشية حفاظًا على غموض الأصل.
- source_word: οὐδὲ
  choice: ولا
  rationale: تنفي القدرة في الجملة الثانية وتبرز الموازاة بين عدم إدخال شيء وعدم إمكان إخراج شيء.
- source_word: ἐξενεγκεῖν
  choice: أن نُخرِج
  rationale: يحافظ على التقابل اللفظي والاتجاهي مع «نُدخِل»، ويفيد إخراج شيء من العالم عند الموت.
- source_word: τι
  choice: شيئًا
  rationale: نكرة واقعة في سياق النفي، فتفيد «أي شيء».
- source_word: δυνάμεθα
  choice: نستطيع
  rationale: مقابل عربي طبيعي مباشر لمعنى القدرة في الفعل اليوناني.
theological_decisions:
- issue: دلالة ὅτι في الجملة الثانية
  choice: 'اعتبارها في المتن رابطةً بين حقيقتين متوازيتين: لم نُدخل شيئًا، ولا نستطيع إخراج شيء.'
  alternative: 'اعتبارها سببية: «لأننا لا نستطيع أيضًا أن نُخرج شيئًا».'
  rationale: تسمح الصيغة اليونانية بالفهم السببي، لكن السياق ذو بناء حكمي متوازن. يعرض المتن هذا التوازن الطبيعي، وتحتفظ الحاشية بالقراءة السببية الممكنة من غير حسم زائد.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُخدم التقابل «نُدخِل/نُخرِج» لإبراز صورة الأصل وبنيته المتوازية، وأُضيف «منه» لتوضيح أن المقصود الإخراج من العالم، وهو مفهوم من السياق اليوناني.
