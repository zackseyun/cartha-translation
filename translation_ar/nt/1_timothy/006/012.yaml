base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/012.yaml
  text: Fight the good fight of the faith[b][a]; take hold of the eternal life to which you were called and about which you made the good confession before many witnesses.
translation:
  language: ar
  text: جاهد جهاد الإيمان الحسن[a]، وتمسَّك بالحياة الأبدية التي دُعيت إليها، واعترفتَ الاعتراف الحسن أمام شهود كثيرين.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا فهم العبارة بمعنى: «جاهد الجهاد الحسن الذي يتصف بالإيمان». فالتركيب اليوناني قد يشير إلى الجهاد لأجل الإيمان المسيحي، أو إلى جهاد يتسم بالإيمان.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγωνίζου τὸν καλὸν ἀγῶνα
  choice: جاهد جهاد... الحسن
  rationale: يحافظ على صيغة الأمر المستمرة وعلى الجناس الاشتقاقي بين الفعل والاسم في اليونانية. وتؤدي «الحسن» معنى καλός بوصفه جهادًا صالحًا وجديرًا.
- source_word: τῆς πίστεως
  choice: الإيمان
  rationale: يحافظ على المعنى المباشر للمفردة وعلى إمكان فهمها إما باعتبارها الإيمان المسيحي وإما الإيمان الذي يتصف به الجهاد، مع بيان الاحتمال في الحاشية.
- source_word: ἐπιλαβοῦ
  choice: تمسَّك
  rationale: ينقل صورة الإمساك الحازم والفعلي، ويأتي عربيًا طبيعيًا مع «الحياة الأبدية».
- source_word: τῆς αἰωνίου ζωῆς
  choice: بالحياة الأبدية
  rationale: ترجمة مباشرة للتعبير مع تعريف الحياة المشار إليها في السياق.
- source_word: εἰς ἣν ἐκλήθης
  choice: التي دُعيت إليها
  rationale: يحفظ معنى الغاية أو الوجهة في εἰς وصيغة المبني للمجهول دون تعيين الفاعل الذي لم يُذكر صراحة.
- source_word: ὡμολόγησας τὴν καλὴν ὁμολογίαν
  choice: واعترفتَ الاعتراف الحسن
  rationale: يحافظ على الجناس الاشتقاقي بين الفعل والاسم وعلى الموازاة مع «الجهاد الحسن»، من غير تحديد مضمون الاعتراف بما يتجاوز النص.
- source_word: ἐνώπιον πολλῶν μαρτύρων
  choice: أمام شهود كثيرين
  rationale: ترجمة موجزة وطبيعية للحضور العلني، و«شهود» هنا لا تعني «شهداء» بالمعنى الاصطلاحي اللاحق.
theological_decisions:
- issue: دلالة πίστεως في «جهاد الإيمان»
  choice: الإبقاء على «الإيمان» بصياغة تحتمل الإيمان المسيحي المحدد
  alternative: الجهاد المتصف بالإيمان الشخصي
  rationale: الإضافة والتعريف والسياق في الرسائل الرعوية قد يدلان على «الإيمان» بوصفه مضمون الإيمان المسيحي، لكن التركيب اليوناني لا يلغي المعنى الذاتي؛ لذلك لم يُحسم الاحتمال في المتن وبُيّن في الحاشية.
- issue: صلة الاعتراف بالدعوة إلى الحياة الأبدية
  choice: 'وصل الجملتين بالعطف فقط: «واعترفتَ...»'
  alternative: «وبشأنها اعترفتَ الاعتراف الحسن»
  rationale: καί ينسق الاعتراف مع الدعوة، ولا يصرح بأن الحياة الأبدية هي مضمون الاعتراف. أبقت الصياغة العربية الصلة السياقية من غير إضافة هذا التحديد، وذكرت القراءة الأخرى في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة وقورة. حُفظ الجناس الاشتقاقي في عبارتي «جاهد جهاد» و«اعترفت الاعتراف» لقوته البلاغية في الأصل، مع استخدام «تمسّك» بوصفها صياغة عربية طبيعية لصورة الإمساك بالحياة الأبدية.
