reference: 1 Timothy 6:9
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: οἱ δὲ βουλόμενοι πλουτεῖν ἐμπίπτουσιν εἰς πειρασμὸν καὶ παγίδα καὶ ἐπιθυμίας πολλὰς ἀνοήτους καὶ βλαβεράς, αἵτινες βυθίζουσι τοὺς ἀνθρώπους εἰς ὄλεθρον καὶ ἀπώλειαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/009.yaml
  text: But those who want to be rich fall into temptation[a], a snare, and many foolish and harmful desires[c][b], which plunge people into ruin and destruction.
translation:
  language: ar
  text: أَمَّا الَّذِينَ يُرِيدُونَ أَنْ يَصِيرُوا أَغْنِيَاءَ، فَيَقَعُونَ فِي تَجْرِبَةٍ وَفَخٍّ وَرَغَبَاتٍ كَثِيرَةٍ حَمْقَاءَ وَمُؤْذِيَةٍ، تُغْرِقُ النَّاسَ فِي الْخَرَابِ وَالْهَلَاكِ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ βουλόμενοι
  choice: أَمَّا الَّذِينَ يُرِيدُونَ
  rationale: تنقل العبارة رغبةً مقصودة أو إرادة مستقرة، مع إبراز المقابلة التي تؤديها δέ بصورة عربية طبيعية.
- source_word: πλουτεῖν
  choice: أَنْ يَصِيرُوا أَغْنِيَاءَ
  rationale: السياق يتحدث عن التطلع إلى الغنى، وهذه الصياغة توضح معنى الصيرورة المحتمل في المصدر من غير أن تجعله خطةً تفصيلية لجمع المال.
- source_word: ἐμπίπτουσιν εἰς
  choice: فَيَقَعُونَ فِي
  rationale: تحافظ على صورة الوقوع في حالة خطرة، وهي عبارة عربية واضحة ومألوفة.
- source_word: πειρασμόν
  choice: تَجْرِبَةٍ
  rationale: يدل السياق التحذيري على الإغراء المؤدي إلى الشر، ولفظ «تجربة» يحافظ أيضًا على المدى الدلالي للكلمة اليونانية دون تفسير زائد.
- source_word: παγίδα
  choice: فَخٍّ
  rationale: ينقل صورة أداة الاصطياد والخطر الخفي بلفظ عربي مباشر.
- source_word: ἐπιθυμίας πολλὰς ἀνοήτους καὶ βλαβεράς
  choice: شَهَوَاتٍ كَثِيرَةٍ طَائِشَةٍ وَمُؤْذِيَةٍ
  rationale: «شهوات» تلائم الرغبات القوية المنحرفة في هذا السياق، و«طائشة» تعبّر عن افتقارها إلى التعقل، و«مؤذية» عن أثرها الضار.
- source_word: αἵτινες
  choice: تُغْرِقُ
  rationale: صيغت الصلة جملةً فعلية عربية تعود بوضوح إلى الشهوات وتصف أثرها المميز.
- source_word: βυθίζουσι
  choice: تُغْرِقُ
  rationale: تحفظ الصورة الحية المتمثلة في التسبب بالغوص أو الغرق، لا مجرد الوصول إلى نتيجة سيئة.
- source_word: τοὺς ἀνθρώπους
  choice: النَّاسَ
  rationale: اللفظ اليوناني عام للبشر هنا، و«الناس» ينقله طبيعيًا من غير قصره على الذكور.
- source_word: ὄλεθρον
  choice: الْخَرَابِ
  rationale: يعبر عن الدمار والانهيار، ويحافظ على تمييز نسبي عن الاسم التالي.
- source_word: ἀπώλειαν
  choice: الْهَلَاكِ
  rationale: ينقل معنى الفناء أو الدمار الشديد، ويُبقي العبارة قوية من غير أن يحدد وحده طبيعة الهلاك أو مداه.
theological_decisions:
- issue: هل يُفهم ὄλεθρον καὶ ἀπώλειαν تحديدًا على أنهما إدانة أبدية؟
  choice: الْخَرَابِ وَالْهَلَاكِ
  alternative: الدمار والهلاك الأبدي
  rationale: العبارة اليونانية تؤكد عاقبة مدمرة وخطيرة، لكنها لا تصف في هذه الآية وحدها مدى هذه العاقبة بأنه أبدي صراحةً؛ لذلك تُركت قوة التحذير بلا إضافة حسم عقائدي غير مصرّح به.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة، مع تشكيل كامل للنص. حُفظ تتابع المخاطر وصورة الإغراق، واستُخدمت ألفاظ مفهومة للقارئ العام من غير تسطيح النبرة التحذيرية.
