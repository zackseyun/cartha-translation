source:
  edition: SBLGNT
  text: ὁ μόνος ἔχων ἀθανασίαν, φῶς οἰκῶν ἀπρόσιτον, ὃν εἶδεν οὐδεὶς ἀνθρώπων οὐδὲ ἰδεῖν δύναται· ᾧ τιμὴ καὶ κράτος αἰώνιον· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/016.yaml
  text: who alone has immortality[a], dwelling in unapproachable light, whom no one among men has seen nor is able to see. To him be honor and eternal dominion[b]. Amen.
translation:
  language: ar
  text: الذي وحده له الخلود، الساكن في نور لا يُدنى منه، الذي لم يره أحد من البشر ولا يستطيع أن يراه؛ له الكرامة والسلطان الأبدي[a]. آمين.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يفهم بعضهم هذا الوصف والتمجيد على أنهما يشيران بصورة أصرح إلى الرب يسوع المسيح في السياق الأوسع، مع أن لغة عدم الرؤية تشير على نحو أرجح إلى الله.
    reason: alternative_reading
lexical_decisions:
- source_word: μόνος
  choice: وحده
  rationale: تنقل معنى الانفراد والحصر بصياغة عربية طبيعية، وتؤكد أن ما يلي مختص به.
- source_word: ἔχων ἀθανασίαν
  choice: له عدم الموت
  rationale: تحافظ على البناء المباشر وعلى معنى ἀθανασία بوصفها انتفاء الموت، من غير إضافة تفسير مثل «في ذاته» غير مصرح به في النص.
- source_word: φῶς οἰκῶν ἀπρόσιτον
  choice: الساكن في نور لا يُدنى منه
  rationale: صياغة عربية واضحة تحفظ صورة السكن ومعنى أن النور لا يمكن الاقتراب منه، لا أنه مجهول فحسب.
- source_word: οὐδεὶς ἀνθρώπων
  choice: أحد من البشر
  rationale: تنقل التركيب التبعيضي بدقة، وتشمل البشر جميعًا طبيعيًا لأن ἄνθρωπος هنا عام لا يدل تحديدًا على الذكور.
- source_word: οὐδὲ ἰδεῖν δύναται
  choice: ولا يستطيع أن يراه
  rationale: تُبقي معنى القدرة المنفي صريحًا، مع مفعول مفهوم من الاسم الموصول السابق.
- source_word: τιμή
  choice: الكرامة
  rationale: مقابل مألوف ودقيق في عبارات التمجيد، مع تقدير الخبر في الجملة اليونانية الاسمية.
- source_word: κράτος αἰώνιον
  choice: السلطان الأبدي
  rationale: κράτος في سياق التمجيد يفيد القوة السيادية أو السلطان المتجلي، و«السلطان الأبدي» طبيعي ومناسب للسياق.
- source_word: ἀμήν
  choice: آمين
  rationale: النقل العربي المألوف للكلمة في الخواتيم التعبدية.
theological_decisions:
- issue: مرجع العبارات الموصولة والتمجيد
  choice: أُبقيت الضمائر بلا تسمية تفسيرية، بحيث يستمر الوصف نحويًا في الإشارة إلى صاحب السيادة المذكور في السياق السابق، والأرجح أنه الله.
  alternative: يربط بعضهم الوصف والتمجيد على نحو أصرح بالرب يسوع المسيح بسبب ذكره في الجملة الأوسع.
  rationale: لغة عدم رؤية البشر له ترجح الإشارة إلى الله، لكن إدخال اسم «الله» أو «المسيح» في متن العدد سيحسم ما تركه تركيب السياق دون تسمية صريحة؛ لذلك حُفظت الصياغة الموصولة ووُثقت القراءة البديلة في الحاشية.
- issue: دلالة ἀνθρώπων
  choice: البشر
  alternative: الناس أو بني آدم
  rationale: اللفظة اليونانية عامة للبشر هنا وليست ἀνήρ الدالة على الرجل؛ لذلك «البشر» أدق دلاليًا وأوضح في العربية الحديثة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «نور لا يُدنى منه» للمحافظة على الصورة وقوة معنى ἀπρόσιτον، واستُعملت الفاصلة المنقوطة قبل جملة التمجيد لإبراز انتقالها من الوصف إلى الحمد. وُضع مؤشر الحاشية بعد العبارة التي تتعلق بها القراءة البديلة.
