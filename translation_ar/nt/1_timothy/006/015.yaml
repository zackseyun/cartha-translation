lexical_decisions:
- source_word: ἣν
  choice: الذي
  rationale: الضمير الموصول المؤنث في اليونانية يعود إلى ἐπιφάνειαν («الظهور») في الآية السابقة؛ ولأن «الظهور» مذكر في العربية استُعمل «الذي»، مع بقاء المفعول به مستترًا في ضمير «سيُظهره».
- source_word: καιροῖς ἰδίοις
  choice: في أوقاته هو
  rationale: تحافظ الصياغة على جمع καιροῖς وعلى معنى اختصاص الأوقات به، وتفيد «هو» التوكيد من غير تحويل الجمع إلى وقت مفرد.
- source_word: δείξει
  choice: سيُظهره
  rationale: ينقل الفعل معنى جعل الظهور منظورًا وعلنيًّا، وهو أوضح في السياق من «سيُعلنه».
- source_word: ὁ μακάριος
  choice: المبارك
  rationale: استُعملت الصفة لقبًا إلهيًّا كما في اليونانية، وهي أفصح وأليق بالسياق من «السعيد».
- source_word: μόνος δυνάστης
  choice: صاحب السلطان الوحيد
  rationale: δυνάστης يدل على من يملك سلطة الحكم والسيادة؛ وهذه الصياغة واضحة ومعاصرة وتحفظ ثقل اللقب من غير لفظ عتيق.
- source_word: βασιλεὺς τῶν βασιλευόντων
  choice: ملك الذين يملكون
  rationale: تحافظ العبارة على القوة الفعلية لاسم الفاعل اليوناني، بدل تسويتها مباشرة إلى الصيغة التقليدية «ملك الملوك».
- source_word: κύριος τῶν κυριευόντων
  choice: رب الذين يسودون
  rationale: «رب» تنقل لقب κύριος، و«يسودون» تحفظ الدلالة الفعلية لـκυριευόντων، أي ممارسة السيادة أو السلطان.
theological_decisions:
- issue: هوية فاعل «سيُظهره»
  choice: أُبقي الفاعل معرَّفًا بالألقاب الواردة في الآية نفسها، من غير إضافة اسم صريح.
  alternative: تعيين الفاعل صراحة بأنه الله الآب الذي يُظهر ظهور يسوع المسيح.
  rationale: النص اليوناني يؤخر الفاعل ثم يصفه بألقاب سامية، ولا يذكر هنا اسمًا علمًا؛ لذلك تحافظ الترجمة على طريقة عرضه وعلى ما في السياق من توتر لاهوتي مشروع.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة مهيبة. روعي تأخر الفاعل كما في اليونانية، وحُفظ جمع «الأوقات» والقوة الفعلية للعبارتين الختاميتين، مع ضبط أواخر ألقاب الفاعل حيث يمنع ذلك التباسها بالمفعول به.
