  source_fidelity: 'المسودة تنقل بنية اليونانية الأساسية بأمانة: الضمير الموصول يعود إلى «الظهور» في الآية السابقة، والفعل مستقبلي، و«الأوقات» جمع، والألقاب الختامية محفوظة. لكن «الذين يملكون» في العربية يُفهم في الاستعمال الحديث أولًا بمعنى الذين يمتلكون أشياء، لا الذين يملكون/يحكمون؛ ولذلك لا يؤدي بدقة معنى βασιλευόντων («الذين يحكمون/يملكون الملك»).'
