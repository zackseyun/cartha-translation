id: 1TI.6.11
reference: 1 Timothy 6:11
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Σὺ δέ, ὦ ἄνθρωπε ⸀θεοῦ, ταῦτα φεῦγε· δίωκε δὲ δικαιοσύνην, εὐσέβειαν, πίστιν, ἀγάπην, ὑπομονήν, ⸀πραϋπαθίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/011.yaml
  text: But you[a], man of God, flee these things; but pursue righteousness, godliness, faith, love, steadfastness[c][b], gentleness.
translation:
  language: ar
  text: أَمَّا أَنْتَ يَا رَجُلَ اللهِ، فَاهْرُبْ مِنْ هذِهِ الأُمُورِ، وَاسْعَ إِلَى الْبِرِّ[a] وَالتَّقْوَى وَالإِيمَانِ[b] وَالْمَحَبَّةِ وَالثَّبَاتِ وَالْوَدَاعَةِ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «العدل».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «الأمانة» أو «الثقة».'
    reason: lexical_alternative
  - marker: c
    text: 'اللفظة اليونانية نادرة، ويمكن أيضًا ترجمتها: «الحِلْم» أو «طول الأناة» أو «الوداعة الصابرة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Σὺ δέ
  choice: أَمَّا أَنْتَ
  rationale: يُظهر التحول المؤكد والمقابلة مع ما سبق بأسلوب عربي طبيعي.
- source_word: ὦ ἄνθρωπε θεοῦ
  choice: يَا رَجُلَ اللهِ
  rationale: يحفظ صيغة النداء المذكرة المفردة واللقب الكتابي الموجَّه إلى تيموثاوس.
- source_word: ταῦτα φεῦγε
  choice: فَاهْرُبْ مِنْ هذِهِ الأُمُورِ
  rationale: يحفظ قوة فعل الأمر وإلحاح الابتعاد المستمر عما ذُكر سابقًا.
- source_word: δίωκε δὲ
  choice: وَاسْعَ إِلَى
  rationale: يفيد الطلب النشط الجاد، وتؤدي المقابلة التي بدأها «أما أنت» معنى δέ بصورة عربية سلسة من غير تكرار ثقيل.
- source_word: δικαιοσύνην
  choice: الْبِرِّ
  rationale: المقابل الكتابي العربي المألوف في سياق قائمة الفضائل، مع إبقاء «العدل» احتمالًا دلاليًا في الحاشية.
- source_word: εὐσέβειαν
  choice: التَّقْوَى
  rationale: تعبير عربي واضح عن الحياة المتعبدة الموقرة لله، وهو مناسب لاستعمال الكلمة في الرسائل الرعوية.
- source_word: πίστιν
  choice: الإِيمَانِ
  rationale: المقابل الأساسي الواضح، مع حفظ احتمالَي الأمانة والثقة في الحاشية.
- source_word: ἀγάπην
  choice: الْمَحَبَّةِ
  rationale: المقابل العربي القياسي الواضح في قائمة الفضائل.
- source_word: ὑπομονήν
  choice: الثَّبَاتِ
  rationale: يعبّر عن الاستمرار الراسخ تحت الضغط، ولا يقصر المعنى على الانتظار السلبي.
- source_word: πραϋπαθίαν
  choice: الْوَدَاعَةِ
  rationale: مقابل عربي موجز وطبيعي للرفق المقرون بضبط النفس، مع توضيح اتساع معنى اللفظة النادرة في الحاشية.
theological_decisions:
- issue: صيغة النداء المذكرة في ὦ ἄνθρωπε θεοῦ
  choice: يا رجل الله
  alternative: يا إنسان الله
  rationale: الخطاب موجه إلى تيموثاوس بصيغة المذكر المفرد؛ لذلك حُفظ التحديد الموجود في النص بدل تعميمه.
- issue: المدى الدلالي لكلمة δικαιοσύνη
  choice: البر
  alternative: العدل
  rationale: سياق قائمة الفضائل يرجح «البر»، لكن «العدل» احتمال أصيل لم يُطمس بل ذُكر في الحاشية.
- issue: المدى الدلالي لكلمة πίστις
  choice: الإيمان
  alternative: الأمانة أو الثقة
  rationale: «الإيمان» هو المقابل الأساسي، غير أن سياق الفضائل يسمح بمعنى الأمانة أو الثقة، فحُفظت الاحتمالات في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة، مع إيقاع أمر مباشر ومقابلة بين الهرب من الشر والسعي إلى الفضائل. استُخدم «أما أنت» لإبراز Σὺ δέ، وحُفظت مواطن الغموض المعجمي الحقيقية في الحواشي.
