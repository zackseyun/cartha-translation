revisions:
- from: يا تيموثاوس، احفظ الوديعة التي اؤتمنت عليها، معرضًا عن الأقوال الفارغة الدنيوية، وعن المعارضات[a] الصادرة عن المعرفة التي تُدعى بهذا الاسم كذبًا[b].
  to: يا تيموثاوس، احفظ الوديعة التي اؤتمنت عليها، مُعرِضًا عن الأقاويل الفارغة الدنسة، وعن المعارضات[a] المنسوبة إلى ما يُدعى كذبًا «معرفة»[b].
  rationale: استُبدلت «الدنيوية» بـ«الدنسة» لتقريب قوة βεβήλους الدينية والأخلاقية من غير إضافة توصيف عقائدي. وأعيدت صياغة علاقة «المعارضات» بـ«المعرفة» بوصفها نسبةً لا صدورًا، محافظةً على غموض الإضافة اليونانية. وبقيت الوديعة غير معرّفة لاهوتيًا، وحُفظت علامات الحواشي في مواضعها.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:26:04Z'
review_pass:
  verdict: revise
  source_fidelity: تحتاج الصياغة إلى تعديل محدود. «الدنيوية» لا تنقل βεβήλους بدقة؛ فهي تعني ما هو متعلق بالعالم، في حين أن الأصل يصف الكلام بأنه مدنّس/منتهك للقداسة أو غير تقي. كذلك «الصادرة عن» تضيّق علاقة الإضافة في ἀντιθέσεις τῆς ψευδωνύμου γνώσεως إلى علاقة مصدرية لا يفرضها النص.
  naturalness: النص سليم إجمالًا، لكن «الأقاويل الفارغة الدنسة» أوضح في نقل الوصف الأخلاقي-الديني من «الأقوال الفارغة الدنيوية». كما أن «المعارضات المنسوبة إلى ما يُدعى كذبًا «معرفة»» عربية فصيحة وتحافظ على سعة الإضافة اليونانية.
  terminology: «الوديعة» و«احفظ» مناسبان لـ παραθήκη وφύλαξον ويحفظان الاستعارة دون تحديد محتواها. «معارضات» اختيار صالح لـἀντιθέσεις، مع إبقاء «التناقضات» بديلًا في الحاشية. وتعبر «ما يُدعى كذبًا «معرفة»» بدقة عن ψευδώνυμος γνῶσις.
  issues:
  - severity: medium
    issue: ترجمة βεβήλους بـ«الدنيوية».
    rationale: «دنيوي» يحيل عادةً إلى ما هو عالمي أو زمني، وليس إلى معنى التدنيس أو انتهاك ما هو مقدس الذي يحمله βέβηλος في هذا السياق.
  - severity: medium
    issue: تفسير الإضافة في «المعارضات الصادرة عن المعرفة».
    rationale: الأصل يربط «المعارضات» بـ«المعرفة ذات الاسم الزائف» بإضافة تحتمل النسبة أو الارتباط، ولا يصرح بأنها صادرة عنها؛ لذا ينبغي تجنب التحديد المصدري.
