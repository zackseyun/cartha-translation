  text: Ὦ Τιμόθεε, τὴν παραθήκην φύλαξον, ἐκτρεπόμενος τὰς βεβήλους κενοφωνίας καὶ ἀντιθέσεις τῆς ψευδωνύμου γνώσεως,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/020.yaml
  text: O Timothy[a], guard the deposit entrusted to you[b], turning away from the profane empty talk and contradictions of what is falsely called knowledge.
translation:
  language: ar
  text: يا تيموثاوس، احفظ الوديعة التي اؤتمنت عليها، مُعرِضًا عن الأقاويل الفارغة الدنسة، وعن المعارضات[a] المنسوبة إلى ما يُدعى كذبًا «معرفة»[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «التناقضات».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «المعارضات المنسوبة إلى المعرفة ذات الاسم الزائف».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ Τιμόθεε
  choice: يا تيموثاوس
  rationale: أداة النداء العربية «يا» تنقل المخاطبة المباشرة الجليلة بصورة طبيعية، دون تكلف.
- source_word: παραθήκην
  choice: الوديعة التي اؤتمنت عليها
  rationale: «الوديعة» تحفظ صورة الشيء المسلَّم للحراسة، والعبارة الموصولة توضّح المعنى الكامن في الاسم من غير تعيين محتوى الوديعة.
- source_word: φύλαξον
  choice: احفظ
  rationale: يفيد فعل الأمر الحراسة اليقظة والصون، وهو ملائم للوديعة في العربية الفصحى.
- source_word: ἐκτρεπόμενος
  choice: معرضًا عن
  rationale: ينقل معنى الانصراف والتجنب، ويرتبط طبيعيًا بالأمر «احفظ».
- source_word: βεβήλους κενοφωνίας
  choice: الأقوال الفارغة الدنيوية
  rationale: «الفارغة» تنقل خواء الكلام، و«الدنيوية» تعبّر عن βέβηλος بوصفه ما هو خارج دائرة المقدس، من غير أن تضيف حكم «الإلحاد» الأقوى من الأصل.
- source_word: ἀντιθέσεις
  choice: المعارضات
  rationale: يحفظ اللفظ اتساع الأصل، الذي قد يشير إلى أقوال متقابلة أو اعتراضات، ولا يحسمه في معنى التناقض المنطقي وحده.
- source_word: τῆς ψευδωνύμου γνώσεως
  choice: الصادرة عن المعرفة التي تُدعى بهذا الاسم كذبًا
  rationale: ينقل ψευδώνυμος بوضوح باعتباره اسمًا زائفًا، مع إبقاء «المعرفة» موضوعًا للادعاء الذي يرفضه الكاتب.
theological_decisions:
- issue: ماهية الوديعة (παραθήκη)
  choice: 'إبقاء التعبير عامًا: «الوديعة التي اؤتمنت عليها»'
  alternative: الإنجيل، أو التعليم الرسولي، أو التكليف الخدمي
  rationale: السياق قد يرجّح الرسالة أو التعليم الموكول إلى تيموثاوس، لكن الآية لا تعيّن المحتوى صراحة؛ لذلك تُحفظ الاستعارة وسعة الدلالة.
- issue: صلة «المعارضات» بالمعرفة المزعومة
  choice: صياغتها بوصفها صادرة عن المعرفة التي تحمل اسمها كذبًا
  alternative: «تناقضات ما يسمى معرفة» أو «المعارضات والمعرفة المسماة كذبًا»
  rationale: الإضافة اليونانية تربط «المعارضات» بـ«المعرفة»، لكن طبيعة العلاقة تحتمل الوصف أو المصدر؛ الصياغة المختارة واضحة مع إثبات البديل الأقرب حرفيًا في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة رسولية جليلة. استُخدم «يا» للنداء المباشر، وحُفظت استعارة الوديعة، مع تجنب تعيين مضمونها لاهوتيًا بما يتجاوز النص. جميع علامات الحواشي مثبتة في المتن.
