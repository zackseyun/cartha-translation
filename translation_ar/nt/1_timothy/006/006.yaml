  text: ἔστιν δὲ πορισμὸς μέγας ἡ εὐσέβεια μετὰ αὐταρκείας·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/006.yaml
  text: But godliness with contentment is great gain[a][b].
translation:
  language: ar
  text: أمّا التقوى مع القناعة فهي ربح عظيم[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «مكسب عظيم»، أو «وسيلة عظيمة للكسب». تستعمل اليونانية لفظًا يدل على الربح أو وسيلة تحصيله، في صدى للآية السابقة.
    reason: lexical_alternative
  - marker: b
    text: أو «الاكتفاء». وقد تعني الكلمة أيضًا «الاكتفاء الذاتي»، لكن المقصود هنا على الأرجح القناعة أو الكفاية، لا الاستقلال والاعتماد على الذات.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: أمّا... فـ
  rationale: تفيد انتقالًا ذا مسحة استدراكية يربط القول بوهم اعتبار التقوى وسيلةً للربح في الآية السابقة، بصياغة عربية طبيعية.
- source_word: πορισμὸς
  choice: ربح
  rationale: يحفظ معنى الكسب أو المنفعة، ويحافظ على الصدى اللفظي مع الآية السابقة من غير قصره على الثروة المادية.
- source_word: μέγας
  choice: عظيم
  rationale: ينقل قوة الوصف بصورة فصيحة وطبيعية في عبارة «ربح عظيم».
- source_word: εὐσέβεια
  choice: التقوى
  rationale: تدل في السياق على حياة تتسم بتوقير الله والتوجه إليه، وهي المقابل العربي المألوف والواضح.
- source_word: μετὰ
  choice: مع
  rationale: تنقل معنى المصاحبة الذي تفيده μετά مع المضاف إليه.
- source_word: αὐταρκείας
  choice: القناعة
  rationale: تلائم شرح السياق اللاحق، أي الاكتفاء بما يتوفر من الضروريات، وتتجنب الإيحاء بالاستقلال عن الله الذي قد تحمله عبارة «الاكتفاء الذاتي».
theological_decisions:
- issue: دلالة αὐτάρκεια في السياق المسيحي
  choice: القناعة
  alternative: الاكتفاء أو الاكتفاء الذاتي
  rationale: الآيتان التاليتان تفسران المعنى بالرضا مع توفر القوت والكسوة، لا بمثال فلسفي قائم على الاستقلال الذاتي.
- issue: العلاقة بين التقوى والربح
  choice: التقوى المصحوبة بالقناعة هي نفسها ربح عظيم
  alternative: التقوى وسيلة إلى ربح عظيم حين تصحبها القناعة
  rationale: تسمح البنية اليونانية بالحديث عن الربح أو وسيلة الربح؛ والصياغة المختارة تحفظ التوتر والصدى مع الآية السابقة، من غير أن توحي بتأييد اتخاذ الدين أداةً للمنفعة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُعمل تركيب «أمّا... فهي» لإبراز المقابلة بالسياق السابق، مع إبقاء العبارة موجزة وحافظة للتوازي اليوناني.
