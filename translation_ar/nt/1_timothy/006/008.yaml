  yaml_path: translation/nt/1_timothy/006/008.yaml
  text: But if we have food and covering[a], we will be content with these.
translation:
  language: ar
  text: أمّا إذا كان لنا طعام وكساء[a]، فسنكتفي بهما.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «ما يسترنا»؛ فاللفظ اليوناني قد يعني الثياب، وقد يتسع ليشمل كل ما يغطي الإنسان، وربما المأوى أيضًا.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχοντες
  choice: إذا كان لنا
  rationale: اسم الفاعل يؤدي وظيفة ظرفية تحدد حال الفعل الرئيس، والصياغة الشرطية في العربية طبيعية وتحفظ عموم المعنى من غير أن تجعله تقريرًا سببيًا.
- source_word: δὲ
  choice: أمّا
  rationale: تفيد انتقالًا مع مقابلة لطيفة بما سبق، و«أمّا» تلائم العربية الفصيحة وتبرز التحول من الطمع إلى القناعة دون تشديد زائد.
- source_word: διατροφὰς
  choice: طعام
  rationale: تشير الكلمة إلى ما تقوم به المعيشة، ولا سيما الغذاء؛ و«طعام» واضحة وطبيعية في العربية المعاصرة.
- source_word: σκεπάσματα
  choice: كساء
  rationale: تدل الكلمة على ما يستر أو يغطي. و«كساء» طبيعية في السياق وتحافظ على أصل معنى التغطية، مع بيان احتمال المعنى الأوسع في الحاشية.
- source_word: τούτοις
  choice: بهما
  rationale: اسم الإشارة بصيغة الجمع يعود إلى الطعام والكساء بوصفهما الأمرين المذكورين، والمثنى في العربية هو التعبير الطبيعي الدقيق عن هذه الإحالة.
- source_word: ἀρκεσθησόμεθα
  choice: فسنكتفي
  rationale: تحفظ صيغة المستقبل الخبرية ومعنى الكفاية والقناعة، ولا تحول العبارة إلى أمر أو حث بصيغة «فلنكتفِ».
theological_decisions:
- issue: مدى معنى σκεπάσματα
  choice: كساء، مع حاشية تبين إمكان المعنى الأوسع لما يغطي الإنسان
  alternative: ثياب فقط، أو مأوى فقط
  rationale: لا ينبغي حصر اللفظ اليوناني في الثياب وحدها أو المأوى وحده؛ فالنص يتحدث عن الضروريات الأساسية، واللفظ قد يتسع لما يستر الإنسان وربما يشمل المأوى.
- issue: دلالة ἀρκεσθησόμεθα
  choice: 'مستقبل خبري: فسنكتفي'
  alternative: 'صيغة حث: فلنكتفِ'
  rationale: الصيغة اليونانية مستقبل مبني للمجهول ذو دلالة وسطية في الاستعمال، ولذلك تُحفظ قوة الخبر المستقبلي بدل إدخال صيغة أمر تفسيرية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعمل «أمّا إذا كان لنا» لصوغ التركيب الظرفي بصورة طبيعية، و«فسنكتفي» للمحافظة على المستقبل الخبري. وُضع مؤشر الحاشية [a] مباشرة بعد اللفظ المقصود.
