  text: εἴ τις ἑτεροδιδασκαλεῖ καὶ μὴ προσέρχεται ὑγιαίνουσι λόγοις, τοῖς τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, καὶ τῇ κατ’ εὐσέβειαν διδασκαλίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/003.yaml
  text: If anyone teaches a different doctrine and does not agree with sound words[a], those of our Lord Jesus the Messiah, and with the teaching that accords with godliness[b],
translation:
  language: ar
  text: إن كان أحدٌ يعلِّم تعليمًا مغايرًا، ولا يوافق الأقوال السليمة، أي أقوال ربِّنا يسوع المسيح[a]، والتعليم الموافق للتقوى[b]،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «المسيح» لقب معناه «الممسوح».
    reason: توضيح دلالة اللقب اليوناني Χριστός.
  - marker: b
    text: 'ويجوز: «التعليم المنسجم مع التقوى».'
    reason: بديل تعبيري لعبارة κατ’ εὐσέβειαν يحفظ معنى المطابقة والموافقة.
lexical_decisions:
- source_word: ἑτεροδιδασκαλεῖ
  choice: يعلِّم تعليمًا مغايرًا
  rationale: ينقل معنى تعليم شيء مختلف عن التعليم المقبول، من غير إضافة وصف «باطل» غير المصرَّح به في الفعل نفسه.
- source_word: προσέρχεται
  choice: يتمسَّك بـ
  rationale: الفعل يعني حرفيًا الاقتراب، لكنه هنا مع المجرور يفيد قبول التعليم والارتباط به؛ و«يتمسّك» تعبير عربي طبيعي يحفظ هذه القوة السياقية.
- source_word: ὑγιαίνουσι λόγοις
  choice: الكلمات السليمة
  rationale: يحفظ «الكلمات» مقابل λόγοις، وينقل استعارة الصحة في ὑγιαίνουσι بلفظ عربي مألوف في وصف الفكر والتعليم.
- source_word: τοῖς τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: أي كلمات ربِّنا يسوع المسيح
  rationale: يجعل العبارة بدلًا مفسرًا لـ«الكلمات السليمة»، ويصرّح بالمحذوف المفهوم في اليونانية لتكون العربية واضحة.
- source_word: Χριστοῦ
  choice: المسيح
  rationale: «المسيح» ترجمة عربية راسخة للقب Χριστός وتحفظ دلالته اللقبية، لا مجرد كونه جزءًا من اسم.
- source_word: κατ’ εὐσέβειαν
  choice: المنسجم مع التقوى
  rationale: يفيد κατά هنا الموافقة والانسجام؛ والصياغة لا تحسم العبارة على أنها سببية بمعنى أن التعليم يُنتج التقوى.
- source_word: διδασκαλίᾳ
  choice: التعليم
  rationale: لفظ واضح يشمل مضمون ما يُعلَّم، ويلائم المقابلة مع التعليم المغاير.
- source_word: εὐσέβειαν
  choice: التقوى
  rationale: تنقل معنى الحياة المتعبدة الموجَّهة نحو الله بلفظ عربي كتابي ومفهوم.
theological_decisions:
- issue: دلالة Χριστός في العبارة Ἰησοῦ Χριστοῦ
  choice: يسوع المسيح
  alternative: يسوع الممسوح
  rationale: «المسيح» هو المقابل العربي الموروث والواضح للقب، ويحفظ دلالة المسح من غير صياغة غريبة في العربية.
- issue: العلاقة التي تفيدها κατ’ بين التعليم والتقوى
  choice: التعليم المنسجم مع التقوى
  alternative: التعليم المؤدي إلى التقوى
  rationale: الاختيار يحفظ معنى الموافقة أو الانسجام ولا يضيف علاقة سببية قد تكون محتملة سياقيًا لكنها ليست لازمة نحويًا.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة وقورة. حُفظت استعارة سلامة الكلمات، واستُخدم «مغايرًا» بدل «باطلًا» تجنبًا لإضافة حكم غير ملفوظ به، مع إبقاء الجملة مفتوحة لأنها جزء من تركيب يمتد إلى الآيات التالية.
