  to: إن كان أحدٌ يعلِّم تعليمًا مغايرًا، ولا يوافق الأقوال السليمة، أي أقوال ربِّنا يسوع المسيح[a]، والتعليم الموافق للتقوى[b]،
  rationale: عُدِّلت العبارة الخاصة بـ προσέρχεται إلى «لا يوافق» لإبراز دلالة القبول أو الإذعان في السياق، واستُبدلت «الكلمات» بـ«الأقوال» لتحسين السلاسة العربية من غير تغيير في المعنى. كما وُحِّدت صياغة عبارة التعليم مع البديل الوارد في الحاشية، مع الإبقاء على تركيب الآية المفتوح.
