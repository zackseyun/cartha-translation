  - severity: low
    issue: «الكلمات السليمة» ممكنة، لكن «الأقوال السليمة» أيسر في سياق أقوال المسيح وتعليمه.
    rationale: λόγοις تعني كلمات أو أقوال، والسياق يصف مضمونًا وتعليمًا منسوبًا إلى الرب؛ لذا «الأقوال» عربية طبيعية وتحفظ المعنى.
