base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/021.yaml
  text: By professing it[a], some have missed the mark concerning the faith[c][b]. Grace be with you.
translation:
  language: ar
  text: التي ادّعى بعضهم امتلاكها، أخفقوا في إصابة الهدف فيما يتعلّق بالإيمان.[a][b] لتكن النعمة معكم.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أيضًا ترجمة «أخفقوا في إصابة الهدف» بـ«حادوا عن الإيمان» أو «ضلّوا». ويحافظ التعبير في المتن على صورة الفعل اليوناني.
    reason: lexical_alternative
  - marker: b
    text: يرجّح أن «الإيمان» هنا يعني الإيمان المسيحي بوصفه مجموع ما يؤمَن به، وقد يُفهم أيضًا بمعنى الإيمان الشخصي.
    reason: alternative_reading
  - marker: c
    text: 'ضمير المخاطب في النص اليوناني المعتمد بصيغة الجمع؛ وتقرأ بعض المخطوطات: «معك» بصيغة المفرد.'
    reason: textual_variant
lexical_decisions:
- source_word: ἥν
  choice: التي
  rationale: اسم موصول مؤنث مفرد يعود إلى «المعرفة» المذكورة في الآية السابقة، وقد أُبقي صريحًا كما في اليونانية.
- source_word: ἐπαγγελλόμενοι
  choice: ادّعاها
  rationale: الصيغة الوسطى في هذا السياق تفيد إعلان امتلاك تلك المعرفة أو الزعم بها، لا تقديم وعد.
- source_word: ἠστόχησαν
  choice: أخطأوا الهدف
  rationale: يحافظ التعبير على صورة الفعل اليوناني، أي عدم إصابة المقصود، مع وضوحه في العربية المعاصرة.
- source_word: περὶ τὴν πίστιν
  choice: في ما يخص الإيمان
  rationale: تنقل περί مع النصب معنى التعلّق والمرجعية، وتحافظ على لفظ «الإيمان» من غير حسم زائد لطبيعته.
- source_word: Ἡ χάρις
  choice: النعمة
  rationale: صيغة ختامية رسولية موجزة؛ أُبقي التعريف الموافق للنص اليوناني والمألوف عربيًا.
- source_word: μεθ’ ὑμῶν
  choice: معكم
  rationale: يحافظ على ضمير الجمع في النص المعتمد، مع إضمار فعل الكينونة على نحو طبيعي في الدعاء العربي.
theological_decisions:
- issue: مدلول «الإيمان» في عبارة περὶ τὴν πίστιν
  choice: الإبقاء على «الإيمان» بما يرجّح الإشارة إلى الإيمان المسيحي بوصفه مضمونًا معتقدًا
  alternative: الإيمان الشخصي أو الثقة الشخصية
  rationale: السياق السابق عن «المعرفة المسمّاة كذبًا» وسياق الرسائل الرعوية يرجّحان المعنى الموضوعي، لكن اللفظ اليوناني نفسه يسمح بمدلول أوسع، ولذلك ذُكر الاحتمال في الحاشية.
- issue: المخاطَب في البركة الختامية
  choice: صيغة الجمع «معكم»
  alternative: صيغة المفرد «معك»
  rationale: النص المعتمد يقرأ ضمير الجمع، مما قد يوسّع البركة لتشمل الجماعة، مع وجود قراءة مخطوطية بالمفرد تستحق التنبيه.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. حُفظ اسم الموصول الصريح وصورة «إصابة الهدف»، واستُعملت صيغة الجمع في البركة وفق النص المعتمد، مع بيان القراءة البديلة في الحاشية.
