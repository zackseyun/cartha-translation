  source_fidelity: 'المسودة تنقل عناصر النص الأساسية: اسم الموصول المؤنث العائد إلى «المعرفة» في الآية السابقة، والانحراف في شأن الإيمان، وخاتمة النعمة بصيغة الجمع. لكن «ادّعاها بعض الناس» أقل دقة في تمثيل ἐπαγγελλόμενοι؛ فالمعنى هو ادعاء امتلاك هذه المعرفة أو التظاهر بها، لا مجرد الادعاء بها بوجه عام. كما أن تركيب «فأخطأوا الهدف في ما يخص الإيمان» ثقيل في العربية.'
