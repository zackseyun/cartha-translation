reference: 1 Timothy 6:10
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ῥίζα γὰρ πάντων τῶν κακῶν ἐστιν ἡ φιλαργυρία, ἧς τινες ὀρεγόμενοι ἀπεπλανήθησαν ἀπὸ τῆς πίστεως καὶ ἑαυτοὺς περιέπειραν ὀδύναις πολλαῖς.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/010.yaml
  text: For the love of money is a root of all kinds of evils[a]; by craving it[c][b], some have wandered away from the faith and pierced themselves with many pains.
translation:
  language: ar
  text: لأن محبة المال أصلٌ لكل أنواع الشرور[a]؛ وإذ اشتهاها بعض الناس، ضلّوا عن الإيمان[b]، وطعنوا أنفسهم بأوجاع كثيرة[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو بحسب الصياغة التقليدية: «لأن محبة المال أصل كل الشر». غير أن اليونانية تسمح على نحو أرجح بمعنى «أصل لكل أنواع الشرور»، فلا يلزم منها أن لكل شر سببًا واحدًا.'
    reason: alternative_reading
  - marker: b
    text: 'أو: «حادوا عن الإيمان». وقد تشير العبارة هنا إلى الإيمان المسيحي، مع إمكان فهمها أيضًا من جهة إيمان الشخص.'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «بأحزان كثيرة» أو «بآلام كثيرة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίζα
  choice: أصلٌ
  rationale: جاءت الكلمة خبرًا بلا أداة تعريف قبل الفعل، لذا صيغت نكرةً لتفيد أن محبة المال مصدر من مصادر الشرور، لا المصدر الوحيد لكل شر.
- source_word: πάντων τῶν κακῶν
  choice: لكل أنواع الشرور
  rationale: ينقل هذا التعبير الجمع اليوناني على نحو طبيعي، ويبيّن اتساع أنواع الشرور من غير تحويل العبارة إلى دعوى أن كل شر بلا استثناء ناشئ من سبب واحد.
- source_word: φιλαργυρία
  choice: محبة المال
  rationale: ترجمة شفافة للفظ الذي يدل حرفيًا على حب الفضة أو المال، وهي أدق من «الجشع» الأوسع دلالة.
- source_word: ὀρεγόμενοι
  choice: إذ اشتهاها
  rationale: الفعل يدل على التطلع أو الرغبة الشديدة؛ و«اشتهاها» يحفظ قوة الرغبة، والضمير يعود إلى محبة المال.
- source_word: ἀπεπλανήθησαν ἀπὸ τῆς πίστεως
  choice: ضلّوا عن الإيمان
  rationale: يحفظ صورة الانحراف والابتعاد التي في الفعل وحرف الجر، بصياغة عربية موجزة وطبيعية.
- source_word: πίστεως
  choice: الإيمان
  rationale: التعريف والسياق في الرسائل الرعوية يرجحان الإشارة إلى الإيمان المسيحي بوصفه مضمونًا معترفًا به، مع بقاء إمكان فهم اللفظ من جهة إيمان الشخص.
- source_word: περιέπειραν
  choice: طعنوا أنفسهم
  rationale: يحفظ الصورة الحسية القوية للفعل، الذي يعني النفاذ بالطعن أو الاختراق، من غير تهويل زائد.
- source_word: ὀδύναις πολλαῖς
  choice: بأوجاع كثيرة
  rationale: «أوجاع» تستوعب الألم والكرب والمعاناة ولا تقصر المعنى على الحزن العاطفي وحده.
theological_decisions:
- issue: مدى القول في صلة محبة المال بالشرور
  choice: محبة المال أصل لكل أنواع الشرور، وليست بالضرورة الأصل الوحيد لكل شر بلا استثناء.
  alternative: محبة المال هي أصل كل الشر.
  rationale: تنكير ῥίζα والجمع πάντων τῶν κακῶν يسمحان، في هذا السياق، بصياغة تتناول شتى أنواع الشرور ولا تفرض أن لجميع الشرور علة واحدة.
- issue: دلالة τῆς πίστεως
  choice: «الإيمان» بوصفه الإيمان المسيحي الذي حادوا عنه.
  alternative: الإيمان بمعنى الثقة الشخصية بالله.
  rationale: أداة التعريف واستعمال اللفظ في الرسائل الرعوية يرجحان المعنى الموضوعي، لكن المتن لا يضيف شرحًا عقائديًا يحسم كل تداخل ممكن بين المعنيين.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. استُعملت ألفاظ مألوفة مثل «محبة المال» و«ضلّوا»، مع إبقاء الصورة البلاغية القوية في «طعنوا أنفسهم». وُضعت جميع علامات الحواشي في المتن وطابقت الحواشي.
