  text: constant friction among people whose minds are corrupted and who have been deprived of the truth[b][a], imagining that godliness is a means of gain.
translation:
  language: ar
  text: ومماحكاتٌ متواصلة بين أناس فسدت عقولهم وحُرموا الحق، يظنون أن التقوى وسيلةٌ للكسب.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يظنون أن التقوى ربحٌ» أو «مصدرٌ للربح». أي إنهم يعاملون التقوى كشيء يستغلونه لتحقيق منفعة مادية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διαπαρατριβαὶ
  choice: مماحكات متواصلة
  rationale: يدل اللفظ النادر على احتكاكات أو مجادلات مستمرة؛ و«مماحكات متواصلة» تعبير عربي طبيعي يحفظ معنى النزاع المتكرر.
- source_word: διεφθαρμένων ... τὸν νοῦν
  choice: فسدت عقولهم
  rationale: ينقل حالة الفساد المستقرة الناتجة عن الفعل، ويحفظ البعد الفكري والأخلاقي من غير مبالغة بلفظ أشد.
- source_word: ἀπεστερημένων τῆς ἀληθείας
  choice: حُرموا الحق
  rationale: يحفظ المبني للمجهول وحالة الحرمان القائمة، ويترجم الاسم المعرّف بوصفه «الحق» المقصود في السياق.
- source_word: νομιζόντων
  choice: يظنون
  rationale: تعبير عربي واضح يدل في السياق على اعتقادهم الخاطئ، من غير إضافة تفسيرية إلى المتن.
- source_word: πορισμὸν
  choice: وسيلة للكسب
  rationale: يعكس معنى الربح أو وسيلة تحصيله، ويُظهر معاملتهم التقوى أداةً لمنفعة مادية.
- source_word: εὐσέβειαν
  choice: التقوى
  rationale: لفظ عربي راسخ يدل على الورع والحياة المتجهة إلى الله، ويحفظ القيمة الإيجابية للكلمة اليونانية؛ فالخلل في استغلالها لا في التقوى نفسها.
theological_decisions:
- issue: هل تشير εὐσέβεια إلى تقوى حقيقية أم إلى تدين ظاهري؟
  choice: التقوى
  alternative: التدين أو العبادة الظاهرية
  rationale: الكلمة اليونانية إيجابية في ذاتها، والنص يدين موقف الذين يجعلونها وسيلة للكسب؛ لذلك لا ينبغي أن تسبق الترجمة فتحوّلها إلى رياء أو مظهر خارجي.
- issue: درجة الحكم الأخلاقي في διεφθαρμένων
  choice: فسدت عقولهم
  alternative: فاسدو الذهن أو منحطو العقل
  rationale: «فسدت» تحافظ على الحكم الأخلاقي والفكري القوي وعلى الحالة الناتجة، من غير إدخال صياغة عقدية أو تشديد يتجاوز اللفظ.
- issue: طبيعة πορισμός
  choice: وسيلة للكسب
  alternative: ربح
  rationale: يبقى الأصل محتملًا لمعنى الربح نفسه أو وسيلة تحصيله؛ اختيرت الصياغة الأداتية لملاءمة السياق، مع إثبات البديل في الحاشية.
translation_notes:
  register: العربية فصحى حديثة واضحة وموقرة. اختيرت «مماحكات» لتصوير النزاع المتكرر، و«التقوى» للمصطلح الرعوي المألوف. وُضع مؤشر الحاشية بعد العبارة التي يشرحها، مع الحفاظ على ترابط الآية بوصفها امتدادًا نحويًا للسياق السابق.
