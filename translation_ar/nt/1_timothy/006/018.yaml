  text: أن يفعلوا الخير، وأن يكونوا أغنياء بالأعمال الصالحة، وأن يكونوا أسخياء، مستعدين للمشاركة،
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαθοεργεῖν
  choice: أن يفعلوا الخير
  rationale: يحافظ على القوة الفعلية للمصدر اليوناني، ويؤدي المعنى بعبارة عربية واضحة وطبيعية من غير تحويله إلى تعبير اسمي.
- source_word: πλουτεῖν
  choice: أن يكونوا أغنياء
  rationale: يحفظ صورة الغنى المقصودة في الفعل، وما تنشئه من مقابلة مع الغنى المادي في السياق المحيط.
- source_word: ἐν ἔργοις καλοῖς
  choice: بالأعمال الصالحة
  rationale: تعبير عربي مألوف وواضح يبين المجال الذي ينبغي أن يكونوا فيه أغنياء؛ واستعمال الباء طبيعي مع وصف الغنى.
- source_word: εὐμεταδότους
  choice: أسخياء
  rationale: ينقل الاستعداد إلى العطاء بسخاء في لفظ عربي موجز ومفهوم.
- source_word: κοινωνικούς
  choice: مستعدين للمشاركة
  rationale: يعبر عن الميل والاستعداد إلى إشراك الآخرين وتقاسم الموارد معهم، ولا يحصر اللفظ في مجرد العطاء.
- source_word: εὐμεταδότους εἶναι, κοινωνικούς
  choice: أن يكونوا أسخياء، مستعدين للمشاركة
  rationale: 'يحافظ على الصفتين المتقاربتين من غير دمجهما: الأولى تبرز السخاء في العطاء، والثانية تبرز الاستعداد للمشاركة.'
