source:
  edition: SBLGNT
  text: Ὅσοι εἰσὶν ὑπὸ ζυγὸν δοῦλοι, τοὺς ἰδίους δεσπότας πάσης τιμῆς ἀξίους ἡγείσθωσαν, ἵνα μὴ τὸ ὄνομα τοῦ θεοῦ καὶ ἡ διδασκαλία βλασφημῆται.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/001.yaml
  text: All who are servants under a yoke should regard their own masters as worthy of all honor[c][b][a], so that the name of God and the teaching may not be slandered.
translation:
  language: ar
  text: فليعدَّ جميعُ العبيد الذين هم تحت نيرٍ سادتَهم مستحقين كلَّ إكرام، لئلا يُجدَّف على اسم الله والتعليم.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'أو: «العقيدة».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «يُساء القول في اسم الله والتعليم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλοι
  choice: عبيد
  rationale: لفظ «عبيد» يعبّر بوضوح عن حالة الاستعباد التي تؤكدها عبارة «تحت نير»، بخلاف «خدم» التي قد توحي بخدمة حرة.
- source_word: ὑπὸ ζυγὸν
  choice: تحت نير
  rationale: يحافظ على استعارة النير في اليونانية وعلى دلالتها على الخضوع والاستعباد.
- source_word: τοὺς ἰδίους δεσπότας
  choice: سادتهم هم
  rationale: «سادتهم» تؤدي معنى δεσπότας في سياق العبودية، وإضافة «هم» تؤكد دلالة ἰδίους على سادتهم الخاصين لا السادة عمومًا.
- source_word: πάσης τιμῆς ἀξίους
  choice: أهلًا لكل إكرام
  rationale: صياغة عربية طبيعية تحفظ معنى الاستحقاق وشمول الإكرام.
- source_word: ἡγείσθωσαν
  choice: ليحسب
  rationale: ينقل صيغة الأمر الدالة على تبني تقدير مستمر، مع مطابقة الفعل لجمع غير العاقل لفظًا بحسب الأسلوب العربي الفصيح.
- source_word: τὸ ὄνομα τοῦ θεοῦ
  choice: اسم الله
  rationale: ترجمة مباشرة تحفظ المفهوم الكتابي المتعلق باسم الله وسمعته.
- source_word: ἡ διδασκαλία
  choice: التعليم
  rationale: لفظ واضح وعام يترجم διδασκαλία من غير تحميله إيحاءً اصطلاحيًا زائدًا قد يصاحب «العقيدة».
- source_word: βλασφημῆται
  choice: يُجدَّف على
  rationale: يحفظ القوة الدينية والأخلاقية للفعل اليوناني، ويصلح هنا مع اسم الله والتعليم معًا، مع بيان البديل الأوسع في الحاشية.
- source_word: Ὅσοι εἰσὶν
  choice: جميع الذين هم
  rationale: ينقل بوضوح القوة الشمولية للعبارة اليونانية.
theological_decisions:
- issue: ترجمة δοῦλοι في سياق اجتماعي وأخلاقي حساس
  choice: عبيد
  alternative: خدم أو عبيد مملوكون
  rationale: ذكر «النير» يجعل حالة الاستعباد صريحة؛ والترجمة تصف الواقع الاجتماعي المفترض في النص ولا تقرّه أخلاقيًا.
- issue: ترجمة διδασκαλία
  choice: التعليم
  alternative: العقيدة
  rationale: «التعليم» يحفظ المعنى العام للرسالة التي يجري الحديث عن سمعتها، من غير تضييقه إلى مدلول اصطلاحي لاحق.
- issue: ترجمة βλασφημῆται مع مفعولين مختلفين
  choice: يُجدَّف على
  alternative: يُفترى عليه أو يُساء الكلام عنه
  rationale: يحافظ «يُجدَّف» على قوة اللفظ، ولا سيما مع اسم الله، مع بقاء احتمال معنى التعيير أو الإساءة في السياق مثبتًا في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كتابية رصينة. حُفظت استعارة «النير»، واستُعمل «عبيد» للدقة التاريخية والسياقية. وُضعت علامات الحواشي [a][b][c] في نهاية الجملة لأن كل حاشية تتصل بلفظ واضح في النص القصير.
