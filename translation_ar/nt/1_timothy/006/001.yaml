revisions:
- from: ليحسب جميع الذين هم عبيد تحت نير سادتهم هم أهلًا لكل إكرام، لئلا يُجدَّف على اسم الله والتعليم.[a][b][c]
  to: فليعدَّ جميعُ العبيد الذين هم تحت نيرٍ سادتَهم مستحقين كلَّ إكرام، لئلا يُجدَّف على اسم الله والتعليم.[b][c]
  rationale: 'صُحح التركيب ليؤدي فعل الأمر اليوناني لجمع العقلاء، وليعبّر بوضوح عن أن العبيد يعدّون سادتهم مستحقين للإكرام. وأزيلت «هم» الزائدة بعد «سادتهم»، إذ إن الإضافة نفسها تؤدي معنى «سادتهم الخاصين». ونُقلت إحالات الحواشي إلى المواضع ذات الصلة؛ وينبغي أن تُلحق [a] بكلمة «العبيد» في تنسيق النشر النهائي، فتكون الصيغة: «العبيد[a] ... التعليم[b] ... يُجدَّف[c]».'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:25:56Z'
review_pass:
  verdict: revise
  source_fidelity: 'المسودة تحافظ إجمالًا على عناصر النص اليوناني: شمول المخاطَبين، والعبودية المقترنة بالنير، والسادة الخاصون، ووجوب الإكرام، والغرض المتعلق باسم الله والتعليم. لكن تركيب «ليحسب جميع الذين هم عبيد ... سادتهم هم أهلًا» مضطرب نحويًا؛ إذ لا يطابق الفعل جمع العقلاء، و«هم» زائدة ومربكة، كما أن بناء المفعولين لا يستقيم على هذه الصورة.'
  naturalness: التعديل المقترح فصيح وواضح في العربية المعيارية المعاصرة، ويجعل الأمر الجماعي وعلاقة العبيد بسادتهم ومعنى التقدير ظاهرًا بلا التباس. وتوضع علامات الحواشي بجوار الألفاظ التي تشرحها بدل جمعها في آخر الجملة.
  terminology: «عبيد» و«سادة» مناسبان للسياق التاريخي وللدلالة التي يبرزها «تحت نير». و«التعليم» ترجمة سليمة لـ διδασκαλία. أما «يُجدَّف على» فيحافظ على قوة βλασφημῆται، مع إمكان بيان البديل الأوسع في الحاشية.
