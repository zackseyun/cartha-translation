  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: παραγγέλλω σοι ἐνώπιον τοῦ θεοῦ τοῦ ⸀ζῳογονοῦντος τὰ πάντα καὶ Χριστοῦ Ἰησοῦ τοῦ μαρτυρήσαντος ἐπὶ Ποντίου Πιλάτου τὴν καλὴν ὁμολογίαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/013.yaml
  text: I charge you before God[a], who gives life to all things, and Messiah Jesus, who testified to the good confession before Pontius Pilate[c][b],
translation:
  language: ar
  text: أوصيك أمام الله، الذي يهب الحياة لكل شيء[a]، وأمام المسيح يسوع، الذي شهد بالاعتراف الحسن أمام بيلاطس البنطي[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «الذي يبقي كل شيء حيًّا» أو «الذي يحيي كل شيء». يحتمل الفعل اليوناني منح الحياة أو حفظها.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا: «في عهد بيلاطس البنطي» أو «تحت حكم بيلاطس البنطي».'
    reason: alternative_reading
lexical_decisions:
- source_word: παραγγέλλω σοι
  choice: أوصيك
  rationale: ينقل معنى التوجيه الملزم ذي النبرة الوقورة، وهو أنسب في العربية من صياغة جافة مثل «آمرك» في هذا الاستحلاف الرسمي.
- source_word: ἐνώπιον
  choice: أمام
  rationale: صياغة موجزة وطبيعية تفيد الحضور والمثول بين يدي الله والمسيح يسوع.
- source_word: ζῳογονοῦντος τὰ πάντα
  choice: الذي يهب الحياة لكل شيء
  rationale: يحافظ على المعنى الواسع للفعل، أي إعطاء الحياة، من غير حصره صراحة في بدء الإحياء أو استدامة الحياة.
- source_word: Χριστοῦ Ἰησοῦ
  choice: المسيح يسوع
  rationale: «المسيح» في العربية لقب واضح الدلالة، ويحافظ على ترتيب الأصل اليوناني.
- source_word: μαρτυρήσαντος
  choice: الذي شهد
  rationale: ينقل معنى أداء الشهادة ويحافظ على النبرة القضائية في سياق بيلاطس.
- source_word: τὴν καλὴν ὁμολογίαν
  choice: بالاعتراف الحسن
  rationale: «الاعتراف» يقابل ὁμολογία ويحافظ على الصلة اللفظية والموضوعية باعتراف تيموثاوس في السياق، واستعمال الباء يجعل العبارة عربية سليمة مع «شهد».
- source_word: ἐπὶ Ποντίου Πιλάτου
  choice: أمام بيلاطس البنطي
  rationale: يناسب سياق الشهادة القضائية ويعبّر عن وقوعها في حضرة بيلاطس، مع إثبات البدائل الممكنة في الحاشية.
theological_decisions:
- issue: دلالة ζῳογονοῦντος
  choice: الذي يهب الحياة لكل شيء
  alternative: الذي يبقي كل شيء حيًّا؛ أو الذي يحيي كل شيء
  rationale: اسم الفاعل اليوناني يحتمل منح الحياة أو إبقاء الأحياء في الحياة؛ فاختير تعبير واسع، وحُفظت الدلالات الأضيق في الحاشية.
- issue: دلالة ἐπὶ مع بيلاطس البنطي
  choice: أمام بيلاطس البنطي
  alternative: في عهد بيلاطس البنطي؛ أو تحت حكم بيلاطس البنطي
  rationale: السياق القضائي يرجّح الحضور أمام بيلاطس، لكن التركيب اليوناني قد يحمل أيضًا معنى زمنيًا أو سلطانيًا، لذلك لم يُطمس الاحتمال الآخر.
- issue: ترجمة Χριστός
  choice: المسيح
  alternative: لا بديل دلالي لازم في العربية
  rationale: اللفظ العربي «المسيح» يحفظ معنى اللقب نفسه ولا يحتاج إلى التفريق الإنجليزي بين Christ وMessiah.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حافظت الصياغة على طابع الوصية الرسمية وعلى التوازي بين «أمام الله» و«أمام بيلاطس»، من غير إدخال مصطلحات طائفية.
