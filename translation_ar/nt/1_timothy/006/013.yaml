  source_fidelity: 'النص ينقل عناصر اليونانية كلها بأمانة: الوصية الموجَّهة إلى المخاطَب، والوقوف في حضرة الله والمسيح يسوع، ووصف الله بأنه واهب الحياة لـ«كل شيء»، وشهادة المسيح بالاعتراف الحسن في سياق بيلاطس البنطي. وترجمة «أمام بيلاطس البنطي» ممكنة سياقيًا لـἐπὶ مع المضاف إليه، مع حفظ البدائل الزمنية/السلطوية في الحاشية.'
