  text: ἀποθησαυρίζοντας ἑαυτοῖς θεμέλιον καλὸν εἰς τὸ μέλλον, ἵνα ἐπιλάβωνται τῆς ⸀ὄντως ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/019.yaml
  text: storing up for themselves a good foundation for the future[a], so that they may take hold of the life that is truly life.
translation:
  language: ar
  text: مُدَّخرين لأنفسهم أساسًا حسنًا للمستقبل، لكي يتمسّكوا بالحياة التي هي حقًّا حياة.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن ترجمتها أيضًا: «بالحياة الحقيقية».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποθησαυρίζοντας
  choice: مُدَّخرين
  rationale: اسم فاعل يفيد الاستمرار ويواصل الحثّ الوارد في السياق السابق، ويحفظ معنى جمع الكنز للمستقبل بعبارة عربية واضحة.
- source_word: ἑαυτοῖς
  choice: لأنفسهم
  rationale: يحفظ دلالة ضمير الانعكاس في حالة المجرور، أي إن منفعة هذا الادخار تعود إليهم.
- source_word: θεμέλιον καλὸν
  choice: أساسًا حسنًا
  rationale: يحافظ على صورة البناء في θεμέλιον، وينقل καλόν بمعنى ما هو جيد وجدير وثابت دون إضافة تفسير.
- source_word: εἰς τὸ μέλλον
  choice: للمستقبل
  rationale: ينقل المعنى التطلعي العام للعبارة، مع إبقاء الإيحاء الأخروي ممكنًا من غير تقييدها صراحةً بـ«الدهر الآتي».
- source_word: ἐπιλάβωνται
  choice: يتمسّكوا
  rationale: ينقل صورة الإمساك القوي المقصودة في الفعل الأوسط، وهو تعبير عربي طبيعي يلائم سياق الحث.
- source_word: τῆς ὄντως ζωῆς
  choice: بالحياة التي هي حقًّا حياة
  rationale: يحفظ الاسم الصريح ζωή وتوكيد ὄντως، وينقل المفارقة المقصودة بين ما يبدو حياة والحياة الحقيقية دون تسطيحها.
theological_decisions:
- issue: هل تُفسَّر εἰς τὸ μέλλον تفسيرًا أخرويًا صريحًا؟
  choice: للمستقبل
  alternative: للدهر الآتي
  rationale: السياق يحمل بُعدًا أخرويًا، لكن العبارة اليونانية لا تذكر «الدهر» صراحةً؛ لذلك تُرك مداها الدلالي مفتوحًا.
- issue: كيفية نقل τῆς ὄντως ζωῆς
  choice: بالحياة التي هي حقًّا حياة
  alternative: بالحياة الحقيقية
  rationale: الصياغة المختارة تحافظ على التكرار الدلالي المقصود وعلى التوتر بين الحياة الظاهرة والحياة الحقة، بدل اختزاله إلى صفة واحدة.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ووقورة. أُبقيت استعارتا الادخار والأساس، ووُضع رمز الحاشية عند العبارة التي تشرحها الحاشية.
