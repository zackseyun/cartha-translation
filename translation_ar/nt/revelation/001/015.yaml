lexical_decisions:
- source_word: πόδες
  choice: قدماه
  rationale: المعنى المعجمي المباشر هو «القدمان»، وهو الأنسب لوصف الهيئة في الرؤيا.
- source_word: ὅμοιοι
  choice: كـ
  rationale: تفيد أداة التشبيه العربية معنى المشابهة بوضوح ومن غير إثقال العبارة بفعل زائد.
- source_word: χαλκολιβάνῳ
  choice: النحاس المصقول
  rationale: اللفظة اليونانية نادرة ودلالتها المعدنية الدقيقة غير يقينية؛ و«النحاس المصقول» ينقل صورة المعدن اللامع من غير الجزم بتركيب سبيكة محددة.
- source_word: ὡς ἐν καμίνῳ πεπυρωμένης
  choice: كأنه أُحمي في أتون
  rationale: ينقل التشبيه وصورة المعدن الذي عرّضته نار الأتون لحرارة شديدة، مع تجنب حصر الفعل في التنقية وحدها.
- source_word: φωνή
  choice: صوته
  rationale: في الاستعمال الأول تشير اللفظة إلى صوت الشخص الموصوف، ولذلك يناسبها «صوته».
- source_word: ὡς φωνὴ ὑδάτων πολλῶν
  choice: كصوت مياه كثيرة
  rationale: يحافظ على تكرار لفظ «الصوت» وعلى صورة «المياه الكثيرة» الكتابية، من غير تضييقها إلى هدير البحر أو الشلال.
theological_decisions:
- issue: تكرار φωνή في التشبيه الأخير
  choice: وصوته كصوت مياه كثيرة
  alternative: وصوته كدوي مياه كثيرة
  rationale: الصياغة المختارة تحفظ التكرار والصورة المهيبة المقصودة في وصف ابن الإنسان الممجَّد، ولا تعيّن ظاهرة طبيعية بعينها؛ أما «دوي» فتوضح شدة الصوت لكنها تفسيرية بدرجة أكبر.
- issue: ماهية المعدن في χαλκολίβανον
  choice: النحاس المصقول
  alternative: البرونز المتوهج
  rationale: هوية المعدن أو السبيكة غير محسومة، فلا ينبغي بناء دلالة لاهوتية على تركيب معدني محدد. تنقل الصياغة المختارة اللمعان مع إبقاء عدم اليقين موضحًا في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة رؤيوية مهيبة. استُعمل «أتون» لأنه اللفظ العربي الموجز والمألوف كتابيًا للفرن شديد الحرارة، وحُفظت صورة «مياه كثيرة» بدل تفسيرها بالأمواج أو الشلال.
