  text: καὶ ἐποίησεν ἡμᾶς βασιλείαν, ἱερεῖς τῷ θεῷ καὶ πατρὶ αὐτοῦ— αὐτῷ ἡ δόξα καὶ τὸ κράτος εἰς τοὺς αἰῶνας ⸂τῶν αἰώνων⸃· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/006.yaml
  text: and made us a kingdom[a], priests to his God and Father—to him be the glory and the dominion forever and ever[b]. Amen.
translation:
  language: ar
  text: وجعلَنا مملكةً[a]، كهنةً لإلهه وأبيه—فله المجد والسلطان إلى أبد الآبدين[b]. آمين.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ بعض المخطوطات المتأخرة: «ملوكًا وكهنةً» بدلًا من «مملكةً، كهنةً». ويتبع المتن هنا القراءة اليونانية المعطاة.'
    reason: textual_variant
  - marker: b
    text: 'حرفيًا: «إلى دهور الدهور».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησεν
  choice: جعل
  rationale: صيغة الماضي اليونانية تدل هنا على فعل منجز ضمن سياق التمجيد، و«جعل» تنقل معنى التكوين أو الإقامة على حالٍ معيّنة من غير إضافة دلالة زمنية غير مصرّح بها.
- source_word: βασιλείαν
  choice: مملكةً
  rationale: الاسم مفرد ويعني «مملكة» أو «ملكوتًا»، لا «ملوكًا». واختيار «مملكة» يحافظ على الهوية الجماعية للمؤمنين وعلى الصلة المحتملة بخروج 19:6.
- source_word: ἱερεῖς
  choice: كهنةً
  rationale: ينقل المعنى الكهنوتي المباشر للاسم الجمع، ويحفظ صورة الجماعة التي أقامها المسيح للخدمة أمام الله.
- source_word: τῷ θεῷ καὶ πατρὶ αὐτοῦ
  choice: لإلهه وأبيه
  rationale: اللام تعبّر عن التخصيص والاتجاه في الخدمة، والضمير في «إلهه وأبيه» يعود بحسب السياق إلى يسوع المسيح، مع إبقاء تركيب اليونانية وقوته من غير تسوية تفسيرية.
- source_word: αὐτῷ
  choice: فله
  rationale: صيغة عربية طبيعية للإسناد التمجيدي في الجملة الاسمية، والفاء تربط التمجيد بما سبقه.
- source_word: δόξα
  choice: المجد
  rationale: المقابل العربي المألوف والدقيق في صيغ التمجيد.
- source_word: κράτος
  choice: السلطان
  rationale: يدل اللفظ في سياق التمجيد على القوة السيادية الحاكمة؛ و«السلطان» أوضح هنا من «القوة» العامة.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: إلى أبد الآبدين
  rationale: تعبير عربي فصيح ومفهوم يدل على الدوام الذي لا نهاية له، مع إثبات الصياغة الأقرب حرفيًا في الحاشية.
- source_word: ἀμήν
  choice: آمين
  rationale: لفظ تعبدي مستقر في العربية يؤدي وظيفة التصديق والتوكيد الختامي.
theological_decisions:
- issue: مرجع الضمير في «إلهه وأبيه»
  choice: يعود الضمير إلى يسوع المسيح المذكور في السياق السابق، فيكون المؤمنون كهنةً لإله يسوع وأبيه.
  alternative: صياغة العبارة «لله أبيه» بما قد يخفف التوازي بين الاسمين.
  rationale: يحافظ النص على أقرب مرجع نحوي وسياقي وعلى التمييز العلائقي الذي تعبّر عنه اليونانية، من غير إدخال شرح عقائدي في المتن.
- issue: طبيعة مكانة الجماعة
  choice: «مملكةً، كهنةً» وفق القراءة اليونانية المعطاة.
  alternative: «ملوكًا وكهنةً» بحسب قراءة نصية متأخرة مألوفة.
  rationale: النص المزوّد يقرأ βασιλείαν بصيغة المفرد، ولذلك ينبغي إبراز الهوية الجماعية بوصف المؤمنين مملكةً وكهنة، لا استبدالها بقراءة «ملوك».
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُخدمت «مملكة» بدل «ملكوت» لتفادي احتمال فهمها على أنها نطاق مجرد ولإبراز الجماعة بوصفها كيانًا ملكيًا، مع إبقاء التراكيب اللاهوتية كما في المصدر وعدم تسويتها تفسيريًا.
