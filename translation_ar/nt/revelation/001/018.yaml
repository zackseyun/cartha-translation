  text: καὶ ὁ ζῶν— καὶ ἐγενόμην νεκρὸς καὶ ἰδοὺ ζῶν εἰμι εἰς τοὺς αἰῶνας τῶν ⸀αἰώνων— καὶ ἔχω τὰς κλεῖς τοῦ θανάτου καὶ τοῦ ᾅδου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/018.yaml
  text: and the Living One—I became dead[a], and behold[c][b], I am alive forever and ever—and I have the keys of death and of Hades.
translation:
  language: ar
  text: والحيّ— وقد صرتُ ميتًا[a]، وها أنا حيّ إلى أبد الآبدين[b]، ولي مفاتيح الموت وعالم الأموات[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كنتُ ميتًا». والأقرب إلى اللفظ اليوناني: «صرتُ ميتًا»، وفيه إبراز للانتقال إلى الموت.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «إلى دهور الدهور»، وهو تعبير يفيد دوامًا لا نهاية له.'
    reason: lexical_alternative
  - marker: c
    text: أي مقرّ الأموات أو عالمهم؛ ولا تشير الكلمة هنا تحديدًا إلى العقاب النهائي.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ζῶν
  choice: الحيّ
  rationale: اسم فاعل معرّف يعمل لقبًا؛ وتحافظ «الحيّ» على قوة اللقب وعلى صلته بوصف الله بأنه الحي، من غير تحويله إلى جملة خبرية عادية.
- source_word: ἐγενόμην νεκρός
  choice: صرتُ ميتًا
  rationale: تنقل معنى الانتقال إلى حالة الموت في الفعل γίνομαι، بدل الاكتفاء بوصف حالة سابقة كما في «كنت ميتًا».
- source_word: ἰδού
  choice: ها أنا
  rationale: تؤدي وظيفة التنبيه والإشارة الحية في اليونانية، وهي هنا أفصح وأطبع بالعربية من ترجمة حرفية منفصلة مثل «انظر».
- source_word: ζῶν εἰμι
  choice: أنا حيّ
  rationale: صياغة عربية طبيعية تعبّر عن الحالة الحاضرة، وتحافظ على المقابلة مع «صرت ميتًا».
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: إلى أبد الآبدين
  rationale: تعبير عربي راسخ ومفهوم ينقل الصيغة اليونانية التوكيدية الدالة على دوام لا نهاية له.
- source_word: κλεῖς
  choice: مفاتيح
  rationale: المقابل المباشر للكلمة، وتفيد الصورة في السياق السلطان والتحكم.
- source_word: τοῦ θανάτου
  choice: الموت
  rationale: نقل مباشر للمضاف إليه، من غير فرض تشخيص للموت لا يوجبه النص.
- source_word: τοῦ ᾅδου
  choice: عالم الأموات
  rationale: ينقل مدلول ᾅδης بوصفه مقرّ الأموات أو عالمهم، ويتجنب الخلط بينه وبين العقاب النهائي أو القبر المادي وحده.
theological_decisions:
- issue: ترجمة ᾅδης في السياق الأخروي
  choice: عالم الأموات
  alternative: الهاوية؛ القبر؛ جهنم
  rationale: يحافظ هذا الاختيار على التمييز في النص بين الموت وعالم الأموات، ولا يساوي ᾅδης بالعقاب النهائي ولا يختزله في موضع الدفن الجسدي.
translation_notes:
  register: لغة عربية فصحى حديثة واضحة ذات نبرة مهيبة تلائم سفر الرؤيا. استُعملت «ها أنا» لإبقاء قوة التنبيه في ἰδού بصورة طبيعية، و«عالم الأموات» لتمييز ᾅδης من جهنم ومن القبر وحده.
