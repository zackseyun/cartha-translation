source:
  edition: SBLGNT
  text: λεγούσης· Ὃ βλέπεις γράψον εἰς βιβλίον καὶ πέμψον ταῖς ἑπτὰ ἐκκλησίαις, εἰς Ἔφεσον καὶ εἰς Σμύρναν καὶ εἰς Πέργαμον καὶ εἰς Θυάτειρα καὶ εἰς Σάρδεις καὶ εἰς Φιλαδέλφειαν καὶ εἰς Λαοδίκειαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/011.yaml
  text: 'saying[a], “What you see[b], write in a book and send it to the seven churches: to Ephesus and to Smyrna and to Pergamum and to Thyatira and to Sardis and to Philadelphia and to Laodicea.”'
translation:
  language: ar
  text: 'قائلًا: «ما تراه، اكتبه في كتاب[a] وأرسله إلى الكنائس السبع: إلى أفسس، وإلى سميرنا، وإلى برغامون[b]، وإلى ثياتيرا، وإلى ساردس، وإلى فيلادلفيا، وإلى لاودكية».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «في درج»؛ فاللفظة اليونانية βιβλίον قد تشير إلى درج أو كتاب أو وثيقة مكتوبة.
    reason: lexical_alternative
  - marker: b
    text: ترد «برغامس» في بعض الترجمات العربية التقليدية.
    reason: alternative_reading
lexical_decisions:
- source_word: λεγούσης
  choice: قائلًا
  rationale: اسم فاعل حاضر يواصل وصف الصوت المذكور في السياق السابق. صيغته العربية هنا تلائم «الصوت» بوصفه مذكرًا في العربية، من غير تعيين المتكلم بما يتجاوز النص.
- source_word: Ὃ βλέπεις
  choice: ما تراه
  rationale: صياغة عربية طبيعية تحفظ عموم مضمون الرؤيا، ولا تحصر الأمر في مشهد واحد.
- source_word: γράψον
  choice: اكتبه
  rationale: فعل أمر مباشر؛ أُثبت ضمير المفعول العائد إلى «ما تراه» ليكون التعبير طبيعيًا وواضحًا بالعربية.
- source_word: εἰς βιβλίον
  choice: في كتاب
  rationale: لفظة βιβλίον قد تدل على كتاب أو درج أو وثيقة مكتوبة؛ اختير «كتاب» لوضوحها المعاصر، مع إثبات «درج» في الحاشية.
- source_word: πέμψον
  choice: وأرسله
  rationale: فعل أمر مباشر، والضمير يعود إلى المكتوب، وهو لازم لسلاسة العربية ومفهوم من السياق اليوناني.
- source_word: ταῖς ἑπτὰ ἐκκλησίαις
  choice: إلى الكنائس السبع
  rationale: «الكنائس» هي العبارة العربية المألوفة للجماعات المسيحية المحلية المقصودة هنا، من غير دلالة طائفية خاصة.
- source_word: εἰς Ἔφεσον ... εἰς Λαοδίκειαν
  choice: إلى أفسس، وإلى سميرنا، وإلى برغاموم، وإلى ثياتيرا، وإلى ساردس، وإلى فيلادلفيا، وإلى لاودكية
  rationale: تكرار «إلى» يحفظ تكرار εἰς وقوته التوزيعية، مبينًا أن الرسالة موجهة إلى كل مدينة وجماعتها.
- source_word: Πέργαμον
  choice: برغاموم
  rationale: نقل صوتي مباشر للاسم اليوناني، مع الإشارة في الحاشية إلى الصيغة العربية التقليدية البديلة.
theological_decisions:
- issue: دلالة ἐκκλησίαις في رؤيا 1:11
  choice: الكنائس
  alternative: الجماعات
  rationale: يشير اللفظ إلى جماعات مسيحية محلية محددة تتلقى الرسالة؛ و«الكنائس» تنقل هذا المعنى الكنسي المألوف من غير استيراد تمييز مذهبي.
translation_notes:
  register: عربية فصحى معاصرة واضحة وذات نبرة كتابية رصينة. حُفظ تكرار «إلى» لإبراز الإيقاع التوزيعي في الأصل، ووُضعت علامتا الحاشية عند اللفظين اللذين تخصهما فعلًا، تصحيحًا لعدم اتساق موضعيهما في طبقة الاستشارة الإنجليزية.
