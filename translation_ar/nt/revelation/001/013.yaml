  text: καὶ ἐν μέσῳ ⸀τῶν λυχνιῶν ὅμοιον ⸀υἱὸν ἀνθρώπου, ἐνδεδυμένον ποδήρη καὶ περιεζωσμένον πρὸς τοῖς μαστοῖς ζώνην χρυσᾶν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/013.yaml
  text: and in the midst of the lampstands[a], one like a son of man, clothed in a robe reaching to the feet and girded across the chest with a golden sash.
translation:
  language: ar
  text: وفي وسط المنائر، واحدًا شبيهًا بابن إنسان[a]، لابسًا ثوبًا يبلغ إلى القدمين، ومتمنطقًا عند صدره بمنطقة من ذهب.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «واحدًا شبيهًا بابن الإنسان». تردد العبارة اليونانية صدى دانيال 7:13، وتُطبَّق هنا على يسوع الممجَّد.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν μέσῳ
  choice: في وسط
  rationale: يحافظ على الدلالة المكانية وعلى النبرة الرؤيوية، وهو تعبير عربي واضح وطبيعي.
- source_word: λυχνιῶν
  choice: المنائر
  rationale: تشير الكلمة اليونانية إلى حوامل السرج لا إلى السرج نفسها، كما يؤكد سياق سفر الرؤيا.
- source_word: ὅμοιον υἱὸν ἀνθρώπου
  choice: واحدًا شبيهًا بابن إنسان
  rationale: تعكس الصياغة غياب أداة التعريف في اليونانية وتحفظ صدى دانيال 7:13 من غير أن تحسم في المتن أنها لقب معرف ثابت. أضيفت «واحدًا» لإقامة تركيب عربي واضح يؤدي معنى الاسم المقدر في الصفة اليونانية.
- source_word: ἐνδεδυμένον
  choice: لابسًا
  rationale: صياغة عربية طبيعية تنقل حالة الشخص الظاهرة في الرؤيا، أي كونه مرتديًا الثوب.
- source_word: ποδήρη
  choice: ثوبًا يبلغ إلى القدمين
  rationale: يبين المعنى الحرفي للصفة، أي ثوبًا ممتدًا حتى القدمين، من دون استعمال لفظ متخصص غامض.
- source_word: περιεζωσμένον
  choice: متمنطقًا
  rationale: يحافظ على صورة شد المنطقة حول الجسد وعلى السجل الوقور للنص.
- source_word: πρὸς τοῖς μαστοῖς
  choice: عند صدره
  rationale: ينقل موضع المنطقة عاليًا على الجذع بعبارة عربية واضحة وغير متكلفة.
- source_word: ζώνην χρυσᾶν
  choice: بمنطقة من ذهب
  rationale: «منطقة» تلائم قطعة اللباس الممتدة حول الجسد، و«من ذهب» تعبير عربي طبيعي يصف مادتها.
theological_decisions:
- issue: القوة المسيحانية لعبارة ὅμοιον υἱὸν ἀνθρώπου
  choice: إثبات «واحدًا شبيهًا بابن إنسان» في المتن
  alternative: واحدًا شبيهًا بابن الإنسان
  rationale: يحافظ المتن على الصياغة اليونانية غير المعرفة وعلى الإشارة إلى دانيال 7:13 من غير تحويل العبارة صراحة إلى لقب معرف، بينما توضح الحاشية القراءة اللقبية التقليدية وأن الرؤيا تطبق العبارة على يسوع الممجد.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة رؤيوية وقورة. حافظت الصياغة على تراكم العبارات الوصفية في الأصل، وعلى حالة النصب المتصلة بفعل الرؤية في السياق السابق.
