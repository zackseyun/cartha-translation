id: REV.1.9
reference: Revelation 1:9
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Ἐγὼ Ἰωάννης, ὁ ἀδελφὸς ὑμῶν καὶ ⸀συγκοινωνὸς ἐν τῇ θλίψει καὶ βασιλείᾳ καὶ ὑπομονῇ ⸀ἐν Ἰησοῦ, ἐγενόμην ἐν τῇ νήσῳ τῇ καλουμένῃ Πάτμῳ διὰ τὸν λόγον τοῦ θεοῦ ⸀καὶ τὴν μαρτυρίαν ⸀Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/009.yaml
  text: I[a], John, your brother and fellow participant in the tribulation and kingdom and endurance in Jesus, was on the island called Patmos because of the word of God and the testimony of Jesus.
translation:
  language: ar
  text: أنا يوحنا، أخوكم وشريككم في الضيقة والملكوت والثبات في يسوع، كنت في الجزيرة التي تُدعى بَطْمُس بسبب كلمة الله وشهادة يسوع.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الشهادة عن يسوع». قد تعني صيغة الإضافة اليونانية شهادةً قدّمها يسوع أو شهادةً متعلّقة بيسوع.'
    reason: alternative_reading
lexical_decisions:
- source_word: συγκοινωνός
  choice: شريككم
  rationale: يفيد اللفظ الاشتراك مع المخاطَبين في أمور واحدة؛ و«شريككم» عربية طبيعية موجزة، والسياق يرفع أي إيحاء تجاري.
- source_word: ἐν τῇ θλίψει καὶ βασιλείᾳ καὶ ὑπομονῇ
  choice: في الضيقة والملكوت والثبات
  rationale: تُبقي الصياغة العناصر الثلاثة منسَّقة وفي نطاق اشتراك واحد. «الضيقة» تلائم السياق الرؤيوي، و«الثبات» يؤدي معنى ὑπομονή بوصفه الصمود المستمر دون إضافة تفسيرية.
- source_word: ἐν Ἰησοῦ
  choice: في يسوع
  rationale: تُحفظ العبارة اللاهوتية الموجزة كما هي، وتتعلق طبيعيًا بالضيقة والملكوت والثبات جميعًا، من غير توسيعها إلى «في اتحاد بيسوع».
- source_word: ἐγενόμην ἐν τῇ νήσῳ
  choice: كنت في الجزيرة
  rationale: يؤدي الاستعمال المكاني الاصطلاحي بوضوح، من غير افتراض كيفية وصول يوحنا أو الإيحاء بأنه وجد نفسه هناك مصادفة.
- source_word: τῇ καλουμένῃ Πάτμῳ
  choice: التي تُدعى بَطْمُس
  rationale: صياغة عربية فصيحة وطبيعية للمبني للمجهول، وتحافظ على كون الاسم وصفًا للجزيرة.
- source_word: διὰ τὸν λόγον τοῦ θεοῦ
  choice: بسبب كلمة الله
  rationale: διά مع المنصوب تدل هنا على السبب؛ وتحافظ «بسبب» على انفتاح النص بشأن ما إذا كان السبب هو الكرازة أو الأمانة للكلمة أو الاضطهاد المتصل بها.
- source_word: τὴν μαρτυρίαν Ἰησοῦ
  choice: شهادة يسوع
  rationale: 'الإضافة في العربية، مثل المضاف إليه اليوناني هنا، يمكن أن تبقي الاحتمالين: الشهادة التي يشهد بها يسوع، أو الشهادة عنه. ويُذكر الاحتمال الثاني صراحة في الحاشية.'
- source_word: ἀδελφὸς ὑμῶν
  choice: أخوكم
  rationale: تعبير مباشر وطبيعي عن تضامن يوحنا العائلي مع المخاطَبين، وهو يتحدث عن نفسه بصفته فردًا.
theological_decisions:
- issue: دلالة المضاف إليه في μαρτυρίαν Ἰησοῦ
  choice: «شهادة يسوع» في المتن
  alternative: «الشهادة عن يسوع»
  rationale: تحتمل الصيغة اليونانية أن تكون الشهادة صادرة من يسوع أو متعلقة بيسوع. وتحافظ الإضافة العربية على قدر معتبر من هذا الغموض الحقيقي، فيما توضح الحاشية القراءة البديلة دون حسم تفسيري.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كريمة. استُعملت ألفاظ كتابية مألوفة مثل «الضيقة» و«الملكوت» مع تجنب التوسع التفسيري. وُضع رمز الحاشية بعد العبارة التي يشرحها مباشرة.
