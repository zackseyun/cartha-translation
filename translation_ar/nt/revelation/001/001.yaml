  text: Ἀποκάλυψις Ἰησοῦ Χριστοῦ, ἣν ἔδωκεν αὐτῷ ὁ θεὸς δεῖξαι τοῖς δούλοις αὐτοῦ, ἃ δεῖ γενέσθαι ἐν τάχει, καὶ ἐσήμανεν ἀποστείλας διὰ τοῦ ἀγγέλου αὐτοῦ τῷ δούλῳ αὐτοῦ Ἰωάννῃ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/001.yaml
  text: The revelation of Jesus the Messiah[a], which God gave him to show his servants what must happen soon, and he made it known by sending it through his angel to his servant John[d][c][b],
translation:
  language: ar
  text: إعلانُ يسوعَ المسيحِ[a]، الذي أعطاه الله إياه ليُريَ عبيدَه[d] ما لا بد أن يحدث قريبًا[b]، وقد جعله معروفًا بإرساله عن طريق ملاكه إلى عبده يوحنا،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا فهم العبارة: «الإعلان الصادر من يسوع المسيح» أو «الإعلان المتعلق بيسوع المسيح»؛ فالإضافة اليونانية تحتمل أكثر من معنى.'
    reason: alternative_reading
  - marker: b
    text: أو «بسرعة». قد تدل العبارة على أن هذه الأمور ستحدث قريبًا، أو على أنها ستجري سريعًا حين تبدأ.
    reason: lexical_alternative
  - marker: d
    text: أو «خدامه». لفظ «عبيد» يحافظ على معنى التبعية والانتماء الكامن في الكلمة اليونانية.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποκάλυψις
  choice: إعلان
  rationale: ينقل معنى الكشف والإظهار، وهو اللفظ العربي المألوف لعنوان السفر من غير إضافة تمهيد غير موجود في اليونانية.
- source_word: Ἰησοῦ Χριστοῦ
  choice: يسوع المسيح
  rationale: تحافظ الإضافة العربية في «إعلان يسوع المسيح» على احتمال أن يكون الإعلان صادرًا من يسوع المسيح أو متعلقًا به، و«المسيح» ترجمة Χριστός بوصفه لقبًا.
- source_word: ἣν ἔδωκεν αὐτῷ ὁ θεὸς
  choice: الذي أعطاه الله إياه
  rationale: يحافظ التركيب على كون الإعلان هو المعطى وعلى أن متلقيه هو يسوع، من غير شرح لاهوتي زائد.
- source_word: δεῖξαι
  choice: ليُريَ
  rationale: ترجمة مباشرة لغرض الإعطاء، وتناسب سياق الرؤى.
- source_word: τοῖς δούλοις αὐτοῦ / τῷ δούλῳ αὐτοῦ
  choice: عبيده / عبده
  rationale: «عبد» لفظ عربي طبيعي وموقر يدل على التبعية والانتماء إلى السيد، ويحافظ هنا على قوة δοῦλος أفضل من «خادم».
- source_word: ἃ δεῖ γενέσθαι
  choice: ما لا بد أن يحدث
  rationale: صياغة عربية واضحة تحفظ معنى الضرورة في δεῖ.
- source_word: ἐν τάχει
  choice: قريبًا
  rationale: يفيد القرب الزمني على نحو طبيعي، مع إثبات احتمال معنى السرعة في الحاشية.
- source_word: ἐσήμανεν
  choice: أبلغه
  rationale: ينقل المعنى الأساسي، أي الإيصال والإعلام، بلغة عربية واضحة؛ وتُذكر في الحاشية دلالة الإشارة المحتملة في الفعل اليوناني.
- source_word: ἀποστείλας διὰ τοῦ ἀγγέλου αὐτοῦ
  choice: بإرسال ملاكه
  rationale: يصوغ اسم الفاعل الدال على الوسيلة صياغة عربية موجزة، ويحفظ الملاك وسيطًا في نقل الإعلان.
- source_word: τῷ δούλῳ αὐτοῦ Ἰωάννῃ
  choice: إلى عبده يوحنا
  rationale: يحفظ المجرور اليوناني جهةَ التلقي، مع اتساق ترجمة δοῦλος.
theological_decisions:
- issue: دلالة الإضافة في Ἀποκάλυψις Ἰησοῦ Χριστοῦ
  choice: إعلان يسوع المسيح
  alternative: الإعلان الصادر من يسوع المسيح؛ أو الإعلان المتعلق بيسوع المسيح
  rationale: الإضافة اليونانية تحتمل المصدر والموضوع، والإضافة العربية تحفظ قدرًا مماثلًا من هذا الاحتمال بدل حسمه.
- issue: ترجمة δοῦλος
  choice: عبد / عبيد
  alternative: خادم / خدام
  rationale: «عبد» يحفظ علاقة التبعية والانتماء المقصودة في السياق، وهو في العربية الكتابية والفصحى لفظ طبيعي لا يحتاج إلى تركيب مصطنع.
- issue: دلالة ἐσήμανεν
  choice: أبلغه
  alternative: دلّ عليه؛ أو عرّفه بإشارات
  rationale: المعنى الأساسي هو الإبلاغ أو التعريف، وقد يحمل الفعل إيحاء الدلالة بعلامات. اختير التعبير الواضح في المتن وحُفظ الإيحاء الرمزي في الحاشية.
- issue: مرجع الفاعل المستتر في ἐσήμανεν وضمير αὐτοῦ
  choice: لم يُسمَّ الفاعل من جديد في العربية
  alternative: فأبلغه يسوع بإرسال ملاكه؛ أو فأبلغه الله بإرسال ملاكه
  rationale: تتابع الضمائر في اليونانية لا يصرّح بالمرجع مرة أخرى؛ لذلك تجنبت الترجمة إدخال اسم يحسمه تفسيرًا.
translation_notes:
  register: فصحى معاصرة واضحة ذات نبرة موقرة. حُفظت بنية الاستهلال من غير إضافة «هذا هو»، واستُعملت «المسيح» كلقب مألوف. وُضعت علامات الحواشي كلها في مواضعها في المتن.
