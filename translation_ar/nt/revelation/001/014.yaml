  text: ἡ δὲ κεφαλὴ αὐτοῦ καὶ αἱ τρίχες λευκαὶ ὡς ἔριον λευκόν, ὡς χιών, καὶ οἱ ὀφθαλμοὶ αὐτοῦ ὡς φλὸξ πυρός,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/014.yaml
  text: His head and hair were white[a], like white wool, like snow, and his eyes were like a flame of fire[b],
translation:
  language: ar
  text: وأمّا رأسه وشعره فكانا أبيضين[a]، كالصوف الأبيض، كالثلج، وعيناه كلهيب نار[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو بحسب وصل العبارة: «وكان رأسه وشعره أبيضين كالصوف الأبيض، كالثلج».'
    reason: lexical_alternative
  - marker: b
