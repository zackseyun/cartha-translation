    reason: cross_reference
lexical_decisions:
- source_word: δὲ
  choice: وأمّا
  rationale: أداة ربط خفيفة تنقل الوصف إلى سمة جديدة من غير إضفاء معنى زمني غير موجود في الأصل.
- source_word: ἡ κεφαλὴ αὐτοῦ καὶ αἱ τρίχες
  choice: رأسه وشعره
  rationale: ترجمة مباشرة وطبيعية؛ استُعمل «شعره» اسمَ جمع بدل «شعراته» بما يلائم العربية المعاصرة.
- source_word: λευκαὶ
  choice: أبيضين
  rationale: يحمل خبرَ البياض على «رأسه وشعره» مع الحفاظ على المعنى الأساسي للون وعلى التوكيد المتكرر في الصور التالية.
- source_word: ὡς ἔριον λευκόν
  choice: كالصوف الأبيض
  rationale: يحفظ التشبيه الصريح ووصف الصوف بأنه أبيض كما في اليونانية.
- source_word: ὡς χιών
  choice: كالثلج
  rationale: يحفظ التشبيه الثاني وتراكم صور البياض من دون إضافة تفسير رمزي.
- source_word: οἱ ὀφθαλμοὶ αὐτοῦ
  choice: عيناه
  rationale: صياغة عربية موجزة وطبيعية للمثنى، مطابقة للإشارة إلى العينين.
- source_word: ὡς φλὸξ πυρός
  choice: كلهيب نار
  rationale: يحفظ تركيب الصورة الرؤيوية القريب من الأصل، ولا يختزله إلى مجرد صفة مثل «ناريتين».
theological_decisions:
- issue: الوصف الرمزي لابن الإنسان الممجَّد
  choice: إبقاء صور الصوف والثلج ولهيب النار حرفية في المتن من غير شرح رموزها.
  alternative: إضافة ألفاظ تفسيرية تشير إلى الطهارة أو الأزلية أو الدينونة.
  rationale: النص يعرض تشبيهات رؤيوية ولا يفسر دلالتها العقائدية صراحة في هذه الآية؛ لذلك يحفظ النقل المباشر التوتر الدلالي ويتجنب فرض تفسير بعينه.
- issue: مدى تعلّق وصف البياض بالرأس والشعر
  choice: صياغة المثنى «فكانا أبيضين» لإظهار أن الرأس والشعر كليهما داخلان في الوصف.
  alternative: صياغة قد تجعل البياض متعلقًا بالشعر وحده، مع وصل التشبيه بالرأس والشعر على نحو مختلف.
  rationale: صيغة الصفة اليونانية في الجمع بعد الاسمين المنسقين تسند الوصف إليهما معًا، مع بقاء إمكان اختلاف توزيع التشبيهات بحسب الترقيم؛ لذلك نُبّه إلى الصياغة البديلة في الحاشية.
translation_notes:
  register: لغة عربية فصحى حديثة واضحة ومهيبة. استُعمل «وأمّا» لتنظيم الوصف، والمثنى في «فكانا» و«عيناه» بما يلائم الأسلوب العربي الطبيعي، مع إبقاء التشبيهات المكثفة وتكرار البياض كما في الأصل.
