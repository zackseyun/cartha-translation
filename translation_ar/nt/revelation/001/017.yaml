source:
  edition: SBLGNT
  text: Καὶ ὅτε εἶδον αὐτόν, ἔπεσα πρὸς τοὺς πόδας αὐτοῦ ὡς νεκρός· καὶ ἔθηκεν τὴν δεξιὰν αὐτοῦ ἐπ’ ἐμὲ λέγων· Μὴ φοβοῦ· ἐγώ εἰμι ὁ πρῶτος καὶ ὁ ἔσχατος,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/017.yaml
  text: And when I saw him[a], I fell at his feet like a dead man. And he placed his right hand on me, saying, “Do not fear[b]. I am the First and the Last,”
translation:
  language: ar
  text: 'وحين رأيته، سقطت عند قدميه كالميت[a]. ووضع يده اليمنى عليّ، قائلًا: «لا تخف[b]. أنا الأول والآخر»،'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كأنني ميت».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «لا تكن خائفًا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ὅτε
  choice: وحين
  rationale: تنقل أداة الربط السردية καί مع الدلالة الزمنية لـὅτε في صياغة عربية طبيعية تصل الكلام بما قبله.
- source_word: εἶδον αὐτόν
  choice: رأيته
  rationale: ترجمة مباشرة لفعل الإدراك البصري في الماضي، مع عودة الضمير إلى الشخص الموصوف في السياق السابق.
- source_word: ἔπεσα πρὸς τοὺς πόδας αὐτοῦ
  choice: سقطت عند قدميه
  rationale: تؤدي معنى السقوط أمامه بمحاذاة قدميه، وهي عبارة عربية واضحة وطبيعية دون إضافة معنى السجود صراحة.
- source_word: ὡς νεκρός
  choice: كميت
  rationale: تحافظ على التشبيه الصريح الذي تفيده ὡς، ولا توحي بأن يوحنا مات فعلًا.
- source_word: ἔθηκεν τὴν δεξιὰν αὐτοῦ ἐπ’ ἐμέ
  choice: فوضع يده اليمنى عليّ
  rationale: تنقل فعل الوضع وذكر اليد اليمنى صراحة، مع الفاء لبيان تعاقب الحدثين بصورة عربية سليمة.
- source_word: λέγων
  choice: قائلًا
  rationale: تحافظ على البنية الحالية للمصدر اليوناني المصاحب لفعل وضع اليد.
- source_word: Μὴ φοβοῦ
  choice: لا تخف
  rationale: نهي عربي مباشر ومألوف يطابق معنى العبارة اليونانية ويحافظ على نبرتها المهيبة المطمئنة.
- source_word: ἐγώ εἰμι
  choice: أنا
  rationale: الجملة الاسمية العربية هي الصياغة الطبيعية للتعريف المؤكد بالنفس، والضمير المنفصل يحفظ بروز ἐγώ.
- source_word: ὁ πρῶτος καὶ ὁ ἔσχατος
  choice: الأول والآخر
  rationale: ترجمة مباشرة للصفتين المعرفتين المستعملتين لقبًا، من غير توسع تفسيري.
theological_decisions:
- issue: استعمال «الأول والآخر» لقبًا
  choice: الأول والآخر
  alternative: الأول والأخير
  rationale: «الآخر» يقابل ἔσχατος مباشرة ويحفظ صيغة اللقب المزدوج وأصداء لغة إشعياء، دون إضافة تفسير عقائدي إلى النص.
- issue: قوة العبارة ἐγώ εἰμι
  choice: أنا
  alternative: أنا هو
  rationale: «أنا» قبل الخبرين «الأول والآخر» تعريف مؤكد وطبيعي في العربية. أما «أنا هو» فثقيلة هنا وقد توحي بإحالة لاهوتية محددة تتجاوز ما تقتضيه البنية في هذه الجملة.
translation_notes:
  register: العربية فصحى حديثة واضحة ومهيبة. حُفظ التشبيه في «كميت»، ووُضع مؤشر الحاشية بعد العبارة التي يفسرها. لم تُضف كلمة «رجل» لأنها غير موجودة في اليونانية، ولم يُصرَّح بالسجود لأن الفعل يصف السقوط عند القدمين فحسب.
