id: REV.1.16
reference: Revelation 1:16
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ ἔχων ἐν τῇ δεξιᾷ ⸂χειρὶ αὐτοῦ⸃ ἀστέρας ἑπτά, καὶ ἐκ τοῦ στόματος αὐτοῦ ῥομφαία δίστομος ὀξεῖα ἐκπορευομένη, καὶ ἡ ὄψις αὐτοῦ ὡς ὁ ἥλιος φαίνει ἐν τῇ δυνάμει αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/016.yaml
  text: And he had seven stars in his right hand[a], and from his mouth came a sharp two-edged sword[b], and his appearance was like the sun shining in its strength.
translation:
  language: ar
  text: وكان في يده اليمنى سبعة نجوم، ومن فمه يخرج سيف حاد ذو حدين[a]، وكان منظره كالشمس وهي تضيء بقوتها[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «سيف حاد مزدوج الحد».'
    reason: بديل لفظي لعبارة δίστομος، مع الحفاظ على وصف ὀξεῖα («حاد»).
  - marker: b
    text: 'أو: «وهي تضيء بكل قوتها».'
    reason: يوضح احتمال دلالة ἐν τῇ δυνάμει αὐτοῦ على بلوغ ضياء الشمس كامل شدته.
lexical_decisions:
- source_word: ἔχων
  choice: كان في يده
  rationale: صياغة وصفية عربية طبيعية تنقل معنى الامتلاك في سياق الرؤيا، من غير أن تحوّل الصورة إلى فعل لحظي.
- source_word: ἐν τῇ δεξιᾷ χειρὶ αὐτοῦ
  choice: في يده اليمنى
  rationale: تُبقي لفظ «اليد» الصريح في اليونانية، وتأتي بترتيب عربي مألوف.
- source_word: ἀστέρας ἑπτά
  choice: سبعة كواكب
  rationale: ترجمة مباشرة بترتيب عربي طبيعي؛ و«كواكب» لفظ عربي واضح يشمل الأجرام اللامعة التي تُرى في السماء.
- source_word: ῥομφαία
  choice: سيف
  rationale: ينقل نوع السلاح بوضوح من غير مبالغة في تخصيص حجمه أو شكله.
- source_word: δίστομος
  choice: ذو حدّين
  rationale: ينقل التعبير اليوناني الحرفي «ذو فمين» بمعناه الاصطلاحي المتعلق بحدّي السيف.
- source_word: ὀξεῖα
  choice: حادّ
  rationale: يحافظ على وصف الحدة الوارد مستقلًا إلى جانب كون السيف ذا حدّين.
- source_word: ἐκπορευομένη
  choice: يخرج
  rationale: المضارع يلائم المشهد المستمر في الرؤيا ويحافظ على صورة صدور السيف من الفم.
- source_word: ἡ ὄψις αὐτοῦ
  choice: منظره
  rationale: يدل على الهيئة المرئية عمومًا، ولا يضيّق المعنى إلى الوجه وحده.
- source_word: ὡς ὁ ἥλιος φαίνει
  choice: كالشمس وهي تضيء
  rationale: صياغة عربية سلسة تحافظ على التشبيه وعلى دلالة الإشراق المستمر.
- source_word: ἐν τῇ δυνάμει αὐτοῦ
  choice: بقوتها
  rationale: ترجمة قريبة من اليونانية، والمقصود قوة ضياء الشمس أو شدته، مع إبقاء احتمال «بكل قوتها» في الحاشية.
theological_decisions:
- issue: طبيعة صورة السيف الخارج من الفم
  choice: إبقاء الصورة الرؤيوية كما وردت من غير تفسير مضاف
  alternative: التصريح بأن السيف يرمز إلى كلمة المسيح أو دينونته
  rationale: النص يعرض رمزًا رؤيويًا ولا يفسره في هذه الآية؛ لذلك لا ينبغي أن تُدرج دلالته اللاهوتية المحتملة في صلب الترجمة.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة، مع جمل وصفية متوازنة تلائم أسلوب الرؤيا وتحافظ على رموزها من غير شرح داخل المتن.
