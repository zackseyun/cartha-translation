  text: Therefore write what you have seen[a], and what is, and what is about to happen after these things.
translation:
  language: ar
  text: فاكتب إذًا ما رأيتَ، وما هو كائن، وما هو مزمع أن يحدث[a] بعد هذه الأمور.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وما سيحدث بعد هذه الأمور». قد يُستعمل الفعل في بعض السياقات بمعنى قريب من المستقبل البسيط، مع أنه كثيرًا ما يدل على ما هو مزمع أو وشيك الحدوث.'
    reason: alternative_reading
lexical_decisions:
- source_word: γράψον
  choice: فاكتب
  rationale: فعل أمر مفرد يحافظ على صيغة التكليف المباشرة، وربط الفاء بالسياق ينقل قوة οὖν طبيعيًا.
- source_word: οὖν
  choice: إذًا
  rationale: تفيد الاستنتاج أو مواصلة الكلام انطلاقًا من الرؤيا والتكليف السابقين، و«إذًا» واضحة وطبيعية في العربية المعاصرة.
- source_word: ἃ εἶδες
  choice: ما رأيتَ
  rationale: تنقل الموصول مع الفعل الماضي مباشرة، وتشير إلى مضمون الرؤيا التي رآها يوحنا بالفعل.
- source_word: ἃ εἰσὶν
  choice: ما هو كائن
  rationale: صياغة عربية فصيحة تحافظ على دلالة الواقع الحاضر وعلى التوازي بين العبارات الموصولة.
- source_word: μέλλει γίνεσθαι
  choice: هو مزمع أن يحدث
  rationale: تحافظ «مزمع» على معنى التوقع أو قرب الوقوع الممكن في μέλλω، من غير اختزاله إلى مستقبل بسيط.
- source_word: μετὰ ταῦτα
  choice: بعد هذه الأمور
  rationale: تعكس العبارة الزمنية والضمير الإشاري الجمع، وتبقى طبيعية وواضحة بالعربية.
theological_decisions:
- issue: القوة الزمنية للفعل μέλλει في السياق الرؤيوي
  choice: «هو مزمع أن يحدث» مع إبقاء دلالة التوقع أو قرب الوقوع
  alternative: «سيحدث» بوصفه مستقبلًا بسيطًا
  rationale: غالبًا ما تحمل البنية اليونانية معنى الحدث المنتظر أو الوشيك، لكن قد تقترب في بعض السياقات من مجرد المستقبل. تحافظ الصياغة المختارة على هذا التوتر الزمني من غير حسم جدل أخروي أوسع.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حوفظ على التوازي الثلاثي في اليونانية، وعلى التوتر بين دلالة الحدث المزمع والمستقبل البسيط.
