  text: Ἰωάννης ταῖς ἑπτὰ ἐκκλησίαις ταῖς ἐν τῇ Ἀσίᾳ· χάρις ὑμῖν καὶ εἰρήνη ⸀ἀπὸ ὁ ὢν καὶ ὁ ἦν καὶ ὁ ἐρχόμενος, καὶ ἀπὸ τῶν ἑπτὰ πνευμάτων ἃ ἐνώπιον τοῦ θρόνου αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/004.yaml
  text: 'John, to the seven churches in Asia: Grace to you and peace from him who is, and who was, and who is coming, and from the seven spirits who are before his throne,'
translation:
  language: ar
  text: 'يوحنا، إلى الكنائس السبع التي في آسيا[a]: نعمة لكم وسلام من الكائن والذي كان والذي يأتي[b]، ومن الأرواح السبعة التي أمام عرشه[c]،'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: المقصود «آسيا» بوصفها الولاية الرومانية الواقعة في غربي آسيا الصغرى، لا قارة آسيا الحديثة.
    reason: geographical_clarification
  - marker: b
    text: 'يمكن أيضًا: «والذي سيأتي»؛ لكن «الذي يأتي» أقرب إلى صيغة اسم الفاعل الحاضر في اليونانية.'
    reason: lexical_alternative
  - marker: c
    text: 'قد تشير «الأرواح السبعة» رمزيًا إلى ملء الروح القدس، أو إلى سبعة أرواح سماوية؛ أما النص اليوناني نفسه فيقول: «الأرواح السبعة».'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰωάννης
  choice: يوحنا
  rationale: الصيغة العربية المعيارية المستقرة للاسم في التقليد الكتابي.
- source_word: ταῖς ἑπτὰ ἐκκλησίαις
  choice: إلى الكنائس السبع
  rationale: «الكنائس» هي الدلالة الطبيعية لـἐκκλησίαις في السياق المسيحي والرسائلي، مع الحفاظ على العدد والجمع.
- source_word: ἐν τῇ Ἀσίᾳ
  choice: التي في آسيا
  rationale: يحافظ على اللفظ الجغرافي اليوناني، مع إيضاح أن المقصود إقليم آسيا الروماني في الحاشية تجنبًا لالتباسه بالقارة الحديثة.
- source_word: χάρις ὑμῖν καὶ εἰρήνη
  choice: نعمة لكم وسلام
  rationale: يحفظ ترتيب العبارة اليونانية ويصرّح بدلالة ضمير المخاطبين، مع صياغة عربية كتابية واضحة.
- source_word: ἀπὸ ὁ ὢν καὶ ὁ ἦν καὶ ὁ ἐρχόμενος
  choice: من الكائن، والذي كان، والذي يأتي
  rationale: يحافظ «الكائن» على قوة اللقب الإلهي الاسمية وعلى غرابة التركيب المقصودة، بينما ينقل «الذي يأتي» دلالة اسم الفاعل الحاضر ἐρχόμενος من غير تحويلها إلى مستقبل محض.
- source_word: τῶν ἑπτὰ πνευμάτων
  choice: الأرواح السبعة
  rationale: ينقل صيغة الجمع الصريحة في اليونانية ولا يحسم هويتها بتفسير لاهوتي داخل النص.
- source_word: ἃ ἐνώπιον τοῦ θρόνου αὐτοῦ
  choice: التي أمام عرشه
  rationale: اسم الموصول غير العاقل ملائم نحويًا لجمع «أرواح» في العربية، ولا يبتّ في طبيعة هذه الأرواح أو شخصانيتها.
theological_decisions:
- issue: هوية «الكائن، والذي كان، والذي يأتي»
  choice: 'الإبقاء على العبارة بوصفها لقبًا إلهيًا مهيبًا: «من الكائن، والذي كان، والذي يأتي».'
  alternative: «من الذي هو، والذي كان، والذي سيأتي» أو «من الموجود والكائن والذي يأتي».
  rationale: النص اليوناني يتعمد تركيبًا غير مألوف بعد حرف الجر، على الأرجح تثبيتًا للقب الإلهي؛ لذلك لا تُسوّى غرابته تمامًا، كما أن «يأتي» تحافظ على القوة الحاضرة لـἐρχόμενος.
- issue: هوية «الأرواح السبعة»
  choice: إبقاء الجمع الحرفي في المتن.
  alternative: قد تكون رمزًا إلى ملء الروح القدس، أو سبعة أرواح سماوية.
  rationale: الهوية موضع خلاف، والنص اليوناني نفسه يقول «سبعة أرواح»؛ لذا تحفظ الترجمة التوتر التفسيري وتعرض الاحتمالين في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة رسائلية مهيبة. حُفظ ترتيب البركة والتوازي الثلاثي في اللقب الإلهي، ولم تُحسم هوية «الأرواح السبعة» في المتن. استُعملت علامات الوقف لإبراز وحدات اللقب من غير تغيير بنيته.
