  source_fidelity: 'المعنى العام منقول بدقة: يسوع المسيح هو الشاهد الأمين، والبكر من بين الأموات، وصاحب السلطان على ملوك الأرض؛ وهو يحب الجماعة وقد حررها من خطاياها بدمه. لكن «سلطان ملوك الأرض» قد يُفهم في العربية على أنه سلطة مجردة لا شخص حاكم، في حين أن ἄρχων لقب لشخص. كذلك يلزم وصل «وللذي» بالسياق اليوناني وبداية التسبيح، ونقل مرساة الحاشية إلى عبارة القراءة المتغيرة.'
