  text: καὶ ἀπὸ Ἰησοῦ Χριστοῦ, ὁ μάρτυς ὁ πιστός, ὁ πρωτότοκος τῶν νεκρῶν καὶ ὁ ἄρχων τῶν βασιλέων τῆς γῆς. Τῷ ἀγαπῶντι ἡμᾶς καὶ ⸀λύσαντι ἡμᾶς ⸀ἐκ τῶν ἁμαρτιῶν ἡμῶν ἐν τῷ αἵματι αὐτοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/005.yaml
  text: and from Jesus the Messiah[a], the faithful witness, the firstborn of the dead, and the ruler of the kings of the earth[b]. To him who loves us and freed us from our sins by his blood—
translation:
  language: ar
  text: ومن يسوع المسيح، الشاهد الأمين، والبكر من بين الأموات، وحاكم ملوك الأرض. وللذي يحبنا وحررنا[a] من خطايانا بدمه—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ بعض المخطوطات: «غسلنا من خطايانا بدمه» بدلًا من «حرَّرنا من خطايانا بدمه».'
    reason: textual_variant
lexical_decisions:
- source_word: Ἰησοῦ Χριστοῦ
  choice: يسوع المسيح
  rationale: «المسيح» في العربية ترجمة راسخة للقب Χριστός، وتحافظ هنا على كونه لقبًا لا اسم عائلة.
- source_word: ὁ μάρτυς ὁ πιστός
  choice: الشاهد الأمين
  rationale: «الشاهد» يدل على من يؤدي الشهادة، و«الأمين» يجمع معنى الثبات والجدارة بالثقة في تعبير عربي طبيعي.
- source_word: ὁ πρωτότοκος τῶν νεκρῶν
  choice: البكر من بين الأموات
  rationale: يحفظ «البكر» الصورة الكتابية ودلالة السيادة، بينما يوضح «من بين الأموات» الارتباط بالقيامة دون شرح زائد.
- source_word: ὁ ἄρχων τῶν βασιλέων τῆς γῆς
  choice: سلطان ملوك الأرض
  rationale: «سلطان» اسم شخص ذي سيادة، فينقل ἄρχων بوصفه صاحب الحكم على ملوك الأرض، ويتجنب التباس «رئيس» في العربية الحديثة.
- source_word: ἀγαπῶντι
  choice: يحبنا
  rationale: المضارع العربي ينقل المحبة المستمرة التي يفيدها اسم الفاعل اليوناني الحاضر بصورة طبيعية.
- source_word: λύσαντι ἡμᾶς ἐκ τῶν ἁμαρτιῶν ἡμῶν
  choice: حرَّرنا من خطايانا
  rationale: «حرَّر» ينقل معنى الحل والإطلاق في λύω، و«من» تحافظ على معنى الانفصال في ἐκ.
- source_word: ἐν τῷ αἵματι αὐτοῦ
  choice: بدمه
  rationale: الباء تنقل الاستعمال الأداتي لـἐν هنا بوضوح، مع إبقاء لغة الدم الكفارية دون تفسير إضافي.
theological_decisions:
- issue: القراءة النصية للفعل بعد «يحبنا»
  choice: حرَّرنا (λύσαντι)
  alternative: غسلنا (λούσαντι)
  rationale: يتبع المتن قراءة SBLGNT، مع إثبات القراءة المهمة البديلة في الحاشية حفاظًا على الشفافية النصية.
- issue: ترجمة اللقب Χριστός
  choice: المسيح
  alternative: المسيّا
  rationale: «المسيح» هو المقابل العربي الطبيعي والراسخ للقب اليوناني، ويحفظ طبيعته اللقبية دون الاكتفاء بنقل صوتي غير مألوف.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. حوفظ على البنية اللقبية المتوازية في اليونانية، وعلى الشرطة الختامية لأن الجملة تستمر في العدد التالي.
