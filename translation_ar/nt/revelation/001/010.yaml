  yaml_path: translation/nt/revelation/001/010.yaml
  text: I came to be in the Spirit on the Lord’s day[a], and I heard behind me a loud voice like a trumpet[b],
translation:
  language: ar
  text: وصرتُ في الروح[b] في اليوم الخاص بالرب[a]، وسمعتُ من ورائي صوتًا عاليًا كبوق،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، على احتمال أضعف: «في يوم الرب» الأخروي. فالعبارة اليونانية هنا κυριακῇ ἡμέρᾳ («اليوم الخاص بالرب»)، وليست الصيغة المعتادة لليوم الأخروي المعروف باسم «يوم الرب».'
    reason: alternative_reading
  - marker: b
    text: 'ويجوز أيضًا: «في حالة روحية». وقد تدل العبارة على وقوع يوحنا تحت تأثير الروح القدس النبوي، لكن النص لا يقول صراحةً إنه كان «في غيبوبة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγενόμην
  choice: صرتُ
  rationale: تفيد صيغة γίνομαι هنا الدخول في حالة؛ و«صرتُ» تحفظ هذا المعنى بصورة موجزة وطبيعية، من غير إضافة فكرة الغيبوبة غير المصرح بها.
- source_word: ἐν πνεύματι
  choice: في الروح
  rationale: تنقل العبارة اليونانية مباشرة، ويرجح في سياق الرؤيا أن الإشارة إلى تأثير الروح القدس النبوي، مع بقاء الصياغة العربية محتملة من غير توسيع تفسيري.
- source_word: ἐν τῇ κυριακῇ ἡμέρᾳ
  choice: في يوم الرب
  rationale: الصفة κυριακός تعني ما يخص الرب؛ وهذه الصياغة العربية الطبيعية تؤدي معنى «اليوم الخاص بالرب»، بينما توضح الحاشية الفرق عن العبارة اليونانية الأشهر لليوم الأخروي.
- source_word: ἤκουσα
  choice: سمعتُ
  rationale: الفعل هنا يدل على الإدراك السمعي البسيط، لا على الإصغاء المقصود.
- source_word: ὀπίσω μου
  choice: من ورائي
  rationale: ينقل المعنى المكاني بوضوح وطبيعية في العربية.
- source_word: φωνὴν μεγάλην
  choice: صوتًا عاليًا
  rationale: μέγας مع φωνή يدل سياقيًا على شدة الصوت؛ و«صوتًا عاليًا» تعبير عربي واضح ومألوف.
- source_word: ὡς σάλπιγγος
  choice: كبوقٍ
  rationale: يحافظ على التشبيه المباشر في اليونانية دون إضافة «نفخة» أو غيرها مما لا يصرح به الاسم.
theological_decisions:
- issue: هل تدل ἐν πνεύματι على تأثير الروح القدس أم على حالة نفسية أو غيبوبة؟
  choice: في الروح
  alternative: في حالة روحية؛ في غيبوبة
  rationale: يرجح السياق النبوي الإشارة إلى الروح القدس، لكن النص لا يقول صراحة «غيبوبة»؛ لذلك تُحفظ العبارة الحرفية والتوتر الدلالي.
- issue: هل تشير κυριακῇ ἡμέρᾳ إلى اليوم الأسبوعي المنسوب إلى الرب أم إلى «يوم الرب» الأخروي؟
  choice: يوم الرب، مع حاشية توضيحية
  alternative: يوم الدينونة الآتي للرب
  rationale: التركيب اليوناني هنا صفة بمعنى «الخاص بالرب»، وليس الصيغة اليونانية المعتادة لعبارة «يوم الرب» الأخروية؛ لذلك لا يُحسم مدلول اليوم بأبعد مما تسمح به العبارة.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم «صرتُ» لحفظ معنى الدخول في الحالة، و«من ورائي» للاتجاه المكاني. وُضعت علامة الحاشية [b] بعد «كبوق» وفق ترتيب الحواشي المعطى، مع أن مضمونها يشرح عبارة «في الروح»؛ ويبدو أن موضع العلامة في طبقة الاستشارة الإنجليزية غير مطابق لموضوع الحاشية.
