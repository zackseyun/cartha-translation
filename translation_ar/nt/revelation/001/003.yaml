id: REV.1.3
reference: Revelation 1:3
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: μακάριος ὁ ἀναγινώσκων καὶ οἱ ἀκούοντες τοὺς λόγους τῆς προφητείας καὶ τηροῦντες τὰ ἐν αὐτῇ γεγραμμένα, ὁ γὰρ καιρὸς ἐγγύς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/003.yaml
  text: Blessed is the one who reads aloud[a], and those who hear the words of this prophecy and keep what is written in it[b], for the time is near.
translation:
  language: ar
  text: طوبى لمن يقرأ بصوت مسموع[a]، وللذين يسمعون كلمات هذه النبوّة ويحفظون ما هو مكتوب فيها، لأن الوقت[b] قريب.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يقرأ». ويرجَّح أن اليونانية تشير إلى قارئ يتلو السفر أمام الجماعة، ولذلك قيل: «بصوت مسموع».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «الموعد قريب».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριος
  choice: طوبى
  rationale: صيغة عربية كتابية راسخة للتطويب، تعبّر عن نوال البركة والحظوة الإلهية، لا عن مجرد الشعور بالسعادة.
- source_word: ὁ ἀναγινώσκων
  choice: لمن يقرأ بصوت مسموع
  rationale: صيغة المفرد في مقابل جماعة السامعين ترجّح مشهد القراءة العلنية أمام الجماعة. وتوضح العبارة العربية البعد الشفهي من غير أن تضيف مضمونًا عقائديًا.
- source_word: οἱ ἀκούοντες
  choice: للذين يسمعون
  rationale: تحافظ «يسمعون» على الصلة المباشرة بالقراءة العلنية، وتبقي معنى التلقي مفتوحًا، مع توضيح الاستجابة في الفعل التالي.
- source_word: τοὺς λόγους τῆς προφητείας
  choice: كلمات هذه النبوّة
  rationale: تحافظ «كلمات» على دلالة λόγους بدل تعميمها إلى «رسالة»، وتشير «هذه» طبيعيًا إلى النبوّة التي يتضمنها السفر.
- source_word: τηροῦντες
  choice: يحفظون
  rationale: تفيد مراعاة المكتوب والتمسك به والعمل بمقتضاه، وتحافظ على سعة معنى τηρέω من غير حصره في تنفيذ الأوامر وحدها.
- source_word: τὰ ἐν αὐτῇ γεγραμμένα
  choice: ما هو مكتوب فيها
  rationale: تعبير عربي طبيعي ينقل مضمون اسم المفعول اليوناني، ويعود الضمير إلى النبوّة المذكورة.
- source_word: ὁ γὰρ καιρὸς
  choice: لأن الوقت
  rationale: تنقل «الوقت» المعنى الزمني الحاسم من غير أن تفرض في المتن تفسير «الموعد المحدد»، مع ذكر هذا الاحتمال في الحاشية.
- source_word: ἐγγύς
  choice: قريب
  rationale: صياغة عربية واضحة ومباشرة تحفظ تأكيد النص لقرب الوقت من غير تحديد كيفية هذا القرب أو جدوله.
theological_decisions:
- issue: سياق القراءة العلنية الذي يوحي به القارئ المفرد والسامعون بصيغة الجمع
  choice: «يقرأ بصوت مسموع» لإظهار السياق الشفهي المرجح.
  alternative: «يقرأ» من غير التصريح بأن القراءة مسموعة.
  rationale: تمييز قارئ واحد عن سامعين متعددين يرجح القراءة أمام الجماعة، لكن الحاشية تحفظ الترجمة الأعم التي يجيزها اللفظ في ذاته.
- issue: الدلالة الأخروية لعبارة καιρὸς ἐγγύς
  choice: «الوقت قريب» من غير شرح زمني أو مخطط تفسيري.
  alternative: «الموعد قريب».
  rationale: يؤكد النص القرب، لكنه لا يحسم هنا طبيعة التسلسل الأخروي أو زمن الإتمام؛ لذلك تُحفظ هذه المساحة من التوتر التفسيري.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُخدمت «طوبى» لصيغة التطويب، وحُفظ التوازي بين القارئ المفرد والسامعين بصيغة الجمع، مع تجنب إدخال تصور طائفي عن زمن النبوّة أو تحقيقها.
