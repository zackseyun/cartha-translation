id: REV.1.20
reference: Revelation 1:20
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: τὸ μυστήριον τῶν ἑπτὰ ἀστέρων ⸀οὓς εἶδες ἐπὶ τῆς δεξιᾶς μου, καὶ τὰς ἑπτὰ λυχνίας τὰς χρυσᾶς· οἱ ἑπτὰ ἀστέρες ἄγγελοι τῶν ἑπτὰ ἐκκλησιῶν εἰσίν, καὶ αἱ λυχνίαι αἱ ἑπτὰ ἑπτὰ ἐκκλησίαι εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/020.yaml
  text: 'As for the mystery of the seven stars that you saw in my right hand[a], and the seven golden lampstands: the seven stars are the angels of the seven churches, and the seven lampstands are the seven churches.'
translation:
  language: ar
  text: 'أمّا سرّ النجوم السبعة التي رأيتها في يدي اليمنى، والمنائر الذهبية السبع، فهو هذا: النجوم السبعة هي ملائكة[a] الكنائس السبع، والمنائر السبع هي الكنائس السبع.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «رسل الكنائس السبع». يمكن للكلمة اليونانية أن تشير إلى ملائكة أو إلى رسل من البشر.
    reason: alternative_reading
lexical_decisions:
- source_word: μυστήριον
  choice: سرّ
  rationale: يحفظ المصطلح الرؤيوي الدال على معنى كان خفيًّا ثم كُشف، وهو في العربية الطبيعية أوضح من النقل الحرفي «غموض» ولا يختزله في مجرد «معنى رمزي».
- source_word: ἀστέρων / ἀστέρες
  choice: النجوم
  rationale: ترجمة مباشرة لصورة الرؤيا، ثم يوضح النص مدلولها.
- source_word: οὓς εἶδες
  choice: التي رأيتها
  rationale: صياغة عربية طبيعية تحفظ جملة الصلة العائدة إلى النجوم.
- source_word: ἐπὶ τῆς δεξιᾶς μου
  choice: في يدي اليمنى
  rationale: تنقل الصورة المقصودة في السياق بعبارة عربية مألوفة، اتساقًا مع حمل النجوم في اليد.
- source_word: λυχνίας
  choice: المنائر
  rationale: اللفظ يدل على حوامل المصابيح لا على المصابيح نفسها؛ و«المنائر» يحفظ الصورة المادية بإيجاز.
- source_word: χρυσᾶς
  choice: الذهبية
  rationale: وصف عربي موجز وطبيعي ينقل صفة الذهب.
- source_word: ἄγγελοι
  choice: ملائكة
  rationale: هذا هو المعنى الشائع للكلمة في سفر الرؤيا، مع بقاء معنى «رسل» ممكنًا؛ لذلك أُثبت البديل في الحاشية.
- source_word: ἐκκλησιῶν / ἐκκλησίαι
  choice: الكنائس
  rationale: المقابل العربي المعياري والواضح للجماعات المسيحية المخاطبة في السفر.
- source_word: τὸ μυστήριον ... καὶ ...
  choice: 'أمّا سرّ ... و...، فهو هذا:'
  rationale: يعكس البناء اليوناني الذي يطرح موضوعًا ثم يقدّم تفسيره، بصياغة عربية سليمة من غير إضافة تفسيرية جوهرية.
theological_decisions:
- issue: مدلول ἄγγελοι τῶν ἑπτὰ ἐκκλησιῶν
  choice: ملائكة الكنائس السبع
  alternative: رسل الكنائس السبع
  rationale: يمكن أن تدل ἄγγελος على كائنات سماوية أو رسل بشريين. وبما أن الاستعمال السماوي شائع في سفر الرؤيا والنص لا يحسم هوية هؤلاء، أُبقي «ملائكة» في المتن وحُفظ البديل في الحاشية صونًا للتوتر التفسيري.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت «المنائر» للدلالة على حوامل المصابيح، وحُفظ الأسلوب التفسيري للرؤيا من غير تسطيح لمصطلح «السرّ» أو حسم لهوية الملائكة.
