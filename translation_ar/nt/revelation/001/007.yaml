id: REV.1.7
reference: Revelation 1:7
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Ἰδοὺ ἔρχεται μετὰ τῶν νεφελῶν, καὶ ὄψεται αὐτὸν πᾶς ὀφθαλμὸς καὶ οἵτινες αὐτὸν ἐξεκέντησαν, καὶ κόψονται ἐπ’ αὐτὸν πᾶσαι αἱ φυλαὶ τῆς γῆς. ναί, ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/007.yaml
  text: Look[a], he is coming with the clouds, and every eye will see him, even those who pierced him, and all the tribes of the earth will mourn over him. Yes, amen.
translation:
  language: ar
  text: ها هو آتٍ مع السُّحُب، وستراه كلُّ عين، حتى الذين طعنوه، وستنوح عليه جميع قبائل الأرض[a]. نعم، آمين.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أن تُفهم «الأرض» هنا بمعنى «البلاد». وقد تكون العبارة صدى لزكريا 12:10-12، حيث يلائم السياق معنى «البلاد».
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰδοὺ
  choice: ها هو
  rationale: تعبير عربي حيّ يلفت الانتباه ويقدّم المشهد بوضوح، من غير اللجوء إلى صيغة قديمة أو إلى أمرٍ بالنظر الحرفي.
- source_word: ἔρχεται
  choice: آتٍ
  rationale: يحافظ اسم الفاعل في هذا التركيب على حيوية المضارع اليوناني ودلالته على المجيء المنتظر.
- source_word: μετὰ τῶν νεφελῶν
  choice: مع السُّحُب
  rationale: يحفظ صورة السحب وإشارتها المحتملة إلى دانيال 7:13، بصياغة عربية طبيعية.
- source_word: ὄψεται
  choice: ستراه
  rationale: صيغة المستقبل هي المقابل العربي الطبيعي، والضمير يحافظ على كون الآتي هو المرئي.
- source_word: πᾶς ὀφθαλμὸς
  choice: كلُّ عين
  rationale: يحفظ الصورة الحسية والتوزيع الإفرادي في اليونانية بدل تسويتهما إلى «الجميع».
- source_word: οἵτινες
  choice: حتى الذين
  rationale: يُبرز إدراج الذين طعنوه بوجه خاص ضمن «كل عين»، وهو المقصود السياقي من العطف والموصول.
- source_word: ἐξεκέντησαν
  choice: طعنوه
  rationale: يحفظ معنى الاختراق بآلة حادة والصلة اللفظية بزكريا 12:10 ويوحنا 19:37.
- source_word: κόψονται
  choice: ستنوح
  rationale: الفعل يدل على النحيب والحداد؛ و«تنوح» تنقل قوة التعبير من غير إضافة هيئة جسدية غير مصرّح بها.
- source_word: ἐπ’ αὐτὸν
  choice: عليه
  rationale: تعبير «ناح عليه» عربي طبيعي يدل على التوجع من أجله، ويحافظ على صلة العبارة بلغة الرثاء.
- source_word: πᾶσαι αἱ φυλαὶ τῆς γῆς
  choice: جميع قبائل الأرض
  rationale: «قبائل» تحافظ على دقة φυλαί، و«الأرض» تلائم الامتداد الشامل في السياق، مع بقائها في العربية قابلة أيضًا للدلالة على البلاد أو الإقليم.
- source_word: ναί, ἀμήν
  choice: نعم، آمين
  rationale: يحفظ التأكيد المزدوج ولفظة «آمين» بما لها من وزن تعبدي معروف.
theological_decisions:
- issue: نطاق معنى τῆς γῆς في العبارة الغنية بالإشارات «جميع قبائل الأرض»
  choice: جميع قبائل الأرض
  alternative: جميع قبائل البلاد
  rationale: رؤية «كل عين» للمسيح وصورة المجيء المستمدة من دانيال ترجحان النطاق العالمي، لكن صدى زكريا 12:10-12 يترك معنى «البلاد» ممكنًا. وتحفظ الحاشية هذا التوتر من غير حسم زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعملت «ها هو» للفت الانتباه بصورة طبيعية، وحُفظت الصور الملموسة في «السحب» و«كل عين» و«قبائل الأرض». وُضع مؤشر الحاشية عند «الأرض» لأنه الموضع الذي تتعلق به دلالة «الأرض/البلاد».
