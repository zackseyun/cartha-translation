  text: who testified to the word of God and to the testimony of Jesus the Messiah[a], all that he saw.
translation:
  language: ar
  text: الذي شهد لكلمة الله ولشهادة يسوع المسيح[a]، أي لكل ما رآه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الشهادة الصادرة من يسوع المسيح»، أو «الشهادة عن يسوع المسيح». تحتمل العبارة اليونانية المعنيين.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμαρτύρησεν
  choice: شهد
  rationale: فعل عربي واضح وطبيعي يحفظ معنى الإدلاء بالشهادة، ويلائم الاسم المشتق «شهادة» في العبارة التالية.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: لكلمة الله
  rationale: يحفظ التعبير الكتابي المستقر والمعنى الاتصالي لـλόγος من غير استبداله بتفسير مثل «رسالة».
- source_word: τὴν μαρτυρίαν
  choice: لشهادة
  rationale: يحفظ الصلة الاشتقاقية والدلالية مع ἐμαρτύρησεν بعبارة عربية طبيعية.
- source_word: Ἰησοῦ Χριστοῦ
  choice: يسوع المسيح
  rationale: «المسيح» المقابل العربي المألوف للقب Χριστός، ويحافظ هنا على دلالته اللقبية.
- source_word: ὅσα εἶδεν
  choice: بكل ما رآه
  rationale: ينقل شمول ὅσα ويصل الخلاصة بما سبقها على نحو عربي سلس؛ والباء تبيّن مضمون الشهادة من غير حسم العلاقة بين المفعولين السابقين.
theological_decisions:
- issue: احتمال الإضافة في μαρτυρίαν Ἰησοῦ Χριστοῦ
  choice: شهادة يسوع المسيح
  alternative: الشهادة الصادرة من يسوع المسيح؛ أو الشهادة عن يسوع المسيح
  rationale: الإضافة اليونانية تحتمل أن يكون يسوع مصدر الشهادة أو موضوعها؛ لذلك تُحفظ الصياغة الملتبسة بحق في المتن، وتُذكر القراءتان في الحاشية.
- issue: دلالة Χριστοῦ بوصفه لقبًا
  choice: المسيح
  alternative: المسيح بصفته جزءًا اسميًا ثابتًا
  rationale: اللفظة تحتفظ هنا بقوة اللقب، و«المسيح» هي الصياغة العربية الطبيعية المعروفة التي تنقل ذلك.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ التوازي بين «شهد» و«شهادة»، وأُبقي غموض الإضافة المقصود في المتن مع شرحه في الحاشية.
