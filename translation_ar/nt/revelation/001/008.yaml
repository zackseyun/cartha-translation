  text: Ἐγώ εἰμι τὸ Ἄλφα καὶ τὸ Ὦ, λέγει κύριος, ὁ θεός, ὁ ὢν καὶ ὁ ἦν καὶ ὁ ἐρχόμενος, ὁ παντοκράτωρ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/008.yaml
  text: “I am the Alpha and the Omega,” says the Lord God[a], “the one who is and who was and who is coming, the Almighty.”
translation:
  language: ar
  text: «أنا الألفا والأوميغا»، يقول الرب الإله، «الكائن والذي كان والذي يأتي[a]، القادر على كل شيء».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الكائن والذي كان والذي سيأتي».'
    reason: بديل زمني مشروع لـἐρχόμενος؛ فصيغة المضارع في المتن أقرب إلى اسم الفاعل اليوناني، بينما صيغة الاستقبال بديل مألوف وممكن.
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: أنا هو
  rationale: يحافظ على توكيد الضمير في إعلان الهوية الإلهية، وهو تعبير عربي كتابي رصين ومفهوم.
- source_word: τὸ Ἄλφα καὶ τὸ Ὦ
  choice: الألف والياء
  rationale: يستبدل اسمي الحرفين اليونانيين بأول الحروف العربية وآخرها لينقل الرمز المقصود بوضوح إلى القارئ العربي، بدل إبقاء أسماء قد لا توضح دلالة البداية والنهاية.
- source_word: λέγει
  choice: يقول
  rationale: ينقل زمن المضارع وصيغة القول المباشرة بلا زيادة تفسيرية.
- source_word: κύριος, ὁ θεός
  choice: الرب الإله
  rationale: يحافظ على اللقبين في علاقة البدل كما في اليونانية، بصياغة عربية مألوفة ورصينة.
- source_word: ὁ ὢν καὶ ὁ ἦν καὶ ὁ ἐρχόμενος
  choice: الكائن والذي كان والذي يأتي
  rationale: يحافظ على البنية الثلاثية، ويترجم اسم الفاعل المضارع ἐρχόμενος بصيغة تدل على المجيء الفعلي المستمر أو المرتقب.
- source_word: ὁ παντοκράτωρ
  choice: القدير على كل شيء
  rationale: صياغة عربية طبيعية تنقل معنى السلطان والقدرة الشاملين دون استعمال تركيب حرفي غريب.
theological_decisions:
- issue: صياغة وصف الله من جهة الوجود الأزلي والمجيء الآتي
  choice: الكائن والذي كان والذي يأتي
  alternative: الكائن والذي كان والذي سيأتي
  rationale: «يأتي» أقرب إلى اسم الفاعل اليوناني في زمن الحاضر، وتحفظ توتر النص بين صفة المجيء والحضور الإسخاتولوجي؛ أما «سيأتي» فتبرز الاستقبال الزمني، ولذلك تُذكر بوصفها بديلًا مشروعًا في الحاشية.
- issue: تمثيل رمزية أول الحروف وآخرها
  choice: الألف والياء
  alternative: الألفا والأوميغا
  rationale: المقصود الرمزي هو الإحاطة من البداية إلى النهاية. تعريب الرمز بأول الأبجدية العربية وآخرها يجعله مفهومًا فورًا، مع إبقاء المقابل الحرفي في الحاشية منعًا لطمس صورة النص اليوناني.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة مهيبة تلائم الإعلان الإلهي والرؤيا، مع تجنب الألفاظ التقنية أو الطائفية. وُضعت علامة الحاشية [a] في المتن.
