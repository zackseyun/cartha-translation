  text: ⸀Καὶ ἐπέστρεψα βλέπειν τὴν φωνὴν ἥτις ἐλάλει μετ’ ἐμοῦ· καὶ ἐπιστρέψας εἶδον ἑπτὰ λυχνίας χρυσᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/012.yaml
  text: And I turned to see the voice that was speaking with me[a], and when I turned, I saw seven golden lampstands,
translation:
  language: ar
  text: فالتفتُّ لأرى الصوت الذي كان يكلّمني[a]، ولمّا التفتُّ رأيت سبع منائر من ذهب،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيا: «كان يتكلم معي». ويمكن أيضا: «كان يتكلم إليَّ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέστρεψα
  choice: التفتُّ
  rationale: الفعل يدل هنا على حركة جسدية للاتجاه نحو مصدر الصوت؛ و«التفتُّ» تعبير عربي طبيعي ودقيق من غير إضافة معنى الدوران الكامل.
- source_word: βλέπειν
  choice: لأرى
  rationale: المصدر يبيّن غرض الالتفات، وصيغة «لأرى» موجزة وطبيعية وتحافظ على فعل الإدراك البصري.
- source_word: τὴν φωνὴν
  choice: الصوت
  rationale: φωνή في سياق الكلام تعني الصوت الناطق، ويحافظ اللفظ العربي على الصورة المقصودة في عبارة «أرى الصوت» بدل استبدال صاحب الصوت به.
- source_word: ἥτις
  choice: الذي
  rationale: اسم موصول يعود إلى «الصوت»، وهو المقابل العربي الطبيعي في هذا السياق.
- source_word: ἐλάλει μετ’ ἐμοῦ
  choice: كان يكلّمني
  rationale: الماضي الناقص يفيد استمرار الكلام، و«كان يكلّمني» صياغة عربية واضحة تؤدي معنى الخطاب الموجّه إلى يوحنا، مع توثيق الدلالة الحرفية لحرف الجر في الحاشية.
- source_word: ἐπιστρέψας
  choice: ولمّا التفتُّ
  rationale: اسم الفاعل الماضي يسبق فعل الرؤية زمنيا؛ و«لمّا» توضح هذا التعاقب بأسلوب عربي سلس.
- source_word: εἶδον
  choice: رأيت
  rationale: مقابل مباشر وطبيعي للفعل الدال على الرؤية.
- source_word: ἑπτὰ
  choice: سبع
  rationale: العدد الأصلي المباشر، بصيغته الموافقة لقواعد العدد مع «منائر».
- source_word: λυχνίας
  choice: منائر
  rationale: λυχνία تدل على حامل السراج لا على السراج نفسه؛ و«منائر» تحافظ على الجسم الرمزي الملموس الذي يفسَّر لاحقا في رؤيا 1:20.
- source_word: χρυσᾶς
  choice: من ذهب
  rationale: تعبير عربي واضح يدل على مادة المنائر، ويتجنب احتمال فهم «ذهبية» على مجرد اللون.
theological_decisions:
- issue: ترجمة λυχνίας بوصفها عنصرا رمزيا في الرؤيا
  choice: منائر
  alternative: مصابيح
  rationale: النص يشير إلى حوامل السرج لا إلى السرج نفسها، كما أن رؤيا 1:20 يفسر المنائر السبع رمزيا؛ لذلك يحفظ هذا الاختيار دقة الصورة وترابطها.
- issue: المحافظة على صورة «رؤية الصوت»
  choice: لأرى الصوت
  alternative: لأرى صاحب الصوت
  rationale: العبارة اليونانية تنسب الرؤية إلى «الصوت» على نحو لافت. لم يُضف «صاحب» لأن ذلك يحل الصورة البلاغية ويحدد ما تركه النص بصيغته غير المألوفة.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم «منائر» بمعنى حوامل السرج، وحُفظت العبارة اللافتة «لأرى الصوت» كما في الأصل، مع صياغة طبيعية للتعاقب الزمني.
