  to: أَعْلَمُ ضِيقَكَ وَفَقْرَكَ، لكنك غنيّ، وأَعْلَمُ افتراءَ الذين يقولون إنهم يهود وليسوا كذلك، بل هم مَجْمَعُ الشيطان.[a][b]
  rationale: يصحح النص الاستدراك الذي تؤديه ἀλλά إلى «لكن»، ويجعل الإضافة في «مجمع الشيطان» مباشرةً وأقرب إلى τοῦ Σατανᾶ. ولا يضيف تفسيرًا لطبيعة الغنى أو لوجه نفي ادعاء اليهودية. كما فُصلت الحاشيتان بحسب موضعيهما المعجميين.
