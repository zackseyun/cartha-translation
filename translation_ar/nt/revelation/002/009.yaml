id: REV.2.9
reference: Revelation 2:9
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Οἶδά ⸀σου τὴν θλῖψιν καὶ τὴν πτωχείαν, ἀλλὰ πλούσιος εἶ, καὶ τὴν βλασφημίαν ἐκ τῶν λεγόντων Ἰουδαίους εἶναι ἑαυτούς, καὶ οὐκ εἰσίν, ἀλλὰ συναγωγὴ τοῦ Σατανᾶ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/009.yaml
  text: I know your affliction and your poverty—but you are rich—and the slander of those who say that they are Jews and are not[b][a], but are a synagogue of Satan.
translation:
  language: ar
  text: أَعْلَمُ ضِيقَكَ وَفَقْرَكَ، لكنك غنيّ، وأَعْلَمُ افتراءَ الذين يقولون إنهم يهود وليسوا كذلك، بل هم مَجْمَعُ الشيطان.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أيضًا ترجمة «افتراء» بـ«تجديف». والمقصود هنا كلامٌ عدائيٌّ تشهيريٌّ موجَّه إلى المؤمنين.
    reason: lexical_alternative
  - marker: b
    text: يمكن أن تعني كلمة «مَجْمَع» أيضًا «جماعة» أو «اجتماعًا». وقد أُبقيت «مَجْمَع» للمحافظة على خصوصية اللفظ والصورة في النص.
    reason: lexical_alternative
lexical_decisions:
- source_word: θλῖψιν
  choice: ضِيقَكَ
  rationale: تدل الكلمة على الضغط والشدة والمعاناة؛ و«الضيق» تعبير عربي فصيح وطبيعي يحفظ المعنى من غير إضفاء دلالة أخروية اصطلاحية.
- source_word: πτωχείαν
  choice: فَقْرَكَ
  rationale: ترجمة مباشرة وواضحة للكلمة، وتحفظ المقابلة مع الغنى.
- source_word: πλούσιος
  choice: غنيّ
  rationale: تحفظ المفارقة الحادة مع الفقر، من غير إضافة «روحيًّا» التي لا يصرح بها النص اليوناني.
- source_word: βλασφημίαν
  choice: افتراءَ
  rationale: السياق يتحدث عن كلام عدائي موجَّه إلى المؤمنين؛ و«الافتراء» ينقل معنى التشهير الكاذب، بينما قد تُفهم «التجديف» في العربية على أنه موجه إلى الله وحده.
- source_word: ἐκ τῶν λεγόντων
  choice: الذين يقولون
  rationale: تُصاغ العبارة عربيًّا على نحو طبيعي مع ربط «افتراء» بأصحابه بالإضافة؛ فتحفظ مصدر الكلام من غير تركيب متكلف.
- source_word: Ἰουδαίους εἶναι ἑαυτούς
  choice: يقولون إنهم يهود
  rationale: صياغة عربية طبيعية تحفظ التصريح بكلمة «يهود» ولا تضيف وصفًا مثل «حقيقيون» غير موجود في اليونانية.
- source_word: συναγωγὴ
  choice: مَجْمَعٌ
  rationale: «مجمع» يقابل معنى الجماعة أو موضع اجتماعها، ويحفظ الصلة التاريخية واللفظية بالمجمع اليهودي من غير قصر المعنى على المبنى.
- source_word: τοῦ Σατανᾶ
  choice: للشيطان
  rationale: تحفظ الإضافة اليونانية وقوة التعبير الجدلي من غير توسيع تفسيري.
theological_decisions:
- issue: وصف الذين يقولون إنهم يهود وليسوا كذلك
  choice: الإبقاء على «يهود» حرفيًّا وعلى النفي كما ورد
  alternative: الذين يزعمون أنهم شعب الله / أنهم يهود حقيقيون
  rationale: النص يذكر «يهود» صراحة، فلا ينبغي أن يحوّل المترجم العبارة إلى إنكار عرقي ولا أن يضيف معيار «الحقيقيين». تُترك طبيعة الادعاء ووجه نفيه ضمن التوتر الذي في النص.
- issue: طبيعة الغنى في قوله «مع أنك غني»
  choice: ترك «غنيّ» بلا تقييد
  alternative: غني روحيًّا
  rationale: السياق يوحي بغنى غير مادي، لكن اليونانية لا تضيف «روحيًّا»، لذلك لا يُصرَّح بما أبقاه النص ضمنيًّا.
- issue: حدة عبارة «مجمع للشيطان»
  choice: الإبقاء على العبارة كما هي مع إيضاح معجمي موجز في الحاشية
  alternative: جماعة تابعة للشيطان
  rationale: يحفظ ذلك الصورة الجدلية الأصلية ولا يلطّفها أو يوسعها تفسيريًّا، مع التنبيه إلى المجال الدلالي لكلمة συναγωγή.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدم «مع أنك غني» لإظهار أن الجملة اعتراضية مع الحفاظ على المفارقة. كُرر «وأعلم» قبل «افتراء» لتستقيم الجملة العربية ويظل الفعلان متعلّقين بالمفعولين المذكورين في اليونانية.
