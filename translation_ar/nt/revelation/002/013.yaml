id: REV.2.13
reference: Revelation 2:13
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ⸀Οἶδα ποῦ κατοικεῖς, ὅπου ὁ θρόνος τοῦ Σατανᾶ, καὶ κρατεῖς τὸ ὄνομά μου, καὶ οὐκ ἠρνήσω τὴν πίστιν μου ⸀καὶ ἐν ταῖς ⸀ἡμέραις Ἀντιπᾶς, ὁ μάρτυς μου, ὁ πιστός ⸀μου, ὃς ἀπεκτάνθη παρ’ ὑμῖν, ὅπου ὁ Σατανᾶς κατοικεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/013.yaml
  text: I know where you live—where Satan’s throne is[a]. Yet you hold fast my name, and you did not deny faith in me, even in the days of Antipas, my witness, my faithful one, who was killed among you[b], where Satan lives.
translation:
  language: ar
  text: أعرف أين تسكن، حيث عرش الشيطان قائم. ومع ذلك تتمسّك باسمي، ولم تنكر إيماني[a]، حتى في أيام أنتيباس، شاهدي[b] الأمين، الذي قُتل بينكم، حيث يسكن الشيطان.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الإيمان بي»، أو «أمانتي». فالعبارة اليونانية «إيماني» موجزة، ويمكن فهمها بأكثر من وجه.
    reason: alternative_reading
  - marker: b
    text: أو «شهيدي». فاللفظة اليونانية تعني «شاهد»، وقد تحمل أيضًا معنى «شهيد» في سياق الألم أو القتل.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἶδα
  choice: أعرف
  rationale: ينقل دلالة الفعل التام ذي المعنى الحاضر بعبارة عربية مباشرة وطبيعية.
- source_word: κατοικεῖς
  choice: تسكن
  rationale: الفعل يدل على الإقامة في مكان، و«تسكن» أوضح وأشيع في العربية المعاصرة من البدائل الأشد جزالة.
- source_word: ὅπου ὁ θρόνος τοῦ Σατανᾶ
  choice: حيث عرش الشيطان
  rationale: يحافظ على الصورة الرؤيوية الحادة وعلى علاقة الإضافة من غير تفسير المقصود بالعرش.
- source_word: κρατεῖς τὸ ὄνομά μου
  choice: تتمسّك باسمي
  rationale: «تتمسّك» تؤدي معنى الثبات والولاء في κρατέω، مع إبقاء «اسمي» كما في الأصل بدل شرح مدلوله.
- source_word: οὐκ ἠρνήσω
  choice: لم تنكر
  rationale: ترجمة مباشرة طبيعية لـἀρνέομαι، ولا تضيف معنى قانونيًا أو طقسيًا غير مصرح به.
- source_word: τὴν πίστιν μου
  choice: إيماني
  rationale: تحافظ على التركيب اليوناني الموجز وعلى غموض علاقة ضمير المتكلم بـ«الإيمان»، مع بيان الاحتمالات في الحاشية.
- source_word: ἐν ταῖς ἡμέραις Ἀντιπᾶς
  choice: في أيام أنتيباس
  rationale: صياغة عربية واضحة تحافظ على التعبير الزمني في الأصل.
- source_word: ὁ μάρτυς μου, ὁ πιστός μου
  choice: شاهدي الأمين
  rationale: «شاهد» هو المعنى الأساس لـμάρτυς، و«الأمين» ينقل πιστός طبيعيًا؛ جُمعت الصفتان في تركيب عربي سلس من غير إدخال وصف «عبد» غير الموجود في النص.
- source_word: ἀπεκτάνθη παρ’ ὑμῖν
  choice: قُتل بينكم
  rationale: «قُتل» ينقل المبني للمجهول مباشرة، و«بينكم» يؤدي معنى الوجود في وسط المخاطَبين من غير أن يوحي بأنهم هم القاتلون.
theological_decisions:
- issue: دلالة τὴν πίστιν μου
  choice: إيماني
  alternative: الإيمان بي؛ أو أمانتي
  rationale: الإضافة بضمير المتكلم تحتمل فهمًا موضوعيًا، أي الإيمان بالمسيح، أو فهمًا ذاتيًا يتعلق بأمانته. أبقى المتن العبارة الموجزة ولم يحسم التوتر، وذكرت الحاشية الاحتمالات التفسيرية.
- issue: دلالة μάρτυς في سياق القتل
  choice: شاهدي
  alternative: شهيدي
  rationale: المعنى المعجمي الأساس هو «شاهد»، لكن ذكر قتل أنتيباس يجعل معنى «الشهيد» حاضرًا سياقيًا. اختير اللفظ الأساس في المتن وحُفظ البديل في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة مهيبة تناسب الخطاب الرؤيوي. استُعملت «ومع ذلك» لإظهار قوة الاستدراك، وأُبقيت صورتا «عرش الشيطان» وموضع سكناه من غير شرح رمزي. وُضعت علامتا الحاشيتين في موضعي المسألتين اللغويتين اللتين تشرحهما الحاشيتان.
