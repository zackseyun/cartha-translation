  text: καὶ ὑπομονὴν ἔχεις, καὶ ἐβάστασας διὰ τὸ ὄνομά μου, καὶ ⸂οὐ κεκοπίακες⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/003.yaml
  text: And you have endurance[a], and have borne up for my name[b], and have not grown weary.
translation:
  language: ar
  text: وَلَدَيْكَ ثَبَاتٌ، وَقَدْ تَحَمَّلْتَ مِنْ أَجْلِ اسْمِي[a]، وَلَمْ تَكِلَّ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «بسبب اسمي»، أو «في سبيل اسمي».
    reason: lexical_alternative
  - marker: b
    text: 'أو «ولم تتعب»؛ وقد تُفهم العبارة أيضًا في صلتها بالعمل: «ولم تكلّ من العمل».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπομονὴν
  choice: ثَبَاتٌ
  rationale: تدل الكلمة على الصمود والثبات تحت الشدة. و«ثبات» لفظ عربي موجز وطبيعي يحفظ المعنى من غير أن يحصره في الصبر السلبي أو في المثابرة العملية وحدها.
- source_word: ἔχεις
  choice: وَلَدَيْكَ
  rationale: ينقل صيغة الحاضر والخطاب المباشر بعبارة عربية طبيعية، ويفيد أن المخاطَب متصف بالثبات الآن.
- source_word: ἐβάστασας
  choice: وَقَدْ تَحَمَّلْتَ
  rationale: الفعل قد يعني حمل الشيء أو احتمال العبء والمشقة. وجاء «تحملت» مطلقًا كي يدل على احتمال ما لاقوه من غير إضافة نوع محدد من الاضطهاد أو العمل لا يذكره النص.
- source_word: διὰ τὸ ὄνομά μου
  choice: مِنْ أَجْلِ اسْمِي
  rationale: تحفظ العبارة صلة الاحتمال باسم المتكلم، مع إبقاء احتمال الدافع أو الغاية الذي قد تؤديه διά مع النصب.
- source_word: οὐ κεκοπίακες
  choice: وَلَمْ تَكِلَّ
  rationale: ينقل «تكلّ» معنى التعب والفتور تحت الجهد، وتناسب الصيغة المنفية دلالة الحالة المستمرة الناتجة عن الفعل التام، من غير اختزال الكلمة في معنى العمل وحده.
theological_decisions:
- issue: دلالة لغة الثبات والاحتمال في المديح
  choice: يمدح النص ثبات المخاطَبين واحتمالهم من أجل اسم يسوع من غير تعيين صورة خاصة من الاضطهاد أو الخدمة.
  alternative: 'يمكن فهم العبارة الأخيرة في صلة أوثق بالعمل، نحو: «لم تكلّ من العمل».'
  rationale: السياق يرجح عدم الاستسلام للتعب، لكن اللفظ اليوناني قد يتعلق بالكد والعمل أيضًا؛ لذلك بقي المتن عامًا وأُثبت الاحتمال الآخر في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُعمل «لديك» بدل تركيب حرفي أثقل، وحُفظ تتابع عبارات المديح. وُضعت علامتا الحاشية عند العبارتين اللتين تفسرانهما فعلًا، تجنبًا لأي التباس في الإحالة.
