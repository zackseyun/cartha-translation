id: REV.2.2
reference: Revelation 2:2
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Οἶδα τὰ ἔργα σου, καὶ τὸν ⸀κόπον καὶ τὴν ὑπομονήν σου, καὶ ὅτι οὐ δύνῃ βαστάσαι κακούς, καὶ ἐπείρασας τοὺς λέγοντας ἑαυτοὺς ⸀ἀποστόλους, καὶ οὐκ εἰσίν, καὶ εὗρες αὐτοὺς ψευδεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/002.yaml
  text: I know your works[a], your labor, and your endurance, and that you cannot tolerate evil people. You tested those who call themselves apostles and are not[b], and you found them to be false.
translation:
  language: ar
  text: «أنا أعرف أعمالك وتعبك وثباتك، وأعرف أنك لا تستطيع أن تحتمل الأشرار[a]. وقد امتحنت الذين يقولون عن أنفسهم إنهم رسل[b]، وليسوا كذلك، فوجدتهم كاذبين.»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «لا تطيق الأشرار». واليونانية حرفيًا «لا تستطيع أن تحتمل»، وهي تدل في هذا السياق على رفض التساهل معهم.'
    reason: بديل معجمي يوضح المعنى الحرفي والدلالة السياقية من غير إلغاء أي منهما.
  - marker: b
    text: 'أو: «الذين يدّعون أنهم رسل».'
    reason: بديل معجمي موجز يبرز أن صفة الرسالة ادعاء صادر عنهم.
lexical_decisions:
- source_word: Οἶδα
  choice: أنا أعرف
  rationale: ينقل فعل المعرفة بوصفه حالة حاضرة، ويحافظ على النبرة الشخصية المباشرة في خطاب المسيح.
- source_word: ἔργα
  choice: أعمالك
  rationale: لفظ واسع يشمل أفعال المخاطَب ونشاطه، ويلائم الاستعمال الكتابي المألوف.
- source_word: κόπον
  choice: تعبك
  rationale: ينقل معنى الجهد الشاق والمرهق، وهو طبيعي وواضح في العربية المعاصرة.
- source_word: ὑπομονήν
  choice: ثباتك
  rationale: يدل على الاستمرار الراسخ تحت الضغط، من غير أن يحصر المعنى في الانتظار الهادئ الذي قد يوحي به «الصبر» وحده.
- source_word: οὐ δύνῃ βαστάσαι
  choice: لا تستطيع أن تحتمل
  rationale: يحافظ على صورة «الحمل/الاحتمال» وعلى صيغة عدم الاستطاعة في اليونانية، مع بقاء الدلالة السياقية على رفض التساهل معهم.
- source_word: κακούς
  choice: الأشرار
  rationale: الصفة المذكرة المجموعة مستعملة اسميًا للدلالة على أشخاص أشرار؛ و«الأشرار» موجزة وطبيعية ولا تخصص المرجع بالرجال دون موجب.
- source_word: ἐπείρασας
  choice: امتحنت
  rationale: ينقل معنى إخضاع ادعائهم للاختبار والتحقق، لا مجرد ملاحظتهم.
- source_word: λέγοντας ἑαυτοὺς ἀποστόλους
  choice: الذين يقولون عن أنفسهم إنهم رسل
  rationale: يحافظ على القوة الانعكاسية في ἑαυτούς، ويبين أن صفة الرسالة ادعاء صادر عنهم.
- source_word: ἀποστόλους
  choice: رسل
  rationale: ينقل اللقب الكنسي المرجح في السياق، لا المعنى العام «مبعوثين» فحسب.
- source_word: ψευδεῖς
  choice: كاذبين
  rationale: تعبير عربي طبيعي مع «وجدتهم»، ويصف بطلان دعواهم؛ أما «زائفين» فأقل طبيعية عند وصف الأشخاص في هذا التركيب.
theological_decisions:
- issue: طبيعة صفة المدّعين أنهم ἀποστόλους
  choice: رسل
  alternative: مبعوثون
  rationale: السياق يتناول اختبار أشخاص يدّعون سلطة رسولية داخل الكنائس؛ لذلك يحفظ «رسل» المعنى الاصطلاحي المرجح من غير إضافة تصور مؤسسي لاحق.
- issue: دلالة οὐ δύνῃ βαστάσαι بين عدم القدرة ورفض التساهل
  choice: لا تستطيع أن تحتمل
  alternative: لا تتسامح مع
  rationale: الصياغة المختارة أقرب إلى بنية الأصل وتحفظ توتر العبارة بين عدم الاحتمال ورفض قبول الأشرار، بدل حسمها في معنى تفسيري واحد.
- issue: هوية κακούς من جهة الجنس
  choice: الأشرار
  alternative: الرجال الأشرار
  rationale: صيغة اليونانية المذكرة مستعملة للدلالة على أشخاص، ولا يقتضي السياق قصر المرجع على الذكور؛ لذا لا تُضاف كلمة «الرجال».
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حوفظ على ضمير المخاطب المفرد، وعلى تكرار معنى المعرفة لربط عناصر الجملة طبيعيًا بالعربية. وُضعت علامتا الحاشيتين في موضعي العبارتين اللتين تفسرانهما.
