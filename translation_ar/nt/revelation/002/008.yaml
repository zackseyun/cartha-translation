id: REV.2.8
reference: Revelation 2:8
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ ⸀τῆς ἐν Σμύρνῃ ἐκκλησίας γράψον· Τάδε λέγει ὁ πρῶτος καὶ ὁ ἔσχατος, ὃς ἐγένετο νεκρὸς καὶ ἔζησεν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/008.yaml
  text: 'And to the angel of the church in Smyrna write: These things says the First and the Last[b][a], who became dead and lived again:'
translation:
  language: ar
  text: '«واكتب إلى ملاك[a] الكنيسة التي في سميرنا: هذا ما يقوله الأول والآخِر، الذي صار ميتًا ثم عاد إلى الحياة[b]:»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «رسول» الكنيسة التي في سميرنا.'
    reason: alternative_reading
  - marker: b
    text: 'وحرفيًا: «صار ميتًا وحَيِيَ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: ملاك
  rationale: المعنى الغالب في السياق الرؤيوي للسفر هو الكائن السماوي، مع بقاء معنى «رسول» ممكنًا ومعروضًا في الحاشية.
- source_word: ἐκκλησίας
  choice: الكنيسة
  rationale: يشير اللفظ هنا إلى جماعة المؤمنين المسيحية، و«الكنيسة» هي المقابل العربي الجاري والواضح في هذا السياق.
- source_word: Τάδε λέγει
  choice: هذا ما يقوله
  rationale: صياغة عربية طبيعية تحفظ طابع افتتاحية الرسالة النبوية وزمن الفعل المضارع.
- source_word: ὁ πρῶτος καὶ ὁ ἔσχατος
  choice: الأول والآخِر
  rationale: حُفظ اللقب بصيغته التعريفية، بما يعكس قوة التسمية وأصداءها الكتابية من غير إضافة تفسير.
- source_word: ἐγένετο νεκρὸς
  choice: صار ميتًا
  rationale: يحفظ الدلالة الحدثية للفعل ἐγένετο، أي الدخول في الموت، بدل تحويل العبارة إلى مجرد وصف لحالة ماضية.
- source_word: ἔζησεν
  choice: عاد إلى الحياة
  rationale: ينقل في العربية بوضوح وطبيعية الانتقال المقابل من الموت إلى الحياة في هذا السياق.
theological_decisions:
- issue: لقب المسيح وصياغة موته وقيامته
  choice: «الأول والآخِر، الذي صار ميتًا ثم عاد إلى الحياة»
  alternative: «الأول والآخِر، الذي كان ميتًا فحيا»
  rationale: تحفظ الصياغة اللقب المسيحاني والإشارة الصريحة إلى الموت والعودة إلى الحياة، مع إبقاء الدلالة الحدثية لـἐγένετο وعدم إضافة شرح عقائدي خارج النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدمت «هذا ما يقوله» لتجنب التركيب الحرفي المتكلف، مع الحفاظ على نبرة الإعلان النبوي. وُضع كل مؤشر حاشية في المتن.
