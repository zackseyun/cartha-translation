id: REV.2.10
reference: Revelation 2:10
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ⸀μηδὲν φοβοῦ ἃ μέλλεις ⸀πάσχειν. ⸀ἰδοὺ μέλλει ⸀βάλλειν ὁ διάβολος ἐξ ὑμῶν εἰς φυλακὴν ἵνα πειρασθῆτε, καὶ ⸀ἕξετε θλῖψιν ἡμερῶν δέκα. γίνου πιστὸς ἄχρι θανάτου, καὶ δώσω σοι τὸν στέφανον τῆς ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/010.yaml
  text: Do not fear what you are about to suffer[a]. Look, the devil is about to throw some of you into prison so that you may be tested, and you will have tribulation for ten days. Be faithful until death[c][b], and I will give you the crown of life.
translation:
  language: ar
  text: لا تخف شيئًا مما أنت على وشك أن تعانيه. ها إن إبليس على وشك أن يلقي بعضكم في السجن لكي تُمتحنوا[a]، وسيكون لكم ضيق لمدة عشرة أيام. كن أمينًا حتى الموت[b]، فسأعطيك إكليل الحياة[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمتها: «لكي تُجرَّبوا» أو «لكي تُبتلوا»؛ فالفعل اليوناني قد يدل بحسب السياق على الامتحان أو الابتلاء أو التجربة.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أن تعني «حتى الموت» أيضًا: «إلى حد الموت» أو «ولو أدى ذلك إلى الموت»، أي الثبات في الأمانة حتى إن استلزم الأمر الاستشهاد.'
    reason: alternative_reading
  - marker: c
    text: الكلمة اليونانية المترجمة «إكليل» تشير إلى إكليل الظفر أو الجائزة، لا إلى تاج ملكي.
    reason: cultural_note
lexical_decisions:
- source_word: μηδὲν φοβοῦ
  choice: لا تخف شيئًا
  rationale: يحافظ على قوة النهي مع μηδέν، ويأتي بصياغة عربية واضحة وطبيعية.
- source_word: ἃ μέλλεις πάσχειν
  choice: مما أنت على وشك أن تعانيه
  rationale: تنقل μέλλω دلالة قرب الوقوع، وتنقل πάσχειν معنى المعاناة أو المكابدة.
- source_word: ἰδοὺ
  choice: ها إن
  rationale: أداة عربية فصيحة معاصرة تلفت الانتباه إلى ما يلي من غير استعمال صيغة مهجورة.
- source_word: μέλλει βάλλειν
  choice: على وشك أن يلقي
  rationale: تحفظ معنى قرب الحدث في μέλλω والمعنى الحركي للفعل βάλλω.
- source_word: ὁ διάβολος
  choice: إبليس
  rationale: الاسم العربي المألوف للخصم الشيطاني الشخصي المقصود في السياق.
- source_word: ἐξ ὑμῶν
  choice: بعضكم
  rationale: تفيد العبارة اليونانية اختيار عدد من داخل الجماعة، و«بعضكم» هي الصياغة العربية الطبيعية.
- source_word: εἰς φυλακήν
  choice: في السجن
  rationale: تدل φυλακή هنا على الحبس، و«السجن» يلائم مقام الاضطهاد.
- source_word: ἵνα πειρασθῆτε
  choice: لكي تُمتحنوا
  rationale: يحفظ «تُمتحنوا» معنى الاختبار في سياق السجن والاضطهاد، مع إبقاء احتمال التجربة أو الابتلاء في الحاشية.
- source_word: ἕξετε θλῖψιν ἡμερῶν δέκα
  choice: وسيكون لكم ضيق مدة عشرة أيام
  rationale: يحافظ على تركيب «سيكون لكم» وعلى ثقل θλῖψις بوصفه ضيقًا واضطهادًا، ويصرح بدلالة المدة في المضاف إليه اليوناني.
- source_word: γίνου πιστός
  choice: كن أمينًا
  rationale: أمر موجز يدل في السياق على الثبات في الأمانة، ويوافق المخاطب المفرد.
- source_word: ἄχρι θανάτου
  choice: حتى الموت
  rationale: ترجمة مباشرة تبقي مفتوحًا معنى الاستمرار إلى نهاية الحياة ومعنى الثبات ولو أدى إلى الموت.
- source_word: τὸν στέφανον τῆς ζωῆς
  choice: إكليل الحياة
  rationale: «إكليل» يميز stephanos، وهو إكليل الظفر أو الجائزة، من التاج الملكي، مع الحفاظ على الإضافة اليونانية.
theological_decisions:
- issue: دلالة πειρασθῆτε في سياق عمل إبليس والاضطهاد
  choice: تُمتحنوا
  alternative: تُجرَّبوا أو تُبتلوا
  rationale: السياق المباشر هو السجن والضيق اللذان يكشفان الأمانة ويختبرانها، لكن اللفظ اليوناني قد يدل أيضًا على التجربة أو الابتلاء؛ لذلك لم يُلغَ هذا الاحتمال بل ذُكر في الحاشية.
- issue: مدى عبارة ἄχρι θανάτου
  choice: حتى الموت
  alternative: إلى حد الموت، أو ولو أدى ذلك إلى الموت
  rationale: الصياغة المختارة قريبة من اليونانية ولا تحصر المعنى في الاستشهاد وحده، مع أن السياق يسمح بوضوح بالأمانة ولو استلزمت الموت.
- issue: صورة στέφανος ووعد الحياة
  choice: إكليل الحياة
  alternative: تاج الحياة
  rationale: «إكليل» أدق ثقافيًا لأنه يدل على إكليل الظفر أو المكافأة لا على تاج السيادة الملكية، من غير حسم طبيعة الإضافة «الحياة» تفسيرًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة، مع مخاطبة المفرد حيث يخاطب المسيح ملاك الكنيسة أو ممثلها، والجمع حيث يتحدث عن أفراد الجماعة. جرى تجنب الألفاظ القديمة غير الضرورية، مع الإبقاء على المصطلحات ذات الثقل في سفر الرؤيا مثل «الضيق» و«إكليل الحياة».
