id: REV.2.11
reference: Revelation 2:11
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις. ὁ νικῶν οὐ μὴ ἀδικηθῇ ἐκ τοῦ θανάτου τοῦ δευτέρου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/011.yaml
  text: The one who has an ear[a], let him hear what the Spirit says to the churches[b]. The one who conquers will certainly not be harmed by the second death.
translation:
  language: ar
  text: مَن له أُذُن، فليسمع ما يقوله الروح للكنائس. مَن يغلب فلن يناله أذى من الموت الثاني.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ويجوز: «لن يتضرر من الموت الثاني» أو «لن يؤذه الموت الثاني».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: مَن له أُذُن
  rationale: صياغة عربية طبيعية تحفظ المفرد التمثيلي وصورة «الأذن» في العبارة اليونانية.
- source_word: ἀκουσάτω
  choice: فليسمع
  rationale: لام الأمر تنقل قوة صيغة الأمر الغائب المفرد بوضوح وإيجاز.
- source_word: τὸ πνεῦμα
  choice: الروح
  rationale: السياق المتكرر في رؤيا 2–3 يدل على الروح القدس بوصفه المتكلم، ولا تحتاج العربية إلى تمييز طباعي.
- source_word: ταῖς ἐκκλησίαις
  choice: للكنائس
  rationale: يشير اللفظ هنا إلى جماعات المؤمنين المخاطَبة، و«الكنائس» هو المقابل السياقي الواضح.
- source_word: ὁ νικῶν
  choice: مَن يغلب
  rationale: يحفظ معنى الغلبة المستمرة أو المميِّزة للشخص، وهو تعبير مألوف وطبيعي في العربية الكتابية المعاصرة.
- source_word: οὐ μὴ
  choice: فلن
  rationale: «لن» تنقل النفي المستقبلي المؤكد، ويساعد اقترانها بالصياغة كلها على إبراز قوة النفي اليوناني.
- source_word: ἀδικηθῇ
  choice: يناله أذى
  rationale: ينقل معنى التضرر أو الإصابة بالأذى في هذا السياق، ويتجنب المعنى القضائي الأضيق لـ«يُظلَم».
- source_word: ἐκ τοῦ θανάτου τοῦ δευτέρου
  choice: من الموت الثاني
  rationale: يحفظ حرف الجر الدال على المصدر في اليونانية ويحافظ على العبارة الأخروية دون تفسير زائد.
theological_decisions:
- issue: مرجع «الروح»
  choice: الروح القدس المتكلم إلى الكنائس
  alternative: الروح النبوي بمعنى أعم
  rationale: لازمة الرسائل في رؤيا 2–3 تعرض الروح متكلمًا إلهيًا، مع إبقاء النص العربي على لفظ «الروح» نفسه دون إضافة تفسيرية.
- issue: القوة التمثيلية لصيغ المفرد
  choice: مَن له أذن، فليسمع؛ مَن يغلب
  alternative: إعادة الصياغة بالجمع
  rationale: تحفظ الصياغة العربية المفرد التمثيلي الموجود في اليونانية مع شمول المعنى لكل سامع.
- issue: معنى «الموت الثاني»
  choice: إبقاء التعبير كما هو
  alternative: شرحه في المتن بأنه الدينونة الأخيرة أو الهلاك الأبدي
  rationale: يفسر سفر الرؤيا هذا المصطلح في مواضع لاحقة، ولذلك لا ينبغي تحميل هذه الآية شرحًا عقائديًا زائدًا.
- issue: علاقة الأذى بالموت الثاني
  choice: الأذى صادر من الموت الثاني أو ناشئ عنه
  alternative: أن يكون المعنى مجرد النجاة المكانية منه
  rationale: حرف الجر ἐκ مع المبني للمجهول يسمح بعلاقة المصدر، فتحفظ «من» هذا الاتساع بدل حصره في أداة سببية واحدة.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة مهيبة موجزة. استُخدمت «فليسمع» للمحافظة على قوة الأمر، و«مَن يغلب» لما لها من طبيعية واتساق مع لغة الرؤيا. أُبقي «الموت الثاني» بلا شرح تفسيري.
