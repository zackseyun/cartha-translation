  to: '«اكتب إلى ملاك الكنيسة في أفسس[a]: هذا ما يقوله الذي يمسك النجوم السبعة في يده اليمنى، ويسير بين المناير السبع الذهبية:»'
  rationale: تُصحَّح تسمية حوامل المصابيح إلى «المناير» لتحقيق الدقة المعجمية والاتساق مع صورة السفر، وتُصاغ عبارتا اليد والمشي بعبارة عربية فصحى أوضح. ولا يتغير المعنى، وتبقى هوية «ملاك» غير محسومة عبر الحاشية.
