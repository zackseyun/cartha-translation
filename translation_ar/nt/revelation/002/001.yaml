source:
  edition: SBLGNT
  text: Τῷ ἀγγέλῳ ⸀τῆς ἐν Ἐφέσῳ ἐκκλησίας γράψον· Τάδε λέγει ὁ κρατῶν τοὺς ἑπτὰ ἀστέρας ἐν τῇ δεξιᾷ αὐτοῦ, ὁ περιπατῶν ἐν μέσῳ τῶν ἑπτὰ λυχνιῶν τῶν χρυσῶν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/001.yaml
  text: 'To the angel of the church in Ephesus write: These things says the one who holds the seven stars in his right hand[a], who walks among the seven golden lampstands:'
translation:
  language: ar
  text: '«اكتب إلى ملاك الكنيسة في أفسس[a]: هذا ما يقوله الذي يمسك النجوم السبعة في يده اليمنى، ويسير بين المناير السبع الذهبية:»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «رسول الكنيسة في أفسس».'
    reason: تحفظ الحاشية الاحتمال المعجمي والتفسيري الآخر لكلمة ἀγγέλῳ.
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: ملاك
  rationale: تحتمل الكلمة اليونانية ملاكًا سماويًا أو رسولًا بشريًا. اختير «ملاك» في المتن لمناسبته السياق الرؤيوي، مع إبقاء البديل في الحاشية.
- source_word: ἐκκλησίας
  choice: الكنيسة
  rationale: هي المقابل العربي الطبيعي للجماعة المسيحية في هذا السياق.
- source_word: γράψον
  choice: اكتب
  rationale: ينقل فعل الأمر اليوناني المباشر بوضوح وإيجاز.
- source_word: Τάδε λέγει
  choice: هذا ما يقوله
  rationale: صياغة عربية طبيعية تحفظ نبرة الإعلان النبوي الجليل.
- source_word: κρατῶν
  choice: الممسك
  rationale: يفيد الإمساك والسيطرة، ويحافظ على الصورة الحسية من غير توسع تفسيري.
- source_word: δεξιᾷ
  choice: يمينه
  rationale: مقابل عربي مباشر؛ وذكر «اليد» مفهوم ضمنًا في العربية كما هو في اليونانية.
- source_word: περιπατῶν
  choice: الماشي
  rationale: يحافظ على صورة الحركة الفعلية الواردة في النص.
- source_word: ἐν μέσῳ
  choice: بين
  rationale: تعبير عربي واضح وطبيعي عن الحركة في وسط المنارات.
- source_word: λυχνιῶν
  choice: المنارات
  rationale: تشير λυχνία إلى حامل السراج لا إلى السراج نفسه، و«المنارات» صيغة عربية كتابية واضحة لهذا الشيء.
- source_word: χρυσῶν
  choice: الذهبية
  rationale: ينقل الصفة اليونانية بصورة عربية طبيعية.
theological_decisions:
- issue: هوية «ملاك الكنيسة»
  choice: إبقاء «ملاك» في المتن
  alternative: رسول الكنيسة
  rationale: تسمح ἄγγελος بالمعنيين، لكن الجو الرؤيوي يرجح «ملاك» من غير أن يحسم هوية المشار إليه؛ لذلك حُفظ البديل في حاشية.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة، مع المحافظة على الصياغة النبوية والصور المتكررة في سفر الرؤيا. وُضع مؤشر الحاشية بعد «ملاك» لأنه متعلق بهذه الكلمة.
