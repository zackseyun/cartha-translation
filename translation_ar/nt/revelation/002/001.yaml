  timestamp: '2026-07-19T06:35:49Z'
review_pass:
  verdict: revise
  source_fidelity: المعنى العام وأمر الكتابة وصيغة الإعلان النبوي محفوظة، كما حُفظ احتمال ἀγγέλῳ في الحاشية. لكن «المنارات» في الاستعمال العربي الحديث تدل غالبًا على منارات بحرية أو مآذن، ولا تؤدي بدقة صورة λυχνίαι، أي حوامل المصابيح/المناير.
  naturalness: «في يده اليمنى» أوضح وأفصح في العربية المعاصرة من «في يمينه» في هذا السياق، و«الذي يسير» أيسر وأقل التباسًا من الاسم الوصفي «الماشي». كذلك «الكنيسة في أفسس» صياغة طبيعية ومباشرة.
  terminology: يُستبقى «ملاك» في المتن مع «رسول» في الحاشية صونًا للغموض المقصود. واستُبدلت «المنارات» بـ«المناير» لأنها المصطلح العربي الكتابي الأدق لحوامل المصابيح، مع تجنب إيحاء المنارة البحرية أو المئذنة.
  issues:
  - severity: medium
    issue: «المنارات» ليست المقابل الدقيق لـ λυχνίαι.
    rationale: λyχνία هي حامل المصباح، لا منارة بحرية أو مئذنة؛ و«المنارات» تحمل في العربية الحديثة إيحاءات مختلفة قد تحجب الصورة المقصودة والمتكررة في رؤيا 1–2.
  - severity: low
    issue: «في يمينه» تحذف الإشارة الصريحة إلى اليد.
    rationale: رغم إمكان فهمها اصطلاحيًا، فإن «في يده اليمنى» أوضح، ويطابق δεξιᾷ αὐτοῦ، أي «يده اليمنى»، من غير زيادة تفسيرية.
  - severity: low
    issue: «الماشي» أقل سلاسة في هذا التركيب.
    rationale: «الذي يسير بين» نقل عربي فصيح وطبيعي للفعل περιπατῶν ويحافظ على صورة الحركة المستمرة.
