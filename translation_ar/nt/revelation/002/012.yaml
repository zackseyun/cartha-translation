source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ τῆς ἐν Περγάμῳ ἐκκλησίας γράψον· Τάδε λέγει ὁ ἔχων τὴν ῥομφαίαν τὴν δίστομον τὴν ὀξεῖαν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/012.yaml
  text: 'And to the angel of the church in Pergamum write: These things says the one who has the sharp, double-edged sword:[a]'
translation:
  language: ar
  text: '«واكتب إلى ملاك[a] الكنيسة التي في برغامس: هذا ما يقوله الذي له السيف الحاد ذو الحدين:»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «رسول» بدلًا من «ملاك». يختلف المفسرون في ما إذا كان المقصود كائنًا سماويًا أم ممثلًا بشريًا للكنيسة.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: ملاك
  rationale: اللفظ اليوناني قد يدل على ملاك سماوي أو رسول بشري. اختيار «ملاك» يلائم صيغة الخطاب المتكررة في سفر الرؤيا، مع إبقاء هوية المشار إليه غير محسومة وذكر البديل في الحاشية.
- source_word: ἐκκλησίας
  choice: الكنيسة
  rationale: في هذا السياق المسيحي يشير اللفظ إلى جماعة المؤمنين، و«الكنيسة» هي المقابل العربي الواضح والمألوف.
- source_word: Περγάμῳ
  choice: برغامس
  rationale: نقل عربي واضح للاسم اليوناني Πέργαμος، ومتوافق مع الاستعمال الكتابي العربي الشائع.
- source_word: γράψον
  choice: اكتب
  rationale: فعل أمر مباشر، ويبيّن الكلام اللاحق مضمون ما ينبغي كتابته.
- source_word: Τάδε λέγει
  choice: هذا ما يقوله
  rationale: صياغة عربية طبيعية تحفظ قوة العبارة التقريرية الرسمية التي تستهل القول.
- source_word: ὁ ἔχων
  choice: صاحب
  rationale: يؤدي معنى اللقب الوصفي «الذي له» بلغة عربية موجزة وطبيعية، من غير تغيير دلالته.
- source_word: ῥομφαίαν
  choice: السيف
  rationale: يدل اللفظ على سيف، وربما سيف كبير، لكن تخصيص نوعه أو حجمه غير لازم هنا وقد يتجاوز ما يقتضيه السياق.
- source_word: δίστομον
  choice: ذي الحدَّين
  rationale: المعنى الحرفي «ذو فمين»، وهو تعبير اصطلاحي عن السيف ذي الحدين؛ والصياغة العربية المختارة دقيقة ومألوفة.
- source_word: ὀξεῖαν
  choice: الحاد
  rationale: مقابل مباشر وطبيعي للصفة التي تصف السيف بحدة القطع.
theological_decisions:
- issue: هوية «ملاك» الكنيسة
  choice: إبقاء «ملاك» في المتن من دون تحديد إن كان سماويًا أم بشريًا.
  alternative: رسول أو ممثل بشري للكنيسة.
  rationale: لفظ ἄγγελος يحتمل الدلالتين، والآية نفسها لا تحسم هوية المشار إليه؛ لذلك تُحفظ المسألة مفتوحة مع بيان البديل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت صياغة «هذا ما يقوله» لتكون طبيعية مع الحفاظ على الطابع الرسمي، و«صاحب السيف» بوصفها لقبًا عربيًا موجزًا. وُضع مؤشر الحاشية بعد الجملة التي تتضمن اللفظ محل الإيضاح.
