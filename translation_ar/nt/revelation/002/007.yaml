id: REV.2.7
reference: Revelation 2:7
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις. τῷ νικῶντι δώσω αὐτῷ φαγεῖν ἐκ τοῦ ξύλου τῆς ζωῆς, ὅ ἐστιν ἐν τῷ παραδείσῳ τοῦ ⸀θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/007.yaml
  text: The one who has an ear[a], let him hear what the Spirit says to the churches. To the one who conquers I will give to eat from the tree of life, which is in the paradise of God.
translation:
  language: ar
  text: مَن له أُذُن، فليسمع ما يقوله الروح للكنائس. ومَن يَغلِب[a]، فسأعطيه أن يأكل من شجرة الحياة التي في فردوس الله.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مَن ينتصر».'
    reason: بديل معجمي للفعل νικάω يحفظ معنى التغلب والانتصار.
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: مَن له أُذُن
  rationale: ينقل التركيب الوصفي المفرد بصياغة عربية طبيعية، ويحافظ على مفرد «أُذُن» في العبارة الحَضّية المتكررة.
- source_word: ἀκουσάτω
  choice: فليسمع
  rationale: لام الأمر مع المضارع تنقل قوة فعل الأمر اليوناني للغائب بوضوح وفصاحة.
- source_word: τὸ πνεῦμα
  choice: الروح
  rationale: السياق المتكرر في رسائل الرؤيا إلى الكنائس يدل على الروح القدس، ولفظ «الروح» يحافظ على إيجاز الأصل من غير إضافة تفسيرية إلى المتن.
- source_word: λέγει ταῖς ἐκκλησίαις
  choice: يقوله الروح للكنائس
  rationale: المضارع العربي يلائم المضارع اليوناني، و«الكنائس» هو المقابل السياقي المألوف لـ ἐκκλησίαις في رؤيا 2–3.
- source_word: τῷ νικῶντι
  choice: مَن يَغلِب
  rationale: يحافظ على القوة الفعلية للمضارع وعلى صورة الغلبة والصراع في سفر الرؤيا، بدل تحويل الوصف إلى لقب جامد.
- source_word: δώσω αὐτῷ
  choice: فسأعطيه
  rationale: ينقل المستقبل وضمير المفعول غير المباشر في صياغة عربية طبيعية، والفاء تربط جواب الوعد بالموصول الشرطي «مَن».
- source_word: φαγεῖν
  choice: أن يأكل
  rationale: ترجمة مباشرة للمصدر اليوناني، بلا استبداله بتعبير ديني أوسع مثل «يتناول» أو «يشترك».
- source_word: ἐκ τοῦ ξύλου τῆς ζωῆς
  choice: من شجرة الحياة
  rationale: «من» تنقل دلالة المصدر في ἐκ، وξύλον في هذا السياق هو الشجرة المعروفة من صدى سفر التكوين.
- source_word: παραδείσῳ
  choice: فردوس
  rationale: يحفظ الدلالة الأخروية والتناصية للفظ παράδεισος، ولا يختزلها في «حديقة» عادية.
- source_word: τοῦ θεοῦ
  choice: الله
  rationale: الإضافة العربية في «فردوس الله» تنقل المضاف إليه اليوناني بإيجاز ودقة.
theological_decisions:
- issue: مرجع τὸ πνεῦμα
  choice: الروح، والمقصود سياقيًا الروح القدس
  alternative: روح على نحو عام
  rationale: اللازمة المتكررة في رؤيا 2–3 تقدم كلام الروح خطابًا إلهيًا إلى الكنائس. أبقى المتن لفظ «الروح» كما في الأصل من غير إضافة «القدس» تفسيرًا داخله.
- issue: ترجمة νικάω في صيغة الوعد
  choice: يَغلِب
  alternative: ينتصر
  rationale: «يغلب» تعكس الفعل اليوناني وصورة الصراع والانتصار في الرؤيا، مع إبقاء البديل الطبيعي «ينتصر» في الحاشية.
- issue: المفرد التمثيلي في الحث والوعد
  choice: مَن له أذن... ومَن يغلب... فسأعطيه
  alternative: صياغة جمع شاملة
  rationale: يحافظ المفرد على بنية الأصل وعلى توجه الخطاب إلى كل سامع وغالب، مع كون «مَن» عامة تشمل كل شخص.
translation_notes:
  register: العربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُعملت «فليسمع» للحث، و«فردوس الله» للمحافظة على الصدى اللاهوتي والتناصي، مع تجنب التوسع التفسيري أو الاصطلاحات المذهبية.
