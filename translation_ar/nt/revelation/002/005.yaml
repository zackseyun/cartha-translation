id: REV.2.5
reference: Revelation 2:5
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: μνημόνευε οὖν πόθεν ⸀πέπτωκας, καὶ μετανόησον καὶ τὰ πρῶτα ἔργα ποίησον· εἰ δὲ μή, ἔρχομαί ⸀σοι, καὶ κινήσω τὴν λυχνίαν σου ἐκ τοῦ τόπου αὐτῆς, ἐὰν μὴ μετανοήσῃς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/005.yaml
  text: Therefore remember from where you have fallen[a], and repent, and do the works you did at first. But if not, I am coming to you, and I will remove your lampstand from its place[b], unless you repent.
translation:
  language: ar
  text: فاذكر إذًا من أين سقطتَ[a]، وتُبْ، واعمل الأعمال التي كنت تعملها في البدء. وإلّا فإني آتي إليك، وسأُزيح منارتك من موضعها[b]، إن لم تتب.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «من أي علوّ سقطتَ». يقول اليوناني حرفيًا: «من أين سقطتَ»، ويفهم بعضهم العبارة على أنها تتضمن صورة السقوط من علوّ.'
    reason: lexical_alternative
  - marker: b
    text: المنارة هي الصورة التي ترمز إلى كنيسة في رؤيا 1:20.
    reason: cross_reference
lexical_decisions:
- source_word: μνημόνευε
  choice: اذكر
  rationale: صيغة الأمر الحاضر تدعو إلى استحضار الأمر باستمرار، و«اذكر» هي الصياغة العربية الطبيعية المباشرة.
- source_word: οὖν
  choice: إذًا
  rationale: تحفظ علاقة الاستنتاج بما سبق في عبارة عربية واضحة.
- source_word: πόθεν πέπτωκας
  choice: من أين سقطتَ
  rationale: يحافظ على التعبير اليوناني وصورته من غير إضافة «علوّ» غير مصرّح بها، كما تعكس صيغة الماضي التام سقوطًا وقع وبقي أثره.
- source_word: μετανόησον / μετανοήσῃς
  choice: تُبْ / تتب
  rationale: «تاب» هو المقابل العربي المألوف والواضح للتوبة الأخلاقية والروحية في هذا السياق.
- source_word: τὰ πρῶτα ἔργα ποίησον
  choice: اعمل الأعمال التي كنت تعملها في البدء
  rationale: صياغة عربية طبيعية توضّح البعد الزمني في πρῶτα من دون تغيير معنى الأعمال.
- source_word: εἰ δὲ μή
  choice: وإلّا
  rationale: تنقل الشرط التحذيري بإيجاز ووضوح، مع الإبقاء على حدّة الانتقال.
- source_word: ἔρχομαί σοι
  choice: فإني آتي إليك
  rationale: تحفظ الحاضر اليوناني بما فيه من حيوية وقرب، ولا تضيف معنى «عليك» أو «ضدك» غير الصريح.
- source_word: κινήσω
  choice: سأُزيح
  rationale: يحفظ معنى التحريك من الموضع، بينما يبيّن السياق أن النتيجة هي إزالة المنارة من مكانها.
- source_word: τὴν λυχνίαν σου
  choice: منارتك
  rationale: «منارة» في العربية الكتابية المعاصرة تدل على حامل السراج لا السراج نفسه، وتحفظ الصورة الرمزية الواردة في الرؤيا.
- source_word: ἐκ τοῦ τόπου αὐτῆς
  choice: من موضعها
  rationale: ترجمة مباشرة وطبيعية تحافظ على صورة نقل المنارة من مكانها.
theological_decisions:
- issue: طبيعة التحذير المتعلق بالمنارة
  choice: الإبقاء على صورة إزاحة منارة الكنيسة من موضعها من غير تفسيرها عقائديًا داخل النص.
  alternative: تفسيرها صراحةً بأنها فقدان للشهادة، أو زوال مكانة الكنيسة ووجودها، أو فقدان للخلاص.
  rationale: يعرّف رؤيا 1:20 المنارات بأنها الكنائس، لكن الآية لا تحدد نتيجة لاهوتية منهجية تخص خلاص الأفراد؛ لذلك تُحفظ الصورة وما فيها من توتر.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُخدم «إذًا» لإظهار الاستنتاج، و«وإلّا» للتحذير الشرطي، مع الحفاظ على صورة السقوط والمنارة وعدم حسم دلالتهما اللاهوتية بما يتجاوز النص.
