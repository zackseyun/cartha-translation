  text: ἀλλὰ ἔχω κατὰ σοῦ ὅτι τὴν ἀγάπην σου τὴν πρώτην ἀφῆκες.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/004.yaml
  text: 'But I have this against you: you have abandoned your first love[a].'
translation:
  language: ar
  text: 'لكِنْ عِندِي عَلَيْكَ هَذَا: أَنَّكَ تَرَكْتَ مَحَبَّتَكَ الْأُولَى[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «تخلَّيتَ عن محبتك الأولى». وقد تشير العبارة إلى المحبة التي كانت لك في البداية، سواء أكانت للرب، أم محبة بعضكم لبعض، أم كليهما.'
    reason: بديل معجمي وبيان الغموض المقصود في متعلَّق المحبة
lexical_decisions:
- source_word: ἀλλὰ
  choice: لكِنْ
  rationale: أداة استدراك تُبرز التباين الحاد بين المديح السابق والعتاب الآتي، وهي المقابل العربي الطبيعي هنا.
- source_word: ἔχω κατὰ σοῦ
  choice: لِي عَلَيْكَ هَذَا
  rationale: يحفظ التعبير قوة الشكوى أو المؤاخذة في صياغة عربية واضحة، من غير إضافة معنى قضائي لا يصرّح به النص.
- source_word: ὅτι
  choice: أَنَّكَ
  rationale: تُدخل مضمون المؤاخذة مباشرة، وتحافظ على الصلة النحوية الصريحة الموجودة في اليونانية.
- source_word: τὴν ἀγάπην σου
  choice: مَحَبَّتَكَ
  rationale: «المحبة» هي المقابل العربي المباشر والطبيعي لـἀγάπη، والضمير يحفظ الإسناد إلى المخاطَب.
- source_word: τὴν πρώτην
  choice: الْأُولَى
  rationale: يحفظ المعنى المباشر لـπρώτην ولا يحصره في تفسير مثل «السابقة» أو «التي كانت في البداية».
- source_word: ἀφῆκες
  choice: تَرَكْتَ
  rationale: يعني الفعل هنا الترك أو التخلي. «تركت» واضحة وقريبة من اللفظ اليوناني، وتُبقي درجة القوة الدلالية مفتوحة بدل تشديدها تلقائيًا إلى «هجرت» أو «نبذت».
theological_decisions:
- issue: المقصود بعبارة «محبتك الأولى»
  choice: الإبقاء على العبارة الموجزة «محبتك الأولى» دون تحديد متعلَّق المحبة.
  alternative: «محبتك لي التي كانت في البدء» أو «المحبة التي كانت لك أولًا»
  rationale: لا يحدد النص اليوناني صراحة هل المقصود المحبة للرب، أم للمؤمنين بعضهم لبعض، أم كليهما؛ لذلك تحافظ الصياغة على الانفتاح والتوتر التفسيري.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت صيغة «لي عليك هذا» للمؤاخذة المباشرة، مع إبقاء «محبتك الأولى» حرفية ومفتوحة دلاليًا.
