  text: For if I grieve you[a], who is there to make me glad except the one who is grieved by me?
translation:
  language: ar
  text: لأَنِّي إِنْ أُحْزِنْكُمْ، فَمَنْ يُفْرِحُنِي إِلَّا مَنْ أُحْزِنُهُ؟[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إِلَّا مَنْ هُوَ مَحْزُونٌ بِسَبَبِي»؛ فالصيغة اليونانية مبنية للمجهول، والعبارة قد تدل على المصدر أو السبب: «مِنِّي» أو «بِسَبَبِي».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λυπῶ
  choice: أَحْزَنْتُكُمْ
  rationale: ينقل الفعل معنى التسبّب بالحزن، وصيغة «أحزن» عربية واضحة ومباشرة وتحافظ على قوته السببية.
- source_word: εὐφραίνων
  choice: يُفْرِحُنِي
  rationale: يعبر بوضوح عن الشخص الذي يجلب الفرح لبولس، ويحافظ على المقابلة اللفظية الطبيعية بين الحزن والفرح.
- source_word: τίς ὁ εὐφραίνων με
  choice: فَمَنْ يُفْرِحُنِي
  rationale: صياغة استفهامية عربية طبيعية تنقل قوة السؤال البلاغي، مع تمثيل اسم الفاعل اليوناني بوصفه فعلاً ذا فاعل شخصي.
- source_word: ὁ λυπούμενος
  choice: مَنْ أَحْزَنْتُهُ أَنَا
  rationale: الأصل اسم فاعل مبني للمجهول، أي «مَن هو محزون»، لكن السياق وعبارة ἐξ ἐμοῦ يبيّنان أن بولس مصدر الحزن؛ والصياغة العربية المختارة طبيعية مع توكيد الفاعل.
- source_word: ἐξ ἐμοῦ
  choice: أَنَا
  rationale: تفيد العبارة المصدر أو السبب، أي أن الحزن صادر عن بولس أو بسببه. أُدمج هذا المعنى في الفعل المتعدي مع الضمير المنفصل للتوكيد، وأُثبت البديل الحرفي في الحاشية.
- source_word: γὰρ
  choice: لأَنِّي
  rationale: تربط الآية بما قبلها ربطاً تعليلياً؛ وإلحاق «إن» الشرطية بياء المتكلم في «لأني» صياغة عربية سليمة وواضحة.
theological_decisions:
- issue: هوية الشخص الذي يُفرح بولس وعلاقته بالحزن الذي سببه بولس
  choice: إلا مَن أحزنته أنا
  alternative: إلا مَن هو محزون بسببي
  rationale: 'لا تحسم الترجمة هوية الشخص بأكثر مما يقوله النص، وتحافظ على المفارقة العلاقية: مَن يُنتظر منه أن يفرح بولس هو نفسه المتألم بسبب بولس.'
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. استُخدمت المقابلة المباشرة «أحزن/يفرح» لإبراز التوازي البلاغي، ووُضع التوكيد «أنا» في آخر الجملة لتمثيل كون بولس مصدر الحزن دون إثقال العبارة.
