base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/013.yaml
  text: I had no rest in my spirit because I did not find Titus my brother[a], but after taking leave of them[c][b], I went on to Macedonia.
translation:
  language: ar
  text: لم تكن لروحي راحة، لأني لم أجد تيطس أخي[a]؛ لكنني ودّعتهم[b] ثم مضيت إلى مكدونية.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي أخي في الإيمان.
    reason: cultural_note
  - marker: b
    text: 'أو: «أخذت الإذن منهم وانصرفت».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἔσχηκα
  choice: لم تكن
  rationale: يؤدي المعنى الماضي في السياق السردي بعبارة عربية طبيعية، مع إبقاء الحالة المنفية من غير إثقال بصيغة حرفية للماضي التام اليوناني.
- source_word: ἄνεσιν τῷ πνεύματί μου
  choice: لروحي راحة
  rationale: يحفظ «راحة» الدلالة على انعدام السكون الداخلي، وتؤدي اللام احتمال الداتيف بوصفه دالًا على من تعنيه الراحة، من غير حصر المعنى في تفسير نفسي أو لاهوتي.
- source_word: τῷ μὴ εὑρεῖν με Τίτον
  choice: لأني لم أجد تيطس
  rationale: يبيّن بوضوح أن عدم العثور على تيطس هو سبب انعدام الراحة، من غير إضافة معنى العجز الموجود في «لم أستطع أن أجد».
- source_word: τὸν ἀδελφόν μου
  choice: أخي
  rationale: يحفظ الاستعارة العائلية ودفئها في كلام بولس عن تيطس، وهو أخ له في الإيمان ورفيق في الخدمة.
- source_word: ἀποταξάμενος αὐτοῖς
  choice: ودّعتهم
  rationale: صياغة عربية واضحة وطبيعية لمعنى توديع أهل ترواس والانصراف عنهم؛ وتدل الواو مع ترتيب السرد على وقوع التوديع قبل الذهاب.
- source_word: ἐξῆλθον εἰς Μακεδονίαν
  choice: مضيت إلى مكدونية
  rationale: «مضيت» تعبير عربي فصيح وواضح عن مواصلة الرحلة إلى مكدونية، ويتجنب الحرفية المربكة في «خرجت إلى».
theological_decisions:
- issue: دلالة «أخي» في وصف تيطس
  choice: الإبقاء على «أخي» في المتن وشرح المقصود في الحاشية
  alternative: أخي في الإيمان ورفيقي في الخدمة
  rationale: الإبقاء على اللفظ يصون الصورة العائلية في الأصل ولا يدمج التفسير في النص، بينما ترفع الحاشية احتمال فهم القرابة الجسدية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حافظت الصياغة على قلق بولس الداخلي وعلى وصف تيطس العائلي، مع تجنب التفسير الزائد. وُضع كل مؤشّر حاشية في المتن.
