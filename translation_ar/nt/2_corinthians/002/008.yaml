  rationale: صياغة عربية طبيعية تعبّر عن المحبة الموجّهة إلى الشخص؛ أُضيف ضمير المخاطبين بوصفه لازمًا دلاليًا في السياق.
theological_decisions:
- issue: طبيعة تأكيد المحبة
  choice: الإبقاء على «تؤكّدوا» من دون تحديد فعل أو إجراء بعينه
  alternative: «تبرهنوا له على محبتكم» أو «تجددوا محبتكم له»
  rationale: الفعل اليوناني يدل على التصديق أو الإقرار أو التثبيت، والنص لا يصرّح بالكيفية؛ لذا لا تُحسم المسألة بإضافة معنى البرهنة أو التجديد.
