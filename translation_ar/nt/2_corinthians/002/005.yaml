revisions:
- from: وَإِنْ كَانَ أَحَدٌ قَدْ سَبَّبَ حُزْنًا، فَهُوَ لَمْ يُحْزِنْنِي أَنَا، بَلْ أَحْزَنَ جَمِيعَكُمْ إِلَى حَدٍّ مَا—كَيْلَا أُثْقِلَ عَلَيْكُمْ فِي الْقَوْلِ.[a]
  to: وَإِنْ كَانَ أَحَدٌ قَدْ سَبَّبَ حُزْنًا، فَلَمْ يُحْزِنِّي أَنَا، بَلْ أَحْزَنَكُمْ إِلَى حَدٍّ مَا، كَيْلَا أُثْقِلَ عَلَى جَمِيعِكُمْ.[a]
  rationale: حُذفت إضافة «في القول» غير الموجودة في الأصل، وأُبقيت صورة «الثقل» التي في ἐπιβαρῶ. اختير في المتن ربط «جميعكم» بـ«أُثقل» لسلامة العبارة العربية، مع حفظ الوجه التركيبي الآخر والتفسير السياقي المحتمل في الحاشية، دون حسم الغموض اليوناني تفسيرًا.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:24:53Z'
review_pass:
  verdict: revise
  source_fidelity: 'المتن اليوناني يكرر فعل λυπέω بصيغة التام: «إن كان أحد قد سبّب حزنًا، فإنه لم يحزنني أنا، بل ...». وتعلّق ἀπὸ μέρους وπάντας ὑμᾶς وعبارة الغاية ἵνα μὴ ἐπιβαρῶ يحتمل أكثر من وجه؛ لذا لا ينبغي أن يحسم المتن العربي هذا التعلّق بإضافة تفسير غير منصوص عليه.'
  naturalness: الصياغة العربية فصيحة وواضحة عمومًا، لكن «أُثقل عليكم في القول» تضيف قيد «في القول» إلى المتن، وهو تفسير سياقي لا مقابل لفظيًّا له في اليونانية. كما أن ترتيب «أحزن جميعكم إلى حد ما» يحسم موضع «جميعكم» في وجه واحد من وجوه التركيب المحتملة.
  terminology: «سبّب حزنًا» و«أحزن» يحافظان على الصلة اللفظية المناسبة للفعل اليوناني. و«إلى حدّ ما» ترجمة عربية طبيعية لـἀπὸ μέρους. ويُستحسن إبقاء «أُثقل» دون تقييد تفسيري في المتن، مع بيان البديل في الحاشية.
  issues:
  - severity: medium
    issue: إضافة «في القول» إلى المتن.
    rationale: لا ترد عبارة مقابلة لـ«في القول» في الأصل. قد يكون المقصود السياقي تجنّب التشديد أو المبالغة في الحكم، لكن ينبغي عرضه كتفسير أو بديل في الحاشية، لا كجزء من النص.
  - severity: medium
    issue: حسم التعلّق التركيبي لعبارة «جميعكم» في المتن دون إبقاء البديل ظاهرًا بدقة كافية.
    rationale: يمكن، بحسب التحليل، وصل «جميعكم» بالفعل الثاني «أحزن»، أو بالفعل «أُثقل». الصياغة المنقحة تختار وجهًا عربيًا مقروءًا وتثبت الوجه الآخر في الحاشية.
  revised_text: وَإِنْ كَانَ أَحَدٌ قَدْ سَبَّبَ حُزْنًا، فَلَمْ يُحْزِنِّي أَنَا، بَلْ أَحْزَنَكُمْ إِلَى حَدٍّ مَا، كَيْلَا أُثْقِلَ عَلَى جَمِيعِكُمْ.[a]
