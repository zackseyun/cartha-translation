base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/005.yaml
  text: But if anyone has caused grief[a], he has grieved not me, but in part all of you—to some extent[b], so that I may not overstate it.
translation:
  language: ar
  text: وَإِنْ كَانَ أَحَدٌ قَدْ سَبَّبَ حُزْنًا، فَلَمْ يُحْزِنِّي أَنَا، بَلْ أَحْزَنَكُمْ إِلَى حَدٍّ مَا، كَيْلَا أُثْقِلَ عَلَى جَمِيعِكُمْ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا وصل «جميعكم» بالفعل السابق: «بل أحزن جميعكم إلى حدّ ما». وتُفهم «كيلا أُثقل» أيضًا بمعنى: «كيلا أشدّد عليكم» أو «كيلا أُبالغ في الأمر».'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: λελύπηκεν
  choice: قَدْ سَبَّبَ حُزْنًا / أَحْزَنَ
  rationale: يحافظ التعبيران على الصلة المعجمية بالفعل اليوناني، وينقل استعمال «قد» أثر الفعل الماضي القائم في السياق.
- source_word: οὐκ ἐμὲ
  choice: لَمْ يُحْزِنْنِي أَنَا
  rationale: يحفظ المقابلة المباشرة في اليونانية، مع إبراز الضمير المنفصل تأكيدًا طبيعيًا في العربية.
- source_word: ἀπὸ μέρους
  choice: إِلَى حَدٍّ مَا
  rationale: تعبير عربي واضح ينقل التقييد الذي يفيده الاصطلاح، من غير أن يوحي بانقسام الجماعة إلى أجزاء.
- source_word: ἐπιβαρῶ
  choice: أُثْقِلَ عَلَيْكُمْ فِي الْقَوْلِ
  rationale: يحافظ على صورة الثقل في الفعل، ويبيّن بحسب السياق أن المقصود هو تجنّب المبالغة أو التشديد في صياغة القول.
- source_word: πάντας ὑμᾶς
  choice: جَمِيعَكُمْ
  rationale: ينقل صراحةً شمول πάντας ويحافظ على الخطاب الجماعي.
theological_decisions:
- issue: تعلّق عبارة πάντας ὑμᾶς ومغزى ἵνα μὴ ἐπιβαρῶ
  choice: جعل «جميعكم» مفعولًا لـ«أحزن»، وفهم جملة الغاية على أنها تلطيف للقول
  alternative: 'يمكن وصل «جميعكم» بالفعل «أُثقِل»، فيكون المعنى: «بل أحزنكم جزئيًا، كيلا أُثقِل على جميعكم»'
  rationale: موضع الكلمات اليوناني يحتمل الوجهين. الصياغة المختارة أوضح بالعربية وتنسجم مع ἀπὸ μέρους بوصفها قيدًا لمقدار الحزن، مع إثبات البديل في الحاشية وعدم حسم الغموض النصي بصمت.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «إلى حدّ ما» للتقييد الطبيعي، وحُفظت صورة «الثقل» مع توضيح سياقها الكلامي. علامة الحاشية [a] مثبتة في المتن.
