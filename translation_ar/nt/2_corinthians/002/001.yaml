  yaml_path: translation/nt/2_corinthians/002/001.yaml
  text: 'For I decided this for myself: not to come to you again in sorrow[a].'
translation:
  language: ar
  text: 'فإني عزمتُ في نفسي على هذا: ألّا آتي إليكم مرةً أخرى في حزن[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بحزن».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκρινα
  choice: قررتُ
  rationale: يفيد الفعل هنا قرارًا شخصيًا حاسمًا، و«قررتُ» تعبير عربي واضح وطبيعي يحفظ قوة المداولة والحسم.
- source_word: γὰρ
  choice: لأني
  rationale: تربط الأداة الآية بما قبلها على جهة التعليل أو التفسير، و«لأني» تؤدي هذه الصلة بسلاسة في العربية.
- source_word: ἐμαυτῷ
  choice: في نفسي
  rationale: يشير ضمير الانعكاس في صيغة المجرور إلى أن القرار اتُّخذ داخليًا وشخصيًا؛ و«في نفسي» صياغة عربية مألوفة تحفظ هذا المعنى.
- source_word: τοῦτο
  choice: هذا
  rationale: اسم الإشارة يستبق مضمون القرار الذي يوضحه المصدر المؤول بعد النقطتين، وإبقاؤه يحفظ بنية الأصل.
- source_word: τὸ μὴ ... ἐλθεῖν
  choice: ألّا آتي
  rationale: المصدر المعرّف يبيّن مضمون القرار؛ وصيغة «ألّا آتي» هي المقابل العربي الطبيعي المباشر.
- source_word: πάλιν
  choice: مرةً أخرى
  rationale: تدل الكلمة على التكرار، و«مرةً أخرى» واضحة وطبيعية في هذا السياق.
- source_word: ἐν λύπῃ
  choice: في حزن
  rationale: تحفظ «في حزن» صورة حرف الجر واتساع دلالة λύπη بين الحزن والأسى والضيق، من غير حسم لطبيعة الحزن أو صاحبه.
- source_word: πρὸς ὑμᾶς
  choice: إليكم
  rationale: مع فعل المجيء تدل πρός على الاتجاه نحو أشخاص، و«إليكم» هي الصياغة العربية الموجزة المألوفة.
theological_decisions:
- issue: تعلّق عبارة ἐν λύπῃ وطبيعة الحزن
  choice: في حزن
  alternative: بحزن
  rationale: يمكن أن تصف العبارة الحال أو الملابسة، وقد يظل السياق مفتوحًا بشأن ما إذا كان الحزن واقعًا على بولس أو على المخاطَبين أو على الزيارة عمومًا؛ لذلك حُفظ التعبير الواسع في المتن، مع إثبات البديل في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. استُخدمت النقطتان لإظهار أن ما بعدها يشرح اسم الإشارة «هذا»، وحُفظت صياغة موجزة قريبة من ترتيب اليونانية دون تكلّف.
