  yaml_path: translation/nt/2_corinthians/002/015.yaml
  text: For we are the aroma of Messiah to God among those who are being saved and among those who are perishing[b][a],
translation:
  language: ar
  text: لأننا رائحةُ المسيحِ العطرةُ لله بين الذين يخلُصون وبين الذين يهلكون،
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: لأننا
  rationale: تؤدي «لأن» القوة التعليلية أو التفسيرية للأداة ὅτι، ويتصل بها الضمير في العربية اتصالًا طبيعيًا.
- source_word: Χριστοῦ
  choice: المسيح
  rationale: «المسيح» المقابل العربي الراسخ للقب Χριστός، والمضاف إليه هنا يفيد أن الرائحة تخص المسيح أو تتصف به.
- source_word: εὐωδία
  choice: رائحة
  rationale: تنقل الصورة الحسية من غير إضافة وصف مثل «زكية» ليس مصرحًا به في النص اليوناني.
- source_word: τῷ θεῷ
  choice: لله
  rationale: تحافظ اللام على علاقة الاتجاه أو التقديم التي يفيدها الداتيف في صورة الرائحة الصاعدة لله.
- source_word: ἐν τοῖς σῳζομένοις
  choice: بين الذين يخلُصون
  rationale: «بين» طبيعية في هذا السياق، والفعل المضارع يحافظ على الجانب الجاري في اسم الفاعل المضارع اليوناني.
- source_word: ἐν τοῖς ἀπολλυμένοις
  choice: بين الذين يهلكون
  rationale: يحافظ تكرار «بين» على التوازي مع تكرار ἐν، وينقل المضارع العملية الجارية من غير تحديد كيفية الهلاك.
theological_decisions:
- issue: الدلالة الجارية في σῳζομένοις وἀπολλυμένοις
  choice: «الذين يخلُصون» و«الذين يهلكون» بصيغة المضارع
  alternative: «المخلَّصين» و«الهالكين» أو «الذين خَلَصوا» و«الذين هلكوا»
  rationale: اسما الفاعل المضارعان في اليونانية يعرضان الخلاص والهلاك بوصفهما جاريين، فحُفظ هذا التوتر بدل تحويلهما إلى صفتين ثابتتين أو فعلين مكتملين.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. حُفظ التوازي بتكرار «بين»، وتُركت استعارة الرائحة بلا إضافة «زكية» لأن الوصف غير صريح في الأصل.
