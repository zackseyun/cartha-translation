  text: Ἐλθὼν δὲ εἰς τὴν Τρῳάδα εἰς τὸ εὐαγγέλιον τοῦ Χριστοῦ καὶ θύρας μοι ἀνεῳγμένης ἐν κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/012.yaml
  text: When I came to Troas for the gospel of Messiah[a], and a door had been opened for me in the Lord[b],
translation:
  language: ar
  text: ولما جئتُ إلى ترواس لأجل إنجيل المسيح[a]، وكان قد فُتح لي بابٌ في الرب[b]،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إنجيل المسيّا».'
    reason: بديل لفظي يبرز أن Χριστός لقب بمعنى «الممسوح».
  - marker: b
    text: 'أو: «وكان بابٌ مفتوحٌ لي في الرب».'
    reason: بديل يحافظ بصورة أوضح على الحالة الناتجة التي تفيدها صيغة التام.
lexical_decisions:
- source_word: Ἐλθὼν δὲ
  choice: ولكن حين جئتُ
  rationale: اسم الفاعل الأ aorist يؤدي معنى زمنيًا، فصيغ بـ«حين جئت». أمّا δέ فتصل بما قبلها مع ملمح انتقالي أو تقابلي يظهر في سياق الكلام، لذلك نُقلت بـ«ولكن» دون مبالغة في حدة الاستدراك.
- source_word: εἰς τὴν Τρῳάδα
  choice: إلى ترواس
  rationale: ترجمة اتجاهية طبيعية لحرف الجر εἰς مع اسم المكان.
- source_word: εἰς τὸ εὐαγγέλιον τοῦ Χριστοῦ
  choice: من أجل إنجيل المسيح
  rationale: الإضافة الثانية ذات دلالة غائية، و«من أجل» تحفظ الغرض من غير إضافة فعل مثل «أبشّر». و«إنجيل» هو المقابل العربي الراسخ لـεὐαγγέλιον، بينما تُبقي الإضافة «المسيح» العلاقة المحتملة بين الإنجيل والمسيح دون حصرها في معنى «عن».
- source_word: θύρας
  choice: باب
  rationale: أُبقيت صورة الباب المجازية بدل تفسيرها مباشرة بأنها فرصة، حفاظًا على استعارة بولس.
- source_word: ἀνεῳγμένης
  choice: كان قد فُتح
  rationale: صيغة التام المبني للمجهول تشير إلى فعل سابق نتجت عنه حالة قائمة؛ وتؤدي «كان قد فُتح» هذا المعنى بوضوح.
- source_word: ἐν κυρίῳ
  choice: في الرب
  rationale: تُحفظ العبارة البولسية كما هي دون حسم ما إذا كانت ἐν أداتية بمعنى «بواسطة الرب» أو علائقية بمعنى «في الرب».
theological_decisions:
- issue: 'دلالة Χριστοῦ: لقب أم اسم مستقر'
  choice: المسيح
  alternative: المسيّا
  rationale: «المسيح» في العربية ترجمة لقبية راسخة لـΧριστός وتحفظ معنى الممسوح، ولا تفرض أن اللفظ صار اسمًا علمًا محضًا.
- issue: علاقة إنجيل المسيح بالمسيح
  choice: إنجيل المسيح
  alternative: الإنجيل عن المسيح
  rationale: الإضافة اليونانية قد تفيد التعلق أو المصدر أو المضمون؛ لذلك حُفظ تركيب الإضافة ولم يُحصر في معنى «عن».
- issue: دلالة ἐν κυρίῳ
  choice: في الرب
  alternative: من الرب
  rationale: الترجمة الحرفية تحفظ احتمال المجال أو العلاقة، بدل حسم العبارة على أنها فاعلية إلهية مباشرة.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ووقورة. أبقيت الجملة منتهية بفاصلة لأنها جزء من تركيب يمتد إلى العدد التالي، كما في النص اليوناني. استُخدم «ولكن» لنقل δέ في ضوء الانتقال المتصل بالسياق السابق، لا بوصفه أداة تعارض حاد.
