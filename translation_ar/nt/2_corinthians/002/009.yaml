  text: εἰς τοῦτο γὰρ καὶ ἔγραψα ἵνα γνῶ τὴν δοκιμὴν ὑμῶν, εἰ εἰς πάντα ὑπήκοοί ἐστε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/009.yaml
  text: 'For this is why I also wrote: so that I might know the proof of you[a], whether you are obedient in everything.'
translation:
  language: ar
  text: فلهذا أيضًا كتبتُ، لكي أعرف حقيقة أمركم[a]، إن كنتم مطيعين في كل شيء.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «اختباركم»، أو «البرهان على أصالتكم/صفتكم المثبتة». فاللفظ اليوناني δοκιμή قد يدل على الاختبار، أو على ما يَظهر ويثبت به من الشخص.'
    reason: يعكس المجال الدلالي للفظ δοκιμή من غير حسمٍ لمعنى إيجابي أو تحويله إلى ظرفٍ مضاف في المتن.
lexical_decisions:
- source_word: εἰς τοῦτο γὰρ καὶ
  choice: فلهذا أيضًا
  rationale: ينقل الغرض أو السبب الذي يشير إليه التعبير، ويحفظ القوة الإضافية لـ καὶ، بصياغة عربية طبيعية؛ وتؤدي الفاء وظيفة γὰρ في ربط الكلام بما قبله.
- source_word: ἔγραψα
  choice: كتبتُ
  rationale: الماضي البسيط هو المقابل العربي الطبيعي لصيغة الماضي اليونانية هنا.
- source_word: ἵνα γνῶ
  choice: لكي أعرف
  rationale: يحفظ جملة الغرض ومعنى الوصول إلى المعرفة من غير تحويلها إلى مجرد «اختبار».
- source_word: τὴν δοκιμὴν ὑμῶν
  choice: حقيقةَ حالكم عند الاختبار[a]
  rationale: δοκιμή قد تدل على الاختبار أو على ما يكشفه الاختبار من صفة مثبتة. هذه الصياغة العربية واضحة وتحافظ على المجال الدلالي دون أن تفترض سلفًا أن النتيجة إيجابية.
- source_word: εἰ εἰς πάντα ὑπήκοοί ἐστε
  choice: هل أنتم مطيعون في كل شيء؟
  rationale: تنقل εἰ بوصفها أداة سؤال غير مباشر متعلق بما يريد بولس معرفته، وتحفظ شمول εἰς πάντα بعبارة عربية مباشرة.
theological_decisions:
- issue: هل تدل δοκιμή على عملية الاختبار أم على الصفة التي ثبتت به؟
  choice: حقيقة حالكم عند الاختبار
  alternative: جدارتكم المثبتة؛ أو اختباركم
  rationale: اختيرت عبارة لا تحسم مسبقًا نجاح المخاطَبين ولا تجعل اللفظ مجرد عملية امتحان، بل تترك السؤال التالي—هل هم مطيعون في كل شيء—يكشف المقصود في السياق.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت النقطتان قبل السؤال لتوضيح أن الطاعة في كل شيء هي مضمون ما أراد بولس معرفته، مع إبقاء التوتر الدلالي في δοκιμή ظاهرًا في الحاشية.
