translation:
  language: ar
  text: بل على العكس، ينبغي لكم بالأحرى أن تسامحوه[a] وتعزّوه، لئلّا يبتلعه الحزن المفرط[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «تنعموا عليه بالصفح»؛ فالفعل متصل بمعنى النعمة وإبداء الإحسان.
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «لئلّا يُبتلع»؛ أي لئلّا يستولي عليه الحزن الزائد تمامًا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοὐναντίον
  choice: بل على العكس
  rationale: ينقل بوضوح التحول إلى مسار مضاد لما سبق، بصياغة عربية طبيعية.
- source_word: μᾶλλον
  choice: بالأحرى
  rationale: يحفظ القوة التفضيلية للكلمة إلى جانب عبارة التقابل من غير مبالغة.
- source_word: χαρίσασθαι
  choice: تسامحوه
  rationale: يدل السياق التأديبي على الصفح والعفو، و«تسامحوه» تعبير واضح مع إبقاء صلة الفعل بالنعمة في الحاشية.
- source_word: παρακαλέσαι
  choice: تعزّوه
  rationale: يناسب سياق رفع الحزن وردّ الشخص، مع بقاء معنى التشجيع ممكنًا بحسب السياق.
- source_word: καταποθῇ
  choice: يبتلع
  rationale: يحفظ صورة النص اليوناني الحية بدل إذابتها في تعبير تفسيري مثل «يغلبه».
- source_word: ὁ τοιοῦτος
  choice: مثل هذا الشخص
  rationale: يحفظ الإشارة العامة في اليونانية من غير تعيين زائد لجنس الشخص أو هويته.
- source_word: περισσοτέρᾳ λύπῃ
  choice: فرطُ الحزن
  rationale: صياغة عربية موجزة وطبيعية تفيد الحزن الزائد أو المفرط.
