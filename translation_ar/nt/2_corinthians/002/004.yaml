  text: ἐκ γὰρ πολλῆς θλίψεως καὶ συνοχῆς καρδίας ἔγραψα ὑμῖν διὰ πολλῶν δακρύων, οὐχ ἵνα λυπηθῆτε, ἀλλὰ τὴν ἀγάπην ἵνα γνῶτε ἣν ἔχω περισσοτέρως εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/004.yaml
  text: For out of much affliction and anguish of heart I wrote to you through many tears[a], not so that you might be grieved[b], but so that you might know the love that I have especially for you.
translation:
  language: ar
  text: فلقد كتبتُ إليكم من ضيق شديد وكرب في القلب، وبدموع كثيرة[a]، لا لكي تحزنوا، بل لكي تعرفوا المحبة التي أكنّها لكم بوفرة أكبر[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وسط دموع كثيرة» أو «من خلال دموع كثيرة».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «المحبة التي أكنّها لكم على نحو أوفر». ولا يذكر النص صراحةً حدَّ المقارنة؛ وقد تُفهم العبارة في السياق أيضًا على أنها تؤكد محبته الخاصة لهم.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ πολλῆς θλίψεως
  choice: من ضيق شديد
  rationale: تحافظ «من» على دلالة المصدر أو المنطلق، وتنقل «ضيق شديد» معنى الضغط والمعاناة من غير حصره في اضطهاد خارجي.
- source_word: συνοχῆς καρδίας
  choice: كرب في القلب
  rationale: تعبير عربي طبيعي ينقل معنى الانقباض والضيق النفسي الداخلي الذي تفيده العبارة اليونانية.
- source_word: ἔγραψα ὑμῖν
  choice: كتبتُ إليكم
  rationale: ينقل الماضي البسيط من غير أن يضيف صراحةً أن المقصود رسالة سابقة، وإن كان السياق قد يدل على ذلك.
- source_word: διὰ πολλῶν δακρύων
  choice: وبدموع كثيرة
  rationale: صياغة عربية واضحة تصوّر الكتابة المصحوبة بدموع غزيرة، مع إثبات البديل الأقرب إلى صورة «من خلال» في الحاشية.
- source_word: λυπηθῆτε
  choice: تحزنوا
  rationale: ينقل الغرض المنفي ومعنى وقوع الحزن عليهم بلغة عربية مألوفة؛ ولا تستلزم العربية هنا بناءً للمجهول.
- source_word: ἀγάπην
  choice: المحبة
  rationale: المقابل العربي المباشر والمستقر لـἀγάπη.
- source_word: γνῶτε
  choice: تعرفوا
  rationale: يحافظ على جملة الغرض، ويترك للسياق احتمال المعرفة أو الإدراك الأعمق.
- source_word: περισσοτέρως εἰς ὑμᾶς
  choice: التي أكنّها لكم بفيض عظيم
  rationale: تنقل وفرة المحبة واتجاهها نحو المخاطبين بصياغة عربية طبيعية، مع إبقاء القوة المقارِنة المحتملة في الحاشية.
theological_decisions:
- issue: القوة المقارِنة في περισσοτέρως
  choice: بفيض عظيم
  alternative: بفيض أعظم نحوكم / على نحو خاص لكم
  rationale: لا يصرّح النص بحدّ المقارنة، لذلك تجنبت الترجمة تحديد مَن يُقارَن بهم أهل كورنثوس، مع الإشارة إلى الاحتمال المقارن أو معنى الخصوص في الحاشية.
translation_notes:
  register: فصحى معاصرة واضحة ذات نبرة وقورة. اختير «كرب في القلب» بدل تركيب حرفي ثقيل، وحُفظ التوازي بين الضيق الداخلي والدموع، كما حُفظ غرض بولس المنفي والمثبت من غير حسم المقارنة الضمنية في περισσοτέρως.
