revisions:
- from: ومَن تسامحونَه في شيء، فأنا أيضًا أتسامح معه. فما تسامحتُ فيه—إن كنتُ قد تسامحتُ في شيء—فمن أجلكم، في حضرة المسيح[a].
  to: ومَن تعفون عنه في شيء، فأنا أيضًا أعفو عنه. فما عفوتُ عنه—إن كنتُ قد عفوتُ عن شيء—فمن أجلكم أمام المسيح[a].
  rationale: استُبدل «تسامح» بـ«عفا عن» لإيصال معنى الغفران أو الصفح في سياق المصالحة التأديبية بوضوح ومن غير إيحاء بالمعاملة المتبادلة. واستُبدلت «في حضرة» بـ«أمام» لأنها الصياغة الأفصح والأكثر مباشرة لمعنى العمل في حضور المسيح، مع إبقاء البديل المتعلق بـ«الشخص» في الحاشية. وحوفظ على تنكير «شيء» وعلى الاعتراض الشرطي وتكرار الفعل.
