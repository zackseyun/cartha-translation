  text: ᾧ δέ τι χαρίζεσθε, κἀγώ· καὶ γὰρ ἐγὼ ⸂ὃ κεχάρισμαι, εἴ τι⸃ κεχάρισμαι, δι’ ὑμᾶς ἐν προσώπῳ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/010.yaml
  text: To anyone whom you forgive anything[a], I do too. For what I have forgiven—if I have forgiven anything—I have forgiven for your sake in the presence of Messiah,
translation:
  language: ar
  text: ومَن تعفون عنه في شيء، فأنا أيضًا أعفو عنه. فما عفوتُ عنه—إن كنتُ قد عفوتُ عن شيء—فمن أجلكم أمام المسيح[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بشخص المسيح».'
    reason: lexical_alternative
lexical_decisions:
- source_word: χαρίζεσθε / κεχάρισμαι
  choice: تسامحونَه / تسامحتُ
  rationale: الفعل يدل في سياق التأديب وردّ المخطئ إلى الجماعة على الصفح عن الإساءة. واختيار «تسامح» طبيعي في العربية ويحافظ على تكرار الفعل اليوناني، من غير أن يوحي بأن المقصود مجرد منح عطية.
- source_word: ᾧ ... τι
  choice: مَن ... في شيء
  rationale: ينقل تركيب اسم الموصول في حالة المفعول غير المباشر مع ضمير التنكير، ويحافظ على انفتاح العبارة من غير تعيين شخص أو ذنب بعينه.
- source_word: κἀγώ
  choice: فأنا أيضًا أتسامح معه
  rationale: يُظهر الإيجاز والاستجابة في «وأنا أيضًا»، مع إكمال الفعل والضمير في العربية لتستقيم العبارة بوضوح.
- source_word: ὃ κεχάρισμαι, εἴ τι κεχάρισμαι
  choice: فما تسامحتُ فيه—إن كنتُ قد تسامحتُ في شيء—
  rationale: يحفظ الصياغة الشرطية الاعتراضية ونبرة بولس المتحفّظة، من غير تسويتها إلى تقرير جازم.
- source_word: δι’ ὑμᾶς
  choice: فمن أجلكم
  rationale: ينقل معنى الغاية أو المنفعة المقصودة للكورنثيين في هذا السياق الرعوي.
- source_word: ἐν προσώπῳ Χριστοῦ
  choice: في حضرة المسيح
  rationale: «حضرة» تعبّر طبيعيًا عن معنى الوجود أمام وجه المسيح وتحت نظره، مع إبقاء احتمال دلالة «بشخص المسيح» في الحاشية.
- source_word: Χριστοῦ
  choice: المسيح
  rationale: اللفظ العربي «المسيح» يحفظ Χριστός بوصفه لقبًا مسيانيًا، وهو أيضًا التعبير الكتابي العربي المألوف.
theological_decisions:
- issue: 'دلالة ἐν προσώπῳ Χριστοῦ: الحضور أم الشخص/النيابة'
  choice: في حضرة المسيح
  alternative: بشخص المسيح
  rationale: تحتمل πρόσωπον الوجه والحضور والشخص. يلائم «في حضرة المسيح» معنى العمل أمامه وتحت نظره، لكن احتمال العمل بصفته أو نيابةً عنه حقيقي، لذلك لم يُطمس وأُثبت في الحاشية.
- issue: هل يُنقل Χριστός بوصفه لقبًا أم اسمًا عَلَميًا ذا صيغة تقليدية
  choice: المسيح
  alternative: كريستوس/المسيح بوصفه اسمًا فقط
  rationale: في العربية «المسيح» ترجمة واضحة ومستقرة للقب Χριστός، ولا يقتضي السياق تجريده من قوته اللقبية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حوفظ على تكرار فعل الصفح وعلى الاعتراض الشرطي، واستُعملت الشرطة الطويلة لإبرازه. أُدرجت علامة الحاشية [a] بعد العبارة التي تتعلق بها مباشرة.
