base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/017.yaml
  text: For we are not like the many[a], peddling the word of God, but as from sincerity, but as from God[f][e][d][c][b], before God we speak in Messiah.
translation:
  language: ar
  text: فلسنا كالكثيرين[a] الذين يتّجرون بكلمة الله[b]، بل نتكلم أمام الله، في المسيح، بدافع الإخلاص[c] وبوصفنا من الله.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مثل أولئك الكثيرين». ولا يلزم أن تعني العبارة «أكثر الناس».'
    reason: lexical_alternative
  - marker: b
    text: قد يحمل الفعل أيضًا معنى الاتجار طلبًا للربح، أو غشّ البضاعة وتزييفها عند بيعها.
    reason: lexical_alternative
  - marker: c
    text: 'حرفيًا: «من إخلاص»؛ أي إن كلامنا يصدر عن إخلاص.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πολλοί
  choice: الكثيرين
  rationale: يحفظ التعبير جماعةً غير محددة يقابلها بولس بنفسه ورفقاؤه، من غير تحويله إلى حكم إحصائي مثل «أكثر الناس».
- source_word: καπηλεύοντες
  choice: يتاجرون
  rationale: ينقل الصورة التجارية والنقد الأخلاقي في الفعل اليوناني، مع إيضاح احتمال الاتجار طلبًا للربح أو الغش في الحاشية.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: بكلمة الله
  rationale: ترجمة مباشرة ومألوفة للتركيب الإضافي، وتحفظ جلال العبارة البولسية.
- source_word: ἐξ εἰλικρινείας
  choice: عن إخلاص
  rationale: تفيد أن الكلام يصدر عن الإخلاص وتحافظ قدر الإمكان على دلالة المصدر في ἐξ، بصياغة عربية طبيعية.
- source_word: ἐκ θεοῦ
  choice: ومن الله
  rationale: تحفظ دلالة المصدر أو المنشأ من غير إضافة معنى الإرسال غير المصرح به.
- source_word: κατέναντι θεοῦ
  choice: أمام الله
  rationale: صياغة موجزة تدل على الحضور والمساءلة في نظر الله.
- source_word: ἐν Χριστῷ
  choice: في المسيح
  rationale: «المسيح» في العربية ترجمة لقب Χριστός لا مجرد نقله صوتيًا، كما أن العبارة البولسية الاصطلاحية «في المسيح» طبيعية ودقيقة.
- source_word: λαλοῦμεν
  choice: نتكلم
  rationale: ينقل الفعل العام وصيغته الحاضرة من غير تقويته تفسيريًا إلى «نبشر» أو «نعلن».
theological_decisions:
- issue: دلالة ἐν Χριστῷ
  choice: في المسيح
  alternative: بالمسيح / في نطاق الاتحاد بالمسيح
  rationale: أُبقي التركيب الموجز كما هو، لأنه قد يدل على المجال أو العلاقة أو الأساس، ولا ينبغي حصره في تفسير لاهوتي واحد.
- issue: العلاقة بين ἐξ εἰλικρινείας وἐκ θεοῦ
  choice: عن إخلاص ومن الله
  alternative: كصادرين عن إخلاص وكصادرين من الله
  rationale: تحفظ الصياغة مصدر الكلام المزدوج، أي الإخلاص والله، مع تجنب ثقل تكرار «كأننا» الذي قد يوحي بعدم الحقيقة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. قُدِّم «نتكلم في المسيح أمام الله» لتجنب توالي شبه الجمل على نحو ملتبس، مع إبقاء المصدرين «عن إخلاص ومن الله» متعلقين بالكلام. جميع علامات الحواشي الواردة مثبتة في المتن.
