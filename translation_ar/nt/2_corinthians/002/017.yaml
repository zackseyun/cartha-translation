- from: لأننا لسنا مثل الكثيرين[a] الذين يتاجرون بكلمة الله[b]، بل نتكلم في المسيح أمام الله، عن إخلاص[c] ومن الله.
  to: فلسنا كالكثيرين[a] الذين يتّجرون بكلمة الله[b]، بل نتكلم أمام الله، في المسيح، بدافع الإخلاص[c] وبوصفنا من الله.
  rationale: استُبدل «عن إخلاص» بـ«بدافع الإخلاص» لتفادي معنى الموضوع الذي توحي به «عن»، ولإيصال دلالة المصدر/الدافع في ἐξ. واستُبدل «ومن الله» بـ«وبوصفنا من الله» ليُفهم في العربية على أنه وصف لمصدر الرسالة والمتكلمين، مع الحفاظ على قوة المقارنة في ὡς من دون صياغة عربية متكلفة. كما أُعيد ترتيب أشباه الجمل بما يوافق بنية النص اليوناني ويظل طبيعيًا.
