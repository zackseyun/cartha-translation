id: 2CO.2.16
reference: 2 Corinthians 2:16
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: οἷς μὲν ὀσμὴ ⸀ἐκ θανάτου εἰς θάνατον, οἷς δὲ ὀσμὴ ⸁ἐκ ζωῆς εἰς ζωήν. καὶ πρὸς ταῦτα τίς ἱκανός;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/016.yaml
  text: To the one[a], a fragrance from death to death; to the other, a fragrance from life to life[c][b]. And who is sufficient for these things?
translation:
  language: ar
  text: فَلِهَؤُلَاءِ رَائِحَةٌ[a] مِنْ مَوْتٍ إِلَى مَوْتٍ، وَلِأُولَئِكَ رَائِحَةٌ مِنْ حَيَاةٍ إِلَى حَيَاةٍ[b]. وَمَنْ هُوَ كُفْءٌ[c] لِهَذِهِ الأُمُورِ؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمة الكلمة: «عَرْف»؛ والكلمة اليونانية نفسها مستعملة في الموضعين.'
    reason: lexical_alternative
  - marker: b
    text: 'قد تدل عبارتا «مِنْ مَوْتٍ إِلَى مَوْتٍ» و«مِنْ حَيَاةٍ إِلَى حَيَاةٍ» على المصدر والنتيجة، أي: «ناشئة من الموت ومؤدية إلى الموت» و«ناشئة من الحياة ومؤدية إلى الحياة»، أو قد تكونان وصفًا مكثفًا.'
    reason: alternative_reading
  - marker: c
    text: 'أو: «أهلٌ» أو «قادرٌ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀσμή
  choice: رائحة
  rationale: 'تحافظ «رائحة» على الصورة الحسية، وهي محايدة بما يكفي لتلائم جانبي المقابلة: الموت والحياة، من غير أن تضيف إيحاءً إيجابيًا أو سلبيًا غير لازم.'
- source_word: ἐκ θανάτου εἰς θάνατον
  choice: مِنْ مَوْتٍ إِلَى مَوْتٍ
  rationale: تنقل الصياغة اليونانية المكثفة وتحافظ على التوازي البلاغي وعلى احتمال دلالتها على المصدر والنتيجة أو على التوكيد.
- source_word: ἐκ ζωῆς εἰς ζωήν
  choice: مِنْ حَيَاةٍ إِلَى حَيَاةٍ
  rationale: تحفظ التناظر المقصود مع «مِنْ مَوْتٍ إِلَى مَوْتٍ» ولا تحصر العبارة في تفسير واحد.
- source_word: πρὸς ταῦτα
  choice: لِهَذِهِ الأُمُورِ
  rationale: تعكس اسم الإشارة اليوناني بصيغة الجمع، وتعبّر طبيعيًا عن الكفاءة المطلوبة إزاء الأمور المذكورة.
- source_word: ἱκανός
  choice: كُفْء
  rationale: تؤدي معنى القدرة والأهلية للاضطلاع بالمهمة، وتناسب السؤال البلاغي في عربية فصيحة واضحة.
theological_decisions:
- issue: الدلالة التفسيرية لعبارتي «مِنْ مَوْتٍ إِلَى مَوْتٍ» و«مِنْ حَيَاةٍ إِلَى حَيَاةٍ»
  choice: الإبقاء على الصياغة المتوازية المكثفة من غير حسم دلالتها
  alternative: «ناشئة من الموت ومؤدية إلى الموت / ناشئة من الحياة ومؤدية إلى الحياة»، أو اعتبار العبارتين وصفًا مكثفًا للموت والحياة
  rationale: النص اليوناني يحتمل معنى المصدر والنتيجة كما يحتمل التوصيف المكثف؛ لذلك تحافظ الترجمة على الغموض الحقيقي والتوتر التفسيري بدل أن تحسمهما.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة وقورة. حوفظ على التوازي بين شطري الآية، وعلى حياد «رائحة» لئلا تُفرض قيمة إيجابية على الصورة في شطر الموت، وعلى صيغة الجمع في «هذه الأمور».
