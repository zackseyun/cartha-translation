  register: عربية فصحى حديثة واضحة وذات نبرة كريمة. استُخدمت «لئلّا» لربط الآية بسياقها السابق، و«يستغلّنا» لتجنب تضييق πλεονεκτέω إلى مجرد التفوق الذهني. وُضعت علامتا الحاشيتين مباشرة بعد اللفظ الذي تشرحانه.
