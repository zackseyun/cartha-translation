lexical_decisions:
- source_word: ἵνα μὴ
  choice: لِئَلَّا
  rationale: تفيد الغاية الوقائية في السياق، وتوصل معنى «لكي لا» بصياغة عربية فصيحة موجزة.
- source_word: πλεονεκτηθῶμεν
  choice: يستغلَّنا
  rationale: الفعل المبني للمجهول يدل على أن يُستغل المرء أو يُتجاوز عليه طمعًا؛ وصياغته بالعربية مبنيًا للمعلوم مع الشيطان فاعلًا طبيعية وتحافظ على المعنى، من غير حصره في الخداع الذهني.
- source_word: Σατανᾶ
  choice: الشيطان
  rationale: الاسم المتعارف عليه في العربية الكتابية والفصحى لهذا الاسم الشخصي.
- source_word: γὰρ
  choice: فـ
  rationale: تربط الجملة بما قبلها تعليلًا وتفسيرًا بأسلوب عربي طبيعي.
- source_word: νοήματα
  choice: مخطَّطاته
  rationale: قد تدل الكلمة على الأفكار أو المقاصد، لكنها في هذا السياق تحمل دلالة تدبير عدائي محسوب؛ و«مخططاته» توصل هذه الدلالة دون الإفراط في التفسير.
- source_word: ἀγνοοῦμεν
  choice: لا نجهل
  rationale: يحافظ على صيغة نفي الجهل في اليونانية وعلى توكيد معرفة بولس ورفقائه بتدابير الشيطان.
theological_decisions: []
