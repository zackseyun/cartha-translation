  text: Τῷ δὲ θεῷ χάρις τῷ πάντοτε θριαμβεύοντι ἡμᾶς ἐν τῷ Χριστῷ καὶ τὴν ὀσμὴν τῆς γνώσεως αὐτοῦ φανεροῦντι δι’ ἡμῶν ἐν παντὶ τόπῳ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/014.yaml
  text: But thanks be to God[b][a], who always leads us in triumphal procession in the Messiah and makes the fragrance of the knowledge of him known through us in every place.
translation:
  language: ar
  text: ولكن شكرًا لله، الذي يقودنا دائمًا في موكب الظفر في المسيح،[a] ويُظهر بواسطتنا في كل مكان عبير[b] معرفته.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الذي ينتصر علينا دائمًا في المسيح».'
    reason: alternative_reading
  - marker: b
    text: 'أو: «رائحة» بدلًا من «عبير».'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: شكرًا لله
  rationale: التركيب «Τῷ ... θεῷ χάρις» صيغة شكر وتمجيد، و«شكرًا لله» هو التعبير العربي الطبيعي الذي يحفظ هذه القوة.
- source_word: θριαμβεύοντι
  choice: يقودنا ... في موكب نصر
  rationale: يحفظ التعبير صورة موكب النصر التي يستحضرها الفعل، مع إبقاء «نا» مفعولًا به؛ أما احتمال معنى الظفر بنا فمحفوظ في الحاشية.
- source_word: ἐν τῷ Χριστῷ
  choice: في المسيح
  rationale: ينقل «المسيح» بوصفه اللقب المعروف، وتحفظ «في» دلالة المجال أو الاتحاد من غير حسم زائد.
- source_word: ὀσμὴν
  choice: عبير
  rationale: يناسب الاستعارة العطرية الإيجابية في هذه الآية، مع إثبات البديل الأعم «رائحة» في الحاشية، وهو مهم أيضًا في ضوء امتداد الصورة في السياق التالي.
- source_word: γνώσεως
  choice: معرفة
  rationale: هو المقابل العربي المباشر والواضح، ويشير إلى المعرفة التي ينشرها الله بواسطة الخدمة الرسولية.
- source_word: φανεροῦντι
  choice: يُظهر
  rationale: ينقل معنى جعل الشيء ظاهرًا أو معلومًا، ويلائم صورة انتشار العبير.
- source_word: δι’ ἡμῶν
  choice: بواسطتنا
  rationale: يعبر بوضوح عن الوساطة أو الأداة التي تدل عليها διά مع المضاف إليه.
- source_word: ἐν παντὶ τόπῳ
  choice: في كل مكان
  rationale: ترجمة قريبة من اليونانية وطبيعية في العربية، وتحفظ التشديد على اتساع الانتشار.
theological_decisions:
- issue: دلالة θριαμβεύω مع ἡμᾶς مفعولًا به
  choice: الله يقود الجماعة الرسولية في موكب نصر في المسيح
  alternative: الله يظفر بنا في المسيح
  rationale: تحفظ الصياغة الأساسية صورة موكب النصر وتنسجم مع استعارة العبير التالية، لكن الفعل قد يصور الأشخاص أسرى ظفر بهم المنتصر؛ لذلك أُبقي هذا التوتر في الحاشية بدل حسمه ضمنًا.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. استُعمل «موكب نصر» لإبقاء الصورة التاريخية المحسوسة، و«بواسطتنا» لتفادي التباس الفاعل بالوسيلة. وُضعت علامتا الحاشيتين عند اللفظين اللذين تتعلقان بهما مباشرة.
