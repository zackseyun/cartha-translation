revisions:
- from: وكتبتُ هذا بعينه لكيلا آتي فألقى حزنًا من الذين كان ينبغي أن أفرح بهم، واثقًا بكم جميعًا أن فرحي هو فرحكم جميعًا.[a]
  to: وكتبتُ هذا بعينه لكيلا ألقى، حين آتي، حزنًا من الذين كان ينبغي أن أفرح بهم، واثقًا بكم جميعًا أن فرحي هو فرحكم جميعًا.
  rationale: يصحح التعديل علاقة «حين آتي» بالفعل «ألقى حزنًا» بما يطابق وظيفة ἐλθών في السياق، من غير تغيير معنى باقي الآية. وحُذفت الحاشية لأنها لا تسجل فرقًا ذا قيمة ترجميّة أو تفسيرية.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:24:58Z'
review_pass:
  verdict: revise
  source_fidelity: يلزم تعديل موضع «حين آتي». فالصياغة «لكيلا آتي فألقى حزنًا» قد تُفهم بأن غرض الكتابة هو ألّا يأتي بولس أصلًا، بينما تفيد المشاركة اليونانية ἐλθών أن تجنّب الحزن هو الغرض عند مجيئه. وتحافظ «لكيلا ألقى، حين آتي، حزنًا» على هذا الارتباط الزمني والغرضي. أما «من الذين كان ينبغي أن أفرح بهم» و«فرحي هو فرحكم جميعًا» فموافقتان للمعنى مع إبقاء قدر مناسب من انفتاح الأصل.
  naturalness: النص فصيح وواضح عمومًا. إعادة ترتيب ظرف المجيء تجعل الجملة العربية أدق وأسلس دلالةً. كما أن حذف الحاشية المقترحة مناسب، لأنها لا تقدم بديلًا ذا فرق دلالي وإنما تعيد ترتيب الضمير والكلية فقط.
  terminology: «حزن»، «أفرح»، و«واثقًا» ألفاظ حديثة فصيحة وملائمة لسجل الرسالة. و«هذا بعينه» ينقل التوكيد في τοῦτο αὐτό. تُحفظ عبارة «واثقًا بكم جميعًا أن...» بوصفها تركيبًا مفهومًا يقارب تتابع الثقة ومضمونها في الأصل، من غير فرض سببية.
  issues:
  - severity: medium
    issue: موضع عبارة «لكيلا آتي فألقى حزنًا»
    rationale: قد يجعل التركيب العربي عدمَ المجيء نفسه غرضًا للكتابة. في اليونانية، «إذ/حين أجيء» تصف ظرف وقوع الحزن الذي يريد بولس تجنبه، لا فعلًا يريد الامتناع عنه.
  - severity: low
    issue: الحاشية [a] لا تضيف بديلًا ترجميًا مؤثرًا
    rationale: البديل المقترح يختلف في ترتيب «جميعكم» والضمير فحسب، ولا يشرح غموضًا أو خيارًا نصيًا أو فرقًا دلاليًا يحتاج إليه القارئ؛ لذا يحسن حذفها وحذف مرساها.
  revised_text: وكتبتُ هذا بعينه لكيلا ألقى، حين آتي، حزنًا من الذين كان ينبغي أن أفرح بهم، واثقًا بكم جميعًا أن فرحي هو فرحكم جميعًا.
