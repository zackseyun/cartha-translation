  text: καὶ ⸀ἔγραψα τοῦτο αὐτὸ ἵνα μὴ ἐλθὼν λύπην ⸀σχῶ ἀφ’ ὧν ἔδει με χαίρειν, πεποιθὼς ἐπὶ πάντας ὑμᾶς ὅτι ἡ ἐμὴ χαρὰ πάντων ὑμῶν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/003.yaml
  text: And I wrote this very thing so that, when I came, I might not have grief from those who ought to make me rejoice, because I was confident about all of you that my joy is the joy of you all.
translation:
  language: ar
  text: وكتبتُ هذا بعينه لكيلا ألقى، حين آتي، حزنًا من الذين كان ينبغي أن أفرح بهم، واثقًا بكم جميعًا أن فرحي هو فرحكم جميعًا.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγραψα
  choice: كتبتُ
  rationale: صيغة الماضي اليونانية تشير في السياق إلى كتابة سابقة لبولس، والماضي العربي يؤديها بوضوح من غير افتراض أنها كتابة الرسالة الحاضرة.
- source_word: τοῦτο αὐτὸ
  choice: هذا بعينه
  rationale: يحفظ توكيد العبارة اليونانية بصياغة عربية فصيحة وطبيعية.
- source_word: ἵνα μὴ ἐλθὼν λύπην σχῶ
  choice: لكيلا آتي فألقى حزنًا
  rationale: تنقل غرض الكتابة، مع إبقاء مجيء بولس سابقًا في المعنى لاختباره الحزن؛ و«ألقى حزنًا» عربية واضحة تعبّر عن وقوع الحزن عليه.
- source_word: ἀφ’ ὧν ἔδει με χαίρειν
  choice: من الذين كان ينبغي أن أفرح بهم
  rationale: تحافظ على تركيب المصدر أو المنشأ في ἀπό وعلى غموض العلاقة دون تحويله صراحة إلى معنى سببي مثل «يجعلونني أفرح».
- source_word: πεποιθὼς ἐπὶ πάντας ὑμᾶς
  choice: واثقًا بكم جميعًا
  rationale: يحفظ البناء الوصفي بالمشاركة اليونانية والثقة المستقرة، ولا يفرض عليها علاقة سببية صريحة.
- source_word: ἡ ἐμὴ χαρὰ πάντων ὑμῶν ἐστιν
  choice: أن فرحي هو فرحكم جميعًا
  rationale: يبقي البنية المتوازية القريبة من الأصل ويفيد اشتراك الجماعة كلها في فرح بولس، من غير حصر المعنى في الملكية وحدها.
theological_decisions:
- issue: طبيعة الصلة بين ثقة بولس وكتابته أو تجنبه الحزن
  choice: واثقًا بكم جميعًا
  alternative: لأني كنت واثقًا بكم جميعًا
  rationale: المشاركة πεποιθώς لا تعيّن وحدها علاقة سببية صريحة؛ فالصياغة المختارة تحفظ هذا الانفتاح النحوي.
- issue: معنى كون فرح بولس فرح الجميع
  choice: فرحي هو فرحكم جميعًا
  alternative: فرحي يشترك فيه جميعكم
  rationale: الصياغة الأقرب إلى الأصل تحفظ التوتر بين تطابق الفرح واشتراكهم فيه، ولا تفصل في طبيعة هذه العلاقة بما يتجاوز النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «هذا بعينه» لإبراز التوكيد، وحُفظت المشاركة في «واثقًا» بدل تحويلها إلى جملة سببية. وُضع مؤشر الحاشية [a] في المتن كما يلزم.
