  text: how will the ministry of the Spirit not be even more in glory?[a]
translation:
  language: ar
  text: فكيف لا تكون خدمةُ الروحِ بالأحرى في مجدٍ؟[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مقترنةً بالمجد»، أو بصياغة وصفية: «أكثر مجدًا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς οὐχὶ
  choice: فكيف لا
  rationale: يحفظ صيغة السؤال البلاغي الذي يتوقع جوابًا بالإيجاب، مع تعبير عربي طبيعي وواضح.
- source_word: μᾶλλον
  choice: بالأحرى
  rationale: ينقل قوة المقارنة التصاعدية مع خدمة الآية السابقة، من الأدنى إلى الأعظم.
- source_word: ἡ διακονία
  choice: خدمة
  rationale: لفظ عربي واضح يدل هنا على عملٍ أو تدبيرٍ موكول، ويحافظ على الصلة بالمقابلة السياقية بين الخدمتين.
- source_word: τοῦ πνεύματος
  choice: الروح
  rationale: يفهم السياق اللفظ على أنه الروح القدس، ولا سيما في ضوء المقابلة مع الحرف في 3:6، من غير إضافة كلمة «القدس» غير الواردة صراحة في هذه الآية.
- source_word: ἔσται
  choice: تكون
  rationale: صيغة المضارع العربية بعد الاستفهام تؤدي هنا معنى المستقبل اليوناني بصورة طبيعية.
- source_word: ἐν δόξῃ
  choice: في مجد
  rationale: يحافظ على حرف الجر والصياغة الاسمية في اليونانية وعلى التكرار الموضوعي للمجد في السياق، بدل تحويل العبارة مباشرة إلى صفة.
theological_decisions:
- issue: مرجع πνεύματος
  choice: الروح، أي الروح القدس بحسب السياق
  alternative: الروح بمعنى مجرد أو غير شخصي
  rationale: السياق القريب يقابل بين الحرف الذي يميت والروح الذي يحيي، مما يرجح الإشارة إلى الروح القدس، مع إبقاء نص الآية نفسه موجزًا كما في الأصل.
- issue: دلالة المضاف في διακονία τοῦ πνεύματος
  choice: خدمة مرتبطة بالروح أو من اختصاصه، مع إبقاء العلاقة مفتوحة
  alternative: الخدمة التي يؤديها الروح حصراً، أو الخدمة التي تمنح الروح حصراً
  rationale: الإضافة اليونانية تحتمل أكثر من تحديد دقيق للعلاقة؛ لذلك لا ينبغي حصرها في تفسير واحد داخل المتن.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُخدمت «بالأحرى» لإظهار الحجة من الأدنى إلى الأعظم، وأُبقيت «في مجد» رغم شيء من غرابتها النسبية حفاظًا على البنية اليونانية والتوازي السياقي، مع توضيح البدائل الطبيعية في الحاشية.
