  text: καὶ γὰρ οὐ δεδόξασται τὸ δεδοξασμένον ἐν τούτῳ τῷ μέρει ⸀εἵνεκεν τῆς ὑπερβαλλούσης δόξης·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/010.yaml
  text: For indeed[a], what had been glorified has not been glorified in this respect, because of the glory that surpasses it.
translation:
  language: ar
  text: فإن ما كان قد مُجِّد لم يُمجَّد، في هذا الصدد، بسبب المجد الذي يفوقه[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بسبب المجد الفائق».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: فإن
  rationale: تؤدي «فـ» معنى الربط والتعليل في γὰρ، وتمنح «إن» العبارة توكيدًا طبيعيًا يلائم قوة καί التعزيزية دون تكلف.
- source_word: οὐ δεδόξασται
  choice: لم يعد له مجد
  rationale: تنقل النفي المقارن بعبارة عربية واضحة، مع إبقاء الصلة اللفظية بحقل «المجد». والمقصود ليس إنكار المجد السابق مطلقًا، بل القول إنه يتضاءل في إطار هذه المقارنة.
- source_word: τὸ δεδοξασμένον
  choice: ما كان قد نال مجدًا
  rationale: تحافظ الصياغة على اسم الموصول المحايد وعلى دلالة اسم الفاعل التام المبني للمجهول، من غير إضافة اسم صريح غير موجود في اليونانية.
- source_word: ἐν τούτῳ τῷ μέρει
  choice: في هذا الصدد
  rationale: تعبير عربي معاصر يحدد وجه المقارنة، فلا يجعل نفي المجد نفيًا مطلقًا.
- source_word: εἵνεκεν
  choice: بسبب
  rationale: ينقل الدلالة السببية بوضوح وإيجاز.
- source_word: τῆς ὑπερβαλλούσης δόξης
  choice: المجد الذي يفوقه
  rationale: تجعل الصياغة القوة المقارِنة في ὑπερβαλλούσης ظاهرة، ويعود الضمير على ما نال مجدًا بحسب السياق، مع إثبات البديل الأقرب إلى البنية اليونانية في الحاشية.
- source_word: δόξα / δεδοξασμένον
  choice: نال مجدًا ... له مجد ... المجد
  rationale: تكرر جذر «مجد» للمحافظة على التلاعب اللفظي القائم على الجذر اليوناني δοξ-، مع تجنب صياغة عربية مبنية للمجهول شديدة الركاكة.
theological_decisions:
- issue: هل ينفي بولس عن الخدمة السابقة أي مجد نفيًا مطلقًا، أم ينفيه على سبيل المقارنة؟
  choice: 'نفي مقارن مقيد بعبارة «في هذا الصدد»: يبدو المجد السابق كأنه بلا مجد إزاء المجد الذي يفوقه.'
  alternative: نفي مطلق لوجود أي مجد حقيقي للخدمة السابقة.
  rationale: تقيد عبارة ἐν τούτῳ τῷ μέρει النفي بوجه المقارنة، كما أن السياق القريب يقر بأن الخدمة السابقة كانت ذات مجد، لكنه مجد حجبه المجد الأعظم.
translation_notes:
  register: العربية فصحى معاصرة واضحة وموقرة. اختيرت «نال مجدًا» بدل النقل الحرفي «مُجِّد» لتجنب الإيحاء بأن المقصود فعل تمجيد بشري، مع الحفاظ على تكرار جذر «مجد» وعلى المفارقة المقارِنة في الآية.
