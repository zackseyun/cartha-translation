  to: إذ يتبيّن أنكم رسالةٌ من المسيح[a]، قمنا بخدمتها، مكتوبةٌ لا بحبر، بل بروح الله الحي[b]، لا على ألواحٍ حجرية، بل على ألواحٍ هي قلوبٌ من لحم[c].
  rationale: 'التعديل أسلوبي ودلالي محدود: استُبدلت العبارة غير الطبيعية الخاصة بخدمة الرسالة بتعبير عربي مباشر، وأعيدت صياغة الصورة الختامية بما يوضح أن القلوب هي الألواح نفسها. لم يتغير المعنى، ولا حُلّ غموض الإضافة في Χριστοῦ خارج ما تسمح به الحاشية.'
