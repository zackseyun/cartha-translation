  terminology: «رسالة»، «المسيح»، «روح الله الحي»، و«ألواح حجرية» مناسبة. و«قلوب من لحم» أوضح في العربية المعاصرة من «قلوب لحمية»، مع احتفاظه بصدى حزقيال. لا يلزم إدخال «القدس» لأن النص لا يورده.
