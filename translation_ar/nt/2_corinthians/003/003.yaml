source:
  edition: SBLGNT
  text: φανερούμενοι ὅτι ἐστὲ ἐπιστολὴ Χριστοῦ διακονηθεῖσα ὑφ’ ἡμῶν, ἐγγεγραμμένη οὐ μέλανι ἀλλὰ πνεύματι θεοῦ ζῶντος, οὐκ ἐν πλαξὶν λιθίναις ἀλλ’ ἐν πλαξὶν καρδίαις σαρκίναις.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/003.yaml
  text: showing that you are a letter from the Messiah[a], ministered by us, written not with ink but with the Spirit of the living God[d][c][b], not on stone tablets but on tablets of hearts of flesh.
translation:
  language: ar
  text: إذ يتبيّن أنكم رسالةٌ من المسيح[a]، قمنا بخدمتها، مكتوبةٌ لا بحبر، بل بروح الله الحي[b]، لا على ألواحٍ حجرية، بل على ألواحٍ هي قلوبٌ من لحم[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «رسالة المسيح». يمكن أن تُفهم صيغة الإضافة اليونانية حرفيًا هكذا، أما المتن فيعبّر عن المعنى المرجح: رسالة مصدرها المسيح أو هو صاحبها.'
    reason: alternative_reading
  - marker: b
    text: المقصود على الأرجح روح الله؛ ولا يرد في اليونانية هنا لفظ «القدس».
    reason: theological_clarity
  - marker: c
    text: تستدعي عبارة «قلوب من لحم» صورة العهد الجديد في حزقيال 11:19 و36:26، في مقابل القلب الحجري.
    reason: cross_reference
lexical_decisions:
- source_word: φανερούμενοι
  choice: إذ يتبيّن
  rationale: يحفظ معنى الظهور والاتضاح في صيغة اسم الفاعل اليونانية، ويربط العبارة بسياقها ربطًا طبيعيًا.
- source_word: ἐπιστολὴ
  choice: رسالة
  rationale: المقابل العربي الحديث الطبيعي الذي يحفظ استعارة الرسالة.
- source_word: Χριστοῦ
  choice: من المسيح
  rationale: يفهم المضاف إليه هنا على الأرجح بوصفه دالًا على المصدر أو صاحب الرسالة، مع إبقاء البديل الحرفي في الحاشية.
- source_word: διακονηθεῖσα
  choice: خُدمت بواسطتنا
  rationale: الصيغة المبنية للمجهول مشتقة من فعل الخدمة؛ وهذه الصياغة تحفظ صورة خدمة الرسالة بواسطة بولس ورفقائه من غير اختزالها في مجرد التسليم.
- source_word: ἐγγεγραμμένη
  choice: مكتوبة
  rationale: مقابل واضح وطبيعي ينسجم مع التضاد بين الحبر والروح.
- source_word: μέλανι
  choice: بحبر
  rationale: المقابل المباشر في استعارة الكتابة.
- source_word: πνεύματι θεοῦ ζῶντος
  choice: بروح الله الحي
  rationale: السياق العهدي والتضاد مع الحبر يرجحان الإشارة إلى روح الله، مع حفظ العبارة اليونانية كاملة.
- source_word: πλαξὶν λιθίναις
  choice: ألواح حجرية
  rationale: صياغة عربية طبيعية تحفظ الإشارة إلى ألواح سيناء.
- source_word: πλαξὶν καρδίαις σαρκίναις
  choice: ألواح هي قلوب لحمية
  rationale: 'تُظهر علاقة البدل أو التفسير في اليونانية: الألواح هي القلوب، وتتجنب سلسلة إضافات عربية موهمة.'
theological_decisions:
- issue: دلالة Χριστοῦ
  choice: من المسيح
  alternative: رسالة المسيح؛ رسالة للمسيح
  rationale: 'المضاف إليه يحتمل أكثر من علاقة، لكن سياق استعارة الرسالة يرجح المصدر أو التأليف: الرسالة صادرة من المسيح، بينما خدمها الرسل. أُثبت البديل الحرفي في الحاشية حفظًا للغموض الحقيقي.'
- issue: مرجع πνεύματι
  choice: روح الله الحي
  alternative: روح من الله الحي؛ الروح بمعنى غير شخصي
  rationale: التضاد بين الحبر والروح، مع خلفية العهد الجديد، يرجح الإشارة إلى روح الله من غير إضافة لفظ «القدس» غير الموجود في النص.
- issue: صورة القلوب اللحمية
  choice: ألواح هي قلوب لحمية
  alternative: ألواح قلوب لحمية؛ ألواح لحمية للقلوب
  rationale: تحفظ الصياغة كون القلوب نفسها هي الألواح، كما تصون صدى صورة القلب اللحمي في حزقيال من غير تفسير زائد.
translation_notes:
  register: العربية فصحى حديثة واضحة ومهيبة. استُخدم «المسيح» بوصفه اللقب العربي الراسخ لـΧριστός. وحُفظ التوازي «لا... بل...، لا... بل...» والصور العهدية، مع صياغة تفسيرية مقتضبة في «ألواح هي قلوب» لتوضيح البنية اليونانية من غير تسطيح الاستعارة.
