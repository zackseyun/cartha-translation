  text: أنبدأ من جديد بتزكية أنفسنا؟ أم نحتاج، مثل بعض الناس، إلى رسائل توصية إليكم أو منكم؟
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀρχόμεθα πάλιν
  choice: أفنعود نبدأ
  rationale: ينقل معنى البدء المتكرر في السؤال البلاغي، ويعبّر عن πάλιν تعبيرًا عربيًا طبيعيًا دون إسقاط دلالة التكرار.
- source_word: ἑαυτοὺς συνιστάνειν
  choice: بتزكية أنفسنا
  rationale: الفعل هنا يدل على تقديم النفس بما يثبت الجدارة أو الاستحقاق؛ و«تزكية» تلائم السياق البلاغي، كما تربط طبيعيًا بعبارة رسائل التوصية.
- source_word: ἢ μὴ χρῄζομεν
  choice: أم لعلنا نحتاج
  rationale: «أم» تصل فرعي السؤال، و«لعلنا» تساعد على نقل طابع السؤال البلاغي الذي يتوقع جوابًا بالنفي من غير تحويله إلى تقرير صريح.
- source_word: ὥς τινες
  choice: مثل بعض الناس
  rationale: يحافظ على عدم تعيين الجماعة المشار إليها، بصياغة واضحة في العربية المعاصرة.
- source_word: συστατικῶν ἐπιστολῶν
  choice: رسائل توصية
  rationale: مصطلح عربي واضح لرسائل التعريف والتأييد التي تثبت أهلية حاملها، وهو الأنسب في هذا السياق.
- source_word: πρὸς ὑμᾶς ἢ ἐξ ὑμῶν
  choice: إليكم أو منكم
  rationale: يحفظ تقابل الاتجاه والمصدر في النص اليوناني بإيجاز ودقة.
