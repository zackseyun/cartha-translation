  rationale: حُذفت «لعلنا» لأنها تضيف دلالة احتمال غير موجودة، وصيغ صدر الآية بأسلوب عربي أكثر سلاسة مع الحفاظ على الاستفهام البلاغي والتكرار. أبقيت المصطلحات الأساسية كما هي لسلامتها ودقتها.
