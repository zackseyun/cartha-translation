lexical_decisions:
- source_word: οὐχ ὅτι
  choice: ولسنا
  rationale: ينقل الاستدراك التوضيحي في السياق العربي بصورة طبيعية، من غير فهم العبارة على أنها تعليل سببي.
- source_word: ἀφ’ ἑαυτῶν
  choice: من ذواتنا
  rationale: يحافظ على معنى أن الكفاية ليست نابعة من الذات، ويظل قريبًا من دلالة حرف الجر الدالة على المصدر.
- source_word: ἱκανοί / ἱκανότης
  choice: كافين / كفايتنا
  rationale: يحفظ الصلة اللفظية المقصودة بين الصفة والاسم، ويعبّر عن الأهلية أو القدرة الوافية دون حصرها في المهارة الخدمية.
- source_word: λογίσασθαί
  choice: نحسب
  rationale: يفيد التقدير الذهني والاعتبار، وهو تعبير عربي واضح يلائم السياق.
- source_word: τι
  choice: أيَّ شيء
  rationale: ينقل شمول النكرة في سياق النفي.
- source_word: ὡς ἐξ αὑτῶν
  choice: كأنه صادر من ذواتنا
  rationale: يوضح معنى المصدر أو المنشأ، مع إبقاء ὡς في صيغة «كأنه» بدل الجزم بأن الأمر صادر منهم.
- source_word: ἐκ τοῦ θεοῦ
  choice: من الله
  rationale: صياغة مباشرة تحافظ على التشديد على الله بوصفه مصدر الكفاية.
theological_decisions:
- issue: مدى قول بولس عن القدرة البشرية
  choice: الإبقاء على العبارة عامة في نفي الكفاية الذاتية، مع بقاء سياق الخدمة حاضرًا دون إدخاله صراحة في الآية.
  alternative: حصر المعنى في الأهلية للخدمة الرسولية.
  rationale: السياق المباشر يتناول الخدمة، لكن ألفاظ اليونانية أوسع من هذا التحديد، فلا ينبغي تضييقها في متن الترجمة.
translation_notes:
  register: العربية فصحى معاصرة واضحة وموقرة. حوفظ على التوازي بين «كافين» و«كفايتنا»، وعلى تكرار «من ذواتنا» لإبراز مقابلة المصدر البشري بالمصدر الإلهي.
