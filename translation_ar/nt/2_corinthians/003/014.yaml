  yaml_path: translation/nt/2_corinthians/003/014.yaml
  text: But their minds were hardened[a]. For until this very day, at the reading of the old covenant, the same veil remains, not being lifted[b], because in Messiah it is removed.
translation:
  language: ar
  text: لكن أذهانهم تبلَّدت. فإلى هذا اليوم عينه، عند قراءة العهد القديم[a]، يبقى الحجاب نفسه من غير أن يُرفع، لأنه في المسيح يُزال[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: قد تشير عبارة «العهد القديم» أيضًا إلى أسفار العهد القديم. واللفظ اليوناني يعني حرفيًا «العهد القديم».
    reason: lexical_alternative
  - marker: b
    text: 'أو: «لأن العهد القديم يُبطَل أو يوضع جانبًا في المسيح». قد يعود الفعل اليوناني إلى الحجاب، وهو الأقرب، أو يُفهم على أنه يعود إلى العهد القديم.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπωρώθη
  choice: تقسَّت
  rationale: تنقل معنى الصيرورة إلى البلادة وعدم الاستجابة في صيغة المبني للمجهول اليونانية، من غير أن تضيف تصريحًا بأن ذلك كان تمردًا إراديًا محضًا.
- source_word: τὰ νοήματα
  choice: أذهانهم
  rationale: تشير هنا إلى ملكة الإدراك والفهم، و«الأذهان» تعبير عربي طبيعي يلائم سياق الحجة.
- source_word: ἄχρι γὰρ τῆς σήμερον ἡμέρας
  choice: فإلى هذا اليوم عينه
  rationale: تحفظ التوكيد الزمني في العبارة اليونانية، مع صياغة عربية واضحة وفصيحة.
- source_word: τὸ αὐτὸ κάλυμμα
  choice: الحجاب نفسه
  rationale: تحفظ صورة الحجاب وصلتها المباشرة بموسى في السياق المحيط.
- source_word: ἐπὶ τῇ ἀναγνώσει
  choice: عند قراءة
  rationale: صياغة عربية موجزة وطبيعية تنقل معنى الظرف المصاحب للقراءة.
- source_word: τῆς παλαιᾶς διαθήκης
  choice: العهد القديم
  rationale: تحافظ على المعنى الأصلي لكلمة διαθήκη، أي «العهد»، بدل تحويلها في المتن إلى اسم تقليدي لمجموعة الأسفار.
- source_word: μένει μὴ ἀνακαλυπτόμενον
  choice: يبقى ... من غير أن يُرفع
  rationale: تحفظ الاستمرار وصيغة المبني للمجهول، وتلائم صورة الحجاب في العربية.
- source_word: ἐν Χριστῷ
  choice: في المسيح
  rationale: تنقل Χριστός بوصفه لقبًا مسيانيًا بصياغة عربية مألوفة.
- source_word: καταργεῖται
  choice: يُزال
  rationale: يناسب أقرب مرجع نحوي، وهو الحجاب، ويحفظ صيغة المبني للمجهول من غير فرض معنى تجريدي أقوى مثل «يُبطَل».
theological_decisions:
- issue: مرجع الفعل καταργεῖται
  choice: 'اعتبار الحجاب هو المرجع: «في المسيح يُزال».'
  alternative: قد يُفهم أن العهد القديم هو الذي «يُبطَل» أو «يوضع جانبًا»، أو أن العبارة تحتمل المرجعين.
  rationale: الحجاب هو أقرب مرجع نحوي، وهذا الفهم ينسجم مع العبارة السابقة «من غير أن يُرفع». ومع ذلك، تُذكر القراءة البديلة في الحاشية حفاظًا على الغموض الحقيقي وعدم تحميل النص تقريرًا لاهوتيًا أشد مما يقتضيه التركيب.
translation_notes:
  register: لغة عربية فصحى حديثة واضحة وموقرة. استُخدم «تقسَّت» بدل تعبيرات أشد مثل «عاندت»، وحُفظت استعارة الحجاب. وُضع مؤشرا الحاشيتين عند العبارتين اللتين تفسرهما الحاشيتان مباشرة.
