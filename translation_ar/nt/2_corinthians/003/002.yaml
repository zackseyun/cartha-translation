translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت الجملة الاسمية لإبراز «أنتم»، ثم فعلان مبنيان للمعلوم بفاعل عام («جميع الناس») بدل المبني للمجهول اليوناني، لأن ذلك أكثر سلاسة في العربية ويحفظ المعنى. وُضع رمز الحاشية بعد الجملة التي تتناول البديل المعجمي.
