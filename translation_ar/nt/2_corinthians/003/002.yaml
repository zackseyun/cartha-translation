  source_fidelity: 'النص الرئيس ينقل عناصر اليونانية بدقة: «أنتم» للإسناد المباشر، و«رسالتنا» للاستعارة، و«مكتوبة في قلوبنا» لمعنى اسم المفعول التام وἐν، و«جميع الناس» لعموم πάντων ἀνθρώπων. كما أن تحويل اسمي المفعول اليونانيين إلى فعلين مبنيين للمعلوم بفاعل عام طبيعي في العربية ولا يغيّر المعنى المقصود.'
