    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ ἐπιστολὴ ἡμῶν
  choice: رِسَالَتُنَا
  rationale: «رسالة» هي المقابل العربي الحديث الواضح للاتصال المكتوب، والضمير المتصل يحفظ دلالة الملكية في ἡμῶν والاستعارة التي تجعل الكورنثيين رسالة بولس ورفقائه.
- source_word: ὑμεῖς ἐστε
  choice: أَنْتُمْ
  rationale: الجملة الاسمية العربية تنقل الإسناد المباشر طبيعيًا، وتقديم ضمير المخاطبين يحفظ بروز ὑμεῖς من غير إضافة توكيد غير لازم.
- source_word: ἐγγεγραμμένη
  choice: مَكْتُوبَةٌ
  rationale: تنقل اسم المفعول التام الدال على شيء قد كُتب وما زال قائمًا بوصفه مكتوبًا، وتحافظ على صورة الرسالة بلغة واضحة.
- source_word: ἐν ταῖς καρδίαις ἡμῶν
  choice: فِي قُلُوبِنَا
  rationale: «في» تقابل ἐν مباشرة، وتحفظ موضع الكتابة كما صاغه النص، مع بقاء التعبير طبيعيًا ومفهومًا بالعربية.
- source_word: γινωσκομένη
  choice: يَعْرِفُهَا
  rationale: تنقل معنى المعرفة، مع احتمال دلالة التعرّف أو الإدراك؛ وصيغة الفعل العربية أوضح في اقترانها بالفعل التالي.
- source_word: ἀναγινωσκομένη
  choice: يَقْرَؤُهَا
  rationale: تحفظ المعنى الحرفي للقراءة واستعارة الرسالة بوضوح.
- source_word: ὑπὸ πάντων ἀνθρώπων
  choice: جَمِيعُ النَّاسِ
  rationale: «الناس» تشمل البشر عمومًا ولا تقصر المرجع على الذكور، و«جميع» تنقل شمول πάντων.
