translation:
  language: ar
  text: والرب هو الروح[a]، وحيث روح الرب فهناك حرية.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: قد تُفهم عبارة «والرب هو الروح» بوصفها ربطًا وثيقًا في السياق، من غير أن تحدد كيفية تعريف هذه العلاقة لاهوتيًا.'
    reason: alternative_reading
lexical_decisions:
- source_word: κύριος
  choice: الرب
  rationale: يحفظ المقابل الكتابي المألوف للاسم κύριος وملاءمته للاستعمال اللاهوتي القوي في السياق.
- source_word: πνεῦμα
  choice: الروح
  rationale: تشير الكلمة في الموضعين إلى الروح القدس في سياق حجة بولس، لا إلى روح بشرية أو قوة غير شخصية.
- source_word: δὲ
  choice: الواو
  rationale: نُقلت أداة الربط الأولى بواو استئنافية طبيعية، والثانية بالواو، من غير إدخال ظرف زمني لا يتضمنه الأصل.
- source_word: οὗ
  choice: حيث
  rationale: تنقل الدلالة المكانية العامة بوضوح وطبيعية، من غير توسيعها إلى «حيثما».
- source_word: ἐλευθερία
  choice: حرية
  rationale: مقابل عربي معاصر مباشر يحفظ الثقل الدلالي واللاهوتي للكلمة.
- source_word: ὁ δὲ κύριος τὸ πνεῦμά ἐστιν
  choice: والرب هو الروح
  rationale: صياغة مساواة مباشرة تحفظ قوة العبارة اليونانية، مع استعمال ضمير الفصل العربي لتوضيح بنيتها من غير تفسير زائد.
- source_word: τὸ πνεῦμα κυρίου
  choice: روح الرب
  rationale: يحفظ تركيب الإضافة الصريح في اليونانية ورنينه الكتابي الطبيعي بالعربية.
theological_decisions:
- issue: عبارة «الرب هو الروح» تقرير هوية محل خلاف لاهوتي.
  choice: 'أُبقيت العبارة تقرير مساواة مباشرًا: «والرب هو الروح».'
  alternative: قد تُفهم على أنها تحديد وثيق وظيفي أو عهدي في السياق، لا مساواة شاملة تحدد العلاقة لاهوتيًا؛ كما قد يُفهم «الرب» على أنه المسيح خصوصًا أو على أنه إحالة إلهية أوسع.
  rationale: الأصل اليوناني يقرر العلاقة مباشرة، ولذلك ينبغي أن تحفظ الترجمة التوتر والاحتمال التفسيري بدل أن تحسمهما بإعادة صياغة عقائدية.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُعملت الواو الاستئنافية لنقل δέ طبيعيًا، وتُركت العبارة اللاهوتية المركزية مباشرة من غير تلطيف أو حسم تفسيري.
