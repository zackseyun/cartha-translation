lexical_decisions:
- source_word: Πεποίθησιν
  choice: ثقة
  rationale: تنقل معنى الاطمئنان الواثق في السياق من غير مبالغة في إبراز الشعور الذاتي أو تغيير متعلَّق الثقة.
- source_word: δὲ τοιαύτην
  choice: كهذه
  rationale: تصل العبارة بما سبق وتحفظ القوة الإشارية النوعية لـ τοιαύτην، بينما يُفهم الرابط الخفيف δὲ طبيعيًا من السياق العربي.
- source_word: ἔχομεν
  choice: لنا
  rationale: صياغة عربية طبيعية ومباشرة لمعنى «نملك/لدينا».
- source_word: διὰ τοῦ Χριστοῦ
  choice: بالمسيح
  rationale: الباء تفيد الواسطة هنا، فتحفظ دلالة διά مع المضاف إليه، و«المسيح» المقابل العربي الراسخ للقب Χριστός.
- source_word: πρὸς τὸν θεόν
  choice: لدى الله
  rationale: تحفظ الوجهة العلائقية نحو الله بصياغة عربية مفهومة، مع إبقاء الترجمة الحرفية المحتملة في الحاشية.
theological_decisions:
- issue: دلالة Χριστοῦ بوصفه لقبًا
  choice: المسيح
  alternative: المسيح يسوع، أو نقل اللفظ بوصفه اسمًا
  rationale: «المسيح» هو المقابل العربي المألوف للقب اليوناني ويحفظ طابعه اللقبي من غير إضافة غير موجودة في النص.
- issue: العلاقة التي تعبّر عنها πρὸς τὸν θεόν
  choice: لدى الله
  alternative: نحو الله
  rationale: «لدى الله» عربية طبيعية في وصف الثقة القائمة في حضرته أو من جهته، أما «نحو الله» فتحفظ الصورة المكانية الحرفية لكنها أقل سلاسة؛ لذلك ذُكرت في الحاشية بدل حسم سعة العبارة.
translation_notes:
  register: لغة عربية فصحى واضحة وموجزة ذات نبرة رسائلية كريمة. حُفظت صلة العبارة بالسياق السابق من خلال «كهذه»، وتُجنِّبت إضافة فاعل أو مفعول للثقة لا يصرّح به النص.
