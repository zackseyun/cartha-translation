  text: ὃς καὶ ἱκάνωσεν ἡμᾶς διακόνους καινῆς διαθήκης, οὐ γράμματος ἀλλὰ πνεύματος, τὸ γὰρ γράμμα ἀποκτέννει, τὸ δὲ πνεῦμα ζῳοποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/006.yaml
  text: who also made us competent as servants of a new covenant[a], not of the letter but of the Spirit; for the letter kills[c][b], but the Spirit gives life.
translation:
  language: ar
  text: الذي جعلنا أيضًا أهلًا لأن نكون خُدّامًا لعهد جديد، لا للحرف بل للروح[a]؛ لأن الحرف يقتل[b]، أما الروح فيُحيي.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: قد تشير «الروح» هنا وفي آخر الآية إلى الروح القدس، أو إلى الروح في مقابل الحرف؛ فالنص اليوناني لا يميّز بين المعنيين بحروف كبيرة أو صغيرة.
    reason: alternative_reading
  - marker: b
    text: يمكن أن يُفهم «الحرف» أيضًا بمعنى «النص المكتوب».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱκάνωσεν
  choice: جعلنا أهلًا
  rationale: ينقل معنى التأهيل ومنح الكفاية للخدمة، من غير إيحاء بمجرد الكفاية الذاتية أو الاعتماد الرسمي.
- source_word: διακόνους
  choice: خُدّام
  rationale: يحافظ على معنى الخدمة في اللفظة اليونانية، ويتجنب حصرها في منصب كنسي متأخر.
- source_word: καινῆς διαθήκης
  choice: عهد جديد
  rationale: صياغة عربية طبيعية تعكس العبارة اليونانية غير المعرّفة، مع إبقاء الصلة بسياق العهد الجديد واضحة.
- source_word: γράμματος / γράμμα
  choice: الحرف
  rationale: يحفظ صورة بولس الموجزة والمقابلة المباشرة مع الروح، من غير تضييق المعنى إلى تفسير واحد.
- source_word: πνεύματος / πνεῦμα
  choice: الروح
  rationale: يرجح السياق الإشارة إلى روح الله في العهد الجديد، مع بقاء العربية من دون تمييز كتابي بين اسم الجنس والاسم الدال على الروح القدس؛ وتوضح الحاشية الاحتمال.
- source_word: ἀποκτέννει
  choice: يقتل
  rationale: ترجمة مباشرة وقوية تحافظ على المضارع والصورة الحادة في الأصل.
- source_word: ζῳοποιεῖ
  choice: يُحيي
  rationale: فعل عربي موجز وطبيعي ينقل معنى منح الحياة أو جعل الشيء حيًا.
theological_decisions:
- issue: هل يشير πνεῦμα إلى الروح القدس أم إلى الروح بمعنى أعم؟
  choice: الروح، مع ترجيح روح الله
  alternative: الروح أو المعنى الروحي في مقابل الحرف
  rationale: سياق العهد الجديد وفعل الإحياء يرجحان الإشارة إلى روح الله، لكن الأصل اليوناني لا يحسم ذلك بعلامة طباعية، لذلك لا تُلغى سعة اللفظ.
- issue: طبيعة المقابلة بين الحرف والروح
  choice: الإبقاء على «الحرف» من دون تفسيره داخل المتن
  alternative: الشريعة المكتوبة أو النص المكتوب
  rationale: العبارة البولسية مكثفة وقد تشير إلى المكتوب بوصفه حرفًا أو إلى ناموس مكتوب ضمن السياق؛ إدخال تفسير محدد في المتن سيحسم توترًا لا يحسمه اللفظ نفسه.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. أُعيد ذكر «خُدّام» في طرفي المقابلة لتأتي العبارة طبيعية في العربية وتوضح تعلق المضافين به، مع الحفاظ على إيجاز الأصل وقوته.
