    rationale: الشق الأول في اليونانية بلا فعل، ومعناه الأساسي أن لخدمة الإدانة مجدًا. استعمال «كان لخدمة ... مجد» أوفى بالنص وأفصح عربيًا.
  - severity: low
    issue: «فبالأحرى كثيرًا» غير طبيعي في ترتيب العربية.
    rationale: «فكم بالأحرى» ينقل القوة المقارنة لـ πολλῷ μᾶλλον بأسلوب عربي واضح ومألوف.
  - severity: low
    issue: موضع علامة الحاشية في نهاية الآية لا يحدد بوضوح أن البديل يتعلق بـ«البرّ».
    rationale: ينبغي وضعها بعد اللفظ المعني مباشرة.
  revised_text: فإن كان لخدمة الإدانة مجد، فكم بالأحرى تفيض خدمة البرّ[a] بالمجد.
