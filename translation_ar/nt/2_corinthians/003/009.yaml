  text: εἰ γὰρ ⸂τῇ διακονίᾳ⸃ τῆς κατακρίσεως δόξα, πολλῷ μᾶλλον περισσεύει ἡ διακονία τῆς ⸀δικαιοσύνης δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/009.yaml
  text: For if the ministry of condemnation came with glory[a], much more does the ministry of righteousness abound in glory.
translation:
  language: ar
  text: فإن كان لخدمة الإدانة مجد، فكم بالأحرى تفيض خدمة البرّ[a] بالمجد.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «العدل».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διακονία
  choice: خدمة
  rationale: «خدمة» لفظ عربي طبيعي يتسع هنا للمهمة أو التدبير الذي يقارن بولس بين وجهيه، ولا يحصر المعنى في عمل منفرد.
- source_word: κατάκρισις
  choice: الإدانة
  rationale: ينقل المعنى القضائي للاسم، ويحافظ على المقابلة مع البر.
- source_word: δόξα
  choice: مجد
  rationale: هو المقابل العربي المألوف والدقيق في هذا السياق، ويحفظ ترابط حجة بولس بشأن مجد العهد.
- source_word: πολλῷ μᾶλλον
  choice: فبالأحرى كثيرًا
  rationale: ينقل قوة التصعيد في المقارنة، مع إبقاء معنى «much more» ظاهرًا في العربية.
- source_word: περισσεύει
  choice: تفيض
  rationale: تعبر طبيعيًا عن الكثرة المتجاوزة والوفرة التي يدل عليها الفعل، وتنسجم مع «بالمجد».
- source_word: δικαιοσύνη
  choice: البرّ
  rationale: «البرّ» هو المقابل الكتابي العربي الراسخ الذي يشمل الاستقامة والحالة الصحيحة أمام الله، مع حفظ احتمال «العدل» في الحاشية.
- source_word: 'verbless clause: τῇ διακονίᾳ ... δόξα'
  choice: قد جاءت بمجد
  rationale: أُضيف فعل تقتضيه العربية لتمام الجملة الاسمية اليونانية، وصيغته تدل على اقتران الخدمة بالمجد من غير مبالغة في المعنى.
theological_decisions:
- issue: دلالة δικαιοσύνη في المقابلة البولسية بين الخدمتين
  choice: البرّ
  alternative: العدل
  rationale: «البرّ» يحفظ الاتساع اللاهوتي والاستعمال البولسي المألوف، بينما يظل «العدل» احتمالًا معجميًا حقيقيًا مذكورًا في الحاشية دون حسم زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة وذات نبرة كتابية وقورة. حوفظ على بنية المقابلة بين «خدمة الإدانة» و«خدمة البرّ»، وعلى التفاوت المقصود بين مجد اقترن بالأولى ومجد تفيض به الثانية.
