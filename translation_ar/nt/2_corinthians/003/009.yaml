revisions:
- from: فإنْ كانت خدمةُ الإدانة قد جاءت بمجد، فبالأحرى كثيرًا تفيض خدمةُ البرّ بالمجد.[a]
  to: فإن كان لخدمة الإدانة مجد، فكم بالأحرى تفيض خدمة البرّ[a] بالمجد.
  rationale: استبدلتُ الفعل الديناميكي في الشق الأول بصياغة اسمية عربية تعكس مباشرةً الجملة اليونانية الاسمية، واستبدلتُ ترتيب المقارنة غير السلس بتعبير «فكم بالأحرى». وحُرّكت علامة الحاشية لتتصل بلفظ «البرّ» الذي تشرح بديله.
