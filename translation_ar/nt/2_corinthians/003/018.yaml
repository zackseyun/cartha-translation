  text: ἡμεῖς δὲ πάντες ἀνακεκαλυμμένῳ προσώπῳ τὴν δόξαν κυρίου κατοπτριζόμενοι τὴν αὐτὴν εἰκόνα μεταμορφούμεθα ἀπὸ δόξης εἰς δόξαν, καθάπερ ἀπὸ κυρίου πνεύματος.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/018.yaml
  text: And we all[a], with unveiled face, beholding the glory of the Lord as in a mirror, are being transformed into the same image from glory to glory, just as from the Lord[b], the Spirit.
translation:
  language: ar
  text: ونحن جميعًا، بوجهٍ مكشوف، نعاين مجد الرب كما في مرآة[a]، ونتحوّل إلى الصورة عينها، من مجد إلى مجد، كما من الرب، الروح[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «نعكس، كمرآة، مجد الرب».'
    reason: alternative_reading
  - marker: b
    text: 'أو: «من الرب الذي هو الروح»؛ ويجوز أيضًا: «من روح الرب».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνακεκαλυμμένῳ προσώπῳ
  choice: بوجهٍ مكشوف
  rationale: ينقل اسم المفعول التام الحالة الحاضرة الناتجة من رفع الحجاب، ويحافظ على صيغة المفرد الجماعية في اليونانية.
- source_word: τὴν δόξαν κυρίου
  choice: مجد الرب
  rationale: ترجمة مباشرة للإضافة، مع اعتماد «الرب» مقابل κύριος.
- source_word: κατοπτριζόμενοι
  choice: نعاين ... كما في مرآة
  rationale: يفيد الفعل إمكان المعاينة بواسطة مرآة أو الانعكاس كالمرآة. اختير معنى المعاينة لأنه يلائم الانتقال من رؤية المجد إلى التحول، مع إثبات المعنى الآخر في الحاشية.
- source_word: τὴν αὐτὴν εἰκόνα
  choice: الصورة عينها
  rationale: صياغة عربية طبيعية تحافظ على التشديد في «نفس الصورة» وعلى الصلة بين مجد الرب والصورة التي يجري التحول إليها.
- source_word: μεταμορφούμεθα
  choice: نتحوّل
  rationale: المضارع المبني للمجهول في اليونانية يصور تحولًا جاريًا؛ وتؤدي صيغة المطاوعة العربية معنى وقوع التحول على المؤمنين دون تسمية الفاعل.
- source_word: ἀπὸ δόξης εἰς δόξαν
  choice: من مجد إلى مجد
  rationale: يحافظ على إيجاز العبارة اليونانية ولا يضيف تفسير «من درجة إلى أخرى» إلى المتن.
- source_word: καθάπερ
  choice: كما هو
  rationale: تؤدي المقارنة مع إضمار ما يلزم عربيًا لربطها بعبارة المصدر التالية.
- source_word: ἀπὸ κυρίου πνεύματος
  choice: من الرب، الروح
  rationale: تحافظ الصياغة على تركيب اليونانية الموجز واحتمال كون «الروح» بدلًا أو بيانًا، من غير حسم العلاقة النحوية والعقائدية في المتن.
- source_word: κύριος
  choice: الرب
  rationale: المقابل العربي المألوف والملائم في موضعي اللفظة في الآية.
theological_decisions:
- issue: دلالة κατοπτριζόμενοι
  choice: نعاين مجد الرب كما في مرآة
  alternative: نعكس، كمرآة، مجد الرب
  rationale: سياق التحول عند معاينة المجد يرجّح معنى المعاينة، لكن دلالة الانعكاس احتمال لغوي حقيقي، ولذلك حُفظ في الحاشية.
- issue: العلاقة بين κυρίου وπνεύματος في خاتمة الآية
  choice: من الرب، الروح
  alternative: 'من الرب الذي هو الروح؛ أو: من روح الرب'
  rationale: العبارة اليونانية مقتضبة وتقبل هذه الأوجه؛ فاختيرت صياغة قريبة تحافظ على التوتر النحوي واللاهوتي، وأثبتت القراءات الأصرح في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حوفظ على إيجاز «من مجد إلى مجد» وعلى الغموض الحقيقي في الفعل المتصل بالمرآة وفي العبارة الختامية، مع وضع علامتي الحاشيتين في موضعيهما الدلاليين داخل المتن.
