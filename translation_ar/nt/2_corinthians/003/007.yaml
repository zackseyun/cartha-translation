source:
  edition: SBLGNT
  text: Εἰ δὲ ἡ διακονία τοῦ θανάτου ἐν ⸀γράμμασιν ⸀ἐντετυπωμένη λίθοις ἐγενήθη ἐν δόξῃ, ὥστε μὴ δύνασθαι ἀτενίσαι τοὺς υἱοὺς Ἰσραὴλ εἰς τὸ πρόσωπον Μωϋσέως διὰ τὴν δόξαν τοῦ προσώπου αὐτοῦ τὴν καταργουμένην,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/007.yaml
  text: But if the ministry of death[a], engraved in letters on stones, came with glory, so that the sons of Israel were not able to gaze at Moses’ face because of the glory of his face, which was fading away[b],
translation:
  language: ar
  text: ولكن إن كانت خدمة الموت، المنقوشة بحروف على حجارة، قد جاءت في مجد، حتى إن بني إسرائيل لم يقدروا أن يحدّقوا في وجه موسى بسبب مجد وجهه، ذلك المجد الذي كان يزول[a]،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الذي كان يخبو»، أو: «الذي كان يُبطَل».'
    reason: alternative_reading
lexical_decisions:
- source_word: διακονία
  choice: خدمة
  rationale: تنقل معنى الخدمة أو المهمة الموكلة، وتلائم المقابلة التي يقيمها بولس في السياق دون تحميل اللفظ دلالة كنسية خاصة.
- source_word: τοῦ θανάτου
  choice: الموت
  rationale: حُفظت الإضافة الموجزة في «خدمة الموت» لصون حدة تعبير بولس من غير توسيع تفسيري مثل «التي تجلب الموت».
- source_word: ἐν γράμμασιν ἐντετυπωμένη λίθοις
  choice: المنقوشة بحروف على حجارة
  rationale: يحفظ «بحروف» لفظ γράμμασιν، ويعبّر «المنقوشة» عن أثر الحفر، بينما تُترك «حجارة» كما في اليونانية بدل إدخال «ألواح» غير المصرح بها.
- source_word: ἐγενήθη ἐν δόξῃ
  choice: قد جاءت في مجد
  rationale: صياغة عربية طبيعية نسبيًا تحافظ على القوة الحدثية للفعل وعلى تركيب «في مجد» دون إضافة تفسير مثل «دُشنت».
- source_word: ὥστε μὴ δύνασθαι ἀτενίσαι
  choice: حتى إن ... لم يقدروا أن يحدّقوا
  rationale: تحفظ جملة النتيجة وقوة ἀτενίζω الدالة على إدامة النظر أو تثبيته.
- source_word: τοὺς υἱοὺς Ἰσραήλ
  choice: بني إسرائيل
  rationale: تعبير عربي راسخ ودقيق يقابل العبارة اليونانية حرفيًا ودلاليًا من غير تسطيحها إلى «الإسرائيليين».
- source_word: εἰς τὸ πρόσωπον Μωϋσέως
  choice: في وجه موسى
  rationale: يتوافق مع الاستعمال العربي للفعل «يحدّق في» ويحافظ على التركيز الملموس على وجه موسى.
- source_word: καταργουμένην
  choice: كان يزول
  rationale: «يزول» يبقي المجال الدلالي مفتوحًا بين الخفوت والانتهاء، ويتجنب حسم المرجع في صورة تلاشي ضوئي فقط.
theological_decisions:
- issue: هل يصف καταργουμένην خفوت المجد المرئي أم زواله وانتهاءه؟
  choice: ذلك المجد الذي كان يزول
  alternative: الذي كان يخبو / الذي كان يُبطَل
  rationale: الضمير التوضيحي يبيّن أن الوصف عائد إلى مجد الوجه بحسب المطابقة النحوية، بينما يحفظ «يزول» التوتر بين التناقص المرئي والطابع المؤقت دون فرض معنى لاهوتي مجرد أو صورة ضوئية حصرية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «بني إسرائيل» لرسوخه ودقته، و«خدمة» بدل مصطلح طائفي أضيق. وُضع marker الحاشية في المتن مباشرة بعد العبارة محل الاحتمال.
