translation:
  language: ar
  text: ولكن كلما رجع المرء إلى الرب[a]، يُزال الحجاب[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ولكن متى رجع إلى الرب».'
    reason: بديل يحفظ الفاعل مضمرًا ويعبّر عن الزمن بلفظ «متى» بدل «كلما».
  - marker: b
    text: 'أو: «يُرفع الحجاب».'
    reason: بديل معجمي للفعل περιαιρεῖται، الذي يدل على إزالة الشيء أو رفعه.
lexical_decisions:
- source_word: ἡνίκα δὲ ἐὰν
  choice: ولكن كلما
  rationale: تحفظ «ولكن» صلة δέ بما قبلها، وتعبّر «كلما» عن الزمن غير المحدد أو المتكرر الناتج من ἡνίκα مع ἐὰν وصيغة الالتزام.
- source_word: ἐπιστρέψῃ
  choice: رجع
  rationale: ينقل معنى الاتجاه أو الرجوع إلى الرب من غير أن يضيّقه إلى مصطلح عقائدي مثل «اهتدى» أو «تاب»، ويلائم صدى قصة موسى في الخروج.
- source_word: πρὸς κύριον
  choice: إلى الرب
  rationale: تؤدي «إلى» معنى الاتجاه في πρός مع النصب، ويُحفظ لقب κύριος بصيغة «الرب» من غير تعيين إضافي لهويته في هذا الموضع.
- source_word: περιαιρεῖται
  choice: يُزال
  rationale: يحفظ المبني للمجهول في المضارع، ولا يضيف فاعلًا لم يذكره النص.
- source_word: τὸ κάλυμμα
  choice: الحجاب
  rationale: «الحجاب» هو اللفظ الطبيعي والدقيق في سياق حجاب موسى، وهو أخص من «الغطاء».
theological_decisions:
- issue: الفاعل غير المصرح به في ἐπιστρέψῃ
  choice: إظهار الفاعل العام بلفظ «المرء»
  alternative: ولكن متى رجع إلى الرب، يُزال الحجاب.
  rationale: الفعل اليوناني مفرد بلا اسم فاعل صريح. وإضافة «المرء» تجعل العربية واضحة وتحفظ العموم دون حصر القول في جماعة أو فرد بعينه، مع إثبات البديل الذي يبقي الفاعل مضمرًا.
- issue: هوية «الرب» في السياق
  choice: الرب
  alternative: المسيح؛ أو الرب، أي الروح
  rationale: يذكر هذا العدد κύριον وحدها، مع أن السياق الأوسع يصل بين الرب والروح بصورة تحتمل نقاشًا تفسيريًا. لذلك تُحفظ عبارة النص ولا يُحسم هذا التوتر في المتن.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُعمل «المرء» لتأدية الفاعل العام من غير تخصيص، وحُفظ المبني للمجهول والتعبير «الرب» كما في المصدر، مع وضع علامتي الحاشيتين في المتن.
