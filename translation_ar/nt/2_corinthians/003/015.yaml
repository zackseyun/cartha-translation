id: 2CO.3.15
reference: 2 Corinthians 3:15
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἀλλ’ ἕως σήμερον ἡνίκα ⸂ἂν ἀναγινώσκηται⸃ Μωϋσῆς κάλυμμα ἐπὶ τὴν καρδίαν αὐτῶν κεῖται·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/015.yaml
  text: But to this day[a], whenever Moses is read[b], a veil lies over their heart.
translation:
  language: ar
  text: لكن إلى هذا اليوم، كلما قُرئ موسى[a]، يبقى حجابٌ على قلبهم[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي كتابات موسى، ولا سيما الشريعة.
    reason: cultural_note
  - marker: b
    text: في اليونانية «قلبهم» بالمفرد، ويُرجَّح أنه مفرد ذو معنى جمعي؛ ويمكن أن يُعبَّر عنه أيضًا بـ«قلوبهم».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: لكن
  rationale: تفيد الاستدراك والتباين مع الكلام السابق، و«لكن» موجزة وطبيعية في العربية.
- source_word: ἕως σήμερον
  choice: إلى هذا اليوم
  rationale: تحفظ دلالة استمرار الحالة حتى الزمن الحاضر، بصياغة عربية واضحة ومألوفة.
- source_word: ἡνίκα ἂν ἀναγινώσκηται
  choice: كلما قُرئ
  rationale: تفيد الأداة مع ἄν والمضارع الاحتمالي ظرفًا متكررًا غير محدد، وهو ما تؤديه «كلما».
- source_word: Μωϋσῆς
  choice: موسى
  rationale: يحافظ على المجاز المرسل في الأصل، حيث يدل اسم موسى على كتاباته، من غير إدخال التفسير في المتن.
- source_word: κάλυμμα
  choice: حجاب
  rationale: يلائم صورة الحجاب المتكررة في سياق الأصحاح، وهو المقابل العربي المباشر والدقيق.
- source_word: ἐπὶ τὴν καρδίαν αὐτῶν
  choice: على قلبهم
  rationale: 'يحافظ على المفرد الجمعي في اليونانية: «قلب» مفرد مع ضمير الجمع.'
- source_word: κεῖται
  choice: يبقى
  rationale: يدل الفعل على وجود الشيء مستقرًا في موضعه؛ و«يبقى» تنقل هنا استمرار الحجاب بعبارة عربية طبيعية، مع بقاء معنى الاستقرار.
theological_decisions:
- issue: هل يُصرَّح بأن «موسى» يعني شريعة موسى أو كتاباته؟
  choice: إبقاء «موسى» في المتن بوصفه مجازًا مرسلًا
  alternative: 'ترجمته تفسيرًا: «شريعة موسى» أو «كتابات موسى»'
  rationale: الأصل يذكر «موسى» نفسه، وإبقاء التعبير يصون صورة النص وغموضه المشروع، بينما توضّح الحاشية المقصود المرجح.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ اسم «موسى» كما في الأصل، وحُفظ المفرد الجمعي «قلبهم». وُضعت علامة الحاشية [a] بعد «موسى» لأنها تشرح هذا اللفظ، وعلامة [b] بعد «قلبهم» لأنها تتعلق بصيغته النحوية.
