  yaml_path: translation/nt/2_corinthians/003/011.yaml
  text: For if what was being brought to an end came with glory[c][b][a], much more what remains is in glory.
translation:
  language: ar
  text: فإن كان ما كان يُبطَل قد جاء بمجد[a]، فما يبقى في مجد أعظم بكثير.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كان مصحوبًا بمجد». حرفيًا: «عبر مجد».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καταργούμενον
  choice: ما يُبطَل
  rationale: اسم مفعول مضارع يدل على شيء جارٍ إبطاله أو إنهائه. يحافظ «ما يُبطَل» على دلالة الفعل المباشرة وعلى صيغة المبني للمجهول، من غير أن يفسرها بمجرد التلاشي.
- source_word: διὰ δόξης
  choice: من خلال مجد
  rationale: ينقل διά مع المضاف إليه بمعناه الأقرب «من خلال»، ويحفظ التباين المقصود مع ἐν δόξῃ، وإن كانت عبارة «مصحوبًا بمجد» بديلًا عربيًا أكثر تفسيرًا.
- source_word: μένον
  choice: ما يبقى
  rationale: يحفظ صيغة اسم الفاعل المحايد المستعمل اسميًا، ويقابل بين الأمر الزائل والأمر الباقي من غير تسمية العهدين صراحة.
- source_word: ἐν δόξῃ
  choice: في مجد
  rationale: ترجمة مباشرة لحرف الجر ἐν، وتحفظ الفرق البلاغي عن διὰ δόξης.
- source_word: πολλῷ μᾶλλον
  choice: فبالأولى كثيرًا
  rationale: تؤدي قوة المقارنة والاستدلال من الأدنى إلى الأعلى بلغة عربية واضحة ومألوفة كتابيًا.
theological_decisions:
- issue: طبيعة المقابلة بين ما يُبطَل وما يبقى
  choice: الإبقاء على التعبيرين المجردين «ما يُبطَل» و«ما يبقى»
  alternative: التصريح بأن المقصود هو العهد القديم والعهد الجديد أو خدمتهما
  rationale: النص اليوناني في هذه الآية يستعمل اسمَي فاعل محايدين استعمالًا اسميًا ولا يسمّي العهدين صراحة؛ لذا تُترك هوية الطرفين للسياق ولا تُضاف خلاصة عقائدية إلى ألفاظ الآية.
- issue: قوة καταργούμενον
  choice: ما يُبطَل
  alternative: ما يزول، أو ما يتلاشى، أو ما يُوضَع جانبًا
  rationale: «يُبطَل» يعكس معنى جعل الشيء غير نافذ أو إنهائه، مع الحفاظ على التوتر بين عملية الإبطال والمجد الذي ارتبط به، بدل تخفيفه إلى تلاشي طبيعي.
translation_notes:
  register: فصحى معاصرة واضحة ذات نبرة كريمة. حُفظ التوازي بين «ما يُبطَل» و«ما يبقى»، وكذلك الفرق بين «من خلال مجد» و«في مجد». وُضع مؤشر الحاشية [a] مباشرة بعد العبارة التي يشرحها.
