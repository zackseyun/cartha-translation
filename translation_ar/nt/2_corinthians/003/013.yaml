source:
  edition: SBLGNT
  text: καὶ οὐ καθάπερ Μωϋσῆς ἐτίθει κάλυμμα ἐπὶ τὸ πρόσωπον ⸀αὐτοῦ, πρὸς τὸ μὴ ἀτενίσαι τοὺς υἱοὺς Ἰσραὴλ εἰς τὸ τέλος τοῦ καταργουμένου.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/013.yaml
  text: and not like Moses[b][a], who used to put a veil over his face so that the sons of Israel would not gaze at the end of what was fading away.
translation:
  language: ar
  text: ولا كما كان موسى يضع حجابًا على وجهه، لكيلا يحدّق بنو إسرائيل[b] إلى نهاية ما كان يزول[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «غاية ما كان يُبطَل، أو مآله».'
    reason: alternative_reading
  - marker: b
    text: 'حرفيًا: «أبناء إسرائيل»؛ أي الإسرائيليون.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ
  choice: كما
  rationale: تنقل أداة التشبيه بوضوح، وتُبقي العبارة مرتبطة بما قبلها كما في اليونانية.
- source_word: ἐτίθει
  choice: كان يضع
  rationale: صيغة الماضي الناقص تدل هنا على فعل معتاد أو متكرر، وهو ما تؤديه «كان يضع» طبيعيًا.
- source_word: κάλυμμα
  choice: حجابًا
  rationale: لفظ واضح ودقيق لغطاء الوجه في قصة موسى، كما يلائم استعارة بولس في السياق.
- source_word: πρόσωπον αὐτοῦ
  choice: وجهه
  rationale: هو المعنى المباشر والطبيعي للعبارة.
- source_word: πρὸς τὸ μὴ ἀτενίσαι
  choice: لكيلا يحدّق
  rationale: تحفظ العبارة معنى الغرض، ويؤدي «يحدّق» دلالة النظر المثبّت أو الممعن في ἀτενίζω.
- source_word: τοὺς υἱοὺς Ἰσραήλ
  choice: بنو إسرائيل
  rationale: يحفظ التعبير الكتابي وصيغة المصدر، وهو تعبير عربي مألوف يعني الإسرائيليين.
- source_word: εἰς τὸ τέλος
  choice: في نهاية
  rationale: تحفظ المعنى الأرجح، وهو النهاية أو الانتهاء، من غير طمس احتمال معنى الغاية أو المآل.
- source_word: τοῦ καταργουμένου
  choice: ما كان يزول
  rationale: ينقل معنى الشيء الذي كان يفقد أثره أو يمضي إلى الزوال، من غير إدخال اسم «المجد» غير المذكور صراحة في الآية.
theological_decisions:
- issue: معنى τέλος τοῦ καταργουμένου
  choice: نهاية ما كان يزول
  alternative: غاية ما كان يُبطَل، أو مآله
  rationale: السياق يقابل بين ما يزول وما يبقى، ولذلك تُرجّح «النهاية» و«الزوال»، مع إبقاء احتمال أن تعني τέλος الغاية أو المآل في الحاشية، من غير حسم التوتر الدلالي لاهوتيًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. أُبقي بدء الآية بـ«ولا كما» متعلقًا بالسياق السابق، كما هو في تركيب النص اليوناني، ولم يُضف «المجد» رغم إمكان فهمه من السياق.
