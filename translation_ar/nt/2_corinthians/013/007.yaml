base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/007.yaml
  text: We pray to God that you may do nothing wrong—not so that we may appear approved[a], but so that you may do what is right[c][b], even if we may seem disqualified.
translation:
  language: ar
  text: ونصلّي إلى الله ألّا تفعلوا أيَّ سوءٍ، لا لكي نظهر نحن مقبولين، بل لكي تفعلوا أنتم ما هو صواب، ولو كنّا نحن كأننا غير مقبولين.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ولو بدونا غير مقبولين». والكلمتان المترجمتان «مقبولين» و«غير مقبولين» متضادتان في اليونانية، وتشيران إلى من ثبتت جدارته في الاختبار ومن لم يثبتها.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐχόμεθα
  choice: نصلّي
  rationale: يدل الفعل هنا على صلاة موجَّهة إلى الله، وهذه الصياغة عربية طبيعية ومباشرة.
- source_word: πρὸς τὸν θεὸν
  choice: إلى الله
  rationale: حرف الجر مع فعل الصلاة يعبّر عن توجّه الصلاة إلى الله.
- source_word: μὴ ποιῆσαι ὑμᾶς κακὸν μηδέν
  choice: ألّا تفعلوا أيَّ شرّ
  rationale: ينقل مضمون الصلاة ويحفظ قوة النفي في κακὸν μηδέν، أي عدم فعل أي شيء شرير.
- source_word: οὐχ ἵνα
  choice: لا لكي
  rationale: يحفظ معنى الغاية المنفية بوضوح.
- source_word: δόκιμοι
  choice: مُجتازين للامتحان
  rationale: ينقل معنى من ثبتت جدارته بعد الاختبار، ويحافظ على الصلة اللفظية والدلالية مع ἀδόκιμοι.
- source_word: φανῶμεν
  choice: نظهر
  rationale: يحفظ معنى الظهور أو أن يُنظر إلينا بهذه الصفة.
- source_word: τὸ καλὸν
  choice: ما هو صالح
  rationale: يعكس المعنى الأخلاقي لـκαλός بصياغة عربية واضحة دون تضييقه على معنى واحد أكثر من اللازم.
- source_word: ποιῆτε
  choice: تفعلوا
  rationale: جاء ضمن جملة الغاية بعد ἵνα، وتؤدي العربية هذا المعنى بالفعل المنصوب.
- source_word: ὡς ἀδόκιμοι ὦμεν
  choice: ولو كنّا نحن كأننا لم نجتز الامتحان
  rationale: يحفظ ὡς الدالة على التشبيه أو الهيئة، ولا يحسم هل المقصود حقيقة عدم الاجتياز أم الظهور كذلك؛ كما يبقي التضاد مع δόκιμοι ظاهرًا.
theological_decisions:
- issue: دلالة وصف بولس ورفقائه بـὡς ἀδόκιμοι
  choice: الإبقاء على صورة «كأننا لم نجتز الامتحان»
  alternative: «ولو بدونا مرفوضين» أو «ولو اعتُبرنا غير مُزكَّين»
  rationale: النص يربط الوصف بسياق الاختبار والإثبات، وὡς تترك مجالًا للهيئة أو التقدير الظاهر. لذا لا ينبغي تحويل العبارة إلى تقرير عن هلاك نهائي، ولا حصرها قطعًا في مجرد نظرة الآخرين.
translation_notes:
  register: فصحى معاصرة واضحة ووقورة. اختيرت صورة الامتحان للحفاظ على التضاد الاشتقاقي بين δόκιμοι وἀδόκιμοι، ووُضعت الحاشية بعد العبارة التي تشرحها مباشرة.
