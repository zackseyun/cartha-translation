  text: διὰ τοῦτο ταῦτα ἀπὼν γράφω, ἵνα παρὼν μὴ ἀποτόμως χρήσωμαι κατὰ τὴν ἐξουσίαν ἣν ⸂ὁ κύριος ἔδωκέν μοι⸃, εἰς οἰκοδομὴν καὶ οὐκ εἰς καθαίρεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/010.yaml
  text: For this reason I write these things while absent[a], so that when present I may not have to act harshly[b], according to the authority that the Lord gave me for building up and not for tearing down.
translation:
  language: ar
  text: لهذا أكتب هذه الأمور وأنا غائب، لكي لا أتعامل بشدة[a]، حين أكون حاضرًا، بحسب السلطان الذي أعطاني إياه الرب، للبنيان لا للهدم.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لكي لا أستعمل الشدة»، أو: «لكي لا أتصرف بحدّة».'
    reason: lexical_alternative
  - marker: b
    text: 'أي: للتقوية لا للتدمير. يستعمل الأصل اليوناني صورة البناء: «للبنيان لا للهدم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: لهذا
  rationale: أداة ربط سببية موجزة وطبيعية، تصل القول بالسياق السابق.
- source_word: ταῦτα
  choice: هذه الأمور
  rationale: تحافظ على جمع اسم الإشارة وتشير طبيعيًا إلى ما كتبه بولس أو إلى التحذيرات السابقة.
- source_word: ἀπὼν ... παρὼν
  choice: وأنا غائب ... حين أكون حاضرًا
  rationale: تحافظ على التقابل الصريح بين الغياب والحضور، مع صياغة عربية سلسة.
- source_word: μὴ ἀποτόμως χρήσωμαι
  choice: لكيلا أضطر ... إلى أن أتعامل بصرامة
  rationale: ينقل الظرف ἀποτόμως معنى الشدة أو الحزم القاسي، ويجعل دلالة الاستعمال الضمنية مفهومة بالعربية من غير تحويلها إلى عقوبة محددة.
- source_word: κατὰ τὴν ἐξουσίαν
  choice: بحسب السلطان
  rationale: تفيد «بحسب» الموافقة للسلطان الممنوح أو العمل بمقتضاه، و«السلطان» مقابل كتابي واضح لـἐξουσία.
- source_word: ὁ κύριος ἔδωκέν μοι
  choice: الذي أعطاني إياه الرب
  rationale: يحافظ على لقب «الرب» من غير تعيين إضافي لا يصرح به النص، وينقل العطاء بصيغة الماضي.
- source_word: εἰς οἰκοδομὴν καὶ οὐκ εἰς καθαίρεσιν
  choice: للبنيان لا للهدم
  rationale: يحافظ على استعارة البناء وعلى التضاد المتوازن بين الإنشاء والهدم.
theological_decisions:
- issue: مرجع لقب ὁ κύριος
  choice: الرب
  alternative: تعيينه صراحة بأنه الرب يسوع أو استعمال تعبير إلهي أعم
  rationale: النص يقول «الرب» فقط؛ لذلك يُحفظ اللقب كما هو دون حسم مرجعه بما يتجاوز هذه الآية.
- issue: غاية السلطان الرسولي
  choice: للبنيان لا للهدم
  alternative: للتقوية لا للتدمير
  rationale: تحفظ الصياغة المجاز المعماري والتوتر بين إمكان استعمال السلطان بصرامة وبين غايته المعلنة في البناء.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. اختيرت «أتعامل بصرامة» لسهولة الفهم، مع إثبات البدائل في الحاشية، وحُفظت استعارة البناء الموجزة في خاتمة الآية.
