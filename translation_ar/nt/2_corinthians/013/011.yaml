source:
  edition: SBLGNT
  text: Λοιπόν, ἀδελφοί, χαίρετε, καταρτίζεσθε, παρακαλεῖσθε, τὸ αὐτὸ φρονεῖτε, εἰρηνεύετε, καὶ ὁ θεὸς τῆς ἀγάπης καὶ εἰρήνης ἔσται μεθ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/011.yaml
  text: Finally[a], brothers, rejoice, be restored, be encouraged, think the same thing, live in peace[e][d][c][b], and the God of love and peace will be with you.
translation:
  language: ar
  text: وأخيرًا[a]، أيها الإخوة[b]، افرحوا، وأصلحوا أحوالكم[c]، وتشجَّعوا[d]، وكونوا على فكر واحد[e]، وعيشوا في سلام، وإله المحبة والسلام سيكون معكم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وداعًا»؛ فقد تُستعمل الكلمة اليونانية تحيةً ختامية، لكن ورودها ضمن سلسلة من الوصايا يرجّح معنى «افرحوا».'
    reason: lexical_alternative
  - marker: b
    text: النداء «الإخوة» بصيغة المذكر في اليونانية، ويخاطب الجماعة، ويشمل على الأرجح الرجال والنساء.
    reason: cultural_note
  - marker: c
    text: 'أو: «استكملوا» أو «أُصلحوا» أو «رتِّبوا أحوالكم».'
    reason: lexical_alternative
  - marker: d
    text: 'أو: «اقبلوا التشجيع والحث».'
    reason: lexical_alternative
  - marker: e
    text: 'حرفيًا: «فكّروا الشيء نفسه»، أي كونوا متحدين في الفكر.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Λοιπόν
  choice: وأخيرًا
  rationale: علامة خطابية تنقل الرسالة إلى خاتمتها، و«وأخيرًا» تعبير عربي طبيعي وواضح.
- source_word: ἀδελφοί
  choice: أيها الإخوة
  rationale: يحفظ صيغة الجمع المذكر في اليونانية، مع بيان شمول الخطاب لجماعة المؤمنين في الحاشية.
- source_word: χαίρετε
  choice: افرحوا
  rationale: 'مع أن اللفظة قد تستعمل للتحية الختامية بمعنى «وداعًا»، فإن وقوعها ضمن سلسلة من الأوامر يرجح معناها الحثي: «افرحوا».'
- source_word: καταρτίζεσθε
  choice: تقوَّموا
  rationale: يفيد الفعل بلوغ الحال السليمة بالإصلاح أو الاستكمال. و«تقوَّموا» يلائم سياق إصلاح أحوال الجماعة ويحافظ على احتمال الصيغة الوسطى، من غير إيحاء بالكمال المطلق.
- source_word: παρακαλεῖσθε
  choice: تشجَّعوا
  rationale: الصيغة تحتمل تلقي التشجيع أو قبول الحث؛ و«تشجَّعوا» عربية موجزة وطبيعية، مع إبقاء البديل في الحاشية.
- source_word: τὸ αὐτὸ φρονεῖτε
  choice: كونوا على فكر واحد
  rationale: ينقل المعنى الحرفي، «فكروا الشيء نفسه»، إلى تعبير عربي مفهوم يحفظ التشديد على وحدة الفكر.
- source_word: εἰρηνεύετε
  choice: عيشوا بسلام
  rationale: يعبر عن السلوك المستمر في السلام الذي يدل عليه الأمر المضارع في سياق الجماعة.
- source_word: ὁ θεὸς τῆς ἀγάπης καὶ εἰρήνης
  choice: إله المحبة والسلام
  rationale: نقل مباشر وطبيعي للتركيب الإضافي اليوناني، من دون توسيع تفسيري.
- source_word: ἔσται μεθ’ ὑμῶν
  choice: سيكون معكم
  rationale: ينقل صيغة المستقبل البسيطة بصياغة عربية معاصرة واضحة.
theological_decisions:
- issue: شمول ἀδελφοί للرجال والنساء في خطاب الجماعة
  choice: «أيها الإخوة» في المتن
  alternative: «أيها الإخوة والأخوات»
  rationale: يحفظ المتن الصيغة المذكرة في الأصل، بينما توضح الحاشية أن النداء الجماعي يشمل على الأرجح رجال الكنيسة ونساءها.
- issue: دلالة καταρτίζεσθε بين الإصلاح والاستكمال
  choice: «تقوَّموا»
  alternative: «استكملوا» أو «أُصلحوا»
  rationale: يحافظ الاختيار على صورة إعادة الجماعة إلى الحال السليمة، ويتجنب تفسير اللفظة على أنها مطالبة بكمال مطلق.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت أفعال أمر متوازية للمحافظة على إيقاع سلسلة الوصايا في الأصل. و«أيها الإخوة» خطاب جماعي يشمل في هذا السياق على الأرجح الرجال والنساء، دون إثقال المتن بحاشية ثقافية إضافية.
