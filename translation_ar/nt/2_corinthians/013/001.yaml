  source_fidelity: المعنى العام محفوظ، ولا سيما الإشارة إلى الزيارة الثالثة والاستشهاد بالمبدأ القانوني. لكن «كل دعوى» أضيق من πᾶν ῥῆμα، التي تُستعمل هنا في الاقتباس بمعنى كل أمر/مسألة، لا دعوى بالضرورة. كما أن «تثبت كل دعوى» يمكن أن تُقرأ مبنيًا للمعلوم؛ والأصل فعل مستقبل مبني للمجهول.
