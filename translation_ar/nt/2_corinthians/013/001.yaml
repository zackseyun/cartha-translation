  text: Τρίτον τοῦτο ἔρχομαι πρὸς ὑμᾶς· ἐπὶ στόματος δύο μαρτύρων καὶ τριῶν σταθήσεται πᾶν ῥῆμα.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/001.yaml
  text: 'This is the third time I am coming to you: “Every matter will be established by the testimony of two witnesses or three.”[a][b]'
translation:
  language: ar
  text: 'هذه هي المرة الثالثة التي آتي فيها إليكم: «تُثبَت كل مسألة بشهادة شاهدين أو ثلاثة».[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بفم شاهدين أو ثلاثة تُثبَت كل كلمة». يتبع النص اليوناني صياغة تثنية 19:15 عن كثب، مستعملًا تعبيرًا قانونيًا.'
    reason: lexical_alternative
  - marker: b
    text: إشارة إلى تثنية 19:15.
    reason: cross_reference
lexical_decisions:
- source_word: Τρίτον τοῦτο
  choice: هذه هي المرة الثالثة
  rationale: العبارة في حالة النصب وتؤدي وظيفة ظرفية مع الفعل، فتدل على أن هذه هي المرة الثالثة لمجيء بولس؛ وهذه الصياغة عربية واضحة وطبيعية.
- source_word: ἔρχομαι πρὸς ὑμᾶς
  choice: آتي فيها إليكم
  rationale: يحافظ المضارع على مباشرة إعلان بولس عن مجيئه، ويستقيم عربيًا مع عبارة «المرة الثالثة».
- source_word: ἐπὶ στόματος
  choice: على شهادة
  rationale: تعبير قانوني سامي وارد في صيغة الاقتباس من تثنية 19:15؛ تنقل «شهادة» معناه القضائي بوضوح، مع إبقاء «على» أثرًا لبنية التعبير الأصلي.
- source_word: δύο μαρτύρων καὶ τριῶν
  choice: شاهدين أو ثلاثة
  rationale: المقصود في الصيغة القانونية شاهدان أو ثلاثة، لا جمع العددين؛ واستعمال «أو» يبيّن المعنى التوزيعي الذي تؤديه العبارة المأثورة.
- source_word: σταθήσεται
  choice: تثبت
  rationale: الفعل المستقبل المبني للمجهول من ἵστημι يحمل في السياق القانوني معنى الإثبات أو الإقرار؛ والمضارع العربي هنا صالح للحكم العام الذي يورده الاقتباس.
- source_word: πᾶν ῥῆμα
  choice: كل دعوى
  rationale: يمكن أن تعني ῥῆμα «كلمة» أو «قولًا»، لكنها في هذا السياق القانوني تشير إلى أمر معروض للإثبات. «دعوى» تُظهر القوة القضائية من غير حصرها في تهمة بعينها، وتُذكر القراءة الحرفية في الحاشية.
theological_decisions:
- issue: مدى تطبيق الاقتباس القانوني من سفر التثنية في سياق تأديب بولس
  choice: صياغة الاقتباس كمبدأ قانوني عام يتعلق بإثبات كل دعوى، من غير قصره صراحة على التأديب الكنسي
  alternative: ترجمة πᾶν ῥῆμα ترجمة حرفية «كل كلمة»، أو تضييقها إلى «كل تهمة»
  rationale: يستشهد بولس بمبدأ كتابي قانوني، والنص اليوناني لا يصرح هنا بحصره في مجال كنسي مخصوص؛ لذلك تحافظ الترجمة على عمومه وعلى توتر السياق من غير إضافة تفسير مذهبي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «دعوى» لإبراز السياق القانوني، مع حفظ الصياغة الحرفية البديلة في الحاشية، وأُبقي ترتيب «شاهدين أو ثلاثة» قريبًا من العبارة اليونانية المقتبسة.
