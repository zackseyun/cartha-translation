  text: 'For we rejoice when we are weak and you are strong[a]. And this also is what we pray for: your restoration.'
translation:
  language: ar
  text: 'لأننا نفرح حين نكون نحن ضعفاء وأنتم أقوياء. وهذا أيضًا ما نصلّي لأجله: إصلاح حالكم[a].'
  philosophy: optimal-equivalence
