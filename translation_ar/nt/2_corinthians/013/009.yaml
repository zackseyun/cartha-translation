    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρομεν
  choice: نفرح
  rationale: ينقل دلالة الفعل المضارع على موقف بولس الحاضر، ويحفظ قوة المعنى الإيجابي بصورة طبيعية في العربية.
- source_word: γὰρ
  choice: لأننا
  rationale: يحفظ الصلة التفسيرية بما سبق، وقد أُدمجت الأداة في «لأننا» لصياغة عربية سلسة.
- source_word: ὅταν
  choice: حين
  rationale: مع صيغة الاحتمال في اليونانية يفيد زمنًا عامًا أو متكررًا؛ و«حين» واضحة وطبيعية من غير مبالغة في تحديد التكرار.
- source_word: ἀσθενῶμεν
  choice: نكون نحن ضعفاء
  rationale: يحفظ المعنى الواسع للضعف، سواء أكان ظاهرًا أم اجتماعيًا أم متعلقًا بالحضور الرسولي، من غير حصره في العجز الجسدي.
- source_word: δυνατοὶ
  choice: أقوياء
  rationale: يقابل «ضعفاء» مباشرة ويحفظ التضاد البلاغي في النص.
- source_word: τοῦτο καὶ εὐχόμεθα
  choice: وهذا أيضًا ما نصلّي من أجله
  rationale: ينقل معنى الصلاة في السياق ويحفظ إبراز «هذا» مع صياغة عربية طبيعية.
- source_word: κατάρτισιν
  choice: أن تستقيم حالكم
  rationale: يعبّر عن ردّ الشيء إلى حاله السليمة أو تهيئته وإكماله، ويلائم مقصد بولس الرعوي من غير إدخال مفهوم تقني للكمال.
theological_decisions:
- issue: دلالة κατάρτισις في مقصد بولس الرعوي
  choice: أن تستقيم حالكم
  alternative: نضجكم؛ أو اكتمالكم؛ أو إصلاح حالكم
  rationale: الصياغة المختارة تنقل معنى بلوغ الحالة السليمة أو الملائمة، وتناسب سياق التقويم والاسترداد، مع إبقاء إمكان دلالة اللفظة على النضج أو الإكمال في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. حُفظ توكيد الضميرين في مقابلة «نحن» و«أنتم». ينبغي إلحاق علامة الحاشية [b] بعد «أن تستقيم حالكم» في النص لضمان مطابقة جميع الحواشي.
