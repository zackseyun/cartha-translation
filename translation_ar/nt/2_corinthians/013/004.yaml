  to: فإنه قد صُلِب في ضعف[a]، لكنه يحيا بقوة الله[b]. ونحن أيضًا ضعفاء فيه، لكننا سنحيا معه[c] بقوة الله نحوكم[d].
  rationale: اقتصر التعديل على «من جهتكم» ← «نحوكم» لتمثيل اتجاه εἰς ὑμᾶς تمثيلًا أدق وأطبع في العربية. وأُبقيت بقية الصياغة والحواشي لأنها تحفظ مفارقة الضعف والقوة، وتكرار ألفاظ الحياة، واتساع مرجع «سنحيا معه» بلا فرض تفسير مذهبي.
