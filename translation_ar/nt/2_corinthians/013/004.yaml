source:
  edition: SBLGNT
  text: καὶ ⸀γὰρ ἐσταυρώθη ἐξ ἀσθενείας, ἀλλὰ ζῇ ἐκ δυνάμεως θεοῦ. καὶ γὰρ ἡμεῖς ἀσθενοῦμεν ἐν αὐτῷ, ἀλλὰ ⸀ζήσομεν σὺν αὐτῷ ἐκ δυνάμεως θεοῦ εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/004.yaml
  text: For indeed he was crucified in weakness[a], but he lives by the power of God. For indeed we are weak in him[d][c][b], but we will live with him by the power of God toward you.
translation:
  language: ar
  text: فإنه قد صُلِب في ضعف[a]، لكنه يحيا بقوة الله[b]. ونحن أيضًا ضعفاء فيه، لكننا سنحيا معه[c] بقوة الله نحوكم[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «من ضعف». تستعمل اليونانية ἐξ، وهي تدل حرفيًا أكثر على المصدر أو الأساس.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «من قوة الله». تكرر اليونانية حرف الجر ἐκ لتقيم مقابلة مقصودة بين الضعف وقوة الله؛ وينطبق ذلك أيضًا على العبارة الثانية «بقوة الله».'
    reason: lexical_alternative
  - marker: c
    text: قد تشير عبارة «سنحيا معه» إلى ظهور حياة بولس وقوته المستمدتين من المسيح في تعامله المقبل مع الكورنثيين، وقد تحمل أيضًا صدى أوسع لحياة القيامة.
    reason: alternative_reading
  - marker: d
    text: 'أو: «لأجلكم» أو «بينكم». العبارة اليونانية εἰς ὑμᾶς موجزة، وقد تدل على التوجّه أو العلاقة أو الأثر.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσταυρώθη
  choice: صُلِب
  rationale: يحافظ المبني للمجهول على صيغة الفعل اليوناني، وهو التعبير العربي الدقيق والمألوف للصلب.
- source_word: ἐξ ἀσθενείας
  choice: في ضعف
  rationale: تعبير عربي طبيعي يصون مفارقة الضعف والقوة، مع بيان الدلالة الأقرب إلى المصدر أو الأساس لحرف ἐξ في الحاشية.
- source_word: ζῇ
  choice: يحيا
  rationale: ينقل المضارع ودلالته الفعلية المستمرة، بدل الاكتفاء بوصفه بأنه حي.
- source_word: ἐκ δυνάμεως θεοῦ
  choice: بقوة الله
  rationale: صياغة عربية واضحة وطبيعية تُظهر أن قوة الله هي مصدر الحياة وفاعليتها؛ والحاشية تحفظ التوازي اللفظي مع ἐξ ἀσθενείας.
- source_word: ἀσθενοῦμεν
  choice: ضعفاء
  rationale: يحافظ على الصلة المعجمية بلفظ «ضعف» في صدر الآية من غير إضافة معنى العجز المطلق أو الهوان.
- source_word: ἐν αὐτῷ
  choice: فيه
  rationale: يحفظ عبارة بولس الموجزة الدالة على الارتباط بالمسيح من غير تفسير زائد.
- source_word: ζήσομεν
  choice: سنحيا
  rationale: يحافظ على صيغة المستقبل، ويترك مرجع الحياة مفتوحًا بحسب السياق.
- source_word: σὺν αὐτῷ
  choice: معه
  rationale: ينقل بوضوح معنى المصاحبة والمشاركة الذي تؤديه σύν.
- source_word: εἰς ὑμᾶς
  choice: من جهتكم
  rationale: صياغة عربية موجزة تحتمل العلاقة والتوجّه والأثر في المخاطَبين، من غير حصر المعنى في «لأجلكم» أو «بينكم».
theological_decisions:
- issue: معنى ضعف المسيح في الصلب
  choice: أُبقيت العبارة «في ضعف» لتعرض مفارقة الصلب في الضعف والحياة بقوة الله دون تفسير عقائدي زائد.
  alternative: «بسبب ضعف» أو «من ضعف»، وقد يوحيان في العربية بعلّة مباشرة أو نقص ذاتي لا يقتضيه النص.
  rationale: النص يقابل الضعف بالقوة ولا يشرح هنا طبيعة ذلك الضعف؛ لذلك تحافظ الصياغة على التوتر اللاهوتي من غير أن تنفي ألوهية المسيح أو عصمته من الخطية، ومن غير أن تضيف هذا التفسير إلى المتن.
- issue: مرجع «سنحيا معه»
  choice: تُركت العبارة واسعة بحيث يمكن أن تشير إلى حياة بولس الرسولية بقوة المسيح تجاه الكورنثيين، مع بقائها منفتحة على صدى حياة القيامة.
  alternative: قصرها إما على القيامة الأخيرة وحدها وإما على ممارسة السلطان الرسولي الحاضر وحدها.
  rationale: السياق المباشر، ولا سيما εἰς ὑμᾶς، يتصل بعلاقة بولس بالكورنثيين، لكن لغة الحياة مع المسيح أوسع؛ لذا لم يُحسم الاحتمال في الترجمة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «يحيا» و«سنحيا» للمحافظة على تكرار جذر الحياة، و«ضعفاء» للربط بلفظ «ضعف». رُوعي الإيجاز البولسي والتوازي بين الضعف وقوة الله من غير جعل العربية متكلفة.
