  source_fidelity: 'الترجمة أمينة عمومًا للبناء اليوناني: المبني للمجهول في «صُلِب»، والمضارع في «يحيا»، والمستقبل في «سنحيا»، وعبارتا الارتباط «فيه/معه» محفوظة. كما أن «في ضعف» و«بقوة الله» صيغتان عربيتان سليمتان في هذا السياق، مع حفظ البديل الحرفي في الحواشي.'
  naturalness: الأسلوب فصيح واضح ومناسب للسجل الكتابي المعاصر. غير أن «من جهتكم» في ختام الآية توحي في العربية بأن الأمر صادر من جهتهم أو متعلق بموقفهم، ولا تؤدي الاتجاه المقصود في εἰς ὑμᾶς بوضوح. «نحوكم» أوجز وأقرب إلى الدلالة الاتجاهية، مع بقاء العبارة غير مفسَّرة أكثر من اللازم.
  terminology: مصطلحات «صُلِب»، «ضعف»، «قوة الله»، و«يحيا/سنحيا» دقيقة ومتسقة، ولا تحمل تقريرًا لاهوتيًا زائدًا. ينبغي فقط تعديل المقابل الأخير إلى «نحوكم».
