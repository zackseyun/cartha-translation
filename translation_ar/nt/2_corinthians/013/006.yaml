  rationale: تفيد الأداة انتقالًا ذا مسحة تقابل مع القلق الوارد في السياق السابق، و«لكن» تؤدي ذلك طبيعيًا، مع إلحاق ضمير المتكلم بالفعل في العربية.
- source_word: γνώσεσθε
  choice: أن تعرفوا
  rationale: ينقل المستقبل اليوناني معرفةً ستتحقق لدى المخاطَبين؛ وبعد «أرجو» تأتي «أن» مع المضارع في العربية بصياغة طبيعية، مع بقاء الدلالة المستقبلية مفهومة من السياق.
- source_word: ὅτι
  choice: أن
  rationale: تدخل على جملة المضمون في العربية بوضوح وطبيعية.
- source_word: ἡμεῖς
  choice: نا في «أننا»
  rationale: يحفظ ضمير الجمع الصريح الدال على بولس ورفقائه من غير إضافة توكيد غير موجود في النص.
- source_word: οὐκ ἐσμὲν
  choice: لسنا
  rationale: مقابل عربي مباشر وطبيعي لفعل الكينونة المنفي، من غير تشديد زائد للنفي.
- source_word: ἀδόκιμοι
  choice: مرفوضين بعد الاختبار
  rationale: يعبّر بوضوح عن عدم نيل القبول عند الفحص، وهو المعنى المناسب لسياق الامتحان والإثبات. وإضافة «بعد الاختبار» توضّح الصورة التقويمية الكامنة في اللفظ من غير تحميله معنى عقائديًا اصطلاحيًا.
theological_decisions:
- issue: دلالة ἀδόκιμοι في سياق الامتحان وإثبات أهلية بولس ورفقائه
  choice: لسنا مرفوضين بعد الاختبار
  alternative: لسنا غير مقبولين؛ لسنا راسبين في الاختبار؛ لسنا غير مؤهَّلين
  rationale: تحفظ الصياغة صورة الفحص الذي يعقبه القبول أو الرفض، وتتجنب لفظًا مثل «هالكين» أو «مرذولين» قد يوحي بحكم عقائدي أوسع مما يقوله السياق. كما لا تحسم هل المقصود الأهلية الرسولية وحدها أم ثبوت النجاح في الامتحان بمعناه الأوسع.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُخدمت صياغة «مرفوضين بعد الاختبار» لإبقاء استعارة الامتحان ظاهرة للقارئ، ووُضعت البدائل المعجمية في الحاشية حفاظًا على مجال الدلالة.
