    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: سَلِّموا
  rationale: فعل أمر موجَّه إلى جماعة، و«سلِّموا» هو المقابل العربي الطبيعي في سياق التحية المتبادلة.
- source_word: ἀλλήλους
  choice: بعضكم على بعض
  rationale: تعبير عربي فصيح واضح يحفظ دلالة الضمير التبادلي على الفعل المتبادل داخل الجماعة.
- source_word: ἐν ἁγίῳ φιλήματι
  choice: بقبلة مقدسة
  rationale: استُعملت الباء استعمالًا أداتيًا طبيعيًا في العربية مقابل ἐν في صيغة التحية، مع إبقاء المعنى الصريح لكل من ἁγίῳ وφιλήματι.
- source_word: ἀσπάζονται ὑμᾶς
  choice: يُسلِّم عليكم
  rationale: هذه هي الصياغة العربية الاصطلاحية للتحية المرسلة في ختام الرسائل، وتحفظ كون المخاطَبين جمعًا.
- source_word: οἱ ἅγιοι πάντες
  choice: جميع القديسين
  rationale: «القديسون» مقابل راسخ لـἅγιοι في الاستعمال البولسي، و«جميع» تنقل πάντες من غير حصر المصطلح في فئة كنسية منتقاة.
theological_decisions:
- issue: دلالة ἅγιοι في خطاب بولس الجماعي
  choice: القديسين
  alternative: المقدسين؛ شعب الله المقدس
  rationale: يحفظ الاختيار المصطلح البولسي الذي يصف المؤمنين بوصفهم شعبًا مكرسًا لله، مع إيضاح أنه لا يعني هنا فئة محدودة ممن أُعلن تقديسهم لاحقًا.
- issue: طبيعة القبلة الموصوفة بأنها ἁγίῳ
  choice: قبلة مقدسة
  alternative: قبلة طاهرة؛ قبلة مكرسة
  rationale: يبقي الوصف المباشر وغموض مدى كونه وصفًا لقداسة التحية أو لطهارتها، من غير تحويل العبارة إلى ممارسة طائفية محددة.
