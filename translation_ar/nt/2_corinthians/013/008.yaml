  yaml_path: translation/nt/2_corinthians/013/008.yaml
  text: For we are not able to do anything against the truth[a], but for the truth.
translation:
  language: ar
  text: لأننا لا نقدر أن نفعل شيئًا ضد الحق، بل لأجل الحق.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لأننا لا نستطيع أن نفعل شيئًا لمقاومة الحق، بل لتأييد الحق».'
    reason: بديل معجمي يوضح أن ὑπέρ قد تحمل معنى التأييد أو العمل لمصلحة الحق، في مقابل κατά الدالة على المعارضة.
lexical_decisions:
- source_word: οὐ γὰρ
  choice: لأننا لا
  rationale: تفيد γάρ تعليل الكلام السابق، و«لأن» أداة ربط عربية طبيعية وموجزة، بينما تنفي «لا» القدرة المذكورة في الفعل.
- source_word: δυνάμεθά
  choice: نقدر
  rationale: يفيد الفعل معنى القدرة أو الاستطاعة، و«لا نقدر» تعبير عربي واضح يحافظ على الدلالة الفعلية.
- source_word: τι
  choice: شيئًا
  rationale: جاءت النكرة في سياق النفي، فتفيد العموم، ولذلك تؤدي «شيئًا» المعنى بدقة.
- source_word: κατὰ τῆς ἀληθείας
  choice: ضد الحق
  rationale: تفيد κατά مع المضاف إليه هنا المعارضة، وتحافظ «ضد الحق» على الإيجاز وعلى تعريف ἀλήθεια في اليونانية.
- source_word: ἀλλὰ
  choice: بل
  rationale: تفيد ἀλλά مقابلة قوية بعد النفي، و«بل» أنسب عربيًا في هذا التركيب التصحيحي المتوازن.
- source_word: ὑπὲρ τῆς ἀληθείας
  choice: لأجل الحق
  rationale: تفيد ὑπέρ هنا العمل لمصلحة الحق أو تأييدًا له. وتحافظ «لأجل الحق» على المقابلة الموجزة مع «ضد الحق»، من غير إضافة «فقط» غير الموجودة في النص اليوناني.
theological_decisions:
- issue: مدلول «الحق» في المقابلة البلاغية
  choice: الإبقاء على «الحق» من غير قصره على صيغة عقائدية محددة
  alternative: حق الإنجيل؛ أو ما هو حق
  rationale: صياغة بولس أوسع من شعار عقائدي بعينه، وإن كان السياق يشمل حق الإنجيل وواقع الله. والإبقاء على «الحق» يصون الاتساع اللاهوتي والتوتر البلاغي من غير تضييق لا يصرح به النص.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُعملت «بل» لإبراز المقابلة بعد النفي، ولم تُضف كلمة «فقط» لأنها غير مذكورة صراحة في اليونانية.
