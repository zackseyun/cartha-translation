translation:
  language: ar
  text: إذ إنكم تطلبون برهانًا على أن المسيح يتكلّم فيَّ[a]؛ فهو ليس ضعيفًا تجاهكم، بل قويّ فيكم[b]،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يتكلّم من خلالي». واليونانية حرفيًا أقرب إلى «يتكلّم فيَّ».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «قويّ بينكم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ
  choice: إذ إنكم
  rationale: تؤدي المعنى السببي الذي يربط العبارة بالسياق السابق، بصياغة عربية واضحة وطبيعية.
- source_word: δοκιμὴν
  choice: برهانًا
  rationale: المقصود هنا ما يثبت صحة دعوى بولس، لا عملية الاختبار نفسها.
- source_word: ζητεῖτε
  choice: تطلبون
  rationale: يحافظ المضارع على معنى الطلب القائم والمستمر، ويتلاءم طبيعيًا مع «برهانًا».
- source_word: τοῦ ἐν ἐμοὶ λαλοῦντος Χριστοῦ
  choice: على أن المسيح يتكلّم فيَّ
  rationale: صيغ التركيب الإضافي اليوناني في العربية جملةَ مضمون بعد «برهان»، مع إبقاء ἐν ἐμοί بصورته المباشرة «فيَّ» وعدم حسم احتمال معنى الوساطة.
- source_word: Χριστοῦ
  choice: المسيح
  rationale: «المسيح» هو المقابل العربي الراسخ للقب Χριστός ويحفظ دلالته المسيانية.
- source_word: εἰς ὑμᾶς
  choice: تجاهكم
  rationale: ينقل معنى الاتجاه أو العلاقة المقصود في السياق، من غير إضافة تفسير غير مصرّح به.
- source_word: οὐκ ἀσθενεῖ
  choice: ليس ضعيفًا
  rationale: يحفظ لفظ الضعف والتقابل المقصود مع القوة في هذه الآية وفي السياق الأوسع.
- source_word: ἀλλὰ δυνατεῖ
  choice: بل قويّ
  rationale: صياغة عربية موجزة وطبيعية تحفظ التقابل المباشر بين الضعف والقوة.
- source_word: ἐν ὑμῖν
  choice: فيكم
  rationale: ينقل حرف الجر اليوناني مباشرة ويحفظ إمكان فهم القوة عاملة في المخاطَبين، مع إثبات القراءة الجماعية «بينكم» في الحاشية.
theological_decisions:
- issue: دلالة ἐν ἐμοί على حضور المسيح أو عمله بوساطة بولس
  choice: المسيح يتكلّم فيَّ
  alternative: المسيح يتكلّم من خلالي
  rationale: أُبقيت الصياغة الأقرب إلى حرف الجر اليوناني في المتن، وأُثبت احتمال الوساطة في الحاشية كي لا يُحسم التوتر الدلالي بلا ضرورة.
- issue: دلالة ἐν ὑμῖν الفردية أو الجماعية
  choice: قويّ فيكم
  alternative: قويّ بينكم
  rationale: «فيكم» أقرب إلى ظاهر اليونانية، لكن المخاطَبين جماعة وقد يدل التعبير على عمل المسيح في وسطهم؛ لذلك حُفظ البديل في الحاشية.
- issue: ترجمة Χριστός
  choice: المسيح
  alternative: لا بديل اصطلاحي لازم في العربية
  rationale: اللفظ العربي المألوف يحفظ معنى اللقب المسياني ويتناسب مع الأسلوب الرسولي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة، مع الحفاظ على تقابل «ضعيفًا/قويّ» وعلى غموض حرف الجر في العبارتين دون تحميل النص تفسيرًا مذهبيًا.
