base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/013.yaml
  text: The grace of the Lord Jesus Christ[a], and the love of God, and the fellowship of the Holy Spirit[b], be with all of you.
translation:
  language: ar
  text: نِعْمَةُ الرَّبِّ يَسُوعَ الْمَسِيحِ، وَمَحَبَّةُ اللهِ، وَشَرِكَةُ الرُّوحِ الْقُدُسِ[b]، مَعَكُمْ جَمِيعًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'يمكن أيضًا: «الشركة مع الروح القدس» أو «المشاركة في الروح القدس».'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: نِعْمَة
  rationale: اللفظ العربي المألوف في بركات بولس، ويحفظ معنى العطاء الإلهي المتفضل ووزنه اللاهوتي.
- source_word: κυρίου
  choice: الرَّبّ
  rationale: يناسب استعمال κύριος لقبًا ليسوع في هذا السياق، وهو المقابل العربي الطبيعي الراسخ.
- source_word: Ἰησοῦ Χριστοῦ
  choice: يَسُوعَ الْمَسِيحِ
  rationale: نُقل الاسم Ἰησοῦ بصيغته العربية المعروفة، وتُرجم اللقب Χριστοῦ إلى «المسيح» بدل معاملته كاسم عائلة.
- source_word: ἀγάπη
  choice: مَحَبَّة
  rationale: مقابل عربي طبيعي يحفظ المعنى العلائقي في صيغة البركة.
- source_word: θεοῦ
  choice: اللهِ
  rationale: تحفظ الإضافة «محبة الله» من غير أن تحدد في المتن هل المقصود محبة الله للناس أو معنى آخر متعلق به.
- source_word: κοινωνία
  choice: شَرِكَة
  rationale: تحفظ اتساع اللفظ بين الشركة والمشاركة والاتحاد، وتلائم الصياغة الكنسية العربية من غير حصر المعنى في تفسير واحد.
- source_word: ἁγίου πνεύματος
  choice: الرُّوحِ الْقُدُسِ
  rationale: الصيغة العربية المعاصرة الراسخة لاسم الروح الإلهي المذكور في النص.
- source_word: μετὰ πάντων ὑμῶν
  choice: مَعَكُمْ جَمِيعًا
  rationale: تعكس معنى المصاحبة في μετά وتحافظ صراحةً على شمول πάντων لجميع المخاطَبين.
theological_decisions:
- issue: دلالة Χριστοῦ في لقب يسوع
  choice: المسيح
  alternative: خريستوس
  rationale: Χριστός لقب معناه «الممسوح»، و«المسيح» هو المقابل العربي الدلالي والراسخ؛ تذكر الحاشية اللفظ اليوناني المنقول لبيان أصل اللقب، إذ لا يوجد في العربية فرق طبيعي مماثل للفرق الإنجليزي بين Messiah وChrist.
- issue: معنى κοινωνία τοῦ ἁγίου πνεύματος
  choice: شركة الروح القدس
  alternative: الشركة مع الروح القدس؛ أو المشاركة في الروح القدس
  rationale: الإضافة اليونانية تحتمل علاقةً يهبها الروح أو شركةً معه أو مشاركةً فيه. تحافظ الصياغة المختارة على هذا الاتساع، وتعرض الحاشية أبرز الاحتمالات من غير حسم ما تركه الأصل مفتوحًا.
translation_notes:
  register: فصحى معاصرة واضحة ذات نبرة وقورة تناسب صيغة البركة. استُعمل التشكيل الجزئي لتيسير القراءة وضبط علاقات الإضافة، وحُفظ التوازي الثلاثي في العبارة اليونانية.
