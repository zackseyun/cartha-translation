  text: Ἑαυτοὺς πειράζετε εἰ ἐστὲ ἐν τῇ πίστει, ἑαυτοὺς δοκιμάζετε· ἢ οὐκ ἐπιγινώσκετε ἑαυτοὺς ὅτι ⸂Ἰησοῦς Χριστὸς⸃ ἐν ⸀ὑμῖν; εἰ μήτι ἀδόκιμοί ἐστε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/005.yaml
  text: Test yourselves to see whether you are in the faith[a]; examine yourselves[c][b]. Or do you not recognize that Jesus the Messiah is in you?—unless indeed you are disqualified.
translation:
  language: ar
  text: اختبروا أنفسكم لتروا هل أنتم في الإيمان[a]؛ وافحصوا أنفسكم. أما تعرفون عن أنفسكم أن يسوع المسيح فيكم[b]؟ إلا إذا كنتم غير مجتازين للاختبار.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: قد تشير عبارة «في الإيمان» إلى الثبات ضمن الإيمان المسيحي أو إلى امتلاك إيمان حقيقي.
    reason: lexical_alternative
  - marker: b
    text: 'أو: «بينكم».'
    reason: alternative_reading
lexical_decisions:
- source_word: πειράζετε
  choice: اختبروا
  rationale: يفيد هنا امتحان الذات للتحقق من حقيقتها، لا التجربة بمعنى الإغراء.
- source_word: ἐν τῇ πίστει
  choice: في الإيمان
  rationale: يحافظ على صياغة اليونانية وعلى احتمال الإشارة إلى مجال الإيمان المسيحي أو إلى حقيقة الإيمان الشخصي.
- source_word: δοκιμάζετε
  choice: افحصوا
  rationale: يميّزه عن الفعل السابق مع إبقاء معنى التمحيص لمعرفة ما يثبت عند الاختبار.
- source_word: ἐπιγινώσκετε
  choice: تدركون
  rationale: يلائم السؤال البلاغي ويفيد المعرفة الواعية أو التعرّف الواضح.
- source_word: Ἰησοῦς Χριστός
  choice: يسوع المسيح
  rationale: «المسيح» هو المقابل العربي الراسخ للقب Χριστός، ويحفظ دلالته المسيانية.
- source_word: ἐν ὑμῖν
  choice: فيكم
  rationale: السياق المباشر لفحص الذات يرجح الحضور في المخاطَبين، مع إمكان المعنى الجماعي «بينكم» المثبت في الحاشية.
- source_word: εἰ μήτι
  choice: إلا إن
  rationale: ينقل الاستثناء البلاغي بصورة عربية طبيعية من غير إثقال.
- source_word: ἀδόκιμοί
  choice: غير مجتازين للاختبار
  rationale: يحافظ على الصلة اللفظية بموضوع الاختبار وعلى معنى عدم ثبوت الأهلية، من دون إيحاءات عقدية زائدة قد يحملها «مرفوضون».
theological_decisions:
- issue: دلالة ἐν τῇ πίστει
  choice: في الإيمان
  alternative: ثابتون في الإيمان أو ذوو إيمان حقيقي
  rationale: تُبقي العبارة مفتوحة بين الانتماء إلى واقع الإيمان المسيحي وامتلاك الإيمان الأصيل، بدل حسم التوتر.
- issue: دلالة ἐν ὑμῖν
  choice: فيكم
  alternative: بينكم
  rationale: فحص كل شخص لنفسه يرجح معنى حضور المسيح فيهم، لكن صيغة الجمع تسمح أيضًا بدلالة جماعية، ولذلك ذُكرت في الحاشية.
- issue: دلالة ἀδόκιμοί
  choice: غير مجتازين للاختبار
  alternative: غير مقبولين أو مرفوضين
  rationale: الصياغة المختارة تُظهر التقابل مع الاختبار والفحص من غير استيراد مفهوم عقدي أشد مما يقوله النص.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. استُعمل فعلان متقاربان، «اختبروا» و«افحصوا»، لعكس التوازي مع التمييز الطفيف بين الفعلين اليونانيين، وحُفظت مواضع الالتباس الحقيقي في الحواشي.
