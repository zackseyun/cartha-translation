review_pass:
  verdict: revise
  source_fidelity: الترجمة دقيقة في الأفعال الأمرية المتوازية («اختبروا... وافحصوا»)، وفي «في الإيمان»، وفي الحضور «فيكم» مع حفظ البديل الجماعي في الحاشية. لكن «أم لستم تدركون أن...» لا تُظهر المفعول الانعكاسي ἑαυτούς («أنفسكم») في السؤال اليوناني. ويمكن نقله بوضوح من غير تكلّف بعبارة «أما تعرفون عن أنفسكم أن...».
  naturalness: الفصحى واضحة وطبيعية إجمالًا. واستبدال «إلا إن» بـ«إلا إذا» أيسر في الاستعمال المعاصر، مع بقاء النبرة البلاغية. و«غير مجتازين للاختبار» مفهوم، لكن «غير مقبولين في الاختبار» أقل سلاسة؛ لذلك يُحافَظ على العبارة الحالية.
  terminology: «الإيمان»، «يسوع المسيح»، «اختبروا»، و«افحصوا» اختيارات راسخة ومناسبة. لا يلزم فرض تفسير عقدي لعبارة «في الإيمان» أو «فيكم»، والحاشيتان تحفظان وجهي الالتباس ذوي الصلة.
  issues:
  - severity: medium
    issue: سقوط الإشارة الصريحة إلى «أنفسكم» في السؤال البلاغي.
    rationale: يتضمن النص ἐπιγινώσκετε ἑαυτούς، فلا يكفي في الترجمة العربية «تدركون أن يسوع المسيح فيكم»؛ إذ يحذف محور معرفة المخاطَبين لأنفسهم.
  - severity: low
    issue: «إلا إن» أقل شيوعًا من «إلا إذا» في الفصحى المعاصرة.
    rationale: كلاهما صحيح، لكن «إلا إذا» أوضح للقارئ المعاصر وينقل الاستثناء الشرطي في εἰ μήτι من دون تغيير المعنى.
