  text: προείρηκα καὶ προλέγω ὡς παρὼν τὸ δεύτερον καὶ ἀπὼν ⸀νῦν, τοῖς προημαρτηκόσιν καὶ τοῖς λοιποῖς πᾶσιν, ὅτι ἐὰν ἔλθω εἰς τὸ πάλιν οὐ φείσομαι,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/002.yaml
  text: I have said before[a], and I say beforehand now while absent, as when present the second time, to those who sinned previously and to all the rest, that if I come again, I will not spare them.
translation:
  language: ar
  text: 'سبق أن قلتُ، وأقول سلفًا الآن وأنا غائب، كما قلتُ حين كنتُ حاضرًا للمرة الثانية، للذين أخطأوا من قبل ولجميع الباقين: إن جئتُ مرة أخرى[a] فلن أُشفِق عليهم.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، على نحوٍ أكثر تحديدًا: «إن جئتُ للمرة الثالثة». تقول اليونانية حرفيًا: «إن جئتُ مرة أخرى»، لكن سياق زيارات بولس يوحي بأن الزيارة التالية ستكون بعد الزيارة الثانية.'
    reason: بيان أن تحديد الزيارة الثالثة مستفاد من السياق لا من صياغة المتن اليوناني نفسها، مع ربط الحاشية بعبارة «مرة أخرى» التي تفسرها.
lexical_decisions:
- source_word: προείρηκα
  choice: سبق أن قلتُ
  rationale: ينقل دلالة الفعل التام على قول سابق ما زال نافذًا، من غير أن يضيف صراحة معنى «حذّرتُ» الذي يُفهم من السياق.
- source_word: προλέγω
  choice: أقول مقدَّمًا
  rationale: يحافظ على معنى القول سلفًا وعلى الصلة اللفظية بالفعل السابق، مع ترك نبرة التحذير للسياق.
- source_word: ὡς παρὼν τὸ δεύτερον καὶ ἀπὼν νῦν
  choice: الآن وأنا غائب، كما قلتُ حين كنتُ حاضرًا للمرة الثانية
  rationale: يفك ضغط العبارة اليونانية بوضوح عربي طبيعي، ويُبقي المقابلة بين حضوره السابق وغيابه الحالي. أُعيد فعل «قلتُ» مفهومًا من السياق لتستقيم العبارة.
- source_word: τοῖς προημαρτηκόσιν
  choice: للذين أخطأوا من قبل
  rationale: ينقل سبق الخطية من غير أن يحسم هل تاب أصحابها أم لا.
- source_word: τοῖς λοιποῖς πᾶσιν
  choice: ولجميع الباقين
  rationale: يحفظ شمول πᾶσιν والتمييز بين الذين أخطأوا سابقًا وسائر المخاطَبين.
- source_word: ἐὰν ἔλθω εἰς τὸ πάλιν
  choice: إن جئتُ مرة أخرى
  rationale: ترجمة طبيعية للعبارة الاصطلاحية مع إبقاء عدد الزيارة غير مصرَّح به في المتن.
- source_word: οὐ φείσομαι
  choice: فلن أُشفِق عليهم
  rationale: يفيد عدم الامتناع عن الشدة، ويضيف الضمير الذي يقتضيه الأسلوب العربي من السياق دون تحديد صورة التأديب.
theological_decisions:
- issue: نطاق الشدة التي يتوعد بها بولس
  choice: الخطاب يشمل الذين أخطأوا من قبل وجميع الباقين، مع إبقاء نوع الإجراء غير محدد.
  alternative: قصر الوعيد على الذين أخطأوا سابقًا، أو التصريح بأنه تأديب كنسي ذو صورة معينة.
  rationale: التركيب يعطف «جميع الباقين» على الفئة الأولى، لكن الفعل لا يحدد آلية الشدة؛ لذلك لا تُستورد صيغة كنسية خاصة.
- issue: ترتيب الزيارة المقبلة
  choice: مرة أخرى في المتن، مع بيان احتمال «للمرة الثالثة» في الحاشية.
  alternative: إن جئتُ للمرة الثالثة.
  rationale: النص اليوناني يقول حرفيًا ما يفيد المجيء مجددًا، أما تحديدها بالزيارة الثالثة فمستفاد من السياق الأوسع.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. حوفظ على تكرار معنى «القول السابق» في الفعلين، وعلى غموض نوع الشدة وعدد الزيارة في المتن. وُضع marker الحاشية [a] بعد العبارة التي تشرحها.
