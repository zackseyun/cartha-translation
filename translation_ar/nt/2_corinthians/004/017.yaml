lexical_decisions:
- source_word: παραυτίκα
  choice: العابر
  rationale: يفيد ما هو للحظة الحاضرة أو مؤقت، ويقيم مقابلة طبيعية واضحة مع «أبديًّا».
- source_word: ἐλαφρὸν
  choice: الخفيف
  rationale: يحفظ التضاد البلاغي المقصود مع «ثقل» (βάρος).
- source_word: θλίψεως
  choice: ضيقنا
  rationale: «الضيق» تعبير عربي واضح عن الضغط والشدة والمعاناة، من غير إيحاء اصطلاحي زائد.
- source_word: καθ’ ὑπερβολὴν εἰς ὑπερβολὴν
  choice: يفوق كل قياس
  rationale: ينقل قوة التركيب اليوناني المضاعف الذي يدل على مقدار فائق للغاية، بصياغة عربية طبيعية.
- source_word: αἰώνιον
  choice: أبديًّا
  rationale: يحفظ المقابلة الزمنية الصريحة مع الضيق العابر ويناسب الاستعمال الأخروي في السياق.
- source_word: βάρος
  choice: ثقلًا
  rationale: يحفظ الصورة البلاغية والتضاد مع «الخفيف»، من دون الإيحاء بعبء مؤذٍ.
- source_word: δόξης
  choice: من المجد
  rationale: يحافظ على علاقة الإضافة الدلالية في «ثقل المجد» بصياغة عربية سليمة بعد النكرة المنصوبة.
- source_word: κατεργάζεται
  choice: يُنشئ
  rationale: يعبر عن إحداث نتيجة فعلية مستمرة، من غير أن يضيف فكرة الاستحقاق.
- source_word: ἡμῖν
  choice: لنا
  rationale: ينقل دلالة المنفعة في صيغة المجرور اليونانية، مع بقاء احتمال العلاقة بالمتكلمين واضحًا.
theological_decisions:
- issue: طبيعة المجد الذي ينشئه الضيق
  choice: يبقي النص علاقة النتيجة بين الضيق الحاضر والمجد الأبدي من غير القول إن المعاناة تستحق الخلاص.
  alternative: أن الضيق يكسب المجد باستحقاق بشري، أو أنه لا ينتج إلا نضجًا روحيًّا حاضرًا.
  rationale: المقابلة بين العابر والأبدي تشير إلى أفق مستقبلي، لكن الترجمة لا تتجاوز صياغة النص إلى تحديد آلية لاهوتية غير مصرّح بها.
translation_notes:
  register: عربية فصحى حديثة، واضحة وموقرة. حُفظ التضاد البلاغي بين «الخفيف» و«الثقل»، وبين «العابر» و«الأبدي»، مع نقل العبارة اليونانية المكثفة بصياغة مفهومة وإثبات بديلها في الحاشية.
