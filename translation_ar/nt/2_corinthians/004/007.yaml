  text: But we have this treasure in clay jars[b][a], so that the surpassing greatness of the power may be of God and not from us.
translation:
  language: ar
  text: ولكن لنا هذا الكنز في أوعية من فخار، لكي تكون العظمة الفائقة للقوة من الله، لا منا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في أوانٍ فخارية»؛ ويمكن ترجمة «العظمة الفائقة للقوة» أيضًا: «القوة الفائقة» أو «القوة التي تفوق المعتاد».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔχομεν δὲ
  choice: ولكن لنا
  rationale: تنقل العبارة معنى الامتلاك الحاضر، وتحفظ قوة δὲ الانتقالية والمقابِلة بصياغة عربية طبيعية موجزة.
- source_word: τὸν θησαυρὸν τοῦτον
  choice: هذا الكنز
  rationale: تحفظ الاستعارة والإشارة إلى ما سبق من غير تفسير الكنز داخل النص.
- source_word: ἐν ὀστρακίνοις σκεύεσιν
  choice: في أوانٍ خزفية
  rationale: ὀστράκινος يدل على المصنوع من الطين المشوي، وσκεῦος على الوعاء؛ وهذه الصياغة واضحة وتحفظ صورة الأوعية الهشة المتواضعة.
- source_word: ἵνα
  choice: لكي
  rationale: تحفظ دلالة الغرض، مع بقاء احتمال تداخل الغرض والنتيجة في السياق.
- source_word: ἡ ὑπερβολὴ τῆς δυνάμεως
  choice: تفوّق القوة
  rationale: تحافظ على البنية الاسمية وعلى معنى الزيادة التي تتجاوز المعتاد، من غير توسيع تفسيري.
- source_word: ᾖ τοῦ θεοῦ καὶ μὴ ἐξ ἡμῶν
  choice: يكون ... من الله لا منا
  rationale: «يكون» يلائم صيغة المضارع المنصوب بعد ἵνα، و«من» تبرز مصدر القوة في المقابلة بين الله والمتكلمين.
theological_decisions:
- issue: ماهية «الكنز» و«الأواني» في الاستعارة
  choice: إبقاء الاستعارة بلا تفسير في المتن
  alternative: توسيعها إلى «كنز الإنجيل» و«أجسادنا الضعيفة»
  rationale: السياق يساعد على فهم الصورة، لكن ألفاظ الآية نفسها لا تصرّح بهذا التفسير؛ فإبقاؤها يصون اتساع الدلالة والتوتر البلاغي.
- issue: دلالة جملة ἵνα
  choice: 'صياغتها بصيغة الغرض: «لكي يكون»'
  alternative: 'صياغتها كنتيجة محضة: «فتكون» أو «بحيث تكون»'
  rationale: ἵνα قد تجمع في هذا السياق بين الغرض والنتيجة، لكن «لكي» تحفظ دلالتها الغرضية الأساسية من غير حسم كل ظلالها.
- issue: علاقة القوة بالله
  choice: «من الله» بوصفها دلالة المصدر
  alternative: «لله» بوصفها الملك أو النسبة
  rationale: مع أن τοῦ θεοῦ مجرور بالإضافة، فإن المقابلة الصريحة مع ἐξ ἡμῶν تجعل معنى المصدر بارزًا؛ لذا تنقل «من الله لا منا» المقابلة بوضوح من غير إضافة فاعل أو تفسير.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. اختيرت «أوانٍ خزفية» بدل التعبير التراثي الأثقل «آنية خزفية»، وأُبقيت الاستعارة والبنية اللاهوتية الموجزة من غير شرح داخل المتن.
