  text: εἰδότες ὅτι ὁ ἐγείρας ⸀τὸν Ἰησοῦν καὶ ἡμᾶς ⸀σὺν Ἰησοῦ ἐγερεῖ καὶ παραστήσει σὺν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/014.yaml
  text: because we know that the one who raised Jesus will also raise us with Jesus and will present us with you[a].
translation:
  language: ar
  text: لأننا نعلم أن الذي أقام يسوع سيقيمنا نحن أيضًا مع يسوع، وسيُحضرنا معكم.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ بعض المخطوطات: «الرب يسوع» بدلًا من «يسوع».'
    reason: textual_variant
lexical_decisions:
- source_word: εἰδότες
  choice: لأننا نعلم
  rationale: اسم الفاعل اليوناني يؤدي هنا معنى سببيًا في سياق احتمال الضيق؛ وهذه الصياغة تنقل ذلك بوضوح وطبيعية.
- source_word: ὁ ἐγείρας
  choice: الذي أقام
  rationale: ينقل اسم الفاعل المعرف الدال على الله من غير إضافة تفسيرية إلى النص.
- source_word: τὸν Ἰησοῦν
  choice: يسوع
  rationale: يتبع نص SBLGNT المعطى، في حين تُذكر القراءة الأطول «الرب يسوع» في الحاشية.
- source_word: καὶ ἡμᾶς
  choice: سيقيمنا نحن أيضًا
  rationale: يحفظ قوة العطف الإضافية، ويبرز الضمير بما يلائم المقابلة بين إقامة يسوع وإقامتنا.
- source_word: σὺν Ἰησοῦ
  choice: مع يسوع
  rationale: ينقل معنى المصاحبة في σύν مع المجرور، من دون تحويله إلى معنى سببي أو وسائطي.
- source_word: παραστήσει
  choice: سيُحضرنا إلى حضرته
  rationale: يعبّر طبيعيًا عن جعل أشخاص يقفون في حضرة أحد، ويحفظ البعد الأخروي المرجح دون تحديد مشهد قضائي بعينه.
- source_word: σὺν ὑμῖν
  choice: معكم
  rationale: يحفظ معنى الاشتراك والمصاحبة، ويبيّن وحدة رجاء بولس ومخاطَبيه.
theological_decisions:
- issue: الاختلاف النصي بعد ἐγείρας
  choice: اتباع قراءة SBLGNT «يسوع» في المتن
  alternative: «الرب يسوع»
  rationale: المسألة نصية لا عقائدية؛ تتبع الترجمة النص المحدد، وتحفظ القراءة الأطول المشهودة في الحاشية.
- issue: الدلالة الأخروية للفعل παραστήσει
  choice: إحضار بولس ورفقائه مع الكورنثيين إلى الحضرة الإلهية مستقبلًا
  alternative: التبرئة العامة، أو الوقوف تحديدًا أمام كرسي المسيح
  rationale: سياق القيامة يؤيد العرض الأخروي، لكن اليونانية لا تعيّن هنا على نحو صريح المشهد أو الجهة التي يُوقَفون أمامها؛ لذلك لم يُخصَّص المعنى أكثر من اللازم.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُعمل «سيُحضرنا إلى حضرته» بدل «سيقدّمنا» لتجنب الإيحاء العربي المحتمل بتقديم قربان أو تعريف شخص، مع إبقاء مرجع الحضرة غير مصرح باسمه كما في اليونانية.
