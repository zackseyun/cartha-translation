source:
  edition: SBLGNT
  text: ἀλλὰ ἀπειπάμεθα τὰ κρυπτὰ τῆς αἰσχύνης, μὴ περιπατοῦντες ἐν πανουργίᾳ μηδὲ δολοῦντες τὸν λόγον τοῦ θεοῦ, ἀλλὰ τῇ φανερώσει τῆς ἀληθείας ⸀συνιστάνοντες ἑαυτοὺς πρὸς πᾶσαν συνείδησιν ἀνθρώπων ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/002.yaml
  text: Instead[a], we have renounced the hidden things of shame, not walking in cunning nor falsifying the word of God[b], but by the open display of the truth commending ourselves to every human conscience before God.
translation:
  language: ar
  text: لكننا تبرأنا من الأمور الخفية المخزية، فلا نسلك بالمكر ولا نغشّ كلمة الله[a]، بل بإظهار الحق نزكّي أنفسنا لدى ضمير كل إنسان أمام الله[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ولا نُزَيِّفُ كلمة الله». يفيد الفعل اليوناني إفساد الشيء بالتلاعب المخادع أو غشَّه.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «بجعل الحق ظاهرًا». قد يكون التركيز على كشف الحق وإبرازه علنًا، لا على المناداة اللفظية وحدها.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπειπάμεθα
  choice: قد تَبَرَّأْنا
  rationale: ينقل معنى النبذ الواعي والحاسم، وصيغة «قد» تُبرز وقوع هذا الموقف دون تحويل الماضي اليوناني إلى تقرير زمني مفرط التحديد.
- source_word: τὰ κρυπτὰ τῆς αἰσχύνης
  choice: خَفايا الخِزي
  rationale: يحافظ على صورة الأمور المستترة المرتبطة بالخزي، بصياغة عربية موجزة وطبيعية.
- source_word: μὴ περιπατοῦντες ἐν πανουργίᾳ
  choice: فلا نَسلُكُ بِمَكرٍ
  rationale: يحفظ استعارة السلوك للدلالة على نهج الحياة والعمل، ويعبّر «المكر» عن الذكاء المخادع غير النزيه.
- source_word: δολοῦντες
  choice: نَغُشُّ
  rationale: الفعل اليوناني يدل على الإفساد أو الخلط بالخداع؛ و«نغش» يحفظ هذه الصورة الحسية أكثر من لفظ عام مثل «نحرّف».
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: كلمةَ اللهِ
  rationale: صياغة عربية معيارية تحافظ على سعة معنى λόγος دون حصره في الكتاب المقدس المكتوب أو في خطاب بعينه.
- source_word: τῇ φανερώσει τῆς ἀληθείας
  choice: بإظهارِ الحقِّ
  rationale: ينقل معنى جعل الحق ظاهرًا ومكشوفًا، من غير قصر العبارة على الوعظ اللفظي وحده.
- source_word: συνιστάνοντες ἑαυτοὺς
  choice: نُقَدِّمُ أنفسَنا
  rationale: يحافظ على معنى عرض النفس لتُعرَف وتُقوَّم، ويتجنب إيحاء التفاخر الذي قد ينشأ من «نُزكّي أنفسنا».
- source_word: πρὸς πᾶσαν συνείδησιν ἀνθρώπων
  choice: إلى ضميرِ كلِّ إنسانٍ
  rationale: يحفظ التوزيع في πᾶσαν وعموم ἀνθρώπων، ويجعل ضمير كل شخص موضع التقييم المقصود.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: أمامَ اللهِ
  rationale: تعبير مباشر يحفظ معنى الحضور والشهادة الإلهيين.
theological_decisions:
- issue: نطاق المقابلة بين الخدمة المخادعة وإظهار الحق
  choice: تُصاغ الآية بوصفها وصفًا لأمانة الخدمة وشفافيتها أمام الضمير البشري والله.
  alternative: أن تُجعل العبارة تقريرًا تقنيًا محصورًا في عقيدة الوحي، أو في البلاغة، أو في منصب كنسي بعينه.
  rationale: السياق المباشر يتناول سلوك بولس ورفاقه في الخدمة وطريقة عرضهم لكلمة الله، ولا يصرّح بتلك التخصيصات العقائدية الأضيق.
- issue: دلالة φανέρωσις
  choice: إظهار الحق
  alternative: إعلان الحق أو المناداة بالحق
  rationale: «الإظهار» يبقي المعنى أوسع من الكلام وحده، فيشمل جعل الحق مكشوفًا في الرسالة والسلوك، كما يسمح به اللفظ اليوناني.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظت استعارة «السلوك»، واستُعمل «نغش كلمة الله» لإبقاء صورة التلاعب المخادع، و«إظهار الحق» لتجنب تضييق φανέρωσις إلى التبشير اللفظي وحده. وُضعت علامتا الحاشيتين عند العبارتين اللتين تشرحانهما مباشرة.
