  to: لكننا تبرأنا من الأمور الخفية المخزية، فلا نسلك بالمكر ولا نغشّ كلمة الله[a]، بل بإظهار الحق نزكّي أنفسنا لدى ضمير كل إنسان أمام الله[b].
  rationale: استُبدلت العبارة الأقل وضوحًا «خفايا الخزي» بـ«الأمور الخفية المخزية» لإظهار وصف هذه الأمور بالخزي. واستُبدلت «نقدّم أنفسنا إلى» بـ«نزكّي أنفسنا لدى» لأنها تنقل بدقة أكبر معنى توصية الرسل بأنفسهم أو إثبات مصداقيتهم أمام ضمير كل إنسان. كما نُقل موضع الحاشية الثانية إلى نهاية العبارة ذات الصلة «أمام الله» تفاديًا لانقسام تركيب «بإظهار الحق» عن بقيّة الجملة، مع بقاء الحاشية شارحة لعبارة «بإظهار الحق».
