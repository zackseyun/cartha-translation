  text: مُضطَهَدين، لكن غير متروكين؛ مطروحين أرضًا، لكن غير هالكين.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διωκόμενοι
  choice: مُضطَهَدين
  rationale: يدل الفعل هنا على التعرض للملاحقة والاضطهاد من الخصوم، وصيغة اسم المفعول تحافظ على التوازي في الأصل.
- source_word: ἐγκαταλειπόμενοι
  choice: متروكين
  rationale: ينقل معنى التخلي عن الشخص وتركه بلا عون، بعبارة عربية واضحة لا تضيف تحديدًا صريحًا لمن لا يتركهم.
- source_word: καταβαλλόμενοι
  choice: مطروحين أرضًا
  rationale: يحفظ صورة الإسقاط إلى الأرض وقوة المقابلة مع عدم الهلاك، بدل حمل العبارة على مجرد الإحباط النفسي.
- source_word: ἀπολλύμενοι
  choice: هالكين
  rationale: ينقل معنى الهلاك أو الدمار النهائي في مقابلة السقوط الذي لا ينتهي بالفناء.
- source_word: ἀλλ’ οὐκ
  choice: لكن غير
  rationale: يحافظ على البناء الإيقاعي المتوازي وعلى المقابلة الموجزة بين الشدة وحدودها.
theological_decisions:
- issue: هل تُصاغ ἐγκαταλειπόμενοι بلفظ ذي رنين ديني تقليدي أم بلفظ عربي معاصر؟
  choice: متروكين
  alternative: مخذولين
  rationale: «متروكين» أقرب إلى المعنى المباشر للتخلي والهجر، ولا يضيف إيحاءً بأن القضية محصورة في الحرمان من النصرة، كما يبقي هوية من لا يتركهم مفهومة من السياق دون إدخالها في النص.
translation_notes:
  register: صياغة عربية فصحى حديثة وموجزة، تحافظ على التوازي بين اسمَي المفعول وعلى الإيقاع البلاغي للمقابلتين. لا حاجة إلى حواشٍ لأن البدائل المعجمية لا تمثل غموضًا جوهريًا يستلزم إثقال هذا الشطر القصير.
