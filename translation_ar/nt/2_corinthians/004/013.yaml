  text: Ἔχοντες δὲ τὸ αὐτὸ πνεῦμα τῆς πίστεως, κατὰ τὸ γεγραμμένον· Ἐπίστευσα, διὸ ἐλάλησα, καὶ ἡμεῖς πιστεύομεν, διὸ καὶ λαλοῦμεν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/013.yaml
  text: But having the same spirit of faith[a], according to what is written, “I believed; therefore I spoke,” we also believe; therefore we also speak[b],
translation:
  language: ar
  text: 'ولكن، إذ لنا روح الإيمان ذاتها[a]، بحسب ما هو مكتوب: «آمنت، ولذلك تكلمت»، فنحن أيضًا نؤمن، ولذلك نتكلم أيضًا[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «روح الإيمان ذاتها»، إذا كان المقصود بكلمة «الروح» الروح القدس لا روحًا أو نزعةً مشتركة متصفة بالإيمان.'
    reason: alternative_reading
  - marker: b
    text: يقتبس بولس هنا مزمور 116:‏10 بحسب الترقيم العبري (115:‏1 في السبعينية)، رابطًا إيمانه وكلامه بشهادة صاحب المزمور.
    reason: cross_reference
lexical_decisions:
- source_word: Ἔχοντες δὲ
  choice: ولكن إذ لنا
  rationale: يحافظ «إذ لنا» على الصيغة الحالية الشبيهة بالمشاركة من غير حسم دلالتها الظرفية بأنها سببية، وتؤدي «لكن» وظيفة δέ في الانتقال المقابل الخفيف ضمن السياق.
- source_word: τὸ αὐτὸ πνεῦμα τῆς πίστεως
  choice: روح الإيمان نفسه
  rationale: صياغة قريبة من تركيب اليونانية، وتفهم طبيعيًا على أنها الروح أو النزعة المتسمة بالإيمان، مع إبقاء إمكان الإشارة إلى الروح القدس في الحاشية لأن الأصل لا يحسم ذلك صراحة.
- source_word: κατὰ τὸ γεγραμμένον
  choice: بحسب ما هو مكتوب
  rationale: تحافظ على صيغة الاستشهاد الكتابي وعلى معنى المطابقة لما كُتب، بلغة عربية واضحة ومألوفة.
- source_word: Ἐπίστευσα, διὸ ἐλάλησα
  choice: آمنت، ولذلك تكلمت
  rationale: تنقل الفعلين مباشرة وتحفظ العلاقة الاستنتاجية التي تدل عليها διό.
- source_word: καὶ ἡμεῖς πιστεύομεν
  choice: فنحن أيضًا نؤمن
  rationale: يبرز الضمير المنفصل «نحن» المقابلة مع صاحب القول المقتبس، وتنقل «أيضًا» دلالة καί.
- source_word: διὸ καὶ λαλοῦμεν
  choice: ولذلك نتكلم أيضًا
  rationale: تحفظ التوازي البلاغي مع «آمنت، ولذلك تكلمت» وتؤدي καί بمعنى «أيضًا».
theological_decisions:
- issue: هل πνεῦμα يشير إلى الروح القدس أم إلى روح أو نزعة مشتركة متصفة بالإيمان؟
  choice: روح الإيمان نفسه، بوصفها في القراءة الأساسية روحًا أو نزعة مشتركة متصفة بالإيمان
  alternative: روح الإيمان نفسه، مع فهم «الروح» على أنه الروح القدس الذي يمنح الإيمان أو ينشئه
  rationale: 'يربط السياق العبارة مباشرة بشهادة صاحب المزمور: «آمنت، ولذلك تكلمت»، مما يرجح معنى الروح أو النزعة الإيمانية المشتركة. لكن اللفظ اليوناني لا يستبعد الإشارة إلى الروح القدس، لذلك تُحفظ الإمكانية في الحاشية بدل حسمها في المتن.'
- issue: ترجمة مجموعة πιστ- اللفظية
  choice: آمنت / نؤمن
  alternative: وثقت / نثق
  rationale: «آمن» هو المقابل العربي الطبيعي المباشر، ويحفظ الصلة اللفظية والموضوعية بين πίστις وπιστεύω في الآية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حوفظ على التوازي بين الاقتباس وتطبيق بولس له، وعلى غموض πνεῦμα دون فرض تفسير عقائدي في المتن.
