  yaml_path: translation/nt/2_corinthians/004/010.yaml
  text: always carrying in the body the death of Jesus[a], so that the life of Jesus may also be revealed in our body.
translation:
  language: ar
  text: حاملين دائمًا في الجسد موت يسوع[a]، لكي تظهر حياة يسوع أيضًا في جسدنا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «احتضار يسوع». يمكن للاسم اليوناني أن يبرز حالة الموت أو اختباره المحمول في الجسد.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε
  choice: دائمًا
  rationale: ينقل ظرف الاستمرار بإيجاز ووضوح.
- source_word: νέκρωσιν
  choice: إماتة
  rationale: يحافظ على دلالة الاسم اليوناني التي قد تشير إلى حالة الموت أو اختباره، وعلى الصلة اللفظية بالفعل «يميت» في السياق، من غير حصر المعنى في لحظة موت يسوع وحدها.
- source_word: τοῦ Ἰησοῦ
  choice: يسوع
  rationale: 'أُبقيت الإضافة كما في اليونانية: «إماتة يسوع»، دون تحديد ما إذا كانت الإماتة التي اختبرها يسوع أو الإماتة المرتبطة به.'
- source_word: ἐν τῷ σώματι
  choice: في الجسد
  rationale: يحافظ على غياب ضمير الملكية في الورود الأول وعلى المفرد اليوناني.
- source_word: περιφέροντες
  choice: حاملين
  rationale: صيغة حالية طبيعية تنقل معنى الحمل المستمر في الجسد.
- source_word: ἵνα
  choice: لكي
  rationale: توضح علاقة الغاية أو النتيجة المقصودة مع إبقاء التوتر بينهما.
- source_word: καὶ
  choice: أيضًا
  rationale: يحفظ الموازاة بين إماتة يسوع وحياته.
- source_word: ζωὴ
  choice: حياة
  rationale: المقابل المباشر الطبيعي، وفي السياق تشير إلى حياة يسوع القائم.
- source_word: ἐν τῷ σώματι ἡμῶν
  choice: في جسدنا
  rationale: يحافظ على المفرد مع ضمير الجمع، كما في اليونانية، وعلى البعد الجماعي في العبارة.
- source_word: φανερωθῇ
  choice: تظهر
  rationale: فعل عربي طبيعي يؤدي معنى أن تصير الحياة ظاهرة؛ وصيغة المبني للمعلوم هنا لازمة دلاليًا ولا تلغي معنى الظهور الذي تحمله الصيغة اليونانية المبنية للمجهول.
theological_decisions:
- issue: دلالة νέκρωσις وصلتها بيسوع
  choice: إماتة يسوع
  alternative: موت يسوع؛ احتضار يسوع
  rationale: «إماتة» تحفظ كون اللفظة اسمًا يدل على الموت بوصفه حالة أو اختبارًا متواصلًا يحمله الرسل، وتبقي الموازاة مع «حياة يسوع». وتوضح الحاشية البديلين الممكنين دون فرض تفسير صوفي أو طائفي.
- issue: عدد σώμα في العربية
  choice: 'المفرد في العبارتين: «الجسد» و«جسدنا»'
  alternative: أجسادنا في العبارة الثانية
  rationale: النص اليوناني يستعمل المفرد في الموضعين، وإبقاؤه يصون التوازي والملمح الجماعي لخدمة الرسل.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. اختيرت «إماتة» لصون الاتساع الدلالي في الأصل، مع شرح البدائل في الحاشية. حُفظ المفرد اليوناني في «الجسد» و«جسدنا»، كما حُفظ ترتيب الموازاة بين إماتة يسوع وحياته.
