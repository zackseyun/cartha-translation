  text: εἰ δὲ καὶ ἔστιν κεκαλυμμένον τὸ εὐαγγέλιον ἡμῶν, ἐν τοῖς ἀπολλυμένοις ἐστὶν κεκαλυμμένον,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/003.yaml
  text: And even if our gospel is veiled[a], it is veiled among those who are perishing,
translation:
  language: ar
  text: وإن كان إنجيلنا محجوبًا، فهو محجوب بين الذين يهلكون[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لدى الذين يهلكون»، أو: «في حالة الذين يهلكون».'
    reason: بدائل لنقل ἐν مع اسم الفاعل ἀπολλυμένοις؛ وتحافظ الصياغة الرئيسة على دلالة الحالة الجارية.
lexical_decisions:
- source_word: εἰ δὲ καὶ
  choice: وإن كان
  rationale: تنقل أداة الشرط ذات القوة التنازلية في سياق عربي طبيعي، مع وصل الكلام بما قبله من غير إثقال العبارة.
- source_word: κεκαλυμμένον
  choice: محجوبًا
  rationale: تحفظ صورة الحجاب الممتدة من السياق السابق، وهي أدق من «مخفيًّا» وأفصح هنا من النقل الحرفي «مغطًّى».
- source_word: τὸ εὐαγγέλιον ἡμῶν
  choice: إنجيلنا
  rationale: تحفظ ضمير الملكية وصياغة بولس الموجزة، و«الإنجيل» هو المقابل العربي المألوف لـ εὐαγγέλιον.
- source_word: ἐν τοῖς ἀπολλυμένοις
  choice: بين الهالكين
  rationale: تنقل ἐν بوصفها دالة على النطاق أو الجماعة، وتحافظ «الهالكين» على دلالة الحال أو المسار الجاري التي يحملها اسم الفاعل اليوناني بحسب السياق.
- source_word: ἐστὶν κεκαλυμμένον
  choice: فهو محجوب
  rationale: تحفظ تكرار الخبر في اليونانية للتوكيد، ويعود الضمير بوضوح إلى الإنجيل من غير إضافة معنى الاستمرار.
theological_decisions:
- issue: دلالة ἀπολλυμένοις في السياق الخلاصي عند بولس
  choice: الهالكين
  alternative: الضالين أو الذين مصيرهم الهلاك
  rationale: «الهالكين» تحافظ على التوتر بين الحالة الحاضرة والمسار الجاري، ولا تختزل اللفظ في وصف ثابت مثل «الضالين» ولا تحسمه بإضافة تفسير صريح للمصير.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة ذات نبرة كتابية وقورة. حُفظت استعارة الحجاب وتكرارها، كما حُفظت دلالة الهلاك دون شرح مذهبي زائد.
