base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/008.yaml
  text: We are afflicted in every way[a], but not crushed; perplexed[c][b], but not driven to despair.
translation:
  language: ar
  text: مُضايَقون في كلِّ شيء[a]، لكننا غيرُ محصورين[b]؛ ومُتحيِّرون، لكننا غيرُ يائسين[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «من كلِّ جهة». تدل العبارة على شمول الضيق، لا بالضرورة على إحاطة مكانية حرفية.'
    reason: lexical_alternative
  - marker: b
    text: 'أي حرفيًا: غير موضوعين في مكان ضيق؛ والمعنى: لم تُغلق علينا السبل.'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «لسنا فاقدين كلَّ مخرج». يشدّد الفعل اليوناني معنى الفعل السابق «متحيّرون».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν παντί
  choice: في كلِّ شيء
  rationale: تؤدي العبارة معنى الشمول من غير أن تحصره في إحاطة مكانية حرفية، وهي صياغة عربية طبيعية تحفظ إيجاز الأصل.
- source_word: θλιβόμενοι
  choice: مُضايَقون
  rationale: ينقل اللفظ معنى التعرّض للضغط والضيق، ويلائم سياق شدائد الخدمة مع إبقاء الصلة البلاغية بالفعل المقابل.
- source_word: στενοχωρούμενοι
  choice: محصورين
  rationale: يحفظ صورة المكان الضيق الكامنة في الفعل اليوناني، ويفيد أن الضغط لا يبلغ بهم حد انغلاق السبل عليهم.
- source_word: ἀπορούμενοι
  choice: مُتحيِّرون
  rationale: يدل على الحيرة وعدم معرفة ما ينبغي فعله، بصياغة واضحة ومألوفة في العربية المعاصرة.
- source_word: ἐξαπορούμενοι
  choice: يائسين
  rationale: ينقل تصعيد الفعل المركب من الحيرة إلى فقدان المخرج أو الرجاء، من غير تحويل العبارة إلى تقرير عقائدي تقني.
- source_word: ἀλλ’ οὐ ... ἀλλ’ οὐκ
  choice: لكننا غيرُ ... لكننا غيرُ
  rationale: يحافظ التكرار على بنية التضاد وإيقاع العبارة، مع إظهار الفاعل الضمني طبيعيًا في العربية.
theological_decisions:
- issue: درجة التصعيد في ἐξαπορούμενοι
  choice: غيرُ يائسين
  alternative: لسنا فاقدين كلَّ مخرج
  rationale: «يائسين» تميّز الحالة المنفية من مجرد الحيرة وتحفظ قوة التصعيد، لكنها لا تفترض أن الكلام تعريف تقني لفقدان الإيمان.
- issue: العلاقة بين الضغط الخارجي والنتيجة المنفية
  choice: مُضايَقون ... غيرُ محصورين
  alternative: مضغوطون ... غيرُ مسحوقين
  rationale: 'الصياغة المختارة تحفظ قدرًا أكبر من الصورة اللفظية اليونانية: وقوع الضغط مع عدم الانحصار في موضع ضيق، من غير حسم المجاز في معنى الانهيار وحده.'
translation_notes:
  register: عربية فصحى حديثة، واضحة وموقّرة. حوفظ على التوازي الإيقاعي بين الحالين المثبتتين والمنفيتين، وعلى الاستعارة المكانية في الزوج الأول والتصعيد الدلالي في الزوج الثاني.
