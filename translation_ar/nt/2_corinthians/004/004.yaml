reference: 2 Corinthians 4:4
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἐν οἷς ὁ θεὸς τοῦ αἰῶνος τούτου ἐτύφλωσεν τὰ νοήματα τῶν ἀπίστων εἰς τὸ μὴ ⸀αὐγάσαι τὸν φωτισμὸν τοῦ εὐαγγελίου τῆς δόξης τοῦ Χριστοῦ, ὅς ἐστιν εἰκὼν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/004.yaml
  text: In their case[a], the god of this age has blinded the minds of the unbelieving, so that the light of the gospel of the glory of Messiah, who is the image of God[c][b], might not shine on them.
translation:
  language: ar
  text: في حالتهم، أعمى إله هذا الدهر[b] أذهان غير المؤمنين، لئلا يشرق عليهم نور بشارة مجد المسيح[a]، الذي هو صورة الله.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لئلا يروا نور بشارة مجد المسيح». قد يركّز الفعل اليوناني النادر هنا إما على إشراق النور وإما على رؤيتهم له.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «إله هذا العالم». تشير الكلمة اليونانية عادةً إلى حقبة زمنية، أي هذا العصر الحاضر، أكثر من إشارتها إلى العالم المخلوق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν οἷς
  choice: في حالتهم
  rationale: تُحيل العبارة إلى الهالكين غير المؤمنين في السياق السابق، وتنقل قوتها الإحالية بالعربية من غير أن توحي بالسكنى فيهم.
- source_word: ὁ θεὸς τοῦ αἰῶνος τούτου
  choice: إله هذا الدهر
  rationale: «الدهر» ينقل معنى αἰών بوصفه العصر الحاضر الساقط، لا الخليقة أو العالم المكاني.
- source_word: ἐτύφλωσεν τὰ νοήματα
  choice: أعمى ... أذهان
  rationale: الفعل يدل على إحداث العمى، و«الأذهان» تعبّر هنا عن ملكة الإدراك والفهم لا عن أفكار منفردة.
- source_word: τῶν ἀπίστων
  choice: غير المؤمنين
  rationale: ينقل الصفة المستعملة اسميًا للدلالة على الذين لا يؤمنون، من غير إضافة معنى أخلاقي أقوى كعدم الأمانة.
- source_word: εἰς τὸ μὴ αὐγάσαι
  choice: لئلا يشرق عليهم
  rationale: تنقل العبارة الغاية أو النتيجة، وتقرأ الفعل النادر بمعنى إشراق النور عليهم، مع حفظ القراءة الأخرى في الحاشية.
- source_word: τὸν φωτισμὸν τοῦ εὐαγγελίου
  choice: نور بشارة
  rationale: «نور» طبيعي وواضح في الصورة المجازية، و«بشارة» تنقل εὐαγγέλιον بلغة عربية مفهومة ورصينة.
- source_word: τῆς δόξης τοῦ Χριστοῦ
  choice: مجد المسيح
  rationale: 'تحافظ الإضافة المتتابعة على البنية اليونانية: النور المتعلق بالبشارة المتعلقة بمجد المسيح؛ و«المسيح» لقب عربي راسخ لـΧριστός.'
- source_word: ὅς ἐστιν εἰκὼν τοῦ θεοῦ
  choice: الذي هو صورة الله
  rationale: صياغة مباشرة تحفظ التصريح الكريستولوجي وصدى استعمال «صورة الله» من غير توسع تفسيري.
theological_decisions:
- issue: مرجع «إله هذا الدهر»
  choice: الإبقاء على العبارة بوصفها تشير إلى قوة شريرة شخصية متسلطة على الدهر الحاضر، من غير تسميتها صراحة.
  alternative: تفسيرها بأنها نظام دنيوي غير شخصي، أو استبدالها باسم «الشيطان».
  rationale: النص يصف على نحو طبيعي فاعلًا شخصيًا، لكنه لا يذكر اسم الشيطان؛ لذلك تحافظ الترجمة على ألفاظ المصدر ولا تزيد عليها.
- issue: دلالة αὐγάσαι مع φωτισμός
  choice: النور لا يشرق على غير المؤمنين.
  alternative: غير المؤمنين لا يرون نور البشارة.
  rationale: الفعل نادر والبنية تحتمل التركيز على إشراق النور أو إدراكه؛ اختيرت القراءة الأكثر اتساقًا مع «نور»، وأُثبت البديل في الحاشية.
- issue: قوة عبارة «صورة الله» في وصف المسيح
  choice: إبقاء التصريح المباشر كما هو.
  alternative: شرحه بمصطلحات عقائدية لاحقة.
  rationale: تحفظ الصياغة العلاقة الفريدة التي يصرح بها النص من غير إدخال مصطلحات تفسيرية غير موجودة فيه.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُعمل «الدهر» بدقة زمنية مع توضيحه في الحاشية، و«البشارة» بدل اللفظ المعرّب، وحُفظت سلسلة الإضافات بقدر يسمح به الأسلوب العربي الطبيعي. وُضعت علامتا الحاشيتين بعد الجملة لأن الأولى تتعلق بعبارة الغاية والثانية بلفظ «الدهر» الواردين في المتن.
