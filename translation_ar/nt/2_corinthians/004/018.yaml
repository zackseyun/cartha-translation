base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/018.yaml
  text: as we look not to the things that are seen but to the things that are not seen. For the things that are seen are temporary[a], but the things that are not seen are eternal.
translation:
  language: ar
  text: إذ لا نوجِّه أنظارنا إلى ما يُرى، بل إلى ما لا يُرى؛ لأن ما يُرى مؤقت، أما ما لا يُرى فأبدي.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «الأشياء التي تُرى ... الأشياء التي لا تُرى»، أو: «الأشياء المنظورة ... الأشياء غير المنظورة».'
    reason: بدائل معجمية وصياغية لاسمَي المفعول اليونانيين المستعملين استعمال الأسماء.
lexical_decisions:
- source_word: σκοπούντων
  choice: نوجِّه أنظارنا إلى
  rationale: ينقل معنى توجيه الانتباه نحو شيء مع الحفاظ على الصورة البصرية، ويلائم كون اسم الفاعل اليوناني ذا دلالة حالية مرتبطة بالسياق السابق.
- source_word: τὰ βλεπόμενα
  choice: ما يُرى
  rationale: ترجمة طبيعية لاسم الفاعل المحلّى العامل عمل الاسم، وتحافظ على التوازي مع «ما لا يُرى» دون تحويل المقابلة إلى مادية وروحية.
- source_word: τὰ μὴ βλεπόμενα
  choice: ما لا يُرى
  rationale: يحفظ النفي والتوازي البلاغي المقصود مع «ما يُرى»، ولا يضيف تحديدًا فلسفيًا غير مصرّح به.
- source_word: πρόσκαιρα
  choice: مؤقت
  rationale: يدل بوضوح على ما لا يدوم إلا مدة محدودة، ويقيم المقابلة الطبيعية مع «أبدي» دون المبالغة بلفظ «لحظي».
- source_word: αἰώνια
  choice: أبدي
  rationale: في مقابل πρόσκαιρα يدل على ما يدوم وينتمي إلى الأبد؛ و«أبدي» هو التعبير العربي المألوف والدقيق في هذا السياق.
- source_word: γὰρ
  choice: لأن
  rationale: يبيّن أن الجملة التالية تعليل لعدم توجيه النظر إلى المنظور، وهو ربط واضح وطبيعي بالعربية.
- source_word: δέ
  choice: أما ... فـ
  rationale: يبني مقابلة عربية فصيحة وواضحة بين القسمين، مع نقل القوة الاستدراكية في السياق.
theological_decisions:
- issue: المقابلة بين المرئي وغير المرئي
  choice: ما يُرى ... ما لا يُرى
  alternative: الأشياء المنظورة ... الأشياء غير المنظورة؛ أو الأمور المادية ... الأمور الروحية
  rationale: يحافظ الاختيار على الألفاظ الحسية الملموسة وعلى الغموض المقصود في النص، ولا يساوي من تلقاء نفسه بين المرئي والمادي أو بين غير المرئي والروحي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «إذ» لنقل الصلة الحالية بالسياق السابق، و«نوجّه أنظارنا» للحفاظ على صورة النظر مع بيان معنى تركيز الانتباه. وُضعت علامة الحاشية بعد الجملة كلها لأنها تتناول الصياغة المتوازية في شطري الآية.
