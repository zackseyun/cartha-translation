lexical_decisions:
- source_word: ὥστε
  choice: فإذًا
  rationale: تفيد هنا النتيجة المستخلصة من الكلام السابق، و«فإذًا» تؤدي قوة الاستنتاج بعبارة عربية واضحة.
- source_word: ὁ θάνατος
  choice: الموت
  rationale: يحافظ التعريف على صياغة اليونانية الطبيعية في العربية، مع إبقاء الموت واقعًا فاعلًا في آلام الرسل دون حصره في معنى جسدي أو مجازي وحده.
- source_word: ἐν ἡμῖν
  choice: فينا
  rationale: ترجمة مباشرة تحفظ المقابلة الموجزة مع «فيكم»، وتلائم البعد الشخصي والجسدي في السياق.
- source_word: ἐνεργεῖται
  choice: يعمل
  rationale: ينقل معنى الفعل المستمر والمؤثر بلغة عربية مألوفة، من غير اللجوء إلى تعبير تقني مثل «يكون فاعلًا».
- source_word: ἡ δὲ ζωὴ
  choice: وأما الحياة
  rationale: «وأما» تبرز المقابلة بين الموت والحياة بوضوح، وتحافظ على التوازي البلاغي في العبارة.
- source_word: ἐν ὑμῖν
  choice: ففيكم
  rationale: يحفظ التوازي مع «فينا»، ويترك مفتوحًا أن يكون الأثر شخصيًا وجماعيًا.
theological_decisions:
- issue: دلالة المقابلة بين الموت والحياة
  choice: الإبقاء على «الموت» و«الحياة» دون تفسير داخل المتن، بحيث تشمل العبارة آلام الرسل الشبيهة بالموت والحياة التي تصل إلى الكورنثيين من خلال خدمتهم.
  alternative: حصر الموت في الموت الجسدي أو في الموت عن الذات، وحصر الحياة في النجاة الجسدية أو الحياة الأبدية وحدها.
  rationale: السياق السابق يتحدث عن موت يسوع وحياته ظاهرين في أجساد الرسل، بينما يتناول السياق الأوسع خدمة تحمل الحياة إلى الآخرين؛ لذلك ينبغي الحفاظ على التوتر الدلالي بدل تضييقه.
