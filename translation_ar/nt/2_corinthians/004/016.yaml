  text: Therefore we do not lose heart. But even if our outer man is wasting away[a], yet our inner man is being renewed day by day.
translation:
  language: ar
  text: لذلك لا نفشل. لكن، حتى إن كان إنساننا الخارجي يبلى، فإن إنساننا الداخلي يتجدّد يومًا بعد يوم.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: جانبنا الإنساني الخارجي وجانبنا الإنساني الداخلي. يستعمل النص اليوناني كلمة «إنسان» استعمالًا تمثيليًا، ويقيم تقابلًا مقصودًا بين الحياة الإنسانية الخارجية والداخلية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: لذلك
  rationale: تفيد الاستنتاج مما سبق، و«لذلك» واضحة وتحافظ على الترابط الحُجَجي.
- source_word: οὐκ ἐγκακοῦμεν
  choice: لا نفشل
  rationale: الفعل يدل هنا على فقدان العزم أو الاستسلام للإحباط؛ و«لا نفشل» تعبير عربي كتابي مفهوم لا يعني مجرد الإخفاق العملي.
- source_word: ἀλλ’ εἰ καὶ
  choice: بل حتى إن كان
  rationale: تحافظ العبارة على الاستدراك وعلى القوة التنازلية في التركيب اليوناني من غير تحويل الشرط صراحةً إلى تقرير سببي.
- source_word: ὁ ἔξω ἡμῶν ἄνθρωπος
  choice: إنساننا الخارجي
  rationale: يحفظ لفظ ἄνθρωπος المفرد والتقابل المقصود مع الإنسان الداخلي، من غير اختزال العبارة في الجسد وحده.
- source_word: διαφθείρεται
  choice: يبلى
  rationale: ينقل عملية التدهور المستمرة التي يدل عليها المضارع المبني للمجهول، بصياغة عربية طبيعية موجزة.
- source_word: ἀλλ’
  choice: فإن
  rationale: يُظهر جواب المقابلة بعد الجملة التنازلية بسلاسة عربية، مع بقاء التضاد بين البلى والتجدّد.
- source_word: ὁ ἔσω ἡμῶν
  choice: إنساننا الداخلي
  rationale: يُصرَّح بالمحذوف المفهوم من المقابلة، حفاظًا على التوازي المقصود مع «إنساننا الخارجي».
- source_word: ἀνακαινοῦται
  choice: يتجدّد
  rationale: صيغة المطاوعة العربية تنقل أن التجديد جارٍ على الإنسان الداخلي، والمضارع يحفظ الاستمرار.
- source_word: ἡμέρᾳ καὶ ἡμέρᾳ
  choice: يومًا بعد يوم
  rationale: المقابل العربي الطبيعي للعبارة التوزيعية الدالة على التجدد المتواصل.
theological_decisions:
- issue: التقابل الأنثروبولوجي بين ὁ ἔξω ἄνθρωπος وὁ ἔσω
  choice: إنساننا الخارجي / إنساننا الداخلي
  alternative: ذواتنا الخارجية / ذواتنا الداخلية؛ أو جسدنا / روحنا
  rationale: يحفظ الاختيار صورة النص وتوازيه من غير فرض ثنائية تقنية بين الجسد والروح أو تحديد مدلول الطرفين بأكثر مما يقوله السياق.
- issue: القوة التنازلية لعبارة εἰ καὶ
  choice: حتى إن كان
  alternative: مع أن
  rationale: يبقي الصياغة الشرطية التنازلية الظاهرة في اليونانية، بدل حسمها في صيغة تقريرية خالصة، مع أن السياق يقرّ بواقع البلى.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ التوازي البلاغي بين «إنساننا الخارجي» و«إنساننا الداخلي»، ووُضعت علامة الحاشية بعد الجملة التي تكتمل فيها المقابلة.
