  text: Διὰ τοῦτο, ἔχοντες τὴν διακονίαν ταύτην καθὼς ἠλεήθημεν, οὐκ ⸀ἐγκακοῦμεν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/001.yaml
  text: Therefore, since we have this ministry, just as we have received mercy, we do not lose heart.
translation:
  language: ar
  text: لذلك، إذ لنا هذه الخدمة، كما نلنا رحمة، لا نفقد عزيمتنا.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διακονία
  choice: الخدمة
  rationale: تنقل معنى الخدمة أو المهمة الموكلة في السياق الرسولي بلفظ عربي واضح ومألوف، من غير تضييق المعنى إلى منصب كنسي محدد.
- source_word: ἠλεήθημεν
  choice: نلنا رحمة
  rationale: صياغة عربية طبيعية تحفظ معنى تلقي الرحمة ولا تصرّح بفاعل لم يذكره النص اليوناني.
- source_word: ἐγκακοῦμεν
  choice: نفقد عزيمتنا
  rationale: يعبّر عن الوهن والاستسلام أمام المشقة، وهو المقصود هنا، بلغة عربية حديثة أوضح من النقل الحرفي المحتمل.
- source_word: καθὼς
  choice: كما
  rationale: يحافظ على أداة الربط في الأصل وعلى قدر من الانفتاح في تحديد علاقتها بما قبلها، بدل تحويلها صراحة إلى تعليل.
theological_decisions:
- issue: الفاعل الضمني في نوال الرحمة
  choice: نلنا رحمة
  alternative: رحمنا الله
  rationale: يحفظ المبني للمجهول الدال ضمنًا على الفاعل الإلهي من غير إضافة اسم الله الذي لا يرد صراحة في الآية.
- issue: صلة نوال الرحمة بالخدمة وعدم فقدان العزيمة
  choice: الإبقاء على «كما»
  alternative: فلأننا نلنا رحمة
  rationale: لا يحسم النص العربي العلاقة المنطقية على أنها سببية محضة، بل يصون تركيب καθὼς وما يحتمله من مقارنة أو بيان للكيفية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُعمل «إذ لنا» للمحافظة على بنية الجملة وظرفيتها، و«لا نفقد عزيمتنا» لتقديم معنى مفهوم للقارئ المعاصر من غير لهجة طائفية أو اصطلاح تقني.
