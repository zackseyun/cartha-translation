  text: ὅτι ὁ θεὸς ὁ εἰπών· Ἐκ σκότους φῶς ⸀λάμψει, ὃς ἔλαμψεν ἐν ταῖς καρδίαις ἡμῶν πρὸς φωτισμὸν τῆς γνώσεως τῆς δόξης τοῦ θεοῦ ἐν προσώπῳ ⸀Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/006.yaml
  text: For God[a], who said[c][b], “Light will shine out of darkness,” has shone in our hearts for the illumination of the knowledge of the glory of God in the face of Messiah.
translation:
  language: ar
  text: 'لأن الله، الذي قال: «سيشرق نور من الظلمة»[c]، هو الذي أشرق في قلوبنا، لإنارة معرفة مجد الله في وجه المسيح[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في شخص المسيح». وقد تعني العبارة اليونانية «في وجه المسيح» بمعناها المحسوس، فتحافظ على صورة المجد الإلهي الظاهر.'
    reason: alternative_reading
  - marker: b
    text: اليونانية Χριστοῦ، أي «المسيح» أو «الممسوح»، وهي هنا لقب.
    reason: lexical_alternative
  - marker: c
    text: 'تستحضر العبارة تكوين 1: 3، وتستخدم صورة نور الخلق لتصف عمل الله الكاشف في قلوب المؤمنين.'
    reason: cross_reference
lexical_decisions:
- source_word: ὅτι
  choice: لأن
  rationale: تؤدي هنا معنى التعليل، إذ تبيّن هذه الجملة أساس الكلام السابق.
- source_word: ὁ θεὸς ὁ εἰπών
  choice: الله، الذي قال
  rationale: نُقل اسم الفاعل المعرّف بصيغة جملة موصولة عربية واضحة وطبيعية.
- source_word: Ἐκ σκότους φῶς λάμψει
  choice: سيشرق نور من الظلمة
  rationale: تحافظ الصياغة على دلالة المستقبل في λάμψει وعلى صورة خروج النور من الظلمة التي تفيدها ἐκ.
- source_word: ὃς ἔλαμψεν
  choice: هو الذي أشرق
  rationale: يحافظ الفعل «أشرق» على الاستعمال غير المتعدي في اليونانية، ويبيّن الضمير الاستئناف النحوي بعد الجملة الموصولة.
- source_word: ἐν ταῖς καρδίαις ἡμῶν
  choice: في قلوبنا
  rationale: تحافظ العبارة على الاستعارة الكتابية المألوفة للقلب بوصفه باطن الإنسان.
- source_word: πρὸς φωτισμὸν
  choice: لإنارة
  rationale: تنقل الاسم φωτισμός بصيغة مصدر عربية موجزة، وتحافظ على غاية إشراق الله في القلوب.
- source_word: τῆς γνώσεως τῆς δόξης τοῦ θεοῦ
  choice: معرفة مجد الله
  rationale: تحافظ على ترابط سلسلة المضافات مع تجنب الثقل غير الطبيعي في العربية.
- source_word: ἐν προσώπῳ Χριστοῦ
  choice: في وجه المسيح
  rationale: «وجه» هو المعنى المحسوس المباشر لـπρόσωπον، كما يلائم سياق النور والمجد؛ و«المسيح» ينقل اللقب Χριστός نقلاً طبيعيًا راسخًا في العربية.
theological_decisions:
- issue: دلالة Χριστοῦ
  choice: المسيح
  alternative: الممسوح؛ أو استعمال «كريستوس» بوصفه اسمًا
  rationale: اللفظ اليوناني لقب معناه «الممسوح»، وتقابله «المسيح» في العربية دون إدخال تفسير مذهبي زائد.
- issue: دلالة ἐν προσώπῳ Χριστοῦ
  choice: في وجه المسيح
  alternative: في شخص المسيح
  rationale: اختير المعنى المحسوس الذي يحفظ صورة ظهور المجد والنور، مع إثبات الفهم الاصطلاحي الأوسع في الحاشية لأن العبارة تحتمل كليهما.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة ووقورة. حوفظ على الصورة الحسية للنور والظلمة والوجه، وعلى البناء التعليلي، من غير تسوية الاحتمال القائم بين معنى «الوجه» المحسوس ومعنى «الشخص» الاصطلاحي.
