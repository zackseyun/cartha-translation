source:
  edition: SBLGNT
  text: τὰ γὰρ πάντα δι’ ὑμᾶς, ἵνα ἡ χάρις πλεονάσασα διὰ τῶν πλειόνων τὴν εὐχαριστίαν περισσεύσῃ εἰς τὴν δόξαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/015.yaml
  text: For all things are for your sake[a], so that as grace increases through more and more people, thanksgiving may overflow to the glory of God.
translation:
  language: ar
  text: فإن كل هذا لأجلكم، لكي تُكثِر النعمةُ، إذ تزداد من خلال عددٍ متزايد من الناس[a]، الشكرَ لمجد الله.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «من خلال الكثيرين» أو «من خلال عدد أكبر». قد تشير العبارة اليونانية إلى كثرة الناس عمومًا أو إلى عدد آخذ في الازدياد.'
    reason: بديل معجمي يحفظ احتمالَي دلالة τῶν πλειόνων.
lexical_decisions:
- source_word: τὰ γὰρ πάντα
  choice: فهذا كله
  rationale: تفيد العبارة اليونانية الشمول، وتربط γὰρ الآية بما قبلها ربطًا تعليليًا. وصيغة «فهذا كله» عربية طبيعية تشير إلى مجمل ما وصفه بولس دون تضييق معناه.
- source_word: δι’ ὑμᾶς
  choice: من أجلكم
  rationale: تؤدي διά مع النصب هنا معنى المنفعة أو الغاية المقصودة، و«من أجلكم» أوضح من عبارة قد تُفهم على مجرد السببية.
- source_word: ἵνα
  choice: لكي
  rationale: تحفظ دلالة الغاية أو النتيجة المقصودة في الجملة.
- source_word: ἡ χάρις
  choice: النعمة
  rationale: تحفظ المصطلح اللاهوتي الواسع الدال على فضل الله وعمله الكريم، من غير حصره في آلية عقائدية أضيق.
- source_word: πλεονάσασα
  choice: تزداد
  rationale: اسم الفاعل اليوناني يدل على النمو أو التكاثر. وصياغته فعلًا مضارعًا في جملة الغاية واضحة وطبيعية في العربية.
- source_word: διὰ τῶν πλειόνων
  choice: من خلال عدد متزايد من الناس
  rationale: تحفظ العبارة معنى الوساطة في διά، كما تُظهر القوة المقارِنة في πλειόνων، التي قد تدل على عدد أكبر أو آخذ في الازدياد.
- source_word: τὴν εὐχαριστίαν περισσεύσῃ
  choice: فتُفيض الشكر
  rationale: جُعلت «النعمة» فاعلًا، كما في تركيب اليونانية، و«الشكر» مفعولًا به؛ أما «تُفيض» فتنقل صورة الوفرة التي يحملها περισσεύω بصياغة عربية موجزة.
- source_word: εἰς τὴν δόξαν τοῦ θεοῦ
  choice: لمجد الله
  rationale: تفيد εἰς هنا الغاية أو النتيجة، و«لمجد الله» تعبير عربي طبيعي يحفظ هذا الاتجاه الغائي.
theological_decisions:
- issue: مرجع «النعمة» وقوتها في جملة الغاية
  choice: الإبقاء على «النعمة» بوصفها فضل الله العامل والمتزايد في سياق خدمة بولس، دون تحديد آلية لاهوتية أضيق.
  alternative: فهمها تحديدًا على أنها نعمة الخلاص التي تبلغ مزيدًا من الناس، أو على أنها إحسان الله الذي يولّد شكرًا متكاثرًا.
  rationale: لا تحسم الآية أي جانب من هذين هو المقصود وحده، ولذلك تحافظ الصياغة على سعة اللفظ والتوتر الدلالي.
- issue: العلاقة النحوية بين النعمة والشكر
  choice: النعمة المتزايدة هي التي «تُفيض الشكر».
  alternative: صياغة «فيفيض الشكر» وجعل الشكر فاعلًا مستقلًا في العربية.
  rationale: النص اليوناني يجعل ἡ χάρις فاعل الفعل περισσεύσῃ، ويورد τὴν εὐχαριστίαν بالنصب؛ لذلك تحافظ الترجمة على كون النعمة سبب وفرة الشكر، من غير إضافة تفسير زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «فهذا كله» لربط التعليل بالسياق السابق، وحُفظت صورة ازدياد النعمة وفيضان الشكر مع تجنب الصياغة الحرفية المتعثرة.
