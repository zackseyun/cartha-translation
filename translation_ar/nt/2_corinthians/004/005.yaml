id: 2CO.4.5
reference: 2 Corinthians 4:5
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: οὐ γὰρ ἑαυτοὺς κηρύσσομεν ἀλλὰ ⸂Χριστὸν Ἰησοῦν⸃ κύριον, ἑαυτοὺς δὲ δούλους ὑμῶν διὰ Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/005.yaml
  text: For we do not proclaim ourselves[a], but Messiah Jesus as Lord[c][b], and ourselves as your servants for Jesus' sake.
translation:
  language: ar
  text: فإننا لا نعلن أنفسنا، بل نعلن المسيح يسوع ربًّا[a]، ونعلن أنفسنا عبيدًا لكم[b] من أجل يسوع[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ويجوز بحسب وجه آخر في تركيب العبارة: «المسيح يسوع الرب».'
    reason: نقل احتمال أن تكون «الرب» نعتًا أو لقبًا ملازمًا، بدل قراءة «ربًّا» خبرًا عن المسيح يسوع.
  - marker: b
    text: 'ويجوز: «خدّامًا لكم». اللفظ اليوناني قد يدل على العبيد أو الخدّام، وقد اختير «عبيدًا» هنا لإبراز شدة الخضوع في مقابل يسوع بوصفه الرب.'
    reason: بيان المجال الدلالي للفظ δοῦλοι وسبب اختيار اللفظ الأقوى.
  - marker: c
    text: 'أيضًا: «بسبب يسوع».'
    reason: بيان الصياغة البديلة لمعنى السبب أو الدافع في διὰ Ἰησοῦν.
lexical_decisions:
- source_word: κηρύσσομεν
  choice: نعلن
  rationale: يحفظ معنى الجهر بالرسالة وإبلاغها علنًا، من غير حصر الفعل في الوعظ الرسمي، كما أنه يلائم المفعولين المتقابلين في الآية.
- source_word: ἑαυτοὺς
  choice: أنفسنا
  rationale: 'نُقلت صيغة الضمير الانعكاسي في موضعيها لإبراز المقابلة: ليس الرسل مضمون إعلانهم، بل يصفون أنفسهم في علاقتهم بالمؤمنين.'
- source_word: Χριστὸν Ἰησοῦν
  choice: المسيح يسوع
  rationale: يحافظ على ترتيب الأصل اليوناني، ويعبّر «المسيح» عن اللقب المسياني مع إبقاء الاسم الشخصي «يسوع».
- source_word: κύριον
  choice: ربًّا
  rationale: جاءت حالًا خبرية بعد «المسيح يسوع» لتفيد أن مضمون الإعلان هو سيادة يسوع، من غير إضافة فعل صريح غير موجود في الأصل.
- source_word: δούλους
  choice: عبيدًا
  rationale: يحفظ القوة الدلالية للتبعية والخضوع في δοῦλος، وهي بارزة هنا في المقابلة بين يسوع بوصفه الرب والرسل بوصفهم عبيدًا للمؤمنين.
- source_word: ὑμῶν
  choice: لكم
  rationale: الصياغة العربية «عبيدًا لكم» طبيعية، وتنقل علاقة التبعية أو الخدمة التي تفيدها الإضافة اليونانية.
- source_word: διὰ Ἰησοῦν
  choice: من أجل يسوع
  rationale: 'مع διά والمفعول به، يدل التركيب هنا على السبب أو الدافع: صاروا عبيدًا للمؤمنين لأجل يسوع.'
theological_decisions:
- issue: هل Χριστός لقب أم جزء من اسم مركب؟
  choice: المسيح، بوصفه لقبًا
  alternative: «المسيح يسوع» بوصفه تركيبًا اسميًا مألوفًا دون إبراز قوة اللقب
  rationale: السياق يعرض مضمون الكرازة بهوية يسوع وسيادته، ولذلك تبقى دلالة اللقب المسياني حاضرة، مع الحفاظ على ترتيب العبارة اليونانية.
- issue: وظيفة κύριον في Χριστὸν Ἰησοῦν κύριον
  choice: «المسيح يسوع ربًّا»؛ أي إعلان المسيح يسوع بصفته الرب
  alternative: «المسيح يسوع الرب»
  rationale: النصب الخبري هو الأرجح بعد فعل الإعلان، ويحفظ بنية الأصل وإقراره بسيادة يسوع من غير تحويلها صراحة إلى جملة فعلية؛ وأُثبت البديل في الحاشية لصون الاحتمال التركيبي.
- issue: قوة δοῦλοι في وصف علاقة الرسل بالمؤمنين
  choice: عبيدًا
  alternative: خدّامًا
  rationale: لفظ «عبيد» يصون شدة الخضوع المقصودة، ولا سيما في المقابلة المقصودة مع «ربًّا»، من غير أن يجعل المؤمنين المصدر النهائي لخدمتهم، إذ تقيدها عبارة «من أجل يسوع».
translation_notes:
  register: العربية فصحى معاصرة واضحة ووقورة. اختير «نعلن» بدل «نكرز» لتكون العبارة مفهومة على نطاق واسع مع الحفاظ على معنى المناداة العلنية. كُرر الفعل في الشطرين لتستقيم العربية ويتضح التوازي، من غير تغيير المقابلة التي يقيمها النص اليوناني.
