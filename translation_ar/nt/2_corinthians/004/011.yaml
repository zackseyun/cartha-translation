  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἀεὶ γὰρ ἡμεῖς οἱ ζῶντες εἰς θάνατον παραδιδόμεθα διὰ Ἰησοῦν, ἵνα καὶ ἡ ζωὴ τοῦ Ἰησοῦ φανερωθῇ ἐν τῇ θνητῇ σαρκὶ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/011.yaml
  text: For we who are living are always being handed over to death for Jesus’ sake[b][a], so that the life of Jesus also may be revealed in our mortal flesh.
translation:
  language: ar
  text: لأننا نحن الأحياء نُسلَّم دائمًا إلى الموت من أجل يسوع[a]، لكي تظهر حياة يسوع أيضًا في جسدنا الفاني[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بسبب يسوع» أو «في سبيل يسوع».'
    reason: lexical_alternative
  - marker: b
    text: المقصود هنا الوجود الجسدي القابل للموت، لا «الطبيعة الخاطئة».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀεὶ
  choice: دائمًا
  rationale: ينقل معنى الاستمرار أو التكرار الملازم للسياق، بعبارة عربية مباشرة وطبيعية.
- source_word: γάρ
  choice: لأننا
  rationale: تحفظ أداة التعليل صلة الآية بما قبلها، وقد أُدمجت في الضمير لتستقيم العبارة العربية.
- source_word: ἡμεῖς οἱ ζῶντες
  choice: نحن الأحياء
  rationale: يحفظ التركيب الاسمي والتوكيد المقصود بالضمير، ويبرز المقابلة مع الموت.
- source_word: εἰς θάνατον
  choice: إلى الموت
  rationale: مع فعل التسليم تدل العبارة على الوجهة أو المصير، وهذه ترجمة موجزة وقريبة من الأصل.
- source_word: παραδιδόμεθα
  choice: نُسلَّم
  rationale: يحفظ المبني للمجهول والقوة الاستمرارية للفعل المضارع من غير تعيين الفاعل.
- source_word: διὰ Ἰησοῦν
  choice: من أجل يسوع
  rationale: ينقل διά مع النصب بما يحتمل السبب أو كون يسوع هو الذي لأجله يقع هذا التسليم، من غير حسم زائد.
- source_word: ἵνα
  choice: لكي
  rationale: تحفظ دلالة الغاية، مع بقاء احتمال النتيجة الملازم للسياق.
- source_word: καὶ
  choice: أيضًا
  rationale: تحفظ الموازاة بين التسليم إلى الموت وظهور حياة يسوع.
- source_word: ἡ ζωὴ τοῦ Ἰησοῦ
  choice: حياة يسوع
  rationale: يحفظ الإضافة كما في اليونانية ويُبقي المقابلة اللاهوتية بين الحياة والموت.
- source_word: φανερωθῇ
  choice: تظهر
  rationale: صيغة عربية طبيعية تحفظ معنى الانكشاف أو الصيرورة ظاهرة، من غير إضافة فاعل غير مذكور.
- source_word: ἐν τῇ θνητῇ σαρκὶ ἡμῶν
  choice: في جسدنا البشري المائت
  rationale: السياق يدل على الوجود الجسدي القابل للموت. أضيف وصف «البشري» لإبقاء صلة σάρξ باللحم والوجود المتجسد، مع تجنب الإيحاء بأن المقصود «الطبيعة الخاطئة».
theological_decisions:
- issue: دلالة σάρξ في السياق البولسي
  choice: جسدنا البشري المائت
  alternative: لحمنا المائت؛ جسدنا المائت؛ طبيعتنا الخاطئة
  rationale: المقصود هنا الوجود الجسدي الضعيف والمعرّض للموت، لا مبدأ أخلاقيًا للخطيئة. «الجسد البشري» عربي واضح ويحفظ الدلالة التجسدية، بينما «الطبيعة الخاطئة» تفسير غير مناسب للسياق.
- issue: دلالة διὰ Ἰησοῦν
  choice: من أجل يسوع
  alternative: بسبب يسوع؛ في سبيل يسوع
  rationale: التركيب اليوناني يحتمل السبب وكون يسوع هو الذي لأجله يُحتمل الموت. «من أجل يسوع» يحفظ هذا الاتساع أفضل من صياغة تحسم أحد الوجهين.
- issue: دلالة ἵνα بين الغاية والنتيجة
  choice: لكي
  alternative: حتى
  rationale: «لكي» تعبّر بوضوح عن الغاية، مع عدم إنكار ما في السياق من نتيجة فعلية، ولا تضيف فاعلًا أو آلية لظهور الحياة.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ووقورة. استُعمل «نُسلَّم» للمبني للمجهول، و«نحن الأحياء» لإبراز التوكيد والمقابلة. وُضع كل مؤشر حاشية في المتن، مع ترتيب الحواشي بحسب ظهورها.
