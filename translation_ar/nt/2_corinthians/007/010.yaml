  text: ἡ γὰρ κατὰ θεὸν λύπη μετάνοιαν εἰς σωτηρίαν ἀμεταμέλητον ⸀ἐργάζεται· ἡ δὲ τοῦ κόσμου λύπη θάνατον κατεργάζεται.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/010.yaml
  text: For godly sorrow produces repentance leading to salvation without regret[b][a], but worldly sorrow produces death.
translation:
  language: ar
  text: لأن الحزن الذي بحسب الله يُنتج توبةً تؤدي إلى الخلاص لا يُندم عليها[a]، أما حزن العالم فيُنتج الموت.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «توبة لا يُندم عليها تؤدي إلى الخلاص». والصفة اليونانية يمكن أن تُفهم وصفًا للتوبة مباشرة، أو ضمن عبارة التوبة المؤدية إلى الخلاص.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ θεὸν
  choice: الذي بحسب الله
  rationale: ينقل العبارة اليونانية بصورة قريبة وواضحة، ويدل على حزن منسجم مع الله أو موافق لمشيئته من غير حصر المعنى في تفسير واحد.
- source_word: λύπη
  choice: الحزن
  rationale: المقابل العربي الطبيعي الذي يلائم طرفي المقابلة ويحفظ البعد الوجداني والأخلاقي في السياق.
- source_word: μετάνοιαν
  choice: توبةً
  rationale: «التوبة» هي المقابل العربي المستقر الذي يفيد هنا تحولًا أخلاقيًا وروحيًا، لا مجرد تغيير ذهني.
- source_word: εἰς σωτηρίαν
  choice: تؤدي إلى الخلاص
  rationale: تعبّر عن جهة التوبة أو نتيجتها من غير صياغة سببية أشد مما يقتضيه النص.
- source_word: ἀμεταμέλητον
  choice: ولا يُندم عليها
  rationale: أُلحق الضمير بالتوبة، وهو الارتباط النحوي الأرجح لأن الصفة اليونانية مؤنثة مفردة منصوبة وتوافق μετάνοιαν، مع إبقاء دلالة عدم الندم واضحة.
- source_word: ἐργάζεται
  choice: يُنشئ
  rationale: يدل على إحداث النتيجة، ويأتي طبيعيًا مع الحزن والتوبة.
- source_word: τοῦ κόσμου
  choice: العالم
  rationale: «حزن العالم» يحفظ تركيب الإضافة والمقابلة مع الحزن الذي بحسب الله، من غير توسيع تفسيري.
- source_word: θάνατον
  choice: الموت
  rationale: ترجمة مباشرة تحفظ اتساع المرجع، فلا تحدده بالموت الجسدي أو الروحي أو الأخروي.
- source_word: κατεργάζεται
  choice: يُنشئ
  rationale: يحفظ التوازي البلاغي مع ἐργάζεται؛ والفارق الصرفي بين الفعلين لا يستدعي هنا اختلافًا عربيًا قد يوحي بفارق دلالي أكبر.
theological_decisions:
- issue: طبيعة المقابلة بين نوعي الحزن
  choice: الحزن الذي بحسب الله في مقابل حزن العالم
  alternative: الحزن الإلهي في مقابل الحزن الدنيوي
  rationale: الصياغة المختارة أقرب إلى تركيب اليونانية وتحفظ إمكان فهمه حزنًا موافقًا لله أو لمشيئته، بلا إيحاء بأن الحزن نفسه صفة إلهية.
- issue: علاقة التوبة بالخلاص
  choice: توبة تؤدي إلى الخلاص
  alternative: توبة للخلاص أو توبة تُنتج الخلاص
  rationale: تحفظ دلالة الغاية أو النتيجة في εἰς، من غير تقرير آلية خلاصية أو سببية مذهبية لا يحددها النص.
- issue: مرجع «لا يُندم عليها»
  choice: التوبة
  alternative: الخلاص أو مجمل مسار التوبة المؤدية إلى الخلاص
  rationale: المطابقة النحوية في اليونانية ترجّح وصف التوبة مباشرة، مع بقاء العبارة كلها مرتبطة بالتوبة التي تؤدي إلى الخلاص.
- issue: معنى الموت
  choice: إبقاء «الموت» مطلقًا
  alternative: الموت الروحي أو الهلاك الأبدي
  rationale: لا يحدد العدد نوع الموت، ولذلك تُحفظ سعته الدلالية ولا يُفرض عليه تفسير عقائدي أضيق.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «بحسب الله» للمحافظة على قرب العبارة من الأصل، و«يُنشئ» في الشطرين لصون التوازي. وُضع مؤشر الحاشية مباشرة بعد العبارة التي يشرحها.
