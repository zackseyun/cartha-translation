id: 2CO.7.1
reference: 2 Corinthians 7:1
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ταύτας οὖν ἔχοντες τὰς ἐπαγγελίας, ἀγαπητοί, καθαρίσωμεν ἑαυτοὺς ἀπὸ παντὸς μολυσμοῦ σαρκὸς καὶ πνεύματος, ἐπιτελοῦντες ἁγιωσύνην ἐν φόβῳ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/001.yaml
  text: Therefore[a], since we have these promises, beloved, let us cleanse ourselves from every defilement of flesh and spirit[c][b], bringing holiness to completion in the fear of God.
translation:
  language: ar
  text: فبما أن لنا هذه المواعيد، أيها الأحباء، لِنُطَهِّر أنفسنا من كل دنس الجسد والروح[a]، مُكمِلين القداسة[b] في مخافة الله[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ويجوز: «من كل نجاسة البدن والروح».'
    reason: بديل معجمي يوضح أن «الجسد» هنا قد يدل على الجانب البدني من الإنسان، وأن «الدنس» يمكن أن يترجم «نجاسة».
  - marker: b
    text: 'ويجوز: «بالغين بالقداسة إلى تمامها».'
    reason: بديل تعبيري يبرز معنى إتمام القداسة أو السير بها إلى غايتها.
  - marker: c
    text: تفيد «مخافة الله» هنا رهبةً توقيرية أمام الله، لا مجرد الذعر.
    reason: إيضاح دلالي يحفظ قوة لفظ الخوف مع بيان طابعه التوقيري في السياق.
lexical_decisions:
- source_word: ταύτας οὖν ἔχοντες τὰς ἐπαγγελίας
  choice: فإذ لنا هذه المواعيد
  rationale: تنقل العبارة امتلاك المواعيد المشار إليها في السياق السابق، وتحفظ «فـ» الاستنتاج الذي تدل عليه οὖν، مع صياغة عربية واضحة غير متكلفة.
- source_word: ἀγαπητοί
  choice: أيها الأحباء
  rationale: نداء دافئ وموقر شائع في الرسائل، يحفظ معنى المحبة ونبرة المخاطبة المباشرة.
- source_word: καθαρίσωμεν ἑαυτοὺς
  choice: لِنُطَهِّر أنفسنا
  rationale: صيغة تحضيضية شاملة للكاتب والقراء، تنقل قوة صيغة المتكلم الجمع في اليونانية وتحافظ على صلة التطهير بالدنس المذكور بعدها.
- source_word: ἀπὸ παντὸς μολυσμοῦ
  choice: من كل دنس
  rationale: «دنس» ينقل معنى التلوث أو النجاسة الأخلاقية والدينية، ويلائم سياق القداسة.
- source_word: σαρκὸς καὶ πνεύματος
  choice: الجسد والروح
  rationale: يحفظ التقابل بين البعد الجسدي والبعد الروحي في الإنسان من غير تفسير σάρξ هنا على أنه «الطبيعة الخاطئة».
- source_word: ἐπιτελοῦντες ἁγιωσύνην
  choice: مُكمِلين القداسة
  rationale: تنقل اسم الفاعل المصاحب للتحريض ومعنى السير بالقداسة إلى التمام، مع إبقاء العلاقة النحوية موجزة كما في الأصل.
- source_word: ἐν φόβῳ θεοῦ
  choice: في مخافة الله
  rationale: تحفظ التعبير الكتابي وقوته، ولا تختزله في مجرد الاحترام، مع إمكان فهمه بوصفه خوفًا مشوبًا بالتوقير والرهبة.
theological_decisions:
- issue: معنى σάρξ في التقابل «الجسد والروح»
  choice: الجسد
  alternative: البدن؛ الطبيعة الخاطئة
  rationale: اقتران اللفظة بالروح في سياق الدنس يشير إلى أبعاد الإنسان الجسدية والباطنية معًا؛ أما «الطبيعة الخاطئة» فتفرض تفسيرًا تخصصيًا لا يقتضيه السياق.
- issue: قوة καθαρίσωμεν التحضيضية
  choice: لِنُطَهِّر أنفسنا
  alternative: ينبغي أن نطهر أنفسنا
  rationale: صيغة المتكلم الجمع التحضيضية تضم بولس وقراءه في النداء، وهي أقوى وأقرب إلى الأصل من مجرد تقرير الواجب.
- issue: دلالة φόβος في «مخافة الله»
  choice: مخافة الله
  alternative: توقير الله
  rationale: «المخافة» تحفظ شدة التعبير الكتابي والتوتر بين الخوف والتوقير، بدل تسطيح الدلالة إلى الاحترام وحده.
- issue: دلالة ἐπιτελοῦντες مع القداسة
  choice: مُكمِلين القداسة
  alternative: بالغين بالقداسة إلى تمامها
  rationale: تحفظ الصياغة المختارة إمكان فهم العبارة على أنها إتمام عملي لمسيرة القداسة، من غير الإيحاء بادعاء كمال مطلق آني.
translation_notes:
  register: العربية فصحى حديثة واضحة ذات نبرة كتابية موقرة. استُعملت «المواعيد» و«مخافة الله» للمحافظة على الرنين الكتابي المألوف، مع تجنب التراكيب القديمة الغامضة والتفسيرات الطائفية.
