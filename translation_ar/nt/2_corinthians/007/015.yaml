source:
  edition: SBLGNT
  text: καὶ τὰ σπλάγχνα αὐτοῦ περισσοτέρως εἰς ὑμᾶς ἐστιν ἀναμιμνῃσκομένου τὴν πάντων ὑμῶν ὑπακοήν, ὡς μετὰ φόβου καὶ τρόμου ἐδέξασθε αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/015.yaml
  text: And his affection for you is even greater as he remembers the obedience of all of you[a], how you received him with fear and trembling.
translation:
  language: ar
  text: وتزداد مودته لكم حين يتذكر طاعة جميعكم، وكيف قبلتموه بخوف ورعدة[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بتوقير ورعدة». وعبارة «خوف ورعدة» تعبير بولسي يدل على استجابة جادة ومتواضعة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σπλάγχνα
  choice: مودته
  rationale: اللفظ يشير حرفيًا إلى الأحشاء، لكنه يُستعمل مجازًا للمشاعر العميقة والحنان؛ و«مودته» عربية طبيعية تحفظ القوة العاطفية في السياق.
- source_word: περισσοτέρως
  choice: تزداد
  rationale: ينقل معنى المقارنة وازدياد درجة مودة تيطس لهم، مع صياغة عربية سلسة.
- source_word: εἰς ὑμᾶς
  choice: لكم
  rationale: تعبّر اللام تعبيرًا عربيًا طبيعيًا عن اتجاه المودة نحو المخاطَبين.
- source_word: ἀναμιμνῃσκομένου
  choice: حين يتذكر
  rationale: ينقل الظرف المصاحب الذي يربط ازدياد المودة بتذكّر تيطس لما حدث.
- source_word: ὑπακοήν
  choice: طاعة
  rationale: المقابل المباشر للاسم اليوناني، ويحفظ معنى استجابتهم العملية للتوجيه الرسولي دون تخفيفه إلى مجرد تجاوب.
- source_word: πάντων ὑμῶν
  choice: جميعكم
  rationale: يحفظ تأكيد النص أن الطاعة شملت الجماعة كلها.
- source_word: μετὰ φόβου καὶ τρόμου
  choice: بخوف ورعدة
  rationale: يحفظ التعبير البولسي وصورته القوية دون حسمه في المتن إلى خوف حرفي أو توقير وحده.
- source_word: ἐδέξασθε
  choice: قبلتموه
  rationale: فعل عربي واسع الدلالة يشمل الاستقبال والقبول، من غير إضافة تفسير زائد.
- source_word: αὐτόν
  choice: ـه
  rationale: الإبقاء على الضمير كما في اليونانية، ومرجعه تيطس واضح من السياق السابق.
theological_decisions:
- issue: دلالة «بخوف ورعدة» في استقبال الكورنثيين لتيطس
  choice: الإبقاء على التعبير «بخوف ورعدة» في المتن، مع بيان دلالته السياقية المحتملة في الحاشية
  alternative: «بتوقير ورعدة» أو فهمه على أنه خوف حرفي
  rationale: التعبير بولسي معروف يوحي بالجدية المتواضعة والتوقير، لكنه يحتفظ أيضًا بلفظ الخوف؛ لذلك تُصان دلالته المتوترة في المتن ولا تُختزل إلى تفسير واحد.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. استُخدمت «مودته» بدل الترجمة الحرفية للأحشاء، وحُفظ التعبير الاصطلاحي «بخوف ورعدة» مع توضيح موجز في الحاشية.
