source:
  edition: SBLGNT
  text: ἄρα εἰ καὶ ἔγραψα ὑμῖν, οὐχ ⸀ἕνεκεν τοῦ ἀδικήσαντος, ⸀οὐδὲ ⸁ἕνεκεν τοῦ ἀδικηθέντος, ἀλλ’ ⸀1ἕνεκεν τοῦ φανερωθῆναι τὴν σπουδὴν ὑμῶν τὴν ὑπὲρ ἡμῶν πρὸς ὑμᾶς ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/012.yaml
  text: So even if I wrote to you[a], it was not because of the one who did wrong, nor because of the one who was wronged[b], but so that your earnestness for us might be made known among you before God.
translation:
  language: ar
  text: 'لذلك، وإن كنت قد كتبت إليكم، فلم يكن ذلك من أجل من ارتكب الظلم، ولا من أجل من وقع عليه الظلم، بل لكي يظهر بينكم أمام الله اهتمامكم الجادّ[b] بنا.[a]


    [a] تقرأ بعض المخطوطات: «لكي يظهر بينكم أمام الله اهتمامنا الجادّ بكم».


    [b] أو: «اجتهادكم»، أو «غيرتكم»، أو «اهتمامكم العميق».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ بعض المخطوطات: «لكي يظهر بينكم أمام الله اهتمامنا الجادّ بكم».'
    reason: textual_variant
  - marker: b
    text: 'أو: «اجتهادكم»، أو «غيرتكم»، أو «اهتمامكم العميق».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα εἰ καὶ
  choice: لذلك، حتى إن
  rationale: تنقل «لذلك» دلالة الاستنتاج في ἄρα، وتحفظ «حتى إن» القوة التنازلية في εἰ καὶ بصياغة عربية واضحة.
- source_word: ἔγραψα
  choice: كنت قد كتبت
  rationale: تشير الصيغة إلى رسالة سابقة لبولس، ويؤدي الماضي التام هذا المعنى بوضوح في السياق.
- source_word: οὐχ ἕνεκεν
  choice: فلم يكن ذلك من أجل
  rationale: تحفظ العبارة احتمال دلالة السبب أو الغرض في ἕνεκεν، مع استكمال ما يلزم لسلامة العربية.
- source_word: τοῦ ἀδικήσαντος
  choice: من ارتكب الظلم
  rationale: تعكس اسم الفاعل المبني على الفعل دون اختزاله في وصف قانوني مثل «الجاني».
- source_word: τοῦ ἀδικηθέντος
  choice: من وقع عليه الظلم
  rationale: تحفظ المبني للمجهول والتوازي مع العبارة السابقة، من غير تحديد هوية الشخص أو طبيعة الإساءة.
- source_word: ἀλλ’ ἕνεκεν τοῦ φανερωθῆναι
  choice: بل لكي يظهر
  rationale: تنقل غرض الكتابة وتحفظ الدلالة المبنية للمجهول من حيث كون الأمر قد صار ظاهرًا، بصياغة عربية طبيعية.
- source_word: τὴν σπουδὴν ὑμῶν
  choice: اهتمامكم الجادّ
  rationale: تعبر σπουδή هنا عن الاهتمام الحريص والجدية؛ وتورد الحاشية البدائل الممكنة مثل الاجتهاد والغيرة.
- source_word: τὴν ὑπὲρ ἡμῶν
  choice: بنا
  rationale: تعبّر عن توجّه اهتمام الكورنثيين نحو بولس ورفقائه من غير إضافة معنى دفاعي أو نيابي غير لازم.
- source_word: πρὸς ὑμᾶς
  choice: بينكم
  rationale: تعكس القراءة السياقية للعبارة الصعبة على أن هذا الاهتمام صار ظاهرًا في وسط المخاطَبين، مع إبقاء توتر التركيب بدل شرحه داخل النص.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: أمام الله
  rationale: صياغة موجزة ومألوفة تحفظ إطار حضور الله وشهادته.
theological_decisions:
- issue: مرجع الاهتمام والعلاقة بين «اهتمامكم بنا» و«بينكم» في تركيب نحوي صعب
  choice: اهتمامكم الجادّ بنا ... يظهر بينكم أمام الله
  alternative: اهتمامنا الجادّ بكم ... يظهر بينكم أمام الله
  rationale: 'يتبع النص الرئيسي قراءة SBLGNT: ὑμῶν «اهتمامكم»، وὑπὲρ ἡμῶν «بنا»، وπρὸς ὑμᾶς «بينكم». ولأن هناك قراءة مخطوطية معروفة تجعل الاهتمام لبولس ورفقائه تجاه الكورنثيين، أُبقيت في الحاشية بدل إدخالها في المتن.'
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت عبارات شخصية مباشرة بدل المصطلحات القانونية المتخصصة، وحُفظ التركيب الصعب في خاتمة الآية دون تسويته تفسيريًا. وُضعت علامتا الحاشيتين عند العبارة التي تخص كلًّا منهما.
