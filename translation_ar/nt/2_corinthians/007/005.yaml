  yaml_path: translation/nt/2_corinthians/007/005.yaml
  text: For even when we came into Macedonia[a], our flesh had no rest, but we were afflicted in every way—conflicts on the outside, fears on the inside—
translation:
  language: ar
  text: 'فإننا حين أتينا إلى مقدونية، لم يكن لجسدنا أيُّ راحة[a]، بل كنا في ضيق من كل جهة: صراعات من الخارج، ومخاوف من الداخل.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لم نجد نحن أنفسنا أيَّ راحة». يقرأ النص اليوناني حرفيًا: «لم يكن لجسدنا أيُّ راحة»، وهي عبارة تدل هنا على الضعف والضيق البشريين.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ γὰρ
  choice: فحتى
  rationale: تفيد العبارة الربط التفسيري بالسياق السابق مع شيء من التوكيد، و«فحتى» تؤدي الوظيفتين بإيجاز طبيعي في العربية.
- source_word: ἐλθόντων ἡμῶν εἰς Μακεδονίαν
  choice: حين أتينا إلى مَكِدُونِيَّة
  rationale: التركيب الإضافي المطلق يؤدي معنى زمنيًا؛ فصيغ بعبارة عربية واضحة، مع نقل εἰς بحرف الغاية «إلى».
- source_word: οὐδεμίαν ἔσχηκεν ἄνεσιν
  choice: لم يكن ... أيُّ راحة
  rationale: تفيد ἄνεσις الراحة أو الفرج من الضغط، وهذه الصياغة تحفظ النفي المطلق وتلائم السياق.
- source_word: ἡ σὰρξ ἡμῶν
  choice: جسدنا
  rationale: يحفظ «جسدنا» الصورة الحسية في الأصل، ويشير هنا إلى الضعف والضيق البشريين في الوجود الجسدي، لا إلى «الطبيعة الخاطئة». وأُثبت المعنى العربي الأكثر سلاسة في الحاشية.
- source_word: ἀλλ’ ἐν παντὶ θλιβόμενοι
  choice: بل كنا في ضيق من كل جهة
  rationale: ينقل معنى التعرض للضغط والضيق، ويصوغ ἐν παντί تعبيرًا عربيًا طبيعيًا يدل على شمول الضيق.
- source_word: ἔξωθεν μάχαι
  choice: صراعات من الخارج
  rationale: قد تشير μάχαι إلى خصومات أو نزاعات، ولا يلزم منها قتال حرفي؛ و«صراعات» تحفظ عموم المعارضة الخارجية.
- source_word: ἔσωθεν φόβοι
  choice: مخاوف من الداخل
  rationale: تحفظ العبارة معنى φόβοι وتقابل بوضوح بين الضيق الخارجي والداخلي.
theological_decisions:
- issue: دلالة σάρξ في السياق
  choice: جسدنا
  alternative: لم نجد نحن أنفسنا أي راحة
  rationale: لا يستعمل بولس σάρξ هنا بمعنى الفساد الأخلاقي أو «الطبيعة الخاطئة»، بل يشير إلى الإنسان في ضعفه الجسدي والنفسي تحت الضيق. لذلك حُفظت الصورة الأصلية في المتن، مع البديل التفسيري في الحاشية من غير حسم زائد.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ووقورة. حُفظ التقابل البلاغي بين «من الخارج» و«من الداخل»، واستُعملت النقطتان لإبراز العبارتين التفسيريتين المتوازيتين.
