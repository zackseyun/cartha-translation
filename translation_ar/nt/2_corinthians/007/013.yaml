  to: لِهٰذَا قَدْ تَعَزَّيْنَا[a]. وَفَوْقَ تَعْزِيَتِنَا، فَرِحْنَا أَكْثَرَ جِدًّا بِفَرَحِ تِيطُسَ، لِأَنَّ رُوحَهُ قَدِ انْتَعَشَتْ مِنْ جَمِيعِكُمْ[b].
  rationale: عُدِّل الفعل الأخير إلى «انتعشت» لأنه ينقل بوضوح معنى ἀναπέπαυται في هذا السياق، وعُدِّلت العلاقة بالجماعة إلى «من جميعكم» لتؤدي دلالة المصدر في ἀπὸ πάντων ὑμῶν. وأُضيفت «قد» إلى الفعل الأول للمحافظة على أثر صيغة التام. ولا يغيّر أي تعديل معنى المقطع أو يحسم مسألة تفسيرية متنازعًا عليها.
