  text: διὰ τοῦτο παρακεκλήμεθα. Ἐπὶ δὲ τῇ παρακλήσει ⸀ἡμῶν περισσοτέρως μᾶλλον ἐχάρημεν ἐπὶ τῇ χαρᾷ Τίτου, ὅτι ἀναπέπαυται τὸ πνεῦμα αὐτοῦ ἀπὸ πάντων ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/013.yaml
  text: For this reason we have been comforted[a]. And in addition to our comfort, we rejoiced even more abundantly at Titus’s joy[b], because his spirit has been refreshed by all of you.
translation:
  language: ar
  text: لِهٰذَا قَدْ تَعَزَّيْنَا[a]. وَفَوْقَ تَعْزِيَتِنَا، فَرِحْنَا أَكْثَرَ جِدًّا بِفَرَحِ تِيطُسَ، لِأَنَّ رُوحَهُ قَدِ انْتَعَشَتْ مِنْ جَمِيعِكُمْ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «تَشَجَّعْنَا»؛ فقد يدل اللفظ اليوناني هنا على التعزية أو التشجيع.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «استراحت روحه» أو «وجدت روحه راحةً».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: لِهٰذَا
  rationale: أداة ربط سببية موجزة وطبيعية، تحفظ رجوع العبارة إلى ما سبق.
- source_word: παρακεκλήμεθα
  choice: تَعَزَّيْنَا
  rationale: ينقل معنى نوال التعزية مع بقاء أثرها، ويلائم سياق الضيق والفرح؛ ويمكن أن يفيد الفعل اليوناني أيضًا التشجيع.
- source_word: Ἐπὶ δὲ τῇ παρακλήσει ἡμῶν
  choice: وَفَوْقَ تَعْزِيَتِنَا
  rationale: يفيد أن الفرح الآتي كان زائدًا على التعزية التي نالوها، بصياغة عربية واضحة.
- source_word: περισσοτέρως μᾶλλον
  choice: أَكْثَرَ جِدًّا
  rationale: يحفظ تراكم صيغتي التفضيل والتوكيد في اليونانية من غير تركيب عربي متكلف.
- source_word: ἐχάρημεν ἐπὶ τῇ χαρᾷ Τίτου
  choice: فَرِحْنَا ... بِفَرَحِ تِيطُسَ
  rationale: يحافظ على التكرار المقصود بين الفعل والاسم، ويعبّر عن باعث الفرح تعبيرًا عربيًا طبيعيًا.
- source_word: ἀναπέπαυται τὸ πνεῦμα αὐτοῦ
  choice: رُوحَهُ قَدِ اسْتَرَاحَتْ
  rationale: يحفظ صورة الراحة وحالة الحاضر الناتجة عن فعل سابق، مع إبقاء لفظ «روحه» الأنثروبولوجي المباشر.
- source_word: ἀπὸ πάντων ὑμῶν
  choice: بِكُمْ جَمِيعًا
  rationale: ينقل معنى أن الجماعة كلها كانت مصدر راحة تيطس، ويتجنب الحرفية الملتبسة لعبارة «منكم».
theological_decisions:
- issue: دلالة τὸ πνεῦμα αὐτοῦ
  choice: روح تيطس، أي ذاته الباطنة أو حاله الداخلية
  alternative: الروح القدس
  rationale: الضمير «ـه» والسياق العاطفي المتعلق باستجابة تيطس لأهل كورنثوس يدلان على روحه البشرية، لا على الروح القدس.
- issue: مدى معنى παρακαλέω / παράκλησις
  choice: التعزية
  alternative: التشجيع
  rationale: السياق القريب يدعم التعزية، لكن المجال الدلالي اليوناني يسمح بالتشجيع أيضًا؛ لذلك حُفظ البديل في الحاشية بدل حسمه ضمنًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. حُفظ التكرار البلاغي بين «فرحنا» و«فرح»، وأُبقيت «روحه» بدل تفسيرها في المتن بعبارة نفسية أضيق.
