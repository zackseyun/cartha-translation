base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/002.yaml
  text: Make room for us[a]. We have wronged no one, corrupted no one[b], taken advantage of no one.
translation:
  language: ar
  text: أَفْسِحُوا لنا مكانًا[a]. لم نظلم أحدًا، ولم نُفسد أحدًا[b]، ولم نستغلّ أحدًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو «اقبلونا» أو «افتحوا لنا قلوبكم». يقول اليوناني حرفيًا: «أفسحوا لنا مكانًا»، ويُرجَّح أنه يواصل الصورة العلائقية الواردة في 6:11–13.'
    reason: lexical_alternative
  - marker: b
    text: أو «لم نُهلك أحدًا» أو «لم نُضلّ أحدًا».
    reason: lexical_alternative
lexical_decisions:
- source_word: Χωρήσατε
  choice: أَفْسِحُوا لنا مكانًا
  rationale: فعل أمر يدل حرفيًا على إفساح المكان، ويُستعمل هنا مجازيًا في طلب القبول العلائقي. يحفظ التعبير الصورة المتصلة بسياق 6:11–13 من غير أن يضيف «في قلوبكم» إلى المتن.
- source_word: ἡμᾶς
  choice: لنا
  rationale: ضمير المتكلمين مفعول الفعل في اليونانية، وصيغة «أفسحوا لنا مكانًا» هي التعبير العربي الطبيعي المقابل.
- source_word: οὐδένα
  choice: أحدًا
  rationale: تكرر اللفظ ثلاث مرات مع النفي للتوكيد؛ وحُفظ هذا التكرار البلاغي في العربية.
- source_word: ἠδικήσαμεν
  choice: ظلمنا
  rationale: ينقل المعنى الواسع للفعل ἀδικέω، أي إيقاع الظلم أو الإساءة بأحد، من غير تخصيص نوع الضرر.
- source_word: ἐφθείραμεν
  choice: أفسدنا
  rationale: يحفظ المجال الدلالي للفعل φθείρω، الذي قد يعني الإفساد أو الإهلاك، ويلائم هنا احتمال الضرر الأخلاقي أو الروحي من غير حسم زائد.
- source_word: ἐπλεονεκτήσαμεν
  choice: استغللنا
  rationale: ينقل معنى الانتفاع الجشع من شخص أو استغلاله، ويبقى أوسع من «احتلنا عليه» أو «سلبناه»، اللتين تحصران المعنى في الاحتيال المالي.
theological_decisions:
- issue: طبيعة الطلب في Χωρήσατε ἡμᾶς
  choice: طلب علائقي بأن يفسحوا لبولس ورفقائه مكانًا لديهم
  alternative: اقبلونا أو افتحوا لنا قلوبكم
  rationale: يشير السياق القريب في 6:11–13 إلى اتساع العواطف والقبول. أبقى المتن استعارة «المكان» من غير إدخال «القلوب» صراحة، لأن ذلك تفسير مرجح لا لفظ وارد في هذه الآية.
- issue: مدى معنى ἐφθείραμεν
  choice: لم نُفسد أحدًا
  alternative: لم نُهلك أحدًا أو لم نُضلّ أحدًا
  rationale: اللفظ اليوناني يحتمل الإفساد والإهلاك، وقد يكون المقصود هنا الضرر الأخلاقي أو الروحي. «أفسدنا» يحفظ هذا الاتساع ولا يحدد نوع الفساد دون قرينة قاطعة.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. حُفظ التوازي الثلاثي «لم... أحدًا» وقوة نفي بولس، مع إبقاء استعارة إفساح المكان في مطلع الآية.
