id: 2CO.7.7
reference: 2 Corinthians 7:7
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: οὐ μόνον δὲ ἐν τῇ παρουσίᾳ αὐτοῦ, ἀλλὰ καὶ ἐν τῇ παρακλήσει ᾗ παρεκλήθη ἐφ’ ὑμῖν, ἀναγγέλλων ἡμῖν τὴν ὑμῶν ἐπιπόθησιν, τὸν ὑμῶν ὀδυρμόν, τὸν ὑμῶν ζῆλον ὑπὲρ ἐμοῦ, ὥστε με μᾶλλον χαρῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/007.yaml
  text: and not only by his coming, but also by the comfort with which he was comforted because of you, as he reported to us your longing, your mourning, and your zeal for me, so that I rejoiced even more.
translation:
  language: ar
  text: وليس بمجيئه فقط، بل أيضًا بالتعزية التي تعزّى بها بسببكم، إذ أخبرنا بشوقكم، ونحيبكم[a]، وغيرتكم لأجلي، حتى ازددت فرحًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «حزنكم الشديد».'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρουσίᾳ
  choice: مجيئه
  rationale: في سياق سفر تيطس ووصوله، تدل الكلمة على المجيء أو الحضور الشخصي؛ و«مجيئه» توضح الحدث بصورة طبيعية.
- source_word: παρακλήσει / παρεκλήθη
  choice: بالتعزية التي تعزّى بها
  rationale: تحافظ الصياغة على الصلة الاشتقاقية بين الاسم والفعل، وتناسب سياق الراحة بعد الضيق.
- source_word: ἐφ’ ὑμῖν
  choice: بسببكم
  rationale: تفيد العبارة هنا المناسبة أو السبب الذي نشأت عنه تعزية تيطس، أي ما وجده لدى أهل كورنثوس.
- source_word: ἀναγγέλλων
  choice: إذ أخبرنا
  rationale: يبيّن اسم الفاعل كيف ازدادت تعزية بولس، وتؤدي «إذ» هذه الصلة بسلاسة.
- source_word: ἐπιπόθησιν
  choice: شوقكم
  rationale: تنقل قوة التطلع والحنين في الاسم اليوناني بلفظ عربي موجز وواضح.
- source_word: ὀδυρμόν
  choice: نحيبكم
  rationale: يدل اللفظ على حزن مُعبَّر عنه بالرثاء أو النحيب، لا على الحزن الباطني وحده.
- source_word: ζῆλον
  choice: غيرتكم
  rationale: «الغيرة» مقابل مباشر يدل على الحماسة والاهتمام الشديد، مع بقاء اتجاهها نحو بولس واضحًا من السياق.
- source_word: ὑπὲρ ἐμοῦ
  choice: لأجلي
  rationale: تحافظ على سعة المعنى، سواء أكان المقصود الاهتمام ببولس أم الوقوف في صفه.
- source_word: ὥστε με μᾶλλον χαρῆναι
  choice: حتى ازددت فرحًا
  rationale: تنقل نتيجة ما سبق، وتحفظ القوة المقارنة في μᾶλλον بصياغة عربية طبيعية.
theological_decisions:
- issue: طبيعة غيرة أهل كورنثوس نحو بولس
  choice: غيرتكم لأجلي
  alternative: حميتكم للدفاع عني
  rationale: يحفظ الاختيار اتساع ζῆλος وὑπὲρ ἐμοῦ، ولا يحصرهما في معنى الدفاع أو الولاء الذي لا تصرّح به العبارة.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. حُفظ تكرار الجذر في «التعزية التي تعزّى بها»، واستُخدم «نحيبكم» في المتن لإبراز الحزن المعبَّر عنه، مع بديل أوضح في الحاشية.
