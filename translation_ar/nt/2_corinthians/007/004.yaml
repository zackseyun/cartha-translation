base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/004.yaml
  text: I have great boldness toward you[a], and great boasting on your behalf. I am filled with encouragement[c][b]; I overflow with joy in all our affliction.
translation:
  language: ar
  text: لي جرأة عظيمة تجاهكم[a]، ولي افتخار عظيم بكم. قد امتلأتُ بالتشجيع[b]، وأنا أفيض فرحًا في ضيقاتنا كلها[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ثقة عظيمة بكم». ويمكن للكلمة اليونانية أن تفيد أيضًا الصراحة والانفتاح في الكلام.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «تعزية». فالكلمة اليونانية تشمل التقوية والتشجيع والتسلية في الحزن.'
    reason: lexical_alternative
  - marker: c
    text: 'يمكن أيضًا أن تُفهم العبارة: «على الرغم من ضيقاتنا كلها»، لكن اليونانية تحتمل معنى الفرح الفائض في وسط الضيق المستمر.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησία
  choice: جرأة
  rationale: تفيد الكلمة الجرأة والثقة المنفتحة، ولا سيما في الكلام. واختيار «جرأة» يحفظ قوة اللفظ، مع بيان معنى الثقة والصراحة في الحاشية.
- source_word: πρὸς ὑμᾶς
  choice: تجاهكم
  rationale: تحفظ الاتجاه العلاقي الذي تفيده πρός مع النصب، وتأتي عربية واضحة مع «جرأة».
- source_word: καύχησις
  choice: افتخار
  rationale: يحفظ اللفظ موضوع الافتخار البولسي الإيجابي هنا، من غير أن يُفهم بالضرورة على أنه كبرياء مذموم.
- source_word: ὑπὲρ ὑμῶν
  choice: بكم
  rationale: في هذا السياق يدل التعبير على الافتخار بشأن أهل كورنثوس ولصالحهم؛ و«بكم» هي الصياغة العربية الطبيعية الموجزة.
- source_word: πεπλήρωμαι
  choice: قد امتلأت
  rationale: يعكس صيغة التام المبني للمجهول حالة حاضرة ناتجة من فعل سابق؛ و«قد امتلأت» تحافظ على هذا الأثر.
- source_word: παρακλήσει
  choice: تشجيعًا
  rationale: تشمل παράκλησις التشجيع والتعزية والتقوية. اختير «تشجيعًا» في المتن، مع حفظ «تعزية» بوصفها احتمالًا معجميًا في الحاشية.
- source_word: ὑπερπερισσεύομαι
  choice: أنا أفيض
  rationale: الفعل المكثف يدل على وفرة فائضة؛ و«أفيض» يحفظ الصورة بعبارة عربية طبيعية.
- source_word: χαρᾷ
  choice: فرحًا
  rationale: ترجمة مباشرة وطبيعية لكلمة χαρά.
- source_word: ἐπὶ πάσῃ τῇ θλίψει ἡμῶν
  choice: في ضيقاتنا كلها
  rationale: تحفظ العبارة اجتماع الفرح والضيق، من غير تحويل العلاقة صراحة إلى معنى استدراكي مثل «على الرغم من».
- source_word: πολλή ... πολλή
  choice: عظيمة ... عظيم
  rationale: يحفظ تكرار الصفة توكيد الوفرة في الأصل، مع موافقة التذكير والتأنيث في العربية.
theological_decisions:
- issue: نقل καύχησις الإيجابية عند بولس من غير إضفاء معنى الكبرياء الخاطئ
  choice: افتخار
  alternative: اعتزاز أو ثقة
  rationale: «افتخار» يحفظ العبارة البلاغية البولسية وصلتها باستعمالاته الأخرى، والسياق يبين أنه افتخار بأهل كورنثوس لا تعظيم مذموم للذات.
- issue: الحفاظ على التوتر بين الفرح والمعاناة
  choice: في ضيقاتنا كلها
  alternative: على الرغم من ضيقاتنا كلها
  rationale: الأصل يصور الفرح فائضًا في وسط الضيق؛ لذلك لا تُحسم العلاقة في المتن على أنها استدراكية محضة.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. حُفظ توازي «لي... ولي...» وتكرار «عظيم/عظيمة»، كما حُفظت صورة الامتلاء والفيضان. استُعمل جمع «ضيقات» لأنه طبيعي في السياق ويحفظ شمول πάσῃ.
