id: 2CO.7.9
reference: 2 Corinthians 7:9
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: νῦν χαίρω, οὐχ ὅτι ἐλυπήθητε, ἀλλ’ ὅτι ἐλυπήθητε εἰς μετάνοιαν, ἐλυπήθητε γὰρ κατὰ θεόν, ἵνα ἐν μηδενὶ ζημιωθῆτε ἐξ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/009.yaml
  text: Now I rejoice[a], not because you were grieved, but because you were grieved into a change of mind; for you were grieved according to God[c][b], so that you might suffer no loss from us.
translation:
  language: ar
  text: فالآن أنا أفرح، لا لأنكم حزنتم، بل لأن حزنكم أفضى بكم إلى التوبة[a]؛ لأنكم حزنتم بحسب الله[b]، لكيلا تتضرروا من جهتنا في شيء[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إلى تغيير الفكر»؛ غير أن «التوبة» هنا تتضمن تحولًا أخلاقيًا وروحيًا، لا مجرد تبدل في الرأي.'
    reason: lexical_alternative
  - marker: b
    text: 'أيضًا: «على نحو يوافق الله» أو «كما يريد الله».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «لكيلا تلحقكم بسببنا خسارة في شيء».'
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν
  choice: فالآن
  rationale: ينقل الظرف الزمني ويبرز التحول من الحزن السابق إلى فرح بولس الحاضر، مع ربط طبيعي بالسياق.
- source_word: χαίρω
  choice: أنا أفرح
  rationale: يحافظ على القوة الفعلية وصيغة المتكلم وعلى النبرة الموقرة من غير تكلف.
- source_word: ἐλυπήθητε
  choice: حزنتم
  rationale: العربية تعبّر طبيعيًا بالفعل اللازم عن وقوع الحزن، مع إبقاء تكرار الفعل في الآية وعدم تعيين من سبّبه.
- source_word: εἰς μετάνοιαν
  choice: أفضى بكم إلى التوبة
  rationale: يعبّر تعبيرًا عربيًا واضحًا عن اتجاه الحزن إلى نتيجة هي التوبة، مع الحفاظ على القوة الأخلاقية والروحية للمصطلح في السياق.
- source_word: κατὰ θεόν
  choice: بحسب الله
  rationale: 'صياغة قريبة من اليونانية تحفظ اتساع العلاقة بالله: بحسب معياره أو إرادته، من غير حصرها في تفسير واحد.'
- source_word: ζημιωθῆτε
  choice: تتضرروا
  rationale: ينقل معنى وقوع الضرر أو الخسارة بصياغة عربية طبيعية، ويوافق صيغة الغاية المنفية بعد ἵνα.
- source_word: ἐξ ἡμῶν
  choice: من جهتنا
  rationale: يحفظ دلالة المصدر أو الجهة في ἐξ من غير الجزم هل المقصود ضرر مباشر أم خسارة ناشئة بسبب بولس ورفقائه.
theological_decisions:
- issue: دلالة الحزن في عبارة κατὰ θεόν
  choice: بحسب الله
  alternative: حزنًا يرضي الله / كما يريد الله
  rationale: يحفظ التعبير الأوسع في الأصل، فلا يحسم هل المقصود معيار الله أم إرادته أم الكيفية الموافقة له.
- issue: دلالة μετάνοια في هذا السياق
  choice: التوبة
  alternative: تغيير الفكر
  rationale: «التوبة» هي المقابل العربي الطبيعي الذي يحمل هنا التحول الأخلاقي والروحي المقصود، بينما يوضح الحاشية المعنى الاشتقاقي الممكن من غير اختزال التوبة في نشاط ذهني محض.
- issue: علاقة ἐξ ἡμῶν بالضرر
  choice: من جهتنا
  alternative: بسببنا
  rationale: يبقي صياغة المصدر أو الجهة مفتوحة بدل تحويلها صراحة إلى سببية وحدها.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. حافظت الصياغة على تكرار «حزنتم» المحوري، واستعملت «أفضى بكم» لتوضيح دلالة الاتجاه والنتيجة في εἰς من غير إثقال العبارة. وُضعت علامات الحواشي عند الألفاظ التي تشرحها مباشرة.
