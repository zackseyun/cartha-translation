  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أفرح لأنني، في كل أمر، مطمئن من جهتكم».'
    reason: تحفظ الصياغة البديلة احتمال كون ὅτι سببية، واحتمال دلالة ἐν ὑμῖν على الثقة من جهتهم لا الثقة الموضوعة فيهم مباشرة.
lexical_decisions:
- source_word: χαίρω
  choice: أفرح
  rationale: يحافظ على صيغة الفعل المضارع وعلى نبرة الفرح الواضحة، من غير إضافة معنى المبالغة.
- source_word: ὅτι
  choice: بأنني
  rationale: تفيد هنا، على الأرجح، مضمون فرح بولس، مع بقاء احتمال فهمها بمعنى سببي.
- source_word: ἐν παντί
  choice: في كل شيء
  rationale: يحفظ شمول العبارة اليونانية وصيغتها الموجزة، ويمكن فهمه بمعنى «في كل أمر» أو «من كل وجه» بحسب السياق.
- source_word: θαρρῶ
  choice: واثق
  rationale: ينقل معنى الثقة الراسخة الذي يلائم السياق، بدل معنى التشجع الممكن معجميًا لكنه أضعف هنا.
- source_word: ἐν ὑμῖν
  choice: بكم
  rationale: تعبير عربي طبيعي يدل على أن أهل كورنثوس هم موضع ثقة بولس، ويحفظ القوة العلاقية لحرف الجر اليوناني.
