source:
  edition: SBLGNT
  text: ἀλλ’ ὁ παρακαλῶν τοὺς ταπεινοὺς παρεκάλεσεν ἡμᾶς ὁ θεὸς ἐν τῇ παρουσίᾳ Τίτου·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/006.yaml
  text: But God[a], who comforts the humble[b], comforted us by the coming of Titus.
translation:
  language: ar
  text: لكن الله، الذي يعزّي المتضعين[a]، عزّانا بمجيء تيطس[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «المنكسرين»، أو: «الوضعاء».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «بحضور تيطس».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: لكن
  rationale: تفيد الاستدراك والتباين مع الضيق المذكور في السياق السابق، وهي صياغة عربية موجزة وطبيعية.
- source_word: ὁ παρακαλῶν
  choice: الذي يعزّي
  rationale: اسم الفاعل المعرّف يصف الله بفعل ملازم، و«يعزّي» تلائم سياق الضيق وتحافظ على الصلة اللفظية بالفعل اللاحق من الجذر اليوناني نفسه.
- source_word: τοὺς ταπεινοὺς
  choice: المتضعين
  rationale: تحافظ الكلمة على سعة المعنى بين المتواضعين والمنخفضي الحال أو المنكسرين بسبب الشدة، من غير حصرها في حالة نفسية واحدة.
- source_word: παρεκάλεσεν
  choice: عزّانا
  rationale: ينقل فعل التعزية في هذا السياق ويحافظ على التكرار المقصود مع «يعزّي».
- source_word: ὁ θεὸς
  choice: الله
  rationale: هو الفاعل الصريح في اليونانية؛ وُضع في ترتيب عربي طبيعي مع بقاء التركيز عليه بوصفه مصدر التعزية.
- source_word: ἐν τῇ παρουσίᾳ
  choice: بمجيء
  rationale: يمكن أن تدل παρουσία على الحضور أو المجيء، ويشير السياق هنا إلى وصول تيطس؛ أما معنى الحضور فمذكور في الحاشية.
- source_word: Τίτου
  choice: تيطس
  rationale: النقل العربي المألوف لاسم الشخص.
theological_decisions:
- issue: دلالة τοὺς ταπεινοὺς في السياق
  choice: المتضعين
  alternative: المنكسرين أو الوضعاء
  rationale: قد تدل العبارة على المتواضعين أو ذوي المنزلة المنخفضة أو الذين أحنتهم الشدائد. يحفظ النص الرئيس هذا الاتساع، وتعرض الحاشية أبرز البدائل من غير حسم التوتر الدلالي.
- issue: دلالة παρουσία في وصف تيطس
  choice: مجيء تيطس
  alternative: حضور تيطس
  rationale: يرجّح السياق معنى الوصول بوصفه الحدث الذي جاءت به التعزية، مع بقاء معنى الحضور ممكنًا ومذكورًا في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. حوفظ على تكرار «يعزّي/عزّانا» ليعكس التكرار اليوناني، ووُضعت علامتا الحاشية بعد اللفظين اللذين تشرحانهما مباشرة.
