reference: 2 Corinthians 7:14
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὅτι εἴ τι αὐτῷ ὑπὲρ ὑμῶν κεκαύχημαι, οὐ κατῃσχύνθην, ἀλλ’ ὡς πάντα ἐν ἀληθείᾳ ἐλαλήσαμεν ὑμῖν, οὕτως καὶ ἡ καύχησις ἡμῶν ⸀ἡ ἐπὶ Τίτου ἀλήθεια ἐγενήθη.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/014.yaml
  text: For if I have boasted to him at all about you[a], I was not put to shame; rather, just as we spoke everything to you in truth[b], so also our boasting to Titus proved true.
translation:
  language: ar
  text: لأنني إن كنتُ قد افتخرتُ بكم لديه في شيء، فلم أُخزَ؛ بل كما قلنا لكم كلَّ شيء بالحق[a]، كذلك أيضًا ثبت صدق افتخارنا بكم لدى تيطس[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: قلنا لكم كل شيء بصدق.'
    reason: توضيح القوة الظرفية لعبارة ἐν ἀληθείᾳ.
  - marker: b
    text: 'يمكن ترجمتها أيضًا: «افتخارنا بكم أمام تيطس».'
    reason: بيان بديل لغوي للعبارة اليونانية ἡ ἐπὶ Τίτου، التي تصف الافتخار المعلن لدى تيطس أو أمامه.
lexical_decisions:
- source_word: κεκαύχημαι / ἡ καύχησις ἡμῶν
  choice: افتخرتُ / افتخارنا
  rationale: يحافظ «افتخر» على الصلة اللفظية بين الفعل والاسم، وعلى القوة البلاغية للكلمتين من غير أن يحكم بأن هذا الافتخار غرور خاطئ؛ فالسياق يبيّن أنه اعتزاز ثبت صدقه.
- source_word: οὐ κατῃσχύνθην
  choice: فلم أُخزَ
  rationale: صيغة المبني للمجهول تدل على أن افتخار بولس لم يعرّضه للخزي ولم يتبيّن بطلانه، لا على مجرد شعور داخلي بالخجل.
- source_word: πάντα ἐν ἀληθείᾳ ἐλαλήσαμεν ὑμῖν
  choice: قلنا لكم كلَّ شيء بالحق
  rationale: ينقل «كل شيء» شمول πάντα، وتؤدي «بالحق» معنى ἐν ἀληθείᾳ بوصفه وصفًا لصدق كلام بولس ورفقائه.
- source_word: ὑπὲρ ὑμῶν
  choice: بكم
  rationale: يفيد التركيب أن موضوع افتخار بولس هو أهل كورنثوس؛ و«افتخرت بكم» تعبير عربي طبيعي وموجز.
- source_word: ἡ ἐπὶ Τίτου
  choice: لدى تيطس
  rationale: يفهم السياق العبارة على أنها تصف الافتخار الذي أبداه بولس عند تيطس أو أمامه، لا افتخارًا بتيطس نفسه.
- source_word: ἀλήθεια ἐγενήθη
  choice: ثبت صدق
  rationale: التركيب اليوناني حرفيًا قريب من «صار حقًا»، والعبارة العربية المختارة توضح أن الواقع أثبت صدق افتخار بولس.
- source_word: ὅτι
  choice: لأنني
  rationale: تقدّم الأداة تعليلًا لما سبق، فتلائمها «لأن» في السياق العربي، مع إلحاق ضمير المتكلم بالفعل التالي.
theological_decisions:
- issue: طبيعة افتخار بولس
  choice: إبقاء لفظ «الافتخار» بمعناه البلاغي المباشر
  alternative: «الاعتزاز» أو «الثقة» لتجنب الإيحاء السلبي
  rationale: قد يدل الاستعمال البولسي على التزكية الواثقة والاعتزاز، لا على الكبرياء الآثم. ويحفظ «الافتخار» الصلة بين الفعل والاسم، بينما يترك للسياق أن يثبت مشروعيته.
- issue: المقصود بعبارة ἡ ἐπὶ Τίτου
  choice: افتخار بولس بالكورنثيين لدى تيطس
  alternative: افتخار بولس بتيطس أو افتخاره أمام تيطس من غير بيان موضوعه
  rationale: الجملة الأولى تصرّح بأن بولس افتخر بالكورنثيين عند تيطس، ولذلك يُفهم الاسم اللاحق على أنه عودة إلى ذلك الافتخار نفسه. أُبقيت دلالة «لدى» مع إظهار الموضوع من السياق.
translation_notes:
  register: عربية فصحى واضحة ورصينة. استُعمل «أُخزَ» للمبني للمجهول، و«ثبت صدق» بدل النقل الحرفي غير الطبيعي «صار حقًا». أُظهر موضوع الافتخار في الخاتمة دفعًا لاحتمال فهم العبارة على أنها افتخار بتيطس، مع توثيق الصياغة الأقرب إلى ظاهر التركيب في الحاشية.
