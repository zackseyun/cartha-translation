source:
  edition: SBLGNT
  text: ἰδοὺ γὰρ αὐτὸ τοῦτο τὸ κατὰ θεὸν ⸀λυπηθῆναι πόσην κατειργάσατο ὑμῖν σπουδήν, ἀλλὰ ἀπολογίαν, ἀλλὰ ἀγανάκτησιν, ἀλλὰ φόβον, ἀλλὰ ἐπιπόθησιν, ἀλλὰ ζῆλον, ἀλλὰ ἐκδίκησιν· ἐν παντὶ συνεστήσατε ἑαυτοὺς ἁγνοὺς ⸀εἶναι τῷ πράγματι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/011.yaml
  text: 'For see what earnestness this very grief according to God has produced in you: but also a defense[a], but also indignation, but also fear, but also longing, but also zeal, but also vindication[c][b]. In every way you proved yourselves to be pure in the matter.'
translation:
  language: ar
  text: فانظروا كم أوجد فيكم هذا الحزن عينه بحسب الله[a] من حرص! بل دفاعًا[b]، بل استياءً، بل خوفًا، بل شوقًا، بل غيرةً، بل إنصافًا[c]. لقد أثبتم من كل وجه أنكم أنقياء في هذا الأمر.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «هذا الحزن عينه الموافق لمشيئة الله».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «تبرئةً لأنفسكم».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «إنزالًا للعقاب» أو «تحقيقًا للعدالة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ γὰρ
  choice: فانظروا
  rationale: يجمع التعبير بين صلة γάρ بما سبق وقوة ἰδού في لفت الانتباه، بصياغة عربية طبيعية موجزة.
- source_word: τὸ κατὰ θεὸν λυπηθῆναι
  choice: هذا الحزن نفسه الذي بحسب الله
  rationale: صيغ المصدر المؤول اسمًا، وحُفظ تركيب κατὰ θεόν دون حسمه في معنى تفسيري واحد مثل «الحزن التقي».
- source_word: πόσην κατειργάσατο ὑμῖν σπουδήν
  choice: كم أنشأ فيكم ... من اجتهاد
  rationale: يدل الفعل على إحداث نتيجة، وتفيد σπουδή الجدية والحرص العملي في استجابتهم.
- source_word: ἀλλὰ
  choice: بل
  rationale: تكرار «بل» يحفظ الإيقاع التصاعدي التوكيدي في تعداد آثار الحزن، من غير جعله تضادًا منطقيًا حادًا.
- source_word: ἀπολογίαν
  choice: دفاعًا عن أنفسكم
  rationale: يوضح أن المقصود ردهم الذي أظهر عدم تواطئهم مع الإساءة، ويتجنب إيحاء «تبرير النفس» السلبي في العربية المعاصرة.
- source_word: ἀγανάκτησιν
  choice: استياءً
  rationale: ينقل شدة عدم الرضا الأخلاقي من غير تعيين موضوعه، إذ لا يصرح النص اليوناني به.
- source_word: φόβον
  choice: خوفًا
  rationale: يحفظ اللفظ عامًا لأن موضوع الخوف—الله أو الرسول أو عواقب الأمر—غير مذكور صراحة.
- source_word: ἐπιπόθησιν
  choice: شوقًا
  rationale: ينقل الرغبة القوية، ويرجح سياقًا شوقهم إلى استعادة العلاقة من غير إضافته صراحة إلى النص.
- source_word: ζῆλον
  choice: غيرةً
  rationale: تحفظ قوة اللفظ وتميزها من «الاجتهاد» الوارد في أول القائمة.
- source_word: ἐκδίκησιν
  choice: إحقاقًا للحق
  rationale: ينقل معنى اتخاذ إجراء حاسم لتصحيح الخطأ من غير إيحاء بالانتقام الشخصي، مع إبقاء الدلالة العقابية المحتملة في الحاشية.
- source_word: ἐν παντὶ συνεστήσατε ἑαυτοὺς
  choice: أثبتم من كل وجه أنكم
  rationale: يعبر عن معنى إظهار الحقيقة وإقامة الدليل عليها، وتفيد «من كل وجه» الشمول في هذه القضية.
- source_word: ἁγνοὺς εἶναι τῷ πράγματι
  choice: أنقياء في هذا الأمر
  rationale: يحفظ الوصف الأخلاقي ἁγνούς وصلة العبارة بالقضية محل النقاش، من غير اختزالها إلى حكم قانوني محض.
theological_decisions:
- issue: دلالة κατὰ θεόν
  choice: بحسب الله
  alternative: حزن يرضي الله؛ حزن تقي
  rationale: يحفظ الصياغة البولسية المفتوحة التي قد تدل على حزن موافق لمشيئة الله أو معياره، بدل إدخال تفسير واحد في المتن.
- issue: دلالة ἐκδίκησις في سياق التوبة
  choice: إحقاق الحق
  alternative: العقاب؛ إنزال الجزاء؛ الاقتصاص
  rationale: السياق يصف استجابة الجماعة الجادة للخطأ، واللفظ قد يتضمن العقوبة أو تحقيق العدالة. اختير تعبير يدل على تصحيح الخطأ دون إقرار الانتقام الشخصي، وحُفظ البديل العقابي في الحاشية.
- issue: معنى الطهارة في ἁγνούς ... τῷ πράγματι
  choice: أنقياء في هذا الأمر
  alternative: أبرياء في هذه القضية
  rationale: «أنقياء» أقرب إلى الوصف الأخلاقي اليوناني، ولا يحوّل العبارة إلى إعلان براءة قانونية مطلقة قد يتجاوز مراد السياق.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية كريمة. حُفظ التكرار البلاغي لـ«بل» والقائمة المتصاعدة، مع استعمال تراكيب مألوفة للقارئ المعاصر وتجنب المصطلحات الطائفية أو القانونية المفرطة.
