  text: ⸂πρὸς κατάκρισιν οὐ⸃ λέγω, προείρηκα γὰρ ὅτι ἐν ταῖς καρδίαις ἡμῶν ἐστε εἰς τὸ συναποθανεῖν καὶ συζῆν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/003.yaml
  text: I do not say this to condemn you[a], for I have said before that you are in our hearts[b], to die together and to live together.
translation:
  language: ar
  text: لا أقول هذا لإدانتكم[a]، فقد سبق أن قلت إنكم في قلوبنا، لنموت معًا ونحيا معًا[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بقصد الحكم عليكم» أو «للحكم عليكم».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «حتى نشترك معًا في الموت والحياة». ويؤكد الأصل اليوناني التضامن المشترك في الموت والحياة كليهما.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς κατάκρισιν
  choice: لإدانتكم
  rationale: تفيد العبارة الغاية أو الاتجاه؛ والصياغة العربية الطبيعية توضح أن كلام بولس ليس بقصد إصدار الإدانة عليهم.
- source_word: λέγω
  choice: أقول هذا
  rationale: أُضيف اسم الإشارة لإحالة طبيعية إلى الكلام السابق، وهو مفهوم من السياق.
- source_word: προείρηκα
  choice: سبق أن قلت
  rationale: تنقل معنى القول السابق ذي الصلة المستمرة بالحاضر.
- source_word: ἐν ταῖς καρδίαις ἡμῶν ἐστε
  choice: إنكم في قلوبنا
  rationale: تحافظ على جمع «القلوب» في اليونانية وعلى دلالة المحبة والتعلق العميقين.
- source_word: εἰς τὸ συναποθανεῖν καὶ συζῆν
  choice: لنموت معًا ونحيا معًا
  rationale: تحفظ التوازي وقوة السابقة συν- الدالة على المشاركة والتضامن، مع إبقاء علاقة الغاية أو النتيجة التي تفيدها εἰς دون حسم زائد.
theological_decisions:
- issue: هل تُفسَّر عبارة الموت والحياة معًا تفسيرًا عهديًا أو مسيانيًا تقنيًا؟
  choice: الإبقاء على لغة التضامن العميق من غير إضافة تصنيف لاهوتي محدد
  alternative: صياغتها صراحة بوصفها اتحادًا عهديًا أو اشتراكًا في المسيح
  rationale: النص يعبّر بوضوح عن المحبة والتضامن في الموت والحياة، لكنه لا يحدد هنا إطارًا لاهوتيًا تقنيًا بعينه.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. حوفظ على حرارة التعبير وعلى ترتيب «نموت... ونحيا» كما في الأصل، وعلى جمع «قلوبنا».
