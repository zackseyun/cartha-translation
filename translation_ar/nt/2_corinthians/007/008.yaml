reference: 2 Corinthians 7:8
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὅτι εἰ καὶ ἐλύπησα ὑμᾶς ἐν τῇ ἐπιστολῇ, οὐ μεταμέλομαι· εἰ καὶ μετεμελόμην (⸀βλέπω ὅτι ἡ ἐπιστολὴ ἐκείνη εἰ καὶ πρὸς ὥραν ἐλύπησεν ὑμᾶς),
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/008.yaml
  text: For even if I grieved you with the letter[a], I do not regret it—though I did regret it, for I see that that letter grieved you[b], though only for a time.
translation:
  language: ar
  text: فحتى إن كنتُ قد أحزنتكم بالرسالة، فلا أندم، مع أنني كنتُ أندم[a]؛ إذ أرى أن تلك الرسالة أحزنتكم، ولو إلى حين[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مع أنني ندمتُ». قد يبرز زمن الفعل اليوناني حالة ندم ماضية مستمرة.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «لمدة ساعة»، وهو تعبير يفيد مدة قصيرة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλύπησα / ἐλύπησεν
  choice: أحزنتُ / أحزنتكم
  rationale: الفعل λυπέω يدل هنا على التسبب في الحزن أو الألم النفسي؛ و«أحزن» تعبير عربي واضح يحفظ القوة العاطفية من غير توسع تفسيري.
- source_word: ἐν τῇ ἐπιστολῇ
  choice: بالرسالة
  rationale: تفيد ἐν هنا الوسيلة، والباء هي الصياغة العربية الطبيعية الدالة على أن الرسالة كانت سبب الحزن.
- source_word: μεταμέλομαι
  choice: لا أندم
  rationale: السياق يتحدث عن الندم على الأثر المؤلم للرسالة، لا عن التوبة بالمعنى الأخلاقي أو اللاهوتي.
- source_word: μετεμελόμην
  choice: كنتُ قد ندمتُ
  rationale: تحفظ الصياغة دلالة الماضي الناقص على حالة ندم سابقة، وتبرز مقابلتها مع الحاضر «لا أندم».
- source_word: βλέπω
  choice: أرى
  rationale: ترجمة قريبة وطبيعية للفعل، وتفيد إدراك بولس للأثر الذي أحدثته الرسالة.
- source_word: ἡ ἐπιστολὴ ἐκείνη
  choice: تلك الرسالة
  rationale: تحفظ قوة اسم الإشارة ἐκείνη وتعيين الرسالة المقصودة.
- source_word: πρὸς ὥραν
  choice: إلى حين
  rationale: تعبير عربي موجز يفيد المدة القصيرة والمؤقتة، بدل حمل ὥρα حرفيًا على ساعة زمنية محددة.
- source_word: ὅτι
  choice: فـ / إذ
  rationale: الأولى تصل الآية بما قبلها على وجه التعليل، والثانية تقدم سبب الندم السابق وفق تركيب الجملة اليونانية.
- source_word: εἰ καὶ
  choice: حتى إن / مع أن / ولو
  rationale: تكرار الأداة يؤدي وظائف تنازلية متقاربة داخل تركيب عربي طويل؛ نوّعت الصياغة بما يحفظ العلاقات المنطقية ويمنع الركاكة من غير إزالة التوتر البلاغي.
theological_decisions:
- issue: دلالة μεταμέλομαι في وصف بولس لمشاعره
  choice: الندم
  alternative: التوبة أو الأسف
  rationale: المقام هو موقف بولس من إيلام الرسالة للمؤمنين، لا توبة أخلاقية أمام الله؛ لذا يحفظ «الندم» الفرق الدلالي ولا يستورد تقريرًا لاهوتيًا غير موجود.
- issue: التوتر بين «لا أندم» و«كنت قد ندمت»
  choice: الإبقاء على العبارتين متجاورتين من غير تسوية تفسيرية
  alternative: إعادة الصياغة بما يجعل الأولى تعني أنه لم يندم قط
  rationale: النص يصف موقفًا حاضرًا يقابله ندم سابق، وينبغي حفظ هذا التحول العاطفي الصريح.
translation_notes:
  register: العربية فصحى حديثة واضحة ذات نبرة كريمة. استُعمل «بالرسالة» للدلالة الطبيعية على الوسيلة، وحُفظت المقابلة بين عدم الندم الآن والندم في وقت سابق. تظهر علامتا الحاشيتين [a] و[b] في المتن.
