  to: فحتى إن كنتُ قد أحزنتكم بالرسالة، فلا أندم، مع أنني كنتُ أندم[a]؛ إذ أرى أن تلك الرسالة أحزنتكم، ولو إلى حين[b].
  rationale: عُدّلت صيغة الندم السابق لتقابل بصورة أوضح دلالة الماضي الناقص في اليونانية من غير فرض تفسير زمني زائد، وصُحّحت الصياغة الحرفية في الحاشية [b]. أما بقية المتن فحُفظت لأنها دقيقة وطبيعية.
