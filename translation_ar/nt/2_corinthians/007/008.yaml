    issue: صيغة «كنتُ قد ندمتُ»
    rationale: هذه الصيغة تفيد غالبًا ماضيًا تامًا («كان قد ندم»)، بينما μετεμελόμην فعل ناقص يصوّر ندمًا في الماضي أو حالة ندم مستمرة. «كنتُ أندم» أقرب إلى الصيغة اليونانية، وتبقى مفهومة في المقابلة مع «لا أندم».
  - severity: low
    issue: 'الحاشية [b]: «حرفيًا: إلى ساعة»'
    rationale: التركيب πρὸς ὥραν يعني حرفيًا «لمدة ساعة/لنحو ساعة»، لا «إلى ساعة». أما المعنى الاصطلاحي في السياق فهو مدة قصيرة، وهو ما ينبغي أن توضحه الحاشية.
