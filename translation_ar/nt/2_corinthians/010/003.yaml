  text: For though we walk in the flesh[a], we do not wage war according to the flesh—
translation:
  language: ar
  text: فمع أننا نسلك في الجسد[a]، لا نحارب بحسب الجسد—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فمع أننا نعيش في الجسد، لا نحارب بمقاييس بشرية».'
    reason: بديل معجمي يوضح أن «نسلك في الجسد» قد تعني الحياة في البدن، وأن «بحسب الجسد» قد تشير إلى المقاييس البشرية المحضة.
lexical_decisions:
- source_word: ἐν σαρκὶ
  choice: في الجسد
  rationale: ينقل العبارة إلى عربية واضحة، ويدل هنا على الوجود البشري المتجسد من غير أن يحمّل σάρξ معنى «الطبيعة الخاطئة».
- source_word: γὰρ
  choice: فإننا
  rationale: الفاء مع «إن» تُظهر أن الجملة تعليل لما قبلها وتحافظ على سلاسة الحجاج بالعربية.
- source_word: περιπατοῦντες
  choice: وإن كنا نسلك
  rationale: يحافظ «نسلك» على استعارة المشي الشائعة كتابيًا للدلالة على العيش، وتؤدي «وإن» المعنى التنازلي الذي يقتضيه التقابل مع الجملة التالية.
- source_word: οὐ κατὰ σάρκα
  choice: لا نحارب بحسب الجسد
  rationale: تحافظ «بحسب الجسد» على تكرار σάρξ وعلى دلالة المعيار أو النهج، من غير حصرها في تفسير واحد مثل «بمقاييس بشرية» أو «بطريقة دنيوية».
- source_word: στρατευόμεθα
  choice: نحارب
  rationale: فعل عربي طبيعي موجز يحفظ الصورة العسكرية في سياق الصراع الرسولي.
theological_decisions:
- issue: ترجمة σάρξ في موضعي الآية
  choice: «في الجسد ... بحسب الجسد»
  alternative: «نعيش في الجسد ... لا نحارب بمقاييس بشرية» أو «في الضعف البشري ... بطريقة جسدية»
  rationale: الموضع الأول يشير إلى الحياة البشرية المتجسدة، والثاني إلى النهج أو المعيار الجسدي/البشري. الإبقاء على «الجسد» في الموضعين يصون التكرار البلاغي والتوتر الدلالي، ولا يستورد معنى أضيق مثل «الطبيعة الخاطئة».
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. حُفظت استعارتا السلوك والحرب، ووُضع البديل التفسيري في الحاشية بدل حسم دلالة σάρξ في المتن.
