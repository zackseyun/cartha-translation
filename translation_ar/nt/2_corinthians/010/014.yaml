  text: οὐ γὰρ ὡς μὴ ἐφικνούμενοι εἰς ὑμᾶς ὑπερεκτείνομεν ἑαυτούς, ἄχρι γὰρ καὶ ὑμῶν ἐφθάσαμεν ἐν τῷ εὐαγγελίῳ τοῦ Χριστοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/014.yaml
  text: For we are not overextending ourselves[a], as though we had not reached you[c][b], for we came even as far as you with the gospel of Messiah—
translation:
  language: ar
  text: فنحن لا نتجاوز حدودنا، كأننا لم نصل إليكم؛ فقد وصلنا حتى إليكم بإنجيل المسيح—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπερεκτείνομεν ἑαυτούς
  choice: نمدّ أنفسنا إلى أبعد من حدودنا
  rationale: يحافظ على صورة التمدد إلى ما وراء الحدّ الكامنة في الفعل اليوناني، مع صياغة عربية واضحة وطبيعية.
- source_word: ὡς μὴ ἐφικνούμενοι εἰς ὑμᾶς
  choice: كأننا لم نصل إليكم
  rationale: ينقل الحالة الافتراضية التي كان يمكن أن تجعل خدمتهم تجاوزًا لحدودهم، ويعبّر عن بلوغهم أهل كورنثوس بوضوح.
- source_word: ἄχρι γὰρ καὶ ὑμῶν ἐφθάσαμεν
  choice: فقد وصلنا حتى إليكم
  rationale: تحافظ «حتى» على توكيد καί، وينقل الماضي «وصلنا» الفعل المكتمل الذي يعبّر عنه الماضي اليوناني.
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: بإنجيل
  rationale: تفيد الباء المصاحبة والوسيلة في سياق وصول بولس ورفقائه إليهم حاملين البشارة، وهي أيسر من النقل الحرفي «في الإنجيل».
- source_word: τοῦ Χριστοῦ
  choice: المسيح
  rationale: «المسيح» المقابل العربي الراسخ للقب Χριστός، ويلائم إضافته إلى الإنجيل من غير حسم ما إذا كانت الإضافة تفيد المصدر أو المحتوى أو الانتماء.
theological_decisions:
- issue: دلالة تركيب «إنجيل المسيح»
  choice: 'الإبقاء على الإضافة: «بإنجيل المسيح»'
  alternative: بالبشارة عن المسيح
  rationale: الإضافة اليونانية تحتمل أن يكون الإنجيل صادرًا عن المسيح أو متعلقًا به أو خاصًا به؛ والإضافة العربية تحفظ هذا الاتساع الدلالي بدل حصره في معنى واحد.
translation_notes:
  register: صياغة عربية فصحى معاصرة ذات نبرة كريمة وواضحة. أُبقيت استعارة تجاوز الحدود، واستُخدمت الفاصلة المنقوطة لإظهار أن الجملة الثانية تعليل للأولى، وبقيت الشرطة الختامية لأن الآية تتصل بما بعدها.
