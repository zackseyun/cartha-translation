  text: ἐάν ⸀τε ⸀γὰρ περισσότερόν τι καυχήσωμαι περὶ τῆς ἐξουσίας ἡμῶν, ἧς ἔδωκεν ὁ ⸀κύριος εἰς οἰκοδομὴν καὶ οὐκ εἰς καθαίρεσιν ὑμῶν, οὐκ αἰσχυνθήσομαι,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/008.yaml
  text: For even if I should boast somewhat more about our authority[a], which the Lord gave for building you up and not for tearing you down[b], I will not be put to shame.
translation:
  language: ar
  text: فإنني، حتى إن افتخرتُ قليلًا أكثر بسلطاننا الذي أعطانا إياه الرب لبنيانكم لا لهدمكم[a]، فلن أُخزى[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لبنيانكم لا لإسقاطكم» أو «لا لإهلاككم». يقابل اليوناني بين البناء والهدم، فحافظت الصياغة على هذه الصورة.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «فلن أخجل». الفعل اليوناني مبني للمجهول، ولذلك تعبّر «لن أُخزى» عن صيغته بوضوح أكبر.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τε γὰρ
  choice: فحتى إن
  rationale: تنقل الفاء قوة γάρ التعليلية أو التفسيرية، وتؤدي «إن» معنى الشرط مع صيغة الالتزام، بينما تعكس «حتى» معنى τε في هذا السياق بصورة عربية طبيعية.
- source_word: περισσότερόν τι
  choice: أكثر قليلًا
  rationale: تحفظ معنى الزيادة المقارنة في περισσότερον مع التخفيف وعدم التحديد الذي تضيفه τι.
- source_word: καυχήσωμαι
  choice: افتخرتُ
  rationale: الفعل الماضي بعد «إن» أسلوب عربي طبيعي للتعبير عن الشرط الافتراضي، ويؤدي معنى صيغة الاحتمال اليونانية من غير تكلف.
- source_word: περὶ τῆς ἐξουσίας ἡμῶν
  choice: بسلطاننا
  rationale: «السلطان» يدل على حق أو صلاحية ممنوحة، لا على مجرد القدرة، والباء مع «افتخر» أفصح وأطبع في العربية.
- source_word: ἧς ἔδωκεν ὁ κύριος
  choice: الذي أعطانا إياه الرب
  rationale: يعود الموصول إلى السلطان، وتوضيح ضميري المفعول في العربية يبين أن الرب أعطى هذا السلطان لبولس ورفقائه.
- source_word: εἰς οἰκοδομὴν καὶ οὐκ εἰς καθαίρεσιν ὑμῶν
  choice: لبنيانكم لا لهدمكم
  rationale: تحفظ العبارة صورة البناء والهدم والمقابلة المقصودة، مع ربط الضمير بكلا الاسمين على نحو طبيعي.
- source_word: οὐκ αἰσχυνθήσομαι
  choice: فلن أُخزى
  rationale: تحفظ صيغة المبني للمجهول في اليونانية ومعنى التعرض للخزي أو ثبوت بطلان الافتخار، بدل قصر المعنى على شعور داخلي بالخجل.
theological_decisions:
- issue: طبيعة السلطان الرسولي وغايته
  choice: السلطان ممنوح من الرب لبنيان المؤمنين لا لهدمهم
  alternative: اعتبار السلطان موجَّهًا إلى عقاب الجماعة أو إهلاكها
  rationale: النص يصرح بالمقابلة بين البنيان والهدم. وتحافظ الصياغة على أن السلطان حقيقي وقد يُمارس بحزم، من غير تحويل غايته إلى الإتلاف.
- issue: دلالة عدم الخزي
  choice: لن يتعرض بولس للخزي ولن يتبين أن افتخاره باطل
  alternative: لن يشعر بولس بالخجل
  rationale: المبني للمجهول αἰσχυνθήσομαι يرجح معنى الوقوع في الخزي، مع بقاء احتمال الدلالة على الخجل جديرًا بالذكر في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. اختير «سلطاننا» للدلالة على الصلاحية المفوضة، وحُفظت استعارة البنيان والهدم. وُضعت علامتا الحاشيتين في المتن، كل واحدة عند العبارة التي تشرحها.
