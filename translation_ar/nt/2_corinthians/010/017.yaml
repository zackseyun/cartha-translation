  yaml_path: translation/nt/2_corinthians/010/017.yaml
  text: But the one who boasts must boast in the Lord[a].
translation:
  language: ar
  text: أَمَّا مَن يَفْتَخِرُ، فَلْيَفْتَخِرْ بِالرَّبِّ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بصياغة أكثر حرفية: «مَن يفتخر، فليفتخر بالرب». ويُرجَّح أن بولس يردّد صدى إرميا 9:24 (9:23 في السبعينية).'
    reason: إحالة كتابية وبيان الصياغة الحرفية
lexical_decisions:
- source_word: Ὁ ... καυχώμενος
  choice: مَن يفتخر
  rationale: اسم الموصول «مَن» مع الفعل المضارع يصوغان تعبيرًا عامًا طبيعيًا في العربية، ويقابلان اسم الفاعل المعرَّف المستعمل استعمال الاسم للدلالة على أي شخص يفتخر.
- source_word: δὲ
  choice: أمّا
  rationale: تفيد انتقالًا ذا مسحة مقابلة مع السياق السابق، وتلائم بناء الجملة العربي من غير تشديد قوة الاستدراك أكثر مما يحتمله النص.
- source_word: καυχώμενος / καυχάσθω
  choice: يفتخر / فليفتخر
  rationale: «يفتخر» ينقل المعنى المتكرر للفعل καυχάομαι ويحافظ على التكرار البلاغي في الأصل، وصيغة «فليفتخر» تقابل أمر الغائب καυχάσθω مباشرة وبأسلوب عربي فصيح طبيعي.
- source_word: ἐν
  choice: بِـ
  rationale: الباء في «يفتخر بالرب» هي الصياغة العربية الاصطلاحية التي تعبّر عن موضوع الافتخار أو أساسه، من غير حسم دلالي زائد.
- source_word: κυρίῳ
  choice: الرَّبّ
  rationale: يحافظ هذا المقابل على لقب κύριος كما ورد بلا تعيين تفسيري إضافي لهوية المشار إليه، كما ينسجم مع صدى نص إرميا المرجح.
theological_decisions:
- issue: مرجع «الرَّبّ» في سياق الاقتباس أو التلميح الكتابي
  choice: الرَّبّ
  alternative: الرب يسوع؛ الله
  rationale: النص اليوناني يذكر κυρίῳ فقط، مع صدى مرجح لإرميا 9:24 بحسب ترقيم النص العبري (9:23 في السبعينية). لذلك تُحفَظ الصياغة العامة ولا يُضاف تعيين غير مصرح به، بما يصون التوتر الدلالي في استعمال بولس.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعمل «أمّا ... فـ» لإبراز الانتقال والمقابلة، وحُفظ تكرار جذر «يفتخر» والأمر بصيغة الغائب. تظهر علامة الحاشية [a] في المتن.
