  text: For the weapons of our warfare are not fleshly[c][b][a], but powerful before God for the tearing down of strongholds—tearing down arguments
translation:
  language: ar
  text: لِأَنَّ أَسْلِحَةَ حَرْبِنَا لَيْسَتْ جَسَدِيَّةً[a]، بَلْ قَوِيَّةٌ بِاللهِ[b] لِهَدْمِ الْحُصُونِ—هَادِمِينَ الْحُجَجَ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مِنَ الجسد»؛ ويمكن أن يُفهم المعنى: ليست بشرية أو دنيوية.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «قوية لدى الله» أو «في نظر الله»، أو «ذات قوة إلهية».'
    reason: alternative_reading
  - marker: c
    text: 'أو: «الاستدلالات»، أو «التصورات».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπλα
  choice: أَسْلِحَة
  rationale: يحفظ الصورة العسكرية الملموسة، وهو المقابل العربي الطبيعي في هذا السياق.
- source_word: στρατείας
  choice: حَرْبِنَا
  rationale: ينقل معنى الصراع العسكري الجاري بوضوح، ويتجنب الإيحاءات الخاصة التي قد تحملها كلمة «جهاد» في الاستعمال العربي الحديث.
- source_word: σαρκικὰ
  choice: جَسَدِيَّة
  rationale: يحافظ على صلة اللفظ اليوناني بمفهوم الجسد، من غير أن يضيّق المعنى إلى «خاطئة» أو يفسره تفسيرًا مذهبيًا مسبقًا.
- source_word: δυνατὰ τῷ θεῷ
  choice: قَوِيَّةٌ أَمَامَ اللهِ
  rationale: يعكس تركيب المجرور الدال عليه الاسم في حالة المفعول غير المباشر من غير حسمه آليًا بمعنى الوسيلة؛ وتُذكر في الحاشية قراءات عربية ممكنة تعكس غموض التركيب.
- source_word: καθαίρεσιν
  choice: هَدْم
  rationale: يحفظ صورة إسقاط التحصينات، ويرتبط طبيعيًا بالفعل اللاحق «نهدم».
- source_word: ὀχυρωμάτων
  choice: الْحُصُون
  rationale: مقابل عربي واضح للتحصينات والمواقع المنيعة، ويلائم الصورة العسكرية والاستعمال المجازي معًا.
- source_word: λογισμοὺς
  choice: الْحُجَج
  rationale: يفيد طرائق الاستدلال المعارضة في السياق، لا مجرد الأفكار المحايدة؛ وتُحفظ البدائل الأوسع في الحاشية.
- source_word: καθαιροῦντες
  choice: إِذْ نَهْدِمُ
  rationale: يبيّن صلة اسم الفاعل بما قبله، ويحافظ بتكرار جذر «هدم» على الرابط البلاغي مع καθαίρεσιν.
theological_decisions:
- issue: دلالة σαρκικὰ في المقابلة بين الوسائل البشرية والقوة المرتبطة بالله
  choice: جَسَدِيَّة
  alternative: بشرية / من الجسد / دنيوية
  rationale: «جسدية» تبقي التوتر البولسي بين الجسد وما يأتي من الله، من غير مساواة اللفظ مباشرة بالخطية أو اختزاله في الدنيوية.
- issue: دلالة τῷ θεῷ في عبارة δυνατὰ τῷ θεῷ
  choice: قَوِيَّةٌ أَمَامَ اللهِ
  alternative: قوية بالله / ذات قوة إلهية
  rationale: التركيب اليوناني موجز ويحتمل فهمًا علائقيًا أو دالًا على المصدر أو الوسيلة. المتن يتبع صياغة قريبة من البنية، والحاشية تحفظ الاحتمالات الأخرى بدل حسمها.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية كريمة. حُفظت الصورة العسكرية وتكرار جذر «هدم»، ووُضعت علامات الحواشي بجوار الألفاظ التي تخصها. الشرطة الطويلة تعكس الانتقال في النص اليوناني إلى العبارة التي تستمر نحويًا في الآية التالية.
