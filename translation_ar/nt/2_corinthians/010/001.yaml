  text: Αὐτὸς δὲ ἐγὼ Παῦλος παρακαλῶ ὑμᾶς διὰ τῆς πραΰτητος καὶ ἐπιεικείας τοῦ Χριστοῦ, ὃς κατὰ πρόσωπον μὲν ταπεινὸς ἐν ὑμῖν, ἀπὼν δὲ θαρρῶ εἰς ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/001.yaml
  text: I myself[a], Paul, appeal to you by the meekness and gentleness of Messiah—I who am humble face to face among you[c][b], but bold toward you when absent.
translation:
  language: ar
  text: وأنا نفسي، بولس، أناشدكم بوداعة المسيح ورِفقه، أنا الذي أكون متواضعًا[b] في حضوري بينكم[a]، لكنني أكون جريئًا تجاهكم حين أكون غائبًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «بحسب الوجه»؛ أي في الحضور الشخصي.'
    reason: lexical_alternative
  - marker: b
    text: 'قد يعكس «متواضعًا» وصفًا ساخرًا لما كان بعضهم يقوله عن بولس عند حضوره؛ ويمكن أيضًا ترجمته: «وضيعًا»، أو بتفسير أضيق: «هيّابًا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτὸς δὲ ἐγὼ Παῦλος
  choice: وأنا نفسي، بولس
  rationale: يحفظ توكيد الضمير مع اسم بولس، وتؤدي الواو وظيفة δέ الانتقالية الخفيفة من غير تحميلها تضادًا قويًا.
- source_word: παρακαλῶ ὑμᾶς
  choice: أناشدكم
  rationale: ينقل معنى الالتماس الشخصي الجاد في هذا السياق، لا مجرد الأمر أو الوعظ.
- source_word: διὰ τῆς πραΰτητος καὶ ἐπιεικείας
  choice: بوداعة ... وحِلمه
  rationale: «الوداعة» مناسبة لـ πραΰτης، و«الحِلم» ينقل في ἐπιείκεια معنى الرفق وضبط النفس والتسامح، مع الحفاظ على تمايز اللفظين.
- source_word: τοῦ Χριστοῦ
  choice: المسيح
  rationale: Χριστός لقب هنا، و«المسيح» هو المقابل العربي الطبيعي الراسخ الذي يحفظ دلالته اللقبية.
- source_word: κατὰ πρόσωπον
  choice: حين أكون بينكم وجهًا لوجه
  rationale: يحفظ الصورة الحرفية للتعبير ويبيّن أنه يشير إلى الحضور الشخصي في مقابل الغياب.
- source_word: ταπεινὸς
  choice: متواضعًا
  rationale: يحفظ المعنى المعجمي مع إبقاء احتمال أن يكون بولس يردد وصف خصومه له على سبيل المفارقة، من غير تفسيره صراحة بأنه «خجول» أو «ضعيف».
- source_word: ἀπὼν δὲ θαρρῶ εἰς ὑμᾶς
  choice: لكنني أكون جريئًا تجاهكم حين أكون غائبًا
  rationale: يبرز التقابل بين الحضور والغياب، وتحفظ «تجاهكم» اتجاه الموقف من غير أن تجعله عدائيًا بالضرورة.
theological_decisions:
- issue: نبرة وصف بولس لنفسه بأنه ταπεινός
  choice: متواضعًا، مع إبقاء المفارقة محتملة
  alternative: وضيعًا أو هيّابًا
  rationale: قد يكون الكلام صدى لاتهام الخصوم، لكن اليونانية لا تضعه في اقتباس صريح؛ لذلك لا يحسم النص الترجمي ما إذا كان بولس يتبنى الوصف أو يردده تهكمًا.
- issue: دلالة Χριστός
  choice: المسيح
  alternative: كريستوس أو الممسوح
  rationale: اللفظة لقب ذو مضمون مسياني، و«المسيح» في العربية ترجمة طبيعية راسخة لهذا اللقب من غير اختزاله إلى اسم مجرد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «أناشدكم» لنبرة الالتماس، وحُفظ التوكيد في «وأنا نفسي، بولس». وُضعت علامتا الحاشية في موضعيهما داخل النص، مع عدم حسم السخرية المحتملة في وصف بولس.
