review_pass:
  verdict: revise
  source_fidelity: المعنى العام محفوظ، ولا سيما النطاق الموكول من الله الذي يمتد إلى الكورنثيين. لكن «بما يتجاوز الحدود» قد يُفهم على أنه الشيء الذي يقع عليه الافتخار، لا مقدار الافتخار نفسه؛ كما أن «قسّمه» قد يوحي بتقسيم النطاق بدل تخصيصه أو إسناده لهم.
  naturalness: الصياغة مفهومة وفصيحة إجمالًا، لكن «أما نحن فلن يتجاوز افتخارنا الحدود» أكثر سلاسة ووضوحًا في العربية الحديثة، و«خصّصه الله لنا» أدق وأشيع في هذا السياق من «قسّمه الله لنا».
  terminology: «النطاق» اختيار مناسب لـ κανών في هذا السياق المكاني/الخدمي، مع الحاشية التي تحفظ بدائل «الحدّ» و«المعيار». واستبدال «مقدار» بـ«مقياس» في موضعي μέτρον يحافظ على صورة القياس ويجعل التركيب العربي أكثر تماسكًا.
  issues:
  - severity: medium
    issue: تعلّق عبارة «بما يتجاوز الحدود» بالفعل «نفتخر» غير محدد.
    rationale: قد تُقرأ العبارة على أنها تحدد موضوع الافتخار («نفتخر بما...»)، بينما المقصود أن الافتخار ذاته لا يتجاوز المقدار/الحدود المعيّنة.
  - severity: low
    issue: «قسّمه الله لنا» أقل دقة في سياق الإسناد أو التخصيص.
    rationale: الفعل μερίζω هنا يفيد أن الله خصص أو عيّن لهم نطاقًا؛ وقد يفهم «قسّمه» عربيًا بمعنى جزّأه.
  - severity: low
    issue: «أنتم أيضًا» أضعف في نقل وظيفة καί التأكيدية.
    rationale: في السياق تؤكد καί أن نطاقهم يبلغ الكورنثيين أنفسهم؛ و«إليكم أنتم» تؤدي هذا التوكيد عربيًا بلا إيحاء غير لازم بـ«أيضًا».
