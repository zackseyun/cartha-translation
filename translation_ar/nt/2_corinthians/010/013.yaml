  text: But we will not boast beyond measure[a], but according to the measure of the sphere that God assigned to us—a measure that reaches even to you—
translation:
  language: ar
  text: أَمَّا نَحْنُ فَلَنْ يَتَجَاوَزَ افْتِخَارُنَا الْحُدُودَ، بَلْ بِحَسَبِ مِقْيَاسِ النِّطَاقِ[a] الَّذِي خَصَّصَهُ اللهُ لَنَا—مِقْيَاسٍ يَمْتَدُّ حَتَّى إِلَيْكُمْ أَنْتُمْ—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الحدّ» أو «المعيار»؛ فاللفظة اليونانية قد تدل على قضيب قياس، أو معيار، أو نطاق معيَّن.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄμετρα
  choice: بِمَا يَتَجَاوَزُ الْحُدُودَ
  rationale: ينقل التعبير الاصطلاحي الدال على تجاوز الحدود اللائقة، مع إبقاء صورة الحد والقياس واضحة بالعربية.
- source_word: καυχησόμεθα
  choice: نَفْتَخِرَ
  rationale: فعل عربي مباشر وطبيعي يدل هنا على التفاخر أو ادعاء الفضل في السياق الجدلي.
- source_word: κατὰ τὸ μέτρον
  choice: بِحَسَبِ مِقْدَارِ
  rationale: يحفظ معنى المطابقة للمقدار المعيَّن ويتيح تكرار لفظ المقدار كما في اليونانية.
- source_word: κανόνος
  choice: النِّطَاقِ
  rationale: السياق المكاني، ولا سيما القسمة والامتداد إلى الكورنثيين، يرجح معنى مجال الخدمة المخصص لا قاعدة أخلاقية مجردة.
- source_word: οὗ ἐμέρισεν ἡμῖν ὁ θεὸς
  choice: الَّذِي قَسَمَهُ اللهُ لَنَا
  rationale: يحافظ «قسم» على دلالة التوزيع والتخصيص في μερίζω، وهو تعبير عربي واضح وموجز.
- source_word: μέτρου
  choice: وَهُوَ مِقْدَارٌ
  rationale: يجعل التكرار اليوناني مفهومًا بوصفه توضيحًا للنطاق من غير إسقاط لفظ القياس.
- source_word: ἐφικέσθαι
  choice: يَمْتَدُّ
  rationale: ينقل دلالة بلوغ النطاق المخصص إلى غاية معينة بصورة طبيعية.
- source_word: ἄχρι καὶ ὑμῶν
  choice: حَتَّى إِلَيْكُمْ أَنْتُمْ أَيْضًا
  rationale: يحفظ معنى الغاية في ἄχρι والتوكيد الإدماجي في καί.
theological_decisions:
- issue: دلالة κανών في دعوى بولس الرسولية
  choice: نطاق خدمة خصصه الله ويشمل الكورنثيين
  alternative: قاعدة أو معيار يقيس بولس بموجبه افتخاره
  rationale: تضافر ألفاظ المقدار والقسمة والامتداد يرجح الصورة المكانية لنطاق موكول من الله، مع الإقرار بأن اللفظة قد تدل أيضًا على المعيار أو القاعدة.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كريمة. استُعمل «النطاق» لتجنب إيحاء «القانون» الاصطلاحي، وأُبقي تكرار «مقدار» حفاظًا على صورة القياس في الأصل. وُضع مؤشر الحاشية [a] في المتن.
