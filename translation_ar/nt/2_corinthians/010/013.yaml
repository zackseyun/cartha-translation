revisions:
- from: أَمَّا نَحْنُ فَلَنْ نَفْتَخِرَ بِمَا يَتَجَاوَزُ الْحُدُودَ، بَلْ بِحَسَبِ مِقْدَارِ النِّطَاقِ[a] الَّذِي قَسَمَهُ اللهُ لَنَا، وَهُوَ مِقْدَارٌ يَمْتَدُّ حَتَّى إِلَيْكُمْ أَنْتُمْ أَيْضًا—
  to: أَمَّا نَحْنُ فَلَنْ يَتَجَاوَزَ افْتِخَارُنَا الْحُدُودَ، بَلْ بِحَسَبِ مِقْيَاسِ النِّطَاقِ[a] الَّذِي خَصَّصَهُ اللهُ لَنَا—مِقْيَاسٍ يَمْتَدُّ حَتَّى إِلَيْكُمْ أَنْتُمْ—
  rationale: توضح المراجعة أن الحدّ يتعلق بمقدار افتخار بولس لا بموضوعه، وتستبدل «قسّمه» بـ«خصّصه» لتعكس الإسناد الإلهي للنطاق. كما تحافظ على تكرار صورة القياس في الأصل وعلى دلالة النطاق الخدمي لـκανών، وتُبقي الحاشية البديلة دون فرض قراءة واحدة للكلمة.
