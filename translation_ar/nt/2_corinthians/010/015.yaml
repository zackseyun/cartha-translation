  yaml_path: translation/nt/2_corinthians/010/015.yaml
  text: not boasting beyond measure in the labors of others, but having hope that, as your faith is growing among you, we will be enlarged according to our sphere of ministry, unto abundance,
translation:
  language: ar
  text: لا نفتخر افتخارًا يتجاوز الحدود بأتعاب الآخرين، بل لنا رجاء بأنه، مع نمو إيمانكم، نزداد اتساعًا بينكم بحسب نطاقنا[a][b] إلى مدى أوسع[c]،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بحسب مقياسنا المعيَّن» أو «بحسب مجالنا»؛ فاللفظة اليونانية تشير هنا إلى نطاق مقيس أو مجال للعمل.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «نُعظَّم»؛ أو «نتسع». ويشير السياق إلى اتساع المجال أو العمل الرسولي، لا إلى مجرد مدح شخصي.'
    reason: alternative_reading
  - marker: c
    text: 'أو: «إلى وفرة» أو «لمزيد من الامتداد».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ εἰς τὰ ἄμετρα καυχώμενοι
  choice: لا نفتخر بما يتجاوز الحدود
  rationale: ينقل معنى عدم تجاوز الحدود المرسومة في الافتخار، ويحافظ على صورة القياس والحدود بصياغة عربية طبيعية.
- source_word: ἐν ἀλλοτρίοις κόποις
  choice: في أتعاب الآخرين
  rationale: يحافظ على معنى κόποις بوصفه تعبًا وكدًّا، ويبيّن أن بولس لا ينسب إلى نفسه عمل غيره.
- source_word: ἐλπίδα δὲ ἔχοντες
  choice: بل لنا رجاء
  rationale: يحافظ على الاسم ἐλπίδα وعلى المقابلة التي تفيدها δέ، بصياغة عربية موجزة.
- source_word: αὐξανομένης τῆς πίστεως ὑμῶν ἐν ὑμῖν
  choice: مع نمو إيمانكم بينكم
  rationale: ينقل تركيب الحال المصاحب، ويأخذ ἐν ὑμῖν على أنه يشير إلى نمو الإيمان وسط جماعة المؤمنين، مع إبقاء احتمال تعلقه بما بعده مفهومًا من السياق اليوناني.
- source_word: μεγαλυνθῆναι
  choice: يتسع عملنا
  rationale: المعنى السياقي هو امتداد نشاط بولس الرسولي لا تعظيم شخصه؛ وإضافة «عملنا» توضح المقصود من المبني للمجهول دون جعله افتخارًا شخصيًا.
- source_word: κατὰ τὸν κανόνα ἡμῶν
  choice: بحسب نطاق خدمتنا
  rationale: κανών في السياق هو المجال المقيس أو المعيّن للعمل، لا «القانون» أو «السفر القانوني» بالمعنى اللاحق.
- source_word: εἰς περισσείαν
  choice: اتساعًا عظيمًا
  rationale: ينقل اتجاه العبارة نحو مزيد من الامتداد والوفرة بصياغة عربية مفهومة.
theological_decisions:
- issue: دلالة μεγαλυνθῆναι وصلتها بالسلطان الرسولي
  choice: اتساع عمل بولس وخدمته
  alternative: تعظيم بولس شخصيًا أو زيادة مكانته لدى الكورنثيين
  rationale: السياق المباشر يتناول حدود مجال العمل وعدم الافتخار بأتعاب الآخرين؛ لذلك يُفهم التعظيم هنا أساسًا بوصفه امتدادًا للعمل، مع إثبات البدائل في الحاشية.
- issue: معنى κανών
  choice: نطاق الخدمة
  alternative: القاعدة أو المقياس المعيّن
  rationale: يشير اللفظ هنا إلى مجال مقيس للعمل الرسولي؛ وهذه الصياغة تتجنب الإيحاء بمعنى «القانون» الكنسي اللاحق.
- issue: موضع تعلق ἐν ὑμῖν
  choice: 'بإيمانكم: «نمو إيمانكم بينكم»'
  alternative: 'بالفعل التالي: «يتسع عملنا بينكم»'
  rationale: موضع العبارة اليونانية يحتمل الوجهين، والقراءة المختارة طبيعية وتوافق نمو الإيمان داخل الجماعة، من غير إنكار الاحتمال التركيبي الآخر.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. حافظت الصياغة على استعارة الحدود والنطاق، وفسّرت μεγαλυνθῆναι تفسيرًا سياقيًا في المتن مع توثيق حرفيته والبدائل في الحاشية. وُضعت جميع علامات الحواشي في النص.
