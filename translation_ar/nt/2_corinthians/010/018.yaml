  yaml_path: translation/nt/2_corinthians/010/018.yaml
  text: For it is not the one who commends himself who is approved[a], but the one whom the Lord commends.
translation:
  language: ar
  text: فَإِنَّ الَّذِي يُزَكِّي نَفْسَهُ لَيْسَ هُوَ الْمَقْبُولَ، بَلِ الَّذِي يُزَكِّيهِ الرَّبُّ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فإن الذي يوصي بنفسه ليس هو المقبول، بل الذي يوصي به الرب». استُعمل الفعل اليوناني نفسه في الموضعين.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνιστάνων / συνίστησιν
  choice: يُزَكِّي / يُزَكِّيهِ
  rationale: في سياق الافتخار والتقييم، يدل الفعل على تقديم شخص بوصفه جديرًا بالقبول أو الثناء. ويحافظ تكرار «يزكّي» على وحدة الفعل اليوناني في الموضعين.
- source_word: δόκιμος
  choice: الْمُعْتَمَدَ
  rationale: يدل اللفظ على من ثبتت أهليته ونال القبول بعد التقييم. و«المعتمد» يعبّر بوضوح عن كونه مقبولًا ومُقَرًّا، في مقابل تزكية المرء لنفسه.
- source_word: κύριος
  choice: الرَّبُّ
  rationale: ترجمة اللقب بصيغته المعيارية من غير تعيين مرجعه بأكثر مما يقوله النص.
- source_word: ἑαυτὸν
  choice: نَفْسَهُ
  rationale: يحفظ الضمير الانعكاسي وصيغة المفرد المذكر في الأصل.
- source_word: ὃν
  choice: مَنْ
  rationale: اسم الموصول «مَن» يصوغ المقابلة بين الشخص الذي يزكي نفسه والشخص الذي يزكيه الرب بصورة عربية طبيعية.
- source_word: γὰρ
  choice: لِأَنَّ
  rationale: تنقل الأداة التعليلية التي تربط الآية بما قبلها وتفسره.
theological_decisions:
- issue: مرجع «الرب» (ὁ κύριος)
  choice: الإبقاء على «الرب» دون تحديد إضافي
  alternative: الرب يسوع؛ أو الله
  rationale: يغلب في الاستعمال البولسي أن يشير اللقب إلى يسوع، لكن الآية نفسها لا تقول إلا «الرب»، ولذلك تُحفظ دلالة النص من غير حسم زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. اختيرت «يزكّي» لدقتها في سياق الشهادة بالأهلية والثناء، مع إثبات البديل «يوصي» في الحاشية. وُضع مؤشر الحاشية بعد الجملة كلها لأنه يشرح الفعل المتكرر في شطريها.
