translation:
  language: ar
  text: وكلَّ شيءٍ شامخٍ يُرفَع ضدَّ معرفة الله[a]، ونأسر كلَّ فكرٍ ونسوقه إلى طاعة المسيح[b]،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كلَّ علوٍّ»، أو «كلَّ ادعاءٍ متعالٍ»، بدلًا من «كلَّ شيءٍ شامخٍ».'
    reason: lexical_alternative
  - marker: b
    text: «المسيح» لقب يعني «الممسوح».
    reason: title_clarification
lexical_decisions:
- source_word: πᾶν ὕψωμα
  choice: كلَّ شيءٍ شامخٍ
  rationale: يحفظ صورة الشيء المرتفع أو المتعالي، من غير حصر المعنى في الادعاءات الفكرية أو الكبرياء النفسي وحدهما، ويؤدي πᾶν بمعنى شمولي توزيعي.
- source_word: ἐπαιρόμενον
  choice: يرتفع
  rationale: ينقل معنى الارتفاع أو الإعلاء مع إبقاء العبارة مفتوحة بشأن كون الشيء يرفع نفسه أو يُرفَع، ويلائم صورة العائق الشامخ.
- source_word: κατὰ τῆς γνώσεως τοῦ θεοῦ
  choice: ضدَّ معرفة الله
  rationale: يحافظ على إيجاز التركيب اليوناني وعلى سعة دلالة الإضافة، فلا يحصرها في المعرفة عن الله أو في فعل معرفة الله وحده.
- source_word: αἰχμαλωτίζοντες
  choice: نأسر
  rationale: يحفظ الاستعارة العسكرية الواضحة في الفعل، الذي يدل على أخذ الأسير.
- source_word: πᾶν νόημα
  choice: كلَّ فكرٍ
  rationale: «فكر» هو المقابل العربي الطبيعي هنا، مع إبقاء القوة التوزيعية لـπᾶν وعدم تضييق νόημα إلى «مكيدة» أو «تدبير».
- source_word: εἰς τὴν ὑπακοὴν
  choice: ونسوقه إلى طاعة
  rationale: تُظهر «إلى» الحركة نحو حالة الطاعة، وأُضيف الفعل «نسوقه» عربيًا لإتمام صورة اقتياد الأسير والمحافظة على القوة الاتجاهية لحرف الجر.
- source_word: τοῦ Χριστοῦ
  choice: المسيح
  rationale: Χριστός لقب معرّف في هذا الموضع، والمقابل العربي الراسخ الدال على معنى اللقب هو «المسيح».
theological_decisions:
- issue: طبيعة ما يقاوم معرفة الله في πᾶν ὕψωμα ἐπαιρόμενον
  choice: شيء شامخ يقف ضد معرفة الله بوجه عام
  alternative: ادعاء متعالٍ يرفع نفسه ضد معرفة الله
  rationale: الصورة اليونانية أوسع من الادعاء المتكبر وحده؛ لذلك يحفظ النص صورة الارتفاع ويترك هوية العائق مفتوحة كما في الأصل.
- issue: دلالة τοῦ Χριστοῦ
  choice: الطاعة الموجَّهة إلى المسيح
  alternative: طاعة المسيح نفسه لله
  rationale: مع أن الإضافة اليونانية موجزة، فإن تركيب εἰς τὴν ὑπακοὴν τοῦ Χριστοῦ في هذا السياق يُفهم طبيعيًا بوصفه اقتياد الأفكار إلى طاعة المسيح؛ وتحافظ الصياغة العربية على هذا الاتجاه دون توسيع عقائدي.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كريمة. حُفظت الاستعارتان، صورة الشيء الشامخ وصورة أسر الفكر واقتياده، مع تجنب حصر المعارضة في نوع فكري أو نفسي بعينه. جاءت العبارة جزءًا نحويًا متصلًا بالسياق السابق، كما في المصدر.
