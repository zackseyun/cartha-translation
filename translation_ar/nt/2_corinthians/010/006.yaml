  text: καὶ ἐν ἑτοίμῳ ἔχοντες ἐκδικῆσαι πᾶσαν παρακοήν, ὅταν πληρωθῇ ὑμῶν ἡ ὑπακοή.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/006.yaml
  text: and being ready to punish every act of disobedience[b][a], when your obedience is complete.
translation:
  language: ar
  text: ومستعدون لمعاقبة كل عصيان[a]، حين تكتمل طاعتكم[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لإنزال الجزاء بكل عصيان» أو «للانتقام من كل عصيان». قد يدل الفعل اليوناني على إنفاذ العدل أو الانتقام، ويبدو أنه يشير هنا إلى العقوبة التأديبية في هذا السياق.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «حين تتمّ طاعتكم» أو «حين تبلغ طاعتكم تمامها».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἑτοίμῳ ἔχοντες
  choice: مستعدون
  rationale: ينقل التعبير الاصطلاحي الدال على الجاهزية بصياغة عربية طبيعية، مع إبقاء الصلة بما قبله من خلال واو العطف.
- source_word: ἐκδικῆσαι
  choice: لمعاقبة
  rationale: الفعل قد يدل على إنفاذ الجزاء أو الانتقام، لكن «معاقبة» تلائم سياق استعمال السلطة الرسولية للتأديب، من غير أن توحي بانتقام شخصي.
- source_word: πᾶσαν παρακοήν
  choice: كل عصيان
  rationale: «العصيان» ينقل معنى رفض الطاعة، و«كل» تحفظ القوة الاستغراقية أو التوزيعية للعبارة اليونانية.
- source_word: ὅταν
  choice: حين
  rationale: أداة زمنية طبيعية تشير هنا إلى ظرف مستقبلي مرتبط باكتمال الطاعة؛ ولا تحوّل العبارة إلى تكرار معتاد كما قد توحي «كلما».
- source_word: πληρωθῇ
  choice: تكتمل
  rationale: ينقل بلوغ الطاعة تمامها بصياغة عربية واضحة، مع الحفاظ على دلالة الفعل المبني للمجهول اليوناني من حيث وصولها إلى الاكتمال دون تحديد الفاعل.
- source_word: ὑμῶν ἡ ὑπακοή
  choice: طاعتكم
  rationale: ترجمة مباشرة وطبيعية للإضافة، والمقصود طاعة المخاطَبين.
theological_decisions:
- issue: طبيعة الإجراء الذي ينوي بولس اتخاذه تجاه العصيان
  choice: معاقبة العصيان في سياق استعمال السلطة الرسولية للتأديب
  alternative: الانتقام من المعارضين شخصيًا، أو الإشارة إلى دينونة إلهية أخروية
  rationale: السياق القريب يتناول السلطة الرسولية ومواجهة المعارضة. «معاقبة» تحفظ معنى إنفاذ الجزاء من غير أن تحسم تفاصيل الإجراء أو تنسب إلى بولس انتقامًا شخصيًا.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. جاءت العبارة موجزة محافظة على البنية التابعة للسياق السابق، ووُضعت علامتا الحاشيتين عند اللفظين اللذين لهما بدائل معتبرة.
