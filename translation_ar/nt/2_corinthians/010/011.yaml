  text: 'Let such a person consider this: what we are in word by letters when absent[b][a], we are also in deed when present.'
translation:
  language: ar
  text: 'فليأخذْ شخصٌ كهذا في الحسبان: كما نكون في كلامنا بالرسائل ونحن غائبون، كذلك نكون أيضًا في أفعالنا ونحن حاضرون.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كما نكون في القول بالرسائل ونحن غائبون، كذلك نكون أيضًا في الفعل ونحن حاضرون».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λογιζέσθω
  choice: فليضع ... في حسابه
  rationale: ينقل صيغة الأمر ومعنى أن يحسب الشخص الأمر ويأخذه بجدية، بعبارة عربية واضحة وشائعة.
- source_word: ὁ τοιοῦτος
  choice: مثل هذا
  rationale: يحافظ على الإشارة المفردة إلى الشخص ذي الصفة المذكورة في السياق، من غير تعبير عتيق أو ازدرائي زائد.
- source_word: οἷοί ἐσμεν ... τοιοῦτοι
  choice: كما نكون ... كذلك نكون أيضًا
  rationale: يحفظ التطابق النوعي والبنية المقارِنة بين حال بولس ورفقائه في الرسائل وحالهم عند الحضور.
- source_word: τῷ λόγῳ
  choice: في كلامنا
  rationale: ينقل دلالة المجال أو الاعتبار، ويظل طبيعيًا بالعربية مع إبقاء المقابلة البلاغية مع الأفعال.
- source_word: δι’ ἐπιστολῶν
  choice: بالرسائل
  rationale: 'ينقل معنى الوسيلة في διά مع المضاف إليه: الرسائل هي وسيلة إيصال الكلام.'
- source_word: ἀπόντες
  choice: ونحن غائبون
  rationale: يؤدي وظيفة اسم الفاعل الظرفية ويحفظ المقابلة مع الحضور.
- source_word: τῷ ἔργῳ
  choice: في أفعالنا
  rationale: يعبّر عن مجال العمل الفعلي في مقابل الكلام، بصياغة عربية مفهومة لا تقصر المفرد اليوناني بالضرورة على فعل واحد.
- source_word: παρόντες
  choice: ونحن حاضرون
  rationale: يحفظ التوازي الزمني والبلاغي مع «ونحن غائبون».
theological_decisions:
- issue: العلاقة بين كلام بولس في الرسائل وأفعاله عند حضوره
  choice: صياغة الآية كتأكيد أن ما يظهره بولس ورفقاؤه في كلام الرسائل وهم غائبون يطابق ما سيكونون عليه في الأفعال عند الحضور.
  alternative: تحويل العبارة إلى تهديد صريح بفعل مستقبلي، أو جعلها مجرد مقابلة بين أسلوب الكلام والقوة.
  rationale: النص اليوناني يقيم مقارنة نوعية مباشرة بين الكلام بواسطة الرسائل في الغياب والعمل في الحضور؛ لذلك تُحفظ نبرة التحذير من غير إضافة تهديد أو تقرير كنسي أوسع.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت المقابلة الطبيعية «كلامنا/أفعالنا» في المتن، مع إثبات الصياغة الأقرب شكليًا «القول/الفعل» في الحاشية لحفظ الإيجاز البلاغي في اليونانية.
