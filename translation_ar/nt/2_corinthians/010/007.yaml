source:
  edition: SBLGNT
  text: Τὰ κατὰ πρόσωπον βλέπετε. εἴ τις πέποιθεν ἑαυτῷ Χριστοῦ εἶναι, τοῦτο λογιζέσθω πάλιν ⸀ἐφ’ ἑαυτοῦ ὅτι καθὼς αὐτὸς Χριστοῦ οὕτως καὶ ⸀ἡμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/007.yaml
  text: 'You are looking at outward appearances[a]. If anyone is confident in himself that he belongs to Messiah, let him consider this again within himself: that just as he belongs to Messiah[b], so also do we.'
translation:
  language: ar
  text: 'أنتم تنظرون إلى ما هو ظاهر[a]. إن كان أحدٌ واثقًا في نفسه بأنه للمسيح[b]، فليعد النظر في نفسه: فكما أنه هو للمسيح، فنحن أيضًا للمسيح.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بصورة أقرب إلى اللفظ: «تنظرون إلى الأمور بحسب الظاهر». ويمكن أن تُفهم العبارة أيضًا على أنها أمر: «انظروا إلى ما هو أمام وجوهكم».'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «أنه للمسيح»، أي إنه ينتمي إلى المسيح.'
    reason: clarification
lexical_decisions:
- source_word: Τὰ κατὰ πρόσωπον
  choice: ما هو ظاهر
  rationale: ينقل المعنى الاصطلاحي المتعلق بالمظهر الخارجي، مع إبقاء الاحتمال الحرفي الآخر في الحاشية.
- source_word: βλέπετε
  choice: أنتم تنظرون
  rationale: صيغته يمكن أن تكون خبرًا أو أمرًا، لكن سياق التوبيخ يرجّح الخبر؛ وقد ذُكر احتمال الأمر في الحاشية.
- source_word: πέποιθεν ἑαυτῷ
  choice: واثقًا في نفسه
  rationale: يعبر الفعل التام عن ثقة مستقرة، ويبيّن الضمير أن هذه الثقة قائمة في تقدير الشخص لنفسه.
- source_word: Χριστοῦ εἶναι
  choice: بأنه للمسيح
  rationale: 'يحافظ على تركيب الملكية والانتماء في اليونانية، ويترجم Χριστός بوصفه لقبًا: «المسيح».'
- source_word: λογιζέσθω πάλιν ἐφ’ ἑαυτοῦ
  choice: فليعتبر هذا مرةً أخرى في نفسه
  rationale: ينقل الأمر بإعادة التفكير والتقدير الداخلي من غير تحويله إلى مجرد معرفة ذهنية.
- source_word: καθὼς αὐτὸς Χριστοῦ οὕτως καὶ ἡμεῖς
  choice: كما أنه هو للمسيح، كذلك نحن أيضًا
  rationale: يحافظ على المقارنة وعلى الإيجاز الناتج من حذف الفعل في الأصل.
theological_decisions:
- issue: دلالة Χριστοῦ
  choice: للمسيح
  alternative: ينتمي إلى المسيح
  rationale: الصياغة المختارة تحفظ علاقة الملكية أو الانتماء المقصودة، وتبقي «المسيح» لقبًا، من غير إضافة تحديد مذهبي لطبيعة هذا الانتماء.
- issue: صيغة βλέπετε الخبرية أو الأمرية
  choice: أنتم تنظرون
  alternative: انظروا
  rationale: السياق يرجّح أن بولس يوبخ المخاطَبين على حكمهم بحسب الظاهر، لكن الصيغة اليونانية تحتمل الأمر أيضًا، لذلك حُفظ البديل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة وقورة. استُخدمت «ما هو ظاهر» بدل تعبير أثقل مثل «المظاهر الخارجية»، وحُفظ التوازي المكثف في خاتمة الآية.
