  text: ὅτι Αἱ ⸂ἐπιστολαὶ μέν⸃, φησίν, βαρεῖαι καὶ ἰσχυραί, ἡ δὲ παρουσία τοῦ σώματος ἀσθενὴς καὶ ὁ λόγος ἐξουθενημένος.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/010.yaml
  text: For they say[a], “His letters are weighty and strong, but his bodily presence is weak[b], and his speech is despised.”
translation:
  language: ar
  text: 'لأنهم يقولون[a]: «رسائله ثقيلة وقوية، أما حضوره الجسدي فضعيف، وكلامه مُحتقَر[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لأنه يقول: رسائله ثقيلة وقوية...» فالفعل اليوناني مفرد حرفيًا («يقول»)، وقد يُستعمل صيغةً اعتراضية لنقل قول ممثِّل أو رأي متداول؛ والمقصود هنا رأي منتقدي بولس.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «وكلامه حقير» أو «لا قيمة له».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: لأن
  rationale: تربط العبارة بما قبلها تعليلًا أو بيانًا لمضمونه، و«لأنهم يقولون» صياغة عربية طبيعية في هذا السياق.
- source_word: ἐπιστολαὶ
  choice: رسائل
  rationale: المعنى العادي هو المراسلات المكتوبة، و«رسائل» لفظ عربي واضح لا يفرض نبرة كنسية خاصة.
- source_word: μέν ... δὲ
  choice: '... أما ... فـ'
  rationale: ينقل هذا التركيب المقابلة بين قوة الرسائل وضعف الحضور الشخصي بصورة عربية طبيعية.
- source_word: φησίν
  choice: يقولون
  rationale: الفعل مفرد في اليونانية حرفيًا، لكنه يمكن أن يأتي صيغة اعتراضية لنقل قول ممثل أو رأي متداول؛ والسياق يعرض انتقاد خصوم بولس.
- source_word: βαρεῖαι
  choice: ثقيلة
  rationale: تحفظ استعارة الثقل وتفيد الجدية وقوة الوقع من غير تفسير زائد.
- source_word: ἰσχυραί
  choice: قوية
  rationale: مقابل مباشر يحافظ على اقتران الصفتين «ثقيلة وقوية».
- source_word: παρουσία τοῦ σώματος
  choice: حضوره بالجسد
  rationale: يحفظ ذكر الجسد صراحة ويعبّر عن وجود بولس الشخصي في مقابل رسائله.
- source_word: ἀσθενὴς
  choice: ضعيف
  rationale: مقابل مباشر يترك نوع الضعف المقصود مفتوحًا كما في الأصل.
- source_word: λόγος
  choice: كلامه
  rationale: يشير هنا إلى كلام بولس الشفهي أو أدائه في الحديث في مقابل رسائله المكتوبة.
- source_word: ἐξουθενημένος
  choice: مُحتقَر
  rationale: ينقل معنى كونه موضع ازدراء أو معدودًا بلا شأن، مع إبراز أنه تقييم الآخرين لا تقرير لقيمته الذاتية.
theological_decisions:
- issue: عدم عرض انتقاد بولس كأنه حكم يقرّه الراوي
  choice: 'صيغت العبارة بوصفها قولًا منقولًا عن منتقديه: «لأنهم يقولون...»'
  alternative: «لأنه يقول...» أو «لأنه يُقال...»
  rationale: السياق ينقل رأي خصوم بولس، لا حكمًا موضوعيًا على حضوره أو كلامه؛ واختيار الجمع يوضح الإطار الخطابي، مع إثبات مفرد اليونانية في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظت مقابلة الرسائل بالحضور الجسدي، كما حُفظت استعارة «ثقيلة» وغموض طبيعة الضعف. استُعمل «مُحتقَر» بدل «حقير» في المتن لتفادي الإيحاء بأن الكلام عديم القيمة في ذاته بدل كونه موضع ازدراء المنتقدين.
