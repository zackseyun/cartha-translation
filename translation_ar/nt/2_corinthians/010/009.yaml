  text: لئلّا أبدو كأنني أُخيفكم بالرسائل[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لئلّا أبدو كأنني أرهّبكم عن طريق الرسائل».'
    reason: بديل معجمي لـἐκφοβεῖν («أرهّب») وصياغة أوضح للوسيلة في διά.
lexical_decisions:
- source_word: ἵνα μὴ
  choice: لئلّا
  rationale: تنقل أداة الغاية أو النتيجة مع النفي في صياغة عربية موجزة وطبيعية، وتبقي ارتباط العبارة بالسياق السابق.
- source_word: δόξω
  choice: أبدو
  rationale: الفعل هنا بمعنى «أبدو/أظهر»، لا بمعنى «أظن»، وهو في صيغة الاحتمال التابعة لعبارة الغاية.
- source_word: ὡς ἂν
  choice: كأنني
  rationale: تحفظ معنى التشبيه والانطباع الظاهري بصياغة عربية طبيعية، من غير الجزم بأن التخويف هو قصد بولس الفعلي.
- source_word: ἐκφοβεῖν
  choice: أُحاول إخافتكم
  rationale: المعنى الأساسي هو إحداث الخوف أو الترهيب. وإضافة «أحاول» توضّح عربيًا أن العبارة تصف ما قد يبدو أنه قصد، لا تقرير وقوع التخويف فعلًا.
- source_word: ὑμᾶς
  choice: كم في «إخافتكم»
  rationale: ضمير جمع المخاطبين، وهو المفعول به للفعل.
- source_word: διὰ τῶν ἐπιστολῶν
  choice: بالرسائل
  rationale: تنقل دلالة الوسيلة في διά مع المضاف إليه. وأُبقي تعريف «الرسائل» كما في اليونانية بدل تحويله في المتن إلى ضمير ملكية صريح.
