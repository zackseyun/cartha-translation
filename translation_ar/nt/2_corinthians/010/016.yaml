translation:
  language: ar
  text: لِنُبَشِّرَ في المناطقِ التي وراءَكم[a]، لا أن نفتخرَ في نطاقِ شخصٍ آخر[b] بأمورٍ مُعَدَّةٍ من قبل[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لنبشّر بالإنجيل في البلاد التي وراءكم».'
    reason: lexical_alternative
  - marker: b
    text: «النطاق» ترجمة للكلمة اليونانية κανών، وهي هنا تعني مجالًا أو ميدانًا معيّنًا للخدمة، لا «قاعدة» أخلاقية ولا «قانون» الأسفار بالمعنى اللاحق.
    reason: cultural_note
  - marker: c
    text: 'يفهمها بعضهم بمعنى: «لا أن نفتخر في نطاق شخصٍ آخر بما أُنجز من قبل».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπερέκεινα ὑμῶν
  choice: المناطق التي وراءكم
  rationale: يدل التعبير على الأماكن الواقعة أبعد من موضع المخاطَبين. وتحافظ «وراءكم» على العلاقة المكانية من غير إضافة تفسيرية مثل «منطقتكم».
- source_word: εὐαγγελίσασθαι
  choice: لنبشّر
  rationale: صياغة عربية طبيعية وموجزة تنقل معنى إعلان الخبر السار وتحافظ على القوة الفعلية للمصدر اليوناني.
- source_word: ἀλλοτρίῳ κανόνι
  choice: في نطاق غيرنا
  rationale: يدل κανών في السياق على مجال أو نطاق عمل عُيّن لآخر، لا على قاعدة أخلاقية ولا على قانون كنسي بالمعنى المتأخر.
- source_word: ἕτοιμα
  choice: أمور معدّة من قبل
  rationale: الصفة مستعملة اسميًا، ولذلك تُرجمت بلفظ عام يحفظ إبهام الأصل، مع بيان أن الإعداد سابق دون حصرها صراحة في أعمال أنجزها آخرون.
- source_word: καυχήσασθαι
  choice: أن نفتخر
  rationale: ينقل اللفظ مصطلح بولس المتكرر في هذا السياق، ويحافظ على دلالته البلاغية دون تلطيف.
theological_decisions:
- issue: دلالة κανών في سياق خدمة بولس
  choice: نطاق عمل يخص شخصًا آخر
  alternative: قاعدة أو معيار أو قانون
  rationale: يتناول السياق القريب حدود مجال العمل المعيّن، ولذلك تشير الكلمة هنا إلى نطاق الخدمة لا إلى قاعدة أخلاقية أو قانون للأسفار.
- issue: مرجع τὰ ἕτοιμα
  choice: أمور معدّة من قبل
  alternative: عمل سبق أن أعدّه أو أنجزه آخرون
  rationale: يرجّح السياق الإشارة إلى ثمار خدمة سبق إعدادها في مجال غير بولس، لكن الأصل موجز ولا يذكر «العمل» أو «الآخرين» صراحة، فحُفظ هذا القدر من الإبهام في المتن وذُكر التفسير في الحاشية.
translation_notes:
  register: لغة عربية فصحى معاصرة واضحة ووقورة. استُعمل «نطاق غيرنا» بدل تركيب ثقيل مثل «نطاق شخص آخر»، وحُفظ إيجاز العبارة اليونانية والتباس «الأمور المعدّة» دون إدخال تفسير العمل المنجَز في المتن.
