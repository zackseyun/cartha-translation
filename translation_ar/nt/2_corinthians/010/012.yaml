id: 2CO.10.12
reference: 2 Corinthians 10:12
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Οὐ γὰρ τολμῶμεν ἐγκρῖναι ἢ συγκρῖναι ἑαυτούς τισιν τῶν ἑαυτοὺς συνιστανόντων· ἀλλὰ αὐτοὶ ἐν ἑαυτοῖς ἑαυτοὺς μετροῦντες καὶ συγκρίνοντες ἑαυτοὺς ἑαυτοῖς οὐ συνιᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/012.yaml
  text: For we do not dare to classify or compare ourselves with some of those who commend themselves[a]. But when they measure themselves by themselves and compare themselves with themselves[b], they do not understand.
translation:
  language: ar
  text: فنحن لا نجسر أن نَعُدَّ أنفسنا من بعض الذين يزكّون أنفسهم[a]، أو أن نقارن أنفسنا بهم. أمّا هم، فإذ يقيسون أنفسهم بأنفسهم ويقارنون أنفسهم بأنفسهم[b]، لا يفهمون.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «نضع أنفسنا في صفّهم»؛ فالفعل اليوناني يفيد إدراج المرء نفسه ضمن فئة أو جماعة.
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «يقيسون أنفسهم في أنفسهم ويقارنون أنفسهم بأنفسهم». والمعنى المحتمل أنهم يتخذون أنفسهم معيارًا لأنفسهم.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τολμῶμεν
  choice: لا نجسر
  rationale: ينقل معنى الإقدام على أمرٍ فيه ادعاء أو جرأة، ويحافظ على النبرة التهكمية من غير أن يضيف تفسيرًا.
- source_word: ἐγκρῖναι
  choice: أن نَعُدَّ أنفسنا من
  rationale: يفيد إدراج النفس ضمن فئة أو صف، وهو أنسب هنا من معنى الحكم الأخلاقي.
- source_word: συγκρῖναι / συγκρίνοντες
  choice: نقارن / يقارنون
  rationale: يحفظ المعنى المباشر والتكرار البلاغي للفعل في النص اليوناني.
- source_word: ἑαυτοὺς συνιστανόντων
  choice: الذين يزكّون أنفسهم
  rationale: يعبر عن مدح النفس وتقديمها على أنها جديرة بالقبول، وهو موضوع بارز في السياق.
- source_word: ἀλλὰ αὐτοὶ
  choice: أمّا هم
  rationale: يُظهر توكيد الضمير والمقابلة بين بولس ورفقائه وبين الذين يزكّون أنفسهم.
- source_word: ἐν ἑαυτοῖς
  choice: بأنفسهم
  rationale: ينقل في السياق فكرة اتخاذ ذواتهم إطارًا أو معيارًا للقياس، مع بيان الصيغة الحرفية المحتملة في الحاشية.
- source_word: μετροῦντες
  choice: يقيسون
  rationale: يحافظ على استعارة القياس بدل استبدالها بتفسير مثل «يقيّمون».
- source_word: ἑαυτοὺς ἑαυτοῖς
  choice: أنفسهم بأنفسهم
  rationale: يحفظ التكرار الانعكاسي المقصود ويبين أنهم يجعلون أنفسهم معيار المقارنة.
- source_word: οὐ συνιᾶσιν
  choice: لا يفهمون
  rationale: صياغة عربية واضحة ومباشرة تحفظ بقاء مفعول الفهم ضمنيًا كما في الأصل.
theological_decisions: []
