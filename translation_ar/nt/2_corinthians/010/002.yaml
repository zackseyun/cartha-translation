id: 2CO.10.2
reference: 2 Corinthians 10:2
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: δέομαι δὲ τὸ μὴ παρὼν θαρρῆσαι τῇ πεποιθήσει ᾗ λογίζομαι τολμῆσαι ἐπί τινας τοὺς λογιζομένους ἡμᾶς ὡς κατὰ σάρκα περιπατοῦντας.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/002.yaml
  text: But I beg that when I am present I may not have to be bold with the confidence by which I consider daring to confront some who regard us as walking according to the flesh[a].
translation:
  language: ar
  text: ولكنني أتوسل ألا أضطر، حين أكون حاضرًا، إلى أن أتصرف بجرأة، بتلك الثقة التي أعتزم بها أن أتجرأ على بعض الذين يحسبون أننا نسلك بحسب الجسد[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كأننا نعيش بحسب المقاييس البشرية».'
    reason: بديل معجمي تفسيري لعبارة κατὰ σάρκα مع περιπατοῦντας.
lexical_decisions:
- source_word: δέομαι
  choice: أتوسل
  rationale: ينقل معنى الطلب الملحّ والشخصي، وهو أقوى من مجرد «أطلب».
- source_word: τὸ μὴ παρὼν θαρρῆσαι
  choice: ألا أضطر، حين أكون حاضرًا، إلى أن أتصرف بجرأة
  rationale: يعبّر عن مضمون التوسل، ويُظهر بأسلوب عربي طبيعي أن هذه الجرأة أمر لا يرغب بولس في أن تدعو إليه الحاجة.
- source_word: τῇ πεποιθήσει
  choice: بتلك الثقة
  rationale: يحفظ معنى الثقة أو الاطمئنان، ويعامل صيغة المجرور اليونانية بوصفها دالة على الوسيلة أو المصاحبة.
- source_word: ᾗ λογίζομαι
  choice: التي أعتزم بها
  rationale: يفيد λογίζομαι هنا تقديرًا مقصودًا أو عزمًا مدروسًا، لا مجرد فكرة عابرة.
- source_word: τολμῆσαι ἐπί τινας
  choice: أن أتجرأ على بعض
  rationale: يحفظ فعل الجرأة والاتجاه العدائي النسبي في ἐπί مع الأشخاص، من غير إضافة فعل تفسيري صريح مثل «أواجه».
- source_word: τοὺς λογιζομένους
  choice: الذين يحسبون
  rationale: ينقل حكم الخصوم وتقديرهم بشأن بولس ورفقائه، ويحافظ أيضًا على الصلة اللفظية مع λογίζομαι.
- source_word: κατὰ σάρκα
  choice: بحسب الجسد
  rationale: يحفظ المصطلح البولسي واتساع دلالته، بدل حصره في معنى أخلاقي أو اجتماعي واحد.
- source_word: περιπατοῦντας
  choice: نسلك
  rationale: «نسلك» تعبير عربي كتابي واضح يحفظ استعارة المشي للدلالة على نهج الحياة والتصرف.
theological_decisions:
- issue: دلالة σάρξ في κατὰ σάρκα
  choice: بحسب الجسد
  alternative: بحسب المقاييس البشرية
  rationale: قد تشير العبارة إلى العيش أو التصرف على أساس بشري دنيوي، لكنها تحتفظ أيضًا بتوتر لاهوتي أوسع في استعمال بولس. لذلك أُبقي «الجسد» في المتن، ووُضع التفسير الأضيق في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. حُفظ تكرار ألفاظ الجرأة والثقة في الأصل، مع صياغة عربية طبيعية، وأُبقيت استعارة السلوك والمصطلح البولسي «الجسد».
