  register: صياغة عربية فصحى معاصرة واضحة ومهيبة. استُعملت «إلا واحدة» لأنها طبيعية في العربية وتحافظ على البنية العددية للنص، وأُبقيت «اليهود» بلا تقييد بـ«السلطات» تجنبا لتجاوز اللفظ اليوناني.
