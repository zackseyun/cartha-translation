  text: خمس مرات تلقيت من اليهود أربعين جلدة إلا واحدة[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيا: «أربعين إلا واحدة»، أي تسعا وثلاثين جلدة.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «على أيدي اليهود». تحدد اليونانية مصدر العقوبة أو القائمين بها، من غير أن تعين هيئة حاكمة بعينها.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπὸ Ἰουδαίων
  choice: من اليهود
  rationale: تفيد ὑπό مع المضاف إليه جهة الفعل أو مصدره الشخصي. وتحافظ «من اليهود» على عموم العبارة من غير أن تخصصها في هيئة حاكمة لم يذكرها النص.
- source_word: πεντάκις
  choice: خمس مرات
  rationale: تنقل المعنى المباشر للظرف وتبرز تكرر العقوبة بلغة عربية طبيعية.
- source_word: τεσσεράκοντα παρὰ μίαν
  choice: أربعين جلدة إلا واحدة
  rationale: تحافظ على صيغة العدد الواردة في اليونانية، أي «أربعين ناقص واحدة»، مع التصريح بـ«جلدة» الذي يقتضيه سياق العقوبة.
- source_word: ἔλαβον
  choice: تلقيت
  rationale: ينقل معنى «أخذت/تلقيت» هنا، أي خضعت للعقوبة، من غير إضافة دلالة تفسيرية مثل «احتملت».
