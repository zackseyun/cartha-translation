base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/006.yaml
  text: But even if I am unskilled in speech[a], I am not in knowledge; indeed[c][b], in every way we have made this plain among all to you.
translation:
  language: ar
  text: ولكن حتى إن كنتُ غيرَ متمرّسٍ في الكلام[a]، فلستُ كذلك في المعرفة؛ بل قد أوضحنا ذلك لكم من كل وجه وفي كل شيء[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «غير متدرّب على الكلام»، أي إنه يفتقر إلى الصقل البلاغي، لا إلى المعرفة.'
    reason: lexical_alternative
  - marker: b
    text: 'العبارة اليونانية موجزة وملتبسة قليلًا؛ ويمكن أيضًا فهمها: «بل أظهرنا ذلك لكم في كل حال وبين الجميع».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδιώτης
  choice: غير متمرّس
  rationale: يدل هنا على عدم التدرّب أو الصقل البلاغي، لا على الجهل العام؛ والمقابلة مع «المعرفة» تؤيد هذا المعنى.
- source_word: τῷ λόγῳ
  choice: في الكلام
  rationale: يشير إلى مجال الكلام أو أسلوب الإلقاء، وهو تعبير عربي طبيعي يحافظ على المقابلة مع المعرفة.
- source_word: γνώσει
  choice: المعرفة
  rationale: ينقل المعنى المباشر للكلمة اليونانية ويحفظ مقابلة المضمون المعرفي بالمهارة الخطابية.
- source_word: φανερώσαντες
  choice: قد أوضحنا ذلك
  rationale: يؤدي قوة الفعل الدالة على الإظهار والبيان، مع صياغة عربية سليمة للتركيب اليوناني الموجز.
- source_word: ἐν παντί
  choice: من كل وجه
  rationale: يُفهم على نحو ظرفي دال على الشمول في طريقة الإيضاح أو مداه.
- source_word: ἐν πᾶσιν
  choice: في كل شيء
  rationale: يحافظ على عموم العبارة اليونانية من غير حسم زائد لما إذا كان المقصود الأمور أو الأحوال أو الأشخاص.
- source_word: εἰς ὑμᾶς
  choice: لكم
  rationale: يعبّر طبيعيًا عن اتجاه الإظهار نحو أهل كورنثوس بوصفهم المتلقين.
theological_decisions:
- issue: دلالة وصف بولس لنفسه في القدرة الخطابية
  choice: يقرّ بعدم التمرّس أو الصقل في الكلام، لا بنقص المعرفة أو الحق
  alternative: أنه غير متعلم عمومًا، أو أن العبارة تهكم محض لا تتضمن أي إقرار
  rationale: المقابلة الصريحة بين «الكلام» و«المعرفة»، وسياق المقارنة بالمعلّمين المنافسين، يجعلان المهارة الخطابية محور العبارة من غير المساس بمضمون معرفته.
- issue: مرجع «ذلك» ونطاق العبارة الختامية
  choice: يشير «ذلك» إلى عدم افتقاره إلى المعرفة، وقد صار هذا واضحًا لهم على نحو شامل
  alternative: أن الجملة تصف إظهارًا بين جميع الناس أو في جميع الأحوال تحديدًا
  rationale: النص اليوناني مضغوط، ولذلك أبقت الترجمة العبارة عامة وأثبتت الاحتمال الآخر في الحاشية بدل حسمه داخل المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُعمل «غير متمرّس» لتجنب إيحاء «عامّي» أو «جاهل»، وجُمعت عبارتا الشمول في صياغة طبيعية مع إبقاء ضغط الأصل واحتماله في الحاشية.
