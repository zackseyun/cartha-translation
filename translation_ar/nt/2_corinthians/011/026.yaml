  text: often on journeys[a], in dangers from rivers, in dangers from robbers, in dangers from my own people, in dangers from Gentiles, in dangers in the city, in dangers in the wilderness, in dangers at sea, in dangers among false brothers[b],
translation:
  language: ar
  text: في أسفارٍ كثيرة، وفي أخطارٍ من الأنهار، وفي أخطارٍ من اللصوص، وفي أخطارٍ من قومي[a]، وفي أخطارٍ من الأمم، وفي أخطارٍ في المدينة، وفي أخطارٍ في البرية، وفي أخطارٍ في البحر، وفي أخطارٍ بين إخوة زائفين[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو «من بني جنسي» أو «من أبناء شعبي»؛ واليونانية تقول حرفيًا: «من القوم/القرابة».'
    reason: lexical_alternative
  - marker: b
    text: 'أو «بين مؤمنين زائفين»؛ واليونانية تقول حرفيًا: «بين إخوة زائفين».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁδοιπορίαις πολλάκις
  choice: في أسفارٍ كثيرة
  rationale: تنقل العبارة معنى السفر المتكرر بصياغة عربية طبيعية، مع إبقاء افتتاح قائمة المشقات موجزًا.
- source_word: κινδύνοις
  choice: في أخطارٍ
  rationale: تكرار العبارة في كل بند يحفظ الإيقاع التراكمي والتوكيد البلاغي في اليونانية.
- source_word: ποταμῶν
  choice: من الأنهار
  rationale: يبقي نوع الخطر غير محدد، فلا يضيف فيضانات أو عبورًا للأنهار مما لم يصرح به النص.
- source_word: λῃστῶν
  choice: من اللصوص
  rationale: لفظ عربي واضح وشائع يدل على السالبين وقطاع الطرق في سياق السفر.
- source_word: ἐκ γένους
  choice: من قومي
  rationale: ينقل معنى جماعة بولس العرقية أو القرابية بإيجاز، من غير إدخال اسم «اليهود» غير الوارد صراحة في العبارة.
- source_word: ἐξ ἐθνῶν
  choice: من الأمم
  rationale: يحفظ المقابلة بين قوم بولس وسائر الأمم، ويستعمل المقابل العربي الكتابي المألوف من غير تفسير زائد.
- source_word: ἐν πόλει
  choice: في المدينة
  rationale: يحافظ على المفرد العام في الأصل وعلى مقابلته بالبرية والبحر.
- source_word: ἐν ἐρημίᾳ
  choice: في البرية
  rationale: «البرية» تشمل الصحراء والمواضع المقفرة، فتحفظ سعة الدلالة الأصلية.
- source_word: ἐν θαλάσσῃ
  choice: في البحر
  rationale: صياغة عربية مباشرة تحافظ على حرف الجر وصورة الخطر البحري.
- source_word: ἐν ψευδαδέλφοις
  choice: بين إخوة زائفين
  rationale: يحفظ الاسم المذكر «إخوة» ودلالة ادعاء الأخوة على غير حقيقتها، بدل تحويله صراحة إلى «مؤمنين».
theological_decisions:
- issue: دلالة ψευδαδέλφοις وهوية المذكورين
  choice: بين إخوة زائفين
  alternative: بين مؤمنين زائفين
  rationale: الأصل يقول حرفيًا «إخوة زائفين» ويرجح أنه يشير إلى مدّعي الأخوة الإيمانية، لكن «مؤمنين» تفسير أصرح من النص؛ لذلك أُبقي التوتر في وصفهم إخوة مع نفي صدق أخوتهم.
- issue: المقابلة بين ἐκ γένους وἐξ ἐθνῶν
  choice: من قومي ... من الأمم
  alternative: من اليهود ... من غير اليهود
  rationale: الصياغة المختارة تحفظ المقابلة العرقية في الأصل من دون استبدالها بتفسير صريح، مع أن السياق يدل على قوم بولس في مقابل الأمم.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كريمة. حُفظ تكرار «وفي أخطار» لإبراز الإيقاع البلاغي المتلاحق، ووُضع هامش [a] عند «قومي» وفق مدلوله الصحيح في الأصل بدل موضعه غير المتسق في طبقة الاستشارة الإنجليزية.
