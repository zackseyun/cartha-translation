  terminology: «الرب» مقابل ثابت ومناسب لـ κύριον. و«الافتخار» مناسب لـ καύχησις. استبدلت «الثقة» بـ«الجرأة» في المتن لتكون العبارة عربية سليمة في السياق، مع إبقاء بديل «الثقة» في الحاشية وصون اتساع ὑπόστασις الدلالي.
