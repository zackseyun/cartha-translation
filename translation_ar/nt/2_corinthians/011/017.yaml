  text: ὃ λαλῶ οὐ ⸂κατὰ κύριον λαλῶ⸃, ἀλλ’ ὡς ἐν ἀφροσύνῃ, ἐν ταύτῃ τῇ ὑποστάσει τῆς καυχήσεως.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/017.yaml
  text: What I am saying[a], I am not saying according to the Lord, but as in foolishness[c][b], in this confidence of boasting.
translation:
  language: ar
  text: ما أقوله لا أقوله بحسب الرب[a]، بل كما لو كنت في حماقة[b]، في هذه الجرأة على الافتخار[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «كأنه صادر من الرب» أو «وفقًا لمعيار الرب».'
    reason: alternative_reading
  - marker: b
    text: 'حرفيًا: «كما في حماقة»؛ ويمكن أن يقال بأسلوب أكثر سلاسة: «بل كأحمق».'
    reason: lexical_alternative
  - marker: c
    text: يمكن للكلمة اليونانية المترجمة «الجرأة» أن تعني في هذا السياق أيضًا «الثقة» أو «الأساس» أو «الموقف» أو «الإقدام».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ λαλῶ
  choice: ما أقوله
  rationale: تعبير عربي طبيعي ينقل المفعول الموصول ودلالة المضارع على كلام بولس الجاري.
- source_word: κατὰ κύριον
  choice: بحسب الرب
  rationale: يحافظ على معنى المعيار أو النهج، ويُبقي مفتوحًا احتمال الإشارة إلى سلطان الرب أو طريقته من غير حسم زائد.
- source_word: κύριον
  choice: الرب
  rationale: هو المقابل المألوف لـ κύριος، والمراد في السياق على الأرجح الرب يسوع، من غير حاجة إلى التصريح بالاسم في المتن.
- source_word: ἀλλ’ ὡς ἐν ἀφροσύνῃ
  choice: بل كأنني أتكلم بحماقة
  rationale: صياغة عربية واضحة تحافظ على أداة التشبيه ὡς وعلى وصف طريقة الكلام بالحماقة، بدل أن تجعل بولس يعرّف نفسه مباشرة بأنه أحمق.
- source_word: ἐν ταύτῃ τῇ ὑποστάσει
  choice: بهذه الثقة
  rationale: يناسب سياق الإقدام على الافتخار، مع التنبيه في الحاشية إلى اتساع معنى ὑπόστασις وإمكان فهمه على أنه أساس أو موقف أو إقدام.
- source_word: τῆς καυχήσεως
  choice: في الافتخار
  rationale: ينقل معنى καύχησις بوصفه فعل الافتخار، ويكوّن مع «الثقة» عبارة عربية مفهومة من غير تحويله إلى صفة أخلاقية أشد مثل التبجح.
theological_decisions:
- issue: مرجع عبارة «بحسب الرب» وقوتها
  choice: يصف بولس أسلوب افتخاره الآتي بأنه ليس بحسب نهج الرب أو معياره.
  alternative: قد يعني أنه لا ينقل هنا قولًا أو أمرًا مباشرًا من الرب، أو أن هذا الكلام ليس صادرًا من الرب.
  rationale: تبقي عبارة «بحسب الرب» التوتر قائمًا ولا تجعل النص إنكارًا لوحي الكلام أو صدقه؛ فالسياق يميّز على الأرجح طريقة الافتخار عن نهج الرب.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. أضيف فعل «أتكلم» بعد «كأنني» لتفادي تركيب عربي متعثر، مع بقاء معنى طريقة الكلام ظاهرًا. وُضعت علامات الحواشي عند العبارات التي تشرحها مباشرة.
