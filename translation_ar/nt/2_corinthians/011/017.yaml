  source_fidelity: ينقل المتن المعنى الأساسي بدقة، لكن «كأنني أتكلم بحماقة» يصرّح بالفعل «أتكلم» ويحوّل قليلًا بناء «كما لو كنت في حماقة». كما أن «الثقة في الافتخار» ممكنة، إلا أن «الجرأة على الافتخار» أوضح عربيًا لسياق ὑπόστασις الصعب ويحافظ على دلالتها المحتملة بوصفها موقفًا واثقًا/إقدامًا.
