  text: φοβοῦμαι δὲ μή πως, ὡς ὁ ὄφις ⸂ἐξηπάτησεν Εὕαν⸃ ἐν τῇ πανουργίᾳ αὐτοῦ, ⸀φθαρῇ τὰ νοήματα ὑμῶν ἀπὸ τῆς ἁπλότητος ⸂καὶ τῆς ἁγνότητος⸃ τῆς εἰς τὸν Χριστόν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/003.yaml
  text: But I fear that somehow[a], just as the serpent deceived Eve by his cunning[d][c][b], your minds may be corrupted from the sincerity and purity that are toward Messiah.
translation:
  language: ar
  text: ولكنني أخاف أن تُفسَد أذهانكم، بطريقة ما، عن الإخلاص والنقاوة للمسيح، كما خدعت الحية حواء بمكرها.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «عن البساطة والنقاوة للمسيح»؛ وقد تحمل «البساطة» هنا معنى صفاء القلب أو عدم انقسامه.'
    reason: lexical_alternative
  - marker: b
    text: تحذف بعض المخطوطات عبارة «والنقاوة».
    reason: textual_variant
lexical_decisions:
- source_word: φοβοῦμαι δὲ μή πως
  choice: ولكنني أخاف أن... بطريقة ما
  rationale: ينقل فعل الخوف الحاضر ومضمون التخوف الذي تدخله μή πως، بصياغة عربية واضحة تحفظ معنى الاحتمال.
- source_word: ὡς ὁ ὄφις ἐξηπάτησεν Εὕαν
  choice: كما خدعت الحية حواء
  rationale: يحفظ المقارنة والإحالة إلى رواية التكوين، ويؤدي ἐξηπάτησεν باللفظ العربي المباشر «خدعت».
- source_word: ἐν τῇ πανουργίᾳ αὐτοῦ
  choice: بمكرها
  rationale: تفيد الباء معنى الوسيلة، و«المكر» ينقل الحيلة الخادعة التي يدل عليها πανουργία. جاء الضمير مؤنثًا وفق جنس «الحية» في العربية.
- source_word: φθαρῇ τὰ νοήματα ὑμῶν
  choice: تكون أفكاركم قد فُسدت
  rationale: يحفظ المبني للمجهول وإمكان وقوع الفساد، ويترجم νοήματα بـ«أفكار» لأنها تشير هنا إلى طرائق التفكير والمقاصد، لا إلى عضو ذهني مجرد.
- source_word: ἀπὸ τῆς ἁπλότητος
  choice: فانصرفت عن الإخلاص
  rationale: تُظهر «عن» معنى الانفصال في ἀπό، ويؤدي «الإخلاص» معنى الصدق وعدم انقسام القلب في ἁπλότης دون اختزاله في السذاجة.
- source_word: καὶ τῆς ἁγνότητος
  choice: والنقاوة
  rationale: «النقاوة» لفظ طبيعي واسع يحفظ الدلالة الأخلاقية في ἁγνότης ولا يقصرها على العفة الجنسية.
- source_word: τῆς εἰς τὸν Χριστόν
  choice: للمسيح
  rationale: اللام تعبّر طبيعيًا عن توجّه الإخلاص والنقاوة إلى المسيح؛ و«المسيح» هو المقابل العربي الراسخ للقب Χριστός.
theological_decisions:
- issue: دلالة ἁπλότης في العلاقة بالمسيح
  choice: الإخلاص
  alternative: البساطة أو صفاء القلب غير المنقسم
  rationale: السياق يحذر من الابتعاد عن تعلق صادق غير منقسم بالمسيح. «الإخلاص» واضح عربيًا، وتُحفظ الدلالات المعجمية الأخرى في الحاشية.
- issue: إثبات καὶ τῆς ἁγνότητος
  choice: إدراج «والنقاوة» في المتن
  alternative: حذف العبارة وفق القراءة الأقصر
  rationale: نص SBLGNT المعطى يثبت العبارة، ولذلك تُترجم في المتن، مع توثيق القراءة المخطوطية الأقصر في الحاشية.
- issue: ترجمة Χριστόν
  choice: المسيح
  alternative: المسيّا
  rationale: «المسيح» في العربية الفصحى ترجمة راسخة للقب اليوناني Χριστός وتحفظ وظيفته اللقبية في هذا السياق.
translation_notes:
  register: فصحى معاصرة واضحة ذات نبرة كتابية كريمة. رُتبت الجملة بما يلائم العربية، فجاء فعل الفساد قبل جملة المقارنة، واستُعمل «فانصرفت» لإظهار نتيجة الفساد ومعنى الابتعاد الذي تحمله ἀπό من غير حسم سبب لاهوتي زائد.
