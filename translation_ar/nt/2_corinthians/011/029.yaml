base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/029.yaml
  text: Who is weak[a], and I am not weak? Who is caused to stumble, and I do not burn with indignation?
translation:
  language: ar
  text: مَنْ يَضْعُفُ ولا أَضْعُفُ أنا؟ ومَنْ يُعَثَّرُ ولا أَحْتَرِقُ أنا؟[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «أحترق» استعارة قد تعبّر عن حزن شديد أو غيرة متقدة أو سخط.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσθενεῖ / ἀσθενῶ
  choice: يَضْعُفُ / أَضْعُفُ
  rationale: يحفظ لفظ «يضعف» اتساع الدلالة اليونانية، التي قد تشمل الضعف الجسدي أو الاجتماعي أو الروحي، ويعبّر عن مشاركة بولس الوجدانية في ضعف الآخرين دون حصر المعنى في المرض.
- source_word: σκανδαλίζεται
  choice: يُعثَرُ
  rationale: صيغة المبني للمجهول تحفظ صورة التعثير في الأصل، وتبقي مفتوحًا ما إذا كان المقصود الوقوع في الخطية أو التعرض لخطر روحي أو السقوط.
- source_word: πυροῦμαι
  choice: أَحْتَرِقُ
  rationale: يحفظ الاستعارة الحية في اليونانية ولا يحدد من تلقاء نفسه طبيعة الانفعال، أهو حزن أم غيرة أم سخط.
- source_word: τίς
  choice: مَنْ
  rationale: أداة الاستفهام الطبيعية عن الأشخاص في العربية، وتلائم السؤالين البلاغيين.
- source_word: καὶ οὐκ ἐγὼ
  choice: ولا ... أنا
  rationale: إظهار الضمير المنفصل بعد الفعل ينقل توكيد ἐγώ مع بقاء العبارة عربية واضحة.
theological_decisions:
- issue: طبيعة انفعال بولس في πυροῦμαι
  choice: الإبقاء على استعارة «أحترق» دون تعيين الانفعال في المتن
  alternative: أحترق سخطًا / أشتعل غيرةً / أتألم بشدة
  rationale: يدل النص على تضامن بولس العميق وتأثره الشديد، لكن الاستعارة اليونانية لا تحسم وحدها أهو سخط أم حزن أم غيرة؛ لذلك يحفظ المتن التوتر الدلالي ويشرحه في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة ذات نبرة كتابية رصينة. استُعمل «يُعثَر» للمحافظة على استعارة التعثير وصيغة المبني للمجهول، مع أن التعبير أقل تداولًا من «يُدفَع إلى السقوط». ووُضع الضمير «أنا» لإبراز التوكيد في الأصل.
