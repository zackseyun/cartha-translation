    issue: «يُعثَرُ» لا يعبّر عن «يُعَثَّرُ».
    rationale: σκανδαλίζεται مبني للمجهول ويدل على أن شخصًا يُوقَع في العثار أو يُسبَّب له التعثر. أما «يُعثَرُ» فليس المبني للمجهول العربي المناسب لهذا المعنى، وقد يُفهم من مادة «عثر» بمعنى يُعثر عليه. يلزم التشديد في «يُعَثَّرُ» لإفادة التسبب في العثار مع حفظ المجاز وعدم تعيين نتيجته.
