  rationale: صُحِّح «يُعثَرُ» إلى «يُعَثَّرُ» ليقابل بدقة صيغة المبني للمجهول ومعنى التسبب في العثار في σκανδαλίζεται. ولم يُغيَّر ما عدا ذلك، لأن «يضعف» و«أحترق» والضمير المؤكِّد «أنا» تحفظ عناصر الأصل اليوناني ونبرته البلاغية.
