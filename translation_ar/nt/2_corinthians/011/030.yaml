  rationale: تحفظ صيغة الشرط اليونانية ولا تحوّلها إلى معنى سببي مثل «بما أن».
- source_word: καυχᾶσθαι
  choice: أَنْ أَفْتَخِرَ
  rationale: «افتخر» هو المقابل العربي الواضح الجاري الذي يحفظ نبرة بولس البلاغية والمفارقة في السياق.
- source_word: δεῖ
  choice: لا بُدَّ
  rationale: تؤدي معنى الضرورة والإلزام في الفعل غير الشخصي بصياغة عربية طبيعية وموجزة.
- source_word: τὰ τῆς ἀσθενείας μου
  choice: بِمَا يَخُصُّ ضَعْفِي
  rationale: تنقل التركيب اليوناني غير المألوف بوصفه أمورًا متصلة بضعف بولس، من غير اختزاله مباشرة إلى «نقاط ضعفي».
- source_word: ἀσθενείας
  choice: ضَعْفِي
  rationale: «الضعف» هو المقابل الأوضح والأوسع هنا، ويشمل أحوال الهوان والعجز التي يذكرها بولس، من غير قصرها على المرض الجسدي.
- source_word: καυχήσομαι
  choice: فَسَأَفْتَخِرُ
  rationale: تنقل المستقبل وتحافظ على تكرار جذر «افتخر» الموازي لتكراره في اليونانية.
theological_decisions:
- issue: طبيعة افتخار بولس
  choice: 'الإبقاء على المفارقة البلاغية: افتخارٌ بما يخص ضعفه'
  alternative: «سأفتخر بنقاط ضعفي» أو صياغة تفسيرية توسّع المقصود
  rationale: النص يقابل الافتخار المعتاد بافتخار بولس المرتبط بالضعف. وتحفظ الصياغة هذا التوتر اللاهوتي من غير أن تحوّله إلى شرح عقائدي.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدمت «لا بد» للضرورة و«بما يخص ضعفي» للحفاظ قدر الإمكان على غرابة التركيب اليوناني مع بقائه مفهومًا. ضُبط النص بالشكل الجزئي لتيسير القراءة.
