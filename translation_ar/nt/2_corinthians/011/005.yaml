  text: فإني أرى أنني لستُ أقلَّ منهم في شيء، من أولئك الرسل الفائقين[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أعظم الرسل مكانةً». يمكن فهم التعبير اليوناني على سبيل التهكم: «الرسل الفائقون»، أو بوصفه وصفًا غير تهكمي لرسل ذوي مكانة رفيعة.'
    reason: alternative_reading
lexical_decisions:
- source_word: λογίζομαι
  choice: أرى
  rationale: يفيد الفعل التفكير والتقدير المبني على النظر. و«أرى» تعبير عربي فصيح وطبيعي يحفظ معنى التقييم، لا مجرد الرؤية البصرية.
- source_word: γὰρ
  choice: فإني
  rationale: تربط الفاء التعليلية العبارة بما قبلها بوصفها تفسيرًا أو سندًا له، وتأتي «إنّ» مناسبة لبنية الجملة العربية وتوكيدها.
- source_word: μηδὲν
  choice: في شيء
  rationale: جاءت اللفظة استعمالًا ظرفيًا مع المصدر، فالمعنى أنه لا يقل عنهم في أي وجه. وتحفظ «في شيء» شمول النفي وقوته.
- source_word: ὑστερηκέναι
  choice: لستُ أدنى
  rationale: يدل الفعل هنا على القصور أو التأخر قياسًا إلى آخرين. و«لست أدنى» تؤدي المقارنة بوضوح، مع بقاء أثر الحالة الناتجة الذي يحمله المصدر التام في السياق.
- source_word: τῶν ὑπερλίαν ἀποστόλων
  choice: من أولئك الرسل الفائقين
  rationale: تنقل «الفائقين» معنى الإفراط في العلو أو التميز، ويمكن أن تُفهم تهكمًا أو وصفًا مباشرًا. وأُضيفت «أولئك» طبيعيًا لتحديد المشار إليهم في سياق المجادلة.
theological_decisions:
- issue: هل تشير عبارة τῶν ὑπερλίαν ἀποστόλων تهكمًا إلى خصوم بولس أم بجدية إلى رسل ذوي مكانة رفيعة؟
  choice: «أولئك الرسل الفائقين» بما يسمح بسماع النبرة التهكمية المرجحة دون التصريح بها.
  alternative: «أبرز الرسل» بوصفها إشارة مباشرة غير تهكمية إلى رسل رفيعي المكانة.
  rationale: يرجح سياق 2 كورنثوس 11 المجادلة مع معلمين منافسين، لكن العبارة اليونانية في ذاتها تحتمل أيضًا وصف رسل بارزين. لذلك تُحفظ إمكانية الوجهين في المتن والحاشية بدل حسمها مذهبيًا.
