    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς τῶν παρεκτὸς
  choice: وفضلًا عن تلك الأمور الخارجية
  rationale: تفيد العبارة ما يقع خارج القائمة المذكورة أو ما يُضاف إليها. وفي السياق تشير على الأرجح إلى الشدائد الخارجية التي سبق تعدادها، مع إبقاء البدائل الممكنة في الحاشية.
- source_word: ἐπίστασίς μοι
  choice: هناك ضغطٌ يقع عليَّ
  rationale: يمكن أن تدل ἐπίστασις على الضغط أو الهجوم أو الإلحاح. والسياق يرجّح المعنى المجازي، كما أن صياغة «يقع عليَّ» تحافظ على دلالة المجرور اليوناني μοι بوصفه ضغطًا يختبره بولس.
- source_word: ἡ καθ’ ἡμέραν
  choice: كلَّ يوم
  rationale: تدل العبارة على أمر متكرر يوميًا، وصياغة «كل يوم» طبيعية وواضحة في العربية المعاصرة.
- source_word: ἡ μέριμνα
  choice: الاهتمام
  rationale: تشمل الكلمة معنى العناية والهم والقلق. و«الاهتمام» يحفظ ثقل الرعاية الرسولية دون أن يفرض حكمًا أخلاقيًا سلبيًا، مع إثبات «القلق» بديلًا في الحاشية.
- source_word: πασῶν τῶν ἐκκλησιῶν
  choice: بجميع الكنائس
  rationale: تشير ἐκκλησία في هذا السياق البولسي إلى جماعات المؤمنين المحلية، و«الكنائس» هي المقابل العربي الأوضح والأرسخ.
theological_decisions:
- issue: دلالة μέριμνα في وصف العبء الرعوي لبولس
  choice: الاهتمام بجميع الكنائس
  alternative: القلق على جميع الكنائس
  rationale: النص يصف ثقل مسؤولية بولس الرسولية، ولا يصرّح بأن هذا الشعور قلق مذموم. لذلك تحافظ «الاهتمام» على معنى العناية الجادة، بينما تُذكر دلالة «القلق» الممكنة في الحاشية دون حسم التوتر الدلالي.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. اختير تركيب مباشر يحافظ على تراكم العبء في العبارة اليونانية، وجاءت جملة «هو الاهتمام...» لتبيّن علاقة البدل أو التفسير المحتملة بين الضغط اليومي والاهتمام بالكنائس دون زيادة تفسيرية.
