translation:
  language: ar
  text: وفضلًا عن تلك الأمور الخارجية[a]، هناك ضغطٌ يوميٌّ يقع عليَّ، أي الاهتمام بجميع الكنائس[c].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «وفضلًا عن الأمور الأخرى»، أو «عدا ما لم أذكره».
