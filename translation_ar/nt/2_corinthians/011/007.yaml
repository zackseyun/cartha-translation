  text: Ἢ ἁμαρτίαν ἐποίησα ἐμαυτὸν ταπεινῶν ἵνα ὑμεῖς ὑψωθῆτε, ὅτι δωρεὰν τὸ τοῦ θεοῦ εὐαγγέλιον εὐηγγελισάμην ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/007.yaml
  text: Or did I commit a sin by humbling myself so that you might be exalted[b][a], because I proclaimed the gospel of God to you free of charge?
translation:
  language: ar
  text: أم أخطأتُ إذ خفضتُ من شأني لكي تُرفَعوا أنتم، لأنني بشّرتُكم بإنجيل الله مجانًا؟[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: من غير أجر أو مقابل.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἢ
  choice: أم
  rationale: تستأنف سؤالًا بلاغيًا بديلًا مرتبطًا بالحجة السابقة، وتحافظ على حدّة أسلوب بولس.
- source_word: ἁμαρτίαν ἐποίησα
  choice: أخطأتُ
  rationale: صياغة عربية طبيعية تؤدي معنى التعبير اليوناني الحرفي «فعلتُ خطيئة» من غير ثقل أسلوبي.
- source_word: ἐμαυτὸν ταπεινῶν
  choice: حين وضعتُ نفسي
  rationale: تنقل معنى خفض المكانة أو التواضع الذاتي في هذا السياق، بصياغة عربية مفهومة، من غير أن توحي بالضرورة بإذلال مذموم.
- source_word: ἵνα ὑμεῖς ὑψωθῆτε
  choice: لكي تُرفَعوا أنتم
  rationale: تحفظ جملة الغاية والمبني للمجهول، وتبرز المقابلة بين وضع بولس نفسه ورفع المخاطَبين.
- source_word: ὅτι
  choice: إذ
  rationale: تربط الفعل الذي عدّه الخصوم موضع السؤال بما سبقه، وتؤدي هنا معنى التعليل أو بيان وجه الأمر بسلاسة.
- source_word: δωρεὰν
  choice: مجانًا
  rationale: مقابل عربي واضح وموجز يفيد عدم تقاضي أجر أو عوض.
- source_word: τὸ τοῦ θεοῦ εὐαγγέλιον
  choice: إنجيل الله
  rationale: يحفظ تركيب الإضافة وتعبير بولس اللاهوتي المألوف من غير تفسير نوع العلاقة في الإضافة.
- source_word: εὐηγγελισάμην ὑμῖν
  choice: بشّرتُكم
  rationale: فعل عربي طبيعي يضم معنى إعلان الإنجيل واتجاه الإعلان إلى المخاطَبين، من غير حصره في وعظ كنسي رسمي.
theological_decisions:
- issue: طبيعة السؤال البلاغي بشأن خدمة بولس بلا أجر واتضاعه
  choice: الإبقاء على السؤال مباشرًا ومشحونًا بالمفارقة، من غير تقرير حكم عقائدي بشأن أجور الخدام.
  alternative: تفسير العبارة على أنها إنكار صريح لحق رسولي في الإعالة، أو تلطيفها لتصبح اعتذارًا مجردًا.
  rationale: النص يسأل بلاغيًا هل كان خفض بولس لنفسه وتبشيره بلا أجر خطيئة؛ ولذلك ينبغي حفظ التوتر والمفارقة من غير توسيع المعنى.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُعملت «أخطأتُ» بدل التعبير الحرفي الثقيل «ارتكبتُ خطيئة»، و«وضعتُ نفسي» في مقابلة «تُرفَعوا» لإظهار التضاد البلاغي. وُضعت علامة الحاشية بعد «مجانًا» لأنها تشرحها مباشرة.
