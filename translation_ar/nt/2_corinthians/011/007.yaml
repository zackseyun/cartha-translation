  to: أم أخطأتُ إذ خفضتُ من شأني لكي تُرفَعوا أنتم، لأنني بشّرتُكم بإنجيل الله مجانًا؟[a]
  rationale: صُححت العبارة المركزية إلى «خفضتُ من شأني» لتؤدي اتضاع بولس/خفض مكانته بوضوح وبعربية معاصرة رصينة، مع الإبقاء على المبني للمجهول في «تُرفَعوا» والمقابلة البلاغية بين الخفض والرفع. واستُبدلت «إذ» بـ«لأنني» لتظهر علاقة التعليل في ὅτι. لا تغيير في المعنى أو في موضع الحاشية.
