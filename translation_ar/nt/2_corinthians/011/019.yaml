lexical_decisions:
- source_word: ἡδέως
  choice: بسرور
  rationale: ينقل معنى القبول عن طيب نفس، ويحافظ في السياق على النبرة الساخرة.
- source_word: γὰρ
  choice: فإنكم
  rationale: تحافظ الفاء مع «إن» على كون الجملة تعليلًا أو تفسيرًا لما قبلها، بصياغة عربية طبيعية.
- source_word: ἀνέχεσθε
  choice: تحتملون
  rationale: يفيد الصبر على أشخاص أو التسامح معهم، وهو مقابل عربي مباشر ملائم للسياق.
- source_word: τῶν ἀφρόνων
  choice: الجهال
  rationale: يشير إلى أشخاص يفتقرون إلى التعقل، ويحفظ التقابل البلاغي مع «حكماء».
- source_word: φρόνιμοι
  choice: حكماء
  rationale: يحفظ التقابل الصريح مع «الجهال» والنبرة التهكمية في كلام بولس.
- source_word: ὄντες
  choice: وأنتم
  rationale: تنقل التركيب الحالي من غير حسمه سببيًا أو استدراكيًا، فلا تضيف «لأنكم» أو «مع أنكم».
theological_decisions:
- issue: السخرية في خطاب بولس لأهل كورنثوس
  choice: إبقاء العبارة مباشرة مع إظهار السخرية من خلال التقابل بين «الجهال» و«حكماء» وعلامة التعجب.
  alternative: 'التصريح بالتفسير داخل المتن، مثل: «إذ تزعمون أنكم حكماء».'
  rationale: النص اليوناني لا يذكر ادعاءهم صراحة، بل تنشأ السخرية من التقابل نفسه؛ لذلك لا ينبغي إدخال تفسير زائد في المتن.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. استُخدم «الجهال» و«حكماء» لحفظ التقابل اللفظي، وظل تركيب «وأنتم حكماء» مفتوحًا من جهة علاقته النحوية بما قبله.
