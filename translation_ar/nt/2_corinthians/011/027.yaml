lexical_decisions:
- source_word: κόπῳ
  choice: كَدّ
  rationale: يدل اللفظ على العمل المجهد والتعب الناتج منه؛ و«كَدّ» يحافظ على قوة التعبير وإيجازه.
- source_word: μόχθῳ
  choice: مشقّة
  rationale: يفيد العناء والضيق الملازمين للجهد، ويميزه عن «كَدّ» مع إبقاء التراكم البلاغي في العبارة اليونانية.
- source_word: ἐν ἀγρυπνίαις πολλάκις
  choice: في سَهَرٍ مرارًا
  rationale: ἀγρυπνία هي اليقظة أو الحرمان من النوم، و«مرارًا» تنقل معنى πολλάκις من غير افتراض سبب السهر.
- source_word: ἐν λιμῷ καὶ δίψει
  choice: في جوعٍ وعطش
  rationale: ترجمة مباشرة للحالتين اللتين احتملهما بولس، مع الحفاظ على تكرار «في» في القائمة.
- source_word: ἐν νηστείαις πολλάκις
  choice: في أصوامٍ كثيرة
  rationale: «أصوام» تحفظ دلالة الجمع والتمييز عن الجوع المذكور قبلها، من غير حسم ما إذا كان الصوم اختياريًا أم بسبب الحرمان.
- source_word: ἐν ψύχει
  choice: في بردٍ
  rationale: ينقل البرد بوصفه حالة معاناة، ويحافظ على إيجاز القائمة.
- source_word: γυμνότητι
  choice: عُري
  rationale: هو المقابل المباشر للفظ اليوناني، ويمكن في هذا السياق أن يشمل نقص الكسوة والتعرض للبرد؛ وتوضح الحاشية هذا الاتساع الدلالي.
theological_decisions:
- issue: دلالة νηστείαις في قائمة آلام بولس
  choice: أصوام
  alternative: الحرمان من الطعام أو الجوع القسري
  rationale: اللفظ اليوناني يدل على الصوم، كما أن الجوع ذُكر مستقلًا قبله. لذلك تُحفظ دلالته من غير تقرير ما إذا كانت هذه الأصوام طوعية أم مفروضة بالظروف.
- issue: دلالة γυμνότητι
  choice: عُري
  alternative: نقص الكسوة أو التعرّض للعوامل الجوية
  rationale: «عُري» يحفظ المعنى المعجمي المباشر، مع إبقاء احتمال أن المقصود هو عدم كفاية اللباس في سياق البرد والمشقات.
translation_notes:
  register: عربية فصحى واضحة وموجزة، مع الحفاظ على إيقاع القائمة بتكرار «في»، وعلى تقارب «كَدّ ومشقّة» من غير دمج اللفظين، وعلى الغموض الحقيقي في «أصوام» و«عُري» بواسطة حاشيتين مثبتتي العلامة في المتن.
