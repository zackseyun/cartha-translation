source:
  edition: SBLGNT
  text: καὶ παρὼν πρὸς ὑμᾶς καὶ ὑστερηθεὶς οὐ κατενάρκησα οὐθενός· τὸ γὰρ ὑστέρημά μου προσανεπλήρωσαν οἱ ἀδελφοὶ ἐλθόντες ἀπὸ Μακεδονίας· καὶ ἐν παντὶ ἀβαρῆ ⸂ἐμαυτὸν ὑμῖν⸃ ἐτήρησα καὶ τηρήσω.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/009.yaml
  text: And when I was present with you and was in need[a], I was not a burden to anyone; for the brothers who came from Macedonia supplied what I lacked. And in everything I kept myself from being a burden to you[b], and will keep doing so.
translation:
  language: ar
  text: وحين كنتُ عندكم واحتجتُ، لم أكن عبئًا على أحد؛ لأن الإخوة الذين قدموا من مكدونية سدّوا ما كان ينقصني. وفي كل شيء حرصتُ أن لا أكون عبئًا عليكم، وسأظل حريصًا على ذلك.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρὼν πρὸς ὑμᾶς
  choice: حين كنتُ عندكم
  rationale: ينقل وظيفة اسم الفاعل الظرفية بصياغة عربية طبيعية، مع الحفاظ على معنى الحضور الشخصي بينهم.
- source_word: ὑστερηθεὶς
  choice: احتجتُ
  rationale: يدل المبني للمجهول هنا على الوقوع في عوز أو نقص، والسياق يرجّح الحاجة المادية.
- source_word: οὐ κατενάρκησα οὐθενός
  choice: لم أكن عبئًا على أحد
  rationale: الفعل يفيد إثقال شخص، ولا سيما ماديًا؛ وهذه الصياغة تحفظ المعنى الاقتصادي والعلاقي بوضوح.
- source_word: τὸ ὑστέρημά μου
  choice: ما كان ينقصني
  rationale: ينقل النقص نفسه بعبارة عربية سلسة من غير تجريد ثقيل.
- source_word: προσανεπλήρωσαν
  choice: سدّوا
  rationale: يفيد إكمال ما كان ناقصًا أو توفيره، ويتلاءم طبيعيًا مع «ما كان ينقصني».
- source_word: οἱ ἀδελφοὶ
  choice: الإخوة
  rationale: يحافظ على صيغة الجمع المذكر في اليونانية، وهي هنا تشير على الأرجح إلى زملاء محددين قدموا من مكدونية.
- source_word: ἐλθόντες ἀπὸ Μακεδονίας
  choice: الذين قدموا من مكدونية
  rationale: تحويل اسم الفاعل إلى جملة موصولة طبيعي في العربية ويحفظ جهة القدوم.
- source_word: ἐν παντί
  choice: في كل شيء
  rationale: يحفظ شمول العبارة اليونانية من غير تضييقها على وجه محدد.
- source_word: ἀβαρῆ ἐμαυτὸν ὑμῖν
  choice: أن لا أكون عبئًا عليكم
  rationale: يفك ضغط التعبير اليوناني إلى تركيب عربي واضح، مع إبقاء معنى عدم الإثقال، وخصوصًا ماليًا.
- source_word: ἐτήρησα καὶ τηρήσω
  choice: حرصتُ ... وسأظل حريصًا على ذلك
  rationale: يعبّر عن المحافظة الماضية والمستقبلية على حالة عدم الإثقال بصياغة عربية طبيعية.
theological_decisions:
- issue: دلالة «οἱ ἀδελφοὶ» من حيث الجنس
  choice: الإخوة
  alternative: الإخوة والأخوات / المؤمنون
  rationale: الأصل اليوناني جمع مذكر، والسياق يرجح الإشارة إلى زملاء محددين قدموا من مكدونية؛ لذلك لم تُعمَّم العبارة في المتن.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت «مكدونية» بوصفها الصيغة العربية المألوفة للاسم الجغرافي، وحُفظ التوازي بين عدم كونه عبئًا في الماضي واستمرار ذلك مستقبلًا.
