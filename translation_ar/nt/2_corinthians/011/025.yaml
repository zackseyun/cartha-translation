base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/025.yaml
  text: Three times I was beaten with rods[a], once I was stoned, three times I was shipwrecked; I have spent a night and a day in the deep.
translation:
  language: ar
  text: ثلاث مرات ضُربتُ بالعِصيّ، ومرة رُجمتُ، وثلاث مرات تحطمت بي السفينة، وقضيتُ ليلةً ونهارًا في عُمق البحر.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في عُرض البحر».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τρὶς
  choice: ثلاث مرات
  rationale: ينقل الظرف الدال على تكرار الحدث بوضوح، ويحافظ على تكراره في موضعي الآية.
- source_word: ἐραβδίσθην
  choice: ضُربتُ بالعِصيّ
  rationale: الفعل المبني للمجهول يدل تحديدًا على الضرب بالعصي، لذلك صُرّح بالأداة بدل الاكتفاء بلفظ عام.
- source_word: ἅπαξ
  choice: مرة
  rationale: تعبير عربي طبيعي ودقيق للدلالة على وقوع الحدث مرة واحدة.
- source_word: ἐλιθάσθην
  choice: رُجمتُ
  rationale: ينقل بإيجاز الفعل الدال على الاعتداء بالرجم بالحجارة، وهو التعبير العربي المألوف في هذا السياق.
- source_word: ἐναυάγησα
  choice: تحطمت بي السفينة
  rationale: صياغة عربية طبيعية تصف التعرض لحادث غرق أو تحطم السفينة، من غير أن توحي بالضرورة بأن بولس غرق ومات.
- source_word: νυχθήμερον
  choice: ليلةً ونهارًا
  rationale: يحفظ ترتيب العبارة اليونانية ودلالتها على مدة مؤلفة من ليل ونهار، من غير فرض تحديد حسابي حديث.
- source_word: ἐν τῷ βυθῷ
  choice: في عُرض البحر
  rationale: السياق البحري يجعل الإشارة إلى البحر المفتوح طبيعية، مع إبقاء معنى «اللُّجّة/العمق» في الحاشية بوصفه مقابلاً أقرب إلى الصورة اللفظية.
- source_word: πεποίηκα
  choice: قضيتُ
  rationale: مع التعبير الزمني يفيد الفعل قضاء مدة، وهذه صياغة عربية سليمة وطبيعية تحفظ النظرة الاسترجاعية لصيغة التام.
