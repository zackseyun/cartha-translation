  to: ثلاث مرات ضُربتُ بالعِصيّ، ومرة رُجمتُ، وثلاث مرات تحطمت بي السفينة، وقضيتُ ليلةً ونهارًا في عُمق البحر.[a]
  rationale: عُدِّلت عبارة المكان وحدها لتجعل المتن أقرب إلى الدلالة الأساسية لـβυθός («العمق/اللُّجّة») مع حفظ البديل المعجمي «عُرض البحر» في الحاشية. وبقيت سائر الصياغة كما هي لسلامتها ودقتها.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:27:05Z'
review_pass:
  verdict: revise
  source_fidelity: الترجمة دقيقة إجمالًا في تعداد الأحداث وصيغة المتكلم والمبني للمجهول في الضرب والرجم. لكن «في عُرض البحر» تقدّم معنىً محتمَلًا لـ βυθός، في حين أن الدلالة الأساسية في هذا السياق هي العمق/اللُّجّة؛ والأفضل أن يكون هذا المعنى في المتن، مع إبقاء «عُرض البحر» بديلًا في الحاشية.
  naturalness: الأسلوب فصيح معاصر ومتماسك. «تحطمت بي السفينة» تعبير عربي مفهوم وطبيعي عن التعرّض لتحطّم السفينة، و«قضيتُ ليلةً ونهارًا» سليمة.
  terminology: «ضُربتُ بالعِصيّ» و«رُجمتُ» و«تحطمت بي السفينة» اختيارات مناسبة. يُستحسن نقل βυθός في المتن بـ«عُمق البحر» لأنه أوضح للقارئ المعاصر وأقرب إلى الصورة المعجمية من «عُرض البحر».
