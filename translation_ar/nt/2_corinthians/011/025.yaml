    rationale: النص اليوناني ἐν τῷ βυθῷ يشير أساسًا إلى العمق أو اللُّجّة، مع إمكان فهمه في بعض الاستعمالات بمعنى البحر المفتوح. لذا ينبغي أن يرد العمق في المتن، وأن يوضع «عُرض البحر» بديلًا في الحاشية، لا العكس.
