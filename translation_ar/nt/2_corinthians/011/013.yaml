revisions:
- from: فَأَمْثَالُ هَؤُلَاءِ رُسُلٌ زَائِفُونَ، وَعُمَّالٌ مُخَادِعُونَ، يَتَنَكَّرُونَ فِي هَيْئَةِ رُسُلِ الْمَسِيحِ.
  to: فَإِنَّ هَؤُلَاءِ رُسُلٌ زَائِفُونَ، وَعَامِلُونَ مُخَادِعُونَ، يَتَنَكَّرُونَ مُتَظَاهِرِينَ بِأَنَّهُمْ رُسُلُ الْمَسِيحِ.
  rationale: استبدلتُ الفاء بـ«فإنّ» لإظهار العلاقة التفسيرية التي يؤديها γάρ، واستعملتُ «عاملون» لتفادي الإيحاء المهني الضيق لكلمة «عمّال». وأعيدت صياغة العبارة الأخيرة بما يبرز التنكّر والادعاء دون إيهام بأنهم أصبحوا رسلًا حقيقيين. وحُفظت دلالة Χριστοῦ في «المسيح».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:26:53Z'
review_pass:
  verdict: revise
  source_fidelity: 'المعنى العام منقول بأمانة: «رسل زائفون» و«عمّال مخادعون» وادعاء صفة رسل المسيح. لكن «فَـ» لا تؤدي بوضوح قيمة γάρ التفسيرية/التعليلية، بخلاف «فإنّ»، كما أن «يتنكرون في هيئة» أوسع وأثقل من تركيب المصدر الذي يفيد تَشَكُّلهم أو تظاهرهم بصفتهم رسلًا.'
  naturalness: النص فصيح ومفهوم، غير أن «فأمثال هؤلاء» أقل سلاسة في هذا الموضع من «فإن هؤلاء»، و«عمّال» قد يوحي في الاستعمال العربي المعاصر بالعمالة المهنية؛ «عاملون» أقرب إلى ἐργάται هنا. والصياغة «يتنكرون متظاهرين بأنهم» طبيعية وواضحة.
  terminology: «المسيح» مقابل عربي راسخ ودقيق لـ Χριστοῦ. و«رسل زائفون» ينقل ψευδαπόστολοι بوضوح. لا يلزم تعديل مصطلح «المسيح».
  issues:
  - severity: medium
    issue: رابط γάρ مترجم بـ«فَـ» فقط.
    rationale: γάρ يقدّم تفسيرًا أو تعليلًا لما سبق؛ «فإنّ» تحافظ على هذه الوظيفة بوضوح، بينما الفاء وحدها قد تدل على مجرد الترتيب أو النتيجة.
  - severity: low
    issue: «عمّال مخادعون» أقل ملاءمة من «عاملون مخادعون».
    rationale: ἐργάται تعني العاملين/الفعلة، لكن «عمّال» في العربية المعاصرة يوحي غالبًا بفئة العمل المهني، فيما «عاملون» أعم وأنسب للسياق الجدلي.
  - severity: low
    issue: «يتنكرون في هيئة» صياغة أثقل من اللازم.
    rationale: المشاركة μετασχηματιζόμενοι تصف تقديم الذات في هيئة/صفة مزعومة. «يتنكرون متظاهرين بأنهم» يبيّن الادعاء الخادع بصورة عربية أسلس من غير ادعاء تحوّل حقيقي.
  revised_text: فَإِنَّ هَؤُلَاءِ رُسُلٌ زَائِفُونَ، وَعَامِلُونَ مُخَادِعُونَ، يَتَنَكَّرُونَ مُتَظَاهِرِينَ بِأَنَّهُمْ رُسُلُ الْمَسِيحِ.
