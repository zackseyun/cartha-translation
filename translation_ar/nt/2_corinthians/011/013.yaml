  text: οἱ γὰρ τοιοῦτοι ψευδαπόστολοι, ἐργάται δόλιοι, μετασχηματιζόμενοι εἰς ἀποστόλους Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/013.yaml
  text: For such men are false apostles[a], deceitful workers, disguising themselves as apostles of Messiah.
translation:
  language: ar
  text: فَإِنَّ هَؤُلَاءِ رُسُلٌ زَائِفُونَ، وَعَامِلُونَ مُخَادِعُونَ، يَتَنَكَّرُونَ مُتَظَاهِرِينَ بِأَنَّهُمْ رُسُلُ الْمَسِيحِ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γὰρ
  choice: فَـ
  rationale: تربط الآية بما قبلها بوصفها تعليلًا أو تفسيرًا، والفاء هي أوجز رابط عربي طبيعي هنا.
- source_word: οἱ τοιοῦτοι
  choice: أمثال هؤلاء
  rationale: تدل على الفئة التي وصفها السياق السابق، وهذه العبارة عربية واضحة وتحافظ على الإحالة إلى أشخاص من هذا النوع.
- source_word: ψευδαπόστολοι
  choice: رسل زائفون
  rationale: تنقل معنى من يدّعون الرسوليّة زورًا، وتتفادى احتمال فهم «كذبة» على أنه وصف لكلامهم فقط.
- source_word: ἐργάται δόλιοι
  choice: عمال مخادعون
  rationale: تحافظ على صورة العاملين وتبيّن أن عملهم يتسم بالخداع.
- source_word: μετασχηματιζόμενοι εἰς
  choice: يتنكرون في هيئة
  rationale: يفيد الفعل تغيير المظهر أو الهيئة بقصد الظهور بصفة ليست حقيقية، لا التحول الداخلي إلى حقيقة جديدة.
- source_word: ἀποστόλους Χριστοῦ
  choice: رسل المسيح
  rationale: صياغة إضافة عربية طبيعية تنقل انتماء الرسل إلى المسيح وتمثيلهم له، كما أن «المسيح» يؤدي معنى اللقب اليوناني Χριστός مباشرة.
theological_decisions:
- issue: دلالة μετασχηματιζόμενοι
  choice: يتنكرون في هيئة
  alternative: يتحولون إلى
  rationale: السياق يدين ادعاءً خادعًا للمظهر والصفة الرسولية، فلا ينبغي أن توحي الترجمة بأنهم صاروا رسلًا للمسيح على الحقيقة.
- issue: ترجمة Χριστοῦ
  choice: المسيح
  alternative: كريستوس
  rationale: «المسيح» هو المقابل العربي الطبيعي للقب اليوناني ويحفظ دلالته اللقبية من غير إدخال تمييز مصطنع بين الاسم واللقب في العربية.
translation_notes:
  register: صياغة عربية فصحى معاصرة، موجزة ومهيبة. استُعمل «زائفون» للوضوح، و«يتنكرون في هيئة» لإبراز المظهر المخادع الذي يدل عليه السياق.
