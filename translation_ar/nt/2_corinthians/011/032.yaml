- source_word: ἐν Δαμασκῷ
  choice: في دمشق
  rationale: ينقل الاستعمال المكاني لحرف الجر ἐν مع المجرور بصياغة عربية طبيعية واضحة.
- source_word: ἐθνάρχης
  choice: حاكمُ قوم
  rationale: يدل اللقب على من يتولى حكم جماعة أو إقليم؛ وهذه الصياغة تُظهر الصلة الاشتقاقية بالقوم من غير استعمال لقب عربي معرَّب غامض للقارئ العام.
- source_word: Ἁρέτα τοῦ βασιλέως
  choice: الملك أريتاس
  rationale: أُبقي تركيب الإضافة في «حاكم قوم الملك أريتاس»، بما يدل على أن الحاكم تابع للملك أو منسوب إليه، من غير تحويل ذلك صراحة إلى «بأمر» أو «تحت حكم».
- source_word: ἐφρούρει
  choice: كان يحرس
  rationale: صيغة «كان يحرس» تنقل دلالة الماضي المستمر في الفعل الناقص، مع معنى الحراسة والمراقبة.
- source_word: τὴν πόλιν Δαμασκηνῶν
  choice: مدينة الدمشقيين
  rationale: يحافظ على التركيب اليوناني الحرفي، حيث Δαμασκηνῶν جمع مضاف إليه بمعنى سكان دمشق، بدل تسويته مباشرة إلى «مدينة دمشق».
- source_word: πιάσαι με
  choice: لكي يقبض عليَّ
  rationale: ينقل غرض الحراسة بصيغة عربية طبيعية، ويحافظ على المعنى العام للإمساك العدائي من غير تخصيصه بإجراء اعتقال رسمي.
