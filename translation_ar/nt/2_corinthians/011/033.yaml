lexical_decisions:
- source_word: θυρίδος
  choice: نافذة
  rationale: تدل الكلمة على نافذة أو فتحة صغيرة؛ و«نافذة» هي المقابل العربي الطبيعي والمحدد في هذا السياق.
- source_word: σαργάνῃ
  choice: سلّة
  rationale: تشير الكلمة إلى وعاء مضفور أو منسوج، ربما من حبال أو خوص؛ و«سلّة» واضحة وطبيعية، مع بيان الدلالة الأخص في الحاشية.
- source_word: ἐχαλάσθην
  choice: دُلِّيتُ
  rationale: صيغة المبني للمجهول من χαλάω تعني هنا الإنزال إلى أسفل، غالبًا بحبل؛ و«دُلِّيتُ» موجزة ودقيقة وطبيعية.
- source_word: διὰ τοῦ τείχους
  choice: عبر السور
  rationale: يفيد التركيب المرور من خلال السور بواسطة نافذة أو فتحة فيه. و«عبر السور» تحافظ على المعنى من دون إضافة «المدينة» غير المذكورة صراحة.
- source_word: ἐξέφυγον τὰς χεῖρας αὐτοῦ
  choice: أفلتُّ من يديه
  rationale: يحفظ هذا التعبير الصورة الحية في اليونانية، أي النجاة من قبضته أو سلطانه، وهو عربي فصيح واضح.
