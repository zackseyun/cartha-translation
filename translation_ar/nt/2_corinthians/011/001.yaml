base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/001.yaml
  text: I wish you would bear with me in a little foolishness[a]. But indeed[b], do bear with me.
translation:
  language: ar
  text: ليتكم تحتملون مني قليلًا من الحماقة[a]. بل احتملوني فعلًا[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «شيئًا من الحماقة».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «بل اصبروا عليّ فعلًا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὄφελον
  choice: ليتكم
  rationale: تفيد الأداة التمني، و«ليتكم» تعبير عربي فصيح وطبيعي يحفظ قوة الرغبة.
- source_word: ἀνείχεσθέ / ἀνέχεσθέ
  choice: تحتملون مني / تحتملونني
  rationale: الفعل يعني الصبر على شخص أو تحمّله. يحافظ التكرار على تكرار الفعل في اليونانية، مع صياغة عربية طبيعية في كل موضع.
- source_word: μικρόν τι
  choice: قليلًا من
  rationale: ينقل معنى المقدار القليل والإقلال البلاغي بإيجاز ووضوح.
- source_word: ἀφροσύνης
  choice: الحماقة
  rationale: لفظ واضح ومعاصر يحفظ وصف بولس البلاغي لنفسه دون تلطيفه.
- source_word: ἀλλὰ καὶ
  choice: بل ... فعلًا
  rationale: «بل» تستأنف الطلب مع مقابلة، و«فعلًا» تبرز القوة التوكيدية للتركيب دون إثقال.
theological_decisions:
- issue: وصف بولس كلامه بأنه حماقة
  choice: الإبقاء على «الحماقة» بوصفها انتقاصًا بلاغيًا من الذات
  alternative: الطيش أو الكلام غير الحكيم
  rationale: السياق يفتتح مقطع افتخار ساخر؛ لذلك ينبغي حفظ التوتر البلاغي وعدم تفسيره أو تلطيفه.
- issue: صيغة الفعل الثانية ἀνέχεσθέ التي قد تُفهم خبرية أو أمرية
  choice: «تحتملونني فعلًا» بصيغة تحتمل الخبر مع نبرة حثّ سياقية
  alternative: «فاحتملوني فعلًا» بصيغة الأمر الصريح
  rationale: الصيغة اليونانية يمكن أن تكون خبرية أو أمرية؛ فاختيرت صياغة عربية لا تغلق الاحتمال تمامًا، مع بيان البديل في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حُفظ التكرار والمفارقة البلاغية، وحُفظ قدر الإمكان غموض الصيغة اليونانية الثانية بين الخبر والحث.
