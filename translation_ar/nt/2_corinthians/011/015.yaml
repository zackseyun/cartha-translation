id: 2CO.11.15
reference: 2 Corinthians 11:15
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: οὐ μέγα οὖν εἰ καὶ οἱ διάκονοι αὐτοῦ μετασχηματίζονται ὡς διάκονοι δικαιοσύνης, ὧν τὸ τέλος ἔσται κατὰ τὰ ἔργα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/015.yaml
  text: So it is no great thing if his servants also disguise themselves as servants of righteousness[a], whose end will be according to their works.
translation:
  language: ar
  text: فلا عجب إذن إن كان خُدّامه أيضًا يتنكّرون في هيئة خُدّام البرّ[a]. وستكون نهايتهم بحسب أعمالهم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «العدل». يمكن أن تعني الكلمة اليونانية «البرّ» أو «العدل»؛ والمقصود هنا ظهورهم بمظهر المنتمين إلى ما هو حق.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μέγα
  choice: فلا عجب
  rationale: 'تعبير عربي طبيعي ينقل المعنى الاصطلاحي: ليس الأمر مستغربًا أو لافتًا، دون التقيّد الحرفي بعبارة «ليس عظيمًا».'
- source_word: οὖν
  choice: إذن
  rationale: تحفظ دلالة الاستنتاج من الآية السابقة وتلائم ترتيب الجملة العربية.
- source_word: διάκονοι
  choice: خُدّام
  rationale: يدل السياق على أعوان الشيطان القائمين بخدمته؛ و«خُدّام» أوضح من «شمامسة» أو «وزراء» ولا يضفي على اللفظ إيحاءً كنسيًا غير مقصود.
- source_word: μετασχηματίζονται
  choice: يتنكّرون في هيئة
  rationale: ينقل معنى تغيير المظهر أو الصورة الخارجية بقصد الخداع، لا التحول الداخلي.
- source_word: ὡς
  choice: في هيئة
  rationale: تبيّن الصفة أو المظهر الذي ينتحلونه، وتنسجم طبيعيًا مع فعل «يتنكّرون».
- source_word: δικαιοσύνης
  choice: البرّ
  rationale: «البرّ» هو المقابل العربي المألوف لدلالة الاستقامة وما هو حق في هذا السياق البولسي، مع حفظ «العدل» بديلًا معجميًا في الحاشية.
- source_word: τὸ τέλος
  choice: نهايتهم
  rationale: تشير إلى المصير أو العاقبة المنتظرة في سياق الدينونة، وتحافظ على إيجاز الأصل.
- source_word: κατὰ τὰ ἔργα αὐτῶν
  choice: بحسب أعمالهم
  rationale: صيغة واضحة تحفظ علاقة المطابقة بين العاقبة والأعمال، وتحافظ على المقابل الاصطلاحي المعتاد لـἔργα.
theological_decisions:
- issue: دلالة δικαιοσύνη في العبارة البولسية
  choice: البرّ
  alternative: العدل
  rationale: السياق يركّز على ادعاء الاستقامة والظهور بمظهر العاملين لما هو حق، ولذلك يلائم «البرّ» المتن؛ أما «العدل» فدلالة ممكنة للكلمة اليونانية تُحفظ في الحاشية دون حسم زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. اختيرت «فلا عجب» للطبيعية، و«يتنكّرون في هيئة» لإبراز الخداع الخارجي، مع تجنب الألفاظ الكنسية التي قد توحي بمنصب رسمي.
