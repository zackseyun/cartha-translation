- source_word: οὐκ ἀγαπῶ ὑμᾶς
  choice: لا أحبكم
  rationale: يحافظ على النفي والفعل والمفعول به بصياغة عربية واضحة.
- source_word: ὁ θεὸς
  choice: الله
  rationale: المقابل العربي المعياري في هذا السياق.
- source_word: οἶδεν
  choice: يعلم
  rationale: ينقل الفعل اليوناني كما ورد، من غير التصريح بالجواب الإيجابي المضمر.
theological_decisions:
- issue: هل يُصرَّح في الخاتمة بأن الله يعلم أن بولس يحبهم؟
  choice: الله يعلم.
  alternative: الله يعلم أني أحبكم.
  rationale: النص اليوناني يقول حرفيًا «الله يعلم» ويترك جواب السؤال البلاغي مضمرًا. إبقاء الإضمار يصون الغموض البلاغي الأصيل، مع بيان المعنى المحتمل في الحاشية.
translation_notes:
