  text: Ἑβραῖοί εἰσιν; κἀγώ. Ἰσραηλῖταί εἰσιν; κἀγώ. σπέρμα Ἀβραάμ εἰσιν; κἀγώ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/022.yaml
  text: Are they Hebrews? So am I[a]. Are they Israelites? So am I. Are they Abraham’s offspring? So am I.
translation:
  language: ar
  text: أَهُمْ عِبْرَانِيُّونَ؟ وَأَنَا أَيْضًا. أَهُمْ إِسْرَائِيلِيُّونَ؟ وَأَنَا أَيْضًا. أَهُمْ مِنْ نَسْلِ إِبْرَاهِيمَ؟ وَأَنَا أَيْضًا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًّا: «زرع إبراهيم». تستعمل اليونانية اسمًا مفردًا ذا معنى جمعي.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἑβραῖοί
  choice: عبرانيون
  rationale: المقابل العربي الراسخ للتسمية العرقية والثقافية، ويحفظ تمييزها عن «إسرائيليون» و«نسل إبراهيم».
- source_word: κἀγώ
  choice: وأنا أيضًا
  rationale: ينقل بإيجاز وتوكيد تركيب καί + ἐγώ، ويحافظ على التكرار الخطابي الحاد في الأجوبة الثلاثة.
- source_word: Ἰσραηλῖταί
  choice: إسرائيليون
  rationale: يدل بدقة على الانتساب إلى إسرائيل، ويحفظ المصطلح مستقلًا عن «عبرانيون» وعن النسب إلى إبراهيم.
- source_word: σπέρμα Ἀβραάμ
  choice: من نسل إبراهيم
  rationale: «نسل» تعبير عربي طبيعي ذو دلالة جمعية، فيقارب المفرد الجمعي σπέρμα من غير حصره في فرد واحد.
- source_word: εἰσιν
  choice: أَهُمْ ...؟
  rationale: أُدمج فعل الكينونة في أسلوب الاستفهام الاسمي العربي الطبيعي، مع إبقاء بنية السؤال والجواب المتكررة.
theological_decisions:
- issue: التمييز الدقيق بين تسميات الهوية اليهودية
  choice: 'الإبقاء على ثلاثة تعابير متميزة: «عبرانيون»، و«إسرائيليون»، و«نسل إبراهيم»'
  alternative: جمع التعابير تحت تسمية واحدة مثل «يهود» أو «ذرية إبراهيم»
  rationale: يعتمد التصعيد الخطابي عند بولس على مطالبات متداخلة لكنها غير متطابقة بالهوية والميراث؛ لذلك لا ينبغي تسويتها في فئة واحدة.
translation_notes:
  register: عربية فصحى واضحة وموجزة ذات إيقاع خطابي. استُخدمت الجمل الاسمية الاستفهامية لأنها الأنسب طبيعيًّا في العربية، وحُفظ تكرار «وأنا أيضًا» لإبراز نبرة بولس المؤكدة.
