  text: I say this to our shame[a], as though we had been weak[d][c][b]. Yet in whatever anyone dares to boast—I am speaking foolishly—I also dare.
translation:
  language: ar
  text: أقول هذا على سبيل العار[a]، كأننا كنا ضعفاء[b]. لكن، فيما يجرؤ عليه أحد، أقول هذا بحماقة[c]، أجرؤ أنا أيضًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أقول هذا بما يجلب العار»؛ والتعبير اليوناني يحتمل أكثر من وجه بحسب المقصود بالعار.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «كما لو كنا ضعفاء». والكلام يحمل نبرة تهكمية في سياق افتخار بولس الموصوف بالحماقة.'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «أتكلم بحماقة» أو «أقول كجاهل». والمقصود بجرأة الآخر، بحسب السياق، جرأته على الافتخار، مع أن الأصل لا يذكر ذلك صراحة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ ἀτιμίαν
  choice: على سبيل العار
  rationale: يحافظ على دلالة التعبير اليوناني الصعبة المرتبطة بالهوان أو العار، من غير أن يحدد بصمت هل العار واقع على المتكلم أم هو وصف لطريقة الكلام.
- source_word: ὡς ὅτι ἡμεῖς ἠσθενήκαμεν
  choice: كأننا كنا ضعفاء
  rationale: ينقل صيغة التشبيه أو الافتراض ذات النبرة التهكمية، ويعبّر عن الضعف العام لا المرض الجسدي.
- source_word: ἐν ᾧ δ’ ἄν τις τολμᾷ
  choice: لكن في أيّ أمر يجرؤ أحد
  rationale: يحافظ على عمومية العبارة وعلى بقاء مفعول «يجرؤ» ضمنيًا كما في الأصل، مع أن السياق يشير إلى الافتخار.
- source_word: ἐν ἀφροσύνῃ λέγω
  choice: أقول كجاهل
  rationale: 'صياغة عربية طبيعية تنقل اعتراض بولس الاستطرادي الذي يصف كلامه بالحماقة، مع إبقاء إمكان فهمها: «أتكلم بحماقة».'
- source_word: τολμῶ κἀγώ
  choice: أجرؤ أنا أيضًا
  rationale: يحفظ التكرار البلاغي للفعل τολμάω والتوازي مع جرأة الآخرين، من غير إضافة «على الافتخار» إلى نص الأصل.
theological_decisions:
- issue: التهكم البلاغي بشأن ضعف بولس ورفقائه
  choice: «كأننا كنا ضعفاء» بوصفها مجاراة تهكمية لادعاء الخصوم
  alternative: 'فهمها إقرارًا مباشرًا: «لأننا كنا ضعفاء»'
  rationale: ὡς ὅτι والسياق الأوسع لـ«كلام الجاهل» يدعمان الافتراض الظاهري أو التهكمي، مع عدم نفي موضوع الضعف الرسولي في مواضع أخرى أو تحميل العبارة حكمًا عقائديًا زائدًا.
- issue: المقصود بجرأة الآخرين
  choice: إبقاء موضوع الجرأة ضمنيًا في المتن
  alternative: «في أيّ شيء يجرؤ أحد أن يفتخر به»
  rationale: الأصل لا يذكر مفعولًا، وإن كان سياق الأصحاح يدل على الافتخار؛ لذلك يحفظ المتن الإضمار وتوضحه الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم «على سبيل العار» للحفاظ على غموض العبارة الافتتاحية، وأُبقي فعل «يجرؤ» بلا مفعول صريح وفاءً للأصل، مع بيان دلالة الافتخار في الحاشية.
