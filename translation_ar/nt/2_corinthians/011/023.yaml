  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: διάκονοι Χριστοῦ εἰσιν; παραφρονῶν λαλῶ, ὑπὲρ ἐγώ· ἐν κόποις περισσοτέρως, ἐν ⸂φυλακαῖς περισσοτέρως, ἐν πληγαῖς ὑπερβαλλόντως⸃, ἐν θανάτοις πολλάκις·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/023.yaml
  text: 'Are they servants of Messiah? I am speaking as if insane: I am more so—in labors more abundantly[a], in imprisonments more abundantly, in beatings beyond measure[b], in deaths often.'
translation:
  language: ar
  text: 'أَهُمْ خُدّامُ الْمَسِيحِ؟ أَتَكَلَّمُ كَمَنْ فَقَدَ صَوَابَهُ: أَنَا أَكْثَرُ مِنْهُمْ؛ فِي الْأَتْعَابِ أَكْثَرُ جِدًّا، وَفِي السُّجُونِ أَكْثَرُ جِدًّا، وَفِي الضَّرَبَاتِ فَوْقَ الْحَدِّ، وَتَعَرَّضْتُ لِلْمَوْتِ مِرَارًا[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًّا: «في ميتاتٍ مرارًا»، وهي عبارة قد تشير إلى مواجهات متكررة مع الموت أو إلى أخطار مميتة.'
    reason: يحافظ المتن على العربية الطبيعية، وتُظهر الحاشية صيغة الجمع اللافتة في θανάτοις وما فيها من احتمال تعبيري.
lexical_decisions:
- source_word: διάκονοι
  choice: خُدّام
  rationale: تدل الكلمة هنا على الذين يخدمون المسيح؛ و«خُدّام» واضحة وغير محمّلة بدلالة كهنوتية خاصة.
- source_word: Χριστοῦ
  choice: الْمَسِيح
  rationale: «المسيح» هو المقابل العربي الطبيعي للقب Χριστός، ويحافظ على وظيفته بوصفه لقبًا في عبارة «خدام المسيح».
- source_word: παραφρονῶν λαλῶ
  choice: أَتَكَلَّمُ كَمَنْ فَقَدَ صَوَابَهُ
  rationale: تنقل اعتراف بولس بأن كلامه يبدو كلام شخص مختل التفكير، من غير تقرير أنه فاقد العقل حقيقةً.
- source_word: ὑπὲρ ἐγώ
  choice: أَنَا أَكْثَرُ مِنْهُمْ
  rationale: 'تحافظ على العبارة اليونانية الموجزة والمقارنة الضمنية: إنه يدّعي أنه خادم للمسيح أكثر منهم.'
- source_word: ἐν κόποις περισσοτέρως
  choice: فِي الْأَتْعَابِ أَكْثَرُ جِدًّا
  rationale: «الأتعاب» تفيد العمل الشاق، و«أكثر جدًا» تنقل قوة المقارنة في περισσοτέρως.
- source_word: ἐν φυλακαῖς περισσοτέρως
  choice: فِي السُّجُونِ أَكْثَرُ جِدًّا
  rationale: صياغة عربية موجزة تدل على تكرر اختباره للسجن، وتحافظ على المقارنة.
- source_word: ἐν πληγαῖς ὑπερβαλλόντως
  choice: فِي الضَّرَبَاتِ فَوْقَ الْحَدِّ
  rationale: «الضربات» لا تحصر المعنى في نوع رسمي بعينه من الجلد، و«فوق الحد» تحافظ على شدة ὑπερβαλλόντως.
- source_word: ἐν θανάτοις πολλάκις
  choice: تَعَرَّضْتُ لِلْمَوْتِ مِرَارًا
  rationale: هذه صياغة عربية طبيعية للعبارة اليونانية اللافتة، مع بيان صورتها الحرفية في الحاشية حفظًا لتوتر التعبير الأصلي.
theological_decisions:
- issue: دلالة Χριστοῦ بوصفه لقبًا
  choice: الْمَسِيح
  alternative: لا بديل عربي لازم؛ فاللفظ العربي نفسه يقابل Messiah وChrist
  rationale: العربية تستعمل «المسيح» لقبًا مفهومًا وطبيعيًا، فلا توجد فيها المقابلة الشكلية بين Messiah وChrist التي تستدعي حاشية في الإنجليزية.
- issue: المقارنة المختصرة في ὑπὲρ ἐγώ
  choice: أَنَا أَكْثَرُ مِنْهُمْ
  alternative: بَلْ أَنَا خَادِمٌ لَهُ أَكْثَرُ مِنْهُمْ
  rationale: أُبقي الإيجاز والحدة البلاغية في الأصل، من غير إضافة تفسير صريح قد يخفف مفارقة تباهي بولس القسري.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كريمة ومباشرة. حوفظ على تتابع العبارات وقوة المقارنة، مع تجنب المصطلحات الكنسية المتخصصة. وُضع رمز الحاشية عند عبارة الموت التي يشرحها، لا عند عبارة أخرى.
