  yaml_path: translation/nt/2_corinthians/011/010.yaml
  text: As the truth of Messiah is in me[c][b][a], this boasting of mine will not be silenced in the regions of Achaia.
translation:
  language: ar
  text: 'إنَّ الحقَّ الذي للمسيح فيَّ[a]: لن يُسكَت هذا الافتخار الذي لي[b][c] في أقاليم أخائية.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الحق الذي للمسيح فيَّ هو أن هذا الافتخار لن يُسكَت...». يمكن أن تُفهم العبارة اليونانية إما كتوكيد قريب من صيغة القسم، وإما كتقرير يتلوه مضمونه.'
    reason: alternative_reading
  - marker: b
    text: 'أو: «لن يُمنَع عني هذا الافتخار» أو «لن يُسدَّ عليَّ باب هذا الافتخار». التعبير اليوناني اصطلاحي عسير، وصورته الحرفية تتصل بالسد أو الإغلاق.'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «لن يُسكَت هذا الافتخار فيما يخصني».'
    reason: previous_rendering
lexical_decisions:
- source_word: ἀλήθεια Χριστοῦ
  choice: حقَّ المسيح
  rationale: يحافظ على تركيب الإضافة اليوناني من غير أن يحسم هل المقصود الحق الذي يخص المسيح أم الحق المتعلق به، وهو تعبير عربي موجز ومألوف.
- source_word: ἐν ἐμοὶ
  choice: فيَّ
  rationale: نقل مباشر يحفظ قوة تقرير بولس الشخصي من غير تفسير زائد.
- source_word: ὅτι
  choice: كما أن ... فلن
  rationale: يعكس قوة العبارة الشبيهة بصيغة التوكيد أو القسم في السياق، بصياغة عربية طبيعية، مع التنبيه في الحاشية إلى إمكان فهمها بوصفها تقريرًا يتلوه مضمونه.
- source_word: καύχησις
  choice: افتخاري
  rationale: «الافتخار» يقابل الاسم الدال على فعل الافتخار أو مضمونه، وإضافته إلى المتكلم تنقل في العربية بصورة طبيعية دلالة εἰς ἐμέ بحسب السياق.
- source_word: οὐ φραγήσεται
  choice: لن يُسكَت
  rationale: الفعل يعني حرفيًا السد أو الإغلاق؛ واستعمال «يُسكَت» ينقل مجازه في سياق استمرار بولس في الافتخار مع إبقاء البدائل الأقرب إلى الصورة الأصلية في الحاشية.
- source_word: ἐν τοῖς κλίμασι τῆς Ἀχαΐας
  choice: في أقاليم أخائية
  rationale: «أقاليم» تحفظ صيغة الجمع ودلالة المناطق أو النواحي، و«أخائية» هي الصيغة العربية المستعملة لاسم الولاية الرومانية.
theological_decisions:
- issue: دلالة Χριστοῦ
  choice: المسيح
  alternative: المسيّا
  rationale: «المسيح» هو المقابل العربي الطبيعي والراسخ للقب Χριστός، ويحفظ دلالته اللقبية من غير تحويله إلى اسم شخصي مجرد.
- issue: قوة العبارة ἔστιν ἀλήθεια Χριστοῦ ἐν ἐμοὶ ὅτι
  choice: كما أن حقَّ المسيح فيَّ، فلن...
  alternative: حقُّ المسيح فيَّ، وهو أن...
  rationale: السياق يرجح تقريرًا توكيديًا قريبًا من صيغة القسم، لكن التركيب اليوناني يحتمل أيضًا أن تكون ὅτι مقدمة لمضمون التقرير؛ لذلك لم يُحسم الاحتمال البديل في صمت.
translation_notes:
  register: لغة عربية فصحى حديثة واضحة ووقورة. استُعمل «يُسكَت» للسلاسة في المتن، مع حفظ الصورة الحرفية وصعوبة εἰς ἐμέ في الحواشي. وُضعت جميع علامات الحواشي في مواضعها داخل النص.
