translation:
  language: ar
  text: ولا عجب، لأن الشيطان نفسه يتنكَّر في هيئة ملاك نور.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يغيّر هيئته إلى ملاك نور». يمكن ترجمة الفعل اليوناني ترجمة أقرب إلى الحرفية بمعنى «يغيّر شكله»، لكنه يشير هنا على الأرجح إلى مظهر خادع.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ οὐ θαῦμα
  choice: ولا عجب
  rationale: تعبير عربي طبيعي موجز يحفظ الصلة بما قبله ويفيد أن الأمر غير مستغرب.
- source_word: αὐτὸς ... ὁ Σατανᾶς
  choice: الشيطان نفسه
  rationale: يحفظ توكيد αὐτός، بينما تُترجم Σατανᾶς بالاسم العربي المألوف.
- source_word: γὰρ
  choice: لأن
  rationale: يبيّن أن ما يلي تعليل لعدم العجب.
- source_word: μετασχηματίζεται εἰς
  choice: يتنكَّر في هيئة
  rationale: ينقل معنى تغيير الهيئة الظاهرة بقصد الخداع في هذا السياق، مع تجنب الجزم بتحول جوهري حقيقي.
- source_word: ἄγγελον φωτός
  choice: ملاك نور
  rationale: يحفظ صورة الإضافة في اليونانية وصياغتها الكتابية الموجزة.
theological_decisions:
- issue: طبيعة تغيّر هيئة الشيطان
  choice: عرض نفسه خداعًا في هيئة ملاك نور
  alternative: تحوّله فعلًا إلى ملاك نور
  rationale: السياق يتناول التضليل والتظاهر، والفعل μετασχηματίζεται يدل على تغيير الهيئة أو المظهر؛ لذلك تعكس الصياغة الخداع من غير تقرير ادعاء ميتافيزيقي زائد، مع إبقاء البديل الحرفي في الحاشية.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُعمل «يتنكَّر في هيئة» للتعبير طبيعيًا عن المظهر الخادع، مع حاشية تحفظ احتمال الترجمة الأقرب إلى البنية اليونانية.
