  text: Ὃ δὲ ποιῶ καὶ ποιήσω, ἵνα ἐκκόψω τὴν ἀφορμὴν τῶν θελόντων ἀφορμήν, ἵνα ἐν ᾧ καυχῶνται εὑρεθῶσιν καθὼς καὶ ἡμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/012.yaml
  text: But what I am doing[a], I will continue to do, in order to cut off the opportunity from those who want an opportunity, so that in what they boast about they may be found to be just as we are.
translation:
  language: ar
  text: أمّا ما أفعله فسأواصل فعله، لكي أقطع الفرصة[a] على الذين يريدون فرصة، حتى يُوجَدوا، في ما يفتخرون به، مثلنا تمامًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الذريعة» أو «المناسبة»، في المرتين؛ والكلمة اليونانية واحدة في الموضعين.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὃ δὲ ποιῶ καὶ ποιήσω
  choice: أمّا ما أفعله الآن فسأواصل فعله
  rationale: ينقل اقتران المضارع بالمستقبل بوصفه ممارسة حاضرة وعزمًا على الاستمرار فيها، بصياغة عربية طبيعية من غير إضافة معنًى جديد.
- source_word: ἐκκόψω
  choice: أقطع
  rationale: يحافظ على الصورة المجازية في الفعل اليوناني، أي حرمان الخصوم من الفرصة أو إزالة مجالها، وهو تعبير عربي مألوف في تركيب «أقطع الفرصة على».
- source_word: ἀφορμή
  choice: الفرصة / فرصة
  rationale: اختيار محايد نسبيًا يحفظ سعة اللفظة، التي قد تدل على فرصة أو مناسبة أو ذريعة، مع إبقاء تكرارها في النص كما في اليونانية.
- source_word: τῶν θελόντων ἀφορμήν
  choice: الذين يريدون فرصة
  rationale: صياغة مباشرة تحافظ على إيجاز الأصل وعلى التكرار المقصود للفظة ἀφορμή من غير تحميلها حكمًا أخلاقيًا زائدًا.
- source_word: ἐν ᾧ καυχῶνται
  choice: في ما يفتخرون به
  rationale: ينقل مجال الافتخار أو موضوعه بعبارة عربية واضحة، مع إبقاء المرجع عامًا كما في الأصل.
- source_word: εὑρεθῶσιν καθὼς καὶ ἡμεῖς
  choice: حتى يُوجَدوا ... مثلنا تمامًا
  rationale: يحافظ على المبني للمجهول وصيغة الغاية/النتيجة المحتملة، وعلى قوة المقارنة مع بولس ورفقائه.
theological_decisions:
- issue: طبيعة الـἀφορμή التي يطلبها خصوم بولس
  choice: 'ترجمتها في المتن ترجمة محايدة نسبيًا: «فرصة»'
  alternative: ذريعة أو مناسبة
  rationale: السياق جدلي، لكن الاسم نفسه لا يفرض معنى «ذريعة» الأكثر تفسيرًا وتحميلًا أخلاقيًا؛ لذلك تُحفظ دلالة اللفظة الواسعة في المتن وتُذكر البدائل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم «أمّا» لإظهار التحول الذي تفيده δέ، و«الآن» لإبراز الممارسة الحاضرة التي سيستمر فيها بولس. حُفظ تكرار «الفرصة» وحدّة صورة «أقطع» من غير تفسير ماهية افتخار الخصوم أو تسوية التوتر الجدلي.
