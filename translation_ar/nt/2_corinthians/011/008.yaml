lexical_decisions:
- source_word: ἄλλας ἐκκλησίας
  choice: كنائسَ أخرى
  rationale: تشير ἐκκλησία في استعمال بولس هنا إلى جماعات مسيحية محلية، و«كنائس» هي العبارة العربية المعاصرة الطبيعية.
- source_word: ἐσύλησα
  choice: سَلَبْتُ
  rationale: الفعل قوي ويفيد السلب أو النهب. يحفظ «سلبت» حدّة المفارقة البلاغية والمبالغة المتعمدة، من غير تلطيفها إلى مجرد أخذ المعونة.
- source_word: λαβὼν
  choice: إذ أخذتُ
  rationale: يحافظ هذا التركيب على علاقة اسم الفاعل بالفعل الرئيس، ويبيّن أن أخذ الأجر هو الوجه الذي به قال بولس إنه سلب الكنائس الأخرى.
- source_word: ὀψώνιον
  choice: أجرًا
  rationale: يدل اللفظ على الأجر أو العطاء المخصص للمعيشة، وكان يُستعمل خصوصًا لراتب الجندي. «أجرًا» يحفظ الصورة الأصلية، مع توضيح دلالته السياقية في الحاشية.
- source_word: πρὸς τὴν ὑμῶν διακονίαν
  choice: لكي أخدمكم
  rationale: يفيد التركيب الغاية أو التوجه، والمقصود أن ما أخذه بولس كان لتمكينه من الخدمة المقدمة إلى أهل كورنثوس. الصياغة الفعلية واضحة وطبيعية بالعربية.
theological_decisions:
- issue: القوة البلاغية لقول بولس إنه سلب كنائس أخرى
  choice: الإبقاء على الاستعارة الصادمة «سلبت كنائس أخرى» بوصفها مفارقة أو مبالغة بلاغية
  alternative: تلطيفها إلى «أخذت معونة من كنائس أخرى» أو «حمّلت كنائس أخرى النفقة»
  rationale: الفعل اليوناني شديد الدلالة عمدًا، والسياق يبيّن أن الحديث عن قبول النفقة لا عن اعتراف بسرقة فعلية. إبقاء اللفظ القوي يصون دفاع بولس الساخر عن سلوكه الرسولي.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. اختير «سلبت» للحفاظ على حدّة النص، و«لكي أخدمكم» لتجنب غموض تركيب اسمي من قبيل «لخدمتكم».
