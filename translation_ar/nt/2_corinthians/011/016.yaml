base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/016.yaml
  text: Again I say[a], let no one think me to be foolish—but if not, then receive me even as foolish, so that I too may boast a little.
translation:
  language: ar
  text: 'أقول مرة أخرى: لا يظنَّ أحدٌ أني أحمق؛ وإلا فاقبلوني ولو كأحمق، لكي أفتخر أنا أيضًا قليلًا.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا فهم ἄφρων فهمًا وصفيًا: «لا يظنَّ أحدٌ أني غير عاقل ... فاقبلوني ولو باعتباري غير عاقل». فاللفظ اليوناني صفة يمكن أن تُستعمل استعمال الاسم أيضًا: «أحمق».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάλιν λέγω
  choice: أقول مرة أخرى
  rationale: ينقل معنى تكرار القول بعبارة عربية طبيعية ومباشرة.
- source_word: μή τίς με δόξῃ ἄφρονα εἶναι
  choice: لا يظنَّ أحدٌ أني أحمق
  rationale: صيغة النهي مع فعل الظن واضحة في العربية، و«أحمق» تنقل ἄφρων هنا بوصفها خبرًا مع إمكان فهمها وصفًا أو اسمًا.
- source_word: εἰ δὲ μή γε
  choice: وإلا
  rationale: 'تؤدي التحول الشرطي المقتضب: إن لم يقبلوا الطلب السابق، فليفعلوا ما يأتي.'
- source_word: κἂν ὡς ἄφρονα δέξασθέ με
  choice: فاقبلوني ولو كأحمق
  rationale: «ولو» تحفظ النبرة التنازلية، و«اقبلوني» تنقل الأمر المباشر في δέξασθέ με.
- source_word: ἵνα κἀγὼ μικρόν τι καυχήσωμαι
  choice: لكي أفتخر أنا أيضًا قليلًا
  rationale: تحفظ غرض العبارة، وتبرز معنى κἀγώ، وتبقي لفظ الافتخار الذي تقوم عليه مفارقة السياق.
theological_decisions:
- issue: وصف بولس لنفسه بلغة الحماقة والافتخار على سبيل المفارقة
  choice: الإبقاء على «أحمق» و«أفتخر» من غير تلطيف
  alternative: تفسير العبارة بمعنى «متهور» أو استبدال الافتخار بتعبير أخف
  rationale: النص يتعمد الجمع بين رفض عدّه أحمق وقبول هذا التصور مؤقتًا كي يدخل في افتخار ساخر؛ وينبغي حفظ هذا التوتر البلاغي.
translation_notes:
  register: عربية فصحى حديثة، واضحة ورصينة. استُعملت «وإلا» للإيجاز الطبيعي، و«ولو كأحمق» للمحافظة على النبرة التنازلية والمفارقة. وُضعت علامة الحاشية بعد الجملة لأنها تتناول موضعي ἄφρων معًا.
