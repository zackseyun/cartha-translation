base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/020.yaml
  text: For you put up with it if someone enslaves you[a], if someone devours you, if someone takes from you, if someone exalts himself[b], if someone strikes you in the face.
translation:
  language: ar
  text: 'لأنكم تحتملون ذلك: إن استعبدكم أحد، وإن التهمكم أحد، وإن أخذ منكم أحد[a]، وإن يتعالى أحد[b]، وإن ضربكم أحد على وجوهكم.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «استولى على ما لكم». والفعل اليوناني يعني حرفيًا «أخذ»، ويشير السياق على الأرجح إلى أخذٍ استغلالي.'
    reason: lexical_alternative
  - marker: b
    text: 'أي: رفع نفسه تكبرًا؛ ويمكن أيضًا ترجمتها: «تكبّر».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέχεσθε
  choice: تحتملون ذلك
  rationale: ينقل معنى الصبر على سلوك مسيء أو التسامح معه، وإضافة «ذلك» توضح المفعول المفهوم من السياق في العربية.
- source_word: γὰρ
  choice: لأنكم
  rationale: يحفظ القوة التعليلية التي تصل الآية بسخرية بولس في الكلام السابق.
- source_word: καταδουλοῖ
  choice: استعبدكم
  rationale: يحفظ المعنى القوي المباشر، أي إخضاعهم كعبيد، من غير تلطيف.
- source_word: κατεσθίει
  choice: التهمكم
  rationale: يحافظ على الصورة المجازية الحية للاستغلال الذي يستهلك ضحاياه.
- source_word: λαμβάνει
  choice: أخذ منكم
  rationale: يبقي الفعل عامًا كما في اليونانية، مع بيان جهة الأخذ التي يفهم منها الاستغلال دون حصره في المال.
- source_word: ἐπαίρεται
  choice: تعالى
  rationale: تعبير عربي طبيعي يدل على رفع المرء نفسه تكبرًا، من غير إضافة مفعول غير مذكور صراحة.
- source_word: εἰς πρόσωπον ὑμᾶς δέρει
  choice: ضربكم على وجوهكم
  rationale: ينقل الإهانة الجسدية الملموسة ولا يضيّق الفعل إلى الصفْع وحده.
- source_word: εἴ τις
  choice: إذا ... أحد
  rationale: يحافظ تكرار «إذا» و«أحد» على البنية الشرطية المتتابعة وقوتها البلاغية، بصياغة عربية واضحة.
theological_decisions:
- issue: النبرة البلاغية في قول بولس
  choice: صياغة الكلام بوصفه توبيخًا ساخرًا على احتمال المسيئين، من غير تسميتهم في متن الآية
  alternative: إضافة وصف «الرسل الكذبة» أو «المعلمون الكذبة» إلى المتن
  rationale: يدل السياق على السخرية وعلى هوية المسيئين، لكن هذه الآية نفسها تسرد أفعالهم من غير أن تسميهم؛ لذلك تُحفظ دلالة النص وتوتره البلاغي بلا تفسير زائد.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كريمة. استُخدم تكرار «إذا» للمحافظة على الإيقاع الاتهامي المتتابع، وحُفظت صور الاستعباد والالتهام والضرب بلا تلطيف.
