lexical_decisions:
- source_word: ὁ θεὸς καὶ πατὴρ
  choice: إلهُ ... وأبوه
  rationale: يحفظ الاسمين اللذين يجمعهما تعريف واحد في اليونانية، مع صياغة عربية طبيعية تُظهر أن كليهما مرتبطان بالرب يسوع.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: ربِّنا يسوع
  rationale: نقلت κύριος بلقب «الرب». جاءت «نا» في الصياغة العربية نتيجة تركيب «إله ربنا يسوع وأبوه» لتوضيح العلاقة النحوية بصورة طبيعية، لا بوصفها مقابلاً لضمير يوناني مستقل.
- source_word: οἶδεν
  choice: يعلم
  rationale: المعنى المعجمي المباشر هو العلم؛ ولم يُوسَّع إلى «يشهد» رغم أن العبارة تؤدي وظيفة قريبة من القسم.
- source_word: ὁ ὢν εὐλογητὸς
  choice: المبارَك
  rationale: وصف لله في جملة تمجيدية اعتراضية؛ والصيغة العربية الموجزة طبيعية وتحفظ دلالة الوصف.
- source_word: εἰς τοὺς αἰῶνας
  choice: إلى الأبد
  rationale: تعبير عربي مألوف ينقل القوة الدلالية المستمرة لعبارة «إلى الدهور»، مع إثبات البديل الأقرب إلى اللفظ في الحاشية.
- source_word: ὅτι
  choice: أن
  rationale: تدخل على مضمون ما يعلمه الله، وليست سببية هنا.
- source_word: οὐ ψεύδομαι
  choice: أني لا أكذب
  rationale: يحفظ النفي والفعل في الحاضر، ويلائم سياق التأكيد الجازم.
theological_decisions:
- issue: علاقة «الإله والأب» بالرب يسوع
  choice: إلهُ ربِّنا يسوع وأبوه
  alternative: الله أبو ربنا يسوع؛ أو إعادة صياغة تخفف عبارة «إله الرب يسوع»
  rationale: تحفظ الصياغة النسبة المزدوجة في النص، أي كونه إله الرب يسوع وأباه، من غير إزالة التمييز العلاقي أو إضافة تفسير عقائدي.
- issue: تعلّق العبارة التمجيدية وعلامات الترقيم
  choice: جعل «المبارَك إلى الأبد» وصفًا اعتراضيًا لله بين فاصلتين
  alternative: وصل العبارة بما قبلها بلا فصل، كأنها صفة تقييدية
  rationale: السياق يرجح أنها استطراد تمجيدي يصف الله في أثناء تقرير بولس المؤكد، والفاصلتان توضحان ذلك طبيعيًا.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. اختير تركيب «إله ربنا يسوع وأبوه» لتجنب الالتباس المحتمل في «الله وأبو الرب يسوع»، ولإبقاء كلا الاسمين متعلقين بيسوع. وُضع مؤشر الحاشية مباشرة بعد «الأبد».
