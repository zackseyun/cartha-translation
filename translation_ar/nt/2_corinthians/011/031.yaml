  text: The God and Father of the Lord Jesus[a], he who is blessed forever, knows that I am not lying.
translation:
  language: ar
  text: الله وأبو الرب يسوع، المبارك إلى الأبد[a]، يعلم أني لا أكذب.
  philosophy: optimal-equivalence
  footnotes:
