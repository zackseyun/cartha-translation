base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/002.yaml
  text: For I am jealous for you with God's jealousy[a], because I betrothed you to one husband[b], to present you as a pure virgin to Messiah.
translation:
  language: ar
  text: فإني أغار عليكم بغيرة الله[a]، لأني خطبتكم لزوج واحد[b]، لكي أقدّمكم إلى المسيح كعذراء طاهرة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بغيرة إلهية». قد تدل اليونانية على غيرة تخص الله، أو على غيرة تتصف بما يليق بالله.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «لرجل واحد». اللفظة اليونانية قد تعني «رجلًا» أو «زوجًا»، وسياق الخطبة يرجّح المعنى الثاني.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ζηλῶ
  choice: أغار عليكم
  rationale: يحفظ معنى الغيرة الحامية في سياق الخطبة والعهد، من غير أن يحوّله إلى حسد مذموم أو يخففه إلى مجرد حماسة.
- source_word: θεοῦ ζήλῳ
  choice: بغيرة الله
  rationale: صياغة مباشرة تحفظ احتمال كون الغيرة لله أو كونها غيرة متصفة بما يليق بالله، دون حسم دلالة المضاف إليه.
- source_word: ἡρμοσάμην
  choice: خطبتكم
  rationale: الفعل في سياق الزواج يدل على عقد الخطبة أو الوعد بالزواج، و«خطبتكم» واضحة وموجزة وتحفظ الصورة المجازية.
- source_word: ἑνὶ ἀνδρὶ
  choice: لزوج واحد
  rationale: مع أن ἀνήρ قد يعني «رجلًا» أو «زوجًا»، فإن صورة الخطبة تجعل «زوج» هو المعنى السياقي الأوضح، مع إبقاء البديل في الحاشية.
- source_word: παρθένον ἁγνήν
  choice: عذراء طاهرة
  rationale: يحفظ اللفظان صورة العروس ومعنى النقاء الأخلاقي كما في اليونانية، بلغة عربية طبيعية رصينة.
- source_word: παραστῆσαι
  choice: لأقدّمكم
  rationale: ينقل غرض بولس من الخطبة وصورة تقديم العروس، ويحافظ على الصياغة الغائية في المصدر.
- source_word: τῷ Χριστῷ
  choice: للمسيح
  rationale: «المسيح» المقابل العربي المباشر للقب Χριστός، وهو هنا العريس المقصود في الصورة المجازية.
theological_decisions:
- issue: طبيعة غيرة بولس
  choice: غيرة مرتبطة بالله وتحمل طابعًا عهديًا حاميًا
  alternative: مجرد حماسة شخصية من بولس
  rationale: عبارة θεοῦ ζήλῳ وصورة الخطبة الحصرية تشيران إلى غيرة الله أو إلى غيرة تتصف بما يليق به؛ لذلك أُبقي لفظ «الغيرة» ولم يُستبدل بالحماسة.
- issue: هوية العريس في الصورة المجازية
  choice: المسيح هو الزوج الواحد الذي يريد بولس أن يقدّم له الجماعة
  alternative: قراءة العبارة بوصفها صورة زواج بشرية عامة فحسب
  rationale: المصدر يصرّح في نهاية الجملة بـ τῷ Χριστῷ، فتتجه صورة الخطبة كلها إليه، من غير إضافة تفاصيل لاهوتية لا يذكرها النص.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُخدمت «أغار عليكم» و«خطبتكم» للحفاظ على ترابط صورة الغيرة والخطبة والعروس، مع تجنب الألفاظ القديمة غير المألوفة أو الشروح المذهبية داخل المتن.
