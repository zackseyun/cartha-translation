revisions:
- from: لأنه إن جاء أحد يكرز بيسوع آخر[a] غير الذي كرزنا به، أو تلقيتم روحًا مختلفًا[b] عن الذي تلقيتموه، أو قبلتم إنجيلًا مختلفًا عن الذي قبلتموه، فإنكم تحتملون ذلك بكل سهولة![c]
  to: لأنه إن جاء أحدٌ يكرز بيسوعَ آخرَ لم نكرز به، أو تتلقون روحًا مختلفًا لم تتلقوه، أو إنجيلًا مختلفًا لم تقبلوه، فإنكم تحتملون ذلك حسنًا.[c]
  rationale: صُحح المضارع «تتلقون» ليقابل λαμβάνετε، وأبقي الماضي في «لم تتلقوه» و«لم تقبلوه» لمقابلة فعلي الماضي اليونانيين. وحُذفت الإضافة التفسيرية «عن الذي تلقيتموه» حفاظًا على البنية الأصلية. كما استُخدم «حسنًا» مقابل καλῶς، مع حفظ الإيحاء الساخر في الحاشية لا في صياغة تفسيرية داخل المتن. توضع علامة الحاشية [a] بعد «يسوع آخر»، و[b] بعد «روحًا مختلفًا».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:26:48Z'
review_pass:
  verdict: revise
  source_fidelity: 'تحتاج الترجمة إلى تصحيح زمن «تتلقون»: فالفعل λαμβάνετε مضارع، في حين أن «تلقيتم» يحوّله إلى ماضٍ. كما أن «عن الذي تلقيتموه» تعبير تفسيري للمقابلة، بينما النص يقول حرفيًا: «روحًا مختلفًا لم تتلقوه». أما «تحتملون ذلك حسنًا» فتحفظ لفظ καλῶς وتترك سخريته للسياق والحاشية.'
  naturalness: الصياغة المقترحة فصيحة معاصرة وواضحة، وتحافظ على التوازي الثلاثي. «يكرز» و«إنجيل» مناسبان للسجل الكتابي العربي المفهوم. و«تحتملون ذلك حسنًا» طبيعي في هذا السياق، وتدع الحاشية تبيّن النبرة الساخرة دون إثقال المتن بعلامة تعجب تفسيرية.
  terminology: «يسوع آخر»، و«روحًا مختلفًا»، و«إنجيلًا مختلفًا» اختيارات سليمة وتحفظ التمييز اليوناني والسياق من غير حسم مرجع الروح. ويُستحسن في الحاشية الأولى استعمال «كرازة» بدل «مناداة»؛ إذ هي أدق وأشيع هنا.
  issues:
  - severity: medium
    issue: تحويل λαμβάνετε من المضارع إلى الماضي
    rationale: «تلقيتم» لا يحفظ زمن الفعل اليوناني الحاضر. يلزم «تتلقون» أو ما يؤدي استمراره في العربية، مع بقاء «لم تتلقوه» للماضي في الجملة الموصولة.
  - severity: low
    issue: إضافة المقابلة الصريحة في «عن الذي تلقيتموه»
    rationale: الأصل يصف الروح بأنه مختلف ثم يقول «لم تتلقوه»، لا «مختلفًا عن الذي تلقيتموه». الحذف يحفظ البنية والمعنى على نحو أدق.
  - severity: low
    issue: صياغة الحاشية الأولى تفسيرية قليلًا واستعمال «مناداة» غير مألوف
    rationale: يمكن الاقتصار على البديل المعجمي وشرح موجز للكرازة المنافسة، من غير تقرير تفصيلي عن طبيعة يسوع المعروض.
  revised_text: لأنه إن جاء أحدٌ يكرز بيسوعَ آخرَ لم نكرز به، أو تتلقون روحًا مختلفًا لم تتلقوه، أو إنجيلًا مختلفًا لم تقبلوه، فإنكم تحتملون ذلك حسنًا.[c]
