language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: εἰ μὲν γὰρ ὁ ἐρχόμενος ἄλλον Ἰησοῦν κηρύσσει ὃν οὐκ ἐκηρύξαμεν, ἢ πνεῦμα ἕτερον λαμβάνετε ὃ οὐκ ἐλάβετε, ἢ εὐαγγέλιον ἕτερον ὃ οὐκ ἐδέξασθε, καλῶς ⸀ἀνέχεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/004.yaml
  text: For if someone comes and proclaims another Jesus[a], whom we did not proclaim, or if you receive a different spirit, which you did not receive, or a different gospel, which you did not accept[c][b], you put up with it well enough.
translation:
  language: ar
  text: لأنه إن جاء أحدٌ يكرز بيسوعَ آخرَ لم نكرز به، أو تتلقون روحًا مختلفًا لم تتلقوه، أو إنجيلًا مختلفًا لم تقبلوه، فإنكم تحتملون ذلك حسنًا.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: تأتي العبارة على الأرجح بنبرة ساخرة؛ إذ يوبخهم بولس لأنهم كانوا مستعدين بسهولة لاحتمال مثل هذه الكرازة.
    reason: rhetorical_tone
lexical_decisions:
- source_word: ὁ ἐρχόμενος
  choice: إن جاء أحد
  rationale: اسم الفاعل المحلّى بالأداة يُستعمل هنا استعمال الاسم للدلالة العامة على شخص يأتي إليهم؛ وهذه الصياغة عربية طبيعية وتحفظ عدم تعيينه.
- source_word: ἄλλον Ἰησοῦν
  choice: بيسوع آخر
  rationale: تحفظ الصياغة فكرة المناداة بشخص يحمل اسم يسوع، لكنه غير يسوع الذي نادى به بولس ورفقاؤه، من غير تفسير زائد.
- source_word: κηρύσσει / ἐκηρύξαμεν
  choice: يكرز / كرزنا
  rationale: «يكرز» يؤدي معنى الإعلان العلني الذي يدل عليه الفعل اليوناني ويحافظ على التوازي بين الفعلين.
- source_word: πνεῦμα ἕτερον
  choice: روحًا مختلفًا
  rationale: «مختلفًا» يبرز قوة المقابلة في ἕτερος، مع إبقاء مرجع «الروح» غير محسوم.
- source_word: λαμβάνετε / ἐλάβετε
  choice: تلقيتم / تلقيتموه
  rationale: يدل λαμβάνω هنا على نيل ما يُعطى أو يُمنح. جاء الفعل الأول في الحاضر اليوناني، لكن صيغة الماضي العربية أنسب داخل الشرط وتحمل دلالة الحدث المفترض؛ أما الثاني فيشير إلى ما نالوه سابقًا.
- source_word: εὐαγγέλιον ἕτερον
  choice: إنجيلًا مختلفًا
  rationale: «إنجيل» المقابل المألوف لـ εὐαγγέλιον، و«مختلفًا» تبين أنه مغاير للإنجيل الذي سبق أن قبلوه.
- source_word: ἐδέξασθε
  choice: قبلتموه
  rationale: «قبل» ينقل معنى الترحيب بالرسالة أو اعتمادها، ويميّزه عن λαμβάνω المترجم بـ«تلقى».
- source_word: καλῶς ἀνέχεσθε
  choice: فإنكم تحتملون ذلك بكل سهولة!
  rationale: ينقل معنى التساهل في احتمال الأمر؛ وعلامة التعجب مع الحاشية تساعدان على إظهار نبرة التوبيخ الساخرة التي يقتضيها السياق من غير إدخال تفسير في صلب العبارة.
- source_word: εἰ μὲν γὰρ
  choice: لأنه إن
  rationale: تربط «لأنه» الآية بتعليل ما قبلها، وتدخل «إن» الشرط المفترض بعبارة عربية موجزة.
theological_decisions:
- issue: مرجع «روحًا مختلفًا»
  choice: إبقاء العبارة عامة من غير تحديد هوية الروح
  alternative: الروح القدس كما يصوره المعلمون الكذبة، أو روح شيطاني، أو تأثير أو توجه روحي مختلف
  rationale: العبارة اليونانية لا تحسم المرجع، ولا يقتضي السياق القريب أن يحسمه المترجم؛ لذلك حُفظ الغموض اللاهوتي المقصود.
- issue: نبرة καλῶς ἀνέχεσθε
  choice: فهمها توبيخًا ساخرًا على سرعة التسامح مع التعليم المخالف
  alternative: مدح صريح أو ملاحظة محايدة
  rationale: سياق دفاع بولس وتحذيره من المعلّمين المنافسين يجعل المدح الصريح بعيدًا؛ ومع ذلك أبقت الترجمة العبارة قريبة من صورتها اليونانية ووضحت النبرة في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كريمة. استُعمل «يكرز» للمحافظة على معنى الإعلان العلني، مع تنويع «تلقى» و«قبل» وفق اختلاف الفعلين اليونانيين. حُفظ التوازي الثلاثي في الجملة، وأُبقي الغموض في مرجع «الروح» من غير تحميل النص تفسيرًا مذهبيًا.
