lexical_decisions:
- source_word: ἐπεὶ
  choice: فبما أن
  rationale: تفيد التعليل وتربط قرار بولس الساخر بما يفعله الكثيرون، مع إبراز الصلة بالسياق السابق.
- source_word: πολλοὶ
  choice: كثيرين
  rationale: مقابل عربي مباشر وطبيعي للدلالة الكمية.
- source_word: καυχῶνται
  choice: يفتخرون
  rationale: ينقل معنى التباهي أو الافتخار الملائم للنبرة الجدلية، ويسمح بالحفاظ على تكرار الفعل في آخر الآية.
- source_word: κατὰ σάρκα
  choice: بحسب الجسد
  rationale: يحافظ على صورة الأصل وعلى الغموض اللاهوتي المقصود في لفظ σάρξ، بدل حصر العبارة في تفسير واحد.
- source_word: κἀγὼ
  choice: أنا أيضًا
  rationale: ينقل اجتماع καί وἐγώ ويحفظ توكيد محاكاة بولس البلاغية لخصومه.
- source_word: καυχήσομαι
  choice: سأفتخر
  rationale: يحافظ على صيغة المستقبل وعلى تكرار جذر الافتخار الموجود في الجملة الأولى.
theological_decisions:
- issue: دلالة σάρξ في عبارة κατὰ σάρκα
  choice: بحسب الجسد
  alternative: بالمقاييس البشرية؛ على نحو بشري محض
  rationale: الصياغة الحرفية تحفظ النسيج البولسي ولا تحسم ما إذا كان المقصود المقاييس البشرية أو طريقة بشرية محضة، بينما يوضح الهامش البدائل السياقية الممكنة.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُخدم «يفتخرون/سأفتخر» للحفاظ على التكرار البلاغي، وأُبقيت عبارة «بحسب الجسد» في المتن مع شرح اصطلاحي موجز في الهامش.
