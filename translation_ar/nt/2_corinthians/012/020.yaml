revisions:
- from: لأني أخاف أن آتي فأجدكم على غير ما أريد، وأن تجدوني أنا أيضًا على غير ما تريدون؛ أخاف أن يكون بينكم نزاع وغيرة، ونوبات غضب، ومطامع أنانية، وافتراءات، وهمسات خفية[a]، وانتفاخ بالكبرياء، واضطرابات.
  to: فإني أخشى، حين آتي، ألا أجدكم كما أريد، وألا تجدوني أنتم كما تريدون؛ وأخشى أن يكون بينكم نزاع، وغيرة، وثورات غضب، وتنافس أناني، وكلام مؤذٍ عن الآخرين، ونميمة[a]، وتعالٍ، واضطرابات.
  rationale: تُظهر المراجعة الدلالة الزمنية للمجيء، وتحافظ على التوازي بين ما يخشى بولس أن يجده فيهم وما يخشى أن يجدوه هم فيه. كما تضبط ألفاظ قائمة الرذائل بحيث لا تضيف إلى καταλαλιαί دعوى الكذب، وتوضح دلالة ψιθυρισμοί مع إبقاء بديل الحاشية. لا تغير هذه التعديلات معنى المقطع أو غموضه السياقي.
  reviewer_model: gpt-5.6-terra
