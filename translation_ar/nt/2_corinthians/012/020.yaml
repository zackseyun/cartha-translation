reference: 2 Corinthians 12:20
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: φοβοῦμαι γὰρ μή πως ἐλθὼν οὐχ οἵους θέλω εὕρω ὑμᾶς, κἀγὼ εὑρεθῶ ὑμῖν οἷον οὐ θέλετε, μή πως ⸀ἔρις, ⸀ζῆλος, θυμοί, ἐριθεῖαι, καταλαλιαί, ψιθυρισμοί, φυσιώσεις, ἀκαταστασίαι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/020.yaml
  text: For I fear that perhaps when I come I may find you not as I wish[a], and I may be found by you to be as you do not wish—that perhaps there may be strife, jealousy, outbursts of anger, selfish ambition, slanders, whisperings, conceit, and disorder.
translation:
  language: ar
  text: فإني أخشى، حين آتي، ألا أجدكم كما أريد، وألا تجدوني أنتم كما تريدون؛ وأخشى أن يكون بينكم نزاع، وغيرة، وثورات غضب، وتنافس أناني، وكلام مؤذٍ عن الآخرين، ونميمة[a]، وتعالٍ، واضطرابات.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «همسات خفية»؛ أي كلام يُتداول سرًا عن الآخرين على نحوٍ مؤذٍ.'
    reason: بديل معجمي للفظ ψιθυρισμοί، مع بيان دلالته في السياق.
lexical_decisions:
- source_word: φοβοῦμαι
  choice: أخاف
  rationale: ينقل مباشرةً قلق بولس المستمر من غير تهوين.
- source_word: μή πως
  choice: أن ...؛ أخاف أن
  rationale: يعبّر عن احتمال يخشاه بولس، وتكراره في العربية يوضح أن قائمة الرذائل جزء ثانٍ من مخاوفه.
- source_word: ἐλθὼν
  choice: أن آتي
  rationale: 'السياق يجعل اسم الفاعل اليوناني ذا دلالة زمنية: عند مجيئه.'
- source_word: οὐχ οἵους θέλω εὕρω ὑμᾶς
  choice: فأجدكم على غير ما أريد
  rationale: صياغة عربية طبيعية تحفظ معنى حالتهم أو سلوكهم المخالف لما يرجوه بولس.
- source_word: κἀγὼ εὑρεθῶ ὑμῖν οἷον οὐ θέλετε
  choice: وأن تجدوني أنا أيضًا على غير ما تريدون
  rationale: تحفظ المقابلة المتبادلة مع العبارة السابقة، مع تحويل المبني للمجهول إلى تركيب عربي أوضح من غير تغيير المعنى.
- source_word: ἔρις
  choice: نزاع
  rationale: يدل على الخصام والانقسام داخل الجماعة.
- source_word: ζῆλος
  choice: غيرة
  rationale: السياق سياق رذائل، فيحمل اللفظ المعنى السلبي لا معنى الحماسة المحمودة.
- source_word: θυμοί
  choice: نوبات غضب
  rationale: صيغة الجمع تشير إلى ثورات غضب متكررة.
- source_word: ἐριθεῖαι
  choice: مطامع أنانية
  rationale: ينقل السعي إلى المصلحة الذاتية والتقدم على حساب الآخرين، مع إبقاء دلالة التنافس الحزبي ضمنية.
- source_word: καταλαλιαί
  choice: افتراءات
  rationale: يشير إلى كلام يطعن في الآخرين ويشوّه سمعتهم.
- source_word: ψιθυρισμοί
  choice: همسات خفية
  rationale: يحفظ صورة الكلام الخافت أو السري الذي يسيء إلى الآخرين، ويمكن أن يُفهم بوصفه نميمة.
- source_word: φυσιώσεις
  choice: انتفاخ بالكبرياء
  rationale: يحافظ على الصورة المجازية للانتفاخ مع بيان أن المقصود هو التكبر.
- source_word: ἀκαταστασίαι
  choice: اضطرابات
  rationale: لفظ واسع يشمل الفوضى وعدم الاستقرار في حياة الجماعة.
theological_decisions:
- issue: نبرة اللقاء الذي يخشاه بولس
  choice: الخوف من خيبة متبادلة ومن وجود رذائل جماعية
  alternative: الخوف أساسًا من الاضطرار إلى استعمال شدة رسولية، أو من أثر معلمين كذبة
  rationale: الآية نفسها تصرح بعدم رضا متبادل وتسرد خطايا اجتماعية، لكنها لا تحدد في ألفاظها سببًا عقائديًا بعينه؛ لذلك لا تُحمَّل الترجمة استنتاجًا سياقيًا إضافيًا.
translation_notes:
  register: عربية فصحى حديثة، واضحة وكريمة النبرة. حُفظ توازي «أجدكم/تجدوني»، وجاءت قائمة الرذائل بألفاظ معاصرة من غير إدخال تفسير مذهبي.
