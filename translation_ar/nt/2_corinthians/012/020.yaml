review_pass:
  verdict: revise
  source_fidelity: المسودة تنقل البنية العامة ومعظم قائمة الرذائل بأمانة. لكن «أن آتي» قد تُفهم بوصفها مفعولًا مباشرًا لـ«أخاف» لا ظرفًا زمنيًا كما في ἐλθών، و«افتراءات» أضيق وأقوى من καταλαλιαί لأنها تفترض الكذب صراحة. كما أن «همسات خفية» لا تُظهر بوضوح دلالة الكلام المتداول سرًا للإساءة في ψιθυρισμοί.
  naturalness: الأسلوب فصيح ومفهوم، إلا أن إعادة بناء الجملة بـ«حين آتي» و«ألا» تجعل علاقات الخوف والاحتمال المتبادل أوضح في العربية المعاصرة. وتأتي ألفاظ مثل «تنافس أناني» و«نميمة» أكثر مباشرة في قائمة رذائل.
  terminology: «غيرة»، «ثورات غضب»، و«اضطرابات» مناسبة. يُستحسن «كلام مؤذٍ عن الآخرين» لـκαταλαλιαί تفاديًا لإلزام معنى الافتراء الكاذب، و«نميمة» لـψιθυρισμοί مع حاشية للبديل التصويري. «تعالٍ» ينقل φυσιώσεις بوضوح حديث من دون إدخال تفسير مذهبي.
  issues:
  - severity: medium
    issue: «افتراءات» مقابل καταλαλιαί
    rationale: اللفظ اليوناني يدل على الكلام المسيء أو الطعن في الآخرين، ولا يقتضي أن تكون الأقوال مختلقة؛ أما «افتراءات» فتقتضي الكذب غالبًا.
  - severity: low
    issue: الدلالة الزمنية لـἐλθών غير صريحة بما يكفي
    rationale: «أن آتي فأجدكم» ممكنة، لكنها قد توحي بأن بولس يخاف من المجيء نفسه. «حين آتي» يبيّن أن المجيء إطار زمني للعثور عليهم.
  - severity: low
    issue: «همسات خفية» لا تنقل بوضوح وظيفة ψιθυρισμοί الاجتماعية
    rationale: المقصود همس أو تداول سري يضر بالآخرين؛ «نميمة» أوضح، مع إمكان حفظ الصورة في الحاشية.
