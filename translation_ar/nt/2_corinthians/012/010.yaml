language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: διὸ εὐδοκῶ ἐν ἀσθενείαις, ἐν ὕβρεσιν, ἐν ἀνάγκαις, ἐν διωγμοῖς ⸀καὶ στενοχωρίαις, ὑπὲρ Χριστοῦ· ὅταν γὰρ ἀσθενῶ, τότε δυνατός εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/010.yaml
  text: Therefore I delight in weaknesses[a], in insults, in hardships, in persecutions and distresses, for the sake of Messiah; for when I am weak, then I am strong.
translation:
  language: ar
  text: لذلك أُسَرُّ بالضعفات، وبالإهانات، وبالشدائد، وبالاضطهادات والضيقات، من أجل المسيح؛ لأنني حين أكون ضعيفًا، أكون حينئذ قويًّا.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὸ
  choice: لذلك
  rationale: تفيد نتيجةً مستخلصة من الكلام السابق، وتحافظ «لذلك» على هذا الترابط المنطقي بوضوح.
- source_word: εὐδοκῶ
  choice: أُسَرُّ
  rationale: تنقل معنى الرضا والابتهاج، وتحفظ المفارقة في موقف بولس الإيجابي من أوجه ضعفه دون اختزالها في مجرد القناعة أو الاحتمال.
- source_word: ἐν ἀσθενείαις
  choice: بالضعفات
  rationale: تحافظ على صيغة الجمع وعلى المعنى الواسع للضعف والوهن، من غير قصره على المرض الجسدي.
- source_word: ἐν ὕβρεσιν
  choice: وبالإهانات
  rationale: تشير الكلمة في السياق إلى المعاملة المهينة أو الإساءات الحاطة بالكرامة؛ و«الإهانات» واضحة وطبيعية في العربية.
- source_word: ἐν ἀνάγκαις
  choice: وبالشدائد
  rationale: تدل هنا على الظروف الضاغطة والصعوبات الملحّة، و«الشدائد» تؤدي هذا المعنى في سياق قائمة الآلام.
- source_word: ἐν διωγμοῖς
  choice: وبالاضطهادات
  rationale: المقصود اضطهادات يعانيها بولس بسبب ولائه للمسيح، وصيغة الجمع تقابل الأصل.
- source_word: καὶ στενοχωρίαις
  choice: والضيقات
  rationale: تحفظ صورة الضغط والحصر الشديدين الكامنة في اللفظة، وهي صياغة عربية مألوفة ومتميزة عن «الشدائد».
- source_word: ὑπὲρ Χριστοῦ
  choice: من أجل المسيح
  rationale: تعبّر عن سبب هذه الآلام وغايتها المرتبطة بالولاء للمسيح. و«المسيح» في العربية يحفظ اللقب المسياني ويجري طبيعيًّا في هذا السياق الرسائلي.
- source_word: ὅταν γὰρ ἀσθενῶ
  choice: لأنني حين أكون ضعيفًا
  rationale: تحفظ «حين» الدلالة الزمنية العامة للأداة مع المضارع، بينما توضح «لأن» علاقة التعليل.
- source_word: τότε δυνατός εἰμι
  choice: أكون حينئذ قويًّا
  rationale: تقابل «قويًّا» لفظ «ضعيفًا» مباشرة، وتحفظ «حينئذ» بنية المفارقة الزمنية والتوكيدية.
theological_decisions:
- issue: 'دلالة Χριστοῦ: لقب أم استعمال اسمي'
  choice: المسيح
  alternative: المسيّا
  rationale: «المسيح» هو المقابل العربي الراسخ الذي يظل لقبًا دالًّا على الممسوح، وفي الوقت نفسه يبدو طبيعيًّا في سياق الرسالة؛ أما «المسيّا» فيبرز الخلفية العبرية لكنه أقل سلاسة هنا.
- issue: طبيعة القوة في عبارة «حين أكون ضعيفًا، أكون حينئذ قويًّا»
  choice: الإبقاء على المفارقة دون إضافة مفسِّرة
  alternative: إضافة «بقوة المسيح» أو «بالله»
  rationale: النص اليوناني لا يذكر فاعل القوة في هذه الجملة، وإن كان السياق السابق يوضحه؛ لذلك لا تُدرج إضافة تفسيرية داخل المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حوفظ على تتابع عناصر القائمة وعلى المفارقة الختامية، مع استعمال الباء في عناصر السرور لتجنب تركيب ثقيل، ومن دون تسوية التوتر اللاهوتي بإضافات غير موجودة في الأصل.
