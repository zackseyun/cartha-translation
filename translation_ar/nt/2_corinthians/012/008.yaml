translation:
  language: ar
  text: بشأن هذا، تضرَّعتُ إلى الرب ثلاث مرات أن يبتعد عني.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «عن هذا» أو «لأجل هذا».
    reason: lexical_alternative
  - marker: b
    text: أو «التَمستُ من الرب» أو «توسَّلتُ إلى الرب».
    reason: lexical_alternative
  - marker: c
    text: تقول اليونانية «الرب» فقط، ولا يذكر بولس اسم يسوع صراحة هنا. ولا يُصرَّح بفاعل «يبتعد» في اليونانية؛ وهو يشير إلى الضيقة المذكورة في الآية السابقة، وقد يُفهم على أنه الشوكة أو رسول الشيطان.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπὲρ τούτου
  choice: مِن أجل هذا
  rationale: تُدخل العبارة الأمر الذي يتحدث عنه بولس، وتحيل إلى الضيقة المذكورة في الآية السابقة. ويمكن بحسب السياق فهمها أيضًا بمعنى «بشأن هذا».
- source_word: τρὶς
  choice: ثلاث مرات
  rationale: ينص الظرف على ثلاث مناسبات، وهذه صياغة عربية حديثة واضحة.
- source_word: τὸν κύριον
  choice: الرب
  rationale: يحافظ هذا على لفظ النص اليوناني من غير إضافة اسم يسوع، مع أن السياق البولسي يرجّح الإشارة إليه.
- source_word: παρεκάλεσα
  choice: تضرَّعتُ إلى
  rationale: الفعل واسع الدلالة، ويعني هنا طلبًا ملحًّا موجّهًا إلى الرب؛ و«تضرعت» طبيعية في سياق الصلاة من غير مبالغة في المعنى.
- source_word: ἵνα ἀποστῇ ἀπ’ ἐμοῦ
  choice: أن يفارقني
  rationale: ينقل معنى الابتعاد عن بولس بصياغة عربية موجزة وطبيعية. والفاعل مستتر في اليونانية، كما تسمح العربية بإبقائه غير مصرّح به، فيعود بحسب السياق إلى الشوكة أو رسول الشيطان.
theological_decisions:
- issue: مرجع «الرب»
  choice: الإبقاء على «الرب» دون توسيعها إلى «الرب يسوع»
  alternative: الرب يسوع
  rationale: يرجح أن بولس يقصد يسوع، لكن النص اليوناني لا يذكر الاسم صراحة؛ لذلك يحافظ النقل على مقدار التحديد الموجود في الأصل.
- issue: فاعل ἀποστῇ المستتر
  choice: «أن يفارقني» بفاعل مستتر
  alternative: أن تفارقني الشوكة / أن يفارقني رسول الشيطان / أن يبتعد هذا عني
  rationale: السياق السابق يذكر «شوكة في الجسد» و«رسول الشيطان»، ولا يصرح الفعل هنا بفاعله. وتتيح العربية إبقاء هذا التوتر الدلالي من غير حسمه.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. اختيرت «تضرعت» لتناسب سياق الصلاة الملحّة، و«يفارقني» لإبقاء الفاعل مستترًا كما في اليونانية، من غير فرض مرجع محدد.
