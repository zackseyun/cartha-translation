    rationale: الأفضل بيان أن اليونانية لا تسمّي الفاعل وأن العبارة تعود إلى الضيقة المذكورة سابقًا، مع ذكر الشوكة ورسول الشيطان احتماليًا لا على سبيل الحسم.
