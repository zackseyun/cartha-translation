- from: مِن أجل هذا، تضرَّعتُ إلى الرب ثلاث مرات أن يفارقني.[a][b][c]
  to: بشأن هذا، تضرَّعتُ إلى الرب ثلاث مرات أن يبتعد عني.[a][b][c]
  rationale: استُبدلت «من أجل هذا» بـ«بشأن هذا» لتحديد موضوع الالتماس بدقة. واستُبدلت «يفارقني» بـ«يبتعد عني» لتجنّب ترجيح مرجع مذكر في صيغة الفعل العربي قدر الإمكان، مع صون غموض الفاعل في الحاشية. كما عُدّلت الحاشية لتعرض مرجع الفاعل بوصفه غير مصرّح به واحتماليًا، لا كتفسير محسوم.
