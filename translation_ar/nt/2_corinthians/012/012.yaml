  text: τὰ μὲν σημεῖα τοῦ ἀποστόλου κατειργάσθη ἐν ὑμῖν ἐν πάσῃ ⸀ὑπομονῇ, σημείοις ⸀τε καὶ τέρασιν καὶ δυνάμεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/012.yaml
  text: Indeed[a], the signs of an apostle were performed among you with all perseverance[b], with signs and wonders and powers.
translation:
  language: ar
  text: حقًّا، قد تحقَّقت بينكم علاماتُ الرسول[a] بكل مثابرة، بآيات وعجائب وأعمال قوة.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا فهم العبارة: «علامات الرسول»، على أنها تشير تحديدًا إلى بولس، لا إلى السمات الرسولية بوجه عام.'
    reason: alternative_reading
  - marker: b
    text: يمكن أيضًا ترجمة «أعمال قوة» بـ«معجزات» أو «أعمال مقتدرة»؛ فاللفظ اليوناني يبرز أفعال القدرة.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ μὲν σημεῖα
  choice: حقًّا، ... علامات
  rationale: تنقل «حقًّا» توكيد μέν الذي لا يقابله δέ مصرح به، وتحافظ «علامات» على دلالة σημεῖα في العبارة الرئيسة.
- source_word: τοῦ ἀποστόλου
  choice: الرسول
  rationale: الإضافة اليونانية تحتمل علامات الرسول بوصفها سمات تميّز الرسول الحقيقي، مع إمكان انطباقها على بولس في السياق؛ والصياغة العربية تحفظ هذا القدر من الانفتاح.
- source_word: κατειργάσθη
  choice: قد تحقَّقت
  rationale: تحفظ معنى الإنجاز والتحقق في المبني للمجهول من غير تعيين الفاعل، وتأتي طبيعية مع «علامات» في العربية.
- source_word: ἐν ὑμῖν
  choice: بينكم
  rationale: السياق يدل على ما جرى في وسط جماعة كورنثوس، لا على معنى داخلي في أفرادها.
- source_word: ἐν πάσῃ ὑπομονῇ
  choice: بكل ثبات
  rationale: الثبات تعبير عربي واضح عن الاحتمال الراسخ والاستمرار تحت المشقة الذي تدل عليه ὑπομονή.
- source_word: σημείοις τε καὶ τέρασιν καὶ δυνάμεσιν
  choice: بآيات وعجائب وأعمال قوة
  rationale: تنقل الثلاثية المترابطة وتحافظ على التمييز بين العلامات والعجائب وتجليات القوة؛ و«أعمال قوة» أوضح عربيًا من «قوات» في وصف الأفعال الخارقة.
theological_decisions:
- issue: دلالة «علامات الرسول»
  choice: إبقاء العبارة دالة على الشواهد التي تميّز خدمة الرسول، مع اتصالها في الآية بالثبات والآيات والعجائب وأعمال القوة.
  alternative: قصر العبارة على المعجزات وحدها، أو جعلها لقبًا خاصًا ببولس دون سواه.
  rationale: تركيب الآية يذكر العلامات أولًا، ثم يربط تحققها بالثبات ويعقب ذلك بثلاثية الأعمال الخارقة؛ لذلك لا تحصر الترجمة العلامات في قائمة عقائدية أضيق من النص.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ووقورة. استُعمل «حقًّا» للتوكيد، و«تحققت» لصون المبني للمجهول، و«بكل ثبات» بدل تعبير أكثر تقادمًا مثل «بكل صبر». وُضعت علامة الحاشية بعد العبارة التي تشرحها.
