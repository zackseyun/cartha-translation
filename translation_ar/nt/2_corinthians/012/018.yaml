  text: παρεκάλεσα Τίτον καὶ συναπέστειλα τὸν ἀδελφόν· μήτι ἐπλεονέκτησεν ὑμᾶς Τίτος; οὐ τῷ αὐτῷ πνεύματι περιεπατήσαμεν; οὐ τοῖς αὐτοῖς ἴχνεσιν;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/018.yaml
  text: I urged Titus to go and sent the brother with him. Titus did not take advantage of you[a], did he? Did we not walk in the same spirit? Did we not walk in the same footsteps?
translation:
  language: ar
  text: طلبتُ إلى تيطس أن يذهب، وأرسلتُ الأخ معه. فهل استغلكم تيطس؟ أما سلكنا بالروح نفسها[a]؟ أما سرنا على الآثار نفسها؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أن تشير العبارة إلى الروح القدس نفسه، لا إلى الروح أو التوجه المشترك فحسب.
    reason: لأن πνεῦμα قد يدل هنا على التوجه المشترك، وقد يُفهم أيضًا على أنه الروح القدس؛ فتحافظ الحاشية على هذا الاحتمال اللاهوتي.
lexical_decisions:
- source_word: παρεκάλεσα Τίτον
  choice: طلبتُ إلى تيطس أن يذهب
  rationale: يفيد الفعل هنا طلبًا جادًّا في سياق مهمة عملية. أُضيف «أن يذهب» لتوضيح المقصود الذي يدل عليه السياق، من غير تحويل الطلب إلى أمر قسري.
- source_word: συναπέστειλα τὸν ἀδελφόν
  choice: أرسلتُ معه الأخ
  rationale: الفعل المركب يدل على إرسال الأخ بصحبة تيطس، والتعبير العربي موجز وطبيعي، مع إبقاء «الأخ» معرفة كما في اليونانية من غير إضافة ضمير ملكية.
- source_word: μήτι ἐπλεονέκτησεν ὑμᾶς Τίτος
  choice: فهل استغلكم تيطس؟
  rationale: «استغل» ينقل معنى تحصيل منفعة على حساب الآخرين، مع بقاء المجال المالي أو المادي الذي يرجحه السياق. والسؤال بـ«هل» في سياقه البلاغي ينتظر جوابًا بالنفي.
- source_word: τῷ αὐτῷ πνεύματι
  choice: بالروح نفسه
  rationale: يحافظ هذا التعبير على احتمال أن يكون المراد الروح أو التوجه المشترك، وعلى احتمال الإشارة إلى الروح القدس، من غير حسم ما أبقاه الأصل محتملًا.
- source_word: περιεπατήσαμεν
  choice: سلكنا
  rationale: «سلك» تعبير عربي مألوف عن نهج الحياة والتصرف، ويحفظ استعارة المشي التي يستخدمها بولس.
- source_word: τοῖς αὐτοῖς ἴχνεσιν
  choice: سرنا على الآثار نفسها
  rationale: «الآثار» تنقل صورة آثار الأقدام أو المسار المتَّبع، و«سرنا على» تعبير عربي واضح يحفظ الاستعارة والتوازي.
theological_decisions:
- issue: المقصود بعبارة «بالروح نفسه»
  choice: صياغة عربية محتملة للروح أو التوجه المشترك، من دون تقييدها صراحةً بالروح القدس
  alternative: «بإرشاد الروح نفسه»، على أن يكون المراد الروح القدس
  rationale: السياق المباشر يتناول اتفاق بولس وتيطس في النزاهة والسلوك، لكنه لا يمنع سماع إشارة إلى عمل الروح القدس. لذلك تُرك الاحتمال قائمًا وأوضحه الهامش.
translation_notes:
  register: لغة عربية فصحى معاصرة واضحة ووقورة. حُفظت الأسئلة البلاغية والاستعارتان المتصلتان بالسلوك والآثار، وتُرك الغموض المقصود في «الروح» من غير فرض قراءة مذهبية.
