base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/016.yaml
  text: 'But let it be so: I did not burden you[a]. Yet, being crafty[c][b], I took you by deceit.'
translation:
  language: ar
  text: 'فليكن الأمر كذلك[a]: أنا لم أُثقِل عليكم. لكنني، إذ كنتُ ماكرًا[b]، أخذتكم بالخداع[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «حسنًا إذن، فليكن الأمر كذلك» أو «ومهما يكن من أمر»؛ يبدو أن بولس يسلّم بهذه النقطة على سبيل الجدل.'
    reason: lexical_alternative
  - marker: b
    text: يُرجَّح أن عبارة «إذ كنتُ ماكرًا، أخذتكم بالخداع» ترديدٌ ساخر من بولس لاتهامٍ موجَّه إليه، لا اعترافًا فعليًا منه.
    reason: alternative_reading
  - marker: c
    text: 'أو: «اصطدتكم بالحيلة» أو «استغللتكم بالخداع».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστω δέ
  choice: ولكن ليكن الأمر كذلك
  rationale: صيغة أمر تؤدي هنا وظيفة تنازلية في الحجاج؛ تحافظ العبارة على معنى التسليم الجدلي من غير أن تحوله إلى شرح مطوّل.
- source_word: κατεβάρησα
  choice: أُثقِل عليكم
  rationale: يحفظ الاستعارة اليونانية، ويصلح في السياق للدلالة على تحميلهم عبئًا، ولا سيما العبء المادي.
- source_word: ὑπάρχων
  choice: إذ كنتُ
  rationale: تنقل اسم الفاعل اليوناني بصياغة ظرفية طبيعية، من غير الجزم بعلاقة سببية أو تنازلية أدق مما يصرح به النص.
- source_word: πανοῦργος
  choice: ماكرًا
  rationale: تنقل الدلالة السلبية للدهاء غير النزيه في الاتهام الذي يردده بولس على نحو ساخر.
- source_word: δόλῳ
  choice: بالخداع
  rationale: 'تنقل دلالة الداتيف الأداتية بوضوح: الخداع هو الوسيلة المزعومة للأخذ.'
- source_word: ἔλαβον
  choice: أخذتكم
  rationale: تبقي على الفعل العام القريب من الأصل، فيما تحدد عبارة «بالخداع» طابع الاتهام، من غير فرض معنى «استغللتكم» في المتن.
theological_decisions:
- issue: هل الكلام بعد ἀλλὰ اعتراف من بولس أم ترديد ساخر لاتهام موجَّه إليه؟
  choice: 'إبقاء العبارة في المتن بصيغة مباشرة: «لكنني، إذ كنتُ ماكرًا، أخذتكم بالخداع».'
  alternative: 'صياغتها تفسيرياً: «لكنكم تزعمون أنني، بما أنني ماكر، اصطدتكم بالحيلة».'
  rationale: السياق الأوسع ينفي أن بولس استغل أهل كورنثوس، ولذلك يُرجَّح أنه يردد اتهامًا على سبيل المفارقة. لكن إدخال «تزعمون» في المتن يحسم ما تركته الصياغة اليونانية ضمنيًا؛ لذا تُحفظ الحدة والتوتر في المتن ويُشرح الاحتمال في الحاشية.
translation_notes:
  register: عربية فصحى واضحة وموقرة. استُخدم «أُثقِل عليكم» للحفاظ على صورة العبء، و«أخذتكم بالخداع» للإبقاء على قرب الصياغة من اليونانية وعلى غموض النبرة بين التقرير والاقتباس الساخر.
