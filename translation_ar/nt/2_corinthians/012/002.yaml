source:
  edition: SBLGNT
  text: οἶδα ἄνθρωπον ἐν Χριστῷ πρὸ ἐτῶν δεκατεσσάρων— εἴτε ἐν σώματι οὐκ οἶδα, εἴτε ἐκτὸς τοῦ σώματος οὐκ οἶδα, ὁ θεὸς οἶδεν— ἁρπαγέντα τὸν τοιοῦτον ἕως τρίτου οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/002.yaml
  text: I know a man in Messiah who[a], fourteen years ago—whether in the body I do not know, or outside the body I do not know[c][b], God knows—was caught up to the third heaven.
translation:
  language: ar
  text: أعرف رجلًا في المسيح[a]، قبل أربع عشرة سنة—سواء أكان في الجسد، لا أعرف، أم خارج الجسد، لا أعرف، الله يعرف[b]—اختُطف هذا الرجل إلى السماء الثالثة[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «في المسيح» ترجمة للتعبير اليوناني ἐν Χριστῷ. وهو تعبير بولسي موجز يُبقي طبيعة الصلة بالمسيح غير مشروحة في المتن.
    reason: alternative_reading
  - marker: b
    text: لا يحدد بولس هل وقع هذا في الجسد أم خارج الجسد؛ بل يكرر أنه لا يعرف ويترك كيفية الخبرة بلا حسم.
    reason: lexical_alternative
  - marker: c
    text: «السماء الثالثة» تعبير من التصورات الكونية اليهودية القديمة. أبقت الترجمة العبارة كما هي بدل تفسيرها بـ«أعلى السماء» أو «الفردوس».
    reason: cultural_note
lexical_decisions:
- source_word: οἶδα
  choice: أعرف
  rationale: الفعل اليوناني بصيغة تامة لكنه يؤدي معنى الحاضر في اليونانية الكوينية، و«أعرف» هو المقابل العربي الطبيعي.
- source_word: ἄνθρωπον
  choice: إنسانًا
  rationale: يدل هنا على شخص ذكر معيّن، لكن «إنسانًا» عربية فصيحة طبيعية لا تضيف ما ليس لازمًا، والسياق يعيّن المقصود.
- source_word: ἐν Χριστῷ
  choice: في المسيح
  rationale: يحفظ التعبير البولسي الموجز الدال على صلة الشخص بالمسيح من غير توسيعه إلى تفسير مثل «متحدًا بالمسيح».
- source_word: πρὸ ἐτῶν δεκατεσσάρων
  choice: قبل أربع عشرة سنة
  rationale: مقابل عربي مباشر وطبيعي للتعبير الزمني اليوناني.
- source_word: εἴτε ἐν σώματι
  choice: أفي الجسد؟
  rationale: يحفظ احتمال وقوع الاختطاف في الجسد، وتفيد همزة الاستفهام مع «أم» بنية التردد في العربية.
- source_word: ἐκτὸς τοῦ σώματος
  choice: خارج الجسد
  rationale: ترجمة مباشرة تحفظ التضاد مع «في الجسد» من غير تفسير طبيعة الخبرة.
- source_word: ὁ θεὸς οἶδεν
  choice: الله يعرف
  rationale: ترجمة حرفية واضحة؛ لم تُضف كلمة «وحده» لأنها غير مصرّح بها في اليونانية.
- source_word: ἁρπαγέντα
  choice: اختُطف
  rationale: المبني للمجهول يحفظ كون الشخص واقعًا عليه الفعل، و«اختُطف» يؤدي معنى النقل المفاجئ إلى أعلى من غير تعيين الفاعل في العبارة نفسها.
- source_word: τὸν τοιοῦτον
  choice: إنسانًا … اختُطف
  rationale: أُدمجت الإحالة الاستئنافية اليونانية في تركيب عربي متصل؛ تكرار «مثل هذا» هنا سيكون متكلفًا وقد يوحي بالمماثلة لا بمجرد العودة إلى الشخص المذكور.
- source_word: ἕως τρίτου οὐρανοῦ
  choice: إلى السماء الثالثة
  rationale: صياغة عربية طبيعية تحفظ التعبير العددي كما هو ولا تستبدله بتفسير كـ«الفردوس» أو «أعلى السماء».
theological_decisions:
- issue: دلالة ἐν Χριστῷ
  choice: في المسيح
  alternative: متحدًا بالمسيح
  rationale: اختير التعبير المباشر ليحفظ صيغة بولس اللاهوتية الموجزة من غير شرح طبيعة الاتحاد أو الانتماء داخل المتن.
- issue: كيفية حدوث الاختطاف
  choice: 'الإبقاء على عدم معرفة بولس: «أفي الجسد؟ لا أعرف، أم خارج الجسد؟ لا أعرف؛ الله يعرف»'
  alternative: تعيين الاختبار بوصفه صعودًا جسديًا أو رؤيا خارج الجسد
  rationale: النص يكرر عدم المعرفة ويترك كيفية الحدث بلا حسم، لذلك لا يجوز للترجمة أن ترجح أحد الاحتمالين.
- issue: معنى «السماء الثالثة»
  choice: إبقاء العبارة «السماء الثالثة»
  alternative: تفسيرها في المتن بـ«الفردوس» أو «أعلى السماء»
  rationale: يحفظ النص الصورة الكونية القديمة وتوترها التفسيري بدل استبدالها بتحديد غير وارد في هذه الآية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُخدم تركيب الاستفهام «أ... أم...» لإبراز التردد المتعمد، مع تكرار «لا أعرف» كما في الأصل. نُقلت الجملة الاعتراضية بعد خبر الاختطاف قليلًا لتستقيم العربية، من غير تغيير الاحتمالين أو حسمهما.
