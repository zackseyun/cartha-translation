  text: Γέγονα ⸀ἄφρων· ὑμεῖς με ἠναγκάσατε· ἐγὼ γὰρ ὤφειλον ὑφ’ ὑμῶν συνίστασθαι. οὐδὲν γὰρ ὑστέρησα τῶν ὑπερλίαν ἀποστόλων, εἰ καὶ οὐδέν εἰμι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/011.yaml
  text: I have become a fool; you forced me to it. For I ought to have been commended by you[a], for I fell short in nothing compared with those super-apostles, even if I am nothing.
translation:
  language: ar
  text: لقد صرتُ أحمقًا؛ أنتم أجبرتموني. فقد كان ينبغي أن تزكّوني أنتم، إذ لم أكن أقلَّ في شيء من أولئك الرسل الفائقين[a]، وإن كنتُ لا شيء.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أعظم الرسل». التعبير اليوناني شديد التوكيد، وقد يكون تهكميًا في هذا السياق.'
    reason: alternative_reading
lexical_decisions:
- source_word: Γέγονα
  choice: لقد صرتُ
  rationale: يحفظ دلالة الزمن التام على حالة حاضرة نتجت من فعل سابق، ويأتي طبيعيًا في العربية.
- source_word: ἄφρων
  choice: أحمق
  rationale: خبر اسمي يعبّر بوضوح عن وصف بولس لنفسه في سياق المفاخرة ذات الطابع التهكمي.
- source_word: ὑμεῖς με ἠναγκάσατε
  choice: أنتم أجبرتموني
  rationale: يُبرز الضمير المنفصل توكيد الفاعل في اليونانية، ويترك متعلَّق الإجبار مفهومًا من السياق القريب.
- source_word: ὤφειλον ὑφ’ ὑμῶν συνίστασθαι
  choice: كان ينبغي أن تمدحوني أنتم
  rationale: ينقل معنى الواجب أو التصرف المنتظر، ويعبّر «تمدحوني» عن دفاع الكورنثيين عنه وتزكيتهم له في هذا السياق؛ وتكرار «أنتم» يحفظ جهة الفعل المؤكدة.
- source_word: οὐδὲν ... ὑστέρησα
  choice: لم أكن أقلَّ في شيء
  rationale: ينقل معنى عدم التأخر أو الدونية بالنسبة إلى الآخرين بصياغة عربية واضحة.
- source_word: τῶν ὑπερλίαν ἀποστόλων
  choice: أولئك الرسل الفائقين
  rationale: يحفظ شدة التعبير اليوناني ويتيح فهمه تهكميًا أو على ظاهره دون أن يفرض التهكم صراحة في المتن.
- source_word: εἰ καὶ οὐδέν εἰμι
  choice: وإن كنتُ لا شيء
  rationale: يحفظ الصيغة التنازلية وتعبير بولس الحاد عن ضآلة شأنه دون تحويل «لا شيء» إلى «لا أحد».
theological_decisions:
- issue: دلالة τῶν ὑπερλίαν ἀποστόλων
  choice: الرسل الفائقين
  alternative: أعظم الرسل / من يُسمَّون الرسل الفائقين
  rationale: العبارة شديدة التوكيد وقد تكون تهكمية في السياق، لكن اليونانية لا تتضمن لفظًا صريحًا بمعنى «المزعومين» أو «من يُسمَّون». لذلك تُرك التوتر البلاغي قائمًا، مع بيان الاحتمال في الحاشية.
- issue: قوة εἰ καὶ في ختام الآية
  choice: وإن كنتُ لا شيء
  alternative: مع أنني لا شيء
  rationale: صيغة «وإن» تحفظ قدرًا من الانفتاح بين الشرط التنازلي والإقرار التنازلي، فلا تحسم الدلالة أكثر مما يقتضيه الأصل.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدمت «لقد صرتُ» لحفظ أثر الزمن التام، و«الرسل الفائقين» للمحافظة على المبالغة الأصلية مع عدم فرض القراءة التهكمية في المتن.
