  yaml_path: translation/nt/2_corinthians/012/005.yaml
  text: On behalf of such a one I will boast[a], but on behalf of myself I will not boast[b], except in my weaknesses.
translation:
  language: ar
  text: من جهة شخص كهذا أفتخر[a]، أما من جهة نفسي فلا أفتخر إلا بضعفاتي[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «عن شخص كهذا». يحتمل حرف الجر اليوناني معنى أعمّ، لكن «من جهة» تحافظ على المسافة البلاغية في كلام بولس.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «في الضعفات» أو «في ضعفات». وقد يدل «الضعف» عند بولس على الوهن البشري أو المعاناة أو الأحوال التي تظهر فيها قدرة الله.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ
  choice: من جهة
  rationale: تؤدي معنى الإشارة إلى الشخص الذي يتعلق به الافتخار، وتحافظ على المسافة البلاغية من غير أن توحي بالضرورة بالدفاع نيابة عنه.
- source_word: τοῦ τοιούτου
  choice: إنسان كهذا
  rationale: تعبير عربي طبيعي يحفظ الإشارة غير المباشرة ونبرة الابتعاد البلاغي، من غير حسم ما إذا كان المقصود شخصًا آخر فعلًا.
- source_word: καυχήσομαι
  choice: أفتخر
  rationale: المقابل العربي الواضح والمألوف للفعل في هذا السياق البولسي، ويصلح للمستقبل بحسب دلالة الصيغة والسياق.
- source_word: ἐμαυτοῦ
  choice: نفسي
  rationale: ينقل الضمير الانعكاسي بوصفه الطرف المقابل لذلك الإنسان المذكور على نحو غير مباشر.
- source_word: εἰ μὴ
  choice: إلا
  rationale: أداة استثناء طبيعية هنا؛ فالتركيب لا يقدم شرطًا بل يستثني مجال الضعفات من نفي الافتخار.
- source_word: ἐν ταῖς ἀσθενείαις
  choice: بضعفاتي
  rationale: حرف الباء عربي طبيعي مع «أفتخر»، والجمع يحفظ صيغة اليونانية. أضيف ضمير المتكلم لأن المقابلة مع «نفسي» تدل على أن المقصود ضعفاته، مع التنبيه إلى الصيغة الحرفية في الحاشية.
theological_decisions:
- issue: طبيعة افتخار بولس المسموح به
  choice: يحافظ النص على التباين بين الافتخار من جهة «إنسان كهذا» والافتخار من جهة بولس نفسه، فلا يجيز في الحالة الثانية إلا الافتخار بضعفاته.
  alternative: قد يكون «إنسان كهذا» شخصًا آخر متميزًا عنه حرفيًا، أو أسلوبًا بلاغيًا يشير به بولس إلى نفسه مع إبقاء مسافة عن الاختبار.
  rationale: السياق يتعمد إبقاء مسافة بلاغية بين بولس والاختبار الاستثنائي، ثم يحول التركيز إلى الضعف؛ لذلك لا تحسم الترجمة المسألة الذاتية الأوسع.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُعمل «من جهة» لتكرار البنية المتقابلة في اليونانية، و«إنسان كهذا» بدل صياغة قديمة مثل «مثل هذا»، مع إبقاء الغموض البلاغي المقصود.
