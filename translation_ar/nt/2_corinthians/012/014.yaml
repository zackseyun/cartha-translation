source:
  edition: SBLGNT
  text: Ἰδοὺ τρίτον ⸀τοῦτο ἑτοίμως ἔχω ἐλθεῖν πρὸς ὑμᾶς, καὶ οὐ ⸀καταναρκήσω· οὐ γὰρ ζητῶ τὰ ὑμῶν ἀλλὰ ὑμᾶς, οὐ γὰρ ὀφείλει τὰ τέκνα τοῖς γονεῦσιν θησαυρίζειν, ἀλλὰ οἱ γονεῖς τοῖς τέκνοις.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/014.yaml
  text: Look, this is the third time I am ready to come to you, and I will not be a burden to you. For I do not seek what is yours, but you. For children are not obligated to store up for their parents, but parents for their children.
translation:
  language: ar
  text: ها أنا مستعدّ للمجيء إليكم هذه المرة الثالثة[a]، ولن أثقل عليكم[b]؛ لأني لا أطلب ما لكم، بل أطلبكم أنتم. فليس الأولاد ملزمين بأن يدّخروا للوالدين، بل الوالدان ملزمون بأن يدّخروا للأولاد.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو بصورة أقرب إلى ترتيب اليونانية: «ها أنا للمرة الثالثة مستعدّ للمجيء إليكم».'
    reason: lexical_alternative
  - marker: b
    text: الفعل المترجم «أثقل عليكم» قد يدل هنا على تحميلهم نفقة أو عبئًا ماليًا.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: ها أنا
  rationale: أداة تنبيه طبيعية وفصيحة، ارتبطت هنا بالمتكلم لتجنب «انظروا» التي قد تبدو حرفية أو آمرة أكثر من اللازم.
- source_word: τρίτον τοῦτο ἑτοίμως ἔχω ἐλθεῖν
  choice: مستعدّ للمجيء إليكم هذه المرة الثالثة
  rationale: يحافظ على تمركز العبارة اليونانية حول الاستعداد الحالي للمجيء، من غير الجزم بأن زيارتين سابقتين قد حدثتا فعلًا.
- source_word: καταναρκήσω
  choice: أثقل عليكم
  rationale: تعبير عربي طبيعي يحفظ صورة العبء، والسياق يدل على العبء المادي أو المالي.
- source_word: ζητῶ τὰ ὑμῶν ἀλλὰ ὑμᾶς
  choice: لا أطلب ما لكم، بل أطلبكم أنتم
  rationale: يحفظ المقابلة الموجزة بين ممتلكاتهم وأشخاصهم، مع توكيد الضمير في الطرف الثاني.
- source_word: ὀφείλει
  choice: ملزمين
  rationale: ينقل معنى الواجب أو الالتزام بوضوح، لا مجرد ما يُستحسن فعله.
- source_word: θησαυρίζειν
  choice: يدّخروا
  rationale: لفظ عربي واضح ينقل معنى جمع المال أو حفظه للمستقبل، وهو الأنسب للمثل الأسري في السياق.
- source_word: γονεῦσιν / γονεῖς
  choice: الوالدين / الوالدان
  rationale: يشمل الأب والأم كما يقتضي اللفظ اليوناني العام.
- source_word: τέκνα / τέκνοις
  choice: الأولاد
  rationale: لفظ عربي عام يشمل الأبناء والبنات ويحافظ على العلاقة الأسرية المقصودة.
theological_decisions:
- issue: دلالة «المرة الثالثة» في تاريخ زيارات بولس
  choice: ربط الثالثة باستعداد بولس للمجيء
  alternative: صياغتها بما يجزم بأنها ستكون زيارته الثالثة الفعلية
  rationale: النص اليوناني يصف استعداده الحالي للمجيء بهذه الصيغة، ولا يستلزم وحده حسم إعادة بناء عدد الزيارات السابقة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «ها أنا» للتنبيه الطبيعي، و«ما لكم» للمحافظة على المقابلة بين الممتلكات والأشخاص. جميع علامات الحواشي مثبتة في المتن.
