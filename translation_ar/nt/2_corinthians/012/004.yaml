  text: ὅτι ἡρπάγη εἰς τὸν παράδεισον καὶ ἤκουσεν ἄρρητα ῥήματα ἃ οὐκ ἐξὸν ἀνθρώπῳ λαλῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/004.yaml
  text: that he was caught up into paradise and heard inexpressible words, which a man is not permitted to speak.
translation:
  language: ar
  text: أَنَّهُ اخْتُطِفَ إِلَى الْفِرْدَوْسِ، وَسَمِعَ كَلِمَاتٍ لَا يُعَبَّرُ عَنْهَا، وَلَا يَحِلُّ لِإِنْسَانٍ أَنْ يَنْطِقَ بِهَا.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡρπάγη
  choice: اخْتُطِفَ
  rationale: يحافظ على صيغة المبني للمجهول وعلى دلالة الأخذ المفاجئ أو القسري، مع عربية كتابية طبيعية.
- source_word: παράδεισον
  choice: الْفِرْدَوْسِ
  rationale: المقابل العربي الراسخ لـ παράδεισος، ويحفظ الإحالة المكانية في عبارة «إلى الفردوس».
- source_word: ἄρρητα ῥήματα
  choice: كَلِمَاتٍ لَا يُعَبَّرُ عَنْهَا
  rationale: ينقل معنى ما يتعذر أو لا يمكن التعبير عنه دون حصر العبارة مسبقًا في معنى «السري» أو «الممنوع»؛ أما قيد عدم الجواز فيأتي صراحة في الجملة التالية.
- source_word: οὐκ ἐξὸν
  choice: لَا يَحِلُّ
  rationale: تعبير عربي واضح عن عدم الجواز أو الإباحة، وهو أنسب من صياغة تفيد مجرد العجز.
- source_word: ἀνθρώπῳ
  choice: لِإِنْسَانٍ
  rationale: اسم جنس يشير إلى الإنسان عمومًا، ولا تقتضي اليونانية هنا تخصيص الذكر.
- source_word: λαλῆσαι
  choice: أَنْ يَنْطِقَ بِهَا
  rationale: ينقل فعل التلفظ بالكلمات بعبارة عربية طبيعية، مع ضمير يوضح المفعول المفهوم من السياق.
theological_decisions:
- issue: هل الكلمات مستحيلة التعبير أم محظورة النطق؟
  choice: 'إبقاء الوجهين في تسلسل النص: «لا يُعبَّر عنها» ثم «لا يحل... أن ينطق بها».'
  alternative: دمج المعنيين في «كلمات لا يجوز الإفصاح عنها».
  rationale: ἄρρητα قد تحمل معنى ما لا يُنطق به أو ما يتعذر وصفه، بينما οὐκ ἐξὸν يصرح بعدم الجواز؛ إبقاء العبارتين يحفظ التوتر الدلالي ولا يختزل إحداهما في الأخرى.
- issue: دلالة الفاعل البشري في ἀνθρώπῳ
  choice: «إنسان» بوصفه اسم جنس شاملًا.
  alternative: «رجل».
  rationale: ἀνθρώπῳ تعني الإنسان أو الشخص عمومًا، ولا توجد قرينة لغوية تستلزم إبراز الجنس الذكري.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة مهيبة، مع الحفاظ على المبني للمجهول والتوازي بين سماع الكلمات وعدم جواز النطق بها.
