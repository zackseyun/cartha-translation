source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἥδιστα δαπανήσω καὶ ἐκδαπανηθήσομαι ὑπὲρ τῶν ψυχῶν ὑμῶν. ⸀εἰ περισσοτέρως ὑμᾶς ⸀ἀγαπῶν, ἧσσον ἀγαπῶμαι;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/015.yaml
  text: But I will most gladly spend and be spent for your souls. If I love you more abundantly[a], am I loved less?
translation:
  language: ar
  text: وأنا بكل سرور سأنفق وسأُنفَق من أجل نفوسكم.[a] فإن كنت أحبكم أكثر، أفأُحَبّ أقل؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «من أجل حياتكم» أو «من أجلكم أنتم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥδιστα
  choice: بكل سرور
  rationale: تنقل صيغة التفضيل في السياق بوصفها استعدادًا شديدًا وفرحًا صادقًا، وتأتي عربية طبيعية غير متكلفة.
- source_word: δαπανήσω
  choice: سأنفق
  rationale: تحفظ استعارة الإنفاق وصيغة المستقبل، وتُمهد للمقابلة مع أن يُنفَق بولس نفسه.
- source_word: ἐκδαπανηθήσομαι
  choice: سأُنفَق
  rationale: تحفظ المبني للمجهول واستعارة البذل حتى استنفاد الذات؛ وأُضيفت «بل» لإبراز التصاعد الدلالي بين الفعلين.
- source_word: ὑπὲρ
  choice: من أجل
  rationale: تفيد المنفعة والغاية التضحية بوضوح في العربية.
- source_word: τῶν ψυχῶν ὑμῶν
  choice: نفوسكم
  rationale: تحفظ اللفظ اليوناني وثقله الشخصي والروحي، مع التنبيه في الحاشية إلى سعته الدلالية.
- source_word: εἰ
  choice: أفكلما
  rationale: تنقل الشرط الاستفهامي البلاغي إلى تركيب عربي طبيعي، من غير تحويله إلى تقرير سببي صريح؛ و«كلما» توضح علاقة الزيادة والنقصان التي تفيدها المقارنة.
- source_word: περισσοτέρως
  choice: أكثر
  rationale: مقابل عربي واضح لدرجة المقارنة، ويتوازن مباشرة مع «أقل».
- source_word: ἀγαπῶν
  choice: أحببتكم
  rationale: صيغ اسم الفاعل اليوناني فعلًا عربيًا داخل الشرط البلاغي لتحسين السلاسة، مع إبقاء بولس فاعل المحبة.
- source_word: ἧσσον
  choice: أقل
  rationale: يحفظ المقابلة الموجزة والصريحة مع «أكثر».
- source_word: ἀγαπῶμαι
  choice: أحببتموني
  rationale: يحوّل المبني للمجهول اليوناني إلى معلوم عربي طبيعي مع استحضار الفاعل المفهوم من السياق، أي المخاطبين، من دون تغيير المعنى.
theological_decisions:
- issue: دلالة ψυχαί في سياق رعوي بولسي
  choice: نفوسكم
  alternative: حياتكم أو ذواتكم
  rationale: «نفوسكم» تحافظ على صورة النص وعمق اهتمام بولس بالأشخاص، من غير أن تفرض أنثروبولوجيا تقنية؛ وتعرض الحاشية البدائل السياقية المشروعة.
- issue: القوة المنطقية للشرط εἰ في السؤال البلاغي
  choice: أفكلما أحببتكم أكثر، أحببتموني أقل؟
  alternative: فإن كنت أحبكم أكثر، أفأُحَب أقل؟
  rationale: الصياغة المختارة تحافظ على السؤال والتوتر بين ازدياد محبة بولس وتناقص محبتهم، ولا تحسم εἰ إلى «لأن» أو «مع أن».
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. حُفظت استعارة الإنفاق المتصاعدة بتكرار الجذر «أنفق»، وصيغ السؤال الأخير بأسلوب عربي طبيعي مع إبقاء المفارقة البلاغية وعدم تحويلها إلى تقرير.
