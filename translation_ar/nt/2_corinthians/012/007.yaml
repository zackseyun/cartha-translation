  text: καὶ τῇ ὑπερβολῇ τῶν ἀποκαλύψεων. ⸀διὸ ἵνα μὴ ὑπεραίρωμαι, ἐδόθη μοι σκόλοψ τῇ σαρκί, ἄγγελος ⸀Σατανᾶ, ἵνα με κολαφίζῃ, ⸂ἵνα μὴ ὑπεραίρωμαι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/007.yaml
  text: And because of the surpassing greatness of the revelations—so that I might not exalt myself—a thorn in the flesh was given to me[a], a messenger of Satan, so that it might torment me[e][d][c][b], so that I might not exalt myself.
translation:
  language: ar
  text: وبسبب عظمة الإعلانات الفائقة—ولئلا أتعالى—أُعطيتُ شوكةً في الجسد[a]، رسولًا من الشيطان[b]، لكي يلكمني[c]، لئلا أتعالى[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وتدًا في الجسد». يمكن أن تدل الكلمة اليونانية على وتد حاد أو شظية أو شوكة، والصورة الدقيقة غير مؤكدة.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا ترجمة «رسولًا من الشيطان»: «ملاكًا من الشيطان». فالكلمة اليونانية قد تعني رسولًا أو ملاكًا.'
    reason: alternative_reading
  - marker: c
    text: 'أو: «يعذبني» أو «يضربني ضربات متتابعة». يشير الفعل اليوناني حرفيًا إلى اللكم أو الضرب.'
    reason: lexical_alternative
  - marker: d
    text: ترد عبارة «لئلا أتعالى» مرتين في النص اليوناني، وقد أُبقي التكرار هنا.
    reason: textual_transparency
lexical_decisions:
- source_word: τῇ ὑπερβολῇ τῶν ἀποκαλύψεων
  choice: لفرط عظمة الإعلانات
  rationale: ينقل شدة ὑπερβολή وصلتها بالإضافة إلى الإعلانات بصياغة عربية واضحة، مع إبقاء الإعلانات مصطلحًا بولسيًا مألوفًا.
- source_word: ὑπεραίρωμαι
  choice: أتعالى
  rationale: يحفظ معنى الارتفاع أو التعاظم على النفس دون حصره في الغرور النفسي وحده، ويتيح تكرار العبارة كما في اليونانية.
- source_word: ἐδόθη μοι
  choice: أُعطيتُ
  rationale: يحافظ على المبني للمجهول ولا يصرّح بهوية المُعطي، كما لا يضيف النص ذلك صراحة.
- source_word: σκόλοψ τῇ σαρκί
  choice: شوكةً في الجسد
  rationale: يحفظ الاستعارة وغموض ماهية الأذى، ويتجنب تفسير الجسد هنا على أنه الطبيعة الخاطئة.
- source_word: ἄγγελος Σατανᾶ
  choice: رسولًا من الشيطان
  rationale: كلمة رسول أوسع من ملاك وتحفظ احتمال أن يكون المقصود كائنًا روحيًا أو عاملًا آخر؛ و«من الشيطان» تعبّر طبيعيًا عن المصدر أو الانتماء.
- source_word: κολαφίζῃ
  choice: يلكمني
  rationale: ينقل الصورة الحسية للفعل، أي الضرب باللكمات أو الكفوف، بدل الاكتفاء بالمعنى التفسيري العام «يعذبني».
theological_decisions:
- issue: ماهية الشوكة في الجسد
  choice: الإبقاء على الاستعارة دون تحديد نوع البلاء
  alternative: مرض جسدي، أو اضطهاد، أو مضايقة شيطانية
  rationale: النص لا يحدد ماهية الشوكة، فلا ينبغي للترجمة أن تحسمها.
- issue: هوية من أعطى الشوكة
  choice: الإبقاء على صيغة المبني للمجهول
  alternative: أعطاني الله شوكة أو سُمح بأن تصيبني شوكة
  rationale: قد توحي الصيغة بإذن إلهي، لكن الفاعل غير مصرّح به، فتبقى العلاقة بين السيادة الإلهية والأداة الشيطانية دون حسم.
- issue: دلالة ἄγγελος Σατανᾶ
  choice: رسول من الشيطان
  alternative: ملاك للشيطان
  rationale: يحفظ «رسول» الاتساع الدلالي للكلمة اليونانية ولا يقرر طبيعة العامل الأنطولوجية.
- issue: تكرار غرض منع التعالي
  choice: إثبات العبارة مرتين
  alternative: حذف أحد التكرارين لتحسين الأسلوب
  rationale: التكرار موجود في النص اليوناني ويؤدي وظيفة تأكيدية، لذلك يُحفظ.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت الشرطتان لعزل جملة الغرض الأولى وتوضيح تركيب الآية، مع الحفاظ على التقديم والتكرار في الأصل. الضمير المستتر في «يلكمني» يعود نحويًا إلى «رسولًا»، من غير أن يحسم هل الرسول ملاك أم عامل آخر.
