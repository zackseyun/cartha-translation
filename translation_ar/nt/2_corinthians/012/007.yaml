  source_fidelity: 'الترجمة تحافظ على عناصر النص اليوناني الأساسية: سبب الإعلانات الاستثنائية، وعبارتي الغرض المكررتين، والمبني للمجهول في «أُعطيتُ»، واستعارة الشوكة، وغموض هوية «رسول الشيطان»، والمعنى الحسي لفعل κολαφίζῃ. غير أن موضع علامة الحاشية الخاصة بـἄγγελος يحتاج إلى نقله إلى «رسولًا من الشيطان»، كما ينبغي أن تتوافق صياغة بديل الحاشية مع «من الشيطان».'
  naturalness: «ولفرط عظمة الإعلانات» مفهومة، لكن «وبسبب عظمة الإعلانات الفائقة» أيسر في العربية الفصحى الحديثة، وأوضح في إظهار العلاقة السببية. وما عدا ذلك، فتركيب الجملة طبيعي ورصين، والشرطتان تفصلان جملة الغرض الأولى بوضوح.
  terminology: «الإعلانات»، «شوكة في الجسد»، و«رسولًا من الشيطان» اختيارات مناسبة ومحافظة على الغموض المقصود. و«يلكمني» أدق من «يعذبني» في نقل الدلالة التصويرية لفعل κολαφίζῃ. يُستحسن في الحاشية أن يكون البديل «ملاكًا من الشيطان» اتساقًا مع الأصل ومع المتن، دون تقرير لطبيعة هذا الرسول.
