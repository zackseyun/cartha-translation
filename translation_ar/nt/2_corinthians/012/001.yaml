id: 2CO.12.1
reference: 2 Corinthians 12:1
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Καυχᾶσθαι ⸀δεῖ· οὐ ⸂συμφέρον μέν⸃, ἐλεύσομαι ⸀δὲ εἰς ὀπτασίας καὶ ἀποκαλύψεις κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/001.yaml
  text: Boasting is necessary[a], though it is not beneficial[b]; but I will go on to visions and revelations of the Lord.
translation:
  language: ar
  text: لا بُدَّ من الافتخار، وإن كان غير نافع[b]؛ لكنني سأنتقل إلى رؤى وإعلانات الرب[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «رؤى وإعلانات من الرب». قد يدل المضاف إليه في اليونانية على المصدر، لكن «رؤى وإعلانات الرب» أقرب إلى صياغة الأصل وإيجازه.'
    reason: alternative_reading
  - marker: b
    text: 'يمكن أيضًا وصل العبارة هكذا: «لا بُدَّ من الافتخار—مع أنه غير نافع—لكنني سأنتقل…».'
    reason: previous_rendering
lexical_decisions:
- source_word: Καυχᾶσθαι
  choice: الافتخار
  rationale: المصدر اليوناني قائم مقام الاسم هنا، و«الافتخار» يحافظ على الفكرة الفعلية من غير أن يصرّح بالفاعل أكثر مما يصرّح به النص.
- source_word: δεῖ
  choice: لا بُدَّ من
  rationale: تؤدي معنى الضرورة، وتنسجم طبيعيًا مع المصدر «الافتخار».
- source_word: οὐ συμφέρον μέν
  choice: وإن كان غير نافع
  rationale: ينقل معنى عدم الجدوى أو المنفعة، ويؤدي الوظيفة التنازلية التي يمهّد لها μέν قبل المقابلة بـδέ.
- source_word: ἐλεύσομαι δὲ
  choice: لكنني سأنتقل
  rationale: الفعل مع εἰς يدل في السياق على الانتقال إلى موضوع جديد، لا على المجيء المكاني؛ و«لكن» تعكس المقابلة التي تفيدها δέ.
- source_word: εἰς ὀπτασίας
  choice: إلى رؤى
  rationale: «رؤى» مقابل واضح ومألوف لـὀπτασίας في سياق المشاهدات الخارقة.
- source_word: καὶ ἀποκαλύψεις
  choice: وإعلانات
  rationale: «إعلانات» تنقل معنى الكشف والإظهار الإلهي، وتحافظ على الجمع.
- source_word: κυρίου
  choice: الرب
  rationale: جاءت في تركيب الإضافة «رؤى وإعلانات الرب»، وهو يحافظ قدر الإمكان على إيجاز المضاف إليه اليوناني وعلى احتمال دلالته على المصدر أو العلاقة الأعم.
theological_decisions:
- issue: علاقة κυρίου بـ«رؤى وإعلانات»
  choice: رؤى وإعلانات الرب
  alternative: رؤى وإعلانات من الرب
  rationale: المضاف إليه اليوناني قد يدل على المصدر، لكنه لا يصرّح بذلك وحده. يحافظ تركيب الإضافة العربي على قدر أكبر من الإيجاز والاحتمال، بدل حصر المعنى في كون الرؤى والإعلانات آتية من الرب.
translation_notes:
  register: العربية فصحى معاصرة واضحة ورصينة. استُخدم «لا بُدَّ من الافتخار» للمحافظة على الصياغة غير الشخصية في الأصل، و«سأنتقل» للتعبير الطبيعي عن الانتقال إلى موضوع جديد. وُضعت علامتا الحاشيتين عند العبارتين اللتين تشرحانهما.
