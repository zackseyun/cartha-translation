source:
  edition: SBLGNT
  text: ⸀Πάλαι δοκεῖτε ὅτι ὑμῖν ἀπολογούμεθα; ⸀κατέναντι θεοῦ ἐν Χριστῷ λαλοῦμεν. τὰ δὲ πάντα, ἀγαπητοί, ὑπὲρ τῆς ὑμῶν οἰκοδομῆς,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/019.yaml
  text: Have you been thinking all along that we are defending ourselves to you? Before God[a], in Messiah, we are speaking. And everything, beloved[b], is for your building up.
translation:
  language: ar
  text: هل ظللتم طوال هذا الوقت تظنون أننا ندافع عن أنفسنا أمامكم؟ إننا نتكلم أمام الله في المسيح. وكل شيء، أيها الأحباء[a]، هو لأجل بنيانكم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ويجوز وصل الجملة بما قبلها: «إننا نتكلم أمام الله في المسيح، وكل شيء، أيها الأحباء، هو لأجل بنيانكم».'
    reason: يتيح غياب علامات الترقيم في المخطوطات القديمة أكثر من طريقة طبيعية لتقسيم الجمل، من غير تغيير جوهر المعنى.
lexical_decisions:
- source_word: Πάλαι
  choice: طوال هذا الوقت
  rationale: تنقل دلالة الافتراض المستمر إلى الحاضر في هذا السؤال البلاغي، بدل أن توحي بزمن ماضٍ بعيد منفصل عن السياق.
- source_word: δοκεῖτε
  choice: ظللتم ... تظنون
  rationale: يجمع هذا التعبير العربي الطبيعي بين المضارع اليوناني ودلالة Πάλαι على استمرار ظن المخاطَبين مدة من الزمن.
- source_word: ἀπολογούμεθα
  choice: ندافع عن أنفسنا
  rationale: يحفظ معنى الدفاع عن النفس أو تبريرها بعبارة عربية واضحة من غير مصطلح قضائي ثقيل.
- source_word: κατέναντι θεοῦ
  choice: أمام الله
  rationale: يفيد الكلام في حضرة الله وتحت نظره ومسؤوليته، وهو تعبير عربي موجز ورصين.
- source_word: ἐν Χριστῷ
  choice: في المسيح
  rationale: يحفظ الصيغة البولسية الدالة على الاتحاد بالمسيح أو نطاق العلاقة به، مع إبقاء لقب Χριστός ظاهرًا.
- source_word: λαλοῦμεν
  choice: نتكلم
  rationale: ينقل المضارع بصيغة عربية مباشرة وطبيعية.
- source_word: τὰ δὲ πάντα
  choice: وكل شيء
  rationale: يفيد مجموع ما يقوله بولس ويفعله في السياق، من غير تحويل العبارة إلى قاعدة كونية عامة؛ والواو تلائم قوة δέ الانتقالية الخفيفة.
- source_word: ἀγαπητοί
  choice: أيها الأحباء
  rationale: يحفظ النداء العاطفي وصلته اللفظية بالمحبة بأسلوب عربي كتابي مفهوم.
- source_word: ὑπὲρ τῆς ὑμῶν οἰκοδομῆς
  choice: لأجل بنيانكم
  rationale: يحفظ استعارة البناء التي تدل على التقوية والنمو الروحي، بدل استبدالها بتفسير مباشر.
theological_decisions:
- issue: دلالة ἐν Χριστῷ
  choice: في المسيح
  alternative: بالمسيح / في اتحادنا بالمسيح
  rationale: العبارة اليونانية موجزة وقد تشمل نطاق العلاقة بالمسيح أو الاتحاد به؛ لذلك أُبقيت الصيغة الحرفية المألوفة من غير حصرها في تفسير واحد.
- issue: مرجع «كل شيء» وغايته
  choice: وكل شيء ... هو لأجل بنيانكم
  alternative: وكل ما نفعله هو لأجل تقويتكم
  rationale: حُفظ اتساع τὰ πάντα واستعارة οἰκοδομή، ولم تُقيَّد العبارة بالأقوال أو الأفعال وحدها لأن النص لا يصرح بذلك.
translation_notes:
  register: العربية فصحى حديثة واضحة ورصينة. استُخدم «أيها الأحباء» للمحافظة على حرارة النداء، و«بنيانكم» للإبقاء على الاستعارة الأصلية مع تجنب الشرح المذهبي الزائد.
