lexical_decisions:
- source_word: οἶδα
  choice: أعرف
  rationale: المقابل العربي الطبيعي للدلالة على المعرفة هنا، وقد حوفظ على تكراره في «لا أعرف» و«الله يعرف» لإبراز المقابلة البلاغية.
- source_word: τὸν τοιοῦτον ἄνθρωπον
  choice: إنسانًا كهذا
  rationale: يحفظ الإفراد وصيغة التذكير والإشارة غير المباشرة إلى الشخص المذكور في السياق السابق، من غير التصريح بأنه بولس.
- source_word: εἴτε ... εἴτε
  choice: أ... أم
  rationale: صياغة عربية طبيعية لعرض احتمالين بديلين بعد معنى عدم اليقين.
- source_word: ἐν σώματι
  choice: في الجسد
  rationale: ترجمة مباشرة وطبيعية تحافظ على مقابلة العبارة التالية.
- source_word: χωρὶς τοῦ σώματος
  choice: خارج الجسد
  rationale: تنقل معنى الانفصال الذي تفيده χωρίς بوضوح، من غير الجزم بطبيعة الاختبار أو تفسيره ميتافيزيقيًا.
- source_word: οὐκ οἶδα, ὁ θεὸς οἶδεν
  choice: لا أعرف؛ الله يعرف
  rationale: تحافظ على التقابل الصريح بين عدم معرفة بولس ومعرفة الله، وتبرز الوقفة البلاغية بالفاصلة المنقوطة.
- source_word: θεὸς
  choice: الله
  rationale: المقابل العربي المعياري الواضح.
theological_decisions:
- issue: إشارة بولس غير المباشرة إلى نفسه وطبيعة الاختبار
  choice: الإبقاء على «إنسانًا كهذا» وعدم تحديد ما إذا كان الاختبار جسديًا أم خارج الجسد
  alternative: التصريح بأن الإنسان هو بولس، أو صياغة النص بما يحسم أنه اختبار خروج من الجسد
  rationale: النص اليوناني يحافظ على مسافة بلاغية ويترك طبيعة الاختبار غير محسومة؛ لذلك تحفظ الترجمة هذا الغموض والتوتر بدل تفسيرهما.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعملت «أفي الجسد كان أم خارج الجسد» لتكون طبيعية في العربية مع الحفاظ على الاحتمالين، وأُبقيت الشرطتان لتعكسا الاعتراض البلاغي في الأصل.
