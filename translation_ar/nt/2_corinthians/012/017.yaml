  text: Did I exploit you through any of those whom I sent to you?[a]
translation:
  language: ar
  text: أفهل استغللتكم بواسطة أحدٍ ممن أرسلتهم إليكم؟[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «انتفعت على حسابكم» أو «غششتكم». يفيد الفعل اليوناني تحقيق مكسب على حساب شخص آخر.
    reason: lexical_alternative
lexical_decisions:
- source_word: μή
  choice: أفهل ...؟
  rationale: تُدخل سؤالًا بلاغيًا يُنتظر أن تكون إجابته بالنفي؛ وصيغة «أفهل» تنقل ذلك بوضوح وطبيعية في العربية.
- source_word: τινα ὧν
  choice: أحدٍ ممن
  rationale: تحفظ الدلالة التبعيضية، أي أيَّ شخص من جماعة الذين أرسلهم بولس.
- source_word: ἀπέσταλκα
  choice: أرسلتهم
  rationale: المقصود الأشخاص الذين سبق أن أوفدهم بولس إلى المخاطَبين، والماضي العربي طبيعي وواضح هنا.
- source_word: πρὸς ὑμᾶς
  choice: إليكم
  rationale: المقابل الاتجاهي العربي المعتاد في هذا السياق.
- source_word: δι’ αὐτοῦ
  choice: بواسطة أحدٍ ممن أرسلتهم
  rationale: الضمير اليوناني مفرد، ويعود توزيعيًا إلى الشخص المفترض من الجماعة المذكورة؛ وتكرار المعنى ضمن العبارة العربية يزيل التباس مرجع الضمير من غير تغيير المقصود.
- source_word: ἐπλεονέκτησα
  choice: استغللتكم
  rationale: ينقل معنى تحصيل منفعة على حساب الآخرين، مع بقاء البديلين «انتفعت على حسابكم» و«غششتكم» ممكنين بحسب درجة التركيز المالي.
- source_word: ὑμᾶς
  choice: كم في استغللتكم
  rationale: ضمير جمع في موضع المفعول به، يشير إلى المؤمنين في كورنثوس.
