  text: τί γάρ ἐστιν ὃ ⸀ἡσσώθητε ὑπὲρ τὰς λοιπὰς ἐκκλησίας, εἰ μὴ ὅτι αὐτὸς ἐγὼ οὐ κατενάρκησα ὑμῶν; χαρίσασθέ μοι τὴν ἀδικίαν ταύτην.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/013.yaml
  text: For in what were you treated as inferior to the rest of the churches[c][b][a], except that I myself did not become a burden to you? Forgive me this wrong.
translation:
  language: ar
  text: ففي أيِّ شيء وُضعتم في منزلة أدنى من سائر الكنائس[a]، إلا أنني أنا نفسي لم أكن عبئًا عليكم[b]؟ سامحوني على هذا الظلم[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «جُعلتم دون سائر الكنائس». يمكن أن يدل الفعل اليوناني على وضع المرء في منزلة أدنى أو على إلحاق الضرر به.'
    reason: lexical_alternative
  - marker: b
    text: أي إن بولس لم يحمّلهم عبء نفقاته بقبول إعالة مالية منهم.
    reason: cultural_note
  - marker: c
    text: يتكلم بولس هنا بتهكم؛ فالـ«ظلم» المزعوم هو أنه رفض أن يكون عبئًا عليهم.
    reason: rhetorical_note
lexical_decisions:
- source_word: τί γάρ ἐστιν ὃ
  choice: ففي أيِّ شيء
  rationale: صياغة عربية طبيعية لسؤال بلاغي عن الناحية التي لحقهم فيها انتقاص، مع إبقاء الصلة التعليلية بالسياق السابق بواسطة الفاء.
- source_word: ἡσσώθητε
  choice: عُومِلتم معاملةً أدنى
  rationale: تحفظ صيغة المبني للمجهول ومعنى الوضع في منزلة أدنى أو التعرض للانتقاص، من غير أن توحي بأنهم أدنى في ذواتهم.
- source_word: ὑπὲρ τὰς λοιπὰς ἐκκλησίας
  choice: من سائر الكنائس
  rationale: تفيد «من» المقارنة هنا، وتنقل «سائر» معنى الكنائس الأخرى أو الباقية بعبارة عربية واضحة.
- source_word: αὐτὸς ἐγὼ
  choice: أنا نفسي
  rationale: تحفظ التوكيد المزدوج في اليونانية وتبرز البعد الشخصي في دفاع بولس.
- source_word: οὐ κατενάρκησα ὑμῶν
  choice: لم أكن عبئًا عليكم
  rationale: تنقل المعنى السياقي للفعل، وهو عدم تحميلهم نفقة إعالته، بصياغة عربية طبيعية من غير إدخال التفصيل المالي في صلب النص.
- source_word: χαρίσασθέ μοι
  choice: سامحوني
  rationale: الفعل هنا طلب للمغفرة أو الصفح، وتأتي صيغة الجمع موافقة للمخاطَبين وتبقي النبرة التهكمية للسياق.
- source_word: τὴν ἀδικίαν ταύτην
  choice: هذا الظلم
  rationale: «الظلم» مقابل مباشر لـἀδικία، ويحافظ على حدة العبارة التي تُظهر المفارقة بدل تخفيفها إلى مجرد إساءة.
theological_decisions:
- issue: تهكم بولس في دفاعه عن رفض الدعم المالي
  choice: 'إبقاء العبارة مباشرة: «سامحوني على هذا الظلم» مع شرح التهكم في الحاشية.'
  alternative: التصريح في المتن بأنه يتكلم ساخرًا، أو إضافة وصف مثل «الظلم الفادح».
  rationale: ينشأ التهكم من السياق ومن تسمية امتناعه عن إثقالهم «ظلمًا»؛ لذلك لا ينبغي إدخال تفسير زائد في المتن.
- issue: طبيعة انتقاص أهل كورنثوس مقارنة بالكنائس الأخرى
  choice: «عُومِلتم معاملةً أدنى»
  alternative: «كنتم أدنى» أو «جُعلتم أدنى».
  rationale: هذه الصياغة تحفظ احتمال التعرض لوضع غير مواتٍ أو لمعاملة أقل، ولا تنسب إليهم دونية ذاتية.
translation_notes:
  register: لغة عربية فصحى معاصرة واضحة ووقورة. استُخدم المبني للمجهول في «عُومِلتم» لصون بنية المصدر، وحُفظ توكيد «أنا نفسي» والمفارقة البلاغية في خاتمة الآية من غير توسيع تفسيري داخل المتن.
