  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: μὴ πάλιν ⸂ἐλθόντος μου⸃ ⸀ταπεινώσῃ ⸀με ὁ θεός μου πρὸς ὑμᾶς, καὶ πενθήσω πολλοὺς τῶν προημαρτηκότων καὶ μὴ μετανοησάντων ἐπὶ τῇ ἀκαθαρσίᾳ καὶ πορνείᾳ καὶ ἀσελγείᾳ ᾗ ἔπραξαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/021.yaml
  text: I fear that when I come again[a], my God may humble me before you[d][c][b], and I will mourn over many who have sinned before and have not repented of the impurity and sexual immorality and sensuality that they practiced.
translation:
  language: ar
  text: أخشى أن يذلّني إلهي عندكم حين آتي مرة أخرى[a]، وأن أحزن على كثيرين ممن سبق أن أخطأوا ولم يتوبوا عن النجاسة والفجور الجنسي والانحلال التي اقترفوها.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: عند عودتي إليكم. وتستأنف هذه العبارة مضمون الخوف المذكور في الآية السابقة؛ ويمكن صياغتها أيضًا: «أخشى لئلا يذلّني إلهي عندكم حين آتي مرة أخرى».'
    reason: syntactic_clarity
lexical_decisions:
- source_word: μὴ πάλιν ἐλθόντος μου
  choice: أخشى ... حين آتي مرة أخرى
  rationale: تستأنف μή مضمون الخوف الوارد في الآية السابقة، ولذلك صُرّح بالفعل «أخشى» في العربية، وجُعل مجيء بولس ظرفًا زمنيًا طبيعيًا.
- source_word: ταπεινώσῃ με ὁ θεός μου πρὸς ὑμᾶς
  choice: يذلّني إلهي عندكم
  rationale: يفيد ταπεινόω الخفض والإذلال في هذا السياق، و«عندكم» تحفظ احتمال وقوع ذلك في حضورهم أو بينهم دون حصر πρός في معنى واحد ضيق.
- source_word: πενθήσω
  choice: أن أنوح
  rationale: ينقل «أنوح» شدة الحزن التي يدل عليها πενθέω، لا مجرد الأسف العابر.
- source_word: πολλοὺς τῶν προημαρτηκότων
  choice: كثيرين ممن سبق أن أخطأوا
  rationale: يحفظ التركيب الجزئي «كثيرين ممن»، كما تنقل «سبق أن أخطأوا» دلالة الفعل السابق ذي الصلة المستمرة بالحاضر.
- source_word: μὴ μετανοησάντων
  choice: لم يتوبوا
  rationale: صياغة عربية واضحة تدل في السياق على بقائهم بلا توبة إلى وقت الزيارة المتوقعة.
- source_word: ἀκαθαρσίᾳ
  choice: النجاسة
  rationale: لفظ عربي راسخ ومفهوم للنجاسة الأخلاقية، مع بقاء اللفظ واسع الدلالة.
- source_word: πορνείᾳ
  choice: الفجور
  rationale: ينقل الفجور الجنسي الذي تدل عليه πορνεία بعبارة عربية طبيعية، مع تجنب تضييقه على صورة واحدة من السلوك الجنسي.
- source_word: ἀσελγείᾳ
  choice: الانحلال
  rationale: يعبر عن السلوك الوقح المنفلت من القيود الذي تدل عليه ἀσέλγεια، وهو هنا ذو إيحاء جنسي في سياق قائمة الرذائل.
- source_word: ᾗ ἔπραξαν
  choice: اللذين مارسوهما
  rationale: يعود الضمير اليوناني المفرد إلى مجموعة الرذائل باعتبارها وحدة، أما العربية فتقتضي المطابقة مع الأقرب؛ لذلك يعود المثنى إلى «الفجور والانحلال»، مع بيان في الحاشية لاحتمال شمول النجاسة أيضًا.
theological_decisions:
- issue: صلة μή بفعل الخوف في الآية السابقة
  choice: التصريح بـ«أخشى» في أول الجملة
  alternative: «لئلا، حين آتي مرة أخرى...»
  rationale: اليونانية تعتمد على «أخاف» في 12:20، لكن التصريح به يجعل الآية مستقلة ومفهومة بالعربية من غير تغيير مضمون الخوف.
- issue: دلالة إذلال الله لبولس أمام أهل كورنثوس
  choice: «يذلّني إلهي عندكم»
  alternative: «يضعني إلهي عندكم» أو «يخفضني إلهي بينكم»
  rationale: يحفظ الاختيار شدة ταπεινόω واحتمال الإذلال أو الخفض، من غير أن ينسب إلى بولس فضيلة التواضع الاختياري.
- issue: تمييز ألفاظ الرذائل الثلاثة
  choice: «النجاسة والفجور والانحلال»
  alternative: «الدنس والزنى والتهتك»
  rationale: أُبقيت الألفاظ الثلاثة متميزة ومتراكمة، من غير اختزالها في خطيئة واحدة أو فرض تعريف مذهبي أضيق من اليونانية.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ووقورة. استُخدم «أن أنوح» بالتوازي مع «أن يذلّني» لأن الفعلين متعلقان بالخوف المستفاد من السياق، وحُفظت قوة قائمة الرذائل دون ألفاظ قديمة غامضة.
