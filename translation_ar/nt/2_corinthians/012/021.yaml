  to: أخشى أن يذلّني إلهي عندكم حين آتي مرة أخرى[a]، وأن أحزن على كثيرين ممن سبق أن أخطأوا ولم يتوبوا عن النجاسة والفجور الجنسي والانحلال التي اقترفوها.
  rationale: صُحّح الموصول والضمير في ختام الآية ليشملا الرذائل الثلاث جميعًا، كما يقتضي الأصل اليوناني، ولذلك لم تعد حاشية الغموض النحوي لازمة. واستُبدلت «أنوح» بـ«أحزن» لصياغة عربية معاصرة أكثر سلاسة، وأُضيفت «الجنسي» إلى «الفجور» لتوضيح πορνεία مع إبقاء تمايز عناصر القائمة.
