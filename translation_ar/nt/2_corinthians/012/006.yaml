  text: ἐὰν γὰρ θελήσω καυχήσασθαι, οὐκ ἔσομαι ἄφρων, ἀλήθειαν γὰρ ἐρῶ· φείδομαι δέ, μή τις εἰς ἐμὲ λογίσηται ὑπὲρ ὃ βλέπει με ἢ ἀκούει ⸀τι ἐξ ἐμοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/006.yaml
  text: For if I should want to boast[a], I would not be foolish, for I would be speaking the truth. But I refrain, so that no one may reckon me above what he sees in me or hears from me.
translation:
  language: ar
  text: فإن أردتُ أن أفتخر، فلن أكون أحمق، لأني سأقول الحق. لكنني أتحفّظ، لئلا يقدّرني أحد بأكثر مما يراه فيّ أو يسمع شيئًا مني.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θελήσω
  choice: أردتُ
  rationale: جاء الفعل في تركيب شرطي محتمل مع ἐὰν؛ وصيغة «لو أردتُ» تنقل الاحتمال المفترض بأسلوب عربي طبيعي.
- source_word: καυχήσασθαι
  choice: أن أفتخر
  rationale: ينقل معنى التفاخر أو الافتخار في سياق حديث بولس المتحفظ عن نفسه، مع إبقاء النبرة السياقية دون تحميل اللفظ حكمًا زائدًا.
- source_word: ἄφρων
  choice: جاهلًا
  rationale: «جاهل» مقابل عربي مألوف لـἄφρων في هذا السياق، ويحافظ على صلة العبارة بموضوع «الجهالة» المتكرر في هذا القسم.
- source_word: ἀλήθειαν ... ἐρῶ
  choice: أقول الحق
  rationale: ترجمة مباشرة وموجزة للمفعول ἀλήθειαν والفعل المستقبلي ἐρῶ، ويُفهم زمنه هنا ضمن نتيجة الشرط.
- source_word: φείδομαι
  choice: أمتنع
  rationale: يدل الفعل هنا على أن بولس يكفّ نفسه ويمتنع عن مزيد من الافتخار.
- source_word: λογίσηται
  choice: يحسبني
  rationale: يحافظ «يحسب» على معنى التقدير والتقويم في λογίζομαι، وهو طبيعي مع عبارة «فوق ما».
- source_word: ὑπὲρ ὃ
  choice: فوق ما
  rationale: تنقل معنى تجاوز الحد أو المعيار الذي تدل عليه ὑπέρ.
- source_word: βλέπει με
  choice: يراني عليه
  rationale: تفيد العبارة أن تقدير بولس ينبغي أن يقوم على ما يُرى منه بالفعل، وصياغة «ما يراني عليه» عربية طبيعية.
- source_word: ἀκούει τι ἐξ ἐμοῦ
  choice: يسمعه مني
  rationale: أُظهر العنصر النكرة τι بضمير المفعول «ـه» العائد إلى «ما»، مع نقل ἐξ ἐμοῦ بمعنى ما يصدر من بولس ويُسمع منه.
theological_decisions:
- issue: وصف بولس لنفسه وامتناعه عن الافتخار
  choice: 'صيغ الكلام بوصفه افتراضًا: إن افتخر بولس فلن يكون جاهلًا لأنه يقول الحق، لكنه مع ذلك يمتنع لئلا يبالغ الناس في تقديره.'
  alternative: صياغة توحي بأن افتخار بولس محمود في ذاته، أو بأن كل افتخار هنا كاذب أو خاطئ بالضرورة.
  rationale: النص يجمع بين صدق ما كان يمكن أن يقوله بولس وبين امتناعه الطوعي عن قوله؛ لذلك حُفظ هذا التوتر دون تقرير حكم عقائدي أوسع بشأن الافتخار.
translation_notes:
  register: عربية فصحى واضحة ورصينة، مع بنية شرطية طبيعية وألفاظ مألوفة. وُضع مؤشر الحاشية [a] في المتن كما يلزم.
