revisions:
- from: فلو أردتُ أن أفتخر، لما كنتُ جاهلًا، لأني أقول الحق. لكنني أمتنع، لئلا يحسبني أحد فوق ما يراني عليه أو يسمعه مني.[a]
  to: فإن أردتُ أن أفتخر، فلن أكون أحمق، لأني سأقول الحق. لكنني أتحفّظ، لئلا يقدّرني أحد بأكثر مما يراه فيّ أو يسمع شيئًا مني.
  rationale: صُححت الدلالة الأساسية لـἄφρων إلى «أحمق»، واستُخدمت صياغة شرطية مستقبلية واضحة. وأُثبتت τι في المتن بعبارة عربية سليمة، فحُذفت الحاشية لأنها لم تعد تؤدي وظيفة لازمة. ولا يضيف النص أي حكم عقائدي على الافتخار.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:27:19Z'
review_pass:
  verdict: revise
  source_fidelity: يلزم تعديل «جاهلًا» لأنه يدل أساسًا على عدم المعرفة، في حين أن ἄφρων تعني «أحمق/غير عاقل». كما أن صياغة الشرط والنتيجة بالمستقبل («فإن أردت... فلن أكون») تنقل بوضوح افتراض ἐὰν مع الفعل المستقبلي ἐρῶ. ويُدرج τι صراحةً في «يسمع شيئًا مني»، فلا تعود الحاشية لازمة.
  naturalness: النص المقترح فصيح واضح وطبيعي. و«يقدّرني أحد بأكثر مما يراه فيّ أو يسمع شيئًا مني» تؤدي معنى التقويم المقصود في λογίσηται وتربط بوضوح بين ما يُرى وما يُسمع.
  terminology: «أفتخر» مناسبة لـκαυχήσασθαι في السياق، و«أحمق» أدق من «جاهل» لـἄφρων. و«أتحفّظ» تؤدي معنى φείδομαι هنا، أي الامتناع المقصود عن المضي في الافتخار.
  issues:
  - severity: high
    issue: ترجمة ἄφρων بـ«جاهلًا».
    rationale: «جاهل» تعني عادةً غير العارف أو غير المتعلم، بينما المعنى في اليونانية هو الأحمق أو غير العاقل؛ وهذا فرق دلالي مؤثر في حجة بولس.
  - severity: medium
    issue: إخفاء العنصر النكرة τι في المتن مع حاشية تصفه.
    rationale: يمكن إظهاره طبيعيًا في العربية بعبارة «يسمع شيئًا مني»، وهي أوفى بالمصدر ولا تحتاج إلى حاشية بديلة.
  - severity: low
    issue: «فلو أردتُ... لما كنتُ... لأني أقول» أقل اتساقًا في تمثيل البناء الافتراضي المستقبلي.
    rationale: «فإن أردت... فلن أكون... سأقول» تبين بصورة أوضح علاقة الشرط بالنتيجة في اليونانية.
  revised_text: فإن أردتُ أن أفتخر، فلن أكون أحمق، لأني سأقول الحق. لكنني أتحفّظ، لئلا يقدّرني أحد بأكثر مما يراه فيّ أو يسمع شيئًا مني.
