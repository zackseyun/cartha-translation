- from: 'وقد قال لي: «تكفيك نعمتي، لأن القوة تبلغ كمالها في الضعف»[a]. لذلك سأفتخر بالأحرى، بكل سرور، بمواطن ضعفي، لكي تحلّ عليّ قوة المسيح[b][c].'
  to: 'وقد قال لي: «تكفيك نعمتي، لأن القوة تبلغ كمالها في الضعف»[a]. لذلك سأفتخر، وبسرور أعظم، بمواطن ضعفي، لكي تحلّ عليّ قوة المسيح[b][c].'
  rationale: 'التعديل محدود وآمن: استبدلتُ التركيب الظرفي الأقل سلاسة بتعبير عربي طبيعي يحفظ معنى الافتخار «بسرور أعظم»، وصححت صياغة البديل في الحاشية إلى «تكتمل». ولم يُغيَّر معنى الآية أو التوتر المقصود في عبارة اكتمال القوة في الضعف.'
