reference: 2 Corinthians 12:9
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ εἴρηκέν μοι· Ἀρκεῖ σοι ἡ χάρις μου· ἡ γὰρ ⸀δύναμις ἐν ἀσθενείᾳ ⸀τελεῖται. ἥδιστα οὖν μᾶλλον καυχήσομαι ἐν ταῖς ἀσθενείαις ⸀μου, ἵνα ἐπισκηνώσῃ ἐπ’ ἐμὲ ἡ δύναμις τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/009.yaml
  text: And he has said to me[a], “My grace is sufficient for you, for my power is made perfect in weakness.” Therefore I will boast all the more gladly in my weaknesses[d][c][b], so that the power of Messiah may dwell upon me.
translation:
  language: ar
  text: 'وقد قال لي: «تكفيك نعمتي، لأن القوة تبلغ كمالها في الضعف»[a]. لذلك سأفتخر، وبسرور أعظم، بمواطن ضعفي، لكي تحلّ عليّ قوة المسيح[b][c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'وترد أيضًا: «لأن قوتي تكتمل في الضعف».'
    reason: تثبت صياغة بديلة تضيف ضمير الملكية وتستعمل المقابل التقليدي للفعل τελεῖται.
  - marker: b
    text: 'يمكن ترجمة «تحلّ عليّ» أيضًا: «تستقرّ عليّ»؛ وحرفيًا: «تخيّم عليّ».'
    reason: يحفظ البديل الدلالي والصورة الحرفية للفعل ἐπισκηνόω.
  - marker: c
    text: «المسيح» لقب معناه «الممسوح».
    reason: يوضح الدلالة اللقبية للكلمة اليونانية Χριστός من غير استبدالها باسم مجرد.
lexical_decisions:
- source_word: εἴρηκέν
  choice: وقد قال
  rationale: ينقل الفعل التام قولًا وقع في الماضي وما زال نافذًا وذا صلة بالحاضر، وتؤدي «قد» هذا المعنى طبيعيًا في العربية.
- source_word: Ἀρκεῖ σοι ἡ χάρις μου
  choice: تكفيك نعمتي
  rationale: صياغة عربية موجزة وطبيعية تحفظ معنى الكفاية وترتيب التركيز في العبارة اليونانية.
- source_word: ἡ ... δύναμις
  choice: القوة
  rationale: النص اليوناني المعروض في SBLGNT لا يثبت ضمير الملكية هنا، لذلك لم تُضف «قوتي» إلى المتن، مع إثباتها احتمالًا في الحاشية.
- source_word: ἐν ἀσθενείᾳ τελεῖται
  choice: تبلغ كمالها في الضعف
  rationale: تحفظ دلالة بلوغ الغاية أو التمام، من غير أن توحي بأن القوة كانت معيبة أخلاقيًا أو ناقصة في ذاتها.
- source_word: ἥδιστα οὖν μᾶλλον καυχήσομαι
  choice: لذلك سأفتخر بالأحرى، بكل سرور
  rationale: «بالأحرى» تنقل المقارنة في μᾶλλον، و«بكل سرور» تنقل شدة ἥδιστα بصياغة عربية واضحة غير متكلفة.
- source_word: ἐν ταῖς ἀσθενείαις μου
  choice: بمواطن ضعفي
  rationale: ينقل الجمع بوصفه حالات أو نواحي ضعف ملموسة، ويتجنب «ضعفاتي» غير المألوفة في العربية العامة.
- source_word: ἐπισκηνώσῃ ἐπ’ ἐμέ
  choice: تحلّ عليّ
  rationale: صياغة عربية طبيعية تحفظ معنى حلول القوة على بولس، بينما تُذكر صورة نصب الخيمة الأكثر حرفية في الحاشية.
- source_word: Χριστοῦ
  choice: المسيح
  rationale: «المسيح» المقابل العربي الراسخ للقب Χριστός، ويحفظ وظيفته اللقبية في هذا السياق.
theological_decisions:
- issue: وجود ضمير الملكية مع δύναμις
  choice: لأن القوة تبلغ كمالها في الضعف
  alternative: لأن قوتي تبلغ كمالها في الضعف
  rationale: النص اليوناني المعروض لا يتضمن μου بعد δύναμις؛ لذا لم يُضف الضمير في المتن، مع إبقاء القراءة/الصياغة المألوفة في الحاشية حفاظًا على موضع الاختلاف.
- issue: دلالة τελεῖται في وصف القوة
  choice: تبلغ كمالها
  alternative: تَكمُل / تُستكمَل
  rationale: تُبقي العبارة على التوتر اللاهوتي في اكتمال ظهور القوة في الضعف، من غير تفسير زائد أو إيحاء بوجود عيب سابق في القوة.
- issue: الصورة في ἐπισκηνώσῃ
  choice: تحلّ عليّ
  alternative: تخيّم عليّ
  rationale: المتن واضح وطبيعي، والحاشية تحفظ الصورة المجازية الحرفية المرتبطة بالخيمة من غير فرض تفسير عقائدي عليها.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. حُفظ التقابل بين «القوة» و«الضعف»، وبين المبدأ العام في المفرد وحالات ضعف بولس المتعددة. وُضعت جميع علامات الحواشي في المتن.
