    issue: استعمال «بل» لترجمة δέ.
    rationale: يفيد δέ هنا مقابلة، لا إبطالًا أو تصحيحًا حادًا بالضرورة؛ و«لكن» أقرب إلى وظيفته وألطف في السياق.
  - severity: medium
    issue: ثقل تركيب «أنتم في ضيق في عواطفكم».
    rationale: تكرار «في» يجعل العبارة أقل سلاسة في الفصحى المعاصرة. صيغة «متضيّقون في عواطفكم» تحافظ على المجاز والتوازي بصورة أوضح.
  - severity: low
    issue: الحاشية البديلة غير طبيعية عربيًا.
    rationale: «مقيّدين فينا» ترجمة حرفية مضللة نسبيًا للتركيب ولا تصلح بديلًا عربيًا واضحًا؛ يمكن حذف الحاشية من دون فقد معنى لازم.
