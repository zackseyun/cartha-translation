  text: لستم في ضيقٍ من جهتنا، لكنكم متضيّقون في عواطفكم.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στενοχωρεῖσθε
  choice: في ضيق
  rationale: الفعل يصوّر وجود المرء في موضع ضيق، ويُستعمل هنا مجازيًا للدلالة على الانحصار أو التقييد العاطفي. وحُفظ التعبير نفسه في الجملتين لإبراز المقابلة البلاغية.
- source_word: ἐν ἡμῖν
  choice: من جهتنا
  rationale: تفيد العبارة أن الضيق لا يأتي من بولس ورفقائه. و«من جهتنا» عربية طبيعية تحافظ على الصلة بالتركيب اليوناني من غير أن توهم معنى مكانيًا.
- source_word: δὲ
  choice: بل
  rationale: تُظهر «بل» التصحيح والمقابلة الحادة بين نفي مصدر الضيق عن بولس وإثبات موضعه في داخل المخاطَبين.
- source_word: ἐν τοῖς σπλάγχνοις ὑμῶν
  choice: في عواطفكم
  rationale: تشير σπλάγχνα حرفيًا إلى الأحشاء، ومجازيًا إلى المشاعر الداخلية العميقة. «عواطفكم» تنقل المعنى الوجداني بوضوح مع إبقاء صورة الداخل بواسطة «في».
- source_word: οὐ
  choice: لستم
  rationale: نفي مباشر للجملة الأولى، صيغ مع الخبر الاسمي العربي صياغة طبيعية.
theological_decisions:
- issue: المعنى المجازي لكلمة σπλάγχνα
  choice: عواطف المخاطَبين ومشاعرهم الداخلية
  alternative: أحشاؤهم حرفيًا، أو قلوبهم
  rationale: السياق علائقي ووجداني، ويقابل بين سعة قلب بولس والضيق في استجابة الكورنثيين. لذلك ينقل المعنى المجازي المقصود من غير حصره في التفكير الذهني.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حافظت الصياغة على تكرار صورة الضيق في شطري الآية وعلى المقابلة بين «من جهتنا» و«في عواطفكم»، من غير إضافة تفسير مذهبي.
