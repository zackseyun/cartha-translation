  verdict: revise
  source_fidelity: 'ينقل النص المقابلة الأساسية في اليونانية: الضيق ليس ناشئًا من جهة بولس ورفقائه، بل يقع في المجال الوجداني الداخلي لدى المخاطَبين. ويحافظ التعديل على تكرار صورة الضيق في الشطرين.'
  naturalness: عبارة «بل» أقوى من دلالة δέ الاعتراضية/المقابِلة في هذا الموضع؛ فـ«لكن» أدق وأيسر في العربية المعاصرة. أما البناء «في ضيق في عواطفكم» فمفهوم، لكنه ثقيل بسبب تتابع حرف الجر؛ لذلك صيغت الجملة الثانية بصيغة فعلية عربية طبيعية مع بقاء الصورة المجازية.
  terminology: «متضيّقون» ينقل فعل στενοχωρεῖσθε وصورة الانحصار دون حصر المعنى في تقييد خارجي. و«عواطفكم» مناسبة لـσπλάγχνα في السياق الوجداني، ولا تضيف تفسيرًا مذهبيًا. لا تستلزم الآية حاشية؛ والبديل الحرفي المقترح في المسودة («مقيّدين فينا») غير سليم الأسلوب عربيًا ولا يقدم فائدة تفسيرية كافية.
  issues:
