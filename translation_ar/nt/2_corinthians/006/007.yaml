lexical_decisions:
- source_word: ἐν λόγῳ ἀληθείας
  choice: في كلمة الحق
  rationale: يحافظ على صورة الأصل وإيقاع عبارات ἐν المتتابعة، ويترك «كلمة» محتملةً لمعنى القول أو الرسالة، بدل حصرها في «الكلام الصادق».
- source_word: ἐν δυνάμει θεοῦ
  choice: وفي قوة الله
  rationale: نقل مباشر وطبيعي لتركيب الإضافة، مع إبراز أن القوة لله والمحافظة على التوازي مع العبارة السابقة.
- source_word: διὰ τῶν ὅπλων
  choice: وبأسلحة
  rationale: الباء تؤدي معنى الوسيلة الذي تحمله διά مع المضاف إليه، و«أسلحة» أوسع من «دروع» لأنها قد تشمل أدوات الهجوم والدفاع.
- source_word: τῆς δικαιοσύνης
  choice: البر
  rationale: «البر» هو المقابل العربي المألوف والواسع لـ δικαιοσύνη في السياق البولسي، مع إبقاء «العدل» احتمالًا معجميًا في الحاشية.
- source_word: τῶν δεξιῶν καὶ ἀριστερῶν
  choice: في اليد اليمنى وفي اليسرى
  rationale: تستكمل العربية الاسم المفهوم من الصفتين اليونانيتين، وتعرض صورة حمل السلاح بكلتا اليدين دون تحديد قاطع لوظيفة كل منهما.
theological_decisions:
- issue: دلالة δικαιοσύνη في العبارة البولسية
  choice: البر
  alternative: العدل
  rationale: يحفظ «البر» المجال الأخلاقي واللاهوتي الواسع للمصطلح، بينما تُذكر دلالة «العدل» في الحاشية من غير فرض تفسير أضيق على النص.
- issue: صورة أسلحة اليمين واليسار
  choice: في اليد اليمنى وفي اليسرى
  alternative: عن اليمين وعن اليسار
  rationale: يرجح السياق صورة أسلحة ممسوكة أو مستعملة بكلتا اليدين، لكن الأصل موجز ولا يذكر «اليد» صراحة؛ لذلك تُحفظ الصياغة المكانية البديلة في الحاشية.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة وموقرة. حُفظ توازي العبارتين المبدوءتين بـ«في»، واستُعملت الباء لمعنى الوسيلة في διά. أُثبتت «اليد» في الموضع الأول وحُذفت في الثاني حذفًا عربيًا طبيعيًا، مع إبقاء إيجاز الصورة الأصلية واحتمالها في الحاشية.
