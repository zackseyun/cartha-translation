lexical_decisions:
- source_word: στόμα
  choice: فمنا
  rationale: يحفظ الصورة الجسدية في اليونانية والتوازي البلاغي بين الفم والقلب، مع أن المقصود هو الكلام بصراحة.
- source_word: ἀνέῳγεν
  choice: قد انفتح
  rationale: ينقل صورة الانفتاح، وتفيد «قد» مع الماضي الحالة الحاضرة الناتجة من فعل سابق، بما يلائم صيغة التام اليونانية.
- source_word: πρὸς ὑμᾶς
  choice: لكم
  rationale: تعبير عربي طبيعي عن توجيه الكلام إلى المخاطَبين، من غير إثقال العبارة بحرفية «نحوكم».
- source_word: Κορίνθιοι
  choice: يا أهل كورنثوس
  rationale: ينقل النداء المباشر بصياغة عربية واضحة وطبيعية، بدل النسبة التي قد تبدو أقل سلاسة في النداء.
- source_word: καρδία
  choice: قلبنا
  rationale: يحفظ الاستعارة الأصلية ويعبّر بوضوح عن موضع المحبة والعاطفة والانفتاح الداخلي.
- source_word: πεπλάτυνται
  choice: اتّسع
  rationale: يحفظ معنى التوسيع والاستعارة المكانية في الأصل. والسياق مع «قد انفتح» يجعل الحالة الناتجة مفهومة، من غير صياغة مبنية للمجهول ثقيلة في العربية.
theological_decisions:
- issue: اللغة المجازية الدالة على صراحة بولس وسعة محبته
  choice: الإبقاء على صورتي الفم المنفتح والقلب المتّسع في المتن.
  alternative: لقد صارحناكم يا أهل كورنثوس، وفتحنا لكم قلوبنا على اتساعها.
  rationale: يحافظ هذا على توتر الصورة البلاغية في النص اليوناني ولا يستبدلها بتفسير، مع توضيح المعنى الاصطلاحي في الحواشي.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. أُبقيت الاستعارتان الجسديتان في المتن، واستُخدم «يا أهل كورنثوس» للنداء الطبيعي. وُضعت علامتا الحاشية في موضعيهما من النص.
