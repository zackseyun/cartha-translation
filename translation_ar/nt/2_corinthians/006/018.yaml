  text: And I will be a Father to you[a], and you will be sons and daughters to me, says the Lord Almighty.
translation:
  language: ar
  text: «وأكون لكم أبًا[a]، وتكونون لي أبناءً وبناتٍ، يقول الرب القادر على كل شيء».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، مع إظهار الصياغة العلائقية في الأصل: «أكون أبًا لكم، وتكونون أبناءً وبناتٍ لي». يفيد التركيب اليوناني علاقة متبادلة في إطار العهد، وقد صيغت العبارة العربية بسلاسة مع الحفاظ على التوازي بين «لكم» و«لي».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσομαι
  choice: أكون
  rationale: صيغة المضارع العربية بعد واو العطف في سياق الوعد تنقل المستقبل اليوناني بوضوح وطبيعية، مع إبقاء فعل الكينونة صريحًا.
- source_word: ὑμῖν εἰς πατέρα
  choice: لكم أبًا
  rationale: يحافظ هذا التعبير على تركيب العهد العلائقي وعلى دلالة اللام، وهو عربي واضح وقريب من الصياغة اليونانية.
- source_word: ὑμεῖς ἔσεσθέ μοι
  choice: تكونون لي
  rationale: ينقل العلاقة المتبادلة ويحفظ التوازي المقصود مع «أكون لكم»؛ ودلالة ضمير المخاطبين الجمع ظاهرة في الفعل العربي.
- source_word: υἱοὺς καὶ θυγατέρας
  choice: بنين وبنات
  rationale: يذكر النص اليوناني الذكور والإناث صراحة، ولذلك لا تُختزل العبارة في «أولاد» أو «أبناء».
- source_word: λέγει
  choice: يقول
  rationale: يحفظ زمن المضارع في صيغة الاقتباس الكتابية ويعبّر عن سلطان القول واستمراره.
- source_word: κύριος
  choice: الرب
  rationale: هو المقابل العربي الطبيعي للقب الإلهي κύριος في هذا السياق.
- source_word: παντοκράτωρ
  choice: القادر على كل شيء
  rationale: صياغة عربية واضحة ومهيبة تنقل معنى القدرة والسيادة الشاملة دون استبدال اللفظ بلقب آخر مثل «رب الجنود».
theological_decisions:
- issue: التعبير عن علاقة البنوة مع ذكر الجنسين
  choice: بنين وبنات
  alternative: أولاد / أبناء
  rationale: يفرد الأصل اليوناني البنين والبنات بالذكر، وإبقاء الاثنين يصون شمول الوعد المعلن ولا يطمس إبراز البنات.
- issue: ترجمة اللقب الإلهي κύριος παντοκράτωρ
  choice: الرب القادر على كل شيء
  alternative: الرب القدير / الرب ضابط الكل
  rationale: الترجمة المختارة مفهومة في العربية المعاصرة وتحفظ دلالة παντοκράτωρ على القدرة والسيادة الشاملة، من غير إدخال لقب «رب الجنود» غير الوارد في النص اليوناني هنا.
- issue: طبيعة الصياغة العلائقية εἶναι ... εἰς
  choice: أكون لكم أبًا ... وتكونون لي بنين وبنات
  alternative: أكون أبًا لكم ... وتكونون أبنائي وبناتي
  rationale: تحفظ الصياغة المختارة التوازي والعلاقة العهدية في الأصل، ولا تحوّل الشطر الثاني إلى ضمير ملكية يزيل شيئًا من غرابة التركيب المقصودة.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. حُفظ التوازي بين «لكم» و«لي»، وذُكر «بنين وبنات» كما في الأصل، مع تجنب الألفاظ المذهبية أو الصيغ القديمة غير المألوفة.
