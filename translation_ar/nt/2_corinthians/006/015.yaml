  text: τίς δὲ συμφώνησις ⸀Χριστοῦ πρὸς Βελιάρ, ἢ τίς μερὶς πιστῷ μετὰ ἀπίστου;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/015.yaml
  text: And what harmony is there between Messiah and Beliar? Or what share does a believer have with an unbeliever?[a]
translation:
  language: ar
  text: وأيُّ انسجامٍ بين المسيح وبليار؟ وأيُّ نصيبٍ للمؤمن مع غير المؤمن؟[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'بليار: في اليونانية Βελιάρ؛ وتَرِد أيضًا الصيغة البديلة «بليعال».'
    reason: alternative_reading
lexical_decisions:
- source_word: συμφώνησις
  choice: انسجام
  rationale: يدل الاسم على التوافق والائتلاف؛ و«انسجام» يحافظ على الصورة العلائقية وعلى قوة التقابل البلاغي.
- source_word: Χριστοῦ
  choice: المسيح
  rationale: اللفظ هنا لقب ذو دلالة مسيانية في مقابلة اسم بليار، و«المسيح» هو المقابل العربي الطبيعي الراسخ.
- source_word: Βελιάρ
  choice: بليار
  rationale: اسم عَلَم، فنُقل صوتيًا بحسب الصيغة اليونانية الواردة، من غير إضافة تفسير إلى المتن.
- source_word: μερίς
  choice: نصيب
  rationale: يدل على الحصة أو الجزء المشترك؛ و«نصيب» عربي فصيح وطبيعي ينقل معنى المشاركة في شيء.
- source_word: πιστῷ
  choice: المؤمن
  rationale: صفة مستعملة استعمال الاسم، وتشير إلى شخص يتصف بالإيمان.
- source_word: ἀπίστου
  choice: غير المؤمن
  rationale: في التقابل مع πιστῷ، ينقل التعبير بوضوح معنى الشخص الذي لا يؤمن، من غير إيحاء أساسي بالخيانة أو عدم الأمانة.
- source_word: πρὸς
  choice: بين
  rationale: مع συμφώνησις تعبّر «بين ... و...» طبيعيًا عن العلاقة المتبادلة.
- source_word: μετὰ
  choice: مع
  rationale: تفيد المصاحبة أو المشاركة، و«مع» هي المقابل العربي الموجز الطبيعي.
- source_word: δὲ
  choice: و
  rationale: تواصل سلسلة الأسئلة البلاغية، فواو العطف تحافظ على التدفق الإضافي من غير تشديد معنى الاستدراك.
theological_decisions:
- issue: ترجمة Χριστός
  choice: المسيح
  alternative: كريستوس / المسيح بوصفه اسمًا محضًا
  rationale: يحمل اللفظ هنا قوة اللقب في مقابلة بليار؛ وتحافظ «المسيح» على دلالته دون تحويله إلى مجرد نقل صوتي.
- issue: هوية Βελιάρ وصيغته
  choice: بليار بوصفه اسم عَلَم للطرف الشرير المقابل للمسيح
  alternative: بليعال
  rationale: يحافظ المتن على الصيغة اليونانية Βελιάρ بالنقل الصوتي، بينما تُذكر الصيغة البديلة المألوفة في الحاشية دون فرض شرح إضافي على الآية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. حوفظ على السؤالين البلاغيين والتوازي بينهما، وعلى الغموض المقصود في طبيعة «النصيب» من غير تقييده بنوع بعينه من المشاركة.
