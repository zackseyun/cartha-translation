base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/017.yaml
  text: Therefore[a], come out from among them and be separate, says the Lord, and do not touch what is unclean[c][b]; and I will receive you.
translation:
  language: ar
  text: لذلك، اخرجوا من وسطهم، وكونوا منفصلين[a]، يقول الرب، ولا تمسّوا ما هو نجس[b][c]، وأنا سأستقبلكم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «اعتزلوا» أو «افصلوا أنفسكم».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «لا تمسّوا شيئًا نجسًا».'
    reason: lexical_alternative
  - marker: c
    text: يردّد بولس هنا لغة الأنبياء في العهد القديم، ولا سيما إشعياء 52:11.
    reason: cross_reference
lexical_decisions:
- source_word: διὸ
  choice: لذلك
  rationale: تفيد النتيجة والاستدلال على ما سبق، وهي صياغة عربية طبيعية تحافظ على قوة الربط المنطقي.
- source_word: ἐξέλθατε
  choice: اخرجوا
  rationale: فعل أمر جمع يدعو إلى خروج حاسم، ويحافظ على صورة الاقتباس النبوي من غير شرح زائد.
- source_word: ἐκ μέσου αὐτῶν
  choice: من وسطهم
  rationale: يحفظ البعدين المكاني والاجتماعي في العبارة اليونانية بصياغة عربية واضحة.
- source_word: ἀφορίσθητε
  choice: اعتزلوا
  rationale: ينقل الأمر بالانفصال والتميّز بصياغة عربية موجزة ومألوفة، من غير أن يفرض تطبيقًا طائفيًا أو انعزالًا مطلقًا.
- source_word: λέγει κύριος
  choice: يقول الرب
  rationale: يحافظ على صيغة الإعلان النبوي وعلى ترجمة κύριος المعتادة في سياق العهد الجديد.
- source_word: ἀκαθάρτου
  choice: ما هو نجس
  rationale: يحفظ التعبير العام المحايد في اليونانية، فلا يقيّده بشيء بعينه.
- source_word: μὴ ἅπτεσθε
  choice: لا تمسّوا
  rationale: ينقل معنى اللمس الوارد في سياق الطهارة والانفصال ويحافظ على صدى اللغة النبوية.
- source_word: κἀγὼ
  choice: وأنا
  rationale: ينقل اقتران καί بالضمير ἐγώ ويحفظ بروز المتكلم من غير مبالغة في توكيده.
- source_word: εἰσδέξομαι ὑμᾶς
  choice: سأقبلكم
  rationale: ينقل الاستقبال الإيجابي الموعود، مع الحفاظ على النبرة العهدية المهيبة في السياق.
theological_decisions:
- issue: ترجمة κύριος في اقتباس نبوي ذي خلفية من العهد القديم
  choice: الرب
  alternative: السيد
  rationale: النص اليوناني للعهد الجديد يستعمل κύριος؛ لذا تُحفظ ترجمته المعتادة «الرب» من غير استبدالها بصيغة خاصة باسم العهد القديم.
- issue: مدى أمر الانفصال
  choice: اعتزلوا
  alternative: كونوا منفصلين
  rationale: تحفظ الصياغة الدعوة إلى التميّز عن الارتباط المُنجِّس، من غير أن تضيف إلى النص أمرًا بالانقطاع عن كل تعامل مع الآخرين.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة، مع الإبقاء على إيقاع النداء النبوي. وُضعت علامات الحواشي عند الألفاظ التي تشرحها، وحُفظ عموم «ما هو نجس» بدل تعيين مرجع غير مصرّح به في الأصل.
