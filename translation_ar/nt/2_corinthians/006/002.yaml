  text: λέγει γάρ· Καιρῷ δεκτῷ ἐπήκουσά σου καὶ ἐν ἡμέρᾳ σωτηρίας ἐβοήθησά σοι· ἰδοὺ νῦν καιρὸς εὐπρόσδεκτος, ἰδοὺ νῦν ἡμέρα σωτηρίας·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/002.yaml
  text: For he says[a], “At an acceptable time I listened to you, and in a day of salvation I helped you.” Behold, now is the acceptable time; behold[b], now is the day of salvation.
translation:
  language: ar
  text: 'لِأَنَّهُ يَقُولُ[a]: «فِي وَقْتٍ مَقْبُولٍ اسْتَجَبْتُ لَكَ، وَفِي يَوْمِ خَلَاصٍ أَعَنْتُكَ». هَا هُوَ الآنَ وَقْتٌ مَقْبُولٌ، هَا هُوَ[b] الآنَ يَوْمُ خَلَاصٍ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أَصْغَيْتُ إِلَيْكَ بِرِضًى». يمكن أن يدل الفعل على السماع المصحوب بالقبول أو الاستجابة.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «الآنَ هُوَ الْوَقْتُ الْمَقْبُولُ… الآنَ هُوَ يَوْمُ الْخَلَاصِ». فالعبارتان في اليونانية بلا أداة تعريف.'
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει γάρ
  choice: لِأَنَّهُ يَقُولُ
  rationale: تنقل γάρ التعليل والربط بما سبق، وتحافظ صيغة «يقول» على المضارع وعلى المتكلم الإلهي المفهوم من الاقتباس.
- source_word: Καιρῷ δεκτῷ
  choice: فِي وَقْتِ قَبُولٍ
  rationale: καιρός وقت ملائم أو معيَّن، وδεκτός يدل على القبول أو الرضا؛ وهذه الصياغة عربية طبيعية وتحفظ الصلة اللفظية مع εὐπρόσδεκτος في التطبيق التالي.
- source_word: ἐπήκουσά σου
  choice: اسْتَجَبْتُ لَكَ
  rationale: الفعل يدل على السماع المصحوب بالقبول أو الاستجابة. «استجبت لك» تنقل هذا البعد السياقي بوضوح، مع إثبات البديل الأقرب إلى ظاهر السماع في الحاشية.
- source_word: ἐν ἡμέρᾳ σωτηρίας
  choice: فِي يَوْمِ خَلَاصٍ
  rationale: تحافظ الصياغة على غياب أداة التعريف في اليونانية وعلى تركيب الاقتباس من غير فرض تعيين زائد.
- source_word: ἐβοήθησά σοι
  choice: أَعَنْتُكَ
  rationale: ترجمة واضحة ومباشرة لمعنى تقديم العون.
- source_word: ἰδοὺ
  choice: هَا هُوَ
  rationale: أداة تنبيه عربية فصيحة معاصرة تحفظ قوة الالتفات والجدية من غير غرابة «هوذا» على بعض القراء.
- source_word: νῦν
  choice: الآنَ
  rationale: تنقل الدلالة الزمنية والتوكيد الملحّ في تطبيق بولس.
- source_word: καιρὸς εὐπρόσδεκτος
  choice: وَقْتُ الْقَبُولِ
  rationale: εὐπρόσδεκτος يدل على ما هو مرضي أو مرحَّب به جدًا. «وقت القبول» تعبير عربي موجز وطبيعي يحفظ الصلة بالعبارة السابقة، والتعريف هنا مفهوم على أنه تعريف سياقي لا ادعاء بوجود أداة تعريف يونانية.
- source_word: ἡμέρα σωτηρίας
  choice: يَوْمُ الْخَلَاصِ
  rationale: الصياغة المعرّفة طبيعية في العربية في الإعلان التطبيقي «الآن»، مع التنبيه في الحاشية إلى إمكان إبقاء العبارة غير معيّنة بحسب البنية اليونانية.
theological_decisions:
- issue: تعيين «وقت القبول» و«يوم الخلاص» في تطبيق بولس أو إبقاؤهما نكرتين
  choice: 'استعمال التعريف في الجملة التطبيقية: «وقت القبول» و«يوم الخلاص».'
  alternative: «وقتٌ مقبول» و«يومُ خلاص» أو «وقتٌ للقبول» و«يومٌ للخلاص».
  rationale: العبارتان بلا أداة تعريف في اليونانية، ولذلك يبقى التنكير ممكنًا. لكن العربية تسمح بالتعريف السياقي الطبيعي بعد «الآن» من غير أن يفرض ذلك مخططًا أخرويًا زائدًا؛ وتُذكر الإمكانية الأخرى في الحاشية حفظًا للغموض الحقيقي.
- issue: مرجع الفاعل في «يقول»
  choice: الإبقاء على الصيغة الشخصية «لأنه يقول».
  alternative: «لأن الكتاب يقول».
  rationale: السياق الاقتباسي يجعل الله المتكلم المفهوم، والصيغة الشخصية تحفظ النسيج اللاهوتي للنص من غير إضافة اسم غير مصرّح به.
- issue: مدى تفسير ἐπήκουσά σου
  choice: «استجبت لك».
  alternative: «سمعت لك برضى» أو «أصغيت إليك».
  rationale: الفعل يحمل معنى السماع المقبول الذي يفضي إلى الاستجابة. الصياغة المختارة واضحة في العربية، بينما تعرض الحاشية البديل الأقل تفسيرًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُعمل «ها هو» للتنبيه بدل «هوذا» الأقدم، وحُفظ التوازي والإلحاح بتكرار «الآن». ضُبط النص كاملًا لتيسير القراءة العلنية.
