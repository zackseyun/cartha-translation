language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: τίς δὲ συγκατάθεσις ναῷ θεοῦ μετὰ εἰδώλων; ⸂ἡμεῖς γὰρ ναὸς θεοῦ ἐσμεν⸃ ζῶντος· καθὼς εἶπεν ὁ θεὸς ὅτι Ἐνοικήσω ἐν αὐτοῖς καὶ ἐμπεριπατήσω, καὶ ἔσομαι αὐτῶν θεός, καὶ αὐτοὶ ἔσονταί ⸀μου λαός.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/016.yaml
  text: 'And what agreement has the temple of God with idols? For we are the temple of the living God[a], just as God said: “I will dwell among them and walk among them, and I will be their God[b], and they will be my people.”'
translation:
  language: ar
  text: 'وأيُّ توافقٍ[a] بين هيكل الله والأصنام؟ فنحن هيكل الله الحي، كما قال الله: «سأسكن بينهم[b] وأسير بينهم، وأكون لهم إلهًا، ويكونون لي شعبًا».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أيُّ انسجام» أو «أيُّ اتفاق».
    reason: lexical_alternative
  - marker: b
    text: أو «سأسكن فيهم». يمكن أن يفيد حرف الجر اليوناني معنى «في» أو «بين»، ويرجّح السياق العهدي الجماعي هنا «بينهم».
    reason: alternative_reading
lexical_decisions:
- source_word: συγκατάθεσις
  choice: توافق
  rationale: يدل الاسم على الاتفاق أو الانسجام أو القبول المشترك. و«توافق» لفظ عربي واضح يلائم سلسلة المقابلات البلاغية في السياق.
- source_word: ναῷ / ναὸς
  choice: هيكل
  rationale: يشير ναός إلى الهيكل أو المقدس نفسه، لا إلى جميع ساحاته ومرافقه. و«هيكل» هو المقابل الكتابي العربي المألوف ويحفظ قوة الصورة الدينية.
- source_word: εἰδώλων
  choice: الأصنام
  rationale: المقصود معبودات وثنية، لا صور محايدة؛ لذلك تنقل «الأصنام» الدلالة الدينية الجدلية بوضوح.
- source_word: ζῶντος
  choice: الحي
  rationale: يصف اللفظ الله بوصفه «الله الحي»، في مقابلة ضمنية مع الأصنام التي لا حياة فيها.
- source_word: καθὼς εἶπεν ὁ θεὸς
  choice: كما قال الله
  rationale: يحفظ «كما» وظيفة καθώς في وصل تقرير بولس بالشاهد الكتابي، وينقل الماضي البسيط εἶπεν طبيعيًا.
- source_word: Ἐνοικήσω ἐν αὐτοῖς
  choice: سأسكن بينهم
  rationale: مع أن ἐν يمكن أن تعني «في»، فإن ضمير الجمع والسياق العهدي الجماعي والفعل الموازي التالي ترجّح في العربية «بينهم»، من غير إلغاء البديل الحرفي المذكور في الحاشية.
- source_word: ἐμπεριπατήσω
  choice: أسير بينهم
  rationale: يحفظ صورة حضور الله المتحرك وسط شعبه. و«أسير بينهم» طبيعية في العربية وأوضح هنا من النقل الحرفي «أتمشى فيهم».
- source_word: ἔσομαι αὐτῶν θεός
  choice: أكون لهم إلهًا
  rationale: صيغة عربية طبيعية تحفظ تركيب العهد وعلاقته المتبادلة مع العبارة التالية.
- source_word: λαός
  choice: شعب
  rationale: يدل اللفظ في صيغة العهد على شعب الله بوصفه جماعة واحدة، و«شعب» هو المقابل الأدق.
theological_decisions:
- issue: صورة الجماعة بوصفها هيكل الله
  choice: فنحن هيكل الله الحي
  alternative: فنحن هيكلٌ لله الحي
  rationale: الاسم ναὸς غير المعرّف واقع خبرًا، وله هنا معنى نوعي/تعريفي يدل على هوية الجماعة بوصفها هيكل الله. يحفظ هذا الاختيار الصورة الجماعية من غير تحويلها إلى وصف فردي.
- issue: صياغة سكنى الله في الاقتباس
  choice: سأسكن بينهم
  alternative: سأسكن فيهم
  rationale: الخطاب عن الجماعة بصيغة الجمع، وتوازي العبارة مع «أسير بينهم» يدعمان معنى الحضور وسط الشعب. لكن اليونانية تحتمل «فيهم»، ولذلك حُفظ هذا الاحتمال في الحاشية.
translation_notes:
  register: صياغة عربية فصحى معاصرة، واضحة ومهيبة، مع الحفاظ على السؤال البلاغي وصورة الهيكل وصيغة العهد. وُضع كل رمز حاشية عند العبارة التي يشرحها مباشرة.
