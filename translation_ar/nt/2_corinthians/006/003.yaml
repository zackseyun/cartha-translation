lexical_decisions:
- source_word: μηδεμίαν ... προσκοπήν
  choice: سببًا للعثرة
  rationale: ينقل معنى إتاحة مناسبة للتعثّر أو الإساءة، ويحافظ على صورة العثرة مع صياغة عربية طبيعية.
- source_word: ἐν μηδενί
  choice: في أيّ شيء
  rationale: 'يحفظ شمول العبارة اليونانية، ويمكن فهمه بمعنى: في أي أمر أو من أي وجه.'
- source_word: διδόντες
  choice: نضع
  rationale: ترجمة سياقية طبيعية لفعل «يعطي» حين يقترن بسبب أو مناسبة، مع إبقاء الفاعل الجمع متصلًا بالسياق السابق.
- source_word: ἵνα μὴ
  choice: لئلّا
  rationale: تؤدي غرض جملة الغاية المنفية بوضوح وإيجاز في العربية الفصحى المعاصرة.
- source_word: μωμηθῇ
  choice: تُلام
  rationale: 'ينقل المبني للمجهول والمعنى الأساسي للفعل: أن تُعاب الخدمة أو يُؤخذ عليها مأخذ.'
- source_word: ἡ διακονία
  choice: الخدمة
  rationale: «الخدمة» أوسع وأقرب إلى الدلالة اليونانية هنا من المصطلحات التي قد توحي بمنصب كنسي لاحق، وتلائم خدمة بولس ورفقائه الرسولية.
theological_decisions:
- issue: مدلول διακονία في وصف بولس لخدمته
  choice: الخدمة
  alternative: الوزارة
  rationale: السياق يتناول أداء بولس ورفقائه للمهمة التي اؤتمنوا عليها. «الخدمة» تحافظ على المعنى الرسولي من غير أن تستورد بنية مؤسسية أو منصبًا كنسيًا متأخرًا.
- issue: 'طبيعة προσκοπή: عثرة أم إساءة'
  choice: سببًا للعثرة
  alternative: سببًا للإساءة
  rationale: اللفظة تحتمل مناسبة للتعثّر أو الاعتراض والإساءة. أُبقيت صورة العثرة في المتن، مع إثبات البديل الدلالي في الحاشية دون حسم زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقّرة. استُعملت «لئلّا» لصياغة الغاية المنفية بإيجاز، وحُفظت استعارة العثرة مع تقديم البدائل الدلالية في الحواشي.
