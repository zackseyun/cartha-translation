  text: ὡς λυπούμενοι ἀεὶ δὲ χαίροντες, ὡς πτωχοὶ πολλοὺς δὲ πλουτίζοντες, ὡς μηδὲν ἔχοντες καὶ πάντα κατέχοντες.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/010.yaml
  text: as sorrowful[a], yet always rejoicing; as poor, yet making many rich; as having nothing[b], and yet possessing everything.
translation:
  language: ar
  text: كَحَزَانَى، لكننا فرحون دائمًا؛ كَفُقَرَاء، لكننا نُغْنِي كثيرين[a]؛ كأننا لا نملك شيئًا، ونحن نمتلك كلَّ شيء[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي نُصيِّر كثيرين أغنياء. ويرجَّح في السياق أن هذا الغنى ليس ماديًّا، بل روحيًّا.
    reason: lexical_alternative
  - marker: b
    text: أي إنهم، على الرغم من افتقارهم الظاهر، يمتلكون كل شيء بالمعنى الأعمق الذي يتحدث عنه بولس في الاتحاد بالمسيح.
    reason: cross_reference
lexical_decisions:
- source_word: ὡς
  choice: كَـ / كأننا
  rationale: يحافظ على الإطار المقارن المتكرر في سلسلة المفارقات. استُعملت «كأننا» في العبارة الأخيرة لوضوح الأسلوب العربي، من غير حسم ما إذا كان الوصف ظاهرًا فقط أو واقعًا منظورًا من زاوية معينة.
- source_word: λυπούμενοι
  choice: حَزَانَى
  rationale: ينقل حالة الحزن بإيجاز، من غير تحديد سبب الحزن أو الجهة التي أحدثته.
- source_word: ἀεὶ
  choice: دائمًا
  rationale: مقابل زمني طبيعي يحفظ دوام الفرح وسط الحزن.
- source_word: δὲ
  choice: لكننا
  rationale: يُظهر التضاد والمفارقة في كل زوج من العبارات بأسلوب عربي واضح.
- source_word: χαίροντες
  choice: فرحون
  rationale: صياغة عربية طبيعية تدل على حالة الفرح المستمرة، وإن لم تحافظ شكليًا على اسم الفاعل اليوناني.
- source_word: πτωχοὶ
  choice: فُقَرَاء
  rationale: المقابل المباشر الذي يترك مجال الدلالة مفتوحًا للفقر المادي ولحال الرسل المتواضعة، من غير مبالغة إلى معنى العوز المدقع.
- source_word: πολλοὺς
  choice: كثيرين
  rationale: يحفظ المفعول الشخصي غير المحدد وصياغة العبارة الموجزة.
- source_word: πλουτίζοντες
  choice: نُغْنِي كثيرين
  rationale: الفعل يعني جعل الآخرين أغنياء. وهذه الصياغة تبقي طبيعة الغنى غير محددة في المتن.
- source_word: μηδὲν ἔχοντες
  choice: لا نملك شيئًا
  rationale: صياغة عربية طبيعية تحافظ على صورة انعدام الملكية في طرف المفارقة الأول.
- source_word: πάντα
  choice: كلَّ شيء
  rationale: مقابل عربي شامل وطبيعي يحفظ إطلاق العبارة.
- source_word: κατέχοντες
  choice: نمتلك
  rationale: يناسب التضاد مع «لا نملك شيئًا»، وينقل معنى الحيازة الفعلية دون تحويله إلى مجرد التمسك بشيء.
theological_decisions:
- issue: طبيعة الغنى والامتلاك في مفارقتي بولس
  choice: إبقاء عبارتي «نُغني كثيرين» و«نمتلك كل شيء» بلا تقييد في المتن
  alternative: التصريح بأن المقصود غنى روحي وامتلاك كل شيء في المسيح
  rationale: يرجح السياق أن الغنى أعمق من الغنى المادي، لكن اليونانية لا تضيف قيدًا صريحًا. لذلك يحفظ المتن المفارقة والتوتر اللاهوتي، وتُذكر الإشارة التفسيرية في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة، مع الحفاظ على توازي المفارقات وإيقاعها. أُثبتت علامتا الحاشية في المتن، ولم يُصرَّح بالتفسير الروحي داخله.
