  text: في الكرامة والهوان[a]، وفي المذمّة والمدح[b]؛ نُعَدّ مُضِلِّين، مع أننا صادقون[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «في المجد والمهانة». يمكن أن تعني الكلمة اليونانية «المجد»، لكن المقابلة هنا ترجّح معنى الكرامة أو الاعتبار العلني.
    reason: lexical_alternative
  - marker: b
    text: أو «في سوء الصيت وحسن الصيت». قد تشير الكلمتان إلى الكلام الذي يقال عنهم أو إلى السمعة الناتجة عنه.
    reason: lexical_alternative
  - marker: c
    text: 'حرفيًا: «كمُضِلّين وصادقين». تقابل العبارة بين نظرة الآخرين إلى بولس ورفقائه وبين حقيقتهم.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ
  choice: في
  rationale: تأتي διά هنا مع أسماء أحوال متقابلة تصف الظروف التي تستمر فيها الخدمة. و«في» أفصح في العربية من ترجمة حرفية مثل «من خلال»، مع الحفاظ على تكرار البنية.
- source_word: δόξης
  choice: الكرامة
  rationale: تقابل ἀτιμία في سياق اجتماعي علني؛ لذلك تعبّر «الكرامة» عن التقدير الذي يناله الشخص، من غير الإيحاء اللاهوتي الغالب في لفظ «المجد».
- source_word: ἀτιμίας
  choice: الهوان
  rationale: لفظ موجز يقابل «الكرامة» ويفيد فقدان الاعتبار والازدراء الاجتماعي.
- source_word: δυσφημίας
  choice: المذمّة
  rationale: يدل اللفظ على الكلام السيئ أو السمعة السيئة. و«المذمّة» تحافظ على المجال الدلالي الواسع ولا تحصر المعنى في افتراء كاذب كما قد تفعل «الوشاية» أو «الافتراء».
- source_word: εὐφημίας
  choice: المدح
  rationale: يقابل «المذمّة» بوضوح، ويدل على الكلام الحسن أو الثناء، مع بقاء احتمال معنى حسن السمعة في الحاشية.
- source_word: ὡς
  choice: نُعَدّ
  rationale: يوضح أن وصف الرسل بأنهم مضلّون هو نظرة الآخرين إليهم، لا إقرارًا بصحة الاتهام.
- source_word: πλάνοι
  choice: مُضِلِّين
  rationale: المعنى السياقي هو أناس يُتَّهمون بتضليل غيرهم، لا مجرد التائهين.
- source_word: ἀληθεῖς
  choice: صادقون
  rationale: يحافظ على المقابلة مع اتهامهم بالتضليل، ويعبّر طبيعيًا عن مطابقة كلامهم للحق، مع إمكان معنى «حقيقيون» أو «أمناء» بحسب نطاق الصفة.
theological_decisions:
- issue: هل يُصرَّح بأن وصف «مُضِلِّين» حكم الآخرين، بينما «صادقون» يعبّر عن الواقع؟
  choice: «نُعَدّ مُضِلِّين، مع أننا صادقون»
  alternative: «كأننا مُضِلّون وصادقون» أو الترجمة الحرفية «كمُضِلّين وصادقين»
  rationale: صيغة «نُعَدّ» تكشف المنظور الذي تفيده ὡς في هذا السياق، و«مع أننا» تُظهر المفارقة من غير إزالة التوتر بين نظرة الناس وحقيقة الخدمة.
translation_notes:
  register: صياغة عربية فصحى معاصرة وموجزة، تحافظ على توازي الأزواج المتقابلة وإيقاع القائمة. استُخدم المبني للمجهول «نُعَدّ» لتوضيح منظور الناس، مع ضبط «مُضِلِّين» منعًا لالتباسها بـ«مُضَلِّين».
