lexical_decisions:
- source_word: ὡς
  choice: كَـ
  rationale: تحافظ أداة التشبيه على التكرار البلاغي الذي يعرض به بولس هذه المفارقات، من غير أن تحسم هل المقصود الظاهر أم الواقع.
- source_word: ἀγνοούμενοι
  choice: مجهولين
  rationale: ينقل اسم المفعول معنى كونهم غير معروفين أو غير معترف بهم، ويحافظ على المقابلة الموجزة مع العبارة التالية.
- source_word: ἐπιγινωσκόμενοι
  choice: معروفين حقًّا
  rationale: يعبّر عن المعرفة الواضحة أو الإقرار الحقيقي، ويقابل «مجهولين» من غير اختزال المعنى في الشهرة.
- source_word: ἀποθνῄσκοντες
  choice: مائتين
  rationale: يحفظ دلالة الحال المستمرة أو الظهور كمن يواجهون الموت، مع تمييزه من فعل الإماتة الوارد لاحقًا.
- source_word: ἰδοὺ ζῶμεν
  choice: وها نحن أحياء
  rationale: «ها» تستدعي الانتباه، وصيغة «نحن أحياء» عربية طبيعية تحافظ على حدة المفارقة.
- source_word: παιδευόμενοι
  choice: مؤدَّبين
  rationale: يتسع «التأديب» هنا للتقويم والتهذيب والتدريب، ولا يفرض أن المعاناة عقوبة محضة.
- source_word: μὴ θανατούμενοι
  choice: غير مهلكين
  rationale: يحافظ على المبني للمجهول وعلى معنى عدم بلوغ التأديب حد الموت، بصياغة عربية موجزة.
theological_decisions:
- issue: دلالة παιδευόμενοι وعلاقتها بالمعاناة
  choice: مؤدَّبين
  alternative: مدرَّبين أو معاقَبين
  rationale: «مؤدَّبين» تبقي احتمال التقويم والتهذيب الإلهي من غير أن تقرر أن الآلام عقاب، فتحفظ التوتر الدلالي في النص.
