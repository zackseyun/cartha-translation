  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πληγαῖς
  choice: الضرب
  rationale: يدل الجمع على الضربات أو حوادث التعرّض للضرب؛ وصيغة «في الضرب» عربية موجزة وتحافظ على نسق القائمة.
- source_word: φυλακαῖς
  choice: السجون
  rationale: يشير إلى حالات السجن أو الحبس، والجمع يحافظ على صيغة الأصل.
- source_word: ἀκαταστασίαις
  choice: الاضطرابات
  rationale: لفظ واسع يدل على الفوضى أو الاضطراب أو القلاقل؛ و«الاضطرابات» يحفظ سعته ولا يقيّده حصرًا بأعمال شغب جماهيرية.
- source_word: κόποις
  choice: الأتعاب
  rationale: يدل على الأعمال الشاقة وما يصحبها من تعب، و«الأتعاب» مناسب لسياق المكابدات.
- source_word: ἀγρυπνίαις
  choice: السهر
  rationale: يدل على البقاء بلا نوم أو قضاء ليالٍ ساهرة، وصيغة المصدر طبيعية وموجزة.
- source_word: νηστείαις
  choice: الأصوام
  rationale: الترجمة المباشرة هي الصيامات أو الأصوام، مع إبقاء احتمال الصوم الاختياري أو الحرمان من الطعام دون حسم سياقي زائد.
theological_decisions:
- issue: 'دلالة νηστείαις: أصوام دينية أم جوع قسري'
  choice: الأصوام
  alternative: الجوع أو الحرمان من الطعام
  rationale: اللفظ اليوناني يُستعمل عادة للصوم، لكن السياق قد يسمح بفهمه حرمانًا من الطعام؛ أبقت الترجمة الدلالة المعجمية الأساسية من غير إضافة تفسير مذهبي.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة وموقّرة. حُفظ التوازي بتكرار «وفي»، مع استعمال أسماء موجزة تناسب إيقاع قائمة الشدائد.
