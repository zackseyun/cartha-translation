  yaml_path: translation/nt/2_corinthians/006/013.yaml
  text: In the same return—I speak as to children—be open wide[b][a], you also.
translation:
  language: ar
  text: ففي المقابل[a]—أقول هذا لكم كأبناء—اتَّسعوا[b] أنتم أيضًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «استجابةً مماثلة»، أو «مقابلًا مماثلًا». والمقصود استجابة متبادلة، لا مقابلًا ماليًا.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «كونوا متَّسعين». والمقصود في السياق أن يفسحوا مجالًا واسعًا في مودتهم وقبولهم.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὴν δὲ αὐτὴν ἀντιμισθίαν
  choice: وبالمثل
  rationale: يدل التعبير على استجابة مقابلة مماثلة لما أبداه بولس ورفقاؤه، لا على سداد مالي. وصيغة «وبالمثل» عربية طبيعية موجزة تحفظ معنى التبادل، بينما تنقل الواو وظيفة δὲ الانتقالية الخفيفة.
- source_word: ὡς τέκνοις λέγω
  choice: أقول هذا لكم كأبناء
  rationale: تحافظ الصياغة على نبرة الخطاب العائلي من غير إضافة ضمير الملكية «أبنائي»، وهو غير مذكور صراحة في اليونانية.
- source_word: πλατύνθητε
  choice: اتَّسعوا
  rationale: الفعل أمر بمعنى «كونوا متَّسعين/اتَّسعوا»، وهو استعارة عن رحابة المودة والاستقبال في سياق الآيتين 11–12. أبقينا الاستعارة من غير إضافة «قلوبكم» إلى المتن، لأن المفعول غير مصرح به هنا.
- source_word: καὶ ὑμεῖς
  choice: أنتم أيضًا
  rationale: 'يحفظ توكيد الضمير ومعنى المقابلة: كما اتَّسع بولس ورفقاؤه لهم، ينبغي أن يتَّسعوا هم أيضًا.'
theological_decisions:
- issue: هل يُجعل خطاب بولس العائلي صريح الملكية؟
  choice: كأبناء
  alternative: كأبنائي
  rationale: السياق يوحي بعلاقة أبوية، لكن النص اليوناني يقول «لأبناء» بلا ضمير ملكية؛ لذلك لم نضف «أبنائي».
- issue: هل يُصرَّح بالقلب في أمر الاتساع؟
  choice: اتَّسعوا
  alternative: افتحوا قلوبكم على اتساعها
  rationale: السياق يبين أن المقصود رحابة المودة والاستقبال، لكن «القلوب» ليست مذكورة في هذه الآية نفسها. إبقاء الاستعارة بلا مفعول مصرح به يحفظ إيجاز الأصل ولا يحسم ما تركه ضمنيًا.
translation_notes:
  register: العربية فصحى معاصرة واضحة ووقورة. استُخدمت الشرطتان لاعتراض العبارة الأبوية، وحُفظت استعارة الاتساع مع شرحها في الحاشية بدل إدخال «القلوب» في المتن.
