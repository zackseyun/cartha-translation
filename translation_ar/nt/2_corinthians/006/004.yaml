source:
  edition: SBLGNT
  text: ἀλλ’ ἐν παντὶ ⸀συνιστάνοντες ἑαυτοὺς ὡς θεοῦ διάκονοι· ἐν ὑπομονῇ πολλῇ, ἐν θλίψεσιν, ἐν ἀνάγκαις, ἐν στενοχωρίαις,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/004.yaml
  text: 'but in everything commending ourselves as God''s servants: in great endurance[a], in afflictions, in hardships, in distresses[c][b],'
translation:
  language: ar
  text: 'بل نُظهِر أنفسنا في كل شيء خُدّامًا لله: في صبر عظيم، وفي شدائد، وفي ضيقات، وفي كُرَب.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλ’
  choice: بل
  rationale: تفيد الانتقال التقابلي من العبارة السلبية السابقة إلى بيان السلوك الإيجابي، و«بل» طبيعية وموجزة في هذا السياق.
- source_word: ἐν παντί
  choice: في كل شيء
  rationale: تحفظ شمول العبارة اليونانية، التي قد تشير إلى كل ظرف أو إلى كل وجه من وجوه إظهار صدق الخدمة.
- source_word: συνιστάνοντες ἑαυτούς
  choice: نُظهِر أنفسنا
  rationale: يحمل الفعل هنا معنى إظهار حقيقة الشخص أو البرهنة عليها بالسلوك؛ وهذا التعبير أوضح في العربية من «نوصي بأنفسنا»، التي قد توحي بمدح الذات.
- source_word: ὡς θεοῦ διάκονοι
  choice: خُدّامًا لله
  rationale: ينقل معنى الخدمة في διάκονοι من غير افتراض منصب كنسي مؤسسي، ويحفظ ὡς دلالة كونهم يظهرون أنفسهم بهذه الصفة.
- source_word: ἐν ὑπομονῇ πολλῇ
  choice: في صبر عظيم
  rationale: «الصبر» هنا ثبات واحتمال تحت المحنة، و«عظيم» تنقل قوة πολλῇ مع الحفاظ على تكرار «في».
- source_word: θλίψεσιν
  choice: شدائد
  rationale: تعبر عن الضغوط والمحن تعبيرًا عربيًا واضحًا وثقيل الدلالة.
- source_word: ἀνάγκαις
  choice: ضيقات
  rationale: تشير في السياق إلى ظروف قاهرة وضاغطة، لا إلى مجرد الاحتياجات.
- source_word: στενοχωρίαις
  choice: كُرَب
  rationale: تنقل شدة حال الانحصار والضغط، وتبقيها متميزة قدر الإمكان من اللفظين السابقين.
theological_decisions:
- issue: دلالة διάκονοι في سياق الخدمة
  choice: خُدّامًا لله
  alternative: خُدّام الله؛ أو خادمين لله
  rationale: يعرّف اللفظ بولس ورفقاءه من جهة خدمتهم لله، من غير أن يقتضي رتبة كنسية رسمية. وتحفظ صيغة الحال معنى ὡς في التركيب.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حوفظ على تكرار «في» لتمثيل البناء اليوناني الإيقاعي، مع التمييز بين ألفاظ قائمة المعاناة من غير ادعاء حدود دلالية حادة بينها.
