  source_fidelity: 'الترجمة أمينة للبناء والمعنى في اليونانية: «بل» تحفظ المقابلة، و«في كل شيء» تنقل الشمول في ἐν παντί، و«نُظهر أنفسنا ... خُدّامًا لله» تؤدي معنى συνιστάνοντες ἑαυτούς ὡς θεοῦ διάκονοι من دون افتراض منصب كنسي. كما تحافظ القائمة على تكرار «في» وعلى تدرج ألفاظ الضيق والمعاناة.'
  naturalness: العبارة فصحى معاصرة سليمة ومقروءة. «في صبر عظيم، وفي شدائد، وفي ضيقات، وفي كُرَب» إيقاعية وطبيعية في سياق تعداد بلاغي، مع أن الحدود الدقيقة بين ألفاظ القائمة لا يلزم تحميلها فروقًا مصطنعة.
  terminology: «خُدّامًا لله» اختيار مناسب لـδιάκονοι، إذ يدل على الخدمة لله ولا يحمل بالضرورة دلالة رتبة كنسية. و«صبر عظيم» مناسب هنا للصبر الثابت/الاحتمال، لا للصبر بمعناه الضيق فقط.
