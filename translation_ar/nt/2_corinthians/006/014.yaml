  text: Μὴ γίνεσθε ἑτεροζυγοῦντες ἀπίστοις· τίς γὰρ μετοχὴ δικαιοσύνῃ καὶ ἀνομίᾳ, ⸂ἢ τίς⸃ κοινωνία φωτὶ πρὸς σκότος;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/014.yaml
  text: Do not become unequally yoked with unbelievers[b][a]. For what partnership has righteousness with lawlessness? Or what fellowship has light with darkness?
translation:
  language: ar
  text: لا ترتبطوا بغير المؤمنين بنيرٍ غير متكافئ[a]. فأيّةُ مشاركةٍ بين البرّ[b] ومخالفة الشريعة؟ وأيّةُ شركةٍ للنور مع الظلمة؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: تستحضر عبارة «نير غير متكافئ» صورة حيوانين من نوعين مختلفين مربوطين تحت نير واحد؛ قارن التثنية 22:10.
    reason: cross_reference
  - marker: b
    text: يمكن أيضًا ترجمة «البرّ» هنا بـ«العدل».
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ γίνεσθε
  choice: لا تصيروا
  rationale: يحافظ على معنى الصيرورة في γίνομαι وعلى قوة النهي، بدل الاكتفاء بتعبير ساكن مثل «لا تكونوا».
- source_word: ἑτεροζυγοῦντες
  choice: تحت نيرٍ غير متكافئ
  rationale: يحفظ صورة حيوانين غير متوافقين مربوطين تحت نير واحد، مع صياغة عربية واضحة وطبيعية.
- source_word: ἀπίστοις
  choice: مع غير المؤمنين
  rationale: يدل اللفظ هنا على الذين لا يؤمنون، وتلائم «مع» علاقة الاقتران التي تتضمنها صورة النير.
- source_word: μετοχὴ
  choice: مشاركة
  rationale: ينقل معنى الاشتراك أو الإسهام في شيء معًا، ويميّزه نسبيًا عن κοινωνία في الجملة التالية.
- source_word: δικαιοσύνῃ
  choice: البرّ
  rationale: «البرّ» المقابل العربي الراسخ والطبيعي هنا، ويلائم التضاد الأخلاقي مع ἀνομία، مع إبقاء «العدل» احتمالًا معجميًا في الحاشية.
- source_word: ἀνομίᾳ
  choice: الإثم
  rationale: ينقل في عربية مفهومة الحالة المناقضة للبر؛ ويتضمن الأصل معنى مخالفة الشريعة أو الخروج عليها، لكن الترجمة الحرفية لذلك أثقل في هذا التركيب البلاغي.
- source_word: κοινωνία
  choice: شركة
  rationale: يعبر عن الاشتراك والعلاقة الجامعة، ويحافظ على التوازي مع «مشاركة» من غير طمس الفارق اللفظي بين الكلمتين اليونانيتين.
- source_word: φωτὶ πρὸς σκότος
  choice: للنور مع الظلمة
  rationale: يحفظ التضاد المجازي، وتؤدي «مع» معنى العلاقة في هذا السؤال بصورة عربية سليمة.
theological_decisions:
- issue: دلالة δικαιοσύνη في هذا التضاد البولسي
  choice: البرّ
  alternative: العدل
  rationale: السياق الأخلاقي الديني والتضاد مع ἀνομία يرجحان «البرّ» في المتن، من غير استبعاد «العدل» من المجال الدلالي؛ لذلك أُثبت في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كتابية رصينة. حُفظت استعارة النير بدل شرحها داخل المتن، ووُضعت إضاءتها في الحاشية. كما روعي التمييز بين μετοχή وκοινωνία باستعمال «مشاركة» و«شركة».
