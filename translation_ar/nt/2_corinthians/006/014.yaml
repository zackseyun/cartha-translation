  to: لا ترتبطوا بغير المؤمنين بنيرٍ غير متكافئ[a]. فأيّةُ مشاركةٍ بين البرّ[b] ومخالفة الشريعة؟ وأيّةُ شركةٍ للنور مع الظلمة؟
  rationale: عُدّل فعل النهي إلى صياغة عربية أكثر سلاسة تحفظ معنى الاقتران في استعارة النير، وعُدّلت مقابلة «الإثم» إلى «مخالفة الشريعة» لتقابل ἀνομία بدقة أكبر. وحُفظت بنية الأسئلة والتقابل بين البرّ ومخالفة الشريعة، وبين النور والظلمة، كما حُفظت الحاشيتان ومواضع علامتيهما.
