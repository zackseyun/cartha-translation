  text: ἐν ἁγνότητι, ἐν γνώσει, ἐν μακροθυμίᾳ, ἐν χρηστότητι, ἐν πνεύματι ἁγίῳ, ἐν ἀγάπῃ ἀνυποκρίτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/006.yaml
  text: in purity[a], in knowledge, in patience, in kindness, in the Holy Spirit, in sincere love,
translation:
  language: ar
  text: في الطهارة، وفي المعرفة، وفي طول الأناة، وفي اللطف، وفي الروح القدس[a]، وفي محبة بلا رياء،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وفي روح مقدسة»، إذا كان التعبير يصف نزعة مقدسة لا الروح القدس.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἁγνότητι
  choice: الطهارة
  rationale: تدل الكلمة على النقاء أو الطهارة الأخلاقية بمعناها الواسع، ولا ينبغي حصرها في العفة الجنسية.
- source_word: γνώσει
  choice: المعرفة
  rationale: تحافظ على سعة اللفظ اليوناني، الذي قد يشمل الفهم العملي والروحي في الخدمة.
- source_word: μακροθυμίᾳ
  choice: طول الأناة
  rationale: تعبير عربي فصيح ومفهوم يدل على الصبر الممتد واحتمال الناس والشدائد.
- source_word: χρηστότητι
  choice: اللطف
  rationale: ينقل معنى المعاملة الكريمة الرحيمة وحسن التعامل، وهو ملائم لسياق الصفات الخدمية.
- source_word: πνεύματι ἁγίῳ
  choice: الروح القدس
  rationale: المرجح بحسب الاستعمال البولسي والسياق أن المقصود هو روح الله، مع إبقاء احتمال وصف الروح أو النزعة البشرية المقدسة في الحاشية.
- source_word: ἀγάπῃ ἀνυποκρίτῳ
  choice: محبة بلا رياء
  rationale: 'ينقل تركيب الصفة اليونانية بوضوح ويحفظ المعنى الصريح: محبة خالية من التظاهر والنفاق.'
- source_word: ἐν
  choice: في
  rationale: تكرار «في» يحفظ الإيقاع البلاغي للقائمة، ويترك مفتوحًا معنى المجال أو الكيفية أو الوسيلة.
theological_decisions:
- issue: مرجع πνεύματι ἁγίῳ
  choice: الروح القدس، أي روح الله
  alternative: روح مقدسة، بمعنى نزعة أو موقف بشري مقدس
  rationale: الاستعمال البولسي والسياق يرجحان الإشارة إلى الروح القدس، لكن غياب أداة التعريف في اليونانية وطبيعة قائمة الصفات يجعلان البديل ممكنًا، ولذلك ذُكر في الحاشية دون حسم زائد.
translation_notes:
  register: صياغة عربية فصحى واضحة وكريمة، تحافظ على تكرار «في» وعلى إيقاع تعداد بولس. استُعمل «طول الأناة» لما فيه من دقة ووضوح كتابي مألوف، و«محبة بلا رياء» بدل صياغة أكثر تجريدًا لتقريب المعنى إلى القارئ المعاصر.
