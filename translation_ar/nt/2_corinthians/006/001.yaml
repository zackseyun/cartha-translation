base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/001.yaml
  text: Working together with him[a], we also urge you not to receive the grace of God in vain.
translation:
  language: ar
  text: وإذ نعمل مع الله[a]، نحثّكم أيضًا ألّا تقبلوا نعمة الله دون جدوى.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وإذ نعمل معًا، نحثّكم أيضًا». لا يصرّح النص اليوناني بمن يعمل بولس معه، وإن كان السياق يرجّح أن المقصود هو الله.'
    reason: alternative_reading
lexical_decisions:
- source_word: Συνεργοῦντες
  choice: وإذ نعمل مع الله
  rationale: يحافظ على القوة الفعلية لاسم الفاعل اليوناني، ويُظهر الشريك المفهوم من سياق عمل الله في المصالحة (5:18–20). ذُكر «الله» بدل ضمير قد يلتبس مرجعه في العربية، مع إثبات إمكان إبقاء الشريك غير مصرّح به في الحاشية.
- source_word: δὲ
  choice: وَ
  rationale: أداة انتقال وربط خفيفة هنا، فنُقلت بواو الاستئناف الطبيعية من غير إضفاء معنى استدراكي قوي.
- source_word: καὶ
  choice: أيضًا
  rationale: تنقل القوة الإضافية، إذ يُضاف الحث إلى العمل المشترك.
- source_word: παρακαλοῦμεν
  choice: نحثّكم
  rationale: يفيد الفعل نداءً جادًا وحثًّا ملحًّا، و«نحثّ» فصيحة واضحة في العربية المعاصرة.
- source_word: μὴ
  choice: ألّا
  rationale: صياغة عربية طبيعية للنفي مع مضمون الحث.
- source_word: εἰς κενὸν
  choice: بلا ثمر
  rationale: التعبير اليوناني يعني من غير نتيجة أو أثر. و«بلا ثمر» واضح وطبيعي ويحفظ الصورة الدلالية للعبث وعدم الجدوى دون أن يوحي بأن نعمة الله نفسها باطلة.
- source_word: τὴν χάριν τοῦ θεοῦ
  choice: نعمة الله
  rationale: «نعمة» المقابل اللاهوتي الراسخ والدقيق لـχάρις، والإضافة تنقل تركيب المضاف إليه مباشرة.
- source_word: δέξασθαι
  choice: تقبلوا
  rationale: ينقل معنى التلقي والقبول، وهو أنسب عربيًا هنا من تعبير قد يقتصر على الاستلام المادي.
- source_word: ὑμᾶς
  choice: كم في «نحثّكم» وواو الجماعة في «تقبلوا»
  rationale: ينقل المخاطَب الجمع في تركيب عربي طبيعي.
theological_decisions:
- issue: الشريك المضمر في «نعمل مع»
  choice: 'التصريح بأن الشريك هو الله: «نعمل مع الله»'
  alternative: «وإذ نعمل معًا» أو «وبصفتنا عاملين معًا» من غير تعيين الشريك
  rationale: يرجّح السياق المباشر الله، إذ يتناول عمله في المصالحة ودور الرسل سفراء عنه (5:18–20). غير أن اليونانية لا تصرّح بالمفعول، ولذلك حُفظ هذا القدر من الغموض في الحاشية بدل تقديم التفسير على أنه الاحتمال الوحيد.
- issue: معنى قبول النعمة «إلى فراغ»
  choice: «تقبلوا نعمة الله بلا ثمر»
  alternative: «تقبلوا نعمة الله عبثًا» أو «من دون جدوى»
  rationale: يحذر النص من تلقي النعمة على نحو لا يُنتج غايتها أو أثرها، من غير تقرير منظومة مذهبية بشأن كيفية عمل النعمة أو فقدانها.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كريمة وحاثّة. استُخدم «بلا ثمر» بدل «باطلًا» لتجنب التباس يوحي بوصف نعمة الله نفسها بالبطلان، مع الحفاظ على معنى انعدام الأثر المقصود.
