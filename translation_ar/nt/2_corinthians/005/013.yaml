  text: εἴτε γὰρ ἐξέστημεν, θεῷ· εἴτε σωφρονοῦμεν, ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/013.yaml
  text: For if we are out of our minds[a], it is for God; if we are of sound mind[b], it is for you.
translation:
  language: ar
  text: لِأَنَّنَا إِنْ كُنَّا قَدْ فَقَدْنَا صَوَابَنَا، فَلِلَّهِ؛ وَإِنْ كُنَّا عَاقِلِينَ، فَلَكُمْ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἴτε ... εἴτε
  choice: إِنْ ... وَإِنْ
  rationale: ينقل هذا التركيب الشرطي المتكرر مع إبقاء قوة المقابلة بين الاحتمالين، ويأتي طبيعيًّا في العربية.
- source_word: γὰρ
  choice: لِأَنَّنَا
  rationale: يحفظ وظيفة γάρ التفسيرية والسببية وصلته بما سبقه.
- source_word: ἐξέστημεν
  choice: كُنَّا قَدْ فَقَدْنَا صَوَابَنَا
  rationale: ينقل معنى الخروج عن العقل أو الظهور بمظهر فاقد الصواب، ويحافظ كذلك على الصيغة الماضية للفعل اليوناني من غير أن يحسم هل الكلام عن جنون حقيقي أم عن انطباع الآخرين.
- source_word: θεῷ
  choice: فَلِلَّهِ
  rationale: يحافظ على إيجاز الداتيف اليوناني والتباسه المقبول بين التوجّه إلى الله وكون الأمر لأجله، من غير إضافة تفسير غير مصرح به.
- source_word: σωφρονοῦμεν
  choice: عَاقِلِينَ
  rationale: تعبير عربي واضح وموجز يدل على سلامة العقل ورزانة الحكم، ويقيم مقابلة مباشرة مع فقدان الصواب.
- source_word: ὑμῖν
  choice: فَلَكُمْ
  rationale: يحافظ على التوازي مع «فلله» وعلى إيجاز الداتيف، ويمكن أن يفهم بمعنى المنفعة أو التوجّه إلى المخاطبين.
theological_decisions:
- issue: دلالة وصف بولس المتقابل لحاله
  choice: الإبقاء على المقابلة بين ما قد يبدو فقدانًا للصواب وبين التصرف بعقل ورزانة، من غير تقرير أن بولس يقر بجنون فعلي.
  alternative: تفسير العبارة صراحة بأنها اختبار وجد ديني، أو بأنها مجرد اتهام تهكمي من الآخرين.
  rationale: النص اليوناني موجز وبلاغي، ولا يحدد وحده طبيعة الحالة المقصودة؛ لذلك تحفظ الصياغة التوتر والغموض بدل فرض تفسير لاهوتي بعينه.
translation_notes:
  register: 'عربية فصحى معاصرة واضحة ووقورة. استُخدم التشكيل الجزئي للتوضيح، وحوفظ على الإيجاز والتوازي البلاغي في الأصل: «فلله ... فلكم».'
