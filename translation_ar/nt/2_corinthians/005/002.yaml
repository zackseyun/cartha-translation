  text: For indeed in this we groan[a], longing to put on our dwelling from heaven[b],
translation:
  language: ar
  text: فإننا في هذا أيضًا نئنّ، مشتاقين إلى أن نلبس[a] مسكننا الذي من السماء[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أن يفيد الفعل اليوناني معنى «نلبس فوق ما علينا»، كما يُلبس الثوب الخارجي فوق ثوب آخر.
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «مسكننا من السماء»؛ فالعبارة تشدد على منشأ المسكن.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: فإننا ... أيضًا
  rationale: تنقل «فـإن» القوة التفسيرية والتوكيد الخفيف في γὰρ، وتحفظ «أيضًا» دلالة καί في سياق الارتباط بما سبق.
- source_word: ἐν τούτῳ
  choice: في هذا
  rationale: صياغة قريبة من الأصل تحفظ إبهام اسم الإشارة، فلا تعيّنه صراحةً بأنه «هذه الخيمة» أو «هذه الحال».
- source_word: στενάζομεν
  choice: نئنّ
  rationale: تعبّر عن ثقل داخلي مصحوب بالتوق، من غير أن تضيف تفسيرًا مثل الحزن أو الشكوى.
- source_word: τὸ οἰκητήριον ἡμῶν τὸ ἐξ οὐρανοῦ
  choice: مسكننا الذي من السماء
  rationale: تحفظ استعارة المسكن ودلالة المنشأ في ἐξ οὐρανοῦ، بدل تحويل العبارة إلى صفة قد تفيد النوع أو الصفة فقط.
- source_word: ἐπενδύσασθαι
  choice: أن نلبس
  rationale: تحفظ استعارة اللباس بلغة عربية مفهومة، مع بيان معنى اللبس فوق لباس قائم في الحاشية بدل إثقال المتن.
- source_word: ἐπιποθοῦντες
  choice: مشتاقين
  rationale: تنقل شدة الرغبة الملازمة للأنين بصياغة عربية طبيعية ورصينة.
theological_decisions:
- issue: طبيعة المسكن السماوي واستعارة اللباس
  choice: الإبقاء على تداخل صورتي المسكن واللباس من غير تعيين المقصود عقائديًا
  alternative: التصريح بأنه «جسد القيامة» أو «البيت السماوي»
  rationale: لا تحسم الآية وحدها هل المقصود تحديدًا جسد القيامة أم حالة وسيطة أم مسكنًا أخرويًا بمعنى أضيق؛ لذلك يحفظ النص توتر الصورة وغموضها المشروع.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. أُبقيت عبارة «في هذا» عامةً، وحُفظ التداخل المقصود بين استعارة السكن واستعارة اللباس من غير تسويته أو شرحه داخل المتن.
