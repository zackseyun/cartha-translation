id: 2CO.5.21
reference: 2 Corinthians 5:21
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ⸀τὸν μὴ γνόντα ἁμαρτίαν ὑπὲρ ἡμῶν ἁμαρτίαν ἐποίησεν, ἵνα ἡμεῖς γενώμεθα δικαιοσύνη θεοῦ ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/021.yaml
  text: He made the one who did not know sin to be sin for us[b][a], so that in him we might become the righteousness of God.
translation:
  language: ar
  text: فالذي لم يعرف خطيئة، جعله الله خطيئةً لأجلنا[a]، لكي نصير نحن فيه بِرَّ الله[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ذبيحة خطيئة». يقول النص اليوناني «خطيئة» في الموضعين، ويفهم بعضهم الموضع الثاني فهماً ذبائحياً.'
    reason: alternative_reading
  - marker: b
    text: 'أو: «عدل الله»، أو «البِرّ الآتي من الله».'
    reason: lexical_alternative
lexical_decisions:
- source_word: γνόντα
  choice: عرف
  rationale: يحافظ «لم يعرف خطيئة» على التعبير اليوناني المكثف، ويدل في السياق على عدم مشاركة المسيح الشخصية في الخطيئة، من غير تحويله تفسيرياً إلى «لم يرتكب خطيئة».
- source_word: ἁμαρτίαν (first occurrence)
  choice: خطيئة
  rationale: الاسم المجرّد هو المفعول به المباشر لـ«عرف»، وترجمته كما هي تحفظ صياغة بولس.
- source_word: ὑπὲρ ἡμῶν
  choice: لأجلنا
  rationale: ينقل المعنى النيابي أو النفعي الواسع لحرف الجر من غير حصره في نموذج كفّاري بعينه.
- source_word: ἁμαρτίαν (second occurrence)
  choice: خطيئة
  rationale: تكرار اللفظ نفسه يحافظ على العبارة الصادمة والمقصودة في اليونانية؛ أما احتمال «ذبيحة خطيئة» فمذكور في الحاشية.
- source_word: ἐποίησεν
  choice: جعله
  rationale: «جعل» مقابل عربي طبيعي وواسع لـποιέω في هذا التركيب، ولا يفرض تحديداً ميتافيزيقياً زائداً.
- source_word: γενώμεθα
  choice: نصير
  rationale: ينقل معنى الصيرورة وصيغة الغرض الاحتمالية التابعة لـἵνα، بدلاً من تسطيحها إلى حالة ساكنة.
- source_word: δικαιοσύνη
  choice: بِرّ
  rationale: «بِرّ» هو المقابل العربي المألوف في السياق البولسي، مع إبقاء احتمال «عدل» في الحاشية.
- source_word: θεοῦ
  choice: الله
  rationale: تركيب «بِرّ الله» يبقي الإضافة مفتوحة لاحتمالات المصدر أو الملكية أو العلاقة، كما في الأصل.
- source_word: ἐν αὐτῷ
  choice: فيه
  rationale: يحافظ على التعبير البولسي المختصر والمهم لاهوتياً، من غير توسيعه تفسيرياً إلى «في اتحادنا به».
theological_decisions:
- issue: معنى «جعله خطيئة»
  choice: الإبقاء على صياغة بولس «جعله خطيئة» مع تأكيد الجملة السابقة أن المسيح لم يعرف خطيئة، فلا تفيد العبارة أنه صار خاطئاً أخلاقياً.
  alternative: «جعله ذبيحة خطيئة»
  rationale: النص اليوناني يكرر كلمة «خطيئة»، ولذلك تُحفظ حدة العبارة والتوتر اللاهوتي في المتن، ويُذكر الفهم الذبائحي الممكن في الحاشية من غير فرضه.
- issue: دلالة δικαιοσύνη θεοῦ
  choice: بِرّ الله
  alternative: عدل الله، أو البِرّ الآتي من الله
  rationale: الإضافة اليونانية كثيفة وقابلة لأن تدل على بِرّ الله نفسه أو البِرّ الصادر منه أو العلاقة به؛ لذا لا يحسم المتن وجهاً واحداً.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُخدم «خطيئة» في الموضعين للمحافظة على التكرار، و«بِرّ الله» لصون إيجاز الإضافة وغموضها المقصود. صُرّح باسم «الله» بوصفه فاعل «جعل» لأن العربية تحتاج إلى مرجع واضح، وهو مستفاد من السياق السابق في اليونانية.
