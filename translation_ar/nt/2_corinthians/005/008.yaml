source:
  edition: SBLGNT
  text: θαρροῦμεν δὲ καὶ εὐδοκοῦμεν μᾶλλον ἐκδημῆσαι ἐκ τοῦ σώματος καὶ ἐνδημῆσαι πρὸς τὸν κύριον·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/008.yaml
  text: So we are confident and would rather be away from the body and at home with the Lord[a].
translation:
  language: ar
  text: فنحن واثقون، ونفضّل بالأحرى أن نغترب عن الجسد ونستوطن عند الرب.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أن نكون غائبين عن الجسد وحاضرين عند الرب».'
    reason: بديل معجمي يعبّر عن الفعلين اليونانيين بلفظي الغياب والحضور بدل صورة الاغتراب والاستيطان.
lexical_decisions:
- source_word: θαρροῦμεν
  choice: نحن واثقون
  rationale: ينقل الفعل المضارع الدال على ثقة وشجاعة ثابتتين بعبارة عربية طبيعية واضحة.
- source_word: δὲ
  choice: فـ
  rationale: تفيد هنا مواصلة الاستنتاج من السياق السابق أكثر من إفادة تضاد قوي، والفاء تلائم هذا الترابط.
- source_word: καὶ
  choice: و
  rationale: حرف عطف يصل بين الثقة والتفضيل من غير إضافة توكيد غير لازم.
- source_word: εὐδοκοῦμεν μᾶλλον
  choice: نفضّل بالأحرى
  rationale: ينقل معنى الرضا المصحوب بالمفاضلة، ويحافظ على القوة المقارنة التي يحملها μᾶλλον.
- source_word: ἐκδημῆσαι
  choice: أن نغترب
  rationale: يحافظ على صورة الابتعاد عن الموطن الكامنة في الفعل وعلى مقابلتها بالفعل ἐνδημῆσαι، من غير التصريح بالموت.
- source_word: ἐκ τοῦ σώματος
  choice: عن الجسد
  rationale: ترجمة مباشرة لعلاقة الانفصال مع إبقاء الجسد لفظًا صريحًا كما في اليونانية.
- source_word: ἐνδημῆσαι
  choice: نستوطن
  rationale: يحافظ على استعارة الإقامة في الوطن، ويكوّن مقابلة لفظية طبيعية مع «نغترب».
- source_word: πρὸς τὸν κύριον
  choice: عند الرب
  rationale: في هذا التركيب يدل πρός على الحضور لدى الرب والوجود في صحبته؛ و«عند الرب» تلائم فعل الاستيطان من غير إلغاء دلالة القرب الشخصي.
theological_decisions:
- issue: هل تُصرَّح الآية بالموت أو بالسماء بوصفهما تفسيرًا للحالة المذكورة؟
  choice: الإبقاء على صورة الاغتراب عن الجسد والاستيطان عند الرب من غير إضافة «بعد الموت» أو «في السماء».
  alternative: «أن نموت ونذهب لنكون مع الرب في السماء».
  rationale: تشير الآية بقوة إلى الحضور عند الرب بعيدًا عن الجسد، لكنها لا تذكر الموت أو السماء صراحة؛ لذلك تحفظ الترجمة الصورة والتوتر اللاهوتي من غير توسع تفسيري.
- issue: كيفية التعبير عن πρὸς τὸν κύριον مع استعارة الاستيطان
  choice: «عند الرب»
  alternative: «مع الرب»
  rationale: «عند الرب» تحفظ معنى الحضور والقرب وتنسجم مع صورة الاستيطان؛ أما «مع الرب» فهي بديل صحيح يبرز الصحبة الشخصية بصورة أوضح.
translation_notes:
  register: عربية فصحى حديثة ذات نبرة كتابية كريمة وواضحة. استُخدمت المقابلة «نغترب/نستوطن» للحفاظ على التوازي الاستعاري في اليونانية، مع تجنب ألفاظ تفسيرية غير واردة في النص.
