  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Εἰδότες οὖν τὸν φόβον τοῦ κυρίου ἀνθρώπους πείθομεν, θεῷ δὲ πεφανερώμεθα· ἐλπίζω δὲ καὶ ἐν ταῖς συνειδήσεσιν ὑμῶν πεφανερῶσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/011.yaml
  text: Therefore[a], knowing the fear of the Lord, we persuade people; but we have been made known to God[b], and I hope that we also have been made known in your consciences.
translation:
  language: ar
  text: لذلك، وإذ نعرف مخافة الرب[a]، نقنع الناس؛ لكننا قد انكشفنا أمام الله، وأرجو أن نكون قد انكشفنا أيضًا لضمائركم[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أن تُفهم «مخافة الرب» أيضًا بمعنى الهيبة الموقَّرة أمام الرب، ولا سيما في ضوء ذكر كرسي الدينونة في الآية السابقة.
    reason: lexical_alternative
  - marker: b
    text: 'أو: «قد صرنا معروفين لدى الله، وأرجو أن نكون قد صرنا معروفين أيضًا في ضمائركم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰδότες
  choice: إذ نعرف
  rationale: يحفظ معنى اسم الفاعل مع دلالته الحالية، ويتيح فهم الصلة السببية بالسياق دون حسمها بأداة صريحة مثل «لأننا».
- source_word: οὖν
  choice: فـ
  rationale: تفيد التفريع والاستنتاج من ذكر كرسي المسيح والدينونة في الآية السابقة، وهي طبيعية في العربية.
- source_word: φόβον τοῦ κυρίου
  choice: مخافة الرب
  rationale: تعبير كتابي عربي راسخ يحفظ قوة «الخوف» ولا يختزله في الاحترام، مع إمكان اشتماله على الهيبة والمساءلة.
- source_word: ἀνθρώπους
  choice: الناس
  rationale: يدل اللفظ اليوناني هنا على البشر عمومًا، لا على الذكور وحدهم.
- source_word: πείθομεν
  choice: نقنع
  rationale: ينقل الفعل المضارع المباشر دون إضعافه إلى «نحاول أن نقنع»؛ وقد يحمل بحسب السياق معنى السعي إلى الإقناع.
- source_word: θεῷ δὲ πεφανερώμεθα
  choice: أما أمام الله فنحن مكشوفون
  rationale: يعبر عربيًا بصورة طبيعية عن كون حقيقة بولس ورفقائه ظاهرة تمامًا لله، ويحفظ الحالة الناتجة التي يدل عليها التام المبني للمجهول.
- source_word: ἐλπίζω
  choice: أرجو
  rationale: مقابل طبيعي في العربية للرجاء الشخصي الذي يعبّر عنه بولس.
- source_word: ἐν ταῖς συνειδήσεσιν ὑμῶν
  choice: في ضمائركم
  rationale: يحفظ حرف الجر والجمع اليوناني، مشيرًا إلى الإدراك الأخلاقي الباطني لدى المخاطَبين.
- source_word: πεφανερῶσθαι
  choice: أن نكون مكشوفين
  rationale: يواصل معنى φανερόω في الجملة السابقة ويحفظ دلالة الحالة القائمة، بصياغة عربية مفهومة.
theological_decisions:
- issue: دلالة «مخافة الرب» في سياق كرسي الدينونة
  choice: مخافة الرب
  alternative: الهيبة أمام الرب / توقير الرب
  rationale: السياق السابق عن الوقوف أمام كرسي المسيح يقتضي إبقاء عنصر الخوف والمساءلة مع عدم نفي الهيبة والتوقير؛ وترجمة اللفظ بالتوقير وحده تضعف حدته.
- issue: دلالة φανερόω بالنسبة إلى الله وضمائر الكورنثيين
  choice: مكشوفون
  alternative: معروفون / ظاهرون
  rationale: «مكشوفون» توضح أن حقيقة الرسل بادية بلا خفاء أمام الله، ويرجو بولس أن تكون كذلك في حكم ضمائر المخاطَبين، دون إضافة حكم عقائدي غير منصوص عليه.
- issue: طبيعة فعل πείθομεν
  choice: نقنع الناس
  alternative: نسعى إلى إقناع الناس
  rationale: الصيغة اليونانية خبرية مباشرة؛ لذا لا تُضعف بإضافة «نسعى»، مع بقاء إمكان فهمها عمليًا بوصفها نشاطًا إقناعيًا لا ضمانًا لاستجابة كل إنسان.
translation_notes:
  register: صياغة عربية فصحى واضحة وموقرة. استُعملت «مخافة» للمحافظة على قوة التعبير الكتابي، و«مكشوفون» لإفادة الظهور التام بصورة طبيعية. وُضعت علامتا الحاشية في المتن وربطتا بالبدائل الدلالية المناسبة.
