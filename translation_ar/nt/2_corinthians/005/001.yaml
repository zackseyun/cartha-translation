  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Οἴδαμεν γὰρ ὅτι ἐὰν ἡ ἐπίγειος ἡμῶν οἰκία τοῦ σκήνους καταλυθῇ, οἰκοδομὴν ἐκ θεοῦ ἔχομεν οἰκίαν ἀχειροποίητον αἰώνιον ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/001.yaml
  text: For we know that if our earthly tent-house is torn down[a], we have a building from God, a house not made with hands[d][c][b], eternal in the heavens.
translation:
  language: ar
  text: فنحن نعلم أنه إن نُقِضَ بيتُ خيمتنا الأرضي[a]، فلنا بناءٌ من الله، بيتٌ غير مصنوع بأيدٍ[b]، أبديٌّ في السماوات[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًّا: «بيت خيمتنا الأرضي». ويمكن ترجمة «نُقِضَ» أيضًا: «هُدِمَ» أو «فُكِّكَ»؛ فالفعل يلائم صورة تفكيك الخيمة.'
    reason: lexical_alternative
  - marker: b
    text: 'أي: غير مصنوع بأيدٍ بشرية. يدل التعبير على أن مصدره إلهي لا بشري.'
    reason: lexical_alternative
  - marker: c
    text: يقول النص اليوناني «لنا» بصيغة الحاضر، لا «سيكون لنا»، فيُبقي التوتر بين الامتلاك الحاضر والتحقق المستقبلي. كما أن «السماوات» جاءت بصيغة الجمع.
    reason: alternative_reading
lexical_decisions:
- source_word: Οἴδαμεν γὰρ
  choice: فنحن نعلم
  rationale: «نعلم» تنقل المعرفة الراسخة، والفاء تصل العبارة بما قبلها بوصفها تعليلًا أو أساسًا له.
- source_word: ἐὰν ... καταλυθῇ
  choice: إن نُقِضَ
  rationale: الفعل يحتمل النقض أو الهدم، و«نُقِضَ» يلائم تفكيك الخيمة ويحافظ على صورة المسكن.
- source_word: ἡ ἐπίγειος ἡμῶν οἰκία τοῦ σκήνους
  choice: بيت خيمتنا الأرضي
  rationale: يحافظ التعبير على عنصري البيت والخيمة في اليونانية، من غير استبدالهما تفسيريًا بكلمة «الجسد».
- source_word: οἰκοδομὴν ἐκ θεοῦ
  choice: بناءٌ من الله
  rationale: تُفهم οἰκοδομή هنا فهمًا عينيًا بمعنى بناء، و«من الله» تحفظ دلالة المصدر في ἐκ θεοῦ.
- source_word: ἔχομεν
  choice: فلنا
  rationale: «لنا» تؤدي معنى الامتلاك في الزمن الحاضر، فلا تحوّل صيغة المضارع اليونانية إلى مستقبل.
- source_word: οἰκίαν ἀχειροποίητον
  choice: بيتٌ غير مصنوع بأيدٍ
  rationale: صياغة طبيعية ذات صدى كتابي، وتحفظ المقابلة بين ما مصدره الله وما تصنعه الأيدي.
- source_word: αἰώνιον
  choice: أبديٌّ
  rationale: ينقل دوام البيت السماوي في مقابل المسكن الأرضي الزائل.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: في السماوات
  rationale: يحفظ صيغة الجمع الواردة في النص اليوناني.
theological_decisions:
- issue: مرجع صور البيت والخيمة والبناء
  choice: الإبقاء على الصور المعمارية وصورة الخيمة في المتن
  alternative: إن هُدم جسدنا الأرضي
  rationale: النص يجمع عمدًا بين البيت والخيمة والبناء، واستبدالها بـ«الجسد» يحسم تفسير الصورة داخل الترجمة.
- issue: القوة الزمنية لـ ἔχομεν
  choice: فلنا
  alternative: فسيكون لنا
  rationale: الفعل اليوناني في المضارع. تحافظ الترجمة على التوتر بين الامتلاك الحاضر والتحقق المستقبلي، بدل حسمه لاهوتيًا.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. حُفظت صور البيت والخيمة والبناء، واستُعمل «فلنا» بوصفه تعبيرًا عربيًا طبيعيًا عن الامتلاك الحاضر، مع إبقاء مواضع الاحتمال والتوتر التفسيري في الحواشي.
