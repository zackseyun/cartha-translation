source:
  edition: SBLGNT
  text: τοὺς γὰρ πάντας ἡμᾶς φανερωθῆναι δεῖ ἔμπροσθεν τοῦ βήματος τοῦ Χριστοῦ, ἵνα κομίσηται ἕκαστος τὰ διὰ τοῦ σώματος πρὸς ἃ ἔπραξεν, εἴτε ἀγαθὸν εἴτε ⸀φαῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/010.yaml
  text: For we all must be revealed before the judgment seat of Messiah[a], so that each one may receive what is due for what he has done in the body[d][c][b], whether good or bad.
translation:
  language: ar
  text: لأنه لا بد أن نُكشَف جميعًا أمام كرسي دينونة المسيح[a]، لكي ينال كل واحد ما يستحقه بحسب ما فعله في الجسد[b]، خيرًا كان أم رديئًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أن نظهر جميعًا أمام كرسي دينونة المسيح». يمكن أن يدل الفعل اليوناني على مجرد الظهور أو على الانكشاف علنًا؛ وأُثبت المعنى الأقوى في المتن.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «بحسب ما فعله بواسطة الجسد». العبارة اليونانية مضغوطة، وقد تشير إلى الأعمال التي أُنجزت من خلال الجسد، أي في الحياة الجسدية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φανερωθῆναι
  choice: نُكشَف
  rationale: يحفظ دلالة الظهور العلني والانكشاف أمام القضاء، وهي أقوى من مجرد الحضور، مع إبقاء احتمال معنى «نظهر» في الحاشية.
- source_word: βήματος
  choice: كرسي دينونة
  rationale: يشير اللفظ في هذا السياق إلى منصة قضائية يجري أمامها التقييم؛ وهذه العبارة واضحة وطبيعية في العربية.
- source_word: Χριστοῦ
  choice: المسيح
  rationale: ينقل اللقب اليوناني Χριστός بمقابله العربي المألوف «المسيح».
- source_word: κομίσηται
  choice: ينال ... ما يستحقه
  rationale: يعبّر الفعل في السياق عن تلقّي الجزاء الموافق للأعمال، من غير تحديد مسبق لطبيعة ذلك الجزاء.
- source_word: ἕκαστος
  choice: كل واحد
  rationale: يحفظ القوة التوزيعية للمفرد ويبرز المسؤولية الفردية.
- source_word: τὰ διὰ τοῦ σώματος πρὸς ἃ ἔπραξεν
  choice: ما يستحقه بحسب ما فعله في الجسد
  rationale: صياغة عربية طبيعية تحفظ علاقة المقابلة بين ما يناله الشخص وما فعله، وتفهم الجسد بوصفه مجال الحياة المتجسدة، مع إثبات الدلالة الآلية المحتملة لحرف الجر في الحاشية.
- source_word: ἀγαθὸν ... φαῦλον
  choice: خيرًا ... أم رديئًا
  rationale: يحفظ التقابل الأخلاقي الواسع؛ و«رديئًا» ينقل معنى φαῦλον من غير تضييقه بالضرورة إلى أقصى درجات الشر.
theological_decisions:
- issue: طبيعة التقييم أمام المسيح ونطاقه
  choice: الإبقاء على لغة المسؤولية الشاملة والجزاء الفردي من غير تحديد الفئة المقصودة أو نوع الحكم ونتيجته.
  alternative: تفسير الحدث بأنه خاص بمكافآت المؤمنين، أو بأنه الدينونة النهائية لجميع البشر.
  rationale: تثبت الآية ضرورة الانكشاف أمام كرسي دينونة المسيح وتلقي كل واحد ما يوافق أفعاله، لكنها لا تحسم وحدها التفصيلات النظامية المتعلقة بنطاق الدينونة أو نتائجها.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُخدمت «لا بد أن» لنقل معنى الضرورة، و«كرسي دينونة» لإبراز المشهد القضائي. وُضعت علامتا الحاشية [a] و[b] في المتن وفق ترتيب ظهورهما.
