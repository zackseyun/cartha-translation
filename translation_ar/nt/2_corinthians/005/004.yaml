lexical_decisions:
- source_word: σκήνει
  choice: الخيمة
  rationale: يحفظ صورة الخيمة التي يستخدمها بولس للحياة الجسدية الحاضرة، ويربط الآية بسياقها القريب.
- source_word: στενάζομεν
  choice: نئنّ
  rationale: ينقل بوضوح وطأة المعاناة والتوق الأخروي، وهو أقوى في هذا السياق من «نتنهّد».
- source_word: βαρούμενοι
  choice: مثقلين
  rationale: يحفظ معنى اسم المفعول وحالة الثقل المصاحبة للأنين.
- source_word: ἐφ’ ᾧ
  choice: لأننا
  rationale: يفيد التعليل على نحو طبيعي، مع إبقاء الصلة بين الأنين وعدم الرغبة في التعرّي.
- source_word: ἐκδύσασθαι
  choice: أن نتعرّى
  rationale: يحفظ استعارة خلع الثياب من غير أن يفسرها صراحةً بوصفها حالة انفصال النفس عن الجسد.
- source_word: ἐπενδύσασθαι
  choice: أن نلبس فوق ما علينا
  rationale: يبرز دلالة الفعل المركب على ارتداء لباس فوق لباس موجود، ويحفظ المقابلة مع التعرّي.
- source_word: καταποθῇ
  choice: يبتلعَ
  rationale: يحفظ الصورة القوية التي تفيد التغلب الكامل والإزالة بالابتلاع.
- source_word: τὸ θνητόν
  choice: ما هو مائت
  rationale: يعكس الصفة اليونانية المحوّلة إلى اسم، من دون حصرها في معنى تجريدي مثل «الفناء».
- source_word: ζωῆς
  choice: الحياة
  rationale: صياغة عربية طبيعية تحافظ على التضاد بين الوجود المائت والحياة.
- source_word: καὶ γὰρ
  choice: فإننا
  rationale: تحفظ الصلة التفسيرية والتوكيدية بالسياق السابق بصياغة عربية واضحة غير متكلفة.
theological_decisions:
- issue: استعارة اللباس والحالة الوسيطة
  choice: الإبقاء على صورتي التعرّي ولبس لباس فوق الموجود من غير تعيين مخطط عقائدي للحالة الوسيطة.
  alternative: تفسير التعرّي صراحةً بأنه وجود بلا جسد، أو تفسير اللبس فوق الموجود صراحةً بأنه جسد القيامة وحده.
  rationale: النص اليوناني يعرض صورًا مجازية عن الوجود الجسدي والتحول الآتي؛ لذلك تحافظ الترجمة على التوتر اللاهوتي ولا تحسم ما لم يحسمه اللفظ نفسه.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة. حُفظت استعارتا الخيمة واللباس، واستُعمل «نئنّ مثقلين» لنقل شدة العبارة. ضُبط «يبتلعَ» بعد «لكي»، وصيغ المبني للمعلوم لأن «الحياة» هي الفاعل الدلالي في التركيب اليوناني، مع بيان البديل الأقرب إلى المبني للمجهول في الحاشية.
