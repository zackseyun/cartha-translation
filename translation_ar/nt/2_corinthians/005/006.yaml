  text: Θαρροῦντες οὖν πάντοτε καὶ εἰδότες ὅτι ἐνδημοῦντες ἐν τῷ σώματι ἐκδημοῦμεν ἀπὸ τοῦ κυρίου,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/006.yaml
  text: Therefore[a], we are always confident and know that while we are at home in the body, we are away from the Lord,
translation:
  language: ar
  text: لذلك نحن واثقون دائمًا، ونعلم أننا، ما دمنا مقيمين في الجسد، بعيدون[a] عن الرب.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «غائبون عن الرب». الفعل اليوناني ἐκδημοῦμεν يقابل «مقيمين»، ويمكن ترجمته: «نكون بعيدين» أو «نكون غائبين».'
    reason: بديل معجمي يحفظ التقابل بين الإقامة والغياب في الفعلين اليونانيين.
lexical_decisions:
- source_word: Θαρροῦντες
  choice: نحن واثقون
  rationale: اسم الفاعل المضارع يدل على حالة مستمرة من الثقة والشجاعة؛ وصيغ فعلًا اسميًا طبيعيًا في العربية مع إبقاء معنى الاستمرار من خلال «دائمًا».
- source_word: οὖν
  choice: لذلك
  rationale: تفيد الاستنتاج المبني على الكلام السابق عن الحياة والقيامة والمسكن السماوي.
- source_word: πάντοτε
  choice: دائمًا
  rationale: تنقل بوضوح معنى الاستمرار في كل حين.
- source_word: εἰδότες
  choice: ونعلم
  rationale: اسم فاعل تام ذو دلالة حاضرة يفيد معرفة راسخة؛ وصيغة الفعل أنسب للسياق العربي.
- source_word: ἐνδημοῦντες
  choice: ما دمنا مقيمين
  rationale: يحمل الفعل صورة الإقامة في الوطن أو البيت. «مقيمين» تعبير عربي طبيعي يحفظ معنى الاستقرار الحالي، وإن كان لا يستنفد وحده صورة الوطن الكامنة في اليونانية.
- source_word: ἐν τῷ σώματι
  choice: في الجسد
  rationale: عبارة مكانية تصف الوجود الجسدي الحاضر من غير إضافة «هذا»، التي لا يقتضيها النص.
- source_word: ἐκδημοῦμεν
  choice: فنحن بعيدون
  rationale: الفعل مقابل ἐνδημοῦντες ويدل على الوجود بعيدًا أو الغياب. «بعيدون» واضح وطبيعي ويحفظ التقابل المكاني، مع إثبات البديل «غائبون» في الحاشية.
- source_word: ἀπὸ τοῦ κυρίου
  choice: عن الرب
  rationale: حرف الجر يدل على الانفصال أو البعد، وتلائم «عن» الصفة «بعيدون». وتُرجم κύριος بـ«الرب».
theological_decisions:
- issue: التقابل المجازي بين الحياة في الجسد والوجود مع الرب
  choice: يعرض النص الوجود الجسدي الحاضر بوصفه إقامة في الجسد، ويقابله بالبعد عن الرب.
  alternative: فهم العبارة على أنها تعني انفصال المؤمن الكامل عن حضور المسيح، أو إدخال صياغة العدد التالي عن الغياب عن الجسد والحضور عند الرب.
  rationale: 'تحفظ الصياغة توتر النص كما هو: البعد هنا يتعلق بعدم الوجود بعدُ مع الرب بالمعنى المرتقب، من غير أن تحسم أن المؤمن منفصل تمامًا عن حضور المسيح أو أن تستبق ما يقوله العدد التالي.'
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة الأسلوب. استُعملت جملتان فعليتان مترابطتان بدل إبقاء أسماء الفاعل اليونانية على نحو متكلف، مع الحفاظ على الاستمرار والمنطق الاستنتاجي والتقابل المكاني.
