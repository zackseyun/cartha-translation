  rationale: صُحّح التركيب العربي المتعلق بالجواب على الخصوم بإضافة «على»، واستُبدلت «نُزكّي» بـ«نوصي» لتقريب معنى التوصية بالنفس في الأصل اليوناني. ولم يُحسم اتساع دلالة ὑπὲρ ἡμῶν، إذ بقيت «بنا» في المتن مع البدائل في الحاشية، كما حُفظ التقابل المفتوح بين المظهر والقلب.
