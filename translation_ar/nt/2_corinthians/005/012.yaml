source:
  edition: SBLGNT
  text: ⸀οὐ πάλιν ἑαυτοὺς συνιστάνομεν ὑμῖν, ἀλλὰ ἀφορμὴν διδόντες ὑμῖν καυχήματος ὑπὲρ ἡμῶν, ἵνα ἔχητε πρὸς τοὺς ἐν προσώπῳ καυχωμένους καὶ ⸂μὴ ἐν⸃ καρδίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/012.yaml
  text: We are not commending ourselves to you again[a], but giving you an opportunity to boast about us[b], so that you may have an answer for those who boast in outward appearance and not in heart.
translation:
  language: ar
  text: لسنا نعود فنوصي بأنفسنا إليكم، بل نعطيكم فرصةً للافتخار بنا[a]، لكي يكون لديكم ما تردّون به على الذين يفتخرون بالمظهر لا بالقلب[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «للافتخار من أجلنا» أو «نيابةً عنا».'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًّا: «الذين يفتخرون في الوجه لا في القلب»، أي بالظاهر لا بالباطن.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνιστάνομεν
  choice: نُزكّي
  rationale: يفيد الفعل هنا مدح الشخص أو تقديمه بما يثبت جدارته. و«نُزكّي أنفسنا» تعبير عربي واضح يلائم سياق نفي بولس ترويج نفسه.
- source_word: ἀφορμὴν
  choice: مناسبةً
  rationale: تدل الكلمة على منطلق أو مناسبة أو فرصة. و«مناسبة» تحافظ على صورة إعطاء أساس يتيح للكورنثيين الكلام عن بولس ورفقائه.
- source_word: καυχήματος
  choice: للافتخار
  rationale: يحفظ هذا الاختيار الصلة اللفظية بالفعل καυχωμένους اللاحق، من غير تحويل المعنى إلى مجرد رضا أو اعتزاز داخلي.
- source_word: ὑπὲρ ἡμῶν
  choice: بنا
  rationale: يجوز أن تفيد العبارة الافتخار بشأن بولس ورفقائه أو لمصلحتهم ونيابةً عنهم. «بنا» عربية طبيعية وتبقي المجال الدلالي مفتوحًا، مع ذكر البديل في الحاشية.
- source_word: ἵνα ἔχητε πρὸς
  choice: حتى يكون لديكم ما تجيبون به
  rationale: العبارة اليونانية موجزة، ومؤداها أن يكون لدى المخاطبين ما يقولونه في مواجهة أولئك الأشخاص. الصياغة العربية توضّح الاستجابة المضمرة من دون تحديد مضمونها.
- source_word: ἐν προσώπῳ
  choice: بالمظهر
  rationale: المعنى الحرفي «في الوجه»، لكنه في المقابلة مع القلب يشير طبيعيًا إلى الظاهر أو المظهر. تحافظ الحاشية على الصورة الأصلية.
- source_word: καυχωμένους
  choice: الذين يفتخرون
  rationale: يكرر هذا اللفظ جذر «الافتخار» الوارد قبلًا، كما يفعل النص اليوناني، ويحفظ النبرة البلاغية للآية.
- source_word: καρδίᾳ
  choice: القلب
  rationale: «القلب» المقابل المباشر والطبيعي، ويحفظ التقابل الكتابي بين الظاهر والباطن من غير استبداله بتفسير مثل «الإخلاص» أو «الحقيقة الداخلية».
- source_word: πάλιν
  choice: من جديد
  rationale: ينقل معنى التكرار بوضوح، ويبيّن أن بولس ينفي عودته إلى تزكية نفسه.
theological_decisions:
- issue: دلالة التقابل بين ἐν προσώπῳ وἐν καρδίᾳ
  choice: تقابل بين المظهر وما في القلب
  alternative: تقابل بين السمعة العلنية والإخلاص، أو بين الحضور الشخصي والاستعداد الباطني
  rationale: يحافظ النص على صورتَي «المظهر» و«القلب» وعلى التوتر بين الخارج والداخل، من غير اختزال القلب في فضيلة محددة أو فرض قراءة مذهبية أضيق.
- issue: جهة الافتخار في ὑπὲρ ἡμῶν
  choice: الافتخار بنا
  alternative: الافتخار نيابةً عنا أو من أجلنا
  rationale: يمكن أن تشير ὑπέρ إلى موضوع الافتخار أو إلى المناصرة والنيابة. اختيرت عبارة عربية موجزة طبيعية، وأُبقي احتمال النيابة في الحاشية بدل حسمه في المتن.
translation_notes:
  register: صياغة عربية فصحى حديثة وواضحة ذات نبرة كريمة. استُخدم «نُزكّي أنفسنا» لحفظ لغة التوصية وإثبات الجدارة في السياق، وتكررت لفظة «الافتخار» للمحافظة على الرابط البلاغي في اليونانية. وُضعت علامتا الحاشية [a] و[b] في المتن عند موضعيهما.
