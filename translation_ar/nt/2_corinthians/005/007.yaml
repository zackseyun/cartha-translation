  text: διὰ πίστεως γὰρ περιπατοῦμεν, οὐ διὰ εἴδους—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/007.yaml
  text: For we walk by faith[a], not by sight—
translation:
  language: ar
  text: لأننا نسلك بالإيمان[a]، لا بالعيان—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لا بالمظهر»، أو: «لا بما يُرى». يمكن للكلمة اليونانية أن تشير إلى الهيئة المرئية أو المظهر؛ واختير «العيان» للمحافظة على المقابلة مع «الإيمان».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ πίστεως
  choice: بالإيمان
  rationale: تفيد διά مع المضاف إليه الوسيلة أو الكيفية. و«بالإيمان» صياغة عربية موجزة وطبيعية تحفظ المقابلة مع «بالعيان».
- source_word: γὰρ
  choice: لأننا
  rationale: تفيد γάρ التعليل والشرح لما قبلها؛ ونقلها بـ«لأن» يوضح صلتها بالسياق مع دمج الضمير في الفعل.
- source_word: περιπατοῦμεν
  choice: نسلك
  rationale: الفعل يعني حرفيًا المشي، ويُستعمل مجازًا لطريقة العيش والتصرف. و«نسلك» يحفظ الصورة المجازية بأسلوب عربي كتابي مفهوم.
- source_word: οὐ διὰ εἴδους
  choice: لا بالعيان
  rationale: يمكن أن يدل εἶδος على الهيئة الظاهرة أو ما يُرى. و«العيان» يحفظ التقابل الموجز بين الإيمان والإدراك المرئي المباشر، من غير حصر المعنى في المظهر السطحي.
theological_decisions:
- issue: دلالة πίστις في هذا السياق البولسي
  choice: الإيمان
  alternative: الثقة؛ الأمانة
  rationale: المقابلة مع εἶδος ترجح معنى الاعتماد الإيماني في مقابل ما يُعايَن، لا معنى الأمانة بوصفها صفة سلوكية. وتحفظ «الإيمان» المصطلح من غير إضافة تفسير عقائدي غير مصرح به.
- issue: مدى دلالة εἶδος
  choice: العيان
  alternative: المظهر؛ ما يُرى
  rationale: «العيان» يلائم التقابل مع الإيمان، لكنه لا يلغي إمكان دلالة اللفظ على الهيئة أو المظهر؛ لذلك تُذكر البدائل في الحاشية بدل حسم المجال الدلالي ضمن المتن.
translation_notes:
  register: عربية فصحى واضحة وموجزة ذات نبرة كريمة. استُعمل «نسلك» للمجاز الحياتي المألوف، و«العيان» للمقابلة البلاغية، مع إبقاء الشرطة الختامية لأنها تصل الآية بما يليها.
