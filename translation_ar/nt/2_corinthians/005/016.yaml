  terminology: «بحسب الجسد» و«المسيح» اختياران سليمـان في العربية الفصحى الحديثة. «المسيح» هو المقابل العربي المستقر للقب Χριστός، ولا يلزم تحويله إلى «الممسوح» في المتن. ينبغي أن تشرح الحاشية [b] هذا اللقب، لا أن تقدم تفسيرًا زائدًا للعبارة الختامية.
