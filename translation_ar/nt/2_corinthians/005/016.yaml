  text: Ὥστε ἡμεῖς ἀπὸ τοῦ νῦν οὐδένα οἴδαμεν κατὰ σάρκα· ⸀εἰ καὶ ἐγνώκαμεν κατὰ σάρκα Χριστόν, ἀλλὰ νῦν οὐκέτι γινώσκομεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/016.yaml
  text: So from now on we regard no one according to the flesh[a]. Even if we have known Messiah according to the flesh[b], yet now we no longer know him that way.
translation:
  language: ar
  text: لذلك، من الآن فصاعدًا، لا نعرف أحدًا بحسب الجسد[a]. وإن كنا قد عرفنا المسيح[b] بحسب الجسد، لكننا الآن لا نعود نعرفه هكذا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «من وجهة نظر بشرية» أو «وفق مقاييس دنيوية» لعبارة «بحسب الجسد».'
    reason: lexical_alternative
  - marker: b
    text: 'اليونانية: «Χριστόν»؛ أي «المسيح»، وهو لقب يعني «الممسوح».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: لذلك
  rationale: أداة استنتاج تصل هذه العبارة بالحجة السابقة بوضوح طبيعي.
- source_word: ἀπὸ τοῦ νῦν
  choice: من الآن فصاعدًا
  rationale: تعبير زمني يدل على تحول حاسم مستمر ابتداءً من الحاضر.
- source_word: οὐδένα οἴδαμεν
  choice: لا نعرف أحدًا
  rationale: يحافظ على لفظ المعرفة في اليونانية وعلى الصلة بين οἴδαμεν وγινώσκομεν، مع بقاء كيفية المعرفة محددة بالعبارة التالية.
- source_word: κατὰ σάρκα
  choice: بحسب الجسد
  rationale: يحفظ مصطلح بولس اللاهوتي وتوتره الدلالي بدل اختزاله في تفسير واحد مثل المقاييس البشرية أو الدنيوية.
- source_word: εἰ καὶ
  choice: وإن كنا
  rationale: صياغة عربية فصيحة تحافظ على البنية التنازلية وعلى إمكان فهمها بمعنى «حتى إن» أو «مع أننا» بحسب السياق.
- source_word: ἐγνώκαμεν
  choice: قد عرفنا
  rationale: تنقل الفعل الماضي مع إبراز تحقق المعرفة السابقة، من غير فرض دلالة زمنية عربية أثقل من الأصل.
- source_word: Χριστόν
  choice: المسيح
  rationale: «المسيح» المقابل العربي الراسخ للقب اليوناني Χριστός، ويحفظ معناه بوصفه لقبًا لا مجرد اسم.
- source_word: ἀλλὰ νῦν οὐκέτι γινώσκομεν
  choice: فإننا الآن لا نعود نعرفه هكذا
  rationale: يبين التضاد ويجعل المفعول وطريقة المعرفة مفهومين في العربية من السياق، دون الإيحاء بأن بولس لم يعد يعرف المسيح مطلقًا.
theological_decisions:
- issue: معنى κατὰ σάρκα عند الحديث عن الناس والمسيح
  choice: بحسب الجسد
  alternative: من وجهة نظر بشرية؛ وفق مقاييس دنيوية
  rationale: 'تبقي الصياغة عبارة بولس مفتوحة على مداها الدلالي: طريقة معرفة أو تقويم مرتبطة بالمجال البشري الأرضي، من غير أن تجعل الآية إنكارًا لإنسانية المسيح الحقيقية.'
- issue: دلالة الجملة الشرطية εἰ καὶ ἐγνώκαμεν
  choice: وإن كنا قد عرفنا
  alternative: ومع أننا قد عرفنا؛ وحتى إن كنا قد عرفنا
  rationale: الأصل يحتمل قوة تنازلية يمكن أن تُفهم تقريرية أو افتراضية بدرجات مختلفة؛ لذلك حُفظت صيغة عربية لا تحسم المسألة أكثر مما يحسمها اليوناني.
- issue: ترجمة Χριστός
  choice: المسيح
  alternative: مسيحًا؛ الممسوح
  rationale: «المسيح» هو اللقب العربي المفهوم والراسخ، ويؤدي معنى Χριστός من غير تحويله إلى اسم خالٍ من دلالته اللقبية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. أُبقيت عبارة «بحسب الجسد» في المتن لصون مصطلح بولس، واستُخدمت «نعرف» في الموضعين للمحافظة على التوازي اللفظي، مع إيضاح المقصود في الحاشية.
