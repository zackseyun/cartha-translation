  to: لذلك، من الآن فصاعدًا، لا نعرف أحدًا بحسب الجسد[a]. وإن كنا قد عرفنا المسيح[b] بحسب الجسد، لكننا الآن لا نعود نعرفه هكذا.
  rationale: أبقيت عبارة «بحسب الجسد» في المتن لصون اصطلاح بولس واتساعه الدلالي، وأبقيت الصيغة التنازلية «وإن كنا» من غير حسم الخلاف في قوة εἰ καί. وعدّلت أداة الربط الأخيرة إلى «لكننا» لتمثيل ἀλλά، وأعدت الحاشية [b] إلى «المسيح» لتتبع موضع Χριστόν وقرار الترجمة المتعلق باللقب.
