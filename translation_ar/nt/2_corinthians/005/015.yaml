  terminology: «مات»، و«لأجل»، و«لأنفسهم»، و«أُقيم» اختيارات سليمة ومناسبة للسجل الكتابي العربي الواضح. لا حاجة إلى فرض معنى «نيابةً عن» في المتن؛ وتبقى الإشارة إليه في الحاشية بديلًا معجميًا مناسبًا.
