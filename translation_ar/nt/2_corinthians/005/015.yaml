  source_fidelity: 'المسودة أمينة عمومًا للنص اليوناني: «لأجل الجميع» تنقل ὑπὲρ πάντων من غير حسم لاهوتي، و«أُقيم» يحافظ على مبنيّة ἐγερθέντι للمجهول. لكن «لا يعيش الأحياء في ما بعد» أضعف في نقل μηκέτι، إذ قد يُفهم منه نفي العيش في المستقبل بدل ترك نمط عيش سابق.'
