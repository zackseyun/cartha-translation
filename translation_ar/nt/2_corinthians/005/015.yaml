source:
  edition: SBLGNT
  text: καὶ ὑπὲρ πάντων ἀπέθανεν ἵνα οἱ ζῶντες μηκέτι ἑαυτοῖς ζῶσιν ἀλλὰ τῷ ὑπὲρ αὐτῶν ἀποθανόντι καὶ ἐγερθέντι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/015.yaml
  text: And he died for all[a], so that those who live might no longer live for themselves[b], but for the one who died and was raised for them.
translation:
  language: ar
  text: ومات لأجل الجميع[a]، لكي لا يعود الذين يحيون يعيشون لأنفسهم، بل للذي مات وأُقيم لأجلهم[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «نيابةً عن الجميع». تفيد ὑπέρ المنفعة أو النيابة، وينطبق ذلك أيضًا على «لأجلهم» لاحقًا في الآية.'
    reason: lexical_alternative
  - marker: b
    text: 'اليونانية بصيغة المبني للمجهول: «أُقيم». ويمكن في العربية أن يقال: «قام»، لكن ذلك لا يُظهر صيغة المبني للمجهول.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ πάντων
  choice: لأجل الجميع
  rationale: تفيد ὑπέρ مع المضاف إليه النيابة أو المنفعة. و«لأجل الجميع» عربية واضحة تحفظ شمول العبارة من غير أن تحسم نظرية بعينها في الكفارة.
- source_word: ἀπέθανεν
  choice: مات
  rationale: فعل ماضٍ يدل على الحدث الواقع، والفاعل مفهوم من السياق السابق.
- source_word: ἵνα
  choice: لكي
  rationale: تحفظ دلالة الغاية، مع احتمال تداخل الغاية والنتيجة في السياق.
- source_word: οἱ ζῶντες
  choice: الأحياء
  rationale: ترجمة مباشرة لاسم الفاعل المعرّف المستعمل استعمال الاسم، وتشير إلى الذين يحيون في المعنى المقصود في السياق.
- source_word: μηκέτι
  choice: لا ... في ما بعد
  rationale: تعبير عربي طبيعي يدل على انقطاع نمط سابق من العيش.
- source_word: ἑαυτοῖς ζῶσιν
  choice: يعيش ... لأنفسهم
  rationale: تفيد اللام اتجاه الحياة وغايتها؛ أي حياة متمحورة حول الذات.
- source_word: ἀλλὰ τῷ ... ἀποθανόντι καὶ ἐγερθέντι
  choice: بل للذي مات ... وأُقيم
  rationale: 'تستمر اللام في المقابلة: لا لأنفسهم بل للذي مات وأُقيم، مع الحفاظ على البنية الوصفية للفعلين.'
- source_word: ἐγερθέντι
  choice: أُقيم
  rationale: يحفظ صيغة المبني للمجهول في اليونانية، بدل تحويلها إلى فعل لازم مثل «قام».
- source_word: ὑπὲρ αὐτῶν
  choice: لأجلهم
  rationale: يكرر اللفظ العربي نفسه المستعمل مع ὑπὲρ πάντων، محافظًا على الترابط اللفظي ومعنى المنفعة أو النيابة.
theological_decisions:
- issue: مدى πάντων وإحالة αὐτῶν
  choice: «الجميع» و«هم» من غير تقييد للمرجع
  alternative: قصر «الجميع» على فئة لاهوتية محددة، أو تفسيرها صراحةً بأنها كل البشر بلا استثناء
  rationale: الآية تستعمل لفظًا واسعًا ولا تفصل هنا في الخلافات اللاحقة بشأن مدى الكفارة؛ لذلك تُحفظ العبارة كما هي من غير تضييق أو توسيع تفسيري.
- issue: صيغة القيامة في ἐγερθέντι
  choice: «أُقيم»
  alternative: «قام»
  rationale: المبني للمجهول أقرب إلى الصيغة اليونانية ويحفظ الإشارة الضمنية إلى عمل الله، من غير إنكار صحة صيغة «قام» في مواضع أخرى.
- issue: قوة ὑπέρ
  choice: «لأجل» مع توضيح احتمال «نيابةً عن» في الحاشية
  alternative: إثبات «نيابةً عن» في المتن
  rationale: «لأجل» تحفظ معنى المنفعة والنيابة الممكن معًا، ولا تفرض في المتن تحديدًا جدليًا يتجاوز ما تحسمه أداة الجر وحدها.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعملت «في ما بعد» لإظهار معنى μηκέτι طبيعيًا، وحُفظ التوازي بين «لأنفسهم» و«للذي»، كما حُفظ تكرار ὑπέρ بترجمة «لأجل» في الموضعين.
