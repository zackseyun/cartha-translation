id: 2CO.5.18
reference: 2 Corinthians 5:18
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: τὰ δὲ πάντα ἐκ τοῦ θεοῦ τοῦ καταλλάξαντος ἡμᾶς ἑαυτῷ ⸀διὰ Χριστοῦ καὶ δόντος ἡμῖν τὴν διακονίαν τῆς καταλλαγῆς,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/018.yaml
  text: All these things are from God[a], who reconciled us to himself through Messiah and gave us the ministry of reconciliation[c][b],
translation:
  language: ar
  text: وكلُّ هذه الأمور من الله[a]، الذي صالحنا لنفسه بالمسيح، وأعطانا خدمة المصالحة[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وكل شيء». قد تشير العبارة إلى جميع حقائق الواقع الجديد، أو على نحو أخص إلى الأمور المذكورة قبلاً في السياق.'
    reason: lexical_alternative
  - marker: b
    text: قد يشير ضمير «نا» إلى المؤمنين عمومًا، لكن السياق المحيط يبرز خصوصًا الخدمة الموكولة إلى بولس ورفقائه.
    reason: alternative_reading
lexical_decisions:
- source_word: τὰ δὲ πάντα
  choice: وكلُّ هذه الأمور
  rationale: تشير العبارة في سياقها إلى الحقائق المذكورة قبلاً، ولا سيما الخليقة الجديدة، مع إبقاء احتمال العموم. ونقلت δέ بواو استئنافية خفيفة طبيعية في العربية.
- source_word: ἐκ τοῦ θεοῦ
  choice: من الله
  rationale: تحفظ معنى المصدر والمنشأ الذي تدل عليه ἐκ.
- source_word: τοῦ καταλλάξαντος ἡμᾶς ἑαυτῷ
  choice: الذي صالحنا لنفسه
  rationale: حُوِّل اسم الفاعل اليوناني إلى جملة صلة عربية طبيعية، وتفيد «لنفسه» أن الله هو غاية المصالحة دون إضافة تفسير غير موجود في النص.
- source_word: διὰ Χριστοῦ
  choice: بالمسيح
  rationale: الباء واضحة وطبيعية للدلالة على الوساطة أو الوسيلة، و«المسيح» تنقل Χριστός بوصفه لقبًا.
- source_word: δόντος ἡμῖν
  choice: وأعطانا
  rationale: تنقل اسم الفاعل الثاني بفعل معطوف يشترك مع الأول في الفاعل، على نحو عربي سلس.
- source_word: τὴν διακονίαν τῆς καταλλαγῆς
  choice: خدمة المصالحة
  rationale: «خدمة» تنقل διακονία بصفتها خدمة موكولة أو مأمورية، والإضافة تحفظ إيجاز العبارة اليونانية وإمكان فهمها بوصف المصالحة مضمون الخدمة ومجالها.
theological_decisions:
- issue: دلالة Χριστοῦ
  choice: المسيح
  alternative: المسيح يسوع / كريستوس
  rationale: اللفظ هنا لقب يدل على الوسيط الذي به أجرى الله المصالحة، لذلك تُرجم معناه المألوف عربيًا دون تحويله إلى اسم منقول صوتيًا.
- issue: نطاق الضميرين ἡμᾶς وἡμῖν
  choice: نا في «صالحنا» و«أعطانا»
  alternative: المؤمنين عمومًا / بولس ورفقاءه الرسوليين خصوصًا
  rationale: لا تحسم اليونانية وحدها نطاق الضمير؛ فقد يشمل المؤمنين، بينما يبرز السياق القريب تكليف بولس ورفقائه. أبقى المتن الضمير كما هو وبيّنت الاحتمال في الحاشية.
- issue: معنى καταλλαγή
  choice: المصالحة
  alternative: إعادة العلاقة / التوفيق
  rationale: «المصالحة» المقابل العربي المباشر الذي يحفظ فكرة إزالة العداوة واستعادة العلاقة من غير توسيع تفسيري.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «صالحنا» بدل صيغة أثقل مثل «أجرى مصالحتنا»، و«خدمة المصالحة» للحفاظ على الإيجاز والنبرة الرسولية. وُضعت كل علامة حاشية في المتن، وجُمعت ملاحظة نطاق الضمير عند نهاية العبارة ذات الصلة.
