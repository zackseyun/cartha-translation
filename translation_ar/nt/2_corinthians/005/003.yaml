  text: if indeed[a], when we have been clothed, we will not be found naked.
translation:
  language: ar
  text: إن كنا حقًّا قد لبسنا، فلن نُوجَد عراةً.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إن كنا حقًّا، بعد أن نلبس، فلن نُوجَد بلا لباس».'
    reason: 'بديل لفظي وتركيبي: «بلا لباس» بدل «عراةً»، مع صياغة زمنية بديلة لاسم الفاعل اليوناني.'
lexical_decisions:
- source_word: εἴ γε
  choice: إنْ كنّا حقًّا
  rationale: تحافظ «إنْ» على معنى الشرط، وتنقل «حقًّا» قوة أداة التوكيد γε. أُضيف فعل الكينونة لإقامة تركيب عربي طبيعي من غير تحويل الشرط إلى تقرير يقيني.
- source_word: καὶ
  choice: بعد أن
  rationale: في هذا السياق تصل καί الفكرة الواردة في اسم الفاعل بالفعل المستقبل وتُبرز سبق فعل اللبس له؛ وصياغة «بعد أن» أوضح في العربية من نقلها آليًّا إلى «أيضًا».
- source_word: ἐνδυσάμενοι
  choice: نلبس
  rationale: اسم فاعل ماضٍ بصيغة الوسط من ἐνδύω، ومعناه الحرفي «بعد أن نكون قد لبسنا». أبقي مفعول اللبس غير مصرّح به كما في اليونانية، حفاظًا على الاستعارة وعلى عدم تعيين ما يُلبس داخل هذه الآية وحدها.
- source_word: οὐ
  choice: لن
  rationale: دخل النفي على فعل مستقبل، ولذلك تنقل «لن» النفي المستقبلي بوضوح.
- source_word: γυμνοὶ
  choice: عراةً
  rationale: هذا هو المعنى المباشر للكلمة، ويحفظ تقابل اللبس والعُري من غير تفسير المقصود اللاهوتي للعُري.
- source_word: εὑρεθησόμεθα
  choice: نُوجَد
  rationale: 'تنقل الصيغة المبنية للمجهول في المستقبل بمعناها السياقي: أن يتبيّن حالنا أو نُوجَد على حال معينة، مع إبقاء المبني للمجهول.'
theological_decisions:
- issue: دلالة استعارة اللبس والعري
  choice: الإبقاء على صورتي اللبس والعري من غير تفسير إضافي
  alternative: تفسير «عراة» بأنها تشير تحديدًا إلى حالة بلا جسد بين الموت والقيامة، أو إلى انعدام الجسد السماوي، أو إلى الخزي والانكشاف أمام الله
  rationale: لا تحسم ألفاظ هذه الآية وحدها المرجع اللاهوتي الكامل للاستعارة؛ لذا يحفظ النص توتر الصورة وغموضها المشروع.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقّرة. حافظت الصياغة على بنية الشرط وعلى استعارة اللباس، وتجنبت تعيين ماهية اللباس أو المقصود بالعري. وُضع ضبط محدود في «إنْ» و«نُوجَد» و«عراةً» لدفع الالتباس.
