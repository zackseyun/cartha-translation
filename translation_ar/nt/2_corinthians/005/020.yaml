source:
  edition: SBLGNT
  text: ὑπὲρ Χριστοῦ οὖν πρεσβεύομεν ὡς τοῦ θεοῦ παρακαλοῦντος δι’ ἡμῶν· δεόμεθα ὑπὲρ Χριστοῦ, καταλλάγητε τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/020.yaml
  text: 'Therefore[a], we are ambassadors for the Messiah, as though God were appealing through us[b]. We beg you on behalf of the Messiah: be reconciled to God.'
translation:
  language: ar
  text: 'لذلك نحن سفراء نيابةً عن المسيح[a]، وكأن الله يناشد بواسطتنا. نتوسل إليكم نيابةً عن المسيح: اقبلوا المصالحة إلى الله[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: اللفظ اليوناني Χριστός لقبٌ معناه «الممسوح»، وقد تُرجم هنا «المسيح».
    reason: بيان أن اللفظ لقب ذو معنى، لا مجرد اسم منقول صوتيًا.
  - marker: b
    text: 'أو: «مع الله».'
    reason: إثبات الوجه البديل في نقل صيغة τῷ θεῷ بعد فعل المصالحة.
lexical_decisions:
- source_word: ὑπὲρ Χριστοῦ
  choice: نيابةً عن المسيح
  rationale: تفيد ὑπέρ مع المضاف إليه معنى العمل لمصلحة شخص أو بالنيابة عنه. ويبرز «نيابةً عن» معنى التمثيل الذي يقتضيه سياق السفارة، بينما يحافظ «المسيح» على Χριστός بوصفه لقبًا.
- source_word: οὖν
  choice: لذلك
  rationale: تدل οὖν على نتيجة مترتبة على الكلام السابق عن المصالحة، و«لذلك» توضح هذا الترابط الاستدلالي بلغة عربية طبيعية.
- source_word: πρεσβεύομεν
  choice: نحن سفراء
  rationale: يعني الفعل القيام بعمل السفير أو المبعوث. والصياغة الاسمية العربية موجزة وطبيعية وتحفظ معنى الخدمة التمثيلية المستمرة.
- source_word: ὡς
  choice: وكأن
  rationale: 'تقدم ὡς صورة توضح كيفية عمل السفراء: كأن الله نفسه يوجه المناشدة بواسطتهم، من غير أن تلغي التمييز بينهم وبين الله.'
- source_word: παρακαλοῦντος
  choice: يناشد
  rationale: يحمل παρακαλέω هنا معنى الطلب الملح والدعوة الجادة في سياق المصالحة؛ و«يناشد» ينقل هذه النبرة بوضوح ووقار.
- source_word: δι’ ἡμῶν
  choice: من خلالنا
  rationale: تفيد διά مع المضاف إليه الوساطة أو الأداة؛ و«من خلالنا» تعبر طبيعيًا عن صدور مناشدة الله بواسطة الرسل.
- source_word: δεόμεθα
  choice: نتوسل إليكم
  rationale: يفيد δέομαι الطلب الشديد والملح. أُظهر المخاطب في العربية، وهو مفهوم من صيغة الأمر التالية، لتستقيم العبارة من غير تغيير جهة الخطاب.
- source_word: καταλλάγητε
  choice: تصالحوا
  rationale: الفعل أمر ماضوي مبني للمجهول يدعو المخاطبين إلى قبول المصالحة. لا تتيح العربية هنا صيغة مبنية للمجهول طبيعية غير ملتبسة، لذلك اختير «تصالحوا» بوصفها أوضح صياغة عربية مع إبقاء الله طرف المصالحة وعدم شرح آليتها.
- source_word: τῷ θεῷ
  choice: مع الله
  rationale: يأتي الاسم في حالة المجرور غير المباشر بعد فعل المصالحة، ويمكن فهمه باتجاه «إلى الله» أو بعلاقة «مع الله». «مع الله» هي العبارة العربية الطبيعية، مع إثبات البديل الأقرب إلى البنية اليونانية في الحاشية.
theological_decisions:
- issue: دلالة Χριστός بوصفه لقبًا
  choice: المسيح
  alternative: الممسوح
  rationale: «المسيح» هو المقابل العربي الراسخ الذي يظل لقبًا ذا دلالة، فلا يحوله إلى مجرد اسم علم ولا يحتاج إلى نقل صوتي أجنبي.
- issue: الصوت والفاعلية في المصالحة
  choice: تصالحوا مع الله
  alternative: كونوا مُصالَحين إلى الله
  rationale: يحافظ النص على توجيه الأمر إلى السامعين وعلى كون الله هو الذي يناشدهم، من غير تقرير تفصيلي لكيفية اجتماع فعل الله واستجابة الإنسان. أما نقل المبني للمجهول حرفيًا فينتج عبارة عربية ثقيلة وملتبسة.
- issue: صفة الخدمة الرسولية التمثيلية
  choice: سفراء نيابةً عن المسيح
  alternative: سفراء لأجل المسيح
  rationale: «نيابةً عن» توضح سلطة التمثيل التي يحملها سياق السفارة من غير مساواة السفراء بالمسيح أو بالله.
translation_notes:
  register: استُخدمت عربية فصحى معاصرة واضحة وموقرة. اختيرت ألفاظ مألوفة مثل «سفراء» و«يناشد» و«تصالحوا»، مع تجنب التراكيب الحرفية الثقيلة. وُضعت علامتا الحاشيتين [a] و[b] في موضعيهما من المتن.
