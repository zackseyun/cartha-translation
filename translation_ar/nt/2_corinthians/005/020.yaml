review_pass:
  verdict: revise
  source_fidelity: 'المعنى العام منقول بأمانة: الاستنتاج، والسفارة عن المسيح، ومناشدة الله بواسطة الرسل، والنداء إلى المصالحة. لكن «تصالحوا» فعلٌ لازم/انعكاسي في العربية يوحي بفعل متبادل من المخاطبين، ولا يحفظ بوضوح صيغة الأمر المبني للمجهول في καταλλάγητε ولا تلقي المصالحة. كما أن الحاشية [b] تعكس ترتيب البدائل في المسار الإنجليزي؛ فـ«إلى الله» هي الصياغة المختارة هناك و«مع الله» البديل.'
  naturalness: 'الصياغة فصيحة وواضحة عمومًا. «وكأن الله يناشد من خلالنا» سليمة، والأوضح في التعلق التركيبي: «وكأن الله يناشد بواسطتنا». والصيغة «كونوا مُصالَحين بالله» ثقيلة نسبيًا؛ لذلك تُستعمل «اقبلوا المصالحة مع الله» لتأدية النداء إلى تلقي المصالحة بلغة عربية طبيعية، مع أن ذلك يصرح باسم الحدث لتجنب التباس المبني للمجهول العربي.'
  terminology: «المسيح» و«سفراء» و«يناشد» مناسبة. «نيابةً عن المسيح» مقبول في سياق السفارة، وإن كان «من أجل المسيح» أقرب إلى اتساع ὑπέρ؛ ولا يلزم تغييره. تُصحح الحاشية الخاصة بـΧριστός لتذكر «المسيح» بوصفه الاختيار وتعرض «الممسوح» بوصفه معنى اللقب، لا بوصفهما بديلين متكافئين في هذا الموضع.
  issues:
  - severity: medium
    issue: صيغة «تصالحوا مع الله» لا تُظهر تلقي المصالحة الذي تؤديه صيغة الأمر المبني للمجهول καταλλάγητε بوضوح كافٍ.
    rationale: قد يفهم «تصالحوا» على أنه أمر بالمبادرة إلى فعل المصالحة أو بالفعل المتبادل، بينما يبقي اليوناني الفاعل غير مصرّح به ويأمر المخاطبين بأن يُصالَحوا. «اقبلوا المصالحة مع الله» أوضح عربيًا في حفظ هذا الاتجاه من غير تحديد آلية المصالحة.
  - severity: low
    issue: الحاشية [b] تجعل «إلى الله» بديلًا، مع أن مسار التدقيق الإنجليزي اختاره في المتن وجعل «مع الله» بديلًا.
    rationale: ينبغي أن يعكس المتن والحاشية ترتيب الاختيار المعتمد، وأن تظل الحاشية مرتبطة بموضعها.
  - severity: low
    issue: الحاشية [a] لا تبيّن بوضوح أن «المسيح» هو المقابل المختار للقب Χριστός، وقد توهم أن «الممسوح» بديل متساوٍ في المتن.
    rationale: إعادة صياغتها تجعل وظيفتها التفسيرية أدق من دون فرض تفسير مذهبي.
