- from: 'لذلك نحن سفراء نيابةً عن المسيح[a]، وكأن الله يناشد من خلالنا. نتوسل إليكم نيابةً عن المسيح: تصالحوا مع الله[b].'
  to: 'لذلك نحن سفراء نيابةً عن المسيح[a]، وكأن الله يناشد بواسطتنا. نتوسل إليكم نيابةً عن المسيح: اقبلوا المصالحة إلى الله[b].'
  rationale: تُستبدل «تصالحوا» بـ«اقبلوا المصالحة» لصون دلالة الأمر المبني للمجهول وتلقي المصالحة في عربية واضحة. ويُختار «إلى الله» في المتن اتساقًا مع قرار المسار الإنجليزي، مع إبقاء «مع الله» بديلًا طبيعيًا في الحاشية. ولا يضيف النص تفسيرًا لاهوتيًا للفاعل في المصالحة.
