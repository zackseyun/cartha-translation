  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὥστε εἴ τις ἐν Χριστῷ, καινὴ κτίσις· τὰ ἀρχαῖα παρῆλθεν, ἰδοὺ γέγονεν ⸀καινά·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/017.yaml
  text: So then[a], if anyone is in Messiah, there is a new creation; the old things have passed away; behold[b], new things have come.
translation:
  language: ar
  text: إذًا، إن كان أحدٌ في المسيح، فهناك خليقة جديدة[a]؛ قد مضت الأمور القديمة، وها[b] قد صارت أمور جديدة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فهو خليقة جديدة». واليونانية موجزة بلا فعل، وحرفيًا: «إن كان أحد في المسيح — خليقة جديدة».'
    reason: alternative_reading
  - marker: b
    text: 'تقرأ ترجمات كثيرة: «قد صار كل شيء جديدًا». أما نص SBLGNT هنا فيقول ببساطة: «قد صارت أمور جديدة»، من غير لفظ صريح بمعنى «كل شيء».'
    reason: textual_variant
lexical_decisions:
- source_word: ὥστε
  choice: إذًا
  rationale: تفيد النتيجة والاستنتاج مما سبق، و«إذًا» تؤدي هذا الربط بوضوح وإيجاز في العربية المعاصرة.
- source_word: εἴ τις
  choice: إن كان أحدٌ
  rationale: تنقل الشرط العام المفتوح من غير تخصيص بجنس أو فئة.
- source_word: ἐν Χριστῷ
  choice: في المسيح
  rationale: تحافظ على لقب Χριστός بصيغته العربية المألوفة وعلى تعبير بولس الدال على الاتحاد بالمسيح.
- source_word: καινὴ κτίσις
  choice: فهناك خليقة جديدة
  rationale: الأصل اليوناني جملة اسمية موجزة بلا فعل مصرح به. وإضافة «هناك» تحفظ إمكان أن يكون الكلام عن واقع الخليقة الجديدة، من غير حصره في وصف الفرد وحده.
- source_word: τὰ ἀρχαῖα
  choice: الأمور القديمة
  rationale: الصفة المحايدة المجموعة مستعملة استعمال الاسم؛ و«الأمور القديمة» تحفظ الجمع واتساع الدلالة.
- source_word: παρῆλθεν
  choice: قد مضت
  rationale: تعبر عن زوال القديم مع بقاء أثر النتيجة في الحاضر، وتلائم العربية الطبيعية.
- source_word: ἰδοὺ
  choice: ها
  rationale: أداة تنبيه تلفت النظر إلى النتيجة، و«ها» موجزة وفصيحة وغير متكلفة.
- source_word: γέγονεν καινά
  choice: قد صارت أمور جديدة
  rationale: تنقل الجمع في καινά والنتيجة الحاضرة للفعل التام γέγονεν، من غير إدخال لفظ «كل» غير الموجود في نص SBLGNT.
theological_decisions:
- issue: هل تُفهم καινὴ κτίσις بوصفها وصفًا للشخص أم إعلانًا عن خليقة جديدة؟
  choice: فهناك خليقة جديدة
  alternative: فهو خليقة جديدة
  rationale: العبارة اليونانية مقتضبة ولا تشتمل على فعل أو ضمير صريح. تحافظ الصياغة المختارة على سعة العبارة ولا تحصرها في أحد الوجهين، مع إثبات القراءة الفردية في الحاشية.
- issue: مدى الجِدّة في خاتمة العدد
  choice: قد صارت أمور جديدة
  alternative: قد صار كل شيء جديدًا
  rationale: نص SBLGNT يقرأ καινά، أي «أمور جديدة»، ولا يصرح بلفظ «كل». لذلك لا تُدخل الترجمة توسعًا نصيًا قد يوحي بشمول مصرح به.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «خليقة» للمحافظة على الصلة الدلالية بفعل الخلق، وحُفظ إيجاز الأصل وتوتره التفسيري، مع تجنب الصياغة الطائفية أو التوسع غير الموجود في النص.
