  text: namely[a], that God was in Messiah reconciling the world to himself, not counting their trespasses against them[d][c][b], and entrusting to us the message of reconciliation.
translation:
  language: ar
  text: أي إنَّ الله كان في المسيح يصالح العالم لنفسه، غير حاسبٍ عليهم تعدياتهم، وجاعلًا فينا كلمة المصالحة.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمة العبارة الأخيرة: «ومؤتمنًا إيانا على رسالة المصالحة»، أو: «وجاعلًا بيننا كلمة المصالحة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ὅτι
  choice: أي إنَّ
  rationale: صيغة تفسيرية عربية طبيعية تؤدي وظيفة العبارة اليونانية في بيان مضمون القول السابق، من غير تكرار ثقيل.
- source_word: θεὸς ἦν ἐν Χριστῷ
  choice: الله كان في المسيح
  rationale: يحافظ على حرف الجر ἐν وعلى ترتيب الفكرة، فلا يحوّل العبارة إلى معنى آلي مثل «بواسطة المسيح»، وبذلك يصون توترها اللاهوتي.
- source_word: Χριστῷ
  choice: المسيح
  rationale: «المسيح» المقابل العربي الراسخ للقب Χριστός، ويحافظ على كونه لقبًا ذا دلالة لا اسمًا منقولًا صوتيًا فحسب.
- source_word: κόσμον
  choice: العالم
  rationale: مقابل عربي طبيعي وواسع لـ κόσμος في هذا السياق، من دون حصره صراحة في البشر أو في الكون المادي.
- source_word: καταλλάσσων
  choice: يصالح
  rationale: فعل مضارع يعبّر بوضوح عن فعل الله الجاري، ويحافظ على الصلة الاشتقاقية والدلالية مع «المصالحة» في آخر الآية.
- source_word: ἑαυτῷ
  choice: لنفسه
  rationale: ينقل ضمير الانعكاس في صيغة عربية موجزة، ويبيّن أن المصالحة متجهة إلى الله.
- source_word: μὴ λογιζόμενος
  choice: غير حاسبٍ
  rationale: يحفظ صورة الحساب في الفعل λογίζομαι بلغة عربية واضحة، من غير إدخال مصطلح لاهوتي تقني أثقل.
- source_word: παραπτώματα
  choice: زلّاتهم
  rationale: تنقل معنى التجاوزات والعثرات العملية في παράπτωμα، وهي أدق هنا من اللفظ الأعم «خطايا».
- source_word: καὶ θέμενος
  choice: وواضعًا
  rationale: يحافظ على المعنى المباشر للفعل τίθημι وعلى توازي اسم الفاعل مع «مصالحًا/غير حاسب»، من غير حسم ἐν ἡμῖν بمعنى «مستودعًا إيانا».
- source_word: ἐν ἡμῖν
  choice: فينا
  rationale: الترجمة المباشرة لحرف الجر ἐν، وتحفظ إمكان فهم العبارة على نحو باطني أو جماعي أو خدمي بدل قصرها على «إلينا».
- source_word: τὸν λόγον τῆς καταλλαγῆς
  choice: كلمة المصالحة
  rationale: تحافظ على المقابل المباشر لـ λόγος وعلى تركيب الإضافة، مع إمكان فهم «الكلمة» بوصفها القول أو الرسالة المعلنة.
theological_decisions:
- issue: دلالة θεὸς ἦν ἐν Χριστῷ
  choice: الله كان في المسيح يصالح العالم
  alternative: في المسيح كان الله يصالح العالم؛ أو كان الله بالمسيح يصالح العالم
  rationale: الصياغة المختارة أقرب إلى ترتيب اليونانية وتحفظ غموض علاقة «في المسيح» بالفعل، فلا تحسمها إلى معنى آلي محض.
- issue: فهم ἐν ἡμῖν
  choice: فينا
  alternative: بيننا؛ أو إلينا/ائتمننا على
  rationale: يبقى حرف الجر كما ورد، مما يحفظ التوتر بين حلول كلمة المصالحة في الجماعة ووضعها لديها لتعلنها.
- issue: دلالة λόγος في عبارة المصالحة
  choice: كلمة المصالحة
  alternative: رسالة المصالحة
  rationale: «كلمة» أقرب إلى اللفظ اليوناني وتحفظ سعته، بينما «رسالة» تفسير سياقي صحيح لكنه أضيق.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة ومهيبة. استُعملت «أي إنَّ» للربط التفسيري، وحُفظت عبارتا «في المسيح» و«فينا» لتجنب إزالة الغموض الحقيقي في الأصل. وُضع مؤشر الحاشية بعد العبارة التي تتناولها.
