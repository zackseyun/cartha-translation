  terminology: '«المسيح»، «العالم»، و«المصالحة» اختيارات سليمة ومتسقة. استبدال «زلّاتهم» بـ«تعدياتهم» أدق لـπαραπτώματα. ينبغي كذلك أن تصاغ الحاشية بتركيب عربي سليم: «مؤتمنًا إيانا على رسالة المصالحة» بدل «مستودعًا إيانا رسالة المصالحة».'
