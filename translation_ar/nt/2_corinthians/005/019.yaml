  source_fidelity: 'الترجمة تنقل البنية الأساسية للآية بأمانة: الصيغة التفسيرية، وكون الله «في المسيح» مصالحًا العالم لنفسه، وعدم احتساب الذنوب، ثم وضع كلمة المصالحة في الجماعة. لكن «زلّاتهم» قد توحي بالعثرات أو الهفوات غير المقصودة أكثر مما يوحي به παραπτώματα من تعديات/تجاوزات، فتحتاج إلى لفظ أصرح.'
