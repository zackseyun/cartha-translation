  text: ὁ δὲ κατεργασάμενος ἡμᾶς εἰς αὐτὸ τοῦτο θεός, ⸀ὁ δοὺς ἡμῖν τὸν ἀρραβῶνα τοῦ πνεύματος.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/005.yaml
  text: The one who prepared us for this very thing is God[b][a], who gave us the down payment of the Spirit.
translation:
  language: ar
  text: والذي هيَّأنا لهذا الأمر عينه هو الله، الذي أعطانا عربون الروح[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «ضمان الروح»، أو «وديعة الروح»، أو «الدفعة الأولى من الروح».
    reason: lexical_alternative
  - marker: b
    text: قد تعني العبارة أن الروح نفسه هو العربون، أو أن الله أعطى عربونًا يضمن ما سيأتي به الروح إلى التمام.
    reason: alternative_reading
lexical_decisions:
- source_word: κατεργασάμενος
  choice: هيَّأنا
  rationale: يفيد الفعل عملًا مقصودًا أعدَّ المؤمنين وملاءمهم للحالة الآتية المذكورة في السياق، و«هيَّأنا» تعبير عربي طبيعي يحفظ هذا الاتجاه الغائي.
- source_word: εἰς αὐτὸ τοῦτο
  choice: لهذا الأمر عينه
  rationale: يحيل التعبير بتوكيد إلى ما سبق الحديث عنه مباشرة، وتحفظ «عينه» قوة αὐτό دون إضافة تفسير زائد.
- source_word: θεός
  choice: الله
  rationale: هو المسند الذي يعرّف من قام بتهيئتنا.
- source_word: δοὺς
  choice: الذي أعطانا
  rationale: تحويل اسم الفاعل اليوناني إلى جملة موصولة طبيعي في العربية، مع إبقاء صلته بعمل الله السابق.
- source_word: ἀρραβῶνα
  choice: عربون
  rationale: '«عربون» يحفظ الصورة التجارية: دفعة أولى حاضرة تضمن إتمام ما بقي، وهو أدق من لفظ يقتصر على معنى الضمان المجرد.'
- source_word: τοῦ πνεύματος
  choice: الروح
  rationale: الإضافة في «عربون الروح» تقابل صيغة المضاف إليه اليونانية وتحفظ احتمال كون الروح نفسه العربون أو كون العبارة متعلقة بعربون يضمن ما يتممه الروح.
- source_word: δὲ
  choice: الواو في «والذي»
  rationale: δέ هنا أداة انتقال خفيف واستمرار في الحجة، لا تفيد تضادًا قويًا ولا زمن «الآن»؛ والواو تؤدي هذا الربط طبيعيًا بالعربية.
theological_decisions:
- issue: معنى «عربون الروح»
  choice: الإبقاء على تركيب الإضافة، بما يرجّح في السياق أن الروح نفسه هو العربون الحاضر للحياة الآتية من غير التصريح بذلك في المتن
  alternative: أن يكون المعنى عربونًا يمنحه الروح أو يضمن ما سيأتي به الروح إلى التمام
  rationale: التركيب اليوناني يحتمل من جهة النحو أكثر من بيان، مع أن استعمال بولس الموازي يرجّح أن الروح نفسه هو العطية الضامنة. لذلك يحفظ المتن الإضافة ويعرض الهامش الاحتمالين.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُعمل «هيَّأنا» بدل تعبير حرفي جامد، وحُفظت الصورة التجارية في «عربون»، كما حُفظ الغموض الحقيقي في إضافة «الروح». وُضعت علامتا الهامش بعد العبارة التي تتناولانها.
