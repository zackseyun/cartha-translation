reference: 2 Corinthians 5:14
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἡ γὰρ ἀγάπη τοῦ Χριστοῦ συνέχει ἡμᾶς, κρίναντας τοῦτο ⸀ὅτι εἷς ὑπὲρ πάντων ἀπέθανεν· ἄρα οἱ πάντες ἀπέθανον·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/014.yaml
  text: 'For the love of Messiah compels us[a], because we have concluded this: that one died on behalf of all; therefore all died.'
translation:
  language: ar
  text: 'فإن محبة المسيح[a] تدفعنا، إذ خلصنا إلى هذا: أن واحدًا مات من أجل الجميع، فالجميع إذًا ماتوا.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «محبة المسيح لنا»، أو «محبتنا للمسيح»؛ فتركيب الإضافة في اليونانية يحتمل الوجهين.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγάπη
  choice: محبة
  rationale: «محبة» هي المقابل العربي الطبيعي والوقور، وتحافظ على الدلالة الأخلاقية والعلاقية للكلمة دون إيحاءات عاطفية ضيقة.
- source_word: τοῦ Χριστοῦ
  choice: المسيح
  rationale: تُرجم اللقب Χριστός إلى «المسيح»، وبقي تركيب «محبة المسيح» مفتوحًا لاحتمال كون المسيح فاعل المحبة أو متعلَّقها.
- source_word: συνέχει
  choice: تدفعنا
  rationale: تنقل قوة المحبة المؤثرة التي تحكم تصرف بولس ورفقائه بلغة عربية طبيعية، من غير الإيحاء بإكراه آلي. ويمكن أن يدل الفعل اليوناني أيضًا على الإحاطة أو الضبط بحسب السياق.
- source_word: κρίναντας
  choice: إذ خلصنا إلى هذا
  rationale: يعبر عن حكم مدروس أو استنتاج، ويُظهر أن ما يلي هو أساس قول بولس، مع صياغة عربية سلسة.
- source_word: εἷς
  choice: واحدًا
  rationale: يحافظ على إيجاز اليونانية وقوتها البلاغية دون إضافة «شخص» أو التصريح باسم المسيح في هذا الموضع.
- source_word: ὑπὲρ πάντων
  choice: من أجل الجميع
  rationale: صياغة عربية واسعة تحتمل معنى العمل لمصلحة الجميع أو بالنيابة عنهم، من غير حصر العبارة في نموذج كفاري واحد.
- source_word: ἄρα
  choice: إذًا
  rationale: تبيّن أن موت الجميع نتيجة منطقية مستنبطة من موت الواحد من أجلهم.
- source_word: οἱ πάντες ἀπέθανον
  choice: الجميع ماتوا
  rationale: يحافظ على العبارة المكثفة كما وردت، من غير تفسير هوية «الجميع» أو كيفية موتهم مع المسيح.
theological_decisions:
- issue: دلالة المضاف إليه في ἡ ἀγάπη τοῦ Χριστοῦ
  choice: محبة المسيح
  alternative: محبة المسيح لنا؛ أو محبتنا للمسيح
  rationale: التركيب اليوناني يحتمل أن يكون المسيح مصدر المحبة أو متعلَّقها. ويحفظ التركيب العربي بالمضاف والمضاف إليه هذا القدر من الغموض، مع بيان الوجهين في الحاشية.
- issue: معنى «الجميع ماتوا»
  choice: الجميع ماتوا
  alternative: مات الجميع تمثيليًا في المسيح؛ أو مات جميع المؤمنين معه
  rationale: النص يقرر النتيجة بإيجاز ولا يشرح هنا نطاق «الجميع» أو طبيعة اشتراكهم في الموت؛ لذلك لا تُضاف قراءة تفسيرية إلى المتن.
- issue: دلالة ὑπὲρ πάντων
  choice: من أجل الجميع
  alternative: نيابةً عن الجميع؛ أو بدلًا من الجميع
  rationale: «من أجل» تحفظ دلالة المنفعة والتمثيل الممكنة، بينما «بدلًا من» تحسم معنى الاستبدال على نحو أضيق مما تقتضيه العبارة وحدها.
translation_notes:
  register: صياغة عربية فصحى معاصرة، واضحة ووقورة. استُخدم «إذ خلصنا إلى هذا» لإبراز الاستنتاج المدروس، و«فالجميع إذًا ماتوا» للمحافظة على تسلسل الحجة وإيجازها.
