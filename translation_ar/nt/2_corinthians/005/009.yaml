base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/009.yaml
  text: Therefore we also make it our ambition[a], whether at home or away, to be pleasing to him.
translation:
  language: ar
  text: لذلك نجعل غايتنا أيضًا، سواء أكنّا مقيمين أم مغتربين[a]، أن نكون مُرضين له.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي بحسب السياق: سواء كنا مقيمين في الجسد أم بعيدين عنه.'
    reason: توضيح المتمم المحذوف الذي يدل عليه سياق الآيات السابقة، مع إبقاء إيجاز الأصل في المتن.
lexical_decisions:
- source_word: διὸ
  choice: لذلك
  rationale: تفيد النتيجة المترتبة على الكلام السابق عن الإقامة في الجسد والوجود عند الرب.
- source_word: καὶ
  choice: أيضًا
  rationale: تحافظ على معنى الإضافة والاستمرار في حجة بولس من غير مبالغة في التأكيد.
- source_word: φιλοτιμούμεθα
  choice: نجعل غايتنا
  rationale: تنقل معنى التطلع الجاد واتخاذ الأمر مقصدًا مقصودًا، بصياغة عربية طبيعية وواضحة.
- source_word: εἴτε ἐνδημοῦντες εἴτε ἐκδημοῦντες
  choice: سواء كنا مقيمين أم مغتربين
  rationale: تحافظ على التقابل الموجز في اليونانية بين الإقامة والاغتراب، من غير إضافة المتمم المحذوف في نص الآية.
- source_word: εὐάρεστοι
  choice: موضع رضاه
  rationale: تعبير عربي طبيعي ينقل معنى كون الشخص مرضيًا لديه، ويتجنب إيحاء «مقبولين» بمعنى القبول الخلاصي.
- source_word: αὐτῷ
  choice: رضاه
  rationale: الضمير المتصل يعود إلى الرب المذكور في السياق، كما يعود الضمير اليوناني إليه من غير تكرار اسمه.
- source_word: εἶναι
  choice: أن نكون
  rationale: يحافظ على صيغة الكينونة التي تكمل غاية السعي في الأصل.
theological_decisions:
- issue: هل يُصرَّح في المتن بالمتمم المفهوم لعبارتي «مقيمين» و«مغتربين»؟
  choice: 'الإبقاء على التعبير الموجز: «سواء كنا مقيمين أم مغتربين»'
  alternative: «سواء كنا مقيمين في الجسد أم مغتربين عن الجسد»
  rationale: السياق القريب يوضح أن الحديث عن الإقامة في الجسد والاغتراب عنه، لكن الآية نفسها تحذف هذين المتممين؛ لذلك يحفظ المتن إيجاز الأصل، وتوضح الحاشية المعنى السياقي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُخدم «نجعل غايتنا» لنقل قوة التطلع المقصود في φιλοτιμούμεθα، و«موضع رضاه» لصياغة معنى εὐάρεστοι αὐτῷ بصورة طبيعية من غير تحميل العبارة دلالة مذهبية إضافية.
