  text: εἰς τὸ παρακαλέσαι ἡμᾶς Τίτον ἵνα καθὼς προενήρξατο οὕτως καὶ ἐπιτελέσῃ εἰς ὑμᾶς καὶ τὴν χάριν ταύτην·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/006.yaml
  text: So we urged Titus that[a], just as he had previously begun, he should also complete among you this act of grace.
translation:
  language: ar
  text: لذلك حثثنا تيطس لكي، كما كان قد بدأ من قبل، يُتمَّ أيضًا بينكم عمل النعمة هذا[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «هذا العمل الكريم»، وحرفيًا «هذه النعمة».
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλέσαι
  choice: حثثنا
  rationale: يفيد السياق أن بولس دفع تيطس إلى اتخاذ إجراء، و«حثثنا» تنقل قوة الفعل بوضوح من غير مبالغة.
- source_word: Τίτον
  choice: تيطس
  rationale: النقل العربي الشائع للاسم في التراث الكتابي العربي.
- source_word: καθὼς προενήρξατο
  choice: كما سبق أن بدأه
  rationale: يحفظ معنى البدء السابق الكامن في الفعل المركب، والضمير يعود طبيعيًا إلى عمل النعمة.
- source_word: ἐπιτελέσῃ
  choice: أن يتمم
  rationale: ينقل معنى إكمال العمل وبلوغه غايته، كما يلائم تركيب الغرض بعد ἵνα.
- source_word: εἰς ὑμᾶς
  choice: بينكم
  rationale: يشير هنا إلى إنجاز تيطس هذا العمل في وسط جماعة كورنثوس.
- source_word: καὶ τὴν χάριν ταύτην
  choice: أيضًا عمل النعمة هذا
  rationale: «عمل النعمة» يصون لفظ النعمة ويوضح أن المقصود ممارسة ملموسة مرتبطة بالعطاء، و«أيضًا» تنقل دلالة καί.
theological_decisions:
- issue: دلالة χάρις في سياق جمع العطاء
  choice: عمل النعمة
  alternative: النعمة؛ العمل الكريم؛ العطية
  rationale: السياق يتناول خدمة العطاء وإتمامها، لكن تعبير «عمل النعمة» يحافظ على وصف بولس اللاهوتي لهذا العمل بأنه نعمة، من غير اختزاله في المال وحده.
translation_notes:
  register: صياغة عربية فصحى واضحة وكريمة، مع ترتيب طبيعي للجملة والحفاظ على معنى البدء السابق والإتمام اللاحق. وُضعت علامة الحاشية مباشرة بعد العبارة التي تشرحها.
