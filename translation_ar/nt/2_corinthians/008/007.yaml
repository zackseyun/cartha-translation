  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἀλλ’ ὥσπερ ἐν παντὶ περισσεύετε, πίστει καὶ λόγῳ καὶ γνώσει καὶ πάσῃ σπουδῇ καὶ τῇ ἐξ ⸂ἡμῶν ἐν ὑμῖν⸃ ἀγάπῃ, ἵνα καὶ ἐν ταύτῃ τῇ χάριτι περισσεύητε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/007.yaml
  text: But just as you abound in everything—in faith and speech and knowledge and all diligence and in our love in you—see that you also abound in this grace[a][b].
translation:
  language: ar
  text: ولكن، كما تفيضون في كل شيء—في الإيمان والكلام والمعرفة وكل اجتهاد، وفي المحبة الصادرة منا والكائنة فيكم[a]—فاحرصوا على أن تفيضوا أيضًا في هذه النعمة[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو ربما: «محبتكم لنا». فالعبارة اليونانية صعبة، وتقرأ بعض المخطوطات: «محبتكم فينا».'
    reason: alternative_reading
  - marker: b
    text: أي هذا العمل الكريم، وهو العطاء الكريم.
    reason: lexical_alternative
lexical_decisions:
- source_word: περισσεύετε / περισσεύητε
  choice: تفيضون / تفيضوا
  rationale: يحافظ الفعل «يفيض» على صورة الوفرة في الموضعين، ويربط بين ما لدى الكورنثيين من غنى روحي وبين دعوتهم إلى الوفرة في العطاء.
- source_word: ἐν παντί
  choice: في كل شيء
  rationale: تعبير عربي واضح يحفظ شمول العبارة اليونانية ويمهّد للقائمة التالية.
- source_word: πίστει
  choice: الإيمان
  rationale: هو المعنى الأنسب ضمن قائمة الخصال الروحية، ولا يقتضي السياق تخصيصه بمعنى الأمانة.
- source_word: λόγῳ
  choice: الكلام
  rationale: يشير على الأرجح إلى القدرة على التعبير أو النطق، و«الكلام» طبيعي في هذا السياق من غير تضييق المعنى إلى قول واحد.
- source_word: γνώσει
  choice: المعرفة
  rationale: المقابل العربي المباشر والملائم ضمن قائمة مواطن القوة الروحية.
- source_word: πάσῃ σπουδῇ
  choice: كل اجتهاد
  rationale: يحفظ معنى الجدية والحرص العمليين، كما يحافظ على بنية الاسم في القائمة.
- source_word: τῇ ἐξ ἡμῶν ἐν ὑμῖν ἀγάπῃ
  choice: المحبة الصادرة منا والكائنة فيكم
  rationale: يصوغ تركيب القراءة المعتمدة صياغة عربية مفهومة مع إبقاء عنصري المصدر «منا» والحضور «فيكم»، من غير حسم الصعوبة النصية والتفسيرية حسمًا صامتًا.
- source_word: χάριτι
  choice: النعمة
  rationale: يحفظ اللفظ اللاهوتي الذي يستخدمه بولس، بينما توضّح الحاشية أن المقصود السياقي هو عمل العطاء الكريم.
- source_word: ἵνα ... περισσεύητε
  choice: فاحرصوا أن تفيضوا
  rationale: ينقل القوة الحثية للعبارة الناقصة نحويًا في اليونانية إلى عربية طبيعية، من غير تحويلها إلى أمر قاسٍ أو تقرير خبري.
theological_decisions:
- issue: دلالة χάρις في سياق جمع التقدمة لأجل القديسين
  choice: النعمة
  alternative: عمل النعمة؛ العطية؛ عمل العطاء الكريم
  rationale: يبقي لفظ «النعمة» العمق اللاهوتي والتلاعب الدلالي المقصود عند بولس، وتبيّن الحاشية مرجعه العملي في السياق.
- issue: تفسير τῇ ἐξ ἡμῶν ἐν ὑμῖν ἀγάπῃ
  choice: المحبة الصادرة منا والكائنة فيكم
  alternative: محبتكم لنا؛ محبتنا فيكم
  rationale: التركيب صعب من جهة النحو ومتأثر باختلاف القراءات. تحافظ الصياغة الأساسية على تفاصيل القراءة المعتمدة، وتعرض الحاشية الاحتمال التفسيري والقراءة المخطوطية البديلة.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدمت «تفيضون» لتثبيت صورة الوفرة في الفعلين، ووُضعت الجملة الاعتراضية بين شرطتين لتوضيح بنية تعداد الخصال. أُبقيت صعوبة عبارة المحبة ظاهرة في المتن والحاشية بدل تسويتها مذهبيًا أو تفسيريًا.
