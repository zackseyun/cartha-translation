  yaml_path: translation/nt/2_corinthians/008/004.yaml
  text: begging us with much urging for the grace and the fellowship of this ministry to the saints—[a]
translation:
  language: ar
  text: ملتمسين منا بإلحاح شديد أن نمنحهم النعمة والمشاركة في الخدمة الموجَّهة إلى القديسين—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أن نمنحهم الامتياز والمشاركة في الخدمة الموجَّهة إلى القديسين».'
    reason: «النعمة» (χάρις) قد تفيد هنا الامتياز أو العطية الممنوحة للمشاركة، مع بقاء العطف بين «النعمة» و«المشاركة» ظاهرًا في المتن.
lexical_decisions:
- source_word: μετὰ πολλῆς παρακλήσεως
  choice: بإلحاح شديد
  rationale: تفيد μετά مع المضاف المصاحبة من جهة الكيفية، وتدل παράκλησις هنا، مع δεόμενοι، على الالتماس الملح لا على التعزية.
- source_word: δεόμενοι ἡμῶν
  choice: ملتمسين منا
  rationale: ينقل معنى الطلب المتواضع القوي، مع دلالة المضاف إليه ἡμῶν على الأشخاص الذين وُجِّه إليهم الالتماس.
- source_word: τὴν χάριν
  choice: نعمة
  rationale: تحفظ اللفظ البولسي واتساع معنى χάρις، الذي يشمل هنا الامتياز أو العطية الممنوحة لهم للمشاركة.
- source_word: τὴν κοινωνίαν
  choice: المشاركة
  rationale: السياق يتحدث عن الاشتراك الفعلي في عمل الإغاثة؛ و«المشاركة» أوضح عربيًا من «الشركة» هنا، مع بقاء البعد الجماعي.
- source_word: τῆς διακονίας
  choice: خدمة
  rationale: تعبر عن διακονία بوصفها عمل خدمة عمليًا لإعانة المؤمنين، من غير حصرها في منصب ديني.
- source_word: τῆς εἰς τοὺς ἁγίους
  choice: القديسين
  rationale: تحافظ على المصطلح البولسي للمؤمنين، وتدل الإضافة في العربية طبيعيًا على أن الخدمة موجهة إليهم.
theological_decisions:
- issue: العلاقة النحوية بين τὴν χάριν وτὴν κοινωνίαν
  choice: نعمة المشاركة
  alternative: النعمة والشركة
  rationale: يمكن فهم καί هنا تفسيرية، أي النعمة المتمثلة في المشاركة، وهو الأنسب للسياق وللعربية الطبيعية؛ لكن احتمال العطف بين مفعولين يبقى حقيقيًا ولذلك حُفظ في الحاشية.
- issue: ترجمة ἅγιοι
  choice: القديسين
  alternative: المقدسين / شعب الله المقدس
  rationale: «القديسين» يحفظ الاتساق مع مصطلح بولس للمؤمنين كافة، من غير أن يعني فئة نخبوية أُعلنت قداستها لاحقًا.
translation_notes:
  register: عربية فصحى واضحة وموقرة. استُخدم «ملتمسين» و«بإلحاح شديد» لتجنب التكرار الثقيل في «متوسلين... بتوسل»، وصيغت العبارة بوصفها جزءًا نحويًا متصلًا بما قبلها، كما في الأصل.
