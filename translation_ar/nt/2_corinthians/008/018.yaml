  text: συνεπέμψαμεν δὲ μετ’ αὐτοῦ τὸν ἀδελφὸν οὗ ὁ ἔπαινος ἐν τῷ εὐαγγελίῳ διὰ πασῶν τῶν ἐκκλησιῶν—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/018.yaml
  text: And we sent with him the brother whose praise in the gospel is throughout all the churches—[a]
translation:
  language: ar
  text: وأرسلنا معه الأخ الذي له ثناء في الإنجيل لدى جميع الكنائس—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الأخ الذي له ثناء في الإنجيل في جميع الكنائس».'
    reason: بديل أسلوبي لعبارة انتشار الثناء بين مجموع الكنائس، مع الحفاظ على سعة العبارة اليونانية.
lexical_decisions:
- source_word: συνεπέμψαμεν
  choice: أرسلنا معه
  rationale: الفعل الماضي يدل على إرسال تمّ، ومعنى المصاحبة الكامن في السابقة σύν يُنقل عربيًا بصورة طبيعية بعبارة «أرسلنا معه».
- source_word: δὲ
  choice: وَ
  rationale: أداة وصل خفيفة تتابع السرد ولا تقتضي هنا معنى الاستدراك القوي.
- source_word: μετ’ αὐτοῦ
  choice: معه
  rationale: تفيد μετά مع المضاف إليه المصاحبة، و«معه» أقرب تعبير عربي مباشر.
- source_word: τὸν ἀδελφόν
  choice: الأخ
  rationale: التعريف وصيغة المذكر المفرد يشيران إلى أخ مسيحي معيّن معروف في السياق، من غير إضافة «أخانا» التي لا يصرّح بها النص.
- source_word: οὗ ὁ ἔπαινος
  choice: الذي له مدحٌ
  rationale: يحافظ التعبير على الصيغة الاسمية لـἔπαινος وعلى صلة الموصول من غير تحويلها إلى وصف أضيق مثل «المشهود له».
- source_word: ἔπαινος
  choice: مدح
  rationale: ينقل معنى الثناء أو الإشادة مباشرة، مع إبقاء إمكان فهمه بوصفه ذكرًا حسنًا أو تزكية.
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: في الإنجيل
  rationale: يحفظ العبارة اليونانية واحتمال دلالتها على المجال أو الصلة، من غير أن يضيف «الكرازة» أو «الخدمة» غير المذكورتين صراحة.
- source_word: διὰ πασῶν τῶν ἐκκλησιῶν
  choice: بين الكنائس كلها
  rationale: ينقل انتشار المدح في مجموع الكنائس بصياغة عربية واضحة؛ ويُذكر البديل الأقرب إلى صورة الامتداد في الحاشية.
- source_word: ἐκκλησιῶν
  choice: الكنائس
  rationale: هو المقابل العربي المعياري الواضح لجماعات المؤمنين المحلية في الاستعمال البولسي.
theological_decisions:
- issue: هوية الأخ ووصفه
  choice: «الأخ» في إشارة إلى رجل مؤمن بعينه يرافق المبعوث الآخر.
  alternative: «أحد الإخوة» أو «المؤمن» بمعنى عام.
  rationale: أداة التعريف والمذكر المفرد وسياق السفر تدل على شخص محدد، مع عدم إضافة اسم أو منصب لا يورده النص.
- issue: دلالة ἐν τῷ εὐαγγελίῳ
  choice: «في الإنجيل» من غير تحديد نوع نشاطه.
  alternative: «في الكرازة بالإنجيل» أو «في خدمة الإنجيل».
  rationale: لا يصرّح اليوناني بالكرازة أو بمنصب خدمي معيّن؛ لذا تبقى الصلة بالإنجيل واسعة كما في الأصل.
- issue: علاقة المدح بالكنائس
  choice: «بين الكنائس كلها» للدلالة على شيوع المدح لديها.
  alternative: «في جميع الكنائس» أو «في أرجاء الكنائس كلها».
  rationale: διά مع المضاف إليه يمكن أن تفيد الامتداد عبر المجموعة كلها؛ والصياغة المختارة طبيعية ولا تجعل الكنائس مصدر تزكية رسمية بالضرورة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظت العبارة المفتوحة «في الإنجيل» والتوقف الختامي بالشرطة كما في النص المعطى، وتجنب النص تعيين الأخ أو تخصيص نوع خدمته.
