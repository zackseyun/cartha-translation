lexical_decisions:
- source_word: ὅτι
  choice: فقد
  rationale: تؤدي «فقد» هنا وظيفة التعليل والتفسير لما سبق بأسلوب عربي طبيعي، مع إبقاء إمكان الترجمة السببية الصريحة في الحاشية.
- source_word: παράκλησιν
  choice: الطلب
  rationale: السياق يتحدث عن تكليف حثّ بولس تيطس على قبوله، ولذلك فـ«الطلب» أوضح من «التعزية» وأقل تحميلًا للنص من إضافة مضاف إليه غير مذكور.
- source_word: ἐδέξατο
  choice: قَبِلَ
  rationale: تنقل الاستجابة الإيجابية للطلب بوضوح وإيجاز.
- source_word: σπουδαιότερος
  choice: أشدَّ حماسةً
  rationale: تحفظ صيغة المقارنة وتعبّر عن ازدياد الغيرة والاستعداد للعمل في هذا السياق.
- source_word: ὑπάρχων
  choice: كان
  rationale: أُدمج اسم الفاعل اليوناني في تركيب عربي فعلي طبيعي من غير إضافة دلالة تفسيرية.
- source_word: αὐθαίρετος
  choice: من تلقاء نفسه
  rationale: تبيّن أن تحرك تيطس كان طوعيًا ونابعًا من مبادرته الشخصية.
- source_word: ἐξῆλθεν πρὸς ὑμᾶς
  choice: انطلق إليكم
  rationale: تحفظ دلالة الخروج والتحرك باتجاه المخاطَبين، وهي أفصح وأطبع في العربية من الترجمة الحرفية «خرج إليكم».
theological_decisions: []
translation_notes:
  register: صياغة عربية فصحى معاصرة واضحة وموقرة. استُخدمت «بل» لإبراز أن تيطس لم يكتفِ بقبول الطلب، بل تجاوزه بحماسته ومبادرته، مع الحفاظ على المقارنة في σπουδαιότερος وعلى طوعية الفعل في αὐθαίρετος.
