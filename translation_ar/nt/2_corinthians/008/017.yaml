  source_fidelity: 'الترجمة تنقل المعنى الأساسي بأمانة: قبول تيطس للطلب، وزيادة حماسته، ومبادرته الطوعية، وتوجّهه إلى المخاطَبين. غير أن «بل» أقوى من أداة المقابلة δέ في هذا السياق؛ فهي قد توحي بتصحيح أو إضراب، بينما النص يقابل بين قبوله للطلب وكونه أكثر حماسة. كما أن «فإنه» أوضح في نقل الوظيفة التفسيرية لـὅτι من «فقد».'
