  rationale: استُبدلت «بل» بـ«لكنه» لتفادي دلالة الإضراب الأقوى من المقابلة اليونانية، واستُبدلت «فقد» بـ«فإنه» لإبراز الصلة التفسيرية بالسياق السابق. وحُفظت جميع المعاني المعجمية الأساسية والحواشي ومواضعها، من غير إضافة تفسيرية أو تغيير في معنى الآية.
