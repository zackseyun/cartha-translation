  text: I am not saying this as a command[b][a], but through the earnestness of others I am also testing the genuineness of your love.
translation:
  language: ar
  text: لا أقول هذا على سبيل الأمر، بل من خلال حماسة الآخرين أختبر أيضًا أصالة محبتكم.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «أتحقق من أصالة محبتكم»؛ فالفعل اليوناني قد يعني الاختبار أو التحقق والإثبات بالفحص.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιταγή
  choice: الأمر
  rationale: تعبير «على سبيل الأمر» ينقل معنى الكلام الصادر بوصفه أمرًا ملزمًا، ويحافظ على مقابلة بولس بين الإلزام والعطاء النابع من المحبة.
- source_word: διὰ τῆς ἑτέρων σπουδῆς
  choice: من خلال غيرة الآخرين
  rationale: تحافظ «من خلال» على الدلالة الوسيلية لحرف الجر διά مع المضاف إليه، ولا تحدد هوية الآخرين بما يتجاوز نص الآية.
- source_word: σπουδή
  choice: غيرة
  rationale: «غيرة» هنا تدل على الحماسة الجادة والاستعداد المتوقد، وهي أنسب للسياق من معنى السرعة المحض أو الاجتهاد المجرد.
- source_word: ἀγάπη
  choice: محبة
  rationale: المقابل العربي الطبيعي والمستقر، وتشير في السياق إلى المحبة التي تتجلى في العطاء.
- source_word: γνήσιον
  choice: أصالة
  rationale: تنقل معنى ما هو حقيقي غير زائف، وتلائم التركيب العربي «أصالة محبتكم» مع إبقاء فكرة التحقق من حقيقتها.
- source_word: δοκιμάζων
  choice: أختبر
  rationale: ينقل معنى فحص الشيء لإظهار حقيقته أو التحقق منها، ويصوغ اسم الفاعل اليوناني فعلًا مضارعًا طبيعيًا مرتبطًا بـ«أقول».
- source_word: καί
  choice: أيضًا
  rationale: تحفظ القوة الإضافية للأداة، إذ يذكر بولس غيرة الآخرين ويختبر كذلك أصالة محبة المخاطبين.
- source_word: ὑμετέρας
  choice: محبتكم
  rationale: لاحقة ضمير الجمع تنقل بوضوح نسبة المحبة إلى المخاطبين جماعةً.
theological_decisions:
- issue: موقف بولس الخطابي من العطاء
  choice: ينفي بولس أنه يتكلم على سبيل الأمر، ويعرض كلامه بوصفه اختبارًا لأصالة محبتهم.
  alternative: اعتبار كلامه أمرًا رسوليًا ملزمًا صيغ بأسلوب مخفف.
  rationale: النص اليوناني يصرح بالنفي «ليس بحسب أمر»، فلا ينبغي إضعافه أو تحويله ضمنًا إلى إلزام، مع إبقاء التوتر بين السلطة الرسولية والاستجابة الطوعية الناشئة من المحبة.
- issue: دلالة δοκιμάζων بين الاختبار والإثبات
  choice: أختبر
  alternative: أُثبت
  rationale: الفعل قد يشمل الفحص المؤدي إلى إظهار الأصالة، لكن «أختبر» يحفظ انفتاح الدلالة ولا يفترض مسبقًا نتيجة الاختبار.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدم «على سبيل الأمر» لصياغة طبيعية دقيقة، و«غيرة الآخرين» لحفظ معنى الحماسة الجادة من غير تعيينهم باسم لا يرد في الآية.
