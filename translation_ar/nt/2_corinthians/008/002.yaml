  text: that in a severe test of affliction[b][a], the abundance of their joy and their deep poverty overflowed into the wealth of their generosity.
translation:
  language: ar
  text: ففي اختبارٍ شديدٍ من الضيق، أفضت وفرةُ فرحهم وفقرُهم العميق[a] إلى غنى سخائهم[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فقرهم الذي بلغ الأعماق»، أو: «فقرهم المدقع».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «غنى بساطتهم» أو «غنى إخلاصهم»؛ فاللفظة اليونانية قد تعني أيضًا «البساطة» أو «صفاء القصد»، لكنها تشير هنا على الأرجح إلى السخاء في العطاء.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν πολλῇ δοκιμῇ θλίψεως
  choice: في امتحانٍ شديدٍ بالضيق
  rationale: تحافظ «امتحان» على معنى الاختبار في δοκιμή، وتعبّر «شديد» عن كثرة المعاناة، بينما تُبقي الباء الصلة الإضافية مع θλίψεως من غير إفراط في التفسير.
- source_word: ἡ περισσεία τῆς χαρᾶς αὐτῶν
  choice: وفرةُ فرحهم
  rationale: تنقل «وفرة» البنية الاسمية ومعنى الكثرة في περισσεία، وتُمهّد للتجاوب اللفظي مع الفعل «فاضت».
- source_word: ἡ κατὰ βάθους πτωχεία αὐτῶν
  choice: فقرُهم العميق
  rationale: تعبير عربي طبيعي يحفظ صورة العمق في κατὰ βάθους ويفيد شدة الفقر دون تحويل الصورة إلى مجرد وصف تجريدي.
- source_word: ἐπερίσσευσεν
  choice: فاضت
  rationale: ينقل معنى الكثرة المتدفقة والنتيجة المتجهة إلى عبارة εἰς، ويحافظ على الصلة الاشتقاقية الدلالية مع «وفرة» قدر الإمكان في العربية.
- source_word: εἰς τὸ πλοῦτος
  choice: بغنى
  rationale: تفيد الباء هنا النتيجة التي آل إليها فيض الفرح والفقر، في صياغة عربية طبيعية موجزة، مع نقل πλοῦτος بـ«غنى».
- source_word: τῆς ἁπλότητος αὐτῶν
  choice: سخائهم
  rationale: في سياق العطاء المادي تدل ἁπλότης على السخاء أو البذل بلا تحفّظ؛ و«سخائهم» واضحة للقارئ العربي، مع توثيق المعاني البديلة في الحاشية.
theological_decisions:
- issue: دلالة ἁπλότης في سياق العطاء المالي
  choice: سخائهم
  alternative: بساطتهم أو إخلاصهم أو صفاء قصدهم
  rationale: السياق المباشر هو جمع العطاء للقديسين، ولذلك يُرجَّح معنى السخاء. لكن الحاشية تحفظ التوتر الدلالي لأن اللفظة قد تشير أيضًا إلى البساطة أو إخلاص القصد.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. حُفظت المفارقة المقصودة بين الفقر والغنى، وكذلك التوازي بين وفرة الفرح وعمق الفقر، من غير حسم زائد لدلالة ἁπλότης.
