  to: ولم يكن الأمر كما توقَّعنا[a]، بل قدَّموا أنفسهم أولًا للرب، ثم لنا، بمشيئة الله[b].
  rationale: يستبدل التعديل «عطاؤهم» بلفظ عام يحفظ حذف المفعول في الأصل واتكاله على السياق، ويحذف «أيضًا» لعدم وجود ما يقابله صراحة في اليونانية. ويُبقي «ثم لنا» لإظهار ترتيب «أولًا للرب» ثم الارتباط بخدمة بولس ورفاقه، من غير مساواة أو توسع لاهوتي.
