  text: καὶ οὐ καθὼς ἠλπίσαμεν ἀλλ’ ἑαυτοὺς ἔδωκαν πρῶτον τῷ κυρίῳ καὶ ἡμῖν διὰ θελήματος θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/005.yaml
  text: And not as we expected[a], but they gave themselves first to the Lord and to us through the will of God[b],
translation:
  language: ar
  text: ولم يكن الأمر كما توقَّعنا[a]، بل قدَّموا أنفسهم أولًا للرب، ثم لنا، بمشيئة الله[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كما رجونا».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «بإرادة الله»، أو «وفقًا لمشيئة الله».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς ἠλπίσαμεν
  choice: كما توقَّعنا
  rationale: الفعل ἐλπίζω قد يعني «رجونا»، لكن السياق يقارن ما فعله المؤمنون في مكدونية بما كان الرسل يتوقعونه؛ و«توقَّعنا» تؤدي المعنى طبيعيًا، مع إبقاء البديل في الحاشية.
- source_word: ἑαυτοὺς ἔδωκαν
  choice: قدَّموا أنفسهم
  rationale: يحافظ التعبير على دلالة الضمير الانعكاسي وعلى معنى بذل الذات، فلا يحصر الكلام في العطاء المالي.
- source_word: πρῶτον
  choice: أولًا
  rationale: تحفظ أولوية تقديم الذات للرب، سواء فُهمت زمنيًا أم منطقيًا، من غير زيادة تفسيرية.
- source_word: τῷ κυρίῳ
  choice: للرب
  rationale: ترجمة مباشرة للقب κύριος، وهو هنا يشير إلى المسيح في السياق البولسي.
- source_word: καὶ ἡμῖν
  choice: ثم لنا أيضًا
  rationale: تنقل المفعول غير المباشر الموازي، بينما تُظهر «ثم» ترتيب العبارة بعد «أولًا» من دون جعل الرسل في منزلة الرب.
- source_word: διὰ θελήματος θεοῦ
  choice: بمشيئة الله
  rationale: «بـ» صياغة عربية طبيعية لدلالة διά مع المضاف إليه، وتبقي مجالًا لفهم العبارة على معنى الوسيلة أو الإذن أو الموافقة، مع بيان البدائل في الحاشية.
theological_decisions:
- issue: العلاقة بين تقديم أنفسهم للرب وتقديمها للرسل
  choice: يُعرض تقديم الذات بوصفه متجهًا أولًا إلى الرب، ثم إلى بولس ورفاقه في خدمة الرسالة.
  alternative: يمكن فهم العبارة على أنها تكريس مزدوج بسيط، من غير تراتبية صريحة تتجاوز دلالة «أولًا».
  rationale: يحفظ النص ترتيب πρῶτον وتتابع العبارتين من غير توسيع المعنى إلى دعوى كنسية أقوى.
- issue: دلالة διὰ θελήματος θεοῦ
  choice: بمشيئة الله
  alternative: من خلال مشيئة الله؛ وفقًا لمشيئة الله
  rationale: تتسع العبارة اليونانية لدلالات الفاعلية أو الإذن أو الموافقة، ولذلك لا تُحصر في تفسير لاهوتي واحد.
translation_notes:
  register: 'عربية فصحى معاصرة واضحة وموقرة. أُضيفت كلمة «عطاؤهم» لاستكمال المقارنة التي يعتمد معناها على سياق جمع العطاء في الآيات السابقة، مع الحفاظ على محور العبارة: أنهم لم يكتفوا بالعطاء بل قدّموا أنفسهم.'
