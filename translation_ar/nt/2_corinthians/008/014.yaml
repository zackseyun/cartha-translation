  text: ἐν τῷ νῦν καιρῷ τὸ ὑμῶν περίσσευμα εἰς τὸ ἐκείνων ὑστέρημα, ἵνα καὶ τὸ ἐκείνων περίσσευμα γένηται εἰς τὸ ὑμῶν ὑστέρημα, ὅπως γένηται ἰσότης·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/014.yaml
  text: At the present time[a], your abundance is for their need, so that their abundance may also be for your need, in order that there may be equality.
translation:
  language: ar
  text: في الوقت الحاضر، يكون فائضكم لسدّ حاجتهم، لكي يكون فائضهم أيضًا لسدّ حاجتكم، وذلك لكي تتحقق المساواة.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الإنصاف» أو «التكافؤ»؛ وتشير الكلمة اليونانية هنا إلى توازن في تلبية حاجات بعضهم بعضًا، لا بالضرورة إلى تماثل الممتلكات.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ νῦν καιρῷ
  choice: في الوقت الحاضر
  rationale: تعبير عربي طبيعي يحفظ دلالة الظرف الراهن أو المرحلة الحالية.
- source_word: τὸ ὑμῶν περίσσευμα
  choice: فائضكم
  rationale: يدل على ما يزيد على الحاجة، ويحفظ السياق المادي من غير حصره في المال وحده.
- source_word: εἰς τὸ ἐκείνων ὑστέρημα
  choice: لسدّ حاجتهم
  rationale: ينقل اتجاه الفائض نحو تلبية ما ينقصهم بصياغة عربية واضحة، مع تجنب العبارة الحرفية الثقيلة «إلى نقصانهم».
- source_word: ἵνα καὶ
  choice: لكي ... أيضًا
  rationale: يحفظ معنى الغاية وإضافة عنصر المعاملة المتبادلة.
- source_word: τὸ ἐκείνων περίσσευμα
  choice: فائضهم
  rationale: يكرر اللفظ المقابل للمصطلح اليوناني نفسه ويحافظ على التوازي في بنية الآية.
- source_word: γένηται εἰς τὸ ὑμῶν ὑστέρημα
  choice: يكون ... لسدّ حاجتكم
  rationale: صياغة عربية مفهومة تعكس صيغة الغاية الاحتمالية من غير أن تفترض زمنًا أو وسيلة محددين.
- source_word: ὅπως γένηται ἰσότης
  choice: فتتحقق المساواة
  rationale: ينقل الغاية النهائية بوضوح، ويستعمل المقابل المباشر لـἰσότης مع شرح طبيعته السياقية في الحاشية.
theological_decisions:
- issue: معنى ἰσότης في دعوة بولس إلى العطاء
  choice: المساواة في تلبية الحاجات المتبادلة
  alternative: الإنصاف أو التكافؤ
  rationale: السياق يتناول موازنة الوفرة والحاجة عن طريق العطاء المتبادل، لا تقرير تماثل كامل في الممتلكات؛ لذلك حُفظ لفظ «المساواة» في المتن ووُضح نطاقه في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. حافظت الصياغة على التوازي بين «فائضكم/حاجتهم» و«فائضهم/حاجتكم»، وعلى الغاية المتبادلة في الحجة. وُضع مؤشر الحاشية بعد «المساواة» لأنه يشرح هذا اللفظ، لا عبارة الزمن.
