revisions:
- from: أمّا الآن فأتمّوا أيضًا تنفيذها[a]، حتى كما كانت عندكم الحماسة لإرادتها، يكون كذلك إتمامها ممّا لديكم[b].
  to: فالآن أتمّوا أيضًا العمل به، لكي يكون إتمامه كذلك، كما كانت لديكم الرغبة في القيام به، مما لديكم[a].
  rationale: 'أعيدت صياغة الجملة لتكون عربية فصحى سليمة وتحافظ على تسلسل النص: أمر بإتمام العمل، ثم مقارنة بين الرغبة السابقة في القيام به والإتمام العملي، مع إبقاء قيد الموارد المتاحة ظاهرًا. وحُذف الحاشية الخاصة بـ«أتمّوا» لأن بديلها السابق «افرغوا من إنجازها» أقل سلامة وأقل ملاءمة للسجل العربي؛ ونُقلت علامة الحاشية إلى العبارة التي تستفيد من الإيضاح الحرفي والتفسيري.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:26:03Z'
review_pass:
  verdict: revise
  source_fidelity: ينقل المشروع البنية الأساسية للآية ومعنى الإتمام في حدود المتاح، لكنه يضع «حتى كما» في تركيب عربي غير سليم، كما أن «الحماسة لإرادتها» لا تؤدي تركيب προθυμία τοῦ θέλειν أداءً عربيًا واضحًا.
  naturalness: الصياغة الحالية متعثرة، ولا سيما «حتى كما كانت عندكم الحماسة لإرادتها، يكون كذلك إتمامها». تستلزم المقارنة إعادة ترتيب لتظهر العلاقة بين الرغبة السابقة والإتمام المطلوب، مع استعمال تعبير عربي مألوف للإرادة العملية.
  terminology: «أتمّوا» و«إتمام» مناسبان ويحافظان على الصلة اللفظية في اليونانية. والأوضح لـ προθυμία هو «الرغبة» أو «الاستعداد»؛ وقد اختيرت «الرغبة» هنا مع «القيام به» لتأدية إرادة الفعل دون غموض. «مما لديكم» يحفظ عبارة ἐκ τοῦ ἔχειν دون فرض مقدار محدد.
  issues:
  - severity: medium
    issue: تركيب «حتى كما ... يكون كذلك» غير طبيعي وغير محكم نحويًا في العربية.
    rationale: 'ὅπως يربط الأمر بالنتيجة أو الغاية، ثم تأتي المقارنة καθάπερ ... οὕτως καί. يلزم في العربية ترتيب يتيح: «لكي يكون... كما كانت... كذلك...».'
  - severity: medium
    issue: «الحماسة لإرادتها» تعبير غير مألوف وملتبس.
    rationale: προθυμία τοῦ θέλειν تفيد الاستعداد/الرغبة في الإرادة أو في الفعل؛ والتعبير العربي المقترح يحولها إلى حماسة تجاه «إرادة» مؤنثة يعود مرجعها بغير سلاسة. «الرغبة في القيام به» طبيعي ويحفظ العنصر الإرادي العملي.
  revised_text: فالآن أتمّوا أيضًا العمل به، لكي يكون إتمامه كذلك، كما كانت لديكم الرغبة في القيام به، مما لديكم[a].
