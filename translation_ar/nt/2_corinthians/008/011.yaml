  text: νυνὶ δὲ καὶ τὸ ποιῆσαι ἐπιτελέσατε, ὅπως καθάπερ ἡ προθυμία τοῦ θέλειν οὕτως καὶ τὸ ἐπιτελέσαι ἐκ τοῦ ἔχειν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/011.yaml
  text: But now complete the doing of it also[a], so that just as there was the eagerness to will it[b], so also there may be the completion from what you have.
translation:
  language: ar
  text: فالآن أتمّوا أيضًا العمل به، لكي يكون إتمامه كذلك، كما كانت لديكم الرغبة في القيام به، مما لديكم[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «مما لديكم»؛ أي بما يتناسب مع مواردكم الحاضرة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: أمّا الآن
  rationale: تحفظ الانتقال الزمني مع النبرة الاستدراكية الخفيفة التي تفيدها δέ، في صياغة عربية طبيعية.
- source_word: τὸ ποιῆσαι
  choice: تنفيذها
  rationale: يشير المصدر المحلّى بالأداة إلى الفعل العملي المتعلق بالعطية التي سبق الحديث عنها. و«تنفيذها» تنقل الانتقال من النية إلى العمل بوضوح.
- source_word: ἐπιτελέσατε
  choice: فأتمّوا
  rationale: يفيد الفعل بلوغ العمل نهايته وإنجازه كاملًا، و«أتمّوا» يحفظ صلته اللفظية بالمصدر اللاحق τὸ ἐπιτελέσαι.
- source_word: ὅπως
  choice: حتى
  rationale: تقدّم الغاية أو النتيجة المقصودة من الوصية، وتلائم تركيب المقارنة التالي في العربية.
- source_word: καθάπερ
  choice: كما
  rationale: تحفظ المقارنة بين الحماسة السابقة والإتمام العملي المطلوب الآن.
- source_word: ἡ προθυμία
  choice: الحماسة
  rationale: تنقل معنى الاستعداد المتقد والرغبة الطوعية في سياق العطاء، من غير أن تختزلها في مجرد قبول عقلي.
- source_word: τοῦ θέλειν
  choice: لإرادتها
  rationale: يحفظ العنصر الإرادي في المصدر، مع إظهار تعلق الإرادة بالعطية المقصودة في السياق.
- source_word: οὕτως καὶ
  choice: كذلك
  rationale: 'تحفظ التوازن المقارن: كما وُجدت الحماسة إلى الإرادة، ينبغي أن يوجد الإتمام أيضًا.'
- source_word: τὸ ἐπιτελέσαι
  choice: إتمامها
  rationale: صياغة اسمية تحافظ على صورة المصدر المحلّى وعلى الصلة بالفعل «فأتمّوا».
- source_word: ἐκ τοῦ ἔχειν
  choice: ممّا لديكم
  rationale: تحفظ دلالة المصدر أو المورد المتاح، من غير تحويل العبارة في المتن إلى تفسير أوسع مثل «بحسب قدرتكم».
theological_decisions:
- issue: هل يُطلب العطاء بما يتجاوز الموارد المتاحة؟
  choice: يكون إتمام العطية ممّا هو متاح لديهم الآن.
  alternative: اعتبار الآية أمرًا عامًا بإتمام كل نية حسنة بصرف النظر عن الإمكانات.
  rationale: سياق الآية هو العطية التي سبق أن عزم الكورنثيون عليها، وعبارة ἐκ τοῦ ἔχειν تقيد الإتمام بما لديهم، فلا تفيد إلزامهم بما ليس في وسعهم.
translation_notes:
  register: لغة عربية فصحى واضحة وكريمة. حوفظ على التوازي بين الإرادة والإتمام، وعلى التكرار الاشتقاقي بين «فأتمّوا» و«إتمامها»، مع إبقاء قيد الموارد المتاحة ظاهرًا من غير توسيع لاهوتي.
