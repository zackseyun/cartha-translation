  text: And not only that[d][c][b][a], but he was also appointed by the churches as our traveling companion with this gracious gift that is being administered by us for the glory of the Lord himself and our eagerness—
translation:
  language: ar
  text: وليس ذلك فحسب، بل إن الكنائس عيّنته[a] أيضًا رفيقَ سفرٍ لنا مع هذه العطية الكريمة[b] التي نتولى أمرها لمجد الرب نفسه[c] ولاستعدادنا—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «اختارته الكنائس» أو «انتخبته الكنائس».'
