  - marker: b
    text: 'حرفيًا: «مع هذه النعمة»؛ وتشير «النعمة» هنا، في السياق، إلى العطية التي جُمعت.'
    reason: lexical_alternative
  - marker: c
    text: 'يمكن أيضًا فهم العبارة: «لمجد ربه»، أو ببساطة: «لمجد الرب».'
    reason: alternative_reading
lexical_decisions:
- source_word: χειροτονηθεὶς
  choice: اختارته
  rationale: يفيد تعيين الكنائس لهذا الشخص واختيارها إياه، من غير أن يفرض تصورًا حديثًا لطريقة اقتراع رسمية.
- source_word: ἐκκλησιῶν
  choice: الكنائس
  rationale: هو التعبير الطبيعي عن جماعات المؤمنين في الاستعمال البولسي.
- source_word: συνέκδημος
  choice: رفيقنا في السفر
  rationale: ينقل بوضوح معنى الشخص الذي يرافق آخرين في رحلة.
- source_word: χάριτι
  choice: العطية الكريمة
  rationale: يشير السياق إلى عطية الجمع الملموسة، مع الاحتفاظ بدلالة النعمة والكرم في χάρις.
- source_word: διακονουμένῃ
  choice: نقوم بخدمتها
  rationale: يحافظ على جذر الخدمة في الفعل اليوناني، ويعبّر في السياق عن تولّي أمر العطية دون حصر المعنى في توزيعها.
- source_word: πρὸς
  choice: لـ
  rationale: تدل هنا على الغاية أو المقصد.
- source_word: αὐτοῦ τοῦ κυρίου
  choice: الرب نفسه
  rationale: يأخذ αὐτοῦ على أنه للتوكيد مع τοῦ κυρίου، مع التنبيه في الحاشية إلى الاحتمال التركيبي الآخر.
- source_word: δόξαν
  choice: مجد
  rationale: المقابل العربي المألوف والدقيق للمصطلح البولسي.
- source_word: προθυμίαν
  choice: حماستنا
  rationale: ينقل معنى الاستعداد المتقد والرغبة الجادة دون إضافة مفعول غير مذكور في اليونانية.
theological_decisions:
- issue: مرجع αὐτοῦ ووظيفته في πρὸς τὴν αὐτοῦ τοῦ κυρίου δόξαν
  choice: لمجد الرب نفسه
  alternative: 'لمجد ربه؛ أو: لمجد الرب'
  rationale: القراءة التوكيدية سليمة سياقيًا وطبيعية عربيًا، لكن التركيب اليوناني مكثف ويحتمل فهمًا إضافيًا أو ملكيًا؛ لذلك لم يُطمس الاحتمال الآخر بل ذُكر في الحاشية.
- issue: علاقة προθυμίαν ἡμῶν بهدف خدمة العطية
  choice: ولإظهار حماستنا
  alternative: 'ولحماستنا؛ أو: ولاستعدادنا'
  rationale: إضافة «إظهار» توضح عربيًا كيف تكون حماستهم غاية ظاهرة لهذه الخدمة، من غير تحديد موضوع الحماسة بما يتجاوز النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حافظت الصياغة على امتداد الجملة وعلى الشرطة الختامية لأنها تتصل بما يلي، واستُعملت «خدمة العطية» بدل مصطلح إداري ثقيل. وُضعت علامات الحواشي عند الألفاظ المعنية مباشرة وبترتيب ظهورها.
