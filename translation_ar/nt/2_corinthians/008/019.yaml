revisions:
- from: وليس هذا فقط، بل اختارته الكنائس أيضًا ليكون رفيقنا في السفر مع هذه العطية الكريمة[a][b] التي نقوم بخدمتها لمجد الرب نفسه[c] ولإظهار حماستنا—
