source:
  edition: SBLGNT
  text: εἴτε ὑπὲρ Τίτου, κοινωνὸς ἐμὸς καὶ εἰς ὑμᾶς συνεργός· εἴτε ἀδελφοὶ ἡμῶν, ἀπόστολοι ἐκκλησιῶν, δόξα Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/023.yaml
  text: As for Titus[a], he is my partner and fellow worker for you; as for our brothers, they are messengers of the churches[b], the glory of Messiah.
translation:
  language: ar
  text: أمّا تيطس، فهو شريكي وزميلي في العمل لأجلكم؛ وأمّا إخوتنا، فهم موفدو الكنائس[a]، ومجد المسيح[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «رسل الكنائس». يمكن للكلمة اليونانية أن تدل على رسل، أو على موفدين ومندوبين مكلّفين؛ والسياق هنا يرجّح ممثلي الكنائس.'
    reason: alternative_reading
  - marker: b
    text: العبارة اليونانية اسمية بلا فعل، ويمكن أن تفيد أن هؤلاء الإخوة «مجد المسيح» أو أنهم يُظهرون مجده.
    reason: preserved_ambiguity
lexical_decisions:
- source_word: εἴτε ὑπὲρ Τίτου
  choice: أمّا تيطس
  rationale: التركيب اليوناني موجز ومحذوف الخبر، ويعرض حالتين متوازيتين؛ و«أمّا» تؤدي هذه الوظيفة الخطابية طبيعيًا في العربية، مع فهم ὑπέρ بمعنى «من جهة/بخصوص».
- source_word: κοινωνὸς ἐμὸς
  choice: شريكي
  rationale: تدل κοινωνός على من يشارك آخر في أمر أو عمل؛ و«شريكي» تحفظ المعنى العلائقي والخدمي بعبارة عربية موجزة.
- source_word: εἰς ὑμᾶς συνεργός
  choice: العامل معي لأجلكم
  rationale: تنقل συνεργός معنى المشاركة في العمل، بينما تعبّر «لأجلكم» عن اتجاه الخدمة نحو أهل كورنثوس من غير إضافة «لخيركم» التي لا يصرّح بها النص.
- source_word: ἀδελφοὶ ἡμῶν
  choice: إخوتنا
  rationale: صيغة الجمع مذكرة، ويشير السياق إلى رجال موفدين؛ لذا حُفظ التعبير المباشر من غير توسيع محايد جنسانيًا.
- source_word: ἀπόστολοι ἐκκλησιῶν
  choice: موفدو الكنائس
  rationale: يمكن أن تعني ἀπόστολοι رسلًا أو أشخاصًا موفدين بتكليف. والسياق المتعلق بممثلي الكنائس يرجّح «موفدو الكنائس»، مع إثبات البديل في الحاشية صونًا للمدى الدلالي.
- source_word: δόξα Χριστοῦ
  choice: مجد المسيح
  rationale: ترجمة مباشرة للعبارة الاسمية الإضافية، وهي تصف الإخوة بأنهم «مجد المسيح» من غير إدخال فعل تفسيري مثل «يُظهرون».
theological_decisions:
- issue: دلالة ἀπόστολοι في وصف الإخوة غير المسمّين
  choice: موفدو الكنائس بالمعنى غير الاصطلاحي
  alternative: رسل الكنائس
  rationale: السياق يتناول رجالًا مكلفين من الكنائس بأمر العطية، والإضافة «الكنائس» تلائم معنى الموفدين أو المندوبين. ومع ذلك لا يُلغى احتمال ترجمتها «رسل»، لذلك ذُكر في الحاشية.
- issue: ترجمة Χριστοῦ
  choice: المسيح
  alternative: المسيّا
  rationale: «المسيح» هو المقابل العربي الراسخ للقب Χριστός، ويحفظ كونه لقبًا لا مجرد اسم، مع ملاءمة السجل الكتابي العربي.
- issue: قوة العبارة δόξα Χριστοῦ
  choice: الإبقاء على العبارة الاسمية «مجد المسيح»
  alternative: «هم فخر للمسيح» أو «يُظهرون مجد المسيح»
  rationale: النص اليوناني يحتمل وصفهم بأنهم مجد المسيح أو أنهم يُظهرون مجده؛ والإبقاء على الصياغة الاسمية يحفظ هذا التوتر بدل حسمه بتفسير.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كتابية وقورة. استُخدمت «أمّا... وأمّا...» لإظهار التوازي، و«موفدو» لتجنب تحميل اللفظ رتبة كنسية اصطلاحية لا يفرضها السياق.
