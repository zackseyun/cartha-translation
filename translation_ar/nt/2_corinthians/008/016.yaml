lexical_decisions:
- source_word: Χάρις δὲ τῷ θεῷ
  choice: ولكن شكرًا لله
  rationale: التركيب اصطلاح شكر موجَّه إلى الله، لا استعمال لكلمة «النعمة». وتفيد δὲ انتقالًا خفيفًا يناسبه «ولكن» في هذا السياق.
- source_word: τῷ διδόντι
  choice: الذي وضع
  rationale: المعنى الحرفي هو «الذي يعطي»، لكن «وضع في القلب» تعبير عربي طبيعي يحفظ صورة إحداث الدافع الباطني.
- source_word: τὴν αὐτὴν σπουδὴν
  choice: الاجتهاد نفسه
  rationale: تدل σπουδή هنا على الجدية والحرص المتحمس، و«الاجتهاد» لفظ واضح يحتمل بُعدي الحرص والعمل الجاد، مع حفظ معنى αὐτήν الدال على المماثلة.
- source_word: ὑπὲρ ὑμῶν
  choice: من أجلكم
  rationale: ينقل اتجاه حرص تيطس نحو المخاطَبين بصورة عربية موجزة وطبيعية.
- source_word: ἐν τῇ καρδίᾳ Τίτου
  choice: في قلب تيطس
  rationale: يحفظ الاستعارة الأصلية والموقع الباطني للدافع، مع صياغة عربية سليمة بعد «وضع».
