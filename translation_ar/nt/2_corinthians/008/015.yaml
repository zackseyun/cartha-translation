base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/015.yaml
  text: 'as it is written: The one who had much did not have too much[a], and the one who had little did not have too little.'
translation:
  language: ar
  text: 'كما هو مكتوب: «مَن كان لديه الكثير لم يكن لديه فائض، ومَن كان لديه القليل لم يكن لديه نقص».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بصياغة مرتبطة بسياق خروج 16:18: «مَن جمع كثيرًا لم يكن له فائض، ومَن جمع قليلًا لم يكن له نقص».'
    reason: توضيح صياغة الاقتباس في سياق المنّ في سفر الخروج، مع عدم إيهام القارئ بأن فعل «جمع» وارد في نص بولس اليوناني.
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: كما هو مكتوب
  rationale: صيغة عربية مألوفة وواضحة لإدخال اقتباس كتابي، وتحافظ على دلالة صيغة التمام اليونانية بوصف النص شهادة مكتوبة قائمة.
- source_word: Ὁ τὸ πολὺ
  choice: مَن كان عنده الكثير
  rationale: التركيب اليوناني لا يذكر فعل الجمع صراحة، بل يشير إلى صاحب الكثير؛ وإضافة «كان عنده» طبيعية في العربية وتناسب سياق التوزيع.
- source_word: ἐπλεόνασεν
  choice: لم يَفْضُلْ عنه
  rationale: ينقل معنى عدم وجود فائض، ويحافظ على الإيجاز والتقابل مع عدم النقص، من غير تحويل الوفرة نفسها إلى أمر مذموم.
- source_word: ὁ τὸ ὀλίγον
  choice: مَن كان عنده القليل
  rationale: يحافظ على التوازي مع «مَن كان عنده الكثير» من غير إدخال فعل «جمع» غير المذكور صراحة في اقتباس بولس.
- source_word: ἠλαττόνησεν
  choice: لم يَنْقُصْهُ شيء
  rationale: يؤدي معنى عدم العوز أو القصور بلغة عربية طبيعية، ويبرز نتيجة الكفاية المقصودة في السياق.
theological_decisions:
- issue: توظيف اقتباس الخروج 16:18 في سياق العطاء والمساواة
  choice: صياغة العبارة من جهة نتيجة الحيازة والتوزيع، من غير إدخال فعل «جمع» في المتن
  alternative: «مَن جمع كثيرًا لم يكن له فائض، ومَن جمع قليلًا لم يكن له نقص»
  rationale: نص بولس اليوناني لا يكرر فعل الجمع الوارد في سياق المن، وسياقه المباشر يركز على تحقق الكفاية وعدم الفائض أو العوز. تُذكر الصياغة المرتبطة بالخروج في الحاشية حفظًا للصلة النصية.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ومهيبة. استُخدم تقابل «لم يفضل عنه / لم ينقصه شيء» لنقل التوازن البلاغي والمعنى التوزيعي، مع ضبط الفعلين لتفادي اللبس في القراءة.
