lexical_decisions:
- source_word: στελλόμενοι
  choice: مُتَّخِذِينَ هذا الاحتياط
  rationale: يدل اسم الفاعل المتوسط هنا على اتخاذ تدبير وقائي لتجنّب موضع اللوم، وهذه الصياغة تنقل المعنى بوضوح وطبيعية.
- source_word: μή τις ἡμᾶς μωμήσηται
  choice: لئلّا يلومنا أحد
  rationale: تنقل «لئلّا» معنى الغاية الوقائية في تركيب μή مع صيغة الالتزام، و«يلومنا» تؤدي معنى إيجاد العيب أو توجيه اللوم.
- source_word: ἐν τῇ ἁδρότητι ταύτῃ
  choice: بشأن هذا العطاء السخيّ
  rationale: تبيّن «بشأن» مجال اللوم المحتمل، بينما تشير ἁδρότης في سياق الجمع المالي إلى عطاء يتصف بالسعة والسخاء.
- source_word: τῇ διακονουμένῃ ὑφ’ ἡμῶν
  choice: الذي نتولّى إدارته
  rationale: الفعل διακονέω في هذا السياق يفيد القيام بخدمة العطاء وتدبيره؛ و«نتولّى إدارته» عربية واضحة لا تضفي معنى كنسيًا زائدًا.
theological_decisions:
- issue: طبيعة حرص بولس في التعامل مع العطاء
  choice: إبراز التدبير الوقائي لتجنّب اللوم في إدارة العطاء المالي
  alternative: فهم العبارة على أنها مجرد ترتيب عملي للسفر دون إبراز المساءلة
  rationale: يربط النص اليوناني التدبير صراحة بمنع أن يجد أحد موضعًا للوم بشأن العطاء الذي يديره بولس ورفقاؤه، من غير توسيع ذلك إلى تقرير عقائدي أبعد.
translation_notes:
  register: العربية فصحى معاصرة واضحة ورصينة. حافظت الصياغة على بنية اسم الفاعل المتصلة بالسياق السابق، وعلى معنى الوقاية والمساءلة، مع التعبير عن ἁδρότης بما يلائم سياق التبرع المالي.
