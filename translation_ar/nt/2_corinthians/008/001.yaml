lexical_decisions:
- source_word: Γνωρίζομεν
  choice: نُعَرِّفُكم
  rationale: ينقل معنى «نجعل معلومًا/نُطلع» بصيغة المضارع، ويحافظ على النبرة الرسولية الرسمية من غير التوسع التفسيري إلى «نريدكم أن تعرفوا».
- source_word: δὲ
  choice: الواو في «ونُعَرِّفُكم»
  rationale: أداة انتقال خفيفة لا تقتضي تعارضًا قويًا؛ والواو العربية تصل الكلام طبيعيًا من غير إضافة ظرف زمان غير موجود في الأصل.
- source_word: ὑμῖν
  choice: كم في «نُعَرِّفُكم»
  rationale: أُدمج ضمير المخاطبين في الفعل وفق الأسلوب العربي الطبيعي، مؤديًا وظيفة المفعول غير المباشر في التركيب اليوناني.
- source_word: ἀδελφοί
  choice: أيها الإخوة
  rationale: يحافظ على صيغة النداء المذكرة في الأصل، مع بيان شمولها المحتمل لأعضاء الجماعة كلهم في الحاشية.
- source_word: τὴν χάριν τοῦ θεοῦ
  choice: بنعمة الله
  rationale: يحفظ مصطلح «النعمة» واتساعه البولسي، فلا يضيقه إلى الهبة المالية أو السخاء وحدهما؛ والباء تلائم تعدية «نُعَرِّف» في العربية.
- source_word: τὴν δεδομένην
  choice: التي وُهِبَت
  rationale: صيغة المبني للمجهول تحفظ كون النعمة معطاة، و«وُهِبَت» تعبير عربي فصيح عن العطاء الإلهي، مع دلالة الفعل التام على عطية قائمة الأثر.
- source_word: ἐν ταῖς ἐκκλησίαις
  choice: بين كنائس
  rationale: «بين» تعبّر طبيعيًا عن مجال ظهور النعمة وعملها وسط تلك الجماعات، من غير حصر المعنى في موقع مكاني محض.
- source_word: τῆς Μακεδονίας
  choice: مكدونية
  rationale: إضافة «كنائس مكدونية» تنقل علاقة المضاف إليه في اليونانية بإيجاز، وتستعمل الصيغة العربية الشائعة للاسم الجغرافي الكتابي.
theological_decisions:
- issue: دلالة «نعمة الله» في السياق
  choice: إبقاء العبارة الواسعة «نعمة الله»، بما يشمل عمل نعمة الله وثمره في سخاء الكنائس
  alternative: تفسيرها مباشرة بأنها «عطية الإحسان» أو «السخاء» وحده
  rationale: تسمح الصياغة اليونانية ببقاء المصدر الإلهي والأثر العملي معًا في النظر؛ لذلك لا تُحسم الدلالة لصالح الهبة المالية وحدها.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كريمة ورسولية. حُفظت بنية الإعلان والنداء ومصطلح «النعمة»، مع تجنب إضافة «الآن» لأن δὲ هنا أداة انتقال خفيفة لا ظرف زمان.
