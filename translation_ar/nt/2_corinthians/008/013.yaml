  text: For I do not mean that there should be relief for others and hardship for you, but equality[a]—
translation:
  language: ar
  text: فليس المقصود أن تكون للآخرين راحة، ولكم ضيق، بل على أساس المساواة[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الإنصاف»؛ تدل الكلمة اليونانية على توازن عادل، لا بالضرورة على تماثل صارم في الممتلكات.
    reason: بديل معجمي وتفادي تحميل «المساواة» معنى حديثًا أكثر صرامة مما تقتضيه اللفظة في السياق.
lexical_decisions:
- source_word: οὐ γὰρ ... ἵνα
  choice: فليس المقصود أن
  rationale: تنقل الفاء قوة γάρ التفسيرية الرابطة بما سبق، ويعبّر البناء غير الشخصي «ليس المقصود» طبيعيًا عن الغاية المنفية التي تفيدها ἵνα مع الفعل المقدّر، من غير إضافة فاعل صريح إلى اليونانية.
- source_word: ἄλλοις ἄνεσις
  choice: للآخرين راحة
  rationale: «راحة» مقابل مباشر لـἄνεσις هنا، وتدل في سياق العطاء على التخفيف من العبء لا على التعزية العاطفية وحدها.
- source_word: ὑμῖν θλῖψις
  choice: ولكم ضيق
  rationale: يحافظ على التوازي الموجز مع العبارة السابقة؛ و«ضيق» ينقل معنى الضغط والشدة، بما يشمل المشقة المادية في السياق.
- source_word: ἀλλ’ ἐξ ἰσότητος
  choice: بل أن يكون ذلك على أساس المساواة
  rationale: «على أساس» يبيّن قوة ἐξ بصورة عربية طبيعية، و«المساواة» هي المقابل المباشر لـἰσότης، مع إبقاء معناها السياقي مفتوحًا للإنصاف والتوازن العادل.
theological_decisions:
- issue: دلالة ἰσότης في سياق المشاركة المادية
  choice: المساواة
  alternative: الإنصاف؛ التوازن العادل
  rationale: اختير المقابل المعجمي الأوضح حفاظًا على حدة تعبير بولس، مع التنبيه إلى أن اللفظة قد تشير إلى توازن منصف، لا بالضرورة إلى تماثل صارم في الممتلكات.
translation_notes:
