base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/021.yaml
  text: For we take thought for what is good[a], not only before the Lord but also before people.
translation:
  language: ar
  text: لأننا نحرص على ما هو صالح[a]، ليس أمام الرب وحده، بل أمام الناس أيضًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ما هو مشرّف»، أو: «ما هو مستقيم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: προνοοῦμεν
  choice: نحرص على
  rationale: يفيد الفعل التفكير المسبق والعناية المقصودة بتدبير الأمر على نحو سليم. وفي سياق الأمانة في إدارة العطية، تنقل «نحرص على» معنى الاهتمام العملي المتعمد بلغة عربية طبيعية، من غير حصره في مجرد التفكير الذهني.
- source_word: γὰρ
  choice: لأننا
  rationale: تربط γάρ الآية بما قبلها بوصفها تعليلًا، وتؤدي «لأننا» هذا الترابط بوضوح وإيجاز.
- source_word: καλὰ
  choice: ما هو صالح
  rationale: صيغة الجمع المحايد قد تشير إلى ما هو حسن أو مشرّف أو مستقيم أخلاقيًا. ويحفظ «ما هو صالح» سعة التعبير اليوناني، مع إثبات البدائل السياقية في الحاشية.
- source_word: οὐ μόνον ... ἀλλὰ καὶ
  choice: لا ... وحده، بل ... أيضًا
  rationale: تحافظ هذه الصياغة على البنية التقابلية المتوازنة وعلى توكيد الطرفين في العربية الطبيعية.
- source_word: ἐνώπιον
  choice: أمام
  rationale: تؤدي «أمام» معنى الحضور أو النظر في كلا الموضعين بإيجاز، وتشمل فكرة كون السلوك منظورًا ومقيّمًا.
- source_word: κυρίου
  choice: الرب
  rationale: الترجمة المألوفة والدقيقة للقب κύριος في هذا السياق هي «الرب».
- source_word: ἀνθρώπων
  choice: الناس
  rationale: اللفظة عامة وتشمل البشر بوصفهم مراقبين للسلوك، ولا تختص بالذكور؛ لذلك «الناس» هي الصياغة العربية الطبيعية الدقيقة.
theological_decisions:
- issue: الدلالة الأخلاقية لكلمة καλὰ في سياق المساءلة المالية
  choice: ما هو صالح
  alternative: ما هو مشرّف؛ ما هو مستقيم
  rationale: يشدد النص على سلوك محمود أمام الرب وأمام المراقبين من البشر. وتسمح اليونانية بمعنى أخلاقي واسع أو بمعنى يبرز النزاهة وحسن السمعة. أبقت الترجمة المتن على المعنى الأوسع، وحفظت الاحتمال السياقي في الحاشية من غير تضييق دلالة النص.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُعملت «نحرص على» لتجنب العبارة الحرفية الثقيلة مع إبقاء معنى العناية المقصودة، وجاءت «الناس» للدلالة البشرية العامة.
