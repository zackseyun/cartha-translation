base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/022.yaml
  text: And we have sent with them our brother[a], whom we have often tested in many matters and found to be diligent, but who is now even more diligent because of his great confidence in you.
translation:
  language: ar
  text: وأرسلنا معهم أخانا، الذي اختبرناه مرارًا في أمور كثيرة فوجدناه مجتهدًا، والآن أشد اجتهادًا بكثير بسبب ثقته العظيمة بكم.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «والآن أشد اجتهادًا بكثير بدافع ثقته العظيمة بكم». تحتمل صياغة العبارة اليونانية ربطًا مختلفًا قليلًا بين زيادة اجتهاده وثقته بكم، مع بقاء المعنى العام أن اجتهاده ازداد في ما يتصل بكم.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεπέμψαμεν
  choice: أرسلنا معهما
  rationale: ينقل الفعل الماضي الإجراء الذي قام به بولس، ويحفظ معنى المصاحبة في السابقة σύν؛ والمثنى «معهما» يعود طبيعيًا إلى الشخصين المذكورين في السياق السابق.
- source_word: τὸν ἀδελφὸν ἡμῶν
  choice: أخانا
  rationale: يحفظ التعبير العائلي المسيحي وصيغة المفرد المذكر التي تشير إلى معاون لم يُذكر اسمه.
- source_word: ὃν ἐδοκιμάσαμεν ἐν πολλοῖς πολλάκις
  choice: الذي اختبرناه مرارًا في أمور كثيرة
  rationale: 'يحفظ معنى الاختبار، ويعكس كِلَا بُعدَي العبارة: التكرار في πολλάκις والتنوع أو السعة في ἐν πολλοῖς.'
- source_word: σπουδαῖον ὄντα
  choice: فوجدناه مجتهدًا
  rationale: يفيد السياق أن الاختبار أظهر صفته؛ و«مجتهدًا» تنقل الجدية والحرص العمليين من غير حصر المعنى في حماسة عاطفية.
- source_word: νυνὶ δὲ πολὺ σπουδαιότερον
  choice: وهو الآن أشد اجتهادًا بكثير
  rationale: تحفظ العبارة صيغة المقارنة وتشديدها بـπολύ، وتربط الوصف الحالي بما ثبت سابقًا.
- source_word: πεποιθήσει πολλῇ τῇ εἰς ὑμᾶς
  choice: لثقته العظيمة بكم
  rationale: تأخذ صيغة الداتيف على أنها سببية، أي إن ثقته بالمخاطَبين أساس ازدياد اجتهاده؛ وهذه صياغة عربية واضحة وطبيعية.
theological_decisions:
- issue: مرجع πεποιθήσει πολλῇ وعلاقته بازدياد الاجتهاد
  choice: الثقة هي ثقة الأخ المرسَل بالمخاطَبين، وهي سبب ازدياد اجتهاده
  alternative: قد تُفهم على أنها ثقة بولس بالمخاطَبين، أو على معنى الجرأة نحوهم
  rationale: أقرب ارتباط نحوي هو بالأخ غير المسمّى وبوصفه «أشد اجتهادًا»، لكن العبارة اليونانية تحتمل تلوينًا سببيًا أو وسائطيًا وشيئًا من الاختلاف في تعيين صاحب الثقة؛ لذلك ذُكر البديل في الحاشية دون فرض تفسير مذهبي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُعمل «اجتهاد» للمحافظة على الحرص العملي والجدية، ووُضع مؤشر الحاشية بعد الجملة التي تتناول موضع الاحتمال.
