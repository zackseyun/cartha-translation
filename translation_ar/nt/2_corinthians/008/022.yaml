    rationale: صيغة المثنى تعتمد على مرجعٍ سياقي سابق، بينما السابقة σύν في συνεπέμψαμεν لا تعيّن في هذه الآية عدد الأشخاص المصاحَبين. «معهم» ينقل النص دون هذا التقييد.
  - severity: medium
    issue: صياغة الحاشية البديلة «الثقة العظيمة التي له من جهتكم» ملتبسة وغير ممثلة للبديل اليوناني بدقة
