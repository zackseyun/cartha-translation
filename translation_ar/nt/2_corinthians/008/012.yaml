revisions:
- from: لِأَنَّهُ إِنْ كَانَ الِاسْتِعْدَادُ حَاضِرًا[a]، فَهُوَ مَقْبُولٌ بِحَسَبِ مَا عِنْدَ الْمَرْءِ[b]، لَا بِحَسَبِ مَا لَيْسَ عِنْدَهُ.
  to: فَإِنْ كَانَ الِاسْتِعْدَادُ مُتَوَفِّرًا[a]، كَانَ الْعَطَاءُ مَقْبُولًا بِحَسَبِ مَا عِنْدَ الْمَرْءِ[b]، لَا بِحَسَبِ مَا لَيْسَ عِنْدَهُ.
  rationale: تستبدل المراجعة الضمير الملتبس بـ«العطاء»، وهو المرجع المحذوف المفهوم من السياق والذي تقتضيه الصيغة اليونانية المذكرة، مع عدم تعيين الجهة التي يكون العطاء مقبولًا لديها. كما تحسن سلاسة التعبير عن توافر الاستعداد، وتبقي المقابلة ومعيار القدرة الفعلية كما في الأصل.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:26:03Z'
review_pass:
  verdict: revise
  source_fidelity: The conditional and proportional contrast are preserved, but the masculine pronoun in «فهو مقبول» grammatically points to «الاستعداد». This makes the readiness itself the thing accepted, whereas the masculine Greek predicate adjective signals an implicit, contextually understood referent—namely the gift/giving—that should be supplied clearly in Arabic.
  naturalness: The draft is generally clear Modern Standard Arabic. «فإن كان الاستعداد متوافرًا» is more idiomatic than «لأنه إن كان الاستعداد حاضرًا», and explicitly naming «العطاء» removes an awkward and misleading pronoun reference.
  terminology: «الاستعداد»، «مقبول»، and «بحسب ما عند المرء» are suitable and retain the source's open-ended standard of acceptance. «العطاء» is a minimal contextual supply, not a specification of the unstated agent who accepts it.
  issues:
  - severity: medium
    issue: ضمير «فهو» يعود نحويًا إلى «الاستعداد».
    rationale: يُفهم من العربية أن الاستعداد نفسه هو المقبول، بينما صيغة «εὐπρόσδεκτος» المذكرة في اليونانية تشير إلى محذوف مفهوم من السياق، أي العطاء/التقدمة. يلزم توضيح المرجع في العربية.
  - severity: low
    issue: «حاضرًا» أقل سلاسة في هذا السياق من «متوافرًا».
    rationale: المعنى المقصود من «πρόκειται» هو وجود الاستعداد أو توافره، لا حضوره المكاني.
  - severity: low
    issue: الحاشية [b] لا تعكس «ἐὰν» بأكثر صياغة عربية طبيعية.
    rationale: «ما قد يكون عنده» أنسب من «أيّ شيء قد يكون عنده» مع بقاء المعنى الحرفي غير المحدد.
  revised_text: فَإِنْ كَانَ الِاسْتِعْدَادُ مُتَوَفِّرًا[a]، كَانَ الْعَطَاءُ مَقْبُولًا بِحَسَبِ مَا عِنْدَ الْمَرْءِ[b]، لَا بِحَسَبِ مَا لَيْسَ عِنْدَهُ.
