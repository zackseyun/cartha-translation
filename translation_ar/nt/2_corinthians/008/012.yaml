base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/012.yaml
  text: For if the readiness is present[a], it is acceptable according to what one has[b], not according to what one does not have.
translation:
  language: ar
  text: فَإِنْ كَانَ الِاسْتِعْدَادُ مُتَوَفِّرًا[a]، كَانَ الْعَطَاءُ مَقْبُولًا بِحَسَبِ مَا عِنْدَ الْمَرْءِ[b]، لَا بِحَسَبِ مَا لَيْسَ عِنْدَهُ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الرغبة» أو «الحماسة» بدلًا من «الاستعداد».'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «بحسب ما قد يكون عنده ... لا بحسب ما ليس عنده».'
    reason: lexical_alternative
lexical_decisions:
- source_word: προθυμία
  choice: الاستعداد
  rationale: تدل الكلمة على نزعة راغبة ومتحمسة إلى الفعل؛ و«الاستعداد» يلائم سياق العطاء المهيأ ويحفظ معنى الرغبة الحاضرة دون مبالغة نفسية.
- source_word: πρόκειται
  choice: حاضرًا
  rationale: الفعل في هذا التركيب يفيد وجود الشيء وتوافره، لا مجرد وضعه حرفيًا أمام شخص.
- source_word: καθὸ ἐὰν ἔχῃ
  choice: بحسب ما عند المرء
  rationale: يعبّر التركيب عن معيار يقوم على الإمكانات المتاحة. واختيار «المرء» يحفظ عموم المفرد اليوناني من غير تخصيصه بالذكر.
- source_word: εὐπρόσδεκτος
  choice: مقبول
  rationale: تفيد الكلمة ما يُقبَل أو يُستحسن، و«مقبول» يحفظ المعنى التقويمي من غير تعيين الجهة التي تقبله.
- source_word: οὐ καθὸ οὐκ ἔχει
  choice: لا بحسب ما ليس عنده
  rationale: تحافظ الصياغة على المقابلة الصريحة في اليونانية بين الموجود عند المرء وما ليس عنده.
- source_word: εἰ γὰρ
  choice: لأنه إن كان
  rationale: تحفظ «لأن» القوة التفسيرية، وتحفظ «إن» القوة الشرطية للأداتين اليونانيتين.
theological_decisions:
- issue: جهة القبول الضمنية
  choice: الإبقاء على «مقبول» دون تحديد الجهة التي تقبله
  alternative: مقبول عند الله؛ أو مقبول لدى الجماعة
  rationale: لا يصرّح النص بمن يقع عنده القبول؛ لذلك لا تعيّن الترجمة الله أو الجماعة، وتحفظ سعة العبارة وتوترها التفسيري.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «المرء» للدلالة العامة، مع إبقاء بنية الشرط والمقابلة، ووُضعت علامتا الحاشيتين [a] و[b] في المتن.
