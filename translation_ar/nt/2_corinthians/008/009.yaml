source:
  edition: SBLGNT
  text: γινώσκετε γὰρ τὴν χάριν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὅτι δι’ ὑμᾶς ἐπτώχευσεν πλούσιος ὤν, ἵνα ὑμεῖς τῇ ἐκείνου πτωχείᾳ πλουτήσητε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/009.yaml
  text: For you know the grace of our Lord Jesus Christ[a], that though he was rich, yet for your sake he became poor[b], so that you by his poverty might become rich.
translation:
  language: ar
  text: 'فَإِنَّكُمْ تَعْرِفُونَ نِعْمَةَ رَبِّنَا يَسُوعَ الْمَسِيحِ: فَإِنَّهُ، مَعَ أَنَّهُ كَانَ غَنِيًّا، افْتَقَرَ مِنْ أَجْلِكُمْ، لِكَيْ تَغْتَنُوا أَنْتُمْ بِفَقْرِهِ.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يَرِدُ «الغنى» و«الفقر» هنا، على الأرجح، في صورةٍ متقابلة: غنى المسيح وافتقاره من أجل الآخرين. ولا يحدّد بولس في هذه الآية وحدها طبيعة هذا الغنى أو الفقر، ولا طبيعة الغنى الذي يناله المؤمنون.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γινώσκετε
  choice: تَعْرِفُونَ
  rationale: فعل مضارع يدل هنا على معرفة قائمة لدى المخاطَبين، و«تعرفون» تعبير عربي طبيعي مباشر.
- source_word: χάριν
  choice: نِعْمَةَ
  rationale: تحفظ «نعمة» المعنى اللاهوتي لـχάρις، وتستوعب في السياق دلالة الإحسان السخي من غير حصرها فيها.
- source_word: κυρίου
  choice: رَبِّنَا
  rationale: «ربنا» هو المقابل العربي المألوف للقب κύριος ويحفظ دلالتي السلطان والمقام المسياني.
- source_word: Ἰησοῦ Χριστοῦ
  choice: يَسُوعَ الْمَسِيحِ
  rationale: «المسيح» ينقل معنى اللقب Χριστός في العربية نقلاً راسخًا، ولا يعامله كاسم عائلة.
- source_word: δι’ ὑμᾶς
  choice: مِنْ أَجْلِكُمْ
  rationale: 'تنقل القوة النفعية لعبارة διά مع النصب: ما فعله كان لأجل المخاطَبين ومنفعتهم.'
- source_word: πλούσιος ὤν
  choice: مَعَ كَوْنِهِ غَنِيًّا
  rationale: يُظهر هذا التركيب معنى المفارقة أو التنازل في العبارة الحالية من غير إضافة «كان» التي قد توحي وحدها بزوال الغنى.
- source_word: ἐπτώχευσεν
  choice: افْتَقَرَ
  rationale: فعل عربي موجز مباشر يحفظ الانتقال المقصود إلى الفقر ويقابل صيغة الفعل اليوناني المبني للمعلوم.
- source_word: τῇ ἐκείνου πτωχείᾳ
  choice: بِفَقْرِهِ
  rationale: الباء تنقل دلالة الوسيلة المحتملة في حالة المجرور اليونانية، والضمير هو الصياغة العربية الطبيعية لـἐκείνου.
- source_word: πλουτήσητε
  choice: تَغْتَنُوا
  rationale: يحفظ الفعل المقابلة البلاغية الدقيقة بين «افتقر» و«تغتنوا»، مع إبقاء الغنى غير محدد النوع.
theological_decisions:
- issue: دلالة غنى المسيح وفقره واغتناء المؤمنين
  choice: الإبقاء على ألفاظ الغنى والفقر والاغتناء كما وردت، من غير تحديد مرجعها العقائدي أو المادي.
  alternative: تفسير الغنى بأنه المجد الإلهي السابق للتجسد، والفقر بأنه التجسد أو الصليب، والاغتناء بأنه بركات الخلاص الروحية تحديدًا.
  rationale: النص اليوناني لا يعرّف هذه الصور في الآية نفسها. وهي تعمل ضمن حديث بولس عن السخاء، لكنها تحمل أيضًا عمقًا مسيانيًا ولاهوتيًا؛ لذلك ينبغي صون سعتها وتوترها بدل حصرها في تفسير واحد.
- issue: العلاقة المنطقية في πλούσιος ὤν
  choice: 'صياغتها بصيغة مفارقة: «مع كونه غنيًا».'
  alternative: 'صياغتها زمنيًا فقط: «إذ كان غنيًا» أو «بينما كان غنيًا».'
  rationale: السياق يبرز المفارقة بين الغنى والافتقار، لكن صيغة اسم الفاعل اليونانية لا تشرح بالتحديد طبيعة الانتقال؛ فالصياغة المختارة توضح المقابلة بلا إفراط في التفسير.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم الضبط الجزئي الشامل في نص الآية لتيسير القراءة، وحُفظت المقابلة البلاغية بين «غنيًا/افتقر/تغتنوا». وُضعت النقطتان بعد «المسيح» لأن ὅτι يشرح مضمون النعمة في العربية الطبيعية، مع عدم تغيير العلاقة الدلالية في الأصل.
