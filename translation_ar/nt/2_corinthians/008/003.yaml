translation:
  language: ar
  text: لِأَنَّهُمْ، وَأَنَا أَشْهَدُ، أَعْطَوْا عَلَى قَدْرِ اسْتِطَاعَتِهِمْ، وَفَوْقَ اسْتِطَاعَتِهِمْ، مِنْ تِلْقَاءِ أَنْفُسِهِمْ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «طَوْعًا» أو «بِمَحْضِ إِرَادَتِهِمْ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: لِأَنَّهُمْ
  rationale: تؤدي ὅτι هنا وظيفة تعليلية تشرح ما سبق؛ وصيغة «لأنهم» تربط الآية بسابقتها ربطًا طبيعيًا في العربية.
- source_word: κατὰ δύναμιν
  choice: عَلَى قَدْرِ اسْتِطَاعَتِهِمْ
  rationale: تفيد κατά مع δύναμις المقياس أو الحد، وهذه العبارة العربية واضحة وتحافظ على معنى العطاء بحسب القدرة.
- source_word: μαρτυρῶ
  choice: وَأَنَا أَشْهَدُ
  rationale: تحافظ على الحضور التوكيدي لصيغة المضارع وعلى كون العبارة اعتراضية وشهادة شخصية من بولس.
- source_word: καὶ παρὰ δύναμιν
  choice: بَلْ فَوْقَ اسْتِطَاعَتِهِمْ
  rationale: تفيد παρά مع النصب تجاوز الحد؛ و«بل» تُظهر التصاعد البلاغي المقصود من العطاء بحسب الاستطاعة إلى ما فوقها.
- source_word: αὐθαίρετοι
  choice: مِنْ تِلْقَاءِ أَنْفُسِهِمْ
  rationale: تنقل معنى المبادرة الذاتية من غير إكراه، مع الحفاظ على الصلة بالفعل المفهوم من السياق.
theological_decisions:
- issue: الفعل المحذوف مع αὐθαίρετοι
  choice: إضمار «أعطوا» استنادًا إلى سياق العطاء في الآيات 2–4، وجعله الفعل الحاكم لعبارات الآية.
  alternative: ترجمة حرفية ناقصة نحو «وهم طائعون من تلقاء أنفسهم».
  rationale: النص اليوناني موجز وفيه حذف مفهوم من السياق. إظهار «أعطوا» ضروري لسلاسة العربية ولا يضيف معنى يتجاوز موضوع الكلام الواضح.
- issue: قوة الرابط καὶ قبل παρὰ δύναμιν
  choice: ترجمته بـ«بل» لإبراز تجاوز الحد بعد بلوغه.
  alternative: «و» أو «بل حتى».
  rationale: المقابلة بين κατὰ δύναμιν وπαρὰ δύναμιν تصاعدية؛ و«بل» تؤدي هذا الانتقال بوضوح من غير إدخال تقرير عقائدي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «الاستطاعة» في العبارتين المتوازيتين للمحافظة على المقابلة البلاغية، و«من تلقاء أنفسهم» لتجنب إيحاء الإكراه. وُضع الاعتراض «وأنا أشهد» بين فاصلتين بما يلائم بنية الجملة العربية.
