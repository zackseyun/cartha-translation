- from: وفي هذا الأمر أقدّم رأيي، لأن هذا نافع لكم، أنتم الذين بدأتم منذ العام الماضي، لا أن تعملوا فقط، بل أن تريدوا أيضًا.[a]
  to: وفي هذا الأمر أقدّم رأيي، لأن هذا نافع لكم، إذ إنكم بدأتم منذ العام الماضي لا بالعمل فقط، بل بالإرادة أيضًا.[a]
  rationale: عُدّل التركيب العربي لتستقيم صلته بالفعل «بدأتم» ولتُحفظ المقابلة بين التنفيذ والإرادة بلا زيادة تفسيرية. كما نُقلت علامة الحاشية إلى العبارة التي تشرحها، وصيغت بديلتها بما يوافق التركيب المعدل.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:26:01Z'
review_pass:
  verdict: revise
  source_fidelity: ينقل النص معنى γνώμην بوصفه رأيًا/مشورة لا أمرًا، ومعنى المنفعة، والتمييز بين الفعل والإرادة، والزمن السابق. لكن تركيب «بدأتم ... لا أن تعملوا فقط، بل أن تريدوا أيضًا» غير سليم ومتعثر في العربية؛ فـ«لا ... بل» هنا لا تتصل اتصالًا طبيعيًا بـ«بدأتم» مع المصدر المؤول.
  naturalness: '«أقدّم رأيي» و«نافع لكم» فصيحتان واضحتان. وتحتاج الجملة الأخيرة إلى تحويل المصدرين إلى اسمي مصدر بعد حرف الجر لتكون عربية سليمة وتحفظ التوازي: «بدأتم ... لا بالعمل فقط، بل بالإرادة أيضًا».'
  terminology: «رأيي» مناسب لـ γνώμην في هذا السياق ولا يوحي بحكم قضائي أو أمر ملزم. و«الإرادة» تؤدي θέλειν بدقة وبأسلوب أفصح وأقل التباسًا من «أن تريدوا» في هذا التركيب. و«العمل» يؤدي ποιῆσαι مع بقاء موضوعه مفهومًا من السياق.
  issues:
  - severity: medium
    issue: تركيب «بدأتم ... لا أن تعملوا فقط، بل أن تريدوا أيضًا»
    rationale: التركيب غير طبيعي في العربية، وقد يوحي بأن المتكلمين لم يبدؤوا العمل بل بدؤوا إرادته. صياغة «بدأتم ... لا بالعمل فقط، بل بالإرادة أيضًا» تحفظ أن كليهما مما سبق الشروع فيه وتوضح المقابلة الأصلية.
  - severity: low
    issue: موضع علامة الحاشية
    rationale: الحاشية تشرح «أن تريدوا»، لكن علامتها موضوعة بعد نهاية الجملة. ينبغي وضعها فور العبارة المشروحة.
