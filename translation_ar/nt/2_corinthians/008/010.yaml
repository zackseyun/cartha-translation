  text: καὶ γνώμην ἐν τούτῳ δίδωμι· τοῦτο γὰρ ὑμῖν συμφέρει, οἵτινες οὐ μόνον τὸ ποιῆσαι ἀλλὰ καὶ τὸ θέλειν προενήρξασθε ἀπὸ πέρυσι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/010.yaml
  text: 'And in this matter I give my judgment: for this is beneficial for you[b][a], who began last year not only to do it but also to will it.'
translation:
  language: ar
  text: وفي هذا الأمر أقدّم رأيي، لأن هذا نافع لكم، إذ إنكم بدأتم منذ العام الماضي لا بالعمل فقط، بل بالإرادة أيضًا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لا بالعمل فقط، بل بالرغبة أيضًا». يميّز النص اليوناني بين الإرادة أو الاستعداد وبين التنفيذ الفعلي.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γνώμην
  choice: رأيي
  rationale: يدل الاسم هنا على رأي مدروس أو مشورة، لا على أمر مباشر؛ و«رأيي» طبيعي وواضح في العربية ويحفظ هذا الفرق.
- source_word: ἐν τούτῳ
  choice: في هذا الأمر
  rationale: تحيل العبارة إلى موضوع الجمع الجاري بحثه، وهذه الصياغة توضح الإحالة من غير إضافة تفسير إلى المتن.
- source_word: δίδωμι
  choice: أقدّم
  rationale: «أقدّم رأيي» تعبير عربي طبيعي يؤدي معنى إعطاء الرأي.
- source_word: συμφέρει
  choice: نافع
  rationale: ينقل معنى ما فيه منفعة أو مصلحة، بلفظ عربي واضح لا يحمل إيحاءً تجاريًا لازمًا.
- source_word: οἵτινες
  choice: أنتم الذين
  rationale: يحفظ البنية الوصفية للضمير الموصول ويوجه الخطاب بوضوح إلى أهل كورنثوس.
- source_word: τὸ ποιῆσαι
  choice: أن تعملوا
  rationale: يشير إلى التنفيذ الفعلي للمشروع المذكور في السياق؛ ويبقى مفعوله مفهومًا من السياق كما في اليونانية.
- source_word: τὸ θέλειν
  choice: أن تريدوا
  rationale: يحفظ معنى الإرادة أو الاستعداد الداخلي، ويصونه متميزًا عن العمل الفعلي مع إبقاء التوازي بين المصدرين.
- source_word: προενήρξασθε
  choice: بدأتم
  rationale: يفيد الشروع السابق، وتؤدي العبارة الزمنية التالية معنى السبق، فلا حاجة إلى تكراره في الفعل.
- source_word: ἀπὸ πέρυσι
  choice: منذ العام الماضي
  rationale: تنقل ἀπό مع الدلالة الزمنية بصورة عربية طبيعية، مع إبقاء احتمال امتداد الأمر من العام السابق إلى الحاضر.
theological_decisions:
- issue: قوة قول بولس وصلته بسلطته الرسولية
  choice: «أقدّم رأيي» بوصفه رأيًا مدروسًا أو مشورة، لا صيغة أمر مباشر
  alternative: «أصدر حكمًا» أو صياغته كتوجيه ملزم
  rationale: يفرّق السياق القريب بين الأمر وإبداء الرأي (8:8، 8:10). والصياغة المختارة تحفظ جدية المشورة الرسولية من غير تحويلها إلى أمر صريح.
translation_notes:
  register: عربية فصحى حديثة، واضحة وكريمة النبرة. اختير «رأيي» بدل «حكمي» لتجنب إيحاء القضاء أو الإلزام، وحُفظ التوازي بين العمل والإرادة. وُضع مؤشر الحاشية بعد العبارة التي تشرحها.
