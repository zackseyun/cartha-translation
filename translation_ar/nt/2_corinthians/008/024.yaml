  text: τὴν οὖν ἔνδειξιν τῆς ἀγάπης ὑμῶν καὶ ἡμῶν καυχήσεως ὑπὲρ ὑμῶν εἰς αὐτοὺς ⸀ἐνδεικνύμενοι εἰς πρόσωπον τῶν ἐκκλησιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/024.yaml
  text: Therefore[b][a], show them before the churches the proof of your love and of our boasting about you.
translation:
  language: ar
  text: فأظهروا لهم، أمام الكنائس[b]، الدليل[a] على محبتكم وعلى افتخارنا بكم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «البرهان» أو «الإثبات».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «بحضور الكنائس»؛ أي على نحو علني.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: فـ
  rationale: تفيد النتيجة المبنية على ما سبق، وتربط الوصية بسياقها ربطًا عربيًا طبيعيًا.
- source_word: ἔνδειξιν
  choice: الدليل
  rationale: تدل على ما يُظهر الأمر ويثبته عمليًا؛ و«الدليل» واضحة وموجزة، مع ذكر البديل في الحاشية.
- source_word: ἀγάπης
  choice: محبتكم
  rationale: الترجمة المعتادة والدقيقة لـἀγάπη، والمقصود هنا محبة تتجلى في عمل ملموس.
- source_word: καυχήσεως
  choice: افتخارنا
  rationale: تحافظ على القوة البلاغية لمعنى καύχησις عند بولس، ولا تلطفه إلى مجرد ثقة أو اعتزاز.
- source_word: ὑπὲρ ὑμῶν
  choice: بكم
  rationale: مع «الافتخار» تفيد أن الكورنثيين هم موضوع افتخار بولس، وهي صياغة عربية طبيعية.
- source_word: εἰς αὐτοὺς
  choice: لهم
  rationale: الضمير يعود إلى الإخوة، أي ممثلي الكنائس المذكورين في السياق السابق.
- source_word: ἐνδεικνύμενοι
  choice: أظهروا
  rationale: اسم الفاعل اليوناني يؤدي هنا وظيفة الأمر في سياق الحث، و«أظهروا» ينقل معنى جعل الشيء بيّنًا.
- source_word: εἰς πρόσωπον τῶν ἐκκλησιῶν
  choice: أمام الكنائس
  rationale: ينقل التعبير معنى الإظهار العلني بحضور ممثلي الكنائس، من غير التزام بحرفية غير مألوفة عربيًا.
- source_word: τῶν ἐκκλησιῶν
  choice: الكنائس
  rationale: المقابل العربي المألوف للجماعات المسيحية المحلية في الاستعمال البولسي.
