  source_fidelity: 'المتن ينقل البنية والمعنى الأساسيين بأمانة: «فـ» لـοὖν، و«أظهروا» للقيمة الحثّية لـἐνδεικνύμενοι، و«لهم» لـεἰς αὐτούς، و«أمام الكنائس» لـεἰς πρόσωπον τῶν ἐκκλησιῶν. كما أن «الدليل على محبتكم وعلى افتخارنا بكم» يحفظ اقتران الدليل بالمحبة والافتخار. غير أن الحاشية (ب) تتجاوز اللفظ اليوناني حين تحصر المتكلم في بولس وتضيف «صدق» الافتخار وتقرر «ممثلي الكنائس».'
