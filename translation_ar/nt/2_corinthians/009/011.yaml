  text: being enriched in every way for all generosity[a], which through us produces thanksgiving to God—
translation:
  language: ar
  text: إذ تُغْنَونَ في كل شيء لأجل كل سخاء[a]، وهذا السخاء يُفضي، بواسطتنا، إلى شكرٍ لله—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «لأجل كل جود». ويمكن أن تعني الكلمة اليونانية أيضًا «الإخلاص» أو «البساطة» في سياقات أخرى، لكن سياق العطاء هنا يرجّح معنى «السخاء».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν παντὶ
  choice: في كل شيء
  rationale: ينقل التعبير اليوناني الواسع نقلًا طبيعيًا، ويفيد شمول ما يمنحه الله لهم من إمكانات.
- source_word: πλουτιζόμενοι
  choice: مُغنَيْنَ
  rationale: يحفظ صيغة اسم المفعول الحاضر ومعنى المبني للمجهول، مع بقاء الله فاعل الإغناء المفهوم من السياق، من غير إيحاء بوعد مطلق بالثراء.
- source_word: εἰς πᾶσαν ἁπλότητα
  choice: لأجل كل سخاء
  rationale: تفيد εἰς هنا الغاية أو النتيجة، وفي سياق جمع العطاء تدل ἁπλότης على السخاء وبذل المال بسعة يد.
- source_word: ἥτις
  choice: وهذا السخاء
  rationale: يُصرَّح بمرجع اسم الموصول في العربية دفعًا للالتباس، مع إبراز أن السخاء المذكور هو الذي يؤدي إلى الشكر.
- source_word: κατεργάζεται
  choice: يُنشئ
  rationale: ينقل معنى إحداث النتيجة أو إيجادها، بصياغة عربية موجزة وطبيعية.
- source_word: δι’ ἡμῶν
  choice: بواسطتنا
  rationale: يحفظ معنى الوساطة في διά مع المضاف إليه، من غير إضافة «خدمتنا» التي لا ترد صراحة في النص.
- source_word: εὐχαριστίαν τῷ θεῷ
  choice: شكرًا لله
  rationale: صياغة عربية طبيعية تحفظ كون العطاء يؤدي إلى شكر موجَّه إلى الله.
theological_decisions:
- issue: دلالة ἁπλότης في سياق جمع العطاء
  choice: السخاء في العطاء
  alternative: البساطة أو الإخلاص أو صفاء القصد
  rationale: مع أن اللفظة قد تعني البساطة أو الإخلاص في سياقات أخرى، فإن الحديث المباشر عن الإمداد والعطاء وما ينشأ عنه من شكر لله يرجح معنى السخاء الملموس، من غير نفي الدلالات الأخرى للفظة خارج هذا السياق.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. حُفظ البناء بوصفه جزءًا متصلًا بما قبله، ولذلك انتهت الصياغة بشرطة. استُخدم «مُغنَيْنَ» لا «أغنياء» للمحافظة على معنى الفعل المبني للمجهول وعلى استمرار الإمداد، واستُعمل «السخاء» بوصفه التعبير الأوضح للقارئ العام في سياق البذل المالي.
