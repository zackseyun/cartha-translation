  source_fidelity: 'المعنى العام منقول بأمانة: الإغناء شامل، وغايتُه السخاء، ونتيجته شكرٌ لله عبر وساطة بولس ورفاقه. لكن «مُغنَيْنَ» صياغة اسم مفعول ملتبسة وغير سلسة هنا، ولا تُظهر بوضوح أن العبارة متصلة بمخاطَبين جمع كما في اليونانية.'
