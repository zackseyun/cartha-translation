  terminology: «الإخوة»، و«عطية سخية»، و«يُنتزع منكم» اختيارات مناسبة. وتحفظ الحواشي المعنى الحرفي لـ εὐλογία والمدى المعجمي المعتاد لـ πλεονεξία دون فرض تفسير مذهبي.
