    rationale: القول «إذا كان المقصود جماعة المؤمنين» يضيّق الاحتمال بلا مسوغ مباشر؛ فالبديل الشمولي، إن أُثبت، يتعلق بدلالة اللفظ على المشاركين في الوفد لا بكون المرجع جماعة الكنيسة كلها.
