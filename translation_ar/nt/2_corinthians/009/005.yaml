source:
  edition: SBLGNT
  text: ἀναγκαῖον οὖν ἡγησάμην παρακαλέσαι τοὺς ἀδελφοὺς ἵνα προέλθωσιν ⸀εἰς ὑμᾶς καὶ προκαταρτίσωσι τὴν ⸀προεπηγγελμένην εὐλογίαν ὑμῶν, ταύτην ἑτοίμην εἶναι οὕτως ὡς εὐλογίαν καὶ μὴ ὡς πλεονεξίαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/005.yaml
  text: Therefore I considered it necessary to urge the brothers[a] to go to you ahead of us and arrange in advance the generous gift[b] you had promised, so that it would be ready as a generous gift and not as something extorted[c].
translation:
  language: ar
  text: لذلك رأيتُ أنه من الضروري أن أحثَّ الإخوة[a] على أن يسبقونا إليكم ويرتّبوا مسبقًا عطيتكم السخية[b] التي سبق أن وعدتم بها، حتى تكون جاهزة كعطية سخية، لا كشيء يُنتزع منكم[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أن تعني «الإخوة والأخوات» إذا فُهمت الإشارة إلى الموفدين على نحو شامل؛ غير أن اللفظ اليوناني هنا مذكّر جمع.
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «بركتكم». والمقصود هنا التقدمة التي وعد بها أهل كورنثوس، باعتبارها عطية سخية.'
    reason: lexical_alternative
  - marker: c
    text: اللفظ اليوناني يعني عادةً «الطمع» أو «الجشع»، ويصوّر التقدمة هنا كأنها شيء يُنتزع من المعطين تحت الضغط، لا عطية يقدمونها بسخاء.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναγκαῖον οὖν ἡγησάμην
  choice: لذلك رأيتُ أنه من الضروري
  rationale: ينقل حكم بولس العملي وضرورة الإجراء، مع الحفاظ على أداة الاستنتاج οὖν بأسلوب عربي طبيعي.
- source_word: παρακαλέσαι
  choice: أن أحثَّ
  rationale: يفيد هنا الحث الجاد على المبادرة، دون المبالغة في معنى الإلزام.
- source_word: τοὺς ἀδελφοὺς
  choice: الإخوة
  rationale: يحافظ على صيغة الجمع المذكر في اليونانية؛ ويُذكر احتمال الاستعمال الشامل في الحاشية.
- source_word: προέλθωσιν εἰς ὑμᾶς
  choice: أن يسبقونا إليكم
  rationale: يبيّن أن الوفد سيصل قبل بولس ومرافقيه، وهو ما يقتضيه سياق السفر.
- source_word: προκαταρτίσωσι
  choice: يرتّبوا مسبقًا
  rationale: يدل على تنظيم العطية وإتمام الاستعداد لها قبل وصول بولس.
- source_word: τὴν προεπηγγελμένην εὐλογίαν ὑμῶν
  choice: عطيتكم السخية التي سبق أن وعدتم بها
  rationale: يفك التركيب اليوناني إلى عربية واضحة، وينقل معنى εὐλογία السياقي بوصفه تقدمة سخية مع حفظ لفظه الحرفي في الحاشية.
- source_word: οὕτως ὡς εὐλογίαν
  choice: بوصفها عطية سخية
  rationale: يحافظ على تكرار εὐλογία وعلى المقابلة البلاغية، من غير إضافة عبارة عربية ثقيلة تقابل οὕτως حرفيًا.
- source_word: πλεονεξίαν
  choice: شيئًا منتزعًا منكم
  rationale: المعنى المعتاد هو الطمع أو الجشع، لكنه هنا يصف التقدمة المقابلة للسخاء كشيء يُنتزع من المعطين تحت الضغط.
theological_decisions:
- issue: دلالة τοὺς ἀδελφοὺς من جهة الجنس
  choice: الإخوة
  alternative: الإخوة والأخوات
  rationale: الصيغة اليونانية مذكرة جمع، لذلك حُفظت في المتن، مع بيان إمكان الاستعمال الشامل في الحاشية من غير حسم هوية أفراد الوفد بما يتجاوز النص.
- issue: معنى εὐλογία في سياق جمع التقدمة
  choice: عطية سخية
  alternative: بركة
  rationale: يدل اللفظ حرفيًا على البركة، لكنه يُطلق هنا على التقدمة من حيث كونها عطاءً سخيًا. اختير المعنى السياقي للوضوح، مع حفظ الصورة الأصلية في الحاشية.
- issue: قوة πλεονεξία في المقابلة الختامية
  choice: شيئًا منتزعًا منكم
  alternative: طمعًا أو جشعًا
  rationale: تحفظ الصياغة التوتر بين العطاء السخي والتحصيل الضاغط، ولا توحي بأن التقدمة نفسها هي خلق الطمع على نحو غير واضح بالعربية.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. استُعملت «عطية سخية» لتوضيح الاستعمال المالي السياقي مع إبقاء «بركة» في الحاشية، وصيغت المقابلة الأخيرة بعبارة طبيعية تحفظ معنى الضغط أو الاستنزاف الكامن في πλεονεξία.
