  source_fidelity: 'النص ينقل البنية والمعنى الأساسيين بدقة: ضرورة بولس، إرسال الإخوة مسبقًا، إعداد التقدمة الموعود بها، والمقابلة بين السخاء والتحصيل الضاغط. لكن المقابلة الأخيرة في اليونانية صريحة بصيغة «كـ... لا كـ...» (ὡς ... καὶ μὴ ὡς)، والأفضل إظهارها في العربية.'
