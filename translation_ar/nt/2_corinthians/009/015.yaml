  terminology: «عطية» مناسبة لـ δωρεά وتحفظ طابع الهبة من غير زيادة تفسيرية. و«الشكر» هو الاختيار العربي الأنسب للاستعمال التسبيحي لـ χάρις في هذا الموضع. لا يفرض النص تفسيرًا مسيحيًا أو لاهوتيًا محددًا لمرجع العطية.
