  source_fidelity: 'ينقل النص بدقة البناء التسبيحي في اليونانية: «الشكر لله» مقابل χάρις τῷ θεῷ، و«على» تؤدي معنى السبب في ἐπί، و«عطيته» تحفظ الضمير العائد إلى الله. كما أن «التي لا توصف» تعبر تعبيرًا سليمًا عن ἀνεκδιηγήτῳ، من غير تحديدٍ لتلك العطية لا يذكره النص.'
