translation:
  language: ar
  text: الشكر لله على عطيته التي لا توصف[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «عطيته التي يعجز الكلام عن التعبير عنها». تدل الصفة اليونانية على ما يتجاوز الوصف أو السرد الوافي.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: الشكر
  rationale: في هذه العبارة التعجبية، مع ورود «لله» في صيغة المجرور اليونانية، تدل الكلمة على الشكر والثناء، لا على «النعمة» بمعناها المعتاد.
- source_word: τῷ θεῷ
  choice: لله
  rationale: تدل على متلقّي الشكر، وتؤديها العربية بوضوح وإيجاز في العبارة «الشكر لله».
- source_word: ἐπὶ
  choice: على
  rationale: تفيد هنا أساس الشكر أو سببه؛ و«على» هي الصياغة العربية الطبيعية في قولنا «الشكر لله على...».
- source_word: ἀνεκδιηγήτῳ
  choice: التي لا توصف
  rationale: تدل الصفة على ما يتعذر سرده أو التعبير عنه تعبيرًا وافيًا. وهذه العبارة واضحة وطبيعية وتحفظ معنى تجاوز الوصف الكامل.
- source_word: αὐτοῦ
  choice: عطيته
  rationale: الضمير يعود بطبيعته إلى الله، وإلحاقه بكلمة «عطية» يحافظ على البنية الضميرية من غير تكرار اسم الله.
- source_word: δωρεᾷ
  choice: عطية
  rationale: تعني ما يُمنح هبةً. و«عطية» لفظ عربي واضح يلائم السياق التعبدي من غير إضافة معنى غير مصرح به مثل «مجانية».
theological_decisions:
- issue: مرجع «عطيته التي لا توصف»
  choice: أُبقيت العطية غير محددة، بوصفها عطية الله، من غير تعيينها بالمسيح وحده أو بالخلاص أو بالعطاء الوارد في السياق.
  alternative: قد تُفهم على أنها المسيح تحديدًا، أو الخلاص والنعمة في المسيح، أو إحسان الله الأوسع الذي يشمل سخاء المؤمنين في سياق الجمع.
  rationale: الآية نفسها لا تسمّي العطية، مع أن السياق القريب يتناول نعمة الله التي تُثمر السخاء. لذلك يحفظ النص عمومية التعبير والتوتر التفسيري من غير فرض تحديد لاهوتي أضيق.
translation_notes:
  register: عربية فصحى معاصرة، موجزة ومهيبة، بصياغة شائعة في الشكر والتسبيح. وُضع مؤشر الحاشية في المتن كما هو مطلوب.
