  text: 'as it is written: “He scattered abroad[a], he gave to the poor; his righteousness remains forever.”'
translation:
  language: ar
  text: 'كما هو مكتوب: «فرَّق، وأعطى الفقراء؛ بِرُّهُ[a] باقٍ إلى الأبد».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «عدله باقٍ إلى الأبد». يمكن أن تدل الكلمة اليونانية على البر أو العدل.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: كما هو مكتوب
  rationale: صيغة عربية مألوفة وواضحة لإدخال اقتباس كتابي، وتحافظ على طابعه الرسمي.
- source_word: Ἐσκόρπισεν
  choice: فرَّق
  rationale: يحافظ على صورة النثر والتوزيع الواسع التي يحملها الفعل اليوناني، من غير أن يضيف مفعولًا غير مذكور في النص.
- source_word: ἔδωκεν
  choice: أعطى
  rationale: ماضٍ بسيط يطابق صيغة الماضي اليونانية ويناسب توازي العبارة الشعرية.
- source_word: τοῖς πένησιν
  choice: للفقراء
  rationale: تعبير مباشر ومعاصر عن ذوي الموارد المحدودة في سياق العطاء.
- source_word: ἡ δικαιοσύνη αὐτοῦ
  choice: بِرُّهُ
  rationale: ينقل المعنى الأساسي للفظ δικαιοσύνη ويحافظ على إمكان دلالته هنا على الخُلُق البار أو فعل البر، مع إثبات «عدله» بديلًا في الحاشية.
- source_word: μένει
  choice: باقٍ
  rationale: صياغة عربية طبيعية تدل على الاستمرار والثبات.
- source_word: εἰς τὸν αἰῶνα
  choice: إلى الأبد
  rationale: المقابل العربي الاصطلاحي الواضح للديمومة التي تفيدها العبارة اليونانية.
theological_decisions:
- issue: دلالة δικαιοσύνη في الاقتباس ضمن سياق بولسي
  choice: بِرُّهُ
  alternative: عدله
  rationale: «البر» يحافظ على الاتساع الأخلاقي للمصطلح وعلى اتصاله بفعل السخاء، بينما يظل معنى «العدل» ممكنًا لغويًا؛ لذلك أُثبت في الحاشية بدل حسم التوتر الدلالي.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. حوفظ على الإيجاز والتوازي الشعري في الاقتباس، ووُضع بعض الضبط في «بِرُّهُ» منعًا لالتباس القراءة.
