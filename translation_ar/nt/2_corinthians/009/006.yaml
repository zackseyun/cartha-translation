base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/006.yaml
  text: 'This: the one who sows sparingly will also reap sparingly[a], and the one who sows with blessings will also reap with blessings.'
translation:
  language: ar
  text: 'وهذا ما أقوله: مَن يزرع بقلّة، فبقلّة أيضًا يحصد؛ ومَن يزرع بالبركات[a]، فبالبركات أيضًا يحصد.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أن تُترجم «بسخاء» أو «بوفرة». يستعمل النص اليوناني اسم «البركات»، لكنه قد يدل في هذا السياق على العطاء بمقدار سخي.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο δέ
  choice: 'وهذا ما أقوله:'
  rationale: صياغة عربية طبيعية تُظهر أن العبارة تمهيد لمبدأ موجز ومؤكد، مع نقل قوة δέ الانتقالية من غير إدخال معنى زمني غير موجود.
- source_word: ὁ σπείρων
  choice: مَن يزرع
  rationale: ينقل معنى اسم الفاعل المعرّف المستعمل استعمالًا عامًا في هذا القول المَثَلي، وهو أوضح في العربية من «الزارع» هنا.
- source_word: φειδομένως
  choice: بقلّة
  rationale: يدل في سياق العطاء على المقدار القليل أو المحدود. وتتفادى «بقلّة» إضافة حكم أخلاقي أقوى مثل «بشحّ»، مع إبقاء مقابلة الزرع والحصاد.
- source_word: καὶ θερίσει
  choice: فـ... أيضًا يحصد
  rationale: الفاء تُبرز علاقة النتيجة بما قبلها، و«أيضًا» تنقل καί وتحافظ على التوازي.
- source_word: ἐπ’ εὐλογίαις
  choice: بالبركات
  rationale: تحافظ على الاسم اليوناني εὐλογία وعلى تكراره في شطري الزرع والحصاد، مع بيان المعنى السياقي المحتمل في الحاشية.
theological_decisions:
- issue: دلالة ἐπ’ εὐλογίαις في مثل الزرع والحصاد
  choice: إبقاء اللفظ الاسمي «بالبركات» في الموضعين
  alternative: بسخاء / بوفرة
  rationale: السياق يسمح بالمعنى الاصطلاحي الدال على السخاء والوفرة، لكن إبقاء «البركات» يصون التلاعب اللفظي والصلة اللاهوتية بين العطاء والبركة. ولا تُصاغ الآية بما يجعلها وعدًا آليًا بالغنى المادي.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة، مع توازٍ مقصود بين «يزرع» و«يحصد» وبين «بقلّة» و«بالبركات». أُبقي التعبير غير المألوف نسبيًا «بالبركات» حفاظًا على صورة الأصل، وتوضحه الحاشية.
