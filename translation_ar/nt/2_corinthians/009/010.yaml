  text: The one who supplies seed to the sower and bread for food will supply and multiply your seed and increase the harvest of your righteousness[a][b].
translation:
  language: ar
  text: والذي يزوِّد الزارعَ بالبِذار والخبزَ للطعام، سيمدّكم بالبِذار ويُكثِّر بِذاركم، ويزيد غلّةَ برِّكم[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ثمار برِّكم» أو «نتاج برِّكم».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «غلّة عدلكم». فاللفظة اليونانية δικαιοσύνη قد تعني «البر» أو، في بعض السياقات، «العدل».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπιχορηγῶν
  choice: الذي يزوِّد
  rationale: نُقل اسم الفاعل المعرَّف بوصفه موصولًا اسميًّا، مع الحفاظ على معنى الإمداد دون المبالغة في تضمين دلالة السخاء.
- source_word: σπόρον τῷ σπείροντι
  choice: الزارعَ بالبِذار
  rationale: «البِذار» لفظ عربي واضح لما يُخصَّص للزرع، ويحافظ على الصورة الزراعية ويميّزه من الخبز المخصَّص للطعام.
- source_word: ἄρτον εἰς βρῶσιν
  choice: الخبزَ للطعام
  rationale: صياغة مباشرة تحفظ الغرض وتوازي البذار للزارع.
- source_word: χορηγήσει καὶ πληθυνεῖ τὸν σπόρον ὑμῶν
  choice: سيزوِّدكم ببِذاركم ويُكثِّره
  rationale: تحفظ الفعلين المستقبليين ومعنى الإمداد والتكثير. أُدخل ضمير المفعول مع الباء لصياغة عربية طبيعية، من غير تضييق البذار على العطاء المادي وحده.
- source_word: αὐξήσει τὰ γενήματα
  choice: يزيد غلّةَ
  rationale: «الغلّة» تنقل معنى المحصول أو الناتج وتحفظ الاستعارة الزراعية، مع التنبيه إلى بدائلها المعجمية في الحاشية.
- source_word: δικαιοσύνης ὑμῶν
  choice: برِّكم
  rationale: «البر» المقابل الكتابي العربي الطبيعي لـ δικαιοσύνη، ويحفظ اتساعها الأخلاقي واللاهوتي؛ وأُثبت احتمال «العدل» في الحاشية.
theological_decisions:
- issue: دلالة «غلّة بركم»
  choice: الإبقاء على استعارة الغلّة بوصفها نتائج البر وثماره في سياق السخاء، من غير حصرها في مردود مادي أو في منزلة قضائية
  alternative: ثمار الأمانة أو العدل، أو البرهان العملي على السلوك البار، أو بركة مادية ناجمة عن السخاء
  rationale: السياق سياق عطاء سخي، لكن العبارة الزراعية تتسع لنتائج البر المتنوعة؛ لذلك لا ينبغي أن تحسم الترجمة التوتر لمصلحة لاهوت الازدهار أو معنى اجتماعي أو قضائي حصري.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حُفظ التوازي الزراعي بين البذار والخبز والغلّة، وتُجنِّب إدخال أداة استئناف زمنية غير موجودة صراحة في الأصل. وُضعت علامتا الحاشيتين [a][b] في المتن.
