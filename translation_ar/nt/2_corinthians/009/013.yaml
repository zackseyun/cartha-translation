source:
  edition: SBLGNT
  text: διὰ τῆς δοκιμῆς τῆς διακονίας ταύτης δοξάζοντες τὸν θεὸν ἐπὶ τῇ ὑποταγῇ τῆς ὁμολογίας ὑμῶν εἰς τὸ εὐαγγέλιον τοῦ Χριστοῦ καὶ ἁπλότητι τῆς κοινωνίας εἰς αὐτοὺς καὶ εἰς πάντας,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/013.yaml
  text: Because of the proof provided by this ministry[a], they glorify God for the obedience of your confession to the gospel of the Messiah and for the generosity of your sharing with them and with everyone[d][c][b],
translation:
  language: ar
  text: وبسبب ما تثبته هذه الخدمة[a]، يمجّدون الله من أجل الخضوع الذي يظهر في اعترافكم بإنجيل المسيح[b]، ومن أجل سخائكم في العطاء لهم وللجميع[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمة العبارة: «وبسبب البرهان الناتج عن هذه الخدمة» أو «من خلال اختبار هذه الخدمة».'
    reason: يحمل δοκιμή معنى الاختبار وما ينتج منه من ثبوت أو برهان.
  - marker: b
    text: 'حرفيًا: «من أجل خضوع اعترافكم لإنجيل المسيح». وتحتمل العبارة أن يكون الخضوع متجليًا في اعترافكم بالإنجيل أو ملازمًا له.'
    reason: الإضافة في ὑποταγῇ τῆς ὁμολογίας موجزة، ولا تصرّح بدقة بكيفية العلاقة بين الخضوع والاعتراف.
  - marker: c
    text: 'حرفيًا يمكن أن تُفهم: «سخاء مشاركتكم لهم وللجميع». وتشير «المشاركة» هنا، على الأرجح، إلى الإسهام المادي في المعونة، مع احتفاظ الكلمة بمعنى المشاركة الأوسع. ويمكن أن تدل ἁπλότης أيضًا على الإخلاص أو صفاء القصد.'
    reason: يحمل كل من ἁπλότης وκοινωνία مدى دلاليًا أوسع من «السخاء» و«العطاء»، مع ترجيح المعنى المادي في هذا السياق.
lexical_decisions:
- source_word: δοκιμῆς
  choice: البرهان
  rationale: يدل اللفظ في السياق على ما تثبته هذه الخدمة عمليًا بعد أن ظهر صدقها، لا على عملية الاختبار وحدها.
- source_word: διακονίας
  choice: الخدمة
  rationale: تشير إلى خدمة الإغاثة وجمع العطاء، وتحفظ في العربية معناها العملي والديني من غير تخصيص زائد.
- source_word: δοξάζοντες τὸν θεὸν
  choice: يمجّدون الله
  rationale: صيغ اسم الفاعل اليوناني فعلًا مضارعًا عربيًا لتوضيح علاقته بمن ينتفعون بالخدمة، مع إبقاء معنى δοξάζω الأقرب إلى التمجيد.
- source_word: ὑποταγῇ
  choice: الخضوع
  rationale: يحفظ معنى الانقياد والتسليم بصورة أوضح من «الطاعة» وحدها، مع صياغة العلاقة بالاعتراف على نحو عربي مفهوم.
- source_word: ὁμολογίας ὑμῶν
  choice: اعترافكم
  rationale: يحفظ دلالة الإقرار العلني بالإيمان أو المجاهرة به.
- source_word: εἰς τὸ εὐαγγέλιον τοῦ Χριστοῦ
  choice: بإنجيل المسيح
  rationale: الباء طبيعية مع «الاعتراف» في العربية، و«المسيح» ترجمة راسخة للقب Χριστός وتحفظ قوته اللقبية.
- source_word: ἁπλότητι
  choice: سخائكم
  rationale: يفيد اللفظ هنا الكرم والانفتاح في البذل، وهو الأنسب لسياق جمع المعونة، مع بقاء احتمال الإخلاص أو البساطة مذكورًا في الحاشية.
- source_word: κοινωνίας
  choice: العطاء
  rationale: تشير المشاركة في هذا السياق إلى الإسهام المادي في المعونة؛ و«العطاء» يوضح ذلك للقارئ العربي، مع بيان المعنى الأوسع في الحاشية.
- source_word: εἰς αὐτοὺς καὶ εἰς πάντας
  choice: لهم وللجميع
  rationale: تنقل اتجاه العطاء إلى المستفيدين المذكورين وإلى الآخرين بعبارة عربية موجزة وطبيعية.
theological_decisions:
- issue: العلاقة بين الخضوع والاعتراف في ὑποταγῇ τῆς ὁμολογίας
  choice: الخضوع الذي يرافق اعترافكم
  alternative: خضوع اعترافكم
  rationale: الإضافة اليونانية موجزة وتحتمل أن يكون الخضوع متجليًا في الاعتراف أو ملازمًا له. الصياغة المختارة مفهومة بالعربية ولا تجعل «الاعتراف» نفسه فاعلًا واعيًا للخضوع، والحاشية تحفظ البنية الأشد حرفية.
- issue: دلالة Χριστοῦ
  choice: المسيح
  alternative: كريستوس
  rationale: Χριστός لقب معناه الممسوح/المسيح، وترجمته العربية المألوفة تحفظ دلالته المسيانية من غير تحويله إلى اسم منقول صوتيًا.
- issue: دلالة κοινωνία في سياق الجمع
  choice: العطاء
  alternative: المشاركة أو الشركة
  rationale: السياق يتناول مساهمة مادية في خدمة القديسين، لكن اللفظ أوسع من المال وحده؛ لذلك اختير المعنى السياقي ووضع الاتساع الدلالي في الحاشية.
translation_notes:
  register: الصياغة عربية فصحى معاصرة، واضحة وموقرة. روعي اتصال الآية بالسياق السابق مع تحويل اسم الفاعل اليوناني إلى فعل صريح. استُخدمت «المسيح» بوصفها لقبًا عربيًا راسخًا، وحُفظت وجوه الغموض المعجمية والنحوية المهمة في الحواشي.
