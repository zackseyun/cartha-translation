  yaml_path: translation/nt/2_corinthians/009/003.yaml
  text: But I sent the brothers[a], so that our boasting about you might not be emptied in this matter, so that, just as I was saying, you may be prepared[b],
translation:
  language: ar
  text: لكني أرسلت الإخوة، لئلا يصير افتخارنا بكم فارغًا في هذا الأمر، ولكي تكونوا مستعدين، كما كنت أقول.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπεμψα
  choice: أرسلت
  rationale: الماضي البسيط ينقل صيغة الماضي اليونانية بوضوح في هذا السياق التفسيري.
- source_word: τοὺς ἀδελφούς
  choice: الإخوة
  rationale: تشير العبارة هنا على الأرجح إلى المندوبين الرجال المحددين في السياق، ولذلك حوفظ على صيغة المذكر الجمع.
- source_word: τὸ καύχημα ἡμῶν τὸ ὑπὲρ ὑμῶν
  choice: افتخارنا بكم
  rationale: ينقل معنى حديث بولس بفخر عن أهل كورنثوس، وهو تعبير عربي طبيعي وموجز.
- source_word: κενωθῇ
  choice: يصير ... فارغًا
  rationale: يحفظ صورة الخواء في الفعل اليوناني مع صياغة عربية مفهومة، ويدل في السياق على أن الافتخار قد يتبين بلا أساس.
- source_word: ἐν τῷ μέρει τούτῳ
  choice: في هذا الأمر
  rationale: المراد ناحية أو مسألة بعينها، لا جزء مادي.
- source_word: καθὼς ἔλεγον
  choice: كما كنت أقول
  rationale: يحفظ دلالة الماضي الناقص على قول سابق مستمر أو متكرر.
- source_word: παρεσκευασμένοι ἦτε
  choice: تكونوا مستعدين
  rationale: يعبر عن حالة الاستعداد المقصودة من إرسال الإخوة، ويحافظ على ارتباطها بجملة الغرض.
