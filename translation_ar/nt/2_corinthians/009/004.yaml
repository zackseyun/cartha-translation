  yaml_path: translation/nt/2_corinthians/009/004.yaml
  text: lest if any Macedonians come with me and find you unprepared[b][a], we—not to say you—would be put to shame in this matter of confidence.
translation:
  language: ar
  text: 'لئلّا يأتي معي بعضُ المقدونيين فيجدوكم غير مستعدين، فنُخزى نحن—حتى لا نقول: أنتم أيضًا—في هذه الثقة.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في هذا المسعى» أو «في هذا الموقف». واللفظة اليونانية قد تدل هنا على ثقة بولس بكم، وهو المعنى الأرجح في السياق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μή πως ἐὰν
  choice: لئلّا، إن
  rationale: ينقل التعبير خشية بولس من احتمال مستقبلي، مع إبقاء البنية الشرطية من غير تحويلها إلى غاية إيجابية.
- source_word: ἔλθωσιν σὺν ἐμοὶ Μακεδόνες
  choice: جاء معي بعضُ أهل مقدونية
  rationale: الاسم غير معرّف ويفيد احتمال مجيء أفراد من مقدونية، لا جماعة محددة بالضرورة.
- source_word: εὕρωσιν ὑμᾶς ἀπαρασκευάστους
  choice: وجدوكم غير مستعدين
  rationale: ترجمة مباشرة وطبيعية لحالة عدم الاستعداد، والمقصود في السياق عدم تجهيز العطية.
- source_word: καταισχυνθῶμεν
  choice: نُخزى
  rationale: يحفظ صيغة المبني للمجهول والدلالة الاجتماعية للعار أمام الآخرين، لا مجرد الشعور الداخلي بالخجل.
- source_word: ἡμεῖς
  choice: نحن
  rationale: أُثبت الضمير المنفصل للمحافظة على توكيد الضمير الصريح في اليونانية.
- source_word: ἵνα μὴ λέγωμεν ὑμεῖς
  choice: كي لا أقول أنتم أيضًا
  rationale: يحفظ الاعتراض البلاغي الذي يلطّف القول، مع الإيحاء الواضح بأن أهل كورنثوس سيشتركون في الخزي.
- source_word: ἐν τῇ ὑποστάσει ταύτῃ
  choice: في هذه الثقة
  rationale: الثقة هي الأنسب في السياق، إذ يتحدث بولس عن ثقته باستعدادهم، مع إبقاء إيجاز العبارة وغموضها المعجمي المشروع.
theological_decisions:
- issue: دلالة ὑπόστασις في هذا السياق البولسي غير الاصطلاحي
  choice: الثقة
  alternative: هذا المسعى أو هذا الموقف
  rationale: السياق يتناول ثقة بولس باستعداد الكورنثيين أمام القادمين من مقدونية، ولا يقتضي معنى فلسفيًا أو لاهوتيًا لاحقًا مثل «الجوهر».
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «أهل مقدونية» للدلالة الطبيعية على المقدونيين، وحُفظ الاعتراض البلاغي بين شرطتين. وُضعت علامة الحاشية بعد العبارة التي تشرحها.
