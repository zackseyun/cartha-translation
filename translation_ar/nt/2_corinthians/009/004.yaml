  rationale: صُحّح ضمير الفعل في الاعتراض البلاغي من المفرد إلى الجمع، وسُوّي افتتاح الجملة ليكون طبيعيًا في العربية مع الحفاظ على خشية بولس من وقوع الاحتمال المستقبلي. وأُبقيت «الثقة» والحاشية كما هما لأنهما تنقلان الدلالة السياقية غير الاصطلاحية لـ ὑπόστασις دون فرض معنى لاهوتي لاحق.
