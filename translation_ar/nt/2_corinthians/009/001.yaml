  rationale: تحافظ «الخدمة» على دلالة διακονία الرفيعة والعملية معًا، وتشمل هنا عمل جمع العطاء وإيصاله، من غير حصر المعنى في المال وحده.
- source_word: τῆς εἰς τοὺς ἁγίους
