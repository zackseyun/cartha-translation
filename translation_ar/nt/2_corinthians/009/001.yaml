  rationale: تنقل «لـ» جهة الخدمة أو المستفيدين منها بصورة عربية طبيعية، مع إبقاء الاحتمال الدلالي بين التوجّه والمنفعة موضحًا في الحاشية.
- source_word: ἁγίους
  choice: القديسين
  rationale: هو المقابل العربي المألوف للفظ البولسي الذي يصف المؤمنين بأنهم مكرسون لله، من غير إضافة تفسيرية إلى المتن.
- source_word: περισσόν
  choice: من نافلة القول
  rationale: تعبير عربي فصيح مفهوم يؤدي معنى كون الكتابة زائدة أو غير لازمة، ويحفظ النبرة البلاغية بدل صياغة تقريرية مسطحة مثل «لا حاجة».
- source_word: μοί ἐστιν τὸ γράφειν ὑμῖν
  choice: فمن نافلة القول أن أكتب إليكم عنها
  rationale: صياغة عربية طبيعية تحفظ المتكلم والمخاطبين، وأُضيف الضمير «عنها» لبيان تعلّق الكتابة بموضوع الخدمة المفهوم من السياق من غير تغيير المضمون.
