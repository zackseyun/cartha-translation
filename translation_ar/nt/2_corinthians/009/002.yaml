revisions:
- from: فإني أعرف حماستكم[a]، التي أفتخر بها من جهتكم أمام أهل مقدونية، قائلًا إن أخائية مستعدة منذ العام الماضي[b]، وإن غيرتكم قد حفزت معظمهم[c].
  to: فإني أعرف حماستكم[a]، التي أفتخر بها بشأنكم لدى أهل مقدونية، قائلًا إن أخائية قد استعدّت منذ العام الماضي[b]، وإن غيرتكم قد حفّزت معظمهم[c].
  rationale: تُحسّن المراجعة تمثيل فعل التام في «قد استعدّت»، وتستبدل تعبيرين أقل سلاسة بتراكيب عربية أوضح، وتعيد صياغة الحاشية الجغرافية بحيث تشرح المجاز النصي دون أن تحوّل اسم الإقليم إلى صياغة النص الرئيسية أو توحي بأن الاستعداد انتهى في الماضي.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:26:15Z'
review_pass:
  verdict: revise
  source_fidelity: 'النص ينقل المعنى العام بأمانة: معرفة بولس باستعدادهم، وافتخاره بشأنهم لدى المقدونيين، واستعداد أخائية منذ العام الماضي، وأثر غيرتهم في معظمهم. غير أن «قد استعدّت» أدق في نقل صيغة التام اليونانية من الوصف المجرد «مستعدة»، كما أن الحاشية الحالية تصف الاستعداد بصيغة الماضي («كانوا مستعدين») من دون بيان واضح لاستمرار الحالة إلى وقت الكلام.'
  naturalness: الأسلوب فصيح ومفهوم. «لدى أهل مقدونية» أوفق من «أمام أهل مقدونية» مع فعل الكلام/الافتخار، و«بشأنكم» أكثر سلاسة ووضوحًا من «من جهتكم» في هذا التركيب.
  terminology: «حماستكم» و«غيرتكم» يحافظان على التمييز النسبي بين προθυμία وζῆλος، مع أن السياق يحدد المعنى الإيجابي لـ«غيرتكم». أُبقيت «أخائية» اسمًا جغرافيًا كما في الأصل، وتوضح الحاشية استعماله المجازي دون حصره تفسيريًا في جماعة بعينها.
  issues:
  - severity: low
    issue: صيغة «مستعدة» لا تُظهر بوضوح فعل الاستعداد السابق الكامن في παρεσκεύασται.
    rationale: صيغة التام تفيد حالة حاضرة ناشئة عن إعداد سابق؛ «قد استعدّت ... منذ العام الماضي» تنقل ذلك بصورة أوضح.
  - severity: low
    issue: الحاشية (ب) تقول «كانوا مستعدين»، فتضع الاستعداد في الماضي ولا تشرح بدقة الاستعمال المجازي لاسم الإقليم.
    rationale: العبارة اليونانية تسمي أخائية، مع دلالة سياقية على المؤمنين فيها، والاستعداد يمتد من العام الماضي إلى زمن الكلام.
