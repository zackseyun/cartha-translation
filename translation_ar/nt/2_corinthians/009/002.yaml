id: 2CO.9.2
reference: 2 Corinthians 9:2
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: οἶδα γὰρ τὴν προθυμίαν ὑμῶν ἣν ὑπὲρ ὑμῶν καυχῶμαι Μακεδόσιν ὅτι Ἀχαΐα παρεσκεύασται ἀπὸ πέρυσι, καὶ ⸀τὸ ὑμῶν ζῆλος ἠρέθισε τοὺς πλείονας.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/002.yaml
  text: 'For I know your eagerness[a], which I boast about to the Macedonians on your behalf: that Achaia has been ready since last year[c][b], and your zeal has stirred up most of them.'
translation:
  language: ar
  text: فإني أعرف حماستكم[a]، التي أفتخر بها بشأنكم لدى أهل مقدونية، قائلًا إن أخائية قد استعدّت منذ العام الماضي[b]، وإن غيرتكم قد حفّزت معظمهم[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «استعدادكم» أو «رغبتكم الجادة».'
    reason: lexical_alternative
  - marker: b
    text: أي إن اسم أخائية، الإقليم الذي يضم كورنثوس، يُستعمل هنا للدلالة على المؤمنين فيه.
    reason: cultural_note
  - marker: c
    text: أي غالبية أهل مقدونية.
    reason: referent_clarification
lexical_decisions:
- source_word: προθυμίαν
  choice: حماستكم
  rationale: تدل الكلمة على استعداد نفسي ورغبة جادة؛ و«حماستكم» طبيعية في العربية وتحافظ على نبرة الثناء، مع ذكر «استعدادكم» بديلًا في الحاشية.
- source_word: καυχῶμαι
  choice: أفتخر بها
  rationale: يحافظ هذا التعبير على قوة خطاب بولس الصريحة من غير تلطيفها إلى مجرد الإشادة.
- source_word: ὑπὲρ ὑμῶν
  choice: من جهتكم
  rationale: مع فعل الافتخار تفيد العبارة أن بولس يتحدث عنهم مؤيدًا ومشيدًا بهم أمام المقدونيين.
- source_word: Μακεδόσιν
  choice: أمام أهل مقدونية
  rationale: يشير الجمع إلى أهل مقدونية الذين كان بولس يخاطبهم؛ وهذه صياغة عربية واضحة من غير إضافة تفسيرية بأنهم مؤمنون.
- source_word: Ἀχαΐα
  choice: أخائية
  rationale: أُبقي اسم الإقليم كما في اليونانية، حيث يُستعمل مجازًا عن المؤمنين فيه، ولا سيما في كورنثوس.
- source_word: παρεσκεύασται
  choice: مستعدة
  rationale: ينقل الوصف حالة الاستعداد الناتجة من إعداد سابق، ويلائم العبارة الزمنية التالية.
- source_word: ἀπὸ πέρυσι
  choice: منذ العام الماضي
  rationale: هذه هي الصياغة العربية الطبيعية للدلالة على امتداد الحالة من العام السابق إلى وقت الكلام.
- source_word: τὸ ὑμῶν ζῆλος
  choice: غيرتكم
  rationale: «الغيرة» هنا إيجابية بمعنى الاجتهاد المتقد والرغبة الجادة، وتحافظ على قوة اللفظ اليوناني.
- source_word: ἠρέθισε
  choice: حفزت
  rationale: ينقل الفعل أثر إثارة الآخرين ودفعهم إلى العمل، من غير الإيحاء السلبي الذي قد تحمله «استفزت».
- source_word: τοὺς πλείονας
  choice: معظمهم
  rationale: المعنى هو أكثر أفراد الجماعة أو غالبيتهم، والضمير يعود طبيعيًا إلى أهل مقدونية المذكورين.
theological_decisions:
- issue: مرجع «أخائية»
  choice: الإبقاء على اسم الإقليم بوصفه قائمًا مجازًا مقام المؤمنين فيه.
  alternative: أنتم مستعدون منذ العام الماضي؛ أو المؤمنون في أخائية مستعدون.
  rationale: النص اليوناني يذكر Ἀχαΐα صراحة، والإبقاء عليه يصون الصياغة والنطاق الإقليمي، بينما توضّح الحاشية المجاز.
- issue: قوة تعبير بولس عن الافتخار
  choice: «أفتخر بها» بصياغة صريحة.
  alternative: أشيد بها؛ أو أتكلم عنها باعتزاز.
  rationale: الفعل καυχῶμαι قوي ومقصود بلاغيًا، ولا يقتضي السياق تخفيفه.
- issue: دلالة ζῆλος الإيجابية
  choice: «غيرتكم» بمعناها الإيجابي.
  alternative: حماستكم؛ أو اجتهادكم.
  rationale: يحافظ الاختيار على قوة المصطلح وعلى التمييز النسبي بين προθυμία وζῆλος، مع إمكان فهمه هنا من السياق بوصفه غيرة محمودة.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. استُعمل «قائلًا» لإظهار مضمون افتخار بولس الذي تدخله ὅτι، وأُبقي اسم «أخائية» حفاظًا على المرجع الجغرافي الأصلي.
