source:
  edition: SBLGNT
  text: ⸀δυνατεῖ δὲ ὁ θεὸς πᾶσαν χάριν περισσεῦσαι εἰς ὑμᾶς, ἵνα ἐν παντὶ πάντοτε πᾶσαν αὐτάρκειαν ἔχοντες περισσεύητε εἰς πᾶν ἔργον ἀγαθόν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/008.yaml
  text: And God is able to make all grace abound to you[a], so that in everything, at all times, having all sufficiency, you may abound in every good work.
translation:
  language: ar
  text: والله قادر أن يُفيض عليكم كل نعمة، لكي تكون لكم، في كل شيء وفي كل حين، كفاية كاملة[a]، فتفيضوا في كل عمل صالح.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «كل ما تحتاجون إليه». يمكن أن تدل الكلمة اليونانية على الكفاية أو توافر ما يلزم أو القناعة؛ والمقصود هنا ما يوفره الله على نحو كافٍ، لا اكتفاء الإنسان بنفسه مستقلًا عن الله.
    reason: lexical_alternative
lexical_decisions:
- source_word: δυνατεῖ
  choice: قادر
  rationale: ينقل قدرة الله وإمكان فعله بصياغة عربية طبيعية، من غير مبالغة في الدلالة.
- source_word: δὲ
  choice: و
  rationale: أداة وصل خفيفة في السياق، وليست استدراكًا قويًا.
- source_word: πᾶσαν χάριν
  choice: كل نعمة
  rationale: تحافظ «نعمة» على اتساع معنى χάρις بوصفها عطاء الله المتفضل، بما يشمل تمكين المؤمنين من السخاء، من غير قصرها على المال.
- source_word: περισσεῦσαι εἰς ὑμᾶς
  choice: أن يُفيض عليكم
  rationale: تعبير عربي طبيعي يحفظ معنى التسبب في الوفرة واتجاه النعمة إلى المخاطَبين.
- source_word: ἵνα
  choice: لكي
  rationale: تُظهر بوضوح معنى الغاية، مع بقاء احتمال النتيجة ملازمًا للسياق.
- source_word: ἐν παντὶ πάντοτε
  choice: دائمًا، في كل شيء
  rationale: يحفظ التوكيد الشامل في اللفظين اليونانيين بصياغة عربية واضحة.
- source_word: πᾶσαν αὐτάρκειαν
  choice: كل الكفاية
  rationale: تحفظ تكرار ألفاظ الشمول وتدل على توافر ما يكفي، من غير إيحاء بالاستقلال عن الله؛ وتوضح الحاشية البديل الدلالي الأسلس.
- source_word: ἔχοντες
  choice: يكون لديكم
  rationale: ينقل معنى الامتلاك أو التوافر الملازم للفعل الرئيس، بصياغة عربية طبيعية داخل جملة الغاية.
- source_word: περισσεύητε
  choice: فتفيضوا
  rationale: يحفظ تكرار صورة الفيض الواردة في الفعل السابق، ويبين أن وفرة نعمة الله تثمر وفرة في العمل الصالح.
- source_word: εἰς πᾶν ἔργον ἀγαθόν
  choice: في كل عمل صالح
  rationale: صياغة عربية مألوفة بعد «تفيضوا»، تنقل اتجاه الوفرة إلى كل فعل صالح.
theological_decisions:
- issue: معنى χάρις في سياق العطاء
  choice: نعمة الله وعطاؤه المتفضل بمعناه الواسع، بما يشمل التمكين المادي للسخاء
  alternative: الحظوة وحدها، أو عطية مالية محددة
  rationale: السياق يتناول العطاء، لكن اللفظة أوسع من المال؛ لذلك تحافظ «نعمة» على البعد اللاهوتي واتساع عمل الله.
- issue: معنى αὐτάρκεια
  choice: الكفاية التي يوفرها الله
  alternative: القناعة، أو الاكتفاء الذاتي المستقل
  rationale: السياق يجعل الله مصدر ما لدى المؤمنين، لكي يقدروا على فعل الخير؛ ومن ثم لا ينبغي أن توحي الترجمة باستقلال الإنسان عن الله.
translation_notes:
  register: العربية فصحى معاصرة واضحة ووقورة. حُفظ تكرار ألفاظ الشمول وصورة الفيض قدر الإمكان، مع تجنب تركيب حرفي ثقيل أو مصطلح «الاكتفاء الذاتي» في المتن لما قد يوحي به من استقلال عن الله.
