  revised_text: لِيُعْطِ كُلُّ وَاحِدٍ كَمَا عَزَمَ فِي قَلْبِهِ[a]، لَا عَنْ حُزْنٍ[b] وَلَا عَنِ اضْطِرَارٍ، لِأَنَّ اللهَ يُحِبُّ الْمُعْطِيَ الْمَسْرُورَ.
