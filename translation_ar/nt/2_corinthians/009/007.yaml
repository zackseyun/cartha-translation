  source_fidelity: 'النص يحفظ البنية الأساسية للأصل: التوزيع الفردي، القرار القلبي، نفي الحزن، ومحبة الله للمعطي الفَرِح. غير أن «إكراه» أضيق وأشد من ἀνάγκης، التي تدل هنا على الاضطرار أو الإلزام/الضغط، لا على الإكراه القسري وحده.'
  naturalness: الصياغة فصيحة واضحة ومناسبة للسجل الكتابي الحديث. «ليُعطِ كل واحد كما عزم في قلبه» سليمة وطبيعية، و«المعطي المسرور» مفهومة وتحافظ على وصف المعطي.
  terminology: «حزن» مقابل دقيق لـ λύπη مع حاشية نافعة للمعنى السياقي. يُستحسن «اضطرار» مقابل ἀνάγκης لأنه أوسع وأقرب إلى معنى الضرورة الضاغطة من «إكراه». ولا يلزم تعديل في «القلب» أو «يحب» أو «المعطي المسرور».
  issues:
