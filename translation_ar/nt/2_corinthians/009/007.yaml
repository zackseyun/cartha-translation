  to: لِيُعْطِ كُلُّ وَاحِدٍ كَمَا عَزَمَ فِي قَلْبِهِ[a]، لَا عَنْ حُزْنٍ[b] وَلَا عَنِ اضْطِرَارٍ، لِأَنَّ اللهَ يُحِبُّ الْمُعْطِيَ الْمَسْرُورَ.
  rationale: 'التعديل الوحيد هو استبدال «إكراه» بـ«اضطرار» لتقريب دلالة ἀνάγκης في سياق العطاء: ليس عطاءً ناشئًا عن حزن ولا عن ضرورة أو ضغط مُلزِم. بقيت الحواشي وعلاماتها في مواضعها، وحُفظت بقية اختيارات النص لسلامتها ودقتها.'
