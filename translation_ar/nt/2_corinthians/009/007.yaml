  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἕκαστος καθὼς ⸀προῄρηται τῇ καρδίᾳ, μὴ ἐκ λύπης ἢ ἐξ ἀνάγκης· ἱλαρὸν γὰρ δότην ἀγαπᾷ ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/007.yaml
  text: Each one should give as he has decided in his heart[a], not out of grief or compulsion[b], for God loves a cheerful giver.
translation:
  language: ar
  text: لِيُعْطِ كُلُّ وَاحِدٍ كَمَا عَزَمَ فِي قَلْبِهِ[a]، لَا عَنْ حُزْنٍ[b] وَلَا عَنِ اضْطِرَارٍ، لِأَنَّ اللهَ يُحِبُّ الْمُعْطِيَ الْمَسْرُورَ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: صيغة المفرد المذكر في «كل واحد... قلبه» تمثيلية وتشمل كل شخص، ولا تقتصر على الرجال.
    reason: cultural_note
  - marker: b
    text: 'أو: «على كره». واليونانية حرفيًا: «عن حزن» أو «عن أسى».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: كُلُّ وَاحِدٍ
  rationale: يحفظ صيغة المفرد التوزيعية في اليونانية، وهو تعبير عربي واضح يشمل كل فرد دون قصره على الرجال.
- source_word: καθὼς
  choice: كَمَا
  rationale: ينقل معيار العطاء الذي تحدده العبارة التالية بصياغة عربية طبيعية ومباشرة.
- source_word: προῄρηται
  choice: عَزَمَ
  rationale: يفيد قرارًا مقصودًا ومستقرًا اتخذه الشخص في داخله؛ و«عزم» يحفظ قوة القصد السابق دون إطالة.
- source_word: τῇ καρδίᾳ
  choice: فِي قَلْبِهِ
  rationale: يحفظ الصورة الأنثروبولوجية الكتابية للقلب بوصفه موضع القصد الداخلي، بدل اختزالها في التفكير العقلي وحده.
- source_word: μὴ ἐκ λύπης
  choice: لَا عَنْ حُزْنٍ
  rationale: يحافظ على المعنى المعجمي المباشر لـ λύπη، أي الحزن أو الأسى، مع بيان الدلالة السياقية المحتملة في الحاشية.
- source_word: ἢ ἐξ ἀνάγκης
  choice: وَلَا عَنْ إِكْرَاهٍ
  rationale: ينقل معنى الضرورة الضاغطة أو الإلزام في سياق العطاء، ويأتي طبيعيًا في مقابلة العطاء النابع من قصد القلب.
- source_word: ἱλαρὸν
  choice: الْمَسْرُورَ
  rationale: ينقل هيئة المعطي المتصفة بالفرح والرضا، ويحافظ على وصف الشخص لا الفعل وحده.
- source_word: δότην
  choice: الْمُعْطِيَ
  rationale: مقابل اسمي مباشر وواضح يحفظ تركيز اليونانية على الشخص الذي يعطي.
- source_word: ἀγαπᾷ
  choice: يُحِبُّ
  rationale: يحفظ المعنى المعتاد للفعل ἀγαπάω دون تحويله إلى مجرد الرضا أو الاستحسان.
- source_word: ὁ θεός
  choice: اللهَ
  rationale: المقابل العربي المباشر للفاعل اليوناني، وقد جاء منصوبًا لأنه اسم «أنَّ» في تركيب عربي طبيعي.
theological_decisions:
- issue: صيغة المفرد المذكر ذات الدلالة التمثيلية
  choice: كُلُّ وَاحِدٍ ... فِي قَلْبِهِ
  alternative: كُلُّ شَخْصٍ ... فِي قَلْبِهِ
  rationale: يحفظ الاختيار صيغة المفرد في الأصل وتركيزه على المسؤولية الفردية. والتذكير هنا تمثيلي في العربية واليونانية، ولا يدل على اقتصار الخطاب على الرجال؛ وقد وُضّح ذلك في الحاشية.
- issue: دلالة λύπη في سياق العطاء
  choice: لَا عَنْ حُزْنٍ
  alternative: لَا عَلَى كُرْهٍ
  rationale: يحفظ النص الرئيس الدلالة المعجمية الصريحة للحزن، بينما تذكر الحاشية المعنى السياقي الشائع، وهو العطاء على كره أو بتردد، من غير أن تحسم التوتر بين اللفظ وسياقه.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ووقورة. استُعمل «ليعطِ» لإظهار الفعل المفهوم من السياق في العبارة اليونانية الموجزة، وحُفظت ألفاظ «القلب» و«الحزن» و«يحب» لقربها من بنية الأصل ومعجمه.
