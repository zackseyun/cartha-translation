  text: ὅτι ἡ διακονία τῆς λειτουργίας ταύτης οὐ μόνον ἐστὶν προσαναπληροῦσα τὰ ὑστερήματα τῶν ἁγίων, ἀλλὰ καὶ περισσεύουσα διὰ πολλῶν εὐχαριστιῶν τῷ θεῷ—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/012.yaml
  text: For the ministry of this service is not only supplying the needs of the saints[b][a], but is also overflowing in many thanksgivings to God—
translation:
  language: ar
  text: لِأَنَّ خِدْمَةَ هٰذِهِ المُهِمَّةِ لا تُلَبِّي احْتِيَاجَاتِ القِدِّيسِينَ[a] فَحَسْبُ، بَلْ تَفِيضُ أَيْضًا بِكَثِيرٍ مِنَ الشُّكْرِ للهِ[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «توفّر ما ينقص القديسين».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «تفيض أيضًا من خلال شكر كثير لله».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: لأنَّ
  rationale: تُدخل الأداة تعليلًا أو شرحًا لما سبق، و«لأنَّ» تؤدي هذه القوة بوضوح في العربية.
- source_word: ἡ διακονία τῆς λειτουργίας ταύτης
  choice: خدمة هذا العمل
  rationale: تُبقي «خدمة» للدلالة على διακονία، وتستعمل «العمل» لـ λειτουργία تجنبًا لتكرار لفظ الخدمة، مع الإشارة إلى مهمة العطاء المحددة في السياق.
- source_word: προσαναπληροῦσα
  choice: تسدّ
  rationale: الفعل يدل على إكمال ما ينقص أو توفيره؛ و«تسدّ» تركيب عربي طبيعي مع «النقص» ويحفظ صورة ملء العوز.
- source_word: τὰ ὑστερήματα
  choice: نقص
  rationale: اللفظ يشير إلى ما ينقص أو إلى أوجه العوز؛ والمفرد الجمعي «نقص» واضح وطبيعي، مع إثبات البديل في الحاشية.
- source_word: τῶν ἁγίων
  choice: القديسين
  rationale: يحفظ المصطلح البولسي المعتاد للمؤمنين، من غير استبداله بتفسير أوسع مثل «شعب الله».
- source_word: περισσεύουσα
  choice: تفيض
  rationale: تنقل معنى الوفرة التي تتجاوز حد الكفاية، وتحافظ على الصورة الحية في النص.
- source_word: διὰ πολλῶν εὐχαριστιῶν τῷ θεῷ
  choice: بشكر كثير لله
  rationale: الباء تعكس احتمال الوسيلة أو المجال في διά مع المضاف إليه، بينما يبيّن «لله» أن الشكر متجه إلى الله.
theological_decisions:
- issue: دلالة ἅγιοι على جماعة المؤمنين
  choice: القديسين
  alternative: المؤمنين / شعب الله
  rationale: «القديسين» يحفظ لقب بولس الجماعي من دون حصره في فئة كنسية لاحقة، أما البدائل فتشرح المقصود لكنها أقل التصاقًا باللفظ.
- issue: العلاقة التي تعبّر عنها διά في عبارة الشكر
  choice: تفيض أيضًا بشكر كثير لله
  alternative: تؤدي أيضًا إلى شكر كثير لله
  rationale: الصياغة المختارة تحفظ قدرًا من غموض كون الشكر وسيلة أو مظهرًا أو نتيجة، بدل أن تحسمه سببيًا على أنه نتيجة فقط.
translation_notes:
  register: عربية فصحى واضحة ومهيبة، بصياغة طبيعية تحفظ التوازي بين «لا... فحسب، بل... أيضًا» وصورة الفيض. وُضعت علامتا الحاشية عند العبارتين اللتين تتصلان بهما مباشرة.
