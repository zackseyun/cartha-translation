  - severity: medium
    issue: تمثيل πολλῶν εὐχαριστιῶν بعبارة «بشكر كثير».
    rationale: العبارة العربية مفهومة، لكنها تجعل الشكر مفردًا وقد تخفف فكرة كثرة أعمال/تعبيرات الشكر. «بكثير من الشكر» أوضح وأفصح.
