  to: لِأَنَّ خِدْمَةَ هٰذِهِ المُهِمَّةِ لا تُلَبِّي احْتِيَاجَاتِ القِدِّيسِينَ[a] فَحَسْبُ، بَلْ تَفِيضُ أَيْضًا بِكَثِيرٍ مِنَ الشُّكْرِ للهِ[b]—
  rationale: تُبقي المراجعة البنية التعليلية والتوازي بين «لا ... فحسب» و«بل ... أيضًا»، وتحافظ على لقب «القديسين». واستُبدلت «نقص» بـ«احتياجات» لتظهر صيغة الجمع ومعنى العوز، و«بشكر كثير» بـ«بكثير من الشكر» لتعبّر بصورة أوضح عن كثرة الشكر من غير حسم وظيفة διά بأنها نتيجة فقط. كما أن «هذه المهمة» تنقل λειτουργία بلفظ طبيعي متميز من «خدمة» المقابلة لـ διακονία.
