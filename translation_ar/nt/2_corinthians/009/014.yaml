id: 2CO.9.14
reference: 2 Corinthians 9:14
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ αὐτῶν δεήσει ὑπὲρ ὑμῶν ἐπιποθούντων ὑμᾶς διὰ τὴν ὑπερβάλλουσαν χάριν τοῦ θεοῦ ἐφ’ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/014.yaml
  text: and in their prayer for you[a], they long for you because of the surpassing grace of God upon you.
translation:
  language: ar
  text: وهم، إذ يصلّون من أجلكم، يشتاقون إليكم بسبب نعمة الله الفائقة عليكم.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وفي تضرعهم من أجلكم، يحنّون إليكم بسبب نعمة الله الفائقة عليكم».'
    reason: بديل معجمي ونحوي يحافظ على «δέησις» بوصفه تضرعًا وعلى الصياغة الاسمية المكثفة في الأصل.
lexical_decisions:
- source_word: δεήσει
  choice: يصلّون
  rationale: يدل الاسم على الدعاء أو التضرع والالتماس. صيغ فعلًا ضمن تركيب حالي لتوضيح العبارة اليونانية المكثفة بلغة عربية طبيعية، مع إبقاء معنى الصلاة الشفاعية.
- source_word: αὐτῶν
  choice: هم
  rationale: ضمير جمع يعود إلى متلقي العطية المذكورين في السياق؛ أُدمج في الفاعل «هم» لأن العربية لا تحتاج إلى تركيب اسمي حرفي من قبيل «في صلاتهم».
- source_word: ὑπὲρ ὑμῶν
  choice: من أجلكم
  rationale: ينقل معنى الصلاة لأجل المخاطبين أو نيابة عنهم بصياغة عربية مألوفة.
- source_word: ἐπιποθούντων
  choice: يشتاقون إليكم
  rationale: يفيد شوقًا قويًا ومتواصلًا. حُوّل اسم الفاعل اليوناني إلى فعل مضارع واضح مع الحفاظ على تزامنه مع الصلاة بواسطة «إذ».
- source_word: διὰ
  choice: بسبب
  rationale: 'مع حالة النصب يفيد هنا العلة: منشأ شوقهم هو نعمة الله الظاهرة على المخاطبين.'
- source_word: ὑπερβάλλουσαν
  choice: الفائقة
  rationale: تحافظ على معنى التجاوز والتفوق من غير إضافة صورة «الفيضان» غير الصريحة في اللفظ.
- source_word: χάριν
  choice: نعمة
  rationale: المقابل العربي الراسخ الذي يصون ثقل المصطلح البولسي بوصفه إحسان الله المجاني وعمله المُمكِّن.
- source_word: ἐφ’ ὑμῖν
  choice: عليكم
  rationale: يحافظ على الصورة المكانية المحتملة لنعمة الله الكائنة على المخاطبين، من غير حصرها في معنى «بينكم» أو «نحوكم».
- source_word: καὶ
  choice: و
  rationale: أداة وصل تربط العبارة بما قبلها على نحو مباشر.
theological_decisions:
- issue: العلاقة النحوية بين الصلاة والاشتياق
  choice: 'صياغة الصلاة في جملة حالية: «وهم، إذ يصلّون من أجلكم، يشتاقون إليكم»'
  alternative: «وفي تضرعهم من أجلكم، وهم مشتاقون إليكم» أو فهم الصلاة وسيلةً يُعبَّر بها عن الاشتياق
  rationale: التركيب اليوناني مكثف، وفيه اسم «التضرع/الصلاة» مع ضمير واسم فاعل في صيغة المضاف إليه. الصياغة المختارة تحفظ الفعلين وتزامنهما، ولا تحسم أن الصلاة هي مجرد وسيلة التعبير عن الشوق.
- issue: دلالة نعمة الله على المخاطبين
  choice: «نعمة الله الفائقة عليكم»
  alternative: «نعمة الله الفائقة بينكم» أو «نحوكم»
  rationale: يحفظ «عليكم» مجال دلالة ἐπί مع المجرور في هذا الموضع والصورة التي تفيد حلول النعمة أو ظهورها في شأنهم، من دون إضافة تحديد لاهوتي يتجاوز النص.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. استُعمل «يصلّون» لسهولة الفهم في المتن، مع إثبات «تضرعهم» في الحاشية. وُضعت علامة الحاشية [a] في نهاية الآية لأنها تتناول صياغة الجملة كلها.
