  source_fidelity: 'النص ينقل عناصر اليونانية الأساسية بأمانة: أداة الوصل، صلاة المتلقين لأجل المخاطَبين، اشتياقهم إليهم، والعلة المتمثلة في نعمة الله الفائقة عليهم. وصياغة «إذ يصلّون» تفكّ ضغط التركيب اليوناني دون أن تضيف علاقة لاهوتية أو سببية غير مذكورة.'
  naturalness: 'العبارة عربية فصحى معاصرة وطبيعية: «وهم، إذ يصلّون من أجلكم، يشتاقون إليكم» واضحة وسلسة، و«بسبب نعمة الله الفائقة عليكم» مناسبة للسجل الكتابي المفهوم.'
