  rationale: نُقلت «بوساطة كثيرين» إلى داخل جملة الغرض، حيث يمكن أن تتعلق بفعل «يُقدَّم»، مع إبقاء إمكان تعلّقها التركيبي الآخر في الحاشية. واستُبدل التعبير الحرفي الثقيل عن χάρισμα بتعبير عربي واضح يحفظ معنى العطية الممنوحة بنعمة ولا يصرح بما لم يصرح به النص عن ماهيتها أو واهبها.
