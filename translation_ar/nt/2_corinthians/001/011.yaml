  yaml_path: translation/nt/2_corinthians/001/011.yaml
  text: as you also join in helping us by prayer[c][b][a], so that thanks may be given by many on our behalf for the gracious gift given to us.
translation:
  language: ar
  text: وأنتم أيضًا تشاركون في معاونتنا بالدعاء، لكي يُقدَّم، بوساطة كثيرين[a]، الشكر من أناس كثيرين[b] من أجلنا على العطية التي أُنعِم بها علينا[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'العبارة اليونانية عسرة التركيب. وقد تُفهم أيضًا: «لكي يُقدَّم الشكر من أناس كثيرين من أجلنا على العطية التي أُنعِم بها علينا، بوساطة كثيرين».'
    reason: alternative_reading
  - marker: b
    text: 'حرفيًا: «من وجوه كثيرة».'
    reason: lexical_alternative
  - marker: c
    text: يمكن أيضًا ترجمة الكلمة بـ«العطية» أو «البركة» أو «النعمة التي أُظهرت لنا».
    reason: lexical_alternative
lexical_decisions:
- source_word: συνυπουργούντων
  choice: تشاركون في معاونتنا
  rationale: يحفظ معنى المشاركة الذي تضيفه السابقة συν-، ومعنى تقديم العون، بصياغة عربية واضحة.
- source_word: τῇ δεήσει
  choice: بالدعاء
  rationale: استُعملت الباء للأداة أو الوسيلة، و«الدعاء» ينقل معنى الالتماس الجاد في السياق دون تكلف.
- source_word: ἐκ πολλῶν προσώπων
  choice: من أناس كثيرين
  rationale: «الوجوه» تعبير حرفي، لكن المقصود هنا أشخاص كثيرون؛ وأُثبت المعنى الحرفي في الحاشية.
- source_word: τὸ εἰς ἡμᾶς χάρισμα
  choice: عطية النعمة التي صارت لنا
  rationale: تحفظ «عطية النعمة» صلة χάρισμα بالنعمة، بينما تنقل «صارت لنا» اتجاه العطية نحو بولس ورفقائه من غير تعيين نوعها.
- source_word: διὰ πολλῶν
  choice: بوساطة كثيرين
  rationale: أُبقيت العبارة مستقلة وقريبة من اليونانية، لأن تعلّقها الدقيق ودور «الكثيرين» محل احتمال، ولم تُحوَّل صراحة إلى «صلوات كثيرة» لعدم ورود ذلك في العبارة نفسها.
- source_word: εὐχαριστηθῇ
  choice: يُقدَّم الشكر
  rationale: صياغة عربية مألوفة تنقل المبني للمجهول، من غير إضافة اسم الله صراحة مع أنه المفهوم سياقيًا.
- source_word: ὑπὲρ ἡμῶν
  choice: من أجلنا
  rationale: تنقل معنى المرجع أو الاهتمام المتعلق ببولس ورفقائه، وتناسب سياق الدعاء والشكر.
theological_decisions:
- issue: هوية من يُوجَّه إليه الشكر
  choice: 'إبقاء المتلقي غير مصرَّح به: «يُقدَّم الشكر»'
  alternative: «يشكر كثيرون الله»
  rationale: الله هو المتلقي المفهوم في السياق، لكن اسمه غير مذكور في النص اليوناني لهذه الآية؛ لذا لم يُضف إلى المتن.
- issue: دلالة χάρισμα في السياق
  choice: عطية النعمة
  alternative: النجاة أو البركة التي مُنحت لنا
  rationale: لم تُحصر العطية في نوع محدد، حتى لا يُحوَّل الاستنتاج السياقي بشأن النجاة إلى تصريح لا يقوله اللفظ نفسه.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حوفظ على تكرار «كثيرين» الموجود في اليونانية مع تخفيف غرابة التركيب بعلامات الترقيم، وأُبقيت صعوبة علاقة διὰ πολλῶν بما حولها ظاهرة بدل حسمها بإضافة «الصلوات».
