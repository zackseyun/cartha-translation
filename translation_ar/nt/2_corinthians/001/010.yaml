source:
  edition: SBLGNT
  text: ὃς ἐκ τηλικούτου θανάτου ἐρρύσατο ἡμᾶς καὶ ⸀ῥύσεται, εἰς ὃν ἠλπίκαμεν ὅτι καὶ ἔτι ῥύσεται,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/010.yaml
  text: who rescued us from so great a death and will rescue us[a], in whom we have hoped that he will indeed rescue us again,
translation:
  language: ar
  text: الذي أنقذنا من موت عظيم كهذا[a]، وسينقذنا؛ وفيه وضعنا رجاءنا أنه سينقذنا أيضًا من جديد.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «من خطر مميت كهذا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τηλικούτου
  choice: عظيم كهذا
  rationale: يحفظ قوة اسم الإشارة الدال على ضخامة الخطر، ويأتي طبيعيًا مع «موت» في العربية.
- source_word: θανάτου
  choice: موت
  rationale: هذا هو المعنى المباشر للاسم اليوناني، ويحفظ صورة بولس القوية بدل استبدالها بتفسيرها.
- source_word: ἐρρύσατο
  choice: أنقذنا
  rationale: الفعل يدل على التخليص من خطر محدق، و«أنقذ» واضح وحديث وملائم للسياق.
- source_word: ῥύσεται
  choice: سينقذنا
  rationale: يحفظ الاتساق المعجمي مع الفعل السابق ويبيّن دلالة المستقبل.
- source_word: εἰς ὃν
  choice: وعليه
  rationale: يفيد التركيب الشخص الذي يتجه إليه الرجاء؛ و«عليه وضعنا رجاءنا» تعبير عربي طبيعي يحفظ هذا التركيز.
- source_word: ἠλπίκαμεν
  choice: وضعنا رجاءنا
  rationale: ينقل التام اليوناني بوصفه فعلًا قد تم وله أثر مستمر، أي رجاء ثابت قائم.
- source_word: καὶ ἔτι
  choice: أيضًا مرة أخرى
  rationale: ينقل معنى الإضافة والاستمرار والتوقع بإنقاذ لاحق، من غير تضخيم درجة التوكيد أكثر مما يحتمله التركيب.
theological_decisions:
- issue: هل تُفهم كلمة «موت» حرفيًا أم تُصاغ في المتن بمعنى «خطر مميت»؟
  choice: إبقاء «موت» في المتن
  alternative: صياغة العبارة «من خطر مميت كهذا»
  rationale: النص اليوناني يذكر الموت صراحة، وإبقاء الصورة يحفظ قوة تعبير بولس وغموضه المشروع، مع بيان المعنى السياقي المحتمل في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة. حُفظ تكرار فعل الإنقاذ في الماضي والمستقبل، واستُعمل «وضعنا رجاءنا» لإظهار ثبات الرجاء واستمراره. وُضعت علامة الحاشية في نهاية الجملة لأنها تتناول بديلًا لعبارة سابقة في الآية.
