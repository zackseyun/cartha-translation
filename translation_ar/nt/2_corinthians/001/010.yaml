  terminology: «أنقذ» مناسب لـ ῥύομαι ومتسق في المواضع الثلاثة. و«موت عظيم كهذا» يحفظ الصورة الأصلية، بينما تبقى «خطر مميت» بديلًا تفسيريًا مشروعًا في الحاشية.
