id: 2CO.1.24
reference: 2 Corinthians 1:24
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: οὐχ ὅτι κυριεύομεν ὑμῶν τῆς πίστεως, ἀλλὰ συνεργοί ἐσμεν τῆς χαρᾶς ὑμῶν, τῇ γὰρ πίστει ἑστήκατε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/024.yaml
  text: Not that we lord it over your faith[a], but we are fellow workers for your joy[c][b], for you stand firm by faith.
translation:
  language: ar
  text: لا لأننا نتسلّط على إيمانكم[a]، بل نحن عاملون معكم لأجل فرحكم[b]، لأنكم بالإيمان ثابتون[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ثقتكم».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «عاملون معًا لفرحكم».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «لأنكم ثابتون في الإيمان».'
    reason: alternative_reading
lexical_decisions:
- source_word: κυριεύομεν
  choice: نتسلّط على
  rationale: ينقل معنى ممارسة السيادة أو الهيمنة، ويحفظ في العربية النبرة السلبية المقصودة في هذا النفي.
- source_word: ὑμῶν τῆς πίστεως
  choice: إيمانكم
  rationale: تعبير عربي طبيعي يحفظ معنى الإيمان الذي يخص المخاطَبين؛ ويمكن أن يُفهم أيضًا بمعنى ثقتكم.
- source_word: συνεργοί
  choice: عاملون معكم
  rationale: يبرز العمل المشترك إلى جانب الكورنثيين، في مقابل التسلّط عليهم، وهو أوضح عربيًا من الترجمة الحرفية «شركاء عمل».
- source_word: τῆς χαρᾶς ὑμῶν
  choice: لأجل فرحكم
  rationale: يفهم المضاف إليه هنا على أنه غاية العمل أو مصلحته، مع بقاء احتمال الصياغة الأقرب إلى الحرفية في الحاشية.
- source_word: τῇ γὰρ πίστει
  choice: بالإيمان
  rationale: الباء تعبّر طبيعيًا عن الوسيلة أو الأساس، من غير استبعاد احتمال معنى «في الإيمان».
- source_word: ἑστήκατε
  choice: ثابتون
  rationale: ينقل نتيجة صيغة التام اليونانية، أي حالة الثبات القائمة، بلغة عربية موجزة وطبيعية.
theological_decisions:
- issue: معنى πίστις في الموضعين
  choice: الإيمان
  alternative: 'الثقة؛ وفي الموضع الثاني: في الإيمان'
  rationale: السياق يتحدث عن موقف الكورنثيين الإيماني وثباتهم، ولا يقتضي معنى الأمانة. استُعمل «الإيمان» في المتن مع حفظ البدائل الدلالية والتركيبية في الحواشي.
- issue: علاقة العاملين بالفرح
  choice: عاملون معكم لأجل فرحكم
  alternative: عاملون معًا لفرحكم؛ عاملون مع فرحكم
  rationale: المعنى الأرجح هو أن بولس ورفاقه يعملون إلى جانب المؤمنين بغية فرحهم، لا أنهم يمارسون سلطة على إيمانهم. الصياغة تحافظ على هذه المقابلة من دون إضفاء تصور كنسي خاص.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «نتسلّط» لإظهار المقابلة بين الهيمنة والعمل المشترك، و«ثابتون» لتأدية الأثر المستمر لصيغة التام. وُضعت جميع علامات الحواشي في المتن.
