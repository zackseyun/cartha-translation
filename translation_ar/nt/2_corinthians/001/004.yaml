revisions:
- from: الذي يعزّينا في كل ضيقتنا، لكي نستطيع أن نعزّي الذين هم في أية ضيقة، بالتعزية التي نتعزّى بها نحن أنفسنا من الله.[a]
  to: الذي يعزّينا في كل ضيقتنا، لكي نستطيع أن نعزّي الذين هم في أي ضيقة، بالتعزية التي يعزّينا بها الله نحن أنفسنا.[a]
  rationale: عُدِّلت الخاتمة لتبيّن صراحةً أن الله هو فاعل التعزية، كما يقتضيه المبني للمجهول مع ὑπὸ τοῦ θεοῦ، من دون التضحية بالتكرار اللفظي. وحُسّنت صياغة الشمول التوزيعي، ووُفّقت الحاشية مع المبني للمجهول في التكرار الأخير.
  reviewer_model: gpt-5.6-terra
