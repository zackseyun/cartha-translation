review_pass:
  verdict: revise
  source_fidelity: الصياغة تنقل بنجاح بنية الآية وتعاقب «التعزية» في سياق الضيق، وتحفظ غاية العبارة وتوكيد «نحن أنفسنا». لكن «نتعزّى ... من الله» قد تُفهم فعلاً انعكاسياً («نجد التعزية») أكثر من كونها مبنياً للمجهول يصرّح بأن الله هو الفاعل، بينما ὑπὸ τοῦ θεοῦ تعيّن الفاعل بوضوح.
  naturalness: العبارة فصيحة وواضحة إجمالاً. «الذين هم في أية ضيقة» مفهومة، لكن «الذين هم في أي ضيقة» أيسر وأشيع في الاستعمال الفصيح الحديث. والصياغة المقترحة أكثر سلاسة مع إبقاء التكرار المقصود.
  terminology: «يعزّي/التعزية» اختيار سليم لـ παρακαλέω/παράκλησις في هذا السياق، ويحافظ على الترابط اللفظي البولسي. والتعزية البديلة «يشجّع/التشجيع» مناسبة في الحاشية، لكن ينبغي أن تَظهر في صورتها المبنية للمجهول في الموضع الأخير لتطابق البنية اليونانية.
  issues:
  - severity: medium
    issue: دلالة المبني للمجهول والفاعل الإلهي في الخاتمة
    rationale: 'الفعل اليوناني παρακαλούμεθα مبني للمجهول، وὑπὸ τοῦ θεοῦ يصرّح بفاعله: «بواسطة الله». أما «نتعزّى ... من الله» فلا يصرّح بالفعل الإلهي وقد يُفهم انعكاسياً. «التي يعزّينا بها الله» تنقل الفاعل بوضوح وتحفظ الأسرة اللفظية.'
  - severity: low
    issue: صياغة «في أية ضيقة»
    rationale: ليست خطأ في المعنى، لكن «في أي ضيقة» أشيع وأخف في العربية الفصحى الحديثة، مع المحافظة على الشمول التوزيعي لـ πάσῃ.
  - severity: low
    issue: الحاشية لا تعكس المبني للمجهول في آخر تكرار
    rationale: «نتشجّع» أضعف في بيان أن التشجيع واقع علينا من الله. «نُشجَّع» يطابق البنية والدلالة في الأصل.
