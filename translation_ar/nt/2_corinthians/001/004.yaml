  text: who comforts us in all our affliction[a], so that we may be able to comfort those in any affliction through the comfort with which we ourselves are comforted by God.
translation:
  language: ar
  text: الذي يعزّينا في كل ضيقتنا، لكي نستطيع أن نعزّي الذين هم في أي ضيقة، بالتعزية التي يعزّينا بها الله نحن أنفسنا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يشجّعنا... نشجّع... التشجيع... نُشجَّع»؛ يستعمل النص اليوناني أسرة لفظية واحدة في الآية كلها.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλῶν / παρακαλεῖν / παρακλήσεως / παρακαλούμεθα
  choice: يعزّينا / نعزّي / التعزية / نتعزّى
  rationale: يحافظ الجذر العربي «ع ز ي» على تكرار الأسرة اللفظية اليونانية في الآية، وينقل معنى المواساة المقوّية في سياق الضيق، لا مجرد التهدئة العاطفية.
- source_word: ἐπὶ πάσῃ τῇ θλίψει ἡμῶν
  choice: في كل ضيقتنا
  rationale: «الضيقة» لفظ عربي واضح وذو ثقل مناسب لمعنى الشدة والكرب، و«في» هي الصياغة الطبيعية هنا.
- source_word: εἰς τὸ δύνασθαι ἡμᾶς
  choice: لكي نستطيع
  rationale: تنقل غاية التعزية أو نتيجتها المقصودة بصياغة عربية مباشرة، من غير حسم مصطنع للفارق الدقيق بين الغاية والنتيجة.
- source_word: τοὺς ἐν πάσῃ θλίψει
  choice: الذين هم في أية ضيقة
  rationale: 'تفيد «أية ضيقة» الشمول التوزيعي: كل من يوجد في أي نوع من الضيق.'
- source_word: αὐτοὶ
  choice: نحن أنفسنا
  rationale: تحفظ توكيد الضمير اليوناني بصياغة عربية طبيعية.
- source_word: ὑπὸ τοῦ θεοῦ
  choice: من الله
  rationale: تعبير عربي طبيعي عن مصدر التعزية وفاعلها مع المبني للمجهول؛ ولا يغيّر دلالة الوكالة الإلهية في الأصل.
theological_decisions:
- issue: المدى الدلالي لأسرة παρακαλέω / παράκλησις
  choice: عزّى / تعزية
  alternative: شجّع / تشجيع؛ واسى / مواساة
  rationale: سياق θλῖψις يرجّح التعزية التي تمنح القوة وسط الألم. وتحافظ الصياغة المختارة على وحدة الأسرة اللفظية من غير قصر المعنى على التلطيف العاطفي وحده.
- issue: دلالة εἰς τό بين الغاية والنتيجة
  choice: لكي نستطيع
  alternative: حتى أصبحنا قادرين
  rationale: «لكي» تلائم التدفق الغائي في السياق، مع بقاء إمكان تداخل الغاية والنتيجة في التركيب اليوناني.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. حوفظ على التكرار البلاغي المقصود في الأصل، وعلى توكيد «نحن أنفسنا». وُضعت علامة الحاشية بعد الجملة لأنها تتناول الأسرة اللفظية المتكررة في الآية كلها.
