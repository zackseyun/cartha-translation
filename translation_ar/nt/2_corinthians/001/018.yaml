  yaml_path: translation/nt/2_corinthians/001/018.yaml
  text: As surely as God is faithful[b][a], our message to you is not “Yes and No.”
translation:
  language: ar
  text: وكما أن الله أمين، فإن كلامنا إليكم ليس «نعم ولا».[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بصياغة أقرب إلى اللفظ: «لكنَّ الله أمين: إنَّ كلامنا إليكم ليس نعم ولا». ويمكن ترجمة «كلامنا» أيضًا: «قولنا» أو «رسالتنا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστὸς
  choice: أمين
  rationale: تعبير عربي كتابي وطبيعي يدل هنا على ثبات الله وموثوقيته ووفائه.
- source_word: δὲ
  choice: وَكَمَا أَنَّ
  rationale: أُدمجت الأداة في صيغة توكيد عربية تنقل قوة العبارة اليونانية، بدل ترجمتها بحرف استدراك قد يوهم بمقابلة ليست هي المقصودة أساسًا.
- source_word: ὅτι
  choice: فَـ
  rationale: رُبط مضمون التأكيد بأمانة الله بصياغة عربية سليمة، مع إبقاء العلاقة قابلة للفهم بوصفها توكيدًا قائمًا على أمانة الله.
- source_word: ὁ λόγος ἡμῶν
  choice: كلامنا
  rationale: «كلام» يقابل λόγος هنا طبيعيًا، ويشمل ما قاله بولس ورفقاؤه للكورنثيين دون تضييقه صراحة على معنى الرسالة وحده.
- source_word: ὁ πρὸς ὑμᾶς
  choice: إليكم
  rationale: ينقل اتجاه الكلام إلى المخاطَبين بإيجاز ووضوح.
- source_word: οὐκ ἔστιν
  choice: ليس
  rationale: يحافظ على زمن المضارع وعلى صيغة النفي المباشر.
- source_word: Ναὶ καὶ Οὔ
  choice: «نعم» و«لا»
  rationale: يحفظ التقابل اللفظي الحاد في الأصل ويعرضه بوصفه قولًا مقتبسًا أو صيغة دالة على التذبذب والتناقض.
theological_decisions:
- issue: صياغة التركيب التوكيدي πιστὸς δὲ ὁ θεὸς ὅτι
  choice: وكما أن الله أمين، فـ...
  alternative: ولكن الله أمين، إن كلامنا إليكم...
  rationale: تنقل الصياغة المختارة احتجاج بولس بأمانة الله أساسًا لتأكيد صدق كلامه، مع تجنب تركيب عربي حرفي متعثر. وتُذكر الصيغة الأقرب إلى ترتيب الأصل في الحاشية حفظًا لاحتمال فهم δέ استدراكية وὅτι مضمونية.
translation_notes:
  register: فصحى معاصرة واضحة ورصينة. اختيرت «أمين» لأمانة الله، و«كلامنا» لاتساعها الطبيعي في السياق. وُضع الاستشهاد «نعم» و«لا» بين علامتي اقتباس لإبراز التقابل المقصود.
