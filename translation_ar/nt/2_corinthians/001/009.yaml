source:
  edition: SBLGNT
  text: ἀλλὰ αὐτοὶ ἐν ἑαυτοῖς τὸ ἀπόκριμα τοῦ θανάτου ἐσχήκαμεν, ἵνα μὴ πεποιθότες ὦμεν ἐφ’ ἑαυτοῖς ἀλλ’ ἐπὶ τῷ θεῷ τῷ ἐγείροντι τοὺς νεκρούς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/009.yaml
  text: Indeed[a], we ourselves had the sentence of death within ourselves, so that we would not rely on ourselves but on God, who raises the dead.
translation:
  language: ar
  text: بل كان حكمُ الموت[أ] في داخلنا نحن أنفسنا، لكي لا نعتمد على أنفسنا، بل على الله الذي يقيم الأموات.
  philosophy: optimal-equivalence
  footnotes:
  - marker: أ
    text: أو «قرار الموت».
    reason: بديل معجمي لـ ἀπόκριμα؛ فقد تدل الكلمة على حكم أو قرار حاسم.
lexical_decisions:
- source_word: ἀλλὰ
  choice: بل
  rationale: تفيد هنا انتقالًا استدراكيًا قويًا متصلًا بما سبق، و«بل» تؤدي هذا المعنى بوضوح وطبيعية في العربية.
- source_word: αὐτοὶ
  choice: نحن أنفسنا
  rationale: يحفظ هذا التعبير توكيد الضمير في النص اليوناني.
- source_word: ἐν ἑαυτοῖς
  choice: في داخلنا
  rationale: ينقل البعد الداخلي الشخصي للعبارة من غير إغراق في الحرفية.
- source_word: τὸ ἀπόκριμα τοῦ θανάτου
  choice: حكم الموت
  rationale: تدل العبارة في السياق على قرار أو نتيجة حاسمة بالموت؛ و«حكم الموت» موجزة وطبيعية وتحفظ الدلالة القضائية المحتملة.
- source_word: ἐσχήκαμεν
  choice: كان ... في داخلنا
  rationale: ينقل حالة مستقرة ناتجة عن خبرة سابقة، من غير إضافة معنى «تلقّينا» غير المصرح به في الفعل.
- source_word: ἵνα μὴ πεποιθότες ὦμεν
  choice: لكي لا نعتمد
  rationale: تحفظ «لكي» دلالة الغاية، ويعبّر «نعتمد» طبيعيًا عن الثقة المستقرة المتجهة إلى سند ما.
- source_word: ἐφ’ ἑαυτοῖς
  choice: على أنفسنا
  rationale: تلائم الفعل «نعتمد» وتحفظ المقابلة مع الاعتماد على الله.
- source_word: ἀλλ’ ἐπὶ τῷ θεῷ
  choice: بل على الله
  rationale: تحفظ المقابلة القوية بين الاتكال على الذات والاتكال على الله.
- source_word: τῷ ἐγείροντι τοὺς νεκρούς
  choice: الذي يقيم الأموات
  rationale: ترجمة مباشرة وطبيعية تصف الله بقدرته على إقامة الموتى وتحفظ الصدى الكتابي المألوف.
theological_decisions:
- issue: هل تُترجم τοὺς νεκρούς بلفظ «الأموات» أم بتعبير تفسيري مثل «الناس الموتى»؟
  choice: الأموات
  alternative: الناس الموتى
  rationale: «الأموات» دقيقة وطبيعية وتحفظ عمومية العبارة ورنينها المتعلق بالقيامة من غير إضافة تفسير.
- issue: هل يُفهم ἀπόκριμα على أنه حكم قضائي أم يقين داخلي بالموت؟
  choice: حكم الموت
  alternative: اليقين بالموت
  rationale: «حكم الموت» يحفظ الاحتمال القضائي أو الحاسم في اللفظة، بينما لا يحصر العبارة في شعور نفسي محض.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. حُفظ توكيد «نحن أنفسنا» والتقابل بين الاعتماد على النفس والاعتماد على الله، مع تجنب إضافة فعل «تلقّينا» الذي لا يصرح به الأصل.
