  text: καθὼς καὶ ἐπέγνωτε ἡμᾶς ἀπὸ μέρους, ὅτι καύχημα ὑμῶν ἐσμεν καθάπερ καὶ ὑμεῖς ἡμῶν ἐν τῇ ἡμέρᾳ τοῦ κυρίου ⸀ἡμῶν Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/014.yaml
  text: just as you also came to understand us in part[a], that we are your boast, just as you also are ours[b], in the day of our Lord Jesus.
translation:
  language: ar
  text: 'كما أنكم عرفتمونا إلى حدّ ما[a]: أننا فخركم[b]، كما أنكم أيضًا فخرنا، في يوم ربنا يسوع.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «جزئيًا» أو «إلى حدّ محدود».
    reason: lexical_alternative
  - marker: b
    text: أو «سبب افتخارنا».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέγνωτε
  choice: عرفتمونا
  rationale: يفيد الفعل هنا وصول الكورنثيين إلى معرفة حقيقية ببولس ورفقائه، من غير أن يدل بذاته على فهم كامل؛ وتقيّده العبارة التالية «إلى حدّ ما».
- source_word: ἀπὸ μέρους
  choice: إلى حدّ ما
  rationale: تعبير عربي طبيعي يحفظ معنى الجزئية وعدم الاكتمال، من غير تحديد مقدارها.
- source_word: καύχημα
  choice: فخر
  rationale: يحفظ لغة بولس عن الافتخار والاعتزاز المتبادل، وهو أنسب في العربية من صياغة تفسيرية مطوّلة داخل المتن.
- source_word: καθάπερ
  choice: كما أن
  rationale: يحفظ المقارنة المتبادلة الصريحة بين الرسول والجماعة.
- source_word: ἐν τῇ ἡμέρᾳ τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: في يوم ربنا يسوع
  rationale: يحافظ على التعبير الأخروي وعلى تركيب الإضافة بصورة عربية واضحة ومألوفة.
- source_word: κύριος
  choice: رب
  rationale: الترجمة العربية المألوفة للقب المسيح في هذا السياق.
- source_word: καθὼς καὶ
  choice: كما أنكم
  rationale: تصل العبارة بما قبلها وتحفظ قوة المقارنة، بينما يظهر معنى καί الإضافي طبيعيًا من السياق العربي.
theological_decisions:
- issue: لغة الفخر المتبادل عند بولس
  choice: أننا فخركم، كما أنكم أيضًا فخرنا
  alternative: أننا سبب افتخاركم، كما أنكم سبب افتخارنا
  rationale: تبقي الصياغة توتر لفظ «الفخر» كما هو، وتعرض الاعتزاز الأخروي المتبادل من غير تحويله إلى تقرير مذهبي أو تخفيفه بتفسير زائد.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. اختيرت «عرفتمونا» لسلامتها وطبيعتها، و«إلى حدّ ما» لتجنب الإيحاء بأن المعرفة كانت كاملة. حُفظ تكرار «فخر» لإبراز التبادل البلاغي في الأصل.
