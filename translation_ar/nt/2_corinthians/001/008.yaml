  to: فإننا لا نريدكم أن تجهلوا، أيها الإخوة[a]، أمر ضيقتنا التي أصابتنا في آسيا[b]؛ إذ أُثقلنا جدًا، فوق طاقتنا، حتى يئسنا من الحياة نفسها[c].
  rationale: تُصحَّح الصياغة لتُظهر أن الكلام عن خبر الضيقة، ولتحافظ على فعل «أُثقلنا» بوصفه المقابل المباشر للفعل اليوناني المبني للمجهول من غير إضافة «الحمل». كما تُعتمد كتابة «آسيا» المألوفة في العربية. وتُحفظ الحواشي ومعانيها ومواضع علاماتها.
