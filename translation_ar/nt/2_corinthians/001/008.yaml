  source_fidelity: المعنى العام محفوظ، لكن تركيب «أن تجهلوا الضيقة» لا يبيّن بوضوح أن المقصود هو عدم جهلهم بأمر الضيقة، وعبارة «ثقل علينا الحمل» تضيف اسم «الحمل» غير الموجود في الأصل وتضعف بناء الفعل المبني للمجهول ἐβαρήθημεν.
  naturalness: 'العربية واضحة إجمالًا، والأفصح والأقرب إلى الاستعمال الحديث: «أن تجهلوا أمر ضيقتنا» و«أُثقلنا جدًا». كما أن «آسيا» هي الصيغة العربية الجغرافية المألوفة.'
  terminology: «الضيقة» مناسبة لـθλῖψις، و«فوق طاقتنا» مناسبة لـὑπὲρ δύναμιν، و«يئسنا من الحياة نفسها» تنقل قوة العبارة الأخيرة دون تحميلها معنى إضافيًا.
