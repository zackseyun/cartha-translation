source:
  edition: SBLGNT
  text: Οὐ γὰρ θέλομεν ὑμᾶς ἀγνοεῖν, ἀδελφοί, ⸀ὑπὲρ τῆς θλίψεως ἡμῶν τῆς ⸀γενομένης ἐν τῇ Ἀσίᾳ, ὅτι καθ’ ὑπερβολὴν ⸂ὑπὲρ δύναμιν ἐβαρήθημεν⸃, ὥστε ἐξαπορηθῆναι ἡμᾶς καὶ τοῦ ζῆν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/008.yaml
  text: For we do not want you to be unaware[a], brothers, about our affliction that happened in Asia, that we were burdened exceedingly, beyond our strength[c][b], so that we despaired even of life.
translation:
  language: ar
  text: فإننا لا نريدكم أن تجهلوا، أيها الإخوة[a]، أمر ضيقتنا التي أصابتنا في آسيا[b]؛ إذ أُثقلنا جدًا، فوق طاقتنا، حتى يئسنا من الحياة نفسها[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: لفظ «الإخوة» ترجمة للاسم اليوناني المذكر الجمع ἀδελφοί، ويُرجَّح أن بولس يخاطب به جماعة المؤمنين جميعًا، رجالًا ونساءً.
    reason: cultural_note
  - marker: b
    text: المقصود بـ«آسيا» الولاية الرومانية الواقعة في غربي آسيا الصغرى، لا قارة آسيا بمفهومها الحديث.
    reason: cultural_note
  - marker: c
    text: 'أو: «حتى يئسنا من الاستمرار في الحياة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ γὰρ θέλομεν ὑμᾶς ἀγνοεῖν
  choice: فإننا لا نريدكم أن تجهلوا
  rationale: يحافظ على أداة التعليل γάρ وعلى معنى الإرادة في θέλομεν، وينقل ἀγνοεῖν بصياغة عربية واضحة غير متكلفة.
- source_word: ἀδελφοί
  choice: أيها الإخوة
  rationale: ينقل صيغة النداء المذكرة الجمع في اليونانية، مع بيان شمول الخطاب المرجح للجماعة المؤمنة في الحاشية.
- source_word: ὑπὲρ τῆς θλίψεως ἡμῶν τῆς γενομένης ἐν τῇ Ἀσίᾳ
  choice: الضيقة التي أصابتنا في أَسِيَّا
  rationale: «الضيقة» تحفظ ثقل θλῖψις، و«أصابتنا» صياغة عربية طبيعية للحدث المقصود بالعبارة الوصفية، مع إبقاء الاسم الجغرافي كما في المصدر.
- source_word: καθ’ ὑπερβολὴν ὑπὲρ δύναμιν ἐβαρήθημεν
  choice: ثقل علينا الحمل جدًا، فوق طاقتنا
  rationale: يحفظ صورة الثقل في الفعل المبني للمجهول ἐβαρήθημεν، ويعبّر «جدًا» عن شدة καθ’ ὑπερβολὴν، و«فوق طاقتنا» عن تجاوز القدرة في ὑπὲρ δύναμιν.
- source_word: ὥστε ἐξαπορηθῆναι ἡμᾶς καὶ τοῦ ζῆν
  choice: حتى يئسنا من الحياة نفسها
  rationale: «حتى» تنقل نتيجة ὥστε، و«يئسنا» يؤدي شدة ἐξαπορέομαι، أما «الحياة نفسها» فتنقل بلوغ اليأس حدّ العيش ذاته مع إبقاء البديل التفسيري في الحاشية.
theological_decisions:
- issue: دلالة ἀδελφοί في خطاب جماعة مؤمنة
  choice: أيها الإخوة
  alternative: أيها الإخوة والأخوات
  rationale: أُبقيت الصيغة المذكرة المطابقة للنص اليوناني في المتن، مع التنبيه في الحاشية إلى أن الخطاب يشمل على الأرجح جماعة المؤمنين رجالًا ونساءً، دون توسيع النص صراحة.
- issue: مدى اليأس في καὶ τοῦ ζῆν
  choice: يئسنا من الحياة نفسها
  alternative: يئسنا حتى من الاستمرار في الحياة
  rationale: الصياغة المختارة موجزة وتحفظ القوة الوجودية للعبارة، بينما يُذكر البديل الذي يبرز معنى الاستمرار في الحاشية من غير حسم زائد.
translation_notes:
  register: عربية فصحى حديثة، واضحة ورصينة. استُعملت «الضيقة» و«ثقل علينا الحمل» للمحافظة على شدة المعاناة وصورة الثقل في الأصل، مع علامات الحواشي [a] و[b] و[c] في مواضعها المناسبة.
