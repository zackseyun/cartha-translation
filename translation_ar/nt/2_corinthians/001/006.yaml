  text: εἴτε δὲ θλιβόμεθα, ὑπὲρ τῆς ὑμῶν παρακλήσεως καὶ σωτηρίας· ⸂εἴτε παρακαλούμεθα, ὑπὲρ τῆς ὑμῶν παρακλήσεως⸃ τῆς ἐνεργουμένης ἐν ὑπομονῇ τῶν αὐτῶν παθημάτων ὧν καὶ ἡμεῖς πάσχομεν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/006.yaml
  text: But if we are afflicted[a], it is for your comfort and salvation; or if we are comforted, it is for your comfort[b], which is at work in enduring the same sufferings that we also suffer.
translation:
  language: ar
  text: فإن كنا نتعرض للضيق، فلأجل تعزيتكم وخلاصكم؛ وإن كنا نتعزّى، فلأجل تعزيتكم[a][b]، التي تعمل في احتمال الآلام نفسها التي نتألم بها نحن أيضًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تحذف بعض المخطوطات العبارة: «وإن كنا نتعزّى، فلأجل تعزيتكم».'
    reason: textual_variant
  - marker: b
    text: 'أو: «تشجيعكم» بدلًا من «تعزيتكم» في هذه الآية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θλιβόμεθα
  choice: نُبتلى بالضيق
  rationale: ينقل الفعل المضارع المبني للمجهول معنى التعرض المستمر للضغط والشدة، بعبارة عربية واضحة وطبيعية.
- source_word: παρακλήσεως / παρακαλούμεθα
  choice: تعزية / نتعزّى
  rationale: يحافظ على الترابط اللفظي المتكرر في السياق، ويؤدي معنى المواساة المقترنة بالتقوية، مع إثبات «التشجيع» بديلًا ممكنًا في الحاشية.
- source_word: σωτηρίας
  choice: خلاص
  rationale: هو المقابل المباشر الشائع، ويحفظ اتساع الدلالة الخلاصية من غير قصرها على نجاة وقتية.
- source_word: τῆς ἐνεργουμένης
  choice: التي يظهر مفعولها
  rationale: يعبّر عن كون التعزية عاملة وفعّالة، لا مجرد موجودة، بصياغة عربية طبيعية.
- source_word: ἐν ὑπομονῇ
  choice: في احتمال
  rationale: ينقل معنى الثبات الصابر تحت الألم، ويتصل بسلاسة بعبارة «يظهر مفعولها».
- source_word: τῶν αὐτῶν παθημάτων
  choice: الآلام نفسها
  rationale: يحفظ التشديد على اشتراك المخاطَبين والرسل في النوع نفسه من المعاناة.
- source_word: ὑπὲρ
  choice: لأجل
  rationale: يبيّن معنى المنفعة الموجّهة إلى الكورنثيين في كلا الموضعين.
theological_decisions:
- issue: مدى دلالة σωτηρία
  choice: خلاص
  alternative: نجاة
  rationale: «خلاص» يحفظ الدلالة البولسية الأوسع ولا يحسمها في نجاة ظرفية فحسب.
- issue: العلاقة بين التعزية والاحتمال في τῆς ἐνεργουμένης ἐν ὑπομονῇ
  choice: التعزية يظهر مفعولها في احتمال الآلام
  alternative: التعزية تعمل لكي تحتملوا الآلام
  rationale: الصياغة المختارة تحافظ على العلاقة النصية من غير إضافة غاية صريحة أو تحديد سببي لا يصرح به الأصل.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «نُبتلى بالضيق» لتجنب الصياغة الحرفية الثقيلة، وحوفظ على تكرار جذر التعزية وعلى التوازي بين شقي الجملة. وُضع مؤشرا الحاشيتين عقب العبارة التي تتعلق بها الملاحظة النصية والبديل المعجمي.
