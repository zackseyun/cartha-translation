  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Ἡ γὰρ καύχησις ἡμῶν αὕτη ἐστίν, τὸ μαρτύριον τῆς συνειδήσεως ἡμῶν, ὅτι ἐν ⸀ἁγιότητι καὶ εἰλικρινείᾳ ⸀τοῦ θεοῦ, ⸀οὐκ ἐν σοφίᾳ σαρκικῇ ἀλλ’ ἐν χάριτι θεοῦ, ἀνεστράφημεν ἐν τῷ κόσμῳ, περισσοτέρως δὲ πρὸς ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/012.yaml
  text: 'For this is our boast: the testimony of our conscience[a], that we conducted ourselves in the world in holiness and sincerity of God[c][b], not in fleshly wisdom but in the grace of God—and especially toward you.'
translation:
  language: ar
  text: 'فإنَّ فخرنا هو هذا: شهادةُ ضميرنا بأننا سلكنا في العالم بقداسة[a] وإخلاصٍ من الله[b]، لا بحكمة جسدية[c] بل بنعمة الله، ولا سيما في معاملتكم.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ بعض المخطوطات: «بساطة» بدلًا من «قداسة».'
    reason: textual_variant
  - marker: b
    text: 'أو: «إخلاص يليق بالله».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «حكمة بشرية».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καύχησις
  choice: فخرنا
  rationale: ينقل معنى الاعتزاز الواثق وموضع الافتخار في السياق، من غير أن يفرض معنى الكبرياء المذموم.
- source_word: μαρτύριον τῆς συνειδήσεως
  choice: شهادة ضميرنا
  rationale: صياغة عربية واضحة تحفظ صورة الضمير الذي يشهد لسلوك المتكلمين.
- source_word: ἁγιότητι
  choice: بقداسة
  rationale: تمثّل قراءة SBLGNT تمثيلًا مباشرًا وتحفظ بعدها الأخلاقي والديني.
- source_word: εἰλικρινείᾳ τοῦ θεοῦ
  choice: بإخلاصٍ من الله
  rationale: تفهم المضاف إليه بوصفه دالًا على المصدر، مع إبقاء البديل الوصفي في الحاشية لصون الاحتمال الدلالي.
- source_word: σοφίᾳ σαρκικῇ
  choice: بحكمة جسدية
  rationale: يحفظ صلة التعبير بمجموعة ألفاظ σάρξ ولا يستبدلها بتفسير أوسع مثل «دنيوية» أو «بشرية».
- source_word: χάριτι θεοῦ
  choice: بنعمة الله
  rationale: تعبير عربي طبيعي يحفظ الثقل اللاهوتي للفظ χάρις.
- source_word: ἀνεστράφημεν
  choice: سلكنا
  rationale: فعل عربي كتابي واضح يدل على نهج الحياة والتصرف، ويلائم استعمال المبني للمعلوم في اليونانية.
- source_word: περισσοτέρως δὲ πρὸς ὑμᾶς
  choice: وبالأكثر من نحوكم
  rationale: يحفظ القوة المقارِنة لـ περισσοτέρως والدلالة العلائقية لـ πρὸς ὑμᾶς.
theological_decisions:
- issue: دلالة τοῦ θεοῦ في εἰλικρινείᾳ τοῦ θεοῦ
  choice: إخلاصٍ من الله
  alternative: إخلاص يليق بالله؛ أو إخلاص الله
  rationale: يرجّح فهم الإضافة على أنها دالة على المصدر، لكنه لا يحسم احتمال الصفة أو العلاقة، ولذلك يُذكر البديل الأقرب في الحاشية.
- issue: المقابلة بين σοφίᾳ σαρκικῇ وχάριτι θεοῦ
  choice: حكمة جسدية / نعمة الله
  alternative: حكمة بشرية / نعمة الله
  rationale: تحفظ الترجمة المقابلة البولسية والتوتر بين الجسد والنعمة بدل تليين «جسدية» إلى تفسير عام.
translation_notes:
  register: عربية فصحى معاصرة ذات نبرة كريمة ومفهومة. استُعمل «سلكنا» للدلالة الطبيعية على نهج الحياة، وحُفظت العبارة البولسية «حكمة جسدية» مع توضيح البديل في الحاشية. وُضعت جميع علامات الحواشي عند الألفاظ التي تتعلق بها مباشرة.
