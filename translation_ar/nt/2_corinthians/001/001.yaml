source:
  edition: SBLGNT
  text: Παῦλος ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ διὰ θελήματος θεοῦ καὶ Τιμόθεος ὁ ἀδελφὸς τῇ ἐκκλησίᾳ τοῦ θεοῦ τῇ οὔσῃ ἐν Κορίνθῳ, σὺν τοῖς ἁγίοις πᾶσιν τοῖς οὖσιν ἐν ὅλῃ τῇ Ἀχαΐᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/001.yaml
  text: 'Paul[a], an apostle of Messiah Jesus by the will of God, and Timothy our brother, to the church of God that is in Corinth[b], together with all the saints who are in all Achaia:'
translation:
  language: ar
  text: 'بولس، رسولُ المسيح يسوع بمشيئة الله، وتيموثاوس الأخ[a]، إلى كنيسة الله التي في كورنثوس، ومع جميع القديسين الذين في أخائية كلها:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: الأخ في الإيمان؛ ويمكن بحسب المعنى أن تُترجم: «أخونا تيموثاوس».'
    reason: يوضح دلالة «الأخ» الجماعية ويحفظ البديل العربي الاصطلاحي، مع أن ضمير «نا» غير مذكور صراحة في اليونانية.
lexical_decisions:
- source_word: ἀπόστολος
  choice: رسول
  rationale: «رسول» هو المقابل العربي الراسخ والدقيق للصفة الرسولية والتكليف في افتتاح الرسالة.
- source_word: Χριστοῦ Ἰησοῦ
  choice: المسيح يسوع
  rationale: يحافظ على ترتيب اليونانية ويُبقي «المسيح» لقبًا ظاهر الدلالة، بصياغة عربية مفهومة.
- source_word: διὰ θελήματος θεοῦ
  choice: بمشيئة الله
  rationale: صياغة عربية طبيعية تعبّر عن كون مشيئة الله أساس دعوة بولس الرسولية.
- source_word: ὁ ἀδελφὸς
  choice: الأخ
  rationale: يحافظ على أداة التعريف في اليونانية من غير إضافة ضمير ملكية غير موجود صراحة، مع توضيح البديل الاصطلاحي في الحاشية.
- source_word: ἐκκλησίᾳ
  choice: كنيسة
  rationale: المقابل العربي المألوف والملائم لجماعة المؤمنين في عناوين رسائل بولس.
- source_word: ἁγίοις
  choice: القديسين
  rationale: المقابل العربي الكنسي الراسخ لوصف شعب الله المقدس، وهو موجز ودقيق في هذا السياق.
- source_word: σὺν
  choice: ومع
  rationale: ينقل معنى المصاحبة والشمول بوضوح ومن دون إثقال الأسلوب.
- source_word: ἐν ὅλῃ τῇ Ἀχαΐᾳ
  choice: في أخائية كلها
  rationale: يحافظ على شمول الإقليم الوارد في النص اليوناني، مع استعمال الاسم الجغرافي العربي المتداول.
theological_decisions:
- issue: دلالة Χριστός في عبارة Χριστοῦ Ἰησοῦ
  choice: المسيح يسوع
  alternative: يسوع المسيح
  rationale: اختير ترتيب يقارب الأصل ويُظهر «المسيح» بوصفه لقبًا، من غير إدخال تفسير طائفي؛ والترتيب البديل مألوف عربيًا لكنه يعكس ترتيب الكلمتين.
- issue: العلاقة التي يعبّر عنها ὁ ἀδελφὸς
  choice: تيموثاوس الأخ
  alternative: أخونا تيموثاوس
  rationale: النص اليوناني يتضمن أداة التعريف ولا يتضمن ضمير «نا». أبقت الترجمة ذلك ظاهرًا، مع الاعتراف بأن البديل أكثر اصطلاحية في العربية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة رسائلية وقورة. حُفظ تركيب التحية الممتد والنقطتان الختاميتان لأنه يتواصل مع الآية التالية، مع تجنب الألفاظ المذهبية الخاصة.
