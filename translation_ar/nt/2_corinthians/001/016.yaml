  to: وأن أمرَّ بكم في طريقي إلى مكدونية، ثم آتيكم مرةً أخرى من مكدونية، وأن تُشَيِّعوني إلى اليهودية.
  rationale: حُفظ ترتيب خط السير ودلالة «مرة أخرى»، وأعيدت صياغة الشق الأخير بعطف مصدر مؤول يوازي المصادر اليونانية المنسقة ويحافظ على أن أهل كورنثوس هم الفاعلون في إرسال بولس في طريقه. كما أضيفت حاشية للمعنى السفرِي الأوسع للفعل.
