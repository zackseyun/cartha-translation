  text: and through you to pass into Macedonia[a], and again from Macedonia to come to you and by you to be sent on to Judea.
translation:
  language: ar
  text: وأن أمرَّ بكم في طريقي إلى مكدونية، ثم آتيكم مرةً أخرى من مكدونية، وأن تُشَيِّعوني إلى اليهودية.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δι’ ὑμῶν
  choice: أمرَّ بكم
  rationale: تفيد διά مع المضاف إليه المرور بطريق المخاطَبين؛ وهذه الصياغة عربية طبيعية وتحفظ مسار الرحلة عبر كورنثوس.
- source_word: διελθεῖν εἰς Μακεδονίαν
  choice: إلى مكدونية
  rationale: يدل الفعل مع εἰς على العبور أو المضي إلى مكدونية، وقد جُمعت الدلالة في تركيب عربي موجز وطبيعي.
- source_word: πάλιν ἀπὸ Μακεδονίας ἐλθεῖν πρὸς ὑμᾶς
  choice: ثم آتيكم مرةً أخرى من مكدونية
  rationale: تحفظ العبارة منشأ الحركة والزيارة التالية، من غير إضافة معنى «العودة» إلى الفعل نفسه.
- source_word: ὑφ’ ὑμῶν προπεμφθῆναι
  choice: فتُشَيِّعوني في طريقي
  rationale: يُستعمل προπέμπω في سياق السفر لتوديع المسافر وتجهيزه أو معاونته على متابعة رحلته؛ و«تشيّعوني في طريقي» تؤدي المعنى طبيعيًا من غير حصر نوع المساعدة.
- source_word: εἰς τὴν Ἰουδαίαν
  choice: إلى اليهودية
  rationale: تعبير عربي مألوف عن وجهة الرحلة، ويؤدي دلالة εἰς بوضوح.
