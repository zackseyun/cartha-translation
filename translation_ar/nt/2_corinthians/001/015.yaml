lexical_decisions:
- source_word: πεποιθήσει
  choice: الثقة
  rationale: تؤدي معنى الاطمئنان الواثق الذي بنى عليه بولس عزمه، وهي طبيعية وواضحة في العربية المعاصرة.
- source_word: ἐβουλόμην
  choice: كنت أعتزم
  rationale: ينقل الإرادة والقصد من غير أن يوحي بخطة رسمية محسومة، كما يحافظ على دلالة الماضي الناقص.
- source_word: πρότερον πρὸς ὑμᾶς ἐλθεῖν
  choice: أن آتي إليكم أولًا
  rationale: يفهم πρότερον هنا على الأرجح بوصفه أولوية في ترتيب الرحلة، وهو ما يوضحه سياق الآية التالية.
- source_word: δευτέραν χάριν
  choice: نعمة ثانية
  rationale: يحافظ على لفظ χάρις وصورته اللاهوتية والعلاقية المحتملة بدل حصره في «فائدة»، مع بيان البدائل السياقية في الحاشية.
- source_word: σχῆτε
  choice: تكون لكم
  rationale: صياغة عربية طبيعية تؤدي معنى الامتلاك أو نيل الشيء في هذا التركيب.
theological_decisions:
- issue: دلالة χάρις في سياق زيارة بولس
  choice: نعمة ثانية
  alternative: فائدة ثانية أو إحسان ثانٍ
  rationale: قد تشير الكلمة إلى الخير أو الفائدة التي ينالها المخاطبون من الزيارة، لكنها تظل لفظ «نعمة» في اليونانية؛ لذلك حُفظ التوتر الدلالي في المتن وذُكرت القراءة السياقية في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. حُفظ تركيب الجملة ولفظ «نعمة» قدر الإمكان، مع تجنب إغلاق تعدد دلالات χάρις. وُضع الفاصل الختامي لأن الآية تستمر نحويًا في الآية التالية.
