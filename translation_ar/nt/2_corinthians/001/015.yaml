  text: And with this confidence I intended to come to you first[a], so that you might have a second benefit[b],
translation:
  language: ar
  text: وبهذه الثقة كنت أنوي أن آتي إليكم أولًا، لكي تنالوا نعمةً ثانية[a]،
  philosophy: optimal-equivalence
