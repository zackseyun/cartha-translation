  text: τοῦτο οὖν ⸀βουλόμενος μήτι ἄρα τῇ ἐλαφρίᾳ ἐχρησάμην; ἢ ἃ βουλεύομαι κατὰ σάρκα βουλεύομαι, ἵνα ᾖ παρ’ ἐμοὶ τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/017.yaml
  text: So when I intended this[a], was I acting lightly? Or do I plan what I plan according to the flesh, so that with me there should be both “Yes, yes” and “No[d][c][b], no”?
translation:
  language: ar
  text: فإذ كنتُ أنوي هذا، أفهل تصرّفتُ بتقلُّب؟ أم إنني أعزم ما أعزم بحسب الجسد[a]، حتى يكون عندي «نعم، نعم» و«لا، لا»[b]؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أن تعني عبارة «بحسب الجسد»: وفق مقاييس بشرية محضة أو بطريقة دنيوية.'
    reason: lexical_alternative
  - marker: b
    text: أي كأن «نعم» و«لا» يمكن أن تثبتا معًا في كلامي.
    reason: cultural_note
lexical_decisions:
- source_word: βουλόμενος
  choice: كنتُ أنوي
  rationale: ينقل معنى القصد المتصل بخطة بولس السابقة للسفر، بصياغة عربية طبيعية من غير مبالغة في معنى التخطيط الرسمي.
- source_word: τῇ ἐλαφρίᾳ ἐχρησάμην
  choice: تصرّفتُ بتقلُّب
  rationale: التركيب يدل على اتصاف السلوك بخفة القصد أو عدم الثبات؛ و«بتقلّب» يوضح الاتهام المقصود في العربية المعاصرة.
- source_word: ἃ βουλεύομαι ... βουλεύομαι
  choice: أعزم ما أعزم
  rationale: يحافظ على التكرار البلاغي في اليونانية مع استعمال عربي فصيح ومفهوم.
- source_word: κατὰ σάρκα
  choice: بحسب الجسد
  rationale: يحفظ اللفظ البولسي ذي الدلالة اللاهوتية ولا يحصره في تفسير واحد، مع بيان معناه المحتمل في الحاشية.
- source_word: παρ’ ἐμοὶ
  choice: عندي
  rationale: تعبير عربي موجز وطبيعي يدل على ما يوجد في قول بولس أو سلوكه ويصدر عنه.
- source_word: τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ
  choice: «نعم، نعم» و«لا، لا» معًا
  rationale: يحفظ تكرار اللفظين في الأصل، وتوضح «معًا» اتهام التردد والتناقض الذي يتناوله السؤال البلاغي.
theological_decisions:
- issue: دلالة κατὰ σάρκα في الاستعمال البولسي
  choice: بحسب الجسد
  alternative: وفق مقاييس بشرية محضة / بطريقة دنيوية
  rationale: الإبقاء على «الجسد» يصون التوتر الدلالي في المصطلح البولسي، إذ قد يشير هنا إلى التخطيط وفق اعتبارات بشرية أو دنيوية من دون افتراض معنى واحد حصري.
- issue: دلالة تكرار نعم ولا
  choice: الإبقاء على «نعم، نعم» و«لا، لا»
  alternative: أن أقول نعم ولا في آن واحد
  rationale: يحافظ النص على صورة الأصل وتكراره، بينما تشرح الحاشية أن المقصود المحتمل هو الجمع المتناقض بين الإثبات والنفي.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. حُفظت بنية السؤالين البلاغيين، والتكرار في «أعزم ما أعزم» و«نعم، نعم / لا، لا»، والمصطلح البولسي «الجسد»، مع شرح موجز للمواضع المحتملة الالتباس.
