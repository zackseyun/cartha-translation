- from: فإذ كنتُ أنوي هذا، أفلعلّي تصرّفتُ بتقلُّب؟ أم إنني أعزم ما أعزم بحسب الجسد[a]، حتى يكون عندي «نعم، نعم» و«لا، لا» معًا[b]؟
  to: فإذ كنتُ أنوي هذا، أفهل تصرّفتُ بتقلُّب؟ أم إنني أعزم ما أعزم بحسب الجسد[a]، حتى يكون عندي «نعم، نعم» و«لا، لا»[b]؟
  rationale: يستبدل التنقيح الصياغة الاستفهامية المتكلفة بعبارة فصيحة طبيعية، ويحذف «معًا» من المتن لأنها تفسيرية زائدة على لفظ الأصل، مع إبقاء هذا التوضيح في الحاشية. ولا يغيّر ذلك معنى المقطع أو بنيته البلاغية أو مصطلحاته الرئيسة.
