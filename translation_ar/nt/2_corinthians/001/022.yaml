  text: ὁ καὶ σφραγισάμενος ἡμᾶς καὶ δοὺς τὸν ἀρραβῶνα τοῦ πνεύματος ἐν ταῖς καρδίαις ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/022.yaml
  text: who also sealed us and gave the down payment of the Spirit in our hearts.
translation:
  language: ar
  text: الذي ختمنا أيضًا، وأعطى عربون الروح في قلوبنا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وديعة الروح» أو «ضمان الروح».'
    reason: بدائل معجمية لكلمة ἀρραβών؛ «وديعة» و«ضمان» تبرزان جانبًا من معناها، بينما يحفظ «عربون» الصورة التجارية بوضوح أكبر.
lexical_decisions:
- source_word: σφραγισάμενος
  choice: ختمنا
  rationale: يحفظ استعارة الختم الدالة على الملكية أو التوثيق أو الضمان، بصياغة عربية موجزة وطبيعية.
- source_word: δοὺς
  choice: أعطى
  rationale: عُطف الفعل على «ختمنا» بما يلائم توازي اسمَي الفاعل في اليونانية ويجري طبيعيًا في العربية.
- source_word: ἀρραβῶνα
  choice: عربون
  rationale: «العربون» دفعة أولى تضمن إتمام ما تبقى، فيحفظ الصورة التجارية الملموسة للكلمة اليونانية دون تحويلها إلى معنى عقائدي مجرد.
- source_word: τοῦ πνεύματος
  choice: عربون الروح
  rationale: يحافظ التركيب الإضافي على إيجاز الأصل وعلى احتمال أن يكون العربون هو الروح نفسه أو ما يأتي منه، دون حسم تفسيري زائد.
- source_word: ἐν ταῖς καρδίαις ἡμῶν
  choice: في قلوبنا
  rationale: ترجمة مباشرة وطبيعية لـἐν مع المجرور، وتحفظ موضع العطية الداخلي والشخصي.
- source_word: ὁ καὶ ... καὶ
  choice: الذي ... أيضًا، و
  rationale: «الذي» يصل الوصف بالله المذكور في السياق السابق، و«أيضًا» تقابل καί الأولى، مع عطف الفعل الثاني بوضوح.
theological_decisions:
- issue: دلالة الروح بوصفه ἀρραβών
  choice: عربون الروح
  alternative: ضمان الروح؛ وديعة الروح؛ الروح عربونًا
  rationale: 'اختيار «عربون» يصون الاستعارة التجارية: جزء حاضر يضمن تمام الآتي. أما الإضافة «الروح» فتحفظ الإيجاز والاحتمال القائم في الأصل بدل تفسير العلاقة داخل المتن.'
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة دون تقعر. حُفظت استعارتا الختم والعربون، كما حُفظ التركيب الموجز «عربون الروح» دون إضافة تفسير مذهبي.
