reference: 2 Corinthians 1:7
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ ἡ ἐλπὶς ἡμῶν βεβαία ὑπὲρ ⸀ὑμῶν· εἰδότες ὅτι ⸀ὡς κοινωνοί ἐστε τῶν παθημάτων, οὕτως καὶ τῆς παρακλήσεως.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/007.yaml
  text: And our hope for you is firm[a], because we know that just as you share in the sufferings, so also you share in the comfort.
translation:
  language: ar
  text: ورجاؤنا من جهتكم ثابت، لأننا نعلم أنكم كما تشاركون في الآلام، كذلك تشاركون أيضًا في التعزية[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «التشجيع» بدلًا من «التعزية» (παράκλησις).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπὶς
  choice: رجاؤنا
  rationale: «الرجاء» هو المقابل العربي الواضح والمألوف، ويحفظ معنى التوقع الواثق دون تحويله إلى مجرد ثقة ذاتية.
- source_word: βεβαία
  choice: ثابت
  rationale: ينقل معنى الرسوخ والموثوقية بصياغة عربية طبيعية وموجزة.
- source_word: ὑπὲρ ὑμῶν
  choice: من جهتكم
  rationale: يعبّر هنا عن تعلق الرجاء بالمخاطَبين، ويتجنب ما قد يوحي به «من أجلكم» من معنى النيابة أو المنفعة وحدهما.
- source_word: εἰδότες
  choice: لأننا نعلم
  rationale: يبيّن القيمة السببية لاسم الفاعل اليوناني، إذ إن علم بولس هو أساس ثبات رجائه.
- source_word: ὡς ... οὕτως καί
  choice: كما ... كذلك ... أيضًا
  rationale: يحفظ البنية الترابطية والموازاة المقصودة بين الاشتراك في الآلام والاشتراك في التعزية.
- source_word: κοινωνοί
  choice: تشاركون
  rationale: ينقل معنى المشاركة الفعلية بلغة عربية جارية، ويتيح إظهار الفعل المفهوم ضمنًا في الشق الثاني.
- source_word: παθημάτων
  choice: الآلام
  rationale: مقابل واسع وواضح يشمل ضروب المعاناة التي يتناولها السياق.
- source_word: παρακλήσεως
  choice: التعزية
  rationale: تلائم سياق الضيق والآلام في مطلع الرسالة، وتحافظ على تكرار اللفظ المحوري، مع بقاء «التشجيع» احتمالًا معجميًا مشروعًا.
- source_word: '[elliptical second clause]'
  choice: تشاركون
  rationale: الفعل غير مكرر في اليونانية بعد «كذلك»، لكن إظهاره في العربية يوضح الموازاة من غير إضافة معنى جديد.
theological_decisions: []
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حُفظت الموازاة البلاغية في «كما ... كذلك ... أيضًا»، ووُضع هامش البديل المعجمي عند اللفظة التي يشرحها.
