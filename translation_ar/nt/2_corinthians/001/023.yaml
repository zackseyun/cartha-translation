  register: عربية فصحى معاصرة واضحة ذات نبرة جادة تليق بصيغة الاستشهاد بالله. استُخدمت «عليَّ» في المتن لتوضيح معنى التبعة الشخصية، مع حفظ الصورة اليونانية الحرفية في الحاشية، وأُبقي احتمال فهم οὐκέτι بمعنى «لم أعد» دون حسمه داخل المتن.
