lexical_decisions:
- source_word: Ἐγὼ δὲ
  choice: أَمَّا أَنَا فَـ
  rationale: تنقل المقابلة الخفيفة التي تفيدها δέ مع إبراز ضمير المتكلم الصريح ἐγώ، بصياغة عربية طبيعية.
- source_word: μάρτυρα τὸν θεὸν ἐπικαλοῦμαι
  choice: أَدْعُو اللهَ شَاهِدًا
  rationale: تحافظ على الطابع الجاد الشبيه بالقَسَم، حيث يستدعي بولس الله ليشهد بصدق قوله، من غير تعبير عربي متكلف.
- source_word: ἐπὶ τὴν ἐμὴν ψυχήν
  choice: عَلَيَّ
  rationale: تعبر بوضوح عن جعل بولس نفسه موضع تبعة الشهادة إن كان غير صادق، مع إثبات الصيغة الأقرب إلى الحرفية في الحاشية.
- source_word: ὅτι
  choice: أَنِّي
  rationale: تقدم مضمون الاستشهاد بالله، لا علة مستقلة.
- source_word: φειδόμενος ὑμῶν
  choice: إِشْفَاقًا عَلَيْكُمْ
  rationale: تنقل دافع بولس إلى تجنيب المخاطَبين الشدة أو الألم، وتحافظ على إيجاز اسم الفاعل اليوناني.
- source_word: οὐκέτι ἦλθον
  choice: لَمْ آتِ ... مَرَّةً أُخْرَى
  rationale: تلائم سياق الزيارة التي لم تتم، مع إبقاء الدلالة الزمنية البديلة لـ οὐκέτι في الحاشية.
- source_word: εἰς Κόρινθον
  choice: إِلَى كُورِنْثُوسَ
  rationale: الصياغة العربية المألوفة للدلالة على الحركة نحو مدينة.
theological_decisions: []
