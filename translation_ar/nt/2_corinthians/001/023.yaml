  text: But I call God as witness upon my own life[b][a], that to spare you I did not come again to Corinth.
translation:
  language: ar
  text: أَمَّا أَنَا فَأَدْعُو اللهَ شَاهِدًا عَلَيَّ[a] أَنِّي، إِشْفَاقًا عَلَيْكُمْ، لَمْ آتِ إِلَى كُورِنْثُوسَ مَرَّةً أُخْرَى[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أستشهد بالله على نفسي»؛ وحرفيًا: «أدعو الله شاهدًا على نفسي».'
