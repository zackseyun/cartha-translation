  text: ὅτι καθὼς περισσεύει τὰ παθήματα τοῦ Χριστοῦ εἰς ἡμᾶς, οὕτως διὰ τοῦ Χριστοῦ περισσεύει καὶ ἡ παράκλησις ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/005.yaml
  text: For just as the sufferings of Christ overflow to us[b][a], so also through Christ our comfort overflows.
translation:
  language: ar
  text: لأنه كما تفيض علينا آلام المسيح[a][b]، كذلك يفيض أيضًا عزاؤنا بالمسيح.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الآلام من أجل المسيح». قد تدل العبارة اليونانية على آلام تخص المسيح أو على آلام تُحتمل بسببه.'
    reason: alternative_reading
  - marker: b
    text: اللفظ اليوناني المترجم «المسيح» يعني أيضًا «المسيّا»، ولا سيما حين يبرز معنى اللقب.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: فلأنه
  rationale: تُدخل الجملة بوصفها تعليلًا لما سبق، وتحفظ القوة السببية مع وصل طبيعي بالسياق.
- source_word: καθὼς ... οὕτως
  choice: كما ... كذلك
  rationale: تحفظ بنية المقارنة المتلازمة في عبارة عربية واضحة وطبيعية.
- source_word: περισσεύει
  choice: تفيض / يفيض
  rationale: ينقل معنى الكثرة المتجاوزة للحد، ويحافظ على الصورة نفسها عند تكرار الفعل في نص الآية.
- source_word: τὰ παθήματα
  choice: آلام
  rationale: مقابل مباشر ومألوف يدل على ما يُكابَد من معاناة، ويلائم السياق الرعوي.
- source_word: τοῦ Χριστοῦ
  choice: المسيح
  rationale: أُبقيت إضافة «آلام المسيح» من غير حسم لطبيعة العلاقة التي يدل عليها المضاف إليه، مع بيان الاحتمال الآخر في الحاشية.
- source_word: εἰς ἡμᾶς
  choice: علينا
  rationale: تعبير عربي طبيعي يفيد أن هذه الآلام تبلغ بولس ورفاقه وتقع عليهم.
- source_word: διὰ τοῦ Χριστοῦ
  choice: بالمسيح
  rationale: ينقل معنى الوساطة في διά مع المضاف إليه بإيجاز عربي طبيعي؛ أي أن العزاء يفيض بوساطة المسيح.
- source_word: ἡ παράκλησις ἡμῶν
  choice: عزاؤنا
  rationale: يحفظ صيغة الملكية في اليونانية ويؤدي المعنى الرعوي المقابل للآلام من دون توسيع تفسيري.
theological_decisions:
- issue: دلالة عبارة «آلام المسيح»
  choice: الإبقاء على الإضافة بما يسمح بفهمها آلامًا مرتبطة بالمسيح ويشترك فيها المؤمنون معه
  alternative: الآلام التي تُحتمل من أجل المسيح، أو آلام المسيح نفسه التي تمتد آثارها إلى شعبه
  rationale: صيغة المضاف إليه في اليونانية تحتمل أكثر من علاقة دلالية؛ لذلك لا يحسم المتن وجهًا واحدًا، وتُذكر قراءة «من أجل المسيح» في الحاشية.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة وموقرة. حُفظ تكرار صورة الفيضان في نصفي الآية، وأُبقي غموض الإضافة في «آلام المسيح» بدل حسمه تفسيريًا.
