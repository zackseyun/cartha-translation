  rationale: صُححت دلالة καί من توكيد («حقًّا») إلى عطف («أيضًا») مع إبقاء بقية البنية والمعنى، وبخاصة غموض «إلى النهاية» الموافق لـἕως τέλους، دون إضافة تفسير مذهبي أو حاشية غير لازمة.
