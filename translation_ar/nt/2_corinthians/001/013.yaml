  text: οὐ γὰρ ἄλλα γράφομεν ὑμῖν ἀλλ’ ἢ ἃ ἀναγινώσκετε ἢ καὶ ἐπιγινώσκετε, ἐλπίζω δὲ ⸀ὅτι ἕως τέλους ἐπιγνώσεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/013.yaml
  text: For we are not writing anything else to you except what you read and indeed understand[a], and I hope that you will understand fully to the end,
translation:
  language: ar
  text: فنحن لا نكتب إليكم شيئًا آخر غير ما تقرأونه وتفهمونه أيضًا، وأرجو أن تفهموا إلى النهاية،
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλα
  choice: شيئًا آخر
  rationale: ينقل جمع المحايد اليوناني بعد فعل الكتابة المنفي بتعبير عربي طبيعي، مع إبقاء نفي وجود رسالة مختلفة أو خفية.
- source_word: ἀναγινώσκετε
  choice: تقرأونه
  rationale: يحفظ المعنى المباشر للفعل وزمنه الحاضر، ويعود ضمير المفعول طبيعيًّا إلى ما يكتبه بولس.
- source_word: ἐπιγινώσκετε
  choice: تفهمونه حقًّا
  rationale: السياق يتجاوز مجرد القراءة إلى إدراك مضمون المكتوب؛ وتؤدي «حقًّا» قوة καί هنا بوصفها توكيدًا محتملًا دون إثقال العبارة.
- source_word: ἐπιγνώσεσθε
  choice: تفهموا
  rationale: ينقل المعنى السياقي للفعل، وهو إدراك المقصود، بينما يُفهم الاستقبال في العربية بعد «أرجو أن».
- source_word: ἕως τέλους
  choice: إلى النهاية
  rationale: يحافظ على الصياغة اليونانية الصريحة وعلى احتمالها الزمني، بدل حصرها في معنى الكمال أو التمام.
- source_word: οὐ γὰρ ... ἀλλ’ ἢ
  choice: فنحن لا ... غير
  rationale: تركيب عربي طبيعي يحفظ التعليل والحصر اللذين يؤديهما التركيب اليوناني.
theological_decisions:
- issue: 'دلالة ἕως τέλους: زمنية أم دالة على التمام'
  choice: إلى النهاية
  alternative: تمامًا / فهمًا كاملًا
  rationale: العبارة اليونانية تحتمل الاستمرار إلى النهاية، وربما الإحاطة التامة بحسب السياق. اختيرت الصياغة الأقرب إلى الأصل كي لا يُحسم هذا التوتر الدلالي دون ضرورة.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. استُخدم «فنحن» لإظهار γάρ وربط الآية بسياقها، وحُفظ توازي القراءة والفهم من غير مصطلحات تفسيرية أو مذهبية.
