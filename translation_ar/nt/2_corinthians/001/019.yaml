  text: ὁ ⸂τοῦ θεοῦ γὰρ⸃ υἱὸς ⸂Ἰησοῦς Χριστὸς⸃ ὁ ἐν ὑμῖν δι’ ἡμῶν κηρυχθείς, δι’ ἐμοῦ καὶ Σιλουανοῦ καὶ Τιμοθέου, οὐκ ἐγένετο Ναὶ καὶ Οὒ, ἀλλὰ Ναὶ ἐν αὐτῷ γέγονεν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/019.yaml
  text: For the Son of God[a], Jesus the Messiah, who was proclaimed among you through us—through me and Silvanus and Timothy—did not become Yes and No; rather[d][c][b], in him it has become Yes.
translation:
  language: ar
  text: فَإِنَّ ابْنَ اللهِ، يَسُوعَ الْمَسِيحَ، الَّذِي كُرِزَ بِهِ بَيْنَكُمْ بَوَاسِطَتِنَا—بِوَاسِطَتِي وَبِوَاسِطَةِ سِلْوَانُسَ وَتِيمُوثَاوُسَ—لَمْ يَصِرْ «نَعَمْ» وَ«لَا»، بَلْ قَدْ صَارَ فِيهِ «نَعَمْ».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ τοῦ θεοῦ υἱός
  choice: ابن الله
  rationale: الصياغة العربية الطبيعية للقب، وتحفظ دلالته المسيحانية كاملة.
- source_word: Ἰησοῦς Χριστός
  choice: يسوع المسيح
  rationale: «المسيح» المقابل العربي الراسخ لـΧριστός، ويحفظ هنا كونه لقبًا اقترن بالاسم.
- source_word: κηρυχθείς
  choice: نادينا به
  rationale: ينقل معنى الإعلان العلني في κηρύσσω، ويتلاءم طبيعيًا مع تعدية الفعل العربي بالباء.
- source_word: ἐν ὑμῖν
  choice: بينكم
  rationale: يفيد أن المناداة جرت في وسط الجماعة، وهو تعبير عربي واضح وطبيعي.
- source_word: δι’ ἡμῶν ... δι’ ἐμοῦ καὶ Σιλουανοῦ καὶ Τιμοθέου
  choice: نادينا به ... أنا وسلوانس وتيموثاوس
  rationale: أُدمج معنى الوساطة في الفعل العربي، ثم ذُكرت الأسماء تفسيرًا لضمير الجماعة من غير إثقال العبارة بتكرار «بواسطتنا».
- source_word: οὐκ ἐγένετο Ναὶ καὶ Οὔ
  choice: لم يصر «نعم» و«لا»
  rationale: يحفظ فعل الصيرورة وصورة بولس البلاغية، من غير تفسيرها ضمنًا بالتذبذب أو عدم الثبات.
- source_word: ἀλλὰ Ναὶ ἐν αὐτῷ γέγονεν
  choice: بل قد صار فيه «نعم»
  rationale: «قد صار» تعكس صيغة التام ونتيجتها القائمة، و«فيه» تبقي العبارة اللاهوتية على انفتاحها الأصلي.
theological_decisions:
- issue: كيفية نقل Χριστός في Ἰησοῦς Χριστός
  choice: يسوع المسيح
  alternative: يسوع، الممسوح
  rationale: «المسيح» هو اللقب العربي الكتابي المألوف، ويؤدي المعنى من غير شرح زائد أو تحويل اللقب إلى تعبير غير اصطلاحي.
- issue: هل تُفسَّر عبارتا «نعم» و«لا» أم تُحفظان بصورتهما البلاغية؟
  choice: لم يصر «نعم» و«لا»، بل قد صار فيه «نعم»
  alternative: لم يكن مترددًا، بل كان ثابتًا
  rationale: حُفظت صياغة بولس المكثفة والتوتر الدلالي فيها، ولم تُستبدل بتفسير يحصر المراد في الثبات أو عدم التردد.
- issue: مرجع الفاعل المستتر في γέγονεν ودلالة ἐν αὐτῷ
  choice: قد صار فيه «نعم»
  alternative: كان هو دائمًا «نعم»
  rationale: تتبع الصياغة تركيب اليونانية من غير تعيين تفسيري زائد لما صار «نعم»، وتحفظ عبارة «فيه» كما هي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كتابية وقورة. استُعملت علامات التنصيص لإبراز «نعم» و«لا» بوصفهما لفظين محوريين في الحجة، واستُخدمت الجملة الاعتراضية لتحديد المقصود بـ«نا» بسلاسة.
