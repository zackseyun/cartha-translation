review_pass:
  verdict: revise
  source_fidelity: 'المسودة أمينة إجمالًا للنص اليوناني: تحافظ على لقب «ابن الله»، وعلى «يسوع المسيح»، وعلى صورة «نعم» و«لا» وصيغة الصيرورة والتام في الخاتمة. لكن «نادينا به» لا تنقل بدقة كافية الفعل المبني للمجهول κηρυχθείς («الذي كُرِزَ/بُشِّرَ به»)، وقد توهم النداء باسمه بدل الكرازة به. كما أن إظهار علاقة الوساطة في δι’ ἡμῶν ثم تفصيلها أدق في العربية.'
  naturalness: العربية سليمة ذات نبرة كتابية واضحة. إلا أن «كُرِزَ به» أوضح وأدق مصطلحيًا من «نادينا به» في هذا الموضع، و«بواسطتنا، أي بواسطتي وبواسطة...» تعكس البنية اليونانية من دون غموض.
  terminology: «ابن الله» و«يسوع المسيح» و«نعم/لا» اختيارات مناسبة ومستقرة. يُستحسن اعتماد «كُرِزَ به» للمصطلح الكرازي κηρύσσω، بدل فعل «نادى» الأوسع دلالة.
  issues:
  - severity: medium
    issue: «الذي نادينا به» مقابل κηρυχθείς
    rationale: κῆρυξ/κηρύσσω يدل هنا على الكرازة أو الإعلان الرسولي، والفعل اليوناني مبني للمجهول. «نادينا به» قد يفهم نداءً أو دعاءً، ولا يحافظ بوضوح على صيغة «كُرِزَ به».
  - severity: low
    issue: إدماج δι’ ἡμῶν في فعل نشط ثم تعداد الأسماء بلا أداة وساطة
    rationale: المعنى لا يضيع، لكن النص يكرر διά قبل «نحن» وقبل الأسماء؛ وإظهاره في العربية يحسن الشفافية للنص المصدر.
