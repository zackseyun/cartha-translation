- from: فَإِنَّ ابْنَ اللهِ، يَسُوعَ الْمَسِيحَ، الَّذِي نَادَيْنَا بِهِ بَيْنَكُمْ—أَنَا وَسِلْوَانُسُ وَتِيمُوثَاوُسُ—لَمْ يَصِرْ «نَعَمْ» وَ«لَا»، بَلْ قَدْ صَارَ فِيهِ «نَعَمْ».
  to: فَإِنَّ ابْنَ اللهِ، يَسُوعَ الْمَسِيحَ، الَّذِي كُرِزَ بِهِ بَيْنَكُمْ بَوَاسِطَتِنَا—بِوَاسِطَتِي وَبِوَاسِطَةِ سِلْوَانُسَ وَتِيمُوثَاوُسَ—لَمْ يَصِرْ «نَعَمْ» وَ«لَا»، بَلْ قَدْ صَارَ فِيهِ «نَعَمْ».
  rationale: استُبدل «نادينا به» بـ«كُرِزَ به» ليُحافَظ على معنى κηρυχθείς المبني للمجهول وعلى الاستعمال العربي الكتابي الدقيق، وأُظهرت الوساطة مرتين بما يوازي تكرار διά في النص اليوناني. ولم يُضف تفسير لعبارة «نعم» و«لا» أو لعبارة «فيه».
