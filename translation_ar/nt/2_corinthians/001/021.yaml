  text: ὁ δὲ βεβαιῶν ἡμᾶς σὺν ὑμῖν εἰς Χριστὸν καὶ χρίσας ἡμᾶς θεός,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/021.yaml
  text: But the one who establishes us with you in Messiah[a], and who anointed us, is God.
translation:
  language: ar
  text: لكنَّ الذي يثبِّتنا معكم في المسيح[a]، والذي مسحنا، هو الله.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بحرفية أكثر: «إلى المسيح».'
    reason: alternative_reading
lexical_decisions:
- source_word: βεβαιῶν
  choice: يثبِّتنا
  rationale: يفيد جعل الشخص ثابتًا راسخًا؛ وصيغة المضارع في «يثبِّتنا» تلائم دلالة اسم الفاعل المضارع اليوناني.
- source_word: σὺν ὑμῖν
  choice: معكم
  rationale: تحافظ على معنى المشاركة الجامعة بين بولس ورفقائه والمخاطَبين.
- source_word: εἰς Χριστόν
  choice: في المسيح
  rationale: تعبير عربي طبيعي ينقل الدلالة العلائقية أو الاندماجية المحتملة في السياق البولسي، مع بيان الصياغة الأقرب إلى الحرفية في الحاشية.
- source_word: χρίσας
  choice: مسحنا
  rationale: يحفظ الصلة اللفظية بفعل المسح وبلفظ «المسيح»، من غير حصر المعنى في طقس معيّن.
- source_word: θεός
  choice: الله
  rationale: أُبقي في ختام الجملة خبرًا مؤكدًا، موافقًا لموضعه البارز في النص اليوناني.
- source_word: Χριστόν
  choice: المسيح
  rationale: هو المقابل العربي الطبيعي للقب اليوناني Χριστός، ويحفظ دلالته المسيانية.
theological_decisions:
- issue: دلالة εἰς في εἰς Χριστόν
  choice: «في المسيح» بوصفها دلالة علائقية أو اندماجية محتملة
  alternative: «إلى المسيح» بوصفها ترجمة أقرب إلى ظاهر حرف الجر
  rationale: السياق البولسي يجيز فهم العبارة على الثبات في علاقة بالمسيح، لكن الحاشية تُبقي الاحتمال الحرفي ظاهرًا ولا تلغي التوتر الدلالي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حوفظ على توازي «يثبِّتنا» و«مسحنا»، وعلى إبراز «الله» في نهاية الآية.
