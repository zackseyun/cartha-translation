  yaml_path: translation/nt/2_corinthians/001/002.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a][b].
translation:
  language: ar
  text: نِعْمَةٌ لَكُمْ وَسَلَامٌ مِنَ اللهِ أَبِينَا وَمِنَ الرَّبِّ[b] يَسُوعَ الْمَسِيحِ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «المسيح» ترجمة للقب اليوناني Χριστός، ومعناه «الممسوح».
    reason: lexical_clarification
  - marker: b
    text: يمكن أن تعني الكلمة المترجمة «الرب» أيضًا «السيد» في سياقات أخرى.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: نِعْمَةٌ
  rationale: تحفظ اللفظة العربية معنى العطاء الإلهي المجاني، كما تلائم صيغة التحية البولسية ولا تختزلها في مجرد «حظوة» أو «رضا».
- source_word: ὑμῖν
  choice: لَكُمْ
  rationale: اللام هي المقابل العربي الطبيعي لدلالة المفعول غير المباشر في هذه التحية، والخطاب موجَّه إلى جماعة.
- source_word: εἰρήνη
  choice: سَلَامٌ
  rationale: «سلام» هو المقابل الكتابي والطبيعي، ويحفظ أصداء السلام بمعنى الطمأنينة والخير المتكامل.
- source_word: ἀπὸ
  choice: مِنَ ... وَمِنَ
  rationale: تفيد ἀπὸ المصدر. أُعيد حرف الجر قبل «الرب» في العربية لتوضيح أن النعمة والسلام صادران من الله الآب ومن الرب يسوع المسيح، من غير تغيير للعلاقة النحوية في الأصل.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: اللهِ أَبِينَا
  rationale: 'صياغة عربية موجزة وطبيعية تحفظ علاقة البدل أو الوصف في العبارة اليونانية: الله الذي هو أبونا.'
- source_word: κυρίου
  choice: الرَّبِّ
  rationale: «الرب» هو المقابل الأليق باللقب المسيحاني هنا، ولا سيما في صيغة البركة المقترنة بذكر الله أبينا.
- source_word: Ἰησοῦ Χριστοῦ
  choice: يَسُوعَ الْمَسِيحِ
  rationale: «يسوع» نقل للاسم، و«المسيح» ترجمة عربية راسخة للقب Χριστός وتحفظ دلالته بوصفه الممسوح.
theological_decisions:
- issue: دلالة Χριστός في التحية البولسية
  choice: الْمَسِيح
  alternative: كريستوس (نقل صوتي)
  rationale: اللفظ اليوناني لقب ذو معنى («الممسوح»)، و«المسيح» ينقل هذا اللقب بصورة عربية راسخة من غير إضافة تفسير مذهبي.
- issue: دلالة κύριος عند إطلاقه على يسوع
  choice: الرَّبّ
  alternative: السيد
  rationale: في هذه البركة، يَرِد اللقب مقرونًا بالله أبينا بوصفهما مصدر النعمة والسلام؛ لذلك يحفظ «الرب» قوة الاستعمال المسيحاني، مع إبقاء البديل المعجمي في الحاشية.
translation_notes:
  register: فصحى معاصرة واضحة ذات نبرة كتابية وقورة. استُخدم ضبط جزئي لتبيين القراءة، وأُعيد حرف الجر «من» قبل «الرب» لسلامة العربية ووضوح المصدر المشترك.
