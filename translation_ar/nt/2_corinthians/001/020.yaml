revisions:
- from: فمهما يكن عدد مواعيد الله، ففيه الـ«نعم»[a]. ولذلك أيضًا به نقول «آمين»[b] لله، فيتمجّد الله بواسطتنا[c].
  to: فمهما يكن عدد مواعيد الله، ففيه «نعم»[a]. ولذلك أيضًا به نقول «آمين»[b] لله لمجده بواسطتنا[c].
  rationale: أُبقيت العبارة الأولى موجزة كما في اليونانية، مع إزالة تمثيل عربي متكلف لأداة التعريف. وفي الشطر الثاني، استُبقي فعل «نقول» بوصفه توضيحًا عربيًا محدودًا للاسم «آمين»، لكن عُدّلت الخاتمة إلى «لمجده بواسطتنا» كي لا تستبدل تركيب الأصل بجملة عن تمجّد الله. كما نُقحت الحاشية لتبيّن الإيجاز التركيبي واحتمال نطاق «بواسطتنا» دون حسم زائد.
