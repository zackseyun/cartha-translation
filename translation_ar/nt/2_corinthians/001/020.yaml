  text: ὅσαι γὰρ ἐπαγγελίαι θεοῦ, ἐν αὐτῷ τὸ Ναί· ⸀διὸ καὶ ⸂δι’ αὐτοῦ⸃ τὸ Ἀμὴν τῷ θεῷ πρὸς δόξαν δι’ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/020.yaml
  text: For however many promises of God there are[a], in him is the Yes[c][b]. Therefore also through him is the Amen to God for glory through us.
translation:
  language: ar
  text: فمهما يكن عدد مواعيد الله، ففيه «نعم»[a]. ولذلك أيضًا به نقول «آمين»[b] لله لمجده بواسطتنا[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي إن مواعيد الله تجد فيه جوابها: «نعم»؛ ويمكن توضيح المعنى: «ففيه تتحقق مواعيد الله».'
    reason: alternative_reading
  - marker: b
    text: «آمين» لفظة عبرية منقولة صوتيًا، تفيد التأكيد بمعنى قريب من «حقًّا» أو «ليكن كذلك».
    reason: cultural_note
  - marker: c
    text: 'أو، بصورة أقرب إلى تركيب اليونانية: «ولذلك أيضًا به تكون «آمين» لله، للمجد بواسطتنا». وتحتمل العبارة أن تتصل «بواسطتنا» بقول «آمين» أو بغاية المجد، مع بقاء مجد الله الغاية المقصودة.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅσαι
  choice: مهما يكن عدد
  rationale: ينقل معنى الشمول غير المحدد في ὅσαι بصياغة عربية واضحة، بحيث تشمل العبارة جميع مواعيد الله.
- source_word: ἐπαγγελίαι θεοῦ
  choice: مواعيد الله
  rationale: «مواعيد» هي المقابل العربي المألوف للوعود الإلهية، والإضافة تحافظ على نسبة المواعيد إلى الله.
- source_word: ἐν αὐτῷ
  choice: ففيه
  rationale: يحافظ على عبارة بولس المكثفة وعلى الإحالة إلى المسيح، من غير إضافة فعل مثل «تتحقق» لا يرد صراحة في اليونانية.
- source_word: τὸ Ναί
  choice: الـ«نعم»
  rationale: يحفظ أداة التعريف والقوة البلاغية للاسم المؤكد في النص، مع إبراز اللفظة بوصفها جواب الإثبات.
- source_word: διὸ καὶ δι’ αὐτοῦ
  choice: ولذلك أيضًا به
  rationale: ينقل الاستنتاج في διό، ويحافظ على «أيضًا» وعلى وساطة المسيح التي تفيدها διά مع المضاف إليه.
- source_word: τὸ Ἀμὴν
  choice: نقول «آمين»
  rationale: «آمين» لفظة راسخة في العربية الكنسية؛ وإدخال «نقول» يوضح بصورة طبيعية أن التأمين موجَّه إلى الله عبر الجماعة، وهو مستفاد من السياق ومن δι’ ἡμῶν.
- source_word: τῷ θεῷ
  choice: لله
  rationale: ينقل المجرور اليوناني بوصف الله المتلقي لتأكيد «آمين».
- source_word: πρὸς δόξαν δι’ ἡμῶν
  choice: فيتمجّد الله بواسطتنا
  rationale: صياغة عربية طبيعية تُظهر غاية التأمين ووساطتنا في تمجيد الله، مع الإقرار في الحاشية بإمكان إبقاء العبارة أكثر تكثيفًا.
theological_decisions:
- issue: هل تُفك عبارة بولس الناقصة إلى تصريح بأن المواعيد قد تحققت؟
  choice: الإبقاء على العبارة المكثفة «ففيه الـنعم»
  alternative: «ففيه تتحقق جميع مواعيد الله» أو «ففيه تجد جواب نعم»
  rationale: السياق يدل على تحقق المواعيد في المسيح، لكن النص اليوناني لا يذكر فعل «تتحقق»؛ لذلك تحفظ الصياغة توتر العبارة وقوتها البلاغية.
- issue: تحديد الفاعل المستتر في عبارة «آمين» وصلتها بعبارة «بواسطتنا»
  choice: «به نقول آمين لله، فيتمجّد الله بواسطتنا»
  alternative: «وبه أيضًا الـآمين لله، للمجد بواسطتنا»
  rationale: الصياغة المختارة توضّح العربية من غير إدخال مضمون مذهبي خاص، وتنسجم مع كون «آمين» اعتراف الجماعة الموجَّه إلى الله عبر المسيح؛ أما البديل فيحاكي الإيجاز اليوناني لكنه غامض وثقيل بالعربية.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. حُفظ التكثيف البلاغي في «ففيه الـنعم»، بينما صيغ النصف الثاني صياغة عربية طبيعية تبيّن فعل الجماعة وغاية تمجيد الله. وُضعت جميع علامات الحواشي [a] و[b] و[c] في المتن.
