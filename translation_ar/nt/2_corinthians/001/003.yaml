id: 2CO.1.3
reference: 2 Corinthians 1:3
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Εὐλογητὸς ὁ θεὸς καὶ πατὴρ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ πατὴρ τῶν οἰκτιρμῶν καὶ θεὸς πάσης παρακλήσεως,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/003.yaml
  text: Blessed be the God and Father of our Lord Jesus the Messiah[a], the Father of mercies and God of all comfort[d][c][b],
translation:
  language: ar
  text: مُبارَكٌ هو الله، أبو ربّنا[b] يسوع المسيح[a]، أبو المراحم[c] وإله كل تعزية[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي إن «المسيح» لقب معناه «الممسوح».
    reason: توضيح دلالة اللقب Χριστός.
  - marker: b
    text: أو «سيّدنا».
    reason: بديل معجمي لكلمة κύριος.
  - marker: c
    text: أو «الرأفات».
    reason: بديل معجمي يحفظ مجال معنى οἰκτιρμοί.
  - marker: d
    text: أو «تشجيع» أو «مواساة».
    reason: بدائل معجمية ضمن المجال الدلالي لكلمة παράκλησις.
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: مُبارَكٌ هو
  rationale: يحافظ على صيغة التمجيد الخبرية في اليونانية، ويأتي في عربية واضحة وطبيعية دون تحويلها إلى مجرد وصف عابر.
- source_word: ὁ θεὸς καὶ πατὴρ
  choice: الله، أبو
  rationale: يعكس أن أداة التعريف اليونانية تجمع «الله» و«الأب» في مرجع واحد، مع صياغة عربية سليمة تُظهر علاقة الأبوة.
- source_word: κυρίου
  choice: ربّنا
  rationale: «الرب» هو المقابل الأنسب لـκύριος في هذا السياق المسيحاني، مع الإبقاء على «سيّدنا» بديلاً معجمياً ممكناً.
- source_word: Χριστοῦ
  choice: المسيح
  rationale: ينقل معنى اللقب اليوناني Χριστός نقلاً مباشراً وطبيعياً في العربية، بدلاً من معاملته كلقب عائلي.
- source_word: οἰκτιρμῶν
  choice: المراحم
  rationale: يحفظ صيغة الجمع اليونانية ويعبّر عن وفرة رحمة الله؛ ويمكن أيضاً فهم اللفظة بمعنى الرأفات.
- source_word: παρακλήσεως
  choice: تعزية
  rationale: تلائم سياق الضيق في الآيات التالية، مع بقاء معاني التشجيع والمواساة ضمن المجال الدلالي للكلمة.
theological_decisions:
- issue: دلالة Χριστός في Ἰησοῦ Χριστοῦ
  choice: يسوع المسيح
  alternative: يسوع الممسوح
  rationale: «المسيح» هو اللقب العربي الطبيعي المعبّر عن معنى Χριστός ويحفظ دلالته المسيحانية، أما «الممسوح» فيوضح الاشتقاق لكنه أقل ملاءمة بوصفه لقباً مستقراً في هذا الموضع.
- issue: العلاقة النحوية في ὁ θεὸς καὶ πατὴρ
  choice: 'مرجع واحد: الله الذي هو أبو ربنا يسوع المسيح'
  alternative: فهم «الله» و«الأب» كمرجعين منفصلين
  rationale: أداة التعريف المفردة والبنية العطفية تدلان طبيعياً على وصف مرجع واحد بلقبين، دون إزالة التوتر اللاهوتي الكامن في وصف الله بأنه إله ربنا وأبوه.
translation_notes:
  register: صياغة عربية فصحى حديثة ذات نبرة تمجيدية رصينة. أُبقي جمع «المراحم» موافقةً لصيغة الأصل، واستُخدمت «تعزية» لصلتها الطبيعية بسياق الضيق اللاحق. جميع علامات الحواشي واردة في المتن.
