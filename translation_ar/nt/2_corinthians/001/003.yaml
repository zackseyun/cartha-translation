  source_fidelity: 'النص العربي ينقل البنية والمعنى بدقة: «مُبارَكٌ هو» يؤدي الصيغة التمجيدية لـΕὐλογητός، و«الله، أبو ربّنا يسوع المسيح» يعبّر عن المرجع الواحد في ὁ θεὸς καὶ πατὴρ، مع حفظ الإضافة في «ربّنا». كما يحافظ «أبو المراحم وإله كل تعزية» على الجمع في οἰκτιρμῶν وعلى شمول πάσης παρακλήσεως.'
