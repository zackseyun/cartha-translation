  text: Those who were escorting Paul brought him as far as Athens[a], and after receiving instructions for Silas and Timothy to come to him as quickly as possible[b], they departed.
translation:
  language: ar
  text: أمّا الذين كانوا يرافقون بولس، فأوصلوه إلى أثينا[a]. وبعد أن تلقّوا تعليماتٍ موجَّهةً إلى سيلا وتيموثاوس بأن يأتيا إليه بأسرع ما يمكن[b]، انصرفوا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «حتى أثينا»، أي إنهم رافقوه إلى أن بلغوا تلك الوجهة.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «أمرًا». فاللفظة اليونانية قد تدل على توجيه، وقد تحمل أيضًا معنى الأمر الملزم.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθιστάνοντες
  choice: كانوا يرافقون
  rationale: يدل اسم الفاعل في هذا السياق على مرافقة بولس في رحلته وإيصاله إلى وجهته، وهذه الصياغة طبيعية وتحفظ معنى المصاحبة المستمرة دون افتراض حراسة رسمية.
- source_word: ἤγαγον
  choice: فأوصلوه
  rationale: الفعل الرئيسي يصف إتمام نقل بولس إلى أثينا؛ و«أوصلوه» عربية طبيعية وتنسجم مع معنى المرافقة حتى الوجهة.
- source_word: ἕως Ἀθηνῶν
  choice: إلى أثينا
  rationale: تدل العبارة على بلوغ المرافقين ببولس هذه الوجهة. والصياغة العربية الطبيعية «إلى أثينا»، مع بيان الدلالة الحرفية البديلة في الحاشية.
- source_word: λαβόντες ἐντολήν
  choice: بعد أن تسلّموا منه توجيهات
  rationale: صيغ اسم الفاعل زمنيًا، ويمكن أن تعني ἐντολή أمرًا أو توجيهًا. واختيار «توجيهات» ملائم لسياق نقل طلب بولس إلى رفيقيه، مع إبقاء المعنى الأقوى في الحاشية. أُضيف «منه» لبيان المصدر المفهوم سياقيًا من الضمير اللاحق.
- source_word: πρὸς τὸν Σιλᾶν καὶ τὸν Τιμόθεον
  choice: إلى سيلا وتيموثاوس
  rationale: تشير πρός هنا إلى متلقّي التوجيهات، و«إلى» تؤدي هذا المعنى بوضوح في العربية.
- source_word: ἵνα ὡς τάχιστα ἔλθωσιν πρὸς αὐτόν
  choice: بأن يأتيا إليه بأسرع ما يمكن
  rationale: تبيّن الجملة مضمون التوجيهات، وتحفظ صيغة المثنى للفاعلين وإلحاح ὡς τάχιστα، كما تبقي الضمير «إليه» صريحًا.
- source_word: ἐξῄεσαν
  choice: انصرفوا
  rationale: يلخّص الفعل مغادرة المرافقين بعد تسلّم التوجيهات، و«انصرفوا» تعبير سردي فصيح وطبيعي.
