  text: πολλοὶ μὲν οὖν ἐξ αὐτῶν ἐπίστευσαν, καὶ τῶν Ἑλληνίδων γυναικῶν τῶν εὐσχημόνων καὶ ἀνδρῶν οὐκ ὀλίγοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/012.yaml
  text: Therefore many of them believed[b][a], and not a few of the prominent Greek women and men.
translation:
  language: ar
  text: فآمن كثيرون منهم، وكذلك آمن عدد غير قليل من النساء اليونانيات ذوات المكانة[a] ومن الرجال[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «المحترمات» أو «ذوات المكانة الاجتماعية الرفيعة».'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «ليس قليلًا»؛ وهو أسلوب يفيد وجود عدد ملحوظ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ μὲν οὖν
  choice: فآمن كثيرون
  rationale: تفيد «فـ» النتيجة والانتقال اللذين تؤديهما مجموعة الجسيمات μὲν οὖν في السياق، وتأتي العبارة طبيعية في العربية.
- source_word: ἐξ αὐτῶν
  choice: منهم
  rationale: تحفظ الدلالة التبعيضية وتشير إلى الجماعة المذكورة في السياق السابق.
- source_word: ἐπίστευσαν
  choice: آمن
  rationale: مقابل مباشر للفعل، مع إبقاء متعلق الإيمان مفهومًا من السياق دون إضافة تفسير عقائدي غير مصرح به في الآية.
- source_word: τῶν Ἑλληνίδων γυναικῶν
  choice: من النساء اليونانيات
  rationale: تدل العبارة على نساء يونانيات، ولا يقتضي السياق ترجمة γυναικῶν بمعنى «زوجات».
- source_word: τῶν εὐσχημόνων
  choice: ذوات المكانة
  rationale: ينقل التعبير دلالة الوجاهة أو المكانة الاجتماعية بلغة عربية واضحة، مع الإشارة في الحاشية إلى البديل الدلالي «المحترمات».
- source_word: καὶ ἀνδρῶν οὐκ ὀλίγοι
  choice: والرجال، عدد غير قليل
  rationale: يحافظ على أسلوب نفي القلة الوارد في اليونانية، مع ترتيب عربي سلس يجعل «عدد غير قليل» شاملًا للنساء والرجال بحسب التركيب.
- source_word: καὶ
  choice: وكذلك
  rationale: يربط الفئة الإضافية بالمؤمنين المذكورين أولًا، ويوضح الانتقال الطبيعي في العربية.
theological_decisions:
- issue: هل يُترجم ἐπίστευσαν بعبارة عقائدية صريحة؟
  choice: آمن
  alternative: آمنوا بالمسيح / قبلوا الرسالة
  rationale: لا تذكر الآية متعلق الفعل صراحة، بل يُفهم من السياق؛ لذلك تحافظ الترجمة على الإيجاز والغموض النصي دون استيراد صياغة عقائدية إضافية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. حُفظ أسلوب «عدد غير قليل» القريب من نفي القلة في الأصل، واستُعملت «ذوات المكانة» لنقل البعد الاجتماعي المحتمل في εὐσχημόνων.
