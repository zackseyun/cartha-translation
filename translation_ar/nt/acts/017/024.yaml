  text: ὁ θεὸς ὁ ποιήσας τὸν κόσμον καὶ πάντα τὰ ἐν αὐτῷ, οὗτος οὐρανοῦ καὶ γῆς ⸂ὑπάρχων κύριος⸃ οὐκ ἐν χειροποιήτοις ναοῖς κατοικεῖ
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/024.yaml
  text: The God who made the world and everything in it[a], being Lord of heaven and earth, does not dwell in temples made by hands.
translation:
  language: ar
  text: الله الذي صنع العالم وكلَّ ما فيه، وهو ربُّ السماء والأرض، لا يسكن في هياكل من صنع أيدي البشر[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «هياكل مصنوعة بالأيدي»؛ أي هياكل بناها البشر.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσας
  choice: الذي صنع
  rationale: اسم الفاعل اليوناني يصف الله؛ وصيغة «الذي صنع» عربية طبيعية وتحافظ على معنى الفعل من غير تحويله إلى مصطلح تفسيري أضيق.
- source_word: κόσμον
  choice: العالم
  rationale: يدل هنا على العالم المخلوق بوصفه كلًّا، و«العالم» واضحة وشائعة في العربية المعاصرة.
- source_word: πάντα τὰ ἐν αὐτῷ
  choice: كلَّ ما فيه
  rationale: تنقل شمول πάντα بعبارة عربية موجزة وطبيعية، ويعود الضمير إلى العالم.
- source_word: ὑπάρχων κύριος
  choice: وهو ربُّ
  rationale: تحافظ الجملة الحالية على وصف حال الله وسيادته، من غير جعل اسم الفاعل سببيًا بصيغة مثل «لأنه رب».
- source_word: κύριος
  choice: ربّ
  rationale: يناسب معنى السيادة والسلطان هنا، ولا سيما مع المضاف إليه «السماء والأرض».
- source_word: οὐρανοῦ καὶ γῆς
  choice: السماء والأرض
  rationale: تنقل الاقتران اليوناني المفرد بصياغة عربية كتابية واضحة ومألوفة.
- source_word: χειροποιήτοις
  choice: من صنع أيدي البشر
  rationale: يوضح أن المقصود ما أنشأه البشر بأيديهم، مع إبقاء صورة الأيدي الواردة في اللفظ اليوناني.
- source_word: ναοῖς
  choice: هياكل
  rationale: يشير اللفظ إلى أبنية مقدسة تُعد مساكن للآلهة؛ و«هياكل» أدق من «معابد» في إبراز صلة العبارة بفكرة السكن، مع بقائها مفهومة في السياق.
- source_word: κατοικεῖ
  choice: يسكن
  rationale: ينقل معنى الإقامة والسكن مباشرة، ويحافظ على المقابلة بين سكن الإله المزعوم في الهيكل وسيادة الخالق على الكون.
theological_decisions:
- issue: سموّ الله وعدم حصره في موضع تعبدي بشري
  choice: 'الإبقاء على التقرير المباشر: «لا يسكن في هياكل من صنع أيدي البشر»'
  alternative: 'التفسير التوسيعي: «لا يمكن أن تحصره المعابد»'
  rationale: النص ينفي سكن الله في الهياكل البشرية الصنع، لكنه لا يستعمل صراحة لغة الاستحالة أو الحصر؛ لذلك تُترك الدلالة اللاهوتية في صورتها النصية بلا توسيع.
- issue: دلالة اسم الفاعل ὑπάρχων
  choice: «وهو رب السماء والأرض» بوصفها جملة حالية
  alternative: «لأنه رب السماء والأرض» بوصفها تعليلًا صريحًا
  rationale: الصياغة الحالية تحفظ المرونة النحوية في الأصل ولا تحسم العلاقة على أنها سببية، وإن كان السياق يسمح بفهم الصلة المنطقية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة وقورة. استُعملت «الله» للاسم اليوناني ὁ θεός، و«هياكل» للمباني المقدسة، مع تجنب الشرح العقائدي داخل المتن. وُضع رمز الحاشية عند العبارة التي تشرحها الحاشية.
