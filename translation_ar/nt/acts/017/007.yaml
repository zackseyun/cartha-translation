source:
  edition: SBLGNT
  text: οὓς ὑποδέδεκται Ἰάσων· καὶ οὗτοι πάντες ἀπέναντι τῶν δογμάτων Καίσαρος πράσσουσι, βασιλέα ⸂ἕτερον λέγοντες⸃ εἶναι Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/007.yaml
  text: These men[a], whom Jason has welcomed, are all acting against Caesar’s decrees[c][b], saying that there is another king—Jesus.
translation:
  language: ar
  text: هؤلاء الذين استضافهم ياسون[a] يعملون جميعًا خلاف مراسيم قيصر[b]، قائلين إن هناك ملكًا آخر[c]، هو يسوع.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «آواهم» أو «قبلهم». يمكن أن يدل الفعل اليوناني على استقبال الضيوف وإكرامهم.
    reason: lexical_alternative
  - marker: b
    text: أو «قرارات قيصر» أو «أوامره الرسمية». يشير اللفظ إلى أحكام أو أوامر صادرة عن سلطة.
    reason: lexical_alternative
  - marker: c
    text: أو «ملكًا مختلفًا». يقول اليوناني «ملكًا آخر»، وفي سياق الاتهام يُقدَّم يسوع بوصفه منافسًا لسلطان قيصر.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑποδέδεκται
  choice: استضافهم
  rationale: يفيد الفعل قبول أشخاص في البيت والترحيب بهم كضيوف، وصيغة التام تُظهر أن استضافة ياسون لهم واقعة قائمة تُتخذ أساسًا للاتهام.
- source_word: ἀπέναντι
  choice: خلاف
  rationale: مع المضاف إليه يدل اللفظ على المخالفة أو المعارضة؛ و«خلاف» واضحة وملائمة لسياق الاتهام القانوني.
- source_word: δογμάτων
  choice: مراسيم
  rationale: يشير اللفظ في هذا السياق المدني الروماني إلى قرارات أو أوامر رسمية، و«مراسيم» تعبير فصيح مفهوم يحفظ الصبغة الرسمية.
- source_word: πράσσουσι
  choice: يعملون
  rationale: يحفظ الفعل معنى السلوك أو الفعل الجاري، وتؤدي «يعملون خلاف» معنى التصرف على نحو مخالف دون إثقال العبارة.
- source_word: βασιλέα ἕτερον
  choice: ملكًا آخر
  rationale: «ملك» هو المقابل المباشر لـ βασιλεύς، و«آخر» تحفظ ادعاء وجود مدّعٍ متميز للملك، بما فيه من توتر سياسي إزاء قيصر.
- source_word: λέγοντες
  choice: قائلين
  rationale: تنقل اسم الفاعل الذي يبين مضمون مخالفتهم المزعومة من غير أن تضيف نبرة تشكيك غير موجودة في النص.
- source_word: εἶναι Ἰησοῦν
  choice: إن هناك ... هو يسوع
  rationale: تعيد الصياغة العربية تركيب المصدر اليوناني بصورة طبيعية، مع إبقاء اسم يسوع في موضع التعريف الختامي البارز.
- source_word: οὗτοι πάντες
  choice: هؤلاء ... جميعًا
  rationale: تحفظ اسم الإشارة وشمول الاتهام لكل المذكورين في صياغة عربية طبيعية.
theological_decisions:
- issue: القوة السياسية للاتهام المتعلق بيسوع بوصفه ملكًا
  choice: إبقاء الاتهام صريحًا بأنهم يقولون بوجود ملك آخر هو يسوع
  alternative: تخفيف «ملك» إلى «حاكم» أو «قائد»، أو تفسير الملك تفسيرًا روحيًا داخل النص
  rationale: يربط النص الاتهام مباشرة بمراسيم قيصر ويستعمل لفظ «ملك»، لذلك تحفظ الصياغة التوتر السياسي واللاهوتي من غير أن تحسم طبيعته أو تستورد تفسيرًا مذهبيًا.
translation_notes:
  register: صياغة عربية فصحى معاصرة، واضحة وذات نبرة اتهامية رسمية تناسب المشهد القضائي. حُفظ ترتيب التعريف الختامي «هو يسوع» لإبراز الاسم، وحُفظ لفظ «ملك» لما يحمله النص من توتر سياسي ولاهوتي.
