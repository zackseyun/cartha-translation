  text: καί τινες ἐξ αὐτῶν ἐπείσθησαν καὶ προσεκληρώθησαν τῷ Παύλῳ καὶ τῷ Σιλᾷ, τῶν τε σεβομένων Ἑλλήνων ⸂πλῆθος πολὺ⸃ γυναικῶν τε τῶν πρώτων οὐκ ὀλίγαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/004.yaml
  text: And some of them were persuaded and joined Paul and Silas[a], along with a large number of the God-fearing Greeks and not a few of the leading women.
translation:
  language: ar
  text: فاقتنع بعضٌ منهم وانضمّوا إلى بولس وسيلا[a]، وانضمّ إليهما أيضًا جمهور كبير من اليونانيين المتعبّدين لله، وعدد غير قليل من النساء ذوات المكانة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، أقرب إلى الحرفية: «أُلحقوا ببولس وسيلا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τινες ἐξ αὐτῶν
  choice: بعضهم
  rationale: تعبير عربي طبيعي يحفظ دلالة التبعيض ويعود على الحاضرين في المجمع المذكورين في السياق السابق.
- source_word: ἐπείσθησαν
  choice: اقتنع
  rationale: يحفظ معنى πείθω، أي الاقتناع بما عُرض عليهم، من غير استبداله بلفظ إيماني أصرح مثل «آمن».
- source_word: προσεκληρώθησαν
  choice: انضمّوا إلى
  rationale: ينقل بوضوح معنى الارتباط ببولس وسيلا والانحياز إليهما؛ ويُذكر المعنى الأقرب إلى الصورة الحرفية في الحاشية بسبب ندرة الفعل واتصاله بفكرة النصيب أو القرعة.
- source_word: τῷ Παύλῳ καὶ τῷ Σιλᾷ
  choice: إلى بولس وسيلا
  rationale: حرف الجر «إلى» ملائم عربيًا مع «انضمّوا» وينقل علاقة الداتيف بالفعل.
- source_word: τῶν τε σεβομένων Ἑλλήνων
  choice: من اليونانيين المتعبّدين لله
  rationale: '«المتعبّدين لله» يبيّن مدلول التعبير في سياق أعمال الرسل: يونانيون من الأمم يوقّرون إله إسرائيل ويرتبطون بالعبادة اليهودية، من غير إدخال تسمية طائفية.'
- source_word: πλῆθος πολὺ
  choice: جمهور كبير
  rationale: ينقل معنى العدد الكثير بصياغة عربية واضحة، مع الحفاظ على تباينه البلاغي مع «عدد غير قليل» في العبارة التالية.
- source_word: γυναικῶν τε τῶν πρώτων
  choice: النساء ذوات المكانة
  rationale: πρῶτος هنا يدل على الوجاهة والمكانة الاجتماعية، لا على الترتيب الزمني؛ وهذه الصياغة واضحة ولا توحي بالقيادة الرسمية بالضرورة.
- source_word: οὐκ ὀλίγαι
  choice: عدد غير قليل
  rationale: يحفظ أسلوب التقليل المراد به التكثير بدل تسويته إلى «كثيرات».
- source_word: τε ... τε
  choice: وكذلك ... و
  rationale: ينقل الربط الإضافي بين اليونانيين والنساء بعد «بعضهم» بسلاسة في العربية.
theological_decisions:
- issue: هل يُترجم ἐπείσθησαν بلفظ صريح يدل على الإيمان أو التحول؟
  choice: اقتنع
  alternative: آمن
  rationale: السياق تبشيري، لكن النص يستعمل πείθω لا πιστεύω؛ لذلك تحافظ «اقتنع» على التمييز المعجمي وتترك دلالة الاستجابة الكاملة للسياق.
- issue: مدى التصريح بالهوية الدينية للعبارة σεβομένων Ἑλλήνων
  choice: اليونانيين المتعبّدين لله
  alternative: اليونانيين الأتقياء
  rationale: تجعل الصياغة متعلق العبادة واضحًا كما يقتضيه الاستعمال التاريخي في أعمال الرسل، بينما قد تكون «الأتقياء» عامة أو توحي بحكم على صفتهم الأخلاقية.
translation_notes:
  register: صياغة عربية فصحى معاصرة، واضحة ووقورة. حُفظت المقابلة بين «جمهور كبير» و«عدد غير قليل»، وتُركت دلالة الاقتناع دون تحويلها إلى مصطلح إيماني أصرح من اليونانية.
