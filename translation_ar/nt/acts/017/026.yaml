  text: ἐποίησέν τε ἐξ ⸀ἑνὸς πᾶν ἔθνος ἀνθρώπων κατοικεῖν ἐπὶ ⸂παντὸς προσώπου⸃ τῆς γῆς, ὁρίσας προστεταγμένους καιροὺς καὶ τὰς ὁροθεσίας τῆς κατοικίας αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/026.yaml
  text: And he made from one man every nation of mankind to live on the whole face of the earth[a], having determined their appointed times and the boundaries of their dwelling place[b],
translation:
  language: ar
  text: وجعل من واحدٍ كلَّ أمةٍ من البشر لتسكن على وجه الأرض كلِّه[a]، محدِّدًا الأزمنة المعيَّنة لهم[b] وحدودَ سكناهم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ بعض المخطوطات: «من دم واحد» بدلًا من «من واحد». ويتبع المتن قراءة SBLGNT: «من واحد».'
    reason: textual_variant
  - marker: b
    text: 'أو: «الأزمنة التي حُدِّدت لهم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησέν
  choice: صنع
  rationale: ينقل المعنى الواسع للفعل ποιέω من غير أن يخصّصه بالخلق من العدم أو بمجرد التسبّب.
- source_word: τε
  choice: و
  rationale: أداة ربط تصل القول بالحجة السابقة، والواو هي المقابل العربي الطبيعي.
- source_word: ἐξ ἑνὸς
  choice: من واحدٍ
  rationale: يحافظ على صياغة SBLGNT المقتضبة وعلى إبهام المرجع المضمَر، ولا يُدخل لفظ «دم» الوارد في تقليد نصي آخر.
- source_word: πᾶν ἔθνος ἀνθρώπων
  choice: كلَّ أمةٍ من البشر
  rationale: يحفظ معنى ἔθνος بوصفه أمة أو جماعة بشرية متميزة، ويبيّن أن المقصود أمم البشر جميعًا.
- source_word: κατοικεῖν
  choice: لتسكن
  rationale: صياغة عربية واضحة تعبّر عن غاية الفعل أو نتيجته وتحافظ على معنى الإقامة.
- source_word: ἐπὶ παντὸς προσώπου τῆς γῆς
  choice: على وجه الأرض كلِّه
  rationale: يحفظ التعبير الكتابي «وجه الأرض» ويؤدي شمول παντός بوضوح.
- source_word: ὁρίσας
  choice: محدِّدًا
  rationale: يحافظ على علاقة اسم الفاعل بالفعل الرئيس وعلى معنى التعيين ووضع الحدود.
- source_word: προστεταγμένους καιροὺς
  choice: الأزمنة المعيَّنة لهم
  rationale: يعكس كون الأزمنة أو الفترات قد عُيّنت، ويجعل صلتها بالأمم صريحة من السياق.
- source_word: τὰς ὁροθεσίας
  choice: حدودَ
  rationale: «حدود» هي المقابل العربي الطبيعي لمعنى تعيين النطاقات الجغرافية.
- source_word: τῆς κατοικίας αὐτῶν
  choice: سكناهم
  rationale: ينقل الاسم الدال على السكن أو الإقامة بصياغة عربية موجزة، مع بقاء الإضافة إلى الأمم.
theological_decisions:
- issue: تحديد المرجع المضمَر في ἐξ ἑνὸς
  choice: من واحدٍ
  alternative: من إنسان واحد / من سلف واحد
  rationale: النص اليوناني يقول حرفيًا «من واحد» ولا يصرّح باسم المرجع. إبقاء العبارة مقتضبة يحفظ الإبهام الحقيقي ولا يفرض تفسيرًا زائدًا، مع وضوح أن السياق يتحدث عن أصل الأمم البشرية.
- issue: القراءة النصية «دم واحد»
  choice: عدم إدخال «دم» في المتن
  alternative: من دم واحد
  rationale: لفظ «دم» غير موجود في قراءة SBLGNT المعتمدة، ولذلك يُذكر بوصفه اختلافًا نصيًا في الحاشية لا في المتن.
- issue: مدى دلالة الأزمنة والحدود على التعيين الإلهي
  choice: الأزمنة المعيَّنة لهم وحدود سكناهم
  alternative: مواسمهم وحدود أوطانهم
  rationale: تحافظ الصياغة على نسبة التعيين إلى الله من غير أن تحدد ماهية تلك الأزمنة أو تبني عليها نتيجة لاهوتية لا يصرح بها العدد.
translation_notes:
  register: فصحى معاصرة واضحة ذات نبرة كتابية رصينة. حُفظ التعبير «وجه الأرض» لكونه مفهومًا وشائعًا، واستُعملت «سكناهم» بدل تعبيرات أقدم مثل «مسكنهم» أو «تخوم مساكنهم». تظهر علامتا الحاشية [a] و[b] في المتن.
