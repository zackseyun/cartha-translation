lexical_decisions:
- source_word: λαβόντες
  choice: بعد أن أخذوا
  rationale: اسم الفاعل اليوناني بصيغة الماضي يعبّر هنا عن فعل سبق الفعل الرئيس، فتنقل العبارة ترتيب الحدثين بوضوح وطبيعية.
- source_word: τὸ ἱκανὸν
  choice: ضمانًا كافيًا
  rationale: التركيب في هذا السياق القانوني يدل على أخذ قدر كافٍ من الضمان أو التعهّد. تجمع الصياغة بين المعنى القانوني المحتمل والدلالة الحرفية على الكفاية من غير تخصيصه بكفالة ذات نظام حديث بعينه.
- source_word: παρὰ τοῦ Ἰάσονος καὶ τῶν λοιπῶν
  choice: من ياسون ومن الباقين
  rationale: تفيد παρά مع المضاف إليه المصدر، و«الباقين» تنقل معنى الأشخاص الآخرين المرتبطين بالموقف من غير زيادة تفسيرية.
- source_word: ἀπέλυσαν
  choice: أطلقوا سراحهم
  rationale: الفعل في السياق القضائي أو المدني يعني الإفراج عن المحتجزين، و«أطلقوا سراحهم» تعبير عربي واضح ودقيق.
- source_word: αὐτούς
  choice: هم
  rationale: ضمير جمع يعود إلى الأشخاص المحتجزين، وقد اتصل بالفعل في الصياغة العربية الطبيعية.
