  text: τινὲς δὲ ἄνδρες κολληθέντες αὐτῷ ἐπίστευσαν, ἐν οἷς καὶ Διονύσιος ὁ Ἀρεοπαγίτης καὶ γυνὴ ὀνόματι Δάμαρις καὶ ἕτεροι σὺν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/034.yaml
  text: But some men joined him and believed[a], among whom were also Dionysius the Areopagite, and a woman named Damaris[b], and others with them.
translation:
  language: ar
  text: لكن بعض الرجال انضمّوا إليه وآمنوا، وكان من بينهم ديونيسيوس الأريوباغي[a]، وامرأة اسمها داماريس، وآخرون معهم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي المنسوب إلى الأريوباغوس؛ وقد يعني اللقب أنه كان عضوًا في مجلس الأريوباغوس أو شخصًا مرتبطًا به.
    reason: cultural_note
lexical_decisions:
- source_word: τινὲς δὲ ἄνδρες
  choice: لكن بعض الرجال
  rationale: تحفظ العبارة معنى التباين الخفيف في δὲ ودلالة ἄνδρες المذكرة الصريحة، بصياغة عربية طبيعية.
- source_word: κολληθέντες αὐτῷ
  choice: انضمّوا إليه
  rationale: ينقل الفعل معنى الالتصاق بشخص أو الارتباط الوثيق به، والمقصود هنا انضمامهم إلى بولس وملازمتهم له.
- source_word: ἐπίστευσαν
  choice: وآمنوا
  rationale: ترجمة مباشرة للفعل من غير تعيين مفعول لم يصرّح به النص، ومن غير توسيع العبارة إلى صيغة عقائدية أشمل.
- source_word: ἐν οἷς καὶ
  choice: وكان من بينهم
  rationale: تقدّم الأشخاص المذكورين بوصفهم أمثلة من جماعة الذين آمنوا، في تركيب عربي سلس.
- source_word: Διονύσιος ὁ Ἀρεοπαγίτης
  choice: ديونيسيوس الأريوباغي
  rationale: نقل صوتي للاسم واللقب اليونانيين، مع إبقاء صلة ديونيسيوس بالأريوباغوس دون حسم طبيعتها في المتن.
- source_word: γυνὴ ὀνόματι Δάμαρις
  choice: وامرأة اسمها داماريس
  rationale: صياغة عربية واضحة تحفظ ذكر جنس الشخص واسمه.
- source_word: ἕτεροι σὺν αὐτοῖς
  choice: وآخرون معهما
  rationale: يدل الضمير اليوناني الجمع على المذكورين، لكن العربية تستعمل المثنى طبيعيًا عند الرجوع إلى ديونيسيوس وداماريس بوصفهما الاسمين السابقين مباشرة.
theological_decisions:
- issue: دلالة ἐπίστευσαν في السياق
  choice: آمنوا
  alternative: صاروا مؤمنين
  rationale: يحكي النص وقوع الإيمان استجابة لكرازة بولس، لكنه لا يصرّح هنا بمفعول الفعل ولا بصيغة عقائدية مفصلة؛ لذلك تُحفظ العبارة المباشرة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «انضمّوا إليه» بدل تعبير حرفي ثقيل مثل «التصقوا به»، وحُفظ لقب «الأريوباغي» في المتن مع شرح احتماله التاريخي في الحاشية.
