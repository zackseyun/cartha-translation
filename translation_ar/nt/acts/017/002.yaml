source:
  edition: SBLGNT
  text: κατὰ δὲ τὸ εἰωθὸς τῷ Παύλῳ εἰσῆλθεν πρὸς αὐτοὺς καὶ ἐπὶ σάββατα τρία διελέξατο αὐτοῖς ἀπὸ τῶν γραφῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/002.yaml
  text: And according to Paul's custom[a], he went in to them, and on three Sabbaths he reasoned with them from the Scriptures[c][b],
translation:
  language: ar
  text: وجريًا على عادة بولس[a]، دخل إليهم، وعلى مدى ثلاثة سبوت[b] تحاور معهم[c] انطلاقًا من الأسفار المقدسة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وكما كانت عادة بولس».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «في ثلاثة سبوت».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «ناقشهم» أو «حاجّهم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ δὲ τὸ εἰωθὸς τῷ Παύλῳ
  choice: وجريًا على عادة بولس
  rationale: ينقل التعبير الاصطلاحي معنى العادة الراسخة والممارسة المعتادة بصياغة عربية طبيعية وموجزة.
- source_word: εἰσῆλθεν πρὸς αὐτοὺς
  choice: دخل إليهم
  rationale: يحفظ معنى الدخول والاتجاه نحو الجماعة، من غير أن يصرّح بالمجمع أو باليهود، إذ يستفاد ذلك من السياق لا من ألفاظ هذه الآية نفسها.
- source_word: ἐπὶ σάββατα τρία
  choice: على مدى ثلاثة سبوت
  rationale: ينقل امتداد الفعل وتكراره خلال ثلاثة أيام سبت، مع إبقاء احتمال التعبير عنها بأنها «في ثلاثة سبوت» في الحاشية.
- source_word: διελέξατο αὐτοῖς
  choice: تحاور معهم
  rationale: الفعل يدل على مناقشة قائمة على عرض الحجج وتبادل الكلام؛ و«تحاور» يحفظ طابعه التفاعلي من غير إيحاء بخصومة.
- source_word: ἀπὸ τῶν γραφῶν
  choice: انطلاقًا من الأسفار المقدسة
  rationale: يبين أن الأسفار كانت منطلق حججه ومصدرها، ويؤدي الاستعمال اليهودي المسيحي للجمع γραφαί بعبارة عربية واضحة ذات دلالة مرجعية.
theological_decisions:
- issue: مرجع الضمير في «دخل إليهم»
  choice: إبقاء الضمير «إليهم» من غير تسمية اليهود أو المجمع في متن الآية
  alternative: دخل إلى المجمع؛ أو ذهب إلى اليهود هناك
  rationale: السياق السابق يحدد المجمع، لكن النص اليوناني هنا يستعمل ضميرًا؛ فإبقاؤه يمنع إدخال تحديد زائد ويحفظ ترابط السياق.
- issue: طبيعة نشاط بولس في διελέξατο
  choice: تحاور معهم
  alternative: ناقشهم؛ أو حاجّهم
  rationale: يحفظ الاختيار جانب التبادل والاستدلال دون أن يجعل الحديث خصومة حادة أو وعظًا أحادي الاتجاه.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «سبوت» جمعًا لـ«سبت»، و«الأسفار المقدسة» للدلالة الطبيعية على الكتابات المقدسة المعترف بها في السياق. وُضعت علامات الحواشي في المتن بحسب ترتيب ظهورها.
