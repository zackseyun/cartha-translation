  text: Σταθεὶς ⸀δὲ Παῦλος ἐν μέσῳ τοῦ Ἀρείου Πάγου ἔφη· Ἄνδρες Ἀθηναῖοι, κατὰ πάντα ὡς δεισιδαιμονεστέρους ὑμᾶς θεωρῶ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/022.yaml
  text: So Paul[a], standing in the midst of the Areopagus, said, “Men of Athens, I see that in every way you are very religious.”
translation:
  language: ar
  text: 'فوقف بولس في وسط الأريوس باغوس وقال: «يا رجال أثينا، أرى أنكم في كل شيء شديدو التديّن[a].»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أكثر تديّنًا»، وقد تُفهم أيضًا بمعنى «شديدو التطيّر والخرافة». فاللفظ اليوناني يحتمل معنى إيجابيًا أو سلبيًا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Σταθεὶς δὲ
  choice: فوقف
  rationale: ينقل اسم الفاعل الأُورِستي مع أداة الانتقال δέ بصياغة عربية سردية طبيعية، ويهيئ مشهد الخطاب من غير إثقال بترجمة حرفية مثل «وإذ كان قد وقف».
- source_word: ἐν μέσῳ τοῦ Ἀρείου Πάγου
  choice: في وسط الأريوس باغوس
  rationale: يحافظ على الدلالة المكانية الصريحة للعبارة وعلى الاسم اليوناني منقولًا صوتيًا، من غير حسم ما إذا كان المقصود المكان أو الهيئة المجتمعة فيه.
- source_word: ἔφη
  choice: وقال
  rationale: فعل قول تمهيدي طبيعي في السرد العربي، وهو الأنسب لوظيفة الفعل الناقص هنا.
- source_word: Ἄνδρες Ἀθηναῖοι
  choice: يا رجال أثينا
  rationale: يحفظ صيغة النداء ولفظ ἄνδρες المذكر، مع تعبير عربي واضح ومفهوم.
- source_word: κατὰ πάντα
  choice: في كل شيء
  rationale: ينقل شمول العبارة اليونانية بصياغة عربية موجزة وطبيعية.
- source_word: θεωρῶ
  choice: أرى
  rationale: يؤدي معنى الملاحظة والإدراك في هذا السياق بلفظ عربي مألوف.
- source_word: δεισιδαιμονεστέρους
  choice: شديدو التديّن
  rationale: صياغة عربية مفهومة تحفظ قدرًا من الانفتاح بين المدح والوصف الملتبس، وتتجنب فرض معنى «خرافيون» السلبي في المتن؛ وتُذكر البدائل في الحاشية.
theological_decisions:
- issue: نبرة وصف بولس لتديّن الأثينيين في δεισιδαιμονεστέρους
  choice: شديدو التديّن
  alternative: أكثر تديّنًا؛ شديدو التطيّر والخرافة
  rationale: اللفظ اليوناني يحتمل وصفًا إيجابيًا أو محايدًا للتديّن، كما يحتمل نقد الخرافة. ولأن افتتاح الخطاب قد يكون مقصودًا به اللباقة البلاغية مع إبقاء التباس دلالي، لم يُحسم المعنى السلبي في المتن، وأُثبتت الاحتمالات في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة خطابية كريمة. نُقل اسم Ἄρειος Πάγος صوتيًا «الأريوس باغوس» للمحافظة على الاسم اليوناني وعدم استبداله بالتسمية اللاتينية التقليدية، مع إبقاء الاحتمال قائمًا بين دلالته على الموضع ودلالته على المجلس.
