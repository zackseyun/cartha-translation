  text: All the Athenians and the foreigners staying there would spend their time in nothing else than telling or hearing something newer[a].
translation:
  language: ar
  text: أما جميع الأثينيين والأجانب النازلون فيها، فلم يكونوا يقضون وقتهم في شيء آخر سوى أن يقولوا شيئًا أحدث[a] أو أن يسمعوا شيئًا أحدث[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بتعبير عربي أكثر سلاسة: «شيئًا جديدًا». تستعمل اليونانية صيغة المقارنة «أحدث»، ولعلها تعبّر عن شغف دائم بآخر المستجدات.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀθηναῖοι δὲ πάντες
  choice: وكان جميعُ الأثينيين
  rationale: ينقل «جميع» الدالة على الشمول، وتؤدي الواو مع «كان» وظيفة الانتقال السردي الخفيف التي تؤديها δὲ دون إدخال ظرف زمني صريح.
- source_word: οἱ ἐπιδημοῦντες ξένοι
  choice: الغرباءِ المقيمين هناك
  rationale: «المقيمين هناك» تعبر عن وجود الغرباء في أثينا وإقامتهم فيها، من غير أن تفترض إقامة دائمة.
- source_word: εἰς οὐδὲν ἕτερον ηὐκαίρουν
  choice: لا يقضون وقتهم في شيء آخر
  rationale: صياغة عربية طبيعية تحفظ معنى انشغالهم المعتاد بهذا الأمر دون غيره، كما يعكس المضارع سياق الفعل اليوناني الناقص الدال على العادة.
- source_word: ἢ λέγειν τι ἢ ἀκούειν
  choice: سوى قول شيء ... أو سماعه
  rationale: تحافظ الصياغة على التوازي بين القول والسماع وعلى ارتباطهما بالشيء المذكور.
- source_word: καινότερον
  choice: أحدث
  rationale: يحفظ صيغة المقارنة في اليونانية بدل تسويتها إلى الصفة المجردة «جديد»، مع إيضاح البديل الاصطلاحي في الحاشية.
