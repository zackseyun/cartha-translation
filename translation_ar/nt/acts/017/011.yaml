source:
  edition: SBLGNT
  text: οὗτοι δὲ ἦσαν εὐγενέστεροι τῶν ἐν Θεσσαλονίκῃ, οἵτινες ἐδέξαντο τὸν λόγον μετὰ πάσης προθυμίας, ⸀τὸ καθ’ ἡμέραν ἀνακρίνοντες τὰς γραφὰς εἰ ἔχοι ταῦτα οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/011.yaml
  text: These were more noble-minded than those in Thessalonica[a], for they received the word with all eagerness[b], examining the Scriptures daily to see whether these things were so.
translation:
  language: ar
  text: وكان هؤلاء أنبلَ فكرًا من الذين في تسالونيكي[a]، إذ قبلوا الكلمة بكل حماسة[b]، وكانوا يفحصون الكتب كل يوم ليتحققوا هل هذه الأمور هكذا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أنبل». قد تشير الكلمة اليونانية إلى خُلُق أجدر بالمدح، أو إلى مكانة اجتماعية أرفع، وهو احتمال أضعف هنا.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «رحبوا بالرسالة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐγενέστεροι
  choice: أنبلَ فكرًا
  rationale: 'تحتمل الكلمة النبل في الخُلُق أو المكانة الاجتماعية، لكن ما يليها يشرح صفة محمودة في موقفهم: قبولهم المتحمس وفحصهم للكتب. وتحافظ الصياغة على معنى النبل دون الإيحاء أساسًا بنسب أرستقراطي.'
- source_word: οἵτινες
  choice: إذ
  rationale: تُدخل العبارة وصفًا تفسيريًا يبيّن وجه كونهم أنبل فكرًا، و«إذ» تؤدي هذا المعنى طبيعيًا في العربية.
- source_word: ἐδέξαντο τὸν λόγον
  choice: قبلوا الكلمة
  rationale: صياغة قريبة من الأصل وتحفظ الصدى السردي واللاهوتي لكلمة λόγος في سفر الأعمال، من غير تحويلها في المتن إلى تفسير أضيق مثل «الرسالة».
- source_word: μετὰ πάσης προθυμίας
  choice: بكل حماسة
  rationale: تعبر عن الاستعداد والرغبة المتقدة، وتنقل قوة πάσης بوصفها أداة تكثيف.
- source_word: τὸ καθ’ ἡμέραν
  choice: كل يوم
  rationale: تؤدي الاستعمال الظرفي وتوضح الاستمرار الاعتيادي بلغة عربية طبيعية.
- source_word: ἀνακρίνοντες
  choice: يفحصون
  rationale: تنقل معنى البحث والتدقيق، بما فيه مسحة الفحص التحقيقي، من غير اصطلاح تقني زائد.
- source_word: τὰς γραφὰς
  choice: الكتب
  rationale: يشير الجمع المعرّف في هذا السياق إلى الأسفار المقدسة اليهودية، و«الكتب» تعبير كتابي عربي مألوف يحفظ صيغة الجمع.
- source_word: εἰ ἔχοι ταῦτα οὕτως
  choice: ليتحققوا هل هذه الأمور هكذا
  rationale: تحفظ العبارة صيغة الاستفهام غير المباشر ومعنى اختبار الأقوال على ضوء الكتب، من غير استبدال «هكذا» بحكم تفسيري مباشر مثل «صحيحة».
theological_decisions:
- issue: دلالة εὐγενέστεροι في السياق
  choice: 'صفة محمودة في الفكر والموقف: «أنبل فكرًا»'
  alternative: أنبل نسبًا أو أرفع مكانة اجتماعية
  rationale: يشرح السياق نبلهم بقبول الكلمة بحماسة وفحص الكتب، مع بقاء احتمال الدلالة الاجتماعية مذكورًا في الحاشية بدل إلغائه.
- issue: ترجمة λόγος
  choice: الإبقاء على «الكلمة» في المتن
  alternative: «الرسالة»
  rationale: تحفظ «الكلمة» التعبير اليوناني والصدى الكتابي في سفر الأعمال، ولا تضيف تحديدًا عقائديًا غير موجود في الأصل.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُعمل «أنبل فكرًا» لتجنب إيحاء طبقي غير مرجح، و«الكتب» للإشارة إلى الأسفار المقدسة في السياق. أُبقيت «هكذا» حفاظًا على صياغة الأصل المفتوحة، وأضيف «ليتحققوا» لإظهار غرض الفحص طبيعيًا في العربية.
