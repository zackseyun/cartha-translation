  text: ⸂ζηλώσαντες δὲ οἱ Ἰουδαῖοι καὶ προσλαβόμενοι⸃ τῶν ἀγοραίων ⸂ἄνδρας τινὰς⸃ πονηροὺς καὶ ὀχλοποιήσαντες ἐθορύβουν τὴν πόλιν, ⸂καὶ ἐπιστάντες⸃ τῇ οἰκίᾳ Ἰάσονος ἐζήτουν αὐτοὺς ⸀προαγαγεῖν εἰς τὸν δῆμον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/005.yaml
  text: But the Jews[a], becoming jealous and taking along some wicked men from the marketplace, formed a mob and were throwing the city into an uproar; and coming to Jason’s house, they were seeking to bring them out to the assembly.
translation:
  language: ar
  text: لكن اليهود غاروا، فضمّوا إليهم بعض الرجال الأشرار من أهل السوق، وجمعوا حشدًا غوغائيًا، وأخذوا يثيرون الاضطراب في المدينة. ثم أتوا إلى بيت ياسون، وكانوا يطلبون إخراجهم إلى اجتماع الشعب[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إلى المجلس العام» أو «أمام الشعب». تشير الكلمة اليونانية إلى هيئة المواطنين المجتمعة علنًا، لا إلى حشد غير محدد فحسب.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ζηλώσαντες
  choice: غاروا
  rationale: ينقل الفعل دافع الغيرة الذي سبق الأفعال التالية، من غير أن يحصره في معنى الحسد وحده.
- source_word: οἱ Ἰουδαῖοι
  choice: اليهود
  rationale: يحافظ على اللفظ اليوناني كما هو؛ والسياق يدل على جماعة معينة من يهود تسالونيكي، لا على جميع اليهود في كل مكان.
- source_word: προσλαβόμενοι
  choice: ضمّوا إليهم
  rationale: يعكس صيغة الوسط ومعنى اتخاذ أشخاص آخرين معهم، من غير افتراض استئجار رسمي.
- source_word: τῶν ἀγοραίων
  choice: من أهل السوق
  rationale: يدل على رجال مرتبطين بالسوق أو الساحة العامة، وهو تعبير عربي واضح لا يضيف وصف البطالة غير المصرح به.
- source_word: ἄνδρας τινὰς πονηρούς
  choice: بعض الرجال الأشرار
  rationale: يحفظ دلالة ἄνδρας على الرجال والوصف الأخلاقي السلبي في πονηρούς.
- source_word: ὀχλοποιήσαντες
  choice: كوّنوا حشدًا غوغائيًا
  rationale: ينقل معنى صنع حشد أو تجميعه، مع الإيحاء العدائي والاضطرابي الذي يقتضيه السياق.
- source_word: ἐθορύβουν τὴν πόλιν
  choice: أخذوا يثيرون الاضطراب في المدينة
  rationale: صيغة «أخذوا» تعكس الاستمرار في الفعل الناقص، والعبارة تنقل معنى إثارة الجلبة والفتنة العامة.
- source_word: ἐπιστάντες τῇ οἰκίᾳ Ἰάσονος
  choice: أتوا إلى بيت ياسون
  rationale: يناسب معنى الوصول أو المجيء إلى المكان في تسلسل السرد، ولا يبالغ بترجمته «هاجموا».
- source_word: ἐζήτουν
  choice: كانوا يطلبون
  rationale: يحفظ الاستمرار ويترك مفتوحًا ما إذا كان التركيز على البحث عنهم أو محاولة إخراجهم.
- source_word: αὐτοὺς
  choice: هم
  rationale: يحافظ على الضمير الجمع كما في اليونانية، بدل استبداله بتحديد تفسيري مثل بولس وسيلا.
- source_word: προαγαγεῖν
  choice: إخراجهم
  rationale: يناسب سياق البيت ويفيد اقتيادهم إلى الخارج أو إحضارهم إلى الأمام.
- source_word: εἰς τὸν δῆμον
  choice: إلى مجلس الشعب
  rationale: ينقل الدلالة المدنية المؤسسية لـ δῆμος بوصفه هيئة الشعب المجتمعة علنًا، لا مجرد جمهور غير محدد.
theological_decisions:
- issue: ترجمة οἱ Ἰουδαῖοι في سياق نزاع
  choice: اليهود
  alternative: زعماء اليهود؛ اليهوديون
  rationale: تتبع الترجمة لفظ المصدر من غير تضييقه إلى الزعماء أو توسيعه إلى حكم عام؛ ويحدد السياق أن المقصود جماعة بعينها في تسالونيكي.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُخدم «مجلس الشعب» لإظهار الطابع المدني لـ δῆμος، ووُضع هامش يثبت البدائل الممكنة. حُفظ ضمير الجمع في «إخراجهم» كما في المصدر، كما حُفظت الإشارة المباشرة إلى «اليهود» مع عدم إدخال تخصيص تفسيري في المتن.
