  text: Ἐν δὲ ταῖς Ἀθήναις ἐκδεχομένου αὐτοὺς τοῦ Παύλου, παρωξύνετο τὸ πνεῦμα αὐτοῦ ἐν αὐτῷ ⸀θεωροῦντος κατείδωλον οὖσαν τὴν πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/016.yaml
  text: While Paul was waiting for them in Athens[b][a], his spirit was provoked within him as he saw that the city was full of idols.
translation:
  language: ar
  text: وبينما كان بولس ينتظرهم في أثينا، ثارت روحه في داخله[a] إذ رأى المدينة مملوءةً بالأصنام[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «اضطربت روحه في داخله» أو «استُثيرت روحه»؛ فالفعل اليوناني يدل على انفعال داخلي حاد.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «غارقةً في الأصنام».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκδεχομένου
  choice: كان بولس ينتظرهم
  rationale: ينقل اسم الفاعل في تركيب المضاف إليه بوصفه ظرفًا زمنيًا، ويحفظ معنى الانتظار المستمر بصياغة عربية طبيعية.
- source_word: παρωξύνετο
  choice: احتدَّت
  rationale: ينقل الانفعال الداخلي الحاد الذي يدل عليه الفعل، مع مراعاة دلالة الماضي الناقص على الحالة المتواصلة، من غير قصر المعنى على الحزن وحده.
- source_word: τὸ πνεῦμα αὐτοῦ
  choice: روحه
  rationale: ترجمة مباشرة للتركيب الإضافي، وتشير في السياق إلى روح بولس أو كيانه الداخلي دون إضافة إحالة صريحة إلى الروح القدس.
- source_word: ἐν αὐτῷ
  choice: في داخله
  rationale: يحفظ توكيد موضع الانفعال في باطن بولس بصياغة عربية واضحة.
- source_word: θεωροῦντος
  choice: إذ رأى
  rationale: ينقل الإدراك البصري المتزامن مع انفعاله بإيجاز طبيعي، مع بقاء معنى المعاينة حاضرًا.
- source_word: κατείδωλον
  choice: مملوءةً بالأصنام
  rationale: يؤدي معنى الصفة التي تصف المدينة بكثرة الأصنام وانتشارها، وهو أوضح من صياغة قد توحي بإرادة المدينة أو استسلامها.
- source_word: πόλιν
  choice: المدينة
  rationale: يحفظ اللفظ اليوناني الصريح مع وضوح عودته إلى أثينا المذكورة قبلًا.
- source_word: δὲ
  choice: وبينما
  rationale: أُدمجت قوة الانتقال السردي في الربط العربي الطبيعي دون إدخال ظرف زمان مستقل لا يقابله لفظ صريح في المصدر.
theological_decisions:
- issue: مرجع «روحه»
  choice: روح بولس أو كيانه الداخلي
  alternative: إشارة إلى تحريك الروح القدس له
  rationale: الإضافة في τὸ πνεῦμα αὐτοῦ وعبارة ἐν αὐτῷ تدلان مباشرة على استجابة بولس الباطنية. لا تنسب الآية هذا الانفعال صراحةً إلى الروح القدس، لذلك لا تضيف الترجمة هذا التحديد.
- issue: طبيعة انفعال بولس
  choice: انفعال داخلي حاد
  alternative: الحزن وحده أو الغضب وحده
  rationale: الفعل παρωξύνετο أوسع من حصره في عاطفة واحدة؛ لذلك اختير «احتدّت» مع حاشية تحفظ بدائل مثل الاضطراب والاستثارة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «احتدّت روحه» للمحافظة على قوة الانفعال في الأصل، وأُثبتت الحواشي بعد الألفاظ التي تشرحها مباشرةً. لم تُضف نسبة هذا الانفعال إلى الروح القدس، كما لم تُحصر دلالته في الحزن أو الغضب وحدهما.
