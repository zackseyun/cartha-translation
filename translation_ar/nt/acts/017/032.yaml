  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Ἀκούσαντες δὲ ἀνάστασιν νεκρῶν οἱ μὲν ἐχλεύαζον οἱ δὲ εἶπαν Ἀκουσόμεθά σου ⸂περὶ τούτου καὶ πάλιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/032.yaml
  text: When they heard of the resurrection of the dead[a], some mocked, but others said, “We will hear you again about this.”
translation:
  language: ar
  text: 'فَلَمَّا سَمِعُوا عَنْ قِيَامَةِ الْأَمْوَاتِ، سَخِرَ بَعْضُهُمْ، أَمَّا آخَرُونَ فَقَالُوا: «سَنَسْتَمِعُ إِلَيْكَ فِي هَذَا مَرَّةً أُخْرَى».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀκούσαντες δὲ
  choice: فَلَمَّا سَمِعُوا
  rationale: ينقل اسم الفاعل الماضي بوصفه ظرفًا زمنيًا، مع وصل سردي طبيعي من غير إضافة لفظ يدل صراحة على «الآن».
- source_word: ἀνάστασιν νεκρῶν
  choice: قِيَامَةِ الْأَمْوَاتِ
  rationale: تعبير عربي واضح يحفظ الدلالة العامة للعبارة اليونانية على قيامة الموتى، من غير حصرها في صياغة عقائدية أضيق.
- source_word: οἱ μὲν ... οἱ δὲ
  choice: بَعْضُهُمْ ... أَمَّا آخَرُونَ فَـ
  rationale: يحفظ التقابل الصريح بين فئتين من السامعين بأسلوب عربي طبيعي.
- source_word: ἐχλεύαζον
  choice: سَخِرَ
  rationale: ينقل رد فعل الفئة الأولى مباشرة. لا تُضاف دلالة البدء لأن صيغة الماضي الناقص اليونانية قد تدل على الاستمرار أو الخلفية، ولا تلزم منها بداية الفعل.
- source_word: Ἀκουσόμεθά σου
  choice: سَنَسْتَمِعُ إِلَيْكَ
  rationale: الفعل مع ضمير المجرور يدل على الإصغاء إلى شخص؛ و«نستمع إليك» أفصح وأوضح في العربية المعاصرة من النقل الحرفي «نسمعك».
- source_word: περὶ τούτου καὶ πάλιν
  choice: فِي هَذَا مَرَّةً أُخْرَى
  rationale: يحفظ موضوع الاستماع والقوة الصريحة لـ καὶ πάλιν، أي الاستماع مرة أخرى في شأن هذا الأمر، بصياغة عربية غير متكلفة.
theological_decisions:
- issue: دلالة عبارة قيامة الأموات في سياق جمهور غير يهودي
  choice: قِيَامَةِ الْأَمْوَاتِ
  alternative: القيامة من بين الأموات
  rationale: الصياغة المختارة تحافظ على المعنى التصنيفي الطبيعي للعبارة اليونانية، أي قيامة الموتى، ولا تحسم ما إذا كان المقصود هنا قيامة عامة أو خروج شخص بعينه من بين الموتى بما يتجاوز لفظ الآية.
translation_notes:
  register: لغة عربية فصحى معاصرة، واضحة ووقورة. استُخدم التقابل «بعضهم... أما آخرون» لإبراز البنية اليونانية، وأُثبت معنى «مرة أخرى» في المتن نفسه، لذلك لا حاجة إلى حاشية.
