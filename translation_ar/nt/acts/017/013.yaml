source:
  edition: SBLGNT
  text: ὡς δὲ ἔγνωσαν οἱ ἀπὸ τῆς Θεσσαλονίκης Ἰουδαῖοι ὅτι καὶ ἐν τῇ Βεροίᾳ κατηγγέλη ὑπὸ τοῦ Παύλου ὁ λόγος τοῦ θεοῦ, ἦλθον κἀκεῖ σαλεύοντες ⸂καὶ ταράσσοντες⸃ τοὺς ὄχλους.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/013.yaml
  text: But when the Jews from Thessalonica learned that the word of God had been proclaimed by Paul in Berea also[a], they came there too[b], stirring up and troubling the crowds.
translation:
  language: ar
  text: لكن لما علم اليهود القادمين من تسالونيكي أن كلمة الله قد أُعلنت في بيرية أيضًا على يد بولس، جاءوا إلى بيرية أيضًا، مهيّجين الجموع ومثيرين فيها الاضطراب.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς δὲ
  choice: لكن لما
  rationale: تنقل δέ بوصفها انتقالًا فيه مقابلة خفيفة مع استقبال أهل بيرية، وتؤدي ὡς هنا معنى الزمن بعبارة عربية طبيعية.
- source_word: ἔγνωσαν
  choice: علم
  rationale: يفيد الفعل هنا وصول خبر إليهم أو معرفتهم بأمر جديد، لا مجرد امتلاك معرفة سابقة.
- source_word: οἱ ἀπὸ τῆς Θεσσαλονίκης Ἰουδαῖοι
  choice: اليهود الذين من تسالونيكي
  rationale: يحدد جماعة بعينها بحسب موطنها، من غير تعميم الحكم على اليهود جميعًا.
- source_word: ὅτι καὶ ἐν τῇ Βεροίᾳ
  choice: أن ... في بيرية أيضًا
  rationale: تجعل «أيضًا» بيرية موضعًا إضافيًا وصل إليه الإعلان، كما يقتضي καί.
- source_word: κατηγγέλη
  choice: قد نادى بها
  rationale: يحافظ على المبني للمجهول في اليونانية من خلال إسناد الفعل إلى كلمة الله مع التصريح ببولس فاعلًا دلاليًا، ويعبّر عن الإعلان العلني بلفظ عربي واضح.
- source_word: ὑπὸ τοῦ Παύλου
  choice: بولس
  rationale: يُذكر بولس بوصفه القائم بالإعلان وفق دلالة ὑπό مع المضاف إليه في البناء للمجهول.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: كلمة الله
  rationale: صياغة كتابية عربية مألوفة تحفظ الرنين اللاهوتي للعبارة من غير حصر λόγος في معنى تفسيري أضيق مثل «الرسالة».
- source_word: ἦλθον κἀκεῖ
  choice: جاءوا إلى هناك أيضًا
  rationale: تنقل κἀκεῖ معنى امتداد مجيئهم ومعارضتهم إلى ذلك الموضع كذلك.
- source_word: σαλεύοντες
  choice: يهيّجون
  rationale: في سياق الجموع يدل الفعل على تحريك الناس وإثارة سخطهم أو قلقهم، لا على الاهتزاز الحرفي.
- source_word: καὶ ταράσσοντες
  choice: ويثيرون اضطرابها
  rationale: يحفظ الفعل الثاني بوصفه معنى متداخلًا لكنه مكثف للصورة، إذ يشير إلى إحداث البلبلة والاضطراب.
- source_word: τοὺς ὄχλους
  choice: الجموع
  rationale: لفظ محايد ودقيق للجماعات المحتشدة، ولا يبالغ بوصفها غوغاء.
theological_decisions:
- issue: ترجمة ὁ λόγος τοῦ θεοῦ
  choice: كلمة الله
  alternative: رسالة الله
  rationale: تحفظ الصياغة المألوفة وسعتها اللاهوتية بوصفها ما يُعلَن من الله، من غير فرض معنى اصطلاحي لاحق أو تضييقها إلى «رسالة» فقط.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت «لما» للسرد الزمني، و«ينادي بـ» للإعلان العلني. لا تحتاج الآية إلى حاشية عربية؛ فالفعل «قد نادى بها» يؤدي السابقة الزمنية طبيعيًا، والفعلان الختاميان ظلا متميزين في النص.
