source:
  edition: SBLGNT
  text: διερχόμενος γὰρ καὶ ἀναθεωρῶν τὰ σεβάσματα ὑμῶν εὗρον καὶ βωμὸν ἐν ᾧ ἐπεγέγραπτο· Ἀγνώστῳ θεῷ. ⸀ὃ οὖν ἀγνοοῦντες εὐσεβεῖτε, ⸀τοῦτο ἐγὼ καταγγέλλω ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/023.yaml
  text: For as I was passing through and observing your objects of worship[a], I even found an altar on which had been inscribed, ‘To an unknown god.’ Therefore[b], what you worship in ignorance—this I proclaim to you.
translation:
  language: ar
  text: 'فإني، إذ كنت أمرّ وأتأمل معبوداتكم[a]، وجدت أيضًا مذبحًا نُقش عليه: «لإلهٍ مجهول».[b] فما تعبدونه وأنتم تجهلونه، هذا ما أعلنه لكم.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «الأشياء التي توقّرونها دينيًا». اللفظ اليوناني واسع، وقد يشمل الأشياء أو المعالم المرتبطة بالعبادة.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا: «للإله المجهول». لا توجد أداة تعريف في النقش اليوناني، ولذلك تحتمل العبارة التنكير، كما تحتمل التعريف في الصياغة العربية الاصطلاحية.'
    reason: lexical_alternative
  - marker: c
    text: 'يمكن أيضًا: «فالذي تعبدونه من غير أن تعرفوه». غير أن اليونانية تستعمل اسم موصول محايدًا، أي «ما»، لا صيغة تدل صراحةً على شخص.'
    reason: alternative_reading
lexical_decisions:
- source_word: διερχόμενος
  choice: بينما كنت أمرّ بينكم
  rationale: ينقل اسم الفاعل المضارع بوصفه فعلًا جاريًا في الزمن، ويُفهم من السياق أن بولس كان يجتاز المدينة وبين أهلها.
- source_word: ἀναθεωρῶν
  choice: وأتأمل
  rationale: يفيد النظر المتأني باهتمام، لا مجرد الرؤية العابرة.
- source_word: τὰ σεβάσματα ὑμῶν
  choice: معبوداتكم
  rationale: تعبير عربي موجز يشمل ما يتوجهون إليه بالتوقير والتعبد، مع بيان سعة اللفظ اليوناني في الحاشية.
- source_word: βωμὸν
  choice: مذبحًا
  rationale: المقابل العربي المألوف للمذبح المخصص للشعائر الدينية.
- source_word: ἐπεγέγραπτο
  choice: نُقش عليه
  rationale: يناسب كتابة عبارة إهدائية على مذبح، ويحفظ صيغة المبني للمجهول.
- source_word: Ἀγνώστῳ θεῷ
  choice: لِإِلَهٍ مَجْهُولٍ
  rationale: يحافظ على غياب أداة التعريف في اليونانية ويأتي طبيعيًا بوصفه نقشًا إهدائيًا عربيًا.
- source_word: ὃ οὖν
  choice: فما
  rationale: تحفظ «ما» حياد اسم الموصول اليوناني، وتؤدي الفاء قوة الاستنتاج في οὖν.
- source_word: ἀγνοοῦντες
  choice: وأنتم تجهلونه
  rationale: ينقل الحال المصاحبة للعبادة، ويحافظ على الصلة البلاغية بين «مجهول» و«تجهلونه».
- source_word: εὐσεβεῖτε
  choice: تعبدونه
  rationale: يوضح فعل التعبد والتوقير الديني المقصود في السياق.
- source_word: καταγγέλλω
  choice: أعلنه لكم
  rationale: ينقل معنى الإعلان العلني الواثق من غير إضافة دلالة ليست لازمة، مثل البشارة.
theological_decisions:
- issue: مرجع اسم الموصول المحايد ὃ
  choice: فما تعبدونه وأنتم تجهلونه
  alternative: فالذي تعبدونه من غير أن تعرفوه
  rationale: اختيرت «ما» للمحافظة على الصيغة المحايدة في اليونانية، فلا يُحوَّل المرجع صراحةً إلى شخص قبل أن يقدمه بولس في خطابه.
- issue: طبيعة صلة الأثينيين بالإله الذي سيعلنه بولس
  choice: صياغة تحفظ مفارقة أنهم يتعبدون لما يجهلونه
  alternative: صياغة تصرح بأنهم يعبدون الله نفسه من غير أن يعرفوه
  rationale: النص يبدأ من نقش المذبح ويقيم صلة بلاغية، لكنه لا يحسم هنا وحده كل ما تعنيه تلك العبادة لاهوتيًا؛ لذلك لم تُضف صياغة شخصية أو إقرار عقائدي أقوى من الأصل.
translation_notes:
  register: العربية فصحى حديثة واضحة ذات نبرة خطابية كريمة. حُفظ التوازي البلاغي بين «مجهول» و«تجهلونه»، واستُعملت «ما» لصون الغموض المقصود في اسم الموصول اليوناني. وُضعت جميع علامات الحواشي في المتن.
