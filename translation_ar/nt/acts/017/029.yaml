  source_fidelity: يحفظ المسودّة الاستنتاج السببي، وكون البشر من γένος الله، والنهي عن تشبيه τὸ θεῖον بمصنوعات البشر. لكن «اللاهوت» مصطلح تقني لاحق ذو حمولة كلامية/مسيحية خاصة، وقد يوحي بعلم اللاهوت أو بجوهر ميتافيزيقي محدد، فلا ينقل اتساع τὸ θεῖον في هذا المقام بأمان. كما أن «أي منحوتة» تجعل «منحوتة» تفسيرًا استئنافيًا غير دقيق لعلاقة χαράγματι بمواد الذهب والفضة والحجر.
