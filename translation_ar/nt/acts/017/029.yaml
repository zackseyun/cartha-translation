  text: γένος οὖν ὑπάρχοντες τοῦ θεοῦ οὐκ ὀφείλομεν νομίζειν χρυσῷ ἢ ἀργύρῳ ἢ λίθῳ, χαράγματι τέχνης καὶ ἐνθυμήσεως ἀνθρώπου, τὸ θεῖον εἶναι ὅμοιον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/029.yaml
  text: Therefore[a], since we are God’s offspring, we ought not to think that the Divine Being is like gold or silver or stone[b], an image formed by human skill and imagination.
translation:
  language: ar
  text: وبما أننا من نسل الله، لا ينبغي لنا أن نظن أن ما هو إلهي[a] يشبه ذهبًا أو فضةً أو حجرًا نُقشَت فيه صورةٌ صنعتها مهارة الإنسان وتفكيره.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الذات الإلهية»، أو «الطبيعة الإلهية»، أو «الإله». اللفظ اليوناني تعبير واسع لما هو إلهي؛ ويشير هنا، في حجة بولس، إلى الإله الحق.
    reason: lexical_alternative
  - marker: b
    text: أو «صورة منحوتة»، أو «شيئًا محفورًا».
    reason: lexical_alternative
lexical_decisions:
- source_word: γένος
  choice: نسل
  rationale: ينقل معنى الانتماء والصدور المقصود في السياق، من غير أن يحصره في عِرق أو أسرة بالمعنى الضيق.
- source_word: οὖν
  choice: فـ
  rationale: تربط الاستنتاج بما سبقه ربطًا طبيعيًا وموجزًا في العربية.
- source_word: ὑπάρχοντες
  choice: بما أننا
  rationale: يفيد اسم الفاعل هنا معنى سببيًا؛ فالنتيجة مبنية على كون البشر من نسل الله.
- source_word: οὐκ ὀφείλομεν νομίζειν
  choice: لا ينبغي لنا أن نظن
  rationale: يحفظ معنى الواجب أو الملاءمة الأخلاقية والفكرية، مع تعبير عربي واضح.
- source_word: χρυσῷ ἢ ἀργύρῳ ἢ λίθῳ
  choice: ذهبًا أو فضةً أو حجرًا
  rationale: يحافظ على المواد الثلاث وترتيبها كما في اليونانية.
- source_word: χαράγματι
  choice: منحوتةً
  rationale: يدل اللفظ على شيء منقوش أو محفور أو مصنوع، و«منحوتة» واضحة في سياق الأصنام.
- source_word: τέχνης καὶ ἐνθυμήσεως ἀνθρώπου
  choice: صاغتها مهارة الإنسان وتصوّره
  rationale: تعبّر «مهارة» عن الحرفة الفنية، و«تصوّره» عن الفكرة أو التصميم الذهني الكامن وراء العمل.
- source_word: τὸ θεῖον
  choice: اللاهوت
  rationale: مصطلح عربي موجز لما هو إلهي أو للذات الإلهية، ويحافظ على الصياغة الفلسفية العامة في خطاب بولس دون أن يجعلها قوة غير شخصية.
theological_decisions:
- issue: دلالة τὸ θεῖον في خطاب توحيدي ذي صياغة فلسفية
  choice: اللاهوت
  alternative: الذات الإلهية؛ الطبيعة الإلهية؛ ما هو إلهي
  rationale: «اللاهوت» يحفظ اتساع التعبير اليوناني وإشارته في حجة بولس إلى الإله الحق، من غير فرض تحديد ميتافيزيقي أضيق. وتوضح الحاشية البدائل الممكنة.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ووقورة. استُخدمت «فبما أننا» لإظهار الاستنتاج والسبب معًا، وحُفظ التوتر بين التعبير الفلسفي العام والإشارة السياقية إلى الله الحق.
