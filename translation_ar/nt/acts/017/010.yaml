source:
  edition: SBLGNT
  text: Οἱ δὲ ἀδελφοὶ εὐθέως ⸀διὰ νυκτὸς ἐξέπεμψαν τόν τε Παῦλον καὶ τὸν Σιλᾶν εἰς Βέροιαν, οἵτινες παραγενόμενοι εἰς τὴν συναγωγὴν ⸂τῶν Ἰουδαίων ἀπῄεσαν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/010.yaml
  text: Then the brothers immediately sent both Paul and Silas away by night to Berea[a], and when they arrived[c][b], they went into the synagogue of the Jews.
translation:
  language: ar
  text: فأرسل الإخوة[a] فورًا بولس وسيلا كليهما ليلًا[b] إلى بيرية. ولما وصلا، دخلا مجمع اليهود[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «الإخوة والأخوات»؛ فاللفظ اليوناني هو «الإخوة»، وقد يشير إلى جماعة المؤمنين الأوسع.'
    reason: lexical_alternative
  - marker: b
    text: 'أي: «في أثناء الليل».'
    reason: lexical_alternative
  - marker: c
    text: 'يمكن أيضًا: «المجمع اليهودي».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδελφοὶ
  choice: الإخوة
  rationale: يحافظ على صيغة الجمع المذكر وعلى دلالة القرابة الإيمانية في الجماعة، مع بيان احتمال الشمول في الحاشية.
- source_word: εὐθέως
  choice: فورًا
  rationale: تعبير عربي واضح وطبيعي ينقل معنى المبادرة العاجلة.
- source_word: διὰ νυκτός
  choice: ليلًا
  rationale: ينقل الدلالة الزمنية للتركيب اليوناني بإيجاز، أي أن الإرسال جرى في أثناء الليل.
- source_word: ἐξέπεμψαν
  choice: أرسل
  rationale: يفيد إخراج بولس وسيلا وإرسالهما إلى موضع آخر؛ ويتضح معنى الابتعاد من السياق والوجهة المذكورة.
- source_word: τόν τε Παῦλον καὶ τὸν Σιλᾶν
  choice: بولس وسيلا كليهما
  rationale: يمثل القوة الترابطية في τε ... καί، التي تؤكد شمول الشخصين بالفعل.
- source_word: Βέροιαν
  choice: بيرية
  rationale: نقل عربي متداول لاسم المدينة اليوناني Βέροια.
- source_word: οἵτινες παραγενόμενοι
  choice: ولما وصلا
  rationale: صياغة سردية عربية طبيعية تحفظ العلاقة الزمنية واستمرار الخبر عن بولس وسيلا.
- source_word: συναγωγὴν τῶν Ἰουδαίων
  choice: مجمع اليهود
  rationale: ترجمة شفافة للتركيب الإضافي، والمقصود مجمع الجماعة اليهودية المحلية دون إيحاء تقويمي.
- source_word: ἀπῄεσαν
  choice: دخلا
  rationale: مع عبارة الاتجاه إلى المجمع، ينقل الفعل في العربية حركة الذهاب إلى داخله بصورة طبيعية، مع مطابقة الفاعل المثنى.
theological_decisions:
- issue: دلالة ἀδελφοὶ في سياق جماعة قد تضم رجالًا ونساءً
  choice: الإخوة
  alternative: الإخوة والأخوات؛ المؤمنون
  rationale: أُبقيت الصيغة المذكرة الظاهرة في اليونانية دون حصر المقصود في الرجال؛ وأُثبت احتمال شمول الجماعة المؤمنة الأوسع في الحاشية.
- issue: صياغة τῶν Ἰουδαίων
  choice: مجمع اليهود
  alternative: المجمع اليهودي
  rationale: تحافظ الإضافة على بنية الأصل وتعرّف المجمع من جهة الجماعة المحلية، ولا تحمل في السياق حكمًا لاهوتيًا أو سلبيًا على اليهود.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة سردية رصينة. وُضعت علامات الحواشي بجوار الألفاظ التي تشرحها، وحُفظ التتابع السريع للأحداث دون إثقال العبارة بحرفية يونانية غير طبيعية.
