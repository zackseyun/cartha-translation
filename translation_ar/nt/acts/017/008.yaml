lexical_decisions:
- source_word: ἐτάραξαν
  choice: أقلقوا
  rationale: يفيد الفعل إحداث الاضطراب أو القلق، وهذه الصياغة طبيعية وتصلح للجمع وللمسؤولين من غير مبالغة في درجة الاضطراب.
- source_word: δὲ
