- source_word: τὸν ὄχλον
  choice: الجمعَ
  rationale: ينقل معنى جماعة الناس المحتشدة بلفظ عربي فصيح ومحايد، من غير إيحاء العنف الذي قد يحمله لفظ «الغوغاء».
- source_word: τοὺς πολιτάρχας
  choice: المسؤولين في المدينة
  rationale: لقب مدني مقدوني محلي؛ تنقل العبارة وظيفته العامة بوضوح، من غير حصره في منصب قضائي بعينه.
- source_word: ἀκούοντας ταῦτα
  choice: حين سمعوا هذه الأمور
  rationale: تُفهم صيغة اسم الفاعل هنا زمنيًا، وهي راجعة إلى الجمع والمسؤولين معًا، كما يحفظ «هذه الأمور» جمع ταῦτα.
