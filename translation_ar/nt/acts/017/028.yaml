  source_fidelity: 'الترجمة دقيقة في البنية الأساسية: «فيه» لـἐν αὐτῷ، و«نحيا ونتحرّك ونوجد» تقابل الأفعال الثلاثة، و«من نسله» تؤدي γένος في الاقتباس. لكن «أيضًا» في «كما قال أيضًا بعض شعرائكم» لا تُظهر على نحو واضح قيمة καί مع τινες، وهي هنا «حتى/بل إن بعضًا» بمعنى: حتى بعض شعرائكم قالوا ذلك.'
