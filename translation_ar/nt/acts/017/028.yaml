  terminology: «نسله» اختيار سليم لـγένος في هذا السياق الشعري ولا يفرض تفسيرًا جوهريًا أو طائفيًا. والحاشية تقدم «ذريته» بديلًا عربيًا مشروعًا مع بيان موجز لخلفية الاقتباس.
