  text: ἐν αὐτῷ γὰρ ζῶμεν καὶ κινούμεθα καὶ ἐσμέν, ὡς καί τινες τῶν καθ’ ὑμᾶς ποιητῶν εἰρήκασιν· Τοῦ γὰρ καὶ γένος ἐσμέν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/028.yaml
  text: For in him we live and move and exist, as even some of your own poets have said, ‘For we also are his offspring.’
translation:
  language: ar
  text: 'ففيه نحيا ونتحرّك ونوجد، كما قال حتى بعض شعرائكم: «فنحن أيضًا من نسله».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فنحن أيضًا ذريته». والعبارة مقتبسة من شعر يوناني.'
    reason: تبيّن بديلًا عربيًا ممكنًا لـγένος وخلفية القول بوصفه اقتباسًا شعريًا، من غير نسبة اقتباس محدد لا يذكره النص.
lexical_decisions:
- source_word: ἐν αὐτῷ
  choice: فيه
  rationale: يحافظ على العبارة المكانية/العلاقية الموجزة في اليونانية من غير تفسير زائد.
- source_word: κινούμεθα
  choice: نتحرّك
  rationale: المقابل العربي المباشر الطبيعي للصيغة الوسطى/المبنية للمجهول لفظًا في هذا السياق.
- source_word: ἐσμέν
  choice: نوجد
  rationale: يعبّر عن الوجود هنا ويميّزه عن «نحيا»، مع إبقاء العبارة العربية مفهومة.
- source_word: τῶν καθ’ ὑμᾶς ποιητῶν
  choice: بعض شعرائكم
  rationale: صياغة عربية طبيعية تؤدي معنى الشعراء المنتمين إلى المخاطَبين أو المعروفين بينهم.
- source_word: γένος
  choice: نسله
  rationale: يناسب سياق الاقتباس الشعري ودلالة الانحدار أو الذرية، دون أن يعني مساواة البشر بالله في الجوهر.
theological_decisions:
- issue: دلالة كون البشر «نسل» الله
  choice: من نسله
  alternative: ذريته / من جنسه
  rationale: يحفظ صورة النص والاقتباس الشعري، بينما تُستبعد «من جنسه» لأنها قد توحي باشتراك جوهري غير مصرّح به في السياق.
- issue: معنى ἐσμέν في السلسلة الثلاثية
  choice: نوجد
  alternative: نكون
  rationale: «نوجد» أوضح في العربية الحديثة بوصفها إشارة إلى الوجود، من غير تحويل العبارة إلى تقرير فلسفي تفصيلي.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقّرة. حُفظ الإيقاع الثلاثي «نحيا ونتحرّك ونوجد»، وصيغ الاقتباس بعبارة طبيعية من غير إضافة تفسير عقائدي إلى المتن.
