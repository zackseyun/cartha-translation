  yaml_path: translation/nt/acts/017/014.yaml
  text: Then the brothers immediately sent Paul away to go as far as the sea[b][a], but both Silas and Timothy remained there.
translation:
  language: ar
  text: فأرسل الإخوة[a] بولس من فورهم ليذهب حتى البحر[b]، وأما سيلا وتيموثاوس فبقيا هناك.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الإخوة والأخوات»؛ فاللفظ اليوناني هو «الإخوة»، وقد يُستعمل للدلالة على جماعة المؤمنين.
    reason: lexical_alternative
  - marker: b
    text: أو «إلى البحر» أو «نحو البحر»؛ فالعبارة اليونانية قد تدل على الذهاب حتى البحر من غير أن تحدد المقصود بأكثر من ذلك.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθέως δὲ τότε
  choice: فـ... من فورهم
  rationale: تنقل الفاء تتابع السرد، ويعبّر «من فورهم» طبيعيًا عن سرعة تصرف الإخوة من غير إثقال العبارة بتكرار أدوات الزمن.
- source_word: ἐξαπέστειλαν
  choice: أرسل
  rationale: يفيد الفعل إرسال بولس من المكان؛ والسياق مع غاية الذهاب يوضح معنى الانصراف، فلا حاجة إلى إضافة غير طبيعية مثل «أرسلوا بعيدًا».
- source_word: οἱ ἀδελφοὶ
  choice: الإخوة
  rationale: يحافظ على صيغة الجمع المذكر في اليونانية، مع بيان إمكان دلالتها الجماعية على المؤمنين في الحاشية.
- source_word: πορεύεσθαι
  choice: ليذهب
  rationale: صياغة عربية واضحة تُظهر أن الذهاب هو غرض الإرسال.
- source_word: ἕως ἐπὶ τὴν θάλασσαν
  choice: إلى ساحل البحر
  rationale: تنقل الحركة حتى البحر بصياغة عربية طبيعية، مع إبقاء مدى العبارة اليونانية واحتمالاتها في الحاشية.
- source_word: ὑπέμεινάν
  choice: بقيا
  rationale: المقصود هنا استمرار سيلا وتيموثاوس في المكان، لا احتمال المشقة؛ والمثنى يلائم العربية.
- source_word: ὅ τε Σιλᾶς καὶ ὁ Τιμόθεος
  choice: سيلا وتيموثاوس
  rationale: المثنى في «بقيا» يؤدي معنى اقتران الشخصين الذي تفيده صيغة τε ... καὶ.
- source_word: ἐκεῖ
  choice: هناك
  rationale: المقابل العربي الطبيعي للظرف المكاني.
theological_decisions:
- issue: دلالة ἀδελφοί على جماعة المؤمنين
  choice: الإخوة
  alternative: الإخوة والأخوات؛ المؤمنون
  rationale: أُبقيت الصيغة المذكرة الموافقة للفظ اليوناني، مع التنبيه إلى أن استعمالها قد يشمل جماعة المؤمنين كلها، تجنبًا لحسم نطاقها ضمن النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم المثنى العربي في «بقيا»، وحُفظ التقابل السردي بين إرسال بولس وبقاء سيلا وتيموثاوس. وُضعت علامة حاشية الإخوة بعد اللفظ المتصل بها، وعلامة حاشية الوجهة بعد عبارة البحر.
