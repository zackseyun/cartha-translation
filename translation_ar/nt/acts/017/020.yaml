  text: ξενίζοντα γάρ τινα εἰσφέρεις εἰς τὰς ἀκοὰς ἡμῶν· βουλόμεθα οὖν γνῶναι ⸂τίνα θέλει⸃ ταῦτα εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/020.yaml
  text: For you are bringing some strange things to our ears[b][a]. Therefore we want to know what these things mean.
translation:
  language: ar
  text: لأنك تُدخل إلى مسامعنا أمورًا غريبة[a]، لذلك نريد أن نعرف ماذا تعني هذه الأمور[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أمورًا أجنبية» أو «غير مألوفة». يمكن للكلمة اليونانية أن تصف ما يبدو غريبًا لأنه جديد أو وافد على السامع.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «ماذا تريد هذه الأمور أن تكون»، وهو تعبير اصطلاحي بمعنى: «ماذا تعني هذه الأمور» أو «ما مغزاها».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ξενίζοντα τινα
  choice: أمورًا غريبة
  rationale: ينقل الوصف معنى أشياء غير مألوفة أو تبدو أجنبية للسامعين، مع إبقاء التنكير وعدم المبالغة في معنى الدهشة.
- source_word: εἰσφέρεις εἰς τὰς ἀκοὰς ἡμῶν
  choice: تُدخل إلى مسامعنا
  rationale: يحافظ على صورة إدخال الكلام إلى السمع، وهو تعبير عربي واضح وفصيح.
- source_word: βουλόμεθα οὖν γνῶναι
  choice: لذلك نريد أن نعرف
  rationale: صياغة عربية طبيعية تحفظ دلالة الإرادة والاستنتاج في οὖν.
- source_word: τίνα θέλει ταῦτα εἶναι
  choice: ماذا تعني هذه الأمور
  rationale: التركيب اليوناني اصطلاحي يسأل عن مدلول الأمور ومغزاها، لا عن هويتها المجردة فقط.
- source_word: γάρ
  choice: لأنك
  rationale: تُظهر لام التعليل صلة هذه العبارة التفسيرية بما سبق، وأُدغمت في تركيب «لأنك» الطبيعي.
