lexical_decisions:
- source_word: τοὺς μὲν οὖν χρόνους τῆς ἀγνοίας
  choice: فالله، إذ تجاوز عن أزمنة الجهل
  rationale: يجعل «أزمنة الجهل» مفعولًا لاسم الفاعل الدال على الفعل السابق، ويحافظ على الانتقال والمقابلة الزمنية مع «الآن». و«الجهل» ترجمة مباشرة لا تضيف صراحةً مفعول الجهل غير المذكور.
- source_word: ὑπεριδὼν
  choice: إذ تجاوز عن
  rationale: ينقل معنى عدم المؤاخذة الفورية واحتمال تلك الأزمنة، من غير أن يدل على إقرار الجهل أو استحسانه. كما يحافظ على الصيغة الحالية المصاحبة للفعل الرئيس.
- source_word: ὁ θεὸς
  choice: الله
  rationale: ترجمة مباشرة للفاعل المرفوع.
- source_word: τὰ νῦν
  choice: الآن
  rationale: يحفظ المقابلة بين أزمنة الجهل الماضية والوضع الحاضر.
- source_word: παραγγέλλει
  choice: يأمر
  rationale: ينقل قوة التكليف الإلهي التي يحملها الفعل، بدل صياغة أضعف مثل «يوصي» أو «يعلن».
- source_word: τοῖς ἀνθρώποις πάντας πανταχοῦ
  choice: جميع الناس في كل مكان
  rationale: يعبّر بوضوح عن الإحالة البشرية العامة وعن شمول الأمر، من غير قصره على الذكور أو على الأمم وحدهم.
- source_word: μετανοεῖν
  choice: أن يتوبوا
  rationale: «يتوبوا» هو المقابل العربي الكتابي والطبيعي الذي يجمع تغيّر الفكر والاتجاه الأخلاقي، ولا يحصر المعنى في مجرد تغيير الرأي.
theological_decisions:
- issue: دلالة تجاوز الله عن أزمنة الجهل
  choice: تُرك التعبير بمعنى التجاوز والاحتمال السابقين، لا بمعنى الموافقة أو إسقاط المسؤولية.
  alternative: أن الله تجاهل الخطية أو عذر الجهل عذرًا كاملًا.
  rationale: الأمر الحاضر بالتوبة يبقي المسؤولية الأخلاقية قائمة، بينما يدل الفعل السابق على عدم المؤاخذة الفورية. تحافظ الصياغة على هذا التوتر من غير تفسير زائد داخل المتن.
- issue: نطاق الأمر بالتوبة
  choice: الأمر موجّه إلى جميع الناس في كل مكان.
  alternative: قصره على الرجال أو على غير اليهود.
  rationale: تركيب τοῖς ἀνθρώποις πάντας πανταχοῦ شامل للبشر عمومًا، والسياق لا يقتضي تضييق هذا العموم.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «تجاوز عن» لأنه طبيعي في العربية ويحفظ معنى الاحتمال وعدم المؤاخذة الفورية، ووُضع فاعل الجملة في أولها لتفادي التباس مرجع اسم الفاعل. جميع علامتي الحاشية [a] و[b] مثبتتان في المتن.
