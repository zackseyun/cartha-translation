source:
  edition: SBLGNT
  text: διανοίγων καὶ παρατιθέμενος ὅτι τὸν χριστὸν ἔδει παθεῖν καὶ ἀναστῆναι ἐκ νεκρῶν, καὶ ὅτι οὗτός ἐστιν ⸂ὁ χριστός, ὁ⸃ Ἰησοῦς ὃν ἐγὼ καταγγέλλω ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/003.yaml
  text: explaining and demonstrating that the Messiah had to suffer and rise from the dead[a], and that this Jesus, whom I proclaim to you[b], is the Messiah.
translation:
  language: ar
  text: موضِّحًا ومبيِّنًا بالأدلة أن المسيح[a] كان لا بد أن يتألم وأن يقوم من بين الأموات[b]، وأن يسوع هذا، الذي أُعلن لكم عنه، هو المسيح.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: اللفظ اليوناني يعني «الممسوح»، وقد استُعمل هنا لقبًا للمسيح المنتظر.
    reason: lexical_clarification
  - marker: b
    text: 'حرفيًا: «يقوم من بين الأموات». جاءت العبارة اليونانية بصيغة المعلوم، مع أن العهد الجديد يتحدث في مواضع أخرى أيضًا عن أن الله أقام يسوع من بين الأموات.'
    reason: voice_nuance
lexical_decisions:
- source_word: διανοίγων
  choice: موضِّحًا
  rationale: يدل الفعل في السياق على كشف معنى الأسفار وجعله واضحًا، و«موضِّحًا» تعبير عربي طبيعي يحفظ هذا المعنى.
- source_word: παρατιθέμενος
  choice: مبيِّنًا بالأدلة
  rationale: يفيد عرض الحجج أو الشواهد أمام السامعين؛ وهذه الصياغة تميّزه عن مجرد الشرح من غير أن تبالغ فتجعله برهانًا منطقيًا قاطعًا.
- source_word: τὸν χριστόν / ὁ χριστός
  choice: المسيح
  rationale: اللفظ لقب في الموضعين، ويشير إلى الممسوح المنتظر في سياق الاستدلال من الأسفار. و«المسيح» هو المقابل العربي الراسخ والمفهوم.
- source_word: ἔδει
  choice: كان لا بد أن
  rationale: يحفظ معنى الضرورة التي يقررها النص، وهي ضرورة مفهومة في السياق على ضوء الأسفار.
- source_word: παθεῖν
  choice: يتألم
  rationale: مقابل مباشر وطبيعي للفعل، ويشير هنا إلى آلام المسيح.
- source_word: ἀναστῆναι ἐκ νεκρῶν
  choice: يقوم من بين الأموات
  rationale: يحافظ على صيغة المصدر المعلوم في اليونانية وعلى الصورة المكانية في ἐκ νεκρῶν.
- source_word: καταγγέλλω ὑμῖν
  choice: أعلنه لكم
  rationale: ينقل معنى الإعلان العلني بوضوح، كما أن الضمير العائد إلى يسوع يلائم البناء العربي والسياق.
theological_decisions:
- issue: دلالة Χριστός في الموضعين
  choice: المسيح بوصفه لقبًا
  alternative: الممسوح
  rationale: الحجة في الآية تعرّف هوية الممسوح المنتظر وتقرر أن يسوع هو ذاك المسيح. أبقينا اللفظ العربي المألوف، مع بيان دلالته اللقبية في الحاشية.
- issue: صيغة ἀναστῆναι من جهة المبني للمعلوم أو للمجهول
  choice: يقوم من بين الأموات
  alternative: يُقام من بين الأموات
  rationale: المصدر اليوناني هنا معلوم، ولذلك تعكس «يقوم» صيغة النص مباشرة، من غير نفي ما تقوله مواضع أخرى عن إقامة الله ليسوع.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «مبيِّنًا بالأدلة» لإظهار أن الفعل الثاني يضيف عرض الشواهد إلى الشرح، وحُفظ التوازي بين ذكري «المسيح» مع إبراز أن «يسوع هذا» هو موضوع الإعلان.
