base_translation:
  language: en
  yaml_path: translation/nt/acts/017/017.yaml
  text: So he was reasoning in the synagogue with the Jews and those who worshiped God[b][a], and in the marketplace every day with those who happened to be there.
translation:
  language: ar
  text: فكان يتحاور في المجمع مع اليهود والذين يعبدون الله[a]، وفي الساحة العامة[b] كل يوم مع الذين صادف وجودهم فيها.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الذين يتقون الله»، وهو تعبير قد يشير إلى غير اليهود المرتبطين بالعبادة اليهودية.'
    reason: lexical_alternative
  - marker: b
    text: كانت «الساحة العامة» مكانًا مدنيًا يجتمع فيه الناس أيضًا، لا موضعًا للبيع والشراء فحسب.
    reason: cultural_note
lexical_decisions:
- source_word: διελέγετο
  choice: كان يتحاور
  rationale: صيغة الماضي الناقص تدل على نشاط متكرر أو مستمر، و«يتحاور» تحفظ البعد التفاعلي للكلمة، من غير أن تحصره في مناظرة خصامية.
- source_word: μὲν οὖν
  choice: فـ
  rationale: الفاء تصل الكلام طبيعيًا بما قبله وتنقل معنى الاستمرار أو النتيجة الذي تؤديه الأداتان في السياق.
- source_word: συναγωγῇ
  choice: المجمع
  rationale: المقصود موضع اجتماع اليهود ومؤسستهم المعروفة؛ و«المجمع» هو التعبير العربي الكتابي الواضح في هذا السياق.
- source_word: τοῖς Ἰουδαίοις
  choice: اليهود
  rationale: يشير اللفظ هنا إلى أفراد الجماعة اليهودية الحاضرين في المجمع، لا إلى سكان اليهودية حصرًا.
- source_word: τοῖς σεβομένοις
  choice: الذين يعبدون الله
  rationale: يفيد اسم الفاعل جماعة من غير اليهود ارتبطت بعبادة إله إسرائيل؛ وذُكر «الله» توضيحًا لما يفهم من الاستعمال والسياق، مع إثبات البديل الاصطلاحي في الحاشية.
- source_word: ἀγορᾷ
  choice: الساحة العامة
  rationale: كانت ἀγορά فضاءً عامًا مدنيًا وتجاريًا، لا سوقًا للبيع والشراء فحسب؛ لذلك تنقل «الساحة العامة» المدى المقصود بوضوح.
- source_word: κατὰ πᾶσαν ἡμέραν
  choice: كل يوم
  rationale: تعبير عربي طبيعي يحفظ معنى التكرار اليومي.
- source_word: πρὸς τοὺς παρατυγχάνοντας
  choice: مع من يصادف وجودهم هناك
  rationale: يحفظ معنى الأشخاص الذين اتفق حضورهم في المكان، من غير قصرهم على المارة.
theological_decisions:
- issue: هوية τοῖς σεβομένοις وإضافة مفعول العبادة
  choice: الذين يعبدون الله
  alternative: الذين يتقون الله
  rationale: النص اليوناني لا يذكر «الله» صراحة، لكن الاستعمال اللوقاوي وسياق المجمع يجعلان المرجع مفهومًا. تحافظ الحاشية على الدلالة الاصطلاحية المحتملة من غير فرض تصنيف تقني في المتن.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «كان يتحاور» لإبراز الاستمرار والتفاعل، و«الساحة العامة» لتجنب تضييق معنى ἀγορά إلى السوق التجاري وحده.
