  text: ⸀καθότι ἔστησεν ἡμέραν ἐν ᾗ μέλλει κρίνειν τὴν οἰκουμένην ἐν δικαιοσύνῃ ἐν ἀνδρὶ ᾧ ὥρισεν, πίστιν παρασχὼν πᾶσιν ἀναστήσας αὐτὸν ἐκ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/031.yaml
  text: because he has fixed a day on which he is going to judge the inhabited world in righteousness by a man whom he appointed[b][a], having given proof to all by raising him from the dead.
translation:
  language: ar
  text: لأنه قد عيَّن يومًا سيدين فيه المسكونة بالعدل[a]، بواسطة رجل عيَّنه، إذ قدَّم الله للجميع برهانًا[b] بإقامته إياه من بين الأموات.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في البرّ».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «قدَّم للجميع ضمانًا»؛ وحرفيًا: «قدَّم للجميع إيمانًا». والمقصود هنا برهان أو ضمان علني.'
    reason: alternative_reading
lexical_decisions:
- source_word: καθότι
  choice: لأنه
  rationale: تفيد التعليل وتربط تحديد يوم الدينونة بالدعوة السابقة إلى التوبة.
- source_word: ἔστησεν ἡμέραν
  choice: قد عيَّن يومًا
  rationale: تنقل معنى تحديد يوم وإقراره، وهي عبارة عربية واضحة ورصينة.
- source_word: ἐν ᾗ μέλλει κρίνειν
  choice: سيدين فيه
  rationale: تنقل دلالة الفعل المستقبلي المقصود دون إثقال الصياغة العربية، مع بقاء معنى أن الدينونة مقررة وآتية.
- source_word: τὴν οἰκουμένην
  choice: المسكونة
  rationale: تحافظ على الدلالة المعجمية للعالم المأهول وعلى نطاق الدينونة البشري الشامل.
- source_word: ἐν δικαιοσύνῃ
  choice: بالعدل
  rationale: في سياق القضاء، «بالعدل» عربية طبيعية ودقيقة، وتحمل معنى δικαιοσύνη بوصفه استقامة وعدالة في الحكم.
- source_word: ἐν ἀνδρὶ ᾧ ὥρισεν
  choice: بواسطة رجل عيَّنه
  rationale: تحافظ «رجل» على التحديد الجنسي في ἀνήρ، وتنقل ἐν هنا معنى الوساطة، فيما تعبّر «عيَّنه» عن التحديد والتكليف.
- source_word: πίστιν παρασχὼν πᾶσιν
  choice: وقدَّم للجميع برهانًا
  rationale: التركيب الاصطلاحي هنا يدل على تقديم ضمان أو برهان علني، لا على منح الإيمان لكل إنسان.
- source_word: ἀναστήσας αὐτὸν ἐκ νεκρῶν
  choice: إذ أقامه من بين الأموات
  rationale: يبين أن الإقامة من بين الأموات هي الكيفية التي قدّم بها الله البرهان، ويحافظ على صورة ἐκ νεκρῶν.
theological_decisions:
- issue: دلالة δικαιοσύνη في سياق الدينونة
  choice: بالعدل
  alternative: في البرّ
  rationale: السياق قضائي، ولذلك توصل «بالعدل» المعنى المقصود بوضوح، مع حفظ المقابل الأقرب شكليًا «في البرّ» في الحاشية منعًا لطمس السعة الدلالية.
- issue: دلالة πίστις في عبارة πίστιν παρασχὼν πᾶσιν
  choice: برهانًا
  alternative: 'ضمانًا؛ وحرفيًا: إيمانًا'
  rationale: اقتران πίστις بالفعل παρέχω في هذا السياق يفيد تقديم ما يبعث على اليقين أو يثبت الأمر؛ وترجمة اللفظ «إيمانًا» في المتن قد توهم أن الله منح الجميع فعل الإيمان.
- issue: دلالة ἀνδρί وصيغة التنكير
  choice: رجل
  alternative: الرجل
  rationale: اللفظ اليوناني ἀνήρ يعني رجلًا، وهو غير معرّف في العبارة، لذا حُفظ التنكير مع أن هوية المشار إليه تتضح من السياق.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُخدمت «المسكونة» لصون الدلالة الأصلية مع كونها مألوفة في الأسلوب الكتابي، ووُضعت علامتا الحاشية مباشرة بعد اللفظين اللذين تشرحانهما.
