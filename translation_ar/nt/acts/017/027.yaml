  text: ζητεῖν τὸν ⸀θεὸν εἰ ἄρα γε ψηλαφήσειαν αὐτὸν καὶ εὕροιεν, καί γε οὐ μακρὰν ἀπὸ ἑνὸς ἑκάστου ἡμῶν ὑπάρχοντα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/027.yaml
  text: that they should seek God[a], if perhaps they might grope for him and find him—though indeed he is not far from each one of us.
translation:
  language: ar
  text: لكي يطلبوا الله، لعلهم يتحسَّسونه[a] فيجدوه، مع أنه ليس بعيدًا عن كل واحد منا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: يلتمسونه باللمس. يوحي الفعل اليوناني بالبحث عن طريق التحسُّس، كما يفعل من كان إدراكه محدودًا أو كان في الظلام.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητεῖν
  choice: لكي يطلبوا
  rationale: المصدر متعلق بالسياق السابق ويفيد الغاية أو النتيجة؛ وصيغة «لكي يطلبوا» تنقل هذا المعنى طبيعيًا في العربية.
- source_word: τὸν θεόν
  choice: الله
  rationale: التعبير العربي الطبيعي عن المرجع الإلهي هنا هو «الله»، ولا يلزم تمثيل أداة التعريف اليونانية على نحو مستقل.
- source_word: εἰ ἄρα γε
  choice: لعلهم
  rationale: تنقل «لعل» معنى الاحتمال والتردد الذي تحمله مجموعة الأدوات اليونانية، من غير أن تجعل الوصول مؤكدًا أو مستحيلًا.
- source_word: ψηλαφήσειαν
  choice: يتحسَّسونه
  rationale: الفعل يدل على التماس باللمس أو التحسس في حال محدودية الإدراك؛ و«يتحسسونه» يحفظ الصورة المجازية بعبارة عربية واضحة.
- source_word: αὐτόν
  choice: ـه
  rationale: الضمير يعود إلى الله، واتصاله بالفعل هو الأسلوب العربي الطبيعي.
- source_word: καὶ εὕροιεν
  choice: فيجدوه
  rationale: الفعل منسق مع فعل التحسس ويحمل مثله معنى الاحتمال؛ والفاء تلائم تتابع البحث والعثور في العربية من غير أن تحوله إلى نتيجة مضمونة.
- source_word: καί γε
  choice: مع أنه
  rationale: 'يفيد هنا استدراكًا ذا مسحة تنازلية: فمع تردد البحث البشري، تؤكد العبارة قرب الله الفعلي.'
- source_word: οὐ μακρὰν
  choice: ليس بعيدًا
  rationale: ترجمة مباشرة وطبيعية تحفظ نفي البعد المكاني المجازي.
- source_word: ἀπὸ ἑνὸς ἑκάστου ἡμῶν
  choice: عن كل واحد منا
  rationale: تحفظ التشديد التوزيعي في «واحد كل واحد»، مع صياغة عربية سليمة ومألوفة.
- source_word: ὑπάρχοντα
  choice: ليس
  rationale: حُوِّل اسم الفاعل اليوناني إلى جملة فعلية اسمية المعنى؛ «ليس بعيدًا» تنقل وجوده الفعلي في حالة القرب بوضوح عربي.
theological_decisions:
- issue: إمكان الوصول إلى الله ومحدودية سعي الإنسان
  choice: الحفاظ على تردد السعي البشري في «لعلهم يتحسسونه فيجدوه»، مع تأكيد قرب الله في «مع أنه ليس بعيدًا».
  alternative: صياغة أكثر سلاسة تحذف صورة التحسس، أو صياغة تجعل العثور مؤكدًا.
  rationale: يجمع النص اليوناني بين محدودية الإدراك البشري وحقيقة قرب الله؛ فلا ينبغي للترجمة أن تحسم هذا التوتر بجعل البحث واثقًا أو عقيمًا.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. اختير «يتحسَّسونه» للحفاظ على صورة اللمس مع تجنب الغموض الذي قد ينشأ من «يتلمسونه»، واستُعمل «مع أنه» لإبراز الاستدراك من غير مبالغة تفسيرية.
