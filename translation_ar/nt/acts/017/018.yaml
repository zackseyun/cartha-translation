source:
  edition: SBLGNT
  text: τινὲς δὲ καὶ τῶν Ἐπικουρείων ⸀καὶ Στοϊκῶν φιλοσόφων συνέβαλλον αὐτῷ, καί τινες ἔλεγον· Τί ἂν θέλοι ὁ σπερμολόγος οὗτος λέγειν; οἱ δέ· Ξένων δαιμονίων δοκεῖ καταγγελεὺς εἶναι· ὅτι τὸν Ἰησοῦν καὶ τὴν ἀνάστασιν εὐηγγελίζετο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/018.yaml
  text: Some of the Epicurean and Stoic philosophers also engaged with him[a], and some were saying, “What is this babbler trying to say?” But others said[d][c][b], “He seems to be a proclaimer of foreign deities,” because he was proclaiming the good news about Jesus and the resurrection.
translation:
  language: ar
  text: 'وكان بعضُ الفلاسفة الأبيقوريين والرواقيين يتحاورون معه[a]. فقال بعضهم: «ماذا يريد هذا الثرثار[b] أن يقول؟» وقال آخرون: «يبدو أنه ينادي بآلهة غريبة[c][d]»، لأنه كان يبشّر بيسوع والقيامة.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يناقشونه» أو «يجادلونه»؛ فالفعل اليوناني قد يدل على المحاورة أو المناقشة النشطة، وقد يتضمن المجادلة.'
    reason: lexical_alternative
  - marker: b
    text: «الثرثار» ترجمة للفظ ازدرائي معناه الحرفي «ملتقط الحبّ»، وكان يُطلق على من يلتقط شذرات من الأفكار ثم يكررها.
    reason: cultural_note
  - marker: c
    text: 'يمكن أيضًا ترجمتها: «شياطين غريبة» أو «كائنات إلهية أجنبية» أو «آلهة غير مألوفة». والمقصود، بحسب الإطار الوثني للمتكلمين، كائنات إلهية غير مألوفة لديهم، لا بالضرورة شياطين شريرة بالمعنى المسيحي اللاحق.'
    reason: alternative_reading
  - marker: d
    text: يرى بعضهم أن الأثينيين ربما ظنوا أن «القيامة» اسم لكيان إلهي آخر، لأن بولس كان يبشّر بيسوع والقيامة.
    reason: alternative_reading
lexical_decisions:
- source_word: συνέβαλλον αὐτῷ
  choice: يتحاورون معه
  rationale: يفيد الفعل هنا الدخول معه في نقاش أو محاورة، وربما مجادلة؛ واختيار «يتحاورون» يحفظ المعنى العام من غير افتراض خصومة صريحة.
- source_word: σπερμολόγος
  choice: الثرثار
  rationale: لفظ ازدرائي كان يدل حرفيًا على «ملتقط الحبّ»، ثم استُعمل لمن يلتقط شذرات من الأفكار ويرددها؛ و«الثرثار» تنقل نبرة الاحتقار بوضوح في العربية المعاصرة.
- source_word: Τί ἂν θέλοι ... λέγειν
  choice: ماذا يريد هذا الثرثار أن يقول؟
  rationale: تنقل الصياغة العربية معنى التساؤل المتشكك أو المستخف الذي تؤديه صيغة التمني مع ἄν، بصورة طبيعية.
- source_word: Ξένων δαιμονίων
  choice: بآلهة غريبة
  rationale: في كلام أثينيين وثنيين يدل δαιμόνια على كائنات إلهية في إطارهم الديني، لا بالضرورة على الشياطين بالمعنى المسيحي؛ و«غريبة» هنا بمعنى أجنبية أو غير مألوفة.
- source_word: καταγγελεὺς
  choice: منادٍ
  rationale: يدل الاسم على من يعلن أمرًا على الملأ، و«منادٍ» عربية واضحة وموجزة تناسب الاتهام.
- source_word: εὐηγγελίζετο
  choice: كان يبشّر
  rationale: يحفظ معنى إعلان الخبر السار، وهو أدق من عبارة عامة مثل «كان يعظ».
- source_word: ἀνάστασιν
  choice: القيامة
  rationale: تشير في تفسير لوقا إلى مضمون بشارة بولس، مع إبقاء احتمال أن بعض السامعين فهموها اسمًا لكيان إلهي في الحاشية.
- source_word: Ἐπικουρείων καὶ Στοϊκῶν φιλοσόφων
  choice: الفلاسفة الأبيقوريين والرواقيين
  rationale: الصياغة الطبيعية في العربية لأسماء المدرستين الفلسفيتين، مع الحفاظ على وصف أصحابها بأنهم فلاسفة.
theological_decisions:
- issue: دلالة δαιμόνια في خطاب وثني
  choice: آلهة غريبة
  alternative: أرواح غريبة؛ شياطين غريبة
  rationale: يعرض النص تصور المتكلمين الأثينيين؛ لذا لا ينبغي أن تُفرض على كلامهم دلالة «الشياطين» الشريرة في الاستعمال المسيحي اللاحق.
- issue: هل تُفهم ἀνάστασις على أنها اسم مؤنث لكيان إلهي؟
  choice: القيامة بوصفها مضمون البشارة
  alternative: فهم الأثينيين «القيامة» على أنها إلهة أو كيان إلهي آخر
  rationale: تعليل لوقا يصف ما كان بولس يبشّر به، ولا يصرح بأن القيامة مشخصنة، لكن تركيب «يسوع والقيامة» قد يكون قد أوحى لبعض الأثينيين بكيانين إلهيين؛ لذلك يُذكر الاحتمال في الحاشية ولا يُفرض على المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة، بصياغة سردية طبيعية. استُعمل «الأبيقوريين والرواقيين» وهما الاسمان العربيان الشائعان للمدرستين، وحُفظت نبرة الازدراء في السؤال من غير استعمال لفظ عامي أو شديد الغموض. وُضعت علامات الحواشي في المتن، مع ترتيبها بحسب مواضعها الطبيعية.
