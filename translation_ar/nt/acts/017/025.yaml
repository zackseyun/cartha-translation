source:
  edition: SBLGNT
  text: οὐδὲ ὑπὸ χειρῶν ⸀ἀνθρωπίνων θεραπεύεται προσδεόμενός τινος, αὐτὸς διδοὺς πᾶσι ζωὴν καὶ πνοὴν ⸂καὶ τὰ⸃ πάντα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/025.yaml
  text: Nor is he served by human hands[a], as though he needed anything, since he himself gives to all life and breath and all things.
translation:
  language: ar
  text: ولا تخدمه أيدٍ بشرية[a]، كأنه محتاج إلى شيء، إذ إنه هو نفسه يعطي الجميع حياةً ونفَسًا وكلَّ شيء.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ولا تقوم أيدٍ بشرية على خدمته». يمكن أن يدل الفعل اليوناني على الخدمة أو العناية المقدَّمة في سياق ديني؛ والمقصود هنا أن الله لا يعتمد على خدمات البشر.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: ولا
  rationale: تصل النفي بما قبله بصورة طبيعية في العربية وتحافظ على معنى الاستمرار.
- source_word: ὑπὸ χειρῶν ἀνθρωπίνων
  choice: أيدٍ بشرية
  rationale: يحافظ التعبير على الصورة المحسوسة في الأصل من غير إقحام تفسير.
- source_word: θεραπεύεται
  choice: تخدمه
  rationale: الفعل هنا يدل على تقديم الخدمة أو العناية، ولا يدل على الشفاء. وصيغة «تخدمه أيدٍ بشرية» تلائم سياق الخدمة الدينية مع إبقاء الدلالة أوسع من العبادة وحدها.
- source_word: προσδεόμενός τινος
  choice: كأنه محتاج إلى شيء
  rationale: 'ينقل القوة الحجاجية لصيغة الحال: ليست خدمة البشر لله قائمة على افتراض احتياجه إلى شيء.'
- source_word: αὐτὸς
  choice: هو نفسه
  rationale: يحفظ التوكيد والمقابلة بين الله الذي يعطي والمخلوقات التي تتلقى.
- source_word: διδοὺς πᾶσι
  choice: يعطي الجميع
  rationale: صياغة عربية سلسة تحفظ شمول πᾶσι من غير قصره صراحة على البشر.
- source_word: ζωὴν καὶ πνοὴν
  choice: حياةً ونفَسًا
  rationale: ينقل اللفظين بمعناهما المباشر؛ «نفَسًا» هنا أدق من «روحًا» في سياق اعتماد الخليقة على واهب الحياة.
- source_word: καὶ τὰ πάντα
  choice: وكلَّ شيء
  rationale: يحفظ قوة التعميم في العبارة اليونانية بوضوح وطبيعية.
theological_decisions:
- issue: هل يُترجم θεραπεύεται بلفظ صريح خاص بالعبادة أم بلفظ أوسع يدل على الخدمة؟
  choice: تخدمه
  alternative: تعبده / تقوم على خدمته
  rationale: الحجة تتناول عدم اعتماد الله على خدمات البشر، ولا سيما في السياق الديني. «تخدمه» تشمل الخدمة التعبدية من غير أن تحصر معنى الفعل في العبادة وحدها أو توحي بأن كل خدمة لله منفية بإطلاق.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كريمة. استُعمل البناء الفعلي «تخدمه أيدٍ بشرية» لأنه طبيعي ويحافظ على صورة الأيدي البشرية، مع إثبات علامة الحاشية في المتن.
