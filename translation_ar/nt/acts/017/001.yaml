  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Διοδεύσαντες δὲ τὴν Ἀμφίπολιν καὶ ⸀τὴν Ἀπολλωνίαν ἦλθον εἰς Θεσσαλονίκην, ὅπου ⸀ἦν συναγωγὴ τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/001.yaml
  text: After passing through Amphipolis and Apollonia[a], they came to Thessalonica[b], where there was a synagogue of the Jews.
translation:
  language: ar
  text: وبعد أن اجتازوا أمفيبوليس وأبولونية، وصلوا إلى تسالونيكي، حيث كان لليهود مجمع.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «حيث كان مجمع لليهود».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διοδεύσαντες
  choice: بعد أن اجتازوا
  rationale: اسم فاعل ماضٍ يدل على فعل سبق الفعل الرئيس؛ وهذه الصياغة توضح التعاقب وتحافظ على معنى المرور عبر المدينتين.
- source_word: δὲ
  choice: و
  rationale: أداة ربط سردية خفيفة، وتنقلها الواو طبيعيًا في العربية من غير إضفاء معنى تقابلي.
- source_word: Ἀμφίπολιν
  choice: أمفيبوليس
  rationale: نقل صوتي لاسم المكان وفق صورته اليونانية.
- source_word: Ἀπολλωνίαν
  choice: أبولونية
  rationale: نقل صوتي عربي واضح لاسم المكان اليوناني.
- source_word: ἦλθον
  choice: وصلوا
  rationale: فعل حركة ماضٍ؛ و«وصلوا» ملائم للسياق الذي يذكر اجتياز مدينتين ثم بلوغ الوجهة، من غير تغيير جوهر الفعل.
- source_word: εἰς Θεσσαλονίκην
  choice: إلى تسالونيكي
  rationale: ينقل حرف الجر الدال على الاتجاه والوجهة بصياغة عربية طبيعية.
- source_word: ὅπου
  choice: حيث
  rationale: مقابل عربي طبيعي لظرف المكان الموصول.
- source_word: συναγωγὴ
  choice: مجمع
  rationale: يدل هنا على موضع اجتماع اليهود وعبادتهم؛ و«مجمع» هو المقابل الكتابي العربي المألوف، مع مراعاة أن الاسم غير معرّف في اليونانية.
- source_word: τῶν Ἰουδαίων
  choice: لليهود
  rationale: تنقل اللام علاقة الارتباط أو الاختصاص بين المجمع والجماعة اليهودية بأسلوب عربي طبيعي.
theological_decisions:
- issue: دلالة Ἰουδαίων في السياق السردي
  choice: اليهود
  alternative: اليهوديون؛ أهل اليهودية
  rationale: السياق يشير إلى الجماعة اليهودية المرتبطة بالمجمع في تسالونيكي، لا إلى سكان منطقة اليهودية تحديدًا؛ لذلك «اليهود» أدق وأوضح.
- issue: تعريف συναγωγή مع أنه غير مسبوق بأداة تعريف يونانية
  choice: كان لليهود مجمع
  alternative: كان مجمع اليهود
  rationale: الصياغة المختارة تعكس غياب أداة التعريف وتحافظ على احتمال أن المعنى هو وجود مجمع يخص الجماعة اليهودية، من غير الجزم بأنه المجمع الوحيد أو المعلوم سابقًا.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. روعي التعاقب السردي في «بعد أن اجتازوا»، واستُخدمت أسماء الأماكن بصيغ عربية صوتية شائعة، وحُفظ عدم تعريف كلمة «مجمع» في الأصل بصياغة طبيعية.
