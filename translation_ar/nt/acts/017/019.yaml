source:
  edition: SBLGNT
  text: ἐπιλαβόμενοί ⸀τε αὐτοῦ ἐπὶ τὸν Ἄρειον Πάγον ἤγαγον, λέγοντες· Δυνάμεθα γνῶναι τίς ἡ καινὴ αὕτη ἡ ὑπὸ σοῦ λαλουμένη διδαχή;
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/019.yaml
  text: So they took hold of him and brought him to the Areopagus, saying, “May we know what this new teaching is that is being spoken by you?”
translation:
  language: ar
  text: 'فأمسكوا به واقتادوه إلى أريوس باغوس[a]، قائلين: «هل لنا أن نعرف ما هذا التعليم الجديد الذي تتكلم به؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: قد يشير «أريوس باغوس» إلى التل نفسه أو إلى المجلس المرتبط به؛ ويُعرف أيضًا باسم «تل آريس»، أي «تل المريخ» في التسمية اللاتينية التقليدية.
    reason: ملاحظة ثقافية تحفظ احتمال دلالة الاسم على المكان أو المؤسسة.
lexical_decisions:
- source_word: ἐπιλαβόμενοί
  choice: أمسكوا به
  rationale: ينقل الفعل معنى الإمساك الجسدي والمبادرة الحازمة، من غير أن يبالغ فيصوّره اعتقالًا رسميًا أو قبضًا عدائيًا.
- source_word: τε
  choice: فـ
  rationale: فاء السرد تربط الحدث بما قبله ربطًا طبيعيًا، وتعكس وظيفة أداة الوصل اليونانية الخفيفة.
- source_word: ἐπὶ τὸν Ἄρειον Πάγον
  choice: إلى أريوس باغوس
  rationale: نقل الاسم اليوناني يحافظ على إمكان دلالته على الموضع أو المجلس المرتبط به، بدل حسم الإشارة في أحدهما.
- source_word: ἤγαγον
  choice: اقتادوه
  rationale: يفيد أنهم قادوه إلى وجهة معينة، وينسجم مع سبق إمساكهم به من غير أن يقتضي وحده اعتقالًا رسميًا.
- source_word: λέγοντες
  choice: قائلين
  rationale: يحافظ على الصلة الحالية بين القول والفعل الرئيس بصياغة عربية فصيحة طبيعية.
- source_word: Δυνάμεθα γνῶναι
  choice: هل لنا أن نعرف
  rationale: تؤدي العبارة بوصفها طلبًا مهذبًا للاستفهام، لا سؤالًا مجردًا عن القدرة.
- source_word: καινὴ
  choice: الجديد
  rationale: «جديد» هو المقابل الأوضح والأوسع دلالة، من غير إضافة إيحاء سلبي مثل «مستحدث» أو «غريب».
- source_word: ὑπὸ σοῦ λαλουμένη
  choice: الذي تتكلم به
  rationale: صياغة عربية طبيعية تنقل إسناد الكلام إلى المخاطب، مع بقاء التعليم هو محور السؤال؛ والحرف «به» يلائم الاستعمال العربي مع «التعليم».
- source_word: διδαχή
  choice: التعليم
  rationale: لفظ واضح ومعاصر يعبّر عن مضمون ما يعلّمه بولس، ولا يحمل النبرة الاصطلاحية الأثقل التي قد تحملها «العقيدة».
theological_decisions:
- issue: طبيعة أخذ بولس إلى أريوس باغوس
  choice: إمساك واقتياد حازمان، من غير وصف الحدث بأنه اعتقال رسمي
  alternative: القبض عليه رسميًا، أو مجرد دعوته بلطف
  rationale: يسمح ἐπιλαμβάνομαι بدرجات من القوة، لكن السياق المباشر يبرز الاستفسار عن تعليمه ولا يصرّح باعتقال قضائي؛ لذلك تحفظ الصياغة الفعل الجسدي من غير تهويل أو تلطيف مفرط.
- issue: مدلول Ἄρειος Πάγος
  choice: إبقاء الاسم «أريوس باغوس» من غير تحديد أهو التل أم المجلس
  alternative: تل آريس، أو مجلس أريوس باغوس
  rationale: يمكن للاسم اليوناني أن يدل على الموضع وعلى الهيئة المرتبطة به؛ لذا تُحفظ هذه السعة الدلالية في المتن، وتوضح في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدمت «أمسكوا به واقتادوه» لإظهار المبادرة الجسدية من غير افتراض اعتقال رسمي، و«هل لنا أن نعرف» لطلب مهذب، مع إبقاء الاسم التاريخي منقولًا صوتيًا وحفظ غموضه المرجعي.
