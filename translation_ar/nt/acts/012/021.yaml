  text: On an appointed day[a], Herod, having put on royal clothing and having sat down on the tribunal[b], was delivering a public address to them.
translation:
  language: ar
  text: وفي يومٍ معيَّن، لبس هيرودس ثيابًا ملكية[a]، وجلس على المنصّة[b]، وكان يلقي إليهم خطابًا علنيًّا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «حُلّة ملكية». تدل اللفظة اليونانية عمومًا على اللباس أو الزي، ولا تحدد نوعًا بعينه.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «كرسي القضاء» أو «المنصّة الرسمية». كثيرًا ما تدل اللفظة اليونانية على مقعد رسمي أو منصّة مرتفعة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τακτῇ ... ἡμέρᾳ
  choice: في يومٍ معيَّن
  rationale: تفيد العبارة يومًا جرى تحديده أو تعيينه مسبقًا. و«يوم معيَّن» تعبير عربي طبيعي يحفظ هذا المعنى من غير أن يفترض أن القارئ يعرف ذلك اليوم من قبل.
- source_word: ἐνδυσάμενος
  choice: لبس
  rationale: اسم الفاعل اليوناني في صيغة الماضي يدل على فعل سبق الجلوس والخطاب. نُقلت دلالة التعاقب بترتيب الأفعال العربية، وهو أوضح وأطبع من تركيب حرفي ثقيل.
- source_word: ἐσθῆτα βασιλικὴν
  choice: ثيابًا ملكية
  rationale: تدل ἐσθής على اللباس أو الزي، ولا تستلزم رداءً بعينه. و«ثيابًا ملكية» تحافظ على عموم اللفظة وعلى الصفة الملوكية.
- source_word: καθίσας
  choice: وجلس
  rationale: يحفظ الفعل تسلسل الحدث بعد ارتداء الثياب وقبل إلقاء الخطاب، بصياغة عربية سلسة.
- source_word: ἐπὶ τοῦ βήματος
  choice: على المنصّة
  rationale: يمكن أن تشير βῆμα إلى مقعد رسمي أو موضع مرتفع تُمارَس منه سلطة قضائية أو يُلقى منه خطاب. والسياق هنا ظهور رسمي علني، لذلك تنقل «المنصّة» المشهد من غير أن تحوّله إلى محاكمة صريحة.
- source_word: ἐδημηγόρει
  choice: وأخذ يلقي ... خطابًا علنيًّا
  rationale: الفعل δημηγορέω يعني مخاطبة جمهور أو جمع علنًا، وصيغة الماضي الناقص تصوّر الخطاب بوصفه فعلًا جاريًا؛ لذلك ينقل «أخذ يلقي» الاستمرارية، و«خطابًا علنيًّا» الطابع العام.
- source_word: πρὸς αὐτούς
  choice: عليهم
  rationale: التعبير العربي «يلقي عليهم خطابًا» يؤدي طبيعيًّا معنى توجيه الخطاب إليهم.
theological_decisions: []
translation_notes:
  register: صياغة عربية فصحى معاصرة، واضحة ووقورة. استُعملت الواو في البدء لنقل δέ بوصفها أداة وصل سردية، وتُرجم تسلسل أسماء الفاعل اليونانية بأفعال عربية متعاقبة تجنبًا للثقل الحرفي. وُضع مؤشّر الحاشية [a] بعد «ثيابًا ملكية» لأنه يخص ἐσθῆτα βασιλικὴν، لا عبارة اليوم المعيَّن.
