  text: καὶ ὁ Πέτρος ⸂ἐν ἑαυτῷ γενόμενος⸃ εἶπεν· Νῦν οἶδα ἀληθῶς ὅτι ἐξαπέστειλεν ⸀ὁ κύριος τὸν ἄγγελον αὐτοῦ καὶ ἐξείλατό με ἐκ χειρὸς Ἡρῴδου καὶ πάσης τῆς προσδοκίας τοῦ λαοῦ τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/011.yaml
  text: And Peter[a], coming to himself, said[c][b], “Now I truly know that the Lord sent his angel and rescued me from Herod’s hand and from all the expectation of the people of the Jews.”
translation:
  language: ar
  text: 'فقال بطرس بعدما عاد إلى وعيه[a]: «الآن علمت حقًّا أن الرب أرسل ملاكه وأنقذني من يد هيرودس[b] ومن كل ما كان الشعب اليهودي يتوقعه[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بعدما رجع إلى نفسه» أو «بعدما أفاق».'
    reason: lexical_alternative
  - marker: b
    text: 'أي: من سلطة هيرودس أو قبضته.'
    reason: cultural_note
  - marker: c
    text: 'أي: مما كان الشعب اليهودي ينتظر أن يحدث لبطرس.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἑαυτῷ γενόμενος
  choice: بعدما عاد إلى وعيه
  rationale: تعبير عربي طبيعي ينقل معنى رجوع بطرس إلى الإدراك الكامل بعد خبرة بدت له كرؤيا، مع إبقاء صورة الرجوع إلى الوعي.
- source_word: ἀληθῶς
  choice: حقًّا
  rationale: تنقل توكيد إدراك بطرس بوضوح وإيجاز.
- source_word: ἐξαπέστειλεν
  choice: أرسل
  rationale: الفعل العربي المألوف يؤدي معنى الإرسال هنا من غير تكلّف.
- source_word: κύριος
  choice: الرب
  rationale: يحافظ على لفظ اليونانية من غير حسم مرجعه في هذا الموضع إلى الله أو إلى يسوع القائم.
- source_word: ἄγγελον
  choice: ملاكه
  rationale: السياق القصصي يدل على كائن سماوي، لا مجرد رسول بشري.
- source_word: ἐξείλατό με
  choice: أنقذني
  rationale: ينقل بوضوح معنى التخليص من الخطر والقبضة.
- source_word: ἐκ χειρὸς Ἡρῴδου
  choice: من يد هيرودس
  rationale: يحفظ الصورة الأصلية المفهومة عربيًّا، حيث تدل اليد على السلطة أو السيطرة.
- source_word: πάσης τῆς προσδοκίας
  choice: من كل ما كان ... يتوقعه
  rationale: صياغة عربية طبيعية تجعل المقصود هو الأمر أو المصير الذي كان الناس ينتظرونه، بدل التعبير الاسمي المتكلّف «كل توقع».
- source_word: τοῦ λαοῦ τῶν Ἰουδαίων
  choice: شعب اليهود
  rationale: ينقل التركيب الإضافي بوضوح وطبيعية، من غير صياغة عربية خشنة.
theological_decisions:
- issue: مرجع κύριος
  choice: الرب
  alternative: الله؛ أو الرب يسوع القائم
  rationale: لا يحدد النص اليوناني المرجع صراحة، لذلك تُحفظ لفظة «الرب» والتوتر الدلالي بدل تفسيرها داخل الترجمة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «عاد إلى وعيه» بوصفه تعبيرًا طبيعيًّا، وحُفظت صورة «يد هيرودس» مع شرحها في الحاشية. وُضع كل مؤشر حاشية في المتن في الموضع الذي يخصه.
