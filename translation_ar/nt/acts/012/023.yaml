base_translation:
  language: en
  yaml_path: translation/nt/acts/012/023.yaml
  text: Immediately an angel of the Lord struck him[a], because he did not give the glory to God, and becoming worm-eaten[c][b], he died.
translation:
  language: ar
  text: وفي الحال ضربه ملاكٌ من عند الرب، لأنه لم يُعطِ المجد لله، فصار مأكولًا من الدود[a]، ومات[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فأكله الدود».'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «ولفظ أنفاسه الأخيرة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραχρῆμα
  choice: وفي الحال
  rationale: ينقل معنى وقوع الحدث بلا إبطاء، وهو تعبير عربي فصيح وواضح يحافظ على فجائية القضاء.
- source_word: ἐπάταξεν
  choice: ضربه
  rationale: يحافظ على المعنى المباشر للفعل من غير إضافة نتيجة مثل «صرعه»، إذ يذكر الموت لاحقًا صراحة.
- source_word: ἄγγελος κυρίου
  choice: ملاكٌ من الرب
  rationale: غياب أداة التعريف عن «ملاك» يرجّح التنكير، و«من الرب» صياغة عربية طبيعية للعلاقة التي تعبّر عنها الإضافة اليونانية.
- source_word: ἀνθ’ ὧν
  choice: لأنه
  rationale: يؤدي القوة السببية للتعبير اليوناني بوضوح وإيجاز.
- source_word: οὐκ ἔδωκεν τὴν δόξαν τῷ θεῷ
  choice: لم يُعطِ المجد لله
  rationale: يحافظ على صورة إعطاء المجد وعلى تعريف «المجد» في اليونانية، مع ترتيب عربي طبيعي.
- source_word: γενόμενος
  choice: فصار
  rationale: ينقل التحول الذي يدل عليه اسم الفاعل ويصل النتيجة بما قبلها من غير فرض تحديد زمني أدق مما يقدمه النص.
- source_word: σκωληκόβρωτος
  choice: مأكولًا من الدود
  rationale: ترجمة مباشرة وواضحة للصفة المركبة، وتحافظ على صورتها الحسية القوية.
- source_word: ἐξέψυξεν
  choice: ومات
  rationale: يؤدي المعنى الاصطلاحي للفعل بعبارة عربية معاصرة طبيعية؛ ويمكن حرفيًا التعبير عنه بأنه «لفظ أنفاسه الأخيرة».
theological_decisions:
- issue: طبيعة القضاء المذكور وتسلسله
  choice: يعرض النص موت هيرودس بوصفه قضاءً من الله نفّذه ملاك، مع إبقاء العلاقة الزمنية الدقيقة بين الضربة وصيرورته مأكولًا من الدود وموته غير محددة بأكثر مما يقوله التركيب.
  alternative: اعتبار الوصف مجرد تفسير ديني لموت طبيعي، أو الجزم بأن الموت وقع لحظة ضربة الملاك.
  rationale: ينسب النص الضرب صراحة إلى ملاك من الرب ويذكر عدم إعطاء المجد لله سببًا له، لكنه لا يقدم تشخيصًا طبيًا ولا جدولًا زمنيًا تفصيليًا ينبغي للترجمة أن تضيفه.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة ومهيبة، مع الحفاظ على إيجاز النص وتسلسله التصويري. استُعمل «الدود» اسمَ جنس جمعيًا طبيعيًا في العربية، وتُركت كيفية الحدث ومدته دون تفسير زائد.
