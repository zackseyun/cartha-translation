source:
  edition: SBLGNT
  text: κατασείσας δὲ αὐτοῖς τῇ χειρὶ σιγᾶν διηγήσατο αὐτοῖς πῶς ὁ κύριος αὐτὸν ἐξήγαγεν ἐκ τῆς φυλακῆς, εἶπέν ⸀τε· Ἀπαγγείλατε Ἰακώβῳ καὶ τοῖς ἀδελφοῖς ταῦτα. καὶ ἐξελθὼν ἐπορεύθη εἰς ἕτερον τόπον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/017.yaml
  text: But motioning to them with his hand to be silent[a], he explained to them how the Lord had brought him out of the prison. And he said, “Report these things to James and to the brothers.” Then he departed and went to another place.
translation:
  language: ar
  text: 'فأشار إليهم بيده أن يصمتوا، ثم روى لهم كيف أخرجه الرب من السجن. وقال: «أخبروا يعقوب والإخوة بهذه الأمور».[a] ثم خرج وذهب إلى مكان آخر.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الإخوة والأخوات»؛ فاليونانية تقول «الإخوة»، وقد يُراد بها في هذا السياق جماعة المؤمنين الأوسع.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατασείσας ... τῇ χειρὶ σιγᾶν
  choice: أشار إليهم بيده أن يصمتوا
  rationale: ينقل الإيماءة باليد وغايتها، أي إسكات الحاضرين، بعبارة عربية طبيعية من غير تحديد هيئة الإشارة أكثر مما يحدده النص.
- source_word: διηγήσατο
  choice: روى لهم
  rationale: الفعل يدل على سرد ما جرى وبيانه؛ و«روى» يلائم سياق إخبار بطرس بتفاصيل خروجه.
- source_word: πῶς
  choice: كيف
  rationale: يحفظ طريقة عرض مضمون الرواية في اليونانية من غير تحويلها إلى مجرد تقرير باستخدام «أن».
- source_word: ὁ κύριος
  choice: الرب
  rationale: يحافظ على اللقب كما ورد، من غير حسم هل المقصود به هنا الرب يسوع تحديدًا أم الإشارة الإلهية الأوسع.
- source_word: ἐξήγαγεν ἐκ τῆς φυλακῆς
  choice: أخرجه ... من السجن
  rationale: ترجمة مباشرة وطبيعية لفعل الإخراج من موضع الحبس.
- source_word: Ἀπαγγείλατε
  choice: أخبروا
  rationale: أمر بنقل الخبر إلى آخرين، و«أخبروا» واضحة وطبيعية في العربية المعاصرة.
- source_word: Ἰακώβῳ
  choice: يعقوب
  rationale: الصيغة العربية الكتابية المألوفة للاسم اليوناني Ἰάκωβος/Ἰακώβ.
- source_word: τοῖς ἀδελφοῖς
  choice: الإخوة
  rationale: يحافظ على الجمع المذكر الوارد في النص؛ وقد يشمل في السياق جماعة المؤمنين الأوسع، وهو ما توضحه الحاشية.
- source_word: ἐξελθὼν ἐπορεύθη
  choice: خرج وذهب
  rationale: 'يحفظ الفعلين المتتابعين: مغادرة الموضع ثم التوجه إلى موضع آخر.'
- source_word: εἰς ἕτερον τόπον
  choice: إلى مكان آخر
  rationale: يحافظ على عدم تحديد المكان وعلى معنى الانتقال إلى موضع مختلف.
theological_decisions:
- issue: مرجع لقب κύριος
  choice: الرب
  alternative: الرب يسوع تحديدًا، أو الله بمعنى أعم
  rationale: النص لا يحدد المرجع بأكثر من لقب «الرب»، لذلك تُحفظ صياغته والتوتر الدلالي من غير إضافة تفسير عقائدي.
- issue: مدلول τοῖς ἀδελφοῖς
  choice: الإخوة مع حاشية لاحتمال شمول جماعة المؤمنين
  alternative: الإخوة والأخوات، أو المؤمنون
  rationale: الصيغة اليونانية جمع مذكر، لكن الاستعمال قد يدل سياقيًا على الجماعة المؤمنة الأوسع؛ لذا أبقي اللفظ في المتن وذُكر الاحتمال في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وذات نبرة سردية وقورة. وُضعت علامة الحاشية بعد الجملة التي ترد فيها كلمة «الإخوة» لتبيين موضعها بوضوح.
