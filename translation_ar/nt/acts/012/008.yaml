  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: εἶπεν ⸀δὲ ὁ ἄγγελος πρὸς αὐτόν· ⸀Ζῶσαι καὶ ὑπόδησαι τὰ σανδάλιά σου· ἐποίησεν δὲ οὕτως. καὶ λέγει αὐτῷ· Περιβαλοῦ τὸ ἱμάτιόν σου καὶ ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/008.yaml
  text: And the angel said to him[a], “Tie on your belt and put on your sandals.” And he did so. And he says to him[c][b], “Put on your cloak and follow me.”
translation:
  language: ar
  text: 'فقال له الملاك: «اشدد حزامك[a] وانتعل نعليك». ففعل كذلك. ثم يقول له[b]: «التفَّ بردائك[c] واتبعني».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «تمنطق». يشير الأمر اليوناني إلى شد الحزام استعدادًا للحركة.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «يقول». استُعمل المضارع التاريخي لإضفاء الحيوية على السرد.'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «ألقِ رداءك حولك».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελος
  choice: الملاك
  rationale: السياق يتحدث عن كائن سماوي ظهر في السجن، لذا فـ«الملاك» أدق من المعنى العام «الرسول».
- source_word: Ζῶσαι
  choice: اشدد حزامك
  rationale: صيغة الأمر تعني أن يشد المرء حزامه استعدادًا للحركة؛ وهذه عبارة عربية واضحة تحفظ صورة الفعل الأصلية.
- source_word: ὑπόδησαι τὰ σανδάλιά σου
  choice: انتعل نعليك
  rationale: «انتعل» تعبير عربي طبيعي وموجز عن لبس النعلين، ويحافظ على ذكر نوع الحذاء الوارد في الأصل.
- source_word: ἐποίησεν δὲ οὕτως
  choice: ففعل كذلك
  rationale: تنقل بإيجاز امتثال بطرس للأمرين السابقين.
- source_word: λέγει
  choice: يقول
  rationale: يحفظ المضارع التاريخي في اليونانية وما يضفيه من حيوية على السرد.
- source_word: Περιβαλοῦ τὸ ἱμάτιόν σου
  choice: التفَّ بردائك
  rationale: الفعل يدل على إلقاء الثوب حول الجسد أو التلفف به، وἱμάτιον هنا هو الثوب الخارجي أو الرداء.
- source_word: ἀκολούθει μοι
  choice: اتبعني
  rationale: مقابل مباشر وطبيعي يحفظ أيضًا الصلة اللفظية بفكرة الاتباع المتكررة في العهد الجديد.
theological_decisions: []
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «انتعل نعليك» و«التفَّ بردائك» لسلامتهما وطبيعتهما في العربية، مع إبقاء المضارع التاريخي «يقول» وإيضاحه في الحاشية.
