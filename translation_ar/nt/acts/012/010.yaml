  source_fidelity: 'النص العربي ينقل تسلسل الأفعال اليوناني بدقة: اجتياز موضعي الحراسة، الوصول إلى البوابة الحديدية المؤدية إلى المدينة، انفتاحها من تلقاء نفسها، الخروج والتقدم مقدار شارع، ثم مفارقة الملاك لبطرس. وصيغة التثنية مناسبة إلى أن يعود الضمير المفرد في «فارقه» إلى بطرس، كما في αὐτοῦ.'
  naturalness: الصياغة فصحى معاصرة وواضحة. «نقطة الحراسة» و«مسافة شارع واحد» تعبيران مفهومـان في السياق، ويحافظان على المقصود المكاني من غير إغراق في التفسير.
  terminology: «البوابة الحديدية»، «المؤدية إلى المدينة»، و«من تلقاء نفسها» اختيارات دقيقة وطبيعية. لا تضيف العبارة تفسيرًا آليًا أو لاهوتيًا لطبيعة الانفتاح. كما أن «نقطة الحراسة» تؤدي المعنى السياقي لـ φυλακή على نحو أوضح من حملها على سجن مستقل.
