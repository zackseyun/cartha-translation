id: ACT.12.10
reference: Acts 12:10
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: διελθόντες δὲ πρώτην φυλακὴν καὶ δευτέραν ἦλθαν ἐπὶ τὴν πύλην τὴν σιδηρᾶν τὴν φέρουσαν εἰς τὴν πόλιν, ἥτις αὐτομάτη ἠνοίγη αὐτοῖς, καὶ ἐξελθόντες προῆλθον ῥύμην μίαν, καὶ εὐθέως ἀπέστη ὁ ἄγγελος ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/010.yaml
  text: After they had passed the first guard and the second[a], they came to the iron gate leading into the city, which opened to them by itself; and after they went out, they went along one street[b], and immediately the angel departed from him.
translation:
  language: ar
  text: وبعدما اجتازا نقطة الحراسة الأولى والثانية، وصلا إلى البوابة الحديدية المؤدية إلى المدينة، فانفتحت لهما من تلقاء نفسها[a]. ثم خرجا وتقدَّما مسافة شارع واحد[b]، وفي الحال فارقه الملاك.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فانفتحت لهما بذاتها».'
    reason: lexical_alternative
  - marker: b
    text: يرجَّح أن المقصود أنهما تقدَّما مقدار شارع واحد قبل أن يفارق الملاك بطرس.
    reason: cultural_note
lexical_decisions:
- source_word: διελθόντες
  choice: وبعدما اجتازا
  rationale: اسم الفاعل الماضي يدل على فعل تم قبل الوصول إلى البوابة؛ وصيغة التثنية طبيعية في العربية لأن الفاعلين هما بطرس والملاك.
- source_word: φυλακὴν
  choice: نقطة الحراسة
  rationale: السياق يدل على موضعين متتاليين للحراسة أو حاجزين أمنيين، لا على سجنين مستقلين؛ وإضافة «نقطة» توضّح المقصود في العربية.
- source_word: πύλην τὴν σιδηρᾶν
  choice: البوابة الحديدية
  rationale: ينقل مادة البوابة بعبارة عربية مباشرة وطبيعية.
- source_word: τὴν φέρουσαν εἰς τὴν πόλιν
  choice: المؤدية إلى المدينة
  rationale: يصف موقع البوابة ووظيفتها بوصفها منفذًا إلى داخل المدينة.
- source_word: αὐτομάτη
  choice: من تلقاء نفسها
  rationale: ينقل معنى انفتاح البوابة بذاتها من غير أن يوحي بآلية تقنية حديثة، ويترك الطابع العجيب للحدث كما يورده النص.
- source_word: ἐξελθόντες προῆλθον
  choice: ثم خرجا وتقدَّما
  rationale: 'يحافظ على تعاقب الفعلين: الخروج أولًا ثم مواصلة السير إلى الأمام.'
- source_word: ῥύμην μίαν
  choice: مسافة شارع واحد
  rationale: يفهم النصب هنا على امتداد المسافة؛ وهذه الصياغة أوضح من عبارة قد توحي بأنهما سارا داخل شارع بعينه دون بيان مقدار التقدم.
- source_word: εὐθέως ἀπέστη ὁ ἄγγελος ἀπ’ αὐτοῦ
  choice: وفي الحال فارقه الملاك
  rationale: يحفظ الفورية والانتقال من الفاعل المثنى إلى انفصال الملاك عن بطرس وحده.
theological_decisions:
- issue: طبيعة انفتاح البوابة
  choice: فانفتحت لهما من تلقاء نفسها
  alternative: فانفتحت لهما بذاتها
  rationale: يصف النص الحدث العجيب من غير أن يحدد آليته؛ لذلك تتجنب الصياغة إيحاء الفتح الميكانيكي الحديث أو إضافة تفسير غير مذكور.
- issue: مدلول φυλακή
  choice: نقطة الحراسة الأولى والثانية
  alternative: الحرس الأول والثاني
  rationale: يشير السياق إلى اجتياز موضعي حراسة متتابعين أثناء الهروب، والصياغة المختارة توضح ذلك من غير أن تجعل اللفظة تعني سجنين.
translation_notes:
  register: العربية فصحى معاصرة واضحة ووقورة. استُخدمت صيغة التثنية حيث يذكر اليوناني فعل بطرس والملاك معًا، ثم عاد التعبير إلى المفرد عند مفارقة الملاك لبطرس. وُضعت علامة الحاشية [a] عند العبارة التي تشرحها، لا بعد ذكر الحراسة.
