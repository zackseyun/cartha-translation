  yaml_path: translation/nt/acts/012/005.yaml
  text: So Peter was being kept in the prison[a], but earnest prayer was being made to God by the church for him.
translation:
  language: ar
  text: فكان بطرسُ محتجزًا في السجن، أمّا الكنيسة فكانت تصلّي إلى الله من أجله بإلحاح.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بحرارة»؛ فقد تدل الكلمة اليونانية على شدة الصلاة أو المواظبة عليها.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐτηρεῖτο
  choice: كان محتجزًا
  rationale: ينقل المبني للمجهول والاستمرار في الماضي، من غير أن يضيف إلى النص وصفًا تفصيليًا لطريقة الحراسة.
- source_word: φυλακῇ
  choice: في السجن
  rationale: ترجمة طبيعية للمكان المعيّن الذي كان بطرس محبوسًا فيه، وبصياغة عربية فصيحة مألوفة.
- source_word: προσευχὴ ... ἦν ... γινομένη
  choice: كانت ترفع الصلاة
  rationale: صياغة عربية طبيعية تحافظ على معنى الصلاة المستمرة، وتتجنب التعبير الحرفي غير المألوف «كانت الصلاة تصير».
- source_word: ἐκτενῶς
  choice: بإلحاح
  rationale: يفيد شدة الصلاة ومواظبتها معًا، ويحفظ المجال الدلالي الذي قد يشير إلى الحماسة أو الاستمرار.
- source_word: ὑπὸ τῆς ἐκκλησίας
  choice: أمّا الكنيسة فكانت
  rationale: تحويل المبني للمجهول اليوناني إلى تركيب عربي طبيعي مع إبقاء الكنيسة بوصفها الجماعة التي تصلّي، من غير دلالة مؤسسية زائدة.
- source_word: πρὸς τὸν θεὸν
  choice: إلى الله
  rationale: ينقل اتجاه الصلاة نحو الله بعبارة عربية مألوفة.
- source_word: περὶ αὐτοῦ
  choice: من أجله
  rationale: يوضح معنى الصلاة الشفاعية لبطرس بصورة طبيعية، من غير توسيع للمعنى.
- source_word: μὲν οὖν ... δὲ
  choice: فـ... أمّا... فـ
  rationale: يحفظ التقدم السردي والمقابلة بين احتجاز بطرس وصلاة الكنيسة بأسلوب عربي واضح.
theological_decisions:
- issue: ترجمة ἐκκλησία
  choice: الكنيسة
  alternative: الجماعة / جماعة المؤمنين
  rationale: يشير اللفظ هنا إلى جماعة المسيحيين التي كانت تصلّي من أجل بطرس. «الكنيسة» هي المقابل العربي الكتابي المستقر، ولا تستلزم في هذا السياق مفهومًا طائفيًا أو مؤسسيًا لاحقًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «محتجزًا» للمحافظة على استمرار فعل الحبس من غير الإفراط في تحديد الحراسة، و«ترفع الصلاة» لتقديم تركيب عربي طبيعي مع إبراز دوام الصلاة. وُضعت علامة الحاشية بعد الجملة التي تتعلق بها.
