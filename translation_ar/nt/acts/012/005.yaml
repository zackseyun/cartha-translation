  terminology: «بطرس»، و«السجن»، و«الكنيسة»، و«الله»، و«من أجله» اختيارات مناسبة وثابتة. «بإلحاح» اختيار مقبول لـ ἐκτενῶς، مع احتفاظ الحاشية بإمكان دلالة الشدة («بحرارة»).
