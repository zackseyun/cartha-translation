  to: فكان بطرسُ محتجزًا في السجن، أمّا الكنيسة فكانت تصلّي إلى الله من أجله بإلحاح.[a]
  rationale: استُبدلت عبارة «كانت ترفع الصلاة» بـ«كانت تصلّي» لتكون الترجمة أكثر طبيعية في العربية الفصحى الحديثة، مع إبقاء الاستمرار الماضي، والفاعل الجماعي، واتجاه الصلاة إلى الله، ومعنى الشفاعة من أجل بطرس. لم يُضف إلى النص أي تفسير لاهوتي أو تفصيل غير وارد في المصدر.
