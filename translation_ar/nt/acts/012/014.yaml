  text: καὶ ἐπιγνοῦσα τὴν φωνὴν τοῦ Πέτρου ἀπὸ τῆς χαρᾶς οὐκ ἤνοιξεν τὸν πυλῶνα, εἰσδραμοῦσα δὲ ἀπήγγειλεν ἑστάναι τὸν Πέτρον πρὸ τοῦ πυλῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/014.yaml
  text: And when she recognized Peter’s voice[a], because of her joy she did not open the gate[b], but ran in and reported that Peter was standing at the gate.
translation:
  language: ar
  text: ولمّا تعرّفت إلى صوت بطرس، لم تفتح البوابة من شدّة فرحها، بل ركضت إلى الداخل وأبلغتهم بأن بطرس واقف أمام البوابة.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιγνοῦσα
  choice: عرفت
  rationale: يفيد الفعل أنها ميّزت صوت بطرس وتعرّفت إليه عند سماعه، و«عرفت صوت» تعبير عربي طبيعي واضح.
- source_word: τὴν φωνὴν τοῦ Πέτρου
  choice: صوت بطرس
  rationale: الصوت هنا صوت شخص يتكلم عند المدخل، لا مجرد صوت أو ضجيج.
- source_word: ἀπὸ τῆς χαρᾶς
  choice: من شدّة فرحها
  rationale: تفيد العبارة اليونانية السببية، وهذه الصياغة تنقل أن فرحها الشديد كان سبب عدم فتحها الباب.
- source_word: οὐκ ἤνοιξεν
  choice: لم تفتح
  rationale: ينص المصدر على الفتح دون تحديد أنها لم تفتح القفل، فلا تُضاف آلية غير مذكورة.
- source_word: τὸν πυλῶνα / τοῦ πυλῶνος
  choice: الباب
  rationale: يشير πυλών هنا إلى مدخل العقار الخارجي من الشارع؛ و«الباب» طبيعي في العربية في هذا السياق، مع أن «البوابة» ممكنة بحسب هيئة المدخل.
- source_word: εἰσδραμοῦσα
  choice: ركضت إلى الداخل
  rationale: يحفظ معنى الحركة السريعة إلى داخل البيت واتجاهها، ويصون حيوية السرد.
- source_word: ἀπήγγειλεν
  choice: أخبرتهم
  rationale: الفعل يفيد الإبلاغ أو الإعلان، والضمير مفهوم سياقيًا ويجعل العبارة عربية طبيعية من غير تغيير مضمون الخبر.
- source_word: ἑστάναι
  choice: واقف
  rationale: المصدر التام يحمل معنى الحالة القائمة؛ و«واقف» ينقل استمرار وجود بطرس في موضعه.
- source_word: πρὸ τοῦ πυλῶνος
  choice: أمام الباب
  rationale: ينقل πρό مع المضاف إليه دلالة «أمام/قبالة» بدقة أكبر من الاكتفاء بـ«عند»، مع بقاء الأسلوب طبيعيًا.
