  register: صياغة عربية فصحى حديثة، واضحة وكريمة، تحافظ على سرعة المشهد ومفارقته السردية. لم تُضف حواشٍ لأن البدائل المعجمية لا تنشئ غموضًا مؤثرًا في هذه الآية، ولأن الحاشيتين الإنجليزيتين المرفقتين تبدوان متبادلتَي الموضع قياسًا إلى علامتيهما في النص.
