  to: ولمّا تعرّفت إلى صوت بطرس، لم تفتح البوابة من شدّة فرحها، بل ركضت إلى الداخل وأبلغتهم بأن بطرس واقف أمام البوابة.
  rationale: يستبدل النص «الباب» بـ«البوابة» ليحفظ دلالة المدخل الخارجي وتكرار اللفظ نفسه، ويستعمل «تعرّفت إلى صوت» لمعنى التمييز عند السماع. و«أبلغتهم» يعبّر عربيًا بصورة طبيعية عن فعل الإخبار الموجّه إلى من في الداخل، وهو مفهوم من السياق المباشر دون إضافة معلومة جوهرية.
