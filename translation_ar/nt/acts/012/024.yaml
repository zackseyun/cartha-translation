  text: But the word of God continued to grow and multiply[a].
translation:
  language: ar
  text: أمّا كلمةُ الله فكانت تنمو وتتكاثر.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أمّا رسالةُ الله فكانت تنمو وتتكاثر».'
    reason: بديل معجمي لـ«كلمة الله» يحافظ على معنى الفعلين واستمراريتهما في السياق.
lexical_decisions:
- source_word: λόγος
  choice: كلمة
  rationale: تحافظ «كلمة الله» على التعبير اللوقاوي المتكرر وعلى سعته الدلالية بوصفه إعلان الله ورسالته، مع بقاء «رسالة الله» بديلًا سياقيًّا ممكنًا.
- source_word: τοῦ θεοῦ
  choice: الله
  rationale: نُقلت الإضافة اليونانية مباشرةً في التركيب العربي المألوف «كلمة الله»، للدلالة على الكلمة الصادرة من الله والمنسوبة إليه.
- source_word: ηὔξανεν
  choice: كانت تنمو
  rationale: صيغة الماضي الناقص تدل على فعل مستمر أو متدرج؛ ويؤدي تركيب «كانت تنمو» هذا المعنى طبيعيًّا.
- source_word: ἐπληθύνετο
  choice: تتكاثر
  rationale: يحفظ الفعل معنى الازدياد والانتشار المتميز من «تنمو»، كما يحافظ على الصورة التي تُسنَد فيها الحركة إلى كلمة الله نفسها.
- source_word: δὲ
  choice: أمّا ... فـ
  rationale: يُظهر هذا التركيب الانتقال التقابلي مع هلاك هيرودس في السياق السابق، بأسلوب عربي فصيح وطبيعي.
theological_decisions:
- issue: هل تُنقل عبارة «كلمة الله» بصياغة تفسيرية هي «رسالة الله»؟
  choice: كلمة الله
  alternative: رسالة الله
  rationale: تحفظ «كلمة الله» صياغة لوقا المتكررة ورنينها الكتابي والإعلاني من غير حصر λόγος في مضمون الرسالة وحده؛ وتُذكر الصياغة التفسيرية الممكنة في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم «أمّا ... فـ» لإبراز المقابلة السردية، وحُفظ التشخيص البلاغي في إسناد النمو والتكاثر إلى كلمة الله.
