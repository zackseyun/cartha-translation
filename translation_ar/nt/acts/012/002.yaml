- source_word: ἀνεῖλεν
  choice: قتل
  rationale: الفعل ἀναιρέω هنا يدل على إحداث الموت. و«قتل» تعبير عربي واضح ومباشر، من غير أن يضيف إلى الآية معنى الإعدام القضائي صراحةً.
- source_word: δὲ
  choice: الواو في «وقتل»
  rationale: δέ أداة ربط تتابع السرد، وتؤديها الواو طبيعيًا في العربية من غير افتراض تعارض أقوى مما يقتضيه النص.
- source_word: Ἰάκωβον
  choice: يعقوب
  rationale: استُخدم الاسم العربي الكتابي الشائع المقابل للاسم اليوناني Ἰάκωβος.
- source_word: τὸν ἀδελφὸν Ἰωάννου
  choice: أخا يوحنا
  rationale: عبارة بدل أو وصف تعريفي تحدد أيَّ يعقوب هو المقصود، وتحافظ الصياغة على بنية الأصل بإيجاز طبيعي.
- source_word: μαχαίρῃ
  choice: بالسيف
  rationale: الاسم μάχαιρα يعني سيفًا أو سيفًا قصيرًا، وحالة المجرور هنا أداتية؛ لذلك تنقل الباء وسيلة القتل بوضوح.
theological_decisions:
- issue: طبيعة فعل هيرودس
  choice: صيغ الفعل بوصفه قتلًا مباشرًا من غير تحديد أنه إعدام قضائي.
  alternative: «وأعدم يعقوب» لإبراز احتمال أن القتل تم بسلطة رسمية.
  rationale: يقرر الفعل اليوناني أن يعقوب قُتل، ويحدد «بالسيف» الوسيلة. ومع أن السياق الأوسع قد يشير إلى اضطهاد رسمي، فإن هذه الآية وحدها لا تفرض المصطلح القانوني الأخص «أعدم».
