  yaml_path: translation/nt/acts/012/025.yaml
  text: But Barnabas and Saul returned to Jerusalem after completing the ministry, taking along John, who was called Mark.
translation:
  language: ar
  text: أَمَّا بَرْنَابَا وَشَاوُلُ فَرَجَعَا إِلَى أُورُشَلِيمَ[a] بَعْدَ أَنْ أَتَمَّا الْخِدْمَةَ، وَأَخَذَا مَعَهُمَا يُوحَنَّا الْمَدْعُوَّ مَرْقُسَ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ بعض المخطوطات: «مِنْ أُورُشَلِيمَ» بدلًا من «إِلَى أُورُشَلِيمَ».'
    reason: textual_variant
lexical_decisions:
- source_word: ὑπέστρεψαν
  choice: رَجَعَا
  rationale: فعل عربي طبيعي وموجز ينقل معنى الرجوع في صيغة الماضي، مع مطابقة الفاعل المثنى.
- source_word: εἰς Ἰερουσαλήμ
  choice: إِلَى أُورُشَلِيمَ
  rationale: ينقل المعنى المعتاد لحرف الجر εἰς، أي الاتجاه إلى مكان، ملتزمًا بنص SBLGNT المعطى مع إثبات القراءة البديلة في الحاشية.
- source_word: πληρώσαντες τὴν διακονίαν
  choice: بَعْدَ أَنْ أَتَمَّا الْخِدْمَةَ
  rationale: صياغة عربية واضحة تنقل سبق إتمام الخدمة على الرجوع، وتحافظ على عموم διακονία دون تخصيصها صراحةً بالإغاثة.
- source_word: διακονίαν
  choice: الْخِدْمَةَ
  rationale: «الخدمة» تقابل اللفظ اليوناني الواسع بصورة طبيعية، ولا تُدخل في المتن تفسير «مهمة الإغاثة» المستفاد من السياق.
- source_word: συμπαραλαβόντες
  choice: وَأَخَذَا مَعَهُمَا
  rationale: تعبير عربي مألوف يوضح أن يوحنا رافقهما، مع الحفاظ على كون الفعل تابعًا للحدث الرئيس.
- source_word: Ἰωάννην τὸν ἐπικληθέντα Μᾶρκον
  choice: يُوحَنَّا الْمَدْعُوَّ مَرْقُسَ
  rationale: ترجمة شفافة للاسم والوصف المبني للمجهول، من غير إضافة «أيضًا» التي لا يصرح بها اليوناني.
theological_decisions:
- issue: الاختلاف النصي في جهة الرجوع
  choice: إلى أورشليم
  alternative: من أورشليم
  rationale: النص اليوناني المعطى في SBLGNT يقرأ εἰς Ἰερουσαλήμ، أي «إلى أورشليم». ولأن قراءة «من أورشليم» مؤثرة في معنى الآية وتنسجم ظاهريًا مع السياق السابق، أُثبتت في الحاشية بدل حسم الإشكال داخل المتن.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُعملت الأسماء الكتابية العربية الشائعة، وحُفظ عموم «الخدمة» والاختلاف النصي دون تفسير زائد.
