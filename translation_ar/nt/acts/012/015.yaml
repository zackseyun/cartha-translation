  text: οἱ δὲ πρὸς αὐτὴν εἶπαν· Μαίνῃ. ἡ δὲ διϊσχυρίζετο οὕτως ἔχειν. οἱ δὲ ἔλεγον· Ὁ ἄγγελός ⸂ἐστιν αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/015.yaml
  text: But they said to her[a], “You are out of your mind.” But she kept insisting that it was so. And they kept saying, “It is his angel.”
translation:
  language: ar
  text: 'فقالوا لها: «أنتِ تهذين!» لكنها ظلّت تؤكد أن الأمر كذلك. فظلّوا يقولون: «إنه ملاكه[a]»‏.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو ربما: «ملاكه الحارس»، أو «الملاك الذي يمثله»؛ ويرى بعض المفسرين أن المقصود «روحه» أو «شبحه». واليونانية تقول ببساطة: «ملاكه».'
    reason: alternative_reading
lexical_decisions:
- source_word: Μαίνῃ
  choice: أنتِ تهذين
  rationale: ينقل الاتهام الاصطلاحي بفقدان الصواب بقوة ووضوح في العربية المعاصرة، من غير استعمال وصف سريري مثل «مجنونة».
- source_word: διϊσχυρίζετο
  choice: ظلّت تؤكد
  rationale: صيغة الماضي الناقص تدل على الاستمرار، والفعل نفسه يفيد التأكيد الشديد؛ لذلك تنقل العبارة إصرارها المتواصل.
- source_word: οὕτως ἔχειν
  choice: أن الأمر كذلك
  rationale: 'تعبير عربي طبيعي يحافظ على المعنى الاصطلاحي: أن الحال هو كما قالت.'
- source_word: ἔλεγον
  choice: ظلّوا يقولون
  rationale: يحافظ على دلالة الماضي الناقص، أي استمرارهم أو تكرارهم القول.
- source_word: ἄγγελός
  choice: ملاكه
  rationale: «ملاك» هو المعنى الأنسب سياقيًا، مع إبقاء العبارة موجزة كما في اليونانية وعدم تفسير طبيعة هذا الملاك في المتن.
- source_word: αὐτοῦ
  choice: ـه
  rationale: نُقل ضمير الملكية بالمضاف إليه المتصل في «ملاكه»، وهو التعبير العربي الطبيعي المقابل لـ«ملاكُه/ملاكٌ له».
theological_decisions:
- issue: معنى «ملاكه»
  choice: الإبقاء على العبارة «ملاكه» بلا توسع تفسيري
  alternative: ملاكه الحارس؛ الملاك الذي يمثله؛ روحه أو شبحه
  rationale: النص اليوناني يقول فقط «ملاكه» ولا يحدد الاعتقاد المقصود. والإبقاء على اللفظ يحفظ الغموض والتوتر اللاهوتي ولا يفرض إطارًا عقائديًا بعينه.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «تهذين» بوصفه اتهامًا مباشرًا بفقدان الصواب، مع الحفاظ على استمرارية الفعلين بصيغة «ظلّت/ظلّوا»، وعلى غموض عبارة «ملاكه».
