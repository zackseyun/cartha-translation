lexical_decisions:
- source_word: κρούσαντος δὲ αὐτοῦ
  choice: ولما قرع
  rationale: تنقل «لما» القوة الزمنية لاسم الفاعل اليوناني في سياق التعاقب القصصي، وتؤدي الواو وظيفة δέ الانتقالية دون تكلّف.
- source_word: θύραν τοῦ πυλῶνος
  choice: باب المدخل
  rationale: 'يحفظ التعبير الاسمين: θύρα «باب» وπυλών «مدخل/دهليز البوابة»، ويشير طبيعيًا إلى باب المدخل الخارجي للبيت.'
- source_word: προσῆλθε
  choice: جاءت
  rationale: فعل طبيعي في هذا السياق المنزلي، وتوضح عبارة الغرض اللاحقة سبب مجيئها.
- source_word: παιδίσκη
  choice: جارية
  rationale: لفظ عربي موجز يفيد فتاة تخدم في البيت، ويمكن أن يدل تاريخيًا على أَمَة؛ لذا تُحفظ دلالة الرق الممكنة في الحاشية.
- source_word: ὑπακοῦσαι
  choice: لتجيب
  rationale: المعنى السياقي للفعل هنا هو الاستجابة لمن يقرع الباب، لا مجرد السماع أو الطاعة.
- source_word: ὀνόματι Ῥόδη
  choice: اسمها رودا
  rationale: صياغة عربية طبيعية للتعريف باسم الشخص، مع نقل الاسم اليوناني Ῥόδη إلى «رودا».
