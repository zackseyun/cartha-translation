  text: And the crowd kept shouting[a], “The voice of a god, and not of a man!”
translation:
  language: ar
  text: 'وكان الجمهور يهتف: «صوتُ إلهٍ لا صوتُ إنسانٍ!»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δῆμος
  choice: الجمع
  rationale: يدل هنا على جمهور الناس المحتشدين، لا على هيئة سياسية رسمية؛ و«الجمع» تعبير عربي واضح يلائم مشهد الهتاف العلني.
- source_word: ἐπεφώνει
  choice: يواصل الهتاف
  rationale: صيغة الماضي الناقص اليونانية تفيد الاستمرار أو التكرار، فنقلها هذا التعبير بدل فعل ماضٍ بسيط.
- source_word: Θεοῦ
  choice: إلهٍ
  rationale: السياق وثني والجمهور يضفي على هيرودس صفة إلهية؛ والنكرة العربية «إلهٍ» تحفظ هذا المعنى من غير أن توهم الإشارة الحصرية إلى الله إله إسرائيل.
- source_word: φωνὴ
  choice: صوتُ
  rationale: تحافظ «صوت» على التعبير الاسمي المباشر وعلى المقابلة بين مصدر الصوت الإلهي والبشري.
- source_word: ἀνθρώπου
  choice: إنسان
  rationale: تنقل الاسم المفرد في المقابلة المباشرة مع «إله»، وهي في العربية أفصح وأعم من «رجل» في هذا السياق.
theological_decisions:
- issue: هل تُفهم Θεοῦ بمعنى «الله» أم «إله»؟
  choice: إلهٍ
  alternative: الله
  rationale: غياب أداة التعريف وحده لا يحسم المعنى في اليونانية، لكن سياق جمهور وثني يجامِل هيرودس بتكريم إلهي يرجّح «إله». وأُبقيت القراءة الأخرى في الحاشية حفاظًا على الاحتمال اللغوي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُعمل «يواصل الهتاف» لإظهار الاستمرار، و«هذا» لإتمام الجملة الاسمية التعجبية طبيعيًا في العربية من غير تغيير مضمونها.
