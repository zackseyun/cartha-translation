  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «بقلب واحد» لإبراز وحدة القصد، و«الصلح» للسياق الدبلوماسي، وحُفظت دلالة الاستمرار في ᾐτοῦντο بصيغة «أخذوا يطلبون». وُضعت جميع علامات الحواشي في مواضعها داخل المتن.
