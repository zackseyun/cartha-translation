  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Ἦν ⸀δὲ θυμομαχῶν Τυρίοις καὶ Σιδωνίοις· ὁμοθυμαδὸν δὲ παρῆσαν πρὸς αὐτόν, καὶ πείσαντες Βλάστον τὸν ἐπὶ τοῦ κοιτῶνος τοῦ βασιλέως ᾐτοῦντο εἰρήνην διὰ τὸ τρέφεσθαι αὐτῶν τὴν χώραν ἀπὸ τῆς βασιλικῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/020.yaml
  text: He was very angry with the Tyrians and Sidonians[a]. But they came to him with one accord, and after persuading Blastus, the king’s chamberlain, they were asking for peace[d][c][b], because their country was fed from the king’s domain.
translation:
  language: ar
  text: وكان شديد الغضب على أهل صور وصيدا[a]. فجاؤوا إليه بقلب واحد، وبعدما استمالوا بلاستُس، المشرف على مخدع الملك[b]، أخذوا يطلبون الصلح، لأن بلادهم كانت تستمد غذاءها من أراضي الملك[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وكان يعادي أهل صور وصيدا بشدة». يدل اللفظ اليوناني على غضب شديد أو عداوة حادة.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «المشرف على مخدع الملك»، أي على الأرجح موظف في البلاط يستطيع الوصول إلى أجنحة الملك الخاصة.'
    reason: cultural_note
  - marker: c
    text: 'أو: «لأن منطقتهم كانت تتلقى إمداداتها الغذائية من الإقليم الملكي».'
    reason: lexical_alternative
lexical_decisions:
- source_word: θυμομαχῶν
  choice: شديد الغضب على
  rationale: ينقل شدة الغضب والعداء التي يدل عليها الفعل اليوناني، بصياغة عربية طبيعية، من غير حصر المعنى في قتال فعلي.
- source_word: Τυρίοις καὶ Σιδωνίοις
  choice: أهل صور وصيدا
  rationale: اللفظان اسما نسبة لسكان المدينتين، و«أهل صور وصيدا» أوضح وأشيع في العربية من صيغتي النسبة.
- source_word: ὁμοθυμαδόν
  choice: بقلب واحد
  rationale: يحفظ معنى وحدة القصد والإرادة، لا مجرد مجيئهم معًا.
- source_word: παρῆσαν πρὸς αὐτόν
  choice: جاؤوا إليه
  rationale: تعبير عربي مباشر يدل على حضورهم ومثولهم لديه.
- source_word: πείσαντες
  choice: بعدما استمالوا
  rationale: يفيد أنهم كسبوا بلاستُس إلى جانبهم أو ضمنوا مساعدته، ويحفظ سبق هذا الفعل لطلب الصلح.
- source_word: Βλάστον
  choice: بلاستُس
  rationale: نقل صوتي للاسم الشخصي اليوناني بصيغة عربية واضحة.
- source_word: τὸν ἐπὶ τοῦ κοιτῶνος τοῦ βασιλέως
  choice: المشرف على مخدع الملك
  rationale: يحافظ على صورة الأصل المرتبطة بمخدع الملك، مع إظهار أنه صاحب منصب في البلاط، من غير افتراض وظيفة أدق مما يثبته النص.
- source_word: ᾐτοῦντο εἰρήνην
  choice: أخذوا يطلبون الصلح
  rationale: «الصلح» أنسب للسياق السياسي من السلام العام، و«أخذوا يطلبون» تعكس الاستمرار في صيغة الماضي الناقص.
- source_word: διὰ τὸ τρέφεσθαι αὐτῶν τὴν χώραν
  choice: لأن بلادهم كانت تستمد غذاءها
  rationale: يبيّن سبب طلب الصلح ويحفظ معنى اعتماد المنطقة على مورد غذائي خارجي.
- source_word: ἀπὸ τῆς βασιλικῆς
  choice: من أراضي الملك
  rationale: الصفة اليونانية مستعملة استعمال الاسم وتشير على الأرجح إلى الأراضي أو الإقليم الملكي؛ والصياغة العربية توضح المعنى من دون تكرار «بلاد».
