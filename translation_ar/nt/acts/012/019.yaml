  text: Ἡρῴδης δὲ ἐπιζητήσας αὐτὸν καὶ μὴ εὑρὼν ἀνακρίνας τοὺς φύλακας ἐκέλευσεν ἀπαχθῆναι, καὶ κατελθὼν ἀπὸ τῆς Ἰουδαίας ⸀εἰς Καισάρειαν διέτριβεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/019.yaml
  text: But Herod[a], after searching for him and not finding him, examined the guards and ordered them to be led away to execution. Then he went down from Judea to Caesarea and stayed there.
translation:
  language: ar
  text: أما هيرودس، فبعد أن بحث عنه ولم يجده، استجوب الحراس وأمر أن يُساقوا بعيدًا[a]. ثم نزل من اليهودية إلى قيصرية، وأقام هناك.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «أمر أن يُساقوا بعيدًا». ويرجّح السياق أن المقصود اقتيادهم إلى الإعدام.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιζητήσας
  choice: بعد أن بحث عنه
  rationale: اسم الفاعل اليوناني في صيغة الماضي يدل على فعل سبق الأفعال الرئيسة، وهذه الصياغة العربية تنقل تعمّد البحث وتسلسل الحدث بوضوح.
- source_word: μὴ εὑρὼν
  choice: ولم يجده
  rationale: تنقل النفي والنتيجة المباشرة للبحث بصياغة عربية طبيعية، من غير إضافة إلى معنى النص.
- source_word: ἀνακρίνας
  choice: استجوب
  rationale: الفعل يدل هنا على فحص رسمي أو قضائي، و«استجوب» أوضح في سياق مساءلة الحراس عن هروب السجين.
- source_word: τοὺς φύλακας
  choice: الحراس
  rationale: مقابل عربي واضح وشائع لمن كانوا مكلّفين بحراسة بطرس.
- source_word: ἐκέλευσεν ἀπαχθῆναι
  choice: أمر أن يُساقوا بعيدًا
  rationale: يحافظ على الدلالة الصريحة للفعل، أي الاقتياد أو السوق بعيدًا، من غير إدخال الإعدام في المتن مع أنه مرجح جدًا في السياق؛ وتوضح الحاشية هذا الاحتمال.
- source_word: κατελθὼν
  choice: نزل
  rationale: يحفظ التعبير الجغرافي اليوناني عن الانتقال من اليهودية الداخلية الأعلى إلى قيصرية الساحلية.
- source_word: τῆς Ἰουδαίας
  choice: اليهودية
  rationale: الاسم الجغرافي العربي المألوف للإقليم.
- source_word: Καισάρειαν
  choice: قيصرية
  rationale: الصيغة العربية التقليدية والمستقرة لاسم المدينة.
- source_word: διέτριβεν
  choice: أقام هناك
  rationale: تنقل معنى المكث المستمر الذي تشير إليه صيغة الماضي الناقص، بأسلوب عربي موجز وطبيعي.
theological_decisions:
- issue: هل يُصرَّح بالإعدام في ترجمة ἀπαχθῆναι أم يُحفظ معنى الاقتياد الصريح؟
  choice: أمر أن يُساقوا بعيدًا، مع بيان دلالة السياق في الحاشية
  alternative: أمر أن يُساقوا إلى الإعدام / أمر بقتلهم
  rationale: اليونانية لا تستعمل هنا فعلًا صريحًا للقتل، وإن كان السياق التاريخي والسردي يرجّح أن الاقتياد كان لتنفيذ حكم الإعدام. إبقاء العبارة الأوسع في المتن يحفظ قدرًا حقيقيًا من الغموض، والحاشية تساعد القارئ على إدراك المعنى المرجح.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت أفعال مباشرة وطبيعية مثل «بحث» و«استجوب» و«أقام»، مع الحفاظ على التعبير الجغرافي «نزل». وُضع مؤشر الحاشية مباشرة بعد العبارة التي يشرحها.
