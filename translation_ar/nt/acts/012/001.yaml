  yaml_path: translation/nt/acts/012/001.yaml
  text: About that time Herod the king laid hands on some from the church to mistreat them[a][b][c].
translation:
  language: ar
  text: وفي ذلك الوقت تقريبًا[a]، اتخذ الملك هيرودس إجراءً ضد بعض المنتمين إلى الكنيسة[b] ليسيء إليهم[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وفي ذلك الوقت» أو «في قرابة ذلك الوقت».'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «ألقى يديه على». يدل التعبير هنا على اتخاذ إجراء عدائي ضد بعض المنتمين إلى الكنيسة.'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «ليؤذيهم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατ’ ἐκεῖνον δὲ τὸν καιρόν
  choice: وفي نحو ذلك الوقت
  rationale: 'تفيد κατά مع عبارة الزمن معنى التقريب: «في نحو ذلك الوقت» أو «قرابة ذلك الوقت». ونُقلت δέ بواو انتقال خفيفة تلائم السياق السردي من غير مبالغة في إبرازها.'
- source_word: ἐπέβαλεν ... τὰς χεῖρας
  choice: بطش ... بـ
  rationale: التعبير اليوناني حرفيًا «ألقى يديه على»، لكنه هنا يدل على اتخاذ إجراء عدائي. و«بطش بـ» تعبير عربي واضح يحفظ معنى الاعتداء ولا يضيّقه إلى الاعتقال وحده، مع بيان الصورة الحرفية في الحاشية.
- source_word: Ἡρῴδης ὁ βασιλεύς
  choice: الملك هيرودس
  rationale: صياغة عربية طبيعية تؤدي الاسم واللقب من غير تغيير في هوية الشخص.
- source_word: κακῶσαί
  choice: ليسيء إليهم
  rationale: يدل الفعل على إيقاع السوء أو الأذى. وهذه الصياغة تنقل قصد المعاملة السيئة من غير أن تستورد بالضرورة المعنى الاصطلاحي الأوسع لكلمة «يضطهد».
- source_word: τινας τῶν ἀπὸ τῆς ἐκκλησίας
  choice: بعض المنتمين إلى الكنيسة
  rationale: توضح العبارة أن المقصود بعض الأشخاص المرتبطين بالجماعة المسيحية، وهي أفصح في العربية المعاصرة من النقل الحرفي «بعض الذين من الكنيسة».
theological_decisions:
- issue: ترجمة ἐκκλησία
  choice: الكنيسة
  alternative: الجماعة أو جماعة المؤمنين
  rationale: يشير اللفظ في هذا السياق من سفر أعمال الرسل إلى الجماعة المسيحية. و«الكنيسة» هي المقابل العربي المألوف والملائم هنا، من غير حصره في مبنى.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدم «بطش بـ» لنقل القوة العدائية في التعبير اليوناني بصورة طبيعية، وأُبقيت صورته الحرفية في الحاشية. جميع علامات الحواشي مثبتة في مواضعها في النص.
