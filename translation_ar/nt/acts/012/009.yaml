  text: καὶ ἐξελθὼν ⸀ἠκολούθει, καὶ οὐκ ᾔδει ὅτι ἀληθές ἐστιν τὸ γινόμενον διὰ τοῦ ἀγγέλου, ἐδόκει δὲ ὅραμα βλέπειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/009.yaml
  text: And he went out and followed[a], and he did not know that what was happening through the angel was real, but thought he was seeing a vision.
translation:
  language: ar
  text: فخرج وتبعه، ولم يكن يعلم أن ما كان يحدث بواسطة الملاك[a] حقيقي، بل كان يظن أنه يرى رؤيا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «على يد الملاك». تفيد العبارة اليونانية الوساطة أو الفاعلية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: فخرج
  rationale: اسم الفاعل الظرفي في صيغة الماضي يسبق الفعل الرئيس، ويؤديه العربية طبيعيًا بفعل ماضٍ معطوف يحفظ تتابع الحدث.
- source_word: ἠκολούθει
  choice: وتبعه
  rationale: الفعل الناقص يدل على الاستمرار، لكن السياق الحركي يوضح أن بطرس واصل السير وراء الملاك، وصيغة الماضي العربية هي الأنسب للسرد.
- source_word: οὐκ ᾔδει
  choice: ولم يكن يعلم
  rationale: تعبير عربي مباشر يحفظ معنى انعدام العلم أو الإدراك في أثناء الحدث.
- source_word: ἀληθές
  choice: حقيقي
  rationale: المقصود واقعية ما يجري في مقابل كونه رؤيا، ولذلك «حقيقي» أوضح من «صادق» في هذا السياق.
- source_word: τὸ γινόμενον
  choice: ما كان يحدث
  rationale: يحفظ دلالة اسم الفاعل المعرّف على الحدث الجاري والمستمر.
- source_word: διὰ τοῦ ἀγγέλου
  choice: على يد الملاك
  rationale: تعبير عربي طبيعي يدل على الوساطة أو الفاعلية، ويحفظ دلالة διά مع المضاف إليه من غير تقرير استقلال الملاك بالفعل.
- source_word: ἐδόκει
  choice: ظن
  rationale: ينقل إدراك بطرس أو افتراضه بصورة موجزة وطبيعية.
- source_word: ὅραμα
  choice: رؤيا
  rationale: اللفظ العربي المألوف للمشهد الرؤيوي أو الإعلاني، وهو مناسب للمقابلة مع الواقع الفعلي.
- source_word: βλέπειν
  choice: أنه يرى
  rationale: المضارع بعد «ظن» يصور الخبرة التي اعتقد بطرس أنه يمر بها في تلك اللحظة.
theological_decisions:
- issue: طبيعة فعل الملاك
  choice: على يد الملاك
  alternative: بواسطة الملاك؛ من الملاك
  rationale: يحفظ الاختيار معنى الوساطة أو الفاعلية الممكن في διά مع المضاف إليه، من غير إضافة حكم لاهوتي بشأن قوة الملاك المستقلة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «على يد» استعمالًا فصيحًا طبيعيًا للدلالة على الوساطة، مع إثبات علامة الحاشية في موضعها.
