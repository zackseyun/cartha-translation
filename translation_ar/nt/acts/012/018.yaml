  text: Γενομένης δὲ ἡμέρας ἦν τάραχος οὐκ ὀλίγος ἐν τοῖς στρατιώταις, τί ἄρα ὁ Πέτρος ἐγένετο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/018.yaml
  text: When day came[a], there was no small disturbance among the soldiers over what had become of Peter.
translation:
  language: ar
  text: ولمّا طلع النهار، حدث اضطراب شديد بين الجنود بشأن ما جرى لبطرس.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Γενομένης δὲ ἡμέρας
  choice: ولمّا طلع النهار
  rationale: ترجمة طبيعية للتركيب المطلق في حالة المضاف إليه، مع نقل δέ بواو انتقالية خفيفة، والمحافظة على الدلالة الزمنية دون حرفية متكلفة.
- source_word: τάραχος οὐκ ὀλίγος
  choice: اضطراب شديد
  rationale: التعبير اليوناني قائم على نفي القلة ويدل على اضطراب كبير. الصياغة العربية المباشرة أوضح للقارئ المعاصر، إذ إن «اضطراب غير قليل» أقل سلاسة في العربية.
- source_word: ἐν τοῖς στρατιώταις
  choice: بين الجنود
  rationale: تحافظ «الجنود» على المعنى المعجمي العام، و«بين» تلائم وقوع الاضطراب داخل جماعتهم.
- source_word: τί ἄρα
  choice: بشأن ما
  rationale: تدخل العبارة سؤالًا غير مباشر يحمل معنى الحيرة والاستنتاج؛ و«بشأن ما» تربطه طبيعيًا بالاضطراب.
- source_word: ὁ Πέτρος
  choice: بطرس
  rationale: الصيغة العربية الكتابية المألوفة للاسم الشخصي.
- source_word: ἐγένετο
  choice: جرى لـ
  rationale: في هذا التركيب مع شخص، يفيد الفعل معنى ما حدث له أو ما آل إليه أمره؛ و«ما جرى لبطرس» عربية واضحة تحفظ الاحتمال دون تحديد مصيره.
theological_decisions: []
