  yaml_path: translation/nt/acts/012/003.yaml
  text: And when he saw that it was pleasing to the Jews[a], he proceeded to arrest Peter also[b]. (Now these were the days of Unleavened Bread.)
translation:
  language: ar
  text: ولمّا رأى أن ذلك يُرضي اليهود[a]، مضى فقبض على بطرس أيضًا. (وكان ذلك في أيام الفطير[b].)
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو «أهل اليهودية»، أو بحسب تضييق السياق: «قادة اليهود». واللفظ اليوناني قد يحمل هذه المعاني في بعض السياقات، لكن النص هنا يقول ببساطة: «اليهود».'
    reason: lexical_alternative
  - marker: b
    text: أي أيام عيد الفطير، وهي مناسبة يُؤكل فيها خبز بلا خمير.
    reason: cultural_note
lexical_decisions:
- source_word: ἰδὼν δὲ
  choice: ولمّا رأى
  rationale: اسم الفاعل الماضي يفيد هنا الظرف الزمني السابق للفعل التالي، وصيغة «ولمّا رأى» عربية طبيعية وتحفظ تتابع الأحداث.
- source_word: ἀρεστόν ἐστιν
  choice: أن ذلك يُرضي
  rationale: تنقل معنى كون الأمر مرضيًا أو مقبولًا، مع إظهار مرجع «ذلك» إلى الفعل السابق دون زيادة تفسيرية.
- source_word: τοῖς Ἰουδαίοις
  choice: اليهود
  rationale: هذا هو المقابل المباشر للفظ اليوناني، ولا يضيّق النص نفسه المرجع صراحةً إلى القادة أو إلى سكان اليهودية.
- source_word: προσέθετο συλλαβεῖν
  choice: مضى فقبض على
  rationale: الفعل مع المصدر اصطلاح يفيد المضي في فعل آخر؛ وهذه الصياغة عربية واضحة وتحفظ انتقال هيرودس إلى إجراء تالٍ.
- source_word: καὶ Πέτρον
  choice: على بطرس أيضًا
  rationale: تحفظ «أيضًا» القوة الإضافية، إذ صار بطرس هدفًا آخر بعد يعقوب.
- source_word: ἦσαν δὲ ἡμέραι τῶν ἀζύμων
  choice: وكان ذلك في أيام الفطير
  rationale: تحفظ التسمية العيدية الواردة في اليونانية، وتقدّمها بصياغة عربية طبيعية بوصفها تحديدًا زمنيًا.
theological_decisions:
- issue: دلالة Ἰουδαίοις في سفر أعمال الرسل
  choice: اليهود
  alternative: أهل اليهودية؛ قادة اليهود
  rationale: أُبقي اللفظ العام لأن اليونانية لا تحصر المقصود صراحةً في القادة أو في نطاق جغرافي، مع التنبيه إلى البدائل الممكنة سياقيًا.
- issue: دلالة τῶν ἀζύμων
  choice: أيام الفطير
  alternative: الفصح
  rationale: النص يسمّي أيام الفطير تحديدًا، فلا تُدمج هذه التسمية في «الفصح» رغم الصلة الوثيقة بين المناسبتين.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «قبض على» بوصفه تعبيرًا طبيعيًا عن الاعتقال، وحُفظت تسمية «أيام الفطير» التقليدية الدقيقة مع شرح ثقافي في الحاشية.
