  yaml_path: translation/nt/acts/012/016.yaml
  text: But Peter kept on knocking[a], and when they opened the door[b], they saw him and were astonished.
translation:
  language: ar
  text: أمّا بطرس فظلّ يطرق الباب[a]، فلمّا فتحوا[b] رأوه فدهشوا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «واصل الطرق على الباب»، أو «أصرّ على الطرق».
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «ولمّا فتحوا، رأوه ودهشوا». والمفعول المحذوف مفهوم من سياق الطرق على الباب.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέμενεν κρούων
  choice: ظلّ يطرق الباب
  rationale: يجمع هذا التعبير العربي الطبيعي بين دلالة الاستمرار في الفعل الماضي التي يحملها ἐπέμενεν وبين معنى κρούων في سياق الطرق عند المدخل. أُضيف «الباب» بوصفه مفعولًا مفهومًا من السياق.
- source_word: ἀνοίξαντες
  choice: فلمّا فتحوا
  rationale: صيغ اسم الفاعل الأوريستي هنا في تركيب زمني عربي يوضح تعاقب الحدثين من غير زيادة تفسيرية في المتن.
- source_word: εἶδαν αὐτόν
  choice: رأوه
  rationale: ترجمة مباشرة وطبيعية في السرد، وتحافظ على الضمير العائد إلى بطرس.
- source_word: ἐξέστησαν
  choice: فدهشوا
  rationale: ينقل «دهشوا» شدة المفاجأة والانذهال التي يدل عليها الفعل في هذا السياق، بلغة عربية واضحة غير مبالغ فيها.
- source_word: δὲ
  choice: أمّا ... فـ / فـ
  rationale: يبرز «أمّا» التحول المقابل إلى بطرس بعد المشهد السابق، بينما تصل الفاء الجملة التالية بسلاسة في السرد العربي.
- source_word: Πέτρος
  choice: بطرس
  rationale: الصيغة العربية الكتابية المستقرة للاسم الشخصي.
theological_decisions: []
