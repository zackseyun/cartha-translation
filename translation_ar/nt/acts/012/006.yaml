base_translation:
  language: en
  yaml_path: translation/nt/acts/012/006.yaml
  text: When Herod was about to bring him out[a], on that very night Peter was sleeping between two soldiers, bound with two chains[b], and guards before the door were keeping watch over the prison.
translation:
  language: ar
  text: ولمّا كان هيرودس على وشك أن يُخرجه[a]، كان بطرس في تلك الليلة نفسها نائمًا بين جنديَّين، موثَقًا بسلسلتين، وكان حراسٌ أمام الباب يحرسون السجن[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يُقدِّمه». يمكن أن يدل الفعل اليوناني على اقتياد شخص إلى الخارج للمثول علنًا أو للمحاكمة.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «كانوا يتولّون حراسة السجن».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤμελλεν
  choice: كان ... مزمعًا
  rationale: ينقل دلالة الفعل على قرب وقوع العمل واستعداده، بصياغة عربية فصيحة واضحة.
- source_word: προαγαγεῖν αὐτόν
  choice: أن يُخرجه
  rationale: يفيد إخراج بطرس من الحبس تمهيدًا لإظهاره علنًا أو تقديمه للمحاكمة، مع إبقاء الغرض الدقيق غير محسوم.
- source_word: τῇ νυκτὶ ἐκείνῃ
  choice: في تلك الليلة نفسها
  rationale: تعكس اسم الإشارة والتوكيد السردي في العبارة اليونانية.
- source_word: κοιμώμενος
  choice: نائمًا
  rationale: يعبّر طبيعيًا عن حال بطرس المستمرة في ذلك الوقت.
- source_word: μεταξὺ δύο στρατιωτῶν
  choice: بين جنديَّين
  rationale: ترجمة مكانية مباشرة وطبيعية.
- source_word: δεδεμένος ἁλύσεσιν δυσίν
  choice: موثَقًا بسلسلتين
  rationale: يحافظ على حالة التقييد الناتجة وعلى ذكر وسيلتي التقييد صراحة.
- source_word: φύλακές τε πρὸ τῆς θύρας
  choice: وكان حراس أمام الباب
  rationale: يحفظ موقع الحراس أمام الباب ويصل الجملة بما قبلها على نحو طبيعي.
- source_word: ἐτήρουν τὴν φυλακήν
  choice: يسهرون على حراسة السجن
  rationale: ينقل معنى المراقبة والحراسة المستمرة، مع فهم φυλακή هنا على أنها السجن ضمن السياق.
