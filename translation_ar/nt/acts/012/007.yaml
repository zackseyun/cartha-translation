  text: And behold[a], an angel of the Lord stood near, and a light shone in the cell. Striking Peter on the side, he woke him, saying[b], “Get up quickly.” And his chains fell off from his hands.
translation:
  language: ar
  text: 'وإذا ملاكٌ من عند الرب وقف بجانب بطرس، وأضاء نورٌ في الحجرة[b]. فضرب بطرس في جنبه وأيقظه، قائلًا: «قم سريعًا!» فسقطت سلاسله من يديه.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'يمكن أيضًا: «الغرفة» أو «المكان». اللفظ اليوناني أعم من «الحجرة»، لكن سياق الكلام هو السجن.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: وإذا
  rationale: تنقل أداة لفت الانتباه وتضفي حيوية على ظهور الملاك في السرد، بصياغة عربية فصيحة طبيعية.
- source_word: ἄγγελος κυρίου
  choice: ملاكٌ للرب
  rationale: يحفظ تركيب الإضافة الدال على أن الملاك تابع للرب أو مرسَل منه، من غير زيادة تفسيرية.
- source_word: ἐπέστη
  choice: وقف إلى جانبه فجأةً
  rationale: يجمع بين معنى الوقوف بالقرب ودلالة الحضور المفاجئ الممكنة في الفعل؛ وأُثبتت البدائل في الحاشية حفظًا لاتساع اللفظ.
- source_word: φῶς ἔλαμψεν
  choice: أضاء نورٌ
  rationale: تعبير عربي مباشر وطبيعي يقابل الاسم والفعل ويفيد انتشار الضوء في المكان.
- source_word: ἐν τῷ οἰκήματι
  choice: في الحجرة
  rationale: «الحجرة» تحافظ على عموم اللفظ اليوناني أكثر من «الزنزانة»، مع ملاءمتها لسياق السجن.
- source_word: πατάξας
  choice: فضرب
  rationale: يحفظ القوة الأساسية للفعل الذي يدل على الضرب، ولا يلطّفه إلى مجرد اللمس أو النكز.
- source_word: τὴν πλευρὰν τοῦ Πέτρου
  choice: جنب بطرس
  rationale: مقابل عربي موجز ودقيق للموضع الجسدي المذكور.
- source_word: ἤγειρεν αὐτὸν
  choice: أيقظه
  rationale: السياق يدل على إيقاظ بطرس من النوم، وهو المعنى المقصود هنا من الفعل.
- source_word: Ἀνάστα ἐν τάχει
  choice: قم سريعًا
  rationale: أمر عربي واضح يحفظ الإلحاح والسرعة في العبارة اليونانية.
- source_word: ἐξέπεσαν αὐτοῦ αἱ ἁλύσεις ἐκ τῶν χειρῶν
  choice: فسقطت السلاسل من يديه
  rationale: يحفظ صورة سقوط القيود من اليدين من غير استبدال «المعصمين» التفسيري بلفظ «اليدين» الوارد في الأصل.
theological_decisions:
- issue: ترجمة κύριος في ἄγγελος κυρίου
  choice: الرب
  alternative: السيد
  rationale: «الرب» هو المقابل المعياري في سياق العهد الجديد، ويحفظ الصيغة اللاهوتية المألوفة من غير إضافة تحديد غير مصرّح به في النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة سردية كريمة. استُعملت «وإذا» لإبراز حيوية المشهد، و«الحجرة» لتجنب تضييق دلالة اللفظ اليوناني إلى «زنزانة»، مع توضيح ذلك في الحاشية.
