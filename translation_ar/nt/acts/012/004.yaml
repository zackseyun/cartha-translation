  text: ὃν καὶ πιάσας ἔθετο εἰς φυλακήν, παραδοὺς τέσσαρσιν τετραδίοις στρατιωτῶν φυλάσσειν αὐτόν, βουλόμενος μετὰ τὸ πάσχα ἀναγαγεῖν αὐτὸν τῷ λαῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/004.yaml
  text: After arresting him[a], he put him in prison, handing him over to four squads of soldiers to guard him[b], intending to bring him out to the people after the Passover.
translation:
  language: ar
  text: وبعد أن قبض عليه، أودعه السجن، وسلّمه إلى أربع فرق من الجنود[a] لحراسته، عازمًا أن يُخرجه إلى الشعب بعد الفصح[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «أربع رباعيات من الجنود»، أي أربع مجموعات، في كل مجموعة أربعة جنود.'
    reason: lexical_alternative
  - marker: b
    text: تعني الكلمة اليونانية πάσχα «الفصح»؛ وقد ترجمتها بعض الترجمات الإنجليزية القديمة هنا بلفظ يعني «عيد القيامة».
    reason: alternative_reading
lexical_decisions:
- source_word: πιάσας
  choice: بعد أن قبض عليه
  rationale: ينقل اسم الفاعل الماضي بوصفه فعلًا سابقًا للفعل الرئيس، ويعبّر بوضوح عن إلقاء القبض عليه ووضعه في الحجز.
- source_word: ἔθετο εἰς φυλακήν
  choice: أودعه السجن
  rationale: تعبير عربي فصيح وطبيعي يدل على وضعه في السجن، ويحافظ على النبرة السردية الرسمية.
- source_word: παραδοὺς
  choice: وسلّمه
  rationale: يفيد نقل السجين إلى عهدة الجنود، من غير إضافة معنى غير مصرّح به.
- source_word: τέσσαρσιν τετραδίοις στρατιωτῶν
  choice: إلى أربع فرق من الجنود
  rationale: صياغة عربية واضحة؛ ويبيّن الهامش أن كل فرقة مؤلفة من أربعة جنود، وهو المدلول الدقيق لكلمة τετράδιον.
- source_word: φυλάσσειν αὐτόν
  choice: لحراسته
  rationale: ينقل مصدر الغرض بإيجاز ووضوح.
- source_word: βουλόμενος
  choice: عازمًا
  rationale: يعبّر عن قصد هيرودس المتعمّد وخطته، من غير أن يحصر اللفظ في رغبة عاطفية.
- source_word: μετὰ τὸ πάσχα
  choice: بعد الفصح
  rationale: πάσχα هو عيد الفصح اليهودي في هذا السياق، وهذه هي التسمية العربية المألوفة والأمينة للمصدر.
- source_word: ἀναγαγεῖν αὐτὸν τῷ λαῷ
  choice: أن يُخرجه إلى الشعب
  rationale: يحافظ على صورة إخراجه وتقديمه إلى جمهور الشعب، من غير افتراض محاكمة رسمية لا يصرّح بها النص.
- source_word: λαῷ
  choice: الشعب
  rationale: مقابل عربي مباشر وطبيعي يشير إلى جمهور الناس بوصفهم جماعة عامة.
theological_decisions:
- issue: ترجمة πάσχα
  choice: الفصح
  alternative: عيد القيامة
  rationale: اللفظة اليونانية πάσχα تدل هنا على الفصح اليهودي. لذلك تُقدَّم دلالة النص اليوناني على تقليد بعض الترجمات الإنجليزية القديمة التي استعملت لفظًا يعني عيد القيامة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعملت «أودعه السجن» للسرد الطبيعي، ووُضع الهامشان مباشرة بعد اللفظين اللذين يشرحانهما.
