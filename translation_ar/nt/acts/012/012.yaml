    reason: lexical_alternative
lexical_decisions:
- source_word: Συνιδών
  choice: ولمّا أدرك بطرس ما حدث
  rationale: يدل اسم الفاعل الماضي من συνοράω هنا على اكتمال إدراك بطرس لما جرى بعد انصراف الملاك في سياق العدد السابق. ذُكر «بطرس» و«ما حدث» إيضاحًا لمرجع الفاعل والمفعول المفهومين من السياق، بصياغة عربية طبيعية.
- source_word: τε
  choice: و
  rationale: أداة ربط سردية خفيفة، وتؤدي الواو معناها من غير مبالغة في إبراز التعاقب.
- source_word: ἦλθεν ἐπὶ τὴν οἰκίαν
  choice: ذهب إلى بيت
  rationale: التركيب يدل على الحركة نحو مكان؛ و«ذهب إلى بيت» هو الأنسب لمنظور السرد العربي.
- source_word: τῆς Μαρίας τῆς μητρὸς Ἰωάννου
  choice: مريم أمّ يوحنا
  rationale: ينقل علاقة الإضافة بوضوح ويحدد مريم المقصودة، مع الاستغناء الطبيعي في العربية عن تكرار أداة التعريف.
- source_word: τοῦ ἐπικαλουμένου Μάρκου
  choice: الذي كان يُدعى مرقس
  rationale: يفيد اسم الفاعل المبني للمجهول أن يوحنا معروف باسم إضافي هو مرقس، من غير أن يوجب النص اليوناني لفظًا مقابلًا لـ«أيضًا».
- source_word: οὗ
  choice: حيث
  rationale: اسم الموصول المكاني يعود إلى بيت مريم، و«حيث» موجزة وطبيعية.
- source_word: ἱκανοὶ
  choice: كثيرون
  rationale: تدل الكلمة في صيغة الجمع على عدد ملحوظ أو كبير من الناس.
- source_word: ἦσαν ... συνηθροισμένοι
  choice: كان ... مجتمعين
  rationale: يحفظ التركيب حالة الاجتماع الناتجة من تجمع سابق، ويأتي عربيًا بسلاسة.
- source_word: καὶ προσευχόμενοι
  choice: يصلّون
  rationale: يصف نشاطًا مستمرًا أثناء اجتماعهم؛ وربط الحالين في «مجتمعين يصلّون» واضح وطبيعي من غير حاجة إلى تكرار «كانوا».
theological_decisions:
- issue: طبيعة الاسم «مرقس» بالنسبة إلى يوحنا
  choice: الذي كان يُدعى مرقس
  alternative: الذي كان يُدعى أيضًا مرقس
  rationale: النص يثبت الاسم الإضافي، لكنه لا يتضمن ظرفًا صريحًا بمعنى «أيضًا»؛ لذلك حُفظت الصياغة الأوسع دلالة في المتن، وأثبت البديل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة، بصياغة سردية طبيعية. وُضعت علامة الحاشية بعد «مرقس» لأن الحاشية تخص عبارة الاسم الإضافي، لا عبارة إدراك بطرس.
