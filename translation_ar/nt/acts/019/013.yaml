  text: ἐπεχείρησαν δέ τινες ⸀καὶ τῶν περιερχομένων Ἰουδαίων ἐξορκιστῶν ὀνομάζειν ἐπὶ τοὺς ἔχοντας τὰ πνεύματα τὰ πονηρὰ τὸ ὄνομα τοῦ κυρίου Ἰησοῦ λέγοντες· ⸀Ὁρκίζω ὑμᾶς τὸν Ἰησοῦν ⸀ὃν Παῦλος κηρύσσει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/013.yaml
  text: But some also of the itinerant Jewish exorcists attempted to invoke the name of the Lord Jesus over those who had evil spirits[a], saying, “I adjure you by Jesus[d][c][b], whom Paul proclaims.”
translation:
  language: ar
  text: 'لكن بعضًا من اليهود المتجوّلين الذين كانوا يطردون الأرواح الشريرة حاولوا هم أيضًا أن يدعوا باسم الرب يسوع على الذين بهم أرواح شريرة، قائلين: «أستحلفكم بيسوع الذي يكرز به بولس».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπεχείρησαν
  choice: حاولوا
  rationale: ينقل معنى الإقدام على الفعل أو محاولته من غير أن يفترض نجاحه.
- source_word: τινες καὶ τῶν περιερχομένων Ἰουδαίων ἐξορκιστῶν
  choice: بعضَ اليهود المتجوّلين الذين كانوا يطردون الأرواح الشريرة ... هم أيضًا
  rationale: «بعض» تقابل τινες، و«هم أيضًا» تحفظ قوة καὶ، و«المتجوّلين» تنقل التنقل من مكان إلى آخر. وصيغ الوصف فعليًا لأن «طاردي الأرواح» أقل طبيعية في العربية المعاصرة.
- source_word: ὀνομάζειν ἐπὶ ... τὸ ὄνομα
  choice: أن يستدعوا اسم ... على
  rationale: السياق يدل على التلفظ بالاسم لاستعمال سلطانه في صيغة طرد الأرواح، و«يستدعوا اسم» أوضح من النقل الحرفي «يسمّوا الاسم» مع إبقاء «على».
- source_word: τοὺς ἔχοντας τὰ πνεύματα τὰ πονηρά
  choice: الذين بهم أرواح شريرة
  rationale: يحافظ على صياغة «الذين لديهم/بهم أرواح شريرة» من غير تشديدها إلى تصريح بالمسّ أو التلبّس.
- source_word: τὸ ὄνομα τοῦ κυρίου Ἰησοῦ
  choice: اسم الرب يسوع
  rationale: صياغة عربية طبيعية تحفظ لقب κύριος ووزنه المسيحاني.
- source_word: Ὁρκίζω ὑμᾶς τὸν Ἰησοῦν
  choice: أستحلفكم بيسوع
  rationale: ὁρκίζω يفيد الإلزام بالقسم أو الاستحلاف، ونصب «يسوع» يدل هنا على من يُستحلف به.
- source_word: ὃν Παῦλος κηρύσσει
  choice: الذي يكرز به بولس
  rationale: κηρύσσει يعني يعلن أو ينادي علنًا؛ و«يكرز به» عبارة عربية مفهومة ودقيقة في هذا السياق.
theological_decisions:
- issue: ترجمة κύριος في العبارة المسيحانية τοῦ κυρίου Ἰησοῦ
  choice: الرب
  alternative: السيد
  rationale: «الرب يسوع» تحفظ الدلالة التشريفية واللاهوتية للقب، وهي الصياغة العربية الراسخة هنا.
- issue: هل يُصرَّح بالتلبّس في τοὺς ἔχοντας τὰ πνεύματα τὰ πονηρά
  choice: الذين بهم أرواح شريرة
  alternative: الذين تلبّستهم أرواح شريرة
  rationale: النص اليوناني يقول حرفيًا إن بهم/لديهم أرواحًا شريرة؛ لذلك تُحفظ درجة التصريح الأصلية ولا تُزاد عبارة تفسيرية أقوى.
- issue: قوة صيغة ὁρκίζω في خطاب الأرواح
  choice: أستحلفكم بيسوع
  alternative: آمركم باسم يسوع
  rationale: الاستحلاف أدق من الأمر المجرد، إذ يحفظ عنصر القسم أو الإلزام الرسمي الموجود في الفعل.
translation_notes:
  register: لغة عربية فصحى واضحة ورصينة. استُعملت صياغة فعلية بدل الاسم الاصطلاحي «المُعزِّمين» أو «طاردي الأرواح» لتكون مفهومة للقارئ العام. وُضعت علامة الحاشية بعد الاقتباس لأنها تخص اختلاف صيغة الفعل في القول.
