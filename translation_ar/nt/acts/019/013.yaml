  naturalness: النص فصيح ومفهوم إجمالًا. «بعض من اليهود المتجوّلين» أوضح في بيان أن «بعضًا» جزء من فئة المعزّمين اليهود المتجوّلين. وصياغة «أن يدعوا باسم» أكثر طبيعية في العربية للتعبير عن الاستدعاء بالاسم.
  terminology: «الرب يسوع»، و«أرواح شريرة»، و«أستحلفكم بيسوع» اختيارات مناسبة وتحافظ على درجة التصريح في اليونانية دون فرض تفسير «التلبّس».
  issues:
