    rationale: «أن يدعوا باسم الرب يسوع» تؤدي وظيفة ὀνομάζειν ... τὸ ὄνομα في هذا السياق بصورة عربية طبيعية، مع الإبقاء على معنى الاستدعاء لا مجرد التلفظ بالاسم.
