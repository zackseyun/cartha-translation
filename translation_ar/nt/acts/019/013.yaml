revisions:
- from: 'لكن بعضَ اليهود المتجوّلين الذين كانوا يطردون الأرواح الشريرة حاولوا هم أيضًا أن يستدعوا اسم الرب يسوع على الذين بهم أرواح شريرة، قائلين: «أستحلفكم بيسوع الذي يكرز به بولس».[a]'
  to: 'لكن بعضًا من اليهود المتجوّلين الذين كانوا يطردون الأرواح الشريرة حاولوا هم أيضًا أن يدعوا باسم الرب يسوع على الذين بهم أرواح شريرة، قائلين: «أستحلفكم بيسوع الذي يكرز به بولس».'
  rationale: حُذفت الحاشية غير المسندة لتفادي نسبة اختلاف نصي إلى المخطوطات بلا دليل في المادة المقدمة. وعُدّلت صياغة الاستدعاء إلى تعبير عربي طبيعي يحافظ على المعنى السياقي للفعل اليوناني. ولم يُضف تفسير للتلبّس أو لطبيعة ممارسة طرد الأرواح يتجاوز ألفاظ النص.
