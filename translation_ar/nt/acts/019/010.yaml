  text: τοῦτο δὲ ἐγένετο ἐπὶ ἔτη δύο, ὥστε πάντας τοὺς κατοικοῦντας τὴν Ἀσίαν ἀκοῦσαι τὸν λόγον τοῦ ⸀κυρίου, Ἰουδαίους τε καὶ Ἕλληνας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/010.yaml
  text: This continued for two years[a], so that all who lived in Asia heard the word of the Lord, both Jews and Greeks.
translation:
  language: ar
  text: واستمر ذلك لمدة سنتين، حتى سمع جميع الساكنين في آسيا[a] كلمة الرب، اليهود واليونانيين على السواء.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي ولاية آسيا الرومانية الواقعة في غرب آسيا الصغرى، لا قارة آسيا المعروفة اليوم.
    reason: cultural_note
lexical_decisions:
- source_word: τοῦτο δὲ ἐγένετο
  choice: واستمر هذا
  rationale: يشير التعبير في السياق إلى استمرار ترتيب التعليم المذكور في الآية السابقة، لا إلى مجرد وقوع حادثة منفردة؛ لذا تنقل «واستمر هذا» المعنى الزمني بوضوح.
- source_word: ἐπὶ ἔτη δύο
  choice: سنتين
  rationale: تفيد ἐπί مع مدة الزمن الاستمرار طوال تلك المدة، وصياغة «استمر هذا سنتين» عربية طبيعية دقيقة.
- source_word: ὥστε
  choice: حتى
  rationale: تدخل ὥστε هنا على النتيجة المترتبة على النشاط السابق، وتؤدي «حتى» هذه الدلالة بإيجاز وطبيعية.
- source_word: πάντας τοὺς κατοικοῦντας τὴν Ἀσίαν
  choice: جميع الساكنين في آسيا
  rationale: يحافظ هذا التعبير على شمول πάντας وعلى معنى اسم الفاعل الدال على المقيمين في المكان، مع إبقاء «آسيا» اسمًا جغرافيًا وشرح مدلوله التاريخي في الحاشية.
- source_word: ἀκοῦσαι
  choice: سمع
  rationale: المصدر الأوريستي بعد ὥστε يبين النتيجة، و«سمع» هو المقابل المباشر من غير إضافة معنى غير مصرح به.
- source_word: τὸν λόγον
  choice: كلمة
  rationale: تحافظ «كلمة» على اصطلاح لوقا المتكرر للدلالة على البشارة المعلنة وعلى النسيج اللاهوتي للفظ λόγος، بدل تفسيره في المتن بلفظ «رسالة».
- source_word: τοῦ κυρίου
  choice: الرب
  rationale: الإضافة في اليونانية تربط λόγος بالرب، فتأتي العبارة العربية الطبيعية «كلمة الرب».
- source_word: Ἰουδαίους τε καὶ Ἕλληνας
  choice: من اليهود واليونانيين
  rationale: تنقل الصياغة شمول الفئتين الذي تفيده τε καὶ، وتنسجم نحويًا مع «جميع الساكنين» من دون إقحام تفسير إضافي.
theological_decisions:
- issue: مدلول «آسيا»
  choice: الإبقاء على اسم «آسيا» في المتن مع بيان أنه ولاية رومانية في الحاشية
  alternative: فهمها على أنها قارة آسيا أو توسيع الاسم داخل المتن إلى «ولاية آسيا»
  rationale: يدل Ἀσία في سفر الأعمال على الولاية الرومانية الواقعة غربي آسيا الصغرى. وإبقاء الاسم كما هو يصون صيغة النص، بينما تمنع الحاشية الفهم الجغرافي الحديث الخاطئ.
translation_notes:
  register: 'عربية فصحى حديثة واضحة ووقورة. استُعملت صياغة طبيعية مع الحفاظ على تسلسل الأصل: مدة النشاط، ثم نتيجته، ثم شمول اليهود واليونانيين. وُضعت علامة الحاشية بعد «آسيا» لأنها تشرح هذا الاسم الجغرافي تحديدًا.'
