  text: ἦσαν δέ ⸀τινος Σκευᾶ Ἰουδαίου ἀρχιερέως ἑπτὰ ⸀υἱοὶ τοῦτο ποιοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/014.yaml
  text: There were seven sons of a Jewish chief priest named Sceva doing this[a].
translation:
  language: ar
  text: وكان سبعةُ أبناءٍ لرجلٍ يهوديٍّ من رؤساء الكهنة، يُدعى سَكاوا، يفعلون هذا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «رئيس الكهنة». يمكن أن يدل اللفظ اليوناني على رئيس الكهنة، أو، بمعنى أوسع، على واحد من رؤساء الكهنة أو من ذوي المكانة الكهنوتية العليا.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἦσαν δέ
  choice: وكان
  rationale: تنقل الفعل الناقص مع δέ بوصفه استمرارًا سرديًّا، من غير افتعال معنى زمني أو تقابل قوي.
- source_word: τινος Σκευᾶ
  choice: يهوديٍّ ... اسمه سَكاوا
  rationale: تنقل τινος معنى عدم التعيين، بينما يقدّم التعبير «اسمه سَكاوا» الاسمَ بأسلوب عربي طبيعي.
- source_word: Ἰουδαίου
  choice: يهوديٍّ
  rationale: يدل السياق على الهوية القومية الدينية، لا على مجرد الانتساب الجغرافي إلى اليهودية.
- source_word: ἀρχιερέως
  choice: من رؤساء الكهنة
  rationale: يحفظ المعنى الأوسع الممكن للفظ اليوناني، ولا يوحي بأن سَكاوا كان صاحب منصب رئيس الكهنة الوحيد.
- source_word: ἑπτὰ υἱοὶ
  choice: سبعة من أبناء
  rationale: صياغة عربية طبيعية تحافظ على العدد وعلاقة البنوة.
- source_word: τοῦτο ποιοῦντες
  choice: يفعلون هذا
  rationale: ترجمة مباشرة للمشاركة الحالية والإشارة المفردة إلى الفعل المذكور في السياق السابق.
theological_decisions:
- issue: دلالة ἀρχιερεύς في وصف سَكاوا
  choice: من رؤساء الكهنة
  alternative: رئيس الكهنة
  rationale: قد يدل اللفظ على رئيس الكهنة، وقد يُستعمل بمعنى أوسع لأحد كبار الكهنة أو أفراد الطبقة الكهنوتية العليا. وبما أن سَكاوا غير معروف بوصفه شاغل المنصب الأعلى المفرد، تحفظ الصياغة المختارة الاحتمال الأرجح من غير تقرير تاريخي زائد.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كتابية رصينة. اختير «أبناء» لسلامة الأسلوب، و«من رؤساء الكهنة» للمحافظة على الاتساع الدلالي في الأصل.
