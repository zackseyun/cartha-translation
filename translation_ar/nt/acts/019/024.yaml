- source_word: ἀργυροκόπος
  choice: صائغ فضة
  rationale: تعبير عربي واضح عن الحرفي الذي يعمل بالفضة.
- source_word: ποιῶν ναοὺς ἀργυροῦς Ἀρτέμιδος
  choice: يصنع هياكل فضية لأرطاميس
  rationale: تحفظ «هياكل» المعنى الأساسي لـναούς من غير الجزم بأن المصنوعات كانت نماذج مصغرة، وتنقل اسم الإلهة اليوناني بدل مقابله الروماني.
- source_word: παρείχετο
  choice: كان يوفّر
  rationale: ينقل دلالة الماضي المستمر أو المعتاد في صيغة الفعل الناقص اليونانية.
- source_word: τοῖς τεχνίταις
  choice: لأصحاب الحِرَف
  rationale: يشمل العمال المهرة المشاركين في هذه الصناعة بصياغة عربية طبيعية.
- source_word: οὐκ ὀλίγην ἐργασίαν
  choice: تجارة لا يُستهان بها
  rationale: تحفظ أسلوب التقليل البلاغي في اليونانية، وتلائم السياق الاقتصادي من دون حصر ἐργασία في الربح وحده.
