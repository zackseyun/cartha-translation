  text: For a certain man named Demetrius[a], a silversmith who made silver shrines of Artemis[b], was providing the craftsmen with no small business.
translation:
  language: ar
  text: لأن رجلًا اسمه ديمتريوس، وكان صائغَ فضةٍ يصنع هياكل فضية لأرطاميس[a]، كان يوفّر لأصحاب الحِرَف تجارةً لا يُستهان بها[b].
  philosophy: optimal-equivalence
  footnotes:
