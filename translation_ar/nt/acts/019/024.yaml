    text: 'يمكن أيضًا: «معابد فضية لأرطاميس» أو «نماذج فضية لمعبد أرطاميس». تستعمل اليونانية كلمة تعني «هياكل/معابد»، ويُرجَّح أن المقصود مصنوعات صغيرة مرتبطة بعبادة أرطاميس.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «عملًا ليس قليلًا»، وهو أسلوب يفيد أن تجارتهم أو مكاسبهم كانت كبيرة.'
    reason: lexical_alternative
lexical_decisions:
