  text: ἀναντιρρήτων οὖν ὄντων τούτων δέον ἐστὶν ὑμᾶς κατεσταλμένους ὑπάρχειν καὶ μηδὲν προπετὲς πράσσειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/036.yaml
  text: Therefore[a], since these things are undeniable[c][b], it is necessary for you to remain calm and to do nothing rash.
translation:
  language: ar
  text: فبما أن هذه الأمور لا يمكن الاعتراض عليها[a]، ينبغي لكم أن تظلوا هادئين[b] وألّا تفعلوا شيئًا بطيش[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لا تقبل الجدل» أو «لا يمكن مناقضتها».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «تبقوا هادئين» أو «تضبطوا أنفسكم».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «ألا تفعلوا شيئًا على عجل» أو «ألا تتصرفوا باندفاع».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναντιρρήτων
  choice: لا تقبل الإنكار
  rationale: يفيد الوصف أن الأمور المذكورة ليست موضعًا معقولًا للاعتراض أو المناقضة؛ وهذه العبارة عربية واضحة وتحفظ قوة الأصل.
- source_word: οὖν
  choice: فـ
  rationale: الفاء تربط النتيجة بما سبق ربطًا طبيعيًا في العربية، وتنقل دلالة الاستنتاج التي تؤديها οὖν.
- source_word: ὄντων τούτων
  choice: ما دامت هذه الأمور
  rationale: ينقل تركيب الحال بالمضاف إليه دلالة الظرف والسبب هنا بصياغة عربية طبيعية من غير تحويلها إلى تقرير مستقل.
- source_word: δέον ἐστίν
  choice: فعليكم
  rationale: ينقل معنى اللزوم والواجب في خطاب مباشر واضح، من غير المبالغة في جعله أمرًا قانونيًا صارمًا.
- source_word: κατεσταλμένους ὑπάρχειν
  choice: أن تلزموا الهدوء
  rationale: يصف التركيب حالة مستقرة من الهدوء وضبط النفس؛ و«تلزموا الهدوء» تحافظ على هذا المعنى في سياق تهدئة الجمع.
- source_word: μηδὲν προπετὲς πράσσειν
  choice: ألّا تفعلوا شيئًا بتهوّر
  rationale: ينقل التحذير من التصرف المتسرع والمندفع بصياغة عربية مألوفة ودقيقة.
theological_decisions: []
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة، بصياغة خطابية طبيعية تناسب كلام كاتب المدينة إلى الجمع. حُفظت علاقة الاستنتاج والسبب، وتُرجم معنى الهدوء بوصفه حالة من ضبط النفس لا مجرد الصمت.
