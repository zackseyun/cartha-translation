lexical_decisions:
- source_word: Ἐγένετο
  choice: حدث
  rationale: يفيد وقوع حدث، و«حدث» عربية طبيعية تحافظ على القوة الحدثية من غير زيادة.
- source_word: δὲ
  choice: و
  rationale: أداة ربط سردية خفيفة؛ تنقل الواو استئناف السرد من غير أن تفرض معنى تعارض قوي.
- source_word: κατὰ τὸν καιρὸν ἐκεῖνον
  choice: في ذلك الوقت
  rationale: ينقل التعبير الزمني بوضوح وإيجاز.
- source_word: τάραχος
  choice: اضطراب
  rationale: لفظ عام يدل على البلبلة والهيجان، ولا يستبق تطور الرواية بتحديده شغبًا أو فتنة.
- source_word: οὐκ ὀλίγος
  choice: غير قليل
  rationale: يحفظ أسلوب التقليل المنفي في اليونانية بدل تسويته إلى «كبير».
- source_word: περὶ
  choice: بشأن
  rationale: يبين موضوع الاضطراب بصياغة فصيحة واضحة.
- source_word: τῆς ὁδοῦ
  choice: الطريق
  rationale: يحفظ الاستعمال الاسمي المتكرر في أعمال الرسل للدلالة على الحركة المسيحية، من غير إضافة تفسيرية إلى المتن.
theological_decisions:
- issue: فهم τῆς ὁδοῦ بوصفه تسمية للحركة المسيحية
  choice: الطريق
  alternative: الطريق بمعناه العام
  rationale: السياق والاستعمال المتكرر في أعمال الرسل يرجحان أنه اسم دال على الحركة المسيحية، مع بقاء اللفظ نفسه قابلًا للقراءة الحرفية؛ وتوضح الحاشية المرجع دون تحميله مضمونًا مذهبيًا زائدًا.
