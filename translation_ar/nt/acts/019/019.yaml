source:
  edition: SBLGNT
  text: ἱκανοὶ δὲ τῶν τὰ περίεργα πραξάντων συνενέγκαντες τὰς βίβλους κατέκαιον ἐνώπιον πάντων· καὶ συνεψήφισαν τὰς τιμὰς αὐτῶν καὶ εὗρον ἀργυρίου μυριάδας πέντε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/019.yaml
  text: And many of those who had practiced magic arts brought their books together and were burning them in front of everyone[b][a]; and they totaled up their value and found it to be fifty thousand pieces of silver.
translation:
  language: ar
  text: وكان كثيرون ممن مارسوا أعمال السحر قد أحضروا كتبهم وأخذوا يحرقونها أمام الجميع؛ وحسبوا قيمتها، فوجدوا أنها تبلغ خمسين ألف قطعة من الفضة.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «خمس ربوات من الفضة»، أي خمسون ألفًا. ولا يحدد النص نوع القطعة النقدية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱκανοὶ
  choice: كثيرون
  rationale: تدل هنا على عدد كبير أو ملحوظ من الناس، و«كثيرون» طبيعية وواضحة في العربية.
- source_word: τὰ περίεργα πραξάντων
  choice: ممن مارسوا أعمال السحر
  rationale: يفيد التعبير في سياق أفسس ممارسة السحر، لا مجرد أعمال غريبة أو مثيرة للفضول.
- source_word: συνενέγκαντες
  choice: يجمعون
  rationale: ينقل معنى إحضار الكتب وجمعها في موضع واحد، مع صياغة عربية سلسة متصلة بفعل الإحراق.
- source_word: τὰς βίβλους
  choice: كتبهم
  rationale: «الكتب» مقابل عام ودقيق، وأضيف الضمير لأن السياق يبين أنها الكتب التي كانت بحوزة الممارسين.
- source_word: κατέκαιον
  choice: يحرقونها
  rationale: صيغ بالمضارع بعد «كان» لإبراز الجانب الاستمراري للفعل الناقص في اليونانية.
- source_word: ἐνώπιον πάντων
  choice: أمام الجميع
  rationale: يبرز علنية الفعل بلغة عربية حديثة ومباشرة.
- source_word: συνεψήφισαν
  choice: حسبوا
  rationale: يفيد جمع القيم وحساب مجموعها، و«حسبوا» موجزة وطبيعية.
- source_word: τὰς τιμὰς αὐτῶν
  choice: قيمتها
  rationale: المراد القيمة المالية للكتب مجتمعة، لا مجرد أثمان بيع محددة.
- source_word: ἀργυρίου μυριάδας πέντε
  choice: خمسين ألف قطعة من الفضة
  rationale: «خمس ربوات» تساوي خمسين ألفًا، ولم يحدد النص فئة العملة، لذا تجنبت تسمية نقد بعينه.
theological_decisions:
- issue: دلالة τὰ περίεργα في سياق أفسس
  choice: أعمال السحر
  alternative: الممارسات الخفية أو الأعمال الغريبة
  rationale: السياق المباشر يتناول التعازيم والأرواح الشريرة وكتب الممارسات السحرية؛ وهذه الصياغة توضح المعنى التاريخي الديني من غير إدخال اصطلاح مذهبي خاص.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حوفظ على الجانب الاستمراري للفعل κατέκαιον بصيغة «كانوا... يحرقون»، وعلى عمومية وحدة الفضة لعدم تحديد فئة نقدية في اليونانية.
