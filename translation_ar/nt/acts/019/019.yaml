  source_fidelity: 'المسودة تنقل المعنى العام بأمانة: «أعمال السحر» مناسبة لـ τὰ περίεργα في السياق، و«أمام الجميع» تنقل علنية الفعل، والعدد ووحدة الفضة غير المعيّنة محفوظان. لكن «يجمعون» يجعل فعل إحضار الكتب/جمعها مستمرًا، مع أن συνενέγκαντες فعل تام سابق لفعل الإحراق الناقص κατέκαιον. كما أن «فوجدوها خمسين ألف قطعة» غير واضحة الإحالة في العربية.'
