base_translation:
  language: en
  yaml_path: translation/nt/acts/019/033.yaml
  text: And from the crowd they brought forward Alexander[a], since the Jews had pushed him forward; and Alexander, motioning with his hand[b], wanted to make a defense to the assembly.
translation:
  language: ar
  text: فأخرجوا إسكندر من بين الجمع[a]، إذ كان اليهود قد دفعوه إلى الأمام. فأشار إسكندر بيده، وأراد أن يقدّم دفاعًا أمام الجمهور[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فقدّموا إسكندر ... بعدما قدّمه اليهود». يستعمل النص اليوناني فعلين متقاربين للدلالة على تقديم إسكندر علنًا إلى الواجهة.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «أمام الشعب». للكلمة هنا دلالة مدنية عامة، وهي غير الكلمة المترجمة «الجمع» في أول الآية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεβίβασαν
  choice: أخرجوا من بين الجمع
  rationale: يفيد السياق تقديم إسكندر علنًا من وسط الجمع؛ وهذه الصياغة طبيعية وتحافظ على الحركة من بين الجمع إلى الواجهة.
- source_word: προβαλόντων αὐτὸν τῶν Ἰουδαίων
  choice: إذ كان اليهود قد دفعوه إلى الأمام
  rationale: ينقل التركيب التفسيري ويعبّر عن تقديمه إلى الواجهة من غير أن يلزم منه استعمال العنف.
- source_word: κατασείσας τὴν χεῖρα
  choice: فأشار بيده
  rationale: ينقل الإيماءة المقصودة لجذب الانتباه دون إضافة غرض غير مصرح به، مثل طلب الصمت.
- source_word: ἤθελεν ἀπολογεῖσθαι
  choice: وأراد أن يدافع عن نفسه
  rationale: يحفظ معنى الإرادة أو المحاولة غير المكتملة، ويؤدي الدلالة الدفاعية العلنية للفعل.
- source_word: τῷ δήμῳ
  choice: أمام جمهور المدينة
  rationale: يعكس البعد المدني العام لكلمة δῆμος، ويميّزها من ὄχλος في أول الآية.
- source_word: ὄχλου
  choice: الجمع
  rationale: تعبير عربي واضح عن عامة المحتشدين، مع إبقاء التمييز عن جمهور المدينة لاحقًا.
- source_word: Ἀλέξανδρον / Ἀλέξανδρος
  choice: إسكندر
  rationale: الصيغة العربية المعيارية الشائعة للاسم اليوناني.
