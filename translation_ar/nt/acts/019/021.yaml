id: ACT.19.21
reference: Acts 19:21
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Ὡς δὲ ἐπληρώθη ταῦτα, ἔθετο ὁ Παῦλος ἐν τῷ πνεύματι διελθὼν τὴν Μακεδονίαν καὶ Ἀχαΐαν πορεύεσθαι εἰς ⸀Ἱεροσόλυμα, εἰπὼν ὅτι Μετὰ τὸ γενέσθαι με ἐκεῖ δεῖ με καὶ Ῥώμην ἰδεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/021.yaml
  text: After these things were completed[a], Paul resolved in the Spirit to go to Jerusalem after passing through Macedonia and Achaia, saying, “After I have been there[b], I must also see Rome.”
translation:
  language: ar
  text: 'وبعد أن تمّت هذه الأمور، عزم بولس في الروح[a] أن يذهب إلى أورشليم مارًّا بمكدونية وأخائية، وقال: «بعد أن أكون هناك، لا بدّ لي أن أرى رومية أيضًا».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «في روحه». قد تشير العبارة اليونانية إما إلى عزم بولس الداخلي وإما إلى إرشاد الروح القدس.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπληρώθη
  choice: تمّت
  rationale: يدل المبني للمجهول هنا على اكتمال الأمور السابقة وبلوغها نهايتها، لا على إتمام نبوة.
- source_word: ἔθετο
  choice: عزم
  rationale: ينقل الاستعمال المتوسط للفعل بمعنى أن يضع الإنسان الأمر في نفسه ويتخذ عزمًا مقصودًا.
- source_word: ἐν τῷ πνεύματι
  choice: في الروح
  rationale: يحافظ على الصياغة اليونانية وعلى احتمال الإشارة إلى الروح القدس أو إلى روح بولس الداخلية، مع بيان البديل في الحاشية.
- source_word: διελθὼν
  choice: مارًّا
  rationale: يعرض المرور بمكدونية وأخائية بوصفه جزءًا سابقًا من مسار الرحلة إلى أورشليم، بصياغة عربية طبيعية.
- source_word: πορεύεσθαι
  choice: أن يذهب
  rationale: ترجمة واضحة وطبيعية لفعل الحركة العام في هذا السياق.
- source_word: Ἱεροσόλυμα
  choice: أورشليم
  rationale: الاسم العربي الكتابي الشائع للمدينة.
- source_word: Μετὰ τὸ γενέσθαι με ἐκεῖ
  choice: بعد أن أكون هناك
  rationale: ينقل تركيب المصدر المعرّف ومعناه الدال على وجود بولس في ذلك المكان قبل المرحلة التالية.
- source_word: δεῖ
  choice: لا بدّ لي
  rationale: يحفظ معنى الضرورة الملزمة، الذي قد يتضمن في لوقا وأعمال الرسل قصدًا إلهيًا دون التصريح بما لا يصرح به النص.
- source_word: ἰδεῖν
  choice: أرى
  rationale: يحافظ على المعنى الحرفي للفعل، مع كون رؤية المدينة تتضمن زيارتها في سياق السفر.
theological_decisions:
- issue: مرجع عبارة ἐν τῷ πνεύματι
  choice: في الروح
  alternative: في روحه
  rationale: لا يذكر اليوناني ضمير ملكية، ولذلك يمكن أن تشير العبارة إلى إرشاد الروح القدس أو إلى عزم بولس الداخلي. أبقيت الصياغة المحتملة في المتن وصرّحت بالبديل في الحاشية دون حسم التوتر الدلالي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت أسماء الأماكن بصيغها الكتابية العربية المألوفة، وجاء ترتيب العبارة سلسًا مع الحفاظ على تسلسل خطة الرحلة وعلى غموض عبارة «في الروح».
