  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὥστε καὶ ἐπὶ τοὺς ἀσθενοῦντας ⸀ἀποφέρεσθαι ἀπὸ τοῦ χρωτὸς αὐτοῦ σουδάρια ἢ σιμικίνθια καὶ ἀπαλλάσσεσθαι ἀπ’ αὐτῶν τὰς νόσους, τά τε πνεύματα τὰ πονηρὰ ⸀ἐκπορεύεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/012.yaml
  text: so that even handkerchiefs or work aprons were carried away from his body to the sick[a], and the diseases left them[b], and the evil spirits went out.
translation:
  language: ar
  text: حتى إنهم كانوا يحملون إلى المرضى مناديل أو مآزر للعمل من جسده[a]، فتفارقهم الأمراض، وتخرج الأرواح الشريرة[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «من جلده».'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «تخرج منهم»، أي من المرضى.'
    reason: clarification
lexical_decisions:
- source_word: ὥστε
  choice: حتى إن
  rationale: تفيد النتيجة المترتبة على المعجزات الخارقة المذكورة في الآية السابقة، وهي صياغة عربية طبيعية تحفظ القوة التتابعية.
- source_word: ἐπὶ τοὺς ἀσθενοῦντας
  choice: إلى المرضى
  rationale: تنقل معنى التوجّه إلى الذين كانوا مرضى بإيجاز ووضوح.
- source_word: ἀποφέρεσθαι
  choice: كانوا يحملون
  rationale: المبني للمعلوم مع فاعل عام غير مصرّح به طبيعي في العربية، ويحفظ حركة الأشياء من بولس إلى المرضى من غير تحديد حامليها.
- source_word: ἀπὸ τοῦ χρωτὸς αὐτοῦ
  choice: من على جلده
  rationale: χρώς يدل حرفيًا على الجلد أو سطح الجسد؛ وإضافة «على» تجعل التعبير مفهومًا بالعربية وتحفظ دقة اللفظ اليوناني.
- source_word: σουδάρια
  choice: مناديل
  rationale: يدل اللفظ على قطع قماش لمسح العرق أو الوجه، و«مناديل» هو المقابل العربي الطبيعي.
- source_word: σιμικίνθια
  choice: مآزر عمل
  rationale: يشير إلى مآزر أو ثياب تُلبس أثناء العمل اليدوي؛ والتقييد بـ«عمل» يوضح نوعها دون توسع تفسيري.
- source_word: ἀπαλλάσσεσθαι
  choice: تفارقهم
  rationale: يعبّر عن زوال الأمراض عن المرضى ويحافظ على تصوير الأمراض كأنها تغادرهم.
- source_word: νόσους
  choice: الأمراض
  rationale: مقابل مباشر للجمع اليوناني، مع الحفاظ على أداة التعريف من غير إضافة ضمير ملكية غير مصرح به.
- source_word: πνεύματα τὰ πονηρά
  choice: الأرواح الشريرة
  rationale: يحفظ التعريف والوصف الواردين في اليونانية بعبارة عربية مألوفة وواضحة.
- source_word: ἐκπορεύεσθαι
  choice: تخرج
  rationale: مقابل مباشر وطبيعي لخروج الأرواح من المصابين، مع إبقاء متعلق الخروج مفهومًا من السياق كما في الأصل.
theological_decisions:
- issue: طبيعة الشفاء وطرد الأرواح المرتبطين بالأقمشة التي حُمِلت من بولس
  choice: سرد الحدث كما يقدمه النص مباشرة، من غير بيان آلية للمعجزة أو إضفاء دلالة عقائدية لاحقة على الأشياء.
  alternative: صياغة توحي بتبجيل الذخائر، أو صياغة رمزية تقلل من حقيقة الحدث الخارق.
  rationale: ينسب السياق المعجزات الخارقة إلى عمل الله، وتصف الآية ما وقع عند حمل هذه الأشياء إلى المرضى؛ لذلك تُحفظ الرواية كما هي بلا إضافة مذهبية أو تفسير عقلاني ينفي عنصرها الخارق.
translation_notes:
  register: لغة عربية فصحى معاصرة، واضحة ورصينة. استُخدم «حتى إن» لربط النتيجة بالسياق السابق، و«من على جلده» للموازنة بين الدقة المعجمية والطبيعية، مع تجنب أي مصطلح طائفي أو تفسير لآلية المعجزة.
