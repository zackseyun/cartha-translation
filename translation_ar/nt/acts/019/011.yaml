lexical_decisions:
- source_word: Δυνάμεις
  choice: معجزات
  rationale: تدل صيغة الجمع في هذا السياق من أعمال الرسل على أفعال خارقة تُظهر القدرة، لا على قوى مجردة. ولفظ «معجزات» واضح وطبيعي في العربية المعاصرة.
- source_word: τε
  choice: وكان
  rationale: أُدي معنى أداة الربط باستئناف متصل بالسياق، وجاءت الواو مع «كان» ملائمة لبداية الجملة العربية.
- source_word: οὐ τὰς τυχούσας
  choice: غير عادية
  rationale: العبارة اليونانية اصطلاح يفيد أنها ليست من النوع العادي أو المألوف. وتحافظ «غير عادية» على النفي الكامن في الأصل من غير تكلف.
- source_word: ὁ θεὸς
  choice: الله
  rationale: الله هو الفاعل الصريح في النص، مما يحفظ إسناد العمل إليه.
- source_word: ἐποίει
  choice: كان يُجري
  rationale: صيغة الماضي الناقص تشير إلى عمل مستمر أو متكرر، و«كان يُجري» تؤدي هذا الجانب وتلائم «معجزات» عربيًا.
- source_word: διὰ τῶν χειρῶν Παύλου
  choice: على يدي بولس
  rationale: تعبير عربي فصيح وطبيعي يحفظ صورة اليدين ويدل على أن بولس هو الوسيط الذي أجرى الله العمل من خلاله.
- source_word: Παύλου
  choice: بولس
  rationale: النقل العربي المعياري للاسم.
theological_decisions:
- issue: الفاعل في صنع المعجزات
  choice: الله هو الذي كان يُجري المعجزات، وبولس هو الوسيط.
  alternative: إسناد صنع المعجزات إلى بولس مباشرة.
  rationale: يجعل اليوناني ὁ θεὸς فاعل ἐποίει، بينما تفيد διὰ τῶν χειρῶν Παύλου الوساطة أو الأداة. لذلك يحفظ النص التمييز بين الفاعلية الإلهية والوساطة البشرية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم التعبير المألوف «على يدي بولس» للمحافظة على الصورة الأصلية من غير غرابة، وحُفظت دلالة الاستمرار في الفعل اليوناني الناقص.
