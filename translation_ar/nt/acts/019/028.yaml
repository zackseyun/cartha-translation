  yaml_path: translation/nt/acts/019/028.yaml
  text: When they heard this and became full of wrath[a], they were crying out, saying, “Great is Artemis of the Ephesians!”
translation:
  language: ar
  text: 'فَلَمَّا سَمِعُوا هٰذَا وَامْتَلَأُوا غَضَبًا[a]، كَانُوا يَصْرُخُونَ قَائِلِينَ: «عَظِيمَةٌ هِيَ أَرْطَامِيسُ أَهْلِ أَفَسُسَ!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «اشتدَّ غضبهم»، أو «استشاطوا غضبًا». والتعبير اليوناني حرفيًّا: «صاروا ممتلئين غضبًا»، ويدل على غضب شديد.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσαντες
  choice: فَلَمَّا سَمِعُوا هٰذَا
  rationale: اسم الفاعل الماضي يبيّن الظرف السابق للفعل الرئيس، و«هذا» يستحضر مضمون الكلام السابق المفهوم من السياق.
- source_word: δὲ
  choice: فَـ
  rationale: أداة ربط خفيفة تواصل السرد، وتؤدي الفاء هذا الانتقال طبيعيًّا في العربية.
- source_word: γενόμενοι πλήρεις θυμοῦ
  choice: وَامْتَلَأُوا غَضَبًا
  rationale: يحافظ التعبير على صورة الامتلاء في الأصل، مع نقل شدة θυμός بلفظ «غضب».
- source_word: ἔκραζον
  choice: أَخَذُوا يَصْرُخُونَ
  rationale: تنقل هذه الصياغة دلالة الماضي الناقص على الفعل المستمر أو المتكرر.
- source_word: λέγοντες
  choice: قَائِلِينَ
  rationale: ينقل اسم الفاعل المصاحب الذي يقدّم مضمون الصراخ.
- source_word: Μεγάλη ἡ Ἄρτεμις Ἐφεσίων
  choice: عَظِيمَةٌ هِيَ أَرْطَامِيسُ أَهْلِ أَفَسُسَ!
  rationale: يحافظ تقديم «عظيمة» على النبرة الهتافية وعلى ترتيب الجملة اليونانية، ويعبّر «أهل أفسس» بدقة عن صيغة الجمع الدالة على الأفسسيين.
- source_word: Ἄρτεμις
  choice: أَرْطَامِيسُ
  rationale: نقل صوتي عربي شائع لاسم الإلهة اليونانية، دون ترجمة الاسم أو تفسيره.
- source_word: Ἐφεσίων
  choice: أَهْلِ أَفَسُسَ
  rationale: الصيغة اليونانية جمع مضاف إليه تشير إلى سكان أفسس، و«أهل أفسس» عربية واضحة وطبيعية.
theological_decisions:
- issue: نقل هتاف وثني من غير أن يبدو إقرارًا لصحته
  choice: «عَظِيمَةٌ هِيَ أَرْطَامِيسُ أَهْلِ أَفَسُسَ!»
  alternative: «أَرْطَامِيسُ أَهْلِ أَفَسُسَ عَظِيمَةٌ!»
  rationale: يُورَد القول بوصفه هتاف الجموع داخل كلام منقول، فيُحفظ مضمونه وقوته الخطابية من غير إضافة تأييد أو تحفظ تفسيري.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة سردية كريمة. استُخدم الضبط الجزئي لتوضيح القراءة، مع الحفاظ على إيقاع الهتاف وعلى علامة الحاشية [a] في موضعها.
