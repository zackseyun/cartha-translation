id: ACT.19.16
reference: Acts 19:16
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ ⸀ἐφαλόμενος ⸂ὁ ἄνθρωπος ἐπ’ αὐτοὺς⸃ ἐν ᾧ ἦν τὸ πνεῦμα τὸ πονηρὸν ⸂κατακυριεύσας ἀμφοτέρων⸃ ἴσχυσεν κατ’ αὐτῶν, ὥστε γυμνοὺς καὶ τετραυματισμένους ἐκφυγεῖν ἐκ τοῦ οἴκου ἐκείνου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/016.yaml
  text: And the man in whom the evil spirit was leaped on them[a], and after overpowering both of them, prevailed against them[c][b], so that they fled out of that house naked and wounded.
translation:
  language: ar
  text: فوثب عليهم الرجل الذي كان فيه الروح الشرير[a]، وبعد أن تغلّب على كليهما[b]، كان أقوى منهم، حتى فرّوا[c] من ذلك البيت عراةً ومجروحين.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «انقضّ عليهم» أو «قفز عليهم».'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «كليهما». ومع أن السياق الأوسع يذكر عددًا أكبر من أبناء سكاوا، فإن النص هنا يقول صراحةً «كليهما»، ولذلك تُرك هذا التوتر كما هو.'
    reason: alternative_reading
  - marker: c
    text: 'أو: «نجوا من ذلك البيت».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφαλόμενος
  choice: فوثب عليهم
  rationale: يفيد الفعل هجومًا جسديًا مفاجئًا بالوثوب؛ و«وثب عليهم» تعبير عربي واضح وحيوي يحفظ قوة المشهد.
- source_word: ὁ ἄνθρωπος
  choice: الرجل
  rationale: الاسم مذكر مفرد في السياق ويشير إلى الرجل الذي كان فيه الروح الشرير.
- source_word: ἐν ᾧ ἦν τὸ πνεῦμα τὸ πονηρόν
  choice: الذي كان فيه الروح الشرير
  rationale: يحافظ على بنية الأصل التي تصف وجود الروح في الرجل، من غير إدخال مصطلح تقني زائد مثل «الممسوس».
- source_word: τὸ πνεῦμα τὸ πονηρόν
  choice: الروح الشرير
  rationale: ترجمة مباشرة ومألوفة في سياق الأرواح الشريرة، مع مطابقة الصفة للمذكر بحسب الاستعمال العربي لكلمة «روح» هنا.
- source_word: κατακυριεύσας
  choice: بعد أن تغلّب على
  rationale: يدل على إحراز السيادة والقهر؛ وهذه الصياغة تنقل الفعل السابق زمنيًا مع الحفاظ على تمييزه من العبارة التالية.
- source_word: ἀμφοτέρων
  choice: كليهما
  rationale: ينص الأصل صراحة على الاثنين؛ لذلك حُفظ هذا التفصيل رغم التوتر الظاهر مع ذكر عدد أكبر في السياق الأوسع.
- source_word: ἴσχυσεν κατ’ αὐτῶν
  choice: قَوِيَ عليهم
  rationale: يحفظ بصورة وثيقة معنى ἰσχύω مع κατά، أي صار أقوى منهم وغلبهم، من غير دمجه كليًا في «تغلّب» السابقة.
- source_word: γυμνούς
  choice: عراةً
  rationale: ينقل الحالة الناتجة كما يذكرها الأصل، من غير افتراض أن الثياب نُزعت عمدًا أو تمزقت.
- source_word: τετραυματισμένους
  choice: مجروحين
  rationale: ينقل كونهم قد أُصيبوا بجروح وبقوا في تلك الحالة؛ وهو طبيعي وواضح في العربية.
- source_word: ἐκφυγεῖν
  choice: فرّوا
  rationale: يفيد الهرب والنجاة من الموضع، وتوضّح عبارة «من ذلك البيت» جهة الخروج.
- source_word: ἐκ τοῦ οἴκου ἐκείνου
  choice: من ذلك البيت
  rationale: ترجمة طبيعية مباشرة لحركة الخروج من البيت المحدد في الرواية.
theological_decisions:
- issue: صياغة وجود الروح الشرير في الرجل
  choice: الرجل الذي كان فيه الروح الشرير
  alternative: الرجل الذي كان به روح شرير؛ الرجل الممسوس بروح شرير
  rationale: تتبع الصياغة الأصل الذي يصف الروح بأنه كان في الرجل، وتتجنب فرض مصطلح عقدي أو تقني لا يصرّح به النص.
- issue: نطاق ἀμφοτέρων وعلاقته بعدد أبناء سكاوا في السياق
  choice: كليهما
  alternative: جميعهم؛ الاثنين منهم
  rationale: يحفظ النص لفظ «كليهما» الصريح ولا يسوّي التوتر العددي مع السياق الأوسع أو يفسره ضمن الترجمة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة، مع ترتيب يحفظ تسلسل الأفعال في اليونانية. استُعمل «قَوِيَ عليهم» للمحافظة على التمييز بين κατακυριεύσας وἴσχυσεν، وإن كان أقل شيوعًا قليلًا من «غلبهم». جميع علامات الحواشي الواردة مثبتة في المتن.
