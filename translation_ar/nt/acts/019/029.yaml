lexical_decisions:
- source_word: ἐπλήσθη ἡ πόλις τῆς συγχύσεως
  choice: فامتلأت المدينة اضطرابًا
  rationale: يحافظ على صورة الامتلاء وعلى معنى الفوضى والبلبلة في السياق، بصياغة عربية طبيعية وموجزة.
- source_word: ὥρμησάν
  choice: اندفعوا
  rationale: ينقل الحركة المفاجئة والقوية التي يدل عليها الفعل في مشهد الشغب.
- source_word: ὁμοθυμαδόν
  choice: جميعًا
  rationale: يفيد تحرك الجمع بوصفه كتلة واحدة، من غير إضفاء معنى إيجابي للاتفاق أو الانسجام.
- source_word: θέατρον
  choice: المسرح
  rationale: المقابل المباشر للفظ اليوناني، ولا يضيف تحديدًا معماريًا لا يصرح به النص.
- source_word: συναρπάσαντες
  choice: وقد أمسكوا بـ
  rationale: يدل على القبض القسري المصاحب لاندفاع الجموع، مع إبقاء بدائل أقوى في الحاشية لأن اللفظ قد يفيد الاختطاف أو الجر.
- source_word: Γάϊον καὶ Ἀρίσταρχον
  choice: بغايوس وأرسترخس
  rationale: نقل الاسمين إلى العربية وفق صيغ واضحة ومتداولة كتابيًا.
- source_word: Μακεδόνας
  choice: المقدونيَّين
  rationale: يحافظ على وصف الرجلين بأنهما من مقدونية، بصيغة المثنى الملائمة للعربية.
- source_word: συνεκδήμους Παύλου
  choice: رفيقَي بولس في السفر
  rationale: صياغة عربية طبيعية تنقل كونهما يصاحبان بولس في ترحاله خارج الوطن.
