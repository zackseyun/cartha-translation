  to: 'فجمعهم مع العمّال العاملين في مثل هذه الأمور، وقال: «يا رجال، أنتم تعلمون أن رخاءنا يأتي من هذه المهنة.[a]»'
  rationale: تعديل صدر الآية فقط لإظهار أن فعل الجمع شمل المشار إليهم والعمّال معًا، مع إبقاء عمومية «العمّال» وعدم تحديد نوع الصناعة. وبقيت عبارة الرخاء والمهنة والحاشية كما هي، إذ تنقلان المعنى التجاري والازدهار المادي في الأصل دون زيادة تفسيرية.
