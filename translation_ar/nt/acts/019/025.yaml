  terminology: «العمّال العاملون في مثل هذه الأمور» يحافظ على عموم ἐργάτας وعلى الإحالة غير المحددة في περὶ τὰ τοιαῦτα. «المهنة» و«رخاؤنا» مناسبان للسياق التجاري، والحاشية تقدم البديل المعجمي «الحرفة/ثروتنا» دون تضييق المعنى.
