  text: After gathering them together[a], along with the workmen occupied with such things, he said, “Men, you know that from this business we have our prosperity.
translation:
  language: ar
  text: 'فجمعهم مع العمّال العاملين في مثل هذه الأمور، وقال: «يا رجال، أنتم تعلمون أن رخاءنا يأتي من هذه المهنة.[a]»'
  philosophy: optimal-equivalence
  footnotes:
