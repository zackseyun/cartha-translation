    reason: lexical_alternative
lexical_decisions:
- source_word: συναθροίσας
  choice: فجمعهم
  rationale: اسم الفاعل اليوناني في صيغة الماضي يدل على فعل سبق القول؛ والفاء مع الفعل الماضي تنقل هذا التعاقب بإيجاز وطبيعية.
- source_word: τοὺς περὶ τὰ τοιαῦτα ἐργάτας
  choice: العمال المشتغلون بمثل هذه الأمور
  rationale: تحافظ «العمال» على عموم ἐργάτας، بينما تعبّر العبارة التابعة عن ارتباطهم بأعمال مماثلة من غير حصرهم في حرفة أدق مما يقوله النص.
- source_word: Ἄνδρες
  choice: يا رجال
  rationale: ينقل النداء الصريح الموجّه إلى الرجال الحاضرين، مع إضافة أداة النداء اللازمة في العربية الطبيعية.
- source_word: ἐπίστασθε
  choice: أنتم تعلمون
  rationale: تعبير مباشر عن المعرفة القائمة لديهم، وإظهار الضمير يوافق النبرة الخطابية المؤكِّدة.
- source_word: ἐκ ταύτης τῆς ἐργασίας
  choice: من هذه المهنة
  rationale: تدل ἐργασία هنا على نشاط مهني يدرّ المال؛ و«المهنة» واضحة في السياق وتحافظ على إمكان فهمها بوصفها حرفة أو عملًا تجاريًا.
- source_word: ἡ εὐπορία ἡμῖν ἐστιν
  choice: رخاءنا يأتي
  rationale: تنقل εὐπορία بمعنى اليسر والازدهار المادي، وتصوغ علاقة المصدر الواردة في اليونانية بعربية طبيعية من غير قصر المعنى على الدخل وحده.
