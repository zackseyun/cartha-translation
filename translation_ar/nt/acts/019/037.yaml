  text: ἠγάγετε γὰρ τοὺς ἄνδρας τούτους οὔτε ἱεροσύλους οὔτε βλασφημοῦντας τὴν θεὸν ⸀ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/037.yaml
  text: For you have brought these men here who are neither temple robbers nor blasphemers of our goddess[a].
translation:
  language: ar
  text: فقد أحضرتم هذين الرجلين، وهما ليسا سارقي معابد ولا مجدِّفَيْن على إلهتنا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: المقصود بالإلهة هنا أرطاميس، إلهة أهل أفسس.
    reason: contextual_identification
lexical_decisions:
- source_word: ἠγάγετε
  choice: أحضرتم
  rationale: الفعل الماضي يخاطب أهل الجمع ويصف إحضار الرجلين إلى هذا المحفل؛ و«أحضرتم» أفصح وأطبع في هذا السياق من «قدتم».
- source_word: γὰρ
  choice: فقد
  rationale: تفيد الفاء التعليل والربط بما سبق، وتبرز «قد» وقوع الفعل المكتمل من غير إثقال العبارة.
- source_word: τοὺς ἄνδρας τούτους
  choice: هذين الرجلين
  rationale: يحافظ على الدلالة الإشارية لـτούτους وعلى المعنى الذكوري الصريح لـἄνδρας.
- source_word: οὔτε ... οὔτε
  choice: لا ... ولا
  rationale: الصيغة العربية الطبيعية المقابلة للنفي المزدوج المترابط في اليونانية.
- source_word: ἱεροσύλους
  choice: سارقا معابد
  rationale: اللفظة تدل تحديدًا على من ينهب المعابد أو ممتلكاتها المقدسة؛ وهذه الصياغة أوضح من وصف عام مثل «منتهكا المقدسات».
- source_word: βλασφημοῦντας
  choice: مجدِّفان على
  rationale: ينقل معنى الكلام المسيء الموجَّه إلى معبود في سياق ديني وقانوني، مع إبقاء الفعل متعلقًا بالمفعول المذكور.
- source_word: τὴν θεὸν ἡμῶν
  choice: إلهتنا
  rationale: أداة التعريف المؤنثة τὴν وسياق أفسس يدلان على أن المقصود أرطاميس؛ لذلك يقتضي العربية استعمال المؤنث، مع توضيح الصيغة الحرفية في الحاشية.
theological_decisions:
- issue: إحالة τὴν θεὸν ἡμῶν إلى أرطاميس
  choice: إلهتنا
  alternative: إلهنا
  rationale: المتكلم مسؤول وثني أفسسي، والمرجع في السياق هو أرطاميس. المؤنث يمنع توهّم الإشارة إلى الله، وهو قرار معجمي سياقي لا إقرار ديني.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُعملت صيغة المثنى لأن السياق والعبارة يشيران إلى رجلين، وحُفظت بنية النفي المزدوج. وُضع مؤشر الحاشية في المتن كما هو مطلوب.
