    rationale: «سارقا» و«مجدفان» لا يستقيمان هنا بوصفهما خبرين بعد الضمير مع النفي. الصياغة «وهما ليسا سارقي معابد ولا مجدِّفَيْن» تحفظ النفي المزدوج وتصحح الإعراب.
  - severity: medium
    issue: الحاشية تصف «إلهتنا» بأنها ترجمة تفسيرية لصيغة يونانية حرفية «إلهنا».
    rationale: النص يقرأ τὴν θεὸν ἡμῶν، والمقال τὴν مؤنث؛ فالمقصود نحويًا وسياقيًا «إلهتنا». ينبغي ألا توحي الحاشية بأن اليونانية تستعمل المذكر هنا.
  revised_text: فقد أحضرتم هذين الرجلين، وهما ليسا سارقي معابد ولا مجدِّفَيْن على إلهتنا.[a]
