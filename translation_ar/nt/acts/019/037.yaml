  rationale: صُحِّح تركيب خبر المثنى بعد النفي من غير تغيير المعنى أو بنية «لا... ولا» المقابلة لليونانية. كما صُحِّحت الحاشية لتوافق جنس العبارة اليونانية وإحالتها السياقية إلى أرطاميس، بدل تقديم «إلهنا» على أنه المعنى الحرفي للنص.
