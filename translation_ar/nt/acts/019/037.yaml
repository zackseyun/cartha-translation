  source_fidelity: 'المعنى العام منقول بأمانة: الإحضار، والرجلان، ونفي نهب المعابد والتجديف على أرطاميس. لكن تركيب النفي في العربية يحتاج إلى تصحيح نحوي، كما أن الحاشية الحالية تخطئ في وصف اليونانية بأنها تقول حرفيًا «إلهنا».'
  naturalness: «وهما لا سارقا معابد ولا مجدِّفان» غير سليم في هذا التركيب؛ فاستعمال «ليسا» مع خبرٍ مثنّى يجعل العبارة فصيحة وطبيعية وواضحة.
  terminology: «سارقي معابد» ينقل ἱεροσύλους بدقة في هذا السياق، و«مجدِّفَيْن على» مناسب لـβλασφημοῦντας. و«إلهتنا» هي الترجمة الصحيحة؛ فالـمقال المؤنث τὴν في النص اليوناني يحدد الإحالة إلى الإلهة أرطاميس، لا إلى «إلهنا».
  issues:
