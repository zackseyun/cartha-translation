  text: εἰ δέ τι ⸀περαιτέρω ἐπιζητεῖτε, ἐν τῇ ἐννόμῳ ἐκκλησίᾳ ἐπιλυθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/039.yaml
  text: But if you seek anything further[a], it will be settled in the lawful assembly.
translation:
  language: ar
  text: أما إن كنتم تطلبون أمرًا إضافيًا[a]، فسيُبتّ فيه في الجمعية المنعقدة وفقًا للقانون.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «تطلبون شيئًا آخر بالإضافة إلى ذلك». ويمكن أيضًا ترجمة العبارة التالية: «في الجمعية القانونية» أو «في الجمعية النظامية». والمقصود جمعية مدنية منعقدة وفقًا للقانون، لا الكنيسة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περαιτέρω
  choice: آخر
  rationale: يفيد أمرًا إضافيًا يتجاوز المسألة الحاضرة، وتعبير «أمرًا آخر» طبيعي وواضح في العربية.
- source_word: ἐπιζητεῖτε
  choice: تطلبون
  rationale: يحافظ على المعنى الواسع للسعي إلى أمر أو المطالبة بالنظر فيه، من غير تضييقه إلى الاستفسار وحده.
- source_word: ἐννόμῳ
  choice: المنعقدة وفقًا للقانون
  rationale: ينقل كون الجمعية مشكلة ومنعقدة بحسب الإجراءات القانونية، ويزيل احتمال فهم الصفة على أنها وصف أخلاقي عام.
- source_word: ἐκκλησίᾳ
  choice: الجمعية
  rationale: السياق يشير إلى هيئة مدنية مجتمعة، لا إلى الكنيسة المسيحية؛ و«الجمعية» تلائم الاستعمال المدني.
- source_word: ἐπιλυθήσεται
  choice: فسيُبتّ فيه
  rationale: صيغة مبنية للمجهول تدل على معالجة الأمر وحسمه رسميًا في سياق مدني قانوني.
- source_word: τι
  choice: أمرًا
  rationale: يجعل الضمير المبهم مفهومًا في العربية داخل السياق الإجرائي، من غير إضافة مضمون غير موجود في الأصل.
theological_decisions:
- issue: دلالة ἐκκλησία في سياق مدني غير مسيحي
  choice: الجمعية
  alternative: الكنيسة؛ الاجتماع
  rationale: المرجع هنا تجمع مدني قانوني في أفسس، ولذلك فإن «الكنيسة» توحي خطأً بجماعة مسيحية، بينما تحافظ «الجمعية» على معنى الهيئة المجتمعة.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة مدنية رسمية. استُعمل «فسيُبتّ فيه» لملاءمة السياق الإجرائي، و«الجمعية» لتجنب الإيحاء الكنسي غير المقصود.
