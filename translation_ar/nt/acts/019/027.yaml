  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: οὐ μόνον δὲ τοῦτο κινδυνεύει ἡμῖν τὸ μέρος εἰς ἀπελεγμὸν ἐλθεῖν, ἀλλὰ καὶ τὸ τῆς μεγάλης θεᾶς ⸂Ἀρτέμιδος ἱερὸν⸃ εἰς οὐθὲν λογισθῆναι, μέλλειν ⸀τε καὶ καθαιρεῖσθαι ⸂τῆς μεγαλειότητος⸃ αὐτῆς, ἣν ὅλη ἡ Ἀσία καὶ ἡ οἰκουμένη σέβεται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/027.yaml
  text: And not only is this trade of ours in danger of coming into disrepute, but also the temple of the great goddess Artemis may be counted as nothing, and even her majesty—whom all Asia and the world worships—may be brought down.
translation:
  language: ar
  text: فليست مهنتنا هذه وحدها مهددة بأن تصير موضع ازدراء، بل إن معبد الإلهة العظيمة أرطاميس مهدد بأن يُحسب كأنه لا شيء، وإن عظمتها نفسها توشك أن تُحطّ[a]، وهي التي تعبُدها آسيا كلها والمسكونة بأسرها[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «جلالها» أو «مكانتها الرفيعة». تشير العبارة اليونانية إلى عظمة أرطاميس أو بهائها ومقامها.'
    reason: lexical_alternative
  - marker: b
    text: أي العالم المأهول؛ وغالبًا ما تشير الكلمة اليونانية إلى العالم المعروف أو الأوسع، ولا سيما العالم الروماني.
    reason: lexical_alternative
lexical_decisions:
- source_word: κινδυνεύει
  choice: الخطر ... قد ... توشك
  rationale: ينقل معنى التعرّض للخطر، مع امتداد هذا الخطر إلى عناصر الجملة المنسقة كلها، بصياغة عربية طبيعية.
- source_word: τὸ μέρος
  choice: مهنتنا هذه
  rationale: يدل السياق على مجال عمل ديمتريوس والصنّاع وحرفتهم، لا على «جزء» مجرد.
- source_word: εἰς ἀπελεγμὸν ἐλθεῖν
  choice: أن تصير ... موضع ازدراء
  rationale: يحفظ معنى الانتقال إلى حال من الاحتقار وسوء السمعة دون حصره في الخسارة المالية.
- source_word: ἱερὸν
  choice: هيكل
  rationale: يشير إلى المعبد أو الحرم المقدس؛ و«هيكل» تعبير عربي واضح ومألوف في هذا السياق.
- source_word: εἰς οὐθὲν λογισθῆναι
  choice: يُحسب ... كأنه لا شيء
  rationale: يحافظ على صورة الحسبان والتقييم الواردة في اليونانية من غير إضافة تفسير مثل «عديم القيمة».
- source_word: μέλλειν τε καὶ καθαιρεῖσθαι τῆς μεγαλειότητος αὐτῆς
  choice: توشك هي أيضًا أن تُجرَّد من عظمتها
  rationale: «توشك» تنقل دلالة μέλλειν على الأمر الوشيك، و«تُجرَّد من عظمتها» تعبّر عن إنزال أرطاميس عن مكانتها أو سلب جلالها مع إبقاء المعنى المحتمل مفتوحًا.
- source_word: ὅλη ἡ Ἀσία
  choice: آسيا كلها
  rationale: المقصود إقليم آسيا الروماني، والصياغة تحفظ الاسم والنبرة الشاملة في خطاب ديمتريوس.
- source_word: ἡ οἰκουμένη
  choice: المسكونة بأسرها
  rationale: ينقل اللفظ معنى العالم المأهول، ولا سيما الأفق الأوسع للعالم الروماني، مع إيضاح البديل في الحاشية.
- source_word: σέβεται
  choice: تعبُدها
  rationale: السياق شعائري ديني، والفعل يدل هنا على التبجيل الديني أو العبادة.
theological_decisions:
- issue: نقل لغة العبادة الوثنية كما وردت في خطاب ديمتريوس
  choice: الإلهة العظيمة أرطاميس ... تعبُدها آسيا كلها والمسكونة بأسرها
  alternative: ما تُدعى الإلهة العظيمة أرطاميس ... تُبجّلها
  rationale: النص ينقل كلام ديمتريوس من منظوره؛ لذلك لا تُضاف عبارة تشكيك غير موجودة في اليونانية، ولا يعني النقل إقرار الراوي بصحة دعواه.
- issue: تحديد ما يقع عليه الحط أو التجريد في العبارة اليونانية المكثفة
  choice: توشك هي أيضًا أن تُجرَّد من عظمتها
  alternative: وتوشك عظمتها أيضًا أن تنهار
  rationale: الضمير المؤنث والسياق يرجحان الإشارة إلى أرطاميس، لكن العبارة تحتمل التركيز على جلالها أو مكانتها؛ لذا اختير تعبير يحفظ هذا التوتر دون تخصيصه بزوال سياسي أو بهدم مادي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُخدمت «أرطاميس» بوصفها الصيغة العربية الشائعة للاسم، وحُفظت النبرة التحذيرية والتجارية في خطاب ديمتريوس من غير تهوين للغة الوثنية أو إقرار بها.
