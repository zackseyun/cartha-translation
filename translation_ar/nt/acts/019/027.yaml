revisions:
- from: ولا يقتصر الخطر على أن تصير مهنتنا هذه موضع ازدراء، بل قد يُحسب هيكل الإلهة العظيمة أرطاميس كأنه لا شيء، بل توشك هي أيضًا أن تُجرَّد من عظمتها[a]، وهي التي تعبُدها آسيا كلها والمسكونة بأسرها[b].
  to: فليست مهنتنا هذه وحدها مهددة بأن تصير موضع ازدراء، بل إن معبد الإلهة العظيمة أرطاميس مهدد بأن يُحسب كأنه لا شيء، وإن عظمتها نفسها توشك أن تُحطّ[a]، وهي التي تعبُدها آسيا كلها والمسكونة بأسرها[b].
  rationale: 'التعديل يقرّب الإسناد من النص اليوناني: فالمعبد قد يُحسب لا شيء، وعظمة أرطاميس أو جلالها توشك أن تُحطّ. كما يستبدل «هيكل» بـ«معبد» للوضوح الاصطلاحي في سياق معبد أرطاميس، ويبقي لغة العبادة الوثنية منقولةً بوصفها جزءًا من خطاب ديمتريوس بلا تخفيف أو إقرار.'
