  rationale: عُدِّلت العبارة التي تؤدي νεωκόρον إلى «قيِّمة على» لتكون الصفة المدنية الدينية للمدينة حاكمةً للمعبود والشيء المعطوف عليهما معًا، بدل إعادة «حارسة» التي تثقل العبارة وتضيق دلالتها. كما استُبدل «الجموع» بـ«الحشد» لمقابلة المفرد الجمعي ὄχλον بصورة أقرب. ولم يُضف النص أن الشيء تمثال، إذ إن المرجع غير مصرَّح به في الأصل.
