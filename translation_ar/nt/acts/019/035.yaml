source:
  edition: SBLGNT
  text: καταστείλας δὲ ⸂ὁ γραμματεὺς τὸν ὄχλον⸃ φησίν· Ἄνδρες Ἐφέσιοι, τίς γάρ ἐστιν ⸀ἀνθρώπων ὃς οὐ γινώσκει τὴν Ἐφεσίων πόλιν νεωκόρον οὖσαν τῆς ⸀μεγάλης Ἀρτέμιδος καὶ τοῦ διοπετοῦς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/035.yaml
  text: But after the city clerk had quieted the crowd, he said, “Men of Ephesus, for what man is there who does not know that the city of the Ephesians is temple-keeper of the great Artemis and of the image fallen from heaven?”
translation:
  language: ar
  text: 'فهدَّأ كاتبُ المدينة الحشدَ، ثم قال: «يا رجال أفسس، مَن من الناس لا يعرف أن مدينة الأفسسيين قيِّمةٌ على معبد أرطاميس العظيمة[a] وعلى الشيء الذي سقط من السماء[b]؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «حارسة هيكل أرطاميس العظيمة». يدل اللفظ اليوناني على مدينة معترف بها قيِّمةً على معبد أو على عبادة مرتبطة به.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «الساقط من السماء». لا يحدد اللفظ اليوناني ماهية هذا الشيء؛ ولعله يشير إلى الصورة أو التمثال المقدس المرتبط بأرطاميس.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καταστείλας
  choice: فهدَّأ
  rationale: اسم الفاعل اليوناني يدل على فعل سبق القول؛ وتؤدي الفاء مع «ثم قال» هذا التعاقب بوضوح وطبيعية.
- source_word: ὁ γραμματεὺς
  choice: كاتبُ المدينة
  rationale: المقصود موظف مدني في أفسس، لا ناسخ أو كاتب ديني؛ وهذا التعبير يوضح وظيفته البلدية.
- source_word: τὸν ὄχλον
  choice: الجموع
  rationale: تعبير عربي طبيعي عن الحشد المضطرب في هذا السياق العام.
- source_word: Ἄνδρες Ἐφέσιοι
  choice: يا رجال أفسس
  rationale: يحفظ النداء المذكر الصريح ويأتي في عربية واضحة.
- source_word: τίς γάρ ἐστιν ἀνθρώπων ὃς οὐ γινώσκει
  choice: مَن من الناس لا يعرف
  rationale: ينقل السؤال الإنكاري بإيجاز عربي طبيعي، من غير إضافة تفسير.
- source_word: τὴν Ἐφεσίων πόλιν
  choice: مدينة الأفسسيين
  rationale: يحافظ على صيغة الإضافة في اليونانية بدل تسويتها إلى «مدينة أفسس».
- source_word: νεωκόρον
  choice: حارسةُ هيكل
  rationale: يدل اللفظ على مدينة معترف بها بوصفها راعيةً أو قيّمةً على معبد وعبادته؛ و«حارسة هيكل» واضحة وتحفظ الصورة المجازية للمدينة.
- source_word: τῆς μεγάλης Ἀρτέμιδος
  choice: أرطاميس العظيمة
  rationale: ينقل اللقب التعبدي كما ورد في كلام المسؤول، من غير إقرار بصحته.
- source_word: τοῦ διοπετοῦς
  choice: الشيء الذي سقط من السماء
  rationale: اللفظ اليوناني صفة اسمية لا يحدد صراحةً ماهية الساقط؛ لذا يحفظ هذا الاختيار الغموض الحقيقي بدل الجزم بأنه تمثال أو حجر.
theological_decisions:
- issue: نقل الدعوى الوثنية بشأن أرطاميس والشيء الساقط من السماء
  choice: 'صياغتها بوصفها كلام المسؤول المدني: «حارسة هيكل أرطاميس العظيمة، وحارسة الشيء الذي سقط من السماء»'
  alternative: «حارسة هيكل أرطاميس العظيمة وتمثالها الذي سقط من السماء»
  rationale: النص يورد اعتقاد المتكلم ولا يثبته. كما أن διοπετοῦς لا يصرح بأن المشار إليه تمثال، ولذلك أبقينا ماهيته غير محددة في المتن وشرحنا الاحتمال في الحاشية.
translation_notes:
  register: عربية فصحى حديثة، واضحة ورصينة. استُعمل «كاتب المدينة» للدور الإداري، وحُفظ النداء المذكر «يا رجال أفسس». وُضعت علامتا الحاشيتين في المتن عند موضعيهما، مع إبقاء غموض διοπετοῦς وعدم تحويل الدعوى الوثنية إلى تقرير من الراوي.
