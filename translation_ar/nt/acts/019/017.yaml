source:
  edition: SBLGNT
  text: τοῦτο δὲ ἐγένετο γνωστὸν πᾶσιν Ἰουδαίοις τε καὶ Ἕλλησιν τοῖς κατοικοῦσιν τὴν Ἔφεσον, καὶ ⸀ἐπέπεσεν φόβος ἐπὶ πάντας αὐτούς, καὶ ἐμεγαλύνετο τὸ ὄνομα τοῦ κυρίου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/017.yaml
  text: And this became known to all the Jews and Greeks living in Ephesus[a], and fear fell upon them all[b], and the name of the Lord Jesus was being magnified.
translation:
  language: ar
  text: وصار هذا معروفًا لدى جميع اليهود واليونانيين الساكنين في أفسس، ووقع الخوف عليهم جميعًا، وكان اسم الرب يسوع يُعظَّم.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وكان اسم الرب يسوع يُمجَّد»، أو: «كان يحظى بإكرام عظيم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: هذا
  rationale: اسم إشارة مفرد يعود إلى الحادثة السابقة، و«هذا» يحافظ على الإحالة من غير زيادة تفسيرية.
- source_word: ἐγένετο γνωστὸν
  choice: صار معروفًا
  rationale: ينقل تركيب γίνομαι مع الصفة ودلالته على الانتقال إلى حالة المعرفة العامة بصياغة عربية طبيعية.
- source_word: πᾶσιν Ἰουδαίοις τε καὶ Ἕλλησιν
  choice: لدى جميع اليهود واليونانيين
  rationale: «لدى» تؤدي دلالة المجرور الدال على الذين بلغتهم معرفة الأمر، مع إبقاء المجموعتين متميزتين.
- source_word: τοῖς κατοικοῦσιν τὴν Ἔφεσον
  choice: الساكنين في أفسس
  rationale: ترجمة مباشرة وواضحة لاسم الفاعل، وهو وصف يعود إلى اليهود واليونانيين معًا.
- source_word: ἐπέπεσεν φόβος ἐπὶ πάντας αὐτούς
  choice: فوقع الخوف عليهم جميعًا
  rationale: يحفظ الصورة الحية للفعل ἐπιπίπτω، وهو تعبير عربي مفهوم يترك φόβος على عمومه بين الخوف والرهبة.
- source_word: φόβος
  choice: الخوف
  rationale: أوسع مقابل غير تفسيري؛ فلا يحصر المعنى في الرعب ولا يحوله حصرًا إلى التوقير.
- source_word: ἐμεγαλύνετο
  choice: كان يُعظَّم
  rationale: «يُعظَّم» يحفظ صورة التكبير والتبجيل، و«كان» مع المضارع تنقل دلالة الماضي الناقص على الاستمرار.
- source_word: τὸ ὄνομα
  choice: اسم
  rationale: يحافظ على اللفظ الصريح وما يحمله من دلالات السمعة والسلطان والكرامة، بدل اختزاله في «السمعة».
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: الرب يسوع
  rationale: «الرب» المقابل المعتاد للقب κύριος هنا، والإضافة العربية الطبيعية هي «اسم الرب يسوع».
theological_decisions:
- issue: ترجمة κύριος بوصفه لقبًا ليسوع
  choice: الرب
  alternative: السيد
  rationale: «الرب» يحفظ اللقب المسيحاني ورنينه الكتابي من غير استبداله بتعبير أضيق.
- issue: هل يترجم τὸ ὄνομα ترجمة حرفية أم تفسيرية
  choice: اسم الرب يسوع
  alternative: سمعة الرب يسوع
  rationale: إبقاء «الاسم» يصون الثقل الأدبي واللاهوتي للتعبير، ولا يقصره على مفهوم السمعة الحديث.
- issue: دلالة ἐμεγαλύνετο المبني للمجهول
  choice: كان يُعظَّم
  alternative: كان يحظى بإكرام عظيم
  rationale: الصياغة المختارة تحافظ على المبني للمجهول وعلى الاستمرار، من دون تعيين فاعل غير مذكور أو تفسير نوع التعظيم تفسيرًا ضيقًا.
translation_notes:
  register: 'عربية فصحى حديثة واضحة ووقورة. حُفظت الاستعارة في «وقع الخوف عليهم»، واستُخدم «كان يُعظَّم» لنقل صيغة الماضي الناقص المبني للمجهول. صُحّح موضع الحواشي بحسب الأصل: البدائل المذكورة في الحاشية الإنجليزية الأولى تخص عبارة الخوف لا «أفسس»، ولذلك لم تُنشأ حاشية عند اسم المدينة، وجُمعت البدائل المفيدة لعبارة التعظيم في الحاشية [a].'
