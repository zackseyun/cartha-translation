  text: ἀποκριθὲν δὲ τὸ πνεῦμα τὸ πονηρὸν εἶπεν ⸀αὐτοῖς· ⸀Τὸν Ἰησοῦν γινώσκω καὶ τὸν Παῦλον ἐπίσταμαι, ὑμεῖς δὲ τίνες ἐστέ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/015.yaml
  text: But the evil spirit answered them[a], “Jesus I know, and Paul I recognize—but who are you?”
translation:
  language: ar
  text: 'لكن الروح الشرير أجابهم[a]: «يسوع أعرفه، وبولس أعلم من هو؛ أما أنتم، فمن أنتم؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمة العبارة: «يسوع أعرفه، وبولس أعرف عنه». يستعمل النص اليوناني فعلين مختلفين: γινώσκω («أعرف») وἐπίσταμαι («أعلم» أو «أعرف عنه»)، وقد يوحيان باختلاف في الدلالة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθὲν ... εἶπεν αὐτοῖς
  choice: أجابهم
  rationale: التركيب اليوناني «أجاب... وقال لهم» اصطلاحي في تقديم الكلام؛ وصيغة «أجابهم» عربية طبيعية تحفظ معنى الرد وتتفادى التكرار الحرفي.
- source_word: δὲ
  choice: لكن
  rationale: تفيد انتقالًا ذا مسحة تقابلية من محاولة طرد الروح إلى رده عليهم.
- source_word: τὸ πνεῦμα τὸ πονηρόν
  choice: الروح الشرير
  rationale: تعبير عربي واضح ومألوف يدل هنا على كائن روحي شخصي متصف بالشر.
- source_word: Τὸν Ἰησοῦν γινώσκω
  choice: يسوع أعرفه
  rationale: يحافظ تقديم «يسوع» على موضعه البارز في اليونانية، و«أعرفه» ترجمة مباشرة وطبيعية لـγινώσκω.
- source_word: τὸν Παῦλον ἐπίσταμαι
  choice: بولس أعلم من هو
  rationale: تعكس العبارة فعلًا مختلفًا عن γινώσκω وتحمل معنى العلم به ومعرفة شأنه، من غير تقرير فرق عقدي محدد في درجة المعرفة.
- source_word: ὑμεῖς δὲ τίνες ἐστέ
  choice: أما أنتم، فمن أنتم؟
  rationale: «أما» تبرز المقابلة، وذكر «أنتم» صراحة يحفظ توكيد الضمير اليوناني وصيغة الجمع.
theological_decisions:
- issue: التمييز بين γινώσκω وἐπίσταμαι في كلام الروح
  choice: «يسوع أعرفه، وبولس أعلم من هو»
  alternative: «يسوع أعرفه، وبولس أعرف عنه» أو «يسوع أعرفه، وبولس أعرفه»
  rationale: استعمال فعلين يونانيين مختلفين قد يقصد به فرق دلالي أو بلاغي. تحافظ الصياغة المختارة على الاختلاف من غير أن تستنتج مراتب محددة لمعرفته بيسوع وببولس.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حوفظ على توكيد الاسمين والضمير، وعلى الفرق المحتمل بين فعلي المعرفة، مع تجنب الصياغة الحرفية الثقيلة.
