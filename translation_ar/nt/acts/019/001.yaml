id: ACT.19.1
reference: Acts 19:1
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν τῷ τὸν Ἀπολλῶ εἶναι ἐν Κορίνθῳ Παῦλον διελθόντα τὰ ἀνωτερικὰ μέρη ⸀ἐλθεῖν εἰς Ἔφεσον καὶ ⸀εὑρεῖν τινας μαθητάς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/001.yaml
  text: It happened that while Apollos was in Corinth[a], Paul passed through the inland regions and came to Ephesus and found some disciples[b],
translation:
  language: ar
  text: وحدث، بينما كان أبلّوس في كورنثوس، أن اجتاز بولس المناطق الداخلية[a] ووصل إلى أفسس، فوجد بعض التلاميذ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «المناطق العليا» أو «المناطق الواقعة في الداخل». ويُرجَّح أن العبارة تشير إلى الطريق الداخلي عبر المناطق المرتفعة، لا إلى الطريق الساحلي.
    reason: lexical_alternative
  - marker: b
    text: لم يحدد النص هنا مَن كان هؤلاء «التلاميذ»؛ وتبيّن الأعداد التالية أن لهم صلة بمعمودية يوحنا.
    reason: cross_reference
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: وحدث
  rationale: صيغة انتقال سردي تفيد وقوع الحدث؛ تحافظ «وحدث» على الصلة بالسياق من غير إضافة ظرف زمني غير موجود في الأصل.
- source_word: ἐν τῷ τὸν Ἀπολλῶ εἶναι ἐν Κορίνθῳ
  choice: بينما كان أبلّوس في كورنثوس
  rationale: التركيب بالمصدر المعرّف مع ἐν τῷ يدل على التزامن، و«بينما» تؤديه بعربية طبيعية واضحة.
- source_word: διελθόντα
  choice: اجتاز
  rationale: يدل الفعل على المرور عبر منطقة، وتفيد صيغة الماضي هنا أن هذا الاجتياز سبق الوصول إلى أفسس.
- source_word: τὰ ἀνωτερικὰ μέρη
  choice: المناطق الداخلية
  rationale: المعنى الحرفي هو «المناطق العليا»، لكن السياق الجغرافي يرجّح الطريق الداخلي أو المرتفع في مقابل الطريق الساحلي؛ وتُذكر البدائل في الحاشية حفظًا لاحتمال اللفظ.
- source_word: ἐλθεῖν εἰς Ἔφεσον
  choice: ووصل إلى أفسس
  rationale: يعبّر بوضوح عن انتهاء حركة بولس إلى المدينة، وهو طبيعي في العربية ضمن تسلسل الرحلة.
- source_word: καὶ εὑρεῖν
  choice: فوجد
  rationale: الفاء مناسبة للتتابع السردي الطبيعي بعد الوصول، من غير تغيير في مضمون العطف اليوناني.
- source_word: τινας μαθητάς
  choice: بعض التلاميذ
  rationale: تنقل «بعض» معنى التنكير في τινας، وتبقي «التلاميذ» هويتهم غير محددة كما في النص اليوناني.
theological_decisions:
- issue: هوية μαθητάς في السياق
  choice: بعض التلاميذ
  alternative: بعض تلاميذ يوحنا؛ بعض تلاميذ يسوع
  rationale: لا يحدد هذا العدد الجهة التي يتبعها هؤلاء التلاميذ، بل تكشف الأعداد التالية صلتهم بمعمودية يوحنا؛ لذلك لا تُحسم هويتهم في المتن قبل أن يوضحها السرد.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة سردية وقورة. وُضعت علامة الحاشية [a] بعد «المناطق الداخلية» لأنها تتعلق بعبارة τὰ ἀνωτερικὰ μέρη، لا باسم كورنثوس.
