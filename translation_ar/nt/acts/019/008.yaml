revisions:
- from: ثم دخل المجمع، وكان يتكلم بجرأة طوال ثلاثة أشهر، محاورًا إياهم وساعيًا إلى إقناعهم بشأن ملكوت الله.[a][b]
  to: ودخل المجمع، فكان يتكلم بجرأة مدة ثلاثة أشهر، يحاورهم ويسعى إلى إقناعهم بشأن ملكوت الله.[a]
  rationale: نُقلت علامة الحاشية لتتصل بعبارة «ملكوت الله» التي تشرحها، وحُذفت الحاشية الأخرى لأنها لا تقدم بديلًا محايدًا بل قد توحي بنتيجة غير مقصودة. واستُعمل «يسعى إلى إقناعهم» في المتن لتصوير فعل الإقناع من غير الجزم بأن جميع السامعين اقتنعوا، مع الحفاظ على المفعول المفهوم سياقيًا. كما عُدلت بداية الجملة لتكون أوثق بترابط اليونانية وأكثر سلاسة بالعربية.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:20:22Z'
