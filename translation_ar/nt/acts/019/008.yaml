  text: Εἰσελθὼν δὲ εἰς τὴν συναγωγὴν ἐπαρρησιάζετο ἐπὶ μῆνας τρεῖς διαλεγόμενος καὶ ⸀πείθων περὶ τῆς βασιλείας τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/008.yaml
  text: And entering the synagogue[a], he spoke boldly for three months[b], reasoning and persuading them about the kingdom of God.
translation:
  language: ar
  text: ودخل المجمع، فكان يتكلم بجرأة مدة ثلاثة أشهر، يحاورهم ويسعى إلى إقناعهم بشأن ملكوت الله.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أن يدل «ملكوت الله» أيضًا على مُلك الله وحُكمه وسلطانه.
    reason: semantic_range
lexical_decisions:
- source_word: Εἰσελθὼν δὲ
  choice: ثم دخل
  rationale: اسم الفاعل الأُريستي يهيئ الظرف السابق للفعل الرئيس، و«ثم دخل» تؤدي تتابع السرد بوضوح وطبيعية من غير إثقال العبارة بصيغة حرفية.
- source_word: τὴν συναγωγήν
  choice: المجمع
  rationale: يشير اللفظ هنا إلى المجمع اليهودي، و«المجمع» هو المقابل العربي المألوف والدقيق في سياق سفر الأعمال.
- source_word: ἐπαρρησιάζετο
  choice: كان يتكلم بجرأة
  rationale: صيغة الماضي الناقص تدل على كلام جريء علني متواصل، وقد حُفظ هذا الجانب الاستمراري بصيغة «كان يتكلم»، مع تأييده بذكر مدة الأشهر الثلاثة.
- source_word: ἐπὶ μῆνας τρεῖς
  choice: طوال ثلاثة أشهر
  rationale: ἐπί مع النصب هنا تفيد امتداد المدة، و«طوال» تعبير عربي طبيعي يبرز الاستمرار.
- source_word: διαλεγόμενος
  choice: محاورًا إياهم
  rationale: يدل اللفظ على مناقشة تقوم على العرض والاستدلال، و«محاورًا» يحفظ البعد التفاعلي من غير أن يضفي نبرة خصامية زائدة. المفعول مفهوم من جمهور المجمع.
- source_word: πείθων
  choice: ساعيًا إلى إقناعهم
  rationale: يعبر اسم الفاعل عن نشاط بولس في الإقناع، وهذه الصياغة لا تفترض أن جميع السامعين اقتنعوا بالفعل، مع إبقاء البديل الأقرب إلى ظاهر اللفظ في الحاشية.
- source_word: περὶ τῆς βασιλείας τοῦ θεοῦ
  choice: بشأن ملكوت الله
  rationale: περί مع المضاف إليه تفيد موضوع الكلام. و«ملكوت الله» مصطلح عربي راسخ يحفظ العبارة اللاهوتية، مع التنبيه إلى دلالة الحكم أو السلطان في الحاشية.
theological_decisions:
- issue: مفعول πείθων مضمر في اليونانية
  choice: إظهار الضمير في «إقناعهم»
  alternative: إبقاء الفعل بلا مفعول صريح
  rationale: العربية الطبيعية تقتضي هنا بيان من يقع عليهم الإقناع، وسامعو المجمع هم المرجع الواضح من السياق؛ فلا يضيف الضمير جمهورًا غير موجود في النص.
- issue: هل πείθων يقرر تحقق الاقتناع أم يصف مسعى الإقناع؟
  choice: «ساعيًا إلى إقناعهم»
  alternative: «مقنعًا إياهم»
  rationale: الصيغة اليونانية تصف نشاط الإقناع، لكنها لا توجب أن يكون كل السامعين قد اقتنعوا. اختيرت عبارة تحفظ هذه المساحة من غير حسم نتيجة الاستجابة، ووُضع المقابل الأقرب حرفيًا في الحاشية.
- issue: دلالة βασιλεία τοῦ θεοῦ
  choice: «ملكوت الله»
  alternative: «مُلك الله» أو «حُكم الله»
  rationale: «ملكوت الله» هو التعبير العربي المعروف والمتسق، لكن βασιλεία قد تبرز أيضًا فعل المُلك والحكم؛ لذلك لم تُحصر الدلالة في كيان مكاني، ونُبّه إلى الوجه الآخر في الحاشية.
translation_notes:
  register: الصياغة عربية فصحى معاصرة، واضحة ومهيبة من غير تراكيب تراثية ثقيلة. استُخدمت «كان يتكلم» لإظهار الاستمرار، و«محاورًا» لنقل طابع النقاش والاستدلال، مع الحفاظ على المصطلح الكتابي المألوف «ملكوت الله» وشرح مداه الدلالي في الحاشية.
