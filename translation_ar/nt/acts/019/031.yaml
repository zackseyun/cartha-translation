review_pass:
  verdict: revise
  source_fidelity: 'المسودة أمينة في مجملها للمعنى: فهي تحافظ على «بعض» وعلى الصلة الودية ببولس، وإرسالهم إليه، وتحذيرهم له من الذهاب إلى المسرح. لكن عبارة «ويعرّض نفسه للخطر» تضيف تفسيرًا للخطر المحتمل لا تصرّح به العبارة اليونانية، وإن كان مناسبًا للسياق. كما أن «قد أرسلوا» مع «وكان» أثقل من اللازم ولا يعكس بسلاسة علاقة الفعل المرافق بالفعل الرئيس.'
  naturalness: العربية مفهومة وفصيحة، إلا أن «الأسيارخة» غير ميسّرة من حيث صياغة الجمع، و«وظلّوا يناشدونه» أقل سلاسة هنا من «وكانوا يلحّون عليه». الصياغة المقترحة أوضح في العربية المعاصرة.
  terminology: يُحافَظ على اللقب التاريخي بالنقل الصوتي مع حاشية. واستعمال «الآسيارخيين» يقدّم صيغة جمع عربية أوضح للقب المنقول. لا توجد مصطلحات لاهوتية خاصة في الآية.
  issues:
  - severity: medium
    issue: إضافة «ويعرّض نفسه للخطر» إلى المتن.
    rationale: هذا يفسر المخاطرة المفهومة من السياق، لكن اليونانية تقول حرفيًا إنه لا يقدّم/يذهب بنفسه إلى المسرح، ولا تذكر الخطر صراحة. ينبغي إبقاء هذا التفسير خارج المتن حفاظًا على التكافؤ الأمثل.
  - severity: low
    issue: الصياغة «الأسيارخة» غير مستقرة بوصفها جمعًا عربيًا واضحًا.
    rationale: اللقب المنقول يحتاج صيغة جمع أسلس للقارئ العربي؛ «الآسيارخيين» أوضح مع بقاء الحاشية الثقافية.
  - severity: low
    issue: «قد أرسلوا» مع «وكان أيضًا» يثقل تسلسل السرد.
    rationale: الفعل اليوناني المشارك يدل على إرسال سابق/مرافق لالتماسهم، ويمكن للعربية أن تعبر عنه بـ«فأرسلوا إليه وكانوا يلحّون عليه» دون الإيحاء بزمن ماضٍ أبعد لازم.
