  yaml_path: translation/nt/acts/019/031.yaml
  text: And even some of the Asiarchs[a], being his friends[c][b], sent word to him and urged him not to venture into the theater.
translation:
  language: ar
  text: وكان أيضًا بعضُ الآسيارخيين[a]، وهم أصدقاءُ بولس، قد أرسلوا إليه، وكانوا يلحّون عليه ألّا يذهب إلى المسرح.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «الآسيارخيون» لقبٌ لمسؤولين بارزين مرتبطين بمقاطعة آسيا الرومانية.
    reason: cultural_note
lexical_decisions:
- source_word: τινὲς δὲ καὶ
  choice: وكان أيضًا بعضُ
  rationale: تحافظ «بعض» على عدم التحديد، وتنقل «أيضًا» معنى الإضافة الملحوظة في καὶ، بينما تصل «وكان» الجملة بسياق السرد دون تشديد غير لازم على المقابلة في δέ.
- source_word: τῶν Ἀσιαρχῶν
  choice: الأسيارخة
  rationale: لقب تقني لمسؤولين بارزين مرتبطين بمقاطعة آسيا الرومانية؛ أبقت الترجمة اللقب منقولًا صوتيًا مع شرحه في الحاشية حتى لا يُختزل في وصف إداري عام.
- source_word: ὄντες αὐτῷ φίλοι
  choice: وهم من أصدقاء بولس
  rationale: صياغة عربية طبيعية تنقل الوصف الخلفي والعلاقة الشخصية، مع إظهار مرجع الضمير باسم بولس لاتضاحه في العربية.
- source_word: πέμψαντες πρὸς αὐτὸν
  choice: قد أرسلوا إليه رسالةً
  rationale: فعل الإرسال بلا مفعول صريح في اليونانية، لكن السياق يفيد إرسال بلاغ أو رسالة؛ وإثبات «رسالة» يجعل العبارة العربية مكتملة وطبيعية.
- source_word: παρεκάλουν
  choice: وظلّوا يناشدونه
  rationale: ينقل «يناشدونه» قوة الالتماس، وتُظهر «ظلّوا» دلالة الاستمرار أو التكرار الممكنة في صيغة الماضي الناقص.
- source_word: μὴ δοῦναι ἑαυτὸν εἰς τὸ θέατρον
  choice: ألّا يدخل المسرح ويعرّض نفسه للخطر
  rationale: التعبير اليوناني الحرفي «ألّا يعطي نفسه إلى المسرح» غير طبيعي عربيًا؛ والصياغة المختارة تنقل الحركة إلى داخل المسرح والتعريض الإرادي للنفس للخطر من غير أن توحي بالاستسلام الرسمي.
