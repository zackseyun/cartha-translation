  source_fidelity: المعنى العام منقول بدقة، بما في ذلك التباين بين ما كان يهتف به الحاضرون، ودلالة ἐκκλησία المدنية. لكن «اجتمعوا» لا تُظهر بوضوح قيمة الماضي الأسبق في συνεληλύθεισαν؛ و«كان بعضهم يصرخ» أضعف من صيغة الجمع الأفصح مع «بعضهم».
  naturalness: الصياغة مفهومة وفصيحة عمومًا، غير أن «فكان بعضهم يصرخ بشيء» أقل سلاسة ودقة من «فكان بعضهم يصرخون بشيء»، كما أن «كان الجمع في اضطراب» يمكن صياغتها بوضوح أكبر دون تغيير المعنى.
  terminology: «الجمع» مناسب في هذا السياق المدني ولا يوحي بالكنيسة. وتبقى الحاشية مفيدة لتبيين أن ἐκκλησία لا تدل هنا على جماعة مسيحية.
  issues:
