base_translation:
  language: en
  yaml_path: translation/nt/acts/019/032.yaml
  text: So then some were shouting one thing and some another[a], for the assembly was in confusion, and most of them did not know why they had come together.
translation:
  language: ar
  text: فكان بعضهم يصرخون بشيء، وآخرون بشيء آخر، لأن الجمع[a] كان مضطربًا، ولم يكن أكثرهم يعرفون لماذا كانوا قد اجتمعوا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «التجمع» أو «الجمهور». الكلمة اليونانية هي ἐκκλησία، وهي تشير هنا إلى اجتماع مدني، لا إلى الكنيسة.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλοι μὲν οὖν ἄλλο τι ἔκραζον
  choice: فكان بعضهم يصرخ بشيء، وبعضهم بشيء آخر
  rationale: ينقل التقابل التوزيعي في ἄλλοι ... ἄλλο τι، وتدل صيغة «كان ... يصرخ» على استمرار الصياح الذي تفيده صيغة الماضي الناقص ἔκραζον. وتؤدي الفاء وظيفة الربط السياقي لـ μὲν οὖν بصورة عربية طبيعية.
- source_word: ἐκκλησία
  choice: الجمع
  rationale: تشير الكلمة هنا إلى جمهور مجتمع في سياق مدني مضطرب، لا إلى الكنيسة المسيحية. و«الجمع» لفظ طبيعي يحفظ معنى الاجتماع من غير إيحاء كنسي لازم.
- source_word: συγκεχυμένη
  choice: كان في اضطراب
  rationale: اسم المفعول التام يصف حالة ناتجة من الاختلاط والبلبلة؛ و«في اضطراب» تعبير عربي واضح يلائم مشهد الشغب.
- source_word: οἱ πλείους
  choice: أكثرهم
  rationale: الصيغة مستعملة اسميًا بمعنى غالبية المجتمعين، و«أكثرهم» موجزة وواضحة الإحالة.
- source_word: τίνος ἕνεκα
  choice: لماذا
  rationale: 'تؤدي العبارة الاستفهامية بمعناها الطبيعي: لأي سبب أو غرض.'
- source_word: συνεληλύθεισαν
  choice: اجتمعوا
  rationale: يفيد الفعل اجتماعهم معًا، ويُفهم سبق هذا الاجتماع على حالتهم الراهنة من السياق العربي، من غير حاجة إلى تركيب ثقيل لمحاكاة الماضي الأسبق اليوناني.
theological_decisions:
- issue: دلالة ἐκκλησία في هذا السياق
  choice: الجمع
  alternative: الكنيسة
  rationale: السياق يتحدث عن تجمع مدني مضطرب في أفسس، ولذلك لا تحمل الكلمة هنا دلالتها المسيحية الاصطلاحية.
translation_notes:
  register: صياغة عربية فصحى حديثة واضحة ورصينة، تحافظ على حركة المشهد وصخبه، وتتجنب تحميل ἐκκλησία معنى كنسيًا لا يقتضيه السياق.
