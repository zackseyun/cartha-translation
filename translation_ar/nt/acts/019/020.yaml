  footnotes:
  - marker: a
    text: 'أو: «تنمو باقتدار وتشتدّ». يمكن أن يدل التعبير اليوناني κατὰ κράτος على القوة أو الاقتدار.'
    reason: بديل معجمي يحافظ على إمكان فهم ἴσχυεν بمعنى الاشتداد، وعلى الصياغة الظرفية لعبارة κατὰ κράτος.
lexical_decisions:
- source_word: οὕτως
  choice: وهكذا
  rationale: تفيد النتيجة المترتبة على الأحداث السابقة، وتحافظ على الصلة بالسياق بعبارة عربية طبيعية.
- source_word: κατὰ κράτος
  choice: بقوة
  rationale: تعبير يفيد القوة والاقتدار أو الأثر النافذ، وتؤديه «بقوة» بوضوح من غير تقييده بالفعل الأول وحده بالضرورة.
- source_word: τοῦ κυρίου
  choice: الرب
  rationale: يحافظ على اللقب الوارد في اليونانية من غير أن يضيف اسم يسوع صراحة، مع أن السياق يرجّح أنه المقصود.
- source_word: ὁ λόγος
  choice: كلمة
  rationale: تحافظ «كلمة الرب» على التعبير المتكرر في سفر أعمال الرسل، وهي تشير في السياق إلى الرسالة المعلنة.
- source_word: ηὔξανεν
  choice: كانت تنمو
  rationale: صيغة الماضي المستمر تنقل الجانب الاستمراري للفعل الناقص في اليونانية.
- source_word: ἴσχυεν
  choice: تسود
  rationale: ينقل الفعل معنى القوة النافذة والغلبة في هذا السياق، مع إبقاء تقدّم الكلمة وفاعليتها ظاهرين إلى جانب نموها.
theological_decisions:
- issue: مرجع «الرب» في τοῦ κυρίου
  choice: الإبقاء على «الرب» من غير تحديد إضافي
  alternative: الرب يسوع
  rationale: السياق يرجّح أن المقصود هو الرب يسوع، لكن النص اليوناني يورد اللقب وحده؛ لذلك لا تحسم الترجمة ما لم يصرّح به اللفظ.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم تركيب «كانت... تنمو... وتسود» لإظهار الاستمرار في الفعلين، مع الحفاظ على التوازي بين النمو والغلبة.
