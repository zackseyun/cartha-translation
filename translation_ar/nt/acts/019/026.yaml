review_pass:
  verdict: revise
  source_fidelity: 'المعنى العام منقول بأمانة: الاستشهاد بما يُرى ويُسمع، والامتداد من أفسس إلى معظم ولاية آسيا، والنبرة التحقيرية في «بولس هذا»، وتحويل جمع ذي شأن بسبب قوله عن المصنوعات البشرية. لكن «صرفه» في العربية قد يفهم بمعنى صرفه/أرسله أو منعه، ولا يبين بوضوح التحويل عن عبادة الأصنام الذي يقتضيه السياق والفعل μετέστησεν.'
  naturalness: الأسلوب فصيح واضح في المجمل. إلا أن «أقنع جمهورًا كبيرًا وصرفه» غير سلس دلاليًا؛ فاستبدالها بـ«استمال جمهورًا كبيرًا وحوّله عن عبادة ما تصنعه الأيدي» أوضح وأقرب إلى السياق. كما أن «ما تصنعه الأيدي» تعبير عربي طبيعي يحافظ على عدم تسمية تلك المصنوعات آلهة مسبقًا.
  terminology: «أفسس» و«بولس» و«آلهة» سليمة. وتفيد «ما تصنعه الأيدي» الاصطلاح الجدلي عن الأصنام المصنوعة بشريًا دون إدخال وصف عقائدي زائد. تبقى «آسيا» مع الإيضاح التاريخي في الحاشية مناسبة.
  issues:
  - severity: medium
    issue: «وصرفه» ملتبسة ولا تؤدي بوضوح معنى μετέστησεν في السياق.
    rationale: الفعل اليوناني يعني إحداث انتقال/تحويل عن موقف سابق؛ وفي المقام هو التحول عن عبادة المصنوعات. «صرفه» قد تدل على الإبعاد أو الإرسال ولا تحدد هذا التحول.
  - severity: low
    issue: الحاشية ب تشرح العبارة شرحًا سليمًا، لكن صياغتها الحرفية «التي تصير بواسطة الأيدي» ثقيلة في العربية.
    rationale: يمكن الإبقاء على التنبيه الحرفي مع صياغة أوضح، مثل «ما يُصنع بواسطة الأيدي»، مع بيان أن المراد أصنام من صنع البشر.
  revised_text: وأنتم ترون وتسمعون أن بولس هذا قد استمال جمهورًا كبيرًا وحوّله عن عبادة ما تصنعه الأيدي، لا في أفسس وحدها، بل في آسيا كلها تقريبًا[أ]، قائلًا إن ما تصنعه الأيدي[ب] ليست آلهة.
