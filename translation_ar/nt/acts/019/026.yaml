revisions:
- from: وأنتم ترون وتسمعون أن بولس هذا قد أقنع جمهورًا كبيرًا وصرفه، لا في أفسس وحدها، بل في آسيا كلها تقريبًا[أ]، قائلًا إن المصنوعات بالأيدي[ب] ليست آلهة.
  to: وأنتم ترون وتسمعون أن بولس هذا قد استمال جمهورًا كبيرًا وحوّله عن عبادة ما تصنعه الأيدي، لا في أفسس وحدها، بل في آسيا كلها تقريبًا[أ]، قائلًا إن ما تصنعه الأيدي[ب] ليست آلهة.
  rationale: عُدّلت العبارة التي تنقل πείσας μετέστησεν لتؤدي الاستمالة والتحويل في سياق ترك عبادة الأصنام بوضوح عربي، من دون إضافة حكم لاهوتي يتجاوز النص. وأعيد ذكر «ما تصنعه الأيدي» في موضع المفعول السابق لتكون مرجعية «عن» واضحة، ثم أبقي النفي الختامي مطابقًا لبنية القول اليوناني. الحواشي مربوطة بمواضعها الدلالية وصياغتها منقحة.
