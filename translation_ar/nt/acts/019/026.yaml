source:
  edition: SBLGNT
  text: καὶ θεωρεῖτε καὶ ἀκούετε ὅτι οὐ μόνον Ἐφέσου ἀλλὰ σχεδὸν πάσης τῆς Ἀσίας ὁ Παῦλος οὗτος πείσας μετέστησεν ἱκανὸν ὄχλον, λέγων ὅτι οὐκ εἰσὶν θεοὶ οἱ διὰ χειρῶν γινόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/026.yaml
  text: And you see and hear that not only in Ephesus but in almost all of Asia[a], this Paul has persuaded and turned away a considerable crowd[b], saying that gods made by hands are not gods.
translation:
  language: ar
  text: وأنتم ترون وتسمعون أن بولس هذا قد استمال جمهورًا كبيرًا وحوّله عن عبادة ما تصنعه الأيدي، لا في أفسس وحدها، بل في آسيا كلها تقريبًا[أ]، قائلًا إن ما تصنعه الأيدي[ب] ليست آلهة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: أ
    text: المقصود بـ«آسيا» الولاية الرومانية في غربي آسيا الصغرى، لا قارة آسيا بالمفهوم الحديث.
    reason: cultural_note
  - marker: ب
    text: 'حرفيًا: «التي تصير بواسطة الأيدي»؛ وهو تعبير يشير إلى الأصنام التي تصنعها حرفة البشر.'
    reason: cultural_note
lexical_decisions:
- source_word: θεωρεῖτε καὶ ἀκούετε
  choice: ترون وتسمعون
  rationale: يحافظ على النداء المزدوج إلى ما يدركه السامعون بأنفسهم، بصياغة عربية مباشرة وطبيعية.
- source_word: οὐ μόνον Ἐφέσου ἀλλὰ σχεδὸν πάσης τῆς Ἀσίας
  choice: لا في أفسس وحدها، بل في آسيا كلها تقريبًا
  rationale: ينقل التقابل οὐ μόνον... ἀλλά والمبالغة المقيدة بـσχεδόν، ويفهم المضاف إليه في اليونانية هنا بمعنى مكاني.
- source_word: ὁ Παῦλος οὗτος
  choice: بولس هذا
  rationale: يبقي اسم الإشارة وقوته الازدرائية أو الاتهامية المحتملة في كلام ديمتريوس من غير إضافة وصف غير موجود في النص.
- source_word: πείσας μετέστησεν
  choice: قد أقنع ... وصرفه
  rationale: يمثل الإقناع بوصفه الوسيلة أو الفعل المصاحب، وينقل μετέστησεν بمعنى إحداث تحول عن الموقف السابق من غير إضافة مفعول عقائدي صريح.
- source_word: ἱκανὸν ὄχλον
  choice: جمهورًا كبيرًا
  rationale: ἱκανός هنا يدل على عدد ذي شأن؛ و«جمهور كبير» واضحة وطبيعية في العربية المعاصرة.
- source_word: λέγων ὅτι
  choice: قائلًا إن
  rationale: يحافظ على البنية الحالية التي تقدم مضمون قول بولس.
- source_word: οἱ διὰ χειρῶν γινόμενοι
  choice: المصنوعات بالأيدي
  rationale: يحافظ على صورة الأيدي في التعبير اليوناني، مع صياغة عربية تفيد الأشياء المصنوعة بالحرفة البشرية.
- source_word: οὐκ εἰσὶν θεοὶ
  choice: ليست آلهة
  rationale: ينقل نفي صفة الألوهية عن المصنوعات مباشرة، من غير إضافة «حقيقية» أو توسيع ميتافيزيقي غير مصرح به.
theological_decisions:
- issue: نقل إنكار بولس ألوهية المصنوعات البشرية من غير توسيع الادعاء
  choice: إن المصنوعات بالأيدي ليست آلهة
  alternative: إن الآلهة المصنوعة بالأيدي ليست آلهة
  rationale: الصياغة المختارة تتجنب في العربية وصف المصنوعات مسبقًا بأنها «آلهة»، ثم تنفي عنها الألوهية كما يفعل الخبر اليوناني، وتحافظ على حدة النقد الموجه إلى الأصنام المصنوعة.
translation_notes:
  register: لغة عربية فصحى حديثة واضحة ووقورة. أبقي ترتيب الحجة قريبًا من اليونانية، مع تقديم طبيعي للمكان داخل الجملة، وحوفظ على نبرة ديمتريوس الاتهامية من غير مبالغة تفسيرية.
