  terminology: «يخدمونه» مناسبة لـ διακονούντων ولا تفترض منصبًا كنسيًا. وحُفظ توكيد αὐτός في «هو نفسه». تُستبقى الأسماء بصيغة نقل صوتي عربية مفهومة، مع اعتماد «إراستس» و«آسيا» في الصياغة الحديثة.
