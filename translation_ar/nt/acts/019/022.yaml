base_translation:
  language: en
  yaml_path: translation/nt/acts/019/022.yaml
  text: So after sending into Macedonia two of those who were ministering to him—Timothy and Erastus—he himself stayed for a time in Asia[a].
translation:
  language: ar
  text: وبعد أن أرسل إلى مكدونية اثنين من الذين كانوا يخدمونه، وهما تيموثاوس وإراستس، مكث هو نفسه مدةً في آسيا[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي مقاطعة آسيا الرومانية في غرب آسيا الصغرى، لا قارة آسيا المعروفة اليوم.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποστείλας δὲ
  choice: فأرسل
  rationale: اسم الفاعل الأوريستي يدل على فعل سابق للفعل الرئيس، والفاء تنقل السرد طبيعيًا وتُظهر التعاقب من غير أن تجعل δέ أداة استدراك قوية.
- source_word: εἰς τὴν Μακεδονίαν
  choice: إلى مَكِدُونِيَّة
  rationale: «إلى» هي الصياغة العربية الطبيعية للدلالة على التوجّه نحو إقليم، وتحفظ معنى εἰς المقصود في السياق.
- source_word: δύο τῶν διακονούντων αὐτῷ
  choice: اثنين من الذين كانوا يخدمونه
  rationale: تحفظ العبارة معنى الخدمة الفعلية وبنية التبعيض، من غير افتراض منصب كنسي رسمي أو اختزالها في وصف «مساعدَين».
- source_word: Τιμόθεον καὶ Ἔραστον
  choice: تِيمُوثَاوُس وأَرَاسْتُس
  rationale: نقل صوتي للاسمين بصيغ عربية كتابية واضحة ومتداولة.
- source_word: αὐτὸς
  choice: أما هو نفسه
  rationale: تحفظ التوكيد والمقابلة بين بولس والرجلين اللذين أرسلهما.
- source_word: ἐπέσχεν χρόνον
  choice: مكث مدةً
  rationale: تعبير عربي موجز وطبيعي ينقل معنى البقاء فترة غير محددة.
- source_word: εἰς τὴν Ἀσίαν
  choice: في أَسِيَّا
  rationale: مع فعل المكث تؤدي εἰς معنى مكانيًا فعليًا، لذا تأتي «في» طبيعية ودقيقة؛ ويُشرح المقصود الجغرافي في الحاشية.
