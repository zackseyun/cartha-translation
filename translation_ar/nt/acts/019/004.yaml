base_translation:
  language: en
  yaml_path: translation/nt/acts/019/004.yaml
  text: And Paul said[a], “John baptized with a baptism of repentance, telling the people to believe in the one coming after him—that is, in Jesus.”
translation:
  language: ar
  text: 'فقال بولس: «عمَّد يوحنا بمعمودية التوبة[a]، قائلًا للشعب أن يؤمنوا بالذي يأتي بعده، أي بيسوع».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو بصياغة أكثر حرفية: «عمَّد يوحنا معمودية التوبة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβάπτισεν βάπτισμα μετανοίας
  choice: كان يوحنا يُعمِّد بمعمودية التوبة
  rationale: يحافظ على الاشتقاق المتقارب بين الفعل والاسم، مع استعمال الباء لتكون العبارة عربية طبيعية. وتبيّن الإضافة أن التوبة هي سمة هذه المعمودية ومضمونها، من غير تقرير أثر لاهوتي لا يصرّح به النص.
- source_word: τῷ λαῷ
  choice: للشعب
  rationale: ترجمة جماعية مباشرة لا تخصّص المرجع أكثر مما يتيحه اليوناني؛ ولفظ «الشعب» ملائم للسياق الكتابي وواضح في العربية المعاصرة.
- source_word: λέγων
  choice: قائلًا
  rationale: يحفظ صيغة الحال ومزامنة القول لممارسة يوحنا للمعمودية، ويمهّد طبيعيًا لمضمون قوله.
- source_word: εἰς τὸν ἐρχόμενον μετ’ αὐτὸν
  choice: بالذي يأتي بعده
  rationale: مع فعل الإيمان، تؤدي الباء في العربية معنى توجيه الإيمان إلى شخص. ويحفظ المضارع «يأتي» صورة اسم الفاعل اليوناني، بينما يدل «بعده» هنا على التعاقب.
- source_word: ἵνα πιστεύσωσιν
  choice: أن يؤمنوا
  rationale: بعد فعل القول، تنقل «أن» مضمون الوصية أو الدعوة، من غير حسم ما إذا كانت ἵνα هنا للمضمون أم للغرض.
- source_word: τοῦτ’ ἔστιν
  choice: أي
  rationale: أداة تفسير عربية موجزة وطبيعية تحدد هوية الآتي بعد يوحنا.
- source_word: εἰς τὸν Ἰησοῦν
  choice: بيسوع
  rationale: يتعلّق الجار بالفعل «يؤمنوا» المفهوم من العبارة السابقة. والنص يذكر اسم يسوع وحده، لذلك لا يُضاف إليه لقب.
theological_decisions:
- issue: علاقة معمودية يوحنا بالإيمان بيسوع
  choice: تُوصَف معمودية يوحنا بأنها معمودية التوبة، ويرافقها قوله للشعب أن يؤمنوا بالآتي بعده، الذي يعرّفه النص بأنه يسوع.
  alternative: أن معمودية يوحنا نفسها تُحدث الإيمان المسيحي، أو أن تظل هوية الآتي بعده غير محددة.
  rationale: يميّز التركيب بين تعميد يوحنا وبين الرسالة التي كان يقولها للشعب، ولا ينسب إلى المعمودية أثرًا لم يذكره النص. كما أن العبارة التفسيرية الأخيرة تحدد الآتي صراحة بأنه يسوع.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُعمل «يُعمِّد بمعمودية» للموازنة بين شفافية التركيب اليوناني وسلامة الأسلوب العربي، مع إثبات علامة الحاشية [a] في المتن.
