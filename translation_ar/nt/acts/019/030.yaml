- source_word: δὲ
  choice: ولكن
  rationale: تفيد انتقالًا ذا مسحة استدراكية من فعل الجموع إلى رغبة بولس.
- source_word: βουλομένου
  choice: لما أراد
  rationale: ينقل تركيب المضاف المطلق ودلالة القصد أو الرغبة بصياغة عربية طبيعية.
- source_word: εἰσελθεῖν
  choice: أن يدخل
  rationale: ينقل معنى الدخول المقصود بوضوح وإيجاز.
- source_word: εἰς τὸν δῆμον
  choice: وسط الجمع
  rationale: يحافظ على صورة دخول بولس بين المجتمعين، من غير حسم ما إذا كان δῆμος يعني الهيئة الشعبية المجتمعة رسميًا أو جمهور الناس.
- source_word: οὐκ εἴων
  choice: لم يسمح له
  rationale: ينقل المنع، مع إفادة السياق أنهم حالوا دون تنفيذ قصده؛ والماضي الناقص اليوناني يبرز استمرار الرفض.
- source_word: οἱ μαθηταί
  choice: التلاميذ
  rationale: المقابل المباشر لـ μαθηταί، من غير إضافة ضمير ملكية غير موجود في النص.
