  yaml_path: translation/nt/acts/019/034.yaml
  text: But when they recognized that he was a Jew[a], one voice arose from them all, crying out for about two hours, “Great is Artemis of the Ephesians!”
translation:
  language: ar
  text: 'لكن لما عرفوا أنه يهودي[a]، ارتفع من الجميع صوت واحد، وهم يهتفون نحو ساعتين: «عظيمة هي أرطاميس الأفسسيين!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «من أهل اليهودية». يمكن أن تدل الكلمة اليونانية على يهودي أو على شخص من منطقة اليهودية؛ لكن المعنى القومي الديني الأوسع أرجح هنا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνόντες
  choice: لما عرفوا
  rationale: اسم الفاعل الأوريستي يدل على ظرف سابق للهتاف؛ و«لما عرفوا» تنقل القوة الزمنية بصورة عربية طبيعية.
- source_word: δὲ
  choice: لكنهم
  rationale: تفيد انتقالًا ذا طابع استدراكي بعد محاولة الإسكندر أن يخاطب الجمع.
- source_word: Ἰουδαῖός
  choice: يهودي
  rationale: في سياق أفسس خارج اليهودية، يدل اللفظ على الهوية القومية الدينية على الأرجح، لا على مجرد الانتساب الجغرافي إلى اليهودية.
- source_word: φωνὴ ἐγένετο μία ἐκ πάντων
  choice: انطلق من الجميع صوت واحد
  rationale: يحافظ على صورة النص اليوناني وعلى التشديد على وحدة هتاف الجمع، مع صياغة عربية مفهومة.
- source_word: ὡς ἐπὶ ὥρας δύο
  choice: نحو ساعتين
  rationale: تنقل ὡς معنى التقريب في عبارة قياس المدة.
- source_word: κραζόντων
  choice: وهم يهتفون
  rationale: اسم الفاعل المضارع يصور فعلًا مستمرًا؛ و«يهتفون» يلائم ترديد الجمع لعبارة واحدة مدة طويلة.
- source_word: Μεγάλη ἡ Ἄρτεμις Ἐφεσίων
  choice: عظيمة هي أرطاميس التي لأهل أفسس!
  rationale: يحافظ على تقديم «عظيمة» في صيغة الهتاف، ويجعل علاقة الإضافة في Ἐφεσίων واضحة من غير اختزالها إلى وصف جغرافي محض.
theological_decisions:
- issue: دلالة Ἰουδαῖος
  choice: يهودي
  alternative: يهوديّ من أهل اليهودية
  rationale: رد فعل الجمع متعلق على الأرجح بهوية الإسكندر القومية الدينية في الشتات. وتذكر الحاشية الإمكان الجغرافي الحقيقي من غير أن تفرضه على المتن.
- issue: علاقة أرطاميس بأهل أفسس
  choice: أرطاميس التي لأهل أفسس
  alternative: أرطاميس الأفسسيين
  rationale: الصياغة المختارة تحافظ على سعة دلالة المضاف إليه، الذي قد يفيد الارتباط أو الاختصاص، من غير تقرير تصور لاهوتي إضافي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «أرطاميس» نقلًا للاسم اليوناني Ἄρτεμις، وحُفظت صيغة الهتاف وتكراره الضمني، مع تجنب ألفاظ عامية مثل «يصرخون» حين يكون «يهتفون» أدق في هذا المشهد الجماعي.
