    text: أو «بلغات». يمكن أن تعني الكلمة اليونانية «ألسنة» أو «لغات»، وقد أبقى المتن هذا الاحتمال مفتوحًا.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιθέντος αὐτοῖς τοῦ Παύλου χεῖρας
  choice: ولمّا وضع بولس يديه عليهم
  rationale: صيغ التركيب اليوناني، وهو مضاف مطلق يتضمن اسم فاعل ماضيًا، في جملة زمنية عربية طبيعية، مع إبقاء صورة وضع اليدين.
- source_word: ἦλθε τὸ πνεῦμα τὸ ἅγιον ἐπ’ αὐτούς
  choice: حلَّ الروح القدس عليهم
  rationale: «حلَّ ... عليهم» تعبير عربي فصيح وطبيعي ينقل مجيء الروح باتجاههم من غير إضافة تفسير عقائدي لآلية الحدث.
- source_word: ἐλάλουν
  choice: فأخذوا يتكلمون
  rationale: ينقل الفعل الناقص اليوناني بوصفه بداية فعل مستمر في هذا السياق السردي، مع تجنب صيغة ماضية منجزة قد تحجب جانبه الاستمراري.
- source_word: γλώσσαις
  choice: بألسنة
  rationale: يحافظ على الدلالة المعجمية المجازية وعلى الإبهام الحقيقي بين الألسنة واللغات، من غير حسم طبيعة الكلام.
- source_word: ἐπροφήτευον
  choice: ويتنبّأون
  rationale: ينقل الفعل الدال مباشرة على ممارسة النبوة، ويحافظ بصيغة المضارع بعد «أخذوا» على الفعل الجاري الموازي للكلام بألسنة.
- source_word: τε ... καί
  choice: '... و...'
  rationale: الربط بالعطف العربي البسيط يعبّر طبيعيًا عن اقتران المظهرين المذكورين في اليونانية.
theological_decisions:
- issue: طبيعة γλώσσαις في أعمال الرسل 19:6
  choice: بألسنة
  alternative: بلغات
  rationale: يمكن أن تدل الكلمة اليونانية على الألسنة أو اللغات، ولا تحسم الآية وحدها طبيعة هذا الكلام؛ لذلك يحافظ النص على التوتر التفسيري ولا يتبنى موقفًا طائفيًا.
- issue: مجيء الروح القدس عليهم
  choice: حلَّ الروح القدس عليهم
  alternative: أتى الروح القدس عليهم
  rationale: يصف هذا التعبير وقوع الحدث كما يورده السرد، من غير أن يستنتج ترتيبًا عقائديًا عامًا أو علاقة سببية أسرارية لا تصرّح بها الآية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «ولمّا» للربط الزمني السردي، و«حلَّ ... عليهم» لصياغة عربية مألوفة، مع إبقاء غموض «ألسنة» المقصود في الأصل.
