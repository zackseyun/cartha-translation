  text: And when Paul laid his hands on them[a], the Holy Spirit came upon them, and they began speaking in tongues and prophesying.
translation:
  language: ar
  text: ولمّا وضع بولس يديه عليهم، حلَّ الروح القدس عليهم، فأخذوا يتكلمون بألسنة[a] ويتنبّأون.
  philosophy: optimal-equivalence
  footnotes:
