  register: عربية فصحى حديثة واضحة ووقورة. اختيرت صياغة ذات نبرة مدنية وقانونية تناسب خطاب كاتب المدينة، مع تجنب المعنى الكنسي لكلمة ἐκκλησία في هذا الموضع والحفاظ على التمييز بينها وبين συστροφή.
