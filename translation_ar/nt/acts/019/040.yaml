  text: καὶ γὰρ κινδυνεύομεν ἐγκαλεῖσθαι στάσεως περὶ τῆς σήμερον μηδενὸς αἰτίου ὑπάρχοντος περὶ οὗ οὐ δυνησόμεθα ⸀ἀποδοῦναι λόγον ⸀περὶ τῆς συστροφῆς ταύτης. καὶ ταῦτα εἰπὼν ἀπέλυσεν τὴν ἐκκλησίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/040.yaml
  text: For indeed we are in danger of being charged with rioting over what happened today[a], since there is no cause for it, and we will not be able to give an account for this commotion. And after saying these things[c][b], he dismissed the assembly.
translation:
  language: ar
  text: فإننا معرَّضون لأن نُتَّهم بالشغب بسبب ما حدث اليوم[a]، إذ لا يوجد سبب يبرر ذلك، ولن نستطيع أن نقدّم تفسيرًا عن هذا التجمّع المضطرب[b]. وبعد أن قال هذه الأمور، صرف الجمع[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «بالفتنة» أو «بالتمرّد». قد تدل الكلمة اليونانية على انتفاضة مدنية خطيرة، لكن «الشغب» أنسب بسياق الاضطراب العام هنا.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا: «هذا الاضطراب» أو «هذا الحشد». تشير الكلمة اليونانية إلى تجمّع مضطرب، وهي غير الكلمة التي تُرجمت «الجمع» في آخر الآية.'
    reason: lexical_alternative
  - marker: c
    text: الكلمة اليونانية المترجمة هنا «الجمع» هي نفسها التي تُترجم كثيرًا في مواضع أخرى «الكنيسة»، لكنها تشير هنا إلى الاجتماع المدني في أفسس.
    reason: cross_reference
lexical_decisions:
- source_word: κινδυνεύομεν
  choice: نحن معرَّضون
  rationale: ينقل حالة الخطر القائمة في المضارع بصياغة عربية طبيعية.
- source_word: ἐγκαλεῖσθαι
  choice: لأن نُتَّهم
  rationale: يحفظ الدلالة القانونية للفعل في سياق احتمال المساءلة أمام السلطات.
- source_word: στάσεως
  choice: بإثارة الشغب
  rationale: يلائم الاضطراب المدني العلني في السياق من غير المبالغة بجعله تمردًا مسلحًا.
- source_word: περὶ τῆς σήμερον
  choice: بسبب ما حدث اليوم
  rationale: تعبير عربي واضح يؤدي المعنى الاصطلاحي للتركيب اليوناني الموجز.
- source_word: μηδενὸς αἰτίου ὑπάρχοντος
  choice: إذ لا يوجد ما يبرر ذلك
  rationale: ينقل غياب السبب المشروع مع الحفاظ على النبرة القانونية.
- source_word: ἀποδοῦναι λόγον
  choice: أن نقدّم تفسيرًا
  rationale: يؤدي معنى تقديم جواب أو تعليل رسمي في هذا السياق.
- source_word: συστροφῆς
  choice: التجمهر الصاخب
  rationale: يدل على تجمع مضطرب ويُبقيه متميزًا عن ἐκκλησία اللاحقة، من دون تحميله معنى «الغوغاء» حتمًا.
- source_word: ἐκκλησίαν
  choice: الجمع
  rationale: يشير هنا إلى الاجتماع المدني في أفسس لا إلى الكنيسة؛ و«الجمع» واضح وغير كنسي اصطلاحيًا.
- source_word: ἀπέλυσεν
  choice: صرف
  rationale: صياغة عربية موجزة وطبيعية لإنهاء الاجتماع وإرسال الحاضرين.
- source_word: καὶ γὰρ
  choice: فنحن ... بالفعل
  rationale: الفاء تحفظ الصلة التعليلية، و«بالفعل» تنقل قوة التأكيد.
