  text: πολλοί τε τῶν πεπιστευκότων ἤρχοντο ἐξομολογούμενοι καὶ ἀναγγέλλοντες τὰς πράξεις αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/018.yaml
  text: And many of those who had believed were coming[a], confessing and disclosing their practices.
translation:
  language: ar
  text: وكان كثيرون من الذين آمنوا يأتون، معترفين ومفصحين عن ممارساتهم[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أعمالهم»، أو: «ما فعلوه».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοί τε
  choice: وكان كثيرون
  rationale: تنقل «كثيرون» الدلالة الكمية، وتصل الواو الجملة بسياق السرد السابق، بينما تساعد «كان» على إبراز استمرار الفعل الماضي الآتي.
- source_word: τῶν πεπιστευκότων
  choice: من الذين آمنوا
  rationale: يحافظ هذا التعبير على وصف أشخاص سبق أن آمنوا وما زال إيمانهم ذا صلة بالمشهد، من غير تحويل العبارة بالضرورة إلى لقب اصطلاحي جامد.
- source_word: ἤρχοντο
  choice: كانوا يأتون
  rationale: تركيب «كانوا يأتون» ينقل الجانب الاستمراري أو المتكرر للفعل الناقص اليوناني من غير الجزم بدرجة التكرار.
- source_word: ἐξομολογούμενοι
  choice: معترفين
  rationale: «معترفين» ترجمة طبيعية للإقرار أو الاعتراف، وتترك مضمون الاعتراف مفتوحًا كما يفعل النص إلى أن توضحه العبارة التالية.
- source_word: ἀναγγέλλοντες
  choice: مفصحين عن
  rationale: يفيد الفعل الإخبار والإظهار؛ و«مفصحين عن» يلائم إخراج أمور كانت خفية إلى العلن، مع تجنب تكرار معنى «معترفين» حرفيًا.
- source_word: τὰς πράξεις αὐτῶν
  choice: ممارساتهم
  rationale: يمكن أن تدل πρᾶξις على الأفعال أو الأعمال أو الممارسات. و«ممارساتهم» تلائم سياق الأعمال السحرية في المقطع من غير أن تحصر اللفظ صراحة في «الخطايا».
theological_decisions:
- issue: هل تُترجم πεπιστευκότων بلقب ثابت مثل «المؤمنين» أم بوصف فعل إيمان سابق؟
  choice: الذين آمنوا
  alternative: المؤمنين
  rationale: اسم الفاعل التام يشير طبيعيًا إلى إيمان سبق وله أثر مستمر؛ وتحفظ «الذين آمنوا» هذه الصيغة الوصفية من غير استيراد لقب كنسي اصطلاحي.
- issue: هل تشير τὰς πράξεις αὐτῶν تحديدًا إلى الخطايا أو إلى الممارسات السحرية أو إلى الأفعال عمومًا؟
  choice: ممارساتهم
  alternative: أعمالهم / ما فعلوه / خطاياهم
  rationale: السياق القريب يتعلق بالسحر، لكن الاسم اليوناني أوسع من «الخطايا». لذلك تنقل «ممارساتهم» المعنى السياقي مع إبقاء المجال الدلالي ظاهرًا في الحاشية.
translation_notes:
  register: الصياغة عربية فصحى معاصرة واضحة ووقورة. استُخدم «كانوا يأتون» لإظهار الاستمرار في الماضي، وجاء الحالان «معترفين ومفصحين» متوازيين بما يحفظ بنية الأصل من غير تكلف.
