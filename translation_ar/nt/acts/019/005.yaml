  text: And when they heard this[a], they were baptized in the name of the Lord Jesus.
translation:
  language: ar
  text: فلما سمعوا ذلك، اعتمدوا باسم الرب يسوع.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «إلى اسم الرب يسوع».'
    reason: توضّح أن اليونانية تستعمل εἰς («إلى») مع «الاسم»، مع إبقاء الصياغة العربية الاصطلاحية والطبيعية في المتن.
lexical_decisions:
- source_word: ἀκούσαντες
  choice: فلما سمعوا ذلك
  rationale: اسم الفاعل الأوْرِسطي يؤدي وظيفة زمنية؛ وصيغة «فلما سمعوا» طبيعية في العربية. أُضيف اسم الإشارة «ذلك» بوصفه مفعولًا مفهومًا من الكلام السابق، من غير تعيين مضمون جديد.
- source_word: δὲ
  choice: الفاء في «فلما»
  rationale: δέ أداة ربط خفيفة تتابع السرد، وتؤدي الفاء العربية هذا الانتقال طبيعيًا من غير إحداث مقابلة قوية.
- source_word: ἐβαπτίσθησαν
  choice: اعتمدوا
  rationale: الفعل اليوناني مبني للمجهول، لكن «اعتمدوا» هو التعبير العربي الجاري عن تلقي المعمودية، ولا يعني هنا أنهم عمّدوا أنفسهم.
- source_word: εἰς τὸ ὄνομα
  choice: لاسم
  rationale: تحافظ اللام على اتجاه الفعل نحو اسم الرب وعلى معنى الانتساب أو التكريس، وتتجنب حصر العبارة في معنى القيام بالفعل بسلطان الاسم وحده. وتُذكر الصياغة العربية التقليدية «باسم» في الحاشية.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: الرب يسوع
  rationale: «الرب» هو اللقب المناسب لـκύριος في هذا السياق المتعلق بيسوع، و«يسوع» الصيغة العربية المعيارية للاسم.
theological_decisions:
- issue: دلالة عبارة المعمودية εἰς τὸ ὄνομα
  choice: لاسم الرب يسوع
  alternative: باسم الرب يسوع
  rationale: الترجمة المختارة تُبقي القوة الاتجاهية والانتسابية لحرف εἰς من غير فرض تفسير عقائدي تفصيلي، بينما تُحفظ الصياغة التقليدية المألوفة في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة، بنبرة كتابية وقورة. استُعمل «فلما» لتدفق السرد، و«اعتمدوا» للمصطلح المسيحي المعروف، مع تجنب إضافة تفسير مذهبي إلى العبارة.
