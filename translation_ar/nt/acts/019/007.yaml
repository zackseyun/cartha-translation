  rationale: صيغة عربية طبيعية تنقل فعل الكينونة اليوناني وتعود على أفراد المجموعة المذكورة في السياق.
- source_word: δὲ
  choice: —
  rationale: أداة ربط خفيفة لا تفيد هنا تعارضًا قويًا، وحذف مقابل مستقل لها يجعل العربية أكثر سلاسة من غير فقد للمعنى.
- source_word: οἱ πάντες
  choice: جميعًا
  rationale: تنقل شمول أفراد المجموعة، وتؤدي مع العدد معنى إجمالي عددهم.
- source_word: ἄνδρες
  choice: رجلًا
  rationale: الاسم اليوناني يدل تحديدًا على الرجال، لا على الناس بوجه عام؛ وجاء المفرد تمييزًا للعدد المركب في العربية.
- source_word: ὡσεὶ
  choice: نحو
  rationale: تفيد التقريب العددي بعبارة عربية فصيحة واضحة.
- source_word: δώδεκα
  choice: اثني عشر
  rationale: المقابل العددي المباشر، منصوب بحسب موقعه بعد كان.
