  yaml_path: translation/nt/acts/019/038.yaml
  text: If[a], then, Demetrius and the craftsmen with him have a complaint against anyone, court sessions are being held and there are proconsuls[b]; let them bring charges against one another.
translation:
  language: ar
  text: فإن كان لدى ديمتريوس والحرفيين الذين معه دعوى على أحد، فجلسات المحاكم منعقدة[a]، وهناك ولاة قنصليون[b]؛ فليُقِم بعضهم دعوى على بعض.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فالمحاكم في حالة انعقاد». يشير التعبير اليوناني إلى جلسات أو إجراءات قضائية منعقدة رسميًّا.'
    reason: lexical_alternative
  - marker: b
    text: أي ولاة رومانيون يحملون لقب «والٍ قنصلي» (بروقنصل). وقد يُستعمل الجمع للإشارة إلى المنصب الإقليمي أو إلى توافر من يشغله للنظر في القضايا.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ μὲν οὖν
  choice: فإذا كان
  rationale: تنقل الانتقال الاستنتاجي والشرط بصورة عربية طبيعية، من غير إثقال العبارة بمحاولة مقابلة كل أداة يونانية على حدة.
- source_word: Δημήτριος
  choice: ديمتريوس
  rationale: نقل صوتي للاسم اليوناني بصيغة عربية واضحة وشائعة.
- source_word: οἱ σὺν αὐτῷ τεχνῖται
  choice: الحرفيين الذين معه
  rationale: «الحرفيون» تدل على أصحاب الصنائع الماهرة، و«الذين معه» تحافظ على عموم العلاقة في النص من غير جعلها أخص مما تحتمل.
- source_word: ἔχουσιν πρός τινα λόγον
  choice: لهم دعوى على أحد
  rationale: التركيب ذو دلالة قضائية هنا؛ و«دعوى» تعبّر بوضوح عن الخصومة أو القضية القانونية.
- source_word: τινα
  choice: أحد
  rationale: تحافظ على التنكير والعموم المناسبين لبيان إجراء قانوني عام.
- source_word: ἀγοραῖοι ἄγονται
  choice: جلسات المحاكم منعقدة
  rationale: تؤدي معنى انعقاد الإجراءات القضائية الرسمية، مع الحفاظ قدر الإمكان على صيغة الحالة القائمة في الأصل.
- source_word: ἀνθύπατοί εἰσιν
  choice: هناك ولاة رومانيون
  rationale: تحافظ على صيغة الجمع وعلى دلالة المنصب الإداري الروماني، بعبارة مفهومة للقارئ العربي.
- source_word: ἐγκαλείτωσαν
  choice: فليقدِّم ... شكاوى
  rationale: صياغة قضائية واضحة تنقل معنى توجيه الاتهام أو رفع الشكوى عبر القنوات القانونية.
- source_word: ἀλλήλοις
  choice: بعضهم ... على بعض
  rationale: تحافظ على ضمير التبادل وعلى القوة الخصومية التي يكتسبها في السياق القضائي.
