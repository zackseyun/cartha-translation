base_translation:
  language: en
  yaml_path: translation/nt/acts/019/003.yaml
  text: And he said[a], “Into what then were you baptized?” And they said, “Into John's baptism.”
translation:
  language: ar
  text: 'فقال: «فبماذا اعتمدتم إذن؟» فقالوا: «بمعمودية يوحنا[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «إلى معمودية يوحنا».'
    reason: يبين تكرار حرف الجر εἰς في الجواب اليوناني مع إبقاء المتن العربي طبيعيًا.
lexical_decisions:
- source_word: εἶπέν τε
  choice: فقال
  rationale: ينقل فعل القول مع صلة سردية خفيفة بالسياق السابق؛ والفاء طبيعية في السرد العربي ولا تُثقِل معنى τε.
- source_word: Εἰς τί
  choice: إلى أيِّ شيءٍ
  rationale: يحافظ على دلالة εἰς وعلى التوازي اللفظي مع الجواب، بدل اختزال السؤال إلى «أيَّ معمودية».
- source_word: οὖν
  choice: إذًا
  rationale: تؤدي معنى الاستنتاج أو النتيجة في سياق الحوار بصورة عربية طبيعية.
- source_word: ἐβαπτίσθητε
  choice: اعتمدتم
  rationale: الصيغة العربية المبنية للمعلوم تؤدي اصطلاحيًا معنى المبني للمجهول اليوناني في فعل قبول المعمودية، من غير حاجة إلى تركيب ثقيل مثل «جرت معموديتكم».
- source_word: Εἰς τὸ Ἰωάννου βάπτισμα
  choice: إلى معمودية يوحنا
  rationale: يحفظ تكرار حرف الجر εἰς والتوازي بين السؤال والجواب، ويجعل إضافة المعمودية إلى يوحنا واضحة.
- source_word: βάπτισμα
  choice: معمودية
  rationale: هو المقابل العربي الراسخ والدقيق لاسم الطقس هنا، ولا يستبدله بشرح تفسيري.
theological_decisions:
- issue: هل يُحفظ تكرار εἰς في السؤال والجواب؟
  choice: «إلى» في الموضعين
  alternative: «بأي معمودية اعتمدتم؟» / «بمعمودية يوحنا»
  rationale: يحافظ هذا على الصياغة اليونانية والتوازي البلاغي، وعلى فكرة الجهة أو الارتباط التي قد تحملها العبارة، من غير حسم لاهوتي زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدمت «اعتمدتم» بوصفها الصيغة العربية المألوفة، مع إبقاء «إلى أي شيء» رغم غرابتها النسبية حفاظًا على بنية الأصل والتوتر الدلالي فيه.
