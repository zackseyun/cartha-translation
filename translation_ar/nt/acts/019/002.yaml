base_translation:
  language: en
  yaml_path: translation/nt/acts/019/002.yaml
  text: And he said to them[a], “Did you receive the Holy Spirit when you believed?” And they said to him, “No[b], we have not even heard that there is a Holy Spirit.”
translation:
  language: ar
  text: 'وقال لهم[a]: «هل نلتم الروح القدس حين آمنتم؟» فقالوا له: «كلا، لم نسمع حتى بوجود الروح القدس[b].»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «هل نلتم الروح القدس بعدما آمنتم؟»؛ يمكن فهم اسم الفاعل اليوناني الماضي بفارق طفيف في الدلالة الزمنية.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «لم نسمع حتى عمّا إذا كان الروح القدس موجودًا»؛ وبصياغة تفسيرية أوسع: «لم نسمع حتى أن الروح القدس قد أُعطي».'
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπέν τε πρὸς αὐτούς
  choice: وقال لهم
  rationale: تفيد τε ربطًا خفيفًا بالسياق السابق، وتنقله الواو طبيعيًا من غير مبالغة في تحديد معنى زمني أو إضافي.
- source_word: Εἰ πνεῦμα ἅγιον ἐλάβετε πιστεύσαντες
  choice: هل نلتم الروح القدس حين آمنتم؟
  rationale: تنقل «حين آمنتم» العلاقة الزمنية التي يفيدها اسم الفاعل الماضي πιστεύσαντες من غير أن تحسم هل كان نوال الروح متزامنًا تمامًا مع الإيمان أم لاحقًا له.
- source_word: πνεῦμα ἅγιον
  choice: الروح القدس
  rationale: يشير التعبير في السياق إلى روح الله القدوس؛ وصيغة التعريف هي التعبير العربي الطبيعي المألوف عند الإشارة إليه.
- source_word: οἱ δὲ πρὸς αὐτόν
  choice: فقالوا له
  rationale: تنقل الفاء استمرار الحوار واستجابة المخاطَبين، والفعل «قالوا» مفهوم من السياق اليوناني المحذوف فيه الفعل.
- source_word: Ἀλλ’ οὐδ’
  choice: لا، بل لم... حتى
  rationale: يحمل «لا» جواب النفي، وتعبّر «بل... حتى» عن النفي المشدّد في ἀλλ’ οὐδ’ بصياغة عربية طبيعية.
- source_word: οὐδ’ εἰ πνεῦμα ἅγιον ἔστιν ἠκούσαμεν
  choice: لم نسمع حتى إن كان هناك روح قدس
  rationale: يحافظ هذا على صيغة εἰ وعلى غرابة الجواب واحتماله الدلالي، بدل تحويله في المتن إلى تقرير قاطع بأنهم لم يسمعوا بوجود الروح القدس أو إضافة أنه قد أُعطي.
theological_decisions:
- issue: العلاقة الزمنية بين الإيمان ونوال الروح القدس
  choice: حين آمنتم
  alternative: بعدما آمنتم؛ عند إيمانكم
  rationale: لا يحسم اسم الفاعل الماضي اليوناني وحده ترتيبًا عقائديًا دقيقًا بين الإيمان ونوال الروح، ولذلك تحفظ الصياغة مرونته الزمنية.
- issue: مقصود عدم سماع التلاميذ بالروح القدس
  choice: لم نسمع حتى إن كان هناك روح قدس
  alternative: لم نسمع حتى أن هناك روحًا قدسًا؛ لم نسمع حتى أن الروح القدس قد أُعطي
  rationale: تُبقي الصياغة معنى εἰ محتملًا بين «إن كان/هل» و«أن»، ولا تُدخل التفسير القائل إن المقصود هو عدم سماعهم بإعطاء الروح، إذ ليس فعل «أُعطي» واردًا في النص.
- issue: التنكير في جواب التلاميذ
  choice: روح قدس
  alternative: الروح القدس
  rationale: حُفظ غياب أداة التعريف في اليونانية داخل جوابهم، وهو ملائم أيضًا لسياق قولهم إنهم لم يسمعوا حتى إن كان هناك روح قدس، من غير إنكار للمرجع الشخصي الواضح في السؤال.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «نلتم» لأنه طبيعي في سياق تلقّي عطية إلهية، مع إبقاء السؤال والجواب موجزين. وُضعت جميع علامات الحواشي في المتن.
