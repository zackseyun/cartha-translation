- from: لكن حين أخذ بعضهم يقسون ولا يطيعون[a]، ويتكلمون بالسوء عن «الطريق»[b] أمام الجمع، اعتزلهم وفصل التلاميذ عنهم، وصار يحاور كل يوم في قاعة محاضرات تيرانوس[c].
  to: لكن إذ كان بعضهم يتصلبون ولا يذعنون[a]، ويتكلمون بالسوء عن «الطريق»[b] أمام الجمع، اعتزلهم وفصل التلاميذ عنهم، وكان يناقش كل يوم في قاعة محاضرات تيرانوس[c].
  rationale: 'تقتصر المراجعة على تحسين الدقة الأسلوبية والدلالية: استُبدل التعبير الذي قد يفيد الشروع («صار») بتعبير استمراري، واستُعمل «يناقش» لنقل الخطاب الاستدلالي لـδιαλέγομαι دون افتراض تبادل حواري محدد. كما صيغت مقاومة بعض السامعين بعبارة عربية أوضح تحافظ على مرونة ἀπειθέω، مع بقاء البدائل الدلالية في الحاشية.'
