  source_fidelity: 'المعنى العام مطابق لليونانية: التصلب ورفض الانقياد، الإساءة العلنية إلى «الطريق»، انفصال بولس وتمييزه التلاميذ، ثم نشاطه اليومي في مدرسة/قاعة تيرانوس. لكن «صار يحاور» يُدخل معنى البدء غير الصريح في صيغة اسم الفاعل اليونانية، و«يحاور» أضيق قليلًا من διαλεγόμενος التي تفيد المناقشة والاستدلال.'
