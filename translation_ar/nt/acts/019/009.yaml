source:
  edition: SBLGNT
  text: ὡς δέ τινες ἐσκληρύνοντο καὶ ἠπείθουν κακολογοῦντες τὴν ὁδὸν ἐνώπιον τοῦ πλήθους, ἀποστὰς ἀπ’ αὐτῶν ἀφώρισεν τοὺς μαθητάς, καθ’ ἡμέραν διαλεγόμενος ἐν τῇ σχολῇ ⸀Τυράννου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/009.yaml
  text: But when some became hardened and disobedient[a], speaking evil of the Way before the crowd, he withdrew from them and set apart the disciples[c][b], reasoning daily in the lecture hall of Tyrannus.
translation:
  language: ar
  text: لكن إذ كان بعضهم يتصلبون ولا يذعنون[a]، ويتكلمون بالسوء عن «الطريق»[b] أمام الجمع، اعتزلهم وفصل التلاميذ عنهم، وكان يناقش كل يوم في قاعة محاضرات تيرانوس[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لا يؤمنون»، أو: «يرفضون الاقتناع».'
    reason: lexical_alternative
  - marker: b
    text: كانت «الطريق» تسمية مبكرة للحركة المسيحية في سفر الأعمال.
    reason: cultural_note
  - marker: c
    text: 'أو: «مدرسة تيرانوس».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσκληρύνοντο
  choice: أخذ بعضهم يقسون
  rationale: ينقل صيغة الماضي الناقص بوصفها مسارًا متواصلًا من التصلب، من غير إضافة القلب أو تعيين سبب القساوة صراحةً.
- source_word: ἠπείθουν
  choice: لا يطيعون
  rationale: يحفظ البعد الإرادي والأخلاقي للفعل، مع إثبات احتمالي عدم الإيمان ورفض الاقتناع في الحاشية.
- source_word: κακολογοῦντες
  choice: يتكلمون بالسوء عن
  rationale: تعبير عربي واضح وواسع الدلالة ينقل الكلام العدائي العلني من غير تضييقه إلى معنى قانوني كالقذف.
- source_word: τὴν ὁδὸν
  choice: «الطريق»
  rationale: يحافظ على التسمية التاريخية التي يستعملها سفر الأعمال للحركة المسيحية، وتُظهر علامتا التنصيص أنها لقب لا مجرد طريق عام.
- source_word: ἐνώπιον τοῦ πλήθους
  choice: أمام الجمع
  rationale: صياغة موجزة وطبيعية تدل على أن الإساءة وقعت علنًا بحضور الناس.
- source_word: ἀποστὰς ἀπ’ αὐτῶν
  choice: اعتزلهم
  rationale: ينقل الانفصال الحاسم عن الجماعة المقاومة في تعبير عربي فصيح ومباشر.
- source_word: ἀφώρισεν τοὺς μαθητάς
  choice: فصل التلاميذ عنهم
  rationale: يبين أن بولس ميّز التلاميذ عن المعارضين وأبعدهم عنهم، من غير الإيحاء بأن الأمر مجرد انتقال مكاني عابر.
- source_word: καθ’ ἡμέραν
  choice: كل يوم
  rationale: تعبير عربي شائع وواضح عن النشاط اليومي المنتظم.
- source_word: διαλεγόμενος
  choice: يحاور
  rationale: يعكس خطابًا قائمًا على النقاش والاستدلال، ويحافظ على عنصر التبادل الذي قد يحمله الفعل، من غير جعله خصومة جدلية بالضرورة.
- source_word: σχολῇ
  choice: قاعة محاضرات
  rationale: يوضح للقارئ الحديث أن الموضع كان مكانًا للتعليم والخطاب، ويتجنب الإيحاء الحصري بمؤسسة مدرسية حديثة.
- source_word: Τυράννου
  choice: تيرانوس
  rationale: نقل صوتي للاسم اليوناني Τύραννος بصيغة عربية واضحة.
theological_decisions:
- issue: دلالة «الطريق»
  choice: اعتبار «الطريق» تسمية معروفة للحركة المسيحية في سفر الأعمال
  alternative: فهم «الطريق» على أنه مسلك أو تعليم بالمعنى العام
  rationale: يعمل التعبير في سياق سفر الأعمال كتسمية مميزة لأتباع يسوع وحركتهم؛ والتنصيص يبرز هذه الوظيفة من غير إدخال تسمية مذهبية لاحقة.
- issue: دلالة ἠπείθουν
  choice: لا يطيعون
  alternative: لا يؤمنون أو يرفضون الاقتناع
  rationale: للفعل مجال دلالي يجمع عدم الطاعة وعدم التصديق ورفض الاقتناع؛ اختيرت دلالة الطاعة في المتن مع إبقاء البدائل في الحاشية حفاظًا على التوتر الدلالي.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كريمة. استُعمل «اعتزلهم» للإيجاز، و«قاعة محاضرات» لتوضيح طبيعة المكان للقارئ المعاصر، مع وضع البديل الحرفي الأقرب في الحاشية. جميع علامات الحواشي مثبتة في مواضعها من المتن.
