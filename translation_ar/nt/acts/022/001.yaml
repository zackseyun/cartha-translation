  yaml_path: translation/nt/acts/022/001.yaml
  text: Men[a], brothers and fathers, hear now my defense to you.
translation:
  language: ar
  text: «أيها الرجال، أيها الإخوة والآباء، اسمعوا دفاعي الموجَّه إليكم الآن.»
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄνδρες
  choice: أيها الرجال
  rationale: نداء صريح لجمع من الذكور، ويحافظ على دلالة اللفظ اليوناني وعلى نبرة الخطاب العلني.
- source_word: ἀδελφοὶ
  choice: الإخوة
  rationale: يحافظ على صيغة النداء الأخوي في اليونانية، وهي هنا جزء من خطاب موجَّه إلى رجال.
- source_word: πατέρες
  choice: الآباء
  rationale: ترجمة مباشرة تحفظ دلالة التوقير لكبار السن أو ذوي المكانة من غير تحويلها إلى لقب رسمي مثل «الشيوخ».
- source_word: ἀκούσατέ
  choice: اسمعوا
  rationale: فعل أمر للجمع، وهو فصيح وطبيعي في افتتاح خطاب دفاعي رسمي.
- source_word: μου ... ἀπολογίας
  choice: دفاعي
  rationale: تؤدي الإضافة اليونانية بمعنى الملكية، و«الدفاع» هنا مرافعة أو جواب دفاعي لا اعتذار عن خطأ.
- source_word: πρὸς ὑμᾶς
  choice: أمامكم
  rationale: تعبير عربي طبيعي لخطاب دفاعي موجَّه إلى الحاضرين، مع بقاء احتمال الترجمة الحرفية «إليكم» مذكورًا في الحاشية.
- source_word: νυνὶ
  choice: الآن
  rationale: يحفظ معنى الآنية والتوكيد في الطلب.
