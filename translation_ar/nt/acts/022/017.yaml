  text: Ἐγένετο δέ μοι ὑποστρέψαντι εἰς Ἰερουσαλὴμ καὶ προσευχομένου μου ἐν τῷ ἱερῷ γενέσθαι με ἐν ἐκστάσει
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/017.yaml
  text: And it happened to me that[a], after I had returned to Jerusalem and while I was praying in the temple, I fell into a trance[b],
translation:
  language: ar
  text: وحدث لي، بعد أن رجعت إلى أورشليم وبينما كنت أصلّي في الهيكل[a]، أنني دخلت في غيبة[b]،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يشير اللفظ اليوناني إلى مجمّع الهيكل أو ساحاته، لا إلى المقدس الداخلي تحديدًا.
    reason: cultural_note
  - marker: b
    text: 'أو: «صرت في غيبة». يقول التعبير اليوناني حرفيًا: «أن أصير في غيبة»، وهو تعبير عن الدخول في حالة رؤيوية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δέ μοι
  choice: وحدث لي
  rationale: يحافظ على صيغة الانتقال السردي وعلى دلالة ضمير المتكلم بوصفه صاحب الاختبار، بصياغة عربية طبيعية.
- source_word: ὑποστρέψαντι εἰς Ἰερουσαλὴμ
  choice: بعد أن رجعت إلى أورشليم
  rationale: يفيد اسم الفاعل الماضي أن الرجوع سبق الحدث الرئيس.
- source_word: καὶ προσευχομένου μου
  choice: وبينما كنت أصلّي
  rationale: ينقل الفعل المتزامن المستمر وقت وقوع الحدث الرئيس.
- source_word: ἐν τῷ ἱερῷ
  choice: في الهيكل
  rationale: «الهيكل» هو المقابل العربي المألوف، مع توضيح أن اللفظ اليوناني يدل على مجمّع الهيكل في الحاشية.
- source_word: γενέσθαι με ἐν ἐκστάσει
  choice: أنني دخلت في غيبة
  rationale: ينقل التعبير الاصطلاحي الدال على الدخول في حالة رؤيوية، من غير إضافة تفسير لآليتها أو طبيعتها.
theological_decisions:
- issue: طبيعة اختبار بولس المشار إليه بلفظ ἐκστάσει
  choice: غيبة
  alternative: انخطاف؛ حالة رؤيوية
  rationale: «غيبة» تعبر عن حالة وعي غير عادية مرتبطة برؤية، من غير أن تحسم طبيعتها أو تضيف دعوى لاهوتية لا يصرح بها النص.
translation_notes:
  register: 'عربية فصحى حديثة واضحة وموقرة. حُفظ ترتيب الحدثين: الرجوع أولًا، ثم الصلاة المتزامنة مع الدخول في الغيبة. وُضعت علامتا الحاشيتين بعد اللفظ الذي تشرحانه مباشرة.'
