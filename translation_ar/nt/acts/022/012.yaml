lexical_decisions:
- source_word: Ἁνανίας
  choice: حنانيا
  rationale: نقلٌ صوتي للاسم اليوناني وفق الصيغة العربية الكتابية الشائعة.
- source_word: δέ
  choice: و
  rationale: أداة انتقال سردي خفيفة؛ الواو تؤدي الربط طبيعيًّا من غير أن تضيف دلالة زمنية صريحة.
- source_word: τις ἀνὴρ
  choice: رجلٌ
  rationale: يفيد التركيب رجلًا معيّنًا لم يسبق تعريفه، ثم يعيّنه الاسم اللاحق؛ والصياغة العربية الطبيعية لا تحتاج إلى «رجل ما» هنا.
- source_word: εὐλαβής
  choice: تقيًّا
  rationale: تعبير عربي واضح عن الورع والتدين الحريص، ملائم لوصف حنانيا في علاقته بالشريعة.
- source_word: κατὰ τὸν νόμον
  choice: بحسب الشريعة
  rationale: يحفظ علاقة تقوى حنانيا بالشريعة الموسوية؛ و«الشريعة» أوضح في هذا السياق من «القانون».
- source_word: μαρτυρούμενος
  choice: يشهد له بالخير
  rationale: ينقل معنى الشهادة الحسنة التي يقدمها الآخرون عنه بصياغة عربية طبيعية.
- source_word: ὑπὸ πάντων
  choice: جميع
  rationale: يحفظ القوة الشاملة للفظ اليوناني πάντων.
- source_word: τῶν κατοικούντων Ἰουδαίων
  choice: اليهود المقيمين هناك
  rationale: يعبر عن الإقامة في الموضع المفهوم من السياق، أي دمشق، ويأخذ Ἰουδαίων هنا بمعنى الجماعة اليهودية لا الانتماء الجغرافي إلى اليهودية.
theological_decisions:
- issue: دلالة Ἰουδαίων
  choice: اليهود
  alternative: اليهوديّون (أي أهل اليهودية جغرافيًّا)
  rationale: السياق يتحدث عن جماعة اليهود المقيمة في دمشق وعن سمعة حنانيا لديها، لا عن أصلهم الجغرافي من إقليم اليهودية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. حافظت الصياغة على كون العبارة جزءًا من جملة سردية متصلة، ولذلك خُتمت بفاصلة. لم تُضف حاشية لأن الحاشية الإنجليزية المرفقة بعلامة [a] لا تتعلق بموضع العلامة في متنها؛ فهي تناقش Ἰουδαίων، كما أن البديل الجغرافي غير مرجح في هذا السياق.
