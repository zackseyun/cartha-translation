    text: 'أي إنهم كانوا يطالبون بقتله. ويمكن ترجمة العبارة الأخيرة: «فإنه لا ينبغي له أن يعيش».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤκουον
  choice: كانوا يصغون
  rationale: ينقل صيغة الماضي الناقص الدالة على استمرار الإصغاء، ويفيد الانتباه إلى خطاب بولس.
- source_word: ἄχρι τούτου τοῦ λόγου
  choice: حتى قال هذه العبارة
  rationale: λόγος هنا هو القول أو النقطة المحددة في الخطاب التي أثارت رد الفعل، لا مجرد كلمة مفردة.
- source_word: ἐπῆραν τὴν φωνὴν αὐτῶν
  choice: رفعوا أصواتهم
  rationale: يحافظ على صورة التعبير اليوناني ويدل طبيعيًا على الصياح الجماعي.
- source_word: Αἶρε ἀπὸ τῆς γῆς τὸν τοιοῦτον
  choice: أَزِلْ مثل هذا عن وجه الأرض
  rationale: ينقل أمر الإزالة ونبرة الازدراء، وعبارة «عن وجه الأرض» عربية طبيعية توضح أن الصيحة تطالب بالتخلص منه نهائيًا.
- source_word: οὐ γὰρ καθῆκεν αὐτὸν ζῆν
  choice: لأنه لا يليق أن يعيش
  rationale: يحافظ على معنى καθῆκεν المتعلق بما يليق أو ينبغي، من غير أن يحوّل العبارة في المتن إلى تقرير أكثر تفسيرًا.
