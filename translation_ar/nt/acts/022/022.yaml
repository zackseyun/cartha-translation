  text: They were listening to him up to this statement, and they raised their voices, saying, “Take such a man away from the earth, for it was not fitting for him to live.”
translation:
  language: ar
  text: 'وكانوا يستمعون إليه إلى هذه العبارة، فرفعوا أصواتهم قائلين: «أَزِلْ مثلَ هذا الرجل عن وجه الأرض، فإنه لا يليق به أن يعيش».[a]'
  philosophy: optimal-equivalence
  footnotes:
