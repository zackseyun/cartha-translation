base_translation:
  language: en
  yaml_path: translation/nt/acts/022/026.yaml
  text: When the centurion heard this[a], he went to the commander and reported it, saying[b], “What are you about to do? For this man is a Roman citizen.”
translation:
  language: ar
  text: 'فَلَمَّا سَمِعَ قائدُ المئةِ هذا، ذهب إلى القائد وأخبره قائلًا: «ماذا أنت مزمع أن تفعل؟[a] فإن هذا الرجل رومانيّ[b].»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ماذا تنوي أن تفعل؟» أو «ماذا أنت على وشك أن تفعل؟» فالعبارة اليونانية قد تدل على الفعل الوشيك أو على الفعل المقصود.'
    reason: lexical_alternative
  - marker: b
    text: أي إنه مواطن روماني؛ فالمقصود في هذا السياق تمتعه بحقوق المواطنة الرومانية.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: فَلَمَّا سَمِعَ ... هذا
  rationale: ينقل اسم الفاعل الماضي بوصفه ظرفًا زمنيًّا سابقًا للفعل الرئيس، بعبارة عربية طبيعية.
- source_word: ἑκατοντάρχης
  choice: قائد المئة
  rationale: تعبير عربي واضح ودقيق نسبيًّا عن الرتبة العسكرية الرومانية.
- source_word: προσελθὼν
  choice: ذهب إلى
  rationale: يؤدي معنى التوجه والاقتراب من الضابط الأعلى بصياغة سردية طبيعية.
- source_word: χιλιάρχῳ
  choice: القائد
  rationale: لفظ مفهوم للقارئ المعاصر يدل في السياق على الضابط الأعلى، دون نقل حرفي غريب للرتبة.
- source_word: ἀπήγγειλεν
  choice: أخبره
  rationale: ينقل معنى إبلاغ المسؤول بالمعلومة، والضمير ملائم للسياق العربي.
- source_word: λέγων
  choice: قائلًا
  rationale: يحافظ على الصلة الحالية بين الإخبار والكلام المباشر.
- source_word: Τί μέλλεις ποιεῖν;
  choice: ماذا أنت مزمع أن تفعل؟
  rationale: يحافظ على احتمال القصد أو الفعل الوشيك الكامن في μέλλω مع المصدر.
- source_word: ὁ γὰρ ἄνθρωπος οὗτος
  choice: فهذا الرجل
  rationale: ينقل γάρ تعليلًا طبيعيًّا، ويحافظ على الإشارة إلى رجل بعينه.
- source_word: Ῥωμαῖός ἐστιν
  choice: هذا الرجل رومانيٌّ
  rationale: يحافظ في المتن على الصياغة اليونانية الموجزة وعلى دلالتها القانونية السياقية، مع توضيح المواطنة في الحاشية.
