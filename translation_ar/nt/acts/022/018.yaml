source:
  edition: SBLGNT
  text: καὶ ἰδεῖν αὐτὸν λέγοντά μοι· Σπεῦσον καὶ ἔξελθε ἐν τάχει ἐξ Ἰερουσαλήμ, διότι οὐ παραδέξονταί ⸀σου μαρτυρίαν περὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/018.yaml
  text: and I saw him saying to me[a], ‘Hurry and get out of Jerusalem quickly, because they will not accept your testimony about me.’
translation:
  language: ar
  text: 'ورأيتُه يقول لي: «أسرِع واخرج من أورشليم عاجلًا، لأنهم لن يقبلوا شهادتك عني[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لن يتلقّوا شهادتك عني».'
    reason: بديل معجمي للفعل παραδέχομαι، الذي قد يعني القبول أو التلقّي قبولًا حسنًا.
lexical_decisions:
- source_word: ἰδεῖν
  choice: ورأيتُ
  rationale: المصدر في هذا التركيب السردي يواصل رواية بولس للرؤيا، وصيغة الفعل الماضي طبيعية في العربية وتحفظ معنى الإدراك البصري.
- source_word: αὐτὸν
  choice: ـه
  rationale: الضمير يعود في السياق إلى الرب الذي ظهر لبولس، وإبقاؤه ضميرًا يتبع صياغة اليونانية من غير إدخال لقب تفسيري.
- source_word: λέγοντά μοι
  choice: يقول لي
  rationale: يحفظ معنى اسم الفاعل الذي يصف الضمير ويمهّد للكلام المباشر بصياغة عربية طبيعية.
- source_word: Σπεῦσον
  choice: أسرِع
  rationale: فعل أمر ينقل الإلحاح بوضوح وبلغة عربية معاصرة رصينة.
- source_word: ἔξελθε
  choice: اخرج
  rationale: ينقل أمر الحركة إلى خارج المدينة مباشرة، مع بقاء قوة الفعل اليوناني.
- source_word: ἐν τάχει
  choice: عاجلًا
  rationale: يؤكد سرعة المغادرة، ويحفظ مع «أسرِع» تكرار الإلحاح الموجود في الأصل من دون ثقل مفرط.
- source_word: ἐξ Ἰερουσαλήμ
  choice: من أورشليم
  rationale: حرف الجر مع فعل الخروج يبيّن الحركة من داخل المدينة إلى خارجها بصورة طبيعية في العربية.
- source_word: διότι
  choice: لأن
  rationale: يقدّم سبب الأمر بوضوح.
- source_word: οὐ παραδέξονταί
  choice: لن يقبلوا
  rationale: الفعل يدل هنا على عدم قبول الشهادة أو تلقيها قبولًا حسنًا؛ و«يقبلوا» أنسب مع «شهادتك» في العربية المعاصرة.
- source_word: σου μαρτυρίαν
  choice: شهادتك
  rationale: تحفظ الدلالة الشهادية والإعلانية للكلمة في السياق.
- source_word: περὶ ἐμοῦ
  choice: عني
  rationale: تعبير عربي موجز وطبيعي ينقل معنى الإشارة إلى موضوع الشهادة.
theological_decisions:
- issue: مرجع الضمير في «رأيتُه»
  choice: الإبقاء على الضمير كما في النص اليوناني، مع اعتماد السياق السابق لتحديد مرجعه.
  alternative: التصريح بعبارة «رأيت الرب» أو «رأيت يسوع».
  rationale: السياق يحدد المتكلم، لكن هذه الآية تستعمل ضميرًا؛ لذلك لا يُضاف لقب تفسيري غير وارد فيها.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. حُفظ توكيد العجلة في «أسرِع» و«عاجلًا»، وأُبقي الضمير من غير تفسير زائد.
