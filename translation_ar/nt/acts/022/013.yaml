base_translation:
  language: en
  yaml_path: translation/nt/acts/022/013.yaml
  text: He came to me[a], and standing by me said to me, ‘Brother Saul, receive your sight.’ And in that very hour I received my sight and looked at him.
translation:
  language: ar
  text: 'فجاء إليَّ، ووقف بجانبي وقال لي: «يا أخي شاول، أبصِر من جديد[a]». وفي تلك الساعة عينها أبصرتُ من جديد ونظرتُ إليه.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «استعِد بصرك». ويمكن أن يعني الفعل اليوناني أيضًا «ارفع نظرك»، لكن سياق العمى والشفاء هنا يرجّح معنى استعادة البصر؛ وينطبق ذلك على وروده في الموضعين.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν πρὸς ἐμέ
  choice: فجاء إليَّ
  rationale: صياغة عربية طبيعية تحفظ معنى المجيء نحو بولس، وتؤدي اسم الفاعل الماضي اليوناني بفعل سردي معطوف.
- source_word: ἐπιστάς
  choice: ووقف بجانبي
  rationale: ينقل اتخاذ حنانيا موضعًا قريبًا من بولس، مع الحفاظ على تتابع الحدث.
- source_word: Σαοὺλ ἀδελφέ
  choice: يا أخي شاول
  rationale: صيغة نداء عربية طبيعية تحفظ «أخي» بوصفها خطاب قرابة أو شركة، من غير تحويلها إلى لقب اصطلاحي.
- source_word: ἀνάβλεψον
  choice: أبصِر من جديد
  rationale: الفعل قد يعني «ارفع نظرك» أو «استعد بصرك». وسياق العمى والشفاء يرجّح استعادة البصر، بينما تحافظ هذه الصياغة على الصلة اللفظية بالتكرار التالي.
- source_word: αὐτῇ τῇ ὥρᾳ
  choice: في تلك الساعة عينها
  rationale: يحفظ التشديد الزمني في العبارة اليونانية بدل اختزاله إلى «حالًا».
- source_word: ἀνέβλεψα
  choice: أبصرتُ من جديد
  rationale: يحافظ على تكرار الفعل نفسه وعلى معنى استعادة البصر في السياق.
- source_word: εἰς αὐτόν
  choice: ونظرتُ إليه
  rationale: ينقل اتجاه النظر نحو حنانيا بعد عودة البصر، لا مجرد رؤيته.
- source_word: κἀγώ
  choice: و...تُ
  rationale: أُدي اقتران καί وἐγώ بالعطف والفاعل المتصل في العربية من غير إضافة توكيد لا يفرضه السياق.
