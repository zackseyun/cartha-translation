  source_fidelity: 'النص العربي ينقل عناصر اليونانية كلها بأمانة: المجيء إلى بولس، الوقوف بجانبه، النداء «يا أخي شاول»، الأمر باستعادة البصر في سياق الشفاء، التحديد الزمني المؤكد، ثم توجّه نظر بولس إلى حنانيا. وتحافظ «من جديد» في الموضعين على دلالة استعادة البصر وعلى التوازي اللفظي للفعل اليوناني.'
  naturalness: الصياغة فصيحة حديثة وواضحة. «أبصِر من جديد» و«أبصرتُ من جديد» سليمتان في هذا السياق، وإن كانت «استعِد بصرك» بديلًا ممكنًا، فلا حاجة إلى استبدالها لأنها ستقلل من التوازي القائم في النص.
  terminology: «يا أخي شاول» نداء طبيعي لا يحمّل لفظ «أخي» دلالة مذهبية زائدة. و«تلك الساعة عينها» تؤدي التشديد الزمني في αὐτῇ τῇ ὥρᾳ بدقة. الحاشية المعجمية مناسبة، ومثبتة عند أول وقوع مع تنبيه صريح إلى انطباقها على الموضعين.
