  text: ἔπεσά τε εἰς τὸ ἔδαφος καὶ ἤκουσα φωνῆς λεγούσης μοι· Σαοὺλ Σαούλ, τί με διώκεις;
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/007.yaml
  text: I fell to the ground and heard a voice saying to me, ‘Saul, Saul, why are you persecuting me?’
translation:
  language: ar
  text: 'فسقطتُ على الأرض، وسمعتُ صوتًا يقول لي: «شاول، شاول، لماذا تضطهدني؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπεσά
  choice: فسقطتُ
  rationale: فعل ماضٍ متكلم مفرد، ونُقل بصيغة الماضي العربية. وتؤدي الفاء هنا ربط الجملة بسياق السرد السابق ربطًا طبيعيًا.
- source_word: τε
  choice: '[لم تُترجم على حدة]'
  rationale: أداة ربط خفيفة تصل العبارة بما قبلها، وقد أدّت الفاء في مطلع الجملة والواو اللاحقة وظيفتها في العربية من غير ترجمة مستقلة متكلّفة.
- source_word: εἰς τὸ ἔδαφος
  choice: على الأرض
  rationale: هذا هو التعبير العربي المألوف عند وصف السقوط، وهو ينقل جهة الحركة إلى سطح الأرض طبيعيًا.
- source_word: ἤκουσα
  choice: سمعتُ
  rationale: فعل ماضٍ متكلم مفرد، فنُقل بصيغة الماضي البسيط.
- source_word: φωνῆς
  choice: صوتًا
  rationale: المضاف إليه في اليونانية بعد فعل السماع يُصاغ طبيعيًا مفعولًا به في العربية، والسياق اللاحق يبيّن أنه صوت ناطق.
- source_word: λεγούσης μοι
  choice: يقول لي
  rationale: اسم الفاعل المضارع يصف فعلًا متزامنًا مع السماع، وتُبقي الصياغة ضمير المتكلم الذي يقابله μοι.
- source_word: Σαοὺλ Σαούλ
  choice: شاول، شاول
  rationale: حُفظ الاسم بصيغته العربية الشائعة، كما حُفظ التكرار للتوكيد والنداء المباشر.
- source_word: τί
  choice: لماذا
  rationale: تسأل الأداة هنا عن سبب الفعل، و«لماذا» هي المقابل العربي الطبيعي المباشر.
- source_word: με
  choice: ني
  rationale: ضمير مفعول به يعود إلى المتكلم، وقد أُلحق بالفعل وفق الأسلوب العربي الطبيعي.
- source_word: διώκεις
  choice: تضطهدني
  rationale: المعنى السياقي للفعل هو الملاحقة العدائية والاضطهاد، وصيغة المضارع العربية تحفظ الفعل الجاري أو المستمر.
theological_decisions:
- issue: علاقة المتكلم بما يفعله شاول بالمؤمنين
  choice: الإبقاء على ضمير المتكلم المباشر في «تضطهدني»
  alternative: توسيع العبارة إلى «تضطهد شعبي» أو «تضطهد أتباعي»
  rationale: النص نفسه يجعل اضطهاد شاول موجّهًا إلى المتكلم، ولا ينبغي للترجمة أن تفك هذا التوتر اللاهوتي أو تشرحه بإضافة غير موجودة.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة، مع ترتيب سردي طبيعي ومحافظة على الإيجاز والتكرار والخطاب المباشر في الأصل.
