  text: καὶ νῦν τί μέλλεις; ἀναστὰς βάπτισαι καὶ ἀπόλουσαι τὰς ἁμαρτίας σου ἐπικαλεσάμενος τὸ ὄνομα ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/016.yaml
  text: And now why are you waiting? Rise[a], be baptized, and wash away your sins[b], calling on his name.
translation:
  language: ar
  text: والآن، ماذا تنتظر؟[a] قُم واعتمد، واغسل خطاياك[b] داعيًا باسمه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لماذا تتأخر؟»'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أن يُفهم اسم الفاعل اليوناني أيضًا بصورة أصرح: «وأنت تدعو باسمه» أو «بأن تدعو باسمه»؛ وتُبقي الترجمة الصلة محتملة بين المصاحبة والوسيلة.'
    reason: alternative_reading
lexical_decisions:
- source_word: τί μέλλεις
  choice: ماذا تنتظر؟
  rationale: يؤدي الاستفهام هنا معنى الحث على عدم التأخر، وهذه الصياغة عربية واضحة وطبيعية مع إبقاء البديل الممكن في الحاشية.
- source_word: ἀναστὰς
  choice: قُم
  rationale: اسم الفاعل اليوناني السابق للأوامر يفيد هنا فعلًا مصاحبًا لها، فنُقل بصيغة الأمر للمحافظة على الإلحاح وسلامة العربية.
- source_word: βάπτισαι
  choice: اعتمد
  rationale: ينقل الأمر اليوناني الأوسط بصياغة عربية مألوفة، من غير إضافة فاعل يقوم بالتعميد أو شرح لاهوتي لطبيعته.
- source_word: ἀπόλουσαι
  choice: اغسل
  rationale: الفعل الأوسط يعني غسل الشيء وإزالته بالتطهير؛ ومع المفعول «خطاياك» تحافظ الصياغة المباشرة على صورة النص وقوته.
- source_word: τὰς ἁμαρτίας σου
  choice: خطاياك
  rationale: ترجمة مباشرة تحافظ على المعنى العادي لكلمة ἁμαρτία من غير توسيع تفسيري.
- source_word: ἐπικαλεσάμενος
  choice: داعيًا
  rationale: اسم الفاعل يحافظ قدر الإمكان على مرونة الصلة النحوية بين الدعاء والأمرين السابقين، فلا يحسم هل هو حال مصاحب أم وسيلة.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: باسمه
  rationale: ينقل الضمير اليوناني كما هو؛ والسياق يعيّن مرجعه، لكن الآية نفسها لا تستبدله بلقب صريح.
theological_decisions:
- issue: العلاقة بين المعمودية وغسل الخطايا والدعاء باسمه
  choice: 'حُفظ ترتيب النص: الأمر بالاعتماد، ثم الأمر بغسل الخطايا، ثم اسم الفاعل «داعيًا باسمه»، من غير تحديد لاهوتي زائد لطبيعة العلاقة بينها.'
  alternative: يمكن فهم الدعاء باسمه وسيلةً لغسل الخطايا، أو حالًا مصاحبًا، كما يمكن فهم العبارة كلها بوصفها وحدة واحدة لأحداث الدخول في الإيمان.
  rationale: التركيب اليوناني ينسق أمرين ويتبعهما باسم فاعل، لكنه لا يلزم المترجم بحسم الخلاف حول الوسيلة الدقيقة لغسل الخطايا؛ لذلك تحافظ الصياغة على التوتر الدلالي واللاهوتي.
translation_notes:
  register: لغة عربية فصحى معاصرة، واضحة وموقرة. استُعملت «اعتمد» بصيغتها العربية الكنسية الشائعة من غير إدخال تفسير مذهبي، وحُفظ الضمير في «باسمه» بدل التصريح بمرجع لا يصرح به نص الآية.
