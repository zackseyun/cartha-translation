id: ACT.22.5
reference: Acts 22:5
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὡς καὶ ὁ ἀρχιερεὺς μαρτυρεῖ μοι καὶ πᾶν τὸ πρεσβυτέριον· παρ’ ὧν καὶ ἐπιστολὰς δεξάμενος πρὸς τοὺς ἀδελφοὺς εἰς Δαμασκὸν ἐπορευόμην ἄξων καὶ τοὺς ἐκεῖσε ὄντας δεδεμένους εἰς Ἰερουσαλὴμ ἵνα τιμωρηθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/005.yaml
  text: as also the high priest and the whole council of elders can testify for me. From them I also received letters to the brothers in Damascus[a], and I was traveling there to bring also those who were there, bound, to Jerusalem so that they might be punished.
translation:
  language: ar
  text: كما يشهد لي أيضًا رئيس الكهنة ومجلس الشيوخ كله. فمنهم تسلَّمت أيضًا رسائل إلى الإخوة في دمشق[a]، وكنت ذاهبًا إلى هناك لآتي أيضًا بالذين هناك مقيَّدين إلى أورشليم لكي يُعاقَبوا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إلى الإخوة والأخوات». تقول اليونانية «الإخوة»، لكن اللفظ قد يشير في بعض السياقات إلى جماعة أوسع.'
    reason: بديل معجمي يوضح احتمال الاستعمال الشامل من غير إدخاله في المتن.
lexical_decisions:
- source_word: ὡς καὶ
  choice: ويشهد لي أيضًا
  rationale: أُدمجت أداة المقارنة والتوكيد في صياغة عربية طبيعية تفيد أن هذه الجهات تؤيد قول بولس أيضًا.
- source_word: ὁ ἀρχιερεὺς
  choice: رئيس الكهنة
  rationale: المقابل العربي المألوف للقب الكهنوتي المفرد في هذا السياق التاريخي.
- source_word: μαρτυρεῖ μοι
  choice: يشهد لي
  rationale: يحافظ على زمن المضارع وعلى معنى تأييد كلام بولس بالشهادة، من غير إضافة دلالة القدرة التي ليست صريحة في اليونانية.
- source_word: πᾶν τὸ πρεσβυτέριον
  choice: مجلس الشيوخ كله
  rationale: يدل اللفظ على هيئة الشيوخ المجتمعة، لا على كبار السن عمومًا؛ وهذه عبارة عربية واضحة وغير طائفية.
- source_word: παρ’ ὧν
  choice: فمنهم
  rationale: يرجع الضمير إلى رئيس الكهنة ومجلس الشيوخ مجتمعين، والفاء تصل الجملة بما قبلها طبيعيًا.
- source_word: ἐπιστολὰς
  choice: رسائل
  rationale: يحفظ المعنى المعجمي المباشر، بينما تُفهم الصفة الرسمية لهذه الرسائل من السياق.
- source_word: πρὸς τοὺς ἀδελφοὺς
  choice: إلى الإخوة
  rationale: يحافظ على صيغة الجمع المذكر في الأصل وعلى تسمية الجماعة كما وردت، دون حصرها تفسيريًا في اليهود أو توسيعها صراحة.
- source_word: ἐπορευόμην
  choice: كنت ذاهبًا
  rationale: يعكس دلالة الماضي المستمر في صيغة الناقص، وهو تعبير عربي طبيعي في سياق الرحلة.
- source_word: ἄξων
  choice: لآتي
  rationale: اسم الفاعل الدال على الغرض بعد فعل الحركة صيغ بلام التعليل؛ والفعل هنا يفيد إحضار الأشخاص إلى أورشليم.
- source_word: τοὺς ἐκεῖσε ὄντας
  choice: الذين فيها
  rationale: الضمير يعود بوضوح إلى دمشق ويؤدي معنى الموجودين هناك بإيجاز طبيعي.
- source_word: δεδεμένους
  choice: موثَقين
  rationale: يحفظ حالة الأسر الناتجة عن التقييد من غير أن يحدد وسيلة القيد، مثل السلاسل، وهي غير مصرّح بها.
- source_word: ἵνα τιμωρηθῶσιν
  choice: لكي يُعاقَبوا
  rationale: ينقل جملة الغرض ومعنى المعاملة العقابية بصيغة المبني للمجهول، دون تحديد عقوبة بعينها.
theological_decisions:
- issue: مدلول ἀδελφοί واحتمال شموله جماعة أوسع
  choice: إلى الإخوة
  alternative: 'إلى الإخوة والأخوات؛ أو: إلى إخوانهم اليهود'
  rationale: أُبقيت الصيغة المذكرة الواردة في الأصل في المتن، مع بيان احتمال الاستعمال الجماعي الأوسع في الحاشية، تجنبًا لحسم هوية المخاطَبين أو تركيب الجماعة بما يتجاوز النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «مجلس الشيوخ» بدل مصطلحات كنسية تقنية، وحوفظ على تتابع «أيضًا» حيث يقابله καί في المصدر، مع صياغة عربية غير متكلّفة.
