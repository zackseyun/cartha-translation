- from: ويشهد لي أيضًا رئيس الكهنة ومجلس الشيوخ كله. فمنهم تسلَّمت أيضًا رسائل إلى الإخوة في دمشق[a]، وكنت ذاهبًا إلى هناك لآتي أيضًا بالذين فيها موثَقين إلى أورشليم لكي يُعاقَبوا.
  to: كما يشهد لي أيضًا رئيس الكهنة ومجلس الشيوخ كله. فمنهم تسلَّمت أيضًا رسائل إلى الإخوة في دمشق[a]، وكنت ذاهبًا إلى هناك لآتي أيضًا بالذين هناك مقيَّدين إلى أورشليم لكي يُعاقَبوا.
  rationale: أُعيدت دلالة ὡς καί الافتتاحية بعبارة «كما يشهد لي أيضًا»، وحُسّنت الإحالة المكانية إلى «الذين هناك». ولا يغيّر التنقيح المقصود التاريخي أو القانوني للنص، ويحافظ على الغموض المتعلق بمدلول «الإخوة».
