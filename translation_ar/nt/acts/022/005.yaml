  terminology: «رئيس الكهنة»، و«مجلس الشيوخ»، و«الإخوة»، و«أورشليم»، و«يُعاقَبوا» مقابلات مناسبة ومحايدة. واستبدلتُ «موثَقين» بـ«مقيَّدين» لسلامة الاستعمال الحديث من دون تخصيص أداة القيد.
