base_translation:
  language: en
  yaml_path: translation/nt/acts/022/019.yaml
  text: And I said[a], ‘Lord[b], they themselves know that in every synagogue I was imprisoning and beating those who believe in you.’
translation:
  language: ar
  text: 'فقلتُ: «يا رب، هم أنفسهم يعلمون أنني كنتُ، في كل مجمع[a]، أسجن وأضرب الذين يؤمنون بك[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «من مجمع إلى مجمع»؛ فالعبارة اليونانية توزيعية، وتدل على تكرار الفعل في مجامع متعددة.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «الذين يثقون بك» أو «الذين يضعون ثقتهم فيك».'
    reason: alternative_reading
lexical_decisions:
- source_word: κἀγὼ εἶπον
  choice: فقلتُ
  rationale: تنقل العبارة العربية فعل القول وضمير المتكلم ووصل الكلام بما قبله بصورة طبيعية موجزة.
- source_word: Κύριε
  choice: يا رب
  rationale: صيغة نداء تحفظ معنى κύριος والوزن المسيحاني في مخاطبة يسوع من غير زيادة تفسيرية.
- source_word: αὐτοὶ ἐπίστανται
  choice: هم أنفسهم يعلمون
  rationale: تحفظ توكيد الضمير αὐτοὶ، وتؤدي ἐπίστανται بلفظ عربي واضح.
- source_word: ἤμην φυλακίζων καὶ δέρων
  choice: كنتُ أسجن وأضرب
  rationale: تنقل التركيب الماضي المستمر معنى الفعل المتكرر أو المعتاد، من غير حصر الضرب في جلد قضائي مخصوص.
- source_word: κατὰ τὰς συναγωγάς
  choice: في المجامع واحدًا بعد آخر
  rationale: تُظهر القوة التوزيعية لـ κατά مع الجمع، أي تكرر العمل عبر مجامع متعددة.
- source_word: τοὺς πιστεύοντας ἐπὶ σέ
  choice: الذين يؤمنون بك
  rationale: صياغة عربية طبيعية تحفظ اتجاه الإيمان أو الثقة نحو المخاطَب، مع إبقاء البديل الدلالي في الحاشية.
theological_decisions:
- issue: ترجمة κύριος في خطاب يسوع
  choice: يا رب
  alternative: يا سيد
  rationale: «يا رب» تحفظ الاستعمال المسيحي والسياق الذي يخاطب فيه بولس يسوع القائم، من غير أن تضيف تصريحًا لاهوتيًا غير وارد في العبارة.
- issue: دلالة πιστεύω ἐπί
  choice: يؤمنون بك
  alternative: يثقون بك
  rationale: «يؤمنون بك» هي الصياغة العربية الأشيع، بينما يحتمل الأصل أيضًا معنى الاتكال والثقة، ولذلك ذُكر البديل في الحاشية.
- issue: هيئة اضطهاد بولس السابق
  choice: كنتُ أسجن وأضرب
  alternative: كنتُ أعتاد أن أسجن وأضرب
  rationale: الصياغة المختارة تحفظ استمرار الفعل وتكراره في الماضي من دون إدخال لفظ «أعتاد» التفسيري صراحة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «المجامع» للمجامع اليهودية، وحُفظ توكيد «هم أنفسهم» ودلالة الفعل الماضي المتكرر. وُضعت علامتا الحاشيتين في المتن عند العبارتين المعنيتين.
