base_translation:
  language: en
  yaml_path: translation/nt/acts/022/008.yaml
  text: And I answered[a], ‘Who are you, Lord?’ And he said to me, ‘I am Jesus the Nazarene[b], whom you are persecuting.’
translation:
  language: ar
  text: 'فأجبتُ: «مَن أنتَ، يا ربّ؟»[a] فقال لي: «أنا يسوع الناصريّ[b] الذي أنتَ تضطهده».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مَن أنتَ، يا سيدي؟» فاللفظة اليونانية κύριε قد تكون نداء احترام، كما قد تعني «يا ربّ».'
    reason: alternative_reading
  - marker: b
    text: 'أو: «يسوع الذي من الناصرة»، أو «يسوع النازوري».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθην
  choice: فأجبتُ
  rationale: فعل ماضٍ من ἀποκρίνομαι، ومعناه الطبيعي هنا «أجبت». واستُعملت الفاء لربط الجواب بسياق الرواية ربطًا عربيًا سلسًا.
- source_word: Τίς εἶ
  choice: مَن أنتَ؟
  rationale: استفهام مباشر عن الهوية، وهذه صيغته الطبيعية الواضحة في العربية.
- source_word: κύριε
  choice: يا ربّ
  rationale: يحافظ على المقابل المعتاد لـ κύριος وعلى التوتر الدلالي في السياق؛ إذ يمكن أن يكون لقبًا دينيًا أو نداء احترام، وتُذكر الإمكانية الثانية في الحاشية.
- source_word: εἶπέν τε πρὸς ἐμέ
  choice: فقال لي
  rationale: صياغة عربية طبيعية تؤدي معنى القول الموجَّه إلى المتكلم، وتعبّر الفاء عن قوة الربط التي تحملها τε في السياق.
- source_word: Ἐγώ εἰμι
  choice: أنا
  rationale: في جملة التعريف العربية «أنا يسوع» تؤدي معنى «أنا هو/أنا أكون» طبيعيًا من غير إضافة فعل ربط غير لازم.
- source_word: Ἰησοῦς
  choice: يسوع
  rationale: النقل العربي المعياري للاسم الشخصي.
- source_word: ὁ Ναζωραῖος
  choice: الناصريّ
  rationale: مقابل عربي موجز وطبيعي للقب المنسوب إلى الناصرة، ويحافظ على هيئة اللقب في اليونانية بدل تحويله في المتن إلى عبارة مكانية.
- source_word: ὃν σὺ διώκεις
  choice: الذي أنتَ تضطهده
  rationale: «تضطهد» يؤدي معنى διώκω هنا بوصفه ملاحقة عدائية واضطهادًا، وإظهار الضمير «أنت» يحافظ على توكيد σὺ.
theological_decisions:
- issue: دلالة κύριε في خطاب شاول
  choice: يا ربّ
  alternative: يا سيدي
  rationale: اختير «يا ربّ» حفاظًا على المقابل الاصطلاحي المعتاد وعلى الصدى اللاهوتي في السرد، من غير الجزم بأن شاول كان قد أدرك هوية المتكلم إدراكًا كاملًا؛ لذلك حُفظ معنى نداء الاحترام في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدم «الناصريّ» بصيغة النسبة المألوفة، وأُبقي توكيد الضمير في «الذي أنت تضطهده» لمقابلة σὺ. تظهر علامتا الحاشيتين [a] و[b] في المتن.
