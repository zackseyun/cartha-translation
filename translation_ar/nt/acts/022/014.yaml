  naturalness: 'الصياغة فصيحة حديثة وواضحة: «إن إله آبائنا قد عيَّنك لتعرف مشيئته، وترى البارَّ، وتسمع صوتًا من فمه». والترقيم وعلامات الاقتباس مناسبان، وتسلسل الأفعال طبيعي في العربية.'
