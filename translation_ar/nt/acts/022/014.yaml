id: ACT.22.14
reference: Acts 22:14
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ὁ θεὸς τῶν πατέρων ἡμῶν προεχειρίσατό σε γνῶναι τὸ θέλημα αὐτοῦ καὶ ἰδεῖν τὸν δίκαιον καὶ ἀκοῦσαι φωνὴν ἐκ τοῦ στόματος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/014.yaml
  text: And he said[a], ‘The God of our fathers has appointed you to know his will, to see the Righteous One[b], and to hear a voice from his mouth,’
translation:
  language: ar
  text: 'فقال: «إن إله آبائنا قد عيَّنك[a] لتعرف مشيئته، وترى البارَّ[b]، وتسمع صوتًا من فمه».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «اختارك». يمكن أن يدل الفعل اليوناني على اختيار شخص أو تعيينه لمهمة.
    reason: lexical_alternative
  - marker: b
    text: «البارّ» لقب ليسوع؛ ويمكن أيضًا ترجمته «العادل».
    reason: alternative_reading
lexical_decisions:
- source_word: προεχειρίσατό
  choice: عيَّنك
  rationale: يفيد الفعل اختيار شخص وتعيينه لمهمة؛ و«عيَّنك» يحفظ معنى التكليف المقصود من غير أن يفرض دلالة زمنية مثل «سبق فعيَّنك».
- source_word: γνῶναι
  choice: لتعرف
  rationale: تنقل مصدر الغرض اليوناني بعبارة عربية طبيعية، مع إبقاء احتمال بلوغ المعرفة ضمن السياق من غير زيادة تفسيرية.
- source_word: θέλημα
  choice: مشيئته
  rationale: «المشيئة» المقابل العربي المألوف الذي يحفظ سعة معنى إرادة الله وقصده.
- source_word: ἰδεῖν
  choice: وترى
  rationale: ترجمة مباشرة وطبيعية للفعل، من غير رفع الأسلوب إلى لفظ أقدم مثل «تعاين».
- source_word: τὸν δίκαιον
  choice: البارَّ
  rationale: يحفظ الصفة المعرَّفة بوصفها لقبًا معروفًا للمسيح في سفر أعمال الرسل، من غير إدخال اسم يسوع في المتن.
- source_word: ἀκοῦσαι φωνὴν
  choice: وتسمع صوتًا
  rationale: أُبقيت «صوتًا» نكرة كما في اليونانية، ولم تُخصَّص إلى «الصوت»؛ والسياق اللاحق يدل على كلام مسموع.
- source_word: ἐκ τοῦ στόματος αὐτοῦ
  choice: من فمه
  rationale: يحفظ الصورة الحسية المباشرة في الأصل بدل اختزالها إلى «منه».
- source_word: Ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: إله آبائنا
  rationale: يحفظ التعبير العهدي المرتبط بتراث إسرائيل، وينقل πατέρων بصيغته الذكورية الصريحة.
theological_decisions:
- issue: هل τὸν δίκαιον لقب مسياني أم مجرد وصف؟
  choice: «البارّ» بوصفه لقبًا للمسيح
  alternative: «الإنسان البار» أو «العادل» بوصفه وصفًا عامًا
  rationale: استعمال العبارة في أعمال الرسل 3:14 و7:52 يجعل القوة اللقبية هي الأرجح، مع إبقاء اللفظ نفسه وعدم إضافة اسم يسوع إلى المتن.
- issue: هل يُترجم πατέρων بلفظ خاص بالآباء أم بلفظ شامل للأسلاف؟
  choice: «آبائنا»
  alternative: «أسلافنا»
  rationale: اللفظ اليوناني صريح، كما أن «إله آبائنا» تعبير كتابي عهدي مألوف؛ أما «أسلافنا» فممكن لكنه أعمّ.
translation_notes:
  register: لغة عربية فصحى حديثة واضحة وموقرة. استُخدمت «عيَّنك» لتلائم الغرض الذي توضحه الأفعال الثلاثة التالية، وحُفظت العبارة الحسية «من فمه». ظهرت علامتا الحاشيتين [a] و[b] في موضعيهما داخل المتن.
