  yaml_path: translation/nt/acts/022/025.yaml
  text: But when they had stretched him out with the straps[a], Paul said to the centurion standing there, “Is it lawful for you to flog a Roman citizen who is uncondemned?”
translation:
  language: ar
  text: 'وحين مدّوه بالسيور، قال بولس لقائد المئة الواقف هناك: «أيحلّ لكم أن تجلدوا رجلًا رومانيًا[a] لم يُحكم عليه؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي «مواطنًا رومانيًا». يقول اليوناني حرفيًا «رجلًا رومانيًا»، لكن المقصود في هذا السياق القانوني هو تمتعه بحقوق المواطنة الرومانية.
    reason: lexical_alternative
lexical_decisions:
- source_word: προέτειναν αὐτὸν τοῖς ἱμᾶσιν
  choice: شدّوه بالسيور
  rationale: يفيد الفعل في هذا السياق مدَّ بولس أو شده استعدادًا للجلد، وتشير ἱμᾶσιν إلى السيور الجلدية. وعبارة «شدّوه بالسيور» واضحة وطبيعية وتحفظ الفعل ووسيلته دون إضافة تفاصيل غير مصرّح بها.
- source_word: ἑστῶτα
  choice: الواقف هناك
  rationale: يصف قائد المئة بأنه واقف في الموضع أو حاضر بجوار بولس، و«الواقف هناك» تنقل مشهد الرواية بوضوح.
- source_word: ἑκατόνταρχον
  choice: قائد المئة
  rationale: هذا هو اللقب العسكري الروماني الدقيق والمألوف عربيًا للرتبة التي يدل عليها اللفظ اليوناني.
- source_word: ἄνθρωπον Ῥωμαῖον
  choice: رجلًا رومانيًا
  rationale: يحفظ هذا التعبير ذكر «الرجل» الصريح في اليونانية، مع بقاء دلالة الوضع القانوني الروماني واضحة من السياق ومبيّنة في الحاشية.
- source_word: ἀκατάκριτον
  choice: لم يُحكم عليه
  rationale: يدل اللفظ على شخص لم يصدر عليه حكم قضائي؛ والصياغة العربية موجزة وواضحة وتحفظ الدلالة القانونية.
- source_word: ἔξεστιν ὑμῖν
  choice: أيحلّ لكم
  rationale: السؤال عن الجواز القانوني، و«أيحلّ لكم» تعبير عربي فصيح ومباشر يناسب احتجاج بولس القانوني.
- source_word: μαστίζειν
  choice: أن تجلدوا
  rationale: يدل الفعل على الضرب الشديد بالسوط، و«تجلدوا» هو المقابل العربي الواضح والمناسب للسياق.
