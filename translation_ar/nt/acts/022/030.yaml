id: ACT.22.30
reference: Acts 22:30
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Τῇ δὲ ἐπαύριον βουλόμενος γνῶναι τὸ ἀσφαλὲς τὸ τί κατηγορεῖται ⸀ὑπὸ τῶν Ἰουδαίων ἔλυσεν ⸀αὐτόν, καὶ ἐκέλευσεν ⸀συνελθεῖν τοὺς ἀρχιερεῖς καὶ ⸀πᾶν τὸ ⸀συνέδριον, καὶ καταγαγὼν τὸν Παῦλον ἔστησεν εἰς αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/030.yaml
  text: But on the next day[a], wanting to know for certain what he was being accused of by the Jews, he released him and ordered the chief priests and the whole council to assemble; and bringing Paul down[b], he set him before them.
translation:
  language: ar
  text: وفي الغد، إذ أراد أن يعرف على وجه اليقين ما الذي يتهمه به اليهود[a]، فكَّ قيود بولس، وأمر رؤساء الكهنة والمجلس كله[b] أن يجتمعوا. ثم أنزل بولس وأوقفه أمامهم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «القادة اليهود» أو «اليهوديّون من أهل اليهودية». يرد في اليونانية لفظ «اليهود»، والمقصود في هذا السياق المشتكون على بولس، لا كل يهودي بلا تمييز.'
    reason: lexical_alternative
  - marker: b
    text: «المجلس» هو السنهدريم، أي الهيئة اليهودية الحاكمة في أورشليم.
    reason: cultural_note
lexical_decisions:
- source_word: Τῇ δὲ ἐπαύριον
  choice: وفي الغد
  rationale: تعبير زمني عربي طبيعي ينقل معنى «في اليوم التالي»، والواو تلائم انتقال السرد الذي تؤديه δέ من غير مبالغة في معنى الاستدراك.
- source_word: βουλόμενος γνῶναι τὸ ἀσφαλές
  choice: إذ أراد أن يعرف على وجه اليقين
  rationale: ينقل قصد القائد ومعنى الوصول إلى معرفة مؤكدة أو موثوقة.
- source_word: τὸ τί κατηγορεῖται ὑπὸ τῶν Ἰουδαίων
  choice: ما الذي يتهمه به اليهود
  rationale: صياغة عربية واضحة تحفظ مضمون الاتهام وصراحة لفظ Ἰουδαίων، مع بيان المقصود السياقي في الحاشية.
- source_word: ἔλυσεν αὐτόν
  choice: فكَّ قيود بولس
  rationale: الفعل λύω يعني الحل أو الفك، والسياق يدل على إزالة القيود لا إطلاق بولس من الحراسة الرومانية؛ وإظهار اسم بولس يزيل التباس الضمائر في العربية.
- source_word: ἐκέλευσεν συνελθεῖν
  choice: أمر ... أن يجتمعوا
  rationale: يحفظ معنى الأمر الرسمي والاجتماع المقصود في هذا السياق القضائي.
- source_word: τοὺς ἀρχιερεῖς
  choice: رؤساء الكهنة
  rationale: المقابل العربي المألوف للجمع الذي يشير إلى كبار السلطات الكهنوتية.
- source_word: πᾶν τὸ συνέδριον
  choice: المجلس كله
  rationale: يترجم συνέδριον بوصفه هيئة الحكم اليهودية، ويحفظ πᾶν بلفظ «كله».
- source_word: καταγαγὼν τὸν Παῦλον
  choice: ثم أنزل بولس
  rationale: يحفظ اتجاه الحركة إلى أسفل، ويرجح أن المقصود إنزاله من موضع الثكنة إلى مكان انعقاد المجلس.
- source_word: ἔστησεν εἰς αὐτούς
  choice: وأوقفه أمامهم
  rationale: ينقل معنى جعل بولس يقف في حضرتهم بصفته معروضًا أمام المجلس.
theological_decisions:
- issue: دلالة Ἰουδαίων في سياق سفر الأعمال
  choice: اليهود
  alternative: القادة اليهود؛ أو اليهوديّون من أهل اليهودية
  rationale: أُبقي اللفظ الصريح في اليونانية من دون تضييق تفسيري داخل المتن، مع توضيح أن السياق يقصد المشتكين على بولس لا كل يهودي بلا تمييز.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. وُضعت علامتا الحاشيتين بعد اللفظين اللذين تشرحهما الحاشيتان مباشرة. قُسّمت الجملة الطويلة إلى جملتين لتيسير القراءة من غير تغيير تسلسل الأفعال.
