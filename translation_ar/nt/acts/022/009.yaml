  text: οἱ δὲ σὺν ἐμοὶ ὄντες τὸ μὲν φῶς ⸀ἐθεάσαντο τὴν δὲ φωνὴν οὐκ ἤκουσαν τοῦ λαλοῦντός μοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/009.yaml
  text: Those who were with me saw the light[a], but they did not hear the voice of the one speaking to me.
translation:
  language: ar
  text: وأمّا الذين كانوا معي فرأوا النور، لكنهم لم يسمعوا صوتَ مَن كان يكلّمني.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لم يفهموا الصوت». قارن أعمال الرسل 9:7، حيث يُقال إن رفاق بولس سمعوا الصوت؛ وقد يكون المقصود أنهم سمعوا صوتًا، لكنهم لم يفهموا كلام المتكلم.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ σὺν ἐμοὶ ὄντες
  choice: وأمّا الذين كانوا معي
  rationale: صياغة عربية طبيعية تحفظ البناء الاسمي، وتُظهر المقابلة التي تنشئها δέ مع μέν...δέ، من غير إضافة «الرجال» غير المذكورة صراحة.
- source_word: τὸ μὲν φῶς
  choice: النور
  rationale: ترجمة مباشرة لـφῶς، أمّا المقابلة التي تفيدها μέν فتظهر في «وأمّا... لكنهم»؛ ولم تُضف صفة «الساطع» لأنها غير واردة في هذه الآية.
- source_word: ἐθεάσαντο
  choice: فرأوا
  rationale: تنقل معنى المعاينة بعبارة عربية واضحة وطبيعية، من غير إيحاء بضرورة تعمّد النظر.
- source_word: τὴν δὲ φωνὴν
  choice: صوتَ
  rationale: يمكن أن تعني φωνή «صوتًا» أو «صوت متكلم»، والسياق يحدد متكلمًا شخصيًا في العبارة التالية؛ و«صوت» في العربية يحفظ هذا الاتساع الدلالي.
- source_word: οὐκ ἤκουσαν
  choice: لم يسمعوا
  rationale: يحفظ المعنى المباشر المعتاد للفعل ἀκούω، مع إبقاء احتمال «لم يفهموا» في الحاشية بدل إدخاله تفسيرًا في المتن.
- source_word: τοῦ λαλοῦντός μοι
  choice: الذي كان يكلّمني
  rationale: يحفظ دلالة اسم الفاعل الحاضر على الفعل الجاري آنذاك، ويبيّن بوضوح أن الصوت هو صوت المتكلم إلى بولس.
theological_decisions:
- issue: التوتر الظاهري مع أعمال الرسل 9:7 بشأن سماع رفاق بولس للصوت
  choice: الإبقاء في المتن على «لم يسمعوا صوتَ الذي كان يكلّمني»
  alternative: «لم يفهموا الصوت» أو أنهم سمعوا صوتًا دون أن يفهموا كلام المتكلم
  rationale: المعنى المباشر للعبارة اليونانية هنا هو عدم سماع صوت المتكلم، لكن المجال الدلالي لـἀκούω وφωνή يسمح باحتمال التمييز بين سماع صوت وفهم الكلام. لذلك يُحفظ ظاهر النص والتوتر في المتن، ويُذكر الاحتمال التفسيري في الحاشية دون فرض مصالحة صامتة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُخدم «وأمّا... لكن» لإبراز المقابلة في μέν...δέ، مع تجنب الألفاظ القديمة مثل «عاينوا» أو «أبصروا» حين لا تدعو الحاجة.
