  language: ar
  text: لأنك ستكون شاهدًا له[a] أمام جميع الناس بما رأيت وسمعت.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «شاهدًا بشأنه». فالضمير اليوناني في صيغة الداتيف، وقد يدل هنا على الشخص الذي تتعلق به الشهادة أو الذي تُؤدّى من أجله.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: لأنك
  rationale: تؤدي «لأن» القوة التفسيرية التي تحملها ὅτι في سياق التكليف، وتربط القول بما سبقه ربطًا طبيعيًا.
- source_word: ἔσῃ μάρτυς
  choice: ستكون شاهدًا
  rationale: تنقل صيغة المستقبل البسيط، وتحافظ على معنى مَن يشهد بما عاينه وسمعه.
- source_word: αὐτῷ
  choice: له
  rationale: تحافظ «له» على مرجع الضمير وعلى سعة دلالة المجرور اليوناني، إذ قد تفيد الشهادة لأجله أو من جهته دون زيادة تفسيرية.
- source_word: πρὸς πάντας ἀνθρώπους
  choice: أمام جميع الناس
  rationale: تلائم مقام أداء الشهادة للناس، وتنقل ἀνθρώπους بمعناها العام الشامل للبشر لا بمعنى خاص بالذكور.
- source_word: ὧν ἑώρακας καὶ ἤκουσας
  choice: بما رأيت وسمعت
  rationale: صياغة عربية موجزة وطبيعية تجعل المرئي والمسموع مضمون الشهادة، مع إبقاء الفعلين متوازيين كما في المصدر.
theological_decisions:
- issue: دلالة αὐτῷ في تكليف بولس
  choice: له
  alternative: إليه
  rationale: 'يفهم السياق الضمير على أنه عائد إلى الرب/يسوع، لكن «له» لا تحسم أكثر مما يحسمه التركيب اليوناني نوع العلاقة النحوية الدقيقة: الشهادة لأجله أو من جهته، بينما «إليه» قد توهم أن الشهادة موجَّهة إليه شخصيًا.'
translation_notes:
  register: فصحى معاصرة واضحة ومهيبة؛ استُعملت «الناس» للدلالة العامة على البشر، وجاءت العبارة موجزة بما يناسب خطاب التكليف.
