  text: وبينما كنت أسير وأقترب من دمشق، نحو الظهر، أشرق فجأةً حولي نور شديد من السماء،
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγένετο δέ μοι
  choice: وحدث
  rationale: صياغة سردية عربية طبيعية تنقل وقوع الحدث وقوة δέ الرابطة الخفيفة، مع استيعاب ضمير المتكلم في الجملة التابعة دون ترجمة حرفية ثقيلة لـμοι.
- source_word: πορευομένῳ καὶ ἐγγίζοντι τῇ Δαμασκῷ
  choice: بينما كنت سائرًا وأقترب من دمشق
  rationale: تنقل اسمَي الفاعل الدالَّين على فعلين مستمرين ومتزامنين، وتحافظ على معنى الاقتراب من الوجهة.
- source_word: περὶ μεσημβρίαν
  choice: نحو الظهر
  rationale: تعبير عربي واضح ينقل تقريب الزمن في περὶ ومعنى منتصف النهار.
- source_word: ἐξαίφνης
  choice: فجأة
  rationale: ينقل مباغتة الحدث بوضوح وإيجاز.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: من السماء
  rationale: يحافظ على دلالة المصدر العلوي، بما فيها الإيحاء السماوي في سياق الرؤيا، دون اختزالها في معنى جوي محض.
- source_word: περιαστράψαι
  choice: سطع ... حولي
  rationale: ينقل إشراق الضوء المحيط ببولس؛ ويساعد الظرف «فجأة» على إظهار اللمعان المباغت الذي يحمله السياق وصيغة الفعل.
- source_word: φῶς ἱκανὸν
  choice: نور شديد
  rationale: يعبر تعبيرًا عربيًا طبيعيًا عن مقدار الضوء أو شدته، مع إبقاء احتمال معنى العظمة في الحاشية.
theological_decisions:
- issue: دلالة οὐρανός في ἐκ τοῦ οὐρανοῦ
  choice: من السماء
  alternative: من الجو
  rationale: «السماء» أنسب لسياق اللقاء الإعلاني في سفر الأعمال وتحفظ احتمال المصدر المتعالي، من غير إضافة تقرير عقائدي غير مصرح به.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة سردية كريمة. حوفظ على تتابع السفر والاقتراب، وعلى كون النور صادرًا من السماء ومحيطًا بالمتكلم، مع تجنب صياغة حرفية ثقيلة.
