  text: καὶ ὅτε ⸀ἐξεχύννετο τὸ αἷμα Στεφάνου τοῦ μάρτυρός σου, καὶ αὐτὸς ἤμην ἐφεστὼς καὶ συνευδοκῶν ⸀καὶ φυλάσσων τὰ ἱμάτια τῶν ἀναιρούντων αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/020.yaml
  text: And when the blood of Stephen your witness was being poured out[a], I myself was standing by and approving, and guarding the cloaks of those who were killing him.
translation:
  language: ar
  text: وحين كان دمُ إسطفانوس، شاهدِك[a]، يُسفك، كنتُ أنا نفسي واقفًا هناك، موافقًا، وحارسًا ثيابَ الذين كانوا يقتلونه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «شهيدك». اللفظة اليونانية تعني «شاهدًا»، ثم ارتبطت في الاستعمال المسيحي على نحو خاص بمن يموت بسبب شهادته.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεχύννετο
  choice: كان يُسفك
  rationale: صيغة الماضي الناقص المبني للمجهول تدل على حدث جارٍ في الماضي. و«يُسفك» تعبير عربي طبيعي خاص بالدم، ويحفظ صورة إراقته دون تكلف حرفي.
- source_word: αἷμα
  choice: دم
  rationale: المقابل العربي المباشر والمعتاد، ولا يقتضي السياق شرحًا أو إعادة صياغة.
- source_word: μάρτυρός
  choice: شاهدك
  rationale: المعنى المعجمي الأساسي هو «شاهد». أما دلالة «الشهيد» فقد ارتبطت لاحقًا بمن يموت بسبب شهادته؛ لذا حُفظت في الحاشية دون إحلالها محل المعنى الأساسي في المتن.
- source_word: ἐφεστὼς
  choice: واقفًا هناك
  rationale: يفيد وجود بولس في المكان ووقوفه قريبًا من الحدث. وهذه صياغة عربية واضحة لا توحي بأنه كان محايدًا، ولا تضيف دورًا غير مصرّح به.
- source_word: συνευδοκῶν
  choice: موافقًا
  rationale: يدل على الموافقة والرضا بالفعل. و«موافقًا» طبيعية في العربية وتحفظ مسؤوليته الأخلاقية، ولا تضع مفعولًا مقدرًا غير لازم.
- source_word: φυλάσσων
  choice: حارسًا
  rationale: يناسب الفعل الملموس المتعلق بحفظ ثياب المنفذين ومراقبتها.
- source_word: ἱμάτια
  choice: ثياب
  rationale: مقابل عربي طبيعي يشمل الملابس الخارجية التي خلعها القائمون بالرجم، من غير تخصيص يتجاوز اللفظ اليوناني.
- source_word: ἀναιρούντων
  choice: كانوا يقتلونه
  rationale: الفعل هنا يعني إزهاق الحياة أو القتل. والصياغة لا تضيف توصيفًا قانونيًا أو أخلاقيًا مثل «يغتالونه» أو «يقتلونه ظلمًا»، مع إبراز استمرار الفعل في المشهد.
- source_word: αὐτὸς
  choice: أنا نفسي
  rationale: يحفظ توكيد الضمير اليوناني ويبرز اعتراف المتكلم بمشاركته الشخصية.
theological_decisions:
- issue: ترجمة μάρτυς في وصف إسطفانوس
  choice: شاهدك
  alternative: شهيدك
  rationale: يحفظ «شاهدك» المعنى المعجمي المباشر وعلاقة إسطفانوس بالشهادة للمسيح، بينما «شهيدك» مفهوم تقليديًا في سياق موته لكنه قد يستبق تطور الدلالة الاصطلاحية. ذُكر البديل في الحاشية لصون التوتر بين المعنى المعجمي والسياق.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حُفظ توكيد «أنا نفسي»، واستُخدم «كان يُسفك» لإظهار الاستمرار في الماضي، وتُركت سلسلة الأحوال كما في بنية الاعتراف اليونانية من غير إضافة تفسير طائفي.
