base_translation:
  language: en
  yaml_path: translation/nt/acts/022/024.yaml
  text: The tribune ordered him to be brought into the barracks[a], saying that he should be examined by scourging[b], so that he might find out for what reason they were shouting against him like this.
translation:
  language: ar
  text: فأمر قائدُ الألف أن يُدخَل بولس إلى الثكنة[a]، وأن يُستجوَب بالسياط[b]، لكي يعرف لأي سبب كانوا يصرخون عليه هكذا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «المعسكر» أو «الحصن». والمقصود هنا مقر الجنود الرومان في أورشليم.
    reason: cultural_note
  - marker: b
    text: أي أن يُستجوَب تحت الجلد. يجمع التعبير اليوناني بين الاستجواب والوسيلة الصريحة، وهي الجلد بالسياط.
    reason: lexical_alternative
lexical_decisions:
- source_word: χιλίαρχος
  choice: قائد الألف
  rationale: لقب عسكري روماني لضابط كبير؛ تحافظ الترجمة على دلالة اللقب اليوناني التاريخية، وهي أوضح للقارئ العربي من نقل اللقب الروماني بصيغة معرَّبة غير مألوفة.
- source_word: παρεμβολή
  choice: الثكنة
  rationale: يشير اللفظ في سياق أورشليم إلى مقر الجنود الرومان، و«الثكنة» تعبير عربي طبيعي ودقيق وظيفيًا.
- source_word: εἰσάγεσθαι αὐτὸν
  choice: أن يُدخَل بولس
  rationale: يحافظ البناء للمجهول على كون آخرين هم الذين اقتادوه إلى الداخل، وذُكر الاسم لتفادي غموض الضمير في العربية.
- source_word: εἴπας
  choice: وقال
  rationale: ينقل اسم الفاعل اليوناني الذي يقدم مضمون الأمر، بصياغة عربية متتابعة وطبيعية.
- source_word: μάστιξιν
  choice: بالجلد
  rationale: صيغة الداتيف تحدد وسيلة الاستجواب، واللفظ يدل على ضرب شديد بالسياط.
- source_word: ἀνετάζεσθαι
  choice: يُستجوَب
  rationale: المعنى هنا فحص أو استنطاق، ويحدد «بالجلد» الوسيلة القسرية المصرح بها في اليونانية.
- source_word: ἐπιγνῷ
  choice: ليعرف
  rationale: تفيد جملة الغاية قصد القائد اكتشاف سبب صياح الجمع.
- source_word: δι’ ἣν αἰτίαν
  choice: لأي سبب
  rationale: ينقل معنى السبب دون افتراض تهمة قانونية رسمية لا يصرح بها النص.
- source_word: οὕτως
  choice: هكذا
  rationale: تحافظ على القوة الإشارية للظرف وتصف كيفية صياحهم.
- source_word: ἐπεφώνουν αὐτῷ
  choice: كانوا يصرخون عليه
  rationale: الماضي المستمر يعكس دلالة الناقص على الصياح المتواصل، و«عليه» تنقل اتجاه العداء في السياق.
