review_pass:
  verdict: revise
  source_fidelity: 'المعنى الأساسي منقول بدقة: القائد نال المواطنة مقابل مبلغ كبير، وبولس يعلن أن مواطنته بالولادة. لكن الصياغة الحالية لا تُظهر بوضوح قيمة καί التأكيدية في جواب بولس، كما أن الحاشية (ج) تكرر ما تقوله العبارة والحاشية (ب).'
  naturalness: «قائد الكتيبة» مفهوم، لكن «القائد العسكري» أوضح وأقل إيحاءً برتبة عسكرية حديثة محددة. و«وُلدتُ مواطنًا» أفصح وأسلس من «وُلدتُ بها» مع إبقاء المقصود القانوني واضحًا.
  terminology: «المواطنة» مناسبة لـ πολιτεία في هذا السياق القانوني. واستُخدم «القائد العسكري» للنقل الواضح للقب χιλίαρχος، مع إتاحة «التريبون العسكري» في الحاشية بوصفه البديل التاريخي الأدق.
  issues:
  - severity: medium
    issue: قيمة καί في جواب بولس غير ممثلة بوضوح في المتن.
    rationale: «أما أنا» تنقل المقابلة التي يبرزها δέ، لكنها لا تنقل وحدها التأكيد في καὶ γεγέννημαι. أضيف «بالفعل» بوصفها مقابلاً عربيًا طبيعيًا للتأكيد، من دون الادعاء بأن النص يصرح بتفصيل زائد.
  - severity: low
    issue: الحاشية (ج) زائدة، والحاشية (ب) موضوعة على فعل القول لا على العبارة التي تشرحها.
    rationale: المتن المنقح يصرح بـ«مواطنًا»، فلا حاجة إلى حاشية تفسيرية ثانية. ونُقل مرساة الحاشية المعجمية إلى كلمة «مواطنًا».
  - severity: low
    issue: الحاشية التاريخية تصف الوظيفة كأنها قيادة فعلية لنحو ألف جندي.
    rationale: χίλιαρχος لقب عسكري، وفي هذا السياق تريبون روماني؛ لذلك تُصاغ الحاشية بوصفها تعريفًا تاريخيًا للقب من غير تقرير حجم قيادة محدد.
