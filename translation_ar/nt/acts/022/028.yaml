base_translation:
  language: en
  yaml_path: translation/nt/acts/022/028.yaml
  text: But the tribune answered[a], “I acquired this citizenship for a large sum.” But Paul said[b], “But I was even born with it.”
translation:
  language: ar
  text: 'فأجاب القائد العسكري[a]: «حصلتُ على هذه المواطنة بمبلغ كبير». فقال بولس: «أما أنا، فقد وُلدتُ مواطنًا[b] بالفعل».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «التريبون العسكري»، وهو لقب لضابط روماني.'
    reason: historical_clarification
  - marker: b
    text: 'حرفيًا: «أما أنا فقد وُلدتُ أيضًا»، والمواطنة مفهومة من السياق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χιλίαρχος
  choice: قائد الكتيبة
  rationale: لقب لضابط روماني كان يقود وحدة تقارب ألف جندي؛ «قائد الكتيبة» أوضح للقارئ العربي من نقل اللقب الروماني حرفيًا، مع الحفاظ على رتبته العسكرية التقريبية.
- source_word: πολλοῦ κεφαλαίου
  choice: بمبلغ كبير
  rationale: العبارة تفيد كلفة مالية كبيرة، وهذه صياغة عربية طبيعية لا تزيد على دلالة الأصل بتصريح الشراء.
- source_word: πολιτείαν
  choice: المواطنة
  rationale: يدل اللفظ هنا على الوضع القانوني للمواطنة الرومانية، لا على السلوك المدني أو الحياة السياسية.
- source_word: ἐκτησάμην
  choice: حصلتُ على
  rationale: يحافظ على المعنى العام للاكتساب أو التحصيل، من غير تخصيص الكيفية بالفعل «اشتريتُ» مع أن ذكر المبلغ يوحي بها.
- source_word: καὶ γεγέννημαι
  choice: أما أنا فقد وُلدتُ بها
  rationale: ينقل الولادة مع امتلاك المواطنة منذ الميلاد، ويجعل المرجع المفهوم من السياق صريحًا في عربية طبيعية؛ وتؤدي «أما أنا» وظيفة المقابلة المؤكدة.
- source_word: δέ
  choice: فـ / أما
  rationale: 'تتغير الصياغة بحسب موقعها: الفاء تصل الحوار، و«أما» تبرز المقابلة بين اكتساب القائد للمواطنة وامتلاك بولس لها بالولادة.'
- source_word: ἔφη
  choice: فقال
  rationale: ترجمة مباشرة وطبيعية لفعل القول من دون إضافة قوة خطابية غير موجودة.
