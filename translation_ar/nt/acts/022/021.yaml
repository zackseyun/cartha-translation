  text: καὶ εἶπεν πρός με· Πορεύου, ὅτι ἐγὼ εἰς ἔθνη μακρὰν ἐξαποστελῶ σε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/021.yaml
  text: And he said to me[a], ‘Go, because I will send you far away to the Gentiles.’
translation:
  language: ar
  text: 'فقال لي: «اذهب، فإني سأرسلك بعيدًا إلى الأمم[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: غير اليهود.'
    reason: توضيح الدلالة السياقية المحتملة لـἔθνη مع الحفاظ على «الأمم» في المتن.
lexical_decisions:
- source_word: εἶπεν πρός με
  choice: فقال لي
  rationale: ينقل فعل القول مع πρός وصيغة المخاطَب المباشر بعبارة عربية طبيعية، وتحافظ الفاء على اتصال الحدث بالسياق السابق.
- source_word: Πορεύου
  choice: اذهب
  rationale: أمر مباشر واضح يعبّر طبيعيًا عن صيغة الأمر من πορεύομαι دون زيادة معنى غير مصرّح به.
- source_word: ὅτι
  choice: فإني
  rationale: تفيد الفاء مع «إنّ» التعليل، فتبيّن أن الإرسال الآتي هو سبب الأمر بالذهاب، بأسلوب عربي فصيح وطبيعي.
- source_word: ἐγὼ
  choice: إني
  rationale: الضمير المتصل في «إني» يعبّر عن المتكلم، وتساعد «إنّ» في إبراز التوكيد الذي يحمله الضمير اليوناني الصريح.
- source_word: εἰς ἔθνη
  choice: إلى الأمم
  rationale: «الأمم» مقابل عربي راسخ وشفاف لـἔθνη، ويمكن في هذا السياق أن يدل على غير اليهود، مع إبقاء هذا التفسير في الحاشية بدل حصر اللفظ في المتن.
- source_word: μακρὰν
  choice: بعيدًا
  rationale: يحفظ دلالة البعد المكانية في صياغة عربية موجزة، مع إبقاء تعلق الظرف بالإرسال كما في اليونانية.
- source_word: ἐξαποστελῶ
  choice: سأرسلك
  rationale: ينقل صيغة المستقبل ومعنى الإرسال بوضوح، ولا يضيف معنى التكليف أو التفويض صراحةً حيث لا يلزم.
- source_word: σε
  choice: الكاف في «سأرسلك»
  rationale: تنقل ضمير المخاطب المفرد بوصفه مفعول فعل الإرسال.
theological_decisions:
- issue: دلالة ἔθνη في سياق رسالة بولس
  choice: الأمم
  alternative: غير اليهود
  rationale: اللفظ اليوناني يمكن أن يعني «الأمم» عمومًا، ويشير في هذا السياق على الأرجح إلى الشعوب غير اليهودية. اختيار «الأمم» يحفظ المقابل اللفظي واتساع الدلالة، بينما توضّح الحاشية المعنى السياقي دون أن تحسم في المتن أكثر مما يحسمه الأصل.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقّرة، مع إيقاع سردي موجز. استُخدمت علامات الاقتباس العربية، وحُفظ التعليل والتوكيد من غير إثقال العبارة.
