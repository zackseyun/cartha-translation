    rationale: النص اليوناني يذكر «مجد/بهاء ذلك النور» سببًا للعجز عن الإبصار، لكنه لا يصرح باسم «الشدة». حذفها يحافظ على الدلالة السببية دون إضافة وصفية.
  - severity: medium
