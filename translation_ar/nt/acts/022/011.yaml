source:
  edition: SBLGNT
  text: ὡς δὲ οὐκ ἐνέβλεπον ἀπὸ τῆς δόξης τοῦ φωτὸς ἐκείνου, χειραγωγούμενος ὑπὸ τῶν συνόντων μοι ἦλθον εἰς Δαμασκόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/011.yaml
  text: And since I could not see because of the brightness of that light[a], I came into Damascus being led by the hand by those who were with me.
translation:
  language: ar
  text: ولأنني لم أكن أستطيع أن أرى بسبب بهاء ذلك النور[a]، جئت إلى دمشق يقودني بيدي الذين كانوا معي.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بحرفية أكثر: «من مجد ذلك النور».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνέβλεπον
  choice: أستطيع أن أرى
  rationale: يفيد الفعل في السياق القدرة على الإبصار، لا مجرد التحديق؛ والنفي مع صيغة الماضي الناقص يدل على استمرار العجز عن الرؤية.
- source_word: ἀπὸ τῆς δόξης τοῦ φωτὸς ἐκείνου
  choice: من شدة بهاء ذلك النور
  rationale: تنقل «بهاء» الإشعاع المرئي الذي سبّب العمى، وتحفظ في الوقت نفسه مسحة δόξα الأرفع من مجرد السطوع؛ وتوضح «شدة» العلاقة السببية طبيعيًا بالعربية.
- source_word: χειραγωγούμενος
  choice: قادني ... بيدي
  rationale: يحفظ الصورة الصريحة للقيادة باليد بصياغة عربية طبيعية، ويبيّن اعتماد المتكلم على مرافقيه بسبب عجزه عن الرؤية.
- source_word: ὑπὸ τῶν συνόντων μοι
  choice: الذين كانوا معي
  rationale: ترجمة شفافة لا تفترض وصفًا رسميًا للجماعة مثل «رفاقي».
- source_word: ἦλθον εἰς Δαμασκόν
  choice: جئت إلى دمشق
  rationale: صياغة عربية مألوفة تنقل الحركة نحو المدينة من غير تكلف في تمثيل حرف الجر εἰς.
- source_word: ὡς δὲ
  choice: ولأنني
  rationale: يناسب السياق الذي يجعل عدم القدرة على الرؤية سببًا لقيادته باليد، مع وصل السرد بالواو.
theological_decisions:
- issue: ترجمة δόξα في سياق نور ذي طابع ظهور إلهي
  choice: بهاء
  alternative: مجد
  rationale: «بهاء» يحفظ معنى الإشراق المرئي المباشر من غير إلغاء الإيحاء الرفيع للكلمة، بينما «مجد» قد يُفهم هنا فهمًا تجريديًا أكثر مما يقتضيه سبب العمى في الجملة.
translation_notes:
  register: العربية فصحى معاصرة واضحة ووقورة. وُضع دليل الحاشية بعد الجملة، مع الحفاظ على صورة القيادة باليد وعلى العلاقة السببية في السياق.
