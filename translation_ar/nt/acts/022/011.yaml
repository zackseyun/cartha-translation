    rationale: في «قادني الذين كانوا معي بيدي» قد يضعف وضوح أن المرافقين هم الذين قادوه ممسكين بيده. «يقودني بيدي الذين كانوا معي» أوضح وأقرب إلى الأسلوب العربي مع حفظ تفصيل χειραγωγούμενος.
