- from: ولأنني لم أكن أستطيع أن أرى من شدة بهاء ذلك النور، قادني الذين كانوا معي بيدي حتى جئت إلى دمشق.[a]
  to: ولأنني لم أكن أستطيع أن أرى بسبب بهاء ذلك النور[a]، جئت إلى دمشق يقودني بيدي الذين كانوا معي.
  rationale: حُذفت الزيادة التفسيرية «شدة»، ونُظمت عبارة القيادة لتدل بوضوح على أن الذين كانوا مع بولس قادوه بيده، مع الإبقاء على العلاقة السببية، وعلى «بهاء» بوصفه المقابل السياقي الطبيعي لـ δόξα، وعلى بديل «مجد» في الحاشية.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:21:29Z'
review_pass:
  verdict: revise
  source_fidelity: 'المعنى العام محفوظ: العجز عن الإبصار ناتج من إشعاع النور، والوصول إلى دمشق تمّ بمعونة الذين كانوا مع المتكلم. لكن «من شدة» تزيد عنصرًا صريحًا من الشدة لا يورده النص، وتركيب القيادة يحتاج إلى ترتيب عربي أوضح يحافظ على صورة القيادة باليد.'
