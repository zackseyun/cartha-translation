  terminology: «بهاء ذلك النور» مناسب لـ δόξης τοῦ φωτὸς ἐκείνου في هذا السياق المرئي، والحاشية تحفظ البديل الحرفي «مجد». و«دمشق» و«الذين كانوا معي» سليمتان.
  issues:
