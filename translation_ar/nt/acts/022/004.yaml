  rationale: لفظة ὁδός تعني حرفيًا «طريق»، وتُستعمل في سفر الأعمال أيضًا تسميةً للحركة المسيحية. يحافظ التعبير الحرفي الطبيعي في العربية على هذا الاستعمال ذي الدلالة الخاصة من غير استبداله بتفسير صريح.
- source_word: ἐδίωξα
  choice: اضطهدتُ
  rationale: الفعل هنا يدل على الملاحقة العدائية للمؤمنين، ولذلك ينقل «اضطهدتُ» معناه السياقي بوضوح.
- source_word: ἄχρι θανάτου
  choice: حتى الموت
  rationale: يحفظ العبارة اليونانية الموجزة وما فيها من بيان للمدى القاتل للاضطهاد، من غير الجزم بأن بولس قتل أشخاصًا بيده.
- source_word: δεσμεύων
  choice: مقيِّدًا
  rationale: ينقل الصورة الحسية للفعل الذي يعني التقييد، بدل تحويلها إلى التعبير التفسيري الأعم «معتقلًا».
- source_word: παραδιδοὺς
  choice: مسلِّمًا إياهم
  rationale: يدل في السياق على تسليم الأشخاص إلى الحبس أو إلى السلطات؛ وإضافة الضمير تجعل التركيب العربي واضحًا من غير زيادة معنوية.
- source_word: εἰς φυλακὰς
  choice: إلى السجون
  rationale: يحافظ على جمع φυλακάς وعلى معنى الحركة نحو أماكن الحبس الذي تفيده εἰς.
- source_word: ἄνδρας τε καὶ γυναῖκας
  choice: رجالًا ونساءً
  rationale: يحفظ التصريح بشمول الاضطهاد للرجال والنساء، بصياغة عربية طبيعية وموجزة.
theological_decisions:
- issue: هل تُترجم ἡ ὁδός اسمًا عامًا أم تسميةً شبه اصطلاحية للحركة المسيحية؟
  choice: هذه الطريق
  alternative: هذا المذهب / هذه الحركة
  rationale: يستعمل سفر الأعمال «الطريق» تسميةً معروفة للإيمان أو الجماعة المسيحية. والإبقاء على اللفظ الأصلي يحفظ التلميح الاصطلاحي من غير إدخال مصطلح كنسي لاحق أو تفسير يزيل صورة «الطريق».
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ووقورة. استُعملت «هذه الطريق» بالتأنيث وفق الاستعمال العربي، مع الحفاظ على دلالتها المحتملة بوصفها اسمًا للحركة المسيحية. وُضع marker الحاشية [a] بعد «الموت»، ولا توجد حاجة إلى حاشية ثانية لأن الجمع «السجون» منقول مباشرة بوضوح.
