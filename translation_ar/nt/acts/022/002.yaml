    reason: alternative_reading
lexical_decisions:
- source_word: Ἀκούσαντες δὲ
  choice: فلما سمعوا
  rationale: تؤدي صيغة «فلما» معنى الظرف الزمني في اسم الفاعل الأوريستي، وتصل الحدث بما قبله طبيعيًا؛ وتغني الفاء السياقية عن ترجمة δὲ بأداة استدراك ثقيلة.
- source_word: τῇ Ἑβραΐδι διαλέκτῳ
  choice: باللغة العبرية
  rationale: يحافظ هذا على الدلالة الصريحة للفظ اليوناني، مع بيان احتمال الإشارة إلى الآرامية في الحاشية.
- source_word: προσεφώνει αὐτοῖς
  choice: يخاطبهم
  rationale: فعل عربي طبيعي يدل على كلام موجَّه إلى الجمهور، ويؤدي الاستمرار الذي في صيغة الماضي الناقص ضمن تركيب «أنه يخاطبهم».
- source_word: μᾶλλον παρέσχον ἡσυχίαν
  choice: ازدادوا هدوءًا
  rationale: صياغة عربية واضحة وطبيعية تؤدي اصطلاح «أبدوا/أتاحوا سكونًا أكثر» وتحفظ قوة المقارنة في μᾶλλον.
- source_word: καὶ φησίν
  choice: 'فقال:'
  rationale: يُنقل المضارع التاريخي بصيغة الماضي الملائمة للسرد العربي، وتدل النقطتان على بدء خطاب بولس.
theological_decisions:
- issue: المقصود بعبارة «اللغة العبرية»
  choice: إبقاء «العبرية» في المتن
  alternative: فهم العبارة على أنها تشير إلى الآرامية، أي اللسان السامي المحلي في اليهودية
  rationale: النص اليوناني يصرح بلفظ «العبرية»، لذلك يُحفظ في المتن دون حسم المقصود التاريخي، ويُذكر الاحتمال الآخر في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «ازدادوا هدوءًا» بدل ترجمة حرفية من قبيل «قدموا سكونًا أكثر»، وحُفظت «العبرية» في المتن صونًا للغموض التاريخي الأصيل.
