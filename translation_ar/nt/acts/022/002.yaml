  text: 'But when they heard that he was addressing them in the Hebrew language[a], they became even more quiet. And he said:'
translation:
  language: ar
  text: 'فلما سمعوا أنه يخاطبهم باللغة العبرية[a]، ازدادوا هدوءًا. فقال:'
