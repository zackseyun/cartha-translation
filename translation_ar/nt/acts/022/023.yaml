lexical_decisions:
- source_word: κραυγαζόντων
  choice: كانوا يصرخون
  rationale: اسم فاعل مضارع في صيغة الجمع يدل على صراخ جماعي مستمر ومتزامن مع الفعلين التاليين.
- source_word: τε
  choice: و
  rationale: تربط الأفعال المتعاطفة، والواو هي المقابل العربي الطبيعي هنا.
- source_word: αὐτῶν
  choice: واو الجماعة في «كانوا»
  rationale: أُدمج الضمير في تركيب عربي صريح يجعل الجمع فاعلًا للأفعال المتزامنة.
- source_word: ῥιπτούντων
  choice: يلقون
  rationale: يحافظ على المعنى العام للفعل، أي الرمي أو الطرح، من غير أن يحسم هل كانوا يطرحون الثياب عن أجسادهم أم يقذفونها في اضطراب.
- source_word: τὰ ἱμάτια
  choice: ثيابهم
  rationale: «الثياب» مقابل عربي طبيعي واسع الدلالة لـἱμάτια، والإضافة إلى ضمير الجمع مفهومة من السياق اليوناني.
- source_word: κονιορτόν
  choice: التراب
  rationale: يدل اللفظ على الغبار أو التراب الدقيق؛ و«التراب» أنسب مع فعل الذر في هذا المشهد.
- source_word: βαλλόντων
  choice: يذرون
  rationale: ينقل فعل إلقاء التراب في الهواء بعبارة عربية طبيعية، مع تجنب تكرار «يلقون».
- source_word: εἰς τὸν ἀέρα
  choice: في الهواء
  rationale: تعبير عربي مألوف يصور نثر التراب إلى الهواء، مع أن المقابل الحرفي لحرف الجر يمكن أن يكون «إلى».
