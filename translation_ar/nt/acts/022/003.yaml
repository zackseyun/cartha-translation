  rationale: يُحدّد التعديل أن «الصرامة/الدقة» متصلة بالشريعة الأبوية وبمنهج التعليم وفقًا لها، لا بمجرد مقدار عناية المتكلم في التعلّم. وأُبقيت بقية الألفاظ والحواشي لأنها أمينة للنص اليوناني وطبيعية في العربية الفصحى الحديثة.
