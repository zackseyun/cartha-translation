reference: Acts 22:3
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ⸀Ἐγώ εἰμι ἀνὴρ Ἰουδαῖος, γεγεννημένος ἐν Ταρσῷ τῆς Κιλικίας, ἀνατεθραμμένος δὲ ἐν τῇ πόλει ταύτῃ παρὰ τοὺς πόδας Γαμαλιήλ, πεπαιδευμένος κατὰ ἀκρίβειαν τοῦ πατρῴου νόμου, ζηλωτὴς ὑπάρχων τοῦ θεοῦ καθὼς πάντες ὑμεῖς ἐστε σήμερον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/003.yaml
  text: I am a Jewish man[a], born in Tarsus of Cilicia, but brought up in this city at the feet of Gamaliel, educated according to the strictness of the law of our fathers[b], being zealous for God just as all of you are today.
translation:
  language: ar
  text: «أنا رجل يهودي، وُلدتُ في طرسوس بكيليكية، لكنني نشأتُ في هذه المدينة عند قدمي غمالائيل[a]، وتلقّيتُ تعليمًا وفقًا لصرامة شريعة آبائنا[b]، وكنتُ غيورًا لله، كما أنتم جميعًا اليوم.»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: تعبير «عند قدمي غمالائيل» يعني أنه تلقّى التعليم والتدريب على يده بوصفه معلّمًا.
    reason: cultural_note
  - marker: b
    text: 'يمكن ترجمتها أيضًا: «الشريعة الموروثة عن الآباء».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ Ἰουδαῖος
  choice: رجل يهودي
  rationale: يحفظ دلالة ἀνήρ على الرجل البالغ ودلالة Ἰουδαῖος على انتمائه اليهودي، بصياغة عربية واضحة وطبيعية.
- source_word: γεγεννημένος ἐν Ταρσῷ τῆς Κιλικίας
  choice: وُلدت في طرسوس بكيليكية
  rationale: ينقل معنى الولادة نقلًا طبيعيًا، ويبيّن موقع طرسوس في إقليم كيليكية دون إثقال العبارة.
- source_word: ἀνατεθραμμένος δὲ ἐν τῇ πόλει ταύτῃ
  choice: لكنني نشأت في هذه المدينة
  rationale: الفعل يدل هنا على النشأة والتربية، و«لكن» تُبرز المقابلة بين مكان الولادة ومكان النشأة.
- source_word: παρὰ τοὺς πόδας Γαμαλιήλ
  choice: عند قدمي غمالائيل
  rationale: يحفظ الصورة الحسية للتلميذ الجالس عند قدمي معلّمه، وهي عبارة مفهومة مع إيضاحها في الحاشية.
- source_word: πεπαιδευμένος κατὰ ἀκρίβειαν τοῦ πατρῴου νόμου
  choice: وتعلّمت شريعة آبائنا بكل دقة
  rationale: «تعلّمت» تلائم سياق التكوين والتعليم، و«بكل دقة» تنقل ἀκρίβεια بوضوح، بينما تعبّر «شريعة آبائنا» عن التراث المشترك الذي يستحضره بولس أمام سامعيه.
- source_word: ζηλωτὴς ὑπάρχων τοῦ θεοῦ
  choice: وكنت غيورًا لله
  rationale: تنقل معنى الحماسة الدينية الموجّهة نحو الله من غير تحميل اللفظ إيحاءً حزبيًا أو سياسيًا.
- source_word: καθὼς πάντες ὑμεῖς ἐστε σήμερον
  choice: كما أنتم جميعًا اليوم
  rationale: تحفظ المقارنة المباشرة واصطفاف المتكلم الخطابي مع سامعيه في غيرتهم الحاضرة.
theological_decisions:
- issue: دلالة τοῦ πατρῴου νόμου وصلتها بالتراث اليهودي المشترك
  choice: شريعة آبائنا
  alternative: الشريعة الموروثة عن الآباء
  rationale: الصياغة المختارة موجزة وطبيعية، وتحفظ معنى التراث الأبوي وتوافق خطاب بولس الذي يبرز القاسم المشترك بينه وبين سامعيه، من غير فرض قراءة مذهبية.
- issue: الحفاظ على صورة παρὰ τοὺς πόδας Γαμαλιήλ
  choice: عند قدمي غمالائيل
  alternative: على يد غمالائيل
  rationale: يحفظ الاختيار الصورة التعليمية التاريخية في اليونانية، بينما تشرح الحاشية مدلولها الثقافي كيلا تُفهم على أنها مجرد تحديد مكاني.
- issue: مضمون الغيرة في ζηλωτὴς τοῦ θεοῦ
  choice: غيورًا لله
  alternative: شديد التحمس لله
  rationale: «غيورًا لله» تحافظ على قوة اللفظ وعلى إمكان فهم الغيرة بوصفها حماسة وولاء، من غير ربطها تلقائيًا بجماعة سياسية بعينها.
translation_notes:
  register: العربية فصحى حديثة واضحة وذات نبرة وقورة. حُفظت صورة الجلوس عند قدمي المعلّم مع شرحها، واستُخدمت «شريعة آبائنا» لإبراز التراث المشترك في سياق الخطاب. وُضع كل مؤشر حاشية عند العبارة التي يشرحها، مع تصحيح موضع المؤشر المتعلق بغمالائيل قياسًا إلى طبقة الاستشارة الإنجليزية.
