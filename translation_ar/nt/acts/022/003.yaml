  terminology: «رجل يهودي»، «شريعة آبائنا»، و«غيورًا لله» اختيارات سليمة. و«غمالائيل» نقل عربي مستقر للاسم. استُبقيت «شريعة آبائنا» مع حاشية البديل «الشريعة الموروثة عن الآباء».
