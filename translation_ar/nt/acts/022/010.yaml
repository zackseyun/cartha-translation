  text: εἶπον δέ· Τί ποιήσω, κύριε; ὁ δὲ κύριος εἶπεν πρός με· Ἀναστὰς πορεύου εἰς Δαμασκόν, κἀκεῖ σοι λαληθήσεται περὶ πάντων ὧν τέτακταί σοι ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/010.yaml
  text: Then I said[a], ‘What should I do, Lord?’ And the Lord said to me, ‘Get up and go into Damascus[b], and there you will be told about everything that has been appointed for you to do.’
translation:
  language: ar
  text: 'فقلتُ[a]: «ماذا ينبغي لي أن أفعل يا رب؟» فقال لي الرب: «انهض واذهب إلى دمشق، وهناك سيُقال لك كلُّ ما عُيِّن لك أن تفعله[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ماذا أفعل يا رب؟»'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «كل ما كُلِّفت أن تفعله».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί ποιήσω
  choice: ماذا أفعل
  rationale: 'ينقل صيغة المداولة في الماضي المنصوب، وهي طلب توجيه بشأن العمل التالي، بعبارة عربية طبيعية تحتمل معنى: ماذا ينبغي لي أن أفعل؟'
- source_word: κύριε / ὁ ... κύριος
  choice: يا رب / الرب
  rationale: يحافظ على اللقب نفسه في النداء والسرد، وعلى دلالته المسيحانية في سياق رواية ظهور يسوع لشاول.
- source_word: Ἀναστὰς πορεύου
  choice: انهض واذهب
  rationale: 'يؤدي اسم الفاعل الدال على الفعل السابق مع فعل الأمر في تسلسل طبيعي وواضح: النهوض ثم الذهاب.'
- source_word: εἰς Δαμασκόν
  choice: إلى دمشق
  rationale: تعبير عربي طبيعي عن الحركة إلى المدينة؛ ولا تستلزم العربية هنا إضافة «داخل» لإثبات معنى حرف الجر.
- source_word: κἀκεῖ
  choice: وهناك
  rationale: ينقل بإيجاز καὶ ἐκεῖ ويحافظ على الربط المكاني والتتابع.
- source_word: σοι λαληθήσεται
  choice: سيُقال لك
  rationale: يحافظ على المبني للمجهول وصيغة المستقبل، ويؤدي تركيب الفعل مع ضمير المفعول غير المباشر بلغة عربية سليمة.
- source_word: περὶ πάντων ὧν
  choice: كل ما
  rationale: يجمع معنى الحديث المتعلق بجميع الأمور اللاحقة في تركيب عربي موجز وطبيعي، من غير تغيير مدى الشمول.
- source_word: τέτακταί σοι ποιῆσαι
  choice: عُيِّن لك أن تفعله
  rationale: يحافظ على المبني للمجهول وعلى كون الأمر قد تقرر وله أثر قائم، مع إبقاء جهة التعيين غير مصرَّح بها كما في اليونانية.
theological_decisions:
- issue: قوة τέτακταί وعلاقتها بالتوجيه الإلهي ودعوة بولس
  choice: عُيِّن لك أن تفعله
  alternative: كُلِّفت أن تفعله
  rationale: «عُيِّن لك» تبقي معنى أن الأعمال قد حُدِّدت لبولس، من غير تحويل العبارة إلى تصريح أشد بالتكليف المباشر أو إلى صياغة مذهبية عن القضاء السابق.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «انهض» بدل صياغة أقدم مثل «قم»، واحتُفظ بالمبني للمجهول في «سيُقال» و«عُيِّن» لصون عدم التصريح بالفاعل في النص اليوناني.
