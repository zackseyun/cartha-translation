  source_fidelity: 'النص العربي ينقل عناصر اليونانية بدقة: الفورية والاستنتاج في «فابتعد... فورًا»، وتراجع الذين كانوا على وشك إجراء الفحص، وخوف قائد الألف عند إدراكه صفة بولس القانونية كمواطن روماني، وأنه كان قد قيّده. وصياغة «يستجوبوه» مدعومة بالحاشية التي تحفظ معنى الفحص الرسمي والسياق السابق الخاص بالجلد.'
