source:
  edition: SBLGNT
  text: εὐθέως οὖν ἀπέστησαν ἀπ’ αὐτοῦ οἱ μέλλοντες αὐτὸν ἀνετάζειν· καὶ ὁ χιλίαρχος δὲ ἐφοβήθη ἐπιγνοὺς ὅτι Ῥωμαῖός ἐστιν καὶ ὅτι ⸂αὐτὸν ἦν⸃ δεδεκώς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/029.yaml
  text: Therefore those who were about to examine him withdrew from him at once[b][a], and the tribune also became afraid when he realized that he was a Roman citizen and that he had bound him.
translation:
  language: ar
  text: فابتعد عنه فورًا الذين كانوا مزمعين أن يستجوبوه[a]. وخاف قائد الألف[b] أيضًا حين أدرك أنه مواطن روماني، وأنه كان قد قيَّده.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بتحديد أكبر بحسب السياق: «أن يستجوبوه بالجلد». قد يدل الفعل اليوناني على التحقيق الرسمي، وتوضح الآية السابقة الوسيلة التي كانوا سيستخدمونها.'
    reason: lexical_alternative
  - marker: b
    text: أي القائد العسكري الروماني المعروف بلقب «قائد الألف»، وكان يتولى قيادة وحدة عسكرية قوامها الاسمي نحو ألف جندي، وإن كان العدد الفعلي يتفاوت.
    reason: cultural_note
lexical_decisions:
- source_word: εὐθέως οὖν
  choice: فـ... فورًا
  rationale: تنقل الفاء صلة النتيجة والسياق التي تؤديها οὖν، ويعبّر «فورًا» بوضوح عن εὐθέως.
- source_word: ἀπέστησαν ἀπ’ αὐτοῦ
  choice: ابتعد عنه
  rationale: تعبير عربي طبيعي يدل على تراجعهم عنه وتوقفهم عما كانوا مقدمين عليه.
- source_word: οἱ μέλλοντες αὐτὸν ἀνετάζειν
  choice: الذين كانوا مزمعين أن يستجوبوه
  rationale: يحفظ معنى القصد الوشيك في μέλλοντες، ويؤدي الطابع الرسمي للتحقيق في ἀνετάζειν، مع بيان وسيلته المحتملة في الحاشية من سياق الآية السابقة.
- source_word: χιλίαρχος
  choice: قائد الألف
  rationale: يحافظ على اللقب العسكري الروماني المعبَّر عنه حرفيًا في اليونانية، مع حاشية توضح وظيفته التاريخية.
- source_word: ἐφοβήθη
  choice: خاف
  rationale: صياغة عربية موجزة وطبيعية تعبّر عن رد فعله عند إدراك الأمر.
- source_word: ἐπιγνοὺς
  choice: حين أدرك
  rationale: تنقل معنى الوصول إلى معرفة واضحة، وتحفظ العلاقة الزمنية والسببية التي يحملها اسم الفاعل اليوناني.
- source_word: Ῥωμαῖός ἐστιν
  choice: أنه مواطن روماني
  rationale: السياق قانوني ويتعلق بحقوق المواطنة الرومانية، لا بالأصل العرقي فحسب.
- source_word: αὐτὸν ἦν δεδεκώς
  choice: أنه كان قد قيَّده
  rationale: تنقل الصيغة المحيطية الدالة على فعل تمّ وبقيت آثاره قائمة، من غير إضافة معنى سببي غير صريح.
theological_decisions: []
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدم «مزمعين» لإبراز قرب الفعل المقصود مع بقاء الأسلوب كتابيًا مفهومًا، وحُفظ اللقب التاريخي «قائد الألف» مع شرحه في الحاشية.
