  text: προσελθὼν δὲ ὁ χιλίαρχος εἶπεν αὐτῷ· Λέγε μοι, ⸀σὺ Ῥωμαῖος εἶ; ὁ δὲ ἔφη· Ναί.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/027.yaml
  text: So the tribune came up and said to him[a], “Tell me, are you a Roman?” And he said[b], “Yes.”
translation:
  language: ar
  text: 'فتقدَّم قائدُ الكتيبة وقال له: «قل لي، أأنتَ رومانيٌّ؟» فقال: «نعم»[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: مواطن روماني من الناحية القانونية، كما يتضح من سياق الكلام.'
    reason: cultural_note
lexical_decisions:
- source_word: προσελθὼν
  choice: فتقدَّم
  rationale: ينقل حركة القائد نحو بولس قبل مخاطبته بصياغة عربية طبيعية موجزة.
- source_word: δὲ
  choice: فـ
  rationale: تدل هنا على تتابع السرد أكثر من دلالتها على الاستدراك، فناسبتها فاء التعقيب.
- source_word: χιλίαρχος
  choice: قائد الكتيبة
  rationale: المقصود ضابط روماني يتولى قيادة وحدة عسكرية كبيرة؛ وهذه العبارة أوضح للقارئ العربي من التعريب الاصطلاحي «تريبون»، وأدق سياقيًا من «القائد» وحدها.
- source_word: εἶπεν αὐτῷ
  choice: وقال له
  rationale: يحفظ فعل القول والضمير غير المباشر بصياغة عربية مباشرة.
- source_word: Λέγε μοι
  choice: قل لي
  rationale: مقابل عربي طبيعي لصيغة الأمر مع ضمير المتكلم في حالة المجرور الدلالية.
- source_word: σὺ
  choice: أأنتَ
  rationale: إظهار الضمير المنفصل يحافظ على التوكيد الذي يفيده ورود σὺ صراحة في اليونانية.
- source_word: Ῥωμαῖος
  choice: رومانيٌّ
  rationale: صفة مستعملة استعمال الاسم؛ والسياق يبيّن أن المراد الوضع القانوني، أي المواطنة الرومانية، من غير توسيع متن الآية.
- source_word: Ναί
  choice: نعم
  rationale: جواب إثبات مباشر يحافظ على إيجاز الأصل.
theological_decisions: []
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة سردية كريمة. اختير «قائد الكتيبة» لتوضيح الرتبة العسكرية الرومانية من غير استعمال مصطلح معرَّب غامض، وحُفظ توكيد الضمير في السؤال بصيغة «أأنتَ».
