  language: ar
  text: وكان الذين دبَّروا هذه المؤامرة أكثر من أربعين.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλείους τεσσεράκοντα
  choice: أكثر من أربعين
  rationale: تؤدي العبارة المقارنة مع العدد معنى تجاوز الأربعين بوضوح، من غير إضافة اسم غير مذكور صراحة في اليونانية.
- source_word: συνωμοσίαν
  choice: المؤامرة
  rationale: يناسب «المؤامرة» معنى الاتفاق السري المدبَّر، ويحافظ على الدلالة الرسمية للاسم من غير استيراد تفصيل القَسَم من السياق.
- source_word: ποιησάμενοι
  choice: دبَّروا
  rationale: مع «المؤامرة»، الفعل «دبَّروا» تعبير عربي طبيعي عن صنع المؤامرة وتكوينها، ويؤدي معنى اسم الفاعل اليوناني السابق زمنًا للفعل الرئيس.
- source_word: ἦσαν δὲ
  choice: وكان
  rationale: تصل «وكان» الجملة بما قبلها اتصالًا خفيفًا، وتقدم خبر وجود المجموعة بصورة عربية طبيعية.
- source_word: οἱ ταύτην τὴν συνωμοσίαν ποιησάμενοι
  choice: الذين دبَّروا هذه المؤامرة
  rationale: تحافظ الصلة على الوظيفة الاسمية لأداة التعريف مع اسم الفاعل، وتوضح أن العدد وصف للذين قاموا بالمؤامرة.
