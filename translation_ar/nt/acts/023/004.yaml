  language: ar
  text: 'فقال الواقفون بالقرب: «أتشتم رئيس كهنة الله؟»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أتُهين رئيس كهنة الله؟»'
    reason: بديل معجمي للفعل λοιδορεῖς، يبرز معنى الإهانة اللفظية.
lexical_decisions:
- source_word: οἱ δὲ παρεστῶτες
  choice: فقال الواقفون بالقرب منه
  rationale: اسم الفاعل المعرّف مستعمل استعمال الاسم، ويشير إلى الحاضرين الواقفين بجوار بولس. وتعبير «الواقفون بالقرب منه» عربي واضح يحفظ الدلالة المكانية.
- source_word: εἶπαν
  choice: فقال
  rationale: الفعل الماضي البسيط يواصل السرد، وعُطف بالفاء على السياق؛ وجاء مفردًا قبل الفاعل الجمع وفق الأسلوب العربي الفصيح.
- source_word: ἀρχιερέα
  choice: رئيس كهنة
  rationale: يشير اللفظ في هذا السياق إلى صاحب منصب رئيس الكهنة اليهودي، وهذا هو المقابل العربي الاصطلاحي الدقيق.
- source_word: τοῦ θεοῦ
  choice: الله
  rationale: أُضيف «رئيس كهنة» إلى اسم الجلالة في تركيب «رئيس كهنة الله»، بما يحفظ علاقة الإضافة في اليونانية دون زيادة تفسيرية.
- source_word: λοιδορεῖς
  choice: أتشتم
  rationale: الفعل يدل على الإساءة اللفظية والتجريح. و«تشتم» لفظ عربي معاصر واضح يؤدي قوة التوبيخ في السؤال.
theological_decisions:
- issue: دلالة τοῦ θεοῦ في وصف رئيس الكهنة
  choice: رئيس كهنة الله
  alternative: رئيس الكهنة التابع لله
  rationale: تحفظ الإضافة صلة المنصب بالله كما يعبّر عنها النص، من غير أن تفترض إقرارًا إلهيًا بسلوك الشخص نفسه يتجاوز ما تقوله العبارة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حافظت الصياغة على السؤال التوبيخي وعلى الإضافة المباشرة في «رئيس كهنة الله»، واستُعمل «تشتم» لوضوح معنى الإساءة الكلامية لدى القارئ المعاصر.
