  text: ὁ μὲν οὖν χιλίαρχος ἀπέλυσε τὸν ⸀νεανίσκον παραγγείλας μηδενὶ ἐκλαλῆσαι ὅτι ταῦτα ἐνεφάνισας πρὸς ⸀ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/022.yaml
  text: So the commander dismissed the young man[a], instructing him, “Tell no one that you have reported these things to me.”
translation:
  language: ar
  text: 'فصرف القائد الشاب، وأمره قائلًا: «لا تخبر أحدًا بأنك أطلعتني[a] على هذه الأمور».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بأنك أبلغتني بهذه الأمور»، أو: «بأنك أعلمتني بها».'
    reason: lexical_alternative
lexical_decisions:
- source_word: χιλίαρχος
  choice: القائد
  rationale: يشير إلى ضابط روماني رفيع يقود وحدة عسكرية كبيرة. «القائد» واضح وطبيعي في العربية الحديثة من غير إثقال النص بلقب تقني.
- source_word: ἀπέλυσε
  choice: صرف
  rationale: السياق هو إنهاء المقابلة والإذن للشاب بالانصراف، و«صرف» يؤدي هذا المعنى من غير أن يوحي بأنه كان سجينًا أُطلق سراحه.
- source_word: νεανίσκον
  choice: الشاب
  rationale: يدل اللفظ على ذكر صغير السن نسبيًا، و«الشاب» تعبير طبيعي ومحترم يحفظ دلالة العمر من غير مبالغة.
- source_word: παραγγείλας
  choice: أوصاه قائلًا
  rationale: يفيد إعطاء توجيه ملزم. هذه الصياغة عربية سليمة وتُظهر أن الكلام الآتي وصية مباشرة، من غير تشديد زائد في النبرة.
- source_word: μηδενὶ ἐκλαλῆσαι
  choice: لا تخبر أحدًا
  rationale: ينقل النهي عن إفشاء الأمر لأي شخص بصياغة عربية مباشرة وواضحة.
- source_word: ἐνεφάνισας
  choice: أطلعتني
  rationale: الفعل يعني جعل الأمر معلومًا لشخص أو إبلاغه به. «أطلعتني» طبيعي في السياق ويحفظ إمكان معنى الإعلام أو الإبلاغ، وتوضح الحاشية البدائل.
- source_word: ταῦτα
  choice: هذه الأمور
  rationale: يحفظ جمع اسم الإشارة ويشير بوضوح إلى المعلومات التي نقلها الشاب.
- source_word: πρὸς ἐμέ
  choice: أطلعتني
  rationale: أُدمج معنى الاتجاه «إليّ» في تعدية الفعل العربي إلى ضمير المتكلم، وهي الصياغة الطبيعية في العربية.
