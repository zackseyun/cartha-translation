  yaml_path: translation/nt/acts/023/031.yaml
  text: So the soldiers[a], according to what had been ordered them[b], took Paul and brought him by night to Antipatris.
translation:
  language: ar
  text: فأخذ الجنود بولس، وفقًا لما أُمروا به، واقتادوه ليلًا إلى أنتيباتريس.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οἱ μὲν οὖν στρατιῶται
  choice: فأخذ الجنود
  rationale: تؤدي الفاء معنى الاستمرار والنتيجة الذي تفيده οὖν في السياق السردي، أما μέν فتمهّد للمقابلة في الآية التالية ولا يلزم تمثيلها بلفظ مستقل في العربية.
- source_word: κατὰ τὸ διατεταγμένον αὐτοῖς
  choice: وفقًا لما أُمروا به
  rationale: يحافظ التعبير على دلالة اسم المفعول التام المبني للمجهول وعلى كون الأمر قد صدر إليهم من قبل، بصياغة عربية طبيعية.
- source_word: ἀναλαβόντες τὸν Παῦλον
  choice: أخذ الجنود بولس
  rationale: اسم الفاعل الماضي يدل على فعل سابق للفعل الرئيس ومرتبط به؛ وصيغة «أخذ» موجزة ولا تضيف معنى الحراسة أو المرافقة غير المصرح به لفظًا.
- source_word: ἤγαγον
  choice: وجاؤوا به
  rationale: الفعل ἄγω يحتمل الاقتياد والإحضار والمجيء بالشخص إلى وجهة؛ و«جاؤوا به ... إلى» تلائم تحديد المقصد وتتفادى تكرار «أخذوه».
- source_word: διὰ νυκτός
  choice: ليلًا
  rationale: ينقل الظرف العربي معنى وقوع الرحلة أثناء الليل من غير أن يقتضي أنها استغرقت الليل كله.
- source_word: Ἀντιπατρίδα
  choice: أنتيباتريس
  rationale: نقل صوتي لاسم الموضع اليوناني بصيغة عربية واضحة.
theological_decisions: []
translation_notes:
  register: صياغة عربية فصحى معاصرة، واضحة ووقورة، تحافظ على ترتيب الأحداث والعلاقة السردية دون إثقالها بتراكيب حرفية. لا توجد حاجة إلى حاشية نصية أو لاهوتية في هذه الآية.
