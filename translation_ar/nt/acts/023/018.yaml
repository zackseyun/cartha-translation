  text: ὁ μὲν οὖν παραλαβὼν αὐτὸν ἤγαγεν πρὸς τὸν χιλίαρχον καὶ φησίν· Ὁ δέσμιος Παῦλος προσκαλεσάμενός με ἠρώτησεν τοῦτον τὸν ⸀νεανίαν ἀγαγεῖν πρὸς σέ, ἔχοντά τι λαλῆσαί σοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/018.yaml
  text: So he took him and brought him to the commander and said[a], “The prisoner Paul called me to him and asked me to bring this young man to you[b], because he has something to say to you.”
translation:
  language: ar
  text: 'فأخذه الجندي وأحضره إلى القائد[a]، وقال: «استدعاني السجين بولس وطلب مني أن أحضر إليك هذا الشاب، لأن لديه شيئًا يقوله لك».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'القائد: اللفظة اليونانية تشير إلى ضابط عسكري روماني رفيع، يُسمّى تقليديًا «أمير الألف».'
    reason: cultural_note
lexical_decisions:
- source_word: παραλαβὼν αὐτὸν
  choice: فأخذه الجندي
  rationale: يفيد الفعل أخذ الشخص معه تمهيدًا لاصطحابه، وأُظهر فاعله الضمني «الجندي» من السياق العربي لتجنب غموض الضمير.
- source_word: ἤγαγεν πρὸς τὸν χιλίαρχον
  choice: وأحضره إلى القائد
  rationale: ينقل حركة الشاب نحو الضابط بعبارة عربية طبيعية، بينما «القائد» مفهوم للقارئ ويُشرح مدلوله الروماني في الحاشية.
- source_word: φησίν
  choice: وقال
  rationale: المضارع التاريخي اليوناني يُنقل بالماضي الملائم للسرد العربي.
- source_word: Ὁ δέσμιος Παῦλος
  choice: السجين بولس
  rationale: δέσμιος يدل هنا على شخص محتجز أو موثق، و«السجين» أوضح تعبير عربي في السياق.
- source_word: προσκαλεσάμενός με
  choice: استدعاني
  rationale: ينقل طلب بولس حضور الجندي إليه بإيجاز وفصاحة من غير مبالغة في سلطته.
- source_word: ἠρώτησεν
  choice: طلب مني
  rationale: الفعل هنا يفيد الطلب لا الاستفهام، وهذه الصياغة تلائم المصدر المؤول اللاحق.
- source_word: τοῦτον τὸν νεανίαν
  choice: هذا الشاب
  rationale: ترجمة طبيعية ودقيقة لاسم يدل على ذكر شاب.
- source_word: ἔχοντά τι λαλῆσαί σοι
  choice: لأن لديه شيئًا يقوله لك
  rationale: تنقل العبارة الوصفية التي تعلل إحضاره، بصياغة عربية واضحة من غير زيادة في مضمون ما سيقوله.
