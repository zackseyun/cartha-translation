  yaml_path: translation/nt/acts/023/002.yaml
  text: But the high priest Ananias ordered those standing by him to strike him on the mouth[a].
translation:
  language: ar
  text: لكنَّ رئيسَ الكهنة حنانيا أمر الواقفين بجانبه أن يضربوا بولس على فمه.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أن يصفعوا بولس على فمه». يمكن أن يدل الفعل اليوناني على الضرب عمومًا، أما «يصفعوا» فترجمة محتملة لكنها أكثر تحديدًا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: لكنَّ
  rationale: تفيد هنا انتقالًا ذا مسحة استدراكية إلى ردّ الفعل المفاجئ على كلام بولس السابق، من غير مبالغة في قوة التعارض.
- source_word: ἀρχιερεὺς
  choice: رئيس الكهنة
  rationale: التعبير العربي المعياري الدال على صاحب منصب رئيس الكهنة في هذا السياق.
- source_word: Ἁνανίας
  choice: حنانيا
  rationale: نقل للاسم الشخصي وفق الصيغة العربية الكتابية الشائعة.
- source_word: ἐπέταξεν
  choice: أمر
  rationale: ينقل معنى إصدار أمر ذي سلطة بعبارة عربية طبيعية ومباشرة.
- source_word: τοῖς παρεστῶσιν αὐτῷ
  choice: الواقفين بجانبه
  rationale: يحفظ الدلالة المكانية للمشاركين الحاضرين بالقرب من حنانيا، من غير افتراض أنهم خدم رسميون.
- source_word: τύπτειν
  choice: أن يضربوا
  rationale: الفعل اليوناني عام في دلالته على الضرب؛ لذا لا تُحدَّد كيفيته في المتن.
- source_word: αὐτοῦ τὸ στόμα
  choice: بولس على فمه
  rationale: ذُكر بولس بالاسم لإزالة التباس الضمير الممكن في العربية، وصيغ موضع الضربة بصورة عربية طبيعية.
