id: ACT.23.12
reference: Acts 23:12
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Γενομένης δὲ ἡμέρας ποιήσαντες ⸂συστροφὴν οἱ Ἰουδαῖοι⸃ ἀνεθεμάτισαν ἑαυτοὺς λέγοντες μήτε φαγεῖν μήτε πιεῖν ἕως οὗ ἀποκτείνωσιν τὸν Παῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/012.yaml
  text: When day came[a], the Jews formed a conspiracy and bound themselves under a curse[b], saying that they would neither eat nor drink until they had killed Paul.
translation:
  language: ar
  text: ولمّا طلع النهار، عقد اليهود[a] مؤامرة، وجعلوا أنفسهم تحت لعنة[b]، قائلين إنهم لن يأكلوا ولن يشربوا حتى يقتلوا بولس.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: المقصود هنا جماعة معيّنة من اليهود اشتركت في المؤامرة، لا الشعب اليهودي كله.
    reason: cultural_note
  - marker: b
    text: أي إنهم ألزموا أنفسهم بقَسَم يستجلب عليهم اللعنة إن لم يفوا به.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γενομένης δὲ ἡμέρας
  choice: ولمّا طلع النهار
  rationale: تركيب إضافي مطلق يفيد الانتقال الزمني. وهذه الصياغة عربية طبيعية تحفظ معنى حلول النهار.
- source_word: ποιήσαντες συστροφὴν
  choice: عقد ... مؤامرة
  rationale: يفيد التعبير تواطؤًا منظمًا وتدبيرًا مقصودًا، لا مجرد تجمهر أو شغب.
- source_word: οἱ Ἰουδαῖοι
  choice: اليهود
  rationale: يحافظ على اللفظ الصريح في النص اليوناني، مع إيضاح المرجع السياقي المحدد في الحاشية دون تضييق النص الرئيس.
- source_word: ἀνεθεμάτισαν ἑαυτοὺς
  choice: جعلوا أنفسهم تحت لعنة
  rationale: ينقل معنى إلزام النفس بلعنة مرتبطة بالقَسَم، ويتجنب التعريب الاصطلاحي الغامض.
- source_word: λέγοντες μήτε φαγεῖν μήτε πιεῖν
  choice: قائلين إنهم لن يأكلوا ولن يشربوا
  rationale: صياغة عربية طبيعية تنقل مضمون التزامهم وتحفظ النفي المزدوج المتوازي.
- source_word: ἕως οὗ ἀποκτείνωσιν τὸν Παῦλον
  choice: حتى يقتلوا بولس
  rationale: يحفظ الغاية الزمنية للقسم ويعبّر عنها بصيغة عربية مباشرة دون فرض تحقق الفعل.
theological_decisions:
- issue: مدلول «اليهود» في هذا السياق
  choice: الإبقاء على «اليهود» في المتن مع حاشية سياقية
  alternative: بعض اليهود
  rationale: النص اليوناني يقول «اليهود»، لكن السياق يدل على جماعة محددة من المتآمرين لا على الشعب اليهودي كله؛ والحاشية تحفظ اللفظ وتمنع التعميم.
translation_notes:
  register: العربية فصحى معاصرة واضحة ووقورة. استُعملت «عقد ... مؤامرة» للدلالة على التدبير المنظم، و«جعلوا أنفسهم تحت لعنة» لإبقاء صورة النص ومعناها القَسَمي دون مصطلح ديني غامض.
