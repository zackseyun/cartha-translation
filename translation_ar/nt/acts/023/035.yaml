  text: Διακούσομαί σου, ἔφη, ὅταν καὶ οἱ κατήγοροί σου παραγένωνται· ⸀κελεύσας ἐν τῷ πραιτωρίῳ ⸀τοῦ Ἡρῴδου φυλάσσεσθαι ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/035.yaml
  text: “I will hear your case,” he said[b][a], “when your accusers also arrive.” And he ordered that he be kept under guard in Herod’s praetorium.
translation:
  language: ar
  text: «سأستمع إليك[a]»، قال، «حين يصل أيضًا الذين يتهمونك». ثم أمر بأن يُحتفَظ به تحت الحراسة في قصر هيرودس[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «سأستمع إليك استماعًا كاملًا» أو «سأسمع قضيتك كاملة». قد يدل الفعل اليوناني على الاستماع إلى الشخص حتى النهاية، وهو هنا في سياق قضائي.'
    reason: lexical_alternative
  - marker: b
    text: كان قصر هيرودس في قيصرية يُستعمل دارَ ولاية، أي مقرًا رسميًا أو مقرَّ قيادة للحاكم الروماني. والكلمة اليونانية تعني هذا المقر الإداري.
    reason: cultural_note
lexical_decisions:
- source_word: Διακούσομαί σου
  choice: سأستمع إليك
  rationale: يحافظ على صورة السماع في الفعل اليوناني وعلى ضمير المخاطب، ويلائم السياق القضائي دون أن يضيف صراحةً كلمة «قضية» غير الموجودة لفظًا. وتوضح الحاشية احتمال معنى الاستماع الكامل.
- source_word: ὅταν καὶ οἱ κατήγοροί σου παραγένωνται
  choice: حين يحضر متهموك أيضًا
  rationale: «حين» تنقل الشرط المستقبلي، و«متهموك» تؤدي المعنى القانوني لـ κατήγοροί، و«يحضر» تعبير عربي طبيعي عن وصولهم إلى المكان.
- source_word: κελεύσας
  choice: ثم أمر
  rationale: صيغ اسم الفاعل اليوناني فعلًا عربيًا مستقلًا لسلاسة السرد، و«ثم» تبين تعاقب الإجراءين من غير مبالغة في تحديد الفاصل الزمني.
- source_word: ἐν τῷ πραιτωρίῳ τοῦ Ἡρῴδου
  choice: في دار الولاية التابعة لهيرودس
  rationale: πραιτώριον يدل على مقر الحاكم أو مسكنه الرسمي. و«دار الولاية» واضحة للقارئ العربي وتحافظ على الوظيفة الإدارية للمكان، مع إبقاء نسبته إلى هيرودس.
- source_word: φυλάσσεσθαι αὐτόν
  choice: أن يُحتفَظ به تحت الحراسة
  rationale: ينقل معنى الحراسة الاحتجازية المستمرة من غير أن يوحي بعقوبة سجن لم يذكرها النص.
