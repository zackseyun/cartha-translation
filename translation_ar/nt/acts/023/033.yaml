  text: οἵτινες εἰσελθόντες εἰς τὴν Καισάρειαν καὶ ἀναδόντες τὴν ἐπιστολὴν τῷ ἡγεμόνι παρέστησαν καὶ τὸν Παῦλον αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/033.yaml
  text: When they entered Caesarea and delivered the letter to the governor[b][a], they also presented Paul to him.
translation:
  language: ar
  text: ولمّا دخلوا قيصرية وسلّموا الرسالة إلى الوالي[a]، قدّموا إليه بولس أيضًا[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ناولوا الوالي الرسالة».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «أحضروا بولس أمامه».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: هم، مفهومون من صيغة الجمع
  rationale: يعود الضمير الموصول على رجال الحرس المذكورين في السياق السابق، وتستغني العربية عن إظهاره مع الفعل الجمع.
- source_word: εἰσελθόντες
  choice: ولمّا دخلوا
  rationale: ينقل اسم الفاعل الماضي الدال على فعل سابق للفعل الرئيس في صياغة عربية زمنية طبيعية.
- source_word: Καισάρειαν
  choice: قيصرية
  rationale: الصيغة العربية المألوفة لاسم المدينة، ولا يلزم توسيعها إلى قيصرية البحرية في المتن.
- source_word: ἀναδόντες
  choice: سلّموا
  rationale: يلائم تسليم رسالة رسمية إلى صاحب سلطة، ويحافظ على معنى إعطائها إليه دون مبالغة.
- source_word: ἐπιστολήν
  choice: الرسالة
  rationale: المقابل العربي المباشر والطبيعي للمكاتبة الرسمية في السياق.
- source_word: ἡγεμόνι
  choice: الوالي
  rationale: لقب عربي واضح للمسؤول الروماني عن الإقليم هنا، من غير تخصيص إداري أضيق مما يقتضيه اللفظ اليوناني.
- source_word: παρέστησαν
  choice: قدّموا
  rationale: يفيد إحضار شخص وتقديمه رسميًا إلى صاحب السلطة، وهو مناسب للسياق القضائي.
- source_word: καὶ
  choice: أيضًا
  rationale: 'تُبرز القوة الإضافية للكلمة: إلى جانب تسليم الرسالة، قدّموا بولس.'
- source_word: Παῦλον
  choice: بولس
  rationale: الصيغة العربية الكتابية المستقرة للاسم.
- source_word: αὐτῷ
  choice: إليه
  rationale: يعود الضمير إلى الوالي، وينسجم طبيعيًا مع الفعل «قدّموا».
