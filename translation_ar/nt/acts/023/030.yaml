source:
  edition: SBLGNT
  text: μηνυθείσης δέ μοι ἐπιβουλῆς εἰς τὸν ⸀ἄνδρα ἔσεσθαι ⸀ἐξαυτῆς ἔπεμψα πρὸς σέ, παραγγείλας καὶ τοῖς κατηγόροις ⸀λέγειν πρὸς αὐτὸν ἐπὶ ⸀σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/030.yaml
  text: And when I was informed that there would be a plot against the man[a], I sent him to you at once, also ordering his accusers to state their case before you.
translation:
  language: ar
  text: ولمّا أُبلغتُ بأن مؤامرةً ستُدبَّر ضدّ الرجل، أرسلته إليك فورًا، وأمرتُ أيضًا متّهميه أن يعرضوا دعواهم عليه أمامك.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أن يقدّموا اتهاماتهم ضده أمامك». واليونانية حرفيًا: «أن يتكلموا إليه/ضده أمامك»، وهو تعبير ذو دلالة قضائية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μηνυθείσης
  choice: ولمّا أُبلغتُ
  rationale: صياغة زمنية طبيعية تحفظ المبني للمجهول في تركيب المضاف المطلق اليوناني.
- source_word: ἐπιβουλῆς
  choice: مؤامرةً
  rationale: يدل اللفظ على تدبير عدائي أو مكيدة؛ و«مؤامرة» واضحة من غير تخصيصه بكمين.
- source_word: εἰς τὸν ἄνδρα
  choice: ضدّ الرجل
  rationale: تحفظ اتجاه العداء وأداة التعريف، مع إبقاء الإشارة الرسمية إلى بولس.
- source_word: ἔσεσθαι
  choice: ستُدبَّر
  rationale: ينقل معنى المستقبل ضمن الخبر المنقول، وصيغته العربية تلائم «مؤامرة» طبيعيًا.
- source_word: ἐξαυτῆς
  choice: فورًا
  rationale: تعبير عربي موجز وواضح عن التعجيل الفوري.
- source_word: ἔπεμψα πρὸς σέ
  choice: أرسلته إليك
  rationale: أُثبت ضمير المفعول المفهوم من السياق، وهو بولس، لتستقيم العربية.
- source_word: παραγγείλας
  choice: وأمرتُ أيضًا
  rationale: ينقل الفعل المصاحب والإضافة التي تفيدها καί بصياغة عربية طبيعية.
- source_word: κατηγόροις
  choice: متّهميه
  rationale: الضمير يوضح أن المقصود هم الذين يتهمون بولس.
- source_word: λέγειν πρὸς αὐτὸν
  choice: أن يعرضوا دعواهم عليه
  rationale: صياغة قضائية طبيعية تحفظ إمكان معنى الكلام ضده أو تقديم الاتهامات عليه.
- source_word: ἐπὶ σοῦ
  choice: أمامك
  rationale: ينقل معنى المثول أمام الوالي بوصفه صاحب السلطة القضائية من غير إضافة «محكمتك» غير الصريحة.
