base_translation:
  language: en
  yaml_path: translation/nt/acts/023/014.yaml
  text: These men came to the chief priests and the elders and said[a], “We have bound ourselves under a curse to taste nothing until we kill Paul.”
translation:
  language: ar
  text: 'فتقدّم هؤلاء إلى رؤساء الكهنة والشيوخ وقالوا: «قد ألزمنا أنفسنا بقسمٍ مقرون بلعنة، ألّا نذوق شيئًا حتى نقتل بولس».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἵτινες
  choice: هؤلاء
  rationale: يعيد الاسم الموصول إلى المتآمرين المذكورين في السياق السابق، وصيغة «هؤلاء» طبيعية وواضحة في العربية.
- source_word: προσελθόντες
  choice: فتقدّم ... إلى
  rationale: اسم الفاعل الأوريستي يدل هنا على فعل سبق القول، وربطُه بالفاء يلائم تسلسل السرد العربي.
- source_word: τοῖς ἀρχιερεῦσιν καὶ τοῖς πρεσβυτέροις
  choice: رؤساء الكهنة والشيوخ
  rationale: تعبير مؤسسي مألوف يدل على القيادات الدينية وشيوخ الشعب، لا على مجرد المتقدمين في السن.
- source_word: Ἀναθέματι ἀνεθεματίσαμεν ἑαυτοὺς
  choice: قد ألزمنا أنفسنا بلعنة
  rationale: ينقل التركيب الاشتقاقي المشدد معنى قسم يعرّض فيه الحالف نفسه للعنة إن لم يفِ به، من غير استعمال مصطلح كنسي متأخر.
- source_word: μηδενὸς γεύσασθαι
  choice: ألّا نذوق شيئًا
  rationale: يحافظ على الصورة الحرفية للفعل γεύομαι وعلى شمول النفي، مع وضوح المعنى في العربية.
- source_word: ἕως οὗ ἀποκτείνωμεν
  choice: حتى نقتل
  rationale: ينقل الحد الزمني والحدث المقصود مباشرة من غير إضافة توصيف قانوني أو أخلاقي إلى فعل القتل.
- source_word: τὸν Παῦλον
  choice: بولس
  rationale: الصيغة العربية المستقرة لاسم Παῦλος.
theological_decisions:
- issue: دلالة صيغة القسم Ἀναθέματι ἀνεθεματίσαμεν ἑαυτοὺς
  choice: قد ألزمنا أنفسنا بلعنة
  alternative: قد حلفنا قسمًا مغلظًا
  rationale: الخيار المختار يحفظ عنصر اللعنة الذاتية الكامن في العبارة، بينما البديل يبيّن شدة القسم لكنه يحذف هذا العنصر الدلالي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة سردية وقورة. استُعمل «ألزمنا أنفسنا بلعنة» للموازنة بين قرب الصياغة من الأصل ووضوحها للقارئ العام.
