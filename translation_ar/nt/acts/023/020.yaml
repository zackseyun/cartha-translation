base_translation:
  language: en
  yaml_path: translation/nt/acts/023/020.yaml
  text: He said[a], “The Jews have agreed to ask you to bring Paul down to the Sanhedrin tomorrow[b], as though they were going to inquire more accurately about him.”
translation:
  language: ar
  text: 'فقال: «اتفق اليهود أن يطلبوا منك أن تُنزل بولس غدًا إلى المجلس اليهودي الأعلى[a]، متظاهرين بأنهم مزمعون أن يستعلموا عنه على نحو أدق.»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «المجمع». والمقصود هنا السنهدريم، أي المجلس اليهودي الحاكم.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνέθεντο
  choice: اتفق
  rationale: ينقل معنى التوافق على خطة مشتركة من غير أن يحمّل اللفظ في ذاته معنى التآمر، مع أن السياق يكشف قصدهم العدائي.
- source_word: τοῦ ἐρωτῆσαί σε
  choice: أن يطلبوا منك
  rationale: المصدر المعرّف يبيّن مضمون اتفاقهم وغايته، و«يطلبوا منك» هو التعبير العربي الطبيعي في هذا السياق.
- source_word: καταγάγῃς
  choice: أن تُنزل بولس
  rationale: يحفظ الدلالة الاتجاهية للفعل κατάγω، أي نقله إلى أسفل من موضعه في القلعة إلى موضع المجلس.
- source_word: συνέδριον
  choice: المجلس الأعلى
  rationale: يشير هنا على الأرجح إلى الهيئة اليهودية الحاكمة في أورشليم؛ وهذا التعبير واضح عربيًا مع إثبات البديل الاصطلاحي في الحاشية.
- source_word: ὡς
  choice: متظاهرين بأنهم
  rationale: تُبرز العبارة أن الاستفهام الأدق كان غرضًا مزعومًا وذريعة، كما يدل السياق، من غير توسع زائد.
- source_word: μέλλον τι ἀκριβέστερον πυνθάνεσθαι περὶ αὐτοῦ
  choice: مزمعون أن يستفهموا عن أمره بمزيد من الدقة
  rationale: «مزمعون» تنقل معنى النية القريبة في μέλλον، و«يستفهموا» تنقل طلب المعرفة بالاستقصاء في πυνθάνομαι، و«بمزيد من الدقة» تحفظ صيغة المقارنة في ἀκριβέστερον.
- source_word: Οἱ Ἰουδαῖοι
  choice: اليهود
  rationale: ترجمة مباشرة للنص اليوناني؛ ويحدد السياق أن المقصود الجماعة اليهودية المشتركة في التدبير ضد بولس، لا جميع اليهود على الإطلاق.
theological_decisions:
- issue: مرجع عبارة «اليهود» في سياق عدائي
  choice: الإبقاء على «اليهود» ترجمةً مباشرة
  alternative: القادة اليهود / بعض اليهود
  rationale: لا يضيّق النص اليوناني المرجع بلفظ صريح، لذلك تُحفظ صيغته، على أن يبيّن السياق أن الحديث عن الجماعة المعنية بالمؤامرة لا عن الشعب اليهودي كله.
- issue: طبيعة الغرض المعلن من إنزال بولس
  choice: «متظاهرين بأنهم» لإظهار أن الاستفهام ذريعة
  alternative: «كأنهم» أو «على أساس أنهم»
  rationale: ὡς في سياق المؤامرة يقدّم غرضًا ظاهريًا غير حقيقي؛ والصياغة المختارة توضّح الخداع الذي يفيده السياق دون إضافة مضمون عقدي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُخدم «المجلس الأعلى» بدل النقل الصوتي وحده لتيسير الفهم، ووُضع المصطلح البديل في الحاشية. حافظت الصياغة على اتجاه الحركة وعلى كون التحقيق الأدق غرضًا متظاهرًا به.
