  text: νῦν οὖν ὑμεῖς ἐμφανίσατε τῷ χιλιάρχῳ σὺν τῷ συνεδρίῳ ⸀ὅπως ⸂καταγάγῃ αὐτὸν εἰς⸃ ὑμᾶς ὡς μέλλοντας διαγινώσκειν ἀκριβέστερον τὰ περὶ αὐτοῦ· ἡμεῖς δὲ πρὸ τοῦ ἐγγίσαι αὐτὸν ἕτοιμοί ἐσμεν τοῦ ἀνελεῖν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/015.yaml
  text: Now therefore[a], you, together with the council, make it known to the commander so that he may bring him down to you, as though you were about to examine more carefully the things concerning him[c][b]. But we are ready to kill him before he comes near.
translation:
  language: ar
  text: والآن أنتم، مع المجلس، أبلغوا قائدَ الكتيبة لكي يُنزله إليكم، متظاهرين بأنكم مزمعون أن تفحصوا قضيته بمزيد من الدقة.[a] أما نحن فمستعدون لقتله قبل أن يقترب.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كأنكم تنوون أن تتحققوا بمزيد من الدقة من الأمور المتعلقة به».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμφανίσατε
  choice: أبلغوا
  rationale: فعل أمر يفيد إبلاغ صاحب سلطة بالأمر؛ و«أبلغوا» عربية طبيعية رسمية، من غير أن تحصر مضمون الإبلاغ في طلب صريح.
- source_word: χιλιάρχῳ
  choice: قائد الكتيبة
  rationale: يدل على الضابط الروماني المعروف بالخيليارخوس، الذي يقود عادةً كتيبة؛ وهذه الصياغة واضحة وتحتفظ بالسياق العسكري.
- source_word: σὺν τῷ συνεδρίῳ
  choice: أنتم والمجلس
  rationale: تحافظ على معنى المصاحبة، وتشير إلى الهيئة الحاكمة المعروفة من غير استعمال الاسم المعرَّب الأكثر تخصصًا «السنهدريم».
- source_word: καταγάγῃ αὐτὸν εἰς ὑμᾶς
  choice: يُنزله إليكم
  rationale: تحفظ الدلالة الاتجاهية في κατάγω، أي الإحضار إلى أسفل، مع عبارة عربية موجزة ومفهومة.
- source_word: ὡς μέλλοντας
  choice: متظاهرين بأنكم مزمعون
  rationale: تنقل النية المعروضة على غير حقيقتها في السياق، وتحافظ على معنى الاستعداد أو القصد الوشيك.
- source_word: διαγινώσκειν ἀκριβέστερον τὰ περὶ αὐτοῦ
  choice: أن تفحصوا قضيته بمزيد من الدقة
  rationale: «تفحصوا» تلائم السياق القضائي، و«قضيته» تعبير عربي طبيعي عن τὰ περὶ αὐτοῦ، و«بمزيد من الدقة» تحفظ صيغة المقارنة.
- source_word: πρὸ τοῦ ἐγγίσαι αὐτὸν
  choice: قبل أن يقترب
  rationale: تنقل المعنى الزمني والدلالة المكانية للفعل ἐγγίζω من غير تحويله إلى الوصول التام.
- source_word: τοῦ ἀνελεῖν αὐτόν
  choice: لقتله
  rationale: ترجمة مباشرة واضحة للفعل في هذا السياق، من غير إضافة حكم أخلاقي غير مصرح به في اللفظ نفسه.
