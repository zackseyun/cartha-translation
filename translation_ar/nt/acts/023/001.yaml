    text: 'أو: «لقد تصرّفت كمواطن أمام الله»، مع الحفاظ على الإيحاء المدني الممكن في الفعل اليوناني.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀτενίσας
  choice: حدّق
  rationale: ينقل النظر الموجَّه الثابت والمتمعّن بصياغة عربية موجزة وطبيعية.
- source_word: δὲ
  choice: فـ
  rationale: أداة ربط سردية خفيفة تصل الفعل بما سبقه من السياق.
- source_word: τῷ συνεδρίῳ
  choice: في المجلس
  rationale: يشير السياق إلى المجلس اليهودي الحاكم، وترجمة الاسم العام بـ«المجلس» واضحة من غير استبداله بلفظ منقول صوتيًا.
- source_word: Ἄνδρες ἀδελφοί
  choice: أيها الإخوة
  rationale: نداء عربي طبيعي يحفظ المخاطبة الأخوية المذكرة، أما النقل الحرفي «أيها الرجال الإخوة» فثقيل.
- source_word: πάσῃ συνειδήσει ἀγαθῇ
  choice: بضمير صالح كل الصلاح
  rationale: يحفظ وصف الضمير بالصلاح ويعبّر عن القوة الشاملة في πάσῃ من غير أن يحوّل العبارة إلى ادعاء صريح بالعصمة.
- source_word: πεπολίτευμαι
  choice: لقد سلكت
  rationale: يؤدي المعنى السياقي المتعلق بطريقة السيرة، مع «لقد» للدلالة على الفعل الممتد من الماضي إلى الحاضر؛ وتُذكر الدلالة المدنية الممكنة في الحاشية.
- source_word: τῷ θεῷ
  choice: أمام الله
  rationale: تعبير عربي مألوف عن السلوك في حضرة الله وتحت نظره، ويلائم سياق الضمير.
- source_word: ἄχρι ταύτης τῆς ἡμέρας
  choice: إلى هذا اليوم
  rationale: يحفظ الحد الزمني واستمرار السلوك حتى لحظة الكلام.
theological_decisions:
- issue: مدى دلالة πεπολίτευμαι على المواطنة أو على السيرة الأخلاقية
  choice: سلكت أمام الله
  alternative: عشت كمواطن أمام الله / تصرفت كمواطن أمام الله
  rationale: السياق يركّز على السيرة والضمير أمام الله، مع بقاء الإيحاء المدني الحقيقي للفعل ممكنًا؛ لذلك وُضع البديل في الحاشية بدل فرضه في المتن.
- issue: قوة قول بولس عن الضمير الصالح
  choice: بضمير صالح كل الصلاح
  alternative: بكل ضمير صالح / بضمير صالح تمامًا
  rationale: تحفظ الصياغة شمول πάσῃ وقوة ادعاء بولس كما وردت، من غير تفسيره على أنه ادعاء بالكمال الخالي من كل خطيئة أو تخفيفه إلى مجرد حسن النية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «حدّق» لقوة النظر، و«سلكت» بوصفه تعبيرًا مفهومًا عن نهج الحياة. وُضع مؤشر الحاشية بعد الاقتباس لأنه يخص البديل المتعلق بالفعل داخل كلام بولس.
