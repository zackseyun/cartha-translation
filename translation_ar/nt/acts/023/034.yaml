  text: ἀναγνοὺς ⸀δὲ καὶ ἐπερωτήσας ἐκ ποίας ⸀ἐπαρχείας ἐστὶν καὶ πυθόμενος ὅτι ἀπὸ Κιλικίας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/034.yaml
  text: After reading it and asking what province he was from[a], and learning that he was from Cilicia,
translation:
  language: ar
  text: وبعدما قرأ الرسالة، سأل من أي ولاية هو، ولما علم أنه من كيليكية،
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναγνοὺς
  choice: وبعدما قرأ الرسالة
  rationale: اسم فاعل ماضٍ يفيد فعلًا سابقًا في تسلسل الأحداث. أُضيفت «الرسالة» من السياق السابق لتوضيح مرجع المفعول المحذوف في اليونانية.
- source_word: δὲ
  choice: و
  rationale: أداة ربط خفيفة تستأنف السرد، وتنقلها الواو طبيعيًا في العربية.
- source_word: καὶ ἐπερωτήσας
  choice: سأل
  rationale: يدل الفعل على توجيه سؤال مباشر؛ وصيغته العربية الفعلية أوضح وأطبع من محاكاة تركيب اسم الفاعل اليوناني.
- source_word: ἐκ ποίας ἐπαρχείας ἐστὶν
  choice: من أي ولاية هو
  rationale: تشير ἐπαρχεία إلى ولاية إدارية رومانية، و«ولاية» تؤدي هذا المعنى بوضوح في العربية المعاصرة.
- source_word: καὶ πυθόμενος
  choice: ولما علم
  rationale: يفيد الفعل التوصل إلى المعلومة أو معرفتها بعد السؤال، و«لما علم» يحافظ على تعاقب الأفعال.
- source_word: ὅτι ἀπὸ Κιλικίας
  choice: أنه من كيليكية
  rationale: تفيد ἀπό المنشأ، فجاء التعبير العربي المباشر «من كيليكية» مع إضمار معنى الكينونة كما في السياق.
- source_word: Κιλικίας
  choice: كيليكية
  rationale: الصيغة العربية الشائعة لاسم الإقليم الروماني Cilicia.
theological_decisions: []
translation_notes:
  register: صياغة عربية فصحى واضحة ووقورة، تحافظ على كون الآية جزءًا من جملة ممتدة إلى الآية التالية؛ لذلك خُتمت بفاصلة. جرى تحويل سلسلة أسماء الفاعلين اليونانية إلى أفعال مترابطة طبيعية في العربية دون تغيير ترتيب الأحداث.
