  text: Ἀκούσας δὲ ὁ υἱὸς τῆς ἀδελφῆς Παύλου ⸂τὴν ἐνέδραν⸃ παραγενόμενος καὶ εἰσελθὼν εἰς τὴν παρεμβολὴν ἀπήγγειλεν τῷ Παύλῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/016.yaml
  text: But when Paul’s sister’s son heard of the ambush[c][b][a], he came and entered the barracks and reported it to Paul.
translation:
  language: ar
  text: لكن ابن أخت بولس، لما سمع بالكمين[a]، جاء ودخل الثكنة[b] وأخبر بولس بالأمر.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «بالمؤامرة» أو «بالمكيدة». والكلمة اليونانية تعني على نحو أخص كمينًا أو تربصًا.
    reason: lexical_alternative
  - marker: b
    text: أو «المعسكر». والمقصود في هذا السياق على الأرجح ثكنة الجنود الرومان.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσας
  choice: لما سمع
  rationale: اسم فاعل ماضٍ يؤدي معنى زمنيًا سابقًا للفعل الرئيس؛ و«لما سمع» صياغة عربية طبيعية تحفظ هذا التتابع.
- source_word: δὲ
  choice: لكن
  rationale: تفيد الأداة انتقالًا سرديًا مع مقابلة خفيفة بين تدبير المؤامرة وانكشافه.
- source_word: ὁ υἱὸς τῆς ἀδελφῆς Παύλου
  choice: ابن أخت بولس
  rationale: ينقل صلة القرابة المحددة في اليونانية بوضوح وإيجاز، من غير الاكتفاء باللفظ الأعم «ابن أخيه أو أخته».
- source_word: τὴν ἐνέδραν
  choice: الكمين
  rationale: تحفظ المعنى المحسوس للكلمة، أي التربص أو الاختباء بقصد الهجوم، بدل تعميمه إلى مجرد مؤامرة.
- source_word: παραγενόμενος
  choice: جاء
  rationale: يدل على الحضور أو الوصول قبل الدخول، وصيغته العربية موجزة وطبيعية في تسلسل الأحداث.
- source_word: εἰσελθὼν εἰς τὴν παρεμβολὴν
  choice: دخل الثكنة
  rationale: يمكن أن تعني παρεμβολή معسكرًا أو ثكنة، لكن سياق احتجاز بولس لدى الجنود الرومان يرجح «الثكنة».
- source_word: ἀπήγγειλεν
  choice: أخبر ... بالأمر
  rationale: يفيد نقل الخبر أو إبلاغه، و«بالأمر» يصرح بالمفعول المفهوم من السياق بأسلوب عربي طبيعي.
- source_word: τῷ Παύλῳ
  choice: بولس
  rationale: مفعول غير مباشر في اليونانية، ويأتي في العربية مباشرة بعد فعل «أخبر».
