  - marker: b
    text: 'حرفيًّا: «الموت أو القيود».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὗρον
  choice: فوجدتُ
  rationale: ينقل نتيجة الفحص التي توصّل إليها القائد، ويحافظ على دلالة الفعل اليوناني وصيغة المتكلم.
- source_word: ἐγκαλούμενον
  choice: أنه متَّهَمٌ
  rationale: يحافظ على المعنى المبني للمجهول من غير أن يوحي بثبوت الذنب أو صدور حكم.
- source_word: περὶ ζητημάτων
  choice: في مسائل تتعلّق
  rationale: يفيد أن موضوع الاتهام كان مسائل أو قضايا محل بحث؛ وتوضح الحاشية إمكان إبراز معنى النزاع الكامن في اللفظة.
- source_word: τοῦ νόμου αὐτῶν
  choice: بشريعتهم
  rationale: يحفظ منظور القائد الروماني في الضمير «هم»، وتلائم «الشريعة» الإشارة السياقية إلى ناموس اليهود.
- source_word: μηδὲν ... ἄξιον θανάτου ἢ δεσμῶν
  choice: من غير أن تكون عليه تهمةٌ تستوجب الموت أو القيود
  rationale: ينقل الحكم القانوني بوضوح، مع إبقاء «القيود» ترجمة محسوسة لـ δεσμῶν وعدم تضييقها على مجرد مفهوم السجن.
- source_word: ἔχοντα ἔγκλημα
  choice: تكون عليه تهمةٌ
  rationale: يعبر عن وجود اتهام منسوب إليه من غير أن يقرر إدانته.
