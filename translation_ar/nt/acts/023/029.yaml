  yaml_path: translation/nt/acts/023/029.yaml
  text: I found that he was being accused concerning questions of their law[b][a], but charged with nothing deserving death or imprisonment.
translation:
  language: ar
  text: فوجدتُ أنه متَّهَمٌ بشأن مسائل تتعلّق بشريعتهم[a]، وأنه لا تهمةَ عليه تستوجب الموت أو السجن[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بشأن مسائل متنازَع عليها في شريعتهم».'
