lexical_decisions:
- source_word: γράψας
  choice: وكتب
  rationale: اسم فاعل ماضٍ من γράφω مرتبط بفاعل الآية السابقة. صيغته العربية بالفعل المعطوف طبيعية في السرد وتحفظ تعاقب الحدث.
- source_word: ἐπιστολὴν
  choice: رسالةً
  rationale: تدل ἐπιστολή على مراسلة مكتوبة، و«رسالة» هي المقابل العربي الحديث الواضح والمناسب للسياق.
- source_word: ἔχουσαν
  choice: بهذه
  rationale: يصف اسم الفاعل الرسالة بأنها حاملة للصيغة الآتية؛ ويؤدي التركيب العربي «بهذه الصيغة» المعنى بإيجاز وطبيعية.
- source_word: τύπον
  choice: الصيغة
  rationale: يشير τύπος هنا إلى صورة الرسالة أو قالب عبارتها، و«الصيغة» تحافظ على اتساع الدلالة من غير حصرها في المحتوى أو الألفاظ وحدها.
- source_word: τοῦτον
  choice: هذه
  rationale: اسم إشارة يحيل إلى ما سيأتي من نص الرسالة، وقد حُفظت إشارته المباشرة في العربية.
