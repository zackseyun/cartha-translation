  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Σαδδουκαῖοι ⸀μὲν γὰρ λέγουσιν μὴ εἶναι ἀνάστασιν ⸀μήτε ἄγγελον μήτε πνεῦμα, Φαρισαῖοι δὲ ὁμολογοῦσιν τὰ ἀμφότερα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/008.yaml
  text: For the Sadducees say there is no resurrection[a], nor angel nor spirit, but the Pharisees acknowledge both.
translation:
  language: ar
  text: لِأَنَّ الصَّدُّوقِيِّينَ يَقُولُونَ إِنَّهُ لَا قِيَامَةَ، وَلَا مَلَاكَ وَلَا رُوحَ، أَمَّا الْفَرِّيسِيُّونَ فَيُقِرُّونَ بِكِلَيْهِمَا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو يُفهم المعنى: «أمّا الفريسيون فيُقِرّون بالأمور الثلاثة»، أي القيامة والملاك والروح. يقول اليوناني حرفيًا «بكليهما»، وهو يشير بصورة مباشرة إلى «الملاك» و«الروح»، لكن بعضهم يفهمه بمعنى أوسع في ضوء السياق.'
    reason: alternative_reading
lexical_decisions:
- source_word: Σαδδουκαῖοι
  choice: الصَّدُّوقِيُّونَ
  rationale: النقل العربي المعياري لاسم هذه الطائفة اليهودية، مع الحفاظ على كونه اسمًا لا وصفًا مترجمًا.
- source_word: μὲν γὰρ
  choice: لِأَنَّ
  rationale: تنقل الوظيفة التفسيرية والسببية للعبارة في سياق توضيح منشأ الخلاف.
- source_word: λέγουσιν
  choice: يَقُولُونَ
  rationale: فعل مضارع مباشر يلائم التقرير العام عن معتقد الصدوقيين دون إضافة معنى الجدال أو الادعاء.
- source_word: μὴ εἶναι
  choice: إِنَّهُ لَا ...
  rationale: صياغة عربية طبيعية للجملة المصدرية التابعة لفعل القول، وتفيد نفي الوجود.
- source_word: ἀνάστασιν
  choice: قِيَامَةَ
  rationale: المصطلح العربي الكتابي الواضح الدال على القيامة بوصفها حقيقة أو مفهومًا.
- source_word: μήτε ἄγγελον μήτε πνεῦμα
  choice: وَلَا مَلَاكَ وَلَا رُوحَ
  rationale: تحافظ على النفي المترابط وعلى إفراد الاسمين في اليونانية.
- source_word: Φαρισαῖοι
  choice: الْفَرِّيسِيُّونَ
  rationale: النقل العربي المعياري لاسم الطائفة.
- source_word: ὁμολογοῦσιν
  choice: يُقِرُّونَ بِـ
  rationale: يفيد الاعتراف بصحة الأمر أو إثباته، من غير الإيحاء الحصري بالاعتراف بالخطية الذي قد تحمله بعض البدائل.
- source_word: τὰ ἀμφότερα
  choice: بِكِلَيْهِمَا
  rationale: 'يحافظ على صيغة التثنية الصريحة في اليونانية، والأقرب أنها تعود إلى الزوج المذكور مباشرة: الملاك والروح.'
theological_decisions:
- issue: مرجع صيغة التثنية «τὰ ἀμφότερα» في إقرار الفريسيين
  choice: يفيد النص الرئيس أن الفريسيين يقرون بكليهما، أي بالملاك والروح، وهما الزوج المذكور مباشرة.
  alternative: 'قد يُفهم المعنى الأوسع على أنهم يقرون بالأمور الثلاثة: القيامة والملاك والروح.'
  rationale: تستعمل اليونانية لفظ «كليهما» لا «الكل» أو «الثلاثة»، مما يرجح إحالتها إلى «ملاك» و«روح». لكن السياق يشمل القيامة أيضًا، ولذلك يُحفظ الفهم الأوسع في الحاشية بدل حسمه داخل النص.
translation_notes:
  register: فصحى معاصرة واضحة ذات نبرة كتابية رصينة. استُعملت «لا قيامة» للإيجاز والحفاظ على الطابع التقريري، ووضعت علامة الحاشية بعد الجملة التي تتصل بها. حافظت الصياغة على غموض نطاق «كليهما» ولم تستبدله في المتن بـ«الثلاثة».
