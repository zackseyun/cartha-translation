lexical_decisions:
- source_word: κτήνη
  choice: دوابَّ للركوب
  rationale: اللفظة اليونانية عامة، وتدل على حيوانات تُستخدم للحمل أو الركوب من غير تحديد نوعها؛ وهذا التعبير يوضح الوظيفة من دون افتراض أنها خيل.
- source_word: τε
  choice: وأن
  rationale: تربط هذه الوصية بما سبقها، وتنسجم «وأن» مع سياق الأوامر السابق ومع المصدر المؤول.
- source_word: παραστῆσαι
  choice: يجهّزوا
  rationale: المقصود إحضار الدواب وإعدادها لتكون متاحة، و«يجهّزوا» تؤدي هذه القوة العملية بوضوح.
- source_word: ἵνα
  choice: لِـ
  rationale: اللام في «ليركبوا» تبين الغرض بصورة عربية طبيعية.
- source_word: ἐπιβιβάσαντες
  choice: يُركبوا بولس عليها
  rationale: اسم الفاعل اليوناني يدل على جعل بولس يركب؛ وصياغة الفعلين المتعاطفين طبيعية وتحفظ تسلسل الفعلين.
- source_word: διασώσωσι
  choice: يوصلوه سالمًا
  rationale: الفعل يشدد على بلوغ المقصد بأمان مع الحماية من الخطر، لا على مجرد الانتقال.
- source_word: πρὸς
  choice: إلى
  rationale: تفيد الحركة نحو شخص في هذا السياق.
- source_word: ἡγεμόνα
  choice: الوالي
  rationale: لقب واضح ومألوف للمسؤول الروماني الحاكم في هذا السياق الإقليمي.
