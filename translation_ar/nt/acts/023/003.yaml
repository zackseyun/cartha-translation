base_translation:
  language: en
  yaml_path: translation/nt/acts/023/003.yaml
  text: Then Paul said to him[a], “God is about to strike you, you whitewashed wall! And do you sit judging me according to the law, and yet in violation of the law command me to be struck?”
translation:
  language: ar
  text: 'فقال له بولس: «إن الله مزمع أن يضربك[a]، يا حائطًا مبيَّضًا! أأنت جالس تحكم عليَّ بحسب الشريعة، وأنت تخالف الشريعة وتأمر أن أُضرَب؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إن الله سيضربك». والعبارة اليونانية حرفيًّا: «إن الله مزمع أن يضربك»، وقد تشدّد على قرب وقوع الفعل.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τύπτειν σε μέλλει ὁ θεός
  choice: إن الله مزمع أن يضربك
  rationale: ينقل تركيب μέλλει مع المصدر بوصفه فعلًا وشيكًا أو منتظر الوقوع، من غير تحويله إلى تمنٍّ أو دعاء. و«يضربك» يحافظ على دلالة τύπτειν المباشرة.
- source_word: τοῖχε κεκονιαμένε
  choice: يا حائطًا مبيَّضًا
  rationale: يحافظ على الاستعارة الحية وعلى أثر اسم المفعول التام κεκονιαμένε، وهو تعبير عربي واضح عن حائط طُلي ظاهره بالبياض.
- source_word: κάθῃ
  choice: أأنت جالس
  rationale: يبقي صورة الجلوس الملموسة وحدّة السؤال الإنكاري بدل تسطيحها إلى مجرد تولّي القضاء.
- source_word: κρίνων με κατὰ τὸν νόμον
  choice: تحكم عليَّ بحسب الشريعة
  rationale: «بحسب الشريعة» تنقل معنى الاحتكام إلى معيار νόμος، و«تحكم عليَّ» طبيعية في السياق القضائي.
- source_word: παρανομῶν
  choice: تخالف الشريعة
  rationale: تعبير واضح وموجز عن التصرف على خلاف القانون، ويحفظ المقابلة اللفظية مع «بحسب الشريعة».
- source_word: κελεύεις με τύπτεσθαι
  choice: تأمر أن أُضرَب
  rationale: يحافظ على معنى الأمر وعلى المبني للمجهول في المصدر اليوناني، من غير تحديد الشخص الذي ينفذ الضرب.
- source_word: τότε ὁ Παῦλος πρὸς αὐτὸν εἶπεν
  choice: فقال له بولس
  rationale: صياغة سردية عربية طبيعية تنقل التعاقب الذي تدل عليه τότε والفعل الموجَّه إليه.
theological_decisions:
- issue: طبيعة قول بولس إن الله مزمع أن يضربه
  choice: صيغ القول بوصفه إعلانًا عن فعل إلهي منتظر الوقوع
  alternative: «ليضربك الله» بوصفه دعاءً أو تمنّيًا، أو «سيضربك الله» بوصفه مستقبلًا عامًا
  rationale: تركيب μέλλει مع المصدر يرجّح قرب الفعل أو كونه مزمعًا، ولا يدل في ذاته على صيغة تمنٍّ. وتحافظ الصياغة على التوتر في النص من غير إصدار حكم على موقف بولس الأخلاقي.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة قضائية حادّة. استُعملت «الشريعة» لـ νόμος في هذا السياق اليهودي، وحُفظ تكرارها لإبراز المفارقة بين الحكم بحسبها ومخالفتها. تظهر علامة الحاشية [a] بعد العبارة التي تشرحها مباشرة.
