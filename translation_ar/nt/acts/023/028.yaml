  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: βουλόμενός ⸀τε ⸀ἐπιγνῶναι τὴν αἰτίαν δι’ ἣν ἐνεκάλουν αὐτῷ, ⸀κατήγαγον εἰς τὸ συνέδριον αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/028.yaml
  text: And wanting to know the charge for which they were accusing him[a], I brought him down to their council.
translation:
  language: ar
  text: وإذ أردتُ أن أعرف التهمة التي كانوا يتهمونه بها، أنزلتُه إلى مجلسهم[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «مجمعهم». تشير الكلمة اليونانية إلى مجلس، ويُرجَّح في هذا السياق أنها تعني المجلس اليهودي الحاكم في أورشليم، المعروف بالسنهدريم.
    reason: lexical_alternative
lexical_decisions:
- source_word: βουλόμενός
  choice: وإذ أردتُ
  rationale: ينقل دافع ليسياس بصياغة عربية طبيعية، ويحفظ معنى الإرادة من غير مبالغة في الدلالة.
- source_word: τε
  choice: و
  rationale: أداة ربط خفيفة تصل الجملة بما قبلها في سياق التقرير الرسمي.
- source_word: ἐπιγνῶναι
  choice: أن أعرف
  rationale: يؤدي معنى التوصل إلى معرفة الأمر، وهو تعبير واضح وملائم للسياق.
- source_word: τὴν αἰτίαν
  choice: التهمة
  rationale: للكلمة هنا دلالة قضائية، فالتهمة أدق من السبب العام.
- source_word: δι’ ἣν
  choice: التي ... بها
  rationale: صياغة عربية طبيعية تربط التهمة بفعل الاتهام وتحفظ علاقة الموصول في اليونانية.
- source_word: ἐνεκάλουν
  choice: كانوا يتهمونه
  rationale: يحفظ الماضي الناقص معنى الاتهام الجاري أو المتكرر، ويوافق السياق القضائي.
- source_word: αὐτῷ
  choice: ـه
  rationale: يؤدي مفعول فعل الاتهام في العربية بضمير متصل طبيعي.
- source_word: κατήγαγον
  choice: أنزلتُه
  rationale: يحفظ عنصر الحركة إلى أسفل الموجود في الفعل اليوناني، بصياغة عربية موجزة.
- source_word: συνέδριον
  choice: مجلس
  rationale: ترجمة عامة مباشرة للكلمة، مع بيان التحديد السياقي المحتمل في الحاشية.
- source_word: αὐτῶν
  choice: مجلسهم
  rationale: يحفظ الضمير كما في الأصل من غير أن يستبدله بتحديد تفسيري صريح.
