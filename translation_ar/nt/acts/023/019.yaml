  text: ἐπιλαβόμενος δὲ τῆς χειρὸς αὐτοῦ ὁ χιλίαρχος καὶ ἀναχωρήσας κατ’ ἰδίαν ἐπυνθάνετο· Τί ἐστιν ὃ ἔχεις ἀπαγγεῖλαί μοι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/019.yaml
  text: So the commander took him by the hand and[a], drawing aside in private, began asking[b], “What is it that you have to report to me?”
translation:
  language: ar
  text: 'فأمسك القائد بيده، ثم تنحّى به على انفراد وسأله: «ما الذي عندك لتخبرني به؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιλαβόμενος ... τῆς χειρὸς αὐτοῦ
  choice: أمسك بيده
  rationale: ينقل التعبير اليوناني الدال على الأخذ باليد نقلًا مباشرًا وطبيعيًا، من غير أن يوحي بعنف زائد.
- source_word: δὲ
  choice: فـ
  rationale: تفيد الفاء هنا تتابع الحدث في السرد بصورة عربية طبيعية.
- source_word: ὁ χιλίαρχος
  choice: القائد
  rationale: تسمية واضحة معاصرة للضابط الروماني، من غير إثقال النص بلقب تقني غير مألوف.
- source_word: ἀναχωρήσας κατ’ ἰδίαν
  choice: تنحّى به على انفراد
  rationale: يجمع بين معنى الابتعاد ومعنى الخصوصية، ويجعل المصاحبة الضمنية للشاب صريحة بالقدر الذي يقتضيه السياق.
- source_word: ἐπυνθάνετο
  choice: سأله
  rationale: الماضي الناقص اليوناني قد يصور الشروع أو الاستمرار في السؤال، لكن العربية الطبيعية في هذا الموضع تؤدي الحدث بالفعل البسيط من غير خسارة دلالية مهمة.
- source_word: Τί ἐστιν ὃ ἔχεις ἀπαγγεῖλαί μοι
  choice: ما الذي عندك لتخبرني به؟
  rationale: يحافظ على تركيب «ما الذي عندك» وعلى معنى نقل الخبر في ἀπαγγεῖλαι، بصياغة عربية واضحة وطبيعية.
theological_decisions: []
