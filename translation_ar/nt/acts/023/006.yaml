  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Γνοὺς δὲ ὁ Παῦλος ὅτι τὸ ἓν μέρος ἐστὶν Σαδδουκαίων τὸ δὲ ἕτερον Φαρισαίων ⸀ἔκραζεν ἐν τῷ συνεδρίῳ· Ἄνδρες ἀδελφοί, ἐγὼ Φαρισαῖός εἰμι, υἱὸς ⸀Φαρισαίων· περὶ ἐλπίδος καὶ ἀναστάσεως νεκρῶν ⸀ἐγὼ κρίνομαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/006.yaml
  text: But Paul[a], knowing that one part were Sadducees and the other Pharisees, cried out in the council, “Men, brothers, I am a Pharisee, a son of Pharisees[c][b]. It is concerning the hope and resurrection of the dead that I am being judged.”
translation:
  language: ar
  text: 'وإذ علم بولس أن فريقًا منهم كان من الصدوقيين، والفريق الآخر من الفريسيين، صاح في المجلس[a]: «أيها الرجال الإخوة، أنا فريسي، ابن فريسيين[b]. أُحاكَم بشأن الرجاء وقيامة الأموات[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في السنهدريم»، أي المجلس الأعلى لليهود.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «ابن أبوين فريسيين»، أو «من نسل فريسيين».'
    reason: alternative_reading
  - marker: c
    text: 'أو: «أُحاكَم بسبب رجاء قيامة الأموات».'
    reason: alternative_reading
lexical_decisions:
- source_word: Γνοὺς
  choice: ولما علم
  rationale: ينقل اسم الفاعل الماضي بوصفه ظرفًا سابقًا مهّد لصياح بولس، بصياغة عربية طبيعية.
- source_word: τὸ ἓν μέρος ... τὸ δὲ ἕτερον
  choice: فريقًا منهم ... والفريق الآخر
  rationale: «فريق» أوضح في العربية المعاصرة للدلالة على قسمين داخل المجلس، من غير أن يضيف معنى الخصومة الذي قد تحمله «فئة» أو «حزب».
- source_word: Σαδδουκαίων / Φαρισαίων
  choice: صدوقيون / فريسيون
  rationale: الصيغ العربية المعيارية المعروفة لاسمي الجماعتين اليهوديتين.
- source_word: ἔκραζεν
  choice: صاح
  rationale: يحفظ دلالة رفع الصوت في خطاب علني، وهو موجز وطبيعي.
- source_word: ἐν τῷ συνεδρίῳ
  choice: في المجلس
  rationale: ترجمة شفافة لـ συνέδριον، مع بيان التحديد السياقي المحتمل بـ«السنهدريم» في الحاشية.
- source_word: Ἄνδρες ἀδελφοί
  choice: أيها الرجال الإخوة
  rationale: يحفظ عنصري النداء اليونانيين، ἄνδρες وἀδελφοί، بصياغة عربية مفهومة ووقورة.
- source_word: Φαρισαῖός εἰμι
  choice: أنا فريسي
  rationale: تعريف مباشر بالنفس يحفظ زمن المضارع.
- source_word: υἱὸς Φαρισαίων
  choice: ابن فريسيين
  rationale: يحفظ صورة البنوة وصيغة الجمع من غير حسم هل المقصود الوالدان أم السلالة الأوسع.
- source_word: περὶ ἐλπίδος καὶ ἀναστάσεως νεκρῶν
  choice: بشأن الرجاء وقيامة الأموات
  rationale: يحفظ عطف «الرجاء» و«القيامة» كما في اليونانية، ولا يحسم إمكان فهمهما رجاءً واحدًا موضوعه القيامة.
- source_word: κρίνομαι
  choice: أُحاكَم
  rationale: ينقل المضارع المبني للمجهول في سياق قضائي بعربية طبيعية أدق من الترجمة الحرفية «يُحكم عليّ».
theological_decisions:
- issue: دلالة قول بولس υἱὸς Φαρισαίων
  choice: ابن فريسيين
  alternative: ابن أبوين فريسيين؛ أو من نسل فريسيين
  rationale: تبقي الترجمة الاستعارة العائلية والجمع من غير تضييق الدلالة على الوالدين وحدهما أو على النسب البعيد.
- issue: العلاقة بين «الرجاء» و«قيامة الأموات»
  choice: الرجاء وقيامة الأموات
  alternative: رجاء قيامة الأموات
  rationale: النص اليوناني يعطف الاسمين بـ καί، وقد يدل على أمرين مترابطين أو على رجاء واحد محوره القيامة؛ لذلك يحفظ المتن العطف وتذكر الحاشية الاحتمال الآخر.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعملت «إنما» لإبراز أن موضوع المحاكمة هو الرجاء والقيامة، مع إبقاء البنية العطفية للنص اليوناني. جميع علامات الحواشي مثبتة في مواضعها في المتن.
