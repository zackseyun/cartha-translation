review_pass:
  verdict: revise
  source_fidelity: المعنى العام أمين للنص اليوناني، بما في ذلك الحاضر في «أنه رئيس الكهنة» وصيغة الاقتباس «لأنه مكتوب». لكن «لا تقل سوءًا في رئيس شعبك» ليست صياغة عربية سليمة أو طبيعية لتعلّق الكلام المسيء بالشخص المذكور؛ فالتركيب اليوناني يعني الكلام بالسوء على/عن الرئيس.
  naturalness: «فقال بولس» و«لم أكن أعلم، أيها الإخوة» فصيحتان واضحتان. أما «تقل سوءًا في» فمتكلفة وغير مألوفة في العربية المعاصرة، ويحتاج موضع علامة الحاشية إلى ضبط بحيث تتصل مباشرة بالعبارة التي تشرحها داخل الاقتباس.
  terminology: «رئيس الكهنة» مقابل اصطلاحي مناسب لـἀρχιερεύς، و«رئيس شعبك» مناسب لـἄρχοντα τοῦ λαοῦ σου في هذا السياق. «تتكلم بالسوء على» يحفظ اتساع κακῶς ولا يحصره في الشتم، مع إبقاء «تشتم» بديلًا معجميًا صالحًا في الحاشية.
  issues:
  - severity: medium
    issue: التركيب «لا تقل سوءًا في رئيس شعبك» غير طبيعي وغير دقيق في تعلّق الكلام بالشخص.
    rationale: حرف الجر «في» لا يؤدي هنا معنى توجيه كلام مسيء إلى شخص أو عنه. «لا تتكلم بالسوء على رئيس شعبك» تعبير عربي سليم يحفظ المعنى غير المحدد للكلام المسيء في οὐκ ἐρεῖς κακῶς.
  - severity: low
    issue: موضع علامة الحاشية وعلامة الوقف يحتاجان إلى تنسيق أوضح داخل الاقتباس المزدوج.
    rationale: ينبغي أن تلحق العلامة بالنص الكتابي الذي تتعلق به مباشرة، لا أن تقع بعده بصياغة قد توهم اتصالها بالجملة الخارجية أو تربك إغلاق علامتي الاقتباس.
