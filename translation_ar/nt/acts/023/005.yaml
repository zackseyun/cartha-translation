base_translation:
  language: en
  yaml_path: translation/nt/acts/023/005.yaml
  text: And Paul said, “I did not know, brothers, that he is the high priest; for it is written, ‘You shall not speak evil of a ruler of your people.’”
translation:
  language: ar
  text: 'فقال بولس: «لم أكن أعلم، أيها الإخوة، أنه رئيس الكهنة؛ لأنه مكتوب: ‹لا تتكلم بالسوء على رئيس شعبك›[a].»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لا تشتم رئيس شعبك».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη τε ὁ Παῦλος
  choice: فقال بولس
  rationale: تنقل أداة الربط الخفيفة τέ وتقدّم القول المباشر بصياغة سردية عربية طبيعية.
- source_word: Οὐκ ᾔδειν
  choice: لم أكن أعلم
  rationale: تؤدي معنى عدم العلم مباشرة، وتحافظ على الصيغة الماضية من غير افتراض أنه لم يتعرّف إلى الشخص.
- source_word: ἀδελφοί
  choice: أيها الإخوة
  rationale: نداء مذكر مطابق للصيغة اليونانية ولسياق مخاطبة أعضاء المجلس.
- source_word: ὅτι ἐστὶν ἀρχιερεύς
  choice: أنه رئيس الكهنة
  rationale: تحافظ على حاضر ἐστίν في المعنى، بينما لا تحتاج العربية إلى إظهار فعل الكينونة في الجملة الاسمية؛ و«رئيس الكهنة» هو المقابل الاصطلاحي الواضح للمنصب.
- source_word: γέγραπται γὰρ
  choice: لأنه مكتوب
  rationale: صيغة عربية مألوفة للاقتباس الكتابي، وتحفظ دلالة النص المكتوب القائم.
- source_word: Ἄρχοντα
  choice: رئيس
  rationale: تلائم صاحب السلطة في الاقتباس القانوني، وتحافظ على عموم التعبير دون حصره في وظيفة بعينها.
- source_word: τοῦ λαοῦ σου
  choice: شعبك
  rationale: مقابل موجز ومباشر يحفظ لغة الانتماء الجماعي في الاقتباس.
- source_word: οὐκ ἐρεῖς κακῶς
  choice: لا تقل سوءًا في
  rationale: تنقل النهي الذي تؤديه صيغة المستقبل في الاقتباس، وتحفظ السعة الدلالية للتكلم بالسوء دون تضييقها على الشتم وحده.
theological_decisions:
- issue: كيفية نقل قول بولس عن عدم معرفته بمنصب الرجل
  choice: أنه رئيس الكهنة
  alternative: أنه كان رئيس الكهنة
  rationale: النص اليوناني يستعمل الحاضر ἐστίν. والجملة الاسمية العربية تحفظ هذا المعنى من غير حسم سبب عدم معرفة بولس أو تفسير مقصده.
- issue: كيفية عرض الاقتباس الكتابي
  choice: 'لأنه مكتوب: ‹لا تقل سوءًا في رئيس شعبك›'
  alternative: 'لأنه مكتوب: ‹لا تشتم رئيس شعبك›'
  rationale: تحافظ الصياغة المختارة على سلطة صيغة الاقتباس وعلى اتساع κακῶς، بينما «تشتم» بديل أقوى وأضيق دلالة.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم «رئيس الكهنة» للمصطلح المعروف، و«أيها الإخوة» للنداء المباشر. وُضعت علامة الحاشية بعد الاقتباس الذي تتعلق به.
