  rationale: صُحِّح التعبير العربي عن النهي في الاقتباس ليؤدي بصورة طبيعية معنى الكلام بالسوء على صاحب السلطة، مع الحفاظ على عموم اللفظ اليوناني وعدم اختزاله إلى الشتم. كما ضُبط موضع علامة الحاشية لتتصل بالاقتباس الذي تشرح بديله اللفظي. ولم يُغيَّر معنى الجملة الاسمية العربية التي تمثل الحاضر اليوناني ἐστίν.
