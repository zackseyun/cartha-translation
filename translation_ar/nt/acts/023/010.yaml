base_translation:
  language: en
  yaml_path: translation/nt/acts/023/010.yaml
  text: And when a great dispute arose[a], the commander, fearing that Paul might be torn apart by them, ordered the troops to go down, seize him from among them[c][b], and bring him into the barracks.
translation:
  language: ar
  text: ولمّا اشتدّ النزاع[a]، خشي القائد أن يُمزَّق بولس بأيديهم، فأمر الجنود أن ينزلوا وينتزعوه من بينهم ويقتادوه إلى الثكنة[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الخلاف» أو «الاضطراب». فاللفظة اليونانية قد تدل على نزاع داخلي حاد، وقد تدل في سياقات أخرى على فتنة أو عصيان.
    reason: lexical_alternative
  - marker: b
    text: «الثكنة» ترجمة للفظة يونانية يمكن أن تعني حرفيًا «المعسكر»، والمقصود هنا مقرّ الجنود الرومان في أورشليم.
    reason: cultural_note
lexical_decisions:
- source_word: πολλῆς δὲ γινομένης στάσεως
  choice: ولمّا اشتدّ النزاع
  rationale: تنقل العبارة الظرفية معنى نشوء خلاف حاد وتصاعده؛ و«النزاع» يلائم سياق المجلس أكثر من معنى العصيان المدني، بينما يفيد «اشتدّ» قوة πολλῆς مع γινομένης بصياغة عربية طبيعية.
- source_word: φοβηθεὶς
  choice: خاف
  rationale: يبيّن سبب إصدار القائد أمره، وتؤديه العربية بوضوح في فعل ماضٍ متعاقب.
- source_word: ὁ χιλίαρχος
  choice: القائد
  rationale: المقصود ضابط روماني رفيع يقود قوة عسكرية؛ و«القائد» واضح للقارئ المعاصر من غير نقل صوتي غامض.
- source_word: μὴ διασπασθῇ ὁ Παῦλος ὑπ’ αὐτῶν
  choice: أن يمزّقوا بولس
  rationale: يحفظ قوة διασπάω التصويرية واحتمال النتيجة المخوفة بعد μή، مع تحويل المبني للمجهول اليوناني إلى معلوم عربي طبيعي.
- source_word: ἐκέλευσεν
  choice: فأمر
  rationale: ترجمة مباشرة ملائمة للسياق العسكري.
- source_word: τὸ στράτευμα
  choice: الجنود
  rationale: يدل اللفظ على القوة العسكرية بوصفها جماعة؛ و«الجنود» أوضح وأطبع في العربية هنا.
- source_word: καταβὰν
  choice: أن ينزلوا
  rationale: يحفظ اتجاه الحركة من موضع القلعة إلى المجلس في الأسفل، وتنسجم صيغة الجمع مع «الجنود».
- source_word: ἁρπάσαι αὐτὸν ἐκ μέσου αὐτῶν
  choice: وينتزعوه من بينهم
  rationale: «ينتزعوه» ينقل معنى الإخراج السريع بالقوة في ἁρπάζω، و«من بينهم» تقابل ἐκ μέσου αὐτῶν.
- source_word: ἄγειν τε
  choice: ويأتوا به
  rationale: ينقل معنى اقتياده إلى الوجهة المذكورة بصياغة عربية طبيعية.
- source_word: παρεμβολήν
  choice: الثكنة
  rationale: مع أن اللفظ قد يعني «المعسكر»، فهو هنا يشير إلى مقر الجنود الرومان في أورشليم، ولذلك فـ«الثكنة» أدق سياقيًا.
