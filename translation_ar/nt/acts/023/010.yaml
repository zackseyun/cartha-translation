  source_fidelity: 'النص ينقل تسلسل الأحداث ومعاني الأفعال الرئيسة بدقة جيدة: اشتداد النزاع، خوف القائد، أمره القوة بالنزول وانتزاع بولس وإحضاره إلى الثكنة. لكن «أن يمزّقوا بولس» تحوّل البناء المبني للمجهول في اليونانية إلى معلوم من دون تحديد فاعل عربي صريح، وتضعف قليلًا إبراز بولس بوصفه المتعرّض للفعل؛ كما أن «يأتوا به» أوسع وأقل دقة من فعل الاقتياد إلى موضع الاحتجاز.'
