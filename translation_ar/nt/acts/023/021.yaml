source:
  edition: SBLGNT
  text: σὺ οὖν μὴ πεισθῇς αὐτοῖς, ἐνεδρεύουσιν γὰρ αὐτὸν ἐξ αὐτῶν ἄνδρες πλείους τεσσεράκοντα, οἵτινες ἀνεθεμάτισαν ἑαυτοὺς μήτε φαγεῖν μήτε πιεῖν ἕως οὗ ἀνέλωσιν αὐτόν, καὶ νῦν ⸂εἰσιν ἕτοιμοι⸃ προσδεχόμενοι τὴν ἀπὸ σοῦ ἐπαγγελίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/021.yaml
  text: So do not be persuaded by them, for more than forty men from among them are lying in ambush for him, who have bound themselves under a curse neither to eat nor to drink until they have killed him. And now they are ready, waiting for the promise from you.
translation:
  language: ar
  text: فلا تقتنع بكلامهم، لأن أكثر من أربعين رجلًا منهم يكمنون له، وقد ألزموا أنفسهم بلعنة[a] ألا يأكلوا ولا يشربوا حتى يقتلوه. وهم الآن مستعدون، ينتظرون منك الوعد[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «ألزموا أنفسهم بقَسَم»؛ والتعبير اليوناني يتضمن استجلاب اللعنة على أنفسهم إن لم يفوا به.
    reason: lexical_alternative
  - marker: b
    text: أي إنهم ينتظرون موافقتك أو إذنك.
    reason: lexical_alternative
lexical_decisions:
- source_word: πεισθῇς
  choice: تقتنع بكلامهم
  rationale: ينقل صيغة المبني للمجهول ومعنى التأثر بطلبهم، مع إضافة «بكلامهم» لإيضاح المتعلَّق طبيعيًا في العربية من غير تحويل المعنى إلى مجرد السماع أو الطاعة.
- source_word: ἐνεδρεύουσιν
  choice: يكمنون له
  rationale: يحفظ الصورة الحسية للكمين والترصد العدائي، وهو أخص من التعبير العام «يتآمرون عليه».
- source_word: ἐξ αὐτῶν
  choice: منهم
  rationale: يدل بوضوح وإيجاز على أن الرجال خارجون من الجماعة المذكورة.
- source_word: ἄνδρες πλείους τεσσεράκοντα
  choice: أكثر من أربعين رجلًا
  rationale: صياغة عربية طبيعية تحافظ على العدد وصيغة المقارنة.
- source_word: ἀνεθεμάτισαν ἑαυτοὺς
  choice: ألزموا أنفسهم بلعنة
  rationale: يحفظ عنصر الإلزام الذاتي واستجلاب اللعنة عند الإخفاق، بخلاف «أقسموا» التي قد تخفي دلالة اللعنة.
- source_word: μήτε φαγεῖν μήτε πιεῖν
  choice: ألا يأكلوا ولا يشربوا
  rationale: ينقل النفي المزدوج المتعاطف وصيغة الالتزام بوضوح عربي.
- source_word: ἕως οὗ ἀνέλωσιν αὐτόν
  choice: حتى يقتلوه
  rationale: الفعل في السياق يدل على الإهلاك العنيف، و«يقتلوه» يصرح بالمقصد المقصود.
- source_word: εἰσιν ἕτοιμοι
  choice: هم الآن مستعدون
  rationale: ترجمة مباشرة وطبيعية لحال استعدادهم الحاضر.
- source_word: προσδεχόμενοι
  choice: ينتظرون
  rationale: يعبر عن الانتظار المتطلع إلى شيء متوقع، ويحدده المفعول اللاحق.
- source_word: τὴν ἀπὸ σοῦ ἐπαγγελίαν
  choice: منك الوعد
  rationale: يحافظ على المعنى المعجمي الأساسي لـ«الوعد» وعلى كون مصدره القائد، مع بيان المقصود السياقي في الحاشية بدل إدخاله في المتن.
