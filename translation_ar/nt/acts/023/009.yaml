source:
  edition: SBLGNT
  text: ἐγένετο δὲ κραυγὴ μεγάλη, καὶ ἀναστάντες ⸂τινὲς τῶν γραμματέων⸃ τοῦ μέρους τῶν Φαρισαίων διεμάχοντο λέγοντες· Οὐδὲν κακὸν εὑρίσκομεν ἐν τῷ ἀνθρώπῳ τούτῳ· εἰ δὲ πνεῦμα ἐλάλησεν αὐτῷ ἢ ⸀ἄγγελος—
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/009.yaml
  text: Then a great outcry arose[a], and some of the scribes of the party of the Pharisees stood up and contended, saying, “We find nothing wrong in this man[b]. But if a spirit or an angel has spoken to him—”
translation:
  language: ar
  text: 'فحدث صياح عظيم، وقام بعض الكتبة من حزب الفريسيين، وأخذوا يجادلون بشدة قائلين: «لا نجد في هذا الرجل سوءًا. ولكن إن كان قد كلّمه روحٌ[b] أو ملاكٌ—[a]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: تنتهي العبارة في النص اليوناني فجأة من غير ذكر جواب الشرط.
    reason: textual_feature
  - marker: b
    text: يمكن فهم «روح» هنا بمعنى كائن روحي عمومًا. ويرى بعضهم أنها تعني «الروح»، لكن مقابلتها بـ«ملاك» ترجّح المعنى العام في هذا الموضع.
    reason: alternative_reading
lexical_decisions:
- source_word: κραυγὴ μεγάλη
  choice: صياح عظيم
  rationale: ينقل معنى الصراخ أو الجلبة المرتفعة مع المحافظة على تركيب الاسم والصفة في اليونانية.
- source_word: ἀναστάντες
  choice: قام
  rationale: يحافظ على دلالة النهوض الجسدي لأخذ الكلام في المجلس، بصياغة عربية طبيعية.
- source_word: τινὲς τῶν γραμματέων
  choice: بعض الكتبة
  rationale: «الكتبة» هو المقابل المباشر والمألوف في السياق اليهودي، و«بعض» تنقل عدم الشمول.
- source_word: τοῦ μέρους τῶν Φαρισαίων
  choice: من حزب الفريسيين
  rationale: يفيد μέρος هنا الفريق أو الحزب داخل المجلس، و«من» توضّح انتماء هؤلاء الكتبة إليه.
- source_word: διεμάχοντο
  choice: أخذوا يجادلون بشدة
  rationale: «يجادلون بشدة» تنقل قوة المخاصمة، و«أخذوا» مع المضارع تعكس الاستمرار الذي يدل عليه الفعل الناقص اليوناني.
- source_word: Οὐδὲν κακὸν εὑρίσκομεν
  choice: لا نجد في هذا الرجل شرًّا
  rationale: صياغة مباشرة تحافظ على فعل «نجد» وعلى κακόν بمعنى الشر أو الأمر المذموم، من غير إضافة حكم قضائي غير مصرّح به.
- source_word: ἐν τῷ ἀνθρώπῳ τούτῳ
  choice: في هذا الرجل
  rationale: يحافظ على حرف الجر والتعيين المباشر لبولس في السياق.
- source_word: εἰ δὲ
  choice: ولكن إن كان
  rationale: تحافظ على الاستدراك وعلى جملة الشرط غير المكتملة، بدل تحويلها إلى سؤال مكتمل.
- source_word: πνεῦμα
  choice: روحٌ
  rationale: النكرة أنسب هنا بسبب مقابلتها بـ«ملاك»، مع إبقاء مدلول الكلمة العام من غير تعيينها بالروح القدس.
- source_word: ἐλάλησεν αὐτῷ
  choice: قد كلّمه
  rationale: ينقل وقوع الكلام الموجّه إليه، و«قد» تلائم الفعل الماضي المحتمل ذي الصلة بالحجة الحاضرة.
- source_word: ἄγγελος
  choice: ملاكٌ
  rationale: السياق المتعلق بالكائنات الروحية يرجّح الملاك السماوي لا الرسول البشري.
theological_decisions:
- issue: دلالة πνεῦμα في مقابل ἄγγελος
  choice: روحٌ، بمعنى كائن روحي على نحو غير محدد
  alternative: الروح، أي الروح القدس
  rationale: المقابلة بين «روح» و«ملاك» وسياق معتقد الفريسيين يرجّحان المعنى العام، مع عدم فرض هوية محددة لم يذكرها النص.
- issue: الجملة الشرطية المنقطعة في ختام الآية
  choice: الإبقاء على الشرط غير المكتمل ووضع شرطة طويلة
  alternative: 'إكمال المعنى في صورة سؤال: «فماذا لو كان روح أو ملاك قد كلّمه؟»'
  rationale: النص اليوناني ينتهي فجأة بعد جملة الشرط، لذلك تحافظ الصياغة المختارة على الانقطاع والتوتر البلاغي بدل استكمال جواب الشرط تفسيرًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة سردية وقورة. حوفظ على شدة الجدال، وعلى انتماء الكتبة إلى حزب الفريسيين، وعلى النهاية المبتورة في الأصل. وُضع كل رمز حاشية في المتن عند العبارة التي يشرحها.
