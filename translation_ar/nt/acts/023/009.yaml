  to: 'فحدث صياح عظيم، وقام بعض الكتبة من حزب الفريسيين، وأخذوا يجادلون بشدة قائلين: «لا نجد في هذا الرجل سوءًا. ولكن إن كان قد كلّمه روحٌ[b] أو ملاكٌ—[a]»'
