base_translation:
  language: en
  yaml_path: translation/nt/acts/023/027.yaml
  text: This man was seized by the Jews and was about to be killed by them[a], and I came with the troops and rescued him, having learned that he is a Roman.
translation:
  language: ar
  text: قبض اليهود[a] على هذا الرجل، وكانوا على وشك أن يقتلوه، وجئتُ مع الجنود وأنقذتُه، بعد أن علمتُ أنه روماني.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أهل اليهودية». قد يدل اللفظ اليوناني على اليهود من الناحية الإثنية والدينية، أو على سكان اليهودية من الناحية الجغرافية؛ ويُرجَّح هنا أنه يشير إلى الجماعة اليهودية التي عارضت بولس في أورشليم.
    reason: lexical_alternative
lexical_decisions:
- source_word: συλλημφθέντα
  choice: أمسك به
  rationale: يفيد الفعل هنا القبض العدائي على الرجل، من غير أن يوحي بالضرورة بتوقيف قانوني رسمي.
- source_word: Ἰουδαίων
  choice: اليهود
  rationale: اللفظ اليوناني قد يدل على اليهود من الناحية الإثنية والدينية أو على أهل اليهودية جغرافيًا؛ وفي هذا السياق يشير إلى الجماعة اليهودية المعارضة لبولس في أورشليم، مع إثبات البديل في الحاشية.
- source_word: μέλλοντα ἀναιρεῖσθαι
  choice: كانوا على وشك أن يقتلوه
  rationale: ينقل معنى قرب وقوع الفعل، ويعبّر بوضوح عن معنى القتل في هذا السياق. حُوِّل المبني للمجهول إلى صياغة عربية فصيحة طبيعية مع بقاء الفاعل معلومًا من السياق.
- source_word: ἐπιστὰς
  choice: فجئتُ
  rationale: يدل على الحضور أو الوصول للتدخل؛ وتؤدي الفاء في العربية معنى تعاقب الأحداث بسلاسة من غير إضافة مقابلة غير موجودة في الأصل.
- source_word: σὺν τῷ στρατεύματι
  choice: مع الجنود
  rationale: يشير στράτευμα إلى قوة أو فرقة عسكرية، و«الجنود» تعبير عربي واضح لا يحدد حجم الوحدة بما يتجاوز النص.
- source_word: ἐξειλάμην
  choice: وأنقذتُه
  rationale: الفعل المتوسط هنا يعني التخليص من خطر وشيك، و«أنقذته» يلائم سياق محاولة القتل.
- source_word: μαθὼν
  choice: إذ علمتُ
  rationale: تحفظ الصياغة علاقة الحال أو الملابسة التي يحملها اسم الفاعل اليوناني، ولا تعيد ترتيب الادعاء لتسوية توتره مع السرد السابق.
- source_word: Ῥωμαῖός ἐστιν
  choice: أنه روماني
  rationale: ترجمة مباشرة للفظ Ῥωμαῖος؛ وتُبقي دلالة المواطنة الرومانية مفهومة من السياق القانوني من غير زيادتها صراحة في المتن.
theological_decisions:
- issue: العرض التاريخي والبلاغي في رسالة قائد الكتيبة
  choice: نقل ادعاء القائد كما ورد، من غير مواءمته مع التفاصيل الأوسع في أعمال 21–22.
  alternative: إعادة الصياغة بما يزيل التوتر الظاهر بشأن وقت علمه بأن بولس روماني.
  rationale: الآية تورد كلام كلوديوس ليسياس نفسه، وفيه يعرض تصرفه بصورة مواتية له. ينبغي حفظ صياغة النص وتوتره السردي بدل تفسيره أو تسويته داخل الترجمة.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدمت «أمسك به» بدل «اعتقله» لتجنب الإيحاء بإجراء قانوني رسمي، وحُفظ تسلسل الرسالة وادعاؤها من غير إضافة تفسير تاريخي.
