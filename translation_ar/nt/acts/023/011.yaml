  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Τῇ δὲ ἐπιούσῃ νυκτὶ ἐπιστὰς αὐτῷ ὁ κύριος εἶπεν· ⸀Θάρσει, ὡς γὰρ διεμαρτύρω τὰ περὶ ἐμοῦ εἰς Ἰερουσαλὴμ οὕτω σε δεῖ καὶ εἰς Ῥώμην μαρτυρῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/011.yaml
  text: But on the following night[a], the Lord stood by him and said, “Take courage, for just as you have testified about me in Jerusalem[b], so you must also testify in Rome.”
translation:
  language: ar
  text: 'وفي الليلة التالية، وقف الرب إلى جانبه وقال: «تشجَّع[a]، فكما شهدتَ[b] بما يخصني في أورشليم، هكذا يجب أن تشهد أيضًا في روما».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «كن شجاعًا».
    reason: lexical_alternative
  - marker: b
    text: الفعلان المترجمان «شهدتَ» و«تشهد» ينتميان في اليونانية إلى المجموعة اللفظية نفسها الدالة على الشهادة.
    reason: lexical_connection
lexical_decisions:
- source_word: Τῇ δὲ ἐπιούσῃ νυκτί
  choice: وفي الليلة التالية
  rationale: تنقل العبارة زمن الحدث بوصفه الليلة التالية، وتؤدي δέ بواو ربط سردية خفيفة من غير افتعال مقابلة قوية.
- source_word: ἐπιστὰς αὐτῷ
  choice: وقف إلى جانبه
  rationale: يحفظ معنى حضور الرب واقفًا بالقرب من بولس، ويتجنب التفسير الأوسع «ظهر له» الذي لا يصرح به اللفظ نفسه.
- source_word: ὁ κύριος
  choice: الرب
  rationale: المقابل العربي المألوف والدقيق لـ κύριος في هذا السياق، من غير إضافة اسم «يسوع» إلى نص لا يذكره صراحة هنا.
- source_word: Θάρσει
  choice: تشجَّع
  rationale: صيغة أمر عربية طبيعية تنقل الحث على الثبات والشجاعة في هذا الظرف.
- source_word: διεμαρτύρω
  choice: شهدتَ
  rationale: تنقل فعل الشهادة في الماضي وتحافظ، مع «تشهد» لاحقًا، على الصلة اللفظية بين الفعلين اليونانيين.
- source_word: τὰ περὶ ἐμοῦ
  choice: بما يخصني
  rationale: تؤدي معنى «الأمور المتعلقة بي» بعبارة عربية واضحة، من غير حصر مضمون الشهادة في صياغة تفسيرية إضافية.
- source_word: εἰς Ἰερουσαλήμ
  choice: في أورشليم
  rationale: تستعمل العربية حرف المكان الطبيعي لأن الكلام عن شهادة سبق أن أداها بولس هناك، مع أن الأصل يستعمل εἰς استعمالًا كوينِيًّا مرنًا.
- source_word: οὕτω
  choice: هكذا
  rationale: تحافظ على الموازاة الصريحة بين شهادة بولس في أورشليم وشهادته المقبلة في روما.
- source_word: σε δεῖ
  choice: يجب أن
  rationale: تنقل معنى الضرورة بوضوح، من غير توسيعه إلى تعبير صريح عن القدر أو الجبر.
- source_word: καὶ εἰς Ῥώμην μαρτυρῆσαι
  choice: أن تشهد أيضًا في روما
  rationale: تؤدي καί بمعنى الإضافة، وتحافظ على لفظ الشهادة نفسه المستخدم للفعل السابق.
theological_decisions:
- issue: هوية «الرب» في السياق
  choice: الإبقاء على «الرب» كما في النص اليوناني
  alternative: «الرب يسوع»
  rationale: السياق في سفر الأعمال يدل على يسوع القائم، ولا سيما قوله «بما يخصني»، لكن إضافة الاسم صراحة تتجاوز صياغة هذه الآية؛ لذلك تُحفظ دلالة النص من غير توسيع تفسيري.
- issue: دلالة δεῖ على الضرورة
  choice: «يجب أن»
  alternative: «مقدَّر لك أن» أو «لا بد لك أن»
  rationale: ينقل الاختيار ضرورة الشهادة في روما، ويترك أساس هذه الضرورة وتفاصيلها كما يعرضها السياق، من غير تحويلها إلى تقرير صريح عن الجبر أو المصير.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعملت «وقف إلى جانبه» لإبراز الحضور القريب الداعم، و«بما يخصني» لصون اتساع العبارة اليونانية، مع الحفاظ على التوازي بين «شهدتَ» و«تشهد».
