lexical_decisions:
- source_word: τῇ δὲ ἐπαύριον
  choice: وفي اليوم التالي
  rationale: ينقل التعبير الزمني بمعناه المألوف، وتؤدي الواو وظيفة δέ بوصفها انتقالًا سرديًّا خفيفًا من غير مبالغة في معنى الاستدراك.
- source_word: ἐάσαντες
  choice: تركوا
  rationale: يفيد هنا السماح للفرسان بالمضي، وصيغة «تركوا ... يواصلون» عربية طبيعية وتحفظ تقدُّم فعل السماح على الرجوع.
- source_word: τοὺς ἱππεῖς
  choice: الفرسان
  rationale: يدل اللفظ على الجنود الراكبين، و«الفرسان» تعبير عربي واضح وموجز في السياق العسكري.
- source_word: ἀπέρχεσθαι σὺν αὐτῷ
  choice: يواصلون السير معه
  rationale: يوضح أن الفرسان تابعوا الرحلة برفقة بولس بينما رجع سائر الجنود، من غير إضافة وجهة غير مذكورة في النص.
- source_word: ὑπέστρεψαν
  choice: رجعوا
  rationale: ينقل المعنى المباشر للفعل، أي العودة أو الرجوع إلى المكان السابق.
- source_word: εἰς τὴν παρεμβολήν
  choice: إلى الثكنة
  rationale: يمكن أن يدل اللفظ على معسكر أو مقر عسكري؛ وفي هذا السياق يرجح أن المقصود ثكنة القوات الرومانية في أورشليم.
