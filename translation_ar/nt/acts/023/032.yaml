  text: But on the next day[a], after letting the horsemen go on with him, they returned to the barracks.
translation:
  language: ar
  text: وفي اليوم التالي، تركوا الفرسان يواصلون السير معه، ورجعوا إلى الثكنة[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
