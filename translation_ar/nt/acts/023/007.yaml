lexical_decisions:
- source_word: τοῦτο δὲ αὐτοῦ λαλοῦντος
  choice: وبينما كان يقول هذا
  rationale: ينقل تركيب المضاف المطلق مع اسم الفاعل المضارع، فيُظهر أن الخلاف وقع في أثناء كلام بولس، بصياغة عربية طبيعية.
- source_word: ἐγένετο
  choice: وقع
  rationale: مع «خلاف» يفيد بدء حدوثه، و«وقع خلاف» تعبير عربي واضح ومألوف.
- source_word: στάσις
  choice: خلاف
  rationale: تدل الكلمة هنا على نزاع أو شقاق بين فريقين؛ و«خلاف» واضحة من غير أن تبالغ في تصوير الحدث كتمرد أو اضطراب عنيف.
- source_word: τῶν Φαρισαίων καὶ Σαδδουκαίων
  choice: بين الفريسيين والصدوقيين
  rationale: حرف «بين» يبيّن بطبيعية أن الفريقين هما طرفا الخلاف، وهو المقصود من تركيب الإضافة اليوناني في السياق.
- source_word: ἐσχίσθη
  choice: انقسم
  rationale: يحفظ صورة الانشقاق الاجتماعي التي يفيدها الفعل المبني للمجهول، مع أسلوب عربي سلس.
- source_word: τὸ πλῆθος
  choice: الجمع
  rationale: تشير العبارة إلى جماعة الحاضرين المجتمعة، و«الجمع» تحافظ على الدلالة الجماعية من غير أن تحدد هل المقصود مجلس رسمي أم جمهور عام.
