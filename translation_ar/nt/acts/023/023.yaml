  text: Καὶ προσκαλεσάμενός ⸂τινας δύο⸃ τῶν ἑκατονταρχῶν εἶπεν· Ἑτοιμάσατε στρατιώτας διακοσίους ὅπως πορευθῶσιν ἕως Καισαρείας, καὶ ἱππεῖς ἑβδομήκοντα καὶ δεξιολάβους διακοσίους, ἀπὸ τρίτης ὥρας τῆς νυκτός,
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/023.yaml
  text: And calling two of the centurions to him[a], he said, “Prepare two hundred soldiers to go as far as Caesarea, and seventy horsemen and two hundred spearmen[b], at the third hour of the night.”
translation:
  language: ar
  text: 'ثم استدعى اثنين من قادة المئة وقال: «جهِّزا مئتي جندي لكي يذهبوا إلى قيصرية، وسبعين فارسًا ومئتين من حملة الرماح[a]، ابتداءً من الساعة الثالثة من الليل[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «مئتين من حرّاس الجانب الأيمن»؛ فالمعنى الدقيق للمصطلح اليوناني النادر غير مؤكد.
    reason: lexical_alternative
  - marker: b
    text: أي نحو الساعة التاسعة مساءً، إذ كانت «الساعة الثالثة من الليل» تُحسب من حلول الليل.
    reason: cultural_note
lexical_decisions:
- source_word: προσκαλεσάμενός
  choice: استدعى
  rationale: ينقل معنى دعوة شخص إلى الحضور، ويأتي طبيعيًّا في سياق إصدار أمر عسكري.
- source_word: τινας δύο τῶν ἑκατονταρχῶν
  choice: اثنين من قادة المئة
  rationale: العبارة اليونانية تعني ببساطة اثنين من الضباط المعروفين بهذا الرتبة؛ و«قائد المئة» واضح ويحافظ على دلالة الرتبة الرومانية.
- source_word: Ἑτοιμάσατε
  choice: جهِّزا
  rationale: صيغة أمر موجهة إلى الرجلين، وقد روعي المثنى في العربية.
- source_word: στρατιώτας διακοσίους
  choice: مئتي جندي
  rationale: ترجمة مباشرة للعدد وفئة الجنود العامة، مع مراعاة نصب العدد بعد الفعل.
- source_word: ὅπως πορευθῶσιν
  choice: لكي يذهبوا
  rationale: يحفظ معنى الغاية الذي تفيده ὅπως مع صيغة الالتزام.
- source_word: ἕως Καισαρείας
  choice: إلى قيصرية
  rationale: تنقل المقصد المكاني بعبارة عربية طبيعية؛ وἕως هنا يحدد مدى المسير حتى قيصرية.
- source_word: ἱππεῖς ἑβδομήκοντα
  choice: سبعين فارسًا
  rationale: «فارس» لفظ عربي واضح للقوات الراكبة في هذا السياق العسكري.
- source_word: δεξιολάβους διακοσίους
  choice: مئتين من حملة الرماح
  rationale: المصطلح نادر ودلالته الدقيقة مختلف فيها؛ اختير تعبير عسكري مفهوم مع إثبات عدم اليقين والبديل الحرفي في الحاشية.
- source_word: ἀπὸ τρίτης ὥρας τῆς νυκτός
  choice: ابتداءً من الساعة الثالثة من الليل
  rationale: يحافظ على دلالة ἀπό، أي بدء التحرك من ذلك الوقت، وعلى طريقة حساب الساعات القديمة.
