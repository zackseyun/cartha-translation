base_translation:
  language: en
  yaml_path: translation/nt/acts/023/017.yaml
  text: So Paul called one of the centurions and said[a], “Take this young man to the commander, for he has something to report to him.”
translation:
  language: ar
  text: 'فاستدعى بولس واحدًا من قادة المئة وقال: «خُذ هذا الشاب إلى قائد الألف، فإن لديه شيئًا ليبلغه إليه[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ليخبره به». قد يعني الفعل اليوناني الإبلاغ أو الإخبار أو الإعلان؛ واختير «يبلغه» لأن السياق يتعلّق بنقل معلومة عاجلة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: استدعى
  rationale: يفيد الفعل دعوة شخص إلى الحضور، وصيغة اسم الفاعل الماضي تمهّد لفعل القول اللاحق. و«استدعى» طبيعية ودقيقة في هذا السياق.
- source_word: δὲ
  choice: فـ
  rationale: تربط الفاء الحدث بما قبله وتعبّر بسلاسة عن تقدّم السرد دون دلالة على تعارض قوي.
- source_word: ἕνα τῶν ἑκατονταρχῶν
  choice: واحدًا من قادة المئة
  rationale: ἑκατοντάρχης رتبة عسكرية رومانية لقائد مئة تقريبًا؛ والترجمة الوصفية واضحة للقارئ العربي وتحافظ على طابع الرتبة التاريخي.
- source_word: ἔφη
  choice: وقال
  rationale: ترجمة مباشرة وطبيعية لفعل القول الشائع φημί.
- source_word: νεανίαν
  choice: الشاب
  rationale: يدل νεανίας على رجل في مقتبل العمر، و«الشاب» تعبير عربي واضح ومعاصر.
- source_word: ἄπαγε
  choice: خُذ
  rationale: صيغة أمر من ἀπάγω بمعنى اصطحاب شخص أو اقتياده إلى جهة ما؛ و«خُذ» هي الصياغة العربية الطبيعية هنا.
- source_word: πρὸς τὸν χιλίαρχον
  choice: إلى قائد الكتيبة
  rationale: χιλίαρχος هو الضابط الروماني الأعلى المذكور في السياق، وكان يقود وحدة عسكرية كبيرة؛ و«قائد الكتيبة» واضح وأقرب وظيفيًا من النقل الحرفي «قائد الألف».
- source_word: ἔχει γὰρ ἀπαγγεῖλαί τι αὐτῷ
  choice: لأن لديه شيئًا يبلّغه به
  rationale: تركيب ἔχει مع المصدر يدل على أن لديه شيئًا يفعله، وἀπαγγέλλω هنا يعني نقل معلومة أو إبلاغها. تحافظ الصياغة على عموم «شيئًا» وعلى جهة الإبلاغ.
