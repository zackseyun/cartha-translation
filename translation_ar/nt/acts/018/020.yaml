lexical_decisions:
- source_word: ἐρωτώντων
  choice: لما طلبوا
  rationale: اسم الفاعل المضارع في تركيب المضاف المطلق يفيد الملابسة الزمنية، وصياغته جملة زمنية بـ«لما» طبيعية في العربية، و«طلبوا» تلائم كون الكلام طلبًا موجَّهًا إلى بولس.
- source_word: δὲ
  choice: ولكن
  rationale: تفيد انتقالًا مع مقابلة خفيفة بين طلبهم بقاءه وعدم موافقته، من غير جعل التعارض حادًّا.
- source_word: αὐτῶν
  choice: طلبوا منه
  rationale: الضمير يعود في السياق إلى أهل أفسس الذين وجّهوا الطلب إلى بولس؛ وقد صُرِّح بمتعلَّق الطلب في العربية لسلامة العبارة.
- source_word: ἐπὶ πλείονα χρόνον
  choice: وقتًا أطول
  rationale: تحافظ العبارة على معنى المقارنة في πλείονα، وهي صياغة عربية واضحة وطبيعية.
- source_word: μεῖναι
  choice: أن يبقى
  rationale: مصدر مؤول يكمّل فعل الطلب، و«يبقى» أنسب للسياق المتعلق بالإقامة المؤقتة في أثناء السفر.
- source_word: οὐκ ἐπένευσεν
  choice: لم يوافق
  rationale: الفعل يدل على الإذعان أو الموافقة على طلب. «لم يوافق» واضحة وتحافظ على النفي من غير أن تقوّي العبارة إلى «رفض».
