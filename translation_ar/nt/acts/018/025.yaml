  text: οὗτος ἦν κατηχημένος τὴν ὁδὸν τοῦ κυρίου, καὶ ζέων τῷ πνεύματι ἐλάλει καὶ ἐδίδασκεν ἀκριβῶς τὰ περὶ τοῦ ⸀Ἰησοῦ, ἐπιστάμενος μόνον τὸ βάπτισμα Ἰωάννου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/025.yaml
  text: This man had been instructed in the way of the Lord[a], and being fervent in spirit, he was speaking and teaching accurately the things concerning Jesus, knowing only the baptism of John.
translation:
  language: ar
  text: كان هذا الرجل قد تلقّى التعليم في طريق الرب، وكان متّقدًا في الروح[a]، يتكلّم ويعلّم بدقة ما يتعلّق بيسوع، ولا يعرف إلا معمودية يوحنا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «متّقدًا بالروح»؛ فقد تكون الإشارة إلى الروح القدس لا إلى روح أبلّوس نفسه.'
    reason: قراءة بديلة تحفظ الاحتمال القائم في τῷ πνεύματι.
lexical_decisions:
- source_word: κατηχημένος
  choice: قد تلقّى التعليم
  rationale: ينقل معنى التلقين أو التعليم الذي تلقّاه سابقًا وما زال أثره قائمًا، من غير استيراد المعنى الكنسي الاصطلاحي المتأخر لكلمة «التعليم المسيحي».
- source_word: τὴν ὁδὸν τοῦ κυρίου
  choice: طريق الرب
  rationale: يحافظ على التعبير المسيحي المبكر «الطريق» وعلى لقب κύριος بوصفه «الرب».
- source_word: ζέων τῷ πνεύματι
  choice: متّقد الروح
  rationale: ينقل صورة الحرارة والحماسة في ζέων، ويُبقي πνεῦμα محتملًا أن يشير إلى روح أبلّوس أو إلى الروح القدس.
- source_word: ἐλάλει καὶ ἐδίδασκεν
  choice: يتكلّم ويعلّم
  rationale: صيغة المضارع بعد «كان» المفهومة من السياق تعبّر عن الاستمرار في الفعلين الناقصين، مع إبقاء λαλέω بمعناه المباشر «يتكلّم».
- source_word: ἀκριβῶς
  choice: بدقة
  rationale: تدل على صحة التعليم وضبطه، مع بقاء المفارقة السردية بين دقته ومحدودية معرفته.
- source_word: τὰ περὶ τοῦ Ἰησοῦ
  choice: ما يتعلّق بيسوع
  rationale: صياغة عربية طبيعية تحافظ على عموم العبارة من غير تضييق مضمون ما كان يعلّمه.
- source_word: ἐπιστάμενος μόνον τὸ βάπτισμα Ἰωάννου
  choice: وهو لا يعرف إلا معمودية يوحنا
  rationale: ينقل القيد الذي يفيده μόνον بوضوح، ويحافظ على تزامن المعرفة المحدودة مع نشاطه التعليمي من غير فرض دلالة تنازلية صريحة على اسم الفاعل.
theological_decisions:
- issue: مرجع τῷ πνεύματι في عبارة ζέων τῷ πνεύματι
  choice: روح أبلّوس أو حماسته الباطنية، مع إبقاء اللفظ قابلًا للاحتمال
  alternative: الروح القدس
  rationale: لا يحسم النص اليوناني ما إذا كان المقصود روح أبلّوس أم الروح القدس. وصياغة «متّقد الروح» تحفظ الاحتمال، بينما تذكر الحاشية القراءة الأخرى صراحة.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدمت صياغة طبيعية مع المحافظة على مصطلحات النص الأساسية، ووُضعت علامة الحاشية عقب العبارة التي تتعلّق بها مباشرة.
