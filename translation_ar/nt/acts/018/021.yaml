  yaml_path: translation/nt/acts/018/021.yaml
  text: but after taking leave and saying[a], “I will return to you again[b], if God wills,” he set sail from Ephesus.
translation:
  language: ar
  text: 'لكنه ودّعهم وقال[a]: «سأعود إليكم مرة أخرى، إن شاء الله[b]». ثم أبحر من أفسس.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تحذف بعض المخطوطات عبارة: «وقال: سأعود إليكم مرة أخرى، إن شاء الله».'
    reason: textual_variant
  - marker: b
    text: 'أو: «إذا أراد الله».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: لكنه
  rationale: تفيد الاستدراك في مقابل طلبهم السابق أن يمكث مدة أطول، وهذه صياغة عربية طبيعية واضحة.
- source_word: ἀποταξάμενος
  choice: ودّعهم
  rationale: اسم فاعل فعلي في اليونانية يدل على توديعهم قبل الرحيل؛ أُضيف ضمير المفعول الذي يوضحه السياق في العربية.
- source_word: καὶ εἰπών
  choice: وقال
  rationale: يعكس تسلسل الفعلين في النص اليوناني بصياغة عربية سلسة من غير تغيير المعنى.
- source_word: Πάλιν
  choice: مرة أخرى
  rationale: ينقل معنى التكرار بوضوح، مع الإبقاء على إمكان التعبير البديل «من جديد» في الحاشية.
- source_word: ἀνακάμψω
  choice: سأعود
  rationale: فعل مستقبل يدل على الرجوع، وهو الأنسب في سياق وعد بولس بالعودة إليهم.
- source_word: πρὸς ὑμᾶς
  choice: إليكم
  rationale: ينقل اتجاه الحركة الذي تفيده πρός مع ضمير المخاطبين.
- source_word: τοῦ θεοῦ θέλοντος
  choice: إن شاء الله
  rationale: ينقل التركيب الإضافي المطلق الدال على تعليق الخطة على مشيئة الله، وهو تعبير عربي فصيح وطبيعي يذكر الله صراحة.
- source_word: ἀνήχθη
  choice: أبحر
  rationale: للفعل هنا معناه الملاحي الشائع في سياقات السفر، أي الانطلاق في البحر.
- source_word: ἀπὸ τῆς Ἐφέσου
  choice: من أفسس
  rationale: تعبير مباشر عن مكان الانطلاق، مع اعتماد الاسم العربي المتداول للمدينة.
theological_decisions:
- issue: تعليق خطة بولس للسفر على مشيئة الله
  choice: إن شاء الله
  alternative: إذا أراد الله
  rationale: يحافظ على الإسناد الصريح إلى الله وعلى كون العودة مرهونة بمشيئته، من غير استبدال «الرب» بـ«الله» أو تخفيف دلالة الشرط.
translation_notes:
  register: لغة عربية فصحى حديثة واضحة وكريمة النبرة. فُكَّ التركيب القائم على اسمَي الفاعل اليونانيين إلى فعلين متعاقبين طبيعيين في العربية، مع الحفاظ على الترتيب، وعلى المعنى الملاحي، وعلى تعليق الخطة بمشيئة الله.
