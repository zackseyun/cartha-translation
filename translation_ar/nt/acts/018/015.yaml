  text: εἰ δὲ ⸀ζητήματά ἐστιν περὶ λόγου καὶ ὀνομάτων καὶ νόμου τοῦ καθ’ ὑμᾶς, ὄψεσθε αὐτοί· ⸀κριτὴς ἐγὼ τούτων οὐ βούλομαι εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/015.yaml
  text: But if these are questions about a word and names and your own law[a], you yourselves will see to it; I do not want to be a judge of these things.
translation:
  language: ar
  text: ولكن إن كانت المسائل تتعلّق بكلمةٍ[a] وأسماءٍ وشريعتكم أنتم، فتولَّوا أنتم النظر فيها؛ أما أنا فلا أريد أن أكون قاضيًا في هذه الأمور.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بقولٍ» أو «برسالةٍ» أو «بتعليمٍ». فاللفظة اليونانية واسعة الدلالة، وقد تشير إلى تعليم متنازع عليه أو إلى مصطلح بعينه.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητήματά
  choice: المسائل
  rationale: تدل الكلمة على قضايا موضع بحث أو نزاع. و«المسائل» تحافظ على النبرة الإجرائية من غير أن تفترض بالضرورة خصومة حادة.
- source_word: περὶ λόγου
  choice: تتعلّق بكلمةٍ
  rationale: لفظة λόγος واسعة الدلالة، وقد تشير هنا إلى قول أو رسالة أو تعليم. أبقت «كلمة» الاحتمال مفتوحًا بدل حصر المعنى في العقيدة أو التعليم.
- source_word: ὀνομάτων
  choice: وأسماءٍ
  rationale: ترجمة مباشرة تحفظ غموض المرجع، وقد تشمل أسماء أو ألقابًا أو تسميات كانت موضع النزاع.
- source_word: νόμου τοῦ καθ’ ὑμᾶς
  choice: وشريعتكم أنتم
  rationale: تنقل كون الشريعة خاصة بالمخاطَبين في نظر غاليون، وتُظهر نبرة إبعاده القضية عن الاختصاص الروماني.
- source_word: ὄψεσθε αὐτοί
  choice: فتولَّوا أنتم النظر فيها
  rationale: صيغة المستقبل الوسطى تُستعمل اصطلاحيًا بمعنى الاهتمام بالأمر أو معالجته، مع إبراز توكيد αὐτοί بواسطة «أنتم».
- source_word: κριτὴς
  choice: قاضيًا
  rationale: تلائم السياق القضائي وتعبر مباشرة عن الدور الذي يرفض غاليون الاضطلاع به.
- source_word: τούτων
  choice: في هذه الأمور
  rationale: تعيد الإشارة إلى المسائل المذكورة سابقًا، بصياغة عربية طبيعية واسعة الدلالة.
- source_word: οὐ βούλομαι εἶναι
  choice: فلا أريد أن أكون
  rationale: تنقل معنى الإرادة أو الاستعداد من غير تشديده إلى صيغة رفض قانوني رسمي.
theological_decisions:
- issue: مدى دلالة λόγος في رفض غاليون النظر في القضية
  choice: كلمة
  alternative: قول، أو رسالة، أو تعليم
  rationale: لا يحدد النص هل المقصود مصطلحًا بعينه أم رسالة أو تعليمًا متنازعًا عليه؛ لذلك تحافظ الترجمة على اتساع اللفظة ولا تفرض مضمونًا لاهوتيًا أضيق.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «شريعتكم» بدل «ناموسكم» لوضوحه للقارئ العام، وحُفظت نبرة غاليون التي تبعد النزاع عن اختصاصه. وُضع مؤشر الحاشية بعد العبارة التي تشمل موضع الغموض المعجمي.
