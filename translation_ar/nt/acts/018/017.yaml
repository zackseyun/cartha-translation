  text: ἐπιλαβόμενοι δὲ ⸀πάντες Σωσθένην τὸν ἀρχισυνάγωγον ἔτυπτον ἔμπροσθεν τοῦ βήματος· καὶ οὐδὲν τούτων τῷ Γαλλίωνι ⸀ἔμελεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/017.yaml
  text: Then they all seized Sosthenes[a], the synagogue ruler, and beat him in front of the tribunal. But Gallio paid no attention to these things.
translation:
  language: ar
  text: فأمسكوا جميعًا بسوستانيس[a]، رئيس المجمع، وأخذوا يضربونه أمام منصة القضاء. ولم يبالِ غاليون بشيء من ذلك.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ بعض المخطوطات: «فأمسك جميع اليونانيين بسوستانيس»، بدلًا من «فأمسكوا جميعًا بسوستانيس». أما النص الأقدم فهو أقصر ولا يحدد هوية الجماعة.'
    reason: textual_variant
lexical_decisions:
- source_word: ἐπιλαβόμενοι
  choice: أمسكوا بـ
  rationale: يفيد الفعل الأخذ بشخص أو القبض عليه، والسياق العدائي اللاحق يرجّح «أمسكوا بـ» بصياغة عربية طبيعية واضحة.
- source_word: πάντες
  choice: جميعًا
  rationale: يحفظ معنى الشمول، مع إبقاء هوية الجماعة غير مصرّح بها كما في النص اليوناني.
- source_word: ἀρχισυνάγωγον
  choice: رئيس المجمع
  rationale: يدل اللفظ على المسؤول القيادي في المجمع اليهودي، و«رئيس المجمع» تعبير عربي واضح ومألوف.
- source_word: ἔτυπτον
  choice: أخذوا يضربونه
  rationale: صيغة الماضي الناقص اليونانية تصوّر الضرب بوصفه فعلًا جاريًا أو متكررًا؛ ويؤدي التركيب العربي هذا الجانب بوضوح.
- source_word: ἔμπροσθεν τοῦ βήματος
  choice: أمام منصة القضاء
  rationale: يشير βῆμα هنا إلى المنصة الرسمية التي يُمارس منها القضاء، لا إلى مقعد عادي؛ و«منصة القضاء» تنقل المشهد القانوني بوضوح.
- source_word: οὐδὲν τούτων ... ἔμελεν
  choice: لم يبالِ ... بشيء من ذلك
  rationale: تعبير عربي طبيعي ينقل معنى أن ما حدث لم يكن موضع اهتمام غاليون، من غير إضافة حكم على دوافعه.
- source_word: δέ
  choice: فـ
  rationale: تصل الفاء الحدث بما قبله وتؤدي حركة السرد بإيجاز وطبيعية.
- source_word: καί
  choice: و
  rationale: الأصل أداة عطف، والعربية تستطيع إظهار المفارقة من مضمون الجملتين دون الحاجة إلى تقويتها بأداة استدراك.
theological_decisions:
- issue: هوية المشار إليهم بكلمة πάντες («جميعًا»)
  choice: تُركت هويتهم غير محددة في المتن.
  alternative: جميع اليونانيين؛ أو جميع اليهود
  rationale: النص اليوناني المعتمد يقول πάντες بلا اسم صريح للجماعة. وتحديدهم باليونانيين أو اليهود يحسم ما أبقاه النص غامضًا؛ لذلك حُفظ الغموض، مع بيان القراءة النصية الأطول في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُخدم «أخذوا يضربونه» لإبراز استمرارية الماضي الناقص، و«منصة القضاء» لتوضيح الدلالة الرسمية القانونية، مع الحفاظ على غموض فاعل «جميعًا».
