  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: διότι ἐγώ εἰμι μετὰ σοῦ καὶ οὐδεὶς ἐπιθήσεταί σοι τοῦ κακῶσαί σε, διότι λαός ἐστί μοι πολὺς ἐν τῇ πόλει ταύτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/010.yaml
  text: because I am with you[a], and no one will attack you to harm you[b], because I have many people in this city.
translation:
  language: ar
  text: لأني أنا معك، ولن يهاجمك أحد ليؤذيك[a]، لأن لي شعبًا كثيرًا في هذه المدينة[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ولن يمدّ أحد يده عليك ليؤذيك».'
    reason: lexical_alternative
  - marker: b
    text: يُرجَّح أن عبارة «لي شعب كثير في هذه المدينة» تشير إلى كثيرين في كورنثوس يخصّون الرب، ومنهم من سيؤمنون لاحقًا.
    reason: cross_reference
lexical_decisions:
- source_word: διότι
  choice: لأن
  rationale: تحافظ على معنى التعليل في الموضعين، وتأتي عربيةً واضحة وطبيعية.
- source_word: ἐγώ εἰμι μετὰ σοῦ
  choice: أنا معك
  rationale: تحفظ تأكيد الضمير الصريح ἐγώ من غير تكلّف، وتنقل وعد الحضور مباشرةً.
- source_word: οὐδεὶς
  choice: أحد
  rationale: 'مع أداة النفي «لن» يؤدي المعنى الطبيعي: لا أحد.'
- source_word: ἐπιθήσεταί σοι
  choice: يهاجمك
  rationale: ينقل معنى الإقدام العدائي على بولس في هذا السياق، مع إبقاء الصياغة البديلة الحرفية الأقرب في الحاشية.
- source_word: τοῦ κακῶσαί σε
  choice: ليؤذيك
  rationale: ينقل غرض الفعل العدائي بصياغة عربية موجزة، ويشمل الضرر الجسدي وغيره.
- source_word: λαός
  choice: شعبًا
  rationale: يحفظ الاسم الجمعي المفرد ودلالته المحتملة على جماعة تخص المتكلم، بدل اختزاله إلى مجرد عدد من الأفراد.
- source_word: ἐστί μοι
  choice: لي
  rationale: صياغة عربية طبيعية تفيد الملك أو الاختصاص، وتقابل تركيب الكينونة مع ضمير المتكلم في حالة المجرور.
- source_word: πολὺς
  choice: كثيرًا
  rationale: 'صفة كمية توافق «شعبًا» وتحفظ صورة الأصل: شعب كثير.'
- source_word: ἐν τῇ πόλει ταύτῃ
  choice: في هذه المدينة
  rationale: ترجمة مباشرة وطبيعية، وتناسب الإشارة إلى كورنثوس بوصفها مدينة.
theological_decisions:
- issue: المقصود بقول الرب «لي شعب كثير في هذه المدينة»
  choice: 'أُبقيت العبارة بصورتها الجماعية المفتوحة: «لي شعب كثير»، بما يسمح بأن تشير إلى من يخصون الرب في كورنثوس، ومنهم من سيؤمنون لاحقًا.'
  alternative: قد تُفهم على أنها تشير فقط إلى أناس موجودين بالفعل ومؤيدين لبولس، أو تُصاغ «لي أناس كثيرون» بما يضعف الدلالة الجماعية لكلمة λαός.
  rationale: سياق سفر الأعمال يجعل العبارة أساسًا لاستمرار بولس في الكلام، لكن النص لا يشرح صراحةً كيفية انتماء هؤلاء إلى الرب أو توقيته؛ لذلك تحافظ الترجمة على التوتر اللاهوتي ولا تحسمه داخل المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. أُثبت الضمير «أنا» لإظهار تأكيد الأصل، واستُخدمت «شعبًا كثيرًا» للمحافظة على الصورة الجماعية والدلالة اللاهوتية المحتملة في λαός. وُضعت علامتا الحاشيتين عند العبارتين اللتين تفسرهما كل حاشية.
