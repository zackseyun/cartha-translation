  yaml_path: translation/nt/acts/018/002.yaml
  text: And he found a Jew named Aquila[a], a native of Pontus, who had recently come from Italy with Priscilla his wife because Claudius had ordered all the Jews to leave Rome; and he went to them.
translation:
  language: ar
  text: فوجد يهوديًا اسمه أكيلا، من مواليد بنطس، كان قد قدم حديثًا من إيطاليا مع زوجته بريسكلا، لأن كلوديوس كان قد أمر جميع اليهود بمغادرة روما[a]؛ فذهب إليهما.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بأن يُطرَد جميع اليهود من روما». يتحدث اليوناني حرفيًا عن انفصالهم عن روما، أما المتن فيستخدم التعبير العربي الطبيعي «مغادرة روما».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρών
  choice: فوجد
  rationale: اسم الفاعل الأوريستي يمهّد للفعل التالي في تسلسل السرد، و«وجد» ينقل معناه المباشر بوضوح.
- source_word: τινα Ἰουδαῖον
  choice: يهوديًا
  rationale: تشير العبارة إلى رجل بعينه من حيث هويته اليهودية، والتنـكير في العربية يؤدي معنى τις طبيعيًا.
- source_word: ὀνόματι Ἀκύλαν
  choice: اسمه أكيلا
  rationale: صياغة عربية طبيعية ومباشرة للتعبير الاصطلاحي الذي يقدّم اسم الشخص.
- source_word: Ποντικὸν τῷ γένει
  choice: من مواليد بنطس
  rationale: تفيد العبارة الأصل أو المولد الجغرافي؛ وهذه الصياغة واضحة ولا توحي بمجرد الإقامة.
- source_word: προσφάτως ἐληλυθότα ἀπὸ τῆς Ἰταλίας
  choice: كان قد قدم حديثًا من إيطاليا
  rationale: تحفظ الصياغة دلالة اسم الفاعل التام على حدث سابق ذي صلة بالحال وقت السرد.
- source_word: καὶ Πρίσκιλλαν γυναῖκα αὐτοῦ
  choice: مع زوجته بريسكلا
  rationale: تفيد «مع» طبيعيًا أن بريسكلا رافقته في القدوم من إيطاليا، مع حفظ تعريفها بأنها زوجته.
- source_word: διὰ τὸ διατεταχέναι Κλαύδιον
  choice: لأن كلوديوس كان قد أمر
  rationale: تفيد διά مع المصدر المعرّف السببية، ويشير الفعل هنا إلى أمر رسمي صادر عن الإمبراطور.
- source_word: χωρίζεσθαι πάντας τοὺς Ἰουδαίους ἀπὸ τῆς Ῥώμης
  choice: جميع اليهود بمغادرة روما
  rationale: «مغادرة روما» عربية طبيعية تنقل نتيجة الانفصال عنها، من غير أن تقوّي النص إلى تصريح صريح بالطرد.
- source_word: προσῆλθεν αὐτοῖς
  choice: فذهب إليهما
  rationale: يناسب حركة السرد، والمثنى العربي يوضح أن المرجع هو أكيلا وبريسكلا.
theological_decisions:
- issue: دلالة Ἰουδαῖον / Ἰουδαίους
  choice: يهودي / اليهود
  alternative: يهوذاوي / اليهوذاويون
  rationale: السياق يتحدث عن الشعب اليهودي المقيم في روما، لا عن سكان إقليم اليهودية وحده؛ لذلك فالصياغة المختارة أدق في العربية.
- issue: قوة معنى χωρίζεσθαι في الأمر الإمبراطوري
  choice: مغادرة روما
  alternative: الطرد من روما
  rationale: الفعل اليوناني يتحدث حرفيًا عن الانفصال عن روما، أما «الطرد» فيصرّح بدرجة من الإكراه يفهمها السياق لكنها أقوى من اللفظ نفسه؛ لذا حُفظت في الحاشية.
