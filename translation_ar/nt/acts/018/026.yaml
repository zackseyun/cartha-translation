base_translation:
  language: en
  yaml_path: translation/nt/acts/018/026.yaml
  text: And he began to speak boldly in the synagogue. But when Priscilla and Aquila heard him[a], they took him aside and explained the way of God to him more accurately.
translation:
  language: ar
  text: وبدأ يتكلم بجرأة في المجمع. فلما سمعه بريسكلا وأكيلا، أخذاه معهما[a] وشرحا له طريق الله بمزيد من الدقة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أخذاه جانبًا»، أو: «رحّبا به». قد يدل الفعل اليوناني على أخذ شخص مع المرء أو ضمّه إليه أو استقباله؛ ويوحي السياق بشرحٍ في لقاء غير علني، من غير أن يحدد ذلك صراحة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός τε ἤρξατο
  choice: وبدأ
  rationale: يعود اسم الإشارة إلى أبلوس في السياق السابق، وفي العربية الطبيعية يكفي الضمير المستتر. وتنقل الواو قوة الربط الخفيفة، ويحفظ «بدأ» معنى ἤρξατο.
- source_word: παρρησιάζεσθαι
  choice: يتكلم بجرأة
  rationale: يفيد الفعل الكلام العلني الصريح الواثق؛ وهذه صياغة عربية واضحة تحفظ معنى الجرأة دون زيادة نوع مضمون الكلام.
- source_word: ἐν τῇ συναγωγῇ
  choice: في المجمع
  rationale: «المجمع» هو المقابل العربي المألوف والدقيق لموضع اجتماع اليهود.
- source_word: ἀκούσαντες δὲ αὐτοῦ
  choice: فلما سمعه
  rationale: يؤدي التركيب الزمني معنى اسم الفاعل اليوناني، وتعبّر الفاء عن الانتقال السردي الخفيف الذي تؤديه δέ.
- source_word: Πρίσκιλλα καὶ Ἀκύλας
  choice: بريسكلا وأكيلا
  rationale: نقل صوتي عربي واضح للاسمين بحسب الصيغة الواردة في النص اليوناني، مع إبقاء بريسكلا قبل أكيلا كما في المصدر.
- source_word: προσελάβοντο αὐτὸν
  choice: أخذاه إليهما
  rationale: يحفظ هذا التعبير معنى ضمّه إليهما أو أخذه معهما، ويلائم ما تلاه من شرح خاص، من غير أن يحسم هل المقصود التنحي به جانبًا أم استقباله في صحبتهما أو بيتهما.
- source_word: ἀκριβέστερον
  choice: بدقة أكبر
  rationale: يحفظ صيغة المقارنة ويدل على زيادة الضبط والدقة قياسًا إلى معرفة أبلوس السابقة.
- source_word: ἐξέθεντο
  choice: شرحا
  rationale: الفعل في هذا السياق يعني عرض الأمر وبيانه؛ و«شرحا» تعبير عربي طبيعي واضح.
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: طريق الله
  rationale: يحافظ على التعبير اليوناني الواسع بوصفه طريق الله، دون قصره صراحة على التعليم الأخلاقي أو جعله مصطلحًا عقائديًا أكثر تحديدًا مما يقوله النص.
theological_decisions:
- issue: طبيعة تصرف بريسكلا وأكيلا تجاه أبلوس
  choice: أخذاه إليهما من أجل شرح أوفى
  alternative: أخذاه جانبًا، أو أخذاه معهما، أو رحّبا به
  rationale: يتسع προσελάβοντο لمعاني الأخذ إلى النفس والاستقبال والاصطحاب. والسياق يرجّح لقاءً غير علني للتعليم، لكن المتن لا يحدد المكان ولا يصرح بتنحيته جانبًا؛ لذلك حُفظ قدر من الغموض مع إيضاح البدائل في الحاشية.
- issue: دلالة «طريق الله»
  choice: الإبقاء على التعبير الواسع «طريق الله»
  alternative: رسالة الخلاص المسيحية كاملة، أو سبيل الله الأخلاقي عمومًا
  rationale: يرجح السياق اتصاله بالرسالة المسيحية التي كانت معرفة أبلوس بها غير مكتملة، لكن العبارة نفسها لا تفصل مضمونها؛ لذلك لم يُضف تحديد عقائدي غير مصرح به.
translation_notes:
  register: لغة عربية فصحى حديثة واضحة ووقورة. استُعمل المثنى في «أخذاه» و«شرحا» بما يلائم الفاعلين، وحُفظ ترتيب الاسمين وصيغة المقارنة والغموض المعجمي في فعل الاستقبال أو الاصطحاب.
