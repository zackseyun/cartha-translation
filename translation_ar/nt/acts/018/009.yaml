  text: εἶπεν δὲ ὁ κύριος ⸂ἐν νυκτὶ δι’ ὁράματος⸃ τῷ Παύλῳ· Μὴ φοβοῦ, ἀλλὰ λάλει καὶ μὴ σιωπήσῃς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/009.yaml
  text: And the Lord said to Paul in the night through a vision[a], “Do not be afraid, but keep speaking and do not be silent,”
translation:
  language: ar
  text: 'وقال الرب لبولس ليلًا بواسطة رؤيا[a]: «لا تخف، بل واصل الكلام ولا تصمت،»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو «في رؤيا». يقول التعبير اليوناني حرفيًا: «بواسطة رؤيا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ κύριος
  choice: الرب
  rationale: يحافظ على اللقب الوارد في النص اليوناني من غير إضافة «يسوع»، مع أن السياق في أعمال الرسل يرجّح الإشارة إلى يسوع القائم.
- source_word: ἐν νυκτὶ
  choice: ليلًا
  rationale: تعبير عربي فصيح وطبيعي يؤدي الدلالة الزمنية بوضوح.
- source_word: δι’ ὁράματος
  choice: بواسطة رؤيا
  rationale: يعكس معنى الوسيلة في διά مع المضاف إليه، مع إثبات البديل العربي الأكثر سلاسة في الحاشية.
- source_word: Μὴ φοβοῦ
  choice: لا تخف
  rationale: صيغة نهي عربية طبيعية ومباشرة تنقل معنى الأمر اليوناني.
- source_word: ἀλλὰ λάλει
  choice: بل واصل الكلام
  rationale: تنقل «واصل» دلالة الاستمرار في صيغة الأمر الحاضر λάλει، و«بل» تلائم الاستدراك بعد النهي.
- source_word: καὶ μὴ σιωπήσῃς
  choice: ولا تصمت
  rationale: صياغة موجزة وطبيعية تحفظ النهي المقترن بالأمر السابق من غير تحميل الجانب الفعلي أكثر مما يحتمل.
theological_decisions:
- issue: مرجع لقب «الرب»
  choice: الإبقاء على «الرب» كما في اليونانية
  alternative: الرب يسوع
  rationale: يرجّح سياق أعمال الرسل أن المتكلم هو يسوع القائم، لكن النص يقول ὁ κύριος فقط؛ لذلك لا تُضاف هوية صريحة لم يذكرها النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «ليلًا» لطبيعته، و«واصل الكلام» لإظهار الاستمرار، مع إبقاء لقب «الرب» دون تفسير زائد.
