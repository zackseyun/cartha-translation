  text: μέλλοντος δὲ τοῦ Παύλου ἀνοίγειν τὸ στόμα εἶπεν ὁ Γαλλίων πρὸς τοὺς Ἰουδαίους· Εἰ ⸀μὲν ἦν ἀδίκημά τι ἢ ῥᾳδιούργημα πονηρόν, ὦ Ἰουδαῖοι, κατὰ λόγον ἂν ἀνεσχόμην ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/014.yaml
  text: But as Paul was about to open his mouth[a], Gallio said to the Jews, “If it were some wrongdoing or a serious crime, O Jews[c][b], I would reasonably put up with you.
translation:
  language: ar
  text: 'وبينما كان بولس على وشك أن يفتح فمه[a]، قال غاليون لليهود: «لو كان الأمر مخالفةً ما أو عملًا إجراميًا شريرًا[b]، أيها اليهود، لكان من المعقول أن أحتملكم[c].»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أن يتكلم». اليونانية تقول حرفيًا «أن يفتح فمه»، وهو تعبير يعني البدء في الكلام.
    reason: lexical_alternative
  - marker: b
    text: يمكن أيضًا ترجمتها «جريمة شريرة» أو «فعل إجرامي خبيث». تجمع العبارة اليونانية بين لفظ يدل على السلوك الإجرامي وصفة تعني «شرير» أو «رديء».
    reason: lexical_alternative
  - marker: c
    text: أو «لأصغيت إليكم بصبر». الفعل يعني الاحتمال أو الصبر على شخص؛ وفي هذا السياق يشير إلى قبوله سماع شكواهم لو كانت تتعلق بمخالفة فعلية أو جريمة.
    reason: lexical_alternative
lexical_decisions:
- source_word: μέλλοντος δὲ τοῦ Παύλου ἀνοίγειν τὸ στόμα
  choice: وبينما كان بولس على وشك أن يفتح فمه
  rationale: تنقل صيغة الإضافة المطلقة مع μέλλω معنى قرب وقوع الفعل، وتحافظ عبارة «يفتح فمه» على الصورة الاصطلاحية اليونانية مع وضوح معناها العربي.
- source_word: δὲ
  choice: وبينما
  rationale: أُدمجت أداة الانتقال والمقابلة الخفيفة في بناء «وبينما»، الذي يبرز أن غاليون تكلم قبل أن يبدأ بولس كلامه.
- source_word: Γαλλίων
  choice: غاليون
  rationale: نقل صوتي للاسم اليوناني بصيغة عربية واضحة.
- source_word: πρὸς τοὺς Ἰουδαίους
  choice: لليهود
  rationale: ينقل جهة القول دون إضافة وصف تفسيري مثل «المشتكين» غير الموجود صراحة في اليونانية.
- source_word: Εἰ μὲν ἦν
  choice: لو كان الأمر يتعلق
  rationale: صياغة عربية طبيعية لشرط غير واقع في نظر المتكلم، مع توضيح تعلق القضية بنوع التهمة من غير حسم زائد.
- source_word: ἀδίκημά τι
  choice: شيء من الظلم
  rationale: يحافظ على سعة اللفظ، الذي قد يدل على ظلم أو مخالفة قانونية، من غير تضييقه إلى جريمة محددة.
- source_word: ῥᾳδιούργημα πονηρόν
  choice: جريمة شريرة
  rationale: تنقل البعد الجنائي في ῥᾳδιούργημα والوصف الأخلاقي الصريح في πονηρόν، بدل اختزالهما في مجرد درجة الخطورة.
- source_word: ὦ Ἰουδαῖοι
  choice: أيها اليهود
  rationale: المقابل العربي الطبيعي والفصيح لأداة النداء مع المنادى.
- source_word: κατὰ λόγον
  choice: لكان من المعقول
  rationale: ينقل معنى التصرف الموافق للمنطق أو المسوَّغ بسبب وجيه.
- source_word: ἀνεσχόμην ὑμῶν
  choice: أن أحتملكم
  rationale: يحفظ نبرة غاليون المتبرمة في فعل «أحتمل»، ولا يضيف صراحة معنى سماع الدعوى، وإن كان السياق يدل عليه.
